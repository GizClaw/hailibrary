  chapters:
    - id: ch01
      title: Heidi's Plan
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter reached school on time the next day. He had brought his dinner, as all the children from far away did. At noon, they climbed up and sat on the tables, planted their feet firmly on the benches, and spread their meals across their knees. That was how they ate, while the children who lived in Dorfli went home for dinner. Everyone was free to do as they pleased until one o'clock. Then lessons began again. On every day that Peter actually attended school and finished his lessons, he went over to Grandfather's house to see Heidi.
        - id: ch01-b02
          speaker: narrator
          text: That day, the moment he entered the big room, Heidi ran over and caught hold of him. She had been waiting for him.
        - id: ch01-b03
          speaker: heidi
          text: Peter, I've got an idea!
        - id: ch01-b04
          speaker: peter
          text: What kind of idea?
        - id: ch01-b05
          speaker: heidi
          text: You have to learn how to read.
        - id: ch01-b06
          speaker: peter
          text: I already learned.
        - id: ch01-b07
          speaker: heidi
          text: Yes, but I mean really learn, so you can use it.
        - id: ch01-b08
          speaker: peter
          text: I never will.
        - id: ch01-b09
          speaker: heidi
          text: Nobody believes you can't learn. I don't believe it anymore either. Grandmamma in Frankfurt told me a long time ago that it wasn't true, and she said I mustn't believe you.
        - id: ch01-b10
          speaker: narrator
          text: This news took Peter aback. Grandmamma in Frankfurt had seen through the excuse he had always relied on, and now Heidi had stopped believing it too.
        - id: ch01-b11
          speaker: heidi
          text: I'll teach you. I know how, and we're starting right away. Then you can read one or two hymns to Grandmother every day.
        - id: ch01-b12
          speaker: peter
          text: I don't care about doing that.
        - id: ch01-b13
          speaker: narrator
          text: His hard-hearted refusal made Heidi angry. Reading to Grandmother was right and kind, and she cared about it with all her heart. Her eyes flashed as she faced Peter and warned him what would happen if he would not learn.
        - id: ch01-b14
          speaker: heidi
          text: If you won't learn when I tell you to, just listen. Your mother has talked about sending you to Frankfurt so you can learn all sorts of things. Clara showed me the huge school there when we drove past it. Boys go there, and even grown men keep taking lessons. I saw them myself. You won't have just one kind teacher like ours. There are ever so many teachers, all there at once. They dress in black as if they're going to church, and their black hats are this high!
        - id: ch01-b15
          speaker: narrator
          text: Heidi held out her hand to show how high the hats rose from the floor. A cold shiver ran down Peter's back, but she was only getting started.
        - id: ch01-b16
          speaker: heidi
          text: You'll have to stand among all those gentlemen. When your turn comes, you won't be able to read, and you'll spell everything wrong. Then they'll laugh at you. They'll be worse than Tinette, and you should have seen how scornful she could look!
        - id: ch01-b17
          speaker: peter
          text: Fine. I'll learn.
          emotion: fearful
        - id: ch01-b18
          speaker: narrator
          text: He sounded both unhappy and cross, but Heidi softened at once.
        - id: ch01-b19
          speaker: heidi
          text: Good! Then we'll start now.
          emotion: happy
        - id: ch01-b20
          speaker: narrator
          text: She pulled Peter to the table and hurried to fetch her books. Among Clara's presents was an ABC book filled with rhymes. The night before, as she lay in bed, Heidi had decided it would be perfect for teaching him. Now they bent their heads over it together, and the lesson began.
    - id: ch02
      title: The Threatening Alphabet
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Heidi made Peter spell the first sentence two or three times. She wanted him to say it correctly and smoothly, but he could not manage it.
        - id: ch02-b02
          speaker: heidi
          text: You still can't get it right. I'll read it once for you. It'll be easier when you know how it's supposed to go. A, B, C must be learned today, or the judge will call you up to pay.
        - id: ch02-b03
          speaker: peter
          text: Well, I'm not going.
        - id: ch02-b04
          speaker: heidi
          text: Going where?
        - id: ch02-b05
          speaker: peter
          text: To see the judge.
        - id: ch02-b06
          speaker: heidi
          text: Then hurry up and learn those three letters. If you do, you won't have to go.
        - id: ch02-b07
          speaker: narrator
          text: Peter went back to his task. He repeated those three letters again and again, saying them with such determination that Heidi finally decided he must know them.
        - id: ch02-b08
          speaker: heidi
          text: You must know those three by now. Wait. I'll read some of the next verses too, so you'll know what's coming.
        - id: ch02-b09
          speaker: narrator
          text: The first rhyme had certainly made an impression, and Heidi meant to prepare him for the lessons ahead. In a clear, slow voice, she began to read.
        - id: ch02-b10
          speaker: heidi
          text: D, E, F, G must run with ease, or something will follow that does not please. If H, I, J, K are now forgot, disgrace is yours upon the spot. Then L and M must follow at once, or you'll be punished for being a dunce. If you knew what waited for you, you'd hurry to learn N, O, P, Q. Now R, S, T, be quick about, or worse will follow, there's little doubt.
        - id: ch02-b11
          speaker: narrator
          text: Heidi stopped. Peter had gone so still that she turned to see what he was doing. All those secret threats and hints of dreadful punishments had left him frozen in his chair. He stared at her with terrified eyes, and her kind heart gave way at once.
        - id: ch02-b12
          speaker: heidi
          text: You don't need to be scared, Peter. Come here every evening. If you work the way you did today, you'll learn all the letters, and none of those things will happen. But you have to come regularly, not only now and then like you do at school. Even if it snows, it won't hurt you.
          emotion: calm
        - id: ch02-b13
          speaker: narrator
          text: Peter promised. His fright had made him meek and willing. The day's lesson was over, so he went home.
    - id: ch03
      title: From U to Z
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After that, Peter followed Heidi's orders exactly. Every evening he arrived without fail and worked hard on the next letters. He took each warning in the book completely to heart. Grandfather often sat in the room, comfortably smoking his pipe while the lesson went on. Now and then, his face twitched as if a sudden fit of laughter were trying to overtake him. After the tremendous effort of a lesson, Peter was often invited to stay for supper. That reward more than made up for all the dread the day's rhyme had put him through.
        - id: ch03-b02
          speaker: narrator
          text: Winter passed that way. Peter truly made progress with his letters, though every new verse brought another terrible struggle. At last, he reached U, and Heidi read the warning aloud.
        - id: ch03-b03
          speaker: heidi
          text: And if you put the U for V, you'll go where you would not like to be.
        - id: ch03-b04
          speaker: peter
          text: Yes, but I'm not going!
        - id: ch03-b05
          speaker: narrator
          text: Even so, he worked especially hard that day. He seemed to believe someone might suddenly grab him by the collar and drag him off to that unwanted place. The next evening brought W.
        - id: ch03-b06
          speaker: heidi
          text: If you falter at W, worst of all, look at the stick against the wall.
        - id: ch03-b07
          speaker: narrator
          text: Peter looked toward the wall.
        - id: ch03-b08
          speaker: peter
          text: There's no stick there.
        - id: ch03-b09
          speaker: heidi
          text: No, but do you know what Grandfather keeps in his box? A stick almost as thick as your arm. If he took that out, you really could say, "Look at the stick on the wall."
        - id: ch03-b10
          speaker: narrator
          text: Peter knew that heavy hazel stick. He bent over the W at once and fought until he had mastered it. On another day, Heidi read the verse for X.
        - id: ch03-b11
          speaker: heidi
          text: Then comes the X for you to say, or be sure you'll get no food today.
        - id: ch03-b12
          speaker: narrator
          text: Peter glanced at the cupboard where the bread and cheese were kept.
        - id: ch03-b13
          speaker: peter
          text: I never said I was going to forget X.
        - id: ch03-b14
          speaker: heidi
          text: Good. If you remember it, we can learn the next one. Then there'll only be one letter left.
        - id: ch03-b15
          speaker: narrator
          text: Peter did not quite understand, but Heidi went on with the rhyme for Y.
        - id: ch03-b16
          speaker: heidi
          text: And should you make a stop at Y, they'll point at you and cry, "Fie, fie!"
        - id: ch03-b17
          speaker: narrator
          text: At once, Peter imagined all those Frankfurt gentlemen in tall black hats. He saw their scornful faces and heard them making fun of him. He attacked Y with all his strength and refused to stop until he knew it so well that he could picture its shape with his eyes closed.
        - id: ch03-b18
          speaker: narrator
          text: The next day, Peter arrived feeling rather grand. Only one letter remained. Heidi began the final lesson.
        - id: ch03-b19
          speaker: heidi
          text: Make haste with Z. If you're too slow, off to the Hottentots you'll go.
        - id: ch03-b20
          speaker: peter
          text: I don't believe that. Nobody even knows where those people live.
        - id: ch03-b21
          speaker: heidi
          text: Grandfather certainly knows all about them. He's just across the way with the pastor. Wait here, and I'll run ask him.
        - id: ch03-b22
          speaker: narrator
          text: Heidi rose and hurried toward the door, ready to do exactly that.
        - id: ch03-b23
          speaker: peter
          text: Stop!
          emotion: fearful
        - id: ch03-b24
          speaker: narrator
          text: Peter already saw Grandfather and the pastor carrying him away and sending him straight to the Hottentots, because he still did not know his final letter. His frightened cry brought Heidi back.
        - id: ch03-b25
          speaker: heidi
          text: What's wrong?
          emotion: surprised
        - id: ch03-b26
          speaker: peter
          text: Nothing! Come back. I'm going to learn the letter.
          emotion: fearful
        - id: ch03-b27
          speaker: narrator
          text: Heidi herself wanted to know where the Hottentots lived, so she still meant to ask Grandfather. Only Peter's desperate pleading made her give in at last. She insisted that he do something in return. Peter had to repeat Z until it was fixed so firmly in his memory that he could never forget it again. But Heidi did not stop there. She began teaching him to spell, and Peter made a very good start that evening. From then on, the work continued day after day.
        - id: ch03-b28
          speaker: narrator
          text: The frost had ended. The snow softened, and fresh snow kept falling. Three whole weeks passed before Heidi could visit Grandmother again. That made her even more determined to teach Peter, so he could read hymns to the old woman while Heidi was away.
    - id: ch04
      title: Peter Reads at Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One evening, after leaving Heidi, Peter walked into his own house with an announcement.
        - id: ch04-b02
          speaker: peter
          text: I can do it now.
        - id: ch04-b03
          speaker: brigitta
          text: Do what, Peter?
        - id: ch04-b04
          speaker: peter
          text: Read.
        - id: ch04-b05
          speaker: brigitta
          text: You really mean it? Grandmother, did you hear that?
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: Grandmother had heard him. She was already wondering how such a thing could possibly have happened.
        - id: ch04-b07
          speaker: peter
          text: I have to read a hymn now. Heidi told me to.
        - id: ch04-b08
          speaker: narrator
          text: Brigitta hurried to fetch the hymnbook. Grandmother lay waiting with joyful expectation, for it had been a long time since she had heard its good words. Peter sat down at the table and began to read. His mother took a seat beside him. She listened in growing amazement and could not keep quiet when he reached the end of each verse.
        - id: ch04-b09
          speaker: brigitta
          text: Who ever would have believed it!
          emotion: surprised
        - id: ch04-b10
          speaker: narrator
          text: Grandmother said nothing. She followed every word with intense attention.
    - id: ch05
      title: A Miracle at School
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next day, Peter's class had a reading lesson. When his turn came, the teacher expected the usual trouble.
        - id: ch05-b02
          speaker: teacher
          text: We generally skip Peter. Still, would you like to try once more? I won't ask you to read. Just see if you can stumble through one sentence.
        - id: ch05-b03
          speaker: narrator
          text: Peter took the book. Instead of stammering, he read three full lines without the slightest hesitation. The teacher put his own book down and stared at Peter as though this boy were some strange and marvelous thing that no one had ever seen before. For a while he could only look. At last, he found his voice.
        - id: ch05-b04
          speaker: teacher
          text: Peter, a miracle must have happened to you! I have tried with more patience than anyone could imagine, but until now, you couldn't even say your letters. I had just decided not to spend any more effort on you. And suddenly, you can read a whole sentence clearly and correctly. How did a miracle like this happen in our time?
          emotion: surprised
        - id: ch05-b05
          speaker: peter
          text: Heidi did it.
        - id: ch05-b06
          speaker: narrator
          text: The teacher turned toward Heidi in astonishment. She sat innocently on her bench and did not look supernatural in the least. Then he spoke again.
        - id: ch05-b07
          speaker: teacher
          text: I've noticed another change in you, Peter. You used to miss school for a week, sometimes several weeks. Lately, you haven't stayed away for even one day. Who brought about that improvement?
        - id: ch05-b08
          speaker: peter
          text: Uncle did it.
        - id: ch05-b09
          speaker: narrator
          text: The teacher looked from Peter to Heidi and back again, more surprised than ever.
        - id: ch05-b10
          speaker: teacher
          text: We'll try it one more time.
        - id: ch05-b11
          speaker: narrator
          text: The teacher was still cautious. He asked Peter to show what he could do by reading another three lines. Peter did it again. There could be no mistake now. Peter really knew how to read, and he read properly and clearly. As soon as school ended, the teacher went straight to the pastor. He carried the astonishing news with him and reported the happy result of Heidi's and Grandfather's work together.
        - id: ch05-b12
          speaker: narrator
          text: From then on, Peter read one hymn aloud every evening. That far, he obeyed Heidi. Nothing could persuade him to read a second, and Grandmother never asked him to. Brigitta still could not get over what her son had accomplished. After Peter went to bed, she often spoke of it with delight.
        - id: ch05-b13
          speaker: brigitta
          text: Now that he's learned to read, who knows what he might become someday?
          emotion: happy
        - id: ch05-b14
          speaker: narrator
          text: One evening, Grandmother answered her.
        - id: ch05-b15
          speaker: grandmother
          text: Yes, learning something has been good for him. But I'll be truly thankful when spring comes and Heidi can visit again. The hymns don't sound the same when Peter reads. So many words are missing. I keep trying to guess what they ought to be, and then I lose the meaning. The hymns don't reach my heart the way they do when Heidi reads them.
        - id: ch05-b16
          speaker: narrator
          text: Grandmother had good reason to be confused. Peter had arranged matters so reading would trouble him as little as possible. Whenever he came to a word that looked too long or difficult in any way, he simply left it out. There were so many words in a verse, he decided, that one or two fewer could not possibly make a difference to Grandmother. Unfortunately, the words he skipped were usually the principal ones. That was how nearly all the most important words disappeared from the hymns Peter read aloud.
