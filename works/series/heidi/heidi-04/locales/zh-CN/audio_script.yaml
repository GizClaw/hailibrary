audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着从容的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    heidi:
      display_name: 海蒂
      tts:
        delivery: 天真直接，遇到新鲜事时满是好奇和喜悦
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 偏高
    grandfather:
      display_name: 外公
      tts:
        delivery: 简短沉稳，粗粝中渐渐透出关怀
        timbre: 低沉厚实
        pace: 不紧不慢
        pitch: 低音
    peter:
      display_name: 彼得
      tts:
        delivery: 朴实寡言，回答问题时略显迟缓
        timbre: 清亮而稍显粗朴
        pace: 稍慢
        pitch: 中音
    grandmother:
      display_name: 祖母
      tts:
        delivery: 慈爱温和，忧愁中带着虔诚与感激
        timbre: 苍老柔弱
        pace: 缓慢
        pitch: 中低音
    brigitta:
      display_name: 布丽吉塔
      tts:
        delivery: 朴素直率，带着操持家务的利落
        timbre: 温厚清晰
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 山上的秋天和冬天
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天，太阳照旧早早升起。彼得赶着羊群来了，两个孩子又一同登上高处的草场。这样的日子一天接着一天。海蒂终日生活在青草和花朵中，晒得黑黑的，身子也越来越结实，从没生过病。她像林间的小鸟一样快活自在。
        - id: ch01-b02
          speaker: narrator
          text: 后来，秋天来到了山上。风吹过岩石和树木，一天比一天响，也一天比一天猛烈。有些日子，外公听见屋外的风声，就不许海蒂再跟彼得上山。
        - id: ch01-b03
          speaker: grandfather
          text: 海蒂，今天留在家里吧。突然来一阵大风，像你这么点儿的小东西，一下就会被吹过岩石，掉进山谷里。
        - id: ch01-b04
          speaker: narrator
          text: 每逢彼得听说只好独自上山，他就满脸不高兴。在他想来，路上准会遇到各样麻烦。少了海蒂，那漫长乏味的一天又该怎么熬？好吃的午饭也没有了。山羊们早已习惯海蒂陪伴，没有她便四处乱跑，固执地不肯前进，害彼得比平时多费一倍力气。
        - id: ch01-b05
          speaker: narrator
          text: 海蒂却在哪里都能找到乐趣。她最爱跟彼得去看鲜花和那只大鸟。山羊们性情各不相同，跟它们一起度过的每一天，也总会遇到新鲜事。可就算留在家里，她也不觉得乏味。外公敲打木头、拉动锯子、做出各样家具，她能在旁边看上很久。碰上制作那种又大又圆的山羊奶酪，她更是舍不得走开。外公卷起袖子，把光胳膊伸到大锅上方，不停搅动锅里的奶，海蒂觉得整个过程神奇极了。
        - id: ch01-b06
          speaker: narrator
          text: 最吸引她的，还是大风中的三棵老冷杉。无论手里在忙什么，只要听见枝条摇响，她就一次次跑到树下。强风冲进树梢，三棵树俯仰摇摆，发出深沉神秘的轰鸣。海蒂仰头看着、听着，怎么也舍不得离开。
        - id: ch01-b07
          speaker: narrator
          text: 夏日温暖的阳光不见了，天气一天比一天冷。海蒂从柜子里取出鞋袜和裙子。站在冷杉下面，风穿过她的衣服，仿佛要吹透一片薄叶，可她还是不肯待在屋里。
        - id: ch01-b08
          speaker: narrator
          text: 后来，天气冷得厉害。彼得每天清早上山，都要朝手指不停呵气。一天夜里，大雪落了下来。第二天，整座山一片雪白，连一小片绿叶也找不到。彼得不再来了。
        - id: ch01-b09
          speaker: narrator
          text: 海蒂站在小窗前，看着浓密的雪片越落越多。雪没有一点要停的意思，窗外的积雪越堆越高，一直漫到窗边，最后连窗子也推不开了。她和外公被严严实实地封在小屋里。海蒂一点也不害怕，反而觉得这事有趣极了。她从一扇窗跑到另一扇窗，等着看下一刻还会发生什么。雪会不会把整间小屋都埋住，逼得他们明明是在大白天，也得点起灯来呢？
        - id: ch01-b10
          speaker: narrator
          text: 雪没有把小屋整个埋掉。第二天雪停了，外公把屋子四周一点点铲开，又把雪堆到两旁，堆成一座座隔开的小山。门和窗总算都能打开了。幸亏如此。一天午后，祖孙俩正坐在火前的三脚凳上，门外忽然砰地一响，紧接着又响了好几声，随后门开了。原来是彼得在使劲跺脚，想把鞋上的雪震下来。他全身还是白蒙蒙的，衣服上粘着一大块一大块冻硬的雪。他一路从深雪堆里挣扎上山，怎么也不肯被大雪拦住，因为已经整整一个星期没见到海蒂了。
        - id: ch01-b11
          speaker: peter
          text: 晚上好。
        - id: ch01-b12
          speaker: narrator
          text: 彼得走到离火最近的地方，一声不响地站着，脸上却喜气洋洋。热气让他身上的雪四处融化。海蒂惊讶地看着，觉得他像一道滴滴答答的小瀑布。
        - id: ch01-b13
          speaker: grandfather
          text: 将军，近来怎么样？你的军队没了，现在只好改拿笔和铅笔啦。
        - id: ch01-b14
          speaker: heidi
          text: 他为什么一定要拿笔和铅笔？
        - id: ch01-b15
          speaker: grandfather
          text: 冬天他得上学，还得学读书写字。这件事不轻松，不过以后也有用。对不对，将军？
        - id: ch01-b16
          speaker: peter
          text: 一点不错。
        - id: ch01-b17
          speaker: narrator
          text: 海蒂的兴致全来了。学校里要做什么，会看见什么，又会听见什么，她一个问题接一个问题地问。彼得向来不善于把念头说成话。每次他刚想好一个回答，海蒂早已又问了两三个，而且每一个都得用长长一句话才答得清。等这场谈话结束，他也在火边彻底烤干了。
        - id: ch01-b18
          speaker: narrator
          text: 外公坐在一旁没有插话，嘴角却偶尔露出笑意。最后，他站起来去柜子里取晚饭，海蒂把凳子推到桌边。屋里如今还添了一张长凳，因为海蒂不管外公走着、坐着还是站着，总喜欢挨在他身旁。
        - id: ch01-b19
          speaker: grandfather
          text: 好了，将军，你在火线上待了这么久，也该补充点给养了。来跟我们一起吃吧。
        - id: ch01-b20
          speaker: narrator
          text: 三个人都有了舒服的座位。外公切下一片厚面包，又在上面放了一大块肉，递到彼得面前。彼得的圆眼睛一下睁得更大。他已经很久没吃过这么香的东西了。这顿饭吃得十分愉快。等大家吃完，外面也渐渐暗下来，彼得这才准备回家。他谢过主人，道了晚安，正要跨出门口，忽然想起了祖母托付的话，又转过身来。
        - id: ch01-b21
          speaker: peter
          text: 七天以后，到了下个星期日，我还会来。祖母托我捎话，她想请你哪天去看看她。
    - id: ch02
      title: 飞驰下山
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 去别人家做客，对海蒂来说是个从未有过的新念头。第二天一早，她就向外公提起这件事。
        - id: ch02-b02
          speaker: heidi
          text: 我今天得下山去看祖母。她一定在等我。
        - id: ch02-b03
          speaker: grandfather
          text: 雪太深了。
        - id: ch02-b04
          speaker: narrator
          text: 可祖母既然捎来了话，海蒂就觉得非去不可。以后每天，她总要把这件事说上五六遍。
        - id: ch02-b05
          speaker: heidi
          text: 我今天一定得去。祖母还在等我呢。
        - id: ch02-b06
          speaker: narrator
          text: 到了第四天，冻硬的地面一踩就咔嚓作响，整片雪地坚硬得像冰。午饭时，阳光照进窗子，海蒂坐在高凳上，又一次开口。
        - id: ch02-b07
          speaker: heidi
          text: 我今天一定得下山去看祖母，不然就让她等得太久了。
        - id: ch02-b08
          speaker: narrator
          text: 外公起身爬上干草棚，取下那只给海蒂当被子的厚布袋。
        - id: ch02-b09
          speaker: grandfather
          text: 那就走吧！
        - id: ch02-b10
          speaker: narrator
          text: 海蒂欢欢喜喜地跟着他跑进雪白发亮的世界。往日总在风中轰鸣的三棵老冷杉，如今一声不响地站着。每根枝条上都覆满白雪，阳光一照，有的地方像金子，有的地方像银子，四处闪闪发亮。海蒂一看见，便高兴得跳了起来。
        - id: ch02-b11
          speaker: heidi
          text: 外公，快来呀！冷杉全变成金的、银的啦！
          emotion: happy
        - id: ch02-b12
          speaker: narrator
          text: 外公从棚里拖出一架大手橇。里面装着一个低矮的座位，坐雪橇的人可以用双脚推动，再用固定在一侧的长杆掌握方向。海蒂先拉着外公绕冷杉走了一圈，让他从各面看清树有多美。接着，外公坐进雪橇，把孩子抱到膝上，用厚布袋严严实实地裹暖，又用左臂紧紧搂住她。接下来要一路冲下山坡，他可不能让孩子从怀里滑出去。外公右手握紧长杆，双脚用力一蹬，雪橇立刻飞驰起来。
        - id: ch02-b13
          speaker: narrator
          text: 雪橇沿着山坡飞快向下，海蒂觉得他们已经离开地面，像鸟一样穿过空中。她快活得放声大叫。没过多久，雪橇忽然停住，彼得的小屋已经在眼前了。外公抱她下来，又把裹在身上的厚布袋一层层解开。
        - id: ch02-b14
          speaker: grandfather
          text: 到了，进去吧。天一黑，你就该动身回家。
        - id: ch02-b15
          speaker: narrator
          text: 外公说完，便拖着雪橇回山上去了。海蒂推门走进一间昏暗的小屋，里面有一座炉灶，木架上只摆着几只碟子，原来这是厨房。她又打开里面的一扇门，才进到另一间屋子。彼得家不像外公的牧人小屋，底下有一整间大屋，上面还有干草棚。这是一座十分古老的房子，处处狭窄，东西寒酸而破旧。
        - id: ch02-b16
          speaker: narrator
          text: 一张桌子靠着门摆放。桌边坐着一个女人，正在给一件背心打补丁。海蒂一眼就认出来，那是彼得的衣服。墙角还有一位年老驼背的女人，坐在纺车旁边纺线。海蒂从没见过她，却立刻认定这一定就是祖母，于是径直走到纺车前，伸出了自己的手。
        - id: ch02-b17
          speaker: heidi
          text: 祖母，您好，我终于来了。您是不是觉得我来得太晚啦？
        - id: ch02-b18
          speaker: narrator
          text: 老妇人抬起头，摸索着找到海蒂伸来的手，又轻轻抚摸了几下。
        - id: ch02-b19
          speaker: grandmother
          text: 你就是住在阿尔姆大叔那里的孩子吗？你是海蒂？
        - id: ch02-b20
          speaker: heidi
          text: 是呀，是呀。我刚跟外公坐雪橇下来的。
        - id: ch02-b21
          speaker: grandmother
          text: 真有这样的事！你的手还是暖的呢。布丽吉塔，是阿尔姆大叔亲自送她来的吗？
          emotion: surprised
        - id: ch02-b22
          speaker: narrator
          text: 彼得的母亲放下手里的针线，从桌边站起来。她好奇地望着海蒂，从头到脚仔细打量，想看看这个在山上住了好些日子的孩子究竟是什么模样。
        - id: ch02-b23
          speaker: brigitta
          text: 我不知道，妈妈。我看大叔不大可能亲自来，这孩子多半弄错了。
        - id: ch02-b24
          speaker: heidi
          text: 我才没有弄错。拿被子裹住我，再用雪橇送我下山的人，就是外公。
        - id: ch02-b25
          speaker: grandmother
          text: 那么，夏天彼得说起大叔时，我们以为他弄错了，其实那些话也许是真的。谁能想到会这样呢？我原以为这孩子在山上连三个星期也住不下去。布丽吉塔，她长什么样？
        - id: ch02-b26
          speaker: narrator
          text: 布丽吉塔已经把海蒂看得十分仔细。
        - id: ch02-b27
          speaker: brigitta
          text: 她身子纤细，像阿德莱德。眼睛是黑的，卷发又像她父亲和山上那位老人。我看，她两边都像。
    - id: ch03
      title: 祖母眼前的黑暗
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 大人们说话时，海蒂一点也没闲着。她绕着房间走了一圈，把所有能看的东西全都细细看过。忽然，一扇来回晃动的百叶窗引起了她的注意。风每吹一下，窗板就撞一下，发出砰砰的声音。
        - id: ch03-b02
          speaker: heidi
          text: 祖母，您有块窗板一直在晃！外公钉一颗钉子，马上就能修好。要不然，它迟早会打碎玻璃的。您听，它还在砰砰撞呢！
        - id: ch03-b03
          speaker: grandmother
          text: 唉，好孩子，我看不见，不过听得见。除了这块窗板，还有好多声音我也听得见。一刮风，屋里到处格格响、吱吱叫，风从所有缝隙里钻进来。这房子快散架了。夜里他们俩睡着以后，我常常怕得发抖，总觉得屋子就要塌下来，把我们压死。没有人肯来修，彼得也不会做这种活儿。
          emotion: fearful
        - id: ch03-b04
          speaker: heidi
          text: 可您为什么看不见窗板松了呢？您瞧，它又动啦，就是那块！
        - id: ch03-b05
          speaker: grandmother
          text: 唉，孩子，不只是窗板。我什么也看不见，什么也看不见。
          emotion: sad
        - id: ch03-b06
          speaker: heidi
          text: 那我到外面把窗板推开，让屋里更亮一点，您就能看见了吗？
        - id: ch03-b07
          speaker: grandmother
          text: 不能，不能，那样也看不见。谁也不能再让我的眼前亮起来了。
        - id: ch03-b08
          speaker: heidi
          text: 可是外面的雪地白茫茫的，一定很亮。来吧，祖母，我领您出去看。
        - id: ch03-b09
          speaker: narrator
          text: 海蒂拉住祖母的手，想带她出去。一想到老人眼前没有光，她心里越来越难过。
        - id: ch03-b10
          speaker: grandmother
          text: 别拉我了，好孩子。如今我到哪里都只看见黑暗。不管有雪还是有太阳，一点光也进不了我的眼睛。
        - id: ch03-b11
          speaker: heidi
          text: 可夏天一定能看见。等太阳又暖暖地照下来，向群山道晚安，山全都燃烧起来，黄色的花也像金子一样发光，那时您的眼前一定会又亮又美。
        - id: ch03-b12
          speaker: grandmother
          text: 唉，孩子，我再也看不见燃烧的群山，也看不见黄色的花了。在这世上，我的眼前永远不会再亮起来了。
          emotion: sad
        - id: ch03-b13
          speaker: narrator
          text: 海蒂一听便放声哭了起来。她平时很少掉眼泪，可一旦哭起来，心里的难过就很久也过不去。
        - id: ch03-b14
          speaker: heidi
          text: 谁能再让您看见光呢？真的没有人能做到吗？一个人也没有吗？
          emotion: sad
        - id: ch03-b15
          speaker: narrator
          text: 祖母连忙安慰孩子，可要让她平静下来并不容易。海蒂哭得那么伤心，祖母听着也十分心疼，把自己能想到的法子全用上了。过了好一阵，她才想出一个既能安慰海蒂，又能让自己听见孩子说话的主意。
        - id: ch03-b16
          speaker: grandmother
          text: 过来吧，海蒂，我告诉你一件事。眼睛看不见以后，听到一句亲切的话，心里会有多高兴，你想不到。我听你说话，就快活极了。坐到我旁边，讲讲山上的生活吧。你每天做些什么？你外公又忙些什么？从前我很熟悉他，可这些年只能从彼得那里听到一点消息，而他总是没几句话。
        - id: ch03-b17
          speaker: narrator
          text: 海蒂听见自己还能让祖母高兴，马上擦干眼泪。
        - id: ch03-b18
          speaker: heidi
          text: 您等着，祖母。我把事情全告诉外公，他一定会想办法让您看见光，也不会让这屋子倒下来。他会把一切都修好的。
        - id: ch03-b19
          speaker: narrator
          text: 祖母听了没有回答。海蒂便兴致勃勃地讲起自己和外公怎样生活，也讲起她跟山羊们在山上度过的那些日子。接着，她又说到眼下的冬天，说外公能用木头做出各样东西。屋里的座椅、三脚凳，还有给小天鹅和小熊盛放干草的食槽，都是外公亲手做的。
        - id: ch03-b20
          speaker: narrator
          text: 外公还做了新的大木盆，夏天给海蒂洗澡，也做了新奶碗和新勺子。海蒂越说越起劲，仿佛每块木头到了外公手里，都会被魔法变成美丽的东西。她总站在旁边看，还盼着自己有一天也会做。
        - id: ch03-b21
          speaker: grandmother
          text: 布丽吉塔，你听见了吗？你听见她怎么说大叔吗？
        - id: ch03-b22
          speaker: narrator
          text: 门上忽然砰地一响，谈话被打断了。彼得大步走进来，一看见海蒂，便惊讶得站在原地，两只眼睛睁得圆圆的。海蒂笑着向他说了声晚上好，他脸上顿时也笑开了花。
        - id: ch03-b23
          speaker: grandmother
          text: 怎么，已经放学了吗？好多年了，我还没觉得哪个下午过得这么快。彼得，你认字学得怎么样？
          emotion: surprised
        - id: ch03-b24
          speaker: peter
          text: 还是老样子。
        - id: ch03-b25
          speaker: grandmother
          text: 唉，你到明年二月就满十二岁了。我原以为到了现在，你该能告诉我点不一样的消息了。
        - id: ch03-b26
          speaker: heidi
          text: 您希望他告诉您什么消息？
        - id: ch03-b27
          speaker: grandmother
          text: 我盼他已经会认一点字。架子上有本旧祈祷书，里面有些很美的圣歌。我很久没听过了，自己也记不起该怎么念。我原想等彼得多学会一些字，偶尔就能读一首给我听，可他觉得太难了。
        - id: ch03-b28
          speaker: brigitta
          text: 我得点灯了，已经黑得看不清针脚啦。我也不知道这个下午怎么一下就过去了。
        - id: ch03-b29
          speaker: narrator
          text: 海蒂从矮凳上跳下来，匆匆向祖母伸出手。
        - id: ch03-b30
          speaker: heidi
          text: 晚安，祖母。既然天快黑了，我得马上回家。
        - id: ch03-b31
          speaker: narrator
          text: 她又向彼得和布丽吉塔告别，转身走向门口。祖母却担心得叫住了她。
        - id: ch03-b32
          speaker: grandmother
          text: 等等，海蒂！你不能一个人走。彼得得陪你回去。彼得，看好这个孩子，别让她摔倒，也别让她停下来，不然会冻僵的。她有暖和的东西围脖子吗？
          emotion: fearful
        - id: ch03-b33
          speaker: heidi
          text: 我什么也没带，不过肯定不会冷。
        - id: ch03-b34
          speaker: narrator
          text: 海蒂说完就跑到外面，沿路飞快地往前赶。彼得在后面用力追，好不容易才赶上她。祖母听见孩子们出了门，心里还是放不下，生怕海蒂在这么冷的夜里出事，于是又急忙催促女儿。
        - id: ch03-b35
          speaker: grandmother
          text: 布丽吉塔，快追上她！这么冷的夜里，这孩子会冻死的。拿上我的披肩，快去！
          emotion: fearful
    - id: ch04
      title: 屋外的锤声
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 布丽吉塔赶紧追了出去。两个孩子才走几步，就看见外公下山来迎接他们。他迈着大步，转眼便来到海蒂身边。
        - id: ch04-b02
          speaker: grandfather
          text: 这就对了，海蒂。你说话算数。
        - id: ch04-b03
          speaker: narrator
          text: 外公拿厚布袋牢牢裹住孩子，把她抱起来，大步朝山上走去。布丽吉塔带着披肩恰好赶到，看见了这一幕。她原想替海蒂挡住寒风，没想到阿尔姆大叔早已亲自下山来迎接孩子。她和彼得回到屋里，把自己见到的情景讲给祖母听，话里满是惊讶。祖母也没想到阿尔姆大叔会这样细心照料海蒂。
        - id: ch04-b04
          speaker: grandmother
          text: 感谢上帝，他待这孩子这么好！不知道他还肯不肯让她来看我。海蒂给了我多大的安慰。她的心真可爱，说起话来又那么快活！但愿她还会再来。如今我在这世上，真的又有一件值得高兴的事了。
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: 祖母直到上床前还在欢喜地念叨海蒂，一会儿感谢上帝，一会儿又盼孩子还能再来。布丽吉塔句句都赞同。祖母每说一次，彼得就点一次头，脸上始终挂着满足的笑容。
        - id: ch04-b06
          speaker: peter
          text: 我早就告诉过你们啦！
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: 与此同时，海蒂裹在布袋里，一路对外公说个不停。厚布把她的声音挡住了，外公一个字也听不清。
        - id: ch04-b08
          speaker: grandfather
          text: 等回到家，你再把一切讲给我听。
        - id: ch04-b09
          speaker: narrator
          text: 一进小屋，海蒂从布袋里钻出来，立刻说起明天的安排。
        - id: ch04-b10
          speaker: heidi
          text: 外公，明天我们得带上锤子和长钉子，把祖母的窗板钉牢，还要在别处多钉好多钉子。她的房子到处都在摇，也到处都在响。
        - id: ch04-b11
          speaker: grandfather
          text: 我们非得这么做吗？是谁告诉你的？
        - id: ch04-b12
          speaker: heidi
          text: 没人告诉我，可我就是知道。那里的东西都快散架了。祖母睡不着，会躺着吓得发抖。她听见那些声音，总怕房子忽然塌下来，压在她们头上。她眼前也永远是黑的，还以为谁都不能再让她看见光。可我知道您一定有办法。她一直待在黑暗里，还要怕房子倒下来，多可怕呀！除了您，没人能帮她。我们明天会去的，对不对？
        - id: ch04-b13
          speaker: narrator
          text: 海蒂紧紧偎着外公，满怀信赖地抬头看他。老人沉默了一会儿。
        - id: ch04-b14
          speaker: grandfather
          text: 好吧，海蒂。至少我们能想办法，不再让屋子格格乱响。明天就下山去修。
        - id: ch04-b15
          speaker: narrator
          text: 海蒂欢喜得绕着屋子直跳。
        - id: ch04-b16
          speaker: heidi
          text: 我们明天去！我们明天去！
          emotion: happy
        - id: ch04-b17
          speaker: narrator
          text: 外公果然守信。第二天下午，他又拖出雪橇，把海蒂送到祖母门前。
        - id: ch04-b18
          speaker: grandfather
          text: 进去吧，等天黑了再出来。
        - id: ch04-b19
          speaker: narrator
          text: 外公把厚布袋留在雪橇里，自己绕到屋后。海蒂刚推开门，才跳进屋子，祖母已经从角落里认出了她的脚步声。老人高兴得手里的线都掉了，纺车也随之停住。她把两只手早早伸出来，等着迎接孩子。
        - id: ch04-b20
          speaker: grandmother
          text: 又是这孩子！她来啦！
          emotion: happy
        - id: ch04-b21
          speaker: narrator
          text: 海蒂跑过去，把矮凳拖到老人身边，坐下后又问又讲。墙外忽然传来沉重的敲击声，祖母吓得猛一哆嗦，差点撞翻纺车。
        - id: ch04-b22
          speaker: grandmother
          text: 啊，我的上帝，这下真要来了！房子要塌到我们头上了！
          emotion: fearful
        - id: ch04-b23
          speaker: heidi
          text: 不会的，祖母，别害怕。那是外公在用锤子。他正把所有地方都修好，以后您不用再害怕，也不用发愁了。
          emotion: calm
        - id: ch04-b24
          speaker: grandmother
          text: 真的吗？原来仁慈的上帝没有忘记我们！布丽吉塔，你听见了吗？现在仔细听，我认得出锤子的声音。快到外面去，要是阿尔姆大叔，请他进来一下，我要亲自谢谢他。
          emotion: surprised
        - id: ch04-b25
          speaker: narrator
          text: 布丽吉塔走到外面，果然看见阿尔姆大叔正往墙上钉几块结实的新木料。
        - id: ch04-b26
          speaker: brigitta
          text: 晚上好，大叔。您肯来帮这个忙，我和妈妈都得谢谢您。她想亲口说说自己有多感激。我真想不到除了您，还有谁肯替我们做这些。您的好意，我们一定不会忘记，因为我敢说……
        - id: ch04-b27
          speaker: grandfather
          text: 够了。你心里怎么看阿尔姆大叔，不必说给我听。回屋去吧，哪里需要修，我自己看得出来。
        - id: ch04-b28
          speaker: narrator
          text: 布丽吉塔马上回屋。大叔说话自有一股让人不敢违拗的力量，没几个人愿意跟他争辩。他继续绕着房子四周敲敲打打，把松动破损的地方一一找出来。后来，他又登上通往屋顶的狭窄梯级，在上面不停地钉，直到带来的钉子全部用完。
        - id: ch04-b29
          speaker: narrator
          text: 天色一点点暗下来。外公从屋顶下来，刚把雪橇从羊棚后面拖出，海蒂也走到了门外。他像前一天那样，把孩子裹得严严实实，抱在怀里。虽然还得空出一只手拖着雪橇爬山，他也不肯让海蒂独自坐在里面。要是裹布在路上滑落，她即使不冻僵，也会冻得受不了。于是整段上山的路，孩子都被他暖暖和和、稳稳当当地抱在怀中。
        - id: ch04-b30
          speaker: narrator
          text: 冬天就这样一天天过去。盲眼的祖母过了许多年没有欢乐的日子，如今终于有了一件可以盼望的事。以前，每一天都是同样的乏味、同样的黑暗，既没有欢喜，也没有变化。现在只要天一亮，她就侧耳等着那轻快的小脚步。门一打开，她听出海蒂真的来了，便会高兴地喊起来。
        - id: ch04-b31
          speaker: grandmother
          text: 感谢上帝，她又来啦！
          emotion: happy
        - id: ch04-b32
          speaker: narrator
          text: 海蒂坐在祖母身边，把自己知道的事情一件件说得有声有色。她的声音那么活泼，祖母听着听着，根本察觉不到时间是怎样过去的。老人再也不会像从前那样，一遍遍问布丽吉塔，这一天为什么还没结束。现在，每次海蒂起身告别，门在她身后合上，祖母反倒惊讶起来，一个下午怎么会过得这么快。
        - id: ch04-b33
          speaker: grandmother
          text: 这个下午怎么这么短！你不觉得吗，布丽吉塔？
        - id: ch04-b34
          speaker: brigitta
          text: 可不是吗？我觉得才刚刚收拾完午饭呢。
        - id: ch04-b35
          speaker: grandmother
          text: 但愿上帝别让这孩子离开我，也让阿尔姆大叔一直肯放她来。布丽吉塔，她看起来健康结实吗？
        - id: ch04-b36
          speaker: brigitta
          text: 她又鲜亮又红润，像一只苹果。
        - id: ch04-b37
          speaker: narrator
          text: 海蒂也一天比一天喜爱祖母。等她终于弄明白，确实没有人能让祖母的眼前重新亮起来，她又一次被悲伤压住了。祖母却告诉她，只要这个孩子陪在身边，自己就没有那么深地感觉到黑暗。
        - id: ch04-b38
          speaker: narrator
          text: 此后每个天气晴朗的冬日，海蒂都会坐着雪橇下山。外公总是亲自送她，从来没有说过一句反对的话。每次出发，他还会把锤子和各样工具放进雪橇。许多个下午，他都留在牧羊人家的小屋外，把漏风、松动的地方一处处修补好，让这座老房子重新变得结实严密。
        - id: ch04-b39
          speaker: narrator
          text: 小屋终于不再整夜呻吟，也不再格格作响。许多个冬天以来，祖母头一次睡得这样安稳。她说，阿尔姆大叔为她所做的一切，她永远也不会忘记。
