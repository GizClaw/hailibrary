  chapters:
    - id: ch01
      title: "CHAPTER IV. THE VISIT TO GRANDMOTHER"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The next morning, the sun came out as bright as ever. Peter arrived with the goats, and the two children climbed to the high meadows together again. Day after day, Heidi lived among the grass and flowers. The sun browned her skin, and she grew so strong and healthy that she was never ill. She was happy too, living as freely as the little birds in the green forest trees.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Then autumn came. The wind blew harder and made more noise, and sometimes Grandfather would keep Heidi home.
        - id: ch01-b03
          speaker: grandfather
          text: >-
            You have to stay here today, Heidi. One sudden gust could sweep a little thing like you over the rocks and straight into the valley.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Whenever Peter heard he must go alone, his face fell. He could already imagine every kind of trouble ahead, and he did not know how he would get through a long, dull day without Heidi. He would miss the good meal that came with her too. Worse still, the goats had grown so used to Heidi that they behaved badly whenever she stayed home. They ran every which way, stood stubbornly in place, and refused to follow unless she was there. Getting the flock up the mountain gave Peter twice as much work as usual.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Heidi, though, could find something interesting wherever she was. Of course she liked going up to the flowers and the great bird best. There was always something new to see, and every goat had its own ways for her to discover. But staying home never made her unhappy. Grandfather's hammering, sawing, and carpentry could hold her attention for hours. If it happened to be the day for making one of the large, round goat's-milk cheeses, she enjoyed every moment. She watched Grandfather roll his sleeves back and stir the great kettle with his bare arms, amazed by the whole wonderful process.
        - id: ch01-b06
          speaker: narrator
          text: >-
            On windy days, nothing drew her like the three old fir trees. Again and again, she left whatever she was doing and ran out to listen. No other sound seemed so strange and wonderful. She stood beneath the trees, unable to pull herself away, and stared into their high tops. They bowed and swayed above her, giving a deep, mysterious roar as the powerful wind rushed through them. Summer's warm, bright sunlight was gone now. As each day grew colder, Heidi went to the cupboard and brought out her shoes, stockings, and dress. Even dressed in them, she felt as thin as a little leaf when the wind swept around her beneath the trees. Still, whenever she heard those great branches moving outside, she could not bear to remain indoors.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Soon the cold sharpened. Peter came up early each morning, blowing on his fingers to keep them warm. Before long, he stopped coming altogether. One night, heavy snow fell. By morning, the whole mountain lay buried, without one small green leaf in sight. Peter did not appear that day. Heidi stood at the little window and looked out in wonder as the snow began falling again. Thick flakes came down without stopping. The snow climbed to the window, then rose even higher. At last, the window could not be opened at all. Heidi and Grandfather were shut tight inside the hut.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Heidi thought it was splendid. She ran from one window to another, eager to see what would happen next. Perhaps the snow would cover the whole hut. Perhaps it would grow so dark inside that they would have to light a lamp in broad daylight. But it never became quite that bad. The next day, the snow finally stopped. Grandfather went out and shoveled all around the house. He threw the snow into enormous heaps that stood like little mountains at intervals on both sides of the hut. At last, the door and windows could open again.
        - id: ch01-b09
          speaker: narrator
          text: >-
            That was fortunate. One afternoon, Heidi and Grandfather were sitting on their three-legged stools in front of the fire when a great thump struck the door. Several more thumps followed, and then the door opened. Peter came in. All that noise had been the boy knocking snow from his shoes. He was still white from head to foot. To reach the hut, he had fought his way through deep drifts, and large frozen lumps still clung to his clothes. The climb had been hard, but Peter had made up his mind not to be beaten. A whole week had passed since he had seen Heidi, and he was determined to reach her.
        - id: ch01-b10
          speaker: peter
          text: >-
            Good evening.
        - id: ch01-b11
          speaker: narrator
          text: >-
            He moved as close to the fire as he could and said nothing more, but his face shone with pleasure. Heidi watched in amazement as the warmth melted the snow on him until water streamed down like a little waterfall.
        - id: ch01-b12
          speaker: grandfather
          text: >-
            Well, General, how are you managing? Now that you've lost your army, I suppose it's time for pens and pencils.
        - id: ch01-b13
          speaker: heidi
          text: >-
            Why does Peter need pens and pencils?
        - id: ch01-b14
          speaker: grandfather
          text: >-
            He has to go to school in winter and learn to read and write. It's hard work, though it can be useful later. Isn't that right, General?
        - id: ch01-b15
          speaker: peter
          text: >-
            Yes, it is.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Now Heidi wanted to know everything about school. What did Peter do there? What did he see? What did he hear? She had so many questions that their talk went on until he was completely dry. Peter always struggled to put his thoughts into words. Today it was twice as hard. By the time he had prepared an answer to one question, Heidi had already asked two or three more. Usually, each new question needed a whole long sentence in reply. Grandfather sat quietly through it all. He never joined the conversation, but now and then the corners of his mouth twitched with amusement. That was how anyone could tell he was listening.
        - id: ch01-b17
          speaker: grandfather
          text: >-
            Well, General, you've been under fire long enough. You must need provisions. Come eat with us.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Grandfather rose and fetched supper from the cupboard while Heidi pushed the stools over to the table. There was a bench fixed against the wall now too. Since he was no longer living alone, Grandfather had put up seats of different kinds here and there, each one long enough for two people. They were useful because Heidi had a way of keeping close beside him, whether he was walking, sitting, or standing. This evening, the three of them had plenty of room. Peter opened his round eyes very wide when Grandfather placed a large piece of meat on top of his thick slice of bread. It had been a long time since the boy had eaten anything so good.
        - id: ch01-b19
          speaker: narrator
          text: >-
            After the pleasant meal, Peter prepared to leave, for darkness was coming. He had already said good night and thanked them when he turned at the door.
        - id: ch01-b20
          speaker: peter
          text: >-
            I'll be back next Sunday, a week from today. Grandmother says she'd like you to visit her sometime.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Heidi had never thought of going to visit someone before. The idea stayed in her mind. First thing the next morning, she spoke to Grandfather.
        - id: ch01-b22
          speaker: heidi
          text: >-
            I have to see Grandmother today. She'll be waiting for me.
        - id: ch01-b23
          speaker: grandfather
          text: >-
            The snow is too deep.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Grandfather was trying to put her off, but Grandmother had sent a message asking for her. To Heidi, that settled the matter. She had made up her mind to go. Not a single day passed without her raising the subject five or six times. Each time, she told Grandfather that she certainly must visit that day because Grandmother would be waiting.
        - id: ch01-b25
          speaker: narrator
          text: >-
            On the fourth day, the frost had hardened everything. The ground crackled under every step, and the vast field of snow had become as solid as ice. At dinnertime, Heidi sat on her high stool while bright sunlight poured through the window and shone around her. Once more, she made her case to Grandfather.
        - id: ch01-b26
          speaker: heidi
          text: >-
            I really have to visit Grandmother today, or I'll keep her waiting far too long.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Grandfather rose, climbed to the hayloft, and brought down the thick sack that covered Heidi's bed.
        - id: ch01-b28
          speaker: grandfather
          text: >-
            Come along, then.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Heidi skipped after him into the glittering snow. The old fir trees stood silent now, their branches loaded with white. In the sunlight, they sparkled so beautifully that Heidi jumped for joy.
        - id: ch01-b30
          speaker: heidi
          text: >-
            Grandfather, come look! Come here! The fir trees are covered in silver and gold!
          emotion: happy
        - id: ch01-b31
          speaker: narrator
          text: >-
            Grandfather had gone into the shed. Now he came out pulling a large hand sleigh behind him. A low seat had been built inside it. The person who sat there could push and guide the sleigh with his feet, using a pole fastened along one side. Before he could start, Heidi took him around the fir trees and made sure he saw their beauty from every direction. Then Grandfather got into the sleigh and lifted her onto his lap. He wrapped the thick sack around her so she would stay warm. He held her tightly with his left arm, because the journey ahead made that necessary. Then he gripped the pole in his right hand, pushed hard with both feet, and sent the sleigh forward.
        - id: ch01-b32
          speaker: narrator
          text: >-
            The sleigh shot down the mountainside with such speed that Heidi felt as though they had left the ground. They were flying through the air like a bird. She shouted aloud with delight as the mountain rushed past. Then, all at once, the sleigh stopped. They had already reached Peter's cottage. Grandfather lifted Heidi from his lap, set her on the ground, and unwrapped the thick sack from around her.
        - id: ch01-b33
          speaker: grandfather
          text: >-
            Here you are. Go inside, and when it starts getting dark, set out for home.
        - id: ch01-b34
          speaker: narrator
          text: >-
            He left her there and climbed back up the mountain, pulling the sleigh behind him.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Heidi opened the cottage door and stepped into a tiny room that looked very dark. A fireplace stood there, along with a wooden shelf holding a few dishes. This was the kitchen. She opened another door and entered a second small room. The cottage was nothing like Grandfather's herdsman's hut, with its one large room below and hayloft above. This was a very old place. Everything in it looked narrow, poor, and shabby. A table stood close to the door. Beside it, a woman was sewing a patch onto a waistcoat that Heidi recognized at once as Peter's. In the corner, an old woman sat bent with age, spinning at her wheel. Heidi felt certain this must be Grandmother, so she walked straight over to her.
        - id: ch01-b36
          speaker: heidi
          text: >-
            Good afternoon, Grandmother. I'm finally here! Did you think I was taking a long time?
        - id: ch01-b37
          speaker: narrator
          text: >-
            The old woman raised her head and reached for the hand Heidi held out. When she found it, she gently felt it for a few moments.
        - id: ch01-b38
          speaker: grandmother
          text: >-
            Are you the child who lives up the mountain with Alm-Uncle? Are you Heidi?
        - id: ch01-b39
          speaker: heidi
          text: >-
            Yes, yes! Grandfather just brought me down on the sleigh.
        - id: ch01-b40
          speaker: grandmother
          text: >-
            Can that be? Why, your hands are warm! Brigitta, did Alm-Uncle bring the child himself?
          emotion: surprised
        - id: ch01-b41
          speaker: narrator
          text: >-
            Peter's mother, Brigitta, put down her sewing and stood. She looked Heidi over from head to foot.
        - id: ch01-b42
          speaker: brigitta
          text: >-
            I don't know, Mother. It hardly seems likely that Uncle came himself. The child may be mistaken.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Heidi met the woman's eyes without the least uncertainty.
        - id: ch01-b44
          speaker: heidi
          text: >-
            I know exactly who wrapped me in my bedcover and brought me down on the sleigh. It was Grandfather.
        - id: ch01-b45
          speaker: grandmother
          text: >-
            Then perhaps Peter was telling the truth about Alm-Uncle all summer, though we thought he had it wrong. Who could have believed it? I never expected the child to last three weeks up there. Brigitta, what does she look like?
        - id: ch01-b46
          speaker: narrator
          text: >-
            Brigitta had studied Heidi closely enough to answer.
        - id: ch01-b47
          speaker: brigitta
          text: >-
            She's slender like Adelaide. But she has dark eyes and curly hair, like her father and the old man up there. I think she takes after both sides.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Meanwhile, Heidi had made a careful tour of the room. Suddenly, she noticed something.
        - id: ch01-b49
          speaker: heidi
          text: >-
            Grandmother, one of your shutters keeps swinging back and forth! Grandfather could fix it with one nail in no time. If no one fixes it, it might break a window. Look how it keeps banging!
        - id: ch01-b50
          speaker: grandmother
          text: >-
            Oh, dear child, I can't see it. But I can hear that, and many other things too. When the wind blows, everything here rattles and creaks. It comes through every crack and hole. The house is falling apart. At night, while the others sleep, I lie awake trembling. I keep thinking it will collapse and kill us. There's no one to mend it, because Peter doesn't know how.
          emotion: fearful
        - id: ch01-b51
          speaker: heidi
          text: >-
            But why can't you see the loose shutter, Grandmother? Look, it's moving again. That one right there!
        - id: ch01-b52
          speaker: grandmother
          text: >-
            Oh, child, it isn't only the shutter. I can't see anything. Nothing at all.
          emotion: sad
        - id: ch01-b53
          speaker: heidi
          text: >-
            What if I went outside and opened the shutter wider? Then there would be more light, and you could see.
        - id: ch01-b54
          speaker: grandmother
          text: >-
            No, no. Even then, no one could bring the light back to me.
        - id: ch01-b55
          speaker: heidi
          text: >-
            Then come outside into all the white snow. It must be bright out there. Come with me, Grandmother. I'll show you.
        - id: ch01-b56
          speaker: narrator
          text: >-
            The thought of Grandmother living without light distressed Heidi. She took the old woman's hand and tried to lead her up.
        - id: ch01-b57
          speaker: grandmother
          text: >-
            Let me stay here, dear child. It's always dark for me now. Snow or sunshine makes no difference. No light can reach my eyes.
        - id: ch01-b58
          speaker: heidi
          text: >-
            But what about summer, Grandmother? When the hot sun shines again, and says good night to the mountains, and they all catch fire? When the yellow flowers glow like gold? You'll see. It will be bright and beautiful for you then.
        - id: ch01-b59
          speaker: grandmother
          text: >-
            Oh, child, I will never see the mountains on fire or the yellow flowers again. It will never be light for me again in this world. Never.
          emotion: sad
        - id: ch01-b60
          speaker: narrator
          text: >-
            Heidi burst into loud sobs.
        - id: ch01-b61
          speaker: heidi
          text: >-
            Who can bring the light back? Can't anyone do it? Isn't there someone who can?
          emotion: sad
        - id: ch01-b62
          speaker: narrator
          text: >-
            Grandmother tried every way she knew to comfort her, but quieting Heidi was not easy. The child did not often cry. When she did, though, she could not quickly put her trouble aside. She went on sobbing bitterly, and the sound pierced Grandmother's heart. The old woman used every means she could think of to ease Heidi's grief. At last, she found something new to say.
        - id: ch01-b63
          speaker: grandmother
          text: >-
            Come sit by me, dear Heidi, and let me tell you something. When a person can't see anymore, a kind word can make her very glad. I love listening to you talk. So sit here and tell me about your life up there. What do you do? How does Grandfather spend his days? I knew him well long ago, but for years I've heard almost nothing except what Peter tells me, and Peter never says much.
        - id: ch01-b64
          speaker: narrator
          text: >-
            That gave Heidi a new and happy thought. She quickly dried her tears and spoke as if she could comfort Grandmother in return.
        - id: ch01-b65
          speaker: heidi
          text: >-
            Just wait until I tell Grandfather everything. I'm sure he'll bring the light back for you. And he'll do something so the house can't fall down. He'll make it all right.
          emotion: calm
        - id: ch01-b66
          speaker: narrator
          text: >-
            Grandmother said nothing. Heidi began a lively account of her life with Grandfather and all the days she spent on the mountain among the goats. Then she moved on to winter and everything she did at home. Grandfather could make all kinds of things. He had made seats and stools. He built hay mangers for Little Swan and Little Bear. There was a large new water tub waiting for Heidi to bathe in when summer came, as well as a new milk bowl and spoon. The longer Heidi talked, the more animated she became. To her, it was wonderful that Grandfather could take ordinary pieces of wood and turn them into so many beautiful and useful things. It seemed almost like magic. She told Grandmother how she stood beside him and watched every part of his work, and how she hoped that one day she would learn to make the same things herself.
        - id: ch01-b67
          speaker: narrator
          text: >-
            Grandmother listened to every word. From time to time, she turned to her daughter.
        - id: ch01-b68
          speaker: grandmother
          text: >-
            Do you hear that, Brigitta? Do you hear what she says about Uncle?
        - id: ch01-b69
          speaker: narrator
          text: >-
            A heavy thump at the door suddenly stopped their talk. Peter marched into the room, then stood perfectly still when he caught sight of Heidi. His eyes opened wide with astonishment. A moment later, she called out to him, and his whole face broke into a smile.
        - id: ch01-b70
          speaker: heidi
          text: >-
            Good evening, Peter!
        - id: ch01-b71
          speaker: grandmother
          text: >-
            Is the boy home from school already? I haven't known an afternoon to pass this quickly in years. Peter, how is your reading coming along?
          emotion: surprised
        - id: ch01-b72
          speaker: peter
          text: >-
            Same as before.
        - id: ch01-b73
          speaker: narrator
          text: >-
            Grandmother sighed softly.
        - id: ch01-b74
          speaker: grandmother
          text: >-
            Well, I hoped you'd have better news by now. You'll be twelve in February.
        - id: ch01-b75
          speaker: heidi
          text: >-
            What did you hope he would tell you?
        - id: ch01-b76
          speaker: grandmother
          text: >-
            I hoped he would have learned to read a little. There's an old prayer book on that shelf with beautiful songs in it. I haven't heard them for a long time, and I can't remember the words anymore. I hoped Peter would soon read one to me now and then, but reading is too hard for him.
        - id: ch01-b77
          speaker: brigitta
          text: >-
            I need a light. It's getting too dark to see my sewing. I don't know where the afternoon went either.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Heidi jumped up from her little chair and quickly held out her hand to Grandmother.
        - id: ch01-b79
          speaker: heidi
          text: >-
            Good night, Grandmother. If it's getting dark, I have to go home right now.
        - id: ch01-b80
          speaker: narrator
          text: >-
            She said goodbye to Peter and Brigitta and hurried toward the door. Grandmother called after her anxiously.
        - id: ch01-b81
          speaker: grandmother
          text: >-
            Wait, Heidi! You can't go alone. Peter must take you. Peter, be careful she doesn't fall, and keep her moving so she won't freeze. Do you hear me? Does she have anything warm for her neck?
          emotion: fearful
        - id: ch01-b82
          speaker: heidi
          text: >-
            I don't have anything to put on, but I'm sure I won't be cold!
        - id: ch01-b83
          speaker: narrator
          text: >-
            Heidi ran outside so fast that Peter could barely catch her. Still worried, Grandmother called to her daughter.
        - id: ch01-b84
          speaker: grandmother
          text: >-
            Run after her, Brigitta! That child will freeze to death tonight. Take my shawl and hurry!
          emotion: fearful
        - id: ch01-b85
          speaker: narrator
          text: >-
            Brigitta rushed out. The children had gone only a few steps when they saw Grandfather coming down to meet them. His long strides brought him to their side in a moment.
        - id: ch01-b86
          speaker: grandfather
          text: >-
            That's right, Heidi. You kept your word.
        - id: ch01-b87
          speaker: narrator
          text: >-
            He wrapped the sack securely around her, lifted her into his arms, and started up the mountain with long strides. Brigitta arrived just in time to see him do it. Then she and Peter went back into the cottage. Brigitta told her mother in amazement how Alm-Uncle had come for the child and carried her away so carefully. Grandmother was every bit as surprised as her daughter.
        - id: ch01-b88
          speaker: grandmother
          text: >-
            Thank God he's good to the child. Thank God! I wonder if he'll let her visit me again. She has done me so much good. What a loving little heart she has, and how cheerfully she tells her stories!
          emotion: happy
        - id: ch01-b89
          speaker: narrator
          text: >-
            Grandmother took pleasure in thinking about Heidi all the way to bedtime. Every so often, she spoke again.
        - id: ch01-b90
          speaker: grandmother
          text: >-
            If only she'll come back! Now I truly have something in the world to enjoy.
          emotion: happy
        - id: ch01-b91
          speaker: narrator
          text: >-
            Brigitta agreed with everything her mother said. Peter agreed too. Each time Grandmother spoke about Heidi, he nodded his head and wore a broad, satisfied smile.
        - id: ch01-b92
          speaker: peter
          text: >-
            That's what I told you!
        - id: ch01-b93
          speaker: narrator
          text: >-
            Meanwhile, Heidi chattered without stopping as Grandfather carried her up the mountain. She was still tucked deep inside the sack. Her voice could not make its way through all the thick folds wrapped around her, so Grandfather could not understand a single word she said.
        - id: ch01-b94
          speaker: grandfather
          text: >-
            Save it until we're home. Then you can tell me everything.
        - id: ch01-b95
          speaker: narrator
          text: >-
            The moment they entered the hut and Grandfather freed her from the sack, Heidi began.
        - id: ch01-b96
          speaker: heidi
          text: >-
            Grandfather, tomorrow we have to take your hammer and the long nails and fasten Grandmother's shutter. We need to hammer lots more nails into other places too, because her whole house shakes and rattles.
        - id: ch01-b97
          speaker: grandfather
          text: >-
            We have to, do we? Who told you that?
        - id: ch01-b98
          speaker: heidi
          text: >-
            Nobody told me, but I know. Everything is coming apart. Grandmother can't sleep because the noise frightens her. She thinks the house could fall on them at any moment. And everything is dark for her now. She doesn't think anyone can bring the light back, but I'm sure you can, Grandfather. It must be awful to live in the dark and be scared of the house, with no one but you who can help. We have to go tomorrow. We will, won't we?
        - id: ch01-b99
          speaker: narrator
          text: >-
            Heidi clung to him and looked up with complete trust. Grandfather gazed down at her for a while before he answered.
        - id: ch01-b100
          speaker: grandfather
          text: >-
            Yes, Heidi. We can at least stop the rattling. We'll go down and see to it tomorrow.
        - id: ch01-b101
          speaker: narrator
          text: >-
            Heidi skipped around the room for joy.
        - id: ch01-b102
          speaker: heidi
          text: >-
            We're going tomorrow! We're going tomorrow!
          emotion: happy
        - id: ch01-b103
          speaker: narrator
          text: >-
            Grandfather kept his promise. The very next afternoon, he brought the sleigh out again. Just as he had the day before, he carried Heidi down the mountain and stopped at Grandmother's cottage. He set her on the ground beside the door.
        - id: ch01-b104
          speaker: grandfather
          text: >-
            Go in now. When it gets dark, come back outside.
        - id: ch01-b105
          speaker: narrator
          text: >-
            He put the sack in the sleigh and walked around the cottage. Heidi had hardly opened the door and jumped inside when Grandmother called from her corner. In her delight, the thread fell from her fingers. The spinning wheel stopped as she reached out both hands.
        - id: ch01-b106
          speaker: grandmother
          text: >-
            It's the child again! She's come back!
          emotion: happy
        - id: ch01-b107
          speaker: narrator
          text: >-
            Heidi ran straight to her. She quickly pulled the little stool close to the old woman's side, sat down, and began telling her things and asking questions. All at once, heavy blows struck the cottage wall. Grandmother jumped in alarm so violently that she nearly knocked over her spinning wheel.
        - id: ch01-b108
          speaker: grandmother
          text: >-
            Oh, my God! It's happening now! The house is falling on us!
          emotion: fearful
        - id: ch01-b109
          speaker: narrator
          text: >-
            Heidi caught her arm and soothed her.
        - id: ch01-b110
          speaker: heidi
          text: >-
            No, no, Grandmother. Don't be scared. That's only Grandfather with his hammer. He's fixing everything so you won't have to be frightened anymore.
          emotion: calm
        - id: ch01-b111
          speaker: grandmother
          text: >-
            Can it be true? Is it really true? Then dear God has not forgotten us! Brigitta, do you hear that sound? Did you hear what Heidi said? Now that I listen, I know it's a hammer. Go outside, Brigitta. If it's Alm-Uncle, ask him to come in so I can thank him.
          emotion: surprised
        - id: ch01-b112
          speaker: narrator
          text: >-
            Brigitta went out and found Alm-Uncle fastening heavy pieces of new wood along the wall.
        - id: ch01-b113
          speaker: brigitta
          text: >-
            Good evening, Uncle. Mother and I want to thank you for this kindness. She'd like to tell you herself how grateful she is. I don't know who else would have helped us. We won't forget what you've done, because I'm sure—
        - id: ch01-b114
          speaker: grandfather
          text: >-
            That's enough. I know what you think of Alm-Uncle without hearing it. Go back inside. I can find what needs mending by myself.
        - id: ch01-b115
          speaker: narrator
          text: >-
            Brigitta obeyed at once. Uncle had a way of speaking that made few people care to oppose him. He continued around the cottage, hammering wherever the walls needed strengthening. Then he climbed the narrow steps to the roof and hammered there too. He kept working until he had used every nail he had brought. All the while, the daylight faded. By the time he climbed down from the roof and dragged the sleigh out from behind the goat shed, Heidi was already coming through the door.
        - id: ch01-b116
          speaker: narrator
          text: >-
            Grandfather wrapped Heidi up and took her in his arms, just as he had the day before. He still had to pull the sleigh behind him all the way up the mountain. Carrying her made the climb harder, but he was afraid that if the child sat alone in the sleigh, her wrappings would fall away. Then she might be nearly frozen before they reached the hut. So he carried her himself, keeping her warm and safe in his arms.
        - id: ch01-b117
          speaker: narrator
          text: >-
            And so the winter passed. After many years without much joy, blind Grandmother at last had something that made her happy. Before Heidi came, one weary day had followed another without pleasure or change. Now there was always something ahead to look forward to. As soon as morning came, Grandmother began listening for the quick sound of little feet. She waited for the cottage door to open. The moment she heard it and knew the child had really come, her whole day changed.
        - id: ch01-b118
          speaker: grandmother
          text: >-
            Thank God! She's here again!
          emotion: happy
        - id: ch01-b119
          speaker: narrator
          text: >-
            Heidi would sit beside her and talk. She told Grandmother everything she knew in such a lively way that the old woman never noticed the hours passing. In the old days, she had often asked Brigitta whether the day was not over yet. She never asked that question now. Instead, when Heidi finally left and the cottage door closed behind her, Grandmother could hardly believe the afternoon was gone.
        - id: ch01-b120
          speaker: grandmother
          text: >-
            How quickly the afternoon passed! Didn't it, Brigitta?
        - id: ch01-b121
          speaker: brigitta
          text: >-
            It certainly did. It feels as if I just cleared away our midday meal.
        - id: ch01-b122
          speaker: grandmother
          text: >-
            May God keep the child from being taken away, and may Alm-Uncle go on letting her come. Does she look healthy and strong, Brigitta?
        - id: ch01-b123
          speaker: brigitta
          text: >-
            She's as bright and rosy as an apple.
        - id: ch01-b124
          speaker: narrator
          text: >-
            Heidi had grown very fond of Grandmother too. At last, she understood for certain that no one could ever bring the light back to the old woman's eyes. The truth overcame her with sorrow. But Grandmother explained once more that the darkness troubled her much less whenever Heidi was beside her. Knowing that her visits helped gave Heidi a way to bear her sadness.
        - id: ch01-b125
          speaker: narrator
          text: >-
            So on every fine winter day, Heidi traveled down the mountain by sleigh. Grandfather always took her and never once objected. In fact, he brought his hammer and different tools along in the sleigh. Many an afternoon, while Heidi sat with Grandmother, he worked on the goatherd's cottage and made it strong and snug. Before long, the old house no longer groaned and rattled through the night. For many winters, Grandmother had been unable to sleep in peace. Now she could rest without lying awake in fear. She said she would never forget what Uncle had done for her.
