audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着从容的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    heidi:
      display_name: 海蒂
      tts:
        delivery: 天真直接，遇到新鲜事时满是好奇和喜悦
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 偏高
    grandfather:
      display_name: 外公
      tts:
        delivery: 简短沉稳，粗粝中渐渐透出关怀
        timbre: 低沉厚实
        pace: 不紧不慢
        pitch: 低音
    peter:
      display_name: 彼得
      tts:
        delivery: 朴实寡言，回答问题时略显迟缓
        timbre: 清亮而稍显粗朴
        pace: 稍慢
        pitch: 中音
    grandmother:
      display_name: 祖母
      tts:
        delivery: 慈爱温和，忧愁中带着虔诚与感激
        timbre: 苍老柔弱
        pace: 缓慢
        pitch: 中低音
    brigitta:
      display_name: 布丽吉塔
      tts:
        delivery: 朴素直率，带着操持家务的利落
        timbre: 温厚清晰
        pace: 适中
        pitch: 中音
    pastor:
      display_name: 牧师
      tts:
        delivery: 诚恳庄重，劝说时温和而坚定
        timbre: 温厚沉静
        pace: 从容
        pitch: 中低音
    dete:
      display_name: 德特
      tts:
        delivery: 精明爽利，热切时语速稍快
        timbre: 清脆鲜明
        pace: 偏快
        pitch: 中高音
    villagers:
      display_name: 村民们
      tts:
        delivery: 七嘴八舌，带着好奇和猜疑
        timbre: 混合人声
        pace: 轻快
        pitch: 中音
  chapters:
    - id: ch01
      title: 春日来客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一个冬天很快过去了，明亮快活的夏天过得更快，转眼又到了冬季将尽的时候。海蒂还是像鸟儿一样无忧无虑，也像它们一样快活。春天一天比一天近，她的盼望也一天比一天热切。很快，暖和的南风会穿过冷杉，吼叫着吹走积雪。温暖的太阳会引着蓝花和黄花探出脑袋，山上那些漫长的好日子也会重新回来。对海蒂来说，世上没有比这更快活的事。
        - id: ch01-b02
          speaker: narrator
          text: 海蒂已经八岁，从外公那里学会了许多有用的本领。她照料山羊一点也不比别人差。小天鹅和小熊总像两条忠实的小狗那样跟着她，一听到她的声音，就欢喜地高声咩咩叫。这个冬天，彼得两次带来多尔弗里校长的话。海蒂早过了通常入学的年纪，前一年冬天就该去学校了。外公每次都请彼得把自己的答复原样送回去，彼得也忠实地照办了。
        - id: ch01-b03
          speaker: grandfather
          text: 校长若有话对我说，来家里就能找到我。海蒂不会去学校。
        - id: ch01-b04
          speaker: narrator
          text: 三月的太阳融开山坡上的雪，雪滴花在山谷里到处探出头来。冷杉甩掉压在身上的积雪，又在风中欢快地摇动枝条。海蒂一会儿跑到羊棚，一会儿跑到树下，一会儿又冲到小屋门前，告诉外公冷杉下面那片绿地又大了多少。说完，她马上跑回去再看一眼。她实在等不及一切都变成绿色，等不及丰美的夏天给整座山铺满青草和鲜花。
        - id: ch01-b05
          speaker: narrator
          text: 一个晴朗的早晨，她至少第十次跳过水槽，忽然吓得差点向后跌进去。一个穿黑衣的老先生站在面前，正严肃地望着她。看见海蒂受惊，他的声音却很和气。
        - id: ch01-b06
          speaker: pastor
          text: 别怕，我很喜欢孩子。来，跟我握握手。你一定就是海蒂吧？你外公在哪里？
        - id: ch01-b07
          speaker: heidi
          text: 他坐在桌边，正在做圆木勺。
        - id: ch01-b08
          speaker: narrator
          text: 海蒂打开门。来人是多尔弗里的老牧师。外公从前住在村里时，两人做过邻居，十分熟悉。牧师走到正在低头干活的老人面前。
        - id: ch01-b09
          speaker: pastor
          text: 早安，老邻居。
        - id: ch01-b10
          speaker: narrator
          text: 外公惊讶地抬起头，站了起来，把自己的椅子推过去。
        - id: ch01-b11
          speaker: grandfather
          text: 早安。您若不嫌弃木头凳子，就坐吧。
        - id: ch01-b12
          speaker: pastor
          text: 老邻居，我们已经很久没见了。
        - id: ch01-b13
          speaker: grandfather
          text: 我也很久没见您了。
        - id: ch01-b14
          speaker: pastor
          text: 我今天想跟你谈件事。我想，你知道我为什么来。
        - id: ch01-b15
          speaker: narrator
          text: 牧师看向门边。海蒂站在那里，又好奇又惊讶地望着陌生人。
        - id: ch01-b16
          speaker: grandfather
          text: 海蒂，拿一点盐去喂山羊。待在那里，等我过去。
        - id: ch01-b17
          speaker: narrator
          text: 海蒂一转眼就跑得没影了。
        - id: ch01-b18
          speaker: pastor
          text: 这孩子一年前就该上学，去年冬天更该去。校长托人传过话，你却没有答复。你究竟打算怎么办？
        - id: ch01-b19
          speaker: grandfather
          text: 我不打算送她去学校。
        - id: ch01-b20
          speaker: narrator
          text: 牧师吃惊地望过去。老人双臂交叠，坐在长凳上，神情没有半点松动。
        - id: ch01-b21
          speaker: pastor
          text: 那你要让她怎样长大？
        - id: ch01-b22
          speaker: grandfather
          text: 她会在山羊和鸟儿中间快快乐乐地长大。跟它们在一起很安全，也学不到坏事。
        - id: ch01-b23
          speaker: pastor
          text: 可她不是山羊，也不是鸟儿，她是人。跟这些伙伴在一起，她学不到坏事，也同样什么都学不到。不能让她什么都不懂。现在就该开始念书了。我特意早些来，好让你整个夏天都能考虑和安排。这个冬天，是最后一次任她野跑。到了下个冬天，她必须每天到学校来。
        - id: ch01-b24
          speaker: grandfather
          text: 她绝不会去。
        - id: ch01-b25
          speaker: pastor
          text: 无论别人怎么劝，你都不肯讲道理，非要守着这个决定吗？你在外面闯荡过，见过许多事。我原以为你会更明理些。
          emotion: angry
        - id: ch01-b26
          speaker: grandfather
          text: 是吗？那么，尊敬的牧师真要我在下个冬天，让这么小的孩子一大早顶着刺骨寒风，在暴风雪里走几英里下山？还要她天黑以后，在狂风大作时再走回来？那样的风，就连你我这样的成年人都可能被刮倒，埋进雪里。您没有忘记她母亲阿德莱德吧？她会梦游，还会发病。若是逼孩子过度劳累，谁知道她会不会也犯同样的病？如今有人还想跑来逼我送她上学？我会把官司打遍这个国家的法庭，倒要看看谁能逼我！
          emotion: angry
        - id: ch01-b27
          speaker: pastor
          text: 你说得对。从这里送孩子去学校，确实办不到。可我看得出，你很疼她。那就为了她，去做你早该做的事吧。搬回多尔弗里，重新跟大家住在一起。你独自留在山上，心里怨着上帝，也怨着人，这过的算什么日子？万一你在这里出了事，身边连一个能帮你的人也没有。冬天住在这间小屋里，我真怕你会冻个半死，更不知道孩子究竟是怎么熬过来的。
        - id: ch01-b28
          speaker: grandfather
          text: 孩子血气旺，头上也有好屋顶。我知道到哪里找木柴，也知道什么时候去运。您尽管看看我的柴房。整个冬天，屋里的火一天也没熄过。要我搬下山，那不可能。村里人瞧不起我，我也瞧不起他们。分开过日子，对大家都好。
        - id: ch01-b29
          speaker: pastor
          text: 不，这样对你不好。我知道你缺的是什么。村里人并不像你想的那样厌恶你。听我一句，去跟上帝和解。该求宽恕的地方，就求他宽恕。然后回到村里看看吧。人们会用另一种眼光看你，你往后的日子也会幸福得多。
        - id: ch01-b30
          speaker: narrator
          text: 牧师站起来，向老人伸出了手，语气比刚才更加恳切。
        - id: ch01-b31
          speaker: pastor
          text: 我敢打赌，明年冬天你会回到我们中间，我们还会像从前一样做好邻居。我实在不愿看到别人用强硬的办法对付你。握住我的手，答应我搬回来，跟上帝和人们重归于好吧。
        - id: ch01-b32
          speaker: narrator
          text: 阿尔姆大叔握了握牧师的手，回答得平静又坚定。
        - id: ch01-b33
          speaker: grandfather
          text: 我知道您是为我好。可您想要的答复，我今天这样说，以后也不会改变。我不送孩子去学校，也不搬去跟你们同住。
        - id: ch01-b34
          speaker: pastor
          text: 那么，愿上帝帮助你吧！
          emotion: sad
        - id: ch01-b35
          speaker: narrator
          text: 牧师伤心地转过身，离开小屋，下山去了。
    - id: ch02
      title: 德特的好机会
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 阿尔姆大叔的心情坏透了。那天下午，海蒂像往常一样问能不能去看祖母，他只说今天不去，接着一整天没再开口。第二天早上，海蒂又问起同一件事，他只回答再看看。可午饭的碗还没收拾走，另一位客人已经来到门前。这一次是德特表姨。
        - id: ch02-b02
          speaker: narrator
          text: 德特头上戴着一顶漂亮的羽毛帽，身上的长裙一路拖在地上，进门便扫过整片地板。可牧羊人小屋的地上，有许多东西无论如何都不该沾到裙子上。外公从头到脚看了她一遍，一个字也没说。德特却早就准备好一大篇亲热的话，一坐下便滔滔不绝地说了起来。
        - id: ch02-b03
          speaker: narrator
          text: 她一开口就夸海蒂长得真好，自己几乎认不出来了。孩子跟着外公显然很快活，也受到了很好的照料。不过，德特说，她从没放下过把孩子接走的念头。她明白，这么个小东西一定很碍老人的事，只是当初实在没有办法。她日夜都在琢磨，怎样才能替海蒂找个安身的地方。今天她赶来，正因为终于等到了一个好得不能再好的机会，简直超过了海蒂最大胆的梦想。
        - id: ch02-b04
          speaker: narrator
          text: 德特服侍的人家有几位极富有的亲戚，在法兰克福附近住着一座华丽的大房子。他们只有一个女儿。女孩年纪小，身体又弱，总得坐着轮椅来来去去。她平日十分寂寞，上课时也没有伙伴，日子过得很无聊。她父亲便请德特的女主人帮忙，想给女儿找个伴。德特的女主人很同情他们，也一心想帮成这件事。
        - id: ch02-b05
          speaker: narrator
          text: 那家的女管家把要求说得很清楚。他们想要一个心地单纯、没受过坏影响的孩子，可不能像如今常见的那些孩子。德特马上想到了海蒂，一刻也没耽搁，赶去把海蒂的情形告诉她。女管家当场就答应收下孩子。谁知道海蒂会交上怎样的大运呢？只要她进了那户人家，他们又喜欢上她。要是他们病弱的亲生女儿出了什么事，毕竟谁也说不准。要是他们又觉得家里不能没有孩子，那么这份运气简直大得没人敢想——
        - id: ch02-b06
          speaker: grandfather
          text: 你的话快说完了吗？
        - id: ch02-b07
          speaker: dete
          text: 哼！听你的口气，倒像我说的是再平常不过的小事！整个普雷蒂高，谁要是听见我带来这样的好消息，不会感谢上帝？
          emotion: disgusted
        - id: ch02-b08
          speaker: grandfather
          text: 你爱把消息带给谁就带给谁，我不要。
        - id: ch02-b09
          speaker: narrator
          text: 德特像火箭一样从座位上蹿了起来。
        - id: ch02-b10
          speaker: dete
          text: 你若只有这句话，我也得让你听听我的话！海蒂已经八岁，却什么都不知道，你还不让她学。村里人说，你不送她去教堂，也不送她去学校。她是我亲姐姐的孩子，我得为她负责。这样好的出路摆在眼前，只有谁都不在乎、谁的好处也不肯成全的人，才会把它推开！
          emotion: angry
        - id: ch02-b11
          speaker: dete
          text: 我绝不会让步。多尔弗里人人都站在我这边，谁都会帮我对付你。你若想告上法庭，最好先想清楚。有些旧事一旦被翻出来，只怕你自己也不愿听！
          emotion: angry
        - id: ch02-b12
          speaker: grandfather
          text: 住口！滚出去！以后别让我再看见你戴着那顶羽毛帽，嘴里还说着今天这种话！
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 大叔眼里冒着怒火，说完便大步走出了小屋。海蒂用黑眼睛瞪着德特，目光一点也不友善。
        - id: ch02-b14
          speaker: heidi
          text: 你把外公惹生气了。
        - id: ch02-b15
          speaker: dete
          text: 他一会儿就消气了。来，告诉我你的衣服放在哪儿。
        - id: ch02-b16
          speaker: heidi
          text: 我不去。
        - id: ch02-b17
          speaker: dete
          text: 别胡说。你跟你外公一样不懂事。去了以后，你会得到好多从没想过的好东西。
        - id: ch02-b18
          speaker: narrator
          text: 德特走到柜子边，把海蒂的衣服拿出来卷成一包。
        - id: ch02-b19
          speaker: dete
          text: 快走。你的帽子在这儿，虽然旧了点，眼下还能戴。戴上它，我们得赶紧出发。
        - id: ch02-b20
          speaker: heidi
          text: 我不去。
        - id: ch02-b21
          speaker: dete
          text: 别像山羊一样又蠢又倔，准是跟它们学的。你刚才也听见了，外公生气地说再也不想看见我们。他就是要你跟我走。你可别再惹他发火。法兰克福好玩极了，还有好多新鲜东西。若是不喜欢，你再回来就是了。到那时，外公早就不生气了。
        - id: ch02-b22
          speaker: heidi
          text: 那我能马上回来，今天晚上就到家吗？
        - id: ch02-b23
          speaker: dete
          text: 你说什么呢？快走吧！你想什么时候回来都可以。今天先到迈恩费尔德，明早坐火车。以后你想回家，火车很快就能送你回来，它跑得跟风一样快。
        - id: ch02-b24
          speaker: narrator
          text: 德特把衣服包夹在腋下，牵住海蒂，两个人就这样下山去了。
    - id: ch03
      title: 没来得及告别
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这时节还不能赶羊上山，彼得仍得去多尔弗里上学。不过他偶尔也会偷上一天懒，不去学校。他一点也看不出学认字有什么用。相比之下，到处走一走，找些日后也许派得上用场的结实木棍，在他眼里才是更好的活儿。
        - id: ch03-b02
          speaker: narrator
          text: 德特和海蒂快走到祖母家时，正遇见彼得从屋角转出来。他肩上扛着一大捆又长又粗的榛木棍，看来今天收获不小。他站住脚，盯着走来的两个人。
        - id: ch03-b03
          speaker: peter
          text: 海蒂，你要去哪里？
        - id: ch03-b04
          speaker: heidi
          text: 我只是跟德特去法兰克福玩几天。不过我得先进去看祖母，她正等着我呢。
        - id: ch03-b05
          speaker: dete
          text: 不行，不能停，已经太晚了。回来以后再看她，现在一定得走。
        - id: ch03-b06
          speaker: narrator
          text: 海蒂挣扎着想跑开，德特却紧紧抓着她继续走。她怕一松手，孩子又会不肯离开，也怕祖母站到海蒂那一边。彼得冲进屋，把肩上的木棍狠狠撞在桌上。整间屋子都震动了，桌上的东西也跟着乱晃。祖母惊叫一声，从纺车旁跳了起来。布丽吉塔也被吓得离开座位。彼得心里的难受实在无处安放，总得用什么法子发泄出来。
        - id: ch03-b07
          speaker: grandmother
          text: 出什么事了？到底出什么事了？
          emotion: fearful
        - id: ch03-b08
          speaker: brigitta
          text: 怎么了，彼得？为什么这样粗鲁？
        - id: ch03-b09
          speaker: peter
          text: 她要把海蒂带走。
        - id: ch03-b10
          speaker: grandmother
          text: 谁要带她走？带到哪儿去，彼得？
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: 祖母话还没说完，已经猜到了。布丽吉塔不久前才看见德特往阿尔姆大叔那里走。老人赶紧起身，用发抖的手推开窗户，朝外面苦苦喊着。
        - id: ch03-b12
          speaker: grandmother
          text: 德特，德特，别把孩子从我们身边带走！别带走她！
          emotion: sad
        - id: ch03-b13
          speaker: narrator
          text: 山路上的两个人都听见了。德特把海蒂的手抓得更紧。海蒂拼命挣扎，想要挣脱。
        - id: ch03-b14
          speaker: heidi
          text: 祖母在叫我，我一定得去看她！
        - id: ch03-b15
          speaker: narrator
          text: 德特怎么也不肯放手，只管想办法哄她。她说，现在不快走就会太迟，第二天也去不成法兰克福。到了那里，海蒂自然会知道那地方多么好玩。德特敢说，她去了以后便不愿回来。不过，要是孩子想家，也能马上回去，还可以挑一样自己喜欢的东西带给祖母。海蒂从没想过还能从法兰克福给祖母带回礼物。这个新念头让她十分高兴，德特再拉她赶路，就一点也不费力了。
        - id: ch03-b16
          speaker: narrator
          text: 两个人安静地走了一会儿，海蒂开口问道。
        - id: ch03-b17
          speaker: heidi
          text: 我能给祖母带什么呢？
        - id: ch03-b18
          speaker: dete
          text: 得挑一样好东西。就带一只松软的白面包吧。她年纪大了，硬黑面包几乎咬不动，一定会喜欢这个。
        - id: ch03-b19
          speaker: heidi
          text: 对，她总把黑面包还给彼得，说太硬了，我亲眼看见过。那我们快点走！说不定能早点从法兰克福回来，我今天就能把白面包送给她。
        - id: ch03-b20
          speaker: narrator
          text: 海蒂飞跑起来，快得让腋下夹着包裹的德特几乎跟不上。德特倒很高兴。多尔弗里就在前面，她的熟人们很可能拦下她们问个没完。那些话要是落进海蒂耳朵里，说不定会让孩子生出别的主意。德特便一路紧紧牵住海蒂，笔直穿过村子。她还特意让所有人看见，自己赶得这样急全是为了孩子。无论旁人问什么、说什么，她都不停脚，只在走过时匆匆回答。
        - id: ch03-b21
          speaker: dete
          text: 你们看，我不能停下。我们还有很远的路，我得赶紧带孩子走。
        - id: ch03-b22
          speaker: villagers
          text: 你要把她带走吗？她是从阿尔姆大叔那里逃出来的吗？真没想到她还活着！瞧她的脸蛋多红润呀！
        - id: ch03-b23
          speaker: narrator
          text: 四周的话声不断传来。德特暗自庆幸，自己用不着停下来，把事情明明白白解释给他们听。海蒂一句话也不说，只一心想着赶快走完这段路，早些去法兰克福，也早些把白面包带回来。
    - id: ch04
      title: 留在山上的老人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 从那天起，阿尔姆大叔每次下山走过多尔弗里，看起来都比以往更凶，更难接近。他从不跟人说话。背上是一包奶酪，手里是一根大木棍，浓眉紧紧皱着。他大步走来，活像一个吓人的怪物。女人们一看见他，就赶紧招呼孩子。
        - id: ch04-b02
          speaker: villagers
          text: 当心！快给阿尔姆大叔让路，不然他会伤害你们！
        - id: ch04-b03
          speaker: narrator
          text: 老人谁也不理，只管大步穿过村子，到下面的山谷卖掉奶酪，再买回自己需要的面包和肉。他走远以后，村民们便挤在一起，望着他的背影议论。每个人都有话要说。有人说，他比从前更野蛮了。有人说，他如今连问候都不肯回应。说到最后，大家都觉得孩子能离开他，实在是上天保佑。
        - id: ch04-b04
          speaker: villagers
          text: 幸亏孩子逃了出来。你们没看见吗？她那天走得那么快，准是怕外公追来，把她抓回去！
        - id: ch04-b05
          speaker: narrator
          text: 只有失明的祖母不肯说大叔一句坏话。有人给她送活儿，或来拿她纺好的线，她总会告诉他们，老人待海蒂多么慈爱体贴，待她和布丽吉塔又多么好。她还会细细说起，大叔怎样花了许多个下午修补这座房子。要不是他肯来帮忙，破屋如今一定已经塌下来，压在她们头上了。
        - id: ch04-b06
          speaker: narrator
          text: 祖母说的这些话，也一句句传到了多尔弗里。可大多数人听完都不相信。他们说，祖母年纪太大，脑子已经糊涂，多半连别人告诉她的话也没有听清。她既然看不见东西，他们便认定，她的耳朵大概也已经聋了。
        - id: ch04-b07
          speaker: narrator
          text: 阿尔姆大叔从此再也没去祖母家。幸好，他早已把那座房子修得牢牢的，因为在后来的很长一段日子里，再也没有人来修碰过它。失明的老妇人又回到了从前那些悲伤的日子，也再听不到海蒂轻快的脚步声。如今没有一天，她不低声抱怨，不哀叹海蒂已经离开。
        - id: ch04-b08
          speaker: grandmother
          text: 唉，我们所有的幸福和快乐，都跟着这孩子走了。如今每天都没有欢喜，也没有一点变化，日子又长又凄凉！求上帝让我在死前，再见海蒂一面吧！
          emotion: sad
