  chapters:
    - id: ch01
      title: Spring and the Visitor
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Winter passed quickly, and the bright, happy summer seemed to pass even faster. Then another winter came and was nearly over. Heidi was still as cheerful as the birds. Every day she looked forward to spring a little more. Soon the warm south wind would roar through the fir trees and carry away the snow. The sun would coax out the blue and yellow flowers. Then the long days on the mountain would return, and to Heidi, there was no greater joy on earth.
        - id: ch01-b02
          speaker: narrator
          text: Heidi was eight now. Grandfather had taught her all kinds of useful things, and she could care for the goats as well as anyone. Little Swan and Bear followed her like faithful dogs. The moment they heard her voice, they greeted her with loud, delighted bleats. Twice during that last winter, Peter had climbed up with a message from the schoolmaster in Dorfli. Heidi was already past the usual age for beginning school. In fact, she should have started the winter before. Each time, Grandfather gave Peter the same reply. If the schoolmaster had something he wanted to say, he knew where to find Grandfather. But Grandfather did not intend to send Heidi to school. Peter faithfully carried the answer back.
        - id: ch01-b03
          speaker: narrator
          text: By March, the sun had melted the snow from the mountainside. Snowdrops peeped up all through the valley. The fir trees had shaken off their heavy snow, and their branches waved merrily in the air again. One sunny morning, Heidi raced from the goat shed to the trees and then back to the hut door. She had to tell Grandfather that the green patch under the firs was larger now. As soon as she had told him, away she ran to look again. Waiting was almost impossible. She wanted everything to be green, with the mountain dressed for summer in grass and flowers.
        - id: ch01-b04
          speaker: narrator
          text: After jumping over the water trough for what must have been the tenth time, Heidi nearly tumbled backward into it. An old gentleman dressed in black stood right in front of her, watching her gravely.
        - id: ch01-b05
          speaker: pastor
          text: You don't need to be frightened. I like children very much. Come, shake my hand. You must be the Heidi I've heard about. Where is your grandfather?
        - id: ch01-b06
          speaker: heidi
          text: He's inside at the table, making round wooden spoons.
        - id: ch01-b07
          speaker: narrator
          text: Heidi opened the door. The visitor was the old pastor from Dorfli. Years before, when Grandfather had lived in the village, the two men had been neighbors and had known each other well. The pastor walked into the hut and approached the old man, who was bent over his work.
        - id: ch01-b08
          speaker: pastor
          text: Good morning, neighbor.
        - id: ch01-b09
          speaker: narrator
          text: Grandfather looked up, surprised, and rose from his seat.
        - id: ch01-b10
          speaker: grandfather
          text: Good morning. If a wooden chair will suit you, have a seat.
        - id: ch01-b11
          speaker: narrator
          text: He pushed the chair toward his guest, and the pastor sat down.
        - id: ch01-b12
          speaker: pastor
          text: It's been a long while since I've seen you, neighbor.
        - id: ch01-b13
          speaker: grandfather
          text: And since I've seen you.
        - id: ch01-b14
          speaker: pastor
          text: I've come because there's something we need to discuss. I expect you already know what brought me here.
        - id: ch01-b15
          speaker: narrator
          text: As he spoke, the pastor looked toward Heidi. She stood by the door, studying the stranger with surprise and interest.
        - id: ch01-b16
          speaker: grandfather
          text: Heidi, go see the goats. Take them a little salt, and stay there until I come for you.
        - id: ch01-b17
          speaker: narrator
          text: Heidi disappeared at once.
    - id: ch02
      title: The Pastor's Plea
      blocks:
        - id: ch02-b01
          speaker: pastor
          text: The child should have started school a year ago, and she certainly should have gone this past winter. The schoolmaster sent word, but you never answered him. What do you mean to do with her, neighbor?
        - id: ch02-b02
          speaker: grandfather
          text: I mean to keep her out of school.
        - id: ch02-b03
          speaker: narrator
          text: The pastor stared at him. Grandfather sat on his bench with his arms crossed. Everything about him said that his mind was made up.
        - id: ch02-b04
          speaker: pastor
          text: Then how do you expect her to grow up?
        - id: ch02-b05
          speaker: grandfather
          text: She'll grow up happy with the goats and the birds. She's safe with them, and they won't teach her anything bad.
        - id: ch02-b06
          speaker: pastor
          text: But she's a child, not a goat or a bird. Those companions may teach her nothing bad, but they'll teach her nothing at all. She mustn't grow up knowing nothing. It's time for her lessons. I've come now so you'll have the whole summer to think and make arrangements. This is the last winter she can be left to run wild. Next winter, she must attend school every day.
        - id: ch02-b07
          speaker: grandfather
          text: She will not.
          emotion: calm
        - id: ch02-b08
          speaker: narrator
          text: His voice was calm, but there was no moving him.
        - id: ch02-b09
          speaker: pastor
          text: So nothing anyone says will make you listen to reason? You'll hold to this decision out of pure stubbornness? You've traveled through the world. You must have seen and learned a great deal. I expected better sense from you, neighbor.
          emotion: angry
        - id: ch02-b10
          speaker: grandfather
          text: Did you? Then tell me this. Do you truly expect me to send a little child miles down the mountain on freezing winter mornings, through storms and snow? Should she come home at night with the wind raging so hard that even grown men could be knocked down and buried? Perhaps you've forgotten her mother, Adelaide. She walked in her sleep and had fits. What if the strain brought the same illness on Heidi? And someone thinks he can force me to send her? I'll go before every court in the country. Then we'll see who can force me!
          emotion: angry
        - id: ch02-b11
          speaker: pastor
          text: You're right about that, neighbor. I see now that she couldn't attend school while living up here. But I can also see how dear she is to you. For her sake, do what you should have done long ago. Move back to Dorfli and live among other people again. What kind of life is this, alone up here with bitter thoughts against God and everyone else? If something happened to you, who would help? I can't imagine how you keep from freezing in this hut, much less how the child survives the winter.
        - id: ch02-b12
          speaker: grandfather
          text: The child is young and strong, and she has a sound roof above her. I know where to find wood and when to bring it home. Look in my woodshed if you like. The fire in this hut never goes out all winter. And I have no thought of living below. The people despise me, and I despise them. We're all better off apart.
        - id: ch02-b13
          speaker: pastor
          text: No, that isn't better for you. I know what you need. The villagers don't dislike you nearly as much as you imagine. Believe me, neighbor. Make peace with God. Ask forgiveness where you need it. Then come and see how differently people treat you, and how happy your life might still become.
        - id: ch02-b14
          speaker: narrator
          text: The pastor rose and held out his hand. Then he spoke again with fresh urgency.
        - id: ch02-b15
          speaker: pastor
          text: I'll wager that by next winter you'll be living among us again, and we'll be good neighbors as we once were. I would be deeply sorry if anyone had to use force. Give me your hand. Promise you'll come back to us and make peace with God and your fellow men.
        - id: ch02-b16
          speaker: narrator
          text: Grandfather took the pastor's hand, but his answer stayed calm and firm.
        - id: ch02-b17
          speaker: grandfather
          text: I know you mean well. But I won't do what you're asking. I will not send the child to school, and I will not come live among you.
          emotion: calm
        - id: ch02-b18
          speaker: pastor
          text: Then may God help you.
          emotion: sad
        - id: ch02-b19
          speaker: narrator
          text: The pastor turned away sadly, left the hut, and went down the mountain.
    - id: ch03
      title: Dete's Great Opportunity
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Grandfather was in a dark mood. That afternoon, Heidi asked the question she always asked.
        - id: ch03-b02
          speaker: heidi
          text: Can we go down to Grandmother's now?
        - id: ch03-b03
          speaker: grandfather
          text: Not today.
        - id: ch03-b04
          speaker: narrator
          text: He said nothing more for the rest of the day. The next morning, Heidi asked again.
        - id: ch03-b05
          speaker: grandfather
          text: We'll see.
        - id: ch03-b06
          speaker: narrator
          text: Before the dinner bowls had been cleared away, another visitor appeared. This time it was Cousin Dete. A fine feathered hat sat on her head, and the long train of her dress swept across the floor. A goatherd's hut floor held all sorts of things that had no business clinging to a fine dress.
        - id: ch03-b07
          speaker: narrator
          text: Grandfather looked her up and down without a word. Dete had come prepared with an extremely pleasant speech. She began by praising Heidi's appearance.
        - id: ch03-b08
          speaker: dete
          text: Why, she looks so well I almost wouldn't know her! Anyone can see she's been happy here and that you've cared for her properly. Still, I've never stopped thinking about taking her back. I understand perfectly that a little child must often get in your way. I simply wasn't able to take her at first. Since then, I've thought day and night about how I might find a place for her. That's exactly why I've come today. I've just heard of an opportunity for Heidi that's better than anything even the most ambitious person could have hoped for.
        - id: ch03-b09
          speaker: dete
          text: Some immensely wealthy relatives of the family I work for live in a magnificent house near Frankfurt. They have only one daughter. She's young and sickly and always has to get around in a wheeled chair. That leaves her very much alone. She has no one to share her lessons with, and she gets terribly bored. Her father asked my mistress to help him find a companion for the girl. My mistress feels deeply for the family and is eager to help. The housekeeper explained exactly what sort of child they want. She must be simple and unspoiled, not like most children you see nowadays.
        - id: ch03-b10
          speaker: dete
          text: Of course, I thought of Heidi at once. I went off without delay to speak with the housekeeper. As soon as I had described Heidi, she agreed to take her. And no one can possibly tell what good fortune may be waiting for the child. Suppose the family takes a great liking to her. Then suppose something happens to their own daughter, because one never knows with a child so weak. If afterward they feel they cannot live without a child in the house, why, Heidi might receive the most unheard-of good fortune—
        - id: ch03-b11
          speaker: grandfather
          text: Are you almost finished?
        - id: ch03-b12
          speaker: dete
          text: Ugh! You'd think I was telling you about some everyday matter. There isn't a soul in all Prättigau who wouldn't thank God if I brought them news like this.
          emotion: disgusted
        - id: ch03-b13
          speaker: grandfather
          text: Take your news to anyone you please. I want no part of it.
        - id: ch03-b14
          speaker: narrator
          text: Dete shot up from her chair as if she had been launched into the air.
        - id: ch03-b15
          speaker: dete
          text: If that's your only answer, then you'll hear what I think. The child is eight years old and knows nothing, yet you refuse to let her learn. You won't send her to church or school. That's what I was told down in Dorfli. She is my own sister's child, and I am responsible for whatever happens to her. Here is a wonderful opening for the child, the sort that may never come twice. Only someone who cares for nobody and never wishes anyone well would refuse to seize it.
          emotion: angry
        - id: ch03-b16
          speaker: dete
          text: Well, I won't give in, and you may count on that. Everyone in Dorfli is on my side. There isn't one person there who wouldn't take my part against you. So think very carefully before you bring this into court, if that's what you intend to do. Certain things may be brought up that you would not care to hear again. Once the courts become involved, they rake up a great deal that everyone thought had long been forgotten.
          emotion: angry
        - id: ch03-b17
          speaker: grandfather
          text: Be quiet! Get out, and be done with you! Never let me see you again with that feathered hat and words like those on your tongue!
          emotion: angry
        - id: ch03-b18
          speaker: narrator
          text: Grandfather's voice thundered, and his eyes flashed. Then he strode out of the hut.
        - id: ch03-b19
          speaker: heidi
          text: You've made Grandfather angry.
        - id: ch03-b20
          speaker: narrator
          text: Heidi's dark eyes were anything but friendly as she looked at Dete.
        - id: ch03-b21
          speaker: dete
          text: He'll get over it soon. Come on now. Show me where your clothes are.
        - id: ch03-b22
          speaker: heidi
          text: I'm not going.
        - id: ch03-b23
          speaker: dete
          text: Don't talk nonsense. Come, come. You understand no better than your grandfather. You'll have all kinds of wonderful things you've never even dreamed about.
        - id: ch03-b24
          speaker: narrator
          text: Dete went to the cupboard, took out Heidi's clothes, and rolled them into a bundle.
        - id: ch03-b25
          speaker: dete
          text: Now come along. There's your hat. It's terribly shabby, but it'll do for now. Put it on, and let's hurry.
        - id: ch03-b26
          speaker: heidi
          text: I'm not going.
        - id: ch03-b27
          speaker: dete
          text: Don't be a foolish, stubborn little goat. I suppose you learned that from the goats. Now listen to me. You saw how angry your grandfather was, and you heard him say he never wanted to see us again. That means he wants you to go away with me. You mustn't stay and make him angrier still. You have no idea how nice Frankfurt is or how many things you'll see there. And if you don't like it, you can always come back. By then, your grandfather will be in a good temper again.
        - id: ch03-b28
          speaker: heidi
          text: Can I come right back and be home again this evening?
        - id: ch03-b29
          speaker: dete
          text: What are you talking about? Come along! I've told you, you can return whenever you like. Today we'll go as far as Mayenfeld. Early tomorrow, we'll take the train. Whenever you want to come home, that train will bring you back in no time. It goes as fast as the wind.
        - id: ch03-b30
          speaker: narrator
          text: With the bundle under one arm and Heidi held by the hand, Dete started down the mountain with her.
    - id: ch04
      title: Down the Mountain
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: It was still too early in the year for Peter to take the goats out, so he was supposed to be attending school in Dorfli. Now and then, though, he gave himself a day off. He saw no use in learning to read. Wandering around in search of strong sticks that might be useful someday seemed far better to him.
        - id: ch04-b02
          speaker: narrator
          text: As Dete and Heidi came near Grandmother's hut, Peter appeared around the corner. His search had gone very well. An enormous bundle of long, thick hazel sticks rested on his shoulders. He stopped and stared at the two figures coming toward him.
        - id: ch04-b03
          speaker: peter
          text: Where are you going, Heidi?
        - id: ch04-b04
          speaker: heidi
          text: I'm only going to Frankfurt for a short visit with Dete. But first I have to run in and see Grandmother. She'll be waiting for me.
        - id: ch04-b05
          speaker: dete
          text: No, you can't stop and talk. It's already too late.
        - id: ch04-b06
          speaker: narrator
          text: Heidi struggled to pull away, but Dete held her hand tightly.
        - id: ch04-b07
          speaker: dete
          text: You can visit when you come back. Right now, you have to keep moving.
        - id: ch04-b08
          speaker: narrator
          text: Dete pulled Heidi onward. She was afraid that if the child went inside, Heidi might decide once more not to leave, and Grandmother might support her.
        - id: ch04-b09
          speaker: narrator
          text: Peter rushed into the hut. He slammed his bundle of sticks against the table so hard that everything shook. Grandmother sprang from her spinning wheel with a frightened cry. Peter had needed some way to let out what he felt.
        - id: ch04-b10
          speaker: grandmother
          text: What is it? What's happened?
          emotion: fearful
        - id: ch04-b11
          speaker: brigitta
          text: Peter, what is wrong? Why are you being so rough?
        - id: ch04-b12
          speaker: peter
          text: Because she's taking Heidi away.
        - id: ch04-b13
          speaker: grandmother
          text: Who is? Where are they taking her, Peter? Where?
          emotion: fearful
        - id: ch04-b14
          speaker: narrator
          text: Even while she asked, Grandmother knew. Brigitta had told her a short while before that she had seen Dete climbing toward Grandfather's hut. The old woman hurried to her feet, opened the window with trembling hands, and called out desperately.
        - id: ch04-b15
          speaker: grandmother
          text: Dete! Dete! Please don't take the child away from us! Don't take her away!
          emotion: sad
        - id: ch04-b16
          speaker: narrator
          text: Dete and Heidi heard her from farther down the mountain. Dete plainly understood the words, because her grip tightened.
        - id: ch04-b17
          speaker: heidi
          text: Grandmother's calling me! I have to go to her.
        - id: ch04-b18
          speaker: narrator
          text: Heidi fought to get free, but Dete had no intention of releasing her. She tried every way she could to quiet the child. They had to hurry now, she said, or they would arrive too late and miss their chance to leave for Frankfurt the next day. Once Heidi saw how delightful the city was, Dete felt sure she would not want to come home at all. Still, if Heidi did want to return, she could come straight back. Better yet, she could choose something she liked and bring it home to Grandmother.
        - id: ch04-b19
          speaker: narrator
          text: That thought was new to Heidi, and it pleased her so much that Dete had no more trouble leading her on. After a few quiet minutes, Heidi spoke.
        - id: ch04-b20
          speaker: heidi
          text: What could I bring back for her?
        - id: ch04-b21
          speaker: dete
          text: We'll think of something nice. Maybe a soft white roll. She would enjoy that. She's old now, and the hard black bread is difficult for her to eat.
        - id: ch04-b22
          speaker: heidi
          text: It is too hard for her. She always gives it back to Peter. I've seen her do it. Oh, let's hurry! Maybe we can come back from Frankfurt soon, and I can give her the white bread today.
        - id: ch04-b23
          speaker: narrator
          text: Heidi set off at a run so fast that Dete could barely keep up with the bundle tucked under her arm. Even so, Dete was glad they were moving quickly. They were close to Dorfli now. Her friends there would probably stop them with questions, and their talk might put different ideas into Heidi's head. The sooner Dete got the child through the village, the better.
        - id: ch04-b24
          speaker: narrator
          text: Dete went straight through the village without slowing down. She kept a tight hold on Heidi's hand so that everyone watching would think she had to hurry on the child's account. People called questions and comments after them from both sides of the road. Dete answered as she passed, never giving anyone the chance to stop her.
        - id: ch04-b25
          speaker: dete
          text: I can't stop, as you can see. I must hurry with the child. We still have a long way to go.
        - id: ch04-b26
          speaker: villager_1
          text: Are you taking her away?
        - id: ch04-b27
          speaker: villager_2
          text: Is she running away from Alm-Uncle?
        - id: ch04-b28
          speaker: villager_3
          text: It's a wonder she's still alive!
        - id: ch04-b29
          speaker: villager_4
          text: But look at those rosy cheeks!
        - id: ch04-b30
          speaker: narrator
          text: The questions and remarks followed them from every side as they crossed Dorfli. Dete was thankful that she did not have to stop and give anyone a clear answer about what she was doing. She kept moving at the same quick pace, still holding firmly to Heidi's hand. Heidi gave the villagers no answer at all. Her mind was on getting to Frankfurt and bringing the soft white bread home to Grandmother, so she hurried eagerly onward without a word.
    - id: ch05
      title: After Heidi Was Gone
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: From that day on, Alm-Uncle looked fiercer and more forbidding than ever whenever he came through Dorfli. He spoke to no one. With a pack of cheeses on his back, his huge stick in one hand, and his heavy eyebrows drawn into a frown, he looked so frightening that the women called warnings to their children.
        - id: ch05-b02
          speakers: [villager_1, villager_2, villager_3, villager_4]
          ensemble: chorus
          text: Be careful! Get out of Alm-Uncle's way, or he may hurt you!
        - id: ch05-b03
          speaker: narrator
          text: The old man paid attention to no one. He strode through the village and continued toward the valley below. There he sold his cheeses and bought the bread and meat he needed for himself. As soon as he had passed, the villagers crowded together behind him and watched him go. Every person had something to say. How much wilder he looked than before. How he would no longer answer even the simplest greeting.
        - id: ch05-b04
          speaker: narrator
          text: Soon they all agreed on one thing. It was a great mercy that the child had gotten away from him. Hadn't every one of them seen how Heidi hurried through the village? To them, it looked as if she were afraid her grandfather might come after her and carry her back up the mountain.
        - id: ch05-b05
          speaker: narrator
          text: Only the blind grandmother refused to say a word against him. People came to her hut to bring more work or collect what she had spun. She told every one of them how kind and thoughtful Grandfather had been with Heidi. He had been just as good to Grandmother herself and to Brigitta. Many afternoons, he had come down and worked to mend their house. If he had not helped them, she said, the whole place would surely have fallen over their heads by now.
        - id: ch05-b06
          speaker: narrator
          text: Everything Grandmother said was repeated down in Dorfli. Most of those who heard it only dismissed her. She was too old to understand, they said. Very likely, she had not heard correctly in the first place. Since she was blind, they decided she must probably be deaf as well.
        - id: ch05-b07
          speaker: narrator
          text: Alm-Uncle stopped going to Grandmother's house. It was fortunate that he had made the building so safe, because it would not be touched again for a long while. For the old blind woman, the days became sad once more. Heidi's visits had brought her happiness and pleasure, and now both were gone. Not a single day passed without the same grieving murmur.
        - id: ch05-b08
          speaker: grandmother
          text: Oh, all our happiness and joy went away with the child. Now the days are so long and lonely. Please, God, let me see Heidi once more before I die.
          emotion: sad
