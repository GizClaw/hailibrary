audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "温暖细腻，带着从容的讲故事感", timbre: 清澈柔和, pace: 舒缓而富有变化, pitch: 中音}
    heidi:
      display_name: 海蒂
      tts: {delivery: "天真直接，遇到新鲜事时满是好奇和喜悦", timbre: 明亮稚嫩, pace: 轻快自然, pitch: 偏高}
    peter:
      display_name: 彼得
      tts: {delivery: "质朴少言，开心时仍有几分腼腆", timbre: 清亮朴实, pace: 稍慢, pitch: 中高音}
    grandfather:
      display_name: 外公
      tts: {delivery: "简短沉稳，粗粝中渐渐透出关怀", timbre: 低沉厚实, pace: 不紧不慢, pitch: 低音}
    clara:
      display_name: 克拉拉
      tts: {delivery: "温柔友善，带着久病女孩的安静和机敏", timbre: 轻柔清亮, pace: 从容自然, pitch: 中高音}
    baker:
      display_name: 面包师
      tts: {delivery: "爱议论，话说得笃定而响亮", timbre: 粗实明朗, pace: 自然利落, pitch: 中音}
    village_woman:
      display_name: 村中妇人
      tts: {delivery: "朴实随和，带着看热闹时的好奇", timbre: 清脆自然, pace: 适中, pitch: 中高音}
    brigitta:
      display_name: 布丽吉塔
      tts: {delivery: "操心而直率，语气朴素家常", timbre: 温厚朴实, pace: 适中, pitch: 中音}
    grandmother:
      display_name: 奶奶
      tts: {delivery: "慈爱宽厚，话语缓慢而体贴", timbre: 苍老柔和, pace: 舒缓, pitch: 中低音}
  chapters:
    - id: ch01
      title: 意想不到的事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天一早，大叔先走出屋子看看天气。高处的峰顶已经泛起金红色，微风也醒了，冷杉枝在风里轻轻摇动。太阳就要升起来了。他站在屋外，看着峰峦下的绿坡渐渐明亮，山谷里的暗影一点点退去。玫瑰色的霞光先落满洼地，随后，清晨的金辉漫过高山和深谷。太阳升起来了。
        - id: ch01-b02
          speaker: narrator
          text: 大叔把躺椅推出羊棚，放好等着远足，又进屋叫醒两个孩子，请她们来看这美丽的日出。偏偏就在这时，彼得上山了。羊儿没有像平常一样亲热地围住他，反倒胆怯地躲开。因为彼得满心都是怒气和怨恨，正胡乱挥着木棍，棍子一旦落下，打得可不轻。
        - id: ch01-b03
          speaker: narrator
          text: 好几个星期以来，彼得再也不能像从前那样独占海蒂了。每天早晨，他一上山就看见那个生病的女孩已经坐在椅子里，海蒂全副心思都放在她身上。傍晚赶羊回来，眼前还是同一番情景。整个夏天，海蒂一次都没跟羊群出去。今天她虽然终于要上山，却仍会带着朋友和躺椅，还会从早到晚守在椅子旁边，根本顾不上他。彼得越想越恼火。他望着那张架在高轮子上的躺椅，觉得它摆出一副又骄傲又轻蔑的神气，简直是个已经害过自己、今天还打算继续作对的仇敌。
        - id: ch01-b04
          speaker: narrator
          text: 四下没有一点声响，也没有人看见他。彼得像野兽一样扑过去，抓住椅子，朝山坡狠狠一推。躺椅飞快滚远，转眼就消失了。彼得马上往山上飞奔，直到藏进一大丛黑莓后面才停下。他不想让大叔发现，却又非看看椅子的下场不可。从这片藏身处，他正好能看清山下，也能看见大叔做什么。
        - id: ch01-b05
          speaker: narrator
          text: 那个仇敌顺着山坡越滚越快，接连翻了几个跟头，最后猛地腾空一跃，又一圈一圈翻下去，彻底摔碎了。椅腿、扶手、撕裂的软座和靠垫碎片飞得到处都是。彼得一看，简直乐疯了。他跳到半空放声大笑，快活得直跺脚，又绕着灌木飞跑一圈，一路越过矮树，跑回原处后再次笑得停不下来。在他看来，这个仇敌遭了灾，只会给自己带来好处。海蒂的朋友没了代步的椅子，哪里也去不了，只能回家。海蒂重新剩下一个人，就会像过去那样跟他和羊群出去，一切也会回到他认为正确的样子。他没有想过，也许根本不懂，人做了坏事，麻烦一定会跟来。
        - id: ch01-b06
          speaker: narrator
          text: 海蒂从小屋里跑出来，绕到羊棚前，爷爷抱着克拉拉跟在后面。两块活动木板已经卸下，敞开的羊棚里十分明亮。海蒂从一头找到另一头，每个角落都看过了，还是不明白躺椅去了哪里。爷爷这时也走了过来。
        - id: ch01-b07
          speaker: grandfather
          text: 怎么回事？海蒂，是你把椅子推走了吗？
        - id: ch01-b08
          speaker: heidi
          text: 我哪里都找过了，爷爷。您明明说，椅子已经放在外面准备好了。
        - id: ch01-b09
          speaker: narrator
          text: 她说着，又把羊棚四角扫视了一遍。忽然，一阵大风吹开棚门，门板砰地撞上墙壁。海蒂一下想到了答案，眼神也跟着焦急起来。
        - id: ch01-b10
          speaker: heidi
          text: 爷爷，准是风把它吹走了！要是椅子一直滚到多尔夫里，我们肯定来不及弄回来，今天也就不能出发了。
          emotion: fearful
        - id: ch01-b11
          speaker: grandfather
          text: 它要真滚了那么远，就再也回不来了，现在准已经摔成一百块。不过，这件事可真奇怪。
        - id: ch01-b12
          speaker: narrator
          text: 爷爷绕过屋角，低头朝山下望。他心里清楚，椅子若要滚下山，得先自己转过一个弯。
        - id: ch01-b13
          speaker: clara
          text: 太可惜了！我们今天去不成，也许以后都去不成了。没有椅子，我大概只好回家。真是太可惜了！
          emotion: sad
        - id: ch01-b14
          speaker: narrator
          text: 海蒂却像往常一样，满怀信任地望着爷爷。
        - id: ch01-b15
          speaker: heidi
          text: 爷爷，您一定能想出办法，对不对？事情不会变成克拉拉说的那样，她也不用回家，对不对？
        - id: ch01-b16
          speaker: grandfather
          text: 眼下先照原来的打算上山。以后的事，我们以后再想办法。
        - id: ch01-b17
          speaker: narrator
          text: 两个孩子听了都很高兴。爷爷回屋抱出一摞披肩，铺在阳光最足的地方，把克拉拉安顿在上面。他取来孩子们早晨喝的奶，又牵出自己的两只羊。彼得今天没吹口哨，怎么还不见人影？爷爷一边想着，一边用一只手臂抱起克拉拉，另一边挟好披肩。
        - id: ch01-b18
          speaker: grandfather
          text: 好了，我们现在出发。两只羊也跟着来。
        - id: ch01-b19
          speaker: narrator
          text: 海蒂开心地跟在爷爷身后，两条胳膊各搂住一只羊的脖子。羊儿重新有她相伴，高兴得从两边使劲挤过来，差点把她夹扁。来到羊群平时吃草的地方，他们惊讶地发现，其他羊早已在那里攀着岩石吃草，彼得则直挺挺地趴在地上。
        - id: ch01-b20
          speaker: grandfather
          text: 你这个懒家伙！下次再敢这样从屋前溜过去，我可要好好教训你。你究竟想干什么？
          emotion: angry
        - id: ch01-b21
          speaker: peter
          text: 谁都还没起床。
        - id: ch01-b22
          speaker: grandfather
          text: 你看见那张椅子了吗？
        - id: ch01-b23
          speaker: peter
          text: 什么椅子？
        - id: ch01-b24
          speaker: narrator
          text: 彼得没好气地反问。爷爷没有再追问，只把披肩铺到向阳的山坡上，让克拉拉坐好，问她舒不舒服。
        - id: ch01-b25
          speaker: clara
          text: 跟坐在椅子里一样舒服，谢谢您。而且这里好像是最美的地方。海蒂，你看，太美了，真的太美了！
          emotion: happy
        - id: ch01-b26
          speaker: narrator
          text: 爷爷要离开一阵。他告诉孩子们，她们在这里待在一起，既安全又会过得快活。到了中午，海蒂要去背阴的洼地取回他藏好的食物袋。她们想喝多少奶，彼得就得送来多少，不过海蒂一定要看清楚，那必须是小天鹅的奶，不能拿别的来混。傍晚，爷爷会重新上山接她们。现在他得先离开，顺着山路去找那张躺椅，看看它究竟去了哪里，又出了什么事。
        - id: ch01-b27
          speaker: narrator
          text: 天空深蓝，从一边天际到另一边，一丝云也没有。头顶的大雪原闪闪发亮，像镶了成千上万颗金银星星。两座灰色山峰高昂着头，像从前一样庄严地俯瞰山谷。巨大的猛禽停在澄蓝高空，山风翻过峰顶，清清爽爽地围着阳光里的孩子们吹。克拉拉和海蒂快乐得说不出话来。
        - id: ch01-b28
          speaker: narrator
          text: 小羊不时走到身边卧下。雪花来得最勤，总把小脑袋挨近海蒂，直到另一只羊把它赶走。克拉拉已经熟悉了所有羊儿，再也不会认错。每一只都有自己的神情和脾气。羊儿们也跟她熟了，常用脑袋蹭她的肩，那是它们表示亲近和友好的办法。
        - id: ch01-b29
          speaker: narrator
          text: 几个小时过去，海蒂越来越想去看看那片花野。花是不是全开了？还像去年那样美吗？克拉拉要等爷爷傍晚回来才能过去，那时花朵多半已经合上。海蒂实在忍不住了，只好迟疑地开口。
        - id: ch01-b30
          speaker: heidi
          text: 克拉拉，要是我离开一小会儿，你会不会觉得我不好？我会飞快跑过去，再飞快跑回来。我太想看看那些花现在是什么样了。等等，我有办法了！
        - id: ch01-b31
          speaker: narrator
          text: 她跑去摘了几把绿叶，又把雪花牵到克拉拉跟前。她轻轻推了推小羊，让它卧在克拉拉身旁。雪花完全明白。
        - id: ch01-b32
          speaker: heidi
          text: 好啦，这下你就不是一个人了。
        - id: ch01-b33
          speaker: narrator
          text: 海蒂把叶子放在克拉拉膝上。克拉拉很喜欢这番新体验，催她赶快去看花。海蒂跑开后，她一片一片喂雪花。小羊信赖地凑近新朋友，慢慢从她手里吃叶子。跟强壮的大羊在一起时，雪花总受欺负，现在这样安稳地吃东西，显然十分享受。
        - id: ch01-b34
          speaker: narrator
          text: 克拉拉独自坐在山坡上，唯一的同伴是一只指望她保护的小羊。她忽然尝到一种陌生的快乐。过去总是她依靠别人，事事都要别人照料，如今却有一个小生命需要她。她多想自己能为自己做主，也能伸手帮助别人。许多从未有过的念头一下涌进心里。她想一直生活在这样的阳光下，也想做些能给别人带来快乐的事，就像此刻，她正保护雪花，让小羊安安心心地吃叶子。那股新鲜的喜悦占满了她。她从前见过、感受过的一切仿佛都换了模样，在一种新的光亮里变得更加美好。这份幸福强烈得让她无法安坐，她一把抱住雪花的脖子。
        - id: ch01-b35
          speaker: clara
          text: 雪花，山上多快活呀！要是我能永远留在这里，让你一直陪着我，该有多好！
          emotion: happy
        - id: ch01-b36
          speaker: narrator
          text: 海蒂已经来到自己的花野。眼前的景象刚映入眼睛，她便高兴地叫出了声。整片大地都在闪金光，岩蔷薇把黄色花朵铺满地面，深蓝的钟形花则一丛丛高高摇动。阳光照着这片辽阔的花海，浓郁的芬芳从里面升起来，像有人把世上最珍贵的香膏洒遍四周。其实，这股醉人的香气来自零星藏在黄花间的棕色小花。它们只谦逊地露出圆圆的小脑袋，一点也不起眼。海蒂久久站着凝望，又尽情吸入芬芳的空气。忽然，她想到克拉拉看不见这一切，便转身飞跑回去。她一路跑得气喘吁吁，心里的激动却越来越盛。离克拉拉还有一段路，她已经忍不住喊起来。
        - id: ch01-b37
          speaker: heidi
          text: 你一定要来！那里美得你根本想不到，到了傍晚，也许就没这么美了。我觉得我能抱得动你，你说行不行？
          emotion: happy
        - id: ch01-b38
          speaker: clara
          text: 海蒂，你在想什么呀！你明明比我还小。要是我自己能走路就好了！
        - id: ch01-b39
          speaker: narrator
          text: 海蒂四下张望，又有了主意。彼得坐在上方，已经呆呆地往下看了好几个钟头。他明明毁掉了椅子，想叫海蒂的朋友动不了，也让她早点离开，可没过多久，她竟跟海蒂一起出现在自己眼皮底下。彼得几乎不敢相信自己的眼睛，但克拉拉的确就在这里。
        - id: ch01-b40
          speaker: heidi
          text: 彼得，到这里来！
        - id: ch01-b41
          speaker: peter
          text: 我不想去。
        - id: ch01-b42
          speaker: heidi
          text: 你非来不可！我一个人办不到，你得来帮忙。快点下来！
        - id: ch01-b43
          speaker: peter
          text: 我才不干。
        - id: ch01-b44
          speaker: narrator
          text: 海蒂朝山坡上跑了一段，停下来瞪着他，眼睛气得发亮。
        - id: ch01-b45
          speaker: heidi
          text: 彼得，你再不马上过来，我就做一件你最不喜欢的事！我说到做到。
          emotion: angry
        - id: ch01-b46
          speaker: narrator
          text: 彼得心里猛地一紧。他干了坏事，一直以为没人知道。可海蒂这番话听起来，简直像她知道一切。只要她告诉爷爷，事情就完了，因为彼得最怕爷爷。要是爷爷已经怀疑椅子的事呢？他越想越害怕，只好站起来，走到海蒂面前。
        - id: ch01-b47
          speaker: peter
          text: 我来了。你不能做刚才说的那件事。
          emotion: fearful
        - id: ch01-b48
          speaker: narrator
          text: 彼得吓得这么顺从，海蒂反倒有点可怜他。
        - id: ch01-b49
          speaker: heidi
          text: 不做，当然不做。跟我来吧，我要你帮的忙一点也不可怕。
        - id: ch01-b50
          speaker: narrator
          text: 到了克拉拉身边，海蒂让彼得从一侧托住克拉拉的腋下，自己托另一侧，两个人一起把她扶起来。这一步很顺利，可接下来怎么办？克拉拉连站都站不住，他们怎么撑着她往前走？海蒂又太矮，胳膊不能让克拉拉倚靠。
        - id: ch01-b51
          speaker: heidi
          text: 你用一条胳膊好好搂住我的脖子，另一条挽住彼得，结结实实靠着他。这样我们就能带你走。
        - id: ch01-b52
          speaker: narrator
          text: 彼得从没让人挽过胳膊。克拉拉挽住他，他自己的手臂却像木棍一样直垂着。
        - id: ch01-b53
          speaker: heidi
          text: 不对，彼得。你得把胳膊弯起来，让克拉拉把手穿进去，靠在你身上。无论如何都别松开。对，就是这样。我们肯定能行。
        - id: ch01-b54
          speaker: narrator
          text: 彼得照做了，可他们还是走得不顺。克拉拉并不轻，三个人的个头又差得太多，一边高一边低，支撑也摇摇晃晃。克拉拉试着用脚，每次刚伸出去又马上缩回。
        - id: ch01-b55
          speaker: heidi
          text: 你试着结结实实踩下去一次。我觉得，踩过这一下，后面就不会这么疼了。
        - id: ch01-b56
          speaker: clara
          text: 你真的这么想吗？
        - id: ch01-b57
          speaker: narrator
          text: 克拉拉迟疑着，却还是照做了。她先把一只脚用力踩在地上，又迈出另一只脚。虽然轻轻痛叫了一声，她还是重新抬起脚，继续往前。
        - id: ch01-b58
          speaker: clara
          text: 已经没有刚才那么疼了！
          emotion: surprised
        - id: ch01-b59
          speaker: heidi
          text: 那就再试一次。
        - id: ch01-b60
          speaker: narrator
          text: 克拉拉一只脚接着一只脚，继续往前迈。忽然，她高声叫了起来。
        - id: ch01-b61
          speaker: clara
          text: 我能走了，海蒂！看呀，快看呀！我真的能迈步了！
          emotion: happy
        - id: ch01-b62
          speaker: heidi
          text: 你真的会走路了？真的能自己迈步了？要是爷爷也在这里就好了！克拉拉，你会走路了，你真的会走了！
          emotion: happy
        - id: ch01-b63
          speaker: narrator
          text: 克拉拉仍紧紧抓着两边的支撑，可每迈一步，双脚就站得更稳一些。他们三个都感觉到了，海蒂更是快乐得发狂。
        - id: ch01-b64
          speaker: heidi
          text: 以后我们每天都能一起来，想去哪里就去哪里！你可以一辈子像我这样到处走，再也不用让人推着椅子。你会变得强壮又健康。世上再没有比这更幸福的事了！
          emotion: happy
        - id: ch01-b65
          speaker: narrator
          text: 克拉拉完全赞同。对她来说，世上最大的快乐就是身体健康，像别人一样自由走动，不必日复一日躺在病人的椅子里。花野已经很近，阳光里的岩蔷薇闪着金光。走到蓝色钟形花丛边，她看见花丛之间有一块块温暖的向阳草地。
        - id: ch01-b66
          speaker: clara
          text: 我们能在这里坐一会儿吗？
        - id: ch01-b67
          speaker: narrator
          text: 这正合海蒂的心意。两个孩子就在花丛中坐下来。克拉拉有生以来第一次坐在山间干燥而温暖的草地上，只觉得这滋味妙不可言。蓝花在身旁柔柔摇动，再远一些，是阳光里闪亮的岩蔷薇和红色百金花。棕色小花与芬芳的夏枯草散出甜香，把她整个人围在里面。眼前的一切都那么美，实在太美了。海蒂坐在她身边，也觉得高山从没有这样完美地美过。她心里快乐得想放声欢呼，却一时说不清这份快乐从哪里来。随后，她忽然想起了最重要的事。克拉拉已经好了，已经能迈步了。这才是所有快乐里最了不起的一件，也让花海中的生命显得更加美妙。
        - id: ch01-b68
          speaker: narrator
          text: 克拉拉静静坐着，眼前万物的美和未来的幸福一齐涌进心里。她的心几乎装不下这么多喜悦，阳光和花香又让她陶醉，她一句话也说不出来。彼得也躺在花丛中，安安静静，因为他已经睡熟。微风从遮风的岩石后柔柔吹来，又穿过头顶的灌木，发出低低的絮语。海蒂不时起来四处跑。暖风里的花儿仿佛越走越香，也越长越密，她每到一个新地方，都想坐下看看花，再闻闻香气。时间就这样过去了。
        - id: ch01-b69
          speaker: narrator
          text: 中午早已过去，一小队羊儿庄严地朝花野走来。它们不爱吃花，平时根本不到这里觅食。现在却排成一队，活像一群出使的使者，绿雀走在最前面。看来，它们特地前来寻找那几个抛下同伴、又反常地久久不归的朋友。羊儿判断时间从来不会弄错，一定早就发现伙伴们离开得太久了。绿雀一看见花丛里那三个失踪的朋友，马上格外响亮地咩了一声，其余羊也齐声应和。整支队伍随即小跑起来，一同奔向孩子们。
        - id: ch01-b70
          speaker: narrator
          text: 彼得揉着眼睛醒来。他刚梦见那张红软垫躺椅完好无损地立在爷爷门前。睁眼的一瞬间，他甚至以为身旁的黄花就是椅子四周闪亮的黄铜钉。美梦一消失，对坏事败露的恐惧又回来了。海蒂虽然答应不会做什么，他却仍怕别人发现真相。如今他又沮丧又驯服，任由海蒂差遣，再帮克拉拉时既不抱怨，也不反抗。
        - id: ch01-b71
          speaker: narrator
          text: 三个人回到原先休息的地方，海蒂立刻跑去取来食物袋，准备兑现自己的承诺。她早晨威胁彼得的，其实只是不给他午饭。她亲眼看见爷爷往袋里装了许多好吃的，也知道彼得本来就能分到很大一份，所以她才会用午饭催他来帮忙。可是彼得心里藏着坏事，误以为海蒂知道椅子的秘密，把她的话听成了另一层意思。海蒂把所有食物拿出来，仔细分成丰盛的三份。她一边分，一边还在心里盘算，自己和克拉拉吃不完的东西一定很多，到时候可以再送给彼得，让他多吃一份。
        - id: ch01-b72
          speaker: narrator
          text: 她把两份午饭递给克拉拉和彼得，自己也坐下来。刚才那番费力的尝试让三个人胃口大开，大家痛痛快快地吃起来。事情果然像海蒂想的一样。她和克拉拉吃饱以后，剩下的食物合起来，正好又抵得上彼得原有的一份。彼得吃得一点碎屑都不剩，可他再也尝不到平常那种快乐。每咽下一口，他都觉得发噎，身体里面仿佛还有什么东西在不停啃咬。
        - id: ch01-b73
          speaker: narrator
          text: 这顿午饭吃得很晚。刚结束不久，爷爷就来接他们了。海蒂一看见他，马上飞奔过去，抢着告诉他好消息。她激动得说不清话，可爷爷很快听懂了，脸上露出极大的喜悦。他快步来到克拉拉跟前，满脸笑容。
        - id: ch01-b74
          speaker: grandfather
          text: 看来我们努力过了，而且还打赢了这一仗！
          emotion: happy
        - id: ch01-b75
          speaker: narrator
          text: 他扶起克拉拉，左臂护在她身后，又把右臂伸给她倚靠，带她走了一小段。有这样坚实的臂膀支撑，克拉拉比刚才少了许多颤抖和迟疑。海蒂欢天喜地地蹦跳在旁边，爷爷也像遇上了天大的好事。走了一会儿，他就把克拉拉抱起来。
        - id: ch01-b76
          speaker: grandfather
          text: 不能一下练得太多。我们也早该回家了。
        - id: ch01-b77
          speaker: narrator
          text: 爷爷抱着她走下山路。他想赶快让克拉拉回屋休息，好恢复这次不同寻常的劳累耗去的体力。
        - id: ch01-b78
          speaker: narrator
          text: 傍晚，彼得来到多尔夫里，看见一大群人围在草地上的某个地方。大家互相推挤，争着从别人的肩头望过去，好看清地上究竟躺着什么。彼得也很想瞧瞧，便一边挤，一边用胳膊肘给自己开路，终于钻到了人群最前面。地上躺着的，正是他想看的东西。克拉拉的躺椅已经散成一片残骸。草地上有一截椅背、一块中间的木板，还有不少红色软垫和闪亮的钉子。只看这些剩下的碎片，也足以想象这张椅子完好时有多么华贵。
        - id: ch01-b79
          speaker: baker
          text: 那些人把椅子抬上山时，我就在这里。我敢跟任何人打赌，它至少值二十五英镑。真想不明白，怎么会出这样的事故。
        - id: ch01-b80
          speaker: narrator
          text: 站在旁边的一个妇人一直盯着红色软垫，怎么也看不够。
        - id: ch01-b81
          speaker: village_woman
          text: 大叔说，也许是风把它吹下来的。
        - id: ch01-b82
          speaker: baker
          text: 幸好只是风干的。要真是哪个人干的，那人可有苦头吃了！法兰克福那位先生一听说，肯定会查个明白。我倒很庆幸，足足两年没人看见我上过山。出事的时候，谁在那附近，谁就可能被怀疑。
        - id: ch01-b83
          speaker: narrator
          text: 人群还在议论，各人都在说这件事可能是怎么发生的，彼得却已经听够了。他不敢再停留，悄悄从人缝里退出来，拔腿往家里飞跑，好像真有人已经发现了他，正在后面紧追不舍。面包师的话吓得他浑身发抖。他认定法兰克福的警察随时会翻山越岭赶来，专门调查椅子为什么会粉碎。到那时，所有真相都会暴露。他会被人一把抓住，远远押到法兰克福，再关进可怕的监狱。这一连串即将发生的景象，清清楚楚摆在他眼前，吓得他连头发都竖了起来。
        - id: ch01-b84
          speaker: narrator
          text: 彼得心神不宁地回到家。不管别人问什么，他都不肯回答，连土豆也一口不吃，只想赶快爬上床，钻进被子里呻吟。
        - id: ch01-b85
          speaker: brigitta
          text: 彼得一定又吃酸模草了。听他哼哼成这样，肚子准疼得厉害。
        - id: ch01-b86
          speaker: grandmother
          text: 明天让他多带一点面包吧，把我的也分一块给他。
        - id: ch01-b87
          speaker: narrator
          text: 那天晚上，两个孩子躺在床上看星星。海蒂把想了一整天的话告诉克拉拉。
        - id: ch01-b88
          speaker: heidi
          text: 要是上帝知道有更好的东西在等我们，那么就算我们一遍又一遍地祈求，他也不会把眼下求的东西给我们。你不觉得，这其实很幸福吗？
        - id: ch01-b89
          speaker: clara
          text: 你怎么今晚突然想到问这个？
        - id: ch01-b90
          speaker: heidi
          text: 因为我在法兰克福时一直祈祷，求上帝让我马上回家。后来始终走不了，我还以为他把我忘了。可是你看，要是我当时马上回来了，你就永远不会到这里，也永远不会好起来。
        - id: ch01-b91
          speaker: narrator
          text: 这回轮到克拉拉认真想了想。
        - id: ch01-b92
          speaker: clara
          text: 可是海蒂，既然上帝为我们安排的总比我们自己知道和想要的更好，那我们不是根本不该求任何事了吗？
        - id: ch01-b93
          speaker: heidi
          text: 不能这么想，克拉拉。我们还是什么都要向上帝祈求，让他知道，我们没有忘记一切都是他赐予的。奶奶说，要是我们忘了上帝，他就会让我们自己走自己的路，那样我们会遇到麻烦。要是他没有给我们所求的东西，也别以为他没听见，更不能就此不再祈祷。我们要继续祈祷，还要对他说：“亲爱的上帝，我知道你替我留着更好的东西。我不会难过，因为我相信，到最后，你会让一切都好起来。”
        - id: ch01-b94
          speaker: clara
          text: 这些道理，你是怎么学会的？
        - id: ch01-b95
          speaker: heidi
          text: 一开始是奶奶解释给我听。后来，事情真的像她说的那样发生，我自己就明白了。克拉拉，我想我们今晚一定得感谢上帝。你现在会走路了，他还让我们这么幸福。
        - id: ch01-b96
          speaker: clara
          text: 是啊，你说得对。谢谢你提醒我，我刚才太高兴，差点连祷告都忘了。
        - id: ch01-b97
          speaker: narrator
          text: 两个孩子安静下来，各自做了晚祷。她们用自己的方式感谢上帝，把这份巨大的恩典赐给克拉拉。她曾经病弱无力地躺了那么久，日日只能靠椅子代步，如今终于能用自己的双脚站起来，一步一步向前走了。
        - id: ch01-b98
          speaker: narrator
          text: 第二天早晨，爷爷提议给奶奶写封信，请她上山来看看，因为这里有样新东西正等着给她看。两个孩子却早有自己的打算。她们想准备一个真正的大惊喜。克拉拉要先继续练习走路，等到能不靠别人、独自走上一小段，再让奶奶亲眼看见。最要紧的是，在那以前绝不能透露半点风声。她们问爷爷，这样大概要练多久。爷爷说，一个星期左右，也许还用不了那么长时间。两个孩子一听，立刻坐下来写信。她们在信里恳切地邀请奶奶快些上山，却把那个天大的好消息藏得严严实实，只字不提这里有什么新鲜事等着她看。
        - id: ch01-b99
          speaker: narrator
          text: 接下来的日子，是克拉拉上山以后最快活的一段时光。每天早晨醒来，她心里都有一个欢喜的声音在喊。
        - id: ch01-b100
          speaker: clara
          text: 我已经好了！我已经好了！我再也不用坐在椅子里让人推来推去。我能像别人一样，自己走路了！
          emotion: happy
        - id: ch01-b101
          speaker: narrator
          text: 她每天都认真练习走路。第一天还要小心翼翼地借力，往后每过一天，抬脚和落脚就变得容易一些，她能走过的距离也一天比一天长。这样的活动让她胃口大开。爷爷每天都把黄油面包切得更厚，看着那些面包一点点消失，心里十分满意。他还会端出一大壶满是泡沫的羊奶，一次又一次盛满克拉拉的小碗，让她尽情喝个够。就这样，又一个星期过去了。终于，奶奶第二次上山看望她们的日子到了。
