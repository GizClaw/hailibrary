  chapters:
    - id: ch01
      title: Something Unexpected Happens
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Early the next morning, Grandfather stepped outside to see what kind of day was coming. Reddish-gold light shone above the highest peaks. A light breeze had begun to rise, gently moving the fir branches back and forth. The sun was on its way. Grandfather stood watching as the green slopes below the peaks slowly brightened with the coming day. The dark shadows lifted from the valley. First, a rosy glow filled every hollow. Then morning gold poured over the heights and down into the depths. The sun had risen.
        - id: ch01-b02
          speaker: narrator
          text: Grandfather rolled Clara's chair out of the shed and left it ready for the journey they had planned. Then he went into the hut to wake the children and tell them what a beautiful sunrise was waiting outside.
        - id: ch01-b03
          speaker: narrator
          text: Peter arrived just then, but the goats did not crowd around him with their usual trust. They hung back timidly. He was so angry and bitter that he kept swinging his stick at them for no reason, and when it struck, it struck hard. For weeks now, he had not had Heidi to himself as he once did. Each morning, Clara was already sitting in her chair when he reached the hut, and Heidi was completely occupied with her friend. Each evening, it was the same. Heidi had not gone out with the goats once that summer. Even today, when at last she was coming up the mountain, Clara and the chair would come too. Heidi would stay beside them the whole time.
        - id: ch01-b04
          speaker: narrator
          text: That thought made Peter especially cross. The chair stood there on its high wheels, and to Peter it seemed proud and scornful. He glared at it as if it were an enemy that had already harmed him and meant to harm him again today. He glanced all around. Not a sound came from anywhere, and there was no one to see him. Like a wild creature, he sprang at the chair, caught hold of it, and gave it one violent, furious push toward the slope. It rolled swiftly forward. A moment later, it had vanished from sight.
        - id: ch01-b05
          speaker: narrator
          text: Peter flew up the mountain as if he had wings. He did not stop until a large blackberry bush hid him from view, for the last thing he wanted was to be seen by Grandfather. Still, he desperately wanted to know what had become of the chair, and his hiding place gave him a clear view below. He watched his enemy race faster and faster down the hill. It turned head over heels several times, made one enormous bound, then rolled over and over until it was completely destroyed. Pieces flew in every direction. The legs and arms broke away, and torn scraps of the padded seat and bolster scattered across the ground.
        - id: ch01-b06
          speaker: narrator
          text: The sight filled Peter with boundless delight. He leaped into the air, laughed aloud, and stamped for joy. Then he ran around, jumping over bushes, only to return to the same place and burst into laughter all over again. He was beside himself with satisfaction. To him, this disaster could only turn out well. Without the chair, Clara would have no way to move around. She would have to leave, and when Heidi was alone again, she would go out with him as she had in the old days. Everything would finally be right. Peter never stopped to think, or perhaps did not yet know, that when someone does wrong, trouble is sure to follow.
        - id: ch01-b07
          speaker: narrator
          text: Heidi came running out of the hut and hurried around to the shed. Grandfather followed behind her with Clara in his arms. The shed stood wide open because its two loose boards had been removed, and daylight filled the inside. Heidi looked into every corner and ran from one end to the other. At last, she stood still, wondering what could possibly have happened. The chair was gone.
        - id: ch01-b08
          speaker: grandfather
          text: What's happened here? Did you roll the chair away, Heidi?
        - id: ch01-b09
          speaker: heidi
          text: I've looked everywhere, Grandfather. You said it was waiting outside.
        - id: ch01-b10
          speaker: narrator
          text: At that moment, the wind suddenly rose. A gust caught the shed door, flung it open, and sent it banging against the wall. Heidi's eyes grew anxious as a new explanation came to her.
        - id: ch01-b11
          speaker: heidi
          text: It must have been the wind! What if it blew the chair all the way to Dorfli? We won't get it back in time, and then we can't go.
        - id: ch01-b12
          speaker: grandfather
          text: If it rolled that far, it won't be coming back. It'll be in a hundred pieces by now. Still, this is a strange thing. The chair would have had to turn a corner before it could go downhill.
        - id: ch01-b13
          speaker: clara
          text: Oh, no. Now we can't go today, or perhaps ever. Without my chair, I suppose I'll have to go home. I'm so sorry!
          emotion: sad
        - id: ch01-b14
          speaker: narrator
          text: Heidi looked at Grandfather with complete trust.
        - id: ch01-b15
          speaker: heidi
          text: Grandfather, you can find some way to help, can't you? Clara doesn't really have to go home, does she?
        - id: ch01-b16
          speaker: grandfather
          text: For now, we'll go up the mountain as we planned. Later, we'll see what can be done.
        - id: ch01-b17
          speaker: narrator
          text: Grandfather's answer delighted both children. He went indoors and returned with a pile of shawls. After choosing the sunniest place he could find, he spread them on the ground and set Clara down upon them. Then he brought out the children's morning milk and let his two goats out of their shelter. Peter's whistle had not sounded that morning, and Grandfather wondered to himself why the boy had not arrived.
        - id: ch01-b18
          speaker: grandfather
          text: All right, we're off. The goats can come with us.
        - id: ch01-b19
          speaker: narrator
          text: Grandfather lifted Clara with one arm and took the pile of shawls in the other. Heidi followed close behind, walking with one arm around each goat's neck. The animals were overjoyed to have her with them again. They pressed so lovingly against her from both sides that they nearly squeezed her flat between them.
        - id: ch01-b20
          speaker: narrator
          text: At the usual pasture, the rest of the herd was already climbing among the rocks. Peter lay stretched out on the ground beside them.
        - id: ch01-b21
          speaker: grandfather
          text: You lazy rascal! Next time, I'll teach you not to pass us by. What did you mean by it?
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: Peter sprang up at the sound of Grandfather's voice.
        - id: ch01-b23
          speaker: peter
          text: Nobody was awake.
        - id: ch01-b24
          speaker: grandfather
          text: Have you seen Clara's chair?
        - id: ch01-b25
          speaker: peter
          text: What chair?
        - id: ch01-b26
          speaker: narrator
          text: Grandfather gave Peter no answer. He chose a sunny place on the slope, spread out the shawls, and settled Clara carefully upon them. Then he asked if she was comfortable there.
        - id: ch01-b27
          speaker: clara
          text: I'm just as comfortable as I was in my chair. Thank you. And this may be the loveliest place of all. Oh, Heidi, look how beautiful it is!
          emotion: happy
        - id: ch01-b28
          speaker: narrator
          text: Before leaving, Grandfather told them they would be safe together. At dinnertime, Heidi was to fetch the bag he had left in a shady hollow. Peter would bring all the milk they wanted, and Heidi must make sure it came from Little Swan. Grandfather would return toward evening. First, he had to find out what had happened to the chair.
        - id: ch01-b29
          speaker: narrator
          text: A deep blue sky stretched from one horizon to the other without a single cloud. High above, the great snowfield glittered as though thousands upon thousands of gold and silver stars had been set into it. The two gray mountain peaks lifted their heads against the sky and looked solemnly down into the valley, just as they had for ages. The great bird hung high in the clear blue air. From over the heights came the mountain wind, blowing cool and fresh around the children as they sat in the sunshine. Clara and Heidi could hardly have been happier.
        - id: ch01-b30
          speaker: narrator
          text: Now and then, one of the young goats came and lay beside them. Snowflake visited most often. She would settle near Heidi and put down her little head, moving only when another goat came and drove her away. Clara had learned to know the whole herd so well that she never confused one goat with another. Each had its own expression and its own habits. The goats had grown familiar with Clara too. They came up and rubbed their heads against her shoulder, their way of showing friendship and good will.
        - id: ch01-b31
          speaker: narrator
          text: Several hours passed. Heidi began to think about the place where all the flowers grew. Perhaps she could slip over just long enough to see whether they had opened fully and whether they were as lovely as they had been the year before. Clara could not go until Grandfather came back that evening, and by then the blossoms would probably have closed. The more Heidi thought about them, the stronger her longing grew. At last, she felt she could not resist it.
        - id: ch01-b32
          speaker: heidi
          text: Clara, would it be unkind if I left you for just a few minutes? I'd run there and right back. I want so much to see the flowers. But wait! I know what to do.
        - id: ch01-b33
          speaker: narrator
          text: Heidi gathered two bunches of green leaves, led Snowflake to Clara, and gently showed the goat where to lie down. Then she dropped the leaves into Clara's lap.
        - id: ch01-b34
          speaker: heidi
          text: There. Now you won't be alone.
        - id: ch01-b35
          speaker: clara
          text: Go and see the flowers. I'll be perfectly happy with Snowflake. I've never done this before.
        - id: ch01-b36
          speaker: narrator
          text: Heidi ran off toward the flowers. Clara began offering Snowflake the leaves one at a time. The little goat nuzzled trustingly up to her new friend and slowly ate each leaf from Clara's hand. Snowflake plainly enjoyed this quiet, sheltered way of feeding. When she ate with the herd, the larger, stronger goats often pushed her aside and gave her no peace.
        - id: ch01-b37
          speaker: narrator
          text: Clara discovered a strange new pleasure in sitting alone on the mountainside. Her only companion was a little goat that looked to her for protection. Suddenly, Clara wanted very much to be her own mistress. She wanted to be able to help others instead of always depending on someone else. Thoughts she had never known before crowded into her mind. She longed to go on living in the sunshine and to do something that brought happiness to another creature, just as she was making Snowflake happy now. A new joy took hold of her. Everything she had ever known or felt seemed more beautiful, as if she were seeing the whole world in a new light. The feeling grew so strong that she threw her arms around the little goat's neck.
        - id: ch01-b38
          speaker: clara
          text: Oh, Snowflake, it's wonderful up here! If only I could stay forever with you beside me!
          emotion: happy
        - id: ch01-b39
          speaker: narrator
          text: Meanwhile, Heidi reached the flower field and cried out with joy at what she saw. The whole ground before her shimmered like gold beneath the yellow cistus blossoms. Above them, whole bushes of deep blue bellflowers waved in the breeze. A wonderful fragrance rose from the sunny field, as though someone had poured the rarest balsam over it. The scent came from modest little brown flowers whose round heads appeared here and there among the yellow blooms. Heidi stood still, gazing and drawing in the delicious air. Then she suddenly turned and raced back to Clara, out of breath from running and excitement.
        - id: ch01-b40
          speaker: heidi
          text: Oh, you have to come! It's more beautiful than you can imagine, and it may not look the same this evening. Maybe I could carry you. Don't you think I could?
          emotion: happy
        - id: ch01-b41
          speaker: clara
          text: Heidi, how could you? You're smaller than I am. Oh, if only I could walk!
          emotion: sad
        - id: ch01-b42
          speaker: narrator
          text: Heidi looked around as if some new answer might be waiting nearby. Farther up the slope, Peter sat staring down at the girls. He had been sitting that way for hours, unable to make sense of what he saw. He had destroyed the chair so Clara could not go anywhere and her visit would have to end. Yet only a little while later, she had appeared right there on the mountain, almost under his nose, with Heidi beside her. Peter thought his eyes must be fooling him. Still, there Clara was. There could be no mistake.
        - id: ch01-b43
          speaker: heidi
          text: Peter, come down here!
        - id: ch01-b44
          speaker: peter
          text: I don't want to.
        - id: ch01-b45
          speaker: heidi
          text: You have to come. I can't do this alone, and I need your help. Hurry!
        - id: ch01-b46
          speaker: peter
          text: I'm not doing it.
        - id: ch01-b47
          speaker: narrator
          text: Heidi ran partway up the slope and stopped. Her eyes flashed with anger.
        - id: ch01-b48
          speaker: heidi
          text: If you don't come right now, Peter, I'll do something you won't like. I mean it!
          emotion: angry
        - id: ch01-b49
          speaker: narrator
          text: Heidi's words sent a painful jolt through Peter, and fear seized him. He had done something wicked and wanted no one to know. Until now, he had believed his secret was safe. But Heidi sounded exactly as if she knew everything. Whatever she knew, she would surely tell Grandfather, and Peter feared no one in the world as much as him. What if Grandfather already suspected the truth about the chair? The thought became unbearable. Peter stood up and went down to where Heidi was waiting.
        - id: ch01-b50
          speaker: peter
          text: I'm coming. You won't do what you said, will you?
          emotion: fearful
        - id: ch01-b51
          speaker: narrator
          text: He looked so frightened and obedient that Heidi felt sorry for him.
        - id: ch01-b52
          speaker: heidi
          text: No, of course I won't. Come with me. There's nothing frightening about what I need you to do.
        - id: ch01-b53
          speaker: narrator
          text: When they reached Clara, Heidi gave her instructions. Peter was to take Clara under one arm while Heidi took the other, and together they would lift her. That first part went well. Then came the real difficulty. Clara could not even stand on her own. How could they support her and move forward? Heidi was too small for Clara to use her arm as a proper support.
        - id: ch01-b54
          speaker: heidi
          text: Put one arm around my neck and link the other through Peter's arm. Lean on him firmly. Then we can carry you.
        - id: ch01-b55
          speaker: narrator
          text: Peter had never offered anyone his arm. Clara slipped hers through it, but he let his hang straight down like a stick.
        - id: ch01-b56
          speaker: heidi
          text: Not like that, Peter. Bend your arm into a ring so Clara can hold on and put her weight on you. Whatever happens, don't let it give way. There. Now I know we can manage.
        - id: ch01-b57
          speaker: narrator
          text: Peter did exactly as Heidi told him, but the three still made an awkward team. Clara was not very light, and the two helpers were badly matched in height. One side of her went up while the other went down, and both supports wobbled as they tried to move. Clara attempted to put a little weight on her own feet. Each time they touched the ground, though, she quickly drew them back again.
        - id: ch01-b58
          speaker: heidi
          text: Try putting one foot down firmly. I think it will hurt less after that.
        - id: ch01-b59
          speaker: clara
          text: Do you really think so?
        - id: ch01-b60
          speaker: narrator
          text: Clara hesitated, but she trusted Heidi's advice. She ventured one firm step on the ground, then another. A little cry escaped her as she did it. She lifted her foot once more and moved forward, and this time her face changed with sudden joy.
        - id: ch01-b61
          speaker: clara
          text: Oh! That already hurt less!
          emotion: surprised
        - id: ch01-b62
          speaker: heidi
          text: Then try once more.
        - id: ch01-b63
          speaker: narrator
          text: Clara put one foot in front of the other. Suddenly, she called out.
        - id: ch01-b64
          speaker: clara
          text: Heidi, I can do it! Look at me! I'm taking real steps!
          emotion: happy
        - id: ch01-b65
          speaker: heidi
          text: Are you really walking? Really walking by yourself? Oh, I wish Grandfather were here! You can walk now, Clara. You can walk!
          emotion: happy
        - id: ch01-b66
          speaker: narrator
          text: Clara still held tightly to both of her supports. Yet with every step, she felt safer on her feet, and Heidi and Peter could feel the change too. Heidi was beside herself with joy at the wonder happening between them.
        - id: ch01-b67
          speaker: heidi
          text: Now we can come up here every day and go anywhere we want. You'll walk all your life, just as I do. No one will have to push you in a chair, and you'll grow strong and well. Nothing could make us happier!
          emotion: happy
        - id: ch01-b68
          speaker: narrator
          text: Clara agreed with all her heart. She could imagine no greater joy in the whole world than becoming strong and being able to go wherever she wished, just as other people did. The thought of no longer lying helpless in her invalid chair day after day filled her with happiness.
        - id: ch01-b69
          speaker: narrator
          text: They did not have far to go. The flower field was already in sight, with golden cistus blossoms glowing in the sun. Soon they reached the bushes of blue bellflowers. Between the bushes lay warm, sunny patches of ground, and there Clara asked to stop.
        - id: ch01-b70
          speaker: clara
          text: Could we sit here for a while?
        - id: ch01-b71
          speaker: narrator
          text: Nothing could have pleased Heidi more. The children settled in the middle of the flowers, and for the first time Clara sat on the dry, warm grass of the mountain. Softly waving blue blossoms surrounded her. Beyond them lay shining patches of golden cistus and red centaury. The sweet scent of the little brown flowers mingled with the fragrant prunella and wrapped around her as she sat there. Everywhere she looked, everything was lovely.
        - id: ch01-b72
          speaker: narrator
          text: Beside her, Heidi thought the mountain had never looked so perfectly beautiful. She did not understand at first why she felt so glad that she wanted to shout. Then she remembered. Clara was cured. That was the crowning joy in the middle of all this beauty. Clara sat silently, overcome by everything her eyes rested upon and by the thought of all the happiness waiting for her now. Her heart seemed too small to hold such joy. The sunlight and the fragrance of the flowers added to it until she could not speak at all.
        - id: ch01-b73
          speaker: narrator
          text: Peter also lay among the flowers, but he did not move or speak because he had fallen fast asleep. A soft breeze came from behind the sheltering rocks. It passed gently over them and whispered through the bushes above. Now and then, Heidi got up and ran about. Wherever she went, the flowers moving in the warm wind seemed to grow thicker and smell sweeter. At each new place, she felt she had to sit down again and enjoy the sight and scent. In this way, the hours slipped by.
        - id: ch01-b74
          speaker: narrator
          text: It was long past noon when a small troop of goats marched solemnly toward the flower field, with Greenfinch leading them. They never came there to feed, since they did not care to graze on flowers. They looked almost like an official party sent to find the companions who had deserted them and stayed away far longer than usual. Goats always knew the time. As soon as Greenfinch spotted the three missing friends among the blossoms, she gave an extra-loud bleat. Every other goat joined in, and the whole company trotted toward the children.
        - id: ch01-b75
          speaker: narrator
          text: Peter woke and rubbed his eyes. He had been dreaming that Clara's chair stood whole and undamaged outside Grandfather's hut. Its beautiful red padding was in place, and the brass-headed nails shone all around it. Just as he woke, he thought those bright nails were still before him. Then he saw that they were only the yellow flowers beside his face. The terrible fear that had disappeared during his dream came rushing back. Heidi had promised not to do anything to him, but his deed might still be discovered some other way. His spirits sank so low that he let Heidi direct him and helped Clara back without a murmur.
        - id: ch01-b76
          speaker: narrator
          text: Once all three reached their old resting place, Heidi ran to fetch the food bag. Now she could keep the promise that had been behind her morning threat. She had watched Grandfather pack all kinds of good things, and she had been happy to think Peter would receive a large share. When he first refused to help, Heidi had only meant to warn him that he might get none of the dinner. Peter's guilty conscience had given her words a completely different and far more frightening meaning.
        - id: ch01-b77
          speaker: narrator
          text: Heidi took everything from the bag and divided it into three generous portions. Each share was so large that she felt sure she and Clara would have plenty left to give Peter even more. She handed out the dinners, then sat beside Clara with her own. After all their effort, the three ate with good appetites. It ended just as Heidi had expected. When she and Clara had eaten all they wanted, their leftovers gave Peter a second helping as large as his first. He swallowed every last crumb, but the meal brought none of his usual pleasure. Each mouthful seemed to choke him, while something inside kept gnawing at him.
        - id: ch01-b78
          speaker: narrator
          text: Because dinner had begun so late, they did not have long to wait after finishing. Soon Grandfather appeared on the mountain. The moment Heidi saw him, she rushed forward. She wanted to be the very first to tell him the wonderful news. When she reached him, excitement made it almost impossible to get the words out. Grandfather soon understood her, though, and a look of great happiness came over his face. He hurried to the place where Clara sat.
        - id: ch01-b79
          speaker: grandfather
          text: So, you made the effort, and you won the day!
          emotion: happy
        - id: ch01-b80
          speaker: narrator
          text: Grandfather lifted Clara to her feet. He placed his left arm securely behind her and gave her his right arm to lean on. With such strong support around her, she walked a short distance with less trembling and hesitation than before. Heidi skipped beside her in triumphant delight. Grandfather's face made it seem as though some great happiness had happened to him as well. After a little way, he stopped and gathered Clara into his arms.
        - id: ch01-b81
          speaker: grandfather
          text: We mustn't do too much at once. It's well past time to go home.
        - id: ch01-b82
          speaker: narrator
          text: Grandfather started down the mountain path with Clara in his arms. She had used more strength than ever before, and he was anxious to get her safely indoors where she could rest after the unusual effort.
        - id: ch01-b83
          speaker: narrator
          text: When Peter reached Dorfli that evening, he found a large crowd gathered around one spot. People pushed against one another and peered over shoulders, each trying to see something on the ground. Peter wanted a look too. He poked and elbowed until he reached the front. There lay the very thing he had wanted to see. Clara's chair was scattered in pieces across the grass. Part of the back remained, along with the middle section and enough red padding and bright nails to show how magnificent the chair had been when it was whole.
        - id: ch01-b84
          speaker: baker
          text: I saw the men carrying it up the mountain. I bet it cost at least twenty-five pounds. How could an accident like this happen?
        - id: ch01-b85
          speaker: village_woman
          text: Uncle said perhaps the wind did it.
        - id: ch01-b86
          speaker: narrator
          text: The woman could not stop admiring the red upholstery.
        - id: ch01-b87
          speaker: baker
          text: It's lucky nobody but the wind was responsible. If someone did this, he'd pay for it! Once the gentleman in Frankfurt hears, he'll surely investigate. I'm glad no one has seen me on the mountain for two years. They'll suspect anyone who was up there at the time.
        - id: ch01-b88
          speaker: narrator
          text: The villagers went on offering one opinion after another, but Peter had heard more than enough. He crept quietly out of the crowd. Then he took to his heels and raced home as fast as he could, as though someone were already chasing him. The baker's words had filled him with fear and trembling. Peter became certain that any day now, a policeman would arrive from Frankfurt to investigate the chair. Then the whole truth would come out. He would be seized, carried all the way to Frankfurt, and locked in prison. He could see everything that was going to happen so clearly that his hair stood on end with terror.
        - id: ch01-b89
          speaker: narrator
          text: Peter reached home with his mind in turmoil. No matter what anyone said to him, he would not open his mouth to answer. He would not even eat his potatoes. All he could do was creep off to bed as quickly as possible, pull the bedclothes over himself, and lie there groaning.
        - id: ch01-b90
          speaker: brigitta
          text: Peter must have eaten sorrel again. Listen to him groan. His stomach is clearly hurting.
        - id: ch01-b91
          speaker: grandmother
          text: Give him more bread to take tomorrow. He can have a piece of mine.
        - id: ch01-b92
          speaker: narrator
          text: That night, Heidi and Clara lay in bed looking at the stars.
        - id: ch01-b93
          speaker: heidi
          text: I've been thinking all day. Sometimes we ask God for something again and again, but He doesn't give it to us because He knows there's something better. Have you ever felt that?
        - id: ch01-b94
          speaker: clara
          text: Why are you asking me that tonight?
        - id: ch01-b95
          speaker: heidi
          text: When I was in Frankfurt, I prayed and prayed to go home right away. But I wasn't allowed to leave, and I thought God had forgotten me. Now look what would have happened if I'd come home the moment I asked. You never would have visited the mountain, and you never would have gotten well.
        - id: ch01-b96
          speaker: narrator
          text: Clara thought about this carefully.
        - id: ch01-b97
          speaker: clara
          text: But then maybe we should never pray for anything. God always knows something better than what we want.
        - id: ch01-b98
          speaker: heidi
          text: No, Clara, that's not how it is. We must go on praying for everything. That way, God knows we haven't forgotten that everything comes from Him. Grandmamma told me that when we forget God, He lets us go our own way, and then we get into trouble. And if He doesn't give us what we ask for, we mustn't decide He didn't hear us and stop praying. We should keep praying and say, “Dear God, I know You're saving something better for me. I won't be unhappy, because I know You'll make everything right in the end.”
        - id: ch01-b99
          speaker: clara
          text: How did you learn all that?
        - id: ch01-b100
          speaker: heidi
          text: Grandmamma explained it first. Then everything happened just as she said, so I knew it for myself. And Clara, we should thank God tonight. You can walk, and He has made us so happy.
        - id: ch01-b101
          speaker: clara
          text: You're right, Heidi. I'm glad you reminded me. I was so happy that I almost forgot my prayers.
        - id: ch01-b102
          speaker: narrator
          text: The two children said their prayers together beneath the stars. Each thanked God in her own way for the blessing He had given Clara, after she had spent so long lying weak and ill.
        - id: ch01-b103
          speaker: narrator
          text: The next morning, Grandfather suggested that the girls write to Grandmamma. They could ask her to visit because they had something new to show her. The children had another plan. They wanted to prepare a great surprise. First, Clara would practice walking until she could go a little way by herself. Most important of all, Grandmamma must not hear even a hint about it. They asked Grandfather how long the practice might take. When he said a week or less, the girls sat down at once and wrote a pressing invitation. They asked Grandmamma to come soon but never mentioned that there was anything new to see.
        - id: ch01-b104
          speaker: narrator
          text: The days that followed were some of the most joyful Clara had ever spent on the mountain. Every morning, the instant she woke, a happy voice seemed to call inside her, “I'm well now! I'm well! I won't have to spend my life in a chair. I can walk by myself like other people!”
        - id: ch01-b105
          speaker: narrator
          text: Then the day's walking practice began. Every day, Clara found it easier, and every day she could go a little farther. All that movement gave her such a strong appetite that Grandfather cut her bread and butter a little thicker each time. He was well pleased to watch every bite disappear. Along with it, he brought out a large jug full of foaming milk. He filled Clara's little bowl over and over, and she drank it all.
        - id: ch01-b106
          speaker: narrator
          text: In this happy way, another full week passed. Each day brought Clara more strength, more food, and more confidence in her steps. She could feel the difference whenever she stood and moved. At last, the long-awaited day arrived, the day that would bring Grandmamma up the mountain for her second visit.
