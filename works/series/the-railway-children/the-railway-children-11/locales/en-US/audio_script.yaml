  chapters:
    - id: ch01
      title: The Secret
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Bobbie knew the secret now. An old newspaper wrapped around a parcel had told her, by pure chance. Then she had to go down to tea and act as though nothing was wrong. She tried bravely, but she could not hide it very well.
        - id: ch01-b02
          speaker: narrator
          text: Everyone looked up when she came in. Her eyelids were pink, her face was pale, and red marks showed where her tears had been.
        - id: ch01-b03
          speaker: mother
          text: My darling, what in the world is wrong?
          emotion: surprised
        - id: ch01-b04
          speaker: narrator
          text: Mother sprang up from the tea tray.
        - id: ch01-b05
          speaker: roberta
          text: My head hurts a little.
        - id: ch01-b06
          speaker: narrator
          text: That much was true. Her head really did hurt.
        - id: ch01-b07
          speaker: mother
          text: Has something happened?
        - id: ch01-b08
          speaker: roberta
          text: I'm all right. Really.
        - id: ch01-b09
          speaker: narrator
          text: Bobbie could not say what she meant with Peter and Phyllis sitting there. Instead, she looked straight at Mother through her swollen eyes and tried to send one short, desperate message without words. Please, not now. Not in front of the others. Mother understood enough to let the question wait.
        - id: ch01-b10
          speaker: narrator
          text: Tea was miserable. Peter could plainly see that something awful had happened to Bobbie, and it upset him so much that he hardly spoke at all. He only asked for more bread and butter, over and over, with hardly any time between. Phyllis reached under the table to stroke her sister's hand and show that she cared. While doing it, she knocked over her cup. Bobbie fetched a cloth and wiped up the spilled milk, and having something useful to do helped a little. Even so, she thought tea would never end. Of course, like everything else, it ended at last. Mother carried out the tray, and Bobbie followed her.
        - id: ch01-b11
          speaker: phyllis
          text: She's gone to confess. What do you think she did?
        - id: ch01-b12
          speaker: peter
          text: Broke something, probably. She needn't make such a fuss. Mother never scolds us for accidents. Listen. They're going upstairs. Bobbie must be showing her what broke. I bet it's that water pitcher with the storks.
        - id: ch01-b13
          speaker: narrator
          text: In the kitchen, while Mother set down the tea things, Bobbie took hold of her hand.
        - id: ch01-b14
          speaker: mother
          text: What is it?
        - id: ch01-b15
          speaker: roberta
          text: Come upstairs. Please come somewhere no one can hear us.
        - id: ch01-b16
          speaker: narrator
          text: Once they were alone in Bobbie's room, she locked the door. Then she stood perfectly still, unable to say a word. All through tea she had been deciding how to begin. She had prepared several grand, terrible sentences. She might announce that she knew everything. She might say that all had been revealed to her, or that the terrible secret was a secret no longer. Each one had seemed proper downstairs. But now Bobbie was alone with Mother and that dreadful sheet of newspaper. Every prepared sentence vanished, and no words would come at all.
        - id: ch01-b17
          speaker: narrator
          text: Suddenly Bobbie threw her arms around Mother and began to cry again.
        - id: ch01-b18
          speaker: roberta
          text: Oh, Mummy. Oh, Mummy. Oh, Mummy.
          emotion: sad
        - id: ch01-b19
          speaker: narrator
          text: Mother held her close and waited. Then Bobbie pulled away, went to the bed, and drew the hidden paper from under her mattress. Her finger shook as she pointed to Father's name.
        - id: ch01-b20
          speaker: mother
          text: Oh, Bobbie. You don't believe this, do you? You don't believe Daddy did it?
          emotion: fearful
        - id: ch01-b21
          speaker: roberta
          text: No!
        - id: ch01-b22
          speaker: narrator
          text: Bobbie nearly shouted it, and her tears stopped.
        - id: ch01-b23
          speaker: mother
          text: Then that's what matters. It isn't true. They've put him in prison, but he did nothing wrong. He's good and noble and honorable, and he's ours. We must remember that. We must be proud of him, and we must wait.
        - id: ch01-b24
          speaker: narrator
          text: Bobbie clung to Mother once more. Again she could manage only one word.
        - id: ch01-b25
          speaker: roberta
          text: Daddy. Oh, Daddy. Daddy.
          emotion: sad
        - id: ch01-b26
          speaker: roberta
          text: Why didn't you tell me, Mummy?
        - id: ch01-b27
          speaker: mother
          text: Are you going to tell Peter and Phyllis?
        - id: ch01-b28
          speaker: roberta
          text: No.
        - id: ch01-b29
          speaker: mother
          text: Why not?
        - id: ch01-b30
          speaker: roberta
          text: Because...
        - id: ch01-b31
          speaker: mother
          text: Exactly. Now you understand why I didn't tell you. You and I must help each other be brave.
        - id: ch01-b32
          speaker: roberta
          text: Yes. Mother, would it hurt you more to tell me everything? I want to understand.
        - id: ch01-b33
          speaker: narrator
          text: Bobbie curled up close beside Mother and heard the whole story. Mother told her about those men who had asked to see Father on the last night at their old home, while the toy engine was being fixed. They had not come for an ordinary visit. They had come to arrest him. Father was charged with selling government secrets to the Russians. In other words, they accused him of being a spy and a traitor. Then there had been a trial. The evidence against him included letters found in Father's desk at the office, and those letters had persuaded the jury that he was guilty.
        - id: ch01-b34
          speaker: roberta
          text: How could they look at him and believe that? How could anyone do something so terrible?
          emotion: surprised
        - id: ch01-b35
          speaker: mother
          text: Someone did. And all the evidence pointed to Father. Those letters...
        - id: ch01-b36
          speaker: roberta
          text: Then how did they get into his desk?
        - id: ch01-b37
          speaker: mother
          text: Someone put them there. Whoever planted them was the person who was truly guilty.
        - id: ch01-b38
          speaker: roberta
          text: He must feel awful now, whoever he is.
        - id: ch01-b39
          speaker: mother
          text: I don't believe he has any feelings. No one with feelings could do such a thing.
          emotion: angry
        - id: ch01-b40
          speaker: roberta
          text: Maybe he only shoved the letters into Father's desk to hide them when he thought he'd be caught. Why can't you tell the lawyers it must have been him? Nobody would have wanted to hurt Father on purpose, would they?
        - id: ch01-b41
          speaker: mother
          text: I don't know. The man who worked under Daddy took his position after it happened. He'd always been jealous because Daddy was clever and everyone respected him. And Daddy never quite trusted him.
        - id: ch01-b42
          speaker: roberta
          text: Couldn't we explain that to someone?
        - id: ch01-b43
          speaker: mother
          text: No one will listen. No one at all. Do you think I haven't tried everything? There's nothing more we can do. You and I and Daddy can only be brave and patient and... pray, Bobbie dear.
          emotion: sad
        - id: ch01-b44
          speaker: roberta
          text: Mother, you've gotten very thin.
        - id: ch01-b45
          speaker: mother
          text: A little, perhaps.
        - id: ch01-b46
          speaker: roberta
          text: I think you're the bravest person in the whole world. And the nicest.
        - id: ch01-b47
          speaker: mother
          text: Let's not speak of this again, dear. We have to bear it bravely. And try not to think about it. Be cheerful when you can, and enjoy yourself with the others. It makes things easier for me if you can be a little happy. Now wash that poor round face, and we'll go into the garden for a while.
        - id: ch01-b48
          speaker: narrator
          text: When Bobbie and Mother went back, Peter and Phyllis were especially gentle and kind to her. Neither one asked what was wrong. That silence was Peter's idea. He had carefully instructed Phyllis not to ask questions, because left to herself, she would have asked a hundred of them.
    - id: ch02
      title: Bobbie Asks for Help
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: A week later, Bobbie managed to get away by herself. Once again she wrote to the old gentleman.
        - id: ch02-b02
          speaker: roberta
          text: My dear Friend, you can see what this newspaper says, but it isn't true. Father never did it. Mother says someone put the letters in his desk. She says the man who worked under him was jealous, and he took Father's position afterward. Father had distrusted him for a long time. Nobody listens to Mother, but you're so good and clever. You found the Russian gentleman's wife right away. Couldn't you find out who really committed the treason? It wasn't Father, upon my honor. He's an Englishman and could never do such a thing. If you found the guilty person, they would let Father out of prison. It's dreadful, and Mother is getting so thin. She once told us to pray for all prisoners and captives. Now I understand. Please help me. Only Mother and I know, and we can't do anything. Peter and Phil don't know. I'll pray for you twice every day for the rest of my life if you'll only try. Just think how you would feel if it were your daddy. Oh, please, please help me. With love, I remain your affectionate little friend, Roberta. P.S. Mother would send her kind regards if she knew I was writing. But I won't tell her, in case you can't do anything. I know you will, though. Bobbie, with best love.
        - id: ch02-b03
          speaker: narrator
          text: With Mother's large cutting-out scissors, Bobbie carefully clipped the whole account of Father's trial from the newspaper. She folded it into the envelope with her letter. Then she slipped out by the back way and went around to the station by road. If the others saw her, they would ask where she was going and offer to come along, and she needed to go alone. At the station, she gave the envelope to the Station Master and asked him to hand it to the old gentleman when he came through the next morning.
        - id: ch02-b04
          speaker: peter
          text: Where have you been?
        - id: ch02-b05
          speaker: narrator
          text: Peter called from the top of the yard wall, where he sat with Phyllis.
        - id: ch02-b06
          speaker: roberta
          text: The station, of course. Give me a hand, Pete.
        - id: ch02-b07
          speaker: narrator
          text: Bobbie put one foot on the lock of the yard door, and Peter reached down to pull her up. When she reached the top, she stared. Both children were very muddy. A lump of wet clay sat on the wall between them, and each held a piece of slate in one filthy hand. Behind Peter, carefully placed beyond the reach of accidents, lay several strange rounded objects. They looked a little like enormously fat sausages. Each one was hollow, but sealed at one end.
        - id: ch02-b08
          speaker: roberta
          text: What in the world are those?
        - id: ch02-b09
          speaker: peter
          text: Nests. Swallows' nests. We'll dry them in the oven and hang them under the coach-house eaves with string.
        - id: ch02-b10
          speaker: phyllis
          text: Then we'll save every bit of wool and hair we can find. In spring we'll line the nests, and the swallows will be so pleased.
        - id: ch02-b11
          speaker: peter
          text: People don't do nearly enough for animals that can't speak. Someone ought to have thought of making nests for poor little swallows before now.
        - id: ch02-b12
          speaker: roberta
          text: Well, if everyone thought of everything, there'd be nothing left for anyone else to think of.
        - id: ch02-b13
          speaker: phyllis
          text: Look at them. Aren't they pretty?
        - id: ch02-b14
          speaker: narrator
          text: Phyllis reached across Peter for a nest.
        - id: ch02-b15
          speaker: peter
          text: Watch out, Phil, you goat!
        - id: ch02-b16
          speaker: narrator
          text: Too late. Her strong fingers crushed it.
        - id: ch02-b17
          speaker: peter
          text: Now look what you did.
        - id: ch02-b18
          speaker: roberta
          text: Never mind.
        - id: ch02-b19
          speaker: phyllis
          text: It was one of mine, so you don't need to scold me. We put our initials on them. That way the swallows will know who to thank and love.
        - id: ch02-b20
          speaker: peter
          text: Swallows can't read, silly.
        - id: ch02-b21
          speaker: phyllis
          text: You're silly. How do you know?
        - id: ch02-b22
          speaker: peter
          text: Who thought of making the nests in the first place?
          emotion: angry
        - id: ch02-b23
          speaker: phyllis
          text: I did!
          emotion: angry
        - id: ch02-b24
          speaker: peter
          text: No, you only wanted to make hay nests for sparrows and stick them in the ivy. They'd be soaked long before egg-laying time. I was the one who said clay and swallows.
        - id: ch02-b25
          speaker: phyllis
          text: I don't care what you said.
        - id: ch02-b26
          speaker: roberta
          text: There. I've fixed it. Give me the stick so I can mark your initial. But wait, how can you tell yours from Peter's? They're both P.
        - id: ch02-b27
          speaker: phyllis
          text: I use F for Phyllis because that's how it sounds. I'm certain the swallows wouldn't spell it with a P.
        - id: ch02-b28
          speaker: peter
          text: They can't spell anything.
        - id: ch02-b29
          speaker: phyllis
          text: Then why do Christmas cards and valentines show swallows carrying letters around their necks? How would they know where to take them if they couldn't read?
        - id: ch02-b30
          speaker: peter
          text: Those are only pictures. You've never seen a real swallow with letters around its neck.
        - id: ch02-b31
          speaker: phyllis
          text: Well, I've heard of a pigeon doing it. Daddy told me. The letters were under its wings instead of around its neck, but that's practically the same, and...
        - id: ch02-b32
          speaker: roberta
          text: Listen, there's a paper chase tomorrow.
        - id: ch02-b33
          speaker: peter
          text: Who's running it?
        - id: ch02-b34
          speaker: roberta
          text: The Grammar School. Perks thinks the hare will start along the railway. We could watch from the cutting. You can see a long way there.
        - id: ch02-b35
          speaker: narrator
          text: The paper chase was much more interesting than whether swallows could read. Bobbie had hoped it would be. The next morning Mother let them pack lunch and spend the day watching it.
        - id: ch02-b36
          speaker: peter
          text: If we go to the cutting, we'll see the workmen even if we miss the chase.
    - id: ch03
      title: The Paper Chase
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: It had taken a long time to clear the line after the great landslide. Rocks, earth, and trees had all fallen across the tracks. That was the day, you may remember, when the three children saved a train from being wrecked by waving six little flags cut from red flannel petticoats. The children often went down to the cutting to watch the repairs. Work is always interesting when it uses picks, spades, shovels, planks, and wheelbarrows rolling along boards. The workmen also had red, cindery fires inside iron pots pierced with round holes. At night, red warning lamps hung near the tracks. The children were never allowed out there after dark. But once, at dusk, Peter had climbed through his bedroom skylight and onto the roof. From there he saw a red lamp shining far away at the edge of the cutting.
        - id: ch03-b02
          speaker: narrator
          text: That morning, the workmen and their tools were so interesting that the children forgot the paper chase completely. Then a voice panted just behind them.
        - id: ch03-b03
          speaker: paperchase_hare
          text: Please, let me through.
        - id: ch03-b04
          speaker: narrator
          text: It was the hare, a tall, loosely built boy. His dark hair lay flat on his wet forehead, and a strap held a bag of torn paper across one shoulder. The children stepped aside. He ran steadily along the track while the workmen rested on their picks to watch. Then he vanished into the tunnel.
        - id: ch03-b05
          speaker: foreman_bates
          text: That's against the rules.
        - id: ch03-b06
          speaker: oldest_workman
          text: Why fret about it? Live and let live, that's what I say. Weren't you ever young, Mr. Bates?
        - id: ch03-b07
          speaker: foreman_bates
          text: I ought to report him.
        - id: ch03-b08
          speaker: oldest_workman
          text: And spoil the fun? Why would you do that?
        - id: ch03-b09
          speaker: foreman_bates
          text: Passengers aren't allowed to cross the tracks for any reason.
        - id: ch03-b10
          speaker: workman_one
          text: That lad isn't a passenger.
        - id: ch03-b11
          speaker: workman_two
          text: And we never saw him cross the tracks.
        - id: ch03-b12
          speaker: workman_three
          text: Didn't see him make any excuses, either.
        - id: ch03-b13
          speaker: oldest_workman
          text: Besides, he's out of sight now. What the eye doesn't see, the heart needn't worry about. That's what I always say.
        - id: ch03-b14
          speaker: narrator
          text: Then the hounds came after him, following the little white patches of torn paper. There were thirty boys in all. They climbed down the steep steps, which looked almost like a ladder, in ones and twos, then threes, sixes, and sevens. Bobbie, Peter, and Phyllis counted every runner who passed. The boys at the front hesitated when they reached the bottom. Then they caught sight of the scattered white trail gleaming along the tracks. They turned toward the tunnel. One after another, and then in small groups, all thirty disappeared into its dark mouth. The very last boy wore a red jersey. As he entered the darkness, he seemed to go out like the flame of a candle.
        - id: ch03-b15
          speaker: foreman_bates
          text: They don't know what they've gotten into. Running in the dark isn't easy, and that tunnel bends two or three times.
        - id: ch03-b16
          speaker: peter
          text: Do you think it'll take them long to get through?
        - id: ch03-b17
          speaker: foreman_bates
          text: Could take an hour or more.
        - id: ch03-b18
          speaker: peter
          text: Then let's cross over the hill and watch them come out the other side. We'll beat them there easily.
        - id: ch03-b19
          speaker: narrator
          text: That sounded like a good plan. The children climbed the steep steps where they had once picked wild cherry blossoms for a little rabbit's grave. At the top of the cutting, they turned toward the hill above the tunnel. The climb was hard.
        - id: ch03-b20
          speaker: roberta
          text: This is like climbing the Alps.
        - id: ch03-b21
          speaker: peter
          text: Or the Andes.
        - id: ch03-b22
          speaker: phyllis
          text: It's like the Himmy-what's-it mountains. Mount Everlasting. Can't we stop?
        - id: ch03-b23
          speaker: peter
          text: Keep going. You'll catch your second wind soon.
        - id: ch03-b24
          speaker: narrator
          text: Phyllis agreed to keep going. They ran whenever the turf was smooth and the slope became easy. Where it grew steep, they clambered over stones. They pulled themselves up rocks by grabbing tree branches and squeezed through narrow openings between tree trunks and boulders. On and on they went, always climbing higher, until at last all three stood at the very top of the hill they had so often wanted to visit.
        - id: ch03-b25
          speaker: peter
          text: Halt!
        - id: ch03-b26
          speaker: narrator
          text: Peter dropped flat on the grass. The hilltop was a smooth green table dotted with mossy rocks and small mountain ash trees. The girls fell down beside him.
        - id: ch03-b27
          speaker: peter
          text: We have plenty of time. It's downhill from here.
        - id: ch03-b28
          speaker: narrator
          text: When they had rested enough to sit up and look around, Bobbie gave a cry.
        - id: ch03-b29
          speaker: roberta
          text: Oh, look!
        - id: ch03-b30
          speaker: phyllis
          text: At what?
        - id: ch03-b31
          speaker: roberta
          text: The view.
        - id: ch03-b32
          speaker: phyllis
          text: I hate views. Don't you, Peter?
        - id: ch03-b33
          speaker: peter
          text: Let's keep moving.
        - id: ch03-b34
          speaker: roberta
          text: But this isn't one of those seaside views people drive you to, with nothing but sand, water, and bare hills. This looks like the colored counties in Mother's poetry book.
        - id: ch03-b35
          speaker: peter
          text: It's pretty good. Look at the aqueduct stretching across the valley like a giant centipede. And see the towns poking their church steeples out of the trees like pens in an inkstand. It makes me think of that poem about seeing the banners of twelve fair cities shine.
        - id: ch03-b36
          speaker: roberta
          text: I love it. It was worth the climb.
        - id: ch03-b37
          speaker: phyllis
          text: The paper chase will be worth it, if we haven't missed it. Come on. It's downhill now.
        - id: ch03-b38
          speaker: peter
          text: That's what I said ten minutes ago.
        - id: ch03-b39
          speaker: phyllis
          text: Well, I'm saying it now. Come on.
        - id: ch03-b40
          speaker: peter
          text: We have loads of time.
        - id: ch03-b41
          speaker: narrator
          text: And they did. When they came down near the top of the tunnel entrance, they found they were a few hundred yards off course. They had to creep along the hillside. No hare or hounds were in sight.
        - id: ch03-b42
          speaker: phyllis
          text: Of course they're long gone.
        - id: ch03-b43
          speaker: narrator
          text: The children leaned over the brick wall above the tunnel.
        - id: ch03-b44
          speaker: roberta
          text: I don't think so. Even if they are, this is a wonderful spot. We can watch trains burst out of the tunnel like dragons leaving their caves. We've never seen that from above.
        - id: ch03-b45
          speaker: phyllis
          text: No, we haven't.
        - id: ch03-b46
          speaker: narrator
          text: That answer made Phyllis feel a little better. It truly was an exciting place to stand. From above, the top of the tunnel seemed much farther from the railway line than any of them had expected. Leaning there felt like standing on a high bridge. But this bridge did not look built and bare. Bushes and creeping vines covered it, with grass and wildflowers growing everywhere.
        - id: ch03-b47
          speaker: narrator
          text: Every two minutes Phyllis insisted that the chase had already passed. She could not decide whether to be pleased or disappointed when Peter suddenly leaned over the wall and cried out.
        - id: ch03-b48
          speaker: peter
          text: Watch out! Here he comes!
        - id: ch03-b49
          speaker: narrator
          text: They all leaned over in time to see the hare emerge slowly from the tunnel's shadow.
        - id: ch03-b50
          speaker: peter
          text: There! What did I tell you? Now let's see the hounds.
        - id: ch03-b51
          speaker: narrator
          text: The hounds appeared soon afterward. They came out in ones and twos, then threes, sixes, and sevens, just as they had gone in. Every one of them was moving slowly now, and all looked tired from the long run through the curving darkness. Two or three boys had fallen far behind. They did not emerge until long after the others.
        - id: ch03-b52
          speaker: roberta
          text: That's everyone. What should we do now?
        - id: ch03-b53
          speaker: phyllis
          text: Let's eat lunch in that dark, tangled wood. From here, we can watch them for miles.
        - id: ch03-b54
          speaker: peter
          text: Not yet. One boy is missing. The one in the red jersey hasn't come out. Let's wait for him.
        - id: ch03-b55
          speaker: narrator
          text: They waited and waited, but the red jersey never appeared.
    - id: ch04
      title: The Hound in the Red Jersey
      blocks:
        - id: ch04-b01
          speaker: phyllis
          text: Oh, let's eat. My stomach hurts because I'm so hungry. You must have missed him when he came out with the others.
        - id: ch04-b02
          speaker: narrator
          text: Bobbie and Peter were certain they had not missed him.
        - id: ch04-b03
          speaker: peter
          text: Let's go down to the tunnel entrance. Maybe we'll see him coming from inside. He might have worn himself out and stopped in one of the manholes. Bob, stay here and watch. Come down when I signal. With all these trees, we could pass him on the way without seeing him.
        - id: ch04-b04
          speaker: narrator
          text: Peter and Phyllis climbed down first while Bobbie kept watch from above. When they reached the railway, they signaled for her to follow. Bobbie scrambled down by a roundabout, slippery path, picking her way among tree roots and patches of moss. At last she stepped out between two dogwood trees and joined them on the line. They looked toward the tunnel once more. There was still no sign of the hound in the red jersey.
        - id: ch04-b05
          speaker: phyllis
          text: Please, please give me something to eat. I'll die if you don't, and then you'll be sorry.
        - id: ch04-b06
          speaker: peter
          text: Give her a sandwich, for goodness' sake, so she'll stop complaining. And Bobbie, maybe we'd better eat one too. We'll need our strength. Only one, though. We don't have time for more.
        - id: ch04-b07
          speaker: roberta
          text: Why will we need our strength?
        - id: ch04-b08
          speaker: narrator
          text: Bobbie's mouth was already full. She was every bit as hungry as Phyllis.
        - id: ch04-b09
          speaker: peter
          text: Don't you see? The boy in red has had an accident. Maybe right this minute he's lying with his head on the rail, helpless in front of the next express train.
        - id: ch04-b10
          speaker: roberta
          text: Don't talk like a storybook. Come on. Phil, stay right behind me. If a train comes, press yourself against the tunnel wall and hold your skirts close.
        - id: ch04-b11
          speaker: narrator
          text: Bobbie swallowed the rest of her sandwich.
        - id: ch04-b12
          speaker: phyllis
          text: Give me one more sandwich, and I will.
        - id: ch04-b13
          speaker: peter
          text: I'm leading. This was my idea.
        - id: ch04-b14
          speaker: narrator
          text: And Peter went in first. You know what a tunnel feels like when you ride through it on a train. The engine gives a scream. All at once, the rattle of the wheels changes and grows much louder. Grown-ups pull the windows up and hold them by their straps. Inside the railway car, day suddenly turns to night. There are lamps, unless you happen to be on a slow local train that has none. After a while, cloudy white steam drifts outside the glass. Then a blue light touches the walls. The roar changes once more, and the train bursts into the good open air. The grown-ups release the straps. Windows dimmed by the tunnel's yellow breath rattle back down. Outside, the telegraph wires dip and rise beside the tracks. Beyond them run straight-cut hawthorn hedges, with tiny young trees growing at even spaces along the top.
        - id: ch04-b15
          speaker: narrator
          text: Walking into a tunnel on your own feet is completely different. Your shoes tread on loose stones and gravel that shift and slide beneath you. The narrow path curves down from the shining rails toward the wall. Wet, slimy trickles of water ooze along the inside of the tunnel. Near the entrance, the bricks are red and brown. Farther in, they become a dull, sticky, unhealthy green. When you speak, your own voice comes back changed from the voice you had outside in the sunshine. And it takes a surprisingly long time before the tunnel becomes completely dark.
        - id: ch04-b16
          speaker: narrator
          text: Before it grew completely dark, Phyllis grabbed Bobbie's skirt and tore out half a yard of gathers. No one noticed just then.
        - id: ch04-b17
          speaker: phyllis
          text: I want to go back. I don't like this. It'll be pitch-black in a minute, and I won't keep going in the dark. I don't care what you say. I won't!
          emotion: fearful
        - id: ch04-b18
          speaker: peter
          text: Don't be a silly cuckoo. I have a piece of candle and some matches. Wait. What's that?
        - id: ch04-b19
          speaker: narrator
          text: A low hum ran along the rails. The wires trembled beside them. The buzzing grew louder as they listened.
        - id: ch04-b20
          speaker: roberta
          text: It's a train.
        - id: ch04-b21
          speaker: peter
          text: Which track?
        - id: ch04-b22
          speaker: phyllis
          text: Let me go back!
          emotion: fearful
        - id: ch04-b23
          speaker: narrator
          text: Phyllis struggled against Bobbie's grip.
        - id: ch04-b24
          speaker: roberta
          text: Don't be afraid. We'll be safe. Stand back.
          emotion: calm
        - id: ch04-b25
          speaker: peter
          text: Come on! Quick! There's a manhole!
        - id: ch04-b26
          speaker: narrator
          text: The approaching roar grew louder and louder. It sounded worse than putting your head beneath the bathwater while both taps ran and your heels kicked the metal sides. Peter had shouted with all his strength, so Bobbie managed to hear him through the noise. She dragged Phyllis toward the manhole. Phyllis stumbled over the wires and scraped both legs, but there was no time to stop. The others hauled her into the dark, damp, arched hollow in the wall, and all three crowded inside.
        - id: ch04-b27
          speaker: narrator
          text: The train thundered closer until it seemed it would deafen them. Far down the tunnel, its fiery eyes grew larger and brighter.
        - id: ch04-b28
          speaker: phyllis
          text: It is a dragon! I always knew it was! In the dark, it turns back into its real shape!
          emotion: fearful
        - id: ch04-b29
          speaker: narrator
          text: No one heard her. The train was shouting too, and its voice was greater than hers. It swept upon them with a rush, a roar, and a rattle. The lighted carriage windows made one long, dazzling flash. Smoke filled their noses, and a blast of hot air struck them. The train clanged and crashed past, and every sound echoed beneath the tunnel's high curved roof. Phyllis and Bobbie held tight to each other. Even Peter grabbed Bobbie's arm. Later, of course, he explained that he had only held on in case Bobbie became frightened.
        - id: ch04-b30
          speaker: narrator
          text: The train's red tail lights slowly grew smaller and smaller in the distance. Its terrible noise shrank with them. At last there came one final rushing sound as the train carried itself out of the far end of the tunnel. Then the darkness closed behind it, and silence settled once more over the damp brick walls and the water dripping from the roof.
        - id: ch04-b31
          speakers: [roberta, peter, phyllis]
          ensemble: chorus
          text: Oh!
        - id: ch04-b32
          speaker: narrator
          text: All three whispered together. Peter lit his candle stub with a shaking hand.
        - id: ch04-b33
          speaker: peter
          text: Come on.
        - id: ch04-b34
          speaker: narrator
          text: He had to clear his throat before his voice sounded normal.
        - id: ch04-b35
          speaker: phyllis
          text: What if the boy in red was in the train's way?
          emotion: fearful
        - id: ch04-b36
          speaker: peter
          text: We have to find out.
        - id: ch04-b37
          speaker: phyllis
          text: Couldn't we go back and send someone from the station?
        - id: ch04-b38
          speaker: roberta
          text: Would you rather stay here alone while we go?
        - id: ch04-b39
          speaker: narrator
          text: That settled it. The three children went deeper into the tunnel. Peter led the way, holding his candle high. Melted grease ran over his fingers and all the way up his sleeve. At bedtime he found a streak from his wrist to his elbow.
        - id: ch04-b40
          speaker: narrator
          text: About a hundred and fifty yards beyond the manhole, Peter stopped and called out.
        - id: ch04-b41
          speaker: peter
          text: Hello!
        - id: ch04-b42
          speaker: narrator
          text: Then he hurried forward. When the girls caught up, he had stopped again, only a yard from the person they had come to find. Phyllis caught a flash of red and squeezed her eyes shut. Beside the curving track sat the missing hound. His back rested against the wall, his arms hung loose, and his eyes were closed.
        - id: ch04-b43
          speaker: phyllis
          text: Is that red from blood? Is he completely dead?
          emotion: fearful
        - id: ch04-b44
          speaker: peter
          text: Dead? Of course not. The only red is his jersey. He's fainted, that's all. But what are we supposed to do?
        - id: ch04-b45
          speaker: roberta
          text: Can we move him?
        - id: ch04-b46
          speaker: peter
          text: I don't know. He's awfully big.
        - id: ch04-b47
          speaker: roberta
          text: We could wet his forehead. We don't have water, but milk is wet too. There's a whole bottle.
        - id: ch04-b48
          speaker: peter
          text: And I think you're supposed to rub their hands.
        - id: ch04-b49
          speaker: phyllis
          text: I know people burn feathers.
        - id: ch04-b50
          speaker: peter
          text: That doesn't help when we don't have any feathers.
        - id: ch04-b51
          speaker: phyllis
          text: Well, as it happens, I have a shuttlecock in my pocket. So there!
        - id: ch04-b52
          speaker: narrator
          text: So they tried every remedy they knew. Peter knelt and rubbed the unconscious boy's hands. Bobbie pulled the feathers from Phyllis's shuttlecock and burned them one at a time beneath his nose. Phyllis opened the lunch bottle and splashed warmish milk over his forehead. While they worked, all three children kept speaking to him, as quickly and earnestly as they possibly could.
        - id: ch04-b53
          speakers: [roberta, peter, phyllis]
          ensemble: chorus
          text: Open your eyes! Please speak to us! Please, for our sakes, say something!
