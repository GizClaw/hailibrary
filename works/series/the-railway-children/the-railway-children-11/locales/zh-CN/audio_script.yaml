audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细微幽默和体恤
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中
    bobbie:
      display_name: 博比
      tts:
        delivery: 真诚敏锐，关切时急切而坚定
        timbre: 清亮温暖的少女声
        pace: 自然偏快
        pitch: 中高
    peter:
      display_name: 彼得
      tts:
        delivery: 爽直自信，兴奋时干脆有力
        timbre: 明亮的少年声
        pace: 明快
        pitch: 中高
    phyllis:
      display_name: 菲莉丝
      tts:
        delivery: 天真活泼，想象丰富
        timbre: 轻盈稚嫩的女孩声
        pace: 轻快
        pitch: 高
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔镇定，讲到苦难时克制而悲悯
        timbre: 温润清晰
        pace: 从容
        pitch: 中
    foreman:
      display_name: 领班
      tts:
        delivery: 谨慎守规矩，说话有些迟疑
        timbre: 结实清楚的成年男声
        pace: 适中
        pitch: 中低
    oldest_worker:
      display_name: 老工人
      tts:
        delivery: 随和老练，话里带着朴素的调侃
        timbre: 粗哑温厚的老年男声
        pace: 从容
        pitch: 低
    worker_1:
      display_name: 工人甲
      tts:
        delivery: 朴实随意，语气直截了当
        timbre: 粗粝的成年男声
        pace: 适中
        pitch: 中低
    worker_2:
      display_name: 工人乙
      tts:
        delivery: 随口打趣，语气轻松
        timbre: 明朗的成年男声
        pace: 适中偏快
        pitch: 中
    worker_3:
      display_name: 工人丙
      tts:
        delivery: 简短爽快，带一点戏谑
        timbre: 低沉的成年男声
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 报纸里的秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一张用来包东西的旧报纸，偏偏把那个秘密送到了博比眼前。如今她全知道了，却还得下楼喝茶，装作什么也没发生。她拼命想显得勇敢，可一走进屋，大家就看见她眼皮通红，苍白的脸上还留着哭过的红斑。
        - id: ch01-b02
          speaker: mother
          text: 我的宝贝，你到底怎么了？
        - id: ch01-b03
          speaker: bobbie
          text: 我有点头疼。
        - id: ch01-b04
          speaker: narrator
          text: 她的头确实疼。
        - id: ch01-b05
          speaker: mother
          text: 是不是出了什么事？
        - id: ch01-b06
          speaker: bobbie
          text: 我真的没事。
        - id: ch01-b07
          speaker: narrator
          text: 博比用红肿的眼睛望着妈妈，那目光像一道又短又急的电报，求妈妈别当着弟弟妹妹再问。
        - id: ch01-b08
          speaker: narrator
          text: 这顿茶点一点也不快活。彼得看得出博比遇上了可怕的事，心里也难受。他什么都不肯说，只隔一小会儿就请人再给他一点黄油面包，而且两次开口之间短得惊人。菲莉丝在桌下轻轻摸姐姐的手，想让她知道自己在安慰她，却碰翻了自己的杯子。博比起身取来抹布，又把泼出的牛奶擦干净，忙这几件事倒让她暂时好受了一点。可她还是觉得，这顿茶永远也吃不完。最后，它像世上的一切一样，总算结束了。妈妈端起托盘去厨房，博比紧跟在后面。
        - id: ch01-b09
          speaker: phyllis
          text: 她一定是去向妈妈认错了。可她到底做了什么呢？
        - id: ch01-b10
          speaker: peter
          text: 也许她打碎了东西。不过，失手打坏东西，妈妈从来不骂人，她犯不着难过成那样。听，她们上楼了。博比准是带妈妈去看那只画着鹳的水罐。
        - id: ch01-b11
          speaker: narrator
          text: 妈妈刚在厨房放下茶具，博比就抓住了她的手。
        - id: ch01-b12
          speaker: mother
          text: 到底出了什么事？
        - id: ch01-b13
          speaker: bobbie
          text: 跟我上楼吧。我们得找个谁也听不见的地方。
        - id: ch01-b14
          speaker: narrator
          text: 她们进了妈妈的房间，屋里只剩下她们两个。博比锁好门，直挺挺地站在那里，一个字也说不出来。整个喝茶的时间，她一直在想自己该怎样开口。她可以说“我全知道了”，或者说“一切我都知道了”，再不然就说“那个可怕的秘密已经不是秘密了”。当时她觉得，这几种说法都很合适。可现在，房里真的只有她、妈妈，还有那张可怕的报纸，她反而什么都说不出口。
        - id: ch01-b15
          speaker: narrator
          text: 她猛地扑过去抱住妈妈，又哭了起来。
        - id: ch01-b16
          speaker: bobbie
          text: 妈妈……哦，妈妈，妈妈！
          emotion: sad
        - id: ch01-b17
          speaker: narrator
          text: 妈妈紧紧搂着她，静静等候。忽然，博比挣开怀抱，走到床边，从床垫底下抽出那张报纸。她递给妈妈，用发抖的手指点着爸爸的名字。
        - id: ch01-b18
          speaker: mother
          text: 哦，博比！你没有相信报上的话，对不对？你不会相信爸爸做过那种事吧？
          emotion: fearful
        - id: ch01-b19
          speaker: bobbie
          text: 我不相信！
        - id: ch01-b20
          speaker: narrator
          text: 她几乎喊了出来，眼泪也停住了。
        - id: ch01-b21
          speaker: mother
          text: 那就好。报上说的不是真的。爸爸是被关进了监狱，可他什么坏事也没做。他善良、高尚、正直，他还是我们的爸爸。我们要牢牢记住，要为他骄傲，也要耐心等下去。
          emotion: calm
        - id: ch01-b22
          speaker: narrator
          text: 博比再次紧紧抱住妈妈。这一回，她仍旧只能说出一个词。
        - id: ch01-b23
          speaker: bobbie
          text: 爸爸……哦，爸爸，爸爸！
          emotion: sad
        - id: ch01-b24
          speaker: narrator
          text: 过了一会儿，她终于问出了心里的话。
        - id: ch01-b25
          speaker: bobbie
          text: 妈妈，您为什么一直不告诉我？
        - id: ch01-b26
          speaker: mother
          text: 那你打算把这件事告诉彼得和菲莉丝吗？
        - id: ch01-b27
          speaker: bobbie
          text: 不打算。
        - id: ch01-b28
          speaker: mother
          text: 为什么？
        - id: ch01-b29
          speaker: bobbie
          text: 因为……
        - id: ch01-b30
          speaker: mother
          text: 就是这个缘故。所以你现在懂了，我为什么没有告诉你。往后，我们两个要互相帮忙，一起勇敢起来。
        - id: ch01-b31
          speaker: bobbie
          text: 我懂了。可是妈妈，您把一切都告诉我，会不会更难过？我想知道究竟发生了什么。
        - id: ch01-b32
          speaker: narrator
          text: 博比紧紧偎着妈妈，听她说出了全部经过。那个难忘的夜晚，火车头还在修理，几个男人忽然要求见爸爸。他们不是普通客人，而是专程来逮捕他的。他们指控爸爸把国家机密卖给了俄国人。换句话说，他们说爸爸是间谍，是叛徒。妈妈接着讲到后来的审判，也讲到那些被当作证据的信。那些信是在爸爸办公室的书桌里搜出来的，正因为它们在那里，陪审团才认定爸爸有罪。
        - id: ch01-b33
          speaker: bobbie
          text: 他们明明看着爸爸，怎么还能相信那种事？怎么会有人做得出来！
          emotion: angry
        - id: ch01-b34
          speaker: mother
          text: 可确实有人做了，而且每一件证据都对爸爸不利。尤其是那些信……
        - id: ch01-b35
          speaker: bobbie
          text: 对，那些信为什么会在爸爸的书桌里？
        - id: ch01-b36
          speaker: mother
          text: 是别人放进去的。真正有罪的，是放信的那个人。
        - id: ch01-b37
          speaker: bobbie
          text: 那个人这些日子一定很不好受。
        - id: ch01-b38
          speaker: narrator
          text: 博比认真想了想才这样说。
        - id: ch01-b39
          speaker: mother
          text: 我不信那个人还有良心。有良心的人，绝做不出这样的事。
          emotion: angry
        - id: ch01-b40
          speaker: bobbie
          text: 也许他怕自己被发现，就把信顺手塞进爸爸的书桌，想先藏起来。您为什么不去告诉律师，或者告诉别的人，一定是那个人做的？总不会有人故意陷害爸爸吧？
        - id: ch01-b41
          speaker: mother
          text: 我不知道，我真的不知道。爸爸手下有个人，出事以后接替了他的位置。那人一直嫉妒爸爸，因为爸爸聪明，大家又都器重他。爸爸从前也一直不太信任那个人。
        - id: ch01-b42
          speaker: bobbie
          text: 那我们不能找个人，把这些全解释清楚吗？
        - id: ch01-b43
          speaker: mother
          text: 没有人肯听，一个也没有。你以为我没把能试的办法全试过吗？不，宝贝，我们什么也做不了。你、我和爸爸能做的，只有勇敢，只有耐心，还要……还要祈祷，亲爱的博比。
          emotion: sad
        - id: ch01-b44
          speaker: bobbie
          text: 妈妈，您瘦了好多。
        - id: ch01-b45
          speaker: mother
          text: 也许是瘦了一点。
        - id: ch01-b46
          speaker: bobbie
          text: 我觉得，您不光是世上最好的人，还是世上最勇敢的人！
        - id: ch01-b47
          speaker: mother
          text: 以后我们别再谈这件事了，好吗？我们只能忍耐，勇敢撑过去。宝贝，尽量别总想着它。去找些开心的事做，也带彼得和菲莉丝一起玩。你只要能快活一点，好好享受眼前的日子，我就会轻松许多。现在去洗洗你那张可怜的小圆脸，我们到花园里待一会儿。
          emotion: calm
        - id: ch01-b48
          speaker: narrator
          text: 后来，彼得和菲莉丝对博比格外温柔，谁也没问她出了什么事。这是彼得的主意。他早早叮嘱过菲莉丝，否则，菲莉丝准会一口气问上一百个问题。
    - id: ch02
      title: 写给老先生的信
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一个星期以后，博比想办法独自溜了出去。在这之前，她又给老先生写了一封信。
        - id: ch02-b02
          speaker: bobbie
          text: 亲爱的朋友，请您看看报纸上写的事。那不是真的，爸爸绝没有做过。妈妈说，是有人把那些信放进爸爸的书桌。爸爸手下那个后来接替他职位的人一直嫉妒他，爸爸也早就怀疑那个人。可妈妈说，不管她讲什么，都没有人肯听。您又善良又聪明，上次一下就查到了那位俄国先生的妻子。您能不能也查一查，究竟是谁犯了叛国罪？我用自己的人格担保，那个人绝不是爸爸。他是英国人，不可能做这种事。只要查清真相，他们就会放爸爸出狱。现在一切都太可怕了，妈妈也越来越瘦。她从前教我们为所有囚犯和被俘的人祈祷，现在我终于明白了。求求您帮帮我。这件事只有妈妈和我知道，我们什么也做不了，彼得和菲尔也都不知道。只要您肯试着查一查，我愿意一辈子每天为您祈祷两次。请您想想，如果那个人是您的爸爸，您心里会是什么滋味。求您一定、一定、一定帮帮我。爱您的，我永远是您亲爱的小朋友，罗伯塔。
        - id: ch02-b03
          speaker: bobbie
          text: 又及，如果妈妈知道我写信，一定会托我向您亲切问候。不过，还是别告诉她吧，免得您也没有办法。可我知道，您一定有办法。博比献上最真挚的爱。
        - id: ch02-b04
          speaker: narrator
          text: 她拿起妈妈裁东西用的大剪刀，小心剪下报纸上那篇审判爸爸的报道，再把剪报和信一起装进信封。随后，她从后门悄悄出去，特意绕着大路走向车站。这样，彼得和菲莉丝就不会看见她，也不会嚷着非要一起来。到了车站，她亲手把信交给站长，请他等到第二天早晨，替自己转交给那位老先生。
        - id: ch02-b05
          speaker: peter
          text: 你到底跑到哪儿去了？
        - id: ch02-b06
          speaker: narrator
          text: 彼得坐在院墙顶上大声问她，菲莉丝也在旁边。
        - id: ch02-b07
          speaker: bobbie
          text: 当然是去车站。彼得，拉我一把。
        - id: ch02-b08
          speaker: narrator
          text: 博比把一只脚踩上院门的锁，彼得从墙头伸下一只手，把她拉了上去。她这才看清，彼得和菲莉丝从头到脚都是泥。他们中间的墙头上摆着一团湿黏土，两双脏兮兮的手里各拿着一片石板。彼得身后还整齐放着几个古怪的圆筒，他特意把它们摆在谁也碰不到的地方。那些东西看起来像胖得出奇的香肠，里面是空的，只有一头封住了。
        - id: ch02-b09
          speaker: bobbie
          text: 你们做的是什么？
        - id: ch02-b10
          speaker: peter
          text: 鸟窝，给燕子住的。我们要放进烤炉烘干，再用绳子挂到马车房的屋檐下面。
        - id: ch02-b11
          speaker: phyllis
          text: 等春天来了，我们还要把找到的羊毛和毛发都攒起来，铺在窝里。燕子一定会高兴坏的！
          emotion: happy
        - id: ch02-b12
          speaker: peter
          text: 我一直觉得，人替不会说话的动物做得太少了。小燕子这么需要鸟窝，从前怎么没人想到给它们做呢？
        - id: ch02-b13
          speaker: bobbie
          text: 要是每件事都早有人想到了，后来的人不就没什么可想了吗？
        - id: ch02-b14
          speaker: phyllis
          text: 快看看这些窝，漂亮吧？
        - id: ch02-b15
          speaker: narrator
          text: 菲莉丝越过彼得伸手去拿一个。
        - id: ch02-b16
          speaker: peter
          text: 当心，菲尔，你这只笨山羊！
        - id: ch02-b17
          speaker: narrator
          text: 可惜已经迟了。菲莉丝那只有力的小手一下把鸟窝捏扁了。
        - id: ch02-b18
          speaker: peter
          text: 看见了吧。
        - id: ch02-b19
          speaker: bobbie
          text: 没事，还能修。
        - id: ch02-b20
          speaker: phyllis
          text: 反正这是我做的，你别唠叨了。我们还在各自的鸟窝上刻了名字的第一个字母，这样燕子就知道该感谢谁、喜欢谁。
        - id: ch02-b21
          speaker: peter
          text: 燕子根本不识字，傻瓜。
        - id: ch02-b22
          speaker: phyllis
          text: 你才傻呢。你怎么知道燕子不识字？
        - id: ch02-b23
          speaker: peter
          text: 先别说这个。做鸟窝的主意到底是谁想出来的？
        - id: ch02-b24
          speaker: phyllis
          text: 是我！
          emotion: angry
        - id: ch02-b25
          speaker: peter
          text: 才不是。你只想做干草窝，塞进常春藤里给麻雀住。还没到下蛋的时候，那些窝就会湿透。是我说要用黏土给燕子做窝。
        - id: ch02-b26
          speaker: phyllis
          text: 我才不管你说过什么。
        - id: ch02-b27
          speaker: bobbie
          text: 好了，这个窝我已经修好。把刻字母的小木棍给我。可是，你和彼得的名字都用 P 开头，你怎么分呢？Peter 是 P，Phyllis 也是 P。
        - id: ch02-b28
          speaker: phyllis
          text: 我的 Phyllis 要刻 F，因为听起来就是这个音。燕子肯定不会用 P 来拼 Phyllis，我敢保证。
        - id: ch02-b29
          speaker: peter
          text: 我再说一次，燕子不会拼字。
        - id: ch02-b30
          speaker: phyllis
          text: 那圣诞卡和情人节卡片上，为什么总画着脖子挂信的燕子？它们不识字，怎么知道信该送到哪里？
        - id: ch02-b31
          speaker: peter
          text: 那是画出来的。你什么时候见过真燕子脖子上挂信？
        - id: ch02-b32
          speaker: phyllis
          text: 可我见过鸽子送信。至少爸爸告诉过我。信是藏在翅膀下面，不是挂在脖子上，可也差不多，而且……
        - id: ch02-b33
          speaker: bobbie
          text: 先听我说，明天有一场撒纸追踪赛。
        - id: ch02-b34
          speaker: peter
          text: 谁办的？
        - id: ch02-b35
          speaker: bobbie
          text: 文法学校。帕克斯说，扮野兔的人一开始会沿着铁路线跑。我们可以去路堑，那儿看得很远。
        - id: ch02-b36
          speaker: narrator
          text: 撒纸追踪赛显然比争论燕子识不识字有趣得多。博比原本就想用这个话题止住他们。第二天早晨，妈妈答应让三个孩子带上午饭，整天待在外面看比赛。
        - id: ch02-b37
          speaker: peter
          text: 去路堑最好。就算错过比赛，我们也能看工人干活。
    - id: ch03
      title: 撒纸追踪赛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 上回路堑大塌方，岩石、泥土和树木全落到了铁轨上，要把它们一点点清走，当然得花很长时间。你一定还记得，三个孩子正是在那一次挥动六面红法兰绒衬裙做的小旗，及时拦住火车，让它躲过了失事。看别人干活总是有趣，尤其工人们用的东西也很有意思，有铁锹、十字镐、铲子、木板，还有推起来吱呀作响的独轮车。工地上摆着带圆孔的铁罐，里面燃着像煤渣一样通红的火。夜间施工时，旁边还会挂起红灯。孩子们晚上从不出门，不过有一回，天色才刚暗下来，彼得从卧室天窗爬上屋顶，远远看见路堑边正闪着一盏红灯。
        - id: ch03-b02
          speaker: narrator
          text: 孩子们常来看工人。这一天，十字镐和铁锹上下起落，独轮车沿着木板来回滚动，把他们看得入了迷，连撒纸追踪赛都忘了。忽然，身后有人气喘吁吁地请他们让路。他就是扮野兔的人，一个骨架粗大、手脚很长的男孩。黑头发湿漉漉地贴在额前，装碎纸的袋子夹在腋下，背带斜挂在肩头。孩子们赶紧让开。他沿铁路线稳稳跑远，在工人们的注视下钻进了隧道。
        - id: ch03-b03
          speaker: foreman
          text: 这可不合规章。
        - id: ch03-b04
          speaker: oldest_worker
          text: 您管它干什么？各人做各人的事，谁也别多管谁，我一向这么说。贝茨先生，难道您就没年轻过？
        - id: ch03-b05
          speaker: foreman
          text: 我应该把他报告上去。
        - id: ch03-b06
          speaker: oldest_worker
          text: 何必非要扫人家的兴？我一向这么说。
        - id: ch03-b07
          speaker: foreman
          text: 不管有什么理由，旅客都不许穿过铁路线。
        - id: ch03-b08
          speaker: narrator
          text: 领班嘴里还在坚持，语气却已经犹豫了。
        - id: ch03-b09
          speaker: worker_1
          text: 他又不是旅客。
        - id: ch03-b10
          speaker: worker_2
          text: 再说，我们也没看见他穿过铁路线呀。
        - id: ch03-b11
          speaker: worker_3
          text: 他压根就没找过什么理由。
        - id: ch03-b12
          speaker: oldest_worker
          text: 而且，他这会儿早没影了。眼睛看不见，心里就不用管，我一向这么说。
        - id: ch03-b13
          speaker: narrator
          text: 这时，猎犬们追着野兔撒下的点点白纸来了。三十个人，一个两个地来，三个一群地来，还有六七个挤在一起。孩子们站在陡得像梯子的台阶旁，一个一个数过去。最前面的人下到底部，犹豫了一下，很快看见铁路线旁闪着白纸，于是转向隧道。后面的人也一批批跟进去，被黑洞洞的入口接连吞没。走在最后的是一个穿红毛衣的男孩。他一踏进黑暗，就像一支蜡烛被风吹灭，转眼不见了。
        - id: ch03-b14
          speaker: foreman
          text: 他们还不知道前面等着什么呢。隧道里要转两三道弯，在黑暗里可不好跑。
        - id: ch03-b15
          speaker: peter
          text: 您看，他们要多久才能穿过去？
        - id: ch03-b16
          speaker: foreman
          text: 少说也得一个钟头。
        - id: ch03-b17
          speaker: peter
          text: 那我们从山顶抄近路，赶到另一头等他们出来。我们肯定先到。
        - id: ch03-b18
          speaker: narrator
          text: 这个主意听着很好，三个孩子立刻出发。他们爬上那道陡峭的台阶。从前替小野兔的坟墓摘野樱花时，他们也从这里上去过。到了路堑顶端，他们朝隧道穿过的那座小山走去。可这条路实在难走。
        - id: ch03-b19
          speaker: bobbie
          text: 这简直像在爬阿尔卑斯山。
        - id: ch03-b20
          speaker: peter
          text: 也可能是安第斯山。
        - id: ch03-b21
          speaker: phyllis
          text: 像那个喜马什么山……永远山。求求你们，停一下吧。
        - id: ch03-b22
          speaker: peter
          text: 再坚持一下，过一会儿就能喘过气了。
        - id: ch03-b23
          speaker: narrator
          text: 菲莉丝答应继续坚持，他们便再次往前。草地平坦、坡势和缓的地方，他们就迈开腿跑。遇到拦路的石头，三个人便一个接一个翻过去。攀爬更高的岩块时，他们抓住头顶和身边的树枝借力。树干和岩石之间如果只留下一条窄缝，他们就侧过身子，从那条缝里慢慢钻过去。就这样，他们不断向前，又不断向上，终于站上了那座盼望已久的山顶。
        - id: ch03-b24
          speaker: peter
          text: 停！
        - id: ch03-b25
          speaker: narrator
          text: 彼得扑倒在草地上。山的最高处是一块像桌面一样平整的草坡，上面点缀着一块块长满青苔的岩石，还有一棵棵矮小的花楸树。两个女孩累得再也站不住，也跟着扑倒在草地上。
        - id: ch03-b26
          speaker: peter
          text: 时间还多着呢。接下来全是下坡。
    - id: ch04
      title: 少了一个猎犬
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 三个人躺在草坡上喘了好一阵。等力气慢慢回来，他们才撑着身子坐起，朝山顶四周望去。就在这时，博比忽然看见远处的景色，忍不住叫出了声。
        - id: ch04-b02
          speaker: bobbie
          text: 哦，你们快看！
          emotion: surprised
        - id: ch04-b03
          speaker: phyllis
          text: 看什么？
        - id: ch04-b04
          speaker: bobbie
          text: 看风景呀。
        - id: ch04-b05
          speaker: phyllis
          text: 我最讨厌看风景了。彼得，你呢？
        - id: ch04-b06
          speaker: peter
          text: 我们还是继续赶路吧。
        - id: ch04-b07
          speaker: bobbie
          text: 可这里和海边坐马车看到的景色不一样。那儿只有大海、沙滩，还有光秃秃的山。这里倒像妈妈诗集里写的“彩色郡县”。
        - id: ch04-b08
          speaker: peter
          text: 是不坏。那座渡槽像一条大蜈蚣，张开腿跨过整个山谷。那些小镇里，教堂尖顶从树林间露出来，像插在墨水瓶里的笔。我倒觉得，这里更像那两句诗，“从那儿，他能望见，十二座美丽城池的旗帜闪耀。”
        - id: ch04-b09
          speaker: bobbie
          text: 我喜欢这里。爬这一趟真值得。
        - id: ch04-b10
          speaker: phyllis
          text: 要是没错过撒纸追踪赛，才真的值得。快走吧，现在一路都是下坡。
        - id: ch04-b11
          speaker: peter
          text: 这话我十分钟前就说过了。
        - id: ch04-b12
          speaker: phyllis
          text: 可现在轮到我说。走吧。
        - id: ch04-b13
          speaker: peter
          text: 时间多着呢。
        - id: ch04-b14
          speaker: narrator
          text: 时间的确还够。他们一路向下，到了和隧道口顶部差不多高的地方，才发现自己把路线估错了大约两百码。他们不得不贴着山坡横爬过去，直到来到隧道上方的砖栏墙边。三个孩子倚着墙往下找，可那里空空荡荡，野兔和猎犬连一个影子也没有。
        - id: ch04-b15
          speaker: phyllis
          text: 他们肯定早就走了。
        - id: ch04-b16
          speaker: bobbie
          text: 我觉得还没有。就算他们真走了，这里也很棒。我们可以看火车像一条龙，从洞穴里冲出来。以前可没从上面看过。
        - id: ch04-b17
          speaker: phyllis
          text: 这倒是真的。
        - id: ch04-b18
          speaker: narrator
          text: 她总算没那么生气了。这里确实叫人兴奋。隧道顶离下面的铁路线远得超出想象。站在上面，仿佛站在一座桥上，只是桥面长着灌木、藤蔓、青草和野花。
        - id: ch04-b19
          speaker: narrator
          text: 菲莉丝每隔两分钟就要断定一次，参赛的人早就走了。所以彼得探身越过栏墙，突然大喊时，她也不知道自己究竟该高兴还是失望。
        - id: ch04-b20
          speaker: peter
          text: 小心看，他出来了！
        - id: ch04-b21
          speaker: narrator
          text: 三个孩子一起趴到被太阳晒暖的砖墙上，正好看见野兔从隧道的阴影中跑出来。他已经跑得很慢了。
        - id: ch04-b22
          speaker: peter
          text: 怎么样？我没说错吧。现在等猎犬。
        - id: ch04-b23
          speaker: narrator
          text: 没过多久，猎犬们也出来了。仍旧有的一两个，有的三个一群，有的六七个结伴。他们跑得同样很慢，看上去个个筋疲力尽。还有两三个人落在远远的后面，过了许久才从隧道口走出来。
        - id: ch04-b24
          speaker: bobbie
          text: 好了，全都出来了。我们现在去哪儿？
        - id: ch04-b25
          speaker: phyllis
          text: 去那边那片怪树林吃午饭吧。从那里还能看着他们跑好几英里。
        - id: ch04-b26
          speaker: peter
          text: 还不能走，人没齐。那个穿红毛衣的还没出来。等他也出来，我们再走。
        - id: ch04-b27
          speaker: narrator
          text: 他们等了又等，接着再等，可穿红毛衣的男孩始终没有出现。
        - id: ch04-b28
          speaker: phyllis
          text: 我们去吃午饭吧。我饿得肚子疼。穿红毛衣的肯定已经跟别人出来了，只是你们没看见。
        - id: ch04-b29
          speaker: narrator
          text: 可博比和彼得都肯定，那件红毛衣没有从隧道里出来。
        - id: ch04-b30
          speaker: peter
          text: 我们下到隧道口，也许能看见他正从里面走来。他大概累坏了，在某个避车洞里歇着。博比，你先留在这里看。等我到了下面给你打手势，你再下来。山上到处是树，我们下去时可能正好和他错过。
        - id: ch04-b31
          speaker: narrator
          text: 彼得和菲莉丝先爬下去，博比留在原处，直到看见他们从铁路线边发来的信号。然后，她也沿着树根和青苔间那条弯弯曲曲、又湿又滑的小路攀下山，从两株山茱萸之间钻出来，与他们会合。可那件红毛衣依然不见踪影。
        - id: ch04-b32
          speaker: phyllis
          text: 求求你们，让我吃点东西吧。再不吃，我真的要死了。到时候你们准会后悔。
        - id: ch04-b33
          speaker: peter
          text: 看在老天的分上，快给她一块三明治，堵住那张傻嘴。听着，我们两个也各吃一块。待会儿也许要使出所有力气。不过只能吃一块，我们没时间了。
        - id: ch04-b34
          speaker: bobbie
          text: 什么？
        - id: ch04-b35
          speaker: narrator
          text: 博比嘴里已经塞满了三明治。其实，她和菲莉丝一样饿。
        - id: ch04-b36
          speaker: peter
          text: 你还不明白吗？穿红毛衣的猎犬一定出了意外。说不定就在我们说话的时候，他正把脑袋枕在铁轨上，毫无反抗地躺着，等下一列快车把他……
        - id: ch04-b37
          speaker: bobbie
          text: 别再学书里的腔调说话了！走吧。菲尔，紧跟着我。要是火车来了，就贴紧隧道墙站好，把衬裙全拢在身边。
        - id: ch04-b38
          speaker: narrator
          text: 她一口咽下剩下的三明治。
        - id: ch04-b39
          speaker: phyllis
          text: 再给我一块三明治，我就照办。
        - id: ch04-b40
          speaker: peter
          text: 我走第一个。这个主意是我想的。
        - id: ch04-b41
          speaker: narrator
          text: 说完，彼得便走进了隧道。
    - id: ch05
      title: 黑暗中的红毛衣
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 坐在火车里进隧道时，火车头先是一声尖叫，车轮奔跑碰撞的声音忽然变了，比刚才响亮得多。大人会拉起车窗，用皮带固定。车厢一下暗得像夜晚，幸好车灯通常还亮着。除非你坐的是慢吞吞的区间车，那种车不一定有灯。过一会儿，窗外的黑暗里会浮起一团团白气，隧道墙上还映出蓝光。等列车的声音再次改变，你就回到了明亮的露天。大人松开皮带，沾满隧道黄色气息的车窗哐啷落下。铁路线边的电报线又在眼前一沉一扬，剪得平平的山楂树篱中，每隔三十码就露出一棵小树。
        - id: ch05-b02
          speaker: narrator
          text: 可是，用自己的双脚走进隧道，完全是另一回事。每迈一步，脚下的石块和碎石都在不停滑动。一条窄窄的小路从发亮的铁轨旁斜伸向隧道墙。内壁上渗出一道道水流，摸上去又湿又滑。这里的砖也不像洞口的砖，那些是红色或棕色，这里的却是暗淡、黏腻、病恹恹的绿。人在里面一开口，声音马上就变了，不再像阳光下那样清楚自然。而且还要向深处走很久很久，四周才会真正黑透。
        - id: ch05-b03
          speaker: narrator
          text: 隧道还没完全变黑，菲莉丝已经一把抓住博比的裙子，足足扯开了半码长的褶边。那时谁也没有留意。
        - id: ch05-b04
          speaker: phyllis
          text: 我要回去。我不喜欢这里！马上就要黑得什么也看不见了。我不要摸黑往前走。不管你们说什么，我都不走！
          emotion: fearful
        - id: ch05-b05
          speaker: peter
          text: 别做傻布谷鸟。我带了半截蜡烛，还有火柴。而且……那是什么声音？
        - id: ch05-b06
          speaker: narrator
          text: 铁路线上传来低沉的嗡鸣，旁边的电线也开始轻轻发颤。三个孩子越听，那声音就越响。
        - id: ch05-b07
          speaker: bobbie
          text: 是火车。
        - id: ch05-b08
          speaker: peter
          text: 在哪条轨道上？
        - id: ch05-b09
          speaker: phyllis
          text: 让我回去！
          emotion: fearful
        - id: ch05-b10
          speaker: narrator
          text: 她拼命挣扎，想甩开博比抓住她的手。
        - id: ch05-b11
          speaker: bobbie
          text: 别怕，这里很安全。往后站。
          emotion: calm
        - id: ch05-b12
          speaker: peter
          text: 快过来！快！进避车洞！
          emotion: fearful
        - id: ch05-b13
          speaker: narrator
          text: 彼得在前面几码外，用尽力气大喊。火车的轰鸣已经大得吓人，像把脑袋埋进浴缸的水里，同时拧开两个水龙头，再不停用脚后跟踢铁皮浴缸。不过，博比还是听见了。她拖着菲莉丝朝避车洞跑。菲莉丝果然被电线绊了一跤，两条腿都擦破了。可他们总算把她拉进那处阴暗、潮湿、有拱顶的凹洞。
        - id: ch05-b14
          speaker: narrator
          text: 轰鸣越来越响，仿佛要震聋他们。远处出现两只火焰般的眼睛，一刻不停地变大、变亮。
        - id: ch05-b15
          speaker: phyllis
          text: 它真的是一条龙！我早就知道！它到了黑暗里，就变回自己真正的样子了！
          emotion: fearful
        - id: ch05-b16
          speaker: narrator
          text: 可谁也听不见她。火车也在大喊，而且比菲莉丝响得多。紧接着，是猛冲，是轰鸣，是一连串震响。明亮的车窗拖成一道长长的耀眼闪光。烟味扑来，热风猛吹，列车从他们面前飞驰而过。铿锵声和咣当声在拱顶下反复回荡。菲莉丝和博比紧紧抱在一起。就连彼得也抓住博比的胳膊。后来他解释说，那只是怕博比吓着。
        - id: ch05-b17
          speaker: narrator
          text: 车尾的灯越来越小，声音也慢慢远去。最后一声呼啸过后，列车终于冲出了隧道。潮湿的墙壁和滴水的拱顶之间，又恢复了寂静。
        - id: ch05-b18
          speakers: [bobbie, peter, phyllis]
          ensemble: chorus
          text: 啊！
        - id: ch05-b19
          speaker: narrator
          text: 三个人同时低声叹了一句。彼得点起那半截蜡烛，手还在发抖。
        - id: ch05-b20
          speaker: peter
          text: 走吧。
        - id: ch05-b21
          speaker: narrator
          text: 他先清了清嗓子，才找回平常的声音。
        - id: ch05-b22
          speaker: phyllis
          text: 要是穿红毛衣的人刚才正挡在火车前面呢？
          emotion: fearful
        - id: ch05-b23
          speaker: peter
          text: 那我们更得去看看。
        - id: ch05-b24
          speaker: phyllis
          text: 我们不能先出去，再从车站叫人来吗？
        - id: ch05-b25
          speaker: bobbie
          text: 那你愿意一个人留在这里，等我们回来吗？
        - id: ch05-b26
          speaker: narrator
          text: 博比问得很严厉，争论当然到此为止。三个孩子继续朝隧道更深的黑暗里走。彼得走在最前面，把半截蜡烛高高举起。蜡油流过他的手指，有些甚至钻进袖口。直到那天晚上睡觉，他才发现手腕到手肘留着一道长长的蜡油印。
        - id: ch05-b27
          speaker: narrator
          text: 离避车洞还不到一百五十码，彼得突然停下，喊了一声“喂”，随即快步向前。两个女孩追上来时，他停在他们寻找的东西前面，不到一码远。菲莉丝只看见一抹红色，就死死闭上眼睛。那个穿红毛衣的猎犬靠在下行线旁的隧道墙上。这里的铁轨拐了弯，地面铺满小石子。他两只胳膊软软垂着，眼睛紧闭。
        - id: ch05-b28
          speaker: phyllis
          text: 那片红色是血吗？他是不是已经全死掉了？
          emotion: fearful
        - id: ch05-b29
          speaker: peter
          text: 死了？胡说！他身上除了毛衣，别的地方一点也不红。他只是晕过去了。可我们该怎么办？
        - id: ch05-b30
          speaker: bobbie
          text: 我们能把他挪开吗？
        - id: ch05-b31
          speaker: peter
          text: 不知道。他个头太大了。
        - id: ch05-b32
          speaker: bobbie
          text: 要不先用水擦他的额头。不对，我们没有水。可牛奶也是湿的，我们有整整一瓶呢。
        - id: ch05-b33
          speaker: peter
          text: 对。我好像听说过，还得搓病人的手。
        - id: ch05-b34
          speaker: phyllis
          text: 我知道，要烧羽毛给他闻。
        - id: ch05-b35
          speaker: peter
          text: 我们又没有羽毛，说了也没用。
        - id: ch05-b36
          speaker: phyllis
          text: 偏偏就是这么巧，我口袋里有一只羽毛球。怎么样！
          emotion: happy
        - id: ch05-b37
          speaker: narrator
          text: 于是，彼得握住红毛衣男孩的双手不停揉搓。博比从羽毛球上把羽毛一根根拔下来，点燃以后送到他的鼻子下面。菲莉丝则把那瓶温吞吞的牛奶倒在他额头上。三个孩子一边忙，一边又快又恳切地对他说着同一句话。
        - id: ch05-b38
          speakers: [bobbie, peter, phyllis]
          ensemble: chorus
          text: 求求你睁开眼睛，跟我们说句话吧！看在我们的分上，说句话吧！
