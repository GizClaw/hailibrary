audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细微幽默和体恤
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中
    bobbie:
      display_name: 博比
      tts:
        delivery: 真诚敏锐，关切时急切而坚定
        timbre: 清亮温暖的少女声
        pace: 自然偏快
        pitch: 中高
    peter:
      display_name: 彼得
      tts:
        delivery: 爽直自信，兴奋时干脆有力
        timbre: 明亮的少年声
        pace: 明快
        pitch: 中高
    phyllis:
      display_name: 菲莉丝
      tts:
        delivery: 天真活泼，想象丰富
        timbre: 轻盈稚嫩的女孩声
        pace: 轻快
        pitch: 高
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔镇定，讲到苦难时克制而悲悯
        timbre: 温润清晰
        pace: 从容
        pitch: 中
    perks:
      display_name: 帕克斯
      tts:
        delivery: 直率健谈，带着自尊和朴实的铁路工人口吻
        timbre: 粗粝而亲切
        pace: 适中偏快
        pitch: 中低
    doctor:
      display_name: 福里斯特医生
      tts:
        delivery: 亲切务实，偶尔带温和玩笑
        timbre: 沉稳温暖
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 妈妈心里的悲伤
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 孩子们刚搬到三烟囱时，总爱谈起爸爸。他在什么地方？正在做什么？什么时候回家？他们问了许许多多遍，妈妈每次都尽力回答。可日子一天天过去，孩子们提起爸爸的时候越来越少了。博比几乎一开始就隐约感觉到，这些问题不知为了什么奇怪而痛苦的缘故，会刺痛妈妈，让妈妈伤心。渐渐地，彼得和菲莉丝也有了同样的感觉，只是谁都说不明白那究竟是什么。
        - id: ch01-b02
          speaker: narrator
          text: 一天，妈妈忙得连十分钟也停不下来。博比把茶端上楼，送进那间又大又空的“妈妈工作室”。屋里几乎没有家具，只有一张桌子、一把椅子和一块地毯。窗台与壁炉架上却总摆着大盆鲜花，那都是孩子们照管的。从三扇没有窗帘的长窗望出去，草地和荒原美丽地铺向远方，远山泛着紫色。云和天空永远在变，可那变化又像永远没有变过。
        - id: ch01-b03
          speaker: bobbie
          text: 亲爱的妈妈，茶来啦，快趁热喝。
        - id: ch01-b04
          speaker: narrator
          text: 妈妈放下笔。纸页散得到处都是，上面写满了她的字。那字迹几乎像印刷体一样清楚，却比印刷体漂亮得多。她把双手插进头发，像是恨不得一把一把揪下来。
        - id: ch01-b05
          speaker: bobbie
          text: 可怜的脑袋，是不是疼了？
        - id: ch01-b06
          speaker: mother
          text: 不疼……也疼……不怎么疼。博比，你觉得彼得和菲尔快把爸爸忘了吗？
        - id: ch01-b07
          speaker: bobbie
          text: 才没有！您怎么会这样想？
          emotion: surprised
        - id: ch01-b08
          speaker: mother
          text: 因为你们现在谁也不提他了。
        - id: ch01-b09
          speaker: narrator
          text: 博比先用这条腿站着，又换到另一条腿上。
        - id: ch01-b10
          speaker: bobbie
          text: 我们自己在一起的时候，常常说起爸爸。
        - id: ch01-b11
          speaker: mother
          text: 可你们从不在我面前说。为什么？
        - id: ch01-b12
          speaker: narrator
          text: 这个缘故很难说出口。博比吞吞吐吐，最后走到窗边，望着外面。
        - id: ch01-b13
          speaker: mother
          text: 博比，过来。试着告诉妈妈吧，亲爱的。
        - id: ch01-b14
          speaker: narrator
          text: 妈妈伸出一只胳膊搂住她，又把自己揉乱了头发的脑袋轻轻靠在博比肩上。博比站在那里，不知道该怎么开口，只能不安地动了动身子。
        - id: ch01-b15
          speaker: mother
          text: 告诉妈妈。
        - id: ch01-b16
          speaker: bobbie
          text: 好吧。我觉得爸爸不在，您已经很难过了。我要是再提起他，您只会更难受，所以就不说了。
        - id: ch01-b17
          speaker: mother
          text: 那彼得和菲莉丝呢？
        - id: ch01-b18
          speaker: bobbie
          text: 我不知道。我从没把这件事告诉他们，不过他们大概也有一样的感觉。
        - id: ch01-b19
          speaker: mother
          text: 博比，我把实话告诉你。除了和爸爸分开，我们还遇上了一场很大、很可怕的不幸。那比你能想到的任何事都糟。起初，你们说起他，仿佛一切还和从前一样，听着确实叫我难受。可要是你们忘了他，那才是最可怕的事。
          emotion: sad
        - id: ch01-b20
          speaker: bobbie
          text: 那场不幸……我答应过绝不追问，也一直没有问，对不对？可它总不会永远继续下去吧？
          emotion: fearful
        - id: ch01-b21
          speaker: mother
          text: 不会。等爸爸回到我们身边，最难熬的时候就过去了。
          emotion: calm
        - id: ch01-b22
          speaker: bobbie
          text: 真希望我能安慰您。
        - id: ch01-b23
          speaker: mother
          text: 你一直在安慰我呀。你们不像从前那样吵架了，还为我做了许多贴心的小事。你们给我摘花、擦鞋，又赶在我动手以前跑上楼铺床。这些我全看见了。
        - id: ch01-b24
          speaker: narrator
          text: 博比原先还常常猜，妈妈究竟有没有留意。
        - id: ch01-b25
          speaker: bobbie
          text: 可这些和您受的苦相比，根本算不了什么。
        - id: ch01-b26
          speaker: mother
          text: 我得继续工作了。先别把这些告诉他们。
        - id: ch01-b27
          speaker: narrator
          text: 妈妈最后紧紧抱了她一下，随后才重新拿起笔，回到桌上那些写满字的纸页中间。
        - id: ch01-b28
          speaker: narrator
          text: 当天晚上，睡前那一个小时里，妈妈没有照常给孩子们念书。她讲起自己和爸爸小时候住在乡下，彼此离得很近，一起玩过的那些游戏。她还讲了爸爸和她的兄弟们都还是男孩子时，经历过的种种冒险。那些故事有趣极了，三个孩子一边听，一边笑个不停。
        - id: ch01-b29
          speaker: phyllis
          text: 爱德华舅舅还没长大就去世了，是吗？
        - id: ch01-b30
          speaker: mother
          text: 是的，亲爱的。你一定会喜欢他。他勇敢又爱冒险，总在闯祸，却还是能和人人交朋友。雷吉舅舅现在锡兰，爸爸也不在家。不过，要是他们知道我们聊起旧事还这样开心，我想他们都会高兴。
        - id: ch01-b31
          speaker: phyllis
          text: 爱德华舅舅不会知道呀，他在天堂呢。
          emotion: surprised
        - id: ch01-b32
          speaker: mother
          text: 上帝把他带走了，可他不会因此忘掉我们和从前的日子，就像我没有忘掉他一样。他还记得。他只是离开一小段时间，总有一天我们会再见。
        - id: ch01-b33
          speaker: peter
          text: 雷吉舅舅和爸爸也会回来吗？
        - id: ch01-b34
          speaker: mother
          text: 是的，他们也会。晚安，我的宝贝们。
        - id: ch01-b35
          speakers: [bobbie, peter, phyllis]
          ensemble: chorus
          text: 晚安。
        - id: ch01-b36
          speaker: narrator
          text: 博比比平时抱得更紧，贴在妈妈耳边低声说，她真的、真的非常爱妈妈。
        - id: ch01-b37
          speaker: narrator
          text: 后来，博比把妈妈的话从头到尾想了一遍。她努力不去猜那场巨大的不幸是什么，却不能每次都管住自己。爸爸没有像可怜的爱德华舅舅那样死去，妈妈已经亲口说过。他也没有生病，否则妈妈一定会陪在他身边。贫穷更不是答案。博比知道，这件事比金钱离人的心更近，也痛得多。
        - id: ch01-b38
          speaker: bobbie
          text: 我不该猜。妈妈看到我们不像从前那样吵架，这就很好。以后一定要继续这样。
    - id: ch02
      title: 耙子惹出的祸
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可惜，就在那天下午，博比和彼得大吵了一场。照彼得的说法，那是一场头等厉害的大架。
        - id: ch02-b02
          speaker: narrator
          text: 搬来还不到一星期，孩子们就请妈妈给每个人一块完全属于自己的园地。妈妈答应了，把桃树下朝南的花畦分成三份，任凭他们种自己喜欢的东西。菲莉丝播了木犀草、旱金莲和紫罗兰。种子发芽以后，幼苗看着和杂草没有两样，她却深信它们总有一天会开花。紫罗兰很快替她争了一口气，一带粉、白、红、淡紫的小花，把她的园子装点得热热闹闹。
        - id: ch02-b03
          speaker: phyllis
          text: 我可不敢除草，万一拔错了怎么办？这样正好省下许多活儿。
        - id: ch02-b04
          speaker: narrator
          text: 彼得播的是胡萝卜、洋葱和芜菁。种子来自桥那边那位和气的农夫。农夫住在一幢漂亮的黑白两色木架灰泥房子里，还养着火鸡和珍珠鸡。可彼得的蔬菜从来没有多少生长的机会。他总要用园里的泥土挖运河，又替玩具士兵修堡垒和防御工事。土地不断为了战争和灌溉被翻来翻去，蔬菜种子哪还有机会长出什么名堂？
        - id: ch02-b05
          speaker: narrator
          text: 博比栽的是玫瑰。可是新长出来的嫩叶很快全都蜷缩枯萎了。也许就因为她偏偏在五月从园子另一边移栽，而五月实在不是挪动玫瑰的季节。博比不肯承认花已经死了，一直抱着一线希望。直到帕克斯来看园子，明明白白地告诉她，那些玫瑰早就死透了。
        - id: ch02-b06
          speaker: perks
          text: 小姐，只能拿去烧篝火啦。您把它们挖掉，我送些新鲜花根过来，有三色堇、紫罗兰、美国石竹和勿忘我。您把地整好，我明天就带来。
        - id: ch02-b07
          speaker: narrator
          text: 第二天，博比动手挖起死玫瑰。碰巧就在这一天，妈妈才夸过她和另外两个孩子不像从前那样吵架。她把玫瑰一株株搬到园子另一头。那里堆着垃圾，他们准备等盖伊·福克斯之夜到了，再烧成一堆篝火。另一边，彼得决定推平所有堡垒和防御工事，改做一整套铁路模型。里面得有隧道、路堑、路堤、运河、渡槽，还有各种桥梁。博比抱着最后一捆扎手的玫瑰回来，看见他已经拿着耙子干上了。
        - id: ch02-b08
          speaker: bobbie
          text: 刚才是我在用这把耙子。
        - id: ch02-b09
          speaker: peter
          text: 可现在用它的人是我。
        - id: ch02-b10
          speaker: bobbie
          text: 明明是我先拿到的。
        - id: ch02-b11
          speaker: peter
          text: 那就更该轮到我了。
        - id: ch02-b12
          speaker: narrator
          text: 争吵就这样开始了。两人越说越急，谁也不肯松开耙柄。
        - id: ch02-b13
          speaker: peter
          text: 你怎么总爱为一点小事闹脾气？我早上就说过要用耙子。菲尔，你听见了吧？
        - id: ch02-b14
          speaker: narrator
          text: 菲莉丝说她不想掺和，当然，她马上就被卷了进去。
        - id: ch02-b15
          speaker: bobbie
          text: 你记得就该说出来。
        - id: ch02-b16
          speaker: peter
          text: 她当然不记得，可她至少该承认不记得。
        - id: ch02-b17
          speaker: peter
          text: 真希望我有个弟弟，不是两个哭哭啼啼的小丫头妹妹！
          emotion: angry
        - id: ch02-b18
          speaker: narrator
          text: 这句话一出来，便说明彼得的怒火已经涨到了最高处。博比照例回敬他。
        - id: ch02-b19
          speaker: bobbie
          text: 我才想不通，世上为什么要有小男孩！
          emotion: angry
        - id: ch02-b20
          speaker: narrator
          text: 就在这时，她抬头看见夕阳映红了妈妈工作室的三扇长窗。妈妈的那句话一下回来了：你们不像从前那样吵架了。
        - id: ch02-b21
          speaker: bobbie
          text: 啊！
          emotion: surprised
        - id: ch02-b22
          speaker: narrator
          text: 她叫得像挨了打，又像手指夹进门缝，或者忽然尝到了牙疼最尖利的第一下。
        - id: ch02-b23
          speaker: phyllis
          text: 你怎么了？
        - id: ch02-b24
          speaker: narrator
          text: 博比很想说，别再吵了，妈妈最讨厌这个。可彼得那副故意气人的样子，让她无论怎么努力也说不出口。
        - id: ch02-b25
          speaker: bobbie
          text: 拿走这把讨厌的耙子吧！
          emotion: angry
        - id: ch02-b26
          speaker: narrator
          text: 她猛地松手。彼得一直使足力气往后拉，对面的力忽然没了，他踉跄着仰面摔倒，耙齿正卡在两脚之间。
        - id: ch02-b27
          speaker: bobbie
          text: 活该。
        - id: ch02-b28
          speaker: narrator
          text: 彼得一动不动地躺了半晌。时间虽然很短，已经足够让博比有一点害怕。随后，他坐起来尖叫一声，脸色微微发白，又倒了下去，开始不停惨叫。叫声不算响，却虚弱而稳定，一声接着一声，简直像四分之一英里外有人正在杀猪。妈妈从窗口探出头来。不到半分钟，她已经赶进园子，跪在彼得身边，而他的叫声一刻也没有停过。
        - id: ch02-b29
          speaker: mother
          text: 博比，出了什么事？
        - id: ch02-b30
          speaker: phyllis
          text: 是耙子。彼得和博比都在拉，博比一松手，他就摔了。
        - id: ch02-b31
          speaker: mother
          text: 彼得，别再叫了。马上停下。
        - id: ch02-b32
          speaker: narrator
          text: 彼得把剩下的气全用在最后一声尖叫上，这才停住。
        - id: ch02-b33
          speaker: mother
          text: 现在告诉我，受伤了吗？
        - id: ch02-b34
          speaker: bobbie
          text: 他要真受伤了，才不会这样大惊小怪。他又不是胆小鬼！
          emotion: angry
        - id: ch02-b35
          speaker: peter
          text: 我想我的脚断掉了，就这样。
        - id: ch02-b36
          speaker: narrator
          text: 彼得气呼呼地坐起来，脸色突然变得惨白。妈妈赶紧搂住他。
        - id: ch02-b37
          speaker: mother
          text: 他真的受伤了，已经晕过去了。博比，坐下来，让他的头枕在你腿上。
        - id: ch02-b38
          speaker: narrator
          text: 妈妈先解开彼得的靴子。右脚那只靴子刚一脱下，就有东西从他的脚上滴到地面。那是鲜红的血。袜子也脱掉以后，他们看见彼得的脚背和脚踝上有三道鲜红伤口，是耙齿狠狠咬出来的。整只脚到处都是一道道红色血痕。方才那把普普通通的园艺耙，如今竟在他的脚上留下了三个可怕的齿印。
        - id: ch02-b39
          speaker: mother
          text: 快去取水，要满满一盆。
        - id: ch02-b40
          speaker: narrator
          text: 菲莉丝飞跑着去，急得把盆里的水泼掉大半，只好又用水罐取来一些。彼得一直没有睁开眼睛。妈妈先用手帕裹好他的伤脚，再和博比一起把他抬进屋，放到饭厅的褐色木榻上。等他终于醒来，菲莉丝已经走完了去医生家的半程路。
        - id: ch02-b41
          speaker: narrator
          text: 妈妈坐在彼得身边，一边轻轻清洗伤脚，一边不断同他说话。博比知道自己帮不上别的忙，只好出去准备茶点，又把水壶放到炉子上。至少，这些事情她还做得来。
        - id: ch02-b42
          speaker: bobbie
          text: 我只能做这些了。万一彼得死掉呢？万一他一辈子都成了瘸子，只能拄拐杖，或者得穿一只鞋底像木头那么厚的靴子呢？
          emotion: fearful
        - id: ch02-b43
          speaker: narrator
          text: 她站在后门边，眼睛直直盯着院里的蓄水桶。彼得会不会死去，会不会终身残疾，会不会只能拄着拐杖，或者穿一只厚木底的靴子？她把这些阴沉可怕的可能一个个想了下去。
        - id: ch02-b44
          speaker: bobbie
          text: 真希望我从来没有生下来。
          emotion: sad
        - id: ch02-b45
          speaker: perks
          text: 哎哟，老天爷，怎么会说这种话？
          emotion: surprised
        - id: ch02-b46
          speaker: narrator
          text: 帕克斯站在她面前，手里的木篮装满带绿叶的花苗和松软泥土。
        - id: ch02-b47
          speaker: bobbie
          text: 原来是你。彼得让耙子弄伤了，脚上裂开三道大口子，像士兵受的伤。有一半是我的错。
        - id: ch02-b48
          speaker: perks
          text: 才不是您的错，我敢拿脑袋担保。医生来给他看过了吗？
        - id: ch02-b49
          speaker: bobbie
          text: 菲莉丝去请了。
        - id: ch02-b50
          speaker: perks
          text: 他准没事，您等着看吧。我父亲的一个远房亲戚，叫干草叉扎中过，还直直扎进了肚子。几星期后，他照样好好的，只是脑子稍微糊涂了一点。大家都说，那是他在干草地里晒昏了头，跟叉子一点关系也没有。我还清清楚楚记得他呢，心肠很好，就是有点傻，大概是这样。
        - id: ch02-b51
          speaker: narrator
          text: 博比听完这段话，只能努力让自己受到一点鼓舞。至于那个被干草叉扎中、后来脑子有点糊涂的远房亲戚，究竟能给人多少安慰，那就很难说了。
        - id: ch02-b52
          speaker: perks
          text: 您眼下肯定没心思管园子。告诉我哪块地是您的，我替您种花。要是不嫌我多事，我再等等医生，听听他怎么说。打起精神来，小姐。我敢押一英镑，他这伤根本不算什么。
        - id: ch02-b53
          speaker: narrator
          text: 可彼得的确伤得不轻。医生来了，仔细查看他的脚，把伤口包扎得漂漂亮亮，又郑重嘱咐，至少一个星期以内，彼得都不能让这只脚碰到地面。
        - id: ch02-b54
          speaker: bobbie
          text: 他不会跛脚，不会拄拐杖，脚上也不用戴个大木块，对不对？
          emotion: fearful
        - id: ch02-b55
          speaker: doctor
          text: 我的老天，当然不会！两个星期以后，他又能跑得像从前一样快。别担心啦，小鹅妈妈。
    - id: ch03
      title: 讲和
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 妈妈一路送医生到院门口，还要听他交代最后几句该注意的事。菲莉丝正好去给茶水壶添水。于是，饭厅里暂时只剩下躺在木榻上的彼得，还有守在一旁的博比。
        - id: ch03-b02
          speaker: bobbie
          text: 医生说，你不会跛脚，也不会有别的事。
        - id: ch03-b03
          speaker: peter
          text: 我当然不会，傻瓜。
        - id: ch03-b04
          speaker: narrator
          text: 他嘴上说得满不在意，好像这答案早就在自己意料之中。可听见医生保证以后还能照常走路，他心里其实已经松了一大口气。
        - id: ch03-b05
          speaker: bobbie
          text: 彼得，我真的很抱歉。
          emotion: sad
        - id: ch03-b06
          speaker: peter
          text: 没事。
        - id: ch03-b07
          speaker: bobbie
          text: 全是我的错。
        - id: ch03-b08
          speaker: peter
          text: 胡说。
        - id: ch03-b09
          speaker: bobbie
          text: 要是我们没有吵架，就不会出事。我明知道不该吵，也想说出来，可就是开不了口。
        - id: ch03-b10
          speaker: peter
          text: 别说傻话。就算你开了口，我也不会停。再说，受伤跟吵架没关系。我也可能踩上锄头，让切草机削掉手指，或者放烟火炸掉鼻子。不管吵没吵，伤起来都一样。
        - id: ch03-b11
          speaker: bobbie
          text: 可我明知道吵架不对，现在你又受伤了，而且……
          emotion: sad
        - id: ch03-b12
          speaker: peter
          text: 听着，别哭了。你再这样下去，就要变成主日学校里那种讨厌的小圣人。
        - id: ch03-b13
          speaker: bobbie
          text: 我不是故意的。可人要是真心想学好，就很难不变成那样。
        - id: ch03-b14
          speaker: narrator
          text: 一个孩子真正想学好时，偏偏很容易显得自以为是。温和的读者也许同样遇见过这种难处，甚至亲自吃过它的苦头。
        - id: ch03-b15
          speaker: peter
          text: 一点也不难。幸好伤的是我，不是你。要是换成你，这会儿准躺在沙发上，像个受苦的小天使，成了全家焦急目光里的那道光。那副样子我可受不了。
        - id: ch03-b16
          speaker: bobbie
          text: 我才不会。
        - id: ch03-b17
          speaker: peter
          text: 你就会。
        - id: ch03-b18
          speaker: bobbie
          text: 我说了不会。
        - id: ch03-b19
          speaker: peter
          text: 我说你就会。
        - id: ch03-b20
          speaker: mother
          text: 孩子们，怎么又吵起来了？这才过了多久？
        - id: ch03-b21
          speaker: peter
          text: 我们没吵，至少不是真的吵。我们意见不同的时候，您别次次都当成闹别扭嘛！
        - id: ch03-b22
          speaker: narrator
          text: 妈妈再次离开后，博比忍不住了。
        - id: ch03-b23
          speaker: bobbie
          text: 彼得，你受伤了，我真的很难过。可你说我是小圣人，实在太可恶。
        - id: ch03-b24
          speaker: peter
          text: 好吧，也许是我太可恶。你气成那样，还肯说我不是胆小鬼。我只想让你别变成小圣人。自己留点神，要是觉得那股自以为是的劲头冒出来，就及时停住。明白吗？
        - id: ch03-b25
          speaker: bobbie
          text: 明白了。
        - id: ch03-b26
          speaker: peter
          text: 那就讲和吧。把战斧埋进往事的万丈深渊，再握个手。哎，博比，老伙计，我累了。
        - id: ch03-b27
          speaker: narrator
          text: 接连好几天，彼得都很疲倦。木榻上堆满枕头、长靠垫和柔软的折叠毛毯，躺起来依然又硬又不舒服。最难熬的还是不能出门。大家把木榻挪到窗边，从那里，彼得可以看见一列列火车吐出的烟，沿着山谷弯弯曲曲地飘过去。可真正的火车，他一列也看不见。
        - id: ch03-b28
          speaker: narrator
          text: 起初，博比很想尽力待彼得好些，又怕被他说成小圣人，做什么都束手束脚。好在这种顾虑很快消失了。照彼得的评价，她和菲莉丝都是顶不错的家伙。姐妹俩出门时，妈妈就坐在旁边陪他。博比发怒时还肯说“他又不是胆小鬼”，这句话让彼得下定决心，绝不为疼痛大惊小怪。其实他的脚疼得相当厉害，夜里尤其难受。
        - id: ch03-b29
          speaker: narrator
          text: 有时候，一句夸奖真能帮人很大的忙。
        - id: ch03-b30
          speaker: narrator
          text: 也有不少客人来探望。帕克斯太太上门问过他的情形，站长也来了，还有村里的好几个人。可有人陪着，也不能让钟走快一点。日子还是过得很慢，很慢。
        - id: ch03-b31
          speaker: peter
          text: 要是有点东西可看就好了。家里的书，我已经翻过五十遍。
        - id: ch03-b32
          speaker: phyllis
          text: 我去医生家问问，他准有书。
        - id: ch03-b33
          speaker: peter
          text: 我看只有教人怎么生病的书，还有讲别人肚子里那些讨厌东西的书。
        - id: ch03-b34
          speaker: bobbie
          text: 帕克斯那儿有一大堆旅客看腻后丢在火车上的杂志。我去问他借。
        - id: ch03-b35
          speaker: narrator
          text: 两个女孩马上分头出门。菲莉丝往医生家去，想从那里的书架上找点适合彼得的读物。博比则朝车站跑去，要问问帕克斯那堆从火车上收来的旧杂志。
    - id: ch04
      title: 帕克斯的纸包
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 博比一路跑到车站，找到帕克斯时，他正在忙着清洁那些铁路灯。
        - id: ch04-b02
          speaker: perks
          text: 那位小先生怎么样啦？
        - id: ch04-b03
          speaker: bobbie
          text: 好多了，谢谢你。不过他闷得难受。你有没有杂志可以借给他？
        - id: ch04-b04
          speaker: perks
          text: 瞧我这脑子，怎么就没想到！我今早还在琢磨拿什么逗他，最后只想出一只豚鼠。我认识的小伙子，下午茶时会送一只过去。
        - id: ch04-b05
          speaker: bobbie
          text: 太好啦，一只真的、活的豚鼠！彼得准会喜欢。不过杂志他也想看。
          emotion: happy
        - id: ch04-b06
          speaker: perks
          text: 问题就在这儿。最好的那些，我刚送给斯尼格森家的男孩了，就是肺炎才好些的那个。不过画报还剩下一大堆。
        - id: ch04-b07
          speaker: narrator
          text: 帕克斯转向墙角那摞报纸，从中抱出厚厚一叠。那一叠从底到顶，足足有六英寸厚。虽然最好的杂志已经送了人，这些画报里仍有许多图片，足够一个不能出门的男孩翻上好一阵子。
        - id: ch04-b08
          speaker: perks
          text: 给，我拿张纸包好，再捆根绳子。
        - id: ch04-b09
          speaker: narrator
          text: 他又从报纸堆里抽出一张旧报纸，平平铺到桌面上。画报先叠整齐，再用这张纸从四面包好，最后还要加上一根绳子。没过一会儿，一大摞散开的画报就成了一个整整齐齐的纸包。
        - id: ch04-b10
          speaker: perks
          text: 里面的画多着呢。他要是喜欢拿颜料、彩色粉笔或者别的东西在上面乱涂，就随他去。我反正不要。
        - id: ch04-b11
          speaker: bobbie
          text: 你真好。
        - id: ch04-b12
          speaker: narrator
          text: 博比抱起沉甸甸的纸包，动身往家走。到了铁路道口，正有一列火车驶过，她只能站在栅门前等候。纸包实在太重，她便把它搁到栅门顶上歇一会儿。等车的时候，她无意间低下头，随随便便看起了包裹外面那张旧报纸上的铅字。
        - id: ch04-b13
          speaker: narrator
          text: 突然，她把纸包抓得更紧，低下头，整张脸凑近报纸。眼前的一切仿佛变成了一场可怕的噩梦。她却不能移开眼睛，只能一行接一行地读下去。可是，那一栏最底下的一截已经被撕掉了。到了那里，她再也读不到后文。
        - id: ch04-b14
          speaker: narrator
          text: 她后来怎么也想不起，自己究竟是怎样回到家的。她踮着脚走进自己的房间，关门上锁。接着，她解开纸包，把外面那张报纸取下来，坐在床沿上，又把那栏印出来的新闻从头读了一遍。她的手脚冷得像冰，脸却烧得滚烫。所有留下的文字都读完后，她长长吸了一口气。那口气颤抖着，很不均匀。
        - id: ch04-b15
          speaker: bobbie
          text: 现在我知道了。
        - id: ch04-b16
          speaker: narrator
          text: 那栏新闻的标题是，审判结束，裁决，判刑。就在标题下面，受审人的姓名清清楚楚地印在那里。那个名字，正是她爸爸的名字。新闻里写下的裁决是有罪，法庭判下的刑罚是五年苦役。
        - id: ch04-b17
          speaker: bobbie
          text: 爸爸，这不是真的。我不信！您绝没有做过。绝没有，绝没有，绝没有！
          emotion: sad
        - id: ch04-b18
          speaker: narrator
          text: 她把报纸死死揉在手中，一遍又一遍说着爸爸绝没有做过那件事。就在这时，门上忽然响起一阵砰砰的敲击声。
        - id: ch04-b19
          speaker: bobbie
          text: 什么事？
        - id: ch04-b20
          speaker: phyllis
          text: 是我。茶点好了，还有个男孩给彼得送来一只豚鼠。快下楼吧。
        - id: ch04-b21
          speaker: narrator
          text: 博比不得不下楼去。
