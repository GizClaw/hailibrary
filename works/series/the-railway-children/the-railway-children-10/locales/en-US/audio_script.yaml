  chapters:
    - id: ch01
      title: The Terrible Secret
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When the children first came to Three Chimneys, they talked about Father all the time. They asked what he was doing, where he was, and when he would come home. Mother always answered as well as she could. But as the days passed, they spoke of him less and less. Bobbie had understood almost from the beginning. For some strange, miserable reason, those questions hurt Mother and made her sad. Little by little, Peter and Phyllis felt it too, though none of them could have put the feeling into words.
        - id: ch01-b02
          speaker: narrator
          text: One day Mother was working so hard she could not spare even ten minutes. Bobbie carried tea up to the big bare room they called Mother's workshop. It had hardly any furniture, only a table, a chair, and a rug. But there were always large pots of flowers on the windowsills and mantelpiece. The children made sure of that. Through three long windows with no curtains, Mother could see the beautiful sweep of meadow and moorland, the faraway violet hills, and the clouds and sky, always the same and always changing.
        - id: ch01-b03
          speaker: roberta
          text: Here's your tea, Mother-love. Please drink it while it's hot.
        - id: ch01-b04
          speaker: narrator
          text: Mother set down her pen among pages covered in her neat handwriting. Then she pushed both hands into her hair as though she might pull it out.
        - id: ch01-b05
          speaker: roberta
          text: Poor dear head. Does it hurt?
        - id: ch01-b06
          speaker: mother
          text: No. Well, yes, but not much. Bobbie, do you think Peter and Phil are forgetting Father?
        - id: ch01-b07
          speaker: roberta
          text: No! Why would you think that?
          emotion: angry
        - id: ch01-b08
          speaker: mother
          text: None of you ever talks about him now.
        - id: ch01-b09
          speaker: narrator
          text: Bobbie shifted from one foot to the other.
        - id: ch01-b10
          speaker: roberta
          text: We talk about him often when we're alone.
        - id: ch01-b11
          speaker: mother
          text: But you don't talk about him with me. Why not?
        - id: ch01-b12
          speaker: narrator
          text: Bobbie could not find the words. She started to answer, stopped, and went to look out the window.
        - id: ch01-b13
          speaker: mother
          text: Bobbie, come here. Now try to tell me, dear.
        - id: ch01-b14
          speaker: narrator
          text: Bobbie came back. Mother put an arm around her and rested her rumpled head against Bobbie's shoulder. Still, Bobbie fidgeted.
        - id: ch01-b15
          speaker: mother
          text: Tell Mother.
        - id: ch01-b16
          speaker: roberta
          text: I thought you were so unhappy because Daddy wasn't here. Whenever I talked about him, you seemed worse. So I stopped.
        - id: ch01-b17
          speaker: mother
          text: And what about the others?
        - id: ch01-b18
          speaker: roberta
          text: I don't know. I never said anything to them about it. I suppose they felt the same way I did.
        - id: ch01-b19
          speaker: mother
          text: Bobbie dear, I'll explain. Besides being parted from Father, he and I have had a terrible sorrow, worse than anything you can imagine. At first, hearing you speak of him as if nothing had changed did hurt. But if you forgot him, that would be far more terrible. Nothing could be worse.
          emotion: sad
        - id: ch01-b20
          speaker: roberta
          text: This trouble... I promised never to ask questions, and I haven't, have I? But it won't last forever, will it?
        - id: ch01-b21
          speaker: mother
          text: No. The worst will be over when Father comes home to us.
        - id: ch01-b22
          speaker: roberta
          text: I wish I could make you feel better.
        - id: ch01-b23
          speaker: mother
          text: Oh, my dear, you do. I've seen how good you've all been. You hardly quarrel now, and you do so many kind little things for me. You bring flowers, clean my shoes, and race upstairs to make my bed before I can get to it.
        - id: ch01-b24
          speaker: narrator
          text: Bobbie had sometimes wondered if Mother noticed.
        - id: ch01-b25
          speaker: roberta
          text: That's nothing compared with...
        - id: ch01-b26
          speaker: mother
          text: I must get back to work. Don't tell the others about this.
        - id: ch01-b27
          speaker: narrator
          text: Mother gave her one last squeeze. That evening, during the hour before bedtime, Mother did not read aloud. Instead, she told the children about the games she and Father used to play when they were children living near each other in the country. She told them about Father's adventures with her brothers when all of them were boys together. The stories were very funny, and the children laughed as they listened.
        - id: ch01-b28
          speaker: phyllis
          text: Uncle Edward died before he grew up, didn't he?
        - id: ch01-b29
          speaker: narrator
          text: Mother was lighting the bedroom candles.
        - id: ch01-b30
          speaker: mother
          text: Yes, dear. You would have loved him. He was brave and always looking for adventure. He was forever getting into mischief, yet everyone liked him. Uncle Reggie is in Ceylon, and Father is away too. I think all three would be glad we enjoyed remembering the things they did. Don't you?
        - id: ch01-b31
          speaker: phyllis
          text: Not Uncle Edward. He's in Heaven.
          emotion: surprised
        - id: ch01-b32
          speaker: mother
          text: God taking him away doesn't mean he's forgotten us or the old days, any more than I've forgotten him. He remembers. He's only away for a while, and one day we'll see him again.
        - id: ch01-b33
          speaker: peter
          text: And we'll see Uncle Reggie and Father too?
        - id: ch01-b34
          speaker: mother
          text: Yes, Uncle Reggie and Father too. Good night, my darlings.
        - id: ch01-b35
          speakers: [roberta, peter, phyllis]
          ensemble: chorus
          text: Good night.
        - id: ch01-b36
          speaker: narrator
          text: Bobbie hugged Mother more tightly than usual and whispered in her ear.
        - id: ch01-b37
          speaker: roberta
          text: Oh, Mummy, I love you so much. I do. I really do.
        - id: ch01-b38
          speaker: narrator
          text: When Bobbie thought over everything Mother had said, she tried not to wonder about the great trouble. She could not always stop herself. Father was not dead like poor Uncle Edward. Mother had made that clear. He could not be ill, because Mother would have been with him. And their being poor was not the trouble. Bobbie knew it was something that came much closer to the heart than money ever could.
        - id: ch01-b39
          speaker: roberta
          text: I mustn't try to guess. I mustn't. But I'm glad Mother noticed that we don't quarrel so much. We'll keep it up.
        - id: ch01-b40
          speaker: narrator
          text: And alas, that very afternoon, she and Peter had what Peter called a first-class shindy.
        - id: ch01-b41
          speaker: narrator
          text: Before their first week at Three Chimneys was over, the children asked Mother for gardens of their very own. She agreed. The south border under the peach trees was divided into three plots, and each child could plant whatever they liked. Phyllis sowed mignonette, nasturtiums, and Virginia stock. When the seeds came up, the shoots looked just like weeds, but Phyllis believed they would flower someday. The Virginia stock soon rewarded her faith. Her garden wore a cheerful band of little blossoms in pink, white, red, and mauve.
        - id: ch01-b42
          speaker: phyllis
          text: I can't pull weeds because I might pull up a flower by mistake. It saves me an awful lot of work.
        - id: ch01-b43
          speaker: narrator
          text: Peter planted carrots, onions, and turnips. A friendly farmer had given him the seeds. The farmer lived just beyond the bridge in a handsome black-and-white house made of timber and plaster, and he kept turkeys and guinea fowl. Peter's vegetables never had much of a chance. He preferred using the garden soil to dig canals and build forts and earthworks for his toy soldiers. Vegetable seeds rarely do well in ground that is always being torn up for wars and irrigation.
        - id: ch01-b44
          speaker: narrator
          text: Bobbie planted rosebushes in her plot. Every small new leaf shriveled and withered. That may have been because she moved the bushes from another part of the garden in May, which is not at all the right time to move roses. Still, Bobbie would not admit they were dead. She kept hoping against hope until Perks came up to inspect the garden and told her plainly that every rose was as dead as a doornail.
        - id: ch01-b45
          speaker: perks
          text: They're only fit for a bonfire, miss. Dig them up and burn them. I'll bring you fresh roots from my garden. Pansies, stocks, sweet williams, and forget-me-nots. Get the soil ready, and I'll bring them tomorrow.
        - id: ch01-b46
          speaker: narrator
          text: The next day, the very day Mother praised the children for quarreling less, Bobbie set to work. She dug up the dead roses and carried them, one prickly load after another, to the far end of the garden. There stood the rubbish heap they meant to burn when Guy Fawkes Day came.
        - id: ch01-b47
          speaker: narrator
          text: Meanwhile, Peter had decided to flatten every fort and earthwork in his garden. In their place he planned a model of the whole railway landscape, with a tunnel, cutting, embankment, canal, aqueduct, and bridges. When Bobbie returned from her last thorny journey with the dead rosebushes, Peter had already taken the rake and was using it busily.
        - id: ch01-b48
          speaker: roberta
          text: I was using that rake.
        - id: ch01-b49
          speaker: peter
          text: Well, I'm using it now.
        - id: ch01-b50
          speaker: roberta
          text: But I had it first.
        - id: ch01-b51
          speaker: peter
          text: So now it's my turn.
        - id: ch01-b52
          speaker: narrator
          text: That was how the quarrel began. After a heated argument, both of them were gripping the rake handle.
        - id: ch01-b53
          speaker: peter
          text: You always make trouble over nothing.
          emotion: angry
        - id: ch01-b54
          speaker: roberta
          text: I had it first.
          emotion: angry
        - id: ch01-b55
          speaker: peter
          text: Stop it! I said this morning that I was going to use it. Didn't I, Phil?
          emotion: angry
        - id: ch01-b56
          speaker: narrator
          text: Phyllis said she wanted no part in their quarrels. Naturally, that pulled her straight into this one.
        - id: ch01-b57
          speaker: roberta
          text: If you remember, you should say so.
        - id: ch01-b58
          speaker: peter
          text: Of course she doesn't remember. She could at least admit it.
        - id: ch01-b59
          speaker: peter
          text: I wish I had a brother instead of two whining little baby sisters!
          emotion: angry
        - id: ch01-b60
          speaker: narrator
          text: Everyone knew that this was the highest point Peter's anger could reach. Bobbie gave him her usual answer.
        - id: ch01-b61
          speaker: roberta
          text: I can't imagine why anyone ever invented little boys!
          emotion: angry
        - id: ch01-b62
          speaker: narrator
          text: Just then she looked up. The setting sun flashed red in the three tall windows of Mother's workshop, and Mother's praise came back to her. You don't quarrel like you used to.
        - id: ch01-b63
          speaker: roberta
          text: Oh!
          emotion: surprised
        - id: ch01-b64
          speaker: narrator
          text: Bobbie cried out as sharply as if she had been struck, caught her finger in a door, or felt the first stab of a terrible toothache.
        - id: ch01-b65
          speaker: phyllis
          text: What's wrong?
        - id: ch01-b66
          speaker: narrator
          text: Bobbie wanted to say they should stop because Mother hated their quarreling. She tried, but the words would not come. Peter looked too insulting and disagreeable.
        - id: ch01-b67
          speaker: roberta
          text: Fine! Take the horrible rake!
          emotion: angry
        - id: ch01-b68
          speaker: narrator
          text: She suddenly released the handle. Peter had been pulling hard. With nothing pulling back, he stumbled and fell onto his back with the rake's teeth between his feet.
        - id: ch01-b69
          speaker: roberta
          text: Serves you right.
          emotion: angry
        - id: ch01-b70
          speaker: narrator
          text: Peter lay perfectly still for half a moment, just long enough to frighten Bobbie a little. Then he frightened her more. He sat up, gave one scream, and turned rather pale. Then he lay back and began to shriek, faintly but without stopping. It sounded exactly like a pig being killed a quarter of a mile away.
        - id: ch01-b71
          speaker: narrator
          text: Mother leaned out of the window. Less than half a minute later, she was kneeling beside Peter, who had not stopped squealing for an instant.
        - id: ch01-b72
          speaker: mother
          text: What happened, Bobbie?
        - id: ch01-b73
          speaker: phyllis
          text: It was the rake. Peter and Bobbie were both pulling it. Bobbie let go, and Peter fell over.
        - id: ch01-b74
          speaker: mother
          text: Peter, stop that noise. Come now. Stop at once.
        - id: ch01-b75
          speaker: narrator
          text: Peter spent his remaining breath on one last squeal, then stopped.
        - id: ch01-b76
          speaker: mother
          text: Now, are you hurt?
        - id: ch01-b77
          speaker: roberta
          text: If he were really hurt, he wouldn't make such a fuss. He's not a coward!
          emotion: angry
        - id: ch01-b78
          speaker: narrator
          text: Bobbie was still shaking with anger.
        - id: ch01-b79
          speaker: peter
          text: I think my foot has broken off. That's all.
        - id: ch01-b80
          speaker: narrator
          text: Peter sat up and turned completely white. Mother caught him in her arms.
        - id: ch01-b81
          speaker: mother
          text: He really is hurt. He's fainted. Bobbie, sit down and hold his head in your lap.
        - id: ch01-b82
          speaker: narrator
          text: Mother unlaced Peter's boots. As she eased off the right one, something dripped from his foot onto the ground. It was red blood. When she removed his stocking, they saw three red wounds in his foot and ankle where the rake's teeth had bitten into him. The whole foot was streaked and smeared with red.
        - id: ch01-b83
          speaker: mother
          text: Run and bring a full basin of water.
        - id: ch01-b84
          speaker: narrator
          text: Phyllis ran for the water. She hurried so much that she spilled most of it from the basin and had to go back for more in a jug. Peter did not open his eyes until Mother had tied her handkerchief around his foot. Then she and Bobbie carried him into the house and laid him on the brown wooden settle in the dining room. By that time, Phyllis was already halfway to the doctor's house.
        - id: ch01-b85
          speaker: narrator
          text: Mother stayed beside Peter, bathing his foot and talking to him. Bobbie went to prepare tea and put the kettle on.
        - id: ch01-b86
          speaker: roberta
          text: It's the only thing I can do. What if Peter dies? What if he can never walk properly again? He might need crutches, or a boot with a thick wooden sole!
          emotion: fearful
        - id: ch01-b87
          speaker: narrator
          text: At the back door, Bobbie stared at the rain barrel and imagined one dreadful possibility after another.
        - id: ch01-b88
          speaker: roberta
          text: I wish I'd never been born.
          emotion: sad
        - id: ch01-b89
          speaker: perks
          text: Good gracious, miss. What makes you say that?
        - id: ch01-b90
          speaker: narrator
          text: Perks stood before her with a wooden basket full of green plants and soft, loose soil.
        - id: ch01-b91
          speaker: roberta
          text: Oh, it's you. Peter hurt his foot on a rake. There are three huge open wounds, like a soldier might get. And it was partly my fault.
        - id: ch01-b92
          speaker: perks
          text: I'll wager it wasn't your fault. Has the doctor seen him yet?
        - id: ch01-b93
          speaker: roberta
          text: Phyllis went to fetch him.
        - id: ch01-b94
          speaker: perks
          text: He'll be all right. You'll see. My father's second cousin once had a hayfork go right into his body, and he was himself again in a few weeks. Well, except that he was a little weak in the head afterward. Folks said that came from too much sun in the hayfield, not the fork. I remember him. Kindhearted fellow, though rather simple.
        - id: ch01-b95
          speaker: narrator
          text: Bobbie did her best to feel encouraged by this heartening family memory.
        - id: ch01-b96
          speaker: perks
          text: You won't want to fuss with gardening just now. Show me your patch and I'll put these plants in. If you don't mind, I'll stay until the doctor comes out and hear what he says. Cheer up, miss. I'd bet a pound the boy isn't badly hurt.
        - id: ch01-b97
          speaker: narrator
          text: In spite of Perks's hopes, Peter really was hurt. The doctor came, carefully examined the injured foot, and wrapped it in a beautiful bandage. Peter was not allowed to put that foot on the ground for at least a week. When the doctor was leaving, Bobbie followed him to the door and asked her question in a breathless whisper.
        - id: ch01-b98
          speaker: roberta
          text: He won't be lame, will he? He won't need crutches or have a great lump on his foot?
          emotion: fearful
        - id: ch01-b99
          speaker: doctor_forrest
          text: Good heavens, no! In two weeks he'll be as quick on his feet as ever. Don't worry, little Mother Goose.
        - id: ch01-b100
          speaker: narrator
          text: Mother walked to the gate with the doctor to hear his final instructions. Phyllis filled the kettle for tea. That left Peter and Bobbie alone.
        - id: ch01-b101
          speaker: roberta
          text: The doctor says you won't be lame or anything.
        - id: ch01-b102
          speaker: peter
          text: Of course I won't, silly.
        - id: ch01-b103
          speaker: narrator
          text: Peter was greatly relieved, all the same. After a pause, Bobbie spoke again.
        - id: ch01-b104
          speaker: roberta
          text: Oh, Peter, I'm so sorry.
          emotion: sad
        - id: ch01-b105
          speaker: peter
          text: It's all right.
        - id: ch01-b106
          speaker: roberta
          text: It was completely my fault.
        - id: ch01-b107
          speaker: peter
          text: Nonsense.
        - id: ch01-b108
          speaker: roberta
          text: It wouldn't have happened if we hadn't quarreled. I knew quarreling was wrong. I wanted to say so, but somehow I couldn't.
          emotion: sad
        - id: ch01-b109
          speaker: peter
          text: Oh, stop talking foolishness. I wouldn't have stopped even if you had said it. And the quarrel had nothing to do with my getting hurt. I might have stepped on the hoe, cut off my fingers in the chaff cutter, or blown off my nose with fireworks. An accident would hurt just the same whether we were quarreling or not.
        - id: ch01-b110
          speaker: roberta
          text: But I knew we shouldn't quarrel. And now you're hurt, and...
          emotion: sad
        - id: ch01-b111
          speaker: peter
          text: Listen, dry those tears. If you aren't careful, you'll become a horrible little Sunday-school prig.
        - id: ch01-b112
          speaker: roberta
          text: I don't want to be a prig. But when you're honestly trying to be good, it's so hard not to sound like one.
        - id: ch01-b113
          speaker: narrator
          text: Perhaps you have had the same difficulty.
        - id: ch01-b114
          speaker: peter
          text: It isn't hard. Anyway, I'm glad you weren't hurt. I'm glad it was me. If it had been you, you'd be stretched on the sofa looking like a suffering angel, shining like a light over the worried household. I couldn't have stood it.
        - id: ch01-b115
          speaker: roberta
          text: No, I wouldn't.
        - id: ch01-b116
          speaker: peter
          text: Yes, you would.
        - id: ch01-b117
          speaker: roberta
          text: I'm telling you, I wouldn't.
        - id: ch01-b118
          speaker: peter
          text: And I'm telling you, you would.
        - id: ch01-b119
          speaker: mother
          text: Children! Are you quarreling again already?
        - id: ch01-b120
          speaker: peter
          text: We aren't really quarreling. I wish you wouldn't call it a row every time we disagree!
        - id: ch01-b121
          speaker: narrator
          text: Mother went out again. Bobbie could no longer hold back.
        - id: ch01-b122
          speaker: roberta
          text: Peter, I am sorry you're hurt. But you're awful for calling me a prig.
          emotion: angry
        - id: ch01-b123
          speaker: peter
          text: Maybe I am. You said I wasn't a coward, even when you were furious with me. Just don't become a prig, that's all. Keep watch, and if you feel priggishness coming, stop it before it gets out. Understand?
        - id: ch01-b124
          speaker: roberta
          text: Yes, I understand.
        - id: ch01-b125
          speaker: peter
          text: Then let's make peace. We'll bury the hatchet in the deepest part of the past. Shake hands. Bobbie, old chap, I'm tired.
        - id: ch01-b126
          speaker: narrator
          text: Peter stayed tired for many days after that. The wooden settle seemed hard and uncomfortable even when they piled it with pillows, cushions, and soft folded rugs. Worst of all, he could not go outdoors. They moved the settle beside the window. From there, Peter could watch the smoke from the trains winding along the valley, but the trains themselves were out of sight.
        - id: ch01-b127
          speaker: narrator
          text: At first, Bobbie found it hard to be as kind to Peter as she wanted. She was afraid he would call her priggish again. That feeling soon wore away. Both Bobbie and Phyllis became, as Peter himself observed, very good sorts. When his sisters went out, Mother sat with him. And the words "he's not a coward" stayed in Peter's mind. They made him determined not to fuss about the pain in his foot, though it was rather bad, especially at night.
        - id: ch01-b128
          speaker: narrator
          text: Sometimes praise helps people very much.
        - id: ch01-b129
          speaker: narrator
          text: Peter had visitors too. Mrs. Perks walked up to the house to ask how he was doing. The stationmaster came, and so did several people from the village. Their visits helped for a while, but one day after another still went by slowly, slowly.
        - id: ch01-b130
          speaker: peter
          text: I wish I had something new to read. I've gone through every one of our books fifty times.
        - id: ch01-b131
          speaker: phyllis
          text: I'll go to the doctor's house. He must have books.
        - id: ch01-b132
          speaker: peter
          text: They'll all be about illnesses and the horrible things inside people's bodies.
        - id: ch01-b133
          speaker: roberta
          text: Perks has piles of magazines that passengers leave on trains when they're finished. I'll run down and ask him.
        - id: ch01-b134
          speaker: narrator
          text: So the girls set off in different directions.
        - id: ch01-b135
          speaker: narrator
          text: Down at the station, Bobbie found Perks busy cleaning the lamps. His hands were occupied with the familiar black and oily cotton waste he used for the job.
        - id: ch01-b136
          speaker: perks
          text: And how is the young gentleman?
        - id: ch01-b137
          speaker: roberta
          text: Better, thank you, but he's terribly bored. Could you lend him any magazines?
        - id: ch01-b138
          speaker: perks
          text: There now, why didn't I think of that? This very morning I was trying to find something to amuse him. The best I could come up with was a guinea pig. A young fellow I know will bring it over at teatime.
        - id: ch01-b139
          speaker: roberta
          text: How wonderful! A real live guinea pig! Peter will love it. But he'd like magazines too.
          emotion: happy
        - id: ch01-b140
          speaker: perks
          text: That's the trouble. I just sent the best magazines to Snigson's boy, the one who's getting over pneumonia. But I've still got plenty of illustrated papers left.
        - id: ch01-b141
          speaker: narrator
          text: Perks turned toward the stack of papers in the corner. He sorted through it, then lifted out a heap of illustrated papers that stood a full six inches thick.
        - id: ch01-b142
          speaker: perks
          text: Here you are. I'll wrap them up with some paper and string.
        - id: ch01-b143
          speaker: narrator
          text: He pulled an old newspaper from the pile, spread it across the table, and made a neat parcel.
        - id: ch01-b144
          speaker: perks
          text: There. These have lots of pictures. If he wants to paint or color all over them, let him. I don't need them.
        - id: ch01-b145
          speaker: roberta
          text: You're a dear.
        - id: ch01-b146
          speaker: narrator
          text: Bobbie took the parcel and started home. The papers were heavy. When she reached the level crossing, she had to wait while a train went by, so she rested the bundle on top of the gate. As she waited, she idly looked at the printing on the newspaper Perks had used for the wrapper.
        - id: ch01-b147
          speaker: narrator
          text: Suddenly, she clutched the parcel more tightly and bent her head over the page. What she saw seemed like part of some horrible dream, but she kept reading. The bottom of the column had been torn away. When she reached that ragged edge, there was no more to read.
        - id: ch01-b148
          speaker: narrator
          text: Bobbie never remembered how she reached home. She went on tiptoe to her room and locked the door behind her. Then she undid the parcel and read the printed column again while sitting on the edge of her bed. Her hands and feet felt icy cold, while her face seemed to burn. When she had read every word that remained, she drew one long, uneven breath.
        - id: ch01-b149
          speaker: roberta
          text: So now I know.
          emotion: fearful
        - id: ch01-b150
          speaker: narrator
          text: The printed heading said, "End of the Trial. Verdict. Sentence." The name of the man who had been tried was Father's name. Under the word verdict, it said guilty. And the sentence was five years of penal servitude.
        - id: ch01-b151
          speaker: roberta
          text: Oh, Daddy, it isn't true. I don't believe it. You never did it. Never, never, never!
          emotion: sad
        - id: ch01-b152
          speaker: narrator
          text: Bobbie whispered the words while crushing the newspaper hard in her hands. Before she had time to do anything more, a loud hammering began on her locked bedroom door.
        - id: ch01-b153
          speaker: roberta
          text: What is it?
        - id: ch01-b154
          speaker: phyllis
          text: It's me. Tea is ready, and a boy brought Peter a guinea pig. Come downstairs.
        - id: ch01-b155
          speaker: narrator
          text: And Bobbie had to go.
