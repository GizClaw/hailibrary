audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细微幽默和体恤
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中
    bobbie:
      display_name: 博比
      tts:
        delivery: 真诚敏锐，关切时急切而坚定
        timbre: 清亮温暖的少女声
        pace: 自然偏快
        pitch: 中高
    peter:
      display_name: 彼得
      tts:
        delivery: 爽直自信，兴奋时干脆有力
        timbre: 明亮的少年声
        pace: 明快
        pitch: 中高
    phyllis:
      display_name: 菲莉丝
      tts:
        delivery: 天真活泼，想象丰富
        timbre: 轻盈稚嫩的女孩声
        pace: 轻快
        pitch: 高
    driver:
      display_name: 火车司机
      tts:
        delivery: 豪爽亲切，带朴实的铁路工人口吻
        timbre: 粗厚洪亮
        pace: 稳健
        pitch: 中低
    farmer:
      display_name: 农夫
      tts:
        delivery: 迟缓武断，带乡间口音感
        timbre: 粗哑厚重
        pace: 偏慢
        pitch: 低
    young_man:
      display_name: 提黑包的年轻人
      tts:
        delivery: 一本正经，爱下判断
        timbre: 清晰偏薄
        pace: 适中
        pitch: 中
    bystander:
      display_name: 围观者
      tts:
        delivery: 好奇而犹疑，随人群起哄
        timbre: 普通自然
        pace: 适中
        pitch: 中
    station_master:
      display_name: 站长
      tts:
        delivery: 威严务实，善意藏在公事口吻下面
        timbre: 浑厚清楚
        pace: 稳重
        pitch: 中低
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔镇定，讲到苦难时克制而悲悯
        timbre: 温润清晰
        pace: 从容
        pitch: 中
    doctor:
      display_name: 福里斯特医生
      tts:
        delivery: 亲切务实，偶尔带温和玩笑
        timbre: 沉稳温暖
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 暴雨中的车站
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那天，妈妈独自去了梅德布里奇，孩子们说好去车站接她。他们爱车站爱得不得了，所以提前整整一个钟头就到了。就算火车准点，这也未免太早，何况火车多半还不准点。哪怕天气晴朗，树林、田野、岩石和河流都等着他们去玩，他们大概还是会早早赶来。
        - id: ch01-b02
          speaker: narrator
          text: 偏偏这是一个又冷又湿的七月天。照菲莉丝的说法，狂风赶着一群群暗紫色的云横过天空，像一群梦里的大象。雨点打在脸上，又尖又疼，三个孩子只好跑完最后一段路。到了车站，雨反而更急，斜着抽打售票处的窗户，也抽打那间阴冷的总候车室。
        - id: ch01-b03
          speaker: phyllis
          text: 我们好像躲在一座被包围的城堡里。你们看，敌人的箭都射上城垛啦！
        - id: ch01-b04
          speaker: peter
          text: 哪有，明明像一把特别大的花园喷水枪。
        - id: ch01-b05
          speaker: narrator
          text: 下行站台已经湿透了，风还把雨直灌进那座又小又冷的候车棚。等下行车的旅客偏偏只能在那里躲雨，于是孩子们决定去上行站台。妈妈回来以前，他们可以看两班上行列车和一班下行列车，这一个钟头当然会过得热热闹闹，也不会缺少有趣的事。
        - id: ch01-b06
          speaker: bobbie
          text: 也许到那时候雨就停了。不管怎么说，幸好我把妈妈的雨衣和伞带来了。
        - id: ch01-b07
          speaker: narrator
          text: 三个人钻进那间空荡荡、荒凉得很的总候车室，玩起了广告模仿游戏。这游戏有点像不许说话的押韵猜词。一个人先出去，再回来把自己装得尽可能像某幅广告，让另外两个人来猜。博比坐在妈妈的伞下，把脸扮得尖尖的，大家马上认出她是广告里伞下的狐狸。
        - id: ch01-b08
          speaker: narrator
          text: 菲莉丝想拿妈妈的雨衣扮成魔毯，可真正的魔毯应该又硬又平，像张木筏。那件雨衣偏偏软塌塌的，谁都没猜中。彼得更夸张。他把煤灰抹满整张脸，四肢张开，摆得像只蜘蛛，还说自己是某种蓝黑书写墨水广告里的墨渍。大家一致认为，他这回做得太过火了。
        - id: ch01-b09
          speaker: narrator
          text: 再次轮到菲莉丝时，她正努力扮成某某先生的尼罗河全程导游旅行广告里的狮身人面像，信号铃忽然清脆地一响。上行列车来了。孩子们飞奔出去，机车上正是那位特别要好的司机和司炉吉姆。如今，这两个人已经算得上孩子们最亲爱的朋友。
        - id: ch01-b10
          speaker: narrator
          text: 大家亲热地互相问候。吉姆问起那辆修好的玩具机车，博比硬请他收下一包自己做的太妃糖。纸包又湿又油，可这份心意还是叫司机很高兴。他答应认真考虑博比的请求，改天也许会让彼得坐一回机车。
        - id: ch01-b11
          speaker: driver
          text: 往后站，伙计们。她可要开喽！
        - id: ch01-b12
          speaker: narrator
          text: 火车真的开走了。孩子们一直望着车尾灯，直到它消失在铁道的弯处，才转身回总候车室，准备继续享受那里的尘土、自由和广告游戏。他们原以为只会遇见一两个交完车票、落在最后的旅客。可车站门边的站台上，多出了一团黑影。那黑影是一大群人。
        - id: ch01-b13
          speaker: peter
          text: 出事了！快过去看看！
        - id: ch01-b14
          speaker: narrator
          text: 他们沿站台一路跑过去。到了人群边上，当然还是什么也看不见，只看见外围那些人湿漉漉的后背和一个个胳膊肘。所有人都在同一刻抢着说话，看来真有什么事发生了。
    - id: ch02
      title: 陌生的语言
      blocks:
        - id: ch02-b01
          speaker: farmer
          text: 要我说，他不过是个天生的傻子。
        - id: ch02-b02
          speaker: narrator
          text: 说话的是个农夫模样的人，红脸刮得干干净净。
        - id: ch02-b03
          speaker: young_man
          text: 依我看，这事该送治安法庭。
        - id: ch02-b04
          speaker: bystander
          text: 才不是，送济贫医院还差不多。
        - id: ch02-b05
          speaker: station_master
          text: 好啦，都往前走。劳驾各位，这件事交给我。
        - id: ch02-b06
          speaker: narrator
          text: 人群谁也不肯动。忽然，一个陌生的声音从中间传出来。孩子们从头到脚都激动起来，因为那人说的是外国话，而且是他们从没听过的语言。他们听过法语和德语。艾玛姨妈会德语，还唱过一首满是 bedeuten、zeiten、bin 和 sin 的歌。那也绝不是拉丁语，彼得毕竟已经学了四个学期。
        - id: ch02-b07
          speaker: narrator
          text: 好在孩子们很快发现，围观的人也全都听不懂这种外国话，没有谁比他们明白多少。这多少叫人觉得安慰。
        - id: ch02-b08
          speaker: farmer
          text: 他到底在说什么？
        - id: ch02-b09
          speaker: station_master
          text: 听起来像法语。
        - id: ch02-b10
          speaker: narrator
          text: 站长曾经去布洛涅玩过一天，所以这样判断。
        - id: ch02-b11
          speaker: peter
          text: 才不是法语！
        - id: ch02-b12
          speaker: bystander
          text: 那你说，这是什么话？
        - id: ch02-b13
          speaker: narrator
          text: 人群让开一点，想看看是谁开的口。彼得趁机往前挤。等众人重新合拢时，他已经站在第一排，也终于看清了被围住的人。那男人留着长发，眼神狂乱，身上的衣服又破又旧，式样也是彼得从没见过的。他的手和嘴唇不停发抖，一看见彼得，又用那种语言说了起来。
        - id: ch02-b14
          speaker: peter
          text: 我不知道这是什么话，可我知道，它绝不是法语。
        - id: ch02-b15
          speaker: farmer
          text: 你懂得这么多，那就用法语问问他呀。
        - id: ch02-b16
          speaker: peter
          text: 巴莱——乌——弗朗赛？
        - id: ch02-b17
          speaker: narrator
          text: 那男人本来一直靠着墙，这时却猛地扑上来，紧紧握住彼得的双手，滔滔不绝地说出一大串话。人群吓得又往后退。彼得虽然半个字也不懂，却认出了那种语言的声音，这一次绝不会错了。
        - id: ch02-b18
          speaker: peter
          text: 看见了吧？这才是法语！
        - id: ch02-b19
          speaker: bystander
          text: 那他说了什么？
        - id: ch02-b20
          speaker: peter
          text: 这个……我不知道。
        - id: ch02-b21
          speaker: station_master
          text: 请各位散开吧，我会处理这件事。
        - id: ch02-b22
          speaker: narrator
          text: 几个比较胆小、也没那么好奇的旅客，慢慢吞吞、不情不愿地走了。博比和菲莉丝趁机挤到彼得身旁。三个孩子在学校都受过法语教育，这时却痛切地发现，受过教和真正学会完全是两回事。他们多么希望自己当初真的把法语学会了。
        - id: ch02-b23
          speaker: narrator
          text: 彼得向陌生人摇头，表示自己听不懂，可他的手依然握得很热情，望着对方的眼神也尽可能友善。一个围观的人犹豫了半天，忽然冒出一句“闹——康普伦尼”，随即羞得满脸通红，倒退着挤出人群，独自走掉了。
        - id: ch02-b24
          speaker: bobbie
          text: 请把他带进您的办公室吧。妈妈会说法语，她下一班车就从梅德布里奇回来了。
        - id: ch02-b25
          speaker: narrator
          text: 站长没有恶意，只是突然抓住了陌生人的胳膊。那人却猛地挣开，缩着身子后退。他咳嗽着，发着抖，还想推开站长。
        - id: ch02-b26
          speaker: bobbie
          text: 别抓他！您没看出他有多害怕吗？他以为您要把他关起来。看看他的眼睛，我知道他就是这么想的！
        - id: ch02-b27
          speaker: farmer
          text: 那双眼睛，活像狐狸掉进捕兽夹的时候。
        - id: ch02-b28
          speaker: bobbie
          text: 让我试一试吧。我真的会一两个法语词，只是一时想不起来。
        - id: ch02-b29
          speaker: narrator
          text: 人到了万分紧急的时候，往往能做出平日连想都不敢想的事。博比在法语班里从来离第一名远得很，可她一定曾经不知不觉学进去一点东西。此刻，她望着那双惊惶得像被人追赶的眼睛，竟然想起几个法语词，还真的说出了口。
        - id: ch02-b30
          speaker: bobbie
          text: 您，等一等。我的妈妈会说法语。我们……“善待别人”用法语怎么说？
        - id: ch02-b31
          speaker: narrator
          text: 没有人知道。
        - id: ch02-b32
          speaker: phyllis
          text: “邦”就是“好”。
        - id: ch02-b33
          speaker: bobbie
          text: 我们会……邦……对您。
        - id: ch02-b34
          speaker: narrator
          text: 那人也许没听懂博比拼凑出来的话，却懂得她主动放进自己手里的那只小手，也懂得另一只手轻轻抚摸破旧衣袖时的善意。博比柔和地牵着他，慢慢走进站长办公室最里面，仿佛那里是车站最神圣的内殿。另外两个孩子跟了进去，站长把黄色的门关在人群面前。
        - id: ch02-b35
          speaker: narrator
          text: 围观的人还在售票处站了一阵，一边议论纷纷，一边盯着那扇已经关得严严实实的黄色门板。过了一会儿，他们才一个两个地散开，临走时仍在不满地嘟囔。
    - id: ch03
      title: 一枚俄国邮票
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 办公室里，博比仍握着陌生人的手，另一只手还在轻抚他的袖子。
        - id: ch03-b02
          speaker: station_master
          text: 这下真麻烦。他没车票，连自己要去哪里都不知道。我都拿不准该不该叫警察了。
        - id: ch03-b03
          speaker: bobbie
          text: 千万别叫警察！
        - id: ch03-b04
          speaker: peter
          text: 求您了，别叫！
        - id: ch03-b05
          speaker: phyllis
          text: 请等妈妈来吧！
        - id: ch03-b06
          speaker: narrator
          text: 三个孩子一起央求起来。博比突然看见陌生人哭了，连忙挡在他和大家中间。真是极不寻常的好运，她口袋里竟有一块手帕。更不寻常的是，那块手帕还算干净。她站在陌生人面前，悄悄把手帕递给了他，不让别人瞧见。
        - id: ch03-b07
          speaker: phyllis
          text: 妈妈很快就来了。她的法语说得特别好听，您一定会喜欢。
        - id: ch03-b08
          speaker: peter
          text: 我敢肯定，他没有做过那种会让人坐牢的坏事。
        - id: ch03-b09
          speaker: station_master
          text: 瞧着倒像没有正当生计的流浪汉。好吧，你们妈妈来以前，我可以先让他占一次便宜，当他是无罪的。我可真想知道，究竟是哪个国家得了这份光彩，出了这么一位人物。
        - id: ch03-b10
          speaker: narrator
          text: 彼得忽然想到一个办法。他掏出一只信封，里面装了半信封外国邮票。博比看见陌生人已经用她的手帕擦干了眼泪，这才同意试一试彼得的办法。
        - id: ch03-b11
          speaker: peter
          text: 咱们把这些邮票拿给他看，怎么样？
        - id: ch03-b12
          speaker: bobbie
          text: 好，就这么办。
        - id: ch03-b13
          speaker: narrator
          text: 他们先拿出一枚意大利邮票，一会儿指邮票，一会儿指陌生人，再扬起眉毛作出询问的样子。他摇摇头。接着换成一枚很常见的蓝色挪威邮票，他又打手势说不是。等他们拿出西班牙邮票时，他从彼得手里接过信封，用发抖的手在那堆邮票中翻找起来。
        - id: ch03-b14
          speaker: narrator
          text: 最后，他终于找到了要找的那一枚。他像是在回答孩子们的问题一样伸出手来，掌心里放着一枚俄国邮票。
        - id: ch03-b15
          speaker: peter
          text: 他是俄国人！要不然，他就像吉卜林《曾经是个人》里的那个人。
        - id: ch03-b16
          speaker: narrator
          text: 从梅德布里奇来的列车信号响了。
        - id: ch03-b17
          speaker: bobbie
          text: 你们去接妈妈，我留下陪他。
        - id: ch03-b18
          speaker: station_master
          text: 小姑娘，你不怕吗？
        - id: ch03-b19
          speaker: bobbie
          text: 我不怕。您不会伤害我的，对不对？
        - id: ch03-b20
          speaker: narrator
          text: 博比看着陌生人，就像看着一条不知脾气好坏的陌生狗。她对他笑，他也歪着嘴回了一个古怪的笑，随后又咳起来。进站的列车带着沉重的轰隆声和呼啸从外面掠过，站长、彼得和菲莉丝出去迎接。等他们带妈妈回来，博比仍握着那人的手。
        - id: ch03-b21
          speaker: narrator
          text: 俄国人站起来，十分郑重地鞠了一躬。妈妈用法语问他，他也用法语回答。起初，他说得断断续续，后来一句比一句长。孩子们听不懂，只看两个人的脸，却也知道那些话叫妈妈又愤怒又怜悯，又伤心又愤慨。
        - id: ch03-b22
          speaker: station_master
          text: 太太，这到底是怎么回事？
        - id: ch03-b23
          speaker: mother
          text: 已经没事了。他是俄国人，车票弄丢了，恐怕还病得很重。您要是不介意，我现在就带他回家。他已经累垮了。明天我再来，把事情全告诉您。
        - id: ch03-b24
          speaker: station_master
          text: 但愿您领回去的，不是一条冻僵的毒蛇。
        - id: ch03-b25
          speaker: mother
          text: 不会的，我很确定。他在自己的国家是位了不起的人物，写过许多很美的书，我还读过几本呢。其余的事，明天再告诉您。
        - id: ch03-b26
          speaker: narrator
          text: 妈妈又对俄国人说了几句法语。人人都看得见，他眼里立刻露出了惊喜、快乐和感激。随后，他起身向站长礼貌地鞠躬，又极其郑重地伸出胳膊，请妈妈挽住。妈妈挽了，可谁都看得出，是妈妈在扶他往前走，并不是他在扶妈妈。
        - id: ch03-b27
          speaker: mother
          text: 你们两个姑娘先回去，在起居室生火。彼得最好去请医生。
    - id: ch04
      title: 三烟囱的病人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 可最后去请医生的是博比。她找到福里斯特医生时，他只穿着衬衫，正在三色堇花圃里除草。
        - id: ch04-b02
          speaker: bobbie
          text: 我真不愿意这样说，可妈妈领回来一个衣服破得很厉害的俄国人。他肯定得加入您的互助会，因为他一定没有钱。我们是在车站发现他的。
        - id: ch04-b03
          speaker: doctor
          text: 发现他？难道他走丢了？
        - id: ch04-b04
          speaker: bobbie
          text: 对，他真的走丢了。他刚才一直用法语给妈妈讲自己一生中那个又悲伤又美好的故事。妈妈说，如果您正好在家，能不能请您发发善心，马上过去。他咳得特别厉害，而且刚才还哭了。
        - id: ch04-b05
          speaker: narrator
          text: 医生笑了一下。
        - id: ch04-b06
          speaker: bobbie
          text: 求您别笑。您看见他以后，就不会笑了。我从没见过男人哭，您不知道那是什么样子。
          emotion: sad
        - id: ch04-b07
          speaker: narrator
          text: 福里斯特医生马上后悔自己刚才笑了。他和博比回到三烟囱时，俄国人坐在爸爸从前的扶手椅上，双脚伸向烧得明亮的柴火，正一小口一小口喝着妈妈给他泡的茶。
        - id: ch04-b08
          speaker: doctor
          text: 他的身体和精神都耗尽了。咳嗽很重，不过都能治好。他现在该马上睡下，夜里还得生一炉火。
        - id: ch04-b09
          speaker: mother
          text: 那就在我的房间生火吧，家里只有那里有壁炉。
        - id: ch04-b10
          speaker: narrator
          text: 妈妈果真生好了火，医生不久也扶陌生人上床躺下。妈妈房里有一只黑色大箱子，孩子们从没见它打开过。这次，妈妈开了箱子，从里面拿出几件男人穿的衣服，放在刚刚生起的火旁烘着。
        - id: ch04-b11
          speaker: narrator
          text: 博比抱着更多木柴进来，看见睡衣上的标记，又看了看敞开的箱子。她能瞧见的全是男人的衣服，睡衣上写的正是爸爸的名字。那还是爸爸的一件新睡衣，是彼得生日前不久才做好的。原来爸爸根本没把自己的衣服带走。
        - id: ch04-b12
          speaker: narrator
          text: 博比悄悄退出房间。走开时，她听见钥匙在箱子的锁眼里转了一圈。她的心跳得怕人，脑子里只有一个问题。爸爸为什么没带衣服？妈妈一出来，她便扑过去，伸出两条胳膊紧紧搂住妈妈的腰。
        - id: ch04-b13
          speaker: bobbie
          text: 妈妈，爸爸没有……没有死，对不对？
          emotion: fearful
        - id: ch04-b14
          speaker: mother
          text: 没有，宝贝！你怎么会想到这么可怕的事？
          emotion: surprised
        - id: ch04-b15
          speaker: bobbie
          text: 我……我也不知道。
        - id: ch04-b16
          speaker: narrator
          text: 博比很生自己的气，却仍牢牢守着自己立下的那个决心。凡是妈妈不打算让她看见的事，她就当作自己没有看见，绝不去追问。
        - id: ch04-b17
          speaker: mother
          text: 我上次得到消息时，爸爸好得很，真的好得很。总有一天，他会回到我们身边。宝贝，别再想这些吓人的事了。
          emotion: calm
        - id: ch04-b18
          speaker: narrator
          text: 晚些时候，俄国客人已经舒舒服服地安顿好，妈妈来到女儿们的房间。她今晚要睡菲莉丝的床，菲莉丝则睡地板上的床垫。这在菲莉丝看来，是一场有趣极了的冒险。妈妈刚刚进门，两个穿着睡衣的白色小身影就一跃而起，两道急切的声音一起叫住了她。
        - id: ch04-b19
          speaker: bobbie
          text: 妈妈，现在把那位俄国先生的事讲给我们听吧！
        - id: ch04-b20
          speaker: phyllis
          text: 对，把他的事全告诉我们！
        - id: ch04-b21
          speaker: narrator
          text: 这时，又有一个白色身影跳进房间。那是彼得，他把被子一路拖在身后，看起来活像一只白孔雀拖着长长的尾巴。
        - id: ch04-b22
          speaker: peter
          text: 我们一直耐心等着。为了不睡着，我只好咬舌头。刚才差一点还是睡着了，我就咬得太重，现在疼得厉害。快讲吧，讲一个长长的好故事。
        - id: ch04-b23
          speaker: mother
          text: 今晚讲不了长故事，我太累了。
        - id: ch04-b24
          speaker: narrator
          text: 博比听得出妈妈哭过，另外两个孩子却没有听出来。
        - id: ch04-b25
          speaker: phyllis
          text: 那您能讲多长，就讲多长吧。
        - id: ch04-b26
          speaker: narrator
          text: 博比搂住妈妈的腰，紧紧偎着她。
    - id: ch05
      title: 囚徒与俘虏
      blocks:
        - id: ch05-b01
          speaker: mother
          text: 这个故事长得足够写成一本书。那位先生是个作家，写过很多优美的书。俄国由沙皇统治的时候，谁也不敢说富人做了坏事，也不敢说该怎样帮助穷人过得好一些、快活一些。谁说了，就会被关进监狱。
        - id: ch05-b02
          speaker: peter
          text: 可他们不能这样做。一个人做了错事，才该进监狱。
        - id: ch05-b03
          speaker: mother
          text: 也可能是法官认为他做错了事。在英国，人们是因为这样才进监狱，可那时的俄国不一样。那位先生写了一本很美的书，讲穷人的生活，也讲该怎样帮助他们。我亲自读过，那本书里写的只有善良和仁爱。可他们竟然因为这本书，把他关进了监狱。
        - id: ch05-b04
          speaker: mother
          text: 他独自在一间可怕的地牢里待了三年。那里几乎见不到光，到处又湿又阴森。整整三年，他都是孤零零一个人，被关在那间牢房里。
        - id: ch05-b05
          speaker: narrator
          text: 妈妈的声音轻轻发抖，忽然停住了。
        - id: ch05-b06
          speaker: peter
          text: 妈妈，这不可能是现在发生的事吧？听起来像历史书里的宗教裁判所。
        - id: ch05-b07
          speaker: mother
          text: 这是真的，每一件事都可怕地真实。后来，他们把他从地牢里带出来，押往西伯利亚。他成了苦役犯，和别的囚犯锁在一起，那些人犯过各种各样的罪。一长串人就这样被锁链连着，不停地走。他们走过一天天、一个个星期，走得他以为这辈子永远不会停下。
          emotion: sad
        - id: ch05-b08
          speaker: mother
          text: 监工拿着鞭子跟在队伍后面。是的，真的是鞭子。谁累了，他们就打谁。有些人慢慢走瘸了，有些人倒在地上。要是爬不起来，不能继续赶路，监工还会鞭打他们，然后把他们丢在那里等死。啊，这一切实在太可怕了！
          emotion: sad
        - id: ch05-b09
          speaker: mother
          text: 最后，他到了矿场，却被判一辈子留在那里。只因为写了一本善良、高尚、了不起的书，他就得在那里过一生。
          emotion: sad
        - id: ch05-b10
          speaker: peter
          text: 那他后来怎么逃出来的？
        - id: ch05-b11
          speaker: mother
          text: 战争爆发后，有些俄国囚犯可以志愿参军，他也报了名。可一找到机会，他就逃离了军队，后来……
        - id: ch05-b12
          speaker: peter
          text: 当逃兵不是很懦弱吗？尤其还在打仗。
        - id: ch05-b13
          speaker: mother
          text: 那个国家这样对他，你觉得他还欠那个国家什么吗？就算欠，他欠妻子和孩子的也更多。他根本不知道家人后来怎么样了。
        - id: ch05-b14
          speaker: bobbie
          text: 原来他坐牢的时候，还要一直想着妻子和孩子，也一直为他们难过吗？
          emotion: sad
        - id: ch05-b15
          speaker: mother
          text: 是的，他在牢里的每一天都想着他们，也一直为他们难过。他根本得不到消息，只知道妻子和孩子说不定也被关进了监狱，因为俄国确实会做这种事。后来他到了矿场，有几个朋友设法把消息送进去，告诉他妻子和孩子已经逃走，来到英国。所以他离开军队以后，也到英国来寻找他们。
        - id: ch05-b16
          speaker: peter
          text: 他知道他们住在哪里吗？
        - id: ch05-b17
          speaker: mother
          text: 不知道，只知道他们在英国。他本来要去伦敦，以为得在我们车站换车，后来才发现车票和钱袋都丢了。
        - id: ch05-b18
          speaker: bobbie
          text: 您觉得他找得到吗？我是说他的妻子和孩子，不是车票和钱袋。
        - id: ch05-b19
          speaker: mother
          text: 但愿他能找到。我盼着，也真心祈祷，他能重新见到妻子和孩子。
          emotion: sad
        - id: ch05-b20
          speaker: narrator
          text: 这一次，连菲莉丝也听出了妈妈声音里的颤抖。
        - id: ch05-b21
          speaker: phyllis
          text: 妈妈，您好像特别替他难过。
        - id: ch05-b22
          speaker: narrator
          text: 妈妈沉默了一会儿，只轻轻说了一个“是”。随后她像是陷入了沉思，孩子们也安静下来。
        - id: ch05-b23
          speaker: mother
          text: 亲爱的孩子们，你们祷告的时候，可以求上帝怜悯所有的囚徒与俘虏。
        - id: ch05-b24
          speaker: bobbie
          text: 求上帝怜悯所有的囚徒与俘虏。是这样说吗，妈妈？
        - id: ch05-b25
          speaker: mother
          text: 是的。所有的囚徒与俘虏。所有的囚徒与俘虏。
