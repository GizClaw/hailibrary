  chapters:
    - id: ch01
      title: Chapter V. Prisoners and captives.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One day, Mother went to Maidbridge by herself, and the children were supposed to meet her train. They loved the station so much that they arrived a full hour early, long before her train could possibly come. They probably would have done the same on a fine day, even with the woods, fields, rocks, and river waiting for them. But this July day was wet and bitterly cold. A wild wind chased dark purple clouds across the sky.
        - id: ch01-b02
          speaker: phyllis
          text: They look like herds of dream elephants.
        - id: ch01-b03
          speaker: narrator
          text: The rain stung their faces, and they ran the rest of the way. Once they reached the station, it came down even harder, slashing sideways against the booking-office windows and the chilly room marked General Waiting Room.
        - id: ch01-b04
          speaker: phyllis
          text: It's like we're inside a castle under siege. Look at the enemy's arrows hitting the walls!
        - id: ch01-b05
          speaker: peter
          text: It looks more like one enormous garden hose.
        - id: ch01-b06
          speaker: narrator
          text: They chose the up platform. The down platform was soaked, and the rain blew straight into its small, bare shelter. There would be plenty to watch during the next hour. Two up trains and one down train would pass before Mother's train arrived.
        - id: ch01-b07
          speaker: roberta
          text: Maybe the rain will stop before then. Anyway, I'm glad I brought Mother's raincoat and umbrella.
        - id: ch01-b08
          speaker: narrator
          text: They went into the lonely General Waiting Room, where the time passed pleasantly over a game of advertisements. In case you don't know that game, it works a little like this. Each player takes a turn going out, then comes back looking as much like an advertisement as possible. Everyone else has to guess which advertisement it is. Roberta came in, sat beneath Mother's umbrella, and made her face sharp. They all knew at once that she was the fox who sits under an umbrella in the advertisement. Phyllis tried to turn Mother's raincoat into a Magic Carpet. But it wouldn't stay stiff and flat the way a proper Magic Carpet should, so nobody guessed. Peter rubbed coal dust all over his face, twisted himself into a spidery pose, and announced that he was the inkblot advertising someone's Blue Black Writing Fluid. Everyone agreed that Peter had carried the game a little too far.
        - id: ch01-b09
          speaker: narrator
          text: On Phyllis's next turn, she was posing as the Sphinx from an advertisement for tours up the Nile. Then the signal gave its sharp ring. An up train was coming, and the children raced outside. Their special engine driver and fireman were on the engine. By now, both men were among the children's dearest friends. Greetings went back and forth. Jim asked about the toy engine, and Roberta offered him a damp, greasy package of homemade toffee.
        - id: ch01-b10
          speaker: narrator
          text: The gift pleased the engine driver so much that he promised to think about Roberta's request. Perhaps, one day, he might let Peter ride on the engine.
        - id: ch01-b11
          speaker: engine_driver
          text: Stand back, mates! Off she goes!
        - id: ch01-b12
          speaker: narrator
          text: And off the train went. The children watched its red tail-lights until they vanished around the curve. Then they turned back toward the dusty freedom of the waiting room and another round of advertisements.
        - id: ch01-b13
          speaker: narrator
          text: They expected to see only one or two passengers still leaving the station. Instead, a dark patch surrounded the door. It was a crowd.
        - id: ch01-b14
          speaker: peter
          text: Oh! Something's happened! Come on!
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: They ran along the platform. At the edge of the crowd, all they could see were damp backs and elbows. Everyone talked at once, and one thing was perfectly clear. Something had happened.
        - id: ch01-b16
          speaker: farmer
          text: I don't believe there's anything wrong with him beyond being a simpleton.
        - id: ch01-b17
          speaker: young_man
          text: If you ask me, this looks like a Police Court matter.
        - id: ch01-b18
          speaker: farmer
          text: Nonsense. More likely a case for the infirmary.
        - id: ch01-b19
          speaker: station_master
          text: All right, move along now. I'll handle this, if you please.
        - id: ch01-b20
          speaker: narrator
          text: The Station Master's voice was firm and official, but the crowd stayed where it was. Then another voice rose from its center and sent a thrill through all three children. The man was speaking a foreign language. More than that, it was a language they had never heard before. They knew the sound of French, and they had heard German too. Aunt Emma knew German and used to sing a song that included words like bedeuten, zeiten, bin, and sin. This strange speech sounded nothing like that. It wasn't Latin either, and Peter felt qualified to know because he had studied Latin for four school terms.
        - id: ch01-b21
          speaker: narrator
          text: At least no one else understood him. The children took some comfort in that.
        - id: ch01-b22
          speaker: farmer
          text: What's he saying?
        - id: ch01-b23
          speaker: station_master
          text: Sounds like French to me.
        - id: ch01-b24
          speaker: narrator
          text: The Station Master had once spent a day in Boulogne.
        - id: ch01-b25
          speaker: peter
          text: That isn't French!
        - id: ch01-b26
          speakers: [farmer, young_man]
          ensemble: duo
          text: Then what is it?
        - id: ch01-b27
          speaker: narrator
          text: The crowd opened slightly to find the speaker. Peter pushed through, and when the people closed in again, he stood in the front row.
        - id: ch01-b28
          speaker: peter
          text: I don't know what language it is. But I know it isn't French.
        - id: ch01-b29
          speaker: narrator
          text: Now Peter saw the man at the center. He had long hair, wild eyes, and shabby clothes cut in an unfamiliar style. His hands and lips trembled. When his eyes found Peter, he spoke again.
        - id: ch01-b30
          speaker: peter
          text: No. Definitely not French.
        - id: ch01-b31
          speaker: farmer
          text: If you know so much, try speaking French to him.
        - id: ch01-b32
          speaker: peter
          text: Parlez-vous français?
        - id: ch01-b33
          speaker: narrator
          text: The crowd jumped back. The wild-eyed man sprang away from the wall, seized Peter's hands, and poured out a flood of words. Peter couldn't understand a single one, but this time he recognized the sound.
        - id: ch01-b34
          speaker: peter
          text: There! That's French!
        - id: ch01-b35
          speaker: young_man
          text: What is he saying?
        - id: ch01-b36
          speaker: peter
          text: I don't know.
        - id: ch01-b37
          speaker: station_master
          text: Move along, please. I'll take care of him.
        - id: ch01-b38
          speaker: narrator
          text: A few of the more timid travelers, or perhaps the less curious ones, slowly and unwillingly moved away. Roberta and Phyllis managed to squeeze through until they stood beside Peter. All three children had been taught French at school. At that moment, they understood the enormous difference between being taught a language and truly learning it, and they wished with all their hearts that they had learned theirs. Peter could only shake his head to show the stranger that he didn't understand. Still, he kept the man's hands clasped warmly in his own and made his face as kind as he possibly could.
        - id: ch01-b39
          speaker: traveler
          text: No comprenny!
        - id: ch01-b40
          speaker: narrator
          text: The traveler who said it turned bright red, backed out of the crowd, and disappeared.
        - id: ch01-b41
          speaker: roberta
          text: Take him into your office. Mother speaks French, and she'll be on the next train from Maidbridge.
        - id: ch01-b42
          speaker: narrator
          text: The Station Master reached for the stranger's arm. He did it quickly, though not unkindly. The man tore himself free, shrank against the wall, and began coughing and trembling as he tried to push the Station Master away.
        - id: ch01-b43
          speaker: roberta
          text: Oh, please don't! Can't you see how scared he is? He thinks you're going to lock him up. Just look at his eyes!
          emotion: fearful
        - id: ch01-b44
          speaker: farmer
          text: They're like a fox's eyes when it's caught in a trap.
        - id: ch01-b45
          speaker: roberta
          text: Let me try. I really do know a few French words, if only I can remember them.
        - id: ch01-b46
          speaker: narrator
          text: Sometimes, when the need is great enough, people manage things they could never do on an ordinary day. Roberta had never been near the top of her French class. Yet those hunted eyes brought the words back to her, and somehow she said them.
        - id: ch01-b47
          speaker: roberta
          text: Vous attendre. Ma mère parle français. Nous... What's the French for “being kind”?
        - id: ch01-b48
          speaker: narrator
          text: Nobody knew.
        - id: ch01-b49
          speaker: phyllis
          text: Bon means good.
        - id: ch01-b50
          speaker: roberta
          text: Nous être bon pour vous.
        - id: ch01-b51
          speaker: narrator
          text: Whether the man understood Roberta's improvised French was impossible to tell. But he did understand the small hand she placed in his, and he understood the kindness in her other hand as she stroked his shabby sleeve. Holding on gently, she drew him toward the Station Master's innermost private room. Peter and Phyllis followed close behind. Then the Station Master shut the door directly in the crowd's faces. For a while, people remained in the booking office, talking among themselves and staring at the tightly closed yellow door. At last, they went away in ones and twos, grumbling because the mystery had been shut away from them.
        - id: ch01-b52
          speaker: narrator
          text: Inside the office, Roberta kept hold of the stranger's hand and went on stroking his sleeve.
        - id: ch01-b53
          speaker: station_master
          text: Well, this is a fine mess. He has no ticket, and he can't even tell us where he wants to go. Maybe I ought to send for the police.
        - id: ch01-b54
          speakers: [roberta, peter, phyllis]
          ensemble: chorus
          text: Oh, don't!
        - id: ch01-b55
          speaker: narrator
          text: All three children begged him not to. Then Roberta noticed that the stranger was crying. She quickly moved between him and everyone else, hiding his face from their view. By a very unusual piece of good luck, she had a handkerchief in her pocket. By the still more uncommon accident of that handkerchief being fairly clean, it was fit to offer him. Roberta pulled it out and slipped it into his hand so quietly that the others never saw.
        - id: ch01-b56
          speaker: phyllis
          text: Please wait until Mother gets here. She speaks beautiful French. You'd love hearing her.
        - id: ch01-b57
          speaker: peter
          text: I'm sure he hasn't done anything that people get sent to prison for.
        - id: ch01-b58
          speaker: station_master
          text: He looks like a man with no means of supporting himself. Still, I'll give him the benefit of the doubt until your mother comes. I would like to know which nation gets the credit for him.
        - id: ch01-b59
          speaker: narrator
          text: An idea came to Peter. He pulled an envelope from his pocket. It was half full of foreign stamps.
        - id: ch01-b60
          speaker: peter
          text: Look, let's show him these.
        - id: ch01-b61
          speaker: narrator
          text: Roberta checked that the stranger had dried his eyes with her handkerchief.
        - id: ch01-b62
          speaker: roberta
          text: All right.
        - id: ch01-b63
          speaker: narrator
          text: They began with an Italian stamp. They pointed from the stranger to the stamp and back again, raising their eyebrows to make the movement into a question. He shook his head. Next came a Norwegian stamp, the common blue kind. Again, he signaled no. When they showed him a Spanish stamp, he reached for Peter's envelope instead. His hand trembled as he searched through the collection himself. Finally, with the gesture of someone giving a clear answer to a question, he stretched out his hand. A Russian stamp lay in his palm.
        - id: ch01-b64
          speaker: peter
          text: He's Russian! Unless he's like “the man who was” in Kipling.
          emotion: surprised
        - id: ch01-b65
          speaker: narrator
          text: Just then, the signal announced the train from Maidbridge.
        - id: ch01-b66
          speaker: roberta
          text: I'll stay here with him while you bring Mother in.
        - id: ch01-b67
          speaker: station_master
          text: You're not frightened, miss?
        - id: ch01-b68
          speaker: roberta
          text: Oh, no. You wouldn't hurt me, would you?
        - id: ch01-b69
          speaker: narrator
          text: As she said it, Roberta looked at the stranger much as she might have looked at an unfamiliar dog whose temper she couldn't be sure of. She smiled at him. He gave her a strange, crooked smile in return, and then his cough seized him again. Outside, the incoming train rushed past with a heavy rattle and swish. The Station Master, Peter, and Phyllis hurried out to meet it, leaving Roberta alone with the man. She didn't let go. When the others came back with Mother, Roberta was still sitting there with his hand held in hers.
        - id: ch01-b70
          speaker: narrator
          text: The Russian stood and bowed with great ceremony. Mother spoke to him in French. At first, he answered with difficulty. Then his sentences grew longer and longer. The children watched his face and Mother's. Whatever he was telling her made Mother angry, compassionate, sorrowful, and indignant all at once.
        - id: ch01-b71
          speaker: station_master
          text: Well, ma'am, what's this all about?
        - id: ch01-b72
          speaker: narrator
          text: At last, the Station Master could no longer hold back his curiosity.
        - id: ch01-b73
          speaker: mother
          text: It's all right. He's Russian, and he's lost his ticket. I'm afraid he's very sick, too. If you don't mind, I'll take him home now. He's completely worn out. I'll come down tomorrow and tell you the whole story.
        - id: ch01-b74
          speaker: station_master
          text: I hope you don't discover you've brought home a frozen viper.
        - id: ch01-b75
          speaker: mother
          text: Oh, no. I'm certain I haven't. He's a great man in his own country. He writes beautiful books, and I've read some of them. I'll explain everything tomorrow.
        - id: ch01-b76
          speaker: narrator
          text: Mother turned back to the Russian and explained something in French. Though the children couldn't follow the words, they could read the sudden surprise, pleasure, and gratitude in his eyes. He rose and bowed to the Station Master with great ceremony. Then, just as formally, he offered Mother his arm. Mother took it, and together they set off. Yet anyone watching could see the truth. The exhausted man wasn't supporting Mother. She was quietly supporting him at every step.
        - id: ch01-b77
          speaker: mother
          text: Girls, run home and light a fire in the sitting room. Peter, you had better fetch the doctor.
        - id: ch01-b78
          speaker: narrator
          text: But in the end, it was Roberta who went for Doctor Forrest.
        - id: ch01-b79
          speaker: narrator
          text: She found him in his shirtsleeves, pulling weeds from his pansy bed, and delivered the news without stopping for breath.
        - id: ch01-b80
          speaker: roberta
          text: I hate to tell you, but Mother has brought home a very shabby Russian, and I'm sure he'll need to join your Club. I'm certain he has no money. We found him at the station.
        - id: ch01-b81
          speaker: doctor_forrest
          text: You found him? Was he lost?
        - id: ch01-b82
          speaker: narrator
          text: The Doctor reached for his coat.
        - id: ch01-b83
          speaker: roberta
          text: Yes. That's exactly what he was. He told Mother the sad, sweet story of his life in French, and she asked if you'd come at once, if you were home. His cough is dreadful, and he's been crying.
        - id: ch01-b84
          speaker: narrator
          text: The Doctor smiled.
        - id: ch01-b85
          speaker: roberta
          text: Oh, please don't smile. You wouldn't if you'd seen him. I've never seen a man cry before. You don't know what it's like.
          emotion: sad
        - id: ch01-b86
          speaker: narrator
          text: Doctor Forrest immediately wished he hadn't smiled.
        - id: ch01-b87
          speaker: narrator
          text: When they reached Three Chimneys, the Russian sat in the armchair that had belonged to Father. He stretched his feet toward a bright wood fire and slowly drank the tea Mother had made for him.
        - id: ch01-b88
          speaker: doctor_forrest
          text: He's exhausted in both mind and body. That cough is bad, but there's nothing here that can't be cured. He should go straight to bed, though, and he needs a fire through the night.
        - id: ch01-b89
          speaker: mother
          text: I'll make one in my room. It's the only bedroom with a fireplace.
        - id: ch01-b90
          speaker: narrator
          text: Mother did so, and before long, the Doctor helped the stranger into bed.
        - id: ch01-b91
          speaker: narrator
          text: A large black trunk stood in Mother's room, and none of the children had ever seen it unlocked. Now, after lighting the fire, Mother opened it. She took out men's clothes and set them near the flames to warm and air. Roberta entered with another armful of wood and noticed the name sewn into a nightshirt. Her eyes moved from the marking to the open trunk. Every article she could see inside belonged to a man. The name on the nightshirt was Father's name.
        - id: ch01-b92
          speaker: narrator
          text: Father hadn't taken those clothes with him. The nightshirt was one of his new ones. Roberta remembered it being made just before Peter's birthday. Why had he left his clothes behind? She slipped out of the room. Behind her, the key turned in the trunk's lock. Her heart pounded horribly. Why hadn't Father taken his clothes?
        - id: ch01-b93
          speaker: narrator
          text: When Mother came out, Roberta threw both arms tightly around her waist and whispered.
        - id: ch01-b94
          speaker: roberta
          text: Mother... Daddy isn't dead, is he?
          emotion: fearful
        - id: ch01-b95
          speaker: mother
          text: My darling, no! What made you imagine anything so terrible?
          emotion: surprised
        - id: ch01-b96
          speaker: roberta
          text: I... I don't know.
        - id: ch01-b97
          speaker: narrator
          text: She was angry with herself, but she held to her promise not to notice anything Mother meant to keep hidden.
        - id: ch01-b98
          speaker: narrator
          text: Mother hugged her quickly.
        - id: ch01-b99
          speaker: mother
          text: Daddy was perfectly well when I last heard from him, and someday he'll come home to us. Don't let yourself imagine such dreadful things, darling.
          emotion: calm
        - id: ch01-b100
          speaker: narrator
          text: Much later, once the Russian gentleman had been made comfortable for the night, Mother came into the girls' room. Since her own bed now belonged to their guest, she would sleep in Phyllis's bed. Phyllis would spend the night on a mattress on the floor, which she considered a most entertaining adventure. The moment Mother stepped through the door, two small figures in white sat straight up in the darkness. Their two eager voices called to her together.
        - id: ch01-b101
          speakers: [roberta, phyllis]
          ensemble: duo
          text: Now tell us all about the Russian gentleman!
        - id: ch01-b102
          speaker: narrator
          text: Another white shape hopped into the room. It was Peter, trailing his quilt behind him like the tail of a white peacock.
        - id: ch01-b103
          speaker: peter
          text: We've been very patient. I had to bite my tongue to keep from falling asleep, and I almost did fall asleep, so I bit too hard. It really hurts. Please tell us, and make it a good long story.
        - id: ch01-b104
          speaker: mother
          text: I can't make it long tonight. I'm very tired.
        - id: ch01-b105
          speaker: narrator
          text: Roberta heard in Mother's voice that she had been crying. Peter and Phyllis didn't notice.
        - id: ch01-b106
          speaker: phyllis
          text: Then make it as long as you can.
        - id: ch01-b107
          speaker: narrator
          text: Roberta put her arms around Mother's waist and nestled close.
        - id: ch01-b108
          speaker: mother
          text: Well, his story is long enough to fill a whole book. He's a writer, and he's written beautiful books. In Russia, under the Czar, no one dared speak about rich people doing wrong or say what should be done to make poor people's lives better and happier. Anyone who did could be sent to prison.
        - id: ch01-b109
          speaker: peter
          text: But they can't do that! People only go to prison when they've done something wrong.
          emotion: surprised
        - id: ch01-b110
          speaker: mother
          text: Or when judges believe they've done wrong. That's how it is in England. But Russia was different. This man wrote a beautiful book about poor people and ways to help them. I've read it. The whole book is full of goodness and kindness, and they sent him to prison because of it. He spent three years alone in a horrible dungeon. It was dark, damp, and dreadful. Three years there, all by himself.
        - id: ch01-b111
          speaker: narrator
          text: Mother's voice trembled and suddenly stopped.
        - id: ch01-b112
          speaker: peter
          text: Mother, that can't be happening now. It sounds like something from a history book. The Inquisition, or something like that.
        - id: ch01-b113
          speaker: mother
          text: It did happen. Every terrible part of it is true. After prison, they sent him to Siberia. He was chained to a line of other convicts, men who had committed all kinds of crimes. They walked day after day, week after week, until he thought the walking would never end. Guards followed them with whips and beat anyone who grew tired. Some men went lame. Some fell down. If they couldn't get up and keep going, the guards beat them and left them there to die. At last, he reached the mines. His sentence was to stay there for the rest of his life, all because he wrote one good, noble, splendid book.
          emotion: sad
        - id: ch01-b114
          speaker: peter
          text: Then how did he escape?
        - id: ch01-b115
          speaker: mother
          text: When the war began, some Russian prisoners were allowed to volunteer as soldiers. He volunteered, then deserted at the first chance he had, and...
        - id: ch01-b116
          speaker: peter
          text: But isn't deserting cowardly, especially during a war?
        - id: ch01-b117
          speaker: mother
          text: Did he owe anything to a country that had treated him that way? Even if he did, he owed more to his wife and children. He had no idea what had happened to them.
        - id: ch01-b118
          speaker: roberta
          text: Oh, he had to think about them and worry about them the whole time he was in prison, too?
          emotion: sad
        - id: ch01-b119
          speaker: mother
          text: Yes. All through those years, he thought about them and suffered. As far as he knew, they might have been put in prison as well. Such things happened in Russia. But while he worked in the mines, friends managed to send him a message. His wife and children had escaped and come to England. So after he deserted, he came here to find them.
        - id: ch01-b120
          speaker: peter
          text: Did he have their address?
        - id: ch01-b121
          speaker: mother
          text: No. All he knew was England. He was trying to reach London. He thought he needed to change trains at our station, and then he discovered that his ticket and his money were gone.
        - id: ch01-b122
          speaker: phyllis
          text: Oh, do you think he'll find them? I mean his wife and children, not his ticket and money.
        - id: ch01-b123
          speaker: mother
          text: I hope so. Oh, I hope and pray that he finds his wife and children again.
          emotion: sad
        - id: ch01-b124
          speaker: narrator
          text: Even Phyllis could hear now how unsteady Mother's voice had become.
        - id: ch01-b125
          speaker: phyllis
          text: Why, Mother, you sound so very sorry for him.
        - id: ch01-b126
          speaker: narrator
          text: Mother was silent for a moment.
        - id: ch01-b127
          speaker: mother
          text: Yes.
          emotion: sad
        - id: ch01-b128
          speaker: narrator
          text: Then she seemed to be thinking, and the children waited quietly. After a while, she spoke again.
        - id: ch01-b129
          speaker: mother
          text: Dears, when you say your prayers, I think you might ask God to show His pity to all prisoners and captives.
        - id: ch01-b130
          speaker: roberta
          text: To show His pity to all prisoners and captives. Is that right, Mother?
        - id: ch01-b131
          speaker: mother
          text: Yes, that's right. To all prisoners and captives. All prisoners and captives.
