  chapters:
    - id: ch01
      title: The old gentleman.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: After Peter's adventure in the coal mine, the children thought they had better stay away from the station. But they couldn't stay away from the railway itself. In their old street, cabs and buses had rumbled past at every hour. Butchers' carts and bakers' carts might appear at any moment, and so might the carts of candlestick makers. I have never seen a candlestick maker's cart, though. Have you? Here, the countryside lay deep and still, almost as if it were sleeping. The trains were the only things that passed. They seemed like the one remaining link between the children and the old life that had once belonged to them. Day after day, their six feet went straight down the hill from Three Chimneys until they wore a path through the short, crisp grass. Soon they knew when certain trains would pass, and they gave each of them a name. The nine-fifteen up train was the Green Dragon. The ten-seven down was the Worm of Wantley. At midnight, an express sometimes woke them from their dreams with its screaming rush. Peter once climbed out of bed in the cold starlight and peered at it through the curtains. He named it the Fearsome Fly-by-night right then and there.
        - id: ch01-b02
          speaker: narrator
          text: The old gentleman traveled on the Green Dragon. He looked very nice, and he looked kind as well, which is not quite the same thing. His clean-shaven face had a healthy color. His hair was white, and both his collar and his top hat were a little different from everyone else's. Of course, the children did not notice all that at first. The first thing they noticed was his hand.
        - id: ch01-b03
          speaker: narrator
          text: One morning, they sat on the fence waiting for the Green Dragon. According to the Waterbury watch Peter had received for his last birthday, it was three and a quarter minutes late.
        - id: ch01-b04
          speaker: phyllis
          text: The Green Dragon is going wherever Father is. If it were a real, live dragon, we could stop it and ask it to carry our love to him.
        - id: ch01-b05
          speaker: peter
          text: Dragons wouldn't carry people's love. They'd think that was beneath them.
        - id: ch01-b06
          speaker: phyllis
          text: They would if you trained them properly. They'd fetch and carry like pet dogs, and eat right out of your hand. I wonder why Father never writes to us.
        - id: ch01-b07
          speaker: roberta
          text: Mother says he's been too busy. She says he'll write soon.
        - id: ch01-b08
          speaker: phyllis
          text: Let's all wave when the Green Dragon passes. If it's magic, it will understand and take our love to Father. And if it isn't, well, three waves won't cost us anything.
        - id: ch01-b09
          speaker: narrator
          text: The Green Dragon burst shrieking from the dark mouth of the tunnel. All three children stood on the railing and waved their handkerchiefs. They never stopped to wonder whether those handkerchiefs were clean. In fact, they were very much the opposite. Then a hand waved back from a first-class carriage. It was a perfectly clean hand, and it held a newspaper. It was the old gentleman's hand.
        - id: ch01-b10
          speaker: narrator
          text: From then on, exchanging waves became a morning custom for the children and the nine-fifteen. The girls especially liked to imagine that the old gentleman might know Father. Perhaps he would meet Father "in business," wherever that rather mysterious place might be. Then he could tell Father how his three children stood on a railing far away in the green countryside and sent their love to him every morning, whether the day was wet or fine.
        - id: ch01-b11
          speaker: narrator
          text: The children could go out in weather that would have kept them indoors at their old villa. They owed that freedom to Aunt Emma. The more useful her long gaiters and waterproof coats became, the more they felt they had been unfair to laugh when she bought them.
        - id: ch01-b12
          speaker: narrator
          text: Meanwhile, Mother was always busy writing. She mailed away many long blue envelopes with stories tucked inside them. In return, large envelopes of different sizes and colors arrived for her. Sometimes she opened one, gave a sigh, and spoke sadly.
        - id: ch01-b13
          speaker: mother
          text: Oh, dear. Another story has come home to roost.
          emotion: sad
        - id: ch01-b14
          speaker: narrator
          text: That always made the children sorry. But sometimes Mother waved an envelope in the air with delight.
        - id: ch01-b15
          speaker: mother
          text: Hooray! Here's an editor with some sense. He has accepted my story, and these pages prove it!
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: At first, the children thought "the proof" meant the letter the sensible editor had written. Before long, they learned that a proof was made of long slips of paper with Mother's story printed on them. And whenever an editor had enough sense to accept one of Mother's stories, the family celebrated with buns for tea.
        - id: ch01-b17
          speaker: narrator
          text: One day, the editor of the Children's Globe showed such good sense. Peter set off for the village to buy the celebration buns, and on the way he met the Station Master. By then, Peter had thought a great deal about the coal mine. He felt too uncomfortable to offer the usual good morning. A hot blush spread all the way to his ears. Perhaps the Station Master would not want to speak to someone who had stolen coal. Stolen was an ugly word, but Peter knew it was the right one. So he stared at the ground and said nothing.
        - id: ch01-b18
          speaker: station_master
          text: Good morning.
        - id: ch01-b19
          speaker: peter
          text: Good morning.
        - id: ch01-b20
          speaker: narrator
          text: As the Station Master passed, Peter wondered if the man had failed to recognize him in daylight. Maybe that was why he had been polite. The thought made Peter feel worse. Before he quite knew what he was doing, he ran after him. His boots crunched quickly over the road. The Station Master stopped, and Peter caught up, breathless, with ears now a deep red.
        - id: ch01-b21
          speaker: peter
          text: I don't want you being polite to me because you don't recognize me.
        - id: ch01-b22
          speaker: station_master
          text: What?
        - id: ch01-b23
          speaker: peter
          text: When you said good morning, I thought maybe you didn't know I was the boy who took the coal. But I am. And I'm sorry. That's all.
        - id: ch01-b24
          speaker: station_master
          text: Why, I wasn't thinking about those wretched coals at all. What's done is done. Now, where are you rushing off to?
        - id: ch01-b25
          speaker: peter
          text: I'm going to buy buns for tea.
        - id: ch01-b26
          speaker: station_master
          text: I thought your family was terribly poor.
        - id: ch01-b27
          speaker: peter
          text: We are. But whenever Mother sells a story or a poem or something, we spend three pennies in halfpennies on tea.
        - id: ch01-b28
          speaker: station_master
          text: So your mother writes stories, does she?
        - id: ch01-b29
          speaker: peter
          text: The most beautiful stories you've ever read.
        - id: ch01-b30
          speaker: station_master
          text: You must be very proud of such a clever mother.
        - id: ch01-b31
          speaker: peter
          text: I am. But before she had to be so clever, she had more time to play with us.
        - id: ch01-b32
          speaker: station_master
          text: Well, I must get on. Come visit us at the station whenever you like. And about that coal business, let's just say it's something we never mention. Agreed?
        - id: ch01-b33
          speaker: peter
          text: Thank you. I'm very glad everything is settled between us.
        - id: ch01-b34
          speaker: narrator
          text: Peter crossed the canal bridge and went on to the village for the buns. His mind felt easier than it had since the night when the Station Master's hand closed around his collar among the coal.
        - id: ch01-b35
          speaker: narrator
          text: The next morning, all three children sent their wave to Father by the Green Dragon, and the old gentleman waved back as usual. Then Peter proudly led the way toward the station.
        - id: ch01-b36
          speaker: roberta
          text: But are we sure we ought to go?
        - id: ch01-b37
          speaker: phyllis
          text: She means after what happened with the coal.
        - id: ch01-b38
          speaker: peter
          text: I met the Station Master yesterday. He especially invited us to come down whenever we wanted.
        - id: ch01-b39
          speaker: narrator
          text: Peter pretended not to hear Phyllis. She asked again about the coal, then stopped because her bootlace had come undone.
        - id: ch01-b40
          speaker: peter
          text: Your bootlace is always coming undone. And the Station Master was more of a gentleman than you'll ever be, Phil. You threw coal at a fellow's head.
        - id: ch01-b41
          speaker: narrator
          text: Phyllis tied her lace and walked on without speaking. Her shoulders began to shake. Soon one fat tear rolled from her nose and splashed on the shining rail. Bobbie saw it, stopped, and put an arm around her.
        - id: ch01-b42
          speaker: roberta
          text: What's wrong, darling?
        - id: ch01-b43
          speaker: phyllis
          text: He called me un-un-ungentlemanly! I never called him unladylike, not even when he tied my Clorinda doll to the firewood and burned her at the stake like a martyr!
          emotion: sad
        - id: ch01-b44
          speaker: narrator
          text: Peter really had committed that outrage a year or two earlier.
        - id: ch01-b45
          speaker: roberta
          text: Well, you did start it by bringing up the coal. Why don't you both take back everything you've said since we waved to the train? Then honor will be satisfied.
        - id: ch01-b46
          speaker: phyllis
          text: I will if Peter will.
          emotion: sad
        - id: ch01-b47
          speaker: peter
          text: All right. Honor is satisfied. Here, Phil, use my handkerchief if you've lost yours again. Honestly, what do you do with them all?
        - id: ch01-b48
          speaker: phyllis
          text: You took my last one to tie the rabbit-hutch door. You're the ungrateful one. The poetry book says it's sharper than a serpent to have a toothless child. "Toothless" means ungrateful. Miss Lowe told me.
        - id: ch01-b49
          speaker: peter
          text: Fine. I'm sorry. There! Can we please go now?
        - id: ch01-b50
          speaker: narrator
          text: At the station, they spent two joyful hours with the Porter. He was a good man who never seemed to tire of questions beginning with why. Plenty of people with grander positions grew tired of them much sooner. He taught the children all sorts of things. The hooks joining the cars were called couplings. The great snake-like pipes hanging above them were there to stop the train.
        - id: ch01-b51
          speaker: porter
          text: If you could grab one of those pipes while the train was moving and pull it apart, she'd stop dead with a jerk.
        - id: ch01-b52
          speaker: phyllis
          text: Who's she?
        - id: ch01-b53
          speaker: porter
          text: The train, of course.
        - id: ch01-b54
          speaker: narrator
          text: After that, the train was never "it" to the children again.
        - id: ch01-b55
          speaker: porter
          text: You know the handle inside the cars, the one with the warning about a five-pound fine for improper use? If you used it improperly, the train would stop.
        - id: ch01-b56
          speaker: roberta
          text: What if you used it properly?
        - id: ch01-b57
          speaker: porter
          text: I suppose she'd stop just the same. But it isn't proper unless someone's murdering you. There was an old lady once who was tricked into thinking it rang for the refreshment room. She pulled it because she was hungry, though her life wasn't in danger. The guard hurried over expecting to find someone breathing their last, and she said, "Please, sir, bring me a glass of stout and a bath bun." The train was already seven minutes late.
        - id: ch01-b58
          speaker: peter
          text: What did the guard say to her?
        - id: ch01-b59
          speaker: porter
          text: I don't know. But whatever he said, I'll bet she remembered it.
        - id: ch01-b60
          speaker: narrator
          text: With such delightful talk, the time went much too fast. Once or twice, the Station Master came out from the sacred inner room behind the little opening where passengers bought tickets. He was as friendly and cheerful as could be with all three children.
        - id: ch01-b61
          speaker: phyllis
          text: It's just as if coal had never been discovered.
        - id: ch01-b62
          speaker: narrator
          text: The Station Master gave each child an orange. He also promised that, on a day when he was not so busy, he would take them up into the signal box.
        - id: ch01-b63
          speaker: narrator
          text: Several trains passed through the station. For the first time, Peter noticed that engines had numbers, just like cabs.
        - id: ch01-b64
          speaker: porter
          text: I once knew a young gentleman who wrote down the number of every engine he saw. He kept them in a green notebook with silver corners. His father did very well in the wholesale stationery business, you see.
        - id: ch01-b65
          speaker: narrator
          text: Peter saw no reason why he could not collect engine numbers too, even if his father was not a wholesale stationer. He did not happen to own a green leather notebook with silver corners, so the Porter gave him a yellow envelope instead. On it, Peter carefully wrote 379 and then 663. Just those two numbers made him feel that a most fascinating collection had begun.
        - id: ch01-b66
          speaker: narrator
          text: At tea that night, Peter asked whether Mother owned a green leather notebook with silver corners. She did not, but when she heard why he wanted one, she gave him a small black notebook instead.
        - id: ch01-b67
          speaker: mother
          text: A few pages have been torn out, but there's room for plenty of numbers. When you fill it, I'll give you another. I'm so glad you enjoy the railway. Just promise me you won't walk on the tracks.
        - id: ch01-b68
          speaker: narrator
          text: The children exchanged hopeless looks. After a gloomy pause, Peter tried one more question.
        - id: ch01-b69
          speaker: peter
          text: Not even if we face the direction the train will come from?
        - id: ch01-b70
          speaker: mother
          text: No. Truly, you mustn't.
        - id: ch01-b71
          speaker: phyllis
          text: Mother, didn't you ever walk on railway tracks when you were little?
        - id: ch01-b72
          speaker: narrator
          text: Mother was honest and honorable. She had to tell the truth.
        - id: ch01-b73
          speaker: mother
          text: Yes, I did.
        - id: ch01-b74
          speaker: phyllis
          text: Well, then.
        - id: ch01-b75
          speaker: mother
          text: But, darlings, you don't know how much I love you. What would I do if any of you got hurt?
        - id: ch01-b76
          speaker: phyllis
          text: Do you love us more than Granny loved you when you were little?
        - id: ch01-b77
          speaker: narrator
          text: Bobbie made signs to Phyllis, trying to stop her. But Phyllis never noticed signs, no matter how plain they were. Mother did not answer for a full minute. Then she stood up and busied herself pouring more water into the teapot.
        - id: ch01-b78
          speaker: mother
          text: No one ever loved anyone more than my mother loved me.
          emotion: sad
        - id: ch01-b79
          speaker: narrator
          text: Mother fell silent again. Bobbie kicked Phyllis hard under the table because she understood a little of what Mother was remembering. Once, Mother herself had been a small girl, and she had been the whole world to her own mother. When trouble comes, it feels easy and natural to run to Mother. People do not stop wanting to do that simply because they have grown up. Bobbie could imagine, just a little, what it must feel like to be sad and have no mother to run to anymore.
        - id: ch01-b80
          speaker: phyllis
          text: Bob, why are you kicking me like that?
        - id: ch01-b81
          speaker: narrator
          text: Mother gave a little laugh, then sighed.
        - id: ch01-b82
          speaker: mother
          text: Very well. But I must be sure you know which direction the trains come from. And don't walk on the tracks near the tunnel or around bends.
        - id: ch01-b83
          speaker: peter
          text: Trains keep left, like carriages. So if we walk on the right, we'll be sure to see them coming.
        - id: ch01-b84
          speaker: mother
          text: Very well.
        - id: ch01-b85
          speaker: narrator
          text: You may think Mother should not have agreed to such a thing. But she remembered the days when she had been a little girl herself, and so she did agree. Her own children could never understand exactly what it cost her to say those words. Neither could you, nor any other child in the world. Still, a few children who were a little like Bobbie might understand the smallest part of it.
        - id: ch01-b86
          speaker: narrator
          text: The very next day, Mother had to stay in bed. Her head ached badly. Her hands were burning hot, her throat was sore, and she would not eat.
        - id: ch01-b87
          speaker: mrs_viney
          text: If I were you, ma'am, I'd send for the doctor. There are plenty of catching illnesses going around. My sister's oldest girl caught a chill two Christmases ago, and it went inside her. She's never been the same since.
        - id: ch01-b88
          speaker: narrator
          text: At first, Mother would not hear of sending for anyone. By evening, though, she felt so much worse that Peter was sent to a house in the village. Three laburnum trees stood beside the gate, and a brass plate fixed to that gate read, "W. W. Forrest, M.D."
        - id: ch01-b89
          speaker: narrator
          text: Doctor Forrest came at once. On the walk back, he talked with Peter. He seemed both charming and sensible, especially because he cared about railways, rabbits, and other truly important subjects. After examining Mother, he said she had influenza. Then he spoke to Bobbie in the hall.
        - id: ch01-b90
          speaker: doctor_forrest
          text: Well, Lady Grave-airs, I suppose you plan to be the head nurse.
        - id: ch01-b91
          speaker: roberta
          text: Of course I do.
        - id: ch01-b92
          speaker: doctor_forrest
          text: Then I'll send medicine. Keep a strong fire going. Have some rich beef tea ready for when her fever falls. For now, she may have grapes, beef essence, soda water, and milk. You should also buy a bottle of the best brandy. Cheap brandy is worse than poison.
        - id: ch01-b93
          speaker: narrator
          text: Bobbie asked him to write everything down, and he did. When she showed Mother the list, Mother laughed. Bobbie decided it really was a laugh, although it sounded weak and strange. Mother's eyes shone as brightly as beads.
        - id: ch01-b94
          speaker: mother
          text: What nonsense. We can't afford all that. Ask Mrs. Viney to boil two pounds of the scrag end of a neck for your dinner tomorrow. I can drink some of the broth. Yes, love, I'd like more water now. And please bring a basin and sponge my hands.
        - id: ch01-b95
          speaker: narrator
          text: Bobbie did as Mother asked. When she had made Mother as comfortable as she could, she went downstairs to Peter and Phyllis. Her cheeks were red, her lips were pressed tight, and her eyes were almost as bright as Mother's. She repeated everything the doctor and Mother had said.
        - id: ch01-b96
          speaker: roberta
          text: There's nobody but us to do anything, so we have to do it. I have the shilling for the mutton.
        - id: ch01-b97
          speaker: peter
          text: We can go without the horrible mutton. Bread and butter will keep us alive. People on desert islands have lived on much less.
        - id: ch01-b98
          speaker: roberta
          text: Of course we can.
        - id: ch01-b99
          speaker: narrator
          text: They sent Mrs. Viney to the village with the shilling. She was to buy as much brandy, soda water, and beef tea as the money would cover.
        - id: ch01-b100
          speaker: phyllis
          text: Even if we never eat anything at all, our dinner money won't buy everything else on the doctor's list.
        - id: ch01-b101
          speaker: roberta
          text: No, it won't. We need another way. Everyone think as hard as you possibly can.
        - id: ch01-b102
          speaker: narrator
          text: They all thought as hard as they could. After a while, they began to talk. Later, Bobbie went upstairs to sit beside Mother in case she needed anything. Downstairs, Peter and Phyllis became very busy. They gathered scissors, a white sheet, a paintbrush, and the pot of Brunswick black that Mrs. Viney used on the grates and fenders. Their first sheet did not turn out as they hoped, so they took another from the linen cupboard and tried again. It never occurred to them that they were ruining good sheets and that sheets cost good money. They knew only that they were making something good and necessary. What they were making will come in a moment.
        - id: ch01-b103
          speaker: narrator
          text: Bobbie's bed had been moved into Mother's room. Several times during the night, she climbed out to mend the fire or give Mother milk and soda water. Mother talked to herself a great deal, though her words did not seem to mean anything. Once she woke with a sudden start and cried out.
        - id: ch01-b104
          speaker: mother
          text: Mamma! Mamma!
          emotion: fearful
        - id: ch01-b105
          speaker: narrator
          text: Bobbie knew Mother was calling for Granny. In her fever, Mother had forgotten that calling could do no good, because Granny was dead.
        - id: ch01-b106
          speaker: narrator
          text: Early in the morning, Bobbie heard her name. She jumped from bed and hurried to Mother's side.
        - id: ch01-b107
          speaker: mother
          text: Oh, yes. I think I was asleep. My poor little duck, you'll be so tired. I hate making all this trouble for you.
        - id: ch01-b108
          speaker: roberta
          text: Trouble?
        - id: ch01-b109
          speaker: mother
          text: Oh, don't cry, sweetheart. I'll be well again in a day or two.
          emotion: calm
        - id: ch01-b110
          speaker: narrator
          text: Bobbie said yes and tried to smile. She was used to ten solid hours of sleep. Getting up three or four times during the night made her feel as if she had never slept at all. Her thoughts were foggy, and her eyes felt sore and stiff. Even so, she tidied the room and put everything neatly in place before the doctor arrived at half past eight.
        - id: ch01-b111
          speaker: doctor_forrest
          text: Is everything going well, little nurse? Did you get the brandy?
        - id: ch01-b112
          speaker: roberta
          text: Yes. It's in a small, flat bottle.
        - id: ch01-b113
          speaker: doctor_forrest
          text: I didn't see any grapes or beef tea.
        - id: ch01-b114
          speaker: roberta
          text: No, but you will tomorrow. There's beef stewing in the oven for the tea.
        - id: ch01-b115
          speaker: doctor_forrest
          text: Who taught you how to do that?
        - id: ch01-b116
          speaker: roberta
          text: I watched Mother make it when Phil had the mumps.
        - id: ch01-b117
          speaker: doctor_forrest
          text: Good. Now have your older woman sit with Mother. You must eat a proper breakfast, then go straight to bed and sleep until dinner. We can't let the head nurse get sick too.
        - id: ch01-b118
          speaker: narrator
          text: He really was a very nice doctor.
        - id: ch01-b119
          speaker: narrator
          text: When the nine-fifteen came out of the tunnel that morning, the old gentleman lowered his newspaper and prepared to wave to the three children on the fence. But only Peter was there. He was not standing on the railing, either. He stood in front of it like a showman pointing out animals in a menagerie, or like a kindly clergyman using a wand to explain pictures of Palestine during a magic-lantern show.
        - id: ch01-b120
          speaker: narrator
          text: Peter pointed to a large white sheet nailed across the fence. Black letters more than a foot high covered it. Some had run because Phyllis had spread the blacking too eagerly, but everyone could read the words. They said, "Look out at the station."
        - id: ch01-b121
          speaker: narrator
          text: Many passengers did look out when the train reached the station. They were disappointed, because there seemed to be nothing unusual to see. The old gentleman looked out too. At first, he saw only the gravel platform in the sunshine and the wallflowers and forget-me-nots in the station flower beds. Then, just as the train began to puff and pull itself together for the journey onward, he saw Phyllis. She came running toward him, quite out of breath.
        - id: ch01-b122
          speaker: phyllis
          text: Oh, I thought I'd missed you! My bootlaces kept coming undone, and I tripped over them twice. Here, take this.
        - id: ch01-b123
          speaker: narrator
          text: As the train moved, she pushed a warm, slightly damp letter into his hand. The old gentleman leaned back in his corner and opened it.
        - id: ch01-b124
          speaker: old_gentleman
          text: Dear Sir, because we don't know your name. Mother is sick. The doctor says she needs the things listed at the end of this letter, but Mother says she can't afford them. She says we should buy mutton for ourselves, and she can have the broth. We don't know anyone here except you. Father is away, and we don't know his address. Father will repay you. If he has lost all his money or something, Peter will pay you when he grows up. We promise on our honor. This is our I.O.U. for everything Mother needs. Signed Peter, Roberta, Phyllis, and Peter. Please give the parcel to the Station Master, because we don't know which train you take home. Tell him it is for Peter, the boy who was sorry about the coal. Then he will understand.
        - id: ch01-b125
          speaker: narrator
          text: After the three names came the doctor's list. The old gentleman read the letter once, and his eyebrows rose. He read it a second time and smiled a little. After a third reading, he put it into his pocket and went back to The Times.
        - id: ch01-b126
          speaker: narrator
          text: At about six that evening, someone knocked at the back door. All three children ran to open it. Outside stood the friendly Porter who had taught them so many interesting things about the railway. He set a large hamper down on the kitchen floor.
        - id: ch01-b127
          speaker: porter
          text: It's from the old gentleman. He asked me to bring it up at once.
        - id: ch01-b128
          speaker: peter
          text: Thank you very much. I'm terribly sorry I don't have two pennies to give you the way Father does, but—
        - id: ch01-b129
          speaker: porter
          text: Now, stop that, please. I wasn't thinking of pennies. I wanted to say I'm sorry your mother is unwell and ask how she's feeling tonight. I brought her a little sweetbrier, too. It smells lovely. Two pennies, indeed!
        - id: ch01-b130
          speaker: narrator
          text: He pulled a bunch of sweetbrier from his hat. Later, Phyllis said he had done it just like a magician.
        - id: ch01-b131
          speaker: peter
          text: Thank you very much. And I'm sorry I mentioned the two pennies.
        - id: ch01-b132
          speaker: porter
          text: No offense taken.
        - id: ch01-b133
          speaker: narrator
          text: That was not quite true, but it was polite. Then the Porter left.
        - id: ch01-b134
          speaker: narrator
          text: The children began to unpack the hamper. First they lifted out straw, and beneath that they found a layer of fine wood shavings. Then came all the things they had asked for, with plenty of every one. There were many things they had never requested as well. They found peaches, port wine, two chickens, a cardboard box of large red roses on long stems, a tall, slender green bottle of lavender water, and three shorter, rounder bottles of eau de Cologne. Tucked among it all was a letter.
        - id: ch01-b135
          speaker: old_gentleman
          text: Dear Roberta, Phyllis, and Peter. Here are the things you need. Your mother will want to know who sent them. Tell her they came from a friend who heard that she was ill. Once she is well, you must tell her the whole story, of course. If she says you should not have asked, tell her I believe you did exactly the right thing. I hope she will forgive me for taking the liberty of giving myself such a great pleasure.
        - id: ch01-b136
          speaker: narrator
          text: At the bottom, the letter was signed with the initials G. P. followed by something else the children could not make out at all.
        - id: ch01-b137
          speaker: phyllis
          text: I think we really did do the right thing.
        - id: ch01-b138
          speaker: roberta
          text: Think? Of course we did.
        - id: ch01-b139
          speaker: peter
          text: Even so, I'm not exactly looking forward to telling Mother the whole truth.
        - id: ch01-b140
          speaker: roberta
          text: We don't have to tell her until she's well. Once she's well, we'll be so happy that a little fuss won't matter. Oh, look at the roses! I must take them upstairs to her.
        - id: ch01-b141
          speaker: phyllis
          text: And the sweetbrier. Don't forget that.
        - id: ch01-b142
          speaker: narrator
          text: Phyllis breathed in its scent with a loud sniff.
        - id: ch01-b143
          speaker: roberta
          text: As if I would forget! Mother told me just the other day that a thick sweetbrier hedge grew at her mother's house when she was a little girl.
