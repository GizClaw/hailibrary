audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，含蓄地带一点幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    roberta:
      display_name: 罗伯塔
      tts:
        delivery: 敏感体贴，认真而克制
        timbre: 清亮柔和的少女声
        pace: 自然，情急时稍快
        pitch: 中高音
    peter:
      display_name: 彼得
      tts:
        delivery: 直率好强，活泼中带孩子气的逞强
        timbre: 明亮的男孩声
        pace: 利落，激动时加快
        pitch: 中高音
    phyllis:
      display_name: 菲莉丝
      tts:
        delivery: 天真坦率，好心又略显冒失
        timbre: 轻快稚嫩的女孩声
        pace: 轻快自然
        pitch: 高音
    mother:
      display_name: 妈妈
      tts:
        delivery: 慈爱温柔，困顿时仍努力镇定
        timbre: 温润清晰的成年女声
        pace: 从容舒缓
        pitch: 中音
    porter:
      display_name: 搬运工
      tts:
        delivery: 爽快随和，带一点逗孩子的口气
        timbre: 朴实明亮的成年男声
        pace: 不紧不慢
        pitch: 中低音
    station_master:
      display_name: 站长
      tts:
        delivery: 威严干练，严厉中不失宽厚
        timbre: 浑厚清晰的成年男声
        pace: 稳健有力
        pitch: 中低音
    mrs_viney:
      display_name: 维尼太太
      tts:
        delivery: 热心直爽，说起见闻来滔滔不绝
        timbre: 朴实略粗的成年女声
        pace: 自然偏快
        pitch: 中音
    doctor:
      display_name: 福雷斯特医生
      tts:
        delivery: 亲切爽朗，问诊时明快可靠
        timbre: 清晰温和的成年男声
        pace: 稳健自然
        pitch: 中低音
  chapters:
    - id: ch01
      title: 绿龙上的老先生
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得闹过煤矿那场风波以后，孩子们觉得，车站还是少去为好。可他们并没有离铁路远一点，也实在离不开它。从前住的街上，出租马车、公共马车，还有卖肉、卖面包和做烛台的车，日夜都可能轰隆隆经过。如今乡间安静得像睡着了，来来往往的只剩火车。铁路成了唯一的一根线，还把他们和从前的生活牵在一起。
        - id: ch01-b02
          speaker: narrator
          text: 三烟囱门前的山坡上，六只小脚每天来回走，终于在短短的脆草间踩出一条直通坡下的小径。他们摸清了几班火车的时刻，还给每一班取了名字。上午九点一刻的上行车叫绿龙，十点零七分的下行车叫旺特利巨虫。午夜开往城里的特快列车，总会尖啸着把他们惊醒，所以叫可怕的夜行飞怪。这个名字是彼得取的。有一晚，他从寒冷的星光里爬起来，隔着窗帘缝看见了它。
        - id: ch01-b03
          speaker: narrator
          text: 那位老先生坐的正是绿龙。他长得十分和气，看起来脾气也好。不过，长得和气跟脾气好，可不是一回事。他脸色红润，刮得干干净净，头发雪白，衣领和高顶礼帽的样式都有点特别。当然，孩子们一开始什么都没看清。他们最先留意到的，其实只有他的一只手。
        - id: ch01-b04
          speaker: narrator
          text: 那天早晨，三个孩子坐在栅栏上等绿龙。照彼得生日时收到的那块沃特伯里表看，火车晚了三分一刻钟。
        - id: ch01-b05
          speaker: phyllis
          text: 绿龙会去爸爸待的地方。要是它真是一条龙，我们就能拦住它，请它把我们的爱带给爸爸。
        - id: ch01-b06
          speaker: peter
          text: 龙才不会替人送爱呢。它们根本不肯干这种事。
        - id: ch01-b07
          speaker: phyllis
          text: 驯服以后就肯了呀。它们会像家养的小猎犬，替人叼东西、送东西，还会到你手里吃东西呢。爸爸怎么一直没给我们写信？
        - id: ch01-b08
          speaker: roberta
          text: 妈妈说，爸爸忙得很。不过她也说，他很快就会来信了。
        - id: ch01-b09
          speaker: phyllis
          text: 那绿龙经过的时候，我们一起挥手吧。它要是魔法龙，就会明白，要把我们的爱捎给爸爸。它要不是，挥三下手也没什么损失。
        - id: ch01-b10
          speaker: narrator
          text: 绿龙尖叫一声，从黑暗的巢穴里冲了出来。那个巢穴，其实就是隧道。三个孩子全站到栏杆上，使劲挥起手帕，谁也没想起手帕干不干净。其实，那几块手帕一点也不干净。
        - id: ch01-b11
          speaker: narrator
          text: 头等车厢里也有一只手挥了起来。那只手倒是十分干净，手里还握着一份报纸。它正是老先生的手。从那以后，孩子们每天都会向九点一刻的火车挥手，老先生也天天挥手回答。
        - id: ch01-b12
          speaker: narrator
          text: 孩子们，尤其是两个女孩，总爱想象老先生也许认识爸爸，会在那个神秘的“办事”地方碰见他。他还会告诉爸爸，在遥远的碧绿乡间，三个孩子无论晴雨，每天早晨都站在栏杆上，把满满的爱朝他挥出去。
        - id: ch01-b13
          speaker: narrator
          text: 现在不论什么天气，孩子们都能出门。从前住在别墅时，大人绝不会答应。这还得感谢艾玛姨妈。她买的长绑腿和防水外套实在好用，孩子们也越来越觉得，以前那样取笑这位不讨人喜欢的姨妈，确实不太公平。
        - id: ch01-b14
          speaker: narrator
          text: 这些日子，妈妈总在忙着写作。她常把装着故事的蓝色长信封寄出去，也常收到大大小小、颜色不同的信封。有时，她拆开信，会叹一口气。
        - id: ch01-b15
          speaker: mother
          text: 又有一个故事自己回窝了。唉，唉！
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: 孩子们一听，就替她难过。可有时候，妈妈会把信封举起来，在空中挥舞。
        - id: ch01-b17
          speaker: mother
          text: 万岁，万岁！终于碰到一位明白事理的编辑啦。他肯收下我的故事。这些就是校样。
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: 起先孩子们还以为，“校样”是那位明白事理的编辑写来的信。后来才知道，那其实是一条条印着故事的长纸页。每当有编辑明白事理，下午茶时就会多出小圆面包。
    - id: ch02
      title: 彼得和站长说开了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 有一天，《儿童世界报》的编辑恰好明白事理，彼得便下村买小圆面包庆祝。走到半路，他迎面碰见了站长。
        - id: ch02-b02
          speaker: narrator
          text: 彼得早已把煤矿的事想过许多遍，这时浑身不自在。荒僻路上遇到人，本该说声早安，可他不愿先开口。他耳朵一阵发热，觉得站长也许不愿理一个偷过煤的人。“偷”这个字太难听了，可彼得认为，自己做的正是这件事。他低着头，默不作声。
        - id: ch02-b03
          speaker: station_master
          text: 早安。
        - id: ch02-b04
          speaker: peter
          text: 早安。
        - id: ch02-b05
          speaker: narrator
          text: 站长从他身旁走了过去。彼得心想，也许站长在白天没认出自己，不然才不会这么客气。这个念头叫他难受极了。还没想清楚，他已经转身追上去。站长听见他的靴子把路面踩得嘎吱直响，便停下来。彼得跑到跟前，喘个不停，两只耳朵已经红得发紫。
        - id: ch02-b06
          speaker: peter
          text: 要是您没认出我，我就不愿意让您这样客气。
        - id: ch02-b07
          speaker: station_master
          text: 啊？
        - id: ch02-b08
          speaker: peter
          text: 您刚才说早安的时候，我想，您也许不知道拿煤的人就是我。可那个人确实是我。我很抱歉。我要说的就是这些。
        - id: ch02-b09
          speaker: station_master
          text: 嗐，我根本没在想那些宝贝煤。过去就过去了。你跑得这么急，是要去哪里？
        - id: ch02-b10
          speaker: peter
          text: 我去买下午茶的小圆面包。
        - id: ch02-b11
          speaker: station_master
          text: 我还以为你们家很穷呢。
        - id: ch02-b12
          speaker: peter
          text: 我们是真的穷。不过妈妈只要卖掉一篇故事，或者一首诗，再或者别的什么，我们就会拿三便士买六个半便士的小圆面包，留到下午茶吃。
        - id: ch02-b13
          speaker: station_master
          text: 原来你妈妈还会写故事？
        - id: ch02-b14
          speaker: peter
          text: 她写的故事，比您这辈子读过的所有故事都好看。
        - id: ch02-b15
          speaker: station_master
          text: 有这么聪明的妈妈，你一定很骄傲。
        - id: ch02-b16
          speaker: peter
          text: 当然骄傲。可是以前她不用这样聪明的时候，能陪我们玩得更多。
        - id: ch02-b17
          speaker: station_master
          text: 好啦，我得走了。以后你们想来车站看看，随时都可以来。至于煤这个字……对了，我们从来不提它，是不是？
        - id: ch02-b18
          speaker: peter
          text: 谢谢您。我们终于把话说清楚了，我真高兴。
          emotion: happy
        - id: ch02-b19
          speaker: narrator
          text: 彼得走过运河桥，继续进村买面包。从煤堆间被站长一把抓住衣领以后，他从没有像现在这样轻松过。
        - id: ch02-b20
          speaker: narrator
          text: 第二天，三个孩子照常向绿龙挥手，请它给爸爸送去三份问候。老先生也照常挥手回答。随后，彼得得意地走在最前面，领着姐妹俩往车站去。
        - id: ch02-b21
          speaker: roberta
          text: 我们真的该去吗？
        - id: ch02-b22
          speaker: phyllis
          text: 博比说的是煤那件事。
        - id: ch02-b23
          speaker: peter
          text: 我昨天碰见站长了。他特意请我们过去，还说什么时候去都行。
        - id: ch02-b24
          speaker: phyllis
          text: 是煤那件事以后请的吗？等一等，我的鞋带又开了。
        - id: ch02-b25
          speaker: peter
          text: 你的鞋带怎么永远都在开？菲尔，站长比你有教养多了，他可不会拿煤块往别人脑袋上砸。
        - id: ch02-b26
          speaker: narrator
          text: 菲莉丝系好鞋带，没再说话。可她的肩膀一直发抖。不一会儿，一颗圆圆的眼泪从鼻尖落下来，啪的一声掉在铁轨上。博比看见了，停下来搂住她。
        - id: ch02-b27
          speaker: roberta
          text: 哎呀，亲爱的，你怎么了？
        - id: ch02-b28
          speaker: phyllis
          text: 他骂我没、没、没教养。可我从来没骂过他不像绅士。就连他把我的克洛琳达绑在柴捆上，当殉道者活活烧死的时候，我都没骂过。
          emotion: sad
        - id: ch02-b29
          speaker: narrator
          text: 一两年前，彼得的确干过这件残忍的事。
        - id: ch02-b30
          speaker: roberta
          text: 可是你先提煤的，也是你先开始的。你们两个把挥手以后说过的话全都收回去，好让名誉得到满足，不就行了吗？
        - id: ch02-b31
          speaker: phyllis
          text: 只要彼得肯，我就肯。
        - id: ch02-b32
          speaker: peter
          text: 好吧，名誉已经满足了。喏，菲尔，看在老天的分上，用我的手帕吧。你自己的准是又丢了。我真不知道，你那些手帕都去了哪里。
        - id: ch02-b33
          speaker: phyllis
          text: 我最后一块手帕，是你拿去绑兔笼门了。你还好意思这么忘恩负义！诗集说得一点不错，养个没牙的孩子，比让蛇牙咬了还痛。书里的“没牙”，其实就是“忘恩负义”。洛小姐教过我的。
          emotion: angry
        - id: ch02-b34
          speaker: peter
          text: 好吧，对不起。这样总行了吧？现在可以继续走了吗？
    - id: ch03
      title: 车站里的新学问
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 到了车站以后，三个孩子快快活活地跟搬运工待了两个钟头。搬运工是个厚道人。不管他们问多少个“为什么”，他好像永远也不会厌烦。许多身份远比他高的人，可没有这样的耐心。
        - id: ch03-b02
          speaker: narrator
          text: 他告诉孩子们许多从前不知道的事。原来挂住车厢的东西叫车钩，车钩上方那根像大蛇的管子，是用来刹住火车的。
        - id: ch03-b03
          speaker: porter
          text: 火车开着的时候，你要是能抓住那根管子，把它扯开，她就会猛地停住，一点也不往前走了。
        - id: ch03-b04
          speaker: phyllis
          text: 你说的“她”是谁呀？
        - id: ch03-b05
          speaker: porter
          text: 当然是火车啦。
        - id: ch03-b06
          speaker: narrator
          text: 从这一刻起，孩子们再也不把火车叫作“它”了。
        - id: ch03-b07
          speaker: porter
          text: 车厢里还有一样东西，你们总见过吧？上面写着“使用不当，罚款五英镑”。你要是不当地使用它，火车也会停。
        - id: ch03-b08
          speaker: roberta
          text: 那要是用得很恰当呢？
        - id: ch03-b09
          speaker: porter
          text: 我想，她还是会停。不过，除非有人正要杀你，不然就不算用得恰当。以前有个老太太，别人哄她说，那东西是餐车的铃。她没有性命危险，只不过肚子饿了，就把它用了。火车一停，列车员赶来，还以为会看见谁满身是血，正要咽下最后一口气。可老太太只对他说：“劳驾，先生，给我一杯黑啤酒，再来一个巴斯小圆面包。”那趟车本来已经晚点，又叫她耽误了七分钟。
        - id: ch03-b10
          speaker: phyllis
          text: 那列车员对她说了什么？
        - id: ch03-b11
          speaker: porter
          text: 这个我可不知道。不过，不管他说了什么，我敢说，那位老太太一时半会儿都忘不了。
        - id: ch03-b12
          speaker: narrator
          text: 这样有意思的话一说起来，时间过得飞快。站长有一两次从售票小窗口后面那间神圣的内室走出来，对三个孩子都又亲热又快活。
        - id: ch03-b13
          speaker: phyllis
          text: 简直像这世上从来没有人发现过煤一样。
        - id: ch03-b14
          speaker: narrator
          text: 菲莉丝悄悄对姐姐说。站长还给了他们每人一个橙子，又答应等哪天不太忙，就带他们去看信号房。
        - id: ch03-b15
          speaker: narrator
          text: 几班火车从车站经过。彼得这才头一回注意到，机车跟出租马车一样，身上也有号码。
        - id: ch03-b16
          speaker: porter
          text: 没错。我以前认识一位小少爷，每辆机车的号码他都记得。他有一本绿皮笔记本，四个角都包着银。谁叫他父亲做批发文具生意，家里有的是钱呢。
        - id: ch03-b17
          speaker: narrator
          text: 彼得觉得，就算自己的父亲不做批发文具生意，他一样可以抄号码。只是他手边没有四角包银的绿皮笔记本。搬运工便给了他一个黄信封，他在上面写下三七九和六六三。彼得认定，这会是一套非常有趣的收藏的开头。
    - id: ch04
      title: 铁轨上的约定
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 那天下午喝茶时，彼得问妈妈，有没有一本四角包银的绿皮笔记本。妈妈没有。不过听完他的用途，她拿出了一本黑色的小本子。
        - id: ch04-b02
          speaker: mother
          text: 里面有几页已经撕掉了，不过还能记不少号码。等你写满，我再给你一本。你喜欢铁路，我很高兴。只是千万不能走到铁轨上去。
        - id: ch04-b03
          speaker: peter
          text: 就算我们迎着火车来的方向走，也不可以吗？
        - id: ch04-b04
          speaker: narrator
          text: 在这句话以前，三个孩子已经沉默了一阵，还绝望地互相递着眼色。
        - id: ch04-b05
          speaker: mother
          text: 不可以，真的不行。
        - id: ch04-b06
          speaker: phyllis
          text: 妈妈，那你小时候从来没有在铁轨上走过吗？
        - id: ch04-b07
          speaker: narrator
          text: 妈妈一向诚实，也很看重名誉，只好说实话。
        - id: ch04-b08
          speaker: mother
          text: 走过。
        - id: ch04-b09
          speaker: phyllis
          text: 那么……
        - id: ch04-b10
          speaker: mother
          text: 可是，亲爱的孩子们，你们不知道我有多爱你们。要是你们受了伤，我该怎么办呢？
        - id: ch04-b11
          speaker: phyllis
          text: 你爱我们，会比外婆在你小时候爱你还要多吗？
        - id: ch04-b12
          speaker: narrator
          text: 博比拼命给菲莉丝使眼色，叫她别再说了。可菲莉丝从来看不懂眼色，不管那眼色多么明显。妈妈过了一会儿才站起来，往茶壶里添了些水。
        - id: ch04-b13
          speaker: mother
          text: 这世上，不会再有谁比我妈妈爱我更深地爱过一个人。
          emotion: sad
        - id: ch04-b14
          speaker: narrator
          text: 说完，妈妈又不出声了。博比在桌子下面狠狠踢了菲莉丝一脚。她多少明白，是什么念头让妈妈忽然这么安静。妈妈也当过小女孩，也曾经是她妈妈的整个世界。遇上难事就跑去找妈妈，本来是再自然不过的事。博比隐约懂得，人就算长大了，伤心时仍会想找自己的妈妈。可那时再也没有妈妈能让你投奔，又会是什么滋味呢？
        - id: ch04-b15
          speaker: phyllis
          text: 博比，你为什么踢我？
        - id: ch04-b16
          speaker: narrator
          text: 妈妈轻轻笑了一声，又叹了口气。
        - id: ch04-b17
          speaker: mother
          text: 那好吧。不过你们必须先弄清楚，火车会从哪个方向开来。隧道附近和拐弯的地方，绝对不能走在铁轨上。
        - id: ch04-b18
          speaker: peter
          text: 火车跟马车一样靠左走。只要我们靠右边，就一定能看见迎面来的火车。
        - id: ch04-b19
          speaker: mother
          text: 好吧。
        - id: ch04-b20
          speaker: narrator
          text: 你也许会觉得，妈妈不该答应。可是她想起自己小时候，最后还是说了这个“好”字。她自己的孩子也好，你也好，世上别的孩子也好，永远不会完全明白，这个字对她有多难。只有你们当中少数像博比这样的孩子，也许能懂得一点点。
    - id: ch05
      title: 妈妈病了
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 偏偏就在第二天，妈妈头疼得很厉害，只能躺在床上。她的两只手滚烫，什么也吃不下，嗓子也疼得要命。
        - id: ch05-b02
          speaker: mrs_viney
          text: 太太，我要是您，就马上请医生来。最近到处都在闹传染病。我姐姐的大女儿，两年前快到圣诞节时受了凉，寒气钻进肚子里。打那以后，那姑娘就再没真正好起来过。
        - id: ch05-b03
          speaker: narrator
          text: 妈妈起初不肯请医生。可到了傍晚，她病得更重了，只好叫彼得到村里去。医生家的门边长着三棵金链花，门上的铜牌写着：“W. W. 福雷斯特，医学博士。”
        - id: ch05-b04
          speaker: narrator
          text: 福雷斯特医生立刻跟彼得来了。一路上，他跟彼得聊个不停。这个人很有魅力，也很明白事理，对铁路、兔子，还有所有真正要紧的事情都感兴趣。看完妈妈，他说这是流行性感冒。
        - id: ch05-b05
          speaker: doctor
          text: 好了，严肃小姐。你大概打算当护士长，是不是？
        - id: ch05-b06
          speaker: roberta
          text: 当然。
        - id: ch05-b07
          speaker: doctor
          text: 那我会叫人把药送来。炉火要一直烧旺。再准备一锅浓牛肉汤，等她退烧，马上给她喝。现在可以给她吃葡萄和浓缩牛肉汁，还要苏打水、牛奶，最好再买一瓶白兰地，一定得买最好的。便宜白兰地比毒药还糟。
        - id: ch05-b08
          speaker: narrator
          text: 博比请医生把这些全写下来。医生照办了。她拿着单子回到妈妈床边。妈妈看过以后笑了一下。博比认定那确实是笑，虽然声音听起来又虚弱又奇怪。
        - id: ch05-b09
          speaker: mother
          text: 真是胡说。我哪里买得起这些乱七八糟的东西？告诉维尼太太，明天买两磅羊颈碎肉，煮给你们吃。我只喝一点肉汤就够了。对了，亲爱的，我还想喝些水。再拿一只盆来，用海绵替我擦擦手，好吗？
        - id: ch05-b10
          speaker: narrator
          text: 罗伯塔一件件照办。她把自己能做的全做完，尽量让妈妈舒服一点，这才下楼去找弟弟妹妹。她两颊通红，嘴唇紧紧抿着，眼睛亮得几乎跟妈妈一样。她把医生的话，还有妈妈的话，一字不漏地告诉了他们。
        - id: ch05-b11
          speaker: roberta
          text: 现在，除了我们，再没有别人能把这些东西弄来了。我们非做到不可。买羊肉的那一先令在我这里。
        - id: ch05-b12
          speaker: peter
          text: 那讨厌的羊肉不吃也没关系。只吃面包和黄油也能活。荒岛上的人吃得更少，不也一次次活下来了吗？
        - id: ch05-b13
          speaker: roberta
          text: 当然能。
        - id: ch05-b14
          speaker: narrator
          text: 于是，他们请维尼太太拿着那一先令去村里，尽量多买些白兰地、苏打水和牛肉汤。
        - id: ch05-b15
          speaker: phyllis
          text: 可就算我们一口饭都不吃，光用饭钱也买不齐医生说的那些东西呀。
        - id: ch05-b16
          speaker: roberta
          text: 是啊，我们得想别的办法。现在大家一起想，用最大的力气想。
        - id: ch05-b17
          speaker: narrator
          text: 三个人果真认真想起来。没过多久，他们又凑在一起商量。后来，博比上楼陪着妈妈，免得她有什么需要。彼得和菲莉丝则拿来剪刀、一条白床单、一把漆刷，还有维尼太太刷炉篦和壁炉挡板用的黑漆，忙个不停。
        - id: ch05-b18
          speaker: narrator
          text: 第一条床单没有做成他们想要的东西，他们就从布草柜里再拿一条。他们完全没想到，那些床单都是花钱买来的好东西。他们只知道，自己正在做一件很好的事。至于到底是什么，待会儿自然会知道。
        - id: ch05-b19
          speaker: narrator
          text: 博比的床已经搬进妈妈的房间。那天夜里，她起来好几次，给炉子添火，又让妈妈喝牛奶和苏打水。妈妈常常自言自语，说的话谁也听不明白。有一次，她忽然醒来，喊了起来。
        - id: ch05-b20
          speaker: mother
          text: 妈妈，妈妈！
          emotion: sad
        - id: ch05-b21
          speaker: narrator
          text: 博比知道，妈妈是在叫外婆。她病得忘记了，就算这样呼唤也没有用，因为外婆已经去世了。
        - id: ch05-b22
          speaker: narrator
          text: 清晨，博比听见妈妈叫自己的名字，马上跳下床，跑到她身边。
        - id: ch05-b23
          speaker: mother
          text: 哦……啊，是的。我想我刚才睡着了。我可怜的小鸭儿，你一定累坏了。真讨厌，还要让你这样辛苦。
        - id: ch05-b24
          speaker: roberta
          text: 辛苦！
          emotion: sad
        - id: ch05-b25
          speaker: mother
          text: 啊，别哭，宝贝。再过一两天，我就会好的。
          emotion: calm
        - id: ch05-b26
          speaker: narrator
          text: 博比答应了一声，努力挤出一个笑。一个平时每晚安安稳稳睡十个小时的人，要是在睡觉时起来三四次，就会觉得自己像是一夜没合眼。博比脑子昏昏沉沉，眼睛又酸又涩。可医生来以前，她还是把房间收拾得干干净净，一切都摆得整整齐齐。这时是早上八点半。
        - id: ch05-b27
          speaker: doctor
          text: 怎么样，小护士？一切都顺利吗？白兰地买到了没有？
        - id: ch05-b28
          speaker: roberta
          text: 买到了，装在一只扁扁的小瓶子里。
        - id: ch05-b29
          speaker: doctor
          text: 可是我没有看见葡萄和牛肉汤。
        - id: ch05-b30
          speaker: roberta
          text: 是的，不过您明天就会看见了。烤箱里正炖着牛肉，等会儿要拿来做牛肉汤。
        - id: ch05-b31
          speaker: doctor
          text: 谁教你这样做的？
        - id: ch05-b32
          speaker: roberta
          text: 菲尔得腮腺炎的时候，我仔细看过妈妈怎么做。
        - id: ch05-b33
          speaker: doctor
          text: 很好。现在叫你们家的老太太陪着妈妈。你去好好吃一顿早饭，然后马上上床，一直睡到午饭。我们可不能让护士长也病倒。
        - id: ch05-b34
          speaker: narrator
          text: 他确实是一位相当不错的医生。
    - id: ch06
      title: 到站时请往外看
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 那天早晨，九点一刻的火车钻出隧道。头等车厢里的老先生放下报纸，准备向栅栏上的三个孩子挥手。可是今天，那里没有三个孩子，只有彼得一个。
        - id: ch06-b02
          speaker: narrator
          text: 彼得也没有像平常那样站在栏杆上。他站在栏杆前，姿势像一位介绍动物园猛兽的演出主持人。又像放映幻灯片时，一位慈祥的牧师拿着指挥棒，指向画面里的“巴勒斯坦风光”，为大家讲解。
        - id: ch06-b03
          speaker: narrator
          text: 彼得也正指着一样东西。那是一条钉在栅栏上的白色大床单。床单上刷着粗粗的黑字，每个字母都有一英尺多高。菲莉丝涂得太着急，有几个字母的黑漆流了下来。不过上面的意思仍然一眼就能看懂。老先生和车里另外几个人读到的是：“到站时请往外看。”
        - id: ch06-b04
          speaker: narrator
          text: 很多人到了车站果然往外看，可大家都很失望，因为眼前没有任何特别的东西。老先生也望向窗外，最初只看见铺着碎石的站台、阳光，还有花圃里的桂竹香和勿忘我。
        - id: ch06-b05
          speaker: narrator
          text: 火车喷起气来，一节节车厢绷紧，眼看就要再次开动。这时候，老先生终于看见菲莉丝。她一路跑来，喘得厉害。
        - id: ch06-b06
          speaker: phyllis
          text: 啊，我还以为来不及赶上您了。我的鞋带总是松开，害我摔了两跤。给您，快拿着。
        - id: ch06-b07
          speaker: narrator
          text: 火车已经开动。菲莉丝把一封温热又有点潮湿的信，塞进老先生手里。
        - id: ch06-b08
          speaker: narrator
          text: 老先生靠回车厢一角，拆开信。孩子们先说，他们不知道该怎样称呼他。接着，他们告诉他，妈妈病了。医生列了许多她需要的东西，可妈妈说家里买不起，只肯让大家买羊肉，再给她喝一点肉汤。
        - id: ch06-b09
          speaker: narrator
          text: 信里还说，他们在这里不认识别人。爸爸出门了，他们连爸爸的地址也不知道。爸爸以后会还钱。要是爸爸的钱全没了，或者出了别的事，等彼得长大，也一定会还。他们用名誉担保，还愿意给妈妈需要的每样东西写欠条。
        - id: ch06-b10
          speaker: narrator
          text: 信上签着彼得的名字。下面又请老先生把包裹交给站长，因为他们不知道他会坐哪一班车回来。只要告诉站长，东西是给那个因煤的事道过歉的彼得，站长自然明白。最后，罗伯塔、菲莉丝和彼得三个人都签了名，后面附着医生列的清单。
        - id: ch06-b11
          speaker: narrator
          text: 老先生从头读到尾，眉毛扬了起来。第二遍读完，他微微一笑。第三遍读完，他把信放进口袋，又拿起了《泰晤士报》。
        - id: ch06-b12
          speaker: narrator
          text: 傍晚六点左右，后门响起敲门声。三个孩子抢着跑去开门。门外站着那位友善的搬运工，他给他们讲过许多铁路上的趣事。现在，他把一只大提篮咚的一声放在厨房的石板地上。
        - id: ch06-b13
          speaker: porter
          text: 那位老先生送来的。他叫我马上送到这里。
        - id: ch06-b14
          speaker: peter
          text: 太谢谢您了。真对不起，我没有两便士给您，不像爸爸以前那样。不过……
        - id: ch06-b15
          speaker: porter
          text: 劳驾你别说这个！我可没想着什么两便士。我只是听说你妈妈病了，心里很难过，想问问她今晚好些没有。我还给她带了几枝香蔷薇，闻起来可香了。还两便士呢！
          emotion: angry
        - id: ch06-b16
          speaker: narrator
          text: 他说着，从帽子里拿出一束香蔷薇。后来菲莉丝说，他那副样子“活像个变戏法的”。
        - id: ch06-b17
          speaker: peter
          text: 真是太感谢您了。两便士那句话，也请您原谅。
        - id: ch06-b18
          speaker: porter
          text: 没什么可见怪的。
        - id: ch06-b19
          speaker: narrator
          text: 搬运工心里其实还有点生气，不过这句话说得非常客气。说完，他就走了。
        - id: ch06-b20
          speaker: narrator
          text: 孩子们立刻打开提篮。最上面铺着稻草，下面是细细的刨花。再往下，医生要的东西一样不少，而且每样都有足够的分量。除此以外，还有许多他们根本没求过的东西，有桃子、波特酒和两只鸡。有一只硬纸盒，里面放着长茎的大红玫瑰。还有一只细高的绿瓶，装着薰衣草香水，三只矮胖的小瓶里则是古龙水。篮子里还有一封信。
        - id: ch06-b21
          speaker: narrator
          text: 信是写给罗伯塔、菲莉丝和彼得的。老先生说，他们想要的东西全在篮子里。妈妈一定会问，这些东西从哪里来。他请孩子们告诉她，是一位听说她病了的朋友送来的。当然，等妈妈病好，孩子们必须把整件事都告诉她。
        - id: ch06-b22
          speaker: narrator
          text: 老先生还写道，如果妈妈认为孩子们不该开口向人求助，就请告诉她，他认为他们做得完全正确。他擅自给自己找来了这样大的一份快乐，也希望妈妈能够原谅。信末署名是“G. P.”，后面还有一些字，孩子们谁也认不出来。
        - id: ch06-b23
          speaker: phyllis
          text: 我觉得，我们本来就做对了。
        - id: ch06-b24
          speaker: roberta
          text: 什么叫觉得？我们当然做对了。
        - id: ch06-b25
          speaker: peter
          text: 虽说是这样，我可一点也不盼着把全部真相告诉妈妈。
        - id: ch06-b26
          speaker: roberta
          text: 要等妈妈好了以后再说。那时我们一定高兴极了，这么一点小风波，谁还会在意？啊，你们快看这些玫瑰！我要拿上去给妈妈。
          emotion: happy
        - id: ch06-b27
          speaker: phyllis
          text: 还有香蔷薇！可别忘了香蔷薇。
        - id: ch06-b28
          speaker: narrator
          text: 菲莉丝大声吸了一口花香。
        - id: ch06-b29
          speaker: roberta
          text: 我怎么可能忘？妈妈前几天才告诉我，她小时候住的房子外面，有一道密密的香蔷薇篱笆。
