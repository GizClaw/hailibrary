  chapters:
    - id: ch01
      title: A Birthday Plan
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At breakfast, Mother looked especially bright as she poured the milk and served the porridge.
        - id: ch01-b02
          speaker: mother
          text: I've sold another story, Chickies. It was the one about the King of the Mussels, so we'll have buns for tea. You can fetch them when they're baked, at about eleven.
        - id: ch01-b03
          speaker: narrator
          text: Peter, Phyllis, and Bobbie traded six glances altogether. Then Bobbie spoke.
        - id: ch01-b04
          speaker: roberta
          text: Mother, could we skip the buns tonight and have them on the fifteenth instead? That's next Thursday.
        - id: ch01-b05
          speaker: mother
          text: I don't care which day we have them, dear. But why the fifteenth?
        - id: ch01-b06
          speaker: roberta
          text: It's Mr. Perks's birthday. He'll be thirty-two. He says he doesn't keep birthdays now because he has other things to keep. Not rabbits or secrets. He means the kids and the missus.
        - id: ch01-b07
          speaker: mother
          text: You mean his wife and children.
        - id: ch01-b08
          speaker: phyllis
          text: Yes. That's the same thing, isn't it?
        - id: ch01-b09
          speaker: peter
          text: We want to give him a really nice birthday. He's always been so awfully good to us. We agreed we'd ask you on our next bun day.
        - id: ch01-b10
          speaker: mother
          text: And what if there hadn't been a bun day before the fifteenth?
        - id: ch01-b11
          speaker: roberta
          text: Then we were going to ask if we could anti... antipate the buns, and do without them later.
        - id: ch01-b12
          speaker: mother
          text: Anticipate. Yes, you may. We could write his name on the buns in pink sugar when the day comes.
        - id: ch01-b13
          speaker: peter
          text: Perks isn't a very pretty name.
        - id: ch01-b14
          speaker: phyllis
          text: His first name is Albert. I asked him once.
        - id: ch01-b15
          speaker: mother
          text: Then perhaps we'll put A. P. on them. I'll show you how.
        - id: ch01-b16
          speaker: narrator
          text: That settled the buns, but it did not settle the birthday. Fourteen halfpenny buns with A. P. in pink sugar could hardly make a grand celebration by themselves. Later, the children held a very serious council in the hayloft. The broken chaff cutter stood nearby. Along the floor ran a row of holes where hay could be dropped straight into the racks above the horses' mangers.
        - id: ch01-b17
          speaker: roberta
          text: We can always bring flowers.
        - id: ch01-b18
          speaker: peter
          text: He already has plenty of flowers.
        - id: ch01-b19
          speaker: roberta
          text: Flowers are still nice when somebody gives them to you. We can decorate the birthday with them, but we'll need something besides buns to decorate.
        - id: ch01-b20
          speaker: phyllis
          text: Let's all sit quietly and think. Nobody can speak until they have an idea.
        - id: ch01-b21
          speaker: narrator
          text: They became perfectly quiet. They sat so still that a brown rat decided no one could possibly be in the loft and came boldly into the open. Then Bobbie sneezed. The rat was deeply shocked and hurried away at once. A hayloft where sudden sneezes happened was clearly no home for a respectable middle-aged rat who wanted a quiet life.
        - id: ch01-b22
          speaker: peter
          text: Hooray! I've thought of it!
        - id: ch01-b23
          speaker: narrator
          text: Peter jumped up and kicked at the loose hay.
        - id: ch01-b24
          speakers: [roberta, phyllis]
          ensemble: duo
          text: What is it?
        - id: ch01-b25
          speaker: peter
          text: Perks is kind to everyone. There must be lots of villagers who'd like to help with his birthday. Let's go around and ask them.
        - id: ch01-b26
          speaker: roberta
          text: Mother told us not to ask people for things.
        - id: ch01-b27
          speaker: peter
          text: She meant not to ask for ourselves, silly. This is for someone else. I'll even ask the old gentleman. Just watch me.
        - id: ch01-b28
          speaker: roberta
          text: We ought to ask Mother first.
        - id: ch01-b29
          speaker: peter
          text: Why bother Mother with every little thing, especially when she's busy? Come on. We'll start in the village now.
        - id: ch01-b30
          speaker: narrator
          text: So off they went before asking Mother. Their first stop was the post office. The old woman there listened to their request and said she saw no reason Perks should have a birthday more than anyone else.
        - id: ch01-b31
          speaker: roberta
          text: I'd like everybody to have one. We just happen to know when his is.
        - id: ch01-b32
          speaker: mrs_ransome
          text: Mine is tomorrow, and no one will take any notice of it. Now run along.
        - id: ch01-b33
          speaker: narrator
          text: They did as she told them and tried the other shops and cottages. Some people received them kindly, while others were cross. Some offered a gift, and others would give nothing. Asking people for things is hard work, even when you are not asking for yourself. Anyone who has tried it will know that.
        - id: ch01-b34
          speaker: narrator
          text: When they got home, they laid out what had been given and counted what had been promised. For a first day's work, they decided the collection was not bad at all. Peter recorded it carefully in the little pocket notebook where he usually kept the numbers of his engines. They already had a tobacco pipe from the candy shop, half a pound of tea from the grocer, a wool scarf from the draper next door that was only a little faded, and a stuffed squirrel from the doctor.
        - id: ch01-b35
          speaker: narrator
          text: There were promises too. The butcher would provide a piece of meat. The woman in the old turnpike cottage would give six fresh eggs. The cobbler promised a piece of honeycomb along with six bootlaces, and the blacksmith was going to make an iron shovel.
        - id: ch01-b36
          speaker: narrator
          text: Very early the next morning, Bobbie climbed out of bed and woke Phyllis. The two girls had arranged it quietly between themselves. They had not told Peter because they were sure he would think their idea was silly. Later, once it had turned out all right, they told him everything.
        - id: ch01-b37
          speaker: narrator
          text: The girls cut a large bunch of roses. In a basket, they placed the flowers, the needle book Phyllis had made for Bobbie's birthday, and a very pretty blue necktie that belonged to Phyllis. Then they wrote a note. It said, "For Mrs. Ransome, with our best love, because it is her birthday." They carried the basket to the post office, crept inside, set it on the counter, and ran away before the old woman could come into the shop.
        - id: ch01-b38
          speaker: narrator
          text: By the time the girls returned, Peter had become quite confidential with Mother while helping her get breakfast ready. He had told her about collecting presents around the village and about the birthday they meant to give Perks.
        - id: ch01-b39
          speaker: mother
          text: There's no harm in it, but everything depends on how you do it. I hope he won't take offense and think it's charity. Poor people can be very proud.
        - id: ch01-b40
          speaker: phyllis
          text: It isn't because he's poor. It's because we love him.
        - id: ch01-b41
          speaker: mother
          text: I'll find a few things Phyllis has outgrown, if you're certain you can give them without hurting him. I'd like to do something small because he's been so kind to you. I can't do much when we're poor ourselves. Bobbie, what are you writing?
        - id: ch01-b42
          speaker: roberta
          text: Nothing in particular. And I'm sure he'll be glad to have the things.
    - id: ch02
      title: Gifts for Mr. Perks
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The morning of the fifteenth passed very happily. The children fetched the buns and watched Mother put A. P. on every one in pink sugar. First she beat egg whites and mixed in powdered sugar. A few drops of cochineal turned it pink. Then she rolled clean white paper into a cone, leaving one tiny hole at the pointed end, and spooned the mixture into the wide end. The icing crept slowly through the little hole, and Mother wrote with it as if she held a great fat pen filled with pink sugar ink.
        - id: ch02-b02
          speaker: narrator
          text: With their neat pink letters, the buns looked beautiful. Mother put them into a cool oven until the sugar hardened. While they waited, the children walked up to the village to collect the honey, the iron shovel, and every other gift that had been promised.
        - id: ch02-b03
          speaker: narrator
          text: Mrs. Ransome stood in the post office doorway. The children wished her good morning as they passed.
        - id: ch02-b04
          speaker: mrs_ransome
          text: Here, wait a moment. Those roses...
        - id: ch02-b05
          speaker: phyllis
          text: Did you like them? They were ever so fresh. I made the needle book, though it was really Bobbie's present.
        - id: ch02-b06
          speaker: narrator
          text: Phyllis skipped for joy as she said it.
        - id: ch02-b07
          speaker: mrs_ransome
          text: Here's your basket.
        - id: ch02-b08
          speaker: narrator
          text: Mrs. Ransome brought it out, filled to the top with plump red gooseberries.
        - id: ch02-b09
          speaker: mrs_ransome
          text: I expect the Perks children would enjoy those.
        - id: ch02-b10
          speaker: phyllis
          text: Oh, you dear!
          emotion: happy
        - id: ch02-b11
          speaker: narrator
          text: Phyllis threw her arms around the old woman's broad waist.
        - id: ch02-b12
          speaker: phyllis
          text: Mr. Perks will be so pleased!
          emotion: happy
        - id: ch02-b13
          speaker: mrs_ransome
          text: Not half as pleased as I was with your needle book, your tie, and those lovely flowers. You're good little souls. Now listen. There's a baby carriage in my wood shed out back. We bought it for the first baby my Emmie had. The poor little thing lived only six months, and Emmie never had another. I'd like Mrs. Perks to have the carriage. It would help with that great big boy of hers. Will you take it?
        - id: ch02-b14
          speakers: [peter, roberta, phyllis]
          ensemble: chorus
          text: Oh!
          emotion: surprised
        - id: ch02-b15
          speaker: narrator
          text: Mrs. Ransome led them around to the wood shed. She brought out the baby carriage, removed the sheets of paper that had protected it so carefully, and dusted every part of it before letting the children take it.
        - id: ch02-b16
          speaker: mrs_ransome
          text: There it is. I might have given it to her long ago if the thought had come to me. I just wasn't sure she'd take it. Tell her it belonged to my Emmie's little baby.
        - id: ch02-b17
          speaker: phyllis
          text: Isn't it wonderful? Now a real live baby will ride in it again!
          emotion: happy
        - id: ch02-b18
          speaker: narrator
          text: Mrs. Ransome sighed, and then she laughed.
        - id: ch02-b19
          speaker: mrs_ransome
          text: Yes. Here are some peppermint candies for the little ones. Now hurry away before I hand over my roof and all the clothes I'm wearing.
        - id: ch02-b20
          speaker: narrator
          text: The children packed the baby carriage with everything they had collected for Perks. The packages, food, flowers, and other gifts all rode together inside it. At half past three, Peter, Bobbie, and Phyllis took hold of the carriage and wheeled the whole birthday collection down to Perks's little yellow house.
        - id: ch02-b21
          speaker: narrator
          text: Everything about the house looked neat and cared for. On the window ledge stood a pitcher of wildflowers. It held big daisies, red sorrel, and grasses topped with soft, feathery flowers. From the washhouse came the sound of splashing water. A boy who was only halfway through being washed poked his head around the door.
        - id: ch02-b22
          speaker: perks_boy
          text: Mother's upstairs changing her clothes.
        - id: ch02-b23
          speaker: mrs_perks
          text: I'll be down in a minute!
        - id: ch02-b24
          speaker: narrator
          text: Her voice traveled down the narrow, freshly scrubbed stairs. Soon the steps creaked, and Mrs. Perks came down while fastening her dress. Her hair was brushed smooth and tight, and soap and water had made her face shine.
        - id: ch02-b25
          speaker: mrs_perks
          text: I'm running a little late getting changed, Miss. I did an extra thorough cleaning today because Perks happened to mention it was his birthday. I don't know what made him think of it. We always celebrate the children's birthdays, of course. But he and I are usually too old for that sort of thing.
        - id: ch02-b26
          speaker: peter
          text: We knew it was his birthday, and we brought him presents. They're outside in the baby carriage.
        - id: ch02-b27
          speaker: narrator
          text: Mrs. Perks gasped as the gifts came out. When she had seen them all, she suddenly sat on a wooden chair and burst into tears. The children were shocked and frightened.
        - id: ch02-b28
          speakers: [roberta, phyllis]
          ensemble: duo
          text: Oh, please don't cry!
        - id: ch02-b29
          speaker: peter
          text: What in the world is wrong? You don't mean you dislike everything, do you?
        - id: ch02-b30
          speaker: narrator
          text: Mrs. Perks only sobbed harder. Her own children had now been washed until their faces were as shiny as anyone could wish. They gathered at the washhouse door and scowled at the three visitors who had somehow made their mother cry. No one knew what to say, and an uncomfortable silence settled over the room.
        - id: ch02-b31
          speaker: peter
          text: Don't you like the presents?
        - id: ch02-b32
          speaker: narrator
          text: His sisters patted Mrs. Perks on the back. As suddenly as she had started, she stopped crying.
        - id: ch02-b33
          speaker: mrs_perks
          text: There, don't worry about me. I'm all right. Do I like it? Perks never had a birthday like this, not even as a boy when he stayed with his uncle, who owned a grain shop before the business failed. Like it? Oh...
          emotion: happy
        - id: ch02-b34
          speaker: narrator
          text: Then Mrs. Perks poured out every grateful, admiring thing in her heart. There were so many kind words that Peter, Bobbie, and Phyllis would never want them written down or repeated. Their ears grew hotter and hotter. Their faces turned redder and redder. They felt they had done almost nothing and certainly had not earned all that praise.
        - id: ch02-b35
          speaker: peter
          text: We're very glad you're pleased. But if you keep talking like that, we'll have to go home. We wanted to stay and see whether Mr. Perks likes it too. We simply can't bear any more.
        - id: ch02-b36
          speaker: mrs_perks
          text: I won't say one more word. But I can still think it, can't I? Because if ever...
        - id: ch02-b37
          speaker: roberta
          text: Could we have a plate for the buns?
        - id: ch02-b38
          speaker: narrator
          text: Mrs. Perks hurried to set the table for tea. She found plates for the buns, the honey, and the red gooseberries, so that every good thing could be seen. She divided the roses between two glass jam jars and set them among the food. By the time she finished, the simple kitchen table looked so festive that Mrs. Perks declared it fit for a prince.
        - id: ch02-b39
          speaker: mrs_perks
          text: Just think of it! I tidied early, and the little ones picked wildflowers. I never expected him to get anything but the ounce of his favorite tobacco I bought Saturday and saved for today. Bless us, he's early!
        - id: ch02-b40
          speaker: narrator
          text: Mr. Perks had lifted the latch on the little front gate.
        - id: ch02-b41
          speaker: roberta
          text: Let's hide in the back kitchen. You tell him about everything, Mrs. Perks, but give him your tobacco first because that's your present. Then we'll come out and all shout, "Many happy returns!"
    - id: ch03
      title: Pride and Misunderstanding
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: It was a fine plan, but it did not happen that way. There was only time for Peter, Bobbie, and Phyllis to rush into the washhouse, pushing the younger Perks children ahead of them. Those children stared with their mouths open. No one had time to shut the door. The visitors had not meant to listen, but from the open doorway they could hear everything said in the kitchen. All six children were packed in with the mangle, the wash boiler, and every other piece of proper washhouse furniture. There was hardly room to move.
        - id: ch03-b02
          speaker: perks
          text: Hello, old woman! This is quite a spread!
        - id: ch03-b03
          speaker: mrs_perks
          text: It's your birthday tea, Bert. And here's an ounce of your extra special tobacco. I bought it Saturday after you happened to remember today's your birthday.
        - id: ch03-b04
          speaker: perks
          text: Good old girl!
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: The children heard the unmistakable sound of a kiss from the kitchen. They stayed squeezed together in the washhouse and listened.
        - id: ch03-b06
          speaker: perks
          text: But why is that baby carriage here? What are all these packages? Where did the sweets come from? And what...
        - id: ch03-b07
          speaker: narrator
          text: Mrs. Perks began to answer, but the children never heard what she said. At that exact moment, Bobbie gave a violent start. She plunged a hand into her pocket and felt the slips of paper there. Then her whole body went stiff with horror.
        - id: ch03-b08
          speaker: roberta
          text: Oh, what can we do? I forgot every one of the labels! He won't know who gave what. He'll think it all came from us and that we're showing off, or being charitable, or something dreadful.
          emotion: fearful
        - id: ch03-b09
          speaker: peter
          text: Shh!
        - id: ch03-b10
          speaker: narrator
          text: Then Mr. Perks spoke, loud and angry.
        - id: ch03-b11
          speaker: perks
          text: I don't care. I won't put up with it, and that's final.
          emotion: angry
        - id: ch03-b12
          speaker: mrs_perks
          text: But these are the children you're always carrying on about. The ones from the Three Chimneys.
        - id: ch03-b13
          speaker: perks
          text: I don't care if an angel from Heaven brought it. We've managed all these years without asking favors. I'm not starting this charity business now, Nell, so you can forget it.
          emotion: angry
        - id: ch03-b14
          speaker: mrs_perks
          text: Oh, hush, Bert! Hold your foolish tongue. All three of them are in the washhouse, hearing every word you say.
        - id: ch03-b15
          speaker: perks
          text: Then I'll give them something worth hearing. I've told them exactly what I think before, and I can do it again.
          emotion: angry
        - id: ch03-b16
          speaker: narrator
          text: Perks took two strides to the washhouse and flung the door open as far as the crowd of children behind it allowed.
        - id: ch03-b17
          speaker: perks
          text: Come out here and explain yourselves. Have I ever complained that we were short of money? What makes you bring this charity trick to my house?
          emotion: angry
        - id: ch03-b18
          speaker: phyllis
          text: Oh! I was sure you'd be pleased. I'll never try to be kind to anybody again. Never, ever!
          emotion: sad
        - id: ch03-b19
          speaker: narrator
          text: Phyllis burst into tears.
        - id: ch03-b20
          speaker: peter
          text: We didn't mean to hurt you.
        - id: ch03-b21
          speaker: perks
          text: Meaning something isn't the same as doing it.
        - id: ch03-b22
          speaker: roberta
          text: Please don't be angry. We truly thought you'd love it. We always get things on our birthdays.
        - id: ch03-b23
          speaker: perks
          text: From your own family, yes. That's different.
        - id: ch03-b24
          speaker: roberta
          text: No, not only from family. At our old home, the servants gave us presents, and we gave them presents on their birthdays. When Mother gave me my buttercup brooch, Mrs. Viney gave me two beautiful glass jars. Nobody thought she was treating us like charity.
        - id: ch03-b25
          speaker: perks
          text: If this were only a couple of glass jars, I wouldn't make such a fuss. It's these heaps and heaps of things I can't accept. I won't.
        - id: ch03-b26
          speaker: peter
          text: They aren't all from us. We only forgot to attach the labels. People all over the village gave them.
        - id: ch03-b27
          speaker: perks
          text: And who talked them into it?
        - id: ch03-b28
          speaker: phyllis
          text: We did.
          emotion: sad
        - id: ch03-b29
          speaker: narrator
          text: Perks dropped heavily into the armchair. He stared at the three visitors as if their explanation had made everything worse instead of better. Bobbie later described those looks as withering glances of gloomy despair.
        - id: ch03-b30
          speaker: perks
          text: So you've gone around telling the neighbors we can't pay our bills. Well, you've disgraced us as thoroughly as possible. Now take this whole pile back where it came from. Thank you very much, I'm sure. Perhaps you meant well, but I'd rather we weren't friends anymore, if you don't mind.
          emotion: angry
        - id: ch03-b31
          speaker: narrator
          text: He deliberately turned the armchair around until his back was squarely toward the children. The chair legs grated harshly over the brick floor. Once that sound ended, nothing at all broke the silence.
        - id: ch03-b32
          speaker: roberta
          text: Listen. This is perfectly awful.
        - id: ch03-b33
          speaker: perks
          text: That's exactly what I said.
        - id: ch03-b34
          speaker: roberta
          text: We'll leave if that's what you want. You don't have to be our friend anymore, but...
        - id: ch03-b35
          speaker: phyllis
          text: We'll always be your friends, no matter how nasty you are to us!
          emotion: sad
        - id: ch03-b36
          speaker: peter
          text: Be quiet!
          emotion: angry
        - id: ch03-b37
          speaker: roberta
          text: But before we go, please let us show you the labels we meant to put on everything.
        - id: ch03-b38
          speaker: perks
          text: I don't want labels unless they're proper luggage labels. I've kept my family respectable and out of debt on my wages, even with Nell taking in washing. Do you expect me to let the neighbors turn us into a joke?
          emotion: angry
        - id: ch03-b39
          speaker: peter
          text: A joke? You don't understand at all.
        - id: ch03-b40
          speaker: phyllis
          text: You are terribly quick to judge people. You were wrong about us before, when you thought we wouldn't tell you the Russian gentleman's secret. Please let Bobbie read the labels.
        - id: ch03-b41
          speaker: perks
          text: All right. Go on, then.
        - id: ch03-b42
          speaker: roberta
          text: We wrote down what everyone said when they gave us a present. We put their names on too. Mother told us to be very careful, because... Well, I wrote down her exact words. You'll see.
        - id: ch03-b43
          speaker: narrator
          text: Miserable as she was, Bobbie felt a small bit of hope. She fumbled through her tightly stuffed pocket and tried to sort the slips of paper. But she could not begin reading right away. Tears had filled her eyes, and she had to swallow once, then twice. Mrs. Perks had been crying steadily ever since her husband opened the washhouse door. Now she caught her breath, choked, and tried to speak.
        - id: ch03-b44
          speaker: mrs_perks
          text: Don't make yourself sick over it, Missy. I know you meant to be kind, even if he doesn't.
          emotion: sad
        - id: ch03-b45
          speaker: roberta
          text: May I read them now? Mother's label comes first. It says, "Little clothes for Mrs. Perks's children." Mother said she'd find some things Phyllis had outgrown, if we were sure you wouldn't be offended or think they were charity. She wanted to do a little something because you've been so kind to us. She couldn't do much, because we're poor too.
          emotion: sad
        - id: ch03-b46
          speaker: narrator
          text: Bobbie paused.
        - id: ch03-b47
          speaker: perks
          text: That's all right. Your mother is a true lady. Nell, we'll keep the little dresses and the rest.
    - id: ch04
      title: What the Neighbors Meant
      blocks:
        - id: ch04-b01
          speaker: roberta
          text: Next are the baby carriage, the gooseberries, and the candy. Mrs. Ransome gave those. She thought your children would like the sweets. The carriage belonged to the first baby her Emmie had. The baby only lived six months, and Emmie never had another. Mrs. Ransome wanted your wife to have it because it would help with your fine big boy. She would have offered it sooner if she'd known Mrs. Perks would accept it. She asked me to be sure you knew it was her Emmie's baby's carriage.
        - id: ch04-b02
          speaker: mrs_perks
          text: I can't send that carriage back, Bert. I won't, so don't even ask me.
        - id: ch04-b03
          speaker: perks
          text: I'm not asking anything.
        - id: ch04-b04
          speaker: roberta
          text: Then there's the shovel. Mr. James made it for you himself. Here are his words. He said it was a pleasure to make a little something for a man who is so well respected. Then he said he wished he could put horseshoes on your children and his, because he knows how much shoe leather costs.
        - id: ch04-b05
          speaker: perks
          text: James is a decent fellow.
        - id: ch04-b06
          speaker: roberta
          text: The cobbler sent the honey and the bootlaces. He said he respects a man who pays his own way, and the butcher said the same. The old woman at the turnpike cottage remembered how often you helped with her garden when you were a boy. She said things like that come home to roost, though I don't know what she meant.
        - id: ch04-b07
          speaker: roberta
          text: Every person who gave something said they liked you and thought our plan was a good one. Nobody called it charity or said anything horrid. The old gentleman gave Peter a gold pound for you and said you were a man who knew his work. I thought you would love finding out how fond everyone is of you. Instead, I've never been so unhappy in my life. Goodbye. I hope you can forgive us someday.
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: Bobbie could say nothing more. She turned to leave.
        - id: ch04-b09
          speaker: perks
          text: Stop. I take back every word I said that hurt you. Nell, put the kettle on.
        - id: ch04-b10
          speaker: peter
          text: We'll carry everything away if the presents make you unhappy. But everyone who helped will be terribly disappointed, and so will we.
        - id: ch04-b11
          speaker: perks
          text: They don't make me unhappy. In fact...
        - id: ch04-b12
          speaker: narrator
          text: Perks suddenly swung the chair around. His face looked strangely twisted and screwed up.
        - id: ch04-b13
          speaker: perks
          text: I don't know when I've ever been more pleased. The presents are a first-rate collection, but that's not the best of it. It's knowing the neighbors respect me. That's worth having, isn't it, Nell?
          emotion: happy
        - id: ch04-b14
          speaker: mrs_perks
          text: I think every bit of it is worth having. And if you ask me, Bert, you made the most ridiculous fuss over nothing.
        - id: ch04-b15
          speaker: perks
          text: No, I didn't. If a man doesn't respect himself, nobody else will respect him.
        - id: ch04-b16
          speaker: roberta
          text: But everybody does respect you. Every one of them said so.
        - id: ch04-b17
          speaker: phyllis
          text: I knew you'd be happy once you understood!
          emotion: happy
        - id: ch04-b18
          speaker: perks
          text: Hmph. Will you stay for tea?
        - id: ch04-b19
          speaker: narrator
          text: They all stayed for the birthday tea. Later, Peter rose and proposed a toast to Mr. Perks's health, and everyone honored it with tea. Then Perks lifted his own cup and offered another toast. No one had expected anything so poetic from him.
        - id: ch04-b20
          speaker: perks
          text: May the garland of friendship be ever green.
    - id: ch05
      title: Loving-Kindness
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: That night, as Mr. and Mrs. Perks went to bed, he spoke about the children.
        - id: ch05-b02
          speaker: perks
          text: Those are jolly good little kids.
        - id: ch05-b03
          speaker: mrs_perks
          text: They're good as gold, bless them. You're the most aggravating old thing alive. I was ashamed of you, and that's the truth.
        - id: ch05-b04
          speaker: perks
          text: You had no reason to be, old girl. Once I saw it wasn't charity, I backed down properly. But I never could stand charity, and I never will.
        - id: ch05-b05
          speaker: narrator
          text: That birthday party made all sorts of people happy. Mr. and Mrs. Perks and all the little Perkses enjoyed the useful, lovely things. Even more than that, they had the kind thoughts of their neighbors. The Three Chimneys children were happy because their plan had succeeded beyond doubt, even though success had been delayed in a way they never expected. And whenever Mrs. Ransome saw the plump Perks baby riding in her Emmie's old carriage, the sight made her happy all over again.
        - id: ch05-b06
          speaker: narrator
          text: Mrs. Perks made a whole round of visits through the village. She went to each person who had sent one of the birthday presents and thanked them for their kindness. After every call, she came away feeling that the person she had visited was a better friend than she had ever realized.
        - id: ch05-b07
          speaker: perks
          text: Yes, it isn't only what you do. What you mean matters too. That's what I've always said. Now, if it had really been charity...
        - id: ch05-b08
          speaker: mrs_perks
          text: Oh, bother charity! Nobody would offer you charity, Bert, even if you needed it. Those gifts were plain friendliness.
        - id: ch05-b09
          speaker: narrator
          text: When the clergyman came to call, Mrs. Perks told him the whole story.
        - id: ch05-b10
          speaker: mrs_perks
          text: It really was friendliness, wasn't it, sir?
        - id: ch05-b11
          speaker: clergyman
          text: I think it was what people sometimes call loving-kindness.
        - id: ch05-b12
          speaker: narrator
          text: So everything came right in the end. Still, when you do something like that, you must be careful to do it in the right way. As Mr. Perks decided once he had time to think, what you mean matters just as much as what you do.
