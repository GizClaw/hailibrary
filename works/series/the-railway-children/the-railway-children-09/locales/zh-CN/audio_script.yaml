audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细微幽默和体恤
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中
    bobbie:
      display_name: 博比
      tts:
        delivery: 真诚敏锐，关切时急切而坚定
        timbre: 清亮温暖的少女声
        pace: 自然偏快
        pitch: 中高
    peter:
      display_name: 彼得
      tts:
        delivery: 爽直自信，兴奋时干脆有力
        timbre: 明亮的少年声
        pace: 明快
        pitch: 中高
    phyllis:
      display_name: 菲莉丝
      tts:
        delivery: 天真活泼，想象丰富
        timbre: 轻盈稚嫩的女孩声
        pace: 轻快
        pitch: 高
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔镇定，讲到苦难时克制而悲悯
        timbre: 温润清晰
        pace: 从容
        pitch: 中
    perks:
      display_name: 帕克斯
      tts:
        delivery: 直率健谈，带着自尊和朴实的铁路工人口吻
        timbre: 粗粝而亲切
        pace: 适中偏快
        pitch: 中低
    mrs_ransome:
      display_name: 兰塞姆太太
      tts:
        delivery: 嘴硬心软，感慨时坦率亲热
        timbre: 厚实略沙哑的老年女声
        pace: 自然偏慢
        pitch: 中低
    mrs_perks:
      display_name: 帕克斯太太
      tts:
        delivery: 朴实热情，激动时话多而爽快
        timbre: 温暖结实的女声
        pace: 自然偏快
        pitch: 中
    perks_boy:
      display_name: 帕克斯家的男孩
      tts:
        delivery: 直接随意，带着孩子气
        timbre: 清脆的男孩声
        pace: 明快
        pitch: 中高
    parson:
      display_name: 牧师
      tts:
        delivery: 温和沉静，回答简洁而体贴
        timbre: 清润稳重
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 一个生日计划
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 正是吃早饭的时候。妈妈一边给孩子们倒牛奶、盛麦片粥，一边笑着，整张脸都亮堂堂的。她有一个好消息要宣布。她又卖掉了一篇故事，就是那篇《淡菜国王》。这意味着今天的下午茶不一样了，可以添一顿小圆面包。面包一烤好，孩子们就能去拿，大约是上午十一点。
        - id: ch01-b02
          speaker: mother
          text: 小宝贝们，我又卖掉一篇故事啦，就是《淡菜国王》。所以今天下午茶有小圆面包。等烤好了，你们大约十一点去拿，好不好？
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: 彼得、菲莉丝和博比互相递了整整六个眼色，最后由博比开口。
        - id: ch01-b04
          speaker: bobbie
          text: 妈妈，今天先别吃，留到十五号行吗？十五号是下星期四。
        - id: ch01-b05
          speaker: mother
          text: 你们哪天吃都行。不过，为什么要等到那天呢？
        - id: ch01-b06
          speaker: bobbie
          text: 那天是帕克斯的生日。他三十二岁了，可他说自己早就不过生日，因为还得养别的东西。不是兔子，也不是秘密，是孩子们和太太。
        - id: ch01-b07
          speaker: mother
          text: 你是说，他的妻子和孩子。
        - id: ch01-b08
          speaker: phyllis
          text: 对呀，反正不都一样吗？
        - id: ch01-b09
          speaker: peter
          text: 他一直对我们特别好，我们想认真替他过一次生日。所以一碰上面包日，就来问您能不能把面包留给他。
        - id: ch01-b10
          speaker: mother
          text: 要是十五号之前都没有面包日呢？
        - id: ch01-b11
          speaker: bobbie
          text: 那就请您让我们预……先拿来吃。下回再不吃。
        - id: ch01-b12
          speaker: mother
          text: 那叫“预支”。我懂了，当然可以。到时候用粉红糖霜把他的名字写在面包上，好不好？
        - id: ch01-b13
          speaker: peter
          text: “帕克斯”写出来可不怎么好看。
        - id: ch01-b14
          speaker: phyllis
          text: 他叫阿尔伯特，我以前问过他。
        - id: ch01-b15
          speaker: mother
          text: 那就写A. P.。到了那天，我教你们。
        - id: ch01-b16
          speaker: narrator
          text: 到这里，每一步都安排得很顺利。不过，他们仔细想想，十四只半便士的小圆面包，实在不够办一场隆重的生日会。哪怕每一只面包都用粉红糖霜写上A. P.，它们也还是只有十四只。
        - id: ch01-b17
          speaker: narrator
          text: 后来，三个孩子到干草棚里郑重开会。那里有一台坏掉的切草机，地板上还有一排洞，干草可以从洞里落进楼下马厩的草架。
        - id: ch01-b18
          speaker: bobbie
          text: 花当然得有。
        - id: ch01-b19
          speaker: peter
          text: 他自己就有不少花。
        - id: ch01-b20
          speaker: bobbie
          text: 自己有花，收到别人送的还是会高兴。我们可以拿花来布置，可光有面包和花，也没多少东西可布置呀。
        - id: ch01-b21
          speaker: phyllis
          text: 大家都别说话，好好想。谁没想出东西，谁就不许开口。
        - id: ch01-b22
          speaker: narrator
          text: 棚里一下静得出奇。三个孩子谁也不肯先说话。一只褐色老鼠听不见动静，还以为这里没人，就神气十足地跑了出来。偏偏这时，博比忽然打了个喷嚏。老鼠大吃一惊，转身匆匆逃走。它大概已经看明白了，这种会突然打喷嚏的干草棚，绝不适合一只体面、上了年纪又爱清静的老鼠安身。
        - id: ch01-b23
          speaker: peter
          text: 有了！我想到了！
          emotion: happy
        - id: ch01-b24
          speaker: narrator
          text: 彼得猛地跳起来，一只脚踢进了松散的干草。
        - id: ch01-b25
          speakers: [bobbie, phyllis]
          ensemble: duo
          text: 想到什么了？
        - id: ch01-b26
          speaker: peter
          text: 帕克斯对谁都好，村里肯定有很多人愿意替他过生日。我们挨家挨户问去！
        - id: ch01-b27
          speaker: bobbie
          text: 可妈妈说过，不许我们向别人讨东西。
        - id: ch01-b28
          speaker: peter
          text: 她说的是不许替自己讨，又没说不能替别人讨。我还要去问老先生呢，你们等着看吧。
        - id: ch01-b29
          speaker: bobbie
          text: 我们还是先问问妈妈吧。
        - id: ch01-b30
          speaker: peter
          text: 这么点儿小事也去烦妈妈干吗？她正忙着呢。走吧，现在就到村里去。
    - id: ch02
      title: 村里的礼物
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他们真的立刻去了村里，一家一家地问。第一站是邮局。那里的老太太兰塞姆太太听完他们的话，板着脸说，她可看不出帕克斯凭什么比别人更应该过生日。
        - id: ch02-b02
          speaker: bobbie
          text: 我倒希望人人都过生日。只是我们碰巧知道他的生日是哪天。
        - id: ch02-b03
          speaker: mrs_ransome
          text: 明天就是我的生日，我倒要看看谁会记得。你们走吧。
        - id: ch02-b04
          speaker: narrator
          text: 他们只好离开邮局，继续去别处。有的人听完很和气，有的人马上就发脾气。有的人愿意拿出东西，有的人怎么也不肯。孩子们这才知道，向别人开口讨东西真不容易。哪怕不是替自己讨，而是想给别人一个惊喜，也一样叫人难为情。
        - id: ch02-b05
          speaker: narrator
          text: 回到家以后，他们把已经拿到的和别人答应送的东西全摆出来，一件一件清点。第一天能有这些，他们觉得已经很不错了。彼得拿出一本小小的袖珍簿。他平时专用这本簿子记火车头编号，现在又认真列起礼物清单。已经收到的，有糖果店送的一只烟斗，杂货店送的半磅茶叶，布店送的一条稍微褪色的羊毛围巾，还有医生送的一只松鼠标本。别人答应送的也不少。肉铺会送一块肉，住在旧收费站小屋的女人会送六只鲜鸡蛋，鞋匠会送一块蜂巢蜜和六根鞋带，铁匠铺则会送一把铁铲。
        - id: ch02-b06
          speaker: narrator
          text: 第二天一大早，博比就起床叫醒菲莉丝。这是姐妹俩事先商量好的秘密。她们没有告诉彼得，因为觉得他准会说这个主意很傻，等办成以后才让他知道。两人剪下一大束玫瑰，又拿出菲莉丝在博比生日时送她的针线簿，再添上一条十分漂亮的蓝领带，全放进篮子。她们写了一张纸条，说这些送给兰塞姆太太，还送上最亲爱的祝福，因为今天是她的生日。到了邮局，两人把篮子往柜台上一放。老太太还没来得及走进店堂，她们就飞快地跑掉了。
        - id: ch02-b07
          speaker: narrator
          text: 等她们回家，彼得已经把整个计划告诉了正在准备早饭的妈妈。
        - id: ch02-b08
          speaker: mother
          text: 这件事本身没错，就看你们怎么做。我只怕帕克斯以为那是施舍，觉得受了冒犯。穷人也有很强的自尊心。
        - id: ch02-b09
          speaker: phyllis
          text: 我们又不是因为他穷，是因为喜欢他。
        - id: ch02-b10
          speaker: mother
          text: 我找几件菲莉丝穿小了的衣服吧。不过你们一定得确定，送去不会惹他生气。他对你们那么好，我也想尽一点心。只是我们自己也穷，能做的不多。博比，你在写什么？
        - id: ch02-b11
          speaker: bobbie
          text: 没什么要紧的。我敢说，他会喜欢这些礼物。
        - id: ch02-b12
          speaker: narrator
          text: 到了十五号那天上午，大家高高兴兴地取来小圆面包，围着看妈妈用粉红糖霜写上A. P.。你大概知道这种糖霜怎么做。先把蛋白打出泡，拌进糖粉，再滴几滴胭脂虫红。然后把一张干净白纸卷成圆锥，在尖头剪出一个小孔，从宽的那头把糖霜装进去。粉红糖霜会慢慢从尖端流出来。拿它写字，就像握着一支粗粗胖胖的大笔，笔肚里装的不是墨水，而是粉红色的糖。
        - id: ch02-b13
          speaker: narrator
          text: 十四只小圆面包上全写好了A. P.，一个个看起来漂亮极了。妈妈把它们放进不太热的烤炉，让粉红糖霜慢慢凝固定形。孩子们没有干等。他们趁这段工夫又跑到村里，把蜂蜜、铁铲、肉、鸡蛋和别人答应送的其余东西一一收齐。路过邮局时，他们看见兰塞姆太太正站在门阶上，就很有礼貌地向她说了一声早上好，本来打算接着往前走。
        - id: ch02-b14
          speaker: mrs_ransome
          text: 喂，你们等一下。那些玫瑰……
        - id: ch02-b15
          speaker: phyllis
          text: 您喜欢吗？花可新鲜啦。针线簿是我做的，不过那原本是博比收到的礼物。
        - id: ch02-b16
          speaker: narrator
          text: 菲莉丝说得高兴，身子也蹦蹦跳跳。兰塞姆太太走进店里，把篮子还给他们。篮中已经装满圆滚滚的红醋栗。
        - id: ch02-b17
          speaker: mrs_ransome
          text: 帕克斯家的孩子们大概爱吃这个。
        - id: ch02-b18
          speaker: phyllis
          text: 您真可爱！帕克斯一定高兴极了。
          emotion: happy
        - id: ch02-b19
          speaker: narrator
          text: 菲莉丝伸手抱住老太太肥胖的腰。兰塞姆太太拍了拍她的肩膀。
        - id: ch02-b20
          speaker: mrs_ransome
          text: 你们送我针线簿、领带、花，还惦记着我的生日，我可比帕克斯还高兴。你们几个真有心。我柴房里还有辆婴儿车，是给我女儿埃米第一个孩子买的。那孩子只活了六个月，埃米后来也没再有孩子。帕克斯太太家那个胖小子正好能用。你们愿意替我送去吗？
        - id: ch02-b21
          speakers: [peter, bobbie, phyllis]
          ensemble: chorus
          text: 啊！
          emotion: surprised
        - id: ch02-b22
          speaker: narrator
          text: 兰塞姆太太走到后面的柴房，把那辆婴儿车推了出来。车子一直用纸仔细盖着。她先把纸揭掉，又从车头到车尾一点点掸去灰尘，直到整辆车都收拾妥当，才推到孩子们面前。
        - id: ch02-b23
          speaker: mrs_ransome
          text: 就是这辆。早想到的话，我早就送她了，可我一直拿不准她肯不肯收。你们告诉她，这是我家埃米那个小宝贝用过的车。
        - id: ch02-b24
          speaker: phyllis
          text: 想到又有一个活生生的宝宝坐进去，多好呀！
        - id: ch02-b25
          speaker: narrator
          text: 兰塞姆太太先叹了口气，接着又笑了。
        - id: ch02-b26
          speaker: mrs_ransome
          text: 是啊。来，再拿些薄荷糖给孩子们吃。你们赶紧走，不然我连屋顶和身上的衣服也要一块儿送掉啦。
    - id: ch03
      title: 生日茶桌
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 大家送帕克斯的东西，全都装进了那辆婴儿车。下午三点半，彼得、博比和菲莉丝一起推着车，来到帕克斯家那所黄色的小屋。屋里收拾得非常整洁。窗台上摆着一只水罐，里面插满野花，有大朵的雏菊、红色的酸模，还有开着绒毛似的小花的细草。洗衣间里传来哗啦哗啦的水声。一个男孩只把脸洗干净了一半，就从门边探出头来看他们。
        - id: ch03-b02
          speaker: perks_boy
          text: 妈妈正在换衣裳。
        - id: ch03-b03
          speaker: mrs_perks
          text: 我马上下来！
        - id: ch03-b04
          speaker: narrator
          text: 声音顺着狭窄的楼梯传下来。那楼梯刚刚彻底刷洗过，干净得很。孩子们站在厨房里等着。没过多久，楼梯一阶一阶吱呀响起来，帕克斯太太边扣上衣边往下走。她的头发梳得又光又紧，脸也用肥皂和水仔细洗过，亮闪闪的，看得出她为了这个日子特意收拾了自己。
        - id: ch03-b05
          speaker: mrs_perks
          text: 小姐，对不起，我换衣裳晚了。帕克斯碰巧说今天是他的生日，我就把屋子彻底收拾了一遍。真怪，他怎么忽然想起生日来了。孩子们当然得过生日，可我和他早就老得不该过这些啦。
        - id: ch03-b06
          speaker: peter
          text: 我们也知道今天是他的生日，还带了礼物，都在外面的婴儿车里。
        - id: ch03-b07
          speaker: narrator
          text: 孩子们把礼物从婴儿车里一样一样拿出来。每拿出一件，帕克斯太太就响亮地吸一口气。等所有东西都摆开，她忽然跌坐在一把木椅上，放声大哭。孩子们全吓坏了，又吃惊，又害怕。帕克斯家的孩子这时个个都洗得满脸发亮，他们站在洗衣间门口，怒气冲冲地瞪着闯进家里的客人。没人知道该怎么办，屋里陷入一阵十分难堪的沉默。博比和菲莉丝只好站在帕克斯太太身边，轻轻拍她的背。
        - id: ch03-b08
          speakers: [peter, bobbie, phyllis]
          ensemble: chorus
          text: 求您别哭！
          emotion: fearful
        - id: ch03-b09
          speaker: peter
          text: 到底怎么啦？您不会是不喜欢吧？
        - id: ch03-b10
          speaker: narrator
          text: 她的哭声来得突然，停得也突然。
        - id: ch03-b11
          speaker: mrs_perks
          text: 别管我，我没事。怎么会不喜欢？帕克斯一辈子也没过过这样的生日。小时候住在叔叔家也没有，那时叔叔还开着谷物店，后来才破了产。喜欢？我真不知道该怎么谢你们……
          emotion: happy
        - id: ch03-b12
          speaker: narrator
          text: 接下来，帕克斯太太又说了各种各样的好话。那些话要是全说出来，三个孩子准不会愿意。她越夸，彼得、博比和菲莉丝的耳朵就越烫，脸也越红。在他们看来，自己根本没做什么了不起的事，哪里当得起这么多感激和称赞。
        - id: ch03-b13
          speaker: peter
          text: 您这么高兴，我们也高兴。可您再夸下去，我们只能回家了。我们本来还想留下，看帕克斯先生喜不喜欢呢，可这些话真叫人受不了。
        - id: ch03-b14
          speaker: mrs_perks
          text: 好，我一个字也不说了。可你们总不能不许我心里想着吧？因为要是……
        - id: ch03-b15
          speaker: bobbie
          text: 能给我们一个盘子装面包吗？
        - id: ch03-b16
          speaker: narrator
          text: 博比这一打岔，帕克斯太太立刻顾不上再夸他们，忙着摆下午茶的桌子。小圆面包、蜂蜜和红醋栗都盛在盘中。那束玫瑰分开来，插进两只玻璃果酱罐。吃的、花和礼物摆在一起，满满当当。照帕克斯太太的话说，这张茶桌已经配得上王子了。
        - id: ch03-b17
          speaker: mrs_perks
          text: 想想吧，我今天早早把屋子收拾好，小家伙们又采了野花。除了我星期六买来、一直替他留着的一盎司烟丝，我哪想得到他还会收到别的东西。天哪，他今天怎么这么早！
        - id: ch03-b18
          speaker: narrator
          text: 帕克斯已经拨开前院的小门闩。
        - id: ch03-b19
          speaker: bobbie
          text: 我们躲到洗衣间，让您先告诉他。先给他看烟丝，那是您送的。等您说完，我们再一起出来，喊“祝您福寿绵长”。
        - id: ch03-b20
          speaker: narrator
          text: 这个主意听起来很好，可惜根本没来得及照办。三个孩子只够冲进洗衣间，还顺手把帕克斯家几个年幼又看呆了的孩子推到自己前面。门已经来不及关，他们并不是有意偷听，却不得不听见厨房里发生的一切。帕克斯家的孩子、三烟囱村的三个孩子，再加上洗衣间本来就有的全套家什，连轧衣机和煮衣锅都算在内，把这间小小的屋子塞得严严实实。
        - id: ch03-b21
          speaker: perks
          text: 嘿，老婆子！这桌子摆得真漂亮！
          emotion: happy
        - id: ch03-b22
          speaker: mrs_perks
          text: 这是你的生日茶，伯特。还有一盎司你最爱的烟丝，星期六就买好了，谁让你碰巧记起今天是生日呢。
        - id: ch03-b23
          speaker: perks
          text: 好老婆！可这辆婴儿车是哪儿来的？还有这些包、这些甜食，都是怎么回事？
        - id: ch03-b24
          speaker: narrator
          text: 一声亲吻之后，帕克斯太太开始解释。可洗衣间里的孩子没听清。博比突然一抖，把手伸进口袋，整个人都吓僵了。
        - id: ch03-b25
          speaker: bobbie
          text: 糟了，我忘记给东西挂标签！他不知道是谁送的，会以为全是我们拿来的，以为我们在摆阔，或者施舍他，或者做了什么很讨厌的事。
          emotion: fearful
        - id: ch03-b26
          speaker: peter
          text: 嘘！
        - id: ch03-b27
          speaker: perks
          text: 我不管。这种事我受不了，我非说清楚不可。
          emotion: angry
        - id: ch03-b28
          speaker: mrs_perks
          text: 可这是你总提起的那三个孩子送来的，就是三烟囱村的孩子呀。
        - id: ch03-b29
          speaker: perks
          text: 谁送的都不行，天使从天堂送来也不行。我们这么多年全靠自己，没求过谁帮忙。我都这把年纪了，绝不会开始收施舍。内尔，你别想让我收。
          emotion: angry
        - id: ch03-b30
          speaker: mrs_perks
          text: 小声一点！伯特，求你闭上那张傻嘴吧。他们三个全挤在洗衣间里，你说什么，他们都听得见。
        - id: ch03-b31
          speaker: perks
          text: 那正好，我就说给他们听。我以前跟他们说过心里话，现在再说一次。
          emotion: angry
        - id: ch03-b32
          speaker: narrator
          text: 帕克斯说完，两大步就跨到洗衣间门口，一把将门拉开。当然，门后正紧紧挤着两家的孩子。他使劲一拉，门也只能开到那么大。几个孩子不得不一起向后缩，才从那道窄缝里一个个出来，站到他的面前。
        - id: ch03-b33
          speaker: perks
          text: 都出来！告诉我，你们这是什么意思？我什么时候向你们哭过穷，叫你们拿施舍压到我头上？
          emotion: angry
        - id: ch03-b34
          speaker: phyllis
          text: 我还以为您一定会高兴。以后我再也不想对别人好了。只要我活着，就永远不想了！
          emotion: sad
        - id: ch03-b35
          speaker: narrator
          text: 菲莉丝放声哭了起来。
        - id: ch03-b36
          speaker: peter
          text: 我们没有恶意。
        - id: ch03-b37
          speaker: perks
          text: 心里怎么想不算最要紧，做出了什么才算。
          emotion: angry
        - id: ch03-b38
          speaker: bobbie
          text: 请您别这样！我们真以为您会喜欢。我们过生日的时候，也总会收到东西呀。
        - id: ch03-b39
          speaker: perks
          text: 当然，那都是你们亲戚送的，不是一回事。
        - id: ch03-b40
          speaker: bobbie
          text: 才不是。以前家里的仆人过生日，我们送他们礼物。我们过生日，他们也送我们。妈妈送过我那枚毛茛花胸针，维尼太太还送过两只漂亮的玻璃罐，从没人觉得那是在施舍。
        - id: ch03-b41
          speaker: perks
          text: 要是只有两只玻璃罐，我不会说这些。可这里一堆又一堆，我受不了，也绝不肯收。
        - id: ch03-b42
          speaker: peter
          text: 这些不全是我们送的。我们只是忘了挂标签。村里许多人都送了东西。
        - id: ch03-b43
          speaker: perks
          text: 那是谁撺掇他们送的？
        - id: ch03-b44
          speaker: phyllis
          text: 是我们。
          emotion: sad
        - id: ch03-b45
          speaker: narrator
          text: 帕克斯重重坐进扶手椅，一言不发地望着他们。那目光让人很不好受。后来博比说，他的眼里满是阴沉的绝望，像是能把面前的人一点点灼枯。
        - id: ch03-b46
          speaker: perks
          text: 原来你们挨家挨户告诉邻居，说我们穷得过不下去了。现在我们在街坊面前算是丢尽了脸。把这一整套东西全送回去吧，多谢你们。我知道你们是好心，不过以后，我宁愿不再认识你们。
          emotion: angry
        - id: ch03-b47
          speaker: narrator
          text: 说完，帕克斯故意把扶手椅转过去，拿后背对着孩子们。椅腿在砖地上拖过，刮出一阵刺耳的响声。那声音停下以后，屋里就只剩沉默，再也听不见一点动静。
    - id: ch04
      title: 忘记挂上的标签
      blocks:
        - id: ch04-b01
          speaker: bobbie
          text: 您听我说，这一切实在太可怕了。
          emotion: sad
        - id: ch04-b02
          speaker: perks
          text: 我也是这么想的。
        - id: ch04-b03
          speaker: bobbie
          text: 只要您愿意，我们可以走。您以后不肯和我们做朋友，也可以。可是……
          emotion: sad
        - id: ch04-b04
          speaker: phyllis
          text: 可我们永远把您当朋友，不管您对我们多坏！
          emotion: sad
        - id: ch04-b05
          speaker: peter
          text: 别说了。
          emotion: angry
        - id: ch04-b06
          speaker: bobbie
          text: 但在走以前，请让我们把那些标签念给您听。它们本来都该挂在礼物上的。
          emotion: sad
        - id: ch04-b07
          speaker: perks
          text: 我不想看标签。除了干活时见的行李标签，什么标签我都不想看。我靠工钱正正经经过日子，不欠别人的债。内尔还得替人洗衣服，你们却把我们弄成街坊的笑话。
          emotion: angry
        - id: ch04-b08
          speaker: peter
          text: 笑话？您根本没弄明白！
        - id: ch04-b09
          speaker: phyllis
          text: 您的脾气真急。上回俄国人的事，您也错怪过我们。就让博比把标签念出来嘛！
          emotion: sad
        - id: ch04-b10
          speaker: perks
          text: 好吧，念！
        - id: ch04-b11
          speaker: narrator
          text: 博比苦着一张脸，把手伸进塞得鼓鼓囊囊的口袋里，一张张摸索那些纸条。她已经走投无路了，可想到纸条上写着的话，心里还没有完全失去希望。
        - id: ch04-b12
          speaker: bobbie
          text: 我们把每个人送东西时说的话，还有他们的名字，全写下来了。妈妈也提醒过我们要小心，所以她说的话我也记下了。您听完就会明白。
        - id: ch04-b13
          speaker: narrator
          text: 可博比一时还是念不出来。她想开口，又咽了回去，连着咽了两三次。帕克斯太太从丈夫拉开洗衣间的门起，就一直站在一旁默默流泪。看见博比说不出话，她猛地吸了一口气，带着哭腔替孩子们开口。
        - id: ch04-b14
          speaker: mrs_perks
          text: 小姐，别难过。我知道你们是一片好心。他不懂，我懂。
          emotion: sad
        - id: ch04-b15
          speaker: bobbie
          text: 我现在可以念了吗？先念妈妈的。“送给帕克斯太太家孩子们的几件小衣服。”妈妈说，她会找几件菲莉丝穿小的衣服，可我们必须确定帕克斯先生不会把它当成施舍。您待我们这么好，她也想做一点事。只是我们家也穷，能做的不多。
          emotion: sad
        - id: ch04-b16
          speaker: narrator
          text: 念到这里，博比停了下来。她自己也一直在哭，只能一边擦眼睛，一边设法把皱成一团的纸条分开。眼泪不断落下来，把纸条都打湿了。
        - id: ch04-b17
          speaker: perks
          text: 这个没问题。你们的妈妈天生就是位真正的淑女。内尔，那些小裙子什么的，咱们留下。
        - id: ch04-b18
          speaker: bobbie
          text: 接下来是婴儿车、红醋栗和糖果，都是兰塞姆太太送的。她说，帕克斯家的孩子大概爱吃糖。婴儿车是给她女儿埃米的第一个孩子买的，可那孩子只活了六个月，埃米后来再也没有孩子。她想送给帕克斯太太，让家里的胖娃娃坐。她还说，要是早知道您家肯收，她早就送来了。这是埃米那个小宝贝用过的车。
        - id: ch04-b19
          speaker: mrs_perks
          text: 伯特，这辆婴儿车我不能退，也不会退。所以你别想叫我……
        - id: ch04-b20
          speaker: perks
          text: 我什么也没叫你做。
        - id: ch04-b21
          speaker: bobbie
          text: 再来是铁铲，詹姆斯先生亲手替您做的。他说，能给一位这么受人敬重的好汉做点小东西，他很乐意。他还希望孩子的脚也能像马蹄一样钉上铁掌，因为他知道鞋皮有多贵。
        - id: ch04-b22
          speaker: perks
          text: 詹姆斯这人还不坏。
        - id: ch04-b23
          speaker: bobbie
          text: 还有蜂蜜和鞋带。鞋匠说，他敬重能自己把账付清的人，肉铺老板也这么说。旧收费站小屋的女人说，您年轻时常帮她照料园子，这样的事会飞回家来栖息。我不太懂那是什么意思。每个送礼物的人都说喜欢您，也说我们的主意好。没有一个人提过施舍，或者别的讨厌话。老先生还给彼得一枚金镑送您，说您是个真正懂行的人。我以为您知道有这么多人喜欢您，一定会高兴。我从没像现在这样难过。再见。我希望有一天，您能原谅我们……
          emotion: sad
        - id: ch04-b24
          speaker: narrator
          text: 最后那句话还没说完，博比的声音就断了。她再也念不下去，也不敢再看帕克斯，只把湿漉漉的纸条攥在手里，转过身就要离开这间屋子。
        - id: ch04-b25
          speaker: perks
          text: 等等。我刚才说过的那些叫你们难受的话，全都收回。内尔，把水壶放到炉子上。
        - id: ch04-b26
          speaker: peter
          text: 如果这些东西真叫您不痛快，我们可以拿走。不过大家一定会失望，不只是我们。
        - id: ch04-b27
          speaker: perks
          text: 我没有不痛快。我也说不准，自己是不是从没这么高兴过。倒不全是为了礼物，虽然每一样都顶呱呱。真正宝贵的，是街坊们这么看重我。对吧，内尔？
          emotion: happy
        - id: ch04-b28
          speaker: narrator
          text: 说这些话时，他忽然把扶手椅转了回来。刚才那张又硬又怒的脸，现在皱成了古里古怪的样子。孩子们这才看清，他嘴上还说得粗声粗气，心里却已经被街坊们的看重打动了。
        - id: ch04-b29
          speaker: mrs_perks
          text: 我看每样都宝贵。要我说，伯特，你刚才根本是无事生非，闹得可笑透了。
        - id: ch04-b30
          speaker: perks
          text: 我才没有。一个人要是不尊重自己，别人也不会尊重他。
        - id: ch04-b31
          speaker: bobbie
          text: 可大家都尊重您。他们全都这么说。
        - id: ch04-b32
          speaker: phyllis
          text: 我就知道，您真正明白以后，一定会喜欢！
          emotion: happy
        - id: ch04-b33
          speaker: perks
          text: 哼！那你们留下来喝茶吗？
        - id: ch04-b34
          speaker: narrator
          text: 后来大家围着那张配得上王子的茶桌坐下。彼得提议举杯，祝帕克斯先生身体健康，所有人都用茶向他致意。帕克斯先生也提议祝酒，大家再次端起茶杯。他祝的是，愿友谊的花环四季常青。这句话可真有诗意，比任何人料想中帕克斯会说出来的话都更有诗意。
    - id: ch05
      title: 友情
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 晚上，帕克斯先生和妻子上床以后，又说起了这一天。
        - id: ch05-b02
          speaker: perks
          text: 那几个小家伙真不错。
        - id: ch05-b03
          speaker: mrs_perks
          text: 他们个个心肠都好，上天保佑他们。可你这个老东西，世上再没有比你更气人的了。我真替你害臊。
        - id: ch05-b04
          speaker: perks
          text: 你用不着害臊，老婆子。我一明白那不是施舍，就痛痛快快认错了。可真要是施舍，我以前受不了，以后也绝不收。
        - id: ch05-b05
          speaker: narrator
          text: 那场生日会让各种各样的人都得到了快乐。帕克斯先生、帕克斯太太和家里的小家伙们，因为面包、蜂蜜、红醋栗和其余那些好东西而快乐，也因为终于知道街坊们真心喜欢他们而快乐。三烟囱村的三个孩子也很快乐，因为他们花了这么多心思的计划终于成功了。这个成功来得意外地迟，中间还闹出一场叫人流泪的误会，但最后确凿无疑。兰塞姆太太也有自己的快乐。每一次看见帕克斯家的胖娃娃好端端地坐在埃米那个小宝贝留下的婴儿车里，她都会再次觉得，把车送出去是件多么好的事。
        - id: ch05-b06
          speaker: narrator
          text: 生日之后，帕克斯太太挨家挨户去拜访，亲自感谢每一个送来亲切礼物的人。她把大家的心意都记得清清楚楚，也让每个人知道帕克斯最终有多高兴。她原本只是去道谢，可每敲开一扇门，聊上几句话，就觉得自己又多了一位朋友，而且这位朋友比她从前想象中的还要好。
        - id: ch05-b07
          speaker: perks
          text: 是啊，事情不光看你做了什么，还得看你是什么意思。我就是这么说的。要那真是施舍……
        - id: ch05-b08
          speaker: mrs_perks
          text: 去它的施舍吧，伯特！就算你真穷得需要别人施舍，我敢说也没人愿意施舍你。那只是一片友情，就是友情。
        - id: ch05-b09
          speaker: narrator
          text: 后来牧师来拜访，帕克斯太太把整件事告诉了他。
        - id: ch05-b10
          speaker: mrs_perks
          text: 那是友情，对不对，先生？
        - id: ch05-b11
          speaker: parson
          text: 我想，那也是人们有时所说的仁爱。
        - id: ch05-b12
          speaker: narrator
          text: 所以你看，到头来一切都很好。不过，要替别人做这一类事，非得仔细用对方法不可。帕克斯先生后来有空把整件事想过一遍，最后还是说了同样的道理。事情不全在于你做了什么，更在于你心里是什么意思。
