        pace: 舒缓而有变化
        pitch: 中
    bobbie:
      display_name: 博比
      tts:
        delivery: 真诚敏锐，关切时急切而坚定
        timbre: 清亮温暖的少女声
        pace: 自然偏快
        pitch: 中高
    peter:
      display_name: 彼得
      tts:
        delivery: 爽直自信，兴奋时干脆有力
        timbre: 明亮的少年声
        pace: 明快
        pitch: 中高
    phyllis:
      display_name: 菲莉丝
      tts:
        delivery: 天真活泼，想象丰富
        timbre: 轻盈稚嫩的女孩声
        pace: 轻快
        pitch: 高
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔镇定，机智中带着慈爱
        timbre: 温润清晰
        pace: 从容
        pitch: 中
    perks:
      display_name: 帕克斯
      tts:
        delivery: 直率健谈，带着自尊和朴实的铁路工人口吻
        timbre: 粗粝而亲切
        pace: 适中偏快
        pitch: 中低
    father:
      display_name: 爸爸
      tts:
        delivery: 克制温柔，久别重逢时感情深沉
        timbre: 清朗而略显疲惫
        pace: 沉稳
        pitch: 中低
    postmistress:
      display_name: 邮局老太太
      tts:
        delivery: 慈爱热切，话语朴素
        timbre: 苍老而温暖
        pace: 稍慢
        pitch: 中
    drapers_boy:
      display_name: 布店伙计
      tts:
        delivery: 郑重客气，略带拘谨
        timbre: 年轻清脆
        pace: 适中
        pitch: 中高
    blacksmith:
      display_name: 铁匠
      tts:
        delivery: 粗声爽朗，真心替人高兴
        timbre: 浑厚粗粝
        pace: 适中
        pitch: 低
    station_master:
      display_name: 站长
      tts:
        delivery: 热情却故作公事公办
        timbre: 洪亮端正
        pace: 适中偏快
        pitch: 中低
  chapters:
    - id: ch01
      title: 三烟囱的新日子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老先生来看过孙子以后，三烟囱的日子就变了，再也不完全是从前的样子。孩子们已经知道他的姓名，可至少在私下里，他们从不那么叫。他在他们心里永远是老先生，在我们这里也还是这样最好。就算我告诉你，他姓斯努克斯或者詹金斯，他就会变得更真实吗？何况他根本不姓那些。请容我留下这唯一的秘密吧。别的事情，我都告诉你了，只剩最后这一章要讲。当然，我也没有把一切的一切全说出来。真要那么做，这本书就永远讲不完了，那不是很可惜吗？
        - id: ch01-b02
          speaker: narrator
          text: 家里有了厨娘克拉拉和女佣埃塞尔温。她们都很和气，名字也不是什么秘密。可她们对妈妈说，家里似乎用不着维尼太太，还嫌她做起事情总是乱糟糟的。于是维尼太太每周只来两天，负责洗衣和熨衣。克拉拉和埃塞尔温又说，只要没人碍手碍脚，她们完全能把活儿做妥。孩子们便不用再预备茶点、收拾桌子、洗茶具，也不用给房间掸灰了。
        - id: ch01-b03
          speaker: narrator
          text: 他们常常对自己、也对彼此假装说，最讨厌做家务。可这些活儿真没了，生活里反倒像空出好大一块。妈妈如今不用写作，也不用做家务，便有空给他们上课。于是孩子们非做功课不可。不管教你的人有多可爱，功课在全世界都还是功课。即便碰上最有趣的时候，也不如削土豆或者点炉火好玩。
        - id: ch01-b04
          speaker: narrator
          text: 好在妈妈也有空陪他们玩了，还能像从前那样编小诗。上课时有件怪事。不管三个孩子正在学什么，他们总觉得别人的功课更好。彼得念拉丁文，却羡慕博比的历史。博比想做菲莉丝的算术。菲莉丝偏觉得拉丁文最有意思。
        - id: ch01-b05
          speaker: narrator
          text: 一天上课前，每个人的座位上都放着一首小诗。我特意把它们讲给你听，是想证明妈妈很懂孩子们做功课时是什么心情，也知道他们自己会用什么话。能做到这一点的大人可不多。我猜，多数大人的记性都坏透了，早忘了自己小时候是什么感受。下面的诗，原本就假定是孩子们自己在念。
        - id: ch01-b06
          speaker: peter
          text: 从前我当恺撒好对付，那时真是傻得可怜！谁一开始学恺撒书，哪知往后苦海无边。动词全是蠢笨东西，我宁愿背国王年纪！
        - id: ch01-b07
          speaker: bobbie
          text: 所有功课最最讨厌，是背谁把谁的王位接。一排排国王和女王，做什么都配上年月日。日期多得叫人难受，我真想改做算术题！
        - id: ch01-b08
          speaker: phyllis
          text: 一磅又一磅苹果摆满石板，问买下来要花多少钱。数字擦了写，写了又算，除数被除数惹人泪涟涟。若能像男孩一样学拉丁文，我准砸了石板，高兴得喊！
        - id: ch01-b09
          speaker: narrator
          text: 有了这样的诗，功课当然快活多了。教你的人看得出，你学起来并非一路顺风，也不会因为你还没学会，就认定全是你自己太笨。知道老师明白这一点，已经很能安慰人了。
        - id: ch01-b10
          speaker: narrator
          text: 吉姆的腿渐渐好起来。孩子们常上楼陪他，听他讲学校和同学。有个叫帕尔的男孩，吉姆简直把他看低到了底。小威格斯比的见解，却很受吉姆敬重。还有佩利三兄弟，最小的叫佩利老三，最爱打架。
        - id: ch01-b11
          speaker: narrator
          text: 彼得听这些学校故事听得入了迷，妈妈似乎也很留心。一天，她拿给吉姆一张纸，上面是一首专门写帕尔的诗。她不但巧妙地写进佩利和威格斯比的名字，还列出了吉姆讨厌帕尔的所有理由，以及威格斯比对此事的高明看法。吉姆高兴极了，从来没人特意为他写过诗。他一遍又一遍地读，直到全能背下来，才把诗寄给威格斯比。威格斯比也很喜欢，差不多跟吉姆一样喜欢。也许你听了也会喜欢。
        - id: ch01-b12
          speaker: narrator
          text: 诗名叫《新来的男孩》。他的名字叫帕尔，他说茶点吃牛奶面包。他说父亲杀过一头熊，还说母亲替他剪头毛。下雨他就穿橡胶套鞋，家里人竟管他叫“宝贝”。他一点正经羞耻心也没有，还把教名告诉伙伴们听。
        - id: ch01-b13
          speaker: narrator
          text: 他守三柱门糟糕透顶，一见板球就怕得要命。他能在屋里看几个钟头的书，还知道那些讨厌花儿的姓名。他说法语真像个法国佬，那副神气实在叫人受不了。轮到他望风，他偏要躲懒，还说来学校就是为了学习。
        - id: ch01-b14
          speaker: narrator
          text: 他不肯踢球，说踢了会疼，也不敢跟佩利老三打一场。他使尽力气也吹不出哨声，大家一笑，他倒哭了起来。小威格斯比说，帕尔这副样子，新来的男孩个个都差不离。可我记得自己初来学校时，才没像他这么个快活傻东西！
        - id: ch01-b15
          speaker: narrator
          text: 吉姆怎么也想不通，妈妈怎么聪明到写得出这样的诗。三个孩子倒觉得这固然很好，却也十分自然。他们从小就习惯了这样一位妈妈，能把诗写得跟人说话一模一样，连结尾那句吓人的话也能放进去，而那句话原本就是吉姆自己的。后来，吉姆又教彼得下国际象棋、跳棋和多米诺骨牌。总之，那是一段安静而愉快的日子。
    - id: ch02
      title: 九点一刻的列车
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 吉姆的腿一天比一天好。博比、彼得和菲莉丝心里渐渐都生出同一个念头，应该想个办法让他开心。不能只是陪他玩平常的游戏，得来一件真正体面的大事情才行。可要想出这样的事，实在难得出奇。他们想了又想，直想到每个人的脑袋都又沉又胀，还是毫无办法。
        - id: ch02-b02
          speaker: peter
          text: 算了。想不出来就是想不出来。也许会有一件他喜欢的事，自己找上门呢。
        - id: ch02-b03
          speaker: phyllis
          text: 事情有时真的会自己发生，根本不用你安排。
        - id: ch02-b04
          speaker: narrator
          text: 菲莉丝说这句话时，那口气颇为特别，好像世上发生的每一件事，平常倒全是由她亲手安排的。
        - id: ch02-b05
          speaker: bobbie
          text: 真希望会有一件事发生，一件了不起的事。
        - id: ch02-b06
          speaker: narrator
          text: 她说完这话，恰好过了四天，了不起的事果然发生了。我倒希望能告诉你，那是三天以后，因为童话里的事情总是在三天以后发生。可这个故事不是童话。再说，事实上它的确发生在第四天，不是第三天。我这个人若还有什么长处，那就是严格说真话，绝不拿日子骗你。
        - id: ch02-b07
          speaker: narrator
          text: 那阵子，三个孩子简直不再像铁路边的孩子了。日子一天一天过去，每个人心里都隐隐有些不安，却一直说不清是为什么。终于有一天，菲莉丝把三个人共同的心事说了出来。
        - id: ch02-b08
          speaker: phyllis
          text: 不知道铁路会不会想我们。我们现在根本不去看它了。
          emotion: sad
        - id: ch02-b09
          speaker: bobbie
          text: 是有点忘恩负义。从前没人陪我们玩时，我们多么爱它呀。
        - id: ch02-b10
          speaker: peter
          text: 帕克斯总上来问吉姆的情况。信号员的小儿子也好了，他亲口告诉我的。
        - id: ch02-b11
          speaker: phyllis
          text: 我说的不是铁路上的人。我说的是亲爱的铁路本身。
        - id: ch02-b12
          speaker: bobbie
          text: 我最难过的是，我们不再朝九点一刻的火车挥手，也不再托它把我们的爱带给爸爸了。
        - id: ch02-b13
          speaker: phyllis
          text: 那就从今天重新开始。
        - id: ch02-b14
          speaker: narrator
          text: 于是他们果真重新去了。家里有了佣人，妈妈不再写作，一切都跟着改变了。不知为什么，这让故事开头那个古怪的早晨显得特别遥远，仿佛从那天到现在，已经过去了特别特别漫长的一段时间。那天他们早早起床，把水壶底烧漏了，早餐吃的是苹果派，也就是在那个早晨，他们第一次看见了铁路。
        - id: ch02-b15
          speaker: narrator
          text: 如今已经到了九月。通往铁路的斜坡上，草皮又干又脆。细长的草穗一根根竖着，像纤细的金线。柔弱的蓝铃花在坚韧细瘦的茎上颤动，吉卜赛蔷薇摊开扁平的淡紫色花盘。走到铁路半途，那方水池边还有金丝桃，像金黄的小星星一样闪亮。博比采了满满一大把花，心想，把它们放在吉姆那条可怜的断腿上一定很好看。他腿上如今盖着一条绿粉两色丝屑织成的毯子。
        - id: ch02-b16
          speaker: peter
          text: 快点，不然赶不上九点一刻的车啦！
        - id: ch02-b17
          speaker: phyllis
          text: 我已经不能更快了。真讨厌，我的鞋带怎么又松了！
        - id: ch02-b18
          speaker: peter
          text: 等你结婚那天，走在教堂过道上，鞋带也会松。新郎会给它绊倒，在花砖地上撞扁鼻子。你一看就不肯嫁了，只好一辈子当老姑娘。
        - id: ch02-b19
          speaker: phyllis
          text: 我才不会！我宁愿嫁给鼻子撞扁的人，也不愿谁都不嫁。
        - id: ch02-b20
          speaker: bobbie
          text: 可嫁给扁鼻子的人还是挺糟糕的。婚礼上，他连花香都闻不到，多可怕呀！
        - id: ch02-b21
          speaker: peter
          text: 管它什么婚礼上的花！快看，信号落下来了，我们得跑！
        - id: ch02-b22
          speaker: narrator
          text: 他们跑起来。九点一刻的列车开过时，他们又挥起手帕，根本不管手帕干不干净。
        - id: ch02-b23
          speaker: bobbie
          text: 把我们的爱带给爸爸！
        - id: ch02-b24
          speakers: [peter, phyllis]
          ensemble: duo
          text: 把我们的爱带给爸爸！
        - id: ch02-b25
          speaker: narrator
          text: 老先生从头等车厢窗口使劲挥手。他挥得非常厉害，不过这没什么稀奇，因为他一向都会挥手。真正稀奇的是，每一扇车窗里都有手帕在飘，报纸在打信号，一只只手也在拼命挥舞。列车带着一片沙沙声和轰鸣掠过，小石子在车轮下蹦着、跳着。等火车过去，只剩三个孩子站在那里，彼此望着对方。
        - id: ch02-b26
          speaker: peter
          text: 哎呀！
          emotion: surprised
        - id: ch02-b27
          speaker: bobbie
          text: 哎呀！
          emotion: surprised
        - id: ch02-b28
          speaker: phyllis
          text: 哎——呀！
          emotion: surprised
        - id: ch02-b29
          speaker: peter
          text: 这到底是什么意思？
        - id: ch02-b30
          speaker: bobbie
          text: 我可不知道。也许老先生叫他那一站的人留意我们，看到了就挥手。他知道我们一定会喜欢。
    - id: ch03
      title: 人人都知道的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 说来也巧，事情还真是这样。老先生在自己常去的车站很有名望，也很受敬重。那天早晨，他早早来到那里，守在检票口旁。一个年轻人正拿着那台很有意思的剪票机器。每一个从门里走过的乘客，老先生都要拦住说几句话。人们听完纷纷点头，那些点头的模样真是应有尽有。有的惊讶，有的好奇，有的怀疑，有的欣然高兴，也有人满脸不情愿地勉强答应。接着，每个人都走上站台，翻开报纸去看同一个地方。
        - id: ch03-b02
          speaker: narrator
          text: 上车后，他们又把老先生的话告诉原先就在车里的人。那些人也翻开报纸，看过以后，个个显得十分惊讶，而且大多很高兴。列车驶过三个孩子身边的栅栏时，报纸、手掌和手帕一齐疯狂挥动。火车朝向孩子们的这一面，全是白花花的一片翻飞，像马斯基林与库克魔术剧院的活动影戏里，国王加冕礼的画面。孩子们几乎觉得，列车本身活了过来，终于回应了他们那么长久、那么毫无保留地献给它的爱。
        - id: ch03-b03
          speaker: peter
          text: 这事真是古怪得没法说！
        - id: ch03-b04
          speaker: phyllis
          text: 古怪得没法嗦！
        - id: ch03-b05
          speaker: bobbie
          text: 你们不觉得，老先生今天挥手的样子，比平常更像是在传达什么吗？
        - id: ch03-b06
          speakers: [peter, phyllis]
          ensemble: duo
          text: 不觉得。
        - id: ch03-b07
          speaker: bobbie
          text: 可我觉得是。他好像想用报纸向我们解释一件事。
        - id: ch03-b08
          speaker: peter
          text: 解释什么？
        - id: ch03-b09
          speaker: bobbie
          text: 我不知道。可我心里怪得厉害，就像有什么事马上要发生。
        - id: ch03-b10
          speaker: peter
          text: 马上要发生的，是菲莉丝的长袜要掉下来了。
        - id: ch03-b11
          speaker: narrator
          text: 这话一点不假。刚才向列车挥手太用力，菲莉丝的袜带扣挣坏了。博比用手帕给这位伤员做了急救，大家才回家。
        - id: ch03-b12
          speaker: narrator
          text: 那天的功课对博比格外难。她连一道很简单的算术题都错得一塌糊涂，实在丢脸。题目不过是把四十八磅肉和三十六磅面包，分给一百四十四个饥饿的孩子。可博比就是做不好，妈妈只得担心地望着她。
        - id: ch03-b13
          speaker: mother
          text: 亲爱的，你是不是不舒服？
        - id: ch03-b14
          speaker: bobbie
          text: 我不知道。我也不知道自己怎么了，不是我想偷懒。妈妈，今天能不能不做功课？我想独自待一会儿。
        - id: ch03-b15
          speaker: mother
          text: 当然可以，只是……
        - id: ch03-b16
          speaker: narrator
          text: 博比的石板掉在地上，裂缝正好穿过那道绿色小记号。那记号平常用来沿着画花边，可石板从此再也不是从前那块石板了。博比连捡也没捡，拔腿就跑。妈妈在门厅追上她时，她正在雨衣和雨伞中间摸来摸去，慌得连自己的花园帽也找不着。
        - id: ch03-b17
          speaker: mother
          text: 怎么了，我的小宝贝？你没有生病吧？
        - id: ch03-b18
          speaker: bobbie
          text: 我不知道。可我想一个人待着，看看脑袋是不是真的全乱了，肚子里是不是真的又拧又翻。
        - id: ch03-b19
          speaker: mother
          text: 要不要躺一会儿？
        - id: ch03-b20
          speaker: narrator
          text: 妈妈轻轻把她额前的头发捋到后面。
        - id: ch03-b21
          speaker: bobbie
          text: 我想去花园里会更有精神。
        - id: ch03-b22
          speaker: narrator
          text: 可花园里也待不下去。蜀葵、紫菀和迟开的蔷薇，全都像在等一件事发生。那是个寂静明亮的秋日，天地万物好像都在等待。博比却等不住了。
        - id: ch03-b23
          speaker: bobbie
          text: 我要去车站，跟帕克斯聊聊，再问问信号员的小儿子。
        - id: ch03-b24
          speaker: narrator
          text: 下坡路上，她遇见邮局的老太太。老太太亲亲她，又紧紧抱住她，却只说了几句话。
        - id: ch03-b25
          speaker: postmistress
          text: 上帝保佑你，亲爱的。快去吧，快去。
        - id: ch03-b26
          speaker: narrator
          text: 布店的小伙计平时有点瞧不起人，这回却碰了碰帽檐。
        - id: ch03-b27
          speaker: drapers_boy
          text: 早安，小姐，真高兴见到您。
        - id: ch03-b28
          speaker: narrator
          text: 迎面走来的铁匠更古怪。他手里摊着一张报纸，平时很少露出笑脸，这时却咧着嘴大笑。还没走到博比跟前，他已经把报纸挥了又挥。两人擦身而过时，博比向他道早安，他马上热烈地回答。
        - id: ch03-b29
          speaker: blacksmith
          text: 也祝您早安，小小姐！往后还有许许多多个好日子。我真替您高兴，真的！
          emotion: happy
        - id: ch03-b30
          speaker: bobbie
          text: 真的有事情要发生，我知道一定会。人人都这么古怪，像梦里的人一样。
        - id: ch03-b31
          speaker: narrator
          text: 博比的心跳快了。站长又热烈地握住她的手，把她的胳膊上下摇得像抽水泵手柄，却不肯解释为什么。
        - id: ch03-b32
          speaker: station_master
          text: 十一点五十四分的车晚了一点，小姐。假日行李太多。
        - id: ch03-b33
          speaker: narrator
          text: 他说完，立刻溜进车站深处那座属于自己的圣殿，连博比也不敢跟进去。站长这场不同寻常的热烈招呼究竟是为了什么，他一个字也没解释。帕克斯始终不见踪影，空荡荡的站台上只剩博比和车站猫。那位玳瑁色女士平常总爱躲着人，今天却主动走来。它弓起背，摇着尾巴，来回蹭博比的棕色长袜，喉咙里还发出带着回声的咕噜声。
        - id: ch03-b34
          speaker: bobbie
          text: 今天大家怎么都这么亲热，连你也是，小猫！
        - id: ch03-b35
          speaker: narrator
          text: 十一点五十四分的列车发出进站信号时，帕克斯才露面。他和那天所有人一样，手里也拿着报纸。
        - id: ch03-b36
          speaker: perks
          text: 嘿，您在这儿啊！要真是这班车，那可够快的。上帝保佑您，亲爱的！我在报上瞧见了，这辈子从没为什么事这么高兴过。今天这样的日子，我非得讨一个吻不可。小姐，您知道我没想冒犯您！
          emotion: happy
        - id: ch03-b37
          speaker: narrator
          text: 帕克斯先亲了博比这边脸颊，又亲了另一边，随即不安起来。
        - id: ch03-b38
          speaker: perks
          text: 您没生气吧？我没太放肆吧？今天毕竟是这样的日子。
        - id: ch03-b39
          speaker: bobbie
          text: 没有，当然不算放肆，亲爱的帕克斯先生。我们爱您，就像爱自己的叔叔。可是，您说今天到底是什么日子？
        - id: ch03-b40
          speaker: perks
          text: 就是这样的日子呀！我不是说了吗，我在报上看见了。
        - id: ch03-b41
          speaker: bobbie
          text: 您在报上看见了什么？
        - id: ch03-b42
          speaker: narrator
          text: 可她还没得到回答，十一点五十四分的列车已经冒着蒸汽开进来。站长四下张望，目光扫过每个帕克斯本该在、却偏偏不在的地方。帕克斯只好赶去做事。博比又独自留在站台上，车站猫躲在长凳底下，用一双友善的金色眼睛望着她。
    - id: ch04
      title: 爸爸回家了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 你当然早已清清楚楚地知道会发生什么，博比却还没那么聪明。她心里只有梦中才会有的感觉，模糊、混乱，又充满期待。我也说不准她的心究竟在盼什么，也许它已经猜中了你我都知道的那件事。可她的脑子什么也没想到，几乎一片空白，只剩下疲倦、迟钝和空落落的感觉。就像一个人走过很长很长的路，又早已错过平常的吃饭时间，身体里空得难受，却连自己在等什么也想不清。
        - id: ch04-b02
          speaker: narrator
          text: 十一点五十四分的列车上只下来三个人。第一个是乡下人，提着两只篮筐模样的箱子，里面装满活鸡。那些鸡把栗色脑袋从柳条缝里探出来，不安地四处张望。第二个是杂货店老板娘的表妹佩基特小姐，带着一只铁皮箱和三个牛皮纸包。第三个是……
        - id: ch04-b03
          speaker: bobbie
          text: 啊！爸爸，我的爸爸！
          emotion: surprised
        - id: ch04-b04
          speaker: narrator
          text: 这一声尖叫像刀一样刺进车上每个人的心。乘客纷纷把头探出车窗。他们看见一个高高的、面色苍白的男人，嘴唇紧紧抿成细细的一线。一个小女孩手脚并用，整个人紧紧抱在他身上，而他的双臂也紧紧搂住那个孩子。
        - id: ch04-b05
          speaker: narrator
          text: 过了一会儿，车站上的人影和惊叹都留在身后。父女俩沿着大路往家走。
        - id: ch04-b06
          speaker: bobbie
          text: 我知道一定会发生了不起的事，可我没想到会是这件事。啊，爸爸，我的爸爸！
          emotion: happy
        - id: ch04-b07
          speaker: father
          text: 妈妈没有收到我的信吗？
        - id: ch04-b08
          speaker: bobbie
          text: 今天早上没有信。爸爸，真的是您，对不对？
        - id: ch04-b09
          speaker: narrator
          text: 那只她从未忘记的手紧紧握住她，她终于确信这是真的。
        - id: ch04-b10
          speaker: father
          text: 你要自己先进去，博比。安安静静地告诉妈妈，一切都没事了。他们抓到了真正做那件事的人。现在人人都知道，你爸爸没有做过。
          emotion: calm
        - id: ch04-b11
          speaker: bobbie
          text: 我一直知道不是您。妈妈也知道，我们的老先生也知道。
        - id: ch04-b12
          speaker: father
          text: 是啊，这全是他的功劳。妈妈写信告诉我，是你查出了真相。她还告诉我，这些日子你一直怎样陪着她。我的小女儿！
        - id: ch04-b13
          speaker: narrator
          text: 说到这里，他们在路上停了一会儿。那一刻，两个人谁也没有再说话。
        - id: ch04-b14
          speaker: narrator
          text: 现在，我看见他们正在穿过田野。博比先走进屋里。她拼命管住自己的眼睛，不让眼睛抢在嘴唇找到恰当的话以前，就把那个天大的秘密泄露出去。她必须照爸爸说的，安安静静地告诉妈妈，一切都已经好了。那些悲伤，那些苦苦的挣扎，还有漫长的分离，如今全都结束了。爸爸真的回家了。
        - id: ch04-b15
          speaker: narrator
          text: 我看见爸爸在花园里走着，等着，又等着。他低头望着花儿。对这双眼睛来说，每一朵花都是奇迹。整个春天和夏天，这双眼睛看见的只有石板地、碎石，还有一小片不情不愿才长出来的草。可是，他的目光总忍不住转回屋子。过了一会儿，爸爸离开花园，走到离自己最近的门外等候。那是一扇后门。
        - id: ch04-b16
          speaker: narrator
          text: 院子那头，燕子正在盘旋。它们要离开寒风和严霜，飞往永远是夏天的地方。眼前正是孩子们替它们筑过小泥窝的那些燕子。屋门终于开了。
        - id: ch04-b17
          speaker: bobbie
          text: 进来吧，爸爸。快进来！
        - id: ch04-b18
          speaker: narrator
          text: 爸爸走了进去，门在他身后关上。我想，我们还是不要把门打开，也不要跟进去。此时此刻，那里不需要我们。我想，我们最好快快地、静静地离开。走到田野尽头，在稀疏的金色草穗、蓝铃花、吉卜赛蔷薇和金丝桃之间，我们可以回过头，最后看一眼那幢白房子。如今，无论是我们，还是别的任何人，那里都不需要了。
