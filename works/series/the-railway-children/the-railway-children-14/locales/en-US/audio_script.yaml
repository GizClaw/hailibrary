  chapters:
    - id: ch01
      title: Chapter XIV. The End.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Life at Three Chimneys was never quite the same after the old gentleman came to see his grandson. The children knew his name now, but at least when they were alone, they still called him the old gentleman. We may as well do the same. Knowing whether his name was Snooks or Jenkins would not make him any more real to you. Neither was his name, by the way. I must be allowed to keep one secret. It is the only one left, because I have told you everything else except what I am about to tell you in this last chapter. Well, not absolutely everything. If I told you every single thing, this story would never end. That would be a pity, wouldn't it?
        - id: ch01-b02
          speaker: narrator
          text: As I was saying, life had changed. The new cook and housemaid were very nice. Their names were Clara and Ethelwyn. They told Mother they did not need Mrs. Viney muddling their work, so Mrs. Viney came only twice a week for the washing and ironing. Clara and Ethelwyn could manage the rest as long as nobody interfered. That meant the children no longer made tea, cleared it away, washed the cups and plates, or dusted the rooms.
        - id: ch01-b03
          speaker: narrator
          text: This left an unexpected gap in their days, though they had often told themselves and each other that they hated housework. Mother had no housework now, and she had stopped writing too, so she had time to give them lessons. And lessons they certainly had. No matter how lovely your teacher is, lessons are still lessons. Even at their best, they are less fun than peeling potatoes or lighting a fire.
        - id: ch01-b04
          speaker: narrator
          text: But there was another side to it. Mother had time to play again, and to make up the little rhymes she used to write for the children. Since coming to Three Chimneys, she had hardly had time for rhymes at all.
        - id: ch01-b05
          speaker: narrator
          text: Something very odd happened during lessons. Whatever each child was studying, that child wanted to study something else. While Peter worked at Latin, he wished he had Bobbie's history. Bobbie wanted Phyllis's arithmetic. Naturally, Phyllis thought Latin must be the most interesting lesson of all.
        - id: ch01-b06
          speaker: narrator
          text: One day, when they sat down for lessons, each child found a little verse waiting in that child's place. I will tell you the verses because they show how well Mother understood what children feel about things. She even knew the sort of words children themselves would use. Very few grown-ups can do that. I suppose most of them have bad memories and have forgotten what it felt like to be small. The children were meant to speak the verses themselves.
        - id: ch01-b07
          speaker: peter
          text: I used to think old Caesar was a snap. How foolish I must have been! A boy who starts on Caesar has no idea what he's getting into. Verbs are silly, stupid things. I'd rather learn the dates of kings!
        - id: ch01-b08
          speaker: roberta
          text: The worst part of my lessons is remembering which king or queen came next, with dates for every single thing they did. There are enough dates to make you sick. I wish I had arithmetic!
        - id: ch01-b09
          speaker: phyllis
          text: My slate is full of pounds and pounds of apples, and how much someone pays for them. You scratch away at the numbers until the dividend makes you cry. I'd smash my slate and shout for joy if I could do Latin like a boy!
        - id: ch01-b10
          speaker: narrator
          text: Verses like these made lessons much more cheerful. It helps when your teacher understands that learning is not easy and does not think you are stupid just because you do not know something before you have learned it.
        - id: ch01-b11
          speaker: narrator
          text: As Jim's leg improved, the children enjoyed going upstairs to sit with him while he told them stories about his life at school and all the other boys. There was Parr, whom Jim thought very poorly of, and Wigsby Minor, whose opinions he respected. Then there were three Paley brothers. The youngest was called Paley Terts, and he was always fighting.
        - id: ch01-b12
          speaker: narrator
          text: Peter drank in every one of these stories with pure delight. Mother must have listened with some interest too. One day she handed Jim a sheet of paper with a verse she had written about Parr. In a most wonderful way, she worked in Paley and Wigsby by name, every reason Jim had for disliking Parr, and Wigsby's wise opinion of the whole matter. Jim was immensely pleased. Nobody had ever written a poem especially for him. He read it until he knew the whole thing by heart. Then he sent it to Wigsby, who liked it almost as much as Jim did. Perhaps you will like it too.
        - id: ch01-b13
          speaker: jim
          text: His name is Parr. He says that he gets bread and milk for tea. He says his father killed a bear. He says his mother cuts his hair. He wears galoshes in the rain. I've heard his family call him “Pet”! He has no proper sense of shame. He told the fellows his first name.
        - id: ch01-b14
          speaker: jim
          text: He cannot keep a wicket right. A cricket ball gives him a fright. He reads indoors for hours and hours. He knows the names of horrid flowers. His French sounds just like “Mossoo,” which is a stuck-up thing to do. He will not keep cave or take his turn, and says he came to school to learn!
        - id: ch01-b15
          speaker: jim
          text: He will not play football because it hurts. He would not fight with Paley Terts. He could not whistle if he tried, and when we laughed at him, he cried! Now Wigsby Minor says that Parr is only how all new boys are. I know when I first came to school, I wasn't such a jolly fool!
        - id: ch01-b16
          speaker: narrator
          text: Jim could not understand how Mother had managed anything so clever. To the other children, it was lovely but perfectly natural. They had always known a mother who could write verses exactly as people talked, even down to that shocking last expression, which belonged entirely to Jim.
        - id: ch01-b17
          speaker: narrator
          text: Jim taught Peter chess, checkers, and dominoes. Altogether, it was a pleasant, quiet time.
        - id: ch01-b18
          speaker: narrator
          text: But Jim's leg kept getting better and better. A general feeling grew among Bobbie, Peter, and Phyllis that they ought to do something to amuse him. They did not mean another ordinary game. They wanted to arrange something truly splendid for him, but thinking of the right thing was extraordinarily hard. They thought and thought until their heads felt heavy and swollen.
        - id: ch01-b19
          speaker: peter
          text: It's no use. If none of us can think of anything, then we simply can't. Maybe something he'll enjoy will happen all by itself.
        - id: ch01-b20
          speaker: phyllis
          text: Things do happen by themselves sometimes. You don't always have to make them happen.
        - id: ch01-b21
          speaker: narrator
          text: She said this rather as though she usually arranged everything that happened in the world.
        - id: ch01-b22
          speaker: roberta
          text: I wish something would happen. Something wonderful.
        - id: ch01-b23
          speaker: narrator
          text: Exactly four days after Bobbie said that, something wonderful did happen. I wish I could tell you it was three days later, because in fairy tales, three days is always how long you wait for things to happen. But this is not a fairy story. Besides, it truly was four days and not three, and I am nothing if not strictly truthful.
        - id: ch01-b24
          speaker: narrator
          text: In those days, they hardly seemed like Railway Children at all. As time passed, each of them felt uneasy about that. One day Phyllis finally said it aloud.
        - id: ch01-b25
          speaker: phyllis
          text: Do you think the Railway misses us? We never visit it anymore.
          emotion: sad
        - id: ch01-b26
          speaker: roberta
          text: It does seem ungrateful. We loved it so much when we had no one else to play with.
        - id: ch01-b27
          speaker: peter
          text: Perks comes up all the time to ask about Jim. And the signalman's little boy is better. The signalman told me.
        - id: ch01-b28
          speaker: phyllis
          text: I didn't mean the people. I meant the dear Railway itself.
        - id: ch01-b29
          speaker: roberta
          text: What I don't like is that we stopped waving to the nine-fifteen and sending our love to Father.
        - id: ch01-b30
          speaker: narrator
          text: This was Tuesday, the fourth day.
        - id: ch01-b31
          speaker: phyllis
          text: Then let's start again.
        - id: ch01-b32
          speaker: narrator
          text: And so they did. Since servants had come to the house and Mother had stopped writing, everything felt so different that their first strange morning at Three Chimneys seemed years ago. That was the morning they had risen terribly early, burned the bottom out of the kettle, eaten apple pie for breakfast, and seen the Railway for the first time.
        - id: ch01-b33
          speaker: narrator
          text: It was September now. The grass on the slope down to the Railway was dry and crisp. Long, thin blades shone like golden wire. Blue harebells trembled on tough little stems. Flat lilac Gipsy roses opened wide, and the golden stars of St. John's Wort gleamed beside the pool halfway down the hill. Bobbie gathered a large handful. She imagined how pretty the flowers would look on the green-and-pink blanket of silk scraps that covered Jim's poor broken leg.
        - id: ch01-b34
          speaker: peter
          text: Hurry, or we'll miss the nine-fifteen!
        - id: ch01-b35
          speaker: phyllis
          text: I'm hurrying as fast as I can. Oh, bother! My bootlace has come undone again!
        - id: ch01-b36
          speaker: peter
          text: Someday you'll be walking up the church aisle to get married, and your lace will come loose. The man you're marrying will trip over it and smash his nose on the fancy floor. Then you'll refuse to marry him and have to be an old maid.
        - id: ch01-b37
          speaker: phyllis
          text: I won't. I'd rather marry someone with a smashed nose than marry no one at all.
        - id: ch01-b38
          speaker: roberta
          text: It would still be awful. He couldn't smell the flowers at the wedding. Just imagine!
        - id: ch01-b39
          speaker: peter
          text: Forget the wedding flowers! Look, the signal is down. Run!
        - id: ch01-b40
          speaker: narrator
          text: They ran. Once again they waved their handkerchiefs at the nine-fifteen, without caring in the least whether those handkerchiefs were clean.
        - id: ch01-b41
          speaker: roberta
          text: Take our love to Father!
        - id: ch01-b42
          speakers: [peter, phyllis]
          ensemble: duo
          text: Take our love to Father!
        - id: ch01-b43
          speaker: narrator
          text: The old gentleman waved from the window of his first-class carriage. He waved with tremendous energy. That alone was not strange, because he always waved. The remarkable thing was that every window came alive. Handkerchiefs fluttered. Newspapers dipped and rose. Hands swung wildly. The train rushed past in a roar and a rustle, making the little stones beneath it jump and dance. Then it was gone, and the children stared at one another.
        - id: ch01-b44
          speaker: peter
          text: Well!
          emotion: surprised
        - id: ch01-b45
          speaker: roberta
          text: Well!
          emotion: surprised
        - id: ch01-b46
          speaker: phyllis
          text: Well!
          emotion: surprised
        - id: ch01-b47
          speaker: peter
          text: What in the world was that about?
        - id: ch01-b48
          speaker: narrator
          text: He did not really expect an answer.
        - id: ch01-b49
          speaker: roberta
          text: I don't know. Maybe the old gentleman asked everyone at his station to watch for us and wave. He knew how much we'd like it!
        - id: ch01-b50
          speaker: narrator
          text: Strange as it sounds, that was exactly what had happened. The old gentleman was very well known and respected at his own station. That morning he arrived early and waited beside the door. A young man stood there holding the fascinating little machine that clips the tickets. The old gentleman said something to every single passenger who came through that door.
        - id: ch01-b51
          speaker: narrator
          text: Each passenger nodded at what the old gentleman said. Those nods showed every kind of feeling. Some people were surprised, some interested, some doubtful, some cheerfully pleased, and some agreed rather grumpily. Then each person went onto the platform and read one particular part of the newspaper. Once the passengers climbed aboard, they repeated the old gentleman's message to the people already sitting in the cars. Those people looked at their newspapers too. They seemed astonished and, for the most part, delighted.
        - id: ch01-b52
          speaker: narrator
          text: So when the train reached the fence where the three children stood, hands, newspapers, and handkerchiefs waved madly in the air. That entire side of the train fluttered white, like the moving pictures of the King's Coronation shown at Maskelyne and Cook's. The sight was so wild and wonderful that, to the children, it almost seemed that the train itself had come alive. At last, the dear Railway was answering all the love they had given it so freely and for so long.
        - id: ch01-b53
          speaker: peter
          text: That was extraordinarily rum!
        - id: ch01-b54
          speaker: phyllis
          text: Extraordinarily!
        - id: ch01-b55
          speaker: roberta
          text: Didn't the old gentleman's waving seem more meaningful than usual?
        - id: ch01-b56
          speakers: [peter, phyllis]
          ensemble: duo
          text: No.
        - id: ch01-b57
          speaker: roberta
          text: I thought it did. It was almost as if he were trying to explain something with his newspaper.
        - id: ch01-b58
          speaker: peter
          text: Explain what?
        - id: ch01-b59
          speaker: narrator
          text: It was a perfectly natural question.
        - id: ch01-b60
          speaker: roberta
          text: I don't know. But I feel so strange, as if something is about to happen.
        - id: ch01-b61
          speaker: peter
          text: What is about to happen is that Phyllis's stocking is coming down.
        - id: ch01-b62
          speaker: narrator
          text: It was only too true. In all the excitement of the wild waving to the nine-fifteen, the suspender holding up Phyllis's stocking had broken. Bobbie's handkerchief served as first aid for the injury, and then all three children went home.
        - id: ch01-b63
          speaker: narrator
          text: Lessons were even harder than usual for Bobbie that day. She made a dreadful mess of a simple problem about sharing forty-eight pounds of meat and thirty-six pounds of bread among a hundred and forty-four hungry children. Mother began to look worried.
        - id: ch01-b64
          speaker: mother
          text: Are you feeling all right, dear?
        - id: ch01-b65
          speaker: roberta
          text: I don't know. I don't know what I'm feeling. I'm not being lazy, Mother. Could I please miss lessons today? I feel as if I need to be somewhere all by myself.
        - id: ch01-b66
          speaker: mother
          text: Yes, of course you may, but—
        - id: ch01-b67
          speaker: narrator
          text: Bobbie dropped her slate. It cracked straight across the little green mark that was so useful when she wanted to draw patterns around it. The slate was never the same again. Bobbie did not wait to pick it up. She rushed from the room. Mother caught her in the hall, feeling blindly among the umbrellas and waterproof coats as she searched for her garden hat.
        - id: ch01-b68
          speaker: mother
          text: What is it, sweetheart? You don't feel sick, do you?
        - id: ch01-b69
          speaker: narrator
          text: Mother brushed Bobbie's hair back from her forehead.
        - id: ch01-b70
          speaker: roberta
          text: I don't know. But I want to be alone and find out whether my head really is all silly and my insides are all twisty and squirming.
        - id: ch01-b71
          speaker: mother
          text: Maybe you should lie down.
        - id: ch01-b72
          speaker: roberta
          text: I think I'd feel more alive out in the garden.
        - id: ch01-b73
          speaker: narrator
          text: But Bobbie could not stay in the garden. The hollyhocks, the asters, and the late roses all seemed to be waiting for something to happen. It was one of those bright, still autumn days when the whole world seems to be waiting too.
        - id: ch01-b74
          speaker: narrator
          text: Bobbie could not wait.
        - id: ch01-b75
          speaker: roberta
          text: I'll go to the station. I can talk to Perks and ask how the signalman's little boy is doing.
        - id: ch01-b76
          speaker: narrator
          text: On her way, she met the old lady from the post office. The woman hugged and kissed her. To Bobbie's surprise, she said almost nothing.
        - id: ch01-b77
          speaker: postmistress
          text: God bless you, love. Now run along.
        - id: ch01-b78
          speaker: narrator
          text: The draper's boy had sometimes treated Bobbie with more scorn than courtesy. Today he touched his cap and offered an astonishing greeting.
        - id: ch01-b79
          speaker: drapers_boy
          text: Good morning, miss. A very good morning, I'm sure.
        - id: ch01-b80
          speaker: narrator
          text: Then the blacksmith approached with an open newspaper. His behavior was stranger still. He was not a man who smiled much, but now he wore a huge grin and waved the paper at Bobbie from far down the road. She wished him good morning as they passed.
        - id: ch01-b81
          speaker: blacksmith
          text: And a good morning to you, miss! May you have many more. I wish you joy, truly I do!
          emotion: happy
        - id: ch01-b82
          speaker: roberta
          text: Oh! Something really is going to happen. I know it is. Everyone is acting so strangely, just like people in a dream.
        - id: ch01-b83
          speaker: narrator
          text: Her heart began to beat faster.
        - id: ch01-b84
          speaker: narrator
          text: At the station, the Station Master seized her hand and shook it warmly. In fact, he worked her arm up and down like the handle of a pump. He gave no reason at all for such an unusually enthusiastic greeting.
        - id: ch01-b85
          speaker: station_master
          text: The eleven-fifty-four is running a little late, miss. Lots of extra luggage at holiday time.
        - id: ch01-b86
          speaker: narrator
          text: He hurried into his private inner room, where even Bobbie did not dare follow. Perks was nowhere in sight, so she shared the empty platform with the Station Cat. The tortoiseshell cat usually kept to herself, but today she came over with her back arched, her tail waving, and a great rumbling purr. She rubbed against Bobbie's brown stockings.
        - id: ch01-b87
          speaker: roberta
          text: Goodness! Everyone is so kind today. Even you, Pussy.
        - id: ch01-b88
          speaker: narrator
          text: Bobbie bent down to stroke her. Perks did not appear until the signal announced the eleven-fifty-four. Like everyone else that morning, he carried a newspaper.
        - id: ch01-b89
          speaker: perks
          text: Hello! There you are. If this is the train, they've worked fast! God bless you, my dear. I read it in the paper, and I don't believe I've ever been happier about anything in my life!
          emotion: happy
        - id: ch01-b90
          speaker: narrator
          text: He looked at Bobbie for a moment.
        - id: ch01-b91
          speaker: perks
          text: I must have one, miss, and I hope you won't mind on a day like today!
        - id: ch01-b92
          speaker: narrator
          text: He kissed one cheek and then the other.
        - id: ch01-b93
          speaker: perks
          text: You're not offended, are you? I haven't taken too much of a liberty? Not on a day like this?
        - id: ch01-b94
          speaker: roberta
          text: No, no, of course not, dear Mr. Perks. We love you as much as if you were our uncle. But what do you mean by a day like this?
        - id: ch01-b95
          speaker: perks
          text: A day like this one! I told you, I saw it in the newspaper.
        - id: ch01-b96
          speaker: roberta
          text: Saw what in the newspaper?
        - id: ch01-b97
          speaker: narrator
          text: But the eleven-fifty-four was already steaming into the station. The Station Master was looking toward every place where Perks was not and ought to have been, so Perks hurried away. Bobbie was left standing alone on the platform. From beneath the bench, the Station Cat watched her with friendly golden eyes.
        - id: ch01-b98
          speaker: narrator
          text: Of course, you already know exactly what was coming. Bobbie was not so clever. Her heart was full of that vague, confused, expectant feeling that comes in dreams. I cannot tell what her heart expected. Perhaps it was the very thing that you and I know was going to happen. But her mind expected nothing at all. It had gone almost blank, and she felt only tiredness, dullness, and a great empty feeling. It was the way your body feels after a very long walk, when it is far, far past the proper time for dinner.
        - id: ch01-b99
          speaker: narrator
          text: Only three people stepped off the eleven-fifty-four. First came a countryman carrying two basketlike boxes full of live chickens. Their reddish-brown heads poked anxiously through the wicker bars. Next came Miss Peckitt, the grocer's wife's cousin. She carried a tin box and three parcels wrapped in brown paper. And then the third passenger stepped down.
        - id: ch01-b100
          speaker: roberta
          text: Oh, my Daddy! My Daddy!
          emotion: surprised
        - id: ch01-b101
          speaker: narrator
          text: Her cry went like a knife into the heart of everyone aboard the train. People leaned from the windows to look. They saw a tall, pale man with his lips pressed into a thin, tight line. A little girl clung to him with both her arms and her legs, and his arms closed tightly around her.
        - id: ch01-b102
          speaker: roberta
          text: I knew something wonderful was coming, but I never thought it would be this. Oh, my Daddy, my Daddy!
          emotion: happy
        - id: ch01-b103
          speaker: narrator
          text: They were walking up the road together.
        - id: ch01-b104
          speaker: father
          text: Didn't Mother receive my letter?
        - id: ch01-b105
          speaker: roberta
          text: There were no letters this morning. Oh, Daddy! It really is you, isn't it?
        - id: ch01-b106
          speaker: narrator
          text: He took her hand in the same firm clasp she had never forgotten. That touch answered her.
        - id: ch01-b107
          speaker: father
          text: Go inside alone, Bobbie. Tell Mother very quietly that everything is all right. They've caught the man who truly did it. Now everyone knows your father was innocent.
          emotion: calm
        - id: ch01-b108
          speaker: roberta
          text: I always knew you were innocent. Mother knew too, and so did our old gentleman.
        - id: ch01-b109
          speaker: father
          text: Yes. This is all his doing. Mother wrote and told me how you found out. She told me what you have been to her, too. My own little girl!
          emotion: happy
        - id: ch01-b110
          speaker: narrator
          text: They stopped there for a moment.
        - id: ch01-b111
          speaker: narrator
          text: Now I can see them crossing the field together. Bobbie goes into the house alone, trying to keep her eyes from speaking before her lips can find the right words. She must tell Mother, very quietly, that the sorrow, the struggle, and the long separation are over and done. Father has come home at last.
        - id: ch01-b112
          speaker: narrator
          text: Father walks in the garden and waits. He looks at the flowers. To eyes that have seen only paving stones, gravel, and one poor, grudging patch of grass through all the months of spring and summer, every flower is a miracle. But his eyes keep turning toward the house. Soon he leaves the garden and stands outside the nearest entrance. It is the back door. Across the yard, swallows circle in the air. They are preparing to fly away from cold winds and sharp frost, toward the land where summer never ends. These are the same swallows for whom the children made the little clay nests.
        - id: ch01-b113
          speaker: narrator
          text: The house door opens. Bobbie calls to him.
        - id: ch01-b114
          speaker: roberta
          text: Come in, Daddy. Come in!
          emotion: happy
        - id: ch01-b115
          speaker: narrator
          text: He goes inside, and the door closes behind him. I think we will not open that door or follow him. Just now, they do not need us there. It will be best for us to go quickly and quietly away. At the far end of the field, among the thin golden spikes of grass, the harebells, the Gipsy roses, and the St. John's Wort, we may take one last look over our shoulders. There stands the white house, where neither we nor anyone else is wanted now.
