audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细微幽默和体恤
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中
    bobbie:
      display_name: 博比
      tts:
        delivery: 真诚敏锐，关切时急切而坚定
        timbre: 清亮温暖的少女声
        pace: 自然偏快
        pitch: 中高
    peter:
      display_name: 彼得
      tts:
        delivery: 爽直自信，兴奋时干脆有力
        timbre: 明亮的少年声
        pace: 明快
        pitch: 中高
    phyllis:
      display_name: 菲莉丝
      tts:
        delivery: 天真活泼，想象丰富
        timbre: 轻盈稚嫩的女孩声
        pace: 轻快
        pitch: 高
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔镇定，讲到苦难时克制而悲悯
        timbre: 温润清晰
        pace: 从容
        pitch: 中
    doctor:
      display_name: 福里斯特医生
      tts:
        delivery: 亲切务实，偶尔带温和玩笑
        timbre: 沉稳温暖
        pace: 适中
        pitch: 中低
    mrs_viney:
      display_name: 维尼太太
      tts:
        delivery: 热心直爽，说起见闻来滔滔不绝
        timbre: 朴实略粗的成年女声
        pace: 自然偏快
        pitch: 中音
    old_gentleman:
      display_name: 老先生
      tts:
        delivery: 慈祥风趣，说话得体又亲切
        timbre: 温厚清朗的老年男声
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 楼下的“接骨”游戏
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那天，妈妈再也没能回去写作。孩子们带回三烟囱的那只红毛衣“猎犬”得先安顿到床上。医生随后赶来，替他接骨，弄得他痛苦极了。妈妈一直陪着他，他才稍微好受一点。不过照维尼太太的说法，“再好也好不到哪里去”。
        - id: ch01-b02
          speaker: narrator
          text: 孩子们全都坐在楼下的客厅里等着。他们看不见楼上发生的事，只能听见福里斯特医生的靴子，在卧室地板上一遍遍走来走去。有时候，楼上还会传来一两声痛苦的呻吟。
        - id: ch01-b03
          speaker: bobbie
          text: 真叫人受不了。福里斯特医生要是能快一点就好了。可怜的吉姆！
        - id: ch01-b04
          speaker: peter
          text: 是挺可怕，不过也挺刺激。医生干活的时候，想让谁留下就让谁留下，真气派。要是能亲眼看一次接骨，我得多高兴啊。听说骨头对上时，会咔嚓咔嚓地响。
        - id: ch01-b05
          speakers: [bobbie, phyllis]
          ensemble: duo
          text: 别说了！
        - id: ch01-b06
          speaker: peter
          text: 这算什么？回家路上，你们不是还想当红十字会护士吗？连骨头响都不敢听，上了战场怎么办？到时不光得听，没准两条胳膊一直到手肘都泡在血里，还得……
        - id: ch01-b07
          speaker: bobbie
          text: 住口！你根本不知道，这些话让我多难受。
          emotion: angry
        - id: ch01-b08
          speaker: phyllis
          text: 我也难受。
        - id: ch01-b09
          speaker: narrator
          text: 博比的脸白得厉害，菲莉丝却涨得通红。
        - id: ch01-b10
          speaker: peter
          text: 胆小鬼！
        - id: ch01-b11
          speaker: bobbie
          text: 我才不胆小。你的脚被耙子扎伤时，我和菲尔都帮妈妈照顾过你。你明明知道。
        - id: ch01-b12
          speaker: peter
          text: 所以嘛，你们正好该练练。我要是每天花半小时，给你们讲断骨头和人的五脏六腑，你们听久了就习惯了。那才叫有好处。
        - id: ch01-b13
          speaker: narrator
          text: 楼上忽然传来挪椅子的声音。
        - id: ch01-b14
          speaker: peter
          text: 听见没有？那就是骨头咔嚓一响。
        - id: ch01-b15
          speaker: phyllis
          text: 求你别说了。博比真的不想听。
        - id: ch01-b16
          speaker: peter
          text: 那我就讲讲医生怎么接骨。
        - id: ch01-b17
          speaker: narrator
          text: 真不知彼得怎么突然变得这么讨厌。也许是因为他早些时候太体贴、太善良，现在非得变个样子。这叫反弹。人偶尔会这样，做了一阵子比平常更好的孩子，忽然就凶猛地发作一回，坏得一点也不像个好孩子。
        - id: ch01-b18
          speaker: peter
          text: 他们先把断了骨头的人捆得紧紧的，免得他乱动，碍着医生干活。然后一个人按住他的头，另一个抓住那条断腿，用力拉到骨头对准。别忘了，还会咔嚓一声！接着包好那条腿。要不，咱们玩接骨吧！
        - id: ch01-b19
          speaker: phyllis
          text: 哦，不要！
        - id: ch01-b20
          speaker: bobbie
          text: 好啊，就这么玩。我是医生，菲尔是护士，你来当断骨头的人。你没穿衬裙，腿最好摆弄。
        - id: ch01-b21
          speaker: peter
          text: 我去拿夹板和绷带。你们快把受苦的病床准备好。
        - id: ch01-b22
          speaker: narrator
          text: 他们搬家时用过的箱子，捆箱绳全都留了下来，收在地窖的一只木板箱里。彼得跑去翻找，最后拖回来一大团乱七八糟的绳子，还拿了两块木板当夹板。菲莉丝看着这些道具，兴奋得咯咯直笑。
        - id: ch01-b23
          speaker: peter
          text: 好，开始吧！
        - id: ch01-b24
          speaker: narrator
          text: 彼得躺到长椅上，故意呻吟得惨不忍闻。博比已经用绳子把他和长椅一圈圈缠在一起。
        - id: ch01-b25
          speaker: bobbie
          text: 别叫那么响。菲尔，帮我把绳子拉紧。
        - id: ch01-b26
          speaker: peter
          text: 别拉这么紧。你们要把我另一条腿也弄断了。
        - id: ch01-b27
          speaker: narrator
          text: 博比一声不响，只管继续缠，彼得身上的绳子越来越多。
        - id: ch01-b28
          speaker: peter
          text: 够了，我连一下都动不了啦。哎哟，我可怜的腿！
        - id: ch01-b29
          speaker: bobbie
          text: 你当真动不了？
        - id: ch01-b30
          speaker: peter
          text: 一点也动不了。要不要假装伤口还在呼呼流血？
        - id: ch01-b31
          speaker: bobbie
          text: 你爱假装什么都行。我和菲尔现在要走了。除非你答应，以后没有我们准许，绝对、绝对不再跟我们讲血和伤口，否则我们就不给你松绑。菲尔，走吧！
        - id: ch01-b32
          speaker: peter
          text: 你这个坏蛋！我永远不答应，永远不！我要大声喊，把妈妈叫来。
          emotion: angry
        - id: ch01-b33
          speaker: bobbie
          text: 你喊吧，顺便告诉她，我们为什么捆你。我才不是坏蛋，彼得。我们请你住口，可你偏不听，而且……
        - id: ch01-b34
          speaker: peter
          text: 呃，这根本不是你自己想出来的。你是跟《斯托基》学的！
        - id: ch01-b35
          speaker: narrator
          text: 博比和菲尔带着沉默的尊严退了场，刚到门口就撞见医生。他搓着手走进来，脸上颇有几分得意。
        - id: ch01-b36
          speaker: doctor
          text: 好了，那件事办完了。断口很整齐，我看很快就能长好。那小伙子也真勇敢。咦，这又是怎么回事？你们在玩抓俘虏吗？
        - id: ch01-b37
          speaker: narrator
          text: 医生看见彼得被捆在长椅上，像只小耗子似的一动不动，便微微扬起了眉毛。他怎么也没想到，楼上正在接断骨，博比会在楼下玩这种游戏。
        - id: ch01-b38
          speaker: bobbie
          text: 不是抓俘虏。我们在玩接骨。彼得是断骨头的人，我是医生。
        - id: ch01-b39
          speaker: doctor
          text: 那我可得说，这游戏也太冷酷、太无情了。楼上发生了什么，你们一点都想不到吗？那可怜的小伙子满头是汗，死死咬着嘴唇才没喊出声。他的腿只要碰一下，都会疼得要命，还……
          emotion: angry
        - id: ch01-b40
          speaker: phyllis
          text: 我看该捆起来的是你。你跟彼得一样坏……
          emotion: angry
        - id: ch01-b41
          speaker: bobbie
          text: 嘘，菲尔。对不起，医生，可我们真的没那么无情。
        - id: ch01-b42
          speaker: peter
          text: 无情的人大概是我。行了，博比，别摆出高尚的样子替我遮掩，我不需要。我只是不停讲血和伤口，想训练她们当红十字会护士。她们叫我别说，我偏要说。
          emotion: angry
        - id: ch01-b43
          speaker: doctor
          text: 后来呢？
        - id: ch01-b44
          speaker: narrator
          text: 福里斯特医生坐了下来，让彼得把后来的事说完。
        - id: ch01-b45
          speaker: peter
          text: 后来我就说，“咱们玩接骨吧”。那当然是句胡话。我知道博比不会答应，只是想逗她。可她一说“好”，我只能陪她玩到底。于是她们就把我捆起来。她们是从《斯托基》里学的。我觉得这太卑鄙了。
        - id: ch01-b46
          speaker: narrator
          text: 彼得好不容易翻了个身，把脸藏到长椅的木靠背上。
        - id: ch01-b47
          speaker: bobbie
          text: 我以为这件事只有我们知道。我根本没想到医生会进来。而且听你讲血和伤口，真的会让我难受得要命。我们捆你只是开个玩笑。我来给你松绑，彼得。
          emotion: angry
        - id: ch01-b48
          speaker: peter
          text: 你们就是永远不解开，我也不在乎。要是这就是你所谓的玩笑……
          emotion: angry
        - id: ch01-b49
          speaker: doctor
          text: 要是换了我，我会赶在你们妈妈下楼前把绳子解开。你们现在不想让她操心，对不对？
        - id: ch01-b50
          speaker: peter
          text: 可我没答应过不再讲伤口，你们记住。
          emotion: angry
        - id: ch01-b51
          speaker: narrator
          text: 医生其实也不大知道，这时候该说什么才好。博比和菲莉丝开始解绳结。博比摸索着长椅底下的大结，凑近彼得，压低了声音。
        - id: ch01-b52
          speaker: bobbie
          text: 真对不起，彼得。可你要是知道，你都快把我恶心坏了……
        - id: ch01-b53
          speaker: peter
          text: 我告诉你，你们也把我恶心得够呛。
          emotion: angry
        - id: ch01-b54
          speaker: narrator
          text: 彼得抖掉已经松开的绳子，站了起来。
        - id: ch01-b55
          speaker: doctor
          text: 我顺路过来问问，你们谁肯跟我去一趟诊所。你们妈妈马上就要用几样东西，可我的伙计今天放假看马戏去了。彼得，你来吗？
        - id: ch01-b56
          speaker: narrator
          text: 彼得没有回答，连两个妹妹也不肯看一眼。他只是沉默地跟着福里斯特医生，一起离开了家。
    - id: ch02
      title: 医生的科学道理
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两个人一路沉默。走到三烟囱的田地通往大路的栅栏门前，彼得才开口。
        - id: ch02-b02
          speaker: peter
          text: 药箱给我拿吧。嚄，好重啊。里面都装了什么？
        - id: ch02-b03
          speaker: doctor
          text: 哦，有刀子、柳叶刀，还有各种能把人弄疼的器械。也有一瓶乙醚。刚才我非得给那小伙子用乙醚不可，他实在疼得太厉害了。
        - id: ch02-b04
          speaker: narrator
          text: 彼得又不说话了。
        - id: ch02-b05
          speaker: doctor
          text: 跟我讲讲，你们是怎么发现他的？
        - id: ch02-b06
          speaker: narrator
          text: 彼得从头到尾讲了一遍。接着，福里斯特医生也给他讲了好些勇敢救人的故事。正如彼得常说的，跟这位医生聊天实在有趣。
        - id: ch02-b07
          speaker: narrator
          text: 到了诊所，彼得这回可有了机会，能比往常看得更仔细。医生的天平、显微镜、秤和量杯，他一样也没错过，全都细细看了一遍。等彼得要带回家的东西都准备妥当，医生忽然说，他还有几句话要讲。
        - id: ch02-b08
          speaker: doctor
          text: 我想多管一点闲事，跟你说几句话。你不会见怪吧？
        - id: ch02-b09
          speaker: narrator
          text: 彼得心想，这下该挨训了。他一直还在奇怪，自己怎么居然逃过了一顿责骂。
        - id: ch02-b10
          speaker: doctor
          text: 我要说的是几句科学道理。
        - id: ch02-b11
          speaker: peter
          text: 好。
        - id: ch02-b12
          speaker: narrator
          text: 彼得嘴里答应着，手上还在摆弄医生那块菊石化石镇纸。
        - id: ch02-b13
          speaker: doctor
          text: 你看，男孩和女孩，也就是小一点的男人和女人。我们男人比她们结实，也更经得起磕碰。
        - id: ch02-b14
          speaker: narrator
          text: 彼得很喜欢医生说“我们”。说不定医生早就知道，他会喜欢这个说法。
        - id: ch02-b15
          speaker: doctor
          text: 我们力气也大。有些事会伤到她们，落在我们身上却算不了什么。你知道，男孩不能打女孩。
        - id: ch02-b16
          speaker: peter
          text: 那还用说！
          emotion: angry
        - id: ch02-b17
          speaker: doctor
          text: 就算她是你的亲妹妹，你也不能打她。女孩的身体比我们弱得多。她们必须是这样。不然的话，小宝宝们就要受苦了。所以，雄性动物都很善待雌性动物，从不跟它们打架。
        - id: ch02-b18
          speaker: peter
          text: 这我知道。两只公兔子碰到一起，你要是不拦，它们能打上一整天。可它们不会伤害母兔子。
        - id: ch02-b19
          speaker: doctor
          text: 对。哪怕是地地道道的野兽，像狮子和大象，对雌兽也很温柔。我们也该这样。
        - id: ch02-b20
          speaker: peter
          text: 我明白了。
        - id: ch02-b21
          speaker: doctor
          text: 她们的心也更柔软。有些事我们根本不在意，却会深深伤到她们。所以男人得特别小心，不光要管住拳头，也得管好自己说出口的话。不过，她们可勇敢得很。想想博比，她一个人留在隧道里，陪着那个可怜的小伙子。说来也怪，一个女人越柔软，越容易受伤，真遇上非做不可的事，她反而越能逼自己撑住。我见过一些非常勇敢的女人。你妈妈就是一个。
        - id: ch02-b22
          speaker: narrator
          text: 说到这里，医生忽然停了下来。
        - id: ch02-b23
          speaker: peter
          text: 是的。
        - id: ch02-b24
          speaker: doctor
          text: 好了，我要说的就是这些。请原谅我提起这件事。可人又不是一生下来就什么都懂，总得有人告诉他。你明白我的意思，对吧？
        - id: ch02-b25
          speaker: peter
          text: 明白。我很后悔，真的！
        - id: ch02-b26
          speaker: doctor
          text: 你当然会后悔。人只要明白了，马上就会后悔。这些科学事实，本来就该让每个人都学一学。再见！
        - id: ch02-b27
          speaker: narrator
          text: 这番话说完，两个人热烈地握了握手。彼得已经真正明白了医生的意思。
    - id: ch03
      title: 真正讲和
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得回到家，两个妹妹疑疑惑惑地望着他。
        - id: ch03-b02
          speaker: peter
          text: 讲和了。福里斯特医生跟我讲了一番科学道理。不，我讲给你们也没用，你们听不懂。总之，你们女孩都是可怜、柔软、虚弱、胆小的东西，跟兔子一模一样。所以我们男人只好忍着你们。医生还说，你们是雌兽。这篮子是我拿上楼给妈妈，还是你们拿？
        - id: ch03-b03
          speaker: narrator
          text: 彼得把篮子重重放在桌上。
        - id: ch03-b04
          speaker: phyllis
          text: 我知道男孩是什么。男孩就是世上最讨厌、最没礼貌的……
          emotion: angry
        - id: ch03-b05
          speaker: bobbie
          text: 他们有时也很勇敢。
        - id: ch03-b06
          speaker: peter
          text: 啊，你是说楼上那个小伙子？我明白了。菲尔，你继续骂吧。不管你说什么，我都会忍着。谁叫你是个可怜、虚弱、胆小、柔软的……
        - id: ch03-b07
          speaker: phyllis
          text: 等我揪住你的头发，看你还忍不忍得住！
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: 菲莉丝猛地扑向彼得，博比把她拉住了。
        - id: ch03-b09
          speaker: bobbie
          text: 他刚才说了“讲和”。
        - id: ch03-b10
          speaker: narrator
          text: 彼得拎起篮子，昂着头大步走了出去。等他走远，博比才压低声音。
        - id: ch03-b11
          speaker: bobbie
          text: 你还不明白吗？其实他已经后悔了，只是不肯直说。我们也跟他说声对不起吧。
        - id: ch03-b12
          speaker: phyllis
          text: 那也太像假正经的乖孩子了。他还说我们是雌兽，又柔弱又胆小……
        - id: ch03-b13
          speaker: bobbie
          text: 那就让他看看，我们才不怕他把我们当成假正经的乖孩子。再说，我们又不比他更像野兽。
        - id: ch03-b14
          speaker: narrator
          text: 彼得回来时，下巴依然抬得高高的。
        - id: ch03-b15
          speaker: bobbie
          text: 彼得，我们把你捆起来，这件事是我们不对。
        - id: ch03-b16
          speaker: peter
          text: 我早就知道你们会后悔。
        - id: ch03-b17
          speaker: narrator
          text: 彼得把架子摆得又僵硬又高高在上。这可真难忍。不过……
        - id: ch03-b18
          speaker: bobbie
          text: 是啊，我们的确后悔了。这下双方的名誉都保住了。
        - id: ch03-b19
          speaker: peter
          text: 明明是我先说要讲和的。
        - id: ch03-b20
          speaker: bobbie
          text: 那就真正讲和吧。来，菲尔，我们去准备茶点。彼得，你可以铺桌布。
        - id: ch03-b21
          speaker: narrator
          text: 三个孩子就这样一起准备茶点，又一起吃完了茶。等到和平终于真正恢复时，已经是茶后洗杯子的时候了。
        - id: ch03-b22
          speaker: phyllis
          text: 福里斯特医生不会真的说我们是雌兽吧？
        - id: ch03-b23
          speaker: peter
          text: 他真这么说了。不过我想，他的意思是，我们男人也是野兽。
        - id: ch03-b24
          speaker: phyllis
          text: 他说话可真怪！
        - id: ch03-b25
          speaker: narrator
          text: 菲莉丝说着，打碎了一只杯子。
    - id: ch04
      title: 妈妈写的书
      blocks:
        - id: ch04-b01
          speaker: peter
          text: 妈妈，我可以进来吗？
        - id: ch04-b02
          speaker: narrator
          text: 彼得站在妈妈的工作室门外。妈妈坐在桌边，面前点着两支蜡烛。灰蓝色的天空清澈得很，几颗星星已经闪了起来。衬着天光，烛焰显出橙色和紫色。
        - id: ch04-b03
          speaker: mother
          text: 进来吧，亲爱的。出什么事了吗？
        - id: ch04-b04
          speaker: narrator
          text: 妈妈答应时有些心不在焉。她没有立刻回头，又在纸上写了几个字，然后才放下笔，把已经写好的信小心折起来。
        - id: ch04-b05
          speaker: mother
          text: 我刚才在给吉姆的祖父写信。你知道，他就住在附近。
        - id: ch04-b06
          speaker: peter
          text: 知道，您喝茶时说过。我正想跟您说这件事。您非给他写信不可吗？我们不能把吉姆留下，等他全好了再告诉家里人吗？他们一定会大吃一惊。
        - id: ch04-b07
          speaker: mother
          text: 嗯，是啊，我想他们的确会大吃一惊。
          emotion: happy
        - id: ch04-b08
          speaker: peter
          text: 女孩当然也还不错，我不是说她们不好。可我真想偶尔有另一个男孩，能跟我说说话。
        - id: ch04-b09
          speaker: mother
          text: 我明白，亲爱的。你一个人是很闷，可我也没办法。也许明年我能送你去学校。你会喜欢的，对不对？
        - id: ch04-b10
          speaker: peter
          text: 我的确挺想念那些男生。可吉姆要是腿好了还能留下，我们就能好好玩了。
        - id: ch04-b11
          speaker: mother
          text: 这我一点也不怀疑。也许他真能留下。可你知道，我们并不富裕。他需要的东西，我没钱样样买给他，而且他还得有人照料。
        - id: ch04-b12
          speaker: peter
          text: 您不能照顾他吗？妈妈，您照顾人可好了。
        - id: ch04-b13
          speaker: mother
          text: 这句夸奖真好听，彼得。可我没办法一边照顾病人，一边又写作。这才是最糟的地方。
        - id: ch04-b14
          speaker: peter
          text: 那么，您非得把信寄给他祖父吗？
        - id: ch04-b15
          speaker: mother
          text: 当然要寄，也得写信给他的校长。我们已经给两边发过电报，可还是得写信。他们一定急坏了。
        - id: ch04-b16
          speaker: peter
          text: 为什么不让他祖父花钱雇个护士？那就太棒了。我猜那个老头儿一定有花不完的钱。书里的祖父总是富得流油。
        - id: ch04-b17
          speaker: mother
          text: 这一位可不在书里，所以我们别盼着他身边会流出多少油来。
        - id: ch04-b18
          speaker: peter
          text: 我说，要是我们全都活在一本书里，而那本书又是您写的，那该多好。您可以让各种好事都发生。吉姆的腿一下就长好了，明天什么事也没有。您还能让爸爸很快回家，还能……
        - id: ch04-b19
          speaker: mother
          text: 你很想爸爸吗？
        - id: ch04-b20
          speaker: narrator
          text: 彼得觉得，妈妈的语气忽然有些冷淡。
        - id: ch04-b21
          speaker: peter
          text: 想得要命。
          emotion: sad
        - id: ch04-b22
          speaker: narrator
          text: 妈妈把第二封信装进信封，写上地址。
        - id: ch04-b23
          speaker: peter
          text: 不只是因为他是爸爸。现在他不在，家里除了我，就没有别的男人了。所以我才那么想让吉姆留下。妈妈，您不想写一本把我们全都写进去的书吗？然后让爸爸早点回家？
        - id: ch04-b24
          speaker: narrator
          text: 妈妈忽然伸手搂住彼得，一声不响地紧紧抱了他一会儿。
        - id: ch04-b25
          speaker: mother
          text: 想想看，我们正活在上帝写的一本书里，这不也很好吗？要是换成我来写，我也许会写错。可是上帝知道，怎么才能让这个故事以最恰当、对我们最好的方式结束。
        - id: ch04-b26
          speaker: peter
          text: 妈妈，您真的相信吗？
        - id: ch04-b27
          speaker: mother
          text: 是的，我相信。我几乎一直都信，除非我伤心得什么都信不动了。可就算那时我信不动，我也知道这是真的，还会努力让自己相信。你不知道我有多努力，彼得。现在，把信送到邮局去吧。我们别再难过了。勇敢些，勇敢些！勇气是所有美德里最了不起的一种！我想，吉姆至少还会在这里住两三个星期。
          emotion: calm
        - id: ch04-b28
          speaker: narrator
          text: 那天接下来的时间里，彼得乖得简直像个天使。他一直那么听话，反倒让博比很不放心，甚至担心他是不是快要病了。好在第二天早上，博比看见彼得又变回了从前的样子。他把菲莉丝的头发编到了椅背上。博比看到这一幕，才终于彻底放下心来。
    - id: ch05
      title: 猎犬的祖父
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 早餐后不久，有人敲响了门。为了欢迎吉姆住进家里，孩子们正在卖力擦亮黄铜烛台。
        - id: ch05-b02
          speaker: mother
          text: 一定是医生。我去开门。把厨房门关上，你们现在这副样子可没法见人。
        - id: ch05-b03
          speaker: narrator
          text: 来的却不是医生。孩子们听见那人说话，又听着他的靴子一步步走上楼，马上就发现了。那阵靴声非常陌生，可那个嗓音，大家都肯定以前在哪里听过。过了好一阵，靴声和说声也没有再从楼上下来。他们在心里一遍遍地猜，还忍不住开口问对方，来的到底会是谁呢？
        - id: ch05-b04
          speaker: peter
          text: 也许福里斯特医生遇上了拦路强盗，被打得半死，所以发电报叫了个人来顶班。维尼太太，你不是说过，他出门度假时，会找附近的医生替他吗？
        - id: ch05-b05
          speaker: mrs_viney
          text: 是说过，亲爱的。
        - id: ch05-b06
          speaker: phyllis
          text: 更可能是他突然抽搐，倒在地上，怎么救都救不活了。这个人是他的伙计，特地来把噩耗告诉妈妈。
        - id: ch05-b07
          speaker: peter
          text: 胡说！妈妈才不会把福里斯特医生的马夫带进吉姆的卧室。她干吗要这么做？听，门开了，他们要下楼了。我把门开条缝。
        - id: ch05-b08
          speaker: narrator
          text: 彼得说做就做。博比觉得这分明是偷听。
        - id: ch05-b09
          speaker: peter
          text: 这才不是偷听。只要脑子正常，就不会站在楼梯上讲秘密。妈妈也不可能跟福里斯特医生的马夫讲什么秘密。再说，说来的是马夫的人可是你。
        - id: ch05-b10
          speaker: mother
          text: 博比。
        - id: ch05-b11
          speaker: narrator
          text: 孩子们打开厨房门，看见妈妈正从楼梯栏杆上俯下身来。
        - id: ch05-b12
          speaker: mother
          text: 吉姆的祖父来了。你们洗干净手和脸，就能去见他。他想见见你们！
        - id: ch05-b13
          speaker: narrator
          text: 卧室门又关上了。
        - id: ch05-b14
          speaker: peter
          text: 瞧吧，我们怎么就没想到这个！维尼太太，请给我们一点热水。我的脸黑得跟你的帽子一样。
        - id: ch05-b15
          speaker: narrator
          text: 三个孩子的确脏极了。擦黄铜烛台的东西只会把烛台擦干净，绝不会把擦烛台的人也弄干净。他们急急忙忙地打肥皂，又拿起绒布，一个劲地擦洗脸上和手上的黑污。洗到一半，他们就听见靴声和说话声从楼上下来，又一路进了餐厅。孩子们总算把自己洗干净了，手却还是湿漉漉的。要想仔细擦干，又得多花不少时间。可他们太想快点见到那位祖父了，所以谁也不肯再等，一个跟一个走进了餐厅。
        - id: ch05-b16
          speaker: narrator
          text: 走进餐厅，孩子们看见妈妈正坐在窗边的位子上。屋里还有一个人。父亲从前在老房子里，经常坐在那把皮面扶手椅中。而现在，坐在那张椅子里的竟然是他们自己的老先生！
        - id: ch05-b17
          speaker: peter
          text: 哎呀，怎么会是您！
          emotion: surprised
        - id: ch05-b18
          speaker: narrator
          text: 彼得连“您好”都没来得及说，话就脱口而出。事后他解释说，当时自己吃惊得连“礼貌”这种东西都忘了，更别说真的讲礼貌。
        - id: ch05-b19
          speaker: phyllis
          text: 是我们自己的老先生！
          emotion: surprised
        - id: ch05-b20
          speaker: bobbie
          text: 哦，原来是您！
          emotion: surprised
        - id: ch05-b21
          speaker: narrator
          text: 这时，他们才想起自己是谁，也想起了礼貌。
        - id: ch05-b22
          speakers: [peter, phyllis, bobbie]
          ensemble: chorus
          text: 您好。
        - id: ch05-b23
          speaker: mother
          text: 这位就是吉姆的祖父。
        - id: ch05-b24
          speaker: narrator
          text: 妈妈说出了老先生的姓氏。
        - id: ch05-b25
          speaker: peter
          text: 太妙了！这简直跟书里一模一样。妈妈，是不是？
          emotion: happy
        - id: ch05-b26
          speaker: mother
          text: 的确很像。现实生活里，有时也会发生很像书中情节的事。
        - id: ch05-b27
          speaker: phyllis
          text: 我真高兴，来的人就是您。想想看，世上有成千上万个老先生，来的差不多可以是任何一个。
          emotion: happy
        - id: ch05-b28
          speaker: peter
          text: 不过我得先问一句，您不会把吉姆带走吧？
        - id: ch05-b29
          speaker: old_gentleman
          text: 目前不会。你们的妈妈非常好心，已经答应让他留在这里。我本来想请一位护士来，可你们的妈妈很慷慨，说她愿意亲自照料他。
        - id: ch05-b30
          speaker: peter
          text: 那妈妈的写作怎么办？她要是不写，大家就没东西吃了。
        - id: ch05-b31
          speaker: mother
          text: 这件事已经安排好了。
        - id: ch05-b32
          speaker: narrator
          text: 老先生十分和蔼地望着妈妈。
        - id: ch05-b33
          speaker: old_gentleman
          text: 我明白了。你信任孩子们，无论什么事都愿意告诉他们。
        - id: ch05-b34
          speaker: mother
          text: 当然。
        - id: ch05-b35
          speaker: old_gentleman
          text: 那我也可以把我们的小安排告诉他们了。亲爱的孩子们，你们的妈妈已经答应，暂时放下写作，来当我这家医院的女院长。
        - id: ch05-b36
          speaker: phyllis
          text: 啊？那我们得离开三烟囱、铁路，还有这里所有的东西吗？
          emotion: surprised
        - id: ch05-b37
          speaker: mother
          text: 不，不用，亲爱的。
        - id: ch05-b38
          speaker: old_gentleman
          text: 这家医院就叫三烟囱医院。我那倒霉的吉姆是唯一的病人，我也希望他始终是唯一的一个。你们的妈妈是女院长，工作人员还有一位女佣和一位厨娘。这家医院会开到吉姆康复为止。
        - id: ch05-b39
          speaker: peter
          text: 那以后，妈妈还会继续写作吗？
        - id: ch05-b40
          speaker: old_gentleman
          text: 到时再看吧。也许会有好事发生，她再也不必靠写作维持生活。
        - id: ch05-b41
          speaker: narrator
          text: 老先生飞快地瞥了博比一眼。
        - id: ch05-b42
          speaker: mother
          text: 我喜欢写作。
        - id: ch05-b43
          speaker: old_gentleman
          text: 我知道。别担心，我不会想法干涉你。不过，谁知道将来会怎样呢？世上的确会发生非常奇妙、非常美好的事，对不对？我们这一生大部分的日子，都是靠着对这些事的希望过下去的。我以后还能来看这孩子吗？
        - id: ch05-b44
          speaker: mother
          text: 当然。而且，你让我能够亲自照顾他，我真不知道该怎么谢你。可怜的孩子！
        - id: ch05-b45
          speaker: phyllis
          text: 夜里他一直喊“妈妈、妈妈”。我醒了两次，两次都听见了。
        - id: ch05-b46
          speaker: mother
          text: 他喊的人并不是我。所以，我才那么想把他留下。
          emotion: sad
        - id: ch05-b47
          speaker: narrator
          text: 妈妈压低声音对老先生说。老先生站了起来。
        - id: ch05-b48
          speaker: peter
          text: 妈妈，我真高兴您要把他留下。
          emotion: happy
        - id: ch05-b49
          speaker: old_gentleman
          text: 亲爱的孩子们，要好好照顾你们的妈妈。她是百万人里才有一个的好女人。
        - id: ch05-b50
          speaker: bobbie
          text: 是啊，对不对？
        - id: ch05-b51
          speaker: old_gentleman
          text: 愿上帝保佑她。愿上帝保佑她！是的，她一定会得到福佑。哎呀，我的帽子在哪儿？博比愿意陪我走到大门口吗？
        - id: ch05-b52
          speaker: narrator
          text: 老先生说着，紧紧握住妈妈的双手。随后，博比陪他向大门走去。到了门口，他停下了脚步。
        - id: ch05-b53
          speaker: old_gentleman
          text: 你是个好孩子，亲爱的。你的信我收到了。不过，那封信其实没有必要。当初我从报纸上读到你父亲的案子，心里就有怀疑。后来知道了你们是谁，我一直在设法查清这件事。现在还没查出太多，可我很有希望，亲爱的。很有希望。
        - id: ch05-b54
          speaker: bobbie
          text: 啊！
          emotion: surprised
        - id: ch05-b55
          speaker: narrator
          text: 博比的喉咙微微哽住了。
        - id: ch05-b56
          speaker: old_gentleman
          text: 是的，可以说希望很大。不过，你还得再替我们保守一阵秘密。要是拿一个虚假的希望，搅得你妈妈心神不宁，那可不好，对不对？
        - id: ch05-b57
          speaker: bobbie
          text: 可这希望不是假的！我知道您能办到。我写信的时候就知道，您一定能办到。这不是虚假的希望，对吗？
        - id: ch05-b58
          speaker: old_gentleman
          text: 不是。我认为这个希望不假，不然我不会告诉你。而且我觉得，你应该知道，希望的确存在。
        - id: ch05-b59
          speaker: bobbie
          text: 您不觉得那件事是爸爸做的，对不对？哦，请您告诉我，您不觉得是他做的。
        - id: ch05-b60
          speaker: old_gentleman
          text: 亲爱的，我完完全全相信，那件事不是他做的。
          emotion: calm
        - id: ch05-b61
          speaker: narrator
          text: 即使这只是一个虚假的希望，它也依旧灿烂无比，暖暖地藏在博比心里。
        - id: ch05-b62
          speaker: narrator
          text: 随后的日子里，它照亮了博比的小脸，就像一支蜡烛，从里面点亮了一盏日本灯笼。
