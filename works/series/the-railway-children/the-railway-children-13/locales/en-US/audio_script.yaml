  chapters:
    - id: ch01
      title: Chapter XIII. The hound's grandfather.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Mother never returned to her writing that day. First, the hound in the red jersey whom the children had brought home had to be put to bed at Three Chimneys. Then Dr. Forrest came to set his leg, and the treatment hurt Jim horribly. Mother stayed beside him through the whole dreadful business. Having her there made it a little better than it might have been, but as Mrs. Viney put it, bad was the best of it.
        - id: ch01-b02
          speaker: narrator
          text: Downstairs, the children sat together in the parlor. They heard the doctor's boots crossing the bedroom floor again and again. Once or twice, they heard a groan.
        - id: ch01-b03
          speaker: roberta
          text: This is awful. I wish Dr. Forrest would hurry. Poor Jim!
          emotion: fearful
        - id: ch01-b04
          speaker: peter
          text: It is awful, but it's exciting too. Doctors are so stuck-up about letting people watch. I'd love to see a leg being set. I bet the bones make a terrible crunch.
        - id: ch01-b05
          speakers: [roberta, phyllis]
          ensemble: duo
          text: Don't!
        - id: ch01-b06
          speaker: peter
          text: Oh, nonsense. You were both talking about becoming Red Cross nurses on the way home. How will you manage if you can't even hear me mention crunching bones? On a battlefield, you'd hear them crunch. You'd probably be covered in blood up to your elbows, and—
        - id: ch01-b07
          speaker: roberta
          text: Stop it! You're making me feel very strange.
          emotion: fearful
        - id: ch01-b08
          speaker: phyllis
          text: Me too.
        - id: ch01-b09
          speaker: narrator
          text: Bobbie's face had gone white. Phyllis's was pink.
        - id: ch01-b10
          speaker: peter
          text: Cowards!
        - id: ch01-b11
          speaker: roberta
          text: We are not. Phil and I helped Mother with your foot after the rake cut it. You know we did.
        - id: ch01-b12
          speaker: peter
          text: Exactly! It would do you good if I talked about broken bones and people's insides for half an hour every day. Then you'd get used to it.
        - id: ch01-b13
          speaker: narrator
          text: A chair scraped across the floor overhead.
        - id: ch01-b14
          speaker: peter
          text: Listen. That's the bone crunching.
        - id: ch01-b15
          speaker: phyllis
          text: I wish you'd quit. Bobbie doesn't like it.
        - id: ch01-b16
          speaker: peter
          text: I'll tell you how they do it.
        - id: ch01-b17
          speaker: narrator
          text: It is hard to know why Peter was so horrid just then. He had been wonderfully nice and kind through the earlier part of the day. Perhaps he had kept it up so long that he needed a change. That is called a reaction, and people sometimes notice it in themselves. After being better than usual for longer than usual, a person can suddenly be attacked by a fierce spell of not being good at all.
        - id: ch01-b18
          speaker: peter
          text: First they strap the injured man down so he can't fight their doctor tricks. Someone holds his head. Someone else grabs the broken leg and pulls until the bones fit together. Crunch! Then they wrap it up. Hey, let's play at setting bones!
        - id: ch01-b19
          speaker: phyllis
          text: Oh, no!
        - id: ch01-b20
          speaker: roberta
          text: All right. Let's do it. I'll be the doctor, and Phil can be the nurse. You can be the broken-bone patient. We can reach your legs easily because you don't wear petticoats.
        - id: ch01-b21
          speaker: peter
          text: I'll get splints and bandages. You two prepare the couch of suffering.
        - id: ch01-b22
          speaker: narrator
          text: The ropes had once been tied around boxes sent from the children's old home. Now they were all kept together in a wooden packing case down in the cellar. Peter went to fetch them. He returned dragging a long, tangled trail of rope behind him, with two boards to serve as splints. By then Phyllis had forgotten her objections and was giggling with excitement.
        - id: ch01-b23
          speaker: peter
          text: Here we go.
        - id: ch01-b24
          speaker: narrator
          text: He stretched out on the settle and groaned with all his might.
        - id: ch01-b25
          speaker: roberta
          text: Not so loud. You pull, Phil.
        - id: ch01-b26
          speaker: narrator
          text: Bobbie began winding rope around Peter and the settle.
        - id: ch01-b27
          speaker: peter
          text: Not so tight! You'll break my other leg.
        - id: ch01-b28
          speaker: narrator
          text: Bobbie said nothing. She only wound more and more rope around him.
        - id: ch01-b29
          speaker: peter
          text: That's plenty. I can't move at all. Oh, my poor leg!
        - id: ch01-b30
          speaker: narrator
          text: He groaned once more.
        - id: ch01-b31
          speaker: roberta
          text: Are you quite sure you can't move?
        - id: ch01-b32
          speaker: narrator
          text: Her voice sounded rather strange.
        - id: ch01-b33
          speaker: peter
          text: Completely sure. Are we pretending the wound is bleeding badly, or not?
        - id: ch01-b34
          speaker: roberta
          text: Pretend whatever you want. Phil and I are leaving. We won't untie you until you promise never to talk to us about blood or wounds unless we say you may.
        - id: ch01-b35
          speaker: narrator
          text: Bobbie folded her arms and looked sternly down at Peter, wrapped around and around with cord.
        - id: ch01-b36
          speaker: roberta
          text: Come on, Phil.
        - id: ch01-b37
          speaker: peter
          text: You beast! I'll never promise. Never! I'll yell, and Mother will come.
          emotion: angry
        - id: ch01-b38
          speaker: roberta
          text: Go ahead. Be sure to tell her why we tied you up. Come on, Phil. I'm not a beast, Peter. But you wouldn't stop when we asked, and—
        - id: ch01-b39
          speaker: peter
          text: Ha! It wasn't even your idea. You stole it from Stalky!
        - id: ch01-b40
          speaker: narrator
          text: Bobbie and Phil were leaving with silent dignity when they met the doctor at the door. He came in rubbing his hands, looking pleased with his work.
        - id: ch01-b41
          speaker: doctor_forrest
          text: Well, that's finished. A good clean break, and it should heal nicely. Brave young fellow, too. Hello, what's going on here?
        - id: ch01-b42
          speaker: narrator
          text: He had spotted Peter lying absolutely still in his ropes.
        - id: ch01-b43
          speaker: doctor_forrest
          text: Playing prisoners, are you?
        - id: ch01-b44
          speaker: narrator
          text: His eyebrows rose a little as he looked from Peter to the girls. Somehow, he had never imagined that Bobbie would be playing a game downstairs while, in the room above her, someone was enduring the setting of a broken bone.
        - id: ch01-b45
          speaker: roberta
          text: No, not prisoners. We were setting bones. Peter was the patient, and I was the doctor.
        - id: ch01-b46
          speaker: narrator
          text: Dr. Forrest frowned and spoke sternly.
        - id: ch01-b47
          speaker: doctor_forrest
          text: Then that is a very heartless game. Can't you imagine even a little of what happened upstairs? That poor boy was sweating and biting his lips to keep from crying out. Every touch on his leg was agony, and—
          emotion: angry
        - id: ch01-b48
          speaker: phyllis
          text: You should be tied up! You're just as bad as—
        - id: ch01-b49
          speaker: roberta
          text: Hush. I'm sorry. But we truly weren't being heartless.
        - id: ch01-b50
          speaker: peter
          text: I suppose I was. Don't act noble and protect me, Bobbie. I won't have it. I kept talking about blood and wounds because I wanted to train them as Red Cross nurses. They asked me to stop, and I wouldn't.
        - id: ch01-b51
          speaker: doctor_forrest
          text: And then?
        - id: ch01-b52
          speaker: narrator
          text: The doctor sat down.
        - id: ch01-b53
          speaker: peter
          text: Then I suggested we play at setting bones. I didn't mean it. I was only teasing Bobbie because I knew she'd refuse. But she said yes, so I had to do it. They tied me up. They got the idea from Stalky, and it's a rotten shame.
        - id: ch01-b54
          speaker: narrator
          text: Peter twisted around until he could hide his face against the wooden back of the settle.
        - id: ch01-b55
          speaker: roberta
          text: I thought only we would know. I never expected you to come in. Hearing about blood and wounds really does make me feel terribly strange. Tying him up was only a joke. Let me undo it, Pete.
        - id: ch01-b56
          speaker: peter
          text: I don't care if you leave me here forever. And if that's what you call a joke—
        - id: ch01-b57
          speaker: doctor_forrest
          text: If I were you, I'd get free before your mother comes down. You don't want to trouble her now, do you?
        - id: ch01-b58
          speaker: peter
          text: I'm not promising to stop talking about wounds.
        - id: ch01-b59
          speaker: narrator
          text: His voice was very sullen. Bobbie and Phyllis began working on the knots.
        - id: ch01-b60
          speaker: roberta
          text: I'm truly sorry, Pete. If you only knew how sick you made me feel.
          emotion: sad
        - id: ch01-b61
          speaker: narrator
          text: She whispered close to him while she struggled with the large knot under the settle.
        - id: ch01-b62
          speaker: peter
          text: Well, you've made me feel pretty sick too.
        - id: ch01-b63
          speaker: narrator
          text: He shook off the loosened ropes and stood.
        - id: ch01-b64
          speaker: doctor_forrest
          text: I came down to ask one of you to walk to my office. Your mother needs some things right away. My assistant has the day off to see the circus. Will you come, Peter?
        - id: ch01-b65
          speaker: narrator
          text: Peter left without one word or one look for his sisters.
        - id: ch01-b66
          speaker: narrator
          text: He and Dr. Forrest walked in silence until they reached the gate between the Three Chimneys field and the road.
        - id: ch01-b67
          speaker: peter
          text: Let me carry your bag. Wow, it's heavy. What's inside?
        - id: ch01-b68
          speaker: doctor_forrest
          text: Knives, lancets, and other tools for hurting people. The ether bottle too. I had to give Jim ether because the pain was so severe.
        - id: ch01-b69
          speaker: narrator
          text: Peter had nothing to say to that.
        - id: ch01-b70
          speaker: doctor_forrest
          text: Tell me how you found the boy.
        - id: ch01-b71
          speaker: narrator
          text: Peter told the whole story of the paper chase, the tunnel, and finding Jim. Then Dr. Forrest took his turn and told Peter stories of brave rescues he knew about. By the time they reached the office, Peter was listening eagerly. As he had often said before, the doctor was a fascinating man to talk with.
        - id: ch01-b72
          speaker: narrator
          text: At the doctor's office, Peter was allowed a closer look than ever before at all the scientific things that interested him. There was the doctor's balance, his microscope, his scales, and the different glasses he used for measuring. Peter examined them while Dr. Forrest gathered everything Mother needed. When the supplies were ready for Peter to carry back, the doctor spoke without warning.
        - id: ch01-b73
          speaker: doctor_forrest
          text: You won't mind if I interfere a little, will you? There's something I'd like to tell you.
        - id: ch01-b74
          speaker: narrator
          text: Peter had been wondering why he had escaped a scolding. He thought it was coming now.
        - id: ch01-b75
          speaker: doctor_forrest
          text: It's something scientific.
        - id: ch01-b76
          speaker: peter
          text: All right.
        - id: ch01-b77
          speaker: narrator
          text: Peter fiddled with the fossil ammonite the doctor used as a paperweight.
        - id: ch01-b78
          speaker: doctor_forrest
          text: Boys and girls are little men and women. We men are tougher and stronger than women are. Things that hurt them don't hurt us. You know you must never hit a girl.
        - id: ch01-b79
          speaker: narrator
          text: Peter especially liked the doctor's “we.” It placed Peter on the side of grown men instead of among the children. Perhaps Dr. Forrest had known that Peter would like it.
        - id: ch01-b80
          speaker: peter
          text: Of course not!
        - id: ch01-b81
          speaker: doctor_forrest
          text: Not even when she's your sister. Girls are softer and weaker. They have to be, or it wouldn't be good for babies. That's why male animals are careful with mothers. They don't fight them.
        - id: ch01-b82
          speaker: peter
          text: I know. Two male rabbits will fight all day if you let them, but they won't hurt a doe.
        - id: ch01-b83
          speaker: doctor_forrest
          text: That's right. Even wild lions and elephants are wonderfully gentle with the females. We must be gentle too.
        - id: ch01-b84
          speaker: peter
          text: I understand.
        - id: ch01-b85
          speaker: doctor_forrest
          text: Their hearts are softer too. Words can hurt them terribly when we wouldn't think twice about those words ourselves. So a man must watch what he says as well as what he does. And women are tremendously brave. Think of Bobbie staying alone in that tunnel with Jim. Strange, isn't it? A woman may be soft and easily hurt, but when something has to be done, she can make herself do it. I've known some very brave women. Your mother is one of them.
        - id: ch01-b86
          speaker: peter
          text: Yes.
        - id: ch01-b87
          speaker: doctor_forrest
          text: That's all. Forgive me for bringing it up. Nobody knows everything without being told. You see what I mean, don't you?
        - id: ch01-b88
          speaker: peter
          text: Yes. I'm sorry. There, I said it.
        - id: ch01-b89
          speaker: doctor_forrest
          text: Naturally you are. People are sorry as soon as they understand. Everyone ought to learn these scientific facts. Goodbye!
        - id: ch01-b90
          speaker: narrator
          text: They shook hands warmly, man to man, and Peter set off with Mother's supplies. When he came home, his sisters looked at him doubtfully. They had not forgotten the way he had gone off without speaking to them.
        - id: ch01-b91
          speaker: peter
          text: Pax. Dr. Forrest explained something scientific to me. No, I can't repeat it because you wouldn't understand. It means you girls are poor, soft, weak, frightened little rabbits, and we men have to put up with you. He called you female animals. Should I carry this up to Mother, or will one of you?
        - id: ch01-b92
          speaker: phyllis
          text: I know what boys are! They're the nastiest, rudest—
          emotion: angry
        - id: ch01-b93
          speaker: roberta
          text: Sometimes they're very brave.
        - id: ch01-b94
          speaker: peter
          text: Oh, you mean Jim upstairs. I see. Keep going, Phil. I'll endure anything you say because you're poor, weak, frightened, and soft—
        - id: ch01-b95
          speaker: phyllis
          text: You won't endure me pulling your hair!
        - id: ch01-b96
          speaker: narrator
          text: Phyllis sprang at him, but Bobbie pulled her back.
        - id: ch01-b97
          speaker: roberta
          text: He said “Pax.” Don't you see? He's truly sorry, but he won't say it. Let's tell him we're sorry.
        - id: ch01-b98
          speaker: narrator
          text: She whispered while Peter picked up the basket and marched out with it.
        - id: ch01-b99
          speaker: phyllis
          text: That sounds so goody-goody. He called us female animals, and soft, and frightened.
        - id: ch01-b100
          speaker: roberta
          text: Then let's prove we're not afraid he'll think we're goody-goody. And we're no more animals than he is.
        - id: ch01-b101
          speaker: narrator
          text: Peter returned with his chin still held high.
        - id: ch01-b102
          speaker: roberta
          text: We're sorry we tied you up, Pete.
        - id: ch01-b103
          speaker: peter
          text: I thought you would be.
        - id: ch01-b104
          speaker: narrator
          text: He sounded stiff and superior. It was hard to bear.
        - id: ch01-b105
          speaker: roberta
          text: Well, we are sorry. Now both sides have satisfied their honor.
        - id: ch01-b106
          speaker: peter
          text: I already called Pax.
        - id: ch01-b107
          speaker: roberta
          text: Then let it really be Pax. Come on, Phil. We'll get tea. Pete, you can set the table.
        - id: ch01-b108
          speaker: narrator
          text: Peter did help set the table, and the three of them had tea together. Even so, the peace between them took time to settle into something real. It was not completely restored until tea was over and they were all washing the cups.
        - id: ch01-b109
          speaker: phyllis
          text: Dr. Forrest didn't really call us female animals, did he?
        - id: ch01-b110
          speaker: peter
          text: Yes, he did. But I think he meant that men are wild animals too.
        - id: ch01-b111
          speaker: phyllis
          text: What a funny thing for him to say!
        - id: ch01-b112
          speaker: narrator
          text: And Phyllis broke a cup.
        - id: ch01-b113
          speaker: peter
          text: May I come in, Mother?
        - id: ch01-b114
          speaker: narrator
          text: Peter stood outside the door of Mother's writing room. Inside, she sat at her table between two lighted candles. Beyond the window, the evening sky was a clear gray-blue, and a few early stars already twinkled there. Against that cool sky, the candle flames shone orange and violet.
        - id: ch01-b115
          speaker: mother
          text: Yes, dear. Is something wrong?
        - id: ch01-b116
          speaker: narrator
          text: Mother sounded distracted. She wrote a few more words, put down her pen, and folded the page.
        - id: ch01-b117
          speaker: mother
          text: I was writing to Jim's grandfather. He lives nearby, you know.
        - id: ch01-b118
          speaker: peter
          text: You told us at tea. That's why I came. Must you write to him? Couldn't we keep Jim and say nothing until he's well? Think what a surprise it would be.
        - id: ch01-b119
          speaker: mother
          text: Yes, I think it certainly would be a surprise.
        - id: ch01-b120
          speaker: narrator
          text: Mother laughed.
        - id: ch01-b121
          speaker: peter
          text: The girls are fine. I'm not saying anything against them. But I'd like another boy to talk to once in a while.
        - id: ch01-b122
          speaker: mother
          text: I know it's lonely for you, dear. I can't change that now. Maybe next year I can send you to school. Would you like that?
        - id: ch01-b123
          speaker: peter
          text: I do miss the other boys. But if Jim stayed after his leg healed, we could have wonderful fun.
        - id: ch01-b124
          speaker: mother
          text: I'm sure you could. Maybe he can stay. But we're not rich, dear. I can't buy everything he'll need, and he must have a nurse.
        - id: ch01-b125
          speaker: peter
          text: Couldn't you nurse him? You take care of sick people beautifully.
        - id: ch01-b126
          speaker: mother
          text: That's a lovely compliment, Pete. But I can't nurse Jim and keep writing too. That's the trouble.
        - id: ch01-b127
          speaker: peter
          text: So you have to send the letter to his grandfather?
        - id: ch01-b128
          speaker: mother
          text: Of course. I must write to his schoolmaster too. We sent them both telegrams, but they will be terribly worried until my letters arrive.
        - id: ch01-b129
          speaker: peter
          text: Why can't his grandfather pay for a nurse? That would solve everything. I bet the old fellow has piles of money. Grandfathers in books always do.
        - id: ch01-b130
          speaker: mother
          text: This grandfather isn't in a book, so we shouldn't expect too much piling.
        - id: ch01-b131
          speaker: peter
          text: Wouldn't it be wonderful if all of us were in a book and you were writing it? You could make wonderful things happen. Jim's leg could heal tonight. Father could come home soon, and—
        - id: ch01-b132
          speaker: mother
          text: Do you miss your father very much?
        - id: ch01-b133
          speaker: narrator
          text: Her voice sounded rather cold to Peter.
        - id: ch01-b134
          speaker: peter
          text: Terribly.
        - id: ch01-b135
          speaker: narrator
          text: Mother slipped the second letter into its envelope and wrote the address.
        - id: ch01-b136
          speaker: peter
          text: It's not only because he's Father. Now that he's away, I'm the only man in the house. That's why I want Jim to stay so much. Wouldn't you like to write that book about us and make Daddy come home soon?
        - id: ch01-b137
          speaker: narrator
          text: Mother did not answer at once. She suddenly reached out, put her arm around Peter, and drew him close. For a whole minute she simply held him there in silence.
        - id: ch01-b138
          speaker: mother
          text: Maybe it's comforting to think we're inside a book God is writing. If I wrote it, I might make mistakes. But God knows how to bring the story to the right ending, the one that's truly best for us.
        - id: ch01-b139
          speaker: peter
          text: Do you honestly believe that, Mother?
        - id: ch01-b140
          speaker: mother
          text: I do, almost all the time. Sometimes I'm so sad I can't believe anything. Even then, I know it's true, and I try to believe it. You can't know how hard I try, Peter. Now take these letters to the mailbox, and let's stop being sad. Courage, courage! That's the finest virtue of all. Jim will probably stay for two or three weeks.
          emotion: calm
        - id: ch01-b141
          speaker: narrator
          text: For every minute left in that evening, Peter behaved like an angel. He was so unnaturally good that Bobbie began to fear he might be getting sick. The next morning brought a reassuring sight. Peter was back in his usual form, quietly braiding Phyllis's hair onto the back of her chair.
        - id: ch01-b142
          speaker: narrator
          text: Soon after breakfast, someone knocked at the door. The children were hard at work polishing the brass candlesticks in honor of Jim's visit.
        - id: ch01-b143
          speaker: mother
          text: That will be the doctor. I'll answer it. Shut the kitchen door. None of you is fit to be seen.
        - id: ch01-b144
          speaker: narrator
          text: But the visitor was not the doctor. The voice told them that, and so did the unfamiliar boots climbing the stairs. None of them knew those footsteps, but they were all certain they had heard the voice before.
        - id: ch01-b145
          speaker: narrator
          text: Quite a while passed after the visitor went into Jim's room. Neither the mysterious boots nor the familiar voice came downstairs again. The children could do nothing but wonder. Over and over, they asked themselves and one another who the visitor could possibly be.
        - id: ch01-b146
          speaker: peter
          text: Maybe highwaymen attacked Dr. Forrest and left him for dead. This could be the man he called to take over. Mrs. Viney, didn't you say he has a substitute who works while he's on vacation?
        - id: ch01-b147
          speaker: mrs_viney
          text: I certainly did, dear.
        - id: ch01-b148
          speaker: phyllis
          text: It's more likely the doctor had a fit and nobody can save him. This must be his man, coming to break the news to Mother.
        - id: ch01-b149
          speaker: peter
          text: Nonsense. Mother wouldn't take that man into Jim's bedroom. Why would she? Listen, the door is opening. They're coming down. I'll crack our door open.
        - id: ch01-b150
          speaker: narrator
          text: Bobbie was shocked that he meant to listen.
        - id: ch01-b151
          speaker: peter
          text: It isn't eavesdropping. Nobody sensible discusses secrets on the stairs. Mother can't have secrets with Dr. Forrest's stableman, and you're the one who said it was him.
        - id: ch01-b152
          speaker: mother
          text: Bobbie!
        - id: ch01-b153
          speaker: narrator
          text: The children opened the kitchen door. Mother was leaning over the stair railing.
        - id: ch01-b154
          speaker: mother
          text: Jim's grandfather is here. Wash your hands and faces, and then you may meet him. He wants to see you!
        - id: ch01-b155
          speaker: narrator
          text: The bedroom door closed again.
        - id: ch01-b156
          speaker: peter
          text: There! Imagine none of us thinking of that. Mrs. Viney, may we have some hot water? I'm as black as your hat.
        - id: ch01-b157
          speaker: narrator
          text: All three children truly were filthy, with black marks left by their hard work on the candlesticks. The stuff used for cleaning brass is very good at its proper job, but it is a long way from cleaning the cleaner. They were still scrubbing with soap, hot water, and washcloths when the boots and voice finally came downstairs and went into the dining room.
        - id: ch01-b158
          speaker: narrator
          text: At last the children were clean, though their hands remained damp. It takes a long time to dry your hands properly, and they were far too impatient to meet a grandfather. They filed into the dining room together. Mother sat in the window seat. Across from her stood the leather-covered armchair that Father always used at their old house. And sitting in Father's chair was their very own old gentleman.
        - id: ch01-b159
          speaker: peter
          text: Well, I never!
        - id: ch01-b160
          speaker: narrator
          text: Peter spoke before he even said hello. Later, he explained that surprise had made him forget politeness existed.
        - id: ch01-b161
          speaker: phyllis
          text: It's our own old gentleman!
          emotion: surprised
        - id: ch01-b162
          speaker: roberta
          text: Oh, it's you!
          emotion: surprised
        - id: ch01-b163
          speaker: narrator
          text: Then the children remembered their manners.
        - id: ch01-b164
          speakers: [roberta, peter, phyllis]
          ensemble: chorus
          text: How do you do?
        - id: ch01-b165
          speaker: mother
          text: This is Jim's grandfather, Mr.—
        - id: ch01-b166
          speaker: narrator
          text: Mother gave the old gentleman's name.
        - id: ch01-b167
          speaker: peter
          text: How wonderful! It's exactly like something in a book, isn't it, Mother?
        - id: ch01-b168
          speaker: mother
          text: It is a little. Sometimes real life does behave like a book.
        - id: ch01-b169
          speaker: phyllis
          text: I'm so glad Jim's grandfather is you. Just think of all the old gentlemen in the world. It could have been almost anyone!
          emotion: happy
        - id: ch01-b170
          speaker: peter
          text: But you aren't taking Jim away, are you?
        - id: ch01-b171
          speaker: old_gentleman
          text: Not now. Your mother has kindly agreed to let him remain here. I planned to send a nurse, but she has offered to care for him herself.
        - id: ch01-b172
          speaker: peter
          text: Then what about her writing? If Mother can't write, there won't be anything for him to eat.
        - id: ch01-b173
          speaker: mother
          text: That's taken care of.
        - id: ch01-b174
          speaker: narrator
          text: Mother answered quickly. The old gentleman gave her a very kind look.
        - id: ch01-b175
          speaker: old_gentleman
          text: I understand. You trust your children and tell them your concerns.
        - id: ch01-b176
          speaker: mother
          text: Of course I do.
        - id: ch01-b177
          speaker: old_gentleman
          text: Then I can explain our arrangement. Your mother has agreed to pause her writing and become the matron of my hospital.
        - id: ch01-b178
          speaker: phyllis
          text: Oh! Does that mean we must leave Three Chimneys and the railway and everything?
          emotion: surprised
        - id: ch01-b179
          speaker: mother
          text: No, no, darling.
          emotion: calm
        - id: ch01-b180
          speaker: old_gentleman
          text: The hospital is named Three Chimneys Hospital. My unfortunate Jim is its only patient, and I hope he remains the only one. Your mother will be matron. A housemaid and a cook will make up the staff until Jim is well.
        - id: ch01-b181
          speaker: peter
          text: Will Mother start writing again after that?
        - id: ch01-b182
          speaker: old_gentleman
          text: We shall see. Perhaps something good will happen, and she won't need to.
        - id: ch01-b183
          speaker: narrator
          text: He gave Bobbie one quick glance.
        - id: ch01-b184
          speaker: mother
          text: I love writing.
        - id: ch01-b185
          speaker: narrator
          text: Mother said it very quickly.
        - id: ch01-b186
          speaker: old_gentleman
          text: I know. Don't fear that I mean to interfere. But we never know what may happen. Wonderful, beautiful things do happen. We spend much of our lives hoping for them. May I visit the boy again?
        - id: ch01-b187
          speaker: mother
          text: Certainly. And I don't know how to thank you for making it possible for me to nurse the dear boy.
        - id: ch01-b188
          speaker: phyllis
          text: He kept calling “Mother” during the night. I woke twice and heard him.
        - id: ch01-b189
          speaker: mother
          text: He wasn't calling for me. That's why I wanted so much to keep him here.
          emotion: sad
        - id: ch01-b190
          speaker: narrator
          text: Mother spoke softly to the old gentleman. He rose to leave.
        - id: ch01-b191
          speaker: peter
          text: I'm so glad you're letting him stay, Mother.
        - id: ch01-b192
          speaker: old_gentleman
          text: Take care of your mother, my dears. She's one woman in a million.
        - id: ch01-b193
          speaker: roberta
          text: She is, isn't she?
        - id: ch01-b194
          speaker: narrator
          text: Bobbie whispered it.
        - id: ch01-b195
          speaker: old_gentleman
          text: God bless her! Yes, and she will be blessed. Now, where did I put my hat? Bobbie, will you walk with me to the gate?
        - id: ch01-b196
          speaker: narrator
          text: The old gentleman took both of Mother's hands in his while he blessed her. Then he found his hat and asked Bobbie to walk with him. They went out together, and when they reached the gate, he stopped beside her to speak privately.
        - id: ch01-b197
          speaker: old_gentleman
          text: You're a good child, my dear. Your letter reached me, but it wasn't necessary. When the newspapers reported your father's case, I had doubts about it. Since I learned who you were, I've been investigating. I haven't discovered much yet, but I have hope, my dear. I truly have hope.
        - id: ch01-b198
          speaker: roberta
          text: Oh!
        - id: ch01-b199
          speaker: narrator
          text: Bobbie's voice caught in her throat.
        - id: ch01-b200
          speaker: old_gentleman
          text: Yes, very great hope. But keep your secret a little longer. We mustn't trouble your mother with a hope that might prove false.
        - id: ch01-b201
          speaker: roberta
          text: But it isn't false! I know you can do it. I knew when I wrote to you. Tell me it isn't a false hope.
        - id: ch01-b202
          speaker: old_gentleman
          text: No, I don't believe it is. I wouldn't have told you otherwise. You deserve to know that hope exists.
        - id: ch01-b203
          speaker: roberta
          text: And you don't believe Father did it, do you? Please say you don't.
        - id: ch01-b204
          speaker: old_gentleman
          text: My dear, I am completely certain that he did not.
        - id: ch01-b205
          speaker: narrator
          text: Perhaps, after all, the hope might still have proved false. But that could not stop it from shining. It lay warm and radiant in Bobbie's heart. Through all the days that followed, it lit her little face the way a candle glows inside a Japanese lantern.
