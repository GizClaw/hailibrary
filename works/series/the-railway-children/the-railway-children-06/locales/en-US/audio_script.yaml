  chapters:
    - id: ch01
      title: Chapter VI. Saviours of the train.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Russian gentleman improved the next day, and even more the day after. By the third day, he was well enough to come into the garden. They put out a basket chair for him, and he sat there wearing some of Father's clothes. They were much too large, but Mother hemmed the sleeves and pants until they fit well enough. Now that his face was no longer worn and frightened, it looked kind. Whenever he caught sight of the children, he smiled at them. They smiled back, wishing very much that he could speak English and understand all they wanted to say.
        - id: ch01-b02
          speaker: narrator
          text: Mother wrote letter after letter, hoping to find someone who knew where his wife and children might be in England. She tried anyone who might possibly help. But she did not write to the people she had known before coming to Three Chimneys. She never wrote to any of them. Instead, all her letters went to strangers, including members of Parliament, newspaper editors, and secretaries of societies.
        - id: ch01-b03
          speaker: narrator
          text: She hardly worked on her stories. She only corrected proofs while sitting in the sun near the Russian gentleman, speaking to him now and then.
        - id: ch01-b04
          speaker: narrator
          text: The children wanted to show kindness to this man, who had been sent to prison and then Siberia simply for writing a beautiful book about poor people. They smiled at him often. But when you keep smiling for too long, your face can get stuck in a grin like a hyena's. Then you look silly instead of friendly. So they tried something else. They brought him flowers until his chair was surrounded by small, fading bunches of clover, roses, and Canterbury bells.
        - id: ch01-b05
          speaker: narrator
          text: Then Phyllis had an idea. She gave the others a mysterious signal and led them into the backyard. In a hidden spot between the pump and the rain barrel, she explained her plan.
        - id: ch01-b06
          speaker: phyllis
          text: Remember when Perks promised me the very first strawberries from his garden? They must be ripe by now. Let's go see.
        - id: ch01-b07
          speaker: narrator
          text: Mother had gone to the station, just as she had promised, to tell the Station Master about the Russian prisoner. But even the railway had not been exciting enough to draw the children away from their fascinating visitor. They had not gone to the station for three whole days. Now they went, only to find that Perks gave them a surprisingly chilly welcome.
        - id: ch01-b08
          speaker: porter
          text: Well, this is a great honor, I'm sure.
        - id: ch01-b09
          speaker: narrator
          text: He kept reading his newspaper. An uncomfortable silence followed.
        - id: ch01-b10
          speaker: roberta
          text: Oh, dear. I think you're angry with us.
        - id: ch01-b11
          speaker: porter
          text: Me? Not at all. It doesn't matter to me.
        - id: ch01-b12
          speaker: peter
          text: What doesn't matter to you?
        - id: ch01-b13
          speaker: narrator
          text: Peter was too worried to notice the Porter's odd way of saying it.
        - id: ch01-b14
          speaker: porter
          text: Nothing matters. Not what happens here or anywhere else. If you want your secrets, you're welcome to keep them. That's what I say.
        - id: ch01-b15
          speaker: narrator
          text: The children silently searched their hearts for anything they might have hidden from him. Then all three shook their heads.
        - id: ch01-b16
          speaker: roberta
          text: We don't keep secrets from you.
        - id: ch01-b17
          speaker: porter
          text: Maybe you do, maybe you don't. It's nothing to me. Good afternoon to all of you.
        - id: ch01-b18
          speaker: narrator
          text: He raised the paper between them and went on reading.
        - id: ch01-b19
          speaker: phyllis
          text: Oh, please don't! This is awful. Whatever we've done, tell us.
          emotion: sad
        - id: ch01-b20
          speaker: roberta
          text: We didn't mean to do it, whatever it was.
        - id: ch01-b21
          speaker: narrator
          text: Perks said nothing. He folded the paper another way and started a new column.
        - id: ch01-b22
          speaker: peter
          text: Look, this isn't fair. Even criminals get told what they're being punished for. At least they do now, though they didn't in Russia.
        - id: ch01-b23
          speaker: porter
          text: I don't know anything about Russia.
        - id: ch01-b24
          speaker: peter
          text: Yes, you do. Mother came down just to tell you and Mr. Gills all about our Russian.
        - id: ch01-b25
          speaker: porter
          text: Can you picture the Station Master inviting me into his room, offering me a chair, and letting me hear what her ladyship had to say?
        - id: ch01-b26
          speaker: roberta
          text: You mean nobody told you?
        - id: ch01-b27
          speaker: porter
          text: Not one word. I even tried asking. He snapped me shut like a rat trap. "Affairs of State, Perks," he said. But I thought one of you might hurry down and tell me. You come fast enough when you want something from old Perks.
        - id: ch01-b28
          speaker: narrator
          text: Phyllis turned deep red as she remembered the strawberries.
        - id: ch01-b29
          speaker: porter
          text: You know, when you want to hear about engines, signals, and things like that.
        - id: ch01-b30
          speakers: [roberta, peter, phyllis]
          ensemble: chorus
          text: We didn't know you hadn't heard! We thought Mother told you! We wanted to tell you, but we thought it would be old news!
        - id: ch01-b31
          speaker: narrator
          text: All three spoke at once, their explanations running together. Perks only said that was easy enough to claim, and he still held the newspaper up like a wall between them. Then Phyllis could bear it no longer. She suddenly snatched the paper out of his hands and threw both arms around his neck.
        - id: ch01-b32
          speaker: phyllis
          text: Let's kiss and make up. We'll apologize first if you want, but we truly didn't know nobody had told you.
        - id: ch01-b33
          speakers: [roberta, peter]
          ensemble: duo
          text: We're very sorry.
        - id: ch01-b34
          speaker: narrator
          text: At last, Perks agreed to accept their apologies. Then they persuaded him to come outside and sit with them in the sunshine on the green railway bank. The grass there was hot when they touched it. They began the story of the Russian prisoner. Sometimes one child spoke at a time, and sometimes all three tumbled over one another's words, but between them they told Perks everything.
        - id: ch01-b35
          speaker: porter
          text: Well, I have to say...
        - id: ch01-b36
          speaker: narrator
          text: But whatever he had to say, he never finished it.
        - id: ch01-b37
          speaker: peter
          text: It is terrible, isn't it? No wonder you wanted to know who the Russian was.
        - id: ch01-b38
          speaker: porter
          text: I didn't want to know. I was interested. That's different.
        - id: ch01-b39
          speaker: roberta
          text: Mr. Gills really should have told you. It was horrid of him not to.
        - id: ch01-b40
          speaker: porter
          text: I don't blame him, miss. I understand. He wouldn't want to tell a story that made his own side look bad. That's human nature. A man has to defend his side, whatever they do. That's Party Politics. I'd have done the same if that long-haired fellow had been Japanese.
        - id: ch01-b41
          speaker: roberta
          text: But the Japanese didn't do cruel, wicked things like that.
        - id: ch01-b42
          speaker: porter
          text: Maybe not. Still, you can't be sure about foreigners. I believe they're all much the same.
        - id: ch01-b43
          speaker: peter
          text: Then why did you support the Japanese?
        - id: ch01-b44
          speaker: porter
          text: You have to choose one side or the other. It's like Liberals and Conservatives. Choose your side, then stand by it no matter what happens.
        - id: ch01-b45
          speaker: narrator
          text: A signal sounded.
        - id: ch01-b46
          speaker: porter
          text: There's the 3:14 up train. Stay down until it passes. Then we'll go to my place and see whether any of those strawberries I promised you are ripe.
        - id: ch01-b47
          speaker: phyllis
          text: If there are some, and you really give them to me, may I give them to the poor Russian?
        - id: ch01-b48
          speaker: narrator
          text: Perks narrowed his eyes, then lifted his eyebrows.
        - id: ch01-b49
          speaker: porter
          text: So those strawberries are why you came down today?
        - id: ch01-b50
          speaker: narrator
          text: Phyllis found herself in a difficult spot. If she said yes, she might sound greedy, rude, and unkind to Perks. But if she said no, she knew she would be ashamed of herself afterward.
        - id: ch01-b51
          speaker: phyllis
          text: Yes. They are.
        - id: ch01-b52
          speaker: porter
          text: Well done! Tell the truth and shame the—
        - id: ch01-b53
          speaker: phyllis
          text: But we'd have come the very next day if we'd known nobody told you the story.
        - id: ch01-b54
          speaker: porter
          text: I believe you, miss.
        - id: ch01-b55
          speaker: narrator
          text: Perks sprang across the track only six feet in front of the approaching train. The girls hated watching him do that. Peter loved it because it was so exciting. Later, when they took the strawberries home, the Russian gentleman was delighted with them. His pleasure made the children eager to find him another surprise. They thought and thought, searching their minds for something new they could bring him.
        - id: ch01-b56
          speaker: narrator
          text: All that thinking produced nothing more unusual than wild cherries. The idea came the next morning. In spring, the children had seen cherry blossoms shining like snow and silver among the birches, beeches, young oaks, and hazel trees on the rocky cliff above the tunnel. Now it was cherry season, and they knew where to look.
        - id: ch01-b57
          speaker: narrator
          text: The tunnel was some distance from Three Chimneys, so Mother let them carry their lunch in a basket. If they found cherries, they could bring them home in it. She also lent them her silver watch so they would not miss tea. Peter's Waterbury watch had refused to run ever since he dropped it into the rain barrel.
        - id: ch01-b58
          speaker: narrator
          text: They set out with the lunch basket and Mother's watch. When they reached the top of the cutting, they leaned over the fence and looked far down. The tracks lay at the bottom between high walls of stone. Phyllis said it looked exactly like a mountain gorge.
        - id: ch01-b59
          speaker: phyllis
          text: Without the railway down there, you'd think no person had ever set foot in this place.
        - id: ch01-b60
          speaker: narrator
          text: The sides of the cutting were made of rough gray rock. The upper part had once been a small natural glen. It had been cut deeper and deeper until its floor came level with the tunnel mouth. Grass and flowers grew among the stones. Birds had dropped seeds into cracks in the rock, and those seeds had taken root. Now bushes and trees leaned out above the cutting. Near the tunnel, rough wooden bars had been fixed into the earth to make steps down to the tracks. The way was so steep and narrow that it looked more like a ladder than a staircase.
        - id: ch01-b61
          speaker: peter
          text: We should go down. I bet we can reach the cherries beside those steps. That's where we picked the blossoms for the rabbit's grave, remember?
        - id: ch01-b62
          speaker: narrator
          text: They followed the fence toward the little swinging gate above the steps. Just before they reached it, Roberta stopped them.
        - id: ch01-b63
          speaker: roberta
          text: Quiet. Stop! What's that sound?
        - id: ch01-b64
          speaker: narrator
          text: It was a very strange sound. Though soft, they could hear it clearly beneath the wind in the branches and the humming telegraph wires. Something seemed to rustle and whisper. The sound stopped, began again, and this time grew steadily louder. The rustling became a rumble.
        - id: ch01-b65
          speaker: peter
          text: Look! That tree over there!
          emotion: surprised
        - id: ch01-b66
          speaker: narrator
          text: He pointed to a tree with rough gray leaves and white flowers. Later, it would bear bright scarlet berries. They always looked tempting on the branch, but disappointed anyone who picked them by turning black before they reached home. Now, though, the strange thing was the tree itself. The whole tree was moving. It did not sway as trees should when wind passes through their branches. It moved all in one piece, like a living creature walking down the slope.
        - id: ch01-b67
          speaker: roberta
          text: It's moving! Look, the others are moving too. It's like the woods in Macbeth!
          emotion: surprised
        - id: ch01-b68
          speaker: phyllis
          text: It's magic. I always knew this railway was enchanted.
          emotion: surprised
        - id: ch01-b69
          speaker: narrator
          text: It truly looked like magic. For about twenty yards along the far bank, every tree seemed to walk slowly toward the tracks. The gray-leaved tree followed at the back, like an old shepherd driving a flock of green sheep.
        - id: ch01-b70
          speaker: phyllis
          text: What is it? Oh, what can it be? This is too much magic for me. I don't like it. Let's go home.
          emotion: fearful
        - id: ch01-b71
          speaker: narrator
          text: Roberta and Peter held tightly to the rail and watched without breathing. Phyllis did not try to go home alone. The trees kept moving. Loose dirt and stones fell away, rattling against the rails below.
        - id: ch01-b72
          speaker: peter
          text: The whole thing is coming down.
          emotion: fearful
        - id: ch01-b73
          speaker: narrator
          text: His voice was barely there. As he spoke, the great rock beneath the walking trees tilted slowly forward. The trees stopped walking and stood trembling. They leaned with the rock, and for one moment the rock and everything on it seemed to hesitate. Then it all tore away from the face of the cutting. Rock, trees, grass, and bushes rushed downward together and fell across the tracks with a clumsy, crushing roar. The crash could have been heard half a mile away. A thick cloud of dust rose from the line.
        - id: ch01-b74
          speaker: peter
          text: It's just like when the coal comes down into the cellar, only there's no roof and we're looking from above.
          emotion: surprised
        - id: ch01-b75
          speaker: roberta
          text: Look at that enormous pile!
          emotion: surprised
        - id: ch01-b76
          speaker: narrator
          text: Peter stayed bent over the fence.
        - id: ch01-b77
          speaker: peter
          text: Yes. Yes...
        - id: ch01-b78
          speaker: narrator
          text: Then he straightened suddenly.
        - id: ch01-b79
          speaker: peter
          text: The 11:29 down train hasn't passed yet. We have to warn the station, or there'll be a terrible accident.
        - id: ch01-b80
          speaker: roberta
          text: Let's run!
        - id: ch01-b81
          speaker: narrator
          text: She started off, but Peter called her back and checked Mother's watch. He looked businesslike and quick, though his face was whiter than they had ever seen it.
        - id: ch01-b82
          speaker: peter
          text: There isn't time. The station is two miles away, and it's already past eleven.
        - id: ch01-b83
          speaker: phyllis
          text: Could we climb a telegraph pole and do something with the wires?
        - id: ch01-b84
          speaker: peter
          text: We don't know how.
        - id: ch01-b85
          speaker: phyllis
          text: People do it in wars. I'm sure I've heard about it.
        - id: ch01-b86
          speaker: peter
          text: They only cut the wires, silly. That wouldn't help. Besides, we couldn't cut them, and we couldn't even climb the pole. If we had something red, we could get down there and wave it.
        - id: ch01-b87
          speaker: phyllis
          text: The train won't see us until it comes around the bend. By then it'll see the pile too, and the pile is much bigger than we are.
        - id: ch01-b88
          speaker: peter
          text: If we had anything red, we could go past the bend and signal the train before it reaches here.
        - id: ch01-b89
          speaker: phyllis
          text: We could wave without anything red.
        - id: ch01-b90
          speaker: peter
          text: They'll think it's only us waving like we always do. Come on. We have to get down there.
        - id: ch01-b91
          speaker: narrator
          text: They climbed down the steep steps. Roberta was pale and trembling. Peter's face seemed thinner than usual. Phyllis was red and damp with worry.
        - id: ch01-b92
          speaker: phyllis
          text: Oh, I'm so hot! I thought it would be cold today. I wish we hadn't put on our... our flannel petticoats.
        - id: ch01-b93
          speaker: narrator
          text: At the bottom of the steps, Roberta turned around.
        - id: ch01-b94
          speaker: roberta
          text: Yes! They're red! Let's take them off!
          emotion: surprised
        - id: ch01-b95
          speaker: narrator
          text: They pulled off the red petticoats, rolled them up, and tucked them under their arms. Then they ran beside the tracks, keeping around the edge of the new mound. It was a great wreck of loose earth, stones, rock, and trees that had been bent, crushed, and twisted in the fall. The children ran at their very best speed. Peter led, but the girls stayed close behind him. At last they reached the bend. From there, the track ran straight for half a mile, while the curve hid the dangerous mound behind them.
        - id: ch01-b96
          speaker: narrator
          text: Peter grabbed the largest red petticoat.
        - id: ch01-b97
          speaker: phyllis
          text: You're not going to tear them, are you?
        - id: ch01-b98
          speaker: peter
          text: Be quiet.
          emotion: angry
        - id: ch01-b99
          speaker: roberta
          text: Tear them into tiny pieces if you need to. Phil, if we don't stop the train, there'll be a real accident. People will be killed. Peter, you can't tear through that waistband. Give it to me.
          emotion: fearful
        - id: ch01-b100
          speaker: narrator
          text: Roberta tore the flannel away an inch below the band, then did the same with the other petticoat. Peter took over and ripped each one into three pieces.
        - id: ch01-b101
          speaker: peter
          text: There. Six flags. We have seven minutes, and now we need flagpoles.
        - id: ch01-b102
          speaker: narrator
          text: Boys' pocketknives, for some strange reason, are rarely made of steel that stays sharp. The children had to break young branches from the trees, and two came up by the roots. They stripped off the leaves.
        - id: ch01-b103
          speaker: peter
          text: Cut holes in the flags, then push the sticks through.
        - id: ch01-b104
          speaker: narrator
          text: The knife was sharp enough for flannel, so they made the holes. They planted two flags in small piles of loose stones between the ties on the down track. Phyllis and Roberta each took another and stood ready to wave when the train appeared.
        - id: ch01-b105
          speaker: peter
          text: I'll take the last two. Waving something red was my idea.
        - id: ch01-b106
          speaker: phyllis
          text: But they were our petticoats—
        - id: ch01-b107
          speaker: roberta
          text: Who cares who waves which flag? We only have to save the train!
        - id: ch01-b108
          speaker: narrator
          text: Then there was nothing to do but wait. Perhaps Peter had worked out the number of minutes from the station incorrectly. Perhaps the 11:29 was simply late. Either way, the wait felt terribly long, and no train appeared along the empty rails.
        - id: ch01-b109
          speaker: phyllis
          text: I bet the watch is wrong and the train already passed.
        - id: ch01-b110
          speaker: narrator
          text: Peter let go of the heroic pose he had chosen for holding his two flags. Roberta began to feel sick with suspense. To her, they seemed to have stood there for hours and hours, holding foolish little scraps of red flannel that no one would ever notice. The train would not care about their tiny flags. It would race straight past them, tear around the bend, and smash into that terrible mound. Everyone on board would be killed. Her hands turned cold and shook so badly she could scarcely hold her flag.
        - id: ch01-b111
          speaker: narrator
          text: Then a distant hum and rumble ran along the rails. Far down the straight track, a puff of white steam appeared.
        - id: ch01-b112
          speaker: peter
          text: Hold your ground and wave as hard as you can! When it reaches that big gorse bush, step back, but keep waving. Bobbie, don't stand on the track!
        - id: ch01-b113
          speaker: narrator
          text: The train came rattling toward them very, very fast.
        - id: ch01-b114
          speaker: roberta
          text: They don't see us! They're not going to see us! It's no use!
          emotion: fearful
        - id: ch01-b115
          speaker: narrator
          text: The nearing train shook the two flags they had planted between the ties. Loose stones slipped. One flag slowly tipped over and fell across the rail. Roberta sprang forward, snatched it up, and waved it. Her hands had stopped trembling.
        - id: ch01-b116
          speaker: narrator
          text: The train seemed to be moving every bit as fast as before. There was still no sign that the driver had understood their warning. Now the engine was very close, growing larger with every second.
        - id: ch01-b117
          speaker: peter
          text: Get off the track, you silly cuckoo!
          emotion: angry
        - id: ch01-b118
          speaker: roberta
          text: It's no use!
          emotion: fearful
        - id: ch01-b119
          speaker: peter
          text: Get back!
          emotion: fearful
        - id: ch01-b120
          speaker: narrator
          text: Peter pulled Phyllis away by the arm.
        - id: ch01-b121
          speaker: roberta
          text: Not yet! Not yet!
          emotion: fearful
        - id: ch01-b122
          speaker: narrator
          text: Roberta leaned over the track, waving both flags. The engine's black front towered over her, and its voice was loud and harsh.
        - id: ch01-b123
          speaker: roberta
          text: Oh, stop! Stop! Stop!
          emotion: fearful
        - id: ch01-b124
          speaker: narrator
          text: Nobody heard her, or at least Peter and Phyllis did not. The rush of the approaching train covered her voice with a mountain of sound. Later, she sometimes wondered whether the engine itself might have heard her. It almost seemed that way. Suddenly it began to slow. It slowed fast, then faster, until the huge machine stopped less than twenty yards from the place where her two red flags waved above the line.
        - id: ch01-b125
          speaker: narrator
          text: Roberta saw the huge black engine come to a complete stop, but she could not stop waving. The driver and fireman climbed down. Peter and Phyllis ran to them and poured out the story of the terrible mound beyond the bend. Still Roberta waved, though each movement became weaker and more uneven.
        - id: ch01-b126
          speaker: narrator
          text: When the others looked back, she lay across the track with both arms stretched forward, her hands still wrapped around the sticks of the little red flags.
        - id: ch01-b127
          speaker: narrator
          text: The engine driver lifted her, carried her onto the train, and laid her on the cushions of a first-class carriage.
        - id: ch01-b128
          speaker: engine_driver
          text: She's fainted, poor little thing. No wonder. I'll take a look at that mound, then we'll back up to the station and have someone see to her.
        - id: ch01-b129
          speaker: narrator
          text: It was frightening to see Roberta lying so pale and still, with blue lips slightly open.
        - id: ch01-b130
          speaker: phyllis
          text: I think that's how people look when they're dead.
          emotion: fearful
        - id: ch01-b131
          speaker: peter
          text: Don't!
          emotion: fearful
        - id: ch01-b132
          speaker: narrator
          text: They sat beside Roberta on the blue cushions while the train backed away. Before it reached their station, she sighed, opened her eyes, rolled over, and began to cry. Peter and Phyllis felt much better. They had seen her cry before, but they had never seen her faint. In fact, they had never seen anyone faint, and they had not known what to do. Crying was familiar. They could pat her back and tell her to stop, just as they always did. When the tears finally ended, they even laughed at her for being cowardly enough to faint.
        - id: ch01-b133
          speaker: narrator
          text: When the train reached the station, an excited gathering met them on the platform. The three children were treated as heroes. People praised their quick action, their common sense, and the clever way they had made a warning. There was enough praise to turn anybody's head. Phyllis enjoyed every moment of it. She had never been a real heroine before, and the feeling was delicious. Peter's ears went bright red, though he enjoyed it too. Only Roberta wished everybody would stop. More than anything, she wanted to get away.
        - id: ch01-b134
          speaker: station_master
          text: I expect you'll hear from the Railway Company about this.
        - id: ch01-b135
          speaker: narrator
          text: Roberta wished she might never hear about it again. She tugged at Peter's jacket.
        - id: ch01-b136
          speaker: roberta
          text: Please, let's go. I want to go home.
        - id: ch01-b137
          speaker: narrator
          text: So they left. As they went, the Station Master, Perks, the guards, the driver, the fireman, and the passengers all cheered.
        - id: ch01-b138
          speaker: phyllis
          text: Listen! They're cheering for us!
          emotion: happy
        - id: ch01-b139
          speaker: peter
          text: Yes. I'm glad I thought of waving something red.
        - id: ch01-b140
          speaker: phyllis
          text: And how lucky we wore our red flannel petticoats!
        - id: ch01-b141
          speaker: narrator
          text: Roberta said nothing. She was thinking about that horrible mound, and the trusting train rushing straight toward it.
        - id: ch01-b142
          speaker: peter
          text: We were the ones who saved them.
        - id: ch01-b143
          speaker: phyllis
          text: Wouldn't it have been terrible if everyone had been killed, Bobbie?
        - id: ch01-b144
          speaker: roberta
          text: We never did get any cherries.
        - id: ch01-b145
          speaker: narrator
          text: The others thought she was rather heartless.
