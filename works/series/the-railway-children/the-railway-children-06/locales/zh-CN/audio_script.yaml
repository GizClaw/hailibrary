audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细微幽默和体恤
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中
    bobbie:
      display_name: 博比
      tts:
        delivery: 真诚敏锐，关切时急切而坚定
        timbre: 清亮温暖的少女声
        pace: 自然偏快
        pitch: 中高
    peter:
      display_name: 彼得
      tts:
        delivery: 爽直自信，兴奋时干脆有力
        timbre: 明亮的少年声
        pace: 明快
        pitch: 中高
    phyllis:
      display_name: 菲莉丝
      tts:
        delivery: 天真活泼，想象丰富
        timbre: 轻盈稚嫩的女孩声
        pace: 轻快
        pitch: 高
    perks:
      display_name: 帕克斯
      tts:
        delivery: 直率健谈，带着自尊和朴实的铁路工人口吻
        timbre: 粗粝而亲切
        pace: 适中偏快
        pitch: 中低
    driver:
      display_name: 火车司机
      tts:
        delivery: 豪爽亲切，带朴实的铁路工人口吻
        timbre: 粗厚洪亮
        pace: 稳健
        pitch: 中低
    station_master:
      display_name: 站长
      tts:
        delivery: 威严务实，善意藏在公事口吻下面
        timbre: 浑厚清楚
        pace: 稳重
        pitch: 中低
  chapters:
    - id: ch01
      title: 火车的救星
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 俄国先生一天比一天好。第二天，他已经有了起色。再过一天，精神又好了些。到了第三天，他终于能去花园坐一会儿了。大家搬来一把藤椅，又给他穿上爸爸留下的衣服。衣服原本太宽大，妈妈把袖口和裤脚缝短，穿起来也就过得去了。他脸上的疲惫和惊恐渐渐消散，孩子们这才看清，那原来是一张很和善的脸。每逢见到他们，他都会微笑。孩子们也朝他笑，只恨他不会说英语，没法真正聊上几句。
        - id: ch01-b02
          speaker: narrator
          text: 妈妈一连写了好几封信，想打听他的妻子和儿女究竟住在英国哪里。她没有写给搬到三烟囱以前认识的那些人。自从来到这里，她从没给他们写过信。她找的是些素不相识的人，有国会议员，有报纸编辑，还有各个协会的秘书。自己的故事，她几乎顾不上写了。她只坐在俄国先生旁边晒着太阳，改改已经排好的清样，再隔一会儿陪他说上几句话。
        - id: ch01-b03
          speaker: narrator
          text: 孩子们也想让俄国先生明白，他们真心同情他。他不过写了一本讲穷人的好书，竟被关进监狱，还给发配到了西伯利亚。他们当然可以对他笑，也的确笑了很多回。可一个人若是总笑，笑容就会僵在脸上，活像鬣狗永远咧着嘴。那就不再显得友善，只显得傻里傻气。于是，他们决定换一种办法，开始给他送花。没过多久，藤椅周围全是小花束，三叶草、玫瑰和风铃草一束束摆着，又一束束慢慢枯萎。
        - id: ch01-b04
          speaker: narrator
          text: 这时，菲莉丝忽然有了主意。她神秘地招招手，把哥哥姐姐领进后院，躲到水泵和蓄水桶之间。
        - id: ch01-b05
          speaker: phyllis
          text: 你们记不记得，帕克斯答应把他园子里第一批熟草莓送给我？我猜现在已经熟了。我们下去看看吧。
        - id: ch01-b06
          speaker: narrator
          text: 妈妈早已照约定去过车站，把俄国囚徒的故事讲给站长听。可三个孩子一直守在这位有趣的陌生人附近，连最心爱的铁路也没法把他们拉走。他们整整三天没去车站。现在，为了帕克斯家的草莓，他们终于又去了。谁也没料到，帕克斯对他们冷淡得出奇。三张脸刚从搬运工休息室门口探进去，他只瞥了一眼，手里仍旧举着报纸。
        - id: ch01-b07
          speaker: perks
          text: 哟，真是荣幸之至。
        - id: ch01-b08
          speaker: narrator
          text: 说完，他继续看报。一阵让人浑身不自在的沉默落了下来。
        - id: ch01-b09
          speaker: bobbie
          text: 哎呀，你一定在生我们的气。
        - id: ch01-b10
          speaker: perks
          text: 我？我才不生气！反正什么都跟我没关系。
        - id: ch01-b11
          speaker: peter
          text: 什么跟你没关系？
        - id: ch01-b12
          speaker: narrator
          text: 彼得又慌又急，连帕克斯那句别扭话也原样接了过来。
        - id: ch01-b13
          speaker: perks
          text: 没什么就是没什么。不论这里还是别处发生了事，你们愿意藏着秘密，就痛痛快快藏着吧。我就这句话。
        - id: ch01-b14
          speaker: narrator
          text: 三个孩子赶紧把心里藏秘密的每个角落搜了一遍，随后一齐摇头。
        - id: ch01-b15
          speaker: bobbie
          text: 可我们没有瞒着你的秘密呀。
        - id: ch01-b16
          speaker: perks
          text: 也许没有，也许有。反正不关我的事。祝你们下午愉快。
        - id: ch01-b17
          speaker: narrator
          text: 帕克斯把报纸挡在彼此中间，又看了起来。
        - id: ch01-b18
          speaker: phyllis
          text: 求你别这样，这可太难受了！不论我们做错了什么，你总得告诉我们呀。
        - id: ch01-b19
          speaker: peter
          text: 对，不管是什么，我们都不是故意的。
        - id: ch01-b20
          speaker: narrator
          text: 帕克斯还是不作声，只把报纸重新折好，换了一栏接着读。
        - id: ch01-b21
          speaker: peter
          text: 这不公平。就算有人犯了罪，也该先告诉他为什么受罚。只有从前的俄国才不说一声就罚人。
        - id: ch01-b22
          speaker: perks
          text: 俄国怎么样，我半点也不知道。
        - id: ch01-b23
          speaker: peter
          text: 你怎么会不知道？妈妈特意来车站，把我们那位俄国人的事讲给你和吉尔斯先生听了。
        - id: ch01-b24
          speaker: perks
          text: 你想得倒美！你们哪只眼睛看见吉尔斯先生请我进办公室，让我坐下听夫人讲话了？
        - id: ch01-b25
          speaker: bobbie
          text: 难道你真的一点也没听说？
        - id: ch01-b26
          speaker: perks
          text: 半丝风声都没有。我不过问了一句，他就像捕鼠夹似的啪一下堵住我的嘴，还说什么“国家大事，帕克斯”。我还当你们总有一个会跑来告诉我呢。你们要从老帕克斯这里打听机车、信号之类的事，倒总是来得飞快。
        - id: ch01-b27
          speaker: narrator
          text: 听见这话，菲莉丝想起自己此行是为了草莓，脸顿时涨成了紫红色。三个孩子又一起抢着解释。有的说，他们不知道帕克斯没听说。有的说，他们以为妈妈已经讲过。还有一个一口气嚷着，他们本想来说，可又怕消息早就不新鲜了。
        - id: ch01-b28
          speaker: narrator
          text: 帕克斯嘴里说着，这些话讲得可真轻巧，报纸却依然高高挡着。菲莉丝忽然把报纸抢走，一把搂住他的脖子。
        - id: ch01-b29
          speaker: phyllis
          text: 来吧，我们亲一下就和好。要我们先赔不是也行。可我们真的不知道，你根本没听说呀。
        - id: ch01-b30
          speaker: bobbie
          text: 我们真的很抱歉。
        - id: ch01-b31
          speaker: narrator
          text: 彼得也赶紧道歉。帕克斯这才答应原谅他们。孩子们把他拉到外面，大家坐上阳光晒得暖烘烘的铁路堤坡。他们有时轮流讲，有时三个一齐开口，总算把俄国囚徒的遭遇从头到尾讲给他听了。
        - id: ch01-b32
          speaker: perks
          text: 哎，我可得说……
        - id: ch01-b33
          speaker: narrator
          text: 可他究竟要说什么，到底也没有说出口。
        - id: ch01-b34
          speaker: peter
          text: 这事的确很可怕，对吧？所以你想知道那个俄国人是谁，一点也不奇怪。
        - id: ch01-b35
          speaker: perks
          text: 我不是好奇，最多只是关心一下。
        - id: ch01-b36
          speaker: peter
          text: 不过吉尔斯先生真该告诉你。他这样太可恶了。
        - id: ch01-b37
          speaker: perks
          text: 我可不为这事记恨他，小姐。我明白他的道理。这种故事会让自己那边丢脸，他当然不想说，这也是人之常情。不论自己那一边干过什么，男子汉都得替它撑腰，这就叫党派政治。要是那个长头发的家伙是日本人，我也会这么办。
        - id: ch01-b38
          speaker: bobbie
          text: 可日本人又没有做过那样残忍又邪恶的事。
        - id: ch01-b39
          speaker: perks
          text: 也许没有。不过外国人的事，你可说不准。依我看，他们全是一路货色。
        - id: ch01-b40
          speaker: peter
          text: 那你为什么偏偏支持日本人？
        - id: ch01-b41
          speaker: perks
          text: 因为总得选一边呀，不是这边，就是那边。自由党和保守党也一样。要紧的是先挑好一边，以后无论发生什么，都得站稳了。
        - id: ch01-b42
          speaker: narrator
          text: 信号响了。帕克斯听声便知道，三点十四分的上行车来了。
        - id: ch01-b43
          speaker: perks
          text: 你们先躲好，等车过去，我们就到我家看看。我答应过的草莓，也许真有熟的了。
        - id: ch01-b44
          speaker: phyllis
          text: 要是真有熟草莓，你也真的愿意送给我，那我把它们送给可怜的俄国先生，你不会介意吧？
        - id: ch01-b45
          speaker: narrator
          text: 帕克斯先眯起眼睛，接着高高挑起眉毛。
        - id: ch01-b46
          speaker: perks
          text: 原来你们今天下午来车站，是惦记我的草莓呀？
        - id: ch01-b47
          speaker: narrator
          text: 菲莉丝为难极了。承认吧，似乎又贪嘴又失礼，还会伤帕克斯的心。不承认吧，她明白自己以后准会瞧不起自己。最后，她还是说了实话。
        - id: ch01-b48
          speaker: phyllis
          text: 是的，我们就是为了草莓来的。
        - id: ch01-b49
          speaker: perks
          text: 好样的！说真话，让那个……无地自容。
        - id: ch01-b50
          speaker: phyllis
          text: 可要是知道你没听过俄国先生的故事，我们第二天一定就来看你了。
        - id: ch01-b51
          speaker: perks
          text: 我信你，小姐。
        - id: ch01-b52
          speaker: narrator
          text: 话音才落，他便从迎面驶来的火车前方一跃，跳过铁轨。火车离他只有六英尺。两个姑娘最怕看见他这样，彼得却觉得刺激极了。
        - id: ch01-b53
          speaker: narrator
          text: 俄国先生收到草莓，果然高兴得不得了。三个孩子马上又想送他一份惊喜。他们把脑筋绞了又绞，却没想出比野樱桃更新奇的礼物。这个主意是第二天早晨冒出来的。春天时，他们见过峭壁上的樱桃花。如今正逢樱桃成熟的季节，他们自然知道该去哪里找果子。隧道口就开在那片石坡底下，坡上生着白桦、山毛榉、小橡树和榛树。夹在树丛里的樱桃花，春天曾经像白雪和银子一样闪亮。
        - id: ch01-b54
          speaker: narrator
          text: 隧道离三烟囱不近，妈妈便让他们提一篮午饭出门。要是真找到樱桃，吃完午饭的篮子正好还能把果子带回家。她又借出自己的银表，免得他们错过下午茶。彼得的沃特伯里牌手表自从掉进蓄水桶，就自作主张，再也不肯走了。三个孩子一路来到路堑顶上，趴在栅栏边往下望。铁轨横在深处，活像铺在山峡底下。
        - id: ch01-b55
          speaker: phyllis
          text: 要不是下面有铁路，这地方简直像从来没人来过，对不对？
        - id: ch01-b56
          speaker: narrator
          text: 路堑两边都是开凿得粗糙不平的灰岩。上半截原本是一条天然小山谷，修铁路的人为了让谷底跟隧道口齐平，才又向下挖深。岩石间长着草和花。鸟儿把种子丢进石缝，那些种子便在那里生根，长成了灌木和大树，枝叶都悬到了路堑上方。隧道旁边有一段路通向铁轨，不过是几根木条粗粗钉进泥土。它又陡又窄，与其说是台阶，看着倒更像一架梯子。
        - id: ch01-b57
          speaker: peter
          text: 我们最好下去。从台阶旁边伸手，摘樱桃一定很容易。还记得兔子坟上的樱桃花吗？就是在那儿摘的。
        - id: ch01-b58
          speaker: narrator
          text: 他们沿栅栏走向台阶顶上的小门。快到门口时，博比忽然叫大家别动。
        - id: ch01-b59
          speaker: bobbie
          text: 嘘，停下！那是什么声音？
        - id: ch01-b60
          speaker: narrator
          text: 那声音又轻又怪。树枝里有风，电报线也嗡嗡颤响，可他们还是听得很清楚。起初像窸窸窣窣的低语，响了一会儿，又停下。随后它重新响起，不但没有消失，反而越来越响，渐渐变成沉沉的隆隆声。
        - id: ch01-b61
          speaker: peter
          text: 快看，那边那棵树！
        - id: ch01-b62
          speaker: narrator
          text: 那是一种灰叶白花的树，叶片摸起来很粗糙。它结出的果子成熟时鲜红好看，可你一旦摘下，往往还没带回家就会变黑，准叫人失望。现在，这棵树竟然在移动。不是被风吹过时那种枝叶摇摆，而是整棵树一齐往下走。它仿佛突然活了过来，正沿着路堑的斜坡一步步往下迈。
        - id: ch01-b63
          speaker: bobbie
          text: 它真的在动！你们看，别的树也动了。简直就是《麦克白》里的树林！
        - id: ch01-b64
          speaker: phyllis
          text: 这是魔法。我早就知道，这条铁路一定中了魔法。
          emotion: surprised
        - id: ch01-b65
          speaker: narrator
          text: 眼前的景象确实像魔法。对面有二十码宽的一片树林，所有树都缓缓走向铁轨。灰叶子的树落在最后，像个年老的牧人，赶着一群绿色的羊。
        - id: ch01-b66
          speaker: phyllis
          text: 到底是什么呀？这魔法太厉害了，我受不了。我不喜欢，我们回家吧。
          emotion: fearful
        - id: ch01-b67
          speaker: narrator
          text: 博比和彼得紧抓栏杆，屏住呼吸，一动不动地看着。菲莉丝嘴上要回家，却也没打算独自走。树木还在下移。石块和松土滚到下面的铁轨上，发出一阵哐啷声。
        - id: ch01-b68
          speaker: peter
          text: 整片山坡都要塌下来了。
          emotion: fearful
        - id: ch01-b69
          speaker: narrator
          text: 彼得喉咙发紧，几乎说不出这句话。就在这一刻，托住那些行走的树木的巨大岩体，缓缓向前倾斜。树不再往下走了。它们站在原地，浑身颤抖，又随着岩石一起歪向前方，仿佛还迟疑了一瞬。下一刻，岩石、树木、青草和灌木带着轰隆隆的响声滑下峭壁，一股脑儿砸上铁轨。那声笨重的巨响，半英里外都能听见。尘土一下冲向天空。
        - id: ch01-b70
          speaker: peter
          text: 这不就像人家把煤倒进地窖吗？只不过地窖没有屋顶，我们还能从上面看见。
        - id: ch01-b71
          speaker: bobbie
          text: 看哪，下面堆起了好大一座山！
        - id: ch01-b72
          speaker: narrator
          text: 彼得靠在栅栏上，慢慢答了一声。隔了一会儿，他又更慢地说了一声“是啊”。随后，他突然站直身子。
        - id: ch01-b73
          speaker: peter
          text: 十一点二十九分的下行车还没经过。我们得赶快通知车站，不然一定会出可怕的大事故。
        - id: ch01-b74
          speaker: bobbie
          text: 那就快跑！
        - id: ch01-b75
          speaker: narrator
          text: 博比已经起步，彼得却叫她回来。他低头看看妈妈的表，像处理正事那样又快又果断。可他的脸白得吓人，两个姑娘从没见过他这副样子。
        - id: ch01-b76
          speaker: peter
          text: 来不及。车站在两英里外，现在已经过十一点了。
        - id: ch01-b77
          speaker: phyllis
          text: 那我们能不能爬上电报杆，想办法动一动电线？
        - id: ch01-b78
          speaker: peter
          text: 我们又不会弄。
        - id: ch01-b79
          speaker: phyllis
          text: 打仗的时候，人们就是这样做的。我听说过。
        - id: ch01-b80
          speaker: peter
          text: 人家只是把电线割断，傻瓜。割断也没用。何况我们爬不上去，就算上去了也割不断。要是有件红东西，我们可以下到铁路边，挥给火车看。
        - id: ch01-b81
          speaker: phyllis
          text: 可火车要转过弯才看得见我们。到了那时候，它也会看见土石堆，而且土石堆比我们大，看得还更清楚。
        - id: ch01-b82
          speaker: peter
          text: 只要有红东西，我们就能绕过弯，在前面拦住火车。
        - id: ch01-b83
          speaker: phyllis
          text: 没有红东西，我们也可以挥手呀。
        - id: ch01-b84
          speaker: peter
          text: 我们平时挥过那么多次，他们只会以为又是我们在打招呼。先下去再说。
        - id: ch01-b85
          speaker: narrator
          text: 三个人走下陡梯。博比脸色苍白，身体发抖。彼得的脸仿佛突然瘦了一圈。菲莉丝又急又热，脸涨得通红，满是汗水。
        - id: ch01-b86
          speaker: phyllis
          text: 我怎么这么热！早知道就不该因为怕冷，穿上我们的……法兰绒衬裙。
        - id: ch01-b87
          speaker: narrator
          text: 她说到一半突然停住，最后几个字的声音完全变了。博比也在台阶底下猛地回过头。
        - id: ch01-b88
          speaker: bobbie
          text: 对呀，衬裙是红的！我们快脱下来！
        - id: ch01-b89
          speaker: narrator
          text: 两个姑娘当即脱下衬裙，卷好夹在胳膊底下。三个人沿铁路拼命奔跑，绕过刚坍下来的石块、岩块和泥土，也绕过那些折弯、压碎、扭曲的树。彼得领头，两个姑娘紧跟在后，谁也不肯慢下来。他们终于跑过弯道，来到一段半英里长的笔直铁路。火车可以从这里看见他们，却还看不见弯道后的土石堆。
        - id: ch01-b90
          speaker: narrator
          text: 彼得一把抓住最大的那条红衬裙。菲莉丝看出他的打算，声音都结巴了。
        - id: ch01-b91
          speaker: phyllis
          text: 你不会是想把它们撕掉吧？
        - id: ch01-b92
          speaker: peter
          text: 别出声。
        - id: ch01-b93
          speaker: bobbie
          text: 当然要撕，撕多碎都可以。菲尔，要是拦不住火车，就真的会出事故，会有人死的。快给我吧，彼得。腰头这么结实，你永远也撕不开。
        - id: ch01-b94
          speaker: narrator
          text: 博比接过衬裙，在离腰头一英寸的地方撕下裙身，另一条也照样撕开。彼得接着动手，把两条衬裙各自扯成三片。
        - id: ch01-b95
          speaker: peter
          text: 好，现在有六面旗。只剩七分钟，我们还得找旗杆。
        - id: ch01-b96
          speaker: narrator
          text: 不知为什么，送给男孩子的小刀很少用那种能一直保持锋利的钢制成。这一把也不例外，根本削不断小树苗。孩子们只好用手去折，结果还有两棵连根拔了起来。他们把枝叶一把把捋干净。彼得又叫大家在红布上割洞，把光秃秃的树棍穿进去。好在小刀切法兰绒还算锋利。他们把两面旗插进下行线枕木之间的碎石堆，仔细用石头垫住。菲莉丝和博比也各自拿起一面，只等火车出现就开始挥。
        - id: ch01-b97
          speaker: peter
          text: 剩下两面都归我。毕竟挥红东西是我想出来的。
        - id: ch01-b98
          speaker: phyllis
          text: 可那明明是我们的衬裙……
        - id: ch01-b99
          speaker: bobbie
          text: 只要能救下火车，谁挥哪面旗有什么关系？
        - id: ch01-b100
          speaker: narrator
          text: 也许彼得算错了十一点二十九分那班车从车站开到这里要用的时间，也许火车本身晚点了。不管是哪一种，他们只觉得这一等漫长得没有尽头。
        - id: ch01-b101
          speaker: phyllis
          text: 一定是手表不准，火车早就开过去了。
        - id: ch01-b102
          speaker: narrator
          text: 彼得原本举着两面旗，特意摆出一副英勇的姿态，这时也渐渐松懈下来。博比更是等得阵阵恶心。她觉得他们已经站了好几个钟头，手里的红法兰绒小旗又傻又不起眼，根本不会有人看见。火车才不会理会他们。它会从身边呼啸而过，猛地冲进弯道，一头撞上那座可怕的土石堆。然后，车上的人全都会死。她越想越害怕，双手也越来越冷，抖得几乎抓不住旗杆。
        - id: ch01-b103
          speaker: narrator
          text: 突然，远处的铁轨传来低低的隆隆声和嗡鸣声。笔直的铁道尽头，冒出了一小团白色蒸汽。
        - id: ch01-b104
          speaker: peter
          text: 站稳，使劲挥！等它开到那丛大金雀花旁边就往后退，可别停手！博比，不许站到铁轨上！
        - id: ch01-b105
          speaker: narrator
          text: 火车哐啷哐啷地逼近，速度快得惊人。
        - id: ch01-b106
          speaker: bobbie
          text: 他们没看见！他们不会看见我们的！一点用也没有！
          emotion: fearful
        - id: ch01-b107
          speaker: narrator
          text: 列车的震动传到脚下，两面插在铁轨间的小旗摇摆起来，碎石也渐渐松脱。一面旗慢慢倒下，落在钢轨上。博比冲过去，一把将它捡起，再次用力挥动。这一刻，她的手不抖了。可火车仿佛仍旧没有减速，转眼已经近在眼前。
        - id: ch01-b108
          speaker: peter
          text: 快离开铁轨，你这个傻杜鹃！
          emotion: angry
        - id: ch01-b109
          speaker: bobbie
          text: 没有用。
        - id: ch01-b110
          speaker: peter
          text: 往后退！
          emotion: fearful
        - id: ch01-b111
          speaker: narrator
          text: 彼得猛地将菲莉丝拖开，博比却仍然站在那里。
        - id: ch01-b112
          speaker: bobbie
          text: 还不行，还不能退！停下来，停下来，快停下来！
          emotion: fearful
        - id: ch01-b113
          speaker: narrator
          text: 她把两面旗伸到铁轨上方，拼命挥舞。机车正面黑沉沉地压过来，越变越大，庞大得吓人，发出的吼声又粗又尖。没有人听得见博比的呼喊。至少彼得和菲莉丝听不见。迎面扑来的列车卷起一座声音的大山，把她的声音整个压在下面。博比眼前只剩下那台还在逼近的黑色机车。
        - id: ch01-b114
          speaker: narrator
          text: 后来，博比总忍不住猜想，也许机车自己听见了她的呼喊。看起来简直像是真的。它竟迅速减速，越来越慢，终于停住。车头离那两面红旗不到二十码。博比亲眼看着巨大的黑色机车猛然停稳，自己的双手却怎么也停不下来。司机和司炉跳下车，彼得和菲莉丝跑过去，激动地抢着讲弯道后的土石堆。她还在挥，只是一下比一下无力，动作也越来越僵硬。
        - id: ch01-b115
          speaker: narrator
          text: 等大家回头时，博比已经横倒在铁轨上。她两臂伸向前方，手里还紧握着红法兰绒小旗的木棍。司机赶紧抱起她，送进头等车厢，让她躺在蓝色软座上。
        - id: ch01-b116
          speaker: driver
          text: 她彻底昏过去了，可怜的小姑娘。也难怪。等我先去看看你们说的土石堆，我们就把车倒回车站，找人来给她瞧瞧。
        - id: ch01-b117
          speaker: narrator
          text: 博比躺在那里，脸色惨白，一动不动。她的嘴唇微微张着，已经变成青色，样子实在可怕。
        - id: ch01-b118
          speaker: phyllis
          text: 我想，人死掉以后就是这个样子。
          emotion: fearful
        - id: ch01-b119
          speaker: peter
          text: 别说了！
          emotion: angry
        - id: ch01-b120
          speaker: narrator
          text: 两人坐在蓝色软座上，守在博比身边，列车缓缓倒回去。还没到车站，她便叹了口气，睁开眼睛，翻过身哭了起来。彼得和菲莉丝顿时高兴极了。博比哭，他们见得多了，可她昏过去的样子，他们从没见过。事实上，他们也没见过任何人昏倒。刚才两人完全不知所措，现在她只是哭，他们总算可以像平常一样拍拍她的背，劝她别哭。等她止住眼泪，他们甚至有胆量笑她太胆小，竟然吓昏了。
        - id: ch01-b121
          speaker: narrator
          text: 火车回到车站，三个孩子立刻成了站台上那场激动聚会的英雄。人们围住他们，夸他们行动果断，夸他们有常识，更夸他们急中生智。这些赞美，足以把任何人的头都弄昏。菲莉丝从没真正当过英雄，简直喜欢死这种滋味。彼得的耳朵红透了，不过他其实也很享受。只有博比巴不得所有人马上停下来。她一点也不想听那些赞扬，一心只想离开。
        - id: ch01-b122
          speaker: station_master
          text: 我想，铁路公司以后还会为这件事来找你们。
        - id: ch01-b123
          speaker: narrator
          text: 博比却盼着这辈子再也别听人提起这件事。她轻轻扯了扯彼得的上衣。
        - id: ch01-b124
          speaker: bobbie
          text: 我们走吧，快走吧。我想回家。
        - id: ch01-b125
          speaker: narrator
          text: 于是，三个孩子离开站台，踏上回家的路。身后，站长、搬运工、列车员、司机、司炉和乘客全都站在那里，一齐为他们大声欢呼。那阵欢呼一直追在三个孩子身后。
        - id: ch01-b126
          speaker: phyllis
          text: 听哪，他们是在为我们欢呼！
          emotion: happy
        - id: ch01-b127
          speaker: peter
          text: 是啊。幸亏我想到了红色的东西，也想到了挥旗。
          emotion: happy
        - id: ch01-b128
          speaker: phyllis
          text: 也幸亏我们今天真的穿了红法兰绒衬裙！
          emotion: happy
        - id: ch01-b129
          speaker: narrator
          text: 博比一声不响。她脑子里只有那座可怕的土石堆，还有那列毫不怀疑前方、径直向它飞驰的火车。
        - id: ch01-b130
          speaker: peter
          text: 而且，真的是我们救了车上的人。
        - id: ch01-b131
          speaker: phyllis
          text: 要是他们全都死了，那该多可怕呀。博比，你说是不是？
        - id: ch01-b132
          speaker: bobbie
          text: 可到头来，我们一颗樱桃也没摘到。
        - id: ch01-b133
          speaker: narrator
          text: 彼得和菲莉丝听了，都觉得博比真有点没心肝。
