cover_prompt: |-
  A wordless cover scene beside an English country railway around 1905 shows Bobbie, Peter, and Phyllis acting together beside the tracks. Bobbie is a responsible twelve-year-old with auburn hair under a straw hat and a dark red dress, Peter an eager ten-year-old in a brown Norfolk jacket and knickerbockers, and Phyllis an eight-year-old in a pale blue pinafore and buttoned boots. The three children wave improvised red petticoat flags toward an approaching steam train while standing safely well clear of the rails. Their urgent coordinated signal is the focal action, with a station cottage, green cutting, telegraph poles, and white steam establishing the period. Use a wide track-level diagonal view that keeps the children prominent but separated from the train, leaving broad calm sky above the rising steam. Keep the action readable and safe, with accurate Edwardian clothing and railway details and no adaptation likenesses. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
