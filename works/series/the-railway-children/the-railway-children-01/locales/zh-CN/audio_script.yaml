audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，含蓄地带一点幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    roberta:
      display_name: 罗伯塔
      tts:
        delivery: 敏感体贴，认真而克制
        timbre: 清亮柔和的少女声
        pace: 自然，情急时稍快
        pitch: 中高音
    peter:
      display_name: 彼得
      tts:
        delivery: 直率好强，活泼中带孩子气的逞强
        timbre: 明亮的男孩声
        pace: 利落，激动时加快
        pitch: 中高音
    phyllis:
      display_name: 菲莉丝
      tts:
        delivery: 天真坦率，好心又略显冒失
        timbre: 轻快稚嫩的女孩声
        pace: 轻快自然
        pitch: 高音
    mother:
      display_name: 妈妈
      tts:
        delivery: 慈爱温柔，困顿时仍努力镇定
        timbre: 温润清晰的成年女声
        pace: 从容舒缓
        pitch: 中音
    father:
      display_name: 爸爸
      tts:
        delivery: 开朗诙谐，亲切而笃定
        timbre: 温厚明朗的成年男声
        pace: 从容，玩笑时轻快
        pitch: 中低音
    ruth:
      display_name: 露丝
      tts:
        delivery: 口气直冲，带着佣人的市井腔调
        timbre: 略粗亮的年轻女声
        pace: 偏快
        pitch: 中音
    cart_driver:
      display_name: 赶车人
      tts:
        delivery: 朴实随意，带乡间口吻
        timbre: 粗厚的成年男声
        pace: 不紧不慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 原来幸福的日子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 起先，这三个孩子跟铁路可没什么关系。他们想到铁路，只会想到坐火车去看魔术、圣诞童话剧、动物园和蜡像馆。他们是再普通不过的郊区孩子，跟爸爸妈妈住在一幢临街砌着红砖的别墅里。前门有彩色玻璃，过道铺着花砖，却郑重地叫作门厅。家里有冷热水浴室、电铃、法式落地窗，还有一大片一大片的白漆。用房屋经纪人的话说，那就是“一切现代化便利设施齐全”。
        - id: ch01-b02
          speaker: narrator
          text: 三个孩子里，罗伯塔最大。妈妈当然不会偏爱谁。不过，要是她真有一个最偏爱的孩子，那也许就是罗伯塔。老二彼得一心想长大当工程师。最小的菲莉丝呢，不管做成什么样，总归是一片好心。
        - id: ch01-b03
          speaker: narrator
          text: 妈妈也不像有些太太那样，不是去拜访无聊的人，就是无聊地待在家里等人来访。她几乎总陪着孩子们，跟他们玩，给他们念书，还帮他们做家庭功课。孩子上学时，她会写故事，下午茶后再念给他们听。每逢生日，她还会编好玩的诗。其实，不光生日算大日子。小猫受洗、玩偶屋换了摆设，甚至孩子们刚从腮腺炎里恢复过来，都值得写一首。
        - id: ch01-b04
          speaker: narrator
          text: 他们什么也不缺。有好看的衣裳、旺旺的炉火，还有一间可爱的游戏室，里头堆满玩具，墙上贴着鹅妈妈壁纸。保姆和气又快活。名叫詹姆斯的狗完完全全属于他们。爸爸更是好得不能再好，从不乱发脾气，也从不偏心，随时愿意陪孩子们玩。偶尔不能陪，他也总有很好的理由，还能把理由讲得那么有趣，叫孩子们相信他实在没有办法。
        - id: ch01-b05
          speaker: narrator
          text: 你一定觉得，他们应该很幸福。没错，他们的确幸福。只是那时谁也不知道，直到红砖别墅里的美好生活全都结束，他们换了一种完全不同的活法，才明白从前究竟有多幸福。
        - id: ch01-b06
          speaker: narrator
          text: 可怕的变化来得毫无预兆。彼得十岁生日那天，收到了一台精巧得让人想也想不到的火车模型。别的礼物也都很迷人，可跟它一比，全都逊色了。
        - id: ch01-b07
          speaker: narrator
          text: 这台小火车完美的魅力，一共只保持了三天。到了第三天，也不知是彼得经验不够，还是菲莉丝那番好心使得太用力，或者另有原因，它忽然“砰”的一声炸了。詹姆斯吓得逃出门，一整天不肯回来。煤水车里的诺亚方舟小人全摔碎了。别的倒没受伤，除了可怜的小火车，还有彼得那颗受伤的心。
        - id: ch01-b08
          speaker: narrator
          text: 别人说彼得哭过。可十岁的男孩当然是不会哭的，哪怕再可怕的悲剧笼罩了他的人生，也不会。他坚持说，眼睛发红是因为伤风。第二天，这话居然成了真的，虽说他讲那句话时自己还不知道。他病得只能躺在床上。妈妈正担心他是不是要出麻疹，彼得突然坐了起来。
        - id: ch01-b09
          speaker: peter
          text: 我不吃麦片粥，也不要大麦水，面包牛奶我也讨厌。我想起床，吃点真正能吃的东西。
          emotion: disgusted
        - id: ch01-b10
          speaker: mother
          text: 那你想吃什么呢？
        - id: ch01-b11
          speaker: peter
          text: 乳鸽馅饼。我要一个大的，特别特别大的乳鸽馅饼。
        - id: ch01-b12
          speaker: narrator
          text: 妈妈就请厨娘做了一个大乳鸽馅饼。馅饼和好后送进炉里，烤熟了，彼得吃了几块，伤风果然也轻了。等馅饼的时候，妈妈还写了首诗逗他。先说彼得是个运气不好、品行却很端正的男孩，后面这样唱道。
        - id: ch01-b13
          speaker: mother
          text: 他有一台小火车，一颗心儿全爱它。世上若有一个愿，只愿它永不垮。有一天呀诸位听，最惨的事就要来。一颗螺丝忽发疯，锅炉跟着炸开怀！他愁眉苦脸捧起来，拿去求他的妈妈。连他自己也明白，妈妈造不出另一个它。铁路上遇难的那些人，他倒像半点不牵挂。只因这一台小火车，胜过那一车人马。如今你总算看明白，我们彼得为何病啦。乳鸽馅饼安慰心灵，啃人的悲伤赶走它。暖暖毯子裹全身，一觉睡到日头高。他决心用这个办法，把悲惨命运打倒。要是双眼有点红，伤风自会替他解释。给他馅饼就没错，保准来者不辞。
        - id: ch01-b14
          speaker: narrator
          text: 爸爸已经去乡下三四天了。现在，彼得只盼着爸爸回来救活那台苦命的小火车，因为爸爸的一双手简直神了，什么都能修。他常给木摇马当兽医。有一次，人人都觉得摇马没救了，连木匠也说没办法，爸爸却救了它。他还修好了别人都修不了的玩偶摇篮。至于诺亚方舟里的动物，爸爸拿一点胶水、几块木片和一把小折刀，就叫它们重新稳稳地站起来，甚至比原先还结实。
        - id: ch01-b15
          speaker: narrator
          text: 爸爸回家后，彼得非常无私地忍住了。他等爸爸吃完饭，又抽完饭后的雪茄，才说小火车的事。虽说等待是妈妈的主意，真正耐着性子做到的却是彼得，这也很不容易。
    - id: ch02
      title: 爸爸被叫走了
      blocks:
        - id: ch02-b01
          speaker: mother
          text: 亲爱的，你现在歇够了吗？要是已经舒舒服服的，我们想讲讲那场铁路大惨案，请你替我们想想办法。
        - id: ch02-b02
          speaker: father
          text: 好啊，尽管说！
        - id: ch02-b03
          speaker: narrator
          text: 彼得把那段伤心的经过讲了一遍，又取来小火车剩下的残骸。爸爸翻来覆去，仔仔细细地看了很久。
        - id: ch02-b04
          speaker: father
          text: 唔，这台小火车我已经仔细看过了。
        - id: ch02-b05
          speaker: narrator
          text: 三个孩子一起屏住了呼吸。
        - id: ch02-b06
          speaker: peter
          text: 难道……真的一点希望都没有了吗？
          emotion: sad
        - id: ch02-b07
          speaker: father
          text: 希望？当然有，多着呢！不过不能只靠希望。得铜焊一下，或者加点焊锡，还要换个新汽门。这活儿留到下雨天做好了。也就是说，星期六下午我不做别的，你们全都来帮忙。
        - id: ch02-b08
          speaker: peter
          text: 女孩子也会修火车吗？
        - id: ch02-b09
          speaker: father
          text: 当然会。女孩子跟男孩子一样聪明，你可一定记住。菲尔，你想不想当火车司机？
        - id: ch02-b10
          speaker: phyllis
          text: 那我的脸不就总是脏的吗？再说，我大概还会弄坏东西。
        - id: ch02-b11
          speaker: roberta
          text: 我可喜欢了！爸爸，等我长大了，真的能去开火车吗？就算只让我当司炉工也好。
          emotion: happy
        - id: ch02-b12
          speaker: father
          text: 你说的是往炉子里添煤的工人吧。行啊，等你长大了还想干，我们就想办法让你做个女司炉工。说起我小时候——
        - id: ch02-b13
          speaker: narrator
          text: 他正拉着、拧着那台小火车，前门突然有人敲响了。
        - id: ch02-b14
          speaker: father
          text: 这时候来的到底是谁！都说英国人的家就是他的城堡，可他们造半独立式别墅时，怎么不顺便造条护城河，再配一座吊桥呢？
        - id: ch02-b15
          speaker: narrator
          text: 红头发的客厅女仆露丝进来，说有两位先生求见男主人。
        - id: ch02-b16
          speaker: ruth
          text: 先生，我已经请他们到书房里了。
        - id: ch02-b17
          speaker: mother
          text: 我猜，是来收给牧师送纪念品的捐款，要不就是唱诗班的度假基金。亲爱的，快把他们打发走吧。他们一来，整个晚上都搅乱了，孩子们也快到睡觉时间啦。
        - id: ch02-b18
          speaker: narrator
          text: 可爸爸没能很快送走客人。
        - id: ch02-b19
          speaker: roberta
          text: 要是咱家真有护城河和吊桥就好了。不想见人时，把吊桥一拉，谁也进不来。他们再不走，爸爸肯定连小时候的故事都忘了。
        - id: ch02-b20
          speaker: narrator
          text: 为了叫时间过得快一点，妈妈讲起一个绿眼睛公主的新童话。可大家听不进去。他们隔着门也能听见书房里的说话声，爸爸的声音比平常接待募捐的人时响得多，听起来也不一样。
        - id: ch02-b21
          speaker: narrator
          text: 终于，书房里的铃响了。每个人都长长地松了口气。
        - id: ch02-b22
          speaker: phyllis
          text: 他们这就要走了。爸爸在按铃，叫露丝进去送客呢。
        - id: ch02-b23
          speaker: narrator
          text: 露丝却没有把谁送出去。她自己进了房间，脸上的神情怪得让孩子们不安。
        - id: ch02-b24
          speaker: ruth
          text: 太太，先生请您去一趟书房。他的脸白得跟死人一样。我看，他准是听到了坏消息。您得先往最坏的地方想。也许是家里死了人，也许是银行倒了，或者——
          emotion: fearful
        - id: ch02-b25
          speaker: mother
          text: 行了，露丝。你下去吧。
          emotion: calm
        - id: ch02-b26
          speaker: narrator
          text: 妈妈去了书房。里面又响起一阵谈话声。铃再次响起时，露丝叫来一辆出租马车。孩子们听见靴子走出门，又踏下台阶。马车开走，前门关上，然后妈妈回来了。她亲爱的脸跟花边衣领一样白，眼睛又大又亮。两片嘴唇紧紧抿成一道浅红的细线，完全不是平日的样子。
        - id: ch02-b27
          speaker: mother
          text: 到睡觉时间了。今晚让露丝照料你们上床。
        - id: ch02-b28
          speaker: phyllis
          text: 可你答应过，爸爸今晚回家，我们可以晚一点睡呀。
        - id: ch02-b29
          speaker: mother
          text: 爸爸临时有公事，又出门了。好了，宝贝们，现在就上楼去。
        - id: ch02-b30
          speaker: narrator
          text: 孩子们吻了妈妈，朝门口走去。罗伯塔留在最后，又紧紧抱了妈妈一下。
        - id: ch02-b31
          speaker: roberta
          text: 妈妈，那不是坏消息，对吗？没有谁死了吧？还是说——
          emotion: fearful
        - id: ch02-b32
          speaker: mother
          text: 没有人死，没有。今晚我什么都不能告诉你。乖孩子，快走吧，现在就去。
        - id: ch02-b33
          speaker: narrator
          text: 妈妈几乎把罗伯塔推开了。罗伯塔只好离开。露丝替两个女孩梳头、脱衣服，可平时这些事几乎都是妈妈亲手做的。她把煤气灯拧暗，走出房门，又在楼梯上碰见还没脱衣服的彼得。
        - id: ch02-b34
          speaker: peter
          text: 露丝，到底怎么了？
        - id: ch02-b35
          speaker: ruth
          text: 你不问我，我也就不用撒谎。反正用不了多久，你自然会知道。
        - id: ch02-b36
          speaker: narrator
          text: 深夜里，妈妈上楼来，吻了吻睡着的三个孩子。只有罗伯塔醒了。她像小耗子一样安安静静地躺着，一声也不出。黑暗中，她听见妈妈的呼吸一抽一抽的。
        - id: ch02-b37
          speaker: roberta
          text: 妈妈不想让我们知道她哭过，那我们就不知道。就这么办。
          emotion: sad
    - id: ch03
      title: 一切都糟透了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天早晨，孩子们下楼吃饭时，妈妈已经出门了。
        - id: ch03-b02
          speaker: ruth
          text: 她去伦敦了。
        - id: ch03-b03
          speaker: narrator
          text: 露丝说完就走了，把他们三个留在早饭桌旁。
        - id: ch03-b04
          speaker: peter
          text: 一定出了特别可怕的事。露丝昨晚说，我们很快就会知道。
        - id: ch03-b05
          speaker: roberta
          text: 你竟然去问她了？
          emotion: disgusted
        - id: ch03-b06
          speaker: peter
          text: 对，我就是问了！你能什么也不管，照样上床睡觉。我可没法不管妈妈是不是正在发愁。
          emotion: angry
        - id: ch03-b07
          speaker: roberta
          text: 妈妈不肯告诉我们的事，就不该跑去问佣人。
        - id: ch03-b08
          speaker: peter
          text: 是啊，假正经小姐。你接着训人好了。
        - id: ch03-b09
          speaker: phyllis
          text: 我可不假正经。不过这一回，我觉得博比说得对。
        - id: ch03-b10
          speaker: peter
          text: 那当然了。在她自己看来，她哪次不对？
        - id: ch03-b11
          speaker: roberta
          text: 别这样了！咱们不要再互相说难听话。我敢肯定，现在正发生一场大灾祸。别再把事情弄得更坏了！
          emotion: fearful
        - id: ch03-b12
          speaker: peter
          text: 那我倒想问问，到底是谁先说难听话的？
        - id: ch03-b13
          speaker: narrator
          text: 罗伯塔放下吃鸡蛋的小勺，努力压住脾气。
        - id: ch03-b14
          speaker: roberta
          text: 大概是我先开始的。可是——
        - id: ch03-b15
          speaker: peter
          text: 这不就对了。
        - id: ch03-b16
          speaker: narrator
          text: 彼得得意地赢了这场争论。可上学前，他还是在姐姐两肩中间轻轻捶了一拳，叫她振作起来。中午一点，孩子们放学回家吃饭，妈妈不在。到了下午茶时间，她仍旧没有回来。
        - id: ch03-b17
          speaker: narrator
          text: 快到晚上七点，妈妈才终于进门。她看上去又病又累，孩子们谁也忍不住问话。妈妈整个人陷进扶手椅。菲莉丝拔下她帽子上的长别针，罗伯塔替她脱掉手套，彼得解开她的外出鞋，又拿来那双柔软的便鞋。
        - id: ch03-b18
          speaker: narrator
          text: 妈妈喝下一杯茶。罗伯塔又在她疼痛的额头上擦了些古龙水。歇过这一会儿，妈妈才准备把事情告诉他们。
        - id: ch03-b19
          speaker: mother
          text: 我的宝贝们，昨晚来的那两个人，的确带来了很坏的消息。爸爸要离开一阵子。这件事让我非常担心，所以我需要你们帮忙，不要再让我为难。
          emotion: sad
        - id: ch03-b20
          speaker: roberta
          text: 我们怎么可能给你添麻烦呢！
        - id: ch03-b21
          speaker: narrator
          text: 罗伯塔说着，把妈妈的手紧紧贴在脸上。
        - id: ch03-b22
          speaker: mother
          text: 你们可以帮我很多。要乖，要高兴。我不在的时候，你们也别吵架。因为往后，我会常常不在家。
        - id: ch03-b23
          speaker: narrator
          text: 听见“不许吵架”，罗伯塔和彼得心虚地看了对方一眼。
        - id: ch03-b24
          speakers: [roberta, peter, phyllis]
          ensemble: chorus
          text: 我们不会再吵了。真的不会！
        - id: ch03-b25
          speaker: narrator
          text: 这句保证，他们全都是真心说的。
        - id: ch03-b26
          speaker: mother
          text: 还有，这场麻烦到底是什么，你们不要问我，也不要去问别人。
        - id: ch03-b27
          speaker: narrator
          text: 彼得缩了缩身子，靴子不安地在地毯上蹭着。
        - id: ch03-b28
          speaker: mother
          text: 这件事，你们也肯答应我吧？
        - id: ch03-b29
          speaker: peter
          text: 我已经问过露丝了。我真的很抱歉，可我确实问了她。
        - id: ch03-b30
          speaker: mother
          text: 那她是怎么说的？
        - id: ch03-b31
          speaker: peter
          text: 她说，我很快就会知道。
        - id: ch03-b32
          speaker: mother
          text: 你们不需要知道这件事。那是公事，公事你们一向都不明白，对不对？
        - id: ch03-b33
          speaker: roberta
          text: 对。是跟政府有关的事吗？
        - id: ch03-b34
          speaker: narrator
          text: 她会这样问，是因为爸爸就在政府部门工作。
        - id: ch03-b35
          speaker: mother
          text: 是的。好了，宝贝们，该上床了。你们不要担心，事情最后总会好起来。
          emotion: calm
        - id: ch03-b36
          speaker: phyllis
          text: 那你也不要担心，妈妈。我们保证，一个个都会乖得像金子。
        - id: ch03-b37
          speaker: narrator
          text: 妈妈叹了口气，挨个吻了他们。孩子们这才上楼。
        - id: ch03-b38
          speaker: peter
          text: 明天早晨一起来，我们就开始当乖孩子。
        - id: ch03-b39
          speaker: roberta
          text: 为什么不从现在就开始？
        - id: ch03-b40
          speaker: peter
          text: 现在什么事都没有，根本没地方让人表现乖不乖。你真傻。
        - id: ch03-b41
          speaker: phyllis
          text: 我们可以先让自己心里乖起来呀，也不要再叫别人难听的名字。
        - id: ch03-b42
          speaker: peter
          text: 谁叫难听的名字了？博比明明知道，我叫她“傻瓜”，跟喊她“博比”根本是一回事。
        - id: ch03-b43
          speaker: roberta
          text: 是吗？
        - id: ch03-b44
          speaker: peter
          text: 不对，我说的不是你想的那个意思。我是说，这只是一颗……爸爸怎么称呼的？一颗爱称的种子！晚安。
        - id: ch03-b45
          speaker: narrator
          text: 两个女孩想不出眼下还能怎样表现乖巧，只好把衣服叠得比平常更整齐。
        - id: ch03-b46
          speaker: phyllis
          text: 你以前总嫌生活太无聊，什么事也不发生，一点不像书里的故事。现在真的有事情发生了。
        - id: ch03-b47
          speaker: roberta
          text: 我从来没想过，要发生一件让妈妈难受的事。现在什么都糟透了。
          emotion: sad
        - id: ch03-b48
          speaker: narrator
          text: 接下来的好几个星期，所有事情都一直这样糟透了。
    - id: ch04
      title: 搬离红砖别墅
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 妈妈几乎天天出门。饭菜做得不好，吃饭的地方也收拾得不干净。家里辞掉了帮佣女仆，艾玛姨妈又来住下。她比妈妈大许多，正准备去国外做家庭教师。她整天忙着收拾衣服，那些灰扑扑的难看衣裳摊得到处都是。缝纫机从早到晚响个不停，有时大半夜还在响。
        - id: ch04-b02
          speaker: narrator
          text: 艾玛姨妈认定，孩子们必须待在他们该待的位置。孩子们也有自己的看法，而且加倍还给了她。他们认为，姨妈该待的位置，就是任何没有他们的地方。因此，双方很少碰面。孩子们宁愿跟佣人待在一起，佣人有趣多了。厨娘心情好时会唱滑稽歌。女仆只要没在生你的气，就能学母鸡刚下完蛋的叫声，学香槟开瓶，还能学两只猫打架时怎样喵呜乱叫。
        - id: ch04-b03
          speaker: narrator
          text: 佣人从来不肯说明，那两位先生到底给爸爸带来了什么坏消息。可她们老是暗示，只要愿意，她们什么都能讲。这种话听了实在不舒服。
        - id: ch04-b04
          speaker: narrator
          text: 有一天，彼得在浴室门上设了个恶作剧机关。露丝正好从门下经过，机关发挥得漂亮极了。红头发的露丝一把抓住彼得，狠狠扇了他的耳光。
        - id: ch04-b05
          speaker: ruth
          text: 你早晚要落到坏下场，你这个讨厌的小坏蛋！再不学好，你就得去你那宝贝爸爸去的地方。我今天索性把话说明白！
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 罗伯塔把这番话告诉了妈妈。第二天，露丝就被辞退了。
        - id: ch04-b07
          speaker: narrator
          text: 后来，妈妈有一天回家便倒在床上，一连两天没起来。医生也上门来了。孩子们难过地踮着脚在屋里走，猜想着这个世界是不是快要完了。
        - id: ch04-b08
          speaker: narrator
          text: 一天早晨，妈妈终于下楼吃饭。她脸色苍白，脸上多了几道从前没有的纹路。不过，她还是尽力朝孩子们笑了笑。
        - id: ch04-b09
          speaker: mother
          text: 好了，我的小宝贝们，事情全都安排好了。我们要搬出这所房子，到乡下去住。新家是一幢特别可爱的小白屋，你们一定会喜欢它。
        - id: ch04-b10
          speaker: narrator
          text: 接下来整整一星期，大家忙得团团转。这里说的打包，可不是去海边度假时把衣服放进行李箱。他们连桌椅都要装起来，桌面包上粗麻布，桌腿缠上稻草。陶器、毛毯、烛台、地毯、床架和平底锅，还有壁炉围栏和拨火用具，这些去海边绝不会带的东西，全都装进了箱子。
        - id: ch04-b11
          speaker: narrator
          text: 房子变得像个家具仓库。孩子们大概很享受这份热闹。妈妈虽然忙，却不像前些日子那样忙得顾不上他们。她仍会跟他们说话，给他们念书。菲莉丝拿着螺丝刀摔倒，扎伤了手，妈妈甚至还编了几句诗让她开心。
        - id: ch04-b12
          speaker: roberta
          text: 妈妈，这个漂亮柜子不装走吗？
        - id: ch04-b13
          speaker: narrator
          text: 她指的是一只嵌着红玳瑁和黄铜的精美柜子。
        - id: ch04-b14
          speaker: mother
          text: 我们没法把每样东西都带上。
        - id: ch04-b15
          speaker: roberta
          text: 可我们带走的，好像偏偏全是难看的东西。
        - id: ch04-b16
          speaker: mother
          text: 因为那些都很有用。咱们要玩上一阵子“穷人游戏”了，我的小乖乖。
        - id: ch04-b17
          speaker: narrator
          text: 难看却有用的东西全都装好了。系着绿色呢围裙的工人把它们搬上货车，运了出去。那一夜，两个女孩和妈妈、艾玛姨妈睡在两间备用卧室里，那里的家具仍然很漂亮。她们自己的床已经运走，彼得只好睡在客厅沙发上临时铺成的床铺里。
        - id: ch04-b18
          speaker: peter
          text: 这可太好玩了！我真喜欢搬家。要是我们每个月都搬一次就好了。
          emotion: happy
        - id: ch04-b19
          speaker: narrator
          text: 妈妈替他掖好被子，忍不住笑了。
        - id: ch04-b20
          speaker: mother
          text: 我可一点也不想。晚安，小彼得。
        - id: ch04-b21
          speaker: narrator
          text: 妈妈转过身时，罗伯塔看见了她脸上的神情。那一眼，她一辈子都没有忘记。后来上床时，罗伯塔只在心里悄悄对妈妈说话。
        - id: ch04-b22
          speaker: roberta
          text: 妈妈，你真勇敢，我真爱你。心里明明已经难受成那样，你竟然还能笑出来。
          emotion: sad
        - id: ch04-b23
          speaker: narrator
          text: 第二天，他们装满一只箱子，又装满一只箱子，后面还有更多箱子。直到很晚的下午，一辆出租马车才来接他们去车站。
        - id: ch04-b24
          speaker: narrator
          text: 艾玛姨妈到车站送行。可孩子们觉得，倒像是他们送走了姨妈，而且都很庆幸。
        - id: ch04-b25
          speaker: phyllis
          text: 不过，那些外国孩子真可怜，艾玛姨妈要去管教他们呢。无论如何，我都不愿意变成他们。
          emotion: sad
    - id: ch05
      title: 黑暗里的新家
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 刚上火车时，孩子们还高高兴兴地看着窗外。天色越来越暗，他们也越来越困。后来，妈妈轻轻摇着他们，大家才迷迷糊糊地醒来。谁也不知道火车已经走了多久。
        - id: ch05-b02
          speaker: mother
          text: 醒醒，宝贝们。我们到啦。
        - id: ch05-b03
          speaker: narrator
          text: 他们醒来后，觉得又冷又难过。站台上穿堂风直往身上钻，三个孩子哆哆嗦嗦地等人卸下行李。接着，机车呼哧呼哧地再次开动，拖着列车离开。他们一直看着守车后面的尾灯，直到那一点光消失在黑夜里。
        - id: ch05-b04
          speaker: narrator
          text: 这是孩子们在那条铁路上见到的第一列火车。后来，他们会那么爱这条铁路，铁路也很快会成为新生活的中心，还会给他们带来许多奇迹和变化。可站在月台上的孩子们什么也不知道。他们只顾发抖、打喷嚏，盼望去新家的路别太长。彼得从没觉得鼻子这么冷。罗伯塔的帽子歪到一边，帽带似乎比平常勒得更紧。菲莉丝的鞋带也散开了。
        - id: ch05-b05
          speaker: mother
          text: 走吧，我们得步行过去。这里没有出租马车。
        - id: ch05-b06
          speaker: narrator
          text: 路上黑漆漆的，满是泥。路面很不平，孩子们不时被绊一下。菲莉丝有一回心不在焉，一脚跌进水洼，被拉起来后衣服湿了，心情也糟了。这里没有煤气路灯，路还一直向上。货车走得跟人一样慢，他们就跟着车轮碾过沙石的嘎吱声往前走。等眼睛习惯了黑暗，才隐约看见前面堆得高高的箱子轻轻摇晃。
        - id: ch05-b07
          speaker: narrator
          text: 前面有一扇很大的门。他们打开门，让货车通过。门后的道路好像穿过田野，而且开始往下走。不久，右手边冒出一大团黑沉沉的笨重影子。
        - id: ch05-b08
          speaker: mother
          text: 那就是房子。真奇怪，她怎么把百叶窗全关上了。
        - id: ch05-b09
          speaker: roberta
          text: 你说的“她”是谁？
        - id: ch05-b10
          speaker: mother
          text: 我雇来收拾新家的人。她应该打扫房子，放好家具，再准备晚饭。
        - id: ch05-b11
          speaker: narrator
          text: 前方出现一道矮墙，墙里面长着树。
        - id: ch05-b12
          speaker: mother
          text: 那里就是花园。
        - id: ch05-b13
          speaker: peter
          text: 我看，它更像一只滴油盘，里面装满了黑卷心菜。
        - id: ch05-b14
          speaker: narrator
          text: 货车贴着花园的围墙继续走，绕到房子后面。车轮哐啷啷地压进铺着卵石的院子，最后停在后门。所有窗户都是黑的，一盏灯也没有。大家使劲敲门，可里面始终没人答应。
        - id: ch05-b15
          speaker: narrator
          text: 赶车人说，瓦伊尼太太可能已经回自己家去了。
        - id: ch05-b16
          speaker: cart_driver
          text: 你们那班火车晚点了那么久，她当然等不下去。
        - id: ch05-b17
          speaker: mother
          text: 可钥匙还在她手里。现在我们该怎么办呢？
        - id: ch05-b18
          speaker: cart_driver
          text: 她肯定把钥匙压在门阶底下了。这一带的人都这么做。
        - id: ch05-b19
          speaker: narrator
          text: 赶车人从车上取下提灯，弯腰往门阶下面摸。
        - id: ch05-b20
          speaker: cart_driver
          text: 嗨，果然在这儿，没错。
        - id: ch05-b21
          speaker: narrator
          text: 他开了门，把提灯放到屋里的桌上。
        - id: ch05-b22
          speaker: cart_driver
          text: 你们有蜡烛吗？
        - id: ch05-b23
          speaker: mother
          text: 我连东西都放在哪里也不知道。
        - id: ch05-b24
          speaker: narrator
          text: 这句话说得不如她平时那样快活。赶车人划亮一根火柴，发现桌上正好有支蜡烛，就把它点着了。微弱细小的烛光照出一间空荡荡的大厨房，脚下是石板地。窗上没有窗帘，壁炉前也没有地毯。从旧家运来的厨房桌孤零零地摆在中间。椅子堆在一个角落，壶、锅、扫帚和餐具堆在另一个角落。炉子里没有火，黑色的炉膛里只有冷冰冰的死灰。
        - id: ch05-b25
          speaker: narrator
          text: 赶车人把箱子都搬进来，正要离开，大家忽然听见一阵窸窣声和奔跑声，好像就藏在房子的墙壁里面。
        - id: ch05-b26
          speakers: [roberta, phyllis]
          ensemble: duo
          text: 啊，那是什么声音？
          emotion: fearful
        - id: ch05-b27
          speaker: cart_driver
          text: 没什么，不过是耗子。
        - id: ch05-b28
          speaker: narrator
          text: 他出去关上房门。门板带起的风一下吹灭了蜡烛。屋里顿时一片漆黑，菲莉丝又碰倒了一把椅子。
        - id: ch05-b29
          speaker: phyllis
          text: 哎呀，我真希望我们没有搬来这里！
          emotion: fearful
        - id: ch05-b30
          speaker: peter
          text: 他说什么？“不过是耗子”！
          emotion: surprised
