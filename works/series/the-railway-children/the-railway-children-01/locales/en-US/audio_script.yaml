  chapters:
    - id: ch01
      title: Before They Were Railway Children
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            They weren't railway children at first. In fact, they had probably never thought about railways at all, except as a way to reach Maskelyne and Cook's, the pantomime, the zoo, or Madame Tussaud's. They were ordinary children from the suburbs, living with Father and Mother in an ordinary red-brick villa. Its front door had colored glass. The tiled passage inside was called the hall. There was hot and cold water in the bathroom, along with electric bells, French windows, plenty of white paint, and what house agents liked to call every modern convenience.
        - id: ch01-b02
          speaker: narrator
          text: >-
            There were three children. Roberta was the oldest. Mothers never have favorites, of course, but if this mother had had one, it might have been Roberta. Peter came next, and he planned to be an engineer when he grew up. Phyllis was the youngest, and she always meant extremely well.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Mother didn't spend her days making dull visits to dull ladies, or sitting at home while dull ladies visited her. She was nearly always there to play with the children, read to them, and help with their lessons. While they were at school, she wrote stories for them. After tea, she read those stories aloud. She also made up funny poems for birthdays and other grand occasions, like the christening of new kittens, the dollhouse getting new furniture, or the children recovering from the mumps.
        - id: ch01-b04
          speaker: narrator
          text: >-
            These three lucky children always had everything they needed. They had pretty clothes and good fires. Their lovely nursery was heaped with toys and covered in Mother Goose wallpaper. They had a kind, cheerful nursemaid. They had a dog named James who belonged entirely to them. And they had a Father who seemed perfect. He was never cross or unfair, and he was always ready for a game. If there ever came a time when he couldn't play, he had a very good reason. He explained it so interestingly and amusingly that the children felt certain he truly couldn't help it.
        - id: ch01-b05
          speaker: narrator
          text: >-
            You might think they should have been happy, and they were. They just didn't know how happy they were until their pretty life in the Red Villa was over. Then they had to live a very different life indeed.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The dreadful change came all at once.
    - id: ch02
      title: Peter's Engine
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            It began around Peter's tenth birthday. Of all his presents, the finest was a model engine, more perfect than you could imagine. The other gifts were charming, but none was as wonderful as the Engine.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Its perfection lasted exactly three days. Then, perhaps because Peter was inexperienced, or because Phyllis's good intentions had become rather forceful, or because of something else entirely, the Engine suddenly went off with a bang. James was so frightened that he ran away and didn't return all day. Every little person from the Noah's Ark who had been riding in the tender was smashed to bits. Nothing else was hurt except the poor Engine and Peter's feelings.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The others said Peter cried over it. But ten-year-old boys do not cry, no matter what terrible tragedy darkens their lives. Peter said his eyes were red because he had a cold. The next day, that turned out to be true, though he hadn't known it when he said it. He had to stay in bed, and Mother began to fear he might be coming down with measles. Then he suddenly sat up.
        - id: ch02-b04
          speaker: peter
          text: >-
            I can't stand gruel, barley water, or bread and milk. I want to get up and eat something real!
          emotion: angry
        - id: ch02-b05
          speaker: mother
          text: >-
            What would you like?
        - id: ch02-b06
          speaker: peter
          text: >-
            Pigeon pie. A big one. A very big one!
        - id: ch02-b07
          speaker: narrator
          text: >-
            Mother asked Cook to make a large pigeon pie. Cook made it, cooked it, and Peter ate some. After that, his cold improved. While the pie was being made, Mother amused him with a poem. First it told of poor, worthy Peter. Then it went like this.
        - id: ch02-b08
          speaker: mother
          text: |-
            He had an engine that he loved
            With all his heart and soul,
            And if he had a wish on earth
            It was to keep it whole.

            One day, my friends, prepare your minds.
            I'm coming to the worst.
            Quite suddenly a screw went mad,
            And then the boiler burst!

            With gloomy face he picked it up
            And took it to his Mother,
            Though even he could not suppose
            That she could make another.

            For those who perished on the line
            He did not seem to care.
            His engine mattered more to him
            Than all the people there.

            And now you see the reason why
            Our Peter has been ill.
            He soothes his soul with pigeon pie,
            His gnawing grief to kill.

            He wraps himself in blankets warm
            And sleeps in bed till late,
            Determined thus to overcome
            His miserable fate.

            And if his eyes are rather red,
            His cold must just excuse it.
            Offer him pie. You may be sure
            He never will refuse it.
    - id: ch03
      title: The Visitors
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Father had been away in the country for three or four days. Peter placed all his hopes for the Engine in Father's wonderfully clever hands. Father could mend almost anything. He had often served as veterinary surgeon to the wooden rocking horse. Once, all human help seemed useless. The poor creature had been given up for lost, and even the carpenter couldn't see a way to repair it. But Father saved its life. He had repaired the doll's cradle when no one else could, too. With glue, scraps of wood, and a penknife, he had made every Noah's Ark animal stand as firmly as ever, perhaps even more firmly.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Peter was heroically unselfish and said nothing about the Engine until Father had eaten dinner and finished his cigar. Waiting had been Mother's idea, but Peter was the one who had to do it, and it took a great deal of patience.
        - id: ch03-b03
          speaker: mother
          text: >-
            Now, dear, if you're rested and comfortable, we have a terrible railway accident to tell you about. Then we'd like your advice.
        - id: ch03-b04
          speaker: father
          text: >-
            All right. Let's hear it!
        - id: ch03-b05
          speaker: narrator
          text: >-
            Peter told the whole sad story. Then he went to fetch what remained of the Engine and placed it in Father's hands. Father turned the damaged little machine over, studied every part of it, and examined it with great care before saying a word.
        - id: ch03-b06
          speaker: father
          text: >-
            Hmm.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The children held their breath.
        - id: ch03-b08
          speaker: peter
          text: >-
            Is there really no hope?
          emotion: sad
        - id: ch03-b09
          speaker: father
          text: >-
            No hope? There's plenty! But hope won't mend it by itself. It needs some brazing or solder, and a new valve. Let's save the job for a rainy day. I'll spend Saturday afternoon on it, and all of you can help.
          emotion: happy
        - id: ch03-b10
          speaker: peter
          text: >-
            Can girls really help fix an engine?
        - id: ch03-b11
          speaker: father
          text: >-
            Certainly. Girls are every bit as clever as boys, so remember that. Phil, would you like to drive an engine?
        - id: ch03-b12
          speaker: phyllis
          text: >-
            My face would always get dirty, wouldn't it? And I'd probably break something.
        - id: ch03-b13
          speaker: roberta
          text: >-
            Oh, I'd love it! Daddy, could I do that when I grow up? Could I even be a stoker?
          emotion: happy
        - id: ch03-b14
          speaker: father
          text: >-
            You mean a fireman. Well, if you still want it when you're grown, we'll see about making you a firewoman. You know, when I was a boy—
        - id: ch03-b15
          speaker: narrator
          text: >-
            Father had kept pulling and twisting at the Engine while they talked. But just as he began the story of his boyhood, a knock came at the front door.
        - id: ch03-b16
          speaker: father
          text: >-
            Who in the world can that be? They say an Englishman's home is his castle. I only wish they built these villas with moats and drawbridges.
        - id: ch03-b17
          speaker: narrator
          text: >-
            Ruth, the red-haired parlor maid, came in. Two gentlemen wanted to see Father.
        - id: ch03-b18
          speaker: ruth
          text: >-
            I put them in the library, sir.
        - id: ch03-b19
          speaker: mother
          text: >-
            It's probably someone collecting for the vicar's gift, or the choir holiday. Send them away quickly, dear. Visitors break up the whole evening, and it's nearly the children's bedtime.
        - id: ch03-b20
          speaker: narrator
          text: >-
            But Father couldn't send the gentlemen away quickly at all.
        - id: ch03-b21
          speaker: roberta
          text: >-
            I wish we had a moat and drawbridge. When we didn't want visitors, we could pull the bridge up and keep them out. If those men stay much longer, Father will forget the story about when he was a boy.
        - id: ch03-b22
          speaker: narrator
          text: >-
            Mother tried to pass the time by telling them a new fairy tale about a princess with green eyes. But it was hard for her to tell, and hard for the children to follow. Voices traveled out from the library. Father's was louder than usual, and it sounded entirely different from the voice he used with people collecting money for gifts and holidays. At last, the library bell rang, and everyone let out a breath of relief.
        - id: ch03-b23
          speaker: phyllis
          text: >-
            They're leaving now. Father rang for Ruth to show them out.
        - id: ch03-b24
          speaker: narrator
          text: >-
            Instead, Ruth came in alone. The children thought she looked strange.
        - id: ch03-b25
          speaker: ruth
          text: >-
            Please, ma'am, the master wants you in the study. He looks like death. I think he's had awful news. You'd best expect the worst. Maybe someone in the family died, or a bank failed, or—
        - id: ch03-b26
          speaker: mother
          text: >-
            That's enough, Ruth. You may go.
          emotion: calm
        - id: ch03-b27
          speaker: narrator
          text: >-
            Mother went into the library. More voices followed. The bell rang again, and Ruth fetched a cab. The children heard boots cross the hall and go down the steps. The cab rolled away. The front door closed. Then Mother returned. Her face was as white as her lace collar. Her eyes looked large and bright, and her pale lips were pressed into a thin, unfamiliar line.
        - id: ch03-b28
          speaker: mother
          text: >-
            It's bedtime. Ruth will help you.
        - id: ch03-b29
          speaker: phyllis
          text: >-
            But you said we could stay up late because Father's home.
        - id: ch03-b30
          speaker: mother
          text: >-
            Father has been called away on business. Come, darlings. Go now.
        - id: ch03-b31
          speaker: narrator
          text: >-
            They kissed her and left. Roberta stayed behind for one more hug and whispered to her.
        - id: ch03-b32
          speaker: roberta
          text: >-
            It wasn't bad news, was it, Mammy? Has somebody died, or—
        - id: ch03-b33
          speaker: mother
          text: >-
            No one has died. No. I can't tell you anything tonight, my pet. Please go, dear. Go now.
        - id: ch03-b34
          speaker: narrator
          text: >-
            Mother almost seemed to push Roberta away, so Roberta went. Ruth brushed the girls' hair and helped them undress, though Mother usually did that. After Ruth lowered the gas and left them, she found Peter waiting on the stairs, still dressed.
        - id: ch03-b35
          speaker: peter
          text: >-
            Ruth, what's going on?
        - id: ch03-b36
          speaker: ruth
          text: >-
            Ask me no questions, and I won't tell you lies. You'll find out soon enough.
        - id: ch03-b37
          speaker: narrator
          text: >-
            Late that night, Mother came upstairs and kissed all three children while they slept. Only Roberta woke. She lay as still as a mouse and said nothing. In the darkness, she heard Mother catch her breath.
        - id: ch03-b38
          speaker: roberta
          text: >-
            If Mother doesn't want us to know she's been crying, then we won't know. That's all.
    - id: ch04
      title: The Weeks of Not Knowing
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Mother had already gone out when the children came down to breakfast the next morning.
        - id: ch04-b02
          speaker: ruth
          text: >-
            She's gone to London.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Ruth left them alone with their breakfast. Peter broke open his egg.
        - id: ch04-b04
          speaker: peter
          text: >-
            Something terrible is happening. Last night, Ruth told me we'd find out soon enough.
        - id: ch04-b05
          speaker: roberta
          text: >-
            You asked her?
        - id: ch04-b06
          speaker: narrator
          text: >-
            Roberta's voice was scornful.
        - id: ch04-b07
          speaker: peter
          text: >-
            Yes, I did! Maybe you could go to bed without caring that Mother was worried, but I couldn't. So there!
          emotion: angry
        - id: ch04-b08
          speaker: roberta
          text: >-
            We shouldn't question the servants about things Mother chooses not to tell us.
        - id: ch04-b09
          speaker: peter
          text: >-
            Very good, Miss Goody-goody. Keep preaching.
        - id: ch04-b10
          speaker: phyllis
          text: >-
            I'm not especially good, but I think Bobbie is right this time.
        - id: ch04-b11
          speaker: peter
          text: >-
            Naturally. Bobbie always thinks she's right.
        - id: ch04-b12
          speaker: roberta
          text: >-
            Oh, stop! Please don't be hateful to each other. Something dreadful must be happening. We mustn't make it any worse.
          emotion: sad
        - id: ch04-b13
          speaker: peter
          text: >-
            And who started it, I'd like to know?
        - id: ch04-b14
          speaker: narrator
          text: >-
            Roberta made herself answer.
        - id: ch04-b15
          speaker: roberta
          text: >-
            I suppose I did, but—
        - id: ch04-b16
          speaker: peter
          text: >-
            There you are, then.
        - id: ch04-b17
          speaker: narrator
          text: >-
            Still, before Peter went to school, he gave his sister an encouraging thump between the shoulders and told her to cheer up. The children returned for their one o'clock dinner, but Mother wasn't there. She was still away at teatime.
        - id: ch04-b18
          speaker: narrator
          text: >-
            It was nearly seven when she came home. She looked so tired and ill that none of them dared ask a question. She dropped into an armchair. Phyllis pulled the long pins from her hat, Roberta removed her gloves, and Peter unlaced her walking shoes and brought her soft velvet slippers. Mother drank a cup of tea. Roberta put eau de Cologne on her aching head. Then Mother spoke.
        - id: ch04-b19
          speaker: mother
          text: >-
            My darlings, I need to tell you something. Those men brought very bad news last night, and Father will be away for a while. I'm terribly worried. I need all of you to help me and not make things harder.
        - id: ch04-b20
          speaker: roberta
          text: >-
            We would never make it harder!
        - id: ch04-b21
          speaker: narrator
          text: >-
            Roberta held Mother's hand against her cheek.
        - id: ch04-b22
          speaker: mother
          text: >-
            You can help a great deal. Be good and cheerful, and don't quarrel while I'm away, because I'll have to be gone quite often.
        - id: ch04-b23
          speaker: narrator
          text: >-
            Roberta and Peter exchanged guilty looks.
        - id: ch04-b24
          speakers: [roberta, peter, phyllis]
          ensemble: chorus
          text: >-
            We won't quarrel. We truly won't.
        - id: ch04-b25
          speaker: narrator
          text: >-
            And all three meant it.
        - id: ch04-b26
          speaker: mother
          text: >-
            There's one more thing. Don't ask me questions about this trouble, and don't ask anyone else either.
        - id: ch04-b27
          speaker: narrator
          text: >-
            Peter drew himself in and scraped his boots against the carpet.
        - id: ch04-b28
          speaker: mother
          text: >-
            You'll promise that too, won't you?
        - id: ch04-b29
          speaker: peter
          text: >-
            I asked Ruth. I'm very sorry, but I did ask her.
        - id: ch04-b30
          speaker: mother
          text: >-
            What did she tell you?
        - id: ch04-b31
          speaker: peter
          text: >-
            She said we'd find out soon enough.
        - id: ch04-b32
          speaker: mother
          text: >-
            You don't need to know about it. It's a business matter, and you never understand business, do you?
        - id: ch04-b33
          speaker: roberta
          text: >-
            No. Does it have something to do with the government?
        - id: ch04-b34
          speaker: narrator
          text: >-
            Father worked in a government office.
        - id: ch04-b35
          speaker: mother
          text: >-
            Yes. Now it's bedtime, darlings. And you mustn't worry. Everything will turn out right in the end.
          emotion: calm
        - id: ch04-b36
          speaker: phyllis
          text: >-
            Then you mustn't worry either, Mother. We'll all be as good as gold.
        - id: ch04-b37
          speaker: narrator
          text: >-
            Mother sighed and kissed them.
        - id: ch04-b38
          speaker: peter
          text: >-
            We'll start being good first thing tomorrow morning.
        - id: ch04-b39
          speaker: roberta
          text: >-
            Why can't we start now?
        - id: ch04-b40
          speaker: peter
          text: >-
            There's nothing to be good about now, silly.
        - id: ch04-b41
          speaker: phyllis
          text: >-
            We could start trying to feel good. And we could stop calling names.
        - id: ch04-b42
          speaker: peter
          text: >-
            Who's calling names? Bobbie knows that when I say “silly,” it's exactly the same as saying “Bobbie.”
        - id: ch04-b43
          speaker: roberta
          text: >-
            Well!
        - id: ch04-b44
          speaker: peter
          text: >-
            No, not the way you mean. It's just a—what does Father call it?—a germ of endearment! Good night.
        - id: ch04-b45
          speaker: narrator
          text: >-
            The girls folded their clothes more neatly than usual. It was the only way they could think of to begin being good.
        - id: ch04-b46
          speaker: phyllis
          text: >-
            You used to complain that life was dull because nothing happened like it does in books. Well, something has happened now.
        - id: ch04-b47
          speaker: narrator
          text: >-
            She carefully smoothed her pinafore.
        - id: ch04-b48
          speaker: roberta
          text: >-
            I never wanted anything to happen that would make Mother unhappy. Everything is completely horrid.
          emotion: sad
        - id: ch04-b49
          speaker: narrator
          text: >-
            Everything stayed completely horrid for several weeks. Mother was almost always out. Meals became dull and dirty. The between-maid was dismissed, and Aunt Emma came to stay. She was much older than Mother and was preparing to go abroad as a governess. Getting her clothes ready kept her very busy. They were ugly, dingy clothes, and she left them spread all over the place. The sewing machine seemed to whir without stopping, all day and through most of the night.
        - id: ch04-b50
          speaker: narrator
          text: >-
            Aunt Emma believed children should keep to their proper place. The children returned that belief with interest. As far as they were concerned, Aunt Emma's proper place was anywhere they were not, so they saw very little of her. They preferred the servants, who were much more entertaining. When Cook was in a good mood, she could sing comic songs. When the housemaid happened not to be offended with them, she could imitate a hen announcing that it had laid an egg, a champagne bottle popping open, and two cats yowling in a fight.
        - id: ch04-b51
          speaker: narrator
          text: >-
            The servants never revealed the bad news the gentlemen had brought. But they kept hinting that they could say a great deal if they wanted to, and that made the children uneasy.
        - id: ch04-b52
          speaker: narrator
          text: >-
            One day, Peter set a booby trap above the bathroom door. It worked beautifully when Ruth walked through. The red-haired maid caught him and boxed his ears.
        - id: ch04-b53
          speaker: ruth
          text: >-
            You'll come to a bad end, you nasty little wretch! If you don't change your ways, you'll go where your precious Father went. I'm telling you straight!
          emotion: angry
        - id: ch04-b54
          speaker: narrator
          text: >-
            Roberta repeated Ruth's words to Mother. Ruth was sent away the next day.
        - id: ch04-b55
          speaker: narrator
          text: >-
            Then Mother came home, went to bed, and stayed there for two days. The doctor visited. The children crept miserably around the house, wondering whether the whole world was coming to an end.
    - id: ch05
      title: Leaving the Red Villa
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            One morning, Mother came down to breakfast. She was very pale, and new lines showed on her face. She smiled as well as she could.
        - id: ch05-b02
          speaker: mother
          text: >-
            Now, my pets, everything is settled. We're leaving this house and moving to the country. We'll live in the dearest little white house. I know you'll love it.
        - id: ch05-b03
          speaker: narrator
          text: >-
            A wild, whirling week of packing followed. This wasn't like packing a few clothes for a trip to the seaside. They packed chairs and tables, covering the tops with sacking and winding straw around the legs. All kinds of things went into boxes that no one would ever pack for the seaside: dishes, blankets, candlesticks, rugs, bedsteads, saucepans, and even the fenders and fire irons from the fireplaces.
        - id: ch05-b04
          speaker: narrator
          text: >-
            The house looked like a furniture warehouse, and the children rather enjoyed it. Mother was busy, but now she could still talk and read with them. When Phyllis fell while carrying a screwdriver and drove it into her hand, Mother even made a little poem to cheer her.
        - id: ch05-b05
          speaker: roberta
          text: >-
            Mother, aren't we taking this?
        - id: ch05-b06
          speaker: narrator
          text: >-
            Roberta pointed to a beautiful cabinet inlaid with red tortoiseshell and brass.
        - id: ch05-b07
          speaker: mother
          text: >-
            We can't bring everything.
        - id: ch05-b08
          speaker: roberta
          text: >-
            But all the things we are bringing seem ugly.
        - id: ch05-b09
          speaker: mother
          text: >-
            We're taking the useful things. We have to pretend to be poor for a little while, chickabiddy.
        - id: ch05-b10
          speaker: narrator
          text: >-
            Men in green baize aprons loaded all the ugly, useful things into a van and carried them away. That night, Mother, Aunt Emma, and the girls slept in the two spare rooms, where the pretty furniture remained. Their own beds were gone, so Peter was given the drawing-room sofa.
        - id: ch05-b11
          speaker: peter
          text: >-
            This is great fun!
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: >-
            He wriggled joyfully as Mother tucked him in.
        - id: ch05-b13
          speaker: peter
          text: >-
            I love moving. I wish we could move every month.
          emotion: happy
        - id: ch05-b14
          speaker: narrator
          text: >-
            Mother laughed.
        - id: ch05-b15
          speaker: mother
          text: >-
            I certainly don't! Good night, Peterkin.
        - id: ch05-b16
          speaker: narrator
          text: >-
            Mother turned away, and Roberta saw her face. She never forgot how it looked.
        - id: ch05-b17
          speaker: roberta
          text: >-
            Oh, Mother, you're so brave. I love you so much. How can you laugh when you feel like that?
          emotion: sad
        - id: ch05-b18
          speaker: narrator
          text: >-
            Roberta only whispered the words to herself as she climbed into bed.
        - id: ch05-b19
          speaker: narrator
          text: >-
            The next day brought boxes, then more boxes, and still more boxes. Late that afternoon, a cab arrived to take them to the station. Aunt Emma came to see them off. The children felt as though they were seeing her off instead, and they were glad.
        - id: ch05-b20
          speaker: phyllis
          text: >-
            Oh, those poor foreign children she's going to teach! I wouldn't trade places with them for anything.
    - id: ch06
      title: The Dark New House
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            At first, the children enjoyed watching through the train window. As evening darkened, they grew sleepier and sleepier. None of them knew how long they had traveled when Mother gently shook them awake.
        - id: ch06-b02
          speaker: mother
          text: >-
            Wake up, dears. We're here.
        - id: ch06-b03
          speaker: narrator
          text: >-
            They woke cold and miserable. Shivering on the drafty platform, they watched while every piece of luggage was taken off the train. Then the engine began puffing and blowing again. It pulled the train away, and the children stood watching until the red tail lights on the guard's van disappeared into the darkness.
        - id: ch06-b04
          speaker: narrator
          text: >-
            This was the first train they saw on the railway that would one day become so dear to them. They had no idea how much they would love it, how soon it would sit at the center of their new life, or how many wonders and changes it would bring. Just then, they could only shiver, sneeze, and hope the walk wasn't far. Peter's nose felt colder than it had ever felt before. Roberta's hat sat crooked, with its elastic unusually tight. Phyllis's shoelaces had come undone.
        - id: ch06-b05
          speaker: mother
          text: >-
            Come along. We have to walk. There are no cabs here.
        - id: ch06-b06
          speaker: narrator
          text: >-
            The road was dark and muddy. It climbed uphill, and the children stumbled now and then over its rough surface. There were no gas lamps at all. The cart could only move at walking pace, so they followed the gritty crunch of its wheels. Once, Phyllis absentmindedly stepped straight into a puddle. Someone pulled her out again, damp and unhappy. As their eyes slowly adjusted to the darkness, they began to make out the great mound of boxes swaying dimly ahead.
        - id: ch06-b07
          speaker: narrator
          text: >-
            Someone opened a long gate for the cart. Beyond it, the road seemed to cross open fields, and at last it began to slope downward. Soon a large, dark, lumpy shape appeared on their right.
        - id: ch06-b08
          speaker: mother
          text: >-
            There's the house. I wonder why she closed all the shutters.
        - id: ch06-b09
          speaker: roberta
          text: >-
            Who do you mean by “she”?
        - id: ch06-b10
          speaker: mother
          text: >-
            The woman I hired to clean the house, arrange the furniture, and prepare supper.
        - id: ch06-b11
          speaker: narrator
          text: >-
            They passed a low wall with trees behind it.
        - id: ch06-b12
          speaker: mother
          text: >-
            That's the garden.
        - id: ch06-b13
          speaker: peter
          text: >-
            It looks more like a dripping pan full of black cabbages.
        - id: ch06-b14
          speaker: narrator
          text: >-
            The cart followed the garden wall, went around the house, and clattered into a cobblestone yard. It stopped at the back door. Every window was dark. They all hammered on the door, but nobody answered. The cart man thought Mrs. Viney must have gone home.
        - id: ch06-b15
          speaker: cart_man
          text: >-
            Your train was very late, you see.
        - id: ch06-b16
          speaker: mother
          text: >-
            But she has the key. What can we do?
        - id: ch06-b17
          speaker: cart_man
          text: >-
            She'll have put it under the doorstep. That's what people do around here.
        - id: ch06-b18
          speaker: narrator
          text: >-
            He took the lantern from his cart and bent down to look.
        - id: ch06-b19
          speaker: cart_man
          text: >-
            Yes, here it is, just as I thought.
        - id: ch06-b20
          speaker: narrator
          text: >-
            He unlocked the door, carried his lantern inside, and set it on the table.
        - id: ch06-b21
          speaker: cart_man
          text: >-
            Have you got a candle?
        - id: ch06-b22
          speaker: mother
          text: >-
            I don't know where anything is.
        - id: ch06-b23
          speaker: narrator
          text: >-
            Mother sounded less cheerful than usual. The cart man struck a match, found a candle on the table, and lit it. Its thin flame showed the children a large, bare kitchen with a stone floor. There were no curtains and no rug by the hearth. Their old kitchen table stood in the middle. The chairs were piled in one corner, while pots, pans, brooms, and dishes filled another. No fire burned. Only cold, dead ashes lay in the black grate.
        - id: ch06-b24
          speaker: narrator
          text: >-
            After carrying in the boxes, the cart man turned to leave. A rustling, scampering sound came from somewhere inside the walls.
        - id: ch06-b25
          speakers: [roberta, phyllis]
          ensemble: duo
          text: >-
            Oh! What's that?
          emotion: fearful
        - id: ch06-b26
          speaker: cart_man
          text: >-
            Only the rats.
        - id: ch06-b27
          speaker: narrator
          text: >-
            He went out and shut the door. The sudden draft blew out the candle. Phyllis knocked over a chair in the dark.
        - id: ch06-b28
          speaker: phyllis
          text: >-
            Oh dear. I wish we'd never come!
          emotion: fearful
        - id: ch06-b29
          speaker: peter
          text: >-
            Only the rats!
          emotion: fearful
