        - id: ch01-b142
          speaker: roberta
          text: Oh, that's very interesting.
        - id: ch01-b143
          speaker: narrator
          text: Bobbie carefully stored the fact away to tell Peter and Phyllis.
        - id: ch01-b144
          speaker: bill
          text: And this is the automatic brake. Move this little handle with one finger, and the whole train stops very quickly. That's what newspapers call the Power of Science.
        - id: ch01-b145
          speaker: narrator
          text: Bill showed her two small dials that looked like clock faces. He explained that one told them how much steam was working, while the other showed whether the brake was doing its job. Bobbie watched every movement and listened to every word. A little later, Bill let her see him shut off the steam with a large handle made of shining steel. By then, she knew more about the workings inside an engine than she had ever imagined there was to learn. Every new fact seemed precious, and she meant to remember all of them for Peter and Phyllis. Meanwhile, Jim had thought of someone who could repair Peter's toy. His second cousin's wife's brother knew how to use a soldering iron. Jim promised that the man would mend the engine, or Jim would personally want to know the reason why.
        - id: ch01-b146
          speaker: narrator
          text: Along with everything she had learned, Bobbie gained something else. She felt certain that she, Bill, and Jim had become friends for life during that one rushing journey. The two men had begun by calling her naughty and daring, but now the fear had gone out of the cab. She was also sure they had completely and forever forgiven her for climbing where she did not belong and tumbling uninvited into the sacred coal of their tender.
        - id: ch01-b147
          speaker: narrator
          text: At Stacklepoole Junction, Bobbie, Bill, and Jim parted with warm expressions of friendship on every side. The two men handed her over to the guard of a train going back toward home. He was a friend of theirs, so Bobbie traveled inside the guard's private stronghold. There she had the joy of discovering what guards actually did. She also learned the secret of the communication cord inside passenger cars. When someone pulled it, a wheel turned right under the guard's nose and a loud bell rang close to his ears.
        - id: ch01-b148
          speaker: roberta
          text: Why does your van smell so much like fish?
        - id: ch01-b149
          speaker: guard
          text: I carry plenty of fish every day. That water in the grooves of the floor drained from boxes of plaice, cod, mackerel, sole, and smelt.
        - id: ch01-b150
          speaker: narrator
          text: The returning train brought Bobbie home in time for tea. Since parting from Mother, Peter, and Phyllis, she had gathered so many adventures and so much railway knowledge that her mind felt ready to burst. A torn dress had seemed like a misfortune when it happened. Now she blessed the great nail beside the kitchen door for catching her skirt and giving her such an extraordinary afternoon.
        - id: ch01-b151
          speaker: peter
          text: Where have you been?
        - id: ch01-b152
          speaker: roberta
          text: At the station, of course.
        - id: ch01-b153
          speaker: narrator
          text: She refused to reveal another word of her adventure until the day she had chosen. At the proper hour, she mysteriously led Peter and Phyllis down to the station. The three-nineteen came through, and Bobbie proudly introduced her brother and sister to her new friends, Bill and Jim. Best of all, Jim's second cousin's wife's brother had proved worthy of the sacred trust placed in him. The broken toy had been carefully soldered. It was, quite literally, as good as new.
        - id: ch01-b154
          speaker: roberta
          text: Goodbye! Oh, goodbye! I'll always, always love you, and Jim's second cousin's wife's brother too!
          emotion: happy
        - id: ch01-b155
          speaker: narrator
          text: Just after Bobbie spoke, the great engine screamed its own goodbye and carried her new friends away. The three children turned from the station and started up the hill toward home. Peter held his repaired engine tightly against him. Every piece was back where it belonged, and the toy looked completely like its old self again. As they walked, Bobbie finally told Peter and Phyllis the entire adventure she had kept secret. Her heart gave joyful leaps as she explained how a plan to mend one small toy had carried her away on a real locomotive and turned her, for one extraordinary afternoon, into an engine burglar.
