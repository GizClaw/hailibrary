  chapters:
    - id: ch01
      title: Chapter IV. The engine-burglar.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Two weeks after the wonderful hamper arrived, the children used the rest of the second sheet and the Brunswick black to make another banner. It read, “She is nearly well, thank you.” They showed it to the Green Dragon, and the old gentleman waved back cheerfully.
        - id: ch01-b02
          speaker: narrator
          text: Once the banner had done its work, the children knew the time had come to tell Mother what they had done while she was sick. Beforehand, telling her had seemed easy enough. Now it felt very different. Still, it had to be done, and they did it. Mother was seldom angry, but this time she was angrier than they had ever seen her. That was horrible. Then, quite suddenly, she began to cry, and that was much worse. Crying can spread like measles or whooping cough. At any rate, all four of them soon found themselves attending the same crying party.
        - id: ch01-b03
          speaker: narrator
          text: Mother was the first to stop. She dried her eyes.
        - id: ch01-b04
          speaker: mother
          text: Darlings, I'm sorry I got so angry. I know you didn't understand.
          emotion: sad
        - id: ch01-b05
          speaker: roberta
          text: We weren't trying to be bad, Mammy.
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: Bobbie sobbed, while Peter and Phyllis sniffed beside her.
        - id: ch01-b07
          speaker: mother
          text: Listen to me. We are poor, but we have enough to live on. You mustn't tell everyone our private affairs. And you must never, ever ask strangers to give you things. You'll remember that, won't you?
        - id: ch01-b08
          speakers: [roberta, peter, phyllis]
          ensemble: chorus
          text: We will.
        - id: ch01-b09
          speaker: narrator
          text: They hugged Mother and pressed their wet cheeks against hers.
        - id: ch01-b10
          speaker: mother
          text: I'll write to your old gentleman. I'll tell him I didn't approve, and of course I'll thank him for being so kind. It's what you did that I don't approve of, my loves. He was as kind as anyone could be. Give my letter to the Station Master for him, and then we'll say no more about it.
        - id: ch01-b11
          speaker: narrator
          text: Later, when the children were alone, Bobbie spoke first.
        - id: ch01-b12
          speaker: roberta
          text: Isn't Mother wonderful? Try finding another grown-up who'd say sorry for being angry.
        - id: ch01-b13
          speaker: peter
          text: She is wonderful. Still, she's rather frightening when she's mad.
        - id: ch01-b14
          speaker: phyllis
          text: She's like “Avenging and Bright” in the song. I'd enjoy looking at her if it weren't so awful. She's beautiful when she's completely furious.
        - id: ch01-b15
          speaker: narrator
          text: They carried Mother's letter to the Station Master.
        - id: ch01-b16
          speaker: station_master
          text: I thought all your friends lived in London.
        - id: ch01-b17
          speaker: peter
          text: We made this friend afterward.
        - id: ch01-b18
          speaker: station_master
          text: But he doesn't live nearby?
        - id: ch01-b19
          speaker: peter
          text: No. We only know him from the railway.
        - id: ch01-b20
          speaker: narrator
          text: The Station Master withdrew into the sacred room behind the ticket window. The children went to talk with the Porter and learned that his name was Perks. He had a wife and three children. He also told them that the lamps on an engine's front were head-lights, while those at the back were tail-lights.
        - id: ch01-b21
          speaker: phyllis
          text: That proves trains are dragons in disguise. They have real heads and tails.
        - id: ch01-b22
          speaker: narrator
          text: That day, the children noticed for the first time that engines were not all alike.
        - id: ch01-b23
          speaker: porter
          text: Alike? Bless you, Miss, no more than you and me. That small one you just saw, running without a tender, is a tank engine. She's going to shunt cars beyond Maidbridge. You might say she's like you. Then there are goods engines, great strong things with three wheels on each side, all joined by rods. They're more like me. Main-line engines are like this young gentleman after he grows up and wins every race at school. They're built for speed and power. Here comes one now, pulling the nine-fifteen up.
        - id: ch01-b24
          speaker: phyllis
          text: The Green Dragon.
        - id: ch01-b25
          speaker: porter
          text: We railway men call her the Snail. She's late more often than any train on the line.
        - id: ch01-b26
          speaker: phyllis
          text: But she's green.
        - id: ch01-b27
          speaker: porter
          text: So is a snail at certain times of year, Miss.
        - id: ch01-b28
          speaker: narrator
          text: On their way home to dinner, all three agreed that Perks was delightful company.
        - id: ch01-b29
          speaker: narrator
          text: The next day was Roberta's birthday. That afternoon, the others politely but firmly ordered her to go away until tea.
        - id: ch01-b30
          speaker: phyllis
          text: You can't see what we're doing until it's finished. It's going to be a glorious surprise.
        - id: ch01-b31
          speaker: narrator
          text: Bobbie went into the garden alone. She tried to feel grateful, but she would much rather have helped than spend her birthday afternoon by herself. With time to think, she remembered something Mother had said during one of her feverish nights.
        - id: ch01-b32
          speaker: mother
          text: Oh, what a doctor's bill this will be!
        - id: ch01-b33
          speaker: narrator
          text: Bobbie walked among rosebushes that held only buds, past lilacs, syringas, and American currants. The more she thought about that bill, the less she liked it. At last, she made up her mind.
        - id: ch01-b34
          speaker: narrator
          text: She left through the garden's side door, climbed the steep field to the road beside the canal, and followed it to the bridge that led toward the village. There she settled down to wait. It was pleasant to lean both elbows on sun-warmed stone and look into the blue canal below. Bobbie had only seen one other canal, the Regent's Canal, and its water was not a pretty color at all. The Thames was the only river she knew, and that river would also have looked better if someone had washed its face.
        - id: ch01-b35
          speaker: narrator
          text: The children might have loved the canal as much as the railway, except that they had discovered the railway first, when the house, moors, rocks, and hills were all new. And everyone at the railway had treated them kindly. The people on the canal had not.
        - id: ch01-b36
          speaker: narrator
          text: The canal people were the barge workers. Some steered the slow boats up and down the water. Others walked beside old horses that trampled through the mud of the towpath and strained against long ropes. Once, Peter asked a bargee for the time. The man told him to clear out in such a fierce voice that Peter did not say he had as much right to the path as anyone. In fact, Peter did not even think of that answer until much later. On another day, the children tried to fish in the canal. A boy aboard a barge threw lumps of coal at them. One struck the back of Phyllis's neck while she bent to tie her bootlace. It hardly hurt, but she no longer cared to go on fishing.
        - id: ch01-b37
          speaker: narrator
          text: Bobbie felt safe up on the bridge. If anyone raised a lump of coal, she could duck behind the stone wall. Soon she heard wheels, exactly as she had hoped. Doctor Forrest drove up in his dogcart.
        - id: ch01-b38
          speaker: doctor_forrest
          text: Hello, head nurse! Would you like a ride?
        - id: ch01-b39
          speaker: roberta
          text: I wanted to talk to you.
        - id: ch01-b40
          speaker: doctor_forrest
          text: Your mother hasn't gotten worse, has she?
        - id: ch01-b41
          speaker: roberta
          text: No, but—
        - id: ch01-b42
          speaker: doctor_forrest
          text: Then hop in, and we'll take a drive.
        - id: ch01-b43
          speaker: narrator
          text: Bobbie climbed aboard. The brown horse had to turn around, though it had been looking forward to its tea. Or rather, its oats.
        - id: ch01-b44
          speaker: roberta
          text: This is wonderful!
        - id: ch01-b45
          speaker: narrator
          text: The dogcart flew along the canal road and passed Three Chimneys.
        - id: ch01-b46
          speaker: doctor_forrest
          text: From here, we could toss a stone down any one of your three chimneys.
        - id: ch01-b47
          speaker: roberta
          text: Only if you were a very good shot.
        - id: ch01-b48
          speaker: doctor_forrest
          text: And how do you know I'm not? Now, what's troubling you?
        - id: ch01-b49
          speaker: narrator
          text: Bobbie played with the hook on the driving apron.
        - id: ch01-b50
          speaker: doctor_forrest
          text: Come on. Tell me.
        - id: ch01-b51
          speaker: roberta
          text: It's hard to tell you because of what Mother said.
        - id: ch01-b52
          speaker: doctor_forrest
          text: What did she say?
        - id: ch01-b53
          speaker: roberta
          text: She said not to tell everyone we're poor. But you aren't everyone, are you?
        - id: ch01-b54
          speaker: doctor_forrest
          text: Certainly not. Go on.
        - id: ch01-b55
          speaker: roberta
          text: Doctors are terribly extravagant. I mean expensive. Mrs. Viney says her doctoring costs only two pennies a week because she belongs to a club. She told me how good you are, so I asked how she could afford you when she's much poorer than we are. I've seen her house, so I know. Then she explained the club. Could we join it too? I don't want Mother worrying.
        - id: ch01-b56
          speaker: narrator
          text: The Doctor said nothing. He was rather poor himself, and a new family of patients had pleased him, so his feelings were mixed.
        - id: ch01-b57
          speaker: roberta
          text: You're not angry with me, are you?
          emotion: fearful
        - id: ch01-b58
          speaker: narrator
          text: Her voice had become very small. The Doctor pulled himself out of his thoughts.
        - id: ch01-b59
          speaker: doctor_forrest
          text: Angry? I couldn't be. You've been very sensible. Don't worry about this. I'll settle it with your mother, even if I have to invent a brand-new club just for her. Now look over there. That's where the aqueduct begins.
        - id: ch01-b60
          speaker: roberta
          text: The aque—what did you call it?
        - id: ch01-b61
          speaker: doctor_forrest
          text: A water bridge. Look.
        - id: ch01-b62
          speaker: narrator
          text: The road climbed onto a bridge. To their left stood a steep wall of rock, with trees and bushes growing from its cracks. The canal left the hilltop and crossed the valley on its own enormous bridge, carried by tall arches. Bobbie drew a long breath.
        - id: ch01-b63
          speaker: roberta
          text: Isn't it grand? It looks like the pictures in the History of Rome.
        - id: ch01-b64
          speaker: doctor_forrest
          text: Exactly! The Romans were wild about aqueducts. This one is a splendid piece of engineering.
        - id: ch01-b65
          speaker: roberta
          text: I thought engineering meant building engines.
        - id: ch01-b66
          speaker: doctor_forrest
          text: There are several kinds. Building roads, bridges, and tunnels is engineering. So is making fortifications. We'd better turn back now. And remember, no worrying about doctor's bills. If you make yourself sick, I'll send you a bill as long as that aqueduct.
        - id: ch01-b67
          speaker: narrator
          text: The Doctor left Bobbie at the top of the field above Three Chimneys. She knew Mother might think she had done wrong, but this time Bobbie believed she was right. She scrambled down the rocky slope feeling truly happy.
        - id: ch01-b68
          speaker: narrator
          text: Peter and Phyllis met her at the back door, looking unnaturally clean and neat. Phyllis wore a red bow. Bobbie barely had time to tidy herself and tie a blue bow in her hair before a little bell rang.
        - id: ch01-b69
          speaker: phyllis
          text: That means the surprise is ready. Wait until the bell rings again, and then you can come into the dining room.
        - id: ch01-b70
          speaker: narrator
          text: Bobbie waited. The bell tinkled again, and she entered shyly. It felt like stepping into a new world filled with light, flowers, and song. Mother, Peter, and Phyllis stood in a row beyond the table. The shutters were closed, and twelve candles burned, one for each year of Bobbie's life. Flowers made patterns across the table. At her place lay a thick crown of forget-me-nots and several exciting little packages.
        - id: ch01-b71
          speaker: narrator
          text: "The three of them sang words Mother had written to the first part of the tune of ‘St. Patrick's Day.’ Making birthday verses was one of Mother's special customs. It had begun when Bobbie turned four and Phyllis was still a baby. Bobbie remembered learning that first verse to surprise Father. It said she was only four and did not want to be any older because four was the nicest age. Two and two, or one and three, always came to the same beloved four people: Mother, Peter, Phyllis, and Father. At the end, she had asked Father to kiss his little girl because she had learned and recited it. Now Bobbie wondered whether Mother was remembering that birthday too."
        - id: ch01-b72
          speakers: [mother, peter, phyllis]
          ensemble: chorus
          text: Our darling Roberta, no sorrow shall hurt her if we can prevent it her whole life long. Her birthday's our feast day. We'll make it our great day, and give her our presents and sing her our song. May pleasures attend her, and may the Fates send her the happiest journey along her life's way. With bright skies above her and dear ones to love her, dear Bob, many happy returns of the day!
        - id: ch01-b73
          speakers: [mother, peter, phyllis]
          ensemble: chorus
          text: Three cheers for our Bobbie!
          emotion: happy
        - id: ch01-b74
          speaker: narrator
          text: They cheered loudly. Bobbie felt the prickling behind her eyes and the odd ache in her nose that comes just before tears. Before she could cry, everyone was hugging and kissing her.
        - id: ch01-b75
          speaker: mother
          text: Now open your presents.
        - id: ch01-b76
          speaker: narrator
          text: Phyllis had secretly made a red-and-green needle book. Mother gave Bobbie her own little silver buttercup brooch, which Bobbie had loved for years without ever dreaming it would belong to her. Mrs. Viney gave her two blue glass vases that Bobbie had admired in the village shop. There were also three pretty birthday cards.
        - id: ch01-b77
          speaker: narrator
          text: Mother placed the forget-me-not crown on Bobbie's brown hair.
        - id: ch01-b78
          speaker: mother
          text: Now look at the table.
        - id: ch01-b79
          speaker: narrator
          text: The cake wore a coat of white sugar, with “Dear Bobbie” spelled across it in pink candies. There were buns and jam as well. But the loveliest part was the great spread of flowers that nearly covered the table. Wallflowers lay all around the tea tray. A ring of forget-me-nots circled every plate, and a wreath of white lilac surrounded the cake. In the middle of the table, separate blossoms of lilac, wallflower, and golden laburnum had been carefully arranged into a pattern whose meaning Bobbie had not yet guessed.
        - id: ch01-b80
          speaker: peter
          text: It's a map of the railway! The lilac lines are the tracks. Brown wallflowers make the station, and the laburnum is the train. There are the signal boxes and the road home. Those three fat red daisies are us waving, and the pansy riding in the laburnum train is the old gentleman.
        - id: ch01-b81
          speaker: phyllis
          text: Purple primroses make Three Chimneys. That tiny rosebud is Mother watching for us when we're late for tea. Peter planned everything, and we got the flowers at the station. We thought you'd like this best.
        - id: ch01-b82
          speaker: peter
          text: And here's my present.
        - id: ch01-b83
          speaker: narrator
          text: Peter suddenly set his beloved toy steam engine in front of Bobbie. Its tender was lined with clean white paper and filled with candy.
        - id: ch01-b84
          speaker: roberta
          text: Oh, Peter! You're giving me your own dear engine?
          emotion: surprised
        - id: ch01-b85
          speaker: peter
          text: Oh, no. Not the engine. Just the candy.
        - id: ch01-b86
          speaker: narrator
          text: Bobbie's face fell a little. She was not so much disappointed as embarrassed. She had thought Peter's gift wonderfully noble, and now she felt foolish and greedy for expecting the engine too. Peter saw her expression. After a moment, his face changed as well.
        - id: ch01-b87
          speaker: peter
          text: I mean, I'm not giving you the whole engine. You can own half if you want.
        - id: ch01-b88
          speaker: roberta
          text: You're a brick. It's a splendid present.
        - id: ch01-b89
          speaker: narrator
          text: Bobbie said nothing else aloud, but she had plenty to say inside her own mind. It was wonderfully decent of Peter to offer half, because she knew perfectly well that he had not meant to give away any part of the engine when he first set it on the table. She decided that the broken half would count as her share. Somehow, she would have that half repaired. Then, when Peter's birthday came, she would give the whole engine back to him.
        - id: ch01-b90
          speaker: roberta
          text: Yes, Mother, I'd like to cut the cake.
        - id: ch01-b91
          speaker: narrator
          text: Tea began, and it became a delightful birthday. Afterward, Mother played any game the children wanted. Naturally, their first choice was blindman's buff. During the game, Bobbie's forget-me-not crown slipped sideways until it hung crookedly over one ear, and there it stayed. At last bedtime drew near. It was time for everyone to settle after the noise and excitement, so Mother brought out a lovely new story and read it aloud to them.
        - id: ch01-b92
          speaker: roberta
          text: You won't stay up late working, will you, Mother?
        - id: ch01-b93
          speaker: mother
          text: No, dear. I'll only write to Father and then go to bed.
        - id: ch01-b94
          speaker: narrator
          text: Later that night, Bobbie crept downstairs to collect her presents. She felt she truly could not stay separated from all those treasures until morning. But when she reached the room, Mother was not writing to Father as she had promised. She sat at the table with both arms folded in front of her and her head resting upon them. Bobbie understood that Mother did not want her unhappiness seen. So Bobbie made no sound and quietly slipped away, repeating one thought to herself all the while.
        - id: ch01-b95
          speaker: roberta
          text: She doesn't want me to know she's unhappy, so I won't know. I won't know.
          emotion: sad
        - id: ch01-b96
          speaker: narrator
          text: And so the birthday ended sadly.
        - id: ch01-b97
          speaker: narrator
          text: The very next morning, Bobbie began watching for a chance to have Peter's engine repaired without his knowing. That chance arrived the following afternoon. Mother planned to take the train to the nearest town and do some shopping. Whenever she made that trip, she also went to the post office. Perhaps that was where she mailed her letters to Father. She never trusted those letters to the children or to Mrs. Viney, and she never visited the post office in their own village. Whatever her reason, a trip to town meant that Mother would be away for a while.
        - id: ch01-b98
          speaker: narrator
          text: "Peter and Phyllis were going with Mother, and Bobbie badly needed some excuse to stay behind. She tried and tried but could not invent a good one. Just when she thought her whole plan was lost, her dress snagged on a large nail beside the kitchen door. The nail tore a great crisscross all down the front of her skirt. Let there be no mistake about it: the tear was a real accident. Mother, Peter, and Phyllis felt sorry for her, but they were already late. There was no time for Bobbie to change before the train left, so the three of them hurried away without her."
        - id: ch01-b99
          speaker: narrator
          text: Once the others had gone, Bobbie changed into her everyday dress and set out for the railway. She did not enter the station. Instead, she followed the line toward the end of the platform where the engine stood whenever a down train stopped there. A water tank rose nearby, with a long, limp leather hose hanging from it like an elephant's trunk. Bobbie crossed to the other side of the railway and hid behind a bush. Peter's toy engine was tied inside brown paper and tucked securely under her arm. Then she waited, as patiently as she could, for the next train.
        - id: ch01-b100
          speaker: narrator
          text: When the next train stopped, she crossed the up-line tracks and stood beside the engine. She had never been so close to one. It was larger and harder than she had imagined. Beside it, she felt tiny and terribly soft, as though she could be hurt very easily.
        - id: ch01-b101
          speaker: roberta
          text: Now I know how silkworms feel.
        - id: ch01-b102
          speaker: narrator
          text: The driver and fireman did not see her. They leaned from the other side of the cab, telling Perks a story about a dog and a leg of mutton.
        - id: ch01-b103
          speaker: roberta
          text: Excuse me, please.
        - id: ch01-b104
          speaker: narrator
          text: Steam roared from the engine and swallowed her voice.
        - id: ch01-b105
          speaker: roberta
          text: Excuse me, Mr. Engineer!
        - id: ch01-b106
          speaker: narrator
          text: This time, the engine chose the very same moment to speak. Against its voice, Bobbie's soft little call had no chance at all. The only answer, she decided, was to climb onto the engine and pull gently at one of the men's coats. The step was very high. She managed to hook one knee over it, hauled herself upward, and clambered into the cab. Then she stumbled. She went down on her hands and knees at the foot of the enormous slope of coal that rose toward the square opening of the tender.
        - id: ch01-b107
          speaker: narrator
          text: The engine was making far more noise than necessary. Just as Bobbie fell, the driver turned without seeing her and started the train. By the time she stood up, it was moving too fast for her to jump down.
        - id: ch01-b108
          speaker: narrator
          text: A whole crowd of dreadful thoughts struck her in one horrible flash. There were express trains that traveled for hundreds of miles, or so she supposed, without stopping once. What if she had climbed onto one of those? Even when it finally stopped, how would she ever return? She had not brought a single coin to buy a ticket home, and nobody knew where she had gone.
        - id: ch01-b109
          speaker: roberta
          text: I don't belong here. I'm an engine burglar. That's what I am. They might lock me up for this.
          emotion: fearful
        - id: ch01-b110
          speaker: narrator
          text: The train gathered speed. Fear closed Bobbie's throat. Twice she tried to speak, but the men had their backs to her as they worked the controls. At last, she reached out and caught the nearest sleeve. The man spun around. For one silent moment, he and Bobbie stared at each other. Then they both made a sound.
        - id: ch01-b111
          speaker: jim
          text: Well, here's a fine business!
          emotion: surprised
        - id: ch01-b112
          speaker: narrator
          text: Bobbie burst into tears. The other man said he was blooming well blest, or something much like it. They were startled, but they were not exactly unkind.
        - id: ch01-b113
          speaker: jim
          text: You're a naughty little girl, that's what you are.
        - id: ch01-b114
          speaker: bill
          text: I'd call her a daring little thing.
        - id: ch01-b115
          speaker: narrator
          text: They helped her onto an iron seat in the cab and told her to stop crying as soon as she could, then explain exactly what she meant by appearing among their coal. Bobbie tried to obey. One thought helped her. Peter would almost have given his ears to stand where she stood, inside a real engine that was truly moving. Many times, the children had wondered whether any engine driver in the world could be noble enough to take them for a ride. And here Bobbie was, having that ride by accident. She dried her eyes, drew a shaky breath, and sniffed with great determination.
        - id: ch01-b116
          speaker: jim
          text: All right, then. What did you think you were doing?
        - id: ch01-b117
          speaker: roberta
          text: Oh, please—
        - id: ch01-b118
          speaker: bill
          text: Try once more.
          emotion: calm
        - id: ch01-b119
          speaker: roberta
          text: Mr. Engineer, I called from beside the track, but you couldn't hear me. I climbed up because I only meant to touch your arm very gently. Then I fell into the coal. I'm terribly sorry I frightened you. Please don't be angry with me.
          emotion: fearful
        - id: ch01-b120
          speaker: jim
          text: We're not so much angry as interested. A little girl doesn't tumble out of the sky into our coal bunker every day, does she, Bill? But why did you do it?
        - id: ch01-b121
          speaker: bill
          text: That's the question. Why did you climb up here?
        - id: ch01-b122
          speaker: narrator
          text: Bobbie had not quite finished crying. Bill patted her back.
        - id: ch01-b123
          speaker: bill
          text: Cheer up, mate. Whatever it is, it can't be as bad as all that.
          emotion: calm
        - id: ch01-b124
          speaker: roberta
          text: I only wanted to ask if you'd be kind enough to mend this.
        - id: ch01-b125
          speaker: narrator
          text: Being called “mate” cheered Bobbie greatly. She reached among the scattered coal, found the brown-paper parcel, and began working at the string. Her fingers had turned hot and red, and they still trembled. The fire pouring from the engine scorched her feet and legs, while the wild rush of cold air swept across her shoulders. Everything lurched, shook, and rattled around her. When they thundered beneath a bridge, the engine seemed to shout straight into her ears. Jim kept feeding coal into the blazing fire. At last, Bobbie pulled away the paper and revealed Peter's small toy engine.
        - id: ch01-b126
          speaker: roberta
          text: I thought you might fix it because you're engineers.
        - id: ch01-b127
          speaker: narrator
          text: Bill said he was blowed if he wasn't blest.
        - id: ch01-b128
          speaker: jim
          text: And I'm blest if I'm not blowed.
        - id: ch01-b129
          speaker: narrator
          text: Bill examined the little engine, and Jim paused his shoveling to look too.
        - id: ch01-b130
          speaker: bill
          text: You've got plenty of nerve. Why would you think we'd bother repairing a penny toy?
        - id: ch01-b131
          speaker: roberta
          text: I didn't mean to be rude. Everyone connected with the railway has been so good and kind that I thought you wouldn't mind. You don't really mind, do you?
        - id: ch01-b132
          speaker: narrator
          text: She had seen the two men exchange a friendly wink.
        - id: ch01-b133
          speaker: bill
          text: My work is driving engines, not repairing them, especially one this far outside the usual size. And how are we supposed to return you to your grieving friends and family so everyone can forgive and forget this?
        - id: ch01-b134
          speaker: roberta
          text: Let me off at the next stop and lend me enough for a third-class ticket. I'll repay every penny, honor bright. I'm not a confidence trick like the ones in the newspaper. Truly, I'm not.
        - id: ch01-b135
          speaker: narrator
          text: Bobbie spoke firmly, though her heart thumped against her clasped hands. Bill's manner changed completely.
        - id: ch01-b136
          speaker: bill
          text: You're a little lady from head to toe. We'll get you safely home. And this engine—Jim, don't you know someone who can handle a soldering iron? Looks to me like that's all the little rascal needs.
        - id: ch01-b137
          speaker: roberta
          text: That's what Father said. What does that wheel do?
        - id: ch01-b138
          speaker: narrator
          text: She pointed to a small brass wheel Bill had turned.
        - id: ch01-b139
          speaker: bill
          text: That's the injector.
        - id: ch01-b140
