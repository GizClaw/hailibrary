audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带一点机灵的幽默
        timbre: 清澈柔和
        pace: 从容而有变化
        pitch: 中音
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔坚定，情绪真挚而克制
        timbre: 温暖清亮
        pace: 舒缓
        pitch: 中音
    bobbie:
      display_name: 博比
      tts:
        delivery: 真诚敏感，勇敢中带着孩子气
        timbre: 清脆柔和
        pace: 自然偏快
        pitch: 中高音
    peter:
      display_name: 彼得
      tts:
        delivery: 爽直活泼，偶尔一本正经
        timbre: 明亮结实
        pace: 利落
        pitch: 中高音
    phyllis:
      display_name: 菲莉丝
      tts:
        delivery: 天真灵动，想象丰富
        timbre: 轻盈清甜
        pace: 轻快
        pitch: 高音
    station_master:
      display_name: 站长
      tts:
        delivery: 稳重随和，略带好奇
        timbre: 浑厚清晰
        pace: 适中
        pitch: 中低音
    perks:
      display_name: 珀克斯
      tts:
        delivery: 热情健谈，带朴实的诙谐
        timbre: 粗粝温厚
        pace: 明快
        pitch: 中低音
    doctor:
      display_name: 医生
      tts:
        delivery: 爽朗体贴，用玩笑安抚人心
        timbre: 温和明朗
        pace: 适中
        pitch: 中音
    bill:
      display_name: 比尔
      tts:
        delivery: 豪爽直率，惊讶过后十分友善
        timbre: 低沉有力
        pace: 干脆
        pitch: 低音
    jim:
      display_name: 吉姆
      tts:
        delivery: 粗声粗气却没有恶意
        timbre: 沙哑厚实
        pace: 稍快
        pitch: 中低音
    guard:
      display_name: 列车员
      tts:
        delivery: 随和耐心，讲解清楚
        timbre: 平实温厚
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 写在旗上的谢意
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二条床单裁剩的布，加上一点炉黑，正好做成一面旗。旗上写着：“她差不多全好了，谢谢您。”神奇的大提篮送来大约两星期后，孩子们把这面旗举给绿龙看。老先生瞧见了，在车上高高兴兴地挥手回应。
        - id: ch01-b02
          speaker: narrator
          text: 谢过老先生以后，孩子们知道，该把妈妈生病时发生的事全告诉她了。他们原以为开口不会太难，真要说时才发现完全不是这样。可这件事非说不可，他们终于还是说了。
        - id: ch01-b03
          speaker: narrator
          text: 妈妈气坏了。她平时很少发火，这一次却比孩子们见过的任何一次都厉害，实在有些吓人。更糟的是，她忽然哭了。哭大概也会传染，跟麻疹和百日咳差不多，因为没过一会儿，所有人都哭成了一团。
        - id: ch01-b04
          speaker: narrator
          text: 妈妈最先停下来。她擦掉眼泪，望着孩子们。
        - id: ch01-b05
          speaker: mother
          text: 亲爱的孩子们，刚才我发了那么大的火，对不起。我知道，你们其实不明白自己做错了什么。
          emotion: sad
        - id: ch01-b06
          speaker: bobbie
          text: 妈妈，我们不是故意淘气的。
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: 博比抽抽搭搭地说着，彼得和菲莉丝也在一旁吸鼻子。
        - id: ch01-b08
          speaker: mother
          text: 那你们现在听好。我们确实很穷，可手里的钱还够生活。家里的事不能走到哪儿说到哪儿，那样不对。更不能，绝对、绝对、绝对不能开口向陌生人要东西。以后永远记住，好吗？
        - id: ch01-b09
          speaker: narrator
          text: 三个孩子一起抱住妈妈，把哭湿的脸颊贴在她脸上蹭，答应永远不会忘记。
        - id: ch01-b10
          speaker: mother
          text: 我会写信给那位老先生，告诉他我不赞成这件事。当然，他那么好心，我也一定会谢他。我不赞成的是你们，不是他。老先生已经好得不能再好了。你们把信交给站长，请他转交。说完这一次，我们以后就不提了。
        - id: ch01-b11
          speaker: narrator
          text: 后来，三个孩子单独待在一起，忍不住又谈起妈妈。
        - id: ch01-b12
          speaker: bobbie
          text: 妈妈真了不起。换成别的大人，有几个肯承认自己不该发那么大的火？
        - id: ch01-b13
          speaker: peter
          text: 没错，她是很了不起。不过她真生起气来，也真够吓人的。
        - id: ch01-b14
          speaker: phyllis
          text: 她就像歌里唱的那样，又光明，又威严，还会降下惩罚。要不是那么可怕，我真想仔细看看。妈妈大发雷霆的时候，漂亮极了。
        - id: ch01-b15
          speaker: narrator
          text: 他们把妈妈的信送到车站，请站长转交。
        - id: ch01-b16
          speaker: station_master
          text: 我记得你们说过，除了伦敦的人，这儿一个朋友也没有。
        - id: ch01-b17
          speaker: peter
          text: 这位是后来认识的朋友。
        - id: ch01-b18
          speaker: station_master
          text: 他不住在附近吧？
        - id: ch01-b19
          speaker: peter
          text: 不住。我们是在铁路上认识他的。
        - id: ch01-b20
          speaker: narrator
          text: 站长带着信，退回售票小窗口后面那个神圣的内殿。孩子们下楼去了搬运工休息室，跟搬运工聊天。这位搬运工姓珀克斯，已经结婚，还有三个孩子。他告诉他们，机车前面的灯叫前灯，后面的叫尾灯。
        - id: ch01-b21
          speaker: phyllis
          text: 这下可证明了，火车真是龙变的。你看，它既有头，又有尾，一样都不少。
        - id: ch01-b22
          speaker: narrator
          text: 也是在这一天，孩子们第一次发现，原来机车并不是全都长一个样。
        - id: ch01-b23
          speaker: perks
          text: 全都一样？哎哟，小姐，哪能呢！它们跟你我一样，一辆有一辆的模样。刚才自己开过去、后面没挂煤水车的那个小家伙，是水柜机车。她要去梅德布里另一头调车，就像您这位小姐。货运机车一边有三个大轮子，结结实实，轮子之间用连杆接着，那就像我。还有干线机车，就像这位小少爷以后长大了，在学校里每场赛跑都拿第一。他准行。干线机车既得有力气，又得跑得快。九点一刻的上行车就是一辆。
        - id: ch01-b24
          speaker: phyllis
          text: 就是绿龙。
        - id: ch01-b25
          speaker: perks
          text: 我们背地里叫她蜗牛，小姐。全线就她最爱晚点。
        - id: ch01-b26
          speaker: phyllis
          text: 可那辆机车明明是绿色的呀。
        - id: ch01-b27
          speaker: perks
          text: 没错，小姐。蜗牛一年里有些时候，不也是绿色的吗？
        - id: ch01-b28
          speaker: narrator
          text: 回家吃饭时，孩子们一致认定，珀克斯真是个有趣得不能再有趣的伙伴。
    - id: ch02
      title: 运河桥上的心事
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天是罗伯塔的生日。下午，她接到一个客气却不容商量的命令：出去走走，喝茶以前不许回来。
        - id: ch02-b02
          speaker: phyllis
          text: 我们没做完，你就不能看。这可是一个妙极了的惊喜！
        - id: ch02-b03
          speaker: narrator
          text: 罗伯塔只好独自走进花园。她努力提醒自己应该感激。可不管惊喜有多美妙，她还是觉得，生日那天下午与其孤零零地等，不如跟大家一起准备。
        - id: ch02-b04
          speaker: narrator
          text: 身边一个人也没有，她便有空想自己的心事。她想得最多的，是妈妈发烧那晚说过的一句话。那时，妈妈的双手滚烫，眼睛亮得异样。
        - id: ch02-b05
          speaker: mother
          text: 哎呀，这一病，医生的账单不知道要有多长！
        - id: ch02-b06
          speaker: narrator
          text: 博比在花园里一圈圈地走。她经过还没开花、只长着花蕾的蔷薇，又经过紫丁香、山梅花和美洲茶藨子。她越想那张医生账单，心里越不安。
        - id: ch02-b07
          speaker: narrator
          text: 没多久，她有了主意。她从花园侧门出去，爬上陡坡，来到运河边的路上。她一直走到通往村子的运河桥，停在那里等。阳光暖暖的，她把胳膊肘撑在温热的桥石上，低头看着蓝蓝的河水，觉得很舒服。
        - id: ch02-b08
          speaker: narrator
          text: 博比从前只见过摄政运河，可那里的水一点也不好看。河呢，她只见过泰晤士河。而泰晤士河那张脸，要是肯洗一洗，也会漂亮得多。
        - id: ch02-b09
          speaker: narrator
          text: 要不是两件事，孩子们也许会像喜欢铁路那样喜欢运河。第一，他们先认识了铁路。搬来的第一个奇妙清晨，房子、田野、荒原、岩石和高山，样样都是新的。过了好几天，他们才发现运河。第二，铁路上的人都对他们很好，站长、搬运工，还有那位挥手的老先生。运河上的人可一点也不友善。
        - id: ch02-b10
          speaker: narrator
          text: 运河上的人，当然就是船夫。他们驾着缓慢的驳船来来往往，有时也走在老马旁边。老马踩着泥泞的纤道，身上绷着长长的绳子，吃力地拖船。
        - id: ch02-b11
          speaker: narrator
          text: 有一回，彼得向一个船夫问时间，那人凶巴巴地叫他滚开。彼得甚至没来得及争辩，说自己跟对方一样有权走纤道。其实，是过了好一阵子以后，他才想到当时本可以这么说。
        - id: ch02-b12
          speaker: narrator
          text: 还有一天，孩子们想在运河边钓鱼。一条驳船上的男孩朝他们扔煤块，其中一块正好打中菲莉丝的后颈。那时她弯腰系鞋带，煤块几乎没把她打疼，却让她一下子不想再钓鱼了。
        - id: ch02-b13
          speaker: narrator
          text: 不过，站在桥上的罗伯塔觉得很安全。她可以从上面望着运河。要是哪个男孩露出想扔煤块的样子，她马上就能躲到桥栏后面。
        - id: ch02-b14
          speaker: narrator
          text: 不久，她听见了车轮声。正是她在等的声音。医生的双轮马车来了，车上坐的自然就是医生。他勒住马，向她打招呼。
        - id: ch02-b15
          speaker: doctor
          text: 喂，护士长！要不要搭一程？
        - id: ch02-b16
          speaker: bobbie
          text: 我正是来找您的。
        - id: ch02-b17
          speaker: doctor
          text: 但愿不是你妈妈的病又重了？
        - id: ch02-b18
          speaker: bobbie
          text: 没有，可是……
        - id: ch02-b19
          speaker: doctor
          text: 那就上来吧，我们一起兜一圈。
        - id: ch02-b20
          speaker: narrator
          text: 罗伯塔爬上马车，棕马只好掉头。它可不喜欢这样，因为它正盼着回去吃茶点。我的意思是，回去吃燕麦。
        - id: ch02-b21
          speaker: bobbie
          text: 这样跑起来真痛快！
        - id: ch02-b22
          speaker: narrator
          text: 双轮马车沿运河边的路飞驰。经过三烟囱时，医生朝那边看了看。
        - id: ch02-b23
          speaker: doctor
          text: 从这里扔一块石头，我准能让它掉进你们三根烟囱里的随便哪一根。
        - id: ch02-b24
          speaker: bobbie
          text: 能是能，可您得扔得特别准。
        - id: ch02-b25
          speaker: doctor
          text: 你怎么知道我扔不准？好了，说吧，你碰上什么难题了？
        - id: ch02-b26
          speaker: narrator
          text: 博比摆弄着挡腿毯上的小钩子，怎么坐都不自在。
        - id: ch02-b27
          speaker: doctor
          text: 说出来，一口气全说出来。
        - id: ch02-b28
          speaker: bobbie
          text: 可这件事不太好说。妈妈说过那些话。
        - id: ch02-b29
          speaker: doctor
          text: 她说什么了？
        - id: ch02-b30
          speaker: bobbie
          text: 她说，不能到处告诉别人我们很穷。可您不算随随便便的别人，对吧？
        - id: ch02-b31
          speaker: doctor
          text: 我当然不算。你接着说。
          emotion: happy
        - id: ch02-b32
          speaker: bobbie
          text: 我知道，请医生看病很铺张……我是说，很贵。维尼太太告诉我，她加入了一个互助会，所以每星期只花两便士看病。
        - id: ch02-b33
          speaker: doctor
          text: 是吗？
        - id: ch02-b34
          speaker: bobbie
          text: 她先夸您的医术特别好。我就问她，她比我们穷得多，怎么还请得起您。我去过她家，所以知道。后来她才告诉我互助会的事。我就想来问问您，我们不能也加入那个互助会吗？跟维尼太太一样。还有……我真的不想让妈妈担心！
        - id: ch02-b35
          speaker: narrator
          text: 医生没有马上回答。他自己也不富裕，刚有一家新病人请他照料，他原本很高兴。所以那一刻，他心里的滋味一定很复杂。
        - id: ch02-b36
          speaker: bobbie
          text: 您没有生我的气吧？
          emotion: fearful
        - id: ch02-b37
          speaker: narrator
          text: 她的声音小得几乎听不见。医生这才回过神。
        - id: ch02-b38
          speaker: doctor
          text: 生气？我怎么会生气？你是个很懂事的小姑娘。听我说，这件事不用你操心。我会跟你妈妈安排好。哪怕得专门为她一个人新办一个特别互助会，也没问题。看，渡槽就是从这儿开始的。
        - id: ch02-b39
          speaker: bobbie
          text: 渡……您说那东西叫什么？
        - id: ch02-b40
          speaker: doctor
          text: 就是让水走过去的桥。你瞧。
        - id: ch02-b41
          speaker: narrator
          text: 道路向上爬，通到一座跨过运河的桥。左边是陡峭的岩壁，树木和灌丛从石缝里钻出来。到了这里，运河不再沿着山顶流，而是走上了自己的桥。那座桥高得惊人，一排高高的拱横跨整条山谷。
        - id: ch02-b42
          speaker: narrator
          text: 博比深深吸了一口气。
        - id: ch02-b43
          speaker: bobbie
          text: 真壮观，是不是？简直像《罗马史》里的插图。
          emotion: surprised
        - id: ch02-b44
          speaker: doctor
          text: 说得对！就是一模一样。罗马人最会修渡槽。这工程可真了不起。
        - id: ch02-b45
          speaker: bobbie
          text: 我还以为，工程就是造机车呢。
        - id: ch02-b46
          speaker: doctor
          text: 工程有好多种。修路、修桥、挖隧道是一种，建防御工事又是另一种。好了，我们该回去了。记住，不许再替医生的账单发愁。要不然你自己也会生病，到时我就给你寄一张跟渡槽一样长的账单。
        - id: ch02-b47
          speaker: narrator
          text: 到了大路通向三烟囱那片田地的坡顶，博比跟医生告别。她并不觉得自己做错了。她知道妈妈也许不这么想，可这一次，博比觉得自己才是对的。她顺着乱石坡爬下去，心里快活极了。
    - id: ch03
      title: 十二支蜡烛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 菲莉丝和彼得在后门等着博比。两个人干净整齐得很不寻常，菲莉丝头发上还扎着一只红蝴蝶结。博比只来得及收拾好自己，在头发上系上一只蓝蝴蝶结，便听见了一阵小铃声。
        - id: ch03-b02
          speaker: phyllis
          text: 好了！这说明惊喜已经准备好啦。你先在这里等，铃再响一次，才能进饭厅。
        - id: ch03-b03
          speaker: narrator
          text: 博比等着。很快，小铃又叮铃叮铃地响了。她走进饭厅，心里忽然有点害羞。门一打开，她仿佛走进了一个由灯光、鲜花和歌声组成的新世界。
        - id: ch03-b04
          speaker: narrator
          text: 妈妈、彼得和菲莉丝并排站在桌子那一头。百叶窗全关着，桌上点了十二支蜡烛，罗伯塔每长一岁，就有一支。鲜花在桌面铺成了图案。罗伯塔的位置上放着一顶厚厚的勿忘我花冠，还有几只一看就很有趣的小包裹。
        - id: ch03-b05
          speaker: narrator
          text: 三个人唱起了歌，用的是《圣帕特里克节》开头那一段曲调。罗伯塔一听就知道，歌词是妈妈专门为她的生日写的。每逢孩子过生日，妈妈总会这样做。
        - id: ch03-b06
          speaker: narrator
          text: 博比四岁生日时，菲莉丝还是个婴儿，妈妈就是从那年开始写生日诗的。博比还记得，自己学会了那首诗，背给爸爸听，好给他一个惊喜。她不知道妈妈是不是也还记得。
        - id: ch03-b07
          speaker: bobbie
          text: 亲爱的爸爸，我才四岁，再大一些，我可不愿意。四岁是最最好的年纪，二加二，也是一加三。我爱的是二加二，妈妈、彼得、菲尔和你。你爱的是一加三，妈妈、彼得、菲尔和我。亲亲你的小姑娘吧，因为她学会了，背给你听啦。
        - id: ch03-b08
          speakers: [mother, peter, phyllis]
          ensemble: chorus
          text: 我们亲爱的罗伯塔，若是我们能够阻挡，她的一生啊，绝不让忧愁把她伤害。她生日就是我们的节日，我们要让今天盛大无比，把礼物送给她，把我们的歌唱起来。愿欢乐常伴她左右，愿命运赐给她，一生旅途幸福无忧。愿头顶天空永远明亮，愿身边总有亲人可爱！亲爱的博比，祝你生日快乐，年年都有今日的欢畅！
          emotion: happy
        - id: ch03-b09
          speakers: [mother, peter, phyllis]
          ensemble: chorus
          text: 为我们的博比欢呼三声！好！好！好！
          emotion: happy
        - id: ch03-b10
          speaker: narrator
          text: 博比觉得自己马上要哭了。你知道那种古怪的感觉吗？鼻梁发酸，眼皮像被针轻轻扎着。可她还没来得及哭，大家已经一拥而上，亲她，抱她。
        - id: ch03-b11
          speaker: mother
          text: 好了，现在看看你的礼物吧。
        - id: ch03-b12
          speaker: narrator
          text: 每一件礼物都好极了。菲莉丝趁人不注意，亲手做了一本红绿两色的针插簿。妈妈送给她一枚可爱的小银胸针，样子像一朵毛茛花。博比认识它、喜欢它已经好多年了，却从没想过有一天它会真正属于自己。
        - id: ch03-b13
          speaker: narrator
          text: 维尼太太送了一对蓝玻璃花瓶。罗伯塔在村里的商店见过，一直很喜欢。桌上还有三张生日卡，画着漂亮的图画，也写着祝福。妈妈把勿忘我花冠戴到博比棕色的头发上。
        - id: ch03-b14
          speaker: mother
          text: 再看看桌子上。
        - id: ch03-b15
          speaker: narrator
          text: 桌上有一只盖着白糖霜的蛋糕，粉红糖果在上面拼出“亲爱的博比”。还有小圆面包和果酱。最妙的是，整张大桌子几乎铺满了鲜花。茶盘边摆着桂竹香，每只盘子都围了一圈勿忘我。蛋糕周围是一圈白丁香，中间用一朵朵丁香、桂竹香和金链花排成了一幅图。
        - id: ch03-b16
          speaker: peter
          text: 这是一幅地图，铁路地图！看，丁香花排的是铁轨，棕色桂竹香就是车站。金链花是火车。这边是信号房，还有通向咱们家的路。那三朵胖胖的红雏菊，就是我们三个在向老先生挥手。金链花火车里的那朵三色堇，就是老先生。
          emotion: happy
        - id: ch03-b17
          speaker: phyllis
          text: 紫色报春花拼出来的是“三烟囱”。还有那颗小得不能再小的蔷薇花蕾，就是我们喝茶迟到时，等在家里的妈妈。全是彼得想出来的，花也是我们从车站拿来的。我们觉得，你一定更喜欢这个。
        - id: ch03-b18
          speaker: peter
          text: 这是我的礼物。
        - id: ch03-b19
          speaker: narrator
          text: 彼得忽然把自己最心爱的蒸汽机车放到她面前。煤水车里铺了新白纸，装得满满的都是糖果。
        - id: ch03-b20
          speaker: bobbie
          text: 哦，彼得！你连自己最心爱的小机车也要送给我吗？
          emotion: surprised
        - id: ch03-b21
          speaker: peter
          text: 哦，不。机车不送，只送里面的糖果。
        - id: ch03-b22
          speaker: narrator
          text: 博比的神色不由得变了一点。不是因为得不到机车而失望。她刚才以为彼得做了一件特别高尚的事，现在却觉得自己那样想很傻。而且，她以为糖果和机车都是礼物，看上去一定很贪心。
        - id: ch03-b23
          speaker: narrator
          text: 彼得看见她变了脸色。他犹豫了一会儿，自己的神情也变了。
        - id: ch03-b24
          speaker: peter
          text: 我的意思是，机车不用全送给你。只要你愿意，我们可以一人一半。
        - id: ch03-b25
          speaker: bobbie
          text: 你真够朋友！这礼物棒极了。
          emotion: happy
        - id: ch03-b26
          speaker: narrator
          text: 她嘴上没有再说，心里却想着，彼得真是好得不得了，因为她知道，他原先根本没打算送机车。那就把坏掉的一半算作自己的吧。她要修好它，等彼得生日时再送还给他。
        - id: ch03-b27
          speaker: bobbie
          text: 好的，亲爱的妈妈，我愿意来切蛋糕。
        - id: ch03-b28
          speaker: narrator
          text: 下午茶就这样开始了。这是一个快乐极了的生日。喝完茶，妈妈陪孩子们玩游戏，他们想玩什么都可以。第一个当然是蒙眼捉人。玩着玩着，博比的勿忘我花冠歪到一只耳朵上面，后来一直没有扶正。
        - id: ch03-b29
          speaker: narrator
          text: 快到睡觉时间，大家该安静下来时，妈妈又拿出一个精彩的新故事，念给他们听。
        - id: ch03-b30
          speaker: bobbie
          text: 妈妈，您今晚不会熬夜工作吧？
        - id: ch03-b31
          speaker: mother
          text: 不会。我只给爸爸写一封信，然后就去睡。
        - id: ch03-b32
          speaker: narrator
          text: 可过了一阵，博比悄悄下楼来拿礼物。她觉得自己实在没法跟这些礼物分开一整夜。她却看见，妈妈并没有写信。妈妈把头枕在手臂上，手臂伏在桌面上。
        - id: ch03-b33
          speaker: narrator
          text: 我觉得博比做得很好。她悄悄退了出去，一遍又一遍地对自己说：“她不想让我知道她不快乐，那我就不知道。我不知道。”可不管怎么说，这还是给她的生日添上了一个悲伤的结尾。
    - id: ch04
      title: 意外开走的机车
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天一早，博比就开始寻找机会，想偷偷把彼得的机车修好。又过了一个下午，机会终于来了。
        - id: ch04-b02
          speaker: narrator
          text: 妈妈要坐火车去最近的城镇买东西。她每次去那儿，总会到邮局一趟。也许是为了寄给爸爸的信，因为她从不让孩子们或维尼太太代寄，自己也从来不去村里的邮局。
        - id: ch04-b03
          speaker: narrator
          text: 彼得和菲莉丝要跟妈妈一起去。博比想找个借口留在家里，却怎么也编不出一个像样的。正当她以为彻底没希望时，厨房门边的一枚大钉子勾住了她的连衣裙，在裙子前面扯出一道横一道竖的大口子。我可以向你保证，这真的是意外。
        - id: ch04-b04
          speaker: narrator
          text: 大家都很同情她，让她留下来换衣服，自己先走了。他们本来就有些晚，再不赶紧去车站，就要错过火车，实在来不及等她。
        - id: ch04-b05
          speaker: narrator
          text: 他们一走，博比马上换上平时的裙子，来到铁路旁。她没有进车站，而是沿着铁路线走到站台尽头。下行火车停靠时，机车就停在这里。旁边有一座水箱，还垂着一根长长的软皮水管，活像大象的鼻子。
        - id: ch04-b06
          speaker: narrator
          text: 她腋下夹着用牛皮纸包好的玩具机车，躲到铁路另一边的灌木后面，耐心地等。
        - id: ch04-b07
          speaker: narrator
          text: 下一班火车进站停稳后，博比跨过上行线的铁轨，站到机车旁边。她从没有离真正的机车这么近。这个大家伙比她想象中更大，也更坚硬。它衬得她那么小，不知怎么，又让她显得那么柔软，仿佛机车只要轻轻碰她一下，就能把她伤得很重很重。
        - id: ch04-b08
          speaker: bobbie
          text: 我现在可知道蚕是什么感觉了。
        - id: ch04-b09
          speaker: narrator
          text: 司机和司炉都没发现她。他们从机车另一边探出身子，正在给搬运工讲一条狗和一条羊腿的故事。
        - id: ch04-b10
          speaker: bobbie
          text: 劳驾。
        - id: ch04-b11
          speaker: narrator
          text: 机车正喷着蒸汽，谁也没听见。
        - id: ch04-b12
          speaker: bobbie
          text: 劳驾，工程师先生！
        - id: ch04-b13
          speaker: narrator
          text: 她把声音提高了一点。偏偏就在这时，机车也开口了。罗伯塔细小柔和的声音，当然赢不了它。
        - id: ch04-b14
          speaker: narrator
          text: 看来，她只能爬上去，拉一拉他们的衣服。踏板很高。她先把一只膝盖搭上去，再手脚并用地爬进驾驶室。刚一进去，她就绊倒了，双手双膝跌在大煤堆底下。那堆煤一直高高堆到煤水车方形的开口。
        - id: ch04-b15
          speaker: narrator
          text: 机车跟它所有的同类一样，有一个毛病，就是发出的声音远比实际需要的大。罗伯塔跌上煤堆时，司机正好转过身，却没有瞧见她。他径直开动了机车。等博比爬起来，火车已经开始走了。虽然还不快，却快得让她根本跳不下去。
        - id: ch04-b16
          speaker: narrator
          text: 各种可怕的念头一股脑冲进她心里，汇成一阵恐惧。世上有些特快列车，一口气跑上几百英里，中间一次也不停。万一这列就是呢？她要怎么回家？她身上一文钱也没有，连返程车票都买不起。
        - id: ch04-b17
          speaker: bobbie
          text: 再说，我根本不该待在这儿。我是个机车窃贼。我就是。他们说不定会因为这件事把我关起来。
          emotion: fearful
        - id: ch04-b18
          speaker: narrator
          text: 火车越开越快。博比喉咙里像堵住了什么，怎么也说不出话。她试了两次。两个男人仍背对着她，忙着摆弄一些看起来像水龙头的东西。
        - id: ch04-b19
          speaker: narrator
          text: 最后，她猛地伸手，抓住离自己最近的那只袖子。那人吓了一跳，回过身来。他和罗伯塔默默对看了一会儿，然后两个人同时出了声。
        - id: ch04-b20
          speaker: jim
          text: 我的老天，这可真见了鬼啦！
          emotion: surprised
        - id: ch04-b21
          speaker: bobbie
          text: 呜哇……
          emotion: fearful
        - id: ch04-b22
          speaker: narrator
          text: 罗伯塔一下子哭出了声。另一个男人也说，这回真是见鬼见到家了，或者说了句意思差不多的话。他们当然大吃一惊，不过并不算凶。
        - id: ch04-b23
          speaker: jim
          text: 你这个小姑娘，可真不听话。事情就是这么回事。
        - id: ch04-b24
          speaker: bill
          text: 我倒觉得，她的胆子可真不小。
        - id: ch04-b25
          speaker: narrator
          text: 两人让她坐到驾驶室里的一张铁座位上，叫她别再哭，好好讲清楚自己到底想做什么。
        - id: ch04-b26
          speaker: narrator
          text: 她努力忍住眼泪。想到彼得差不多愿意拿自己的两只耳朵，换她现在这个位子，倒让她好受了一些。她正坐在真正的机车上，实实在在地向前飞驰。孩子们常猜，世上会不会有一位司机高尚到愿意让他们搭一程。如今，她居然真的坐在这里。
        - id: ch04-b27
          speaker: narrator
          text: 她擦干眼睛，使劲吸了吸鼻子。
        - id: ch04-b28
          speaker: jim
          text: 好了，说吧。你到底想干什么，嗯？
        - id: ch04-b29
          speaker: bobbie
          text: 哦，请您……
        - id: ch04-b30
          speaker: bill
          text: 再试一次。慢慢说。
        - id: ch04-b31
          speaker: bobbie
          text: 劳驾，工程师先生。我刚才真的在铁轨边喊过，可您没听见。我只是想爬上来，轻轻碰一下您的胳膊。后来我跌进煤堆里了。要是我吓着了您，真的很对不起。请您别生气，求求您了。
          emotion: fearful
        - id: ch04-b32
          speaker: jim
          text: 我们倒没有那么生气，只是很想知道到底怎么回事。小姑娘从天上掉进煤舱，这可不是天天都能遇上的，对不对，比尔？所以，你为什么要爬上来？
        - id: ch04-b33
          speaker: bill
          text: 这才问到点子上。你究竟为什么这么做？
        - id: ch04-b34
          speaker: narrator
          text: 博比发现，自己的眼泪还没有完全停。司机拍拍她的背。
        - id: ch04-b35
          speaker: bill
          text: 好了，打起精神来，伙计。事情肯定没你想得那么糟。
          emotion: calm
        - id: ch04-b36
          speaker: narrator
          text: 听见他叫自己“伙计”，博比一下子振作了不少。
        - id: ch04-b37
          speaker: bobbie
          text: 我只是想请问，您肯不肯帮我修一修这个？
        - id: ch04-b38
          speaker: narrator
          text: 她从煤堆里捡起牛皮纸包，用又热又红、还在发抖的手指解开绳子。炉火烤着她的脚和双腿，寒冷的狂风却扑在她肩上。机车一路猛晃、震动，咔嗒咔嗒地响。穿过一座桥时，它简直贴着她的耳朵大喊了一声。
        - id: ch04-b39
          speaker: narrator
          text: 吉姆往炉子里铲煤。博比揭开牛皮纸，露出那辆玩具机车。
        - id: ch04-b40
          speaker: bobbie
          text: 我想，也许您能帮我把它修好。因为您是工程师，您一定懂这个。
    - id: ch05
      title: 比尔、吉姆和修好的机车
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 司机说，要不是自己活见了鬼，那才真叫见鬼。
        - id: ch05-b02
          speaker: jim
          text: 这要还不叫见鬼，那可真是活见鬼了。
        - id: ch05-b03
          speaker: narrator
          text: 不过，比尔还是接过玩具机车，仔细看了看。吉姆也停下铲煤，凑过来瞧了一会儿。
        - id: ch05-b04
          speaker: bill
          text: 你这小姑娘，脸皮可真不薄。你怎么会觉得，我们愿意花工夫摆弄这么个不值钱的小玩具？
        - id: ch05-b05
          speaker: bobbie
          text: 我不是故意要厚脸皮。我只是觉得，所有跟铁路有关的人都那么好心，那么善良，您大概不会介意。其实您并不介意，对不对？
        - id: ch05-b06
          speaker: narrator
          text: 她看见两个男人互相使了个眼色。那眼色里并没有恶意。
        - id: ch05-b07
          speaker: bill
          text: 我的活儿是开机车，不是修机车，尤其不是修这种尺寸不对的机车。眼下还有个难题，怎么把你送回那些伤心的亲友身边，让大家原谅你，再把这件事忘得干干净净？
        - id: ch05-b08
          speaker: bobbie
          text: 到下一站，您让我下车就行。再请您借我一点钱，买一张三等车票。我一定会还，拿我的名誉保证。我不是报纸上说的那种骗子，真的不是。
        - id: ch05-b09
          speaker: narrator
          text: 她说得很坚定，两只手紧紧握在一起，心却在胳膊底下怦怦直跳。
        - id: ch05-b10
          speaker: bill
          text: 从头到脚，都是个小淑女。放心吧，我们一定把你平平安安送回家。至于这辆小机车……吉姆，你有没有哪个朋友会用焊烙铁？我看这小坏蛋焊一下就能好。
        - id: ch05-b11
          speaker: bobbie
          text: 我爸爸也是这么说的。那个东西是做什么用的？
        - id: ch05-b12
          speaker: narrator
          text: 她指着比尔说话时转动的一只黄铜小轮。
        - id: ch05-b13
          speaker: bill
          text: 那是注水器。
        - id: ch05-b14
          speaker: bobbie
          text: 注……什么？
        - id: ch05-b15
          speaker: bill
          text: 注水器。给锅炉加水用的。
        - id: ch05-b16
          speaker: bobbie
          text: 哦，真有意思。
        - id: ch05-b17
          speaker: narrator
          text: 博比把这个名字牢牢记住，好回去告诉彼得和菲莉丝。
        - id: ch05-b18
          speaker: bill
          text: 这个呢，是自动制动器。只要拨一下这根小手柄，一根手指就拨得动，火车马上就会停下来。报纸上管这个叫“科学的力量”。
        - id: ch05-b19
          speaker: narrator
          text: 比尔又指给她看两只像钟面的表盘。一只告诉司机用了多少蒸汽，另一只告诉他制动器是不是好好地工作。
        - id: ch05-b20
          speaker: narrator
          text: 后来，博比又看着比尔用一根闪闪发亮的钢制大手柄关掉蒸汽。这时，她对机车里面怎样运转的了解，已经远远超过了从前的想象。
        - id: ch05-b21
          speaker: narrator
          text: 吉姆答应，一定让他二表亲的妻子的兄弟把玩具机车焊好，不修好绝不罢休。除了学到这一大堆新知识，博比还觉得，自己已经跟比尔和吉姆成了一辈子的朋友。至于她不请自来、掉进煤水车里那堆神圣煤炭的过错，两人也已经彻底、永远地原谅了她。
        - id: ch05-b22
          speaker: narrator
          text: 到了斯塔克尔普尔枢纽站，他们热热闹闹地互相道别。比尔和吉姆把她交给一班返程火车的列车员。那位列车员也是他们的朋友。
        - id: ch05-b23
          speaker: narrator
          text: 博比特别高兴，因为她终于知道，列车员待在那片神秘的地方时究竟做些什么。她还明白了，如果有人拉动车厢里的通信绳，列车员鼻子底下的一只轮子就会转起来，耳边也会响起一阵很大的铃声。
        - id: ch05-b24
          speaker: bobbie
          text: 您的守车里为什么有这么重的鱼腥味？
        - id: ch05-b25
          speaker: guard
          text: 因为我每天都要运好多鱼。你看，波纹地板凹槽里的那些水，都是从一箱箱鱼里淌出来的。有欧鲽、鳕鱼、鲭鱼、鳎鱼，还有胡瓜鱼。
        - id: ch05-b26
          speaker: narrator
          text: 博比及时赶回家喝下午茶。自从跟大家分开以后，她脑袋里一下装进了这么多新鲜事，简直快要撑破了。她真是说不出的感激厨房门边那枚扯破裙子的钉子。
        - id: ch05-b27
          speakers: [peter, phyllis]
          ensemble: duo
          text: 你去哪儿了？
        - id: ch05-b28
          speaker: bobbie
          text: 当然是车站。
        - id: ch05-b29
          speaker: narrator
          text: 可她一个字也不肯透露自己的奇遇。她一直等到约好的那一天。下午三点十九分那班火车经过时，她神神秘秘地带着彼得和菲莉丝来到车站，骄傲地把自己的朋友比尔和吉姆介绍给他们。
        - id: ch05-b30
          speaker: narrator
          text: 吉姆二表亲的妻子的兄弟没有辜负大家交给他的神圣任务。那辆玩具机车真的修好了，简直跟新的一样。
        - id: ch05-b31
          speaker: bobbie
          text: 再见！哦，再见！我会永远、永远爱你们，也会永远爱吉姆二表亲的妻子的兄弟！
          emotion: happy
        - id: ch05-b32
          speaker: narrator
          text: 接着，真正的机车也尖叫着喊出了它自己的“再见”。三个孩子沿着山坡往家走。彼得紧紧抱住那辆完全恢复原样的小机车。博比心里欢跃极了，一路给他们讲自己是怎样当了一回机车窃贼。
