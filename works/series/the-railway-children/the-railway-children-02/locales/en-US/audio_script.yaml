  chapters:
    - id: ch01
      title: "Chapter II. Peter's coal-mine."
      blocks:
        - id: ch01-b01
          speaker: mother
          text: "Well, that was fun! Those poor mice must have been terrified. I really don't think they were rats."
        - id: ch01-b02
          speaker: narrator
          text: "In the dark, Mother felt across the table for the matches. She struck one and lit the candle again. In its small, unsteady glow, they all looked at one another."
        - id: ch01-b03
          speaker: mother
          text: "You've always wanted something to happen, and now something has. This is quite an adventure, don't you think? I asked Mrs. Viney to buy bread and butter and meat, and to have supper waiting. She must have put it in the dining room. Let's go see."
        - id: ch01-b04
          speaker: narrator
          text: "The dining room opened off the kitchen. With only one candle, it seemed much darker. The kitchen walls were white, but here dark wood covered the walls from floor to ceiling, with thick black beams overhead. Their old breakfast-room furniture stood everywhere in a dusty jumble. It had come from the home where the children had lived all their lives, though that home already felt very far away and long ago. There was a table. There were chairs. But there was no supper."
        - id: ch01-b05
          speaker: mother
          text: "We'll try the other rooms."
        - id: ch01-b06
          speaker: narrator
          text: "They searched them all. Each held the same half-finished muddle of furniture, fireplace tools, dishes, and odd things scattered across the floor. Not one room held anything to eat. Even the pantry offered only a rusty cake tin and a broken plate with whitening mixed in it."
        - id: ch01-b07
          speaker: mother
          text: "What a horrid old woman! She's taken our money and gone away without buying us a thing."
        - id: ch01-b08
          speaker: phyllis
          text: "Does that mean we won't have any supper?"
        - id: ch01-b09
          speaker: narrator
          text: "Phyllis stepped back in dismay, right onto a soap dish. It cracked beneath her foot."
        - id: ch01-b10
          speaker: mother
          text: "Of course we'll have supper. We'll just have to open one of the big cases in the cellar. Phil, sweetheart, watch where you step. Peter, you carry the light."
        - id: ch01-b11
          speaker: narrator
          text: "The cellar door was in the kitchen. Five wooden steps led down, though the place hardly seemed like a real cellar because its ceiling rose as high as the kitchen's. A bacon rack hung above them. There was wood, there was coal, and there were the big packing cases. Peter tilted the candle to one side while Mother tried to open the largest case. It had been nailed down very securely."
        - id: ch01-b12
          speaker: peter
          text: "Where's the hammer?"
        - id: ch01-b13
          speaker: mother
          text: "That's the trouble. I think the hammer is inside the box. But we do have a coal shovel and the kitchen poker."
        - id: ch01-b14
          speaker: narrator
          text: "She went to work with those instead."
        - id: ch01-b15
          speaker: peter
          text: "Here, let me try."
        - id: ch01-b16
          speaker: narrator
          text: "Peter was sure he could do it better. People often feel that way when they watch someone else stir a fire, open a box, or struggle with a knot."
        - id: ch01-b17
          speaker: roberta
          text: "You'll hurt your hands, Mammy. Let me do it."
        - id: ch01-b18
          speaker: phyllis
          text: "I wish Father were here. He'd have it open in no time. Bobbie, why are you kicking me?"
        - id: ch01-b19
          speaker: roberta
          text: "I'm not!"
        - id: ch01-b20
          speaker: narrator
          text: "At that moment, the first long nail came out with a crunch. Mother pried up one strip of wood, then another, until four of them stood upright. In the candlelight, the long nails shone like fierce iron teeth."
        - id: ch01-b21
          speaker: mother
          text: "Hooray! Candles, right on top! Girls, go light them. Find some saucers, drip a little wax into each one, and stand a candle in it."
          emotion: happy
        - id: ch01-b22
          speaker: phyllis
          text: "How many can we light?"
        - id: ch01-b23
          speaker: mother
          text: "As many as you want. The important thing is to stay cheerful, and nobody can be cheerful in the dark except owls and dormice."
          emotion: happy
        - id: ch01-b24
          speaker: narrator
          text: "The girls began lighting candles. The head flew off their first match and stuck to Phyllis's finger. Bobbie pointed out that it was only a tiny burn. Phyllis might have lived in the days when Roman martyrs were fashionable, and then she could have been burned all over. That would have been much worse. Soon fourteen candles shone in the dining room. Once they were all burning steadily in their saucers, Bobbie went down for coal and wood and built a fire."
        - id: ch01-b25
          speaker: roberta
          text: "It's awfully cold for May."
        - id: ch01-b26
          speaker: narrator
          text: "She felt quite grown-up saying it. Firelight and candlelight changed the whole room. Now they could see little wreaths and loops carved into the dark wooden walls. The girls hurried to tidy. That meant pushing the chairs against the wall, piling every loose object into a corner, and hiding part of the pile behind Father's big leather armchair. He used to sit there after dinner."
        - id: ch01-b27
          speaker: mother
          text: "Bravo! Now this looks like something. I'll find a tablecloth, and then we'll be ready."
          emotion: happy
        - id: ch01-b28
          speaker: narrator
          text: "The tablecloth was in a box with a proper lock. That box opened with a key, not a shovel. Once the cloth was spread, Mother laid out a true feast. Everyone was terribly tired, but the sight of that strange and wonderful supper cheered them. They had two kinds of crackers, sardines, preserved ginger, cooking raisins, candied peel, and marmalade."
        - id: ch01-b29
          speaker: mother
          text: "Thank goodness Aunt Emma packed all those odds and ends from the pantry. Phil, please don't put the marmalade spoon in with the sardines."
        - id: ch01-b30
          speaker: phyllis
          text: "I won't, Mother."
        - id: ch01-b31
          speaker: narrator
          text: "Phyllis put the spoon down among the plain crackers instead."
        - id: ch01-b32
          speaker: roberta
          text: "Let's drink to Aunt Emma. What would we have done if she hadn't packed all this food? To Aunt Emma!"
        - id: ch01-b33
          speaker: narrator
          text: "They drank the toast in ginger wine and water from blue-and-white teacups, since nobody could find the glasses. They began to feel they had judged Aunt Emma too harshly. She was not warm and cuddly like Mother, but she had remembered to pack the spare food. She had also made sure all the sheets were aired. The movers had assembled the bed frames, so it did not take long to make the beds."
        - id: ch01-b34
          speaker: mother
          text: "Good night, chickies. I'm sure there aren't any rats. I'll leave my door open. If a mouse comes, just scream, and I'll come tell it exactly what I think of it."
        - id: ch01-b35
          speaker: narrator
          text: "Mother went to her room. Much later, Bobbie woke when the little travel clock chimed two. Its chime always sounded to her like a church clock far away. She could still hear Mother moving around in her own room. The next morning, Bobbie gently pulled Phyllis's hair. She pulled just hard enough to wake her."
        - id: ch01-b36
          speaker: phyllis
          text: "What's the matter?"
        - id: ch01-b37
          speaker: narrator
          text: "Phyllis was barely awake."
        - id: ch01-b38
          speaker: roberta
          text: "Wake up! We're in the new house, remember? There aren't any servants. Let's get dressed, creep downstairs as quietly as mice, and make everything beautiful before Mother wakes up. I already woke Peter. He'll be ready when we are."
        - id: ch01-b39
          speaker: narrator
          text: "The girls dressed quickly and quietly. There was no water in their room, so outside they washed as much as they thought necessary under the yard pump. One pumped while the other washed. It was splashy, but interesting."
        - id: ch01-b40
          speaker: roberta
          text: "This is much more fun than washing in a basin. Look how the weeds sparkle between the stones! And there's moss on the roof. Oh, look at all those flowers!"
        - id: ch01-b41
          speaker: narrator
          text: "The thatched roof of the back kitchen sloped down low. Moss grew across it, along with houseleeks, stonecrop, wallflowers, and even a clump of purple iris at the far corner."
        - id: ch01-b42
          speaker: phyllis
          text: "This is so much prettier than Edgecombe Villa. I wonder what the garden looks like."
        - id: ch01-b43
          speaker: roberta
          text: "We can't think about the garden yet. We need to go inside and get to work."
        - id: ch01-b44
          speaker: narrator
          text: "They lit the fire, set the kettle on it, and arranged dishes for breakfast. They could not find all the proper things. Still, a glass ashtray worked nicely for the salt, and a fairly new baking pan could hold the bread, if they had any bread. When they could think of nothing else to do, the three children stepped back into the fresh, bright morning."
        - id: ch01-b45
          speaker: peter
          text: "Now let's find the garden."
        - id: ch01-b46
          speaker: narrator
          text: "Somehow, they couldn't find it. They went all the way around the house. The yard lay behind it, with stables and outbuildings on the far side. On the other three sides, the house stood directly in a field, with only short, smooth grass around it. Yet they were certain they had seen a garden wall the night before. The land rose and fell in hills. Below them lay the railway line and the black, open mouth of a tunnel. The station was hidden from sight. At one end of the valley, a great bridge crossed on tall arches."
        - id: ch01-b47
          speaker: peter
          text: "Forget the garden. Let's go down to the railway. A train might come by."
        - id: ch01-b48
          speaker: roberta
          text: "We can see the trains from here. Let's sit down for a minute."
        - id: ch01-b49
          speaker: narrator
          text: "They settled on a broad, flat gray stone that pushed up through the grass. Many stones like it lay across the hillside. The children meant to rest only a little while. At eight o'clock, Mother came outside looking for them. She found all three fast asleep in one contented bundle, warm in the sun. They had built an excellent fire and put the kettle on at about half past five. That had seemed very useful at the time. By eight, though, the fire had been out for quite a while. Every drop of water had boiled away, and the bottom had burned out of the kettle. They had also set the breakfast table without first washing any of the dishes."
        - id: ch01-b50
          speaker: mother
          text: "The cups and saucers don't matter. I've found another room! I had completely forgotten it was there, and it's like magic. I boiled water for tea in a saucepan."
        - id: ch01-b51
          speaker: narrator
          text: "The forgotten room opened off the kitchen. In the confusion and dim light of the night before, they had mistaken its door for a cupboard. It was a small square room. On the table, neatly arranged, stood cold roast beef, bread, butter, cheese, and a pie."
        - id: ch01-b52
          speaker: peter
          text: "Pie for breakfast! That's absolutely splendid!"
          emotion: happy
        - id: ch01-b53
          speaker: mother
          text: "It's only apple, not pigeon pie. This is the supper we were meant to eat last night. Mrs. Viney left a note. Her son-in-law broke his arm, so she had to go home early. She'll be here at ten this morning."
        - id: ch01-b54
          speaker: narrator
          text: "It was a marvelous breakfast. Apple pie is not the usual way to start a day, but all three children said they preferred it to meat."
        - id: ch01-b55
          speaker: peter
          text: "It feels more like dinner than breakfast to us. We got up so early."
        - id: ch01-b56
          speaker: narrator
          text: "He passed his plate for another piece. The day went by as they helped Mother unpack and put the house in order. Six small legs ached from running back and forth, carrying clothes, dishes, and all kinds of things to their proper places. Late in the afternoon, Mother finally stopped."
        - id: ch01-b57
          speaker: mother
          text: "There, that's enough for today. I'll lie down for an hour, and then I'll be as fresh as a lark by suppertime."
        - id: ch01-b58
          speaker: narrator
          text: "The children looked at one another. All three faces held the same question and the same answer. Where should they go? To the railway. They had barely set out when they discovered where the garden had been hiding. It stood behind the stables, enclosed by a high wall."
        - id: ch01-b59
          speaker: peter
          text: "Never mind the garden now! Mother told me this morning where it was. It'll still be here tomorrow. Come on, let's get to the railway."
        - id: ch01-b60
          speaker: narrator
          text: "They followed the hill downward over close, smooth grass. Here and there, thorny bushes and gray and yellow rocks poked through, like bits of candied peel on top of a cake. The slope ended in one steep run and a wooden fence. Beyond it lay the railway, with shining rails, telegraph poles and wires, and signals. The children climbed onto the fence. Then a rumble made them turn toward the dark tunnel cut into the rocky cliff. A train burst from its mouth with a shriek and a snort. It rushed past in a roar. The children felt the force of it, while pebbles leaped and rattled beneath the wheels."
        - id: ch01-b61
          speaker: roberta
          text: "Oh! It was like a huge dragon tearing past us. Did you feel its hot wings fan our faces?"
          emotion: surprised
        - id: ch01-b62
          speaker: phyllis
          text: "A dragon's cave might look just like that tunnel from the outside."
        - id: ch01-b63
          speaker: peter
          text: "I never imagined we'd get this close to a train. This is the best sport ever!"
          emotion: happy
        - id: ch01-b64
          speaker: roberta
          text: "Better than toy trains, isn't it?"
        - id: ch01-b65
          speaker: narrator
          text: "From then on, we may as well call Roberta what everyone else called her: Bobbie."
        - id: ch01-b66
          speaker: peter
          text: "I don't know. It's different. Seeing the whole train at once is so strange. It's much taller than I thought."
        - id: ch01-b67
          speaker: phyllis
          text: "At stations, the platforms always cut off the bottom half."
        - id: ch01-b68
          speaker: roberta
          text: "I wonder if that train was going to London. Father's in London."
        - id: ch01-b69
          speaker: peter
          text: "Let's walk to the station and ask."
        - id: ch01-b70
          speaker: narrator
          text: "So they did. They followed the edge of the line beneath the humming telegraph wires. From inside a train, the distance from one pole to the next always seems tiny. The poles appear to race up and catch the wires, one after another, almost faster than you can count. When you walk that same distance, the poles seem few and very far apart. At last, the children reached the station. They had never visited one except to catch a train or wait for one. A grown-up had always been with them, and grown-ups were not interested in stations. They only thought of stations as places they wanted to leave. This time was different. The children could go close to the signal box, study all its wires, and hear a mysterious ping-ping followed by the strong, solid click of machinery. Even the wooden ties beneath the rails made a wonderful path. They were spaced just right for Bobbie to turn them into stepping-stones across an imaginary foaming river. Instead of entering through the ticket office, the children scrambled up the sloped end of the platform like freebooters. That alone was a delight. So was peeking into the porters' room, with its lamps, its railway calendar on the wall, and a porter half asleep behind a newspaper."
        - id: ch01-b71
          speaker: narrator
          text: "Many tracks crossed one another at the station. A few ran into the yard and stopped short. They looked as if they had grown tired of railway business and planned to retire forever. Freight cars waited on the rails. Off to one side rose a great heap of coal. It was nothing like the loose pile in the children's cellar. This one had large square chunks set around the outside like bricks. They had been built up until the heap looked like one of the dark cities in their Bible storybook. Near the top of that coal wall, someone had painted a white line. After a while, a bell above the station door gave the same tingling ring twice. The porter came lounging out of his room. Peter wished him good day in his very best manner, then hurried to ask what the white mark meant."
        - id: ch01-b72
          speaker: peter
          text: "Excuse me, what is that white line around the coal for?"
        - id: ch01-b73
          speaker: porter
          text: "Shows us how much coal is there. That way we'll know if anybody steals some. So don't you go filling your pockets, young gentleman!"
        - id: ch01-b74
          speaker: narrator
          text: "At the time, it sounded like nothing more than a joke. Peter decided the porter was friendly and sensible. Later, though, those words would return with a very different meaning. Think of a great bowl of bread dough rising beside a farmhouse fire. When you are young enough to be interested in everything, it is almost impossible not to poke that soft round surface. Your finger leaves a deep dent, but slowly and surely the dent fills in. Soon the dough looks just as it did before, unless your hand was dirty enough to leave a black mark. The children's sorrow over Father going away, and over Mother's unhappiness, was rather like that. It had made a deep mark, but the mark did not stay deep for long."
        - id: ch01-b75
          speaker: narrator
          text: "They grew used to life without Father, though they never forgot him. They grew used to having no school. They even grew used to seeing very little of Mother. Most days she stayed shut in her upstairs room, writing and writing and writing. At teatime she came down and read aloud the stories she had made. They were lovely stories, and that daily reading was part of their new life. Everything around the children still felt new and perfectly delightful. There were rocks to climb over, hills and valleys to explore, and trees everywhere. There was the canal, too. Above all, there was the railway. With so many new things filling their days, the memory of their old life in the villa began to feel almost like a dream."
        - id: ch01-b76
          speaker: narrator
          text: "Mother had told them more than once that they were quite poor now. It did not seem to mean much. The children thought it might be one of those remarks grown-ups make simply because they want to say something. Even mothers sometimes said things that did not seem to mean anything in particular. There was always enough food on the table, and the children still wore the same kind of nice clothes they had always worn. Nothing in their daily lives had yet explained what being poor meant. Then June brought three wet days. Rain fell straight and sharp as spears, and the air turned bitterly cold. No one could go outside. Everyone shivered. At last, all three children climbed to Mother's door and knocked."
        - id: ch01-b77
          speaker: mother
          text: "What is it?"
        - id: ch01-b78
          speaker: roberta
          text: "Mother, may I make a fire? I really do know how."
        - id: ch01-b79
          speaker: mother
          text: "No, my ducky-love. We can't have fires in June because coal costs so much. If you're cold, have a good romp in the attic. That will warm you up."
        - id: ch01-b80
          speaker: roberta
          text: "But it takes hardly any coal to make one little fire."
        - id: ch01-b81
          speaker: mother
          text: "Even that is more than we can afford, chickeny-love. Run along now, my darlings. I'm terribly busy."
        - id: ch01-b82
          speaker: phyllis
          text: "Mother is always busy now."
        - id: ch01-b83
          speaker: narrator
          text: "She whispered it to Peter. He did not answer. He only shrugged, because he was thinking. Still, serious thought could not keep him from furnishing a bandit's hideout in the attic for very long. Peter became the chief bandit, of course. Bobbie served as his lieutenant and also as his entire loyal band of robbers. Phyllis was the maiden they captured. Then, when the story required it, Bobbie changed roles and became the captured girl's parent. She paid the bandits a magnificent ransom made entirely of horse beans, and they accepted it without hesitation. By teatime the three children were as flushed and delighted as any band of mountain outlaws. Phyllis reached to spread jam on her bread and butter."
        - id: ch01-b84
          speaker: mother
          text: "Jam or butter, dear. Not both. We can't afford that kind of wild luxury anymore."
        - id: ch01-b85
          speaker: narrator
          text: "Without speaking, Phyllis finished the bread and butter. Then she ate another piece with jam. Peter drank his weak tea and kept thinking. After tea, the children returned to the attic."
        - id: ch01-b86
          speaker: peter
          text: "I've got an idea."
        - id: ch01-b87
          speakers: [roberta, phyllis]
          ensemble: duo
          text: "What is it?"
        - id: ch01-b88
          speaker: peter
          text: "I'm not telling you."
        - id: ch01-b89
          speaker: roberta
          text: "Fine, then."
        - id: ch01-b90
          speaker: phyllis
          text: "Don't tell us."
        - id: ch01-b91
          speaker: peter
          text: "Girls always lose their tempers so quickly."
        - id: ch01-b92
          speaker: roberta
          text: "Oh, and boys don't? I don't care about your silly idea anyway."
        - id: ch01-b93
          speaker: peter
          text: "You'll find out someday. If you hadn't been so eager to quarrel, I might have explained that I'm only keeping quiet because I'm noble. But now you won't hear one word about it. There!"
        - id: ch01-b94
          speaker: narrator
          text: "By what looked very much like a miracle, Peter managed to keep his own temper. It took the girls quite a while to persuade him to speak again, and even then he told them very little."
        - id: ch01-b95
          speaker: peter
          text: "I'm not telling you what I plan to do because it might be wrong. I don't want to pull you into it with me."
        - id: ch01-b96
          speaker: roberta
          text: "If it might be wrong, don't do it, Peter. Let me do it instead."
        - id: ch01-b97
          speaker: phyllis
          text: "I'd like to do something wrong if you're going to do it!"
        - id: ch01-b98
          speaker: narrator
          text: "Her loyalty touched Peter."
        - id: ch01-b99
          speaker: peter
          text: "No. It's a desperate mission, and I'm going to lead it. I only ask one thing. If Mother wants to know where I am, don't give me away."
        - id: ch01-b100
          speaker: roberta
          text: "We don't know anything to give away!"
        - id: ch01-b101
          speaker: peter
          text: "Yes, you do. I've trusted you with my life. You know I'm going on an adventure alone, and some people might call it wrong, though I don't. If Mother asks, tell her I'm playing at mines."
        - id: ch01-b102
          speaker: phyllis
          text: "What kind of mines?"
        - id: ch01-b103
          speaker: peter
          text: "Just say mines."
        - id: ch01-b104
          speaker: roberta
          text: "You could at least tell us, Pete."
        - id: ch01-b105
          speaker: peter
          text: "All right. Coal mines. But don't breathe that word to anyone, even under torture."
        - id: ch01-b106
          speaker: roberta
          text: "You don't have to threaten us. And you really ought to let us help."
        - id: ch01-b107
          speaker: peter
          text: "If I discover a coal mine, I'll allow you to help haul the coal."
        - id: ch01-b108
          speaker: phyllis
          text: "Keep your secret if you want."
        - id: ch01-b109
          speaker: roberta
          text: "If you can keep it."
        - id: ch01-b110
          speaker: peter
          text: "I can keep it perfectly well."
        - id: ch01-b111
          speaker: narrator
          text: "Even in families that arrange their meals as greedily as possible, there is a stretch of time between tea and supper. Mother usually spent it writing, and Mrs. Viney had gone home. Two evenings after Peter's idea first came to him, he gave his sisters a mysterious signal in the twilight."
        - id: ch01-b112
          speaker: peter
          text: "Come with me, and bring the Roman Chariot."
        - id: ch01-b113
          speaker: narrator
          text: "The Roman Chariot was actually a very old baby carriage. It had spent years resting in the loft above the coach house. The children had oiled all its moving parts until it rolled as quietly as a bicycle with air-filled tires and steered as well as it must have in its finest days."
        - id: ch01-b114
          speaker: peter
          text: "Follow your fearless leader."
        - id: ch01-b115
          speaker: narrator
          text: "He marched down the hill toward the station. Just above it, rocks pushed their heads through the grass as though they, too, wanted to watch the railway. In a hollow between three rocks lay a pile of dry brambles and heather. Peter stopped and turned the brush aside with his battered boot. Beneath it was coal."
        - id: ch01-b116
          speaker: peter
          text: "Behold the first coal from Saint Peter's Mine! We'll carry it home in the chariot. Prompt service and speedy delivery. Every piece cut to the shape our regular customers require."
        - id: ch01-b117
          speaker: narrator
          text: "They packed the old carriage full of coal, right up to the top. Once it was loaded, they discovered that they could not move it up the hill. All three pushed and pulled, but it was much too heavy. So they unloaded the whole thing and tried again with less coal. Peter even fastened his suspenders to the handle and made himself into a sort of harness horse. With one hand he held tightly to his waistband, while he leaned forward and pulled with all his strength. Bobbie and Phyllis pushed from behind. Even that was not enough for a full load. In the end, they had to make three separate journeys before all the coal from Saint Peter's Mine had joined Mother's coal in the cellar. After that, Peter began going out alone. He would return very black with coal dust and very mysterious about what he had done."
        - id: ch01-b118
          speaker: peter
          text: "I've been working in my mine. Tomorrow evening, we'll bring another load of black diamonds home in the chariot."
        - id: ch01-b119
          speaker: narrator
          text: "A week later, Mrs. Viney told Mother how wonderfully long the latest supply of coal seemed to be lasting. The children were listening from the stairs. They hugged themselves and one another, twisting around in silent laughter. By now, all three had forgotten that Peter had ever wondered whether his coal mining might be wrong."
        - id: ch01-b120
          speaker: narrator
          text: "Then came a dreadful night. The Station Master put on an old pair of canvas shoes that he had worn by the sea during his summer vacation. Quietly, he crept into the yard where the great walled heap of coal stood, with its white line running around the top. He waited like a cat beside a mouse hole. Up on the heap, something small and dark scraped and rattled secretly among the coal. The Station Master slipped into the shadow of a brake van. It had a little metal chimney. Letters and numbers covered its side, along with an order that it must be returned at once to White Heather Sidings. Hidden in the shadow, he waited. At last, the small figure on top stopped scraping. It crept to the edge of the heap, carefully lowered itself to the ground, and then pulled something down after it. The Station Master's arm rose. His hand dropped onto a collar. There stood Peter, held firmly by the back of his jacket. In one trembling hand, he clutched an old carpenter's bag filled with coal."
        - id: ch01-b121
          speaker: station_master
          text: "So I've finally caught you, have I? You young thief!"
          emotion: angry
        - id: ch01-b122
          speaker: peter
          text: "I'm not a thief. I'm a coal miner."
        - id: ch01-b123
          speaker: narrator
          text: "He made his voice as firm as he could."
        - id: ch01-b124
          speaker: station_master
          text: "You can tell that story to the Marines."
        - id: ch01-b125
          speaker: peter
          text: "It would be true no matter who I told."
        - id: ch01-b126
          speaker: station_master
          text: "True enough. Now stop talking, you little rascal, and come with me to the station."
        - id: ch01-b127
          speaker: roberta
          text: "Oh, no!"
          emotion: fearful
        - id: ch01-b128
          speaker: narrator
          text: "The agonized voice came from the darkness, and it was not Peter's."
        - id: ch01-b129
          speaker: phyllis
          text: "You don't mean the police station!"
          emotion: fearful
        - id: ch01-b130
          speaker: station_master
          text: "Not yet. First, the railway station. Why, there's a whole gang of you! Anyone else hiding out there?"
        - id: ch01-b131
          speakers: [roberta, phyllis]
          ensemble: duo
          text: "Only us."
        - id: ch01-b132
          speaker: narrator
          text: "Bobbie and Phyllis stepped from behind another freight car. White chalk on its side said it was wanted on Number One Road."
        - id: ch01-b133
          speaker: peter
          text: "What do you mean, sneaking after me and spying?"
          emotion: angry
        - id: ch01-b134
          speaker: station_master
          text: "It was high time somebody spied on you, if you ask me. Now come along."
        - id: ch01-b135
          speaker: roberta
          text: "Please don't take us away! Can't you decide what to do right here? It's just as much our fault as Peter's. We helped carry the coal, and we knew where he was getting it."
          emotion: fearful
        - id: ch01-b136
          speaker: peter
          text: "No, you didn't."
        - id: ch01-b137
          speaker: roberta
          text: "Yes, we did. We knew the whole time. We only acted as if we didn't because we were humoring you."
        - id: ch01-b138
          speaker: narrator
          text: "That was the last blow Peter could bear. He had dug for coal, found coal, and been caught with coal. Now he discovered that his sisters had been humoring him all along."
        - id: ch01-b139
          speaker: peter
          text: "Let go of me. I won't run away."
        - id: ch01-b140
          speaker: narrator
          text: "The Station Master released Peter's collar. He struck a match and studied all three faces in its wavering light."
        - id: ch01-b141
          speaker: station_master
          text: "Why, you're the children from Three Chimneys up on the hill. And you're dressed so nicely, too. Tell me, what made you do this? Haven't you been taught at church or learned your catechism? Don't you know stealing is wicked?"
        - id: ch01-b142
          speaker: narrator
          text: "His voice had grown much gentler."
        - id: ch01-b143
          speaker: peter
          text: "I didn't think it was stealing. I wasn't completely sure, but I thought taking coal from the outside might be stealing. The coal in the middle seemed different. I thought that could honestly count as mining. You'd need thousands of years to burn all that coal before you ever reached the middle."
        - id: ch01-b144
          speaker: station_master
          text: "Not quite thousands. But were you doing it for fun, or what?"
        - id: ch01-b145
          speaker: peter
          text: "There was nothing fun about hauling that horrible heavy coal up the hill."
        - id: ch01-b146
          speaker: station_master
          text: "Then why take it?"
        - id: ch01-b147
          speaker: narrator
          text: "The Station Master sounded so much kinder now that Peter answered him."
        - id: ch01-b148
          speaker: peter
          text: "Remember that wet day? Mother said we were too poor to have a fire. At our old house, we always had fires when the weather was cold, and..."
        - id: ch01-b149
          speaker: roberta
          text: "Don't, Peter."
        - id: ch01-b150
          speaker: narrator
          text: "She spoke in a whisper. The Station Master rubbed his chin and thought."
        - id: ch01-b151
          speaker: station_master
          text: "Here's what I'll do. I'll let it go this once. But remember this, young gentleman. Stealing is stealing. What belongs to me does not belong to you, no matter whether you call it mining. Now run along home."
        - id: ch01-b152
          speaker: peter
          text: "You mean you aren't going to punish us? You're a real brick!"
          emotion: surprised
        - id: ch01-b153
          speaker: roberta
          text: "You're wonderful."
          emotion: happy
        - id: ch01-b154
          speaker: phyllis
          text: "You're a darling!"
          emotion: happy
        - id: ch01-b155
          speaker: station_master
          text: "That's all right."
        - id: ch01-b156
          speaker: narrator
          text: "And with that, they parted."
        - id: ch01-b157
          speaker: peter
          text: "Don't talk to me. You're both spies and traitors. That's what you are."
          emotion: angry
        - id: ch01-b158
          speaker: narrator
          text: "The girls did not mind very much. They were too relieved to have Peter safely between them, free and walking home to Three Chimneys instead of being taken to the police station."
        - id: ch01-b159
          speaker: roberta
          text: "We did tell him it was just as much our fault."
        - id: ch01-b160
          speaker: narrator
          text: "She said it gently."
        - id: ch01-b161
          speaker: peter
          text: "But it wasn't."
        - id: ch01-b162
          speaker: phyllis
          text: "A court and a judge would have treated us the same. Don't be cross, Peter. It isn't our fault that your secrets are so easy to discover."
        - id: ch01-b163
          speaker: narrator
          text: "She slipped her hand through his arm, and he allowed it."
        - id: ch01-b164
          speaker: peter
          text: "Anyway, there's an awful lot of coal in the cellar now."
        - id: ch01-b165
          speaker: roberta
          text: "Oh, Peter, no. I don't think we should be glad about that."
        - id: ch01-b166
          speaker: peter
          text: "I don't know. Even now, I'm not entirely convinced that mining is a crime."
        - id: ch01-b167
          speaker: narrator
          text: "The girls were entirely convinced. They were also entirely convinced that Peter was, too, however little he wished to admit it."
