audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，含蓄地带一点幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    roberta:
      display_name: 罗伯塔
      tts:
        delivery: 敏感体贴，认真而克制
        timbre: 清亮柔和的少女声
        pace: 自然，情急时稍快
        pitch: 中高音
    peter:
      display_name: 彼得
      tts:
        delivery: 直率好强，活泼中带孩子气的逞强
        timbre: 明亮的男孩声
        pace: 利落，激动时加快
        pitch: 中高音
    phyllis:
      display_name: 菲莉丝
      tts:
        delivery: 天真坦率，好心又略显冒失
        timbre: 轻快稚嫩的女孩声
        pace: 轻快自然
        pitch: 高音
    mother:
      display_name: 妈妈
      tts:
        delivery: 慈爱温柔，困顿时仍努力镇定
        timbre: 温润清晰的成年女声
        pace: 从容舒缓
        pitch: 中音
    porter:
      display_name: 搬运工
      tts:
        delivery: 爽快随和，带一点逗孩子的口气
        timbre: 朴实明亮的成年男声
        pace: 不紧不慢
        pitch: 中低音
    station_master:
      display_name: 站长
      tts:
        delivery: 威严干练，严厉中不失宽厚
        timbre: 浑厚清晰的成年男声
        pace: 稳健有力
        pitch: 中低音
  chapters:
    - id: ch01
      title: 黑暗里的第一顿晚饭
      blocks:
        - id: ch01-b01
          speaker: mother
          text: 真有意思！那些可怜的老鼠准是吓坏了。不过我看，它们根本不是什么大耗子。
        - id: ch01-b02
          speaker: narrator
          text: 妈妈在黑暗里摸到火柴，划亮一根，重新点上蜡烛。刚才厨房里有老鼠乱跑，孩子们还以为来了大耗子。现在大家借着忽明忽暗的光互相看了看，总算看清彼此都好好的。
        - id: ch01-b03
          speaker: mother
          text: 好啦，你们不是总盼着遇上点事情吗？这下真的遇上了，也算一场冒险吧？我叫维尼太太买了面包、黄油、肉和别的吃食，还请她预备好晚饭。我想，饭一定已经摆在餐厅里了。我们去瞧瞧。
        - id: ch01-b04
          speaker: narrator
          text: 餐厅连着厨房。他们举着唯一的一支蜡烛走进去，只觉得里面更黑。厨房的墙雪白，餐厅却从地板到天花板都镶着深色木板，头顶还压着粗重的黑梁。旧家早餐室搬来的家具蒙着灰，东一件西一件，摆得像迷宫。那个从出生起就住着的家，好像一下子离他们很远了。桌子和椅子倒都在，晚饭却没影儿。
        - id: ch01-b05
          speaker: mother
          text: 我们再去别的房间找找。
        - id: ch01-b06
          speaker: narrator
          text: 他们把每间屋子都找了一遍。每一间都是同样的光景，家具只胡乱摆了一半，壁炉用具、杯盘和各种零碎东西散落满地，一点吃的也没有。他们不肯死心，最后连食品储藏室也翻过了。那里只剩一只生锈的糕点盒，还有一只破盘子，盘里甚至还混着擦亮剂。
        - id: ch01-b07
          speaker: mother
          text: 这个可恶的老太婆！她准是拿了钱就走，根本没给我们买吃的。
          emotion: angry
        - id: ch01-b08
          speaker: phyllis
          text: 那我们今晚什么也吃不到了吗？
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: 菲莉丝往后一退，正好踩碎了一只肥皂碟。
        - id: ch01-b10
          speaker: mother
          text: 当然有得吃。不过我们得打开地窖里的大箱子。菲尔，走路小心点。彼得，你替我举灯。
        - id: ch01-b11
          speaker: narrator
          text: 厨房里有扇门，走下五级木阶就是地窖。可孩子们觉得，那地方屋顶跟厨房一样高，实在不像真正的地窖。顶下挂着熏肉架，四周堆着木柴、煤和几只大箱子。妈妈要开的那只箱子，盖子钉得死死的。
        - id: ch01-b12
          speaker: peter
          text: 锤子放在哪儿了？
        - id: ch01-b13
          speaker: mother
          text: 麻烦就在这儿，锤子恐怕也装进箱子了。不过这儿有煤铲，厨房里还有拨火棍。
        - id: ch01-b14
          speaker: narrator
          text: 妈妈把煤铲和拨火棍都拿来，一样一样塞进木板缝里，想把箱盖撬开。箱子很结实，工具又不趁手，这活儿做起来一点也不容易。
        - id: ch01-b15
          speaker: peter
          text: 让我来吧。
        - id: ch01-b16
          speaker: narrator
          text: 彼得认定自己一定比妈妈干得好。其实看见别人拨火、开箱子或解绳结时，人们常会这么想。
        - id: ch01-b17
          speaker: roberta
          text: 妈妈，你会把手弄伤的。换我来吧。
        - id: ch01-b18
          speaker: phyllis
          text: 要是爸爸在就好了，他一下子就能打开。博比，你为什么踢我？
        - id: ch01-b19
          speaker: roberta
          text: 我没有踢你呀。
        - id: ch01-b20
          speaker: narrator
          text: 这时，一根长钉吱嘎一响，松动了。紧接着，一条木板翘起来，又一条也翘起来。最后四条木板全竖在那里，长钉映着烛光，凶巴巴的，像一排铁牙。
        - id: ch01-b21
          speaker: mother
          text: 万岁！是蜡烛，头一样拿出来的就是我们最需要的东西！姑娘们，把蜡烛点起来。找些小碟子，滴一点烛油，再把蜡烛直直粘在上面。
          emotion: happy
        - id: ch01-b22
          speaker: roberta
          text: 要点多少支？
        - id: ch01-b23
          speaker: mother
          text: 想点多少就点多少。最要紧的是高高兴兴。黑暗里还能快活的，只有猫头鹰和睡鼠。
          emotion: happy
        - id: ch01-b24
          speaker: narrator
          text: 两个女孩动手点蜡烛。第一根火柴的火头飞到菲莉丝手指上。照罗伯塔的说法，这只算一点小烫伤。要是菲莉丝生在把这种事当时兴的年代，没准还得做个古罗马殉道者，整个人都烧掉呢。餐厅一共点亮了十四支蜡烛。罗伯塔又搬来煤和木柴，把炉火生了起来。
        - id: ch01-b25
          speaker: roberta
          text: 都五月了，怎么还这么冷。
        - id: ch01-b26
          speaker: narrator
          text: 这句话一出口，她觉得自己很像大人。火光和烛光照亮房间，深色墙面原来都是木头，有些地方还刻着小花环和垂饰。女孩们赶快“收拾”起来。她们把椅子靠墙摆好，把零碎东西堆到墙角，再用爸爸从前饭后常坐的大皮椅挡住一半。
        - id: ch01-b27
          speaker: mother
          text: 太好了！这才像个样子。我再去拿桌布，然后我们就开饭。
          emotion: happy
        - id: ch01-b28
          speaker: narrator
          text: 桌布锁在另一只正经的箱子里，那只箱子有钥匙，用不着再拿煤铲硬撬。妈妈把桌布铺到餐桌上，一顿真正的盛宴也跟着摆好了。大家忙了一整晚，本来已经累得没有力气，可一看见这顿古怪又可爱的晚饭，立刻又来了精神。桌上既有玛丽饼干，也有普通饼干，还有沙丁鱼、糖姜、做点心用的葡萄干、蜜饯果皮和橘子酱。
        - id: ch01-b29
          speaker: mother
          text: 幸亏埃玛姨妈把储藏柜里那些零碎吃食都装进来了。菲尔，别把橘子酱勺放进沙丁鱼里。
        - id: ch01-b30
          speaker: phyllis
          text: 不会的，妈妈。
        - id: ch01-b31
          speaker: narrator
          text: 她说着，把勺子搁在了玛丽饼干中间。
        - id: ch01-b32
          speaker: roberta
          text: 我们祝埃玛姨妈身体健康吧。要不是她装了这些东西，我们今晚怎么办呢？为埃玛姨妈干杯！
        - id: ch01-b33
          speaker: narrator
          text: 找不到玻璃杯，他们就用画着柳树图案的茶杯装姜汁酒兑水，举杯祝福埃玛姨妈。过去他们总嫌姨妈不如妈妈亲切温存。现在想想，幸亏她记得把储藏柜里的吃食装进箱子，他们都觉得自己从前对姨妈太苛刻了。床单也是姨妈事先叫人烘得干干爽爽的，搬家具的人又早已搭好了床架，所以晚饭以后，大家没费多少工夫就把床铺妥了。
        - id: ch01-b34
          speaker: mother
          text: 晚安，我的小鸡崽儿们。我敢说这儿没有大耗子。不过房门会开着，要是真来了小老鼠，你们就尖叫。我会过来明明白白地告诉它，我对它有什么意见。
        - id: ch01-b35
          speaker: narrator
          text: 妈妈说完便回了自己的房间。孩子们躺进刚铺好的床，很快就在陌生的新家里睡着了。半夜，罗伯塔忽然醒来，听见那只小旅行钟敲了两下。钟声明明就在屋里，听起来却像从很远很远的教堂钟楼传来。四周已经安静了，她还听见妈妈并没有睡，仍在自己的房间里来来回回地走动。
    - id: ch02
      title: 新家的第一个早晨
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天一早，罗伯塔轻轻扯了扯菲莉丝的头发。虽然很轻，也足够把她叫醒。
        - id: ch02-b02
          speaker: phyllis
          text: 怎么啦？
        - id: ch02-b03
          speaker: roberta
          text: 醒醒，快醒醒！我们已经住进新房子了，你忘了吗？这儿一个佣人也没有。我们起来做点有用的事吧。先像老鼠一样悄悄溜下楼，趁妈妈没醒，把一切弄得漂漂亮亮。我叫过彼得了。等我们穿好，他也该好了。
        - id: ch02-b04
          speaker: narrator
          text: 两个女孩飞快地穿好衣服，尽量不出声。房里没有水，她们下楼来到院子，在水泵底下照自己认为够用的程度洗了脸。一个压水，一个洗，水花溅得到处都是，倒挺有趣。
        - id: ch02-b05
          speaker: roberta
          text: 这样洗脸比用脸盆有意思多了。你看，石缝里的野草亮晶晶的，屋顶上的苔藓也在发亮。呀，上面还有花！
        - id: ch02-b06
          speaker: narrator
          text: 后厨房的屋顶低低斜下来，铺着茅草。上面长满苔藓、长生草、景天和桂竹香，最远的角落甚至开着一丛紫鸢尾。
        - id: ch02-b07
          speaker: phyllis
          text: 这里比埃奇科姆别墅漂亮一百倍，一千倍！真想知道花园是什么样。
          emotion: happy
        - id: ch02-b08
          speaker: roberta
          text: 先别想花园。我们进去干活。
        - id: ch02-b09
          speaker: narrator
          text: 他们生起炉火，把水壶坐在上面，又把早餐用的杯盘一件件摆好。他们很想把事情做得周到，可该用的东西并没全找到，只好临时想办法。玻璃烟灰缸拿来装盐再合适不过。要是有面包，那只还挺新的烤盘看起来也很适合盛面包。忙到实在想不出还有什么可做，他们才重新走到清新明亮的晨光里。
        - id: ch02-b10
          speaker: peter
          text: 现在去看花园吧。
        - id: ch02-b11
          speaker: narrator
          text: 奇怪的是，他们怎么也找不到花园。三个人绕着房子走了一圈又一圈。屋后是院子，对面有马厩和几间小屋。房子的另外三面全是田野，短短的草地一直贴到门前，既没有花园，也没有围墙。可头天夜里，他们明明见过花园的墙。这里地势高低起伏，往山下能看见铁路线、隧道黑洞洞的大嘴，还有山谷尽头那座一拱接一拱的高桥。车站却躲在视线外面。
        - id: ch02-b12
          speaker: peter
          text: 别找花园了。我们下去看看铁路，说不定正好有火车经过。
        - id: ch02-b13
          speaker: roberta
          text: 在这里也看得见。我们先坐一会儿吧。
        - id: ch02-b14
          speaker: narrator
          text: 他们挤在一块露出草地的灰色大平石上。等妈妈八点钟出来找人时，三个孩子已经舒舒服服地抱成一团，在晒暖的石头上睡熟了。他们五点半左右生起旺火，把水壶坐上去。到了八点，火早灭了，水早干了，连壶底都烧穿了。摆早餐时，他们也根本没想到杯盘应该先洗。
        - id: ch02-b15
          speaker: mother
          text: 不过没关系，我是说那些杯子碟子。因为我又找到一间屋子，先前竟忘得干干净净。那屋子简直像有魔法！我还用炖锅烧好了泡茶的水。
        - id: ch02-b16
          speaker: narrator
          text: 小屋也连着厨房。昨晚又乱又黑，大家把门错当成了柜门。屋里方方正正，桌上整齐放着冷烤牛肉、面包、黄油、奶酪，还有一只馅饼。
        - id: ch02-b17
          speaker: peter
          text: 早餐就吃馅饼！这也太棒了！
          emotion: happy
        - id: ch02-b18
          speaker: mother
          text: 可不是乳鸽馅饼，只是苹果馅的。这才是我们昨晚该吃的晚饭。维尼太太留了字条，她女婿摔断了胳膊，她只好提早回去。今天上午十点，她会过来。
        - id: ch02-b19
          speaker: narrator
          text: 早餐好极了。一天刚开始就吃冷苹果馅饼，虽然不大平常，孩子们却宁愿要它，不要肉。
        - id: ch02-b20
          speaker: peter
          text: 我们起得太早了。所以这对我们来说更像午饭，不算早饭。再给我一块吧。
        - id: ch02-b21
          speaker: narrator
          text: 那一整天，他们都在帮妈妈拆箱子、安置东西。每只箱子一打开，就有更多衣服、杯盘和家用物件等着归位。六条小腿跟着各自的小主人，从一个房间跑到另一个房间，把东西送去该放的地方。等到差不多安顿下来，六条腿全都又酸又疼。直到下午很晚，妈妈才终于叫大家停下。
        - id: ch02-b22
          speaker: mother
          text: 好啦，今天就做到这里。我躺一个小时，晚饭时又会像云雀一样精神。
        - id: ch02-b23
          speaker: narrator
          text: 三个孩子互相一看，三张脸上都是同一个念头。要问他们上哪儿去，答案只有一个——去铁路。
    - id: ch03
      title: 铁路和车站
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们刚出发，就发现花园原来藏在马厩后面，四周围着高墙。
        - id: ch03-b02
          speaker: peter
          text: 哎呀，先别管花园！妈妈早上已经告诉我它在哪儿了。留到明天，它又不会跑。我们快去铁路那边。
        - id: ch03-b03
          speaker: narrator
          text: 去铁路的路一路下坡。短短的草间长着几丛荆豆，灰黄的岩石从地里凸出来，像蛋糕上的蜜饯果皮。到了坡底，地面忽然往下一冲，一道木栅栏横在面前。栅栏外就是铁路，亮闪闪的钢轨、电报线、电线杆和信号灯，全都看得清清楚楚。
        - id: ch03-b04
          speaker: narrator
          text: 三个孩子爬上栅栏顶。突然，远处传来隆隆声。他们一起望向右边，那里是岩壁上黑沉沉的隧道口。下一刻，一列火车尖叫着、喷喘着冲出隧道，从眼前轰隆隆开过去。气浪扑到孩子们身上，铁道间的石子在车轮下跳起来，咔啦咔啦地响。
        - id: ch03-b05
          speaker: roberta
          text: 啊！它像一条巨龙跑过去了。你们有没有感觉到，它用滚烫的翅膀扇了我们一下？
          emotion: surprised
        - id: ch03-b06
          speaker: phyllis
          text: 从外面看，巨龙的窝大概就像那座隧道。
        - id: ch03-b07
          speaker: peter
          text: 我从没想过，我们这辈子还能离火车这么近。真过瘾！
          emotion: happy
        - id: ch03-b08
          speaker: roberta
          text: 比你的玩具火车强吧？
        - id: ch03-b09
          speaker: narrator
          text: 到了这里，讲故事的人也不想再叫她罗伯塔了。别人都叫她博比，那就从现在起叫她博比吧。
        - id: ch03-b10
          speaker: peter
          text: 不能这么比，感觉不一样。看见一整列火车可真奇怪，它高得吓人，对不对？
        - id: ch03-b11
          speaker: phyllis
          text: 从前看火车，总有站台挡住下面一半。
        - id: ch03-b12
          speaker: roberta
          text: 不知道刚才那列是不是去伦敦的。爸爸就在伦敦。
        - id: ch03-b13
          speaker: peter
          text: 去车站问问就知道了。
        - id: ch03-b14
          speaker: narrator
          text: 他们沿着铁路边往前走，电报线一路在头顶嗡嗡作响。平常坐在火车里，两根电线杆之间仿佛只有短短一截。一根又一根电线杆飞快迎上来，赶上连接它们的电线，快得让人根本数不清。可现在只靠两条腿往前走，电线杆忽然变得又远又稀，每两根之间都像隔着很长一段路。不过，三个孩子耐心走下去，最后还是到了车站。
        - id: ch03-b15
          speaker: narrator
          text: 从前来车站，他们不是要乘车，就是来等一班车，而且身边总有大人陪着。那些大人对车站本身毫无兴趣，只把这里当成一个恨不得赶快离开的地方。三个孩子从没这样自由地看过车站。今天他们能贴近信号房，近得足以看清牵动机关的电线。他们先听见神秘的叮叮声，紧接着又听到机械装置坚定有力地咔嗒一响。连钢轨下面一根根枕木都成了让人高兴的道路。枕木间的距离不宽不窄，正好让博比把它们当作急流中的踏脚石，临时玩起跨越白浪的游戏。
        - id: ch03-b16
          speaker: narrator
          text: 他们没走售票处，而是像三个自由的海盗，从站台斜斜的末端爬了上去。光是这样就够快乐了。搬运工休息室也值得偷看，里面有信号灯，墙上挂着铁路年鉴，一名搬运工藏在报纸后面打瞌睡。
        - id: ch03-b17
          speaker: narrator
          text: 车站里交错着许多条铁轨。有几条只伸进一旁的货场，到那里便突然停住，像是已经干腻了自己的差事，决定从此退休。几辆货车安静地停在轨道上。另一边是一大垛煤，可那绝不是家里煤窖中松松散散的煤堆，而是一座结结实实的煤建筑。外层的大块方煤像砖头一样，一块压着一块垒起来。整座煤垛看上去，活像《儿童圣经故事》插图中的平原诸城。靠近顶端的煤墙上，还清清楚楚刷着一道白线。
        - id: ch03-b18
          speaker: narrator
          text: 不久，车站门上的铃铛清脆地响了两阵，搬运工才慢吞吞走出来。彼得先摆出最有礼貌的样子问了好，马上又问，那道白线是做什么的。
        - id: ch03-b19
          speaker: porter
          text: 那是拿来标记煤有多少的。这样有人顺手偷走几块，我们一眼就知道。所以啊，小少爷，你可别把煤塞进口袋带走。
        - id: ch03-b20
          speaker: narrator
          text: 当时大家只把它当成一句玩笑。彼得立刻觉得这个搬运工爽快又随和。可后来，他再想起这句话，意思就完全不同了。
        - id: ch03-b21
          speaker: narrator
          text: 你见过炉边发酵的面团吗？它圆滚滚地鼓在盆里，像一只大蘑菇。小孩子看见了，总忍不住伸手戳一下。手指留下的小坑很深，却会慢慢消失，最后跟没碰过一样。除非手特别脏，才会留下黑印。
        - id: ch03-b22
          speaker: narrator
          text: 爸爸离开、妈妈伤心，在孩子们心里按下的痛苦也像那个小坑。印子起先很深，却没有一直留在表面。他们渐渐习惯了爸爸不在，虽然并没忘记他。他们也习惯了不上学，很少见到妈妈。妈妈差不多整天关在楼上写个不停，只在下午茶时下来，念她写好的故事。那些故事非常好听。
        - id: ch03-b23
          speaker: narrator
          text: 四周的岩石、山峦、谷地和树木，还有运河，样样都新鲜，样样都让人心满意足。当然，最叫他们着迷的还是铁路。每天都有新的地方可走，新的动静可听，新的东西可看。相比之下，从前在别墅里的那种生活离他们越来越远，慢慢变得像一场做过却快要记不清的梦。
    - id: ch04
      title: 一个不能说的主意
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 妈妈不止一次告诉他们，家里现在非常穷。可这听着仿佛只是一句话。大人有时会说些并没有特别意思的话，连妈妈也不例外。孩子们还是有饭吃，穿的也还是以前那些漂亮衣服。
        - id: ch04-b02
          speaker: narrator
          text: 到了六月，雨却一连下了三天。细雨像一根根长矛，直直扎下来。天冷得厉害，谁也出不了门，大家冻得发抖。他们一起走到妈妈门外敲门。
        - id: ch04-b03
          speaker: mother
          text: 什么事？
        - id: ch04-b04
          speaker: roberta
          text: 妈妈，我能生炉火吗？我知道该怎么生。
        - id: ch04-b05
          speaker: mother
          text: 不行，我的小鸭儿。六月里不能生火，煤太贵了。要是冷，你们就去阁楼好好闹一场，身上自然会暖。
        - id: ch04-b06
          speaker: roberta
          text: 可生一炉火只要一点点煤。
        - id: ch04-b07
          speaker: mother
          text: 就是这一点点，我们也买不起呀，我的小鸡儿。好了，快去吧，乖孩子们。我忙得快发疯了！
        - id: ch04-b08
          speaker: phyllis
          text: 妈妈现在一直都在忙。
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: 菲莉丝贴着彼得的耳朵说。彼得没回答，只耸了耸肩。他心里正在琢磨事情。不过阁楼正适合布置强盗巢穴，他很快顾不上想了。彼得当强盗头子，博比又做副官，又做他手下所有忠心的强盗，后来还做了菲莉丝的家长。菲莉丝是被绑架的少女。强盗收下一大堆马豆当赎金，才肯放她走。
        - id: ch04-b10
          speaker: narrator
          text: 游戏一直玩到喝茶的时候。三个孩子下楼时个个满面红光，欢天喜地，仿佛刚从真正的山中强盗巢穴里回来。茶桌上有面包、黄油和果酱。菲莉丝已经给面包抹好了黄油，正要在上面再添一层果酱，妈妈看见了，便开口拦住她。
        - id: ch04-b11
          speaker: mother
          text: 亲爱的，果酱和黄油只能挑一样，不能两样都吃。我们现在可享受不起这种不管不顾的奢侈。
        - id: ch04-b12
          speaker: narrator
          text: 菲莉丝默默吃完黄油面包，又吃了一片果酱面包。彼得一边喝着淡茶，一边想心事。茶后，他们回到阁楼。
        - id: ch04-b13
          speaker: peter
          text: 我想到一个主意。
        - id: ch04-b14
          speakers: [roberta, phyllis]
          ensemble: duo
          text: 什么主意？
        - id: ch04-b15
          speaker: peter
          text: 我才不告诉你们。
        - id: ch04-b16
          speaker: roberta
          text: 哦，那就算了。
        - id: ch04-b17
          speaker: phyllis
          text: 对，那就别说。
        - id: ch04-b18
          speaker: peter
          text: 女孩子的脾气就是这么急。
        - id: ch04-b19
          speaker: roberta
          text: 男孩子又能好到哪儿去？谁稀罕听你的傻主意。
        - id: ch04-b20
          speaker: peter
          text: 以后你们自然会知道。我本来或许会告诉你们，我不肯说完全是因为心地高尚。可你这么急着吵架，我现在什么也不说了。就这样！
        - id: ch04-b21
          speaker: narrator
          text: 两个女孩劝了好一阵，彼得才肯再开口，可他说得还是不多。
        - id: ch04-b22
          speaker: peter
          text: 我不告诉你们，是因为这个办法可能不大对。我不想把你们也拖进去。
        - id: ch04-b23
          speaker: roberta
          text: 要是不对，那你也别做。让我做。
        - id: ch04-b24
          speaker: phyllis
          text: 你要去做坏事，我也要一起做！
        - id: ch04-b25
          speaker: peter
          text: 不行。这回九死一生，得由我带头。我只要你们答应一件事。妈妈要是问我在哪儿，不许告密。
        - id: ch04-b26
          speaker: roberta
          text: 我们什么也不知道，怎么告密？
          emotion: angry
        - id: ch04-b27
          speaker: peter
          text: 不，你们知道。我已经把性命交给你们了。你们知道我要一个人去冒险，有些人也许觉得这不对，可我不觉得。妈妈要是问，就说我在采矿。
        - id: ch04-b28
          speaker: roberta
          text: 采什么矿？
        - id: ch04-b29
          speaker: peter
          text: 只说采矿就行。
        - id: ch04-b30
          speaker: phyllis
          text: 你就不能告诉我们吗，彼得？
        - id: ch04-b31
          speaker: peter
          text: 好吧，是煤矿。可这个词要是从你们嘴里溜出去，就等着受严刑拷打吧。
        - id: ch04-b32
          speaker: roberta
          text: 不用威胁我们。而且我真觉得，你该让我们帮忙。
        - id: ch04-b33
          speaker: peter
          text: 要是我找到煤矿，就让你们帮着运煤。
        - id: ch04-b34
          speaker: phyllis
          text: 你那么爱守秘密，就自己守着吧。
        - id: ch04-b35
          speaker: roberta
          text: 看你到底守不守得住。
        - id: ch04-b36
          speaker: peter
          text: 我当然守得住。
    - id: ch05
      title: 圣彼得煤矿
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 下午茶和晚饭之间，总会隔着一段时间，哪怕是在吃饭最勤、最贪嘴的人家也是一样。那时妈妈照例在写作，维尼太太已经回家。彼得想到那个主意两天后，黄昏时，他神秘地向两个女孩招手。
        - id: ch05-b02
          speaker: peter
          text: 跟我来，把罗马战车带上。
        - id: ch05-b03
          speaker: narrator
          text: 所谓罗马战车，其实是一辆很旧的婴儿车。它早已不再载小孩子，在马车房上面的阁楼里退役了许多年。三个孩子把它找出来以后，认真给各处机件上过油。现在它跑起来几乎没有声音，顺滑得像一辆装着充气轮胎的自行车。车把也十分听使唤，想必跟它年轻力壮时没有两样。
        - id: ch05-b04
          speaker: peter
          text: 跟紧你们无所畏惧的首领。
        - id: ch05-b05
          speaker: narrator
          text: 他领头往山下的车站走。车站上方有不少岩石探出草皮，仿佛也和孩子一样，对铁路很感兴趣。三块岩石围成的小洼地里，堆着干荆棘和石南枝。彼得用那只伤痕累累的靴子拨开枯枝。
        - id: ch05-b06
          speaker: peter
          text: 这就是圣彼得矿的第一批煤。我们用战车把它运回去，准时又快捷，谁来都欢迎。老主顾想要什么形状，我们就把煤切成什么形状。
        - id: ch05-b07
          speaker: narrator
          text: 三个人兴冲冲地动手，很快就把婴儿车塞得满满当当。他们推着试了试，这才发现，只能把煤重新卸下来。满车煤实在太重了，三个孩子一起用力，也怎么都拉不上山。彼得不肯轻易认输，甚至解下背带，把自己套在车把上。他一只手牢牢提住裤腰，免得裤子掉下来，身子拼命往前倾。两个女孩在车后使劲推，车轮却还是不肯往上走。他们只好少装一些，一趟一趟地来回。最后足足跑了三趟，圣彼得煤矿出产的第一批煤，才全部添进妈妈地窖原有的煤堆里。
        - id: ch05-b08
          speaker: narrator
          text: 后来，彼得独自出了门。回来时，他从头到脚黑漆漆的，样子十分神秘。
        - id: ch05-b09
          speaker: peter
          text: 我去过自己的煤矿了。明天晚上，我们就用战车把那些黑钻石运回来。
        - id: ch05-b10
          speaker: narrator
          text: 他们就这样把煤一趟趟运回家。一个星期以后，维尼太太跟妈妈说，最近买的这一批煤可真经烧。三个孩子恰好躲在楼梯上听见了。他们一会儿紧紧抱住自己，一会儿又搂住彼此，身子扭来扭去，拼命不让笑声跑出来。到这个时候，他们只觉得秘密计划成功极了，早把彼得最初的那点疑心忘得干干净净。他曾经怀疑过，这种所谓的采煤，到底是不是真的不对。
    - id: ch06
      title: 煤矿工人被抓住了
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 可怕的一晚终于来了。站长换上一双旧沙滩鞋，那是他放暑假去海边时穿的。他悄无声息地走进货场。刷着白线的煤垛就在那里。他像守着鼠洞的猫，躲在一旁等。煤堆顶上，一个黑乎乎的小东西正在偷偷扒煤，发出窸窸窣窣的声音。
        - id: ch06-b02
          speaker: narrator
          text: 站长藏进一节守车投下的阴影里。那节车的顶上伸着一根小铁皮烟囱，车身写着北部及南部铁路，编号三四五七六，下面还有两行字，要求用完立刻送回白石南岔道。站长一动不动地等着。过了一会儿，煤堆上的黑影终于不再扒拉了。他慢慢挪到煤堆边，先小心地往下爬，又转身伸手，把一样东西从上面提下来。就在这一刻，站长扬起胳膊，一把揪住他的衣领。那个黑影果然是彼得。他被抓得结结实实，手里还在发抖，紧紧攥着一只旧木匠袋，袋里装满了煤。
        - id: ch06-b03
          speaker: station_master
          text: 好啊，小贼，这回总算抓住你了吧？
        - id: ch06-b04
          speaker: peter
          text: 我不是贼。我是个煤矿工人。
        - id: ch06-b05
          speaker: narrator
          text: 彼得尽力让声音听起来坚定。
        - id: ch06-b06
          speaker: station_master
          text: 这话留着哄海军吧。
        - id: ch06-b07
          speaker: peter
          text: 不管对谁说，这都是真的。
        - id: ch06-b08
          speaker: station_master
          text: 这一点你倒说对了。闭嘴吧，小坏蛋，跟我去车站。
        - id: ch06-b09
          speaker: roberta
          text: 啊，求您别这样！
          emotion: fearful
        - id: ch06-b10
          speaker: narrator
          text: 黑暗里传来一个痛苦的声音，并不是彼得。
        - id: ch06-b11
          speaker: phyllis
          text: 您不是要带他去警察局吧？
          emotion: fearful
        - id: ch06-b12
          speaker: station_master
          text: 暂时不去警察局，先去火车站。哎哟，原来是一整伙。还有别人吗？
        - id: ch06-b13
          speakers: [roberta, phyllis]
          ensemble: duo
          text: 只有我们了。
        - id: ch06-b14
          speaker: narrator
          text: 博比和菲莉丝从另一辆货车的阴影里走了出来。原来她们一直悄悄跟在彼得后面，也藏在这里看着。这辆货车的车身上印着斯泰夫利煤矿，旁边又有人用白粉笔写了一行字，说一号轨道要用。
        - id: ch06-b15
          speaker: peter
          text: 你们凭什么监视我？
          emotion: angry
        - id: ch06-b16
          speaker: station_master
          text: 依我看，早就该有人看着你了。全都跟我去车站。
        - id: ch06-b17
          speaker: roberta
          text: 求求您，别带我们走。您不能就在这里决定怎么办吗？我们跟彼得错得一样。煤是我们帮忙运的，我们也知道他从哪儿弄来的。
          emotion: fearful
        - id: ch06-b18
          speaker: peter
          text: 不，你们不知道。
        - id: ch06-b19
          speaker: roberta
          text: 我们知道，一直都知道。我们只是假装不知道，好顺着你的心意。
        - id: ch06-b20
          speaker: narrator
          text: 这下彼得可再也受不了了。他辛辛苦苦挖过煤，也确实挖到了煤，偏偏还叫人当场抓住。光是这些已经够难堪了，现在他又发现，两个女孩从头到尾都猜中了他的秘密，只是故意装作不明白，一直在迁就他。这一点最叫他忍受不了。
        - id: ch06-b21
          speaker: peter
          text: 别再抓着我了！我不会逃跑。
          emotion: angry
        - id: ch06-b22
          speaker: narrator
          text: 站长听他这么说，便放开了彼得的衣领。彼得果然站在原地，没有逃。他划亮一根火柴，火光在夜色里摇摇晃晃。借着这一点亮光，站长把三个孩子从头到脚仔细打量了一遍。
        - id: ch06-b23
          speaker: station_master
          text: 咦，你们是山上“三烟囱”家的孩子。衣服也穿得体体面面。告诉我，为什么要干这种事？难道从来没去过教堂，也没学过教义问答，不知道偷东西不对吗？
        - id: ch06-b24
          speaker: narrator
          text: 站长的声音已经温和多了。
        - id: ch06-b25
          speaker: peter
          text: 我没觉得这是偷，至少差不多能肯定不是。要是从煤堆外面拿，也许算偷。可我是从中间拿，那就该算采矿。你们得烧好几千年，才能把煤烧到中间那一层呢。
        - id: ch06-b26
          speaker: station_master
          text: 也不用那么久。不过你这样做，是为了好玩吗？还是另有原因？
        - id: ch06-b27
          speaker: peter
          text: 那些讨厌的大煤块重得要命，运上山一点也不好玩。
        - id: ch06-b28
          speaker: station_master
          text: 那你为什么还要运？
        - id: ch06-b29
          speaker: narrator
          text: 站长的口气更和气了，彼得这才回答。
        - id: ch06-b30
          speaker: peter
          text: 您知道前几天下雨吧？妈妈说我们穷得不能生火。以前住在那幢房子里，只要天冷，我们总会生炉火，而且——
        - id: ch06-b31
          speaker: roberta
          text: 别说了！
        - id: ch06-b32
          speaker: station_master
          text: 好吧，我来告诉你们怎么办。这一次，我不追究。不过你得记住，小少爷，偷就是偷。我的东西不是你的。不管你叫它采矿，还是换个别的名字，都不会变。现在回家吧。
        - id: ch06-b33
          speaker: peter
          text: 您真的一点也不罚我们？嗨，您真是个大好人！
          emotion: surprised
        - id: ch06-b34
          speaker: roberta
          text: 您真亲切。
        - id: ch06-b35
          speaker: phyllis
          text: 您简直是个宝贝。
        - id: ch06-b36
          speaker: station_master
          text: 好啦，好啦。
        - id: ch06-b37
          speaker: narrator
          text: 他们就这样分开了。三个孩子一起往山上走。
        - id: ch06-b38
          speaker: peter
          text: 别跟我说话。你们是密探，是叛徒，你们就是这种人。
          emotion: angry
        - id: ch06-b39
          speaker: narrator
          text: 可两个女孩见彼得平平安安、自由自在地走在中间，正跟她们一起回三烟囱，没有被押去警察局，心里实在太高兴了，根本不在乎他说什么。
        - id: ch06-b40
          speaker: roberta
          text: 我们确实说过，我们的错跟你一样大。
          emotion: calm
        - id: ch06-b41
          speaker: peter
          text: 可本来就不一样。
        - id: ch06-b42
          speaker: phyllis
          text: 要是真上了法庭，到了法官面前，结果就是一样。别闹脾气了，彼得。你的秘密那么容易猜，又不是我们的错。
        - id: ch06-b43
          speaker: narrator
          text: 她挽住彼得的胳膊，彼得没有甩开。
        - id: ch06-b44
          speaker: peter
          text: 不管怎样，地窖里已经有一大堆煤了。
        - id: ch06-b45
          speaker: roberta
          text: 哎，别说了！我觉得我们不该为那些煤高兴。
        - id: ch06-b46
          speaker: peter
          text: 我可说不准。就算到了现在，我也不能完全确定采矿算犯罪。
        - id: ch06-b47
          speaker: narrator
          text: 两个女孩却完全确定，拿走别人的煤就是错的。她们还同样确定一件事。彼得经过今晚这一场，也早已在心里弄明白了，只是他那么要强，一时还不肯亲口承认罢了。
