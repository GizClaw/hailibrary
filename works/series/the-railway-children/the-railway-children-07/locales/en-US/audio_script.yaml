  chapters:
    - id: ch01
      title: Chapter VII. For valour.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: I hope you don't mind hearing so much about Roberta. The truth is, I'm growing very fond of her. The more I watch her, the more I love her, because I keep noticing things about her that I like. For one thing, she cared in an unusual way about making other people happy. She could keep a secret, too, which is rare enough. And she knew how to be quietly sympathetic.
        - id: ch01-b02
          speaker: narrator
          text: That may sound dull, but it isn't nearly as dull as it sounds. It means knowing someone is unhappy and loving them extra because of it, without bothering them by constantly telling them how sorry you feel. That was Bobbie. She knew Mother was unhappy, and she knew Mother had chosen not to tell her why. So Bobbie simply loved her more. She never said one word that might show Mother how earnestly her little girl wondered about the reason. That takes practice. It is not nearly as easy as you might think.
        - id: ch01-b03
          speaker: narrator
          text: All sorts of pleasant, ordinary things still happened. There were picnics and games and buns for tea. Bobbie enjoyed them, but the same thoughts always waited at the back of her mind. They repeated themselves again and again, like a tune when you cannot remember the part that makes it stop.
        - id: ch01-b04
          speaker: roberta
          text: Mother is unhappy. Why? I don't know. She doesn't want me to know, so I won't try to find out. But she is unhappy. Why? I don't know. She doesn't...
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: The Russian gentleman filled a great many of their thoughts as well. Every editor, society secretary, and member of Parliament answered Mother's letters as politely as possible. But none could say where Mr. Szezcpansky's wife and children might be. That, by the way, was the Russian gentleman's very Russian name.
        - id: ch01-b06
          speaker: narrator
          text: Bobbie had another quality, though different people give it very different names. Some call it meddling in other people's business. Others call it helping a lame dog over a stile. Still others call it loving-kindness. Whatever name you choose, it means trying to help. Bobbie racked her brains for some way to find the Russian gentleman's wife and children.
        - id: ch01-b07
          speaker: narrator
          text: By now, he had learned a few English words. He could say good morning, good night, please, and thank you. When the children brought him flowers, he could say pretty. When they asked how he had slept, he answered, "Very good." He smiled whenever he tried what Bobbie called saying his English, and she thought that smile was simply too sweet for anything. She kept picturing his face because she imagined it might lead her to some way of helping him. It never did. Still, having him there comforted Bobbie, because she could see that caring for him made Mother happier.
        - id: ch01-b08
          speaker: roberta
          text: Mother likes having someone else to care for, besides us. I know it hurt her to give him Father's clothes. But perhaps it was the kind of hurt that feels good, or she wouldn't have done it.
        - id: ch01-b09
          speaker: narrator
          text: For many nights after Bobbie, Peter, and Phyllis saved the train with their little red flannel flags, Bobbie woke screaming and shaking. In her sleep, she saw that terrible mound again. She saw the poor, dear, trusting engine racing toward it, believing the track ahead was clear and safe, thinking only of doing its swift duty. Then she would remember how she and Peter and Phyllis, with the red flannel petticoats, truly had saved everyone on the train. A warm thrill of happiness would run through her at the thought.
        - id: ch01-b10
          speaker: narrator
          text: One morning, a letter came addressed to Peter, Bobbie, and Phyllis. They hardly ever received letters, so they opened it with tremendous excitement.
        - id: ch01-b11
          speaker: jabez_inglewood
          text: Dear Sir and Ladies, the railway proposes to make a small presentation to you in honor of your quick and courageous warning to the train, which prevented what must have been a terrible accident. The presentation will be held at the station at three o'clock on the thirtieth, if that time and place are convenient. Yours faithfully, Jabez Inglewood, Secretary of the Great Northern and Southern Railway Company.
        - id: ch01-b12
          speaker: narrator
          text: Never in their lives had the three children felt so proud. They rushed straight to Mother with the letter. Mother felt proud of them as well, and she told them so. Hearing that from her made the children happier than ever.
        - id: ch01-b13
          speaker: mother
          text: If the presentation is money, you must thank them and say you'd rather not accept it. I'll wash your Indian muslin dresses right away. You must look tidy for something like this.
        - id: ch01-b14
          speaker: roberta
          text: Phil and I can wash them, if you'll do the ironing.
        - id: ch01-b15
          speaker: narrator
          text: Washing can be fun. Have you ever tried it? This washing took place in the back kitchen, with its stone floor and enormous stone sink beneath the window.
        - id: ch01-b16
          speaker: phyllis
          text: Let's put the tub on the sink. Then we can pretend we're outdoor washerwomen, like the ones Mother saw in France.
        - id: ch01-b17
          speaker: peter
          text: They washed things in a cold river, not hot water.
        - id: ch01-b18
          speaker: phyllis
          text: Then ours is a hot river. Be a dear and help me lift the tub.
        - id: ch01-b19
          speaker: peter
          text: I'd like to see a deer helping with a tub.
        - id: ch01-b20
          speaker: narrator
          text: But Peter helped. Bobbie carefully carried the heavy kettle from the kitchen fire while Phyllis hopped around with joy.
        - id: ch01-b21
          speaker: phyllis
          text: Time to scrub and rub, and rub and scrub!
          emotion: happy
        - id: ch01-b22
          speaker: roberta
          text: Oh, no! You mustn't rub muslin. Mix the boiled soap into the hot water until it's all foamy. Then shake the muslin and squeeze it very gently. The dirt comes right out. You only scrub clumsy things like sheets and tablecloths.
          emotion: surprised
        - id: ch01-b23
          speaker: narrator
          text: Outside the window, the lilac and the Gloire de Dijon roses moved in the soft breeze.
        - id: ch01-b24
          speaker: roberta
          text: At least it's a good day for drying. Oh, I wonder how wonderful we'll feel when we wear these Indian muslin dresses!
        - id: ch01-b25
          speaker: phyllis
          text: So do I.
        - id: ch01-b26
          speaker: narrator
          text: She shook and squeezed the muslin as professionally as she could.
        - id: ch01-b27
          speaker: roberta
          text: Now squeeze out the soapy water. No, don't twist them. Next we rinse. I'll hold the dresses while you and Peter empty the tub and bring clean water.
        - id: ch01-b28
          speaker: narrator
          text: They washed the clothespins, wiped the line, and hung the dresses up to dry. All the while, the coming presentation filled their talk.
        - id: ch01-b29
          speaker: peter
          text: A presentation means presents. What do you suppose we'll get?
        - id: ch01-b30
          speaker: phyllis
          text: It could be anything. I've always wanted a baby elephant, but I don't suppose they'd know that.
        - id: ch01-b31
          speaker: roberta
          text: Maybe gold models of steam engines.
        - id: ch01-b32
          speaker: peter
          text: Or a big model of the place where we stopped the accident, with a little train and dolls of us, the driver, the fireman, and the passengers.
        - id: ch01-b33
          speaker: narrator
          text: Bobbie dried her hands on the rough roller towel behind the back-kitchen door. She had begun to wonder about something else.
        - id: ch01-b34
          speaker: roberta
          text: Do you really like being rewarded for saving a train?
        - id: ch01-b35
          speaker: peter
          text: Of course I do. And don't pretend you don't, because I know you do too.
        - id: ch01-b36
          speaker: roberta
          text: I know I like it. But shouldn't doing it have been enough? Should we want something more?
        - id: ch01-b37
          speaker: peter
          text: Who asked for more, silly? Soldiers don't ask for the Victoria Cross, but they're glad when they get one. Maybe we'll get medals. When I'm very old, I'll show mine to my grandchildren and say, "We only did our duty." They'll be terribly proud of me.
        - id: ch01-b38
          speaker: phyllis
          text: You need to get married first. Otherwise you won't have grandchildren.
        - id: ch01-b39
          speaker: peter
          text: I suppose I'll have to marry someday, though having her around all the time will be an awful bother. I'd choose a lady who falls into trances and wakes up only once or twice a year.
        - id: ch01-b40
          speaker: roberta
          text: Just long enough to tell you you're the light of her life, and then she'd go back to sleep. That might work.
        - id: ch01-b41
          speaker: phyllis
          text: When I marry, I'll want him to keep me awake all the time, so I can hear him say how nice I am.
        - id: ch01-b42
          speaker: roberta
          text: I'd like to marry someone very poor. I'd do all the work, and he'd love me dreadfully. Every evening, as he came home, he'd see blue wood smoke curling through the trees from our hearth. Oh! We have to answer the letter and say the time and place are convenient. Peter, put away the soap. We're both perfectly clean. Phil, bring the pink writing paper you got for your birthday.
        - id: ch01-b43
          speaker: narrator
          text: The answer took a long time to arrange. Mother had gone back to her writing, so the children worked it out for themselves. They spoiled several sheets of Phyllis's precious pink paper. Every sheet had scalloped gold edges and a green four-leaf clover in one corner. At last, after much discussion, all three agreed on exactly what they ought to say. Then each child made a careful copy and signed it with their own name.
        - id: ch01-b44
          speakers: [roberta, peter, phyllis]
          ensemble: chorus
          text: Dear Mr. Jabez Inglewood, thank you very much. We only wanted to save the train and did not expect a reward. But we are glad you think we deserve one, and we thank you very much. The time and place will be quite convenient. Thank you very much. Your affectionate little friend. P.S. Thank you very much.
        - id: ch01-b45
          speaker: narrator
          text: Later, Bobbie took the clean, dry dresses down from the line.
        - id: ch01-b46
          speaker: roberta
          text: Washing is much easier than ironing. I love seeing things come clean. Oh, how can we possibly wait to find out what kind of presentation they're going to present?
        - id: ch01-b47
          speaker: narrator
          text: At last, after what felt like a very long wait, the day came. The children reached the station at the proper time. Everything that followed was so strange that it felt like a dream. The Station Master came out to meet them. Peter noticed immediately that he was wearing his best clothes. Then he led them into the very waiting room where they had once played the advertisement game.
        - id: ch01-b48
          speaker: narrator
          text: The room looked completely different. Someone had laid down a carpet. Pots of roses stood on the mantel and along the window ledges. Green branches rose above the framed advertisements for Cook's Tours, the Beauties of Devon, and the Paris Lyons Railway, just as holly and laurel do at Christmas. The Porter was there, along with every other station worker. Two or three smartly dressed ladies and a whole crowd of gentlemen in high hats and frock coats filled the room. The children recognized several passengers from the day of the red flannel petticoats. Best of all, their own old gentleman was there. His coat, hat, and collar seemed more unlike everyone else's than ever. He shook their hands, and everyone sat down on chairs.
        - id: ch01-b49
          speaker: narrator
          text: A man in spectacles stood up. They learned later that he was the District Superintendent. He gave a long and very clever speech. I won't repeat it. First, you would probably find it dull. Second, it made the children blush so hard and grow so hot around the ears that I want to leave that part behind as quickly as possible. And third, he took so many words to say what he meant that we haven't time for them all. He said many kind things about the children's courage and presence of mind.
        - id: ch01-b50
          speaker: district_superintendent
          text: Their bravery and quick thinking deserve the gratitude of every person who might otherwise have suffered in that terrible accident.
        - id: ch01-b51
          speakers: [jabez_inglewood, station_master, old_gentleman]
          ensemble: chorus
          text: Hear, hear!
        - id: ch01-b52
          speaker: narrator
          text: Everyone applauded. Then the old gentleman rose and spoke, much as people do at a prize-giving. He called the children forward one by one and gave each of them a beautiful gold watch and chain. Inside every watch, after its new owner's name, was an inscription.
        - id: ch01-b53
          speaker: old_gentleman
          text: From the Directors of the Northern and Southern Railway, with grateful recognition of the courageous and prompt action that prevented an accident in 1905.
        - id: ch01-b54
          speaker: narrator
          text: You could not imagine more beautiful watches. Each one had a blue leather case to live in at home. The children had already said thank you quite properly. But the Station Master leaned close to Peter and whispered in his ear.
        - id: ch01-b55
          speaker: station_master
          text: Now you must make a speech and thank everyone. Start with "Ladies and Gentlemen."
        - id: ch01-b56
          speaker: narrator
          text: He pushed Peter forward.
        - id: ch01-b57
          speaker: peter
          text: Oh, dear.
        - id: ch01-b58
          speaker: narrator
          text: Peter did not fight the push. His voice came out rather hoarse.
        - id: ch01-b59
          speaker: peter
          text: Ladies and Gentlemen...
        - id: ch01-b60
          speaker: narrator
          text: He stopped. He could hear his heart pounding in his throat. Then all the words rushed out.
        - id: ch01-b61
          speaker: peter
          text: Ladies and Gentlemen, this is awfully kind of you, and we'll treasure these watches all our lives. But we don't truly deserve them, because what we did wasn't anything, really. Well, it was awfully exciting, but what I mean is... thank you all very, very much.
        - id: ch01-b62
          speaker: narrator
          text: The people applauded Peter even harder than they had applauded the District Superintendent. Then everyone came over to shake hands with the children. As soon as politeness possibly allowed it, the three escaped. They tore up the hill toward Three Chimneys, still carrying their new watches in their hands. It had been a wonderful day, the kind of day that comes very seldom to anyone and, for most of us, does not come at all.
        - id: ch01-b63
          speaker: roberta
          text: I wanted to speak to the old gentleman about something else. But there were so many people. It felt like trying to talk in church.
        - id: ch01-b64
          speaker: phyllis
          text: What did you want to tell him?
        - id: ch01-b65
          speaker: roberta
          text: I'll tell you after I've thought it through.
        - id: ch01-b66
          speaker: narrator
          text: When Bobbie had thought a little longer, she wrote him a letter.
        - id: ch01-b67
          speaker: roberta
          text: My dearest old gentleman, I need very badly to ask you something. Could you get off the train and take the next one instead? I don't want you to give me anything. Mother says we shouldn't ask, and we don't want any things. I only want to talk about a prisoner and captive. Your loving little friend, Bobbie.
        - id: ch01-b68
          speaker: narrator
          text: Bobbie asked the Station Master to hand the letter to the old gentleman. The very next day, she asked Peter and Phyllis to come down to the station with her. They arrived at the time when his train from town would pass through. On the way, Bobbie explained exactly what she hoped to ask him, and Peter and Phyllis approved of the idea completely.
        - id: ch01-b69
          speaker: narrator
          text: All three had washed their hands and faces, brushed their hair, and made themselves as tidy as they knew how. But Phyllis was always unlucky. She had spilled a whole pitcher of lemonade down the front of her dress, and there was no time to change. Then the wind happened to blow from the coal yard. Gray coal dust settled over her frock and stuck fast to the sweet, sticky lemonade stains.
        - id: ch01-b70
          speaker: peter
          text: You look exactly like a little gutter child.
        - id: ch01-b71
          speaker: narrator
          text: They decided that Phyllis should stay behind the others whenever she could.
        - id: ch01-b72
          speaker: roberta
          text: Maybe he won't notice. Old people's eyes are often weak.
        - id: ch01-b73
          speaker: narrator
          text: But there was nothing weak about the old gentleman's eyes, or any other part of him, when he stepped off the train and looked along the platform. Now that the moment had come, the children were struck by a deep wave of shyness. Their ears turned hot and red, their hands grew warm and damp, and the tips of their noses became pink and shiny.
        - id: ch01-b74
          speaker: phyllis
          text: Oh, my heart is pounding like a steam engine, right under my sash.
        - id: ch01-b75
          speaker: peter
          text: Nonsense. Your heart isn't under your sash.
        - id: ch01-b76
          speaker: phyllis
          text: I don't care. Mine is.
        - id: ch01-b77
          speaker: peter
          text: If you're going to sound like a poetry book, then my heart is in my mouth.
        - id: ch01-b78
          speaker: roberta
          text: Mine is in my boots, if we're doing that. Come on. He'll think we're idiots.
        - id: ch01-b79
          speaker: peter
          text: He wouldn't be far wrong.
        - id: ch01-b80
          speaker: narrator
          text: Gloomy as that sounded, they went to meet him.
        - id: ch01-b81
          speaker: old_gentleman
          text: Hello! What a very great pleasure this is.
          emotion: happy
        - id: ch01-b82
          speaker: narrator
          text: He shook each child's hand.
        - id: ch01-b83
          speaker: roberta
          text: It was so good of you to get off the train.
        - id: ch01-b84
          speaker: narrator
          text: Bobbie was perspiring, but she remained polite. The old gentleman took her arm and led her into the waiting room where the children had played on the day they found the Russian. Peter and Phyllis followed. He gave Bobbie's arm a kindly little shake and released it.
        - id: ch01-b85
          speaker: old_gentleman
          text: Well? What is it?
        - id: ch01-b86
          speaker: roberta
          text: Oh, please...
        - id: ch01-b87
          speaker: old_gentleman
          text: Yes?
        - id: ch01-b88
          speaker: roberta
          text: What I mean is... everything was very nice and kind.
        - id: ch01-b89
          speaker: old_gentleman
          text: But?
        - id: ch01-b90
          speaker: roberta
          text: I wish I could say what I came to say.
        - id: ch01-b91
          speaker: old_gentleman
          text: Go ahead.
        - id: ch01-b92
          speaker: narrator
          text: And out came the whole story. Bobbie told him about the Russian who had written a beautiful book about poor people and had been sent to prison and Siberia for writing it.
        - id: ch01-b93
          speaker: roberta
          text: More than anything in the world, we want to find his wife and children. We don't know how. But you must be terribly clever, or you wouldn't be a Director of the Railway. If you knew how to find them, and if you would, we'd rather have that than anything. We'd even give up our watches. You could sell them and use the money to find his wife.
        - id: ch01-b94
          speaker: narrator
          text: Peter and Phyllis agreed, though with a little less enthusiasm.
        - id: ch01-b95
          speakers: [peter, phyllis]
          ensemble: duo
          text: Yes, we would.
        - id: ch01-b96
          speaker: old_gentleman
          text: Hmm. What was the name? Fryingpansky?
        - id: ch01-b97
          speaker: narrator
          text: He tugged down his white waistcoat with the large gold buttons.
        - id: ch01-b98
          speaker: roberta
          text: No, no. Let me write it. It only sounds a little like that when you say it. Do you have a pencil and the back of an envelope?
        - id: ch01-b99
          speaker: narrator
          text: The old gentleman brought out a gold pencil case and a beautiful green notebook made of sweet-smelling Russian leather. He opened it to a fresh page.
        - id: ch01-b100
          speaker: old_gentleman
          text: Write it here.
        - id: ch01-b101
          speaker: narrator
          text: Bobbie wrote down Szezcpansky.
        - id: ch01-b102
          speaker: roberta
          text: That's the spelling. You pronounce it Shepansky.
        - id: ch01-b103
          speaker: narrator
          text: He put on gold-rimmed spectacles and read the name. His whole expression changed.
        - id: ch01-b104
          speaker: old_gentleman
          text: That man? Bless my soul! I've read his book. It has been translated into every European language. It's a fine book, a noble book. And your mother took him in, like the good Samaritan. Well, well. Your mother must be a very good woman.
          emotion: surprised
        - id: ch01-b105
          speaker: phyllis
          text: Of course she is.
          emotion: surprised
        - id: ch01-b106
          speaker: roberta
          text: And you're a very good man.
        - id: ch01-b107
          speaker: narrator
          text: She was painfully shy, but determined to be polite. The old gentleman swept off his hat with a flourish.
        - id: ch01-b108
          speaker: old_gentleman
          text: You flatter me. Shall I tell you what I think of you?
        - id: ch01-b109
          speaker: roberta
          text: Oh, please don't!
        - id: ch01-b110
          speaker: old_gentleman
          text: Why not?
        - id: ch01-b111
          speaker: roberta
          text: I don't quite know. If it's horrid, I don't want to hear it. And if it's nice, I'd rather you didn't say it.
        - id: ch01-b112
          speaker: narrator
          text: The old gentleman laughed.
        - id: ch01-b113
          speaker: old_gentleman
          text: Then I'll only say I'm very glad you came to me. Very glad indeed. I may be able to learn something soon. I know many Russians in London, and every Russian knows his name. Now, tell me about yourselves.
        - id: ch01-b114
          speaker: narrator
          text: He turned to the other children, but only Peter remained. Phyllis had disappeared.
        - id: ch01-b115
          speaker: old_gentleman
          text: Tell me about yourself, then.
        - id: ch01-b116
          speaker: narrator
          text: Quite naturally, Peter could not think of a single word.
        - id: ch01-b117
          speaker: old_gentleman
          text: Very well. We'll make it an examination. You two sit on the table, I'll sit on the bench, and I'll ask the questions.
        - id: ch01-b118
          speaker: narrator
          text: So he did. Sitting on the bench, he questioned them until out came their names and ages, Father's name and occupation, how long they had lived at Three Chimneys, and a great deal more. At last, the examination began to include a herring and a half for three halfpence, and whether a pound of lead or a pound of feathers weighed more. Just then, a boot kicked the waiting-room door open. Everyone could see its lace was coming undone. Behind it came Phyllis, walking very slowly and carefully. She carried a large tin can in one hand and a thick slice of bread and butter in the other.
        - id: ch01-b119
          speaker: phyllis
          text: Afternoon tea!
        - id: ch01-b120
          speaker: narrator
          text: She proudly offered both can and bread to the old gentleman. He accepted them.
        - id: ch01-b121
          speaker: old_gentleman
          text: Bless my soul!
          emotion: surprised
        - id: ch01-b122
          speaker: phyllis
          text: Yes.
        - id: ch01-b123
          speaker: old_gentleman
          text: That was very thoughtful of you. Very thoughtful.
        - id: ch01-b124
          speaker: roberta
          text: You might have brought a cup and a plate.
        - id: ch01-b125
          speaker: phyllis
          text: Perks always drinks from the can. It was very kind of him to give me anything at all, never mind cups and plates.
        - id: ch01-b126
          speaker: narrator
          text: Phyllis flushed red.
        - id: ch01-b127
          speaker: old_gentleman
          text: I think so too.
        - id: ch01-b128
          speaker: narrator
          text: He drank some tea and tasted the bread and butter. Then his next train arrived. He climbed aboard after many good-byes and kind last words. Peter watched the red tail-lights vanish around the bend.
        - id: ch01-b129
          speaker: peter
          text: I believe we lit a candle today, like Latimer when he was burned. Before long, there'll be fireworks for our Russian.
        - id: ch01-b130
          speaker: narrator
          text: And there were. Not ten days after the meeting in the waiting room, the children sat on top of the largest rock in the field below their house. Down in the valley, they watched the 5:15 steam away from the station. They also watched the few passengers who had gotten off straggle up the road toward the village. Then one person left the road and opened the gate into the fields. That path led to Three Chimneys, and nowhere else.
        - id: ch01-b131
          speaker: peter
          text: Who on earth is that?
        - id: ch01-b132
          speaker: narrator
          text: He scrambled down from the rock.
        - id: ch01-b133
          speaker: phyllis
          text: Let's go find out.
        - id: ch01-b134
          speaker: narrator
          text: They did. As they came closer, they saw their old gentleman. His gold buttons winked in the afternoon sun, and his white waistcoat looked brighter than ever against the green field.
        - id: ch01-b135
          speakers: [roberta, peter, phyllis]
          ensemble: chorus
          text: Hello!
          emotion: happy
        - id: ch01-b136
          speaker: narrator
          text: The children waved.
        - id: ch01-b137
          speaker: old_gentleman
          text: Hello!
          emotion: happy
        - id: ch01-b138
          speaker: narrator
          text: He waved his hat. The children ran to him so fast that they barely had enough breath left to greet him properly.
        - id: ch01-b139
          speakers: [roberta, peter, phyllis]
          ensemble: chorus
          text: How do you do?
        - id: ch01-b140
          speaker: old_gentleman
          text: Good news. I've found your Russian friend's wife and child. I couldn't resist coming to tell him myself.
          emotion: happy
        - id: ch01-b141
          speaker: narrator
          text: Then he saw Bobbie's face and decided that perhaps he could resist after all.
        - id: ch01-b142
          speaker: old_gentleman
          text: Here, you run ahead and tell him. The other two can show me the way.
        - id: ch01-b143
          speaker: narrator
          text: Bobbie ran ahead. By the time she reached the quiet garden, where Mother and the Russian sat together, she was breathless. She panted out the wonderful news. Mother's face lit up so beautifully that Bobbie could hardly look away. Then Mother turned to the exile and spoke half a dozen quick words in French.
        - id: ch01-b144
          speaker: narrator
          text: Then Bobbie wished she had not been the one to carry the message. The Russian leaped up with a cry that made her heart jump and then tremble. She had never heard such a cry of love and longing. He took Mother's hand and kissed it gently and reverently. Then he sank into his chair, covered his face, and sobbed. Bobbie slipped away. Just then, she did not want to see the others.
        - id: ch01-b145
          speaker: narrator
          text: But once the endless French conversation was over, Bobbie was as cheerful as anyone. Peter raced to the village for buns and cakes. The girls prepared tea and carried it into the garden.
        - id: ch01-b146
          speaker: narrator
          text: The old gentleman was merry and delightful. He seemed able to speak French and English almost at once, and Mother nearly matched him. They had a wonderful time. Mother could not do enough for him. When he asked permission to give his little friends some goodies, she agreed immediately.
        - id: ch01-b147
          speaker: narrator
          text: The children had never heard the word goodies, but they soon guessed it meant sweets. From his bag, he brought out three large pink and green boxes tied with green ribbon. Inside were layer after unheard-of layer of beautiful chocolates.
        - id: ch01-b148
          speaker: narrator
          text: The Russian owned very little, so packing his belongings did not take long. Then they all walked with him to the station and saw him safely off. Once his train had gone, Mother turned to the old gentleman.
        - id: ch01-b149
          speaker: mother
          text: I don't know how to thank you for everything. It has been a true pleasure to meet you. But we live very quietly, and I'm afraid I can't invite you to visit us again.
        - id: ch01-b150
          speaker: narrator
          text: The children thought Mother's words were very hard. Once they had made a friend, especially a friend like this one, they dearly wanted him to come and see them again. They watched the old gentleman, but they could not tell what he thought of Mother's refusal.
        - id: ch01-b151
          speaker: old_gentleman
          text: Madam, I consider myself very fortunate to have been welcomed into your home even once.
        - id: ch01-b152
          speaker: mother
          text: I know I must sound unfriendly and ungrateful, but...
        - id: ch01-b153
          speaker: old_gentleman
          text: You could never seem anything but charming and gracious.
        - id: ch01-b154
          speaker: narrator
          text: He bowed again. As they turned up the hill, Bobbie looked at Mother's face.
        - id: ch01-b155
          speaker: roberta
          text: You look so tired, Mammy. Lean on me.
        - id: ch01-b156
          speaker: peter
          text: I should give Mother my arm. When Father's away, I'm the head man of the family.
        - id: ch01-b157
          speaker: narrator
          text: Mother took one arm from each of them. Phyllis skipped joyfully beside the three.
        - id: ch01-b158
          speaker: phyllis
          text: How wonderful to think of our dear Russian hugging his long-lost wife. The baby must have grown so much since he last saw it.
          emotion: happy
        - id: ch01-b159
          speaker: mother
          text: Yes.
        - id: ch01-b160
          speaker: phyllis
          text: I wonder if Father will think I've grown. I have grown already, haven't I, Mother?
        - id: ch01-b161
          speaker: mother
          text: Yes. Oh, yes.
          emotion: sad
        - id: ch01-b162
          speaker: narrator
          text: Bobbie and Peter felt Mother's hands tighten around their arms.
        - id: ch01-b163
          speaker: peter
          text: Poor Mammy. You really are tired.
        - id: ch01-b164
          speaker: roberta
          text: Come on, Phil. Race you to the gate!
        - id: ch01-b165
          speaker: narrator
          text: Bobbie began the race, though she hated doing it. You know why she did. Mother only thought Bobbie had grown tired of walking slowly. Even mothers, who love you better than anyone else ever will, do not always understand.
