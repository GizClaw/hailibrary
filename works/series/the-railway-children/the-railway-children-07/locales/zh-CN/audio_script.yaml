audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细微幽默和体恤
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中
    bobbie:
      display_name: 博比
      tts:
        delivery: 真诚敏锐，关切时急切而坚定
        timbre: 清亮温暖的少女声
        pace: 自然偏快
        pitch: 中高
    peter:
      display_name: 彼得
      tts:
        delivery: 爽直自信，兴奋时干脆有力
        timbre: 明亮的少年声
        pace: 明快
        pitch: 中高
    phyllis:
      display_name: 菲莉丝
      tts:
        delivery: 天真活泼，想象丰富
        timbre: 轻盈稚嫩的女孩声
        pace: 轻快
        pitch: 高
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔克制，关爱中带着坚韧
        timbre: 柔和沉静的成年女声
        pace: 从容
        pitch: 中
    station_master:
      display_name: 站长
      tts:
        delivery: 威严务实，善意藏在公事口吻下面
        timbre: 浑厚清楚
        pace: 稳重
        pitch: 中低
    superintendent:
      display_name: 区段总监
      tts:
        delivery: 正式庄重，演说时热情而清楚
        timbre: 饱满洪亮的成年男声
        pace: 稳健偏慢
        pitch: 中低
    attendee_1:
      display_name: 来宾甲
      tts:
        delivery: 热情赞许，简洁有力
        timbre: 清晰的成年男声
        pace: 明快
        pitch: 中
    attendee_2:
      display_name: 来宾乙
      tts:
        delivery: 真诚赞许，响应自然
        timbre: 温厚的成年女声
        pace: 明快
        pitch: 中
    old_gentleman:
      display_name: 老先生
      tts:
        delivery: 慈祥风趣，说话得体又亲切
        timbre: 温厚清朗的老年男声
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 博比的心事与来信
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 希望你不会嫌我讲太多罗伯塔的事。我越看她，就越喜欢她，因为她身上总有新的可爱之处。她急着想让别人快活，还特别会保守秘密。更难得的是，她懂得怎样安安静静地心疼一个人。这话也许听着有点乏味，意思其实很简单。你知道别人在难过，便更爱他一些，却不会一次次追着他说，自己有多么替他难过。博比就是这样。她知道妈妈心里难过，也知道妈妈不愿说原因。所以，她只是更爱妈妈，从不拿问题去烦她，也不让妈妈发觉，她心里其实急切地想知道答案。这需要练习，可没有听上去那么容易。
        - id: ch01-b02
          speaker: narrator
          text: 日子里照样有野餐、游戏和下午茶的圆面包，可博比心底始终响着同一支曲子。妈妈不快乐。为什么？我不知道。她不想让我知道，我也不会去打听。可她的确不快乐。这支曲子找不到停下的地方，一遍又一遍地响着。
        - id: ch01-b03
          speaker: narrator
          text: 那位俄国先生也一直叫大家挂心。编辑、协会秘书和国会议员都客客气气地回了妈妈的信，却没有一个人知道谢泽潘斯基先生的妻子儿女在哪里。对了，他有个听起来十足俄国味的名字。
        - id: ch01-b04
          speaker: narrator
          text: 博比还有一种性情。有人叫它多管闲事，有人说这是“扶瘸腿狗过栅栏”，还有人称它为仁爱。说到底，她就是总想帮人。她拼命想办法替俄国先生找到家人，却怎么也想不出来。
        - id: ch01-b05
          speaker: narrator
          text: 他已经学会了几个英语词，会说早安、晚安、请和谢谢。收到花时，他会说漂亮。别人问他夜里睡得怎样，他会笑着回答，很好。博比觉得他说这些词的样子可爱得没法说。她常常想着那张脸，希望办法会自己冒出来。办法并没有来，不过他住在这里，妈妈倒比以前快活了一些，这让博比很安慰。
        - id: ch01-b06
          speaker: bobbie
          text: 除了我们，妈妈也喜欢有别人可以照顾。我知道，她把爸爸的衣服给他穿，心里肯定很难受。可我想，那是一种“叫人好受的难受”。不然，妈妈就不会把衣服拿出来了。
        - id: ch01-b07
          speaker: narrator
          text: 自从三个孩子挥起红法兰绒小旗，救下那列险些失事的火车，博比好多个夜里都会尖叫着醒来，浑身发抖。梦里，她又看见那堆可怕的土石，还有那辆可怜又可爱的机车。它满心信赖着前方的铁路，以为自己正在尽职尽责，以为一路都平安无事，就那样朝土石堆飞驰而去。接着，博比会想起，她、彼得、菲莉丝和那些红法兰绒衬裙，真的救了车上所有人。一股暖暖的喜悦又会流遍她全身。
        - id: ch01-b08
          speaker: narrator
          text: 一天早晨，一封信送到了。信封上写着彼得、博比和菲莉丝三个人的名字。他们很少收到信，拆开时又好奇又兴奋。铁路公司在信里说，他们及时向列车发出警告，表现得英勇又果断，避免了一场本来会非常惨重的事故。公司想送他们一点礼物，请他们在本月三十日下午三点到车站参加赠礼仪式。署名是大北方与南方铁路公司秘书杰贝兹·英格尔伍。
        - id: ch01-b09
          speaker: narrator
          text: 三个孩子从没这样骄傲过。他们拿着信跑去找妈妈。妈妈也很骄傲，还亲口告诉了他们，这叫孩子们更快活了。
        - id: ch01-b10
          speaker: mother
          text: 不过，礼物要是钱，你们就得说，谢谢，可我们不能收。我马上去洗你们的印度细棉布衣服。参加这样的仪式，一定要穿整齐。
        - id: ch01-b11
          speaker: bobbie
          text: 妈妈，只要你帮我们熨，我和菲尔可以自己洗。
    - id: ch02
      title: 细棉布裙和粉红信纸
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 洗衣服其实很有趣。这一次，姐妹俩在后厨房里洗。那里铺着石地板，窗下有一只很大的石水槽。
        - id: ch02-b02
          speaker: phyllis
          text: 把澡盆架到水槽上吧。这样，我们就能假装是妈妈在法国见过的那些露天洗衣女人了。
        - id: ch02-b03
          speaker: peter
          text: 人家是在冰冷的河水里洗，又不是用热水。
        - id: ch02-b04
          speaker: phyllis
          text: 那这就是一条热水河。来帮帮我吧，你这只好心的小鹿。
        - id: ch02-b05
          speaker: peter
          text: 我倒想瞧瞧，小鹿怎么拿蹄子帮你。
        - id: ch02-b06
          speaker: narrator
          text: 不过，彼得还是伸手帮了忙。
        - id: ch02-b07
          speaker: phyllis
          text: 现在就是搓呀洗呀，再洗呀搓呀！
          emotion: happy
        - id: ch02-b08
          speaker: narrator
          text: 菲莉丝快活地蹦来蹦去。博比正小心地从厨房火炉上提来一只沉甸甸的水壶。
        - id: ch02-b09
          speaker: bobbie
          text: 啊，不行！细棉布可不能搓。要把煮过的肥皂放进热水，搅出一大堆泡沫，再把细棉布放进去，轻轻地抖，轻轻地挤。污渍自己就会掉下来。只有桌布和床单那些笨重的东西才需要搓呢。
          emotion: surprised
        - id: ch02-b10
          speaker: narrator
          text: 窗外，丁香和第戎荣耀玫瑰在软软的风里摇着。
        - id: ch02-b11
          speaker: bobbie
          text: 今天正适合晾衣服，这可真不错。哎呀，等我们穿上那些细棉布裙子，心里会是什么感觉呢？
        - id: ch02-b12
          speaker: phyllis
          text: 是呀，我也想知道。
        - id: ch02-b13
          speaker: narrator
          text: 菲莉丝抖着、挤着细棉布，看上去像个熟练的洗衣工。
        - id: ch02-b14
          speaker: bobbie
          text: 现在把肥皂水挤出去。不对，不能拧。然后再漂洗。我拿着衣服，你和彼得把澡盆倒空，再换上清水。
        - id: ch02-b15
          speaker: narrator
          text: 姐妹俩洗干净衣夹，擦过晾衣绳，这才把裙子挂上去。彼得站在旁边，心里只想着“赠礼仪式”这几个字。
        - id: ch02-b16
          speaker: peter
          text: 既然是赠礼仪式，那就真有礼物了。到底会是什么？
        - id: ch02-b17
          speaker: phyllis
          text: 什么都有可能呀。我一直想要一头小象，可惜他们大概不知道。
        - id: ch02-b18
          speaker: bobbie
          text: 会不会是一辆金子做的蒸汽机车模型？
        - id: ch02-b19
          speaker: peter
          text: 或者是一大套救火车现场的模型。里面有小火车，还有打扮成我们、司机、司炉和乘客的玩偶。
        - id: ch02-b20
          speaker: narrator
          text: 博比用后厨房门背滚轴上的粗毛巾擦着手，问得有些犹豫。
        - id: ch02-b21
          speaker: bobbie
          text: 我们因为救了火车得到奖赏，你们真的喜欢吗？
        - id: ch02-b22
          speaker: peter
          text: 当然喜欢。你也别装成不喜欢来骗我们。我知道你心里喜欢。
        - id: ch02-b23
          speaker: bobbie
          text: 是的，我知道自己是喜欢。可我们既然救下了火车，难道不该已经很满足，不再想要别的东西吗？
        - id: ch02-b24
          speaker: peter
          text: 谁想要别的东西了，傻瓜？拿维多利亚十字勋章的军人也没开口讨要，真拿到时不也一样高兴吗？说不定礼物就是勋章。等我老得不得了，我会拿给孙子孙女看，还要告诉他们，我们当时只是尽了自己的责任。他们一定会为我骄傲得不得了。
        - id: ch02-b25
          speaker: phyllis
          text: 那你先得结婚。不结婚，哪来的孙子孙女？
        - id: ch02-b26
          speaker: peter
          text: 我想，总有一天我只好结婚。可成天有个妻子在旁边，多麻烦呀。我想娶一位会长睡不醒的太太，一年只醒一两回。
        - id: ch02-b27
          speaker: bobbie
          text: 她每次醒来，只说你是她生命里的光，然后又睡过去。对，这样倒不错。
        - id: ch02-b28
          speaker: phyllis
          text: 等我结婚，我要他盼着我一直醒着。这样，我就能听他不停地说我有多好。
        - id: ch02-b29
          speaker: bobbie
          text: 我倒觉得，嫁给一个很穷的人一定很好。你替他做完所有的活，他就会爱你爱得不得了。每天晚上，他做完工回家，远远看见树林间飘起一缕蓝色的柴烟，就知道那是自家炉火的烟。哎呀，我们得回信，告诉他们那个时间和地点很方便。肥皂给你，彼得。我和菲尔都洗干净了。菲尔，去拿你生日收到的粉红信纸。
        - id: ch02-b30
          speaker: narrator
          text: 妈妈已经回去写作了。三个孩子商量了好一阵，糟蹋了好几张粉红信纸。那些纸边是金色的扇贝花纹，一角还印着绿色四叶草。最后，他们总算想好了该写什么。然后，每个人都把同样的话照抄一份，再在自己那封信上签下名字。
        - id: ch02-b31
          speakers: [peter, bobbie, phyllis]
          ensemble: chorus
          text: 亲爱的杰贝兹·英格尔伍先生，非常感谢您。我们并不是为了得到奖赏，只是想救下火车。不过，既然您觉得应该这样做，我们很高兴，也非常感谢。您说的时间和地点对我们都很方便。您亲爱的小朋友。又及，非常感谢您。
        - id: ch02-b32
          speaker: narrator
          text: 当然，三封信上分别写着三个人的名字。可他们把“小朋友”的“友”字写错了。
        - id: ch02-b33
          speaker: bobbie
          text: 等那些洗净的裙子全都晒干，博比便把它们一件件从晾衣绳上收下来。洗衣服比熨衣服容易多了。我真喜欢看着东西一点点变干净。哎呀，还要等那么久才知道礼物是什么，我们怎么熬得到那天！
    - id: ch03
      title: 金表与掌声
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 好像等了一段漫长得不得了的日子，那一天终于到了。三个孩子按时来到车站，之后的一切都奇奇怪怪的，像一场梦。站长出来迎接他们。彼得一眼就看出，站长穿了自己最体面的衣服。他领着孩子们走进从前玩过广告游戏的候车室。
        - id: ch03-b02
          speaker: narrator
          text: 候车室完全变了模样。地上铺着地毯，壁炉台和窗台摆满了玫瑰。带画框的广告上方都插着绿枝。那几幅广告分别是库克旅行社、《德文郡美景》，还有巴黎到里昂的铁路线。枝叶翠绿，看起来像圣诞节时装饰屋子的冬青和月桂。车站上的工作人员都来了，还有几位穿着漂亮的太太，以及一大群戴高帽、穿长礼服的先生。其中有好几张熟脸，都是红法兰绒衬裙那天车上的乘客。最好的是，他们自己的老先生也来了。他的外套、帽子和衣领还是那样与众不同。他和孩子们握了手，大家便各自坐好。
        - id: ch03-b03
          speaker: narrator
          text: 一位戴眼镜的先生站起来，做了一篇又长又高明的演说。后来，孩子们才知道他是区段总监。我可不想把整篇演说再讲一遍。你听了会觉得闷，而且他把孩子们夸得满脸通红，连耳朵都烫了。我很想赶快把这个话题岔开。再说，他用了太多话才把意思说完，我可没工夫全部重复。
        - id: ch03-b04
          speaker: superintendent
          text: 这三位年轻的朋友表现出了难得的勇气和机敏。正是他们及时采取行动，才避免了一场可怕的事故。
        - id: ch03-b05
          speaker: narrator
          text: 区段总监总算讲完，坐了下来。屋里顿时响起掌声。
        - id: ch03-b06
          speakers: [attendee_1, attendee_2]
          ensemble: duo
          text: 说得好！说得好！
          emotion: happy
        - id: ch03-b07
          speaker: narrator
          text: 接着，老先生也站起来说了几句。那情形很像学校里颁奖。他一个个叫出孩子们的名字，送给每人一只漂亮的金表和一条表链。每只表壳里都刻着新主人的名字，还写明这是北方与南方铁路公司董事会赠送的，用来感谢他们在一九〇五年某月某日英勇果断地采取行动，阻止了事故。
        - id: ch03-b08
          speaker: narrator
          text: 那些表简直比你能想到的还要漂亮。每只表都有一个蓝皮盒子。平时不用的时候，表就住在里面。
        - id: ch03-b09
          speaker: station_master
          text: 现在该你说几句，谢谢大家的好意了。开头先说“女士们、先生们”。
        - id: ch03-b10
          speaker: narrator
          text: 站长贴着彼得的耳朵低声说完，便把他往前推了一把。其实，三个孩子早已经规规矩矩地说过谢谢了。
        - id: ch03-b11
          speaker: peter
          text: 哎呀。
        - id: ch03-b12
          speaker: narrator
          text: 彼得倒没有躲开那一推。他开口时声音有点沙哑，只说了一句“女士们、先生们”，就再也接不下去了。他只听见自己的心在嗓子眼里怦怦地跳。突然，他一鼓作气地说了下去。
        - id: ch03-b13
          speaker: peter
          text: 女士们、先生们，你们实在太好了。我们一辈子都会珍惜这些表。可说真的，我们不值得拿，因为我们做的实在算不了什么。至少，我是说，当时的确刺激极了，而我想说的是……非常、非常感谢大家。
        - id: ch03-b14
          speaker: narrator
          text: 大家给彼得的掌声，比刚才给区段总监的还要响。接着，屋里的人一个接一个地走上前，同三个孩子一一握手。好不容易把该尽的礼数都尽完，孩子们立刻脱身，手里紧紧攵着刚收到的金表，一口气冲上山坡，跑回了三烟囱。
        - id: ch03-b15
          speaker: narrator
          text: 这真是奇妙的一天。这样的日子很少会落到谁头上，我们大多数人一辈子连一次也碰不到。
        - id: ch03-b16
          speaker: bobbie
          text: 我原本还想跟老先生谈另外一件事。可那里人太多了，而且庄严得像教堂一样。
        - id: ch03-b17
          speaker: phyllis
          text: 你想说什么？
        - id: ch03-b18
          speaker: bobbie
          text: 等我再想清楚一点，就告诉你。
        - id: ch03-b19
          speaker: narrator
          text: 博比又想了一阵，然后给老先生写了一封信。
        - id: ch03-b20
          speaker: bobbie
          text: 我最最亲爱的老先生，我非常非常想求您一件事。如果您能下火车，改坐下一班，那就可以了。我不是想让您送我什么。妈妈说我们不应该这样，再说，我们也不想要任何东西。我们只想跟您谈谈一位囚犯和流亡者。您亲爱的小朋友，博比。
    - id: ch04
      title: 请老先生帮忙
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 博比请站长把信交给老先生。第二天，老先生从城里坐来的那班火车快要进站时，她叫上彼得和菲莉丝一起去车站。博比把自己的主意说了出来，两个人都全心全意地赞成。
        - id: ch04-b02
          speaker: narrator
          text: 三个孩子洗净手脸，梳好头发，尽量打扮得整整齐齐。偏偏菲莉丝又倒霉了。她把一罐柠檬水泼到衣襟上，已经来不及换衣服。风还恰好从煤场那边吹来，很快又给裙子蒙上一层灰。煤灰粘在柠檬水的黏斑上。
        - id: ch04-b03
          speaker: peter
          text: 你现在活像个刚从阴沟里钻出来的小野孩。
        - id: ch04-b04
          speaker: narrator
          text: 大家决定，菲莉丝最好尽量躲在另外两个人身后。
        - id: ch04-b05
          speaker: bobbie
          text: 也许老先生不会注意。上了年纪的人，眼睛常常不大好。
        - id: ch04-b06
          speaker: narrator
          text: 可老先生一下火车，就向站台两头张望。不管是他的眼睛，还是全身上下，都看不出一点儿衰弱。三个孩子事到临头，忽然害羞得厉害。那羞意又深又急，烧得他们耳朵通红，双手潮湿，连鼻尖都变得粉红发亮。
        - id: ch04-b07
          speaker: phyllis
          text: 哎呀，我的心跳得像蒸汽机一样，正好就在腰带下面怦怦响。
        - id: ch04-b08
          speaker: peter
          text: 胡说。人的心又不长在腰带下面。
        - id: ch04-b09
          speaker: phyllis
          text: 我才不管呢，我的就在那里。
        - id: ch04-b10
          speaker: peter
          text: 你要像诗集那样说话，那我的心已经跳到嗓子眼了。
        - id: ch04-b11
          speaker: bobbie
          text: 那我的心都沉进靴子了。不过，我们快过去吧。不然，他会觉得我们是傻瓜。
        - id: ch04-b12
          speaker: peter
          text: 那他也没想错多少。
        - id: ch04-b13
          speaker: narrator
          text: 三个孩子只得走上前去。
        - id: ch04-b14
          speaker: old_gentleman
          text: 你们好啊！见到你们，我真是太高兴了。
          emotion: happy
        - id: ch04-b15
          speaker: narrator
          text: 老先生依次同他们握手。
        - id: ch04-b16
          speaker: bobbie
          text: 您肯下车，实在太好了。
        - id: ch04-b17
          speaker: narrator
          text: 博比一边冒汗，一边彬彬有礼地说。老先生挽住她的胳膊，把她领进候车室。彼得和菲莉丝跟在后面。老先生和气地轻轻晃了晃博比的胳膊，这才松开手。
        - id: ch04-b18
          speaker: old_gentleman
          text: 说吧，是什么事？
        - id: ch04-b19
          speaker: bobbie
          text: 啊，求求您！
        - id: ch04-b20
          speaker: old_gentleman
          text: 说吧。
        - id: ch04-b21
          speaker: bobbie
          text: 我想说的是……
        - id: ch04-b22
          speaker: old_gentleman
          text: 嗯？
        - id: ch04-b23
          speaker: bobbie
          text: 这一切都很好，大家也都很亲切。
        - id: ch04-b24
          speaker: old_gentleman
          text: 可是呢？
        - id: ch04-b25
          speaker: bobbie
          text: 我希望自己能把一件事说出来。
        - id: ch04-b26
          speaker: old_gentleman
          text: 那就说出来。
        - id: ch04-b27
          speaker: bobbie
          text: 那好吧。
        - id: ch04-b28
          speaker: narrator
          text: 于是，俄国先生的故事一下子全涌了出来。他写了一本讲穷人的好书，却只因为这件事就被抓进监狱，又被流放到西伯利亚。
        - id: ch04-b29
          speaker: bobbie
          text: 我们在世上最盼望的事，就是帮他找到妻子和孩子。可我们不知道该怎么办。您肯定聪明得不得了，不然就当不上铁路公司的董……董事。要是您知道办法，也愿意帮忙，那就比世上任何东西都好。只要能卖掉金表，用那些钱替他找妻子，我们连表也可以不要。
        - id: ch04-b30
          speaker: narrator
          text: 彼得和菲莉丝也说，他们愿意卖掉金表，只是话没有博比说得那么热烈。老先生往下拉了拉那件钉着大号镀金纽扣的白背心。
        - id: ch04-b31
          speaker: old_gentleman
          text: 唉，你说他叫什么来着？煎锅斯基？
        - id: ch04-b32
          speaker: bobbie
          text: 不，不是。我写给您看。这个名字写出来一点也不像“煎锅斯基”，就是念起来有一点像。您有没有一小截铅笔，还有信封背面可以借我写字？
        - id: ch04-b33
          speaker: narrator
          text: 老先生拿出一支金笔杆铅笔，又掏出一本漂亮的绿皮笔记本。本子是俄国皮革做的，散发着好闻的香气。他翻到崭新的一页。
        - id: ch04-b34
          speaker: old_gentleman
          text: 来，写在这里。
        - id: ch04-b35
          speaker: narrator
          text: 博比写下了“谢泽潘斯基”。
        - id: ch04-b36
          speaker: bobbie
          text: 这是他的名字，念起来叫“舍潘斯基”。
        - id: ch04-b37
          speaker: narrator
          text: 老先生取出一副金丝眼镜，架到鼻梁上。等他看清那个名字，整个人的神情都变了。
        - id: ch04-b38
          speaker: old_gentleman
          text: 原来是他？我的天哪！我读过他的书！欧洲每一种语言都有译本。那是一本好书，一本高尚的书。你们的妈妈收留了他，就像那位善心的撒马利亚人。孩子们，我得告诉你们，你们的妈妈一定是个非常好的人。
          emotion: surprised
        - id: ch04-b39
          speaker: phyllis
          text: 她当然是呀。
          emotion: surprised
        - id: ch04-b40
          speaker: bobbie
          text: 您也是一位非常好的人。
        - id: ch04-b41
          speaker: narrator
          text: 博比害羞得厉害，可她已经拿定主意，一定要有礼貌。老先生潇洒地脱帽行了一礼。
        - id: ch04-b42
          speaker: old_gentleman
          text: 你过奖了。现在，要不要我也说说自己对你们的看法？
        - id: ch04-b43
          speaker: bobbie
          text: 啊，请您千万别说。
        - id: ch04-b44
          speaker: old_gentleman
          text: 为什么？
        - id: ch04-b45
          speaker: bobbie
          text: 我也说不清。不过，要是不好的话，我不想听。要是好话，我也宁愿您别说。
        - id: ch04-b46
          speaker: narrator
          text: 老先生笑了。
        - id: ch04-b47
          speaker: old_gentleman
          text: 好吧，那我只说一句。你们肯为这件事来找我，我非常高兴，真的非常高兴。说不定，我们很快就能查到什么。我在伦敦认识很多俄国人，他们每一个都知道这个名字。现在，给我讲讲你们自己的事吧。
          emotion: happy
        - id: ch04-b48
          speaker: narrator
          text: 老先生转向另外两个孩子，可这时只剩下彼得了。菲莉丝已经不见了。
        - id: ch04-b49
          speaker: old_gentleman
          text: 那就跟我讲讲你自己吧。
        - id: ch04-b50
          speaker: narrator
          text: 彼得当然立刻一句话也说不出来了。
        - id: ch04-b51
          speaker: old_gentleman
          text: 好吧，那我们来考试。你们两个坐在桌上，我坐长凳，由我来问问题。
        - id: ch04-b52
          speaker: narrator
          text: 他果真照这个办法坐好了。博比和彼得的姓名、年龄，父亲的名字和职业，一家人在三烟囱住了多久，还有好多别的事，全都给问了出来。问题慢慢转到三个半便士能不能买一条半鲱鱼，还有一磅铅和一磅羽毛究竟哪个更重。就在这时，一只靴子踢开候车室的门。靴子刚伸进来，大家就看见它的鞋带已经松了。接着，菲莉丝非常缓慢、非常小心地走了进来。她一只手提着大锡罐，另一只手拿着一片厚厚的黄油面包。
        - id: ch04-b53
          speaker: phyllis
          text: 下午茶来了。
          emotion: happy
        - id: ch04-b54
          speaker: narrator
          text: 她骄傲地宣布完，把锡罐和黄油面包递给老先生。
        - id: ch04-b55
          speaker: old_gentleman
          text: 我的天哪！
          emotion: surprised
        - id: ch04-b56
          speaker: phyllis
          text: 是呀。
        - id: ch04-b57
          speaker: old_gentleman
          text: 你想得真周到，真的很周到。
        - id: ch04-b58
          speaker: bobbie
          text: 可你应该拿一只杯子，还有一个盘子。
        - id: ch04-b59
          speaker: phyllis
          text: 帕克斯一向用锡罐喝茶。他肯把这些借给我已经很好了，更别说杯子和盘子了。
        - id: ch04-b60
          speaker: old_gentleman
          text: 我也是这么想的。
        - id: ch04-b61
          speaker: narrator
          text: 老先生喝了一些茶，又尝了尝黄油面包。下一班火车快到了。他对孩子们说了好多遍再见，又留下一大堆亲切的话，这才上车离开。
        - id: ch04-b62
          speaker: narrator
          text: 三个孩子留在站台上，一直看着火车的尾灯绕过弯道，消失不见。
        - id: ch04-b63
          speaker: peter
          text: 好啦，依我看，我们今天点亮了一根蜡烛。你们知道，就像拉蒂默受火刑时说的那样。用不了多久，这根蜡烛就会替我们的俄国先生放出烟火了。
    - id: ch05
      title: 好消息
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 事情果然这样发展了。候车室里那场谈话过去还不到十天，三个孩子正坐在屋子下方的田野里，就坐在最大的那块岩石顶上。他们看着五点十五分的火车喷着白汽开出车站，沿着谷底向前驶去。几个下车的人慢吞吞地沿大路走向村子。其中一个人离开大路，打开了通往田野的小门。穿过那片田野，只能去三烟囱，没有第二个去处。
        - id: ch05-b02
          speaker: peter
          text: 那到底是谁呀！
        - id: ch05-b03
          speaker: narrator
          text: 彼得说着，从岩石上爬了下来。
        - id: ch05-b04
          speaker: phyllis
          text: 我们去看看吧。
        - id: ch05-b05
          speaker: narrator
          text: 他们跑过去看。走得足够近时，终于认出那人就是自己的老先生。他衣服上的铜纽扣在午后阳光里眨着眼，白背心衬着田野的绿色，看起来比往常还要白。
        - id: ch05-b06
          speakers: [peter, bobbie, phyllis]
          ensemble: chorus
          text: 你——好！
          emotion: happy
        - id: ch05-b07
          speaker: narrator
          text: 孩子们挥着手，拖长声音喊他。
        - id: ch05-b08
          speaker: old_gentleman
          text: 你——们——好！
          emotion: happy
        - id: ch05-b09
          speaker: narrator
          text: 老先生也挥着帽子喊了回来。三个孩子拔腿就跑。等好不容易奔到他面前，他们已经几乎没力气说话了。
        - id: ch05-b10
          speakers: [peter, bobbie, phyllis]
          ensemble: chorus
          text: 您好！
        - id: ch05-b11
          speaker: old_gentleman
          text: 有好消息。我找到你们那位俄国朋友的妻子和孩子了。我实在抵挡不住这个诱惑，非得亲自来，好好享受一下把消息告诉他的快乐。
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: 可他一看见博比的脸，就觉得这个诱惑也不是完全抵挡不了。
        - id: ch05-b13
          speaker: old_gentleman
          text: 来，博比，你先跑回去告诉他。另外两个给我带路。
        - id: ch05-b14
          speaker: narrator
          text: 博比跑了。她上气不接下气地把消息告诉了坐在宁静花园里的俄国先生和妈妈。妈妈的脸顿时亮得好美，接着飞快地用法语对他说了五六句话。
        - id: ch05-b15
          speaker: narrator
          text: 就在这时，博比忽然后悔是自己带来了这个消息。俄国先生猛地站起来，发出一声呼喊。博比的心也跟着一跃，随后又颤抖起来。她从没听过这样的声音。那里面装满了爱，也装满了思念。他拉起妈妈的手，温柔又恭敬地吻了吻，然后跌坐回椅子里，双手蒙住脸，放声大哭。博比悄悄地走开了。这一刻，她不愿意见到任何人。
        - id: ch05-b16
          speaker: narrator
          text: 没完没了的法语谈话终于结束。彼得飞奔到村里买来圆面包和蛋糕，姑娘们预备好茶点，端到花园里。这时，博比就和大家一样快活了。
        - id: ch05-b17
          speaker: narrator
          text: 老先生既风趣又可爱。他好像能在同一时刻既说法语，又说英语，妈妈也差不多有这样的本领。那段时光快活极了。妈妈好像怎么款待老先生都觉得不够。他问，能不能送几位小朋友一些“好吃的”，妈妈马上答应了。
        - id: ch05-b18
          speaker: narrator
          text: 孩子们从没听过这种说法，不过他们猜得到，那指的就是糖果。果然，老先生从提包里拿出三只粉绿相间的大盒子，每只上面都系着绿丝带。盒子里装着一层又一层漂亮的巧克力，多得超过他们听说过的任何一盒。
        - id: ch05-b19
          speaker: narrator
          text: 俄国先生那几件不多的行李很快收拾好了，大家一起到车站送他。他就要去和妻子儿女团聚了。
        - id: ch05-b20
          speaker: mother
          text: 您为我们做了这么多，我真不知道该怎么谢您。今天能见到您，我也真的很高兴。可我们过的是很清静的日子。实在对不起，我不能请您以后再来看我们。
        - id: ch05-b21
          speaker: narrator
          text: 孩子们听了，心里难受极了。他们好不容易才交到这样一位朋友，当然非常想让他以后再来。可老先生心里怎么想，他们完全猜不出来。
        - id: ch05-b22
          speaker: old_gentleman
          text: 夫人，能有幸到您家做一次客，我已经觉得自己十分幸运了。
        - id: ch05-b23
          speaker: mother
          text: 唉，我知道自己看起来一定很冷淡，也很不知感激。可是……
        - id: ch05-b24
          speaker: old_gentleman
          text: 您永远都只会是一位最可爱、最和善的女士。
        - id: ch05-b25
          speaker: narrator
          text: 老先生说着，又向妈妈鞠了一躬。大家转身往山坡上走时，博比看见了妈妈的脸。
        - id: ch05-b26
          speaker: bobbie
          text: 妈妈，你看起来好累。靠着我走吧。
        - id: ch05-b27
          speaker: peter
          text: 应该由我来扶妈妈。爸爸不在家的时候，我就是家里的男主人。
        - id: ch05-b28
          speaker: narrator
          text: 妈妈一边挽住一只胳膊。
        - id: ch05-b29
          speaker: phyllis
          text: 想到亲爱的俄国先生正抱着好久没见的妻子，真让人高兴极了。他上次看见那个小宝宝以后，宝宝一定长大了好多。
          emotion: happy
        - id: ch05-b30
          speaker: narrator
          text: 菲莉丝一路快活地蹦跳着。
        - id: ch05-b31
          speaker: mother
          text: 是呀。
        - id: ch05-b32
          speaker: phyllis
          text: 不知道爸爸会不会觉得我也长大了。我已经长大了，对不对，妈妈？
        - id: ch05-b33
          speaker: narrator
          text: 菲莉丝蹦跳得更加欢快了。
        - id: ch05-b34
          speaker: mother
          text: 是的。啊，是的。
        - id: ch05-b35
          speaker: narrator
          text: 博比和彼得都觉得，妈妈挽着他们胳膊的手忽然收紧了。
        - id: ch05-b36
          speaker: peter
          text: 可怜的妈妈，你真的累坏了。
        - id: ch05-b37
          speaker: bobbie
          text: 来吧，菲尔！我们赛跑，看谁先到大门口。
        - id: ch05-b38
          speaker: narrator
          text: 博比说完就跑了起来，虽然她心里一点也不想跑。你知道博比为什么要这样做。可妈妈只以为自己走得太慢，博比等得不耐烦了。
        - id: ch05-b39
          speaker: narrator
          text: 就连妈妈也不是每一次都能明白。要知道，妈妈可是世上比任何人都更爱你的人。
