audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细微幽默和体恤
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中
    bobbie:
      display_name: 博比
      tts:
        delivery: 真诚敏锐，关切时急切而坚定
        timbre: 清亮温暖的少女声
        pace: 自然偏快
        pitch: 中高
    peter:
      display_name: 彼得
      tts:
        delivery: 爽直自信，兴奋时干脆有力
        timbre: 明亮的少年声
        pace: 明快
        pitch: 中高
    phyllis:
      display_name: 菲莉丝
      tts:
        delivery: 天真活泼，想象丰富
        timbre: 轻盈稚嫩的女孩声
        pace: 轻快
        pitch: 高
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔镇定，讲到苦难时克制而悲悯
        timbre: 温润清晰
        pace: 从容
        pitch: 中
    jim:
      display_name: 吉姆
      tts:
        delivery: 坦率要强，受伤时虚弱却不失少年气
        timbre: 清朗略带粗粝的少年声
        pace: 适中
        pitch: 中
    signalman:
      display_name: 信号员
      tts:
        delivery: 粗直疲惫，慌乱时急促而失控
        timbre: 厚重沙哑的成年男声
        pace: 适中偏慢
        pitch: 低
    farm_steward:
      display_name: 农场管事
      tts:
        delivery: 务实稳重，话里带一点乡间式诙谐
        timbre: 结实温厚的成年男声
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 隧道里的伤员
      blocks:
        - id: ch01-b01
          speakers: [bobbie, peter, phyllis]
          ensemble: chorus
          text: 哦，睁开眼睛吧！跟我说句话！看在我的分上，说句话呀！
          emotion: fearful
        - id: ch01-b02
          speaker: narrator
          text: 三个孩子守着那只穿红毛衣、昏迷不醒的“猎犬”，把这几句话喊了一遍又一遍。男孩背靠隧道壁坐着，双眼紧闭，脸白得没有一点血色。
        - id: ch01-b03
          speaker: bobbie
          text: 用牛奶把他的耳朵弄湿吧。人晕倒了，大人会拿古龙水这样做。我想牛奶也能管用。
        - id: ch01-b04
          speaker: narrator
          text: 他们照博比说的做了，往男孩耳朵上抹牛奶。有些牛奶顺着脖子，一直流进红毛衣里。隧道里黑得厉害，彼得带来的蜡烛头立在一块平石上，那点火苗几乎什么也照不见。
        - id: ch01-b05
          speaker: phyllis
          text: 你倒是睁开眼呀，看在我的分上！我觉得……我觉得他死了。
          emotion: fearful
        - id: ch01-b06
          speaker: bobbie
          text: 也看在我的分上。不会的，他没有死。
        - id: ch01-b07
          speaker: peter
          text: 看在谁的分上都好，快醒醒！
        - id: ch01-b08
          speaker: narrator
          text: 彼得抓住伤员的胳膊摇了摇。穿红毛衣的男孩终于叹了口气。他睁开眼，又闭上了。
        - id: ch01-b09
          speaker: jim
          text: 别……别折腾了。
        - id: ch01-b10
          speaker: phyllis
          text: 哦，他没死！我早就知道他没死。
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: 菲莉丝说着，反倒哭了起来。
        - id: ch01-b12
          speaker: jim
          text: 怎么回事？我好好的。
        - id: ch01-b13
          speaker: peter
          text: 把这个喝下去。
        - id: ch01-b14
          speaker: narrator
          text: 彼得说得不容商量，把牛奶瓶口塞进男孩嘴里。男孩挣扎着洒出一些，好不容易才腾出嘴来。
        - id: ch01-b15
          speaker: jim
          text: 这到底是什么？
        - id: ch01-b16
          speaker: peter
          text: 牛奶。别害怕，你现在是在朋友手里。菲尔，别再咩咩地哭了。
        - id: ch01-b17
          speaker: bobbie
          text: 喝一点吧，对你有好处。
        - id: ch01-b18
          speaker: narrator
          text: 男孩终于肯喝了。三个孩子全站在旁边，谁也不跟他说话，只让他安安静静地歇着，等牛奶在身体里起作用。
        - id: ch01-b19
          speaker: peter
          text: 让他歇一会儿。等牛奶像火一样流遍全身，他就会好了。
        - id: ch01-b20
          speaker: narrator
          text: 果然，男孩缓了过来。
        - id: ch01-b21
          speaker: jim
          text: 我好多了，也全想起来了。
        - id: ch01-b22
          speaker: narrator
          text: 他试着动了一下，立刻疼得呻吟起来。
        - id: ch01-b23
          speaker: jim
          text: 真倒霉！我的腿恐怕断了。
        - id: ch01-b24
          speaker: phyllis
          text: 你是摔倒了吗？
        - id: ch01-b25
          speaker: jim
          text: 当然不是，我又不是小娃娃！是那些讨厌的铁丝绊住了我。我想站起来，可怎么也站不住，只好坐下。哎哟，真疼！你们怎么会跑到这里？
          emotion: angry
        - id: ch01-b26
          speaker: peter
          text: 我们看见你们都进了隧道，就翻过山，等着看你们从另一头出来。别人都出来了，只有你没出来。所以，我们就成了救援队。
        - id: ch01-b27
          speaker: jim
          text: 你们胆子可真大，这我得承认。
        - id: ch01-b28
          speaker: peter
          text: 哦，也没什么。我们扶着你，你能走吗？
        - id: ch01-b29
          speaker: jim
          text: 我可以试试。
        - id: ch01-b30
          speaker: narrator
          text: 他当真试着站了起来。可他只能靠一只脚支撑身体，另一条腿以一种很吓人的样子拖在地上，根本没法迈步。
        - id: ch01-b31
          speaker: jim
          text: 让我坐下，我难受得快死了。放开我……快放手……
          emotion: fearful
        - id: ch01-b32
          speaker: narrator
          text: 他躺下去，闭上了眼睛。借着蜡烛那点昏暗的光，另外三个孩子你看看我，我看看你。
        - id: ch01-b33
          speaker: peter
          text: 这可怎么办？
        - id: ch01-b34
          speaker: bobbie
          text: 听我说，你们得去找人帮忙。去最近的房子！
        - id: ch01-b35
          speaker: peter
          text: 对，只能这样了。走吧。
        - id: ch01-b36
          speaker: bobbie
          text: 你抬他的脚，我和菲尔抬头。先把他搬到检修口去。
        - id: ch01-b37
          speaker: narrator
          text: 三个孩子照着做了。他们一个抬脚，两个抬头，把伤员搬到了检修口。对吉姆来说，幸好搬动时他又昏了过去。
        - id: ch01-b38
          speaker: bobbie
          text: 好了，我留下陪他。你们把最长的蜡烛拿走。一定要快，我这一截撑不了多久。
        - id: ch01-b39
          speaker: peter
          text: 妈妈大概不会愿意让我把你独自留下。还是我留下，你和菲尔去。
        - id: ch01-b40
          speaker: bobbie
          text: 不，你带菲尔去。再把小刀借我，我趁他没醒，想法把靴子脱下来。
        - id: ch01-b41
          speaker: peter
          text: 我不知道这么做对不对。
        - id: ch01-b42
          speaker: bobbie
          text: 当然对！不然还能怎么办？难道因为这里黑，就让他孤零零躺着？别说傻话了，快去。
          emotion: angry
        - id: ch01-b43
          speaker: narrator
          text: 彼得和菲莉丝匆匆走了。
    - id: ch02
      title: 黑暗里握着的手
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 博比望着他们黑乎乎的背影，也望着那一点越来越远的烛光。她忽然生出一种奇怪的感觉，像是一切都到了尽头。她想，现在自己明白了，那些被活活砌进修道院墙里的修女是什么滋味。想到这里，她猛地抖了抖身子。
        - id: ch02-b02
          speaker: bobbie
          text: 别做傻乎乎的小姑娘。
        - id: ch02-b03
          speaker: narrator
          text: 要是别人叫她“小姑娘”，博比准会大发脾气。不管前头加的是傻乎乎、可爱、乖巧，还是聪明，都不行。只有她对自己气得不得了时，才准罗伯塔这样数落博比。
        - id: ch02-b04
          speaker: narrator
          text: 她把自己的小蜡烛头固定在男孩脚边的一块碎砖上，又拿出彼得的小刀。那把刀平时很难打开，总要用半便士硬币去撬。这一次，博比不知怎么只用拇指指甲就把它掰开了。指甲断了，疼得厉害。她割断靴带，脱下男孩的靴子。她还想脱掉长袜，可那条腿肿得可怕，形状也不对。她只好放慢动作，一点一点、小心地把袜子剪开。
        - id: ch02-b05
          speaker: narrator
          text: 那是一只棕色的手织长袜。博比忍不住想，是谁织的呢？会不会是他的妈妈？妈妈现在是不是正为他担心？要是儿子断着腿被送回去，她会是什么心情？袜子终于脱下来了。博比看见那条可怜的腿，只觉得隧道更黑了，地面在脚下摇晃，周围的一切都不像真的。
        - id: ch02-b06
          speaker: bobbie
          text: 傻乎乎的小姑娘！
        - id: ch02-b07
          speaker: narrator
          text: 罗伯塔又这样对博比说了一句，她便好受了些。
        - id: ch02-b08
          speaker: bobbie
          text: 可怜的腿，得给它垫个软垫才行……啊！
        - id: ch02-b09
          speaker: narrator
          text: 她想起从前那一天。她和菲莉丝撕破红法兰绒衬裙，做成危险信号，拦住了火车。今天她穿的是白法兰绒衬裙，想来一定和红的同样柔软。于是，她把衬裙脱了下来。
        - id: ch02-b10
          speaker: bobbie
          text: 哦，法兰绒衬裙可真有用！应该给发明它的人立一座雕像。
        - id: ch02-b11
          speaker: narrator
          text: 她故意把话说出声。在这片黑暗里，不管是谁的声音，哪怕只是自己的，也能让她安心一点。
        - id: ch02-b12
          speaker: jim
          text: 什么东西要立雕像？给谁立？
        - id: ch02-b13
          speaker: narrator
          text: 男孩突然开口，声音微弱得很。
        - id: ch02-b14
          speaker: bobbie
          text: 哦，你好多了！咬紧牙，别让它疼得太厉害。来！
        - id: ch02-b15
          speaker: narrator
          text: 博比已经叠好了衬裙。她托起男孩的腿，把它轻轻放到法兰绒软垫上。
        - id: ch02-b16
          speaker: bobbie
          text: 求你别再晕过去，别晕呀。
          emotion: fearful
        - id: ch02-b17
          speaker: narrator
          text: 男孩一呻吟，她就赶紧用牛奶浸湿手帕，敷在那条伤腿上。
        - id: ch02-b18
          speaker: jim
          text: 哦，好疼！哦……不，不疼了。其实这样挺舒服。
        - id: ch02-b19
          speaker: bobbie
          text: 你叫什么名字？
        - id: ch02-b20
          speaker: jim
          text: 吉姆。
        - id: ch02-b21
          speaker: bobbie
          text: 我叫博比。
        - id: ch02-b22
          speaker: jim
          text: 可你是个女孩，对不对？
        - id: ch02-b23
          speaker: bobbie
          text: 对，我的大名是罗伯塔。
        - id: ch02-b24
          speaker: jim
          text: 喂，博比。
        - id: ch02-b25
          speaker: bobbie
          text: 什么事？
        - id: ch02-b26
          speaker: jim
          text: 刚才这里不是还有别人吗？
        - id: ch02-b27
          speaker: bobbie
          text: 有啊，彼得和菲尔，是我的弟弟妹妹。他们去找人来抬你出去。
        - id: ch02-b28
          speaker: jim
          text: 这几个名字真怪，听起来都像男孩。
        - id: ch02-b29
          speaker: bobbie
          text: 是呀。我可巴不得自己是男孩。你不也是吗？
        - id: ch02-b30
          speaker: jim
          text: 我觉得你现在这样就很好。
        - id: ch02-b31
          speaker: bobbie
          text: 我不是那个意思。我是问，你想不想当男孩。不过你本来就是，当然不用想了。
        - id: ch02-b32
          speaker: jim
          text: 你跟男孩一样勇敢。你怎么没跟他们一起去？
        - id: ch02-b33
          speaker: bobbie
          text: 总得有人留下来陪你。
        - id: ch02-b34
          speaker: jim
          text: 我跟你说，博比，你真够朋友。来，握个手。
        - id: ch02-b35
          speaker: narrator
          text: 他伸出穿红毛衣的胳膊，博比紧紧握住了他的手。
        - id: ch02-b36
          speaker: bobbie
          text: 我不摇你的手。要是摇了你，你的伤腿也会跟着动，那就疼了。你带手帕了吗？
        - id: ch02-b37
          speaker: jim
          text: 大概没带吧……咦，有。你要手帕做什么？
        - id: ch02-b38
          speaker: narrator
          text: 博比接过手帕，用牛奶浸湿，放在吉姆额头上。
        - id: ch02-b39
          speaker: jim
          text: 真舒服。这是什么？
        - id: ch02-b40
          speaker: bobbie
          text: 牛奶。我们没有水……
        - id: ch02-b41
          speaker: jim
          text: 你真是个顶好的小护士。
        - id: ch02-b42
          speaker: bobbie
          text: 我有时候也这么照顾妈妈。当然不用牛奶，是用香水，或者用醋兑水。听着，我得把蜡烛吹灭了，不然剩下那一截不够照你出去。
        - id: ch02-b43
          speaker: jim
          text: 老天，你可什么都想到了。
        - id: ch02-b44
          speaker: narrator
          text: 博比一口吹灭蜡烛。那片黑暗浓得像黑天鹅绒，你根本想象不出有多厚。
        - id: ch02-b45
          speaker: jim
          text: 喂，博比，你怕黑吗？
        - id: ch02-b46
          speaker: bobbie
          text: 不……不怎么怕。我是说……
        - id: ch02-b47
          speaker: jim
          text: 那咱们拉着手吧。
        - id: ch02-b48
          speaker: narrator
          text: 这句话从吉姆嘴里说出来，可真不容易。他和大多数同龄男孩一样，最讨厌亲吻、拉手这类看得见摸得着的亲昵，管它们叫“动手动脚”。
        - id: ch02-b49
          speaker: narrator
          text: 博比的手被那只粗糙的大手握着，黑暗似乎也没那么难熬了。吉姆握着她光滑温热的小手，也惊讶地发现，自己并没有想象中那么反感。博比试着说些话逗他开心，让他别总想着疼。可在黑暗中不停说话实在很难。没过多久，两个人便安静下来。偶尔，寂静里才响起一句话。
        - id: ch02-b50
          speaker: jim
          text: 你还好吧，博比？
        - id: ch02-b51
          speaker: bobbie
          text: 吉姆，一定疼得要命吧。真对不起。
          emotion: sad
        - id: ch02-b52
          speaker: narrator
          text: 而且，那里冷极了。
    - id: ch03
      title: 信号房里的惊险
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得和菲莉丝沿着漫长的隧道，一步一步朝亮处走。蜡油不断滴在彼得的手指上。路上倒没有别的意外，只除了一些也许算得上意外的事。菲莉丝的裙子挂上铁丝，撕开一道长长的锯齿形裂口。她的靴带松了，绊了她一跤。后来她又摔得手脚着地，四处都擦破了皮。
        - id: ch03-b02
          speaker: phyllis
          text: 这条隧道永远也走不到头。
        - id: ch03-b03
          speaker: narrator
          text: 它看上去确实长得没有尽头。
        - id: ch03-b04
          speaker: peter
          text: 坚持走。什么事都有尽头，只要一直往前，总会走到的。
        - id: ch03-b05
          speaker: narrator
          text: 仔细想想，这话一点没错。遇到麻烦时，记住它也很有用。比如出麻疹，比如做算术，比如被老师罚抄。又或者，你闯了祸受了罚，觉得再也不会有人爱你，自己也永远不会再爱任何人的时候。
        - id: ch03-b06
          speaker: peter
          text: 万岁！隧道到头了！你看，像不像在黑纸上扎了一个针眼？
          emotion: happy
        - id: ch03-b07
          speaker: narrator
          text: 那个针眼越变越大，蓝色的光铺上了隧道两侧。孩子们重新看清脚下的碎石路，空气也变得越来越暖，越来越清甜。再走二十步，他们终于出了隧道，站进灿烂的阳光里。两旁全是绿树。
        - id: ch03-b08
          speaker: narrator
          text: 菲莉丝长长吸了一口气。
        - id: ch03-b09
          speaker: phyllis
          text: 只要我还活着，就再也不进隧道了。哪怕里面有二十百千万只穿红毛衣、摔断腿的猎犬，我也不进去。
        - id: ch03-b10
          speaker: peter
          text: 别做傻布谷鸟。真碰上那种事，你还是非进去不可。
        - id: ch03-b11
          speaker: phyllis
          text: 我觉得自己刚才又勇敢，又善良。
        - id: ch03-b12
          speaker: peter
          text: 才不是。你敢进去，是因为博比和我都不是坏蛋。现在先找最近的房子吧。树挡得这么严，什么也看不见。
        - id: ch03-b13
          speaker: phyllis
          text: 那边露出一个屋顶。
        - id: ch03-b14
          speaker: narrator
          text: 菲莉丝指向铁路前面。
        - id: ch03-b15
          speaker: peter
          text: 那是信号房。你知道，不许跟值班的信号员说话，那是违规的。
        - id: ch03-b16
          speaker: phyllis
          text: 跟再进一次隧道比，我才不怕违规呢。走吧！
        - id: ch03-b17
          speaker: narrator
          text: 她沿着铁路线跑起来，彼得只好跟上。阳光晒得人发热。两个人跑到信号房下面时，已经又热又喘。他们抬起头，对着敞开的窗户，用最后一点力气大喊。
        - id: ch03-b18
          speakers: [peter, phyllis]
          ensemble: duo
          text: 喂！
        - id: ch03-b19
          speaker: narrator
          text: 没有人回答。信号房静得像一间空荡荡的育儿室。孩子们轻手轻脚爬上台阶，扶手被太阳晒得发烫。他们从敞开的门口往里看，只见信号员坐在椅子上，椅背斜靠着墙。他歪着头，张着嘴，睡得正熟。
        - id: ch03-b20
          speaker: peter
          text: 我的天！快醒醒！
          emotion: fearful
        - id: ch03-b21
          speaker: narrator
          text: 彼得的声音听着很可怕。他知道，信号员值班时睡觉，不但会丢掉饭碗，还会让那些等着安全信号的火车遇上可怕的危险。
        - id: ch03-b22
          speaker: narrator
          text: 信号员一动不动。彼得扑过去，使劲摇他。那人慢慢醒来，一边打哈欠，一边伸懒腰。可他刚清醒，就猛地跳起来，两手抱住脑袋。菲莉丝后来形容，那样子“像个发疯的疯子”。
        - id: ch03-b23
          speaker: signalman
          text: 我的老天爷！几点了？
          emotion: fearful
        - id: ch03-b24
          speaker: peter
          text: 十二点十三分。
        - id: ch03-b25
          speaker: narrator
          text: 信号房墙上那只白脸圆钟，指的正是这个时间。信号员看一眼钟，立刻扑向操纵杆。这边扳一下，那边猛拉一下。电铃叮叮响起来，钢丝和曲柄也吱嘎转动。做完这些，他一下跌坐回椅子里。
        - id: ch03-b26
          speaker: narrator
          text: 他脸白得吓人，额头冒出一颗颗汗珠。菲莉丝后来形容，像白卷心菜上滚着大颗露珠。他浑身发抖，两只长满黑毛的大手在孩子们眼前左右颤动。照彼得后来的说法，那双手“抖得格外厉害”。
        - id: ch03-b27
          speaker: signalman
          text: 感谢上帝！感谢上帝，你们来得正是时候。哦，感谢上帝！
          emotion: fearful
        - id: ch03-b28
          speaker: narrator
          text: 他大口喘着气，肩膀抽动起来。脸上慢慢有了血色，他却把脸埋进那双毛茸茸的大手里。
        - id: ch03-b29
          speaker: phyllis
          text: 哦，别哭，别哭。现在已经没事了。
          emotion: calm
        - id: ch03-b30
          speaker: narrator
          text: 菲莉丝轻轻拍着他一边宽阔的肩膀，彼得则认认真真捶着另一边。可信号员像是彻底垮了。两个孩子一个拍，一个捶，过了好一会儿，他才摸到自己的手帕。那块手帕是红底的，上面印着淡紫色和白色的马蹄铁。他把脸擦干净，这才开得了口。就在孩子们忙着安慰他的这段时间，一列火车轰隆隆地开了过去。
        - id: ch03-b31
          speaker: signalman
          text: 真丢人，哭哭啼啼的，跟小娃娃一样。
        - id: ch03-b32
          speaker: narrator
          text: 高大的信号员不哭了，却突然恼火起来。
        - id: ch03-b33
          speaker: signalman
          text: 不过，你们跑到这里来干什么？明知道不许上来！
          emotion: angry
        - id: ch03-b34
          speaker: phyllis
          text: 对，我们知道这违规。可我不怕违规，结果我们还做对了。你也不后悔我们来吧？
        - id: ch03-b35
          speaker: signalman
          text: 老天保佑你们。要是你们没来……
        - id: ch03-b36
          speaker: narrator
          text: 他停了一下，才接着说。
        - id: ch03-b37
          speaker: signalman
          text: 值班时睡着，真是丢尽了脸。就算没出事，要是这事传出去，也一样完了。
        - id: ch03-b38
          speaker: peter
          text: 不会传出去。我们又不是告密鬼。不过你确实不该睡觉，太危险了。
        - id: ch03-b39
          speaker: signalman
          text: 说点我不知道的吧。可我有什么办法？我早知道会弄成这样，却请不了假，他们也找不到人替班。五天了，我连十分钟都没睡过。我家小子病了，医生说是肺炎。除了我和他妹妹，根本没人照料他。事情就是这样。小姑娘总得睡觉吧。危险？这还用你说？去吧，想告发我就去。
          emotion: angry
        - id: ch03-b40
          speaker: peter
          text: 我们当然不会！
          emotion: angry
        - id: ch03-b41
          speaker: narrator
          text: 菲莉丝却没理会信号员后面那一大段话。她只记住了开头那一句。
        - id: ch03-b42
          speaker: phyllis
          text: 是你叫我们说点你不知道的。那我就告诉你，隧道里有个穿红毛衣的男孩，他摔断腿了。
        - id: ch03-b43
          speaker: signalman
          text: 那他跑进那该死的隧道干什么？
        - id: ch03-b44
          speaker: phyllis
          text: 你别这么凶。除了进来叫醒你，我们什么错也没犯。而且这件事碰巧还做对了。
          emotion: calm
        - id: ch03-b45
          speaker: narrator
          text: 接着，彼得把男孩怎么会留在隧道里，从头到尾讲了一遍。
        - id: ch03-b46
          speaker: signalman
          text: 唉，我看自己帮不上忙。我不能离开信号房。
        - id: ch03-b47
          speaker: phyllis
          text: 可你总能告诉我们，去哪里找一个不用守在信号房里的人吧？
        - id: ch03-b48
          speaker: signalman
          text: 那边是布里格登农场。看见树丛里冒出来的烟了吗？
        - id: ch03-b49
          speaker: narrator
          text: 菲莉丝注意到，他的脾气越来越坏了。
        - id: ch03-b50
          speaker: peter
          text: 那好，再见。
        - id: ch03-b51
          speaker: signalman
          text: 等一等。
        - id: ch03-b52
          speaker: narrator
          text: 信号员把手伸进口袋，掏出一把钱。有许多便士，还有一两枚先令、六便士银币和一枚半克朗。他从里面挑出两先令，递给孩子们。
        - id: ch03-b53
          speaker: signalman
          text: 拿着。今天这里发生的事，你们闭紧嘴巴，这钱就是你们的。
        - id: ch03-b54
          speaker: narrator
          text: 屋里短暂地静了下来。那沉默叫人十分难堪。
        - id: ch03-b55
          speaker: phyllis
          text: 你真是个讨厌的人，对吧？
          emotion: disgusted
        - id: ch03-b56
          speaker: narrator
          text: 彼得往前跨了一步，一掌把信号员的手打向上方。两枚先令飞出去，滚落在地板上。
        - id: ch03-b57
          speaker: peter
          text: 要是真有什么事能逼我去告密，就是你现在做的这件事！走吧，菲尔。
          emotion: angry
        - id: ch03-b58
          speaker: narrator
          text: 他两颊通红，大步走出了信号房。菲莉丝迟疑了一下，握住信号员那只还傻乎乎伸在半空的手。刚才，那只手里还放着两枚先令。
        - id: ch03-b59
          speaker: phyllis
          text: 就算彼得不原谅你，我也原谅你。你只是脑子不清醒，不然绝不会这么做。我知道，人缺了觉会发疯，妈妈告诉过我。希望你的小男孩快点好起来。还有……
          emotion: calm
        - id: ch03-b60
          speaker: peter
          text: 快来，菲尔！
        - id: ch03-b61
          speaker: phyllis
          text: 我用最神圣的名誉保证，我们绝不会告诉别人。亲一下吧，咱们就和好。
          emotion: calm
        - id: ch03-b62
          speaker: narrator
          text: 菲莉丝觉得，一场不是自己挑起的争吵，自己却主动来求和，实在高尚极了。信号员弯下腰，亲了亲她。
        - id: ch03-b63
          speaker: signalman
          text: 我想我的脑子的确有点不对劲，小妹妹。快回妈妈身边去吧。我不是故意惹你们不痛快，真的不是。
          emotion: sad
        - id: ch03-b64
          speaker: narrator
          text: 于是，菲尔离开闷热的信号房，跟着彼得穿过田野，向农场跑去。
    - id: ch04
      title: 博比带回了什么
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 农场的人抬着一副栅栏，上面盖了马毯。彼得和菲莉丝领着他们来到隧道检修口时，博比睡得正熟，吉姆也睡着了。医生后来解释说，疼痛已经把吉姆折腾得筋疲力尽。
        - id: ch04-b02
          speaker: farm_steward
          text: 他住在哪里？
        - id: ch04-b03
          speaker: narrator
          text: 吉姆被抬上栅栏以后，农场管事这样问。
        - id: ch04-b04
          speaker: bobbie
          text: 诺森伯兰。
        - id: ch04-b05
          speaker: jim
          text: 我在梅德布里奇上学。看来总得想个办法，让我回学校去。
        - id: ch04-b06
          speaker: farm_steward
          text: 依我看，还是先让医生瞧瞧。
        - id: ch04-b07
          speaker: bobbie
          text: 哦，把他抬到我们家吧。从大路走，离得不远。我敢肯定，妈妈也会说该这样办。
        - id: ch04-b08
          speaker: farm_steward
          text: 你妈妈真愿意让你把一个断了腿的陌生人带回家？
        - id: ch04-b09
          speaker: bobbie
          text: 她还把那个可怜的俄国人带回过家。我知道，她一定会说我们做得对。
        - id: ch04-b10
          speaker: farm_steward
          text: 那好。你妈妈喜欢怎么办，你当然比我清楚。换成我，要是不先问问家里的太太，可不敢把人抬回去。虽说大家还管我叫主人呢。
        - id: ch04-b11
          speaker: jim
          text: 你真能肯定，你妈妈不会介意？
        - id: ch04-b12
          speaker: bobbie
          text: 肯定。
        - id: ch04-b13
          speaker: farm_steward
          text: 那么，我们就把他抬到三烟囱去？
        - id: ch04-b14
          speaker: peter
          text: 当然。
        - id: ch04-b15
          speaker: farm_steward
          text: 那就叫我家小子骑自行车去请医生，让医生到那里会合。好了，小伙子们，轻一点，稳一点。一、二、三！
        - id: ch04-b16
          speaker: narrator
          text: 事情就这样定了。农场的人把吉姆往三烟囱抬去，另有人骑车去请医生。那时，妈妈正在拼命写一个故事。故事里有一位公爵夫人，一个诡计多端的恶棍，一条秘密通道，还有一份失踪的遗嘱。工作室的门猛地撞开，她吓得丢下笔。回头一看，博比没戴帽子，正站在门口，跑得满脸通红。
        - id: ch04-b17
          speaker: bobbie
          text: 哦，妈妈，快下楼！我们在隧道里找到一只穿红毛衣的猎犬。他摔断了腿，他们正在把他抬回家。
        - id: ch04-b18
          speaker: mother
          text: 应该把它送去找兽医。家里实在不能再收留一条瘸腿的狗了。
        - id: ch04-b19
          speaker: narrator
          text: 妈妈担心地皱起眉头。
        - id: ch04-b20
          speaker: bobbie
          text: 其实他不是狗，是个男孩。
        - id: ch04-b21
          speaker: narrator
          text: 博比这句话说得又像笑，又像呛住了。
        - id: ch04-b22
          speaker: mother
          text: 那就该把他送回妈妈身边。
        - id: ch04-b23
          speaker: bobbie
          text: 他妈妈已经去世了，爸爸住在诺森伯兰。哦，妈妈，您会好好照顾他的，对不对？我告诉他，您一定希望我们带他回家。您总是愿意帮助每一个人。
        - id: ch04-b24
          speaker: narrator
          text: 妈妈笑了，却也叹了口气。孩子们相信，只要有人需要帮助，你就愿意向任何人敞开家门，也敞开心门。这份信任当然很好。可是，当他们真的照着这份信任做起事来，有时也实在叫人为难。
        - id: ch04-b25
          speaker: mother
          text: 唉，好吧。我们只好尽力安排妥当。
        - id: ch04-b26
          speaker: narrator
          text: 吉姆被抬进来时，脸白得吓人。他紧紧抿着嘴唇，嘴唇原有的红色已经褪成可怕的青紫。
        - id: ch04-b27
          speaker: mother
          text: 我很高兴你们把他带到这里来了。来吧，吉姆，趁医生还没到，先让你舒舒服服地躺上床。
        - id: ch04-b28
          speaker: narrator
          text: 吉姆望着妈妈慈爱的眼睛，只觉得一股新的勇气暖暖涌上心头。
        - id: ch04-b29
          speaker: jim
          text: 会很疼，是不是？我不想当胆小鬼。要是我又晕过去，您不会觉得我是胆小鬼吧？我真的不是故意的。还有，给你们添了这么多麻烦，我心里很过意不去。
          emotion: fearful
        - id: ch04-b30
          speaker: mother
          text: 别担心。遇上麻烦的是你呀，可怜的孩子，不是我们。
          emotion: calm
        - id: ch04-b31
          speaker: narrator
          text: 妈妈亲了亲吉姆，就像她亲彼得一样。
        - id: ch04-b32
          speaker: mother
          text: 我们都喜欢你来这里。是不是，博比？
        - id: ch04-b33
          speaker: bobbie
          text: 是的。
        - id: ch04-b34
          speaker: narrator
          text: 博比看着妈妈的脸，终于知道，自己把那只受伤的红毛衣猎犬带回家，果然一点也没有做错。
