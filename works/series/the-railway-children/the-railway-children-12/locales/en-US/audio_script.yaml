    roberta:
      display_name: Roberta
      tts:
        delivery: thoughtful, earnest, and quietly brave
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    peter:
      display_name: Peter
      tts:
        delivery: lively, confident, and quick to react
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    phyllis:
      display_name: Phyllis
      tts:
        delivery: openhearted, literal, and impulsive
        timbre: light and youthful
        pace: natural
        pitch: high
    mother:
      display_name: Mother
      tts:
        delivery: affectionate, imaginative, and composed
        timbre: warm and gentle
