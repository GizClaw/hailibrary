          text: Of course we are.
        - id: ch01-b178
          speaker: bailiff
          text: Then my boy will ride his bicycle to the doctor's and ask him to meet us there. All right, men. Lift him gently and keep him steady. One, two, three!
        - id: ch01-b179
          speaker: narrator
          text: And that is how Mother, who was writing furiously about a duchess, a scheming villain, a secret passage, and a missing will, suddenly dropped her pen. Her workroom door flew open, and there stood Bobbie, hatless and red from running.
        - id: ch01-b180
          speaker: roberta
          text: Oh, Mother, please come downstairs. We found a hound in a red jersey inside the tunnel. His leg is broken, and they're bringing him home.
        - id: ch01-b181
          speaker: mother
          text: They should take him to a veterinarian. I really can't have an injured dog staying here.
        - id: ch01-b182
