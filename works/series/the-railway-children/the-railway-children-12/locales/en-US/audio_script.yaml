          text: His mother is dead, and his father is in Northumberland. Oh, Mother, you will be kind to him, won't you? I told him you'd want us to bring him here. You always want to help everyone.
        - id: ch01-b187
          speaker: narrator
          text: Mother smiled, but she also sighed. It is lovely when your children believe your home and your heart are open to every person who needs help. It can also be rather awkward when they act on that belief.
        - id: ch01-b188
          speaker: mother
          text: Well, then. We'll make the best of it.
        - id: ch01-b189
          speaker: narrator
          text: At last the men carried Jim into Three Chimneys. He was dreadfully pale, and his lips were pressed tightly together. Their healthy red color had faded to a horrible blue-purple. Mother took one look at the injured boy on the makeshift stretcher and spoke.
        - id: ch01-b190
          speaker: mother
          text: I'm glad you brought him here. Jim, let's make you comfortable in bed before the doctor arrives.
        - id: ch01-b191
          speaker: narrator
          text: Jim looked into her kind eyes, and a small, warm feeling of courage came back to him.
        - id: ch01-b192
