  chapters:
    - id: ch01
      title: Chapter XII. What Bobbie brought home.
      blocks:
        - id: ch01-b01
          speakers: [roberta, peter, phyllis]
          ensemble: chorus
          text: Oh, look up! Please speak to me! Do it for my sake!
        - id: ch01-b02
          speaker: narrator
          text: The children kept begging the unconscious hound in the red jersey. He sat against the tunnel wall with his eyes shut and his face pale.
        - id: ch01-b03
          speaker: roberta
          text: Wet his ears with milk. People use eau de Cologne when someone faints, so I expect milk will work just as well.
        - id: ch01-b04
          speaker: narrator
          text: They soaked his ears, and some milk trickled under the neck of his red jersey. The tunnel was terribly dark. Peter's candle end stood on a flat stone, but its tiny flame gave almost no light.
        - id: ch01-b05
          speaker: phyllis
          text: Oh, please look up. For my sake! I think he's dead.
          emotion: fearful
        - id: ch01-b06
          speaker: roberta
          text: For my sake. No, he isn't dead.
        - id: ch01-b07
          speaker: peter
          text: For anybody's sake, snap out of it.
        - id: ch01-b08
          speaker: narrator
          text: Peter shook the boy's arm. At last the red-jerseyed boy sighed. He opened his eyes, closed them again, and spoke in a very small voice.
        - id: ch01-b09
          speaker: jim
          text: Cut it out.
        - id: ch01-b10
          speaker: phyllis
          text: He isn't dead! I knew he wasn't!
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: Then Phyllis began to cry.
        - id: ch01-b12
          speaker: jim
          text: What's the matter? I'm fine.
        - id: ch01-b13
          speaker: peter
          text: Drink this.
        - id: ch01-b14
          speaker: narrator
          text: Peter firmly pushed the mouth of the milk bottle between the boy's lips. The boy fought it, spilling some milk before he could pull free and speak.
        - id: ch01-b15
          speaker: jim
          text: What is that?
        - id: ch01-b16
          speaker: peter
          text: Milk. Don't be afraid. You're among friends. Phil, stop crying right now.
        - id: ch01-b17
          speaker: roberta
          text: Please drink some. It'll help you.
        - id: ch01-b18
          speaker: narrator
          text: So the boy drank, and the three children waited without talking to him.
        - id: ch01-b19
          speaker: peter
          text: Give him a minute. Once that milk starts rushing through his veins like fire, he'll be fine.
        - id: ch01-b20
          speaker: narrator
          text: And soon he was.
        - id: ch01-b21
          speaker: jim
          text: I feel better now. I remember everything.
        - id: ch01-b22
          speaker: narrator
          text: He tried to move, but the attempt ended in a groan.
        - id: ch01-b23
          speaker: jim
          text: Oh, bother. I think my leg is broken.
        - id: ch01-b24
          speaker: phyllis
          text: Did you fall down?
        - id: ch01-b25
          speaker: narrator
          text: Phyllis sniffed back her tears.
        - id: ch01-b26
          speaker: jim
          text: Of course I didn't. I'm not a little kid. One of those awful wires tripped me. When I tried to get up, I couldn't stand, so I sat here. Gee whillikins, though, it really hurts. How did you get in here?
        - id: ch01-b27
          speaker: peter
          text: We watched all of you run into the tunnel. Then we crossed the hill to see you come out. Everyone did except you. When you never appeared, we formed a rescue party.
        - id: ch01-b28
          speaker: jim
          text: Well, you've certainly got nerve.
        - id: ch01-b29
          speaker: peter
          text: Oh, it wasn't much. Could you walk if we held you up?
        - id: ch01-b30
          speaker: jim
          text: I can try.
        - id: ch01-b31
          speaker: narrator
          text: He tried. But he could stand on only one foot, while the other dragged horribly.
        - id: ch01-b32
          speaker: jim
          text: Let me sit down. I feel like I'm dying. Let go of me. Quick, let go!
          emotion: fearful
        - id: ch01-b33
          speaker: narrator
          text: Jim lay down and closed his eyes. In the candle's weak glow, the other three stared at one another.
        - id: ch01-b34
          speaker: peter
          text: What in the world do we do now?
        - id: ch01-b35
          speaker: roberta
          text: You have to get help. Go to the nearest house.
        - id: ch01-b36
          speaker: peter
          text: Yes, that's our only choice. Come on.
        - id: ch01-b37
          speaker: roberta
          text: First, take his feet. Phil and I will take his head. We can carry him to the manhole.
        - id: ch01-b38
          speaker: narrator
          text: They managed it. Perhaps it was lucky for Jim that he had fainted again.
        - id: ch01-b39
          speaker: roberta
          text: I'll stay with him. Take the longer candle, and please hurry. This little piece won't burn much longer.
        - id: ch01-b40
          speaker: peter
          text: I don't think Mother would want me to leave you here. I'll stay. You and Phil should go.
        - id: ch01-b41
          speaker: roberta
          text: No, you and Phil go. Lend me your knife, too. I'll try to take off his boot before he wakes again.
        - id: ch01-b42
          speaker: peter
          text: I hope we're doing the right thing.
        - id: ch01-b43
          speaker: roberta
          text: Of course we are. What else could we do, leave him alone because it's dark? That's nonsense. Just hurry.
        - id: ch01-b44
          speaker: narrator
          text: And so Peter and Phyllis hurried away.
        - id: ch01-b45
          speaker: narrator
          text: Bobbie watched their dark shapes move farther down the tunnel. Beside them, the little glow from their little candle grew smaller and smaller. She had the strange feeling that everything had come to an end. Now she knew, she thought, how nuns must have felt when they were bricked up alive inside convent walls. Then she gave herself a quick shake.
        - id: ch01-b46
          speaker: roberta
          text: Don't be a silly little girl.
        - id: ch01-b47
          speaker: narrator
          text: Bobbie was always furious when anyone else called her a little girl, whether they said silly, nice, good, or clever before it. Only when she was very angry with herself did she allow Roberta to talk to Bobbie that way.
        - id: ch01-b48
          speaker: narrator
          text: She set her candle end on a broken brick near Jim's feet and opened Peter's knife. Usually it took a halfpenny to pry that knife open. Somehow, this time, Bobbie forced it up with her thumbnail. The nail broke, and the pain was awful. Still, she cut through Jim's bootlace and eased off his boot.
        - id: ch01-b49
          speaker: narrator
          text: Next she tried to remove his stocking. His leg was terribly swollen and did not look the right shape at all. Bobbie took the knife and slowly, carefully cut down the brown knitted stocking. She wondered who had made it. Maybe it was Jim's mother. Maybe that mother was worrying about him right now. And how would she feel when her son came home with a broken leg?
        - id: ch01-b50
          speaker: narrator
          text: At last the stocking was off. One look at the injured leg made the tunnel seem even darker. The ground felt unsteady beneath Bobbie, and nothing around her seemed real.
        - id: ch01-b51
          speaker: roberta
          text: Silly little girl!
        - id: ch01-b52
          speaker: narrator
          text: Roberta's sharp words to Bobbie made her feel better.
        - id: ch01-b53
          speaker: roberta
          text: That poor leg needs a cushion. Oh, I know!
        - id: ch01-b54
          speaker: narrator
          text: She remembered the day she and Phyllis had torn up their red flannel petticoats for danger flags and stopped a train from crashing. Today's petticoat was white, but white flannel would be just as soft as red. So Bobbie took it off.
        - id: ch01-b55
          speaker: roberta
          text: Flannel petticoats really are useful! The man who invented them deserves a statue directed to him.
        - id: ch01-b56
          speaker: narrator
          text: She said it aloud because, in that darkness, even the sound of her own voice was comforting.
        - id: ch01-b57
          speaker: jim
          text: What deserves to be directed? And to whom?
        - id: ch01-b58
          speaker: narrator
          text: Jim's voice came suddenly, and very weakly.
        - id: ch01-b59
          speaker: roberta
          text: Oh, you're awake! Clench your teeth, and try not to let it hurt too much. Here we go.
        - id: ch01-b60
          speaker: narrator
          text: She folded the petticoat into a cushion. Then she lifted his leg and laid it gently on the flannel.
        - id: ch01-b61
          speaker: roberta
          text: Please don't faint again. Please don't.
          emotion: fearful
        - id: ch01-b62
          speaker: narrator
          text: Jim groaned. Bobbie quickly soaked her handkerchief in milk and spread it over his injured leg.
        - id: ch01-b63
          speaker: jim
          text: Oh, that hurts! No, wait. It doesn't. It actually feels good.
        - id: ch01-b64
          speaker: roberta
          text: What's your name?
        - id: ch01-b65
          speaker: jim
          text: Jim.
        - id: ch01-b66
          speaker: roberta
          text: I'm Bobbie.
        - id: ch01-b67
          speaker: jim
          text: But you're a girl, aren't you?
        - id: ch01-b68
          speaker: roberta
          text: Yes. Roberta is my long name.
        - id: ch01-b69
          speaker: jim
          text: Listen, Bobbie.
        - id: ch01-b70
          speaker: roberta
          text: Yes?
        - id: ch01-b71
          speaker: jim
          text: Weren't there more of you here a minute ago?
        - id: ch01-b72
          speaker: roberta
          text: Yes. Peter and Phil, my brother and sister. They went to find someone who can carry you out.
        - id: ch01-b73
          speaker: jim
          text: Those are funny names. They all sound like boys' names.
        - id: ch01-b74
          speaker: roberta
          text: Yes. I wish I were a boy, don't you?
        - id: ch01-b75
          speaker: jim
          text: I think you're fine the way you are.
        - id: ch01-b76
          speaker: roberta
          text: That's not what I meant. I meant, don't you wish you were a boy? But of course you already are, so you don't need to wish.
        - id: ch01-b77
          speaker: jim
          text: You're every bit as brave as a boy. Why didn't you go with the others?
        - id: ch01-b78
          speaker: roberta
          text: Someone had to stay with you.
        - id: ch01-b79
          speaker: jim
          text: I'll tell you what, Bobbie. You're a brick. Shake hands.
        - id: ch01-b80
          speaker: narrator
          text: Jim held out one red-jerseyed arm, and Bobbie squeezed his hand.
        - id: ch01-b81
          speaker: roberta
          text: I won't actually shake it. That would shake you, and then your poor leg would shake, and that would hurt. Do you have a handkerchief?
        - id: ch01-b82
          speaker: jim
          text: I don't think so.
        - id: ch01-b83
          speaker: narrator
          text: He felt inside his pocket.
        - id: ch01-b84
          speaker: jim
          text: Yes, I do. Why?
        - id: ch01-b85
          speaker: narrator
          text: Bobbie took it, dampened it with milk, and laid it across his forehead.
        - id: ch01-b86
          speaker: jim
          text: That feels great. What is it? You're a really good little nurse.
        - id: ch01-b87
          speaker: roberta
          text: Milk. We don't have any water. I sometimes do this for Mother, only I use scent, or vinegar and water. Now I have to put out the candle. The other one may not last long enough to bring you out.
        - id: ch01-b88
          speaker: jim
          text: By George, you think of everything.
        - id: ch01-b89
          speaker: narrator
          text: Bobbie blew out the flame. The darkness became as black and soft as velvet.
        - id: ch01-b90
          speaker: jim
          text: Bobbie, are you afraid of the dark?
        - id: ch01-b91
          speaker: roberta
          text: Not very. Well, not too very.
        - id: ch01-b92
          speaker: jim
          text: Let's hold hands.
        - id: ch01-b93
          speaker: narrator
          text: That was rather kind of him. Like most boys his age, Jim hated kissing, hand-holding, and every other show of affection. He called such things pawings and could not stand them.
        - id: ch01-b94
          speaker: narrator
          text: With Jim's large, rough hand around hers, Bobbie found the darkness easier to bear. Jim held her small, smooth, hot hand in return. To his own surprise, this boy who usually hated any show of affection found he did not mind holding hands nearly as much as he had expected.
        - id: ch01-b95
          speaker: narrator
          text: Bobbie tried to keep talking so she could entertain him and take his mind off the pain. But talking on and on in the dark was hard. Before long they fell silent, except for an occasional question.
        - id: ch01-b96
          speaker: jim
          text: You doing all right, Bobbie?
        - id: ch01-b97
          speaker: roberta
          text: I'm afraid your leg hurts terribly, Jim. I'm so sorry.
          emotion: sad
        - id: ch01-b98
          speaker: narrator
          text: And all around them, the dark tunnel was very cold.
        - id: ch01-b99
          speaker: narrator
          text: Meanwhile, Peter and Phyllis trudged through the long tunnel toward daylight. Hot candle wax dripped over Peter's fingers. There were no accidents, unless you counted the four that happened to Phyllis. Her dress caught on a wire and tore a long, jagged slit. Her bootlace came undone and tripped her. Then she fell on her hands and knees and scraped all four of them.
        - id: ch01-b100
          speaker: phyllis
          text: This tunnel never ends.
        - id: ch01-b101
          speaker: narrator
          text: It certainly seemed very, very long.
        - id: ch01-b102
          speaker: peter
          text: Keep going. Everything has an end, and you'll reach it if you just keep on.
        - id: ch01-b103
          speaker: narrator
          text: That is quite true when you think about it. It is useful to remember during troubles like measles, arithmetic, punishment work, or those awful times when you are in disgrace and feel that nobody will ever love you again, and you will never, ever love anybody.
        - id: ch01-b104
          speaker: peter
          text: Hurray! There's the end. It looks like someone poked a pinhole through black paper, doesn't it?
          emotion: happy
        - id: ch01-b105
          speaker: narrator
          text: The pinhole grew larger. Blue light stretched along the tunnel walls. Soon the children could make out the gravel beneath their feet, and the air felt warmer and sweeter. Twenty more steps brought them into the bright, welcome sunshine, with green trees on both sides.
        - id: ch01-b106
          speaker: narrator
          text: Phyllis took one long breath.
        - id: ch01-b107
          speaker: phyllis
          text: I am never going into a tunnel again for as long as I live. Not even if there are twenty hundred thousand million hounds inside, all wearing red jerseys with broken legs.
        - id: ch01-b108
          speaker: peter
          text: Don't be a silly cuckoo. You'd have to go in.
        - id: ch01-b109
          speaker: phyllis
          text: I think I was very good and brave.
        - id: ch01-b110
          speaker: peter
          text: No, you weren't. You didn't go in because you were brave. You went because Bobbie and I aren't skunks. Now, where's the nearest house? These trees hide everything.
        - id: ch01-b111
          speaker: phyllis
          text: I can see a roof down the line.
        - id: ch01-b112
          speaker: narrator
          text: Phyllis pointed.
        - id: ch01-b113
          speaker: peter
          text: That's the signal box. You know we're not allowed to bother signalmen while they're working. It would be wrong.
        - id: ch01-b114
          speaker: phyllis
          text: I'm not nearly as afraid of doing wrong as I was of that tunnel. Come on.
        - id: ch01-b115
          speaker: narrator
          text: Phyllis ran along the tracks, and Peter ran after her. The sun beat down on them. By the time they stopped below the signal box, both children were hot and gasping for breath. They tipped their heads far back to look up at the open windows before they called out.
        - id: ch01-b116
          speakers: [peter, phyllis]
          ensemble: duo
          text: Hey!
        - id: ch01-b117
          speaker: narrator
          text: They shouted as loudly as they could, but nobody answered. The signal box was as still as an empty nursery. Its stair rail burned their hands as they quietly climbed and peered through the open door.
        - id: ch01-b118
          speaker: narrator
          text: The signalman sat in a chair tilted against the wall. His head drooped to one side, his mouth hung open, and he was fast asleep.
        - id: ch01-b119
          speaker: peter
          text: Good heavens! Wake up!
          emotion: fearful
        - id: ch01-b120
          speaker: narrator
          text: Peter's voice was terrible. He knew a signalman caught sleeping on duty could lose his job. And that was only one danger. Every passing train trusted this man to tell it when the tracks were safe, so sleeping put all of them at risk.
        - id: ch01-b121
          speaker: narrator
          text: The man did not stir. Peter rushed over and shook him. Slowly, the signalman woke, yawning and stretching. But the instant he was awake, he jumped to his feet, clutched his head like a madman, and shouted.
        - id: ch01-b122
          speaker: signalman
          text: Oh, heavens! What time is it?
          emotion: fearful
        - id: ch01-b123
          speaker: peter
          text: Twelve thirteen.
        - id: ch01-b124
          speaker: narrator
          text: The round white clock on the wall said exactly that. The signalman looked at it, leaped to the controls, and yanked the levers back and forth. An electric bell rang. Wires and cranks creaked. Then he dropped heavily into his chair.
        - id: ch01-b125
          speaker: narrator
          text: His face had gone white. Sweat stood on his forehead like huge drops of dew on a pale cabbage, as Phyllis said later. His big, hairy hands trembled from side to side with what Peter afterward called extra-large shakes. He drew several deep breaths. Then his shoulders began to heave, and the color rushed back into his face. He buried it in his hands.
        - id: ch01-b126
          speaker: signalman
          text: Thank God you came in when you did. Oh, thank God!
          emotion: fearful
        - id: ch01-b127
          speaker: phyllis
          text: Oh, please don't cry. Everything's all right now.
          emotion: calm
        - id: ch01-b128
          speaker: narrator
          text: Phyllis patted one of his big, broad shoulders while Peter carefully thumped the other. The signalman seemed completely broken down. They had to keep patting and thumping for quite a long time before he found his handkerchief. It was red, with purple and white horseshoes. He wiped his face, pulled himself together, and finally spoke. During all that comforting, a train thundered past the signal box.
        - id: ch01-b129
          speaker: signalman
          text: I'm downright ashamed, crying like a little kid.
        - id: ch01-b130
          speaker: narrator
          text: Then, without warning, he seemed to turn angry.
        - id: ch01-b131
          speaker: signalman
          text: What were you doing up here, anyway? You know children aren't allowed in here.
          emotion: angry
        - id: ch01-b132
          speaker: phyllis
          text: Yes, we knew it was wrong. But I wasn't afraid to do something wrong, and this time it turned out right. You aren't sorry we came.
        - id: ch01-b133
          speaker: signalman
          text: Lord love you, if you hadn't come...
        - id: ch01-b134
          speaker: narrator
          text: He stopped, then began again.
        - id: ch01-b135
          speaker: signalman
          text: Sleeping on duty is a disgrace. If anybody found out, even though no harm came of it...
        - id: ch01-b136
          speaker: peter
          text: Nobody will find out. We aren't sneaks. But you shouldn't sleep while you're on duty. It's dangerous.
        - id: ch01-b137
          speaker: signalman
          text: Tell me something I don't know. I can't help it. I knew this would happen, but they wouldn't let me off because they couldn't find anyone to take my shift. I haven't slept ten minutes in five days. My little boy is sick with pneumonia, the doctor says. There's nobody but me and his little sister to care for him, and the girl has to get some sleep. Dangerous? You bet it is. Go on and report me if you want.
        - id: ch01-b138
          speaker: peter
          text: Of course we won't!
          emotion: angry
        - id: ch01-b139
          speaker: narrator
          text: Phyllis ignored everything the signalman had said except his first six words.
        - id: ch01-b140
          speaker: phyllis
          text: You told us to tell you something you don't know. All right. There's a boy in the tunnel over there. He's wearing a red jersey, and his leg is broken.
        - id: ch01-b141
          speaker: signalman
          text: What did he go into that blasted tunnel for?
        - id: ch01-b142
          speaker: phyllis
          text: You don't need to be so cross. We did nothing wrong except come in and wake you. And as it happens, that was the right thing to do.
        - id: ch01-b143
          speaker: narrator
          text: Peter explained about the paper chase and how Jim had been left in the tunnel.
        - id: ch01-b144
          speaker: signalman
          text: Well, I don't see what I can do. I can't leave the signal box.
        - id: ch01-b145
          speaker: phyllis
          text: You could tell us where to find someone who isn't stuck in a box.
        - id: ch01-b146
          speaker: signalman
          text: Brigden's farm is over there. See the smoke coming through those trees?
        - id: ch01-b147
          speaker: narrator
          text: The signalman grew grumpier with every word, or so Phyllis thought.
        - id: ch01-b148
          speaker: peter
          text: All right. Goodbye.
        - id: ch01-b149
          speaker: signalman
          text: Wait a minute.
        - id: ch01-b150
          speaker: narrator
          text: He reached into his pocket and pulled out a heap of coins. There were pennies, shillings, sixpences, and a half crown. He chose two shillings and held them toward the children.
        - id: ch01-b151
          speaker: signalman
          text: Here. I'll give you this if you keep quiet about what happened today.
        - id: ch01-b152
          speaker: narrator
          text: For one unpleasant moment, nobody spoke.
        - id: ch01-b153
          speaker: phyllis
          text: You really are a nasty man, aren't you?
          emotion: disgusted
        - id: ch01-b154
          speaker: narrator
          text: Peter stepped forward and knocked the signalman's hand upward. The two shillings flew out and rolled across the floor.
        - id: ch01-b155
          speaker: peter
          text: If anything could make me tell on you, that would do it! Come on, Phil.
          emotion: angry
        - id: ch01-b156
          speaker: narrator
          text: His cheeks blazing, Peter marched out of the signal box. Phyllis paused. Then she took the empty hand the signalman still held out.
        - id: ch01-b157
          speaker: phyllis
          text: I forgive you, even if Peter doesn't. You can't be in your right mind, or you'd never have tried that. Mother says going without sleep can make people mad. I hope your little boy gets better soon, and...
        - id: ch01-b158
          speaker: peter
          text: Come on, Phil!
        - id: ch01-b159
          speaker: phyllis
          text: I give you my sacred word of honor that we'll never tell anyone. Now kiss me, and we'll be friends.
        - id: ch01-b160
          speaker: narrator
          text: Phyllis felt very noble for trying to make peace after a quarrel that had not been her fault at all. The signalman bent down and kissed her.
        - id: ch01-b161
          speaker: signalman
          text: I believe I am a little out of my head, Sissy. Run along home to your mother now. I didn't mean to upset you.
        - id: ch01-b162
          speaker: narrator
          text: Phyllis left the scorching signal box and followed Peter across the fields toward the farm.
        - id: ch01-b163
          speaker: narrator
          text: Later, Peter and Phyllis led the farmhands back to the tunnel manhole. The men brought a hurdle covered with horse blankets to use as a stretcher. By the time they arrived, Bobbie was fast asleep, and so was Jim. The doctor explained afterward that the pain had completely worn him out.
        - id: ch01-b164
