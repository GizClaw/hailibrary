          text: In Northumberland.
        - id: ch01-b167
          speaker: jim
          text: I go to school in Maidbridge. I suppose I have to get back there somehow.
        - id: ch01-b168
          speaker: bailiff
          text: Seems to me a doctor should look at you first.
        - id: ch01-b169
          speaker: roberta
          text: Oh, bring him to our house. It's only a short way by the road. I'm sure Mother would say that's what we should do.
        - id: ch01-b170
          speaker: bailiff
          text: Will your mother be pleased when you bring home a stranger with a broken leg?
