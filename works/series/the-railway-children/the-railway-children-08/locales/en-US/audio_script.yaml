  chapters:
    - id: ch01
      title: The amateur firemen
      blocks:
        - id: ch01-b01
          speaker: perks
          text: That's a fine little brooch you're wearing, Miss. Why, I've never seen anything so much like a buttercup, unless it was a real buttercup.
        - id: ch01-b02
          speaker: narrator
          text: Bobbie flushed with pleasure at his approval.
        - id: ch01-b03
          speaker: roberta
          text: I always thought it looked almost more like a buttercup than a real one does. I never dreamed it would belong to me, really and truly. Then Mother gave it to me for my birthday.
        - id: ch01-b04
          speaker: perks
          text: Oh, so you've had a birthday?
        - id: ch01-b05
          speaker: narrator
          text: Perks sounded as surprised as if birthdays were handed out only to a lucky few.
        - id: ch01-b06
          speaker: roberta
          text: Yes. When is your birthday, Mr. Perks?
        - id: ch01-b07
          speaker: narrator
          text: The children were having tea with him in the porters' room, surrounded by lamps and railway almanacs. They had brought their own cups and some jam turnovers. As usual, Perks brewed the tea in a beer can. Everyone felt cheerful and ready to share secrets.
        - id: ch01-b08
          speaker: perks
          text: My birthday? I stopped bothering with birthdays before you were born.
        - id: ch01-b09
          speaker: narrator
          text: He tipped more dark brown tea from the can into Peter's cup.
        - id: ch01-b10
          speaker: phyllis
          text: But you must have been born sometime. Even if it was twenty years ago. Or thirty, or sixty, or seventy.
        - id: ch01-b11
          speaker: perks
          text: Not quite that long ago, Missie. If you truly want to know, I'll be thirty-two on the fifteenth of this month.
        - id: ch01-b12
          speaker: phyllis
          text: Then why don't you celebrate it?
        - id: ch01-b13
          speaker: perks
          text: I've got other things to keep besides birthdays.
        - id: ch01-b14
          speaker: phyllis
          text: Oh! What things? Secrets?
        - id: ch01-b15
          speaker: perks
          text: No. The children and the missus.
        - id: ch01-b16
          speaker: narrator
          text: That conversation got the children thinking, and soon they were talking it over. Perks was just about the dearest friend they had made. He was not as grand as the Station Master, but he was easier to approach. He was not as powerful as the old gentleman, but they could tell him more.
        - id: ch01-b17
          speaker: roberta
          text: It seems awful that no one celebrates his birthday. Couldn't we do something for him?
        - id: ch01-b18
          speaker: peter
          text: Let's go up to the canal bridge and talk about it. The postman gave me a new gut fishing line this morning. I gave him a bunch of roses for his sweetheart because she's sick.
        - id: ch01-b19
          speaker: roberta
          text: Then you should have given her the roses without taking anything for them.
          emotion: angry
        - id: ch01-b20
          speaker: peter
          text: Nyang, nyang!
        - id: ch01-b21
          speaker: narrator
          text: Peter said it as disagreeably as he could and shoved his hands into his pockets.
        - id: ch01-b22
          speaker: phyllis
          text: He did give them for nothing! We heard she was sick, so we picked the roses and waited at the gate while you were making breakfast toast. The postman thanked us over and over. Then he took out the line and gave it to Peter. It wasn't a trade. It was his grateful heart.
        - id: ch01-b23
          speaker: roberta
          text: Oh, Peter, I beg your pardon. I really am sorry.
        - id: ch01-b24
          speaker: peter
          text: Don't mention it. I knew you'd be sorry.
        - id: ch01-b25
          speaker: narrator
          text: He said that grandly. Then all three went up to the canal bridge, planning to fish from it. The new line turned out to be too short.
        - id: ch01-b26
          speaker: roberta
          text: Never mind. Let's stay here and look around. Everything is so beautiful.
        - id: ch01-b27
          speaker: narrator
          text: It really was. The sun was setting in a blaze of red beyond the gray and purple hills. Below them, the canal lay smooth and shining in the shadows, without one ripple. It looked like a gray satin ribbon running between the dusky green silk of the meadows.
        - id: ch01-b28
          speaker: peter
          text: It's pretty, all right. Somehow I notice pretty things better when I'm doing something. Let's climb down to the towpath and fish there.
        - id: ch01-b29
          speaker: narrator
          text: Bobbie and Phyllis reminded him of the canal-boat boys who had thrown coal at them before.
        - id: ch01-b30
          speaker: peter
          text: Oh, that's nonsense. There aren't any boys here now. If there were, I'd fight them.
        - id: ch01-b31
          speaker: narrator
          text: His sisters kindly did not mention that Peter had not fought those boys the last time. They agreed and climbed carefully down the steep bank to the towpath. The line was baited with great care. For half an hour they waited patiently, watching the water and hoping for the smallest tug. Nothing bit. Not one nibble came to keep their hopes alive. Every eye stayed fixed on the sluggish canal, which looked as innocent as if it had never held so much as one minnow. Then a loud, rough shout made them jump.
        - id: ch01-b32
          speaker: bill
          text: Hey! Get out of there, can't you?
          emotion: angry
        - id: ch01-b33
          speaker: narrator
          text: An old white horse was coming along the towpath, only a few yards away. The children sprang up and scrambled onto the bank.
        - id: ch01-b34
          speaker: roberta
          text: We can climb down again after they've passed.
        - id: ch01-b35
          speaker: narrator
          text: But the barge stopped beneath the bridge, as barges do.
        - id: ch01-b36
          speaker: peter
          text: She's going to anchor. Just our luck!
        - id: ch01-b37
          speaker: narrator
          text: There was no anchor. Instead, the barge was tied at both ends, with ropes fastened to the fence and to crowbars driven into the ground.
        - id: ch01-b38
          speaker: bill
          text: What are you staring at?
          emotion: angry
        - id: ch01-b39
          speaker: roberta
          text: We weren't staring. We wouldn't be that rude.
        - id: ch01-b40
          speaker: bill
          text: Never mind rude. Be off with you!
          emotion: angry
        - id: ch01-b41
          speaker: peter
          text: You be off! We have as much right to be here as anybody.
        - id: ch01-b42
          speaker: narrator
          text: Peter remembered boasting that he would fight the boys. Besides, halfway up the bank, he felt safe.
        - id: ch01-b43
          speaker: bill
          text: Oh, you do, do you? We'll soon see about that.
          emotion: angry
        - id: ch01-b44
          speaker: narrator
          text: Bill crossed the deck and started down the side of his barge.
        - id: ch01-b45
          speakers: [roberta, phyllis]
          ensemble: duo
          text: Oh, Peter, come away! Please come away!
          emotion: fearful
        - id: ch01-b46
          speaker: peter
          text: I'm not going. But you two had better go.
        - id: ch01-b47
          speaker: narrator
          text: The girls climbed to the top of the bank and waited there, ready to bolt for home the instant Peter was out of danger. The whole way home ran downhill, and all three children knew they were fast. Bill did not look fast. His face was red, and he was heavy and thickset. But the moment his foot touched the towpath, they saw how badly they had judged him. With one leap he came up the bank, caught Peter by the leg, and hauled him down. He planted the boy on his feet, gave him a shake, and took a firm hold of his ear.
        - id: ch01-b48
          speaker: bill
          text: Now then, what do you think you're doing? Don't you know the fishing in this water is protected? You've no right to fish here, and you've got plenty of nerve talking to me like that.
          emotion: angry
        - id: ch01-b49
          speaker: narrator
          text: Peter was always proud afterward that he told the truth, even with Bill's angry fingers tightening around his ear, that crimson face close to his own, and hot breath against his neck.
        - id: ch01-b50
          speaker: peter
          text: I wasn't catching fish.
        - id: ch01-b51
          speaker: bill
          text: That's not because you didn't try.
        - id: ch01-b52
          speaker: narrator
          text: Bill twisted Peter's ear. It was not a hard twist, but it was certainly a twist. Peter could not deny that he had tried to catch fish. Above them, Bobbie and Phyllis clung to the railing and hopped with worry. Suddenly Bobbie squeezed through the bars and rushed down the bank. Phyllis followed more carefully, certain Bobbie would land in the canal. She would have, too, if Bill had not released Peter and caught her in one jersey-covered arm.
        - id: ch01-b53
          speaker: bill
          text: Here now! Who are you trying to shove?
        - id: ch01-b54
          speaker: narrator
          text: He put her back on her feet.
        - id: ch01-b55
          speaker: roberta
          text: Oh, I'm not trying to shove anyone. Not on purpose. Please don't be angry with Peter. If this is your canal, we're sorry, and we won't fish here again. We didn't know it belonged to you.
        - id: ch01-b56
          speaker: bill
          text: Go on. Get out of here.
        - id: ch01-b57
          speaker: roberta
          text: We will, truly. But we do beg your pardon. And we haven't caught even one fish. If we had, I'd tell you at once. Honor bright.
        - id: ch01-b58
          speaker: narrator
          text: Bobbie held out her empty hands, and Phyllis turned out her little pocket to prove they were hiding no fish.
        - id: ch01-b59
          speaker: bill
          text: All right, then. Run along, and don't do it again.
        - id: ch01-b60
          speaker: narrator
          text: His voice had softened. The children hurried up the bank.
        - id: ch01-b61
          speaker: bill
          text: Throw me a coat, Maria!
        - id: ch01-b62
          speaker: narrator
          text: A red-haired woman in a green plaid shawl appeared at the cabin door with a baby in her arms and tossed him a coat. Bill put it on, climbed the bank, and slouched across the bridge toward the village.
        - id: ch01-b63
          speaker: bill
          text: You'll find me at the Rose and Crown after you've put the little one to sleep.
        - id: ch01-b64
          speaker: narrator
          text: Once he was out of sight, the children slowly came back. Peter insisted on it.
        - id: ch01-b65
          speaker: peter
          text: Maybe the canal belongs to him, though I don't believe it does. But the bridge belongs to everyone. Doctor Forrest told me it's public property. That man isn't going to chase me off the bridge, and neither is anyone else.
        - id: ch01-b66
          speaker: narrator
          text: Peter's ear hurt, and so did his pride. The girls followed him like brave soldiers following a leader into a hopeless battle.
        - id: ch01-b67
          speakers: [roberta, phyllis]
          ensemble: duo
          text: We do wish you wouldn't.
        - id: ch01-b68
          speaker: peter
          text: Go home if you're scared. Leave me here. I'm not afraid.
        - id: ch01-b69
          speaker: narrator
          text: Bill's footsteps faded along the quiet road. Nothing disturbed the evening except the calls of the sedge warblers and the voice of his wife singing her baby to sleep aboard the barge. Her song was sad. It asked Bill Bailey to come home. The children leaned on the bridge parapet in silence. All three were glad for a few quiet minutes because their hearts were still beating much too fast.
        - id: ch01-b70
          speaker: peter
          text: No old bargeman is going to drive me away.
        - id: ch01-b71
          speaker: phyllis
          text: Of course not. You didn't give in to him. So maybe we could go home now. Don't you think?
          emotion: calm
        - id: ch01-b72
          speaker: peter
          text: No.
          emotion: angry
        - id: ch01-b73
          speaker: narrator
          text: No one spoke again until Mrs. Bill left the barge, climbed the bank, and crossed the bridge. She paused behind the three children, cleared her throat, and waited. Peter did not move, but the girls turned around.
        - id: ch01-b74
          speaker: mrs_bill
          text: Don't pay any mind to my Bill. His bark is worse than his bite. Some children down Farley way are terrible little pests. They got him worked up by calling out about who ate the puppy pie under Marlow Bridge.
        - id: ch01-b75
          speaker: phyllis
          text: Well, who did eat it?
        - id: ch01-b76
          speaker: mrs_bill
          text: I don't know. Nobody knows! But for some reason, those words are poison to a barge master. Don't mind Bill. He won't be back for a good two hours. You could catch a great many fish before then, and the light is good, too.
        - id: ch01-b77
          speaker: roberta
          text: Thank you. That's very kind. Where is your baby?
        - id: ch01-b78
          speaker: mrs_bill
          text: Asleep in the cabin. He's fine. Never wakes before twelve. Regular as a church clock, he is.
        - id: ch01-b79
          speaker: roberta
          text: I'm sorry. I would have liked to see him up close.
        - id: ch01-b80
          speaker: mrs_bill
          text: And you've never seen a finer baby, if I do say so myself.
        - id: ch01-b81
          speaker: narrator
          text: Her face lit up as she said it.
        - id: ch01-b82
          speaker: peter
          text: Aren't you afraid to leave him alone?
        - id: ch01-b83
          speaker: mrs_bill
          text: Goodness, no. Who would hurt a little thing like him? Besides, Spot is there. So long!
        - id: ch01-b84
          speaker: narrator
          text: Mrs. Bill went away.
        - id: ch01-b85
          speaker: phyllis
          text: Shall we go home now?
        - id: ch01-b86
          speaker: peter
          text: You can. I'm going to fish.
        - id: ch01-b87
          speaker: phyllis
          text: I thought we came here to talk about Perks's birthday.
        - id: ch01-b88
          speaker: peter
          text: Perks's birthday can wait.
        - id: ch01-b89
          speaker: narrator
          text: So they climbed down to the towpath again, and Peter went on fishing. He caught nothing. It was nearly dark, the girls were tired, and Bobbie said it was past bedtime. Then Phyllis cried out.
        - id: ch01-b90
          speaker: phyllis
          text: What's that?
          emotion: surprised
        - id: ch01-b91
          speaker: narrator
          text: She pointed at the canal boat. Smoke had been curling gently from the cabin chimney all evening. Now fresh coils were coming through the cabin door.
        - id: ch01-b92
          speaker: peter
          text: It's on fire, that's all. Serves him right.
        - id: ch01-b93
          speaker: phyllis
          text: Oh, how can you say that? Think of the poor dear dog!
        - id: ch01-b94
          speaker: roberta
          text: The baby!
          emotion: fearful
        - id: ch01-b95
          speaker: narrator
          text: All three raced for the barge. Its mooring ropes hung loose. A breeze so faint they could hardly feel it had still been strong enough to push the stern against the bank. Bobbie reached it first. Peter came next, but his foot slipped and he plunged into the canal up to his neck. He could not feel the bottom beneath his feet. One arm had landed across the edge of the barge, but he needed help to climb out. Phyllis seized him by the hair. It hurt badly, yet the pull gave him what he needed. A moment later he had scrambled free and jumped onto the barge, with Phyllis following close behind.
        - id: ch01-b96
          speaker: peter
          text: Not you, Bobbie! Let me go in. I'm already wet.
        - id: ch01-b97
          speaker: narrator
          text: Peter caught Bobbie at the cabin door and hurled her aside. If they had been playing, that rough shove would have made her cry with pain and fury. He knocked her against the edge of the hold, scraping and bruising her knee and elbow. This time she only struggled to get up.
        - id: ch01-b98
          speaker: roberta
          text: No, not you. Let me go!
          emotion: fearful
        - id: ch01-b99
          speaker: narrator
          text: She was too late. Peter had already gone two steps down into the thick smoke. He stopped and remembered everything he had heard about fires. Pulling the soaked handkerchief from his breast pocket, he tied it across his mouth.
        - id: ch01-b100
          speaker: peter
          text: It's all right. There's hardly any fire.
          emotion: calm
        - id: ch01-b101
          speaker: narrator
          text: Peter believed that was a lie, but he said it to keep Bobbie from following him into danger. Of course, it did not work. The cabin glowed red, and a paraffin lamp burned steadily in an orange haze.
        - id: ch01-b102
          speaker: peter
          text: Hey, Baby! Where are you?
        - id: ch01-b103
          speaker: narrator
          text: He lifted the handkerchief to call and then choked.
        - id: ch01-b104
          speaker: roberta
          text: Oh, let me go in!
          emotion: fearful
        - id: ch01-b105
          speaker: narrator
          text: Bobbie was close behind him. Peter shoved her back even harder and pushed on. No one knows what would have happened if the baby had not cried just then. But it did. Peter felt his way through the dark smoke until his hands found something small, soft, warm, and alive. He picked it up and backed out, almost falling over Bobbie. A dog snapped at his leg, tried to bark, and choked on the smoke.
        - id: ch01-b106
          speaker: peter
          text: I've got the baby.
        - id: ch01-b107
          speaker: narrator
          text: He tore off the handkerchief and stumbled onto the deck. Bobbie reached toward the sound of the bark and felt the broad back of a smooth-haired dog. Spot turned and closed his teeth gently around her hand. It was as if he meant, “I have to guard my master's cabin, but I know you're helping, so I won't truly bite.” Bobbie let him go.
        - id: ch01-b108
          speaker: roberta
          text: It's all right, old fellow. You're a good dog. Peter, give me the baby. You're soaked, and you'll make him cold.
        - id: ch01-b109
          speaker: narrator
          text: Peter was glad to hand over the strange little bundle squirming and whimpering in his arms.
        - id: ch01-b110
          speaker: roberta
          text: Now run straight to the Rose and Crown and tell them. Phil and I will stay with this precious baby. Hush, sweet darling. Go, Peter! Run!
        - id: ch01-b111
          speaker: peter
          text: I can't run in these clothes. They weigh as much as lead. I'll have to walk.
        - id: ch01-b112
          speaker: roberta
          text: Then I'll run. Get onto the bank, Phil, and I'll pass the baby up to you.
        - id: ch01-b113
          speaker: narrator
          text: They handed the baby up with great care. Phyllis settled on the bank and tried to quiet him while he whimpered. Peter stood nearby, squeezing as much water as he could from his sleeves and the legs of his knickerbockers. Since his clothes were too heavy for running, it was Bobbie who raced away. She flew across the bridge and up the long, white, silent road in the twilight toward the Rose and Crown.
        - id: ch01-b114
          speaker: narrator
          text: The Rose and Crown had a pleasant, old-fashioned room where barge workers and their wives drank beer with supper and toasted cheese over glowing coals. The fire sat out in the room beneath a great hooded chimney, warmer and prettier and more comforting than almost any other fireplace. A cheerful company of canal people had gathered around it. Other people might not have found them cheerful, but they were among friends who enjoyed the same things and the same kind of talk. That is the real secret of pleasant company. Bill, who had seemed so disagreeable to the children, was considered excellent company by his friends. He was telling them about a wrong that had been done to him, always an exciting subject. This particular wrong concerned his barge.
        - id: ch01-b115
          speaker: bill
          text: He sends word to paint her all through the inside, but never says what color. So I get plenty of green paint and cover her from stem to stern. She looked first-rate, I tell you. Then he comes along and asks why I've painted the whole thing one color. I tell him I thought she'd look fine, and I still think so. And what does he say? “Do you? Then you can pay for the blasted paint yourself.” And I had to pay, too.
        - id: ch01-b116
          speaker: narrator
          text: A sympathetic murmur went around the room. Then Bobbie burst noisily through the swinging door, struggling for breath.
        - id: ch01-b117
          speaker: roberta
          text: Bill! I need Bill the bargeman!
        - id: ch01-b118
          speaker: narrator
          text: The room went completely still. Beer mugs stopped halfway to thirsty mouths. Then Bobbie spotted Mrs. Bill and hurried to her.
        - id: ch01-b119
          speaker: roberta
          text: Your cabin is on fire. You have to hurry!
        - id: ch01-b120
          speaker: narrator
          text: Mrs. Bill sprang up and pressed one broad red hand to the left side of her waist, where your heart seems to move when fear or misery strikes.
        - id: ch01-b121
          speaker: mrs_bill
          text: Reginald Horace! My Reginald Horace!
          emotion: fearful
        - id: ch01-b122
          speaker: roberta
          text: He's all right, if you mean the baby. We got him out safely. The dog, too. Go now. The cabin is all in flames.
        - id: ch01-b123
          speaker: narrator
          text: Bobbie had no breath left for anything else. She dropped onto a bench and tried to catch the deep breath of relief that comes after running, the one people call a second wind. It felt as if she would never breathe normally again. Bill got up slowly and heavily. Before he fully understood what had happened, his wife was already a hundred yards up the road.
        - id: ch01-b124
          speaker: narrator
          text: Phyllis sat shivering beside the canal. She had barely heard the rush of approaching feet when Mrs. Bill flung herself over the railing, rolled down the bank, and snatched up the baby.
        - id: ch01-b125
          speaker: phyllis
          text: Oh, don't! I'd only just gotten him to sleep.
        - id: ch01-b126
          speaker: narrator
          text: Bill arrived later, speaking in language the children had never heard before. There was no time to stand talking. He leaped aboard the barge and began dipping up pail after pail of canal water. Peter went with him and helped carry and throw the water until the flames were out. Meanwhile, Phyllis, Mrs. Bill, and the baby huddled together in one close heap on the bank. When Bobbie returned from the Rose and Crown, she joined them there.
        - id: ch01-b127
          speaker: mrs_bill
          text: Lord help me if I left anything where it could catch fire.
        - id: ch01-b128
          speaker: narrator
          text: She said it again and again. But she had not caused the fire. Bill had knocked the ash from his pipe, and one red ember fell onto the hearth rug. It smoldered there until it finally burst into flame. Bill could be stern, but he was fair. He did not blame his wife for his own mistake, though plenty of bargemen, and plenty of other men, would have done just that.
        - id: ch01-b129
          speaker: narrator
          text: Mother was nearly wild with worry when the three children finally reached Three Chimneys. By then they all seemed wet, as if Peter's soaking had somehow spread to the others. When they tried to explain, each child broke in with a different part of the adventure. Their account came out in a tangled, confused rush. Mother had to separate one piece from another before she could understand the whole story. Once she had worked out what had really happened, she admitted they had done exactly the right thing. With a baby and a dog trapped in the smoke, they could not possibly have acted any other way. She also put no obstacle in the way of their accepting Bill's hearty invitation, given as they parted.
        - id: ch01-b130
          speaker: bill
          text: Be here at seven tomorrow morning. I'll take you all the way to Farley and back, and it won't cost you a penny. Nineteen locks!
        - id: ch01-b131
          speaker: narrator
          text: The children had no idea what locks were. Still, at seven the next morning, they stood by the bridge with a basket holding bread and cheese, half a soda cake, and a full quarter of a leg of mutton.
        - id: ch01-b132
          speaker: narrator
          text: It was a glorious day. The old white horse strained against the towing ropes, and the barge glided smoothly and steadily through the still water. Above them, the sky was blue. Mr. Bill was as pleasant as anyone could possibly be. No one meeting him that day would have guessed he was the same man who had caught Peter by the ear. Mrs. Bill had always been nice, as Bobbie pointed out, and so had the baby. Even Spot deserved praise. He could have bitten them quite badly in the smoky cabin if he had chosen to, but he had not.
        - id: ch01-b133
          speaker: peter
          text: It was wonderful, Mother! We went right over that enormous aqueduct. And the locks! You can't imagine what they're like. You sink down into the ground, and just when you think you'll never stop going down, two huge black gates open very, very slowly. Then you sail out, and you're back on the canal as if nothing happened.
          emotion: happy
        - id: ch01-b134
          speaker: mother
          text: I do know. There are locks on the Thames. Before we were married, Father and I used to go boating at Marlow.
        - id: ch01-b135
          speaker: roberta
          text: And that dear, darling baby! He let me hold him for ages and ages, and he was so good. Mother, I wish we had a baby to play with.
          emotion: happy
        - id: ch01-b136
          speaker: phyllis
          text: Everyone was so kind to us. Every single person we met. They said we could fish whenever we wanted. Bill is going to show us how the next time he comes this way. He says we don't really know how.
          emotion: happy
        - id: ch01-b137
          speaker: peter
          text: He said you didn't know how. But, Mother, he promised to tell every bargeman up and down the canal that we're the real, right sort. They're all supposed to treat us like good friends, because that's what we are.
        - id: ch01-b138
          speaker: phyllis
          text: And then I said we'd each wear a red ribbon whenever we went fishing by the canal. That way they'd know it was us, the real, right sort, and they'd be nice to us!
        - id: ch01-b139
          speaker: mother
          text: So you've made a whole new set of friends. First the railway, and now the canal.
        - id: ch01-b140
          speaker: roberta
          text: Oh, yes. I think everyone in the world is friendly, if only you can make them see that you don't want to be unfriendly.
        - id: ch01-b141
          speaker: mother
          text: Perhaps you're right. Come along, chicks. It's bedtime.
        - id: ch01-b142
          speaker: narrator
          text: Mother sighed as she said it.
        - id: ch01-b143
          speaker: phyllis
          text: Oh dear! We went to the bridge to decide what to do for Perks's birthday, and we never decided one single thing.
        - id: ch01-b144
          speaker: roberta
          text: That's true. But Peter saved Reginald Horace's life. I think that's enough for one evening.
        - id: ch01-b145
          speaker: peter
          text: Bobbie would have saved him if I hadn't knocked her down. I did it twice.
        - id: ch01-b146
          speaker: phyllis
          text: And I would have saved him too, if I'd known what to do.
        - id: ch01-b147
          speaker: mother
          text: Yes. You saved a little child's life. I do think that's enough for one evening. Oh, my darlings, thank God you're all safe!
