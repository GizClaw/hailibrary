audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细微幽默和体恤
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中
    bobbie:
      display_name: 博比
      tts:
        delivery: 真诚敏锐，关切时急切而坚定
        timbre: 清亮温暖的少女声
        pace: 自然偏快
        pitch: 中高
    peter:
      display_name: 彼得
      tts:
        delivery: 爽直自信，兴奋时干脆有力
        timbre: 明亮的少年声
        pace: 明快
        pitch: 中高
    phyllis:
      display_name: 菲莉丝
      tts:
        delivery: 天真活泼，想象丰富
        timbre: 轻盈稚嫩的女孩声
        pace: 轻快
        pitch: 高
    mother:
      display_name: 妈妈
      tts:
        delivery: 温柔镇定，讲到苦难时克制而悲悯
        timbre: 温润清晰
        pace: 从容
        pitch: 中
    perks:
      display_name: 帕克斯
      tts:
        delivery: 直率健谈，带着自尊和朴实的铁路工人口吻
        timbre: 粗粝而亲切
        pace: 适中偏快
        pitch: 中低
    bill:
      display_name: 船夫比尔
      tts:
        delivery: 粗声直率，发火时严厉，缓和后厚道
        timbre: 低沉粗厚
        pace: 干脆
        pitch: 低
    maria:
      display_name: 比尔太太
      tts:
        delivery: 朴实爽快，谈起孩子时满是疼爱
        timbre: 温暖结实的女声
        pace: 自然偏快
        pitch: 中
    baby:
      display_name: 雷金纳德·霍勒斯
      tts:
        delivery: 婴儿般自然地哭泣和呜咽
        timbre: 柔嫩稚弱
        pace: 缓慢零碎
        pitch: 高
    boatman_1:
      display_name: 船夫甲
      tts:
        delivery: 随意健谈，带着酒馆里的热络
        timbre: 粗厚
        pace: 适中
        pitch: 中低
    boatman_2:
      display_name: 船夫乙
      tts:
        delivery: 随意健谈，反应直接
        timbre: 沙哑
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 帕克斯的生日
      blocks:
        - id: ch01-b01
          speaker: perks
          text: 小姐，你这枚胸针真漂亮。除了真正的毛茛花，我可没见过比它更像毛茛花的东西。
        - id: ch01-b02
          speaker: bobbie
          text: 是呀，我也一直这么觉得。它甚至比真的花还像呢。我从没想过它会真归我，后来我过生日，妈妈就送给我了。
        - id: ch01-b03
          speaker: perks
          text: 哦，你过生日了？
          emotion: surprised
        - id: ch01-b04
          speaker: narrator
          text: 帕克斯吃惊得很，好像生日是老天只肯送给少数幸运儿的礼物。
        - id: ch01-b05
          speaker: bobbie
          text: 对呀。帕克斯先生，您的生日是哪一天？
        - id: ch01-b06
          speaker: narrator
          text: 孩子们正在搬运工值班室里陪帕克斯喝茶。四周挂着提灯和铁路年历。他们自带了杯子和果酱馅饼，帕克斯照旧拿啤酒罐沏茶，大家坐得亲亲热热。
        - id: ch01-b07
          speaker: perks
          text: 我的生日？你们还没出生的时候，我就已经不过生日啦。
        - id: ch01-b08
          speaker: phyllis
          text: 可您总是在某一天出生的呀。就算那是二十年前，三十年前，六十年前，或者七十年前。
        - id: ch01-b09
          speaker: perks
          text: 没那么久，小姐。你们真想知道，就是三十二年前，这个月十五号。
        - id: ch01-b10
          speaker: phyllis
          text: 那您为什么不过生日呢？
        - id: ch01-b11
          speaker: perks
          text: 因为除了生日，我还有别的要养活。
        - id: ch01-b12
          speaker: phyllis
          text: 什么呀？不会是秘密吧？
        - id: ch01-b13
          speaker: perks
          text: 不是，是孩子们，还有我太太。
        - id: ch01-b14
          speaker: narrator
          text: 这番话让孩子们有了一个念头。不久，他们便又说起这件事。帕克斯是他们交到的朋友里最可亲的一位。他没有站长那么体面，却更容易亲近。他不像老先生那样有力量，却更能跟孩子们说知心话。
        - id: ch01-b15
          speaker: bobbie
          text: 从来没人给他过生日，真让人难受。我们不能替他做点什么吗？
        - id: ch01-b16
          speaker: peter
          text: 到运河桥上再商量。今天早上，邮差送了我一根新肠线。我给了他一束玫瑰，让他带给生病的心上人，他就把线给我了。
        - id: ch01-b17
          speaker: bobbie
          text: 可那束玫瑰本来就该白送给她呀！
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 彼得很讨厌地哼了两声，把手插进口袋。
        - id: ch01-b19
          speaker: phyllis
          text: 他当然是白送的。我们听说她病了，就准备好玫瑰在门口等着。那时你在烤早饭的吐司。邮差谢了好多遍，后来才拿出鱼线送给彼得。那不是交换，是他心里感激。
        - id: ch01-b20
          speaker: bobbie
          text: 哦，彼得，是我错怪你了。对不起。
        - id: ch01-b21
          speaker: peter
          text: 没事。我早知道你会道歉。
        - id: ch01-b22
          speaker: narrator
          text: 他们来到运河桥，本想站在桥上钓鱼，可鱼线太短了。
        - id: ch01-b23
          speaker: bobbie
          text: 没关系，我们就在这儿看风景吧。这里什么都这么美。
        - id: ch01-b24
          speaker: narrator
          text: 风景的确很美。夕阳带着灿烂的红光，正落到灰紫色的山后。阴影里的运河平滑发亮，没有一丝波纹。暗绿色的草地像绸缎一样铺在两岸，中间的河水仿佛一条灰色缎带。
        - id: ch01-b25
          speaker: peter
          text: 是挺美。不过我手里有事做的时候，反而更看得出风景有多好。咱们下到纤道上，从那里钓吧。
        - id: ch01-b26
          speaker: narrator
          text: 两个女孩想起上回运河船上的男孩子拿煤块砸他们，便提醒彼得。
        - id: ch01-b27
          speaker: peter
          text: 别胡说，现在又没有那些男孩子。真来了，我就跟他们打。
        - id: ch01-b28
          speaker: narrator
          text: 姐妹俩很厚道，没提上次煤块飞过来时，彼得根本没有还手。她们只说那好吧，便小心翼翼地爬下陡坡，来到纤道。孩子们仔细装好鱼饵，耐心等了半个钟头，却什么也没等到。鱼钩连一下轻轻的拉扯都没有，心里的希望也得不到半点儿养分。他们只好盯着迟缓的河水。河水一本正经地装着样子，好像自己从来不曾容留过哪怕一条小鲦鱼。
    - id: ch02
      title: 桥下的争执
      blocks:
        - id: ch02-b01
          speaker: bill
          text: 喂！还不快让开？
          emotion: angry
        - id: ch02-b02
          speaker: narrator
          text: 粗厉的喊声突然撞进耳朵，三个孩子全身一跳。一匹老白马正沿着纤道走来，离他们已经不到六码。钓鱼的东西还摊在身边，他们却顾不上慢慢收拾，猛地站起来，赶紧离开狭窄的纤道，手脚并用地爬上河岸。
        - id: ch02-b03
          speaker: bobbie
          text: 等他们过去，我们再溜下来。
        - id: ch02-b04
          speaker: narrator
          text: 可是，那艘驳船偏偏没有从桥下继续驶过去。它像驳船常做的那样，慢慢停在了桥下面。
        - id: ch02-b05
          speaker: peter
          text: 它要下锚了。咱们运气可真好！
        - id: ch02-b06
          speaker: narrator
          text: 其实驳船没有下锚，因为运河船上根本不配锚。船头和船尾各有一根绳。船夫把一根拴在栏杆上，又把另一根系在一根打进地面的铁撬上。用不着锚，船就这样稳稳地泊住了。
        - id: ch02-b07
          speaker: bill
          text: 你们盯着看什么？
          emotion: angry
        - id: ch02-b08
          speaker: bobbie
          text: 我们没盯着您看。我们才不会那么没礼貌。
        - id: ch02-b09
          speaker: bill
          text: 少跟我说礼貌。快滚！
          emotion: angry
        - id: ch02-b10
          speaker: peter
          text: 你自己滚吧！这里又不是只许你待，别人也有权来。
        - id: ch02-b11
          speaker: narrator
          text: 彼得记得自己刚才吹过牛，说碰见那些男孩子就要打架。何况他站在半坡上，觉得很安全。船夫听了，穿过甲板，开始从驳船边往下爬。
        - id: ch02-b12
          speakers: [bobbie, phyllis]
          ensemble: duo
          text: 快走啊，彼得！快走！
          emotion: fearful
        - id: ch02-b13
          speaker: peter
          text: 我不走。你们倒是赶紧走吧。
        - id: ch02-b14
          speaker: narrator
          text: 两个女孩爬到岸顶，站在那里等着。只要哥哥一脱险，她们就会一起拔腿往家跑。回家的路一路向下，他们三个都跑得快。船夫却又红又胖，浑身都是肉，怎么看也不像会跑的人。可他刚把一只脚踏上纤道，孩子们就明白自己完全想错了。他一个箭步冲上河岸，一把抓住彼得的腿，把他拖下来。他先晃了彼得几下，让他站稳，接着便牢牢揪住了他的耳朵。
        - id: ch02-b15
          speaker: bill
          text: 你到底想干什么？不知道这里不许随便钓鱼吗？你没权在这儿捕鱼，还敢这么顶嘴！
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: 后来彼得每次想起这一刻，都会为自己骄傲。船夫的手越揪越紧，通红的脸贴得很近，热气直喷到他脖子上，可彼得还是说了实话。
        - id: ch02-b17
          speaker: peter
          text: 可我一条鱼也没钓到。
        - id: ch02-b18
          speaker: bill
          text: 那可不是因为你不想钓。
        - id: ch02-b19
          speaker: narrator
          text: 船夫拧了彼得的耳朵一下。虽然不重，到底还是拧了。彼得没法反驳。博比和菲莉丝抓着栏杆，急得直跳。忽然，博比从栏杆中钻过去，猛冲下坡。菲莉丝跟在后面，看她那股冲劲，认定她准会一头栽进运河。幸亏船夫松开彼得，用穿着针织衫的胳膊接住了她。
        - id: ch02-b20
          speaker: bill
          text: 你这是往谁身上撞呢？
        - id: ch02-b21
          speaker: bobbie
          text: 我没想撞谁，真的。请您别生彼得的气。要是这条运河真是您的，我们很抱歉，以后不钓了。可我们不知道它归您呀。
        - id: ch02-b22
          speaker: bill
          text: 快走吧。
        - id: ch02-b23
          speaker: bobbie
          text: 好，我们这就走。不过，请您原谅我们。我们真的一条鱼也没钓到。要是钓到了，我一定告诉您。我以名誉担保，真的。
        - id: ch02-b24
          speaker: narrator
          text: 博比摊开双手，菲莉丝也翻出口袋，证明他们没藏鱼。
        - id: ch02-b25
          speaker: bill
          text: 好吧，那就走。以后别再这么干了。
        - id: ch02-b26
          speaker: narrator
          text: 他的口气已经软了些。孩子们匆匆爬上河岸。
        - id: ch02-b27
          speaker: bill
          text: 玛丽娅，给我扔件外套。
        - id: ch02-b28
          speaker: narrator
          text: 一个红头发、披绿格子披肩的女人抱着婴儿，从船舱门里出来，把外套扔给他。船夫穿好，爬上岸，懒洋洋地走过桥，往村里去了。
        - id: ch02-b29
          speaker: bill
          text: 等你把孩子哄睡，就到“玫瑰与王冠”来找我。
        - id: ch02-b30
          speaker: narrator
          text: 等他走远，孩子们才慢慢回到桥上。彼得坚持非回来不可。
        - id: ch02-b31
          speaker: peter
          text: 运河也许真是他的，虽然我不信。可这座桥是公共地方，福里斯特医生说过。我绝不会让他或者别人把我吓跑。说不走，我就不走。
        - id: ch02-b32
          speaker: narrator
          text: 彼得的耳朵还在疼，自尊心也疼。两个女孩跟在他后面，像两名英勇的士兵，跟着一个注定要失败的首领。
        - id: ch02-b33
          speakers: [bobbie, phyllis]
          ensemble: duo
          text: 我们真希望你别回去。
        - id: ch02-b34
          speaker: peter
          text: 你们害怕就回家，别管我。我不怕。
        - id: ch02-b35
          speaker: narrator
          text: 船夫的脚步声渐渐消失在寂静的路上。莎草莺还在鸣叫，船上的女人也在哄孩子睡觉。她唱着一支忧伤的歌，像是在唱比尔·贝利，说自己多么盼他回家。这些声音都没有打破黄昏的安宁。孩子们把胳膊支在桥栏上，静静靠在那里。三颗心都比平常跳得快得多，能这样安静几分钟，他们实在很庆幸。
        - id: ch02-b36
          speaker: peter
          text: 我才不会让哪个老船夫赶走。绝对不会。
        - id: ch02-b37
          speaker: phyllis
          text: 当然不会，你又没向他让步。那我们现在能回家了吗？
          emotion: calm
        - id: ch02-b38
          speaker: peter
          text: 不能。
    - id: ch03
      title: 暮色里的烟
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 三个孩子谁也没再说话。后来，船上的女人下了驳船，爬上河岸，向桥走来。她望着他们的背影，迟疑了一会儿，轻轻咳了一声。彼得还是不动，两个女孩回过头来。
        - id: ch03-b02
          speaker: maria
          text: 别把我家比尔的话放在心上。他喊得凶，其实不会真把人怎么样。法利那边有些坏孩子，总冲他喊，问马洛桥底下的狗崽子馅饼是谁吃了，才把他惹成这样。
        - id: ch03-b03
          speaker: phyllis
          text: 那到底是谁吃的？
        - id: ch03-b04
          speaker: maria
          text: 我不知道，谁也不知道！我也说不清为什么，那句话一到船老大耳朵里，就跟毒药似的。你们不用理他。他至少两个钟头才回来，够你们钓好多鱼了。现在的光线也正合适。
        - id: ch03-b05
          speaker: bobbie
          text: 谢谢您，您真好。宝宝呢？
        - id: ch03-b06
          speaker: maria
          text: 在船舱里睡着了。他乖得很，不到十二点绝不会醒，跟教堂的钟一样准。
        - id: ch03-b07
          speaker: bobbie
          text: 真可惜，我还想凑近看看他呢。
        - id: ch03-b08
          speaker: maria
          text: 小姐，再没有比他更俊的孩子啦。虽说这是我自己夸的。
          emotion: happy
        - id: ch03-b09
          speaker: narrator
          text: 她说着，整张脸都亮了起来。
        - id: ch03-b10
          speaker: peter
          text: 您把他一个人留在船上，不怕吗？
        - id: ch03-b11
          speaker: maria
          text: 老天保佑，有什么可怕的？谁会伤害那么小的宝贝？再说，斑点还守着呢。再见啦！
        - id: ch03-b12
          speaker: narrator
          text: 女人走了。
        - id: ch03-b13
          speaker: phyllis
          text: 我们回家吧，好吗？
        - id: ch03-b14
          speaker: peter
          text: 你可以回去。我要钓鱼。
        - id: ch03-b15
          speaker: phyllis
          text: 可我们来这里，不是为了商量怎么给帕克斯过生日吗？
        - id: ch03-b16
          speaker: peter
          text: 帕克斯的生日又不会跑掉。
        - id: ch03-b17
          speaker: narrator
          text: 于是他们又下到纤道上。彼得继续钓，却还是什么也没钓到。天几乎全黑了，两个女孩也累了。博比说，早就过了他们该上床的时间。忽然，菲莉丝指向运河船。
        - id: ch03-b18
          speaker: phyllis
          text: 那是什么？
          emotion: surprised
        - id: ch03-b19
          speaker: narrator
          text: 船舱烟囱里原本一直有烟，柔柔地卷进暮色。可现在，船舱门口也冒出了一缕又一缕的烟。
        - id: ch03-b20
          speaker: peter
          text: 不过是着火了。他活该。
        - id: ch03-b21
          speaker: phyllis
          text: 你怎么能这么说！想想那条可怜的好狗！
          emotion: angry
        - id: ch03-b22
          speaker: bobbie
          text: 宝宝！
          emotion: fearful
        - id: ch03-b23
          speaker: narrator
          text: 一眨眼，三个孩子全朝驳船跑去。系船的缆绳松松地垂着，几乎感觉不到的微风，竟也足以把船尾推到岸边。博比跑在最前面，彼得紧跟在后。就在这时，彼得脚下一滑，掉进了运河。水一直淹到他的脖子，双脚怎么也够不着河底。幸好，他还有一只胳膊搭在船边。菲莉丝一把抓住他的头发。头皮虽然扯得生疼，这一下却帮他爬出了水。才一转眼，湿透的彼得已经跳上驳船，菲莉丝也紧跟着上去了。
        - id: ch03-b24
          speaker: peter
          text: 你别进去！我去。我身上已经湿透了。
        - id: ch03-b25
          speaker: narrator
          text: 他在船舱门口追上博比，粗暴地把她甩到一边。换作平时，这一下准会把博比摔得又痛又气，哭出声来。可现在，她撞在货舱边，膝盖和胳膊肘都擦伤了，也只顾着喊。
        - id: ch03-b26
          speaker: bobbie
          text: 不，别进去，让我去！
          emotion: fearful
        - id: ch03-b27
          speaker: narrator
          text: 她挣扎着站起来，可已经晚了。彼得走下两级台阶，钻进浓烟。他停了一下，想起听过的火场常识，便从胸前口袋掏出湿手帕，蒙住嘴。
        - id: ch03-b28
          speaker: peter
          text: 没事，火一点也不大。
          emotion: calm
        - id: ch03-b29
          speaker: narrator
          text: 彼得明知这是假话。可他撒这个谎，是想拦住博比，不让她也冲进危险里。当然，博比根本没被拦住。船舱里一片暗红，一盏煤油灯在橙色烟雾中静静燃烧。
        - id: ch03-b30
          speaker: peter
          text: 喂，宝宝，你在哪儿？
        - id: ch03-b31
          speaker: narrator
          text: 彼得揭开手帕喊了一声，立刻呛咳起来。
        - id: ch03-b32
          speaker: bobbie
          text: 让我去找吧！
          emotion: fearful
        - id: ch03-b33
          speaker: narrator
          text: 博比就在他身后。彼得又把她向后推，自己继续摸索。要是婴儿没有在这时哭起来，后来会怎样，谁也不知道。偏偏他真的哭了。
        - id: ch03-b34
          speaker: baby
          text: 哇……哇……
          emotion: fearful
        - id: ch03-b35
          speaker: narrator
          text: 彼得摸索着穿过昏暗的浓烟，终于碰到了一个小小的、柔软的、暖暖的活物。他连忙把婴儿抱起来，倒退着向外走，差一点被紧跟在身后的博比绊倒。这时，一条狗咬向他的腿。它本来想大声叫，可也被烟呛住了，根本叫不出原来的声音。
        - id: ch03-b36
          speaker: peter
          text: 我找到孩子了！
        - id: ch03-b37
          speaker: narrator
          text: 彼得扯下手帕，摇摇晃晃地走上甲板。博比摸向刚才狗叫的地方，双手抱住一条肥胖、短毛光滑的狗。狗回头咬住她的手，却咬得很轻，好像非得为主人叫一声、咬一下，又知道来人是好意，不肯真的伤她。
        - id: ch03-b38
          speaker: bobbie
          text: 没事了，老伙计。好狗。彼得，把宝宝给我吧。你身上这么湿，会让他着凉的。
        - id: ch03-b39
          speaker: narrator
          text: 彼得巴不得赶紧交出怀里这个不停扭动、低声呜咽的陌生小包袱。
    - id: ch04
      title: 从火里救出来
      blocks:
        - id: ch04-b01
          speaker: bobbie
          text: 现在，彼得，你马上去“玫瑰与王冠”报信。菲尔和我留在这儿照看宝宝。嘘，乖宝宝，好心肝。快去呀，彼得，跑！
        - id: ch04-b02
          speaker: peter
          text: 我穿着这一身跑不动。衣服重得跟铅一样，我走过去。
        - id: ch04-b03
          speaker: bobbie
          text: 那我跑。菲尔，你上岸，我把宝宝递给你。
        - id: ch04-b04
          speaker: narrator
          text: 他们小心把婴儿递上岸。菲莉丝坐在岸边，想把他哄安静。彼得用力拧着袖子和灯笼裤里的水。博比像一阵风，冲过桥，奔上暮色里漫长、洁白又寂静的路，直跑向“玫瑰与王冠”。
        - id: ch04-b05
          speaker: narrator
          text: “玫瑰与王冠”里有一间可爱的老式屋子。每天到了傍晚，船夫和他们的妻子都会坐在这里。他们喝着佐晚饭的啤酒，还把晚饭要吃的奶酪放在一篮烧得通红的煤上烘烤。那只煤篮从壁炉里伸进屋内，上方罩着一座巨大的烟囱。要是你也见过它，大概会同样觉得，这比寻常的壁炉更暖和，更漂亮，也更叫人舒坦。
        - id: ch04-b06
          speaker: narrator
          text: 一群船上人正快活地围着炉火。外人看他们，也许不觉得这群人有多快活，可他们自己确实快活得很。他们不是朋友，就是熟人，喜欢同样的事，也总有共同的话题可谈。这正是大家聚在一起能够愉快的秘诀。孩子们觉得十分讨厌的船夫比尔，在这些伙伴眼里却是个很有趣的人。这时，他正在讲自己受过的一桩委屈。这种题目总能牢牢抓住听众，而他讲的还是自己的驳船。
        - id: ch04-b07
          speaker: bill
          text: 他只捎话说，把船里面漆了，可没告诉我要什么颜色。我就弄来一大堆绿漆，从船头一直刷到船尾。那条船看着漂亮极了。后来他来了，问我为什么把整条船漆成一个颜色。我说，因为这样最好看，现在我也这么觉得。可他倒好，叫我自己付那该死的油漆钱。最后还真是我付的！
        - id: ch04-b08
          speakers: [boatman_1, boatman_2]
          ensemble: duo
          text: 这也太不讲理了。
        - id: ch04-b09
          speaker: narrator
          text: 屋里正响着同情的低语，博比忽然撞开弹簧门，气喘吁吁地闯进来。
        - id: ch04-b10
          speaker: bobbie
          text: 比尔！我要找船夫比尔！
        - id: ch04-b11
          speaker: narrator
          text: 屋里一下静了。大家举着啤酒杯，杯子全停在送往嘴边的半路上。博比一眼看见比尔太太，立刻跑向她。
        - id: ch04-b12
          speaker: bobbie
          text: 您的船舱着火了，快去！
        - id: ch04-b13
          speaker: narrator
          text: 女人猛地站起来，一只通红的大手按住左腰。人在害怕或痛苦时，总以为心就在那个地方。
        - id: ch04-b14
          speaker: maria
          text: 雷金纳德·霍勒斯！我的雷金纳德·霍勒斯！
          emotion: fearful
        - id: ch04-b15
          speaker: bobbie
          text: 如果您说的是宝宝，他已经救出来了，平安得很。狗也出来了。快去，船舱全烧起来了！
        - id: ch04-b16
          speaker: narrator
          text: 说完这几句话，博比实在喘不上气，只能瘫坐到酒馆的长凳上。她拼命想找回人在跑过一大段路以后，那一口忽然松快下来的“第二阵气”。可这一回，她觉得自己好像再也喘不过来了。船夫比尔却慢慢地、沉重地站起身。他妻子早已冲出门，沿路跑了一百码，他才终于把博比的话听明白，知道到底发生了什么。
        - id: ch04-b17
          speaker: narrator
          text: 运河边，菲莉丝冷得发抖。她刚听见飞奔而来的脚步，比尔太太就扑到栏杆旁，滚下河岸，一把从她怀里抢走婴儿。
        - id: ch04-b18
          speaker: phyllis
          text: 别这样呀，我才刚刚把他哄睡着。
        - id: ch04-b19
          speaker: narrator
          text: 比尔随后赶到，一路说着一整套孩子们完全听不懂的话。他一到岸边就跳上驳船，拿桶舀水，一桶接一桶地往火上泼。彼得留在船上帮他，两个人不停地打水、泼水，终于把火扑灭了。菲莉丝、比尔太太和婴儿紧紧挤成一团，坐在岸边等着。没过多久，从酒馆缓过气来的博比也赶回来，加入了他们。
        - id: ch04-b20
          speaker: maria
          text: 上帝帮帮我。要是我留下了什么东西，才让它着火……
          emotion: fearful
        - id: ch04-b21
          speaker: narrator
          text: 她一遍又一遍地念着，生怕自己不小心留下了什么会着火的东西。可这场火并不是她引起的。原来，比尔磕烟斗时，一颗通红的烟灰掉在壁炉前那块小地毯上。烟灰先藏在那里，暗暗地闷烧了好一阵，最后才蹿出火苗。比尔虽然是个严厉的人，却也很公道。他知道错在自己，就没有把过错推到妻子头上。许多船夫未必能这样做。其实不只船夫，许多别的男人碰上这种事，也未必做得到。
        - id: ch04-b22
          speaker: narrator
          text: 三个孩子终于回到三烟囱时，妈妈已经急得几乎发疯。他们全都湿透了，仿佛彼得衣服里的水也一路沾到了两个女孩身上。三个人七嘴八舌，都抢着说，说出来的话颠三倒四。妈妈费了好大工夫，才把整件事的前后经过理清楚。听明白以后，她也承认孩子们做得完全正确。遇上那样的危险，他们根本不可能站在一旁不管。船夫临别时热情邀请他们第二天再去坐船，妈妈听了，也没有阻拦他们接受这份邀请。
        - id: ch04-b23
          speaker: bill
          text: 明早七点到这儿。我带你们坐船去法利，再一路回来，不收一分钱。路上要过十九道船闸！
    - id: ch05
      title: 运河上的新朋友
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 孩子们还不知道船闸到底是什么东西，也想不出十九道船闸会是什么样。可第二天早上七点，三个人已经准时到了桥边。他们还带着一只装得满满的篮子，里面有面包、奶酪、半块苏打饼，还有足足四分之一条羊腿，够他们在船上好好吃一顿。
        - id: ch05-b02
          speaker: narrator
          text: 那一天真是好极了。老白马向前走着，把缆绳绷得紧紧的。驳船就在它身后，平稳地滑过安静的水面。孩子们抬头看见的，是一整片蓝天。比尔先生好得不能再好，谁也想不到他就是昨天那个揪过彼得耳朵的人。比尔太太呢，照博比的话说，她从一开始就一直很好。婴儿也一样好。就连斑点也表现得很好，虽说大家都知道，它要是真想咬，原本可以把他们咬得很重。
        - id: ch05-b03
          speaker: narrator
          text: 到了晚上，三个孩子快活极了，也累极了、脏极了。他们终于回到三烟囱，才进家门，就立刻把这一天在运河上的见闻全说给妈妈听。
        - id: ch05-b04
          speaker: peter
          text: 简直棒极了，妈妈！我们还驶过那座了不起的高架渡槽。还有那些船闸，您真不知道它们是什么样。船进去以后，会一点一点往地下沉。你站在船上，看它越沉越低，等你觉得它肯定再也沉不到底了，两扇黑色的大门才慢慢地、慢慢地打开。接着船从门里驶出去。你抬头一看，自己居然又回到运河上了，水面跟先前一模一样！
          emotion: happy
        - id: ch05-b05
          speaker: mother
          text: 我知道船闸。泰晤士河上也有。我和爸爸结婚以前，常在马洛那一带坐船游玩。
        - id: ch05-b06
          speaker: bobbie
          text: 还有那个亲爱的、可爱的、甜心一样的小宝宝！他让我抱了好久，而且一直乖得不得了。妈妈，我真希望我们也有一个宝宝，能陪着我们玩。
          emotion: happy
        - id: ch05-b07
          speaker: phyllis
          text: 每个人都对我们那么好。真的，我们碰见的每一个人都是。他们还说，以后我们什么时候想钓鱼都可以。比尔下次来这里，还要教我们怎么钓。他说我们根本不懂。
        - id: ch05-b08
          speaker: peter
          text: 他说的是你不懂。不过妈妈，他还答应告诉运河上上下下的船夫，说我们是真正靠得住的好人。以后大家都会拿我们当伙伴，因为我们本来就是。
        - id: ch05-b09
          speaker: phyllis
          text: 然后我就说，以后我们去运河钓鱼，每个人都系一条红丝带。这样他们一看就知道是我们，知道我们靠得住，也会好好待我们！
        - id: ch05-b10
          speaker: mother
          text: 这么说，你们又交了一大群朋友。先是铁路上的人，现在又有运河上的人了！
        - id: ch05-b11
          speaker: bobbie
          text: 是呀。我觉得世上的人都可以做朋友，只要你能让他们明白，你并不想跟他们做敌人。
        - id: ch05-b12
          speaker: mother
          text: 也许你说得对。
        - id: ch05-b13
          speaker: narrator
          text: 妈妈叹了口气。
        - id: ch05-b14
          speaker: mother
          text: 来吧，小家伙们。该睡觉了。
        - id: ch05-b15
          speaker: phyllis
          text: 是呀。哎呀，我们本来是去商量怎么替帕克斯过生日的，结果什么也没商量！
        - id: ch05-b16
          speaker: bobbie
          text: 还真是。不过彼得救了雷金纳德·霍勒斯的命。我觉得一个晚上能做成这件事，已经很不错了。
        - id: ch05-b17
          speaker: peter
          text: 要不是我两次把博比撞倒，她也会把他救出来的。
        - id: ch05-b18
          speaker: phyllis
          text: 我也会，只要我知道应该怎么做。
        - id: ch05-b19
          speaker: mother
          text: 是的，你们救了一个小孩子的命。我也觉得，一个晚上能有这件事就够了。哦，我的宝贝们，感谢上帝，你们全都平安无事！
          emotion: happy
