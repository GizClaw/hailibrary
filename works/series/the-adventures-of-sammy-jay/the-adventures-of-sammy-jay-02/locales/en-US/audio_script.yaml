audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: clever, smug, and quick to make mischief
        timbre: bright and sharp
        pace: lively
        pitch: medium-high
    chatterer:
      display_name: Chatterer the Red Squirrel
      tts:
        delivery: quick, sharp, and full of restless energy
        timbre: light and chattering
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: A Bitter Disappointment
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sammy Jay flew through the Green Forest, chuckling to himself. It was not a pleasant sound. It was the chuckle of someone doing wrong and feeling very clever about it. And Sammy thought he had been clever indeed.
        - id: ch01-b02
          speaker: narrator
          text: He had screamed and shrieked and made a great fuss over nothing. Chatterer the Red Squirrel had hurried over to see what it meant. Then Sammy had slipped away without being seen and flown straight to Chatterer's storehouse.
        - id: ch01-b03
          speaker: narrator
          text: Long ago, that storehouse had been Blacky the Crow's home. After Blacky moved away, Chatterer took it over. He put a roof on it, then spent the pleasant fall filling it with nuts and acorns.
        - id: ch01-b04
          speaker: narrator
          text: Sammy had watched him at work. He had seen all those sweet nuts and acorns going inside, and he had never forgotten them. Now the snow lay deep on the ground. The easiest good meal Sammy could think of was a stolen meal from Chatterer's store. So he chuckled as he pulled the roof apart and searched for the acorns.
        - id: ch01-b05
          speaker: narrator
          text: But Chatterer was every bit as smart as Sammy Jay. The two were much alike, for Chatterer was a mischief-maker and a thief himself. Folks who do wrong are always watching for someone else to do wrong. So while Chatterer filled his storehouse that fall, he kept his sharp eyes wide open.
        - id: ch01-b06
          speaker: narrator
          text: He had spotted Sammy's bright blue coat, even though Sammy thought he was well hidden. Chatterer knew exactly why Sammy was watching. His sharp eyes snapped, but he went right on carrying food into the storehouse.
        - id: ch01-b07
          speaker: narrator
          text: As soon as Sammy had gone, Chatterer took out every sweet acorn. He moved them all to another storehouse inside a hollow tree. In the old storehouse, he left only hickory nuts. Chatterer knew their shells were too hard for Sammy Jay to crack.
        - id: ch01-b08
          speaker: narrator
          text: Sammy knew nothing about that. He broke into the storehouse, chuckling greedily all the while. Soon he had opened a hole wide enough to push his head through. His mouth watered as he reached in for a sweet acorn.
        - id: ch01-b09
          speaker: narrator
          text: But all he found were hard hickory nuts. What could have happened? Sammy flew into a rage and began tearing the storehouse apart. The sweet acorns had to be there somewhere. He had watched Chatterer put them in himself.
        - id: ch01-b10
          speaker: narrator
          text: Sammy forgot that he was stealing. He forgot everything except how bitterly disappointed he was. The more he thought about it, the angrier he became. He would have torn the whole storehouse to pieces if Chatterer had not come home just then.
        - id: ch01-b11
          speaker: narrator
          text: Sammy had paused to catch his breath when claws rattled against the tree bark. He knew what that sound meant. He did not even stop to look down. He spread his blue wings, screamed with rage, and flew to the next tree.
        - id: ch01-b12
          speaker: narrator
          text: Then a dreadful noise broke out in the Green Forest. Chatterer danced up and down with anger as he shouted at Sammy.
        - id: ch01-b13
          speaker: chatterer
          text: You are a robber!
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: Sammy screamed right back at him.
        - id: ch01-b15
          speaker: sammy_jay
          text: You're a thief yourself!
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: It was a dreadful quarrel. Every little forest person close enough to hear it stopped their ears.
