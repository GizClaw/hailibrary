audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵自得，盘算时透着狡猾
        timbre: 清脆明亮
        pace: 轻快灵活
        pitch: 中高音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 急性直率，发怒时尖锐泼辣
        timbre: 明亮细脆
        pace: 快而有弹性
        pitch: 高音
  chapters:
    - id: ch01
      title: 萨米直奔粮仓
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 松鸦萨米飞过绿森林，一路都在暗自发笑。那笑声可不好听。只有正在干坏事，还觉得自己特别聪明的家伙，才会那么笑。萨米当时发出的，正是这样的笑声。他笑了又笑，一路都没停下来。
        - id: ch01-b02
          speaker: narrator
          text: 萨米就觉得自己聪明极了。他刚才无缘无故地又喊又叫，闹出好大的动静。红松鼠喋喋果然急忙赶过去，想看看到底出了什么事。萨米趁机悄悄溜开，谁也没瞧见他。他径直飞向了喋喋的粮仓。
        - id: ch01-b03
          speaker: narrator
          text: 这座粮仓原本是乌鸦黑黑的家。黑黑搬走以后，喋喋给它盖好屋顶，把这里当成了粮仓。整个宜人的秋天，他都在往里搬坚果和橡子。萨米一直偷偷看着，亲眼见到喋喋把那些香甜的食物一批批搬进去。从那以后，他就再也没忘掉。
        - id: ch01-b04
          speaker: narrator
          text: 如今雪积得很深，找一顿好吃的可不容易。萨米想到的最省事的办法，就是来偷几颗橡子。他得意地笑着，动手拆开粮仓的屋顶，在里面到处翻找。
    - id: ch02
      title: 喋喋早有防备
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可别以为喋喋不够聪明。他和萨米很像，自己也爱惹乱子，也会偷东西。干坏事的家伙，总会提防别人也来干坏事。
        - id: ch02-b02
          speaker: narrator
          text: 秋天储粮的时候，喋喋一直睁大锐利的眼睛。他早就发现了萨米那件显眼的蓝外套，可萨米还以为自己藏得很好。喋喋知道他为什么躲在那里，气得眼里直冒火，却还是照常往粮仓里搬东西。
        - id: ch02-b03
          speaker: narrator
          text: 等萨米一走，喋喋立刻把香甜的橡子全拿出来，转移到空心树里的另一座粮仓。他只留下山核桃，因为那东西硬得很，萨米根本啄不开。
        - id: ch02-b04
          speaker: narrator
          text: 萨米哪里知道这些。他闯进粮仓时，还馋得直笑。很快，他就在屋顶上掏出一个大洞，刚好能把脑袋伸进去。他伸着头往里够，满心只想抓出一颗香甜的橡子，馋得口水都快流出来了。
        - id: ch02-b05
          speaker: narrator
          text: 可他左摸右找，碰到的全是硬邦邦的山核桃。这到底是怎么回事？萨米气坏了，开始把粮仓撕得七零八落。这里一定还有橡子！他明明亲眼看见喋喋把橡子放了进来。
        - id: ch02-b06
          speaker: narrator
          text: 这时候，萨米早忘了自己是在偷东西。他只顾着失望，越想越恼火。要不是喋喋正好回来，他准会把整座粮仓拆得一干二净。
    - id: ch03
      title: 绿森林里的争吵
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 萨米刚停下来喘口气，就听见爪子在树皮上跑动，窸窸窣窣地响。他马上明白是谁来了，连低头看一眼都没等，就展开蓝色翅膀，愤怒地尖叫着飞到旁边那棵树上。
        - id: ch03-b02
          speaker: narrator
          text: 接着，绿森林里响起了一场可怕的大吵闹。喋喋气得上蹿下跳，对着萨米尖声大叫。
        - id: ch03-b03
          speaker: chatterer
          text: 你这个强盗！
          emotion: angry
        - id: ch03-b04
          speaker: sammy_jay
          text: 你自己才是小偷！
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: 他们这一架吵得实在太凶。附近所有听见动静的小居民，都赶紧捂住了耳朵。
