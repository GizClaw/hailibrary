audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: clever, smug, and quick to make mischief
        timbre: bright and sharp
        pace: lively
        pitch: medium-high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: playful, quick-witted, and boldly teasing
        timbre: light and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Vanity of Sammy Jay
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When Sammy Jay isn't making mischief, he is usually poking his bill into business that doesn't concern him. Sometimes he tries to frighten someone bigger than he is, or scare someone smaller. The rest of the time, he admires his fine clothes and thinks about how handsome he is.
        - id: ch01-b02
          speaker: narrator
          text: And Sammy really is handsome. Even Chatterer the Red Squirrel admits it, though he and Sammy are always quarreling. Sammy has a trim, neat shape, and whenever he thinks someone is watching, he holds himself very proudly. Altogether, his trim shape and proud pose make him look very smart indeed.
        - id: ch01-b03
          speaker: narrator
          text: Then there is his coat. It looks as though Old Mother Nature took a piece of the summer sky at its bluest and trimmed it with a strip from the whitest cloud. She gave him a smart cap, a black collar, and a waistcoat of the softest grayish white to set off all that blue. She must have been feeling very good when she planned Sammy Jay's clothes.
        - id: ch01-b04
          speaker: narrator
          text: Sammy knows exactly how handsome he is. If you asked him, and if he decided you were worth answering, he would say that he is the handsomest fellow in the whole world. That isn't true, of course, but Sammy believes it. He loves to show off his clothes and laugh at people who aren't dressed as finely as he is. To Sammy, a plain coat is one more reason to tease its owner. He takes great care of his lovely coat, and whenever he finds a little pool of water, he stops to admire his reflection.
        - id: ch01-b05
          speaker: narrator
          text: Peter Rabbit is nothing like Sammy. Peter hardly thinks about clothes at all. He doesn't even mind wearing a white patch on the seat of his trousers. What Peter does love is making fun of Sammy Jay.
        - id: ch01-b06
          speaker: narrator
          text: One day, Peter was delighted to catch Sammy admiring himself. Peter had come through the Green Forest without making a sound. Snow covered the ground, so there were no dry leaves to rustle beneath him. As always, his long ears stood up to catch every noise.
        - id: ch01-b07
          speaker: narrator
          text: Suddenly Peter stopped. He could hear Sammy Jay talking, and from the sound of his voice, Peter knew Sammy was talking to himself. Peter crept forward very, very quietly. Then he hid where he could watch Sammy in a big pine tree.
        - id: ch01-b08
          speaker: sammy_jay
          text: No one in the whole Green Forest has a coat as handsome as mine!
        - id: ch01-b09
          speaker: narrator
          text: Sammy stretched out one wing and tilted his head to admire it.
        - id: ch01-b10
          speaker: sammy_jay
          text: And who else has a tail as beautiful as this one?
        - id: ch01-b11
          speaker: narrator
          text: He spread his tail into a ray of sunshine. It truly was beautiful. It was blue as the sky, with a narrow white band across the tip and small black bars along the outer sides. Peter turned up his nose, but even he had to admit to himself that Sammy's tail was handsome.
        - id: ch01-b12
          speaker: sammy_jay
          text: I'm so glad this tail belongs to me. It must be awful not to be handsome.
        - id: ch01-b13
          speaker: narrator
          text: Sammy gave a happy sigh. That was more than Peter could bear in silence.
        - id: ch01-b14
          speaker: peter_rabbit
          text: It's a good thing you admire yourself, Sammy Jay, because nobody else admires you!
        - id: ch01-b15
          speaker: peter_rabbit
          text: Remember, Sammy Jay, being handsome depends on what you do. A black heart hides beneath that coat of blue. Everyone, both near and far, knows exactly what you are. You are the chief of all the mischief-makers, and handsome clothes will never hide a thief.
        - id: ch01-b16
          speaker: narrator
          text: Sammy flew into a rage. He opened his mouth to call Peter names, but only one word came out.
        - id: ch01-b17
          speaker: sammy_jay
          text: Thief! Thief! Thief!
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: Peter Rabbit grinned at him.
        - id: ch01-b19
          speaker: peter_rabbit
          text: See? That's exactly what I told you.
