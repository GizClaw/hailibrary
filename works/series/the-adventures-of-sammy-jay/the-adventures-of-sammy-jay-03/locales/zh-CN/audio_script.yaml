audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵自得，盘算时透着狡猾
        timbre: 清脆明亮
        pace: 轻快灵活
        pitch: 中高音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼机敏，打趣时俏皮又直率
        timbre: 清亮柔和
        pace: 轻快自然
        pitch: 中高音
  chapters:
    - id: ch01
      title: 萨米的漂亮衣裳
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 松鸦萨米不忙着捣蛋的时候，会做些什么呢？要是他没在多管闲事，也没去吓唬比自己大的或比自己小的家伙，他就会花上许多时间欣赏自己的衣裳，越看越觉得自己神气。
        - id: ch01-b02
          speaker: narrator
          text: 萨米的确长得漂亮。就连总和他争吵的红松鼠喋喋，也肯承认这一点。只要觉得有人在看，萨米便昂起头，挺起胸。他身形匀称又利落，看起来精神极了。
        - id: ch01-b03
          speaker: narrator
          text: 再瞧瞧那件外套！它蓝得像大自然老妈妈从夏日最蓝的天空上剪下了一小片，白边又像从最洁白的云朵上裁来的一小条。她还给萨米添上神气的帽子、黑领子和一件柔软的灰白色背心，恰好把蓝外套衬得更漂亮。替萨米安排这身衣裳的时候，大自然老妈妈的心情一定好极了。
        - id: ch01-b04
          speaker: narrator
          text: 萨米自己当然知道有多漂亮。要是你问他，而他又肯搭理你——这可不大可能——他准会说，自己是全世界最漂亮的家伙。那不是真的，萨米却深信不疑。
        - id: ch01-b05
          speaker: narrator
          text: 所以，他最爱炫耀自己的好衣裳，还要取笑那些穿得不如他漂亮的人。他常常花很久打理那件蓝外套。只要在小水潭里照见自己的影子，他便会停下来，好好欣赏一番。
        - id: ch01-b06
          speaker: narrator
          text: 彼得兔和萨米完全不同。他一点也不操心衣裳，就算裤子屁股上顶着一块白补丁，也丝毫不觉得难为情。可要说拿萨米开玩笑，彼得最喜欢不过了。
    - id: ch02
      title: 松树下的偷听者
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 有一天，彼得正好撞见萨米在欣赏自己，心里别提多乐了。那天，绿森林的地面盖着雪，没有枯叶会被踩得沙沙响。彼得一路走来，半点声音也没发出。
        - id: ch02-b02
          speaker: narrator
          text: 他那双长耳朵照例高高竖着，留心听着四周的动静。忽然，彼得停住了。他听见萨米的声音，听得出来，萨米正在自言自语。
        - id: ch02-b03
          speaker: narrator
          text: 彼得轻轻地往前挪，脚步放得又轻又轻。最后，他藏到了一个能看清大松树的地方。松鸦萨米就在那棵树上。
        - id: ch02-b04
          speaker: sammy_jay
          text: 整个绿森林里，谁的外套也没有我的漂亮！
        - id: ch02-b05
          speaker: narrator
          text: 萨米伸展开一边翅膀，把脑袋歪到一旁，细细打量起来。
        - id: ch02-b06
          speaker: sammy_jay
          text: 再说这条尾巴，上哪儿还能找到这么漂亮的？
        - id: ch02-b07
          speaker: narrator
          text: 他把尾巴展开，让一缕阳光正好照在上面。那尾巴的确很美，蓝得像天空，尾梢横着一小道白边，两侧外缘还排着一道道黑纹。彼得虽然一脸不屑，翘着鼻子，却也不得不在心里承认，这条尾巴确实漂亮。
    - id: ch03
      title: 漂亮衣裳遮不住
      blocks:
        - id: ch03-b01
          speaker: sammy_jay
          text: 幸亏这条尾巴是我的！要是生得不漂亮，那可太吓人了。
        - id: ch03-b02
          speaker: narrator
          text: 萨米说完，还心满意足地叹了口气。彼得再也忍不住，立刻从藏身处朝他喊起来。
        - id: ch03-b03
          speaker: peter_rabbit
          text: 萨米，幸亏你还会欣赏自己！除了你，根本没人欣赏你！
        - id: ch03-b04
          speaker: peter_rabbit
          text: 长得漂亮有什么用！萨米呀萨米，千万别忘记。蓝外套底下藏着的，是颗黑心，萨米呀萨米。远远近近，谁不知道，你究竟是什么东西。所有捣蛋鬼里，你数第一，漂亮衣裳遮不住一个贼！
        - id: ch03-b05
          speaker: narrator
          text: 松鸦萨米顿时大发雷霆。他张开嘴，本想把彼得骂上一顿，可真正喊出来的，翻来覆去只有一个字。
        - id: ch03-b06
          speaker: sammy_jay
          text: 贼！贼！贼！
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: 彼得兔咧开嘴笑了。
        - id: ch03-b08
          speaker: peter_rabbit
          text: 怎么样？我刚才没说错吧？
