audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, excitable, and self-important
        timbre: bright and piercing
        pace: quick
        pitch: high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: practical, curious, and good-natured
        timbre: youthful and clear
        pace: moderate
        pitch: medium
  chapters:
    - id: ch01
      title: Chatterer Gets Sammy Jay Some Corn
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Chatterer had never been so angry or felt so helpless. He had been sure he could outsmart Sammy Jay, but Sammy had outsmarted him instead. Worse still, Chatterer now had to do something he thought was terribly dangerous.
        - id: ch01-b02
          speaker: narrator
          text: He had promised to bring Sammy some corn from Farmer Brown's corn-crib in broad daylight. Black Pussy sat on the farmhouse doorstep, and Farmer Brown's boy was chopping wood close to the corn-crib. But if Chatterer broke his promise, Sammy would tell Shadow the Weasel where Chatterer lived. Chatterer feared Shadow even more than he feared Black Pussy or Farmer Brown's boy.
        - id: ch01-b03
          speaker: narrator
          text: What a terrible fix! Chatterer knew it was all his own fault. If he hadn't been greedy and tried to frighten Sammy away from the corn-crib, none of this would have happened.
        - id: ch01-b04
          speaker: narrator
          text: Chatterer followed the stone wall to the edge of Farmer Brown's dooryard and peeked out. Black Pussy was dozing on the doorstep with her eyes shut. He started toward the tree beside the corn-crib. Then his courage gave out, and he raced back to the wall.
        - id: ch01-b05
          speaker: narrator
          text: He tried three times. Each time, he looked up and saw Sammy grinning at him from an apple tree in the Old Orchard. Sammy was plainly enjoying Chatterer's fear. Chatterer almost cried because he was so frightened and angry.
        - id: ch01-b06
          speaker: narrator
          text: On the fourth try, Chatterer gritted his teeth and kept running as fast as he could. He had almost passed Black Pussy when her eyes opened. In a flash, she dashed after him.
        - id: ch01-b07
          speaker: narrator
          text: Chatterer reached the tree first and shot up the trunk like a little red streak. He was safe from Black Pussy there. She wouldn't dare follow him onto the small branches.
        - id: ch01-b08
          speaker: narrator
          text: But Farmer Brown's boy had seen Black Pussy rush to the tree. He stopped chopping wood and watched her glare up at Chatterer.
        - id: ch01-b09
          speaker: farmer_browns_boy
          text: What has caught your attention, Puss?
        - id: ch01-b10
          speaker: narrator
          text: Farmer Brown's boy couldn't see Chatterer, because Chatterer wisely kept the tree trunk between them.
        - id: ch01-b11
          speaker: farmer_browns_boy
          text: Is there something up there you want me to see?
        - id: ch01-b12
          speaker: narrator
          text: He started walking toward the tree. Chatterer's heart hammered with fear. Thump, thump, thump! Just then, a tremendous racket burst from the Old Orchard.
        - id: ch01-b13
          speaker: sammy_jay
          text: Thief! Thief! Thief!
        - id: ch01-b14
          speaker: narrator
          text: Sammy screamed and made a great fuss. Farmer Brown's boy turned toward the noise.
        - id: ch01-b15
          speaker: farmer_browns_boy
          text: I wonder if that fox is prowling around again.
        - id: ch01-b16
          speaker: narrator
          text: While the boy looked toward the Old Orchard, Chatterer dropped onto the corn-crib roof. He slipped through the hole beneath its edge and went inside. Then he let out a huge sigh of relief.
        - id: ch01-b17
          speaker: chatterer
          text: I think Sammy made that noise on purpose. He wanted Farmer Brown's boy to look over there instead of up in this tree.
        - id: ch01-b18
          speaker: narrator
          text: Chatterer was right. Sammy didn't want him to come to any real harm. At exactly the right moment, Sammy fooled Farmer Brown's boy. He had often fooled the boy before by screaming as though Reddy Fox were nearby when Reddy wasn't there at all.
        - id: ch01-b19
          speaker: narrator
          text: Farmer Brown's boy made sure Reddy wasn't in the Old Orchard. Then he turned back to Black Pussy, who was still staring up at the spot where Chatterer had been. The boy looked up too, but of course he saw no one.
        - id: ch01-b20
          speaker: farmer_browns_boy
          text: I suppose you dreamed that you saw something, Puss.
        - id: ch01-b21
          speaker: narrator
          text: He bent down and gently stroked her. Then he returned to chopping wood. Black Pussy waited a few more minutes before going to the barn to console herself with a mouse.
        - id: ch01-b22
          speaker: narrator
          text: Chatterer waited for his chance. Then he made it safely back to the old stone wall, his cheeks packed with corn for Sammy Jay.
