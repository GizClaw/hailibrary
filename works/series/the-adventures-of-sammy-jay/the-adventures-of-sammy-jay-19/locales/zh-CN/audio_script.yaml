audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    sammy:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 爱管闲事又自信，开口爽快，带一点得意
        timbre: 清亮而响亮
        pace: 明快利落
        pitch: 中高音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 机敏急躁，伶牙俐齿，情绪来得又快又直
        timbre: 轻快而尖亮
        pace: 快速灵活
        pitch: 高音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 朴实爽朗，遇事好奇，做事认真
        timbre: 清朗自然
        pace: 平稳适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 喋喋陷入险境
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 喋喋从没像现在这样，又生气，又觉得没办法。他本以为自己聪明，准能胜过萨米，结果反倒中了萨米的计。光是这样已经够糟了，更要命的是，他还得去做一件很危险的事。
        - id: ch01-b02
          speaker: narrator
          text: 大白天里，他得跑到农夫布朗家的玉米仓，替萨米拿玉米。偏偏黑猫就坐在门阶上，农夫布朗的儿子也在玉米仓旁边劈柴。可要是喋喋不守信用，萨米便会去告诉黄鼠狼影子，喋喋住在哪里。
        - id: ch01-b03
          speaker: narrator
          text: 喋喋更怕影子，只好去面对黑猫和农夫布朗的儿子。这样的处境，难道还不够糟吗？喋喋觉得简直糟透了。可他也明白，这全是自己的错。要不是他贪心，非要把萨米从玉米仓吓走，哪会落到这个地步。
    - id: ch02
      title: 黑猫追来了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 喋喋顺着石墙跑到尽头，那里挨着农夫布朗家的院子。他探头一瞧，黑猫正在门阶上打盹儿，眼睛闭得紧紧的。喋喋刚朝玉米仓旁边那棵树跑去，胆子却泄了，只好逃回石墙。
        - id: ch02-b02
          speaker: narrator
          text: 他试了三回，三回都退了回来。每次抬头，他都看见萨米站在老果园的苹果树上，咧着嘴冲他笑。萨米分明看得很开心，喋喋却又怕又气，几乎要哭了。
        - id: ch02-b03
          speaker: narrator
          text: 第四回，喋喋咬紧牙，使出最快的速度，一口气往前冲。他眼看就要跑过黑猫身边，黑猫却突然睁开眼，立刻追了上来。喋喋抢先到了树下，像一道红色的小闪电，哧溜一下蹿上树。
        - id: ch02-b04
          speaker: narrator
          text: 这下他总算安全了，至少黑猫不敢跟到细树枝上。可是，农夫布朗的儿子看见黑猫猛冲到树下，就停下手里的斧头，望着她死死盯住树上的喋喋。
        - id: ch02-b05
          speaker: farmer_browns_boy
          text: 黑猫，你盯着什么呢？看得这么起劲。
        - id: ch02-b06
          speaker: narrator
          text: 男孩看不见喋喋。喋喋早就机灵地躲到了树干另一边。
        - id: ch02-b07
          speaker: farmer_browns_boy
          text: 那里是不是有东西？你想让我也看看吗？
        - id: ch02-b08
          speaker: narrator
          text: 他说着，便朝那棵树走过去。喋喋吓得心脏狂跳，咚、咚、咚！
    - id: ch03
      title: 萨米及时解围
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 就在这时候，老果园那边忽然传来一阵大叫大嚷。
        - id: ch03-b02
          speaker: sammy
          text: 有贼！有贼！有贼！
        - id: ch03-b03
          speaker: narrator
          text: 萨米扯开嗓门，闹出了好大的动静。农夫布朗的儿子立刻转头，朝老果园那边望去。
        - id: ch03-b04
          speaker: farmer_browns_boy
          text: 难道那只狐狸又到附近乱转了？
        - id: ch03-b05
          speaker: narrator
          text: 趁男孩还在张望、猜测，喋喋赶紧跳到玉米仓顶上，又从屋檐下面那个早就发现的洞口钻了进去。他终于长长地松了一口气。
        - id: ch03-b06
          speaker: chatterer
          text: 萨米准是故意那么叫的。他想让农夫布朗的儿子看那边，别再抬头找我。
        - id: ch03-b07
          speaker: narrator
          text: 喋喋猜得一点儿没错。萨米并不想让他真的受伤，所以才在最要紧的时候骗过农夫布朗的儿子。以前萨米也常这么干。红狐雷迪明明不在那里，他却装成发现了狐狸，放声大叫，把男孩骗得团团转。
    - id: ch04
      title: 玉米终于拿到了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 农夫布朗的儿子仔细瞧了半天，确定雷迪不在老果园，这才又转向黑猫。黑猫还在瞪着喋喋刚才待过的地方。男孩也抬头看了看，树上当然什么也没有。
        - id: ch04-b02
          speaker: farmer_browns_boy
          text: 黑猫，我看你准是在做梦，梦见那里有什么东西了。
        - id: ch04-b03
          speaker: narrator
          text: 男孩弯下腰，轻轻摸了摸黑猫，然后回去接着劈柴。黑猫又等了几分钟，便走到谷仓那边，想捉只老鼠安慰自己。
        - id: ch04-b04
          speaker: narrator
          text: 喋喋一直等到机会来了，才从玉米仓出来，平平安安回到老石墙。这一回，他的两个腮帮子里，塞满了给萨米带的玉米。
