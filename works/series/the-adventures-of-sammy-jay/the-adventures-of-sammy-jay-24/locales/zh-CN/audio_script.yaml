audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 急性直率，发怒时尖锐泼辣
        timbre: 明亮细脆
        pace: 快而有弹性
        pitch: 高音
    sammy:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 爱管闲事又自信，开口爽快，带一点得意
        timbre: 清亮而响亮
        pace: 明快利落
        pitch: 中高音
  chapters:
    - id: ch01
      title: 萨米又来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 冠蓝鸦萨米一连几天没到老果园来。红松鼠喋喋开始纳闷，萨米难道吃腻玉米了？可喋喋已经明白，什么事都得事先准备好。
        - id: ch01-b02
          speaker: narrator
          text: 所以，他每天早晨去过农夫布朗家的玉米仓，总要带回一大批玉米。他把这些玉米带回老果园，一些分藏在石墙各处的几个秘密角落里，另一些放进一棵老苹果树的树洞。喋喋可不信萨米已经彻底死心。他知道，萨米还会来找麻烦，于是决定事事都要有备无患。
        - id: ch01-b03
          speaker: narrator
          text: 果然，一天清早，萨米出现了。喋喋一点儿也不意外，还装出很高兴的样子。其实，他也差不多真有些高兴。萨米过去已经一次次证明，他的脑筋总比喋喋灵。这一回，喋喋正想赢回来。
        - id: ch01-b04
          speaker: narrator
          text: 萨米眼里闪着顽皮的光。喋喋立刻看出来，那顶神气的小帽子底下，准又藏着新花样。
    - id: ch02
      title: 两边都在装客气
      blocks:
        - id: ch02-b01
          speaker: chatterer
          text: 早上好啊，冠蓝鸦萨米。我还当你已经不爱吃玉米了呢。我替你备了些顶好的玉米，都是从农夫布朗家的玉米仓里挑来的。今天早晨想吃一点儿吗？
        - id: ch02-b02
          speaker: narrator
          text: 喋喋说得客客气气，当然，那是故意装出来的。
        - id: ch02-b03
          speaker: sammy
          text: 好吧，那我就来一点儿。你特意给我挑最好的玉米，想得可真周到。我光想到这些玉米，肚子就饿了，恨不得这一刻马上吃到呢。
        - id: ch02-b04
          speaker: narrator
          text: 萨米也装得十分客气。他一边说，一边把头转开，偷偷咧嘴笑了。
        - id: ch02-b05
          speaker: sammy
          text: 喋喋一定会直接跑到石墙里的藏粮处去。到时候，就有好戏看了。
        - id: ch02-b06
          speaker: narrator
          text: 萨米飞快地朝那边看了一眼。墙后露出半片红色，那是狐狸雷迪的红外套。雷迪正藏在萨米交代好的地方。
    - id: ch03
      title: 喋喋换了一个地方
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可这时候，喋喋也在飞快地动脑筋。他记得萨米从前那些狡猾的把戏，也确信萨米又设下了圈套。
        - id: ch03-b02
          speaker: chatterer
          text: 他知道我在石墙里替他藏了玉米，当然盼着我直接去那里。要是真有麻烦，也一定等在那儿。我还是去一个他不知道的地方拿吧。
        - id: ch03-b03
          speaker: narrator
          text: 喋喋马上沿着树枝飞奔，跳到另一棵树上，再跳到第三棵树上。那棵树的树洞里，也藏着玉米。没过多久，他就回来了，两边腮帮子都塞得鼓鼓的。
        - id: ch03-b04
          speaker: narrator
          text: 萨米装出非常高兴的样子，吃玉米时却好像没了胃口。他确实吃不下了，因为他正发愁该怎么向狐狸雷迪交代。他答应过，要给雷迪一个捉住喋喋的机会。如今，雷迪准会以为这又是萨米耍的把戏。
        - id: ch03-b05
          speaker: narrator
          text: 玉米还没吃完，萨米就客气地道了别，飞进绿森林最深的地方去了。
    - id: ch04
      title: 这回轮到喋喋笑了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 喋喋那双尖眼睛发现了狐狸雷迪。雷迪正想悄悄溜走，不让谁看见。
        - id: ch04-b02
          speaker: chatterer
          text: 哈，哈，哈！呵，呵，呵！这回轮到我笑啦。哈，哈，哈！呵，呵，呵！
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: 就这样，这一回是喋喋笑到了最后。不过萨米很清楚，只要耐心等着，总会再轮到他笑。
        - id: ch04-b04
          speaker: narrator
          text: 只是现在，萨米还惦记着另一件事。他对大熊巴斯特的种种奇遇非常感兴趣。要是你也想知道那些故事，可以去读另一本书。那本书从头到尾专门讲的，都是巴斯特来到绿森林安家以后发生的事。
