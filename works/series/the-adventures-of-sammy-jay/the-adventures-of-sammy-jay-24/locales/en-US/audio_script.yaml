audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, excitable, and self-important
        timbre: bright and piercing
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Chatterer Has His Turn to Laugh
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sammy Jay had stayed away from the Old Orchard for several days. Chatterer the Red Squirrel began to wonder if Sammy had finally grown tired of corn. Still, Chatterer knew it was always best to be ready.
        - id: ch01-b02
          speaker: narrator
          text: Each morning, Chatterer visited Farmer Brown's corn-crib. He carried plenty of corn back to the Old Orchard and hid it in secret places. Some went into different parts of the stone wall. The rest went into a hollow in an old apple tree. Chatterer could not quite believe that Sammy had given up trying to make trouble for him, so he kept preparing.
        - id: ch01-b03
          speaker: narrator
          text: Then, early one morning, Sammy appeared. Chatterer was not surprised at all. He acted glad to see Sammy, and in fact, he was almost glad. Sammy had outwitted him so many times that Chatterer wanted a chance to get even.
        - id: ch01-b04
          speaker: narrator
          text: Mischief sparkled in Sammy's eyes. Chatterer noticed it at once. He guessed that Sammy had another plan tucked under that pert cap of his.
        - id: ch01-b05
          speaker: chatterer
          text: Good morning, Sammy Jay. I was starting to think you'd had enough corn. But I've saved some lovely corn for you, the very best I could find in Farmer Brown's corn-crib. Would you care for some this morning?
        - id: ch01-b06
          speaker: narrator
          text: Chatterer sounded very polite, though he was only pretending.
        - id: ch01-b07
          speaker: sammy_jay
          text: Why, yes, I think I would. How kind of you to choose the best corn just for me. Thinking about it has made me hungry. I'd like some right now.
        - id: ch01-b08
          speaker: narrator
          text: Sammy was pretending to be just as polite. As he spoke, he turned his head to hide a grin.
        - id: ch01-b09
          speaker: narrator
          text: Sammy was sure Chatterer would go straight to the hiding place in the stone wall. Then the fun would begin. He took a quick look that way. A patch of red showed from behind the wall. It was Reddy Fox's red coat. Reddy was hiding exactly where Sammy had told him to wait.
        - id: ch01-b10
          speaker: narrator
          text: But Chatterer was thinking fast. He remembered the clever tricks Sammy had played before, and he was certain Sammy had planned one more. There was not the least doubt in his mind. Sammy expected him to fetch the corn from the place Sammy knew about. If trouble was waiting anywhere, it would be waiting there. So Chatterer decided to use a hiding place Sammy had never seen.
        - id: ch01-b11
          speaker: narrator
          text: Chatterer raced along a branch of his tree. He leaped to another tree, then to a third. That tree held the hollow where he had stored some corn. A few minutes later, he returned with both cheeks stuffed full.
        - id: ch01-b12
          speaker: narrator
          text: Sammy acted delighted, but he ate as though his appetite had disappeared. And it had. He was wondering what he could possibly tell Reddy Fox. Sammy had promised him a chance to catch Chatterer. Now Reddy would be sure the whole thing had been one of Sammy's tricks.
        - id: ch01-b13
          speaker: narrator
          text: Sammy did not even finish the corn. He gave Chatterer a polite good-bye and flew off toward the deepest part of the Green Forest.
        - id: ch01-b14
          speaker: narrator
          text: Then Chatterer's sharp eyes caught sight of Reddy Fox trying to slip away unseen.
        - id: ch01-b15
          speaker: chatterer
          text: Ha, ha, ha! Ho, ho, ho! Now it's my turn to laugh! Ha, ha, ha! Ho, ho, ho!
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: So, for the moment, Chatterer had the last laugh. Sammy knew his own turn would come again if he could only be patient. But just then, he had something else on his mind. He was deeply interested in the adventures of Buster Bear.
        - id: ch01-b17
          speaker: narrator
          text: If those adventures interest you too, you can find them in another book, all about what happened when Buster came to live in the Green Forest.
