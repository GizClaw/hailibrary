audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: clever, smug, and quick to make mischief
        timbre: bright and sharp
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Black Pussy Almost Catches a Good Breakfast
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Black Pussy went out very early that morning to hunt for breakfast. Did she need to hunt? Oh, my, no! She didn't need a thing. Every morning, Farmer Brown's boy filled a saucer with warm, fresh milk for her. Every day, she also had all the meat that was good for her. There was no need in the world for Black Pussy to hunt.
        - id: ch01-b02
          speaker: narrator
          text: But Black Pussy was like all cats. When she lay by the fire in Farmer Brown's house, blinking and purring, she looked far too gentle and good-natured to hurt anyone. Everyone in Farmer Brown's family said she was gentle, and they believed it. They knew nothing about the little nests that stood empty in the joyful springtime. Those nests were empty because Black Pussy had found them, emptied them, and broken the hearts of the little father and mother birds.
        - id: ch01-b03
          speaker: narrator
          text: You see, Farmer Brown's family didn't truly know Black Pussy. The little people of the forest and meadow did. They knew that deep inside she was fierce and cruel, like every cat. Every one of them hated her. They knew she carried the same love of killing that lived in the heart of Shadow the Weasel. If Black Pussy had needed to hunt for her living, they wouldn't have minded quite so much. But she didn't need to hunt, and that was why they hated her.
        - id: ch01-b04
          speaker: narrator
          text: On this particular morning, Black Pussy decided to search along the old stone wall at the edge of the Old Orchard. She had often hunted Striped Chipmunk there. She didn't know enough about the ways of the little people of the Green Forest and the Green Meadows to understand where he was. The cold weather had sent Striped Chipmunk underground, into his snug bedroom, for a long sleep.
        - id: ch01-b05
          speaker: narrator
          text: So Black Pussy crept from stone to stone, hoping to surprise him. She had covered half the length of the old wall without seeing a single thing to catch. Then she heard voices, and she forgot all about Striped Chipmunk.
        - id: ch01-b06
          speaker: narrator
          text: Black Pussy flattened herself against the ground so no one would see her. Softly, she crept closer and closer. At last, she peeped from behind a big stone in the wall. There were Chatterer the Red Squirrel, Peter Rabbit, and Sammy Jay. They were talking so eagerly and excitedly that they didn't seem to notice anything else.
        - id: ch01-b07
          speaker: narrator
          text: Sammy Jay was safe in an old apple tree. Chatterer stood on the stone wall, while Peter sat on the ground. Which one should Black Pussy catch? Peter would make the biggest and best breakfast. But she remembered the terrible kick he had once given her when she caught little Miss Fuzzytail up in the Old Pasture. Black Pussy had great respect for Peter's strong hind legs.
        - id: ch01-b08
          speaker: narrator
          text: She decided that Chatterer would do for breakfast that morning. She hated him anyway. Many times, he had been very saucy to her. If she caught him, he would never laugh at her or call her names again.
        - id: ch01-b09
          speaker: narrator
          text: Black Pussy stole forward, moving more slowly and carefully than ever. Excitement made her eyes look yellow, fierce, and cruel. At last, she reached a spot where one good leap would land her right on Chatterer. Very carefully, she drew her feet beneath her. She was ready to jump, and the tip of her black tail twitched eagerly.
        - id: ch01-b10
          speaker: narrator
          text: Just as Black Pussy was about to spring, Sammy Jay gave a shrill scream. His sharp eyes had caught sight of that moving tail tip, and he knew exactly what it meant.
        - id: ch01-b11
          speaker: narrator
          text: Black Pussy sprang, but she was one instant too late. The moment Sammy screamed, Chatterer dived headfirst between the stones of the old wall. Peter plunged headfirst into Johnny Chuck's house, for he happened to be sitting right on its doorstep.
        - id: ch01-b12
          speaker: narrator
          text: Black Pussy looked up at Sammy Jay and snarled in a terrible rage. Sammy screamed back at her just as angrily.
        - id: ch01-b13
          speaker: narrator
          text: Then Black Pussy turned her head away for just an instant. Sammy darted down and actually pulled a tuft of hair from her coat. Before she could turn and leap at him, he was safely out of reach again.
        - id: ch01-b14
          speaker: narrator
          text: Next, Black Pussy pushed one paw between the stones where Chatterer had disappeared. She snatched it out again with a yowl of pain. Chatterer's sharp little teeth had bitten her paw.
        - id: ch01-b15
          speaker: narrator
          text: Slowly and sullenly, Black Pussy turned toward Farmer Brown's house and limped away. All at once, she remembered her saucer of milk. After all, that was really all the breakfast she wanted.
