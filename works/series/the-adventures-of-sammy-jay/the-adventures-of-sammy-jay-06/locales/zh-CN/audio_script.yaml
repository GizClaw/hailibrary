audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵自得，盘算时透着狡猾
        timbre: 清脆明亮
        pace: 轻快灵活
        pitch: 中高音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼机敏，打趣时俏皮又直率
        timbre: 清亮柔和
        pace: 轻快自然
        pitch: 中高音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 急性直率，发怒时尖锐泼辣
        timbre: 明亮细脆
        pace: 快而有弹性
        pitch: 高音
  chapters:
    - id: ch01
      title: 黑猫咪根本不缺早餐
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 天刚蒙蒙亮，黑猫咪就出门找早餐了。可她真需要自己找吃的吗？哎哟，根本不需要！她什么都不缺。每天早晨，农夫布朗家的男孩都会给她一碟温热的新鲜牛奶。每天，她也有足够的肉吃，再多就对身体没好处了。天底下再没有哪只猫比她更不需要捕猎啦。
        - id: ch01-b02
          speaker: narrator
          text: 可黑猫咪和所有的猫一样。她趴在农夫布朗家的炉火前，舒服地眯起眼睛，喉咙里呼噜呼噜地响。瞧那模样，她的脾气可真好，也真温顺，仿佛谁都舍不得伤害。农夫布朗一家都是这么说的，也都信得很。他们不知道，欢乐的春天一到，有些小巢为什么会突然空掉。因为黑猫咪找到那些巢，把里面掏空了，也让鸟爸爸和鸟妈妈伤透了心。
        - id: ch01-b03
          speaker: narrator
          text: 所以说，农夫布朗一家根本不了解黑猫咪。森林和草地上的小居民却很了解她。他们知道，黑猫咪的骨子里凶狠又残忍，和所有的猫没有两样。她心里那股杀戮的欲望，跟黄鼠狼影子心里的欲望一模一样。小居民们个个都恨她。要是她非靠捕猎才能活下去，大家还不会那么在意。可她明明不捕猎也能过日子，这才叫大家格外恨她。
    - id: ch02
      title: 旧石墙边的猎物
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这天早晨，黑猫咪沿着老果园边上的旧石墙找了起来。她以前常在这里捕猎花栗鼠条纹。可她不懂绿森林和绿草地上那些小居民的习性。她哪里知道，天一冷，条纹就躲进地下暖和的卧室，睡他的长觉去了。
        - id: ch02-b02
          speaker: narrator
          text: 黑猫咪还是从一块石头后面挪到另一块石头后面，盼着能突然逮住条纹。她走过半道，连个猎物的影子也没瞧见，却听到了一阵说话声。条纹立刻被她忘得干干净净。她把肚皮贴在地上，不让谁发现自己，然后一点一点，无声无息地靠了过去。
        - id: ch02-b03
          speaker: narrator
          text: 到了一块大石头后面，黑猫咪悄悄探头一看。红松鼠喋喋、彼得兔和松鸦萨米正在那里。三个伙伴谈得又起劲又激动，好像什么别的动静都顾不上了。
    - id: ch03
      title: 黑猫咪选中了喋喋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 萨米坐在一棵老苹果树上，很安全。喋喋却待在旧石墙上，彼得就在地面上。黑猫咪该抓哪一个呢？彼得最大，拿来做早餐也最美味。可是她还记得，有一回她在老牧场抓住小绒尾姑娘，彼得狠狠踢过她一脚。那双强壮的后腿，她可不敢小看。
        - id: ch03-b02
          speaker: narrator
          text: 那就抓喋喋吧。今天早晨，只要抓到他，黑猫咪也就满意了。再说，她本来就恨喋喋。谁叫他好几次都对她出言无礼呢？只要逮住了他，往后他就再也不能嘲笑她，也不能骂她了。
    - id: ch04
      title: 差一点到手的早餐
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 黑猫咪走得更慢，也更小心了。她兴奋得双眼发黄，目光又凶狠又残忍。终于，只要再向前一跳，她就能扑到喋喋身上。她悄悄把四只脚收在身下，准备扑出去。急不可待的黑尾巴尖儿，忍不住轻轻抽动起来。
        - id: ch04-b02
          speaker: narrator
          text: 就在黑猫咪要起跳的那一刻，萨米突然尖叫起来。他看见了那截摆动的尾巴尖，马上明白是怎么回事。黑猫咪扑了出去，可惜就迟了那么一点。尖叫声一响，喋喋一头钻进了旧石墙的石缝。彼得刚好坐在土拨鼠约翰尼家的门阶上，也一头扎进了约翰尼的屋子。
        - id: ch04-b03
          speaker: narrator
          text: 黑猫咪暴跳如雷，仰头冲萨米龇牙低吼。萨米也气得朝她尖声大叫。趁她转头的一瞬间，萨米猛地俯冲下来，竟然从她身上扯走了一撮毛。黑猫咪还没来得及回身扑他，萨米早就飞远了。
        - id: ch04-b04
          speaker: narrator
          text: 黑猫咪又把一只爪子伸进喋喋藏身的石缝。下一刻，她疼得号叫一声，赶紧把爪子缩了回来。原来，尖尖的小牙齿狠狠咬了她一口。
        - id: ch04-b05
          speaker: narrator
          text: 黑猫咪阴沉着脸，慢慢转过身，一瘸一拐地朝农夫布朗家走去。她忽然想起了那碟牛奶。其实，她真正想吃的早餐，有那碟奶也就足够了。
