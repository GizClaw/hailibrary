audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, excitable, and self-important
        timbre: bright and piercing
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Chatterer and Sammy Jay Make Up
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When Chatterer heard Sammy Jay say he was going straight to the Green Forest to tell Shadow the Weasel where Chatterer lived, fear filled his heart. At once, he forgot his quarrel with Sammy. He forgot that he wanted all the corn in Farmer Brown's corn-crib for himself. He could think of nothing but Shadow.
        - id: ch01-b02
          speaker: narrator
          text: Shadow was the reason Chatterer had left the Green Forest and moved to the Old Orchard. If Shadow found him there, Chatterer had no idea what he would do or where he could go.
        - id: ch01-b03
          speaker: narrator
          text: Worse still, Chatterer knew Sammy meant what he had said. Telling Shadow would be dreadful, but angry people sometimes do dreadful things, and Sammy was very, very angry. He had already spread his wings when Chatterer spoke.
        - id: ch01-b04
          speaker: chatterer
          text: Please don't do it, Sammy Jay. I... I... I didn't mean all those terrible things I said.
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: Sammy's eyes snapped. He could see how frightened Chatterer was. And Sammy was sharp enough to know what that fear meant. As long as Shadow was nearby, Chatterer would be afraid enough to do whatever Sammy wanted.
        - id: ch01-b06
          speaker: sammy_jay
          text: So, am I any more of a thief than you are?
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: Chatterer answered slowly. It seemed to take all his strength just to say the word.
        - id: ch01-b08
          speaker: chatterer
          text: No-o-o.
        - id: ch01-b09
          speaker: sammy_jay
          text: And are you going to play any more tricks on me?
        - id: ch01-b10
          speaker: narrator
          text: This time, Chatterer answered much faster.
        - id: ch01-b11
          speaker: chatterer
          text: No, I won't.
        - id: ch01-b12
          speaker: sammy_jay
          text: Well, I'll think about it tonight and decide in the morning. Maybe I'll tell Shadow where you live, and maybe I won't. I'll have to think it over.
        - id: ch01-b13
          speaker: narrator
          text: Sammy already knew that Chatterer would not sleep a wink that night. He would be too busy worrying. Sammy had also decided that he would never tell Shadow. Like all the other little meadow and forest people, he hated the weasel.
        - id: ch01-b14
          speaker: narrator
          text: But Chatterer had no way of knowing that. The thought that Sammy might tell still clutched at his heart.
        - id: ch01-b15
          speaker: chatterer
          text: If you promise not to tell Shadow where I am, you... you can have all the corn you want from Farmer Brown's corn-crib.
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: Chatterer's voice had become very meek.
        - id: ch01-b17
          speaker: sammy_jay
          text: Oh, really? That's very generous of you, considering the corn isn't yours. I have just as much right to it as you do.
        - id: ch01-b18
          speaker: chatterer
          text: And... well, I'll even help you get it.
        - id: ch01-b19
          speaker: narrator
          text: Chatterer's quick mind was working as hard as it could. He had to find some way to make Sammy promise.
        - id: ch01-b20
          speaker: sammy_jay
          text: How are you going to help me?
        - id: ch01-b21
          speaker: chatterer
          text: When you can't reach the corn through the cracks, I'll carry some outside. Then I'll hide it in the stone wall for you to find.
        - id: ch01-b22
          speaker: narrator
          text: In his heart, though, Chatterer planned to hide the corn so well that Sammy would have to hunt a long time for it. Sammy almost seemed to read that thought. He cocked his head to one side before answering.
        - id: ch01-b23
          speaker: sammy_jay
          text: I'll promise not to tell Shadow if you promise to bring me corn whenever I want it and put it exactly where I tell you.
        - id: ch01-b24
          speaker: narrator
          text: Chatterer did not like that bargain at all. But what else could he do? He thought for so long that Sammy spread his wings as if he might leave for the Green Forest that very instant.
        - id: ch01-b25
          speaker: chatterer
          text: I promise!
          emotion: fearful
        - id: ch01-b26
          speaker: narrator
          text: And that was how these two Green Forest scamps made up. Together, they planned to live all winter on Farmer Brown's corn.
