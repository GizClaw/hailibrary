audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    sammy:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 爱管闲事又自信，开口爽快，带一点得意
        timbre: 清亮而响亮
        pace: 明快利落
        pitch: 中高音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 机敏急躁，伶牙俐齿，情绪来得又快又直
        timbre: 轻快而尖亮
        pace: 快速灵活
        pitch: 高音
  chapters:
    - id: ch01
      title: 喋喋害怕了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 喋喋听见萨米要马上飞到绿森林，把他住在老果园的消息告诉黄鼠狼影子，心里一下子全是恐惧。他忘了两人还在吵架，也忘了自己想把农夫布朗家玉米仓里的玉米全都独吞。刚才发生的一切，他都顾不上了，只记得影子有多可怕。
        - id: ch01-b02
          speaker: narrator
          text: 当初，喋喋正是为了躲影子，才离开绿森林，搬到老果园。影子要是在这里找到他，他不知道该怎么办，也不知道还能逃到哪里。
        - id: ch01-b03
          speaker: narrator
          text: 喋喋知道，萨米说得出就做得到。向影子告密实在可怕，可人发起火来，什么可怕的事都可能干。萨米这会儿正气得厉害，翅膀都已经张开了。
        - id: ch01-b04
          speaker: chatterer
          text: 求求你，别那么做，萨米。我……我……我刚才说的那些坏话，不是当真的。
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: 萨米眼睛一闪，立刻看出喋喋怕极了。他也明白，只要影子还在附近，喋喋以后就会吓得乖乖听话。萨米叫他做什么，他都会照办。你瞧，萨米精明得很。
    - id: ch02
      title: 萨米让喋喋等一夜
      blocks:
        - id: ch02-b01
          speaker: sammy
          text: 难道我比你更像小偷吗？
        - id: ch02-b02
          speaker: chatterer
          text: 不……不……
        - id: ch02-b03
          speaker: narrator
          text: 喋喋慢吞吞地挤出这句话，仿佛说它比干什么活儿都费劲。
        - id: ch02-b04
          speaker: sammy
          text: 那你以后还会捉弄我吗？
        - id: ch02-b05
          speaker: chatterer
          text: 不会了。
        - id: ch02-b06
          speaker: narrator
          text: 这一回，喋喋答得爽快多了。
        - id: ch02-b07
          speaker: sammy
          text: 好吧，我得仔细想想，明早再作决定。也许我会告诉影子你住在哪里，也许不会。让我好好想一夜。
        - id: ch02-b08
          speaker: narrator
          text: 萨米当然知道，喋喋今晚准会担心得一眼也合不上。其实，他早就决定不去告诉影子了。草地和森林里的小家伙全都恨透了影子，萨米也不例外。
        - id: ch02-b09
          speaker: narrator
          text: 可喋喋哪知道萨米早已拿定了主意？一想到萨米也许真会去告诉影子，巨大的恐惧就紧紧揪住了他的心。
    - id: ch03
      title: 一笔玉米交易
      blocks:
        - id: ch03-b01
          speaker: chatterer
          text: 只要你答应，不告诉影子我住在哪里，农夫布朗家玉米仓里的玉米，你……你想吃多少都行。
          emotion: fearful
        - id: ch03-b02
          speaker: narrator
          text: 喋喋的声音变得低声下气。
        - id: ch03-b03
          speaker: sammy
          text: 是吗！你可真大方。那些玉米反正也不是你的，我和你一样有权吃。
        - id: ch03-b04
          speaker: chatterer
          text: 还有……还有……嗯，我可以帮你拿玉米。
        - id: ch03-b05
          speaker: narrator
          text: 喋喋那颗机灵的脑袋一个劲儿地转着。他非得想出一个办法，让萨米亲口保证不去告密。
        - id: ch03-b06
          speaker: sammy
          text: 你怎么帮我？
        - id: ch03-b07
          speaker: chatterer
          text: 你从缝里够不到玉米时，我就替你拿出来一些，藏在石墙里，让你去找。
        - id: ch03-b08
          speaker: narrator
          text: 可喋喋暗自盘算，一定要把玉米藏得隐蔽些，让萨米找上老半天。萨米仿佛把他这个小算盘看得一清二楚。他把头歪到一边，提出了自己的条件。
    - id: ch04
      title: 两个小淘气言归于好
      blocks:
        - id: ch04-b01
          speaker: sammy
          text: 你得答应，不管我什么时候想吃玉米，都替我拿来，还要放在我指定的地方。这样，我才答应不告诉影子。
        - id: ch04-b02
          speaker: narrator
          text: 喋喋一点儿也不喜欢这个条件，可他又能怎么办呢？他想了好久。萨米等得张开翅膀，仿佛马上就要飞往绿森林。
        - id: ch04-b03
          speaker: chatterer
          text: 我答应！
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: 喋喋慌忙叫了出来。就这样，绿森林里的两个小淘气言归于好，还一起盘算着，怎样靠农夫布朗家的玉米过完整个冬天。
