audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    sammy:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 爱管闲事又自信，开口爽快，带一点得意
        timbre: 清亮而响亮
        pace: 明快利落
        pitch: 中高音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 机敏急躁，伶牙俐齿，情绪来得又快又直
        timbre: 轻快而尖亮
        pace: 快速灵活
        pitch: 高音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 朴实爽朗，遇事好奇，做事认真
        timbre: 清朗自然
        pace: 平稳适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 一场难看的争吵
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 人一发起脾气来，那模样真难看！彼此骂得不堪入耳，有时又抓又咬。快乐的小微风一溜烟跑开，找地方躲了起来，因为喋喋大发脾气，冠蓝鸦萨米也是一样。
        - id: ch01-b02
          speaker: narrator
          text: 这可真是糟透了！只要听得见他们叫嚷，那些小家伙一整天的好心情就全叫他们搅没了。萨米终于弄明白，在农夫布朗家的玉米仓把他吓得魂飞魄散的不是男孩设下的圈套，而是喋喋。他的怒火一下冲出了头顶。
        - id: ch01-b03
          speaker: narrator
          text: 喋喋嘴里塞满玉米，没法说话，可他还能跑。他飞快地蹿过农夫布朗家的院子，直奔老果园边上的旧石墙，只想赶快躲进安全的墙缝里。萨米就在后面紧追，还扯着嗓子一路尖叫。
        - id: ch01-b04
          speaker: sammy
          text: 小偷！小偷！小偷！
          emotion: angry
    - id: ch02
      title: 鲍泽找到了狐狸的踪迹
      blocks:
        - id: ch02-b01
          speaker: farmer_browns_boy
          text: 我的天，怎么吵成这样！那只冠蓝鸦闹得这么凶，附近准有狐狸。
          emotion: surprised
        - id: ch02-b02
          speaker: narrator
          text: 农夫布朗家的男孩打开门，放下挤奶桶，又转身回屋。没过一分钟，他就拿着那杆可怕的猎枪出来了。他直奔旧石墙。就在几分钟前，狐狸雷迪还躲在那里。幸亏萨米一冲喋喋尖叫，雷迪便立刻溜走了。
        - id: ch02-b03
          speaker: narrator
          text: 男孩没看到雷迪的踪迹，显得很失望。他走到猎犬鲍泽的小屋旁，解开了鲍泽的锁链。鲍泽一见猎枪，高兴得又摇尾巴又汪汪叫。他最爱打猎了。
        - id: ch02-b04
          speaker: narrator
          text: 鲍泽抢先跑回老果园。几乎就在转眼之间，他那低沉洪亮的叫声传了过来。凡是听得见的小家伙都知道，鲍泽那灵敏得不得了的鼻子已经嗅到了狐狸雷迪留下的踪迹。
        - id: ch02-b05
          speaker: farmer_browns_boy
          text: 我就知道。我就知道这里来过狐狸。
        - id: ch02-b06
          speaker: narrator
          text: 男孩无奈地叹了口气。要是能去追捕雷迪，他不知道会有多高兴。可两只空挤奶桶还放在那里，等着他去干活。他不是那种有活儿不干，只顾自己跑去玩的人。
    - id: ch03
      title: 萨米回来找喋喋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 萨米一看见农夫布朗家的男孩和猎枪，早就飞走了。喋喋躲进旧石墙，把塞在两颊里的玉米安安稳稳地藏好。
        - id: ch03-b02
          speaker: narrator
          text: 男孩刚去谷仓挤牛奶，萨米便悄悄溜回老果园寻找喋喋。他的火气一点儿也没消。没过多久，他看见喋喋正沿着旧石墙奔跑，立刻又叫了起来。
        - id: ch03-b03
          speaker: sammy
          text: 小偷！小偷！
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: 这会儿，喋喋嘴里已经空了，可以还嘴了。你也知道，在绿森林的所有小家伙当中，他那张嘴可是数得着的厉害。
        - id: ch03-b05
          speaker: chatterer
          text: 你才是小偷！你才是！你偷了我的玉米！
          emotion: angry
        - id: ch03-b06
          speaker: sammy
          text: 那才不是你的玉米，就像它不是我的一样！最先把玉米的事告诉你的人可是我。小偷！小偷！小偷！
          emotion: angry
    - id: ch04
      title: 萨米想到了黄鼠狼影子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这一来，他们越骂越难听。老果园从来没有听过这么厉害的争吵，从来没有！实在太可怕了！他们没完没了地吵了一整天。
        - id: ch04-b02
          speaker: narrator
          text: 农夫布朗家的男孩有两次跑来查看，想知道那只狐狸是不是又回来了。他只是挠着头，怎么也想不明白，究竟出了什么事，值得他们闹成这样。
        - id: ch04-b03
          speaker: narrator
          text: 最后，萨米忽然有了一个主意。
        - id: ch04-b04
          speaker: sammy
          text: 我这就到绿森林去，把你住的地方告诉黄鼠狼影子！等他找到你，你就再也偷不了玉米，也不能再这么贪心，连一点儿都不肯分给别人了！
          emotion: angry
