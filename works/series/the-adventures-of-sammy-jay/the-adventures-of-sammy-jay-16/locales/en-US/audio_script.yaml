  chapters:
    - id: ch01
      title: Chatterer and Sammy Jay Quarrel
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When people lose their tempers, what a sorry sight it is. They shout dreadful names at each other, and sometimes they even scratch and bite. The Merry Little Breezes ran away and hid when Chatterer lost his temper. They did the same when Sammy Jay lost his.
        - id: ch01-b02
          speaker: narrator
          text: It was dreadful, and it spoiled the day for every little person who could hear them. Sammy had learned the truth about the fright he got at Farmer Brown's corn-crib. Chatterer had frightened him, not a trap set by Farmer Brown's boy. As soon as Sammy knew that, his temper boiled right over.
        - id: ch01-b03
          speaker: narrator
          text: Chatterer's mouth was packed with corn, so he couldn't answer. But he could run. He scampered across Farmer Brown's dooryard toward the old stone wall beside the Old Orchard. Sammy raced after him, screaming as loudly as he could.
        - id: ch01-b04
          speaker: sammy_jay
          text: Thief! Thief! Thief!
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: Farmer Brown's boy opened the door when he heard them.
        - id: ch01-b06
          speaker: farmer_browns_boy
          text: My goodness, what a noise! That jay is making such a fuss, you'd think a fox was out there.
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: He set down his milk pails and went back inside. A minute later, he came out carrying his terrible gun. He headed straight for the old stone wall, where Reddy Fox had been hiding only minutes before. Luckily for Reddy, he had slipped away as soon as Sammy began screaming at Chatterer.
        - id: ch01-b08
          speaker: narrator
          text: Farmer Brown's boy found no sign of Reddy, and he looked disappointed. Then he crossed to Bowser the Hound's little house and took off Bowser's chain.
        - id: ch01-b09
          speaker: narrator
          text: Bowser saw the gun, wagged his tail, and yelped with delight. He dearly loved to hunt. He ran ahead into the Old Orchard. Almost at once, his great, deep voice told everyone nearby that his wonderful nose had picked up Reddy Fox's tracks.
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: Just as I thought. A fox really was here.
        - id: ch01-b11
          speaker: narrator
          text: Farmer Brown's boy sighed. Nothing would have pleased him more than hunting Reddy. But his milk pails were still empty, and he wasn't the kind of boy who left his work just to have fun.
        - id: ch01-b12
          speaker: narrator
          text: Sammy had flown off the moment he saw Farmer Brown's boy with that terrible gun. Chatterer had hidden inside the old stone wall, where he safely put away all the corn stuffed in his cheeks.
        - id: ch01-b13
          speaker: narrator
          text: Farmer Brown's boy went to the barn to milk the cows. As soon as he was gone, Sammy slipped back into the Old Orchard to find Chatterer. His temper hadn't cooled one bit. Before long, he spotted Chatterer running along the wall and started shouting again.
        - id: ch01-b14
          speaker: sammy_jay
          text: Thief! Thief!
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: This time Chatterer's mouth was empty, so he could answer. And as you may know, Chatterer had one of the sharpest tongues among all the little people of the Green Forest.
        - id: ch01-b16
          speaker: chatterer
          text: You're the thief! You're the one who stole my corn!
          emotion: angry
        - id: ch01-b17
          speaker: sammy_jay
          text: That corn belongs to me just as much as it belongs to you! I was the one who told you about it. Thief! Thief! Thief!
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: After that, they called each other worse and worse names. The Old Orchard had never heard such a quarrel. They kept at it all day long. Twice, Farmer Brown's boy came down to see whether the fox had returned. Each time, he scratched his head and wondered what all the noise was about.
        - id: ch01-b19
          speaker: narrator
          text: At last, an idea came to Sammy Jay.
        - id: ch01-b20
          speaker: sammy_jay
          text: I'm going straight to the Green Forest and telling Shadow the Weasel where you live! Once he finds you, you won't steal any more corn, and you won't be so greedy that nobody else gets a share!
          emotion: angry
