audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 急性直率，发怒时尖锐泼辣
        timbre: 明亮细脆
        pace: 快而有弹性
        pitch: 高音
  chapters:
    - id: ch01
      title: 到底敢不敢去
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 冠蓝鸦萨米曾经透露，农夫布朗家有吃不完的玉米，想拿多少都很容易。从那以后，喋喋一直想亲自去看看萨米说的是不是真话，可他怎么也鼓不起勇气。
        - id: ch01-b02
          speaker: narrator
          text: 喋喋大半辈子都住在绿森林里，或是离森林不远的地方。他很怕农夫布朗的儿子，更怕那支吓人的枪。所以，他一向老老实实地避开农夫布朗家的院子。说穿了，他根本不敢去。那儿有黑猫咪，有猎犬鲍泽，还有农夫布朗的儿子。嗬，那地方危险得很！
        - id: ch01-b03
          speaker: narrator
          text: 可冠蓝鸦萨米每天都去，看上去一点儿也不怕。他甚至还敢责骂农夫布朗的儿子，对他说些无礼的话。喋喋心里犯起了嘀咕。萨米敢去，自己为什么不敢？自己当然和萨米一样勇敢！其实，喋喋一直认为萨米是个十足的胆小鬼。如今，这个胆小鬼却天天跑去拿玉米，仿佛那些玉米本来就是他的。
        - id: ch01-b04
          speaker: narrator
          text: 喋喋又想起了自己。他每天辛辛苦苦，想把空心横木仓库装满。忙活的时候，还得时时提防红尾鹰和狐狸雷迪。可不管怎么搬，过冬的玉米似乎总也攒不够。再说，从老果园去玉米地，每天都要走那么远。想到这里，喋喋叹了口气。
        - id: ch01-b05
          speaker: chatterer
          text: 要是萨米没骗我，农夫布朗家的玉米真的想拿多少就拿多少，那碰上坏天气，我可就轻松多了。反正去看一眼也没什么，我得亲自瞧瞧到底是怎么回事。
    - id: ch02
      title: 石墙尽头
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 喋喋就这样出发了。他沿着旧石墙轻快地往前跑，那道石墙一直通到农夫布朗家的院子。离院子越近，他越小心。每走几步，他就停下来看看，确定前面没有危险才接着走。
        - id: ch02-b02
          speaker: narrator
          text: 终于，喋喋来到石墙尽头。他躲进两块石头中间，悄悄探出头。宽路对面就是农夫布朗的房子。黑猫咪坐在后门台阶上晒太阳，已经快睡着了。
        - id: ch02-b03
          speaker: narrator
          text: 一看见她，喋喋就气不打一处来，差点忘了自己不能露面。他真想把心里的话全骂给黑猫咪听，可到底还是忍住了。他闭紧嘴巴，转动一双锐利的小眼睛，四处寻找存放玉米的地方。
        - id: ch02-b04
          speaker: narrator
          text: 猎犬鲍泽正在自己的小屋前睡得正香。喋喋还看见一座大谷仓、一间鸡舍、停放马车的棚子和长长的柴房。
        - id: ch02-b05
          speaker: chatterer
          text: 玉米到底放在哪儿呢？会不会就在这些屋子里的某一间？可要是在里面，萨米又是怎么拿到的？
    - id: ch03
      title: 满屋的玉米
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 就在这时，农夫布朗的儿子从谷仓里走了出来。喋喋一见到他，赶紧缩回石头后面。他也想开口责骂，就像刚才看见黑猫咪时一样。不过，这一次他很明智，牢牢管住了自己的嘴。
        - id: ch03-b02
          speaker: narrator
          text: 农夫布朗的儿子根本没往喋喋这边看。他径直走向一座古怪的小房子。那房子用四条腿高高架着，墙板之间留着一道道宽缝，缝里透出黄色的东西。
        - id: ch03-b03
          speaker: narrator
          text: 他登上几级台阶，打开房门。喋喋轻轻吸了一口气。玉米！满屋都是玉米！喋喋这辈子见过的玉米全加起来，也没有眼前这么多。他从来不知道，整个世界竟然能装下这么多玉米！
        - id: ch03-b04
          speaker: narrator
          text: 就在那一刻，喋喋下定了决心。不管黑猫咪、猎犬鲍泽和农夫布朗的儿子怎么阻拦，他也一定要吃到那些玉米。眼前这一大片玉米，已经把他的勇气全都鼓了起来。他觉得，现在自己什么都敢做。
