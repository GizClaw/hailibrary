audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Chatterer Screws Up His Courage
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sammy Jay had hinted that Farmer Brown's place was full of corn, and that anyone could take as much as he wanted. Ever since then, Chatterer had been trying to find the courage to go and see whether Sammy had told the truth.
        - id: ch01-b02
          speaker: narrator
          text: Chatterer had spent nearly all his life in the Green Forest or close beside it. He had a very sensible fear of Farmer Brown's boy and that dreadful gun. Until now, he had been quite content to stay away from Farmer Brown's dooryard.
        - id: ch01-b03
          speaker: narrator
          text: The truth was simple. Chatterer was afraid to go there. Black Pussy the Cat lived there. So did Bowser the Hound. And Farmer Brown's boy was there, too. Why, it was a terribly dangerous place!
        - id: ch01-b04
          speaker: narrator
          text: Still, Sammy Jay went there every day and never seemed afraid at all. He even scolded Farmer Brown's boy and called rude things to him. If Sammy dared to go, why shouldn't Chatterer? Chatterer was certainly as brave as Sammy Jay.
        - id: ch01-b05
          speaker: narrator
          text: Deep in his heart, Chatterer had always thought Sammy was quite a coward. Yet Sammy could go right up to Farmer Brown's and help himself to corn as though every kernel belonged to him.
        - id: ch01-b06
          speaker: narrator
          text: Chatterer thought about all the work he did each day to fill his storehouse in the hollow fence rail. Every moment, he had to watch for Redtail the Hawk and Reddy Fox. No matter how hard he worked, he could never seem to gather enough corn for the whole winter. Worse still, he had to travel a long way from the Old Orchard to the cornfield each day. Just thinking about it made him sigh.
        - id: ch01-b07
          speaker: chatterer
          text: If Sammy told the truth, and I really can get all the corn I want at Farmer Brown's, things will be so much easier when bad weather comes. Anyway, there's no harm in taking a look and seeing for myself.
        - id: ch01-b08
          speaker: narrator
          text: So Chatterer set off at a brisk run along the old stone wall that led straight toward Farmer Brown's yard. As he drew closer, he stopped every few steps and made sure the way ahead was clear.
        - id: ch01-b09
          speaker: narrator
          text: At last, he came to the very end of the wall. He hid between two stones and peeked out. Across a wide road stood Farmer Brown's house. Black Pussy was dozing in the sunshine on the back doorstep.
        - id: ch01-b10
          speaker: narrator
          text: Chatterer could hardly keep quiet. One look at Black Pussy made him so angry that he almost forgot he needed to stay hidden. He longed to tell her exactly what he thought of her. But he held his tongue.
        - id: ch01-b11
          speaker: narrator
          text: Instead, Chatterer used his sharp little eyes to hunt for the corn. He saw Bowser the Hound fast asleep in front of his own little house. He saw the big barn, the henhouse, the wagon shed, and the long woodshed.
        - id: ch01-b12
          speaker: chatterer
          text: I wonder if the corn is inside one of those buildings. And if it is, how does Sammy get to it?
        - id: ch01-b13
          speaker: narrator
          text: Just then, Farmer Brown's boy came out of the barn. The moment Chatterer saw him, he ducked back out of sight. Once again, Chatterer wanted to scold. And once again, he wisely kept quiet.
        - id: ch01-b14
          speaker: narrator
          text: Farmer Brown's boy never even looked toward the stone wall. He walked straight to a strange little building that stood high on four legs. There were wide cracks between its wall boards, and something yellow showed through them.
        - id: ch01-b15
          speaker: narrator
          text: The boy climbed several steps and opened a door. Chatterer gave a little gasp. There was the corn! He had never seen so much corn in his whole life. He hadn't known the entire world could hold so much.
        - id: ch01-b16
          speaker: narrator
          text: Right then, Chatterer decided he would have some of it, in spite of Black Pussy, Bowser the Hound, and Farmer Brown's boy. One look at all that corn screwed up his courage until he felt brave enough to dare anything.
