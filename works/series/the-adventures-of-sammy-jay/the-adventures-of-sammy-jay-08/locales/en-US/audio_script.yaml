audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: clever, smug, and quick to make mischief
        timbre: bright and sharp
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Sammy Jay Drops a Hint
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Chatterer the Red Squirrel may have many faults, but laziness is not one of them. No, sir. When Chatterer has a job to do, he keeps at it until the job is finished.
        - id: ch01-b02
          speaker: narrator
          text: Each morning, he rose with the sun. Then he raced along the old stone wall and the rail fences to Farmer Brown's cornfield. First he ate his breakfast. After that, he carried corn to the hollow fence rail he had turned into a storehouse.
        - id: ch01-b03
          speaker: narrator
          text: The work was hard because he had to hunt for every kernel. It was exciting, too. Every moment, Chatterer had to watch and listen so that he would not become somebody else's dinner.
        - id: ch01-b04
          speaker: narrator
          text: One morning, Redtail the Hawk discovered him. Chatterer slipped behind a fence post just in time. From then on, Redtail came every morning and watched from a treetop. He was waiting for Chatterer to become careless and wander too far from shelter.
        - id: ch01-b05
          speaker: narrator
          text: Then Reddy Fox caught him by surprise beside a pile of cornstalks. Chatterer barely had time to wriggle into the middle. Reddy had seen him go in, and he could smell him there.
        - id: ch01-b06
          speaker: narrator
          text: Reddy tiptoed softly around the pile to see whether Chatterer had slipped out the other side. Then he returned to the place where Chatterer had vanished and began digging eagerly. Dry stalks flew in every direction.
        - id: ch01-b07
          speaker: narrator
          text: Reddy made so much noise that Chatterer knew the fox would never hear him move. And Reddy didn't. While Reddy worked toward the center of the pile, Chatterer slipped out underneath. He dashed to another pile, made his way through it, and reached the fence. By the time Reddy got to the middle, Chatterer was safe inside his hollow rail.
        - id: ch01-b08
          speaker: narrator
          text: After that, Reddy came back each morning, hoping to catch Chatterer by surprise. Chatterer felt sure he could outwit both Reddy and Redtail. They interrupted his work and bothered him greatly, but he wasn't afraid of them. What he did fear was Shadow the Weasel finding out where he was. That thought troubled him a great deal.
        - id: ch01-b09
          speaker: narrator
          text: One morning, Sammy Jay happened to pass by. He saw Reddy Fox creeping behind some bushes at the edge of the cornfield. Whenever Sammy thought he could spoil Reddy's hunting, he always began to scream. This time was no different.
        - id: ch01-b10
          speaker: narrator
          text: Reddy looked up and showed Sammy every one of his long teeth. Sammy only grinned and screamed even louder. At last, Reddy walked away with great dignity. He knew there was no use trying to hunt while Sammy Jay was nearby.
        - id: ch01-b11
          speaker: narrator
          text: Once Reddy had disappeared into the Green Forest, Sammy returned to the cornfield. There he found Chatterer working as hard as ever. Chatterer hurried toward the hollow rail with his mouth full of corn.
        - id: ch01-b12
          speaker: chatterer
          text: Thank you, Sammy, for chasing that nuisance away. He gives me no end of trouble, and I still have a lot of work to do. I've got to fill my storehouse before it's too late.
        - id: ch01-b13
          speaker: sammy_jay
          text: Have you moved down here? I thought you lived up in the Old Orchard.
        - id: ch01-b14
          speaker: chatterer
          text: I do. Well, my house is still there. But there isn't any food there, so I made a storehouse down here. I'm trying to fill it with corn before the snow comes.
        - id: ch01-b15
          speaker: sammy_jay
          text: That's a long trip to make every day just to get something to eat.
        - id: ch01-b16
          speaker: chatterer
          text: I know. Still, I suppose I'm lucky to have any food waiting for me at all.
        - id: ch01-b17
          speaker: sammy_jay
          text: Pooh! I wouldn't work the way you do. I'd use my wits. If you want corn, why not go up to Farmer Brown's place? It's closer to the Old Orchard, and the corn is already stored there. You can simply help yourself. That's where I get all the corn I want.
