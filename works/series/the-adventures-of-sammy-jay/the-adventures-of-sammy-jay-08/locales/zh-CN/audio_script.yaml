audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 急性直率，发怒时尖锐泼辣
        timbre: 明亮细脆
        pace: 快而有弹性
        pitch: 高音
    sammy:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 爱管闲事又自信，开口爽快，带一点得意
        timbre: 清亮而响亮
        pace: 明快利落
        pitch: 中高音
  chapters:
    - id: ch01
      title: 一点儿也不懒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 红松鼠喋喋的毛病虽然很多，懒惰却绝不在其中。不，先生，他一点儿也不懒。手头只要有活儿，他马上就干，不干完绝不罢休。
        - id: ch01-b02
          speaker: narrator
          text: 每天太阳一出来，喋喋也起床了。他顺着旧石墙和一道道木栅栏，飞快地赶到农夫布朗的玉米地。到了那里，他先填饱肚子，再把找到的玉米搬进空心横木仓库。这份活儿并不轻松。他得四处寻找，才能捡到玉米。找的时候还要不停地听，不停地看，免得自己成了别人的一顿饭。
    - id: ch02
      title: 两个捣乱的猎手
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天早晨，还没有飞往南方的红尾鹰发现了喋喋。幸好喋喋及时躲到一根栅栏柱后面。从那天起，红尾鹰每天早晨都守在树顶，等着喋喋疏忽大意，走到离藏身处太远的地方。
        - id: ch02-b02
          speaker: narrator
          text: 又一天早晨，喋喋来到一堆玉米秸秆旁边，狐狸雷迪突然出现了。他赶紧扭着身子钻进秸秆堆深处。可雷迪已经瞧见他，也闻到了他的气味。雷迪轻轻踮着脚，绕着秸秆堆走了一圈，想看看喋喋是不是从另一边逃了。
        - id: ch02-b03
          speaker: narrator
          text: 没找到喋喋，雷迪又回到他钻进去的地方，急忙动爪刨了起来，越刨越起劲。干秸秆被他刨得四处乱飞，声音十分响。喋喋心想，雷迪闹出这么响的动静，准听不见自己移动。果然，雷迪一点儿也没听见。
        - id: ch02-b04
          speaker: narrator
          text: 等雷迪费力刨到秸秆堆中央，喋喋已经躲进了空心横木仓库。原来，他从秸秆底下悄悄溜走，跑进另一堆秸秆，又从那一堆里钻到栅栏边，就这样逃掉了。
        - id: ch02-b05
          speaker: narrator
          text: 此后，狐狸雷迪也天天早晨来，盼着打喋喋一个措手不及。喋喋倒觉得，自己完全有办法骗过雷迪和红尾鹰。他们会妨碍他干活，也确实讨厌，可他并不害怕。真正让他担心的是黄鼠狼影子。他唯恐影子听说自己藏在这里，这个念头一直叫他很不安。
    - id: ch03
      title: 萨米赶走雷迪
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天早晨，冠蓝鸦萨米恰巧飞过。他看见狐狸雷迪藏在玉米地边的灌木后，正偷偷往前靠。萨米只要有机会破坏雷迪打猎，向来不会放过。于是，他立刻扯开嗓门，大声尖叫。
        - id: ch03-b02
          speaker: narrator
          text: 雷迪抬起头，冲萨米露出满嘴长牙。萨米不但不怕，还咧嘴笑了，叫声也变得更响。雷迪知道，只要萨米还在这里，自己就别想捉到猎物。他只好摆出庄严的样子走开了。
        - id: ch03-b03
          speaker: narrator
          text: 雷迪消失在绿森林以后，萨米飞回玉米地，看见喋喋还在不停地干活。喋喋嘴里塞着玉米，急忙往空心横木那边跑。
        - id: ch03-b04
          speaker: chatterer
          text: 萨米，谢谢你把那个讨厌鬼赶走！他老来打扰我。我的仓库还没装满呢，再不抓紧时间，可就来不及了。
    - id: ch04
      title: 萨米提了个醒
      blocks:
        - id: ch04-b01
          speaker: sammy
          text: 你已经搬到这里住了吗？我一直以为你住在老果园呢。
        - id: ch04-b02
          speaker: chatterer
          text: 我还住在那里，至少我的家还在那里。可是老果园没有吃的，所以我把仓库造在了这儿。我得赶在下雪前，把它装满玉米。
        - id: ch04-b03
          speaker: sammy
          text: 那你每天都要走这么远，才能拿到吃的呀。
        - id: ch04-b04
          speaker: chatterer
          text: 我知道。不过有吃的可以拿，我已经算很走运啦。
        - id: ch04-b05
          speaker: sammy
          text: 呸！我可不会像你这么辛苦。你应该动动脑筋。既然你要吃玉米，干吗不去农夫布朗家？那里离老果园更近，玉米也全都收好了，你只管自己拿。我想吃多少，就去那里拿多少。
