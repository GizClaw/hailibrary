audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: friendly, practical, and good-natured
        timbre: youthful and clear
        pace: easy
        pitch: medium
  chapters:
    - id: ch01
      title: Chatterer Grows Reckless
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Chatterer noticed that one branch of his tree reached right over the roof of the little house. The very tips of its twigs were touching the roof.
        - id: ch01-b02
          speaker: narrator
          text: His eyes danced at the sight of it.
        - id: ch01-b03
          speaker: chatterer
          text: If I can't get inside from the ground, maybe I can get in from above.
        - id: ch01-b04
          speaker: narrator
          text: He chuckled, then quickly looked around to see if anyone was watching. No one was there except Black Pussy, staring up at him from the ground. Chatterer wasn't worried about her while he was so high above her. He scampered lightly along the branch, leaped onto the little roof, and hurried around its edge, peeping over every side. He needed an opening large enough to crawl through.
        - id: ch01-b05
          speaker: narrator
          text: At last, he spotted a knothole in one corner, tucked close beneath the edge of the roof. Chatterer gripped the wood with his sharp claws so he wouldn't fall. Slowly and carefully, he crept over until he reached the hole safely.
        - id: ch01-b06
          speaker: narrator
          text: The opening was too small for his whole head. So Chatterer began to gnaw. Gnaw, gnaw, gnaw! Tiny splinters flew. Gnaw, gnaw, gnaw! Soon the hole was wide enough, and he slipped safely inside.
        - id: ch01-b07
          speaker: narrator
          text: At that very moment, Farmer Brown's boy came out of the house. He noticed Black Pussy sitting on the ground and staring at the roof of the little house.
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: Hello, Puss! Did you think you heard a mouse in there? You couldn't have, because no mice can get inside. Come over to the barn with me, and I'll give you some nice, fresh, warm milk.
        - id: ch01-b09
          speaker: chatterer
          text: Phew! That was close! I'm glad that pesky black cat can't tell him what she saw!
          emotion: surprised
        - id: ch01-b10
          speaker: narrator
          text: Once the boy and Black Pussy were out of sight, Chatterer turned to look around. His eyes shone with greed. There was corn wherever he looked. Corn, corn, corn! It seemed to him that the little house held enough for every Squirrel in the world.
        - id: ch01-b11
          speaker: chatterer
          text: And all of it is mine!
        - id: ch01-b12
          speaker: narrator
          text: Chatterer gasped those words, forgetting completely that he was stealing. Then he started to eat. He ate and ate until he couldn't swallow even one more mouthful.
        - id: ch01-b13
          speaker: chatterer
          text: I think I'll take a nap right here.
        - id: ch01-b14
          speaker: narrator
          text: He curled up in the darkest corner. Within two minutes, he was fast asleep. In his dream, the whole world had turned into golden corn, and every bit of it belonged to him.
