audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 急性直率，发怒时尖锐泼辣
        timbre: 明亮细脆
        pace: 快而有弹性
        pitch: 高音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 爽朗随和，说话直接亲切
        timbre: 清朗自然
        pace: 轻快平稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 喋喋越来越莽撞
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 喋喋坐在树上，忽然发现一根树枝正好伸到小房子的屋顶上方，枝头最细的几根梢儿都碰着屋顶了。
        - id: ch01-b02
          speaker: narrator
          text: 他的眼睛一下亮了起来。
        - id: ch01-b03
          speaker: chatterer
          text: 地上没有路，说不定我能从上面进去。
        - id: ch01-b04
          speaker: narrator
          text: 喋喋暗自发笑，又赶紧四下张望，生怕有谁正看着自己。附近一个人影也没有，只有黑猫咪蹲在地上，仰头盯着他。可他高高待在树上，一点儿也不在乎她。他轻快地跑过伸在屋顶上方的树枝，纵身落到小房子的屋顶上，又沿着屋顶边缘飞快地绕了一圈，一路探头往下瞧，寻找大到能让自己钻进去的洞。
        - id: ch01-b05
          speaker: narrator
          text: 终于，他在一个角落的屋檐下找到了树节孔。喋喋用尖爪紧紧抠住木板，免得自己掉下去。他一步一步小心挪过去，平安到了洞边。洞口还差一点才够大，他的脑袋没法整个伸进去。于是他啃呀，啃呀，啃，细木屑四处飞。再啃呀，啃呀，啃，洞口终于够大了。
        - id: ch01-b06
          speaker: narrator
          text: 喋喋刚刚顺利钻进去，农夫布朗家的男孩就从屋里出来了。他看见黑猫咪坐在地上，正直勾勾地望着小房子的屋顶。
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: 嘿，猫咪！你是不是听见里头有老鼠了？不可能，这地方老鼠可进不去。走，跟我去谷仓，我给你来点儿新鲜的热牛奶。
        - id: ch01-b08
          speaker: chatterer
          text: 呼，好险！幸亏那只讨厌的黑猫没法告诉他，她刚才看见了什么！
          emotion: surprised
        - id: ch01-b09
          speaker: narrator
          text: 等男孩和黑猫咪走得看不见了，喋喋才回过身，好好打量自己进了什么地方。他的眼睛馋得直发亮。玉米，玉米，到处都是玉米！他觉得，这些玉米足够全世界所有的松鼠一起吃了。
        - id: ch01-b10
          speaker: chatterer
          text: 这下全归我啦！
        - id: ch01-b11
          speaker: narrator
          text: 喋喋早忘了自己是在偷东西。他立刻吃了起来，吃呀吃呀，直到再也咽不下一口。
        - id: ch01-b12
          speaker: chatterer
          text: 我就在这里睡一觉吧。
        - id: ch01-b13
          speaker: narrator
          text: 他蜷缩在最黑暗的角落里，不到两分钟就睡熟了。他梦见整个世界都变成了金灿灿的玉米，而且每一粒都归他所有。
