audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 急性直率，发怒时尖锐泼辣
        timbre: 明亮细脆
        pace: 快而有弹性
        pitch: 高音
  chapters:
    - id: ch01
      title: 宽大的红外套
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 喋喋因为怕极了黄鼠狼影子，逃出绿森林时，还是一副胖乎乎的模样。至少拿他自己来说，那已经算很胖啦。整个秋天，他都在采集过冬的坚果和种子。一路忙着贮藏，他也一路敞开肚皮吃，把那件红外套撑得鼓鼓的，穿在身上甚至有些紧。
        - id: ch01-b02
          speaker: narrator
          text: 如今可完全不同了。那件红外套松松垮垮地挂在喋喋身上，看着大了许多。没错，他瘦得连外套都不合身了，而且一天比一天更瘦。
    - id: ch02
      title: 难熬的日子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 能找到的食物，大多早就让大家收走，藏进了仓库。喋喋每天都要跑许多地方，拼命寻找，才勉强够自己吃。想再装满一座新仓库？那简直没有可能！可他还是不肯停手，一天添上一点，好歹攒下了些种子。
        - id: ch02-b02
          speaker: narrator
          text: 只是这些食物实在寒酸。老果园附近没有结坚果的树，也没有松树，自然找不到饱满的坚果和香喷喷的松子。那些好东西，只有他留在绿森林的仓库里才有。可是喋喋不敢回去。他怕黄鼠狼影子发现自己，再循着踪迹找上新家，只能耐下心来，在近处尽力搜寻。
        - id: ch02-b03
          speaker: narrator
          text: 从太阳升起忙到太阳落下，东边跑，西边跑，哪儿都跑遍了，喋喋常常累得快要倒下。更叫他灰心的是，大雪随时会来，把仅剩的一点食物也埋掉。唉，那些日子对红松鼠喋喋来说，可真难熬，实在太难熬了。
    - id: ch03
      title: 玉米地里的收获
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天早晨，喋喋天不亮就出发了。他顺着旧石墙和一道道木栅栏走了很远，终于到了农夫布朗的玉米地。地里的玉米早就收完了，不过收割时落下了不少玉米粒。有些让人踩进了土里，有些藏在落叶和杂草下面，还有一些躲在成堆的秸秆底下。
        - id: ch03-b02
          speaker: narrator
          text: 喋喋飞快地跑来跑去，不一会儿就找到了一颗又一颗饱满的金黄玉米粒。好些天以来，他心里第一次有了喜气。这里的玉米不少，吃饱以后还有得带回家。于是，他先痛痛快快吃了一顿，又把两边腮帮子塞满，爬上木栅栏，往老果园里的新家赶去。
    - id: ch04
      title: 空心横木仓库
      blocks:
        - id: ch04-b01
          speaker: chatterer
          text: 每一趟都要把粮食搬这么远，这可怎么搬得完呀？不过，我要是在这里坐上一整天，那就更搬不成了！
        - id: ch04-b02
          speaker: narrator
          text: 喋喋坐在一根栅栏柱顶上歇了歇，想完便跳到下面的横木上。走到半路，他看见木头上有一道裂缝。这根横木似乎有一截是空的！一个绝妙的主意蹦进了他的脑袋，兴奋的光立刻在眼里闪了起来。
        - id: ch04-b03
          speaker: narrator
          text: 他从横木这头跑到那头，又掉头跑回来，到处寻找入口，可一个也没有。喋喋只好慢慢往回挪，小心地把头伸出边缘，朝横木下面看。快到下一根栅栏柱时，他总算瞧见了自己盼望的东西。是什么呢？是一个树节孔，正好通进横木的空心里。
        - id: ch04-b04
          speaker: narrator
          text: 树节孔还太小，喋喋的身子挤不进去。不过这点麻烦才难不倒他。他倒出腮帮子里的玉米，亮出锋利的牙齿，马上啃了起来。只过了一小会儿，洞口就大得足够让他钻进去了。
        - id: ch04-b05
          speaker: narrator
          text: 喋喋钻进空心横木，里里外外察看了一番，双眼快活地闪着光。
        - id: ch04-b06
          speaker: chatterer
          text: 我就把这里当成仓库！先用玉米把它装满。冬天饿了，我跑来这里就能吃饱，总比把玉米一路搬回老果园轻松多啦！
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: 说干就干，喋喋立刻忙着往空心横木里装起玉米来。
