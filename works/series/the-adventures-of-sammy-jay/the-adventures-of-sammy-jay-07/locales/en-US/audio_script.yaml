audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Chatterer Works Hard
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When Chatterer left the Green Forest because he was terribly afraid of Shadow the Weasel, he was fat. At least, he was fat for Chatterer. All through the pleasant fall, he had gathered nuts and seeds for winter. He ate all he could hold, too, until his red coat felt almost too tight.
        - id: ch01-b02
          speaker: narrator
          text: Now that same coat hung so loosely that it looked too big for him. It really did look too big. Yes, sir, Chatterer had grown very thin, and each day he grew thinner.
        - id: ch01-b03
          speaker: narrator
          text: Most of the food nearby had been gathered and stored long ago. Chatterer had to run about and search very hard just to find enough for each day. Filling a new storehouse seemed impossible. Still, he kept trying. Day after day, he managed to add a few seeds to his supply, though they made poor meals at best.
        - id: ch01-b04
          speaker: narrator
          text: There were no plump nuts or tasty pine seeds like the ones in his Green Forest storehouses. No nut trees or pine trees grew near the Old Orchard, and Chatterer didn't dare go back. Shadow might find him there and follow him to his new home. So Chatterer patiently did his best to find food close by.
        - id: ch01-b05
          speaker: narrator
          text: It was terribly discouraging. He worked from sunrise to sunset, running here, there, and everywhere until he was ready to drop from weariness. All the while, he knew snow might come any day and bury the little food that remained. Those were hard days for Chatterer the Red Squirrel. Very hard days indeed.
        - id: ch01-b06
          speaker: narrator
          text: Early one morning, Chatterer set out on a long journey. He followed the old stone wall and the rail fences all the way to Farmer Brown's cornfield.
        - id: ch01-b07
          speaker: narrator
          text: Farmer Brown had taken away the corn long before. But as he worked, plenty of kernels had fallen to the ground. Some had been trampled halfway into the earth. Others lay hidden under leaves or among the weeds. Still more were tucked beneath piles of stalks after the ears of corn had been stripped away.
        - id: ch01-b08
          speaker: narrator
          text: For the first time in days, Chatterer felt almost cheerful. He hurried about, searching for those plump yellow kernels and finding them. First he ate all he could hold, because he could see there would still be plenty to carry home. Then he packed his cheeks full, scrambled onto the rail fence, and started back toward the Old Orchard.
        - id: ch01-b09
          speaker: narrator
          text: After a while, he sat up on top of a fence post to rest and thought about the long trip ahead.
        - id: ch01-b10
          speaker: chatterer
          text: What a terribly long way to carry all this food! How will I ever get it home? Well, I certainly won't get there by sitting here all day.
        - id: ch01-b11
          speaker: narrator
          text: Chatterer jumped down to the rail below. Halfway across it, he noticed a crack. The rail looked hollow inside, and a wonderful idea came to him. His eyes shone with excitement.
        - id: ch01-b12
          speaker: narrator
          text: He raced to one end of the rail and back, looking for a way in. There wasn't one. So he returned slowly and carefully, leaning over to search underneath. Near the next post, he found exactly what he wanted. It was a knothole, and it opened right into the hollow rail.
        - id: ch01-b13
          speaker: narrator
          text: The hole wasn't quite large enough for Chatterer to squeeze through, but that didn't bother him. He emptied the corn from his cheeks. Then he set to work with his sharp teeth. It took only a little while to make the knothole wide enough for him to slip inside.
        - id: ch01-b14
          speaker: narrator
          text: Chatterer explored the hollow rail, and his eyes snapped with pleasure.
        - id: ch01-b15
          speaker: chatterer
          text: This will be my storehouse! I'll fill it with corn. Then, whenever I'm hungry this winter, I can come down here and eat my fill. That will be much better than hauling all the corn back to the Old Orchard.
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: And with that, Chatterer began filling the hollow rail with corn.
