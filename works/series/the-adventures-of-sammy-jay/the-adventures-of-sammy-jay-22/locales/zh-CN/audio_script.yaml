audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 急性直率，发怒时尖锐泼辣
        timbre: 明亮细脆
        pace: 快而有弹性
        pitch: 高音
    sammy:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 爱管闲事又自信，开口爽快，带一点得意
        timbre: 清亮而响亮
        pace: 明快利落
        pitch: 中高音
  chapters:
    - id: ch01
      title: 喋喋又神气起来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 天刚亮，红松鼠喋喋从家门口探出头来，觉得自己又恢复了往日那副没大没小、厚脸皮的样子。昨天那一回，他认定自己赢了冠蓝鸦萨米。玉米当然还是要替萨米弄，可他不必再去农夫布朗家的玉米仓冒险。喋喋早就看明白了，萨米真正想看的不是那几粒玉米，而是他冒险时的热闹。如今，他觉得自己的脑筋胜过萨米，又像从前一样神气起来。
        - id: ch01-b02
          speaker: chatterer
          text: 叽喀啰，叽喀哩，谁的脑筋能跟我比？叽喀啰，叽喀哩，再也找不出这般伶俐！
        - id: ch01-b03
          speaker: narrator
          text: 这话当然是在吹牛，而吹牛正是世上最愚蠢的习惯之一。可喋喋一向爱说大话，往后多半也改不了。他在旧石墙里蹿进蹿出，把这首小调唱了一遍又一遍，只等萨米出现。
        - id: ch01-b04
          speaker: narrator
          text: 喋喋今天没到农夫布朗家的玉米仓吃早饭。他料定萨米会来叫他取玉米，自己终究得跑这一趟。不过，他准备去玉米地边那根空心栏木里的自家粮仓。到了那里，他还可以先吃个饱。肚子已经饿了，他跑来跑去，巴不得萨米快些到。
    - id: ch02
      title: 栅栏上的得意小调
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 萨米终于来了。事情正像喋喋猜的那样，萨米一见面便来讨玉米。喋喋答应过，只要萨米开口，什么时候都得替他弄来。
        - id: ch02-b02
          speaker: sammy
          text: 喋喋，你答应给我的玉米呢？现在就去替我拿来吧。
        - id: ch02-b03
          speaker: narrator
          text: 喋喋马上出发，顺着一道道栅栏跑向玉米地。他最喜欢沿栅栏飞奔。路虽然很远，他一点儿也不介意。清晨寒气逼人，跑起来却叫他浑身舒坦。
        - id: ch02-b04
          speaker: narrator
          text: 他边跑边暗自发笑。亏自己想起了那座粮仓，既能兑现对萨米的承诺，又不用亲身冒险，实在太聪明了。他沿着玉米地边的栅栏一路蹿去，离存玉米的空心栏木只差一点儿。喋喋忽然停在一根栅栏柱上，直起身子，又吹起牛来。他才唱到“叽喀啰，叽喀哩！谁的脑筋能跟我——”，歌声便突然断了。
    - id: ch03
      title: 粗腿从天而降
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 喋喋没能唱完。舌头好像一下粘住了，两只黑亮的小眼睛瞪得几乎要蹦出来。空心栏木旁边的柱子上，端坐着一个笔直的黑影。那双凶狠的眼睛里满是饥饿，正盯着喋喋。那是鹰粗腿！
        - id: ch03-b02
          speaker: narrator
          text: 喋喋吓得倒抽一口气，猛地转过身，沿着栅栏拼命往回逃。粗腿立刻张开宽大的翅膀，滑翔着追来。喋喋连两根栏木的距离都没跑完，粗腿就已经到了他的头顶。
        - id: ch03-b03
          speaker: narrator
          text: 粗腿突然张开那对巨大的利爪，直扑下去。就在最后一刹那，喋喋闪到了栏木下面，刚好躲开。粗腿失望地尖叫起来。那声音凶厉极了，吓得喋喋全身发抖。
        - id: ch03-b04
          speaker: narrator
          text: 喋喋后来怎么逃回老果园的，连自己也弄不清。这一路上，粗腿的巨爪一次次抓下来，他每回都只是勉强躲开。好在他到底逃回来了，只是累得气喘吁吁，心里也怕得厉害。
    - id: ch04
      title: 倒霉的一天
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 冠蓝鸦萨米还坐在那里，等着他的玉米。看到喋喋空手回来，萨米装出非常生气的样子，还拿一件事吓唬他。
        - id: ch04-b02
          speaker: sammy
          text: 玉米呢？你要是不给我，我这就去绿森林，把你住在哪里告诉黄鼠狼影子！
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: 喋喋没有别的办法。他只好稍微歇一会儿，等气喘匀了，再去农夫布朗家的玉米仓。
        - id: ch04-b04
          speaker: narrator
          text: 到了夜里，喋喋蜷在床上。想起这一天的遭遇，他忍不住自言自语。
        - id: ch04-b05
          speaker: chatterer
          text: 今天真是倒霉透了，简直倒霉透顶。我就是想不明白……老粗腿今天早晨怎么偏偏坐在那根栅栏柱上呢？
        - id: ch04-b06
          speaker: narrator
          text: 可是，萨米一点儿也不纳闷。他知道那是怎么回事。
