audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, excitable, and self-important
        timbre: bright and piercing
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Chatterer Has a Dreadful Day
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At daylight, Chatterer peeped out of his doorway feeling like his old saucy, impudent self again. He was sure he had gotten the better of Sammy Jay the day before. Yes, he still had to fetch corn whenever Sammy asked. But he did not have to take it from Farmer Brown's corn-crib. What Sammy really wanted was the fun of watching Chatterer risk going there. Chatterer believed he had been smarter than Sammy, and that thought made him feel fine.
        - id: ch01-b02
          speaker: chatterer
          text: Chickaro and chickaree! Who could ever be as smart as me? Chickaro and chickaree! Sharper wits you'll never see!
        - id: ch01-b03
          speaker: narrator
          text: That was boasting, and boasting is one of the most foolish habits in the world. But Chatterer had always been a boaster, and he probably always would be. He whisked in and out of the old stone wall, repeating his rhyme while he waited for Sammy to appear.
        - id: ch01-b04
          speaker: narrator
          text: Chatterer had skipped breakfast at the corn-crib that morning. He felt sure Sammy would come and order him to fetch corn, so he knew he would have to make the trip anyway. His plan was to visit his own storehouse inside a hollow rail at the edge of the cornfield. There he could eat all he wanted. He scampered about, hungry and wishing Sammy would hurry.
        - id: ch01-b05
          speaker: narrator
          text: At last Sammy arrived. Just as Chatterer expected, Sammy demanded the corn Chatterer had promised to bring whenever he asked for it. Chatterer set off at once, running toward the cornfield along the fences.
        - id: ch01-b06
          speaker: narrator
          text: Chatterer had always loved running on fences. The cornfield was a long way off, but he did not mind. The morning was sharp and cold, and the run made him feel wonderful. All the way there, he chuckled over his clever plan. His storehouse would let him keep his promise to Sammy without risking anything himself.
        - id: ch01-b07
          speaker: narrator
          text: Soon he was whisking along the fence beside the cornfield. The hollow rail full of corn was almost within reach. Chatterer stopped on a fence post to sit up and boast once more.
        - id: ch01-b08
          speaker: chatterer
          text: Chickaro and chickaree!
        - id: ch01-b09
          speaker: narrator
          text: He never reached the next line. His tongue seemed stuck to the roof of his mouth, and his little black eyes looked ready to pop from his head. On a post close to the hollow rail sat a straight black shape. It was watching him with cruel, hungry eyes. Roughleg the Hawk was waiting there.
        - id: ch01-b10
          speaker: narrator
          text: Chatterer gave a frightened little gasp. He spun around and raced back along the fence as fast as his legs could carry him. Roughleg spread his great wings at once and sailed after him.
        - id: ch01-b11
          speaker: narrator
          text: Chatterer had not passed even two fence rails before the hawk was right above him. Roughleg opened his great cruel claws and swooped. Chatterer slipped beneath the rail just in time, with no time at all to spare.
        - id: ch01-b12
          speaker: narrator
          text: Roughleg screamed in disappointment. The sound was so fierce that Chatterer shivered all over.
        - id: ch01-b13
          speaker: narrator
          text: Chatterer never quite knew how he made it back to the Old Orchard. Again and again, he escaped those great claws by the narrowest chance. But at last he reached home, breathless, worn out, and badly frightened.
        - id: ch01-b14
          speaker: narrator
          text: Sammy Jay was still there, waiting for his corn. When he saw that Chatterer had brought none, Sammy pretended to be very angry. He threatened to fly straight to the Green Forest and tell Shadow the Weasel where Chatterer lived.
        - id: ch01-b15
          speaker: narrator
          text: Chatterer had no choice. As soon as he had rested a little, he had to go over to Farmer Brown's corn-crib after all.
        - id: ch01-b16
          speaker: narrator
          text: That night, Chatterer curled up in bed and thought about everything that had happened.
        - id: ch01-b17
          speaker: chatterer
          text: What a dreadful day. It was a perfectly dreadful day. I wonder... I wonder why old Roughleg happened to be sitting on that fence post this morning.
        - id: ch01-b18
          speaker: narrator
          text: Sammy Jay did not wonder. Sammy knew.
