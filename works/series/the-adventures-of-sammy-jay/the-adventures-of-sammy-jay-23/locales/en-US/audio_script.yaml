audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, excitable, and self-important
        timbre: bright and piercing
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Chatterer Hits on a Plan at Last
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Whenever Chatterer decided he was smarter than Sammy Jay, he soon discovered that he wasn't nearly as clever as he thought. That left him feeling ashamed. He couldn't even admit to himself that Sammy was the smarter one.
        - id: ch01-b02
          speaker: narrator
          text: Still, every day Chatterer carried corn from Farmer Brown's corn-crib whenever Sammy ordered him to. Each trip brought the risk that Farmer Brown's boy might see him. Yet Chatterer kept going because he had found no way to outwit Sammy.
        - id: ch01-b03
          speaker: narrator
          text: After his narrow escape from old Roughleg the Hawk, Chatterer tried once more to visit his storehouse beside the cornfield. Roughleg was there watching, so Chatterer turned back. When he returned, Sammy greeted him with a grin. That grin convinced Chatterer that Sammy knew something about how Roughleg had discovered the storehouse and come to watch it.
        - id: ch01-b04
          speaker: narrator
          text: All this time, Sammy was enjoying Chatterer's trouble. Again and again, Chatterer came up with a plan to fool him. Every time, Sammy had already imagined that plan and found a way to make it useless.
        - id: ch01-b05
          speaker: narrator
          text: You see, when Sammy was alone in the Green Forest, he often pretended that he was caught in Chatterer's place. Then he tried to think of a way out. That was why Chatterer could never devise a plan Sammy hadn't considered first.
        - id: ch01-b06
          speaker: narrator
          text: There was one simple way Chatterer could spoil Sammy's fun, though it would not save his corn. And the fun mattered most to Sammy. What he really liked was watching Chatterer worry. Sammy had seen the answer almost at once, and he thought Chatterer was very, very foolish for missing it.
        - id: ch01-b07
          speaker: sammy_jay
          text: He'll figure it out someday. And when he does, I can't see any way to spoil such a simple plan.
        - id: ch01-b08
          speaker: narrator
          text: Then Sammy began thinking up a new way to torment Chatterer.
        - id: ch01-b09
          speaker: narrator
          text: At last, Chatterer saw the answer. It was so simple that perhaps its very simplicity had kept him from seeing it sooner.
        - id: ch01-b10
          speaker: narrator
          text: He would visit Farmer Brown's corn-crib at daybreak, before anyone in the farmhouse woke up. But instead of making one trip, he would make two or three. He could hide plenty of corn in a safe place in the old stone wall. Then, whenever Sammy demanded his corn, Chatterer could fetch it without danger or trouble.
        - id: ch01-b11
          speaker: narrator
          text: Chatterer tried the plan, and it worked beautifully. Sammy still got his corn, but he got no pleasure from watching Chatterer struggle. Since that pleasure meant more to him than the corn, Sammy stopped coming to the Old Orchard after two or three mornings.
        - id: ch01-b12
          speaker: narrator
          text: Chatterer chuckled as he built up his supply. To be safe, he hid the corn in several different places instead of keeping it all together.
        - id: ch01-b13
          speaker: narrator
          text: Sammy might have seemed tired of corn, but he was busy thinking. He had no intention of leaving Chatterer in peace. Somehow, he had to ruin that simple plan.
        - id: ch01-b14
          speaker: narrator
          text: In the end, Reddy Fox gave Sammy the idea. Sammy saw Reddy trotting along the Lone Little Path through the Green Forest, and the answer came to him at once. He would tell Reddy where Chatterer was storing corn in the old stone wall. Then Reddy could hide nearby.
        - id: ch01-b15
          speaker: sammy_jay
          text: Of course, I don't want Reddy to catch Chatterer. I can warn Chatterer just in time. But he'll get such a fright that he won't dare come back here for corn anytime soon. Then he'll have to fetch it from the corn-crib again.
        - id: ch01-b16
          speaker: narrator
          text: With that, Sammy hurried away to tell Reddy Fox about the hiding place halfway along the old stone wall where Chatterer had stored his corn.
