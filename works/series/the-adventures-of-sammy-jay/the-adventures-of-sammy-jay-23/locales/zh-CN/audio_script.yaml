audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 急性直率，发怒时尖锐泼辣
        timbre: 明亮细脆
        pace: 快而有弹性
        pitch: 高音
    sammy:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 爱管闲事又自信，开口爽快，带一点得意
        timbre: 清亮而响亮
        pace: 明快利落
        pitch: 中高音
  chapters:
    - id: ch01
      title: 总也胜不过萨米
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 喋喋一次次以为自己比冠蓝鸦萨米聪明，结果呢？每回他都会发现，自己根本没有想象中那么机灵。这让他又羞又恼，可他连在心里都不肯承认，萨米的脑筋比自己强。
        - id: ch01-b02
          speaker: narrator
          text: 眼下，只要萨米开口，喋喋每天就得去农夫布朗家的玉米仓取玉米，还得冒着被农夫布朗家的男孩撞见的危险。只怪他怎么也想不出胜过萨米的办法。
        - id: ch01-b03
          speaker: narrator
          text: 自从上回险些被老粗腿捉住，喋喋又试着去过玉米地边的粮仓。可老粗腿还守在那里，他只好掉头。等他回到萨米跟前，萨米脸上挂着得意的坏笑。喋喋一看就认定，老粗腿怎么会发现那座粮仓，又怎么会守在那里，萨米准知道内情。
    - id: ch02
      title: 萨米早已想到
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这些日子，喋喋的麻烦可让萨米看足了热闹。喋喋想出一个主意，萨米早就想到了，而且总有办法叫它派不上用场。到头来，喋喋的每个主意都落了空。
        - id: ch02-b02
          speaker: narrator
          text: 原来，萨米独自在绿森林里时，常把自己想成喋喋，再琢磨该怎样摆脱困境。喋喋能想到的路，他自然都先想过了。
        - id: ch02-b03
          speaker: narrator
          text: 不过，真有一个办法能让萨米没热闹可看，只是玉米还得照样给他。偏偏萨米最喜欢的，就是看喋喋发愁。这个办法，他差不多一开始便想到了。他觉得喋喋迟迟想不出来，实在笨得很。
        - id: ch02-b04
          speaker: sammy
          text: 他早晚会想明白的。这么简单的办法，我还真不知道该怎么破坏。
        - id: ch02-b05
          speaker: narrator
          text: 说完，萨米又琢磨起别的花样，准备继续折腾喋喋。
    - id: ch03
      title: 简单的办法
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 喋喋总算想到了。办法简单得不得了，也许正因为太简单，他以前才没想到。
        - id: ch03-b02
          speaker: narrator
          text: 他还是趁天刚亮、农夫布朗一家没有醒来时去玉米仓，不过一早多跑两三趟，把许多玉米预先藏进旧石墙里的安全地方。往后萨米再来讨，他不用冒险，也不用费什么力气，就能把玉米拿出来。
        - id: ch03-b03
          speaker: narrator
          text: 喋喋一试，果然好用。萨米吃得到玉米，却看不到喋喋遇上麻烦。可对萨米来说，那份热闹比玉米更要紧。两三个早晨以后，他干脆不来老果园了。喋喋一边偷笑，一边接着存粮，还把玉米分藏在好几个地方。
    - id: ch04
      title: 狐狸带来的灵感
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 看起来，萨米似乎吃腻了玉米，其实他一直在动脑筋。他可没打算放过喋喋，非得想办法破坏这个简单的计划。
        - id: ch04-b02
          speaker: narrator
          text: 最后，狐狸雷迪给了他灵感。萨米看见雷迪沿着绿森林里那条孤零零的小径小跑而来，立刻有了主意。他要告诉雷迪，喋喋把玉米藏在旧石墙哪里，再叫雷迪躲到近旁。
        - id: ch04-b03
          speaker: sammy
          text: 我可不想让雷迪真的捉住喋喋。只要赶在最后一刻提醒他，就不会出事。不过，这一下准能把他吓坏，叫他好一阵子都不敢再来取玉米。到时候，他只好重新去玉米仓了。
        - id: ch04-b04
          speaker: narrator
          text: 萨米打定主意，赶紧去找狐狸雷迪，把喋喋藏玉米的位置告诉了他。那个地方，就在旧石墙的中段。
