audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Chatterer Frightens Sammy Jay
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Chatterer the Red Squirrel was very pleased with himself. He had found a way into Farmer Brown's corn-crib, where heaps of beautiful yellow corn were stored. To Chatterer, there seemed to be enough corn for every squirrel in the world.
        - id: ch01-b02
          speaker: narrator
          text: The more some people have, the more they want. That is selfishness of the worst kind, and we call it greed. Chatterer could now take all the corn he wanted without working for it. There was enough to feed him for the rest of his life, even if he lived to be a hundred years old.
        - id: ch01-b03
          speaker: narrator
          text: Of course, the corn wasn't his. It belonged to Farmer Brown. But Chatterer thought of Farmer Brown and Farmer Brown's boy as enemies, so he saw nothing wrong with taking things from them. Or perhaps he simply didn't want to see anything wrong.
        - id: ch01-b04
          speaker: narrator
          text: Chatterer had stolen from his neighbors all his life. That was one reason they disliked him so much. Maybe a little voice inside sometimes tried to tell him he was doing wrong. If it did, Chatterer refused to listen. After a while, perhaps that little voice grew tired and stopped trying.
        - id: ch01-b05
          speaker: narrator
          text: After a few successful trips to the corn-crib, Chatterer began to think of it as his own. Sometimes he hid in the old stone wall and watched Farmer Brown's boy open the corn-crib door. The boy would fill a basket with yellow ears of corn for the hens, the pigs, and the horses.
        - id: ch01-b06
          speaker: narrator
          text: Whenever Chatterer saw that, he flew into a terrible rage. He acted as though Farmer Brown's boy were stealing Chatterer's corn. There was nothing Chatterer could do, so he would return to the Old Orchard and scold for a whole hour.
        - id: ch01-b07
          speaker: narrator
          text: But something else made him even angrier. Now and then, Sammy Jay helped himself to a few kernels through the cracks in the corn-crib walls. Chatterer forgot that Sammy had first told him about the corn-crib. He also forgot that Sammy had warned him about Shadow the Weasel.
        - id: ch01-b08
          speaker: narrator
          text: That is the trouble with greed. It makes you forget everything except how much you want something and how badly you want to keep anyone else from having it.
        - id: ch01-b09
          speaker: narrator
          text: Chatterer said nothing to Sammy. He knew it wouldn't do any good. Besides, Sammy might meet him inside the corn-crib one day and make such a commotion that Farmer Brown's boy would discover him.
        - id: ch01-b10
          speaker: narrator
          text: At last, Chatterer thought of a plan and gave a wicked chuckle. Early the next morning, he went straight to the corn-crib. This time, he stayed there and waited for Sammy Jay.
        - id: ch01-b11
          speaker: narrator
          text: Chatterer peeked through the hole he used to come and go. Soon he saw Sammy flying over from the Old Orchard. Sammy came without a sound, because he meant to steal some corn, too.
        - id: ch01-b12
          speaker: narrator
          text: Before long, Sammy found a crack with an ear of corn lying close behind it. He began pecking through the crack and pulling out kernels. Inside the corn-crib, Chatterer crept toward him without making a sound.
        - id: ch01-b13
          speaker: narrator
          text: Then Sammy's black bill poked through the crack. Chatterer grabbed it and held on tight.
        - id: ch01-b14
          speaker: narrator
          text: Poor Sammy Jay was terribly frightened. He thought some kind of trap had caught him. He beat his wings and tried to scream, but he couldn't open his mouth.
        - id: ch01-b15
          speaker: narrator
          text: Suddenly, Chatterer let go. Sammy nearly fell to the ground before he caught his balance. He didn't wait to find out what had grabbed him. He flew toward the Green Forest as fast as his wings could carry him, screaming with fear and anger all the way.
        - id: ch01-b16
          speaker: narrator
          text: Back in the corn-crib, Chatterer chuckled. It was a very wicked-sounding chuckle.
        - id: ch01-b17
          speaker: chatterer
          text: Well, I think Sammy Jay will keep away from my corn now.
