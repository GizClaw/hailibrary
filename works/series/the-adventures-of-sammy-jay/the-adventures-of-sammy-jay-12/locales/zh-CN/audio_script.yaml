audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 急性直率，发怒时尖锐泼辣
        timbre: 明亮细脆
        pace: 快而有弹性
        pitch: 高音
    sammy:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 爱管闲事又自信，开口爽快，带一点得意
        timbre: 清亮而响亮
        pace: 明快利落
        pitch: 中高音
  chapters:
    - id: ch01
      title: 越有越贪心
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 红松鼠喋喋发现了钻进农夫布朗家玉米仓的办法，得意极了。仓里堆着那么多漂亮的金黄玉米，他觉得，就算让全世界所有的松鼠来吃，也一定够吃。
        - id: ch01-b02
          speaker: narrator
          text: 有些人手里的东西越多，想要的反而越多。这是最糟糕的一种自私，也就是贪心。喋喋现在不用干一点儿活，想吃多少玉米就能吃多少。哪怕活到一百岁，这些玉米也足够他吃上一辈子。
        - id: ch01-b03
          speaker: narrator
          text: 当然，这些玉米并不是他的，而是农夫布朗的。可喋喋把农夫布朗和农夫布朗家的男孩当成敌人。他认定，拿走敌人的东西不算错。说不定，他根本就不想承认这有什么错。
        - id: ch01-b04
          speaker: narrator
          text: 这些年来，喋喋没少偷邻居们的东西，难怪大家不喜欢他。就算心底偶尔响起一个细小的声音，提醒他这样做不对，他也从来不听。也许说着说着，那个声音累了，后来便再也不肯开口了。
    - id: ch02
      title: 我的玉米
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 喋喋顺顺利利地进了几次玉米仓，渐渐就把那里当成了自己的地方。有时候，他躲在旧石墙里，看见农夫布朗家的男孩打开仓门，把一篮金黄的玉米棒拿去喂母鸡、猪和马，竟会气得大发脾气，就像男孩偷了他的玉米一样。
        - id: ch02-b02
          speaker: narrator
          text: 他拿男孩毫无办法，只能回到老果园，足足叫骂一个钟头。可还有一件事，更能把他惹火。冠蓝鸦萨米会把嘴伸进玉米仓墙板的缝隙，啄出几粒玉米，自管自地吃掉。
        - id: ch02-b03
          speaker: narrator
          text: 喋喋早就忘了，最先告诉他玉米仓秘密的正是萨米，提醒他小心黄鼠狼影子的也是萨米。贪心就是这样。它只记得自己还想得到什么，也只顾着不让别人得到，却把其余的事全都忘了。
        - id: ch02-b04
          speaker: narrator
          text: 不过，喋喋没有去找萨米理论。他知道，就算说了，萨米也不会理会。再说，萨米哪天要是在玉米仓里撞见他，没准儿会大吵大叫。那样一来，农夫布朗家的男孩就会发现喋喋了。
    - id: ch03
      title: 缝隙里的圈套
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 后来，喋喋终于想到了一个办法，不由得阴险地暗笑起来。第二天一早，天才刚亮，他就钻进玉米仓。这一回，他没有吃完就走，而是留在那里，等着萨米过来。
        - id: ch03-b02
          speaker: narrator
          text: 喋喋从自己进出的洞口悄悄往外看，只见萨米从老果园飞来了。萨米连一点儿声音也没发出。你瞧，他也是来偷东西的，当然不愿意让人听见。
        - id: ch03-b03
          speaker: narrator
          text: 过了一会儿，萨米找到一道缝，正好有根玉米棒紧贴在那儿。他开始往里啄，把玉米一粒一粒地挑出来。喋喋也朝那边悄悄摸过去，每一步都小心得很，半点声音也不敢弄出来。
        - id: ch03-b04
          speaker: narrator
          text: 没多久，萨米那张黑嘴从墙缝里伸了进来。喋喋猛地扑过去，一把抓住他的嘴，死死不放。
    - id: ch04
      title: 萨米吓坏了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 可怜的冠蓝鸦萨米一下子吓坏了。他以为自己中了什么圈套，拼命拍打翅膀，还想扯开嗓子尖叫。可是嘴被牢牢抓着，根本张不开，他怎么也叫不出声。
        - id: ch04-b02
          speaker: narrator
          text: 喋喋忽然松开了手。萨米一点儿防备也没有，险些一头栽到地上，好不容易才稳住身子。他甚至没等着看清，到底是什么东西抓住了自己，便掉头直奔绿森林，翅膀扇得有多快，就飞得有多快。
        - id: ch04-b03
          speaker: narrator
          text: 萨米一路飞，一路又惊又怒地尖叫。躲在玉米仓里的喋喋低声笑了起来。那阵笑声听上去，可真是阴险极了。
        - id: ch04-b04
          speaker: chatterer
          text: 这下好了。我看，萨米以后再也不敢碰我的玉米啦。
