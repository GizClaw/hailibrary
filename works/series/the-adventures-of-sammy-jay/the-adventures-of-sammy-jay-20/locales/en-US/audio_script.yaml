audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, excitable, and self-important
        timbre: bright and piercing
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Chatterer Remembers Something
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Chatterer was disgusted with himself, his neighbors, and the whole world. Something had upset him badly. He found nothing cheerful in the sunshine and nothing pleasant in the blue, blue sky. When sunshine and a blue sky cannot cheer someone, the trouble lies in his own heart. And there was a great deal wrong in Chatterer's heart that day.
        - id: ch01-b02
          speaker: narrator
          text: For one thing, his heart was full of anger, and anger can drain the joy out of everything. He was embarrassed, too. Sammy Jay had proved quicker-witted than he was, and that made Chatterer both angry and ashamed.
        - id: ch01-b03
          speaker: narrator
          text: As soon as he could slip away unseen, Chatterer hid in his new home. It was inside Drummer the Woodpecker's old house, in an apple tree in the Old Orchard. There he sulked for the rest of the day. Sammy had made him fetch corn from Farmer Brown's corn-crib in broad daylight, and Farmer Brown's boy had almost seen him.
        - id: ch01-b04
          speaker: chatterer
          text: If only I hadn't promised to bring him corn whenever he asks! If only I hadn't! But I couldn't help it. I had to promise. Now, whenever he feels like it, he can send me there again. Next time I may not be lucky enough to escape without being seen. Oh, dear! I've gotten myself into a dreadful mess. I simply have to find a way out.
          emotion: disgusted
        - id: ch01-b05
          speaker: narrator
          text: Chatterer thought about it all through the rest of the day. The longer he thought, the more miserable he became. Then, just as he was about to go outside for a little air before bed, a wonderful idea came to him.
        - id: ch01-b06
          speaker: chatterer
          text: Stupid, stupid, stupid! Why didn't I think of it sooner? You won't see me at that corn-crib again, Mr. Jay. I'll bring your corn because I must, but you won't get to laugh while I dodge Black Pussy and Farmer Brown's boy. You are smart, Mr. Jay, but you'll have to get up early to fool Chatterer twice!
        - id: ch01-b07
          speaker: narrator
          text: The idea made Chatterer feel much better at once. All the gloom that had weighed on his mind was gone. He took a brisk run along the old stone wall, then turned in for the night and slept soundly.
        - id: ch01-b08
          speaker: narrator
          text: Sammy Jay arrived in the middle of the next morning and demanded more corn. Chatterer acted as if he were too afraid to fetch it. But when Sammy insisted, Chatterer suddenly dashed away. Can you guess where he went? He ran to his own storehouse in a hollow rail at the edge of the cornfield.
        - id: ch01-b09
          speaker: narrator
          text: The hollow rail was a long way off, but going there was safer than letting Farmer Brown's boy see him. After quite a while, Chatterer returned with both cheeks packed with corn.
        - id: ch01-b10
          speaker: narrator
          text: Sammy pretended to be cross because Chatterer had kept him waiting so long. He grumbled the whole time he ate. He even acted as if this corn was not nearly as good as the corn from Farmer Brown's crib. Then he mumbled that he might tell Shadow the Weasel unless Chatterer brought him corn from the crib the very next day.
        - id: ch01-b11
          speaker: chatterer
          text: You can't tell him! You promised to keep quiet if I kept my promise and brought you corn whenever you asked. I never promised where I'd get it!
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: Chatterer chuckled to himself. It delighted him to think that this time, he had outsmarted Sammy Jay.
        - id: ch01-b13
          speaker: narrator
          text: Sammy ate every grain and flew away. As he left, Chatterer thought he heard something that sounded very much like a chuckle.
        - id: ch01-b14
          speaker: narrator
          text: That sound left Chatterer thoughtful and a little uneasy. Still, no matter how he considered it, he could not imagine any way Sammy might get the better of him now. Before long, he forgot about the chuckle. For the rest of the day, he kept thinking how lucky he was to have remembered the storehouse in the hollow rail.
