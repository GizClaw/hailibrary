audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    sammy:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 爱管闲事又自信，开口爽快，带一点得意
        timbre: 清亮而响亮
        pace: 明快利落
        pitch: 中高音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 机敏急躁，伶牙俐齿，情绪来得又快又直
        timbre: 轻快而尖亮
        pace: 快速灵活
        pitch: 高音
  chapters:
    - id: ch01
      title: 喋喋生自己的气
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 喋喋厌恶自己，也厌恶所有邻居，甚至厌恶整个世界。说到底，他正为一件事气恼得不得了。阳光那么明亮，他却看不出一点儿快活。天空蓝得那么好看，他也感觉不到半点美好。一个人要是变成这样，准是自己的心出了毛病。喋喋的心里，毛病还真不少。
        - id: ch01-b02
          speaker: narrator
          text: 首先，他满肚子都是火。怒气一上来，什么快乐和美好都会不见。喋喋还觉得很丢脸，因为萨米已经证明，他的脑筋比喋喋更灵。等到没人看见，喋喋便悄悄溜进新家。那是老果园一棵苹果树上的旧屋，原先住着啄木鸟鼓手。他躲在屋里，赌了整整一天的气。
        - id: ch01-b03
          speaker: narrator
          text: 萨米逼他大白天跑到农夫布朗家的玉米仓拿玉米，他差一点儿就被农夫布朗家的男孩发现了。
        - id: ch01-b04
          speaker: chatterer
          text: 我要是没答应他，只要他开口，我就得替他拿玉米，那该多好！我要是没答应就好了！可我当时实在没办法，非答应不可。往后他哪天高兴，就能像今天这样使唤我。我可未必每次都这么走运。唉，真糟糕！我把自己害惨了，非得想个脱身的法子不可。
          emotion: sad
    - id: ch02
      title: 一个绝妙的主意
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那天剩下的时间里，喋喋想了又想，可越想越不快活。直到晚上，他要在睡觉前出去透透气，一个绝妙的主意才忽然钻进脑海。
        - id: ch02-b02
          speaker: chatterer
          text: 笨，笨，笨！我怎么早没想起来？冠蓝鸦先生，你休想再看见我跑到那座玉米仓去！我非给你拿玉米不可，那我就拿给你。可你别想再看着我躲黑猫、躲农夫布朗家的男孩，还拿这件事取乐。你是聪明，冠蓝鸦先生！可想用同一个花招捉弄喋喋两回，你得一大早就起床才行。
        - id: ch02-b03
          speaker: narrator
          text: 想到这里，喋喋心里一下子痛快多了。他沿着老石墙轻快地跑了一趟，这才回家，舒舒服服地睡了一夜。
    - id: ch03
      title: 萨米又来要玉米
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天上午过了一半，萨米来了，开口又要玉米。喋喋装作不敢去拿。萨米却一再坚持，说他非去不可。于是，喋喋突然出发了。你猜他去了哪里？他去了玉米地边那根空心栏木，那里藏着他自己的粮仓。
        - id: ch03-b02
          speaker: narrator
          text: 那地方很远，可多跑些路，总比冒险让农夫布朗家的男孩看见要好。过了好一阵，喋喋才回来，两边腮帮子塞满了玉米。萨米装出生气的样子，怪他让自己等了这么久。吃玉米的时候，萨米一直嘟嘟囔囔，又装作嫌这些玉米不如农夫布朗家玉米仓里的好。
        - id: ch03-b03
          speaker: narrator
          text: 萨米还含含糊糊地说，要是喋喋明天不给他从那座玉米仓里拿玉米，他就去告诉黄鼠狼影子。
        - id: ch03-b04
          speaker: chatterer
          text: 你不能！你答应过，只要我守信用，每逢你开口就给你拿玉米，你便不会去告诉影子。可我从没说过，要到哪里去拿！
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: 喋喋觉得自己这回比萨米聪明，忍不住得意地咯咯笑起来。
    - id: ch04
      title: 那一声轻笑
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 萨米把玉米一粒不剩地吃完，随后便飞走了。可就在他离开的时候，喋喋好像听见一声轻笑。
        - id: ch04-b02
          speaker: narrator
          text: 喋喋不由得琢磨起来，心里也有点儿不安。可是，他怎么都想不出，萨米如今还能用什么办法占他的上风。没过多久，他便把这事忘了。
        - id: ch04-b03
          speaker: narrator
          text: 那天剩下的时间里，喋喋一直在想，幸亏自己还记得空心栏木里的那座粮仓。他觉得自己的运气真是太好了。
