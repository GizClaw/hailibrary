audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: clever, smug, and quick to make mischief
        timbre: bright and sharp
        pace: lively
        pitch: medium-high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: playful, quick-witted, and sometimes breathlessly nervous
        timbre: light and youthful
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Sammy Jay Gets Even with Peter Rabbit
      blocks:
        - id: ch01-b01
          speaker: sammy_jay
          text: I'll get even with you, Peter Rabbit! Just you wait. I'll get even with you!
          emotion: angry
        - id: ch01-b02
          speaker: narrator
          text: Sammy Jay was so angry that he nearly bounced up and down on the branch of the big pine. Peter only pushed his tongue into one cheek in the sauciest way and laughed at him.
        - id: ch01-b03
          speaker: narrator
          text: Of course, everyone in the Green Forest and on the Green Meadows knows that Sammy Jay is a thief. But no one likes being called a thief, even when it is true, and Sammy likes it least of all. Like many people who do wrong, he pretends to be a very fine gentleman and wants everyone else to believe it. He takes great care of his handsome blue coat and struts around whenever he thinks others are watching.
        - id: ch01-b04
          speaker: narrator
          text: Sammy thought and thought about how to get even with Peter Rabbit. Whenever he saw Peter, he called him names. Peter didn't care a bit. He could call names right back. Besides, names never hurt anyone, and calling them is a very foolish thing to do.
        - id: ch01-b05
          speaker: narrator
          text: So Sammy kept thinking of some other way to pay Peter back. One day, while he sat studying the matter in the big pine tree, he heard a voice that gave him an idea. It belonged to Redtail the Hawk, cousin to old Whitetail and Roughleg.
        - id: ch01-b06
          speaker: narrator
          text: Sammy can copy Redtail's scream so perfectly that no one can tell their voices apart. The moment he heard it, Sammy chuckled aloud. Now he had a plan for getting even with Peter Rabbit.
        - id: ch01-b07
          speaker: narrator
          text: Every day after that, Sammy silently peeked and pried through the Green Forest and along the edge of the Green Meadows, watching for Peter. The snow was almost gone. That was why Redtail had returned from the South, where he had spent the winter. Sammy felt quite sure Peter didn't know Redtail was back. At least, he hoped Peter didn't know.
        - id: ch01-b08
          speaker: narrator
          text: Early one morning, Sammy hid at the edge of the Green Forest and watched the Old Briar-patch, where Peter lived. Peter came out along one of his own little paths and sat up very straight. For a long while, he looked one way and then the other across the Green Meadows.
        - id: ch01-b09
          speaker: narrator
          text: Peter made sure that Reddy and Granny Fox were nowhere nearby and that Roughleg was nowhere in sight. Then he kicked up his heels and scampered away from the dear Old Briar-patch. He was off to look for signs of spring on the Green Meadows.
        - id: ch01-b10
          speaker: narrator
          text: Sammy waited until Peter reached the big hickory tree beside the Smiling Pool. Then he flew over without a sound. Peter was so busy looking for Jerry Muskrat that he never saw Sammy.
        - id: ch01-b11
          speaker: narrator
          text: Suddenly, a fierce, shrill scream rang out right above Peter's head. Peter knew that voice. Or at least, he thought he did. He didn't stop to look. Long ago, he had learned that it was best to run first and look afterward.
        - id: ch01-b12
          speaker: narrator
          text: Peter raced toward the dear Old Briar-patch as fast as his long legs could carry him, with his heart in his mouth. Again, that fierce scream sounded right over him. Peter ran faster still, dodging one way and then the other. Every second, he expected to feel Redtail the Hawk's sharp claws.
        - id: ch01-b13
          speaker: narrator
          text: My, what jumps Peter made! It seemed as if he would never reach the dear Old Briar-patch. But at last he did. The moment he was safely inside, he turned to see what had become of Redtail.
        - id: ch01-b14
          speaker: narrator
          text: And what do you think he saw? Only Sammy Jay, laughing as hard as he could.
        - id: ch01-b15
          speaker: sammy_jay
          text: Scaredy-rabbit! Scaredy-rabbit!
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: Peter shook his fist at Sammy. Then he gave a foolish grin.
        - id: ch01-b17
          speaker: peter_rabbit
          text: Well, Sammy Jay, I guess we're even now.
