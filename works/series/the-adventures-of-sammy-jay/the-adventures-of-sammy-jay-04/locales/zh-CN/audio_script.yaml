audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵自得，盘算时透着狡猾
        timbre: 清脆明亮
        pace: 轻快灵活
        pitch: 中高音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼机敏，打趣时俏皮又直率
        timbre: 清亮柔和
        pace: 轻快自然
        pitch: 中高音
  chapters:
    - id: ch01
      title: 萨米想出了办法
      blocks:
        - id: ch01-b01
          speaker: sammy_jay
          text: 彼得兔，我非报复你不可！你等着，我一定要报复你！
          emotion: angry
        - id: ch01-b02
          speaker: narrator
          text: 松鸦萨米气得在大松树的枝头直蹦。彼得呢？他把舌头顶在一边脸颊上，做了个顽皮透顶的鬼脸，又冲着萨米笑起来。
        - id: ch01-b03
          speaker: narrator
          text: 绿森林和绿草地里的每个居民都知道，萨米确实是个贼。可一个人哪怕真是贼，也不爱听别人当面说破。松鸦萨米尤其听不得。
        - id: ch01-b04
          speaker: narrator
          text: 萨米和许多做过坏事的人一样，总要装成了不起的绅士，还盼着大家真把他当成绅士。所以，他把漂亮的蓝外套照料得格外仔细。只要觉得有人在看，他就昂起头、挺起胸，在大家面前走来走去。
        - id: ch01-b05
          speaker: narrator
          text: 从那以后，萨米想了又想，一心琢磨该怎么报复彼得兔。每次碰见彼得，他都要骂上几句。彼得根本不在乎，因为他也会立刻骂回去。况且，骂人的话伤不了谁，张口骂人实在愚蠢。
        - id: ch01-b06
          speaker: narrator
          text: 萨米只好另想办法。一天，他坐在大松树上苦苦盘算，忽然听见一声尖叫。这个声音一下子给了他主意。
        - id: ch01-b07
          speaker: narrator
          text: 原来，那是红尾鵟在叫。红尾是老白尾和粗腿的嫡亲表兄弟。偏巧，萨米最会学红尾的叫声。他学得太像了，谁听见也分不出真假。
        - id: ch01-b08
          speaker: narrator
          text: 听着那声尖叫，萨米忍不住咯咯笑出了声。他终于知道该怎样报复彼得兔了。
    - id: ch02
      title: 绿草地上的尖叫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 接下来的每一天，松鸦萨米都悄悄穿过绿森林，又沿着绿草地边缘四处窥探。他一点声音也不出，只等彼得兔现身。
        - id: ch02-b02
          speaker: narrator
          text: 那时，积雪差不多全化了。在南方过冬的红尾鵟也因此飞了回来。萨米很有把握，彼得还不知道红尾已经回来了。至少，他巴不得彼得不知道。
        - id: ch02-b03
          speaker: narrator
          text: 一天清早，萨米藏在绿森林边缘，盯着彼得居住的老荆棘丛。没过多久，他看见彼得从一条隐秘的小路里出来，直起身子，坐得高高的。
        - id: ch02-b04
          speaker: narrator
          text: 彼得朝绿草地的这边看看，又朝那边瞧瞧，看了好一阵。他确定赤狐雷迪和狐狸奶奶都不在附近，天上也没有粗腿的影子，这才欢快地踢起后腿，飞奔到绿草地上。他离开亲爱的老荆棘丛，是想找找春天来了没有。
        - id: ch02-b05
          speaker: narrator
          text: 萨米耐心等着。彼得到了微笑池旁的大山核桃树下，他才无声无息地飞到那棵树上。彼得正忙着找麝鼠杰里，丝毫没有发现萨米。
        - id: ch02-b06
          speaker: narrator
          text: 突然，彼得头顶响起一声又凶又尖的鸣叫。这个声音，彼得认得。至少，他以为自己认得。
        - id: ch02-b07
          speaker: narrator
          text: 他根本不敢停下来查看。彼得早就明白，遇上危险，最好先逃命，回头再看。于是，他迈开两条长腿，拼命奔向亲爱的老荆棘丛。一颗心都快蹦到嗓子眼儿了。
    - id: ch03
      title: 这下扯平了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 那声凶狠的尖叫又从彼得头顶传来。他跑得更快了，一会儿往这边闪，一会儿朝那边躲。每一刻，他都觉得红尾鵟的利爪马上就要抓住自己。
        - id: ch03-b02
          speaker: narrator
          text: 哎呀，彼得跳得可真高！他只觉得亲爱的老荆棘丛远得不得了，怎么跑也跑不到。可他到底还是赶到了。
        - id: ch03-b03
          speaker: narrator
          text: 一钻进安全的荆棘丛，彼得立刻转过身，想看看红尾究竟去了哪里。你猜，他看见了什么？根本没有红尾。眼前只有松鸦萨米，正笑得死去活来。
        - id: ch03-b04
          speaker: sammy_jay
          text: 胆小鬼！你这个胆小鬼！
        - id: ch03-b05
          speaker: narrator
          text: 彼得冲萨米挥了挥拳头，接着却不好意思地咧开嘴笑了。
        - id: ch03-b06
          speaker: peter_rabbit
          text: 好吧，松鸦萨米，这下咱们算是扯平了！
