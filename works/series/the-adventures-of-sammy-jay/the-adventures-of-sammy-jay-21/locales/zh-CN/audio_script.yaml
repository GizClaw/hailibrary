audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    sammy:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 爱管闲事又自信，开口爽快，带一点得意
        timbre: 清亮而响亮
        pace: 明快利落
        pitch: 中高音
    blacky:
      display_name: 乌鸦黑黑
      tts:
        delivery: 爽快大胆，语气粗犷，玩笑中透着自信
        timbre: 粗哑而浑厚
        pace: 稳健利落
        pitch: 中低音
  chapters:
    - id: ch01
      title: 萨米正在出气
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 萨米拿喋喋取乐，已经好久没有这么开心了。说真的，连他自己都记不起，上一次玩得这样痛快是什么时候。他和喋喋从来不算好朋友。只要找到机会，他们总要用狡猾的花招捉弄对方。
        - id: ch01-b02
          speaker: narrator
          text: 萨米还牢牢记着春天里的那件事。喋喋偷了啄木鸟鼓手的蛋，却把罪名推给萨米。老果园里的鸟儿全都赶他走，直到后来才查出真正的小偷是谁。那样卑鄙的花招，萨米忘不了，也一直不肯原谅。如今，他总算出了这口气。
        - id: ch01-b03
          speaker: narrator
          text: 萨米心底其实不愿喋喋真的受伤。他只爱看喋喋吓得心惊胆战。可最有意思的，还是跟喋喋比一比谁的脑筋更灵。他们两个都是淘气鬼，也都有一肚子机灵主意。
    - id: ch02
      title: 萨米还有一个主意
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 喋喋从玉米地边的空心栏木粮仓里运来玉米时，萨米一会儿嘟囔，一会儿挑毛病。其实，他全是装的。那座粮仓，萨米早就想到了。他还觉得，喋喋一开始竟然没记起来，真是笨得很。
        - id: ch02-b02
          speaker: narrator
          text: 现在喋喋总算想起了粮仓，萨米心里很高兴，脸上却偏要装出不高兴的样子。因为他知道，喋喋正在暗自得意，以为这一次证明了自己比萨米聪明。可萨米也看到了另一个机会。他要让喋喋知道，喋喋可没有自己想得那么聪明。
    - id: ch03
      title: 绿草地边的商量
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 离开喋喋以后，萨米径直飞进绿森林，又飞到绿草地边。他那双锐利的眼睛在草地上一扫，很快便找到了自己的表兄乌鸦黑黑。萨米飞到黑黑身边，两个家伙低声商量了几分钟。
        - id: ch03-b02
          speaker: narrator
          text: 接着，他们一起望向绿草地中央。那里有一棵孤零零的高树，树梢上端端正正坐着一个黑影，一动也不动。要不是萨米和黑黑的眼睛这么尖，换了别人，多半会以为那只是树的一部分。其实，那是鹰粗腿。他正在等着草地鼠丹尼出现。
        - id: ch03-b03
          speaker: sammy
          text: 这件事你肯帮我吗？我自己可不敢过去。没准儿粗腿一看见我，就会觉得这么肥的冠蓝鸦，拿来当晚餐正好。
        - id: ch03-b04
          speaker: blacky
          text: 当然肯。老粗腿从来不会来惹我。再说，这个玩笑一定特别有意思。
        - id: ch03-b05
          speaker: sammy
          text: 好，那就这么办。明天早晨你也要来，找个能把事情看清楚的地方。
        - id: ch03-b06
          speaker: narrator
          text: 话一说完，萨米便飞回绿森林，藏在那里看着接下来会发生什么。
    - id: ch04
      title: 黑黑发出信号
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 过了没几分钟，黑黑飞到鹰粗腿落脚的那棵树附近。又过了一会儿，萨米听见黑黑用粗哑的嗓子叫了起来。
        - id: ch04-b02
          speaker: blacky
          text: 嘎，嘎，嘎！
        - id: ch04-b03
          speaker: narrator
          text: 萨米笑了。这正是他们约好的信号。听见这声音，他就知道黑黑已经照着答应的做了。
        - id: ch04-b04
          speaker: narrator
          text: 随后，萨米飞走了。他要去找点儿新的恶作剧，好让自己在那天剩下的时间里继续开心。
