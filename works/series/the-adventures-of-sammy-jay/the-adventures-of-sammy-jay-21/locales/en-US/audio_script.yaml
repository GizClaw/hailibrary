audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, excitable, and self-important
        timbre: bright and piercing
        pace: quick
        pitch: high
    blacky:
      display_name: Blacky the Crow
      tts:
        delivery: bold, amused, and confidently mischievous
        timbre: deep and raspy
        pace: moderate
        pitch: low
  chapters:
    - id: ch01
      title: Sammy Jay Makes a Call
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sammy Jay was having more fun at Chatterer's expense than he'd had in a very long time. No, sir, he couldn't remember when he'd enjoyed himself so much. Those two had never been good friends. Whenever one got the chance, he played a sharp trick on the other.
        - id: ch01-b02
          speaker: narrator
          text: Sammy still remembered the mean trick Chatterer had played that spring. Chatterer stole Drummer the Woodpecker's eggs, then blamed Sammy. The birds of the Old Orchard drove Sammy away before they learned who the real thief was. Sammy had never forgotten it, and he had never forgiven Chatterer. Now he was getting even.
        - id: ch01-b03
          speaker: narrator
          text: Deep down, Sammy didn't want Chatterer to be truly hurt. He just loved frightening him. Best of all, Sammy loved matching his wits against Chatterer's. Both of them were clever, as scamps often are.
        - id: ch01-b04
          speaker: narrator
          text: All the while Sammy had been grumbling and finding fault with the corn, he was only pretending. Chatterer had fetched it from his storehouse in the hollow rail at the edge of the cornfield. Sammy had thought of that storehouse before Chatterer did. In fact, he thought Chatterer was rather stupid for not remembering it sooner.
        - id: ch01-b05
          speaker: narrator
          text: Sammy was glad when Chatterer finally remembered the corn, though he acted as if he wasn't. Why was he glad? Because Chatterer was secretly delighted. Chatterer believed he'd proved himself smarter than Sammy. All the while, Sammy had already spotted another chance to show Chatterer he wasn't nearly as smart as he believed.
        - id: ch01-b06
          speaker: narrator
          text: After leaving Chatterer, Sammy flew straight to the Green Forest, then on to the edge of the Green Meadows. His sharp eyes searched until they found his cousin, Blacky the Crow. Sammy flew over to Blacky's perch, and the two talked for a few minutes.
        - id: ch01-b07
          speaker: narrator
          text: Then they both looked toward a tall tree standing alone in the middle of the Green Meadows. High in its top sat a black shape, stiff and still. Anyone without eyes as sharp as Sammy's and Blacky's might have mistaken it for part of the tree. It was Roughleg the Hawk, watching for Danny Meadow Mouse.
        - id: ch01-b08
          speaker: sammy_jay
          text: Will you do it? I don't dare go myself. Roughleg might decide a fat jay like me would make a fine dinner.
        - id: ch01-b09
          speaker: blacky
          text: Sure, I'll do it. Old Roughleg never troubles me, and this will be a wonderful joke.
        - id: ch01-b10
          speaker: sammy_jay
          text: Good. Be somewhere you can watch what happens tomorrow morning.
        - id: ch01-b11
          speaker: narrator
          text: With that, Sammy flew back to the Green Forest. He chose a place where he could watch everything that happened.
        - id: ch01-b12
          speaker: narrator
          text: Sammy only had to wait a few minutes. Then Blacky flew near the tree where Roughleg was sitting. Before long, Sammy heard Blacky's harsh voice.
        - id: ch01-b13
          speaker: blacky
          text: Caw, caw, caw!
        - id: ch01-b14
          speaker: narrator
          text: Sammy smiled. That call was the signal. It told him Blacky had done exactly what he promised.
        - id: ch01-b15
          speaker: narrator
          text: Then Sammy flew away to find some fresh mischief to amuse him for the rest of the day.
