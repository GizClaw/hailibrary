audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: clever, smug, and quick to make mischief
        timbre: bright and sharp
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Sammy Jay Makes a Fuss
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sammy Jay doesn't mind winter cold. In fact, he rather likes it. Beneath his handsome blue coat, trimmed with white, he wears a warm, silky suit of underwear. So he can laugh at rough Brother North Wind and his cousin, Jack Frost.
        - id: ch01-b02
          speaker: narrator
          text: Even so, Sammy doesn't like winter as much as the warmer seasons. You see, he is lazy. He doesn't want to work any harder than he must to get a living, and food is harder to find in winter.
        - id: ch01-b03
          speaker: narrator
          text: There is another reason he likes winter less. Can you guess what it is? It isn't a nice reason at all. No, sir, it isn't nice. Winter makes it harder for him to stir up trouble. And somehow, Sammy never seems truly happy unless he is making trouble for somebody else. He delights in tormenting the other little people of the Green Meadows and the Green Forest.
        - id: ch01-b04
          speaker: narrator
          text: Dear, dear, it is dreadful to say, but Sammy Jay is bold and bad. He steals whenever he gets the chance. Yes, sir, he would rather steal his breakfast than earn it honestly.
        - id: ch01-b05
          speaker: narrator
          text: Thieves are usually very sly, and Sammy is one of the slyest little people in the Green Forest. Instead of honestly hunting for his meals, he spends most of his time watching his neighbors. He wants to learn where they keep their stores of food, so he can help himself when their backs are turned.
        - id: ch01-b06
          speaker: narrator
          text: Sammy slips through the forest as quietly as can be. He hides among the thick treetops or behind the trunks of big trees, peeking at his neighbors with his sharp eyes. If someone discovers him, he pretends he has been busy with his own affairs. Then he acts very surprised to find anyone nearby.
        - id: ch01-b07
          speaker: narrator
          text: That was how Sammy had found one of Chatterer the Red Squirrel's storehouses. He didn't let Chatterer know. Oh, my, no! For a long while, he didn't even go near the place again. But he never forgot it. Sammy Jay never forgets that kind of thing. He thought about the storehouse again and again, and each time, he told himself the same little rhyme.
        - id: ch01-b08
          speaker: sammy_jay
          text: Sometime when the snow is deep, and Chatterer is fast asleep, when Mother Nature is unkind, and things to eat are hard to find, I'll help myself and fly away, to steal again some other day.
        - id: ch01-b09
          speaker: narrator
          text: Now the snow was deep, and food was hard to find. But Chatterer wasn't asleep. No, indeed! He seemed to enjoy the cold. He was as frisky and lively as ever, and he never wandered far from that storehouse.
        - id: ch01-b10
          speaker: narrator
          text: Sammy watched and watched. Not once did he get a chance to steal the sweet acorns he had seen Chatterer put away in the fall.
        - id: ch01-b11
          speaker: sammy_jay
          text: Hmm. I'll have to find some way to draw Chatterer away from his storehouse.
        - id: ch01-b12
          speaker: narrator
          text: For a long time, Sammy sat at the top of a tall, dark pine tree and thought. At last, his sharp eyes began to twinkle with a very cunning look. He chuckled, and it was a naughty chuckle.
        - id: ch01-b13
          speaker: narrator
          text: Away he flew to a thick spruce tree some distance off in the Green Forest. It was far from the storehouse, but close enough for Chatterer to hear him. There Sammy began to make a tremendous fuss. He screamed and screeched as only Sammy Jay can.
        - id: ch01-b14
          speaker: narrator
          text: Before long, exactly as Sammy expected, Chatterer came hurrying over to find out what all the fuss was about. Sammy slipped silently out the other side of the spruce tree. Then, without making a sound, he hurried straight back to Chatterer's storehouse.
