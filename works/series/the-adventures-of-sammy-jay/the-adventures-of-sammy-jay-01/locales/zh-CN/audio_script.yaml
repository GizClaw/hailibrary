audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵自得，盘算时透着狡猾
        timbre: 清脆明亮
        pace: 轻快灵活
        pitch: 中高音
  chapters:
    - id: ch01
      title: 不安分的萨米
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 松鸦萨米一点也不怕冬天的冷，甚至还有几分喜欢。他披着漂亮的蓝外套，白边底下又有一层暖和柔滑的贴身羽毛。粗野的北风兄弟也好，北风的表弟寒霜杰克也好，他见了都不在乎。
        - id: ch01-b02
          speaker: narrator
          text: 可要和温暖的季节相比，萨米还是不大喜欢冬天。为什么呢？嗯，因为他是个懒家伙。谋生时能少费一分力，他就绝不肯多费一分，偏偏到了冬天，吃的东西又没有那么容易找到。
        - id: ch01-b03
          speaker: narrator
          text: 还有一个缘故。你猜是什么？说起来可一点也不光彩。真的，先生，一点也不光彩！冬天不容易惹出乱子，而萨米要是不给别人找点麻烦，好像就怎么也快活不起来。绿草地和绿森林里的那些小居民，都是他最爱捉弄的对象。
        - id: ch01-b04
          speaker: narrator
          text: 哎呀呀，这话说出来真叫人为难，却又不能不说。松鸦萨米又大胆又坏，还会偷东西！没错，先生，只要有机会，他就下手。无论什么时候，哪怕只是一顿早餐，他也宁可偷来，不肯老老实实去找。
        - id: ch01-b05
          speaker: narrator
          text: 偷东西的家伙总得狡猾，萨米正是绿森林里最狡猾的小居民之一。别人忙着找食物，他却专门窥探邻居的粮仓，等人家一转身，就去随意取用。他在林中走得悄无声息，一会儿藏进浓密的树冠，一会儿躲到粗大的树干后，用锐利的眼睛盯着邻居。万一被发现，他马上装作只顾忙自己的事，还摆出一副没想到附近有人的惊讶模样。
    - id: ch02
      title: 惦记粮仓
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 就这样，萨米发现了红松鼠喋喋的一处粮仓。他可没让喋喋知道，一点风声也没露。哎呀，他才不会那么做！往后很长一段日子，他甚至不再靠近那里。可是忘掉它？那绝不可能！像这样的事，萨米从来不会忘，永远不会。他一次又一次想起那座粮仓，每次都在心里念叨同一首小调。
        - id: ch02-b02
          speaker: sammy_jay
          text: 等到积雪厚又深，喋喋睡得正香沉，大自然妈妈不留情，吃的东西无处寻，我就自己拿了飞，改天再偷走一回。
        - id: ch02-b03
          speaker: narrator
          text: 现在，雪果真积得很深，食物也果真难找。可是红松鼠喋喋没有睡觉。不，他根本没睡！喋喋似乎很喜欢冷天气，还是和往常一样活泼，一样敏捷，而且从来不肯走到离粮仓太远的地方。萨米守了又守，却连一次机会也找不到，偷不走那些香甜的橡子。那些橡子，还是秋天时他亲眼看着喋喋存进去的呢。
    - id: ch03
      title: 一场大吵闹
      blocks:
        - id: ch03-b01
          speaker: sammy_jay
          text: 嗯——我得想个法子，让喋喋离开他的粮仓。
        - id: ch03-b02
          speaker: narrator
          text: 萨米停在一棵高大幽暗的松树顶上，想了很久。忽然，他的眼睛里闪过一道狡猾的光，嘴里还发出一声不怀好意的低笑。
        - id: ch03-b03
          speaker: narrator
          text: 他飞到林中稍远处，钻进一棵枝叶极密的云杉。那里离喋喋不算近，却正好能让喋喋听见。接着，萨米大吵大闹起来。他扯开嗓子又尖叫又嘶喊，这样的动静，只有他闹得出来。
        - id: ch03-b04
          speaker: narrator
          text: 没过多久，一切果然照着萨米的盘算发生了。红松鼠喋喋急匆匆赶过来，想看看究竟出了什么事。萨米随即从云杉另一边悄悄溜走，一声不响地直奔喋喋的粮仓。
