audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Chatterer Studies a Way to Get Farmer Brown's Corn
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Chatterer could think of only one thing. Farmer Brown had a little house full of corn, and Chatterer wanted some. Sammy Jay had claimed he could take all he wanted. Now Chatterer meant to find out how he did it.
        - id: ch01-b02
          speaker: narrator
          text: Very early the next morning, Chatterer hid between the stones of the old wall. Mr. Sun was just sending his first red rays through Farmer Brown's windows when Sammy Jay arrived. Strangely enough, Sammy made no noise at all, and Chatterer noticed that at once.
        - id: ch01-b03
          speaker: narrator
          text: Sammy looked this way and that without making a sound. Once he was sure no one was near, he flew to the queer little house on four legs where Farmer Brown kept his corn. He pushed his bill through the wide cracks in the wall and helped himself without any trouble. When he had eaten enough, he slipped away as quietly as he had come.
        - id: ch01-b04
          speaker: narrator
          text: Chatterer grinned.
        - id: ch01-b05
          speaker: chatterer
          text: Sammy taught me something without even knowing it. He's stealing that corn, and he doesn't want anyone to catch him. I'll have to be every bit as careful.
        - id: ch01-b06
          speaker: narrator
          text: No one seemed to be around Farmer Brown's house. Chatterer raced across the yard as fast as his little legs could carry him and made straight for the corn house. Then he met with a terrible disappointment. He couldn't reach the cracks Sammy had used.
        - id: ch01-b07
          speaker: narrator
          text: The little house stood on four stone legs. Before it was set there, someone had turned an old pan upside down over each leg. Climbing a stone leg would have been hard enough. Even if Chatterer managed that, he could never get past the tin pan at the top, and he certainly couldn't gnaw through it.
        - id: ch01-b08
          speaker: narrator
          text: Chatterer ground his teeth in anger. What could be more maddening than having such a feast so close and still being unable to reach it? How he wished he had wings like Sammy Jay.
        - id: ch01-b09
          speaker: narrator
          text: Chatterer became so busy trying to work out a way to reach the corn that he forgot about everything else. Then a leaf rustled, and he turned his head. Goodness gracious! Black Pussy was only two jumps away, and her yellow eyes were fierce with hunger. Chatterer dashed to the nearest tree and scrambled up as fast as he could.
        - id: ch01-b10
          speaker: narrator
          text: Once he was in the tree, Chatterer wasn't afraid at all. He knew he could run onto the little branches where Black Pussy would never dare to follow. So he turned around and called her every bad name he knew.
        - id: ch01-b11
          speaker: narrator
          text: After Black Pussy slunk away, Chatterer scampered to the very top of the tree to think things over.
        - id: ch01-b12
          speaker: narrator
          text: And right then, he discovered a way to get the corn from Farmer Brown's little house.
