audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 急性直率，发怒时尖锐泼辣
        timbre: 明亮细脆
        pace: 快而有弹性
        pitch: 高音
  chapters:
    - id: ch01
      title: 萨米的秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 喋喋脑子里翻来覆去，想的只有农夫布朗那一屋子玉米。他怎样才能弄到一些呢？冠蓝鸦萨米说过，那里的玉米随他吃。喋喋决定亲眼看看，他到底用了什么办法。
        - id: ch01-b02
          speaker: narrator
          text: 第二天一大早，喋喋就藏进了旧石墙的石缝里。太阳公公的第一缕红光刚照进农夫布朗家的窗户，萨米便飞来了。奇怪的是，他今天安静极了，连一点声响都没有。喋喋马上留了心。
        - id: ch01-b03
          speaker: narrator
          text: 萨米无声地左看右看，确定附近没人，这才飞向那座四条腿的小房子。他把嘴伸进墙板的宽缝，轻轻松松地吃起玉米，想吃多少就吃多少。吃饱以后，他又悄无声息地飞走了。
        - id: ch01-b04
          speaker: narrator
          text: 喋喋看着这一切，咧开嘴笑了。
        - id: ch01-b05
          speaker: chatterer
          text: 萨米还不知道，他已经把办法教给我了。他是在偷玉米，所以不敢让人瞧见。我也得跟他一样小心。
    - id: ch02
      title: 够不着的盛宴
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 农夫布朗家周围，一个人影也没有。喋喋撒开小腿，用最快的速度穿过院子，直奔那座小房子。谁知到了跟前，他却傻眼了。萨米啄玉米的缝隙那么高，他根本爬不上去。
        - id: ch02-b02
          speaker: narrator
          text: 原来，房子架在四条石腿上。人们安装房子以前，先在每条腿顶端倒扣了一只旧铁皮盘。爬石腿本来就费劲，就算喋喋真能爬上去，也没办法绕过那只盘子。他当然更不可能把铁皮啃穿。
        - id: ch02-b03
          speaker: narrator
          text: 喋喋气得咬紧牙齿，磨得咯咯作响。多丰盛的一顿美餐啊，明明就在眼前，他却怎么也碰不到。这实在太气人了。他多希望自己也有一双萨米那样的翅膀！
    - id: ch03
      title: 树梢上的办法
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 喋喋只顾着想怎样拿到玉米，别的什么都忘了。忽然，一片树叶沙沙地响了一声。他转头一看。我的天哪！黑猫咪离他只有两扑远，一双黄眼睛里全是凶狠的馋意。
        - id: ch03-b02
          speaker: narrator
          text: 喋喋猛地蹿向最近的树，使出全身力气爬了上去。到了树上，他就一点儿也不怕了。他知道，自己可以跑到细细的小树枝上，黑猫咪绝不敢跟过去。
        - id: ch03-b03
          speaker: narrator
          text: 于是，喋喋转过身，把他知道的难听话统统骂给黑猫咪听。黑猫咪只好灰溜溜地走了。喋喋一口气蹿到树顶，开始仔细盘算。
        - id: ch03-b04
          speaker: narrator
          text: 就在那一刻，他忽然想出了一个办法，能从农夫布朗的小房子里拿到玉米。
