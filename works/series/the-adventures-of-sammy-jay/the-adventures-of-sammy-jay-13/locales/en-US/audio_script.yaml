audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: clever, smug, and quick to make mischief
        timbre: bright and sharp
        pace: lively
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly, amused, and thoughtful beneath polite words
        timbre: smooth and lightly raspy
        pace: unhurried
        pitch: medium-low
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Sammy Jay Tells His Troubles to Reddy Fox
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sammy Jay couldn't stop thinking about the terrible fright he'd had at Farmer Brown's corn-crib. He had pushed his bill through a crack to get a few grains of corn. Then something grabbed his bill and held on tight. Sammy felt sure it had been some kind of trap set by Farmer Brown's boy.
        - id: ch01-b02
          speaker: narrator
          text: He flew down to the Green Forest to think things over and decide how to get even with the boy. Sammy sat there muttering to himself. Along came Reddy Fox, and for once, Reddy spotted Sammy before Sammy noticed him.
        - id: ch01-b03
          speaker: narrator
          text: Reddy grinned. He could see that Sammy had something on his mind. Then he called out to him.
        - id: ch01-b04
          speaker: reddy_fox
          text: Hello, Sammy! What's wrong? You look as though your stomach hurts, your head hurts, and everything else hurts too.
        - id: ch01-b05
          speaker: sammy_jay
          text: There's plenty wrong, Reddy Fox! Plenty!
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: Sammy snapped out the words. He felt that he simply had to tell someone, so he told Reddy all about his terrible fright that morning.
        - id: ch01-b07
          speaker: sammy_jay
          text: It was a trap. Farmer Brown's boy set some kind of trap for me. You'd think he could spare a few grains of corn when he has so much! I... I... I'd like to peck his eyes out! That's what I'd like to do!
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: Sammy said it because that was the most dreadful thing he could imagine. He didn't really mean it. Reddy knew that, and he grinned. He also knew Sammy would never dare get close enough to Farmer Brown's boy to do anything but scream at him.
        - id: ch01-b09
          speaker: narrator
          text: While he listened, Reddy sat with his head tilted to one side, the way he always did when he was thinking. Inside, he was laughing. Reddy knew a great deal about traps and about Farmer Brown's boy. He couldn't believe the boy would put a trap in such a strange place as a crack in the corn-crib wall.
        - id: ch01-b10
          speaker: reddy_fox
          text: If Farmer Brown's boy cared about those few grains Sammy took, he wouldn't bother trying to trap him. He'd wait with his gun and shoot him. Something else must have frightened Sammy. There's no use telling him that, though. I think I'll go see what's happening at that corn-crib.
        - id: ch01-b11
          speaker: narrator
          text: Reddy kept his doubts to himself.
        - id: ch01-b12
          speaker: reddy_fox
          text: That sounds like a terrible experience, Sammy Jay. No wonder you were frightened. Are you going back there tomorrow morning?
        - id: ch01-b13
          speaker: sammy_jay
          text: What? Go back there again? Do you honestly think I'd do that? One lesson like that is enough for me. There's plenty of food in the Green Forest and on the Green Meadows. I don't need to take a risk like that. No, sir! You won't find me near Farmer Brown's corn-crib again anytime soon. Not if my name is Sammy Jay!
          emotion: fearful
        - id: ch01-b14
          speaker: reddy_fox
          text: That's very wise. Very wise indeed. Staying away from danger is always the sensible thing to do.
        - id: ch01-b15
          speaker: narrator
          text: Reddy said it gravely, then trotted up the Lone Little Path. Inside his red head, his thoughts were busy. Something about Sammy Jay's fright seemed very strange, and Reddy meant to learn the truth. At the first peep of day the next morning, he would be near Farmer Brown's corn-crib to see what was going on.
        - id: ch01-b16
          speaker: narrator
          text: All that day, Sammy Jay flew through the Green Forest. He told everyone who would listen that Farmer Brown's boy had tried to trap him. Late that afternoon, he went to the Old Orchard and told the whole story again to Chatterer the Red Squirrel. Chatterer didn't even smile until Sammy was gone.
        - id: ch01-b17
          speaker: narrator
          text: Then Chatterer threw himself on the ground. He rolled over and over, laughing until his sides ached.
