audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    sammy:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 爱管闲事又自信，开口爽快，带一点得意
        timbre: 清亮而响亮
        pace: 明快利落
        pitch: 中高音
    reddy:
      display_name: 狐狸雷迪
      tts:
        delivery: 机灵圆滑，表面一本正经，暗中带着笑意
        timbre: 柔和而略显狡黠
        pace: 从容灵活
        pitch: 中低音
  chapters:
    - id: ch01
      title: 萨米满肚子怒气
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 冠蓝鸦萨米怎么也忘不了玉米仓里的那场惊吓。这件事一直在他脑袋里打转，害得他别的什么也想不了。他刚把嘴伸进墙缝，想啄几粒玉米，就被什么东西一把抓住，怎么也挣不开，那东西还一直不肯松开。萨米认定，那一定是农夫布朗家的男孩设下的圈套。
        - id: ch01-b02
          speaker: narrator
          text: 他飞回绿森林，想把这件事好好琢磨明白，再找个办法跟农夫布朗家的男孩算账。萨米坐在那里嘀嘀咕咕时，狐狸雷迪正好走来。难得的是，这一回雷迪先看见了萨米。
        - id: ch01-b03
          speaker: narrator
          text: 雷迪瞧着萨米那副模样，忍不住咧嘴笑了。他心里想，萨米准是碰上了什么烦心事。
        - id: ch01-b04
          speaker: reddy
          text: 你好啊，萨米！你这是怎么了？瞧你愁成这样，简直像肚子也疼，脑袋也疼，浑身哪儿都疼。
        - id: ch01-b05
          speaker: sammy
          text: 我当然有事，狐狸雷迪！事情大着呢！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 萨米正憋得难受，非找个人说说不可。他马上把那天早晨的可怕遭遇，从头到尾讲给了雷迪，连自己当时有多害怕也一点儿没漏掉。
    - id: ch02
      title: 一定是个圈套
      blocks:
        - id: ch02-b01
          speaker: sammy
          text: 那就是个圈套！准是农夫布朗家的男孩设的。他有那么多玉米，连几粒都不肯分吗？我……我真想啄掉他的眼睛！我真想这么干！
          emotion: angry
        - id: ch02-b02
          speaker: narrator
          text: 这已经是萨米想得出的最狠的话了，可他并不真想那么做。雷迪一听就知道，只是咧着嘴笑。萨米连靠近农夫布朗家的男孩都不敢，最多只会远远冲着人家尖叫。
        - id: ch02-b03
          speaker: narrator
          text: 雷迪一边听，一边歪着头。这是他动脑筋时的老样子。其实，他心里早就笑开了。圈套是怎么回事，农夫布朗家的男孩又会怎么做，雷迪全都清楚。他才不信那个男孩会把圈套设在玉米仓的墙缝里，那地方也太古怪了。
        - id: ch02-b04
          speaker: reddy
          text: 要是那男孩真舍不得萨米偷走的几粒玉米，哪里用得着费力设圈套？他只要拿着枪守在那里，见到萨米就开枪了。吓到萨米的，准是别的人，或者别的什么东西。不过，现在跟萨米说这些也没用。我还是亲自去玉米仓瞧瞧吧。
    - id: ch03
      title: 雷迪有了主意
      blocks:
        - id: ch03-b01
          speaker: reddy
          text: 萨米，你这回可真是吓得不轻，难怪会害怕。那你明天早晨还去玉米仓吗？
        - id: ch03-b02
          speaker: sammy
          text: 什么？还去？你把我当谁了？这样的教训，我受一次就够啦！绿森林和绿草地上有的是吃的，我干吗还要去冒险？不，先生，这阵子你绝不会在农夫布朗家的玉米仓旁边见到我。要不然，我就不叫冠蓝鸦萨米！
          emotion: surprised
        - id: ch03-b03
          speaker: reddy
          text: 你这样想很明智，实在明智。离危险远一点儿，总不会错。
        - id: ch03-b04
          speaker: narrator
          text: 雷迪说得一本正经，随后沿着孤零零的小径跑远了。他那颗红脑袋可没有闲着。萨米受惊的事太古怪，雷迪非查清楚不可。第二天天刚亮，他就要守到玉米仓边，看看那里到底有什么名堂。
    - id: ch04
      title: 喋喋终于笑了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 那一整天，萨米都在绿森林里飞来飞去。只要有人肯听，他就讲一遍农夫布朗家的男孩怎样设圈套捉他。
        - id: ch04-b02
          speaker: narrator
          text: 下午很晚的时候，萨米又去了老果园，把整件事从头到尾讲给红松鼠喋喋听。萨米没走以前，喋喋连嘴角都没动一下。
        - id: ch04-b03
          speaker: narrator
          text: 可萨米一离开，喋喋便扑倒在地，翻过来，滚过去，笑得肚子都疼了。
