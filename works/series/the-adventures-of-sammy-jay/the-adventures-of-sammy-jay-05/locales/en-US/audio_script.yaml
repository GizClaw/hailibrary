audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: clever, smug, and quick to make mischief
        timbre: bright and sharp
        pace: lively
        pitch: medium-high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, earnest, and quick to speak his mind
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
    chatterer:
      display_name: Chatterer the Red Squirrel
      tts:
        delivery: excitable, sharp, and restless
        timbre: light and wiry
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Sammy Jay Brings News
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit had a very funny feeling. That morning, he had set out with the best intentions in the world. He meant to go straight to Chatterer the Red Squirrel and admit how mean he had been. Peter had spied on Chatterer while Chatterer was trying to keep his new house a secret.
        - id: ch01-b02
          speaker: narrator
          text: Then Peter overheard Chatterer telling Tommy Tit the Chickadee that he had fooled Peter completely. Peter did not know where the new house was after all. Never in his life had Peter felt so foolish. No, sir, never.
        - id: ch01-b03
          speaker: narrator
          text: If Chatterer had truly fooled him, then Peter saw no use in asking Chatterer's pardon. How could he apologize for finding a secret when he had not found it at all? He would only make himself an even greater laughingstock. Still, what Peter had done was just as mean as it would have been if he had discovered the secret. He knew he would feel better if he admitted what he had done.
        - id: ch01-b04
          speaker: narrator
          text: Peter scratched his left ear with his right hind foot. Then he scratched his right ear with his left hind foot. He pulled at his whiskers, but he still could not decide what to do.
        - id: ch01-b05
          speaker: narrator
          text: While Peter was still trying to decide, a great racket came from the direction of the Green Forest. It was Sammy Jay, screaming as noisily as ever and hurrying straight toward the Old Orchard. Chatterer heard him, of course. As soon as Sammy was close enough, Chatterer called out, and Sammy hurried over.
        - id: ch01-b06
          speaker: sammy_jay
          text: There you are! I've searched all through the Green Forest for you, and now I'm worn out. I have news.
        - id: ch01-b07
          speaker: narrator
          text: Chatterer danced about, too impatient to keep still.
        - id: ch01-b08
          speaker: chatterer
          text: What is it? Tell me!
        - id: ch01-b09
          speaker: sammy_jay
          text: I saw Shadow the Weasel.
        - id: ch01-b10
          speaker: narrator
          text: Chatterer's voice filled with worry.
        - id: ch01-b11
          speaker: chatterer
          text: Where did you see him?
        - id: ch01-b12
          speaker: sammy_jay
          text: He's in the Green Forest. He says he'll stay there until he catches you, even if it takes all winter. He'll search every tree in the forest if that is what he has to do.
        - id: ch01-b13
          speaker: narrator
          text: For a moment, Chatterer actually turned pale.
        - id: ch01-b14
          speaker: chatterer
          text: You didn't tell him I wasn't in the Green Forest, did you?
          emotion: fearful
        - id: ch01-b15
          speaker: sammy_jay
          text: Of course not! How could I tell him when I didn't know that myself?
          emotion: disgusted
        - id: ch01-b16
          speaker: chatterer
          text: And when you see him again, you won't tell him, will you, Sammy?
          emotion: fearful
        - id: ch01-b17
          speaker: sammy_jay
          text: What kind of bird do you think I am? I don't care for you, Chatterer, and you know it. You're a red-headed, red-coated nuisance, and I don't feel one bit sorry that you're in trouble. But I would never hand even my worst enemy over to a cruel, cold-blooded robber like Shadow the Weasel. He'd kill me as quickly as he'd kill you if he could catch me, and he can't. I'm going to make sure every little person who is afraid of him knows he is around. I'm flying to the Old Briar-patch right now to warn Peter Rabbit.
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: Peter spoke up from his hiding place.
        - id: ch01-b19
          speaker: peter_rabbit
          text: You don't have to go. I'm right here. Thank you for wanting to warn me, Sammy. And I'm sorry I ever said mean things about you.
        - id: ch01-b20
          speaker: sammy_jay
          text: Pooh! Don't be sorry. I suppose I deserved those things.
        - id: ch01-b21
          speaker: narrator
          text: Then Sammy, Peter, and Chatterer began talking over the news of Shadow the Weasel. They were all so eager and interested that they noticed nothing else around them.
        - id: ch01-b22
          speaker: narrator
          text: Not one of them saw Black Pussy creeping along the old stone wall.
