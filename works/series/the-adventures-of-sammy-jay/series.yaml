cover_prompt: |-
  A wordless winter woodland cover shows a handsome blue jay with vivid blue wings, white trim, dark markings, and a pert crest swooping toward a red squirrel's hidden store of acorns in a hollow tree. The alert red squirrel races back along a snow-dusted branch while the bird pauses with one acorn in his bill, making their contest of wits the focal action. Behind them, the Green Forest opens toward an old stone wall, a quiet orchard, and a distant wooden corn-crib on a small early-twentieth-century American farm. Use a wide child-height view through pine boughs, with the two animals large and readable in the lower middle of the composition and their opposing movement forming a gentle arc. Keep their anatomy, scale, winter coats, and woodland behavior believable, with a playful mood and no threat or frightening pursuit. Leave broad calm room in the pale winter sky and upper pine canopy for cover design. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.

