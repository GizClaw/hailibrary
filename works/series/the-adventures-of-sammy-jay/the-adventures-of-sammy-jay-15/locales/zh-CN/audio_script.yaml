audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    reddy:
      display_name: 狐狸雷迪
      tts:
        delivery: 机灵圆滑，表面一本正经，暗中带着笑意
        timbre: 柔和而略显狡黠
        pace: 从容灵活
        pitch: 中低音
    sammy:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 爱管闲事又自信，开口爽快，带一点得意
        timbre: 清亮而响亮
        pace: 明快利落
        pitch: 中高音
  chapters:
    - id: ch01
      title: 萨米正在生闷气
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 狐狸雷迪找到冠蓝鸦萨米时，萨米正在生闷气。他平日总能从农夫布朗家的玉米仓偷来玉米当早餐，可这一天，他一口也没吃上，脾气自然坏得很。
        - id: ch01-b02
          speaker: reddy
          text: 早上好。
        - id: ch01-b03
          speaker: narrator
          text: 雷迪说得客客气气。只要他存心讲礼貌，谁也比不过他。
        - id: ch01-b04
          speaker: sammy
          text: 早上好。
        - id: ch01-b05
          speaker: narrator
          text: 萨米只含含糊糊地咕哝了一声。
        - id: ch01-b06
          speaker: reddy
          text: 今天早晨，我发现了一件事。你也许会有兴趣。
        - id: ch01-b07
          speaker: narrator
          text: 雷迪根本不理会萨米那张气鼓鼓的脸。
        - id: ch01-b08
          speaker: sammy
          text: 我才没兴趣。没有！现在什么事也引不起我的兴趣。
        - id: ch01-b09
          speaker: reddy
          text: 连圈套也不能让你感兴趣吗？
        - id: ch01-b10
          speaker: narrator
          text: 雷迪问得很狡猾。萨米立刻抬起头，死死盯住了他。
        - id: ch01-b11
          speaker: sammy
          text: 你刚才说什么？
    - id: ch02
      title: 雷迪拿胆小鬼来激他
      blocks:
        - id: ch02-b01
          speaker: reddy
          text: 噢，也没什么。今天早晨，我不过是发现了一件东西。本来还想带你去看看，可惜你是个胆小鬼。
        - id: ch02-b02
          speaker: narrator
          text: 雷迪说得轻描淡写，好像这件事连他自己也不在乎。
        - id: ch02-b03
          speaker: sammy
          text: 谁说我是胆小鬼？
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: 萨米气得尖声大叫，还在原地蹦来跳去。
        - id: ch02-b05
          speaker: reddy
          text: 我说的。你就不敢明天早晨跟我去看看，农夫布朗家的玉米仓那边究竟有什么事。
        - id: ch02-b06
          speaker: sammy
          text: 才不是！只要你敢去，我就敢去。听清楚了吧，狐狸雷迪！
          emotion: angry
        - id: ch02-b07
          speaker: reddy
          text: 那我就来激你一回。明天太阳刚出来，你到绿森林边上等我，再跟我一起去盯着农夫布朗家的玉米仓。
        - id: ch02-b08
          speaker: sammy
          text: 我一定到！我也要让你弄明白，你敢做的事，没有一件是我不敢做的！
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: 萨米的话说得又快又硬。可说实在的，雷迪才提起那座玉米仓，他的心就往下一沉。就在前一天早晨，他曾在那里受过一场可怕的惊吓，这件事你一定还记得。
        - id: ch02-b10
          speaker: reddy
          text: 那好。太阳一出来，你就得到，可不许迟到。
        - id: ch02-b11
          speaker: narrator
          text: 雷迪咧着嘴，小跑着走了。他知道萨米最受不了别人叫他胆小鬼，宁可冒很大的险，也要证明自己有胆量。再说，谁愿意让别人叫自己胆小鬼呢？
    - id: ch03
      title: 躲在玉米仓旁
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天一早，雷迪和萨米在绿森林边上碰了头。
        - id: ch03-b02
          speaker: reddy
          text: 咱们沿着玉米仓后面的篱笆过去。我还躲在昨天早晨那个地方，你藏进旁边那棵常青树里。你盯紧仓顶，大概就会看见一样东西，也会明白前天早晨你的嘴为什么被夹住了。不管看到什么，你都别出声，一丁点儿声音也不能有。
        - id: ch03-b03
          speaker: narrator
          text: 萨米答应了。两个人赶到各自的藏身处，萨米才在常青树上待稳，就看见红松鼠喋喋沿着伸到玉米仓上方的树枝跑来，一下跳上了仓顶。
        - id: ch03-b04
          speaker: narrator
          text: 一眨眼，喋喋从屋檐底下的洞里钻进去，没影了。他刚消失，雷迪便飞快跑向老果园边的旧石墙，藏到了墙后。
        - id: ch03-b05
          speaker: narrator
          text: 萨米马上猜到了。前天早晨，他在玉米仓啄墙缝里的玉米，嘴忽然被夹住，差点吓掉了魂。这件事一定和喋喋有关。
    - id: ch04
      title: 萨米搅了雷迪的好事
      blocks:
        - id: ch04-b01
          speaker: sammy
          text: 原来那根本不是圈套，是喋喋搞的鬼！
          emotion: angry
        - id: ch04-b02
          speaker: narrator
          text: 萨米越想越气，几乎在树枝上坐不住。不过，他还想看看喋喋接下来要干什么，只好咬住舌头，不让自己出声。
        - id: ch04-b03
          speaker: narrator
          text: 没过多久，喋喋钻了出来，两颊塞满玉米，鼓鼓囊囊的。萨米这下再也忍不住了。他把不出声的承诺忘得一干二净，猛地冲出藏身处，怒气冲冲地扑向喋喋。
        - id: ch04-b04
          speaker: narrator
          text: 萨米扯着嗓子尖叫，把能想到的难听话都骂了出来。喋喋满嘴都是玉米，当然没法还嘴，可他还能跑。只见一道红色的小闪电蹿上那棵伸到玉米仓上方的树，绕着树干左躲右闪。
        - id: ch04-b05
          speaker: narrator
          text: 旧石墙后面，狐狸雷迪气得低声咆哮。闹出这么大的动静，他知道自己再留在那里就不安全了。
