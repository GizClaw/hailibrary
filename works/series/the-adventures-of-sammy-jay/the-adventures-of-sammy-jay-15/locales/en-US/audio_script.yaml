audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: proud, sharp-tongued, and quick to flare up
        timbre: bright and piercing
        pace: brisk
        pitch: high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: smooth, sly, and deliberately polite
        timbre: lean and velvety
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Sammy Jay Spoils the Plan of Reddy Fox
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Reddy Fox found Sammy Jay in a very bad temper. Sammy had missed his usual breakfast of corn stolen from Farmer Brown's corncrib, and that had made him cross.
        - id: ch01-b02
          speaker: reddy_fox
          text: Good morning, Sammy.
        - id: ch01-b03
          speaker: narrator
          text: Reddy was as polite as could be. No one could sound more polite than Reddy Fox when he chose to.
        - id: ch01-b04
          speaker: sammy_jay
          text: Morning.
        - id: ch01-b05
          speaker: reddy_fox
          text: I learned something this morning that might interest you.
        - id: ch01-b06
          speaker: narrator
          text: He paid no attention to Sammy's cross look.
        - id: ch01-b07
          speaker: sammy_jay
          text: No, it won't. It won't interest me at all. Nothing interests me today.
        - id: ch01-b08
          speaker: reddy_fox
          text: Not even traps?
        - id: ch01-b09
          speaker: sammy_jay
          text: What did you say?
        - id: ch01-b10
          speaker: narrator
          text: Sammy looked sharply at Reddy.
        - id: ch01-b11
          speaker: reddy_fox
          text: Oh, it isn't much. I only found something this morning that you might want to see. But I suppose you're too much of a coward.
        - id: ch01-b12
          speaker: narrator
          text: Reddy spoke as though the whole matter hardly interested him.
        - id: ch01-b13
          speaker: sammy_jay
          text: Who says I'm a coward?
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: Sammy shrieked and danced about in anger.
        - id: ch01-b15
          speaker: reddy_fox
          text: I do. And you certainly wouldn't dare come with me tomorrow morning to see what's happening at Farmer Brown's corncrib.
        - id: ch01-b16
          speaker: sammy_jay
          text: That's not true! I'll go anywhere you dare to go, Reddy Fox!
          emotion: angry
        - id: ch01-b17
          speaker: reddy_fox
          text: Then meet me at sunrise tomorrow, right at the edge of the Green Forest. I dare you to come with me and watch Farmer Brown's corncrib.
        - id: ch01-b18
          speaker: sammy_jay
          text: I'll be there! You need to understand something, Reddy Fox. There isn't a thing you would dare to do that I wouldn't dare to do, too!
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: Sammy snapped out the words, but the very mention of the corncrib had made his heart sink. Only the morning before, he had been terribly frightened there.
        - id: ch01-b20
          speaker: reddy_fox
          text: All right. Be there exactly at sunrise.
        - id: ch01-b21
          speaker: narrator
          text: Reddy trotted away with a grin. He knew Sammy would risk a great deal before he would let anyone call him a coward. After all, no one likes being called a coward.
        - id: ch01-b22
          speaker: narrator
          text: Early the next morning, Reddy Fox and Sammy Jay met at the edge of the Green Forest.
        - id: ch01-b23
          speaker: reddy_fox
          text: We'll go along the fence behind the corncrib. I'll hide there in the very same place where I hid yesterday, and you can hide in the evergreen tree close by. Keep your eyes on the corncrib roof. I think you'll see something that explains how your bill got caught the other morning. Whatever happens, don't make a sound. Not even the tiniest sound.
        - id: ch01-b24
          speaker: narrator
          text: Sammy promised to be quiet, and the two hurried to their hiding places. He had barely settled among the evergreen branches when Chatterer leaped from an overhanging limb onto the corncrib roof. In another instant, Chatterer slipped through a hole just beneath the roof's edge.
        - id: ch01-b25
          speaker: narrator
          text: As soon as Chatterer vanished, Reddy Fox dashed toward the old stone wall beside the Old Orchard and hid behind it. Sammy understood at once. Chatterer must have caused that terrible fright at the corncrib when Sammy's bill was caught while he pecked between the wall's cracks for corn.
        - id: ch01-b26
          speaker: sammy_jay
          text: So it wasn't a trap at all. It was Chatterer!
          emotion: angry
        - id: ch01-b27
          speaker: narrator
          text: Sammy grew so angry that he could hardly stay still. But he wanted to see what Chatterer would do next, so he bit his tongue and kept quiet.
        - id: ch01-b28
          speaker: narrator
          text: Before long, Chatterer came back out with both cheeks stuffed full of corn. That was more than Sammy could bear. He forgot his promise to make no sound. He burst from the evergreen and flew straight at Chatterer in a terrible rage. At the top of his voice, he screamed every bad name he could think of.
        - id: ch01-b29
          speaker: narrator
          text: Chatterer couldn't answer with all that corn in his cheeks, but he could run. Like a little red flash, he raced into the tree above the corncrib and dodged around its trunk.
        - id: ch01-b30
          speaker: narrator
          text: Behind the old stone wall, Reddy Fox snarled. With Sammy making such a terrible noise, Reddy knew it was no longer safe to stay there.
