audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, excitable, and self-important
        timbre: bright and piercing
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Chatterer Has to Keep His Promise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Chatterer now wished he hadn't been so greedy. He could have let Sammy Jay take whatever corn he could get from Farmer Brown's corn-crib. Instead, Chatterer had played a clever trick and frightened Sammy away. That was why he'd had to promise to fetch Sammy's corn and put it anywhere Sammy wanted. The work itself was easy enough. What bothered Chatterer was knowing Sammy could order him to do it.
        - id: ch01-b02
          speaker: narrator
          text: Chatterer was quick-witted, and so was Sammy Jay. Chatterer had always believed he was the cleverer one. Now Sammy had beaten him, and that wounded his pride. That night, Chatterer curled up in his snug bed inside Drummer the Woodpecker's old home in the Old Orchard. He could think of nothing else. He thought and thought, turning the problem over and over as he searched for a way out of his promise. Just before sleep came, he found one. He would visit the corn-crib before Sammy woke, eat all he wanted, and then hide from him.
        - id: ch01-b03
          speaker: chatterer
          text: Why didn't I think of that before?
        - id: ch01-b04
          speaker: narrator
          text: Chatterer murmured the words sleepily. He smiled, pleased that his wits were sharper than Sammy Jay's after all.
        - id: ch01-b05
          speaker: narrator
          text: Early the next morning, Chatterer went to the corn-crib. He hurried through breakfast, then hid in the old stone wall to watch for Sammy. But Sammy didn't appear at the time he used to come, before Chatterer had given him that terrible fright. Chatterer waited and waited, but there was still no Sammy Jay. Soon he grew impatient. Still, he didn't dare come out. Sammy might arrive the moment he did.
        - id: ch01-b06
          speaker: narrator
          text: At last, Chatterer decided Sammy must have gone somewhere else that morning. He left his hiding place and frisked along the stone wall beside the Old Orchard. Before long, he'd forgotten all about Sammy. Surely Sammy wouldn't visit the corn-crib so late. It wasn't safe at all, because Farmer Brown's boy would almost certainly see him. So Chatterer put his troubles aside and had a splendid time frisking around by himself.
        - id: ch01-b07
          speaker: narrator
          text: Right in the middle of his fun, Sammy Jay arrived in the Old Orchard.
        - id: ch01-b08
          speaker: sammy_jay
          text: Good morning, Chatterer. I'm afraid I'm rather late for breakfast.
        - id: ch01-b09
          speaker: chatterer
          text: Breakfast? You call this breakfast time? It's almost dinner time! I ate hours ago.
          emotion: disgusted
        - id: ch01-b10
          speaker: sammy_jay
          text: I thought you probably had. I was tired this morning, and since I didn't need to fly all the way to the corn-crib myself, there was no reason to hurry. I suppose you've brought plenty of corn here for me.
        - id: ch01-b11
          speaker: narrator
          text: A mischievous look shone in Sammy's sharp black eyes.
        - id: ch01-b12
          speaker: chatterer
          text: Corn for you? Of course I haven't! You never told me to fetch any this morning.
          emotion: angry
        - id: ch01-b13
          speaker: sammy_jay
          text: Didn't I? Then I must have forgotten. That's no trouble. You can run over and bring me some now.
        - id: ch01-b14
          speaker: chatterer
          text: Get it yourself!
          emotion: angry
        - id: ch01-b15
          speaker: sammy_jay
          text: No, I don't think I will. Farmer Brown's boy is chopping wood close to the corn-crib, so I'd prefer you to go.
        - id: ch01-b16
          speaker: chatterer
          text: I won't! I won't!
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: Chatterer screamed the words and danced around in a rage. Sammy only yawned.
        - id: ch01-b18
          speaker: sammy_jay
          text: Oh, that's all right. I saw Shadow the Weasel in the Green Forest this morning. He was asking about you. Perhaps I'll go find him again.
        - id: ch01-b19
          speaker: narrator
          text: Chatterer turned pale. He feared Shadow the Weasel more than anyone under the sun. He would sooner face Farmer Brown's boy.
        - id: ch01-b20
          speaker: chatterer
          text: I... I'll go.
          emotion: fearful
        - id: ch01-b21
          speaker: narrator
          text: Chatterer stammered weakly. There was no escape. He had to keep his promise.
