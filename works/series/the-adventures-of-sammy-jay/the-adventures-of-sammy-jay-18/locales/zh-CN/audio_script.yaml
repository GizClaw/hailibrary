audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    sammy:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 爱管闲事又自信，开口爽快，带一点得意
        timbre: 清亮而响亮
        pace: 明快利落
        pitch: 中高音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 机敏急躁，伶牙俐齿，情绪来得又快又直
        timbre: 轻快而尖亮
        pace: 快速灵活
        pitch: 高音
  chapters:
    - id: ch01
      title: 喋喋想出一个主意
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 喋喋后悔自己太贪心了。要是他肯让萨米从农夫布朗家的玉米仓里吃点儿玉米，没有耍那个狡猾的花招把萨米吓走，现在就不用答应替萨米拿玉米，还得送到萨米指定的地方。其实，这点儿事情并不难办，他也不是不愿意干。真正叫他难受的，是萨米竟然能使唤他。
        - id: ch01-b02
          speaker: narrator
          text: 喋喋和萨米都很机灵。可喋喋一直觉得，自己的脑子才是最灵的。这回萨米占了上风，他越想越伤自尊。到了夜里，他蜷在老果园高处那间舒适的小窝里。那儿原是啄木鸟鼓手的家。喋喋怎么也丢不开这件事，只管想啊，想啊，翻来覆去地琢磨，怎么才能逃掉那个承诺。
        - id: ch01-b03
          speaker: narrator
          text: 就在快睡着的时候，他忽然想到一个办法。明早趁萨米还没醒，先去玉米仓吃饱，然后藏起来，叫萨米找不到。
        - id: ch01-b04
          speaker: chatterer
          text: 我怎么早没想到呢？到头来，还是我的脑子比萨米灵。
        - id: ch01-b05
          speaker: narrator
          text: 喋喋困得直嘟囔，一边想着，一边得意地笑了。
    - id: ch02
      title: 萨米迟迟没有出现
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天一大早，喋喋跑到玉米仓，匆匆吃了顿早饭，便躲进老石墙，等着看萨米来。可萨米没有像从前那样，按平常去玉米仓的时间准时出现。那还是喋喋狠狠吓唬他以前的事了。
        - id: ch02-b02
          speaker: narrator
          text: 喋喋等了又等，还是不见萨米。他越来越不耐烦，却怕萨米忽然赶到，不敢离开，只好躲在原处接着等。最后，他认定萨米早晨去了别处，这才从石墙里钻出来，沿着老果园边上的墙蹦蹦跳跳地跑开了。
        - id: ch02-b03
          speaker: narrator
          text: 玩了一会儿，喋喋就把萨米忘得干干净净。他想，萨米绝不会这么晚还去玉米仓，那实在太危险了。农夫布朗的儿子几乎准会看见他。想到这里，喋喋把烦恼全抛开，独自在四处蹦蹦跳跳，玩得痛快极了。
        - id: ch02-b04
          speaker: narrator
          text: 正玩到兴头上，萨米却来到了老果园。
        - id: ch02-b05
          speaker: sammy
          text: 早上好，喋喋。我来吃早饭，好像迟了一点儿。
        - id: ch02-b06
          speaker: chatterer
          text: 早饭？还早饭呢！这都快吃午饭了。我的早饭几个钟头前就吃完啦。
    - id: ch03
      title: 萨米来要玉米
      blocks:
        - id: ch03-b01
          speaker: sammy
          text: 我就猜到了。不过，我今早有点儿累。反正不用亲自跑那么远去玉米仓，我也不急。你已经在这儿给我备够玉米了吧？
        - id: ch03-b02
          speaker: narrator
          text: 萨米那双锐利的黑眼睛里，闪着顽皮的光。
        - id: ch03-b03
          speaker: chatterer
          text: 给你备玉米？想得美！你根本没说今天早上要我去拿。
        - id: ch03-b04
          speaker: sammy
          text: 我没说吗？那准是忘了。没关系，你现在跑一趟，替我拿一些回来吧。
        - id: ch03-b05
          speaker: chatterer
          text: 你自己去！
        - id: ch03-b06
          speaker: sammy
          text: 我还是不去了。农夫布朗的儿子就在玉米仓旁边劈柴，所以呢，我宁愿让你去。
        - id: ch03-b07
          speaker: chatterer
          text: 我不去！我就是不去！
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: 喋喋气得尖声大叫，还在原地又蹦又跳。
    - id: ch04
      title: 喋喋信守诺言
      blocks:
        - id: ch04-b01
          speaker: sammy
          text: 噢，那也行。今天早晨，我在绿森林看见黄鼠狼影子了。他还问起你呢。我看，我还是再去找找他吧。
        - id: ch04-b02
          speaker: narrator
          text: 萨米说着，还打了个哈欠。喋喋的脸一下子吓白了。天底下没有谁比黄鼠狼影子更叫他害怕。要是在影子和农夫布朗的儿子之间挑一个，他宁可去面对农夫布朗的儿子。
        - id: ch04-b03
          speaker: chatterer
          text: 我……我去。
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: 喋喋有气无力地结巴着。再也没有别的办法，他非得信守诺言不可。
