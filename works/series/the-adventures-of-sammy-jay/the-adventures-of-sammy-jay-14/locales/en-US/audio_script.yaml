audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently cautionary touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: eager, quick-witted, and determined
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
    reddy:
      display_name: Reddy Fox
      tts:
        delivery: sly, confident, and keenly watchful
        timbre: smooth and lightly raspy
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Reddy Fox Plays Spy
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Reddy Fox did not need to rise early to hide behind the fence at the back of Farmer Brown's corncrib. He was already there when jolly, round, red Mr. Sun began chasing the little stars out of the sky. The truth was, Reddy had never gone to bed.
        - id: ch01-b02
          speaker: narrator
          text: Reddy did many things he would not want anyone to see. That was why he did them at night, while most of the little people of the Green Meadows and the Green Forest were asleep. He often stayed awake all night and slept through the day, when honest folk were out and about.
        - id: ch01-b03
          speaker: narrator
          text: He had wandered around all night. Now he had come to see what was happening at Farmer Brown's corncrib. Most of all, he wanted to know if Farmer Brown's boy had set a trap for Sammy Jay, just as Sammy was so sure he had.
        - id: ch01-b04
          speaker: narrator
          text: The little stars had just vanished, and Mr. Sun's first faint light was beginning to drive away the dark shadows. Then Reddy's sharp eyes caught something moving near the corner of the old stone wall at the edge of the Old Orchard.
        - id: ch01-b05
          speaker: narrator
          text: A small, dark shape scampered across the road. Reddy heard tiny, sharp claws scratching up the tree beside the corncrib. He grinned and kept his eyes on the treetop. A moment later, the same little shape ran along a branch hanging over the corncrib and sprang lightly onto the roof.
        - id: ch01-b06
          speaker: narrator
          text: It hurried along the edge of the roof, then disappeared all at once. Reddy knew there must be a hole there. He stood and stretched.
        - id: ch01-b07
          speaker: reddy
          text: Just what I thought. Yes, just what I thought.
        - id: ch01-b08
          speaker: narrator
          text: Then Reddy settled down to watch again. After a while, the lively little shape popped back out. By now there was enough light for him to see Chatterer's red coat.
        - id: ch01-b09
          speaker: narrator
          text: Chatterer's cheeks were packed so full of corn that his head looked twice its usual size. He ran across the roof to the place where the tips of the tree branch brushed against it, then climbed into the tree. Before coming down, he looked carefully around to make sure no one was nearby, especially Black Pussy.
        - id: ch01-b10
          speaker: narrator
          text: Then Chatterer hurried down the tree, dashed across the road, and reached the safety of the old stone wall.
        - id: ch01-b11
          speaker: reddy
          text: Ha! I knew it! Unless I am very, very wrong, Chatterer can tell Sammy Jay what grabbed his bill yesterday morning and nearly scared him to death. I kept wondering why Chatterer stopped visiting that new storehouse he worked so hard to fill near the cornfield. Now I know.
        - id: ch01-b12
          speaker: reddy
          text: My, how fat Chatterer is getting! One of these mornings, he will make me a fine breakfast!
        - id: ch01-b13
          speaker: narrator
          text: Reddy licked his lips as though he could already taste that fat Red Squirrel. Then he slipped away in the other direction. The morning was growing brighter, and he no longer dared stay so close to Farmer Brown's house and Bowser the Hound.
        - id: ch01-b14
          speaker: narrator
          text: Reddy grinned all the way to the Green Forest. Part of that grin came from thinking about the clever trick he was sure Chatterer had played on Sammy Jay. The rest came from thinking about the fine breakfast he expected to have one morning soon. He had already worked out a plan for catching Chatterer.
        - id: ch01-b15
          speaker: narrator
          text: Before trying his plan, Reddy meant to find Sammy Jay. He wanted to watch Sammy discover how foolish he had been. After all, the thing that frightened him was not a trap set by Farmer Brown's boy.
