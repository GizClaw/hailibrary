audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲故事口吻
        timbre: 温暖清亮
        pace: 从容舒展
        pitch: 中音
    reddy:
      display_name: 狐狸雷迪
      tts:
        delivery: 机灵圆滑，表面一本正经，暗中带着笑意
        timbre: 柔和而略显狡黠
        pace: 从容灵活
        pitch: 中低音
  chapters:
    - id: ch01
      title: 雷迪一夜没睡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 清晨，圆滚滚、红彤彤的太阳公公把小星星赶走时，狐狸雷迪已经藏在农夫布朗家玉米仓后面的篱笆旁了。他倒不用早起，因为他这一夜根本没睡。
        - id: ch01-b02
          speaker: narrator
          text: 雷迪常做些不愿让别人看见的事，总爱等绿草地和绿森林里的小居民睡着以后再行动。所以，他常常夜里四处游荡，白天等那些正派人都出门了，自己反倒躲起来睡觉。
        - id: ch01-b03
          speaker: narrator
          text: 这一夜，他到处转了个够，最后来到玉米仓旁。他想看清这里有什么动静，也要弄明白农夫布朗家的男孩是不是真像萨米说的那样，在这里给他设了圈套。
    - id: ch02
      title: 仓顶的小身影
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小星星才隐去，太阳公公的第一缕微光刚开始赶走黑影，雷迪就看见老果园边上的旧石墙墙角有什么动了一下。一个黑乎乎的小身影飞快蹿过大路，紧接着，玉米仓旁的树上传来了尖爪子的抓挠声。
        - id: ch02-b02
          speaker: narrator
          text: 雷迪咧嘴笑着，紧盯树顶。那个小身影很快沿着伸到玉米仓上方的树枝跑出来，轻巧地跳上仓顶。它顺着边沿跑了一段，忽然不见了。雷迪马上猜到，那里一定有个洞。他站起来伸了个懒腰。
        - id: ch02-b03
          speaker: reddy
          text: 果然不出我所料。果然不出我所料。
        - id: ch02-b04
          speaker: narrator
          text: 雷迪又趴下继续等。过了一会儿，那个活泼的小身影猛地钻了出来。天已经亮得足以看清了，那身红毛正是红松鼠喋喋。
    - id: ch03
      title: 喋喋的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 喋喋的两颊塞满玉米，鼓得脑袋看起来大了一倍。他沿仓顶跑到树梢擦过屋顶的地方，爬回树上，警觉地看了看四周。他尤其要确定黑猫咪不在附近。看清没人以后，他才爬下树，急匆匆穿过大路，躲进旧石墙里。
        - id: ch03-b02
          speaker: reddy
          text: 哈，我就知道！除非我错得实在太离谱，喋喋一定知道昨天早晨是什么抓住萨米的嘴，差点把他吓死。
        - id: ch03-b03
          speaker: reddy
          text: 我一直想不明白，喋喋辛辛苦苦装满了玉米地边的那座新粮仓，怎么忽然不去了。现在我全明白啦！
        - id: ch03-b04
          speaker: reddy
          text: 哟，喋喋可真是越来越肥了。拿他做我的早餐，再合适不过。没错，准是这样！
        - id: ch03-b05
          speaker: narrator
          text: 雷迪舔舔嘴唇，仿佛已经尝到了肥松鼠的滋味。天越来越亮，他不敢再待在农夫布朗家和猎狗鲍泽附近，便转身朝另一个方向悄悄溜走了。
    - id: ch04
      title: 雷迪还有一个计划
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 回绿森林的一路上，雷迪始终咧着嘴。一想到喋喋使了个巧妙的花招，把冠蓝鸦萨米捉弄了一番，他就想笑。
        - id: ch04-b02
          speaker: narrator
          text: 他还想到了另一件得意的事。总有一天早晨，他会吃上一顿美味的早餐，因为他已经有办法捉住喋喋了。
        - id: ch04-b03
          speaker: narrator
          text: 不过在那以前，雷迪要先找到冠蓝鸦萨米。他很想看看，等萨米知道吓坏自己的根本不是农夫布朗家的男孩设下的圈套时，脸上的样子究竟会有多傻。
