schema_version: 1
required: true
sources:
  - url: "https://whc.unesco.org/en/list/1443"
    authority: UNESCO World Heritage Centre
    claims:
      - "The Grand Canal is a vast waterway system from Beijing to Zhejiang, built in sections from the fifth century BCE and unified in the Sui dynasty."
      - By the thirteenth century its artificial waterways exceeded 2000 km and linked five major river basins.
      - Historically it carried grain and strategic raw materials and remains in use as an important inland transport route.
  - url: "https://www.publications.usace.army.mil/Portals/76/Publications/EngineerPamphlets/EP_870-1-20.pdf"
    authority: U.S. Army Corps of Engineers
    claims:
      - A navigation lock raises or lowers a vessel by closing gates and filling or emptying the chamber until its water matches the destination level.
      - Ordinary gravity-fed lock operation lets water seek its own level and does not require pumps.
  - url: "https://www.publications.usace.army.mil/Portals/76/Publications/EngineerManuals/EM%201110-2-2610_FINAL_18Mar2025.pdf"
    authority: U.S. Army Corps of Engineers
    claims:
      - "In a conventional navigation lock, filling transfers water by gravity from the upper reach until chamber and upper reach are level."
      - Emptying transfers chamber water by gravity toward the downstream reach until the levels match.
  - url: "https://www.mot.gov.cn/xinwen/tupianxinwen/202512/t20251226_4191099.html"
    authority: Ministry of Transport of the People's Republic of China
    claims:
      - Modern freight on the Huai'an section of the Beijing-Hangzhou Grand Canal includes coal and construction materials.
      - The Huai'an waterway and locks continue to handle heavy commercial traffic.
  - url: "https://www.jsrd.gov.cn/qwfb/sjfg/200812/t20081231_1221044.shtml"
    authority: Standing Committee of the Jiangsu Provincial People's Congress
    claims:
      - "Vessels using Jiangsu locks are dispatched and must report dimensions, tonnage, and cargo type."
      - "Anchoring, unauthorized lingering, and forcing entry are prohibited in lock chambers and approaches."
  - url: "https://www.gongshu.gov.cn/art/2024/4/30/art_1229789753_59080389.html"
    authority: "Grand Canal Culture Research Institute of Gongshu District, Hangzhou"
    claims:
      - Gongchen Bridge crosses the Beijing-Hangzhou Grand Canal in Hangzhou and is a three-arch stone bridge and a landmark at the canal's southern end.
      - The present bridge is associated with successive rebuilding and the 1885 reconstruction; the story does not assign the fictional voyage to an invented historic bridge.
notes: >
  The child, aunt, cargo vessel, route timing, loose tarpaulin incident, crew actions, and conversations
  are fictional. The voyage runs north from Hangzhou through the Jiangnan Canal toward Jiangsu rather
  than claiming to cover the canal's full Beijing-to-Zhejiang length. The stone bridges and waterside
  towns are composite scenes grounded in the canal landscape; no invented bridge is assigned a false
  historic date. Lock operation is simplified but follows the cited physical principle and safety rules.
