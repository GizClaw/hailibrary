"audio_script":
  "language": "zh-CN"
  "cast":
    "narrator":
      "display_name": "旁白"
      "tts":
        "delivery": "开阔沉稳，兼有旅行见闻的鲜活感"
        "timbre": "温暖清晰的中性声线"
        "pace": "从容"
        "pitch": "中音"
    "child":
      "display_name": "林舟"
      "tts":
        "delivery": "好胜好奇，逐渐变得踏实"
        "timbre": "清亮少年声"
        "pace": "自然偏快"
        "pitch": "中高音"
    "aunt":
      "display_name": "林岚"
      "tts":
        "delivery": "干练克制，关心藏在规矩里"
        "timbre": "沉稳成年女声"
        "pace": "利落"
        "pitch": "中低音"
    "deckhand":
      "display_name": "老周"
      "tts":
        "delivery": "朴实爽直，提醒中带幽默"
        "timbre": "厚实成年男声"
        "pace": "自然"
        "pitch": "中低音"
    "vendor":
      "display_name": "卖面大娘"
      "tts":
        "delivery": "爽朗通透，带生活气"
        "timbre": "温暖年长女声"
        "pace": "自然"
        "pitch": "中音"
  "chapters":
    - "id": "ch01"
      "title": "桥洞后的天光"
      "blocks":
        - "id": "ch01-b01"
          "speaker": "narrator"
          "text": "船离开杭州码头时，林舟把手机举过头顶，想把拱宸桥完整地装进屏幕。桥洞却总被青禾号的驾驶篷切掉一角。"
        - "id": "ch01-b02"
          "speaker": "child"
          "text": "往后退一点。"
        - "id": "ch01-b03"
          "speaker": "narrator"
          "text": "他冲姑姑喊。"
        - "id": "ch01-b04"
          "speaker": "aunt"
          "text": "船不是给你取景的。"
        - "id": "ch01-b05"
          "speaker": "narrator"
          "text": "林岚一手搭着舵，眼睛盯着前方水面，"
        - "id": "ch01-b06"
          "speaker": "aunt"
          "text": "黄线以内。退一步就踩到缆绳。"
        - "id": "ch01-b07"
          "speaker": "narrator"
          "text": "林舟低头，鞋跟果然贴着盘成蛇一样的粗绳。他赶紧挪开。岸上的人举着早点，电动车铃和船笛搅在一起。旧桥的石拱从头顶滑过去，水声忽然变得空阔，随后桥后的天光一下子铺满甲板。\n这是他第一次跟姑姑跑货船。出发前，他在地图上画了一条从杭州直指北京的蓝线，准备每天拍一段视频，题目已经想好：《一条河穿过半个中国》。林岚看过，只问："
        - "id": "ch01-b08"
          "speaker": "aunt"
          "text": "几天假？"
        - "id": "ch01-b09"
          "speaker": "child"
          "text": "十二天。"
        - "id": "ch01-b10"
          "speaker": "aunt"
          "text": "那你只能穿过地图上的一小截。"
        - "id": "ch01-b11"
          "speaker": "narrator"
          "text": "青禾号装的是袋装建材，北上到江苏交货。船尾柴油机发出沉稳的震动，杯里的茶一直起细纹。运河并不总像林舟想象中那样古老幽静。沿岸有仓库、吊机、修船厂和高架桥；驳船擦肩时，船身推来的浪让青禾号侧过去，又慢慢扶正。偶尔，一座石桥从现代楼房之间拱起，桥脚被来往的水磨得发黑。"
        - "id": "ch01-b12"
          "speaker": "child"
          "text": "以前船上都装什么？"
        - "id": "ch01-b13"
          "speaker": "narrator"
          "text": "林舟把镜头对着姑姑。\n林岚偏头躲开："
        - "id": "ch01-b14"
          "speaker": "aunt"
          "text": "关了。驾驶时不拍我。"
        - "id": "ch01-b15"
          "speaker": "narrator"
          "text": "午饭后，她才把一只旧木升斗从柜底拿出来。斗角磨得圆滑，是祖父留下的。"
        - "id": "ch01-b16"
          "speaker": "aunt"
          "text": "大运河很早就是一段段水道。隋代把它们连成贯通南北的交通系统，后来历代又修。很长时间，漕粮和别的物资靠它运。不是每一袋粮都从杭州一路到北京，也不是两千多年一条河原样不动。"
        - "id": "ch01-b17"
          "speaker": "narrator"
          "text": "林舟本想要一句适合视频开头的话，姑姑却说得都是不是。他把手机扣在桌上，摸了摸木斗内壁。细小的米糠似乎还藏在木纹里，当然那只是他的想象。\n傍晚靠泊时，林岚递给他一本防水封皮的记录册："
        - "id": "ch01-b18"
          "speaker": "aunt"
          "text": "明天过闸，你负责抄水尺读数和调度时间。"
        - "id": "ch01-b19"
          "speaker": "child"
          "text": "我拍船闸就行。"
        - "id": "ch01-b20"
          "speaker": "aunt"
          "text": "你是来跟船，还是来站在船上拍？"
        - "id": "ch01-b21"
          "speaker": "narrator"
          "text": "林舟把记录册夹到胳膊下，没有回答。"
    - "id": "ch02"
      "title": "水面齐平以前"
      "blocks":
        - "id": "ch02-b01"
          "speaker": "narrator"
          "text": "第二天，前方的船在引航道里排成缓慢移动的一列。无线电不时传来呼号和调度指令。林岚报了船的尺度、吨位和货种，按次序等候。林舟看见旁边一条运煤船的舱口蒙着黑篷，另一条船装着石料，船头蹲着一只黄狗。"
        - "id": "ch02-b02"
          "speaker": "child"
          "text": "这么宽的水，为什么不能先过去？"
        - "id": "ch02-b03"
          "speaker": "aunt"
          "text": "闸室不是街口。抢进去，门也不会给你单独开。"
        - "id": "ch02-b04"
          "speaker": "narrator"
          "text": "轮到青禾号时，两扇闸门已经打开。船缓慢驶入高墙之间，缆绳套上系缆柱。闸门在身后合拢，发动机声被混凝土墙反回来。林舟抬头看，墙上的湿痕高过驾驶篷，心里忽然发紧。\n进水口开启后，褐绿色的水在船边翻动。青禾号没有长出翅膀，却和漂在水面的叶子一起升高。林舟盯着水尺，念出读数，手里的笔随着船身摇晃，在纸上划出一条长尾巴。"
        - "id": "ch02-b05"
          "speaker": "child"
          "text": "门怎么还不开？"
        - "id": "ch02-b06"
          "speaker": "aunt"
          "text": "两边水面还没平。水压顶着，开不了。"
        - "id": "ch02-b07"
          "speaker": "narrator"
          "text": "林岚示意他看前方闸门缝里的水线，"
        - "id": "ch02-b08"
          "speaker": "aunt"
          "text": "闸室继续进水，等里面和上游一样高。"
        - "id": "ch02-b09"
          "speaker": "narrator"
          "text": "几分钟后，水声变小，门终于打开。刚才高悬在头顶的上游水面已经和他们连成一片。林舟回头时，身后的船正落在低处等待，像停在一级巨大的水台阶下。\n他忘了录像。"
    - "id": "ch03"
      "title": "暴雨前的工具箱"
      "blocks":
        - "id": "ch03-b01"
          "speaker": "narrator"
          "text": "第三天下午，天闷得发黄。林岚看过天气信息，让船员重新检查舱盖和篷布。林舟正剪视频，听见姑姑叫他把船尾一只蓝色工具箱搬进篷里。他嘴上答应，手指却还在拖动进度条。等字幕对齐，他抬头时，风已经把岸边杨树吹成同一个方向。\n第一阵雨点又大又稀，砸在铁甲板上像撒豆子。林舟冲到船尾，工具箱还在原地，旁边一段篷布的系带不知什么时候松了。风钻进去，整张篷布猛地鼓起，抽打舱沿。"
        - "id": "ch03-b02"
          "speaker": "aunt"
          "text": "别抓！"
        - "id": "ch03-b03"
          "speaker": "narrator"
          "text": "林岚从驾驶篷里喊，"
        - "id": "ch03-b04"
          "speaker": "aunt"
          "text": "回黄线内！"
        - "id": "ch03-b05"
          "speaker": "narrator"
          "text": "可工具箱已经滑向排水口。林舟下意识跨了一步，篷布的绳头从他面前甩过，啪地打在栏杆上。他僵住了。\n林岚减速稳舵，船员老周扣好救生衣，从有护栏的一侧低身过去，用带钩长杆先勾住工具箱，再把松绳压到甲板。林舟只能站在安全区里递来备用绳。他的手一直抖，绳结打了两次才打紧。\n雨过去得很快。篷布上积的水一股股流进运河。林岚检查完货舱，才走到他面前。"
        - "id": "ch03-b06"
          "speaker": "child"
          "text": "我听见了。"
        - "id": "ch03-b07"
          "speaker": "narrator"
          "text": "林舟说。"
        - "id": "ch03-b08"
          "speaker": "aunt"
          "text": "听见什么？"
        - "id": "ch03-b09"
          "speaker": "child"
          "text": "你让我搬箱子。"
        - "id": "ch03-b10"
          "speaker": "aunt"
          "text": "那为什么没搬？"
        - "id": "ch03-b11"
          "speaker": "narrator"
          "text": "他手机里的视频还停在拱宸桥那一帧。林舟把屏幕按灭："
        - "id": "ch03-b12"
          "speaker": "child"
          "text": "我想先剪完。"
        - "id": "ch03-b13"
          "speaker": "narrator"
          "text": "林岚看了他一会儿，没有骂。"
        - "id": "ch03-b14"
          "speaker": "aunt"
          "text": "那根绳要是缠住脚，水不会等你剪完。以后甲板上的事，答应了就做；不会做，就说不会。"
        - "id": "ch03-b15"
          "speaker": "narrator"
          "text": "老周把湿透的手套拧出水，插了一句："
        - "id": "ch03-b16"
          "speaker": "deckhand"
          "text": "还有，别人喊别抓，就别拿勇敢吓人。"
        - "id": "ch03-b17"
          "speaker": "narrator"
          "text": "林舟脸热得比暴雨前还厉害。他把没拍完的视频删掉，随后又从最近删除里恢复。删掉太像是躲。他新建了一段没有配乐的旁白，录了三次都觉得像检讨书，最后只留下雨后甲板上的水、重新绑好的绳结，以及自己那句："
        - "id": "ch03-b18"
          "speaker": "child"
          "text": "这个箱子本来该在雨前搬进去。"
    - "id": "ch04"
      "title": "先做记录"
      "blocks":
        - "id": "ch04-b01"
          "speaker": "narrator"
          "text": "到江苏后，河面更忙。清晨的雾里，货船的灯一盏盏向前移动；码头吊臂把煤炭、建材和集装货物从水边接走。林舟开始先做记录，再拿手机。他抄下靠离泊时间，核对缆绳，听无线电里船名一个个被叫到。姑姑不在时，他不碰驾驶台；老周上甲板时，他主动站到能看见对方的位置。\n在一座老桥附近临时停靠，岸边卖面的大娘把碗端到船上。她说小时候河窄，来往木船多，如今航道修整过，大船多了，水边的日子也换了样。林舟问她古运河是不是快被新船弄没了。\n大娘用筷子敲了敲碗边："
        - "id": "ch04-b02"
          "speaker": "vendor"
          "text": "你脚下的不就是运河？旧桥是真的，新吊机也是真的。面再不吃就坨了。"
        - "id": "ch04-b03"
          "speaker": "narrator"
          "text": "林舟低头吃面。热气扑在脸上，船身被过船的水波轻轻推着。他翻出那张地图，看见自己画的蓝线细得没有宽度，便用沾着汤汽的手指把它擦花了一小块。"
    - "id": "ch05"
      "title": "北去的水尺"
      "blocks":
        - "id": "ch05-b01"
          "speaker": "narrator"
          "text": "交货那天，吊机开始卸舱。林舟拿旧木斗在空舱边拍了一张照片，没有说它装过哪一批粮，也没有给它编一个年代。返航前，林岚把防水记录册递给他。"
        - "id": "ch05-b02"
          "speaker": "aunt"
          "text": "最后一项。"
        - "id": "ch05-b03"
          "speaker": "narrator"
          "text": "林舟在航次记录末尾写下交货时间，又翻到前面。过闸水尺那一笔拖得很长，雨天那页有几处被水洇开。他没有撕掉。\n青禾号掉头向南。经过船闸时，林舟把手机放在口袋里，站在黄线内报读数。水从阀门进入闸室，船和墙上的旧水痕一同缓缓接近。前方闸门还没有开，他便等着，直到两边的水面真正齐平。"
