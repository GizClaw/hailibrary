  "chapters":
    - "id": "ch01"
      "title": "A Smaller Map"
      "blocks":
        - "id": "ch01-b01"
          "speaker": "narrator"
          "text": "Daniel boarded the River Lark with a camera, a new rain jacket, and the private belief that steering a cargo boat could not be much harder than steering the simulator at the maritime museum.\nHis aunt May looked at his white sneakers. "
        - "id": "ch01-b02"
          "speaker": "aunt"
          "text": "First job: change those."
        - "id": "ch01-b03"
          "speaker": "child"
          "text": "We haven't left Hangzhou."
        - "id": "ch01-b04"
          "speaker": "aunt"
          "text": "The deck is already slippery."
        - "id": "ch01-b05"
          "speaker": "narrator"
          "text": "By the time he came back in work shoes, the lines were aboard. The River Lark moved north beneath the stone arch of Gongchen Bridge. Morning vendors called from the bank. Apartment towers rose beyond old roofs, and the diesel engine sent a steady tremor through Daniel's soles.\nHe lifted his camera."
        - "id": "ch01-b06"
          "speaker": "aunt"
          "text": "Outside the wheelhouse,"
        - "id": "ch01-b07"
          "speaker": "narrator"
          "text": " Aunt May said."
        - "id": "ch01-b08"
          "speaker": "child"
          "text": "I can film through the window."
        - "id": "ch01-b09"
          "speaker": "aunt"
          "text": "You can block my view through the window."
        - "id": "ch01-b10"
          "speaker": "narrator"
          "text": "Daniel retreated to the marked passenger area and filmed the bridge growing smaller. He planned a twelve-day documentary called The Whole Grand Canal. At lunch, Aunt May studied the title on his screen."
        - "id": "ch01-b11"
          "speaker": "aunt"
          "text": "We're delivering bagged construction material in Jiangsu and coming back. Beijing is far beyond our voyage."
        - "id": "ch01-b12"
          "speaker": "child"
          "text": "The title means the big idea."
        - "id": "ch01-b13"
          "speaker": "aunt"
          "text": "Then your big idea needs a smaller map."
        - "id": "ch01-b14"
          "speaker": "narrator"
          "text": "She spread a chart over the table. The Grand Canal was not one timeless ditch. Sections had been built from as early as the fifth century BCE, joined into a great imperial transport system in the Sui dynasty, and altered many times afterward. By the thirteenth century, more than two thousand kilometers of artificial waterways linked five major river basins. Grain and strategic materials had traveled along it. Modern freight still did.\nDaniel began recording her explanation.\nAunt May covered the lens with one finger. "
        - "id": "ch01-b15"
          "speaker": "aunt"
          "text": "Ask before you record the crew."
        - "id": "ch01-b16"
          "speaker": "narrator"
          "text": "He stopped the camera. "
        - "id": "ch01-b17"
          "speaker": "child"
          "text": "Could you say the part about grain again?"
        - "id": "ch01-b18"
          "speaker": "aunt"
          "text": "No. Eat before the soup slides off the table."
        - "id": "ch01-b19"
          "speaker": "narrator"
          "text": "The canal carried them through a landscape Daniel had not expected. Warehouses and cranes stood beside willow banks. Barges passed with hatches covered against dust and rain. A stone bridge might appear between factories; a high rail line might cross above a row of tiled houses. Nothing stayed inside the categories he had prepared."
    - "id": "ch02"
      "title": "Crew Observations"
      "blocks":
        - "id": "ch02-b01"
          "speaker": "narrator"
          "text": "On the second day, Aunt May handed him the voyage log. "
        - "id": "ch02-b02"
          "speaker": "aunt"
          "text": "At the lock, write the dispatch time and water-gauge readings."
        - "id": "ch02-b03"
          "speaker": "child"
          "text": "Can't the computer save them?"
        - "id": "ch02-b04"
          "speaker": "aunt"
          "text": "It does. You will record what we observe."
        - "id": "ch02-b05"
          "speaker": "narrator"
          "text": "Traffic thickened near the approach. Boats waited in assigned order: coal under black covers, stone, containers, construction supplies. Radio calls named vessels, dimensions, tonnage, and cargo. Daniel watched a small boat edge toward a gap."
        - "id": "ch02-b06"
          "speaker": "child"
          "text": "Why doesn't it go first?"
        - "id": "ch02-b07"
          "speaker": "aunt"
          "text": "Because the lock operator is dispatching the chamber. A narrow opening is not an invitation."
        - "id": "ch02-b08"
          "speaker": "narrator"
          "text": "When their turn came, the River Lark entered between towering concrete walls. Lines were made ready, gates closed behind them, and water churned beside the hull. Daniel glanced up from the gauge and felt the whole boat rising."
        - "id": "ch02-b09"
          "speaker": "child"
          "text": "Pumps?"
        - "id": "ch02-b10"
          "speaker": "narrator"
          "text": " he asked."
        - "id": "ch02-b11"
          "speaker": "aunt"
          "text": "Usually gravity. The chamber fills from the higher reach. To go down, it empties toward the lower reach."
        - "id": "ch02-b12"
          "speaker": "narrator"
          "text": "He watched the wet marks descend along the wall as their deck rose. The closed gate ahead seemed impossibly tall."
        - "id": "ch02-b13"
          "speaker": "child"
          "text": "Why can't it open now?"
        - "id": "ch02-b14"
          "speaker": "aunt"
          "text": "The water on the other side is still higher. Wait until the levels match."
        - "id": "ch02-b15"
          "speaker": "narrator"
          "text": "When they did, the gate opened without drama. Beyond it lay another stretch of canal, level with the water under their hull. Daniel forgot to film. In the log, his pencil mark ran crooked where the boat had shifted.\nThat evening he reviewed his footage. It showed bridges, wakes, noodle bowls, cranes, and thirty seconds of his own face describing how responsible a working crew had to be. He kept that clip at the front."
    - "id": "ch03"
      "title": "The Job Not Done"
      "blocks":
        - "id": "ch03-b01"
          "speaker": "narrator"
          "text": "The third afternoon was hot and windless. A weather alert appeared on the wheelhouse display. Aunt May told the crew to check the cargo covers."
        - "id": "ch03-b02"
          "speaker": "aunt"
          "text": "Daniel, put the blue tool case inside."
        - "id": "ch03-b03"
          "speaker": "narrator"
          "text": "He called, "
        - "id": "ch03-b04"
          "speaker": "child"
          "text": "Got it,"
        - "id": "ch03-b05"
          "speaker": "narrator"
          "text": " without looking up. He was trimming the lock sequence and wanted the gate to open exactly when the music changed.\nThe first gust struck the boat broadside. A loose corner of cargo cover snapped against the coaming. Daniel looked toward the stern. The tool case was still where Aunt May had pointed, sliding a few inches each time the boat rolled.\nHe ran for it."
        - "id": "ch03-b06"
          "speaker": "aunt"
          "text": "Stay inside the line!"
        - "id": "ch03-b07"
          "speaker": "narrator"
          "text": " Aunt May shouted.\nThe cover ballooned. Its loose rope whipped across the deck and cracked against the rail. Daniel stopped with one foot beyond the yellow safety line. Rain burst over him.\nAunt May reduced speed and held the boat steady. Mr. Wu, the deckhand, clipped on his flotation vest and approached from the protected side. He used a boat hook to drag the case away from the scupper, then pinned the cover rope until he could secure it. Daniel stood where he had been told and passed him a spare line. His fingers shook so badly that Mr. Wu had to ask for the bitter end twice.\nTen minutes later, the squall was gone. Water streamed from the cover. Aunt May checked the cargo before she spoke to Daniel."
        - "id": "ch03-b08"
          "speaker": "aunt"
          "text": "Did you hear my first instruction?"
        - "id": "ch03-b09"
          "speaker": "child"
          "text": "Yes."
        - "id": "ch03-b10"
          "speaker": "aunt"
          "text": "Why was the case outside?"
        - "id": "ch03-b11"
          "speaker": "narrator"
          "text": "He could have blamed the weather, the loose rope, or the person who had last used the case. His camera was still playing triumphant music in the sheltered cabin."
        - "id": "ch03-b12"
          "speaker": "child"
          "text": "I wanted to finish the edit."
        - "id": "ch03-b13"
          "speaker": "aunt"
          "text": "When you answer on a working boat, I plan as if the job is done. If you can't do it, say so. If you don't understand, ask."
        - "id": "ch03-b14"
          "speaker": "narrator"
          "text": "Mr. Wu peeled off his wet gloves. "
        - "id": "ch03-b15"
          "speaker": "deckhand"
          "text": "And when the captain says stay back, don't make us rescue your good intentions."
        - "id": "ch03-b16"
          "speaker": "narrator"
          "text": "Daniel expected to be sent below for the rest of the trip. Instead, Aunt May gave him a towel and told him to enter the weather delay in the log.\nHe deleted the opening clip about responsibility. Then he restored it from the trash. Hiding it felt too easy. He placed the storm footage after it—the loose cover, the secured line, the tool case finally stowed—and recorded one plain sentence: "
        - "id": "ch03-b17"
          "speaker": "child"
          "text": "I said I had done a job that I had not done."
    - "id": "ch04"
      "title": "A Wider Canal"
      "blocks":
        - "id": "ch04-b01"
          "speaker": "narrator"
          "text": "In Jiangsu, freight traffic grew denser. Boats carrying coal and building material moved through the mist before sunrise. Lock calls came over the radio while riverside towns woke around them. Daniel began putting the camera away whenever the crew prepared lines. He checked times, repeated instructions, and asked before filming.\nAt a mooring near an old stone bridge, a woman delivered bowls of hot noodles to the crew. Daniel asked whether modern barges were destroying the old canal.\nShe blew steam from her tea. "
        - "id": "ch04-b02"
          "speaker": "vendor"
          "text": "Which canal do you mean? The bridge, the water, the port, or my brother's boat?"
        - "id": "ch04-b03"
          "speaker": "child"
          "text": "All of it."
        - "id": "ch04-b04"
          "speaker": "vendor"
          "text": "That answer is too large for cold noodles."
        - "id": "ch04-b05"
          "speaker": "narrator"
          "text": "She told him the bank had changed since her childhood, as had the boats and cargo. The old bridge still mattered. So did safe navigation and the families who worked the water now. A canal preserved only as a pretty view would not be the canal she knew.\nDaniel looked beyond her at a crane unloading pallets. An egret hunted in the reeds below it. On his phone, his first map was still a clean blue stroke from south to north. He zoomed in until the stroke widened and the names of towns appeared."
    - "id": "ch05"
      "title": "A Straight Line"
      "blocks":
        - "id": "ch05-b01"
          "speaker": "narrator"
          "text": "At the destination, the cargo was unloaded. Aunt May asked Daniel to verify the time before she signed the record. He checked the terminal clock, the wheelhouse display, and the log."
        - "id": "ch05-b02"
          "speaker": "child"
          "text": "Ready,"
        - "id": "ch05-b03"
          "speaker": "narrator"
          "text": " he said."
        - "id": "ch05-b04"
          "speaker": "aunt"
          "text": "Done, or ready to do it?"
        - "id": "ch05-b05"
          "speaker": "narrator"
          "text": "He caught her small smile. "
        - "id": "ch05-b06"
          "speaker": "child"
          "text": "Done."
        - "id": "ch05-b07"
          "speaker": "narrator"
          "text": "On the return trip, they entered a lock after sunset. Red and green signals shone on the water. Daniel left his camera in its case and read the gauge aloud. The chamber emptied, carrying the River Lark downward. At last the water inside matched the dark lower reach.\nThe gates began to part. Aunt May kept one hand on the controls and nodded toward the voyage log. Daniel wrote the reading on a straight line this time, in the place marked CREW OBSERVATIONS."
