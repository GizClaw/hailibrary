audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: wary and determined
        timbre: small and rough-edged
        pace: quick and tense
        pitch: medium-high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager and animated
        timbre: bright and youthful
        pace: quick
        pitch: high
    prickly_porky:
      display_name: Prickly Porky
      tts:
        delivery: gruff and plainspoken
        timbre: dry and bristly
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: XIV. Bobby Finds Out His Mistake
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: If a friend of yours makes a mistake and hasn't found it out yet, try not to be around when the truth finally dawns on him.
        - id: ch01-b02
          speaker: narrator
          text: Finding out that you've made a mistake is bad enough. It feels much worse when other people know about it. If it's too late to warn a friend, the kindest thing is to act as though you know nothing at all. So Peter Rabbit wasn't being very nice when he stayed right beside that old hollow log and watched. Bobby Coon had crawled inside for a nap.
        - id: ch01-b03
          speaker: narrator
          text: Before long, Peter's long ears picked up sounds inside the log. First came rattling and rustling. Then he heard grunts and squeaks, followed by growls and snarls. Those last sounds came from Bobby. He insisted that he was staying exactly where he was. He wouldn't move for anyone.
        - id: ch01-b04
          speaker: narrator
          text: Peter covered his mouth with one hand so he wouldn't laugh out loud. His eyes grew big and round as he stared at the opening in the end of the log. Peter knew that log, and he knew who lived there. That was what he had tried to tell Bobby. From inside, he heard Bobby declare once more that he wouldn't move.
        - id: ch01-b05
          speaker: bobby_coon
          text: I won't take one step. Not one! You can stay right where you are until I've finished my nap. If you come any closer, I'll—
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: Peter never heard the rest, if Bobby even finished it. A great rattling and rustling cut him off, along with a grunt that sounded angry and ready for business.
        - id: ch01-b07
          speaker: narrator
          text: Bobby growled and snarled again. He still claimed he wouldn't budge, but Peter noticed something. Bobby's voice was coming from closer to the open end of the log. Then came another grunt, followed by more rattling and rustling.
        - id: ch01-b08
          speaker: narrator
          text: At last, Bobby backed out of the old log. All the while, he kept growling, snarling, and saying he wouldn't move a step. The sight was too funny for Peter. He couldn't hold his laughter in any longer, and he burst out laughing.
        - id: ch01-b09
          speaker: narrator
          text: Then Prickly Porky's black nose appeared, followed by his little dull eyes. A tiny spark of anger shone in each one, making them look brighter than usual. There was no doubt about it. Prickly Porky was annoyed.
        - id: ch01-b10
          speaker: narrator
          text: The moment Porky was outside, he raised the thousand little spears hidden in his coat. Then he made a quick rush at Bobby Coon.
        - id: ch01-b11
          speaker: narrator
          text: Bobby turned and ran. One look at those sharp little spears was enough for him. He was afraid of them, just as everyone was, even big Buster Bear.
        - id: ch01-b12
          speaker: narrator
          text: Now the strange sounds made sense. Those little spears had brushed against the inside of the old log, making all the rattling and rustling Peter had heard.
        - id: ch01-b13
          speaker: prickly_porky
          text: The nerve of that Coon! He walks into my house and goes to sleep without even asking. Then he tells me I can't come out until he says so. What nerve!
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: Prickly Porky grunted as the thousand little spears in his coat rattled.
        - id: ch01-b15
          speaker: narrator
          text: Bobby Coon understood his great mistake at last. Before settling down for a nap, he should have found out whether anyone was already at home in that old log. He felt terribly embarrassed that he had been so careless. And knowing that Peter Rabbit had seen everything made him feel even worse.
