audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious and quick-witted
        timbre: bright and youthful
        pace: quick with thoughtful pauses
        pitch: medium-high
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: gruff and matter-of-fact
        timbre: deep and rumbling
        pace: slow and deliberate
        pitch: low
  chapters:
    - id: ch01
      title: XVI. Blacky the Crow Discovers Bobby
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit should have gone home to the dear Old Briar-patch long before this. He knew Mrs. Peter would be worrying. She always worried when Peter stayed away too long. But just then, Peter wasn't thinking much about her. In fact, I'm afraid he wasn't thinking about her at all.
        - id: ch01-b02
          speaker: narrator
          text: Peter was far too curious about Bobby Coon and what might happen to him. He did feel a little sorry for Bobby. Even so, it seemed like a great joke that someone as sleepy as Bobby couldn't manage to sleep. I'm afraid Peter rather enjoyed all the excitement.
        - id: ch01-b03
          speaker: narrator
          text: At last, Blacky and his friends grew tired of their noisy fun and went off about their business. Then Peter began to think it was time to return to the dear Old Briar-patch.
        - id: ch01-b04
          speaker: peter_rabbit
          text: Bobby ought to be able to sleep quietly now. I can't imagine what else could possibly disturb him. Poor Bobby. He certainly has had a hard time getting that nap.
        - id: ch01-b05
          speaker: narrator
          text: Still, Peter stayed nearby. He couldn't have said why, but he felt he might miss something if he left. And Peter could never forgive himself for missing anything worth seeing. So he lingered there long after Blacky and the other Crows had gone.
        - id: ch01-b06
          speaker: narrator
          text: Finally, Peter had almost decided to start for home when a little twig snapped. The sound startled him. He peeked from behind a big tree and stared toward the place it had come from. A moment later, he saw a large black shape.
        - id: ch01-b07
          speaker: peter_rabbit
          text: Buster Bear! I haven't seen him once this spring. My, how thin he looks!
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: Peter checked all around him. He wanted a clear path for a quick run, just in case he needed one. Then he held his breath while Buster came closer. Buster would take a few steps, stop to look and listen, and sniff the air. All at once, Peter understood what had brought him there.
        - id: ch01-b09
          speaker: peter_rabbit
          text: He must have heard those noisy Crows. Now he's come to find out what all the fuss was about.
        - id: ch01-b10
          speaker: narrator
          text: And that was exactly what had happened. Buster knew this was about where Blacky and his friends had made such a racket. His greedy little eyes searched everywhere for some sign of what they had been doing.
        - id: ch01-b11
          speaker: narrator
          text: But all he could find was one black feather at the foot of a tall old stump. The feather proved that Blacky and his friends had been there, but it gave Buster no clue why they had come. He sat up and blinked as he thought about it. Then he studied the old stump, and his eyes grew bright.
        - id: ch01-b12
          speaker: buster_bear
          text: I don't know what caused all that noise, and I suppose I never will. Still, I'm glad I came. That old stump looks rotten and hollow. I've found ant nests in plenty of old stumps like that, along with beetles and grubs. I'll find out what's inside this one.
        - id: ch01-b13
          speaker: narrator
          text: Buster walked up to the stump. He hooked his great claws into a crack and pulled with all his strength. Peter watched and held his breath with excitement.
        - id: ch01-b14
          speaker: narrator
          text: There came a sharp crack. The whole side of the old stump suddenly gave way, and Buster Bear tumbled over backward. At the very same moment, Bobby Coon rolled out of the stump. He was only half awake and frightened almost out of his wits.
        - id: ch01-b15
          speaker: narrator
          text: It would have been hard to say which cousin was more surprised, Buster Bear or Bobby Coon.
