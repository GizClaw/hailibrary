  chapters:
    - id: ch01
      title: IX. Bobby Is Made Much Of
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            There's nothing like a stomach full
            To make the world seem brighter,
            To banish worry, drive out fear,
            And make the heart feel lighter.
        - id: ch01-b02
          speaker: narrator
          text: Farmer Brown's boy was playing doctor. He was doing his best to set Bobby Coon's broken leg so it could heal and be as good as ever. But poor Bobby had lost all hope, and nothing feels more dreadful than that. He lay there completely helpless because the boy had tied him so he couldn't move. Bobby didn't understand what any of it meant. If only he could have understood Farmer Brown's boy, things would have been very different. But he couldn't, so his mind stayed full of terrible fear.
        - id: ch01-b03
          speaker: narrator
          text: Once the broken leg was wrapped firmly in place, Farmer Brown's boy made Bobby a comfortable bed in a deep box. With that hurt leg, Bobby couldn't possibly climb out. The boy took off the bands that had held Bobby to the board while he worked, then gently placed him in the box. He went to the house and soon came back with more good things to eat than Bobby had seen since the cold weather began. He put them in the box and left Bobby alone.
        - id: ch01-b04
          speaker: narrator
          text: At first, Bobby decided he wouldn't eat even one crumb. He felt like a prisoner, and he would rather starve than live that way. But his stomach was empty, and all that good food smelled wonderful. Before he could help himself, he started to nibble. Soon his stomach was full. It was his first good meal in many weeks, for he had slept through most of the winter.
        - id: ch01-b05
          speaker: narrator
          text: Bobby grew sleepy at once. A full stomach will almost always do that. Besides, the fright and all those strange events had worn him out. He curled up, and before long he had forgotten every trouble. For days afterward, Bobby slept most of the time. He was simply finishing the long winter sleep he was used to. As it turned out, sleep was the best thing in the world for him. While he slept, he wasn't tempted to pull off the bandage, and his broken leg got just the chance it needed to mend.
        - id: ch01-b06
          speaker: narrator
          text: Every day, Farmer Brown's boy came to see Bobby, just as a good doctor should visit a patient. He carefully checked the bandaged leg to be sure everything was right. And every time he came, he carried a tasty treat in his pocket to tempt Bobby's appetite, as if Bobby's appetite needed any tempting! Bobby would wake long enough to eat the treat, then go right back to sleep as though he were all alone.
        - id: ch01-b07
          speaker: narrator
          text: As the weather warmed, Bobby stayed awake more and more. That gave him plenty of time to remember it all and think it over. He remembered how terribly frightened he had been when Farmer Brown's boy caught him and carried him to the barn. Bobby had felt that way only because he didn't truly know the boy then.
        - id: ch01-b08
          speaker: narrator
          text: Now everything was very, very different. Bobby had actually learned to recognize the sound of Farmer Brown's boy coming. When he heard those steps heading his way, he felt just as pleased as he once would have felt afraid. The boy was so good to Bobby and made such a fuss over him that I fear he was spoiling Bobby quite a bit.
        - id: ch01-b09
          speaker: narrator
          text: Kindness had pushed all the fear from Bobby's mind, and trust had taken its place. Give kindness a chance, and that is what it will do every time.
