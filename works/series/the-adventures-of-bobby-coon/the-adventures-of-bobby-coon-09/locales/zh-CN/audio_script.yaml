audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
    farmer_browns_boy:
      display_name: 布朗家的男孩
      tts:
        delivery: 朴实爽朗，发现新鲜事时充满好奇
        timbre: 明亮清脆的少年嗓音
        pace: 自然而轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 绝望中的博比
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 世上再没有什么比填饱肚子，更能叫天地显得明亮。肚子饱了，忧愁散了，恐惧也逃了，心里自然轻松欢畅。
        - id: ch01-b02
          speaker: narrator
          text: 布朗家的男孩正学着医生的样子，尽力替浣熊博比接好断腿，希望那条腿痊愈以后还能像从前一样。可怜的博比却完全绝望了。世上再没有什么比这种绝望更可怕。
        - id: ch01-b03
          speaker: narrator
          text: 博比躺在那里，一动也不能动。男孩已经把他牢牢缚住，可他根本不懂这一切是什么意思。要是他听得懂男孩的话，事情就完全不同了。偏偏他一句也听不懂，脑子里只剩下可怕的恐惧。
        - id: ch01-b04
          speaker: narrator
          text: 等断腿稳稳固定在原处，男孩找来一只深箱子，在里面铺了个舒服的窝。博比断着一条腿，绝不可能从里面爬出去。男孩解开把他缚在木板上的布带，又轻轻把他放进箱子。
        - id: ch01-b05
          speaker: narrator
          text: 随后，男孩回到屋里。过了一会儿，他带来一大堆好吃的。打从天气冷起来，博比就没见过这么多美味。男孩把食物放进箱子，然后让博比独自待着。
    - id: ch02
      title: 一顿饱饭和一场长觉
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一开始，博比打定主意，哪怕一丁点儿碎屑也不吃。他觉得自己成了囚徒，宁可饿死，也不愿被关着活下去。
        - id: ch02-b02
          speaker: narrator
          text: 可他的肚子空空如也，好吃的香味又一个劲儿往鼻子里钻。博比实在忍不住了，便一点一点啃起来。等他回过神，肚子早已填得饱饱的。这是几个星期以来，他吃到的第一顿好饭。你也知道，冬天的大半时间，他一直都在睡觉。
        - id: ch02-b03
          speaker: narrator
          text: 博比马上困了。肚子一饱，人往往就想睡觉。何况那场惊吓，还有那些陌生的遭遇，早把他折腾得筋疲力尽。他蜷起身子，没一会儿就忘掉了所有烦恼。
        - id: ch02-b04
          speaker: narrator
          text: 后来的许多天里，博比大部分时候都在睡。他不过是在睡完那场早已习惯的漫长冬眠。碰巧的是，这对他再好不过。睡着以后，他不会总想去扯断腿上的绷带，那条腿也就有了最需要的时间，可以安安稳稳地长好。
        - id: ch02-b05
          speaker: narrator
          text: 布朗家的男孩每天都来看博比，就像一位好医生每天都要探望病人。他会仔细瞧瞧缠着绷带的伤腿，确定一切都好好的。
        - id: ch02-b06
          speaker: narrator
          text: 男孩每次来，口袋里都揣着一样美味，说是要勾起博比的食欲。仿佛博比还需要人来勾似的！博比只会醒上一小会儿，吃掉带来的东西，然后又沉沉睡去，安然得像身边根本没有别人。
    - id: ch03
      title: 善意换来的信任
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 天气越来越暖，博比醒着的时候也越来越多。他有的是时间回想，也有的是时间琢磨。
        - id: ch03-b02
          speaker: narrator
          text: 他想起男孩捉住自己、把自己带到谷仓时，那份恐惧有多可怕。其实，他会吓成那样，全是因为当时根本不了解布朗家的男孩。
        - id: ch03-b03
          speaker: narrator
          text: 可现在，一切都不同了，真是大不相同。千真万确，博比已经能认出男孩的脚步声。过去听见那脚步朝自己走来，他准会害怕。如今再听见，他却高兴得不得了。
        - id: ch03-b04
          speaker: narrator
          text: 布朗家的男孩待博比实在太好，又把他宠得厉害。恐怕呀，他简直快要把博比宠坏了。
        - id: ch03-b05
          speaker: narrator
          text: 善意把博比心里的恐惧赶了出去，信任便在原来的地方住了下来。只要给善意一个机会，它每次都能做到。
