audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: wary and determined
        timbre: small and rough-edged
        pace: quick and tense
        pitch: medium-high
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: gruff and confident
        timbre: deep and rumbling
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: XIX. Bobby Coon Gets a Terrible Shaking
      blocks:
        - id: ch01-b01
          speaker: bobby_coon
          text: Leave me alone! I've never hurt you. Please, just leave me alone!
          emotion: fearful
        - id: ch01-b02
          speaker: narrator
          text: Bobby Coon whimpered as he climbed the tall tree. Buster Bear scrambled up behind him, growling all the way. For a minute or two, Bobby wished he had stayed on the ground. He had forgotten that Buster could climb just as well as he could. Now Bobby was up in the tree with Buster below him, and it looked as though he had trapped himself.
        - id: ch01-b03
          speaker: narrator
          text: Then Bobby remembered something. Buster was too big and heavy to follow him onto the little branches. Bobby's frightened eyes darted around, searching for a way out. One branch stretched almost to the top of a slender young tree nearby. If Bobby could reach that tree, perhaps he could climb down and run for his life. He could not be sure it would work, but it was worth a try.
        - id: ch01-b04
          speaker: narrator
          text: Bobby crept as far out on the branch as he could. Then, with his heart in his mouth, he leaped for the young tree. He made it and caught one of its branches. At once, he turned to see what Buster Bear was doing.
        - id: ch01-b05
          speaker: narrator
          text: Buster Bear was quick to understand. As soon as Bobby started along that branch, Buster knew exactly what Bobby meant to do.
        - id: ch01-b06
          speaker: buster_bear
          text: Huh! If he thinks that old trick will catch me napping, he'd better think again.
        - id: ch01-b07
          speaker: narrator
          text: Buster waited just long enough to be sure Bobby would jump into the other tree. Then he hurried down much faster than he had climbed up. For the last half of the way, he simply dropped. By the time Bobby was halfway down the slender tree, Buster was already waiting at the bottom for him.
        - id: ch01-b08
          speaker: narrator
          text: Poor Bobby! At first, he thought he was no better off. No other nearby tree was close enough for him to reach. All Buster had to do was climb up and catch him. Bobby was almost ready to give up in despair.
        - id: ch01-b09
          speaker: narrator
          text: But Buster did not climb. He did not even try. He stood at the foot of the tree and growled. Each growl sent a frightened shiver through Bobby. Why didn't Buster come up and get him? In a flash, Bobby understood. Buster wasn't climbing because he couldn't. The tree was too small. Buster was so big that he needed a good-sized trunk to wrap his arms around. Bobby began to hope again.
        - id: ch01-b10
          speaker: narrator
          text: But Buster Bear did not give up. No, sir! Buster always tried everything he could think of first. He stood on his hind legs and took hold of the young tree as if he meant to climb it. For a moment, Bobby thought that was exactly what he would do. Then Buster began to shake the tree. My, my, my, how he shook it! He was trying to shake Bobby Coon down.
        - id: ch01-b11
          speaker: narrator
          text: The first shake took Bobby by surprise, and he nearly lost his grip. Once he understood Buster's plan, he held on for dear life. He clung with his arms, his legs, and his teeth. The tree swung back and forth, carrying Bobby with it. It was much worse than the strongest wind he had ever faced. Still, Bobby gripped the tree with his claws and teeth and kept telling himself the same thing.
        - id: ch01-b12
          speaker: bobby_coon
          text: I won't let go. I won't let go. I won't let go.
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: And he didn't.
