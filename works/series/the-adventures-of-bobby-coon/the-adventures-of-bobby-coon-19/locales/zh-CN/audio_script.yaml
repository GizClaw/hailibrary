audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
    buster_bear:
      display_name: 巴斯特熊
      tts:
        delivery: 憨直而警觉，饥饿时带着急切和粗声嘟囔
        timbre: 低沉浑厚
        pace: 稍慢，行动时加快
        pitch: 低
  chapters:
    - id: ch01
      title: 树上的险境
      blocks:
        - id: ch01-b01
          speaker: bobby
          text: 别来抓我！我从来没有害过你，别来抓我！
          emotion: fearful
        - id: ch01-b02
          speaker: narrator
          text: 浣熊博比一边呜咽，一边拼命往大树上爬。巴斯特熊就在后面紧追，爬一路，低吼一路。有那么一两分钟，博比真后悔自己没有留在地上。他竟然忘了，巴斯特爬树的本领一点儿也不比他差。
        - id: ch01-b03
          speaker: narrator
          text: 现在，博比已经上了树，巴斯特就在下边。怎么看，都像是他自己钻进了陷阱。
        - id: ch01-b04
          speaker: narrator
          text: 就在这时，博比忽然想起来，自己能爬到细枝上，巴斯特却不行。巴斯特的身子又大又重，那些细枝可承受不住。博比害怕极了，眼睛却因此看得格外快。他急忙向四周寻找出路。
        - id: ch01-b05
          speaker: narrator
          text: 一根树枝朝外伸出去，差不多碰到了附近一棵细瘦小树的树梢。只要跳到那棵小树上，博比也许就能下到地面，再逃命去。不管成不成，这个办法总值得试一试。
        - id: ch01-b06
          speaker: narrator
          text: 博比顺着那根树枝往外爬，一直爬到不能再往前。他心里七上八下，还是朝小树纵身跳了过去。这一跳很准，他抓住了小树的一根枝条。站稳以后，他赶紧回头去看巴斯特熊在做什么。
    - id: ch02
      title: 巴斯特抢先一步
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 巴斯特熊的脑筋可不慢。博比才沿着树枝往外爬，他就猜透了对方的打算。
        - id: ch02-b02
          speaker: buster_bear
          text: 哼！他以为用这种老把戏，就能趁我不留神溜掉吗？那他可想错了。
        - id: ch02-b03
          speaker: narrator
          text: 巴斯特只等到确定博比会跳向另一棵树，马上掉头往下爬。他下去的速度比上来时快多了，最后一半路程，索性直接往下落。
        - id: ch02-b04
          speaker: narrator
          text: 所以，等博比爬到那棵细树的一半，巴斯特已经守在树脚下等他了。可怜的博比起初以为，自己的处境并没有比刚才好。周围没有别的树够得着，巴斯特只要爬上来，就能抓住他。他绝望得几乎要放弃了。
        - id: ch02-b05
          speaker: narrator
          text: 然而，巴斯特没有往上爬，连试都没有试。他只是站在树下，一声接一声地低吼。每听见一声，博比都吓得浑身发抖。
        - id: ch02-b06
          speaker: narrator
          text: 博比不明白，巴斯特为什么不赶快上来抓他。突然间，他全想通了。巴斯特不是不想爬，而是根本爬不了！
        - id: ch02-b07
          speaker: narrator
          text: 原来，那棵小树实在太细。巴斯特身子那么大，非得有棵够粗的树，才能伸开双臂抱住树干。这一回，博比心里又有了希望。
    - id: ch03
      title: 紧紧抓住
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可巴斯特熊绝不会轻易认输。不，先生，只要还有什么办法想得到，他就非试个遍不可。
        - id: ch03-b02
          speaker: narrator
          text: 巴斯特直起身子，抱住了那棵小树，看起来仿佛真要往上爬。起先，博比也以为他打算爬上来。没过一会儿，他就发现自己猜错了。
        - id: ch03-b03
          speaker: narrator
          text: 巴斯特使劲摇起树来。天哪，天哪，天哪，他摇得可真厉害！他要把浣熊博比从树上摇下去。
        - id: ch03-b04
          speaker: narrator
          text: 第一下来得太突然，博比差一点儿就没抓住。等他明白巴斯特要干什么，立刻拼上性命抱紧树枝。他用胳膊抱，用腿夹，连牙齿也用上了。
        - id: ch03-b05
          speaker: narrator
          text: 小树来回摆荡，博比也跟着荡来荡去。这滋味比他经历过的最猛烈的狂风还要糟，而且糟得多。可是，他始终用爪子和牙齿死死抓住，怎么也不肯放开。
        - id: ch03-b06
          speaker: bobby
          text: 我不松手。我不松手。我不松手。
          emotion: fearful
        - id: ch03-b07
          speaker: narrator
          text: 博比一遍又一遍地这样告诉自己。他果真没有松手。
