cover_prompt: |-
  A wordless cover scene in a New England forest in the early twentieth century shows a plump raccoon with gray-brown fur, a black facial mask, and a boldly ringed tail peering from the high doorway of an old hollow chestnut tree. Below, a farmer in plain work clothes and a sturdy boy in a cap pause beside their axes as the great trunk begins to lean, while a brown hound watches from a safe distance. The raccoon braces his small paws against the hollow rim, making his startled search for escape the focal action without showing injury or panic. Bare late-winter branches, patches of melting snow, and the first hints of spring establish the woodland season and setting. Use a wide child-height view that clearly connects the animal above with the people below, with the leaning trunk forming a gentle diagonal through the composition. Leave broad calm room among the pale sky and upper branches at the top, and keep every figure natural, original, child-friendly, and independent of screen adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
