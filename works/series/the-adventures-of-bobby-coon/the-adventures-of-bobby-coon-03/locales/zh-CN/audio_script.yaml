audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
  chapters:
    - id: ch01
      title: 进退两难
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 可怜的博比呀！他如今明明白白地知道，自己是真的醒了，反倒后悔非要弄个清楚。起初，他还能安慰自己，这一切也许只是一场噩梦。现在连这点安慰也没有了。
        - id: ch01-b02
          speaker: narrator
          text: 可既然人是醒着的，那阵原本混在噩梦里的可怕敲击声也一定是真的。他再也骗不了自己了。那棵住了许多年的大空心栗树，他的家，此刻正碰上一件吓人的事。
        - id: ch01-b03
          speaker: narrator
          text: 重击一下紧接一下，快得数不清。博比试着去数，可根本跟不上。树身每抖一次，他也跟着哆嗦一次。外面到底在干什么？那阵响声又意味着什么？
        - id: ch01-b04
          speaker: narrator
          text: 他想爬到洞口看一眼，可就是不敢。他怕自己会撞见什么吓人的东西，怕看过以后比现在更加害怕。虽说照我看，博比已经怕得不能再怕了。
        - id: ch01-b05
          speaker: narrator
          text: 偏偏他又觉得，自己连一分钟也待不下去。真的，一分钟也熬不住。往上爬，他害怕。留在原地，他也害怕。还有什么处境能比这更难受呢？
    - id: ch02
      title: 大树摇晃起来
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 大树越抖越凶。没过多久，它不光发颤，还开始左右摇摆。博比察觉到自己的房子在晃，心一下子沉到了底。
        - id: ch02-b02
          speaker: narrator
          text: 一个新的念头赶走了别的恐惧。难道他的房子快要倒了吗？他不敢相信，心里却总觉得这是真的。这个念头牢牢占住他的脑袋，怎么也赶不走。
        - id: ch02-b03
          speaker: narrator
          text: 博比已经在这里住了好久好久，可从来没有过这种感觉。粗野的北风老兄一次次使足力气扑向大栗树，顶多也只能让树轻轻抖几下。
        - id: ch02-b04
          speaker: narrator
          text: 从前，博比总会舒舒服服地缩在暖暖的床上，笑话北风老兄。他压根儿没想过，真有什么东西能伤到这棵树。
        - id: ch02-b05
          speaker: narrator
          text: 可现在，他再也不能怀疑，事情的确发生了。每一记重击落下，那棵高大的老树都又颤又晃。博比终于忍不住了。不管外面是什么，他一定得弄清楚这阵响声究竟是怎么回事。
    - id: ch03
      title: 洞口下面的景象
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 博比的牙齿吓得咯咯作响。他还是一点点爬上洞口，探头朝下面看去。眼前的景象竟比刚才想象的还可怕。
        - id: ch03-b02
          speaker: narrator
          text: 他吓得爪子一松，一头跌回床上。好在床铺软绵绵的，他没有摔疼。才过了一会儿，他就又急急忙忙往洞口爬。
        - id: ch03-b03
          speaker: narrator
          text: 博比睁大惊恐的眼睛，再次朝树下望去，嘴里呜咽起来。
        - id: ch03-b04
          speaker: bobby
          text: 我该怎么办？我到底还能怎么办？我逃不掉，又不能留在这里。我能怎么办呀？到底怎么办？
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: 浣熊博比真的吓坏了，半点也不夸张。你猜，他究竟在树下看见了什么？
        - id: ch03-b06
          speaker: narrator
          text: 原来，树下站着农夫布朗和布朗家的男孩。他们挥动斧头，正在砍这棵大栗树。这棵树当了博比那么多年的家，如今却被一斧又一斧地砍着。
        - id: ch03-b07
          speaker: narrator
          text: 猎犬鲍泽也在旁边，眼睁睁地看着他们。
