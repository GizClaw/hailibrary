  chapters:
    - id: ch01
      title: III. Bobby's Dreadful Fright
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Poor, poor Bobby Coon. Now he knew he was truly awake, and he almost wished he had never tried to find out. It would have comforted him a little to hold on to his first thought that the whole thing might be a bad dream. But there was no room for doubt anymore. He was awake. The terrible pounding that had begun in his dream was real, and something awful was happening to his home, the big hollow chestnut tree where he had lived for so long.
        - id: ch01-b02
          speaker: narrator
          text: The blows came one after another, too fast for Bobby to count. Each one made the great tree tremble, and Bobby trembled right along with it. What did it mean? What could be happening outside? He wanted to climb up to his doorway and look out, but somehow he didn't dare. Whatever was down there might frighten him even more than the pounding already had.
        - id: ch01-b03
          speaker: narrator
          text: Yes, sir, Bobby was afraid to go to that doorway, though I don't know how he could have been any more frightened than he already was. Yet every moment he stayed below felt like one moment too many. No, sir, he couldn't bear it. He was too frightened to go and too frightened to stay. Now, can you think of anything worse than that?
        - id: ch01-b04
          speaker: narrator
          text: The tree trembled harder and harder. Then it began doing more than trembling. It started to sway a little from side to side. Bobby felt his heart sink. A new fear pushed every other thought away. Was his home about to fall? He could hardly believe such a thing might be true. Even so, the feeling stayed with him, and he couldn't get rid of it.
        - id: ch01-b05
          speaker: narrator
          text: Bobby had lived in that home for a long, long time, and never once had he felt anything like this. Many times, rough Brother North Wind had thrown all his strength against the big chestnut tree. Sometimes he managed to make it tremble just a little, but that was all. Bobby would lie curled up in his cozy bed and laugh at him. The old tree had always seemed so strong that Bobby simply couldn't imagine anything truly happening to it.
        - id: ch01-b06
          speaker: narrator
          text: But something was happening now. There wasn't the smallest doubt about it. With every blow, the great old tree shivered and shook, and still the pounding went on.
        - id: ch01-b07
          speaker: narrator
          text: At last, Bobby couldn't stand it any longer. No matter how afraid he was, he had to know what was happening and what all that pounding meant. His teeth chattered with fear as he crawled up to his doorway and looked down.
        - id: ch01-b08
          speaker: narrator
          text: Bobby was already badly frightened, but what he saw below frightened him even more. It scared him so much that he lost his grip and tumbled all the way down to his bed. Of course, the fall didn't hurt him because the bed was soft. In a minute, he was scrambling back up to the doorway for another look.
        - id: ch01-b09
          speaker: bobby_coon
          text: What am I going to do? What can I do? I can't run away, and I can't stay here. What can I do? What can I do?
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: Bobby looked down with frightened eyes. He was horribly frightened. There was no doubt about that. Have you guessed what he saw?
        - id: ch01-b11
          speaker: narrator
          text: Farmer Brown and Farmer Brown's boy were chopping down the big chestnut tree that had been Bobby's home for so long. And Bowser the Hound stood watching them.
