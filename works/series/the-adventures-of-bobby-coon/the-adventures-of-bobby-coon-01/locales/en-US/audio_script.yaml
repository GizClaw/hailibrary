audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
  chapters:
    - id: ch01
      title: I. Bobby Coon Has a Bad Dream
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Some dreams are good, and some are bad.
            Some dreams are light and airy.
            And some, I think, are woven by
            The worst kind of a fairy.
        - id: ch01-b02
          speaker: narrator
          text: Dreams are very strange things. While you're dreaming, they seem perfectly real, even though they aren't real at all. Sometimes I think fairies must make them. Good fairies would make the happy dreams, of course, and bad fairies would make the bad ones. I expect you've had both kinds. I know I have, many times.
        - id: ch01-b03
          speaker: narrator
          text: Bobby Coon says fairies have nothing to do with dreams. And Bobby should know. He sleeps through most of the winter, and you have to be asleep to have a real dream.
        - id: ch01-b04
          speaker: narrator
          text: Bobby stayed awake as long as he could find anything to eat. Then Jack Frost froze everything hard. Rough Brother North Wind swept in the storm clouds, and snow covered the Green Forest. That was Bobby's signal to climb into his warm bed inside the big hollow chestnut tree he called home. He curled up snugly and went to sleep.
        - id: ch01-b05
          speaker: narrator
          text: Bobby didn't care one hair of his ringed tail how cold it became. He didn't care how Brother North Wind howled, shrieked, and blustered outside. During his last few days out and about, Bobby had grown so fat that he wheezed and puffed whenever he tried to hurry. Now all that fat kept him warm as he slept. It also stopped hunger from waking him.
        - id: ch01-b06
          speaker: narrator
          text: Bobby didn't sleep straight through the whole winter the way Johnny Chuck did. Every once in a great while, especially when the weather grew warmer, Bobby would wake. He would yawn a few times, crawl up to his doorway, and peek outside to see how everything looked.
        - id: ch01-b07
          speaker: narrator
          text: Sometimes Bobby climbed down from his home and took a short walk for exercise. He never wandered far, though. Before long, he was back in his tree for another long nap.
        - id: ch01-b08
          speaker: narrator
          text: As winter drew toward its end, Bobby's naps became shorter. He wasn't fat anymore. In fact, his stomach complained a great deal about being empty. Maybe you know how that feels. An empty, complaining stomach can be very hard to ignore.
        - id: ch01-b09
          speaker: narrator
          text: It wouldn't leave Bobby alone while he was awake. When he fell asleep, it gave him bad dreams. Bobby knew perfectly well that fairies weren't making those dreams. They came from his bothersome, empty stomach, and nothing else.
        - id: ch01-b10
          speaker: narrator
          text: Then one day, Bobby had the worst dream of all. The night before, he had prowled around for a while, but he couldn't find a single thing to satisfy that troublesome stomach. He went back to bed in a very bad mood. Almost as soon as he fell asleep, the dreams began.
        - id: ch01-b11
          speaker: narrator
          text: At first, the dreams weren't terrible, though they were bad enough. Bobby dreamed mostly about delicious things to eat. But each one vanished just as he was about to taste it. In his sleep, he made funny little grunts and impatient little snarls.
        - id: ch01-b12
          speaker: narrator
          text: At last, a truly awful dream began. It was one of the worst dreams Bobby had ever had.
        - id: ch01-b13
          speaker: narrator
          text: Bobby dreamed he was walking through the Green Forest, quietly minding his own business, when he met a huge giant. Bobby was frightened. He ran as fast as he could and hid inside a hollow log.
        - id: ch01-b14
          speaker: narrator
          text: No sooner had Bobby crawled inside than the giant came up to the log with a great club. Then the giant began pounding on it. Each blow made a terrible noise inside. It was as if Bobby were trapped inside a drum while someone beat upon it.
        - id: ch01-b15
          speaker: narrator
          text: A dreadful roar filled Bobby's ears. His head hurt so badly that it felt ready to split. Cold shivers ran all over him. He was filled with fear and despair.
        - id: ch01-b16
          speaker: narrator
          text: Yes, indeed, it was a bad dream. It was a very, very bad dream!
