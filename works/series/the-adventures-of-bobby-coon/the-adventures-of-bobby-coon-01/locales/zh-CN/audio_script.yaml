audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
  chapters:
    - id: ch01
      title: 梦与仙子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有的梦美，有的梦坏。有的梦轻盈，飘飘悠悠。还有些梦，我想它们准是最坏心眼的仙子织就。
        - id: ch01-b02
          speaker: narrator
          text: 梦可真奇怪。它明明是假的，做梦时却真实得很。有时我忍不住猜，梦一定是仙子捣鼓出来的。好仙子给人美梦，坏仙子就送来噩梦。你大概两种都做过吧？反正我做过不少。
        - id: ch01-b03
          speaker: narrator
          text: 可浣熊博比不赞成。他认定梦和仙子一点关系也没有。这件事，博比的话倒很值得听，因为他一到冬天，大部分时间都在睡觉。人只有睡着了，才会做真正的梦呀。
    - id: ch02
      title: 栗树洞里的冬眠
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 只要外面还有吃的，博比就舍不得睡。后来，霜杰克冻硬了所有东西，粗野的北风老兄又赶来团团乌云，大雪盖住整座绿森林，博比才钻进一棵巨大的空心栗树。那是他认作自己家的地方，里面有张暖暖的床。他把身子舒舒服服地一蜷，很快睡着了。
        - id: ch02-b02
          speaker: narrator
          text: 外面再冷，北风老兄再怎么号叫、乱撞，博比连环纹尾巴上的一根毛也不在乎。入睡前那几天，他胖得一走快就呼哧直喘。如今，这一身脂肪正好替他保暖，也让他不会饿醒。
        - id: ch02-b03
          speaker: narrator
          text: 不过，博比不像土拨鼠约翰尼那样，一觉就睡过整个冬天。隔上好久，他会醒来一次，特别是天气暖和的时候。他总要先打上几个哈欠，再爬到洞口，伸头看看外面的光景。有时还下树散一小会儿步，活动活动。可他从不走远，很快又回家睡上一大觉。
        - id: ch02-b04
          speaker: narrator
          text: 冬天快结束时，博比的觉越来越短。他身上的肥肉已经不见了，肚子空得不停抱怨。你要是挨过饿，就知道那滋味多扰人。博比醒着，肚子不让他安生。等他睡着，肚子又给他送来噩梦。所以他很明白，这些梦和仙子无关，全是那个又空又烦、牢骚不断的肚子惹的。
    - id: ch03
      title: 最可怕的梦
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 有一天，博比做了最可怕的一个梦。头天夜里，他出去四处转悠，却什么也没找到，那个又空又闹腾的肚子还是没能得到满足。他又饿又恼地回到床上，刚睡下不久，梦便找来了。
        - id: ch03-b02
          speaker: narrator
          text: 开始还不算最糟，可也够折磨他的。梦里总有香喷喷的食物，偏偏每次都在他要尝到时消失。于是，睡梦中的博比一会儿滑稽地低哼，一会儿又不耐烦地低吼，那声音听来还挺有趣。
        - id: ch03-b03
          speaker: narrator
          text: 后来，真真正正的噩梦来了。这是博比一生中最可怕的梦之一。他梦见自己在绿森林里走着，本来只顾走自己的路，却迎面遇到一个大巨人。博比吓坏了，拼命逃进一截空心木头里。
        - id: ch03-b04
          speaker: narrator
          text: 他才钻进去，大巨人就追到跟前，抡起一根大木棒，狠狠敲打那截木头。每一下都在里面炸开巨响。博比仿佛钻进了一面大鼓，外面有人正一刻不停地擂。轰鸣塞满他的耳朵，震得脑袋快要裂开，浑身也一阵阵发冷。他怕得要命，心里只剩下绝望。
        - id: ch03-b05
          speaker: narrator
          text: 是啊，这就是一个噩梦，一个可怕得不得了的噩梦！
