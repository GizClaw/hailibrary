audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: wary and determined
        timbre: small and rough-edged
        pace: quick and tense
        pitch: medium-high
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: gruff and confident
        timbre: deep and rumbling
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: XXIII. Buster Bear Finds Bobby Coon
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Bobby Coon was back inside his new house, the little cave in a rocky ledge deep in the Green Forest. Neither Bobby nor any member of his family had ever been more upset. Bobby had set out in high spirits to explore his new home and learn who lived nearby. He had hardly begun when he discovered that his closest neighbor was none other than Buster Bear.
        - id: ch01-b02
          speaker: narrator
          text: That was enough to upset anyone, and it certainly upset Bobby. Only a few hours earlier, Buster had tried to catch him and threatened to eat him. The moment Bobby found out that Buster lived in the very same rocky ledge, he no longer wanted to spend the night looking around.
        - id: ch01-b03
          speaker: bobby_coon
          text: What a dreadful fix! What a dreadful, dreadful fix I'm in! This is the best home I've ever found, but Buster Bear lives almost next door. I don't dare stay, and I have nowhere else to go. Oh, dear! What can a poor little fellow like me do? If only I were as big as Buster Bear. Then I'd fight him. I would! I'd fight him!
          emotion: fearful
        - id: ch01-b04
          speaker: buster_bear
          text: Who would you fight?
        - id: ch01-b05
          speaker: narrator
          text: A great, deep, grumbly-rumbly voice had come from just outside the doorway. Bobby dropped right down where he stood and shook with fright. Still, he took great care not to make even the tiniest, weeniest sound. Maybe Buster did not know whose voice he had heard. If Bobby stayed perfectly still, perhaps Buster would decide he had been mistaken and go away.
        - id: ch01-b06
          speaker: buster_bear
          text: Who are you in there? I didn't know anyone lived here. Why don't you come out and be friendly?
        - id: ch01-b07
          speaker: narrator
          text: Bobby only shivered and kept his tongue still. For a minute or two, there was not a sound from outside. Then Bobby heard three long sniffs. Sniff, sniff, sniff! Those sounds made him shiver harder than ever.
        - id: ch01-b08
          speaker: buster_bear
          text: Oh, ho! So it's you, Bobby Coon! My little Cousin Bobby! Welcome to the old rock ledge. If I'm going to have a neighbor this close, I'm glad it's you. Come out and shake hands. Don't be shy. I won't hurt you.
        - id: ch01-b09
          speaker: narrator
          text: Buster chuckled. Inside the cave, Bobby lifted his ears a little. He knew Buster's nose had told him everything he wanted to know. There was no point in pretending any longer.
        - id: ch01-b10
          speaker: bobby_coon
          text: Do you really mean that, Cousin Buster?
          emotion: fearful
        - id: ch01-b11
          speaker: buster_bear
          text: Certainly I mean it. Why wouldn't I? I usually mean what I say.
        - id: ch01-b12
          speaker: narrator
          text: Buster's answer came in a grumble. Bobby replied timidly.
        - id: ch01-b13
          speaker: bobby_coon
          text: That's the trouble. A little while ago, you tried to catch me. You said you'd eat me, and I thought you meant that, too.
          emotion: fearful
        - id: ch01-b14
          speaker: narrator
          text: Buster began to chuckle, and then he laughed. His laugh was as deep and grumbly-rumbly as his voice.
        - id: ch01-b15
          speaker: buster_bear
          text: That's true, Bobby! That's true! But my stomach was so empty then that it made me lose my temper. Now my stomach is full, and I'm really myself again. You know there's no need to fear me when I'm myself. Just forget that little business. I already would have forgotten it, if you hadn't reminded me. I'm glad you've decided to be neighborly. You couldn't have picked a safer home.
        - id: ch01-b16
          speaker: buster_bear
          text: I'm going to take a nap now. Come see me whenever you feel like it. Be neighborly, Cousin Bobby. Be neighborly.
        - id: ch01-b17
          speaker: narrator
          text: With that, Buster Bear shuffled along to his own house and his bed. Before long, Bobby Coon was in the best of spirits again. He decided to remain right there in his new home. I suspect he is there this very minute, unless he is out getting into mischief or searching for a new adventure.
        - id: ch01-b18
          speaker: narrator
          text: And speaking of adventures makes me think of Jimmy Skunk. His adventures will take a whole book to tell, so the next book will be all about Jimmy and the things he does.
