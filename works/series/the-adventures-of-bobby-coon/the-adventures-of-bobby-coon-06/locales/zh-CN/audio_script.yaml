audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
    farmer_browns_boy:
      display_name: 布朗家的男孩
      tts:
        delivery: 朴实爽朗，发现新鲜事时充满好奇
        timbre: 明亮清脆的少年嗓音
        pace: 自然而轻快
        pitch: 中高
    bowser:
      display_name: 猎犬鲍泽
      tts:
        delivery: 忠诚活泼，追踪时兴奋急切，吃痛时响亮慌乱
        timbre: 浑厚有力
        pace: 急促而富有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 男孩想放走博比
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 布朗家的男孩探头往树洞里看。博比正朝他龇牙，还不停地咆哮、低吼。男孩看着看着，忍不住轻声笑了。博比显然准备为了活命拼到底。就算根本赢不了，他也照样要打。
        - id: ch01-b02
          speaker: farmer_browns_boy
          text: 博比，你这个小淘气鬼，胆子还真大。你一定以为，我和爸爸砍倒这棵树，就是专门来抓你的。你还以为我们俩加上鲍泽，全都想要你的命。可你想错啦，全都想错啦。
        - id: ch01-b03
          speaker: farmer_browns_boy
          text: 要是我们早知道这棵树是你的家，压根儿不会砍它。不会的，先生，绝对不会。现在既然知道了，我们连你的一根毛都不会碰。
        - id: ch01-b04
          speaker: farmer_browns_boy
          text: 我把洞口再劈大一点儿，你就能出来了。然后我会牢牢拉住鲍泽，让你赶快逃走。但愿附近还有别的空心树，可以给你安家。
        - id: ch01-b05
          speaker: farmer_browns_boy
          text: 唉，博比，我们没想到你住在这儿，真是太糟了。我实在过意不去。好了，别再冲我咆哮啦，我这就给你让出一条路。
    - id: ch02
      title: 一场误会
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可博比还是不停地威吓他们。无论谁敢靠近，他都准备拼命。真可惜，他一句也听不懂男孩的话。要是能听懂，压在他心上的大石头早就落地了。
        - id: ch02-b02
          speaker: narrator
          text: 在博比看来，眼前的全是敌人，他们就是来杀他的。他也认定自己没有半点儿逃脱的机会。可即便这样，他还是鼓起勇气，打算用尽全力抵抗。这才是真正勇敢的性子。博比可不是一遇到危险就认输的胆小鬼。
        - id: ch02-b03
          speaker: narrator
          text: 还有一件事，除了博比自己，谁也不知道。大树倒下的时候，他伤得很重，一条前腿已经摔断了。可他仍旧要战斗。是的，先生，就算断了一条腿，不到再也撑不住的时候，他也绝不放弃。
        - id: ch02-b04
          speaker: narrator
          text: 男孩挥起斧头，把洞口劈得更宽，免得博比出来时被卡住。博比一直龇着牙，又咬牙又咆哮。随后，男孩把鲍泽牵到旁边，紧紧拉住。农夫布朗也走了过去，他们就这样藏起来等着。
        - id: ch02-b05
          speaker: narrator
          text: 绿森林里渐渐静了下来。博比看不到他们，心里越想越奇怪。难道自己刚才那么凶，真的把他们吓跑了？他等到再也耐不住性子，才小心地探出脑袋。
        - id: ch02-b06
          speaker: narrator
          text: 外面一个人影也没有。博比哪里知道，农夫布朗、男孩和鲍泽都躲在一小丛铁杉后面呢。
    - id: ch03
      title: 博比出了事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 博比慢慢往外爬，每动一下都疼得厉害。那条断腿简直痛得要命。断的是一条前腿，他只能把那只爪子悬在空中，用另外三条腿走路。这样走已经够难受了，可更糟的事还在后面。
        - id: ch03-b02
          speaker: narrator
          text: 博比走到一棵树下，试着往上爬，却怎么也爬不上去。腿断了，他再也不能爬树。就算找到了另一棵空心树，也没有办法住进去。他现在只能去找一截空心圆木，钻到里面藏身。
        - id: ch03-b03
          speaker: narrator
          text: 可怜的博比！他该怎么办？他还能怎么办？平生头一回，他那股了不起的勇气离开了他。
        - id: ch03-b04
          speaker: narrator
          text: 博比以为这里只有自己，也以为谁都看不见他。他就在刚才想爬的那棵树下缩成一团，低声呜咽起来。他怕得厉害，难过得厉害，身上的伤更是疼得厉害。
