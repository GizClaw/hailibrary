audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: kind, earnest, and gently reassuring
        timbre: clear and youthful
        pace: easy and conversational
        pitch: medium
  chapters:
    - id: ch01
      title: VI. Something Is Wrong with Bobby Coon
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Farmer Brown's boy peered in at Bobby Coon and chuckled. Bobby showed his teeth. He snarled and growled. There was no mistaking what he meant to do. The fight might be hopeless, but Bobby intended to fight for his life all the same.
        - id: ch01-b02
          speaker: farmer_browns_boy
          text: Bobby, you really are a brave little rascal. I know what you're thinking. You think Father and I cut down this tree just to catch you. You think Bowser and the two of us are going to kill you. But you're wrong, Bobby. If we'd known this tree was your home, we never would have cut it down. No, sir. And now that we do know, we won't harm a single hair on you.
        - id: ch01-b03
          speaker: farmer_browns_boy
          text: I'm going to make this hole a little bigger so you can get out easily. Then I'll hold Bowser and give you time to escape. I hope there's another hollow tree nearby where you can live. I'm terribly sorry we didn't know about your home, Bobby. I truly am. Now stop all that snarling and growling, and let me help you get away.
          emotion: calm
        - id: ch01-b04
          speaker: narrator
          text: Bobby kept threatening to fight anyone who came near. He couldn't understand a word Farmer Brown's boy had said. That was too bad. If Bobby had understood, the boy's words would have taken a great weight off his mind and ended all his fear about what they meant to do.
        - id: ch01-b05
          speaker: narrator
          text: Bobby had no doubt at all. These creatures were his enemies, and they meant to kill him. He didn't think he had the slightest chance of escaping. Even so, he meant to fight as hard and as bravely as he could. Bobby had the right kind of spirit. He was no quitter.
        - id: ch01-b06
          speaker: narrator
          text: And there was something else that only Bobby knew. He had been badly hurt when the tree fell. One of his legs was broken. Still, he meant to fight. Yes, sir, even with a broken leg, Bobby would not give up until he had to.
        - id: ch01-b07
          speaker: narrator
          text: Farmer Brown's boy swung his axe several times and split the opening wider. Now Bobby could get out without trouble. Through it all, Bobby snapped, snarled, and gritted his teeth.
        - id: ch01-b08
          speaker: narrator
          text: Then the boy led Bowser the Hound off to one side and held him there. Farmer Brown joined them, and they waited. Bobby couldn't see any of them. The Green Forest became very still.
        - id: ch01-b09
          speaker: narrator
          text: Bobby didn't know what to think. Had his fierce display frightened them away? After a while, he began to believe it had. He waited as long as his patience allowed, then poked his head outside.
        - id: ch01-b10
          speaker: narrator
          text: No one was in sight. Farmer Brown, his boy, and Bowser were all hidden behind a little clump of hemlock trees.
        - id: ch01-b11
          speaker: narrator
          text: Slowly and painfully, Bobby climbed out. That broken leg hurt dreadfully. It was one of his front legs, so of course he had to hold the injured paw off the ground. That meant he could use only three legs whenever he tried to walk.
        - id: ch01-b12
          speaker: narrator
          text: Walking on three legs was bad enough. But when Bobby tried to climb a tree, he couldn't do it. With his leg broken, Bobby Coon could climb no more. Looking for another hollow tree was useless now. His only hope was to find a hollow log and crawl inside.
        - id: ch01-b13
          speaker: narrator
          text: Poor Bobby Coon! What was he going to do? What could he do?
        - id: ch01-b14
          speaker: narrator
          text: For the first time, Bobby's wonderful courage left him. He believed he was alone and that no one could see. So he crouched at the foot of the tree he had tried to climb, and he whimpered.
        - id: ch01-b15
          speaker: narrator
          text: Bobby Coon was frightened. He was terribly miserable, and he was in great pain.
