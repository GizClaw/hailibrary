audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
    farmer_browns_boy:
      display_name: 布朗家的男孩
      tts:
        delivery: 朴实爽朗，发现新鲜事时充满好奇
        timbre: 明亮清脆的少年嗓音
        pace: 自然而轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 伤好了，自由却没回来
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 布朗家的男孩把浣熊博比当成了宝贝。他天天宠着博比，好吃的更是一个劲儿地喂，简直让人担心博比会不会撑出病来。可不管日子多舒服，博比到底还是个囚徒。
        - id: ch01-b02
          speaker: narrator
          text: 只有男孩在屋里陪他玩的时候，博比才能暂时不受拘束。其余时间，一条长链子总拴着他。绷带拆掉时，他的伤腿已经长好了。不过，男孩想等那条腿完全恢复力气，再让他独自生活。
        - id: ch01-b03
          speaker: narrator
          text: 日子一天天过去，那条腿越来越有劲，最后已经跟从前一样好。可博比仍然没有自由。其实，布朗家的男孩是太喜欢他了，一想到要分开，就怎么也舍不得。
        - id: ch01-b04
          speaker: narrator
          text: 刚开始，博比一点儿也不介意。不用自己去找，想吃多少好东西就有多少。有些美味，他以前从没尝过，在绿森林里也根本吃不到。这不是很美吗？
        - id: ch01-b05
          speaker: narrator
          text: 他还有一张暖和舒服的床，什么事都不必操心。所以有一阵子，博比安安心心地做着囚徒。那条链子他也不放在心上。只有好奇心冒出来，想把小鼻子探进某样东西里却够不着时，他才觉得链子碍事。
    - id: ch02
      title: 春天唤起的思念
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 后来，温柔的春姑娘来了。她把沉睡了一冬的树木、花朵和昆虫都唤醒，也叫醒了老蟾蜍先生、土拨鼠约翰尼、金花鼠条纹，还有其他所有伙伴。
        - id: ch02-b02
          speaker: narrator
          text: 鸟儿也从阳光灿烂的南方一只接一只地飞回来。博比听着它们鸣唱啁啾，看着它们到处飞翔，心底慢慢生出一股强烈的思念。他想念绿森林了。
        - id: ch02-b03
          speaker: narrator
          text: 起先，博比还弄不明白自己到底想要什么。他只觉得心里不安，怎么也待不住。他一次次把链子扯到尽头，来来回回地走，连胃口也渐渐没了。
        - id: ch02-b04
          speaker: narrator
          text: 一天，布朗家的男孩送来一条鱼，给博比当晚饭。就在看见鱼的那一刻，博比忽然明白了。他要回绿森林去。他要亲自在欢笑溪里捉鱼，还要爬树，去看望从前的邻居，瞧瞧大家都在忙些什么。
        - id: ch02-b05
          speaker: narrator
          text: 他还想去老朽木底下、旧树桩周围找虫子，也想寻找正在搭建的鸟巢，等以后再去偷巢里的蛋。唉，博比确实打着这个主意。他最爱吃蛋，还觉得只要自己够机灵，能把蛋找到，那些蛋就该归他。
        - id: ch02-b06
          speaker: narrator
          text: 博比真正想要的是自由。他想什么时候做什么，就什么时候做，愿意怎么做，就怎么做。他想回到绿森林的家。
    - id: ch03
      title: 要是大家说同一种话
      blocks:
        - id: ch03-b01
          speaker: bobby
          text: 布朗家的男孩一直对我很好。只要我能把自己的心愿告诉他，他一定会放我走。可我听不懂他说什么，他也听不懂我的话。
        - id: ch03-b02
          speaker: bobby
          text: 要是大家都说同一种话，那该多好！我们就能明白彼此的意思。这样一来，住在绿森林和绿草地上的小动物，大概也不会再被这些人类追捕得那么厉害了。
        - id: ch03-b03
          speaker: bobby
          text: 想让大家互相了解，再没有什么比说同一种话更有用了。只要布朗家的男孩知道我想回家，他准会放我走。我知道，他一定会的。
        - id: ch03-b04
          speaker: narrator
          text: 博比坐了下来，选了一个能望见绿森林的地方。他叹了一声，又叹一声。
        - id: ch03-b05
          speaker: narrator
          text: 他满心的思念，全都涌进了眼睛里。
