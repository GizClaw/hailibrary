audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: wary and determined
        timbre: small and rough-edged
        pace: quick and tense
        pitch: medium-high
  chapters:
    - id: ch01
      title: X. Bobby Longs for the Green Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Farmer Brown's boy made a great fuss over Bobby Coon. He petted him and fed him so many good things that it was a wonder Bobby didn't get sick. But Bobby was still a prisoner. Whenever the boy wasn't playing with him in the house, Bobby was fastened to a long chain.
        - id: ch01-b02
          speaker: narrator
          text: Once the bandage came off, Bobby's injured leg was healed. Still, the boy kept him there until he could use it properly again and take care of himself. The leg grew stronger every day. Soon it was as good as ever, but Bobby still wasn't set free. Farmer Brown's boy had grown so fond of him that he couldn't bear to let him go.
        - id: ch01-b03
          speaker: narrator
          text: At first, Bobby didn't mind. He could eat all he wanted without hunting for a thing. Some of those treats were better than anything he had ever found in the Green Forest. His bed was warm and comfortable, and he had nothing at all to worry about.
        - id: ch01-b04
          speaker: narrator
          text: For a while, Bobby was quite happy with this life. The chain hardly bothered him. He noticed it only when his curious little nose wanted to investigate something just beyond his reach.
        - id: ch01-b05
          speaker: narrator
          text: Then sweet Mistress Spring began waking everyone who had slept through the long winter. The trees and flowers and insects stirred. So did Old Mr. Toad, Johnny Chuck, Striped Chipmunk, and all the rest. One by one, the birds came home from the sunny Southland.
        - id: ch01-b06
          speaker: narrator
          text: Bobby heard the birds sing and twitter. He watched them fly here and there. And little by little, a great longing for the Green Forest crept into his heart.
        - id: ch01-b07
          speaker: narrator
          text: At first, he didn't understand what he wanted. He only knew that he felt restless. He couldn't sit still. Back and forth he paced, as far as his chain would let him go. Even his appetite began to fade.
        - id: ch01-b08
          speaker: narrator
          text: One day, Farmer Brown's boy brought Bobby a fish for dinner. In that instant, Bobby understood. He wanted to go back to the Green Forest and catch his own fish in the Laughing Brook. He wanted to climb trees and visit his old neighbors to see what they were doing.
        - id: ch01-b09
          speaker: narrator
          text: He wanted to search beneath old logs and around old stumps for bugs. He wanted to find the nests the birds were building, so he could come back later and steal their eggs. Yes, I'm sorry to say, that was one of his plans. Bobby loves eggs, and he believes they belong to him whenever he's clever enough to find them.
        - id: ch01-b10
          speaker: narrator
          text: More than anything, Bobby wanted to be free. He wanted to choose what he did, when he did it, and how he did it. He wanted to go home to the Green Forest.
        - id: ch01-b11
          speaker: bobby_coon
          text: Farmer Brown's boy has treated me very well. If I could only tell him what I want, I think he'd let me go. But I can't understand his words, and he can't understand mine. It's a great pity we don't all speak the same language.
        - id: ch01-b12
          speaker: bobby_coon
          text: If we could talk to one another, we'd understand each other better. Maybe then the men wouldn't hunt us little folks of the Green Forest and the Green Meadows so much. Nothing helps folks understand each other like sharing the same speech. If Farmer Brown's boy knew what I wanted, he would let me go. I know he would.
        - id: ch01-b13
          speaker: narrator
          text: Bobby sat where he could gaze toward the Green Forest. He sighed and sighed, and all the longing in his heart showed in his eyes.
