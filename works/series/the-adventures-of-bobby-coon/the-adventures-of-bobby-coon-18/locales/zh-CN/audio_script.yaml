audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 热心好奇，话语轻快，偶尔透出顽皮
        timbre: 清脆明亮
        pace: 明快灵活
        pitch: 中高
    buster_bear:
      display_name: 巴斯特熊
      tts:
        delivery: 憨直而警觉，饥饿时带着急切和粗声嘟囔
        timbre: 低沉浑厚
        pace: 稍慢，行动时加快
        pitch: 低
  chapters:
    - id: ch01
      title: 巴斯特动了怒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 发脾气真是件傻事，既糊涂，又不管不顾。明知道根本没有必要，又何苦让怒火冲昏头脑。
        - id: ch01-b02
          speaker: narrator
          text: 巴斯特熊刚从地上爬起来，就看见表亲浣熊博比也在慌忙起身。他顿时发起了脾气。这样做实在傻透了，简直没有一丁点儿理由。不过，也别太责怪巴斯特。那时候的他，实在不像平常的自己。
        - id: ch01-b03
          speaker: narrator
          text: 平日里，巴斯特在整个绿森林中可是数一数二的好脾气。许多伙伴都比他容易发火。说真的，他原本压根儿就不是个急性子。
        - id: ch01-b04
          speaker: narrator
          text: 可这会儿，他饿坏了，满脑子只想着空空的肚皮。春天才刚开始，能吃的东西少得可怜。巴斯特找了又找，也只能找到一点点食物。
        - id: ch01-b05
          speaker: narrator
          text: 刚才，他撕开那截高高的老树桩，本以为里面会有一窝蚂蚁，或者有些爱钻进朽木里的虫子。没想到，滚出来的竟是浣熊博比。巴斯特失望透顶，还没来得及想一想，怒火就冒了出来。
        - id: ch01-b06
          speaker: narrator
          text: 他想当然地认定，博比躲进空树桩，也是为了找他想要的食物。可凡事想当然，从来不会有好结果。你我都知道，博比钻进树桩，只是想睡上一觉。
    - id: ch02
      title: 不公平的指责
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 巴斯特并不知道这些，也没停下来问个明白。他发出一声又低又凶的怒吼，吓得兔子彼得浑身的毛都竖了起来。彼得就躲在附近的大树后面，等着看事情会闹成什么样。
        - id: ch02-b02
          speaker: narrator
          text: 巴斯特朝表亲扑过去，那双小眼睛简直要迸出火星来了。他用那低沉、隆隆作响的嗓门吼了起来。
        - id: ch02-b03
          speaker: buster_bear
          text: 竟敢偷一头老实熊的晚饭，我非好好教训你不可！
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: 这话对博比可不公平。他根本没偷什么晚饭。就算他真在空树桩里找吃的，也没有半点对不起巴斯特的地方。可是，巴斯特当时根本没想这些。
        - id: ch02-b05
          speaker: buster_bear
          text: 既然偷了我的晚饭，那你就拿自己来赔！
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: 博比拔腿就跑。
        - id: ch02-b07
          speaker: bobby
          text: 可我是你的表亲呀！
          emotion: fearful
        - id: ch02-b08
          speaker: buster_bear
          text: 是表弟也没用！我现在饿得要命，就算真有个亲兄弟，也照吃不误。
          emotion: angry
    - id: ch03
      title: 一路追上大树
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 巴斯特在后面紧追不舍，博比则是在逃命。别看巴斯特块头那么大，一着急，跑起来可快得很。尤其是身子又瘦又精的时候，他就更快了。
        - id: ch03-b02
          speaker: narrator
          text: 博比吓得尖叫起来，飞快地爬上一棵大树。他这辈子爬树，从来没有这么快过。巴斯特又发出一声低吼，那声音在胸膛里隆隆作响。紧接着，他也往树上爬去。
        - id: ch03-b03
          speaker: bobby
          text: 哎呀，真把我吓坏了！
          emotion: fearful
        - id: ch03-b04
          speaker: narrator
          text: 这时候，博比可彻底清醒了。他慌忙爬到将近树顶的地方，脑袋里哪里还有半点睡意。兔子彼得在一旁看着，吓得瞪大了眼睛。看来，巴斯特熊这回准会抓住博比了！
