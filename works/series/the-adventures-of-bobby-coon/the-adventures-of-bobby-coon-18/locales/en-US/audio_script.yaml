audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: wary and determined
        timbre: small and rough-edged
        pace: quick and tense
        pitch: medium-high
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: deep, forceful, and grumbly
        timbre: heavy and rumbling
        pace: deliberate with sudden sharp turns
        pitch: low
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager and animated
        timbre: bright and youthful
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: XVIII. Buster Bear's Short Temper
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Losing your temper is a foolish thing to do. It is silly and heedless, especially when you already know there is no need for it at all.
        - id: ch01-b02
          speaker: narrator
          text: Buster Bear scrambled to his feet and saw his cousin Bobby Coon getting up too. At once, Buster lost his temper. That was foolish, and there was no excuse for it. Still, we must not blame him too much, because Buster was not quite himself. Most of the time, he was one of the best-natured folks in the Green Forest. Plenty of his neighbors lost their tempers far more easily. Buster was not usually short-tempered at all.
        - id: ch01-b03
          speaker: narrator
          text: But Buster was hungry now. His stomach felt so empty that he could think of nothing else. This early in spring, there was very little food to be found. He had to hunt and hunt before he could find even that little bit.
        - id: ch01-b04
          speaker: narrator
          text: When Buster began tearing open that tall old stump, he hoped to find a nest of ants inside. Or perhaps he would uncover some worms and insects that liked to bury themselves in the rotten wood. Instead, Bobby Coon came rolling out. Buster was so disappointed that he flew into a rage before he stopped to think.
        - id: ch01-b05
          speaker: narrator
          text: Buster simply assumed that Bobby had gone into the hollow stump looking for the same food Buster wanted. But it never does to take things for granted. You and I know that Bobby had crawled into the stump only because he wanted a place to sleep.
        - id: ch01-b06
          speaker: narrator
          text: Buster knew none of that, and he did not wait to learn the truth. He let out a terribly deep, ugly growl. The sound made every hair on Peter Rabbit stand on end. Peter was hiding close by, behind a big tree, so he could watch whatever happened next.
        - id: ch01-b07
          speaker: narrator
          text: Then Buster started toward his cousin. His little eyes seemed to flash with fire.
        - id: ch01-b08
          speaker: buster_bear
          text: I'll show you what happens when you steal an honest bear's dinner!
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: His voice came out in a deep, grumbly rumble. Of course, his accusation was not fair. Bobby had stolen nothing. Even if Bobby had been searching the stump for food, he would not have wronged Buster. But Buster was too angry to think about that.
        - id: ch01-b10
          speaker: buster_bear
          text: Since you took my meal, you can be my meal instead!
          emotion: angry
        - id: ch01-b11
          speaker: bobby_coon
          text: But Buster, I'm your cousin!
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: Bobby cried out as he turned and ran.
        - id: ch01-b13
          speaker: buster_bear
          text: I don't care! I'm so hungry I'd eat my own brother, if I had one!
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: Buster scrambled after him, and Bobby ran for his life. Buster was big, but he could move very fast when he was in a hurry, especially now that he was thin and lean. Bobby squealed in fright. Then he raced up a big tree faster than he had ever climbed before. Buster gave another deep, rumbling growl and began climbing right after him.
        - id: ch01-b15
          speaker: bobby_coon
          text: Oh! Oh!
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: You may be sure Bobby was wide awake now. There was no thought of sleep left in his head as he scrambled almost to the top of that big tree. Peter Rabbit stared in horror. Surely Buster Bear would catch Bobby now!
