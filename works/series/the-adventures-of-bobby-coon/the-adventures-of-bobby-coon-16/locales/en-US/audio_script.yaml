  chapters:
    - id: ch01
      title: XVI. Blacky the Crow Discovers Bobby
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Blacky the Crow has very sharp eyes. He loves to peek and pry, and I am sorry to confess that the black rascal loves mischief too. Nothing makes him happier than teasing someone and making that person uncomfortable.
        - id: ch01-b02
          speaker: narrator
          text: No matter what business Blacky has, he keeps one eye open for a chance to amuse himself at somebody else's expense. Those bright eyes miss very little. If there is anything to see, you can trust Blacky to see it.
        - id: ch01-b03
          speaker: narrator
          text: Poor Bobby Coon had just fallen asleep inside the hollow stump in the Green Forest. Then Blacky came flying over the treetops on his way to his nest. As usual, he was watching everything below. He passed straight over the stump and looked right down into it. There lay Bobby, curled up and sound asleep.
        - id: ch01-b04
          speaker: narrator
          text: Blacky stopped in midair and hovered above the stump for a moment. Mischief danced in his sharp eyes. Then he turned, glided silently down, and landed on the rim. He sat there for several minutes, peering at Bobby and chuckling to himself. At last, he flew to the top of a tree and called as loudly as he could.
        - id: ch01-b05
          speaker: blacky_crow
          text: Caw, caw, caw! Ca-a-w! Caw, caw! Caw, ca-a-w, caw!
        - id: ch01-b06
          speaker: narrator
          text: An answer came almost at once. Soon Blacky's friends and relatives were hurrying in from every direction. Each crow called at the top of its voice and wanted to know what Blacky had found. But Blacky waited until the very last crow arrived before he answered. Then he told them all to look inside the old hollow stump.
        - id: ch01-b07
          speaker: blacky_crow
          text: Fly over that old stump and look down inside!
        - id: ch01-b08
          speaker: narrator
          text: One after another, the crows flew across the opening and peered down. Each one cried out with delight. As many as could fit settled on the rim. The rest perched in the trees nearby or flew back and forth above the stump. Then every one of them began cawing with all its might. What a racket they made!
        - id: ch01-b09
          speakers: [blacky_crow, crow_1, crow_2, crow_3]
          ensemble: chorus
          text: Caw, caw! Ca-a-w! Caw, caw, ca-a-w! Caw, caw, caw!
        - id: ch01-b10
          speaker: narrator
          text: Of course Bobby couldn't sleep through such a noise. He opened his eyes and looked up. A ring of black heads surrounded the opening, all staring down at him. Mischief danced in every pair of sharp eyes. The moment the crows knew Bobby was awake, they made twice as much noise.
        - id: ch01-b11
          speakers: [blacky_crow, crow_1, crow_2, crow_3]
          ensemble: chorus
          text: Ca-a-w! Ca-a-w! Ca-a-w! Caw, caw! Ca-a-w! Caw, caw, caw!
        - id: ch01-b12
          speaker: narrator
          text: Bobby pulled back his lips and snarled. His tormentors shrieked with delight. Blacky dropped a little stick onto Bobby, and another crow copied him. Bobby scrambled to his feet and began climbing toward them. At once the crows flew up and screamed even louder.
        - id: ch01-b13
          speaker: narrator
          text: Bobby stopped. There was no sense in climbing where those crows could reach him. They would tug at his fur and make him miserable, and he knew he could never catch even one of them. So he backed down, sat at the bottom, and glared up.
        - id: ch01-b14
          speaker: bobby_coon
          text: Just wait until I catch one of you! You will be sorry then!
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: That only pleased Blacky and his friends more. They were having a wonderful time tormenting Bobby.
        - id: ch01-b16
          speaker: narrator
          text: Finally, Bobby did the wisest thing he could. He curled up again and paid no attention to the black troublemakers. He could not truly sleep through that din, but he pretended he was asleep.
        - id: ch01-b17
          speaker: narrator
          text: After all, teasing is no fun when the one being teased refuses to show it. Before long, Blacky and the other crows grew tired of screaming. Their fun was over. One by one, they flew away to attend to their own business.
        - id: ch01-b18
          speaker: narrator
          text: At last, the Green Forest was perfectly still again.
        - id: ch01-b19
          speaker: narrator
          text: Bobby gave a thankful sigh and fell asleep once more.
