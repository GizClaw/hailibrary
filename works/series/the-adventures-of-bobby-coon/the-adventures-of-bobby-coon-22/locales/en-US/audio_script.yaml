audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: wary and determined
        timbre: small and rough-edged
        pace: quick and tense
        pitch: medium-high
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: gruff and confident
        timbre: deep and rumbling
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: XXII. Bobby Finds He Has a Neighbor
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Deep in the Green Forest, Bobby Coon slept peacefully at last. His new home was a little cave in a rocky ledge, and no one came to bother him there. He had lost a great deal of sleep, so he slept through the rest of the day. By the time he woke, round, jolly Mr. Sun had gone to bed behind the Purple Hills. Mistress Moon had taken his place in the sky.
        - id: ch01-b02
          speaker: narrator
          text: At first, Bobby had no idea where he was. He rubbed his eyes and stared at the stone walls around his bed. Where was he? How had he gotten there? Then his memory began to return. He stretched and yawned while the whole adventure came back to him, bit by bit.
        - id: ch01-b03
          speaker: narrator
          text: First, Bobby remembered trying to take Unc' Billy Possum's home and finding out what a mistake that was. Then he remembered crawling carelessly into Prickly Porky's house for a nap, only to have Prickly Porky drive him out. After that came the fine hollow stump. Blacky the Crow found him there, and later Buster Bear did too. Buster chased Bobby and shook him terribly at the top of a slender young tree. Then Buster stopped to chase Peter Rabbit, and Bobby seized his chance to escape.
        - id: ch01-b04
          speaker: narrator
          text: Bobby had run until he could go no farther. That was how he reached this unfamiliar part of the Green Forest. He searched and searched for a hollow tree that could become his new home, but found none. At last, he discovered this little cave in the rocky ledge. Now he remembered everything.
        - id: ch01-b05
          speaker: narrator
          text: Bobby scrambled up and took a closer look at his new house. He had been too tired to study it when he first came in. The more carefully he examined it, the more he liked it. Since no one else was there, Bobby began talking to himself.
        - id: ch01-b06
          speaker: bobby_coon
          text: A house has to be safe before anything else. I used to think there was no safer place than a strong hollow tree, but I was wrong. Men can chop down a hollow tree. That's what happened to my old home. They can't chop this place down. No, sir! And even Buster Bear couldn't rip these rocks apart with those huge claws of his. The doorway is so small that none of the creatures I'm afraid of could squeeze through. I've never found a safer place.
        - id: ch01-b07
          speaker: bobby_coon
          text: Then a house has to be dry. Living in a damp place feels awful, and it isn't healthy. This cave is perfectly dry. It should stay warm in winter and cool in summer. I couldn't ask for a more comfortable home. All I need is a nice bed, and I can make that soon enough. After everything I've been through, finding this place may have made it all worthwhile. I think I'll go meet the neighborhood now and find out whether anyone lives close by.
        - id: ch01-b08
          speaker: narrator
          text: Bobby slipped out through the narrow doorway and looked around. He wanted to see what he could discover.
        - id: ch01-b09
          speaker: bobby_coon
          text: I'll follow this rocky ledge and look for more caves. Maybe there's an even better one somewhere, though I don't expect to find it.
        - id: ch01-b10
          speaker: narrator
          text: Off he shuffled, lighthearted and full of excitement and curiosity. Exploring a place you have never seen before can be great fun. Bobby had not gone far when he reached a large, open cave in the rock. He stopped at the entrance and peered inside.
        - id: ch01-b11
          speaker: narrator
          text: Almost at once, Bobby spotted a bed. It was a big one, made from dry leaves and small hemlock branches. It looked like a very good bed, and someone had clearly slept there not long before. Bobby's eyes opened wide. Then he sniffed.
        - id: ch01-b12
          speaker: narrator
          text: One sniff told him all he needed to know. Bobby spun around and raced back to his new house as fast as his legs could carry him. In an instant, all his delight in that home had vanished.
        - id: ch01-b13
          speaker: narrator
          text: Bobby had discovered that his nearest neighbor was none other than Buster Bear himself!
