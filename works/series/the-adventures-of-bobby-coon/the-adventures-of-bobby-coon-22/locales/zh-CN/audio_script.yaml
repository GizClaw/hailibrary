audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
  chapters:
    - id: ch01
      title: 在新家醒来
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 浣熊博比住进绿森林深处的小山洞，终于睡得安稳了。没有谁来打扰，他把先前缺的觉全补了回来。等他醒来，那一天已经过去了。圆滚滚、红彤彤的太阳先生躲到紫山后面睡觉，月亮太太接替他，升上了天空。
        - id: ch01-b02
          speaker: narrator
          text: 博比刚睁开眼，一时竟想不起自己在哪儿。他揉揉眼睛，盯着卧室四周的石壁，怎么也弄不明白，自己为什么会躺在这里。
        - id: ch01-b03
          speaker: narrator
          text: 他躺着伸懒腰，打哈欠，先前那些事也一点一点回来了。他想抢走负鼠比利大叔的家，没能得逞。后来，他钻进豪猪波基的屋里打盹，又让波基赶了出去。他好不容易找到一截空心树桩，却先被乌鸦布莱基发现，又碰上了巴斯特熊。
        - id: ch01-b04
          speaker: narrator
          text: 巴斯特追着博比，把他困在一棵细瘦小树的树顶，还把树摇得厉害极了。幸好巴斯特转身去追兔子彼得，博比才趁机逃走。他一直跑到腿再也动不了，来到绿森林里一个陌生的地方。他没找到能安家的空心树，最后才发现岩石缝里这座小山洞。
        - id: ch01-b05
          speaker: narrator
          text: 等事情全想清楚，博比一骨碌站了起来。这一回，他把新房子里里外外看得格外仔细。越看，他越觉得满意。身边没有别人，他只好跟自己说话。
    - id: ch02
      title: 最安全的房子
      blocks:
        - id: ch02-b01
          speaker: bobby
          text: 挑房子，第一件要看的，就是安不安全。从前我觉得，结实的空心树一定是世上最安全的地方。现在才知道，我想错了。人会把树砍倒，我的旧房子就是这么没的。可他们砍不倒这片岩石。对，先生，这里绝不会出那种事。
        - id: ch02-b02
          speaker: bobby
          text: 巴斯特熊那双大爪子，也撕不开石头。这个洞口又窄，凡是我害怕的家伙，谁也别想钻进来。我从没见过比这里更安全的地方。
        - id: ch02-b03
          speaker: bobby
          text: 接下来，就得看房子干不干燥。屋里要是潮湿，那可糟透了，住着不舒服，对身体也不好。这里一点儿也不潮。到了冬天，洞里会很暖和。到了夏天，又会很凉快。上哪儿还能找到这么舒服的房子呢？
        - id: ch02-b04
          speaker: bobby
          text: 现在只差一张好床，不过我很快就能铺一张。为了找到这座房子，前面那些罪总算没有白受。好了，我该到外面熟悉一下四周，也看看附近有没有邻居。
        - id: ch02-b05
          speaker: narrator
          text: 博比从窄窄的洞口钻了出去，开始四下察看。
        - id: ch02-b06
          speaker: bobby
          text: 我就沿着这片岩石往前走，看看还有没有这样的山洞。也许能找到一座更好的，不过，我可不大相信。
    - id: ch03
      title: 最近的邻居
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 博比拖着脚步往前走，心里轻松极了，兴奋和好奇满得都快溢出来。你知道，在陌生地方四处探一探，总是好玩得很。
        - id: ch03-b02
          speaker: narrator
          text: 他才走了没多远，就看见岩石间有一座敞开的大山洞。博比停下来，探头往里面瞧，几乎一眼就发现了一张床。
        - id: ch03-b03
          speaker: narrator
          text: 那张床很大，是用干树叶和铁杉的小枝铺成的，看起来舒服极了。更要紧的是，明明不久前还有谁在上面睡过。博比的眼睛一下瞪得溜圆。他抽了抽鼻子，闻了一下。
        - id: ch03-b04
          speaker: narrator
          text: 只这一下就够了。博比猛地转身，两条腿能跑多快就跑多快，一口气逃回自己的小山洞。刚才还让他满心欢喜的新家，现在再也不能让他高兴了。
        - id: ch03-b05
          speaker: narrator
          text: 因为博比已经发现，离他最近的邻居不是别人，正是巴斯特熊！
