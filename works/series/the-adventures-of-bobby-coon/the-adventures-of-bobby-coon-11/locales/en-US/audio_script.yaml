audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: wary and determined
        timbre: small and rough-edged
        pace: quick and tense
        pitch: medium-high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: kind and earnest
        timbre: youthful and clear
        pace: easy and thoughtful
        pitch: medium
  chapters:
    - id: ch01
      title: XI. The Happiest Coon Ever
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Mr. Sun smiles down and makes the whole land bright and fair. In just that way, happiness in the heart spreads joy and gladness everywhere.
        - id: ch01-b02
          speaker: narrator
          text: Bobby Coon couldn't speak the language of Farmer Brown's boy. He had no words to say how much he longed to be free and return to the Green Forest. Still, he did show the boy exactly what was in his heart. He showed him with his eyes, without even knowing it.
        - id: ch01-b03
          speaker: narrator
          text: People sometimes call the eyes the windows of the soul. We look out through our eyes at everything around us, but others can look into them and see what is happening in our minds. Eyes are wonderful that way. They may tell the truth even while a tongue is telling a false story. If you've ever done something wrong, you know how hard it is to look Mother straight in the face and claim you didn't do it. Your truthful eyes give you away.
        - id: ch01-b04
          speaker: narrator
          text: A steady look into the eyes of a fierce wild animal can fill it with fear. Lion trainers and others who handle dangerous animals know that well. Fear appears in the eyes when it shows nowhere else. Happiness and contentment do too, and so do sorrow and worry. A thermometer tells how warm or cold it is. In much the same way, our eyes reveal our feelings.
        - id: ch01-b05
          speaker: narrator
          text: Bobby sat gazing toward the Green Forest, wishing he could tell Farmer Brown's boy that he wanted to go home. The longing in his eyes grew stronger and stronger. The boy saw it, and more than that, he understood. His own eyes softened.
        - id: ch01-b06
          speaker: farmer_browns_boy
          text: You poor little rascal. I think you feel like a prisoner, and you want to go home. Well, I can't see any reason to keep you now. I'm very fond of you, Bobby. I hate to let you go, and I suppose I've already kept you longer than I needed to. Your leg looks as good as ever, so I have no excuse to hold you here any longer. This afternoon, you and I will take a walk.
        - id: ch01-b07
          speaker: narrator
          text: Those words would have made Bobby feel much better if only he could have understood them. But he couldn't. He kept staring toward the Green Forest and grew more homesick by the minute.
        - id: ch01-b08
          speaker: narrator
          text: After dinner, Farmer Brown's boy came outside. He removed Bobby's collar and chain, then lifted him into his arms. The boy didn't cover Bobby's eyes this time, as he had when he carried him away from the Green Forest. Bobby no longer felt so afraid that he wanted to bite and scratch.
        - id: ch01-b09
          speaker: narrator
          text: They crossed the Old Orchard and went straight into the Green Forest. Bobby became more excited with every moment. What was about to happen? What could all this mean?
        - id: ch01-b10
          speaker: narrator
          text: Farmer Brown's boy carried him through the forest to the very spot where Bobby's great hollow tree had once stood. There he gently stroked Bobby's coat and gave him a pat. Then he set Bobby on the ground.
        - id: ch01-b11
          speaker: farmer_browns_boy
          text: Here we are, Bobby. Run along now. Find yourself a new home and be happy. I hope you won't forget me, because I plan to visit you often. Stay out of trouble, and most of all, keep away from the hunters next fall. I'll stop them from hunting here if I can, but I can't watch this place every moment. Good-bye, Bobby. Take care of yourself.
        - id: ch01-b12
          speaker: narrator
          text: Bobby didn't say good-bye because he didn't know how. But great joy shone in his eyes. Farmer Brown's boy saw it and understood. Bobby walked straight off among the trees. Once, he turned to look back. The boy stood watching him and waved one hand.
        - id: ch01-b13
          speaker: bobby_coon
          text: He was good to me. He truly was. I... I think I'm very fond of him too.
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: Then Bobby went on to search for a new home. All the joy of springtime filled his heart. He was free at last! He was home in the Green Forest once again! And he wasn't afraid of Farmer Brown's boy anymore!
        - id: ch01-b15
          speaker: bobby_coon
          text: I'm the happiest coon in the whole world!
          emotion: happy
