audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
    farmer_browns_boy:
      display_name: 布朗家的男孩
      tts:
        delivery: 朴实爽朗，发现新鲜事时充满好奇
        timbre: 明亮清脆的少年嗓音
        pace: 自然而轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 眼睛会说真话
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 快乐的太阳先生笑着俯望，把大地照得又明亮又美丽。一个人的心里有了幸福，也会把欢喜带给四面八方。
        - id: ch01-b02
          speaker: narrator
          text: 博比不会说布朗家的男孩所说的话。他有多想重获自由，回到绿森林，根本没法亲口告诉男孩。可是，他还是用另一种方式说出了心事，那就是他的眼睛。只是连他自己也不知道。
        - id: ch01-b03
          speaker: narrator
          text: 人们有时把眼睛叫作心灵的窗户。你透过眼睛，能看见身边发生的事。别人望进你的眼睛，也可能看见你心里藏着什么。眼睛很奇妙，能告诉我们许多事。
        - id: ch01-b04
          speaker: narrator
          text: 舌头忙着编故事时，眼睛却还在说真话。我想，你也知道这种难处。做错了事以后，你想直视妈妈的脸，让她相信你没犯错，那可真难。因为你的眼睛是诚实的。
        - id: ch01-b05
          speaker: narrator
          text: 要是直盯着凶猛的野兽，它们常常会害怕。训练狮子和其他危险动物的人知道这一点，所以经常这样做。有时，别的地方还看不出恐惧，眼睛已经把它露了出来。
        - id: ch01-b06
          speaker: narrator
          text: 幸福、满足、悲伤和忧虑也都会从眼睛里显出来。温度计会把天气究竟有多暖、有多冷显示出来，眼睛则把我们心里究竟是什么感受，明明白白地显露出来。
    - id: ch02
      title: 男孩看懂了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 博比坐在那里，望着绿森林。他多想告诉布朗家的男孩，自己要回到那儿去啊。那份渴望在眼睛里越积越深。男孩看见了，也看懂了。他的目光柔和下来。
        - id: ch02-b02
          speaker: farmer_browns_boy
          text: 你这个可怜的小淘气鬼。你是不是觉得自己被关起来了，很想回家？好吧，现在也该让你走了。
        - id: ch02-b03
          speaker: farmer_browns_boy
          text: 博比，我真的很喜欢你，喜欢得舍不得你离开。看来，我把你多留了一阵。你的腿已经跟从前一样好，我再没有理由留住你了。今天下午，我们出去走走吧。
        - id: ch02-b04
          speaker: narrator
          text: 可惜博比听不懂。不然，这番话一定会让他好受得多。他仍旧望着绿森林，心里越来越想家。
        - id: ch02-b05
          speaker: narrator
          text: 午饭以后，男孩走出来，解开博比的项圈和链子，把他抱进怀里。这一次，他没有像当初从绿森林带走博比时那样蒙住博比的眼睛。博比也不再怕得又咬又抓了。
        - id: ch02-b06
          speaker: narrator
          text: 他们穿过老果园，径直走向绿森林。博比越来越激动。他不知道接下来会发生什么，也不明白这一切究竟是什么意思。
        - id: ch02-b07
          speaker: narrator
          text: 男孩抱着博比穿过森林，一直来到那棵大空心树从前生长的地方。他替博比理了理毛，轻轻拍了拍，然后把他放在地上。
    - id: ch03
      title: 天下最快乐的浣熊
      blocks:
        - id: ch03-b01
          speaker: farmer_browns_boy
          text: 到了，博比。快去找座新房子，开开心心地生活吧。别忘了我，我会常来看你的。
        - id: ch03-b02
          speaker: farmer_browns_boy
          text: 以后别再惹麻烦。明年秋天，尤其要躲开猎人。只要我拦得住，就不让他们来这里打猎。可我不能一直守着你。再见了，博比，照顾好自己。
        - id: ch03-b03
          speaker: narrator
          text: 博比没有说再见，因为他根本不知道该怎样说。可是，一阵巨大的喜悦涌进了他的眼睛。男孩看见了，也明白了。
        - id: ch03-b04
          speaker: narrator
          text: 博比径直朝树丛深处走去。走了一段，他回头看了看。布朗家的男孩还站在那里望着他，抬手向他挥了挥。
        - id: ch03-b05
          speaker: bobby
          text: 他对我真好。他真的对我很好。我……我想，我是真的很喜欢他。
        - id: ch03-b06
          speaker: narrator
          text: 博比接着往前走，要为自己找一座新房子。整个春天的快乐都在他的心里。他自由了！他又回到了绿森林的家！他再也不害怕布朗家的男孩了！
        - id: ch03-b07
          speaker: bobby
          text: 我是全世界最快乐的浣熊！
          emotion: happy
