audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 狡黠爱打趣，说话拖着悠闲的腔调
        timbre: 干瘦而略带沙哑
        pace: 从容，转折处干脆
        pitch: 中高
    mrs_possum:
      display_name: 负鼠太太
      tts:
        delivery: 泼辣直爽，护起家来毫不客气
        timbre: 尖亮而结实
        pace: 明快有力
        pitch: 高
  chapters:
    - id: ch01
      title: 自由的滋味
      blocks:
        - id: ch01-b01
          speaker: bobby
          text: 回家啦！回家啦！心里真欢喜！要是我有翅膀，准会飞上天去！
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: 博比离开布朗家的男孩以后，就这样一路唱着，在绿森林里到处闲逛。至少，他自己觉得是在唱歌。那其实不大像歌声，因为博比不会唱歌，就跟他不会飞一样。不过，这几句话把他的快乐全唱了出来，而他原本也只想这样。
        - id: ch01-b03
          speaker: narrator
          text: 博比很快乐，实在快乐极了。他怎么想也想不起，自己什么时候这样快活过。直到今天，他才真正明白自由是什么。一个人要是没有先失去自由，再把它找回来，就不会完全知道自由有多么美好，多么值得珍惜。
        - id: ch01-b04
          speaker: narrator
          text: 博比大口大口地呼吸，把早春甜美的气息闻了又闻，还要再闻。绿森林里处处都有这样的气息，可在博比闻来，它们从来没有这么美妙过。他爬上一棵树，不为别的，只为再感受一下爬树的滋味。下了树，他又在落叶间东翻西拱，只因为这么玩很有趣。
        - id: ch01-b05
          speaker: narrator
          text: 博比高兴得满地打滚。滚够了，他掸掉身上的尘土，爬上一截老树桩，坐下来盘算今后的事。
        - id: ch01-b06
          speaker: bobby
          text: 第一件事，当然是找座新房子。其实也不用马上找到，能让我蜷起来睡觉的地方多着呢。不过，有房子更方便，也更体面。要是一个人没有家，只能到处睡，朋友和邻居都会看不起他。连个家都没有，我还怎么瞧得起自己呢？
        - id: ch01-b07
          speaker: bobby
          text: 我一直很喜欢一棵老空心树。比利大叔从前住在那里，不过，也许他已经搬走了。就算没搬，他也可能正好不在家。只要我先进了树洞，他想赶我出来，就得比我想的聪明才行。现在就去看看吧。
    - id: ch02
      title: 看中的空心树
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 博比匆匆爬下树桩，沿着独行小径往前走。走了一阵，他拐进一处洼地，很快就找到了那棵树。
        - id: ch02-b02
          speaker: narrator
          text: 树干又直又高，还很粗。高高的树干上有个洞口，博比钻进去绰绰有余。他坐在树下，抬头仔细打量。看得越久，他越觉得满意。这棵树拿来当房子，真是再合适不过。树干上还有比利大叔用爪子抓出的痕迹，其中几道看着很新。
        - id: ch02-b03
          speaker: bobby
          text: 看样子，比利大叔还住在这里。可这也没办法。里面要是跟外面一样好，我们恐怕就得闹翻了。在绿森林里，谁都要替自己打算。我比他个头大，力气也强，他应该不想跟我打架。要是他在家，我就请他搬出去。
        - id: ch02-b04
          speaker: narrator
          text: 博比这样做当然不对。可绿森林里的居民早就习惯了这种规矩。强者只要办得到，就会拿走自己想要的东西。博比很清楚，要是比利大叔看中了快乐杰克的房子，也会用同样的办法对付他。
        - id: ch02-b05
          speaker: narrator
          text: 于是，博比开始往树上爬，满心认定自己一定会占下这座房子，把它当作新家。才爬到一半，一个尖尖的嗓音忽然从上面传了下来。
        - id: ch02-b06
          speaker: unc_billy_possum
          text: 浣熊兄弟，你是不是弄错啦？这可不是你的房子。
        - id: ch02-b07
          speaker: narrator
          text: 博比停住脚，抬头一看。比利大叔正从门口探下头，咧着嘴冲他笑。博比也咧嘴笑了。
        - id: ch02-b08
          speaker: bobby
          text: 我刚才想到，你说不定正想换个地方住。我又正在找房子，觉得你这一座就挺合适。
        - id: ch02-b09
          speaker: narrator
          text: 博比说完又笑了一次。他知道，比利大叔肯定听明白了。博比这是要他让出房子。
    - id: ch03
      title: 找错了房子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 比利大叔还没开口，他身边又探出一张尖尖的脸。紧接着，一个比他更尖的嗓音响了起来。
        - id: ch03-b02
          speaker: mrs_possum
          text: 那只没出息的浣熊，跑到咱们树上来干什么？我怎么还听见有人说要搬家？告诉你，我可没听说谁要搬！
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: 博比早把负鼠太太忘得干干净净。现在一看，对方有两个，自己只有一个，他立刻改了主意。
        - id: ch03-b04
          speaker: bobby
          text: 对不起。看来，是我找错房子了。
