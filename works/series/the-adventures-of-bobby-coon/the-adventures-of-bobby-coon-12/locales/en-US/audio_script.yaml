audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: wary and determined
        timbre: small and rough-edged
        pace: quick and tense
        pitch: medium-high
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: sly and teasing with a Southern woodland drawl
        timbre: wiry and dry
        pace: easy with sharp turns
        pitch: medium-high
    mrs_possum:
      display_name: Mrs. Possum
      tts:
        delivery: fierce and plainspoken with a Southern woodland drawl
        timbre: sharp and sturdy
        pace: brisk and emphatic
        pitch: high
  chapters:
    - id: ch01
      title: XII. Bobby Tries the Wrong House
      blocks:
        - id: ch01-b01
          speaker: bobby_coon
          text: Home again! Home again! Happy am I! If only I had wings, I surely would fly!
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: That was Bobby Coon's song as he wandered through the Green Forest after leaving Farmer Brown's boy. At least, Bobby meant it as a song. He couldn't truly sing any more than he could fly. Still, it showed how happy he was, and that was all he wanted it to do.
        - id: ch01-b03
          speaker: narrator
          text: Bobby was happier than he could ever remember being. Until then, he had never fully understood what freedom meant. No one can know just how wonderful and blessed freedom is until it has been taken away and then given back.
        - id: ch01-b04
          speaker: narrator
          text: He took long breaths and sniffed again and again at the sweet smells of early spring. The Green Forest was full of them, and they had never smelled so good. He climbed a tree simply to feel what climbing was like again. Then he came back down and poked among the leaves just because it was fun.
        - id: ch01-b05
          speaker: narrator
          text: Bobby rolled over and over for pure joy. At last, he brushed himself off, climbed onto an old stump, and sat there to think.
        - id: ch01-b06
          speaker: bobby_coon
          text: The first thing I need is a new house. I don't need one this minute. There are plenty of places where I can curl up and nap. But having a house is much more convenient, and much more respectable, too. Friends and neighbors never think much of anyone who sleeps anywhere and has no home. How could I respect myself without one?
        - id: ch01-b07
          speaker: bobby_coon
          text: There's an old hollow tree I've always liked. Unc' Billy Possum used to live there, but perhaps he's moved away. Even if he hasn't, he may be out. Once I'm inside, he'll have to be smarter than I think he is if he wants to get me out again. I'll go take a look at that tree right now.
        - id: ch01-b08
          speaker: narrator
          text: Bobby scrambled off the stump and set off down the Lone Little Path. After a while, he left the path, went into a hollow, and soon reached the tree he had been thinking about.
        - id: ch01-b09
          speaker: narrator
          text: The tree was straight, tall, and big. Far above the ground was a doorway, and it was easily large enough for Bobby. He sat below and studied it. The longer he looked, the more certain he became that it would make a first-rate house.
        - id: ch01-b10
          speaker: narrator
          text: Claw marks covered the tree. They had been made by Unc' Billy Possum, and some looked quite fresh.
        - id: ch01-b11
          speaker: bobby_coon
          text: It certainly looks as if Unc' Billy still lives here. Well, I can't help that. If the inside is as good as the outside, he and I may have a quarrel. Everyone looks after himself in the Green Forest, and I don't believe Unc' Billy will want to fight me. I'm bigger and much stronger. If he's home, I'll simply ask him to move out.
        - id: ch01-b12
          speaker: narrator
          text: Of course, Bobby had no right to do such a thing. But that was how matters were settled in the Green Forest, and everyone who lived there was used to it. The strong took what they wanted whenever they could. Bobby knew that Unc' Billy would do the same to Happy Jack Squirrel if he happened to want Happy Jack's house.
        - id: ch01-b13
          speaker: narrator
          text: So Bobby started up the tree, feeling quite sure that he had found his new home. He was halfway up when a sharp voice called to him.
        - id: ch01-b14
          speaker: unc_billy_possum
          text: Haven't yo' made a mistake, Brer Coon? This house doesn't belong to yo'.
        - id: ch01-b15
          speaker: narrator
          text: Bobby stopped climbing and looked above him. Unc' Billy Possum was at the doorway, grinning down. Bobby grinned right back.
        - id: ch01-b16
          speaker: bobby_coon
          text: I thought you might be ready to move somewhere else. I'm searching for a house, and this one would suit me very well.
        - id: ch01-b17
          speaker: narrator
          text: Bobby gave him another grin. He knew Unc' Billy would understand exactly what he meant.
        - id: ch01-b18
          speaker: narrator
          text: Before Unc' Billy could answer, another sharp face appeared beside his. Then an even sharper voice spoke.
        - id: ch01-b19
          speaker: mrs_possum
          text: What's that no-'count Coon doing in our tree? And what's all this Ah hear about moving? Nobody Ah know is going anywhere!
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: Bobby had completely forgotten about old Mrs. Possum. Now that he saw there were two of them and only one of him, he quickly changed his mind.
        - id: ch01-b21
          speaker: bobby_coon
          text: Excuse me. I believe I've come to the wrong house.
