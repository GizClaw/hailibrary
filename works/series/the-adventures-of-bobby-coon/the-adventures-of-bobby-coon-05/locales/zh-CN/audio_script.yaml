audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
    farmer_browns_boy:
      display_name: 布朗家的男孩
      tts:
        delivery: 朴实爽朗，发现新鲜事时充满好奇
        timbre: 明亮清脆的少年嗓音
        pace: 自然而轻快
        pitch: 中高
    bowser:
      display_name: 猎犬鲍泽
      tts:
        delivery: 忠诚活泼，追踪时兴奋急切，吃痛时响亮慌乱
        timbre: 浑厚有力
        pace: 急促而富有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 被困在家里
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 谁为家园勇敢抵抗，谁就知道此举应当。若是转身夹尾逃跑，世人准说他是胆小。
        - id: ch01-b02
          speaker: narrator
          text: 博比就是想逃，也逃不掉。只要有一丁点儿机会，我猜他早就高高兴兴地跑了。可现在，他偏偏成了自己家里的囚徒，想出去也没有路。
        - id: ch01-b03
          speaker: narrator
          text: 门口传来鲍泽呼哧呼哧的嗅闻声，随后又响起急切的叫声。博比知道，鲍泽已经发现他在家了。这时候他本来也不想出去。鲍泽进不来，他留在原地反倒很安心。
        - id: ch01-b04
          speaker: narrator
          text: 没过多久，博比听见布朗家的男孩说话。他一个字也听不懂，心却一下沉到了脚底。至少，他自己觉得心已经沉到了那里。单听那口气，他就知道男孩听懂了鲍泽的意思，也知道空心树里有人在家。
        - id: ch01-b05
          speaker: narrator
          text: 博比猜得没错。鲍泽呜咽着，又叫又跳。男孩不懂他的狗话，却完全明白他想说什么。
        - id: ch01-b06
          speaker: farmer_browns_boy
          text: 鲍泽，老伙计，里面是谁呀？是松鼠，还是白足林鼠？难道是那个滑头又淘气的负鼠比利大叔？
        - id: ch01-b07
          speaker: bowser
          text: 汪，汪，汪！
        - id: ch01-b08
          speaker: narrator
          text: 鲍泽一边回答，一边在博比家门口嗅来嗅去，兴奋得直蹦。
        - id: ch01-b09
          speaker: farmer_browns_boy
          text: 我还是听不懂。不过别急，鲍泽，我这就把答案找出来。
        - id: ch01-b10
          speaker: narrator
          text: 男孩笑着拿起斧头。
    - id: ch02
      title: 光照进树洞
      blocks:
        - id: ch02-b01
          speaker: bowser
          text: 汪，汪！汪，汪，汪，汪！
        - id: ch02-b02
          speaker: narrator
          text: 鲍泽比刚才更兴奋了。男孩先请农夫布朗拉住他，不让他靠近洞口，接着用斧头沿着树干的空心处一路敲过去。他每敲一下，都盼着能把里面那个家伙吓出来，让对方自己往外跑。
        - id: ch02-b03
          speaker: narrator
          text: 可家门已经堵住了一部分，博比根本出不去。就算能出去，他也不会动。在他看来，还是待在原地安全。
        - id: ch02-b04
          speaker: narrator
          text: 男孩沿着树干敲了半天，一点儿用也没有，刚才那番工夫全白费了。他便把锋利的斧刃砍进洞口边缘，农夫布朗也拿起自己的斧头来帮忙。
        - id: ch02-b05
          speaker: narrator
          text: 没过几分钟，两人就劈开了一道长长的缺口，一直通到博比蜷缩的地方。光猛地涌进来，刺得他直眨眼。足足一两分钟，他几乎什么也看不清。
    - id: ch03
      title: 博比奋起抵抗
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 光一照进来，鲍泽马上发现了博比。他凶狠地低吼着，拼命想扑到博比跟前。可是洞口还不够宽，他只能把鼻子伸进去。博比半点儿也没迟疑，立刻张开尖牙，一口咬住了它。
        - id: ch03-b02
          speaker: bowser
          text: 嗷呜——！噢——！松口！快松口！
        - id: ch03-b03
          speaker: bobby
          text: 呃——呜——！
        - id: ch03-b04
          speaker: narrator
          text: 博比低吼着，还想咬得更深。鲍泽又叫又号，猛甩着脑袋，使出全身力气往外挣。博比终于不得不松了口。
        - id: ch03-b05
          speaker: narrator
          text: 布朗家的男孩赶紧凑到洞口往里看。他看到的，是一嘴正朝自己咔嚓乱咬的尖牙。
        - id: ch03-b06
          speaker: narrator
          text: 博比也许怕得要命，可他一点儿也没显出来。没有，先生，他就是没显出来。他让人看见的，只有一件事。他要为自己的性命、自由和家园奋战到底。
        - id: ch03-b07
          speaker: narrator
          text: 布朗家的男孩探头望进去，只见浣熊博比凶猛极了。
