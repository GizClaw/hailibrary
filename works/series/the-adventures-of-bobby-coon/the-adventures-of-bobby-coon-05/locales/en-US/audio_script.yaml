audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: wary and determined
        timbre: small and rough-edged
        pace: quick and tense
        pitch: medium-high
    bowser_the_hound:
      display_name: Bowser the Hound
      tts:
        delivery: eager and boisterous
        timbre: deep and full
        pace: brisk
        pitch: low
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: curious and good-humored
        timbre: youthful and clear
        pace: lively
        pitch: medium
  chapters:
    - id: ch01
      title: V. Bobby Coon Shows Fight
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Who for his home does bravely fight
            Is doing what he knows is right.
            The world would call him cowardly
            If he turned tail and tried to flee.
        - id: ch01-b02
          speaker: narrator
          text: Bobby Coon couldn't run away, even if he wanted to. And I suspect he would have been glad to run if he'd had the smallest chance. But he was trapped inside his own home. He couldn't get out through the partly closed doorway.
        - id: ch01-b03
          speaker: narrator
          text: Just then, Bobby didn't want to leave anyway. He heard Bowser the Hound sniffing deeply at the opening, then barking with excitement. That told Bobby that Bowser knew he was home. Bowser couldn't get inside, so Bobby was quite content to stay where he was.
        - id: ch01-b04
          speaker: narrator
          text: Before long, Bobby heard Farmer Brown's boy. He couldn't understand the boy's words, but his heart seemed to sink all the way to his toes. From the sound of that voice, Bobby knew the boy had understood Bowser. Now the boy knew someone was hiding in the hollow tree.
        - id: ch01-b05
          speaker: narrator
          text: Bobby was exactly right. Farmer Brown's boy couldn't understand Bowser's whining and yelping word for word, but he understood perfectly well what Bowser meant.
        - id: ch01-b06
          speaker: farmer_browns_boy
          text: Who have you found, old fellow? Is it a squirrel? Maybe Whitefoot the Wood Mouse? Or could it be that sly old rascal, Unc' Billy Possum?
        - id: ch01-b07
          speaker: bowser_the_hound
          text: Bow, wow, wow!
        - id: ch01-b08
          speaker: narrator
          text: Bowser danced around, stopping again and again to sniff at Bobby's doorway.
        - id: ch01-b09
          speaker: farmer_browns_boy
          text: I don't know what you're trying to tell me, Bowser, but I'm going to find out.
        - id: ch01-b10
          speaker: narrator
          text: Farmer Brown's boy laughed and picked up his axe.
        - id: ch01-b11
          speaker: bowser_the_hound
          text: Bow, wow! Bow, wow, wow, wow!
        - id: ch01-b12
          speaker: narrator
          text: Bowser grew more excited than ever. First, Farmer Brown's boy asked Farmer Brown to hold Bowser away from the opening. Then the boy took his axe and thumped all along the hollow part of the tree. He hoped the noise would frighten whoever was inside and send them running out.
        - id: ch01-b13
          speaker: narrator
          text: But Bobby couldn't get out through his partly blocked doorway. Even if he could have escaped, he wouldn't have tried. He felt safer right where he was. So all that thumping did no good.
        - id: ch01-b14
          speaker: narrator
          text: When Farmer Brown's boy saw that his plan wasn't working, he struck the sharp edge of his axe into the tree beside Bobby's doorway. Farmer Brown began chopping too. In only a few minutes, they had cut away a long strip of wood, all the way to the place where Bobby crouched.
        - id: ch01-b15
          speaker: narrator
          text: Light poured into the hollow. Bobby had to blink, and for a minute or two he could hardly see.
        - id: ch01-b16
          speaker: narrator
          text: Bowser spotted him at once. With a savage growl, the hound tried to reach him. The opening was still too narrow for Bowser to get through. He could push in only his nose, and Bobby promptly caught it between his sharp teeth.
        - id: ch01-b17
          speaker: bowser_the_hound
          text: Yow-w-w! Oh-o-o! Let go! Let me go!
        - id: ch01-b18
          speaker: bobby_coon
          text: Gr-r-r-r-r!
        - id: ch01-b19
          speaker: narrator
          text: Bobby tried to bite down even harder. Bowser yelped and howled. He shook his head and pulled with all his might, until Bobby finally had to let go.
        - id: ch01-b20
          speaker: narrator
          text: Farmer Brown's boy hurried over and peered inside. He found a mouthful of sharp teeth snapping at him. Bobby Coon might have been terribly afraid, but he didn't show it. No, sir, he didn't show it at all.
        - id: ch01-b21
          speaker: narrator
          text: What Bobby did show was that he meant to fight for his life, his freedom, and his home.
        - id: ch01-b22
          speaker: narrator
          text: And as Farmer Brown's boy looked in at him, Bobby Coon looked very fierce indeed.
