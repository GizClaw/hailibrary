audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
    farmer_brown:
      display_name: 农夫布朗
      tts:
        delivery: 亲切务实，说话沉稳利落
        timbre: 厚实温暖
        pace: 从容
        pitch: 低
    farmer_browns_boy:
      display_name: 布朗家的男孩
      tts:
        delivery: 朴实爽朗，发现新鲜事时充满好奇
        timbre: 明亮清脆的少年嗓音
        pace: 自然而轻快
        pitch: 中高
    bowser:
      display_name: 猎犬鲍泽
      tts:
        delivery: 忠诚活泼，追踪时兴奋急切，吃痛时响亮慌乱
        timbre: 浑厚有力
        pace: 急促而富有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 第七章　博比踏上一次奇怪的旅程
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 说来也怪，人常常到最后才发现，那些烦恼大半只装在自己的心里。
        - id: ch01-b02
          speaker: narrator
          text: 这话一点儿不假。叫人坐立不安的烦恼，四分之三以上根本没有真的发生。人们怕一件事快要来了，越想越愁，愁到后来，认准它一定躲不过。结果呢，那件事压根儿没来。有些看起来很糟的事，到头来反而成了福气。我们谁没白白担心过呢？我就常这样。浣熊博比经历这趟奇怪的旅程时，也跟我们一样。现在就来听听他的故事。
        - id: ch01-b03
          speaker: narrator
          text: 农夫布朗、他家的男孩和猎犬鲍泽，眼看着博比爬出毁掉的家，动身去找新住处。他们立刻看出不对劲。博比只有三条腿着地，剩下那条一直悬在空中。
        - id: ch01-b04
          speaker: farmer_browns_boy
          text: 可怜的小家伙。树倒下来的时候，准是砸伤了他的腿。但愿伤得不厉害。我们再等等，看他想做什么。
        - id: ch01-b05
          speaker: narrator
          text: 他们继续躲在那里，悄悄看着。博比走到一棵树下，想往上爬。他试了一次，却没有成功。少了一条腿帮忙，他根本爬不上去，只好在树下缩成一团。男孩看到这里，知道博比伤得很重。
        - id: ch01-b06
          speaker: farmer_browns_boy
          text: 不能扔下他不管。再这样受苦，他说不定会死的。
        - id: ch01-b07
          speaker: narrator
          text: 男孩说完就冲了出去，农夫布朗留在后面拉住鲍泽。博比听见脚步声，马上转过身来。他打定主意，要勇敢地迎战。
        - id: ch01-b08
          speaker: narrator
          text: 男孩一跑到跟前，就把自己的外套罩在博比身上。博比拼命挣扎，可男孩还是把他抱了起来，又用外套严严实实地裹住他。这样一来，博比既不能咬，也不能抓，完全动弹不得。
        - id: ch01-b09
          speaker: farmer_browns_boy
          text: 我先把他带回家，给他安顿好。弄妥了我就回来！
        - id: ch01-b10
          speaker: farmer_brown
          text: 好吧。
        - id: ch01-b11
          speaker: narrator
          text: 农夫布朗答应时，眼里带着慈爱的笑意。男孩抱着博比往家走，一路上尽量轻手轻脚。
        - id: ch01-b12
          speaker: narrator
          text: 外套蒙住了博比的脑袋，他看不见自己正被带往哪里。男孩方才说的话，他也一个字都不懂。可怕的事情，他倒能想出一件又一件，而且越想越怕。他认定，等这趟旅程一结束，最糟糕的事情就会落到自己头上。博比已经不抱一点儿希望了。他老老实实地待着，只因为没法反抗，除此之外什么也做不了。
        - id: ch01-b13
          speaker: narrator
          text: 这一路，博比一直在猜，他们究竟要把自己带到哪儿去。他觉得自己再也见不到绿森林了。断腿疼得钻心，可他更怕旅程终点等着自己的东西，怕得几乎忘了疼。
        - id: ch01-b14
          speaker: narrator
          text: 博比活到这么大，第一次不是靠自己的四只脚赶路。就算心里没有那些恐惧，被人这样抱着走，滋味也够古怪的。他盼着旅程赶快结束，却又希望永远别到终点。因为在他想来，只要一到地方，那件最可怕的事就要发生了。
        - id: ch01-b15
          speaker: narrator
          text: 就这样，男孩抱着浣熊博比，先穿过绿森林，再穿过老果园，最后走过农家庭院，把他带进了谷仓。
        - id: ch01-b16
          speaker: narrator
          text: 这是博比经历过最奇怪的一趟旅程，也是最可怕的一趟。可他要是知道真相，就会明白，这一路原本一点儿也不可怕。
