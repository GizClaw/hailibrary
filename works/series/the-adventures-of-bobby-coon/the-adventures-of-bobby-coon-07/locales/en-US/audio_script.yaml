audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    farmer_brown:
      display_name: Farmer Brown
      tts:
        delivery: kindly and practical
        timbre: sturdy and warm
        pace: unhurried
        pitch: low
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: youthful, earnest, and compassionate
        timbre: clear and bright
        pace: natural and attentive
        pitch: medium-high
  chapters:
    - id: ch01
      title: VII. Bobby Has a Strange Journey
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            It's funny how you'll often find
            That trouble's mostly in your mind.
        - id: ch01-b02
          speaker: narrator
          text: It's true. More than three quarters of the troubles people worry about aren't real troubles at all. People fear that something is going to happen. They worry until they're sure it will happen, and then it doesn't happen at all.
        - id: ch01-b03
          speaker: narrator
          text: Very often, something that seems bad turns out to be a blessing. We all worry a great deal for nothing. I know I do. And Bobby Coon did, too, when he took the strange journey I'm going to tell you about.
        - id: ch01-b04
          speaker: narrator
          text: Farmer Brown, Farmer Brown's Boy, and Bowser the Hound had watched Bobby crawl from his ruined home and set off to find a new one. They could see at once that something was wrong. Bobby walked on three legs and held the fourth one off the ground.
        - id: ch01-b05
          speaker: farmer_browns_boy
          text: Oh, that poor little fellow. The falling tree must have injured his leg. I hope it isn't serious. Let's stay here a little longer and watch what he does.
        - id: ch01-b06
          speaker: narrator
          text: They stayed hidden and watched. Bobby went to the foot of a tree as though he meant to climb it. He tried, but with only three good legs he couldn't climb. Then he crouched on the ground. Now Farmer Brown's Boy knew that Bobby was badly hurt.
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: We can't just leave him here. He'll suffer, and he may not survive.
        - id: ch01-b08
          speaker: narrator
          text: Farmer Brown's Boy ran toward Bobby while Farmer Brown held Bowser back.
        - id: ch01-b09
          speaker: narrator
          text: Bobby heard him coming. At once, he turned to face him, ready to fight bravely. When the boy came close enough, he tossed his coat over Bobby. Bobby struggled wildly, but the boy gathered him up and wrapped the coat around him. Bobby could neither bite nor scratch. He was helpless.
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: I'll carry him home and make him comfortable. Then I'll come right back.
        - id: ch01-b11
          speaker: farmer_brown
          text: All right.
        - id: ch01-b12
          speaker: narrator
          text: Farmer Brown answered with a kindly twinkle in his eyes. Then his boy started home, carrying Bobby as gently as he could.
        - id: ch01-b13
          speaker: narrator
          text: Bobby couldn't see where they were going because the coat covered his head. He hadn't understood one word the boy had said, either. But Bobby could imagine all kinds of dreadful things, and that was exactly what he did.
        - id: ch01-b14
          speaker: narrator
          text: He was sure the very worst thing possible would happen when the journey ended. Bobby Coon had no hope at all. He kept still only because he had to. There was nothing else he could do.
        - id: ch01-b15
          speaker: narrator
          text: All the while, Bobby wondered where he was being taken. He felt sure he would never see the Green Forest again. His broken leg hurt terribly, but his fear of the journey's end almost made him forget the pain.
        - id: ch01-b16
          speaker: narrator
          text: Never before had Bobby traveled anywhere except on his own four feet. Even without the fear, being carried gave him a very strange feeling. He kept wishing the journey would end soon. At the same time, he didn't want it to end, because he felt certain something terrible was waiting for him then.
        - id: ch01-b17
          speaker: narrator
          text: So Bobby was carried through the Green Forest, then through the Old Orchard, and finally across the barnyard to the barn. It was the strangest journey he had ever known, and the most terrible. Yet it didn't need to be terrible at all, if only Bobby could have known the truth.
