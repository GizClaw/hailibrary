  chapters:
    - id: ch01
      title: IV. Bowser Finds Someone at Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Now Bobby Coon knew what had frightened him, but knowing didn't make him feel any better. It made him feel worse. Before, he had imagined all kinds of terrible things. None of them was as bad as the truth. Farmer Brown and his boy were cutting down Bobby's house, the big hollow chestnut tree where he had lived for so long and gone happily to sleep at the start of winter. Bowser the Hound sat watching them.
        - id: ch01-b02
          speaker: narrator
          text: There wasn't another tree close enough for Bobby to jump into. He couldn't even reach a nearby branch. His only way out led straight down to the sharp axes and the place where Bowser sat watching. What chance did Bobby have? None at all. Not the least chance in the world, or so it seemed to him. He didn't know Farmer Brown or Farmer Brown's boy, and that made all the difference.
        - id: ch01-b03
          speaker: narrator
          text: All this time, Bobby had been terribly frightened. Yet Farmer Brown, his boy, and Bowser knew nothing about it. Not one of them had even thought of Bobby Coon. They had no idea that the old chestnut was his home. If Farmer Brown's boy had known, I suspect he would have found a good reason not to cut it. But he didn't know. He swung his axe with all his strength because he wanted to show his father that he could do a man's work.
        - id: ch01-b04
          speaker: narrator
          text: Why were they cutting down the chestnut tree? It was almost dead. Farmer Brown had decided it was no longer useful except as firewood for the house. Once it was gone, the young trees springing up around it would have a better chance to grow. Otherwise, the old tree would keep getting weaker. It might finally fall in a great storm and break down some of those young trees. Better to cut it now, Farmer Brown had decided, before that could happen.
        - id: ch01-b05
          speaker: narrator
          text: Tommy Tit the Chickadee knew Farmer Brown and his boy. So did Happy Jack Squirrel and some of the other forest folk. If Bobby had known them that well, he would have climbed straight down without the tiniest bit of fear. He would have known he was safe. But Bobby didn't know them. He felt helpless and hopeless, and that is a dreadful way to feel.
        - id: ch01-b06
          speaker: narrator
          text: For a while, Bobby peered through his doorway. He watched the sharp axes rise and fall, sending yellow chips flying. Then he crept unhappily back to bed to wait for the worst. He simply didn't know what else to do.
        - id: ch01-b07
          speaker: narrator
          text: After a time, there came a terrible crack, then another, and another. Farmer Brown shouted. His boy shouted too, and Bowser barked with excitement. The big tree slowly began to lean. Then it fell faster and faster. Bobby grew dizzy and sick. He felt very sick indeed.
        - id: ch01-b08
          speaker: narrator
          text: The tree struck the ground with a frightful crash. For several minutes, Bobby knew nothing at all. No, sir, not one single thing. The fall had hurled him against the side of his house so hard that it knocked the breath from his body and every bit of sense from his head.
        - id: ch01-b09
          speaker: narrator
          text: After a little while, Bobby's senses came back. Then he discovered how the tree had landed. The hole that had been his doorway was partly blocked. Bobby was now a prisoner inside his own house.
        - id: ch01-b10
          speaker: narrator
          text: Oddly enough, Bobby didn't mind as much as you might think. A tiny bit of hope returned. Perhaps Farmer Brown and his boy wouldn't notice the hollow. Perhaps, after a while, they would leave.
        - id: ch01-b11
          speaker: narrator
          text: Then Bowser the Hound ruined that hope. He came to the fallen tree and sniffed his way along the trunk. When he reached the partly blocked hole that had been Bobby's doorway, he began to whine and bark excitedly. Bowser pushed his nose in as far as it would go and sniffed. Then he raised his head and barked. After that, he scratched wildly at the hole.
        - id: ch01-b12
          speaker: farmer_browns_boy
          text: Well, look at that! Bowser's found somebody at home. I wonder who it could be.
          emotion: surprised
