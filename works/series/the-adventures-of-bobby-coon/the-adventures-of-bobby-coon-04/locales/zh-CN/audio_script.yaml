audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
    farmer_browns_boy:
      display_name: 布朗家的男孩
      tts:
        delivery: 朴实爽朗，发现新鲜事时充满好奇
        timbre: 明亮清脆的少年嗓音
        pace: 自然而轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 一点儿机会也没有
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 博比如今总算知道是什么吓着了自己，可他并没有好受一点，反倒更难受了。先前，他只是在心里猜想种种可怕的事。可不管怎么猜，都没有眼前的事实这么糟。
        - id: ch01-b02
          speaker: narrator
          text: 那棵巨大的空心栗树，是他住了许多年的家。入冬时，他还满心欢喜地在里面睡着了。现在，农夫布朗和布朗家的男孩却在砍它，猎犬鲍泽就在一旁守着。
        - id: ch01-b03
          speaker: narrator
          text: 附近没有哪棵树近得能让博比跳过去。唯一的出口就在下面，可锋利的斧头正在那里劈个不停，鲍泽也坐在那里盯着。他还有机会逃走吗？没有，连一丁点儿机会也没有。至少博比自己是这么想的，因为他根本不了解农夫布朗父子。
        - id: ch01-b04
          speaker: narrator
          text: 你瞧，博比在树洞里怕得要命，树下的农夫布朗、他的男孩，还有鲍泽，却一点儿也不知道。他们谁都没想到博比，更不知道这棵大栗树就是他的家。
        - id: ch01-b05
          speaker: narrator
          text: 要是布朗家的男孩早知道，我猜他准会找个好理由，不肯砍这棵树。可他不知道，只想让父亲看看，自己已经能干大人的活儿了。所以，他挥起斧头，砍得可起劲了。
    - id: ch02
      title: 他们为什么砍树
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他们为什么要砍倒这棵大栗树呢？原来，这棵树差不多已经枯死了。农夫布朗觉得，它除了劈成柴拿回家生火，再也派不上别的用场。
        - id: ch02-b02
          speaker: narrator
          text: 砍掉老树，周围那些新长的小树就能长得更好。要是任它一年年衰弱下去，它早晚会在一场大风暴里倒下，还可能压坏身边的小树。所以，还不如现在就把它砍倒。
        - id: ch02-b03
          speaker: narrator
          text: 山雀汤米·蒂特了解农夫布朗父子，松鼠快乐杰克也了解他们，还有些小动物同样了解他们。博比要是也像这些朋友一样，早就从树上直接爬下去了，连一丁点儿害怕也不会有。
        - id: ch02-b04
          speaker: narrator
          text: 因为那样，他就会知道自己绝不会受到伤害。偏偏博比不了解他们，只觉得没人能帮他，也看不见半点儿希望。这样的滋味，实在糟透了。
    - id: ch03
      title: 大树倒下了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 博比在家门口探头看了一会儿。下面的斧头闪着锋利的光，黄色木屑四处飞溅。他苦着脸爬回床上，等着最可怕的事情降临。除此以外，他实在不知道还能做什么。
        - id: ch03-b02
          speaker: narrator
          text: 过了一阵，树身猛地发出一声可怕的咔嚓声。紧接着，又是一声，再一声。农夫布朗喊了起来，布朗家的男孩也跟着喊。鲍泽兴奋得汪汪直叫。
        - id: ch03-b03
          speaker: narrator
          text: 大树慢慢歪向一边，接着越倒越快。博比只觉得天旋地转，难受极了。真的，他难受得厉害。
        - id: ch03-b04
          speaker: narrator
          text: 随着一声吓人的巨响，大树轰然砸在地上。接下来的好几分钟，博比什么也不知道。没错，先生，他一件事也不知道。
        - id: ch03-b05
          speaker: narrator
          text: 大树撞上地面时，博比被狠狠抛到树洞的内壁上。他撞得气都喘不过来，脑子也完全失去了知觉。
        - id: ch03-b06
          speaker: narrator
          text: 过了一会儿，他才渐渐清醒。大树落地的位置很不巧，原来作为家门的洞口被堵住了一部分。博比被关在了自己的家里。
    - id: ch04
      title: 鲍泽发现家里有人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 你也许以为博比会更难受，可他倒没有。他心里甚至冒出了一丁点儿希望。也许农夫布朗父子不会发现这个树洞，过些时候，他们就会走开。
        - id: ch04-b02
          speaker: narrator
          text: 可鲍泽一下子毁掉了这点希望。他来到倒下的大树旁，贴着树干一路嗅过去。到了那个被堵住一部分的洞口，也就是博比家的门口，他忽然呜呜低叫，又兴奋地汪汪吠起来。
        - id: ch04-b03
          speaker: narrator
          text: 鲍泽把鼻子往洞里使劲伸，能伸多深就伸多深。他闻上一阵，又抬起头来叫几声。
        - id: ch04-b04
          speaker: narrator
          text: 叫过以后，他又发了疯似的抓挠洞口。
        - id: ch04-b05
          speaker: farmer_browns_boy
          text: 嘿！鲍泽发现家里有人啦！不知道会是谁呢。
          emotion: surprised
