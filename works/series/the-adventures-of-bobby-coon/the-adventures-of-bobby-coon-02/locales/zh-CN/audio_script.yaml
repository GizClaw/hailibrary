audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
  chapters:
    - id: ch01
      title: 到底醒了没有
      blocks:
        - id: ch01-b01
          speaker: bobby
          text: 谁能行行好，告诉我？我已经醒了，还是这个梦根本没完？
        - id: ch01-b02
          speaker: narrator
          text: 浣熊博比朝四下里喊着，可谁也没有听见，因为那里根本没有别人。他心里乱成一团，怎么都弄不清自己究竟醒着，还是依旧睡着。你还能想出比这更糟的滋味吗？
        - id: ch01-b03
          speaker: narrator
          text: 刚才那个噩梦还清清楚楚。大巨人把博比追进一截空心木头，又举起大木棒，一下下猛敲。那轰鸣震得他耳朵发麻，脑袋生疼，浑身直冒寒气，他几乎吓丢了命。
        - id: ch01-b04
          speaker: narrator
          text: 你可别忘了，这些全都发生在梦里。博比正准备不顾巨人，硬着头皮冲出去，眼睛忽然睁开了。原来他平平安安地躺在床上，就在那棵属于自己的空心栗树里。
        - id: ch01-b05
          speaker: narrator
          text: 博比高兴地舒了口气。谢天谢地，那场可怕的遭遇只是个梦。
        - id: ch01-b06
          speaker: bobby
          text: 呼！这个梦太糟了，真是糟透了！
        - id: ch01-b07
          speaker: narrator
          text: 可他才说完，就又吓得尖叫起来。那骇人的敲击声竟然又响了！
    - id: ch02
      title: 咚，咚，咚
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 博比这下更糊涂了。他是在梦里，还是已经醒了？声音明明和梦里敲空心木头时一样，可他现在待在自己的家里，正躺在暖和的床上呀。
        - id: ch02-b02
          speaker: narrator
          text: 难道事情正照着梦里那种古怪的法子发展？也许博比自己都不知道，就已经回到了家，而那个可怕的大巨人也追了过来。对，一定是这样。他肯定还在做梦，只盼自己快点醒来。
        - id: ch02-b03
          speaker: narrator
          text: 博比紧紧闭上眼睛，闭了好几分钟。可耳边还是咚，咚，咚，一记记重响不停砸下来。
        - id: ch02-b04
          speaker: narrator
          text: 他再次睁眼。这里分明就是自己的空心树，他也觉得自己清醒得很。阳光正从头顶高高的洞口探进来，可那可怕的声音仍旧响着。咚，咚，咚。
        - id: ch02-b05
          speaker: narrator
          text: 博比的头比刚才疼得更厉害。每响一下，他就猛跳一下，一股寒意也跟着从尾巴根窜到鼻尖。
    - id: ch03
      title: 咬一口尾巴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 博比活了这么久，还从没糊涂成这样。他忍不住呜咽起来。
        - id: ch03-b02
          speaker: bobby
          text: 这到底是不是我？我是还在做梦，却以为自己醒了？还是我已经醒了，可梦还没有停？
        - id: ch03-b03
          speaker: bobby
          text: 我想到办法了。我咬一下尾巴，要是感觉得到，就证明我已经醒了。
        - id: ch03-b04
          speaker: narrator
          text: 博比把尾巴尖含进嘴里，轻轻咬了一口。可他马上又怀疑起来，刚才是真的有感觉，还是他以为自己有感觉？于是他再咬一口，这次可用力多了。
        - id: ch03-b05
          speaker: bobby
          text: 哎哟！好疼！那我一定醒了，绝对醒了。可我既然醒着，现在到底出了什么可怕的事？外面难道真有一个大巨人，正在敲我的树？
        - id: ch03-b06
          speaker: narrator
          text: 接着，博比发现，每一下重击都会让他的房子微微发抖。起初他还以为这是错觉，直到把两只手贴上树壁，亲手摸到了那阵震颤。
        - id: ch03-b07
          speaker: narrator
          text: 博比心里猛地一沉。这一次，他确定自己真的醒了，也确定自己的空心树正遭遇一件可怕的事。可那究竟是什么，他一点也猜不到。
        - id: ch03-b08
          speaker: narrator
          text: 更糟的是，博比怕得根本不敢爬到高处的洞口，也不敢探头看看外面究竟出了什么事。
