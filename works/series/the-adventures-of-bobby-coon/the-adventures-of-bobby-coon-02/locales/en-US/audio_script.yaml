audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: youthful, expressive, and earnest
        timbre: bright and soft
        pace: lively with nervous pauses
        pitch: medium-high
  chapters:
    - id: ch01
      title: II. Bobby Bites His Own Tail
      blocks:
        - id: ch01-b01
          speaker: bobby_coon
          text: |-
            Oh, someone please tell me,
            am I awake, or am I still dreaming?
          emotion: fearful
        - id: ch01-b02
          speaker: narrator
          text: Bobby Coon cried out, though no one was there to hear him. He was terribly confused. He couldn't tell whether he was awake or still asleep and dreaming. Can you think of a worse feeling than that?
        - id: ch01-b03
          speaker: narrator
          text: In his dreadful dream, a giant had chased him into a hollow log. Then the giant had struck the log with a huge club. The blows had nearly frightened Bobby to death. A terrible roaring filled his ears, his head ached, and cold shivers ran all over him.
        - id: ch01-b04
          speaker: narrator
          text: Still dreaming, Bobby was just gathering the courage to rush out of the log and face the giant. Then his eyes flew open. He was safe in his own bed inside the hollow chestnut tree.
        - id: ch01-b05
          speaker: narrator
          text: Bobby let out a happy little sigh. What a relief to discover that the dreadful adventure had only been a dream!
        - id: ch01-b06
          speaker: bobby_coon
          text: Whew! What a terrible dream that was!
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: At once, Bobby gave a frightened little squeal. That awful pounding had started again! He heard the same dreadful blows from the dream, but now he wasn't inside a hollow log. He was home in his warm bed. Was he awake, or was he still dreaming?
        - id: ch01-b08
          speaker: narrator
          text: Perhaps he had returned home without knowing it, the way strange things happen in dreams. Perhaps the dreadful giant had followed him there. Yes, that must be it. He must still be dreaming. Oh, how he wished he could wake up!
        - id: ch01-b09
          speaker: narrator
          text: Bobby squeezed his eyes shut as tightly as he could and kept them closed for several minutes. Pound, pound, pound went the dreadful blows. Then he opened his eyes again.
        - id: ch01-b10
          speaker: narrator
          text: This surely was his hollow tree, and he certainly felt wide awake. Sunlight was peeking through his doorway, far above him. But the terrible blows kept coming. Pound, pound, pound! His head hurt worse than ever. At every blow, Bobby jumped, and a cold shiver ran from the roots of his tail right up to the tip of his nose.
        - id: ch01-b11
          speaker: narrator
          text: Bobby had never felt so mixed up in his life.
        - id: ch01-b12
          speaker: bobby_coon
          text: Is this really me, or isn't it? Am I dreaming that I'm awake? Or am I awake and somehow still dreaming?
          emotion: fearful
        - id: ch01-b13
          speaker: bobby_coon
          text: I know what to do. I'll bite my tail. If I can feel it, then I must be awake.
        - id: ch01-b14
          speaker: narrator
          text: Bobby put the tip of his tail in his mouth and gave it a gentle bite. Then he wondered whether he had truly felt it, or only dreamed that he had. So he tried again. This time, he bit much harder.
        - id: ch01-b15
          speaker: bobby_coon
          text: Ouch! That really hurt. I must be awake. Yes, I'm sure of it. But then what dreadful thing is happening? Is a real giant outside, pounding on my tree?
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: Then Bobby noticed something else. His whole house seemed to shake with every blow. At first he thought he might be imagining it. But he pressed his hands against the wall, and he felt the wall tremble. A horrible sinking feeling came over him.
        - id: ch01-b17
          speaker: narrator
          text: Now Bobby knew he was awake. He was very much awake. He also knew that something dreadful was happening to his hollow tree, though he couldn't imagine what it was.
        - id: ch01-b18
          speaker: narrator
          text: And more than anything, Bobby was afraid to climb up to his doorway and look outside.
