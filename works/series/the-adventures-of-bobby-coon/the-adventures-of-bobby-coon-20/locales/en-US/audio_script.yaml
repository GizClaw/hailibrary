  chapters:
    - id: ch01
      title: XX. Peter Rabbit Saves Bobby Coon
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Some heroes think first, then do something brave. Other heroes become heroes quite by accident.
        - id: ch01-b02
          speaker: narrator
          text: A real hero knows exactly what he is doing. He understands the danger all the while and knows what may happen if he fails, but he does the brave deed anyway. Then there are people who never planned to be brave at all. They may be trying to save themselves and happen to save someone else at the same time. Everyone calls them heroes, looks up to them, and makes a great fuss over them. They are treated just like true heroes, though what they did was never meant to be heroic.
        - id: ch01-b03
          speaker: narrator
          text: Peter Rabbit became that kind of hero. He saved Bobby Coon's life. At least, Bobby is kind enough to say so. One thing is certain. Peter gave Bobby the chance to escape from angry Buster Bear. Afterward, everyone praised Peter and said he had been very, very brave.
        - id: ch01-b04
          speaker: narrator
          text: Deep in his heart, though, Peter knew he didn't deserve all those kind words. Yes, he had saved Bobby, but he hadn't meant to do it. No, sir. Perhaps he would have tried if the idea had come to him. It simply never did. Peter hadn't thought or planned at all. What he did came from not thinking. It happened because he was careless and didn't pay attention. Even so, his friends and neighbors saw him as a hero and praised him just the same. And this is how it happened.
        - id: ch01-b05
          speaker: narrator
          text: Buster Bear was shaking a slender young tree, trying to knock Bobby Coon out of its top. Peter crouched behind a big tree and became so eager to see what would happen that he forgot everything else. He couldn't get a clear look at Bobby from where he was. So Peter hopped out from his hiding place to find a better view. He was too curious and excited to watch where he stepped. His foot came down on a dry stick, and it broke with a small snap.
        - id: ch01-b06
          speaker: narrator
          text: No one in the Green Forest had sharper ears than Buster Bear. Even with all his attention fixed on Bobby Coon, Buster heard the snap. He spun around in a flash to find its cause. There sat Peter Rabbit, eyes wide, staring as hard as he could. Buster sprang at him without waiting another second. Buster knew Peter would make a very good meal, and a Rabbit on the ground was better than a Coon he couldn't shake from a tree.
        - id: ch01-b07
          speaker: narrator
          text: Peter dodged just in time. With a frightened squeal, he raced away, lipperty-lipperty-lip. He twisted and dodged and ran with all his might while Buster Bear crashed along behind him. How Peter wished he had not been so curious! He should have gone home to the dear Old Briar-patch when he had the chance.
        - id: ch01-b08
          speaker: narrator
          text: Peter was so frightened that he never noticed when Buster stopped chasing him. He just kept running and running. The truth was, Buster had not followed him very far. Buster knew Peter was too nimble to catch in a tail-end race. Once Peter was ahead, there was no catching him. Before long, Buster gave up the chase and hurried back to the young tree.
        - id: ch01-b09
          speaker: narrator
          text: But Bobby Coon had vanished. During those few precious minutes, he had climbed down and run away. By leading Buster off, Peter had saved Bobby. Peter hadn't done it on purpose, but he received all the credit anyway. He became a hero.
        - id: ch01-b10
          speaker: narrator
          text: This is a funny old world, isn't it?
