audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 热心好奇，话语轻快，偶尔透出顽皮
        timbre: 清脆明亮
        pace: 明快灵活
        pitch: 中高
    buster_bear:
      display_name: 巴斯特熊
      tts:
        delivery: 憨直而警觉，饥饿时带着急切和粗声嘟囔
        timbre: 低沉浑厚
        pace: 稍慢，行动时加快
        pitch: 低
  chapters:
    - id: ch01
      title: 两种英雄
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有的英雄先想明白，再勇敢行动，他们是真正的英雄。
        - id: ch01-b02
          speaker: narrator
          text: 另一些人只是碰巧做了勇敢的事，却也被大家捧成了英雄。
        - id: ch01-b03
          speaker: narrator
          text: 真正的英雄知道自己在做什么，也明白要冒多大的险，失败了会有什么后果。可他们知道归知道，该做的勇敢之事，仍旧会去做。
        - id: ch01-b04
          speaker: narrator
          text: 另一种人可没有这样的打算。他们做的事看起来很勇敢，其实既没盘算过，也不是有意去做的。有时，一个人只顾着救自己的命，却碰巧也救了别人。大家还是会叫他英雄，敬佩他，还把他夸得不得了。可说到底，他并不是真正的英雄。
        - id: ch01-b05
          speaker: narrator
          text: 兔子彼得就是这样成了英雄。他救了浣熊博比一命，至少，博比很厚道，愿意这么说。反正，是彼得让博比有机会逃过了怒气冲冲的巴斯特熊。于是人人都夸彼得，说他勇敢极了。
        - id: ch01-b06
          speaker: narrator
          text: 可彼得心里明白，这些好听的话，他一句也当不起。他确实救了博比，却不是存心要救。不，先生，绝不是。要是先想到了这个办法，也许彼得真会那么做，可他根本没想到。他没有动脑筋，也没有什么计划，只是粗心大意，莽莽撞撞。就这么一回事，倒让朋友和邻居都把他看成了英雄。事情是这样的。
    - id: ch02
      title: 枯枝轻轻一响
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 巴斯特熊正在使劲摇一棵细瘦的小树，想把树顶上的浣熊博比摇下来。彼得躲在一棵大树后面，一心只想看看接下来会怎样，别的什么都忘了。
        - id: ch02-b02
          speaker: narrator
          text: 可从他藏身的地方望过去，博比的身影看不清楚。彼得连自己也可能有危险都忘了。他从大树后面跳出来，想换个地方，好看得更清楚些。
        - id: ch02-b03
          speaker: narrator
          text: 彼得又好奇又兴奋，哪里还顾得上看脚下。他一脚踩中了一根枯枝，只听“啪”的一声轻响，枯枝断了。
        - id: ch02-b04
          speaker: narrator
          text: 绿森林里，谁的耳朵也没有巴斯特熊的灵。虽然他满心都在想着博比，那声轻响还是被他听见了。巴斯特猛地一转身，快得就像一道闪光，立刻去找声音是从哪里来的。
        - id: ch02-b05
          speaker: narrator
          text: 兔子彼得就坐在那里，双眼瞪得圆圆的，还在使劲往这边看。巴斯特一秒钟也没耽搁，纵身就向他扑过去。彼得吃起来准是美味得很，这一点巴斯特心里清楚。再说，地上有一只兔子，总比树上有一只怎么也摇不下来的浣熊强。
    - id: ch03
      title: 意外救了博比
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得闪得正是时候。他吓得尖叫一声，转身就逃，蹦呀，蹦呀，蹦得飞快。一会儿转弯，一会儿闪躲，他使出全身力气往前跑。巴斯特熊就在后面横冲直撞地追。
        - id: ch03-b02
          speaker: narrator
          text: 彼得这时可后悔了。他真希望自己刚才没有那么好奇，真希望早该回老荆棘丛时，就已经乖乖回了家。
        - id: ch03-b03
          speaker: narrator
          text: 彼得吓得只顾奔命，巴斯特什么时候不追了，他一点儿也不知道。他还是不停地往前跑。其实，巴斯特并没有追出多远。
        - id: ch03-b04
          speaker: narrator
          text: 巴斯特知道，这样一前一后地赛跑，彼得太灵活，自己根本抓不住。没过多久，他就放弃了，急匆匆地赶回那棵小树。
        - id: ch03-b05
          speaker: narrator
          text: 可浣熊博比早就不见了。就在这短短几分钟里，他抓住机会爬下树，逃走了。彼得把巴斯特引开，也就救了博比。他不是有意这么做的，功劳却还是落到了他头上。彼得成了英雄。
        - id: ch03-b06
          speaker: narrator
          text: 这个古怪的世界真有意思，不是吗？
