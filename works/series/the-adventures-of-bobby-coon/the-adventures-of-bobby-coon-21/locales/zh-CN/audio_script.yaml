audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
  chapters:
    - id: ch01
      title: 拼命逃走
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 巴斯特熊刚一动身去追兔子彼得，浣熊博比马上从树上飞快地爬了下来。他这辈子从没这样快地爬下过一棵树。博比知道，巴斯特追不了彼得多远，自己一点时间也不能浪费。他要赶在巴斯特回来前，跑得越远越好。
        - id: ch01-b02
          speaker: narrator
          text: 彼得朝一个方向蹦呀，蹦呀，蹦，拼命地跑。博比就往相反的方向飞奔，四只黑脚动得快极了。他不知道要去哪儿，也顾不上看路。只要能离巴斯特熊远一点，去哪儿都行。
        - id: ch01-b03
          speaker: narrator
          text: 博比一直跑到实在跑不动才停下来。他的心怦咚、怦咚、怦咚地猛跳，喘得每吸一口气都胸口发疼。他非停不可了，再也迈不出一步。
        - id: ch01-b04
          speaker: narrator
          text: 过了一会儿，博比的心总算不再怦咚怦咚地狂跳，呼吸也重新顺畅了。他明白，自己已经逃出来，现在安全了。他舒了一口气，那是快活的一小口气。接着，他又咧嘴笑起来。
    - id: ch02
      title: 没有家的麻烦
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 博比想起这一天，自己不过想找张床，好好睡上一觉。可每次刚找到地方，眼睛才合上，就又被赶了出来。他一向懂得什么叫好玩，这会儿回头想想，倒觉得这一连串遭遇挺可笑。
        - id: ch02-b02
          speaker: bobby
          text: 有件事我可弄清楚了。没有家，比我原先想的麻烦多了。我还以为困了就能随便找个地方睡，谁知道，找张床差不多成了我做过最难的事。现在我到了绿森林里一个陌生的地方，连家也没有。回原来的住处没用，我还是在附近找找吧。也许这儿有座空房子。只要能住上一阵，什么样的都差不多。
        - id: ch02-b03
          speaker: narrator
          text: 博比开始四下寻找空房子。他说的房子，当然是空心树或空心木头。他从前一直住在树洞里，这回自然最想找的还是树洞。
        - id: ch02-b04
          speaker: narrator
          text: 可绿森林这一带很少有空心树。偶尔找到一棵，树洞又太小，根本容不下博比。空心木头也是一样，能找到的全都不够大。他越找越泄气，后来走到一片突出的岩石前。绿森林深处有座小山，这片岩石正托着那座小山。
    - id: ch03
      title: 岩缝里的新家
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 博比在岩石间看见一条裂缝，正好能让自己挤进去。他只是有些好奇，就当真钻进去瞧了瞧。没走多远，裂缝渐渐变宽，里面竟然是一座他从没见过的、格外舒服的小山洞。
        - id: ch03-b02
          speaker: narrator
          text: 山洞十分干燥，也很舒适。博比忽然明白，要把这里变成最舒服的家，缺的只是一床干树叶。干树叶可容易找得很。他的双眼一下子亮了。
        - id: ch03-b03
          speaker: bobby
          text: 我找到新家啦！我的旧家会被砍倒，这里不会。巴斯特熊能用大爪子撕开树洞，却撕不开这里。个头比我大的家伙，谁也进不来。这是整个绿森林里最安全、最好的房子，我就住在这儿了！
          emotion: happy
        - id: ch03-b04
          speaker: narrator
          text: 博比当场就在洞里蜷起身子，终于睡上了他盼了那么久、也实在太需要的那一觉。
