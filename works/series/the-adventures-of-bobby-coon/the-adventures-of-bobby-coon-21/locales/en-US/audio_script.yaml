audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: wary and determined
        timbre: small and rough-edged
        pace: quick and tense
        pitch: medium-high
  chapters:
    - id: ch01
      title: Down from the Tree
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The instant Buster Bear went racing after Peter Rabbit, Bobby Coon scrambled down from that tree. Never in his life had Bobby come down a tree so fast. He knew Buster would not chase Peter very far, so Bobby had no time to waste. He had to get as far away as he could before Buster came back.
        - id: ch01-b02
          speaker: narrator
          text: Peter Rabbit went speeding in one direction, lipperty-lipperty-lip, as fast as his legs could carry him. Bobby ran the other way, and his black feet flew over the ground. He had no idea where he was headed. Anywhere would do, as long as it took him away from Buster Bear's neighborhood.
        - id: ch01-b03
          speaker: narrator
          text: Bobby hardly noticed where he was going. He just kept running until he could run no more. His heart pounded, thumpity-thump-thump, thumpity-thump-thump. He was breathing so hard that every breath came as a painful gasp. At last he had to stop. He could not take one more step.
    - id: ch02
      title: Homeless in the Green Forest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After a while, Bobby's heart settled down, and he could breathe easily again. He knew he had escaped. He was safe. Out came a little sigh, and it was a happy one.
        - id: ch02-b02
          speaker: narrator
          text: Then Bobby grinned. All day long, he had tried to find a place to sleep. Each time he thought he had found a bed, he had barely closed his eyes before something drove him out again. Bobby had a sense of fun, and now he could see how funny all those troubles had been.
        - id: ch02-b03
          speaker: bobby_coon
          text: One thing is certain. Being homeless is much more serious than I thought. I was sure I could find a sleeping place whenever I needed one. Now it seems like the hardest thing I've ever tried to do. Here I am, homeless in a part of the Green Forest I don't know. Going back to my old neighborhood won't help, so I'll look around here instead. Maybe there is an empty house nearby. Almost any place will do for now.
    - id: ch03
      title: The Search for an Empty House
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: So Bobby began searching for an empty house. Of course, the kind of house he wanted was a hollow tree or a hollow log. He had always lived in a hollow tree, and that was still the sort of home he liked best.
        - id: ch03-b02
          speaker: narrator
          text: But hollow trees were hard to find in that part of the Green Forest. The few Bobby did find had no hollow large enough for him. He had the same trouble with every hollow log. Bobby was beginning to feel discouraged when he reached a rocky ledge at the bottom of a little hill, deep in the forest.
    - id: ch04
      title: Bobby Finds His New Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: There in the rocky ledge, Bobby spotted a crack just wide enough for him to squeeze through. He went in only because he was curious. A little farther inside, the crack opened wider and became the coziest little cave he had ever seen. It was dry and comfortable.
        - id: ch04-b02
          speaker: narrator
          text: All at once, Bobby knew exactly what the cave needed. With a bed of dry leaves, it would make the snug sort of house he wanted, and dry leaves would be easy to gather. Bobby's eyes danced.
        - id: ch04-b03
          speaker: bobby_coon
          text: I've found my new home! No one can cut it down the way my old home was cut down. Buster Bear can't rip it open with those great claws of his. And no one bigger than me can squeeze inside. This is the safest, best house in the whole Green Forest. I'm staying right here.
          emotion: happy
        - id: ch04-b04
          speaker: narrator
          text: Right then and there, Bobby Coon curled up and finally got the sleep he needed so badly.
