  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
  chapters:
    - id: ch01
      title: VIII. Farmer Brown's Boy Plays Doctor
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            No greater joy can one attain
            Than helping ease another's pain.
        - id: ch01-b02
          speaker: narrator
          text: Poor Bobby Coon! That broken leg hurt him terribly. Of course it did. Broken legs and arms hurt when the break happens. They keep hurting afterward, and they hurt while they mend.
        - id: ch01-b03
          speaker: narrator
          text: A broken limb is much worse for the little people of the Green Forest and the Green Meadows than it is for us humans. We know how to set a broken bone so Mother Nature can mend it and make the arm or leg as good as ever. The little forest and meadow people have no such help. Far too often, a broken limb means an early death.
        - id: ch01-b04
          speaker: narrator
          text: Their broken bones may not heal the right way. Then the poor sufferer is left unable to move as before, and a crippled animal cannot escape its enemies for long.
        - id: ch01-b05
          speaker: narrator
          text: Bobby didn't know it then, but he was very lucky that Farmer Brown's boy had found his broken leg, wrapped him in a coat, and carried him home.
        - id: ch01-b06
          speaker: narrator
          text: Bobby certainly didn't feel lucky. Oh, my, no! He thought just the opposite. He knew Farmer Brown's boy only by sight. He knew nothing about the boy's gentle ways or his tender heart. All Bobby knew about men and boys was that most of them seemed to enjoy hunting him, scaring him, and trying to kill him.
        - id: ch01-b07
          speaker: narrator
          text: So through that strange journey in the boy's arms, all the way to Farmer Brown's barn, Bobby felt sure he was being carried off to be killed. He was absolutely sure. Not the smallest doubt entered his mind.
        - id: ch01-b08
          speaker: narrator
          text: At the barn, Farmer Brown's boy set Bobby down with great care. But he kept Bobby wrapped tightly in the coat so he couldn't escape. Then the boy went into the house. Before long, he came back with several neat strips of clean white cloth.
        - id: ch01-b09
          speaker: narrator
          text: Next he took out his knife and shaped two thin, flat sticks until they were very smooth. When he was satisfied with them, he tied Bobby's hind legs together so Bobby couldn't kick. He laid Bobby on his side upon a board. Then he used a wide strip of cloth to bind Bobby to the board so firmly that Bobby could not move at all.
        - id: ch01-b10
          speaker: narrator
          text: The whole time, Farmer Brown's boy spoke to Bobby in the gentlest voice he could. He also took great care not to hurt him.
        - id: ch01-b11
          speaker: narrator
          text: But Bobby couldn't understand what the boy was doing. Being completely helpless was the most dreadful feeling Bobby had ever known. He couldn't kick. He couldn't scratch. He couldn't even bite. Bobby felt certain that something worse was about to happen.
        - id: ch01-b12
          speaker: narrator
          text: You see, Bobby knew nothing about doctors. How could he possibly guess that Farmer Brown's boy was playing doctor?
        - id: ch01-b13
          speaker: narrator
          text: Very, very gently, the boy felt Bobby's broken leg. He brought the two broken parts together. Once he was certain they fitted exactly, he laid one of those thin, smooth, flat sticks against the leg. Then he used a strip of clean white cloth to bind the broken parts in place against it.
        - id: ch01-b14
          speaker: narrator
          text: The boy put the other smooth, flat stick above the break. Around the whole thing, he wound more strips of cloth. He wrapped them so tightly that neither stick could slip.
        - id: ch01-b15
          speaker: narrator
          text: Those sticks would hold the two parts of the broken bone exactly where they belonged while the bone grew together again.
        - id: ch01-b16
          speaker: narrator
          text: When everything was arranged just as the boy wanted, he covered the outside with something that tasted very, very bitter and bad. That would stop Bobby from using his teeth to tear away the cloth.
        - id: ch01-b17
          speaker: narrator
          text: Farmer Brown's boy knew that if Bobby's leg was ever going to be as good as it had been before, the bandage and the sticks had to stay exactly where he had put them. They must remain there until Old Mother Nature could heal the break.
        - id: ch01-b18
          speaker: narrator
          text: And so Farmer Brown's boy played doctor. He was a very gentle and kindly doctor, because his heart was full of pity for poor Bobby Coon.
