audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
    farmer_browns_boy:
      display_name: 布朗家的男孩
      tts:
        delivery: 朴实爽朗，发现新鲜事时充满好奇
        timbre: 明亮清脆的少年嗓音
        pace: 自然而轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第八章　布朗家的男孩当医生
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 人生最大的快乐，莫过于替人减轻痛苦。
        - id: ch01-b02
          speaker: narrator
          text: 可怜的浣熊博比！那条断腿当然疼得厉害。腿也好，胳膊也好，只要断了，总免不了疼。刚断时疼得钻心，过后还在疼，就连慢慢长好的时候也一样难受。
        - id: ch01-b03
          speaker: narrator
          text: 对绿森林和绿草地上的小动物来说，断腿断臂比人类遇上这种事糟糕得多。人知道怎样固定断处，让自然母亲慢慢把它医好，最后恢复如初。小动物却没有这样的办法。断掉一条腿或一只胳膊，常常意味着活不长了。断处长不好，受伤的小家伙便会落下残疾。腿脚不灵便，也就躲不了敌人多久。
        - id: ch01-b04
          speaker: narrator
          text: 所以，布朗家的男孩发现博比断了腿，用外套裹住他，再把他带回家，实在是一件天大的幸事。只不过，博比当时还不知道。他非但没觉得幸运，反倒认定事情糟透了。
        - id: ch01-b05
          speaker: narrator
          text: 博比以前只在远处见过这个男孩，不知道他性情温柔，又有一副善良心肠。在博比的印象里，大人和男孩大都喜欢追捕他，吓唬他，还想要他的命。于是，从男孩抱起他，一直走到谷仓，博比都确信自己正被带去某个地方杀掉。他认得死死的，连一点儿怀疑也没有。
        - id: ch01-b06
          speaker: narrator
          text: 到了谷仓，男孩轻轻放下博比，却依旧用外套牢牢裹住他，不让他逃走。男孩去了一趟屋里，很快带回来几条整齐的洁白布条。他又拿出小刀，把两根又薄又扁的木条削得光光滑滑。
        - id: ch01-b07
          speaker: narrator
          text: 木条弄好了，男孩先把博比的两条后腿绑在一起，免得他乱踢。接着，他让博比侧躺在一块木板上，用宽布带把他缚住，叫他一点儿也动不了。忙这些的时候，男孩一直用最温柔的声音跟博比说话，每一下都小心翼翼，生怕弄疼他。
        - id: ch01-b08
          speaker: narrator
          text: 可博比听不懂。浑身不能动，不能踢，不能抓，也不能咬，这是他从来没有尝过的可怕滋味。他认定，更糟糕的事马上就要来了。博比根本不知道医生是怎么回事，当然更想不到，布朗家的男孩正在学医生，替他治伤。
        - id: ch01-b09
          speaker: narrator
          text: 男孩轻轻摸了摸断腿，把断开的两截接到一起。等他确定两头正好吻合，就用一条白布，把断腿固定在一根光滑的扁木条上。然后，他把第二根扁木条放在断处上方，又拿布条一圈一圈缠紧。这样，两根木条便不会滑动，断骨的两头也能一直留在该在的位置，等着重新长合。
        - id: ch01-b10
          speaker: narrator
          text: 一切都弄妥以后，男孩又在最外面涂了一层又苦又难吃的东西。这样，博比就不会用牙齿把布条撕掉了。男孩明白，要让那条腿恢复得和从前一样，就得一直这样固定着，直到年迈的自然母亲把它医好。
        - id: ch01-b11
          speaker: narrator
          text: 布朗家的男孩就这样当了一回医生。他是位再温柔、再和善不过的医生，因为他的心里满是对可怜的浣熊博比的怜惜。
