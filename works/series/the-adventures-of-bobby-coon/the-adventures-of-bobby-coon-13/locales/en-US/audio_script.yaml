audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: wary and determined
        timbre: small and rough-edged
        pace: quick and tense
        pitch: medium-high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager and animated
        timbre: bright and youthful
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: XIII. Bobby Makes Another Mistake
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: After Bobby Coon left Unc' Billy Possum's hollow tree, he went fishing. Fishing was one of his favorite things. All night, he fished and played beside the Laughing Brook. At last, jolly, round, red Mr. Sun began his daily climb into the blue, blue sky. By then, Bobby was wet, worn out, and sleepy. But he was happy.
        - id: ch01-b02
          speaker: narrator
          text: How good it felt to wander through the beautiful Green Forest again and go wherever he pleased! It even seemed rather funny that he had no house to return to. He hadn't been without a home for a long, long time. He rubbed his eyes and yawned.
        - id: ch01-b03
          speaker: bobby_coon
          text: I've got to sleep somewhere, and I'd better find a place soon. I'm so sleepy I can hardly hold my eyes open. Hello! Look at that great big log. If it's hollow, it will be just right for me.
        - id: ch01-b04
          speaker: narrator
          text: Bobby went straight to the old log. It was very big, and to his delight, it was hollow. One end stood open. He was about to crawl inside when Peter Rabbit popped out from behind a tree.
        - id: ch01-b05
          speaker: peter_rabbit
          text: Bobby Coon! Where have you been? I went to your old home and found your tree gone. I was afraid something terrible had happened. What happened to you? Where did you go?
          emotion: happy
        - id: ch01-b06
          speaker: narrator
          text: Tired and sleepy as Bobby was, he had to stop and talk for a few minutes. Peter was the first friend he'd met since coming back, and Bobby was bursting to tell someone about all his adventures.
        - id: ch01-b07
          speaker: narrator
          text: So Bobby sat down and told Peter the whole story. His hollow tree had been cut down, and his leg had been broken. Farmer Brown's boy had taken him home and cared for the leg while Old Mother Nature made it strong and sound again. Then the boy had brought Bobby back to the Green Forest and set him free. Bobby had spent the whole night fishing, and now he only wanted a little sleep.
        - id: ch01-b08
          speaker: bobby_coon
          text: Now, if you'll excuse me, Peter, I'm going inside for a nap.
        - id: ch01-b09
          speaker: narrator
          text: Bobby started crawling into the open end of the hollow log.
        - id: ch01-b10
          speaker: peter_rabbit
          text: Oh! Bobby, you mustn't go in there!
        - id: ch01-b11
          speaker: narrator
          text: Bobby didn't hear Peter, or else he paid no attention. He went right on until he disappeared inside. A funny look came over Peter's face. Before long, he began to chuckle.
        - id: ch01-b12
          speaker: peter_rabbit
          text: I think I'll stay here awhile and see what happens.
        - id: ch01-b13
          speaker: narrator
          text: Inside the big log, Bobby found a dry, warm, comfortable place. A bed of dry leaves lay there, and it looked very inviting.
        - id: ch01-b14
          speaker: narrator
          text: Usually, Bobby would have searched every part of a hollow log before settling down to sleep. This time, he was far too tired to look properly. He never went near the farther end. He simply stopped halfway in, curled up, and was fast asleep almost at once.
        - id: ch01-b15
          speaker: narrator
          text: That was a mistake. It was a very great mistake, as Bobby would soon discover.
        - id: ch01-b16
          speaker: narrator
          text: Meanwhile, Peter Rabbit sat waiting outside, even though it was already past time for him to be home in the dear Old Briar-patch.
