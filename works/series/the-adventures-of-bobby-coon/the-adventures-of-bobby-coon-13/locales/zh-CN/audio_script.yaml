audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 热心好奇，话语轻快，偶尔透出顽皮
        timbre: 清脆明亮
        pace: 明快灵活
        pitch: 中高
  chapters:
    - id: ch01
      title: 一夜没有睡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 博比离开比利大叔的空心树，就到欢笑溪边捉鱼去了。你知道，他最喜欢捉鱼。这一夜，他一会儿捉鱼，一会儿玩耍，一直没有停下来。等圆滚滚、红彤彤的太阳先生又乐呵呵地爬上蓝天，博比已经浑身湿透，又累又困。
        - id: ch01-b02
          speaker: narrator
          text: 可他心里快活极了。能再次随自己的心意，在美丽的绿森林里到处游荡，真是太好了。至于自己连一座可以回去的房子都没有，博比如今想起来，反倒觉得有点好笑。他已经很久很久不曾没有家了。
        - id: ch01-b03
          speaker: bobby
          text: 我总得找个地方睡觉，还是越快越好。我的眼睛都快睁不开了。咦，那边有根好大的圆木！里面要是空的，正好让我睡上一觉。
        - id: ch01-b04
          speaker: narrator
          text: 博比揉着眼睛，打着哈欠，径直朝那根老圆木走去。圆木很大，真是大极了。更叫他高兴的是，里面果然是空的，一头还有个洞口。他刚要钻进去，兔子彼得忽然从树后面蹦了出来。
    - id: ch02
      title: 遇见兔子彼得
      blocks:
        - id: ch02-b01
          speaker: peter_rabbit
          text: 嘿，浣熊博比！你上哪儿去了？我去过你从前住的地方，发现你的房子不见了。我还以为你出了什么可怕的事呢！到底怎么了？这些天你又去了哪里？
          emotion: happy
        - id: ch02-b02
          speaker: narrator
          text: 博比虽然累得要命，也困得要命，还是停下来跟彼得聊了几句。彼得是他回来后遇见的第一个朋友，他终于能把自己的奇妙经历讲给朋友听了。那些话早就憋得他难受，他正巴不得找个人说一说呢。
        - id: ch02-b03
          speaker: narrator
          text: 博比坐下来，从头讲起。他说，自己的空心树被人砍倒了，腿也摔断了。布朗家的男孩把他带回家，替他接好断腿，好让大自然老妈妈把腿重新长得结结实实。后来，那个男孩又送他回到绿森林，让他恢复了自由。博比还告诉彼得，自己捉了一整夜的鱼，现在只想找个地方打个盹儿。
        - id: ch02-b04
          speaker: bobby
          text: 好了，彼得，你要是不介意，我现在可得进去睡上一觉了。
        - id: ch02-b05
          speaker: narrator
          text: 博比说着，就往空心圆木里钻。
        - id: ch02-b06
          speaker: peter_rabbit
          text: 哎呀！博比，你可不能进去！
          emotion: surprised
        - id: ch02-b07
          speaker: narrator
          text: 可博比没有听见。就算听见了，他也没往心里去。他继续朝里钻，转眼便不见了。彼得的脸上慢慢露出一种古怪的神情，过了一会儿，他忍不住低声笑起来。
        - id: ch02-b08
          speaker: peter_rabbit
          text: 我还是在这儿等一等，看看会出什么事吧。
    - id: ch03
      title: 一个天大的错误
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 大圆木里面又干燥，又暖和，又舒服。地上铺着一层干树叶，看起来正适合睡觉。平常，博比一定会把圆木里面仔仔细细检查一遍，然后才肯睡下。可这一次，他实在太累、太困了，连四周都没怎么瞧，更没有走到圆木的另一头去。
        - id: ch03-b02
          speaker: narrator
          text: 他走到圆木中间，一头躺下，蜷起身子，很快便睡熟了。这可是个错误，一个天大的错误。用不了多久，博比自己就会明白。与此同时，兔子彼得仍旧坐在外面，尽管他早就该回到亲爱的老蔷薇丛去了。
