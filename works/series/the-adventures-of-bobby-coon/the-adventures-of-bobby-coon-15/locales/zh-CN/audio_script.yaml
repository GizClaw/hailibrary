audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切风趣，像在孩子身边娓娓讲述森林故事
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    bobby:
      display_name: 浣熊博比
      tts:
        delivery: 天真敏感，困惑时迟疑，受惊时急促
        timbre: 清亮稚气
        pace: 轻快而随情绪变化
        pitch: 中高
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 热心好奇，话语轻快，偶尔透出顽皮
        timbre: 清脆明亮
        pace: 明快灵活
        pitch: 中高
  chapters:
    - id: ch01
      title: 困得睁不开眼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 睡魔可曾来找你，把你双眼撒满沙？你明明困得睁不开眼，偏偏还得撑着，身边连张床也没有。
        - id: ch01-b02
          speaker: narrator
          text: 要是你也碰到过，就知道浣熊博比从豪猪波基的床上爬起来，另找地方睡觉时有多难受。他实在太困了，觉得自己站着都能睡着。
        - id: ch01-b03
          speaker: narrator
          text: 谁叫博比整夜没睡，前一天的大半个白天也一直醒着呢。现在他后悔了。昨夜真不该只顾着在笑溪钓鱼玩耍，早些找好房子该多好。
        - id: ch01-b04
          speaker: narrator
          text: 人困得厉害却不能睡，难免会发脾气，博比也一样。他匆匆离开波基和那上千根小长矛住的地方，心情坏透了。他明白这一切都怪自己，可这样想不但没让他好受，反而更难受。事情往往就是这样。
    - id: ch02
      title: 老树桩里的床
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 博比边走边嘟囔。他不知道自己要去哪里，又恼火，又困倦，心里还乱糟糟的，根本没法细想。他只管往前走，到处寻找一个不受打扰、能让他睡觉的地方。
        - id: ch02-b02
          speaker: narrator
          text: 后来，他看见一截高高的树桩。那截老树桩又粗又大，已经在绿森林里立了好多好多年。博比爬到顶上，发现里面果然是空的。他正盼着这样呢。
        - id: ch02-b03
          speaker: narrator
          text: 整截树桩只剩下一层外壳。博比向下一望，树桩底下铺着厚厚的朽木，拿来当床一定很舒服。更妙的是，看起来没有谁住在这里。他满意地叹了口气，这地方正适合睡上一大觉，他可以舒舒服服睡一整天。
        - id: ch02-b04
          speaker: narrator
          text: 不过，树桩顶上直通天空，不能拿来当家。只要下雨，里面很快就会湿透。可晴天在这里睡个长觉，恐怕再难找到更合适的地方了。
        - id: ch02-b05
          speaker: narrator
          text: 博比又满意地叹了一口气。他四下看看，确定没人盯着自己，便爬进了树桩。
    - id: ch03
      title: 总算睡着了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 博比蜷在朽木铺成的床上。这种朽木，有时也叫火绒木。他低声嘟囔起来。
        - id: ch03-b02
          speaker: bobby
          text: 这下总该让我安安静静睡觉了吧。我这辈子就没这么困过。
        - id: ch03-b03
          speaker: narrator
          text: 他一连打了两三个哈欠，又挪挪身子，让自己躺得更舒服。接着，他闭上眼睛，转眼就睡着了。
        - id: ch03-b04
          speaker: narrator
          text: 博比以为没人看见他钻进老树桩，其实有人全看见了。那就是兔子彼得。彼得只是好奇，才一路跟在后面。他总躲在树后，不让博比瞧见，所以清清楚楚地看着博比爬上树桩，又消失在里面。
    - id: ch04
      title: 布莱基飞来了
      blocks:
        - id: ch04-b01
          speaker: peter_rabbit
          text: 我看这回他总能安安静静睡觉了。大概没人会找到他，除非松鸦萨米或者乌鸦布莱基正巧从上面飞过，发现他藏在这里。要真让他俩看见，博比可一刻也别想安宁。
        - id: ch04-b02
          speaker: narrator
          text: 就在这时，彼得听见了乌鸦布莱基的叫声。
        - id: ch04-b03
          speaker: peter_rabbit
          text: 咦！这不是布莱基的声音吗？听着像是正往这边飞呢。那我再留下来看一会儿。
