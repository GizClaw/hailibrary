audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively woodland storytelling
        timbre: clear and friendly
        pace: measured with playful turns
        pitch: medium
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: wary and determined
        timbre: small and rough-edged
        pace: quick and tense
        pitch: medium-high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious and lightly mischievous
        timbre: bright and youthful
        pace: quick and nimble
        pitch: medium-high
  chapters:
    - id: ch01
      title: XV. Once More Bobby Tries to Sleep
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Have you ever had the Sandman fill your eyes with sand, but you had to keep them open because there wasn't a bed anywhere nearby?
        - id: ch01-b02
          speaker: narrator
          text: If that has happened to you, then you know just how Bobby Coon felt. He had to crawl out of Prickly Porky's bed and hunt for another one. Bobby was so very sleepy, he felt as though he could doze off while standing on his feet. He had stayed up all night and had been awake through most of the day before. Now he wished he'd spent that night looking for a house instead of fishing and playing around the Laughing Brook.
        - id: ch01-b03
          speaker: narrator
          text: Being sleepy when you can't sleep will make Bobby cross, just as it does most folks. He hurried away from Prickly Porky and his thousand little spears in a very bad temper. Bobby knew this whole fix was his own fault. That didn't help at all. It only made him feel worse. That's usually how it goes.
        - id: ch01-b04
          speaker: narrator
          text: Bobby grumbled as he went. He had no idea where he was going. He was too cross, sleepy, and upset to think. He simply wandered along, searching for some place where nobody would disturb his sleep.
        - id: ch01-b05
          speaker: narrator
          text: At last, Bobby came to a tall old stump. It was a great big stump that had stood in the Green Forest for years and years. He climbed to the top and found just what he had hoped for. The stump was hollow. In fact, it was nothing but a shell.
        - id: ch01-b06
          speaker: narrator
          text: Bobby looked down and was delighted to see a thick bed of rotted wood at the bottom. It would be very comfortable, and no one else seemed to be using it.
        - id: ch01-b07
          speaker: narrator
          text: Bobby gave a satisfied sigh. This was just the place for a good long nap. He could sleep there comfortably all day. It wouldn't make a home, because the top stood open to the sky. Rain would quickly soak the inside. But on a pleasant day, it was hard to imagine a better place for a nap.
        - id: ch01-b08
          speaker: narrator
          text: Bobby sighed once more. He looked all around to make sure no one was watching, and then he climbed down into the stump.
        - id: ch01-b09
          speaker: bobby_coon
          text: Well, maybe now they'll finally let me sleep in peace. I've never been this sleepy in my whole life.
        - id: ch01-b10
          speaker: narrator
          text: Bobby curled up on the rotted wood, which is sometimes called punk. He yawned two or three times and shifted around until he was more comfortable. Then he closed his eyes, and in a twinkling, he was asleep.
        - id: ch01-b11
          speaker: narrator
          text: Bobby thought nobody had seen him enter that old stump. But someone had. It was Peter Rabbit. Curious Peter had followed Bobby and hidden behind the trees so Bobby wouldn't see him. He watched Bobby climb the stump and disappear inside.
        - id: ch01-b12
          speaker: peter_rabbit
          text: I think he'll sleep peacefully this time. Nobody is likely to find him in there, unless Sammy Jay or Blacky the Crow happens to fly overhead and spot him. If either one does, Bobby won't get a moment's peace.
        - id: ch01-b13
          speaker: peter_rabbit
          text: Hello! That's Blacky's voice, and he sounds as if he's coming this way. I think I'll stay around a little longer.
