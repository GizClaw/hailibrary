audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着而略带讥诮的讲述
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中音
    harvey:
      display_name: 哈维
      tts:
        delivery: 少年人的高声逞强与任性
        timbre: 清亮偏尖
        pace: 稍快
        pitch: 中高音
    manuel:
      display_name: 曼努埃尔
      tts:
        delivery: 带葡萄牙口音的热情直爽
        timbre: 明亮结实
        pace: 中速略跳跃
        pitch: 中音
    dan:
      display_name: 丹
      tts:
        delivery: 朴实活泼的渔家少年口吻
        timbre: 年轻而爽朗
        pace: 稍快
        pitch: 中高音
    disko:
      display_name: 迪斯科·特鲁普
      tts:
        delivery: 克制威严且带冷幽默
        timbre: 深沉坚硬
        pace: 缓慢稳重
        pitch: 低音
    long_jack:
      display_name: 长杰克
      tts:
        delivery: 爱起哄的戈尔韦水手口吻
        timbre: 粗亮
        pace: 明快
        pitch: 中低音
    tom_platt:
      display_name: 汤姆·普拉特
      tts:
        delivery: 老练从容的前军舰水手口吻
        timbre: 洪亮厚实
        pace: 稳健
        pitch: 低音
    penn:
      display_name: 宾恩
      tts:
        delivery: 温顺认真而略显迟疑
        timbre: 细弱
        pace: 稍慢
        pitch: 中高音
    salters:
      display_name: 索尔特斯叔叔
      tts:
        delivery: 暴躁直率的老水手口吻
        timbre: 粗哑
        pace: 稍快
        pitch: 中低音
    cook:
      display_name: 厨子
      tts:
        delivery: 字字清楚而带神秘预感
        timbre: 浑厚中透着尖锐
        pace: 缓慢分明
        pitch: 中低音
    abishai:
      display_name: 阿比沙伊叔叔
      tts:
        delivery: 醉意浓重的粗野叫骂
        timbre: 粗粝沙哑
        pace: 忽快忽慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 第四章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 哈维醒来时，值完头半班的人正在吃早饭。前舱门只开了一条缝，整条双桅船却处处响个不停，各唱各的调。厨子庞大的黑色身影立在小厨房后面，迎着炉火稳住身子。船每往下一栽，他面前打孔木板上的锅碗就撞成一片。前舱先往上爬，挣扎着发抖，再划出一道又利落又叫人发晕的弧线，直冲海面落下去。船头湿重地劈开海水，水声停了一瞬，浪花马上像霰弹一样砸向头顶。锚链擦过锚链孔，绞盘一会儿闷哼，一会儿尖叫。船身偏过去，撞一下，再踢一下，收住身子以后，又把整套动作从头来过。
        - id: ch01-b02
          speaker: long_jack
          text: 在岸上，不管天气怎样，总有杂活等着人干。如今咱们离船队远远的，手上又没活，这才叫福气。各位晚安。
        - id: ch01-b03
          speaker: narrator
          text: 长杰克说完，像条大蛇一样从桌边滑回铺位，躺下抽烟。汤姆·普拉特也跟着躺了。索尔特斯叔叔和宾恩费力爬上梯子去值班，厨子则给后半班摆好饭菜。后半班的人钻出铺位，跟头一班钻回去时一样，又抖身子，又打呵欠。他们一直吃到再也吃不下。曼努埃尔装了一烟斗气味吓人的烟草，把身子卡在棘爪柱和前铺之间，双脚跷上桌子，懒洋洋地望着烟雾微笑。丹伸直了躺在铺位里，摆弄一架花花绿绿、带金色音栓的手风琴。船一上一下，琴声也忽高忽低。厨子背靠着装油炸馅饼的柜门，一边削土豆，一边提防海水从烟管里灌下来。舱里又闷又热，气味浓得没法形容。
        - id: ch01-b04
          speaker: narrator
          text: 哈维想了想，自己居然没有吐个天翻地覆，连他都觉得奇怪。他又爬回铺位，那里最软，也最安全。丹弹起《我不想在你家院子里玩》。船甩得这么厉害，他竟然还弹得很准。
        - id: ch01-b05
          speaker: harvey
          text: 这天气还得闹多久？
        - id: ch01-b06
          speaker: manuel
          text: 等她安静些，咱们就能划小艇去收延绳。也许今晚，也许还要等两天。怎么，你不喜欢？
        - id: ch01-b07
          speaker: harvey
          text: 换作一个星期前，我早吐疯了。可我现在好像没多难受。
        - id: ch01-b08
          speaker: manuel
          text: 那是因为这些天，我们已经把你变成渔夫了。我要是你，回到格洛斯特以后，一定献上两三支大蜡烛，谢谢这份好运。
        - id: ch01-b09
          speaker: harvey
          text: 献给谁？
        - id: ch01-b10
          speaker: manuel
          text: 当然献给山上教堂里的圣母。她一直照应渔夫，所以我们葡萄牙人很少淹死。
        - id: ch01-b11
          speaker: harvey
          text: 原来你是罗马天主教徒？
        - id: ch01-b12
          speaker: manuel
          text: 我是马德拉人，又不是波尔图皮库的小子。难道还该做浸礼会教徒？我每回到格洛斯特都要献蜡烛，这次再多献两三支。慈悲的圣母从不会忘了我曼努埃尔。
        - id: ch01-b13
          speaker: tom_platt
          text: 我可不信这个。海就是海，命里该摊上什么，你总会摊上什么。点蜡烛也好，点煤油也好，都没分别。
        - id: ch01-b14
          speaker: long_jack
          text: 可要是在天上的法庭有个朋友，总是有好处。我赞成曼努埃尔。大约十年前，我在南波士顿一条鲜鱼船上干活。船开到迈诺特暗礁外边，东北风从船尾追上来，浓得像一锅玉米糊。老船长醉得下巴搭着舵柄乱晃。我那时就想，只要我还能把艇钩插上T码头，一定得让圣人们看看，他们究竟把我从什么船上救了出来。现在我不是好端端坐在这儿吗？后来我足足花了一个月，做出那条肮脏老《凯瑟琳号》的模型，交给神父，挂在祭坛前。依我看，送一件真正费过工夫的艺术品，比买几支蜡烛更能让圣人知道你心里感激。
        - id: ch01-b15
          speaker: tom_platt
          text: 爱尔兰佬，你当真信这一套？
        - id: ch01-b16
          speaker: long_jack
          text: 俄亥俄佬，我要是不信，何苦费劲去做？
        - id: ch01-b17
          speaker: tom_platt
          text: 伊诺克·富勒也给老《俄亥俄号》做过一只模型，现在还摆在塞勒姆博物馆。那东西漂亮得很，可我想他绝不是拿去献祭的。照我说——
        - id: ch01-b18
          speaker: narrator
          text: 眼看一场能吵上整整一小时的争论就要开始。渔夫最爱这样，大家扯着嗓子绕来绕去，最后谁也证明不了什么。幸好丹先弹起一首快活的歌。
        - id: ch01-b19
          speaker: dan
          text: 花背鲭鱼跳起来，主帆收礁，帆脚索拉开，只因为风吹得凶——
        - id: ch01-b20
          speakers: [dan, long_jack]
          ensemble: duo
          text: 只因为狂风正猛，等到那风儿呼呼刮，吹哨叫齐众弟兄！
        - id: ch01-b21
          speaker: narrator
          text: 丹把手风琴压低在铺位里，偷偷瞟了汤姆·普拉特一眼，又接着唱下去。
        - id: ch01-b22
          speaker: dan
          text: 大头鳕鱼跳起来，走到主桅支索旁，把测深锤甩开，只因为风吹得凶。贴底游的比目鱼也跳起来，大木头脑袋，大木头脑袋，测水深时仔细来！
        - id: ch01-b23
          speaker: narrator
          text: 汤姆·普拉特像在四处找东西。丹越伏越低，歌声反而越响。忽然，一只硕大的胶靴旋转着飞过前舱，正打中丹高举的胳膊。自从丹发现，只要汤姆测深时听到有人吹这支曲子就会发火，这一老一少便没停止过交战。
        - id: ch01-b24
          speaker: dan
          text: 我就知道能把你招来。
        - id: ch01-b25
          speaker: narrator
          text: 丹把这份礼物原样扔了回去。
        - id: ch01-b26
          speaker: dan
          text: 你不爱听我的琴，就把小提琴拿出来。我可不想整天躺在这里，听你和长杰克争蜡烛。快拉吧，汤姆·普拉特，不然我就把这首歌教给哈维！
        - id: ch01-b27
          speaker: narrator
          text: 汤姆俯身打开柜子，拿出一把白色旧提琴。曼努埃尔眼睛一亮，也从棘爪柱后面不知什么地方，摸出一件小小的钢弦乐器，样子很像吉他。他说那叫马谢特琴。
        - id: ch01-b28
          speaker: long_jack
          text: 这下可是音乐会了，正经的波士顿音乐会。
        - id: ch01-b29
          speaker: narrator
          text: 舱口刚一打开，一股浪花便猛冲进来。迪斯科穿着黄色油布衣，顺着梯子下到舱里。
        - id: ch01-b30
          speaker: long_jack
          text: 来得正好，迪斯科。外面怎么样？
        - id: ch01-b31
          speaker: disko
          text: 就这样！
        - id: ch01-b32
          speaker: narrator
          text: 《我们在这儿号》猛地一推又一抬，迪斯科顺势跌坐在柜子上。
        - id: ch01-b33
          speaker: long_jack
          text: 咱们唱歌吧，也好叫早饭老实待在肚子里。迪斯科，当然得由你领唱。
        - id: ch01-b34
          speaker: disko
          text: 我想来想去，只会两支老歌，你们早都听过了。
        - id: ch01-b35
          speaker: narrator
          text: 他还没推辞完，汤姆的琴已经响了起来。那曲调凄凉极了，像风在哀号，桅杆在呻吟。迪斯科盯着头顶的横梁，唱起一首古老得不能再古老的歌。汤姆在四周铺开琴声，尽力把曲和词凑到一个节拍上。
        - id: ch01-b36
          speaker: disko
          text: 有一艘顶呱呱的邮船，大名鼎鼎的快船。她来自纽约，《无畏号》就是她的名衔。任你夸燕尾号、黑球号跑得飞快，能胜过所有船的，还是《无畏号》邮船。如今《无畏号》停在默西河湾，只等拖船把她牵到大海中间。等她一离开测深线，你马上就会知道——
        - id: ch01-b37
          speakers: [disko, dan, long_jack, manuel]
          ensemble: chorus
          text: 她是利物浦的邮船，主啊，让她开航！
        - id: ch01-b38
          speaker: disko
          text: 如今《无畏号》怒吼着越过纽芬兰浅滩，那里海水浅，底下尽是沙。来来往往的小鱼全都这样叫——
        - id: ch01-b39
          speakers: [disko, dan, long_jack, manuel]
          ensemble: chorus
          text: 她是利物浦的邮船，主啊，让她开航！
        - id: ch01-b40
          speaker: narrator
          text: 这首歌足有几十节。迪斯科一英里也不肯漏，认认真真让《无畏号》走完了利物浦到纽约的全程，仿佛自己就在船上。手风琴呼哧呼哧，小提琴也在旁边吱呀作响。接着，汤姆唱了一首歌，说那个又粗又蛮的麦金能把船领进港。唱完以后，大家请哈维也来一曲。哈维受宠若惊，可他只记得在阿迪朗达克营地学校学过的几段《艾尔森船长游街记》。这时间地点似乎正合适，他才说出歌名，迪斯科就重重跺了一脚。
        - id: ch01-b41
          speaker: disko
          text: 别唱了，小伙子。那桩事判错了，而且是最坏的那种错。歌词越顺耳，谎话就传得越快。
          emotion: angry
        - id: ch01-b42
          speaker: dan
          text: 我早该提醒你。那首歌每次都能惹火我爸。
        - id: ch01-b43
          speaker: harvey
          text: 它到底哪里错了？
        - id: ch01-b44
          speaker: narrator
          text: 哈维又惊讶，又有些恼火。
        - id: ch01-b45
          speaker: disko
          text: 你刚才要唱的，从头到尾都不对，这得怪惠蒂尔。我本来也不必替马布尔黑德人说话，可艾尔森确实没有做错。我父亲把真相给我讲过许多遍。本·艾尔森是《贝蒂号》的船长，那时正从大浅滩返航。事情发生在一八一二年战争以前，可无论哪一年，公道总是公道。他们在科德角灯塔外遇见波特兰的《活跃号》，船长是当地的吉本斯，船身正在漏水。当时风暴很凶，《贝蒂号》也只能拼尽全力赶回家。艾尔森说，那种海况派小艇过去，根本不值得拿人命冒险。船员不听。他便提出另一条路，守在《活跃号》旁边，等浪小一些。船员还是不肯。他们觉得在海角附近不能为了船漏不漏水一直耗着，干脆升起支索帆走了，当然也把艾尔森一起带走。
        - id: ch01-b46
          speaker: disko
          text: 马布尔黑德的人却怪艾尔森不肯救人。第二天海面平静下来，他们更是生气，可谁能提前想到天气会变？《活跃号》有几个人被一位特鲁罗船长救走。他们到了马布尔黑德，只说了自己那一面的故事，说艾尔森给家乡丢了脸。艾尔森的船员见众人的怒气都冲着自己来，吓得反咬船长，说一切全是他的主意。给艾尔森涂柏油、粘羽毛的也不是女人。马布尔黑德的女人才不会干这种事。动手的是一群男人和男孩。他们把艾尔森塞进一条旧小艇，拖着满城游街，直到艇底都掉了下来。艾尔森说，他们总有一天会后悔。
        - id: ch01-b47
          speaker: disko
          text: 后来真相终于出来了。真相常常来得太迟，对清白的人已经没有用了。惠蒂尔却又捡起这桩谎话，在本·艾尔森死后，再给他涂一遍柏油，粘一身羽毛。这是惠蒂尔唯一写错的歌，实在不公平。丹从学校把那篇东西带回家时，我狠狠揍了他一顿。你原先不知道，不怪你。可我现在把真相告诉你了，从今往后要永远记住。本·艾尔森绝不是歌里那种人。我父亲很熟悉这件事，也很熟悉他。小伙子，别轻易评断别人。好了，下一个！
        - id: ch01-b48
          speaker: narrator
          text: 哈维从没听迪斯科一口气说过这么多。他满脸发烧，悄悄缩了回去。
        - id: ch01-b49
          speaker: dan
          text: 一个孩子只能学学校教他的东西。再说人生这么短，沿海每一句谎话，哪能全都追查清楚？
        - id: ch01-b50
          speaker: narrator
          text: 曼努埃尔拨响叮叮乱颤的小马谢特琴，弹出一支古怪的曲子。他用葡萄牙语唱了起来，哈维只听懂一句“妮娜，纯真的姑娘”。唱到末尾，他整只手扫过琴弦，歌声猛地停住。随后迪斯科唱起自己会的第二首歌。曲调又老又涩，到了副歌，大家都跟着唱。
        - id: ch01-b51
          speakers: [disko, dan, long_jack, manuel]
          ensemble: chorus
          text: 四月已尽，积雪消融。我们不久便要拖船驶出新贝德福德港。是啊，不久便要离开新贝德福德。我们捕鲸人，从来看不见麦穗泛黄。
        - id: ch01-b52
          speaker: narrator
          text: 小提琴独自轻轻响了一阵，歌声又接了上来。
        - id: ch01-b53
          speakers: [disko, dan, long_jack, manuel]
          ensemble: chorus
          text: 麦穗泛黄，我爱人的花束迎风开放。麦穗泛黄，我们就要远渡重洋。离别时你才刚刚下种，等我回来，你已经烤成一只面包香。
        - id: ch01-b54
          speaker: narrator
          text: 哈维听得几乎要落泪，自己却说不出原因。厨子放下土豆，伸手要过小提琴，舱里的滋味顿时更不好受了。他仍旧倚着柜门，拉出一支曲子，像有什么极坏的事注定会来，怎样也躲不过。过了一会儿，他用谁也听不懂的语言唱起来，宽大的下巴压着琴尾，白眼珠在灯光里一闪一闪。哈维从铺位探出身子，想听得更清楚。木料吃力地吱嘎，海水不断冲刷，那支曲子就在这些声音里低声哀诉，像浓雾中的浪，一下一下拍着下风岸，最后落在一声悲号上。
        - id: ch01-b55
          speaker: dan
          text: 老天爷，听得我浑身发冷。这唱的到底是什么？
          emotion: fearful
        - id: ch01-b56
          speaker: cook
          text: 这是芬恩·麦库尔去挪威时唱的歌。
        - id: ch01-b57
          speaker: narrator
          text: 厨子的英语一点也不含混，每个字都切得清清楚楚，像留声机里放出来的声音。
        - id: ch01-b58
          speaker: long_jack
          text: 说真的，我也去过挪威，可没发出过这么瘆人的声音。不过它倒真像那些古老歌谣。
        - id: ch01-b59
          speaker: dan
          text: 下一首可别还是这个，怎么也得换换味道。
        - id: ch01-b60
          speaker: narrator
          text: 手风琴马上奏起一支咔嗒作响、听一遍便忘不了的快曲。唱到结尾，丹的声音越发起劲。
        - id: ch01-b61
          speaker: dan
          text: 二十六个星期日，不曾再见陆地。一千五百昆塔尔，又一千五百昆塔尔，足足一千五百昆塔尔。从老凯罗到大浅滩，全装得满满的！
        - id: ch01-b62
          speaker: tom_platt
          text: 住口！丹，你想把这一航的运气钉死吗？这歌准会招来晦气。除非船上的盐全湿了，否则绝不能唱！
          emotion: angry
        - id: ch01-b63
          speaker: dan
          text: 不至于吧，爸？我又没唱最后一节，这就不算。什么会招晦气，你可教不了我。
        - id: ch01-b64
          speaker: harvey
          text: 你们说的晦气东西，到底是什么？
        - id: ch01-b65
          speaker: tom_platt
          text: 凡是会弄坏运气的，都算晦气东西。有时是一个人，有时是一个孩子，也可能是一只桶。我见过一把开膛刀，连着两个航次坏事，后来才查到是它。吉姆·伯克也是一个，直到他淹死在乔治浅滩。我就是饿死，也不跟他同船。《埃兹拉·弗勒德号》还有条绿小艇，那更是最坏的一种。它淹死过四个人，夜里搁在小艇架上，周围还会亮起火红的光圈。
        - id: ch01-b66
          speaker: harvey
          text: 这些你也相信？你刚才不是还说，不管怎样，人都只能接受命里摊上的那一份吗？
        - id: ch01-b67
          speaker: narrator
          text: 铺位四周立刻响起一片不赞成的低语。
        - id: ch01-b68
          speaker: disko
          text: 船外头可以那么说，船里头却可能另有事情。小伙子，别拿晦气东西说笑。
        - id: ch01-b69
          speaker: dan
          text: 可哈维才不是晦气东西。捞到他的第二天，咱们就捕到了多得不得了的鱼。
        - id: ch01-b70
          speaker: narrator
          text: 厨子猛地抬头，忽然发出一声又尖又细的怪笑。他总有办法让人心里发毛。
        - id: ch01-b71
          speaker: long_jack
          text: 要命，医生，别这么笑。我们可听不惯。
        - id: ch01-b72
          speaker: dan
          text: 有什么不对？他不是咱们的吉祥物吗？捞到他以后，咱们不是马上撞见了好鱼群？
        - id: ch01-b73
          speaker: cook
          text: 是，我知道。可这一网还没有收完。
        - id: ch01-b74
          speaker: dan
          text: 他不会害咱们。你拐弯抹角，究竟想说什么？哈维好得很。
          emotion: angry
        - id: ch01-b75
          speaker: cook
          text: 不害人，不害。可是总有一天，他会成为你的主人，丹尼。
        - id: ch01-b76
          speaker: dan
          text: 就这件事？才不会，还差得远呢。
        - id: ch01-b77
          speaker: cook
          text: 主人！伙计！
        - id: ch01-b78
          speaker: narrator
          text: 厨子先指哈维，再指向丹。
        - id: ch01-b79
          speaker: dan
          text: 这倒新鲜。还要等多久？
        - id: ch01-b80
          speaker: cook
          text: 再过几年，我会亲眼看见。主人和伙计，伙计和主人。
        - id: ch01-b81
          speaker: tom_platt
          text: 你是怎么算出来的？
        - id: ch01-b82
          speaker: cook
          text: 在我脑子里。我在那里看得见。
        - id: ch01-b83
          speakers: [tom_platt, dan, long_jack, manuel]
          ensemble: chorus
          text: 你是怎么看见的？
        - id: ch01-b84
          speaker: cook
          text: 我不知道，可事情一定会这样。
        - id: ch01-b85
          speaker: narrator
          text: 厨子低下头继续削土豆。众人再怎么追问，他也不肯多说一个字。
        - id: ch01-b86
          speaker: dan
          text: 好吧，哈维真要当上我的主人，中间还得发生一大堆事。不过医生没说他是晦气东西，我就放心了。要我看，整个船队里，索尔特斯叔叔最会给自己招晦气。只不知道这玩意儿会不会像天花一样传开。他真该去《嘉莉·皮特曼号》。那条船自己就够晦气，换多少船员和家什也挡不住它乱漂。海面平得像镜子，它照样能挣脱锚链跑掉。
        - id: ch01-b87
          speaker: disko
          text: 不管怎么说，咱们已经把船队远远甩在后面，连《嘉莉·皮特曼号》也追不上。
        - id: ch01-b88
          speaker: narrator
          text: 甲板上忽然传来一阵敲击声，迪斯科起身离开。
        - id: ch01-b89
          speaker: dan
          text: 索尔特斯叔叔又撞上他的好运气了。
        - id: ch01-b90
          speaker: disko
          text: 雾散了！
        - id: ch01-b91
          speaker: narrator
          text: 前舱里的人一下全涌上甲板透气。雾的确没了，留下的却是一片阴沉的海，层层巨浪翻滚不休。《我们在这儿号》滑进又长又低的街巷和沟渠。要是这些地方肯静下来，看着倒很安全，也很亲切。可它们从不停歇，更不留情。双桅船被托上千百座灰山中的一座峰顶，又歪歪斜斜冲下坡去，风在索具间呜呜叫着。远处一道浪突然炸开满幅白沫，别的浪头像接到号令，也纷纷破碎。白色和灰色交错翻搅，哈维看得眼花。四五只海燕绕船疾飞，每次掠过船头，都发出尖叫。一两阵雨飑在这片绝望的荒海上来回游荡，先顺风跑远，又折回来，最后消散无踪。
        - id: ch01-b92
          speaker: salters
          text: 我刚才好像看见东北边闪了一下。
        - id: ch01-b93
          speaker: disko
          text: 不会是船队里的船。海面静得太快，有些古怪。丹尼，往上爬一点，看看咱们的延绳浮标还好不好。
        - id: ch01-b94
          speaker: narrator
          text: 结实的船头劈进浪谷，迪斯科一手扶住前舱过道。丹穿着大靴子上了主桅索具，与其说在爬，不如说在小跑。哈维羡慕地看着他把自己挂在摇晃的桅横木旁，向远处搜寻。过了一会儿，他看见一英里外的浪肩上，那面细小的黑色浮标旗。
        - id: ch01-b95
          speaker: dan
          text: 浮标好好的！北面发现帆船，像烟一样冲过来了！也是条双桅船。
        - id: ch01-b96
          speaker: narrator
          text: 大家又等了半个钟头。天空一块块放晴，偶尔露出一线病恹恹的阳光，把海照成片片橄榄绿。随后，一根截短的前桅升出浪头，点一下头，又不见了。下一个浪头托起一座高高的船尾，上面装着老式的木制蜗牛角吊艇架，漆成棕红色。
        - id: ch01-b97
          speaker: dan
          text: 法国佬！不，不对。爸——！
          emotion: surprised
        - id: ch01-b98
          speaker: disko
          text: 那不是法国船。索尔特斯，你那该死的运气，这回咬得比桶盖上的螺丝还牢。
        - id: ch01-b99
          speaker: salters
          text: 我有眼睛。那是阿比沙伊叔叔。
        - id: ch01-b100
          speaker: disko
          text: 现在还不能肯定。
        - id: ch01-b101
          speaker: tom_platt
          text: 所有晦气鬼的总头目。索尔特斯啊索尔特斯，你为什么不在床上老实睡觉？
        - id: ch01-b102
          speaker: salters
          text: 我怎么知道会碰上这个？
        - id: ch01-b103
          speaker: narrator
          text: 那条双桅船荡上浪头，简直像幽灵船“飞翔的荷兰人号”。船上每根绳、每块木头都又脏又湿，乱得不成样子。五英尺高的老式后甲板竖在船尾，索具打满结，像码头尽头缠成团的水草。它顺风猛跑，左右晃得吓人。支索帆被放低，当成一面额外的前帆，水手管这种挂法叫“斜挂帆”。前帆下桁也被牵索拉到舷外。艏斜桅像老护卫舰那样向上翘，艏桅延伸杆接了又接，钉了又钉，夹箍上了一层又一层，早就没法再修。它奋力往前扑，又猛坐在宽阔的船尾上，活像一个邋里邋遢、醉醺醺的坏老太婆，正在朝体面的姑娘冷笑。
        - id: ch01-b104
          speaker: salters
          text: 就是阿比沙伊。满船都是杜松子酒和朱迪克人。上天的惩罚一直追着他，可怎么也抓不住。他这是到密克隆添鱼饵去了。
        - id: ch01-b105
          speaker: long_jack
          text: 他会把船开沉的。这种天气，帆可不能挂成那副样子。
        - id: ch01-b106
          speaker: disko
          text: 不会。要沉早就沉了。看样子，他倒像要把咱们撞沉。汤姆·普拉特，她的船头是不是比平常压得更低？
        - id: ch01-b107
          speaker: tom_platt
          text: 照他那种装货法，这条船可不安全。要是填缝的麻絮已经脱了，他最好马上去抽水。
        - id: ch01-b108
          speaker: narrator
          text: 那怪物一路扑腾过来，哗啦一声转过船头，在双方能听见喊话的地方顶风停住。舷墙上摇出一颗灰白的头，一副粗嗓门喊了几句。哈维一个字也没听懂，迪斯科的脸却沉了下来。
        - id: ch01-b109
          speaker: disko
          text: 他宁肯赔掉每根桅杆，也要赶过来报坏消息。他说风向要变。可他自己要遇上的变故更糟。阿比沙伊！阿比——沙伊！
        - id: ch01-b110
          speaker: narrator
          text: 迪斯科一只胳膊上下挥动，学人在水泵旁抽水，又指向那条船的船头。对面的船员却学着他的动作放声大笑。
        - id: ch01-b111
          speaker: abishai
          text: 颠死你们，剥光你们，绊倒你们！活生生的大风，活生生的大风！算算你们最后这一航吧，格洛斯特的黑线鳕！你们再也见不到格洛斯特了，再也见不到啦！
          emotion: angry
        - id: ch01-b112
          speaker: tom_platt
          text: 他还跟往常一样，醉疯了。不过我真希望他没看见咱们。
        - id: ch01-b113
          speaker: narrator
          text: 那船漂出了听力所及的地方，灰头发还在远处叫。话里像是提到公牛湾的一场舞会，又像说前舱里有个死人。哈维打了个寒战。他已经看见那副脏乱的甲板，也看见那些船员凶蛮的眼睛。
        - id: ch01-b114
          speaker: long_jack
          text: 照她那点吃水，这可真是一座上好的漂浮地狱。也不知道他在岸上又干了什么坏事。
        - id: ch01-b115
          speaker: dan
          text: 他是放延绳的，沿着海岸到处进港补鱼饵。他才不回家呢，只在那边南岸和东岸做买卖。那边就是冷酷无情的纽芬兰海滩。爸从来不肯带我去，那里的人厉害，阿比沙伊又是最厉害的。你看见他的船了吧？听说快有七十年，是马布尔黑德老式高尾船里最后一条。现在没人再造那种后甲板。阿比沙伊也不进马布尔黑德，那里不欢迎他。他欠了一屁股债，就这么到处漂。一边放延绳，一边像刚才那样咒骂。他当晦气鬼已经许多年，还从费康来的船上弄酒，用来施法、卖风，干各种乱七八糟的事。我看他已经疯了。
        - id: ch01-b116
          speaker: tom_platt
          text: 今晚不用去收延绳了。他特意靠过来咒咱们。我愿意拿工钱和分成来换他站上老《俄亥俄号》的舷梯，让我看看从前怎么用鞭刑收拾他。足足抽上六打，叫萨姆·莫卡塔交叉着抽！
        - id: ch01-b117
          speaker: narrator
          text: 那条蓬头垢面的老高尾船醉醺醺地顺风舞走，大家的目光一直跟着它。忽然，厨子用留声机似的声音喊了起来。
        - id: ch01-b118
          speaker: cook
          text: 是他自己的死，叫他说出了那些话！他快死了。我告诉你们，他快死了！看！
        - id: ch01-b119
          speaker: narrator
          text: 三四英里外，那条船驶进一片水汪汪的阳光。光斑慢慢暗下去，渐渐消失。光一没，双桅船也同时没了。它落进一道浪谷，随后再没有出现。
        - id: ch01-b120
          speaker: disko
          text: 以大钩滑车的名义起誓，她沉了！不管他们醉没醉，咱们都得去救。收短锚链，拔锚！快！
          emotion: surprised
        - id: ch01-b121
          speaker: narrator
          text: 迪斯科跳到船尾。艏帆和前帆一张开，船身猛地一震，哈维被摔在甲板上。众人先收短锚链，为了省时间，船一开动就硬从海底拔锚，一面航行，一面往回绞。除非遇上生死关头，水手很少使这种蛮力。连小小的《我们在这儿号》也像人一样呻吟起来。他们赶到阿比沙伊的船消失的地方，只看见两三只延绳桶、一只杜松子酒瓶，还有一条撞烂的小艇，除此以外什么也没有。
        - id: ch01-b122
          speaker: disko
          text: 都别碰。阿比沙伊的东西，哪怕一根火柴，我也不要放上船。她准是整个儿沉下去了。填缝麻絮大概脱了整整一星期，他们却从没想过抽水。又一条全船醉着离港的船，就这样完了。
        - id: ch01-b123
          speaker: long_jack
          text: 谢天谢地。要是他们还浮在水上，咱们就非救不可了。
        - id: ch01-b124
          speaker: tom_platt
          text: 我刚才也正想到这个。
        - id: ch01-b125
          speaker: cook
          text: 快死了，快死了！他把自己的晦气也带走了。
        - id: ch01-b126
          speaker: manuel
          text: 下次碰到船队，应该把这事告诉大家。那样顺风猛跑，船身一扭，所有接缝都张开了。嗯，怎——么？
        - id: ch01-b127
          speaker: narrator
          text: 曼努埃尔摊开双手，做了个难以形容的动作。宾恩坐在舱房顶上，为这场恐怖又悲惨的事不停抽泣。哈维仍不敢相信，自己刚刚亲眼看着死亡发生在茫茫海面上，只觉得阵阵恶心。丹重新爬上桅横木，迪斯科把船开回自家的延绳浮标。浮标刚刚进入视野，雾就再次像毯子一样盖住大海。
        - id: ch01-b128
          speaker: disko
          text: 在这一带，人真要走的时候，走得快极了。小伙子，你好好想一阵吧。这全是酒害的。
        - id: ch01-b129
          speaker: narrator
          text: 午饭以后，风浪平静下来，众人已经能从甲板上钓鱼。这次宾恩和索尔特斯叔叔格外卖力，钓上来的鱼又多又大。
        - id: ch01-b130
          speaker: salters
          text: 阿比沙伊准把自己的晦气也带走了。风没转，风力也没变，什么事都没有。那延绳该怎么办？反正我最瞧不起迷信。
        - id: ch01-b131
          speaker: narrator
          text: 汤姆·普拉特坚持要把延绳全收起来，另找泊位。厨子却有不同的说法。
        - id: ch01-b132
          speaker: cook
          text: 运气分成了两半。等你们去看，就会知道。我知道。
        - id: ch01-b133
          speaker: narrator
          text: 长杰克听得大笑。他压过汤姆的意见，两人一起划了出去。检查延绳，要从小艇一侧把长绳拉上来，摘掉鱼，重新给钩子装饵，再把鱼钩一只只放回海里。做起来很像从晾衣绳上摘下衣服，再重新别上去。这活又慢又危险。又长又沉的绳索只要猛抽一下，转眼就能把小艇拖进水里。后来，雾中传来“如今要向你报告，哦，船长”的洪亮歌声，《我们在这儿号》上的人这才放下心。那条小艇装得满满的，打着转靠向船边。汤姆高声叫曼努埃尔划另一条艇过去接应。
        - id: ch01-b134
          speaker: long_jack
          text: 运气果然整整齐齐分成了两半。前半截全是“南瓜”。汤姆·普拉特想收起延绳，就此算了，我却说，我宁可相信有第二视觉的医生。结果后半截沉甸甸的，全挂满了大家伙。快点，曼努埃尔，再带一桶鱼饵来。今晚海上漂的全是好运气。
        - id: ch01-b135
          speaker: narrator
          text: 长杰克说话时，正用鱼叉把鱼挑上大船。哈维张大嘴，看众人怎样凭一身本领，保住那条在浪里颠簸的小艇。新装好鱼饵的钩子刚摘下同类，马上又有鱼咬上来。汤姆和长杰克有条不紊地沿着延绳来回移动。小艇船头在一排湿淋淋的鱼钩下起伏。他们摘下那些被叫作“南瓜”的海参，把新钓的鳕鱼甩到舷边，重新挂饵，再一船接一船装满曼努埃尔的小艇，一直忙到黄昏。
        - id: ch01-b136
          speaker: disko
          text: 我可不冒险，尤其那家伙还浮在附近。阿比沙伊一个星期也沉不到底。把小艇吊上来，吃过晚饭，咱们开膛腌鱼。
        - id: ch01-b137
          speaker: narrator
          text: 那一场开膛腌鱼，忙得叫人喘不过气。旁边还有三四头领航鲸不时喷气。众人一直干到九点。哈维把剖好的鱼扔进舱里时，迪斯科竟接连低笑了三次。等大家都睡下，丹和哈维还坐在一起磨刀。
        - id: ch01-b138
          speaker: dan
          text: 嘿，你进步得真吓人。今晚浪可不小，我却没听见你抱怨一句。
        - id: ch01-b139
          speaker: harvey
          text: 我忙得根本顾不上。现在回头一想，这船今晚踢得可真高。
        - id: ch01-b140
          speaker: narrator
          text: 小双桅船绕着船锚，在一道道镶着银边的浪头间嬉闹。它先猛然后退，像是看见绷紧的锚链吃了一惊，接着又像小猫似的扑上前去。船头向下一扎，浪花便穿过锚链孔炸进来，响得像枪声。它摇着头，仿佛在说：“对不起，我不能陪你待下去了，我要往北走。”说完，它斜着溜开，忽然又停住，索具夸张地哗啦一响。它像是又开口了：“我刚才正想说——”声音庄重得像醉汉对路灯演讲。可后半句话，只能靠一阵坐立不安的抽搐来比画。有时它像咬着绳子的小狗，有时像侧坐在马鞍上却笨手笨脚的女人，又像断头的母鸡，或被牛虻蜇中的母牛，全看大海当时起了什么念头。
        - id: ch01-b141
          speaker: dan
          text: 瞧它发表演说呢。现在它成了帕特里克·亨利。
        - id: ch01-b142
          speaker: narrator
          text: 船身横着荡上一道浪，艏桅延伸杆从左舷挥到右舷，像在使劲比画。
        - id: ch01-b143
          speaker: dan
          text: 至——于我，给我自——由，不然就给我——死！
        - id: ch01-b144
          speaker: narrator
          text: 啪的一声，船一屁股坐进铺满月光的水面，还神气十足地行了个屈膝礼。样子本来颇为动人，可藏在箱子里的舵轮传动装置偏偏发出一阵嘲弄的窃笑。
        - id: ch01-b145
          speaker: harvey
          text: 哈，它简直像活的一样！
          emotion: happy
        - id: ch01-b146
          speaker: dan
          text: 它稳得像房子，干得像鲱鱼。
        - id: ch01-b147
          speaker: narrator
          text: 丹说得热情洋溢，自己却被一片浪花抛过甲板。
        - id: ch01-b148
          speaker: dan
          text: 它一下下挡开海浪，还在说：“别挨近我！”你看，仔细看！老天，你真该看看那些“牙签船”，瞧它们在十五英寻深的水里，怎么用尖尖的船头吊起自己的锚。
        - id: ch01-b149
          speaker: harvey
          text: 丹，什么叫牙签船？
        - id: ch01-b150
          speaker: dan
          text: 就是那些新式的黑线鳕船和鲱鱼船。船头漂亮得像游艇，船尾也做成游艇的样子，艏斜桅尖尖的，光一座舱房就能装下咱们的鱼舱。我听说其中三四条的模型，还是伯吉斯亲手做的。爸不喜欢那些船，说它们颠得猛，撞得凶，可船里值的钱多得很。爸会找鱼，却一点儿不求进步，总跟不上时代。那些船装满省力的机关，还有各种新玩意儿。你见过格洛斯特的《选民号》吗？就算在牙签船里，它也漂亮得数一数二。
        - id: ch01-b151
          speaker: harvey
          text: 那种船要花多少钱？
        - id: ch01-b152
          speaker: dan
          text: 得花成山的钱。也许一万五千美元，说不定还要更多。金箔啦，还有你想得到的一切，样样都有。
        - id: ch01-b153
          speaker: narrator
          text: 丹随后把声音压得很低，几乎只是在对自己轻轻说话。
        - id: ch01-b154
          speaker: dan
          text: 我要是有一条，大概也会叫它《海蒂·S号》。
