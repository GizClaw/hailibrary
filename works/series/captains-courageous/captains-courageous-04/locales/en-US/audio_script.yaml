  chapters:
    - id: ch01
      title: CHAPTER IV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Harvey woke while the first half ate breakfast. The forecastle door stood open a crack, and every inch of the schooner sang a different tune. Behind the tiny galley, the cook's dark bulk swayed over the bright stove. Pots and pans rattled in their wooden rack whenever the vessel plunged. Up went the forecastle, climbing, reaching, and trembling. Then it swept down like a sickle into the sea. The bows cut into the water with a squelch. A moment later, the divided waves struck the deck overhead like a blast of shot. The cable rubbed softly in its hole. The windlass grunted and squealed. The We're Here yawed, bumped, kicked, gathered herself, and did it all again.
        - id: ch01-b02
          speaker: long_jack
          text: Ashore, you have chores, and you must do them whatever the weather. Out here we're well away from the fleet, and there are no chores at all. That's a blessing. Good night, every one of you.
        - id: ch01-b03
          speaker: narrator
          text: Long Jack slid from the table to his bunk like a huge snake and lit his pipe. Tom Platt followed him. Uncle Salters and Penn fought their way up the ladder for their watch, while the cook laid the table for the second half.
        - id: ch01-b04
          speaker: narrator
          text: The second half came out of its bunks, shaking and yawning, and ate until no one could eat another bite. Manuel filled his pipe with terrible tobacco. He wedged himself between a post and the forward bunk, put his feet on the table, and smiled lazily at the smoke. Dan stretched out in his bunk with a bright accordion trimmed in gilt. As the We're Here pitched, every tune climbed and fell with her. The cook leaned against the pie locker, peeling potatoes and keeping one eye on the stove in case too much water came down the pipe. The heat, smoke, and smell were beyond describing.
        - id: ch01-b05
          speaker: narrator
          text: Harvey thought over his situation. A week earlier, this motion would have made him desperately seasick. Now it hardly troubled him. He crawled back into his bunk, the softest and safest place aboard, while Dan played “I Don't Want to Play in Your Yard” as well as the schooner's wild jumps allowed.
        - id: ch01-b06
          speaker: harvey
          text: How long will this last?
        - id: ch01-b07
          speaker: manuel
          text: Until she grows a little quieter and we can row to the trawl. Maybe tonight. Maybe two more days. You do not like it, eh?
        - id: ch01-b08
          speaker: harvey
          text: A week ago I'd have been sick out of my mind. Now it doesn't bother me very much.
        - id: ch01-b09
          speaker: manuel
          text: That is because we have made you a fisherman. When you reach Gloucester, you should give two or three big candles for your good fortune.
        - id: ch01-b10
          speaker: harvey
          text: Give them to whom?
        - id: ch01-b11
          speaker: manuel
          text: Why, to the Virgin at our Church on the Hill. She is always good to fishermen. That is why so few Portuguese men are drowned.
        - id: ch01-b12
          speaker: harvey
          text: So you're a Roman Catholic?
        - id: ch01-b13
          speaker: manuel
          text: I am a Madeira man, not a Porto Pico boy. What else should I be, a Baptist? I always give candles when I return to Gloucester. Two or three extra ones too. The good Virgin never forgets Manuel.
        - id: ch01-b14
          speaker: narrator
          text: A match flared in Tom Platt's bunk and lit his scarred face as he drew on his pipe.
        - id: ch01-b15
          speaker: tom_platt
          text: I don't see it that way. The sea is the sea. You'll get whatever is coming to you, whether you burn candles or kerosene.
        - id: ch01-b16
          speaker: long_jack
          text: It never hurts to have a friend at court. I think Manuel has the right of it. About ten years ago, I crewed on a South Boston market boat. We were off Minot's Ledge with a northeaster chasing us stern first, thick as porridge. The old skipper was drunk, nodding over the tiller. I promised myself that if I ever set my boat hook on T-wharf again, I'd show the saints what sort of craft they'd saved me from.
        - id: ch01-b17
          speaker: long_jack
          text: Well, here I am. I spent a month making a model of that filthy old Kathleen and gave it to the priest. He hung it before the altar. A model makes more sense than a candle. Anyone can buy candles in a shop. A model is a work of art. It shows the good saints that you took trouble and truly feel grateful.
        - id: ch01-b18
          speaker: tom_platt
          text: Do you honestly believe that, Irish?
        - id: ch01-b19
          speaker: long_jack
          text: Would I have done it if I didn't, Ohio?
        - id: ch01-b20
          speaker: tom_platt
          text: Well, Enoch Fuller made a model of the old Ohio, and it's in the Salem museum now. A mighty handsome model too. But Enoch never meant it as a sacrifice. The way I see it...
        - id: ch01-b21
          speaker: narrator
          text: That was enough to begin one of the hour-long arguments fishermen love. The talk would have gone around in shouting circles, proving nothing at all, but Dan broke in with a cheerful song.
        - id: ch01-b22
          speaker: dan
          text: Up jumped the mackerel with his striped back. Reef in the mainsail and haul on the tack, for it's windy weather...
        - id: ch01-b23
          speakers: [dan, long_jack]
          ensemble: duo
          text: And it's blowy weather. When the winds begin to blow, pipe all hands together!
        - id: ch01-b24
          speaker: narrator
          text: Dan glanced carefully at Tom Platt and held the accordion low inside his bunk.
        - id: ch01-b25
          speaker: dan
          text: Up jumped the cod with his chuckle-head. He went to the main chains to heave at the lead, for it's windy weather. Up jumped the flounder that swims by the ground. Chuckle-head! Chuckle-head! Mind where you sound!
        - id: ch01-b26
          speaker: narrator
          text: Tom Platt began hunting for something. Dan crouched lower but sang louder. Then Tom's huge rubber boot spun across the forecastle and struck Dan's raised arm. War had stood between the man and the boy ever since Dan discovered that merely whistling that tune made Tom furious while he cast the lead.
        - id: ch01-b27
          speaker: dan
          text: Knew I'd catch you!
        - id: ch01-b28
          speaker: narrator
          text: Dan threw the boot back with perfect aim.
        - id: ch01-b29
          speaker: dan
          text: If you don't care for my music, take out your fiddle. I'm not lying here all day listening to you and Long Jack fight over candles. Play, Tom Platt, or I'll teach Harvey that tune!
        - id: ch01-b30
          speaker: narrator
          text: Tom reached into a locker and brought out an old white fiddle. Manuel's eyes shone. From behind the post, he produced a tiny wire-strung instrument like a guitar. He called it a machette.
        - id: ch01-b31
          speaker: long_jack
          text: Now we have a concert! A proper Boston concert.
        - id: ch01-b32
          speaker: narrator
          text: Spray burst through the hatch as it opened. Disko climbed down in yellow oilskins.
        - id: ch01-b33
          speaker: long_jack
          text: You're just in time, Disko. What's she doing outside?
        - id: ch01-b34
          speaker: disko
          text: About this!
        - id: ch01-b35
          speaker: narrator
          text: The We're Here gave a shove, and Disko dropped onto the lockers.
        - id: ch01-b36
          speaker: long_jack
          text: We're singing so our breakfasts stay down. You'll lead us, of course.
        - id: ch01-b37
          speaker: disko
          text: I know only two old songs, and you've heard them both.
        - id: ch01-b38
          speaker: narrator
          text: Tom Platt gave him no time for excuses. His fiddle began a mournful tune like wind moaning and masts creaking. Disko fixed his eyes on the beams overhead and started an ancient song, while Tom twisted the melody around him until words and music fit.
        - id: ch01-b39
          speaker: disko
          text: There is a crack packet, a packet of fame. She hails from New York, and the Dreadnought's her name. You may talk of your fliers, Swallowtail and Black Ball, but the Dreadnought's the packet that can beat them all. Now the Dreadnought lies in the River Mersey, waiting for the tugboat to tow her to sea. But when she's off soundings, you shortly will know...
        - id: ch01-b40
          speakers: [disko, tom_platt, dan, long_jack]
          ensemble: chorus
          text: She's the Liverpool packet. O Lord, let her go!
        - id: ch01-b41
          speaker: disko
          text: Now the Dreadnought is howling across the Banks of Newfoundland, where the water is shallow and the bottom is sand. All the little fish swimming to and fro say...
        - id: ch01-b42
          speakers: [disko, tom_platt, dan, long_jack]
          ensemble: chorus
          text: She's the Liverpool packet. O Lord, let her go!
        - id: ch01-b43
          speaker: narrator
          text: There were scores of verses. Disko worked the Dreadnought through every mile between Liverpool and New York as carefully as if he stood on her deck. Beside him, the accordion pumped and the fiddle squeaked. Tom Platt followed with a song about rough, tough McGinn, the pilot who would bring the vessel in. Then the men asked Harvey for a song. He felt honored, but the only thing he could recall was part of “Skipper Ireson's Ride,” learned at his camp school in the Adirondacks. The title seemed right for a fishing schooner. He had barely spoken it when Disko stamped one foot.
        - id: ch01-b44
          speaker: disko
          text: Stop right there, young fellow. That song is a false judgment, and it's the worst kind because the words stick in your ear.
          emotion: angry
        - id: ch01-b45
          speaker: dan
          text: I should have warned you. That title always sets Dad off.
        - id: ch01-b46
          speaker: harvey
          text: What's wrong with it?
        - id: ch01-b47
          speaker: narrator
          text: Harvey was surprised, and a little angry too.
        - id: ch01-b48
          speaker: disko
          text: Everything you're about to sing. It's wrong from beginning to end, and Whittier is to blame. I don't usually take up for a Marblehead man, but what happened was not Ben Ireson's fault. My father told me the true story many times. Here it is.
        - id: ch01-b49
          speaker: long_jack
          text: For the hundredth time.
        - id: ch01-b50
          speaker: narrator
          text: Long Jack said it under his breath.
        - id: ch01-b51
          speaker: disko
          text: Before the War of 1812, Ben Ireson was skipper of the Betty, coming home from the Banks. Justice matters no matter how long ago it was. Off Cape Cod Light, they found the Active of Portland leaking badly. Gibbons of Portland was her skipper. A terrible gale was blowing, and the Betty was carrying all the sail she could to get home.
        - id: ch01-b52
          speaker: disko
          text: Ireson said it made no sense to risk a boat in that sea. His men refused to listen. Then he asked them to stay near the Active until the waves settled. They refused that too. They would not hang around the Cape in such weather, whether the other boat leaked or not. They raised the staysail and left, carrying Ireson with them because a skipper cannot sail a schooner alone.
        - id: ch01-b53
          speaker: disko
          text: The people in Marblehead blamed Ireson for not risking the Betty. The next day the sea was calm, though no one stopped to think about that, and a Truro boat rescued some of the Active's crew. Those men came into Marblehead saying Ireson had disgraced his town. When Ireson's crew saw everyone turn against them, they lost their nerve. They blamed him and swore the whole decision had been his.
        - id: ch01-b54
          speaker: disko
          text: And it wasn't the women who tarred and feathered him. Marblehead women don't behave that way. A mob of men and boys did it. They dragged him through town in an old dory until its bottom fell out. Ireson told them they would be sorry someday.
        - id: ch01-b55
          speaker: disko
          text: The truth came out later, as truth usually does, too late to help an honest man. Then Whittier took the loose end of that lying tale and tarred and feathered Ben Ireson all over again after he was dead. That was the only poem Whittier ever got wrong, but wrong it was. When Dan brought it home from school, I gave him a sound whipping.
        - id: ch01-b56
          speaker: disko
          text: You didn't know any better. Now I've given you the facts, and I expect you to remember them from this day forward. Ben Ireson was nothing like the man in that poem. My father knew him before and after the whole affair. Be careful with quick judgments, young fellow. Who's next?
        - id: ch01-b57
          speaker: narrator
          text: Harvey had never heard Disko say so much at once. His cheeks burned, and he sank back. Dan quickly pointed out that a boy could only learn what teachers gave him, and that life was too short to keep track of every lie told along the coast.
        - id: ch01-b58
          speaker: narrator
          text: Manuel plucked a strange tune on his rattling little machette. He sang in Portuguese about “Nina, innocente,” and ended with a sweep of his whole hand that snapped the song shut. Then Disko gave them his second song. The melody was old and creaky, and everyone joined the chorus.
        - id: ch01-b59
          speaker: disko
          text: Now April is over and melted the snow, and out of New Bedford we shortly must tow. Yes, out of New Bedford we shortly must clear. We're the whalers who never see wheat in the ear.
        - id: ch01-b60
          speaker: narrator
          text: For a little while, the fiddle played very softly by itself.
        - id: ch01-b61
          speakers: [disko, tom_platt, dan, long_jack]
          ensemble: chorus
          text: Wheat in the ear, my true love's posy blowing. Wheat in the ear, we're going off to sea. Wheat in the ear, I left you fit for sowing. When I come back, a loaf of bread you'll be!
        - id: ch01-b62
          speaker: narrator
          text: The song almost made Harvey cry, though he could not have said why. What came next was worse. The cook dropped his potatoes and held out his hands for the fiddle. Still leaning against the locker, he began a tune that sounded like something terrible that could not be escaped. Then he sang in a language Harvey did not know, his broad chin pressed to the fiddle and the whites of his eyes shining in the lamplight. Harvey swung out of his bunk to listen. Through the groaning timbers and washing water, the tune murmured and mourned like surf on a lee shore in blind fog. It ended in a wail.
        - id: ch01-b63
          speaker: dan
          text: Jimmy Christmas! That gives me the shivers. What in thunder was it?
        - id: ch01-b64
          speaker: cook
          text: It was the song of Fin McCoul when he went to Norway.
        - id: ch01-b65
          speaker: narrator
          text: The cook's English was not thick. Each word came out clean and separate, like a phonograph.
        - id: ch01-b66
          speaker: long_jack
          text: I've been to Norway, and I never made such a sickly noise. Still, it does sound like some of the old songs.
        - id: ch01-b67
          speaker: narrator
          text: Long Jack sighed.
        - id: ch01-b68
          speaker: dan
          text: Don't give us another one until we've had something cheerful between.
        - id: ch01-b69
          speaker: narrator
          text: Dan's accordion sprang into a quick, catchy tune.
        - id: ch01-b70
          speaker: dan
          text: It's six and twenty Sundays since last we saw the land, with fifteen hundred quintal, and fifteen hundred quintal, fifteen hundred topping quintal, between old Quereau and Grand!
        - id: ch01-b71
          speaker: tom_platt
          text: Hold on! Are you trying to ruin the trip? That song is a sure Jonah unless all our salt is wet.
        - id: ch01-b72
          speaker: dan
          text: No, it isn't, Dad. Not unless I sing the very last verse. You can't teach me anything about Jonahs!
        - id: ch01-b73
          speaker: harvey
          text: What do you mean? What's a Jonah?
        - id: ch01-b74
          speaker: tom_platt
          text: A Jonah is anything that spoils your luck. It might be a man, a boy, or even a bucket. Once I knew a splitting knife that ruined two whole trips before we found it out. There are all kinds. Jim Bourke was a Jonah until he drowned on Georges. I wouldn't have sailed with Jim Bourke if I were starving. And the Ezra Flood carried a green dory that drowned four men. At night, it used to glow like a fiery eye in the nest.
        - id: ch01-b75
          speaker: harvey
          text: You believe that? I thought the sea gave everyone whatever was coming to them.
        - id: ch01-b76
          speaker: narrator
          text: Harvey remembered what Tom had said about candles and models. A murmur of disagreement passed around the bunks.
        - id: ch01-b77
          speaker: disko
          text: That's true outside the boat. Aboard her, things can happen. Don't make fun of Jonahs, young fellow.
        - id: ch01-b78
          speaker: dan
          text: Harvey isn't a Jonah. The day after we pulled him out, we made a first-rate catch.
        - id: ch01-b79
          speaker: narrator
          text: The cook threw back his head and gave a sudden, thin laugh. It unsettled everyone.
        - id: ch01-b80
          speaker: long_jack
          text: Mercy! Don't do that again, Doctor. We aren't used to it.
        - id: ch01-b81
          speaker: dan
          text: What's the matter? Isn't Harvey our good-luck charm? Didn't the fish start biting after we found him?
        - id: ch01-b82
          speaker: cook
          text: Oh, yes. I know. But the catch is not finished yet.
        - id: ch01-b83
          speaker: dan
          text: He won't hurt us. What are you hinting at? Harvey is all right.
        - id: ch01-b84
          speaker: cook
          text: No harm. No. But one day, he will be your master, Danny.
        - id: ch01-b85
          speaker: dan
          text: Is that all? He won't, not by a jugful.
        - id: ch01-b86
          speaker: cook
          text: Master!
        - id: ch01-b87
          speaker: narrator
          text: The cook pointed at Harvey. Then he pointed at Dan.
        - id: ch01-b88
          speaker: cook
          text: Man. In some years, I shall see it. Master and man. Man and master.
        - id: ch01-b89
          speaker: dan
          text: That's news. How soon?
        - id: ch01-b90
          speaker: tom_platt
          text: How in thunder did you work that out?
        - id: ch01-b91
          speakers: [dan, tom_platt, long_jack]
          ensemble: chorus
          text: How?
        - id: ch01-b92
          speaker: cook
          text: I see it in my head. I do not know how, but that is how it will be.
        - id: ch01-b93
          speaker: narrator
          text: He lowered his head and peeled potatoes again. No one could coax another word from him.
        - id: ch01-b94
          speaker: dan
          text: Plenty will have to happen before Harvey becomes my master. Still, I'm glad the Doctor didn't call him a Jonah. I suspect Uncle Salters is the greatest Jonah in the fleet when it comes to his own luck. I don't know if it spreads like smallpox. He ought to sail on the Carrie Pitman. That boat is her own Jonah. It makes no difference who crews her or what gear she carries. She'd break loose in a flat calm.
        - id: ch01-b95
          speaker: disko
          text: At least we're well away from the fleet, Carrie Pitman and all.
        - id: ch01-b96
          speaker: narrator
          text: A knock sounded on the deck above.
        - id: ch01-b97
          speaker: dan
          text: Uncle Salters has caught up with his luck.
        - id: ch01-b98
          speaker: narrator
          text: Disko went up. A moment later his voice came down the hatch.
        - id: ch01-b99
          speaker: disko
          text: The weather has blown clear!
        - id: ch01-b100
          speaker: narrator
          text: Everyone tumbled out of the forecastle for fresh air. The fog was gone, but great dark rollers followed it. The We're Here slid into long sunken lanes that felt safe and almost homelike, if only they would stay still. They never did. The sea lifted the schooner onto one gray hill after another, then sent her zigzagging down while the wind hooted in the rigging. Far away, one wave burst into white foam. At once the others followed, until interlaced white and gray made Harvey's eyes swim. Four or five storm petrels wheeled around the bows, shrieking as they passed. Rain squalls wandered across the hopeless waste, ran with the wind and then against it, and faded away.
        - id: ch01-b101
          speaker: uncle_salters
          text: Seems to me I saw something flicker over there, toward the northeast.
        - id: ch01-b102
          speaker: disko
          text: It can't be anyone from the fleet. The sea is smoothing over mighty fast. Danny, climb up a way and see how our trawl buoy lies.
        - id: ch01-b103
          speaker: narrator
          text: Disko peered under his eyebrows, one hand braced on the forecastle gangway as the solid bows chopped into the troughs. In his great boots, Dan trotted rather than climbed up the main rigging. The easy way he moved filled Harvey with envy. Dan hooked himself around the swaying cross-trees and searched until he found the tiny black buoy flag on the shoulder of a swell a mile away.
        - id: ch01-b104
          speaker: dan
          text: The buoy is all right. Sail ho! Dead north, coming down like smoke! She's a schooner too.
        - id: ch01-b105
          speaker: narrator
          text: They waited another half hour. The sky opened in patches, and now and then a weak flash of sun turned parts of the water olive green. At last a cut-off foremast rose, dipped, and vanished. On the next wave, a high stern appeared with old wooden davits shaped like snail horns. The horns were painted red.
        - id: ch01-b106
          speaker: dan
          text: Frenchmen! No, wait. They aren't French. Dad!
        - id: ch01-b107
          speaker: disko
          text: No French boat looks like that. Salters, your cursed luck grips tighter than a screw in a barrel head.
        - id: ch01-b108
          speaker: uncle_salters
          text: I have eyes. That's Uncle Abishai.
        - id: ch01-b109
          speaker: disko
          text: You can't possibly know for certain yet.
        - id: ch01-b110
          speaker: tom_platt
          text: The king of all Jonahs. Oh, Salters, why weren't you below and asleep?
        - id: ch01-b111
          speaker: uncle_salters
          text: How was I supposed to know?
        - id: ch01-b112
          speaker: narrator
          text: The schooner swung up. She looked like the Flying Dutchman itself. Every rope and spar was filthy, tangled, and neglected. Her old quarterdeck stood about five feet high. Knotted rigging streamed like weeds at the end of a wharf. She ran before the wind, yawing terribly, with her staysail lowered to serve as an extra foresail and the foreboom braced over the side. Her bowsprit pointed upward like one on an ancient warship. The jib boom had been splinted, spliced, nailed, and clamped until nothing more could mend it. Each time she pitched forward and settled on her wide stern, she looked like a ragged, shameless old woman sneering at a decent girl.
        - id: ch01-b113
          speaker: uncle_salters
          text: That's Abishai. She's full of gin, Judique men, and judgments of Providence that never quite catch him. He must have gone toward Miquelon for bait.
        - id: ch01-b114
          speaker: long_jack
          text: He'll drive her under. That's no rig for weather like this.
        - id: ch01-b115
          speaker: disko
          text: No, he won't. He'd have done it years ago if he could. Looks more as if he means to run us under. Tom, isn't she farther down by the bow than she ought to be?
        - id: ch01-b116
          speaker: tom_platt
          text: If that's how he loaded her, she isn't safe. If her seams are spilling oakum, he'd better get to the pumps quickly.
        - id: ch01-b117
          speaker: narrator
          text: The battered creature threshed closer, turned with a clatter of loose gear, and stopped head to wind within shouting distance. A gray beard wagged above her rail. A thick voice yelled something Harvey could not understand, but Disko's face grew dark.
        - id: ch01-b118
          speaker: disko
          text: He'd risk every spar he owns just to bring bad news. He says the wind is going to shift, but he's in for worse himself. Abishai! Abishai!
        - id: ch01-b119
          speaker: narrator
          text: Disko pumped one arm up and down and pointed toward the old schooner's bow. Her crew only mocked him and laughed.
        - id: ch01-b120
          speaker: uncle_abishai
          text: Bounce you, strip you, and trip you! A living gale is coming, a living gale! Count up your last trip, all you Gloucester haddocks. You'll never see Gloucester again!
        - id: ch01-b121
          speaker: narrator
          text: The wild curse came from Uncle Abishai across the water.
        - id: ch01-b122
          speaker: tom_platt
          text: Drunk and crazy, as usual. I wish he hadn't seen us.
        - id: ch01-b123
          speaker: narrator
          text: Abishai's vessel drifted beyond hearing. The gray head kept shouting about a dance at the Bay of Bulls and a dead man in the forecastle. Harvey shivered. He had seen her dirty, littered decks and the savage eyes of her crew.
        - id: ch01-b124
          speaker: long_jack
          text: For a boat that rides so deep, that's a fine little floating hell. I wonder what trouble he's made ashore.
        - id: ch01-b125
          speaker: dan
          text: He's a trawler. He runs along the coast for bait but never goes home. He does business up on the south and east shores.
        - id: ch01-b126
          speaker: narrator
          text: Dan nodded toward the merciless Newfoundland beaches.
        - id: ch01-b127
          speaker: dan
          text: Dad won't take me ashore there. It's a hard crowd, and Abishai is the hardest of them all. His schooner is almost seventy years old, they say. She's the last of the old Marblehead heel-tappers, with a quarterdeck they don't build anymore. But Abishai can't use Marblehead. No one wants him there.
        - id: ch01-b128
          speaker: dan
          text: He drifts around in debt, trawling and cursing just as you heard. He's been a Jonah for years. He gets liquor from the Fécamp boats and uses it in spells, selling winds and such nonsense. I suppose he's crazy.
        - id: ch01-b129
          speaker: tom_platt
          text: There's no use underrunning the trawl tonight. He came alongside just to curse us. I'd give my whole wage and share to see him at the gangway of the old Ohio before flogging ended. Six dozen lashes, about, with Sam Mocatta laying them across each other.
        - id: ch01-b130
          speaker: narrator
          text: The disheveled heel-tapper danced drunkenly away before the wind, and every eye followed her.
        - id: ch01-b131
          speaker: cook
          text: His own death made him speak that way! He is fey. Fey, I tell you! Look!
          emotion: fearful
        - id: ch01-b132
          speaker: narrator
          text: Three or four miles away, Abishai's schooner entered a patch of watery sunlight. The light dulled and went out. As it vanished, so did the vessel. She sank into a hollow between the waves and did not rise again.
        - id: ch01-b133
          speaker: disko
          text: She's gone under, by the Great Hook-Block! Drunk or sober, we have to help them. Haul the cable short and break out the anchor. Move!
        - id: ch01-b134
          speaker: narrator
          text: Disko jumped aft. They set the jib and foresail so hard that the shock threw Harvey onto the deck. To save time, the crew shortened the cable and tore the anchor straight from the bottom while the schooner moved. Sailors used such brute force only when life was at stake, and the little We're Here complained like a person.
        - id: ch01-b135
          speaker: narrator
          text: They raced to the place where Abishai's craft had disappeared. They found two or three trawl tubs, a gin bottle, and a smashed dory. There was nothing else.
        - id: ch01-b136
          speaker: disko
          text: Leave those things. I wouldn't bring aboard so much as a match that belonged to Abishai. She must have gone straight under. Her seams had probably been throwing out oakum for a week, and not one of them thought to pump. There's another boat lost because every man left port drunk.
        - id: ch01-b137
          speaker: long_jack
          text: Glory be! If they'd stayed above water, we'd have had to rescue them.
        - id: ch01-b138
          speaker: tom_platt
          text: I was thinking the same thing.
        - id: ch01-b139
          speaker: cook
          text: Fey! Fey! He has carried his own luck away with him.
        - id: ch01-b140
          speaker: manuel
          text: It will be good to tell the fleet when we see them. If you run before the wind like that and the ship works her seams open...
        - id: ch01-b141
          speaker: narrator
          text: Manuel spread his hands in a gesture that said everything. Penn sat down on the cabin roof and sobbed from horror and pity. Harvey could not understand that he had watched men die on the open sea, but he felt sick. Dan climbed to the cross-trees, and Disko steered back toward their trawl buoys. They had barely come in sight when the fog covered the sea again.
        - id: ch01-b142
          speaker: disko
          text: When men go out here, they go mighty fast. Think about that for a while, young fellow. Liquor did it.
        - id: ch01-b143
          speaker: narrator
          text: After dinner, the sea grew calm enough for fishing from the deck. Penn and Uncle Salters worked with special eagerness, and the catch was both large and full of big fish.
        - id: ch01-b144
          speaker: uncle_salters
          text: Abishai surely took his bad luck with him. The wind hasn't shifted or risen at all. What about the trawl? I never believed in superstition anyway.
        - id: ch01-b145
          speaker: narrator
          text: Tom Platt insisted they ought to haul the trawl and set it in a new place.
        - id: ch01-b146
          speaker: cook
          text: The luck is in two pieces. You will see when you look. I know.
        - id: ch01-b147
          speaker: narrator
          text: That delighted Long Jack. He shouted Tom down, and the two men rowed out together.
        - id: ch01-b148
          speaker: narrator
          text: To underrun a trawl, fishermen pull its long line over one side of a dory. They take off each fish, bait the hook again, and lower it back into the sea. It is like pinning and unpinning linen along a wash line. The work takes a long time, and it is dangerous. One twitch of the sagging line can pull a boat under in an instant.
        - id: ch01-b149
          speaker: narrator
          text: Then Tom Platt's voice boomed through the fog, singing, “And now to thee, O Captain.” Everyone aboard the We're Here took heart. The dory swirled alongside with a heavy load, and Tom shouted for Manuel to bring the relief boat.
        - id: ch01-b150
          speaker: long_jack
          text: The luck was cut squarely in two. The first half brought up nothing but those sea cucumbers we call pumpkins. Tom wanted to haul the whole trawl and be done. I said I'd trust the Doctor and his second sight. Sure enough, the other half sagged with big cod. Hurry, Manuel! Bring us a tub of bait. There's luck floating tonight.
        - id: ch01-b151
          speaker: narrator
          text: Long Jack pitched fish aboard as he spoke. Harvey stared at the skill that kept the plunging dory from smashing against the schooner. The cod bit the freshly baited hooks as soon as the hooks returned to the water. Tom and Long Jack worked steadily up and down the trawl. The dory's bow plunged under the wet line. The men stripped away the pumpkins, slapped the new cod against the rail, baited the empty hooks, and filled Manuel's dory. They kept at it until dusk.
        - id: ch01-b152
          speaker: disko
          text: I'm taking no chances with Abishai floating so near. He won't sink for a week. Hoist the dories aboard. We'll dress the fish after supper.
        - id: ch01-b153
          speaker: narrator
          text: It was a mighty catch to dress. Three or four blowing grampuses attended the work. The crew did not finish until nine o'clock, and Harvey heard Disko chuckle three separate times as the boy pitched split fish into the hold. Later, when the men had gone to their bunks, Dan and Harvey ground the knives.
        - id: ch01-b154
          speaker: dan
          text: You're coming along mighty fast. There's a fair sea running tonight, and I haven't heard one complaint from you.
        - id: ch01-b155
          speaker: harvey
          text: I've been too busy. Now that I notice, she is kicking pretty high.
        - id: ch01-b156
          speaker: narrator
          text: Harvey tested the edge of a blade. Around her anchor, the little schooner played among waves tipped with silver. She backed away from the tight cable as if its presence surprised her. Then she sprang at it like a kitten. When the bow came down, spray burst through the hawse holes with a gunshot crack.
        - id: ch01-b157
          speaker: narrator
          text: The We're Here shook her head as if to say, “Sorry, but I can't stay with you. I'm going north.” She slipped sideways, then stopped so sharply that all her rigging rattled. She seemed ready to make a serious speech, only to lose it in a fit of restless jerks. One moment she was a puppy chewing a string. The next, she was a clumsy woman riding sidesaddle, a headless hen, or a cow stung by a hornet. The sea chose each new part for her.
        - id: ch01-b158
          speaker: dan
          text: Watch her making her speech. Now she's Patrick Henry!
        - id: ch01-b159
          speaker: narrator
          text: The schooner swung sideways over a roller and waved her jib boom from side to side.
        - id: ch01-b160
          speaker: dan
          text: As for me, give me liberty or give me death!
        - id: ch01-b161
          speaker: narrator
          text: Down she sat in the moonlit water. She dipped like a lady making a grand curtsy, but the steering gear spoiled the dignity by snickering inside its box. Harvey laughed aloud.
        - id: ch01-b162
          speaker: harvey
          text: Why, she's acting exactly as if she were alive!
        - id: ch01-b163
          speaker: dan
          text: She's as steady as a house and as dry as a herring. She pushes every wave away. “Don't you come near me,” she says. Look at her. Just look!
        - id: ch01-b164
          speaker: narrator
          text: A sheet of spray knocked Dan across the deck.
        - id: ch01-b165
          speaker: dan
          text: You should see one of those toothpicks trying to lift its anchor on its spike from fifteen fathoms down.
        - id: ch01-b166
          speaker: harvey
          text: What's a toothpick?
        - id: ch01-b167
          speaker: dan
          text: One of the new haddock or herring boats. They're fine as yachts at the bow and stern. They have spike bowsprits and deckhouses big enough to hold our cargo. I've heard Burgess himself designed three or four of them. Dad is set against them because they pitch and jolt, but there's piles of money in those boats.
        - id: ch01-b168
          speaker: dan
          text: Dad can find fish, but he isn't progressive. He doesn't keep up with the times. Those new boats are packed with labor-saving gear. Have you ever seen the Elector out of Gloucester? She's a beauty, even if she is a toothpick.
        - id: ch01-b169
          speaker: harvey
          text: What do they cost, Dan?
        - id: ch01-b170
          speaker: dan
          text: Mountains of dollars. Maybe fifteen thousand, perhaps more. They have gold leaf and everything else you can imagine.
        - id: ch01-b171
          speaker: narrator
          text: Then Dan spoke half under his breath.
        - id: ch01-b172
          speaker: dan
          text: I think I'd name her Hattie S., too.
