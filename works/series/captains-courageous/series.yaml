cover_prompt: |-
  A wordless cover scene on the Grand Banks in the late nineteenth century shows a fishing schooner heeling gently across a long blue-gray Atlantic swell amid scattered dories. A slim fifteen-year-old boy with a pale face, dark hair, a red jersey, and weathered trousers braces at the rail while hauling a heavy silver cod from the water. Beside him, a sturdy Portuguese fisherman with curly black hair, small gold hoop earrings, and a blue jersey reaches to guide the line, while a teenage deckhand with a flat red face, twinkling gray eyes, a blue jersey, and high rubber boots steadies a wooden fish tub. The shared pull of the line is the focal action, showing hard-won skill and fellowship rather than danger. Use a wide child-height view from the working deck, with rigging and cream sails framing the figures, dories and fishing craft receding into sea fog, and calm open sky left above them. Keep the vessel, tools, clothing, and North Atlantic setting faithful to the 1890s and independent of all screen adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
