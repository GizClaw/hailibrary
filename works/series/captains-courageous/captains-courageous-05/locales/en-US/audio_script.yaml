  chapters:
    - id: ch01
      title: CHAPTER V
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: That was only the first of Harvey's many talks with Dan. Dan explained why the haddocker he dreamed of owning would inherit the name of his dory. He also told Harvey all about the real Hattie in Gloucester. He even showed him a lock of her hair. Sweet words had failed to win it, so Dan had hooked it from her head while she sat in front of him at school that winter. He had a photograph too. Hattie was about fourteen, held boys in dreadful contempt, and had spent the winter trampling on Dan's heart. Dan revealed all this only after Harvey swore to keep it secret. They talked on moonlit decks, in pitch darkness, and in choking fog, with the wheel whining behind them, the deck rising ahead, and the restless sea roaring all around.
        - id: ch01-b02
          speaker: narrator
          text: As the boys grew close, they naturally had one fight. It raged from bow to stern until Penn came up and pulled them apart. Penn promised not to tell Disko, who thought fighting on watch was even worse than sleeping. Harvey could not match Dan's strength. Still, his new training had changed him enough that he accepted the beating without trying to take revenge by some sneaky trick.
        - id: ch01-b03
          speaker: narrator
          text: By then Harvey had already survived a row of boils between his elbows and wrists, where his wet jersey and oilskins had rubbed his skin raw. Salt water stung them fiercely. Once they were ready, Dan opened them with Disko's razor and welcomed Harvey as a true Banker. Gurry-sores, Dan said, were the mark of the people who belonged out there.
        - id: ch01-b04
          speaker: narrator
          text: Harvey was a boy and had more than enough work to occupy him, so he did not spend much time thinking. He felt terribly sorry for his mother. Often he longed to see her, especially so he could tell her about his marvelous new life and how splendidly he was doing. He preferred not to imagine too closely how she was enduring the news that he must be dead.
        - id: ch01-b05
          speaker: narrator
          text: One day he stood on the forecastle ladder, teasing the cook, who accused him and Dan of stealing fried pies. It suddenly struck Harvey that this life was far better than being brushed aside by strangers in the smoking room of a hired liner.
        - id: ch01-b06
          speaker: narrator
          text: He belonged aboard the We're Here now. He had his place at the table and among the bunks. On stormy days he could hold his own in the long talks, and the men were always willing to hear what they called his fairy tales about life ashore. It took Harvey exactly two days and a quarter to discover that no one but Dan believed those tales. Even Dan sometimes struggled.
        - id: ch01-b07
          speaker: narrator
          text: So Harvey began saying that these things had happened to a friend. This friend was a boy Harvey had heard about in Toledo, Ohio. He drove a tiny coach pulled by four ponies, ordered five suits at once, and led dances called germans at parties where the oldest girl was not yet fifteen and every present was solid silver.
        - id: ch01-b08
          speaker: narrator
          text: Salters declared that such a yarn was desperately wicked, perhaps even blasphemous. But he listened as greedily as anyone. When Harvey finished, the crew offered strong opinions about the dances, the clothes, the gold-tipped cigarettes, the rings and watches, the perfume, the little dinners, the champagne, the card games, and the hotels.
        - id: ch01-b09
          speaker: narrator
          text: Their comments slowly changed the way Harvey spoke about his friend. Long Jack named the boy the Crazy Kid, the Gilt-edged Baby, the Suckin' Vanderpoop, and several other fond names. Soon Harvey would sit with his sea boots on the table and make up disgraceful stories about the friend's silk pajamas and specially imported neckties. Harvey knew how to adapt. He watched every face and listened to every tone around him.
        - id: ch01-b10
          speaker: narrator
          text: Before long he knew that Disko kept the old green-crusted quadrant, known as the hog-yoke, under the bed-bag in his bunk. Disko used it to take the sun, then consulted the Old Farmer's Almanac to find their latitude. Harvey would leap into the cabin and scratch the reckoning and the date into the rusty stove pipe with a nail. A chief engineer on a liner could have done no more.
        - id: ch01-b11
          speaker: narrator
          text: No engineer with thirty years at sea could have looked half as ancient and knowing as Harvey did when he announced the schooner's position. First he carefully spat over the side. Then he gave the figures. Only after that would he return the quadrant to Disko. Such things had their proper manners.
        - id: ch01-b12
          speaker: narrator
          text: The hog-yoke, an Eldridge chart, the farming almanac, Blunt's Coast Pilot, and Bowditch's Navigator were nearly all Disko needed to guide him. His other tool was the deep-sea lead, which served as an extra eye. Harvey nearly killed Penn with it when Tom Platt first taught him to swing and cast it, a trick called flying the blue pigeon. Harvey was not strong enough to keep taking soundings in rough water, but on calm days over shallow ground, Disko often put him to work with the seven-pound lead.
        - id: ch01-b13
          speaker: dan
          text: Dad isn't after the depth, Harve. He wants a sample. Put plenty of grease in the cup.
        - id: ch01-b14
          speaker: narrator
          text: Harvey smeared tallow into the cup at the lead's end. When it came back, he carried Disko whatever it had gathered from the bottom, whether sand, shell, or slime. Disko rubbed it between his fingers, smelled it, and gave his judgment. When he thought about cod, he thought like a cod. Instinct and long experience let him move the We're Here from one fishing place to another and stay with the fish, like a blindfolded chess player moving pieces across a board he could not see.
        - id: ch01-b15
          speaker: narrator
          text: Disko's board was the Grand Bank, a triangle measuring two hundred and fifty miles along each side. The sea rolled endlessly there. Wet fog covered it, gales tormented it, drifting ice crossed it, reckless liners cut paths through it, and the sails of the fishing fleet dotted its waters.
        - id: ch01-b16
          speaker: narrator
          text: For days they worked in fog while Harvey tended the bell. Once the thick air had grown familiar, he went out in Tom Platt's dory, though fear sat high in his throat. The fog stayed down and the fish kept biting. No one can remain helplessly frightened for six hours, so Harvey gave all his attention to the lines and passed Tom the gaff or the gob-stick whenever he called for one.
        - id: ch01-b17
          speaker: narrator
          text: They found their way back by the schooner's bell and Tom's instinct. Manuel's conch sounded faint and thin somewhere beside them. The trip felt unearthly. For the first time in a month, Harvey dreamed that night of water shifting and smoking around the dory, of lines wandering into nothing, and of air melting into sea less than ten feet beyond his straining eyes.
        - id: ch01-b18
          speaker: narrator
          text: A few days later, Harvey went out with Manuel where the bottom should have been forty fathoms down. The entire anchor rope ran out, but the anchor touched nothing. Harvey was mortally afraid. His last connection to solid earth was gone.
        - id: ch01-b19
          speaker: manuel
          text: Whale-hole. That is a fine joke on Disko. Come, we go back.
        - id: ch01-b20
          speaker: narrator
          text: Manuel hauled in the rope and rowed for the schooner. There they found Tom Platt and the others laughing at Disko. For once, the skipper had brought them to the edge of the barren Whale-deep, the empty hole in the Grand Bank.
        - id: ch01-b21
          speaker: narrator
          text: They shifted to another berth through the fog. The next time Harvey went out with Manuel, his hair rose on his head. A white shape moved through the white fog, breathing like a grave. Then came roaring, plunging, and spouting. Harvey had met his first dreaded summer iceberg on the Banks. He crouched in the bottom of the dory while Manuel laughed.
        - id: ch01-b22
          speaker: narrator
          text: Not every day was like that. Some were clear, soft, and warm. On those days it seemed almost wrong to do anything but lounge over the hand lines and slap the drifting sun-scalds with an oar. When the breeze was light, Harvey learned to steer the schooner from one berth to another.
        - id: ch01-b23
          speaker: narrator
          text: The first time the keel answered his hand on the wheel, a thrill ran through him. The schooner slid over the long hollows while the foresail swept back and forth beneath the blue sky. Harvey thought it was magnificent, even though Disko said anyone following his wake would break a snake's back.
        - id: ch01-b24
          speaker: narrator
          text: Pride soon brought its usual punishment. They were sailing close to the wind with an old staysail set. Wanting to show Dan how completely he had mastered steering, Harvey drove the schooner straight into the wind. The foresail crossed with a bang. The foregaff struck the staysail and tore through it, while the mainstay held the sail fast and kept it from crossing.
        - id: ch01-b25
          speaker: narrator
          text: The crew lowered the wreck in dreadful silence. For the next few days Harvey spent every free hour beside Tom Platt, learning to sew with a needle and palm. Dan shouted with delight, because he had made precisely the same mistake when he was learning.
        - id: ch01-b26
          speaker: narrator
          text: Like any boy, Harvey copied each man in turn. Soon his performance joined Disko's special stoop at the wheel, Long Jack's broad overhand swing when hauling lines, Manuel's rounded shoulders and powerful dory stroke, and Tom Platt's wide Ohio stride along the deck.
        - id: ch01-b27
          speaker: long_jack
          text: It's a lovely sight, the way the lad takes to it. I'd wager my wage and share that more than half of it is playacting. He believes he's a bold sailor already. Just look at that little back of his!
        - id: ch01-b28
          speaker: narrator
          text: Harvey was standing lookout by the windlass in the thick weather as Long Jack watched him.
        - id: ch01-b29
          speaker: tom_platt
          text: That's how every one of us begins. Boys pretend and pretend until they've fooled themselves into becoming men. Then they keep at it till they die. I did the same aboard the old Ohio. On my first harbor watch, I felt finer than Admiral Farragut. Dan is full of it too. Look at those boys now, acting like true old salts, with rope yarn for hair and Stockholm tar for blood.
        - id: ch01-b30
          speaker: narrator
          text: Tom called down the cabin stairs to Disko.
        - id: ch01-b31
          speaker: tom_platt
          text: Seems you judged wrong for once, Disko. Why in Rome did you tell us the boy was crazy?
        - id: ch01-b32
          speaker: disko
          text: He was crazy as a loon when he came aboard. I'll allow he's sobered up a good deal since then. I cured him.
        - id: ch01-b33
          speaker: tom_platt
          text: He can spin a fine yarn. The other night he told us about a boy his own age driving a clever little carriage with four ponies around Toledo, Ohio, and giving suppers for a crowd of other youngsters. Strange sort of fairy tale, but mighty interesting. He knows dozens of them.
        - id: ch01-b34
          speaker: disko
          text: I reckon he makes them up himself. Stories like that couldn't be true. Nobody believes him but Dan, and Dan laughs at them. I've heard him doing it behind my back.
        - id: ch01-b35
          speaker: narrator
          text: Disko spoke from the cabin, where he was working on the logbook. Uncle Salters sat dripping comfortably beneath the shelter of the starboard dories and drawled a question.
        - id: ch01-b36
          speaker: uncle_salters
          text: Ever hear what Simon Peter Calhoun said when they arranged a match between his sister Hitty and Loring Jerauld, after the boys played that joke on him down on Georges?
        - id: ch01-b37
          speaker: narrator
          text: Tom Platt puffed his pipe in scornful silence. Being a Cape Cod man, he had known that story for no more than twenty years. Salters gave a harsh little chuckle and went on.
        - id: ch01-b38
          speaker: uncle_salters
          text: Simon Peter had Loring exactly right. “Half supported by the town, and the other half a blamed fool,” he said, “and they tell me she's married a rich man.” Simon Peter had no roof to his mouth, so that's how he talked.
        - id: ch01-b39
          speaker: tom_platt
          text: He didn't speak Pennsylvania Dutch. You'd best let a Cape man tell that story. The Calhouns had been gypsies for generations.
        - id: ch01-b40
          speaker: uncle_salters
          text: Well, I never claimed to be a fancy speaker. I'm getting to the lesson. That's our Harvey exactly. Half supported by the town and the other half a blamed fool, while some people believe he's rich. Hah!
        - id: ch01-b41
          speaker: long_jack
          text: Can you imagine the joy of sailing with a whole crew of Salterses? Half in the furrow, the other half in the manure pile, which Calhoun never said, and every one pretending he's a fisherman!
        - id: ch01-b42
          speaker: narrator
          text: A small laugh traveled around the crew at Salters's expense. Disko said nothing. His square, narrow handwriting marched across one dirty page of the logbook after another. He recorded thick fog and few fish on July seventeenth, another fog and another small catch on the eighteenth, a light northeast breeze and plenty of fish on the nineteenth, and fog with light winds on Sunday the twentieth. The week's total was three thousand four hundred and seventy-eight fish.
        - id: ch01-b43
          speaker: narrator
          text: They did no work on Sundays. If the weather was fine, they shaved and washed, and Pennsylvania sang hymns. Once or twice Penn timidly suggested that he might preach a little, if no one considered it rude.
        - id: ch01-b44
          speaker: narrator
          text: The mere idea nearly made Uncle Salters leap at him. Penn was not a preacher, Salters insisted, and must never imagine that he was one.
        - id: ch01-b45
          speaker: uncle_salters
          text: Next thing, he'd remember Johnstown. And then what would happen?
        - id: ch01-b46
          speaker: narrator
          text: They compromised by having Penn read aloud from Josephus. The old leather-bound book smelled of a hundred voyages. It was heavy and solemn like a Bible, but stories of battles and sieges made it livelier. Between them, the crew read nearly the whole book.
        - id: ch01-b47
          speaker: narrator
          text: At other times, Penn was a quiet little man. He sometimes passed three days without speaking, though he played checkers, listened to songs, and laughed at stories. When the men tried to make him talk, he always had the same answer.
        - id: ch01-b48
          speaker: penn
          text: I don't mean to be unfriendly. I simply have nothing to say. My head feels empty. I've almost forgotten my name.
        - id: ch01-b49
          speaker: narrator
          text: Then he would turn to Uncle Salters with a hopeful smile.
        - id: ch01-b50
          speaker: uncle_salters
          text: Why, you're Pennsylvania Pratt! Next you'll forget me!
        - id: ch01-b51
          speaker: penn
          text: No, never. Pennsylvania Pratt, of course. Pennsylvania Pratt.
        - id: ch01-b52
          speaker: narrator
          text: Penn pressed his lips firmly together and repeated the name again and again. Sometimes Salters was the one who forgot and told Penn he was Haskins, Rich, or McVitty. Penn accepted each name just as happily, at least until the next time.
        - id: ch01-b53
          speaker: narrator
          text: Penn was always tender with Harvey. He pitied the boy both as a lost child and as a lunatic. When Salters saw that Penn liked Harvey, he softened too. Salters was not naturally pleasant. He believed it was his duty to keep the boys in order.
        - id: ch01-b54
          speaker: narrator
          text: On a still day, Harvey managed for the first time to climb all the way to the main-truck. He went up trembling, with Dan close behind in case he needed help. Once there, Harvey decided it was his duty to hang Salters's enormous sea boots at the top, where every nearby schooner could see and laugh at them.
        - id: ch01-b55
          speaker: narrator
          text: Harvey never played such tricks on Disko. Even after the skipper stopped giving direct orders and began saying things like, “Don't you want to do this?” or, “Guess you'd better do that,” Harvey took no liberties. Disko's clean-shaven mouth and the tight corners of his eyes had a powerful sobering effect on young blood.
        - id: ch01-b56
          speaker: narrator
          text: Disko taught Harvey how to read his worn chart, covered with thumb marks and pinpricks. In Disko's opinion, it was better than anything the government had published. Pencil in hand, he guided Harvey from berth to berth along the whole chain of banks, from Le Have and Western to Banquereau, St. Pierre, Green, and Grand. All the while, he talked about cod. He also explained the principle behind the hog-yoke.
        - id: ch01-b57
          speaker: narrator
          text: At this work Harvey did better than Dan. He had inherited a gift for figures, and his quick mind loved the thought of stealing information from one brief sight of the gloomy sun over the Banks. In other kinds of seamanship, his age held him back. Disko said he should have started when he was ten.
        - id: ch01-b58
          speaker: narrator
          text: Dan could bait a trawl or find any rope in complete darkness. If Salters had a cut from fish waste across his palm, Dan could clean fish by touch alone. Unless the wind rose to half a gale, he could steer by feeling it on his face and give the We're Here exactly what she needed. Climbing through the rigging came just as naturally. In a dory, boat and boy seemed to share one will and one body. Yet Dan could not explain any of this knowledge to Harvey.
        - id: ch01-b59
          speaker: narrator
          text: There was still plenty to learn whenever storms kept them in the forecastle or on the cabin lockers. Spare eye-bolts, leads, and rings rolled and rattled whenever the talking paused. Disko told of whaling voyages in the eighteen-fifties. He had seen great mother whales killed beside their young, their death struggles churning the black sea and their blood shooting forty feet into the air. He knew of boats smashed into splinters and patent rockets that fired backward and attacked the crews who launched them. He described cutting up the whales, boiling down the blubber, and the terrible ice crush of 1871, when twelve hundred men lost their shelter in three days. Every tale was wonderful, and every one was true.
        - id: ch01-b60
          speaker: narrator
          text: More wonderful still were Disko's stories about cod. In his telling, the fish far below the keel held arguments and reasoned together over their private affairs.
        - id: ch01-b61
          speaker: narrator
          text: Long Jack preferred ghosts. His dreadful stories silenced everyone. He told of the Yo-hoes on Monomoy Beach, which mocked lonely clam diggers and frightened them out of their wits. He knew of walkers in the sand and spirits in the dunes who had never been properly buried. Captain Kidd's dead men guarded hidden treasure on Fire Island, and phantom ships sailed through fog directly over the town of Truro.
        - id: ch01-b62
          speaker: narrator
          text: There was also a harbor in Maine where only a stranger would anchor twice in one particular place. At midnight, a dead crew rowed alongside in an old-fashioned boat with an anchor lying in its bow. They did not call. They whistled for the soul of the man who had disturbed their rest.
        - id: ch01-b63
          speaker: narrator
          text: Until then Harvey had imagined the eastern coast of his own country, from Mount Desert southward, as a place mainly filled with summer visitors, their horses, and country houses with polished floors and imported curtains. He laughed at Long Jack's ghosts, though not as loudly as he would have a month earlier. Before the story ended, he sat very still and shivered.
        - id: ch01-b64
          speaker: narrator
          text: Tom Platt could talk forever about sailing around Cape Horn aboard the old Ohio in the days when sailors were flogged. His navy belonged to the past, as dead as the dodo, the navy that disappeared after the great war. He explained how sailors loaded red-hot cannon shot with wet clay between the glowing iron and the powder charge. When those shots struck wood, they hissed and smoked. The little ship-boys aboard the Miss Jim Buck threw water over them and shouted toward the fort for another try.
        - id: ch01-b65
          speaker: narrator
          text: Tom also told of blockades and long weeks rolling at anchor. Steamships left and returned when their coal was gone, but the sailing ships had no such escape. In bitter gales, two hundred men worked day and night, hammering and chopping ice from cables, blocks, and rigging. The galley glowed as hot as the enemy's cannon shot, and the men drank cocoa by the bucket.
        - id: ch01-b66
          speaker: narrator
          text: Tom Platt had no use for steam. It had still been fairly new when his service ended. He admitted that steam might look clever during peacetime. Even so, he hoped sails would return one day on ten-thousand-ton frigates carrying booms one hundred and ninety feet long.
        - id: ch01-b67
          speaker: narrator
          text: Manuel spoke slowly and gently. His stories carried them to Madeira, where pretty girls washed clothes by moonlight in the dry beds of streams beneath waving banana leaves. He told legends about saints, and described strange dances and fights in the cold ports of Newfoundland where the schooners went for bait.
        - id: ch01-b68
          speaker: narrator
          text: Salters usually talked about farming. Even while reading and explaining Josephus, he never forgot his great purpose. He meant to prove that green manure, especially clover, was better than every kind of phosphate. When phosphates came up, he became insulting. He pulled greasy Orange Judd farm books from his bunk, read them aloud in a chanting voice, and shook a finger at Harvey. The boy understood none of it.
        - id: ch01-b69
          speaker: narrator
          text: At first Harvey made jokes about Salters's lectures. Penn looked so truly hurt by that disrespect that Harvey stopped. Afterward he endured the lessons in polite silence, which was very good for him.
        - id: ch01-b70
          speaker: narrator
          text: The cook did not normally join these talks. Most days he spoke only when speech was necessary. At times, though, a strange flood of words came over him, and he would talk for an hour in a mixture of Gaelic and broken English. He spoke most freely to the boys. He never took back his prophecy that Harvey would one day become Dan's master and that the cook himself would live to see it.
        - id: ch01-b71
          speaker: narrator
          text: He told them about carrying mail through Cape Breton winters, about the dog train that ran to Coudray, and about the ram steamer Arctic, which broke the ice between the mainland and Prince Edward Island. Then he repeated stories his mother had told him about the far south, where water never froze.
        - id: ch01-b72
          speaker: cook
          text: When I die, my soul will rest on a warm beach of white sand, with palm trees moving above me.
        - id: ch01-b73
          speaker: narrator
          text: The boys thought that was a very strange wish for a man who had never seen a palm tree. At every meal, the cook asked Harvey, and no one else, whether the food pleased him. That always made the second half of the crew laugh. Yet they respected the cook's judgment. Deep inside, they began to regard Harvey as a kind of good-luck charm because the cook favored him.
        - id: ch01-b74
          speaker: narrator
          text: Harvey absorbed new knowledge through every pore and drank in strength with every breath of the clean air. Meanwhile, the We're Here followed her course and did her work on the Bank. In the hold, the silver-gray stacks of tightly pressed fish rose higher and higher. No single day brought anything remarkable, but the ordinary working days came one after another without much space between them.
        - id: ch01-b75
          speaker: narrator
          text: Other fishermen watched a skipper with Disko's reputation very closely. Dan called it crowding him. Disko was skilled at slipping away from them through fog banks that thickened and slid across the sea. He avoided company because he wanted room for his own experiments. He also disliked fleets made up of boats and crews from everywhere.
        - id: ch01-b76
          speaker: narrator
          text: Most of the vessels came from Gloucester. Others came from Provincetown, Harwich, Chatham, and ports in Maine, while their crews came from nobody knew where. Danger made men careless, and greed made matters worse. In a crowded fleet, that combination invited every sort of accident. The boats bunched like sheep around a leader no one could identify.
        - id: ch01-b77
          speaker: disko
          text: Let the two Jeraulds lead them. We'll have to lie among the fleet for a while when we reach the Eastern Shoals. If our luck holds, it won't be for long. The ground we're fishing now isn't considered good at all, Harvey.
        - id: ch01-b78
          speaker: narrator
          text: Harvey had just finished an unusually long spell cleaning fish and was drawing water. By then he knew exactly how to shake the bucket so it would fill.
        - id: ch01-b79
          speaker: harvey
          text: This isn't good ground? Then I wouldn't mind finding poor ground for a change.
        - id: ch01-b80
          speaker: dan
          text: The only ground I want to see is Eastern Point, and I don't want us to hit it. Dad, looks like we won't need more than two weeks on the Shoals. You'll see all the company you could want then, Harve. That's when the real work starts. Nobody gets regular meals. Eat from your mug when you're hungry and sleep when you can't stay awake. Lucky we didn't pick you up a month later. We'd never have trained you in time for the Old Virgin.
        - id: ch01-b81
          speaker: narrator
          text: From the Eldridge chart, Harvey understood that the Old Virgin and a cluster of strangely named shoals marked the turning point of their voyage. With luck, the catch there would use the rest of their salt. But the Virgin was only a tiny dot on the chart. Harvey wondered how even Disko, armed with the hog-yoke and the lead, could possibly find it.
        - id: ch01-b82
          speaker: narrator
          text: Later, Harvey learned that Disko could handle that job and almost any other. He could help lost vessels as well. A blackboard four feet by five feet hung in the cabin. Harvey never knew why they carried it until several days of blinding fog brought the ugly blast of a foot-powered foghorn. It sounded like a sick elephant.
        - id: ch01-b83
          speaker: narrator
          text: The We're Here was making a short move, with the anchor dragging just beneath her to save the trouble of hauling and dropping it.
        - id: ch01-b84
          speaker: long_jack
          text: A square-rigger is bawling for her latitude.
        - id: ch01-b85
          speaker: narrator
          text: Wet red headsails appeared out of the fog, followed by a bark. The We're Here rang her bell three times, sending a short message in the language of the sea. The larger vessel backed her topsail amid shrieks and shouted orders.
        - id: ch01-b86
          speaker: uncle_salters
          text: Frenchmen. That's a Miquelon boat out of St. Malo. I'm nearly out of tobacco too, Disko.
        - id: ch01-b87
          speaker: tom_platt
          text: Same here. Hey there! Backez vous! Stand awayez, you thick-ended mucho-bono! You're from St. Malo, eh?
        - id: ch01-b88
          speakers: [french_captain, french_sailor_1, french_sailor_2, french_sailor_3]
          ensemble: chorus
          text: Ah, yes! Mucho bono! Oui, oui! Clos Poulet, St. Malo! St. Pierre and Miquelon!
        - id: ch01-b89
          speaker: narrator
          text: The French sailors waved their wool caps and laughed.
        - id: ch01-b90
          speakers: [french_captain, french_sailor_1, french_sailor_2, french_sailor_3]
          ensemble: chorus
          text: Board! Board!
        - id: ch01-b91
          speaker: disko
          text: Bring up the board, Danny. How those Frenchmen ever reach anywhere is beyond me, unless being somewhere near America counts. Forty-six forty-nine will do for them. I reckon it's close enough to right.
        - id: ch01-b92
          speaker: narrator
          text: Dan chalked the latitude on the blackboard and hung it in the main rigging. The bark answered with a chorus of thanks.
        - id: ch01-b93
          speakers: [french_captain, french_sailor_1, french_sailor_2, french_sailor_3]
          ensemble: chorus
          text: Merci! Merci!
        - id: ch01-b94
          speaker: uncle_salters
          text: Feels a little unfriendly to let them drift off like this.
        - id: ch01-b95
          speaker: narrator
          text: Salters searched his pockets as he spoke.
        - id: ch01-b96
          speaker: disko
          text: Learned French since the last trip, have you? I don't want them throwing stone ballast at us again because you called a Miquelon crew filthy pigs, the way you did off Le Have.
        - id: ch01-b97
          speaker: uncle_salters
          text: Harmon Rush told me that was how to stir them up. Plain American is good enough for me. We're all terribly short of tobacco. Young fellow, you speak French, don't you?
        - id: ch01-b98
          speaker: harvey
          text: Oh, yes. Hey! Stop! Wait for us! We are coming for tobacco!
        - id: ch01-b99
          speakers: [french_captain, french_sailor_1, french_sailor_2, french_sailor_3]
          ensemble: chorus
          text: Ah, tobacco! Tobacco!
        - id: ch01-b100
          speaker: narrator
          text: The Frenchmen laughed once more.
        - id: ch01-b101
          speaker: tom_platt
          text: That reached them. We may as well put a dory over. I don't hold any certificate in French, but I know another language that ought to work. Come along, Harve, and interpret.
        - id: ch01-b102
          speaker: narrator
          text: Harvey and Tom were hauled up the bark's black side into an indescribable tangle of men, gear, and noise. Bright colored pictures of the Virgin covered the cabin walls. The crew called her the Virgin of Newfoundland. Harvey soon discovered that his French belonged to no dialect the Banks recognized. He could manage only nods and grins. Tom, however, waved his arms and communicated splendidly.
        - id: ch01-b103
          speaker: narrator
          text: The captain gave Tom a drink of unspeakable gin. The sailors, with hairy throats, red caps, and long knives, welcomed him as a brother. Then the bargaining began. The French vessel had plenty of tobacco, all of it American and none of it taxed by France. In return, her crew wanted chocolate and crackers.
        - id: ch01-b104
          speaker: narrator
          text: Harvey rowed back to settle the bargain with the cook and Disko, who controlled the schooner's supplies. When he returned, tins of cocoa and bags of crackers were counted out beside the Frenchman's wheel. The scene looked like pirates dividing stolen treasure. Tom emerged wrapped in coils of black tobacco and stuffed all around with cakes of tobacco for chewing and smoking.
        - id: ch01-b105
          speaker: narrator
          text: The cheerful sailors vanished into the mist. The last thing Harvey heard was their song.
        - id: ch01-b106
          speakers: [french_captain, french_sailor_1, french_sailor_2, french_sailor_3]
          ensemble: chorus
          text: Behind my auntie's house there is a pretty wood, and there the nightingale sings all the day and night. What would you give, my beauty, to bring the songbird here? I would give Quebec and Sorel and Saint Denis.
        - id: ch01-b107
          speaker: narrator
          text: Back aboard the We're Here, the tobacco was shared among the crew. Harvey turned to Tom with a question.
        - id: ch01-b108
          speaker: harvey
          text: Why did my French fail when your hand signs worked so well?
        - id: ch01-b109
          speaker: narrator
          text: Tom Platt burst into laughter.
        - id: ch01-b110
          speaker: tom_platt
          text: Hand signs? Well, you might call them that, but those signs are much older than your French. Those French boats are packed with Freemasons. That's the reason.
        - id: ch01-b111
          speaker: harvey
          text: Then are you a Freemason?
        - id: ch01-b112
          speaker: tom_platt
          text: It certainly looks that way, doesn't it?
        - id: ch01-b113
          speaker: narrator
          text: Tom filled his pipe, and Harvey was left with one more mystery of the deep sea to think about.
