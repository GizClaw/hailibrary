  chapters:
    - id: ch01
      title: 第五章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这只是哈维和丹许多次谈心的开头。丹告诉他，将来若真有一条仿伯吉斯船型造出的黑线鳕船，他一定会把自己小艇的名字送给它。那个名字来自格洛斯特一位真正的姑娘，海蒂。哈维听遍了她的事，还看见一绺头发和一张照片。头发是那年冬天上课时，丹坐在海蒂身后，好话说尽也没用，只好用钩子“钩”来的。海蒂十四岁左右，根本瞧不起男孩子，一整个冬天都在践踏丹的心。这些秘密只在发过重誓以后才说，有时是在月光下的甲板上，有时是在漆黑的夜里，有时四周全是叫人透不过气的浓雾。舵轮在身后哀鸣，甲板迎面爬起，船外的大海永远喧嚷，永远不停。丹把每一件事都当作天大的秘密交给哈维，哈维也在这些守夜时光里一点点认识了这个渔家少年。
        - id: ch01-b02
          speaker: narrator
          text: 两个男孩熟了以后，当然也狠狠打过一架。他们从船头一直打到船尾，最后宾恩赶来把两人分开，还答应不告诉迪斯科。船长觉得值班时打架比值班时睡觉还糟。哈维论力气远不是丹的对手，可他认下了这场败仗，没有暗中耍手段报复打赢自己的人。新生活到底已经教会了他不少东西。
        - id: ch01-b03
          speaker: narrator
          text: 那场架发生以前，哈维刚治好两条胳膊上的一串疖子。湿毛衣和油布衣不停割进皮肉，从手肘一路磨到手腕，海水一蜇，滋味很不好受。等疖子熟透，丹拿迪斯科的剃刀替他一个个处理，还告诉他，鱼秽疮正是浅滩渔夫这个行当认自己人的记号。如今哈维也算“见过血的浅滩渔夫”了。
        - id: ch01-b04
          speaker: narrator
          text: 哈维年纪还小，又忙得团团转，没空费神想太多。他非常惦记母亲，常常盼着见她，尤其想把这番奇妙的新生活全讲给她听，也让她知道自己干得多么出色。至于母亲以为他已经死了，该怎么熬过这场打击，他宁愿不去细想。有一天，他站在前舱梯上逗厨子。厨子刚指控他和丹偷了油炸馅饼。哈维忽然明白，这样的日子可比在租来的邮轮吸烟室里受陌生人冷眼强多了。
        - id: ch01-b05
          speaker: narrator
          text: 《我们在这儿号》已经认下了哈维。饭桌边有他的位子，铺位中间也有他的位子。风暴天里大家聚在一起长谈，他也能说得上话。别人爱听他讲岸上的生活，却把那些事叫作“神话”。不过两天又四分之一天，他便发现，只要谈起那个仿佛已经远去的旧生活，除了丹以外就没人相信，就连丹也信得很吃力。于是他把自己的经历安到一个“朋友”头上。那位朋友和他差不多大，在俄亥俄州托莱多驾着四匹小马拉的迷你马车，一次订五套衣裳，还在舞会上领跳“德意志舞”。舞会上最大的姑娘不到十五岁，礼物却全是纯银。
        - id: ch01-b06
          speaker: narrator
          text: 索尔特斯说，这种故事即使算不上亵渎，也邪恶得很，可他听得并不比别人少。每次故事讲完，水手们便一件件评论所谓“上流生活”。“德意志舞”是什么，衣裳该怎么穿，金箔烟嘴的香烟、戒指、手表和香水又有什么用，晚宴、香槟、纸牌和旅馆究竟算什么排场。那些议论让哈维对旧生活有了全新的看法。长杰克给那个“朋友”取了许多名字，什么“疯小子”“镶金边的小娃娃”“吃奶的范德蠢蛋”。后来，哈维自己也翘着海靴，拿丝绸睡衣和专门进口的领饰编故事，专揭“朋友”的短。这个孩子很会适应，身边每一张脸、每一种口气，他都看得见，也听得懂。
        - id: ch01-b07
          speaker: narrator
          text: 不久，他便知道那件绿锈斑斑的旧四分仪藏在迪斯科卧具袋下面。大家管它叫“猪轭”。迪斯科测过太阳，再用《老农夫年鉴》算出纬度，哈维就跳进舱房，拿钉子把结果和日期刻在炉管的铁锈上。邮轮的轮机长也做不了更多，可再老练的轮机员也摆不出哈维那一半的老海客气派。他先朝舷外啐一口，才宣布船当天的位置，之后才肯接过迪斯科手里的四分仪。海上的事，自有海上的规矩。
        - id: ch01-b08
          speaker: narrator
          text: 一件“猪轭”、一张埃尔德里奇海图、《老农夫年鉴》、布朗特的《海岸领航指南》和鲍迪奇的《航海手册》，这些就是迪斯科领船的全部兵器。再加一只深海测深锤，给他当备用的眼睛。汤姆·普拉特头一回教哈维怎样把测深锤甩出去，也就是水手说的“放飞蓝鸽子”，哈维差点拿它砸死宾恩。海面有浪时，他还没力气不停测深。不过天气平静，在浅水区使用七磅重的测深锤，迪斯科很肯用他。
        - id: ch01-b09
          speaker: dan
          text: 爸要的不是水深，是海底的样品。哈维，把牛脂抹足些。
        - id: ch01-b10
          speaker: narrator
          text: 哈维把测深锤末端的小槽涂满牛脂，再把沾来的沙、贝壳、淤泥或别的东西小心送给迪斯科。迪斯科会用手指捻一捻，凑近闻一闻，然后才下判断。他一想鳕鱼，就像鳕鱼那样思量，凭着经过多年检验的经验和本能，把《我们在这儿号》从一处泊位移到另一处，始终跟着鱼群。这就像一个蒙住眼睛的棋手，能在自己看不见的棋盘上准确落子。
        - id: ch01-b11
          speaker: narrator
          text: 这盘棋的棋盘就是大浅滩。它是个巨大的三角形，每边足有二百五十英里，里面只有起伏翻滚的荒海。湿冷浓雾罩着它，狂风不停折磨它，漂流的浮冰四处侵扰。鲁莽的邮轮把一道道航迹刻在海面上，渔船队的点点白帆则散落其间。
        - id: ch01-b12
          speaker: narrator
          text: 他们连续多日在雾里干活，哈维负责敲钟。等他习惯了浓雾，便跟汤姆·普拉特划出去，心里仍怕得厉害。可是雾不散，鱼正在咬钩，没有人能一连六小时只顾害怕。哈维便守好钓线，汤姆要鱼钩或那根叫作“撬嘴棍”的脱钩棒，他就马上递过去。回程靠的是船上的钟声和汤姆的本能，曼努埃尔的海螺号细细地响在近旁。那趟经历不像人间的事。一个月来，哈维第一次做噩梦，梦见小艇周围的水面一层层挪动、冒烟，钓线从船边斜斜伸出去，却没入一片虚无。他使劲瞪着眼睛，头顶的空气就在十英尺外融进下方的海水。
        - id: ch01-b13
          speaker: narrator
          text: 几天后，他和曼努埃尔出去。照说水深是四十英寻，可锚缆放尽，锚还够不到底。哈维觉得自己和大地最后一点联系也断了，吓得要命。
        - id: ch01-b14
          speaker: manuel
          text: 鲸洞。这下迪斯科要闹笑话了。走吧！
        - id: ch01-b15
          speaker: narrator
          text: 他们回到船上，果然看见汤姆等人正起哄迪斯科。船长难得带错一次路，把大家领到了鲸鱼深沟边上，那是大浅滩里一口没有鱼的空洞。他们穿过浓雾，重新寻找泊位。哈维再次坐进曼努埃尔的小艇时，头发都竖了起来。一团白色从白雾里移来，吐出的气息仿佛来自坟墓，接着便轰鸣、冲撞、喷涌。这是他第一次遇见浅滩上可怕的夏季冰山。他缩在船底，曼努埃尔却大笑。有些日子又清澈、柔和、温暖，除了懒懒守着手线，再用桨拍打漂来的“太阳烫伤”水母，做什么都像犯罪。还有些日子只吹微风，哈维便学习掌舵，把船从一个泊位开到另一个泊位。
        - id: ch01-b16
          speaker: narrator
          text: 第一次握住舵轮时，他感觉龙骨听从自己的手，在长长的浪谷上滑行。前帆在蓝天下来回挥动，像巨镰一样扫过天空，那股激动一下透遍全身。迪斯科虽说，照哈维留下的航迹走，蛇的脊梁也会颠断，他还是觉得自己威风极了。可骄傲之后，很快就是跟头。他们正迎风航行，支索帆也升着，幸亏只是一面旧帆。哈维想让丹看看自己学得多么彻底，猛地把船顶进风里。前帆砰然转过，前帆桁刺穿支索帆，把它撕开。主桅支索拦在那里，破帆当然转不过去。众人一言不发，把它降了下来。此后几天，哈维一有空便躲到汤姆背风的一边，学习用缝帆针和护掌。丹却乐坏了，因为他小时候也犯过同样的错。
        - id: ch01-b17
          speaker: narrator
          text: 哈维像所有男孩一样，一会儿模仿这个，一会儿又模仿那个。到最后，船上几个大人的动作全凑到了他身上。他掌舵时学迪斯科那样弓着背，收线时学长杰克从头顶抡圆胳膊，坐进小艇便学曼努埃尔含着肩却很管用的划法，在甲板上又迈起汤姆·普拉特那种宽阔豪迈的俄亥俄式大步。
        - id: ch01-b18
          speaker: long_jack
          text: 看他学得多顺眼！我拿工钱和分成打赌，这一多半是在演戏。他把自己当成勇猛的老水手啦。快瞧他那小后背！
        - id: ch01-b19
          speaker: tom_platt
          text: 大伙儿都是这么长大的。男孩子先不停地装，装着装着，就把自己骗成了大人，以后一直装到死。我在老《俄亥俄号》上也是这样。第一次值班还只是守港，我却觉得自己比法拉格特都神气。丹也满脑子这一套。看这两个小子，装得像真正的老海狗，头发根根是绳纱，血管里流的全是斯德哥尔摩焦油。迪斯科，这回你看走眼了吧？当初为什么说这孩子疯了？
        - id: ch01-b20
          speaker: disko
          text: 他当时就是疯了，刚上船时疯得跟潜鸟一样。不过现在清醒多了。是我把他治好的。
        - id: ch01-b21
          speaker: tom_platt
          text: 这孩子很会讲故事。前几晚他说，有个跟他差不多大的男孩，在俄亥俄州托莱多赶一辆漂亮小车，套着四匹小马，还请一群同岁的孩子吃晚饭。故事是怪，可真好听。他会讲几十个呢。
        - id: ch01-b22
          speaker: disko
          text: 准是他脑袋里编出来的。那种事明摆着全是假的，谁也骗不过，只有丹肯听。丹也只当笑话。我在背后听见过。
        - id: ch01-b23
          speaker: salters
          text: 你们听过西蒙·彼得·卡洪的话没有？他妹妹希蒂和洛林·杰罗尔德订婚，那帮小子在乔治浅滩拿这事逗他。你们知道他说了什么吗？
        - id: ch01-b24
          speaker: narrator
          text: 汤姆轻蔑地抽着烟，一声不响。他是科德角人，这故事才听了二十年，当然轮不到别人讲。索尔特斯叔叔刮着嗓子笑了几声，还是讲了下去。
        - id: ch01-b25
          speaker: salters
          text: 西蒙说洛林啊，一点没说错。“一半靠镇上养，另一半是个大傻样。人家倒告诉我，她嫁了个有钱郎。”西蒙上腭缺了一块，说话就是那种腔。
        - id: ch01-b26
          speaker: tom_platt
          text: 那可不是宾夕法尼亚德裔土话。科德角的故事，还是留给科德角人讲吧。卡洪一家祖祖辈辈都是吉卜赛人。
        - id: ch01-b27
          speaker: salters
          text: 我又没说自己是演说家。我说的是这里头的道理。咱们哈维就是那样，一半靠镇上养，另一半是个大傻样。偏偏还有人肯信他是个有钱郎。呀！
        - id: ch01-b28
          speaker: long_jack
          text: 你想过没有，跟整整一船索尔特斯出海有多舒心？一半埋在犁沟里，另一半泡在粪堆里，还硬说自己是渔夫。卡洪可没说过这句！
        - id: ch01-b29
          speaker: narrator
          text: 四周响起一阵小小的笑声，索尔特斯吃了亏。迪斯科始终不说话，只用棱角分明的大字填写航海日志。那一本本弄脏的纸页上，写的总是这种话：七月十七日，浓雾，鱼少，向北移泊，是日毕。七月十八日，浓雾，捕鱼少许。七月十九日，东北微风，天气晴朗，向东移泊，捕鱼甚多。七月二十日是安息日，有雾和微风，是日毕。本周共捕鱼三千四百七十八条。
        - id: ch01-b30
          speaker: narrator
          text: 星期日，他们从不干活。大家刮胡子，天气好时便洗洗身子，宾恩则唱圣歌。有一两次，他小心地说，倘若不算冒昧，自己或许能讲一小篇道。索尔特斯一听就几乎扑上去堵他的嘴，提醒他不是牧师，连这种念头都不该有。
        - id: ch01-b31
          speaker: salters
          text: 下一步，他就该想起约翰斯敦了。那可怎么办？
        - id: ch01-b32
          speaker: narrator
          text: 最后大家折中，让宾恩朗读《约瑟夫斯》。那册皮面旧书带着上百次航行留下的气味，厚重得很，模样像《圣经》，却有战争和围城可听。他们几乎把全书读完了。平时，瘦小的宾恩十分沉默，有时三天不说一句话，却照样下棋、听歌、听故事，也跟着笑。别人逗他说话，他才解释。
        - id: ch01-b33
          speaker: penn
          text: 我不想显得不合群，只是没有话说。脑袋里空空的，我几乎把自己的名字也忘了。
        - id: ch01-b34
          speaker: narrator
          text: 说完，他会期待地望着索尔特斯微笑。
        - id: ch01-b35
          speaker: salters
          text: 嗨，宾夕法尼亚·普拉特！下一步你连我也该忘了！
        - id: ch01-b36
          speaker: penn
          text: 不会，永远不会。宾夕法尼亚·普拉特，当然是宾夕法尼亚·普拉特。
        - id: ch01-b37
          speaker: narrator
          text: 他会一遍又一遍念这个名字。有时反倒是索尔特斯“忘了”，说他叫哈斯金斯、里奇或麦克维蒂。宾恩每一次都很满意，直到下一回。宾恩一直温柔地对待哈维。他一方面可怜这是个迷路的孩子，一方面又认定他精神不正常。索尔特斯看见宾恩喜欢哈维，也慢慢缓和下来。不过索尔特斯向来不算和气，他认定维持规矩、管教两个男孩，本来就是自己的责任。
        - id: ch01-b38
          speaker: narrator
          text: 一个无风的日子，哈维战战兢兢地爬上主桅顶端，丹跟在后面准备搭手。第一次爬成以后，他也给自己找了一项责任，把索尔特斯的大海靴挂到上头。那双靴子高悬在那里，成了耻辱的标记，任凭最近的双桅船看笑话。不过，他从不敢跟迪斯科放肆。后来老人不再直接下令，也对他说“你是不是该去做这件事”或者“我看你最好去办”，哈维仍旧老老实实。迪斯科那双刮得干净的嘴唇和眼角紧缩的纹路，自有办法让年轻人的热血冷下来。
        - id: ch01-b39
          speaker: narrator
          text: 迪斯科又教他看那张被拇指磨脏、戳满针孔的海图，说它比政府出版的任何海图都管用。他让哈维拿着铅笔，沿着一整串浅滩走。先是勒阿弗尔，再到西浅滩、班克罗、圣皮埃尔、格林，最后是大浅滩。两人从一个泊位走到另一个泊位，迪斯科嘴里讲的全是鳕鱼。他也教会哈维那件“猪轭”究竟按什么原理测算位置。
        - id: ch01-b40
          speaker: narrator
          text: 这件事上，哈维比丹强。他生来会算数，又很喜欢从浅滩上阴沉的太阳那短短一瞥里偷出消息，脑子里所有机灵劲儿都被调动起来。别的海上本领，他却学得太晚。迪斯科说，他十岁就该开始。丹能给延绳钩装饵，能在黑暗里一把抓到要用的绳子。索尔特斯手上若长了鱼秽疮，紧要关头，丹只凭手感也能开膛洗鱼。只要风还不到半场大风，他一碰到迎面的风，便知道怎样顺着《我们在这儿号》的脾气掌舵。爬索具、划小艇，这些事全像身体自己的动作。小艇仿佛就是他的意志和身体，可他偏偏说不明白，没法把这些本领教给哈维。
        - id: ch01-b41
          speaker: narrator
          text: 风暴天里，众人挤在前舱躺着，或坐在舱房的柜凳上，船上的见闻便四处飞。每逢话声停下，备用的眼螺栓、铅锤和铁环就在船里滚动，叮当乱响。迪斯科讲五十年代的捕鲸航程，讲大母鲸怎样在幼鲸身边被杀，黑沉沉的海上，垂死的鲸怎样挣扎翻滚，鲜血又怎样喷起四十英尺。小艇会撞成木片，专利火箭也会装反，倒着射出去，反过来轰击发抖的船员。他还讲割鲸脂、熬鲸油，以及一八七一年那场可怕的冰夹。短短三天，一千二百个人失去船只，被困在冰上。这些故事奇异，却都是真的。更奇的还是鳕鱼的故事。迪斯科说，它们在龙骨下很深的地方，也会为自己的私事争论，也会彼此讲理。
        - id: ch01-b42
          speaker: narrator
          text: 长杰克更爱讲鬼。他说莫诺莫伊海滩有“哟嗬鬼”，会模仿独自挖蛤蜊的人，再把孤零零的人吓得魂飞魄散。还有没能好好下葬、在沙地行走、在沙丘出没的魂。火岛上藏着宝藏，由基德手下的幽灵守卫。有些船会在浓雾中直接从特鲁罗镇上驶过去。缅因州还有一处锚地，本地人绝不在那里停第二次，只有不知情的外乡人才会下锚。因为一船死水手会在午夜划来，旧式小艇的船头放着锚。他们不喊，只吹口哨，召唤惊扰他们安眠的那个人的灵魂。众人听得一声不响。
        - id: ch01-b43
          speaker: narrator
          text: 哈维从前以为，本国东海岸从芒特迪瑟特往南，主要住着夏天带马来度假、在乡间大宅里宴客的人。那些房子铺着硬木地板，挂着万廷门帘，和长杰克嘴里的鬼魂毫不相干。他听鬼故事时也笑，可没有一个月前笑得那么响。到最后，笑声没有了，他只一动不动地坐着发抖。
        - id: ch01-b44
          speaker: narrator
          text: 汤姆·普拉特总讲老《俄亥俄号》绕合恩角的漫长航行。那还是海军使用鞭刑的年月，那支海军早已随着南北大战消失，像渡渡鸟一样绝了种。他讲烧红的炮弹怎样装进炮膛，炮弹和火药包之间要用湿黏土隔开。炮弹打进木头以后嘶嘶冒烟，《吉姆·巴克小姐号》上的小水手便往上泼水，还冲堡垒喊，请他们再来一次。他讲封锁时一连几星期在锚上摇晃，唯一的变化，就是烧完煤的蒸汽船离开以后又回来，帆船根本没有机会。也讲狂风和严寒怎样逼两百个人昼夜敲冰、铲冰，锚链、滑轮和索具全冻住。厨房热得像堡垒射出的红炮弹，船员却一桶一桶地喝热可可。汤姆不喜欢蒸汽机。他退役时，那东西还算新奇。他承认和平时它看起来还像回事，却盼着帆船重返海上，造出一万吨的护卫舰，配一百九十英尺的帆桁。
        - id: ch01-b45
          speaker: narrator
          text: 曼努埃尔的故事缓慢又温柔。他讲马德拉的漂亮姑娘怎样在月光下洗衣，脚下是干涸的河床，头顶香蕉叶轻轻摆动。也讲圣人的传说和纽芬兰寒冷鱼饵港里的怪舞与斗殴。索尔特斯只爱农事。他虽读《约瑟夫斯》，也讲解那本书，可一生真正的使命，是证明绿肥胜过所有磷肥，尤其是三叶草。他一提磷肥便恶语相向，还从铺位拖出油腻的《奥兰治·贾德》农书，对哈维抑扬顿挫地念，手指也跟着摆动。哈维听来跟希腊话一样，一个字也不懂。起初他会拿这些讲课开玩笑，可宾恩听了真心难过，他只好客气地沉默，忍耐到底。这对哈维也有好处。
        - id: ch01-b46
          speaker: narrator
          text: 厨子平常不参加谈话，非到必要时不开口。有时古怪的口才忽然落到他身上，他会混着盖尔语和破碎的英语，一说就是一个钟头。他最愿意和两个男孩谈，也从不收回那个预言。总有一天，哈维会成为丹的主人，厨子会亲眼看见。他讲布雷顿角一带怎样在冬季运邮件，讲开往库德雷的狗拉雪橇队，也讲撞角破冰汽船《北极号》怎样在大陆和爱德华王子岛之间撞开冰层。接着，他又讲母亲从前告诉他的遥远南方。那里的水永远不结冰。他说自己死后，灵魂会躺在温暖洁白的沙滩上，棕榈树就在头顶摇摆。一个一辈子从没见过棕榈树的人竟这样想，两个男孩都觉得很怪。
        - id: ch01-b47
          speaker: narrator
          text: 每一顿饭，厨子只问哈维一个人，饭菜合不合口味，惹得后半班总是发笑。可是大家敬重厨子的判断，心里也因此把哈维当成几分吉祥物。哈维身上每一个毛孔都在吸收新见闻，每大口呼吸一次海上的好空气，也像把一份结实的健康吞进身体。《我们在这儿号》照旧在大浅滩上走自己的路，做自己的活。鱼舱里，一垛垛压紧的银灰色鳕鱼越堆越高。没有哪一天的活计格外出奇，可这些平常日子一个接一个，彼此挨得很紧，也多得很。
        - id: ch01-b48
          speaker: narrator
          text: 迪斯科名声大，邻船自然盯着他，用丹的话说，大家都在“挤他”。可凝乳似的雾堤不断滑动，迪斯科总能借雾甩开他们。他不爱船群，先是因为想自己试探鱼情，再是因为各国渔船混在一起，什么人都有。船队大多来自格洛斯特，也有普罗温斯敦、哈里奇、查塔姆和缅因州各港的船，船员的来处更是谁也说不清。海上的风险会养出鲁莽，再加上贪心，一大群船像羊群一样围着一个自己也没认出的领头者，便给每一种事故都留出了机会。
        - id: ch01-b49
          speaker: disko
          text: 让杰罗尔德家的两个领着他们吧。到了东浅滩，咱们免不了也得混进去一阵。运气好的话，不会待太久。哈维，咱们现在这地方根本算不上好渔场。
        - id: ch01-b50
          speaker: harvey
          text: 这还不算好？那我倒想换换口味，撞上一块坏渔场。
        - id: ch01-b51
          speaker: narrator
          text: 哈维刚忙完一次格外漫长的开膛洗鱼，正在打水。他已经学会怎样晃动水桶，才能顺利舀满。
        - id: ch01-b52
          speaker: dan
          text: 我想见到的陆地只有东角，可不想真撞上去。爸，看样子咱们在浅滩待不了两个星期。到时候你想见多少同伴都行，哈维。那才叫真正开工。谁也别等着按顿吃饭，饿了就往嘴里塞几口，困得实在睁不开眼再睡。幸好你没晚一个月才叫咱们捞起来，不然到了老处女浅滩，咱们根本来不及把你练出个样子。
        - id: ch01-b53
          speaker: narrator
          text: 哈维从海图上看出，老处女浅滩和周围一窝怪名字的浅滩，是这次航程的转折点。运气好的话，他们会在那里把剩下的盐全部浸湿用完。可老处女浅滩在图上只是一点，他不知道迪斯科靠“猪轭”和测深锤怎么找。后来他才懂，迪斯科不但找得到，还能帮助别人。舱房里一直挂着一块四英尺乘五英尺的黑板。直到连续几个浓雾遮眼的日子后，他们听见脚踏雾号难听的叫声，哈维才知道黑板有什么用。那机器听起来像一头害肺病的大象。
        - id: ch01-b54
          speaker: narrator
          text: 《我们在这儿号》正在短距离移泊，为了省事，船锚就拖在船底下。浓雾里，一艘三桅帆船湿淋淋的红色船首帆先滑了出来。《我们在这儿号》连敲三下钟，用海上的简语打招呼。大船上传来一阵尖叫和呼喊，随后把顶帆转到反面，慢慢停住。
        - id: ch01-b55
          speaker: long_jack
          text: 横帆船在吼着问自己的纬度呢。
        - id: ch01-b56
          speaker: salters
          text: 法国佬。从圣马洛来的密克隆船。迪斯科，我的烟草也快没啦。
        - id: ch01-b57
          speaker: tom_platt
          text: 我的也一样。嗨！退后呜，退后呜！站开呜，你这屁股截平的好得很！从哪儿来？圣马洛，是吧？
        - id: ch01-b58
          speakers: [french_sailor_1, french_sailor_2, french_sailor_3]
          ensemble: chorus
          text: 啊哈，好得很！是的，是的！克洛普莱，圣马洛！圣皮埃尔和密克隆！黑板！黑板！
        - id: ch01-b59
          speaker: disko
          text: 丹尼，把黑板拿来。这些法国佬怎么开得到地方，我真想不通，只能怪美洲实在太宽。四十六度四十九分，够他们用了。我看也差不多正是这个数。
        - id: ch01-b60
          speaker: narrator
          text: 丹用粉笔把数字写上黑板，再把它挂到主桅索具间。法国船上立刻响起一片接一片的“谢谢”。
        - id: ch01-b61
          speaker: salters
          text: 就让他们这么晃走，好像不大够邻居意思。
        - id: ch01-b62
          speaker: narrator
          text: 他说着，摸遍了自己的衣袋。
        - id: ch01-b63
          speaker: disko
          text: 你从上次出海以后学会法语了？上回在勒阿弗尔浅滩，你把密克隆船叫作“该死的猪”，人家拿石压舱物砸咱们。我可不想再挨一次。
        - id: ch01-b64
          speaker: salters
          text: 哈蒙·拉什说那样才能叫他们打起精神。对我来说，明明白白的美国话就够用了。咱们全都缺烟草。年轻人，你不是会法语吗？
        - id: ch01-b65
          speaker: harvey
          text: 当然会。嗨！喂！停下！等等！我们正在过来，为了烟草！
        - id: ch01-b66
          speakers: [french_sailor_1, french_sailor_2, french_sailor_3]
          ensemble: chorus
          text: 啊，烟草，烟草！
          emotion: happy
        - id: ch01-b67
          speaker: tom_platt
          text: 这下他们懂了。先放条小艇吧。我没有什么法语证书，可还懂一套管用的话。来，哈维，你给我当翻译。
        - id: ch01-b68
          speaker: narrator
          text: 两人被拉上三桅船黑黝黝的舷侧，四周的喧嚷和混乱简直说不清。舱房里贴满颜色刺眼的圣母像，法国水手称她为纽芬兰圣母。哈维的法语显然不是浅滩上通行的任何一种，他很快只剩下点头和咧嘴笑。汤姆却挥着双臂，沟通得十分顺利。船长给他喝了一口难以下咽的杜松子酒。那些水手喉头长满粗毛，戴着红帽，佩着长刀，活像喜歌剧里的人，却把汤姆当作自家兄弟欢迎。
        - id: ch01-b69
          speaker: narrator
          text: 交易开始了。法国船上有的是烟草，还是从未向法国交过税的美国货。他们想换巧克力和饼干。哈维划回去找掌管船上储备的厨子和迪斯科商量，再回来时，可可罐和饼干袋便在法国船的舵轮旁一件一件数清，场面活像海盗分赃。汤姆离船时，身上缠满黑色辫状烟草，怀里也塞满一饼饼嚼烟和旱烟。那群快活的水手随后摆进浓雾，哈维最后听见的是他们的合唱。
        - id: ch01-b70
          speakers: [french_sailor_1, french_sailor_2, french_sailor_3]
          ensemble: chorus
          text: 在我姑妈家的后方，有一片美丽的树林。夜莺在那里歌唱，从白昼一直唱到夜深。美丽的姑娘，你愿拿什么，送给把夜莺带来的人？我愿送出魁北克，索雷尔，还有圣德尼。
          emotion: happy
        - id: ch01-b71
          speaker: harvey
          text: 为什么我的法语不管用，你打的手势倒管用？
        - id: ch01-b72
          speaker: narrator
          text: 烟草已经分给《我们在这儿号》上的众人。汤姆听完哈维的话，纵声大笑。
        - id: ch01-b73
          speaker: tom_platt
          text: 手势？不错，也算手势，可比你的法语古老得多。那些法国船上挤满了共济会会员，就是这么回事。
        - id: ch01-b74
          speaker: harvey
          text: 那你也是共济会会员？
        - id: ch01-b75
          speaker: tom_platt
          text: 看起来不像吗？
        - id: ch01-b76
          speaker: narrator
          text: 这位在军舰上服过役的老水手一面回答，一面慢慢把新换来的烟草塞进烟斗。汤姆懂得的那套古老“手势”究竟是什么，哈维还是没有弄明白。他心里从此又添了一桩深海秘密，只好留着以后慢慢琢磨。
