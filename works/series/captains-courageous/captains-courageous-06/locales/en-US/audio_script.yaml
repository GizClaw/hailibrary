  chapters:
    - id: ch01
      title: CHAPTER VI
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: What struck Harvey most was how casually some ships wandered over the wide Atlantic. Fishing boats had to depend on their neighbors for good sense and courtesy, as Dan said. Harvey expected better from steamers.
        - id: ch01-b02
          speaker: narrator
          text: He learned otherwise when a huge, clumsy old cattle boat chased them for three miles. Her upper deck was boarded over, and she smelled like a thousand cattle pens. An excited officer shouted through a speaking trumpet while the steamer wallowed helplessly. Disko brought the We're Here under her lee and told her skipper exactly what he thought.
        - id: ch01-b03
          speaker: disko
          text: Where are you supposed to be? You don't deserve to be anywhere. You barnyard tramps take up the whole ocean without one thought for your neighbors. Your eyes are in your coffee cups instead of your heads.
        - id: ch01-b04
          speaker: narrator
          text: The skipper danced on his bridge and made a remark about Disko's own eyes.
        - id: ch01-b05
          speaker: cattle_skipper
          text: We haven't had an observation in three days. Do you expect us to run her blind?
        - id: ch01-b06
          speaker: disko
          text: Well, I can. What's wrong with your lead? Did you eat it? Can't you smell the bottom, or do those cattle stink too much?
        - id: ch01-b07
          speaker: uncle_salters
          text: What do you feed them? They say cattle lose weight terribly on a voyage. Maybe it's none of my business, but I reckon oil cake, broken small and sprinkled—
        - id: ch01-b08
          speaker: narrator
          text: The smell had awakened every bit of the farmer in Salters. A cattleman in a red jersey peered over the side.
        - id: ch01-b09
          speaker: cattleman
          text: Thunder! Which asylum let His Whiskers loose?
        - id: ch01-b10
          speaker: uncle_salters
          text: Young fellow, before we go any further, let me tell you that I've—
        - id: ch01-b11
          speaker: narrator
          text: The officer on the bridge removed his cap with enormous politeness.
        - id: ch01-b12
          speaker: cattle_officer
          text: Excuse me. I asked for our position. If the hairy farmer will kindly shut his mouth, perhaps the green barnacle with the crooked eye will condescend to tell us.
        - id: ch01-b13
          speaker: disko
          text: Now you've made a fool of me, Salters.
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: Disko could not answer that kind of talk. He snapped out the latitude and longitude without another lecture.
        - id: ch01-b15
          speaker: cattle_skipper
          text: That is surely a boatload of lunatics.
        - id: ch01-b16
          speaker: narrator
          text: He rang down to the engine room, then tossed a bundle of newspapers over the side and onto the schooner. The We're Here slid away from the cattle boat.
        - id: ch01-b17
          speaker: disko
          text: Next to you, Salters, that skipper and his crowd are the greatest fools I've ever seen. I was telling him what I thought of drifting around here like a lost child, and you had to break in with your fool farming. Can't you ever keep things separate?
        - id: ch01-b18
          speaker: narrator
          text: Harvey, Dan, and the others stood back, winking at one another and enjoying every moment. Disko and Salters argued seriously until evening. Salters maintained that a cattle boat was really a barn floating on blue water, so farming advice belonged there. Disko insisted that even if the boat was a barn, common decency and fishermen's pride required Salters to keep the two matters separate.
        - id: ch01-b19
          speaker: narrator
          text: Long Jack endured it silently for a while. An angry skipper meant an unhappy crew. After supper, he spoke across the table.
        - id: ch01-b20
          speaker: long_jack
          text: Why trouble yourself over what those men will say?
        - id: ch01-b21
          speaker: disko
          text: They'll tell that story against us for years. Oil cake sprinkled!
        - id: ch01-b22
          speaker: uncle_salters
          text: Sprinkled with salt, of course.
        - id: ch01-b23
          speaker: narrator
          text: Salters showed no regret as he read the farming reports in a week-old New York paper.
        - id: ch01-b24
          speaker: disko
          text: It wounds every feeling I've got.
        - id: ch01-b25
          speaker: long_jack
          text: I don't see it that way. What other boat in this weather could meet a steamer, give her the position, and also discuss the proper care of cattle at sea? Forget it! No other boat could do that. It was the fullest conversation that ever happened. We won twice over.
        - id: ch01-b26
          speaker: narrator
          text: Dan kicked Harvey under the table, and Harvey choked into his cup.
        - id: ch01-b27
          speaker: uncle_salters
          text: I did say it might be none of my business before I spoke.
        - id: ch01-b28
          speaker: tom_platt
          text: And right there, Disko, you should have stopped him if you judged the conversation was going where it ought not go.
        - id: ch01-b29
          speaker: disko
          text: I reckon that may be so.
        - id: ch01-b30
          speaker: narrator
          text: Disko saw an honorable way out of his injured dignity.
        - id: ch01-b31
          speaker: uncle_salters
          text: Of course it was so. You're skipper here. I'd have stopped cheerfully at a hint, not because I was persuaded, but to set an example for these two blamed boys of ours.
        - id: ch01-b32
          speaker: dan
          text: Didn't I tell you it would come around to us before they finished? It's always those blamed boys. But I wouldn't have missed this show for half a share in a halibut boat.
        - id: ch01-b33
          speaker: disko
          text: All the same, things should have been kept separate.
        - id: ch01-b34
          speaker: narrator
          text: A new argument lit Salters's eyes as he crumbled tobacco into his pipe. Long Jack hurried to quiet the storm.
        - id: ch01-b35
          speaker: long_jack
          text: There is great virtue in keeping things separate. Steyning and Hare learned that when Captain Newton got rheumatism and they sent Counahan to command the Marilla D. Kuhn. We called him Counahan the Navigator.
        - id: ch01-b36
          speaker: tom_platt
          text: Nick Counahan never went aboard for a night unless there was a barrel of rum in the cargo. He used to wander around the Boston commission houses, waiting for the Lord to make him captain of a towboat on his merits. Sam Coy on Atlantic Avenue fed and housed him free for more than a year, just for his stories. Counahan the Navigator! He's been dead fifteen years, hasn't he?
        - id: ch01-b37
          speaker: long_jack
          text: Seventeen, I think. He died the year they built the Caspar McVeagh. But he could never keep things separate. Steyning took him for the same reason a thief takes a hot stove. There was nothing else available that season.
        - id: ch01-b38
          speaker: long_jack
          text: All the men were away on the Banks, so Counahan gathered the toughest crew he could find. They carried enough rum to float the Marilla, insurance and all. They left Boston Harbor for the Grand Bank with a roaring northwest wind behind them. Every man aboard was drunk clear to the bung.
        - id: ch01-b39
          speaker: long_jack
          text: Heaven watched over them. No one stood watch or laid a hand on a rope until they had emptied a fifteen-gallon cask. Counahan remembered that as one week. If only I could tell this as he did! The wind blew hard the whole time. It was summer, and the Marilla carried a foretopmast. Once she found her stride, she held it.
        - id: ch01-b40
          speaker: long_jack
          text: Counahan took the compass and trembled over it for a while. Between the compass, the chart, and the singing in his head, he decided they were south of Sable Island and making wonderful time. They had not spoken to another ship. Then they opened another keg and stopped wondering about anything for another spell.
        - id: ch01-b41
          speaker: long_jack
          text: The Marilla had leaned over as soon as she passed Boston Light, and her lee rail had never risen since. She rushed on at the same angle day after day. They saw no weeds, no gulls, and no schooners. When they realized they had been out for fourteen days, they began to suspect the Bank had closed for business. So they sounded and found sixty fathoms.
        - id: ch01-b42
          speaker: long_jack
          text: Counahan said, “That's me every time! I've run her straight onto the Bank. When we reach thirty fathoms, we'll turn in like good little men. Counahan is the boy. Counahan the Navigator!”
        - id: ch01-b43
          speaker: long_jack
          text: The next cast gave them ninety fathoms. Counahan said, “Either the lead line has started stretching, or the Bank has sunk.”
        - id: ch01-b44
          speaker: long_jack
          text: In their condition, that sounded both right and reasonable. They hauled up the line and sat together on deck, counting its knots until they tangled it horribly. All the while, the Marilla held her stride and kept racing on. Before long a steamer appeared, and Counahan hailed her as casually as you please.
        - id: ch01-b45
          speaker: long_jack
          text: “Have you seen any fishing boats?” he asked. The steamer answered, “There are plenty off the Irish coast.” Counahan told him to go shake himself and asked what the Irish coast had to do with him. The man called back, “Then what are you doing here?”
        - id: ch01-b46
          speaker: long_jack
          text: Counahan cried, “Suffering Christianity! Where am I?” He always said that when his pumps sucked and he felt poorly. The steamer told him he was thirty-five miles west-southwest of Cape Clear, if that comforted him.
        - id: ch01-b47
          speaker: long_jack
          text: Counahan jumped four feet seven inches. The cook measured it. Then he put on a face as bold as brass. “Comfort? Do you take me for a fool? Thirty-five miles from Cape Clear in fourteen days from Boston Light! Suffering Christianity, that's a record. And as it happens, my mother lives in Skibbereen!” Think of his nerve. But Counahan never could keep things separate.
        - id: ch01-b48
          speaker: long_jack
          text: Most of the crew came from Cork and Kerry. Only one was a Marylander, and he wanted to turn back. The others called him a mutineer. They sailed the old Marilla into Skibbereen and spent a fine week visiting friends back on Irish soil.
        - id: ch01-b49
          speaker: long_jack
          text: Then they headed back across the Atlantic. It took them thirty-two days to beat their way to the Banks. By then fall was coming on and their food was running low, so Counahan simply turned the Marilla toward Boston and brought her home.
        - id: ch01-b50
          speaker: harvey
          text: What did the owners say?
        - id: ch01-b51
          speaker: long_jack
          text: What could they say? The fish were on the Banks, and Counahan stood at T-wharf bragging about his record voyage east. The owners had to be satisfied with that. It all happened because he failed to keep the crew and the rum separate, then mixed up Skibbereen and Quereau. Counahan the Navigator, rest his soul! He became a citizen wherever he happened to land.
        - id: ch01-b52
          speaker: manuel
          text: Once I sailed in the Lucy Holmes. Gloucester would not buy our fish or give us any price. So we crossed the ocean, hoping to sell to someone in the Azores. Then the wind blew fresh and we could not see. It blew fresher still. We went below and drove along very fast, with no one knowing where we were.
        - id: ch01-b53
          speaker: manuel
          text: After a while we saw land, and the weather grew hot. Two or three Black men came out in a small boat. We asked where we were. Now, what do you think they told us?
        - id: ch01-b54
          speaker: disko
          text: Grand Canary.
        - id: ch01-b55
          speaker: narrator
          text: Manuel smiled and shook his head.
        - id: ch01-b56
          speaker: tom_platt
          text: Cape Blanco.
        - id: ch01-b57
          speaker: manuel
          text: No. Worse than that. We were south of the Bissagos Islands, and the boat came from Liberia. So we sold our fish there. Not bad, eh?
        - id: ch01-b58
          speaker: harvey
          text: Can a schooner like this cross all the way to Africa?
        - id: ch01-b59
          speaker: disko
          text: She can sail around Cape Horn if there's a reason to go and her food holds out. My father had a little fifty-ton pinky called the Rupert. The year half our fleet went to Greenland after cod, he sailed her right up among Greenland's icy mountains.
        - id: ch01-b60
          speaker: disko
          text: He took my mother too, I suppose to show her how he earned his money. The Rupert got iced in, and I was born at Disko. I don't remember anything about it, naturally. They came home when the ice loosened in spring, but they named me after the place. A rather mean trick to play on a baby, but we're all bound to make mistakes in our lives.
        - id: ch01-b61
          speaker: uncle_salters
          text: Sure, sure. We're all bound to make mistakes. And I tell you two boys, after you've made one—and you make a hundred every day—the next best thing is to own up to it like men.
        - id: ch01-b62
          speaker: narrator
          text: Long Jack gave one enormous wink that took in everyone except Disko and Salters. That ended the matter.
        - id: ch01-b63
          speaker: narrator
          text: The We're Here worked from berth to berth toward the north. The dories went out nearly every day as they followed the eastern edge of the Grand Bank in thirty to forty fathoms of water and fished steadily.
        - id: ch01-b64
          speaker: narrator
          text: There Harvey met the squid for the first time. Squid make some of the best cod bait, though no one can depend on their moods. One black night, Salters's call woke everyone from their bunks.
        - id: ch01-b65
          speaker: uncle_salters
          text: Squid! Squid!
        - id: ch01-b66
          speaker: narrator
          text: For an hour and a half, every person aboard leaned over a squid jig. It was a red-painted piece of lead. Around its lower end stood a ring of backward-bent pins, like the ribs of a half-open umbrella. For some unknown reason, a squid liked the jig and wrapped itself around it. Then the fisherman hauled it up before it could escape the pins.
        - id: ch01-b67
          speaker: narrator
          text: As each squid left its home in the sea, it shot water first and ink next into its captor's face. The men swung their heads from side to side, trying to dodge every shot. When the rush ended, they were black as chimney sweeps, but a heap of fresh squid covered the deck. Large cod liked a bright piece of squid tentacle fixed to the tip of a hook already baited with clam.
        - id: ch01-b68
          speaker: narrator
          text: They caught many fish the next day and met the Carrie Pitman. The We're Here shouted over the news of its luck. The Carrie wanted to trade seven cod for one good-sized squid, but Disko would not accept that price. The Carrie dropped sullenly to leeward and anchored half a mile away, hoping a school of squid would come her way too.
        - id: ch01-b69
          speaker: narrator
          text: Disko said nothing until after supper. Then he sent Dan and Manuel out in a dory to buoy the We're Here's cable and announced that he meant to turn in beside his broad-axe. Dan naturally and cheerfully repeated every word to a dory from the Carrie. Its sailor wanted to know why they were buoying cable when the bottom beneath them was not rocky.
        - id: ch01-b70
          speaker: dan
          text: Dad says he wouldn't trust a ferryboat within five miles of you.
        - id: ch01-b71
          speaker: carrie_sailor
          text: Then why doesn't he leave? Who's stopping him?
        - id: ch01-b72
          speaker: dan
          text: Because you practically anchored under his lee, and he won't be driven off by any boat, much less a drifting fish tub like yours.
        - id: ch01-b73
          speaker: carrie_sailor
          text: She isn't drifting on this trip.
          emotion: angry
        - id: ch01-b74
          speaker: narrator
          text: The Carrie Pitman had a bad name for breaking loose from her ground tackle.
        - id: ch01-b75
          speaker: dan
          text: Then how do you move from berth to berth? Drifting is the best sailing she does. And if she's given it up, why do you need that new jib boom?
        - id: ch01-b76
          speaker: narrator
          text: That hit its mark.
        - id: ch01-b77
          speaker: carrie_sailor
          text: Hey, you Portuguese organ grinder, take your monkey back to Gloucester. And you, Dan Troop, go back to school.
        - id: ch01-b78
          speaker: dan
          text: Overalls! Overalls!
        - id: ch01-b79
          speaker: narrator
          text: Dan knew that one of the Carrie's men had worked in an overall factory the winter before.
        - id: ch01-b80
          speaker: carrie_sailor
          text: Shrimp! Gloucester shrimp! Get out of here, you Nova Scotian!
        - id: ch01-b81
          speaker: narrator
          text: A Gloucester man did not take kindly to being called a Nova Scotian. Dan answered in the same spirit.
        - id: ch01-b82
          speaker: dan
          text: Nova Scotian yourself, you Scrabbletown men! You Chatham wreckers! Get out of here with your brick in your stocking!
        - id: ch01-b83
          speaker: narrator
          text: The two sides parted, and Chatham had taken the worse of the exchange.
        - id: ch01-b84
          speaker: disko
          text: I knew this would happen. She's already pulled the wind around. Someone ought to serve a court order on that boat. She'll snore at anchor until midnight, then break loose just when we're getting to sleep. Luckily, there aren't many boats around us. But I won't raise anchor for Chatham. She may hold.
        - id: ch01-b85
          speaker: narrator
          text: The wind had shifted around. At sundown it rose and began to blow steadily. There was not enough sea to disturb even the tackle in a dory, but the Carrie Pitman obeyed laws of her own. At the end of the boys' watch, they heard three sharp cracks from a huge, muzzle-loading revolver aboard her.
        - id: ch01-b86
          speaker: dan
          text: Glory, glory, hallelujah! Here she comes, Dad, stern first and walking in her sleep, just as she did on Quereau.
        - id: ch01-b87
          speaker: narrator
          text: Disko might have taken his chances with any other boat, but he knew the Carrie's ways. This time he cut the cable. Though the Carrie had the whole North Atlantic to drift across, she lurched straight toward the We're Here.
        - id: ch01-b88
          speaker: narrator
          text: Under jib and riding sail, the We're Here gave her only the room she absolutely needed. Disko did not want to spend a week hunting for his cable. His schooner darted into the wind as the Carrie passed within easy calling distance, silent and angry, while every voice aboard the We're Here opened fire with fishermen's insults.
        - id: ch01-b89
          speaker: disko
          text: Good evening! And how does your garden grow?
        - id: ch01-b90
          speaker: uncle_salters
          text: Go to Ohio and hire a mule. We don't want farmers here.
        - id: ch01-b91
          speaker: long_jack
          text: Shall I lend you my dory anchor?
        - id: ch01-b92
          speaker: tom_platt
          text: Take out your rudder and stick it in the mud!
        - id: ch01-b93
          speaker: narrator
          text: Dan stood on the wheel box, and his voice climbed high and shrill.
        - id: ch01-b94
          speaker: dan
          text: Say! Is the overall factory on strike, or have they hired girls, you Shackamaxon men?
        - id: ch01-b95
          speaker: harvey
          text: Let out your tiller lines and nail them to the bottom!
        - id: ch01-b96
          speaker: narrator
          text: Tom Platt had taught Harvey that salty joke. Manuel leaned over the stern, raised his broad thumb in complete contempt, and yelled after them.
        - id: ch01-b97
          speaker: manuel
          text: Johanna Morgan plays the organ! Ahaaaa!
        - id: ch01-b98
          speaker: narrator
          text: Even little Penn covered himself with glory.
        - id: ch01-b99
          speaker: penn
          text: Gee a little! Hssh! Come here. Haw!
        - id: ch01-b100
          speaker: narrator
          text: For the rest of the night, the We're Here rode on her chain with a short, sharp, uneasy motion. Harvey felt every jerk of it. They had cut loose only to avoid the drifting Carrie, and now they spent half the next morning searching for and recovering their cable.
        - id: ch01-b101
          speaker: narrator
          text: The boys agreed that victory and glory had been cheap at the price. Their only sorrow was for all the beautiful insults they might have thrown at the defeated Carrie and had failed to think of in time.
