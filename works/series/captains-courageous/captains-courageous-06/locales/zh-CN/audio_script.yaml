  chapters:
    - id: ch01
      title: 第六章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 哈维最想不通的，是有些船竟敢漫不经心地在辽阔的大西洋上乱晃。照丹的说法，渔船吃的是大海这碗饭，自然要仰仗邻船的好意和明智，彼此照应。可那些装着机器的轮船，总该更靠得住，也更知道自己在哪里才对。偏偏有一艘笨重的老运牛船，追着《我们在这儿号》跑了整整三英里。它的上层甲板全用木板封死，气味像一千座牛栏堆在一起。一名大副举着传声筒拼命喊，巨轮却软绵绵地瘫在水上，无可奈何地左右摇晃。迪斯科把双桅船驶到它下风处，抬头就骂。
        - id: ch01-b02
          speaker: disko
          text: 你们到底在哪儿？照我看，你们哪儿都不配待！一群牛棚里的流浪汉，在公海上横冲直撞，半点不替邻船着想。眼珠子不放在脑袋里，倒掉进咖啡杯了。
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: 运牛船船长在驾驶台上气得直跳，也拿迪斯科的眼睛说事。
        - id: ch01-b04
          speaker: cattle_ship_captain
          text: 我们三天没测到位置了。难道要闭着眼开船吗？
        - id: ch01-b05
          speaker: disko
          text: 我闭着眼也能开。你的测深锤呢，吃掉了？你是闻不出海底，还是那些牛臭得太厉害？
        - id: ch01-b06
          speaker: salters
          text: 你们拿什么喂牛？我听说牛一出海就掉膘。也许不关我的事，不过要是把油渣饼敲碎，再撒上……
        - id: ch01-b07
          speaker: cattleman
          text: 老天爷！哪家疯人院把这位大胡子放出来了？
          emotion: surprised
        - id: ch01-b08
          speaker: salters
          text: 年轻人，趁话还没说远，我得先告诉你——
        - id: ch01-b09
          speaker: narrator
          text: 大副极有礼貌地摘下帽子，那份客气比骂人还厉害。
        - id: ch01-b10
          speaker: cattle_ship_officer
          text: 对不起，我问的是本船位置。请那位长毛庄稼人闭上脑袋，再请那只斜眼的海绿藤壶屈尊指点我们。
        - id: ch01-b11
          speaker: narrator
          text: 迪斯科最招架不住这种腔调。他气恼索尔特斯害自己当众出丑，只好干脆报出经纬度，一句训话也没再加。运牛船船长听完，认定下边准是一船疯子。他摇铃通知机舱，又把一捆报纸扔到双桅船上。巨轮重新开动，《我们在这儿号》也从它散发着牛栏味的下风处滑开。迪斯科那股没来得及向大船撒完的火，自然全落到了索尔特斯头上。
        - id: ch01-b12
          speaker: disko
          text: 天底下的蠢货，除了你，就数他们最有盼头。我正教训他别像迷路的孩子那样乱晃，你偏拿农经插嘴。你就不能把两码事分开？
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: 哈维、丹和其余人躲到一旁，彼此挤眉弄眼，心里乐开了花。迪斯科和索尔特斯却认真争到傍晚。索尔特斯说，运牛船本来就是漂在蓝海上的牛棚，牛的饲料当然也算海上的事。迪斯科坚持说，哪怕那真是一座牛棚，做人起码的体面和渔夫的自尊，也要求他把两码事分开。船长一生气，全船都不好过。长杰克默默忍到晚饭后，终于隔着桌子出来和稀泥。
        - id: ch01-b14
          speaker: long_jack
          text: 管他们以后怎么说干什么？
        - id: ch01-b15
          speaker: disko
          text: 他们会拿这事笑咱们好几年。还撒油渣饼！
        - id: ch01-b16
          speaker: salters
          text: 那当然得加盐。
        - id: ch01-b17
          speaker: narrator
          text: 索尔特斯毫无悔意，继续看那张一星期前的农事报道。迪斯科还是觉得脸上挂不住。
        - id: ch01-b18
          speaker: long_jack
          text: 你换个角度想。今天这样的天气，哪条船碰见远洋货轮以后，既能报给它位置，又能讲一番海上养牛的门道？一场谈话办了两件事，两回都是咱们赢。这样的好事，他们当然忘不了。
        - id: ch01-b19
          speaker: narrator
          text: 丹在桌下踢了哈维一脚，哈维一头扎进杯子里，险些呛住。索尔特斯听了这番圆场，觉得自己的名誉总算补回来一点。他提醒大家，自己开口以前明明说过，也许这事根本不归他管。汤姆·普拉特在军舰上学过纪律和礼数，于是认真裁断，要是船长判断谈话可能变得不合适，就该当场叫索尔特斯住口。迪斯科听出这里有条体面的退路，想了想，也承认汤姆说得有理。
        - id: ch01-b20
          speaker: salters
          text: 你是船长，只要暗示一声，我准会住口。倒不是因为谁教训了我，也不是我服了，只是要给咱们这两个该死的小子做榜样。
        - id: ch01-b21
          speaker: dan
          text: 我早说了吧，哈维？最后准会绕到咱们头上。永远都是“两个该死的小子”。不过这场好戏，拿半份大比目鱼船的分成都不换。
        - id: ch01-b22
          speaker: narrator
          text: 迪斯科退是退了，嘴上仍咬定两码事应该分开。索尔特斯把板烟捏碎，慢慢装进烟斗，眼里又亮起新一轮争辩的光。长杰克一看风暴又要起来，赶紧说，把事情分开确实大有好处。斯泰宁—黑尔公司的斯泰宁就吃过这份亏。牛顿船长害了炎症性风湿病，不能出海，公司便派康纳汉去掌管《玛丽拉·D·库恩号》。大伙儿都叫那个人“领航员康纳汉”。
        - id: ch01-b23
          speaker: tom_platt
          text: 尼克·康纳汉每次出海过夜，货单里总少不了一桶朗姆酒。他天天在波士顿的代销行里混，等老天凭他的本事赏他一条拖船。大西洋大道的萨姆·科伊爱听他的故事，白管了他一年多的饭。领航员康纳汉啊！他死了十五年了吧？
        - id: ch01-b24
          speaker: long_jack
          text: 我看有十七年。他死在《卡斯帕·麦克维号》造好的那年。他就是学不会把事情分开。斯泰宁雇他，就像小偷抱走滚烫的火炉，因为那一季水手全去了浅滩，实在没有别的可拿。康纳汉胡乱凑了一帮天长地久的硬汉。朗姆酒啊！他们装上船的酒，连船的保险都算进去，也足够把《玛丽拉号》漂起来。
        - id: ch01-b25
          speaker: long_jack
          text: 他们驶出波士顿港，后面追着怒吼的西北风，人人都灌满了酒。老天居然还照看他们。整整一星期，谁也不值班，谁也不碰一根绳子，只管喝干一桶十五加仑的烈酒。至少照康纳汉后来记得，是一个星期。那段日子风一直刮得威风八面。《玛丽拉号》赶上夏季，装着前顶桅，找准自己的步子以后便一路飞奔。康纳汉拿起“猪轭”，对着它哆嗦半天，再看看海图，听听脑袋里的歌声，终于断定他们正在塞布尔岛南边，航行得漂亮极了，只是没遇见别的船。随后他们又开一桶酒，好一阵子再没人猜船到哪里了。
        - id: ch01-b26
          speaker: long_jack
          text: 《玛丽拉号》从波士顿灯塔起便向下风倾倒，此后下风舷缘一直没抬起来。可海上没有海草，没有海鸥，也没有双桅船。十四天过去，他们怀疑大浅滩是不是关门了。一测水深，六十英寻。
        - id: ch01-b27
          speaker: counahan
          text: 这就是我！每回都是我！我已经把船径直开上浅滩。等水深三十英寻，咱们就乖乖睡觉。康纳汉才是好汉，领航员康纳汉！
        - id: ch01-b28
          speaker: narrator
          text: 下一锤却测到九十英寻。
        - id: ch01-b29
          speaker: counahan
          text: 不是测深索变长了，就是浅滩沉下去了。
        - id: ch01-b30
          speaker: long_jack
          text: 那群人醉到觉得这话十分合理。他们把索拉上甲板，坐下来数绳结，最后缠成一团。《玛丽拉号》仍旧照自己的步子飞跑。没多久，一艘远洋货轮来了，康纳汉装作满不在乎，向它喊话。
        - id: ch01-b31
          speaker: counahan
          text: 你们最近见过渔船没有？
        - id: ch01-b32
          speaker: tramp_sailor
          text: 爱尔兰海岸外边多得扎堆。
        - id: ch01-b33
          speaker: counahan
          text: 滚一边去！爱尔兰海岸关我什么事？
        - id: ch01-b34
          speaker: tramp_sailor
          text: 那你跑到这里来干什么？
        - id: ch01-b35
          speaker: counahan
          text: 受难的基督教哇！我到底在哪儿？
          emotion: surprised
        - id: ch01-b36
          speaker: tramp_sailor
          text: 克利尔角西偏南三十五英里。要是这能安慰你的话。
        - id: ch01-b37
          speaker: narrator
          text: 康纳汉原地一蹿，足有四英尺七英寸高，这是厨子量的。可他马上又摆出理直气壮的模样。
        - id: ch01-b38
          speaker: counahan
          text: 安慰？你当我是傻方言吗？从波士顿灯塔出来十四天，就到了克利尔角外三十五英里。受难的基督教哇，这是纪录！说来也巧，我母亲就在斯基伯林！
        - id: ch01-b39
          speaker: long_jack
          text: 你们听听这份脸皮！他就是这么分不开两码事。船员多半来自科克和凯里，只有一个马里兰人不肯去。大家索性骂那人是叛徒，把老《玛丽拉号》直接开进斯基伯林。他们在故土挨家拜访朋友，痛痛快快玩了一个星期。等船掉头往回走，又花了整整三十二天才顶风赶回浅滩。那时已经快入秋，船上的粮食也不多了。康纳汉没捕到鱼，只好让《玛丽拉号》空着鱼舱返回波士顿。
        - id: ch01-b40
          speaker: harvey
          text: 那家公司怎么说？
        - id: ch01-b41
          speaker: long_jack
          text: 他们还能说什么？该捕的鱼全留在浅滩上，康纳汉却已经坐在波士顿T码头，逢人便吹嘘自己那趟创纪录的东航。公司也只好拿这件事出气。头一桩错，是起航时没把船员和朗姆酒分开。第二桩，是航行时又把斯基伯林和克罗浅滩混在一起。愿领航员康纳汉的灵魂安息！他真是个随兴而来的公民。
        - id: ch01-b42
          speaker: manuel
          text: 我有一回待在《露西·霍姆斯号》上，格洛斯特没人肯出价买她的鱼。于是我们横过大海，想卖给法亚尔岛的人。后来风大了，四周看不清。风又刮得更大，我们全躲到甲板下面，让船自己跑得飞快，谁也不知道跑去了哪里。过些时候，我们终于看见陆地，天气也一点点热起来。两三个黑人坐着一条小帆船靠近。我们问这是哪里。现在，你们猜他们怎么说？
        - id: ch01-b43
          speaker: disko
          text: 大加那利岛。
        - id: ch01-b44
          speaker: narrator
          text: 曼努埃尔笑着摇头。
        - id: ch01-b45
          speaker: tom_platt
          text: 布兰科角。
        - id: ch01-b46
          speaker: manuel
          text: 不，比那里还糟。我们到了比热戈斯群岛南边，那条小帆船来自利比里亚！所以鱼就在那儿卖了。也不坏吧？
        - id: ch01-b47
          speaker: harvey
          text: 这样的双桅船真能一直开到非洲？
        - id: ch01-b48
          speaker: disko
          text: 只要那边有值得拿的东西，粮食又撑得住，这样的船绕过合恩角也行。我父亲有过一条五十吨左右的尖尾小帆船，叫《鲁珀特号》。有一年，我们一半的船队都跑去格陵兰冰山脚下追鳕鱼，他也把船开过去了。更厉害的是，他还带上我母亲，大概想让她亲眼看看钱是怎么挣来的。后来整条船被冰封住，我就在迪斯科岛出生。当然，那些事我全不记得。开春以后冰松了，我们才回家。他们偏拿那个地方给我起名，对一个婴儿多少有点刻薄。不过谁活着不犯错呢。
        - id: ch01-b49
          speaker: salters
          text: 不错，不错，谁活着都免不了犯错。我告诉你们两个小子，你们一天少说也得犯一百个。犯完以后，既然已经不能不犯，第二好的办法就是挺直腰杆，像男子汉一样认下来。
        - id: ch01-b50
          speaker: narrator
          text: 长杰克猛挤了一下眼睛，那只眼仿佛把全船人一起圈了进去，只有迪斯科和索尔特斯被留在外面。这场风波总算结束。此后《我们在这儿号》一个泊位接一个泊位地向北移，沿着大浅滩东缘前进。那里水深三十到四十英寻，小艇几乎每天都放出去，众人一天接一天稳稳捕鱼。
        - id: ch01-b51
          speaker: narrator
          text: 哈维也在这里头一次见到鱿鱼。它是钓鳕鱼的上好鱼饵，脾气却说不准，肯不肯出现全凭自己的高兴。一个漆黑的夜里，索尔特斯突然高喊“鱿鱼来啦”，把所有人从铺位叫醒。接下来一个半钟头，船上每个人都俯在舷边，守着一只鱿鱼钩。那是一块涂红的铅，下面围着一圈向后弯的针，像半张开的伞骨。谁也不知道为什么，鱿鱼偏偏喜欢这件怪东西，总要用柔软的身子把它缠住。人们趁它还没从针上挣脱，立刻提出水面。
        - id: ch01-b52
          speaker: narrator
          text: 鱿鱼一离开海里的老家，先朝捕它的人脸上喷水，紧接着又喷墨。众人只好把脑袋左摇右摆，躲避一记又一记暗器。忙乱结束时，个个都黑得像扫烟囱的。不过甲板上也堆起一大堆鲜鱿鱼。大鳕鱼很爱蛤蜊饵钩尖那一小片亮闪闪的鱿鱼触手。第二天，他们果然捕到许多鱼。碰见《凯丽·皮特曼号》时，便朝它喊出这份好运。那船听了很眼馋，提出拿七条鳕鱼换一条大小过得去的鱿鱼。迪斯科嫌价钱太低，不肯答应。《凯丽号》只好闷闷不乐地落到下风，在半英里外抛锚，盼着自己也能撞上一群鱿鱼。
        - id: ch01-b53
          speaker: narrator
          text: 迪斯科整整一个下午什么也没说。直到晚饭后，他才派丹和曼努埃尔出去，给《我们在这儿号》的锚索系上浮标。他还郑重宣布，今晚要抱着阔斧睡觉，必要时一斧砍断锚索。丹当然把父亲的话一字不漏地转给《凯丽号》派来的小艇。那边听不明白，问他们脚下又不是容易卡锚的礁石底，为什么还要系浮标。
        - id: ch01-b54
          speaker: dan
          text: 爸说，离你们五英里以内，就连渡船都信不过。
        - id: ch01-b55
          speaker: carrie_sailor
          text: 那他怎么不滚？谁拦着他了？
          emotion: angry
        - id: ch01-b56
          speaker: dan
          text: 因为你们抛在他下风船头，挡了他的路。他不受任何船这份气，更别说你们这种到处走锚的臭鱼肚子。
        - id: ch01-b57
          speaker: carrie_sailor
          text: 她这趟根本没走锚。
          emotion: angry
        - id: ch01-b58
          speaker: narrator
          text: 《凯丽·皮特曼号》的锚具不牢，名声早传遍了。丹听见这句话，立刻抓住机会。
        - id: ch01-b59
          speaker: dan
          text: 不走锚，你们靠什么换泊位？那可是她最拿手的航法。既然不走锚，怎么又换了根新艏斜桅？
        - id: ch01-b60
          speaker: narrator
          text: 这一箭正中靶心。
        - id: ch01-b61
          speaker: carrie_sailor
          text: 葡萄牙卖艺的，把你的猴子带回格洛斯特去！丹·特鲁普，你也滚回学校！
          emotion: angry
        - id: ch01-b62
          speaker: dan
          text: 你们还是回工装裤厂吧！工——装——裤！
        - id: ch01-b63
          speaker: narrator
          text: 丹知道对方有个船员去年冬天在工装裤厂做过工。
        - id: ch01-b64
          speaker: carrie_sailor
          text: 小虾米！格洛斯特的小虾米！滚吧，你这新斯科舍佬！
          emotion: angry
        - id: ch01-b65
          speaker: narrator
          text: 格洛斯特人最听不得别人叫他新斯科舍佬。丹马上照样还击。
        - id: ch01-b66
          speaker: dan
          text: 你才是新斯科舍佬！斯克拉布尔敦人，查塔姆的撞船贼，袜子里藏砖头的家伙，滚吧！
          emotion: angry
        - id: ch01-b67
          speaker: narrator
          text: 双方就此分开，可每一句外号都比上一句更损，查塔姆一边到底输得更惨。迪斯科却没只顾着听热闹。他看见风已经转了，断定《凯丽号》会一直在锚上打鼾到半夜，等他们刚刚睡熟，准会挣脱锚底漂过来。这一带幸好没有挤满船只。可迪斯科也不肯为了查塔姆人主动起锚，只盼那条声名狼藉的船这一次能自己抓牢。
        - id: ch01-b68
          speaker: narrator
          text: 日落时，转向的风越吹越强，而且始终没有停。海面上的浪还小得很，连小艇放下的钓具也扰不动，照理说任何船的锚都该抓得稳稳当当。可《凯丽·皮特曼号》从来只守自己的规矩。两个男孩刚值完班，黑暗中便传来“砰、砰、砰”三声巨响。那是《凯丽号》在用一把巨大的前装左轮手枪报警。
        - id: ch01-b69
          speaker: dan
          text: 荣耀，荣耀，哈利路亚！她真的来啦，爸！屁股朝前，闭着眼梦游过来，跟她在克罗浅滩那一回一模一样。
        - id: ch01-b70
          speaker: narrator
          text: 换作别的船，迪斯科也许肯赌一把，看看它会不会在最后关头避开。可北大西洋明明有那么多地方，《凯丽号》偏偏挣脱锚底，直冲他们踉跄而来。他只得挥起阔斧砍断锚索。《我们在这儿号》赶紧升起艏帆和锚泊帆，迎风躲开，却只给对方让出非让不可的一点地方。那根锚索还得找回来，迪斯科可不愿为了它搜上一个星期。《凯丽号》沉默又恼怒地从一声喊话就能听见的地方擦过，失去控制，根本不能还击，只好任凭浅滩上的嘲弄像一排炮火扫上甲板。
        - id: ch01-b71
          speaker: disko
          text: 晚上好。你们园子里的花长得怎么样？
        - id: ch01-b72
          speaker: salters
          text: 上俄亥俄州雇头骡子吧。这儿不要农夫。
        - id: ch01-b73
          speaker: long_jack
          text: 要不要我把小艇锚借给你？
        - id: ch01-b74
          speaker: tom_platt
          text: 把舵卸下来，插进泥里！
        - id: ch01-b75
          speaker: dan
          text: 喂——！工装裤厂是不是闹罢工了？还是改雇姑娘了，你们这帮沙卡马克松人？
        - id: ch01-b76
          speaker: harvey
          text: 把舵索放出去，拿钉子钉到海底！
        - id: ch01-b77
          speaker: narrator
          text: 这是汤姆事先教哈维的水手俏皮话。曼努埃尔从船尾探出身子，伸出宽大的拇指，满脸都是轻蔑。
        - id: ch01-b78
          speaker: manuel
          text: 乔安娜·摩根，你回去弹风琴吧！啊哈——！
        - id: ch01-b79
          speaker: penn
          text: 驾慢一点！嘘，过来吧。吁——停下！
        - id: ch01-b80
          speaker: narrator
          text: 小宾恩拿赶牲口的声音送客，这一嗓子也替自己赢足了光彩。《凯丽号》终于从黑暗里漂过去。《我们在这儿号》后半夜一直拴在锚链上，船身短促、急快又不安地颠动，叫哈维很不好受。第二天，他们又浪费半个上午，才顺着浮标找回被砍断的锚索。两个男孩却一致觉得，为了昨夜那场胜利和荣光，付这点麻烦实在太便宜。他们唯一的遗憾，是事后又想出许多更漂亮的话，昨夜没来得及送给狼狈落败的《凯丽号》，越想越觉得可惜。
