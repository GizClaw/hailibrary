  chapters:
    - id: ch01
      title: CHAPTER IX
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Whatever private grief he carried, Harvey Cheyne Senior still had a vast business to run. Late in June he had gone East to meet his wife. She was broken by the belief that their son had drowned in the gray sea. Doctors, nurses, massage women, and faith healers surrounded her, but none could help. She lay moaning or talked for hours about Harvey to anyone who would listen. She had no hope. She only wanted someone to promise that drowning did not hurt, and her husband kept watch so she would not try to learn for herself.
        - id: ch01-b02
          speaker: narrator
          text: Cheyne said little about his own sorrow. He hardly knew how deep it went until he found himself staring at the calendar on his desk and speaking to it.
        - id: ch01-b03
          speaker: harvey_sr
          text: What's the use of going on?
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: For years he had imagined a happy future. Once his work was settled and Harvey left college, he would bring the boy into all he owned. His son would become his companion, partner, and ally. The father's experience and the son's fire would build great things together. Now the boy seemed dead, lost like any sailor from one of Cheyne's tea ships. His wife was dying, or worse. Women, doctors, maids, and attendants pressed around him, while her restless wishes changed from hour to hour. He had no strength left for the enemies waiting in his business.
        - id: ch01-b05
          speaker: narrator
          text: He took Mrs. Cheyne to their raw new palace in San Diego. She and her attendants filled one costly wing. In a room off the veranda, Cheyne worked wearily between Milsom, his secretary, and Miss Kinzey, the typist who also handled the telegraph. Four Western railroads were fighting over rates. A ruinous strike had broken out in his Oregon lumber camps. California's lawmakers were preparing another fight against him.
        - id: ch01-b06
          speaker: narrator
          text: In ordinary times, Cheyne would have struck before any of them could move and enjoyed every ruthless minute of the battle. Now his soft black hat sagged over his nose. His great body seemed lost inside loose clothes. He stared at his boots or at the Chinese junks in the bay and answered Milsom without hearing the questions as they opened the Saturday mail.
        - id: ch01-b07
          speaker: narrator
          text: Cheyne wondered what it would cost to abandon everything. His insurance could buy an income fit for a king. Perhaps he and his wife could move between Colorado, Washington, and the islands of South Carolina. A little society might help her, and he might forget all the plans that had failed. Then the typewriter stopped clicking. Miss Kinzey was staring at Milsom, whose face had gone white.
        - id: ch01-b08
          speaker: narrator
          text: Milsom handed Cheyne a telegram relayed from San Francisco.
        - id: ch01-b09
          speaker: harvey
          text: Picked up by fishing schooner We're Here after falling off boat. Had a great time fishing on the Banks. All well. Waiting at Gloucester, Massachusetts. Disko Troop is taking care of me. Wire money or orders. What should I do, and how is Mama? Harvey N. Cheyne.
        - id: ch01-b10
          speaker: narrator
          text: The paper slipped from the father's hand. He lowered his head onto the closed rolltop desk and breathed hard. Milsom ran for Mrs. Cheyne's doctor. When they came back, Cheyne was pacing the room.
        - id: ch01-b11
          speaker: harvey_sr
          text: What do you think? Can it be real? Does the message even make sense? I can't make it out.
          emotion: surprised
        - id: ch01-b12
          speaker: doctor
          text: I can make it out. It means I lose seven thousand dollars a year. That's all.
        - id: ch01-b13
          speaker: narrator
          text: The doctor thought of the struggling New York practice he had abandoned when Cheyne demanded his services. He sighed and handed back the telegram.
        - id: ch01-b14
          speaker: harvey_sr
          text: You mean we should tell her? What if it's a fraud?
        - id: ch01-b15
          speaker: doctor
          text: What would anyone gain? A fraud would be found out at once. This is your boy.
        - id: ch01-b16
          speaker: narrator
          text: Suzanne, the highly paid French maid who knew the household could not manage without her, came in boldly.
        - id: ch01-b17
          speaker: suzanne
          text: Mrs. Cheyne says you must come at once. She thinks you are sick.
        - id: ch01-b18
          speaker: narrator
          text: The master of thirty million dollars bowed his head and meekly followed her. From the upper landing of the great white staircase came Mrs. Cheyne's thin, high voice.
        - id: ch01-b19
          speaker: mrs_cheyne
          text: What is it? What has happened?
          emotion: fearful
        - id: ch01-b20
          speaker: narrator
          text: A moment later, her husband blurted out the news. Her shriek rang through the house. No door could hold it back.
        - id: ch01-b21
          speaker: doctor
          text: That's all right. The one true medical statement in novels is that joy doesn't kill, Miss Kinzey.
        - id: ch01-b22
          speaker: miss_kinzey
          text: I know. But first we've got a heap of work to do.
        - id: ch01-b23
          speaker: narrator
          text: Miss Kinzey was from Milwaukee and spoke directly. She also had a fondness for Milsom, so she knew at once that a hard job lay ahead. He was studying the enormous roller map of America on the wall when Cheyne shouted from the staircase.
        - id: ch01-b24
          speaker: harvey_sr
          text: Milsom, we're crossing the whole country. Private car, straight through to Boston. Arrange every connection.
        - id: ch01-b25
          speaker: milsom
          text: Just what I expected.
        - id: ch01-b26
          speaker: narrator
          text: Milsom and Miss Kinzey exchanged a look. She was not sure even he could manage this. He motioned her toward the Morse key as if sending troops into action, swept a hand through his hair, looked at the ceiling, and began. Her white fingers reached out across the continent.
        - id: ch01-b27
          speaker: milsom
          text: K. H. Wade, Los Angeles. The Constance is there, isn't she, Miss Kinzey?
        - id: ch01-b28
          speaker: miss_kinzey
          text: Yep, she's there.
        - id: ch01-b29
          speaker: milsom
          text: Ready? Send the private car Constance here. Arrange a special leaving Sunday in time to meet the New York Limited at Sixteenth Street, Chicago, next Tuesday.
        - id: ch01-b30
          speaker: narrator
          text: The key clicked rapidly beneath Miss Kinzey's fingers.
        - id: ch01-b31
          speaker: miss_kinzey
          text: Can't you make it faster?
        - id: ch01-b32
          speaker: milsom
          text: Not over those grades. That gives them sixty hours to Chicago, and a special train east of there won't save anything. Ready? Have the Lake Shore and Michigan Southern take Constance on the New York Central and Hudson River from Buffalo to Albany. Then have the Boston and Albany carry her through to Boston. Mr. Cheyne must reach Boston Wednesday evening. Nothing can delay him. I've also wired Canniff, Toucey, and Barnes. Sign it Cheyne.
        - id: ch01-b33
          speaker: narrator
          text: Miss Kinzey nodded, and Milsom kept going.
        - id: ch01-b34
          speaker: milsom
          text: Now for Canniff in Chicago. Put Constance onto the New York Limited at Sixteenth Street Tuesday afternoon, carry her through to Buffalo, and hand her to the New York Central. Have you ever been to New York, Miss Kinzey? We'll go someday. Ready? Toucey gets the order to take the car from Buffalo to Albany on the Limited Tuesday afternoon.
        - id: ch01-b35
          speaker: miss_kinzey
          text: I haven't been to New York, but I know that's not how you say it!
        - id: ch01-b36
          speaker: milsom
          text: Beg pardon. Barnes at the Boston and Albany gets the same orders from Albany through to Boston. Leave at three-oh-five and arrive at nine-oh-five Wednesday evening. Don't wire those times. That covers what Wade will arrange, but it pays to stir up the managers.
        - id: ch01-b37
          speaker: miss_kinzey
          text: That's great.
          emotion: happy
        - id: ch01-b38
          speaker: narrator
          text: She looked at Milsom with admiration. This was the sort of man she understood.
        - id: ch01-b39
          speaker: milsom
          text: Not bad. Anyone else would lose thirty hours and spend a week planning the run. I hand him to the Santa Fe all the way to Chicago.
        - id: ch01-b40
          speaker: miss_kinzey
          text: But what about the New York Limited? Even Chauncey Depew couldn't get his private car hitched to that train.
        - id: ch01-b41
          speaker: milsom
          text: This isn't Chauncey. This is Cheyne. Lightning. It goes.
        - id: ch01-b42
          speaker: miss_kinzey
          text: Maybe so. We'd better wire the boy, though. You forgot him.
        - id: ch01-b43
          speaker: milsom
          text: I'll ask his father.
        - id: ch01-b44
          speaker: narrator
          text: Milsom returned with instructions for Harvey to meet them in Boston at an appointed hour. Miss Kinzey was laughing over the telegraph key, and soon he laughed too. Los Angeles was clicking out a frantic demand to know why, while warning that uneasiness was spreading.
        - id: ch01-b45
          speaker: narrator
          text: Ten minutes later, Chicago begged to be warned if the crime of the century was being planned. Everyone there was taking cover. Then Topeka, though Milsom could not imagine why Topeka was involved, promised the Colonel they would come down if only he would not shoot.
        - id: ch01-b46
          speaker: narrator
          text: When Cheyne read the messages, he gave a grim smile at the panic among his enemies.
        - id: ch01-b47
          speaker: harvey_sr
          text: They think we're on the warpath. Tell them we don't feel like fighting just now, Milsom. Tell them why we're going. You and Miss Kinzey had better come too, though I doubt I'll do business on the road. For once, tell them the truth.
        - id: ch01-b48
          speaker: narrator
          text: So they sent the truth. Miss Kinzey tapped out the feeling of it, and Milsom added the famous words, “Let us have peace.” Two thousand miles away, men controlling sixty-three million dollars in railroad interests breathed freely again. Cheyne was racing toward the only son who had been given back to him. The bear was looking for his cub, not hunting the bulls.
        - id: ch01-b49
          speaker: narrator
          text: Hard men who had drawn their knives for a financial fight put them away and wished him Godspeed. A few smaller men, frightened only moments before, lifted their heads and boasted about what they would have done if Cheyne had not buried the hatchet.
        - id: ch01-b50
          speaker: narrator
          text: The wires stayed busy all weekend. Once people knew the danger had passed, whole cities hurried to help. Los Angeles alerted San Diego and Barstow, so the Southern California engineers would be waiting in their lonely roundhouses. Barstow passed the word to the Atlantic and Pacific. Albuquerque sent it through the entire Atchison, Topeka, and Santa Fe management, all the way to Chicago.
        - id: ch01-b51
          speaker: narrator
          text: An engine, a combination car with its crew, and the great gilded Constance would be rushed across two thousand three hundred and fifty miles. One hundred and seventy-seven other trains would meet or pass the special, and every one of them had to yield the track. Every dispatcher and every crew had to know exactly what was coming. Sixteen locomotives, sixteen engineers, and sixteen firemen would be waiting, each one the best available. They allowed two and a half minutes to change engines, three minutes for water, and two for coal. Every tank and coal chute had to be ready before the train appeared.
        - id: ch01-b52
          speaker: narrator
          text: The message sang along the wires. Prepare the men, tanks, and coal chutes. Harvey Cheyne is in a hurry, a hurry, a hurry. Expect forty miles an hour, with every division superintendent aboard for his own stretch. From San Diego to Sixteenth Street in Chicago, lay down the magic carpet. Hurry. Oh, hurry.
        - id: ch01-b53
          speaker: narrator
          text: At dawn on Sunday, the special train rolled out of San Diego.
        - id: ch01-b54
          speaker: harvey_sr
          text: It will be hot. We're going as fast as we possibly can, Mama, but you don't need your bonnet and gloves yet. Please lie down and take your medicine. I'd play dominoes with you, but it's Sunday.
        - id: ch01-b55
          speaker: mrs_cheyne
          text: I'll be good. I promise I will. Only when I take off my bonnet, it feels as if we'll never arrive.
        - id: ch01-b56
          speaker: harvey_sr
          text: Try to sleep a little, Mama. We'll be in Chicago before you know it.
          emotion: calm
        - id: ch01-b57
          speaker: mrs_cheyne
          text: But Harvey is in Boston, Father. Tell them to hurry.
        - id: ch01-b58
          speaker: narrator
          text: The six-foot driving wheels hammered toward San Bernardino and the Mohave wastes. The grade would not allow speed yet. Beyond the hot hills came the hotter desert, then the Needles and the Colorado River. In the fierce dry glare, the car's woodwork cracked. They held crushed ice against Mrs. Cheyne's neck and climbed the endless grades past Ash Fork toward Flagstaff, beneath dry and distant skies.
        - id: ch01-b59
          speaker: narrator
          text: The speed needle flicked back and forth. Cinders rattled over the roof, and dust whirled behind the wheels. In the combination car, the crew sat sweating on their bunks. Cheyne joined them and shouted old railroad stories over the roar, stories every trainman knew. He told them about his son and how the sea had returned the dead. They nodded, spat, and shared his joy. They asked whether the sick woman in the private car could stand more speed. Cheyne believed she could.
        - id: ch01-b60
          speaker: narrator
          text: From Flagstaff to Winslow, the great iron fire-horse was allowed to run until a division superintendent protested. In the private stateroom, Suzanne clung white-faced to the silver door handle. Mrs. Cheyne only moaned and asked her husband to make them hurry.
        - id: ch01-b61
          speaker: narrator
          text: They left the dry sands and moonlit rocks of Arizona behind. At Coolidge, beside the Continental Divide, the couplings crashed and the brake hose sighed. Three bold engineers took their turns at the terrible controls. Each began cool and confident. Each finished pale, trembling, and soaked. They hauled the train up from Albuquerque to Glorieta, past Springer and the Raton Tunnel, then sent it rocking down into La Junta. They glimpsed the Arkansas River and raced along the slope to Dodge City, where Cheyne found comfort in setting his watch one hour ahead.
        - id: ch01-b62
          speaker: narrator
          text: There was little talk inside the Constance. Milsom and Miss Kinzey sat together on the Spanish leather cushions beside the broad rear window, watching the railroad ties surge away behind them. It was believed they made notes about the scenery. Cheyne paced between the useless luxury of his car and the bare working car ahead, an unlit cigar between his teeth. The crews pitied him, forgot he was their natural enemy, and tried to keep him company.
        - id: ch01-b63
          speaker: narrator
          text: At night, clusters of electric lights shone inside that troubled palace of every comfort. They ate splendid meals as the train swung on through a vast and lonely emptiness. Then the darkness filled with sounds. Water rushed from a tank, and a Chinese worker called in a deep voice. Hammers clicked against the Krupp steel wheels to test them. A railroad man cursed a tramp away from the rear platform. Coal crashed into a tender. Each time they flew past a waiting train, its noise struck the Constance and fell away behind.
        - id: ch01-b64
          speaker: narrator
          text: They looked down into vast ravines while trestles purred beneath the wheels. Rocks rose high enough to hide half the stars. Gullies opened, changed, and rolled back toward jagged mountains on the horizon. Then the mountains sank into lower hills. At last, the true plains spread before them.
        - id: ch01-b65
          speaker: narrator
          text: At Dodge City, an unknown hand tossed aboard a Kansas newspaper. It carried an interview with Harvey, sent by telegraph from Boston after some eager reporter found him. The joyful account proved beyond doubt that the boy was theirs, and for a little while it quieted Mrs. Cheyne.
        - id: ch01-b66
          speaker: narrator
          text: Her one word, “hurry,” passed from crew to crew and reached the engineers at Nickerson, Topeka, and Marceline. On the easier grades, they swept the continent behind them. Towns and villages stood closer together now. At last it felt as though they were traveling among people.
        - id: ch01-b67
          speaker: mrs_cheyne
          text: I can't see the speed dial, and my eyes hurt. How fast are we going?
        - id: ch01-b68
          speaker: harvey_sr
          text: We're doing the very best we can, Mama. There's no point reaching Chicago before the Limited. We would only wait there.
        - id: ch01-b69
          speaker: mrs_cheyne
          text: I don't care. I need to feel that we're moving. Sit beside me and tell me every mile.
        - id: ch01-b70
          speaker: narrator
          text: Cheyne sat and read the dial aloud. Some of those miles remain railroad records. Yet the seventy-foot car never lost its long, ship-like roll. It moved through the heat with the hum of an enormous bee. No speed could satisfy Mrs. Cheyne. The merciless August heat made her dizzy. The clock hands seemed frozen. When would they ever reach Chicago?
        - id: ch01-b71
          speaker: narrator
          text: A story later claimed that during the engine change at Fort Madison, Cheyne gave the locomotive engineers enough money to fight men like him forever on equal terms. That was not true. He paid his obligations to the engineers and firemen as generously as he believed they deserved. Only his bank knew how much he gave the crews who had understood his trouble and done their best for him.
        - id: ch01-b72
          speaker: narrator
          text: At Sixteenth Street, the final Western crew took complete charge of every switching move because Mrs. Cheyne had finally fallen into a doze. Heaven help anyone who bumped her awake. The highly paid engineer who took the Lake Shore and Michigan Southern Limited from Chicago to Elkhart normally ruled his train like a king. He did not approve of anyone telling him how to back toward a car. This time he handled the Constance as carefully as if it were loaded with dynamite. When the Western crew thought he needed correction, they used only whispers and silent hand signals.
        - id: ch01-b73
          speakers: [railroad_man_1, railroad_man_2]
          ensemble: duo
          text: We weren't chasing a record. Harvey Cheyne's wife was sick in the back, and we didn't want to shake her up.
        - id: ch01-b74
          speaker: railroad_man_1
          text: Come to think of it, we made San Diego to Chicago in fifty-seven hours and fifty-four minutes.
        - id: ch01-b75
          speaker: railroad_man_2
          text: Tell that to those Eastern way trains. When we decide to run for a record, we'll let them know.
        - id: ch01-b76
          speaker: narrator
          text: To a Western railroad man, Chicago and Boston sat almost side by side, though neither city would have liked the idea. The Limited swept the Constance to Buffalo and delivered it to the New York Central and Hudson River. Famous railroad chiefs with white whiskers and gold watch-chain charms boarded there to speak with Cheyne about business. The line carried them smoothly to Albany. Then the Boston and Albany finished the journey from ocean to ocean.
        - id: ch01-b77
          speaker: narrator
          text: The total time was eighty-seven hours and thirty-five minutes. Three days, fifteen hours, and a half. Harvey was waiting.
        - id: ch01-b78
          speaker: narrator
          text: After great emotion, most people and every boy need food. Behind drawn curtains, his parents feasted their returned prodigal while trains thundered in and out around them. Harvey ate, drank, and poured out his adventures almost without taking a breath. Whenever one hand was free, his mother held and stroked it.
        - id: ch01-b79
          speaker: narrator
          text: The open salt air had thickened Harvey's voice. His palms were hard and rough, and his wrists were marked with sores from fish slime. His rubber boots and blue jersey carried a strong smell of cod. His father watched him with the practiced eye of a man who judged other men. He did not know what lasting harm the boy might have suffered. Then he realized he had never known his son very well at all.
        - id: ch01-b80
          speaker: narrator
          text: Cheyne remembered a soft, dissatisfied boy who enjoyed insulting his father and making his mother cry, the sort of rich young nuisance who tormented hotel servants. That boy was gone. This sturdy young fisherman did not squirm. He met his father's eyes steadily and spoke with a respect so clear that it was almost startling. Something in his voice promised the change would last.
        - id: ch01-b81
          speaker: harvey_sr
          text: Someone has been making him behave. Constance never would have allowed that. I don't see how Europe could have done any better.
        - id: ch01-b82
          speaker: narrator
          text: Mrs. Cheyne had already heard Harvey's story twice, but she returned to the question that troubled her.
        - id: ch01-b83
          speaker: mrs_cheyne
          text: Why didn't you tell this Mr. Troop who you were?
        - id: ch01-b84
          speaker: harvey
          text: Disko Troop, dear. He's the best man who ever walked a deck. I don't care who comes second.
        - id: ch01-b85
          speaker: mrs_cheyne
          text: Why didn't you ask him to put you ashore? Papa would have paid him ten times over.
        - id: ch01-b86
          speaker: harvey
          text: I know, but he thought I was crazy. I couldn't find the money in my pocket, so I'm afraid I called him a thief.
        - id: ch01-b87
          speaker: mrs_cheyne
          text: A sailor found your money beside the flagstaff that night.
          emotion: sad
        - id: ch01-b88
          speaker: harvey
          text: Well, that explains it. I don't blame Troop. I said I wouldn't work, right there on a fishing boat. So he hit me on the nose, and you should have seen me bleed.
        - id: ch01-b89
          speaker: mrs_cheyne
          text: My poor darling! They must have treated you dreadfully.
          emotion: sad
        - id: ch01-b90
          speaker: harvey
          text: I don't know about that. Afterward, I finally saw sense.
        - id: ch01-b91
          speaker: narrator
          text: Cheyne slapped his leg and chuckled. Here was a boy after his own hungry heart. He had never seen that exact spark in Harvey's eyes before.
        - id: ch01-b92
          speaker: harvey
          text: The old man hired me for ten and a half dollars a month. He's paid half already. I joined Dan and worked as hard as I could. I can't do a full man's work yet, but I can handle a dory almost as well as Dan. Fog doesn't scare me much now. I can steer in light winds, nearly bait a whole trawl, and I know the ropes. I can pitch fish all day, and I'm mighty good at reading old Josephus. I'll even show you how fish skin clears coffee. I think I'll have another cup, please. You wouldn't believe how much work ten and a half dollars buys!
        - id: ch01-b93
          speaker: harvey_sr
          text: My first wage was eight and a half dollars, son.
        - id: ch01-b94
          speaker: harvey
          text: Was it? You never told me, sir.
        - id: ch01-b95
          speaker: harvey_sr
          text: You never asked, Harve. Someday I'll tell you, if you want to hear it. Try a stuffed olive.
        - id: ch01-b96
          speaker: harvey
          text: Troop says the most interesting thing in the world is learning how the next man earns his food. It sure is good to have a fancy meal again. We ate well on the Banks, even if it was plain food. Disko fed us first-rate. He's a great man. Dan, his son, is my partner. Then there's Uncle Salters with all his talk about manure and Josephus. He still thinks I'm a little crazy. Poor Penn really is confused, though. Don't mention Johnstown to him. And you have to meet Tom Platt, Long Jack, and Manuel. Manuel saved my life. I wish he weren't Portuguese, because he doesn't say much, but he can make music out of anything. He found me drifting and pulled me aboard.
        - id: ch01-b97
          speaker: mrs_cheyne
          text: I don't understand how your nerves survived any of it.
        - id: ch01-b98
          speaker: harvey
          text: Why wouldn't they, Mama? I worked like a horse, ate like a hog, and slept like a dead man.
        - id: ch01-b99
          speaker: narrator
          text: That was more than Mrs. Cheyne could bear. Her mind returned to the dead body she had imagined rocking on the salt sea, and she went to her stateroom. Harvey curled up beside his father and began explaining everything he owed the crew.
        - id: ch01-b100
          speaker: harvey_sr
          text: You may count on me to do whatever I can for them, Harve. From what you say, they're good men.
        - id: ch01-b101
          speaker: harvey
          text: They're the best in the Fleet, sir. Ask anyone in Gloucester. Disko still thinks he cured me of being crazy. Dan's the only one I told about you, the private cars, and everything else. I'm not even sure he believes me. I want to knock them flat tomorrow. Can they move the Constance to Gloucester? Mama isn't fit to travel again, and we'll finish unloading by tomorrow. Wouverman buys our fish. We're the first boat back from the Banks, so it's four dollars and twenty-five cents a quintal. We held out until he agreed. Now he wants the fish quickly.
        - id: ch01-b102
          speaker: harvey_sr
          text: You mean you must work tomorrow?
        - id: ch01-b103
          speaker: harvey
          text: I promised Troop. I'm keeping the scale tally, and I brought my figures with me.
        - id: ch01-b104
          speaker: narrator
          text: Harvey produced a greasy notebook with such importance that his father nearly choked.
        - id: ch01-b105
          speaker: harvey
          text: By my count, there are only three hundred... no, about two hundred ninety-four or ninety-five quintals left.
        - id: ch01-b106
          speaker: harvey_sr
          text: Hire someone to take your place.
        - id: ch01-b107
          speaker: narrator
          text: Cheyne made the suggestion only to see how his son would answer.
        - id: ch01-b108
          speaker: harvey
          text: I can't, sir. I'm the schooner's tallyman. Troop says I'm better with figures than Dan is. Troop is a very fair man.
        - id: ch01-b109
          speaker: harvey_sr
          text: Suppose I don't move the Constance tonight. What would you do then?
        - id: ch01-b110
          speaker: narrator
          text: Harvey looked at the clock. It was twenty minutes past eleven.
        - id: ch01-b111
          speaker: harvey
          text: I'd sleep here until three and take the four o'clock freight. They usually let men from the Fleet ride free.
        - id: ch01-b112
          speaker: harvey_sr
          text: That's one way. But I think the Constance can reach Gloucester about as soon as your freight. Go to sleep now.
        - id: ch01-b113
          speaker: narrator
          text: Harvey stretched out on the sofa, kicked off his boots, and fell asleep before his father could dim the electric lights. Cheyne watched the young face beneath the arm flung across its forehead. Among many thoughts came one he could not avoid. Perhaps he had neglected his son.
        - id: ch01-b114
          speaker: harvey_sr
          text: A man never knows when he's taking his greatest risks. This could have ended worse than drowning. But I don't think it has. If Troop truly saved him from that, I don't own enough to repay the man.
        - id: ch01-b115
          speaker: narrator
          text: Morning brought a fresh sea breeze through the windows. The Constance stood on a siding among the freight cars at Gloucester, and Harvey had already gone to work.
        - id: ch01-b116
          speaker: mrs_cheyne
          text: Now he'll fall overboard again and drown.
          emotion: fearful
        - id: ch01-b117
          speaker: harvey_sr
          text: We'll go watch, with a rope ready in case he does. You've never seen him work for his living.
        - id: ch01-b118
          speaker: mrs_cheyne
          text: What nonsense! No one ever expected him to—
        - id: ch01-b119
          speaker: harvey_sr
          text: The man who hired him expected it. I think that man was right.
        - id: ch01-b120
          speaker: narrator
          text: They walked between shops filled with fishermen's oilskins to Wouverman's wharf. The We're Here rode high in the glorious morning light, her Bank flag still flying. Every hand was working. Disko stood by the main hatch and directed Manuel, Penn, and Uncle Salters at the tackle. Dan swung loaded baskets onto the wharf while Long Jack and Tom Platt filled them below. At the salt-sprinkled edge, Harvey guarded the skipper's interests with his notebook beside the scale clerk.
        - id: ch01-b121
          speakers: [long_jack, tom_platt]
          ensemble: duo
          text: The basket is ready!
        - id: ch01-b122
          speaker: disko
          text: Haul it up!
        - id: ch01-b123
          speaker: manuel
          text: Heave away now!
        - id: ch01-b124
          speaker: dan
          text: Here she comes!
        - id: ch01-b125
          speaker: narrator
          text: Above the work cries came Harvey's clear, fresh voice checking each weight. At last the final fish was swung out. Harvey jumped six feet from the wharf edge to a ratline because that was the quickest way to give Disko the tally.
        - id: ch01-b126
          speaker: harvey
          text: Two hundred ninety-seven, and the hold is empty!
        - id: ch01-b127
          speaker: disko
          text: What's the grand total, Harve?
        - id: ch01-b128
          speaker: harvey
          text: Eight hundred sixty-five quintals. Three thousand six hundred seventy-six dollars and twenty-five cents. I wish I earned a share instead of wages.
        - id: ch01-b129
          speaker: disko
          text: I won't say you haven't earned one, Harve. Run up to Wouverman's office and take him our tallies.
        - id: ch01-b130
          speaker: harvey_sr
          text: Who is that boy?
        - id: ch01-b131
          speaker: narrator
          text: Cheyne asked Dan as if he were one of the foolish summer visitors who always interrupted working men.
        - id: ch01-b132
          speaker: dan
          text: He's sort of our supercargo. We picked him up drifting on the Banks. Says he fell overboard from a liner where he was a passenger. Now he figures he's a fisherman.
        - id: ch01-b133
          speaker: harvey_sr
          text: Does he earn what you feed him?
        - id: ch01-b134
          speaker: dan
          text: Ye-ep. Dad, this gentleman wants to know whether Harve earns his keep. Would you folks like to come aboard? We'll rig a ladder for the lady.
        - id: ch01-b135
          speaker: harvey_sr
          text: Very much. It won't hurt you, Mama, and then you can see for yourself.
        - id: ch01-b136
          speaker: narrator
          text: One week earlier, Mrs. Cheyne had been unable to lift her head. Now she scrambled down the ladder and stood amazed among the ropes, gear, and disorder at the stern.
        - id: ch01-b137
          speaker: disko
          text: Are you folks interested in Harve somehow?
        - id: ch01-b138
          speaker: harvey_sr
          text: Well, yes.
        - id: ch01-b139
          speaker: disko
          text: He's a good boy. He grabs hold of a job as soon as he's told. You heard how we found him? When he came aboard, I figured he had nervous prostration or had knocked his head. He's over it now. This is the cabin. It isn't tidy, but look around if you like. Those figures on the stovepipe are his. That's where we mostly keep the accounts.
        - id: ch01-b140
          speaker: mrs_cheyne
          text: Did Harvey sleep here?
        - id: ch01-b141
          speaker: narrator
          text: She sat on a yellow locker and looked across the untidy bunks.
        - id: ch01-b142
          speaker: disko
          text: No, ma'am. He slept forward. Except for him and my boy stealing fried pies and making coffee when they should've been asleep, I can't find much fault with him.
        - id: ch01-b143
          speaker: uncle_salters
          text: There wasn't much wrong with Harve. He did hang my boots from the main truck, and he isn't respectful enough to people who know more than he does, especially about farming. But Dan led him astray most of the time.
        - id: ch01-b144
          speaker: narrator
          text: Meanwhile, Dan remembered the mysterious hints Harvey had dropped that morning and danced with excitement on deck.
        - id: ch01-b145
          speaker: dan
          text: Tom! His folks are here. Dad hasn't caught on, and they're all talking in the cabin. She's wonderful, and from the look of him, Harvey told the truth about his father.
        - id: ch01-b146
          speaker: narrator
          text: Long Jack climbed out, covered with salt and fish skin.
        - id: ch01-b147
          speaker: long_jack
          text: Holy smoke! Do you mean the kid's story about driving four ponies in his own carriage was true?
          emotion: surprised
        - id: ch01-b148
          speaker: dan
          text: I knew it all along. Come hear Dad admit he judged Harve wrong.
        - id: ch01-b149
          speaker: narrator
          text: They arrived in time to hear Cheyne finish his sentence.
        - id: ch01-b150
          speaker: harvey_sr
          text: I'm glad you think well of him, because Harvey is my son.
        - id: ch01-b151
          speaker: narrator
          text: Disko's jaw dropped. Long Jack always swore he heard it click. The skipper stared from the man to the woman and back again.
        - id: ch01-b152
          speaker: harvey_sr
          text: His telegram reached me in San Diego four days ago, and we came straight across.
        - id: ch01-b153
          speaker: dan
          text: In a private car? He said you might.
        - id: ch01-b154
          speaker: harvey_sr
          text: In a private car, of course.
        - id: ch01-b155
          speaker: narrator
          text: Dan sent a hurricane of disrespectful winks toward his father.
        - id: ch01-b156
          speaker: long_jack
          text: He told us once that he drove four little ponies with a carriage of his own. Was that true too?
        - id: ch01-b157
          speaker: harvey_sr
          text: Very likely. Was it, Mama?
        - id: ch01-b158
          speaker: mrs_cheyne
          text: I think he had a little four-wheeled carriage when we were in Toledo.
        - id: ch01-b159
          speaker: narrator
          text: Long Jack whistled.
        - id: ch01-b160
          speaker: long_jack
          text: Oh, Disko!
        - id: ch01-b161
          speaker: disko
          text: I was wrong. I'm wrong worse than the men of Marblehead. I don't mind admitting it, Mr. Cheyne. I thought the boy was crazy because he talked so strangely about money.
        - id: ch01-b162
          speaker: harvey_sr
          text: He told me that.
        - id: ch01-b163
          speaker: disko
          text: Did he tell you anything else? I hit him once.
        - id: ch01-b164
          speaker: narrator
          text: Disko gave Mrs. Cheyne an anxious glance.
        - id: ch01-b165
          speaker: harvey_sr
          text: Yes, he told me. I suspect it did him more good than anything else in the world.
        - id: ch01-b166
          speaker: disko
          text: I reckoned it was necessary, or I wouldn't have done it. I don't want you thinking we mistreat boys aboard this vessel.
        - id: ch01-b167
          speaker: harvey_sr
          text: I don't think that, Mr. Troop.
        - id: ch01-b168
          speaker: narrator
          text: Mrs. Cheyne studied them all. Disko had a yellow, hairless face as hard as iron. A fringe of farming whiskers circled Uncle Salters's face. Penn looked simply bewildered. Manuel smiled quietly. Long Jack grinned with delight, and Tom Platt's scar showed plainly. They were rough men by her standards. But she looked with a mother's understanding, rose, and held out both hands.
        - id: ch01-b169
          speaker: mrs_cheyne
          text: Please tell me which man is which. I want to thank every one of you and give you my blessing.
          emotion: happy
        - id: ch01-b170
          speaker: long_jack
          text: Faith, ma'am, that repays me a hundred times over.
          emotion: happy
        - id: ch01-b171
          speaker: narrator
          text: Disko presented each man as formally as the captain of an old China trader. Mrs. Cheyne tried to answer, but happiness tangled her words. When she learned that Manuel had first found Harvey, she nearly threw herself into his arms.
        - id: ch01-b172
          speaker: manuel
          text: But how could I leave him drifting? What would you do yourself if you found a boy that way? Eh, what? He is one good boy, and I am very glad he turns out to be your son.
        - id: ch01-b173
          speaker: mrs_cheyne
          text: And Harvey told me Dan was his partner!
          emotion: happy
        - id: ch01-b174
          speaker: narrator
          text: Dan was pink already. When Mrs. Cheyne kissed both his cheeks before the whole crew, he turned deep crimson. The men led her forward to see the forecastle, and she cried again. She insisted on climbing down to inspect Harvey's very own bunk. The cook was cleaning the stove there. He nodded to her as if she were someone he had expected to meet for years, and showed no surprise at all.
        - id: ch01-b175
          speaker: narrator
          text: Two men at a time tried to explain the daily life of the schooner. Mrs. Cheyne sat beside the pawl post with her gloved hands resting on the greasy table. Her lips trembled while she laughed, and her eyes danced while she cried.
        - id: ch01-b176
          speaker: long_jack
          text: Who can ever use the We're Here after this? I feel as though the lady has turned her into a cathedral.
        - id: ch01-b177
          speaker: tom_platt
          text: Cathedral, nothing! If only this had been the Fish Commission boat instead of this blasted little schooner. We ought to have some order, some dignity, and sailors lined up when she leaves. Instead she'll climb that ladder like a hen while we stand around useless.
        - id: ch01-b178
          speaker: penn
          text: Then Harvey was never mad?
        - id: ch01-b179
          speaker: harvey_sr
          text: No, thank God.
          emotion: happy
        - id: ch01-b180
          speaker: narrator
          text: The big millionaire bent toward Penn with unusual gentleness.
        - id: ch01-b181
          speaker: penn
          text: It must be terrible to lose your mind. I can think of only one thing worse, and that is losing your child. But your child has returned. Let us thank God for that.
        - id: ch01-b182
          speaker: harvey
          text: Hello down there!
        - id: ch01-b183
          speaker: narrator
          text: Harvey looked kindly down at them from the wharf.
        - id: ch01-b184
          speaker: disko
          text: I was wrong, Harve. I admit I was wrong about you. You don't need to rub it in anymore.
        - id: ch01-b185
          speaker: dan
          text: Don't worry. I'll take care of that part.
        - id: ch01-b186
          speaker: disko
          text: You'll be leaving us now, won't you?
        - id: ch01-b187
          speaker: harvey
          text: Not before I get the rest of my wages, unless you'd like me to have the We're Here seized.
        - id: ch01-b188
          speaker: disko
          text: That's right. I clean forgot.
        - id: ch01-b189
          speaker: narrator
          text: Disko counted out the remaining dollars.
        - id: ch01-b190
          speaker: disko
          text: You did every bit of work you agreed to, Harve. You did it almost as well as if you'd been raised—
        - id: ch01-b191
          speaker: narrator
          text: Disko stopped. He could not see a safe ending to that sentence.
        - id: ch01-b192
          speaker: dan
          text: Raised somewhere outside a private car?
        - id: ch01-b193
          speaker: harvey
          text: Come on. I'll show it to you.
        - id: ch01-b194
          speaker: narrator
          text: Cheyne stayed aboard to speak with Disko. Everyone else followed Mrs. Cheyne in a procession to the station. Suzanne shrieked when they invaded the Constance. Without saying a word, Harvey showed them its stamped leather, silver handles and rails, cut velvet, plate glass, nickel, bronze, hammered iron, and rare woods from across the continent. The fishermen stared in equal silence.
        - id: ch01-b195
          speaker: harvey
          text: I told you. I told every one of you.
        - id: ch01-b196
          speaker: narrator
          text: That was Harvey's final revenge, and it was more than enough. Mrs. Cheyne ordered a meal. To make the story complete, she waited on the fishermen herself, giving Long Jack a tale he would repeat at his boardinghouse for years. Men accustomed to eating at tiny tables in roaring storms learn surprisingly neat and polished manners. Mrs. Cheyne did not know that, so their care among the fine dishes amazed her.
        - id: ch01-b197
          speaker: narrator
          text: She wished she could keep Manuel as a butler because he moved so quietly among the delicate glasses and silver. Tom Platt remembered grand days on the Ohio and foreign rulers dining with the officers. Long Jack supplied cheerful talk until everyone felt at ease.
        - id: ch01-b198
          speaker: narrator
          text: Back in the schooner's cabin, the two fathers studied each other through cigar smoke. Cheyne knew when money could not be offered to a man. He also knew no amount could pay Disko for what he had done. So he kept quiet and waited for an opening.
        - id: ch01-b199
          speaker: disko
          text: I didn't do anything to your boy or for him beyond making him work some and teaching him to steer. He has twice my boy's head for figures.
        - id: ch01-b200
          speaker: harvey_sr
          text: By the way, Mr. Troop, what future do you see for Dan?
        - id: ch01-b201
          speaker: narrator
          text: Disko took the cigar from his mouth and waved it around the cabin.
        - id: ch01-b202
          speaker: disko
          text: Dan is a plain boy, and he won't let me do his thinking. This capable little boat will be his when I'm too old to sail. He has no wish to leave fishing. I know that much.
        - id: ch01-b203
          speaker: harvey_sr
          text: Have you ever been West?
        - id: ch01-b204
          speaker: disko
          text: I've only gone as far as New York, and that was by boat. Railroads are no use to me, and Dan feels the same. Salt water is good enough for the Troops. I've been almost everywhere the natural way, by sea.
        - id: ch01-b205
          speaker: harvey_sr
          text: I can give Dan all the salt water he needs, until he's ready to be a captain.
        - id: ch01-b206
          speaker: disko
          text: How could you do that? I thought you were some kind of railroad king. That's what Harve said back when I was wrong about him.
        - id: ch01-b207
          speaker: harvey_sr
          text: We all make mistakes. Perhaps you don't know that I own six iron tea clippers running between San Francisco and Yokohama. Each is about seventeen hundred eighty tons.
        - id: ch01-b208
          speaker: disko
          text: Blame that boy! He never said a word. I'd have listened to that instead of all his talk about railroads and pony carriages.
        - id: ch01-b209
          speaker: harvey_sr
          text: Harvey didn't know.
        - id: ch01-b210
          speaker: disko
          text: A little thing like owning six ships slipped his mind, did it?
        - id: ch01-b211
          speaker: harvey_sr
          text: No. I only took control of the Blue M freighters, the old Morgan and McQuade line, this summer.
        - id: ch01-b212
          speaker: narrator
          text: Disko collapsed beside the stove.
        - id: ch01-b213
          speaker: disko
          text: Great Caesar Almighty! I've been fooled from bow to stern. Phil Airheart left this town six or seven years ago, and now he's mate on the San Jose. She crossed in twenty-six days. His sister still lives here and reads his letters to my wife. Do you truly own the Blue M freighters?
          emotion: surprised
        - id: ch01-b214
          speaker: narrator
          text: Cheyne nodded.
        - id: ch01-b215
          speaker: disko
          text: If I had known that, I'd have brought the We're Here straight back to port on Harvey's word.
        - id: ch01-b216
          speaker: harvey_sr
          text: That might not have been so good for Harvey.
        - id: ch01-b217
          speaker: disko
          text: If only I'd known! If he had mentioned that line, I'd have understood him. I'll never trust my own judgment again. Those are well-built ships. Phil Airheart says so.
        - id: ch01-b218
          speaker: harvey_sr
          text: I'm glad to have his recommendation. Airheart commands the San Jose now. What I mean to ask is whether you would lend me Dan for a year or two. We might make a mate of him. Would you trust the boy to Airheart?
        - id: ch01-b219
          speaker: disko
          text: A raw boy would be a risk for him.
        - id: ch01-b220
          speaker: harvey_sr
          text: I know a man who took a greater risk for me.
        - id: ch01-b221
          speaker: disko
          text: That's different. I'm not praising Dan merely because he's my own son. Bank fishing isn't clipper work, but the boy hasn't much left to learn. He can steer as well as any boy alive, if his father may say so. The rest is in our blood. I only wish he weren't so weak at navigation.
        - id: ch01-b222
          speaker: harvey_sr
          text: Airheart will teach him. Dan can ship as a boy for one or two voyages. After that, we'll help him rise. You train him this winter, and I'll send for him early in spring. I know the Pacific is far away.
        - id: ch01-b223
          speaker: disko
          text: Nonsense! Living and dead, Troops are scattered all around the earth and its seas.
        - id: ch01-b224
          speaker: harvey_sr
          text: Understand this, because I mean it. Whenever you want to see him, tell me. I'll arrange the journey, and it won't cost you a cent.
        - id: ch01-b225
          speaker: disko
          text: Walk home with me and we'll talk to my wife. I've been so wildly wrong in all my judgments that this doesn't seem real either.
        - id: ch01-b226
          speaker: narrator
          text: They walked through nasturtiums edged with blue to the Troops' white house, which had cost eighteen hundred dollars. A retired dory rested in the front yard. Behind closed shutters, the parlor had become a museum of things brought home from distant seas. Mrs. Troop sat there, a large, grave, quiet woman. Her eyes were dim from long years of watching the water and waiting for the people she loved to return. Cheyne addressed his offer to her. Wearily, she gave her consent.
        - id: ch01-b227
          speaker: mrs_troop
          text: Gloucester alone loses a hundred boys and men every year, Mr. Cheyne. I've learned to hate the sea as though it were alive and listening. God never made it for people to live anchored upon it. Your ships sail straight out and straight home again, don't they?
          emotion: sad
        - id: ch01-b228
          speaker: harvey_sr
          text: As straight as the winds allow. I pay a bonus for fast passages, because tea doesn't improve at sea.
        - id: ch01-b229
          speaker: mrs_troop
          text: When Dan was little, he played at keeping a store. I hoped he might make a life of it. But as soon as he could paddle a dory, I knew that hope would be taken from me.
          emotion: sad
        - id: ch01-b230
          speaker: disko
          text: They're square-rigged ships, Mother. Iron built and properly equipped. Remember what Phil's sister reads from his letters.
        - id: ch01-b231
          speaker: mrs_troop
          text: I've never known Phil to lie, but he's too daring, like most men who use the sea. If Dan chooses to go, Mr. Cheyne, I won't stop him.
        - id: ch01-b232
          speaker: disko
          text: She hates the ocean. And I don't know the polite way to say this, or I'd thank you better.
        - id: ch01-b233
          speaker: mrs_troop
          text: The sea took my father, my eldest brother, two nephews, and my second sister's husband. Could you care for anything that took all of them?
          emotion: sad
        - id: ch01-b234
          speaker: narrator
          text: Cheyne was relieved when Dan arrived and accepted the offer with more joy than he could put into words. It opened a straight and certain road toward everything a young sailor could want. Yet Dan did not think about advancement or security. He pictured himself commanding a watch on broad decks and looking into harbors far from Gloucester.
        - id: ch01-b235
          speaker: narrator
          text: Mrs. Cheyne spoke privately with the puzzling Manuel about saving Harvey. He appeared to want no reward. When she insisted, he agreed to five dollars so he could buy a gift for a girl.
        - id: ch01-b236
          speaker: manuel
          text: How can I take money when earning my food and tobacco is easy? You wish to give something whether I like it or not, yes? Then give me money, but not in that way. Give all you can think to give.
        - id: ch01-b237
          speaker: narrator
          text: Manuel introduced her to a snuff-stained Portuguese priest whose list of poor widows seemed as long as his cassock. Mrs. Cheyne was a strict Unitarian and could not share his beliefs, but she came to respect the lively little brown man.
        - id: ch01-b238
          speaker: narrator
          text: As a faithful son of his Church, Manuel claimed every blessing the priest showered upon Mrs. Cheyne for her charity.
        - id: ch01-b239
          speaker: manuel
          text: That settles my account. Now I have very good absolution for six months.
        - id: ch01-b240
          speaker: narrator
          text: He went off to buy a handkerchief for the girl he favored that week and to break the hearts of all the others.
        - id: ch01-b241
          speaker: narrator
          text: Uncle Salters took Penn west for a while and left no address. He feared that millionaires with wasteful private cars might become too interested in his companion. Better to visit relatives inland until the danger passed. On the train, he laid down the rules.
        - id: ch01-b242
          speaker: uncle_salters
          text: Don't you ever let rich people adopt you, Penn, or I'll break this checkerboard over your head. If you forget your name again, remember it is Pratt. Remember that you belong with Salters Troop, and sit exactly where you are until I come for you. Don't trail after people whose eyes bulge with richness, just like Scripture says.
