  chapters:
    - id: ch01
      title: 第九章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 心里再苦，身家千万的人也还得管生意。六月底，老哈维·切恩去东部接妻子。她已经崩溃，几乎疯了，日日夜夜都梦见儿子沉入灰色的海水。切恩给她请了医生、专门护士和按摩女工，甚至找来信仰疗法的陪伴者。可不管来了谁，都没有用。
        - id: ch01-b02
          speaker: narrator
          text: 切恩太太不是躺着呻吟，就是逢人便讲她的孩子，一讲就是几个钟头。她已经不抱希望，别人又怎么能给她希望？她只想听人保证，溺水不会疼。丈夫寸步不离地守着，就怕她亲自去试。他很少说自己的痛苦，甚至不知道那痛苦究竟有多深。直到某天，他发现自己竟对着书桌上的日历开了口。
        - id: ch01-b03
          speaker: cheyne
          text: 再活下去，还有什么意思？
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: 他心底一直藏着个愉快的念头。等所有事都安顿好，儿子也念完大学，他就会把孩子揽进怀里，领进自己那片庞大的产业。父子会立刻成为伴侣、合伙人和盟友，一起度过大展宏图的灿烂年月。老人的头脑，会扶着年轻人的热火。如今儿子葬身海里，和他的大茶船上某个瑞典水手没什么两样。妻子也快死了，或者比死更糟。他自己又被一队队女人、医生和仆人围得透不过气，被妻子反复无常、焦躁不安的念头折磨着。他绝望了，已经没力气对付那些商场上的敌人。
        - id: ch01-b05
          speaker: narrator
          text: 他把妻子带进圣迭戈那座新得还有些发硬的大宅。妻子和照料她的人，住在造价高昂的一翼。切恩则守在临游廊的屋里，一边是秘书，一边是兼做报务员的女打字员，日复一日地疲惫苦撑。四家西部铁路正在大打运价战，原本和他利害相关。俄勒冈的伐木场又爆发了破坏性极强的罢工。加州议会向来不喜欢那些造就了这个州的人，如今也准备公开向他宣战。
        - id: ch01-b06
          speaker: narrator
          text: 换在平时，仗还没送到门前，他早就迎上去，痛痛快快、不择手段地打一场了。现在，他只瘫坐在那里。柔软的黑帽子压到鼻梁，高大的身体仿佛缩进了宽松的衣服里。他不是盯着自己的靴子，就是望着海湾里的中国帆船。秘书拆着星期六的邮件，问一句，他就心不在焉地点一下头。
        - id: ch01-b07
          speaker: narrator
          text: 切恩正算着，撂下一切退休要花多少钱。保险足够他买下帝王般的年金。他们可以住到科罗拉多，偶尔去华盛顿或南卡罗来纳沿海走动，也许就能忘掉落空的计划。可另一方面……
        - id: ch01-b08
          speaker: narrator
          text: 打字机忽然停了。金泽小姐看向米尔萨姆，米尔萨姆的脸已经白了。他把一封由旧金山转来的电报交给切恩。
        - id: ch01-b09
          speaker: narrator
          text: 电报上说，哈维从轮船落水，被渔船《我们在这儿号》救起。他在大浅滩捕鱼，人很好，现在安全地等在马萨诸塞州格洛斯特，由迪斯科·特鲁普照料。他请家里汇钱，或告诉他该怎么办，最后问，妈妈好吗？
        - id: ch01-b10
          speaker: narrator
          text: 电报从父亲手里掉下去。他把头伏在合上的卷盖书桌上，沉沉地喘息。米尔萨姆跑去找医生。医生赶来时，切恩正在屋里来回走。
        - id: ch01-b11
          speaker: cheyne
          text: 你怎么看？这有可能吗？这封电报到底说了什么？我根本看不明白。
          emotion: surprised
        - id: ch01-b12
          speaker: doctor
          text: 我看得懂。这就是说，我每年要少赚七千美元了。
        - id: ch01-b13
          speaker: narrator
          text: 医生叹了口气。他服从切恩的硬命令，丢下了纽约那家刚刚起步的诊所。可他还是把电报递了回去。
        - id: ch01-b14
          speaker: cheyne
          text: 你的意思是，应该告诉她？万一是骗局呢？
        - id: ch01-b15
          speaker: doctor
          text: 骗你又能得到什么？这事一查就清楚。一定是那孩子。
        - id: ch01-b16
          speaker: narrator
          text: 法国女仆苏珊娜出现了，神气得好像没有高薪，谁也留不住她。
        - id: ch01-b17
          speaker: susanne
          text: 太太叫你马上过去。她觉得你病了。
        - id: ch01-b18
          speaker: narrator
          text: 身家三千万的人乖乖低下头，跟着她走了。白木大宅的楼梯上方，切恩太太用细尖的声音问出了什么事。丈夫结结巴巴地说出消息，紧接着，一声尖叫穿透整座回声荡漾的房子。
        - id: ch01-b19
          speaker: doctor
          text: 这下没事了。金泽小姐，小说里讲医学的话，大概只有一句是真的。人不会欢喜死。
        - id: ch01-b20
          speaker: miss_kinzey
          text: 我知道。不过现在可有一大堆事要做。
        - id: ch01-b21
          speaker: narrator
          text: 金泽小姐来自密尔沃基，说话一向直截了当。她对米尔萨姆本来就有意，一眼看出工作来了。米尔萨姆正盯着墙上那幅巨大的美国地图。
        - id: ch01-b22
          speaker: cheyne
          text: 米尔萨姆，我们横穿大陆过去。用私人车厢，一路直达波士顿。把每一段接驳都安排好！
        - id: ch01-b23
          speaker: milsom
          text: 我就知道。
        - id: ch01-b24
          speaker: narrator
          text: 米尔萨姆转向金泽小姐，两人的目光碰到一处。这一眼后来又生出另一个故事，不过与这个故事无关。金泽小姐询问似的看着他，像是在怀疑，你真有这份本事吗？米尔萨姆朝摩尔斯电报机一指，像个将军在调动旅队投入战场。随后，他又像乐师一样用手掠过头发，抬头望了望天花板，立刻动手工作。金泽小姐白皙的手指，也开始召唤整个美洲大陆。
        - id: ch01-b25
          speaker: milsom
          text: 洛杉矶，给K·H·韦德。金泽小姐，《康斯坦丝号》在洛杉矶，对吧？
        - id: ch01-b26
          speaker: miss_kinzey
          text: 对。
        - id: ch01-b27
          speaker: milsom
          text: 那就发。把私人车厢《康斯坦丝号》送来，安排一趟专列星期日出发，必须在下星期二赶上芝加哥十六街的纽约特快。
        - id: ch01-b28
          speaker: miss_kinzey
          text: 还不能再快一点吗？
        - id: ch01-b29
          speaker: milsom
          text: 那几段坡道不行。这已经只给他们六十小时到芝加哥。准备好了吗？再请湖岸与密歇根南方铁路接运车厢，经布法罗、奥尔巴尼，直到波士顿。切恩先生必须在星期三晚上抵达，一切阻碍都要排除。
        - id: ch01-b30
          speaker: narrator
          text: 他让金泽小姐再发电报给芝加哥的坎尼夫、铁路的图西和巴恩斯，把每一段怎么接车都说得清清楚楚。坎尼夫得在下星期二下午，从圣菲铁路手里接收《康斯坦丝号》，挂上纽约特快，一路直到布法罗。车厢再交给纽约中央铁路，开往奥尔巴尼。话说到一半，米尔萨姆还问金泽小姐去没去过纽约，邀她改天一起去。
        - id: ch01-b31
          speaker: miss_kinzey
          text: 我是没去过纽约，可这个我懂！
        - id: ch01-b32
          speaker: milsom
          text: 失礼了。再给巴恩斯发同样的指示，从奥尔巴尼直达波士顿。每位经理都催一催，总没坏处。
        - id: ch01-b33
          speaker: miss_kinzey
          text: 真了不起。
        - id: ch01-b34
          speaker: milsom
          text: 还不坏。换了别人，光研究路线就要花一星期，还得白丢三十小时。
        - id: ch01-b35
          speaker: miss_kinzey
          text: 可纽约特快呢？就算昌西·迪皮亲自出马，他的车厢也挂不上去。
        - id: ch01-b36
          speaker: milsom
          text: 这回不是昌西，是快如闪电的切恩。一定挂得上。
        - id: ch01-b37
          speaker: miss_kinzey
          text: 那也该给那孩子回封电报。这事你忘了。
        - id: ch01-b38
          speaker: milsom
          text: 我去问。
        - id: ch01-b39
          speaker: narrator
          text: 米尔萨姆带回父亲的口信，让哈维按约定的时间到波士顿会合。他回来时，金泽小姐正对着电键发笑，接着他也笑了。洛杉矶十万火急地追问，为什么？为什么？为什么？还说普遍的不安已经出现，正在蔓延。十分钟后，芝加哥又来电求他们，如果本世纪大案正在酝酿，请及时警告朋友，因为那里所有人都在找地方躲避。最后，连米尔萨姆也想不出有什么关系的托皮卡，也来电说，别开枪，上校，我们这就投降。
        - id: ch01-b40
          speaker: narrator
          text: 切恩看见商场敌人吓成这样，冷冷一笑。
        - id: ch01-b41
          speaker: cheyne
          text: 他们以为我们要开战。告诉他们，我现在没心思打仗。你和金泽小姐也一起去。把实话发出去，这回破个例。
        - id: ch01-b42
          speaker: narrator
          text: 金泽小姐把那份情意敲进电键，米尔萨姆又添上一句，让我们享有和平。两千英里外，掌管六千三百万美元铁路权益的人终于松了口气。切恩正飞奔去接奇迹般失而复得的独子。这是熊去找自己的幼崽，不是要对付多头。那些已经拔刀、准备为金融性命厮杀的硬汉，纷纷收起武器，祝他一路蒙上帝保佑。还有五六个吓破胆的无名小人物，又抬起头，吹嘘说切恩要是没收起战斧，自己原本会做出多么惊人的事。
        - id: ch01-b43
          speaker: narrator
          text: 那个周末，电报线忙得不可开交。忧虑消除后，各路人马和沿途城市都抢着行个方便。洛杉矶通知圣迭戈和巴斯托，让南加利福尼亚铁路的司机在孤零零的机车库里提前待命。巴斯托再通知大西洋与太平洋铁路。到了阿尔伯克基，消息沿着阿奇逊、托皮卡与圣菲铁路的整套管理系统，一口气抛向芝加哥。
        - id: ch01-b44
          speaker: narrator
          text: 一台机车、一节带全班乘务的客货车厢，再加上富丽堂皇的《康斯坦丝号》，要在两千三百五十英里的路上加急放行。一百七十七列火车要让路，每个调度员和乘务员都得接到通知。还要十六台机车、十六名司机和十六名司炉，全都得是能找到的最好人手。
        - id: ch01-b45
          speaker: narrator
          text: 换机车只准用两分半，加水三分钟，加煤两分钟。电线一路唱着，通知所有人照这个时间准备水塔和煤槽，因为哈维·切恩在赶路，赶路，赶路！时速必须达到四十英里，每位分区主管都得在自己的管段随专列同行。从圣迭戈直到芝加哥十六街，给他铺开飞天魔毯。快！快呀！
        - id: ch01-b46
          speaker: narrator
          text: 星期日黎明，列车驶出圣迭戈。
        - id: ch01-b47
          speaker: cheyne
          text: 天会很热。我们会尽量快，妈妈。可你真不用这么早就戴好帽子和手套。躺下把药吃了吧。要不是星期日，我还能陪你玩一盘多米诺骨牌。
        - id: ch01-b48
          speaker: mrs_cheyne
          text: 我会听话的，我一定听话。可是……帽子一摘，我就觉得我们永远也到不了。
          emotion: fearful
        - id: ch01-b49
          speaker: cheyne
          text: 睡一会儿。还没等你回过神，我们就到芝加哥了。
          emotion: calm
        - id: ch01-b50
          speaker: mrs_cheyne
          text: 可我们要去波士顿，爸爸。叫他们快一点。
        - id: ch01-b51
          speaker: narrator
          text: 六英尺高的动轮重重捶着铁轨，奔向圣贝纳迪诺和莫哈维荒原。这一段都是坡道，跑不出速度，真正的快车还在后面。列车折向东边，奔尼德尔斯和科罗拉多河而去。山中的热气刚过去，沙漠的热气又追上来。在极度干旱的灼人强光里，车身咔咔作响。人们把碎冰敷在切恩太太脖子上，列车则沿着漫长得像没有尽头的坡道，艰难地往上爬。
        - id: ch01-b52
          speaker: narrator
          text: 列车经过阿什福克，又往有森林和采石场的弗拉格斯塔夫去。头顶的天空干燥得像离他们很远。速度计的指针来回轻颤，煤渣沙沙打着车顶，飞转的车轮向后吸起一股旋动的尘烟。客货合造车厢里，乘务员只穿着衬衫，坐在铺位上直喘气。
        - id: ch01-b53
          speaker: narrator
          text: 切恩走到他们中间，顶着轰响讲起每个火车人都熟悉的老故事。他又讲到自己的儿子，讲大海怎样把死者送回人间。乘务员们陪他欢喜，又问后面那位太太，要是司机再放开一点，她受不受得住。切恩说受得住。从弗拉格斯塔夫到温斯洛，那匹巨大的火马真的放开了，直到分区主管出面反对。
        - id: ch01-b54
          speaker: narrator
          text: 切恩太太留在闺房式的卧室里。法国女仆脸色蜡白，死死抓住银门把手。她却只轻轻呻吟，反复求丈夫让他们快。列车把亚利桑那的沙地和月光下的岩石甩在后面，一路烘烤着往前，到车钩猛撞、制动软管嘶喘时，他们已经到了大陆分水岭边的库利奇。
        - id: ch01-b55
          speaker: narrator
          text: 三名大胆老练的司机接班时，个个冷静自信，浑身干爽。等他们从那可怕的驾驶轮旁下班，却个个脸色苍白，浑身发颤，湿得像刚从水里捞出来。他们驾着列车，越过从阿尔伯克基通往格洛列塔的大高坡，过了斯普林格仍旧一路向上。列车一直爬到州界的拉顿隧道，随后摇摆着俯冲拉洪塔，望见阿肯色河，又沿着长坡直扑道奇城。切恩在那里把表拨快一小时，心里又得到一次安慰。
        - id: ch01-b56
          speaker: narrator
          text: 车里很少有人说话。米尔萨姆和金泽小姐并肩坐在车尾的西班牙皮坐垫上，看枕木从身后起伏流退。据说，他们还顺便记下了沿途风景。切恩咬着没点燃的雪茄，在奢华的私人车厢和朴素的客货车厢之间焦躁地走来走去。乘务员同情他，连他本是铁路人的天敌都忘了，个个设法替他解闷。
        - id: ch01-b57
          speaker: narrator
          text: 入夜，成束的电灯把这座装满奢侈品的忧愁宫殿照得通明。他们吃着无比丰盛的饭，摇摇晃晃地穿过荒凉得叫人显得渺小的无边虚空。一会儿是水塔冲水的哗哗声，一个中国人从喉咙里发出含混的说话声，检验钢轮的锤子叮叮当当，还有流浪汉被赶下后平台时的骂声。一会儿又是煤块倾进煤水车的沉重轰鸣。专列飞驰着掠过停车等待的火车，把一层层声浪拍到后方。
        - id: ch01-b58
          speaker: narrator
          text: 他们时而望进深渊，听栈桥在车轮下低声哗噜。时而抬头看着岩壁遮掉半边星空。冲沟和峡谷退向山岭，又碎成越来越低的丘陵，直到真正的平原终于展开。
        - id: ch01-b59
          speaker: narrator
          text: 到了道奇城，有人从外面扔进一份堪萨斯报纸。上面的访谈证明，那真是他们的孩子。切恩太太终于安稳了一阵，可她仍只有一个字。
        - id: ch01-b60
          speaker: mrs_cheyne
          text: 快。
        - id: ch01-b61
          speaker: narrator
          text: 乘务员把这个字一路传给尼克森、托皮卡和马瑟琳的司机。那些地方坡度平缓，列车把整个大陆扫到了身后。城镇和村庄一个挨一个，他们终于能真切地感到，自己正从人群中穿过。
        - id: ch01-b62
          speaker: mrs_cheyne
          text: 我眼睛疼，看不清表盘。现在多快？
        - id: ch01-b63
          speaker: cheyne
          text: 已经尽了全力，妈妈。提前赶上特快也没用，我们只会在那里等。
        - id: ch01-b64
          speaker: mrs_cheyne
          text: 我不管。我得感觉到车在往前走。你坐下，把每一英里都念给我听。
        - id: ch01-b65
          speaker: narrator
          text: 切恩坐下，一个数一个数地报给她听。有几段路创下的纪录，后来一直没有被打破。可那节七十英尺长的车厢仍像轮船一样悠长地摇晃，在热浪里嗡嗡作响。八月的酷热把切恩太太烤得发晕，时钟的指针像是根本没动。到底什么时候，才能到芝加哥？
        - id: ch01-b66
          speaker: narrator
          text: 有人说，在麦迪逊堡换机车时，切恩给联合机车工程师兄弟会捐了一笔基金，数目大得足够让他们从此永远跟切恩和他的同类势均力敌地斗下去。这说法并不是真的。他只是照自己的算法，付清了欠司机和司炉的人情。至于他究竟送给那些同情他的乘务员多少钱，那就只有他的银行知道了。
        - id: ch01-b67
          speaker: narrator
          text: 有一件事倒是真的。最后一班乘务员接管了芝加哥十六街的全部调车工作，因为“她”终于打起盹睡。谁要敢撞她一下，就等着老天收拾吧。湖岸与密歇根南方铁路的特快从芝加哥开往埃尔克哈特，掌车的是一位薪水极高的专家。他有些专横，最讨厌别人教他怎么倒车挂车厢。可轮到《康斯坦丝号》，他还是小心得像在摆弄一车炸药。乘务员就算责备他，也只敢压低声音，再加上一通手势。
        - id: ch01-b68
          speaker: railwayman
          text: 呕！我们可没想破纪录。哈维·切恩的太太病着，我们不肯颠她。从圣迭戈到芝加哥，也就是五十七小时五十四分。告诉东部那些慢吞吞的地方车吧。等我们真想破纪录，自然会通知他们。
        - id: ch01-b69
          speaker: narrator
          text: 在西部人眼里，芝加哥和波士顿简直脸贴着脸。虽然两座城市听了都不会高兴，有些铁路却很乐意助长这种错觉。特快把《康斯坦丝号》旋风般送进布法罗，交给纽约中央与哈得孙河铁路。几位留着白色络腮胡，表链上挂着金饰的显赫铁路大亨登上车，找切恩谈了一点生意。随后，车厢轻盈地滑进奥尔巴尼，再由波士顿与奥尔巴尼铁路，跑完从一处潮水到另一处潮水的最后一段。全程八十七小时三十五分，也就是三天十五个半小时。哈维就在那里等他们。
        - id: ch01-b70
          speaker: narrator
          text: 经历过剧烈的情绪震荡，大多数人和所有男孩都得吃东西。他们拉上窗帘，把外界隔开，在无比的幸福里款待这个归来的浪子。四周的列车还在轰鸣进出。
        - id: ch01-b71
          speaker: narrator
          text: 哈维一口气又吃又喝，还大讲自己的历险。只要他腾出一只手，母亲就把它握住。海风把他的嗓音吹粗了，手掌又硬又粗，手腕上留着鱼污疮的斑点。橡胶靴和蓝毛衣周围，还有一股浓厚的鳕鱼味。
        - id: ch01-b72
          speaker: narrator
          text: 父亲惯于识人，这会儿正锋利地打量儿子，想知道他是不是受了什么长久的伤害。他突然发现，自己其实根本不了解儿子。他只清楚记得从前那个永不知足、脸庞虚胖的少年，爱教训老头子，还常惹得母亲掉眼泪。那样的有钱小少爷一走进公共休息室和旅馆游廊，就会给那里添上不少热闹。他们天真烂漫地戏弄听差，甚至开口辱骂他们，只因为自己出身在有钱人家。
        - id: ch01-b73
          speaker: narrator
          text: 眼前这个结实端正的渔家少年，却已经不再扭来扭去。他的目光安定又清澈，看人时毫不闪躲。他说话恭敬得明明白白，甚至叫父亲吃惊。他的声音里还有一样东西，像在向人保证，这场改变不会随着他离开渔船而消失。新的哈维已经留下来了。
        - id: ch01-b74
          speaker: cheyne
          text: 有人真正管教过他了。康斯坦丝绝不会准许别人这么做。就算把他送去欧洲，也未必教得更好。
        - id: ch01-b75
          speaker: narrator
          text: 哈维已经把故事讲了至少两遍，母亲还是问他。
        - id: ch01-b76
          speaker: mrs_cheyne
          text: 你怎么不告诉那个特鲁普，你究竟是谁？
        - id: ch01-b77
          speaker: harvey
          text: 他叫迪斯科·特鲁普，亲爱的。世上踩过甲板的人，他数第一。谁排第二，我可不管。
        - id: ch01-b78
          speaker: mrs_cheyne
          text: 那你怎么不叫他送你上岸？你知道爸爸会十倍补偿他。
        - id: ch01-b79
          speaker: harvey
          text: 我知道。可他以为我疯了。我口袋里的钞票不见了，大概还骂他是贼。
        - id: ch01-b80
          speaker: mrs_cheyne
          text: 那天晚上，有个水手在旗杆旁边捡到了。
          emotion: sad
        - id: ch01-b81
          speaker: harvey
          text: 那就全对上了。不能怪特鲁普。我只是说不肯干活，偏偏又是在大浅滩上说这话。他当然就一拳打中我的鼻子。哎呀，血流得像杀猪一样！
        - id: ch01-b82
          speaker: mrs_cheyne
          text: 我可怜的宝贝！他们肯定把你欺负惨了。
          emotion: sad
        - id: ch01-b83
          speaker: harvey
          text: 那可不好说。反正挨完那一拳，我算是开窍了。
        - id: ch01-b84
          speaker: narrator
          text: 切恩拍着腿，咯咯地笑。这孩子就要长成他打心眼里想要的那种儿子了。哈维眼里的那点光，他从前从没见过。
        - id: ch01-b85
          speaker: harvey
          text: 老头子每月给我十块半，已经付了一半。我跟丹搭伙，上船就开工。我还干不了成年人的活，可划小艇已经快赶上丹了，在雾里也不怎么怕。风小时我还能轮班掌舵，就是替人把船……亲爱的，我也会给延绳钓具装饵，绳索都认得，往船上扔鱼能一直扔到母牛回家。老约瑟夫斯我更是行家，还能教你们用鱼皮澄清咖啡。再给我一杯吧。你们根本想不到，每月十块半得干多少活！
        - id: ch01-b86
          speaker: cheyne
          text: 儿子，我刚起步时，每月只拿八块半。
        - id: ch01-b87
          speaker: harvey
          text: 真的？先生，你从没告诉过我。
        - id: ch01-b88
          speaker: cheyne
          text: 你从来没问过，哈维。哪天你愿意听，我可以讲给你。先尝尝这个酿橄榄。
        - id: ch01-b89
          speaker: harvey
          text: 特鲁普说，世上最有意思的事，就是弄明白别人怎么挣饭吃。又吃到摆得整整齐齐的饭，可真不错。船上吃得也好，可大浅滩脏得很。迪斯科给的都是一等货，他真了不起。丹是我的搭档。索尔特斯叔叔整天讲肥料，还读《犹太古史》，到现在他都认定我是疯子。可怜的小宾恩才真疯了，千万不能跟他提约翰斯敦。
        - id: ch01-b90
          speaker: harvey
          text: 你们还一定得认识汤姆·普拉特、长杰克和曼努埃尔。是曼努埃尔救了我的命。可惜他是葡萄牙人，不大会说话，却一直在奏音乐。我从船上被冲走后，就是他看见我在海上漂着，把我捞了起来。
        - id: ch01-b91
          speaker: mrs_cheyne
          text: 真想不到，你的神经竟然没有完全毁掉。
        - id: ch01-b92
          speaker: harvey
          text: 怎么会毁掉，妈妈？我像马一样干活，像猪一样吃饭，像死人一样睡觉。
        - id: ch01-b93
          speaker: narrator
          text: 切恩太太听不下去了。她又想起梦里那具在咸涩海面上摇荡的尸体，起身回卧室去了。哈维蜷到父亲身边，细说自己欠船上那些人多少恩情。
        - id: ch01-b94
          speaker: cheyne
          text: 你放心，哈维。只要我办得到，那一伙人的事，我全会办。听起来，他们都是好人。
        - id: ch01-b95
          speaker: harvey
          text: 他们是整支船队里最好的人，先生。去格洛斯特问问就知道。可迪斯科到现在还以为，是他治好了我的疯病。关于你、我们的私人车厢和那些事，我只向丹透了一点。可他信不信，我也说不准。明天我非把他们惊呆不可。
        - id: ch01-b96
          speaker: harvey
          text: 能不能把《康斯坦丝号》调到格洛斯特？妈妈不适合再挪动，再说我们明天得把鱼全卸完。沃弗曼收我们的鱼。我们是这一季第一条离开大浅滩的船，每担四块二毛五。我们一直咬着价，逼他答应才算数。他们急着要货。
        - id: ch01-b97
          speaker: cheyne
          text: 这么说，明天你还得干活？
        - id: ch01-b98
          speaker: harvey
          text: 我答应过特鲁普。我在磅秤那边记数，计数单也带来了。照我的账，只剩三百……不对，两百九十四或九十五担。
        - id: ch01-b99
          speaker: narrator
          text: 他神气十足地看着那本油腻腻的笔记簿，看得父亲险些噎住。切恩有意提议雇个人代替他，想看看儿子怎么回答。
        - id: ch01-b100
          speaker: harvey
          text: 不行，先生。我是船上的计数员。特鲁普说我算数比丹强，他这个人最公道。
        - id: ch01-b101
          speaker: cheyne
          text: 那要是我今晚不把车厢调过去，你怎么办？
        - id: ch01-b102
          speaker: narrator
          text: 哈维看看钟，已经是十一点二十分。
        - id: ch01-b103
          speaker: harvey
          text: 我就在这里睡到三点，再赶四点的货车。通常他们肯让船队的人免费搭车。
        - id: ch01-b104
          speaker: cheyne
          text: 这也行。不过我想，《康斯坦丝号》差不多能和你那班货车同时到。现在睡吧。
        - id: ch01-b105
          speaker: narrator
          text: 哈维往沙发上一瘫，踢掉靴子。父亲还没来得及调暗电灯，他已经睡着了。切恩坐在旁边，看着那张年轻的脸藏在横搭额头的手臂下。许多念头从心里掠过，其中一个是，也许自己以前做父亲太疏忽了。
        - id: ch01-b106
          speaker: cheyne
          text: 人永远不知道，自己什么时候冒了最大的险。这事原本可能比淹死更糟。不过我想没有，我想没有。要是真没有，我所有的钱也报答不了特鲁普。应该没有。
        - id: ch01-b107
          speaker: narrator
          text: 清晨，新鲜海风从窗口吹进来。《康斯坦丝号》已经停在格洛斯特的货车之间，哈维早去干正事了。
        - id: ch01-b108
          speaker: mrs_cheyne
          text: 那他又会掉进海里淹死。
          emotion: fearful
        - id: ch01-b109
          speaker: cheyne
          text: 我们去看着，先备好绳子。万一他掉下去，就扔给他。你还没见过他干活挣钱呢。
        - id: ch01-b110
          speaker: mrs_cheyne
          text: 胡说！谁会指望……
        - id: ch01-b111
          speaker: cheyne
          text: 雇他的人就会指望。而且他这么做是对的。
        - id: ch01-b112
          speaker: narrator
          text: 两人穿过一间间挂满渔民油布衣的商店，来到沃弗曼的码头。《我们在这儿号》卸下了一部分沉重的渔货，已经高高浮在水面上，大浅滩船旗还在飘。灿烂的晨光里，全船的人都忙得像一群海狸。码头上到处都是盐粒，湿润的鱼腥味跟新鲜海风混在一起。
        - id: ch01-b113
          speaker: narrator
          text: 迪斯科站在主舱口边，指挥曼努埃尔、宾恩和索尔特斯操作吊具。长杰克和汤姆·普拉特装满鱼筐，丹把沉重的筐子荡到岸上。哈维拿着笔记簿，在磅秤边维护船长的利益。
        - id: ch01-b114
          speakers: [long_jack, disko, manuel, dan]
          ensemble: chorus
          text: 好了！起！嘿！来啦！
        - id: ch01-b115
          speaker: narrator
          text: 最后一筐鱼吊了出来。哈维要把计数单交给迪斯科，便抄近路，从码头边梁跳出六英尺，一把抓住桅梯绳。
        - id: ch01-b116
          speaker: harvey
          text: 两百九十七担，底舱空啦！
          emotion: happy
        - id: ch01-b117
          speaker: disko
          text: 总共多少，哈维？
        - id: ch01-b118
          speaker: harvey
          text: 八百六十五担，三千六百七十六块两毛五。真希望我也能拿分成，不只是月钱。
        - id: ch01-b119
          speaker: disko
          text: 嗯，我可不能说你没挣到这份资格。赶紧去沃弗曼的办公室，把计数单交给他吧。
        - id: ch01-b120
          speaker: cheyne
          text: 那孩子是谁？
        - id: ch01-b121
          speaker: narrator
          text: 切恩问的是丹。丹早已习惯替那些无所事事、蠢得出奇的避暑客回答各种问题。
        - id: ch01-b122
          speaker: dan
          text: 他算是随船管货的吧。我们在大浅滩捞到他时，他刚被水从船上冲走。他说自己原来是邮轮上的乘客。现在嘛，差不多已经是个渔夫了。
        - id: ch01-b123
          speaker: cheyne
          text: 他挣得回自己的饭钱吗？
        - id: ch01-b124
          speaker: dan
          text: 挣……得。爸，这位先生想知道哈维挣不挣得回饭钱。你们想上船吗？我们给这位太太搭架梯子。
        - id: ch01-b125
          speaker: cheyne
          text: 我很愿意。不会伤着你的，妈妈。正好亲眼看看。
        - id: ch01-b126
          speaker: narrator
          text: 一个星期前还抬不起头的女人，如今竟然顺着临时搭起的梯子，一步一步爬下船去。她站在后甲板上的一片凌乱中，看着眼前这条曾带儿子横过大浅滩的渔船，一时惊得目瞪口呆。
        - id: ch01-b127
          speaker: disko
          text: 你们跟哈维有什么关系吗？
        - id: ch01-b128
          speaker: cheyne
          text: 嗯，有一点。
        - id: ch01-b129
          speaker: disko
          text: 他是个好孩子，叫他干什么，他马上就干。你们听说我们怎么发现他的了吧？刚捞上来时，我猜他是神经衰弱，或者脑袋撞过什么。如今已经全好了。这里就是舱房，还没收拾，你们只管看。烟囱上那些数字是他写的，我们多半把账记在那里。
        - id: ch01-b130
          speaker: mrs_cheyne
          text: 他睡在这里吗？
        - id: ch01-b131
          speaker: disko
          text: 不，他睡前舱，太太。除了他和我家小子该睡觉时偷炸馅饼，把船弄得乌烟瘴气，我也挑不出他特别的毛病。
        - id: ch01-b132
          speaker: salters
          text: 哈维没什么不好。他把我的靴子挂到主桅顶上，对比他懂得多的人也不大恭敬，尤其一说到种田。不过多半是丹把他带坏了。
        - id: ch01-b133
          speaker: narrator
          text: 甲板上，丹记着哈维早晨给的暗示，正在跳战舞。
        - id: ch01-b134
          speaker: dan
          text: 汤姆，汤姆！哈维的家里人来了，爸还一点没猜到。他们正在舱房里开大会呢。她可真漂亮。至于他，光看模样，哈维吹的那些全是真的。
        - id: ch01-b135
          speaker: long_jack
          text: 圣烟哪！他说过自己有辆小孩坐的四马车。难道那也是真的？
          emotion: surprised
        - id: ch01-b136
          speaker: dan
          text: 我早知道全是真的。来看看爸怎么看走眼吧。
        - id: ch01-b137
          speaker: narrator
          text: 大家兴高采烈地赶来，刚好听到切恩的话。
        - id: ch01-b138
          speaker: cheyne
          text: 听说他品行不错，我很高兴。因为他是我儿子。
        - id: ch01-b139
          speaker: narrator
          text: 迪斯科的下巴掉了下来。长杰克后来一辈子都发誓，他当时真的听见那下巴咔嗒响了一声。迪斯科一下望望站在面前的高大男人，一下又望望那个虚弱的女人，轮流瞪着他们，怎么也没法立刻相信。
        - id: ch01-b140
          speaker: cheyne
          text: 四天前，我在圣迭戈收到他的电报，我们就赶来了。
        - id: ch01-b141
          speaker: dan
          text: 坐私人车厢？他说你们可能会坐。
        - id: ch01-b142
          speaker: cheyne
          text: 当然是坐私人车厢。
        - id: ch01-b143
          speaker: narrator
          text: 丹望着父亲，一阵狂风暴雨般没大没小地眨眼。
        - id: ch01-b144
          speaker: long_jack
          text: 他还说过，自己赶着四匹小马拉的车。那也是真的？
        - id: ch01-b145
          speaker: cheyne
          text: 很可能。是吗，妈妈？
        - id: ch01-b146
          speaker: mrs_cheyne
          text: 我想，我们住在托莱多时，他是有过一辆小型四轮马车。
        - id: ch01-b147
          speaker: long_jack
          text: 啊，迪斯科！
        - id: ch01-b148
          speaker: disko
          text: 我看走眼了。错得比马布尔黑德那些人还离谱。切恩先生，我不怕向你承认，我原本怀疑这孩子疯了。他谈起钱时，口气实在古怪。
        - id: ch01-b149
          speaker: cheyne
          text: 他告诉过我。
        - id: ch01-b150
          speaker: disko
          text: 他还说了别的吗？我揍过他一拳。
        - id: ch01-b151
          speaker: cheyne
          text: 说了。依我看，那一拳带给他的好处，大概胜过世上任何东西。
        - id: ch01-b152
          speaker: disko
          text: 我当时认准非打不可，不然不会动手。我不想让你以为，我们在船上会欺负自家孩子。
        - id: ch01-b153
          speaker: cheyne
          text: 我不这么想，特鲁普先生。
        - id: ch01-b154
          speaker: narrator
          text: 切恩太太一直仔细看着每一张脸。迪斯科的脸像象牙一样发黄，没有胡须，坚硬得像铁铸。索尔特斯脸边围着一圈庄稼汉似的毛发。宾恩的脸茫然而单纯，曼努埃尔安静地微笑，长杰克欣喜地咧嘴，汤姆·普拉特脸上留着伤疤。照她原来的标准，他们当然都粗野得很。可这时候，她眼里已经有了母亲的聪慧。这些正是从海里把她的孩子送回来的人。她站起身，朝众人伸出双手。
        - id: ch01-b155
          speaker: mrs_cheyne
          text: 告诉我，你们每一位都是谁。我要谢谢你们，祝福你们。你们每一个人。
          emotion: happy
        - id: ch01-b156
          speaker: long_jack
          text: 真的，这句话抵得过一百倍的报答。
        - id: ch01-b157
          speaker: narrator
          text: 迪斯科一本正经地逐个介绍，做得像旧时中国航线上的大帆船船长一样周到，连顺序和称呼都一点不乱。切恩太太语无伦次地对这个人说几句，又赶紧转向下一个人，心里想说的感谢太多，连话都连不起来。等她弄明白，那天最先在海上发现哈维的人就是曼努埃尔，她险些整个人扑进他怀里。
        - id: ch01-b158
          speaker: manuel
          text: 可我怎么能把他留在海里漂着？要是你看到他那个样子，你又会怎么做？呃，怎么样？我可太高兴了，他原来是你们的儿子，是个好孩子。
        - id: ch01-b159
          speaker: mrs_cheyne
          text: 他还告诉我，丹是他的搭档！
          emotion: happy
        - id: ch01-b160
          speaker: narrator
          text: 丹的脸本来就够红了。切恩太太当着大家的面，在他两边脸颊上各亲了一下，他立刻红得发紫。众人又领她到船头参观前舱。她再次哭起来，却坚持要下去，亲眼看看哈维在海上那些日子睡过的铺位。厨子正在那里清理炉灶，见她进来，只是朝她点了点头，那神情就像等着与她见面，已经等了许多年。
        - id: ch01-b161
          speaker: narrator
          text: 大家每次都有两个人抢着开口，向她讲船上的日子。她坐在棘轮柱边，戴着手套的双手放在油腻桌面上，嘴唇颤着微笑，眼里闪着泪光。
        - id: ch01-b162
          speaker: long_jack
          text: 出了今天这件事，以后谁还敢使唤《我们在这儿号》？我觉得她把整条船都变成大教堂啦。
        - id: ch01-b163
          speaker: tom_platt
          text: 大教堂！哪怕来的是渔业委员会的船，也比咱们这条破船强。她过船时，咱们要是有一点体面规矩，该有舷梯卫兵列队。现在却让她像只母鸡一样爬梯子。咱们本该全员登桁致敬！
        - id: ch01-b164
          speaker: penn
          text: 那么，哈维并没有疯。
        - id: ch01-b165
          speaker: cheyne
          text: 一点也没有，感谢上帝。
        - id: ch01-b166
          speaker: penn
          text: 发疯一定很可怕。除了失去自己的孩子，我想不出还有什么更可怕。不过你的孩子回来了，是吗？让我们为这件事感谢上帝。
        - id: ch01-b167
          speaker: harvey
          text: 你们好啊！
        - id: ch01-b168
          speaker: narrator
          text: 哈维站在码头上，宽宏大量似的俯视众人。
        - id: ch01-b169
          speaker: disko
          text: 我看错了，哈维。是我判断错了。你用不着再往伤口里揉盐。
        - id: ch01-b170
          speaker: dan
          text: 这事交给我吧。
        - id: ch01-b171
          speaker: disko
          text: 你这就要走了吧？
        - id: ch01-b172
          speaker: harvey
          text: 你不结清剩下的工钱，我可不走。除非你想叫人把《我们在这儿号》扣下。
        - id: ch01-b173
          speaker: disko
          text: 说得对，我全给忘了。你答应的活全都干完了，哈维，而且干得差不多就像从小是在……
        - id: ch01-b174
          speaker: narrator
          text: 迪斯科猛然停住。他实在不知道这句话该怎么收尾。
        - id: ch01-b175
          speaker: dan
          text: 不是在私人车厢里长大的？
        - id: ch01-b176
          speaker: harvey
          text: 来吧，我带你们去看车。
        - id: ch01-b177
          speaker: narrator
          text: 切恩留下和迪斯科谈话。其余人跟着切恩太太，排成一队走向车站。苏珊娜见这群人闯进来，吓得尖叫。
        - id: ch01-b178
          speaker: narrator
          text: 哈维一声不吭，只把《康斯坦丝号》的种种富丽摆在他们眼前。渔夫们也不说话，一样一样地看过去。这里有压花皮革，银制的门把和栏杆，雕着花纹的天鹅绒，一整块的玻璃，还有发亮的镍、青铜和锻铁。车厢的各个角落里，还镶着美洲各处出产的稀有木材。
        - id: ch01-b179
          speaker: harvey
          text: 我告诉过你们。我早就说过了。
        - id: ch01-b180
          speaker: narrator
          text: 这是哈维最后、也最痛快的一次报复。切恩太太命人摆饭，还亲自伺候他们，好让长杰克日后讲起这一天时，不会缺少任何精彩细节。
        - id: ch01-b181
          speaker: narrator
          text: 这些平时在狂风怒号中，也能守着一张小桌吃饭的人，此刻的举止竟然格外整洁，样样都很周到。切恩太太并不知道他们原来会这样，自然看得非常惊讶。曼努埃尔在易碎的玻璃器皿和精致的银器间走动，始终安静而从容，她看着他，简直想请他到自己家里来当管家。
        - id: ch01-b182
          speaker: narrator
          text: 汤姆·普拉特想起《俄亥俄号》从前的气派，还有那些和军官同桌的外国贵宾。长杰克负责说闲话活跃气氛，慢慢地，所有人都自在了。
        - id: ch01-b183
          speaker: narrator
          text: 《我们在这儿号》的舱房里，两个父亲隔着雪茄的烟气，静静地打量着对方。切恩惯于识人，他很清楚，面前的迪斯科绝不是个能用钱酬谢的人。他同样清楚，无论拿出多少钱，也不可能偿还迪斯科为哈维做的一切。所以他没有急着提报答，只是不动声色地等着，等一个合适的机会开口。
        - id: ch01-b184
          speaker: disko
          text: 我没为你儿子做过什么。我只是让他干活，再教教他怎么掌舵。他算数的脑子，比我家小子强一倍。
        - id: ch01-b185
          speaker: cheyne
          text: 说起来，你打算让丹将来做什么？
        - id: ch01-b186
          speaker: narrator
          text: 迪斯科拿开雪茄，朝舱房四下挥了一圈。
        - id: ch01-b187
          speaker: disko
          text: 丹就是个普通小子，还不许我替他动脑筋。等我干不动了，这条船就是他的。他也不急着离开这一行。
        - id: ch01-b188
          speaker: cheyne
          text: 你去过西部吗，特鲁普先生？
        - id: ch01-b189
          speaker: disko
          text: 坐船最远到过纽约。我不喜欢铁路，丹也不喜欢。特鲁普家有咸水就够了。我差不多什么地方都去过，当然，走的是天生该走的路。
        - id: ch01-b190
          speaker: cheyne
          text: 我能给丹这辈子需要的所有咸水，一直到他当上船长。
        - id: ch01-b191
          speaker: disko
          text: 怎么说？我原以为你是个铁路大王。哈维当初就是这么说的。那时候，我判断错了。
        - id: ch01-b192
          speaker: cheyne
          text: 人人都会看错。我还以为你知道，我有六条运茶的铁制快帆船，往返旧金山和横滨，每条大约一千七百八十吨。
        - id: ch01-b193
          speaker: disko
          text: 这该死的小子！他从没说过。要是说了这个，我准会听，不会只当他在胡扯铁路和小马车。
        - id: ch01-b194
          speaker: cheyne
          text: 他不知道。
        - id: ch01-b195
          speaker: disko
          text: 这么点小事，大概从他脑子里漏过去了。
        - id: ch01-b196
          speaker: cheyne
          text: 不，我也是今年夏天才接手“蓝色M号”货船队，就是摩根和麦奎德从前那条航线。
        - id: ch01-b197
          speaker: narrator
          text: 迪斯科坐在炉子旁，当场垮了下去。
        - id: ch01-b198
          speaker: disko
          text: 万能的恺撒大神啊！我怕是从头到尾都叫人蒙了。菲尔·艾尔哈特就是从这镇上出去的，那是六年前，不，是七年前。他现在在《圣何塞号》当大副，那条船最近一次出航只用了二十六天。他姐姐还住在这里，收到信就念给我家女人听。“蓝色M号”货船队真是你的？
        - id: ch01-b199
          speaker: narrator
          text: 切恩点了点头。
        - id: ch01-b200
          speaker: disko
          text: 我要早知道，单凭这句话，就会扯满所有帆，把《我们在这儿号》拽回港来。
        - id: ch01-b201
          speaker: cheyne
          text: 那对哈维也许未必有好处。
        - id: ch01-b202
          speaker: disko
          text: 我要早知道就好了！他只要提一句那该死的船队，我就全明白了。我再也不信自己的判断了。那些船装备得很好，菲尔·艾尔哈特也这么说。
        - id: ch01-b203
          speaker: cheyne
          text: 能得到那边的好评，我很高兴。艾尔哈特现在已经是《圣何塞号》的船长。
        - id: ch01-b204
          speaker: cheyne
          text: 我真正想问的是，你肯不肯把丹借给我一两年，看看能不能把他培养成大副。你信得过艾尔哈特吗？
        - id: ch01-b205
          speaker: disko
          text: 带一个没历练过的小子上船，可是要冒险的。
        - id: ch01-b206
          speaker: cheyne
          text: 我认识一个人，他为我冒过更大的险。
        - id: ch01-b207
          speaker: disko
          text: 那不一样。我可不是因为丹是亲儿子，才特意夸他。大浅滩的做法跟快帆船不同，不过他要学的也不多。他会掌舵，没哪个男孩比他强。其他本事在我们家的血里，生来就会。可惜他的航海术实在差得要命。
        - id: ch01-b208
          speaker: cheyne
          text: 艾尔哈特会教他。先让他跑一两趟，当见习水手，然后再给他机会往上走。这个冬天，你先好好教他。明年初春，我派人来接。我知道太平洋很远。
        - id: ch01-b209
          speaker: disko
          text: 呸！特鲁普家活着的、死了的，遍布整片大地和里头的海洋。
        - id: ch01-b210
          speaker: cheyne
          text: 不过有一点，我必须说清楚。任何时候，只要你想见他，就告诉我。路程由我安排，不花你一分钱。
        - id: ch01-b211
          speaker: disko
          text: 你要是肯陪我走一段，咱们就去我家，跟我家女人谈谈。我最近老是判断错，简直像疯了，这事听着也不像真的。
        - id: ch01-b212
          speaker: narrator
          text: 他们沿着一条开满蓝色旱金莲的路，一路走到特鲁普家那幢白房子。这幢房子价值一千八百美元，前院里还完完整整地摆着一条已经退役的小艇。客厅的百叶窗紧紧关着，屋里存着许多从远方带回的东西，像一座专门收藏海外战利品的小博物馆。
        - id: ch01-b213
          speaker: narrator
          text: 屋里坐着一个高大的女人，她沉默而庄重，身上带着常年等待留下的疲惫。这么多年来，她总是望着大海，等心爱的人从海上回家。长久的张望和牵挂，已经让她的双眼变得黯淡。切恩没有让迪斯科代为转述，而是亲自把自己对丹的安排，还有愿意承担的一切，都向她说清楚。她听完以后，疲惫地答应了。
        - id: ch01-b214
          speaker: mrs_troop
          text: 单是格洛斯特，每年就要失去一百个男孩和男人。切恩先生，我现在恨大海，恨得好像它是活的，还能听见我说话。上帝造它，本来就不是让人类在上面抛锚安家。你的船都是直接出海，再直接回来，是吗？
        - id: ch01-b215
          speaker: cheyne
          text: 只要风肯让路，就尽量走直线。要是破了航程纪录，我还会发奖金。茶叶泡在海上，可不会越泡越好。
        - id: ch01-b216
          speaker: mrs_troop
          text: 他小时候总爱玩开店，我还盼着他会顺着那条路走下去。可他刚会划小艇，我就知道，这个心愿实现不了。
        - id: ch01-b217
          speaker: disko
          text: 那些都是横帆船，妈妈，铁造的，装备齐全。菲尔的信寄来时，他姐姐念的那些话，你还记得吧？
        - id: ch01-b218
          speaker: mrs_troop
          text: 我从没听说菲尔撒谎。可他太爱冒险，跟大多数靠海吃饭的人一样。只要丹自己愿意，他就去吧。我不拦他。
        - id: ch01-b219
          speaker: disko
          text: 她就是恨透了海。至于我，我大概不懂怎样才算有礼貌，要不然一定能把谢意说得更好。
        - id: ch01-b220
          speaker: mrs_troop
          text: 我父亲、我亲大哥、两个外甥，还有我二姐的丈夫。一样东西夺走了这么多人，你还能喜欢它吗？
          emotion: sad
        - id: ch01-b221
          speaker: narrator
          text: 她说着，把头垂到手上。丹回来后，欢喜得连话都说不出，当场接受了这个提议。切恩这才松了口气。
        - id: ch01-b222
          speaker: narrator
          text: 这的确是一条通往一切好前程的平坦大道，将来的机会已经清清楚楚地摆在丹面前。可丹并没有盘算那些地位和好处。他想得最多的，是在宽阔甲板上轮班当值，还有远远望着陌生的港口。
        - id: ch01-b223
          speaker: narrator
          text: 切恩太太曾私下找曼努埃尔，谈哈维获救的事。他一点也不想要钱。她再三逼问，他才说，自己愿意收五美元，好给一个姑娘买点东西。
        - id: ch01-b224
          speaker: manuel
          text: 我吃饭、抽烟都挣得这么容易，怎么还能拿你的钱？不管我愿不愿意，你都要给一点，是吗？呃，怎么样？那就给我吧，不过不是那种给法。你能想到多少，就全给出去。
        - id: ch01-b225
          speaker: narrator
          text: 曼努埃尔不肯自己收下那份重重的报答，反而把一个满身鼻烟味的葡萄牙神父介绍给她。那人手里有一张穷困寡妇的名单，长得跟他身上的法衣一样。切恩太太是严谨的一神论派信徒，实在无法认同这位神父的教义。可他一开口就滔滔不绝，又确实了解那些寡妇的穷困。谈到最后，她还是对这个棕色皮肤、口若悬河的小个子肃然起敬。
        - id: ch01-b226
          speaker: narrator
          text: 曼努埃尔是教会忠实的儿子。切恩太太把钱分给了那些穷困的寡妇，因为这份善行，人们纷纷为她祝福。曼努埃尔又用他那套自得其乐的算法，把众人因切恩太太行善而降给她的一切祝福，全都收进了自己名下。在他看来，这样就等于自己也得到了赦免。
        - id: ch01-b227
          speaker: manuel
          text: 这下我脱身啦。往后六个月，我都有顶好的赦罪。
          emotion: happy
        - id: ch01-b228
          speaker: narrator
          text: 他悠然走了出去，要给眼下那位姑娘买条手帕，再去伤透其余所有姑娘的心。
        - id: ch01-b229
          speaker: narrator
          text: 索尔特斯带着宾恩往西部去住了整整一季，两个人谁也没有给海岸这边留下地址。索尔特斯实在害怕，这些坐着私人车厢到处跑，把钱白白浪费在铁路上的百万富翁，会对自己的伙伴关心过了头。在他看来，最好先带宾恩去探望内陆的亲戚，安安稳稳地住上一阵，等海岸上真正风平浪静了再回来。
        - id: ch01-b230
          speaker: salters
          text: 千万别让有钱人收养你，宾恩。不然我就拿这块跳棋盘砸破你的脑袋。你要是又忘了自己的名字，就记住你姓普拉特，归索尔特斯·特鲁普管。坐在原地别动，等我来找你。
        - id: ch01-b231
          speaker: salters
          text: 照《圣经》上的话说，别跟在那些肥得眼珠都鼓出来的人后面乱跑。
