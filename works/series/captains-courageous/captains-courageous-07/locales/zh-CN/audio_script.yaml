audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着而略带讥诮的讲述
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中音
    harvey:
      display_name: 哈维
      tts:
        delivery: 少年人的高声逞强与任性
        timbre: 清亮偏尖
        pace: 稍快
        pitch: 中高音
    dan:
      display_name: 丹
      tts:
        delivery: 朴实活泼的渔家少年口吻
        timbre: 年轻而爽朗
        pace: 稍快
        pitch: 中高音
    disko:
      display_name: 迪斯科·特鲁普
      tts:
        delivery: 克制威严且带冷幽默
        timbre: 深沉坚硬
        pace: 缓慢稳重
        pitch: 低音
    long_jack:
      display_name: 长杰克
      tts:
        delivery: 爱起哄的戈尔韦水手口吻
        timbre: 粗亮
        pace: 明快
        pitch: 中低音
    tom_platt:
      display_name: 汤姆·普拉特
      tts:
        delivery: 老练从容的前军舰水手口吻
        timbre: 洪亮厚实
        pace: 稳健
        pitch: 低音
    penn:
      display_name: 宾恩
      tts:
        delivery: 温顺认真而略显迟疑
        timbre: 细弱
        pace: 稍慢
        pitch: 中高音
    salters:
      display_name: 索尔特斯叔叔
      tts:
        delivery: 暴躁直率的老水手口吻
        timbre: 粗哑
        pace: 稍快
        pitch: 中低音
    jason_olley:
      display_name: 杰森·奥利
      tts:
        delivery: 遭逢巨痛后恍惚低沉的老渔夫口吻
        timbre: 苍老沙哑
        pace: 缓慢断续
        pitch: 低音
    stricken_sailor:
      display_name: 遇难船水手
      tts:
        delivery: 隔着浓雾竭力呼喊的口吻
        timbre: 遥远而粗哑
        pace: 急促
        pitch: 中音
    carrie_sailor:
      display_name: 凯丽号水手
      tts:
        delivery: 好斗而嘴硬的渔夫口吻
        timbre: 粗亮
        pace: 稍快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第七章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天，更多帆影从东北偏东缓缓绕向西边。《我们在这儿号》眼看就要驶到“圣母像”附近的浅滩，浓雾却突然压下来。众人只好抛锚。四周一条船也看不见，只有一只只隐形的船铃在雾里此起彼落。鱼没捕到多少，偶尔会有两条小艇在白雾中迎面相遇。艇上的渔夫看不见远处，便停下来互相问问附近的消息。
        - id: ch01-b02
          speaker: narrator
          text: 天亮前，白天睡足了的丹和哈维爬起来，偷偷去拿炸馅饼。其实他们明明可以开口讨，可偷来的仿佛更香，还能顺便惹厨子生气。舱下又热又闷，两人带着馅饼上了甲板。迪斯科正守着船铃，见他们来了，便把铃交给哈维。
        - id: ch01-b03
          speaker: disko
          text: 接着敲。我好像听见了什么。真有事，我留在这儿也方便照应。
        - id: ch01-b04
          speaker: narrator
          text: 铃声才响起来，就像叫浓雾一把掐断。铃声一停，哈维便能听见远洋客轮的汽笛。那尖啸隔着厚雾，听起来低沉又模糊。他如今懂得大浅滩，知道那声音有多危险。他忽然想起从前的自己。那个穿樱桃红毛衣的无知小子，竟觉得大轮船撞沉渔船会很“带劲”。如今他已经像真正的渔夫一样，瞧不起那种花哨毛衣。可那时的他睡在有冷热水浴室的头等舱里，早晨还要对着烫金菜单挑上十分钟。
        - id: ch01-b05
          speaker: narrator
          text: 可现在，这个长大了许多的哈维，凌晨四点便站在昏暗的雨雾中。油布衣流水作响，他拼命敲着一只比客轮早餐铃还小的船铃。就在近处，三十英尺高的钢铁船艏正以每小时二十英里的速度冲来。更可怕的是，干燥舱房里那些熟睡的人，也许永远不会知道，自己还没吃早饭就毁掉了一整条船。想到这里，哈维只顾用力敲铃。
        - id: ch01-b06
          speaker: dan
          text: 对，他们会把该死的螺旋桨放慢一转，好叫自己不犯法。等咱们全沉到海底，想起这一点可真安慰人。听啊！这家伙来得真猛！
        - id: ch01-b07
          speaker: narrator
          text: 丹拿起曼努埃尔的海螺。汽笛嗷嗷尖啸，船铃叮当乱响，海螺也跟着吼叫。海和天全搅进了乳白色的雾里。突然，哈维觉得身边多了个移动的庞然大物。他仰起头，只见一道悬崖般湿亮的船艏，仿佛正从双桅船顶上跃过来。
        - id: ch01-b08
          speaker: narrator
          text: 巨轮的船艏卷着一簇轻快的白浪。鲑鱼色的船身抬起时，上面一列罗马数字飞快升高，十五、十六、十七、十八，一格接着一格。船艏随即向前下方一倾，发出叫人心脏骤停的嘶响。数字不见了，镶黄铜边的舷窗一排排闪过。一股蒸汽喷上哈维无可奈何地举起的双手，热水轰然扫过《我们在这儿号》的舷缘。螺旋桨撕碎海水，小船在激流里踉跄发抖，巨轮的船尾转眼便被浓雾吞没。
        - id: ch01-b09
          speaker: narrator
          text: 哈维几乎要昏倒，也几乎要吐出来。远处忽然传来一声爆裂，像大皮箱重重摔在人行道上。接着，一个细小得像从远方电话里传来的声音，隔着雾喊起来。
        - id: ch01-b10
          speaker: stricken_sailor
          text: 停船！你们把我们撞沉啦！
          emotion: fearful
        - id: ch01-b11
          speaker: harvey
          text: 撞的是咱们吗？
          emotion: fearful
        - id: ch01-b12
          speaker: dan
          text: 不是，是那边的船。你接着敲铃，我们划过去看看。
        - id: ch01-b13
          speaker: narrator
          text: 丹推下一条小艇。不到半分钟，除了哈维、宾恩和厨子，其余人都划进了雾里。先有一根齐根折断的前桅漂过船头。接着，一条空荡荡的绿色小艇碰着船舷，好像求他们把它收留。再后来，一个穿蓝毛衣的东西面朝水里漂过，可那已经不是一个完整的人。宾恩脸色变了，猛吸一口气。哈维害怕另一艘巨轮随时会撞来，只能绝望地敲铃。船员们回来时，丹从雾里一喊，吓得他全身一跳。
        - id: ch01-b14
          speaker: dan
          text: 是《珍妮·库什曼号》。从中间齐齐撞断，碾碎以后还踩了过去！离咱们不到四分之一英里。爸只救到老船长，没有别人了。可他儿子也在船上。哈维，我受不了！我刚才看见的东西，实在说不下去！
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: 丹把脸埋进胳膊，失声痛哭。其他人把一个灰发老人拖上甲板。
        - id: ch01-b16
          speaker: jason_olley
          text: 为什么要捞我？迪斯科，你为什么不让我沉下去？
          emotion: sad
        - id: ch01-b17
          speaker: narrator
          text: 迪斯科一只沉重的手压上他的肩。老人两眼发狂，嘴唇不住发抖，只管盯着沉默的船员。忽然，宾夕法尼亚·普拉特开口了。索尔特斯平时记不准他的名字，有时叫他哈斯金斯，有时叫里奇，有时又叫麦克维蒂。可这一刻，他脸上那副迷糊神情完全消失，像是转眼变成一位饱经世事、充满智慧的老人，声音也洪亮起来。
        - id: ch01-b18
          speaker: penn
          text: 赏赐的是主，收取的也是主。主的名应当称颂！我从前是牧师，现在仍是福音的牧师。把这个人交给我。
        - id: ch01-b19
          speaker: jason_olley
          text: 你是牧师？那就祈祷，把我儿子还回来！把那条值九千美元的船，还有一千担鱼也还回来！你们不救我，我的寡妇还能进救济院，干活换口饭吃。她永远也不会知道出了什么事。现在却要我亲口告诉她。
          emotion: angry
        - id: ch01-b20
          speaker: disko
          text: 这种时候没什么可说的。杰森·奥利，你先躺一会儿吧。
        - id: ch01-b21
          speaker: narrator
          text: 三十秒钟，一个人便失去了独生子、整个夏天的收获，还有往后赖以活命的一切。谁也想不出能安慰他的话。汤姆只能无意识地摆弄小艇的绳环。
        - id: ch01-b22
          speaker: tom_platt
          text: 船上的人都是格洛斯特人吧？
        - id: ch01-b23
          speaker: jason_olley
          text: 是不是又有什么分别？今年秋天，我去东格洛斯特替避暑客划船就是了。
          emotion: sad
        - id: ch01-b24
          speaker: narrator
          text: 杰森拧掉胡子里的水，沉重地晃到舷边，唱起一首圣歌。
        - id: ch01-b25
          speaker: jason_olley
          text: 快乐的鸟儿飞翔歌唱，至高的主啊，环绕你的祭坛！
          emotion: sad
        - id: ch01-b26
          speaker: penn
          text: 跟我来。到舱里去！
        - id: ch01-b27
          speaker: narrator
          text: 宾恩的口气像天生就有权发号施令。两人对视了好一阵，最后杰森低下头。
        - id: ch01-b28
          speaker: jason_olley
          text: 我不知道你是谁，可我跟你走。也许我还能找回一点……那九千美元里的一点。
        - id: ch01-b29
          speaker: narrator
          text: 宾恩领他进了舱房，又从里面拉上滑门。索尔特斯盯着那扇门，一眼认出，刚才站在自己面前的已经不是平日那个宾恩。
        - id: ch01-b30
          speaker: salters
          text: 那是雅各布·博伊勒！他想起约翰斯敦了！我从没见过活人有那样一双眼睛。现在可怎么办？我该怎么办？
          emotion: fearful
        - id: ch01-b31
          speaker: narrator
          text: 起初，舱里传来宾恩和杰森两个人的声音。后来只剩宾恩独自说话。索尔特斯听出他在祈祷，悄悄摘下帽子。过了一会儿，矮小的宾恩走上舱梯，脸上滚着大滴的汗。他停下来望向全体船员。另一边，丹仍趴在舵轮旁，一声接一声地抽泣。
        - id: ch01-b32
          speaker: salters
          text: 他已经不认识咱们了。一切都得从头来，连跳棋也得重新教。他会怎么看我呢？
          emotion: sad
        - id: ch01-b33
          speaker: narrator
          text: 宾恩说起话来，像是在面对一群素不相识的人。
        - id: ch01-b34
          speaker: penn
          text: 我已经祈祷过了。我们这些人相信祈祷。我求主保住这个人的儿子。我的妻子、长子和其他孩子，当年都在我眼前淹死了。人难道比造他的主更有智慧吗？我没有为他们的性命祈求。可这一次，我替这个人的儿子祈求了。孩子一定会回到父亲身边。
        - id: ch01-b35
          speaker: narrator
          text: 索尔特斯哀求似的望着宾恩，盼他还能记得自己。宾恩的嘴角突然抽动起来。
        - id: ch01-b36
          speaker: penn
          text: 我疯了多久？
        - id: ch01-b37
          speaker: salters
          text: 别这么说，宾恩。你从来没有疯，不过是一时心神不定。
        - id: ch01-b38
          speaker: penn
          text: 我记得大火烧起来以前，房屋撞上了桥。后面的事全没了。那是多久以前？
        - id: ch01-b39
          speaker: dan
          text: 我受不了！我真的受不了！
          emotion: sad
        - id: ch01-b40
          speaker: narrator
          text: 哈维也跟着呜咽。迪斯科开口时，连声音都在发颤。
        - id: ch01-b41
          speaker: disko
          text: 大约五年了。
        - id: ch01-b42
          speaker: penn
          text: 那么五年来，我每天都在拖累别人。照顾我的那个人是谁？
        - id: ch01-b43
          speaker: narrator
          text: 迪斯科抬手指向索尔特斯。
        - id: ch01-b44
          speaker: salters
          text: 你没拖累我！你挣来的钱，养活自己两回都有余。我还欠你钱呢，宾恩。这条船里我占四分之一，其中一半也该归你。那全是你该得的！
          emotion: sad
        - id: ch01-b45
          speaker: penn
          text: 你们都是好人，这一点我从你们脸上看得出来。
        - id: ch01-b46
          speaker: long_jack
          text: 慈悲的圣母啊，他跟咱们出了这么多趟海。这一回真像中了邪。
        - id: ch01-b47
          speaker: narrator
          text: 近旁响起另一条双桅船的铃。一个声音从雾里问迪斯科，听没听说《珍妮·库什曼号》的事。
        - id: ch01-b48
          speaker: penn
          text: 他们找到他的儿子了！你们只管站稳，看主怎样施行拯救！
        - id: ch01-b49
          speaker: disko
          text: 杰森在我们船上。真的没找到别人吗？
        - id: ch01-b50
          speaker: carrie_sailor
          text: 倒是捞到一个。他缠在一堆乱木头里，那也许原本是个艏楼，脑袋还破了点儿。
        - id: ch01-b51
          speaker: disko
          text: 那人是谁？
        - id: ch01-b52
          speaker: narrator
          text: 《我们在这儿号》上，一颗颗心跳得又重又急。
        - id: ch01-b53
          speaker: carrie_sailor
          text: 我猜是小奥利。
        - id: ch01-b54
          speaker: narrator
          text: 宾恩举起双手，用德语说了几句话。哈维几乎觉得，一轮明亮的太阳正照在那张仰起的脸上。可雾里的声音没有停。
        - id: ch01-b55
          speaker: carrie_sailor
          text: 喂，前天晚上，你们可把咱们损得不轻。
        - id: ch01-b56
          speaker: disko
          text: 现在谁也没心思损你们。
        - id: ch01-b57
          speaker: carrie_sailor
          text: 我明白。不过老实说，咱们撞见小奥利时，船正在……正在漂锚。
        - id: ch01-b58
          speaker: narrator
          text: 原来是那条无可救药的《凯丽·皮特曼号》。紧绷到极点的船员们顿时笑出了声，只是那笑声还有些发颤。
        - id: ch01-b59
          speaker: carrie_sailor
          text: 把老头送过来吧。我们正要回去添鱼饵和锚具，你们反正也留不住他。这该死的起锚绞盘害得我们缺人手，不过我们会照顾好他。他娶的是我女人的姨妈。
        - id: ch01-b60
          speaker: disko
          text: 船上不管什么东西，只要你开口，我都给你。
        - id: ch01-b61
          speaker: carrie_sailor
          text: 什么都不要。除非你们有一只真正抓得牢的锚。快把老头送来吧，小奥利越来越激动，已经不大听话了。
        - id: ch01-b62
          speaker: narrator
          text: 宾恩把杰森从绝望的麻木中唤醒，汤姆·普拉特划艇送他过去。老人一句谢也没说，因为他根本不知道对面等着自己的是什么，更不知道儿子还活着。小艇刚刚离开，浓雾便合拢过来，把人、船和水面全遮住了。
        - id: ch01-b63
          speaker: narrator
          text: 宾恩深吸一口气，连说了两次“而现在”，像要登坛布道。可他挺直的身子忽然一沉，好像一柄剑完全插回鞘中。眼里的亮光熄灭了，声音也恢复成平日怯弱的细声。
        - id: ch01-b64
          speaker: penn
          text: 索尔特斯先生，你觉得现在下一小盘跳棋，会不会太早？
        - id: ch01-b65
          speaker: salters
          text: 正合适！我刚才正想说这个。宾恩，你真有本事，总能猜到别人心里在想什么。
          emotion: happy
        - id: ch01-b66
          speaker: narrator
          text: 小个子红了脸，温顺地跟着索尔特斯走向船头。
        - id: ch01-b67
          speaker: disko
          text: 起锚！快一点！咱们离开这片发疯的海！
        - id: ch01-b68
          speaker: narrator
          text: 船员从没这样迅速地服从过。双桅船重新穿行在浓雾里，人人衣服湿透，身上不住滴水，心里也全是一团迷惑。等船重新稳稳向前，长杰克终于把大家都想问的话说了出来，这一切究竟算怎么回事。
        - id: ch01-b69
          speaker: disko
          text: 照我的琢磨，头一件事，是《珍妮·库什曼号》的惨事正好撞上宾恩空着肚子。
        - id: ch01-b70
          speaker: harvey
          text: 他还看见一个人从船边漂过去。
          emotion: sad
        - id: ch01-b71
          speaker: disko
          text: 对，还有这个。这一下像船搁浅似的，把他整个从水里掀了出来，掀回了约翰斯敦，也叫他想起雅各布·博伊勒那些旧事。后来，他安慰杰森，就像拿支柱顶住一条船，好歹撑了一阵。可他身子太弱，那些支柱一根根滑脱，他便顺着下水滑道溜回去。如今，他又漂在水上了。事情大概就是这样。
        - id: ch01-b72
          speaker: narrator
          text: 众人都认定，迪斯科说得一点不错。
        - id: ch01-b73
          speaker: long_jack
          text: 要是宾恩一直做雅各布·博伊勒，索尔特斯准会彻底垮掉。宾恩问这五年一直拖累谁时，你们看见索尔特斯的脸了吗？喂，索尔特斯，他现在怎么样？
        - id: ch01-b74
          speaker: salters
          text: 睡着了，睡得死沉，像个孩子一样倒头就睡。照理说，得等他醒了才有饭吃。你们见过这么会祈祷的人吗？他硬是把小奥利从海里拽出来了，我就是这么信。杰森太崇拜自己的儿子，我早疑心这场祸是他拜虚妄偶像招来的报应。
        - id: ch01-b75
          speaker: disko
          text: 也有别人一样死心眼。
        - id: ch01-b76
          speaker: salters
          text: 那不一样。宾恩的脑子还有缝没塞严实，我只是在尽自己的本分。
        - id: ch01-b77
          speaker: narrator
          text: 这群饿着肚子的人足足等了三个钟头。宾恩终于再露面时，脸色平静，脑中却一片空白。他说自己好像做了个梦，又问大家为什么全不说话。没有一个人能回答。
        - id: ch01-b78
          speaker: narrator
          text: 接下来三四天，迪斯科毫不留情地叫全船干活。能出小艇时，他们就去捕鱼。天气不许他们下船，他便赶众人进底舱，把船上的存货重新码紧，从舱房隔板一直堆到艏楼炉子后面的滑门，为以后捕到的鱼腾出更多地方。他还一点点教给两个男孩，装货是一门大学问。货物放在哪里，关系着双桅船吃水的深浅，也关系着它能不能跑出最好的状态。全船一直忙个不停，直到大家重新振作起来。
        - id: ch01-b79
          speaker: narrator
          text: 长杰克还拿绳头抽了哈维几下，说他为无法挽回的事愁得像只病猫。那些疲惫的日子里，哈维想了许多，也都说给丹听。丹全都赞成，甚至不再偷炸馅饼，改成直接向厨子讨了。
        - id: ch01-b80
          speaker: narrator
          text: 可才过一个星期，两人又险些掀翻《海蒂·S号》。他们把一把旧刺刀牢牢绑在棍子上，发疯似的去刺一条鲨鱼。那头阴沉的大家伙正贴着小艇磨蹭，张口讨小鱼吃。两个男孩、一条摇晃的小艇，再加上那条鲨鱼，三方胡闹到最后竟然都能活着脱身，实在是万幸。
        - id: ch01-b81
          speaker: narrator
          text: 他们又在雾里玩了好一阵蒙眼捉人。终于有一天早晨，迪斯科朝艏楼下面大喊。
        - id: ch01-b82
          speaker: disko
          text: 快点，小子们！咱们到镇上啦！
