  chapters:
    - id: ch01
      title: CHAPTER VII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The next day, more sails appeared. They all moved in a slow circle from east by north toward the west. The crew expected to reach the shoals near the Virgin, but the fog closed down first. The We're Here anchored among the faint bells of boats no one could see. Fishing was poor. Now and then, two dories found each other in the whiteness and traded news.
        - id: ch01-b02
          speaker: narrator
          text: A little before dawn that night, Dan and Harvey climbed out after sleeping most of the day. They went below to hook a few fried pies. They could have taken the pies openly, but stolen ones tasted better, and stealing them annoyed the cook. The heat and smell drove the boys back on deck with their loot. Disko stood ringing the bell. He passed it to Harvey.
        - id: ch01-b03
          speaker: disko
          text: Keep that bell sounding. I think I hear something. If there is trouble, I need my hands free to meet it.
        - id: ch01-b04
          speaker: narrator
          text: Harvey sent out a lonely little jingle. The heavy air seemed to cut each note short. Between strokes, he heard the muffled scream of a liner's siren. By now he knew enough about the Banks to understand the danger.
        - id: ch01-b05
          speaker: narrator
          text: He remembered with awful clearness the ignorant boy in the cherry-colored jersey who had once said it would be great fun if a steamer ran down a fishing boat. Harvey despised fancy blazers now, as any fisherman would. That foolish boy had slept in a stateroom with hot and cold water. Each morning, he had spent ten minutes choosing breakfast from a gilt-edged menu.
        - id: ch01-b06
          speaker: narrator
          text: But that boy seemed years older now. At four in the dim morning, he stood in streaming, crackling oilskins and hammered for dear life on a bell smaller than a steward's breakfast bell. Somewhere close by, a thirty-foot wall of steel was charging through the fog at twenty miles an hour. Worst of all, people slept in dry, cushioned cabins. They might never know they had crushed a boat before breakfast. Harvey kept ringing.
        - id: ch01-b07
          speaker: dan
          text: Oh, they slow down one whole turn of their blamed propeller to stay inside the law. That will be a comfort when we're all on the bottom. Listen to her! She's a monster!
        - id: ch01-b08
          speaker: narrator
          text: Dan blew Manuel's conch. The liner answered, “Aooo-whoo-whupp!” Harvey's bell went, “Wingle-tingle-tink,” and the conch cried, “Graaa-ouch!” Sea and sky were mixed together in milky fog.
        - id: ch01-b09
          speaker: narrator
          text: Then Harvey felt something moving beside him. He looked higher and higher. The wet edge of a bow towered like a cliff and seemed ready to leap straight over the schooner. A jaunty feather of water curled ahead of it. As the bow rose, a long ladder of Roman numerals appeared on its shining salmon-colored side. Fifteen, sixteen, seventeen, eighteen, and on they went.
        - id: ch01-b10
          speaker: narrator
          text: With a heart-stopping hiss, the bow tipped forward and down. The numbered ladder vanished. Brass-rimmed portholes flashed past. Steam puffed into Harvey's helplessly raised hands, and hot water roared along the rail of the We're Here. The little schooner staggered in water torn up by the liner's propeller. Then the great stern disappeared into the fog.
        - id: ch01-b11
          speaker: narrator
          text: Harvey was ready to faint, be sick, or both. A crack sounded in the distance, like a trunk dropped hard on a sidewalk. Then a faraway voice came thinly through the fog.
        - id: ch01-b12
          speaker: wrecked_sailor
          text: Heave to! You've sunk us!
          emotion: fearful
        - id: ch01-b13
          speaker: harvey
          text: Was that us?
          emotion: fearful
        - id: ch01-b14
          speaker: dan
          text: No. It's a boat out there. Keep ringing. We're going to find them.
        - id: ch01-b15
          speaker: narrator
          text: Dan ran out a dory. Within half a minute, everyone but Harvey, Penn, and the cook had gone over the side. Soon the broken stump of a schooner's foremast drifted past the bow. An empty green dory followed and knocked against the We're Here as if it wanted to be taken aboard.
        - id: ch01-b16
          speaker: narrator
          text: Next came something in a blue jersey, floating face down. It was not a whole man. Penn went pale and caught his breath with a click. Harvey beat desperately on the bell. Another ship might sink them at any moment. When Dan hailed from the returning dory, Harvey jumped.
        - id: ch01-b17
          speaker: dan
          text: It was the Jennie Cushman. The liner cut her in two, then ground her down and trampled her. It happened less than a quarter mile away. Dad found the old man. There's nobody else, and his son was aboard too. Oh, Harve, I can't bear it. I saw—
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: Dan dropped his head on his arms and sobbed. The others hauled a gray-haired man onto the schooner.
        - id: ch01-b19
          speaker: jason_olley
          text: Why did you pull me out? Disko, why couldn't you leave me there?
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: Disko put a heavy hand on Jason's shoulder. The man's eyes were wild. His lips shook while he stared at the silent crew. Then Pennsylvania Pratt stepped forward. Uncle Salters sometimes called him Haskins or Rich or McVitty, but now the foolish look had left his face. He looked like an old and wise man, and his voice rang strong.
        - id: ch01-b21
          speaker: penn
          text: The Lord gave, and the Lord has taken away. Blessed be the name of the Lord. I was a minister of the Gospel. I am a minister. Leave this man with me.
        - id: ch01-b22
          speaker: jason_olley
          text: A minister, are you? Then pray my son back to me! Pray back my nine-thousand-dollar boat and a thousand quintals of fish. If you had left me alone, my widow could have gone to the Provident and worked for her meals. She never would have known. Now I have to tell her. I have to tell her.
          emotion: angry
        - id: ch01-b23
          speaker: disko
          text: There isn't anything anyone can say. Lie down awhile, Jason Olley.
        - id: ch01-b24
          speaker: narrator
          text: A man had lost his only son, his whole summer's work, and his way of earning a living in thirty counted seconds. No comfort could reach him.
        - id: ch01-b25
          speaker: tom_platt
          text: The crew were all Gloucester men, weren't they?
        - id: ch01-b26
          speaker: narrator
          text: Tom Platt fingered a loop of rope on the dory and did not know what else to do.
        - id: ch01-b27
          speaker: jason_olley
          text: That makes no difference now. This fall I'll be rowing summer visitors around East Gloucester.
        - id: ch01-b28
          speaker: narrator
          text: Jason wrung seawater from his beard. Then he rolled heavily toward the rail and began to sing.
        - id: ch01-b29
          speaker: jason_olley
          text: Happy birds that sing and fly around Your altars, O Most High!
          emotion: sad
        - id: ch01-b30
          speaker: penn
          text: Come with me. Come below.
        - id: ch01-b31
          speaker: narrator
          text: Penn spoke like a man who had the right to command. For a quarter of a minute, the two men stared at each other and fought without a word.
        - id: ch01-b32
          speaker: jason_olley
          text: I don't know who you are, but I'll go with you. Maybe I can get back some of it. Maybe some of those nine thousand dollars.
        - id: ch01-b33
          speaker: narrator
          text: Jason gave in. Penn led him into the cabin and slid the door shut.
        - id: ch01-b34
          speaker: uncle_salters
          text: That isn't Penn! That's Jacob Boiler, and he remembers Johnstown! I never saw eyes like that in any living man's head. What happens now? What am I supposed to do?
          emotion: fearful
        - id: ch01-b35
          speaker: narrator
          text: Penn's voice and Jason's rose together behind the door. Then only Penn spoke. Salters took off his hat, because Penn was praying. At last the little man climbed the steps. Great drops of sweat covered his face as he looked around at the crew. Dan was still sobbing beside the wheel.
        - id: ch01-b36
          speaker: uncle_salters
          text: He doesn't know any of us. We'll have to begin all over again, even the checkers. What will he say when he sees me?
          emotion: fearful
        - id: ch01-b37
          speaker: narrator
          text: Penn answered him, but he spoke as if every face there belonged to a stranger.
        - id: ch01-b38
          speaker: penn
          text: I have prayed. My people believe in prayer. I prayed that this man's son would live. My own family drowned before my eyes. My wife, my eldest, and the others. Is any man wiser than his Maker? I did not pray for their lives, but I have prayed for this man's son. His son will surely be returned to him.
        - id: ch01-b39
          speaker: narrator
          text: Salters searched Penn's face for any sign that he remembered him.
        - id: ch01-b40
          speaker: penn
          text: How long have I been mad?
        - id: ch01-b41
          speaker: narrator
          text: Penn's mouth twitched.
        - id: ch01-b42
          speaker: uncle_salters
          text: Nonsense, Penn. You were never mad. You were only a little troubled and confused.
        - id: ch01-b43
          speaker: penn
          text: I saw the houses strike the bridge before the fires started. After that, I remember nothing. How long ago did it happen?
        - id: ch01-b44
          speaker: dan
          text: I can't bear any more! I can't!
          emotion: sad
        - id: ch01-b45
          speaker: narrator
          text: Harvey whimpered with him.
        - id: ch01-b46
          speaker: disko
          text: About five years ago.
          emotion: sad
        - id: ch01-b47
          speaker: penn
          text: Then someone has carried me every day for five years. Who was it?
        - id: ch01-b48
          speaker: narrator
          text: Disko pointed toward Salters.
        - id: ch01-b49
          speaker: uncle_salters
          text: No, I haven't! You've earned your keep twice over. I owe you money besides, and half of my quarter-share in this boat belongs to you. You've paid its value fair and square.
        - id: ch01-b50
          speaker: penn
          text: You are good men. I can read that in your faces. But—
        - id: ch01-b51
          speaker: long_jack
          text: Mother of Mercy, he's sailed with us on every one of these trips! The poor man is bewitched clean through.
        - id: ch01-b52
          speaker: narrator
          text: A schooner's bell began ringing close beside them. A voice called through the fog.
        - id: ch01-b53
          speaker: carrie_pitman_sailor
          text: Disko! Have you heard about the Jennie Cushman?
        - id: ch01-b54
          speaker: penn
          text: They have found his son. Stand still and see the salvation of the Lord!
        - id: ch01-b55
          speaker: disko
          text: We have Jason aboard. Was there truly no one else?
        - id: ch01-b56
          speaker: narrator
          text: Disko's voice shook.
        - id: ch01-b57
          speaker: carrie_pitman_sailor
          text: We found one man. He was tangled in wreckage that might have been the forecastle. His head is cut a little.
        - id: ch01-b58
          speaker: disko
          text: Who did you find?
        - id: ch01-b59
          speaker: narrator
          text: Every heart aboard the We're Here seemed to beat out the answer.
        - id: ch01-b60
          speaker: carrie_pitman_sailor
          text: We reckon it's young Olley.
        - id: ch01-b61
          speaker: narrator
          text: Penn lifted his hands and spoke a few words in German. Harvey could have sworn that bright sunlight shone across Penn's raised face. But the sailor's drawl went on.
        - id: ch01-b62
          speaker: carrie_pitman_sailor
          text: Say, you fellows fooled us pretty well the other night.
        - id: ch01-b63
          speaker: disko
          text: Nobody here feels much like fooling now.
        - id: ch01-b64
          speaker: carrie_pitman_sailor
          text: I know. To tell the truth, we were drifting a little when we ran into young Olley.
        - id: ch01-b65
          speaker: narrator
          text: The voice belonged to someone aboard the impossible Carrie Pitman. Unsteady laughter burst across the deck of the We're Here.
        - id: ch01-b66
          speaker: carrie_pitman_sailor
          text: You might as well send the old man over. We're heading in for more bait and ground tackle. You don't need him here, and this blamed windlass work has left us short-handed. We'll look after him. He married my wife's aunt.
        - id: ch01-b67
          speaker: disko
          text: I'll give you anything aboard this boat.
        - id: ch01-b68
          speaker: carrie_pitman_sailor
          text: We don't want anything. Well, maybe an anchor that actually holds. Listen, young Olley is getting stubborn and excited. Send his father along.
        - id: ch01-b69
          speaker: narrator
          text: Penn woke Jason from his numb despair, and Tom Platt rowed him across. Jason left without one word of thanks. He had no idea what waited for him on the other schooner. The fog closed behind the dory and hid everything.
        - id: ch01-b70
          speaker: penn
          text: And now... and now...
        - id: ch01-b71
          speaker: narrator
          text: Penn drew a deep breath as though he were about to preach. Then his straight body folded, like a sword sliding home into its scabbard. The light left his shining eyes. His voice became the same poor little titter the crew knew.
        - id: ch01-b72
          speaker: penn
          text: And now, Mr. Salters, do you suppose it is too early for a game of checkers?
        - id: ch01-b73
          speaker: uncle_salters
          text: That's exactly what I was about to suggest. Penn, it beats everything how you know what's in a man's mind.
          emotion: happy
        - id: ch01-b74
          speaker: narrator
          text: Penn blushed. Meekly, he followed Salters toward the bow.
        - id: ch01-b75
          speaker: disko
          text: Get the anchor up! Hurry! Let's leave these crazy waters!
        - id: ch01-b76
          speaker: narrator
          text: The crew had never obeyed Disko faster.
        - id: ch01-b77
          speaker: long_jack
          text: Now what in creation do you make of all that?
        - id: ch01-b78
          speaker: narrator
          text: The We're Here moved on through the fog. Everyone aboard was damp, dripping, and bewildered.
        - id: ch01-b79
          speaker: disko
          text: Here's how I understand it. The Jennie Cushman disaster struck Penn on an empty stomach—
        - id: ch01-b80
          speaker: harvey
          text: He saw part of one of those men drift by.
          emotion: sad
        - id: ch01-b81
          speaker: disko
          text: Yes. That knocked him out of his present mind, like running a boat ashore. It threw him back into remembering Johnstown and Jacob Boiler and all those old things. Then comforting Jason held him up for a while, the way timbers shore up a boat. But Penn was weak. Those supports slipped away, one after another. He slid down the ways, and now he's afloat again. That's how I see it.
        - id: ch01-b82
          speaker: narrator
          text: The others decided Disko had explained it exactly.
        - id: ch01-b83
          speaker: long_jack
          text: It would have broken Salters apart if Penn had stayed Jacob Boiler. Did you see Salters when Penn asked who had supported him all those years? Well, Salters, how is he now?
        - id: ch01-b84
          speaker: uncle_salters
          text: Asleep. Sound asleep. He turned in like a child.
        - id: ch01-b85
          speaker: narrator
          text: Salters came aft on tiptoe.
        - id: ch01-b86
          speaker: uncle_salters
          text: Nobody gets food until he wakes up on his own. Did you ever hear anyone pray like that? Penn hauled young Olley straight out of the ocean. That's what I believe. Jason was terribly proud of that boy. I suspected all along he'd be judged for worshiping a false idol.
        - id: ch01-b87
          speaker: disko
          text: Other men can be just as fixed on one person.
        - id: ch01-b88
          speaker: uncle_salters
          text: That's different. Penn isn't quite sound, and I'm only doing my duty by him.
        - id: ch01-b89
          speaker: narrator
          text: Hungry as they were, the men waited three hours. At last Penn came back with his face peaceful and his mind empty. He thought he had been dreaming. Then he asked why everyone was so quiet, and not one of them could tell him.
        - id: ch01-b90
          speaker: narrator
          text: For the next three or four days, Disko worked every man without mercy. Whenever the fog kept them from fishing, he sent them into the hold. They packed the stores into less space so there would be more room for fish. The tight mass reached from the cabin wall to the sliding door behind the forecastle stove. Disko taught them that stowing cargo was an art. Everything had to sit just right if the schooner was to ride at her best depth.
        - id: ch01-b91
          speaker: narrator
          text: All that work kept the crew moving until their spirits returned. Long Jack flicked Harvey with the end of a rope for looking, as he put it, as sorrowful as a sick cat over something no one could change. During those tiring days, Harvey did a great deal of thinking. He told Dan his thoughts, and Dan agreed. The boys even went so far as to ask for fried pies instead of hooking them.
        - id: ch01-b92
          speaker: narrator
          text: A week later, though, Harvey and Dan nearly overturned the Hattie S. They had tied an old bayonet to a stick and were trying wildly to stab a shark. The grim creature rubbed along the dory and begged for small fish. With the shark and both boys all struggling together, it was a mercy that the three of them escaped alive.
        - id: ch01-b93
          speaker: narrator
          text: At last, after days of playing blindman's buff in the fog, a morning came when Disko shouted down into the forecastle.
        - id: ch01-b94
          speaker: disko
          text: Hurry up, boys! We're in town!
