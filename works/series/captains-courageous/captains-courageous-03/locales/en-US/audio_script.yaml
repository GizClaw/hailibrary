  chapters:
    - id: ch01
      title: CHAPTER III
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Harvey slept as if he had sunk forty fathoms deep, and woke with clear eyes and a fierce hunger. He and Dan finished a great tin dish of juicy fish scraps the cook had saved overnight. Then came the chores. They cleared the older men's plates and pans while the fishermen were away, cut pork for dinner, scrubbed the forecastle, filled the lamps, fetched coal and water, and explored the forward hold where the stores were kept. The day was soft, mild, and clear. Harvey drew the clean air all the way into his lungs.
        - id: ch01-b02
          speaker: narrator
          text: More schooners had slipped in during the night. Sails and dories dotted the long blue sea. Far off, the smoke of an unseen liner marked the horizon. To the east, the highest sails of a large ship cut a square notch in the blue. Disko Troop smoked beside the cabin roof. One eye watched the boats around him, and the other watched the little wind vane at the mainmast head.
        - id: ch01-b03
          speaker: dan
          text: When Dad gets all tied up in his thoughts like that, he's thinking for the whole crew. I'll bet my wages and my share that we'll choose our fishing ground soon. Dad knows cod, and the Fleet knows he knows. See those boats coming closer one by one? They're pretending they don't want anything, but they're watching us every minute. That one's the Prince Leboo from Chatham. She crept up last night. The big one with the patched foresail and new jib is the Carrie Pitman from West Chatham. She won't keep that canvas long unless her luck has changed. Mostly she just drifts. No anchor ever made can hold her. Look at Dad's smoke. When it comes out in little rings, he's studying the fish. Don't speak to him now. The last time I did, he threw a boot at me.
        - id: ch01-b04
          speaker: narrator
          text: Disko stared ahead with the pipe between his teeth, though his eyes seemed to see nothing. He was matching all his years on the Banks against the wandering cod in their own sea. The curious schooners were a compliment to his skill, but he wanted to slip away from them and find a berth alone. Later they would go up to the Virgin and fish among the boats in that roaring town on the water. For an hour he considered weather, gales, currents, food, and every other concern as a twenty-pound cod might consider them. He became a cod in his mind, and even looked rather like one. At last he took the pipe from his mouth.
        - id: ch01-b05
          speaker: dan
          text: Dad, our chores are done. Can we go over the side for a while? It's fine weather for catching.
        - id: ch01-b06
          speaker: disko
          text: Not while he's wearing that cherry-colored outfit and those half-baked brown shoes. Find him something fit to fish in.
        - id: ch01-b07
          speaker: dan
          text: Dad's pleased. That settles it. He keeps my spare clothes where he can inspect them, because Ma says I'm careless.
        - id: ch01-b08
          speaker: narrator
          text: Disko tossed a key down the cabin steps, and Dan dragged Harvey below. He dug through a locker. In less than three minutes Harvey wore rubber fishing boots that reached halfway up his thighs, a heavy blue jersey patched at the elbows, woolen hand guards called nippers, and a sou'wester.
        - id: ch01-b09
          speaker: dan
          text: Now you look something like a fisherman. Hurry!
        - id: ch01-b10
          speaker: disko
          text: Stay close and handy. Don't go visiting around the Fleet. If anyone asks what I plan to do, tell the truth. You don't know.
        - id: ch01-b11
          speaker: narrator
          text: A small red dory named Hattie S. floated behind the schooner. Dan pulled her close and dropped neatly onto the bottom boards. Harvey tumbled in after him.
        - id: ch01-b12
          speaker: dan
          text: That's no way to enter a boat. If there were any sea running, you'd go straight to the bottom. You have to learn to move with her.
        - id: ch01-b13
          speaker: narrator
          text: Dan set the tholepins, sat on the forward thwart, and watched Harvey row. Harvey had handled light oars on the Adirondack ponds, in a very delicate fashion. Stubby eight-foot sea oars in balanced rowlocks were another matter. They caught in the gentle swell, and Harvey grunted over them.
        - id: ch01-b14
          speaker: dan
          text: Short strokes! Keep them short. Jam an oar in any sort of sea and you might roll the boat over. Isn't she a beauty? She's mine, too.
        - id: ch01-b15
          speaker: narrator
          text: The dory was spotless. A tiny anchor lay in the bow beside two water jugs and seventy fathoms of thin brown anchor line. Near Harvey's right hand were a tin dinner horn, a heavy wooden mallet, a short gaff, and an even shorter stick. Two fishing lines, each fitted with heavy sinkers and double cod hooks, sat neatly wound on square reels by the gunwale.
        - id: ch01-b16
          speaker: harvey
          text: Where are the sail and mast?
        - id: ch01-b17
          speaker: narrator
          text: His hands were already beginning to blister. Dan chuckled.
        - id: ch01-b18
          speaker: dan
          text: Fishing dories don't do much sailing. You row them, though you don't need to pull so hard. Don't you wish this one belonged to you?
        - id: ch01-b19
          speaker: harvey
          text: I suppose my father might give me one or two if I asked.
        - id: ch01-b20
          speaker: narrator
          text: Until then, Harvey had been too busy to think much about his family.
        - id: ch01-b21
          speaker: dan
          text: That's right. I forgot your father's a millionaire. You don't seem much like one yourself now. A dory with all her gear costs a pile, though. Would your father give you one just to keep as a pet?
        - id: ch01-b22
          speaker: harvey
          text: Probably. It may be the only thing I haven't asked him for yet.
        - id: ch01-b23
          speaker: dan
          text: You must cost plenty to keep at home. Don't slide around that way, Harve. Short strokes are the trick. The sea is never perfectly still, and the swells will—
        - id: ch01-b24
          speaker: narrator
          text: Crack! The handle of an oar kicked Harvey under the chin and knocked him backward.
        - id: ch01-b25
          speaker: dan
          text: That's what I was about to tell you. I had to learn too, but I got my lesson when I was eight.
        - id: ch01-b26
          speaker: narrator
          text: Harvey sat up again with an aching jaw and a scowl.
        - id: ch01-b27
          speaker: dan
          text: Dad says there's no use getting angry at things. If we can't handle them, that's our fault. Let's try here. Manuel will tell us the depth.
        - id: ch01-b28
          speaker: narrator
          text: Manuel's dory rocked nearly a mile away. Dan stood an oar upright, and Manuel answered by waving his left arm three times.
        - id: ch01-b29
          speaker: dan
          text: Thirty fathoms. Put the sinkers over. Bait your hook the way I do, Harvey, and don't tangle your reel.
        - id: ch01-b30
          speaker: narrator
          text: Dan threaded a salted clam onto his hook and had his line down long before Harvey worked out how to bait his hooks and cast the heavy leads. The dory drifted gently. There was no reason to anchor until they knew the ground held fish.
        - id: ch01-b31
          speaker: dan
          text: Here he comes! The muckle, Harvey! It's under your hand. Quick!
        - id: ch01-b32
          speaker: narrator
          text: Spray struck Harvey's shoulders as a large cod beat the water beside them. Harvey knew the muckle could not be the dinner horn, so he handed Dan the mallet. Dan stunned the cod, hauled it aboard, and freed the hook with the short wooden gob-stick. Then Harvey felt a pull on his own line and eagerly hauled it up.
        - id: ch01-b33
          speaker: harvey
          text: Why, they're strawberries! Look at them!
        - id: ch01-b34
          speaker: narrator
          text: His hook had caught a cluster of things shaped exactly like strawberries, red on one side and white on the other. They had no leaves, and their stems were hollow and slimy.
        - id: ch01-b35
          speaker: dan
          text: Don't touch them! Knock them off. Don't—
        - id: ch01-b36
          speaker: narrator
          text: The warning came too late. Harvey picked them off the hook to admire them.
        - id: ch01-b37
          speaker: harvey
          text: Ouch! My fingers are stinging!
          emotion: surprised
        - id: ch01-b38
          speaker: narrator
          text: His fingers throbbed as if he had grabbed a fistful of nettles.
        - id: ch01-b39
          speaker: dan
          text: Now you know why they call it strawberry bottom. Dad says you never touch anything but fish with bare fingers. Knock those against the gunwale and bait again. Staring won't earn you anything. It's all part of your wages.
        - id: ch01-b40
          speaker: narrator
          text: Harvey smiled when he remembered his ten and a half dollars a month. He wondered what his mother would say if she could see him leaning from a fishing dory in the middle of the ocean. She suffered terribly whenever he went onto Saranac Lake, and he had always laughed at her fears. Then his line shot through his hands, stinging him even through the woolen nippers.
        - id: ch01-b41
          speaker: dan
          text: He's a slow, heavy one. Give him line to match his strength. I'll help you.
        - id: ch01-b42
          speaker: harvey
          text: No, you won't. He's my first fish. Is he a whale?
        - id: ch01-b43
          speaker: narrator
          text: Harvey clung to the line. Dan looked down through the green water and raised the muckle, ready for whatever appeared. A white oval shape flickered below them.
        - id: ch01-b44
          speaker: dan
          text: Maybe a halibut. I'll bet my wages and share that he's more than a hundred pounds. Do you still insist on bringing him in alone?
        - id: ch01-b45
          speaker: narrator
          text: Harvey's knuckles were scraped raw and bleeding from striking the gunwale. Effort and excitement had turned his face purple-blue. Sweat ran from him, and the bright ripples around the racing line nearly blinded him. Both boys were tired long before the halibut was. For twenty minutes the great flat fish controlled them and the dory. At last they gaffed it and dragged it in.
        - id: ch01-b46
          speaker: dan
          text: Beginner's luck. He weighs every bit of a hundred pounds.
        - id: ch01-b47
          speaker: narrator
          text: Harvey gazed at the huge gray, mottled creature with a pride too great for words. He had often seen halibut lying on marble counters ashore, but he had never wondered how they reached the shops. Now he knew, and every part of him ached from finding out.
        - id: ch01-b48
          speaker: dan
          text: If Dad were here, he'd read these signs like print. The fish keep getting smaller, and that may be the slowest halibut we'll see this trip. Yesterday we caught only big fish and no halibut. Dad would understand it at once. He says everything on the Banks is a sign, and a man can read it right or wrong. Dad's deeper than the Whale-hole.
        - id: ch01-b49
          speaker: narrator
          text: A pistol cracked aboard the We're Here, and a potato basket rose into the forward rigging.
        - id: ch01-b50
          speaker: dan
          text: What did I tell you? That's the signal for everyone to come back. Dad has found something, or he'd never stop us fishing now. Wind your line, Harve. We'll row in.
        - id: ch01-b51
          speaker: narrator
          text: They were upwind of the schooner and ready to send the dory dancing over the quiet sea when mournful sounds came from half a mile away. Penn was racing in circles around one fixed spot like a huge water bug. He rowed backward, charged forward with all his strength, and ended each attempt with his dory swinging around and jerking tight against her rope.
        - id: ch01-b52
          speaker: dan
          text: We'll have to help him, or he'll take root and grow here.
        - id: ch01-b53
          speaker: harvey
          text: What's wrong with him?
        - id: ch01-b54
          speaker: narrator
          text: Harvey had entered a world where he could no longer order older people about. He had to ask his questions humbly, while the enormous sea remained calm and unconcerned.
        - id: ch01-b55
          speaker: dan
          text: His anchor's caught. Penn is always losing anchors. He's lost two already this trip, even on sandy ground. Dad says if he loses the next one, he'll get a kelleg. That would break his heart.
        - id: ch01-b56
          speaker: harvey
          text: What's a kelleg?
        - id: ch01-b57
          speaker: narrator
          text: Harvey imagined it might be some dreadful punishment from the sea stories, like dragging a man under a ship.
        - id: ch01-b58
          speaker: dan
          text: A big stone instead of an anchor. You can spot a kelleg in a dory from far away, and the whole Fleet knows what it means. They'd tease him without mercy. Penn couldn't bear that. It would be like tying a tin dipper to a dog's tail. Hello, Penn! Caught again? Stop trying your inventions. Get directly over the anchor and keep your line straight up and down.
        - id: ch01-b59
          speaker: penn
          text: It won't move. It simply won't move, though I've tried everything.
        - id: ch01-b60
          speaker: dan
          text: What's that terrible nest of a mess in your bow?
        - id: ch01-b61
          speaker: narrator
          text: Spare oars and anchor line were twisted together there in a wild tangle made by inexperienced hands.
        - id: ch01-b62
          speaker: penn
          text: Oh, that is a Spanish windlass. Mr. Salters taught me to make one. But even the windlass won't move the anchor.
        - id: ch01-b63
          speaker: narrator
          text: Penn sounded proud of it. Dan bent low over the gunwale to hide his smile. He gave the anchor line one or two small twitches, and the anchor lifted at once.
        - id: ch01-b64
          speaker: dan
          text: Pull it up, Penn, before it catches again.
        - id: ch01-b65
          speaker: narrator
          text: Dan laughed as he spoke. The boys rowed away, leaving Penn to stare with large, sad blue eyes at the weedy flukes and thank them again and again.
        - id: ch01-b66
          speaker: dan
          text: While I remember, Harve, Penn isn't quite sound in his head. He isn't dangerous at all, but his mind gave way. Understand?
        - id: ch01-b67
          speaker: harvey
          text: Is that true, or is it another of your father's judgments?
        - id: ch01-b68
          speaker: narrator
          text: Harvey bent over his oars. He was already handling them with more ease.
        - id: ch01-b69
          speaker: dan
          text: Dad is right this time. Penn really has lost his mind. Well, not exactly. He's more like a harmless simple man. You ought to know why. Dad told me Penn used to be a Moravian preacher named Jacob Boiler. He lived somewhere in Pennsylvania with his wife and four children. He took them to a Moravian camp meeting, I think, and they spent just one night in Johnstown. Have you heard of Johnstown?
        - id: ch01-b70
          speaker: harvey
          text: Yes, though I don't remember why. The name stays in my head, the way Ashtabula does.
        - id: ch01-b71
          speaker: dan
          text: Both places had terrible disasters. That very night, while Penn and his family were at the hotel, Johnstown was destroyed. A dam broke and flooded the town. Houses tore loose, crashed together, and sank. I've seen pictures, and they're dreadful. Penn watched his whole family drown before he understood what was happening. After that, his mind failed. He knew something had happened in Johnstown, but he couldn't remember what it was. He wandered around, smiling and wondering. He no longer knew who he was or what he had been.
        - id: ch01-b72
          speaker: dan
          text: Then he happened to meet Uncle Salters in Allegheny City. Half of Ma's family is scattered through Pennsylvania, and Uncle Salters visits them in winter. He understood what was wrong with Penn. He more or less adopted him, brought him east, and gave him work on his farm.
        - id: ch01-b73
          speaker: harvey
          text: Last night, when the boats struck each other, I heard Uncle Salters call Penn a farmer. Is your uncle a farmer too?
        - id: ch01-b74
          speaker: dan
          text: Is he a farmer? There isn't enough water between here and Cape Hatteras to wash the field dirt off his boots. He's a farmer through and through. I've seen him hang up a bucket near sunset and fiddle with the water-barrel tap as if he were milking a cow. That's how much of a farmer he is.
        - id: ch01-b75
          speaker: dan
          text: He and Penn ran a farm near Exeter. This spring Uncle Salters sold it for a lot of money to a Boston fellow who wanted a summer house. The two of them managed together until Penn's old Moravian church discovered where he had gone and wrote to Uncle Salters. I never heard exactly what the letter said, but Uncle Salters was furious. He's mostly an Episcopalian, but he fired back at those Moravians like a Baptist. He said he would not surrender Penn to any Moravian relations in Pennsylvania or anywhere else.
        - id: ch01-b76
          speaker: dan
          text: Two trips ago, he came to Dad with Penn in tow and said they both needed a fishing voyage for their health. Maybe he thought the Moravians wouldn't search the Banks for Jacob Boiler. Dad agreed. Uncle Salters had fished on and off for thirty years whenever he wasn't inventing special fertilizers, and he bought a quarter share in the We're Here. The trip helped Penn so much that Dad kept bringing him. Dad says Penn may remember his wife, his children, and Johnstown someday. If he does, Dad thinks he may die. Never mention Johnstown or anything like it to Penn, or Uncle Salters will throw you overboard.
        - id: ch01-b77
          speaker: harvey
          text: Poor Penn. From the way they act together, I never would have guessed Uncle Salters cared about him.
          emotion: sad
        - id: ch01-b78
          speaker: dan
          text: I like Penn. We all do. We should have towed him, but I wanted to tell you this first.
        - id: ch01-b79
          speaker: narrator
          text: They were close to the schooner now, with the other dories a little way behind them.
        - id: ch01-b80
          speaker: disko
          text: Leave the dories in the water until after dinner. We'll clean the fish right away. Boys, set the table!
        - id: ch01-b81
          speaker: dan
          text: Deeper than the Whale-deep. Look at all the boats that have edged closer since morning. They're waiting for Dad. Do you see them, Harve?
        - id: ch01-b82
          speaker: harvey
          text: They all look the same to me.
        - id: ch01-b83
          speaker: narrator
          text: To someone from shore, the nodding schooners did seem to have come from one mold.
        - id: ch01-b84
          speaker: dan
          text: They aren't the same. That dirty yellow one with her bowsprit tilted up is the Hope of Prague. Her skipper is Nick Brady, the meanest man on the Banks. We'll tell him so when we reach the Main Ledge. Far over there is the Day's Eye, owned by the two Jeraulds. She's from Harwich, fairly fast, and lucky. But Dad could find fish in a graveyard. Those three together are the Margie Smith, the Rose, and the Edith S. Walen. They're all from home. I suppose we'll see the Abbie M. Deering tomorrow, Dad. They're moving over from the shoal of Oueereau, aren't they?
        - id: ch01-b85
          speaker: disko
          text: You won't see many boats tomorrow, Danny. Boys, it's too crowded here. We'll leave them to use big bait and catch little fish.
        - id: ch01-b86
          speaker: narrator
          text: When Disko called his son Danny, everyone knew he was pleased. The crew climbed aboard, and he studied the fish in the pen. They were strangely small and even in size. Except for Harvey's halibut, not one fish on deck weighed more than fifteen pounds.
        - id: ch01-b87
          speaker: disko
          text: I'm waiting on the weather.
        - id: ch01-b88
          speaker: long_jack
          text: Then you'll have to make the weather yourself, Disko. I can't see a sign of it anywhere.
        - id: ch01-b89
          speaker: narrator
          text: Yet half an hour later, while they cleaned the catch, the Bank fog fell between one fish and the next. It swept over the colorless water in steady, curling wreaths. Every man stopped work without a word. Long Jack and Uncle Salters set the windlass brakes and began raising the anchor. The windlass jarred as the wet hemp cable tightened around its barrel. Manuel and Tom Platt helped with the final pull. The anchor came free with a sob. Disko took the wheel, and the riding sail filled.
        - id: ch01-b90
          speaker: disko
          text: Raise the jib and foresail.
        - id: ch01-b91
          speaker: long_jack
          text: Leave the rest of them in this smother!
        - id: ch01-b92
          speaker: narrator
          text: Long Jack made the jib sheet fast while the others hauled up the clattering foresail rings. The forward boom groaned. The We're Here turned into the wind and plunged away through the blank, spinning whiteness.
        - id: ch01-b93
          speaker: disko
          text: There's wind behind this fog.
        - id: ch01-b94
          speaker: narrator
          text: Harvey thought it was all more wonderful than words could say. Most wonderful of all, the crew needed almost no orders. Now and then Disko gave a grunt and ended with a quiet word of approval.
        - id: ch01-b95
          speaker: disko
          text: That's good, my son.
        - id: ch01-b96
          speaker: tom_platt
          text: Never watched an anchor come up before?
        - id: ch01-b97
          speaker: narrator
          text: Harvey was staring at the wet foresail.
        - id: ch01-b98
          speaker: harvey
          text: No. Where are we going?
        - id: ch01-b99
          speaker: tom_platt
          text: To find fish and choose a berth. You'll understand before you've spent a week aboard. Everything's new to you, but none of us knows what may happen next. Take me, Tom Platt. I never expected—
        - id: ch01-b100
          speaker: disko
          text: It's better than fourteen dollars a month and a bullet in your belly. Ease that jumbo a little.
        - id: ch01-b101
          speaker: narrator
          text: Tom adjusted the large jib with the wooden spar tied to it.
        - id: ch01-b102
          speaker: tom_platt
          text: Better in dollars and cents, maybe. We didn't think about money when we worked the windlass brakes on the Miss Jim Buck outside Beaufort Harbor. Fort Macon was firing hot shot at our stern, and a living gale was blowing over us. Where were you then, Disko?
        - id: ch01-b103
          speaker: disko
          text: Right here, or somewhere close. I was earning my bread on deep water and dodging Confederate privateers. I'm sorry I can't provide hot shot for you, Tom Platt, but I expect we'll find enough wind before we see Eastern Point.
        - id: ch01-b104
          speaker: narrator
          text: Water slapped and chattered without stopping at the bow. Every so often came a heavy thud, followed by spray rattling onto the forecastle. Cold drops gathered on the rigging. The men rested along the sheltered side of the cabin, except for Uncle Salters. He sat stiffly on the main hatch, nursing his stinging hands.
        - id: ch01-b105
          speaker: disko
          text: I believe she'd carry the staysail.
        - id: ch01-b106
          speaker: uncle_salters
          text: She wouldn't carry it to any profit. What's the sense in wearing out good canvas?
        - id: ch01-b107
          speaker: narrator
          text: The wheel shifted so slightly in Disko's hands that no one would have noticed. A moment later, the crest of a hissing wave cut across the deck. It struck Uncle Salters between the shoulders and soaked him from head to foot. He jumped up sputtering and went forward, only to meet another wave.
        - id: ch01-b108
          speaker: dan
          text: Watch Dad chase him around the deck. Uncle Salters thinks his quarter share means he owns all our canvas. Dad has played this soaking game with him for two trips now. There! That one caught him where he eats.
        - id: ch01-b109
          speaker: narrator
          text: Uncle Salters took shelter beside the foremast. Another wave slapped him across the knees. Disko kept a face as blank as the wheel itself.
        - id: ch01-b110
          speaker: disko
          text: She might ride more easily under the staysail, Salters.
        - id: ch01-b111
          speaker: uncle_salters
          text: Then set your old rag! Just don't blame me if anything happens. Penn, go below and get your coffee. You ought to know better than to hang around on deck in this weather.
          emotion: angry
        - id: ch01-b112
          speaker: narrator
          text: Uncle Salters hurried Penn into the forward cabin.
        - id: ch01-b113
          speaker: dan
          text: Now they'll drink coffee and play checkers forever. It looks as if the rest of us may be idle for a while too. Nothing on earth is lazier than a Banker when she isn't over fish.
        - id: ch01-b114
          speaker: long_jack
          text: I'm glad you reminded me, Danny. I'd forgotten we had a passenger under that dockside hat. A man who doesn't know his ropes has no time to be idle. Hand him over, Tom Platt, and we'll teach him.
        - id: ch01-b115
          speaker: dan
          text: It's not my turn. You'll have to teach him yourself. Dad taught me with the end of a rope.
        - id: ch01-b116
          speaker: narrator
          text: For the next hour, Long Jack marched Harvey up and down the deck. He taught him what every sailor must know even when blind, drunk, or asleep. A seventy-ton schooner with a short foremast did not carry much rigging, but Long Jack knew how to make each lesson memorable. To point out the peak halyards, he pressed his knuckles into the back of Harvey's neck and held his gaze upward. To explain forward and aft, he rubbed Harvey's nose along the boom. Each rope's lead was fixed in Harvey's memory by a sharp touch from that rope's end.
        - id: ch01-b117
          speaker: narrator
          text: The lesson would have been easier on a clear deck, but everything aboard had a place except a man. Forward were the windlass, chain, and thick cables waiting to trip him. Nearby stood the forecastle stovepipe and the barrels for fish livers. Farther aft, the foreboom and main hatch filled most of the space left by the pumps and fish-cleaning pens. Then came the stacked dories, tied down by the quarterdeck, and the cabin with tubs and loose gear lashed all around it. Last came the sixty-foot main boom resting in its crutch. It divided the deck from end to end and forced Harvey to duck under it at every turn.
        - id: ch01-b118
          speaker: narrator
          text: Tom Platt could not keep out of the lesson. He came alongside and began giving grand, unnecessary accounts of the sails and spars aboard his old warship, the Ohio.
        - id: ch01-b119
          speaker: long_jack
          text: Pay no attention to him. Listen to me, Innocence. Tom Platt, this schooner isn't the Ohio. You're confusing the boy.
        - id: ch01-b120
          speaker: tom_platt
          text: He'll be ruined for life if he starts on a fore-and-aft schooner. At least let him learn the leading principles. Sailing is an art, Harvey. I could show you if I had you in the foretop of the—
        - id: ch01-b121
          speaker: long_jack
          text: I know. You'd talk him cold and dead. Be quiet, Tom Platt. Now, Harve, after everything I've told you, how would you reef the foresail? Take your time.
        - id: ch01-b122
          speaker: harvey
          text: I'd haul that in.
        - id: ch01-b123
          speaker: narrator
          text: He pointed toward the sheltered side of the schooner.
        - id: ch01-b124
          speaker: long_jack
          text: Haul in what? The North Atlantic?
        - id: ch01-b125
          speaker: harvey
          text: No, the boom. Then I'd bring over that rope you showed me—
        - id: ch01-b126
          speaker: tom_platt
          text: That's completely wrong.
        - id: ch01-b127
          speaker: long_jack
          text: Quiet. He's learning and doesn't know all the names yet. Go on, Harve.
        - id: ch01-b128
          speaker: harvey
          text: It's the reef pennant. I'd hook the tackle to the reef pennant, and then I'd let down—
        - id: ch01-b129
          speaker: tom_platt
          text: Lower the sail, child! Say lower!
        - id: ch01-b130
          speaker: harvey
          text: I'd lower the throat and peak halyards.
        - id: ch01-b131
          speaker: narrator
          text: Those names had stayed in his memory.
        - id: ch01-b132
          speaker: long_jack
          text: Put your hand on them.
        - id: ch01-b133
          speaker: narrator
          text: Harvey touched the two ropes.
        - id: ch01-b134
          speaker: harvey
          text: I'd lower them until that rope loop on the after edge—no, the cringle—came down to the boom. Then I'd tie the sail the way you showed me and raise the peak and throat halyards again.
        - id: ch01-b135
          speaker: long_jack
          text: You forgot the tack earing, but you'll learn with time and help. Every rope aboard has a proper reason for being here. If it didn't, we'd throw it overboard. Do you understand? I'm putting money into your pocket, you skinny little passenger. Once you've filled out, you can ship from Boston to Cuba and tell them Long Jack taught you. Now I'll call out ropes, and you touch each one as I name it.
        - id: ch01-b136
          speaker: narrator
          text: Long Jack began. Harvey was tired, so he walked slowly toward the first rope. A rope's end curled around his ribs and almost knocked out his breath.
        - id: ch01-b137
          speaker: tom_platt
          text: When you own a boat, you may walk. Until then, you run when an order comes. Do it again, just to be certain.
        - id: ch01-b138
          speaker: narrator
          text: The exercise had already made Harvey hot. That final stroke warmed him through. He was a remarkably quick boy, the son of a clever father and a sensitive mother. He had a firm spirit, though years of spoiling had nearly hardened it into stubbornness. He looked around. Not even Dan was smiling. This painful lesson was plainly part of the day's work. Harvey swallowed the rebuke with one gulp, one gasp, and a grin. The same sharp mind he once used to take advantage of his mother now told him that nobody aboard, except perhaps Penn, would tolerate foolishness. A person can learn a great deal from a voice alone.
        - id: ch01-b139
          speaker: narrator
          text: Long Jack called six more ropes. Harvey darted over the deck like an eel left by the falling tide, with one eye always on Tom Platt.
        - id: ch01-b140
          speaker: manuel
          text: Very good. Very well done. After supper I show you a little schooner I made, with every rope in place. Then we learn them all.
        - id: ch01-b141
          speaker: dan
          text: That was first class for a passenger. Dad just admitted you might earn your salt before you drown. That's high praise from him. I'll teach you more when we share a watch.
        - id: ch01-b142
          speaker: disko
          text: Bring me the tallow!
        - id: ch01-b143
          speaker: narrator
          text: Disko peered through fog pouring over the bow. Beyond the surging jib boom, nothing could be seen for ten feet. Alongside, pale solemn waves passed without end, whispering against one another.
        - id: ch01-b144
          speaker: tom_platt
          text: Now I'll teach you something Long Jack cannot. I'll show you how to fly the Blue Pigeon. Shoo!
        - id: ch01-b145
          speaker: narrator
          text: Tom took a battered deep-sea lead from a locker near the stern. One end was hollow. He packed it with mutton fat from a saucer and carried it forward.
        - id: ch01-b146
          speaker: long_jack
          text: Get on with it, man. We aren't feeling for twenty-five feet of water off Fire Island in a fog. There's no great trick here.
        - id: ch01-b147
          speaker: tom_platt
          text: Don't be jealous, Galway.
        - id: ch01-b148
          speaker: narrator
          text: Disko turned the wheel and slowed the schooner. Manuel lowered the jib onto the boom, with Harvey helping him and feeling very proud. Tom swung the lead around and around until it sang in a deep drone. Then he let go. It dropped into the sea well ahead of the slowly moving schooner.
        - id: ch01-b149
          speaker: dan
          text: Sounding does take skill when that deep-sea lead may be the only eye you have for a week. What depth do you expect, Dad?
        - id: ch01-b150
          speaker: narrator
          text: Disko's face softened. His skill and honor rested on the lead he had stolen from the Fleet. Everyone knew him as a master who could find his way over the Banks blindfolded.
        - id: ch01-b151
          speaker: disko
          text: Maybe sixty fathoms, if I know anything.
        - id: ch01-b152
          speaker: narrator
          text: He glanced at the small compass in the cabin window.
        - id: ch01-b153
          speaker: tom_platt
          text: It is sixty fathoms!
        - id: ch01-b154
          speaker: narrator
          text: Tom hauled in long wet coils, and the schooner moved ahead again. A quarter of an hour passed.
        - id: ch01-b155
          speaker: disko
          text: Heave the lead!
        - id: ch01-b156
          speaker: dan
          text: What will it show this time?
        - id: ch01-b157
          speaker: narrator
          text: Dan whispered and looked proudly toward Harvey. But Harvey was still too pleased with his own new skills to be impressed.
        - id: ch01-b158
          speaker: disko
          text: Fifty fathoms. I believe we're directly over the edge of Green Bank, on old Sixty-Fifty.
        - id: ch01-b159
          speaker: tom_platt
          text: It is fifty fathoms! He hit it within a yard, as close as the shells at Fort Macon.
        - id: ch01-b160
          speaker: dan
          text: Bait a line, Harve.
        - id: ch01-b161
          speaker: narrator
          text: Dan reached for a reel. The schooner seemed to wander blindly through the white fog, her forward sail banging loose. The men waited and watched the boys begin to fish. Dan's line twitched against the deeply scarred rail.
        - id: ch01-b162
          speaker: dan
          text: Huh! How in thunder did Dad know? Help me, Harve. This is a big one, and he swallowed the hook deep.
        - id: ch01-b163
          speaker: narrator
          text: Together they hauled in a goggle-eyed cod weighing twenty pounds. The hook had gone all the way into its stomach.
        - id: ch01-b164
          speaker: harvey
          text: Why, he's covered with tiny crabs!
          emotion: surprised
        - id: ch01-b165
          speaker: narrator
          text: Harvey turned the fish over.
        - id: ch01-b166
          speaker: long_jack
          text: By the great hook block, they're crawling with them already. Disko, you must keep a spare pair of eyes under the keel.
        - id: ch01-b167
          speaker: narrator
          text: The anchor splashed down. Every man threw out a line and took his own place along the rail.
        - id: ch01-b168
          speaker: harvey
          text: Are fish covered with crabs good to eat?
        - id: ch01-b169
          speaker: narrator
          text: He was breathing hard as he pulled in another cod with crabs clinging to it.
        - id: ch01-b170
          speaker: dan
          text: Of course. The crabs mean the cod have been packed together by the thousand. When they swallow bait like this, they're hungry. Don't fuss over how you set it. They would bite a bare hook.
        - id: ch01-b171
          speaker: harvey
          text: This is wonderful! Why don't we always fish from the schooner instead of using dories?
          emotion: happy
        - id: ch01-b172
          speaker: narrator
          text: Fish came aboard gasping and splashing, and nearly every one had swallowed the hook.
        - id: ch01-b173
          speaker: dan
          text: We can fish here until we start cleaning them. After that, the heads and waste would frighten every cod clear to the Bay of Fundy. Fishing from the schooner isn't considered very advanced unless you know as much as Dad does. I expect we'll put out a trawl tonight. This is harder on your back than dory fishing, isn't it?
        - id: ch01-b174
          speaker: narrator
          text: It was backbreaking work. In a dory, the water carried a cod's weight almost until it came aboard, and the fisherman sat close to the fish. From the schooner's higher side, every catch had to be lifted several extra feet as dead weight. Again and again, Harvey had to stoop over the bulwark, pull hand over hand, and straighten with another fish. The rail pressed into his stomach and cramped it. Still, the fishing was wild and furious while it lasted. Lines tightened, bodies bent, and cod came tumbling in until a great pile covered the deck. Then, as suddenly as they had begun, the fish stopped biting.
        - id: ch01-b175
          speaker: harvey
          text: Where are Penn and Uncle Salters?
        - id: ch01-b176
          speaker: narrator
          text: Harvey slapped slime from his oilskins and carefully wound his line the way the others did.
        - id: ch01-b177
          speaker: dan
          text: Fetch the coffee and you'll see.
        - id: ch01-b178
          speaker: narrator
          text: The lamp on the windlass post cast a yellow glow below. At the open forecastle table, Penn and Uncle Salters sat over a checkerboard, unaware of fish or weather. Uncle Salters growled at every move Penn made. Harvey held the leather loop above the ladder with one hand and called loudly to the cook.
        - id: ch01-b179
          speaker: uncle_salters
          text: What's all the noise about now?
        - id: ch01-b180
          speaker: harvey
          text: Big fish, and covered with crabs. Piles and piles of them. How is the game going?
        - id: ch01-b181
          speaker: narrator
          text: Harvey repeated Long Jack's words. Penn's mouth fell open.
        - id: ch01-b182
          speaker: uncle_salters
          text: It wasn't his fault. Penn's deaf.
        - id: ch01-b183
          speaker: dan
          text: Playing checkers, were they?
        - id: ch01-b184
          speaker: narrator
          text: Harvey staggered aft with a tin pail full of steaming coffee.
        - id: ch01-b185
          speaker: dan
          text: Then we won't have to clean the deck tonight. Dad is fair. They'll have to do it.
        - id: ch01-b186
          speaker: disko
          text: Two young fellows I know will bait a tub or two of trawl while those men clean.
        - id: ch01-b187
          speaker: narrator
          text: Disko tied the wheel where he wanted it.
        - id: ch01-b188
          speaker: dan
          text: Hmm. I think I'd rather clean, Dad.
        - id: ch01-b189
          speaker: disko
          text: I don't doubt it. You won't. Dress the fish! Penn can throw them onto the table while you two bait the hooks.
        - id: ch01-b190
          speaker: uncle_salters
          text: Why in thunder didn't those blamed boys tell us you'd found fish? Dan, this knife is dull as gum.
          emotion: angry
        - id: ch01-b191
          speaker: narrator
          text: Uncle Salters shuffled into his place at the cleaning table. In the darkness, Dan fumbled among tubs of trawl line tied on the windward side of the cabin.
        - id: ch01-b192
          speaker: dan
          text: If the anchor cable going out didn't wake you, you'd better hire a boy of your own. Harve, will you go below and fetch the bait?
        - id: ch01-b193
          speaker: disko
          text: Use the fish as bait. The way things look, shag fishing ought to pay better.
        - id: ch01-b194
          speaker: narrator
          text: That saved the boys from plunging bare hands into the little bait barrels. They could use chosen pieces from the cod as the men cleaned them. Each tub held a carefully coiled line with a large hook every few feet. Every hook had to be tested and baited, and the line had to be restowed so it would run freely when put out from a dory. It took real skill. Dan worked in the dark without looking. Harvey caught his fingers on the barbs and complained, while the hooks slipped through Dan's hands as quickly as thread through an expert needleworker's fingers.
        - id: ch01-b195
          speaker: dan
          text: I helped bait trawls ashore before I could walk properly. It's still fussy work. Dad! How many sections do you think we'll need?
        - id: ch01-b196
          speaker: disko
          text: About three. Hurry!
        - id: ch01-b197
          speaker: dan
          text: Each tub holds three hundred fathoms. Three should be more than enough for tonight. Ouch! That hook caught me. Harve, there isn't enough money in Gloucester to hire me onto a regular trawler. People may call it modern, but it's the fussiest, slimiest work on earth.
        - id: ch01-b198
          speaker: harvey
          text: If this isn't regular trawling, I don't know what is. My fingers are cut to pieces.
        - id: ch01-b199
          speaker: dan
          text: This is only one of Dad's blamed experiments. He never uses a trawl without a very good reason. Dad knows what he's doing. That's why he chose this bait. Either that line will sag with fish when we haul it, or we won't see a single fin.
        - id: ch01-b200
          speaker: narrator
          text: Penn and Uncle Salters cleaned the deck as Disko had ordered, but the boys gained nothing from it. The instant the tubs were ready, Tom Platt and Long Jack took them. The two men had been examining a dory by lantern light. They loaded it with the tubs and several small painted trawl buoys, then lowered it into a sea that looked dangerously rough to Harvey.
        - id: ch01-b201
          speaker: harvey
          text: They'll drown! That dory is loaded like a freight car.
          emotion: fearful
        - id: ch01-b202
          speaker: long_jack
          text: We'll come back. And if that trawl tangles because of you, we'll give both of you a beating.
        - id: ch01-b203
          speaker: narrator
          text: The dory climbed the crest of a wave. It seemed certain to smash against the schooner, but it slid over the ridge and vanished into the wet dusk.
        - id: ch01-b204
          speaker: dan
          text: Take this and keep ringing at a steady pace.
        - id: ch01-b205
          speaker: narrator
          text: Dan handed Harvey the rope of a bell behind the windlass. Harvey rang with all his strength because he believed two men's lives depended on him. Disko sat in the cabin writing in the logbook and looked nothing like a murderer. When he went to supper, he even gave anxious Harvey a dry smile.
        - id: ch01-b206
          speaker: dan
          text: This isn't bad weather. You and I could set that trawl. They've gone only far enough to keep clear of our anchor cable. They don't truly need the bell.
        - id: ch01-b207
          speaker: narrator
          text: Clang, clang, clang! Harvey rang on for another half hour, now and then beating out a rolling flourish. At last a shout and a bump came from alongside. Manuel and Dan ran for the dory tackle. Long Jack and Tom Platt seemed to arrive on deck together with half the North Atlantic pouring from their backs. The dory rose after them through the air and landed aboard with a clatter.
        - id: ch01-b208
          speaker: tom_platt
          text: Not one tangle. Danny, you may become useful yet.
        - id: ch01-b209
          speaker: long_jack
          text: We request the pleasure of your company at the banquet. We have kindly decided to honor the second sitting with our presence.
        - id: ch01-b210
          speaker: narrator
          text: Long Jack squeezed water from his boots, danced like an elephant, and thrust an oilskinned arm into Harvey's face. The four of them rolled off to supper. Harvey filled himself with fish chowder and fried pies. Manuel brought a beautiful two-foot model of the Lucy Holmes, the first boat he had owned, from a locker and prepared to teach Harvey the ropes. But Harvey was already fast asleep. He did not so much as move a finger when Penn pushed him into his bunk.
        - id: ch01-b211
          speaker: penn
          text: It must be very sad. Very sad indeed for his mother and father, who believe he is dead. To lose a child, and a son at that!
          emotion: sad
        - id: ch01-b212
          speaker: dan
          text: Get out of here, Penn. Go aft and finish your game with Uncle Salters. Tell Dad I'll take Harve's watch if he doesn't mind. The boy is worn out.
        - id: ch01-b213
          speaker: manuel
          text: He is a very good boy. I think he will grow into a good man, Danny. I do not see him being as crazy as your father said. Eh, what?
        - id: ch01-b214
          speaker: narrator
          text: Dan chuckled, but the chuckle turned into a snore. Outside, the fog stayed thick and the wind rose. The older men lengthened their watches through the night. The hour rang clearly from the cabin. The searching bow slapped and scraped through the seas, and spray hissed against the forecastle stovepipe. The boys slept on. In turn, Disko, Long Jack, Tom Platt, and Uncle Salters tramped aft to inspect the wheel, then forward to make sure the anchor held or to ease out more cable where it rubbed. Between each round, they glanced at the dim anchor light.
