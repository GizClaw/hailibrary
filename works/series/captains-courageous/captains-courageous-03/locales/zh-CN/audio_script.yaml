        pitch: 中低音
  chapters:
    - id: ch01
      title: 第三章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 哈维这一觉睡得像沉进四十英寻深的海底。醒来以后，眼明心亮，肚子也饿得厉害。他和丹吃光了一大盘鲜嫩的鱼碎，那是厨子连夜收集的鱼腹血肉。他们又洗净出海捕鱼的年长船员留下的碗盘锅子，切好午饭的咸猪肉，擦净前舱，添满灯油，替厨子取煤打水，还钻进前货舱，看了看层层堆放的船上给养。外头又是个和暖清明的好天气。哈维站在海风里，一口气直吸到肺底。
        - id: ch01-b02
          speaker: narrator
          text: 夜里又有不少双桅船悄悄靠了过来。绵长的蓝色海面上，白帆和小艇到处都是。远处天边，一艘邮轮的船身完全隐在海面以下，只有煤烟在蓝天上抹下一道灰痕。东面，一艘大船的顶桅帆刚刚升起，像在天边剪了个方方正正的缺口。迪斯科叼着烟斗站在舱顶，一只眼看周围的船，一只眼盯着主桅顶小小的风标。
        - id: ch01-b03
          speaker: dan
          text: 我爸一露出这副犯迷糊的样子，就是在替全船动大脑筋。我拿工钱和分成打赌，咱们快找泊位了。我爸懂鳕鱼，船队也知道他懂。你看，那些船一条条挤过来，嘴上当然会说自己什么也没找。那条是查塔姆的《勒布王子号》，昨夜才溜来。那条前帆打补丁、换了新艏帆的大船，是西查塔姆的《嘉莉·皮特曼号》。除非她今年转运，不然新帆也撑不了多久。她只会随水漂，什么锚都拽不住。瞧我爸的烟，一小圈一小圈往上冒。他在琢磨鱼呢，现在谁跟他说话，他就冲谁发火。上次我开口，他一只靴子就飞过来了。
        - id: ch01-b04
          speaker: narrator
          text: 迪斯科两眼望着前方，眼里却没有面前的海。他正拿自己在大浅滩积下的全部经验，跟四处游荡的鳕鱼斗心眼。远处那些好打听的船来跟着他，算是恭维他的本事。恭维收下以后，他只想把大家甩开，独占一个泊位，等该去维尔京浅滩时，再到那座喧闹的水上城镇里捕鱼。他照一条二十磅重的鳕鱼来想，盘算天气、风暴、海流和食物。整整一个钟头，他仿佛真成了鳕鱼，模样也很像。最后，他才把烟斗从嘴里取下来。
        - id: ch01-b05
          speaker: dan
          text: 爸，杂活全干完了。我们能下船钓一会儿吗？今天正适合捕鱼。
        - id: ch01-b06
          speaker: disko
          text: 他穿着樱桃红衣裳，再蹬那双没熟透似的棕皮鞋，可不能下去。给他换一套能穿的。
        - id: ch01-b07
          speaker: dan
          text: 爸高兴了，这事就算成啦。他把我的备用衣服锁在自己随时能检查的柜子里，因为妈老说我粗心。
        - id: ch01-b08
          speaker: narrator
          text: 丹拖着哈维冲进船舱，接住父亲扔下的钥匙。他翻开柜子，不到三分钟，就把哈维打扮成了渔夫。长胶靴一直到大腿中间，厚蓝毛衣的肘部补得结结实实，手上套着护圈，头上还压了一顶防水帽。
        - id: ch01-b09
          speaker: dan
          text: 这才像样。快点！
        - id: ch01-b10
          speaker: disko
          text: 别走远，随时让我叫得到。也别去船队里串门。有人打听我想做什么，你们就照实说。反正你们不知道。
        - id: ch01-b11
          speaker: narrator
          text: 船尾系着一条红色小艇，艇名是“海蒂·S”。丹收起系船索，轻轻落在底板上。哈维跟着跳，却笨拙地摔进艇里。
        - id: ch01-b12
          speaker: dan
          text: 哪有人这么上小艇？海上要是有点浪，你早沉下去了。得学会顺着她的动作来。
        - id: ch01-b13
          speaker: narrator
          text: 丹装上桨栓，坐在前横凳，看哈维怎么划。哈维从前在阿迪朗达克的池塘划过船，姿势还很斯文。可吱嘎响的桨栓和配重匀称的桨架不是一回事，轻短桨和八英尺长的粗海桨也不同。桨叶老是卡在涌浪里，哈维划得直哼。
        - id: ch01-b14
          speaker: dan
          text: 桨划短些！有浪时一旦卡住，很可能连船都掀翻。她漂亮吧？还是我的呢。
        - id: ch01-b15
          speaker: narrator
          text: 小艇收拾得一尘不染。船头有一只小锚、两罐水和七十英寻左右的细棕锚缆。哈维右手下方，一只白铁饭号稳稳卡在托架里，旁边摆着样子吓人的木槌、一把短鱼钩和一根更短的脱钩棒。两盘钓线整齐绕在方线轴上，线上装着沉甸甸的铅坠和双鳕鱼钩，全都卡在舷边各自的位置。
        - id: ch01-b16
          speaker: harvey
          text: 怎么没有帆和桅杆？
        - id: ch01-b17
          speaker: narrator
          text: 哈维的手已经磨起了水泡。丹听了，却笑出声来。
        - id: ch01-b18
          speaker: dan
          text: 捕鱼小艇很少用帆，全靠划。不过你不用使那么大劲。你不想自己也有一条吗？
        - id: ch01-b19
          speaker: harvey
          text: 我只要开口，我爸大概能送我一两条。
        - id: ch01-b20
          speaker: narrator
          text: 哈维忙了这么久，直到这时才重新想起家里。
        - id: ch01-b21
          speaker: dan
          text: 对，我忘了你爸是百万富翁。可你现在一点也不像百万富翁家的少爷。一条小艇，算上船和全套家什，也值不少钱呢。你觉得你爸会送你一条，让你当宠物养吗？
        - id: ch01-b22
          speaker: harvey
          text: 说不准。我还没磨他给我买过的东西，大概就只剩这个了。
        - id: ch01-b23
          speaker: dan
          text: 你在家一定很费钱。哈维，别滑来滑去。桨要划短，因为海面没有完全不动的时候，涌浪会把你——
        - id: ch01-b24
          speaker: narrator
          text: 话没说完，桨柄猛地弹起来，正撞中哈维的下巴，把他掀得向后倒去。
        - id: ch01-b25
          speaker: dan
          text: 我正要说这个。我也挨过这一课，不过那年我才八岁。
        - id: ch01-b26
          speaker: narrator
          text: 哈维两颊疼得厉害，皱着眉重新坐好。
        - id: ch01-b27
          speaker: dan
          text: 我爸说，对东西发火没用。摆弄不好，是自己的错。咱们就在这儿试试。曼努埃尔会告诉我们水有多深。
        - id: ch01-b28
          speaker: narrator
          text: 曼努埃尔的小艇在一英里外摇晃。丹竖起船桨，他马上挥了三下左臂。
        - id: ch01-b29
          speaker: dan
          text: 三十英寻。面团子下水。哈维，照我这样挂饵，别把线轴缠乱。
        - id: ch01-b30
          speaker: narrator
          text: 哈维还在摸索怎么装饵、怎么甩铅坠，丹的线早已入水。小艇顺着海面轻轻漂。没摸准哪块水底有鱼，他们还不值得下锚。
        - id: ch01-b31
          speaker: dan
          text: 来了！木槌，哈维，快把木槌给我，就在你手底下！
        - id: ch01-b32
          speaker: narrator
          text: 一条大鳕鱼在船边又拍又踢，水珠噼啪打上哈维肩头。他知道丹要的不是饭号，赶紧递过木槌。丹把鱼敲晕，拉进船里，再用脱钩棒拧下鱼钩。就在这时，哈维的线也猛地一扯。他兴冲冲地往上收，拉上来的却不是鱼。
        - id: ch01-b33
          speaker: harvey
          text: 咦，这不是草莓吗？快看！
        - id: ch01-b34
          speaker: narrator
          text: 钩上缠着一簇怪东西，一面红，一面白，活像陆地上的草莓。只是它没有叶片，果梗布满小孔，还黏糊糊的。
        - id: ch01-b35
          speaker: dan
          text: 别碰！往船边甩掉。别——
        - id: ch01-b36
          speaker: narrator
          text: 丹还是说晚了。哈维已经摘下来，捧在手里端详。几根手指顿时抽痛，像一把抓住了荨麻。
        - id: ch01-b37
          speaker: harvey
          text: 哎哟，我的手指一下子全疼起来了！
        - id: ch01-b38
          speaker: dan
          text: 现在你知道什么叫草莓底了。除了鱼，别的东西都不能空手去碰，这是我爸说的。往舷边敲掉，再挂饵吧。看着手也不会好，反正这些都算在工钱里。
        - id: ch01-b39
          speaker: narrator
          text: 想到自己一个月有十块半工钱，哈维笑了。他又想到，母亲要是看见他在大洋中央趴在小艇边，不知会吓成什么样。他从前只要去萨拉纳克湖上玩，母亲就痛苦得不得了。哈维还清楚记得，自己那时常笑她太操心。忽然，钓线飞快地从掌中滑过。即使隔着羊毛护圈，手还是勒得火辣辣的。
        - id: ch01-b40
          speaker: dan
          text: 是条懒沉的大鱼。它使多大劲，你就给多少线。我来帮你。
        - id: ch01-b41
          speaker: harvey
          text: 不用！这是我的第一条鱼。它……该不会是鲸吧？
        - id: ch01-b42
          speaker: dan
          text: 也许是大比目鱼。
        - id: ch01-b43
          speaker: narrator
          text: 丹探头往水下看，手里举着木槌，准备随时下手。绿水深处，有个白色扁圆的影子忽明忽暗。
        - id: ch01-b44
          speaker: dan
          text: 我拿工钱和分成打赌，它超过一百磅。你还非要一个人把它弄上来吗？
        - id: ch01-b45
          speaker: narrator
          text: 哈维的指节不停撞上船舷，磨破了，也流了血。他又激动又使劲，脸涨得紫蓝，汗水浑身直淌。他死盯着飞快游动的钓线，还有围着线一圈圈旋转、被阳光照亮的水纹，眼睛都快花了。接下来的二十分钟，那条大比目鱼完全接管了两个男孩和整条小艇，想拖到哪里就拖到哪里。两个男孩早已累坏，鱼才终于叫他们用短鱼钩搭住，合力拖进船里。
        - id: ch01-b46
          speaker: dan
          text: 新手才有这样的好运气。它只会比一百磅重。
        - id: ch01-b47
          speaker: narrator
          text: 丹擦着额头。哈维望着那条灰色斑驳的庞然大物，骄傲得一句话也说不出来。岸上那些摆在大理石案板上的大比目鱼，他见过许多，却从没想过它们究竟是怎么来到内陆的。如今他总算亲手弄明白了，全身上下也累得没有一寸地方不疼。
        - id: ch01-b48
          speaker: dan
          text: 我爸要是在这儿，一眼就能读懂这些征兆。鱼正越钓越小，你这条大比目鱼，大概是这趟最懒沉的一条。昨天那些鱼，你注意过吗？全是大鱼，却没有大比目鱼。我爸会马上看出其中的意思。他常说，大浅滩上的一切都是征兆，只看你读得对不对。我爸比鲸洞还深。
        - id: ch01-b49
          speaker: narrator
          text: 《我们在这儿号》忽然传来一声枪响，一只装土豆的筐升上前桅索具。
        - id: ch01-b50
          speaker: dan
          text: 看，我刚说什么来着？这是叫所有人回去。我爸一定发现了什么，不然不会在这个时辰叫停。哈维，收线，咱们划回去。
        - id: ch01-b51
          speaker: narrator
          text: 两人正处在大船的上风口，本来只需轻轻一划，就能掠过平静的海面。可半英里外传来一阵哀号，他们只好先去找宾恩。那小个子绕着一个固定点横冲直撞，活像一只巨大的水黾。他拼命倒划，又猛冲向前，可每次到头，小艇都会打转，再被缆绳狠狠拽住。
        - id: ch01-b52
          speaker: dan
          text: 咱们得帮他，不然他要在这里扎根结籽了。
        - id: ch01-b53
          speaker: harvey
          text: 他怎么了？
        - id: ch01-b54
          speaker: narrator
          text: 哈维来到了一个全新的世界。在这里，他不能再对长辈发号施令，只能客气地发问。大海大得吓人，却一点儿也不在乎他们。
        - id: ch01-b55
          speaker: dan
          text: 锚挂住了。宾恩总丢锚，这一趟已经丢了两只，还是在沙底上。我爸说，他再丢一只，就给他换成石锚。宾恩一定会伤透心。
        - id: ch01-b56
          speaker: harvey
          text: 石锚是什么？
        - id: ch01-b57
          speaker: narrator
          text: 哈维听着这个名字，以为也许是故事里拖龙骨那一类海上酷刑。
        - id: ch01-b58
          speaker: dan
          text: 就是拿一块大石头代替锚。小艇船头压着石锚，隔老远也看得见，整个船队马上都明白。大伙儿会拼命取笑他。宾恩可受不了，活像狗尾巴上挂了长柄水勺。他太敏感了。喂，宾恩！又卡住了吗？别试你那些新发明了。顺着锚缆划到上面，让绳子直上直下。
        - id: ch01-b59
          speaker: penn
          text: 它就是不动，一点也不动。我什么办法都试了。
        - id: ch01-b60
          speaker: dan
          text: 船头这一大团乱麻又是什么？
        - id: ch01-b61
          speaker: narrator
          text: 丹指着备用船桨和锚缆。它们被一双生手缠成了一窝。
        - id: ch01-b62
          speaker: penn
          text: 这个呀，是西班牙绞盘。索尔特斯先生教我做的，可是连它也拉不动。
        - id: ch01-b63
          speaker: narrator
          text: 宾恩颇为得意。丹赶紧伏低身子，好把笑脸藏在船舷后面。他轻轻抽了两下锚缆，锚立刻就松了。
        - id: ch01-b64
          speaker: dan
          text: 快拉起来，宾恩，不然又要卡住。
        - id: ch01-b65
          speaker: narrator
          text: 两人划开以后，宾恩还睁着一双又大又可怜的蓝眼睛，望着小锚上挂满水草的锚爪，一遍又一遍地向他们道谢。
        - id: ch01-b66
          speaker: dan
          text: 对了，哈维，趁我还记得，有件事得告诉你。宾恩脑子里的缝没全填好。他不伤人，就是神志已经坏了。懂吗？
        - id: ch01-b67
          speaker: harvey
          text: 他真是这样，还是你父亲又给人下了判断？
        - id: ch01-b68
          speaker: narrator
          text: 哈维俯下身划桨。他觉得自己已经越来越会操纵这对船桨了。
        - id: ch01-b69
          speaker: dan
          text: 这一次我爸没有看错。宾恩是真的疯了。也不能说疯得很厉害，他只是个不会伤人的糊涂人。我告诉你，是因为你应该知道。你现在划得挺像样了，哈维。宾恩从前是摩拉维亚派的牧师，原名雅各布·博勒。他跟妻子和四个孩子住在宾夕法尼亚。后来，他带全家去参加摩拉维亚派的聚会，大概是野营布道会。他们只在约翰斯敦住了一晚。你听说过约翰斯敦吗？
        - id: ch01-b70
          speaker: harvey
          text: 听过，可我不知道为什么记得。它跟阿什塔比拉一样，莫名其妙就留在脑子里。
        - id: ch01-b71
          speaker: dan
          text: 因为两处都出过大灾祸。宾恩一家住旅馆的那一晚，约翰斯敦让大水冲没了。大坝垮掉，房屋漂起来，撞在一起，再一栋栋沉下去。我看过那些画，怕人得很。宾恩还没明白出了什么事，就眼看着全家一起淹死。从那以后，他的神志就坏了。他总觉得约翰斯敦发生过什么，却怎么也想不起来，只能带着笑到处漂，不知道自己是谁，也忘了从前的日子。后来他碰上索尔特斯叔叔。那时叔叔正在阿勒格尼城访亲。我妈那边一半亲戚散住在宾夕法尼亚，索尔特斯叔叔冬天常去串门。他知道宾恩遭过什么，就把人收留下来，带到东部，让他在农场上干活。
        - id: ch01-b72
          speaker: harvey
          text: 昨晚两条小艇撞上时，我听见他管宾恩叫种田的。你索尔特斯叔叔真是农夫？
        - id: ch01-b73
          speaker: dan
          text: 农夫？从这儿到哈特拉斯的海水全拿来，也洗不掉他靴子沟里的土！他一辈子都是个农夫。我亲眼看过他快到黄昏时拴起一只桶，坐在饮水桶边慢慢拧龙头，那样子就跟挤母牛的奶头一样。他就是这么会种田。后来他和宾恩一起经营埃克塞特附近的一座农场。今年春天，叔叔把地卖给一个从波士顿来的乡巴佬。那人想盖避暑别墅，叔叔便卖出了一大笔钱。两个糊涂蛋就那么磕磕绊绊地一起过日子。后来宾恩原先的摩拉维亚教会找到了他，给叔叔写来一封信。信里到底说了什么，我从没听过，可叔叔气坏了。他平常多半信圣公会，那回却像浸礼会教徒一样，左右开弓骂了个痛快。他说，不管宾夕法尼亚还是别处，谁也休想叫他把宾恩交给那些该死的摩拉维亚亲友。
        - id: ch01-b74
          speaker: dan
          text: 两个航次以前，叔叔拖着宾恩来找我爸，说他俩必须出海捕鱼，好调养身体。他大概以为摩拉维亚派不会跑到大浅滩来找雅各布·博勒。我爸答应了。叔叔不发明专利肥料的时候，断断续续捕过三十年鱼，在《我们在这儿号》还占四分之一份子。那次出海对宾恩很有好处，我爸从此每趟都带上他。我爸说，总有一天宾恩会想起妻儿和约翰斯敦。到了那时，他多半就活不下去了。所以千万别在他面前说起约翰斯敦，不然索尔特斯叔叔会把你扔进海里。
        - id: ch01-b75
          speaker: harvey
          text: 可怜的宾恩。看他们平常那副样子，我真想不到索尔特斯叔叔这么在乎他。
        - id: ch01-b76
          speaker: dan
          text: 我喜欢宾恩，大伙儿也喜欢。咱们本来该拖他回去，可我想先告诉你这件事。
        - id: ch01-b77
          speaker: narrator
          text: 他们已经靠近双桅船，其他小艇还稍稍落在后面。
        - id: ch01-b78
          speaker: disko
          text: 午饭以后再吊小艇。咱们马上开膛。孩子们，把桌子支起来！
        - id: ch01-b79
          speaker: dan
          text: 比鲸洞还深。看看从早晨起又有多少船挤过来了。它们都在等我爸。你看见了吗，哈维？
        - id: ch01-b80
          speaker: harvey
          text: 我看它们全都一样。
        - id: ch01-b81
          speaker: narrator
          text: 对一个陆地人来说，四周点头摇晃的双桅船，确实像从同一副模子里倒出来的。
        - id: ch01-b82
          speaker: dan
          text: 才不一样。那条脏兮兮的黄船，艏斜桅翘得老高，是《布拉格希望号》。船长尼克·布雷迪，是大浅滩上最刻薄的人。到了主暗礁，我们会当面告诉他。远处那条是《雏菊号》，属于杰罗尔德兄弟。她从哈里奇来，跑得不慢，运气也好。不过我爸连在坟地里都找得到鱼。并排那三条是《玛吉·史密斯号》《玫瑰号》和《伊迪丝·S·沃伦号》，都跟咱们从一个地方来。爸，我猜明天能看见《艾比·M·迪林号》吧？他们都从凯罗浅滩那边溜过来了。
        - id: ch01-b83
          speaker: disko
          text: 丹尼，明天你见不到几条船了。孩子们，这地方太挤。让他们挂大饵、钓小鱼去吧。
        - id: ch01-b84
          speaker: narrator
          text: 迪斯科叫儿子“丹尼”，说明他心情很好。船员们爬上甲板，他低头检查鱼舱。今天的鱼小得出奇，个头也很齐。除了哈维那条大比目鱼，没有一条超过十五磅。
        - id: ch01-b85
          speaker: disko
          text: 我在等天气。
        - id: ch01-b86
          speaker: long_jack
          text: 那你只好自己动手造天气啦，迪斯科。四面天边都干干净净，我可看不见半点要变天的征兆。
        - id: ch01-b87
          speaker: narrator
          text: 可半个钟头以后，大伙儿还在给鱼开膛，大浅滩的雾就压了下来。照渔夫的说法，雾来得正好隔在“两条鱼之间”。它稳稳地涌来，一绺一绺打着卷，像烟一样沿无色的海面翻腾。男人们一句话也没说，全都停下手里的活。长杰克和索尔特斯叔叔把绞盘手柄插进槽里，开始起锚。湿麻缆绷上绞盘轴，震得整座绞盘直响。最后一段最吃力，曼努埃尔和汤姆·普拉特也上来帮忙。锚带着一声呜咽离开海面。迪斯科扶稳舵轮时，支索帆已经吃饱了风。
        - id: ch01-b88
          speaker: disko
          text: 升艏帆和前帆。
        - id: ch01-b89
          speaker: long_jack
          text: 把他们甩进这锅浓汤里！
        - id: ch01-b90
          speaker: narrator
          text: 长杰克系紧艏帆帆脚索。其余人把前帆一串又敲又撞、咔嗒作响的帆环拉上去，前帆下桁也跟着吱嘎响。《我们在这儿号》迎风抬头，随即向前俯冲，一头钻进翻滚旋转、茫茫一片的白雾。
        - id: ch01-b91
          speaker: disko
          text: 这雾后面藏着风。
        - id: ch01-b92
          speaker: narrator
          text: 哈维张着嘴，望着前帆湿淋淋的帆布，惊奇极了。最奇的是，他几乎没听见任何命令。迪斯科只偶尔哼上一声，最后说一句“行了，孩子”。
        - id: ch01-b93
          speaker: tom_platt
          text: 你从没见过起锚吗？
        - id: ch01-b94
          speaker: harvey
          text: 没见过。咱们要去哪儿？
        - id: ch01-b95
          speaker: tom_platt
          text: 找鱼，也找泊位。你在船上待满一星期，自然会知道。眼下你看什么都新鲜，可谁也说不准自己会碰上什么。就拿我汤姆·普拉特来说，我从来没想过——
        - id: ch01-b96
          speaker: disko
          text: 怎么也比每月十四美元，肚子上再挨一颗子弹强。把大艏帆松一点。
        - id: ch01-b97
          speaker: narrator
          text: 汤姆·普拉特一面摆弄那面绑着木撑杆的大艏帆，一面接着讲。
        - id: ch01-b98
          speaker: tom_platt
          text: 光算钱当然强。可当年在博福特港外的《吉姆·巴克小姐号》上，我们操起绞盘，麦肯堡朝船尾猛轰烧红的炮弹，头顶还压着一场狂风时，谁会想到钱？那时候你在哪儿，迪斯科？
        - id: ch01-b99
          speaker: disko
          text: 就在这里，或者离这儿不远。在深海上挣饭吃，躲南军的私掠船。对不住，汤姆·普拉特，我没有烧红的炮弹招待你。不过我看，见到东角以前，风总不会缺。
        - id: ch01-b100
          speaker: narrator
          text: 船头不停传来海水的拍打和碎响。间或又是沉沉的砰一声，一小股浪花腾起来，噼里啪啦落在前舱顶。索具一滴滴淌着又冷又黏的水。男人们全在舱房下风侧闲坐，只有索尔特斯叔叔挺直身子留在主舱口，抱着那双被蜇伤的手。
        - id: ch01-b101
          speaker: disko
          text: 我看她还能挂一面支索帆。
        - id: ch01-b102
          speaker: salters
          text: 挂了也没什么好处。何必白白糟蹋帆布？
        - id: ch01-b103
          speaker: narrator
          text: 迪斯科手里的舵轮轻轻一抽，几乎看不出动过。几秒以后，一道浪头嘶嘶作响，斜着劈过整条船，正中索尔特斯叔叔两肩之间，把他从头到脚浇了个透。他一边呛咳，一边站起身来，刚往船头走去，又迎面结结实实挨上一浪。
        - id: ch01-b104
          speaker: dan
          text: 看我爸怎么满甲板撵他。索尔特斯叔叔以为自己占四分之一份子，帆布也该归他管。我爸已经连续两个航次用浪头收拾他。嗨，这一下正打中他吃饭的地方！
        - id: ch01-b105
          speaker: narrator
          text: 叔叔躲到前桅旁，又一道浪打来，直淹过膝盖。迪斯科的脸还是和舵轮一样，半点表情也没有。
        - id: ch01-b106
          speaker: disko
          text: 索尔特斯，我看挂上支索帆，船会稳当些。
        - id: ch01-b107
          speaker: salters
          text: 那就挂起你那面破风筝！可出了什么事，别怪到我头上。宾恩，马上下去喝咖啡。这种天气还在甲板上闲晃，你也该懂点事。
          emotion: angry
        - id: ch01-b108
          speaker: narrator
          text: 索尔特斯叔叔赶着宾恩钻进前舱。
        - id: ch01-b109
          speaker: dan
          text: 他们这下会一边灌咖啡，一边下跳棋，一直玩到母牛自己回家。我看咱们也要闲上一阵。双桅渔船没遇到鱼的时候，世上再没有比她更懒、更闷的东西了。
        - id: ch01-b110
          speaker: long_jack
          text: 多亏你提醒，丹尼！我都忘了那顶码头棚似的帽子底下，还有个乘客。不懂船上绳索的人，可没有资格偷懒。汤姆·普拉特，把他送过来，我们教教他。
        - id: ch01-b111
          speaker: dan
          text: 这次轮不到我教。你们自己来吧。我爸当初拿绳头教我。
        - id: ch01-b112
          speaker: narrator
          text: 接下来一个钟头，长杰克押着哈维在甲板上来回走，教他那些海上每个人闭着眼、喝醉了或睡着了也必须知道的事。这条七十吨的双桅船截短了前桅，索具本来不算多，可长杰克特别懂得怎么把意思说到人身上。他要哈维看斜桁升降索，就把指关节深深抵进男孩后颈，按着他抬头足足半分钟。他讲船上的前后之别，就让哈维的鼻子贴着帆桁磨上几英尺。至于每根绳究竟通到哪里，也由那根绳的绳头亲自在哈维身上说明，保证他忘不了。
        - id: ch01-b113
          speaker: narrator
          text: 如果甲板上能有一点空处，这课会容易得多。偏偏船上样样都有地方，人却没有。最前面是绞盘和配套索具，锚链和麻缆也堆在那里，每一样都能把人绊倒。旁边竖着前舱炉管，舱口边还有几只盛鱼肝的脏料桶。再往后，前帆下桁和主舱口滑罩占住中间，剩下的位置又归水泵和开膛台。后甲板旁，一摞摞小艇用环首螺栓绑得严严实实。舱房周围捆满了桶和各种零碎东西。最后还有一根六十英尺长的主帆下桁，稳稳架在桁叉上，从中间把整条船纵着劈成两半，人每次经过都得低头闪躲。
        - id: ch01-b114
          speaker: narrator
          text: 汤姆·普拉特当然也来插手。他凑在一旁，把老《俄亥俄号》上的风帆和桅杆讲得又长又细，完全没有必要。
        - id: ch01-b115
          speaker: long_jack
          text: 别管他说什么，听我的，小天真。汤姆·普拉特，这条小渔船不是《俄亥俄号》。你快把孩子弄糊涂了。
        - id: ch01-b116
          speaker: tom_platt
          text: 从这种纵帆船学起，他这辈子就毁啦。总得让他懂几条基本规矩。哈维，驾船是一门本事。要是把你带到——号的前桅楼，我就能教你——
        - id: ch01-b117
          speaker: long_jack
          text: 我知道。你会把他活活说死，再冻得梆硬。安静，汤姆·普拉特！哈维，我刚才讲完了。现在告诉我，你会怎么缩小前帆？慢慢想再回答。
        - id: ch01-b118
          speaker: harvey
          text: 先把那个拉进来。
        - id: ch01-b119
          speaker: long_jack
          text: 哪个？你要把北大西洋拉进来吗？
        - id: ch01-b120
          speaker: harvey
          text: 不是，是帆桁。再把你刚才指给我的那根绳往后拉——
        - id: ch01-b121
          speaker: tom_platt
          text: 根本不是这样！
        - id: ch01-b122
          speaker: long_jack
          text: 安静！他正在学，只是还没记熟名字。接着说，哈维。
        - id: ch01-b123
          speaker: harvey
          text: 对了，那是缩帆耳索。我要把滑车挂上去，然后把——把它放下来——
        - id: ch01-b124
          speaker: tom_platt
          text: 是降帆，孩子！降帆！
        - id: ch01-b125
          speaker: harvey
          text: 把喉部升降索和斜桁升降索放下来。
        - id: ch01-b126
          speaker: narrator
          text: 这几个名字，哈维倒是记得很牢。
        - id: ch01-b127
          speaker: long_jack
          text: 把手放在这两根绳上。
        - id: ch01-b128
          speaker: narrator
          text: 哈维照着做了。
        - id: ch01-b129
          speaker: harvey
          text: 一直往下降，等那只绳圈，就是后帆边上的克里斯……不对，是帆眼。等帆眼落到下桁上，再照你教的绑好，最后重新升起斜桁升降索和喉部升降索。
        - id: ch01-b130
          speaker: long_jack
          text: 你忘了穿前下角耳索。不过再给你一点时间，再有人帮一把，你总会学会。船上的每根绳都有实实在在的用处，不然早就扔进海里。听懂了吗？瘦巴巴的小押货员，我正把钱塞进你口袋。等你长壮了，就能从波士顿上船去古巴，再告诉他们是长杰克教的你。现在我要追着你跑。我叫一根绳，你就跑去把手放在那根绳上。
        - id: ch01-b131
          speaker: narrator
          text: 长杰克开始报名字。哈维觉得累了，走得有点慢。一截绳头立刻卷过肋下，抽得他差点喘不过气。
        - id: ch01-b132
          speaker: tom_platt
          text: 等你有了自己的船，想走多慢都行。在那以前，听到命令就要跑。再来一次，看你是不是真会了！
        - id: ch01-b133
          speaker: narrator
          text: 这一阵跑动已经让哈维浑身发热，最后那一下更把他彻底抽暖了。他其实是个异常机灵的男孩，父亲很聪明，母亲又敏感。他本来有一股坚定果断的性子，只是从小被人宠坏，差一点变成了牛脾气。哈维看看其他人，发现连丹也没有笑。看来，这不过是每天干活的一部分，虽然实在疼得厉害。他猛吸一口气，把教训咽下去，还咧嘴笑了笑。他正因为机灵，才懂得怎么利用母亲。如今同一份机灵又告诉他，这条船上除了宾恩也许例外，没有人肯容他胡闹。只听人的口气，就能学到很多。长杰克又报出几根绳，哈维像退潮泥滩上的鳗鱼一样满甲板飞跑，一只眼始终防着汤姆·普拉特。
        - id: ch01-b134
          speaker: manuel
          text: 很好，做得很好。吃过晚饭，我给你看一条自己做的小双桅船，上面什么绳都有。这样我们就能学。
        - id: ch01-b135
          speaker: dan
          text: 以一个乘客来说，你算头一等。我爸刚刚承认，也许你淹死以前，还能配得上自己吃的盐。这句话从他嘴里出来，可了不得。下回咱们一起值班，我再教你。
        - id: ch01-b136
          speaker: disko
          text: 高一点！
        - id: ch01-b137
          speaker: narrator
          text: 迪斯科眯起眼，望向从船头滚过的浓雾。艏斜桅外十英尺，就什么也看不见了。船边，一列列苍白庄严的浪无穷无尽地滚过，仿佛彼此低语，又互相轻吻。
        - id: ch01-b138
          speaker: tom_platt
          text: 现在我教你一样长杰克不会的！我要教你怎么放飞蓝鸽子。嘘——！
        - id: ch01-b139
          speaker: narrator
          text: 汤姆从船尾柜子里拿出一枚坑坑洼洼的深海测铅。测铅一端挖了个洞，他从一只小碟里取出羊油，把凹处抹满，随后走到船头。迪斯科轻轻动了一下舵轮，双桅船便慢下来。曼努埃尔在哈维帮助下，把艏帆整面降下，堆在帆桁上。哈维能搭上手，心里别提多得意。汤姆一圈又一圈抡起测铅，沉重的铅块发出低低的嗡鸣。
        - id: ch01-b140
          speaker: long_jack
          text: 快扔吧，伙计。咱们又不是在雾里测火岛外二十五英尺的水深。这里没什么花样好耍。
        - id: ch01-b141
          speaker: tom_platt
          text: 别眼红，加尔韦人。
        - id: ch01-b142
          speaker: narrator
          text: 测铅脱手飞出，扑通落进远处海水里，双桅船缓缓向前涌去。
        - id: ch01-b143
          speaker: dan
          text: 可要是一星期里，深水测铅是你唯一能用的眼睛，测深就很讲本事。你估多少，爸？
        - id: ch01-b144
          speaker: narrator
          text: 迪斯科的脸松开了。他先走一步，把其余船队甩在后面，赌上的是自己的本领和名声。人人都说，他闭着眼睛也认得大浅滩。
        - id: ch01-b145
          speaker: disko
          text: 六十英寻左右吧，要是我的眼力还算数。
        - id: ch01-b146
          speaker: narrator
          text: 他说着，瞥了一眼舱房窗里的小罗盘。
        - id: ch01-b147
          speaker: tom_platt
          text: 六十！
        - id: ch01-b148
          speaker: narrator
          text: 汤姆收回一大圈一大圈湿绳，双桅船重新提速。一刻钟以后，迪斯科又叫他测一次。
        - id: ch01-b149
          speaker: dan
          text: 你猜我爸会说多少？
        - id: ch01-b150
          speaker: narrator
          text: 丹骄傲地看着哈维。可哈维这时正在为自己的表现得意，根本顾不上佩服别人。
        - id: ch01-b151
          speaker: disko
          text: 五十。我看咱们正好越过绿浅滩那道沟，走的是老“六十五十”。
        - id: ch01-b152
          speaker: tom_platt
          text: 五十！误差不到一码，跟麦肯堡打来的炮弹一样准。
        - id: ch01-b153
          speaker: dan
          text: 哈维，挂饵。
        - id: ch01-b154
          speaker: narrator
          text: 丹抓起线轴上的钓线。双桅船像在浓雾里随意乱走，艏帆拍得啪啪响。男人们等在一边，看两个男孩下钩。
        - id: ch01-b155
          speaker: dan
          text: 嘿！我爸到底怎么知道的？哈维，快来搭手，这条鱼很大，钩子还吞进了肚子。
        - id: ch01-b156
          speaker: narrator
          text: 钓线在满是刀痕的舷边猛跳。两个男孩一起往上拖，拉起一条鼓眼睛的二十磅鳕鱼。它把鱼饵一直吞进了胃里。
        - id: ch01-b157
          speaker: harvey
          text: 它身上怎么全是小螃蟹？
        - id: ch01-b158
          speaker: narrator
          text: 哈维把鱼翻了过来。
        - id: ch01-b159
          speaker: long_jack
          text: 凭这大滑车钩发誓，它们已经长虱子了。迪斯科，你是不是把备用眼睛藏在船底下？
        - id: ch01-b160
          speaker: narrator
          text: 锚哗啦落水。所有人都甩出钓线，各自在舷边占好位置。哈维又拖上一条爬满小蟹的鳕鱼，累得直喘。
        - id: ch01-b161
          speaker: harvey
          text: 这种长“虱子”的鱼能吃吗？
        - id: ch01-b162
          speaker: long_jack
          text: 当然能。鱼身上长满这些东西，说明它们成千上万条挤在一处。它们这样一口吞饵，就是饿坏了。别管鱼饵挂得好不好，空钩它们都咬。
        - id: ch01-b163
          speaker: harvey
          text: 这可真痛快！我们为什么不能总在大船上钓，非得坐小艇？
        - id: ch01-b164
          speaker: dan
          text: 没开始开膛以前，随时都能在船上钓。等鱼头和下水进了海，鱼会一直吓到芬迪湾去。不过除非懂得跟我爸一样多，在大船上捕鱼不能算先进。我猜今晚咱们要放延绳。这种钓法比坐小艇更累腰吧？
        - id: ch01-b165
          speaker: narrator
          text: 的确很累腰。在小艇上，鱼到最后一刻都由海水托着，人跟鱼差不多高，拖起来不用多费那一段力气。双桅船的干舷虽然只有几英尺，却要人凭空多拽起一截死沉的分量。身体长久弯过舷墙，肚子也窝得难受。不过只要鱼还肯咬钩，这场捕鱼就又狂野又痛快。鳕鱼一条接一条喘着气、拍着水上船。等鱼群终于不再咬饵，甲板上已经堆起了很大一垛。
        - id: ch01-b166
          speaker: harvey
          text: 宾恩和索尔特斯叔叔去哪儿了？
        - id: ch01-b167
          speaker: narrator
          text: 哈维拍掉油布衣上的黏液，又仔细照着别人收起钓线。
        - id: ch01-b168
          speaker: dan
          text: 去拿咖啡，顺便看看他们。
        - id: ch01-b169
          speaker: narrator
          text: 前舱里，棘轮柱上的灯放着黄光。桌子已经放下打开。宾恩和索尔特斯叔叔坐在棋盘两边，根本不知道外面的鱼和天气。宾恩每走一步，索尔特斯叔叔都冲他龇牙咧嘴。哈维一手抓着梯顶的皮环，探身朝厨子喊起来。
        - id: ch01-b170
          speaker: salters
          text: 现在又怎么了？
        - id: ch01-b171
          speaker: harvey
          text: 大鱼，身上还全是“虱子”，一堆又一堆。你们棋下得怎么样？
        - id: ch01-b172
          speaker: narrator
          text: 小个子宾恩听得张口结舌。
        - id: ch01-b173
          speaker: salters
          text: 没听见可不是他的错。宾恩耳朵聋！
        - id: ch01-b174
          speaker: narrator
          text: 哈维提着一白铁桶热咖啡，摇摇晃晃走向船尾。
        - id: ch01-b175
          speaker: dan
          text: 原来他们在下跳棋。这下今晚不用咱们收拾了。我爸办事公道，该他们干。
        - id: ch01-b176
          speaker: disko
          text: 我认识的两个小伙子，得趁他们收拾的时候，挂好一两桶延绳饵。
        - id: ch01-b177
          speaker: narrator
          text: 迪斯科把舵轮绑到自己满意的位置。
        - id: ch01-b178
          speaker: dan
          text: 爸，我还是愿意去收拾。
        - id: ch01-b179
          speaker: disko
          text: 我不怀疑。可你不用去。开膛！全都开膛！你们两个挂饵，宾恩负责抛鱼。
        - id: ch01-b180
          speaker: salters
          text: 那两个该死的孩子怎么不告诉我们，你已经找到鱼了？丹，这把刀钝得像树胶。
        - id: ch01-b181
          speaker: narrator
          text: 索尔特斯叔叔挪到开膛台边自己的位置。丹则在昏暗中翻动舱房上风侧那几桶盘好的延绳。
        - id: ch01-b182
          speaker: dan
          text: 连放锚缆都吵不醒你，我看你最好自己雇个孩子。哈维，你愿不愿下去替咱们拿鱼饵？
        - id: ch01-b183
          speaker: disko
          text: 就地取饵。照眼下的鱼情，用鱼下水更划算。
        - id: ch01-b184
          speaker: narrator
          text: 两个男孩于是从刚开膛的鳕鱼里挑出合适的下水作饵。这总比在底下的小饵桶里赤手翻找舒服些。每只桶里都盘着整整齐齐的长线，隔几英尺就有一枚大钩。每一枚钩都得检查、挂饵，再把已经挂好饵的线按次序收进桶里，保证从小艇放出去时一路顺畅，绝不会绊住缠住。这是一门很精细的活。丹在黑暗里不用低头看，照样做得飞快。哈维却不停被倒刺勾住手指，伤口越来越多，只能哀叹自己的命运。那些钩子从丹的指间飞过，快得像老姑娘膝头不停穿梭的花边活。
        - id: ch01-b185
          speaker: dan
          text: 我还走不稳时，就在岸上帮人挂延绳饵了。可这还是件零碎磨人的活。爸，你说咱们要备几盘？
        - id: ch01-b186
          speaker: disko
          text: 三盘左右。快点！
        - id: ch01-b187
          speaker: dan
          text: 每桶三百英寻，今晚放出去足够了。哎哟，这一钩没躲过去。
        - id: ch01-b188
          speaker: narrator
          text: 丹把手指塞进嘴里。
        - id: ch01-b189
          speaker: dan
          text: 哈维，就算把格洛斯特的钱全给我，也休想雇我上一条专放延绳的船。也许那样先进，可除此以外，天底下再没有比它更零碎、更黏糊、更邋遢的活。
        - id: ch01-b190
          speaker: harvey
          text: 这要还不算正经延绳钓，我真不知道什么才算。我的手指全割烂了。
        - id: ch01-b191
          speaker: dan
          text: 呸，这只是我爸又一个该死的试验。他没有十足理由，绝不会用延绳。我爸懂，所以才让咱们就地取饵。等收线的时候，要么整条延绳沉甸甸挂满鱼，要么一片鱼鳍也见不到。
        - id: ch01-b192
          speaker: narrator
          text: 宾恩和索尔特斯叔叔照迪斯科的吩咐收拾甲板，两个男孩却没能占到便宜。延绳桶才刚备好，汤姆·普拉特和长杰克已经提着灯，把小艇里里外外检查一遍。他们一把抢走那些桶，又装上几只小小的、涂了漆的延绳浮标。随后，两人把装得满满的小艇放下船去。那片海在哈维眼里，已经汹涌得吓人。
        - id: ch01-b193
          speaker: harvey
          text: 他们会淹死的！小艇装得简直像一节货车。
          emotion: fearful
        - id: ch01-b194
          speaker: long_jack
          text: 我们会回来的。可要是回来以后发现延绳缠了结，你们两个就等着我们收拾吧。
        - id: ch01-b195
          speaker: narrator
          text: 小艇冲上浪峰。眼看再也避不开双桅船的船舷，就要撞得粉碎，它却滑过浪脊，消失在潮湿的暮色里。
        - id: ch01-b196
          speaker: dan
          text: 抓住这个，一直稳稳地摇。
        - id: ch01-b197
          speaker: narrator
          text: 丹把绞盘后面那只铃的拉绳交给哈维。哈维使足力气摇起来，觉得那两个人的性命全系在自己手上。迪斯科却在舱房里写航海日志，一点也不像杀人凶手。去吃晚饭时，他甚至对满脸忧虑的哈维干笑了一下。
        - id: ch01-b198
          speaker: dan
          text: 这根本不算坏天气。你和我都能放那条延绳。他们只划到不会缠住锚缆的地方。其实连铃也不需要。
        - id: ch01-b199
          speaker: narrator
          text: 哈维还是当当当摇了半个钟头，偶尔又敲出一阵鼓点。船边忽然响起一声吼叫，接着砰地一撞。曼努埃尔和丹冲向吊索钩。长杰克和汤姆·普拉特仿佛同时落上甲板，背后各自带着半个北大西洋。小艇也跟着飞起来，哐啷落在船上。
        - id: ch01-b200
          speaker: tom_platt
          text: 一个结也没打。丹尼，你以后能成材。
        - id: ch01-b201
          speaker: long_jack
          text: 敬请赏光，赴宴入席。我们愿意纡尊降贵，出席宴会的下半场。
        - id: ch01-b202
          speaker: narrator
          text: 长杰克像一头大象似的蹦跳，把靴子里的水咕唧咕唧挤出来，又把一条裹着油布衣的胳膊伸到哈维脸前。四个人这才一起摇摇晃晃去吃晚饭。哈维一口接一口，把鱼杂烩和油炸馅饼塞得满肚子都是。曼努埃尔从柜里取出一艘两英尺长的精美模型，那是他的第一条船《露西·霍姆斯号》。他正要把模型上每一根绳指给哈维看，哈维却已经沉沉睡去。宾恩把男孩推进铺位时，他连一根手指也没有动。
        - id: ch01-b203
          speaker: penn
          text: 这一定很伤心，太伤心了。他的母亲和父亲都以为他死了。失去一个孩子，失去一个男孩！
          emotion: sad
        - id: ch01-b204
          speaker: dan
          text: 离开这儿吧，宾恩。去船尾跟索尔特斯叔叔把棋下完。告诉我爸，如果他不介意，我替哈维值班。他已经累垮了。
        - id: ch01-b205
          speaker: manuel
          text: 很好的孩子。我想他以后会长成好人，丹尼。我看不出他像你爸爸说的那么疯。对不对，怎——么样？
        - id: ch01-b206
          speaker: narrator
          text: 曼努埃尔脱掉靴子，隐进下铺的黑影里。丹咯咯一笑，可笑声马上变成了鼾声。
        - id: ch01-b207
          speaker: narrator
          text: 外面的雾越来越浓，风也渐渐起来。年长的男人都把自己的值班时间延长了。舱里的钟一小时一小时，清清楚楚地报过时辰。船头迎着海浪探出去，不住拍打、摩擦着海水。浪沫落在前舱炉管上，炉管便嘶嘶噗噗直响。两个男孩却始终没有醒。迪斯科、长杰克、汤姆·普拉特和索尔特斯叔叔轮流拖着沉重脚步走向船尾，查看舵轮，再一步步走到船头，看锚有没有抓牢，或者多放一点锚缆，免得来回摩擦。每巡完一圈，他们都要看一眼雾里那盏昏暗的锚灯。
