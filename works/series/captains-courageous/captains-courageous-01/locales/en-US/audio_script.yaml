  chapters:
    - id: ch01
      title: CHAPTER I
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The weather door of the smoking room stood open to the North Atlantic fog. The great liner rolled and lifted through it, sounding her whistle to warn the fishing fleet.
        - id: ch01-b02
          speaker: frieze_man
          text: That Cheyne boy is the worst nuisance aboard. Nobody wants him in here. He's far too forward.
        - id: ch01-b03
          speaker: narrator
          text: The man in the frieze coat slammed the door shut. A white-haired German reached for a sandwich and spoke between bites.
        - id: ch01-b04
          speaker: mr_schaefer
          text: I know the type. America is full of boys like that. Your tariff ought to let you import rope ends for free.
        - id: ch01-b05
          speaker: mr_martin
          text: Oh, there's no real harm in him. I mostly feel sorry for the boy. They've hauled him from hotel to hotel since he was little. I spoke to his mother this morning. She's a lovely woman, but she doesn't even try to control him. Now she's taking him to Europe to finish his education.
        - id: ch01-b06
          speaker: narrator
          text: Mr. Martin of New York stretched along the cushions beneath the wet skylight. A Philadelphian sat curled in a corner.
        - id: ch01-b07
          speaker: philadelphian
          text: Finish it? His education hasn't started. He told me he gets two hundred dollars a month for spending money, and he isn't even sixteen.
        - id: ch01-b08
          speaker: mr_schaefer
          text: His father owns railroads, doesn't he?
        - id: ch01-b09
          speaker: philadelphian
          text: Railroads, mines, lumber, and ships. The old man built one place in San Diego and another in Los Angeles. He owns half a dozen railroads and half the lumber on the Pacific coast, and his wife spends the money. She says the West doesn't suit her, so she travels around with the boy and her nerves, always hunting for something to amuse him. Florida, the Adirondacks, Lakewood, Hot Springs, New York, then around again. By now he's little more than a secondhand hotel clerk. After Europe, he'll be a perfect terror.
        - id: ch01-b10
          speaker: frieze_man
          text: Why doesn't the old man look after his own son?
        - id: ch01-b11
          speaker: philadelphian
          text: He's busy piling up money and doesn't want to be bothered. He'll learn his mistake in a few years. It's a pity, too. There's plenty of good in the boy if anyone could reach it.
        - id: ch01-b12
          speaker: mr_schaefer
          text: Reach it with a rope end. A good rope end!
        - id: ch01-b13
          speaker: narrator
          text: The door banged again. A slim boy of about fifteen leaned over the high step with a half-smoked cigarette at one corner of his mouth. His face was an unhealthy yellow. He looked uncertain and bold at once, with a cheap sort of cleverness. He wore a cherry-red blazer, short trousers, red stockings, bicycle shoes, and a red flannel cap pushed to the back of his head. He whistled through his teeth and looked over the company.
        - id: ch01-b14
          speaker: harvey
          text: Say, it's thick out there. You can hear the fishing boats crying all around us. Wouldn't it be something if we ran one down?
        - id: ch01-b15
          speaker: mr_martin
          text: Shut the door, Harvey. Then stay outside. We don't want you in here.
        - id: ch01-b16
          speaker: harvey
          text: Who's going to stop me? Did you buy my ticket, Mr. Martin? I've got as much right to be here as anyone.
        - id: ch01-b17
          speaker: narrator
          text: Harvey picked up the dice from a checkerboard and threw with his right hand against his left.
        - id: ch01-b18
          speaker: harvey
          text: Gentlemen, this is dead dull. Why don't we start a poker game?
        - id: ch01-b19
          speaker: narrator
          text: No one answered. Harvey smoked, swung his legs, drummed dirty fingers on the table, and finally pulled out a roll of bills to count.
        - id: ch01-b20
          speaker: passenger
          text: How is your mother this afternoon? I didn't see her at lunch.
        - id: ch01-b21
          speaker: harvey
          text: In her stateroom, I suppose. She's almost always sick at sea. I'm giving the stewardess fifteen dollars to look after her. I stay away from downstairs when I can. Passing that butler's-pantry place makes me feel strange. This is my first ocean trip, you know.
        - id: ch01-b22
          speaker: passenger
          text: No need to apologize, Harvey.
        - id: ch01-b23
          speaker: harvey
          text: I'm not apologizing. It's my first time across the ocean, gentlemen, and except for the first day, I haven't been sick at all. Not once!
        - id: ch01-b24
          speaker: narrator
          text: He struck the table triumphantly, wet one finger, and went on counting his money.
        - id: ch01-b25
          speaker: philadelphian
          text: You're a first-class machine, all right, and the label is easy to read. If you're not careful, you'll grow into a credit to your country.
        - id: ch01-b26
          speaker: harvey
          text: I know I will. I'm American from beginning to end. Europe will find that out when I get there. Piff! My cigarette's gone out. I can't smoke the rubbish the steward sells. Has any gentleman here got a real Turkish cigarette?
        - id: ch01-b27
          speaker: narrator
          text: The chief engineer stepped in for a moment, red-faced, smiling, and wet.
        - id: ch01-b28
          speaker: harvey
          text: Hey, Mac! How are we making out?
        - id: ch01-b29
          speaker: chief_engineer
          text: In the usual way. Young people are as polite as ever to their elders, and the elders are doing their best to appreciate it.
        - id: ch01-b30
          speaker: narrator
          text: Someone chuckled softly in a corner. Mr. Schaefer opened his cigar case and offered Harvey a thin black cigar.
        - id: ch01-b31
          speaker: mr_schaefer
          text: This is the proper thing for you to smoke, my young friend. You'll try it, yes? Then you'll be very happy.
        - id: ch01-b32
          speaker: narrator
          text: Harvey lit the ugly thing with a flourish. He thought he was being accepted among grown men.
        - id: ch01-b33
          speaker: harvey
          text: It would take more than this to knock me over.
        - id: ch01-b34
          speaker: narrator
          text: He had no idea that he was smoking a terrible Wheeling stogie.
        - id: ch01-b35
          speaker: mr_schaefer
          text: We shall soon see. Where are we now, Mr. Macdonald?
        - id: ch01-b36
          speaker: chief_engineer
          text: Here or hereabouts, Mr. Schaefer. We'll reach the Grand Bank tonight, but generally speaking, we're already among the fishing fleet. Since noon we've barely missed three dories and nearly carried away a Frenchman's boom. You might call that close sailing.
        - id: ch01-b37
          speaker: mr_schaefer
          text: You like my cigar, eh?
        - id: ch01-b38
          speaker: narrator
          text: Harvey's eyes were streaming with tears.
        - id: ch01-b39
          speaker: harvey
          text: Fine. Full flavor. Haven't we slowed down a little? I'll go see what the log says.
        - id: ch01-b40
          speaker: mr_schaefer
          text: I would, if I were you.
        - id: ch01-b41
          speaker: narrator
          text: Harvey staggered across the wet deck toward the nearest rail. He felt wretched, but the deck steward was there, tying the chairs together. Harvey had already boasted to that man that he never got seasick. Pride sent him farther aft instead, toward the empty second-saloon deck at the stern. Its rounded roof curved like a turtle's back.
        - id: ch01-b42
          speaker: narrator
          text: He crawled all the way to the end near the flagpole and folded over in misery. The Wheeling stogie joined forces with the heaving sea and the pounding of the ship's screw. Together they seemed to shake the very life out of him. His head swelled. Fiery sparks danced before his eyes. His body felt as if it had lost all its weight, and his heels wavered in the wind.
        - id: ch01-b43
          speaker: narrator
          text: Harvey was fainting from seasickness when the ship rolled and tipped him across the rail onto the smooth edge of the turtle-back. Then a low gray mother-wave came swinging out of the fog. It tucked Harvey under one arm, so to speak, and drew him off to leeward. The great green water closed above him, and he quietly fell asleep.
        - id: ch01-b44
          speaker: narrator
          text: A dinner horn woke him, the same kind he remembered from a summer school in the Adirondacks. Slowly, Harvey recalled who he was. He decided he must have drowned and died in the middle of the ocean, though he was too weak to make sense of anything. A strange smell filled his nose. Cold wetness crept down his back, and he was helplessly full of salt water.
        - id: ch01-b45
          speaker: narrator
          text: When he opened his eyes, the sea still rose around him in silver-colored hills. He lay on a heap of half-dead fish and stared at a broad back in a blue jersey.
        - id: ch01-b46
          speaker: harvey
          text: It's no use. I'm certainly dead, and this creature is in charge of me.
        - id: ch01-b47
          speaker: narrator
          text: Harvey groaned. The figure turned, and little gold earrings showed beneath curly black hair.
        - id: ch01-b48
          speaker: manuel
          text: Ah, you feel a little better now? Keep lying still. The boat balances better that way.
        - id: ch01-b49
          speaker: narrator
          text: With one quick pull of his oar, the man turned the flickering bow toward a smooth rise of water. The little boat climbed a full twenty feet, then slipped down into the glassy hollow beyond. Harvey felt as though they were climbing mountains, but even that rise and fall did not interrupt the man's talk.
        - id: ch01-b50
          speaker: manuel
          text: Very good thing I caught you, eh? Better still that your ship did not catch me. How did you fall out?
        - id: ch01-b51
          speaker: harvey
          text: I was sick. I couldn't help it.
        - id: ch01-b52
          speaker: manuel
          text: I blew my horn just in time, and your ship turned a little. Then I saw you come down. I thought the screw would cut you into bait. But you drifted toward me, and I pulled you in like a big fish. You will not die this time.
        - id: ch01-b53
          speaker: harvey
          text: Where am I?
        - id: ch01-b54
          speaker: narrator
          text: From where he lay, Harvey could not see much safety in being alive.
        - id: ch01-b55
          speaker: manuel
          text: You are in my dory. My name is Manuel, and I come from the Gloucester schooner We're Here. I live in Gloucester too. We will have supper after a while, eh?
        - id: ch01-b56
          speaker: narrator
          text: Manuel seemed to have four hands and a head made of iron. Rowing and talking were not enough for him. He raised a great conch shell and stood upright in the flat-bottomed dory as it swayed with the water. Then he sent a harsh, grinding cry from the shell and out through the fog.
        - id: ch01-b57
          speaker: narrator
          text: Harvey never knew how long the calling went on. He lay back among the fish, terrified whenever the smoking swells lifted around him. Somewhere in the fog he thought he heard a gun, another horn, and men shouting. At last, something much larger than the dory, though every bit as lively on the water, rose beside them. Several voices spoke at once. Harvey was passed from hand to hand and lowered into a dark, heaving space. Men in oilskins gave him a hot drink, stripped away his wet clothes, and let him fall asleep.
        - id: ch01-b58
          speaker: narrator
          text: When Harvey woke, he lay listening for the steamer's first breakfast bell. For a moment, he wondered why his stateroom had become so very small. He turned his head and found himself in a narrow cabin shaped like a three-cornered cave. A lamp hung against a massive square beam. Close enough for him to touch, a triangular table ran from the point of the bow back to the foremast.
        - id: ch01-b59
          speaker: narrator
          text: At the far end, beyond a battered stove, sat a boy about Harvey's age. He had a broad red face, lively gray eyes, a blue jersey, and tall rubber boots. More boots, an old cap, and worn wool socks covered the floor. Black and yellow oilskins swung beside the bunks.
        - id: ch01-b60
          speaker: narrator
          text: The little cabin was packed as tightly with smells as a bale is packed with cotton. The heavy smell of oilskins lay beneath fried fish, burned grease, paint, pepper, and stale tobacco. Around every one of those odors ran the smell of ship and salt water. Harvey looked at his bunk with disgust. There were no sheets beneath him, only a piece of dingy mattress ticking full of hard lumps and bumps.
        - id: ch01-b61
          speaker: narrator
          text: This boat did not move like a steamer either. She neither slid forward nor rolled from side to side. Instead, she wriggled about without purpose, like a young colt tugging at the end of its halter. Water hurried past very close to Harvey's ear. All around him, the heavy beams creaked and whined with the motion. The sounds, smells, and strange movement made him groan in despair and think of his mother.
        - id: ch01-b62
          speaker: dan
          text: Feeling any better? Want some coffee?
        - id: ch01-b63
          speaker: narrator
          text: Grinning, the boy brought him a tin cup of coffee sweetened with molasses.
        - id: ch01-b64
          speaker: harvey
          text: Don't you have any milk?
        - id: ch01-b65
          speaker: narrator
          text: Harvey searched the two dark rows of bunks as though a cow might be hiding there.
        - id: ch01-b66
          speaker: dan
          text: No, and we won't have any before the middle of September. The coffee isn't bad. I made it myself.
        - id: ch01-b67
          speaker: narrator
          text: Harvey drank without answering. Then the boy handed him a plate of crisp fried pork, and Harvey ate it hungrily.
        - id: ch01-b68
          speaker: dan
          text: I dried your clothes, though they may have shrunk. They sure aren't the kind we wear. Turn around and see if anything hurts.
        - id: ch01-b69
          speaker: narrator
          text: Harvey stretched and twisted, but found no injury.
        - id: ch01-b70
          speaker: dan
          text: Good. Get dressed and go on deck. Dad wants to see you. I'm his son. Folks call me Dan. I help the cook and do every job too dirty for the men. I'm the only boy aboard since Otto went over the side, though he was Dutch and twenty years old. How did you fall off your ship in a dead calm?
        - id: ch01-b71
          speaker: harvey
          text: It was not calm. There was a gale, and I was seasick. I suppose I rolled over the rail.
        - id: ch01-b72
          speaker: dan
          text: Yesterday and last night brought a little ordinary swell. If you call that a gale, though... Well, you'll learn better before this trip is over. Hurry up. Dad is waiting.
        - id: ch01-b73
          speaker: narrator
          text: Harvey had never been given a plain order in his life. At least, no one had ordered him about without a long explanation of why obedience would be good for him and why the request had been made. Sometimes those explanations had even ended in tears. His mother lived in fear of breaking his spirit, perhaps because guarding it had brought her own nerves close to collapse. So Harvey saw no reason why he should hurry merely because another person wanted him to.
        - id: ch01-b74
          speaker: harvey
          text: If your father wants to talk so badly, he can come down here. I want him to take me straight to New York. It'll be worth his while.
        - id: ch01-b75
          speaker: narrator
          text: Dan's eyes widened as he understood the magnificent joke.
        - id: ch01-b76
          speaker: dan
          text: Dad! He says you can come down here if you're so eager to see him. Did you hear that, Dad?
        - id: ch01-b77
          speaker: disko
          text: Stop fooling, Dan, and send him up to me.
        - id: ch01-b78
          speaker: narrator
          text: The reply came in the deepest voice Harvey had ever heard from a human chest. Dan snickered and tossed him his bicycle shoes, now twisted out of shape from being soaked and dried. Something in the voice above made Harvey hide the full force of his anger. He comforted himself by planning how he would unfold the story of his own wealth and his father's, little by little, during the voyage home. And this rescue would surely make him a hero among his friends for the rest of his life.
        - id: ch01-b79
          speaker: narrator
          text: Harvey pulled himself up a ladder that rose straight to the deck, then stumbled aft over one obstacle after another. A short, solidly built man sat on a step leading to the quarterdeck. He was clean-shaven and had gray eyebrows. The swell had passed during the night, leaving a long, oily sea. Around the whole horizon stood the sails of a dozen fishing boats. Between those sails, little black specks marked the dories that were out fishing.
        - id: ch01-b80
          speaker: narrator
          text: The schooner rode easily at anchor under a small triangular sail on the mainmast. Apart from the man beside the cabin roof, which sailors called the house, the deck was empty.
        - id: ch01-b81
          speaker: disko
          text: Morning. No, I should say good afternoon. You've slept nearly all the way around the clock, young fellow.
        - id: ch01-b82
          speaker: harvey
          text: Morning.
        - id: ch01-b83
          speaker: narrator
          text: Harvey disliked being called young fellow. After nearly drowning, he had expected sympathy. His mother suffered terribly whenever he so much as got his feet wet, but this sailor showed no excitement at all.
        - id: ch01-b84
          speaker: disko
          text: Now tell me the whole thing. It was providential for everyone, from start to finish. What's your name? Where are you from? New York, we reckon. And where were you headed? Europe, most likely.
        - id: ch01-b85
          speaker: narrator
          text: Harvey gave his name, named the steamer, and briefly told how he had fallen overboard. Then he demanded to be taken straight back to New York. His father, he said, would pay any price they asked.
        - id: ch01-b86
          speaker: disko
          text: Hmm. We don't think much of a man, or even a boy, who falls off that kind of ship in a flat calm. Not when he says seasickness made him do it.
        - id: ch01-b87
          speaker: harvey
          text: Says? Do you think I jumped into your filthy little boat for amusement?
        - id: ch01-b88
          speaker: disko
          text: I don't know what you call amusement, young fellow. But I wouldn't insult the boat that Providence used to save you. For one thing, that's downright irreligious. For another, it hurts my feelings. I'm Disko Troop of the Gloucester schooner We're Here, though that doesn't seem to mean much to you.
        - id: ch01-b89
          speaker: harvey
          text: I don't know, and I don't care. Of course I'm grateful you saved me. But the sooner you take me to New York, the more money you'll make.
        - id: ch01-b90
          speaker: disko
          text: What do you mean by that?
        - id: ch01-b91
          speaker: narrator
          text: Disko lifted one shaggy eyebrow over a blue eye that looked suspiciously mild.
        - id: ch01-b92
          speaker: harvey
          text: Dollars. Real dollars and cents.
        - id: ch01-b93
          speaker: narrator
          text: Delighted that he was making an impression, Harvey reached into a pocket and pushed out his stomach grandly.
        - id: ch01-b94
          speaker: harvey
          text: Pulling me aboard was the best day's work you've ever done. I'm Harvey Cheyne's only son.
        - id: ch01-b95
          speaker: disko
          text: Your father has been greatly favored.
        - id: ch01-b96
          speaker: harvey
          text: If you don't know who Harvey Cheyne is, then you don't know much. Turn this boat around, and hurry.
        - id: ch01-b97
          speaker: narrator
          text: Harvey imagined that most of America spent its time talking about and envying his father's money.
        - id: ch01-b98
          speaker: disko
          text: Maybe I know him and maybe I don't. Pull in that stomach, young fellow. It's full of my food.
        - id: ch01-b99
          speaker: narrator
          text: Dan chuckled while pretending to work near the stump of the foremast. Harvey flushed.
        - id: ch01-b100
          speaker: harvey
          text: We'll pay for the food too. When will we reach New York?
        - id: ch01-b101
          speaker: disko
          text: I don't go to New York, or Boston either. We might see Eastern Point around September. Your father, whom I'm sorry to say I've never heard of, may give me ten dollars after all this talk. Then again, he may not.
        - id: ch01-b102
          speaker: harvey
          text: Ten dollars? Look here, I—
        - id: ch01-b103
          speaker: narrator
          text: Harvey plunged a hand into his pocket for his roll of bills. He found only a wet packet of cigarettes.
        - id: ch01-b104
          speaker: disko
          text: Those aren't legal money, and they're bad for your lungs. Throw them overboard and look again.
        - id: ch01-b105
          speaker: harvey
          text: Someone stole it!
          emotion: angry
        - id: ch01-b106
          speaker: disko
          text: Then you'll have to wait until you see your father before you can reward me.
        - id: ch01-b107
          speaker: harvey
          text: A hundred and thirty-four dollars, all stolen! Give it back!
          emotion: angry
        - id: ch01-b108
          speaker: narrator
          text: Harvey searched every pocket. A strange look crossed Disko's hard face.
        - id: ch01-b109
          speaker: disko
          text: What were you doing with a hundred and thirty-four dollars at your age?
        - id: ch01-b110
          speaker: harvey
          text: It was only part of my spending money for this month.
        - id: ch01-b111
          speaker: narrator
          text: Harvey expected that answer to settle everything. In a way, it did.
        - id: ch01-b112
          speaker: disko
          text: Oh! So a hundred and thirty-four dollars was only part of one month's spending money. Did you strike your head when you fell? Hit a post, perhaps? Old Hasken of the East Wind once tripped on a hatch and struck the mainmast hard with his head. Three weeks later, he insisted his fishing boat was a warship and declared war on Sable Island for being British and having shoals that reached too far out. They kept him sewn in a bed sack for the rest of the voyage, with only his head and feet showing. Now he's home in Essex playing with little rag dolls.
        - id: ch01-b113
          speaker: narrator
          text: Harvey nearly choked with rage, but Disko spoke as if he were offering comfort.
        - id: ch01-b114
          speaker: disko
          text: We feel very sorry for you, especially at your age. I suppose we'd better say no more about the money.
        - id: ch01-b115
          speaker: harvey
          text: Of course you won't. You stole it.
        - id: ch01-b116
          speaker: disko
          text: Have it your way. If it comforts you, then we stole it. Now, about going back. Even if we could turn around, and we can't, you're in no condition to go home. We've only just reached the Banks, and we have to earn our bread. None of us sees fifty dollars a month, never mind spending money. With luck, we'll reach shore in the first weeks of September.
        - id: ch01-b117
          speaker: harvey
          text: But it's May! I can't stay here doing nothing just because you want to fish. I can't!
          emotion: angry
        - id: ch01-b118
          speaker: disko
          text: Fair enough. No one is asking you to do nothing. There's plenty of work since Otto went overboard on Le Have. I reckon he lost his grip in a gale, and he never came back to tell us different. Then you appeared, which looks providential for everyone. Still, I doubt you know how to do much. Am I right?
        - id: ch01-b119
          speaker: harvey
          text: When we get ashore, I can make plenty of trouble for you and your crew.
        - id: ch01-b120
          speaker: narrator
          text: He nodded viciously and muttered threats about piracy. Disko came close to smiling, but not quite.
        - id: ch01-b121
          speaker: disko
          text: You can talk. I forgot that. Still, nobody aboard the We're Here will ask you to talk more than you please. Keep your eyes open, help Dan when you're told, and do whatever else needs doing. You're not worth it yet, but I'll pay you ten and a half dollars a month. That makes thirty-five dollars at the end of the trip. Work may straighten out your head. You can tell us about your father, mother, and money afterward.
        - id: ch01-b122
          speaker: harvey
          text: My mother is still on the steamer. Take me to New York now.
          emotion: sad
        - id: ch01-b123
          speaker: narrator
          text: Tears filled Harvey's eyes.
        - id: ch01-b124
          speaker: disko
          text: Poor woman. Once she has you back, she'll forget all this. But there are eight of us aboard, and New York is more than a thousand miles away. If we turned back now, we'd lose the season. Even if I agreed, the men would not.
        - id: ch01-b125
          speaker: harvey
          text: My father would repay all of you.
        - id: ch01-b126
          speaker: disko
          text: I'm sure he'd try. But one season's catch feeds eight men. You'll be healthier when you see him in the fall. Go forward and help Dan. Like I said, you'll get ten and a half a month, with food and a bunk like everyone else.
        - id: ch01-b127
          speaker: harvey
          text: You mean I have to scrub pots and pans and things?
        - id: ch01-b128
          speaker: disko
          text: And other things. There's no need to shout.
        - id: ch01-b129
          speaker: harvey
          text: I won't do it! My father will pay enough to buy this filthy little fish kettle ten times over if you take me safely to New York. Besides, you already owe me a hundred and thirty dollars.
          emotion: angry
        - id: ch01-b130
          speaker: narrator
          text: Harvey stamped on the deck. Disko's iron face darkened.
        - id: ch01-b131
          speaker: disko
          text: How do you figure that?
        - id: ch01-b132
          speaker: harvey
          text: You know perfectly well. And now you expect me to do menial work until fall. I will not. Do you hear me?
          emotion: angry
        - id: ch01-b133
          speaker: narrator
          text: While Harvey raged around him, Disko studied the top of the mainmast with great interest.
        - id: ch01-b134
          speaker: disko
          text: Hush. I'm considering my responsibilities. This calls for judgment.
        - id: ch01-b135
          speaker: narrator
          text: Dan slipped closer and tugged Harvey's elbow.
        - id: ch01-b136
          speaker: dan
          text: Don't push Dad any further. You've called him a thief two or three times, and he won't take that from anyone alive.
        - id: ch01-b137
          speaker: harvey
          text: I won't do it!
          emotion: angry
        - id: ch01-b138
          speaker: narrator
          text: Harvey nearly screamed the words and ignored the warning. Disko kept thinking.
        - id: ch01-b139
          speaker: disko
          text: It may seem unfriendly, but I don't blame you one bit, young fellow. You won't blame me either after the anger is out of you. Make sure you understand. I'll pay ten and a half dollars a month for you to serve as second boy. Your food and bunk are included. You'll learn the work, and it'll improve your health. Yes or no?
        - id: ch01-b140
          speaker: harvey
          text: No! Take me back to New York, or I'll see you—
          emotion: angry
        - id: ch01-b141
          speaker: narrator
          text: Harvey never quite remembered what happened next. One moment he was shouting his threat. The next, he was lying in the scuppers at the edge of the deck, holding a nose that had begun to bleed. Disko stood over him and looked down with perfect calm.
        - id: ch01-b142
          speaker: disko
          text: Dan, I judged this young fellow too quickly when I first saw him. Never let quick judgments lead you astray. Now I feel sorry for him. His mind is plainly confused, so he isn't responsible for calling me names, making those claims, or jumping overboard, which I'm now half convinced he did. Treat him gently, Dan, or I'll give you twice what I gave him. A nosebleed clears the head. Let him wash it off.
        - id: ch01-b143
          speaker: narrator
          text: Disko went solemnly below to the cabin where he bunked with the older men. He left Dan to comfort the unfortunate heir to thirty million dollars.
