audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着而略带讥诮的讲述
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中音
    overcoat_man:
      display_name: 粗呢大衣客人
      tts:
        delivery: 不耐烦而直率
        timbre: 粗厚
        pace: 中速
        pitch: 中低音
    schaefer:
      display_name: 谢弗先生
      tts:
        delivery: 带德国口音的干涩调侃
        timbre: 苍老而浑厚
        pace: 稍慢
        pitch: 低音
    martin:
      display_name: 马丁先生
      tts:
        delivery: 懒散而宽厚
        timbre: 圆润
        pace: 舒缓
        pitch: 中音
    philadelphian:
      display_name: 费城客人
      tts:
        delivery: 漫不经心而尖刻
        timbre: 清朗偏薄
        pace: 中速
        pitch: 中音
    passenger:
      display_name: 船上客人
      tts:
        delivery: 随意而好奇
        timbre: 平实
        pace: 中速
        pitch: 中音
    harvey:
      display_name: 哈维
      tts:
        delivery: 少年人的高声逞强与任性
        timbre: 清亮偏尖
        pace: 稍快
        pitch: 中高音
    macdonald:
      display_name: 麦克唐纳
      tts:
        delivery: 一本正经而暗含讽刺
        timbre: 厚实
        pace: 稳健
        pitch: 中低音
    manuel:
      display_name: 曼努埃尔
      tts:
        delivery: 带葡萄牙口音的热情直爽
        timbre: 明亮结实
        pace: 中速略跳跃
        pitch: 中音
    dan:
      display_name: 丹
      tts:
        delivery: 朴实活泼的渔家少年口吻
        timbre: 年轻而爽朗
        pace: 稍快
        pitch: 中高音
    disko:
      display_name: 迪斯科·特鲁普
      tts:
        delivery: 克制威严且带冷幽默
        timbre: 深沉坚硬
        pace: 缓慢稳重
        pitch: 低音
  chapters:
    - id: ch01
      title: 第一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 北大西洋的雾从敞开的门里直灌进吸烟室。巨轮在海面上一起一落，每次穿过捕鱼船队，都拉响汽笛警告雾中的小船。一个穿粗呢大衣的客人忍不住了，起身砰地关上门，先抱怨起船上的哈维·切恩。
        - id: ch01-b02
          speaker: overcoat_man
          text: 切恩家那小子是全船最大的麻烦。没人愿意他待在这里，他实在太放肆了。
        - id: ch01-b03
          speaker: narrator
          text: 白发的谢弗先生拿起一块三明治，嚼着东西，含混地哼了一声。
        - id: ch01-b04
          speaker: schaefer
          text: 这种孩子我见多了，美国到处都有。你们的关税应该让鞭梢子免费进口，好好教训他们。
        - id: ch01-b05
          speaker: martin
          text: 算了吧，他并没有什么坏心，倒是很可怜。从小到大，大人带着他从一家旅馆转到另一家旅馆，从没让他过过安稳日子。我今天早晨跟他母亲谈过。她是一位很可爱的太太，可连她自己也不装作管得住儿子。现在又要送他去欧洲，说是去完成教育。
        - id: ch01-b06
          speaker: philadelphian
          text: 什么完成教育，他的教育根本还没开始。那小子不到十六岁，每个月已经有两百美元零花钱，这是他亲口说的。
        - id: ch01-b07
          speaker: schaefer
          text: 他父亲是不是靠铁路发财的？
        - id: ch01-b08
          speaker: philadelphian
          text: 铁路只是一样，还有矿山、木材和航运。老头子在圣迭戈和洛杉矶都盖了宅子，名下有好几条铁路，还掌握着太平洋沿岸一半的木材生意，赚来的钱尽管让妻子花。她嫌西部不合意，就带着儿子和自己那副紧张的神经四处转，看哪里能让孩子开心。佛罗里达、阿迪朗达克、莱克伍德、温泉城、纽约，转完再来一遍。如今那孩子只学会了一身二流旅馆柜台伙计的派头。等他从欧洲回来，就真要成灾星了。
        - id: ch01-b09
          speaker: overcoat_man
          text: 他父亲怎么不亲自管他？
        - id: ch01-b10
          speaker: philadelphian
          text: 老头子正忙着堆金山，不想让人打扰。过几年他会知道自己错在哪儿。可惜了，那孩子本来有不少长处，只是没人把它们引出来。
        - id: ch01-b11
          speaker: schaefer
          text: 用鞭梢子引！鞭梢子最管用！
        - id: ch01-b12
          speaker: narrator
          text: 门又砰地响了。一个约莫十五岁的瘦削男孩越过高门槛，探身进来，嘴角吊着半支香烟。他脸色蜡黄，这样的气色落在少年脸上格外难看。那副神情既犹疑，又逞强，还硬要装出几分廉价的世故。樱桃红上衣、灯笼裤、红袜子、自行车鞋，再加后脑勺那顶红法兰绒帽，让他显得越发扎眼。他从牙缝里吹了声口哨，扫视众人。
        - id: ch01-b13
          speaker: harvey
          text: 外面的雾真够大的。四周那些渔船都在呜呜叫。要是咱们撞沉一条，那才有意思呢！
        - id: ch01-b14
          speaker: martin
          text: 哈维，把门关上，出去待着。这里不欢迎你。
        - id: ch01-b15
          speaker: harvey
          text: 谁能赶我走？马丁先生，又不是你替我付的船票。我跟别人一样，有权待在这儿。
        - id: ch01-b16
          speaker: narrator
          text: 他从西洋棋盘上拿起几颗骰子，让右手跟左手互相赌了几把，又嫌吸烟室比烂泥还沉闷，问先生们要不要凑一桌扑克。还是没人回答。他一面喷烟，一面晃着两条腿，还用不大干净的手指在桌上敲鼓。见众人仍不理睬，他又掏出一卷钞票，故意当着大家的面慢慢数起来。
        - id: ch01-b17
          speaker: passenger
          text: 你母亲下午还好吗？午饭时没看见她。
        - id: ch01-b18
          speaker: harvey
          text: 她大概还在客舱里。坐海船，她差不多每次都病。我准备给女乘务员十五美元，请她照看母亲。我自己能不下去就不下去，经过那个像管家食品间的地方，身体就怪不舒服的。对了，这是我第一次坐海船。
        - id: ch01-b19
          speaker: passenger
          text: 不用道歉，哈维。
        - id: ch01-b20
          speaker: harvey
          text: 我哪有道歉？先生们，这是我头一次横渡大西洋。除了第一天，我根本没晕过船，一点都没有！
        - id: ch01-b21
          speaker: narrator
          text: 他得意地捶了一下桌子，舔舔手指，又数起钱来。
        - id: ch01-b22
          speaker: philadelphian
          text: 你真是一台上等机器，什么货色全写在外壳上了。照这样长下去，你准能替国家增光。
        - id: ch01-b23
          speaker: harvey
          text: 我当然知道。我从头到脚都是美国人，一辈子都是。等到了欧洲，我会叫他们见识见识。哎，烟灭了。乘务员卖的破烟我才不抽。哪位先生有真正的土耳其香烟？
        - id: ch01-b24
          speaker: narrator
          text: 轮机长麦克唐纳走进来。他浑身湿透，脸冻得发红，神情倒很快活。哈维亲热地问船开得如何。
        - id: ch01-b25
          speaker: macdonald
          text: 再正常不过。年轻人还是一向那么尊敬长辈，长辈也还在努力领受这份敬意。
        - id: ch01-b26
          speaker: narrator
          text: 角落里立刻有人低声发笑。谢弗先生像是想起了一个好主意，打开自己的雪茄盒，递给哈维一支又细又长、颜色乌黑的雪茄。
        - id: ch01-b27
          speaker: schaefer
          text: 年轻朋友，这才是你该抽的东西。试一试吧，抽过以后，你一定快活极了。
        - id: ch01-b28
          speaker: narrator
          text: 哈维摆足架势点燃那根难看的黑东西，觉得自己终于进了成年人的圈子，也开始受大人们认真对待。他还不知道，嘴里点燃的正是厉害得吓人的惠灵粗雪茄。
        - id: ch01-b29
          speaker: harvey
          text: 这点东西可放不倒我。
        - id: ch01-b30
          speaker: schaefer
          text: 马上就知道了。麦克唐纳先生，我们到什么地方了？
        - id: ch01-b31
          speaker: macdonald
          text: 就在那一带。今晚会到大浅滩。笼统地说，我们现在已经闯进捕鱼船队中间。从中午起，船紧贴着擦过三只小艇，还差点把一条法国船的帆桁顶端整个削掉。开成这个样子，足以说明航路有多拥挤了。
        - id: ch01-b32
          speaker: schaefer
          text: 我的雪茄滋味不错吧？
        - id: ch01-b33
          speaker: harvey
          text: 味道醇厚，劲也足。咱们是不是减速了？我到外面看看航速记录。
        - id: ch01-b34
          speaker: schaefer
          text: 要是我，也会赶紧出去。
        - id: ch01-b35
          speaker: narrator
          text: 哈维踉踉跄跄走过湿甲板，本想扑向最近的栏杆，却看见甲板乘务员正在捆椅子。他刚向那人吹过牛，说自己绝不会晕船，眼下哪怕难受得要命，也不肯在那里示弱。他只得硬撑着一直走到船尾。二等舱甲板的末端隆得像龟背，那里一个人也没有。哈维爬到最远处的旗杆旁，软软地缩成一团。粗雪茄的烟劲、涌浪的冲击和螺旋桨一阵阵的震动合在一起，像要把灵魂从身体里筛出去。他的脑袋越胀越大，眼前火星乱舞，身子好像突然没了分量，两只脚后跟也在风里摇摆。接着，他晕了过去。船身一歪，把他滚过栏杆，送到光滑的龟背边沿。一道低低的灰浪从雾里涌出，像母亲伸臂抱起孩子一样夹住哈维，把他带离大船，拖向下风。绿色海水在头顶合拢，他安静地失去了知觉。
        - id: ch01-b36
          speaker: narrator
          text: 后来，一阵开饭号把他唤醒。那声音让他记起阿迪朗达克暑期学校的日子，接着才一点点想起自己是谁。他是哈维·切恩，已经淹死在大洋中央。可他虚弱得连这些念头都接不起来，也弄不明白眼前究竟是什么地方。陌生的气味钻进鼻子，湿冷黏腻的寒意顺着背往下流，肚里满是咸海水。睁眼一看，他竟还在海面上，银色的浪头像一座座山围着他。他躺在一堆半死的鱼上，正望着一副套在蓝针织衫里的宽阔脊背。
        - id: ch01-b37
          speaker: harvey
          text: 这下完了。我确实已经死了，前面那个东西就是管死人的。
        - id: ch01-b38
          speaker: narrator
          text: 哈维呻吟起来。那人回过头，卷曲的黑发里露出两只小金耳环。
        - id: ch01-b39
          speaker: manuel
          text: 啊哈，现在好些了吗？别动，就这么躺着，船会稳一点。
        - id: ch01-b40
          speaker: narrator
          text: 曼努埃尔猛地一桨，把不断晃动的船头拨向一片没有泡沫的海面。浪峰把小艇足足托高二十英尺，转眼又让它滑入另一边玻璃似的深谷。这样翻山越岭，丝毫没有打断他的话头。
        - id: ch01-b41
          speaker: manuel
          text: 我捞到你，真是太好了。更好的是，你的大船没有撞上我。你到底怎么会掉下来？
        - id: ch01-b42
          speaker: harvey
          text: 我病得厉害，实在没办法。
        - id: ch01-b43
          speaker: manuel
          text: 我正好在吹号，你那条船偏了一下，我就看见你从上面掉下来。我以为螺旋桨会把你切成鱼饵，可你一直漂，漂到了我这里。我把你当成一条大鱼捞上船。这一次，你不会死啦。
        - id: ch01-b44
          speaker: harvey
          text: 我到底在哪儿？
        - id: ch01-b45
          speaker: manuel
          text: 你在我的小艇里。我叫曼努埃尔，是格洛斯特《我们在这儿号》上的人，我家也在格洛斯特。过一会儿就有晚饭吃了。
        - id: ch01-b46
          speaker: narrator
          text: 曼努埃尔仿佛长了四只手，还有一颗铸铁脑袋。他一边操纵小艇，一边拿起大海螺吹号，这样还不够，竟随着平底船的摆动站起身，让一阵碾磨般、突突作响的尖啸穿过浓雾。哈维望着四周冒烟似的浪头，吓得仰面躺倒，不知道这情形持续了多久。雾里似乎先后响过枪声、号角和喊叫。一个比小艇大得多、也一样活蹦乱跳的船身靠了上来。许多人同时开口。接着，哈维被人放进一个黑暗而摇晃的舱里。几个穿油布衣的男人给他灌下热饮，脱去湿衣，他很快又睡着了。
        - id: ch01-b47
          speaker: narrator
          text: 再醒来时，哈维还侧耳等着汽船的第一遍早餐铃。他不懂自己的客舱为什么忽然这么狭小。眼前其实是一间三角形的水手舱，粗大的方梁上挂着一盏灯，一张触手可及的三角桌从船头尖角伸到前桅。后面是用旧的普利茅斯炉子，炉旁坐着一个与他同龄的男孩。男孩长着一张扁平的红脸，灰眼睛亮晶晶，身上是蓝针织衫和高筒胶靴。地上还有旧帽子、破羊毛袜和好几双同样的胶靴，黑黄两色的油布衣在铺位旁前后摇摆。这里的气味多得像棉包里的棉花。油布衣先铺下一层浓重气味，煎鱼、烧焦的油脂、油漆、胡椒、陈烟草又压在上面，最后全被船身与咸海水的气息裹到一起。哈维嫌恶地发现，自己的铺位没有床单，身下只有一块肮脏而疙疙瘩瘩的褥布。船的动作也跟汽船完全不同。它既不平稳滑行，也不有规律地摇摆，倒像一匹拴在缰绳末端的小马驹，笨拙又漫无目的地扭个不停。水声贴着耳边流过，周围的木梁又吱嘎又呻吟。他绝望地哼了一声，想起母亲。
        - id: ch01-b48
          speaker: dan
          text: 好些了吗？要不要喝咖啡？
        - id: ch01-b49
          speaker: narrator
          text: 男孩端来一白铁杯咖啡，还往里加了糖蜜。
        - id: ch01-b50
          speaker: harvey
          text: 没有牛奶吗？
        - id: ch01-b51
          speaker: narrator
          text: 哈维望着两层黑暗的铺位，仿佛真以为里面会藏着奶牛。
        - id: ch01-b52
          speaker: dan
          text: 没有。大概到九月中旬以前都不会有。这咖啡不差，是我自己煮的。
        - id: ch01-b53
          speaker: narrator
          text: 哈维默默喝完，又狼吞虎咽地吃下一盘煎脆的猪肉。
        - id: ch01-b54
          speaker: dan
          text: 你的衣服我烘干了，好像缩了些。反正那一身也不像我们船上的打扮。转转胳膊腿，看看伤着没有。
        - id: ch01-b55
          speaker: narrator
          text: 哈维把全身活动一遍，没找出伤处。
        - id: ch01-b56
          speaker: dan
          text: 那就好。穿戴好，上甲板去，我爸要见你。我叫丹，是他儿子。我帮厨子干活，船上凡是大人们嫌脏的事，也全归我。自从奥托掉进海里，这儿就只有我一个男孩。不过他其实已经二十岁，还是个德国佬。昨天海上一点大风都没有，你怎么掉下来的？
        - id: ch01-b57
          speaker: harvey
          text: 谁说没有风？那明明是一场大风暴。我又晕船，大概就从栏杆上滚下去了。
        - id: ch01-b58
          speaker: dan
          text: 昨天和昨晚不过有点平常的小浪。你要把那也叫大风暴，等这趟航程结束，可有得学了。快走吧，我爸还在等。
        - id: ch01-b59
          speaker: narrator
          text: 哈维和许多不幸的年轻人一样，从小没听过这样直接的命令。哪怕有人只想请他做件小事，也总要先花很久解释服从有什么好处，为什么非这样做不可，有时说着说着还会掉眼泪。切恩太太生怕挫伤儿子的个性，自己却一直紧张得快要垮掉。哈维当然不明白，凭什么只为了让某个人高兴，自己就非得赶快。
        - id: ch01-b60
          speaker: harvey
          text: 你爸真急着谈，就让他下来见我。我要他马上送我回纽约，会有他的好处。
        - id: ch01-b61
          speaker: narrator
          text: 丹睁圆了眼睛，终于领会这个笑话有多妙。他朝水手舱口上方喊起来。
        - id: ch01-b62
          speaker: dan
          text: 爸！他说你真那么着急，就自己下来见他。听到了吗？
        - id: ch01-b63
          speaker: narrator
          text: 上方传来哈维听过的最深沉的人声。
        - id: ch01-b64
          speaker: disko
          text: 丹，别胡闹。叫他上来。
        - id: ch01-b65
          speaker: narrator
          text: 丹窃笑着扔给哈维那双已经变形的自行车鞋。甲板上那个声音里有一种力量，让哈维暂时藏住怒气。他安慰自己，回航时可以慢慢讲出自己和父亲究竟多么富有。这次获救，也准会让他一辈子都成为朋友们眼里的英雄。他爬上一架笔直的梯子，登上甲板，又磕磕绊绊地越过二十来样障碍，终于来到船尾。一个矮小结实、下巴刮得干净、眉毛灰白的男人坐在通往艉甲板的台阶上。昨夜的浪已经过去，海面只剩一道道漫长而油亮的起伏。天边散着十来条渔船，帆影之间那些小黑点，是已经放出去捕鱼的小艇。《我们在这儿号》抛锚停着，主桅上只张着一面三角停泊帆，船身轻轻随着海面摆动。除了舱顶旁的那个男人，甲板上看不见别人。
        - id: ch01-b66
          speaker: disko
          text: 早上好——不对，该说下午好了。小伙子，你差不多睡了整整十二个小时。
        - id: ch01-b67
          speaker: harvey
          text: 早上好。
        - id: ch01-b68
          speaker: narrator
          text: 哈维不喜欢“小伙子”这个称呼。他刚刚从溺水中获救，本来理所当然地等着别人同情。平日里，只要他的双脚沾湿，母亲都会担心得痛苦万分。可眼前这个水手听说他险些淹死，居然仍旧毫不激动，这让哈维很不满意。
        - id: ch01-b69
          speaker: disko
          text: 好，把事情全说一遍。怎么看都是上天的安排，对大家都有好处。你叫什么？从哪儿来？我们猜是纽约。又要去哪儿？我们猜是欧洲。
        - id: ch01-b70
          speaker: narrator
          text: 哈维报出自己的姓名，又说出那艘汽船的名字，简短讲了自己如何落水。讲到最后，他不再是在说明事故，而是直接命令对方立刻送他回纽约。他还保证，不管救他的人开多高的价，他父亲都会照付。
        - id: ch01-b71
          speaker: disko
          text: 嗯。一个人坐着那样的邮船，却在风平浪静时掉进海里，就算只是个男孩，我们也不大看得起。要是他还把晕船当借口，就更不用说了。
        - id: ch01-b72
          speaker: harvey
          text: 借口？你以为我会为了好玩，故意掉进你这条肮脏的小船？
        - id: ch01-b73
          speaker: disko
          text: 我不知道你觉得什么才叫好玩，所以也不能肯定。不过换成我，就不会辱骂救命的船。第一，这对上天很不敬。第二，这会伤我的感情。我就是格洛斯特《我们在这儿号》的迪斯科·特鲁普，看来你还没弄清楚。
        - id: ch01-b74
          speaker: harvey
          text: 我不知道，也不在乎。当然，你们救了我，我很感激。可你必须明白，越早送我回纽约，你挣到的钱越多。
        - id: ch01-b75
          speaker: disko
          text: 怎么个多法？
        - id: ch01-b76
          speaker: narrator
          text: 特鲁普扬起一边浓密的灰眉，下面那只蓝眼睛温和得叫人起疑。哈维却以为自己的话已经有了分量。他高兴起来，把一只手插进口袋，稍稍挺起肚子，摆出自己认为最有身份、最威风的姿态。
        - id: ch01-b77
          speaker: harvey
          text: 当然是美元和美分，实实在在的钱。你们把我救上来，算是做了有生以来最划算的一天活儿。我可是哈维·切恩唯一的儿子。
        - id: ch01-b78
          speaker: disko
          text: 那他真是受上天眷顾。
        - id: ch01-b79
          speaker: harvey
          text: 你连哈维·切恩是谁都不知道，只能说明你没见识。现在把船掉头，赶紧回去。
        - id: ch01-b80
          speaker: narrator
          text: 哈维以为，美国到处都有人谈论并嫉妒父亲的钱。
        - id: ch01-b81
          speaker: disko
          text: 也许我知道，也许不知道。小伙子，把肚子收回去些，里面装的可都是我的饭。
        - id: ch01-b82
          speaker: narrator
          text: 丹站在短前桅旁边假装忙碌，却忍不住笑了一声。哈维顿时涨红了脸。
        - id: ch01-b83
          speaker: harvey
          text: 饭钱我们也会付。你看什么时候能到纽约？
        - id: ch01-b84
          speaker: disko
          text: 我从来不去纽约，也不去波士顿。大概到了九月，我们才会看见东角。至于你父亲，很遗憾，我没听说过他。听完你这些话，他也许会赏我十美元，也许不会。
        - id: ch01-b85
          speaker: harvey
          text: 十美元？你看看这个——
        - id: ch01-b86
          speaker: narrator
          text: 哈维伸手去掏那卷钞票，却只摸出一包湿透的香烟。
        - id: ch01-b87
          speaker: disko
          text: 那不是钱，对肺也不好。扔进海里，再找找吧。
        - id: ch01-b88
          speaker: harvey
          text: 钱被人偷了！一百三十四美元，全没了。快还给我！
          emotion: angry
        - id: ch01-b89
          speaker: disko
          text: 那你只好等见到父亲，再酬谢我了。可你这么点年纪，带一百三十四美元做什么？
        - id: ch01-b90
          speaker: harvey
          text: 那只是我一个月零花钱的一部分。
        - id: ch01-b91
          speaker: narrator
          text: 哈维觉得这句话一定能把对方彻底压倒。它确实起了作用，只是方式跟他期待的完全不同。老特鲁普硬邦邦的脸上飞快掠过一种古怪神色，随即像是在认真考虑一个病人的症状。
        - id: ch01-b92
          speaker: disko
          text: 哦，一百三十四美元只是一个月零花钱的一部分，而且只是一部分！你落水时真没撞到什么吗？比如一头碰上支柱。‘东风号’的老哈斯肯就曾在舱口绊倒，脑袋狠狠撞了主桅。大约三个星期以后，他硬说‘东风号’是一艘专门击沉商船的军舰，还正式向塞布尔岛宣战，因为那岛属于英国，周围的浅滩又伸得太远。剩下的航程，大家只好把他缝在床褥袋里，让头和脚露在外面。如今他回到埃塞克斯老家，整天跟小布娃娃玩。
        - id: ch01-b93
          speaker: narrator
          text: 哈维气得喘不过气，特鲁普却像在安慰一个病人。
        - id: ch01-b94
          speaker: disko
          text: 我们真替你难过。年纪这么小，实在可怜。钱的事就不要再提了。
        - id: ch01-b95
          speaker: harvey
          text: 你当然不愿提。钱就是你偷的。
        - id: ch01-b96
          speaker: disko
          text: 随你吧。说是我们偷的，要是能让你好受些，那就这么说。现在谈谈回去的事。就算船办得到，其实它办不到，你这副样子也不适合回家。我们才刚到大浅滩，全船人都得靠这个渔季干活吃饭。我们一个月连五十美元的一半都见不到，更别说什么零花钱。运气好的话，也得等九月头几个星期才能重新踏上岸。
        - id: ch01-b97
          speaker: harvey
          text: 可现在才五月！不能因为你们要捕鱼，就让我在这儿什么也不干。我不能留下！
        - id: ch01-b98
          speaker: disko
          text: 说得有理，也很公道。可没人叫你什么也不干。你能帮忙的地方多得很。奥托在拉哈弗浅滩落水以后，船上正缺一个人。我猜他在我们遇到的那场风暴里手一滑，反正他从没回来否认。如今你偏偏出现了，对大家明明白白都是上天的安排。不过，你真正会做的事情恐怕没有几样，对吧？
        - id: ch01-b99
          speaker: harvey
          text: 等到了岸上，我会让你和你手下这帮人统统不好过。你们这是海盗行径！
          emotion: angry
        - id: ch01-b100
          speaker: narrator
          text: 特鲁普几乎笑了，可还差一点。
        - id: ch01-b101
          speaker: disko
          text: 对了，你还会说话，我倒忘了。在《我们在这儿号》上，没人逼你多说。只要睁大眼睛，丹让你帮什么就照做。每月十块半，这一趟结束一共三十五美元。其实你不值这么多，我还是肯付。做点活儿能治治你的脑袋。你父亲、母亲和那些钱，以后再慢慢讲。
        - id: ch01-b102
          speaker: harvey
          text: 我母亲还在汽船上。马上送我回纽约！
          emotion: sad
        - id: ch01-b103
          speaker: disko
          text: 可怜的女人，确实可怜。不过等她重新见到你，这一切苦处也就都会忘了。《我们在这儿号》上有八个人，而这里离纽约足有一千多英里。现在掉头回去，我们就会白白错过整个渔季。哪怕我自己愿意这样做，船上那些伙计也绝不会答应。
        - id: ch01-b104
          speaker: harvey
          text: 我父亲会补偿所有损失。
        - id: ch01-b105
          speaker: disko
          text: 我相信他会想办法补偿，也相信他会尽力试试。可整整一个渔季的收成，是八个人赖以生活的饭碗，不能拿钱一句话带过。等秋天再见父亲，对你的健康反倒有好处。现在到前面去帮丹。照我刚才说的，每月十块半，吃住当然全包，跟我们船上其他人一样。
        - id: ch01-b106
          speaker: harvey
          text: 你要我刷锅、洗盘子，干这些活儿？
        - id: ch01-b107
          speaker: disko
          text: 还有别的事。别嚷嚷，小伙子。
        - id: ch01-b108
          speaker: harvey
          text: 我不干！只要平安送我回纽约，我父亲给的钱，够买十条这样的破渔船。还有，不管怎么说，你欠我一百三十四美元！
          emotion: angry
        - id: ch01-b109
          speaker: disko
          text: 我怎么欠你的？
        - id: ch01-b110
          speaker: harvey
          text: 你心里明白。拿走我的钱还不算，现在还想让我一直干下贱活儿，干到秋天。我绝对不干。听见了吗？
          emotion: angry
        - id: ch01-b111
          speaker: narrator
          text: 哈维围着特鲁普大发脾气，特鲁普却认真望着主桅顶，过了好一阵才开口。
        - id: ch01-b112
          speaker: disko
          text: 嘘。我在心里盘算自己该负什么责任。这事得好好判断。
        - id: ch01-b113
          speaker: narrator
          text: 丹悄悄走近，扯住哈维的手肘。
        - id: ch01-b114
          speaker: dan
          text: 别再惹我爸了。你已经骂了他两三次小偷。天底下不管谁这样骂，他都不会忍。
        - id: ch01-b115
          speaker: harvey
          text: 我才不管！
          emotion: angry
        - id: ch01-b116
          speaker: narrator
          text: 哈维几乎尖叫起来，特鲁普仍旧不动声色。最后，他的目光从桅顶落到哈维脸上。
        - id: ch01-b117
          speaker: disko
          text: 这样做似乎不大友善。不过我一点也不怪你。等你把肚里的火气泄掉，也不会怪我。听清楚，每月十块半，吃住全包，在这条船上当第二个小子。我们会教你做事，也让你的身体变好。答应，还是不答应？
        - id: ch01-b118
          speaker: harvey
          text: 不答应！送我回纽约，不然我就让你——
          emotion: angry
        - id: ch01-b119
          speaker: narrator
          text: 后面究竟发生了什么，哈维没能记清。回过神时，他已经躺在甲板的排水沟里，两手紧紧捂着流血的鼻子。特鲁普仍站在旁边，神色平静地低头看着他，仿佛刚才只处理了一件很普通的船上事务。
        - id: ch01-b120
          speaker: disko
          text: 丹，我刚看见这小伙子时，因为判断下得太快，心里很不喜欢他。你可千万别让草率的判断带错了路。现在我倒很可怜他，因为他脑袋里的机器显然全坏了。他刚才骂我的那些名字，还有别的种种胡说，都不能算是他自己的责任。至于他落水这件事，我现在差不多有一半相信，是他自己故意跳下去的。你要对他温和一点。要不然，我刚才给了他多少，也会加倍给你。流一场鼻血正好能让脑子清醒，叫他拿水把脸冲干净吧。
        - id: ch01-b121
          speaker: narrator
          text: 说完这些，特鲁普神情庄严地走下去，进了船尾的舱室。那是他和几个年长水手睡觉的地方。甲板上只留下丹和哈维。于是，安慰这个倒霉少爷的差事也落到了丹头上。哈维可是三千万财产的继承人，眼下却只能捂着流血的鼻子，躺在一条捕鱼船的排水沟里。
