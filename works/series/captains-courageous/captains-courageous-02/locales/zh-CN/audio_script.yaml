audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着而略带讥诮的讲述
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中音
    harvey:
      display_name: 哈维
      tts:
        delivery: 少年人的高声逞强与任性
        timbre: 清亮偏尖
        pace: 稍快
        pitch: 中高音
    manuel:
      display_name: 曼努埃尔
      tts:
        delivery: 带葡萄牙口音的热情直爽
        timbre: 明亮结实
        pace: 中速略跳跃
        pitch: 中音
    dan:
      display_name: 丹
      tts:
        delivery: 朴实活泼的渔家少年口吻
        timbre: 年轻而爽朗
        pace: 稍快
        pitch: 中高音
    disko:
      display_name: 迪斯科·特鲁普
      tts:
        delivery: 克制威严且带冷幽默
        timbre: 深沉坚硬
        pace: 缓慢稳重
        pitch: 低音
    long_jack:
      display_name: 长杰克
      tts:
        delivery: 爱起哄的戈尔韦水手口吻
        timbre: 粗亮
        pace: 明快
        pitch: 中低音
    tom_platt:
      display_name: 汤姆·普拉特
      tts:
        delivery: 老练从容的前军舰水手口吻
        timbre: 洪亮厚实
        pace: 稳健
        pitch: 低音
    penn:
      display_name: 宾恩
      tts:
        delivery: 温顺认真而略显迟疑
        timbre: 细弱
        pace: 稍慢
        pitch: 中高音
    salters:
      display_name: 索尔特斯叔叔
      tts:
        delivery: 暴躁直率的老水手口吻
        timbre: 粗哑
        pace: 稍快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 血珠密密地落在乌黑的油漆甲板上。哈维的肩膀一抽一抽，干哭得直喘气。丹守在一旁，先说自己早就警告过他，又劝他别再哭了。
        - id: ch01-b02
          speaker: dan
          text: 我爸平常一点也不急躁，这一拳可是你自己招来的。我头一次出海时，也叫他一拳打倒过，那也是最后一次。那种又难受又孤单的滋味，我明白。
        - id: ch01-b03
          speaker: harvey
          text: 就是这么回事。那个人不是疯了，就是喝醉了。可我一点办法也没有。
          emotion: sad
        - id: ch01-b04
          speaker: dan
          text: 这话千万别让我爸听见。他最恨喝酒，而且他说疯的人是你。你怎么能骂他是小偷？他是我爸呀。
        - id: ch01-b05
          speaker: narrator
          text: 哈维坐起身，擦干净鼻子，把那卷钞票不见的经过说了。
        - id: ch01-b06
          speaker: harvey
          text: 我没有疯。只是你父亲这一辈子，大概从没一次见过五美元以上的钱。我爸每星期都买得起这条船，根本不会当回事。
        - id: ch01-b07
          speaker: dan
          text: 你根本不知道《我们在这儿号》值多少。你爸一定有一大堆钱。他怎么挣来的？我爸说，疯子讲不出一段连贯的实话。你讲给我听。
        - id: ch01-b08
          speaker: harvey
          text: 西部的金矿，还有别的生意。
        - id: ch01-b09
          speaker: dan
          text: 这种买卖我在书里看过。你爸是不是带着手枪，骑一匹会耍把戏的小马四处跑？蛮荒西部的人，马刺和缰绳听说都是纯银的。
        - id: ch01-b10
          speaker: harvey
          text: 你真傻！我爸才不用什么小马。他出门坐自己的车。
        - id: ch01-b11
          speaker: narrator
          text: 哈维本来满肚子不快，还是叫丹逗笑了。
        - id: ch01-b12
          speaker: dan
          text: 什么车？装龙虾的火车吗？
        - id: ch01-b13
          speaker: harvey
          text: 当然不是，是他的私人车厢。你总见过私人车厢吧？
        - id: ch01-b14
          speaker: dan
          text: 斯莱廷·比曼有一节，我在波士顿联合车站见过，三个黑人占着一边擦窗户。听说他几乎有长岛所有的铁路，还买下半个新罕布什尔州，围上铁丝，里面养满狮子、老虎、熊、野牛和鳄鱼。他是百万富翁，我确实见过他的车厢。
        - id: ch01-b15
          speaker: harvey
          text: 我爸是人家说的千万富翁。他有两节私人车厢，一节用我的名字，叫“哈维号”，另一节用我母亲的名字，叫“康斯坦丝号”。
        - id: ch01-b16
          speaker: dan
          text: 先等等。我爸不许我发誓，你大概可以。再讲以前，你得发誓，要是撒谎，就叫你死。
        - id: ch01-b17
          speaker: harvey
          text: 当然可以。
        - id: ch01-b18
          speaker: dan
          text: 这还不够。你得亲口说，要是没讲实话，就叫你死。
        - id: ch01-b19
          speaker: harvey
          text: 我要不是句句都真，就叫我当场死掉。
        - id: ch01-b20
          speaker: dan
          text: 那一百三十四美元也是真的？我听见你跟我爸说了。我当时有一半以为，你会像约拿那样叫海吞下去。
        - id: ch01-b21
          speaker: narrator
          text: 哈维争辩得满脸通红，一件接一件地讲。丹在自己熟悉的事上是个精明少年，足足盘问了十分钟，终于相信哈维没有撒多少谎。何况哈维已经用男孩所知最可怕的誓言束住自己，现在还活生生坐在排水沟里，鼻头通红。等哈维把那节以自己命名的车厢里有什么全数说完，丹才从心底吐出一声惊叹。
        - id: ch01-b22
          speaker: dan
          text: 老天！我信你了，哈维。我爸这一辈子总算也看错了一回。
        - id: ch01-b23
          speaker: harvey
          text: 他当然错了。
        - id: ch01-b24
          speaker: narrator
          text: 哈维心里已经盘算着尽快报复。丹却往后一仰，拍着大腿，宽脸上浮起一股恶作剧的喜色。他想到父亲最恨自己看错人，几乎已经等不及要看这场好戏。
        - id: ch01-b25
          speaker: dan
          text: 他知道以后，会从里到外气个透。我爸最恨看错人。你先别说破，别坏了这场好戏。
        - id: ch01-b26
          speaker: harvey
          text: 我可不想再叫他打倒，不过这笔账我总会跟他算。
        - id: ch01-b27
          speaker: dan
          text: 我没听说谁跟我爸算账还能占便宜。你一说破，他准会再打你，错得越厉害，打得越狠。不过金矿和手枪这回事……
        - id: ch01-b28
          speaker: harvey
          text: 手枪可不是我说的。我一个字也没提。
        - id: ch01-b29
          speaker: dan
          text: 对，你没说。两节私人车厢，一节叫你的名字，一节叫你母亲的名字。每月拿两百美元零花钱，却因为不肯每月挣十块半，叫人一拳打进排水沟。这真是本季最精彩的一网！
        - id: ch01-b30
          speaker: narrator
          text: 丹笑得浑身发颤，却一点声音也没发出来。哈维还以为自己终于找到了同情。
        - id: ch01-b31
          speaker: harvey
          text: 那么，我是对的？
        - id: ch01-b32
          speaker: dan
          text: 你错得不能再错！你得马上跟我干活，不然还会挨揍，我替你说话也会跟着挨揍。我爸因为我是他儿子，罚我总要加倍。他最恨偏袒人。我知道你现在有点恨他，我也不止一次恨过。不过整个船队都说，他是最公道的人。
        - id: ch01-b33
          speaker: harvey
          text: 把我的鼻子打成这样，也叫公道？
        - id: ch01-b34
          speaker: dan
          text: 这不算什么，只是把你从岸上带来的坏血放掉，对身体有好处。可你听清楚，我不能跟一个把我、我爸，或船上任何人当小偷的人来往。我们是一起出海六年多的渔民，不是码头边的乌合之众。
        - id: ch01-b35
          speaker: dan
          text: 我爸不许我乱发誓，不然我也敢照你刚才的誓发一个。你的衣服是我烘的，我没翻过口袋。你上船以后，只有我和我爸碰过你，我们谁也不知道钱在哪里。这就是我的话。现在你怎么说？
        - id: ch01-b36
          speaker: narrator
          text: 流过鼻血以后，哈维的头脑确实清醒了些。也许海上的孤寂也帮了忙。他窘迫地低下头。
        - id: ch01-b37
          speaker: harvey
          text: 那就好。丹，我刚从海里叫人救上来，却一点也不像个知道感激的人。
        - id: ch01-b38
          speaker: dan
          text: 你那时吓糊涂了。反正只有我和我爸看见，厨子不算。
        - id: ch01-b39
          speaker: harvey
          text: 我本该想到，钞票也许就是那样丢了，不该见人就骂小偷。你父亲在哪里？
        - id: ch01-b40
          speaker: dan
          text: 在船舱里。你找他干什么？
        - id: ch01-b41
          speaker: harvey
          text: 你等着看吧。
        - id: ch01-b42
          speaker: narrator
          text: 哈维脑袋还在嗡嗡响，脚下也不稳。他走下船舱台阶，看见小船的时钟就挂在舵轮前。漆成巧克力色和黄色的舱房里，特鲁普坐在柜子上，正拿着记事本和一支粗大的黑铅笔忙碌，隔一会儿就使劲吮一下笔头。
        - id: ch01-b43
          speaker: harvey
          text: 我刚才做得不大对。
        - id: ch01-b44
          speaker: narrator
          text: 连哈维自己都吃惊，他的声音竟会这么温顺。
        - id: ch01-b45
          speaker: disko
          text: 现在又怎么了？你跟丹打起来啦？
        - id: ch01-b46
          speaker: harvey
          text: 没有，是关于你的。
        - id: ch01-b47
          speaker: disko
          text: 我听着。
        - id: ch01-b48
          speaker: harvey
          text: 我是来收回刚才那些话的。一个人叫人从海里救起来以后……
        - id: ch01-b49
          speaker: narrator
          text: 哈维把话飞快地挤出来，又用力咽了一下。
        - id: ch01-b50
          speaker: disko
          text: 嗯？照这样下去，你早晚会成为一个真正的男人。
        - id: ch01-b51
          speaker: harvey
          text: 人家救了他，他不该张口就骂。
        - id: ch01-b52
          speaker: disko
          text: 说得公道，也说得有理。
        - id: ch01-b53
          speaker: narrator
          text: 特鲁普嘴角闪过一丝干巴巴的笑。哈维又咽了一下。
        - id: ch01-b54
          speaker: harvey
          text: 所以，我来向你道歉。
        - id: ch01-b55
          speaker: narrator
          text: 特鲁普慢慢从柜子上站起来，伸出一只足有十一英寸长的大手。
        - id: ch01-b56
          speaker: disko
          text: 我早猜到那一下对你有好处，这也证明我没看错人。我很少看错。等我们带你跑完这一趟，这只手上会多长些筋骨。刚才的事，我不会看轻你。那时你还不算完全清醒。现在去干活吧，没人会为难你。
        - id: ch01-b57
          speaker: narrator
          text: 甲板上传来一声拼命憋住的窃笑，钻进特鲁普耳朵。他仍坚持说自己很少看错人。那只十一英寸长的大手整个合在哈维手上，捏得哈维整条胳膊都麻了。回到甲板时，他的脸一直红到耳朵尖。
        - id: ch01-b58
          speaker: dan
          text: 你真有种。
        - id: ch01-b59
          speaker: harvey
          text: 我可不觉得自己的脸白。
        - id: ch01-b60
          speaker: dan
          text: 我不是说脸色。我听见我爸的话了。他肯说不会看轻一个人，就等于认输了。他宁可向英国人降旗，也不肯改掉自己的判断。我真高兴这件事正正当当地了结了。
        - id: ch01-b61
          speaker: dan
          text: 他说不能送你回去，这一点没错，我们全靠捕鱼吃饭。再过半小时，伙计们就会像鲨鱼扑死鲸一样赶回来。
        - id: ch01-b62
          speaker: harvey
          text: 他们回来做什么？
        - id: ch01-b63
          speaker: dan
          text: 当然是吃晚饭。你的肚子没告诉你吗？你要学的东西还多着呢。
        - id: ch01-b64
          speaker: narrator
          text: 哈维觉得自己要学的东西确实不少，沮丧地抬头望着头顶纠缠的绳索和滑轮。丹却误会了他的眼神，以为他正在欣赏这条船，立刻热心地夸起《我们在这儿号》。接着，他指向两根桅杆之间敞开的主舱口，下面黑洞洞的，眼下什么也没有。
        - id: ch01-b65
          speaker: dan
          text: 等主帆装好，满舱湿盐，一路往家走时，你再看她有多美。不过眼下先干活。
        - id: ch01-b66
          speaker: harvey
          text: 这个舱口是做什么的？里面全是空的。
        - id: ch01-b67
          speaker: dan
          text: 得靠你、我和另外几个人把它装满。鱼就放在里面。
        - id: ch01-b68
          speaker: harvey
          text: 活鱼吗？
        - id: ch01-b69
          speaker: dan
          text: 最好是死的，还得压平、腌咸。盐柜里有一百大桶盐，我们捕的鱼却还只够盖住行李。
        - id: ch01-b70
          speaker: harvey
          text: 鱼又在哪里？
        - id: ch01-b71
          speaker: dan
          text: 渔民都说，海里据说有，船里但愿装。昨晚你是跟大约四十条鱼一起上船的。等他们回来，你和我还得冲洗鱼舱。但愿今晚鱼多得把船压低半英尺，叫我们困得恨不得先劈自己，不劈鱼。瞧，他们回来了！
        - id: ch01-b72
          speaker: narrator
          text: 六七条小艇划过丝绸般发亮的海面，朝大船回来。
        - id: ch01-b73
          speaker: harvey
          text: 我从没在这么低的地方看过海。真美。
        - id: ch01-b74
          speaker: narrator
          text: 低垂的太阳把海水染成紫色和粉红色。长长的涌浪缓缓起伏，浪脊闪着金光，浪谷浮动着鲭鱼背一般的蓝绿。眼前每条双桅帆船仿佛都牵着一根看不见的线，把自家的小艇往身边拉。艇上一个个黑色小人整齐划桨，像一群上紧发条的玩具。
        - id: ch01-b75
          speaker: dan
          text: 他们碰上好鱼群了。曼努埃尔的艇塞得一条鱼也放不下，低得像静水上的睡莲叶。
        - id: ch01-b76
          speaker: harvey
          text: 哪一条是曼努埃尔？隔这么远，你怎么认得出来？
        - id: ch01-b77
          speaker: dan
          text: 最南边那条。他昨晚找到你。曼努埃尔划船是葡萄牙人的架势，绝不会认错。东边的是宾夕法尼亚，捕鱼的本事比划船强得多，看那样子，艇里像装了一船小苏打。再往东，看他们一路排得多漂亮。那个耸着肩的是长杰克，住在南波士顿，那一带大多住着戈尔韦人，他们划船通常都不坏。
        - id: ch01-b78
          speaker: dan
          text: 最北边的是汤姆·普拉特，你马上会听见。他说自己当过军舰水手，待过老“俄亥俄号”。除了唱歌，他总讲这件事。不过他的鱼运不错。听，他开嗓了。
        - id: ch01-b79
          speaker: tom_platt
          text: 取来海图，那悲凉的海图，看群山在何处相逢！浓云缠住它们的头顶，迷雾裹住它们的脚踪。
        - id: ch01-b80
          speaker: dan
          text: 满船鱼。他要是再唱《啊，船长》，那就一定装得冒尖了。
        - id: ch01-b81
          speaker: tom_platt
          text: 如今，啊，船长，我向你献上最恳切的祈祷。莫让他们把我埋进教堂，也莫葬在灰色的修道院里。
        - id: ch01-b82
          speaker: dan
          text: 果然是双喜临门。明天他会把老“俄亥俄号”的事从头讲给你。看见后面那只蓝色小艇了吗？那是索尔特斯叔叔，我爸的亲弟弟。他划得格外小心，可只要大浅滩上有什么坏运气在游荡，准会撞到他身上。我敢拿自己的工钱和分成打赌，今天只有他叫东西蜇了，而且一定蜇得不轻。
        - id: ch01-b83
          speaker: harvey
          text: 什么东西会蜇他？
        - id: ch01-b84
          speaker: dan
          text: 多半是草莓，有时是南瓜、柠檬和黄瓜。他胳膊肘以下准全肿了。现在抓住吊索，帮他们上船。你真是一件动手的活儿也没干过？那种日子一定很可怕。
        - id: ch01-b85
          speaker: harvey
          text: 不管怎样，我打算试试。只是这些东西全都陌生得要命。
        - id: ch01-b86
          speaker: dan
          text: 那就抓住你身后那根吊索！
        - id: ch01-b87
          speaker: narrator
          text: 哈维抓住主桅支索垂下来的绳索和长铁钩。曼努埃尔的满载小艇贴上船边，他把鱼一条条抛进甲板上的鱼舱。
        - id: ch01-b88
          speaker: manuel
          text: 二百三十一条！
        - id: ch01-b89
          speaker: dan
          text: 把钩子递给他。
        - id: ch01-b90
          speaker: narrator
          text: 曼努埃尔把钩穿过艇首绳圈，又把丹递来的吊索挂在船尾，随后爬上大船。
        - id: ch01-b91
          speaker: dan
          text: 拉！停！它又不是要上桅顶做窝。现在放！
        - id: ch01-b92
          speaker: narrator
          text: 哈维一拉，小艇升得轻快，完全出乎他的意料。他没有及时停住，转眼已经把艇吊到头顶。听见丹提醒，他赶紧收手，再慢慢往下放。丹用一只手荡开轻巧的艇身，让它稳稳落在主桅后面。
        - id: ch01-b93
          speaker: dan
          text: 空艇本来就不重。你一个乘客头一回能干成这样，已经很利落。有浪时才真正需要诀窍。
        - id: ch01-b94
          speaker: manuel
          text: 啊哈，你好多了？昨晚是鱼钓到你，今天轮到你钓鱼了，对不对，怎——么样？
        - id: ch01-b95
          speaker: harvey
          text: 我……我真不知道该怎么谢你。
        - id: ch01-b96
          speaker: narrator
          text: 哈维那只倒霉的手又伸向口袋，随即想起钱已经没了。后来只要想起自己差点拿钱酬谢救命恩人，他躺在铺位里也会窘得发热。
        - id: ch01-b97
          speaker: manuel
          text: 没有什么好谢的！我难道能让你在大浅滩上漂来漂去？现在你也是渔民了，对不对，怎——么样？
        - id: ch01-b98
          speaker: narrator
          text: 曼努埃尔腰腿僵硬，从胯部起前后俯仰，舒展蜷了一天的筋骨。
        - id: ch01-b99
          speaker: manuel
          text: 我今天太忙，没洗小艇。丹尼，我的孩子，替我洗吧。
        - id: ch01-b100
          speaker: narrator
          text: 曼努埃尔请丹替他洗艇，哈维立刻走上前。这件事他会做，也正好能报答救命的人。丹丢给他一把拖把，他便伏在小艇上，用力擦掉一层层黏液。动作虽笨拙，干得却十分卖力。
        - id: ch01-b101
          speaker: dan
          text: 把踏脚板从槽里抽出来，洗净后平放艇底。绝不能让它们卡死，急着用艇时会要命。长杰克来了！
        - id: ch01-b102
          speaker: narrator
          text: 一串亮闪闪的鱼从靠舷的小艇飞进鱼舱。丹叫曼努埃尔接吊索，自己去支桌子，又让哈维洗完这条艇，把长杰克的艇叠在上面。哈维一抬头，另一条船底正悬在脑袋上，落下后严丝合缝地套住了前一条。
        - id: ch01-b103
          speaker: dan
          text: 像不像印第安人的套盒？
        - id: ch01-b104
          speaker: long_jack
          text: 这小子一上手，倒像鸭子下水。
        - id: ch01-b105
          speaker: narrator
          text: 长杰克下巴上生着花白胡茬，两片长嘴唇格外显眼。他是个戈尔韦人，也像曼努埃尔一样，从胯部前后弯腰，慢慢活动坐了一天小艇后僵硬的身体。舱里的迪斯科朝舱口低吼一声，大家还能听见他在里面用力吮铅笔头的声音。
        - id: ch01-b106
          speaker: long_jack
          text: 一百四十九条半！去你的吧，迪斯科博勒斯。我累死累活，只为了装满你的口袋。记成收成不好，葡萄牙佬胜过我了。
        - id: ch01-b107
          speaker: narrator
          text: 啪的一声，又一条小艇撞上船边，更多亮闪闪的鱼从艇里飞进鱼舱。来人比长杰克还要高大，一道紫色伤疤从他的左眼斜斜划到右边嘴角，把那张本来普通的脸变得十分奇特。这个人正是汤姆·普拉特。
        - id: ch01-b108
          speaker: tom_platt
          text: 二百零三条。让我看看那个乘客！
        - id: ch01-b109
          speaker: narrator
          text: 哈维还不知道船上接下来该做什么，便照刚学会的办法干下去。每放下一条小艇，他就把船里擦洗干净，再将卡在槽里的踏脚板一块块抽出，平码到艇底。伤疤脸汤姆·普拉特站在旁边，用老水手挑剔的眼光打量着他。
        - id: ch01-b110
          speaker: tom_platt
          text: 他学得挺快。做事有两种办法。一种是渔民的办法，随便哪头先动，最后胡乱打个活结。另一种是——
        - id: ch01-b111
          speaker: dan
          text: 你们老“俄亥俄号”上的办法！让开，汤姆·普拉特，我要支桌子。
        - id: ch01-b112
          speaker: narrator
          text: 丹扛来一块带腿的长板，从人群中挤过去。他把板子一头卡进舷墙上的两处凹槽，又抬脚踢开桌腿。汤姆·普拉特的拳头横着扫来，丹正好及时低头，拳头从他头顶掠了过去。
        - id: ch01-b113
          speaker: tom_platt
          text: 丹尼，这一拳在“俄亥俄号”上也用过。看见了吗？
        - id: ch01-b114
          speaker: dan
          text: 那船上的人准把眼睛长在两边，因为你根本没打中。再不走开，我就把你的靴子挂到主桅顶上。没看见我正忙吗？
        - id: ch01-b115
          speaker: long_jack
          text: 丹尼，你整天躺在锚链上睡觉，脸皮倒真厚。我敢说，不出一个星期，你就会带坏这位押货员。
        - id: ch01-b116
          speaker: dan
          text: 他叫哈维。用不了多久，他一个能顶五个南波士顿挖蛤蜊的。
        - id: ch01-b117
          speaker: narrator
          text: 丹挥着两把形状古怪的刀，说哈维用不了多久就能胜过五个挖蛤蜊的人。接着，他很有品位似的把刀一一摆在桌上，还歪着头欣赏摆放出来的效果。就在这时，船舷外忽然响起一个细小而迟疑的声音。
        - id: ch01-b118
          speaker: penn
          text: 我想是四十二条。
        - id: ch01-b119
          speaker: salters
          text: 那我的运气总算转了。我有四十五条，虽然叫东西蜇得不成人形。
        - id: ch01-b120
          speaker: penn
          text: 也许四十二，也许四十五。我数乱了。
        - id: ch01-b121
          speaker: narrator
          text: 众人听见宾恩又把数目弄乱，顿时哄堂大笑。丹悄声告诉哈维，是宾夕法尼亚和索尔特斯叔叔正在数各自捕来的鱼，这场面比哪一场马戏都好看。两条小艇顺着海浪荡到一起，随即又撞上双桅帆船的船舷。
        - id: ch01-b122
          speaker: long_jack
          text: 快进来吧！外面的水多着呢，孩子们。
        - id: ch01-b123
          speaker: salters
          text: 你刚才说的是四十二。
        - id: ch01-b124
          speaker: penn
          text: 那我再数一遍。
        - id: ch01-b125
          speaker: salters
          text: 我的耐心都要用光了！一个种田的怎么想到来坐船？你差点把我的艇撞散架。
          emotion: angry
        - id: ch01-b126
          speaker: penn
          text: 对不起，索尔特斯先生。我是因为神经性消化不良才出海的。我记得，是你劝我来的。
        - id: ch01-b127
          speaker: salters
          text: 你和你的神经性消化不良都去鲸洞里淹死吧！你又压过来了。到底是四十二还是四十五？
          emotion: angry
        - id: ch01-b128
          speaker: penn
          text: 我忘了，索尔特斯先生。我们再数吧。
        - id: ch01-b129
          speaker: salters
          text: 不可能是四十五，因为我才是四十五。仔细数，宾恩。
        - id: ch01-b130
          speaker: disko
          text: 索尔特斯，马上把鱼叉进来。
        - id: ch01-b131
          speaker: dan
          text: 别坏了好戏，爸。他们才刚开始呢。
        - id: ch01-b132
          speaker: long_jack
          text: 欢喜圣母啊！他竟然一条一条地叉！
        - id: ch01-b133
          speaker: narrator
          text: 索尔特斯费力叉鱼，宾恩却还在数舷边的一排刻痕。
        - id: ch01-b134
          speaker: penn
          text: 原来这是上星期的数。
        - id: ch01-b135
          speaker: narrator
          text: 曼努埃尔悄悄捅了丹一下。丹立刻奔向船尾吊索，探身伸出舷外。曼努埃尔在艇首系绳，丹则把钩子套进船尾绳。众人同时用力，索具一下绷紧，把宾恩连同他的鱼和小艇整个荡进大船。
        - id: ch01-b136
          speaker: tom_platt
          text: 一、二、四九。四十七条。宾恩，你完了！
        - id: ch01-b137
          speaker: narrator
          text: 汤姆·普拉特只用老练的眼睛一扫，就看出了真正的数目。丹一松开船尾吊索，宾恩便从艇尾滑到甲板上，自己的鱼像瀑布一样泼了他满身。索尔特斯一面上下颠着身子，一面大叫停手，可他根本来不及抗议，也连人带鱼和艇被吊进大船，落得同样下场。
        - id: ch01-b138
          speaker: salters
          text: 停手！等等，我的数有点乱！
          emotion: angry
        - id: ch01-b139
          speaker: tom_platt
          text: 四十一条。你输给一个种田的了，索尔特斯，亏你还是水手！
        - id: ch01-b140
          speaker: salters
          text: 这样数不公平。我浑身都给蜇烂了。
        - id: ch01-b141
          speaker: narrator
          text: 索尔特斯说这个数法不公平，跌跌撞撞地从鱼舱里爬出来。他那双干惯重活的厚手肿得又圆又鼓，皮肤斑斑驳驳，一块泛紫，一块发白。丹看了一眼，便故意仰头对着刚刚升起的月亮说起风凉话。
        - id: ch01-b142
          speaker: dan
          text: 有些人哪怕潜水去找，也总能摸到一片草莓地。
        - id: ch01-b143
          speaker: salters
          text: 还有些人懒洋洋吃着土地最肥美的出产，却专拿自己的血亲取笑。
        - id: ch01-b144
          speaker: narrator
          text: 前舱里传来一声陌生的“开饭”。迪斯科、汤姆·普拉特、长杰克和索尔特斯立刻往前走。宾恩低头整理线轮和缠住的鳕鱼线，曼努埃尔直挺挺躺在甲板上，丹则跳进底舱，用锤子敲桶。
        - id: ch01-b145
          speaker: dan
          text: 是盐。晚饭一结束就要开膛腌鱼。你把鱼叉给我爸，汤姆·普拉特会跟他一起码鱼，到时准能听见他们争论。我们是第二班，你、我、曼努埃尔和宾恩，正好是船上的青春和美貌。
        - id: ch01-b146
          speaker: harvey
          text: 这有什么好处？我已经饿了。
        - id: ch01-b147
          speaker: dan
          text: 他们很快就会吃完。闻闻，今晚可真香。我爸虽然得忍受自己的兄弟，却确实雇了个好厨子。曼努埃尔，你那边有多深？
        - id: ch01-b148
          speaker: manuel
          text: 二十五寻。鱼来得又快又多。改天我教你，哈维。
        - id: ch01-b149
          speaker: narrator
          text: 月亮在平静的海面上缓缓走动，年长的几个人终于吃完回到船尾。厨子根本不用招呼第二班。汤姆·普拉特在长辈中吃得最慢、最从容，还没用手背擦完嘴，丹和曼努埃尔已经钻进舱口，坐到桌边。哈维跟着宾恩下去，白铁盘里盛着鳕鱼舌、鱼鳔、碎猪肉和炸土豆，旁边还有一条热面包和又黑又浓的咖啡。
        - id: ch01-b150
          speaker: narrator
          text: 大家饿得厉害，却都等宾恩庄重地祷告谢恩，随后埋头猛吃，一声不响。丹终于从白铁杯上抬起头，问哈维感觉怎样。
        - id: ch01-b151
          speaker: harvey
          text: 差不多饱了，不过还能再装下一块。
        - id: ch01-b152
          speaker: narrator
          text: 厨子身材魁梧，皮肤乌黑发亮，跟哈维从前见过的黑人都不同。他始终不开口，也不催促，只站在一旁微笑，用手势一次又一次请大家多吃一些。哈维不明白他为何一句话也不说，只好压低声音去问丹。
        - id: ch01-b153
          speaker: dan
          text: 看吧，我没说错。像我、宾恩、你和曼努埃尔这样年轻英俊的人，都在第二班等着。那些老鱼又刻薄又驼背，肚子还得哄，所以不配也得先吃。对不对，大夫？
        - id: ch01-b154
          speaker: narrator
          text: 厨子点了点头。
        - id: ch01-b155
          speaker: harvey
          text: 他不会说话吗？
        - id: ch01-b156
          speaker: dan
          text: 会得够用，只是不大懂我们的话。他从布雷顿角腹地来，那里的农民说自己造的苏格兰话。那一带有很多黑人，祖辈在我们打仗时逃过去的，说话也像农民一样呼哧呼哧。
        - id: ch01-b157
          speaker: penn
          text: 那不是苏格兰语，是盖尔语。我在书里读到过。
        - id: ch01-b158
          speaker: dan
          text: 宾恩读过很多书，他说的话通常都对。除非他在数鱼。
        - id: ch01-b159
          speaker: harvey
          text: 你父亲真让他们自己报捕了多少，一点也不检查？
        - id: ch01-b160
          speaker: dan
          text: 当然。谁会为了几条老鳕鱼撒谎？
        - id: ch01-b161
          speaker: manuel
          text: 从前有个人天天为鱼数撒谎。每回总要比送来的多报五条、十条，有时二十五条。
        - id: ch01-b162
          speaker: dan
          text: 他是哪里人？肯定不是我们的人。
        - id: ch01-b163
          speaker: manuel
          text: 昂吉耶的法国人。
        - id: ch01-b164
          speaker: dan
          text: 西岸那些法国佬根本不会数，按道理他们也不可能会。哈维，哪天你碰上他们的软钩，就知道为什么了。
        - id: ch01-b165
          speaker: long_jack
          text: 从来只多不会少，每逢开膛又来报！
        - id: ch01-b166
          speaker: narrator
          text: 长杰克朝舱口吼完这一嗓子，第二班立刻争先恐后爬上甲板。
        - id: ch01-b167
          speaker: narrator
          text: 月光下，桅杆、索具和那面从不收起的停泊帆，把长影投在起伏的甲板上，影子随着船身来回滚动。船尾的鱼堆闪闪发亮，像一摊正在流动的银子。底舱里脚步沉沉，木桶隆隆，迪斯科和汤姆·普拉特正在盐柜之间走动。
        - id: ch01-b168
          speaker: dan
          text: 把鱼叉送下舱，交给我爸和汤姆·普拉特。还要小心，别让索尔特斯叔叔把你的眼睛割出来。我在下面递盐。
        - id: ch01-b169
          speaker: narrator
          text: 丹荡进底舱。宾恩和曼努埃尔站在没膝深的鳕鱼里，手上全是出鞘的刀。长杰克戴着手套，脚边摆着篮子，隔桌对着索尔特斯。哈维握着鱼叉，望着那只桶发愣。
        - id: ch01-b170
          speaker: manuel
          text: 嗨！
        - id: ch01-b171
          speaker: narrator
          text: 曼努埃尔从胯部弯下腰去抓鱼，一根手指扣住鱼鳃，另一根插进鱼眼，把鳕鱼提起来搁在鱼舱边。刀光一闪，伴着一声撕裂，从喉头一直剖到泄殖孔，又在鱼颈两边各切一刀，鱼便落到长杰克脚旁。
        - id: ch01-b172
          speaker: long_jack
          text: 嗨！
        - id: ch01-b173
          speaker: narrator
          text: 长杰克戴着手套的手往里一掏，鱼肝落进篮子。再一扭一挖，鱼头和内脏便飞了出去。掏空的鱼滑到索尔特斯面前，他狠狠哼了一声，刀锋又是一阵撕裂。脊骨越过舷墙，没头、没内脏、完全剖开的鱼扑通落进桶里，盐水溅了哈维满嘴。第一声吆喝过后，大家便不再说话。鳕鱼像还活着一样沿桌移动，哈维还没来得及惊叹这套手艺如同奇迹，桶已经满了。
        - id: ch01-b174
          speaker: salters
          text: 叉！
        - id: ch01-b175
          speaker: narrator
          text: 哈维两三条一叉，把鱼往舱下送。
        - id: ch01-b176
          speaker: dan
          text: 一堆一堆地叉，别撒开！索尔特斯叔叔是整个船队最好的劈鱼手。看他怎么照着书干！
        - id: ch01-b177
          speaker: narrator
          text: 圆滚滚的索尔特斯看上去真像在赶时间裁切一本杂志的书页，刀子每一下都又准又快。曼努埃尔的身体从胯部弯着不动，像一尊立在鱼堆里的雕像，两条长胳膊却不停抓鱼。小个子宾恩拼命追赶，可谁都看得出他的力气不够。曼努埃尔有一两次还能腾出手来帮他，桌上的鱼却始终一条接一条，从未断过。
        - id: ch01-b178
          speaker: narrator
          text: 有一回，一枚藏在鱼身上的法国软钩忽然扎进曼努埃尔的手指，疼得他放声大叫。这种钩是软金属做的，方便用过以后再掰回原形。可鳕鱼经常带着钩逃走，游到别处后又被另一条船钓起。格洛斯特的渔船因此更看不起法国人的钩子，这只是许多理由中的一个。
        - id: ch01-b179
          speaker: narrator
          text: 底舱里，粗盐擦过粗糙鱼肉，沙沙响得像磨盘。上面刀锋咔嚓，鱼头和内脏噗嗤落下，索尔特斯的刀嚓啦剜出鱼骨，湿鱼身再扑打着坠进桶里。所有声音下面，盐粒的低响始终不停。
        - id: ch01-b180
          speaker: narrator
          text: 一个钟头过去，哈维愿意拿全世界换片刻休息。新鲜湿润的鳕鱼重得出奇，他不停举叉，腰背早已酸痛。可他平生第一次觉得，自己也是这群干活的男人中的一个。那一点骄傲撑着他咬牙继续。
        - id: ch01-b181
          speaker: salters
          text: 换刀！
        - id: ch01-b182
          speaker: narrator
          text: 听见换刀，所有人才得到片刻喘息。宾恩在鱼堆里弯成一团，呼呼喘气。曼努埃尔前后仰身，舒展一直蜷着的筋骨，长杰克则整个人伏在舷墙上。厨子像一道无声的黑影突然出现，收走甲板上一大堆脊骨和鱼头，又悄无声息地退了下去。
        - id: ch01-b183
          speaker: long_jack
          text: 血头留作早餐，鱼头拿来煮杂烩。
        - id: ch01-b184
          speaker: salters
          text: 换刀！
        - id: ch01-b185
          speaker: dan
          text: 哈维，看你脚边！
        - id: ch01-b186
          speaker: narrator
          text: 舱口围板的一根木条上插着六七把刀。哈维逐把递出新刀，又把钝刀收回来。
        - id: ch01-b187
          speaker: disko
          text: 水！
        - id: ch01-b188
          speaker: dan
          text: 水桶在前面，长柄勺就在旁边。快去，哈维。
        - id: ch01-b189
          speaker: narrator
          text: 哈维赶到前面找到水桶和长柄勺，不到一分钟，就端回满满一大勺放陈的褐色淡水。水的颜色并不好看，放久后的味道也谈不上新鲜，可在这些干渴的人嘴里，它尝起来简直像甘露。迪斯科和汤姆·普拉特喝过水，紧咬着的牙关终于松开，这才又有力气争论。
        - id: ch01-b190
          speaker: disko
          text: 这些是鳕鱼，汤姆·普拉特。不是大马士革无花果，也不是银条。我们一起出海以后，我每回都得告诉你。
        - id: ch01-b191
          speaker: tom_platt
          text: 也就说了七季。不过码得好就是码得好，连压舱物都有正确和错误的码法。你要是见过四百吨铁怎么装进——
        - id: ch01-b192
          speaker: manuel
          text: 嗨！
        - id: ch01-b193
          speaker: narrator
          text: 曼努埃尔一声吆喝，活计又轰然开动。只要鱼舱还没有清空，谁也不会停手。最后一条鱼才送下去，迪斯科便和弟弟摇摇晃晃回了船舱。曼努埃尔和长杰克去了前舱，汤姆·普拉特只多留片刻，把舱盖推回原位，也跟着消失。不到半分钟，哈维便听见舱里响起沉沉的鼾声。他茫然地望着丹和宾恩，不知道事情是否已经做完。
        - id: ch01-b194
          speaker: penn
          text: 这一次我干得好些了，丹尼。不过我想，帮忙收拾还是我的本分。
        - id: ch01-b195
          speaker: dan
          text: 白送我一千担鱼，我也不要你这副良心。去睡吧，宾恩，小子的活儿轮不到你。哈维，打一桶水。宾恩，你睡前把鱼肝倒进桶里，还撑得住吗？
        - id: ch01-b196
          speaker: narrator
          text: 宾恩提起沉重的鱼肝篮，慢慢走到前舱旁边，把鱼肝倒进一只盖子带铰链、桶身捆得结实的大桶。做完这最后一件事，他才拖着疲倦的身体钻进船舱，很快不见了。
        - id: ch01-b197
          speaker: dan
          text: 开完鱼，收拾是小子的活儿。天气平静时，第一班夜哨也归小子。
        - id: ch01-b198
          speaker: narrator
          text: 丹使劲冲洗鱼舱，把粗木桌卸下来，支在月光里晾干。他又拿一团麻絮擦过每一把染红的刀刃，随后蹲到一只小磨石前磨刀。哈维听着他的指挥，把散落的内脏和鱼骨一堆堆收起，再抛到舷外。
        - id: ch01-b199
          speaker: narrator
          text: 第一堆内脏和鱼骨才溅进水里，一道银白色的幽灵便从油亮的海水中笔直竖起。那东西高高露出水面，发出一声诡异的、像口哨又像叹息的声音。哈维从没见过这种景象，吓得惊叫一声，连连后退，丹却只管站在那里笑个不停。
        - id: ch01-b200
          speaker: dan
          text: 是虎鲸，来讨鱼头。饿的时候，它就这么竖起来，朝你喘气，像一座悲凉的坟墓。你没见过？这趟结束前，你会见到几百条。
        - id: ch01-b201
          speaker: narrator
          text: 那根白色柱子慢慢沉回海里，水面随即冒起一串油腻的泡。紧接着，一股腐鱼般的可怕恶臭从水上涌来，灌满四周的空气。哈维还在为刚才所见发愣，丹却已经把这当作海上再平常不过的事。
        - id: ch01-b202
          speaker: dan
          text: 船上再有一个男孩真好。奥托年纪太大，又是德国佬。我跟他打过不少架，这倒没什么，可他一句基督徒说的话也不会。你困了？
        - id: ch01-b203
          speaker: harvey
          text: 困死了。
        - id: ch01-b204
          speaker: dan
          text: 值夜不能睡。打起精神，去看看锚灯亮不亮。现在轮到你值哨了，哈维。
        - id: ch01-b205
          speaker: harvey
          text: 有什么能伤到我们？亮得跟白天一样。呼——
        - id: ch01-b206
          speaker: dan
          text: 我爸说，事情偏会在这种时候发生。好天气里正好睡觉，还没弄清怎么回事，就让邮船切成两半。船上十七个镶铜边的军官，全是体面绅士，人人都会作证，说你们没点灯，当时还有浓雾。
        - id: ch01-b207
          speaker: dan
          text: 哈维，我开始有点喜欢你了。可你再点一次头，我就拿绳头抽你。
        - id: ch01-b208
          speaker: narrator
          text: 月亮见过大浅滩上许多怪事。这一夜，它低头看着一个穿灯笼裤和红运动衫的瘦少年，在一条七十吨双桅帆船堆满杂物的甲板上踉跄绕圈。他身后另有一个男孩挥着打结的绳子，像刽子手一样紧紧跟随。可这个刽子手每抽一下，自己也在打呵欠、点脑袋。
        - id: ch01-b209
          speaker: narrator
          text: 绑住的舵轮轻轻呻吟，还不时踢动一下。微风忽然转向，停泊帆跟着扑打几下，起锚机也在夜里吱呀作响。这支可怜的队伍仍绕着杂乱的甲板走个不停。哈维先跟丹讲道理，见没有用，又开口威胁，后来变成呜咽，终于放声大哭起来。丹自己也困得舌头打结，却还在反复宣讲保持警醒的好处，一边说，一边挥动绳子抽打。他打中小艇的次数，跟真正打中哈维的次数一样多。
        - id: ch01-b210
          speaker: narrator
          text: 最后，舱里的时钟敲了十下。第十声响起时，宾恩爬上甲板，看见两个男孩肩并肩瘫在主舱盖上，早已睡得不省人事。他只好把他们一路滚回各自的铺位。
