  chapters:
    - id: ch01
      title: CHAPTER II
      blocks:
        - id: ch01-b01
          speaker: dan
          text: I warned you. Dad isn't quick to strike, but you surely earned that one. Oh, there's no sense carrying on like this.
        - id: ch01-b02
          speaker: narrator
          text: Drops fell thick and fast on the dark, oiled planks. Harvey's shoulders jerked with dry sobs.
        - id: ch01-b03
          speaker: dan
          text: I know how it feels. Dad laid me out on my first trip, and he never had to do it again. It leaves you sick and lonely. I know.
        - id: ch01-b04
          speaker: harvey
          text: It does. That man is crazy or drunk, and I can't do a thing about it.
          emotion: sad
        - id: ch01-b05
          speaker: dan
          text: Don't say that where Dad can hear. He won't stand for liquor, and he told me you're the crazy one. Why in creation did you call him a thief? He's my dad.
        - id: ch01-b06
          speaker: narrator
          text: Harvey sat up, wiped his nose, and explained about the missing roll of bills.
        - id: ch01-b07
          speaker: harvey
          text: I'm not crazy. Your father has probably never seen more than five dollars at once, that's all. My father could buy this boat every week and never notice the cost.
        - id: ch01-b08
          speaker: dan
          text: You don't know what the We're Here is worth. Your father must have a mountain of money. How did he get it? Dad says a lunatic can't tell a straight story, so go ahead.
        - id: ch01-b09
          speaker: harvey
          text: Gold mines and other things out West.
        - id: ch01-b10
          speaker: dan
          text: I've read about business like that. Does he ride around with a pistol on a trick pony, like the circus? They call it the Wild West, and I've heard the bridles and spurs are solid silver.
        - id: ch01-b11
          speaker: harvey
          text: You are a chump! My father has no use for ponies. When he wants to travel, he takes his car.
        - id: ch01-b12
          speaker: narrator
          text: In spite of himself, Harvey was amused.
        - id: ch01-b13
          speaker: dan
          text: What kind? A lobster car?
        - id: ch01-b14
          speaker: harvey
          text: No, his private railroad car. Surely you've seen one sometime.
        - id: ch01-b15
          speaker: dan
          text: Slatin Beeman has one. I saw it at the Union Depot in Boston with three men cleaning its windows. But Beeman owns nearly every railroad on Long Island. They say he bought half of New Hampshire, fenced it in, and filled it with lions, tigers, bears, buffalo, crocodiles, and everything else. He's a millionaire. I've seen his car. So?
        - id: ch01-b16
          speaker: harvey
          text: Well, my father is what they call a multimillionaire. He owns two private cars. One is named Harvey, for me, and the other is named Constance, for my mother.
        - id: ch01-b17
          speaker: dan
          text: Wait. Dad never lets me swear, but I suppose you can. Before you say any more, swear you hope to die if you're lying.
        - id: ch01-b18
          speaker: harvey
          text: Of course I will.
        - id: ch01-b19
          speaker: dan
          text: That's not enough. Say, “Hope I may die if I'm not telling the truth.”
        - id: ch01-b20
          speaker: harvey
          text: I hope I die right here if every word I've said isn't the absolute truth.
        - id: ch01-b21
          speaker: dan
          text: Even the hundred and thirty-four dollars? I heard you talking to Dad, and I half expected the earth to swallow you like Jonah.
        - id: ch01-b22
          speaker: narrator
          text: Harvey protested until his face went red. Dan knew how to question a boy, and after ten minutes he decided Harvey was mostly telling the truth. Besides, Harvey had taken the most dreadful oath a boy could take, yet there he sat alive in the scuppers, red-nosed and piling wonder upon wonder.
        - id: ch01-b23
          speaker: dan
          text: Gosh, that's something!
          emotion: surprised
        - id: ch01-b24
          speaker: narrator
          text: The word came from the bottom of Dan's soul when Harvey finished listing everything inside the car named for him. Then a wicked grin spread across Dan's broad face.
        - id: ch01-b25
          speaker: dan
          text: I believe you, Harvey. Dad has made a mistake for once in his life.
        - id: ch01-b26
          speaker: harvey
          text: He certainly has.
        - id: ch01-b27
          speaker: narrator
          text: Harvey was already thinking about revenge.
        - id: ch01-b28
          speaker: dan
          text: He'll be mad all through. Dad hates being wrong about a man. Oh, Harvey, don't ruin the fun by letting him know.
        - id: ch01-b29
          speaker: narrator
          text: Dan leaned back, slapped his thigh, and laughed without a sound.
        - id: ch01-b30
          speaker: harvey
          text: I don't want him knocking me down again. But I will get even with him.
        - id: ch01-b31
          speaker: dan
          text: I never heard of anyone getting even with Dad. He'd surely knock you down again. The more wrong he was, the more likely he'd be to do it. But those gold mines and pistols—
        - id: ch01-b32
          speaker: harvey
          text: I never said anything about pistols.
        - id: ch01-b33
          speaker: narrator
          text: Harvey was still bound by his oath.
        - id: ch01-b34
          speaker: dan
          text: That's true. You didn't. So, two private cars, one named for you and one for your mother. Two hundred dollars a month in pocket money. And it all lands in the scuppers because you won't work for ten and a half dollars a month. That's the best catch of the season!
        - id: ch01-b35
          speaker: narrator
          text: Dan shook with silent chuckles.
        - id: ch01-b36
          speaker: harvey
          text: Then you agree I was right?
        - id: ch01-b37
          speaker: narrator
          text: Harvey thought at last he had found someone on his side.
        - id: ch01-b38
          speaker: dan
          text: Right? You were as wrong as anyone can be. Get to work beside me, or you'll catch it, and I'll catch it for defending you. Dad gives me double because I'm his son and he can't bear to favor family. I suppose you're angry with him. I have been plenty of times. But he's a mighty just man. The whole fleet says so.
        - id: ch01-b39
          speaker: harvey
          text: Does this look like justice?
        - id: ch01-b40
          speaker: narrator
          text: Harvey pointed to his injured nose.
        - id: ch01-b41
          speaker: dan
          text: That's nothing. It lets the shore blood out of you. Dad did it for your health. But listen. I won't deal with a boy who thinks Dad, or me, or anyone on the We're Here is a thief. We aren't some common gang off the wharf. We're fishermen. We've shipped together for more than six years, so don't mistake us for anything else.
        - id: ch01-b42
          speaker: dan
          text: Dad calls swearing a vain oath and pounds me for it. But if I could swear the way you did about your father and all his riches, I'd swear the same thing about your money. I don't know what was in your pockets when I dried your clothes, because I never looked. But Dad and I were the only ones who touched you after you came aboard, and neither of us knows anything about those dollars. That's my answer. What do you say?
        - id: ch01-b43
          speaker: narrator
          text: The nosebleed had certainly cleared Harvey's thoughts, and perhaps the loneliness of the sea helped too.
        - id: ch01-b44
          speaker: harvey
          text: All right, I believe you.
        - id: ch01-b45
          speaker: narrator
          text: He looked down, embarrassed.
        - id: ch01-b46
          speaker: harvey
          text: It seems to me that for someone who was just saved from drowning, I haven't been very grateful, Dan.
        - id: ch01-b47
          speaker: dan
          text: You were shaken up and foolish. Anyway, only Dad and I saw it. The cook doesn't count.
        - id: ch01-b48
          speaker: harvey
          text: I should have thought the bills might have been lost, instead of calling everyone I saw a thief. Where is your father?
        - id: ch01-b49
          speaker: dan
          text: In the cabin. What do you want with him now?
        - id: ch01-b50
          speaker: harvey
          text: You'll see.
        - id: ch01-b51
          speaker: narrator
          text: Harvey moved unsteadily toward the cabin steps. His head still rang. Above him, the little ship's clock hung where the helmsman could see it. Inside the chocolate-and-yellow cabin, Disko bent over a notebook and sucked now and then on an enormous black pencil.
        - id: ch01-b52
          speaker: harvey
          text: I haven't behaved very well.
        - id: ch01-b53
          speaker: narrator
          text: His own meek voice surprised him.
        - id: ch01-b54
          speaker: disko
          text: What's wrong now? Have you been fighting Dan?
        - id: ch01-b55
          speaker: harvey
          text: No. This is about you.
        - id: ch01-b56
          speaker: disko
          text: I'm listening.
        - id: ch01-b57
          speaker: harvey
          text: Well, I came to take back what I said. When a man saves you from drowning—
        - id: ch01-b58
          speaker: narrator
          text: Harvey swallowed hard.
        - id: ch01-b59
          speaker: disko
          text: Eh? Keep going this way and you may make a man yet.
        - id: ch01-b60
          speaker: harvey
          text: The person who was saved shouldn't begin by calling people names.
        - id: ch01-b61
          speaker: disko
          text: Just and right. Right and just.
        - id: ch01-b62
          speaker: narrator
          text: A trace of a dry smile crossed Disko's face.
        - id: ch01-b63
          speaker: harvey
          text: So I've come to say I'm sorry.
        - id: ch01-b64
          speaker: narrator
          text: He swallowed once more. Disko slowly rose from the locker and held out a hand eleven inches long.
        - id: ch01-b65
          speaker: disko
          text: I suspected it would do you a great deal of good, and this proves I wasn't wrong in my judgment.
        - id: ch01-b66
          speaker: narrator
          text: A muffled chuckle from the deck reached him.
        - id: ch01-b67
          speaker: disko
          text: I am very seldom wrong in my judgments. We'll put more strength into this hand before we're through with you, young fellow. I don't think any worse of you for what has passed. You weren't fully responsible. Go about your work and you'll come to no harm.
        - id: ch01-b68
          speaker: narrator
          text: His great hand closed around Harvey's and numbed his arm to the elbow.
        - id: ch01-b69
          speaker: dan
          text: That was decent of you.
        - id: ch01-b70
          speaker: narrator
          text: Harvey came back on deck with his ears burning.
        - id: ch01-b71
          speaker: harvey
          text: I don't feel decent.
        - id: ch01-b72
          speaker: dan
          text: I didn't mean how you feel. I heard Dad. When he says he doesn't think worse of a man, he has given himself away. He hates being wrong too. Once Dad makes up his mind, he'd sooner surrender to the British than change it. I'm glad that's settled properly.
        - id: ch01-b73
          speaker: dan
          text: Dad is right that we can't take you back. Fishing is how everyone aboard earns a living. The men will be back like sharks around a dead whale in half an hour.
        - id: ch01-b74
          speaker: harvey
          text: What are they coming back for?
        - id: ch01-b75
          speaker: dan
          text: Supper, of course. Doesn't your stomach tell you? You've got plenty to learn.
        - id: ch01-b76
          speaker: harvey
          text: I suppose I have.
          emotion: sad
        - id: ch01-b77
          speaker: narrator
          text: Harvey looked gloomily at the tangle of ropes and blocks overhead.
        - id: ch01-b78
          speaker: dan
          text: She's a beauty, isn't she? Wait until the mainsail is bent and she sails home loaded with wet salt. First, though, there's work to do.
        - id: ch01-b79
          speaker: narrator
          text: Dan pointed into the darkness of the open main hatch between the masts.
        - id: ch01-b80
          speaker: harvey
          text: What's that for? It's empty.
        - id: ch01-b81
          speaker: dan
          text: You and I and a few others have to fill it. That's where the fish go.
        - id: ch01-b82
          speaker: harvey
          text: Do the fish go in alive?
        - id: ch01-b83
          speaker: dan
          text: No. They should be dead, flat, and salted. There are a hundred hogsheads of salt in the bins, and so far we've hardly covered the gear at the bottom.
        - id: ch01-b84
          speaker: harvey
          text: Then where are the fish?
        - id: ch01-b85
          speaker: dan
          text: “In the sea, they say. In the boats, we pray.” You came in last night with about forty of them.
        - id: ch01-b86
          speaker: narrator
          text: Dan pointed to a wooden pen just ahead of the quarterdeck.
        - id: ch01-b87
          speaker: dan
          text: You and I will wash that out when the men finish. God send us full pens tonight! I've seen fish stacked so high that she sat half a foot lower in the water. We worked at the tables until we were so sleepy we nearly split ourselves instead of the cod. Here they come now.
        - id: ch01-b88
          speaker: narrator
          text: Beyond the low rail, half a dozen dories rowed toward them across a shining, silky sea.
        - id: ch01-b89
          speaker: harvey
          text: I've never seen the sea from so close to the water. It's beautiful.
        - id: ch01-b90
          speaker: narrator
          text: The low sun colored the water purple and pink. Golden light lay on the round backs of the long swells, while their hollows turned blue and mackerel-green. All around, schooners seemed to draw in their dories on invisible strings. The tiny black rowers moved like clockwork toys.
        - id: ch01-b91
          speaker: dan
          text: They've had good fishing. Manuel hasn't room for one more cod. His boat sits as low as a lily pad on still water, doesn't it?
        - id: ch01-b92
          speaker: harvey
          text: Which one is Manuel? How can you tell them apart from this far away?
        - id: ch01-b93
          speaker: dan
          text: He's in the last boat to the south. He found you last night. You can't mistake the way Manuel rows. East of him is Pennsylvania. Penn fishes much better than he rows, and he looks loaded with baking soda. Farther east, see how neatly the boats spread out? The man with the hunched shoulders is Long Jack.
        - id: ch01-b94
          speaker: dan
          text: He's from Galway and lives in South Boston, like most of them. Galway men are usually good in a boat. Far north, way over there, is Tom Platt. You'll hear him singing in a moment. He served on the old warship Ohio when she was the first American naval ship to round Cape Horn, or so he says. He talks about little else, except when he sings, but his fishing luck is fair. There! What did I tell you?
        - id: ch01-b95
          speaker: narrator
          text: A deep, tuneful roar came across the water from the northern dory. Harvey caught a line about cold hands and feet. Then the song rang clearer.
        - id: ch01-b96
          speaker: tom_platt
          text: Bring out the chart, the sorrowful chart. See where those mountains meet! The clouds lie thick around their heads, and the mists around their feet.
        - id: ch01-b97
          speaker: dan
          text: Full boat. If he gives us “O Captain,” then it's a double catch for Tom Platt.
        - id: ch01-b98
          speaker: narrator
          text: The voice rolled on over the water.
        - id: ch01-b99
          speaker: tom_platt
          text: And now to thee, O Captain, most earnestly I pray, that they shall never bury me in church or cloister gray.
        - id: ch01-b100
          speaker: dan
          text: Double catch it is. Tomorrow he'll tell you everything about the old Ohio. See the blue dory behind him? That's my uncle, Dad's own brother. If any bad luck is loose on the Banks, it finds Uncle Salters. Look how gently he's rowing. I'll bet my wages and share that he's the only man who got stung today, and got it badly.
        - id: ch01-b101
          speaker: harvey
          text: What stings him?
        - id: ch01-b102
          speaker: dan
          text: Mostly strawberries. Sometimes pumpkins, lemons, or cucumbers. Yes, he's swollen from his elbows down. That man's luck could stop you cold. Now let's take the tackles and hoist the boats aboard. Is it true that you've never done a bit of work in your life? That must feel awful.
        - id: ch01-b103
          speaker: harvey
          text: I'm going to try working anyway. It's just all completely new to me.
        - id: ch01-b104
          speaker: dan
          text: Then grab that tackle behind you!
        - id: ch01-b105
          speaker: narrator
          text: Harvey seized a rope with a long iron hook that hung from a mainmast stay. Dan pulled down another line from something he called the topping lift. Manuel brought his loaded dory alongside, flashed a brilliant smile, and began tossing fish into the deck pen with a short-handled fork.
        - id: ch01-b106
          speaker: manuel
          text: Two hundred and thirty-one!
        - id: ch01-b107
          speaker: dan
          text: Pass him the hook.
        - id: ch01-b108
          speaker: narrator
          text: Harvey put it into Manuel's hand. Manuel slipped it through a loop at the bow, fastened Dan's tackle to the stern becket, and climbed aboard the schooner.
        - id: ch01-b109
          speaker: dan
          text: Pull!
        - id: ch01-b110
          speaker: narrator
          text: Harvey pulled and was amazed at how easily the empty dory rose.
        - id: ch01-b111
          speaker: dan
          text: Stop! We don't store her in the treetops.
        - id: ch01-b112
          speaker: narrator
          text: Dan laughed. Harvey stopped with the boat hanging above his head.
        - id: ch01-b113
          speaker: dan
          text: Lower away!
        - id: ch01-b114
          speaker: narrator
          text: As Harvey eased the line, Dan guided the light boat with one hand until it settled behind the mainmast.
        - id: ch01-b115
          speaker: dan
          text: They weigh almost nothing when they're empty. That was pretty smart for a passenger. There's more skill to it in rough water.
        - id: ch01-b116
          speaker: manuel
          text: Ah-ha! You are feeling well now? Last night the fish were fishing for you. Today you fish for the fish, eh?
        - id: ch01-b117
          speaker: harvey
          text: I am very grateful to you.
        - id: ch01-b118
          speaker: narrator
          text: Harvey stammered, and his unlucky hand went toward his pocket again. Then he remembered there was no money to offer. Later, once he knew Manuel well, the thought of what he had nearly done would make him blush in his bunk.
        - id: ch01-b119
          speaker: manuel
          text: You have no need to thank me. How could I leave you drifting all around the Banks? Now you are a fisherman, eh? Ouh! Auh!
        - id: ch01-b120
          speaker: narrator
          text: Manuel bent stiffly forward and back from the hips to loosen himself.
        - id: ch01-b121
          speaker: manuel
          text: I did not clean my boat today. The fish came fast, and I was too busy. Danny, my son, clean her for me.
        - id: ch01-b122
          speaker: narrator
          text: Harvey stepped forward at once. At last there was something he could do for the man who had saved his life.
        - id: ch01-b123
          speaker: dan
          text: Pull out the floorboards. They slide in those grooves. Swab them and lay them down, and never let one jam. Someday you may need that boat in a hurry. Here comes Long Jack.
        - id: ch01-b124
          speaker: narrator
          text: Dan tossed him a swab. Harvey leaned over the dory and awkwardly scrubbed away the slime, but he worked with all his heart. Then a glittering stream of fish flew from another dory into the pen.
        - id: ch01-b125
          speaker: dan
          text: Manuel, take the tackle. I'll set up the tables. Harvey, finish his boat. Long Jack's dory goes on top.
        - id: ch01-b126
          speaker: narrator
          text: Harvey looked up from his scrubbing. The bottom of another dory hung right above him.
        - id: ch01-b127
          speaker: dan
          text: They're like those Indian puzzle boxes, aren't they?
        - id: ch01-b128
          speaker: narrator
          text: One boat dropped neatly inside the other. Long Jack was a long-lipped Galway man with gray in his chin. He bent and straightened just as Manuel had. From the cabin, Disko growled up the hatchway, and they heard him sucking his pencil.
        - id: ch01-b129
          speaker: long_jack
          text: The boy takes to it like a duck to water. One hundred and forty-nine and a half, and bad luck to you, Discobolus! I'm killing myself to fill your pockets. Mark it down as a poor catch. The Portuguese beat me.
        - id: ch01-b130
          speaker: narrator
          text: Another dory struck the schooner's side, and more cod poured into the pen.
        - id: ch01-b131
          speaker: tom_platt
          text: Two hundred and three! Now let me see the passenger.
        - id: ch01-b132
          speaker: narrator
          text: Tom Platt was even bigger than Long Jack. A purple scar ran from his left eye to the right corner of his mouth. Harvey knew no other way to help, so he swabbed every dory as it came down, pulled out its floorboards, and laid them inside.
        - id: ch01-b133
          speaker: tom_platt
          text: He's learning well. There are two ways to do anything. One is the fisherman's way, any end first with a slippery knot over everything. The other is—
        - id: ch01-b134
          speaker: dan
          text: The way you did it on the old Ohio! Move along, Tom Platt, and let me set the tables.
        - id: ch01-b135
          speaker: narrator
          text: Dan wedged one end of a long board into two notches in the rail, kicked out its leg, and ducked beneath Tom Platt's swinging fist.
        - id: ch01-b136
          speaker: tom_platt
          text: We did that on the Ohio too, Danny. See?
        - id: ch01-b137
          speaker: narrator
          text: Tom Platt laughed.
        - id: ch01-b138
          speaker: dan
          text: Then they must have had crooked eyes, because you missed. Keep bothering me and you'll find your boots hanging from the top of the mast. Go on! Can't you see I'm busy?
        - id: ch01-b139
          speaker: long_jack
          text: Danny, you sleep on the cable all day. You're the very peak of impudence, and you'll spoil our new cargo-master within a week.
        - id: ch01-b140
          speaker: dan
          text: His name is Harvey. Before long, he'll be worth five of any South Boston clam digger.
        - id: ch01-b141
          speaker: narrator
          text: Dan waved two strangely shaped knives, arranged them carefully on the table, tilted his head, and admired the sight.
        - id: ch01-b142
          speaker: penn
          text: I think I caught forty-two.
        - id: ch01-b143
          speaker: narrator
          text: A small voice rose from beside the schooner. A second voice answered, and the men burst out laughing.
        - id: ch01-b144
          speaker: uncle_salters
          text: Then my luck has changed at last, because I have forty-five, even with my arms stung out of shape.
        - id: ch01-b145
          speaker: penn
          text: It may be forty-two or forty-five. I've lost count.
        - id: ch01-b146
          speaker: dan
          text: That's Penn and Uncle Salters counting their catch. This is better than a circus. Just watch them!
        - id: ch01-b147
          speaker: long_jack
          text: Come aboard, children! It's wet out there.
        - id: ch01-b148
          speaker: uncle_salters
          text: You said forty-two.
        - id: ch01-b149
          speaker: penn
          text: Then I'll count them again.
        - id: ch01-b150
          speaker: narrator
          text: The two dories swung together and bumped the schooner.
        - id: ch01-b151
          speaker: uncle_salters
          text: Patience of Jerusalem! What ever made a farmer like you go to sea? You nearly smashed my boat.
        - id: ch01-b152
          speaker: penn
          text: I'm sorry, Mr. Salters. I came to sea because of nervous indigestion. I believe you advised me to.
        - id: ch01-b153
          speaker: uncle_salters
          text: You and your nervous indigestion can drown in the Whale-hole! You're drifting into me again. Was it forty-two or forty-five?
        - id: ch01-b154
          speaker: penn
          text: I've forgotten, Mr. Salters. Let us count them.
        - id: ch01-b155
          speaker: uncle_salters
          text: It can't be forty-five. I have forty-five. Count carefully, Penn.
        - id: ch01-b156
          speaker: narrator
          text: Disko came out of the cabin.
        - id: ch01-b157
          speaker: disko
          text: Salters, throw your fish aboard now.
        - id: ch01-b158
          speaker: dan
          text: Don't spoil the fun, Dad. Those two have only just started.
        - id: ch01-b159
          speaker: long_jack
          text: Mother of delight! He's lifting them aboard one at a time!
        - id: ch01-b160
          speaker: narrator
          text: Uncle Salters worked slowly with his fork while Penn counted a row of notches cut into the gunwale.
        - id: ch01-b161
          speaker: penn
          text: Oh. That was last week's catch.
        - id: ch01-b162
          speaker: narrator
          text: Penn looked up miserably, one finger holding his place. Manuel nudged Dan. Dan sprang to the after tackle, leaned far over the side, and caught the hook into the stern rope as Manuel secured the bow. The others hauled together and swung Penn's dory aboard with Penn and his fish still inside.
        - id: ch01-b163
          speaker: tom_platt
          text: One, two, four, nine... Forty-seven. Penn, you win!
        - id: ch01-b164
          speaker: narrator
          text: Tom Platt counted the catch with one practiced glance. Dan released the after tackle, and Penn slid over the stern onto the deck in a flood of his own fish.
        - id: ch01-b165
          speaker: uncle_salters
          text: Hold on! Wait! My count is mixed up.
        - id: ch01-b166
          speaker: narrator
          text: Uncle Salters bobbed beside them, bent at the waist. No one gave him time to argue. They hoisted him aboard and spilled him out just as they had Penn.
        - id: ch01-b167
          speaker: tom_platt
          text: Forty-one. A farmer beat you, Salters, and you call yourself a sailor!
        - id: ch01-b168
          speaker: uncle_salters
          text: That wasn't a fair count. And I'm stung all to pieces.
        - id: ch01-b169
          speaker: narrator
          text: He stumbled out of the fish pen. His thick hands were swollen and blotched purple and white.
        - id: ch01-b170
          speaker: dan
          text: Some people will find the bottom of a strawberry patch even if they have to dive for it.
        - id: ch01-b171
          speaker: narrator
          text: Dan addressed his remark to the newly risen moon.
        - id: ch01-b172
          speaker: uncle_salters
          text: And some people live on the fat of the land, do no work, and mock their own flesh and blood.
        - id: ch01-b173
          speaker: cook
          text: Sit down! Sit down!
        - id: ch01-b174
          speaker: narrator
          text: The call came from the forecastle. Disko, Tom Platt, Long Jack, and Salters went forward at once. Penn bent over his square deep-sea reel and the tangled cod lines. Manuel stretched flat on the deck. Dan dropped into the hold, where Harvey heard him striking casks with a hammer.
        - id: ch01-b175
          speaker: dan
          text: Salt. As soon as supper is over, we start dressing the fish. You'll pitch them down to Dad. He and Tom Platt stow together, so you'll hear them argue. You, me, Manuel, and Penn are the second half, the youth and beauty of the boat.
        - id: ch01-b176
          speaker: harvey
          text: What good does that do? I'm hungry.
        - id: ch01-b177
          speaker: dan
          text: They'll finish in a minute. Smell that! It's good tonight. Dad hires a fine cook, even if he does have to put up with his brother. We had a full catch today, didn't we? How deep was your water, Manuel?
        - id: ch01-b178
          speaker: narrator
          text: Dan pointed to the pens heaped with cod.
        - id: ch01-b179
          speaker: manuel
          text: Twenty-five fathoms. The fish came fast and strong. Someday I will show you, Harvey.
        - id: ch01-b180
          speaker: narrator
          text: The moon had begun to walk across the quiet sea before the older men returned. The cook did not need to call the second half. Dan and Manuel were through the hatch and at the table before Tom Platt, the slowest of the older men, had finished wiping his mouth with the back of his hand.
        - id: ch01-b181
          speaker: narrator
          text: Harvey followed Penn. Before him stood a tin pan filled with cod tongues and sounds, scraps of pork, and fried potato. There was hot bread and black, powerful coffee too. Hungry as everyone was, they waited while Penn solemnly said grace. Then they ate without a word until Dan paused above his tin cup.
        - id: ch01-b182
          speaker: dan
          text: How do you feel now, Harvey?
        - id: ch01-b183
          speaker: harvey
          text: Almost full, but I can fit one more piece.
        - id: ch01-b184
          speaker: narrator
          text: The cook was a huge Black man. Unlike any Black person Harvey had known, he said almost nothing. He only smiled and motioned for the boy to eat more.
        - id: ch01-b185
          speaker: dan
          text: See, Harvey? It's just as I told you. The young and handsome men, like Penn, Manuel, you, and me, are the second half. We eat after the first half finishes. They're old fish, mean and hunched, with stomachs that need pampering. So they eat first even though they don't deserve it. Isn't that right, Doctor?
        - id: ch01-b186
          speaker: narrator
          text: The cook nodded.
        - id: ch01-b187
          speaker: harvey
          text: Can't he talk?
        - id: ch01-b188
          speaker: narrator
          text: Harvey whispered the question.
        - id: ch01-b189
          speaker: dan
          text: Enough to manage. Not much that we understand. His own language is a strange one. He's from deep inside Cape Breton, where the farmers speak their homemade Scotch. Cape Breton is full of Black families whose people fled there during our war, and they talk like farmers, all rough and breathy.
        - id: ch01-b190
          speaker: penn
          text: That is not Scotch. It is Gaelic. I read so in a book.
        - id: ch01-b191
          speaker: dan
          text: Penn reads a great deal. Most of what he says is true, except when he's counting fish. Right, Penn?
        - id: ch01-b192
          speaker: harvey
          text: Does your father accept whatever number they give him? He doesn't check their catch?
        - id: ch01-b193
          speaker: dan
          text: Of course he does. Why would a man lie over a few old cod?
        - id: ch01-b194
          speaker: manuel
          text: One man lied about his catch. Every day he claimed five, ten, even twenty-five more fish than he brought in.
        - id: ch01-b195
          speaker: dan
          text: Where was that? He wasn't one of our people.
        - id: ch01-b196
          speaker: manuel
          text: A Frenchman from Anguille.
        - id: ch01-b197
          speaker: dan
          text: Ah, those West Shore Frenchmen can't count anyway. It stands to reason. If you find one of their soft hooks in a fish, Harvey, you'll understand why.
        - id: ch01-b198
          speaker: long_jack
          text: Always more and never less, every time we come to dress!
        - id: ch01-b199
          speaker: narrator
          text: Long Jack's roar came down the hatch. The second half scrambled up at once.
        - id: ch01-b200
          speaker: narrator
          text: Moonlight lay across the moving deck. The riding sail was never furled, and its shadow rolled back and forth with the shadows of the masts and rigging. Near the stern, the heap of cod shone like a mound of flowing silver. Below, Disko and Tom Platt tramped and rumbled among the salt bins.
        - id: ch01-b201
          speaker: narrator
          text: Dan handed Harvey a pitchfork and led him to the inner end of the rough table. Uncle Salters waited there, drumming the handle of his knife. A tub of salt water stood at his feet.
        - id: ch01-b202
          speaker: dan
          text: Pitch the fish down the hatch to Dad and Tom Platt. And be careful Uncle Salters doesn't cut out your eye.
        - id: ch01-b203
          speaker: narrator
          text: Dan swung into the hold to pass salt. Penn and Manuel stood knee-deep in the fish pen, each holding a drawn knife. Long Jack faced Uncle Salters across the table with mittens on his hands and a basket at his feet. Harvey stared from the pitchfork to the tub.
        - id: ch01-b204
          speaker: manuel
          text: Here comes a fish!
        - id: ch01-b205
          speaker: narrator
          text: Manuel bent, caught a cod with one finger under its gill and another in its eye, and swung it onto the pen's edge. His blade flashed with a tearing sound. He slit the fish from throat to belly, nicked both sides of its neck, and dropped it at Long Jack's feet.
        - id: ch01-b206
          speaker: long_jack
          text: Pass that fish along!
        - id: ch01-b207
          speaker: narrator
          text: One sweep of Long Jack's mitten sent the liver into the basket. Another wrench threw the head and insides away. The empty fish slid to Uncle Salters, who gave a fierce snort. His blade tore again. The backbone sailed over the rail, and the headless, gutted cod splashed into the tub, throwing salt water into Harvey's astonished mouth.
        - id: ch01-b208
          speaker: narrator
          text: After those first shouts, the men fell silent. Cod traveled down the line as if they were still alive. Harvey had hardly begun to understand their amazing speed when his tub filled.
        - id: ch01-b209
          speaker: uncle_salters
          text: Pitch!
        - id: ch01-b210
          speaker: narrator
          text: Without turning his head, Uncle Salters grunted the order. Harvey forked the fish down the hatch in twos and threes.
        - id: ch01-b211
          speaker: dan
          text: Keep them together when you pitch! Don't scatter them. Uncle Salters is the best splitter in the fleet. Watch him mind his book!
        - id: ch01-b212
          speaker: narrator
          text: The round little uncle did look like a man cutting magazine pages against a clock. Manuel stayed bent from the hips like a statue while his long arms never stopped reaching for fish. Penn worked bravely, though anyone could see that he was weak. Once or twice Manuel helped him without breaking the steady chain.
        - id: ch01-b213
          speaker: narrator
          text: Then Manuel howled as his finger caught on a French hook. Those soft metal hooks were meant to be bent back after use, but cod often escaped with them and were caught somewhere else. That was one of the many reasons Gloucester fishermen despised the French crews.
        - id: ch01-b214
          speaker: narrator
          text: In the hold, rough salt rasped over rough flesh with the steady whir of a grindstone. That sound ran beneath the click and nick of knives in the pen, the wrench and wet pull of heads and insides, the scrape of Salters's blade lifting backbones, and the slap of split bodies dropping into the tub. The whole deck worked to one unbroken rhythm.
        - id: ch01-b215
          speaker: narrator
          text: After an hour, Harvey would have given anything to rest. Fresh wet cod were heavier than he could have imagined, and the endless pitching made his back ache. Yet for the first time in his life, he felt he belonged to a working crew. He took pride in that thought, set his teeth, and kept going.
        - id: ch01-b216
          speaker: uncle_salters
          text: Pass me the sharp knives!
        - id: ch01-b217
          speaker: narrator
          text: Penn folded over among the cod, gasping. Manuel bent backward and forward to loosen his body. Long Jack leaned across the rail. The cook came like a silent black shadow, gathered up a load of heads and backbones, and vanished again.
        - id: ch01-b218
          speaker: long_jack
          text: Blood ends for breakfast and head chowder!
        - id: ch01-b219
          speaker: narrator
          text: Long Jack smacked his lips.
        - id: ch01-b220
          speaker: uncle_salters
          text: I need those knives!
        - id: ch01-b221
          speaker: narrator
          text: Uncle Salters waved his flat, curved splitting knife.
        - id: ch01-b222
          speaker: dan
          text: Look beside your foot, Harve!
        - id: ch01-b223
          speaker: narrator
          text: Harvey found half a dozen knives stuck into a cleat on the hatch rim. He passed them around and collected the dull blades.
        - id: ch01-b224
          speaker: disko
          text: Bring us some water!
        - id: ch01-b225
          speaker: dan
          text: The water barrel is forward, and the dipper is beside it. Hurry, Harve!
        - id: ch01-b226
          speaker: narrator
          text: Harvey returned within a minute with a great dipper of stale brown water. It tasted like nectar, and it loosened the cramped jaws of Disko and Tom Platt.
        - id: ch01-b227
          speaker: disko
          text: These are cod, Tom Platt. They aren't figs from Damascus or bars of silver. I've told you that every time we've sailed together.
        - id: ch01-b228
          speaker: tom_platt
          text: Seven seasons now. Good stowing is still good stowing. Even ballast has a right way and a wrong way. If you'd ever watched four hundred tons of iron being set into—
        - id: ch01-b229
          speaker: manuel
          text: Here we go again!
        - id: ch01-b230
          speaker: narrator
          text: At Manuel's shout, the line began moving again. It did not stop until the pen was empty.
        - id: ch01-b231
          speaker: narrator
          text: As soon as the last fish went below, Disko rolled aft to the cabin with his brother. Manuel and Long Jack went forward. Tom Platt stayed only long enough to slide the hatch shut, then disappeared too. Within half a minute, deep snores came from the cabin. Harvey stood staring blankly at Dan and Penn.
        - id: ch01-b232
          speaker: penn
          text: I did a little better that time, Danny. Still, I believe I ought to help clean up.
        - id: ch01-b233
          speaker: narrator
          text: Penn's eyelids sagged with sleep.
        - id: ch01-b234
          speaker: dan
          text: I wouldn't take your conscience for a thousand quintals. Go to bed, Penn. You don't have to do boys' work. Harvey, draw a bucket. Penn, before you sleep, empty these into the liver barrel. Can you stay awake that long?
        - id: ch01-b235
          speaker: narrator
          text: Penn lifted the heavy basket of cod livers and emptied it into a covered cask tied beside the forecastle. Then he too vanished into the cabin.
        - id: ch01-b236
          speaker: dan
          text: The boys clean after the fish are dressed. And in calm weather, the first watch belongs to the boys aboard the We're Here.
        - id: ch01-b237
          speaker: narrator
          text: Dan washed out the pen with great energy. He took down the table and set it in the moonlight to dry. Then he wiped the red knife blades through a bundle of oakum and sharpened them on a tiny grindstone. Under his direction, Harvey threw heads, backbones, and other scraps over the side.
        - id: ch01-b238
          speaker: narrator
          text: At the first splash, a silvery-white ghost rose straight out of the oily water and gave a strange, whistling sigh. Harvey jumped back with a cry. Dan only laughed.
        - id: ch01-b239
          speaker: dan
          text: It's a grampus begging for fish heads. They stand on end when they're hungry. Its breath smells like a sorrowful tomb, doesn't it?
        - id: ch01-b240
          speaker: narrator
          text: A dreadful stink of rotten fish filled the air as the white pillar sank and oily bubbles broke above it.
        - id: ch01-b241
          speaker: dan
          text: Haven't you ever seen a grampus stand on its tail? You'll see hundreds before this trip ends. It's good having another boy aboard. Otto was too old, and Dutch besides. We fought often enough. I wouldn't have minded if he had spoken a Christian language. Are you sleepy?
        - id: ch01-b242
          speaker: harvey
          text: Dead sleepy.
        - id: ch01-b243
          speaker: narrator
          text: Harvey's head nodded forward.
        - id: ch01-b244
          speaker: dan
          text: You must not sleep on watch. Wake up and make sure the anchor light is burning bright. You're on watch now, Harve.
        - id: ch01-b245
          speaker: harvey
          text: Oh, what could hurt us? It's bright as day. Sn-orrr!
        - id: ch01-b246
          speaker: dan
          text: Dad says this is exactly when things happen. Fine weather makes good sleeping. Before you know it, a liner cuts you in half. Then seventeen officers with brass on their coats, all perfect gentlemen, swear your light was out and the fog was thick. Harve, I've come to like you. But if you nod once more, I'll use a rope end on you.
        - id: ch01-b247
          speaker: narrator
          text: The moon sees many strange things on the Banks. That night it looked down on a slim boy in knickerbockers and a red jersey, staggering around the crowded deck of a seventy-ton schooner. Behind him walked another boy in the solemn manner of an executioner. He yawned and nodded between the blows he dealt with a knotted rope.
        - id: ch01-b248
          speaker: narrator
          text: The tied wheel groaned and kicked softly. The riding sail flapped whenever the light wind shifted, and the windlass creaked. Still the miserable march went on. Harvey argued, threatened, whimpered, and finally cried. Dan could barely form his sleepy words, but he praised the beauty of staying watchful and kept swinging the rope. He struck the dories almost as often as he struck Harvey.
        - id: ch01-b249
          speaker: narrator
          text: At last the cabin clock struck ten. On the tenth stroke, little Penn crept onto the deck. He found both boys collapsed in separate heaps on the main hatch, sleeping so deeply that he had to roll them into their bunks.
