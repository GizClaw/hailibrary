  chapters:
    - id: ch01
      title: 厨子留下，切恩看城
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 《我们在这儿号》那个沉默寡言的厨子另有打算。他把全部家当包在一块手帕里，径直登上“康斯坦丝号”。工钱多少、睡在哪里，他统统不在乎。梦里的启示已经说得明白，他余生唯一的使命就是跟随哈维。大家先同他讲道理，后来又好言相劝，可一个布雷顿角人到底不同于两个阿拉巴马黑人。厨子和车厢服务员争不出结果，只好请切恩裁断。
        - id: ch01-b02
          speaker: narrator
          text: 百万富翁听完只是哈哈大笑。他想，哈维迟早也许需要一个贴身仆人。何况一个自愿做事的人，顶得上五个花钱雇来的。那就让厨子留下吧，哪怕他自称麦克唐纳，还用盖尔语赌咒。私人车厢可以先开回波士顿。等他们到了那里，如果厨子仍不改主意，就把他一起带去西部。
        - id: ch01-b03
          speaker: narrator
          text: “康斯坦丝号”开走以后，切恩那套百万富翁的排场也没了。他本来就讨厌那节车厢。如今他一头扎进格洛斯特，打算把这座陌生城市摸透，正像他从前摸透斯诺霍米什到圣迭戈的每一座城。
        - id: ch01-b04
          speaker: narrator
          text: 弯弯曲曲的街道，一半是码头，一半是船具店。这里的人究竟靠什么赚钱？这门高尚的游戏又是怎样玩的？切恩自认是做生意的顶尖高手，很想弄明白。人们告诉他，新英格兰星期日的早餐桌上，每五个鱼丸便有四个来自格洛斯特。为了证明这句话，他们几乎用数字把他淹没。渔船、船具、临水码头、投入的资本、腌制、包装、工厂、保险、工资、修理和利润，样样都有一套统计。
        - id: ch01-b05
          speaker: narrator
          text: 他先找大船队的船主谈。那些船主手下的船长只是雇员，水手差不多全是瑞典人或葡萄牙人。随后，他又找少数拥有自己渔船的迪斯科谈，把两边的话都收进那颗硕大的脑袋里比较。他盘腿坐在旧船具铺的锚链上，带着西部人那种快活又永不满足的好奇心，一个问题接一个问题。整个海滨都在猜，这人活见鬼到底想干什么。
        - id: ch01-b06
          speaker: narrator
          text: 他还闯进互助保险会的办事处，非要人解释每天写在黑板上的那些神秘批语。这一下，全城每一家渔民寡妇孤儿救济会的秘书都闻风而来。他们厚着脸皮向切恩讨捐款，人人都想压过别家机构留下的纪录。切恩揪着胡子，干脆把他们全推给切恩太太应付。
        - id: ch01-b07
          speaker: narrator
          text: 切恩太太在东角附近一家寄宿公寓休养。那地方古怪得像是住客自己当家，桌布铺着红白方格，住在那里的人仿佛彼此认识了许多年。谁要是半夜饿了，大家还会一起起床做威尔士烤奶酪。住下后的第二天早晨，她下楼吃饭以前，便把那对独粒钻石首饰收了起来。
        - id: ch01-b08
          speaker: mrs_cheyne
          text: 这里的人真招人喜欢。待人亲切，又那么朴素，虽然差不多都是波士顿人。
        - id: ch01-b09
          speaker: cheyne
          text: 妈妈，那不是朴素。是另一种东西，一种我身上没有的东西。
        - id: ch01-b10
          speaker: mrs_cheyne
          text: 不会吧。这里的女人没一个穿得起一百美元的裙子。可我们……
        - id: ch01-b11
          speaker: cheyne
          text: 我知道，亲爱的，我们当然有。大概只是东部人的穿衣习惯。你在这里开心吗？
        - id: ch01-b12
          speaker: mrs_cheyne
          text: 我不大见得到哈维，他总跟着你。不过我已经不像以前那么担心了。
        - id: ch01-b13
          speaker: cheyne
          text: 自从威利死后，我从没这么快活过。我以前根本没明白，自己还有一个儿子。哈维会长成很了不起的小伙子。亲爱的，你要什么吗？头下要不要再垫个靠枕？好了，我们再去码头走走。
    - id: ch02
      title: 父子之间的交易
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那些日子，哈维简直成了父亲的影子。两人并肩走路，切恩总拿路面有坡当借口，把手搭在儿子方正的肩膀上。也就在这时候，哈维第一次留意并佩服起父亲的一种奇特本领。切恩只要跟街上的人聊几句，就能摸到一桩陌生事情的要害。从前哈维从没发现过这一点。
        - id: ch02-b02
          speaker: harvey
          text: 你什么底细都不告诉他们，怎么反倒能叫他们把什么都说出来？
        - id: ch02-b03
          speaker: cheyne
          text: 这些年我见过的人多了，大致能掂量出对方是什么人，对自己也有几分数。一个人有没有亲手干过活，别人通常看得出来。看出来了，他们就把他当自己人。
        - id: ch02-b04
          speaker: harvey
          text: 就像沃弗曼码头的人对我。现在我也是他们中间的一个。迪斯科告诉大家，那份工钱是我亲手挣的。可你瞧，我的手又全软了。
          emotion: sad
        - id: ch02-b05
          speaker: cheyne
          text: 往后几年读书，就先让它们软着。以后还磨得硬。
        - id: ch02-b06
          speaker: harvey
          text: 好吧，大概能。
        - id: ch02-b07
          speaker: cheyne
          text: 得由你自己选。你也可以躲到妈妈身后，让她为你的神经、天生敏感，还有那一套胡话大惊小怪。
        - id: ch02-b08
          speaker: harvey
          text: 我以前真这么做过？
        - id: ch02-b09
          speaker: narrator
          text: 哈维问得不安。切恩在码头边的座位上转过身，向他伸出一只长手。
        - id: ch02-b10
          speaker: cheyne
          text: 你我心里都明白。你不坦坦荡荡对我，我就没法把你教成人。只管你一个，我还有把握，只要你始终只代表自己。可要我同时对付你和妈妈，我可没这个本事。人生太短，怎么都不够用。
        - id: ch02-b11
          speaker: harvey
          text: 那么说，我还真不算个人物，是不是？
        - id: ch02-b12
          speaker: cheyne
          text: 这有很大一部分是我的错。不过既然你问实话，那么到今天为止，你确实还没成什么人物。对不对？
        - id: ch02-b13
          speaker: harvey
          text: 嗯。可迪斯科觉得……对了，从我出生到现在，养我一共花了多少钱？
        - id: ch02-b14
          speaker: cheyne
          text: 我没记账。真按美元美分估，大概更接近五万，不是四万，也可能有六万。养下一代真费钱。他们什么都要，拿到又厌，最后总是老头子付账。
        - id: ch02-b15
          speaker: narrator
          text: 哈维吹了一声口哨。想到自己竟值这么多养育费，他还有点得意。
        - id: ch02-b16
          speaker: harvey
          text: 那些钱全算沉没资本，对吧？
        - id: ch02-b17
          speaker: cheyne
          text: 是投资，哈维。但愿真是投资。
        - id: ch02-b18
          speaker: harvey
          text: 就算三万吧。我挣的三十块，等于每一百块只收回十美分。这一网捞得够差。
        - id: ch02-b19
          speaker: narrator
          text: 切恩笑得差点从木桩上栽进水里。
        - id: ch02-b20
          speaker: harvey
          text: 迪斯科从丹身上收回的多得多。丹十岁就开始干活，一年还有一半时间上学。
        - id: ch02-b21
          speaker: cheyne
          text: 哦，你绕了这么久，就是想说这个？
        - id: ch02-b22
          speaker: harvey
          text: 不是，我什么也不想求。我只是再也没法为自己得意了。我真该挨上一脚。
          emotion: sad
        - id: ch02-b23
          speaker: cheyne
          text: 我踢不下去，老伙计。我要是天生会做这种事，大概真会踢。
        - id: ch02-b24
          speaker: harvey
          text: 那我会记一辈子，也一辈子不原谅你。
        - id: ch02-b25
          speaker: cheyne
          text: 对。换成我，我也不会原谅。现在懂了吗？
        - id: ch02-b26
          speaker: harvey
          text: 懂了。错在我自己，不能怪别人。可无论如何，我总得想个办法。
        - id: ch02-b27
          speaker: narrator
          text: 切恩从背心口袋掏出一支雪茄，咬掉烟头，点起来抽。父子俩长得十分相像。胡子遮住了父亲的嘴，可哈维有他微带鹰钩的鼻子、挨得很近的黑眼睛，还有窄而高的颧骨。只要在脸上抹一点棕色，他扮成故事书里的印第安人，一定神气得很。
        - id: ch02-b28
          speaker: cheyne
          text: 从现在起，你每年可以花我六千到八千美元，直到你有选举权。那时就算你成人了。以后你还能每年花四五万，再加上妈妈给的钱。你可以带男仆、买游艇、弄一座漂亮牧场，装模作样养赛马，再陪那群朋友打牌。
        - id: ch02-b29
          speaker: harvey
          text: 像洛里·塔克那样？
        - id: ch02-b30
          speaker: cheyne
          text: 对，也可以像德维特家的两个孩子，或者老麦奎德的儿子。加利福尼亚到处是这种人。瞧，东部的样品也来了。
        - id: ch02-b31
          speaker: narrator
          text: 一条乌黑锃亮的蒸汽游艇喷着烟驶进港湾。艇上有红木甲板室、镀镍罗盘柜和粉白条纹遮篷，桅上还飘着纽约一家俱乐部的燕尾旗。两个年轻人穿着自以为像样的海员服，坐在客厅天窗旁打牌。两个撑着红蓝阳伞的女人在一边看着，放声大笑。游艇减慢速度，靠向系泊浮筒，哈维挑剔地从头到尾打量它。
        - id: ch02-b32
          speaker: harvey
          text: 只要起一点像样的风，我都不愿让人看见我在这种船上。它的船身太窄了。
        - id: ch02-b33
          speaker: cheyne
          text: 这就是他们说的快活日子。我能给你这种生活，再奢侈一倍也给得起。你觉得怎么样？
        - id: ch02-b34
          speaker: harvey
          text: 老天，他们哪能那样放小艇？我要是连滑车都使不好，干脆永远待在岸上。可我要是不选这条路呢？
        - id: ch02-b35
          speaker: cheyne
          text: 不选待在岸上？还是不选什么？
        - id: ch02-b36
          speaker: harvey
          text: 不选游艇和牧场，不靠老头子养活，遇上麻烦也不躲到妈妈身后。
        - id: ch02-b37
          speaker: cheyne
          text: 那么，我的儿子，你就进来跟我一起干。
        - id: ch02-b38
          speaker: harvey
          text: 一个月十美元？
        - id: ch02-b39
          speaker: cheyne
          text: 在你值更多以前，一美分也不会多。你还得过几年才能到那一步。
        - id: ch02-b40
          speaker: harvey
          text: 我宁可先进办公室扫地。那些大人物不都是这么起步的吗？至少现在就能挣一点，总比……
        - id: ch02-b41
          speaker: cheyne
          text: 我懂，人人都会这么想。不过扫地这种活，雇谁都能做。我也犯过同样的错，起步太早了。
        - id: ch02-b42
          speaker: harvey
          text: 一个价值三千万美元的错？能换来这些，我愿意冒险。
        - id: ch02-b43
          speaker: cheyne
          text: 我有得到的，也有失去的。现在讲给你听。
        - id: ch02-b44
          speaker: narrator
          text: 切恩揪着胡子，望着平静的水面微笑，然后转开脸说了下去。哈维渐渐听出，父亲讲的是自己的一生。切恩的声音低沉平稳，没有手势，也没有表情。可这段经历哪怕同时卖给十几家大报，它们也会心甘情愿付出重金。这四十年的故事，同时也是一部还没人写下的新西部历史。
        - id: ch02-b45
          speaker: narrator
          text: 故事从一个无亲无故、被丢在得克萨斯自谋生路的男孩开始，随后穿过人生里上百次奇怪的转折。场景从一个西部州换到另一个州，从一个月里拔地而起、一个季度后便彻底枯萎的城市，又换到比那些城市更荒凉的营地和更疯狂的冒险。到了今天，当年的营地已经变成忙着铺路的市镇。
        - id: ch02-b46
          speaker: narrator
          text: 故事里有三条建成的铁路，第四条却叫人故意毁掉。还有轮船、乡镇、森林和矿山，以及从世界各地来驾驶轮船、创建城镇、砍伐森林、开掘矿山的人。成为巨富的机会曾明晃晃摆在看不见它的人面前，也曾仅仅因为行程和时机差了一线，就从人的手边溜走。
        - id: ch02-b47
          speaker: narrator
          text: 在这场疯狂变化里，哈维·切恩有时骑马，更多时候靠双脚走。他忽富忽穷，在一个个地方进进出出、来来回回。他做过甲板水手、铁路工、承包商、寄宿公寓老板、记者、工程师、推销员、地产经纪和政客，也做过赖账鬼、酒贩子、矿主、投机商、牧牛人和流浪汉。不论身份怎样变，他始终机敏而安静，只顾追逐自己的目标。照他自己的说法，他追求的还有国家的荣耀与进步。
        - id: ch02-b48
          speaker: narrator
          text: 有一种信念从没丢下他。哪怕整个人悬在绝望的破边上，他仍会牢牢抓住它。那信念来自他对人和事情的了解。他像在自言自语，说自己无论何时都有多大的胆量、多灵活的办法。这些事在他心里本来就不必解释，所以他的语调甚至没有变。他讲自己如何击败仇敌，又如何宽恕他们，正如在那些无所顾忌的年月里，别人也曾击败或宽恕他。
        - id: ch02-b49
          speaker: narrator
          text: 他曾对城镇、公司和财团软求、巧哄、硬逼，说到底都是为了它们长远的好处。他绕过山岭峡谷，从中间钻过，也从底下爬过，身后拖着一条仿佛由细绳和铁箍拼成的铁路。到了最后，他只安安静静坐着，任由各个地方把他残存的那点名声撕得粉碎。
        - id: ch02-b50
          speaker: narrator
          text: 暮色越来越深，雪茄的红点照出切恩脸上的沟壑和浓眉。哈维微微侧着头，目不转睛地盯住父亲，几乎连气也忘了喘。听这故事，就像在黑暗里看一列机车呼啸着横穿大地，每隔一英里，敞开的炉门才闪一下火光。只是这列机车会说话，每句话都震撼着男孩，直撞进他的灵魂深处。
        - id: ch02-b51
          speaker: narrator
          text: 切恩终于扔掉烟蒂。父子俩坐在黑暗里，听水波在脚下轻轻拍响。
        - id: ch02-b52
          speaker: cheyne
          text: 这些话，我从来没对别人说过。
        - id: ch02-b53
          speaker: harvey
          text: 这是我听过最了不起的事！
          emotion: surprised
        - id: ch02-b54
          speaker: cheyne
          text: 这些都是我得到的。现在说说我没得到的。你也许觉得不算什么，可我不想让你到了我这个年纪才懂。我会用人，做自己的生意也不傻。可是，我比不了真正受过教育的人。我一路东拼西凑地学，大概浑身都露着这份底子。
        - id: ch02-b55
          speaker: harvey
          text: 我从来没看出来！
          emotion: angry
        - id: ch02-b56
          speaker: cheyne
          text: 你以后会看出来。大学念完，马上就能看见。别人把我当成他们说的粗坯时，是什么眼神，难道我不明白？我能把他们砸碎，却打不到他们真正疼的地方。我不是说他们高不可攀，可我总觉得自己差得太远。
        - id: ch02-b57
          speaker: cheyne
          text: 如今你有这个机会。四周能学的东西，你都得尽量吸进去，还会跟一群也在这样用功的人一起生活。他们学这些，最多不过为了将来一年挣几千美元。可你要记住，你学，是为了几百万。你得学够法律，等我撒手以后，才能照管自己的产业。还得同市场上最优秀的人站稳交情，往后他们都会用得着。
        - id: ch02-b58
          speaker: cheyne
          text: 最要紧的，是把最普通、最平常的书本学问装进脑子。那些人人坐下来，胳膊肘撑在桌上，托着下巴苦读的东西，没有什么比它更划算。在我们这个国家，不管经商还是从政，这些学问只会一年比一年值钱。以后你就知道了。
        - id: ch02-b59
          speaker: harvey
          text: 这笔交易对我可一点甜头都没有。大学要念四年！早知道我就选男仆和游艇了。
        - id: ch02-b60
          speaker: cheyne
          text: 别急，孩子。你是在把本钱投到回报最丰厚的地方。等你准备接手，我们的产业大概一分钱也不会少。今晚好好想，明早告诉我。快走，晚饭要迟到了。
        - id: ch02-b61
          speaker: narrator
          text: 既然这是一次生意谈判，哈维自然觉得不必告诉母亲，切恩也理所当然抱着同样的看法。可切恩太太看出了端倪，心里既害怕，又有一点嫉妒。那个从前骑在她头上任意撒野的孩子不见了，眼前换成一个面容精悍、沉默得异乎寻常的少年，而且他说的大多数话都是对父亲说的。她明白这是生意，因此不归她管。即便心里还留着疑虑，切恩去了一趟波士顿，带回一枚新买的侯爵形钻戒，也足以让那些疑虑消散。
        - id: ch02-b62
          speaker: mrs_cheyne
          text: 你们两个这次又做了什么？
        - id: ch02-b63
          speaker: cheyne
          text: 只是聊了聊，妈妈。哈维待人并不刻薄。
        - id: ch02-b64
          speaker: narrator
          text: 哈维确实不刻薄。他靠自己谈下一份协议，还郑重说明铁路引不起他的兴趣，木材、地产和矿业也一样。他一心只想掌管父亲新买的帆船航线。只要父亲答应在他认为合理的期限内把航线交给他，他就保证在大学里勤奋自持四五年。每个假期，他还要获准查清航线的一切。他对这件事要问的问题还不到两千个，从保险柜里父亲最私密的文件，到旧金山港里的拖船，一样也不能瞒。
        - id: ch02-b65
          speaker: cheyne
          text: 成交。当然，大学还没读完，你会改二十回主意。不过你要是真能像样接手，又没在二十三岁以前把航线弄垮，我就把整盘生意转给你。怎么样？
        - id: ch02-b66
          speaker: harvey
          text: 不行。拆开一桩正在赚钱的买卖，从来不划算。世上的竞争已经够多了。迪斯科说，血亲就得抱成一团。他手下的人从不背弃他，所以他们总能捕到满舱鱼。对了，《我们在这儿号》星期一就去乔治浅滩。他们在岸上总待不久，对吧？
        - id: ch02-b67
          speaker: cheyne
          text: 那我们也该走了。我的生意散在两大洋之间，线头都悬着，该重新接起来。可我真舍不得。二十年来，我没度过这样的假。
        - id: ch02-b68
          speaker: harvey
          text: 总不能不送迪斯科开船。而且星期一是阵亡将士纪念日。无论如何，过完那天再走。
        - id: ch02-b69
          speaker: cheyne
          text: 寄宿公寓的人一直议论。这个纪念活动究竟是什么？
        - id: ch02-b70
          speaker: harvey
          text: 照我弄明白的看，这像是专给夏季住客拼出来的一场表演，有唱歌，也有别的节目。迪斯科不大瞧得上，因为他们还会替寡妇孤儿募捐。迪斯科这个人很独立，你没发现吗？
        - id: ch02-b71
          speaker: cheyne
          text: 嗯，看出一点。有时候很明显。那么，是全城的庆典？
        - id: ch02-b72
          speaker: harvey
          text: 夏天办的这个算是。他们会念出上次以来淹死或失踪的人名，还会演讲、朗诵，什么都有。迪斯科说，节目结束后，各家救济会的秘书就会跑到后院，为抢捐款打架。他说真正的纪念活动在春天，那时所有牧师都会参加，城里也没有夏季住客。
        - id: ch02-b73
          speaker: cheyne
          text: 我懂了。我们留下过纪念日，下午再走。
        - id: ch02-b74
          speaker: harvey
          text: 我马上去找迪斯科，让他开船前把全班人带来。我当然得跟他们站在一起。
        - id: ch02-b75
          speaker: cheyne
          text: 原来如此。我只是个可怜的夏季住客，你却是……
        - id: ch02-b76
          speaker: harvey
          text: 大浅滩渔夫！血统纯正的大浅滩渔夫！
          emotion: happy
    - id: ch03
      title: 纪念日的大厅
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 迪斯科一向讨厌公开求人施舍的仪式，可哈维求他说，《我们在这儿号》的人不来，这一天对他便毫无光彩。迪斯科答应了，却先提了一个条件。海滨人人都知道全世界的事，大家已经听说费城来了一位女演员，迪斯科怀疑她会朗诵《艾尔森船长之行》。他本人对戏子和夏季住客一样没好感。可公道毕竟是公道。虽然他自己也曾判断错过一次，眼下这件错事却绝不能发生。说到这里，丹还暗暗发笑。
        - id: ch03-b02
          speaker: narrator
          text: 哈维回到东格洛斯特，花了半天向那位名震两岸的女演员解释。她听得忍不住笑，最后也承认，迪斯科说得对，公道应该伸张。
        - id: ch03-b03
          speaker: narrator
          text: 切恩凭多年经验，早知道会有怎样的场面。任何公开议论的大集会，对他来说都像美酒佳肴，最合脾胃。那个闷热朦胧的早晨，一辆辆有轨电车急急向西驶去。车里坐满穿轻薄夏装的女人，还有刚从波士顿写字台前出来、脸色苍白、头戴草帽的男人。邮局外堆满自行车，忙碌的官员来来往往，彼此问候。沉重的空气里，彩旗慢吞吞地一扬一落，一位要人还在用水管冲洗砖铺的人行道。
        - id: ch03-b04
          speaker: cheyne
          text: 妈妈，西雅图烧毁以后，大家重新把城办起来的样子，你还记得吗？
        - id: ch03-b05
          speaker: narrator
          text: 切恩太太点点头，挑剔地看着弯曲的街道。她和丈夫一样熟悉西部的集会，也在拿眼前这一场和过去见过的逐一比较。
        - id: ch03-b06
          speaker: narrator
          text: 渔民涌到市政厅前。葡萄牙人面颊泛青，他们的女人大多不戴帽子，或只在头上披一条围巾。新斯科舍和海洋诸省的人眼神清亮。法国人、意大利人、瑞典人、丹麦人，还有沿海双桅船上的外来水手也来了。到处都有穿黑衣的女人。她们怀着阴郁的骄傲彼此问候，因为在一年所有日子里，今天对她们最要紧。
        - id: ch03-b07
          speaker: narrator
          text: 各教派的牧师也到了。有的是趁海滨休养、平日牧养富丽大教堂的名牧，也有真正做牧养工作的人，从山上教堂的神父，到满脸乱须、从前当过水手的路德宗牧师。他同二十条船上的人都称兄道弟。大船队的船主是救济会的大捐助者，小船主却只有寥寥几条船，连龙骨到桅顶都抵押出去了。银行家、海险经纪、拖船和供水船船长、帆缆工、装配工、码头工、腌鱼工、造船匠和桶匠也全都来了。夏季住客的衣裙把一排排座椅染得鲜亮。
        - id: ch03-b08
          speaker: civic_official
          text: 切恩先生，您觉得我们这座城怎么样？太太，您想坐哪里都行。你们西部想必也办这种活动吧？
        - id: ch03-b09
          speaker: cheyne
          text: 办，不过我们的历史没有你们这么久。
        - id: ch03-b10
          speaker: civic_official
          text: 那当然。我们庆祝建城二百五十周年时，您真该来看看。那一回，这座老城可给自己长足了脸。
        - id: ch03-b11
          speaker: cheyne
          text: 我听说过。这种事也能带来收益。不过这座城怎么连一家头等旅馆都没有？
        - id: ch03-b12
          speaker: civic_official
          text: 佩德罗，你们坐左边，那里空位多。切恩先生，旅馆这件事我一直在说，里面有大钱可赚。不过您大概看不上这点钱。我们需要的是……
        - id: ch03-b13
          speaker: narrator
          text: 一只沉重的大手落在官员的细呢肩头。替波特兰运煤运冰的卡森船长满脸通红，把他扳过半个身子。
        - id: ch03-b14
          speaker: carson
          text: 你们到底怎么想的？正经男人都出海时，偏给全城套上禁酒法！我离开以后，这城干得像根骨头，气味却更坏了。至少也该留一家酒馆，让人进去喝汽水吧？
        - id: ch03-b15
          speaker: civic_official
          text: 看来你今早没耽误滋养自己，卡森。政治问题以后再谈。先坐到门边，好好想想你的论据，等我回来。
        - id: ch03-b16
          speaker: carson
          text: 我要论据做什么？密克隆的香槟才十八美元一箱，而且……
        - id: ch03-b17
          speaker: narrator
          text: 管风琴奏起前奏，卡森闭了嘴，一歪身坐下来。
        - id: ch03-b18
          speaker: civic_official
          text: 这是我们的新管风琴，花了四千美元。为了付账，明年只好恢复高额酒牌费。牧师们开会，可不能让他们把宗教全占了。现在唱歌的是救济会的孤儿，我太太教的。回头见，台上有人找我。
        - id: ch03-b19
          speakers: [children_1, children_2, children_3]
          ensemble: chorus
          text: 主的一切造物啊，请祝福主。赞美他，永永远远尊他为大！
        - id: ch03-b20
          speaker: narrator
          text: 孩子们高亢、清澈而准确的歌声压住了众人落座时最后一点嘈杂。反复回荡的歌声充满大厅，女人们纷纷探身去看。切恩太太和其他几个人呼吸急促起来。她从没想到，世上的寡妇竟有这么多。她本能地在人群里寻找哈维。哈维已经到了听众席后方，理所当然站在丹和迪斯科中间。索尔特斯叔叔前一晚才和宾恩从帕姆利科湾回来，此刻满脸怀疑地打量着他。
        - id: ch03-b21
          speaker: salters
          text: 你家里人还没走？那你穿成这样站在这里做什么？
        - id: ch03-b22
          speakers: [children_1, children_2, children_3]
          ensemble: chorus
          text: 海洋与洪水啊，请祝福主。赞美他，永永远远尊他为大！
        - id: ch03-b23
          speaker: dan
          text: 他怎么没资格？他去过那里，跟我们大家一样。
        - id: ch03-b24
          speaker: salters
          text: 穿这身衣服就没资格。
        - id: ch03-b25
          speaker: disko
          text: 闭嘴，索尔特斯，你的坏脾气又犯了。哈维，就站在那里别动。
        - id: ch03-b26
          speaker: narrator
          text: 当天的演说家也是市政的一根支柱。他先代表格洛斯特欢迎全世界，顺便点出这座城胜过别处的种种地方。接着，他讲到格洛斯特从海上取得的财富，也讲到每年收获这些财富必须付出的代价。稍后要念出的本城死难者共有一百一十七人。寡妇们听见这个数字，轻轻一颤，彼此望了一眼。
        - id: ch03-b27
          speaker: narrator
          text: 格洛斯特没有规模惊人的磨坊和工厂可以夸耀。她的儿子只按大海肯给的报酬劳作，而人人都知道，乔治浅滩和大浅滩从来不是安稳的牧牛场。岸上的人最多只能帮助留下来的寡妇和孤儿。演说家又说了几句套话，趁机代表全城感谢那些热心公益、愿意参加当天庆典的人士。
        - id: ch03-b28
          speaker: disko
          text: 我讨厌的就是那种求人施舍的话。听了会叫人看错我们。
        - id: ch03-b29
          speaker: salters
          text: 人有机会时不早做打算、不积蓄，以后穷了就该害臊。小子，你得记住。财富只能留一阵子，要是拿去乱花，净买那些奢……
        - id: ch03-b30
          speaker: penn
          text: 可要是一切都失去了呢？从前有一回……我在一本书里读过，一条船上的人全沉了，只剩一个人。那个人对我说……
        - id: ch03-b31
          speaker: salters
          text: 胡说！宾恩，你少看点书，多管好自己的饭食，也许还能多挣一点，抵掉你的吃用。
        - id: ch03-b32
          speaker: narrator
          text: 哈维紧紧挤在渔民中间。一阵阴森森、麻酥酥的颤栗从后颈开始，沿着脊背一直爬到靴子里。大厅里的天气闷热得叫人透不过气，他却偏偏觉得浑身发冷。
        - id: ch03-b33
          speaker: disko
          text: 台上那个就是费城来的女戏子？老艾尔森的事情，你已经替她纠正了吧？现在你该明白为什么了。
        - id: ch03-b34
          speaker: narrator
          text: 女演员没有念《艾尔森船长之行》，而是朗诵一首写布里克瑟姆渔港的诗。一个风暴之夜，拖网船队顶着逆风抢港。岸上的女人们把手边能找到的东西全搬来，在码头尽头烧起一堆为船只指路的火。
        - id: ch03-b35
          speaker: actress
          text: 她们拿来祖母的毯子。祖母冻得发抖，却催她们快去。她们又拿来婴儿的摇篮，婴儿还不会开口说不许。
        - id: ch03-b36
          speaker: dan
          text: 嚯，真带劲！不过这堆火准烧掉不少钱。
        - id: ch03-b37
          speaker: long_jack
          text: 丹尼，这是土拨鼠走投无路才用的拼命办法。那个港口的灯塔太差了。
        - id: ch03-b38
          speaker: actress
          text: 她们始终不知道，点亮的究竟是救命的篝火，还是送葬的柴堆。
        - id: ch03-b39
          speaker: narrator
          text: 那奇妙的嗓音揪住了每个人的心。她讲到浑身湿透的水手被海浪抛上岸，有人还活着，有人已经死去。岸上的人把尸体一具具抬到火光里，又一个个询问，孩子，这是你的父亲吗？妻子，这是你的丈夫吗？长椅之间到处传来沉重的呼吸声。
        - id: ch03-b40
          speaker: actress
          text: 每当布里克瑟姆的船出港迎战风浪，请记住，有一份爱会跟它远行，像光一样落在片片船帆上。
        - id: ch03-b41
          speaker: narrator
          text: 朗诵结束，掌声很少。女人们都在找手帕，许多男人眼里闪着水光，只管抬头盯着天花板。
        - id: ch03-b42
          speaker: salters
          text: 这一段放在戏院里，得卖一美元，也许两美元。有些人当然付得起。可我看，白白送出去太糟蹋了。话说回来，巴特·爱德华兹船长怎么也漂到这里来了？
        - id: ch03-b43
          speaker: eastport_man
          text: 没人压得住他。他是诗人，非念自己的作品不可。再说，他也算我们那一带的人。
        - id: ch03-b44
          speaker: narrator
          text: 巴特·爱德华兹船长已经连续五年争取在格洛斯特纪念日朗诵自己的诗。一群又好笑又疲惫的委员终于答应了他。老人穿着最好的星期日礼服站起来，神情朴实而全然幸福。他还没开口，便先赢得了听众。接着，他用三十七节像斧头凿出来一样生硬的诗，把双桅船《琼·哈斯肯号》在一八六七年风暴中沉没于乔治浅滩外的经过，事无巨细全念了一遍。大家一声不响地坐到最后，等他念完，又带着善意齐声高喊喝彩。
        - id: ch03-b45
          speaker: narrator
          text: 一位有远见的波士顿记者悄悄溜出大厅。他打算拿到这篇史诗的全文，再好好采访作者。爱德华兹已经七十三岁，做过捕鲸人、造船匠、渔船船长，如今又成了诗人。对他来说，人世间再没有比这更好的礼物了。
        - id: ch03-b46
          speaker: eastport_man
          text: 这才讲道理。我去过那片海，还拿着他的文章，完全照他刚才念的读过。我能作证，他什么都写进去了。
        - id: ch03-b47
          speaker: salters
          text: 丹要是不能在早餐前用一只手写得更好，就该挨鞭子。不过我承认，按缅因州的标准，那老头还真有点文才。可是……
        - id: ch03-b48
          speaker: dan
          text: 索尔特斯叔叔这回怕是要死了，他一辈子头一回夸我。哈维，你怎么一句话也不说？脸都绿了，不舒服吗？
        - id: ch03-b49
          speaker: harvey
          text: 我不知道。好像身体里面太大，外面装不下，塞得满满的，还一直发抖。
        - id: ch03-b50
          speaker: dan
          text: 消化不良？那可糟了。等名单念完，我们就走，正好赶上潮水。
        - id: ch03-b51
          speaker: narrator
          text: 那些寡妇几乎都是这一季才失去丈夫。她们把身子绷得笔直，像一群等着挨枪的人，因为她们知道接下来会听见什么。穿粉红、浅蓝衬衫的夏季女客也不再偷笑，纷纷回头寻找突然沉默的缘故。先前和切恩说话的官员走上台，渔民向前挤去。他按月份念起这一年的死难者。去年九月遇难的大多是单身汉和外乡人，大厅里却静得让他的声音格外响亮。
        - id: ch03-b52
          speaker: list_reader
          text: 九月九日，双桅船《弗洛里·安德森号》在乔治浅滩外沉没，无人生还。鲁本·皮特曼，船长，五十岁，未婚，本市大街。埃米尔·奥尔森，十九岁，未婚，本市哈蒙德街三百二十九号，丹麦人。奥斯卡·斯坦德伯格，二十五岁，未婚，瑞典人。卡尔·斯坦伯格，二十八岁，未婚，本市大街。佩德罗，据称来自马德拉，未婚，本市基恩寄宿公寓。约瑟夫·威尔士，又名约瑟夫·赖特，三十岁，纽芬兰圣约翰斯。
        - id: ch03-b53
          speaker: bereaved_uncle
          text: 不，他是缅因州奥古斯塔人。
        - id: ch03-b54
          speaker: list_reader
          text: 名单上说，他从圣约翰斯上船。
        - id: ch03-b55
          speaker: bereaved_uncle
          text: 我知道。可他家在奥古斯塔，他是我外甥。
        - id: ch03-b56
          speaker: narrator
          text: 宣读者拿铅笔在名单边改了一笔，又念下去。
        - id: ch03-b57
          speaker: list_reader
          text: 同船，查理·里奇，三十三岁，未婚，新斯科舍利物浦。艾伯特·梅，二十七岁，未婚，本市罗杰斯街二百六十七号。九月二十七日，奥文·多拉德，三十岁，已婚，在东角外从小艇落水溺亡。
        - id: ch03-b58
          speaker: narrator
          text: 这一枪打中了。一个寡妇猛地缩了一下，两手反复握紧又松开。切恩太太原本睁大眼睛听着，这时突然仰起头，喉咙哽住。丹的母亲坐在右边几排，马上走到她身旁。名单还在继续。念到一月、二月的海难，子弹已经落得又密又急，寡妇们从牙缝间倒抽冷气。
        - id: ch03-b59
          speaker: list_reader
          text: 二月十四日，双桅船《哈里·伦道夫号》从纽芬兰返航时桅杆折断。阿萨·缪西，三十二岁，已婚，本市大街，落海失踪。二月二十三日，双桅船《吉尔伯特·霍普号》。罗伯特·比文乘小艇失踪，二十九岁，已婚，新斯科舍普布尼科人。
        - id: ch03-b60
          speaker: narrator
          text: 可他的妻子就在大厅里。一声低低的哀号响起，像小动物挨了一击，随即又被压住。一个姑娘踉跄着走出去。几个月来，她一直抱着一点希望，因为小艇漂失的人偶尔真会被远洋帆船救起。如今，她终于得到了确切消息。哈维看见外面的警察替她叫来一辆马车。
        - id: ch03-b61
          speaker: cab_driver
          text: 到车站五十美分。
        - id: ch03-b62
          speaker: police_officer
          text: 我正好也去那里。上车吧。听着，艾尔，下回我的车灯没点，你别抓我。明白吗？
        - id: ch03-b63
          speaker: narrator
          text: 侧门关上，门外那一方亮光也不见了。哈维重新盯住宣读者和那份仿佛永远念不完的名单。
        - id: ch03-b64
          speaker: list_reader
          text: 四月十九日，双桅船《梅米·道格拉斯号》在大浅滩沉没，全体遇难。爱德华·坎顿，四十三岁，船长，已婚，本市人。D·霍金斯，又名威廉斯，三十四岁，已婚，新斯科舍谢尔本。G·W·克莱，有色人种，二十八岁，已婚，本市人。
        - id: ch03-b65
          speaker: narrator
          text: 名单就这样一项接一项地念下去，仿佛没有尽头。哈维喉咙里一团团东西不断往上涌，胃里也清清楚楚想起了自己从那艘客轮掉进大海的日子。
        - id: ch03-b66
          speaker: list_reader
          text: 五月十日，双桅船《我们在这儿号》。奥托·斯文德森，二十岁，未婚，本市人，落海失踪。
        - id: ch03-b67
          speaker: narrator
          text: 哈维浑身的血仿佛都刺痛了。大厅后方又传来一声低低的哭喊，听得人心都裂开。
        - id: ch03-b68
          speaker: long_jack
          text: 她不该来，真不该来。
          emotion: sad
        - id: ch03-b69
          speaker: dan
          text: 哈维，别往别人身上挤。
        - id: ch03-b70
          speaker: narrator
          text: 哈维只听见这一句，眼前便全黑了，黑暗里转着火一样的轮子。迪斯科探身对妻子低声说。她一只胳膊搂住切恩太太，另一只手按住那双戴满戒指、不断抓扯的手。
        - id: ch03-b71
          speaker: disko
          text: 把头低下去，再低一点。一会儿就过去了。
          emotion: calm
        - id: ch03-b72
          speaker: mrs_cheyne
          text: 我不能！我没有！啊，让我……
          emotion: fearful
        - id: ch03-b73
          speaker: mrs_troop
          text: 你得跟我来。你儿子昏过去了，一点知觉也没有。有些男孩长身体时会这样。你想不想照料他？我们可以从这边安静出去。来吧，亲爱的。我们都是女人，总得照看自家的男人。
          emotion: calm
        - id: ch03-b74
          speaker: narrator
          text: 《我们在这儿号》全班人立刻护着她们穿过人群。大家把哈维扶到前厅的长椅上，他脸色惨白，浑身发抖。切恩太太俯身看着儿子，特鲁普太太只说了一句。
        - id: ch03-b75
          speaker: mrs_troop
          text: 跟他妈妈一样。
        - id: ch03-b76
          speaker: mrs_cheyne
          text: 你们怎么会以为他受得住？太可怕了，我们根本不该来！这又错又残忍，根本不应该。为什么不能把这些事登在报纸上，让它们留在该待的地方？宝贝，你好一点了吗？
          emotion: angry
        - id: ch03-b77
          speaker: narrator
          text: 哈维听了，觉得自己理应羞愧。他带着断断续续的傻笑，挣扎着站起来。
        - id: ch03-b78
          speaker: harvey
          text: 我想我没事了。大概早饭吃了什么不对劲。
        - id: ch03-b79
          speaker: cheyne
          text: 也许是咖啡。我们不回去了。
        - id: ch03-b80
          speaker: narrator
          text: 切恩的脸绷出一道道硬线，像青铜凿成的一样。
        - id: ch03-b81
          speaker: disko
          text: 最好去码头。那儿紧挨着意大利人那边，吹吹新鲜空气，切恩太太会精神些。
        - id: ch03-b82
          speaker: narrator
          text: 哈维坚称自己这辈子从没感觉这么好。可直到沃弗曼码头上那条刚由装卸工收拾妥当的《我们在这儿号》出现在眼前，弥漫全身的怪感觉才退去，变成骄傲和悲伤混在一起。别的人，那些夏季住客之类，只会坐小帆船游玩，或站在栈桥尽头望海。哈维却是从里面懂得这一切。他懂得的事情太多，连自己都没法一件件想清楚。尽管如此，一想到这条小小的双桅船马上就要离开，他还是很想坐下来号啕大哭。
        - id: ch03-b83
          speaker: narrator
          text: 切恩太太一路哭个不停，还对特鲁普太太说了许多异乎寻常的话。特鲁普太太像哄孩子一样哄她，丹从六岁以后便没受过这种安慰，此刻听得大声吹起口哨。
        - id: ch03-b84
          speaker: narrator
          text: 就这样，老伙伴们跳进那条旧双桅船，落在一只只磕碰斑驳的小艇之间。哈维觉得自己也像个世上最古老的水手。他解开船尾拴在栈桥头的缆绳，众人用手撑着船，让它贴着码头慢慢滑出去。每个人都有太多话想说，结果谁也没说出什么要紧的。哈维叮嘱丹照看索尔特斯叔叔的海靴，还有宾恩的小艇锚。长杰克又反过来叮嘱哈维，千万别忘了自己学过的航海本领。
        - id: ch03-b85
          speaker: narrator
          text: 可两个女人都在场，玩笑听来全没滋味。绿色港水在朋友之间越铺越宽，谁也说不出真正好笑的话。风兜住船帆，迪斯科走到舵轮旁，高声下令。
        - id: ch03-b86
          speaker: disko
          text: 升前支索帆和前帆！回头见，哈维。说不定，我还真有点喜欢你和你家里人。
        - id: ch03-b87
          speaker: narrator
          text: 船滑到了听不见人声的地方。他们坐下来，望着它驶出港口。切恩太太还是哭个不停。
        - id: ch03-b88
          speaker: mrs_troop
          text: 嘘，亲爱的。我们都是女人。痛痛快快哭一场，也许会好受些。天上的上帝知道，哭对我从来没有半点用处。可他也知道，我确实有值得哭的事。
          emotion: sad
    - id: ch04
      title: 多年以后
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 几年后，在美洲大陆另一端，一个年轻人穿过湿冷的海雾，沿一条多风的街走来。街边全是造价昂贵的木屋，却偏偏仿成石头模样。他在一扇锻铁大门旁停下，另一个年轻人骑马过来，那匹马少说也值一千美元。
        - id: ch04-b02
          speaker: harvey
          text: 你好，丹！
        - id: ch04-b03
          speaker: dan
          text: 你好，哈维！
        - id: ch04-b04
          speaker: harvey
          text: 最近最得意的是什么？
        - id: ch04-b05
          speaker: dan
          text: 这一趟，我就要变成一种叫二副的畜生了。你那所开着三联发票的大学，还没快念完吗？
        - id: ch04-b06
          speaker: harvey
          text: 快了。利兰·斯坦福初级大学跟老《我们在这儿号》根本没法比。不过今年秋天，我就永远进航运这一行了。
        - id: ch04-b07
          speaker: dan
          text: 你是说咱们家的船？
        - id: ch04-b08
          speaker: harvey
          text: 不然还能是什么？等我把刀插进你们身上吧，丹。我一接手，准让那些老牌航线趴下痛哭。
        - id: ch04-b09
          speaker: dan
          text: 我情愿冒这个险。
        - id: ch04-b10
          speaker: narrator
          text: 丹亲热地咧嘴笑了。哈维下马，问他要不要进屋。
        - id: ch04-b11
          speaker: dan
          text: 我坐缆车来就是为了这个。不过医生在不在附近？总有一天，我非把那个疯黑人淹死不可。他翻来覆去只会开那一个该死的玩笑。
        - id: ch04-b12
          speaker: narrator
          text: 雾里传来低沉而得意的咯咯笑声。《我们在这儿号》从前的厨子走出来，接过马缰。凡是哈维需要的事，他都不让别人插手。
        - id: ch04-b13
          speaker: dan
          text: 医生，这雾跟大浅滩上一样浓，是不是？
        - id: ch04-b14
          speaker: narrator
          text: 这位皮肤黑得像煤、还能预见未来的凯尔特人没打算马上回答。他先拍了拍丹的肩，又第二十次把那句古老预言哑声念到丹耳边。
        - id: ch04-b15
          speaker: cook
          text: 主人变成人，成人做主人。丹·特鲁普，还记得我在《我们在这儿号》上说过什么吗？
        - id: ch04-b16
          speaker: dan
          text: 照现在看，我也不能硬说不像那么回事。那是条了不起的船。不管怎么说，我欠它许多，也欠爸爸许多。
        - id: ch04-b17
          speaker: harvey
          text: 我也是。
