  chapters:
    - id: ch01
      title: 厨子留下，切恩看城
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 《我们在这儿号》的厨子有自己的打算。他把全部家当包在手帕里，登上“康斯坦丝号”。工钱多少、睡在哪里，他统统不在乎。梦里的启示已经说得明白，他余生只该跟随哈维。大家先讲道理，又好言劝他，最后厨子和车厢服务员只好请切恩裁断。
        - id: ch01-b02
          speaker: narrator
          text: 切恩听完哈哈大笑。他想，哈维迟早也许需要一个贴身仆人。何况一个自愿做事的人，顶得上五个花钱雇来的。厨子即便自称麦克唐纳，还用盖尔语起誓，也由他留下。私人车厢先开回波士顿，到了那里，如果厨子还不改主意，就一起去西部。
        - id: ch01-b03
          speaker: narrator
          text: “康斯坦丝号”开走以后，切恩那套百万富翁的排场也没了。他本来就讨厌那节车厢。如今他一头扎进格洛斯特，打算把这座陌生城市摸透，正像他从前摸透斯诺霍米什到圣迭戈的每一座城。
        - id: ch01-b04
          speaker: narrator
          text: 弯弯曲曲的街道，一半是码头，一半是船具店。这里的人怎样赚钱？这门生意又怎样运转？人们说，新英格兰星期日早餐桌上，每五个鱼丸便有四个来自格洛斯特。为了证明这句话，他们把渔船、船具、码头、资本、腌制、包装、工厂、保险、工资、修理和利润的数字，全倒给切恩听。
        - id: ch01-b05
          speaker: narrator
          text: 他先找大船队的船主谈，又找少数拥有自己渔船的迪斯科谈，把两边的话都收进脑子里比较。他盘腿坐在旧船具铺的锚链上，带着永远也问不够的西部人好奇心，一个问题接一个问题。整个海滨都在猜，这人到底想干什么。
        - id: ch01-b06
          speaker: narrator
          text: 他还闯进互助保险会，非要人解释黑板上每天写的神秘批语。这一下，全城各家渔民寡妇孤儿救济会的秘书都来讨捐款，还争着超过别家的纪录。切恩揪揪胡子，把他们全交给切恩太太应付。
        - id: ch01-b07
          speaker: narrator
          text: 切恩太太在东角附近的寄宿公寓休养。那地方仿佛由住客自己当家，桌布是红白方格的，大家像认识了许多年，半夜饿了还会一起起来做烤奶酪。住下第二天，她在早餐前收起了那对独粒钻石首饰。
        - id: ch01-b08
          speaker: mrs_cheyne
          text: 这里的人真招人喜欢。待人亲切，又那么朴素，虽然差不多都是波士顿人。
        - id: ch01-b09
          speaker: cheyne
          text: 妈妈，那不是朴素。是另一种东西，一种我身上没有的东西。
        - id: ch01-b10
          speaker: mrs_cheyne
          text: 不会吧。这里的女人没一个穿得起一百美元的裙子。可我们……
        - id: ch01-b11
          speaker: cheyne
          text: 我知道，亲爱的，我们当然有。大概只是东部人的穿衣习惯。你在这里开心吗？
        - id: ch01-b12
          speaker: mrs_cheyne
          text: 我不大见得到哈维，他总跟着你。不过我已经不像以前那么担心了。
        - id: ch01-b13
          speaker: cheyne
          text: 自从威利死后，我从没这么快活过。我以前根本没明白，自己还有一个儿子。哈维会长成很了不起的小伙子。亲爱的，你要什么吗？头下要不要再垫个靠枕？好了，我们再去码头走走。
    - id: ch02
      title: 父子之间的交易
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那些日子，哈维简直成了父亲的影子。两人并肩走路，切恩总借口路面有坡，把手搭在儿子方正的肩膀上。哈维这才第一次看出父亲的本事。切恩只要跟街上的人聊几句，就能抓住一桩陌生事情的要害。
        - id: ch02-b02
          speaker: harvey
          text: 你什么底细都不告诉他们，怎么反倒能叫他们把什么都说出来？
        - id: ch02-b03
          speaker: cheyne
          text: 这些年我见过的人多了，大致能掂量出对方是什么人，对自己也有几分数。一个人有没有亲手干过活，别人通常看得出来。看出来了，他们就把他当自己人。
        - id: ch02-b04
          speaker: harvey
          text: 就像沃弗曼码头的人对我。现在我也是他们中间的一个。迪斯科告诉大家，那份工钱是我亲手挣的。可你瞧，我的手又全软了。
          emotion: sad
        - id: ch02-b05
          speaker: cheyne
          text: 往后几年读书，就先让它们软着。以后还磨得硬。
        - id: ch02-b06
          speaker: harvey
          text: 好吧，大概能。
        - id: ch02-b07
          speaker: cheyne
          text: 得由你自己选。你也可以躲到妈妈身后，让她为你的神经、天生敏感，还有那一套胡话大惊小怪。
        - id: ch02-b08
          speaker: harvey
          text: 我以前真这么做过？
        - id: ch02-b09
          speaker: narrator
          text: 哈维问得不安。切恩在码头边的座位上转过身，向他伸出一只长手。
        - id: ch02-b10
          speaker: cheyne
          text: 你我心里都明白。你不坦坦荡荡对我，我就没法把你教成人。只管你一个，我还有把握，只要你始终只代表自己。可要我同时对付你和妈妈，我可没这个本事。人生太短，怎么都不够用。
        - id: ch02-b11
          speaker: harvey
          text: 那么说，我还真不算个人物，是不是？
        - id: ch02-b12
          speaker: cheyne
          text: 这有很大一部分是我的错。不过既然你问实话，那么到今天为止，你确实还没成什么人物。对不对？
        - id: ch02-b13
          speaker: harvey
          text: 嗯。可迪斯科觉得……对了，从我出生到现在，养我一共花了多少钱？
        - id: ch02-b14
          speaker: cheyne
          text: 我没记账。真按美元美分估，大概更接近五万，不是四万，也可能有六万。养下一代真费钱。他们什么都要，拿到又厌，最后总是老头子付账。
        - id: ch02-b15
          speaker: narrator
          text: 哈维吹了一声口哨。想到自己竟值这么多养育费，他还有点得意。
        - id: ch02-b16
          speaker: harvey
          text: 那些钱全算沉没资本，对吧？
        - id: ch02-b17
          speaker: cheyne
          text: 是投资，哈维。但愿真是投资。
        - id: ch02-b18
          speaker: harvey
          text: 就算三万吧。我挣的三十块，等于每一百块只收回十美分。这一网捞得够差。
        - id: ch02-b19
          speaker: narrator
          text: 切恩笑得差点从木桩上栽进水里。
        - id: ch02-b20
          speaker: harvey
          text: 迪斯科从丹身上收回的多得多。丹十岁就开始干活，一年还有一半时间上学。
        - id: ch02-b21
          speaker: cheyne
          text: 哦，你绕了这么久，就是想说这个？
        - id: ch02-b22
          speaker: harvey
          text: 不是，我什么也不想求。我只是再也没法为自己得意了。我真该挨上一脚。
          emotion: sad
        - id: ch02-b23
          speaker: cheyne
          text: 我踢不下去，老伙计。我要是天生会做这种事，大概真会踢。
        - id: ch02-b24
          speaker: harvey
          text: 那我会记一辈子，也一辈子不原谅你。
        - id: ch02-b25
          speaker: cheyne
          text: 对。换成我，我也不会原谅。现在懂了吗？
        - id: ch02-b26
          speaker: harvey
          text: 懂了。错在我自己，不能怪别人。可无论如何，我总得想个办法。
        - id: ch02-b27
          speaker: narrator
          text: 切恩点起一支雪茄。父子俩长得十分相像。胡子遮住了父亲的嘴，可哈维有他微带鹰钩的鼻子、挨得很近的黑眼睛，还有窄而高的颧骨。脸上抹点棕色，他就能扮成故事书里的印第安人。
        - id: ch02-b28
          speaker: cheyne
          text: 从现在起，你每年可以花我六千到八千美元，直到你有选举权。那时就算你成人了。以后你还能每年花四五万，再加上妈妈给的钱。你可以带男仆、买游艇、弄一座漂亮牧场，装模作样养赛马，再陪那群朋友打牌。
        - id: ch02-b29
          speaker: harvey
          text: 像洛里·塔克那样？
        - id: ch02-b30
          speaker: cheyne
          text: 对，也可以像德维特家的两个孩子，或者老麦奎德的儿子。加利福尼亚到处是这种人。瞧，东部的样品也来了。
        - id: ch02-b31
          speaker: narrator
          text: 一条黑亮的蒸汽游艇喷着烟进了港。红木甲板室、镀镍罗盘柜、粉白条纹遮篷一样不少，桅上还飘着纽约一家俱乐部的燕尾旗。两个年轻人穿着自以为像样的海员服，在客厅天窗旁打牌。两个女人撑着红蓝阳伞，在旁边放声大笑。
        - id: ch02-b32
          speaker: harvey
          text: 只要起一点像样的风，我都不愿让人看见我在这种船上。它的船身太窄了。
        - id: ch02-b33
          speaker: cheyne
          text: 这就是他们说的快活日子。我能给你这种生活，再奢侈一倍也给得起。你觉得怎么样？
        - id: ch02-b34
          speaker: harvey
          text: 老天，他们哪能那样放小艇？我要是连滑车都使不好，干脆永远待在岸上。可我要是不选这条路呢？
        - id: ch02-b35
          speaker: cheyne
          text: 不选待在岸上？还是不选什么？
        - id: ch02-b36
          speaker: harvey
          text: 不选游艇和牧场，不靠老头子养活，遇上麻烦也不躲到妈妈身后。
        - id: ch02-b37
          speaker: cheyne
          text: 那么，我的儿子，你就进来跟我一起干。
        - id: ch02-b38
          speaker: harvey
          text: 一个月十美元？
        - id: ch02-b39
          speaker: cheyne
          text: 在你值更多以前，一美分也不会多。你还得过几年才能到那一步。
        - id: ch02-b40
          speaker: harvey
          text: 我宁可先进办公室扫地。那些大人物不都是这么起步的吗？至少现在就能挣一点，总比……
        - id: ch02-b41
          speaker: cheyne
          text: 我懂，人人都会这么想。不过扫地这种活，雇谁都能做。我也犯过同样的错，起步太早了。
        - id: ch02-b42
          speaker: harvey
          text: 一个价值三千万美元的错？能换来这些，我愿意冒险。
        - id: ch02-b43
          speaker: cheyne
          text: 我有得到的，也有失去的。现在讲给你听。
        - id: ch02-b44
          speaker: narrator
          text: 切恩揪着胡子，望着平静的水面，转开脸说起自己的一生。他的声音低沉平稳，没有手势，也没有表情。可是这四十年的经历，就是一部还没人写下的新西部历史。
        - id: ch02-b45
          speaker: narrator
          text: 故事从一个无亲无故、被丢在得克萨斯求生的男孩开始，又穿过上百次奇怪的转折。从一个西部州到另一个州，从一个月里拔地而起、一个季度后便枯萎的城市，到更荒凉的营地和更疯狂的冒险。后来，那些营地都成了忙着铺路的市镇。
        - id: ch02-b46
          speaker: narrator
          text: 三条铁路建成了，第四条却叫人故意毁掉。故事里还有轮船、乡镇、森林、矿山，还有从世界各地来开船、建城、伐木、采矿的人。巨富的机会曾摆在看不见它的人面前，也曾只差一点时间和路程，便从手边溜走。
        - id: ch02-b47
          speaker: narrator
          text: 在这场疯狂变化里，哈维·切恩骑过马，更多时候靠双脚走。他忽富忽穷，进进出出，来来回回。做过甲板水手、铁路工、承包商、寄宿公寓老板、记者、工程师、推销员、地产经纪、政客，也做过赖账鬼、酒贩子、矿主、投机商、牧牛人和流浪汉。他始终机敏又安静，只顾追逐自己的目标，还有他所说的国家荣耀与进步。
        - id: ch02-b48
          speaker: narrator
          text: 有一种信念从没丢下他。哪怕他悬在绝望的破边上，仍会牢牢抓住它。那信念来自他对人和事情的了解。他像在自言自语，说自己如何鼓起胆量、想出办法，如何击败仇敌，又如何宽恕他们，正如别人也曾击败或宽恕他。
        - id: ch02-b49
          speaker: narrator
          text: 他曾对城镇、公司和财团软求、巧哄、硬逼，说到底都是为了它们日后的好处。他绕过山岭峡谷，从中间钻过，也从底下爬过，身后拖着一条仿佛由细绳和铁箍拼成的铁路。最后他只安静坐着，任由一个个地方把他剩下的名声撕碎。
        - id: ch02-b50
          speaker: narrator
          text: 暮色越来越深，雪茄的红点照出切恩脸上的沟壑和浓眉。哈维侧着头盯住父亲，几乎忘了呼吸。听这故事，就像在黑暗里看一列火车呼啸着越过大地，每隔一英里，敞开的炉门才闪一下火光。只是这列火车会说话，每句话都直撞进男孩心里。
        - id: ch02-b51
          speaker: narrator
          text: 切恩终于扔掉烟蒂。父子俩坐在黑暗里，听水波在脚下轻轻拍响。
        - id: ch02-b52
          speaker: cheyne
          text: 这些话，我从来没对别人说过。
        - id: ch02-b53
          speaker: harvey
          text: 这是我听过最了不起的事！
          emotion: surprised
        - id: ch02-b54
          speaker: cheyne
          text: 这些都是我得到的。现在说说我没得到的。你也许觉得不算什么，可我不想让你到了我这个年纪才懂。我会用人，做自己的生意也不傻。可是，我比不了真正受过教育的人。我一路东拼西凑地学，大概浑身都露着这份底子。
        - id: ch02-b55
          speaker: harvey
          text: 我从来没看出来！
          emotion: angry
        - id: ch02-b56
          speaker: cheyne
          text: 你以后会看出来。大学念完，马上就能看见。别人把我当成他们说的粗坯时，是什么眼神，难道我不明白？我能把他们砸碎，却打不到他们真正疼的地方。我不是说他们高不可攀，可我总觉得自己差得太远。
        - id: ch02-b57
          speaker: cheyne
          text: 现在你有机会。四周能学的东西，都要尽量装进去。别人读书，也许只为以后一年挣几千美元。你读，是为了几百万。你得懂足够的法律，好在我死后照管产业；也得和市场上最优秀的人建立交情，将来他们都有用。
        - id: ch02-b58
          speaker: cheyne
          text: 最要紧的，是把最普通的书本学问装进脑子。那些人人坐下来、胳膊肘撑桌、托着下巴苦读的东西，最划算不过。在我们国家，不管经商还是从政，它只会一年比一年值钱。以后你就知道了。
        - id: ch02-b59
          speaker: harvey
          text: 这笔交易对我可一点甜头都没有。大学要念四年！早知道我就选男仆和游艇了。
        - id: ch02-b60
          speaker: cheyne
          text: 别急，孩子。你是在把本钱投到回报最丰厚的地方。等你准备接手，我们的产业大概一分钱也不会少。今晚好好想，明早告诉我。快走，晚饭要迟到了。
        - id: ch02-b61
          speaker: narrator
          text: 既然这是生意谈判，父子俩都觉得不必告诉切恩太太。可她看出了端倪，既害怕，又有一点嫉妒。那个从前骑在她头上撒野的孩子不见了，眼前是个面容精悍、异常沉默的少年，而且他大多只跟父亲说话。她知道这是生意，不归她管。后来切恩从波士顿带回一枚新买的侯爵形钻戒，她那点疑虑也散了。
        - id: ch02-b62
          speaker: mrs_cheyne
          text: 你们两个这次又做了什么？
        - id: ch02-b63
          speaker: cheyne
          text: 只是聊了聊，妈妈。哈维待人并不刻薄。
        - id: ch02-b64
          speaker: narrator
          text: 哈维确实不刻薄。他亲自谈下一份协议。他对铁路、木材、地产和矿业都没兴趣，只想掌管父亲新买的帆船航线。只要父亲答应在合理期限内交给他，他就保证在大学里认真自持四五年。每个假期，他还要查清航线的一切，从保险柜里最私密的文件，到旧金山港里的拖船，一样也不能瞒。
        - id: ch02-b65
          speaker: cheyne
          text: 成交。当然，大学还没读完，你会改二十回主意。不过你要是真能像样接手，又没在二十三岁以前把航线弄垮，我就把整盘生意转给你。怎么样？
        - id: ch02-b66
          speaker: harvey
          text: 不行。拆开一桩正在赚钱的买卖，从来不划算。世上的竞争已经够多了。迪斯科说，血亲就得抱成一团。他手下的人从不背弃他，所以他们总能捕到满舱鱼。对了，《我们在这儿号》星期一就去乔治浅滩。他们在岸上总待不久，对吧？
        - id: ch02-b67
          speaker: cheyne
          text: 那我们也该走了。我的生意散在两大洋之间，线头都悬着，该重新接起来。可我真舍不得。二十年来，我没度过这样的假。
        - id: ch02-b68
          speaker: harvey
          text: 总不能不送迪斯科开船。而且星期一是阵亡将士纪念日。无论如何，过完那天再走。
        - id: ch02-b69
          speaker: cheyne
          text: 寄宿公寓的人一直议论。这个纪念活动究竟是什么？
        - id: ch02-b70
          speaker: harvey
          text: 我听明白了，大概是给夏季住客拼出来的一场表演，有唱歌也有节目。迪斯科不大喜欢，因为还要替寡妇孤儿募捐。你没发现他这个人很独立吗？
        - id: ch02-b71
          speaker: cheyne
          text: 嗯，看出一点。有时候很明显。那么，是全城的庆典？
        - id: ch02-b72
          speaker: harvey
          text: 夏天这个算是。他们会念出上次以来淹死和失踪的人名，还有演讲、朗诵。迪斯科说，结束后各家救济会的秘书会跑到后院抢捐款。真正的纪念活动在春天，那时所有牧师都来，城里也没有夏季住客。
        - id: ch02-b73
          speaker: cheyne
          text: 我懂了。我们留下过纪念日，下午再走。
        - id: ch02-b74
          speaker: harvey
          text: 我马上去找迪斯科，让他开船前把全班人带来。我当然得跟他们站在一起。
        - id: ch02-b75
          speaker: cheyne
          text: 原来如此。我只是个可怜的夏季住客，你却是……
        - id: ch02-b76
          speaker: harvey
          text: 大浅滩渔夫！血统纯正的大浅滩渔夫！
          emotion: happy
    - id: ch03
      title: 纪念日的大厅
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 迪斯科一向讨厌公开求人施舍的仪式，可哈维求他说，《我们在这儿号》的人不来，这一天便毫无光彩。迪斯科答应了，却先提了一个条件。海滨都听说费城来了一位女演员，他怀疑她要朗诵《艾尔森船长之行》。迪斯科不喜欢戏子，也不喜欢夏季住客，可这件事不能弄错。
        - id: ch03-b02
          speaker: narrator
          text: 哈维回到东格洛斯特，花了半天向那位名震两岸的女演员解释。她听得忍不住笑，最后也承认，迪斯科说得对，公道应该伸张。
        - id: ch03-b03
          speaker: narrator
          text: 切恩凭经验知道会有怎样的场面。他最喜欢公开议论的大集会。那个闷热朦胧的早晨，一辆辆有轨电车载着穿夏装的女人，还有刚离开波士顿写字台、脸色苍白、头戴草帽的男人，急急向西驶去。邮局外堆着自行车，官员忙着互相招呼，彩旗在沉重的空气里慢慢起落，还有一位要人正用水管冲洗砖路。
        - id: ch03-b04
          speaker: cheyne
          text: 妈妈，西雅图烧毁以后，大家重新把城办起来的样子，你还记得吗？
        - id: ch03-b05
          speaker: narrator
          text: 切恩太太点点头，挑剔地看着弯曲的街道。她和丈夫一样熟悉西部的集会，也在拿眼前这一场和过去见过的逐一比较。
        - id: ch03-b06
          speaker: narrator
          text: 渔民涌到市政厅前。有葡萄牙人和他们不戴帽子或披着头巾的女人，有新斯科舍和海洋诸省的人，也有法国人、意大利人、瑞典人、丹麦人和沿海船上的外来水手。穿黑衣的女人怀着阴郁的骄傲彼此问候，因为这一天对她们最要紧。
        - id: ch03-b07
          speaker: narrator
          text: 各教派的牧师、大小船主、银行家、海险经纪、拖船和供水船船长、帆缆工、装配工、码头工、腌鱼工、造船匠和桶匠都来了。夏季住客的衣裙把一排排座椅染得鲜亮。
        - id: ch03-b08
          speaker: civic_official
          text: 切恩先生，您觉得我们这座城怎么样？太太，您想坐哪里都行。你们西部想必也办这种活动吧？
        - id: ch03-b09
          speaker: cheyne
          text: 办，不过我们的历史没有你们这么久。
        - id: ch03-b10
          speaker: civic_official
          text: 那当然。我们庆祝建城二百五十周年时，您真该来看看。那一回，这座老城可给自己长足了脸。
        - id: ch03-b11
          speaker: cheyne
          text: 我听说过。这种事也能带来收益。不过这座城怎么连一家头等旅馆都没有？
        - id: ch03-b12
          speaker: civic_official
          text: 佩德罗，你们坐左边，那里空位多。切恩先生，旅馆这件事我一直在说，里面有大钱可赚。不过您大概看不上这点钱。我们需要的是……
        - id: ch03-b13
          speaker: narrator
          text: 一只沉重的大手落在官员的细呢肩头。替波特兰运煤运冰的卡森船长满脸通红，把他扳过半个身子。
        - id: ch03-b14
          speaker: carson
          text: 你们到底怎么想的？正经男人都出海时，偏给全城套上禁酒法！我离开以后，这城干得像根骨头，气味却更坏了。至少也该留一家酒馆，让人进去喝汽水吧？
        - id: ch03-b15
          speaker: civic_official
          text: 看来你今早没耽误滋养自己，卡森。政治问题以后再谈。先坐到门边，好好想想你的论据，等我回来。
        - id: ch03-b16
          speaker: carson
          text: 我要论据做什么？密克隆的香槟才十八美元一箱，而且……
        - id: ch03-b17
          speaker: narrator
          text: 管风琴奏起前奏，卡森闭了嘴，一歪身坐下来。
        - id: ch03-b18
          speaker: civic_official
          text: 这是我们的新管风琴，花了四千美元。为了付账，明年只好恢复高额酒牌费。牧师们开会，可不能让他们把宗教全占了。现在唱歌的是救济会的孤儿，我太太教的。回头见，台上有人找我。
        - id: ch03-b19
          speakers: [children_1, children_2, children_3]
          ensemble: chorus
          text: 主的一切造物啊，请祝福主。赞美他，永永远远尊他为大！
        - id: ch03-b20
          speaker: narrator
          text: 孩子们高亢、清澈而准确的歌声压住了最后一点嘈杂。歌声在大厅里回荡，女人们探身张望。切恩太太这才发现，世上的寡妇竟有这么多。她赶紧寻找哈维。哈维已经到了听众席后方，站在丹和迪斯科中间。索尔特斯叔叔前一晚才和宾恩回来，此刻满脸怀疑地盯着他。
        - id: ch03-b21
          speaker: salters
          text: 你家里人还没走？那你穿成这样站在这里做什么？
        - id: ch03-b22
          speakers: [children_1, children_2, children_3]
          ensemble: chorus
          text: 海洋与洪水啊，请祝福主。赞美他，永永远远尊他为大！
        - id: ch03-b23
          speaker: dan
          text: 他怎么没资格？他去过那里，跟我们大家一样。
        - id: ch03-b24
          speaker: salters
          text: 穿这身衣服就没资格。
        - id: ch03-b25
          speaker: disko
          text: 闭嘴，索尔特斯，你的坏脾气又犯了。哈维，就站在那里别动。
        - id: ch03-b26
          speaker: narrator
          text: 当天的演说家接着欢迎全世界，还说了格洛斯特胜过别处的种种地方。他讲到这座城从海上取得财富，每年也为这财富付出代价。今年稍后要念出的死难者共有一百一十七人，寡妇们听见这个数字，轻轻一颤，彼此望了一眼。
        - id: ch03-b27
          speaker: narrator
          text: 格洛斯特没有巨大的磨坊和工厂可以夸耀。她的儿子靠大海肯给的报酬生活，而乔治浅滩和大浅滩从来不是安稳的牧场。岸上的人能做的，不过是帮助寡妇和孤儿。演说家又说了几句套话，代表全城感谢参加庆典的热心人士。
        - id: ch03-b28
          speaker: disko
          text: 我讨厌的就是那种求人施舍的话。听了会叫人看错我们。
        - id: ch03-b29
          speaker: salters
          text: 人有机会时不早做打算、不积蓄，以后穷了就该害臊。小子，你得记住。财富只能留一阵子，要是拿去乱花，净买那些奢……
        - id: ch03-b30
          speaker: penn
          text: 可要是一切都失去了呢？从前有一回……我在一本书里读过，一条船上的人全沉了，只剩一个人。那个人对我说……
        - id: ch03-b31
          speaker: salters
          text: 胡说！宾恩，你少看点书，多管好自己的饭食，也许还能多挣一点，抵掉你的吃用。
        - id: ch03-b32
          speaker: narrator
          text: 哈维挤在渔民中间，一阵阴冷发麻的颤栗从后颈一直爬到靴子。天气闷热得让人喘不过气，他却冷了起来。
        - id: ch03-b33
          speaker: disko
          text: 台上那个就是费城来的女戏子？老艾尔森的事情，你已经替她纠正了吧？现在你该明白为什么了。
        - id: ch03-b34
          speaker: narrator
          text: 女演员没有念《艾尔森船长之行》，而是朗诵一首写布里克瑟姆渔港的诗。一个风暴之夜，拖网船队逆风抢港，女人们把能找到的东西全搬来，在码头尽头点起指路的火。
        - id: ch03-b35
          speaker: actress
          text: 她们拿来祖母的毯子。祖母冻得发抖，却催她们快去。她们又拿来婴儿的摇篮，婴儿还不会开口说不许。
        - id: ch03-b36
          speaker: dan
          text: 嚯，真带劲！不过这堆火准烧掉不少钱。
        - id: ch03-b37
          speaker: long_jack
          text: 丹尼，这是土拨鼠走投无路才用的拼命办法。那个港口的灯塔太差了。
        - id: ch03-b38
          speaker: actress
          text: 她们始终不知道，点亮的究竟是救命的篝火，还是送葬的柴堆。
        - id: ch03-b39
          speaker: narrator
          text: 那奇妙的嗓音抓住了每个人。她讲到湿透的水手被抛上岸，有的活着，有的已经死去。人们把尸体抬到火边，一个个询问，这是你的父亲吗？这是你的丈夫吗？长椅之间只剩沉重的呼吸。
        - id: ch03-b40
          speaker: actress
          text: 每当布里克瑟姆的船出港迎战风浪，请记住，有一份爱会跟它远行，像光一样落在片片船帆上。
        - id: ch03-b41
          speaker: narrator
          text: 朗诵结束，掌声很少。女人们都在找手帕，许多男人眼里闪着水光，只管抬头盯着天花板。
        - id: ch03-b42
          speaker: salters
          text: 这一段放在戏院里，得卖一美元，也许两美元。有些人当然付得起。可我看，白白送出去太糟蹋了。话说回来，巴特·爱德华兹船长怎么也漂到这里来了？
        - id: ch03-b43
          speaker: eastport_man
          text: 没人压得住他。他是诗人，非念自己的作品不可。再说，他也算我们那一带的人。
        - id: ch03-b44
          speaker: narrator
          text: 巴特·爱德华兹船长已经连续五年争取上台。一群又好笑又疲惫的委员终于答应了。老人穿着最好的星期日礼服站起来，朴实又幸福，还没开口便赢得听众。他用三十七节斧凿一样生硬的诗，把《琼·哈斯肯号》在一八六七年沉没于乔治浅滩外的经过，事无巨细全念了一遍。大家安静听到最后，又善意地齐声喝彩。
        - id: ch03-b45
          speaker: narrator
          text: 一位有眼光的波士顿记者悄悄出去，要拿到全诗，再采访作者。对于七十三岁、做过捕鲸人、造船匠、渔船船长和诗人的爱德华兹来说，人世间再没有更好的礼物了。
        - id: ch03-b46
          speaker: eastport_man
          text: 这才讲道理。我去过那片海，还拿着他的文章，完全照他刚才念的读过。我能作证，他什么都写进去了。
        - id: ch03-b47
          speaker: salters
          text: 丹要是不能在早餐前用一只手写得更好，就该挨鞭子。不过我承认，按缅因州的标准，那老头还真有点文才。可是……
        - id: ch03-b48
          speaker: dan
          text: 索尔特斯叔叔这回怕是要死了，他一辈子头一回夸我。哈维，你怎么一句话也不说？脸都绿了，不舒服吗？
        - id: ch03-b49
          speaker: harvey
          text: 我不知道。好像身体里面太大，外面装不下，塞得满满的，还一直发抖。
        - id: ch03-b50
          speaker: dan
          text: 消化不良？那可糟了。等名单念完，我们就走，正好赶上潮水。
