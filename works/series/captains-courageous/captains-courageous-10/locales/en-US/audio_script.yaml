        speaker: narrator
        text: Her wonderful voice took hold of the listeners by their heartstrings. She told how the soaked crews were thrown ashore from the storm, some living and some dead. People lifted the bodies and carried them into the glare of the great fires. One by one, they asked a child whether the dead man was her father. They asked a woman whether the body was her husband. Across all the benches, the only sound was hard breathing.
