      - id: ch01-b105
        speaker: narrator
        text: Women throughout the hall leaned forward while the repeated music filled the air. Mrs. Cheyne began to breathe quickly. She had never imagined that the world held so many widows, and she searched for Harvey. He stood at the back with the We're Here crew, exactly where he felt he belonged, between Dan and Disko. Salters, just returned from Pamlico Sound with Penn, eyed him suspiciously.
