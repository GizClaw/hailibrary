      - id: ch01-b143
        speaker: narrator
        text: Robert Beavon's wife was sitting in the hall. A low cry came from her, like the sound of a small animal being struck. She smothered it at once, then rose and staggered outside. For months she had gone on hoping against hope. Men who drifted away in dories had sometimes been picked up, almost by miracle, by deep-sea sailing ships. As long as there was no certain word, she could imagine that it had happened to Robert. The public reading ended that hope. Now she knew. Through the open side door, Harvey saw a policeman on the sidewalk calling a carriage for her.
