  chapters:
    - id: ch01
      title: CHAPTER X
      blocks:
      - id: ch01-b01
        speaker: narrator
        text: The We're Here's silent cook had plans of his own. He tied his belongings in a handkerchief, climbed aboard the Constance, and refused to leave. Pay meant nothing to him, and neither did a bed. His dreams had told him to follow Harvey for the rest of his life.
      - id: ch01-b02
        speaker: narrator
        text: The porter and the cook argued, then tried persuasion, and finally took the matter to Mr. Cheyne. Cheyne only laughed. Harvey might need a personal servant someday, he said, and one volunteer was worth five hired men. So the cook could stay, even if he called himself MacDonald and swore in Gaelic. If he still felt the same when the car returned to Boston, they would take him West.
      - id: ch01-b03
        speaker: narrator
        text: Once the Constance left, the last sign of Cheyne's wealth left with it. Cheyne had secretly hated the private car and was glad to see it go. Now he gave himself to a busy kind of idleness. Gloucester was a new town in a new land, and he meant to take it all in. Years before, he had done the same in every city from Snohomish to San Diego, throughout the Western world he knew so well.
      - id: ch01-b04
        speaker: narrator
        text: Along the crooked street, half wharf and half ship's store, people made money from fish. Cheyne wanted to know exactly how. They told him that Gloucester supplied four of every five fish balls eaten at New England Sunday breakfasts. Then came numbers about boats, gear, waterfront, invested money, salting, packing, factories, insurance, wages, repairs, and profit.
      - id: ch01-b05
        speaker: narrator
        text: He questioned fleet owners whose skippers were little more than employees and whose crews were mostly Swedish or Portuguese. Then he compared their answers with Disko's, because Disko still owned his own vessel. Cheyne sat curled on chain cables in marine junk shops, asking cheerful questions until the whole waterfront wondered what on earth he was after.
      - id: ch01-b06
        speaker: narrator
        text: At the Mutual Insurance rooms, he demanded explanations for every mysterious note chalked on the blackboard from day to day. His curiosity brought down the secretaries of every Fisherman's Widow and Orphan Aid Society in the city. They begged without shame, each anxious to beat the record of every other society. Cheyne listened, tugged at his beard, and turned the whole eager company over to Mrs. Cheyne.
      - id: ch01-b07
        speaker: narrator
        text: She was resting near Eastern Point in an odd boardinghouse that seemed to be run by its guests instead of its owner. The tablecloths were red and white checks. Everyone acted as if they had known everyone else closely for years. If the whole household grew hungry at midnight, they simply got up together and made Welsh rarebit. Hammocks hung among the apple trees beyond the boulders. On her second morning there, Mrs. Cheyne quietly put away her diamond earrings before breakfast.
      - id: ch01-b08
        speaker: mrs_cheyne
        text: These people are delightful. They're so friendly and simple, even though nearly all of them are from Boston.
      - id: ch01-b09
        speaker: cheyne
        text: That isn't simplicity, Mama. It's something else. Something I don't have.
      - id: ch01-b10
        speaker: mrs_cheyne
        text: It can't be. Not one woman here owns a dress worth a hundred dollars. Why, we—
      - id: ch01-b11
        speaker: cheyne
        text: I know, dear. We do. Maybe that's just how they do things in the East. Are you enjoying yourself?
      - id: ch01-b12
        speaker: mrs_cheyne
        text: I hardly see Harvey because he's always with you. But I'm not nearly as nervous as I was.
      - id: ch01-b13
        speaker: cheyne
        text: I haven't enjoyed myself this much since Willie died. I never truly understood that I had a son until now. Harve is going to be a fine boy. Can I bring you anything, dear? Do you want a cushion? All right, Harve and I will go look around the wharf again.
      - id: ch01-b14
        speaker: narrator
        text: During those days Harvey became his father's shadow. They wandered side by side through Gloucester, and whenever the road rose or fell, Cheyne used the slope as an excuse to steady himself with a hand on Harvey's square shoulder. For the first time, Harvey watched his father with real admiration. Cheyne could walk out of a rigger's loft or stop a man in the street, ask a few questions, and somehow reach the very heart of a business he had never seen before.
      - id: ch01-b15
        speaker: harvey
        text: How do you get them to tell you everything when you hardly say a thing?
      - id: ch01-b16
        speaker: cheyne
        text: I've dealt with plenty of men, Harve. After a while, you learn to size them up. It helps to know yourself too. Men can usually tell when you've handled things with your own hands. Then they treat you like one of them.
      - id: ch01-b17
        speaker: harvey
        text: That's how they treat me at Wouverman's wharf. I'm one of them now. Disko told everybody I earned my pay. But look. My palms are soft again.
      - id: ch01-b18
        speaker: cheyne
        text: Keep them soft while you get your education. You can harden them afterward.
      - id: ch01-b19
        speaker: harvey
        text: Yes, I suppose so.
      - id: ch01-b20
        speaker: cheyne
        text: The choice is yours. You can always hide behind your mother and have her fuss over your nerves and your delicate nature and all that nonsense.
      - id: ch01-b21
        speaker: harvey
        text: Have I ever done that?
      - id: ch01-b22
        speaker: narrator
        text: Cheyne turned on the edge of the wharf and held out his long hand.
      - id: ch01-b23
        speaker: cheyne
        text: You know I can't make anything of you unless you deal honestly with me. I can manage you by yourself if you stay by yourself. I won't pretend I can manage you and Mama together. Life is too short.
      - id: ch01-b24
        speaker: harvey
        text: That doesn't make me sound like much of a fellow.
      - id: ch01-b25
        speaker: cheyne
        text: Much of it was my fault. But if you want the truth, you haven't amounted to much so far. Have you?
      - id: ch01-b26
        speaker: harvey
        text: Hmm. Disko thinks... Say, what has it cost you to raise me? Everything from the beginning until now?
      - id: ch01-b27
        speaker: cheyne
        text: I never kept count. In dollars, I'd put it nearer fifty thousand than forty. Maybe sixty. Young people cost plenty. They need things, grow tired of them, and let the old man pay.
      - id: ch01-b28
        speaker: narrator
        text: Harvey whistled. Deep down, he was pleased that his upbringing had cost so much.
      - id: ch01-b29
        speaker: harvey
        text: And all that money is sunk capital, isn't it?
      - id: ch01-b30
        speaker: cheyne
        text: Invested, Harve. At least, I hope it is.
      - id: ch01-b31
        speaker: harvey
        text: Call it thirty thousand, then. The thirty dollars I earned comes to about ten cents on every hundred. That's a mighty poor catch.
      - id: ch01-b32
        speaker: narrator
        text: Cheyne laughed so hard he nearly fell from the piling into the water.
      - id: ch01-b33
        speaker: harvey
        text: Disko has gotten a lot more than that from Dan since Dan was ten. And Dan spends half the year at school.
      - id: ch01-b34
        speaker: cheyne
        text: Ah. So that's where you're heading.
      - id: ch01-b35
        speaker: harvey
        text: I'm not heading anywhere. I just don't think much of myself right now. I deserve a kicking.
      - id: ch01-b36
        speaker: cheyne
        text: I can't give you one, old man. If I were built that way, I suppose I would.
      - id: ch01-b37
        speaker: harvey
        text: Then I'd remember it until my last day and never forgive you.
      - id: ch01-b38
        speaker: cheyne
        text: Exactly. I'd do the same. Do you understand?
      - id: ch01-b39
        speaker: harvey
        text: I do. The fault is mine, nobody else's. Still, I have to do something about it.
      - id: ch01-b40
        speaker: narrator
        text: Cheyne lit a cigar. Father and son looked very much alike. Cheyne's beard hid his mouth, but both had the same slightly curved nose, close black eyes, and narrow high cheekbones.
      - id: ch01-b41
        speaker: cheyne
        text: You can keep costing me six or eight thousand a year until you're old enough to vote. Then we'll call you a man. After that, you can live on me for forty or fifty thousand a year, besides whatever your mother gives you. You can have a valet, a yacht, or a show ranch where you pretend to breed trotters and play cards with your friends.
      - id: ch01-b42
        speaker: harvey
        text: Like Lorry Tuck?
      - id: ch01-b43
        speaker: cheyne
        text: Yes. Or the De Vitre boys, or old McQuade's son. California is full of them. And here comes an Eastern example now.
      - id: ch01-b44
        speaker: narrator
        text: A glossy black steam yacht came puffing up the harbor. It had a mahogany deckhouse, shining metal fittings, striped pink-and-white awnings, and the flag of a New York club. Two young men in what they imagined were sailor clothes played cards by the skylight. Two women under red and blue parasols watched and laughed loudly.
      - id: ch01-b45
        speaker: harvey
        text: I wouldn't want to be aboard her in a real breeze. She hasn't enough beam.
      - id: ch01-b46
        speaker: cheyne
        text: That's their idea of a good time. I can give you twice as much of it, Harve. Would you like that?
      - id: ch01-b47
        speaker: harvey
        text: Caesar! Look how they're lowering that dinghy. If I handled a tackle that badly, I'd stay ashore. What if I don't want it?
      - id: ch01-b48
        speaker: cheyne
        text: Don't want to stay ashore, or don't want what?
      - id: ch01-b49
        speaker: harvey
        text: The yacht, the ranch, living on the old man, and hiding behind Mama when trouble comes.
      - id: ch01-b50
        speaker: cheyne
        text: Then you come into business with me, my son.
      - id: ch01-b51
        speaker: harvey
        text: At ten dollars a month?
      - id: ch01-b52
        speaker: cheyne
        text: Not one cent more until you're worth it. You won't be worth that much for several years.
      - id: ch01-b53
        speaker: harvey
        text: I'd rather start by sweeping the office and earn something now. Isn't that how the important men begin?
      - id: ch01-b54
        speaker: cheyne
        text: Everybody feels that way. But we can hire all the sweeping we need. I made the mistake of starting too early myself.
      - id: ch01-b55
        speaker: harvey
        text: A mistake worth thirty million dollars? I'd take that chance.
      - id: ch01-b56
        speaker: cheyne
        text: I lost some things and gained others. Let me tell you.
      - id: ch01-b57
        speaker: narrator
        text: Cheyne pulled at his beard and smiled across the still water. He spoke away from Harvey in a low, even voice, without gestures and with almost no expression. Harvey slowly realized that his father was telling him the story of his life. A dozen leading newspapers would gladly have paid a fortune for that history of forty years. Cheyne's private story was also the story of the new West, a story that no one had fully written yet.
      - id: ch01-b58
        speaker: narrator
        text: It began with a boy who had no family, turned loose to survive in Texas. From there it rushed through a hundred turns and changes. The scene shifted from one Western state to the next. Cities sprang up in a month, then withered completely in a single season. Wild camps where men had taken wild chances became busy cities with paved streets. Cheyne helped build three railroads and deliberately wrecked a fourth. His story crossed steamships, townships, forests, and mines. Men from every nation built, cut, dug, and worked through it all.
      - id: ch01-b59
        speaker: narrator
        text: Chances at enormous fortunes appeared before men who could not see them. Other fortunes were missed because of nothing more than the time a man arrived or the road he happened to take. Through all that mad movement, Cheyne sometimes traveled on horseback and more often on foot. He was rich, then poor, in one scheme, out of another, and always moving back and forth. He worked as a deckhand, train hand, contractor, boardinghouse keeper, newspaperman, engineer, traveling salesman, land agent, politician, loafer, liquor seller, mine owner, speculator, cattleman, and tramp. Through every job he stayed alert and quiet, seeking his own ends and, as he insisted, the glory and advancement of his country.
      - id: ch01-b60
        speaker: narrator
        text: His faith had never left him, even when he hung over the ragged edge of despair. It came from knowing people and knowing how things worked. Speaking as though only to himself, he described his own great courage and quick resource in every danger. Those qualities seemed so obvious to him that his voice never changed. He told how he defeated enemies and sometimes forgave them, just as they had defeated or forgiven him in the careless old days. He had pleaded with towns, charmed companies, and bullied whole groups of businessmen, always claiming it was for their lasting good. He crawled around mountains, through them, or under them, dragging a thin railroad of string and iron after him. In the end, he sat still while one community after another tore the last scraps of his character and reputation to pieces.
      - id: ch01-b61
        speaker: narrator
        text: Harvey listened almost without breathing. His head tilted a little, and his eyes never left his father's face. Twilight deepened around them. Each glow from the end of Cheyne's cigar lit the furrows in his cheeks and the heavy line of his eyebrows. To Harvey, it was like watching a locomotive storm across the country at night, with a mile of darkness between every glare from the open firebox. But this locomotive could speak, and its words shook and stirred him to the center of his soul. At last Cheyne tossed away the cigar end. Father and son sat together in darkness above the soft slap of water.
      - id: ch01-b62
        speaker: cheyne
        text: I've never told anyone that before.
      - id: ch01-b63
        speaker: harvey
        text: It's the greatest thing I've ever heard!
        emotion: surprised
      - id: ch01-b64
        speaker: cheyne
        text: That's what I gained. Now listen to what I missed. It may not sound important to you, but I don't want you to reach my age before you learn it. I know how to handle men, and I'm no fool in my own work. But I can't compete with a man who's been properly taught. I picked things up as I went, and people can see it.
      - id: ch01-b65
        speaker: harvey
        text: I have never seen it.
      - id: ch01-b66
        speaker: cheyne
        text: You will after college. I know the look men give me when they think I'm common and ignorant. I can crush them in business, but I can't strike them where their opinion lives. They may not be so far above me, but I still feel far below them somehow.
      - id: ch01-b67
        speaker: cheyne
        text: You have your chance now. Take in every bit of learning around you. You'll live among young men who are studying too. Most of them will be doing it so they can earn a few thousand dollars a year at best, while you'll be studying for the sake of millions. Learn enough law to protect your own property when I'm no longer here to do it. Make yourself solid with the best men in the market, because those men will be useful later. Above all, store away the plain, ordinary learning that comes from sitting down with your chin on your elbows and reading books. Nothing pays better, Harve. In this country, education will pay more with every passing year, both in business and in politics. You'll live to see that for yourself.
      - id: ch01-b68
        speaker: harvey
        text: I don't get the sweet end of this bargain. Four years of college! I wish I'd chosen the valet and yacht.
      - id: ch01-b69
        speaker: cheyne
        text: Never mind, son. You're putting your capital where it will earn the best return. Our property won't have shrunk when you're ready to take hold. Think it over and answer me tomorrow. Come on. We'll be late for supper.
      - id: ch01-b70
        speaker: narrator
        text: Since it was a business discussion, neither Harvey nor his father thought they needed to tell Mrs. Cheyne anything about it. But she saw the change between them. It frightened her and made her a little jealous. The boy who had once ridden roughly over every wish of hers was gone. In his place stood a sharp-faced young man who was strangely silent and directed most of what he said to his father. She understood that the matter was business, and business stood beyond the borders of her own world. Any doubts she still had disappeared when Cheyne went to Boston and returned carrying a new diamond marquise ring for her.
      - id: ch01-b71
        speaker: mrs_cheyne
        text: What have you two been doing now?
      - id: ch01-b72
        speaker: cheyne
        text: Only talking, Mama. Harvey isn't planning anything mean.
      - id: ch01-b73
        speaker: narrator
        text: He was not. Harvey had worked out a treaty on his own account and presented it very seriously. Railroads interested him no more than lumber, land, or mining. What his heart truly wanted was command of his father's newly bought sailing ship. If Cheyne would promise him that command within what Harvey considered a reasonable time, Harvey guaranteed four or five years of hard, sober work at college. During every vacation, he must be allowed to study all the details of the shipping line. He wanted everything, from his father's most private papers locked in the safe to the tug working in San Francisco harbor. He had already asked nearly two thousand questions about it.
      - id: ch01-b74
        speaker: cheyne
        text: It's a bargain. You'll change your mind twenty times before college ends. But if you take hold properly and don't ruin the line before you're twenty-three, I'll turn it over to you. How does that sound?
      - id: ch01-b75
        speaker: harvey
        text: No. It never pays to split up a working business. There's too much competition already. Disko says blood relatives have to hold together. His crew never lets him down, and that's why they bring home such big catches. Say, the We're Here sails for Georges on Monday. They don't stay ashore long, do they?
      - id: ch01-b76
        speaker: cheyne
        text: We should be leaving too. My business is hanging loose between two oceans, and I need to join the ends again. I hate to go. I haven't had a holiday like this in twenty years.
      - id: ch01-b77
        speaker: harvey
        text: We can't leave without seeing Disko sail. Monday is Memorial Day too. Let's stay for that.
      - id: ch01-b78
        speaker: cheyne
        text: What is this memorial affair? People at the boardinghouse mentioned it.
      - id: ch01-b79
        speaker: harvey
        text: As far as I can tell, it's a summer show for visitors. Disko dislikes it because they collect money for widows and orphans. He's independent. Haven't you noticed?
      - id: ch01-b80
        speaker: cheyne
        text: A little, here and there. Is it a town performance?
      - id: ch01-b81
        speaker: harvey
        text: This is the summer meeting. They read the names of men drowned or missing since the last one. Then come speeches and recitations. Disko says the Aid Society secretaries fight over the money afterward. The real memorial is in spring, when the ministers take part and no summer visitors are around.
      - id: ch01-b82
        speaker: cheyne
        text: I understand. We'll stay through Memorial Day and leave that afternoon.
      - id: ch01-b83
        speaker: harvey
        text: I'll go make Disko bring his crew. I have to stand with them, of course.
      - id: ch01-b84
        speaker: cheyne
        text: Oh, I see. I'm only a poor summer visitor, while you are—
      - id: ch01-b85
        speaker: harvey
        text: A Banker! A full-blooded Banker!
        emotion: happy
      - id: ch01-b86
        speaker: narrator
        text: Harvey called it back as he boarded a trolley. Cheyne went on dreaming happily about his son's future.
      - id: ch01-b87
        speaker: narrator
        text: Disko had no use for public occasions where people stood up and asked for charity. Harvey pleaded that, for him, the whole glory of the day would be lost if the We're Here crew stayed away. At last Disko agreed, but only on one condition. News traveled astonishingly fast along the waterfront, and he had heard that an actress from Philadelphia would take part. He suspected she meant to recite Skipper Ireson's Ride. Disko trusted actresses no more than summer visitors. Still, justice was justice. Dan giggled when Disko admitted that he himself had once made an error of judgment about Ireson, but that only made Disko more determined. Harvey returned to East Gloucester and spent half a day explaining the mistake to an amused actress famous on both coasts. She agreed that Disko was right.
      - id: ch01-b88
        speaker: narrator
        text: From long experience, Cheyne knew exactly what kind of day was coming. Any public speechmaking was food and drink to his soul. On the hot, hazy morning, he watched trolleys hurry west. They carried women in light summer dresses and pale men in straw hats, fresh from their Boston desks. Bicycles were stacked outside the post office. Busy officials came and went, stopping to greet one another. Flags moved with a slow flick and swash in the heavy air. One very important man stood watering the brick sidewalk with a hose.
      - id: ch01-b89
        speaker: cheyne
        text: Mother, do you remember when Seattle burned and they built her up again?
      - id: ch01-b90
        speaker: narrator
        text: Mrs. Cheyne nodded and studied the crooked street with a critical eye. Like her husband, she had seen gatherings like this all across the West and was already comparing one with another. Around the town hall doors, fishermen began to mix with the crowd. There were dark-cheeked Portuguese men, with their women bareheaded or wrapped in shawls. Clear-eyed Nova Scotians stood among men from the other Maritime Provinces. Frenchmen, Italians, Swedes, and Danes came with crews from coastal schooners. Everywhere stood women in black. They greeted one another with grim pride, because of all the days in the year, this one belonged to them.
      - id: ch01-b91
        speaker: narrator
        text: Ministers of many churches joined them. Some served rich congregations and had come to the coast for a rest. Others did the ordinary hard work of the town. There were priests from the Church on the Hill and bearded Lutheran preachers who had once been sailors and knew the crews of twenty boats by name. Owners of great schooner fleets stood beside small operators whose few boats were mortgaged to the mastheads. Bankers and marine insurance agents mingled with captains of tugs and water boats. Riggers, fitters, fish handlers, salters, boatbuilders, and barrel makers filled out the whole mixed world of the waterfront. They passed the rows of seats, bright with summer visitors' dresses. A town official hurried everywhere, patrolling and perspiring until he shone with pure civic pride. Cheyne had met him for only five minutes a few days earlier, but each man already understood the other.
      - id: ch01-b92
        speaker: town_official
        text: Well, Mr. Cheyne, what do you think of our city? Yes, madam, sit wherever you please. I suppose you hold events like this out West?
      - id: ch01-b93
        speaker: cheyne
        text: We do, but our cities aren't as old as yours.
      - id: ch01-b94
        speaker: town_official
        text: True enough. You should have seen our two-hundred-and-fiftieth anniversary. Gloucester did herself proud.
      - id: ch01-b95
        speaker: cheyne
        text: So I heard. These things pay too. Why doesn't the town have a first-class hotel?
      - id: ch01-b96
        speaker: town_official
        text: Seats to the left, Pedro. Plenty of room for your crew. Mr. Cheyne, I tell them the same thing. A hotel would make money, though I suppose money doesn't concern you. What we need is—
      - id: ch01-b97
        speaker: narrator
        text: A heavy hand landed on the official's shoulder and spun him around. Captain Carsen, flushed from drink, was a Portland skipper who carried coal and ice.
      - id: ch01-b98
        speaker: carsen
        text: What do you fellows mean, forcing this law on town while every decent man is at sea? The place is dry as a bone and smells worse than before. You might have left one saloon open for soft drinks.
      - id: ch01-b99
        speaker: town_official
        text: The law hasn't stopped you from getting nourishment this morning, Carsen. We'll discuss politics later. Sit by the door and arrange your arguments until I return.
      - id: ch01-b100
        speaker: carsen
        text: What use are arguments? Champagne costs eighteen dollars a case in Miquelon, and—
