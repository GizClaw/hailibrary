        text: Be quiet, Salters. Your temper is troubling you again. Stay where you are, Harve.
      - id: ch01-b110
        speaker: narrator
        text: Then the day's orator rose. He was another strong pillar of town government. First he welcomed the whole world to Gloucester. Along the way, he carefully pointed out every way in which Gloucester was better than the rest of that world. Then his voice changed. He spoke of the city's wealth from the sea and the price that had to be paid for each year's harvest. Later, the audience would hear the names of its dead. There were one hundred and seventeen. At that number, the widows looked toward one another. Gloucester could not boast of enormous mills or factories. Her sons worked for whatever wages the sea chose to give them. Everyone knew that Georges and the Banks were not safe green pastures. The most that people ashore could do was care for the widows and children left behind. After several more public remarks, he thanked everyone who had agreed to take part in the ceremony.
