      - id: ch01-b127
        speaker: narrator
        text: What the Eastport man did not say was that Captain Edwardes had tried for five straight years to recite his own poem at Gloucester Memorial Day. At last the tired, amused committee had given him his wish. The old man stood before them in his very best Sunday clothes. His simplicity and complete happiness won everyone before he opened his mouth. Then he delivered thirty-seven roughly built verses. They described, in the fullest possible detail, the loss of the schooner Joan Hasken off Georges in the gale of 1867. The audience sat patiently through every line without a murmur. When he finally reached the end, they all shouted their approval with one kindly voice.
      - id: ch01-b128
        speaker: narrator
        text: A sharp Boston reporter slipped away to get the full poem and interview its author. At seventy-three, Captain Bart Edwardes had been a whaler, shipwright, master fisherman, and now a poet. The world had nothing more to offer him.
