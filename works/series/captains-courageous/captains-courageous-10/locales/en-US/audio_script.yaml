        text: A few years passed, and the story moved to the far edge of America. A young man came up through clammy sea fog along a windy street. The street was lined with very expensive houses, all built of wood and made to imitate stone. He stopped beside a gate of hammered iron. While he stood there, another young man rode into sight. The horse beneath him would have been cheap at a thousand dollars.
