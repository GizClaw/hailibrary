      - id: ch01-b166
        speaker: narrator
        text: Harvey announced that he had never felt better in his life. But the strange sickness stayed with him until he saw the We're Here at Wouverman's wharf, fresh from the hands of the men who had unloaded her. Then it changed into a confused mixture of pride and sorrow. Other people, summer visitors and people like them, played around in little sailboats or stood safely at the ends of piers and looked out at the sea. Harvey understood the sea from the inside now. He understood more than he could even begin to think about. For all that pride, he still wanted to sit down and howl because the little schooner was going away without him.
      - id: ch01-b167
        speaker: narrator
        text: Mrs. Cheyne cried all the way and said extraordinary things to Mrs. Troop. Mrs. Troop comforted her like a child until Dan, who had not been treated that way since he was six, whistled in amazement.
      - id: ch01-b168
        speaker: narrator
        text: The old crew climbed aboard among the battered dories. Harvey dropped into the old schooner with them and felt like the most ancient sailor alive. Then he returned to the pier, cast off the stern line, and helped them slide the vessel along the wharf with their hands. Everyone wanted to say so much that no one could manage to say anything that mattered. Harvey solemnly told Dan to take care of Uncle Salters's sea boots and Penn's dory anchor. Long Jack begged Harvey to remember every lesson he had learned about seamanship. They tried to make jokes, but every joke fell flat in front of the two women. It is hard for anyone to be funny while the strip of green harbor water widens between good friends.
