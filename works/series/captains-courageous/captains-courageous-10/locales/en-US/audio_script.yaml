        speaker: narrator
        text: The actress did not recite Ireson's Ride. Instead, she told of a fishing port called Brixham. A fleet of trawlers was fighting its way home through a storm in the night. On the head of the quay, the women made a guiding fire. They fed it with everything they could lay their hands on, because their men needed the light to find the harbor.
