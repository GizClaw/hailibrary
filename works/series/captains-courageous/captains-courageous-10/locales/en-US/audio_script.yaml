      - id: ch01-b134
        speaker: narrator
        text: The widows braced their bodies until they were rigid. Nearly all of them had lost their husbands during that one season, and they knew what came next. They looked like people waiting to be shot in cold blood. The summer girls in pink and blue blouses stopped giggling over Captain Edwardes's remarkable poem. They turned in their seats to discover why the whole hall had gone silent. The same town official who had talked with Cheyne bobbed up onto the platform. He unfolded the year's list of losses and began to read it month by month. The September deaths were mostly single men and strangers, but in that still hall, his voice rang terribly loud.
