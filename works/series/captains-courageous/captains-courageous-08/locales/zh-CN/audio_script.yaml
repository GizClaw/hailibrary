  chapters:
    - id: ch01
      title: 第八章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 哈维一辈子也忘不了那天早晨。太阳将近一星期没露脸，这会儿刚从海平线上跃出来，低低的红光照进三支锚泊船队扬起的停泊帆。北边一支，西边一支，南边一支，大小式样各不相同的双桅船怕有近百条。极远处还泊着一条横帆装置的法国船。所有船都随着波浪彼此鞠躬，每条船旁边都有小艇落水，像蜜蜂从拥挤的蜂巢里飞出来。人声、绳索滑轮声和船桨拍水声越过海面，传到几英里外。阳光越升越高，船帆一会儿黑，一会儿灰，一会儿又变得雪白。南边的雾里，还有更多小艇摇出来。
        - id: ch01-b02
          speaker: narrator
          text: 小艇聚拢又散开，再聚拢，再散开，可全在往同一个方向去。男人们互相吆喝、吹口哨、怪叫、唱歌，海上还漂满了船里扔出的零碎东西。
        - id: ch01-b03
          speaker: harvey
          text: 这简直就是一座城。迪斯科说得一点不错，真是一座城！
        - id: ch01-b04
          speaker: disko
          text: 比这还小的城，我也见过。这儿差不多有一千人。看，那边就是“圣母像”。
        - id: ch01-b05
          speaker: narrator
          text: 他指着一片没有小艇的空荡绿海。《我们在这儿号》绕过北边的船队，迪斯科一路向老朋友们挥手，最后像赛季收官时的赛艇一样，干净利落地抛下锚。大浅滩船队看见真本事，从来不会出声。可谁要是笨手笨脚，沿路每条船都要笑话他。
        - id: ch01-b06
          speaker: fleet_voice_1
          text: 来得正好，毛鳞鱼到了！
        - id: ch01-b07
          speaker: fleet_voice_2
          text: 你们的盐是不是快全湿透啦？
        - id: ch01-b08
          speaker: fleet_voice_3
          text: 汤姆·普拉特，今晚过来吃饭吗？
        - id: ch01-b09
          speaker: narrator
          text: 问候和回答隔着水面飞来飞去。许多人先前在雾里捕鱼时已经见过面，而大浅滩船队又最会传闲话。大家仿佛全听说了哈维获救的事，纷纷问他如今配不配拿工钱。年轻水手拿丹开玩笑，丹就用他们最讨厌的镇上绰号顶回去。曼努埃尔的同乡用自己的话冲他嚷嚷，连沉默的厨子也骑上艏斜桅，用盖尔语朝一个同样黑的朋友大喊。
        - id: ch01-b10
          speaker: narrator
          text: 众人给锚索系好浮标。“圣母像”周围的海底全是岩石，只要稍不留神，锚具就会在岩石上磨坏，船也可能挣脱锚位漂走。随后大家各自乘小艇出发，加入一英里外那一大群已经抛锚的伙伴。双桅船全留在安全距离外，随着海浪一起一伏，像一群母鸭望着自己的孩子。小艇却像没规矩的小鸭，挤来撞去，四处乱闯。
        - id: ch01-b11
          speaker: narrator
          text: 他们挤进混乱的艇群，船帮不停地碰在一起。四周的人都在评论哈维怎么划船，弄得他耳根发热。拉布拉多到长岛的各路口音，还有葡萄牙话、那不勒斯话、海港混合语、法语和盖尔语，夹着歌声、叫喊和新鲜骂法，在他身边响成一片，好像人人都在拿他取乐。他跟《我们在这儿号》上的人单独过得太久了。头一回面对那么多随小艇上下摇晃的野性面孔，他竟然害起羞来。
        - id: ch01-b12
          speaker: narrator
          text: 一道舒缓的长浪有呼吸一样的节奏，从浪谷到浪脊足足三弗隆。它悄悄托起一长排彩色小艇，让它们在天边悬了一瞬。艇上的人挥胳膊，张嘴呼喊，像一幅奇异的浮雕。下一刻，他们全沉下去，另一道浪又托起一排新人物，仿佛玩具戏台上的纸偶。哈维看得出了神。
        - id: ch01-b13
          speaker: dan
          text: 留神！我喊捞，你就捞。毛鳞鱼说来就来。汤姆·普拉特，咱们停在哪儿？
        - id: ch01-b14
          speaker: narrator
          text: 大家一边推挤，一边招呼老友、警告旧敌。汤姆·普拉特司令领着自家的小船队，来到大队人马的下风处。立刻有三四个人起锚，要抢到他们上风。忽然，一条小艇飞一样冲开，艇上的人发疯似的拽着锚索，四周一下笑翻了。
        - id: ch01-b15
          speakers: [fleet_voice_1, fleet_voice_2, fleet_voice_3, fleet_voice_4]
          ensemble: chorus
          text: 松开锚索！让它先把力气抖完！
        - id: ch01-b16
          speaker: harvey
          text: 怎么了？他不是已经抛锚了吗？
        - id: ch01-b17
          speaker: dan
          text: 是抛了，可他的锚具活得很，缠上一头鲸啦。哈维，快捞，鱼群来了！
        - id: ch01-b18
          speaker: narrator
          text: 四周海水先是变暗，接着炸开无数银亮的小鱼，像下了一场发光的暴雨。五六英亩海面上，鳕鱼接连跃起，后面还有三四道宽阔的灰背破水而过，把海搅得像烧开了一样。
        - id: ch01-b19
          speaker: narrator
          text: 所有人都叫喊起来，急着起锚追鱼。锚索缠在一起，人们一面骂，一面挥抄网，还冲伙伴乱喊主意。深海像刚开瓶的苏打水，鳕鱼、人和鲸鱼一股脑扑向饵鱼。丹的网柄差点把哈维扫下海。混战中，一头鲸几乎贴着水面冲过去。它那只小小的凶眼一动不动，很像马戏团大象的眼睛。哈维后来还说，那鲸朝他眨了眼。他看清了那只眼睛，从此再也没忘。三条艇的锚索被鲸缠住，拖出去半英里才挣脱。
        - id: ch01-b20
          speaker: narrator
          text: 毛鳞鱼很快游走了。五分钟后，海上只剩铅坠落水的扑通声、鳕鱼拍打船板的啪啪声，还有渔夫用短棒打昏鳕鱼的砰砰声。鱼情好得惊人。哈维能看见水下发亮的鳕鱼成群缓缓游动，一边游，一边不断咬钩。它们要咬便一起咬，要停也一起停。“圣母像”和东浅滩有规矩，一根线上不准挂一个以上的钩子。可艇靠得实在太密，就算只有一个钩也照样会缠。哈维左边是个温和又毛茸茸的纽芬兰人，右边是个大喊大叫的葡萄牙人。没过多久，他已经跟两边都吵得不可开交。
        - id: ch01-b21
          speaker: narrator
          text: 水下的小艇锚索比钓线还乱。人人都在自认为合适的地方抛锚，再围着那个点漂来划去。鱼不爱咬钩时，大家都想换地方，可每三个人里就有一个发现，自己的锚索已经和四五个邻居结成一团。在大浅滩，割别人的锚索是说不出口的大罪，那天却还是有人偷偷干了三四回。汤姆·普拉特抓住一个缅因人，抡桨把他打过船帮。曼努埃尔也这样收拾了一个同乡。哈维和宾恩的锚索都被割断，两人只好做接应艇，把别船装满的鱼运回去。黄昏时毛鳞鱼又来了一次，海上重新闹翻。天黑后，他们借着围栏旁的煤油灯剖鱼、腌鱼。
        - id: ch01-b22
          speaker: narrator
          text: 鱼堆成一座小山，大家收拾着收拾着就睡着了。第二天，几条小艇停到“圣母像”的岩顶上方。哈维也在其中，低头就能看见那块孤岩上的水草，岩顶离海面只有二十英尺。大群鳕鱼庄严地从皮革似的海带上游过，要咬钩便一起咬，要停也一起停。中午鱼儿歇了嘴，艇上的人便找起乐子。丹看见《布拉格希望号》刚到，它的小艇才加入，马上有人发问。
        - id: ch01-b23
          speaker: fleet_voice_1
          text: 船队里最吝啬的人是谁？
        - id: ch01-b24
          speakers: [fleet_voice_1, fleet_voice_2, fleet_voice_3, fleet_voice_4]
          ensemble: chorus
          text: 尼克·布雷——迪！
          emotion: happy
        - id: ch01-b25
          speaker: dan
          text: 谁把灯芯偷走啦？
        - id: ch01-b26
          speakers: [fleet_voice_1, fleet_voice_2, fleet_voice_3, fleet_voice_4]
          ensemble: chorus
          text: 尼克·布雷——迪！
          emotion: happy
        - id: ch01-b27
          speaker: fleet_voice_2
          text: 谁把咸鱼饵煮成汤喝啦？
        - id: ch01-b28
          speakers: [fleet_voice_1, fleet_voice_2, fleet_voice_3, fleet_voice_4]
          ensemble: chorus
          text: 尼克·布雷——迪！
          emotion: happy
        - id: ch01-b29
          speaker: narrator
          text: 布雷迪其实并不格外吝啬，只是有了这个名声，船队便把它用到极致。接着，他们认出一个特鲁罗船队的人。六年前，那人曾在浅滩用一副挂着五六个钩子的“多钩耙”捕鱼，被人当场逮住，从此便叫“多钩耙吉姆”。这些年他一直躲在乔治浅滩，如今回来一看，自己的名声早已开得灿烂无比。
        - id: ch01-b30
          speakers: [fleet_voice_1, fleet_voice_2, fleet_voice_3, fleet_voice_4]
          ensemble: chorus
          text: 吉姆！哦，吉姆！多——钩——耙吉姆！
          emotion: happy
        - id: ch01-b31
          speaker: narrator
          text: 一个有诗才的贝弗利人又唱，说《凯丽·皮特曼号》的锚一分钱用也没有。这句话他琢磨了一整天，后来又念叨了几个星期。艇群觉得听到这样的佳作真是走运，随即又追问他豆子够不够吃，毕竟不能让诗人独占便宜。几乎每条双桅船、每个男人都轮流挨了一遍。哪家厨子粗心又肮脏，他和他做的饭就会被编进歌里。哪条船装备差，整支船队也要一五一十听个明白。谁偷过同伴的烟草，他的名字便会在这场大会上公开，再从一道浪传到下一道浪。
        - id: ch01-b32
          speaker: narrator
          text: 迪斯科从不出错的判断，长杰克多年前卖掉的赶集船，丹的心上人，宾恩老在小艇锚上倒霉，索尔特斯讲肥料，曼努埃尔上岸后偶尔犯的过错，还有哈维那姑娘似的划桨姿势，全被当众抖了出来。丹气坏了。阳光底下，浓雾像银帘从四面垂下，声音从帘后传来，好似一排看不见的法官正在宣判。
        - id: ch01-b33
          speaker: narrator
          text: 小艇一边游荡、捕鱼、争吵，一边等待。后来，一道长浪从海底涌过，大家便稍稍散开，免得彼此撞坏船帮。有人说浪要是继续涨，“圣母像”马上就会破水。一个鲁莽的戈尔韦人和他的侄子偏说不会，竟起锚划到岩石正上方。有人叫他们快走，也有人故意激他们留下。光滑脊背的长浪朝南滚去，一次比一次更高，把小艇抬进雾里，再扔进难看又像在吸吮的漩涡。那条艇在自己的锚索尽头打转，离水下暗礁只有一两英尺。他们只是为了逞强，就拿自己的性命做赌注。所有小艇都不安地沉默下来，看着他们胡闹。直到长杰克从那两个同乡背后划来，一声不响割断他们的锚索。
        - id: ch01-b34
          speaker: long_jack
          text: 听不见岩礁在敲吗？想活命就快划！快划！
        - id: ch01-b35
          speaker: narrator
          text: 小艇漂开，那两个人还在咒骂争辩。下一道长浪忽然顿了一下，像有人被地毯绊住。深处先是一声呜咽，接着汇成轰鸣。“圣母像”猛地抛起几英亩翻滚的泡沫，惨白、狂暴又阴森，盖过整片浅海。艇群立刻为长杰克大声喝彩，那两个戈尔韦人终于闭了嘴。
        - id: ch01-b36
          speaker: dan
          text: 漂亮吧？往后差不多每半小时来一次，除非浪越堆越高。汤姆·普拉特，它真发作起来，到底隔多久一次？
        - id: ch01-b37
          speaker: tom_platt
          text: 每十五分钟一次，一点不差。哈维，大浅滩上最了不起的景象，你已经看到了。要不是长杰克，你还会看见几个死人。
        - id: ch01-b38
          speaker: narrator
          text: 浓雾深处传来笑闹声，双桅船都在摇铃。一条大帆船小心地从雾里探出船头，爱尔兰人立刻用“过来吧，亲爱的”之类的话欢迎它。
        - id: ch01-b39
          speaker: harvey
          text: 又是一条法国船吗？
        - id: ch01-b40
          speaker: dan
          text: 你眼睛呢？那是巴尔的摩来的，已经吓得魂都快没了。我猜它的船长头一回撞上整支船队。咱们连它的桅杆都得笑话一遍。
        - id: ch01-b41
          speaker: narrator
          text: 那是一条八百吨的黑色大船，船身丰满。主帆束着，顶帆迎着一点微风迟疑地拍动。所有海船里，大帆船最像女人。眼前这个高挑又犹豫的女子，船头有白底镀金的艏像，活像在坏小子的哄笑里过泥泞街道，裙子却只提起一半。她知道“圣母像”就在附近，也听见岩礁咆哮，所以正在问路。跳荡的小艇立刻七嘴八舌地回答。
        - id: ch01-b42
          speaker: fleet_voice_1
          text: “圣母像”？胡说什么呢？这里是礼拜天早晨的勒阿弗尔。快回家醒酒吧！
        - id: ch01-b43
          speaker: fleet_voice_2
          text: 滚回去吧，你这只泥龟！告诉他们，我们马上就来！
        - id: ch01-b44
          speaker: narrator
          text: 大船的船尾随着长浪冒泡沉下浪谷，六个声音马上唱起悦耳的合唱。
        - id: ch01-b45
          speakers: [fleet_voice_1, fleet_voice_2, fleet_voice_3, fleet_voice_4]
          ensemble: chorus
          text: 她——撞——上——啦！
          emotion: happy
        - id: ch01-b46
          speaker: fleet_voice_3
          text: 满舵！赶快满舵！你就在礁顶上！
        - id: ch01-b47
          speaker: fleet_voice_4
          text: 下风舵打到底！东西全扔掉！
        - id: ch01-b48
          speaker: fleet_voice_1
          text: 所有人去抽水！
        - id: ch01-b49
          speaker: fleet_voice_2
          text: 放下艏帆！拿杆子把她撑开！
        - id: ch01-b50
          speaker: narrator
          text: 船长终于发火，骂了几句。捕鱼立刻停了，人人都来回敬。他听到了无数关于自家船和下一站的奇闻。大家问他买没买保险，问他的锚是不是从《凯丽·皮特曼号》偷来的。他们管大船叫运泥驳船，说它倾倒垃圾，吓跑了鱼。还有人愿意拖它一程，再把账单寄给船长太太。一个胆大的年轻人溜到船尾下面，伸手拍了船壳一巴掌。
        - id: ch01-b51
          speaker: fleet_voice_4
          text: 驾，老伙计！
        - id: ch01-b52
          speaker: narrator
          text: 厨子把一盘炉灰倒在他身上，他便扔回一个鳕鱼头。大船水手从厨房发射小煤块，小艇上的人就威胁要登船，把大船削低一层。若它真有危险，大家早会警告。既然它离岩礁远得很，谁也不肯错过这场热闹。半英里外，“圣母像”再次开口，打断了众人的兴致。受尽折磨的大帆船挂起所有吃得住风的帆，匆匆走了。小艇上的人却认定，胜的是自己。
        - id: ch01-b53
          speaker: narrator
          text: “圣母像”嘶哑地吼了一整夜。第二天早晨，海面暴怒，每个浪头都戴着白帽。整支船队的桅杆摇个不停，全在等一个下艇的机会。直到十点，《白昼之眼号》的杰罗尔德兄弟以为风浪小了，先放下小艇。不到一分钟，一半的小艇都下了水，在又短又陡的浪上颠簸。特鲁普却让《我们在这儿号》继续剖鱼腌鱼。他认为拿命打赌毫无道理。
        - id: ch01-b54
          speaker: narrator
          text: 当晚风暴更凶了。他们痛痛快快收留一个又一个湿透的陌生人。狂风里不论是什么地方，只要能躲，谁都求之不得。两个男孩提着灯守在小艇吊索旁，男人们随时准备把人拉上船。每个人还得拿一只眼盯着横扫过来的巨浪，一见不对就扔下手里的一切，死死抓住身边的东西。黑暗里不时有人喊“有艇，有艇”。他们先钩住小艇，再把人和艇一同吊上来。来了一条又一条，直到甲板上层层叠叠堆满小艇，所有床铺也都睡满了人。
        - id: ch01-b55
          speaker: narrator
          text: 那班值守中，哈维和丹有五次扑向绑在帆桁上的前桅斜桁，用胳膊、腿和牙齿一起抱住绳索、木杆和湿帆布，因为大浪已经灌满甲板。一条小艇撞碎了，浪把艇上的人头朝前扔上甲板，额头划开一道口子。天快亮时，飞奔的浪沿泛起冷硬白光，又有一个浑身青紫、脸上没一点血色的人爬上船。他断了一只手，还在追问兄弟的下落。
        - id: ch01-b56
          speaker: distressed_sailor
          text: 我兄弟呢？有人看见我兄弟没有？
          emotion: fearful
        - id: ch01-b57
          speaker: narrator
          text: 早餐桌前多了七张嘴，一个瑞典人，一个查塔姆船长，一个缅因州汉考克的男孩，一个达克斯伯里人，还有三个普罗温斯敦人。第二天，船队把夜里救上来的人重新分派，送回各自的船。谁也没有多说，可一条又一条小艇回来报告，说全体船员都在时，大家的胃口显然好了起来。这场风暴只淹死了两个葡萄牙人和一个格洛斯特老人，不过许多人身上都有割伤或撞伤。另有两条双桅船挣断锚具，一直被吹到南边三天航程之外。
        - id: ch01-b58
          speaker: narrator
          text: 一条法国船也死了人，正是先前跟《我们在这儿号》换过烟草的那条。一个湿漉漉的白色早晨，它悄无声息地离开船队，驶到深水上，船帆凌乱地垂着。哈维从迪斯科的望远镜里看见海葬。那只是一个长方形包裹从船舷滑下去。法国人似乎没办什么仪式，可当晚船都抛着锚，哈维听见他们隔着洒满星光的黑水唱歌。曲子很慢，像圣歌一样。
        - id: ch01-b59
          speakers: [fleet_voice_1, fleet_voice_2, fleet_voice_3, fleet_voice_4]
          ensemble: chorus
          text: 双桅船儿要转向，摇摇晃晃去远方，带我一同漂流。圣母玛利亚，请替我向上帝祈求。永别了，我的故乡。魁北克啊，永别了！
          emotion: sad
        - id: ch01-b60
          speaker: narrator
          text: 汤姆·普拉特特意去探望那条船。照他的说法，死者既然是共济会会员，便是他的兄弟。后来大家才知道，一个浪头把那可怜人折在艏斜桅根部，当场撞断了他的脊梁。消息转眼传遍整支船队，因为法国人违反常例，竟然拍卖起死者的随身物品。他在圣马洛和密克隆都没有亲友，从红色针织帽，到腰后插着鞘刀的皮带，每一样东西都摊在舱顶上。
        - id: ch01-b61
          speaker: narrator
          text: 丹和哈维当时乘《海蒂·S号》在二十寻深的水面捕鱼，也划过去凑热闹。路很远，他们又在那里耽搁了一阵。丹买下那把刀，刀柄是样式古怪的黄铜。两人回到艇里，冒着细雨和起伏的海面划走，这才想起荒废钓线也许会惹麻烦。
        - id: ch01-b62
          speaker: dan
          text: 挨一顿揍，对咱们说不定还有好处。
        - id: ch01-b63
          speaker: narrator
          text: 丹缩在油布衣下，冻得直抖。他们划进一片白雾，那雾跟往常一样，事先一点招呼也没有。
        - id: ch01-b64
          speaker: dan
          text: 这附近的潮流多得该死，光凭感觉可回不去。哈维，把锚放下。雾散以前，咱们先钓鱼。挂最大的铅坠，这水里三磅也不嫌沉。你看，锚索已经拉直了。
        - id: ch01-b65
          speaker: narrator
          text: 船头冒起一小片水泡。一股不管不顾的海流拖着小艇，把锚索绷得笔直。四周一艇长以外都看不见。哈维竖起衣领，像个疲倦的领航员，缩在绕线轮上方。如今雾已经吓不住他。两人安静地钓了一阵，鳕鱼咬钩很勤。丹拔出新买的鞘刀，在船帮上试刀刃。
        - id: ch01-b66
          speaker: harvey
          text: 真是把好刀。你怎么花那么少的钱就买到了？
        - id: ch01-b67
          speaker: dan
          text: 都怪法国佬那些要命的天主教迷信。他们不肯碰死人的铁器，大概就是这么回事。我一出价，那些阿里沙特法国人全往后躲，你没看见吗？
        - id: ch01-b68
          speaker: harvey
          text: 可这是拍卖，不是从死人身上拿东西。这就是做买卖。
        - id: ch01-b69
          speaker: dan
          text: 咱们明白，可你斗不过迷信。住在进步国家，这点就挺好。
        - id: ch01-b70
          speaker: narrator
          text: 丹吹起口哨，唱的是双塔彻岛、东角、岸上的姑娘小伙，还有在安角外抛锚。
        - id: ch01-b71
          speaker: harvey
          text: 那个东港人怎么不出价？他不是买了死人的靴子吗？难道缅因州不算进步？
        - id: ch01-b72
          speaker: dan
          text: 缅因州？呸！那儿的人不是没见识，就是没钱，连自己房子都不刷漆。我亲眼见过。那个东港人说，这把刀用过。法国船长告诉他，去年在法国海岸用过。
        - id: ch01-b73
          speaker: harvey
          text: 砍过人？把短棒给我。
        - id: ch01-b74
          speaker: narrator
          text: 哈维收起鱼，重新装饵，把线抛回海里。
        - id: ch01-b75
          speaker: dan
          text: 杀过人！我听见这个，反倒更想把刀买下来。
        - id: ch01-b76
          speaker: harvey
          text: 老天，我可不知道。等拿到工钱，我出一美元买。算了，我出两美元。
        - id: ch01-b77
          speaker: dan
          text: 真的？你这么喜欢？其实我本来就是买来送你的。可我得先看看你喜不喜欢，所以一直没说。拿去吧，哈维。咱们是同艇伙伴嘛，诸如此类，如此这般。接着！
          emotion: happy
        - id: ch01-b78
          speaker: narrator
          text: 丹红了脸，把刀连皮带递过来。
        - id: ch01-b79
          speaker: harvey
          text: 可是，丹，我不明白……
        - id: ch01-b80
          speaker: dan
          text: 拿着。它对我没用，我就是要给你。
        - id: ch01-b81
          speaker: harvey
          text: 丹，你真是个堂堂正正的汉子。这把刀我一辈子都留着。
          emotion: happy
        - id: ch01-b82
          speaker: dan
          text: 这话听着真舒坦。哎，你的钓线像是挂住什么了。
          emotion: happy
        - id: ch01-b83
          speaker: harvey
          text: 我猜缠住了。
        - id: ch01-b84
          speaker: narrator
          text: 哈维使劲拽线。起线前，他把皮带扣在腰上，刀鞘尖碰到横座板，轻轻响了一声，他心里快活极了。
        - id: ch01-b85
          speaker: harvey
          text: 这该死的东西！怎么像挂在草莓底上了？这儿不全是沙吗？
        - id: ch01-b86
          speaker: dan
          text: 大比目鱼发脾气时也会这样。可这不是草莓底。再使几下劲。动了，真的动了。拉上来看看是什么。
        - id: ch01-b87
          speaker: narrator
          text: 两人一同拉，每收一段线，就在系索耳上扣紧一次。水下看不见的重物慢慢升上来。
        - id: ch01-b88
          speaker: dan
          text: 宝贝呀，拉！
        - id: ch01-b89
          speaker: narrator
          text: 喊声忽然变成两个男孩尖利的惨叫。两天前下葬的法国死者竟从水里升了起来。鱼钩挂在他的右腋下，他直挺挺地晃着，头和双肩露在水面。两条胳膊绑在身侧，而他的脸已经没有了。两个男孩互相绊倒，缩成一团摔在艇底。那东西就在船边起伏，短短的钓线还牢牢牵着他。
        - id: ch01-b90
          speaker: harvey
          text: 是潮水，是潮水把他带来的！
          emotion: fearful
        - id: ch01-b91
          speaker: narrator
          text: 哈维嘴唇发抖，慌乱地摸着皮带扣。
        - id: ch01-b92
          speaker: dan
          text: 上帝啊，哈维，快点！他来拿刀了。还给他，快把刀解下来！
          emotion: fearful
        - id: ch01-b93
          speaker: harvey
          text: 我不要了！我不要了！可我找不到皮……皮带扣！
          emotion: fearful
        - id: ch01-b94
          speaker: dan
          text: 快啊，哈维！他还挂在你的线上！
          emotion: fearful
        - id: ch01-b95
          speaker: narrator
          text: 哈维坐起来解皮带，正对着湿发下面那颗没有脸的脑袋。
        - id: ch01-b96
          speaker: harvey
          text: 还挂着。
          emotion: fearful
        - id: ch01-b97
          speaker: narrator
          text: 丹拔出自己的刀割断钓线，哈维同时把皮带远远扔进海里。尸体扑通沉下去。丹小心地跪起身，脸色比雾还白。
        - id: ch01-b98
          speaker: dan
          text: 他就是来拿刀的。他就是来拿刀的。从前拖网捞上一具泡久的尸首，我也见过，没觉得怎么样。可这个人是专程来找咱们。
          emotion: fearful
        - id: ch01-b99
          speaker: harvey
          text: 真希望……真希望我没拿那把刀。那样，他就会挂上你的钓线。
          emotion: fearful
        - id: ch01-b100
          speaker: dan
          text: 那恐怕也没什么不同。咱们这一下少活了十年。哈维，你看见他的脑袋了吗？
          emotion: fearful
        - id: ch01-b101
          speaker: harvey
          text: 我怎么会没看见？这辈子都忘不掉。可你听着，丹，不会是谁特意安排的。只是潮水。
          emotion: fearful
        - id: ch01-b102
          speaker: dan
          text: 潮水！他就是来拿刀的。法国人把他沉在船队南边六英里处，咱们离那条船也有两英里。听说他们还绑了一寻半的锚链压着他。
          emotion: fearful
        - id: ch01-b103
          speaker: harvey
          text: 不知道他在法国海岸拿那把刀做过什么？
        - id: ch01-b104
          speaker: dan
          text: 准不是好事。我猜他非得带着刀去受末日审判，所以才……你为什么把鱼扔了？
        - id: ch01-b105
          speaker: harvey
          text: 扔回海里。
        - id: ch01-b106
          speaker: dan
          text: 为什么？咱们又不会吃这些鱼。
        - id: ch01-b107
          speaker: harvey
          text: 我不管。刚才解皮带，我只能一直看着他的脸。你的鱼愿意留就留，反正我的鱼，我再也不要。
        - id: ch01-b108
          speaker: narrator
          text: 丹没说话，也把自己的鱼全扔进海里。
        - id: ch01-b109
          speaker: dan
          text: 稳妥一点总没错。只要雾肯散，我愿意拿一个月工钱来换。晴天看不见的东西，一到雾里就到处游荡。喊“哟嗬”的，发空声的，还有这种东西。他没走过来，是这样冒出来的，我还觉得轻松一点。他本来可以走来的。
          emotion: fearful
        - id: ch01-b110
          speaker: harvey
          text: 别说了，丹！咱们正停在他头顶。我真想平安回船上，让索尔特斯叔叔狠狠揍一顿。
          emotion: fearful
        - id: ch01-b111
          speaker: dan
          text: 过一阵他们会来找。把号角给我。
        - id: ch01-b112
          speaker: narrator
          text: 丹拿起吃饭时吹的白铁号角，却停住没吹。
        - id: ch01-b113
          speaker: harvey
          text: 吹呀。我可不想整夜留在这儿。
        - id: ch01-b114
          speaker: dan
          text: 可他听见会怎么样？从前有个南方人告诉我，他待过一条双桅船。那条船从不敢吹号召回小艇。五年前，有个船长喝醉了，在船边淹死一个男孩。从那以后，只要号角一响，那个男孩也会划到船边，跟别人一起喊“有艇，有艇”。
        - id: ch01-b115
          speaker: cook
          text: 有艇！有艇！
        - id: ch01-b116
          speaker: narrator
          text: 闷闷的声音穿过浓雾。两个男孩又缩成一团，号角从丹手中掉下去。
        - id: ch01-b117
          speaker: harvey
          text: 等等，是厨子！
          emotion: surprised
        - id: ch01-b118
          speaker: dan
          text: 我也不知道怎么偏想起那个蠢故事。没错，是医生。
        - id: ch01-b119
          speaker: cook
          text: 丹！丹尼！呜——丹！哈维！哈维！呜——哈——维——！
        - id: ch01-b120
          speakers: [harvey, dan]
          ensemble: duo
          text: 我们在这儿！
        - id: ch01-b121
          speaker: narrator
          text: 他们听见桨声，却什么也看不到。直到厨子浑身发亮、滴着水，划到眼前。
        - id: ch01-b122
          speaker: cook
          text: 出什么事了？回船以后，你们要挨打。
        - id: ch01-b123
          speaker: dan
          text: 咱们正想要这个，就盼着这个呢。只要有点家的味道，什么都好。刚才陪咱们的东西，实在太丧气了。
        - id: ch01-b124
          speaker: narrator
          text: 厨子递来绳子，丹一边接，一边把事情从头讲了一遍。
        - id: ch01-b125
          speaker: cook
          text: 对，他就是回来拿刀的。
        - id: ch01-b126
          speaker: narrator
          text: 厨子生在雾里，也长在雾里。他把两人划回去时，轻轻摇晃的《我们在这儿号》从没这样可亲，简直就是家。舱房亮着暖光，前舱飘来叫人安心的食物香味。迪斯科和其他人都活生生、结结实实地伏在船栏上，答应痛揍他们一顿，那声音听来竟像天籁。
        - id: ch01-b127
          speaker: narrator
          text: 厨子很有谋略。他没有马上把小艇吊上去，而是一边倒划，一边故意让船尾到处磕碰。他趁两个男孩还没登船，先把故事里最吓人的几个地方讲给大家听，又解释说，哈维是全船的吉祥物，足够破除任何可能的晦气。这样一来，两个男孩翻过船舷时，反倒成了带着几分神秘色彩的英雄。大家只顾围着他们盘问，没人还记得因为他们惹麻烦而动手。
        - id: ch01-b128
          speaker: narrator
          text: 小个子宾恩讲了好一通，说迷信多么愚蠢，可众人的意见都不站在他那边，反而支持长杰克。长杰克挑最折磨人的鬼故事，一个接一个讲到将近午夜。趁着这种气氛，厨子把一支点燃的蜡烛、一块面粉和水做的饼，还有一撮盐，一起放在木瓦上，再从船尾放进海里。若那个法国人仍不得安宁，这些东西便可以叫他平静。除了索尔特斯和宾恩，没人提什么“偶像崇拜”。皮带是丹买的，蜡烛便该由他点。只要那一点火苗还在浪里浮浮沉沉，厨子就一直低声哼哼，不停念着咒语。
        - id: ch01-b129
          speaker: harvey
          text: 你说的进步，还有天主教迷信呢？
        - id: ch01-b130
          speaker: dan
          text: 哼，我自认跟谁一样开明，一样进步。可一个死去的圣马洛水手，为一把三十美分的刀，把两个可怜男孩吓得浑身僵硬，那我宁愿全交给厨子处理。不管活人死人，外国人我都信不过。
        - id: ch01-b131
          speaker: narrator
          text: 第二天早晨，除了厨子，人人想起那套仪式都有点难为情，于是加倍卖力干活，彼此说话也故意粗声粗气。《我们在这儿号》正同《帕里·诺曼号》并驾齐驱，争抢最后几船鱼。竞争激烈得整支船队都分成两派，还拿烟草下注。所有人不是守着钓线，就是剖鱼、腌鱼，累得常常站着便睡着。他们天不亮就开工，一直干到天黑，黑得什么也看不清。连厨子也被拉来负责抛鱼，哈维钻到底舱去递盐，丹则留在上面帮忙剖鱼。
        - id: ch01-b132
          speaker: narrator
          text: 幸好《帕里·诺曼号》有个人从前舱摔下去，扭伤了脚踝，《我们在这儿号》这才占了上风。哈维怎么也看不出船里还能塞下哪怕一条鱼，迪斯科和汤姆却不停装、不断码，又从压舱物中搬出大石头，把鱼堆一层层压紧。每天总还有“再干一天的活”。盐终于全湿透时，迪斯科没有告诉任何人。他摇摇摆摆走到舱房后面的尾储舱，动手拖出那面大主帆。那时还是上午十点。等到中午，停泊帆已经落下，主帆和顶帆却全升了起来。
        - id: ch01-b133
          speaker: narrator
          text: 小艇纷纷靠来，送上寄回家的信，人人都羡慕他们的好运。甲板终于收拾干净，《我们在这儿号》升起旗子。这是第一条离开大浅滩的船才有的权利。它起锚开航，迪斯科假装体贴没来得及送信的人，优雅地在各条双桅船之间穿行。其实，这是他小小的凯旋巡游。他要连续第五年让全船队看看，自己是怎样一个航海好手。
        - id: ch01-b134
          speaker: narrator
          text: 丹的手风琴和汤姆·普拉特的小提琴一同奏响那支神奇的歌。盐没全湿以前，谁也不许唱它。
        - id: ch01-b135
          speakers: [dan, tom_platt]
          ensemble: duo
          text: 嗨！咿！哟嗬！快把你们的信送来！盐全湿透了，铁锚也离开海底啦！扯呀，扯起主帆，咱们回到美国岸。一千五百担，一千五百担，一千五百满尖担，就在老奎罗和大浅滩之间！
          emotion: happy
        - id: ch01-b136
          speaker: narrator
          text: 最后几封信裹在煤块外面，一封接一封落上甲板。格洛斯特人隔着海水，高声向自己的妻子、姑娘和船主捎话。《我们在这儿号》伴着手风琴和小提琴的乐声，走完了穿过船队的航程。船头的帆轻轻发颤，像一个人举手告别时，不住抖动的手掌。
        - id: ch01-b137
          speaker: narrator
          text: 哈维很快发现，挂着停泊帆、从一个锚位闲逛到另一个锚位的《我们在这儿号》，和升起归航船帆、一路朝西偏南航行的《我们在这儿号》，简直是两条完全不同的船。哪怕这时只刮着孩子也能掌舵的风，手里的舵轮仍然又咬又踢。他能清楚感觉到，底舱里那份死沉的重量正随着巨浪猛烈前冲。船舷外一路奔流的白色泡沫，更叫他看得眼花缭乱。
        - id: ch01-b138
          speaker: narrator
          text: 迪斯科不停叫大家调帆，直到船帆像赛艇的一样平整。丹要守住大顶帆，每逢船转向，都得靠人力把帆移到另一边。有空还要抽水，因为压紧的鱼不断渗出盐卤，会毁掉货物。可是不用捕鱼以后，哈维终于能换一种眼光看海。
        - id: ch01-b139
          speaker: narrator
          text: 船舷低矮的双桅船，天生跟周围的一切贴得很近。除非爬到浪头上，他们很少能望见地平线。多数时候，船都待在灰色、灰蓝或黑色的深谷里，用肩膀推，用身子挤，贴着深谷的边稳稳向前。颤抖的白沫在头顶纵横交织。有时，船又亲昵地擦过一座更高的水山，好像在小声央求，你总不会伤害我吧，我只是小小的《我们在这儿号》。说完，它便自顾自咯咯笑着滑开，直到撞上下一个障碍。
        - id: ch01-b140
          speaker: narrator
          text: 哪怕最迟钝的人，看上许多天、许多个钟头，也不会毫无感觉。哈维并不迟钝。他渐渐懂得，也爱上了海上的一切。浪尖翻卷时永不停息的干涩撕裂声，风扫过空旷海面，把紫蓝云影赶成一群。红日升起时，海水壮丽地隆起。晨雾一堵堵从白色地面上撤走，像墙被叠好收起。正午有咸涩的强光和烈焰，雨亲吻着几千平方英里的寂静海面。一天结束，万物冷冷沉进黑暗。月光下，海面皱起百万条细纹，艏斜桅庄严地戳向低垂的星星，而哈维下舱找厨子讨炸面圈。
        - id: ch01-b141
          speaker: narrator
          text: 最好玩的时候，是两个男孩一起掌舵，汤姆·普拉特就在一喊能听见的地方。船把下风舷偎进轰响的蓝海，一道自制的小彩虹完整地拱在起锚机上。帆桁叉口抵着桅杆呜咽，帆脚索吱嘎作响，鼓满的帆轰轰鸣叫。船滑下浪谷，像女人被自己的绸裙绊住，重重踏步。等它冲出来，艏帆下半截已经湿透，它还是向前探望，盼着塔彻岛两座高高的灯塔。
        - id: ch01-b142
          speaker: narrator
          text: 他们离开大浅滩灰冷的海水，看见木材船穿过圣劳伦斯海峡，朝魁北克驶去，也看见从西班牙和西西里来的泽西运盐双桅船。到了阿蒂蒙浅滩外，一股友善的东北风从后面赶上来，一路把他们送到能望见塞布尔岛东灯塔的地方。迪斯科可不愿在那片景色前多留。风又陪他们越过西浅滩和勒阿弗尔，来到乔治浅滩北边。再往前便进入更深的海水，《我们在这儿号》高高兴兴地放船飞跑起来。
        - id: ch01-b143
          speaker: dan
          text: 海蒂在绳子那头拉咱们呢。海蒂，还有妈。下个礼拜天，你准得花钱雇个小子往窗户上泼水，不然睡不着。我猜你会住咱们家，等家里人来。你知道重新上岸，最美的是什么吗？
        - id: ch01-b144
          speaker: harvey
          text: 洗个热水澡？
        - id: ch01-b145
          speaker: narrator
          text: 哈维的眉毛上全是晒干的白色盐沫。
        - id: ch01-b146
          speaker: dan
          text: 那个也好，可睡衣更好。自从升起主帆，我做梦都在想睡衣。穿上它，脚趾想怎么动就怎么动。妈一定给我备了件新的，洗得软软的。这就是家啊，哈维，是家！空气里都能闻见。咱们正进到热浪边上，我已经闻到杨梅了。不知道能不能赶上晚饭。向左一点。
          emotion: happy
        - id: ch01-b147
          speaker: narrator
          text: 闷热空气里，犹疑的船帆拍打几下，猛地一晃。四周深海渐渐平滑，蓝得像油。他们吹口哨求风，来的却只有雨。雨像尖刺一样落下，打出水泡，敲得甲板咚咚响，后面又跟来八月中旬的雷电。两个男孩露着胳膊和脚躺在甲板上，盘算上岸后的第一顿饭，因为陆地已经看得清清楚楚。
        - id: ch01-b148
          speaker: narrator
          text: 一条格洛斯特剑鱼船漂到旁边。一个人站在艏斜桅的小台上挥鱼叉，雨水把他光头上的头发贴得紧紧的。他像在大客轮上值班那样快活地唱着喊话。
        - id: ch01-b149
          speaker: swordfish_sailor
          text: 一切平安！沃弗曼在等你呢，迪斯科。船队有什么消息？
          emotion: happy
        - id: ch01-b150
          speaker: narrator
          text: 迪斯科高喊着报完消息，继续前进。疯狂的夏日风暴在头顶猛击，四面岬角上的闪电一同明灭。每分钟足有十二次，刺眼白光照出一张张忽现忽灭的照片。照片里有格洛斯特港周围低矮的环形山丘，有十磅岛和鱼棚，还有参差断续的一排屋顶。水面上的每一根桅杆、每一个浮标，也都在闪光中突然现身，下一刻又跌回黑暗。
        - id: ch01-b151
          speaker: narrator
          text: 《我们在这儿号》趁着半涨潮，慢慢驶进港里，身后的鸣笛浮标一直呜咽哀鸣。到最后，风暴只剩几道彼此隔得很远的蓝白火焰，还在凶狠地劈落。紧接着，一声轰鸣响起来，仿佛一整排臼炮同时开火。震颤的空气在星光下嗡嗡作响，过了好一会儿才重新安静。
        - id: ch01-b152
          speaker: disko
          text: 旗！快看旗！
        - id: ch01-b153
          speaker: long_jack
          text: 旗怎么了？
        - id: ch01-b154
          speaker: disko
          text: 奥托。降半旗。岸上已经能看见咱们了。
        - id: ch01-b155
          speaker: long_jack
          text: 我全忘了。他在格洛斯特没有亲人，对吧？
        - id: ch01-b156
          speaker: disko
          text: 有一个姑娘。他本来要在今年秋天娶她。
        - id: ch01-b157
          speaker: long_jack
          text: 愿圣母怜悯她！
          emotion: sad
        - id: ch01-b158
          speaker: narrator
          text: 长杰克把小旗降到半桅，悼念奥托。三个月前，奥托在勒阿弗尔外的一场风暴中被浪卷下船。
        - id: ch01-b159
          speaker: narrator
          text: 迪斯科擦掉眼里的雨水，把船领向沃弗曼的码头。他低声下令，船从系泊拖船旁转过。漆黑码头尽头，守夜人高声问候。走过归航路上那片黑暗和神秘，哈维感觉陆地重新从四面包围上来。成千上万的人正在岸上熟睡。空气里有雨后泥土的气味，货场的调车机发出熟悉的响声，像独自在咳嗽。
        - id: ch01-b160
          speaker: narrator
          text: 哈维站在前帆脚索旁，眼前的一切让他心跳加快，喉咙发干。他们听见灯塔拖船上的值班人正在打鼾。船头探入一小片黑暗，两边各有一盏灯笼微亮。有人哼了一声醒来，给他们扔下一根缆绳。
        - id: ch01-b161
          speaker: narrator
          text: 船终于稳稳系在一座寂静的码头。两旁巨大的铁顶货棚里，空荡荡地积着暖意。经过漫长的归航，《我们在这儿号》无声无息地停住了。
        - id: ch01-b162
          speaker: narrator
          text: 哈维在舵轮旁坐下来，哭了又哭，仿佛心都要碎了。一个高个子女人原先坐在磅秤上，这时从双桅船上跳下来，亲了丹的脸颊。她是丹的母亲，早在船进港时，就借着一道道闪电看见了《我们在这儿号》。起初，她没有理会哈维。等哈维稍稍平静，迪斯科又把他的故事说过一遍，她才带着哈维和大家一同回到迪斯科家。黎明正在升起，可电报局还没有开门，哈维没法给家里发电报。那一刻，哈维·切恩也许是全美国最孤单的男孩。不过有件事很奇妙，迪斯科和丹似乎一点也没有因为他哭泣而看轻他。
        - id: ch01-b163
          speaker: narrator
          text: 沃弗曼还没准备接受迪斯科开的价。迪斯科确信《我们在这儿号》至少比别的格洛斯特船早回来一星期，便给他几天，让他慢慢把这个价咽下去。因此，船员们全到街上闲逛玩耍。长杰克还拦住了洛基颈的有轨电车。照他说，这可是原则问题。他一直不肯让路，直到售票员答应让他免费乘车才罢休。丹却整天翘着长满雀斑的鼻子，满肚子都是秘密，对家里人格外傲慢。
        - id: ch01-b164
          speaker: disko
          text: 丹，你再这么下去，我非揍你不可。这回上岸以后，你实在放肆得过头了。
        - id: ch01-b165
          speaker: salters
          text: 要是他是我儿子，我现在就揍。
        - id: ch01-b166
          speaker: narrator
          text: 索尔特斯和宾恩都寄宿在特鲁普家。丹拖着手风琴在后院来回走，只等有人逼近就翻篱笆逃跑。
        - id: ch01-b167
          speaker: dan
          text: 哦嗬！爸，你照自己的判断办吧，可别忘了，我已经警告过你。你的亲儿子警告过你！你自己弄错了，不能怪我，我会留在甲板上看你怎么办。还有你，索尔特斯叔叔，法老的司膳长跟你一比，根本不算什么。等着瞧吧，你会像自家那该死的苜蓿一样被犁进土里。可我，丹·特鲁普，会像青翠的月桂树一样兴旺，因为我没死抱着自己的意见不放。
        - id: ch01-b168
          speaker: narrator
          text: 迪斯科穿着漂亮的花毯拖鞋，抽着烟，摆足了岸上一家之主的派头。
        - id: ch01-b169
          speaker: disko
          text: 你越来越像可怜的哈维一样疯。你们两个到处偷笑、挤眉弄眼，还在饭桌下面踢来踢去，家里一刻也不得安宁。
        - id: ch01-b170
          speaker: dan
          text: 有些人很快就要少掉一大堆安宁了。等着瞧吧。
        - id: ch01-b171
          speaker: narrator
          text: 丹和哈维坐有轨电车到东格洛斯特，穿过一片杨梅灌木，走到灯塔。他们躺在巨大的红色岩石上，一直笑到肚子饿。哈维给丹看过一封电报，两人发誓，在炮弹炸开以前，绝不泄露秘密。
        - id: ch01-b172
          speaker: dan
          text: 哈维的家里人？我猜他们根本不是什么人物，不然咱们早有消息了。他爸爸在西部开一家什么铺子。爸，说不定他会给你五美元呢。
        - id: ch01-b173
          speaker: salters
          text: 我跟你说过什么？丹，别把饭喷得到处都是。
