  chapters:
    - id: ch01
      title: CHAPTER VIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Harvey never forgot what he saw when the sun finally cleared a horizon hidden for nearly a week. Its low red light fell across three fleets of anchored schooners, north, west, and south. Nearly a hundred vessels of every shape bowed to one another on the swell. Far off stood a square-rigged French ship. Dories dropped from the schooners like bees leaving crowded hives, while voices, blocks, ropes, and oars filled the miles of moving water with noise. As the sun climbed, the sails changed from black to pearl-gray to white, and still more boats came through the southern mist.
        - id: ch01-b02
          speaker: narrator
          text: The dories gathered, scattered, formed again, and all moved one way. Men hailed, whistled, sang, and called across the water.
        - id: ch01-b03
          speaker: harvey
          text: It really is a town! Disko was right. This whole place is a town!
          emotion: surprised
        - id: ch01-b04
          speaker: disko
          text: I've seen smaller towns. There must be a thousand men here. See that empty patch of green water? That's the Virgin.
        - id: ch01-b05
          speaker: narrator
          text: The We're Here passed around the northern fleet while Disko waved to one friend after another. Then he anchored with the neat precision of a racing yacht. On the Banks, good seamanship earned silence. A bungler heard jeers from the whole line.
        - id: ch01-b06
          speaker: fleet_sailor_one
          text: You made it just in time for the caplin!
        - id: ch01-b07
          speaker: fleet_sailor_two
          text: Have you wetted nearly all your salt?
        - id: ch01-b08
          speaker: fleet_sailor_three
          text: Tom Platt! Come eat supper with us tonight!
        - id: ch01-b09
          speaker: narrator
          text: Questions and answers flew between the boats. Men who had met in fog-bound dories traded every scrap of gossip. They already knew how Harvey had been rescued and wanted to know whether he could earn his keep. Young fishermen teased Dan, and Dan answered with the town nicknames they hated most. Portuguese sailors called to Manuel. Even the quiet cook climbed onto the jib-boom and shouted Gaelic to a dark-skinned friend.
        - id: ch01-b10
          speaker: narrator
          text: The crew marked their anchor cable with a buoy. They had to be careful, because the rocky bottom around the Virgin could chafe a cable through and send a schooner drifting. Then their dories joined the crowd a mile away. Behind them, the schooners rocked like mother ducks watching a brood of rude ducklings.
        - id: ch01-b11
          speaker: narrator
          text: Boats knocked together as Harvey rowed into the confusion, and the comments on his stroke made his ears burn. Dialects from Labrador to Long Island rattled around him, mixed with Portuguese, Italian, French, Gaelic, songs, shouts, and brand-new curses. He felt as though every voice aimed at him. For the first time in his life, he was shy among all those wild faces rising and falling in the little boats.
        - id: ch01-b12
          speaker: narrator
          text: A long, breathing swell lifted a row of painted dories. For one moment the boats hung against the sky, with men pointing and shouting. Then mouths, arms, and bare chests vanished, and the next swell raised a fresh line of figures like paper actors in a toy theater. Harvey could only stare.
        - id: ch01-b13
          speaker: dan
          text: Keep your eyes open. When I say dip, you dip. The caplin could school any minute. Tom, where should we set ourselves?
        - id: ch01-b14
          speaker: narrator
          text: Tom Platt pushed, hauled, greeted old friends, warned old enemies, and led the We're Here's dories below the main crowd. Several fishermen began pulling up their anchors so they could take the better position. Then one dory shot south at a tremendous speed. Its fisherman pulled madly at his anchor rope, and laughter burst from every side.
        - id: ch01-b15
          speakers: [fleet_sailor_one, fleet_sailor_two, fleet_sailor_three]
          ensemble: chorus
          text: Give it more rope! Let him run it out!
        - id: ch01-b16
          speaker: harvey
          text: What's happening? Isn't he anchored?
        - id: ch01-b17
          speaker: dan
          text: Oh, he's anchored. His anchor just happens to be moving. A whale caught the rope. Dip, Harve! Here they come!
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: The water clouded, darkened, and burst into showers of tiny silver caplin. Across five or six acres, cod leaped like trout in spring. Behind them, three or four broad gray whales churned the sea into boiling patches.
        - id: ch01-b19
          speaker: narrator
          text: Everyone shouted at once. Men tried to pull their anchors and reach the school, caught their neighbors' ropes, yelled exactly what they thought, and swept their dip-nets through the water. The sea fizzed like fresh soda as cod, men, and whales rushed upon the bait. Dan's net handle nearly knocked Harvey overboard.
        - id: ch01-b20
          speaker: narrator
          text: Through all that uproar, Harvey saw something he would always remember. A whale drove past almost level with the surface. Its small, fixed eye looked as wicked as a circus elephant's, and Harvey insisted that it winked at him. Whales caught the anchor ropes of three more boats and towed them half a mile before shaking free.
        - id: ch01-b21
          speaker: narrator
          text: Then the caplin moved away. Five minutes later, only sinkers splashed, cod flapped, and clubs struck the fish. The fishing was marvelous. Harvey could see whole companies of cod glimmering below. They swam slowly and bit with the same steady rhythm.
        - id: ch01-b22
          speaker: narrator
          text: Bank law allowed only one hook on each line at the Virgin and the Eastern Shoals. Even so, the boats lay so close that the single hooks tangled. Harvey soon found himself arguing with a mild, hairy Newfoundlander on one side and a shouting Portuguese fisherman on the other.
        - id: ch01-b23
          speaker: narrator
          text: Below the surface, the anchor ropes made an even worse snarl. Each man had dropped anchor wherever he pleased, then rowed and drifted around that fixed point. When the fish slowed down, everyone wanted better ground, but one man in three discovered that his rope was tied up with four or five neighbors.
        - id: ch01-b24
          speaker: narrator
          text: Cutting another man's anchor rope was an unspeakable crime on the Banks, yet someone secretly did it three or four times that day. Tom caught a Maine fisherman in the act and knocked him across his gunwale with an oar. Manuel treated a Portuguese countryman the same way. But someone cut Harvey's rope and Penn's. After that, they carried fish back to the We're Here whenever a dory filled.
        - id: ch01-b25
          speaker: narrator
          text: At twilight the caplin schooled again, and the wild noise began all over. At dusk the crew returned and dressed their catch by kerosene light at the edge of the fish pen. The pile was enormous. They nearly fell asleep while working through it.
        - id: ch01-b26
          speaker: narrator
          text: The next day, several boats fished directly above the crown of the Virgin. Harvey looked down at the weeds on that lonely rock, only twenty feet below the surface. Legions of cod marched over the leathery kelp. They all began biting together, and they all stopped together.
        - id: ch01-b27
          speaker: narrator
          text: At noon the fishing went slack, so the dories looked for entertainment. Dan spotted the Hope of Prague coming in. As her boats joined them, someone called out a question.
        - id: ch01-b28
          speaker: fleet_sailor_one
          text: Who's the meanest man in the Fleet?
        - id: ch01-b29
          speakers: [fleet_sailor_one, fleet_sailor_two, fleet_sailor_three]
          ensemble: chorus
          text: Nick Bra-dy!
          emotion: happy
        - id: ch01-b30
          speaker: dan
          text: Who stole all the lampwicks?
        - id: ch01-b31
          speakers: [fleet_sailor_one, fleet_sailor_two, fleet_sailor_three]
          ensemble: chorus
          text: Nick Bra-dy!
          emotion: happy
        - id: ch01-b32
          speaker: fleet_sailor_two
          text: Who boiled the salted bait and called it soup?
        - id: ch01-b33
          speakers: [fleet_sailor_one, fleet_sailor_two, fleet_sailor_three]
          ensemble: chorus
          text: Nick Bra-dy!
          emotion: happy
        - id: ch01-b34
          speaker: narrator
          text: Brady was not especially mean, but that was his reputation, and the Fleet enjoyed it. Then they recognized a Truro man who had once used five or six hooks on one tackle at the Shoals. That made him a scrowger. He had hidden on Georges for six years, but his old title was waiting for him.
        - id: ch01-b35
          speakers: [fleet_sailor_one, fleet_sailor_two, fleet_sailor_three]
          ensemble: chorus
          text: Jim! Oh, Jim! Jim! Oh, Jim! Scrowger Jim!
          emotion: happy
        - id: ch01-b36
          speaker: fleet_sailor_three
          text: The Carrie Pitman's anchor couldn't hold her for one red cent!
        - id: ch01-b37
          speaker: narrator
          text: A fisherman from Beverly had spent all day making up that song and talked about it for weeks afterward. The dories loved it. Then they asked how many beans he had, because even a poet could not have everything his own way.
        - id: ch01-b38
          speaker: narrator
          text: Almost every schooner and every man took a turn. If a cook was dirty or careless, the boats made a song about him and his food. If a schooner carried poor gear, every fault was announced in full. If a man had stolen tobacco from a messmate, the Fleet named him publicly, and his name traveled from one rising swell to the next. They mocked Disko's judgments, which Disko considered infallible. They remembered the market boat Long Jack had sold years before. They sang about Penn's bad luck with dory anchors, Salters's opinions about manure, Manuel's little failures to behave himself ashore, and Harvey's ladylike way of handling an oar. They even sang about Dan's sweetheart, and that made Dan an angry boy. As silver fog folded around them under the sun, the unseen voices sounded like a whole bench of judges passing sentence.
        - id: ch01-b39
          speaker: narrator
          text: The dories wandered, fished, and quarreled until a heavier swell moved under the sea. They spread apart to keep from smashing their sides. Someone warned that the Virgin would break if the swell continued. A reckless Galway man and his nephew denied it. They pulled up their anchor and rowed directly over the rock.
        - id: ch01-b40
          speaker: narrator
          text: Some men begged them to come away. Others dared them to stay. Each smooth-backed roller lifted their dory higher into the mist, then dropped it into sucking, dimpled water. The boat spun around its anchor only a foot or two above the hidden rock. The Fleet watched in uneasy silence until Long Jack rowed behind them and quietly cut their rope.
        - id: ch01-b41
          speaker: long_jack
          text: Can't you hear the rock knocking below you? Row for your miserable lives! Row!
          emotion: fearful
        - id: ch01-b42
          speaker: narrator
          text: The Galway men cursed and tried to argue as they drifted. Then the next swell seemed to stumble. A deep sob rose from the sea and became a roar. The Virgin hurled acres of white, furious foam over the shoal. Every boat cheered Long Jack, and the Galway men said no more.
        - id: ch01-b43
          speaker: dan
          text: Isn't she beautiful? She'll break about every half hour now, unless the swell really builds. Tom, how often does she go when she's working properly?
          emotion: happy
        - id: ch01-b44
          speaker: tom_platt
          text: Every fifteen minutes, exact as a clock. Harve, you've seen the greatest sight on the Banks. Without Long Jack, you'd have seen dead men too.
        - id: ch01-b45
          speaker: narrator
          text: Laughter rose where the fog thickened and the schooners rang their bells. A large bark felt her way out of the mist. Irish voices welcomed her with delighted shouts.
        - id: ch01-b46
          speaker: harvey
          text: Is that another French ship?
        - id: ch01-b47
          speaker: dan
          text: Use your eyes. She's from Baltimore, and she's scared half to death. We'll tease every stick out of her. Bet her captain has never met the Fleet like this before.
          emotion: happy
        - id: ch01-b48
          speaker: narrator
          text: She was a broad black vessel of eight hundred tons. Her mainsail was looped up, and her topsail flapped in the weak wind. No ship looks more feminine than a bark. With her white-and-gold figurehead, this tall, uncertain creature looked like a puzzled woman lifting her skirts to cross a muddy street while bad boys jeered. She knew she was close to the Virgin because she had heard its roar, and she wanted directions.
        - id: ch01-b49
          speaker: fleet_sailor_one
          text: The Virgin? What are you talking about? This is Le Havre on Sunday morning. Go home and sober up!
        - id: ch01-b50
          speaker: fleet_sailor_two
          text: Go home, you turtle! Tell them we're coming!
        - id: ch01-b51
          speakers: [fleet_sailor_one, fleet_sailor_two, fleet_sailor_three]
          ensemble: chorus
          text: There she strikes!
        - id: ch01-b52
          speaker: fleet_sailor_three
          text: Turn hard! Turn for your life! You're right on top of the rock!
        - id: ch01-b53
          speaker: fleet_sailor_one
          text: Hard down! Drop everything!
        - id: ch01-b54
          speaker: fleet_sailor_two
          text: Everybody to the pumps!
        - id: ch01-b55
          speaker: fleet_sailor_three
          text: Lower your jib and pole her off!
        - id: ch01-b56
          speaker: narrator
          text: The captain finally lost his temper and answered the dories in language of his own. Fishing stopped at once so everyone could answer him properly. The Fleet supplied him with many curious facts about his vessel and about the port where she was supposedly headed. Men asked whether he had remembered to insure her. They demanded to know where he had stolen his anchor, since it plainly belonged to the Carrie Pitman. They called the bark a mud scow and accused her of dumping garbage in the sea to frighten away the fish. Several offered to tow her and put the charge on his wife's account. Then one especially bold young fisherman slipped almost beneath her stern.
        - id: ch01-b57
          speaker: fleet_sailor_two
          text: Get moving, Buck!
        - id: ch01-b58
          speaker: narrator
          text: He slapped the bark's stern with his open hand as though she were a horse. Her cook emptied a pan of ashes over him, so he answered by throwing cod heads. The bark's crew fired pieces of galley coal into the dories. The fishermen threatened to climb aboard and shave the tall ship down. They would have warned her instantly if she had been in real danger. But they could see she was safely clear of the Virgin, and they used every moment of their chance. The game ended when the rock spoke again, half a mile to windward. The tormented bark raised every scrap of sail that could draw and went on her way. The dories watched her leave and agreed that all the honors belonged to them.
        - id: ch01-b59
          speaker: narrator
          text: The Virgin roared through the night. In the morning, an angry white-headed sea kept the Fleet waiting. No one launched a dory before ten, when two men from the Day's Eye imagined a calm that was not there. Within a minute, half the boats were bobbing in the steep waves. Disko refused to join such dares and kept the We're Here's crew dressing fish.
        - id: ch01-b60
          speaker: narrator
          text: By evening the weather had grown into a gale. Then the schooner welcomed soaked strangers who were glad to reach any shelter. Harvey and Dan waited by the dory tackles with lanterns while the men stood ready to haul. Everyone watched for the sweeping wave that would make them drop their work and cling to the boat.
        - id: ch01-b61
          speaker: fleet_sailor_one
          text: Dory! Dory coming in!
        - id: ch01-b62
          speaker: narrator
          text: Again and again, they hooked up a half-sunk boat and pulled a drenched man aboard. Soon dories covered the deck and strangers filled the bunks. Five times during their watch, Harvey and Dan sprang for the foregaff and wrapped arms, legs, and even teeth around rope, spar, and wet canvas while a great wave flooded the deck.
        - id: ch01-b63
          speaker: narrator
          text: "The storm kept bringing them strangers. One dory smashed into pieces, and the sea threw its fisherman headfirst onto the deck, opening a cut across his forehead. Near dawn, when the racing seas showed cold white edges in the darkness, another man crawled aboard. He was blue, ghastly, and had a broken hand. Before asking help for himself, he wanted news of his brother. When morning came, seven unexpected guests sat down to breakfast. There was a Swede, a skipper from Chatham, a boy from Hancock in Maine, one man from Duxbury, and three fishermen from Provincetown."
        - id: ch01-b64
          speaker: narrator
          text: The next day the Fleet sorted itself out. Nobody spoke of fear, but everyone ate better as boat after boat reported a full crew. Two Portuguese fishermen and an old Gloucester man had drowned. Many others were bruised or cut. Two schooners had lost their anchors and blown three days' sail south.
        - id: ch01-b65
          speaker: narrator
          text: A man had also died aboard the French bark that once traded tobacco with the We're Here. One wet white morning, she slipped quietly away to deep water with her sails hanging loose. Through Disko's spyglass, Harvey watched an oblong bundle slide over the side. There seemed to be no service. But that night, across black water dusted with stars, the French crew sang a slow hymn.
        - id: ch01-b66
          speakers: [fleet_sailor_one, fleet_sailor_two, fleet_sailor_three]
          ensemble: chorus
          text: The brigantine turns and rolls, and carries me away. Virgin Mary, pray to God for me. Farewell, my homeland. Quebec, farewell.
          emotion: sad
        - id: ch01-b67
          speaker: narrator
          text: Tom Platt visited the French ship because the dead sailor had been his brother as a Freemason. A wave had folded the man over the heel of the bowsprit and broken his back. Then came unusual news. The French crew would auction his belongings because he had no friends in Saint-Malo or Miquelon. They spread everything on the cabin roof, from his red knitted cap to a leather belt with a sheath knife at the back.
        - id: ch01-b68
          speaker: narrator
          text: Dan and Harvey were fishing twenty-fathom water in the Hattie S. They rowed over with the crowd, of course. It was a long pull, and they stayed while Dan bought the knife with its curious brass handle. When they pushed off into rain and a choppy sea, they remembered that neglecting their lines might bring trouble.
        - id: ch01-b69
          speaker: dan
          text: A little warming-up won't hurt us. I'm freezing under these oilskins.
        - id: ch01-b70
          speaker: narrator
          text: They rowed into the heart of a white fog that had dropped without warning.
        - id: ch01-b71
          speaker: dan
          text: There's too much tide here to trust your instincts. Drop the anchor, Harve, and we'll fish until the fog lifts. Put on your heaviest lead. Three pounds isn't too much in this water. Look how she's already pulling tight on her rope.
        - id: ch01-b72
          speaker: narrator
          text: An unseen Bank current stretched the dory hard against its anchor and raised a small curl of water at the bow. They could not see one boat length. Harvey raised his collar and bent over his reel like a tired navigator. Fog no longer frightened him. They fished silently for a while, and the cod bit well. Then Dan drew the sheath knife and tested it against the gunwale.
        - id: ch01-b73
          speaker: harvey
          text: That's a beauty. How did you buy it so cheaply?
        - id: ch01-b74
          speaker: dan
          text: Those Frenchmen have Catholic superstitions. They don't like taking iron that belonged to a dead man. Did you see them step back when I bid?
        - id: ch01-b75
          speaker: harvey
          text: Buying at an auction isn't taking something off a body. It's business.
        - id: ch01-b76
          speaker: dan
          text: We know that, but you can't reason with superstition. That's the advantage of living in a progressive country.
        - id: ch01-b77
          speaker: narrator
          text: Dan began to whistle a homecoming song about Double Thatcher, Eastern Point, and seeing the girls and boys again at anchor off Cape Ann.
        - id: ch01-b78
          speaker: harvey
          text: Then why didn't the man from Eastport bid? He bought the sailor's boots. Isn't Maine progressive?
        - id: ch01-b79
          speaker: dan
          text: Maine? They either don't know enough or don't have enough money to paint their houses. I've seen them. Anyway, that Eastport fellow heard from the French captain that this knife was used on the French coast last year.
        - id: ch01-b80
          speaker: harvey
          text: Used to cut a man? Pass me the club.
        - id: ch01-b81
          speaker: narrator
          text: Harvey hauled in a fish, baited his hook again, and dropped it over.
        - id: ch01-b82
          speaker: dan
          text: It killed him. Once I heard that, I wanted the knife even more.
        - id: ch01-b83
          speaker: harvey
          text: I didn't know that! I'll give you a dollar when I get my wages. No, I'll give you two.
          emotion: surprised
        - id: ch01-b84
          speaker: dan
          text: Truly? You like it that much? Well, I actually bought it to give you. I wanted to see what you thought before I said so. It's yours, Harve. We're dory-mates and all the rest of it. Here, take it.
          emotion: happy
        - id: ch01-b85
          speaker: narrator
          text: Dan held out the knife, belt and all.
        - id: ch01-b86
          speaker: harvey
          text: But Dan, I don't understand why.
        - id: ch01-b87
          speaker: dan
          text: Take it. I don't need it, and I want you to have it.
        - id: ch01-b88
          speaker: harvey
          text: Dan, you're a good man. I'll keep it all my life.
          emotion: happy
        - id: ch01-b89
          speaker: dan
          text: That's good to hear. Now, it looks as if your line has caught on something.
        - id: ch01-b90
          speaker: narrator
          text: Dan laughed pleasantly and changed the subject.
        - id: ch01-b91
          speaker: harvey
          text: Must be tangled. Confound it! It feels like the hook is stuck on rocky bottom, but it's all sand here, isn't it?
        - id: ch01-b92
          speaker: narrator
          text: Harvey tugged, but first he buckled the belt around his waist. The sheath tip clicked against the seat, and the sound delighted him.
        - id: ch01-b93
          speaker: dan
          text: A sulky halibut might pull that way. It isn't rock. Jerk it once or twice. There, it gives. We'd better haul it up and make sure.
        - id: ch01-b94
          speaker: narrator
          text: Together they pulled, fastening the line around a cleat after each turn. The hidden weight rose slowly.
        - id: ch01-b95
          speaker: dan
          text: We've won a prize! Haul!
        - id: ch01-b96
          speaker: narrator
          text: The cry ended in two shrill screams. Out of the sea rose the French sailor buried two days before. Harvey's hook had caught under his right arm. With his arms bound to his sides, the body swayed upright, head and shoulders above the water. It had no face. The boys tumbled over each other into the bottom of the dory and lay there while the body bobbed beside them on the shortened line.
        - id: ch01-b97
          speaker: harvey
          text: The tide brought him. It was only the tide.
          emotion: fearful
        - id: ch01-b98
          speaker: narrator
          text: Harvey's lips shook while his fingers searched for the belt clasp.
        - id: ch01-b99
          speaker: dan
          text: Oh, Harve, hurry! He came for the knife. Give it back to him. Take it off!
          emotion: fearful
        - id: ch01-b100
          speaker: harvey
          text: I don't want it! I can't find the buckle!
          emotion: fearful
        - id: ch01-b101
          speaker: dan
          text: Hurry! He's caught on your line!
          emotion: fearful
        - id: ch01-b102
          speaker: narrator
          text: Harvey forced himself upright. Facing the streaming hair and the head without a face, he freed the belt.
        - id: ch01-b103
          speaker: harvey
          text: He's still caught.
          emotion: fearful
        - id: ch01-b104
          speaker: narrator
          text: Dan opened his own knife and cut the line as Harvey flung the belt far overboard. The body dropped with a plop. Dan rose carefully to his knees, whiter than the fog.
        - id: ch01-b105
          speaker: dan
          text: He came for it. I've seen an old body caught on a trawl before, and it didn't bother me much. But this one came straight to us for his knife.
          emotion: fearful
        - id: ch01-b106
          speaker: harvey
          text: I wish I had never taken it. Then he would have come up on your line.
          emotion: fearful
        - id: ch01-b107
          speaker: dan
          text: I don't know if that would matter. We've both lost ten years of growth from fright. Harve, did you see his head?
          emotion: fearful
        - id: ch01-b108
          speaker: harvey
          text: I'll never forget it. But it couldn't have been meant for us. The tide did it.
          emotion: fearful
        - id: ch01-b109
          speaker: dan
          text: The tide? They sank him six miles south of the Fleet, and now we're two miles from where his ship lies. They weighted him with nine feet of chain.
          emotion: fearful
        - id: ch01-b110
          speaker: harvey
          text: I wonder what he did with that knife on the French coast.
        - id: ch01-b111
          speaker: dan
          text: Something bad. Maybe he has to carry it to Judgment. What are you doing with those fish?
        - id: ch01-b112
          speaker: harvey
          text: Throwing them away.
        - id: ch01-b113
          speaker: dan
          text: Why? We don't have to eat them.
        - id: ch01-b114
          speaker: harvey
          text: I don't care. I stared at his face while I pulled off the belt. Keep your fish if you want. I don't want mine.
          emotion: disgusted
        - id: ch01-b115
          speaker: narrator
          text: Dan said nothing. He threw his fish overboard too.
        - id: ch01-b116
          speaker: dan
          text: Better to be safe. I'd trade a month's pay to see this fog lift. Things move around in fog that never show themselves in clear weather. I'm glad he came through the water instead of walking. He might have walked.
          emotion: fearful
        - id: ch01-b117
          speaker: harvey
          text: Don't say that! We're right above him now. I wish I were safely aboard, even if Uncle Salters was pounding me.
          emotion: fearful
        - id: ch01-b118
          speaker: dan
          text: They'll come looking soon. Hand me the horn.
        - id: ch01-b119
          speaker: narrator
          text: Dan took the tin dinner horn, then stopped before blowing it.
        - id: ch01-b120
          speaker: harvey
          text: Go on. I don't want to sit here all night.
          emotion: fearful
        - id: ch01-b121
          speaker: dan
          text: I'm wondering how he'd take it. A man once told me about a schooner where nobody dared call the dories with a horn. A captain had drowned a boy beside her in a drunken rage five years earlier. After that, the boy would row alongside and call “Dory! Dory!” with the others.
          emotion: fearful
        - id: ch01-b122
          speaker: cook
          text: Dory! Dory!
        - id: ch01-b123
          speaker: narrator
          text: The muffled voice came through the fog. Both boys crouched again, and the horn dropped from Dan's hand.
        - id: ch01-b124
          speaker: harvey
          text: Wait! That's the cook.
          emotion: surprised
        - id: ch01-b125
          speaker: dan
          text: Don't know why I told that fool story. It is the doctor. That's him.
        - id: ch01-b126
          speaker: cook
          text: Dan! Danny! Harvey! Where are you, Harvey?
        - id: ch01-b127
          speakers: [dan, harvey]
          ensemble: duo
          text: We're here!
        - id: ch01-b128
          speaker: narrator
          text: They heard oars before the cook appeared, shining and dripping as he rowed out of the whiteness.
        - id: ch01-b129
          speaker: cook
          text: What has happened? You will get a beating when we are home.
        - id: ch01-b130
          speaker: dan
          text: That's exactly what we need. Anything that feels like home will suit us. We've had some gloomy company.
        - id: ch01-b131
          speaker: narrator
          text: The cook passed them a line while Dan told the story.
        - id: ch01-b132
          speaker: cook
          text: Yes. He came to get his knife.
        - id: ch01-b133
          speaker: narrator
          text: The rocking We're Here had never looked so much like home. Warm cabin light glowed through the fog. Food smelled wonderful forward. Best of all, Disko and the others leaned over the rail, alive and solid, promising a first-class pounding.
        - id: ch01-b134
          speaker: narrator
          text: But the cook understood strategy. Before he let anyone haul up the dories, he told the strongest parts of the tale. As he backed and bumped around the stern, he explained that Harvey was a lucky charm who had destroyed the dead man's bad luck. The boys climbed aboard as uncanny heroes. Instead of beating them for causing trouble, everyone asked questions.
        - id: ch01-b135
          speaker: narrator
          text: Penn gave quite a speech about the foolishness of superstition, but the crew's opinion went against him. They sided with Long Jack instead. Long Jack told the most painful ghost stories he knew, and he kept them going until nearly midnight. Under the spell of those stories, nobody but Penn and Salters used the word idolatry when the cook prepared an offering. He placed a lighted candle on a wooden shingle with a small cake of flour and water and a pinch of salt. Then he floated it behind the schooner to keep the French sailor quiet, in case the man was still restless. Dan had bought the belt, so Dan lit the candle. The cook grunted and whispered charms for as long as the tiny flame could be seen dipping on the water.
        - id: ch01-b136
          speaker: harvey
          text: So, Dan, what happened to progress and Catholic superstition?
        - id: ch01-b137
          speaker: dan
          text: I'm as enlightened as the next man. But when a dead sailor from Saint-Malo scares two poor boys stiff over a thirty-cent knife, the cook can handle it for me. I don't trust foreigners, alive or dead.
        - id: ch01-b138
          speaker: narrator
          text: The next morning everyone but the cook felt embarrassed by the ceremony. They spoke gruffly and worked twice as hard.
        - id: ch01-b139
          speaker: narrator
          text: The We're Here was racing neck and neck with the Parry Norman for the last few loads. The struggle stayed so close that the whole Fleet chose sides and wagered tobacco on the winner. Every hand worked the lines or dressed fish from before dawn until darkness made work impossible. Men fell asleep where they stood. The crew even took the cook from his usual duties and made him pitch fish. Harvey went down into the hold to pass salt, while Dan joined the men dressing the catch on deck.
        - id: ch01-b140
          speaker: narrator
          text: Luck helped when a Parry Norman fisherman fell down the forecastle and sprained his ankle. The We're Here gained ground. Harvey could not understand how one more fish could possibly be squeezed into the hold, but Disko and Tom went on packing and packing. They laid heavy stones from the ballast across the mass to press it down. No matter how full the schooner seemed, Disko could always find room for just one more day's work.
        - id: ch01-b141
          speaker: narrator
          text: Disko never announced when all the salt was wet. At ten one morning, he rolled aft past the cabin and began dragging the big mainsail out of storage. That told the crew what had happened. By noon, the riding sail was down, the mainsail and topsail were raised, and dories came alongside with letters for home. Their fishermen watched the preparations, passed up their mail, loudly called their farewells, and envied the We're Here's good fortune.
        - id: ch01-b142
          speaker: narrator
          text: At last the crew cleared the deck and raised the flag, as the first boat leaving the Banks had the right to do. They lifted anchor and moved. Disko claimed he was giving late letter writers one more chance. In truth, he was sailing a victory lap through the schooners. For the fifth year in a row, the procession showed the Fleet what kind of captain he was.
        - id: ch01-b143
          speaker: narrator
          text: Dan's accordion and Tom Platt's fiddle played the song no crew could sing before every grain of salt was wet.
        - id: ch01-b144
          speakers: [dan, tom_platt]
          ensemble: duo
          text: Send your letters around! All our salt is wetted, and the anchor's off the ground! Bend the mainsail, we're bound for Yankee land, with fifteen hundred quintals caught between old Quereau and Grand!
          emotion: happy
        - id: ch01-b145
          speaker: narrator
          text: The last letters landed on deck wrapped around lumps of coal. Gloucester men shouted messages for wives, sweethearts, and owners. The We're Here finished her musical journey through the Fleet, and her headsails trembled like a hand raised in farewell.
        - id: ch01-b146
          speaker: narrator
          text: Harvey soon learned the difference between the schooner strolling under a riding sail and the schooner driving west by south under full homeward canvas. Even in mild weather, the wheel bit and kicked. He could feel the packed weight of fish heave forward through every surge, and the racing bubbles beside the hull made him dizzy.
        - id: ch01-b147
          speaker: narrator
          text: Disko kept everyone trimming sails. Once they were flat as a racing yacht's, Dan had to tend the big topsail and move it by hand whenever they changed course. In spare moments they pumped out the brine dripping from the fish, because brine could spoil the cargo.
        - id: ch01-b148
          speaker: narrator
          text: With no fishing to do, Harvey had time to see the sea from a different point of view. The low-sided schooner lived in the closest possible company with the water. They saw very little of the horizon except at the top of a swell. Most of the time she elbowed, fidgeted, and worked steadily through gray, blue-gray, or black hollows. Lines of shivering foam crossed those hollows in every direction. Sometimes she rubbed herself gently along the side of a larger hill of water, as though she were saying, “Surely you wouldn't hurt me. I'm only the little We're Here.” Then she slipped away with a soft chuckle until another hill stood in her path.
        - id: ch01-b149
          speaker: narrator
          text: Even the dullest person would notice such things after watching them for long days, and Harvey was far from dull. He began to understand the dry chorus made by wave tops folding over with an endless tearing sound. He enjoyed the hurry of winds crossing open spaces and herding purple-blue cloud shadows ahead of them. He watched red sunrise heave itself over the sea. He saw morning mist folded and packed away, one wall after another withdrawing across white floors of water. He knew the salty glare of noon, the touch of rain on thousands of dead-flat square miles, and the cold darkness that spread at the end of day. Moonlight put a million wrinkles on the water. The jib-boom poked solemnly at the low stars, and Harvey went below to ask the cook for a doughnut.
        - id: ch01-b150
          speaker: narrator
          text: The finest fun came when Harvey and Dan were trusted at the wheel together, with Tom Platt close enough to call. The We're Here tucked her lower rail down against the crashing blue water. Spray held a little homemade rainbow in an unbroken arch above the windlass. The jaws of the booms complained against the masts, the sheets creaked under strain, and the full sails roared. Whenever the schooner slid into a hollow, she trampled and stumbled like a woman who had caught her feet in her own silk dress. Then she climbed out again with the lower half of her jib soaked through, reaching and peering ahead for the two tall lights on Thatcher's Island.
        - id: ch01-b151
          speaker: narrator
          text: They sailed out of the cold gray water of the Banks. Lumber ships passed on their way toward Quebec through the Straits of Saint Lawrence. Salt brigs from Jersey came up from Spain and Sicily. Off Artimon Bank, a friendly northeast wind caught the We're Here and pushed her within sight of the eastern light on Sable Island. That was not a place where Disko cared to linger. The wind stayed with them past Western and Le Havre until they reached the northern edge of Georges. From there, they found the deeper water, freed the schooner to run, and went on merrily toward home.
        - id: ch01-b152
          speaker: dan
          text: Hattie's pulling us home on a string. Hattie and Ma. Next Sunday you'll pay a boy to splash your windows so you can fall asleep. You'll stay with us until your family comes, won't you? Know the best thing about reaching shore?
          emotion: happy
        - id: ch01-b153
          speaker: harvey
          text: A hot bath?
        - id: ch01-b154
          speaker: narrator
          text: Dried spray had turned Harvey's eyebrows white.
        - id: ch01-b155
          speaker: dan
          text: That's good, but a nightshirt is better. I've dreamed about nightshirts ever since we raised the mainsail. You can wiggle your toes in one. Ma will have a new one washed soft for me. It's home, Harve. You can smell it. We're reaching the edge of a hot spell now, and I can smell bayberries. Maybe we'll be in for supper. Port a little.
          emotion: happy
        - id: ch01-b156
          speaker: narrator
          text: The wind weakened, and the uncertain sails flapped and lurched in the heavy air. Around the schooner, the deep sea smoothed into an oily blue surface. The crew whistled for a wind, but no wind answered. Instead, rain came in sharp rods. It bubbled and drummed against the deck, with the thunder and lightning of mid-August close behind it.
        - id: ch01-b157
          speaker: narrator
          text: With land plainly visible, the boys lay barefoot and bare-armed on deck, naming what they would order for their first meal ashore. A Gloucester swordfish boat drifted near. A man stood in the little pulpit on her bowsprit, rain slicking his bare head, and waved his harpoon.
        - id: ch01-b158
          speaker: swordfish_sailor
          text: All's well! Wouverman is waiting for you, Disko. What news do you have from the Fleet?
          emotion: happy
        - id: ch01-b159
          speaker: narrator
          text: "Disko shouted the news of the Fleet and passed on. The wild summer storm pounded directly above them. Lightning flickered along the capes in four different directions at once. Every flash made a blinding photograph of Gloucester Harbor. Harvey saw the low circle of hills, Ten Pound Island, the fish sheds, and the broken line of house roofs. Every spar and every buoy sprang into sight. Then the picture vanished, only to return a dozen times each minute. The We're Here crept inward on the half-risen tide while the whistling buoy moaned and mourned behind her."
        - id: ch01-b160
          speaker: narrator
          text: At last the storm faded into separate blue-white blades of lightning, followed by one tremendous roar. The air trembled under the stars, then settled toward silence.
        - id: ch01-b161
          speaker: disko
          text: The flag! Look at the flag!
        - id: ch01-b162
          speaker: narrator
          text: Disko pointed overhead.
        - id: ch01-b163
          speaker: long_jack
          text: What about it?
        - id: ch01-b164
          speaker: disko
          text: Otto. Put it at half-mast. They can see us from shore now.
          emotion: sad
        - id: ch01-b165
          speaker: long_jack
          text: I had clean forgotten. He has no family in Gloucester, does he?
        - id: ch01-b166
          speaker: disko
          text: There's the girl he meant to marry this fall.
          emotion: sad
        - id: ch01-b167
          speaker: long_jack
          text: May Mary have pity on her.
          emotion: sad
        - id: ch01-b168
          speaker: narrator
          text: Long Jack lowered the little flag for Otto, swept overboard in a gale off Le Havre three months earlier.
        - id: ch01-b169
          speaker: narrator
          text: Disko wiped the wet from his eyes and guided the We're Here toward Wouverman's wharf. Every order he gave came in a whisper. The schooner swung around moored tugboats while night watchmen called from the ends of piers black as ink. Over and above the darkness and the mystery of that quiet procession, Harvey felt the land closing around him again. Thousands upon thousands of people lay asleep nearby. The earth gave off its familiar smell after rain. In a freight yard, a switching engine seemed to cough to itself. All of it made Harvey's heart pound and dried his throat while he waited beside the foresheet.
        - id: ch01-b170
          speaker: narrator
          text: They heard the anchor watch snoring aboard a lighthouse tug. Then the schooner eased her nose into a pocket of darkness where one lantern glimmered on either side. Someone woke with a grunt and threw down a rope. The crew made fast to a silent wharf. Great sheds with iron roofs stood on both sides, filled with warm emptiness. After all the motion and noise of the Banks and the voyage home, the We're Here lay there without a sound.
        - id: ch01-b171
          speaker: narrator
          text: Harvey sat beside the wheel and sobbed as if his heart would break. A tall woman who had been waiting on a weighing scale dropped into the schooner and kissed Dan once on the cheek. She was his mother. Lightning had shown her the We're Here coming home.
        - id: ch01-b172
          speaker: narrator
          text: At first, Mrs. Troop took no notice of Harvey. She waited until he had recovered a little and Disko had explained who he was and how he had come aboard. Then Harvey went with the family to Disko's house while dawn began to break. The telegraph office was still closed, so he could not yet send a message to his own people. During those waiting hours, Harvey Cheyne may have been the loneliest boy in all America. Yet one curious thing comforted him. Neither Disko nor Dan thought any worse of him because he had sat beside the wheel and cried.
        - id: ch01-b173
          speaker: narrator
          text: Wouverman was not ready to accept the price Disko demanded for the catch. Disko knew the We're Here had beaten every other Gloucester boat home by at least a week, so he calmly gave the buyer a few days to swallow the price. With business waiting, the crew played around the streets. Long Jack stopped the Rocky Neck trolley on principle and kept it stopped until the conductor agreed to let him ride without paying.
        - id: ch01-b174
          speaker: narrator
          text: Dan walked around his family with his freckled nose in the air, stuffed full of mystery and acting very important.
        - id: ch01-b175
          speaker: disko
          text: Dan, if you keep behaving this way, I'll have to knock some sense into you. Since we came ashore, you've been far too fresh.
        - id: ch01-b176
          speaker: uncle_salters
          text: If he were mine, I'd do it right now.
        - id: ch01-b177
          speaker: narrator
          text: Salters and Penn were boarding with the Troops. Dan shifted around the backyard with his accordion, ready to jump the fence if anyone came for him.
        - id: ch01-b178
          speaker: dan
          text: Dad, keep your own opinion if you like, but remember your own son warned you. It won't be my fault when you find out you're wrong. I'll be right here to watch. And Uncle Salters, Pharaoh's chief butler was nothing beside you. Just wait. You'll be plowed under like your own clover, while Dan Troop flourishes like a green bay tree because he didn't cling to his own opinion.
        - id: ch01-b179
          speaker: narrator
          text: Disko sat smoking with all the dignity of a man ashore. Beautiful carpet slippers covered his feet.
        - id: ch01-b180
          speaker: disko
          text: You're getting as crazy as poor Harve. You two keep giggling, squeezing your eyes at each other, and kicking under the table. There's no peace in this house.
        - id: ch01-b181
          speaker: dan
          text: There's going to be much less peace for some people. Wait and see.
        - id: ch01-b182
          speaker: narrator
          text: Dan and Harvey rode the trolley to East Gloucester, tramped through bayberry bushes to the lighthouse, and lay on the big red rocks laughing until they were hungry. Harvey had shown Dan a telegram. They had sworn to keep quiet until the surprise exploded.
        - id: ch01-b183
          speaker: dan
          text: Harvey's family? They can't amount to much, or we'd have heard from them already. His father runs some kind of store out West. Maybe he'll give you as much as five dollars, Dad.
        - id: ch01-b184
          speaker: uncle_salters
          text: That's exactly what I told you. Dan, stop spraying your supper everywhere.
