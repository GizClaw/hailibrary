  chapters:
    - id: ch01
      title: The King's Demand
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Conall Yellowclaw was a sturdy tenant in Erin, and he had three sons. In those days, a king ruled each fifth of the land. One day, Conall's sons fought with the sons of the king who lived nearby. Conall's boys won the fight, but they killed the king's eldest son.
        - id: ch01-b02
          speaker: narrator
          text: The king sent a message summoning Conall. When Conall came before him, the king demanded to know why his sons had sprung upon the princes and fought them until the eldest was killed. Yet even in his anger, the king saw that pursuing Conall for revenge would leave him no better off. So he offered Conall another choice.
        - id: ch01-b03
          speaker: king_erin
          text: Bring me the brown horse that belongs to the king of Lochlann. If you and your sons can do that, I will spare all three of them.
        - id: ch01-b04
          speaker: conall
          text: Why should I not do you this service, even if my sons' lives were not in danger? What you ask is hard. Still, either my sons and I will lose our lives, or I will give you what you want.
        - id: ch01-b05
          speaker: narrator
          text: Conall left the king and went home, deeply troubled. That night, when he lay down, he told his wife what the king had demanded. She grieved because he had to leave her, and because she did not know whether she would ever see him again.
        - id: ch01-b06
          speaker: conall_wife
          text: Oh, Conall, why didn't you let the king do as he wished with our sons? Now you must go away too, and I may never see you again.
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: The next morning, Conall rose and made himself and his three sons ready for the road. They set out toward Lochlann. They made no stop on the journey, but tore on across the ocean until at last they reached that country. Once they stood on its shore, none of them knew what they should do next.
        - id: ch01-b08
          speaker: conall
          text: Stay close. We will look for the house of the king's miller.
        - id: ch01-b09
          speaker: narrator
          text: The miller welcomed them into his house and asked them to spend the night. Conall told him about the fight, the dead prince, and the price the king of Erin had placed on his sons' lives. Only the brown horse of Lochlann would satisfy him.
        - id: ch01-b10
          speaker: conall
          text: If you will help me find a way to get that horse, I promise I will repay your kindness.
        - id: ch01-b11
          speaker: miller
          text: You have come after a difficult prize. The king cares so much for that horse that you will never get it unless you steal it. But if you can devise a way, I will keep your secret.
        - id: ch01-b12
          speaker: conall
          text: You work for the king every day. What if you and your helpers put my sons and me inside five sacks of bran?
        - id: ch01-b13
          speaker: miller
          text: That is not a bad plan at all.
    - id: ch02
      title: The Brown Horse
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The miller gave the order, and his helpers hid Conall and his sons in five sacks. The king's stablemen came for the bran, carried the sacks away, and emptied them in front of the horses. Then the men locked the stable and left.
        - id: ch02-b02
          speaker: narrator
          text: Conall and his sons rose from the bran and prepared to seize the brown horse, but Conall stopped them before they laid a hand on him. They had found a way into the stable, but getting out again would be hard. Before touching the horse, they must dig five hiding holes. Then, if anyone heard them and came to search, each man would have a place to disappear. They made the holes first. Only then did they reach for the horse.
        - id: ch02-b03
          speaker: narrator
          text: The brown horse was barely broken. It began making a terrible noise, and the king heard it from inside.
        - id: ch02-b04
          speaker: king_lochlann
          text: That must be my brown horse. Go and see what is troubling him.
        - id: ch02-b05
          speaker: narrator
          text: As the stablemen approached, Conall and his sons slipped into their holes. The men searched among the horses but found nothing wrong. They reported this to the king, and he sent them back to their beds.
        - id: ch02-b06
          speaker: narrator
          text: When enough time had passed, Conall and his sons tried again. This time the horse made seven times as much noise as before. The king sent his men out once more.
        - id: ch02-b07
          speaker: king_lochlann
          text: Something is certainly bothering that brown horse. This time, search carefully all around him.
        - id: ch02-b08
          speaker: narrator
          text: Again the four men hid. The stablemen rummaged everywhere and found nothing. When they returned with the same report, the king could hardly believe it.
        - id: ch02-b09
          speaker: king_lochlann
          text: This is a marvel to me. Go back to bed. If I hear the horse again, I will come out myself.
        - id: ch02-b10
          speaker: narrator
          text: Once the stablemen were gone, Conall and his sons made a third attempt. One of the sons caught the horse, and the animal made more noise than ever.
        - id: ch02-b11
          speaker: king_lochlann
          text: I have had enough of this. Someone must be troubling my brown horse.
        - id: ch02-b12
          speaker: narrator
          text: The king rang his bell in haste. He sent his waiting-man to call the stablemen, and this time the king went with them. Conall and his sons saw the company coming and hurried back into their holes.
        - id: ch02-b13
          speaker: narrator
          text: The king was wary. He studied the place where the horses had been making such a noise.
        - id: ch02-b14
          speaker: king_lochlann
          text: Take care. There are men inside this stable. We must find some way to reach them.
        - id: ch02-b15
          speaker: narrator
          text: The king examined the floor, followed the men's tracks, and discovered every hiding place. He had the four intruders brought up from their holes. Conall was no stranger in Lochlann. Everyone knew him as a valued tenant of the king of Erin, and the king stared at him in surprise.
        - id: ch02-b16
          speaker: king_lochlann
          text: Conall, can it truly be you?
          emotion: surprised
        - id: ch02-b17
          speaker: conall
          text: It is indeed, my king. Necessity brought me here. I place myself under your pardon, your honor, and your mercy.
        - id: ch02-b18
          speaker: narrator
          text: Conall explained everything. Unless he carried the brown horse back to Erin, his three sons would be put to death.
        - id: ch02-b19
          speaker: conall
          text: I knew you would never give me the horse merely because I asked. So I came here intending to steal him.
        - id: ch02-b20
          speaker: king_lochlann
          text: Very well, Conall. Come inside.
        - id: ch02-b21
          speaker: narrator
          text: The king ordered his watchmen to keep Conall's sons under guard, but also to give them food. For the rest of that night, a double watch stood over the three young men. Their father remained in the king's power. Then the king turned to Conall and spoke of what morning would bring.
        - id: ch02-b22
          speaker: king_lochlann
          text: Have you ever faced anything harder than watching all three of your sons hanged tomorrow? You have appealed to my goodness and mercy, and you say necessity drove you. I cannot hang you. Tell me of a time when you were in a danger as great as this, and I will spare your youngest son.
        - id: ch02-b23
          speaker: conall
          text: I can tell you of a time when my danger was just as great.
    - id: ch03
      title: The Cats in the Bothy
      blocks:
        - id: ch03-b01
          speaker: conall
          text: I was only a young lad then. My father owned a great deal of land, with whole fields of cattle that were a year old. One of his cows had just given birth, and he told me to go out and bring her home. I found the cow and started back with both her and the newborn calf. Before we reached home, a shower of snow came down around us.
        - id: ch03-b02
          speaker: conall
          text: We sheltered in the herdsman's bothy and brought the cow and calf inside while the shower passed. But then eleven cats came in, led by a huge, one-eyed, fox-colored cat who served as their chief bard. I did not like their company one bit.
        - id: ch03-b03
          speaker: head_cat
          text: Begin the music! Why sit there silently? Sing a song for Conall Yellowclaw.
        - id: ch03-b04
          speaker: conall
          text: I was astonished that even those cats knew my name. They sang their song, and then their chief demanded payment from me.
        - id: ch03-b05
          speaker: head_cat
          text: Now, Conall, give the cats their reward for singing to you.
        - id: ch03-b06
          speaker: conall
          text: I have no reward for you. If you want one, go down there and take that calf.
        - id: ch03-b07
          speaker: conall
          text: The words were hardly out of my mouth before all twelve cats rushed down and attacked the calf. There were too many of them, and the poor creature did not last long. The one-eyed chief bard immediately ordered the others to begin again and make another song for Conall Yellowclaw. I wanted neither the cats nor their music, but the eleven others came crowding back up and sang it to me anyway.
        - id: ch03-b08
          speaker: head_cat
          text: Pay them for that song as well.
        - id: ch03-b09
          speaker: conall
          text: I am tired of you and all these rewards. I have nothing else to give you unless you take the cow down there.
        - id: ch03-b10
          speaker: conall
          text: They fell upon the cow, and she did not last long either. Once more the chief told them to sing for Conall Yellowclaw. By then I knew they were bad companions, and I cared nothing for their music. Still, they sang and gathered around their leader.
        - id: ch03-b11
          speaker: head_cat
          text: Now pay them their reward.
        - id: ch03-b12
          speaker: conall
          text: I have no reward left for you.
        - id: ch03-b13
          speaker: conall
          text: At that, every cat began to yowl. I leaped through a turf window at the back of the bothy and ran as hard as I could into the woods. I was young, swift, and strong. When I heard the cats rushing after me, I climbed the tallest tree I could find, one with a thick crown, and hid as well as I could.
        - id: ch03-b14
          speaker: conall
          text: The cats searched all through the woods. They could not find me, and at last they grew tired and began talking of turning back. But their one-eyed commander would not go.
        - id: ch03-b15
          speaker: head_cat
          text: You may have missed him with your two eyes, but I have only one, and I can see the rascal up in that tree.
        - id: ch03-b16
          speaker: conall
          text: One cat climbed toward me. When it came close, I drew my weapon and killed it.
        - id: ch03-b17
          speaker: head_cat
          text: I will not lose my company like this! Gather around the tree and dig up the roots. Bring that villain down to the ground.
          emotion: angry
        - id: ch03-b18
          speaker: conall
          text: The cats dug around the trunk. When they cut the first branching root, the tree shuddered as if it were about to fall. I cried out, and no wonder.
        - id: ch03-b19
          speaker: conall
          text: A priest nearby was digging with ten men. He heard me and knew someone was in terrible danger.
        - id: ch03-b20
          speaker: priest
          text: That was a man crying out in extremity. I must answer him.
        - id: ch03-b21
          speaker: wise_digger
          text: Wait until we hear the cry again.
        - id: ch03-b22
          speaker: conall
          text: The cats dug wildly and broke a second root. I shouted again, and it was no weak cry.
        - id: ch03-b23
          speaker: priest
          text: There is no doubt now. A man is in desperate need. Let us go.
        - id: ch03-b24
          speaker: conall
          text: The priest and his ten men made ready and started toward me. Meanwhile, the cats swarmed over the ground beneath the tree and broke through a third root. The whole tree leaned over onto its elbow, and I gave a third shout. The strong men hurried at the sound. When they saw how the cats were bringing down the tree, they went at them with their spades. The men struck at the cats, the cats struck back, and the fight continued until the cats finally turned and ran.
        - id: ch03-b25
          speaker: conall
          text: I stayed where I was until the last cat had disappeared. Then I climbed down and went home. That was the hardest danger I had ever known. To be torn apart by those cats seemed worse than being hanged tomorrow by the king of Lochlann.
        - id: ch03-b26
          speaker: king_lochlann
          text: Oh, Conall, you have no shortage of words. Your tale has saved your youngest son. Tell me of an even harder danger, and I will spare your second son as well.
        - id: ch03-b27
          speaker: conall
          text: If you promise me that, I will tell you of a time when I was in even greater danger than I am in your prison tonight.
        - id: ch03-b28
          speaker: king_lochlann
          text: Let us hear it.
    - id: ch04
      title: The Giant and the Ring
      blocks:
        - id: ch04-b01
          speaker: conall
          text: I was still quite young when I went hunting along my father's land beside the sea. That shore was a rough place, broken by rocks, caves, and deep cracks in the ground. As I walked along the top of it, I saw what looked like smoke rising between two rocks. I kept staring at the smoke and wondering what could be beneath me. Because I was looking at that instead of watching my feet, I suddenly fell.
        - id: ch04-b02
          speaker: conall
          text: Thick heather covered the bottom, so I broke neither skin nor bone. Yet I could see no way out. I looked up at the place where I had fallen and thought I would never reach it. It was terrible to imagine dying down there.
        - id: ch04-b03
          speaker: conall
          text: Then I heard a great clattering. A huge giant appeared with two dozen goats and a buck leading them. He tied the goats and came toward me.
        - id: ch04-b04
          speaker: cave_giant
          text: Hao! Conall, my knife has waited a long time in its sheath for your tender flesh.
        - id: ch04-b05
          speaker: conall
          text: Tearing me apart will do you little good. I would make only one meal for you. But I see you have just one eye. I am a skilled healer, and I can restore the sight of the other.
        - id: ch04-b06
          speaker: conall
          text: The giant dragged his great cauldron onto the fire. I told him how to heat the water so I could cure his blind eye. I twisted heather into a scrubber and stood him upright in the cauldron. Then I worked on his good eye, pretending that this would bring sight to the other. By the end, both eyes were equally blind. Spoiling a sound eye was much easier than healing the other one.
        - id: ch04-b07
          speaker: conall
          text: When he realized he could not see even a glimmer, I told him I would escape in spite of him. He sprang straight out of the hot water and planted himself across the mouth of the cave. He swore he would have revenge for the sight I had taken from him. There was no way past his great body. I had to stay crouched inside for the whole length of the night, holding my breath whenever he listened so he could not discover where I was hiding.
        - id: ch04-b08
          speaker: cave_giant
          text: Are you sleeping? Wake up and let my goats out.
        - id: ch04-b09
          speaker: conall
          text: Morning birds had told him daylight had come. I killed the buck, and the giant heard enough to grow suspicious.
        - id: ch04-b10
          speaker: cave_giant
          text: I believe you are killing my buck.
        - id: ch04-b11
          speaker: conall
          text: I am not. The ropes are tied so tightly that it takes me a long time to loosen them.
        - id: ch04-b12
          speaker: conall
          text: I released the goats one at a time while I skinned the buck. The giant stroked each animal as it passed.
        - id: ch04-b13
          speaker: cave_giant
          text: There you are, my shaggy white goat. You can see me, though I cannot see you.
        - id: ch04-b14
          speaker: conall
          text: Before the last goat went out, I had removed the buck's hide in one piece, like a bag. I put my legs into its hind legs, my hands into its forelegs, and my head beneath its head and horns. Then I went toward the entrance, hoping the giant would mistake me for his buck.
        - id: ch04-b15
          speaker: cave_giant
          text: There you are, my handsome buck. You can see me, though I cannot see you.
        - id: ch04-b16
          speaker: conall
          text: His hand passed over me, and I got outside. When I saw the world around me again, joy swept through me. I threw off the hide and called back to him.
        - id: ch04-b17
          speaker: conall
          text: I have escaped in spite of you!
          emotion: happy
        - id: ch04-b18
          speaker: cave_giant
          text: Aha! So this is what you have done to me. Since you were strong enough to escape, I will give you a ring. Keep it, and it will bring you good fortune.
        - id: ch04-b19
          speaker: conall
          text: I will not take it from your hand. Throw it over here, and I will carry it away.
        - id: ch04-b20
          speaker: conall
          text: He threw the ring onto level ground. I picked it up and slipped it onto my finger.
        - id: ch04-b21
          speaker: cave_giant
          text: Does the ring fit you?
        - id: ch04-b22
          speaker: conall
          text: It does.
        - id: ch04-b23
          speaker: cave_giant
          text: Ring, where are you?
        - id: ch04-b24
          speaker: narrator
          text: The ring answered from Conall's hand, revealing exactly where he stood.
        - id: ch04-b25
          speaker: magic_ring
          text: I am here.
        - id: ch04-b26
          speaker: conall
          text: The giant moved toward the speaking ring, and I knew I was in worse danger than ever. I drew my dirk, cut off the finger that wore it, and hurled finger and ring far into the deep water of the loch.
        - id: ch04-b27
          speaker: cave_giant
          text: Ring, where are you?
        - id: ch04-b28
          speaker: narrator
          text: Though it now lay on the bed of the deep water, the ring answered him again.
        - id: ch04-b29
          speaker: magic_ring
          text: I am here.
        - id: ch04-b30
          speaker: conall
          text: The giant leaped after the voice and plunged into the sea. Watching him drown pleased me as much as if you had granted my life and the lives of my two remaining sons, with no more hardship laid upon me.
        - id: ch04-b31
          speaker: conall
          text: After the giant drowned, I went back into the cave. I took all his gold and silver and carried it home. My people rejoiced when I arrived. And if you need proof, look at my hand. The finger is gone.
        - id: ch04-b32
          speaker: king_lochlann
          text: Indeed, Conall, you are both wordy and wise. I can see the missing finger. You have saved two sons. Now tell me of a danger harder than watching your eldest hanged tomorrow, and I will spare him too.
    - id: ch05
      title: The Woman and the Child
      blocks:
        - id: ch05-b01
          speaker: conall
          text: Later, my father found me a wife, and I married. One day I went hunting beside the sea. I saw an island in the middle of the loch. Nearby lay a boat with a rope at its bow, another at its stern, and many precious things inside.
        - id: ch05-b02
          speaker: conall
          text: I leaned into the boat, hoping to get some of those treasures. One foot was aboard and one remained on land. But when I raised my head, the boat was already in the middle of the loch. It did not stop until it reached the island.
        - id: ch05-b03
          speaker: conall
          text: The moment I stepped ashore, the boat returned by itself to the very place it had left. It had carried me over, but it gave me no way back. I did not know what to do. The island held no food for me, no clothing, and no sign of a house anywhere. I climbed to the top of a hill to search the country. Beyond it, I came down into a glen and saw a hollow at the bottom.
        - id: ch05-b04
          speaker: conall
          text: At the bottom of a hollow, I saw a woman holding a naked baby on her knee. A knife was in her hand. She tried to put it to the baby's throat, but the child laughed in her face. The woman began to cry and threw the knife behind her.
        - id: ch05-b05
          speaker: conall
          text: I knew I was close to an enemy and far from every friend, but I called out to her.
        - id: ch05-b06
          speaker: conall
          text: What are you doing here?
        - id: ch05-b07
          speaker: island_woman
          text: What brought you to this place?
        - id: ch05-b08
          speaker: conall
          text: I told her exactly how the boat had carried me there.
        - id: ch05-b09
          speaker: island_woman
          text: Then you came here just as I did.
        - id: ch05-b10
          speaker: conall
          text: She showed me how to enter the hollow where she was hiding. Once I joined her, I asked why she had held the knife to her child's neck.
        - id: ch05-b11
          speaker: island_woman
          text: I must cook my baby for the giant who lives here. If I do not, my own life will end as well.
          emotion: fearful
        - id: ch05-b12
          speaker: conall
          text: Just then, we heard the giant's footsteps coming toward us.
        - id: ch05-b13
          speaker: island_woman
          text: What can I do? What can I do?
          emotion: fearful
        - id: ch05-b14
          speaker: conall
          text: I climbed into the cauldron. By good fortune, it was not yet hot, and I had only just hidden myself when the brute came inside.
        - id: ch05-b15
          speaker: island_giant
          text: Have you boiled that youngster for me?
        - id: ch05-b16
          speaker: island_woman
          text: He is not ready yet.
        - id: ch05-b17
          speaker: conall
          text: Mammy, Mammy, I am boiling in here!
        - id: ch05-b18
          speaker: narrator
          text: The giant roared with laughter, crying, “Hai, haw, hogaraich!” Then he piled more wood beneath the cauldron.
        - id: ch05-b19
          speaker: conall
          text: I became certain I would be scalded before I could escape. But fortune helped me again, for the brute fell asleep beside the cauldron. Even so, its hot bottom had already burned me.
        - id: ch05-b20
          speaker: conall
          text: When the woman saw that the giant was asleep, she quietly put her mouth to the hole in the lid and asked whether I was still alive. I told her I was. Then I pushed my head upward. The opening in the lid was large enough for my head to pass through easily, and at first the rest of me followed. Everything went well until I tried to pull my hips through. They stuck fast. I forced myself onward, left the skin of my hips behind, and at last fell free of the cauldron.
        - id: ch05-b21
          speaker: conall
          text: Once I was free of the cauldron, I had no idea what to do next. The woman told me that no weapon could kill the giant except his own.
        - id: ch05-b22
          speaker: conall
          text: I crept over and began pulling at the giant's own spear. Even asleep, the brute made the task nearly impossible. Each time he drew a breath in, the force pulled me toward him, and I thought I would be dragged right down his throat. Each time he breathed out, I was blown backward just as far. I held on through every breath. After all that trouble, little by little, I finally worked the spear loose from him.
        - id: ch05-b23
          speaker: conall
          text: Then I was like a man beneath a bundle of straw in a high wind. I could barely control the weapon. The giant was fearful to look at, with one eye in the center of his face, and I had no desire to fight such a creature.
        - id: ch05-b24
          speaker: conall
          text: I drew back the spear as well as I could and drove its point into his eye. He jerked up his head, striking the other end against the roof of the cave. The spear passed straight through the back of his head, and he fell down cold and dead. You may be sure, my king, that I was filled with joy.
        - id: ch05-b25
          speaker: conall
          text: The woman and I left the cave and went out onto clear, open ground. We stayed there through the night. Afterward, I went looking for the boat that had brought me to the island. I found it, and none of the precious cargo inside had been taken away. The boat carried the woman, her baby, and me back across the water. I brought them safely onto dry land, and then I returned to my own home.
    - id: ch06
      title: The Life Conall Saved
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: All this time, the king of Lochlann's mother had been tending a fire nearby. She had listened closely as Conall told the part about the woman and her child.
        - id: ch06-b02
          speaker: queen_mother
          text: Were you truly the man who was there?
        - id: ch06-b03
          speaker: conall
          text: Yes. I was that man.
        - id: ch06-b04
          speaker: queen_mother
          text: Oh! I was that woman, and the king is the child whose life you saved. It is you we must thank for his life.
          emotion: surprised
        - id: ch06-b05
          speaker: narrator
          text: Then joy filled them all.
        - id: ch06-b06
          speaker: king_lochlann
          text: Conall, you have endured great hardships. The brown horse is yours now, along with a sack filled with the finest treasures in my treasury.
    - id: ch07
      title: The Feast at Home
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: They rested that night. Conall rose early, but the queen mother had risen even earlier to prepare everything. Conall received the brown horse and a sack full of gold, silver, and precious stones. Then he and his three sons left Lochlann and returned to the glad realm of Erin.
        - id: ch07-b02
          speaker: narrator
          text: Conall left the treasure at his house and took the brown horse to the king. From that day on, the two men were good friends.
        - id: ch07-b03
          speaker: narrator
          text: At last, Conall went home to his wife. Together they prepared a feast, and oh, son and brother, that was a feast if ever there was one.
