audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    conall:
      display_name: 黄爪康纳尔
      tts:
        delivery: 坚毅机敏，讲述往事时生动而自信
        timbre: 粗犷温厚
        pace: 适中
        pitch: 中低音
    erin_king:
      display_name: 爱尔兰国王
      tts:
        delivery: 威严克制，话语中带着审断的分量
        timbre: 浑厚清晰
        pace: 稳健
        pitch: 低音
    wife:
      display_name: 康纳尔的妻子
      tts:
        delivery: 深情忧虑，悲伤中带着直率的责问
        timbre: 柔和微哑
        pace: 稍慢
        pitch: 中音
    miller:
      display_name: 磨坊主
      tts:
        delivery: 谨慎务实，说话直截了当
        timbre: 朴实干净
        pace: 适中
        pitch: 中音
    lochlann_king:
      display_name: 洛赫兰王
      tts:
        delivery: 警觉威严，也欣赏胆识与智慧
        timbre: 深沉有力
        pace: 从容
        pitch: 低音
    head_cat:
      display_name: 独眼大猫
      tts:
        delivery: 狡猾专横，号令时尖锐凶狠
        timbre: 粗哑刺耳
        pace: 明快
        pitch: 中低音
    priest:
      display_name: 神父
      tts:
        delivery: 正直果断，听见求救便急于相助
        timbre: 稳重洪亮
        pace: 适中
        pitch: 中低音
    wise_man:
      display_name: 聪明的挖地人
      tts:
        delivery: 审慎冷静，先辨明情形再行动
        timbre: 清楚朴实
        pace: 适中
        pitch: 中音
    giant_one:
      display_name: 洞穴巨人
      tts:
        delivery: 残忍自负，受骗后暴躁凶恶
        timbre: 低沉轰鸣
        pace: 缓慢
        pitch: 低音
    ring:
      display_name: 魔戒
      tts:
        delivery: 机械般忠实回应召唤
        timbre: 清脆空洞
        pace: 缓慢
        pitch: 高音
    woman:
      display_name: 岛上的女人
      tts:
        delivery: 惊恐疲惫，绝境中仍护念孩子
        timbre: 柔弱清晰
        pace: 稍快
        pitch: 中高音
    giant_two:
      display_name: 岛上巨人
      tts:
        delivery: 凶残贪食，笑声粗野怪诞
        timbre: 粗重震耳
        pace: 缓慢
        pitch: 低音
    queen_mother:
      display_name: 洛赫兰王太后
      tts:
        delivery: 年长慈爱，认出恩人时激动真挚
        timbre: 温暖苍老
        pace: 稍慢
        pitch: 中音
  chapters:
    - id: ch01
      title: 棕马与三条性命
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 黄爪康纳尔是爱尔兰一个强健的佃农，有三个儿子。那时，爱尔兰每片领地各有一位国王。一天，康纳尔的儿子们和附近国王的孩子打了起来。他们占了上风，还杀死了国王的大儿子。国王于是把康纳尔召到面前。
        - id: ch01-b02
          speaker: erin_king
          text: 康纳尔，你的儿子为什么扑上来打我的儿子，还害死了我的长子？可就算我向你报仇，也换不回什么。现在我交给你一件事。你和儿子若能带回洛赫兰王的棕马，我就饶他们三条性命。
        - id: ch01-b03
          speaker: conall
          text: 哪怕我的儿子没有性命之忧，我也愿意为国王效劳。你交代的事情虽然难办，可我宁可赔上自己和儿子们的命，也要替你办成。
        - id: ch01-b04
          speaker: narrator
          text: 康纳尔回到家，满心忧愁。临睡前，他把国王的条件告诉妻子。妻子想到丈夫必须远行，也许从此再见不到他，伤心得不得了。
        - id: ch01-b05
          speaker: wife
          text: 康纳尔啊，你还不如让国王处置儿子们。你这一走，我连今生还能不能再见到你都不知道！
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: 第二天一早，康纳尔安排好一切，带着三个儿子动身。他们一路不停，乘风破浪渡过大海，来到洛赫兰。可真正到了那里，父子四人反倒不知道该怎么办。康纳尔叫儿子们先停下，一起去找国王的磨坊主。磨坊主留他们住一夜，康纳尔也把儿子们怎样和王子冲突、怎样杀了国王的长子、自己为何非得弄到棕马的前因后果全说了。
        - id: ch01-b07
          speaker: conall
          text: 请你帮我一回，指点我怎样才能得到那匹马。我一定重重酬谢你。
        - id: ch01-b08
          speaker: miller
          text: 你求的这件事太糊涂了。国王把棕马看得比什么都重，除了偷，谁也弄不走。不过，你要是想得出法子，我会替你守住秘密。
        - id: ch01-b09
          speaker: conall
          text: 你天天替国王做事。让你手下的伙计把我和儿子们装进五只麸皮袋，怎么样？
        - id: ch01-b10
          speaker: miller
          text: 这个办法倒还不错。
        - id: ch01-b11
          speaker: narrator
          text: 磨坊主把主意告诉手下的伙计，伙计们照他说的，把父子四人装进五只麸皮袋。国王的马夫照常来取麸皮，把五只袋子全带进马厩，又把袋里的东西倒在马匹面前。办完这些，他们锁好马厩的门，转身离去。康纳尔父子从麸皮里起来，正要扑向棕马，康纳尔却先叫住了儿子们。
        - id: ch01-b12
          speaker: conall
          text: 先别碰它。离开这里不容易。我们先挖五个藏身洞，听见有人来，也有地方可躲。
        - id: ch01-b13
          speaker: narrator
          text: 五个洞挖好后，他们才伸手去捉棕马。那匹马还没有驯服，立刻在马厩里踢腾嘶叫，闹出可怕的声响。国王听见动静，认定是自己的棕马出了事，马上派马夫查看。父子四人看见人来，赶快藏进洞里。马夫在马群中来回察看，什么异常也没发现，只好回报国王。等他们回去休息，康纳尔父子第二次动手。棕马这回闹出的声音，比先前足足大了七倍。国王断定有什么东西正在惊扰它，又让马夫仔细搜查。父子们躲得严实，马夫翻找半天，仍旧一无所获。
        - id: ch01-b14
          speaker: lochlann_king
          text: 真是怪事。你们再去歇着。要是还有动静，我就亲自去看。
        - id: ch01-b15
          speaker: narrator
          text: 马夫离开以后，父子们第三次捉马。一个儿子终于抓住它，棕马却比前两次叫得更响。
        - id: ch01-b16
          speaker: lochlann_king
          text: 这回我敢断定，有人在惊扰我的棕马！
        - id: ch01-b17
          speaker: narrator
          text: 国王急忙摇响铃铛。侍从一来，他便命人通知所有马夫，说棕马一定出了问题。马夫们赶到以后，国王也亲自跟着他们走向马厩。父子四人看见一群人过来，再次钻进藏身洞。国王却是个谨慎的人。他先看出马群在哪一处受惊，又提醒众人马厩里藏着人。接着，他循着地上的踪迹寻找，果然发现五个洞，把康纳尔父子全揪了出来。大家都认得康纳尔，知道他是爱尔兰国王十分器重的佃农。
        - id: ch01-b18
          speaker: lochlann_king
          text: 康纳尔，躲在这里的竟然是你？
          emotion: surprised
        - id: ch01-b19
          speaker: conall
          text: 正是我，陛下。我实在迫不得已，只求你的宽恕和恩典。爱尔兰国王要我带回棕马，否则就处死我的三个儿子。我知道开口讨不到它，所以才来偷。
        - id: ch01-b20
          speaker: narrator
          text: 洛赫兰王让人给康纳尔的儿子饭吃，却派了双倍守卫看住他们。
        - id: ch01-b21
          speaker: lochlann_king
          text: 眼看三个儿子明天被绞死，你经历过比这更难的处境吗？你说自己出于无奈，又来求我的善心，我就给你一个机会。讲出一段同样艰险的遭遇，我便放过你最小的儿子。
    - id: ch02
      title: 林中的猫群
      blocks:
        - id: ch02-b01
          speaker: conall
          text: 我年轻时，父亲有许多土地，围场里养着成群的一岁母牛。有一头刚生下小牛，父亲叫我把它领回家。我找到母牛以后，便让它带着小牛跟我一起走。半路忽然下起一阵雪，我们只好躲进牧人的茅屋，连母牛和小牛也牵进去，等着雪过去。没想到，十一只猫也闯了进来。带头的是一只狐毛色的独眼大猫，还是它们的首席歌者。说真的，它们一进门，我就打心眼里不喜欢这些同伴。
        - id: ch02-b02
          speaker: head_cat
          text: 都唱起来，别一声不响！给黄爪康纳尔唱一支颂歌！
        - id: ch02-b03
          speaker: conall
          text: 连猫都知道我的名字，我实在吃惊。它们唱完，那只大猫就催我付报酬。我身上什么都没有，只好叫它们把小牛拿走。话才说完，十二只猫便扑了过去，很快就吃光了小牛。
        - id: ch02-b04
          speaker: head_cat
          text: 怎么又不出声？接着奏，接着给黄爪康纳尔唱！
        - id: ch02-b05
          speaker: conall
          text: 我一点也不想再听，可那十一只猫还是唱了一支。狐毛色的大猫又要报酬。我告诉它，自己受够了猫和报酬，除了那头母牛，再没有东西可给。它们立刻扑向母牛，没多久也把它吃完了。
        - id: ch02-b06
          speaker: head_cat
          text: 别停下！再给黄爪康纳尔唱一支颂歌！
        - id: ch02-b07
          speaker: conall
          text: 陛下，我已经看出它们绝非善类，根本不愿再听什么颂歌。可它们还是唱完了，又走回首席歌者身边。那只大猫照旧逼我付报酬，我只好明说再也没有东西可给。猫群一听，立刻发出凄厉的号叫。我赶快从茅屋后面的草皮窗洞跳出去，拼尽全力逃进树林。那时我腿脚快，力气也足。听见猫群在身后窸窸窣窣地追赶，我挑中附近最高的一棵树。它的树冠又密又紧，我一直爬到高处，尽量用枝叶藏住身体。
        - id: ch02-b08
          speaker: narrator
          text: 猫群搜遍树林，没有找到康纳尔。等它们累了，一只只都说该回去了。独眼大猫却抬头看见了他。
        - id: ch02-b09
          speaker: head_cat
          text: 你们长着两只眼，却全没看到！我只有一只眼，也看见那个恶棍躲在树上！
        - id: ch02-b10
          speaker: conall
          text: 一只猫马上爬了上来。等它靠近，我拔出武器杀了它。
        - id: ch02-b11
          speaker: head_cat
          text: 我可不能这样白白损失同伴！都围住树根往下挖，把那个恶棍弄到地上！
          emotion: angry
        - id: ch02-b12
          speaker: conall
          text: 猫群咬断第一根粗根时，树身摇晃起来，我不由得大喊一声。附近有位神父，正带着十个人挖地。
        - id: ch02-b13
          speaker: priest
          text: 这是有人身陷绝境的喊声，我不能听见了却不回应。
        - id: ch02-b14
          speaker: wise_man
          text: 先等等，听见第二声再说。
        - id: ch02-b15
          speaker: conall
          text: 猫群疯狂挖断第二根树根，我又高喊一声，而且喊得一点也不弱。
        - id: ch02-b16
          speaker: priest
          text: 没错，确实有人遇险。我们赶快过去！
        - id: ch02-b17
          speaker: conall
          text: 众人刚准备动身，猫群又向大树猛攻，终于弄断第三根树根。大树一下歪向一边，我也发出第三声呼救。那些强壮的男人听得清楚，立刻飞奔过来。他们看见猫群正这样折腾大树，便抡起挖地的铁锹打过去。人和猫狠狠干了一阵，猫群这才掉头逃走。说真的，陛下，直到最后一只猫也跑得不见踪影，我才敢从树上下来，然后一路回了家。这便是我当时经历过最艰难的事。在我看来，被一群猫撕成碎片，可比明天被洛赫兰王绞死还要难熬。
        - id: ch02-b18
          speaker: lochlann_king
          text: 康纳尔，你可真能说。这个故事救下了你一个儿子。再讲一段更艰险的经历，我就放过第二个儿子。
    - id: ch03
      title: 独眼巨人与魔戒
      blocks:
        - id: ch03-b01
          speaker: conall
          text: 只要你答应照办，我就讲讲另一回险境。那时我还是个年轻小伙子，有一天独自出去打猎。父亲的土地紧靠大海，海边到处是岩石、洞穴和裂缝。我走在岸边高处，看见两块岩石之间好像冒着烟，便只顾盯着下面，想弄明白烟从哪里来。没想到，我一脚踩空，整个人掉了下去。幸好下面长满厚厚的石南，我没有摔破皮肉，也没有折断骨头。可我不知道怎样才能出去，只能不停仰望自己掉下来的地方，觉得这辈子也没有重新爬上去的那一天。困在那里一直等死，实在叫人害怕。
        - id: ch03-b02
          speaker: conall
          text: 不久，一阵巨响传来。一个巨人赶着二十四只山羊走近，羊群前头还有一只公羊。他拴好羊，来到我面前。
        - id: ch03-b03
          speaker: giant_one
          text: 哈噢，康纳尔！我的刀在袋里锈了这么久，就等着割你的嫩肉呢。
        - id: ch03-b04
          speaker: conall
          text: 你把我撕碎也得不到多少，我只够你吃一顿。不过，你不是只有一只眼吗？我医术高明，能让另一只眼睛看见东西。
        - id: ch03-b05
          speaker: conall
          text: 巨人信了我的话，把一口大锅拖到生火的地方。我一面指点他怎样把水烧热，一面说这都是为了让另一只眼睛复明。我又取来石南，扎成擦洗用的刷子，让他直挺挺坐进锅里。我装作要医好那只瞎眼，却先从他的好眼睛动手，直到把两只眼都弄得一样瞎。说到底，毁掉一只好眼睛，当然比治好一只瞎眼容易。巨人发现一丝光也看不见，又听我说无论如何都要逃出去，猛地从热水里跳出来。他堵死洞口，发誓要为那只眼报仇。我没有别的办法，只能整夜蜷缩在那里，死死屏住呼吸，免得他听出我躲藏的地方。
        - id: ch03-b06
          speaker: giant_one
          text: 天已经亮了。你还在睡吗？起来，把我的羊放出去！
        - id: ch03-b07
          speaker: conall
          text: 我先杀了公羊。
        - id: ch03-b08
          speaker: giant_one
          text: 我看你是在杀我的公羊！
        - id: ch03-b09
          speaker: conall
          text: 没有。绳子绑得太紧，我得慢慢解。
        - id: ch03-b10
          speaker: narrator
          text: 康纳尔一只只放出母羊，同时把公羊皮完整剥成袋状。巨人摸着经过身边的羊，逐一放行。
        - id: ch03-b11
          speaker: giant_one
          text: 去吧，蓬松多毛的白山羊。你看得见我，我却看不见你。
        - id: ch03-b12
          speaker: conall
          text: 最后一只羊出去前，我钻进公羊皮，双腿装成后腿，双手装成前腿，脑袋顶着羊头和羊角。我这样走到洞口，那畜生果然把我当成公羊。
        - id: ch03-b13
          speaker: giant_one
          text: 去吧，我漂亮的公羊。你看得见我，我却看不见你。
        - id: ch03-b14
          speaker: conall
          text: 一走出洞，看见外面的天地，我不知道有多欢喜。我甩掉羊皮，朝他喊：“我出来了，你到底没有困住我！”
        - id: ch03-b15
          speaker: giant_one
          text: 啊哈，原来你这样耍我！你既然这么有本事，能从洞里逃走，我就送你一枚戒指。留着吧，它会给你带来好处。
        - id: ch03-b16
          speaker: conall
          text: 我不从你手里接。把戒指扔过来，我自己拿走。
        - id: ch03-b17
          speaker: narrator
          text: 巨人把戒指扔到平地。康纳尔捡起来戴上，巨人先问是否合适，接着突然呼唤它。
        - id: ch03-b18
          speaker: giant_one
          text: 戒指，你在哪里？
        - id: ch03-b19
          speaker: ring
          text: 我在这里。
        - id: ch03-b20
          speaker: conall
          text: 巨人循声朝我走来，我才知道自己比任何时候都危险。我拔出短刀，切掉戴戒指的手指，用尽全力扔进湖水最深处。
        - id: ch03-b21
          speaker: giant_one
          text: 戒指，你在哪里？
        - id: ch03-b22
          speaker: ring
          text: 我在这里。
        - id: ch03-b23
          speaker: conall
          text: 戒指明明已经落到海底，听见召唤却照样回答。巨人一心追着那声音，纵身猛扑，一头扎进海里。我站在岸上看着他沉下去，心中的欢喜，就像你现在愿意放过我和两个儿子，再也不给我们降下麻烦一样。等巨人淹死，我重新走进洞穴，把他收藏的金银全都带走，这才回到家中。家人看见我活着回来，当然欢喜万分。陛下，你现在看看我的手。少掉的这根手指，正是这段经历留下的证据。
        - id: ch03-b24
          speaker: lochlann_king
          text: 康纳尔，你既能说，又有智慧。这根手指确实不见了，你已经救下两个儿子。要是还能讲出比眼看长子明天被绞死更难的遭遇，他也可以活命。
    - id: ch04
      title: 湖岛上的母子
      blocks:
        - id: ch04-b01
          speaker: conall
          text: 后来，父亲替我找到妻子，我便成了婚。有一天，我出去打猎，沿着海边一直走，看见湖心有一座岛。岸边正好停着一条船，船头和船尾各有一根绳子，船舱里还装着许多珍贵的东西。我走近细看，想知道怎样才能拿走一点宝物。一只脚才踏上船，另一只脚还踩在地上，我一抬头，那条船竟已经到了湖中央。它没有停，一直把我载到岛边。我刚刚下船，它便自行返回原先停靠的地方。
        - id: ch04-b02
          speaker: conall
          text: 我不知道接下来该怎么办。岛上没有食物，没有衣物，连一所房子的影子都看不见。我爬上一座山顶，又沿路走进一道山谷。在谷底低洼的地方，有个女人抱着孩子。赤裸的婴儿坐在她膝上，她手里还握着一把刀。她试着把刀放到孩子的喉咙上，孩子却抬脸冲她笑了。女人顿时哭起来，把刀扔到身后。我心里明白，自己离仇敌这样近，离朋友却这样远，可还是朝她喊了一声，问她到底在做什么。
        - id: ch04-b03
          speaker: conall
          text: 你在这里做什么？
        - id: ch04-b04
          speaker: woman
          text: 你又是怎么来到这里的？
        - id: ch04-b05
          speaker: conall
          text: 我把经过全告诉她。她说自己也是这样来到岛上的，又领我进入她藏身的地方。我问她为什么把刀放到孩子颈上。
        - id: ch04-b06
          speaker: woman
          text: 这里的巨人逼我把孩子煮给他吃。要是不照办，我自己也活不成。
          emotion: fearful
        - id: ch04-b07
          speaker: narrator
          text: 巨人的脚步声就在这时传来。
        - id: ch04-b08
          speaker: woman
          text: 我该怎么办？我到底该怎么办？
          emotion: fearful
        - id: ch04-b09
          speaker: conall
          text: 幸好大锅还没有烧热，我刚躲进去，那畜生就进来了。
        - id: ch04-b10
          speaker: giant_two
          text: 那个小东西煮好没有？
        - id: ch04-b11
          speaker: woman
          text: 还没有熟。
        - id: ch04-b12
          speaker: conall
          text: 妈妈，妈妈，我快要煮熟啦！
        - id: ch04-b13
          speaker: narrator
          text: 巨人听见锅里的喊声，顿时“嗨、嚯、霍格赖”地放声大笑，又往锅底堆了许多木柴。康纳尔感到热气不断升起，以为自己还没来得及逃，就会先被滚烫的大锅烫死。幸好命运帮了他一回，巨人守在锅边，竟慢慢睡着了。可火还在烧，锅底仍旧把康纳尔烫得厉害。女人等了好一会儿，确定巨人已经熟睡，这才悄悄走近，把嘴贴在锅盖的孔边，轻声问康纳尔是不是还活着。
        - id: ch04-b14
          speaker: conall
          text: 我说自己还活着，又把头伸出锅盖。洞口很大，脑袋轻易就钻了出去。可提起臀部时，我被卡住了，只好把一层皮留在锅里，总算逃出来。女人告诉我，只有巨人自己的武器才能杀死他。
        - id: ch04-b15
          speaker: conall
          text: 我走到巨人身边，开始一点点抽出他的长矛。那畜生每吸一口气，我都觉得自己会被吸进他的喉咙；每呼出一口气，我又被吹回原处那么远。一次次吃尽苦头以后，我总算把长矛从他身边抽了出来。可那武器重得惊人，我根本驾驭不了它。扛着那根长矛，我就像大风里一个被整捆稻草压住的人。再看看熟睡的巨人，整张脸只有正中一只眼，模样可怕极了。像我这样的人要向他动手，心里实在不好受。可我还是尽力举起长矛，把尖端刺进那只独眼。他一吃痛，猛地抬起头，矛尾撞上洞顶，矛尖便从眼睛一直穿到脑后。他当场倒下，浑身冰冷，彻底死了。
        - id: ch04-b16
          speaker: conall
          text: 陛下，我当然欢喜。我和女人到外面的空地过了一夜。后来我找回那条船，船上的珍宝一件也没有少。我把女人和孩子送回陆地，自己也回家了。
        - id: ch04-b17
          speaker: narrator
          text: 洛赫兰王的母亲正在生火，一直听着康纳尔讲那个孩子。她忽然转身问他。
        - id: ch04-b18
          speaker: queen_mother
          text: 当时在岛上的人，真的是你？
          emotion: surprised
        - id: ch04-b19
          speaker: conall
          text: 不错，正是我。
        - id: ch04-b20
          speaker: queen_mother
          text: 唉，唉！那个女人就是我，国王就是你救下的婴儿。是你给了他这条命，我们该谢你的救命之恩！
          emotion: surprised
        - id: ch04-b21
          speaker: narrator
          text: 众人听完，全都欢喜极了。
        - id: ch04-b22
          speaker: lochlann_king
          text: 康纳尔，你受过这么多磨难。现在，棕马归你，我再送你一袋宝库里最珍贵的东西。
        - id: ch04-b23
          speaker: narrator
          text: 那晚众人歇下。第二天，康纳尔起得很早，王后却更早起身，把一切准备妥当。他带上棕马和满满一袋金银宝石，与三个儿子离开洛赫兰，回到欢乐的爱尔兰国土。他把财宝留在家里，牵棕马去见国王。从此，两人成了永远的朋友。康纳尔回到妻子身边，他们摆下一场盛宴。孩子啊，兄弟啊，那才真叫一场宴席呢。
