  chapters:
    - id: ch01
      title: The Fisherman's Promise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a poor old fisherman. One year, no matter how often he cast his nets, he caught very little. Then, on a day of days, a sea-maiden rose beside his boat and spoke to him.
        - id: ch01-b02
          speaker: sea_maiden
          text: Are you catching many fish?
        - id: ch01-b03
          speaker: fisherman
          text: Not I.
        - id: ch01-b04
          speaker: sea_maiden
          text: What would you give me if I sent plenty of fish your way?
        - id: ch01-b05
          speaker: fisherman
          text: Ach, I have little enough to give.
        - id: ch01-b06
          speaker: sea_maiden
          text: Then will you give me your first son?
        - id: ch01-b07
          speaker: fisherman
          text: I would, if ever I had a son.
        - id: ch01-b08
          speaker: sea_maiden
          text: Go home, then. You will have plenty of fish from this day on. But when your son is twenty years old, remember me.
        - id: ch01-b09
          speaker: narrator
          text: Everything happened just as she had said. The fisherman caught fish in plenty, and in time he had a son. But as the young man's twentieth year drew near, his father counted every passing day, knowing the promised time was coming. His heart grew heavier and heavier, and he could rest neither by day nor by night.
        - id: ch01-b10
          speaker: fisher_son
          text: Father, is someone troubling you?
        - id: ch01-b11
          speaker: fisherman
          text: Someone is, but it has nothing to do with you or anyone else.
        - id: ch01-b12
          speaker: fisher_son
          text: I must know what it is.
        - id: ch01-b13
          speaker: narrator
          text: At last, the old man told him of the promise he had made to the sea-maiden.
        - id: ch01-b14
          speaker: fisher_son
          text: Don't grieve over that. I won't stand against your promise.
        - id: ch01-b15
          speaker: fisherman
          text: No, you shall not go, my son. I would sooner never catch another fish.
        - id: ch01-b16
          speaker: fisher_son
          text: If you won't take me to her, go to the smithy. Have the smith make me a great strong sword, and I'll set out to seek my fortune.
        - id: ch01-b17
          speaker: narrator
          text: His father did as he asked. But when the young man gripped the first sword and shook it once or twice, it burst into a hundred splinters. He sent his father back for a sword twice as heavy. That one broke clean in two.
        - id: ch01-b18
          speaker: narrator
          text: Back the old man went once more. This time the smith forged a mighty sword, greater than any he had ever made.
        - id: ch01-b19
          speaker: smith
          text: There is your sword. It will take a fine strong fist to wield that blade.
        - id: ch01-b20
          speaker: narrator
          text: The fisherman carried it home. His son took it and gave it a shake or two. The blade held firm.
        - id: ch01-b21
          speaker: fisher_son
          text: This one will do. It is high time I went on my way.
    - id: ch02
      title: The Three Grateful Beasts
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Next morning, the young man saddled his father's black horse and took the wide world for his pillow. Before long he found a dead sheep beside the road. A great black dog, a falcon, and an otter were quarrelling over it, and they asked him to divide it among them.
        - id: ch02-b02
          speaker: narrator
          text: He got down from his horse. He gave three shares to the dog, two to the otter, and one to the falcon.
        - id: ch02-b03
          speaker: black_dog
          text: If swift feet or sharp teeth can ever help you, remember me, and I will be at your side.
        - id: ch02-b04
          speaker: otter
          text: If you ever need one who can swim along the bottom of a pool, remember me, and I will be at your side.
        - id: ch02-b05
          speaker: falcon
          text: If trouble finds you where swift wings or crooked claws can help, remember me, and I will be at your side.
        - id: ch02-b06
          speaker: narrator
          text: He travelled on until he reached a king's house. There he took work as a cattle herd. The bargain was simple. His wages would rise or fall with the amount of milk the cows gave.
        - id: ch02-b07
          speaker: narrator
          text: The first pasture was bare. That evening the cows gave little milk, so the young man received little food or drink. Next day he drove them farther and found a green glen, thick with the finest grass he had ever seen.
        - id: ch02-b08
          speaker: narrator
          text: Near the hour for taking the cattle home, a huge giant came toward him with a sword in his hand.
        - id: ch02-b09
          speaker: first_giant
          text: Hi! Ho! Hogarach! Those cattle are mine. They are grazing on my land, and you are a dead man.
          emotion: angry
        - id: ch02-b10
          speaker: fisher_son
          text: I wouldn't say that. It may be easier to promise than to do.
        - id: ch02-b11
          speaker: narrator
          text: The herd drew his great clean-sweeping sword and closed with the giant. One sweep of the blade took the giant's head off in a twinkling.
        - id: ch02-b12
          speaker: narrator
          text: He mounted his black horse and searched until he found the giant's house. Inside lay heaps of money and a wardrobe filled with gold and silver garments, each finer than the last. Yet he took nothing. At nightfall he returned to the king's house.
        - id: ch02-b13
          speaker: narrator
          text: That night, what a milking there was! The cows gave milk in plenty. The herd had all the meat and drink he wanted, and the king was delighted to have found such a servant. This went on for some time, until the grass in the glen grew thin and the grazing was poor again.
    - id: ch03
      title: The Giant and the Crone
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The herd decided to venture farther onto the giant's land. He found a great grassy park, went back for the cattle, and drove them into it.
        - id: ch03-b02
          speaker: narrator
          text: They had hardly begun to graze when another giant rushed at him, wild with rage.
        - id: ch03-b03
          speaker: second_giant
          text: Hi! Haw! Hogaraich! Only a drink of your blood will quench my thirst tonight.
          emotion: angry
        - id: ch03-b04
          speaker: fisher_son
          text: We don't know that yet. Saying it may be easier than doing it.
        - id: ch03-b05
          speaker: narrator
          text: They sprang at each other, and their blades shook under the blows. They fought on and on. At last, it seemed the giant would defeat the herd. Then the young man remembered the black dog.
        - id: ch03-b06
          speaker: fisher_son
          text: Black dog, come to my aid!
        - id: ch03-b07
          speaker: narrator
          text: In one bound, the dog fastened his teeth in the giant's neck. The herd struck quickly and cut off the giant's head.
        - id: ch03-b08
          speaker: narrator
          text: He went home exhausted that night. But if the herd was weary, the cows were well fed, and what a quantity of milk they gave! Everyone in the king's household rejoiced over the wonderful servant who brought them home.
        - id: ch03-b09
          speaker: narrator
          text: The next day he went to the giant's castle. At the door, a little crone met him with a flood of flattering words.
        - id: ch03-b10
          speaker: crone
          text: Good luck and all hail to you, fisher's son! What an honor it is for our kingdom to welcome such a man. Your coming brings fame to this poor little house. Please, noble sir, go in first and rest yourself.
        - id: ch03-b11
          speaker: fisher_son
          text: You go in before me, old woman. I don't care for flattery on the doorstep. Go inside, and then I'll hear what you have to say.
        - id: ch03-b12
          speaker: narrator
          text: The crone went in. As soon as her back was turned, the herd swung his sword and cut off her head. But the sword flew from his hand. The crone seized her head in both hands and set it straight back on her neck.
        - id: ch03-b13
          speaker: narrator
          text: The black dog leaped at her. She struck the faithful beast with a magic club, and down he fell. The herd wrestled the club away from her. One blow on the crown of her head laid her on the earth in a twinkling.
        - id: ch03-b14
          speaker: narrator
          text: Farther inside the castle, he found treasure everywhere. There was gold and silver, and one precious thing after another. Then he returned to the king's house, and there was great rejoicing.
    - id: ch04
      title: The Beast in the Loch
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: He went on herding for a while. Then one night, instead of greetings from the dairymaid, he came home to find everyone weeping.
        - id: ch04-b02
          speaker: fisher_son
          text: Why is everyone grieving tonight?
        - id: ch04-b03
          speaker: dairymaid
          text: A terrible three-headed beast lives in the loch. Every year it must have one person, and this year the lot fell on the king's daughter. At noon tomorrow, she must meet the Laidly Beast at the upper end of the loch. But a great suitor has gone to rescue her.
          emotion: sad
        - id: ch04-b04
          speaker: fisher_son
          text: Who is this suitor?
        - id: ch04-b05
          speaker: dairymaid
          text: He is a mighty General of arms. If he kills the beast, he will marry the princess. The king has promised his daughter to whoever saves her.
        - id: ch04-b06
          speaker: narrator
          text: The next day, as the hour drew near, the princess and the General went to the black rock at the upper end of the loch. Soon the water stirred. When the General saw that dreadful beast with its three heads, his courage failed him. He slipped away and hid.
        - id: ch04-b07
          speaker: narrator
          text: The princess stood trembling, with no one at all left to save her. Then, all at once, she saw a handsome young warrior riding toward the black rock on a black horse. He was splendidly dressed and fully armed, and his black dog came close behind him.
        - id: ch04-b08
          speaker: fisher_son
          text: Your face is full of sorrow. Why are you here?
        - id: ch04-b09
          speaker: princess
          text: Oh, it hardly matters. I won't be here much longer.
          emotion: fearful
        - id: ch04-b10
          speaker: fisher_son
          text: I wouldn't say that.
        - id: ch04-b11
          speaker: princess
          text: A champion who looked as able as you ran away only moments ago.
        - id: ch04-b12
          speaker: fisher_son
          text: The true champion is the one who stays to face the fight.
        - id: ch04-b13
          speaker: narrator
          text: He went straight to meet the beast with his sword and his dog. The loch churned with splashing and spray. The black dog did all he could, while the princess stood frozen by the beast's terrible noise. Now the youth was driven under, now he rose above. At last, his sword took off one of the three heads.
        - id: ch04-b14
          speaker: narrator
          text: The beast gave one tremendous roar. Its scream struck the rocks, and the rocks sent the echo crying back. The creature churned the whole loch into flying spray, from one end to the other. Then, in a twinkling, it vanished beneath the water.
        - id: ch04-b15
          speaker: princess
          text: Good luck and victory go with you! I am safe for tonight. But the beast will return until its other two heads are gone.
          emotion: happy
        - id: ch04-b16
          speaker: narrator
          text: The youth took the severed head, passed a knotted cord through it, and told the princess to bring it back the next day. She gave him a gold ring. Then she carried the head away on her shoulder, while he returned to the cattle.
        - id: ch04-b17
          speaker: narrator
          text: She had not gone far when the General came out of hiding and stopped her.
        - id: ch04-b18
          speaker: general
          text: Tell everyone that I cut the head from the beast, or I will kill you.
          emotion: angry
        - id: ch04-b19
          speaker: princess
          text: Oh, I will say it. Who else could have taken the beast's head but you?
          emotion: fearful
        - id: ch04-b20
          speaker: narrator
          text: By the time they reached the king's house, the bloody head rode on the General's shoulder. There was great joy when the princess came home alive and unhurt, with the famous captain carrying the beast's head. No one doubted that he would save her again the next day.
    - id: ch05
      title: Three Heads and a Knot
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next day, the princess and the General returned to the same black rock. The Laidly Beast stirred in the middle of the loch, and once again the General crept away and hid. Soon the man on the black horse arrived. He wore a different suit of clothes this time, but that made no difference. The princess knew him at once.
        - id: ch05-b02
          speaker: princess
          text: I am glad you've come. I hope you will use that great sword as well today as you did yesterday. Come and rest for a moment.
          emotion: happy
        - id: ch05-b03
          speaker: narrator
          text: Before long, the beast came steaming through the loch. The young man charged. What a clattering and splattering followed, with the creature thrashing, roaring, and flinging water everywhere. They fought until night was near. At last, the youth cut off a second head.
        - id: ch05-b04
          speaker: narrator
          text: He threaded it onto the knotted cord and gave it to the princess. She gave him one of her earrings. Then he mounted the black horse and went back to his herd.
        - id: ch05-b05
          speaker: narrator
          text: The princess carried both heads toward home. Again the General met her and took them. Again he ordered her to say that he had cut off the new head.
        - id: ch05-b06
          speaker: princess
          text: Who else could have taken the head but you?
        - id: ch05-b07
          speaker: narrator
          text: So they reached the king's house with the heads, and once more the household filled with joy.
        - id: ch05-b08
          speaker: narrator
          text: At the same hour on the third day, they set out again. As usual, the officer hid, and the princess went alone to the loch. The rider on the black horse came to her. The beast had raged and roared on the first two days, but that day its fury was dreadful.
        - id: ch05-b09
          speaker: narrator
          text: No matter. The young man fought it and struck off its third and final head. He pulled the head onto the knotted cord and handed it to the princess. She gave him her other earring, and he rode away.
        - id: ch05-b10
          speaker: narrator
          text: The princess went home with all three heads. Everyone in the king's house was smiling, and the General was to marry her the following day.
        - id: ch05-b11
          speaker: narrator
          text: The wedding began, and all in the castle waited eagerly for the priest. But when he arrived, the princess declared that she would marry only the man who could take the three heads off the cord without cutting its knot.
        - id: ch05-b12
          speaker: king
          text: The man who put those heads on the cord should be the one who can take them off.
        - id: ch05-b13
          speaker: narrator
          text: The General tried and failed. Then everyone else in the house tried, but not one could loosen the heads. At last, the king asked whether anyone remained. They told him the cattle herd had not yet tried.
        - id: ch05-b14
          speaker: narrator
          text: They sent for the herd. He had the heads off the cord almost before anyone knew what he was doing.
        - id: ch05-b15
          speaker: princess
          text: Wait a moment. The man who cut those heads from the beast also has my ring and my two earrings.
        - id: ch05-b16
          speaker: narrator
          text: The herd reached into his pocket and tossed the ring and both earrings onto the table.
        - id: ch05-b17
          speaker: princess
          text: You are the man I will marry.
        - id: ch05-b18
          speaker: narrator
          text: The king was not pleased to find that a herd would be his daughter's husband. He ordered better clothes for the young man. But the princess said her champion already owned a suit finer than any in the castle. So the herd put on the giant's golden clothes, and they were married that very day.
    - id: ch06
      title: The Harp by the Water
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The young couple lived happily together. Then came the anniversary of the day when the fisherman's promise was due. As husband and wife walked beside the loch, the sea-maiden suddenly appeared. Without leave or warning, she seized the young man and carried him beneath the water.
        - id: ch06-b02
          speaker: narrator
          text: The princess grieved for her husband until she was nearly blind with tears. Day after day, she watched the loch. At last, an old soothsayer met her. She told him what had happened, and he explained how she might save her husband.
        - id: ch06-b03
          speaker: narrator
          text: The princess took her harp to the shore and began to play. The sea-maiden rose to listen, for sea-maidens love music more than any other creatures. The moment the princess saw her, she stopped playing.
        - id: ch06-b04
          speaker: sea_maiden
          text: Go on. Play some more.
        - id: ch06-b05
          speaker: princess
          text: No. Not until I see my husband again.
        - id: ch06-b06
          speaker: narrator
          text: The sea-maiden lifted the young man's head above the loch. The princess played again, then stopped once more. This time the sea-maiden raised him as far as his waist. The princess played a third time and stopped. At last, the sea-maiden brought him completely out of the water.
        - id: ch06-b07
          speaker: fisher_son
          text: Falcon, come to me now!
        - id: ch06-b08
          speaker: narrator
          text: The young man became a falcon and flew safely to shore. But as he escaped, the sea-maiden seized the princess and dragged her into the loch instead.
    - id: ch07
      title: The Sea-Maiden's Soul
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Sorrow lay over the whole town that night. The princess's husband wandered up and down the shores of the loch, weeping for her by day and by night. Once more, the old soothsayer came to him.
        - id: ch07-b02
          speaker: soothsayer
          text: There is only one way to kill the sea-maiden. On the island in the middle of the loch lives a white-footed hind. Her legs are slender, and her step is swifter than any other. If you catch her, a hoodie crow will spring out. If you catch the hoodie, a trout will spring out. In the trout's mouth is an egg, and the sea-maiden's soul is inside that egg. Break the egg, and she will die.
        - id: ch07-b03
          speaker: narrator
          text: No boat or raft could reach the island, because the sea-maiden sank everything that ventured onto the loch. So the young man decided to try the crossing on his black horse. The horse leaped over the narrow water and landed on the island.
        - id: ch07-b04
          speaker: narrator
          text: The young man saw the hind and sent his own black dog after her. But whenever the dog reached one side of the island, the hind was already on the other.
        - id: ch07-b05
          speaker: fisher_son
          text: Oh, if only the great black dog I fed beside the road were here!
        - id: ch07-b06
          speaker: narrator
          text: The words were hardly spoken when the grateful dog stood beside him. The two dogs raced after the hind, and soon they brought her to the ground. The instant the young man caught her, a hoodie crow burst out and flew away.
        - id: ch07-b07
          speaker: fisher_son
          text: If only the gray falcon with the keenest eyes and swiftest wings were here!
        - id: ch07-b08
          speaker: narrator
          text: No sooner had he called than the falcon sped after the hoodie. Before long, she struck the crow down. But as the hoodie fell on the bank of the loch, a trout sprang out of her and splashed into the water.
        - id: ch07-b09
          speaker: fisher_son
          text: Oh, otter, if only you were beside me now!
        - id: ch07-b10
          speaker: narrator
          text: At once the otter appeared. She plunged into the loch and brought the trout back from the deep water. The moment she reached shore with it, the egg dropped from the trout's mouth.
        - id: ch07-b11
          speaker: narrator
          text: The young man sprang forward and set his foot on the egg. Then the sea-maiden appeared before him.
        - id: ch07-b12
          speaker: sea_maiden
          text: Do not break the egg, and I will give you anything you ask.
          emotion: fearful
        - id: ch07-b13
          speaker: fisher_son
          text: Give me back my wife!
        - id: ch07-b14
          speaker: narrator
          text: In the wink of an eye, the princess stood beside him. He took her hand between both of his. Then he pressed his foot down upon the egg, and the sea-maiden died.
