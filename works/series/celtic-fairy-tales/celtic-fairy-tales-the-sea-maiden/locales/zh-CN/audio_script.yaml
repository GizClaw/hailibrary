audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    fisherman:
      display_name: 老渔夫
      tts:
        delivery: 朴实慈爱，忧愁时声音沉重
        timbre: 苍老粗哑
        pace: 稍慢
        pitch: 中低音
    sea_maiden:
      display_name: 海中仙女
      tts:
        delivery: 冷静神秘，提出条件时不容违抗
        timbre: 清冷空灵
        pace: 舒缓
        pitch: 中高音
    fisher_son:
      display_name: 渔夫的儿子
      tts:
        delivery: 勇敢坦荡，面对危险时坚定利落
        timbre: 年轻明亮
        pace: 中速
        pitch: 中音
    smith:
      display_name: 铁匠
      tts:
        delivery: 粗犷实在，说话简短有力
        timbre: 浑厚沙哑
        pace: 中速
        pitch: 低音
    black_dog:
      display_name: 黑犬
      tts:
        delivery: 忠诚郑重
        timbre: 深沉有力
        pace: 中速
        pitch: 低音
    otter:
      display_name: 水獭
      tts:
        delivery: 灵巧爽快
        timbre: 柔和清亮
        pace: 稍快
        pitch: 中高音
    falcon:
      display_name: 猎鹰
      tts:
        delivery: 锐利果断
        timbre: 清越有穿透力
        pace: 稍快
        pitch: 高音
    first_giant:
      display_name: 第一个巨人
      tts:
        delivery: 蛮横凶暴，吼声震耳
        timbre: 粗厚洪亮
        pace: 稍慢
        pitch: 低音
    second_giant:
      display_name: 第二个巨人
      tts:
        delivery: 狂怒嗜血，咆哮般说话
        timbre: 粗粝洪亮
        pace: 中速
        pitch: 低音
    crone:
      display_name: 老太婆
      tts:
        delivery: 甜腻奉承，暗藏狡诈
        timbre: 尖细苍老
        pace: 稍快
        pitch: 高音
    dairymaid:
      display_name: 挤奶姑娘
      tts:
        delivery: 质朴直率，悲伤时声音发颤
        timbre: 清亮柔和
        pace: 中速
        pitch: 中高音
    princess:
      display_name: 国王的女儿
      tts:
        delivery: 坚韧真诚，恐惧中仍保持清醒
        timbre: 柔和明亮
        pace: 中速
        pitch: 中高音
    general:
      display_name: 将军
      tts:
        delivery: 外强中干，威胁人时凶狠急促
        timbre: 洪亮生硬
        pace: 中速
        pitch: 中低音
    king:
      display_name: 国王
      tts:
        delivery: 威严持重，判断事情时干脆
        timbre: 浑厚沉稳
        pace: 稍慢
        pitch: 中低音
    soothsayer:
      display_name: 老预言家
      tts:
        delivery: 神秘沉着，指点时清楚笃定
        timbre: 苍老低沉
        pace: 舒缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 二十年前的约定
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个穷苦的老渔夫，有一年怎么也捕不到多少鱼。一天，他在海上打鱼，一位海中仙女忽然从船边浮了上来。
        - id: ch01-b02
          speaker: sea_maiden
          text: 你捕到的鱼多吗？
        - id: ch01-b03
          speaker: fisherman
          text: 一点也不多。
        - id: ch01-b04
          speaker: sea_maiden
          text: 要是我让许多鱼游到你这里来，你拿什么谢我？把你的第一个儿子给我，行吗？
        - id: ch01-b05
          speaker: fisherman
          text: 唉，我没什么可送你的。可要是我真能有个儿子，就把他给你。
        - id: ch01-b06
          speaker: sea_maiden
          text: 那就回家吧。等你儿子满二十岁时，别忘了我。从今往后，你会捕到许多鱼。
        - id: ch01-b07
          speaker: narrator
          text: 后来果真事事如她所言，老人每天都能捕到许多鱼。可二十年期限越来越近，他眼看日子一天接一天过去，心也一天比一天沉。到了最后，他从早到晚、从夜到天，连一刻安宁也没有。儿子看出父亲心事重重，终于开口询问。
        - id: ch01-b08
          speaker: fisher_son
          text: 是谁在为难您？我一定要知道。
        - id: ch01-b09
          speaker: fisherman
          text: 的确有人在为难我，可这事与你无关，也与别人无关。
        - id: ch01-b10
          speaker: narrator
          text: 儿子一再追问，老人最后还是把二十年前发生的事讲了出来，也说出了自己与海中仙女定下的约定。
        - id: ch01-b11
          speaker: fisher_son
          text: 别再为这件事发愁，我不会叫您违背约定。
        - id: ch01-b12
          speaker: fisherman
          text: 不成！儿子，就算以后再也捕不到鱼，我也不能让你去。
        - id: ch01-b13
          speaker: fisher_son
          text: 既然您不带我去，就请铁匠打一把结实的大剑。我自己出去闯荡。
        - id: ch01-b14
          speaker: narrator
          text: 父亲来到铁匠铺，请人打好第一把刚猛的剑，又把它带回家。年轻人握住剑，只抖了两下，剑身顿时飞碎成一百片。他请父亲再去一趟，把第二把剑的分量加到两倍。可新剑到了他手里，也只抖两下便断成两截。老人第三次走进铁匠铺，铁匠这才打出一把自己从未打过的巨剑。
        - id: ch01-b15
          speaker: smith
          text: 剑给你。可要舞动这把利刃，握剑的拳头也得有真本事。
        - id: ch01-b16
          speaker: fisher_son
          text: 这把能用。我早该上路了。
        - id: ch01-b17
          speaker: narrator
          text: 第二天一早，他给父亲的黑马备好鞍，从此把天地当作枕席，出门闯荡。走出一程，他看见路边躺着一只死羊。一条大黑犬、一只猎鹰和一只水獭围着猎物争个不休，便请他来分。年轻人翻身下马，把羊分作六份，黑犬得三份，水獭得两份，猎鹰得一份。
        - id: ch01-b18
          speaker: black_dog
          text: 若你需要迅捷的腿脚或锋利的牙齿，只管想起我，我就到你身边。
        - id: ch01-b19
          speaker: otter
          text: 若你困在水里，需要善游的脚掌救命，也只管想起我。
        - id: ch01-b20
          speaker: falcon
          text: 若有难关要靠快翅膀和利爪来破，想起我，我便来助你。
    - id: ch02
      title: 巨人的牧场
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 年轻人继续赶路，来到一位国王的宫殿，受雇替他放牛。他能拿多少报酬，全看牛群产多少奶。头一天，他把牛赶到附近的草场，可那里一片荒瘠。傍晚回来时，牛没有多少奶，他那晚分到的饭食也少得可怜。第二天，他赶着牛群走得更远，终于找到一座青草丰茂的碧绿山谷，那是他从未见过的好牧场。
        - id: ch02-b02
          speaker: narrator
          text: 傍晚，一个高大的巨人提剑而来。
        - id: ch02-b03
          speaker: first_giant
          text: 嗨！嗬！霍嘎拉赫！这些牛是我的！它们踏上我的土地，你就是个死人了！
        - id: ch02-b04
          speaker: fisher_son
          text: 这可难说。话说起来容易，做起来未必也容易。
        - id: ch02-b05
          speaker: narrator
          text: 巨人拔出那把横扫千军的大剑，一步步逼近。牧人也拔剑迎上去，把手臂往后一扬，转眼便斩下巨人的头。他跃上黑马，四处寻找巨人的住所。等他推门进去，只见里面钱财成堆，衣橱中的金银华服样样齐全，一件比一件华美。可他连一样也没拿。夜幕初降，他便回到国王的宫殿。那晚牛群挤出的奶可真多，他也得到一顿丰盛饭食，吃喝不受限制。国王请到这样的牧人，喜欢得不得了。
        - id: ch02-b06
          speaker: narrator
          text: 过了一阵，谷里的草渐渐吃光。牧人又往巨人的土地深处走，找到一大片青草围场，把牛群赶了进去。不久，另一个凶野的巨人怒气冲冲地来了。
        - id: ch02-b07
          speaker: second_giant
          text: 嗨！哈！霍嘎莱赫！今晚只有喝你的血，才能解我的渴！
          emotion: angry
        - id: ch02-b08
          speaker: fisher_son
          text: 这也难说。说得容易，做起来可未必。
        - id: ch02-b09
          speaker: narrator
          text: 两人立刻斗在一起，刀剑一回又一回猛烈相撞。打了很久，巨人渐渐占了上风，牧人眼看就要落败，只得赶紧呼唤黑犬。黑犬应声而来，一跃咬住巨人的脖子。牧人抓住这个机会，飞快斩下巨人的头。那天夜里，他累得筋疲力尽才回到宫殿。可牛群挤出的奶若不是多得惊人，那才怪呢。宫殿上下一片欢喜，都庆幸请到了这样的牧人。
        - id: ch02-b10
          speaker: narrator
          text: 第二天，牧人来到巨人的城堡。一个满嘴奉承的矮小老太婆守在门前。
        - id: ch02-b11
          speaker: crone
          text: 愿福气和好运跟着你，渔夫的儿子！你肯光临，是王国的荣耀，也让这间小屋出了名。尊贵的人请先进门歇歇吧。
        - id: ch02-b12
          speaker: fisher_son
          text: 老太婆，你走前面。我不爱在门外听奉承话。进去再说。
        - id: ch02-b13
          speaker: narrator
          text: 老太婆走进门去，把后背留给了牧人。牧人立刻拔剑，一下斩掉她的头，自己的剑却也脱手飞了出去。老太婆飞快用两手抓起脑袋，往脖子上一放，转眼又恢复原样。黑犬扑向她，却被她举起魔棒一棒打倒，躺在地上动弹不得。牧人冲上去与她争夺魔棒，好不容易才抢到手。他照老太婆头顶重重打下一棒，她一眨眼便倒在地上。再往城堡深处走，那里尽是金银财宝，每一样都比另一样珍贵。牧人看罢仍旧回到国王那里，宫中又是一片欢腾。
    - id: ch03
      title: 三头巨兽
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 牧人又放了一阵牛。一天夜里，他赶牛回来，不见挤奶姑娘像往常那样问候，反见人人都在哭泣。他便追问缘故。
        - id: ch03-b02
          speaker: dairymaid
          text: 湖里住着一头三头巨兽，每年都要吃掉一个人。今年抽中了国王的女儿。明天正午，她得去湖水上游见那头丑恶巨兽。不过有位了不起的求婚者，说要救她。
          emotion: sad
        - id: ch03-b03
          speaker: fisher_son
          text: 那位求婚者是谁？
        - id: ch03-b04
          speaker: dairymaid
          text: 是统领大军的将军。国王已经答应，谁救下公主，就让谁娶她。
        - id: ch03-b05
          speaker: narrator
          text: 次日，约定的时辰快到了。公主和那位威风凛凛的将军一起出发，来到湖水上游的黑岩。等候不久，三头巨兽便在湖心搅动起来。将军一看清它的模样，顿时吓破了胆，偷偷溜走，找地方躲了起来。公主孤零零留在岩石旁，怕得浑身发抖，没有一个人来救她。这时，一个英武俊朗的年轻人骑着黑马赶来。他身穿华美衣裳，全副武装，黑犬紧随在后。
        - id: ch03-b06
          speaker: fisher_son
          text: 姑娘，你满面愁云，为什么独自在这里？
        - id: ch03-b07
          speaker: princess
          text: 没什么要紧的，反正我也活不了多久。刚才有位看起来不比你差的武士，也已经逃了。
          emotion: fearful
        - id: ch03-b08
          speaker: fisher_son
          text: 那可未必。肯留下迎战的，才配叫武士。
        - id: ch03-b09
          speaker: narrator
          text: 说完，他便带着剑和黑犬迎向巨兽。人与兽在湖中打得水花四溅，浪声轰鸣。黑犬使尽浑身本领，公主则被巨兽的吼声吓得手脚僵硬。年轻人刚沉到水下，巨兽又翻上水面。巨兽才沉下去，他又从浪中出现。双方这样起起落落，恶斗不休。最后，年轻人终于砍下它一颗脑袋。巨兽发出一声咆哮，大地之子，也就是山岩间的回声，立刻随着它的尖啸呼喊。整座湖从这一头到那一头全被搅成飞沫。转眼间，巨兽便消失了。
        - id: ch03-b10
          speaker: princess
          text: 愿好运和胜利跟随你！今晚我得救了，可它还会再来，除非剩下两颗头也被砍掉。
        - id: ch03-b11
          speaker: narrator
          text: 年轻人拾起兽头，用一个绳结把它牢牢穿住，叫公主第二天仍旧带来这里。公主取下一枚金戒指送给他，然后把兽头扛在肩上，踏上回宫的路。年轻人也离开湖岸，回去照看牛群。可公主没走多远，那位躲起来的将军就出现了，拦住她的去路。
        - id: ch03-b12
          speaker: general
          text: 你若不说是我砍下兽头，我就杀了你！
        - id: ch03-b13
          speaker: princess
          text: 我当然会说。除了你，还有谁砍下了巨兽的头呢？
        - id: ch03-b14
          speaker: narrator
          text: 回到宫殿时，兽头已经到了将军肩上。人人见公主平安归来，又见他提着血淋淋的兽头，都欢喜不尽，也都相信他明天一定能救下公主。
        - id: ch03-b15
          speaker: narrator
          text: 第二天，巨兽再次搅动湖水，将军也再次溜走。骑黑马的年轻人换了一身衣裳赶来，公主还是认出了他。
        - id: ch03-b16
          speaker: princess
          text: 见到你真好！但愿你今天也像昨天那样挥剑。快来歇口气吧。
        - id: ch03-b17
          speaker: narrator
          text: 没过多久，巨兽就在湖心喷出滚滚白气，年轻人立刻迎上去。噼里啪啦，扑通哗啦，湖上到处是巨兽的狂吼、兵刃的撞击和漫天飞浪。他们就这样恶斗了很久。直到夜色将临，年轻人才斩下第二颗头，把它也穿进原来的绳结。公主取下一只耳环送给他。他收好耳环，跃上黑马，又回去照看牛群。
        - id: ch03-b18
          speaker: narrator
          text: 将军又在半路夺走兽头，逼公主说这一次也是他的功劳。她仍用同样的话回答。两人带着兽头回宫，那里又是一片欢欣。
        - id: ch03-b19
          speaker: narrator
          text: 第三天差不多同一时刻，公主和将军再次出发。将军照旧找地方躲藏，公主只得独自来到湖岸。骑黑马的英雄随后赶到。这一天，巨兽比前两次更加凶恶，咆哮声可怕至极。可那也没有用，年轻人终于斩下它的第三颗头，穿进绳结，交给公主。公主把另一只耳环送给他，随后带着三颗兽头回了宫。
    - id: ch04
      title: 真正的英雄
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 宫中人人满面笑容，将军也定在第二天迎娶公主。婚礼已经张罗起来，大家只等牧师到来。可牧师一到，公主便说，她只肯嫁给不用割断绳结，就能取下三颗兽头的人。
        - id: ch04-b02
          speaker: king
          text: 除了当初把兽头系上去的人，还有谁解得开呢？
        - id: ch04-b03
          speaker: narrator
          text: 将军第一个走上前，抓住绳结摆弄半天，却怎么也解不开。接着，宫殿上下一个又一个都来试，直到人人都试遍了，还是没有一个能把兽头取下。国王问，屋里还有谁不曾动手。众人想了又想，这才记起牧人还没有试过。消息很快传到牛群那里，牧人被叫进宫中。他拿起绳结，随手抛弄几下，三颗兽头便一一脱落。
        - id: ch04-b04
          speaker: princess
          text: 慢着。斩下兽头的人手中，还有我的戒指和两只耳环。
        - id: ch04-b05
          speaker: narrator
          text: 牧人伸手进衣袋，把戒指和耳环丢在桌上。
        - id: ch04-b06
          speaker: princess
          text: 你才是我要嫁的人。
        - id: ch04-b07
          speaker: narrator
          text: 国王见女儿要嫁一个牧人，心里不大高兴，只得叫人给他换身好衣裳。公主却说，他自有一身华服，不比城堡里的任何衣裳差。牧人果然穿上巨人的金衣，当天就与公主成了婚。
        - id: ch04-b08
          speaker: narrator
          text: 婚后，两人一直过得很好。可有一天，正好又到了父亲当年把他许给海中仙女的那个日子。夫妻俩正在湖边漫步，海中仙女忽然现身，既不请求，也不等谁答应，直接把年轻人掳进湖里。公主从此为丈夫悲伤流泪，愁得眼前发黑。她守在湖边，目光总也离不开湖面。一位年老的预言家遇见她，听她讲完丈夫的遭遇，便告诉她该怎样把人救回来。
        - id: ch04-b09
          speaker: narrator
          text: 公主带着竖琴来到湖边，坐下弹奏。海中仙女最爱音乐，果然浮上来听。公主一见她，马上停手。
        - id: ch04-b10
          speaker: sea_maiden
          text: 接着弹！
        - id: ch04-b11
          speaker: princess
          text: 不行，除非我再看见丈夫。
        - id: ch04-b12
          speaker: narrator
          text: 海中仙女只好让年轻人的头露出湖面，公主看见丈夫，这才重新弹起竖琴。她弹了一阵又停手，直到海中仙女让他从水里露出半身。接着，公主第三次弹琴，又第三次停下。这一回，海中仙女终于把年轻人整个放出了湖面。他立刻呼唤猎鹰，自己也化作一只猎鹰，展开翅膀飞回岸上。可就在他脱身的时候，海中仙女却抓住公主，把他的妻子带走了。
    - id: ch05
      title: 藏在蛋里的灵魂
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 那天夜里，全城没有一个人不悲伤。公主的丈夫更是满怀哀痛，从白天到黑夜，又从黑夜到白天，一直沿着湖岸来回徘徊。老预言家再次遇见他，告诉他，世上只有一个办法能杀死海中仙女，救回妻子。
        - id: ch05-b02
          speaker: soothsayer
          text: 湖心岛上有一只白足母鹿，她的腿最细，脚步最快。就算抓住母鹿，也会有一只灰鸦从她身体里飞出来。抓住灰鸦，又会有一条鳟鱼跳出来。鳟鱼嘴里含着一枚蛋，海中仙女的灵魂就在蛋里。蛋一破，她就会死。
        - id: ch05-b03
          speaker: narrator
          text: 谁也无法坐船或木筏到湖心岛，因为只要有人驶进湖中，海中仙女就会把船沉掉。年轻人思来想去，决定骑黑马跳过岛与岸之间的水道。他果真这样做了。黑马奋力一跃，跨过水面，稳稳落在岛上。年轻人看见那只白足母鹿，马上放自己的黑犬追去。可是他和狗赶到岛的这一头，母鹿便跑到另一头。他们再追过去，母鹿又折回原处，怎么也追不上。
        - id: ch05-b04
          speaker: fisher_son
          text: 要是那条分过羊肉的黑犬在这里就好了！
        - id: ch05-b05
          speaker: narrator
          text: 话音才落，那条分过羊肉、始终记着恩情的黑犬便来到他身旁。它立刻飞奔出去，追赶岛上的母鹿。没过多久，年轻人和黑犬便把她撂倒在地。可年轻人才伸手抓住母鹿，一只灰鸦就从她身体里猛地飞了出来。
        - id: ch05-b06
          speaker: fisher_son
          text: 要是那只眼睛最尖、翅膀最快的灰猎鹰也在这里就好了！
        - id: ch05-b07
          speaker: narrator
          text: 猎鹰应声而来，追上灰鸦，很快把她击落。灰鸦落在湖岸，一条鳟鱼又从她身体里跳进水中。
        - id: ch05-b08
          speaker: fisher_son
          text: 水獭啊，你现在要是在我身边该多好！
        - id: ch05-b09
          speaker: narrator
          text: 话一出口，水獭便出现在他身旁，随即纵身跃入湖中。它划开水面，一路追到湖心，终于咬住鳟鱼，把它叼回岸边。水獭刚带着鱼爬上岸，一枚蛋便从鳟鱼嘴里滚了出来。年轻人猛扑过去，把脚牢牢踩在蛋上。到了这时，海中仙女终于现身。
        - id: ch05-b10
          speaker: sea_maiden
          text: 别踩破那枚蛋。你要什么，我都给你。
          emotion: fearful
        - id: ch05-b11
          speaker: fisher_son
          text: 把我的妻子还给我！
        - id: ch05-b12
          speaker: narrator
          text: 转眼间，公主已经回到他身边。年轻人用双手紧紧握住妻子的手，脚下随即用力，踩碎了那枚蛋。海中仙女就在他的眼前死了。
