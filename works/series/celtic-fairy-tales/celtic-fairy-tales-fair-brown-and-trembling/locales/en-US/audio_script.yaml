  chapters:
    - id: ch01
      title: The First Sunday
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: King Hugh Curucha lived in Tir Conal with his three daughters. Their names were Fair, Brown, and Trembling. Every Sunday, Fair and Brown put on their new dresses and went to church. Trembling was left behind to do the cooking and all the work. Her sisters would not let her step outside the house at all. Trembling was more beautiful than either of them, and Fair and Brown lived in fear that their youngest sister might marry before they did.
        - id: ch01-b02
          speaker: narrator
          text: Seven years passed in this way. Then the prince of Emania fell in love with Fair, the eldest sister.
        - id: ch01-b03
          speaker: narrator
          text: One Sunday morning, Fair and Brown went to church. The old henwife came into the kitchen and found Trembling at work.
        - id: ch01-b04
          speaker: henwife
          text: You should be at church today, not working here at home.
        - id: ch01-b05
          speaker: trembling
          text: How can I go? I have nothing fine enough to wear. If my sisters saw me there, they would kill me for leaving the house.
        - id: ch01-b06
          speaker: henwife
          text: I'll give you a dress finer than any they've ever seen. Tell me what you want.
        - id: ch01-b07
          speaker: trembling
          text: I want a dress as white as snow, with green shoes on my feet.
        - id: ch01-b08
          speaker: narrator
          text: The henwife put on the cloak of darkness. She clipped a piece from the old clothes Trembling was wearing. Then she asked for the whitest and most beautiful robes in the whole world, and for a pair of green shoes. The robes and shoes appeared that very moment. The henwife carried them to Trembling, and Trembling put them on.
        - id: ch01-b09
          speaker: henwife
          text: Here is a honey-bird for your right shoulder and a honey-finger for your left. Outside you'll find a milk-white mare, with a golden saddle and a golden bridle.
        - id: ch01-b10
          speaker: narrator
          text: Trembling mounted the mare, and the henwife gave her a warning.
        - id: ch01-b11
          speaker: henwife
          text: Do not go through the church door. The instant everyone rises at the end of Mass, ride home as fast as the mare can carry you.
        - id: ch01-b12
          speaker: narrator
          text: Trembling rode to the church and stopped at the door, just as the henwife had told her. Everyone inside who caught even one glimpse of her strained to see more and tried to learn who she was. At the end of Mass, the people rose, and Trembling hurried away. They poured out of the church and ran after her, but running did them no good. She was gone before any man came near. All the way home, she overtook the wind before her and outran the wind behind.
        - id: ch01-b13
          speaker: narrator
          text: At home, the henwife had dinner waiting. Trembling slipped out of the white robes and into her old dress in a twinkling.
        - id: ch01-b14
          speaker: henwife
          text: Did you hear any news at church today?
        - id: ch01-b15
          speakers: [fair, brown]
          ensemble: duo
          text: Great news! A magnificent lady stood at the church door. We have never seen robes like hers. Our dresses looked like nothing beside them, and every man there, from king to beggar, was trying to see her and find out who she was.
        - id: ch01-b16
          speaker: narrator
          text: After that, the sisters gave no one any peace until they had dresses like the stranger's. But no honey-birds or honey-fingers could be found.
    - id: ch02
      title: The Second Sunday
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next Sunday, the sisters went to church again and left Trembling to cook dinner. Once they were gone, the henwife came in.
        - id: ch02-b02
          speaker: henwife
          text: Will you go to church today?
        - id: ch02-b03
          speaker: trembling
          text: I would, if I could find a way to go.
        - id: ch02-b04
          speaker: henwife
          text: What robes would you wear?
        - id: ch02-b05
          speaker: trembling
          text: The finest black satin there is, with red shoes for my feet.
        - id: ch02-b06
          speaker: henwife
          text: And what color should the mare be?
        - id: ch02-b07
          speaker: trembling
          text: So black and glossy that I can see my own reflection in her coat.
        - id: ch02-b08
          speaker: narrator
          text: The henwife put on the cloak of darkness and asked for the robes and the mare. They appeared at once. When Trembling was dressed, the henwife placed the honey-bird and honey-finger on her shoulders. The black mare wore a silver saddle and bridle.
        - id: ch02-b09
          speaker: narrator
          text: Again, the henwife ordered Trembling to stay outside the church and race home the moment Mass ended, before any man could stop her.
        - id: ch02-b10
          speaker: narrator
          text: When Trembling reached the church that Sunday, the people were even more astonished than before. They gazed at her black satin robes, and they could think of nothing but discovering who she was. They watched and waited through Mass. Yet the moment the people rose at the end, she slipped away from the church, sprang into the silver saddle, and raced for home. Not one man could stop her or get close enough to speak to her.
        - id: ch02-b11
          speaker: narrator
          text: Dinner was ready. Trembling took off the satin robes and put on her old clothes before her sisters returned.
        - id: ch02-b12
          speaker: henwife
          text: What news did you hear today?
        - id: ch02-b13
          speakers: [fair, brown]
          ensemble: duo
          text: We saw the grand stranger again! After looking at her black satin, no man could think anything of our dresses. Everyone in church, high and low, stood openmouthed and stared at her. No one looked at us.
        - id: ch02-b14
          speaker: narrator
          text: Fair and Brown would give neither rest nor peace until they found dresses as close to the stranger's robes as they could get. Their dresses could never be as fine, because no robes like hers could be found anywhere in Erin.
    - id: ch03
      title: The Lost Shoe
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On the third Sunday, Fair and Brown wore black satin to church. They left Trembling in the kitchen with orders to have dinner ready. As soon as they were out of sight, the henwife appeared.
        - id: ch03-b02
          speaker: henwife
          text: Well, my dear, are you going to church today?
        - id: ch03-b03
          speaker: trembling
          text: I would go if I had a new dress.
        - id: ch03-b04
          speaker: henwife
          text: Ask for any dress you like. What shall it be?
        - id: ch03-b05
          speaker: trembling
          text: From the waist down, red as a rose. From the waist up, white as snow. I want a green cape, and a hat with one red feather, one white feather, and one green. My shoes should have red toes, white middles, and green backs and heels.
        - id: ch03-b06
          speaker: narrator
          text: Once more, the henwife put on the cloak of darkness. She wished for everything Trembling had named, and every piece appeared. The henwife helped her into the red and white dress, laid the green cape over her shoulders, and set the honey-bird on her right and the honey-finger on her left. Last of all, she placed the feathered hat on Trembling's head. She snipped a few hairs from one lock, then a few from another. At that very moment, the most beautiful golden hair flowed down over Trembling's shoulders.
        - id: ch03-b07
          speaker: henwife
          text: What sort of mare will you ride?
        - id: ch03-b08
          speaker: trembling
          text: A white mare covered in blue and gold diamond-shaped spots, with a golden saddle and bridle.
        - id: ch03-b09
          speaker: narrator
          text: The mare stood before the door. A bird sat between her ears. It began to sing when Trembling mounted and never stopped until she came home again.
        - id: ch03-b10
          speaker: narrator
          text: By now, news of the beautiful stranger had spread through the world. All the princes and great men who heard of her came to church that Sunday. Each one hoped that he would be the man to take her home after Mass. The prince of Emania had once loved Fair, but now he forgot all about the eldest sister. He stayed outside the church so he could catch the stranger before she hurried away.
        - id: ch03-b11
          speaker: narrator
          text: The church was fuller than ever, and three times as many people stood outside. The crowd was so thick that Trembling could get no farther than the gate.
        - id: ch03-b12
          speaker: narrator
          text: As soon as the people began to rise at the end of Mass, Trembling slipped back through the gate. In an instant, she was in the golden saddle and sweeping away ahead of the wind. Yet the prince of Emania was right beside her. He seized her by the foot and ran alongside the mare. For thirty perches he held on, and he would not release the beautiful lady. At last, the shoe was pulled from her foot. The prince fell behind with it still in his hand.
        - id: ch03-b13
          speaker: narrator
          text: Trembling raced home, afraid the henwife would kill her for losing the shoe. The old woman saw her troubled face.
        - id: ch03-b14
          speaker: henwife
          text: What has upset you now?
        - id: ch03-b15
          speaker: trembling
          text: Oh, one of my shoes came off!
        - id: ch03-b16
          speaker: henwife
          text: Never mind. Don't trouble yourself. Losing it may be the best thing that ever happened to you.
          emotion: calm
        - id: ch03-b17
          speaker: narrator
          text: Trembling returned everything to the henwife, put on her old clothes, and went back to the kitchen.
        - id: ch03-b18
          speaker: henwife
          text: What news came from church today?
        - id: ch03-b19
          speakers: [fair, brown]
          ensemble: duo
          text: We saw the grandest sight yet! The strange lady came in finer array than ever. She and her horse wore the loveliest colors in the world. A bird between the mare's ears sang from the moment she arrived until she left. The lady herself is the most beautiful woman any man in Erin has ever seen.
        - id: ch03-b20
          speaker: narrator
          text: Once Trembling had vanished, the prince of Emania spoke to the other princes.
        - id: ch03-b21
          speaker: prince_emania
          text: That lady will be my wife.
        - id: ch03-b22
          speakers: [prince_lochlin, prince_spain, prince_nyerfoi, prince_greece]
          ensemble: chorus
          text: Taking her shoe does not mean you've won her. You must fight us before you can claim her.
        - id: ch03-b23
          speaker: prince_emania
          text: First let me find the woman whose foot fits this shoe. Then I'll fight for her before I surrender her to any one of you.
    - id: ch04
      title: The Woman the Shoe Fits
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Every prince grew restless and anxious to know who had lost the shoe. They formed one great company and set out together. They made the whole round of Erin, traveling north, south, east, and west. Wherever there was a woman to be found, they went to see her. They did not leave one house in the kingdom unsearched. The woman might be rich or poor, highborn or low. It made no difference to them. Through all that traveling, the prince of Emania kept the shoe in his own care.
        - id: ch04-b02
          speaker: narrator
          text: Whenever the young women saw the shoe, their hopes rose. It seemed a proper size, neither large nor small, though no man could tell what strange material it was made of. One woman thought it would fit if she cut a little from her great toe. Another had a foot that was too short, so she pushed something into the tip of her stocking. Nothing helped. The shoe fit none of them. They only spoiled their feet and had to spend months afterward trying to cure them.
        - id: ch04-b03
          speaker: narrator
          text: Fair and Brown heard that the princes were searching Erin, and every day they talked of trying on the shoe. At last, Trembling spoke.
        - id: ch04-b04
          speaker: trembling
          text: Perhaps the shoe will fit my foot.
        - id: ch04-b05
          speakers: [fair, brown]
          ensemble: duo
          text: May you break a dog's foot! Why say such a thing when you stayed home every Sunday?
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: They waited and scolded Trembling until the princes drew near. On the day the company was due, the sisters locked her in a closet.
        - id: ch04-b07
          speaker: narrator
          text: The prince of Emania handed the shoe to Fair and Brown. They tried again and again, but neither could wear it.
        - id: ch04-b08
          speaker: prince_emania
          text: Is there another young woman in this house?
        - id: ch04-b09
          speaker: trembling
          text: Yes. I'm here in the closet.
        - id: ch04-b10
          speakers: [fair, brown]
          ensemble: duo
          text: She's only here to carry out the ashes.
        - id: ch04-b11
          speaker: narrator
          text: The princes refused to leave without seeing her, so the sisters had to unlock the door. Trembling came out, and the shoe fitted her exactly.
        - id: ch04-b12
          speaker: prince_emania
          text: You are the woman this shoe belongs to. You are the woman I took it from.
        - id: ch04-b13
          speaker: trembling
          text: Wait here until I come back.
        - id: ch04-b14
          speaker: narrator
          text: Trembling went to the henwife. The old woman put on the cloak of darkness and dressed her just as she had on the first Sunday, then set her on the white mare. Trembling rode up the highway to the house.
        - id: ch04-b15
          speakers: [prince_lochlin, prince_spain, prince_nyerfoi, prince_greece]
          ensemble: chorus
          text: This is the lady we saw on the first Sunday.
        - id: ch04-b16
          speaker: narrator
          text: Trembling left again and returned on the black mare, wearing the second dress.
        - id: ch04-b17
          speakers: [prince_lochlin, prince_spain, prince_nyerfoi, prince_greece]
          ensemble: chorus
          text: That is the lady we saw on the second Sunday.
        - id: ch04-b18
          speaker: narrator
          text: She asked to leave once more. Soon she came back in the third dress, riding the third mare.
        - id: ch04-b19
          speakers: [prince_lochlin, prince_spain, prince_nyerfoi, prince_greece]
          ensemble: chorus
          text: That is the lady we saw on the third Sunday.
        - id: ch04-b20
          speaker: narrator
          text: Every man was satisfied. They knew Trembling was the stranger from the church.
        - id: ch04-b21
          speakers: [prince_lochlin, prince_spain, prince_nyerfoi, prince_greece]
          ensemble: chorus
          text: Now you must fight for her before we let her go with you.
        - id: ch04-b22
          speaker: prince_emania
          text: I stand ready to meet you in combat.
        - id: ch04-b23
          speaker: narrator
          text: The prince of Lochlin was the first to step forward. A terrible struggle began between him and the prince of Emania. They fought for nine hours before Lochlin stopped, gave up his claim to Trembling, and left the field. The next day, the prince of Spain took his turn. He fought for six hours, then yielded his claim. On the third day, the prince of Nyerfoi fought for eight hours before he stopped. On the fourth day, the prince of Greece fought for six hours, and then he too gave up.
        - id: ch04-b24
          speaker: narrator
          text: By the fifth day, no other foreign prince wished to fight. The princes of Erin would not battle a man from their own land. The strangers had taken their chance, and no other claimant came. So Trembling belonged by right to the prince of Emania.
    - id: ch05
      title: Fair's Betrayal
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The wedding day was fixed, and invitations were sent out far and wide. Trembling and the prince were married, and their wedding lasted for a year and a day. When at last the celebration ended, the prince brought his bride home with him. In time, Trembling gave birth to a son. She sent for Fair, her eldest sister, and asked her to come and stay, to be with Trembling and care for her.
        - id: ch05-b02
          speaker: narrator
          text: When Trembling was well again, and her husband was away hunting, the sisters walked to the seaside. There, Fair pushed Trembling into the water. A great whale came and swallowed her.
        - id: ch05-b03
          speaker: narrator
          text: Fair returned alone. The prince asked about his wife.
        - id: ch05-b04
          speaker: prince_emania
          text: Where is your sister?
        - id: ch05-b05
          speaker: fair
          text: She went home to our father in Ballyshannon. Now that I'm well, I no longer need her.
        - id: ch05-b06
          speaker: prince_emania
          text: As I look at you, I fear it is my wife who has gone.
        - id: ch05-b07
          speaker: fair
          text: Oh, no. Fair is the sister who left.
        - id: ch05-b08
          speaker: narrator
          text: The sisters looked so much alike that the prince could not be sure. That night, he laid his sword between them.
        - id: ch05-b09
          speaker: prince_emania
          text: If you are truly my wife, this sword will grow warm. If you are not, it will remain cold.
        - id: ch05-b10
          speaker: narrator
          text: In the morning, the sword was just as cold as when he had put it there.
    - id: ch06
      title: The Cowboy's Message
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Fair did not know that a young cowboy had been down by the water, minding cattle, when the two sisters walked along the shore. The boy saw Fair push Trembling into the sea. He was there again the following day. As the tide came in, he saw the great whale swim close to shore and throw Trembling out of its mouth onto the sand.
        - id: ch06-b02
          speaker: trembling
          text: When you take the cows home tonight, tell your master what happened. Yesterday, my sister Fair pushed me into the sea, and a whale swallowed me. It has thrown me out now, but it will swallow me again with the next tide. Then it will go out with the tide and return tomorrow to cast me onto the shore again.
        - id: ch06-b03
          speaker: trembling
          text: The whale will throw me out three times. I am under its enchantment, so I cannot leave this beach or save myself. If my husband does not rescue me before the fourth swallowing, I will be lost. He must shoot the whale with a silver bullet when it turns onto the broad of its back. Beneath its breast fin is a reddish-brown spot. That is the only place where it can be killed.
        - id: ch06-b04
          speaker: narrator
          text: When the cowboy reached home, Fair gave him a draught of oblivion. He forgot the message and said nothing.
        - id: ch06-b05
          speaker: narrator
          text: The next day, he went back to the sea. Again, the whale cast Trembling onto the shore.
        - id: ch06-b06
          speaker: trembling
          text: Did you give your master my message?
        - id: ch06-b07
          speaker: cowboy
          text: No. I forgot it.
        - id: ch06-b08
          speaker: trembling
          text: How did you come to forget?
        - id: ch06-b09
          speaker: cowboy
          text: The woman of the house gave me a drink, and it made me forget.
        - id: ch06-b10
          speaker: trembling
          text: Then be sure to tell him tonight. If she offers you another drink, do not take it.
        - id: ch06-b11
          speaker: narrator
          text: That evening, the cowboy drove the cattle home. Fair was waiting, and once again she offered him a drink. This time, he remembered Trembling's warning. He would not touch the cup until he had found the prince. Then he repeated everything Trembling had told him about the whale, the three tides, the fourth swallowing, and the one reddish-brown spot where a silver bullet could kill the creature.
    - id: ch07
      title: The Silver Bullet
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: On the third day, the prince went down to the shore. He carried his gun with a silver bullet loaded inside it. He had not been waiting long when the whale came in with the tide. Just as it had on the two days before, it swam close and threw Trembling onto the beach. Her husband could see her there, but the enchantment still held her. She had no power to speak to him until he had killed the whale.
        - id: ch07-b02
          speaker: narrator
          text: The whale swam away from the beach. Then it rolled once onto the broad of its back. The reddish-brown spot beneath its breast fin showed for only a moment. The prince had a single chance, and a very short one. He raised the gun and fired. The silver bullet struck the spot. Mad with pain, the whale thrashed until the sea all around it turned red with blood. Then it died.
        - id: ch07-b03
          speaker: narrator
          text: At once, Trembling could speak. She went home with her husband, and he sent word to her father telling him what Fair had done. King Hugh came to them.
        - id: ch07-b04
          speaker: king_hugh
          text: Give her any death you choose.
        - id: ch07-b05
          speaker: prince_emania
          text: I leave the choice of her life or death to you.
        - id: ch07-b06
          speaker: narrator
          text: The king made his choice. He had Fair shut inside a barrel and put out upon the sea. The barrel held enough provisions to last her for seven years.
        - id: ch07-b07
          speaker: narrator
          text: After some time had passed, Trembling had a second child, a daughter. She and the prince remembered the brave young cowboy who had carried the message that saved her. They sent him to school and brought him up with the same care they gave their own children.
        - id: ch07-b08
          speakers: [trembling, prince_emania]
          ensemble: duo
          text: If our little daughter lives, no other man in the world shall marry her but him.
        - id: ch07-b09
          speaker: narrator
          text: The cowboy and the prince's daughter grew up, and at last they married.
        - id: ch07-b10
          speaker: trembling
          text: Without that little cowboy, you could never have saved me from the whale. For that reason, I do not begrudge him our daughter.
        - id: ch07-b11
          speaker: narrator
          text: Trembling and the prince of Emania had fourteen children, and they lived happily until both died of old age.
