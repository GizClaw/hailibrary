audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, legendary, and composed
        timbre: rich and clear
        pace: measured
        pitch: medium
    tailor:
      display_name: Sprightly Tailor
      tts:
        delivery: lively, fearless, and quick-witted
        timbre: bright and wiry
        pace: brisk
        pitch: medium-high
    apparition:
      display_name: Apparition
      tts:
        delivery: menacing, thunderous, and relentless
        timbre: cavernous and rough
        pace: slow
        pitch: very low
  chapters:
    - id: ch01
      title: The Laird's Challenge
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A lively tailor once worked for the great Macdonald at Saddell Castle. The laird wanted a pair of old-fashioned trews. In those days, trews joined vest and breeches in one fringed piece. They were comfortable to wear, whether a man was walking or dancing. Macdonald offered the tailor a fine reward if he would make them at night in the old ruined church. People believed the place was haunted, and they said fearful things could be seen there after dark.
        - id: ch01-b02
          speaker: narrator
          text: The tailor knew all about the haunting. Still, he was a spirited man. When the laird dared him to sew there, he would not be frightened away from the prize. Night came, and off he went up the glen. The old church stood about half a mile from the castle. Inside, he chose a fine gravestone for his seat, lit his candle, put on his thimble, and started work on the trews. He drove the needle nimbly through the cloth and thought about the payment the laird would have to give him.
    - id: ch02
      title: The Thing Beneath the Floor
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: For a while, the work went smoothly. Then the whole floor began trembling under the tailor's feet. He looked around, though his fingers never stopped. There in the church, a huge human head was slowly rising through the stone pavement. When the head came clear of the floor, a great, great voice rang out from it.
        - id: ch02-b02
          speaker: apparition
          text: Do you see this great head of mine?
        - id: ch02-b03
          speaker: tailor
          text: I see that, but I'll sew this!
        - id: ch02-b04
          speaker: narrator
          text: The sprightly tailor went right on stitching. The head rose farther until its neck showed, and the voice thundered once more.
        - id: ch02-b05
          speaker: apparition
          text: Can you see this great neck of mine?
        - id: ch02-b06
          speaker: tailor
          text: I can see it, but I'm sewing this!
        - id: ch02-b07
          speaker: narrator
          text: Still the needle flew over the trews. The head and neck climbed higher and higher. Then enormous shoulders and a great chest appeared above the ground.
        - id: ch02-b08
          speaker: apparition
          text: Look at this great chest of mine! Do you see it?
        - id: ch02-b09
          speaker: tailor
          text: I see it, but I'll finish sewing this!
        - id: ch02-b10
          speaker: narrator
          text: He stitched on as the creature kept rising. Soon it thrust two huge arms into the tailor's face.
        - id: ch02-b11
          speaker: apparition
          text: Do you see these great arms of mine?
        - id: ch02-b12
          speaker: tailor
          text: I see them, but I'll keep sewing this!
        - id: ch02-b13
          speaker: narrator
          text: Now the tailor stitched as hard and fast as he could, because he knew time was running out.
    - id: ch03
      title: The Final Stitches
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: He began taking long stitches. All the while, the thing rose little by little through the floor. At last it pulled out one gigantic leg and stamped that foot against the stone pavement.
        - id: ch03-b02
          speaker: apparition
          text: Do you see this great leg of mine?
        - id: ch03-b03
          speaker: tailor
          text: Aye, aye, I see it, but I'll sew this!
        - id: ch03-b04
          speaker: narrator
          text: The tailor cried out as his fingers raced with the needle. He knew there was not a moment to lose. His stitches grew so long that he reached the very end of the trews just as the creature began lifting its other leg. Before it could drag that leg free of the pavement, his work was done.
        - id: ch03-b05
          speaker: narrator
          text: He blew out the candle, sprang from the gravestone, gathered himself, and ran from the church with the trews tucked under his arm. Behind him, the fearful thing let out a mighty roar. It stamped both feet on the pavement, rushed out of the church, and went racing after the sprightly tailor.
    - id: ch04
      title: The Race to Saddell Castle
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Down the glen they tore, faster than a stream when a flood rides it. The tailor had a head start and a nimble pair of legs, and he had no wish to lose the laird's reward. The monster roared after him and ordered him to stop. But this tailor was not the man to put himself in a monster's power. He held the trews tight and ran so fast that no darkness had time to gather under his feet.
        - id: ch04-b02
          speaker: narrator
          text: At last he reached Saddell Castle. The moment he slipped through the gate, he slammed it shut. The apparition arrived right behind him. Furious at losing its prize, it struck the wall above the gate and left the marks of five enormous fingers. If you peer closely enough, you may see them there to this day.
        - id: ch04-b03
          speaker: narrator
          text: The sprightly tailor won his reward. Macdonald paid him handsomely for the trews and never noticed that a few of the stitches were rather long.
