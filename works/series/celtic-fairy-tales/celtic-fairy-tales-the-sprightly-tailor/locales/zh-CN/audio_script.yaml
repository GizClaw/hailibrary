audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    tailor:
      display_name: 机灵的裁缝
      tts:
        delivery: 胆大机敏，答话干脆，越到紧要关头语速越快
        timbre: 明亮结实
        pace: 轻快
        pitch: 中高音
    apparition:
      display_name: 教堂里的怪物
      tts:
        delivery: 阴森逼人，发问时带着雷鸣般的威势
        timbre: 低沉浑厚
        pace: 缓慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 夜赴老教堂
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，势力显赫的麦克唐纳住在萨德尔城堡。他请来一个机灵的裁缝，要他做一条古时候穿的特鲁斯连身裤。这种衣裤上下连在一起，边上还有流苏，穿起来舒服，不论走路还是跳舞都很合适。
        - id: ch01-b02
          speaker: narrator
          text: 麦克唐纳答应，只要裁缝敢在夜里到教堂做完这条裤子，就给他一笔丰厚的酬金。那可不是一座寻常的教堂。它早已破败，据说鬼魂常在那里出没，夜里还会冒出种种吓人的东西。
        - id: ch01-b03
          speaker: narrator
          text: 裁缝当然听过这些传闻，可他既机灵又勇敢。领主拿这件事来激他，他偏不退缩，决心把赏金挣到手。天一黑，他便离开城堡，沿着山谷走了大约半英里，来到老教堂。
        - id: ch01-b04
          speaker: narrator
          text: 他找了一块平整的墓碑坐下，点起蜡烛，戴好顶针，开始缝那条特鲁斯裤。针线在手里飞快地来回穿梭，他一心想着领主答应的酬金。
    - id: ch02
      title: 石板下的怪物
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 开头一切都很顺当。缝了一阵，裁缝突然觉得脚下不停地发抖。他抬头看了看，手指却没有停。只见教堂的石板地面下，正慢慢升起一颗大得吓人的脑袋。脑袋刚一露出来，一个极其洪亮的声音便响了起来。
        - id: ch02-b02
          speaker: apparition
          text: 你瞧见我这颗大脑袋了吗？
        - id: ch02-b03
          speaker: tailor
          text: 我看见了，可我还得缝这个！
        - id: ch02-b04
          speaker: narrator
          text: 裁缝回答完，手里的裤子照缝不误。那颗脑袋还在往上升，很快连脖子也从石板下伸了出来。雷鸣般的声音又问他。
        - id: ch02-b05
          speaker: apparition
          text: 你瞧见我这条大脖子了吗？
        - id: ch02-b06
          speaker: tailor
          text: 我看见了，可我还得缝这个！
        - id: ch02-b07
          speaker: narrator
          text: 他手里的针还是一刻不停。那东西越升越高，宽阔的肩膀和巨大的胸膛也钻出了地面。那个雄浑的声音再次震响整座教堂。
        - id: ch02-b08
          speaker: apparition
          text: 这回，你看见我这副大胸膛了吗？
        - id: ch02-b09
          speaker: tailor
          text: 我看见了，可我还得缝这个！
        - id: ch02-b10
          speaker: narrator
          text: 裁缝仍旧埋头干活。怪物继续从石板下面往上冒，接着把两条巨大的胳膊伸到他脸前挥舞起来。
        - id: ch02-b11
          speaker: apparition
          text: 那你看见我这双大胳膊了吗？
        - id: ch02-b12
          speaker: tailor
          text: 我看见了，可我还得缝这个！
        - id: ch02-b13
          speaker: narrator
          text: 裁缝知道时间不多了，便使足力气拼命缝。每一针都迈得很长。怪物也在一点一点升高，终于从地底拔出一条巨腿，狠狠跺在石板上。随后，它吼着问道。
        - id: ch02-b14
          speaker: apparition
          text: 你看见我这条大腿了吗？
        - id: ch02-b15
          speaker: tailor
          text: 看见了，看见了，可我还得缝这个！
        - id: ch02-b16
          speaker: narrator
          text: 裁缝大喊着，手指带着针飞快穿梭，一针比一针更长。眼看裤子就要缝好，怪物也抬起另一条腿，正要把它拔出石板。可那条腿还没挣出来，裁缝已经收完了最后一针。
        - id: ch02-b17
          speaker: narrator
          text: 他吹灭蜡烛，从墓碑上跳下来，把特鲁斯裤往腋下一夹，冲出了教堂。怪物发出震天的怒吼，两只脚重重踏上石板，紧跟着追了出去。
    - id: ch03
      title: 城堡墙上的手印
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一人一怪沿着山谷飞奔，跑得比洪水暴涨时的溪流还快。裁缝本来就抢先了一步，又有一双轻快的腿。他可不愿把领主的赏金丢掉，便死死夹住裤子，一刻不停地往萨德尔城堡跑。
        - id: ch03-b02
          speaker: apparition
          text: 给我站住！
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: 怪物在后面吼个不停，可机灵的裁缝哪里会听一个妖怪的话。他脚下片刻不停，终于冲进城堡大门，立刻把门关上。门才合拢，幽灵就追到了外面。它没能抓住自己的猎物，气得一掌打在大门上方的墙壁上，留下五根巨大手指的印痕。直到今天，只要你凑近仔细看，仍能把那五道手印看得清清楚楚。
        - id: ch03-b04
          speaker: narrator
          text: 就这样，机灵的裁缝得到了赏金。麦克唐纳为那条特鲁斯裤付给他丰厚的酬劳，却始终没有发现，裤子上有几针缝得稍微长了那么一点。
