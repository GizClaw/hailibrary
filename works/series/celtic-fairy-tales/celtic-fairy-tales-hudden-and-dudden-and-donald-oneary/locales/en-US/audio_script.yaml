  chapters:
    - id: ch01
      title: Donald's Little Strip of Grass
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there were two farmers named Hudden and Dudden. Their yards were full of poultry, sheep grazed on their uplands, and scores of cattle filled the meadows beside the river. Yet neither man was happy.
        - id: ch01-b02
          speaker: narrator
          text: Between their farms lived a poor man called Donald O'Neary. He had only a hovel, a thin strip of grass, and one cow named Daisy. There was scarcely enough grass to keep Daisy alive. Though she did her best, Donald seldom got even a drink of milk or a roll of butter from her.
        - id: ch01-b03
          speaker: narrator
          text: There seemed to be nothing there for rich men to envy. But the more Hudden and Dudden owned, the more they wanted. At night they lay awake, planning how to take Donald's little patch of land. They gave no thought to poor Daisy, who was nothing but skin and bones.
        - id: ch01-b04
          speaker: narrator
          text: One day Hudden met Dudden, and before long they were grumbling about Donald as usual.
        - id: ch01-b05
          speakers: [hudden, dudden]
          ensemble: duo
          text: If only we could drive that vagabond Donald O'Neary out of the country!
        - id: ch01-b06
          speaker: hudden
          text: We should kill Daisy. If that doesn't make him leave, nothing will.
        - id: ch01-b07
          speaker: narrator
          text: Dudden agreed at once. Before darkness had fully fallen, the two men crept to Daisy's little shed. She lay there trying to chew her cud, though all the grass she had eaten that day would scarcely have covered a hand.
        - id: ch01-b08
          speaker: narrator
          text: Donald came to make sure Daisy was snug for the night. The poor creature had time to lick his hand just once, and then she died.
        - id: ch01-b09
          speaker: narrator
          text: Donald was heartbroken, but he was also shrewd. He began wondering whether any good could still come from Daisy's death. He thought for a long while. Early the next morning, he set out for the fair with her hide over his shoulder and every penny he owned jingling in his pockets.
    - id: ch02
      title: The Hide That Gave Money
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Just before Donald reached the fair, he cut several little slits in the hide and tucked one penny into each. Then he strode into the finest inn in town as boldly as if he owned it. He hung the hide from a nail on the wall and took a seat.
        - id: ch02-b02
          speaker: donald_oneary
          text: Bring me some of your best whisky.
        - id: ch02-b03
          speaker: narrator
          text: The landlord did not care for the look of him, and Donald saw his doubt at once.
        - id: ch02-b04
          speaker: donald_oneary
          text: Are you afraid I can't pay? This hide gives me all the money I need.
        - id: ch02-b05
          speaker: narrator
          text: Donald struck the hide with his stick, and out sprang a penny. The landlord's eyes opened wide.
        - id: ch02-b06
          speaker: landlord
          text: What would you take for that hide?
        - id: ch02-b07
          speaker: donald_oneary
          text: My good man, it isn't for sale.
        - id: ch02-b08
          speaker: landlord
          text: Would you take one gold piece for it?
        - id: ch02-b09
          speaker: donald_oneary
          text: I told you, it isn't for sale. Why, this hide has supported my family for years.
        - id: ch02-b10
          speaker: narrator
          text: He struck it again, and a second penny jumped out. In the end, the landlord offered thirty gold pieces, and Donald finally let him have the hide.
        - id: ch02-b11
          speaker: narrator
          text: That same evening Donald walked up to Hudden's door.
        - id: ch02-b12
          speaker: donald_oneary
          text: Good evening, Hudden. Could you lend me your best pair of scales?
        - id: ch02-b13
          speaker: narrator
          text: Hudden stared and scratched his head, but he handed over the scales. At home, Donald poured out his bright gold and weighed the pieces one by one. Hudden had hidden a lump of butter in the bottom of the scales, so the last gold piece stuck there when Donald returned them.
        - id: ch02-b14
          speaker: narrator
          text: Hudden had stared before. Now he stared ten times harder. The moment Donald turned away, Hudden raced to Dudden as fast as his legs could carry him.
        - id: ch02-b15
          speaker: hudden
          text: Good evening, Dudden. That cursed vagabond—
        - id: ch02-b16
          speaker: dudden
          text: You mean Donald O'Neary?
        - id: ch02-b17
          speaker: hudden
          text: Who else? He's back home weighing sackfuls of gold!
        - id: ch02-b18
          speaker: dudden
          text: How can you know that?
        - id: ch02-b19
          speaker: hudden
          text: He borrowed my scales. Look. One of his gold pieces is still stuck to them.
        - id: ch02-b20
          speaker: narrator
          text: Together they hurried to Donald's hovel. He had divided the money into piles of ten, except for the pile left short by the coin on Hudden's scales. The two men pushed straight inside without asking leave.
        - id: ch02-b21
          speakers: [hudden, dudden]
          ensemble: duo
          text: Well, I never!
        - id: ch02-b22
          speaker: donald_oneary
          text: Good evening, Hudden. Good evening, Dudden. You thought you had played a fine trick on me, but you never did me a better turn. When I found poor Daisy dead, I knew her hide might bring me something. And so it did. Hides are worth their weight in gold at the market just now.
        - id: ch02-b23
          speaker: narrator
          text: Hudden nudged Dudden, and Dudden winked back.
        - id: ch02-b24
          speakers: [hudden, dudden]
          ensemble: duo
          text: Good evening, Donald O'Neary.
        - id: ch02-b25
          speaker: donald_oneary
          text: Good evening, kind friends.
    - id: ch03
      title: Hides Worth Their Weight in Gold
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: By the next day, Hudden and Dudden had killed every cow and calf they owned. Their hides filled Hudden's largest cart, which Dudden's strongest pair of horses pulled to the fair.
        - id: ch03-b02
          speaker: narrator
          text: At the fair, each man tucked a hide under his arm. Then they marched about, shouting as loudly as they could.
        - id: ch03-b03
          speakers: [hudden, dudden]
          ensemble: duo
          text: Hides for sale! Hides for sale!
        - id: ch03-b04
          speaker: narrator
          text: The tanner came out to meet them.
        - id: ch03-b05
          speaker: tanner
          text: What price are you asking for those hides, good men?
        - id: ch03-b06
          speakers: [hudden, dudden]
          ensemble: duo
          text: Their weight in gold.
        - id: ch03-b07
          speaker: tanner
          text: It's rather early in the day to be coming out of the tavern.
        - id: ch03-b08
          speaker: narrator
          text: With that, the tanner went back into his yard. Hudden and Dudden tried again.
        - id: ch03-b09
          speakers: [hudden, dudden]
          ensemble: duo
          text: Hides for sale! Fine, fresh hides for sale!
        - id: ch03-b10
          speaker: narrator
          text: This time the cobbler came out.
        - id: ch03-b11
          speaker: cobbler
          text: How much do you want for the hides?
        - id: ch03-b12
          speakers: [hudden, dudden]
          ensemble: duo
          text: Their weight in gold.
        - id: ch03-b13
          speaker: cobbler
          text: Do you think you can make a fool of me? Here is your payment for trying!
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: The cobbler struck Hudden so hard that he staggered. People came running from every end of the fair.
        - id: ch03-b15
          speakers: [fairgoer_1, fairgoer_2, fairgoer_3]
          ensemble: chorus
          text: What's happened? What's all this about?
        - id: ch03-b16
          speaker: cobbler
          text: These two vagabonds are trying to sell hides for their weight in gold!
        - id: ch03-b17
          speaker: narrator
          text: The innkeeper arrived last because he was so fat, and he began to shout.
        - id: ch03-b18
          speaker: landlord
          text: Hold them fast! I'll wager one of these rogues cheated me out of thirty gold pieces yesterday for one miserable hide!
          emotion: angry
        - id: ch03-b19
          speaker: narrator
          text: Hudden and Dudden got far more kicks than coins before they escaped. They ran for home with every dog in town snapping at their heels.
        - id: ch03-b20
          speaker: narrator
          text: If they had disliked Donald before, they hated him far more now. He saw them racing up the road with crushed hats, torn coats, and faces black and blue.
        - id: ch03-b21
          speaker: donald_oneary
          text: What's wrong, friends? Have you been fighting, or did you run into the police?
        - id: ch03-b22
          speaker: hudden
          text: We'll give you the police, you vagabond! You thought yourself very clever, fooling us with those lies.
          emotion: angry
        - id: ch03-b23
          speaker: donald_oneary
          text: Who fooled you? You saw the gold with your own eyes.
        - id: ch03-b24
          speaker: narrator
          text: Talking did him no good. Hudden and Dudden were determined to make Donald pay. They forced him into a meal sack, tied it tight, and pushed a pole through the knot. Then each man lifted one end onto his shoulder, and they carried Donald toward the Brown Lake of the Bog.
    - id: ch04
      title: The Sack Outside the Inn
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Brown Lake was far away. The road was dusty, and Hudden and Dudden were sore, tired, and terribly thirsty. When they reached an inn beside the road, Hudden stopped.
        - id: ch04-b02
          speaker: hudden
          text: Let's go inside. I'm worn out. For a man who had so little to eat, Donald is mighty heavy.
        - id: ch04-b03
          speaker: narrator
          text: Dudden was just as willing. No one asked Donald what he wanted. They dropped him outside the inn like a sack of potatoes.
        - id: ch04-b04
          speaker: dudden
          text: Sit still, you vagabond. If we can bear the wait, so can you.
        - id: ch04-b05
          speaker: narrator
          text: Donald said nothing for a while. Soon he heard glasses clinking inside and Hudden singing at the top of his voice. Then Donald began to call out.
        - id: ch04-b06
          speaker: donald_oneary
          text: I won't marry her! I tell you, I won't have her!
        - id: ch04-b07
          speaker: narrator
          text: No one paid any attention, so Donald called again, louder this time.
        - id: ch04-b08
          speaker: donald_oneary
          text: I won't have her! I won't marry her!
        - id: ch04-b09
          speaker: narrator
          text: Still no one answered. Donald shouted the words a third time, as loudly as he could.
        - id: ch04-b10
          speaker: donald_oneary
          text: I tell you, I won't have her!
        - id: ch04-b11
          speaker: narrator
          text: Just then a farmer arrived with a drove of cattle. He was about to go in for a drink when he heard Donald.
        - id: ch04-b12
          speaker: cattle_farmer
          text: And who is it you won't have, if I may ask?
        - id: ch04-b13
          speaker: donald_oneary
          text: The king's daughter. They won't stop pestering me to marry her.
        - id: ch04-b14
          speaker: cattle_farmer
          text: You're a lucky man! I'd give plenty to be in your place.
        - id: ch04-b15
          speaker: donald_oneary
          text: Would it truly please a farmer to marry a princess dressed in gold and jewels?
        - id: ch04-b16
          speaker: cattle_farmer
          text: Jewels, you say? Couldn't you take me along with you?
        - id: ch04-b17
          speaker: donald_oneary
          text: Well, you seem an honest fellow. I don't care for the king's daughter, though she's as beautiful as the day and covered in jewels from head to foot. You may have her. Untie the cord and let me out. They bound me this tightly because they knew I would run away from her.
        - id: ch04-b18
          speaker: narrator
          text: Donald crawled out, and the farmer climbed into the sack.
        - id: ch04-b19
          speaker: donald_oneary
          text: Lie still, and don't mind the shaking. That will only be the journey over the palace steps. They may call you a vagabond for refusing the king's daughter, but pay no attention. I'm giving up a great deal for you, though I truly don't want the princess.
        - id: ch04-b20
          speaker: cattle_farmer
          text: Take my cattle in exchange.
        - id: ch04-b21
          speaker: narrator
          text: Before long, Donald was walking behind the cattle and driving them home.
    - id: ch05
      title: The Brown Lake of the Bog
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Hudden and Dudden came out of the inn. Each lifted one end of the pole again.
        - id: ch05-b02
          speaker: hudden
          text: I think he's grown heavier.
        - id: ch05-b03
          speaker: dudden
          text: Never mind. It's only a short way to the Brown Lake now.
        - id: ch05-b04
          speaker: cattle_farmer
          text: I'll have her now! I'll marry her now!
          emotion: happy
        - id: ch05-b05
          speaker: narrator
          text: The farmer's cry came from inside the sack.
        - id: ch05-b06
          speaker: hudden
          text: By my faith, you certainly shall!
        - id: ch05-b07
          speaker: narrator
          text: Hudden struck the sack with his stick.
        - id: ch05-b08
          speaker: cattle_farmer
          text: I'll have her! I'll have her!
          emotion: happy
        - id: ch05-b09
          speaker: narrator
          text: The farmer shouted louder than before. By then they had reached the Brown Lake.
        - id: ch05-b10
          speaker: dudden
          text: Well, here you are.
        - id: ch05-b11
          speaker: narrator
          text: They slipped the sack from the pole and threw it straight into the lake.
        - id: ch05-b12
          speaker: hudden
          text: You won't play any more tricks on us.
        - id: ch05-b13
          speaker: dudden
          text: That's the truth. Ah, Donald, my boy, the day you borrowed my scales was a bad day for you.
        - id: ch05-b14
          speaker: narrator
          text: Hudden and Dudden set off with easy hearts and light steps. But near home, they saw Donald O'Neary. Cows grazed all around him, while calves kicked up their heels and butted their heads together.
        - id: ch05-b15
          speaker: dudden
          text: Donald, is that really you? By faith, you got back faster than we did.
          emotion: surprised
        - id: ch05-b16
          speaker: donald_oneary
          text: That's true, Dudden, and I must thank you kindly. You meant me harm, but you did me a fine turn. You may have heard that the Brown Lake leads to the Land of Promise. I always thought it was a lie, yet it's every bit as true as my word. Just look at these cattle.
        - id: ch05-b17
          speaker: narrator
          text: Hudden stared, and Dudden's mouth fell open. They could not take their eyes off the cattle, for they were fine, fat beasts.
        - id: ch05-b18
          speaker: donald_oneary
          text: These are only the poorest ones I could bring back. The others were too fat to drive. And why would they want to leave? Down there, the grass stretches as far as you can see, sweet and juicy as fresh butter.
        - id: ch05-b19
          speaker: dudden
          text: Now, Donald, we haven't always been friends. But I was just saying that you've always been a decent fellow. You'll show us the way down, won't you?
        - id: ch05-b20
          speaker: donald_oneary
          text: Why should I? There are far more cattle below. I might keep them all for myself.
        - id: ch05-b21
          speaker: hudden
          text: The richer a man gets, the harder his heart grows. You were always neighborly, Donald. Surely you wouldn't keep all that good fortune to yourself.
        - id: ch05-b22
          speaker: donald_oneary
          text: That's fair, Hudden, though you set me a poor example. Still, I won't dwell on old times. There is enough down there for everyone. Come along with me.
    - id: ch06
      title: The Cattle in the Clouds
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The three men hurried toward the lake, Hudden and Dudden full of hope and stepping eagerly. When they reached the Brown Lake, little white clouds filled the sky. Their reflections filled the water too.
        - id: ch06-b02
          speaker: donald_oneary
          text: Look there! There are the cattle!
        - id: ch06-b03
          speaker: narrator
          text: Donald pointed to the clouds reflected in the lake.
        - id: ch06-b04
          speaker: hudden
          text: Where? Where are they?
        - id: ch06-b05
          speaker: dudden
          text: Don't be greedy!
        - id: ch06-b06
          speaker: narrator
          text: Dudden leaped as hard as he could, determined to reach the fat cattle first. Hudden jumped in right behind him.
        - id: ch06-b07
          speaker: narrator
          text: They never came back. Perhaps they grew too fat, just like the cattle.
        - id: ch06-b08
          speaker: narrator
          text: As for Donald O'Neary, he had all the cattle and sheep his heart desired for the rest of his days.
