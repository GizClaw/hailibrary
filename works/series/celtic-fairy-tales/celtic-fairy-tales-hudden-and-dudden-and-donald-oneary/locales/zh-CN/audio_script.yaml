audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    donald:
      display_name: 唐纳德·奥尼里
      tts:
        delivery: 机敏从容，受欺时克制，设局时带着一本正经的幽默
        timbre: 明朗朴实
        pace: 适中
        pitch: 中音
    hudden:
      display_name: 霍登
      tts:
        delivery: 贪婪急躁，自以为聪明时格外得意
        timbre: 粗厚响亮
        pace: 稍快
        pitch: 中低音
    dudden:
      display_name: 杜登
      tts:
        delivery: 刻薄多疑，贪心时急不可耐
        timbre: 干涩有力
        pace: 适中
        pitch: 中音
    innkeeper:
      display_name: 客店老板
      tts:
        delivery: 精明警觉，受骗后气急败坏
        timbre: 圆润洪亮
        pace: 适中
        pitch: 中低音
    tanner:
      display_name: 制革匠
      tts:
        delivery: 务实冷淡，讥讽时不动声色
        timbre: 低沉朴实
        pace: 适中
        pitch: 低音
    cobbler:
      display_name: 鞋匠
      tts:
        delivery: 直率火爆，受冒犯时毫不客气
        timbre: 清亮结实
        pace: 明快
        pitch: 中音
    townsman_one:
      display_name: 镇民甲
      tts:
        delivery: 好奇直率，随众人一同发问
        timbre: 朴实清楚
        pace: 适中
        pitch: 中音
    townsman_two:
      display_name: 镇民乙
      tts:
        delivery: 好奇直率，随众人一同发问
        timbre: 略显沙哑
        pace: 适中
        pitch: 中低音
    townsman_three:
      display_name: 镇民丙
      tts:
        delivery: 好奇直率，随众人一同发问
        timbre: 明亮清晰
        pace: 适中
        pitch: 中高音
    farmer:
      display_name: 赶牛的农夫
      tts:
        delivery: 老实热切，一想到公主便喜不自胜
        timbre: 浑厚质朴
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 黛西与会掉金币的牛皮
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有两个农夫，一个叫霍登，一个叫杜登。两人的院里养着家禽，高地上放着羊群，河边草场还有几十头牛，可他们有了这么多，心里仍不快活。两家农场之间住着穷人唐纳德·奥尼里。他头顶只有一间破屋，名下只有一小条草地，还有一头瘦得只剩骨架的奶牛黛西。那点草勉强够黛西不被饿死。黛西已经尽了全力，唐纳德还是难得喝上一口牛奶，更别说做出一卷黄油了。照理说，这点家当实在不值得眼红。偏偏人有得越多，想要的也越多。霍登和杜登夜里躺着也不睡，只顾盘算怎样把唐纳德的小草地夺过来，至于可怜的黛西，他们根本没放在心上。
        - id: ch01-b02
          speaker: narrator
          text: 一天，两人碰了面，又念叨起怎样赶走唐纳德。
        - id: ch01-b03
          speaker: hudden
          text: 干脆杀了黛西。这样还赶不走他，就什么办法也不管用了。
        - id: ch01-b04
          speaker: narrator
          text: 这主意才说出口，杜登就答应了。天还没黑透，两人便偷偷摸到小棚前。黛西白天吃到的草连一只手掌也盖不住，这会儿躺在里面，还在竭力反刍。夜里，唐纳德过来查看它是否安顿好了。可怜的牲口只来得及舔一下他的手，就在他面前死去了。
        - id: ch01-b05
          speaker: narrator
          text: 唐纳德是个精明人。他心里虽然难过，却没有只顾伤心，而是琢磨能不能从黛西的死里挽回一点什么。他想了又想。第二天一早，便扛着黛西的皮步行去赶集，口袋里装着自己仅有的几枚铜板，走起路来叮当作响。快到地方时，他在牛皮上割出几道小口，每个口子塞进一枚铜板。随后，他大模大样地走进镇上最好的客店，那架势仿佛整家店都是他的。他把牛皮挂到墙上的钉子上，自己安稳地坐了下来。
        - id: ch01-b06
          speaker: donald
          text: 给我来些最好的威士忌。
        - id: ch01-b07
          speaker: narrator
          text: 店主看看他的衣着，再看看他的模样，怎么也不像一个喝得起上等威士忌的客人，便站在那里迟迟不动。
        - id: ch01-b08
          speaker: donald
          text: 你担心我没钱？这张皮要多少就能给我多少。
        - id: ch01-b09
          speaker: narrator
          text: 唐纳德拿手杖敲了一下，一枚铜板马上从牛皮里跳出来。店主的眼睛顿时瞪圆了。
        - id: ch01-b10
          speaker: innkeeper
          text: 这张皮怎么卖？
        - id: ch01-b11
          speaker: donald
          text: 我的好先生，它可不卖。
        - id: ch01-b12
          speaker: innkeeper
          text: 我出一枚金币呢？
        - id: ch01-b13
          speaker: donald
          text: 都说了不卖。我们一家靠它过了好些年，哪能卖掉？
        - id: ch01-b14
          speaker: narrator
          text: 唐纳德说完又敲了一下，第二枚铜板也从牛皮里蹦了出来。店主这下再也舍不得放手。两人你来我往地说了半天，到头来，唐纳德还是收下金币，把牛皮让给了店主。就在当天晚上，他便装着若无其事的样子，来到霍登门前。
        - id: ch01-b15
          speaker: donald
          text: 晚上好，霍登。把你最好的一杆秤借我用用吧。
        - id: ch01-b16
          speaker: narrator
          text: 霍登盯着他看了半天，又伸手挠了挠头，最后还是把秤借给了他。不过，霍登早在秤盘底下粘了一块黄油，想看看唐纳德究竟要称什么。唐纳德平安回到家，从口袋里掏出亮闪闪的金币，一枚一枚放到秤上称。等他把秤送还时，最后一枚金币便牢牢粘在了盘底。
        - id: ch01-b17
          speaker: narrator
          text: 霍登看见金币，眼睛比先前瞪大了十倍。他等唐纳德一走，立刻飞奔去找杜登。
        - id: ch01-b18
          speaker: hudden
          text: 晚上好，杜登。那个该倒霉的无赖——
        - id: ch01-b19
          speaker: dudden
          text: 你是说唐纳德·奥尼里？
        - id: ch01-b20
          speaker: hudden
          text: 还能是谁！他在家里一袋袋地称金币。
        - id: ch01-b21
          speaker: dudden
          text: 你怎么会知道？
        - id: ch01-b22
          speaker: hudden
          text: 他借了我的秤。你看，这儿还粘着一枚金币！
        - id: ch01-b23
          speaker: narrator
          text: 两人一起赶到唐纳德家。他已经把金币十枚一摞地堆好，只因少了粘在秤上的那一枚，最后一摞怎么也凑不齐。霍登和杜登连一句“请问”或“打扰了”也没说，推开门便闯了进去。眼前的金币让他们彻底看傻了，除了喊自己从没见过这种事，什么话也说不出来。
        - id: ch01-b24
          speaker: donald
          text: 晚上好，霍登，晚上好，杜登。你们以为自己害了我，其实这辈子从没帮过我这么大的忙。黛西死后，我想着牛皮多少能换点钱。没想到眼下的牛皮，竟能换来同等重量的黄金！
        - id: ch01-b25
          speaker: narrator
          text: 霍登听了，悄悄用胳膊肘碰了碰杜登。杜登也朝霍登眨了眨眼。两人刚才还不请自来，这会儿却客客气气地向“好朋友”唐纳德道了晚安。等他们走出门时，心里早已有了同一个主意。
    - id: ch02
      title: 集市上的牛皮
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天，霍登和杜登名下的牛，无论大牛还是牛犊，没有一头还留着皮。所有牛皮都装上霍登最大的马车，再套上杜登最强壮的一对马，满满当当地拉到集市。到了那里，两人各自把一张皮搭在胳膊上，在来往的人群中走来走去，扯开嗓子使劲叫卖。
        - id: ch02-b02
          speakers: [hudden, dudden]
          ensemble: duo
          text: 卖牛皮啦！卖牛皮啦！
        - id: ch02-b03
          speaker: tanner
          text: 两位好先生，这些皮要卖多少钱？
        - id: ch02-b04
          speakers: [hudden, dudden]
          ensemble: duo
          text: 要与牛皮同等重量的黄金。
        - id: ch02-b05
          speaker: tanner
          text: 一大清早就从酒馆出来，你们喝得可真不少。
        - id: ch02-b06
          speaker: narrator
          text: 制革匠认定他们一大早就喝醉了，只留下这一句话，转身回了自己的工场。两人只好继续在人群里走，喊着新鲜的好牛皮。接着，鞋匠又从铺子里走了出来。他问这些皮要卖多少，霍登和杜登照旧回答，要与牛皮同等重量的黄金。
        - id: ch02-b07
          speaker: cobbler
          text: 敢拿我寻开心？那就吃我这一拳，当作你们的酬劳！
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: 这一拳打得霍登连连踉跄。集市上的人从两头围拢过来。
        - id: ch02-b09
          speakers: [townsman_one, townsman_two, townsman_three]
          ensemble: chorus
          text: 出什么事了？到底怎么回事？
        - id: ch02-b10
          speaker: cobbler
          text: 这两个无赖卖牛皮，开口就要同等重量的黄金！
        - id: ch02-b11
          speaker: narrator
          text: 客店老板太胖，最后一个才跑到。
        - id: ch02-b12
          speaker: innkeeper
          text: 抓住他们！昨天有人拿一张破牛皮骗了我三十枚金币，准是这两个骗子中的一个！
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 人群一拥而上。霍登和杜登没赚到半个铜板，挨的拳脚倒多得数不清。等两人终于逃出集市，帽子已经瘪了，外衣也被扯破，脸上更是青一块紫一块。偏偏全镇的狗还追在后面，他们只得拼命往家跑。你想也知道，他们原先若是不喜欢唐纳德，现在就更恨他了。唐纳德看见两人这副模样，却故意问他们是不是打了架，或者碰见了那些该倒霉的警察。
        - id: ch02-b14
          speaker: hudden
          text: 我们这就叫你尝尝警察的滋味！你编谎话骗了我们，还真以为自己聪明！
          emotion: angry
        - id: ch02-b15
          speaker: donald
          text: 谁骗你们了？那些金币，不是你们亲眼看见的吗？
        - id: ch02-b16
          speaker: narrator
          text: 可霍登和杜登根本听不进去。他们认定唐纳德必须立刻付出代价。旁边正好有一只装粮食的麻袋，两人一把将他塞进去，把袋口捆得结结实实，又从绳结下穿过一根长杆。霍登扛住这头，杜登扛住那头，唐纳德便悬在两人中间，一路被抬向泥炭沼里的褐湖。
    - id: ch03
      title: 麻袋里的新郎
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 褐湖很远，一路尘土飞扬。霍登和杜登本就浑身疼痛，走着走着，更是又累又渴。看见路边有家客店，霍登便停下脚步。
        - id: ch03-b02
          speaker: hudden
          text: 进去歇歇吧，我快累死了。这家伙没吃过多少好东西，怎么这样沉？
        - id: ch03-b03
          speaker: narrator
          text: 杜登正有此意。他们没问唐纳德，把他当成一袋土豆，咚地扔在门口。
        - id: ch03-b04
          speaker: dudden
          text: 给我老实待着。我们都肯等，你更不用着急。
        - id: ch03-b05
          speaker: narrator
          text: 唐纳德没有回嘴，只在麻袋里静静等着。过了一阵，他听见客店里的酒杯叮当作响，霍登也扯开嗓子唱起了歌。这时，一个农夫赶着一群牛来到路边，正打算进店喝上一杯。唐纳德忽然隔着麻袋喊，说自己不肯要她。第一回没人理睬，他便提高声音又说一遍，仍旧没人理会。到了第三回，他用尽嗓门喊了起来。
        - id: ch03-b06
          speaker: donald
          text: 我说了我不要她！我就是不要她！
        - id: ch03-b07
          speaker: farmer
          text: 冒昧问一句，你说的“她”是谁？
        - id: ch03-b08
          speaker: donald
          text: 国王的女儿。他们缠得我不得安生，非逼我娶她。
        - id: ch03-b09
          speaker: farmer
          text: 你运气真好！要是能换到你的位置，我愿意拿东西来换。
        - id: ch03-b10
          speaker: donald
          text: 一个农夫能娶上穿金戴银的公主，那当然是天大的福气。
        - id: ch03-b11
          speaker: farmer
          text: 她真的浑身珠宝？你能带我一起去吗？
        - id: ch03-b12
          speaker: donald
          text: 你是个老实人，我就把她让给你吧。她美得像白昼一样明亮，从头到脚都是珠宝，可我偏偏不想娶。快解开绳子放我出去。他们怕我逃婚，才把我捆得这么紧。
        - id: ch03-b13
          speaker: narrator
          text: 唐纳德爬出麻袋，农夫钻了进去。
        - id: ch03-b14
          speaker: donald
          text: 躺稳了。路上有些颠，那只是经过王宫台阶。他们或许会骂你是不肯娶公主的无赖，别放在心上。我让给你的好事可不小，只怪我实在不喜欢那位公主。
        - id: ch03-b15
          speaker: farmer
          text: 我的牛群也送给你，就当交换！
        - id: ch03-b16
          speaker: narrator
          text: 没过多久，唐纳德便跟在牛群后面，赶着它们踏上回家的路。霍登和杜登喝完酒出来，对麻袋里换了人一无所知。一个扛起长杆这头，一个扛起那头，又继续上路。霍登走了几步，觉得唐纳德似乎变重了。杜登却叫他别在意，反正褐湖只剩几步路。
        - id: ch03-b17
          speaker: farmer
          text: 我现在愿意娶她啦！我愿意啦！
          emotion: happy
        - id: ch03-b18
          speaker: hudden
          text: 凭我的信义，你当然非娶不可！
        - id: ch03-b19
          speaker: narrator
          text: 霍登听见这话，还以为唐纳德终于改了主意，便一棍抽在麻袋上。里面的农夫喊得更响，一遍又一遍地说自己愿意娶公主。到了褐湖岸边，杜登只说了一句“好，你到地方了”。两人随即从肩上卸下麻袋，连人带袋扑通一声扔进湖里。
        - id: ch03-b20
          speaker: hudden
          text: 这下你再也耍不了花招啦。
        - id: ch03-b21
          speaker: dudden
          text: 没错。唐纳德啊，你来借秤的那天，对你可真不是个好日子。
    - id: ch04
      title: 褐湖下的福地
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 两人以为从此再也不会受骗，心里一下轻松了，回家的脚步也格外轻快。可快到村子时，他们竟看见唐纳德·奥尼里好端端地站在那里。他周围到处都是牛。母牛低头吃草，小牛犊踢着后腿撒欢，还拿脑袋彼此顶来顶去。
        - id: ch04-b02
          speaker: dudden
          text: 唐纳德，真是你？你怎么比我们还先回来？
          emotion: surprised
        - id: ch04-b03
          speaker: donald
          text: 正是我，还得多谢你们。你们心意虽坏，却帮了我的大忙。听说褐湖通往福地，我从前总当是谎话。现在看来，句句都是真的。瞧瞧这些牛吧。
        - id: ch04-b04
          speaker: narrator
          text: 霍登盯着眼前这一切，眼睛瞪得溜圆。杜登张着嘴，半天也合不上。最要命的是，那些牛头头膘肥体壮，正在他们面前吃草撒欢，由不得两人不信。
        - id: ch04-b05
          speaker: donald
          text: 这些还是我能赶上来的最差一批。其余的牛实在太肥，根本走不动。那里青草望不到边，又鲜又甜，像新做的黄油。它们当然舍不得离开。
        - id: ch04-b06
          speaker: dudden
          text: 唐纳德，咱们过去虽不大和睦，可你一直是个厚道人。给我们指条路吧，好不好？
        - id: ch04-b07
          speaker: donald
          text: 我为什么非带你们去？下面还有那么多牛，我一个人留下岂不更好？
        - id: ch04-b08
          speaker: hudden
          text: 人越有钱，心果然越硬。你一向肯帮邻居，总不至于独占所有好运吧？
        - id: ch04-b09
          speaker: donald
          text: 你说得也对，虽说你给我做的榜样很坏。我不计较从前了。下面多得很，大家都有份。跟我走吧。
        - id: ch04-b10
          speaker: narrator
          text: 霍登和杜登一听下面人人有份，顿时满心欢喜，脚步又轻又急，跟着唐纳德回到褐湖边。此时，天空铺满一朵朵小小的白云。湖面平静得像一面镜子，也铺满了同样的白色云影。唐纳德抬起手，指着水里的云朵，叫他们快看，那些肥牛就在下面。
        - id: ch04-b11
          speaker: hudden
          text: 在哪儿？在哪儿？
        - id: ch04-b12
          speaker: dudden
          text: 别贪心，我先去！
        - id: ch04-b13
          speaker: narrator
          text: 杜登使尽全力跳进湖里，想第一个赶到肥牛身边。霍登也紧跟着跳了下去。两人再没有回来。也许他们跟那些牛一样，肥得走不动了。至于唐纳德·奥尼里，从此牛羊成群，一辈子都心满意足。
