audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    guleesh:
      display_name: 古利什
      tts:
        delivery: 质朴直率，善良中带着年轻人的冲动
        timbre: 清朗朴实
        pace: 明快，思索时放缓
        pitch: 中音
    fairy_1:
      display_name: 小仙人
      tts:
        delivery: 狡黠轻快，威胁时尖刻阴冷
        timbre: 轻细锐利
        pace: 偏快
        pitch: 中高音
    fairy_2:
      display_name: 仙人甲
      tts:
        delivery: 嘲弄而随意
        timbre: 干脆明亮
        pace: 快
        pitch: 中高音
    fairy_3:
      display_name: 仙人乙
      tts:
        delivery: 爱说笑，语气促狭
        timbre: 轻亮
        pace: 快
        pitch: 高音
    fairy_4:
      display_name: 仙人丙
      tts:
        delivery: 漫不经心，常在旁边插话
        timbre: 轻柔飘忽
        pace: 中等
        pitch: 中高音
    princess:
      display_name: 法国公主
      tts:
        delivery: 温柔端庄，经历苦难后仍真挚克制
        timbre: 柔和清澈
        pace: 舒缓
        pitch: 中高音
    priest:
      display_name: 神父
      tts:
        delivery: 亲切稳重，偶尔带着爽朗的诙谐
        timbre: 温厚低沉
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 乘风渡海的仙人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，梅奥郡住着一个叫古利什的小伙子。他家山墙不远处有座美丽的环形仙丘，四周围着一圈细软的草坡，他常常去那里坐着。一天夜里，他半靠着自家的山墙，仰头望着天空，也望着头顶皎洁的白月亮。这样站了两三个钟头，他越看越觉得自己的日子苦闷。
        - id: ch01-b02
          speaker: guleesh
          text: 真苦啊，我怎么不能一走了之呢？天底下随便哪里，都比这里强。白月亮，你想怎么转就怎么转，谁也拦不住。我要是能像你一样就好了。
        - id: ch01-b03
          speaker: narrator
          text: 他刚说完，就听见许多人奔跑、谈笑、嬉闹的声音。那阵喧响像旋风一样从身旁卷过，钻进了仙丘。古利什听得心里发痒。
        - id: ch01-b04
          speaker: guleesh
          text: 凭我的灵魂起誓，你们可真快活。我也去！
        - id: ch01-b05
          speaker: narrator
          text: 丘里原来是一队仙人，可古利什并不知道。他跟进去，只听见他们“呼帕尼、福尔波尼，拉普莱胡塔、鲁利亚布利亚”地闹成一团，还人人扯着嗓子喊同一句话。
        - id: ch01-b06
          speakers: [fairy_1, fairy_2, fairy_3, fairy_4]
          ensemble: chorus
          text: 我的马，我的缰绳和鞍子！我的马，我的缰绳和鞍子！
        - id: ch01-b07
          speaker: guleesh
          text: 这办法不错，我也学你们。我的马，我的缰绳和鞍子！我的马，我的缰绳和鞍子！
        - id: ch01-b08
          speaker: narrator
          text: 话音一落，一匹漂亮的骏马便站在古利什面前，嘴上套着金缰绳，背上配着银鞍子。他立刻纵身跃上马背。等他在那里坐稳，才清清楚楚看见整座仙丘里到处都是马，一个个小仙人正骑在它们背上，随时准备出发。
        - id: ch01-b09
          speaker: fairy_1
          text: 古利什，今夜跟我们一起走吗？
        - id: ch01-b10
          speaker: guleesh
          text: 当然去。
        - id: ch01-b11
          speaker: fairy_1
          text: 那就跟上！
        - id: ch01-b12
          speaker: narrator
          text: 众人冲出仙丘，骑得比猎马还快，比狐狸和身后的猎犬还快。迎面的冬风，他们追得上。身后的冬风，却追不上他们。他们不歇一口气，一直奔到海边。
        - id: ch01-b13
          speakers: [fairy_1, fairy_2, fairy_3, fairy_4]
          ensemble: chorus
          text: 嗨，越过海！嗨，越过海！
        - id: ch01-b14
          speaker: narrator
          text: 转眼间，马群飞上天空。古利什还没想清自己在哪里，大家已经落到坚实的土地上，又迎着风飞奔。最后，他们终于停住。
        - id: ch01-b15
          speaker: fairy_1
          text: 古利什，知道现在到了什么地方吗？
        - id: ch01-b16
          speaker: guleesh
          text: 一点也不知道。
        - id: ch01-b17
          speaker: fairy_1
          text: 这里是法国。法国国王的女儿今夜成婚，她是太阳见过的最美女子。我们要把她带走，只要办得到，就绝不能空手回去。你得跟我们进宫。等姑娘出来，让她坐在你身后的马背上。我们不能让她坐在自己身后，这是规矩。你是有血有肉的凡人，她可以紧紧抱住你，不会掉下马。怎么样？肯照我们说的做吗？
        - id: ch01-b18
          speaker: guleesh
          text: 我为什么不肯？你们要我做什么，我一定照办。
        - id: ch01-b19
          speaker: narrator
          text: 众人下了马。一个仙人念出一句古利什听不懂的话，他们立刻升到空中。等古利什回过神来，自己和同伴已经站在王宫里。那里正在举行盛大的宴会。举国的贵族和绅士全来了，人人穿着绫罗绸缎，身上闪着金银。无数灯烛一起燃烧，把黑夜照得和白天一样亮。古利什被刺得紧闭双眼，过了一会儿才敢睁开。他从没见过这样华美的地方。大厅里足足摆着一百张桌子，每张都堆满肉食、糕饼、糖果、葡萄酒、麦酒，还有世上能见到的各种饮品。乐师坐在大厅两端，奏出人耳听过的最美乐曲。年轻姑娘和俊俏小伙子在中央跳舞，转得又轻又快，古利什看得脑袋发晕。另一些人表演把戏，更多的人说笑取乐。这样的盛宴，法国已经二十年不曾有过。老国王的孩子只剩这个女儿，今夜她要嫁给另一位国王的儿子。宴会一连办了三天，婚礼就在第三夜。古利什和仙人们正是在这时候赶来，打算找机会掳走她。
        - id: ch01-b20
          speaker: narrator
          text: 古利什和仙人站在大厅上首。祭坛已经布置好，两位主教等在后面，准备时辰一到就主持婚礼。进门时，仙人念咒隐去了身形，所以旁人根本看不见他们。
        - id: ch01-b21
          speaker: guleesh
          text: 哪一位是国王的女儿？
        - id: ch01-b22
          speaker: fairy_1
          text: 远处那个，你没看见吗？
        - id: ch01-b23
          speaker: narrator
          text: 古利什顺着他指的方向望去，觉得整个世界再没有更美的女子。玫瑰的红和百合的白在她脸上争艳，谁也看不出究竟哪一种颜色占了上风。她的手臂和双手洁白如石灰，嘴唇红得像熟透的草莓。她的脚又小又轻，几乎只有别人的手掌那么大。她身形柔美修长，卷曲的金发从头上垂落下来。衣裙由金丝银线织成，手上那枚戒指镶着明亮的宝石，发出的光就像太阳。
        - id: ch01-b24
          speaker: narrator
          text: 古利什几乎被她的美貌晃花了眼。再看时，他却发现她正在哭，眼里还留着泪痕。
        - id: ch01-b25
          speaker: guleesh
          text: 周围的人这样高兴，她怎么反倒那么伤心？
        - id: ch01-b26
          speaker: fairy_1
          text: 她当然伤心。她不愿意嫁，也不爱那个未来的丈夫。三年前她才十五岁，国王就想把她嫁过去。她说年纪太小，求父亲再等等。国王先宽限一年，又宽限一年，后来再给一年。可今夜她已经十八岁，国王连一星期、一天也不肯多给了。不过，只要我能插手，她才不会嫁给什么王子。
        - id: ch01-b27
          speaker: narrator
          text: 小仙人说到最后，难看地歪起了嘴。古利什听得心都碎了。一边是被迫嫁给自己不爱的人，另一边是让可恶的仙人抢去做妻子，无论哪一种命运都叫他替姑娘难过。他暗暗诅咒自己的坏运气，为什么偏叫自己答应帮助仙人，把她从父亲身边和家里带走。他苦苦想着该怎样救她，想来想去，却找不到任何办法。
        - id: ch01-b28
          speaker: guleesh
          text: 只要能帮她脱离苦海，就算死了我也不在乎。可我究竟能做什么呢？
        - id: ch01-b29
          speaker: narrator
          text: 古利什看见王子走到姑娘面前，向她讨一个吻。姑娘马上把头转开。王子又拉住她柔软洁白的手，带她到人群中跳舞。古利什越看越怜惜她。他们随着舞步转到近旁时，姑娘眼中的泪水清清楚楚。舞曲结束，老国王和王后走上来，说成婚的时辰已经到了。主教准备妥当，现在该把婚戒戴到女儿手上，再把她交给丈夫。国王亲手牵着王子，王后领着女儿，领主和大人物全跟在身后，一同走向祭坛。
        - id: ch01-b30
          speaker: narrator
          text: 一行人走到离祭坛只有四码的地方，小仙人突然把脚伸到姑娘面前，将她绊倒。她还没来得及重新站起，他便把手里的一件东西撒到她身上，又念了两句咒语。姑娘当场从众人中间消失，谁也看不见她。小仙人一把抓住姑娘，把她扶到古利什身后。国王和满宫的人既看不见他们，也不知道发生了什么，只能任由他们穿过大厅，直奔门外。
        - id: ch01-b31
          speaker: narrator
          text: 哎哟，圣母玛利亚啊！姑娘从众人眼前消失，宫里顿时充满怜惜和惊慌。有人哭，有人喊，有人惊叹，有人四处寻找，人人都不知道是什么把她弄走。仙人们却没有受到半点阻拦，因为谁也看不见他们。他们径直出了王宫大门。
        - id: ch01-b32
          speakers: [fairy_1, fairy_2, fairy_3, fairy_4]
          ensemble: chorus
          text: 我的马，我的缰绳和鞍子！
        - id: ch01-b33
          speaker: guleesh
          text: 我的马，我的缰绳和鞍子！
        - id: ch01-b34
          speaker: fairy_1
          text: 快上马，古利什。让小姐坐在你身后，我们得赶紧走，天就快亮了。
    - id: ch02
      title: 古利什留下了公主
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 古利什先扶姑娘上马，自己坐到她前面。
        - id: ch02-b02
          speaker: guleesh
          text: 起来，马儿！
        - id: ch02-b03
          speaker: narrator
          text: 马群放开四蹄，一路冲到海边。
        - id: ch02-b04
          speakers: [fairy_1, fairy_2, fairy_3, fairy_4]
          ensemble: chorus
          text: 嗨，越过海！
        - id: ch02-b05
          speaker: guleesh
          text: 嗨，越过海！
        - id: ch02-b06
          speaker: narrator
          text: 古利什胯下的马腾空一跃，穿过云层，在爱尔兰落下。他们并没有停留，又一路飞奔，直奔古利什的家和那座仙丘。刚一到地方，古利什便回过身，用双臂稳稳抱住年轻姑娘，带着她一起跳下马背。
        - id: ch02-b07
          speaker: guleesh
          text: 我以神的名义画下十字，把你召到我身边！
        - id: ch02-b08
          speaker: narrator
          text: 他的话还没说完，那匹马就倒在地上。仔细一看，哪里是马，原来只是一根犁梁。其他仙人的坐骑也露出了真相，有的是旧扫帚，有的是断棍，还有的是枯茎或毒芹秆。
        - id: ch02-b09
          speakers: [fairy_1, fairy_2, fairy_3, fairy_4]
          ensemble: chorus
          text: 古利什，你这个乡巴佬，这个贼！愿你永远碰不上好事！为什么这样捉弄我们？
          emotion: angry
        - id: ch02-b10
          speaker: narrator
          text: 可古利什已经把姑娘奉献给自己，仙人再没有法力把她带走。
        - id: ch02-b11
          speaker: fairy_2
          text: 我们待你这么好，你就这样报答？这一趟法国之行还有什么好处？你等着，乡巴佬。下次你会付出代价，也一定会后悔。
          emotion: angry
        - id: ch02-b12
          speaker: fairy_1
          text: 他也别想从这姑娘身上得到好处。
        - id: ch02-b13
          speaker: narrator
          text: 小仙人走到姑娘身旁，朝她耳边狠狠打了一巴掌。
        - id: ch02-b14
          speaker: fairy_1
          text: 好了，她从此再也说不出话。古利什，她成了哑巴，对你还有什么用？我们该走了。不过，你会记住我们的！
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: 小仙人说完便伸开双手。古利什还没来得及回答，他和所有同伴已经钻进仙丘，从眼前消失。古利什再也看不见他们，只好转身去看被留下的姑娘。
        - id: ch02-b16
          speaker: guleesh
          text: 谢天谢地，他们总算走了。比起跟他们去，你更愿意留下来陪我吧？
        - id: ch02-b17
          speaker: narrator
          text: 姑娘没有回答。古利什还不知道她遭到了什么，以为她只是仍在伤心，便又放柔声音对她说话。
        - id: ch02-b18
          speaker: guleesh
          text: 小姐，恐怕你今夜要住在我父亲家了。有什么要我做的，只管告诉我，我愿意为你效劳。
        - id: ch02-b19
          speaker: narrator
          text: 美丽的姑娘依旧沉默，眼里含着泪，脸色一阵白、一阵红。
        - id: ch02-b20
          speaker: guleesh
          text: 小姐，你到底想让我怎么做？我从来不是那伙仙人的同伴。我只是老实农夫的儿子，根本不知道他们是谁，就糊里糊涂跟去了。只要能送你回到父亲身边，我一定送。你想让我做什么，尽管开口。
        - id: ch02-b21
          speaker: narrator
          text: 古利什仔细望着她的脸。她的嘴唇明明在动，像是努力想说出一句话，可嘴里始终没有半点声音传出来。
        - id: ch02-b22
          speaker: guleesh
          text: 难道你真的哑了？今夜在王宫，我还听见你跟王子说过话。莫非那个魔鬼打了你的脸，真把你打哑了？
        - id: ch02-b23
          speaker: narrator
          text: 姑娘抬起柔白光洁的手，把一根手指放在舌头上，叫古利什明白自己的声音已经没了，再也不能说话。泪水像溪流一样从她双眼淌下。古利什自己的眼睛也湿了。他外表虽然粗犷，心肠却十分柔软，实在受不了眼睁睁看着一个年轻姑娘落到这样不幸的境地。
        - id: ch02-b24
          speaker: narrator
          text: 古利什暗暗思量该怎么办，却不愿把姑娘带回父亲家。他很清楚，家里人绝不会相信自己去过法国，更不会相信他带回了法国国王的女儿。他还怕他们取笑这位小姐，或说出冒犯她的话。他站在那里犹豫不决，不知道该把她送往何处。正在这时，他忽然想起了神父。
        - id: ch02-b25
          speaker: guleesh
          text: 感谢上帝，我知道怎么办了！我带你去神父家。他是我的好朋友，会收留你，也会好好照顾你。你若更愿意去别处，我就送你到那里。
        - id: ch02-b26
          speaker: narrator
          text: 姑娘低头向他道谢，又示意无论他去哪里，自己都愿意跟随。
        - id: ch02-b27
          speaker: guleesh
          text: 那就去神父家。他欠我一个人情，我开口相求，他一定答应。
    - id: ch03
      title: 神父家里的哑姑娘
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两人就这样一同走向神父家。等他们来到门前，太阳才刚刚升起。古利什用力敲响了门。时候虽然还早，神父却已经起床，听见声音便亲自来开门。他一看见古利什和这位年轻姑娘站在一起，顿时大为惊奇，认准这两个人一大早赶来，一定是急着求他主持婚礼。
        - id: ch03-b02
          speaker: priest
          text: 古利什，你可真是个好小子！连十点、十二点也等不了，天刚亮就带着心上人来成婚。你该知道，这个时候我不能合乎教规地替你们办婚礼。哎哟哟！看在上帝的分上，这位是谁？你又是从哪里把她带来的？
          emotion: surprised
        - id: ch03-b03
          speaker: guleesh
          text: 神父，您愿意的话，替谁主持婚礼都行。可我不是为结婚来的，只想请您收留这位年轻小姐。
        - id: ch03-b04
          speaker: narrator
          text: 神父瞪着他，仿佛他突然长了十个脑袋。不过神父没再追问，便请两人进屋，关上门，带他们到客厅坐下。
        - id: ch03-b05
          speaker: priest
          text: 好了，古利什。老实告诉我，这位小姐究竟是谁？你是真的疯了，还是故意拿我寻开心？
        - id: ch03-b06
          speaker: guleesh
          text: 我没有撒谎，也不是开玩笑。我从法国国王的宫殿里带出了这位小姐，她就是法国国王的女儿。
        - id: ch03-b07
          speaker: narrator
          text: 古利什从头说起，把整件事一五一十告诉神父。神父听得太惊讶了，时不时便叫出声来，还忍不住拍起双手。古利什说，仙人搅乱婚礼以前，姑娘看起来就根本不愿出嫁。听见这话，她的脸颊立刻红了。古利什更加确信，即使眼下的境况如此糟糕，她也宁可这样生活，也不肯成为那个自己憎恨的男人的妻子。
        - id: ch03-b08
          speaker: guleesh
          text: 神父，请让她留在您家吧。您肯照顾她，我会万分感激。
        - id: ch03-b09
          speaker: priest
          text: 只要你愿意，她想住多久都可以。可我们没有办法送她回到父亲身边，往后究竟怎么办呢？
        - id: ch03-b10
          speaker: guleesh
          text: 这也是我最担心的。眼下只能安静等着，直到找到更好的机会。
        - id: ch03-b11
          speaker: narrator
          text: 两人商量好，眼下先安静等待，直到能找到更好的办法。对外只说姑娘是神父兄弟的女儿，从另一个郡来探望叔父，而且不会说话。神父还要尽力不让旁人接近她，免得秘密泄露。他们把整套安排告诉姑娘，她用眼神向两个人表示感激。古利什这才回家。家人问他一夜去了哪里，他只说自己在篱沟脚下睡着了，整夜都在那里。
        - id: ch03-b12
          speaker: narrator
          text: 姑娘来得太突然，神父的邻居全都觉得奇怪。没有人知道她从哪里来，也不知道她为什么要住在那里。有人说，这件事处处不对劲。也有人说，古利什已经不像从前那个古利什了，天天往神父家跑，实在古怪。更叫他们想不明白的是，神父偏偏还喜欢他、看重他。大家怎么猜也猜不透其中缘故。
        - id: ch03-b13
          speaker: narrator
          text: 他们倒没有说错。古利什几乎每天都来看神父，也几乎每次都怀着同一个希望，希望年轻小姐已经康复，重新得到说话的能力。可是，她始终是个哑巴，沉默无言，没有半点好转，也找不到医治的办法。她只能用手和手指的动作，用眼睛的眨动、嘴巴的开合，用欢笑或微笑，再加上千百种不同的手势，同古利什慢慢交谈。没过多久，两人已经能很好地明白彼此的意思。
        - id: ch03-b14
          speaker: narrator
          text: 古利什一直想着怎样把她送回父亲身边。可是，没有人可以一路护送她，他自己也不知道应该走哪条路。在那个奇异的夜晚以前，他一辈子都没有离开过自己的国家。神父知道的并不比他多。古利什向神父求助，神父便给法国国王写了三四封信，把信交给那些漂洋过海、从一个地方到另一个地方经商的商贩，请他们代为转送。可这些信全在路上遗失了，没有一封送到国王手里。
        - id: ch03-b15
          speaker: narrator
          text: 就这样过了好几个月，古利什一天比一天更深地爱上姑娘。他自己和神父也都看得出来，姑娘同样喜欢他。到了后来，古利什越来越害怕，担心法国国王真的听到女儿的下落，会派人来把她从自己身边带走。他终于恳求神父别再写信，宁愿把往后的一切交给上帝安排。
        - id: ch03-b16
          speaker: narrator
          text: 这样的日子过了整整一年。秋季最后一个月的最后一天，古利什独自躺在草地上，把自己跟仙人渡海以来发生的每一件事重新想了一遍。他突然记起，去年正是十一月的一个夜晚，自己站在屋旁的山墙下，旋风卷着那些仙人从身边经过。
        - id: ch03-b17
          speaker: guleesh
          text: 今夜又是十一月之夜。我要回到去年的地方，看看那些仙人会不会再来。也许我能听见有用的事，让玛丽重新说话。
        - id: ch03-b18
          speaker: narrator
          text: 古利什和神父不知道公主的真名，一直把她叫作玛丽。古利什把计划告诉神父，得到了他的祝福。
    - id: ch04
      title: 十一月之夜的秘密
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 天色渐暗，古利什来到古老的仙丘。他曲起胳膊肘，靠在一块灰色的古石板上，等着午夜到来。月亮慢慢升起，在他身后就像一团火。白昼十分炎热，夜里一凉，白雾便从草地和所有潮湿的地方浮起来。四周平静得像一潭湖水，连一丝能吹动波纹的风也没有。耳边只有虫儿偶尔飞过时低低的嗡鸣。野雁从一座湖飞向另一座湖，在他头顶半英里高的空中发出忽然又沙哑的叫声。金色和绿色的鸻鸟吹着尖利的口哨，时而升起又落下，落下又升起。千千万万颗明亮的星星在头顶闪耀。薄霜也降下来了，把他脚下的草冻得又白又脆。
        - id: ch04-b02
          speaker: narrator
          text: 一个钟头，两个钟头，三个钟头过去。霜越来越重，古利什每次挪动脚步，都能听见下面的芦秆喀嚓折断。他渐渐以为仙人今夜不会来了，觉得还不如回家。就在这时，远处忽然传来声音，一路朝他逼近。他一听便认出那是什么。声音越来越响，起初像海浪拍打石岸，随后像巨大的瀑布轰然倾泻，最后又像一场暴风刮过树梢。紧接着，旋风猛地冲进仙丘，仙人们就在风里。
        - id: ch04-b03
          speaker: narrator
          text: 风来得太突然，古利什一时喘不过气。他马上稳住自己，重新喘过气来，竖起耳朵。仙人一聚齐，便又吵又叫，说个不停。
        - id: ch04-b04
          speakers: [fairy_1, fairy_2, fairy_3, fairy_4]
          ensemble: chorus
          text: 我的马，我的缰绳和鞍子！我的马，我的缰绳和鞍子！
        - id: ch04-b05
          speaker: guleesh
          text: 我的马，我的缰绳和鞍子！我的马，我的缰绳和鞍子！
        - id: ch04-b06
          speaker: fairy_1
          text: 哎呀，古利什！你又来跟我们作伴了？你和那个女人过得怎样？今晚别喊马了。我敢担保，你再也不能像去年那样捉弄我们。那一招耍得可真妙，是不是？
        - id: ch04-b07
          speaker: fairy_2
          text: 可不是。他再也办不到了。
        - id: ch04-b08
          speaker: fairy_3
          text: 这小子真了不起！他把女人留在身边整整一年，人家连一句“你好吗”都没跟他说过。
        - id: ch04-b09
          speaker: fairy_4
          text: 也许他就喜欢看着她。
        - id: ch04-b10
          speaker: fairy_2
          text: 这个傻瓜要是知道，自己门口就长着一株草药，煮给她喝就会痊愈，那该多好。
        - id: ch04-b11
          speaker: fairy_3
          text: 你说得对。
        - id: ch04-b12
          speaker: fairy_4
          text: 他本来就是个傻瓜。
        - id: ch04-b13
          speaker: fairy_1
          text: 别替他费心了，我们走。
        - id: ch04-b14
          speaker: fairy_2
          text: 就让这个蠢汉照旧待着吧。
        - id: ch04-b15
          speaker: narrator
          text: 仙人腾空而起，又闹着一阵“鲁利亚布利亚”，沿原路飞走了。可怜的古利什留在原处，眼睛几乎瞪出眼眶，只顾惊奇地望着他们。
        - id: ch04-b16
          speaker: narrator
          text: 古利什很快往家走，一路琢磨，自家门口是否真有能让公主开口的草药。
        - id: ch04-b17
          speaker: guleesh
          text: 草药若真有效，他们不该把秘密告诉我。可也许那个仙人一时没留神，说漏了嘴。太阳一出来，我就仔细找找，看屋旁除了蓟草和酸模，还有没有别的植物。
        - id: ch04-b18
          speaker: narrator
          text: 古利什回到家时疲惫不堪，却一夜都没有合眼。太阳一升起，他马上来到屋外，把房子四周的草地仔仔细细搜了一遍，只找自己不认识的草。没过多久，果然看见一株高大而陌生的植物，紧挨着山墙生长。他走上前细看，发现茎上有七根小枝，每根小枝又长着七片叶子，叶片里面还有白色汁液。
        - id: ch04-b19
          speaker: guleesh
          text: 真奇怪，我从前怎么没见过？世上若有药草真带着神效，也该是这样奇异的一株。
        - id: ch04-b20
          speaker: narrator
          text: 古利什抽出小刀，割下药草，带回自己的屋子。他先剥掉叶子，再把草茎切碎。浓稠的白汁随即流出来，像苦苣菜揉碎时淌出的汁水，只是看上去更像油。他把药草放进小锅，加上一点水，搁在火上煮到沸腾。然后，他拿来一只杯子，往里面倒了半杯药汁，送到自己嘴边。就在这时，他突然想到，药汁也许有毒。说不定仙人故意引他上当，想让他用这个办法毒死自己，或在毫不知情的时候把姑娘害死。
        - id: ch04-b21
          speaker: narrator
          text: 古利什重新放下杯子，只用指尖蘸了几滴，放进嘴里尝尝。药汁一点也不苦，反而甘甜可口。他的胆子渐渐大了，先喝下一顶针的分量，又喝下同样多，最后索性不停口，直喝掉半杯。喝完以后，他沉沉睡去，直到夜里才醒。醒来时，他感到又饿又渴。夜色还深，只好继续等到天亮，不过他已经打定主意，早晨一醒就去见国王的女儿，让她也喝下这种药汁。
    - id: ch05
      title: 失而复得的声音
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 次日早晨，古利什一起身，就捧着药汁赶去神父家。一路上，他觉得自己从来没有这样勇敢无畏，也从来没有这样精神饱满、身轻力健。他完全相信，这股健旺的力量正是自己喝下的药汁带来的。到了神父家，他看见神父和年轻小姐都在屋里。两个人见到他十分惊讶，不明白他为什么整整两天没有来看望他们。
        - id: ch05-b02
          speaker: guleesh
          text: 我又见到了仙人。他们说，我家门口的草药能让她恢复。我找到了那株草，也亲自喝过。它不但没有害处，还让我精神百倍。我敢发誓，这药汁不会伤害她。
        - id: ch05-b03
          speaker: narrator
          text: 古利什先让姑娘尝了一点，然后把杯子递给她。她喝下整整半杯，随即向后倒在床上，陷入沉睡。她这一睡，直到第二天也没有醒来。古利什和神父整夜坐在床边，一刻也不敢离开，只等着她睁眼。他们一会儿满怀希望，一会儿又几乎绝望。一边盼望这药真能救她，一边又害怕自己反而伤害了她。
        - id: ch05-b04
          speaker: narrator
          text: 太阳走过半边天空，她终于睁开眼睛。她揉着双眼，看上去完全不知道自己身在何处。转头看见古利什和神父都守在屋里，她又像受惊似的愣住了。她慢慢坐起来，竭力收拢纷乱的思绪。两个男人焦急万分，只想知道她究竟能不能开口，却又不敢催促。他们沉默着等了两三分钟，最后，还是神父先问了一句。
        - id: ch05-b05
          speaker: priest
          text: 玛丽，你睡得好吗？
        - id: ch05-b06
          speaker: princess
          text: 睡得很好，谢谢您。
        - id: ch05-b07
          speaker: narrator
          text: 古利什听见她说话，欢呼着跑到床前，双膝跪下。
        - id: ch05-b08
          speaker: guleesh
          text: 万分感谢上帝，是他把声音还给了你！我的心上人，请再跟我说句话吧！
          emotion: happy
        - id: ch05-b09
          speaker: princess
          text: 我知道，是你为我煮了药汁，又把它送来。从我来到爱尔兰的第一天起，你一直好心照顾我。我从心底感激你，也永远不会忘记。
        - id: ch05-b10
          speaker: narrator
          text: 古利什欢喜满足得简直要死。大家给姑娘端来食物，她胃口很好，吃得又高兴又快活。她终于可以自由说话，吃饭时一直同神父交谈，简直一刻也舍不得停。后来，古利什回到自己家里，往床上一躺，也再次睡着了。草药的效力还没有完全消退，他又整整睡了一天一夜。
        - id: ch05-b11
          speaker: narrator
          text: 古利什醒来以后立刻赶回神父家，却发现年轻小姐也是一样。从他离开后不久开始，她几乎一直沉睡到现在。古利什和神父一同走进她的房间，守在床边，直到她第二次醒来。她的声音依然完好，说起话来和从前没有两样。古利什这才彻底放下心来，喜不自胜。神父又把食物摆上桌，三个人坐在一起吃饭。
        - id: ch05-b12
          speaker: narrator
          text: 从此，古利什一天又一天地来到神父家。他和公主之间的感情越来越深。姑娘在这里没有别的人可以交谈，平日说话的对象只有古利什和神父，而这两个人里，她最喜欢的还是古利什。日子久了，两人终于结为夫妻，还办了一场再美满不过的婚礼。
        - id: ch05-b13
          speaker: narrator
          text: 我要是当时也在场，如今就不会在这里了。不过，我听一只小鸟说，他们此后一生无忧无虑，无病无愁，没有灾祸，也没有不幸，直到离世的时辰。愿我如此，也愿我们人人如此！
