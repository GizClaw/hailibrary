  chapters:
    - id: ch01
      title: The Riders in the Rath
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There was once a boy named Guleesh who lived in County Mayo. Near the gable of his house stood the finest rath in the country, with a smooth green bank running all around it. Guleesh often went there and sat upon the grass. One night he stood half leaning against the gable of the house. For two long hours he watched the sky and the beautiful white moon overhead.
        - id: ch01-b02
          speaker: guleesh
          text: It is my bitter grief that I have never gone away from this place. I would rather be anywhere else in the world than here. Ah, white moon, it is well for you. You go turning and turning wherever you please, and no man can hold you back. I wish I were the same as you.
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: The words had hardly left his mouth when a great noise came toward him. It sounded like a whole crowd running together, talking, laughing, and making sport as they came. Then the sound swept by him like a whirlwind. Guleesh listened as it rushed straight into the rath.
        - id: ch01-b04
          speaker: guleesh
          text: By my soul, you sound merry enough. I am going after you.
        - id: ch01-b05
          speaker: narrator
          text: It was the fairy host, though Guleesh did not know that yet. He followed them into the rath and heard their wild fulparnee and folpornee, their rap-lay-hoota and roolya-boolya. Every one of the little people shouted at the top of his voice.
        - id: ch01-b06
          speakers: [fairy_leader, fairy_second, fairy_third, fairy_fourth]
          ensemble: chorus
          text: My horse, and bridle, and saddle! My horse, and bridle, and saddle!
        - id: ch01-b07
          speaker: guleesh
          text: That is a fine trick. Let me try it too. My horse, and bridle, and saddle! My horse, and bridle, and saddle!
        - id: ch01-b08
          speaker: narrator
          text: The moment he called, a handsome horse stood before him. Its bridle was made of gold and its saddle of silver. Guleesh sprang onto its back. As soon as he was mounted, he could see clearly into the rath. It was full of horses, and little people were climbing onto them and preparing to ride.
        - id: ch01-b09
          speaker: fairy_leader
          text: Are you riding with us tonight, Guleesh?
        - id: ch01-b10
          speaker: guleesh
          text: I surely am.
        - id: ch01-b11
          speaker: fairy_leader
          text: Then come along.
        - id: ch01-b12
          speaker: narrator
          text: Out they flew together, riding like the wind. They went faster than the swiftest horse anyone ever saw in a hunt, and faster than a fox with the hounds at its tail. The cold winter wind ahead of them was overtaken, but the cold winter wind behind them could never catch them. They made no stop and took no rest in that headlong race until they reached the very edge of the sea.
        - id: ch01-b13
          speakers: [fairy_leader, fairy_second, fairy_third, fairy_fourth]
          ensemble: chorus
          text: Hie over cap! Hie over cap!
        - id: ch01-b14
          speaker: narrator
          text: The moment they cried the words, horses and riders rose together into the air. Guleesh scarcely had time to remember where he was before they came down on dry ground once more. Without pausing, they raced onward as swiftly as the wind. Mile after mile fell behind them before the riders finally drew to a standstill.
        - id: ch01-b15
          speaker: fairy_leader
          text: Guleesh, do you know where you are now?
        - id: ch01-b16
          speaker: guleesh
          text: I have no idea at all.
        - id: ch01-b17
          speaker: fairy_leader
          text: You are in France, Guleesh. The king's daughter is to be married tonight, and she is the most beautiful woman the sun ever saw. We must do our best to carry her away, if only we can manage it. That is why you must come with us. When we bring her out, we need you to place her behind you on your horse. It is not lawful for her to ride behind one of us. But you are flesh and blood, so she can take a firm hold of you and keep from falling. Are you satisfied with that? Will you do what we tell you?
        - id: ch01-b18
          speaker: guleesh
          text: Why would I refuse? I am satisfied, and I will do whatever you ask.

    - id: ch02
      title: The Wedding in France
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The riders dismounted where they stood. One fairy spoke a word Guleesh could not understand. In that instant they were lifted away, and Guleesh found himself with all his companions inside the king's palace. A magnificent feast filled the hall. There was hardly a nobleman or gentleman in the kingdom who had not gathered there. They wore silk and satin, with gold and silver gleaming everywhere. The night inside was as bright as day from the lamps and candles, and Guleesh had to shut both eyes against the blaze.
        - id: ch02-b02
          speaker: narrator
          text: When he opened his eyes again, he thought he had never seen anything so fine. A hundred tables were spread through the hall. Every one was heaped with meat, cakes, sweetmeats, wine, ale, and every kind of drink a man had ever seen. Musicians played the sweetest music at both ends of the hall. In the middle, young women and handsome youths danced, turned, and circled so quickly and lightly that Guleesh grew dizzy watching them. Elsewhere people performed tricks, made jokes, and burst into laughter. France had not seen a feast like this for twenty years.
        - id: ch02-b03
          speaker: narrator
          text: The reason for all that splendor was the old king's only daughter. None of his other children remained alive, and now she was to marry the son of another king. The celebration had already lasted for three days. This was the third and final night, when the marriage itself would take place. And it was on that very night that Guleesh and the fairies had come, hoping to carry the young princess away.
        - id: ch02-b04
          speaker: narrator
          text: Guleesh and his companions stood close together at the head of the hall. A splendid altar had been prepared there, and two bishops waited behind it to marry the princess when the proper moment came. Yet no one at the feast looked toward the strangers. On entering, the fairies had spoken a word that made them all invisible. To everyone in the palace, it was as if they were not there at all.
        - id: ch02-b05
          speaker: guleesh
          text: Which one is the king's daughter?
        - id: ch02-b06
          speaker: fairy_leader
          text: Do you not see her over there?
        - id: ch02-b07
          speaker: narrator
          text: Guleesh followed the fairy's pointing finger and saw the loveliest woman he believed the whole world could hold. Rose and lily seemed to struggle for victory in her face, and no one could say which had won. Her arms and hands were pale and smooth. Her mouth was red as a ripe strawberry, and her foot looked scarcely larger or heavier than another person's hand. Her figure was smooth and slender, and her hair fell in golden curls. Gold and silver were woven through her clothes, while the bright stone in the ring upon her hand shone like the sun.
        - id: ch02-b08
          speaker: narrator
          text: Her beauty almost blinded him. Then he looked more closely and saw that she was crying. The marks of tears remained in her eyes.
        - id: ch02-b09
          speaker: guleesh
          text: How can she be grieving when everyone around her is celebrating?
        - id: ch02-b10
          speaker: fairy_leader
          text: She has good reason to grieve. She is being married against her will, and she has no love for the husband chosen for her. The king meant to give her to him three years ago, when she was only fifteen. She told her father she was too young and begged him to let her remain as she was. He gave her a year's grace. When that year ended, he allowed another, and after that he allowed one more. But now he will not give her another week or even a single day. She is eighteen tonight, and he says it is time for her to marry. Still, she will marry no king's son if I can prevent it.
        - id: ch02-b11
          speaker: narrator
          text: As he said those last words, the fairy twisted his mouth into an ugly shape. Guleesh's heart went out to the princess. It grieved him to think she must marry a man she did not love. Yet being carried away and forced to take a wicked fairy for a husband would be worse still. He said nothing aloud, but he bitterly cursed the luck that had brought him there to help snatch her from her father and her home.
        - id: ch02-b12
          speaker: guleesh
          text: If only I could help her, I would not care whether I lived or died. But I cannot see what to do.
          emotion: sad
        - id: ch02-b13
          speaker: narrator
          text: While Guleesh watched, the king's son approached the princess and asked her for a kiss. She turned her head away from him. Guleesh pitied her twice as much when the young man took her soft white hand and drew her into the dance. They circled around the hall and passed close to where Guleesh stood. Even in the dance, he could plainly see the tears in her eyes.
        - id: ch02-b14
          speaker: narrator
          text: When the dance ended, the old king and the queen came forward. They said the right time had arrived, the bishop was ready, and the wedding ring must be placed upon their daughter's hand. Now she was to be given to her husband. The king took the young man by the hand. The queen took her daughter, and the four of them moved toward the altar with all the lords and great people following behind.
        - id: ch02-b15
          speaker: narrator
          text: They had come within four yards of the altar when the fairy leader stretched his foot across the princess's path. She stumbled and fell. Before she could rise, he threw something from his hand over her and spoke two strange words. In that instant the maiden vanished from among the wedding party. The same spell that hid the fairies now hid her from every eye. The little man seized her, lifted her behind Guleesh, and the invisible company hurried through the hall toward the door.
        - id: ch02-b16
          speaker: narrator
          text: What grief and confusion broke loose then! There was crying, wondering, calling, and searching on every side. The princess had disappeared before their eyes, yet not one person had seen what took her. While the whole palace rang with trouble and lament, the hidden company passed straight through the door. No guard stopped them, for no one could see them go.
        - id: ch02-b17
          speakers: [fairy_leader, fairy_second, fairy_third, fairy_fourth]
          ensemble: chorus
          text: My horse, and bridle, and saddle!
        - id: ch02-b18
          speaker: guleesh
          text: My horse, and bridle, and saddle!
        - id: ch02-b19
          speaker: narrator
          text: His horse appeared at once, fully saddled and bridled.
        - id: ch02-b20
          speaker: fairy_leader
          text: Mount now, Guleesh, and set the lady behind you. Morning is not far away.

    - id: ch03
      title: The Trick Guleesh Played
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Guleesh raised the princess onto the horse's back, then leaped into the saddle before her. He called for the horse to rise. His mount and all the fairy horses sprang forward together, racing at full speed until they reached the sea.
        - id: ch03-b02
          speakers: [fairy_leader, fairy_second, fairy_third, fairy_fourth]
          ensemble: chorus
          text: Hie over cap!
        - id: ch03-b03
          speaker: guleesh
          text: Hie over cap!
        - id: ch03-b04
          speaker: narrator
          text: At the cry, the horse rose beneath Guleesh and cut a great leap through the clouds. It came down again in Ireland. The riders did not stop even then. They raced all the way to Guleesh's house and the old rath beside it. As soon as they arrived, Guleesh turned, caught the princess in both arms, and sprang with her from the horse.
        - id: ch03-b05
          speaker: guleesh
          text: In the name of God, I call and cross you to myself!
        - id: ch03-b06
          speaker: narrator
          text: Before the last word was out of his mouth, the splendid horse collapsed beneath him. There was no horse at all. It was only the beam of a plow, enchanted into that shape. Every other mount changed in the same way. Some fairies had been riding old brooms, some broken sticks, and others mere weed stems or stalks of hemlock.
        - id: ch03-b07
          speakers: [fairy_leader, fairy_second, fairy_third, fairy_fourth]
          ensemble: chorus
          text: Guleesh, you clown and thief! Why did you play such a trick on us? May no good come to you!
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: The fairies shouted their curses, but they could do nothing more. Once Guleesh had spoken God's name and consecrated the princess to himself, every bit of their power over her was gone. They could no longer carry her away.
        - id: ch03-b09
          speakers: [fairy_second, fairy_third, fairy_fourth]
          ensemble: chorus
          text: Is this how you repay our kindness? What good was our journey to France? You will pay us yet, Guleesh. You will be sorry for this!
          emotion: angry
        - id: ch03-b10
          speaker: fairy_leader
          text: He will gain nothing from the girl.
        - id: ch03-b11
          speaker: narrator
          text: The fairy leader stepped toward her and struck the side of her head.
        - id: ch03-b12
          speaker: fairy_leader
          text: Now she has lost her speech. What good will she be to you when she cannot speak? We are leaving, but you will remember us, Guleesh!
          emotion: angry
        - id: ch03-b13
          speaker: narrator
          text: With that threat, the fairy leader stretched out both hands. Guleesh had no time even to answer him. The leader and all the rest rushed into the rath and disappeared from sight. Guleesh never saw them again until a year had passed.
        - id: ch03-b14
          speaker: guleesh
          text: Thank God they are gone. Would you not rather stay with me than with them?
        - id: ch03-b15
          speaker: narrator
          text: The princess did not answer.
        - id: ch03-b16
          speaker: guleesh
          text: You are still troubled. You may have to stay at my father's house tonight, my lady. Tell me what I can do for you, and I will serve you.
        - id: ch03-b17
          speaker: narrator
          text: She remained silent. Tears filled her eyes, and the color came and went in her face.
        - id: ch03-b18
          speaker: guleesh
          text: Please tell me what you want. I never belonged to those fairies. I am an honest farmer's son, and I followed them without knowing what they were. If I can send you home to your father, I will. Ask anything of me.
        - id: ch03-b19
          speaker: narrator
          text: Guleesh looked closely into her face. Her mouth moved as though she meant to speak, but no word came from it. He could scarcely believe it. Had he not heard her speaking with the king's son only that night? Had the fairy's blow truly struck away her voice? The princess raised one smooth white hand and laid a finger on her tongue to show that her power of speech was gone. Tears ran from both her eyes like streams. Guleesh's eyes were not dry either. However rough he might look outside, he had a soft heart and could not bear to see her in such misery.
        - id: ch03-b20
          speaker: narrator
          text: Guleesh stood wondering what he ought to do. He did not want to take her into his father's house. His family would never believe that he had crossed the sea to France and returned in one night with the king's daughter. Worse, they might make sport of the princess or treat her with disrespect. He hesitated, unable to choose a safe course for her. Then all at once he remembered the priest.
        - id: ch03-b21
          speaker: guleesh
          text: Now I know what to do. A good priest who is my friend will shelter you and care for you. I am reluctant to bring you to my father's house, but I will take you anywhere else you wish to go.
        - id: ch03-b22
          speaker: narrator
          text: She bowed her head in thanks and showed that she would follow him.
        - id: ch03-b23
          speaker: guleesh
          text: Then we will go to the priest. He owes me a kindness, and he will help us.

    - id: ch04
      title: The Silent Princess
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: They set off together for the priest's house. The sun was just rising when they reached his door. Guleesh knocked hard, and though the hour was early, the priest was already awake and opened the door himself. He stared at Guleesh and the beautiful stranger. At first he felt certain they had come in such haste because they wanted him to marry them.
        - id: ch04-b02
          speaker: priest
          text: Guleesh, could you not wait until ten or twelve before bringing your sweetheart here? I cannot marry you at this hour, at least not lawfully. But wait! In God's name, who is this young woman, and where did you find her?
          emotion: surprised
        - id: ch04-b03
          speaker: guleesh
          text: Father, you may marry me or anyone else when you please. I did not come for a wedding. I came to ask whether this lady might stay in your house.
        - id: ch04-b04
          speaker: narrator
          text: The priest stared at Guleesh as though the boy had grown ten heads. Still, he asked no further questions while they stood outside. He invited both Guleesh and the maiden in, shut the door carefully behind them, and led them into the parlor. Only after he had seated them did he demand an explanation.
        - id: ch04-b05
          speaker: priest
          text: Now tell me the truth. Who is she? Have you lost your senses, or are you playing some joke on me?
        - id: ch04-b06
          speaker: guleesh
          text: I am neither lying nor joking. I carried her away from the palace of the king of France. She is the king's daughter.
        - id: ch04-b07
          speaker: narrator
          text: Guleesh began at the beginning and told the whole story. He described the whirlwind, the rath, the enchanted horses, the journey to France, and the princess's disappearance from the wedding hall. The priest listened in such astonishment that now and then he cried aloud or clapped his hands together. When Guleesh explained that the princess had not wanted the marriage planned for her, a deep blush came into her cheek. That made him more certain than ever. Bad as her present trouble was, she preferred it to becoming the wife of the man she hated.
        - id: ch04-b08
          speaker: narrator
          text: Guleesh asked the priest to keep the princess in his own house. The kind man agreed to shelter her for as long as Guleesh wished. Still, neither of them knew what should happen next, for they had no means of sending her back to her father. They decided to keep quiet until some better opportunity appeared. The priest would say the young woman was his brother's daughter, visiting him from another county. He would tell everyone she had no speech and do his best to keep strangers away from her. They explained the whole plan to the princess, and she showed with her eyes that she was grateful.
        - id: ch04-b09
          speaker: narrator
          text: Guleesh returned to his own house. When his family asked where he had spent the night, he told them he had fallen asleep at the foot of a ditch and stayed there until morning. Meanwhile, the priest's neighbors wondered about the silent young woman who had appeared so suddenly, with no one knowing where she came from or what business brought her there. Some said something was not right. Others said Guleesh no longer seemed like the same boy. They could not understand why he went to the priest's house every day, or why the priest treated him with such affection and respect.
        - id: ch04-b10
          speaker: narrator
          text: The neighbors were right about his visits. Hardly a day passed when Guleesh did not go to the priest's house and talk with him. Every time he came, he hoped to find that the princess had recovered and could speak again. But she remained dumb and silent, with neither relief nor cure. Since she had no other way to talk, she used her hands and fingers. She winked her eyes, opened and closed her mouth, laughed, smiled, and made a thousand different signs. Before long, she and Guleesh understood each other very well.
        - id: ch04-b11
          speaker: narrator
          text: Guleesh was always thinking of how to return her to her father. There was no one who could escort her, and Guleesh himself did not know the road. Before the night of the enchanted ride, he had never once left his own country. The priest had no more knowledge of the journey than he did. When Guleesh asked for help, the priest wrote three or four letters to the king of France. He entrusted them to merchants who carried goods from place to place across the sea. But every letter went astray, and not one ever reached the king's hand.
        - id: ch04-b12
          speaker: narrator
          text: That was how they lived for many months. With every passing day, Guleesh fell more deeply in love with the princess. Both he and the priest could plainly see that she liked him in return. At last a new fear took hold of him. What if the king truly learned where his daughter was? He would surely come and take her away. Guleesh begged the priest to write no more letters. They should leave the whole matter in the hands of God.

    - id: ch05
      title: Another November Night
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: A full year passed. On the last day of the last month of autumn, Guleesh lay alone in the grass. His thoughts wandered back over everything that had happened since the night he crossed the sea with the fairies. Then a memory came to him sharply. It had been on a November night that he stood beside the gable and heard the whirlwind. Now November night had come again.
        - id: ch05-b02
          speaker: guleesh
          text: Tonight I will stand where I stood last year and wait for the good people. Perhaps I will hear something that can bring Mary's speech back.
        - id: ch05-b03
          speaker: narrator
          text: Mary was the name he and the priest had given the princess, since neither of them knew her true name. Guleesh went at once to tell the priest what he intended. The priest gave the plan his blessing. As darkness fell, Guleesh returned to the old rath. He bent one elbow upon a gray old stone and settled there alone to wait until midnight.
        - id: ch05-b04
          speaker: narrator
          text: The moon rose slowly behind him like a knob of fire. White mist gathered over the grassy fields and every damp hollow, for the night had turned cool after the heat of the day. It was as calm as a lake when no breath of wind moves a wave. Guleesh heard only the low song of insects passing from time to time, the sudden rough cry of wild geese flying from lake to lake half a mile above his head, and the sharp whistle of green and golden plovers as they rose and settled in the dark. Thousands upon thousands of bright stars shone above him. A light frost had come, leaving the grass beneath his feet white and crisp.
        - id: ch05-b05
          speaker: narrator
          text: Guleesh stood there for one hour, then two, then three. All the while the frost grew harder and sharper. Whenever he shifted his feet, he could hear the frozen grass stems breaking beneath them. At last he began to think that the fairies would not come that night after all. He decided he might as well turn home. Just then, a sound reached him from far away. From the very first moment, he recognized what it was.
        - id: ch05-b06
          speaker: narrator
          text: The sound came nearer and grew louder. At first it was like waves beating upon a stony shore. Then it became the fall of a great waterfall. At last it roared like a powerful storm among the tops of the trees. The whirlwind burst into the rath in one wild rush, and the fairy host was inside it. Everything swept past so suddenly that Guleesh lost his breath. But he quickly recovered, held himself still, and listened closely to every word they might say.
        - id: ch05-b07
          speakers: [fairy_leader, fairy_second, fairy_third, fairy_fourth]
          ensemble: chorus
          text: My horse, and bridle, and saddle! My horse, and bridle, and saddle!
        - id: ch05-b08
          speaker: guleesh
          text: My horse, and bridle, and saddle! My horse, and bridle, and saddle!
        - id: ch05-b09
          speaker: fairy_leader
          text: Well, Guleesh, are you among us again? How is your woman? Calling for a horse will do you no good tonight. You will not play last year's trick on us twice. It was a clever trick, was it not?
        - id: ch05-b10
          speaker: fairy_second
          text: Clever enough, but he will not manage it again.
        - id: ch05-b11
          speaker: fairy_third
          text: What a grand fellow he is! He carried off a woman who has not even said, "How do you do?" to him in a year.
        - id: ch05-b12
          speaker: fairy_fourth
          text: Maybe he only wants to look at her.
        - id: ch05-b13
          speaker: fairy_leader
          text: The fool does not know an herb grows beside his own door. If he boiled it and gave it to her, she would be well.
        - id: ch05-b14
          speaker: fairy_second
          text: That is the truth.
        - id: ch05-b15
          speaker: fairy_third
          text: He really is a fool.
        - id: ch05-b16
          speaker: fairy_fourth
          text: Forget about him. Let us be off.
        - id: ch05-b17
          speaker: fairy_second
          text: Leave the old fellow as he is.
        - id: ch05-b18
          speaker: narrator
          text: With that, the fairies rose together into the air. One great roolya-boolya rang out, and they rushed away by the same road they had come. They left poor Guleesh standing exactly where they had found him. His eyes seemed ready to come out of his head as he stared after them, amazed by what he had heard.
        - id: ch05-b19
          speaker: narrator
          text: He did not remain there for long. As he hurried home, he turned every word over in his mind. Could an herb truly be growing beside his own door? Could it really restore the king's daughter's voice after a whole silent year? He hardly dared believe it, yet he could think of nothing else.
        - id: ch05-b20
          speaker: guleesh
          text: They would never tell me if the herb truly worked. Still, perhaps that fairy let the secret slip without noticing. At sunrise I will search every plant beside the house, even if there is nothing there but thistles and docks.

    - id: ch06
      title: The Herb by the Door
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Tired as he was, Guleesh could not sleep a wink before morning. As soon as the sun rose, he went outside. He searched carefully through all the grass around the house, looking for any herb he did not recognize among the common plants. He had not been searching long when he noticed a large, strange herb growing close beside the gable itself.
        - id: ch06-b02
          speaker: narrator
          text: He bent over it and examined it closely. Seven small branches came from the main stalk, and every little branch carried seven leaves. When he touched them, he saw that the leaves were filled with white sap. Nothing else around the house looked like it.
        - id: ch06-b03
          speaker: guleesh
          text: How did I never notice this before? If any herb has power, surely it is one as strange as this.
        - id: ch06-b04
          speaker: narrator
          text: Guleesh drew his knife, cut the strange plant at its base, and carried it into the house. He stripped off every leaf and cut the stalk into pieces. A thick white juice came out as he worked. It was like the sap that flows from a bruised sow thistle, except that this juice was heavier and looked almost like oil.
        - id: ch06-b05
          speaker: narrator
          text: Guleesh put the cut herb into a small pot, added a little water, and set it on the fire until the water boiled. Then he took a cup and filled it halfway with the milky liquid. He had brought it to his lips when a frightening thought stopped him. What if the herb was poison? Perhaps the fairies had spoken of it only to tempt him. He might kill himself with their trick, or worse, give the drink to the princess and cause her death without ever meaning to harm her.
        - id: ch06-b06
          speaker: narrator
          text: He set the cup down again. First he lifted only two drops on the tip of his finger and touched them to his tongue. The juice was not bitter at all. In fact, it had a sweet and pleasant taste. That made him bolder. He swallowed a thimbleful, then the same amount again. Little by little he kept drinking until half the cup was gone. Soon afterward he fell into a deep sleep. He did not wake until night had come, and then a great hunger and thirst were upon him.
        - id: ch06-b07
          speaker: narrator
          text: There was nothing he could do in the darkness, so he waited for day to rise again. He had decided that as soon as morning came, he would carry the drink to the king's daughter. When he got up, he felt bolder, more valiant, more spirited, and lighter than he had ever felt in his life. He was completely certain that the drink he had swallowed was what made him so hearty.
        - id: ch06-b08
          speaker: narrator
          text: Guleesh carried the drink straight to the priest's house. Inside, Mary and the priest were wondering why he had failed to visit them for two whole days. He told them about the fairies at the rath, the secret he had overheard, the strange herb, and the sleep that followed his own taste of it. He insisted there must be great power in the plant. Since he had tested the drink himself and gained strength from it, he vowed it could do Mary no harm and urged her to taste it.
        - id: ch06-b09
          speaker: narrator
          text: Guleesh placed the cup in the princess's hand. She drank half of what it held, then fell back upon her bed as a heavy sleep came over her. Hour followed hour, but she did not stir or open her eyes. She slept through the night and on into the following day. Guleesh and the priest stayed beside her the entire time and never left their watch. One moment they hoped the remedy had saved her, and the next they feared they had injured her. Neither man knew which feeling to trust.
        - id: ch06-b10
          speaker: narrator
          text: The sun was halfway across the sky when she opened her eyes at last. She rubbed them and looked around like someone who did not know where she was. When she saw Guleesh and the priest together in the room, astonishment crossed her face. She sat upright and did her best to gather her wandering thoughts. The two men watched in great anxiety, waiting to learn whether she could speak. Several silent minutes passed before the priest dared ask her a question.
        - id: ch06-b11
          speaker: priest
          text: Did you sleep well, Mary?
        - id: ch06-b12
          speaker: princess
          text: I did, thank you.
        - id: ch06-b13
          speaker: narrator
          text: The answer was quiet and simple, but it was the first spoken word they had heard from her in a year. For anxious hours they had wondered whether the herb would restore her or leave her silent. Now there could be no doubt. At the sound of her voice, Guleesh gave a great shout of joy. He ran across the room to her, fell upon both knees beside the bed, and poured out his thanks.
        - id: ch06-b14
          speaker: guleesh
          text: A thousand thanks to God for giving you back your speech! Lady of my heart, please speak to me again.
          emotion: happy
        - id: ch06-b15
          speaker: princess
          text: I understand that you prepared the drink and gave it to me. From my heart, I thank you for this and for every kindness you have shown me since I came to Ireland. You may be sure I will never forget it.
        - id: ch06-b16
          speaker: narrator
          text: Guleesh was almost overcome with satisfaction and delight. Food was brought for the princess, and she ate with a good appetite. She was merry and joyful, and while she ate, she hardly stopped talking with the priest. After a year of silence, the sound of her voice filled the room.
        - id: ch06-b17
          speaker: narrator
          text: Afterward, Guleesh returned to his own house. He stretched himself upon the bed and fell asleep once more, for the force of the herb had not yet left him. He slept through another full day and night. When he finally woke and hurried back to the priest's house, he found that the princess was in much the same state. She too had slept for nearly all the time since he went away.
        - id: ch06-b18
          speaker: narrator
          text: Guleesh entered her room with the priest, and together they watched beside her until she woke for the second time. Her speech was as clear and strong as it had ever been. Guleesh rejoiced all over again. The priest placed food on the table, and the three of them ate together. After that day, Guleesh continued coming to the house as he had before. His friendship with the king's daughter grew closer and closer. She had no one in that country to speak with except Guleesh and the priest, and of the two, she liked Guleesh best.
        - id: ch06-b19
          speaker: narrator
          text: In time, Guleesh and the princess married each other, and a fine wedding they had. The young woman who had been carried from France and the farmer's son who had crossed the sea on a plow beam began their life together at last. If I had been at that wedding then, I would not be here telling the tale now. But I heard from a little bird that neither care nor sorrow came upon them. They knew neither sickness nor misfortune until the hour of their death. May the same good fortune be with me, and with every one of us.
