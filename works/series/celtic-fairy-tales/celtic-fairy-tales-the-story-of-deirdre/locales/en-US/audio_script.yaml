  chapters:
    - id: ch01
      title: The Prophecy
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago in Ireland, there lived a good man named Malcolm Harper. He had plenty of this world's goods and a wife beside him, but they had no children. Then Malcolm heard that a soothsayer had come to the district. Whether Malcolm invited him or the man came on his own, the soothsayer soon arrived at Malcolm's house.
        - id: ch01-b02
          speaker: malcolm
          text: Do you still tell what is to come?
        - id: ch01-b03
          speaker: soothsayer
          text: A little. Is there something you wish to know?
        - id: ch01-b04
          speaker: malcolm
          text: If you are willing, tell me what fate has in store for me.
        - id: ch01-b05
          speaker: soothsayer
          text: I will go outside. When I return, I will give you my answer.
        - id: ch01-b06
          speaker: narrator
          text: The soothsayer left the house, but he was not gone long. When he returned, his news was terrible.
        - id: ch01-b07
          speaker: soothsayer
          text: In my second sight, I saw that a daughter of yours will cause more blood to be shed than Erin has known since time and race began. Because of her, the three most famous heroes ever found will lose their heads.
        - id: ch01-b08
          speaker: narrator
          text: In time, Malcolm did have a daughter. After her birth, he allowed no one into his house except himself and her nurse. Then he asked the woman to take the child far away and raise her where no eye would see her and no ear would hear of her.
        - id: ch01-b09
          speaker: malcolm
          text: Will you hide my daughter and bring her up where no living soul can find her?
        - id: ch01-b10
          speaker: nurse
          text: I will.
        - id: ch01-b11
          speaker: narrator
          text: Malcolm chose three men and led them away to a great mountain, distant and far beyond anyone's reach. No one knew where they had gone or what work they meant to do. In the middle of a round green hillock, Malcolm had the men dig out a hidden chamber. They hollowed the earth until there was room for a small household to live together. Then they covered the opening so carefully that no traveler passing over the hill would suspect there was a dwelling beneath it.
        - id: ch01-b12
          speaker: narrator
          text: There Deirdre lived with her foster-mother year after year. No living person knew or suspected that the two of them were hidden inside the hill, and nothing disturbed their secret life until Deirdre was sixteen. She grew like a white sapling, straight and slender as a rush on the moss. In form, face, and gentle nature, no lovelier young woman lived between earth and heaven in all Ireland. Whatever color had been in her cheeks a moment before, the instant anyone looked into her face, she blushed fiery red.
        - id: ch01-b13
          speaker: narrator
          text: Her foster-mother taught her every skill and every piece of knowledge she possessed. Deirdre knew the name of each blade of grass, each bird in the wood, and each star in the sky. Yet the old woman meant to keep her from speaking with any man in the world outside.
    - id: ch02
      title: The Hunter at the Green Hill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One gloomy winter night, black and scowling clouds covered the sky. A hunter was making his weary way across the hills when he lost the trail of the hunt. Soon he had lost his direction and his companions as well. He wandered on alone until hunger made him faint and the cold numbed his body. Drowsiness overcame him beside the beautiful green hill where Deirdre lived. He lay down there, exhausted from walking, and sank into a deep sleep.
        - id: ch02-b02
          speaker: narrator
          text: A troubled dream came to the sleeping hunter. He imagined that he stood in the warmth of a fairy stronghold while the fairies inside played their music. Still dreaming, he called aloud to anyone within and begged to be let inside for the Holy One's sake. His cry passed through the hidden door and reached Deirdre.
        - id: ch02-b03
          speaker: deirdre
          text: Foster-mother, what is making that cry?
        - id: ch02-b04
          speaker: nurse
          text: It is nothing, Deirdre. Only birds that have lost one another in the air. Let them pass on to the wooded glade. There is no house or shelter for them here.
        - id: ch02-b05
          speaker: deirdre
          text: But that bird begged to come in for the sake of the God of the Elements. You taught me that we must do whatever is asked in His name. If you leave the bird outside to freeze and starve, I cannot believe your teaching or your faith. I do believe what you taught me, so I will let the bird in myself.
        - id: ch02-b06
          speaker: narrator
          text: Deirdre rose before her foster-mother could prevent her. She crossed the hidden room, drew the bolt from the door, and brought the hunter in from the winter night. For the man who had come to their house, she placed a seat where a guest could rest, food where he could eat, and drink where he could refresh himself. Her foster-mother watched this stranger receive their hospitality, then looked at him sternly.
        - id: ch02-b07
          speaker: nurse
          text: For your life and clothing, hold your tongue. After receiving a home and a warm hearth on such a winter night, keeping quiet is little enough to ask.
        - id: ch02-b08
          speaker: hunter
          text: I can keep silent after the welcome you have given me. But I swear by your father's hand, your grandfather's hand, and your own two hands that if other people saw the beautiful young woman hidden here, they would not leave her with you for long.
        - id: ch02-b09
          speaker: deirdre
          text: What men do you mean?
        - id: ch02-b10
          speaker: hunter
          text: I mean Naois, son of Uisnech, and his two brothers, Allen and Arden.
        - id: ch02-b11
          speaker: deirdre
          text: What would those men look like if we saw them?
        - id: ch02-b12
          speaker: hunter
          text: Their hair is black as a raven, their skin white as a swan upon the water, and their cheeks red as the blood of a brindled calf. They move like salmon in a torrent and deer on a grey mountainside. Naois stands head and shoulders above all the other men of Erin.
        - id: ch02-b13
          speaker: nurse
          text: Whatever they look like, you must leave now and take another road. King of Light and Sun, I have little thanks for you, or for the girl who let you in!
          emotion: angry
        - id: ch02-b14
          speaker: narrator
          text: The hunter left the hill and went straight to King Connachar's palace. He sent word that he wished to speak with the king, and Connachar came out to meet him.
        - id: ch02-b15
          speaker: connachar
          text: What brought you here?
        - id: ch02-b16
          speaker: hunter
          text: I saw the fairest woman ever born in Erin, my king. I came to tell you about her.
        - id: ch02-b17
          speaker: connachar
          text: Who is she, and where can she be found? If you truly saw her, why has no one seen her before?
        - id: ch02-b18
          speaker: hunter
          text: I did see her. But no other man can find her unless I show him where she lives.
        - id: ch02-b19
          speaker: connachar
          text: Then guide me to her. Your reward for showing me the way will be as good as your reward for bringing the news.
        - id: ch02-b20
          speaker: hunter
          text: I will guide you, my king, though I doubt the women will want me to.
        - id: ch02-b21
          speaker: narrator
          text: Connachar called his nearest kinsmen and told them he meant to bring the hidden young woman to his court. On a fresh and gentle May morning, the king and his chosen company rose even before the birds began singing among the rocky caves and leafy groves. They set out in the early twilight, while heavy dew still lay on every bush, every flower, and every stem. At first, many of the young men stepped lightly and sprang over the ground. But the way to Deirdre's green hill was long, and the road was rough. By the time the company reached the glen, those same quick steps had become faint, failing, and unsteady.
        - id: ch02-b22
          speaker: hunter
          text: There is the bothy, down at the bottom of the glen. I will go no closer to the old woman.
        - id: ch02-b23
          speaker: narrator
          text: Connachar led his kinsmen down to the green hill and knocked on the bothy door.
        - id: ch02-b24
          speaker: nurse
          text: Only a king's command and a king's army could make me leave my bothy tonight. Tell me who wants this door opened.
        - id: ch02-b25
          speaker: connachar
          text: I do. Connachar, King of Ulster.
        - id: ch02-b26
          speaker: narrator
          text: The moment the poor woman heard who stood outside, she rose in haste and opened the door. Connachar entered, followed by every man in his company who could squeeze into the hidden dwelling. There before him stood the woman he had traveled so far to find. The king thought that neither in the course of a waking day nor in the dreams of night had he ever seen a creature as fair as Deirdre. He gave her the full weight of his heart's love. Then his heroes raised Deirdre onto the highest of their shoulders. They carried her away from the green hill, and her foster-mother went with her, all the way to the court of the King of Ulster.
    - id: ch03
      title: Deirdre Chooses Naois
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Connachar wanted to marry Deirdre at once, whether she wished it or not. Deirdre asked him for time.
        - id: ch03-b02
          speaker: deirdre
          text: Please grant me one year and one day before the marriage.
        - id: ch03-b03
          speaker: connachar
          text: Hard as it is, I will grant that time if you give me your certain promise to marry me when the year ends.
        - id: ch03-b04
          speaker: narrator
          text: Deirdre gave him that promise. During the year that followed, Connachar appointed a woman to teach her. He also chose cheerful and modest young maidens to share her days. They lay down and rose with Deirdre, played beside her, and talked with her. She proved clever at every skill she was taught, both in a maiden's duties and in the knowledge expected of a wife. Whenever Connachar looked at her, he thought he had never seen another living creature who pleased him more.
        - id: ch03-b05
          speaker: narrator
          text: One day, Deirdre and her companions sat on the hill behind the house, enjoying the view and the sun's warmth. Three men came along the road. As they drew near, Deirdre remembered the hunter's words. These must be the sons of Uisnech, she thought, and the tall one must be Naois.
        - id: ch03-b06
          speaker: narrator
          text: The three brothers passed the hillock without taking any notice of the women there. They did not even turn their eyes toward the maidens sitting in the sun. Yet as Naois went by, love for him struck Deirdre's heart so strongly that she could not remain where she was. She gathered her clothing up around her so she could run and hurried after the travelers, leaving all her women attendants behind on the hill.
        - id: ch03-b07
          speaker: narrator
          text: Allen and Arden had already heard about the woman Connachar kept with him at court. They believed that if their brother once saw her, Naois would want her for himself, especially since she had not yet married the king. When they noticed a woman following from the hill, each brother called to the other to quicken his pace. They reminded Naois that they had a long distance still to travel and that the dusk of evening was closing around them. All three began to hurry.
        - id: ch03-b08
          speaker: deirdre
          text: Naois, son of Uisnech, will you leave me behind?
        - id: ch03-b09
          speaker: naois
          text: What cry is that? It is the sweetest sound my ear has heard, yet it has pierced my heart more sharply than any other.
        - id: ch03-b10
          speakers: [allen, arden]
          ensemble: duo
          text: It is nothing but the crying of Connachar's wave-swans.
        - id: ch03-b11
          speaker: naois
          text: No. That is a woman crying in distress. I will not take another step until I know who called.
        - id: ch03-b12
          speaker: narrator
          text: Naois turned back and met Deirdre. She kissed him three times, then gave one kiss to each of his brothers. Confusion sent a fiery blush over her face, and her color shifted like an aspen beside a stream. Naois had never seen anyone so fair. He gave Deirdre a love he had never given to any other person, creature, or vision.
        - id: ch03-b13
          speaker: narrator
          text: Naois lifted Deirdre onto the highest part of his shoulder and told Allen and Arden to keep up their pace. As they traveled, he considered what Connachar would do. The King of Ulster was his own cousin, his uncle's son, yet the king had already set himself against Naois because of Deirdre, though he had not married her. Naois decided it would be dangerous to stay anywhere in Erin. He turned away from his native land, and the four of them fled across the sea to Alba, the country called Scotland.
        - id: ch03-b14
          speaker: narrator
          text: Beside Loch Ness, Naois made them a home. From his own door he could take salmon from the torrent, and from his window he could hunt deer in the grey gorge. Deirdre, Naois, Allen, and Arden lived together in a tower, and as long as they remained there, they were happy.
    - id: ch04
      title: The Invitation from Erin
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At last, the year and a day came to an end, and the time arrived when Deirdre had promised to marry Connachar. The king had learned where she had gone. He decided he would take her away by the sword, whether or not she had married Naois in Alba. To draw the brothers back within his reach, Connachar prepared a great and joyful feast. Messengers carried his word far and wide through Erin, calling all his friends and kinspeople to attend.
        - id: ch04-b02
          speaker: narrator
          text: The king did not believe Naois would accept an invitation from him. So he called for his father's brother, Ferchar Mac Ro, and chose him as his messenger.
        - id: ch04-b03
          speaker: connachar
          text: Tell Naois that I am preparing a splendid feast for my friends and kin throughout Erin. Tell him I will find no rest by day or sleep by night unless he, Allen, and Arden attend it.
        - id: ch04-b04
          speaker: narrator
          text: Ferchar set out on the long journey with his three sons, Daring Drop, Hardy Holly, and Fiallan the Fair. They crossed into Alba and came at last to the tower where Naois lived beside Loch Etive. Naois, Allen, and Arden gave their uncle and his sons a cordial and kindly welcome. Once the travelers had entered and rested, the sons of Uisnech asked what news Ferchar had brought them from Erin.
        - id: ch04-b05
          speaker: ferchar
          text: My best news is that Connachar is holding a great feast for friends and kinsmen across Erin. He has sworn by the earth below, the high heaven above, and the sun that travels west that he will neither rest nor sleep unless his cousins Naois, Allen, and Arden return to their native land and join his feast. He sent us to invite you.
        - id: ch04-b06
          speaker: naois
          text: We will go with you.
        - id: ch04-b07
          speakers: [allen, arden]
          ensemble: duo
          text: Yes, we will go.
        - id: ch04-b08
          speaker: narrator
          text: Deirdre did not want to travel with Ferchar. She pleaded with Naois to stay, and she asked him to explain a vision that had come to her.
        - id: ch04-b09
          speaker: deirdre
          text: Listen, Naois, son of Uisnech, to the dream I saw. Three white doves flew from the south across the sea, carrying drops of honey from the honeybee's hive. Then three grey hawks flew from the south across the sea. The red drops they carried were dearer to me than life.
          emotion: fearful
        - id: ch04-b10
          speaker: naois
          text: It is only the fear in a woman's heart, Deirdre, and nothing more than a nighttime dream. The day Connachar sent his invitation will prove unlucky for us if we refuse to go.
        - id: ch04-b11
          speaker: ferchar
          text: You will go. If Connachar treats you kindly, answer him with kindness. If he meets you with anger, answer with anger. My three sons and I will stand beside you.
        - id: ch04-b12
          speaker: daring_drop
          text: We will stand with you.
        - id: ch04-b13
          speaker: hardy_holly
          text: We will stand with you.
        - id: ch04-b14
          speaker: fiallan
          text: We will stand with you.
        - id: ch04-b15
          speaker: ferchar
          text: My sons are three heroes. Whatever harm or danger comes upon you, they will face it, and I will be there with them.
        - id: ch04-b16
          speaker: narrator
          text: With his weapons before him, Ferchar gave his solemn vow. If any harm or danger crossed the path of the sons of Uisnech, he and his three sons would not abandon them. They would stand against all Erin and leave no living enemy before them. Sword or helmet, spear or shield, blade or coat of mail would make no difference, however fine or strong the weapons might be. On his own word and the honor of his arms, Ferchar promised that Naois and his brothers would have four defenders beside them.
        - id: ch04-b17
          speaker: narrator
          text: Ferchar's promise did not quiet Deirdre's heart. She remained unwilling to leave Alba, for her dream had filled her with suspicion about Connachar's invitation. Still, Naois had chosen to return, and Deirdre would not be parted from him. She left the tower and followed him toward the sea. As the woods and lakes of Alba began to fall behind them, tears poured down her face in showers, and she sang her farewell to the land where they had been happy.
        - id: ch04-b18
          speaker: deirdre
          text: Dear is that land behind us, Alba with its woods and lakes. Leaving you is bitter to my heart, but I must go away with Naois.
          emotion: sad
        - id: ch04-b19
          speaker: narrator
          text: Despite Deirdre's suspicions, Ferchar did not stop until the sons of Uisnech were on their way. They launched the coracle, raised its sail, and on the second morning reached the white shores of Erin.
    - id: ch05
      title: Treachery at the Strangers' House
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As soon as the sons of Uisnech stepped ashore in Erin, Ferchar sent a message ahead to Connachar. The men whom the king had so urgently desired were now in their native land. Ferchar reminded him that they had trusted his invitation, crossed the sea, and come to his feast. It was time, the message said, for Connachar to receive his cousins and show them the kindness he had promised.
        - id: ch05-b02
          speaker: connachar
          text: I did not expect the sons of Uisnech to come, though I invited them. I am not ready to receive them. Send them to my strangers' house for today. My own house will be prepared for them tomorrow.
        - id: ch05-b03
          speaker: narrator
          text: Yet Connachar soon grew impatient for news of Deirdre and those lodging below. He summoned Gelban Grednach, the cheerful and charming son of Lochlin's king.
        - id: ch05-b04
          speaker: connachar
          text: Go down to the strangers' house and find out whether Deirdre still has her former beauty. If she does, I will take her by sword and blade. If she does not, Naois may keep her.
        - id: ch05-b05
          speaker: narrator
          text: Gelban went to the house where Deirdre and the sons of Uisnech were staying. He peered through a small opening in the door. As always, Deirdre blushed crimson when she felt someone looking at her. Naois saw the color rise in her face and knew an eye was watching from behind the door.
        - id: ch05-b06
          speaker: narrator
          text: A set of dice lay on the table. Naois snatched up one die and hurled it through the opening. It struck Gelban's eye and drove through the back of his head. Gelban returned to Connachar's palace.
        - id: ch05-b07
          speaker: connachar
          text: You were cheerful and charming when you left, but you have returned without cheer or charm. What happened? Did you see Deirdre, and is she as beautiful as before?
        - id: ch05-b08
          speaker: gelban
          text: I saw her clearly. While I watched through the hole in the door, Naois knocked out my eye with one of his dice. Yet even after losing that eye, I would have stayed to look at her with the other if you had not ordered me to hurry back.
        - id: ch05-b09
          speaker: connachar
          text: Then send three hundred fighting men to the strangers' house. Bring Deirdre to me and kill everyone else.
          emotion: angry
        - id: ch05-b10
          speaker: narrator
          text: Connachar's order passed through the palace, and three hundred active warriors armed themselves. They marched down toward the strangers' house with commands to seize Deirdre, carry her back to the king, and kill every man who remained beside her. From the house, Deirdre saw the armed company drawing near and knew at once that Connachar's welcome had been a trap.
        - id: ch05-b11
          speaker: deirdre
          text: The king's pursuit is upon us.
          emotion: fearful
        - id: ch05-b12
          speaker: naois
          text: Then I will go out and stop them myself.
        - id: ch05-b13
          speakers: [daring_drop, hardy_holly, fiallan]
          ensemble: chorus
          text: No. We will go. Our father trusted your defense to us when he left for home.
        - id: ch05-b14
          speaker: narrator
          text: Ferchar's three sons armed themselves for the fierce fight. The young men were gallant, strong, and handsome, with beautiful brown hair. Their combat dress shone with polished metal, bright blades, and blazing ornament. Across it ran pictures of beasts, birds, and creeping things. There were lions and lithe-limbed tigers, a brown eagle and a hunting hawk, and the twisting shape of a fierce adder. Daring Drop, Hardy Holly, and Fiallan the Fair went out together to meet Connachar's force. Before the fighting ended, the three young heroes had laid low every part of that company.
        - id: ch05-b15
          speaker: narrator
          text: Connachar rushed from the palace in a fury and shouted across the field of battle.
        - id: ch05-b16
          speaker: connachar
          text: Who is out there slaughtering my men?
          emotion: angry
        - id: ch05-b17
          speakers: [daring_drop, hardy_holly, fiallan]
          ensemble: chorus
          text: We are the three sons of Ferchar Mac Ro.
        - id: ch05-b18
          speaker: connachar
          text: Come over to my side tonight. If you do, I will grant safe passage to your grandfather, your father, and each of you three brothers.
        - id: ch05-b19
          speakers: [daring_drop, hardy_holly, fiallan]
          ensemble: chorus
          text: We refuse your offer, Connachar, and we give you no thanks for it. We would rather go home and tell our father what we did today. Naois, Allen, and Arden are as closely related to you as they are to us, yet you are eager to spill their blood. You would spill ours as well.
        - id: ch05-b20
          speaker: narrator
          text: Ferchar's sons turned their backs on the king's offer and went inside the strangers' house again. They told Naois, Allen, and Arden that the attacking force had been destroyed and the king's men could no longer reach them. Fresh from battle, the three tall young men believed their promise had been fulfilled. They left the house and took the road home to Ferchar, eager to tell their father how they had fought and that the sons of Uisnech were safe.
        - id: ch05-b21
          speakers: [daring_drop, hardy_holly, fiallan]
          ensemble: chorus
          text: You are safe from the king's men now. We are going home to tell our father.
        - id: ch05-b22
          speaker: narrator
          text: Dawn was breaking where day and night meet. Naois said they must leave the strangers' house at once and return to Alba.
    - id: ch06
      title: The Druid's Pursuit
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Naois and Deirdre left the house with Allen and Arden and began the journey back toward Alba. News soon reached the palace that the people Connachar had been hunting were gone. His soldiers had failed, and the fugitives were already beyond the house and moving away from him. Then the king sent for Duanan Gacha Druid, the best magician in his service. Connachar meant to stop the four by magic if armed men could not hold them.
        - id: ch06-b02
          speaker: connachar
          text: I have spent great wealth on your schooling, your learning, and your magical arts. If these people escape today without respecting me, and I cannot catch or stop them, what was all that expense for?
          emotion: angry
        - id: ch06-b03
          speaker: duanan
          text: I will hold them until the men you send can catch up.
        - id: ch06-b04
          speaker: narrator
          text: The druid used his magic and placed a great wood directly across the fugitives' path. It was no common stand of trees. The trunks and branches were so close and wild that no ordinary man could have found a way through. But Naois, Allen, and Arden entered the wood without halting or hesitating. They pressed between the trees and continued toward Alba, while Deirdre held fast to Naois's hand and followed wherever he led.
        - id: ch06-b05
          speaker: connachar
          text: What use was that? They have not slowed or stumbled. They show no heed or respect for me, and I still cannot overtake them or turn them back tonight.
          emotion: angry
        - id: ch06-b06
          speaker: duanan
          text: Then I will try another plan.
        - id: ch06-b07
          speaker: narrator
          text: Duanan changed the ground before the fugitives. A moment earlier, a green plain had stretched ahead of them. Now a broad grey sea rolled across their way. The sons of Uisnech did not turn back. Each of the three heroes stripped off his clothing and tied it securely behind his head to keep it above the water. Naois lifted Deirdre onto the top of his shoulder, and together the brothers stretched themselves into the cold stream.
        - id: ch06-b08
          speaker: narrator
          text: They drove themselves through the current. Sea and land were the same to those heroes, and the rough grey ocean hindered them no more than a smooth green meadow.
        - id: ch06-b09
          speaker: connachar
          text: That spell may be powerful, Duanan, but it will not turn them back. They have gone without honoring me, and I still have no power to pursue them or force them to return tonight.
          emotion: angry
        - id: ch06-b10
          speaker: duanan
          text: Since that did not stop them, we will try another way.
        - id: ch06-b11
          speaker: narrator
          text: Duanan cast his third spell upon the grey, ridged sea. The moving water froze around the travelers and hardened into rough knobs of rock and ice. The surface beneath them was no longer water they could swim through. Each jagged ridge had one edge with the sharpness of a sword, while the other carried the deadly power of an adder's poison. Cut and poisoned by the path beneath them, the three heroes still struggled forward with Deirdre.
        - id: ch06-b12
          speaker: arden
          text: I am growing tired. I can scarcely go any farther.
        - id: ch06-b13
          speaker: naois
          text: Come to me, Arden. Sit on my right shoulder.
        - id: ch06-b14
          speaker: narrator
          text: Arden climbed onto Naois's shoulder. Before long, he died there. Even then, Naois would not let his brother fall.
        - id: ch06-b15
          speaker: allen
          text: My strength is failing. I am almost finished.
        - id: ch06-b16
          speaker: narrator
          text: At Allen's cry, Naois gave a piercing sigh.
        - id: ch06-b17
          speaker: naois
          text: Take hold of me, Allen. I will carry you to land.
          emotion: sad
        - id: ch06-b18
          speaker: narrator
          text: Allen caught hold of Naois and tried to go on, but he did not last long. The weakness of death came over him, and his hands lost their grip. Naois looked from one side to the other across the cruel frozen sea. Arden was dead upon his shoulder, and now Allen, his other beloved brother, was dead beside him. When Naois understood that both brothers were gone, he no longer cared whether he reached the land or died where he stood. He gave one bitter sigh of death, and his heart burst within him.
    - id: ch07
      title: The Two Fir Shoots
      blocks:
        - id: ch07-b01
          speaker: duanan
          text: They are gone, my king. I have done what you asked. The sons of Uisnech are dead and will trouble you no more. Your wife is alive and wholly yours.
        - id: ch07-b02
          speaker: connachar
          text: Blessings on you for that, Duanan. The money I spent on your teaching was no loss. Dry up the flood now, so that I may see Deirdre.
        - id: ch07-b03
          speaker: narrator
          text: Duanan dried the water from the plain. The three sons of Uisnech lay side by side on the green meadow, dead and without breath. Deirdre bent over them, pouring down her tears.
        - id: ch07-b04
          speaker: deirdre
          text: Fair one, beloved one, flower of beauty. You were upright and strong, noble and modest in battle. My blue-eyed love, your clear voice came through the woods of Ireland when we met, and it was lovely to me. I can never eat or smile again. Heart, do not break today. Soon enough I will lie in my grave. The waves of grief are strong, Connachar, but grief itself is stronger.
          emotion: sad
        - id: ch07-b05
          speaker: narrator
          text: People gathered around the heroes and asked Connachar what should be done with their bodies. He ordered a pit to be dug, with all three brothers buried side by side.
        - id: ch07-b06
          speaker: narrator
          text: Deirdre sat at the grave's edge and kept asking the diggers to make the pit wide and roomy. When the brothers had been lowered into it, she spoke once more.
        - id: ch07-b07
          speaker: deirdre
          text: Come nearer, Naois, my love. Let Arden lie close beside Allen. If the dead can feel anything, you would have left a place for Deirdre.
          emotion: sad
        - id: ch07-b08
          speaker: narrator
          text: The men arranged the bodies as she asked. Deirdre jumped into the grave, lay down beside Naois, and died at his side.
        - id: ch07-b09
          speaker: narrator
          text: Connachar ordered Deirdre's body lifted out and buried on the other side of the loch. His command was obeyed, and her grave was closed. Then a fir shoot rose from Deirdre's grave, and another rose from Naois's. Above the loch, the two shoots met and joined in a knot.
        - id: ch07-b10
          speaker: narrator
          text: The king had the shoots cut down. They grew together again, and he had them cut a second time. When they joined for the third time, the woman Connachar had married made him end that evil work and leave the remains of the dead in peace.
