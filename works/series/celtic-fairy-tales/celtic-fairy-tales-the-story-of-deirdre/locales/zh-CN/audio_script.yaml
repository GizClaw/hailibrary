audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    malcolm:
      display_name: 马尔科姆·哈珀
      tts:
        delivery: 正直厚道，说话诚恳稳重
        timbre: 温厚结实
        pace: 从容
        pitch: 中低音
    soothsayer:
      display_name: 预言家
      tts:
        delivery: 神秘克制，预言时庄严冷峻
        timbre: 苍老深沉
        pace: 缓慢
        pitch: 低音
    nurse:
      display_name: 养母
      tts:
        delivery: 谨慎护短，情急时严厉急促
        timbre: 苍老温厚
        pace: 中速
        pitch: 中低音
    deirdre:
      display_name: 迪尔德丽
      tts:
        delivery: 清澈真挚，哀歌时深情而克制
        timbre: 柔美明亮
        pace: 舒缓
        pitch: 中高音
    hunter:
      display_name: 猎人
      tts:
        delivery: 直率健谈，禀报消息时恭敬
        timbre: 粗粝明朗
        pace: 中速
        pitch: 中音
    connachar:
      display_name: 康纳哈尔王
      tts:
        delivery: 威严专横，动怒时冷酷凌厉
        timbre: 浑厚有力
        pace: 稳健
        pitch: 低音
    naois:
      display_name: 诺伊斯
      tts:
        delivery: 英勇坦荡，对亲近之人温柔坚定
        timbre: 清朗坚实
        pace: 中速
        pitch: 中低音
    allen:
      display_name: 艾伦
      tts:
        delivery: 忠诚勇敢，危急时仍然坚毅
        timbre: 明亮结实
        pace: 中速
        pitch: 中音
    arden:
      display_name: 阿登
      tts:
        delivery: 忠诚果敢，话语简短直接
        timbre: 清亮有力
        pace: 中速
        pitch: 中音
    ferchar:
      display_name: 费尔哈尔·麦克罗
      tts:
        delivery: 豪迈庄重，许诺时坚定有力
        timbre: 苍劲浑厚
        pace: 稳健
        pitch: 低音
    daring_drop:
      display_name: 勇猛的德罗普
      tts:
        delivery: 勇猛爽直，答话毫不迟疑
        timbre: 洪亮结实
        pace: 明快
        pitch: 中低音
    hardy_holly:
      display_name: 强悍的霍利
      tts:
        delivery: 强硬果断，临战时沉着无畏
        timbre: 粗犷有力
        pace: 中速
        pitch: 低音
    fiallan:
      display_name: 俊美的菲亚兰
      tts:
        delivery: 年轻英武，语气清晰坚定
        timbre: 清朗明亮
        pace: 中速
        pitch: 中音
    gelban:
      display_name: 格尔班
      tts:
        delivery: 机敏圆滑，受伤后仍带夸张的赞叹
        timbre: 灵活悦耳
        pace: 中速
        pitch: 中音
    druid:
      display_name: 巫师杜安南·加哈
      tts:
        delivery: 阴沉自信，施法时冷静漠然
        timbre: 沙哑低沉
        pace: 缓慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 青丘中的姑娘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，爱尔兰住着一个叫马尔科姆·哈珀的人。他心地正直，家境也很殷实。他娶了妻子，只是两人一直没有儿女。一天，马尔科姆听说有位预言家回到了当地。他待人一向宽厚，很想请那人来家里坐坐。也不知是有人相邀，还是预言家自己登门，他果然来了。
        - id: ch01-b02
          speaker: malcolm
          text: 你现在还替人预言吗？
        - id: ch01-b03
          speaker: soothsayer
          text: 偶尔预言一点。你有什么事情想问？
        - id: ch01-b04
          speaker: malcolm
          text: 要是你愿意指点我，我很乐意听听你的预言。
        - id: ch01-b05
          speaker: soothsayer
          text: 那你想问哪一件事？
        - id: ch01-b06
          speaker: narrator
          text: 我想知道自己的命运。往后会有什么事落到我头上，你若看得见，就请告诉我。
        - id: ch01-b07
          speaker: soothsayer
          text: 我先出去一趟，回来就告诉你。
        - id: ch01-b08
          speaker: narrator
          text: 预言家走出屋子，没过多久又回来了。
        - id: ch01-b09
          speaker: soothsayer
          text: 我在灵视里看见，你将有一个女儿。将来因为她，爱尔兰会流下自天地初开、人类繁衍以来从未流过的那么多鲜血。世间最负盛名的三位英雄，也会因她丢掉性命。
        - id: ch01-b10
          speaker: narrator
          text: 过了一段日子，马尔科姆果然得了一个女儿。他从此不让任何人进家门，只有自己和乳母可以出入。他问乳母，愿不愿意把孩子带到遥远的地方藏起来抚养，让谁的眼睛也看不见她，谁的耳朵也听不到她的消息。乳母答应了。
        - id: ch01-b11
          speaker: narrator
          text: 马尔科姆找来三个男人，瞒着所有人的耳目，把他们带到一座遥远难至的大山。他命人在一座浑圆青翠的小丘中间挖出住处，再仔细遮好洞口，让几个人能一同生活。一切就这样办妥了。
        - id: ch01-b12
          speaker: narrator
          text: 迪尔德丽和养母就住在群山中的小屋里。没人知道，也没人起疑，日子平静地过去，直到她长到十六岁。那时，她已经像一株白净的幼树般亭亭玉立，又像苔地上的灯心草一样修长秀美。整个爱尔兰，从大地到天空之间，再没有比她容貌更美、姿态更动人、性情更温柔的人。不论原本是什么脸色，只要有人望进她的面庞，她立刻便会羞得满脸通红。
        - id: ch01-b13
          speaker: narrator
          text: 养母把自己懂得的知识和本领都教给了她。凡是从根上长出的草叶，林中啼唱的飞鸟，天上闪耀的星辰，没有一样是迪尔德丽叫不出名字的。可有一件事，养母绝不许她同外界任何一个男人来往交谈。
        - id: ch01-b14
          speaker: narrator
          text: 一个阴沉的冬夜，乌云黑压压地罩着天空。有个猎人疲惫地走在山间，跟丢了猎物，又迷失了道路和同伴。困意渐渐袭来。他又饿又乏，冻得遍体僵硬，便倒在迪尔德丽居住的美丽青丘旁，沉沉睡着了。
        - id: ch01-b15
          speaker: narrator
          text: 猎人做了一个纷乱的梦。他梦见自己来到一座温暖的仙堡，里面的仙灵正在奏乐。他在梦中高声呼喊，求堡里若有人在，就看在至圣者的分上放他进去。迪尔德丽听见了那声音。
        - id: ch01-b16
          speaker: deirdre
          text: 养母，那是什么在叫？
        - id: ch01-b17
          speaker: nurse
          text: 什么也不是，不过是空中的鸟迷了路，正在彼此寻找。让它们飞到树林茂密的谷地去吧，这里没有屋子给它们栖身。
        - id: ch01-b18
          speaker: deirdre
          text: 可那只鸟看在万物之神的分上，求我们放它进来。你教过我，凡有人以他的名义相求，我们都应当答应。它冻得僵了，又饿得快死了，你若不肯放它进来，我又怎么相信你教我的话和信仰呢？我相信你，所以我要亲自开门。
        - id: ch01-b19
          speaker: narrator
          text: 迪尔德丽站起身，亲手抽开门板上的门闩，把猎人放进屋。她让这个远道而来的陌生人在该坐的地方坐下，又在该吃的地方摆好食物，在该喝的地方端来饮品。
        - id: ch01-b20
          speaker: nurse
          text: 看在你这条命和身上衣裳的分上，可要管住舌头！这样的冬夜里，你既有屋子容身，又有炉火取暖，闭紧嘴巴总不算难。
        - id: ch01-b21
          speaker: hunter
          text: 我进了你们的屋，又受了款待，自然可以闭紧嘴巴，管住舌头。可是，凭你父亲和祖父的手，也凭你自己的两只手起誓，要是外面的人见到你藏在这里的这位绝色姑娘，他们绝不会让她长久留在你身边。我敢发誓。
        - id: ch01-b22
          speaker: deirdre
          text: 你说的是什么人？
        - id: ch01-b23
          speaker: hunter
          text: 是乌斯内赫之子诺伊斯，还有他的两个弟弟艾伦和阿登。
        - id: ch01-b24
          speaker: deirdre
          text: 要是见到他们，他们是什么模样？
        - id: ch01-b25
          speaker: hunter
          text: 他们的头发黑得像乌鸦羽毛，肌肤白得像浪头上的天鹅，两颊红得像花斑红犊的鲜血。他们奔跑跳跃时，快如急流里的鲑鱼，捷如灰色山坡上的雄鹿。诺伊斯更比爱尔兰所有人都高出一头一肩。
        - id: ch01-b26
          speaker: nurse
          text: 管他们是什么模样，你快走吧，另找一条路！光明与太阳之王啊，我对你，还有放你进来的她，都没有半点可感谢的！
          emotion: angry
    - id: ch02
      title: 诺伊斯与迪尔德丽
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 猎人离开青丘，径直去了康纳哈尔王的宫殿。他托人禀告，说若国王肯赏脸，自己有话要当面讲。国王听到传话，便走出来见他，还问他为什么踏上这趟旅程。
        - id: ch02-b02
          speaker: hunter
          text: 大王，我只有一件事要禀告。我见到了爱尔兰有史以来最美的人，特地来把消息告诉您。
        - id: ch02-b03
          speaker: connachar
          text: 这个美人是谁？她又在哪里？从前谁都没见过，偏偏等到你才看见？
        - id: ch02-b04
          speaker: hunter
          text: 我的确见到了她。不过，除非由我指路，否则谁也找不到她的住处。
        - id: ch02-b05
          speaker: connachar
          text: 那你愿意带我去吗？你指路所得的赏赐，绝不会少于这次报信的酬劳。
        - id: ch02-b06
          speaker: hunter
          text: 我愿意带路，大王。只是住在那里的人恐怕不会情愿。
        - id: ch02-b07
          speaker: narrator
          text: 康纳哈尔召来最亲近的族人，把自己的打算告诉他们。岩洞间的鸟儿早早唱起歌，林中的鸟鸣也早早奏起乐，可国王起得比它们更早。在清新温柔的五月晨光里，他带着一小队亲朋去把迪尔德丽接出青丘。沿途的每一丛灌木、每一朵花、每一根草茎上，都压着沉沉的露珠。队伍里的青年出发时脚步轻盈矫健，走过漫长崎岖的山路，来到小屋前时却已经步子虚浮，疲惫踉跄。
        - id: ch02-b08
          speaker: hunter
          text: 小屋就在那边的谷底。可我不愿再靠近那个老妇人了。
        - id: ch02-b09
          speaker: narrator
          text: 康纳哈尔领着族人走下山谷，来到青丘前敲门。
        - id: ch02-b10
          speaker: nurse
          text: 今晚，除非国王亲自下令、率军前来，否则谁也别想叫我走出屋子。请告诉我，究竟是谁要我开门？
        - id: ch02-b11
          speaker: connachar
          text: 是我，阿尔斯特国王康纳哈尔。
        - id: ch02-b12
          speaker: narrator
          text: 可怜的女人一听门外是谁，急忙起身开门，让国王和随从中所有能挤进来的人都进了屋。康纳哈尔终于见到自己寻找的姑娘。他觉得无论白昼亲眼所见，还是夜间梦中所遇，自己从未见过这样美的人，顿时把满心的爱全给了她。众英雄把迪尔德丽高高托在肩头，连同养母一起带回了阿尔斯特的宫廷。
        - id: ch02-b13
          speaker: narrator
          text: 康纳哈尔想立刻娶她，无论她愿不愿意。迪尔德丽却向他请求一段宽限。
        - id: ch02-b14
          speaker: deirdre
          text: 请您给我一年零一天。
        - id: ch02-b15
          speaker: connachar
          text: 这段日子虽然难熬，我还是答应你。但你必须许诺，一年期满就嫁给我。
        - id: ch02-b16
          speaker: narrator
          text: 迪尔德丽作了承诺。康纳哈尔为她请来一位女师，又安排一群快活端庄的美丽少女与她朝夕相伴，同她游戏说话。她聪颖灵巧，少女应学的事务、为人妻应懂的道理，样样精通。康纳哈尔觉得，自己亲眼见过的人中，再没有谁比她更合心意。
        - id: ch02-b17
          speaker: narrator
          text: 一天，迪尔德丽和女伴们来到屋后的小丘，一面赏景，一面感受太阳的温暖。她们看见三个男人结伴走来。迪尔德丽好奇地望着他们。等三人走近，她想起猎人的话，认出他们正是乌斯内赫的三个儿子。那位比爱尔兰众人高出一头一肩的，便是诺伊斯。三兄弟径直走过，没有理会她们，连小丘上的少女都没瞥一眼。
        - id: ch02-b18
          speaker: narrator
          text: 爱意忽然击中了迪尔德丽的心。她再也按捺不住，束紧衣裙，把侍女留在原地，追向丘下的三个人。艾伦和阿登早听说康纳哈尔身边有一位姑娘，也料定哥哥若见到她，定会把她带走，何况她还没嫁给国王。兄弟俩发现她追来，便彼此催促赶紧加快脚步，说前路还很远，暮色也快降临了。三个人果然越走越快。
        - id: ch02-b19
          speaker: deirdre
          text: 乌斯内赫之子诺伊斯，你要把我丢下吗？
        - id: ch02-b20
          speaker: naois
          text: 这是谁的呼声？我从没听过这样悦耳的声音，也从没听过什么声音这样刺痛我的心！
          emotion: surprised
        - id: ch02-b21
          speakers: [allen, arden]
          ensemble: duo
          text: 那不过是康纳哈尔的浪天鹅在哀鸣，不会是别的。
        - id: ch02-b22
          speaker: naois
          text: 不！那分明是一个女子在悲声呼唤。不弄清她是谁，我绝不再往前走。
        - id: ch02-b23
          speaker: narrator
          text: 诺伊斯发誓，不弄清是谁在呼喊，自己绝不再往前走。他转身回去，两个人终于相见。迪尔德丽吻了诺伊斯三次，又各吻了他的两个弟弟一次。她窘迫万分，脸上腾起火焰般的红晕，颜色忽来忽去，快得像溪边颤动的白杨叶。诺伊斯觉得自己从未见过更美的人，也把一份从未给过任何事物、幻影或生灵的爱，全给了迪尔德丽。
        - id: ch02-b24
          speaker: narrator
          text: 诺伊斯把迪尔德丽高高安在肩头，催两个弟弟加快脚步，大家一路疾行。他知道阿尔斯特国王康纳哈尔是自己的堂兄，也知道国王哪怕还没娶那姑娘，也一定会为此与自己反目。留在爱尔兰绝不是办法，于是他们去了阿尔巴，也就是苏格兰，最后在尼斯湖畔安了家。诺伊斯站在自家门口就能捕到急流里的鲑鱼，从窗口便能猎取灰色山谷里的鹿。诺伊斯、迪尔德丽、艾伦和阿登同住在一座塔楼里，过了很长一段幸福的日子。
    - id: ch03
      title: 不祥的邀请
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 迪尔德丽应当嫁给康纳哈尔的一年零一天终于到了。国王决意用刀剑把她夺回来，不管她是否已经嫁给诺伊斯。他筹办了一场盛大欢庆的宴会，向爱尔兰各地的亲族发出邀请。康纳哈尔知道，即便自己亲自相邀，诺伊斯也不会来。于是他想出一条计策，召来自己的叔父费尔哈尔·麦克罗，派他出使诺伊斯那里。
        - id: ch03-b02
          speaker: connachar
          text: 告诉乌斯内赫之子诺伊斯，我要为爱尔兰各地的亲友举办盛宴。倘若他与艾伦、阿登不来赴宴，我将白昼不得安宁，夜里无法成眠。
        - id: ch03-b03
          speaker: narrator
          text: 费尔哈尔·麦克罗带着三个儿子踏上旅程，来到诺伊斯居住的埃蒂夫湖畔塔楼。乌斯内赫的儿子们亲切热诚地欢迎父子四人，又向费尔哈尔打听爱尔兰的消息。
        - id: ch03-b04
          speaker: ferchar
          text: 我带来了最好的消息。康纳哈尔正为全爱尔兰的亲友举办盛宴。他指着脚下的大地、头顶的高天和西沉的太阳起誓，倘若自己的堂兄弟不肯回到故国家园，踏上出生的土地，参加宴会，他将日夜不得安宁。国王特地派我们来请你们。
        - id: ch03-b05
          speaker: naois
          text: 我们跟你们去。
        - id: ch03-b06
          speakers: [allen, arden]
          ensemble: duo
          text: 我们也去。
        - id: ch03-b07
          speaker: narrator
          text: 迪尔德丽不愿跟费尔哈尔走。她百般恳求，想劝诺伊斯留下，可他没有改变主意。迪尔德丽只好把自己看见的幻象说出来，请诺伊斯替她解释。接着，她唱了起来。
        - id: ch03-b08
          speaker: deirdre
          text: 诺伊斯，我看见了一个幻象，请你替我解一解。乌斯内赫之子诺伊斯，请听，听我梦里显现的情景。三只白鸽从南方飞来，越过茫茫大海，口中衔着蜂巢里的蜜，一滴一滴洒下来。乌斯内赫之子诺伊斯，请听，听我梦里显现的情景。我看见三只灰鹰从南方飞来，越过茫茫大海，口中衔着鲜红鲜红的血滴，那是我比生命更珍爱之物。
          emotion: fearful
        - id: ch03-b09
          speaker: naois
          text: 迪尔德丽，那不过是女人心里的惧怕，不过是夜里的一场梦。康纳哈尔发出邀请的那一天，若我们不去，反而会招来厄运。
        - id: ch03-b10
          speaker: ferchar
          text: 你们尽管去。康纳哈尔若善待你们，你们也善待他。他若对你们发怒，你们就以怒火还他。我和三个儿子都会站在你们这边。
        - id: ch03-b11
          speaker: daring_drop
          text: 我一定相助。
        - id: ch03-b12
          speaker: hardy_holly
          text: 我一定相助。
        - id: ch03-b13
          speaker: fiallan
          text: 我一定相助。
        - id: ch03-b14
          speaker: ferchar
          text: 我的三个儿子都是英雄。无论你们遭遇什么祸患，他们都会同你们并肩，我也和他们一起。
        - id: ch03-b15
          speaker: narrator
          text: 费尔哈尔手按兵器，郑重许下自己的誓言。无论乌斯内赫的儿子们遇上什么祸患和危险，他和三个儿子都绝不会离开。哪怕敌人的刀剑、头盔、长矛、盾牌、利刃和铠甲再精良，他们也要杀得整个爱尔兰再没有一具活人的身体顶着脑袋。
        - id: ch03-b16
          speaker: narrator
          text: 迪尔德丽不愿离开阿尔巴，却还是随诺伊斯走了。她泪如雨下，唱起告别的歌。
        - id: ch03-b17
          speaker: deirdre
          text: 我深爱那片遥远的土地，林木与湖泊遍布阿尔巴。离开你令我满心苦痛，可我要随诺伊斯远去。
          emotion: sad
        - id: ch03-b18
          speaker: narrator
          text: 尽管迪尔德丽满心疑惧，费尔哈尔始终没有停步，终于把乌斯内赫的儿子们带走了。他们将小皮船推入海中，升起船帆。到了第二天早晨，一行人抵达了爱尔兰洁白的海岸。
        - id: ch03-b19
          speaker: narrator
          text: 乌斯内赫的儿子们一踏上爱尔兰的土地，费尔哈尔便传信给康纳哈尔，说国王想要见的人已经到了，现在该由他好好款待这些客人。
        - id: ch03-b20
          speaker: connachar
          text: 我虽然派人去请，却没料到他们真会来，所以还没准备好。那边有一所客舍，今天先让他们住进去，明天宫殿就会收拾妥当。
    - id: ch04
      title: 客舍里的伏击
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 康纳哈尔身在宫中，迟迟听不到客舍那边的消息，不知道那些人情形如何，越等越觉得时间漫长，心里十分焦急。他叫来洛赫林王的儿子格尔班。这个年轻人素来欢乐又迷人，国王要他亲自下去打探。
        - id: ch04-b02
          speaker: connachar
          text: 格尔班，你去看看迪尔德丽从前的美貌是否还在。若是仍在，我就用刀锋剑尖把她夺出来。若是不在，便让诺伊斯自己留着她。
        - id: ch04-b03
          speaker: narrator
          text: 欢乐迷人的格尔班来到客舍。乌斯内赫的儿子们和迪尔德丽都住在那里。他躲在门外，从门板上的杯孔往里窥望。迪尔德丽只要察觉有人注视，脸上便会燃起一片绯红。诺伊斯一看她的脸色，便知道有人藏在门板后面。他抓起桌上的一枚骰子，从杯孔猛掷出去，打瞎了格尔班一只眼睛，骰子一直穿过后脑。格尔班只得回到康纳哈尔的宫殿复命。
        - id: ch04-b04
          speaker: connachar
          text: 你去的时候欢乐又迷人，回来怎么既不欢乐，也不迷人了？你出了什么事？到底见到迪尔德丽没有？她还和从前一样美吗？
        - id: ch04-b05
          speaker: gelban
          text: 我的确见到了她。我正从门上的杯孔看她，诺伊斯就用一枚骰子打瞎了我的眼睛。可说句实话，即便他打掉了我这只眼，要不是您催我回来，我还愿意留在那里，用另一只眼继续看她。
        - id: ch04-b06
          speaker: connachar
          text: 这倒是真话。派三百名勇猛的英雄去客舍，把迪尔德丽带来，其余的人全都杀掉。
        - id: ch04-b07
          speaker: narrator
          text: 康纳哈尔一声令下，三百名矫健勇猛的英雄奉命扑向客舍。他们要把迪尔德丽带走，再杀死屋里的其他人。
        - id: ch04-b08
          speaker: deirdre
          text: 追兵来了。
        - id: ch04-b09
          speaker: naois
          text: 我亲自出去挡住他们。
        - id: ch04-b10
          speakers: [daring_drop, hardy_holly, fiallan]
          ensemble: chorus
          text: 不，该出去的是我们。父亲回家以前，把保护你们免遭危险的责任交给了我们。
        - id: ch04-b11
          speaker: narrator
          text: 三位英勇高贵的青年个个威武俊美，都生着漂亮的褐色头发。他们披上为激战而造的战衣，腰间束好鏖战所用的兵器，昂然走出门去。那战衣磨得光亮耀眼，刀锋般寒光闪闪，上面绘满走兽、飞鸟和爬虫，有雄狮、矫健的猛虎、褐鹰、凶猛的隼，还有毒蛇。年轻的英雄迎战三队来敌，把每一队都打倒了。
        - id: ch04-b12
          speaker: connachar
          text: 谁站在厮杀场上，屠戮我的人？
          emotion: angry
        - id: ch04-b13
          speakers: [daring_drop, hardy_holly, fiallan]
          ensemble: chorus
          text: 是我们，费尔哈尔·麦克罗的三个儿子。
        - id: ch04-b14
          speaker: connachar
          text: 只要你们今晚投到我这一边，我就让你们的祖父自由通行，也让你们的父亲和你们兄弟三人各自自由通行。
        - id: ch04-b15
          speakers: [daring_drop, hardy_holly, fiallan]
          ensemble: chorus
          text: 康纳哈尔，我们不接受，也不会感谢你。我们宁愿回去告诉父亲自己立下的功绩，也绝不要这种条件换来的东西。诺伊斯、艾伦和阿登同你的血缘，和他们同我们的血缘一样亲近。可你一心要流他们的血，也一样会流我们的血。
        - id: ch04-b16
          speaker: narrator
          text: 三位高贵威武的青年说完，便转身回到屋里。他们经历一场大战，仍旧神采奕奕，高大、矫健而英俊。
        - id: ch04-b17
          speakers: [daring_drop, hardy_holly, fiallan]
          ensemble: chorus
          text: 你们已经脱离国王的手，安全了。我们这就回家告诉父亲。
        - id: ch04-b18
          speaker: narrator
          text: 此时正是黑夜与白昼分开的晨曦时分。三个年轻人回去告诉父亲，乌斯内赫的儿子们已经安全。诺伊斯却说，他们必须马上离开这所客舍，返回阿尔巴。于是诺伊斯和迪尔德丽、艾伦和阿登立刻动身。康纳哈尔得到消息，知道自己追捕的一行人已经逃走，便召来手下法力最高的巫师杜安南·加哈。
        - id: ch04-b19
          speaker: connachar
          text: 杜安南，我花了那么多钱，让你受教育、学知识、习得神秘法术。如今这些人毫不在意我，也不尊重我。倘若他们今天就这样逃掉，让我追不上，也拦不住，那些钱岂不是全白花了？
        - id: ch04-b20
          speaker: druid
          text: 我会拦住他们，直到您的追兵赶上。
    - id: ch05
      title: 悲伤的浪涛
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 巫师答应把他们拦住，直到国王派出的追兵赶上。他施展法术，在逃亡者前方变出一片无人能够穿越的森林。可乌斯内赫的儿子们面对密林，既没有停步，也没有半点犹豫。他们径直从树林中穿了过去。迪尔德丽一路紧紧握着诺伊斯的手。
        - id: ch05-b02
          speaker: connachar
          text: 这有什么用？还不够！他们脚步不停，根本不把我放在眼里。今夜我既追不上，也没法把他们赶回来。
          emotion: angry
        - id: ch05-b03
          speaker: druid
          text: 我再换个法子对付他们。
        - id: ch05-b04
          speaker: narrator
          text: 巫师把他们前方的碧绿平原变成了灰色大海。三位英雄脱下衣裳，紧紧捆在脑后，诺伊斯又把迪尔德丽安放在肩头。他们侧身迎向水流，奋力向前。海洋与陆地对他们没有分别，波涛汹涌的灰色大海，也如平坦青翠的草地一般。
        - id: ch05-b05
          speaker: connachar
          text: 这法术虽好，却还是叫不回他们。他们不理会我，也不尊重我，我却无力追赶，更无法迫使他们今夜回来。
        - id: ch05-b06
          speaker: druid
          text: 既然这一招拦不住他们，我们再试一个法子。
        - id: ch05-b07
          speaker: narrator
          text: 巫师再次施法，把灰色起伏的大海冻成坚硬嶙峋的石块。那些石块一边锋利得像刀刃，另一边带着毒蛇的剧毒。英雄们仍在上面艰难前行。阿登忽然喊起来。
        - id: ch05-b08
          speaker: arden
          text: 我已经筋疲力尽，快要支撑不住了！
        - id: ch05-b09
          speaker: naois
          text: 过来，阿登，坐到我的右肩上。
        - id: ch05-b10
          speaker: narrator
          text: 阿登坐上哥哥的肩头。这样过了很久，他死了。可即使弟弟已经死去，诺伊斯仍不肯放下他。接着，艾伦也喊了起来。
        - id: ch05-b11
          speaker: allen
          text: 我越来越虚弱，眼看就要撑不住了！
        - id: ch05-b12
          speaker: narrator
          text: 诺伊斯听见弟弟求救，发出一声直刺人心的绝命叹息。
        - id: ch05-b13
          speaker: naois
          text: 艾伦，抓紧我，我会带你上岸。
        - id: ch05-b14
          speaker: narrator
          text: 没过多久，死亡的虚弱攫住了艾伦，他的手再也抓不住哥哥。诺伊斯回头望去，看见两个深爱的弟弟全都死了，便不再在乎自己是生是死。他发出一声悲苦的绝命叹息，心脏也随之迸裂。
        - id: ch05-b15
          speaker: druid
          text: 他们已经死了。我完成了您的吩咐。乌斯内赫的儿子们再也不会给您添麻烦，您的妻子也安然无恙，完完整整归您一人所有。
        - id: ch05-b16
          speaker: connachar
          text: 愿你因此得福，也愿这件事给我带来好结果，杜安南。供你求学受教的钱没有白费。现在让洪水退去，我要看看迪尔德丽。
        - id: ch05-b17
          speaker: narrator
          text: 巫师依照国王的命令，让洪水从平原上渐渐消退。水下重新露出那片青翠的草地。乌斯内赫的三个儿子肩并肩躺在那里，气息断绝，生命尽失。迪尔德丽俯身在他们上方，泪水一阵阵如雨洒落。她望着诺伊斯，唱起一首哀歌。
        - id: ch05-b18
          speaker: deirdre
          text: 俊美的人，我所爱的人，美丽的花朵。我所爱的人正直而强健，是高贵又谦逊的勇士。俊美的蓝眼睛，是你妻子深爱的人。在幽会的地方，你清亮的声音穿过爱尔兰的树林传来，听在我耳中是那样可爱。从今往后，我再也吃不下，也笑不出了。我的心啊，今天先不要碎裂，我很快就会躺进坟墓。悲伤的浪涛固然强大，可悲伤本身更强大——康纳哈尔。
          emotion: sad
        - id: ch05-b19
          speaker: narrator
          text: 四周的人渐渐聚拢，全都围到三位英雄的遗体旁。他们询问康纳哈尔，该怎样处置这些遗体。国王命众人挖一个坑，把三兄弟肩并肩放进去。迪尔德丽始终坐在墓穴边，反复催掘墓人把坑挖得宽大些，不要挤迫。等三兄弟的遗体都放进坟墓，她又说道。
        - id: ch05-b20
          speaker: deirdre
          text: 到我身边来吧，我的爱人诺伊斯。让阿登紧挨着艾伦躺下。倘若死者仍有一丝知觉，你们一定会给迪尔德丽留出一个地方。
          emotion: sad
        - id: ch05-b21
          speaker: narrator
          text: 人们照她的话，把三兄弟的遗体挪到她指定的位置。迪尔德丽随即跳进墓穴，在诺伊斯身旁躺下，就这样死在了她所爱的人身边。
        - id: ch05-b22
          speaker: narrator
          text: 康纳哈尔命人把迪尔德丽的遗体抬出墓穴，不许她继续躺在诺伊斯身边，又命他们把她埋在湖的另一边。众人照国王的命令做了，把两个墓穴各自封上。后来，迪尔德丽的坟中长出一株冷杉嫩枝，诺伊斯的坟中也长出一株。两根枝条不断生长，越过两座坟墓之间的湖水，终于在湖面上方缠结到了一起。
        - id: ch05-b23
          speaker: narrator
          text: 国王不肯容忍两根枝条相连，命人把它们砍断。可是两根冷杉嫩枝又从各自的坟中长了出来，再次越过湖水，缠到一起。国王又叫人把它们砍倒。这样的事一共发生了两次。到了第三次，国王后来所娶的王后终于劝他住手，不要再继续这件恶事，也不要再向已经死去的人和他们留下的遗骨复仇。
