  chapters:
    - id: ch01
      title: The Battle of the Birds
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: I will tell you a story about the wren. Once, a farmer went looking for a servant, and on the road he met that little bird.
        - id: ch01-b02
          speaker: wren
          text: What are you looking for?
        - id: ch01-b03
          speaker: farmer
          text: I need a servant.
        - id: ch01-b04
          speaker: wren
          text: Then will you hire me?
        - id: ch01-b05
          speaker: farmer
          text: You? Poor little thing, what use could you be to me?
        - id: ch01-b06
          speaker: wren
          text: Give me a chance and see.
        - id: ch01-b07
          speaker: narrator
          text: So the farmer hired him. His first task was threshing grain in the barn. The wren took up a flail and struck away. At his first blow, one grain fell loose. A mouse darted out and ate it.
        - id: ch01-b08
          speaker: wren
          text: Please don't do that again.
        - id: ch01-b09
          speaker: narrator
          text: The wren swung once more and knocked out two grains. The mouse came back and ate both. That settled it. They agreed to find out which of them was stronger. The wren brought twelve birds, and the mouse brought all her tribe.
        - id: ch01-b10
          speaker: wren
          text: I see you've brought your whole tribe.
        - id: ch01-b11
          speaker: mouse
          text: And you've brought yours.
        - id: ch01-b12
          speaker: narrator
          text: The mouse thrust out one leg with great pride. The wren broke it with his flail. After that, they fixed a day for a pitched battle.
        - id: ch01-b13
          speaker: narrator
          text: On the appointed day, every bird and creature began gathering for the fight. The son of the king of Tethertown heard about it and decided to see the battle for himself. He promised his father that he would return with certain news. He would learn which side had won and who would rule as king of the creatures that year.
        - id: ch01-b14
          speaker: narrator
          text: He arrived when nearly everything was over. Only one struggle remained. A great black raven fought a snake. The snake had wound itself around the raven's neck, while the raven gripped the snake's throat in his beak. It looked as though the snake would win.
        - id: ch01-b15
          speaker: narrator
          text: The king's son came to the raven's aid. With one blow, he struck the snake's head off. The raven caught his breath and saw that his enemy was dead.
        - id: ch01-b16
          speaker: raven
          text: You showed me kindness today, so I will show you something in return. Climb onto the roots of my wings.
        - id: ch01-b17
          speaker: narrator
          text: The king's son put his arms around the raven, just in front of the wings. Away they flew, over nine Bens, nine Glens, and nine Mountain Moors.
        - id: ch01-b18
          speaker: raven
          text: Do you see that house? Go there. My sister lives inside, and I promise she will welcome you. If she asks whether you saw the battle of the birds, say yes. If she asks whether you saw anyone like her, say yes to that too. But be back here to meet me tomorrow morning.
        - id: ch01-b19
          speaker: narrator
          text: That night, the king's son was treated well indeed. He had every sort of meat and drink, warm water for his feet, and a soft bed for his tired limbs.
        - id: ch01-b20
          speaker: narrator
          text: The next morning, the raven carried him over six Bens, six Glens, and six Mountain Moors. They spotted a bothy in the distance. It looked far away, but they were soon at its door. Again the king's son was welcomed for the night. There was plenty of meat and drink, warm water waiting for his feet, and a soft bed for his limbs. When morning came, the raven took him onward once more. This time they crossed three Bens, three Glens, and three Mountain Moors.
    - id: ch02
      title: The Raven's Gift
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: On the third morning, the raven was nowhere to be seen. Instead, the handsomest young man the king's son had ever seen came to meet him. Gold rings shone in his hair, and he carried a bundle.
        - id: ch02-b02
          speaker: young_king
          text: Have you seen a great black raven nearby?
        - id: ch02-b03
          speaker: raven
          text: You will never see that raven again, because I was the raven. A wicked druid put me under a spell, and meeting you has set me free. Take this bundle as my gift. Go home by the very same road, and spend a night in each house as you did before. Do not open the bundle until you reach the place where you would most wish to live.
        - id: ch02-b04
          speaker: narrator
          text: The king's son turned his back to the young man and set his face toward his father's home. He followed the very path by which he had come. At each house, the raven's sisters gave him lodging just as kindly as before. At last he drew near his own country and entered a thick wood. As he walked among the trees, the bundle seemed to grow heavier and heavier. Curiosity overcame the warning he had been given, and he decided to see what was inside.
        - id: ch02-b05
          speaker: narrator
          text: The moment he opened it, he stared in astonishment. Before him stood the grandest place he had ever seen. There was a great castle, surrounded by an orchard filled with every kind of fruit and herb.
        - id: ch02-b06
          speaker: narrator
          text: Wonder soon turned to regret. He could not fold the castle back into the bundle. He wished he had waited and set it in the pretty green hollow across from his father's house. Then he looked up and saw a great giant coming toward him.
        - id: ch02-b07
          speaker: giant
          text: This is a bad place to build your house, king's son.
        - id: ch02-b08
          speaker: young_king
          text: It is. I never meant to put it here. It happened by mistake.
        - id: ch02-b09
          speaker: giant
          text: What will you give me if I pack it into the bundle again?
        - id: ch02-b10
          speaker: young_king
          text: What payment do you want?
        - id: ch02-b11
          speaker: giant
          text: Give me your first son when he reaches seven years of age.
        - id: ch02-b12
          speaker: young_king
          text: If I ever have a son, he will be yours.
        - id: ch02-b13
          speaker: narrator
          text: In a twinkling, the giant put the gardens, the orchard, and the castle back into the bundle.
        - id: ch02-b14
          speaker: giant
          text: Now you take your road, and I will take mine. Remember your promise. If you forget it, I will not.
        - id: ch02-b15
          speaker: narrator
          text: The king's son took his own road and left the giant to his. For several days he traveled with the bundle. At last he reached the place where he most wished to live. There he loosened it, and the orchard, gardens, and castle appeared exactly as they had before. He went to the castle door and opened it. Inside stood the handsomest maiden he had ever set eyes upon.
        - id: ch02-b16
          speaker: queen
          text: Come in, king's son. Everything is ready for you, if you will marry me today.
        - id: ch02-b17
          speaker: young_king
          text: I am more than willing.
        - id: ch02-b18
          speaker: narrator
          text: They were married that very day.
    - id: ch03
      title: The Giant Claims the Prince
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Seven years and one day passed. Then the giant came to the castle. Only now did the king remember his promise, a promise he had never told the queen about.
        - id: ch03-b02
          speaker: queen
          text: Leave the giant to me.
        - id: ch03-b03
          speaker: giant
          text: Send out your son. Remember what you promised.
        - id: ch03-b04
          speaker: young_king
          text: You shall have him when his mother has made him ready for the journey.
        - id: ch03-b05
          speaker: narrator
          text: The queen dressed the cook's son as if he were the young prince and placed his hand in the giant's. They had not gone far when the giant gave the boy a rod.
        - id: ch03-b06
          speaker: giant
          text: If your father held that rod, what would he do with it?
        - id: ch03-b07
          speaker: cook_son
          text: He would beat the dogs and cats to keep them away from the king's food.
        - id: ch03-b08
          speaker: giant
          text: You are the cook's son.
        - id: ch03-b09
          speaker: narrator
          text: The giant seized the boy by both small ankles and struck him against a stone beside the road. Then he turned back to the castle, wild with rage and madness. He demanded the king's own son. If they tried to deceive him again, he swore he would overturn the whole castle until the stone that stood highest became the lowest.
        - id: ch03-b10
          speaker: queen
          text: We can try once more. The butler's son is the same age as ours.
        - id: ch03-b11
          speaker: narrator
          text: She dressed the butler's son like the prince and gave him to the giant. Before they had gone far, the giant placed the rod in his hand too.
        - id: ch03-b12
          speaker: giant
          text: Tell me what your father would do with this rod.
        - id: ch03-b13
          speaker: butler_son
          text: He would beat the dogs and cats when they came near the king's bottles and glasses.
        - id: ch03-b14
          speaker: giant
          text: You are the butler's son.
        - id: ch03-b15
          speaker: narrator
          text: The giant killed the butler's son as he had killed the first boy. Then he returned in a fury greater than before. Each step he took made the earth tremble beneath the soles of his feet. When he reached the castle, its walls shook, and everything inside shook with them.
        - id: ch03-b16
          speaker: giant
          text: Send your son out now! If you do not, the highest stone in this castle will be the lowest before another moment passes!
          emotion: angry
        - id: ch03-b17
          speaker: narrator
          text: There was nothing left to do. The king and queen gave their own son to the giant. Once they had gone a short way, the giant showed him the rod.
        - id: ch03-b18
          speaker: giant
          text: What would your father do if he had this rod?
        - id: ch03-b19
          speaker: prince
          text: My father has a finer rod than that one.
        - id: ch03-b20
          speaker: giant
          text: And where is your father when he holds that fine rod?
        - id: ch03-b21
          speaker: prince
          text: He sits in his royal chair.
        - id: ch03-b22
          speaker: narrator
          text: Then the giant knew he had the right child. He took the prince home and raised him as his own son.
    - id: ch04
      title: Auburn Mary and the Three Tasks
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The prince grew up in the giant's house. Then, on a day of days when the giant had gone away, he heard music coming from a room at the very top of the house. It was the sweetest music he had ever heard. He looked into the room and, in a single glance, saw the finest face he had ever seen. The young woman beckoned him nearer and told him that her name was Auburn Mary. For now, though, he must go. She made him promise to return to that same place at dead midnight.
        - id: ch04-b02
          speaker: narrator
          text: The prince kept his promise. At midnight, the giant's daughter was beside him in a twinkling.
        - id: ch04-b03
          speaker: auburn_mary
          text: Tomorrow my father will let you choose between my two sisters for a wife. Refuse them both and ask for me. He wants me to marry the son of the king of the Green City, but I do not want him.
        - id: ch04-b04
          speaker: narrator
          text: The next day, the giant brought out all three daughters.
        - id: ch04-b05
          speaker: giant
          text: Son of the king of Tethertown, your years with me have not been wasted. You may marry either of my two elder daughters, and the day after the wedding you may take her home.
        - id: ch04-b06
          speaker: prince
          text: Give me the pretty youngest one, and I will accept your offer.
        - id: ch04-b07
          speaker: narrator
          text: The giant's anger flared.
        - id: ch04-b08
          speaker: giant
          text: Before you win her, you must complete three tasks for me.
        - id: ch04-b09
          speaker: prince
          text: Tell me what they are.
        - id: ch04-b10
          speaker: narrator
          text: The giant led him to the cattle shed.
        - id: ch04-b11
          speaker: giant
          text: A hundred cattle stand here, and this byre has not been cleaned for seven years. I will be away today. Before night, clean it so well that a golden apple could roll from end to end. If you fail, you will not marry my daughter. I will drink your fresh blood tonight to quench my thirst.
        - id: ch04-b12
          speaker: narrator
          text: The prince began to shovel, but he might as well have tried to empty the great ocean. After midday, sweat ran into his eyes and blinded him. Then Auburn Mary came to him.
        - id: ch04-b13
          speaker: auburn_mary
          text: He is punishing you badly, king's son.
        - id: ch04-b14
          speaker: prince
          text: He certainly is.
        - id: ch04-b15
          speaker: auburn_mary
          text: Come and rest your weariness beside me.
        - id: ch04-b16
          speaker: prince
          text: I will. Death is waiting for me anyway.
        - id: ch04-b17
          speaker: narrator
          text: He sat near her, and he was so tired that he fell asleep. When he woke, Auburn Mary was gone. The byre was spotless. A golden apple could have rolled from end to end without picking up a stain. Then the giant came home.
        - id: ch04-b18
          speaker: giant
          text: Did you clean the byre, king's son?
        - id: ch04-b19
          speaker: prince
          text: I cleaned it.
        - id: ch04-b20
          speaker: giant
          text: Someone cleaned it, that much is true.
        - id: ch04-b21
          speaker: prince
          text: Whoever did it, it was not you.
        - id: ch04-b22
          speaker: giant
          text: Well, well. Since you worked so hard today, you have until this time tomorrow to thatch the byre. Use down from birds whose feathers are all different colors.
        - id: ch04-b23
          speaker: narrator
          text: The prince rose before the sun. He took his bow and arrows onto the moors, but the birds were not easily caught. He chased them until sweat blinded him again. At midday, Auburn Mary appeared.
        - id: ch04-b24
          speaker: auburn_mary
          text: You are wearing yourself out, king's son.
        - id: ch04-b25
          speaker: prince
          text: I am. Only two blackbirds have fallen, and every feather on them is the same color.
        - id: ch04-b26
          speaker: auburn_mary
          text: Come and set down your weariness on this pretty hillock.
        - id: ch04-b27
          speaker: prince
          text: Gladly.
        - id: ch04-b28
          speaker: narrator
          text: He believed she would help him again. He sat beside her and soon fell asleep. When he woke, Auburn Mary was gone. He returned to the house and saw the byre roofed with feathers. The giant came home and inspected it.
        - id: ch04-b29
          speaker: giant
          text: Did you thatch the byre, king's son?
        - id: ch04-b30
          speaker: prince
          text: I did.
        - id: ch04-b31
          speaker: giant
          text: Someone thatched it.
        - id: ch04-b32
          speaker: prince
          text: You did not.
        - id: ch04-b33
          speaker: giant
          text: Yes, yes. Now for your last task. Beside the loch stands a fir tree, with a magpie's nest at the top. There are five eggs in it. Bring them to me for my first meal, and do not crack or break a single one.
        - id: ch04-b34
          speaker: narrator
          text: Early next morning, the prince went down to the loch and found the tree without trouble. There was no other tree like it in the whole wood. Its smooth trunk rose five hundred feet before the first branch, and the magpie's nest waited high above. The prince circled the tree, trying one place and then another. Each time he struggled upward, he slid back down. Then Auburn Mary, who had helped him through every task, came to him again.
        - id: ch04-b35
          speaker: auburn_mary
          text: You are scraping the skin from your hands and feet.
        - id: ch04-b36
          speaker: prince
          text: I am. Every time I climb, I fall again.
        - id: ch04-b37
          speaker: auburn_mary
          text: We cannot stop now. You must kill me. Cut the flesh from my bones and separate every bone. Use them as steps up the tree. They will cling to the glassy trunk as though they grew there. On your way down, step on each bone before you touch it, and it will drop into your hand. Do not miss even one. Lay my flesh in this clean cloth beside the spring. When you reach the ground, put my bones together, cover them with my flesh, and sprinkle spring water over me. I will rise alive before you. Only remember, leave no bone behind.
        - id: ch04-b38
          speaker: prince
          text: After everything you have done for me, how could I kill you?
        - id: ch04-b39
          speaker: auburn_mary
          text: If you refuse, both of us are lost. You must climb the tree, and this is the only way. Please do exactly as I have told you.
        - id: ch04-b40
          speaker: narrator
          text: The prince obeyed, though he could hardly bear to do it. He killed Auburn Mary, laid all her flesh in the clean cloth by the spring, and separated every bone as she had told him. Then he began to climb. One by one, he placed the bones against the glassy trunk. Each held fast beneath his foot. At last he stood on the final bone just below the nest, and he lifted out all five eggs without cracking one.
        - id: ch04-b41
          speaker: narrator
          text: On the way down, he stepped on each bone and gathered it into his hand. But the last one lay so near the ground that he forgot to touch it with his foot.
        - id: ch04-b42
          speaker: narrator
          text: Beside the spring, he arranged Auburn Mary's bones, covered them with her flesh, and sprinkled water over her. She rose alive before him.
        - id: ch04-b43
          speaker: auburn_mary
          text: Did I not warn you to step on every bone? Now I will be lame for life. You left my little finger on the tree, and I have only nine fingers.
          emotion: sad
        - id: ch04-b44
          speaker: auburn_mary
          text: Hurry home with the eggs. You may marry me tonight if you can recognize me. My sisters and I will wear the same clothes, and my father will make us look alike. When he tells you to go to your wife, watch my hands. Mine is missing its little finger.
    - id: ch05
      title: The Wedding and the Flight
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The prince carried the eggs to the giant.
        - id: ch05-b02
          speaker: giant
          text: Yes, yes. Make yourself ready for your marriage.
        - id: ch05-b03
          speaker: narrator
          text: And what a wedding it was. Giants and gentlemen came to the feast, and among them stood the son of the king of the Green City, the husband the giant had wanted for Auburn Mary. The prince and Auburn Mary were married, and then the dancing began. The company stamped and turned with such force that the giant's whole house shook from top to bottom.
        - id: ch05-b04
          speaker: narrator
          text: At last, bedtime came. The three sisters stood together in matching clothes, each made to look like the others.
        - id: ch05-b05
          speaker: giant
          text: It is time to rest, son of the king of Tethertown. Choose your bride from among them and take her with you.
        - id: ch05-b06
          speaker: narrator
          text: Auburn Mary held out the hand with no little finger. The prince saw it and took that hand.
        - id: ch05-b07
          speaker: giant
          text: You chose well this time too. Still, I may find another way to meet you.
        - id: ch05-b08
          speaker: narrator
          text: The prince and Auburn Mary went away to rest.
        - id: ch05-b09
          speaker: auburn_mary
          text: Do not fall asleep, or you will be killed. We must flee at once. If we stay, my father will surely kill you.
          emotion: fearful
        - id: ch05-b10
          speaker: narrator
          text: They slipped outside and mounted the blue-gray filly from the stable.
        - id: ch05-b11
          speaker: auburn_mary
          text: Wait here. I want to play one trick on the old hero.
        - id: ch05-b12
          speaker: narrator
          text: She ran back inside, cut an apple into nine pieces, and placed them around the house. Two went at the head of the bed, two at the foot, two at the kitchen door, two at the great outer door, and one outside the house. Then she and the prince rode away.
        - id: ch05-b13
          speaker: narrator
          text: The giant woke and called toward the bed.
        - id: ch05-b14
          speaker: giant
          text: Are you asleep?
        - id: ch05-b15
          speaker: apple_voice
          text: Not yet.
        - id: ch05-b16
          speaker: narrator
          text: The answer came from the apple at the head of the bed. After a while, he called again.
        - id: ch05-b17
          speaker: giant
          text: Are you asleep now?
        - id: ch05-b18
          speaker: apple_voice
          text: Not yet.
        - id: ch05-b19
          speaker: narrator
          text: This time the apple at the foot of the bed had answered. Later, the giant called once more.
        - id: ch05-b20
          speaker: giant
          text: Are you asleep?
        - id: ch05-b21
          speaker: apple_voice
          text: Not yet.
        - id: ch05-b22
          speaker: narrator
          text: That voice came from the kitchen door. At the next call, the apple by the great door answered him.
        - id: ch05-b23
          speaker: giant
          text: You are getting far away from me now.
        - id: ch05-b24
          speaker: apple_voice
          text: Not yet.
        - id: ch05-b25
          speaker: narrator
          text: The final answer came from outside the house.
        - id: ch05-b26
          speaker: giant
          text: You are fleeing!
        - id: ch05-b27
          speaker: narrator
          text: The giant leaped up and hurried to the bed. It was empty and cold.
        - id: ch05-b28
          speaker: giant
          text: My own daughter has tricked me. I am going after them.
          emotion: angry
        - id: ch05-b29
          speaker: narrator
          text: At daybreak, Auburn Mary felt her father's breath burning against her back.
        - id: ch05-b30
          speaker: auburn_mary
          text: Quickly, put your hand into the gray filly's ear. Throw whatever you find behind us.
        - id: ch05-b31
          speaker: prince
          text: I found a twig from a sloe tree.
        - id: ch05-b32
          speaker: auburn_mary
          text: Throw it behind us.
        - id: ch05-b33
          speaker: narrator
          text: He did, and at once twenty miles of blackthorn wood rose behind them. It was so thick that hardly a weasel could pass through.
        - id: ch05-b34
          speaker: narrator
          text: The giant charged straight into it. The thorns tore at his head and neck.
        - id: ch05-b35
          speaker: giant
          text: My daughter has played another trick on me. If only I had my great axe and wood knife, I would soon cut a road through this.
        - id: ch05-b36
          speaker: narrator
          text: The giant had to turn away from the chase and run all the way home for the great axe and wood knife. He made the journey quickly and came back with the axe ready in his hands. Then he chopped and slashed through the blackthorn. He was a mighty worker behind that great blade, and before long he had opened a road through all twenty miles of tangled wood.
        - id: ch05-b37
          speaker: giant
          text: I will leave the axe and knife here until I come back.
        - id: ch05-b38
          speaker: hoodie
          text: Leave them, leave them! We will steal them, steal them!
        - id: ch05-b39
          speaker: giant
          text: If you mean to steal them, I must take them home.
        - id: ch05-b40
          speaker: narrator
          text: So the giant carried the tools all the way back to his house before beginning the chase again.
        - id: ch05-b41
          speaker: narrator
          text: In the heat of the day, Auburn Mary once more felt her father's breath burning her back.
        - id: ch05-b42
          speaker: auburn_mary
          text: Reach into the filly's ear again, and cast whatever you find behind us.
        - id: ch05-b43
          speaker: narrator
          text: The prince found a splinter of gray stone and threw it. In a twinkling, a wall of great gray rock stood behind them, twenty miles long and twenty miles high.
        - id: ch05-b44
          speaker: narrator
          text: The giant came at full speed, but he could not cross the rock.
        - id: ch05-b45
          speaker: giant
          text: My own daughter's tricks are the hardest things I have ever faced. If I had my lever and mighty mattock, I would soon open a road through this rock too.
        - id: ch05-b46
          speaker: narrator
          text: Once again, the giant had no choice but to abandon the chase and go home. He fetched his lever and his mighty mattock, then hurried back to the wall of stone. He drove the tools into the gray rock and split it apart. He worked so fiercely that it did not take him long to make a road all the way through.
        - id: ch05-b47
          speaker: giant
          text: I will leave these tools here. I am not going home again.
        - id: ch05-b48
          speaker: hoodie
          text: Leave them, leave them! We will steal them, steal them!
        - id: ch05-b49
          speaker: giant
          text: Steal them if you like. I have no time to turn back.
        - id: ch05-b50
          speaker: narrator
          text: Near the end of the night watch, Auburn Mary felt the burning breath behind her for the third time.
        - id: ch05-b51
          speaker: auburn_mary
          text: Look in the filly's ear, king's son, or we are lost.
        - id: ch05-b52
          speaker: narrator
          text: This time, the prince found a bladder filled with water. He threw it behind them, and a fresh-water loch spread out, twenty miles long and twenty miles wide.
        - id: ch05-b53
          speaker: narrator
          text: The giant came racing on. His own speed carried him into the middle of the loch. He sank beneath the water and never rose again.
    - id: ch06
      title: The Forgotten Bride
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The next day, the young couple came within sight of the prince's father's house.
        - id: ch06-b02
          speaker: auburn_mary
          text: My father has drowned, so he can trouble us no more. Before we go on, you must enter your father's house and tell them that you have a bride like me. But do not let any man or creature kiss you. If anything does, you will forget that you ever saw me.
        - id: ch06-b03
          speaker: narrator
          text: The prince left Auburn Mary by the well and went alone to his father's house. Everyone he met welcomed him home and wished him happiness and good fortune. He remembered Auburn Mary's warning and charged both his father and his mother not to kiss him. But there was an old gray hound inside the house. She recognized the boy who had once lived there, leaped up to his mouth, and kissed him. From that instant, he could no longer remember that he had ever seen the giant's daughter.
        - id: ch06-b04
          speaker: narrator
          text: Auburn Mary waited where he had left her, beside a well. He did not return. When night came, she climbed into an oak tree by the water and slept in the fork of its branches.
        - id: ch06-b05
          speaker: narrator
          text: A shoemaker lived in a little house near the well. Around midday on the following day, he grew thirsty and asked his wife to fetch him a drink. She carried a dish to the water. Auburn Mary was still hidden in the oak above, and her face shone as a reflection in the well. The woman looked down and believed the beautiful shadow was her own. Never before had she imagined herself so handsome. She tossed away the dish, broke it on the ground, and marched home without vessel or water.
        - id: ch06-b06
          speaker: shoemaker
          text: Wife, where is the water?
        - id: ch06-b07
          speaker: shoemaker_wife
          text: You clumsy, wretched old man! I have spent far too long carrying your water and wood.
          emotion: angry
        - id: ch06-b08
          speaker: shoemaker
          text: Wife, I think your wits have turned. Daughter, go quickly and bring your father a drink.
        - id: ch06-b09
          speaker: narrator
          text: The daughter went to the well, and the same thing happened. She saw the lovely face in the water and believed it was hers. Until that moment, she had never thought herself so beautiful. She too went home with no water.
        - id: ch06-b10
          speaker: shoemaker
          text: Bring me the drink.
        - id: ch06-b11
          speaker: shoemaker_daughter
          text: You homespun old shoemaker! Do you think someone like me should be your servant?
          emotion: angry
        - id: ch06-b12
          speaker: narrator
          text: The poor shoemaker thought his wife and daughter had both lost their senses. He went to the well himself. When he saw the reflection, he looked up into the tree and found the finest woman he had ever seen.
        - id: ch06-b13
          speaker: shoemaker
          text: Your seat looks unsteady, but your face is fair. Come down. I need your help at my house for a little while.
        - id: ch06-b14
          speaker: narrator
          text: He understood now whose shadow had confused his family. He brought Auburn Mary home.
        - id: ch06-b15
          speaker: shoemaker
          text: My bothy is poor, but whatever we have, you may share it with us.
        - id: ch06-b16
          speaker: narrator
          text: Some time later, the shoemaker finished a set of shoes on the very day the prince was to be married. He prepared to carry the shoes to the castle for the young couple.
        - id: ch06-b17
          speaker: auburn_mary
          text: I would like to see the king's son before he marries.
        - id: ch06-b18
          speaker: shoemaker
          text: Come with me. I know the castle servants well, and you shall see the king's son and all his company.
    - id: ch07
      title: The Golden and Silver Pigeons
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Auburn Mary went with the shoemaker. When the gentlefolk saw the beautiful stranger, they brought her into the wedding room and filled a glass of wine for her.
        - id: ch07-b02
          speaker: narrator
          text: As she raised it to drink, a flame leaped from the glass. Out flew a golden pigeon and a silver pigeon. While they circled the room, three grains of barley fell to the floor. The silver pigeon darted down and ate them all.
        - id: ch07-b03
          speaker: golden_pigeon
          text: If you remembered how I cleaned the byre, you would not eat every grain without sharing with me.
        - id: ch07-b04
          speaker: narrator
          text: Three more grains fell. Again, the silver pigeon sprang down and ate them.
        - id: ch07-b05
          speaker: golden_pigeon
          text: If you remembered how I thatched the byre, you would leave me a share.
        - id: ch07-b06
          speaker: narrator
          text: A third time, three grains dropped onto the floor. The silver pigeon swallowed those as well.
        - id: ch07-b07
          speaker: golden_pigeon
          text: If you remembered how I took the eggs from the magpie's nest, you would share with me. I lost my little finger bringing them down, and it is missing still.
        - id: ch07-b08
          speaker: narrator
          text: The prince remembered. He knew the woman standing before him.
        - id: ch07-b09
          speaker: prince
          text: Friends, when I was younger, I lost the key to a casket. I had a new key made, but then I found the old one again. Tell me, which key should I keep?
        - id: ch07-b10
          speaker: wedding_guest
          text: Keep the old key. It fits the lock better, and it is the one you already know.
        - id: ch07-b11
          speaker: narrator
          text: The prince stood before the wedding guests.
        - id: ch07-b12
          speaker: prince
          text: Thank you for wise advice and an honest answer. Here is my true bride, the giant's daughter who risked her own life to save mine. I will marry her, and no other woman.
        - id: ch07-b13
          speaker: narrator
          text: So the prince married Auburn Mary. Their wedding lasted a long while, and everyone was happy.
        - id: ch07-b14
          speaker: narrator
          text: As for me, all I got was butter on a live coal and porridge in a basket. Then they sent me to fetch water from the stream, and my paper shoes wore away.
