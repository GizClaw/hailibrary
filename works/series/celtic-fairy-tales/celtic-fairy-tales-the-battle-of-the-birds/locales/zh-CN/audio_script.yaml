        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 百鸟大战与神奇包袱
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 先从一只鹪鹩说起。从前有个农夫，正在找长工。鹪鹩碰见他，便上前问话。
        - id: ch01-b02
          speaker: wren
          text: 你在找什么呀？
        - id: ch01-b03
          speaker: farmer
          text: 我想找个长工。
        - id: ch01-b04
          speaker: wren
          text: 那你雇我怎么样？
        - id: ch01-b05
          speaker: farmer
          text: 雇你？你这么个可怜的小东西，能干得了什么？
        - id: ch01-b06
          speaker: wren
          text: 让我试试，你就知道了。
        - id: ch01-b07
          speaker: narrator
          text: 农夫真把它雇下了，第一件差事就是去谷仓打谷。鹪鹩当然用连枷干活。它一下打落一粒谷子，一只母老鼠钻出来吃了。
        - id: ch01-b08
          speaker: wren
          text: 请你别再吃我打下来的谷子。
        - id: ch01-b09
          speaker: narrator
          text: 鹪鹩再打一回，落下两粒，母老鼠又全吃了。双方谁也不服谁，便约定比一比力气。鹪鹩召来十二只鸟，母老鼠也带齐自己的族类。
        - id: ch01-b10
          speaker: wren
          text: 你连全族都叫来了。
        - id: ch01-b11
          speaker: mouse
          text: 你自己不也带了帮手吗？
        - id: ch01-b12
          speaker: narrator
          text: 母老鼠得意地伸出一条腿，仿佛已经胜券在握。鹪鹩却抡起连枷，一下把那条腿打断了。这一下，两边的仇算是结下了。它们定好日子，要召集飞禽走兽，堂堂正正来一场大战。
        - id: ch01-b13
          speaker: narrator
          text: 各种飞禽走兽纷纷赶来参战。泰瑟敦国王的儿子也动身观战。他答应父王，一定把确切消息带回去，告诉他今年谁会成为群兽之王。可王子赶到时，其他争斗都已经结束，只剩最后一场。一只大黑乌鸦正和一条蛇厮杀。蛇紧紧缠住乌鸦的脖子，乌鸦也用长嘴死死钳住蛇喉。眼看蛇就要取胜，王子出手相助，一刀砍掉蛇头，救下了乌鸦。
        - id: ch01-b14
          speaker: raven
          text: 你今天救了我，我要带你去见识一番。来吧，坐到我两只翅膀的根上。
        - id: ch01-b15
          speaker: narrator
          text: 王子搂住乌鸦。它一刻不停，带他飞过九座山、九道谷和九片山野荒原。
        - id: ch01-b16
          speaker: raven
          text: 看见那边的屋子了吗？住在那里的是我姐姐。你去吧，她一定会好好招待你。她若问你去没去百鸟大战，就说去过。她若问你见没见过一个像我的，也说见过。明早一定回到这里找我。
        - id: ch01-b17
          speaker: narrator
          text: 那一夜，王子受到了极好的款待。桌上摆着各样肉食和各样饮品，还有热水让他洗脚，软床让他舒展四肢。第二天，乌鸦又载他飞过六座山、六道谷和六片山野荒原。他们远远望见一间小屋，看着还远，转眼便到了。那里住着乌鸦的另一个姐姐，酒肉、热水和软床一样不少。第三天，他们再飞过三座山、三道谷和三片荒原，又受到同样周到的款待。
        - id: ch01-b18
          speaker: narrator
          text: 到了第三个早晨，等在那里的不再是乌鸦，而是王子生平见过最俊美的少年。他发间戴着金环，手里提着一个包袱。王子便问他，有没有见到那只大黑乌鸦。
        - id: ch01-b19
          speaker: raven_youth
          text: 你再也见不到它了，因为我就是那只乌鸦。恶德鲁伊给我下过魔咒，是遇见你才让我恢复人形。这个包袱送给你做谢礼。你沿原路回去，仍在每间屋里住一夜。记住，到了你最想安家的地方，才能把它打开。
        - id: ch01-b20
          speaker: narrator
          text: 王子辞别少年，原路踏上归途。他面朝父王的家，一路又在乌鸦的姐姐们那里逐一借宿，所受的款待和来时毫无两样。快到家时，他走进一片树木紧密的森林。包袱在手里仿佛越来越沉，他实在好奇，终于忍不住停下来，把结解开了。
        - id: ch01-b21
          speaker: narrator
          text: 眨眼之间，一座无比华美的庄园落在眼前。高大的城堡四周围着果园，各种果实和香草都长在里面。王子站在那里，先是惊得说不出话，接着又后悔不迭，因为凭他的力量，再也无法把这一切装回去了。他原本想等走到父王家对面那片翠绿可爱的小谷地，再打开包袱。如今却全落错了地方。正在这时，他抬头看见一个巨人朝自己走来。
        - id: ch01-b22
          speaker: giant
          text: 王子，你怎么把房子安在这么糟的地方？
        - id: ch01-b23
          speaker: first_prince
          text: 我并不想安在这里，只是一时出了岔子。
        - id: ch01-b24
          speaker: giant
          text: 我若替你照原样装回去，你拿什么来谢我？
        - id: ch01-b25
          speaker: first_prince
          text: 你想要什么？
        - id: ch01-b26
          speaker: giant
          text: 你将来若有第一个儿子，等他七岁，就交给我。
        - id: ch01-b27
          speaker: first_prince
          text: 我若真有儿子，就把他给你。
        - id: ch01-b28
          speaker: narrator
          text: 巨人一眨眼便把城堡、花园和果园全收进包袱。
        - id: ch01-b29
          speaker: giant
          text: 现在你走你的，我走我的。可别忘了答应我的事。你忘了，我也会替你记着。
        - id: ch01-b30
          speaker: narrator
          text: 王子继续赶路。几天后，他终于到了自己最钟爱的地方，这才再次打开包袱。城堡、花园和果园都像先前一样完整地出现了。他走上前，推开城堡的大门，门内还站着一位姑娘。那是他生平见过最美的人。
        - id: ch01-b31
          speaker: queen
          text: 进来吧，王子。一切都为你备好了，只要你今天肯娶我。
        - id: ch01-b32
          speaker: first_prince
          text: 我很愿意。
        - id: ch01-b33
          speaker: narrator
          text: 两人当天就成了婚。
    - id: ch02
      title: 巨人的索取
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天又七年过去，远处忽然出现巨人的身影。他正朝城堡走来。国王看到他，这才猛然记起自己许下的承诺。这么多年，他一直没有把那桩可怕的约定告诉王后。
        - id: ch02-b02
          speaker: queen
          text: 这件事交给我来办。
        - id: ch02-b03
          speaker: giant
          text: 把你儿子交出来。别忘了你答应过我什么。
        - id: ch02-b04
          speaker: first_prince
          text: 等他母亲替他收拾好行装，你就能带走他。
        - id: ch02-b05
          speaker: narrator
          text: 王后先把厨子的儿子装扮成王子，交到巨人手中。没走多远，巨人递给孩子一根棍子。
        - id: ch02-b06
          speaker: giant
          text: 你父亲若有这根棍子，会拿它做什么？
        - id: ch02-b07
          speaker: cook_son
          text: 他会拿来打狗打猫，不许它们靠近国王的饭菜。
        - id: ch02-b08
          speaker: giant
          text: 原来你是厨子的儿子。
        - id: ch02-b09
          speaker: narrator
          text: 巨人一听就识破了。他抓住孩子的两只细脚踝，把他往路旁的石头上摔死。随后，他满怀狂怒地返回城堡，扬言若不立刻交出真正的王子，就让城堡最高的石头落到最底下，把整座城堡彻底掀翻。
        - id: ch02-b10
          speaker: queen
          text: 我们再试一回。管家的儿子和我们的孩子同岁。
        - id: ch02-b11
          speaker: narrator
          text: 王后又把管家的儿子装扮好，交给巨人。巨人照旧用棍子试探他。
        - id: ch02-b12
          speaker: giant
          text: 你父亲拿到它，会做什么？
        - id: ch02-b13
          speaker: butler_son
          text: 狗猫若靠近国王的酒瓶和杯子，他就用棍子打它们。
        - id: ch02-b14
          speaker: giant
          text: 你是管家的儿子。
        - id: ch02-b15
          speaker: narrator
          text: 巨人又听出了孩子的身份，也把他的脑袋摔碎了。他怒不可遏地返回城堡。巨人的脚掌每落下一次，大地就在下面震动，城堡也跟着摇晃，连屋内所有东西都颤个不停。
        - id: ch02-b16
          speaker: giant
          text: 把你们的儿子交出来！否则转眼之间，我就叫这座城堡上下颠倒！
          emotion: angry
        - id: ch02-b17
          speaker: narrator
          text: 国王和王后再也没有办法，只得交出亲生儿子。巨人带他离开，仍用那根棍子发问。
        - id: ch02-b18
          speaker: young_prince
          text: 我父亲有一根比它威风得多的权杖。
        - id: ch02-b19
          speaker: giant
          text: 他拿着那根权杖时，坐在哪里？
        - id: ch02-b20
          speaker: young_prince
          text: 他会坐在自己的王座上。
        - id: ch02-b21
          speaker: narrator
          text: 巨人知道这回没有弄错。他把小王子带回家，当作亲生儿子养大。
        - id: ch02-b22
          speaker: narrator
          text: 后来有一天，巨人出了门。少年忽然听见楼顶一间房中传来音乐，那声音比他一生听过的任何乐声都甜美。他抬眼一望，又看见了自己所见过最美的面容。姑娘向他招手，叫他靠近些，告诉他自己名叫赤褐发玛丽。她让少年这一次先离开，却叮嘱他，到了寂静的午夜，一定要回到同一个地方。
        - id: ch02-b23
          speaker: narrator
          text: 午夜时，少年依约来到原处。玛丽立刻赶到他身边。
        - id: ch02-b24
          speaker: auburn_mary
          text: 明天，父亲会让你在我两个姐姐中选一个做妻子。你要说谁也不选，只要我。父亲想把我嫁给绿城王子，可我不喜欢那个人。
        - id: ch02-b25
          speaker: narrator
          text: 第二天，巨人领出三个女儿。
        - id: ch02-b26
          speaker: giant
          text: 泰瑟敦的王子，你在这里住了这么多年，没有白费光阴。我的两个大女儿任你选一个。婚礼过后第二天，你便能带她回家。
        - id: ch02-b27
          speaker: young_prince
          text: 你若把这个漂亮的小女儿嫁给我，我就答应。
        - id: ch02-b28
          speaker: giant
          text: 想娶她，先替我办成三件事。
          emotion: angry
        - id: ch02-b29
          speaker: young_prince
          text: 你只管说。
    - id: ch03
      title: 三件难事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 巨人把王子领到牛棚。里面关着一百头牛，已经七年无人打扫。
        - id: ch03-b02
          speaker: giant
          text: 今天我要出门。天黑以前，把这里打扫得能让金苹果从这头滚到那头，一点污迹也沾不上。办不到，你不但娶不成我的女儿，今晚我还要喝你的鲜血解渴。
        - id: ch03-b03
          speaker: narrator
          text: 王子马上动手，可棚里的污秽似乎永远也清不完。这差事就像拿小桶去舀干浩瀚大海。过了正午，他仍在苦干，汗水不停流进眼睛，眼前都被遮住了。就在这时，巨人的小女儿玛丽来到他身边。
        - id: ch03-b04
          speaker: auburn_mary
          text: 王子，他把你折磨得够苦。
        - id: ch03-b05
          speaker: young_prince
          text: 是啊。
        - id: ch03-b06
          speaker: auburn_mary
          text: 到我这边来，躺下歇一歇吧。
        - id: ch03-b07
          speaker: young_prince
          text: 好吧，反正等着我的也是死。
        - id: ch03-b08
          speaker: narrator
          text: 王子坐在她身旁，很快累得睡了过去。醒来时，玛丽已经不见，牛棚却干净得让金苹果滚过也不会沾上污点。巨人回来了。
        - id: ch03-b09
          speaker: giant
          text: 牛棚是你打扫的吗？
        - id: ch03-b10
          speaker: young_prince
          text: 已经打扫好了。
        - id: ch03-b11
          speaker: giant
          text: 看得出，确实有人干过。
        - id: ch03-b12
          speaker: young_prince
          text: 反正干活的人不是你。
        - id: ch03-b13
          speaker: giant
          text: 好，好。明天这个时候以前，再用鸟的绒羽盖好牛棚。每只鸟身上的羽毛，还不能有两根同色。
        - id: ch03-b14
          speaker: narrator
          text: 太阳还没升起，王子就背起弓和箭袋，走进荒野猎鸟。可那些鸟哪里肯让人轻易射中。他在旷野中追来追去，一直追到正午，汗水又流进眼里，叫他几乎看不清东西。忙了大半天，他只射下两只乌鸫，偏偏两只还是同一种颜色。正在这时，玛丽又出现了。
        - id: ch03-b15
          speaker: auburn_mary
          text: 你这样跑下去，会把自己累垮的。
        - id: ch03-b16
          speaker: young_prince
          text: 我也知道。可我只打到这两只鸟，颜色还完全一样。
        - id: ch03-b17
          speaker: auburn_mary
          text: 来，在这座小丘上躺下，把疲倦歇掉。
        - id: ch03-b18
          speaker: young_prince
          text: 我正想歇一会儿。
        - id: ch03-b19
          speaker: narrator
          text: 他相信玛丽还会帮忙，便坐下睡着了。等他醒来，玛丽已经离开，牛棚顶却铺满了羽毛。巨人回来，又问是不是他做的。
        - id: ch03-b20
          speaker: young_prince
          text: 是我把屋顶盖好了。
        - id: ch03-b21
          speaker: giant
          text: 确实有人替它盖过。
        - id: ch03-b22
          speaker: young_prince
          text: 做这件事的仍旧不是你。
        - id: ch03-b23
          speaker: giant
          text: 好，好。下面湖边有棵冷杉，顶上有个喜鹊窝。窝里五枚蛋，我要拿来做第一顿饭。每一枚都得完整，不能裂，也不能破。
        - id: ch03-b24
          speaker: narrator
          text: 第二天清早，王子来到湖边。那棵冷杉一点也不难找，因为整片树林中，没有第二棵树能和它相比。从树根到最低的枝条，足有五百英尺高。王子绕着树一圈圈地走，几次试着往上攀，可每次才爬起一点，就会滑回地面。那个总来搭救他的人，又一次赶到了。
        - id: ch03-b25
          speaker: auburn_mary
          text: 你的手脚都快磨破了。
        - id: ch03-b26
          speaker: young_prince
          text: 我才爬上去一点，就会掉下来。
        - id: ch03-b27
          speaker: auburn_mary
          text: 没工夫再耽搁了。你得杀死我，把肉剔下来，用一块干净的布包好，放在树根的泉边。再把我的骨头一根根拆开，当成阶梯。上树时，骨头会牢牢粘住树身。下来时，每根都要踩到，再用手收回来。等你落地，把骨头重新排好，盖上血肉，洒上泉水，我便会复活。千万不能把哪根骨头忘在树上。
        - id: ch03-b28
          speaker: young_prince
          text: 你帮了我这么多，我怎么能杀你？
        - id: ch03-b29
          speaker: auburn_mary
          text: 你若不照办，我们两个都会没命。你必须爬上去，而这是唯一的办法。
        - id: ch03-b30
          speaker: narrator
          text: 王子只好服从。他杀死玛丽，把血肉从骨头上剔下，依她所说包好，又将骨头一一拆开。他向上攀爬时，就把一根骨头贴在树身上，当成一级台阶。那些骨头果然像从树里长出来似的，牢牢粘在那里。最后，他站在最高的一根骨头上，伸手取出五枚鸟蛋。往下走时，他每踩过一根，便伸手一碰，把落下的骨头收好。只有最后一根离地太近，他跨过去时，竟忘了用脚去碰。
        - id: ch03-b31
          speaker: narrator
          text: 王子回到泉水边，把玛丽的骨头照原来的位置一根根排列整齐，再将包好的血肉铺回骨头上。他捧起泉水，仔细洒在上面。水珠才落下，玛丽便重新活了过来，站到他的面前。
        - id: ch03-b32
          speaker: auburn_mary
          text: 我不是说过，每根骨头都得踩到吗？你把我的小指留在树上了。如今我只有九根手指，一辈子都要这样！
          emotion: sad
        - id: ch03-b33
          speaker: auburn_mary
          text: 快把鸟蛋送回去。今晚，我和两个姐姐会穿得一模一样，模样也会变得相同。父亲叫你走到妻子身边时，你就看我们的手。少了一根小指的那个才是我。
        - id: ch03-b34
          speaker: narrator
          text: 王子把五枚蛋交给巨人。
        - id: ch03-b35
          speaker: giant
          text: 好，好。准备婚礼去吧。
    - id: ch04
      title: 婚礼与逃亡
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 婚礼真的开始了，而且那可真是一场婚礼！巨人们和绅士们挤满屋子，连原本要娶玛丽的绿城王子也坐在宾客当中。仪式过后，舞会立刻开始。众人跳得那么厉害，巨人的整座房子从屋顶到地基都震个不停。终于到了上床歇息的时辰，巨人让王子从三个一模一样的姑娘中认出自己的新娘。
        - id: ch04-b02
          speaker: giant
          text: 泰瑟敦的王子，该去休息了。从她们中间挑出你的妻子，带她回房吧。
        - id: ch04-b03
          speaker: narrator
          text: 玛丽伸出缺少小指的手，王子立刻握住她。
        - id: ch04-b04
          speaker: giant
          text: 这回也让你猜中了。可往后，也许我还会换个法子来找你。
        - id: ch04-b05
          speaker: narrator
          text: 两人回到房中，玛丽马上催王子逃走。
        - id: ch04-b06
          speaker: auburn_mary
          text: 不能睡。睡着了，你就活不成。我们得立刻逃走，不然父亲一定会杀你。
          emotion: fearful
        - id: ch04-b07
          speaker: narrator
          text: 他们悄悄溜出屋子，一同骑上马厩里的青灰色小母马。临走前，玛丽忽然叫王子等一等，说要和那个老家伙耍个花招。她跳下马跑回屋里，把一只苹果切成九瓣。床头放两瓣，床尾放两瓣，厨房门口两瓣，大门口两瓣，最后一瓣则放到屋外。做好这一切，她才回来和王子一道飞奔而去。
        - id: ch04-b08
          speaker: narrator
          text: 巨人醒来，朝床上喊话。
        - id: ch04-b09
          speaker: giant
          text: 你们睡了吗？
        - id: ch04-b10
          speaker: apple_head
          text: 还没睡呢。
        - id: ch04-b11
          speaker: narrator
          text: 过了一会儿，他又问一遍。
        - id: ch04-b12
          speaker: apple_foot
          text: 还没睡呢。
        - id: ch04-b13
          speaker: narrator
          text: 再过一阵，他第三次喊起来。
        - id: ch04-b14
          speaker: apple_kitchen
          text: 还没睡呢。
        - id: ch04-b15
          speaker: narrator
          text: 巨人再叫一声，这次是大门口的苹果应答。
        - id: ch04-b16
          speaker: apple_door
          text: 还没睡呢。
        - id: ch04-b17
          speaker: giant
          text: 你们现在离我很远了。
        - id: ch04-b18
          speaker: apple_outside
          text: 还没有呢。
        - id: ch04-b19
          speaker: giant
          text: 你们已经逃了！
          emotion: angry
        - id: ch04-b20
          speaker: narrator
          text: 巨人跳起来冲进卧房，床铺冰冷，里面空空如也。
        - id: ch04-b21
          speaker: giant
          text: 亲生女儿竟拿把戏骗我。我这就去追！
          emotion: angry
        - id: ch04-b22
          speaker: narrator
          text: 天才蒙蒙亮，玛丽便觉得父亲的气息烧到了背上。
        - id: ch04-b23
          speaker: auburn_mary
          text: 快把手伸进小母马耳朵里。摸到什么，就扔到我们身后。
        - id: ch04-b24
          speaker: young_prince
          text: 我摸到一根黑刺李树枝。
        - id: ch04-b25
          speaker: auburn_mary
          text: 快扔出去。
        - id: ch04-b26
          speaker: narrator
          text: 树枝一落地，身后立刻长出二十英里密不透风的黑刺李林，连黄鼠狼也难以钻过。巨人冲进刺丛，头脸和脖子被刮得皮开肉绽。
        - id: ch04-b27
          speaker: giant
          text: 又是我女儿的花招。我要是带着大斧和砍柴刀，很快就能劈开这片林子。
        - id: ch04-b28
          speaker: narrator
          text: 巨人只得转身回家去取大斧和砍柴刀。他来回都跑得飞快，使起那把大斧更是无人能比。树干和荆棘在斧下不断倒伏，没过多久，他真在二十英里的黑刺李林中劈通了一条道路。
        - id: ch04-b29
          speaker: giant
          text: 斧头和刀就放在这里，回来时再拿。
        - id: ch04-b30
          speaker: hoodie
          text: 你敢留下，我们就敢偷。全给你偷走！
        - id: ch04-b31
          speaker: giant
          text: 既然你们会偷，我只好先送回家。
        - id: ch04-b32
          speaker: narrator
          text: 巨人又跑回家放好工具。到了日头最热的时候，玛丽再次感觉父亲的气息烧到背上。她让王子再摸马耳朵。王子摸出一块灰色岩石，扔向身后。霎时间，一片横竖二十英里的巨大灰岩挡住去路。巨人全速追来，也无法越过。
        - id: ch04-b33
          speaker: giant
          text: 我女儿这些花招，真是我一生遇过最难对付的东西。可我要是有撬棍和那把大鹤嘴锄，照样能从岩石里凿出路来。
        - id: ch04-b34
          speaker: narrator
          text: 巨人没有别的办法，只能暂时放弃追赶，回去取撬棍和那把巨大的鹤嘴锄。工具到手后，他劈起石头也像伐树一样厉害。灰岩不断碎裂，没过多久，他果然在那片高大宽阔的岩山中凿出了一条道路。
        - id: ch04-b35
          speaker: giant
          text: 这回我把工具留在这里，再也不回头。
        - id: ch04-b36
          speaker: hoodie
          text: 你敢留下，我们还是敢偷。全给你偷走！
        - id: ch04-b37
          speaker: giant
          text: 想偷就偷，我可没时间回去了。
        - id: ch04-b38
          speaker: narrator
          text: 到了换更时分，玛丽第三次感觉父亲的气息灼烧后背。
        - id: ch04-b39
          speaker: auburn_mary
          text: 王子，快看看马耳朵里还有什么，不然我们就逃不掉了。
        - id: ch04-b40
          speaker: narrator
          text: 这回，王子摸出一只水囊。他往身后一扔，那里便出现一座淡水湖，长二十英里，宽也二十英里。巨人来势太快，一头冲到湖心，沉下去再也没有浮起。
    - id: ch05
      title: 被遗忘的新娘
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天，年轻的伴侣已经望见王子的故乡。
        - id: ch05-b02
          speaker: auburn_mary
          text: 父亲淹死了，不会再追来。可你得先独自回家，告诉家人，你带来了一位像我这样的姑娘。记住，不管是人还是动物，都不能让它亲吻你。一旦挨了吻，你就会把我忘得干干净净。
        - id: ch05-b03
          speaker: narrator
          text: 王子独自进了家门。每个遇见他的人都来欢迎他，向他道喜。他也反复叮嘱父亲母亲，千万不要亲吻自己。可是祸事偏偏还是发生了。屋里有只年老的灰猎犬，一眼便认出了多年不见的小主人。它欢喜地跃起来，正好舔到王子的嘴。就在那一刻，他彻底忘了巨人的女儿，仿佛从来没有见过她。
        - id: ch05-b04
          speaker: narrator
          text: 玛丽仍坐在王子离开她的那口井边等候，可一天过去，他始终没有回来。夜幕初临，她只好爬上井旁的橡树，躺在树杈间过了一夜。附近住着一个鞋匠。第二天快到中午，鞋匠口渴，叫妻子去井边打水。妻子来到水边，低头一看，水里正映着树上姑娘的脸。她误以为那是自己的倒影，又惊又喜，因为她从来没想过自己竟有这么美。她把手里的水盆一扔，盆子摔在地上碎了，自己既没拿器皿，也没带水，径直回到家。
        - id: ch05-b05
          speaker: shoemaker
          text: 老婆，水到哪里去了？
        - id: ch05-b06
          speaker: shoemaker_wife
          text: 你这个没出息的老东西，走路还拖拖拉拉！我给你挑水搬柴，当奴仆已经当得太久了！
          emotion: angry
        - id: ch05-b07
          speaker: shoemaker
          text: 老婆，我看你真是疯了。女儿，你快去给父亲打水。
        - id: ch05-b08
          speaker: narrator
          text: 女儿连忙来到井边。她低头取水，也看见玛丽映在水中的面容，还以为那是自己的脸。她从没想到自己竟会这样可爱，马上把取水的事忘得一干二净，转过身，同样空着手回了家。
        - id: ch05-b09
          speaker: shoemaker
          text: 水呢？快拿来呀。
        - id: ch05-b10
          speaker: shoemaker_daughter
          text: 你这个穿土布衣裳的修鞋老头，难道我就该给你当奴仆吗？
          emotion: angry
        - id: ch05-b11
          speaker: narrator
          text: 可怜的鞋匠听完这两番话，只当妻子和女儿的心智都出了毛病。他只好亲自带着器皿走到井边。低头时，他也看见水中的美丽倒影。可鞋匠没有把它认作自己。他抬头望向橡树，终于发现树杈上坐着一个姑娘，那是他生平见过最美的女子。
        - id: ch05-b12
          speaker: shoemaker
          text: 你坐的地方不大稳当，模样倒真好看。下来吧，我家里正有件事想请你帮一会儿。
        - id: ch05-b13
          speaker: narrator
          text: 鞋匠这才明白，妻子和女儿正是看见这个倒影，才忽然变得疯疯癫癫。他请玛丽从树上下来，把她带回自己家中。他坦白说，自己住的不过是一间穷苦简陋的小屋，可屋里无论有些什么，都愿意分给她一份。
        - id: ch05-b14
          speaker: narrator
          text: 玛丽就这样暂住在鞋匠家。后来有一天，鞋匠做好了一批新鞋，准备送到城堡里去。因为就在这一天，忘掉玛丽的王子要和另一位女子成婚，那些鞋正是给新人们预备的。
        - id: ch05-b15
          speaker: auburn_mary
          text: 我想在王子结婚以前，先见他一面。
        - id: ch05-b16
          speaker: shoemaker
          text: 那就跟我来。我和城堡里的仆人很熟，你能见到王子，也能看见所有宾客。
        - id: ch05-b17
          speaker: narrator
          text: 鞋匠带着玛丽来到城堡。仆人们果然认识他，那些贵人看见他身边有这样一位美丽的女子，便把玛丽请进婚宴厅，还为她斟满一杯酒。她正要举杯饮下，一道火焰忽然从酒中升起。紧接着，一只金鸽和一只银鸽从杯里跳了出来，在众人头顶盘旋飞舞。这时，三粒大麦落到地板上，银鸽马上扑过去，一口气全吃进肚里。
        - id: ch05-b18
          speaker: golden_pigeon
          text: 你若还记得是谁替你打扫牛棚，就不会把麦粒全吃掉，一点也不给我。
        - id: ch05-b19
          speaker: narrator
          text: 又落下三粒大麦，银鸽仍旧抢先吃光。
        - id: ch05-b20
          speaker: golden_pigeon
          text: 你若还记得是谁替你用羽毛盖好牛棚，也不会一粒都不分给我。
        - id: ch05-b21
          speaker: narrator
          text: 第三次落下三粒大麦，银鸽还是独自吃完。
        - id: ch05-b22
          speaker: golden_pigeon
          text: 你若还记得是谁替你取下喜鹊窝里的蛋，就不会这样对我。为了那些蛋，我失去了一根小指，直到现在还缺着。
        - id: ch05-b23
          speaker: narrator
          text: 王子的记忆一下回来了。他终于认出站在面前的人是谁。
    - id: ch06
      title: 旧钥匙
      blocks:
        - id: ch06-b01
          speaker: young_prince
          text: 各位，我年轻些的时候丢过一只匣子的钥匙。我叫人另配了一把，可新钥匙送来以后，旧钥匙又找到了。请大家说说，我该留下哪一把？
        - id: ch06-b02
          speaker: guest
          text: 依我看，应该留下旧钥匙。它更合锁，你也用得更习惯。
        - id: ch06-b03
          speaker: narrator
          text: 王子听完，站起身来。
        - id: ch06-b04
          speaker: young_prince
          text: 谢谢你给了我明智而诚实的回答。这一位才是我的新娘。她是巨人的女儿，曾冒着生命危险救我。我只娶她，不会娶别人。
        - id: ch06-b05
          speaker: narrator
          text: 于是王子娶了赤褐发玛丽。婚宴持续了很久，所有人都欢欢喜喜。可讲故事的我呢，只分到搁在红炭上的黄油，还有装在篮子里的燕麦粥。他们又打发我去溪边取水，等我走回来，脚上的纸鞋早就烂光了。
