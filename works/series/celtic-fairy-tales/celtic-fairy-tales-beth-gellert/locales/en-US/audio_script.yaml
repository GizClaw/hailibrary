audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, legendary, and composed
        timbre: rich and clear
        pace: measured
        pitch: medium
    llewelyn:
      display_name: Prince Llewelyn
      tts:
        delivery: noble, forceful, and deeply feeling
        timbre: resonant and mature
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Missing Hound
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Prince Llewelyn had a favorite greyhound named Gellert, a gift from his father-in-law, King John. At home, Gellert was as gentle as a lamb. On the hunt, he was a lion.
        - id: ch01-b02
          speaker: narrator
          text: One day, Llewelyn stood before his castle and sounded his hunting horn. All his dogs came running except Gellert. The prince blew a louder call and called the hound by name, but Gellert still did not appear.
        - id: ch01-b03
          speaker: narrator
          text: At last, Llewelyn could wait no longer. He rode out without Gellert, the swiftest and boldest of his hounds. There was little sport in the hunt that day.
    - id: ch02
      title: Blood at the Castle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Llewelyn turned back toward his castle in a rage. As he reached the gate, Gellert came bounding out to meet him. Then the prince saw blood dripping from the hound's lips and fangs, and he drew back in shock.
        - id: ch02-b02
          speaker: narrator
          text: Gellert crouched at his master's feet. He seemed frightened or puzzled by the welcome he received.
        - id: ch02-b03
          speaker: narrator
          text: Llewelyn had a little son, only a year old, and Gellert often played with him. A terrible thought seized the prince. He rushed toward the nursery. The closer he came, the more blood and disorder he saw in the rooms.
        - id: ch02-b04
          speaker: narrator
          text: He burst into the nursery. The child's cradle lay overturned and smeared with blood.
    - id: ch03
      title: The Prince's Terrible Mistake
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Terror grew in Llewelyn as he searched everywhere for his little son. The child was nowhere to be found. All around him were signs of a dreadful struggle and a great deal of blood.
        - id: ch03-b02
          speaker: narrator
          text: At last, the prince felt certain that Gellert had killed the child. He shouted at the hound and drew his sword.
        - id: ch03-b03
          speaker: llewelyn
          text: Monster! You have devoured my child!
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: Llewelyn drove the sword into Gellert's side. The greyhound fell with a deep cry, still looking into his master's eyes.
    - id: ch04
      title: The Truth Beneath the Cradle
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: As Gellert gave his dying cry, the sound of a little child answered from beneath the cradle. Llewelyn looked there and found his son unharmed, just waking from sleep.
        - id: ch04-b02
          speaker: narrator
          text: Beside the child lay a great, lean wolf. Its body had been torn to pieces and was covered with blood.
        - id: ch04-b03
          speaker: narrator
          text: Too late, Llewelyn understood what had happened while he was gone. Gellert had stayed behind to guard the child. When the wolf tried to kill Llewelyn's heir, the faithful hound had fought it and slain it.
    - id: ch05
      title: The Grave of Gellert
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Llewelyn's grief could do nothing now. He could not bring his faithful dog back to life.
        - id: ch05-b02
          speaker: narrator
          text: He buried Gellert outside the castle walls, where the grave could be seen by every traveler passing beneath the great mountain of Snowdon. Over it, he raised a mighty cairn of stones.
        - id: ch05-b03
          speaker: narrator
          text: And to this day, that place is called Beth Gellert, the Grave of Gellert.
