audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    llewelyn:
      display_name: 卢埃林亲王
      tts:
        delivery: 威严深沉，盛怒中带着急切
        timbre: 浑厚有力
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 没有应声的猎犬
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 卢埃林亲王有一条最心爱的猎犬，名叫盖勒特，是岳父约翰王送给他的。盖勒特在家像羔羊一样温顺，一到猎场，却勇猛得像头狮子。一天，卢埃林在城堡前吹响号角，准备出猎。别的狗全都应声跑来，只有盖勒特没有出现。亲王把号角吹得更响，又高声叫它的名字，还是等不到它。卢埃林不能再等，只得带着其余的狗出发。少了这条跑得最快、胆子最大的猎犬，那天的狩猎也变得索然无味。
        - id: ch01-b02
          speaker: narrator
          text: 卢埃林带着一肚子怒气回到城堡。才到大门前，盖勒特就朝他飞奔过来。可等狗跑近，他一下子停住了。盖勒特的嘴边和尖牙上都在滴血。亲王惊得后退一步，猎犬便伏在他脚下，似乎既不明白主人为何这样对它，又有些害怕。
    - id: ch02
      title: 染血的摇篮
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 卢埃林有个刚满一岁的儿子，平日里，盖勒特常陪孩子玩。想到这里，一个可怕的念头猛然钻进亲王心里。他转身就往育儿室冲。越往里面跑，沿途的房间越乱，血迹也越多。等他闯进育儿室，只见摇篮已经翻倒，上面尽是血污。
        - id: ch02-b02
          speaker: narrator
          text: 卢埃林吓得四处寻找，却怎么也找不到孩子。眼前只有一场恶斗留下的凌乱痕迹，还有满地鲜血。他终于确信，是盖勒特害死了自己的儿子，于是转身冲猎犬怒吼。
        - id: ch02-b03
          speaker: llewelyn
          text: 你这畜生，竟然吃了我的孩子！
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: 喊声未落，卢埃林已经拔出长剑，刺进盖勒特的肋下。猎犬发出一声沉沉的哀号，倒在地上，双眼却依然望着主人。
    - id: ch03
      title: 盖勒特之墓
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 就在盖勒特发出临死的哀号时，摇篮底下竟传出幼儿的哭声，像是在回应它。卢埃林急忙俯身寻找，终于看见了自己的孩子。孩子毫发无伤，刚从睡梦中醒来。可他身边还躺着一头瘦骨嶙峋的大狼，已经被撕得支离破碎，浑身染满了血。
        - id: ch03-b02
          speaker: narrator
          text: 一切都明白了，却已经太迟。原来卢埃林离开以后，盖勒特一直守在孩子身边。恶狼闯来，要杀死亲王的继承人，是盖勒特扑上去同它搏斗，最后咬死了它。
        - id: ch03-b03
          speaker: narrator
          text: 卢埃林再怎样悲痛，也唤不回忠犬的生命。他把盖勒特葬在城堡的围墙外。那座坟遥对巍峨的斯诺登山，每个路过的人都能看见。亲王又在坟上垒起一座高高的石冢。直到今天，那里仍叫“贝思·盖勒特”，意思就是“盖勒特之墓”。
