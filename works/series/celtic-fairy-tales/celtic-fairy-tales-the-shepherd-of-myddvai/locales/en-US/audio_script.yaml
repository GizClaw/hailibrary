audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, legendary, and composed
        timbre: rich and clear
        pace: measured
        pitch: medium
    shepherd:
      display_name: Shepherd of Myddvai
      tts:
        delivery: earnest, gentle, and grounded
        timbre: warm and clear
        pace: moderate
        pitch: medium-low
    lake_maiden:
      display_name: Lake Maiden
      tts:
        delivery: graceful, mysterious, and assured
        timbre: luminous and smooth
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Maidens of the Lake
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: High in the Black Mountains of Caermarthenshire lies a lake called Lyn y Van Vach. Long ago, the shepherd of Myddvai led his lambs to the water's edge. While they grazed, he lay down nearby.
        - id: ch01-b02
          speaker: narrator
          text: All at once, three maidens rose from the dark water. Bright drops flew from their hair as they glided ashore and walked among his flock. They were more beautiful than any mortal women. The shepherd fell in love with the maiden who came nearest.
        - id: ch01-b03
          speaker: narrator
          text: He offered her some of his bread. She took a taste, then sang to him.
        - id: ch01-b04
          speaker: lake_maiden
          text: Your bread is baked too hard. You will not catch me so easily.
        - id: ch01-b05
          speaker: narrator
          text: Laughing, she ran back into the lake.
        - id: ch01-b06
          speaker: narrator
          text: The next day, the shepherd brought bread that had not been baked so much. He waited for the maidens, and when they came ashore, he offered it to the one he loved. She tasted it and sang again.
        - id: ch01-b07
          speaker: lake_maiden
          text: Your bread is not baked enough. I will not have you.
        - id: ch01-b08
          speaker: narrator
          text: Once more, she vanished beneath the waves.
        - id: ch01-b09
          speaker: narrator
          text: The shepherd tried a third time. Now he gave her bread he had found floating near the shore. This bread pleased her, and she promised to marry him if he could choose her from among her sisters the next day.
        - id: ch01-b10
          speaker: narrator
          text: When the time came, he knew his beloved by the strap of her sandal. The lake-maiden gave him one warning.
        - id: ch01-b11
          speaker: lake_maiden
          text: I will be as good a wife as any earthly maiden, unless you strike me three times without cause.
        - id: ch01-b12
          speaker: narrator
          text: The shepherd could not imagine that ever happening. The maiden called three cows, two oxen, and a bull out of the lake as her marriage portion. Then the shepherd led his bride home.
    - id: ch02
      title: The First Blow
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The years went by happily, and the shepherd and the lake-maiden had three children. Then one day, as they were preparing to attend a christening, she told her husband the walk was a long one. He asked her to fetch the horses.
        - id: ch02-b02
          speaker: lake_maiden
          text: I will, if you bring me the gloves I left inside the house.
        - id: ch02-b03
          speaker: narrator
          text: He went in and brought back her gloves, but she had not gone for the horses. So he gave her shoulder a light tap with the gloves.
        - id: ch02-b04
          speaker: shepherd
          text: Go on now. Go and get them.
        - id: ch02-b05
          speaker: lake_maiden
          text: That is one.
        - id: ch02-b06
          speaker: narrator
          text: The lake-maiden counted that light tap as the first blow given without cause.
    - id: ch03
      title: The Second Blow
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On another day, the couple went to a wedding. Joy and laughter filled the gathering, but suddenly the lake-maiden began to sob and weep.
        - id: ch03-b02
          speaker: narrator
          text: Her husband tapped her on the shoulder and questioned her.
        - id: ch03-b03
          speaker: shepherd
          text: Why are you crying?
        - id: ch03-b04
          speaker: lake_maiden
          text: Because they are beginning a life of trouble. And now trouble hangs over you. That was the second time you struck me without cause. Take care. The third will be the last.
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: From then on, her husband took great care never to strike her again.
    - id: ch04
      title: The Last Blow
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: But one day, they were at a funeral, and the lake-maiden suddenly burst into laughter. Her husband forgot her warning. He touched her shoulder rather roughly and spoke.
        - id: ch04-b02
          speaker: shepherd
          text: Is this a time to laugh?
        - id: ch04-b03
          speaker: lake_maiden
          text: I laugh because those who die leave their troubles behind. But your trouble has come. You have struck the final blow. Our marriage is over, and now I must say farewell.
        - id: ch04-b04
          speaker: narrator
          text: She rose, left the funeral house, and returned to their home. There she looked around at all she had known. Then she called to the cattle she had brought from the lake.
        - id: ch04-b05
          speaker: lake_maiden
          text: Brindle cow, white and speckled. Spotted cow, bold and freckled. Old White Face and gray Geringer. White bull from the king's coast. Gray ox and black calf. All of you, follow me home.
        - id: ch04-b06
          speaker: narrator
          text: The black calf had just been slaughtered and was hanging from a hook. Yet it came down alive and well and followed her. The oxen were still plowing, but they obeyed her too, dragging the plow behind them.
        - id: ch04-b07
          speaker: narrator
          text: The lake-maiden fled toward the lake with all the animals following. Together, they plunged into the dark water.
        - id: ch04-b08
          speaker: narrator
          text: Even now, people say you can see the furrow made by that plow as it was dragged across the mountains to the lake.
    - id: ch05
      title: The Physicians of Myddvai
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The lake-maiden returned only once. When her sons had grown into men, she came to them and gave them the gifts of healing.
        - id: ch05-b02
          speaker: narrator
          text: Through those gifts, her sons became known as the Meddygon Myddvai, the physicians of Myddvai.
