audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    shepherd:
      display_name: 米德瓦伊的牧羊人
      tts:
        delivery: 朴实诚恳，年轻时热切，成家后温和稳重
        timbre: 清朗厚实
        pace: 适中
        pitch: 中低音
    lake_maiden:
      display_name: 湖中少女
      tts:
        delivery: 清澈从容，歌唱时轻盈，警告与告别时庄重坚定
        timbre: 空灵柔和
        pace: 舒缓
        pitch: 中高音
  chapters:
    - id: ch01
      title: 湖中少女
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 卡马森郡的黑山深处，有一座范瓦赫湖。从前，米德瓦伊的牧羊人把羊羔赶到湖边，让它们自己吃草，他便躺下歇息。忽然，幽暗的湖水里升起三个少女。她们抖落发间闪亮的水珠，轻盈地来到岸上，在羊群中走来走去。她们美得不像凡间女子。牧羊人一眼爱上了离他最近的那位，便把随身带的面包递给她。少女接过来尝了一口，唱起歌来。
        - id: ch01-b02
          speaker: lake_maiden
          text: 你的面包烤得太老，想要捉住我可不容易。
        - id: ch01-b03
          speaker: narrator
          text: 她唱完笑着跑回湖里。第二天，牧羊人换了一块烤得没那么透的面包，又守在岸边。三个少女果然再次出现。他照旧献上面包，那位少女尝过以后，又唱道。
        - id: ch01-b04
          speaker: lake_maiden
          text: 你的面包还没有烤熟，我才不要嫁给你。
        - id: ch01-b05
          speaker: narrator
          text: 说完，她又沉入水中。牧羊人不肯放弃，第三次来到湖边。这回，他把在岸边漂浮时捡到的面包送给少女。她很喜欢，终于答应嫁给他，不过有一个条件。第二天，三个姐妹会一同出现，他必须认出自己的心上人。
        - id: ch01-b06
          speaker: narrator
          text: 到了约定的时候，牧羊人仔细看去，凭着凉鞋上的系带认出了她。少女答应做他的妻子，也把另一件事说得明明白白。
        - id: ch01-b07
          speaker: lake_maiden
          text: 只要你不无缘无故打我三次，我就会像世上任何女子一样，好好做你的妻子。
        - id: ch01-b08
          speaker: narrator
          text: 牧羊人觉得，自己绝不会做出这样的事。少女便从湖里唤来三头母牛、两头耕牛和一头种牛，作为她的嫁妆。牧羊人领着新娘和牲畜，一同回家去了。
    - id: ch02
      title: 三次无心之过
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 后来的许多年，他们过得很幸福，还有了三个孩子。一天，夫妻俩要去参加洗礼。妻子嫌路远，走着去不方便，丈夫便让她去牵马。
        - id: ch02-b02
          speaker: lake_maiden
          text: 好，我就去。你先替我拿一下手套吧，我把它落在屋里了。
        - id: ch02-b03
          speaker: narrator
          text: 牧羊人拿着手套回来，见她还站在原地，没有去牵马。他便拿手套轻轻拍了拍她的肩膀，催她快去。
        - id: ch02-b04
          speaker: shepherd
          text: 去吧，快去牵马。
        - id: ch02-b05
          speaker: lake_maiden
          text: 这是第一下。
        - id: ch02-b06
          speaker: narrator
          text: 后来，他们又去参加一场婚礼。四周的人都在欢笑作乐，湖中少女却突然哭了起来，怎么也止不住。丈夫不明白，拍了一下她的肩膀。
        - id: ch02-b07
          speaker: shepherd
          text: 大家都这么高兴，你为什么哭呢？
        - id: ch02-b08
          speaker: lake_maiden
          text: 因为他们正走进烦恼里。你的烦恼也来了，这是你第二次无缘无故打我。你要当心，第三下就是最后一下。
        - id: ch02-b09
          speaker: narrator
          text: 从此，牧羊人处处小心，再也不肯碰她。可是有一天，他们去参加葬礼，湖中少女忽然放声大笑。丈夫一下忘了从前的警告，重重碰了她的肩膀。
        - id: ch02-b10
          speaker: shepherd
          text: 现在怎么能笑呢？
        - id: ch02-b11
          speaker: lake_maiden
          text: 我笑，是因为死去的人已经离开烦恼。可你的烦恼到了。最后一下已经打过，我们的婚姻也结束了。就此别过吧。
        - id: ch02-b12
          speaker: narrator
          text: 她说完便站起身，离开举办葬礼的屋子，回到他们自己的家。
    - id: ch03
      title: 回到湖中
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 湖中少女最后看了一遍这个家，随后呼唤起当年从湖里带来的牲畜。
        - id: ch03-b02
          speaker: lake_maiden
          text: 棕白花牛，白斑点点。花斑母牛，斑纹鲜艳。老白脸，还有灰色格林格。来自国王海岸的白公牛，灰耕牛，黑牛犊，全都跟我回家去。
        - id: ch03-b03
          speaker: narrator
          text: 那头黑牛犊刚被宰杀，还挂在钩子上。听见召唤，它竟活生生地挣脱下来，跟在女主人身后。两头耕牛原本正在田里干活，这时也拖着犁赶来。湖中少女奔向范瓦赫湖，所有牲畜都紧紧跟随。到了岸边，她带着它们一起跃入幽暗的湖水。
        - id: ch03-b04
          speaker: narrator
          text: 那两头耕牛一路拖着犁越过群山，直到今天，人们仍能看见它们留下的那道犁沟。犁沟一直延伸到湖边。
    - id: ch04
      title: 米德瓦伊医师
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 湖中少女后来只回来过一次。那时，她的儿子们已经长大成人。她把治病救人的本领赐给了他们。靠着母亲的这份礼物，兄弟几人从此得名“米德瓦伊医师”。
