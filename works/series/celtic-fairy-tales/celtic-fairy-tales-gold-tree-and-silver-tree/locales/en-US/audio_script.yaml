  chapters:
    - id: ch01
      title: The Trout in the Well
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there was a king whose wife was named Silver-tree. The king had a daughter named Gold-tree. One day, Silver-tree and Gold-tree went down to a glen. There was a well in that glen, and a trout lived in the water.
        - id: ch01-b02
          speaker: silver_tree
          text: Troutie, you bonny little fellow, am I not the most beautiful queen in all the world?
        - id: ch01-b03
          speaker: trout
          text: Oh, indeed you are not.
        - id: ch01-b04
          speaker: silver_tree
          text: Then who is?
        - id: ch01-b05
          speaker: trout
          text: Why, your daughter Gold-tree is.
        - id: ch01-b06
          speaker: narrator
          text: Silver-tree went home blind with rage. She took to her bed and swore that she would never be well again until she had eaten her own daughter's heart and liver.
        - id: ch01-b07
          speaker: narrator
          text: The king came home at nightfall and heard that his wife was very ill. He went to her bedside and asked what was wrong.
        - id: ch01-b08
          speaker: silver_tree
          text: Oh, it is only one thing, and you could cure me if you chose.
        - id: ch01-b09
          speaker: king
          text: There is nothing I would not do for you. Tell me what it is.
        - id: ch01-b10
          speaker: silver_tree
          text: Give me Gold-tree's heart and liver to eat, and I shall be well.
        - id: ch01-b11
          speaker: narrator
          text: Now, around that very time, the son of a great king had come from a country abroad. He wanted Gold-tree for his wife. Her father agreed to the marriage, and Gold-tree went away with the prince.
        - id: ch01-b12
          speaker: narrator
          text: Then the king sent his lads to the hunting hill for a he-goat. He gave the goat's heart and liver to Silver-tree. She ate them and rose from her bed well and healthy.
    - id: ch02
      title: The Poisoned Stab
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: A year passed. Silver-tree returned to the glen and stood beside the well where the trout lived.
        - id: ch02-b02
          speaker: silver_tree
          text: Troutie, you bonny little fellow, am I not the most beautiful queen in all the world?
        - id: ch02-b03
          speaker: trout
          text: Oh, indeed you are not.
        - id: ch02-b04
          speaker: silver_tree
          text: Then who is?
        - id: ch02-b05
          speaker: trout
          text: Why, your daughter Gold-tree is.
        - id: ch02-b06
          speaker: silver_tree
          text: But she has been dead a long while. I ate her heart and liver a year ago.
        - id: ch02-b07
          speaker: trout
          text: Oh, indeed she is not dead. She married a great prince in a country abroad.
        - id: ch02-b08
          speaker: narrator
          text: Silver-tree hurried home and begged the king to prepare the long-ship.
        - id: ch02-b09
          speaker: silver_tree
          text: I am going to visit my dear Gold-tree. It has been so long since I saw her.
        - id: ch02-b10
          speaker: narrator
          text: The long-ship was made ready, and they set out. Silver-tree herself took the helm. She steered so well that it was not long before they reached the country where Gold-tree lived.
        - id: ch02-b11
          speaker: narrator
          text: The prince was away hunting on the hills. Gold-tree recognized her father's long-ship as it came toward shore.
        - id: ch02-b12
          speaker: gold_tree
          text: Oh, my mother is coming! She will kill me!
          emotion: fearful
        - id: ch02-b13
          speakers: [servant_1, servant_2]
          ensemble: duo
          text: She will not kill you. We will lock you in a room where she cannot reach you.
        - id: ch02-b14
          speaker: narrator
          text: So the servants locked Gold-tree safely inside. When Silver-tree came ashore, she called out to her daughter.
        - id: ch02-b15
          speaker: silver_tree
          text: Come and greet your own mother when she has come all this way to see you!
        - id: ch02-b16
          speaker: gold_tree
          text: I cannot come out. I am locked inside this room, and I cannot open the door.
        - id: ch02-b17
          speaker: silver_tree
          text: Then put your little finger through the keyhole, and let your own mother kiss it.
        - id: ch02-b18
          speaker: narrator
          text: Gold-tree put her little finger through the keyhole. Silver-tree drove a poisoned stab into it, and Gold-tree fell dead.
    - id: ch03
      title: Gold-tree Wakes
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the prince returned, he found Gold-tree dead. His sorrow was very great. She was still so beautiful that he could not bring himself to bury her. Instead, he placed her in a room and locked the door so no one could go near her.
        - id: ch03-b02
          speaker: narrator
          text: In time, the prince married again. His second wife had charge of the whole house except for that one locked room. The prince always kept its key himself.
        - id: ch03-b03
          speaker: narrator
          text: Then one day, he forgot to take the key with him. His wife opened the locked door and went inside. There she saw the most beautiful woman she had ever seen.
        - id: ch03-b04
          speaker: narrator
          text: She turned Gold-tree this way and that and tried to wake her. Then she noticed the poisoned stab in Gold-tree's finger. She pulled it out, and Gold-tree rose alive, as beautiful as ever.
        - id: ch03-b05
          speaker: narrator
          text: At nightfall, the prince came home from the hunting hill. He looked terribly downcast. His wife saw his face and spoke to him.
        - id: ch03-b06
          speaker: second_wife
          text: What gift would you give me if I could make you laugh again?
        - id: ch03-b07
          speaker: prince
          text: Oh, nothing could make me laugh, unless Gold-tree came alive again.
          emotion: sad
        - id: ch03-b08
          speaker: second_wife
          text: Well, you will find her alive in the room down there.
        - id: ch03-b09
          speaker: narrator
          text: The prince saw Gold-tree alive and rejoiced. He kissed her again and again and again.
        - id: ch03-b10
          speaker: second_wife
          text: She was your first wife, so you should stay with her. I will go away.
        - id: ch03-b11
          speaker: prince
          text: Oh, indeed you shall not go. I will have both of you.
    - id: ch04
      title: Silver-tree Comes Again
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At the end of another year, Silver-tree went back to the glen. Once more, she stood over the well and called to the trout.
        - id: ch04-b02
          speaker: silver_tree
          text: Troutie, you bonny little fellow, am I not the most beautiful queen in all the world?
        - id: ch04-b03
          speaker: trout
          text: Oh, indeed you are not.
        - id: ch04-b04
          speaker: silver_tree
          text: Then who is?
        - id: ch04-b05
          speaker: trout
          text: Why, your daughter Gold-tree is.
        - id: ch04-b06
          speaker: silver_tree
          text: But she cannot be alive. I put the poisoned stab into her finger a year ago.
        - id: ch04-b07
          speaker: trout
          text: Oh, indeed she is not dead at all.
        - id: ch04-b08
          speaker: narrator
          text: Silver-tree went home and begged the king to prepare the long-ship.
        - id: ch04-b09
          speaker: silver_tree
          text: I am going to visit my dear Gold-tree. It has been so long since I saw her.
        - id: ch04-b10
          speaker: narrator
          text: The ship was made ready, and they sailed away. Again, Silver-tree took the helm herself. She steered so well that they soon arrived in Gold-tree's country.
        - id: ch04-b11
          speaker: narrator
          text: The prince was out hunting on the hills. Gold-tree saw her father's ship approaching and knew it at once.
        - id: ch04-b12
          speaker: gold_tree
          text: Oh, my mother is coming! She will kill me!
          emotion: fearful
        - id: ch04-b13
          speaker: second_wife
          text: No, she will not. We will go down together and meet her.
    - id: ch05
      title: The Precious Drink
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Silver-tree came ashore and called to Gold-tree.
        - id: ch05-b02
          speaker: silver_tree
          text: Come down to me, dear Gold-tree. Your own mother has brought you a precious drink.
        - id: ch05-b03
          speaker: second_wife
          text: In this country, whoever offers a drink must taste it first.
        - id: ch05-b04
          speaker: narrator
          text: Silver-tree raised the drink to her mouth. The second wife struck it, and some of the drink went down Silver-tree's throat. Silver-tree fell dead. There was nothing left to do but carry her body home and bury her.
        - id: ch05-b05
          speaker: narrator
          text: The prince and his two wives lived for a long time after that, pleased and peaceful.
        - id: ch05-b06
          speaker: narrator
          text: And there I left them.
