audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    andrew_coffey:
      display_name: 安德鲁·科菲
      tts:
        delivery: 本分厚道，受惊时慌张却仍不失礼数
        timbre: 温厚朴实
        pace: 中速
        pitch: 中低音
    patrick_rooney:
      display_name: 帕特里克·鲁尼
      tts:
        delivery: 阴森暴躁，威吓时短促逼人
        timbre: 冷硬沙哑
        pace: 稍慢
        pitch: 低音
    carrier_1:
      display_name: 抬箱人甲
      tts:
        delivery: 粗声粗气，发号施令
        timbre: 粗厚低沉
        pace: 中速
        pitch: 低音
    carrier_2:
      display_name: 抬箱人乙
      tts:
        delivery: 吃力而谨慎
        timbre: 干涩结实
        pace: 稍慢
        pitch: 中低音
    carrier_3:
      display_name: 抬箱人丙
      tts:
        delivery: 阴沉寡言
        timbre: 暗哑
        pace: 缓慢
        pitch: 低音
    carrier_4:
      display_name: 抬箱人丁
      tts:
        delivery: 冷淡生硬
        timbre: 浑浊低沉
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 林中小屋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我的祖父安德鲁·科菲，是整个男爵领都知道的老实人。全领地的人都认得他，他也熟悉那里每一寸土地。哪边是山，哪边是谷，哪里有泥沼、牧场、田地和树丛，他全都清清楚楚。可有一天傍晚，他竟在庄园里迷了路。眼前的树和泥坑，他没有一样认得。那匹好马不是撞上树，就是踩进本不该出现的泥坑。到了林间空地，瓢泼大雨又砸下来，三月的冷风直往树林里钻。
        - id: ch01-b02
          speaker: narrator
          text: 远处忽然亮起一点灯火，安德鲁真是高兴极了。他走近一看，那里竟有间小屋，可他怎么也想不出，这屋子是什么时候出现的。他拴好马，推门进去。壁炉里的灌木枝烧得正旺，旁边还有把椅子，端端正正摆着，仿佛在说，来呀，坐到我身上来。屋里一个人也没有。他坐到火边，湿透的身子渐渐暖和起来，精神也好了一些，心里却始终猜不透这一切是怎么回事。
        - id: ch01-b03
          speaker: patrick_rooney
          text: 安德鲁·科菲！安德鲁·科菲！
        - id: ch01-b04
          speaker: narrator
          text: 是谁在叫他？安德鲁里里外外找了一遍，别说人，连四条腿的活物都没有。更怪的是，他的马也不见了。
        - id: ch01-b05
          speaker: patrick_rooney
          text: 安德鲁·科菲！安德鲁·科菲！给我讲个故事。
        - id: ch01-b06
          speaker: narrator
          text: 声音比刚才更响，也离得更近。要人讲故事，这又算什么要求？安德鲁只想在火边安静坐着，把衣服烤干，偏偏还有东西没完没了地缠着他。
        - id: ch01-b07
          speaker: patrick_rooney
          text: 安德鲁·科菲！安德鲁·科菲！快讲故事，不然有你的苦头吃！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 我那可怜的祖父吓得站在原地，只会瞪着眼睛。
        - id: ch01-b09
          speaker: patrick_rooney
          text: 安德鲁·科菲！安德鲁·科菲！我早就说了，不讲故事，你要吃苦头！
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 一个男人猛地从橱柜里跳了出来。安德鲁先前根本没看见那里有橱柜。那人怒气冲天，手里还拿着一根结实的黑刺李木棍，足以敲破人的脑袋。可真正吓人的，是那张脸。安德鲁认出他是帕特里克·鲁尼。许多年前，帕特里克夜里出海打鱼，早已落水淹死了。这件事，谁都知道。
    - id: ch02
      title: 树下的长箱子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 安德鲁哪里还敢多停一刻，转身就逃，一口气冲出屋子。他只管拼命往前跑，根本顾不上看路。最后，他结结实实撞上了一棵大树，这才在树下坐下来喘气。可他刚坐稳，便听见有人说话。
        - id: ch02-b02
          speaker: carrier_1
          text: 这个无赖可真沉。
        - id: ch02-b03
          speaker: carrier_2
          text: 稳住。抬到前面那棵大树底下，我们再歇。
        - id: ch02-b04
          speaker: narrator
          text: 他们说的似乎正是安德鲁身边这棵树。至少，他自己是这样想的。手边恰好有根树枝，他抓住枝条荡起来，翻身爬上树，很快把自己藏得严严实实。能看见别人，又不让别人看见，这样最稳妥。
        - id: ch02-b05
          speaker: narrator
          text: 雨停了，风也静了，夜色却比先前更黑。安德鲁仍看见四个男人抬着一只长箱走来。他们到了树下，放下箱子，掀开盖子，从里面抬出的竟是帕特里克·鲁尼。帕特里克一句话也不说，脸白得像积了多年的雪。
        - id: ch02-b06
          speaker: narrator
          text: 一个人去拾灌木枝，另一个拿出火绒和燧石，很快点起一大堆火。安德鲁躲在树上，连动也不敢动。四个人竖起木桩，又把一根长杆横在火上，架成一副烤肉叉，随后将帕特里克吊到杆上。
        - id: ch02-b07
          speaker: carrier_1
          text: 这样就行了。可我们走了以后，谁来看住他？谁转烤架？又有谁能保证他不被烤焦？
        - id: ch02-b08
          speaker: patrick_rooney
          text: 安德鲁·科菲。
        - id: ch02-b09
          speakers: [carrier_1, carrier_2, carrier_3, carrier_4]
          ensemble: chorus
          text: 安德鲁·科菲！安德鲁·科菲！安德鲁·科菲！安德鲁·科菲！
        - id: ch02-b10
          speaker: andrew_coffey
          text: 多谢几位先生看得起我，可我实在不会干这个。
        - id: ch02-b11
          speaker: patrick_rooney
          text: 安德鲁·科菲，你最好下来。
        - id: ch02-b12
          speaker: narrator
          text: 帕特里克第二次开口，安德鲁便不敢再推辞了。他从树上下来。四个男人转身离开，只剩他和帕特里克留在火边。
    - id: ch03
      title: 火上的帕特里克
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 安德鲁坐下来，小心让火势不大不小，手里还得不停转动烤架。帕特里克一句话也没有，只是一直盯着他。可怜的安德鲁怎么想都想不明白。他看看帕特里克，看看眼前的火，再想起林中那间古怪的小屋，越想越糊涂，到最后脑子里都乱成了一团。
        - id: ch03-b02
          speaker: patrick_rooney
          text: 哎呀，你要把我烤焦了！
          emotion: angry
        - id: ch03-b03
          speaker: andrew_coffey
          text: 真对不住。我能问你一件事吗？
        - id: ch03-b04
          speaker: patrick_rooney
          text: 你若想听一句歪话，那就问吧。先把烤架转起来，不然有你的苦头吃。
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: 可安德鲁满脑子都是同一个问题。远近的人明明都说帕特里克落海淹死了，他怎么会在这里？安德鲁想得出了神，又忘记照看火候。
        - id: ch03-b06
          speaker: patrick_rooney
          text: 安德鲁·科菲！安德鲁·科菲！你又要把我烤焦了！
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: 安德鲁连忙道歉，还发誓绝不会再犯。
        - id: ch03-b08
          speaker: patrick_rooney
          text: 你最好说到做到。
        - id: ch03-b09
          speaker: narrator
          text: 帕特里克斜眼瞟着他，露出一口牙齿怪笑。安德鲁背上顿时窜过一阵寒意。想想看，他待在一片从未见过的密林里，正在烤架上翻转一个人人都说早已淹死的人。谁碰上这种事，能不想个没完？安德鲁越想越出神，又把照看火候的事忘到了脑后。
        - id: ch03-b10
          speaker: patrick_rooney
          text: 安德鲁·科菲！安德鲁·科菲！我非要了你的命不可！
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: 安德鲁低头一看，帕特里克正从烤架上解下自己。他双眼凶光闪动，一口牙齿亮得吓人。
    - id: ch04
      title: 又回到小屋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 安德鲁拔腿冲进漆黑的树林。一路上，每块石头都像存心绊他，每根树枝都往他脸上抽，每丛荆棘都扯破他的皮肤。到了没有树木遮挡的地方，大雨又猛砸下来，三月的冷风也跟着呼啸。
        - id: ch04-b02
          speaker: narrator
          text: 前方终于出现一盏灯。没过多久，安德鲁已经跪在壁炉旁。他浑身湿透，衣衫又脏又乱，脑子里一片恍惚。火中的灌木枝噼啪作响。他渐渐暖和了，衣服也干了些，心里总算安定下来。
        - id: ch04-b03
          speaker: patrick_rooney
          text: 安德鲁·科菲！安德鲁·科菲！
        - id: ch04-b04
          speaker: narrator
          text: 一个人经历了安德鲁这一夜的遭遇，照理已经很难再跳起来了，可他听见呼喊，还是吓得猛然一跳。他回头四处张望，这才发现，自己竟又回到了最初遇见帕特里克的那间小屋。
        - id: ch04-b05
          speaker: patrick_rooney
          text: 安德鲁·科菲，安德鲁·科菲，给我讲个故事。
    - id: ch05
      title: 安德鲁的故事
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 安德鲁受够了害怕。这一回，他鼓足了胆量。
        - id: ch05-b02
          speaker: andrew_coffey
          text: 原来你想听故事？好啊。你若能告诉我，这桩怪事究竟是怎么回事，我还得谢谢你呢。
        - id: ch05-b03
          speaker: narrator
          text: 安德鲁便把那天夜里的遭遇，从头到尾讲了一遍。他讲了很久，大概也早就已经累坏了，后来准是说着说着便睡着了。等他再次睁开眼睛，身下已经没有小屋的地板。他正躺在露天的山坡上，那匹失踪的马就在身边安静地吃草。
