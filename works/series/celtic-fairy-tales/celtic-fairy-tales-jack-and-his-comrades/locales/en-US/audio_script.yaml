  chapters:
    - id: ch01
      title: Jack Sets Out
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a poor widow with one son, Jack. A terribly lean summer came, and they did not know how they would live until the new potatoes were ready. One evening, Jack spoke to his mother.
        - id: ch01-b02
          speaker: jack
          text: Mother, bake my cake and kill my hen. I'll go and seek my fortune. If I find it, never fear. I'll soon come home and share it with you.
        - id: ch01-b03
          speaker: narrator
          text: His mother did as he asked. At daybreak, Jack started on his journey, and she walked with him as far as the yard gate.
        - id: ch01-b04
          speaker: mother
          text: Jack, which would you choose? Half the cake and half the hen with my blessing, or all of them with my curse?
        - id: ch01-b05
          speaker: jack
          text: Oh, Mother, why ask me that? You know I wouldn't take your curse, not even with Damer's whole estate.
        - id: ch01-b06
          speaker: mother
          text: Then take it all, Jack, and take my thousand blessings with it.
        - id: ch01-b07
          speaker: narrator
          text: His mother climbed onto the yard fence. She watched Jack go and kept blessing him for as long as her eyes could still see him.
        - id: ch01-b08
          speaker: narrator
          text: Jack walked on until he was tired. Every farmhouse he tried already had all the help it needed. At last, his road ran beside a bog. There he saw a poor ass sunk to his shoulders, struggling toward a great clump of grass.
        - id: ch01-b09
          speaker: neddy
          text: Ah, Jack, dear heart, help me out before I drown!
          emotion: fearful
        - id: ch01-b10
          speaker: jack
          text: You don't need to ask twice.
        - id: ch01-b11
          speaker: narrator
          text: Jack threw great stones and sods into the mud until the ass found firm ground under his feet and reached the hard road.
        - id: ch01-b12
          speaker: neddy
          text: Thank you, Jack. Someday I'll do as much for you. Where are you bound?
        - id: ch01-b13
          speaker: jack
          text: I'm off to seek my fortune until harvest comes, God bless it.
        - id: ch01-b14
          speaker: neddy
          text: Then let me come with you. Who knows what luck we might find?
        - id: ch01-b15
          speaker: jack
          text: Gladly. It's getting late, so we'd better keep moving.
        - id: ch01-b16
          speaker: narrator
          text: They came through a village where a whole troop of boys was chasing a poor dog with a kettle tied to his tail. The dog ran straight to Jack for protection. Neddy opened his mouth and gave such a mighty roar that the little rogues turned and fled as if the devil himself were at their heels.
        - id: ch01-b17
          speaker: coley
          text: Good for you, Jack! I'm greatly obliged. Where are you and that beast going?
        - id: ch01-b18
          speaker: jack
          text: We're seeking our fortune until harvest comes.
        - id: ch01-b19
          speaker: coley
          text: I'd be proud to join you and be rid of those badly behaved boys. A curse on them!
        - id: ch01-b20
          speaker: jack
          text: Well then, throw your tail over your arm and come along.
        - id: ch01-b21
          speaker: narrator
          text: Once they were outside the town, the three companions sat beneath an old wall. Jack took out his bread and meat and shared it with Coley, while Neddy made his dinner from a clump of thistles. As they ate and talked, a half-starved cat came along the road. The sorrowful yowl he gave would have made your heart ache.
        - id: ch01-b22
          speaker: jack
          text: You look as though you've seen the rooftops of nine houses since breakfast. Here, take this bone. There's still something on it.
        - id: ch01-b23
          speaker: tom
          text: May your child never go hungry! I truly needed that kindness. If I may ask, where are all of you going?
        - id: ch01-b24
          speaker: jack
          text: We're seeking our fortune until harvest comes. You can join us if you like.
        - id: ch01-b25
          speaker: tom
          text: I will, and gladly too. Thank you for asking me.
    - id: ch02
      title: The Black Cock and the Light
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Off they went again. When the tree shadows had grown three times as long as the trees themselves, they heard a great cackling from a field beside the road. A fox leaped over the ditch with a fine black cock in his mouth.
        - id: ch02-b02
          speaker: neddy
          text: Oh, you wicked villain!
          emotion: angry
        - id: ch02-b03
          speaker: jack
          text: After him, Coley!
        - id: ch02-b04
          speaker: narrator
          text: The words were hardly out of Jack's mouth before Coley was racing at full speed after the red fox. The fox dropped his prize like a hot potato and shot away. The poor cock came fluttering back to Jack and his comrades, trembling from head to foot.
        - id: ch02-b05
          speaker: black_cock
          text: Ah, neighbors, what luck sent you my way! I'll remember your kindness if trouble ever finds you. But where in the world are you all going?
        - id: ch02-b06
          speaker: jack
          text: We're seeking our fortune until harvest comes. Join our party if you like. When your legs and wings grow tired, you can ride behind me on Neddy.
        - id: ch02-b07
          speaker: narrator
          text: Their march began again. The sun went down, and still there was no cabin or farmhouse anywhere in sight.
        - id: ch02-b08
          speaker: jack
          text: Well, bad luck now may mean better luck later. It's only a summer night. We'll sleep on the long grass in the wood.
        - id: ch02-b09
          speaker: narrator
          text: No sooner had Jack said it than they made their beds. Jack stretched out on a heap of dry grass, with Neddy lying nearby. Coley and Tom curled up together in Neddy's warm lap, and Black Cock flew into the nearest tree to roost.
        - id: ch02-b10
          speaker: narrator
          text: They were all deep asleep when Black Cock suddenly decided to crow.
        - id: ch02-b11
          speaker: neddy
          text: Bother you, Black Cock! You pulled me away from the finest wisp of hay I ever tasted. What's wrong?
        - id: ch02-b12
          speaker: black_cock
          text: Daybreak is what's wrong. Can't you see that light over there?
        - id: ch02-b13
          speaker: jack
          text: I see it, but that light comes from a candle, not the sun. Since you've woken us, we may as well go over and ask for a bed.
        - id: ch02-b14
          speaker: narrator
          text: They all shook themselves awake and started toward the light. Their way led through long grass, over rocks, and among thorny briars. At last, they came down into a hollow. The light shone through the darkness ahead, and from the same place came singing, laughter, and curses.
        - id: ch02-b15
          speaker: jack
          text: Easy now, boys. Walk on tiptoe until we know what sort of people we're dealing with.
        - id: ch02-b16
          speaker: narrator
          text: They crept up to the window. Inside sat six robbers, armed with pistols, blunderbusses, and cutlasses. They crowded around a table, feasting on roast beef and pork and drinking mulled beer, wine, and whiskey punch.
        - id: ch02-b17
          speaker: robber_1
          text: That was a fine haul from the Lord of Dunlavin! We'd have got very little without that honest porter. Here's to his pretty health!
        - id: ch02-b18
          speakers: [robber_captain, robber_1, robber_2, robber_3]
          ensemble: chorus
          text: To the porter's pretty health!
        - id: ch02-b19
          speaker: narrator
          text: Jack crooked a finger at his comrades.
        - id: ch02-b20
          speaker: jack
          text: Close your ranks, men, and wait for my command.
        - id: ch02-b21
          speaker: narrator
          text: Neddy planted his front hoofs on the windowsill. Coley climbed onto Neddy's head, Tom climbed onto Coley's, and Black Cock perched on top of Tom. Jack gave the signal, and all four animals cried out at once.
        - id: ch02-b22
          speakers: [neddy, coley, tom, black_cock]
          ensemble: chorus
          text: Hee-haw! Bow-wow! Meow-meow! Cock-a-doodle-doo!
        - id: ch02-b23
          speaker: jack
          text: Aim your pistols! Blow them to pieces! Don't leave one of them alive. Ready, fire!
        - id: ch02-b24
          speaker: narrator
          text: At Jack's command, the animals raised another tremendous cry and smashed every pane in the window. The robbers were frightened out of their wits. They blew out the candles, knocked over the table, and tore through the back door as fast as they could run. They never once slowed down until they reached the very heart of the wood.
        - id: ch02-b25
          speaker: narrator
          text: Jack and his party entered the room and closed the shutters. They lit the candles and ate and drank until they wanted no more. Then Jack slept in the bed, Neddy in the stable, Coley on the doormat, Tom by the fire, and Black Cock on the perch.
    - id: ch03
      title: The Robber Captain Returns
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At first, the robbers were glad to be safe in the thick wood. Soon, though, they began to grumble.
        - id: ch03-b02
          speaker: robber_2
          text: This wet grass is nothing like our warm room.
        - id: ch03-b03
          speaker: robber_3
          text: I had to leave a lovely pig's foot behind.
        - id: ch03-b04
          speaker: robber_4
          text: I never got so much as a teaspoon from my last glass.
        - id: ch03-b05
          speaker: robber_1
          text: And we left all the Lord of Dunlavin's gold and silver back there!
        - id: ch03-b06
          speaker: robber_captain
          text: I'll risk going back and see whether I can bring anything away.
        - id: ch03-b07
          speakers: [robber_1, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: That's the boy!
        - id: ch03-b08
          speaker: narrator
          text: Away went the captain. Every light in the house was out, so he had to feel his way toward the fire. The moment he reached it, Tom flew into his face and tore at him with teeth and claws. The captain gave a roar and rushed toward the room door to look for a candle. In the dark, he planted a foot on Coley's tail. Coley answered by sinking his teeth into the man's arms, legs, and thighs.
        - id: ch03-b09
          speaker: robber_captain
          text: A thousand murders! If only I could get out of this cursed house!
          emotion: fearful
        - id: ch03-b10
          speaker: narrator
          text: The captain stumbled on until he reached the street door. There, Black Cock dropped onto him and went to work with beak and claws. By the time the bird was done, what Tom and Coley had done felt no worse than a flea bite.
        - id: ch03-b11
          speaker: robber_captain
          text: Ruin take the lot of you, you heartless vagabonds!
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: Once the captain caught his breath, he staggered about, spinning around and around until he reeled backward into the stable. Neddy received him with a kick to the broadest part of his breeches. The blow sent him flying and laid him out comfortably on the dunghill.
        - id: ch03-b13
          speaker: narrator
          text: When the captain came to himself, he scratched his head and tried to understand what had happened. As soon as his legs could carry him, he crawled away. He dragged one foot after the other until he reached the wood.
        - id: ch03-b14
          speakers: [robber_1, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: Well? Is there any chance of getting our property back?
        - id: ch03-b15
          speaker: robber_captain
          text: A chance? A poor chance, that's what it is! Pull me a bed of dry grass, will you? Every scrap of sticking plaster in Enniscorthy couldn't cover my cuts and bruises. If you only knew what I suffered for you!
        - id: ch03-b16
          speaker: robber_captain
          text: I went to the kitchen fire looking for a glowing sod of turf. An old woman sat there carding flax, and look what she did to my face with her cards! I ran for the room door and fell over a cobbler at his bench. He worked on me with his awls and pincers until I somehow got free.
        - id: ch03-b17
          speaker: robber_captain
          text: Then, as I passed through the door, the devil himself dropped on me. His claws and teeth were as long as sixpenny nails, and those wings of his! At last I reached the stable, only to be greeted by a sledgehammer. It knocked me half a mile. If you doubt me, go and see for yourselves.
        - id: ch03-b18
          speakers: [robber_1, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: Oh, our poor captain, we believe every word. You won't catch us going anywhere near that cursed cabin!
    - id: ch04
      title: The Gold and Silver Go Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Next morning, before the sun had shaken out his coat, Jack and his comrades were already up and moving. They made a hearty breakfast from everything left after the night's feast. Then they all agreed that the gold and silver belonged to the Lord of Dunlavin and must be carried back to him.
        - id: ch04-b02
          speaker: narrator
          text: Jack divided the treasure between the two ends of a sack and laid it across Neddy's back. Then the whole company took to the road. They crossed bogs, climbed hills, and went down through valleys. Now and then, they followed the yellow high road. At last, they came to the hall door of the Lord of Dunlavin.
        - id: ch04-b03
          speaker: narrator
          text: And who should be standing there but the treacherous porter, airing his powdered head, white stockings, and red breeches? He gave the visitors a sour look.
        - id: ch04-b04
          speaker: porter
          text: What do you want here, my fine fellow? There isn't room for that whole crowd.
        - id: ch04-b05
          speaker: jack
          text: We want something you certainly can't give us. Common courtesy.
        - id: ch04-b06
          speaker: porter
          text: Be off, you lazy wanderers! Go before a cat could lick her ear, or I'll set the dogs on you.
          emotion: angry
        - id: ch04-b07
          speaker: black_cock
          text: Perhaps you could tell us who opened the door for the robbers the other night?
        - id: ch04-b08
          speaker: narrator
          text: At once, the porter's red face turned as white as the frill around his neck. He had not known that the Lord of Dunlavin and his pretty daughter were standing at the parlor window. They had heard everything, and now both of them leaned outside.
        - id: ch04-b09
          speaker: lord
          text: Barney, I should very much like to hear your answer to the gentleman with the red comb.
        - id: ch04-b10
          speaker: porter
          text: My lord, don't believe that rascal! I never opened the door to those six robbers.
        - id: ch04-b11
          speaker: lord
          text: And how did you know there were six, you poor innocent?
        - id: ch04-b12
          speaker: jack
          text: Never mind him, sir. All your gold and silver is here in this sack. After our long march from the wood of Athsalach, I hope you won't begrudge us supper and a bed.
        - id: ch04-b13
          speaker: lord
          text: Begrudge you? Indeed not! As long as I can help it, not one of you will ever know a poor day again.
    - id: ch05
      title: A Place for Every Comrade
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Jack and every one of his comrades were welcomed with everything their hearts could wish for. Neddy, Coley, and Black Cock received the finest places in the farmyard, while Tom walked into the kitchen and made it his own.
        - id: ch05-b02
          speaker: narrator
          text: The lord took Jack in hand. He had him dressed from head to foot in broadcloth, with frills as white as snow and fine turnpump shoes. Then he placed a watch in Jack's pocket. When everyone sat down to dinner, the lady of the house looked at Jack.
        - id: ch05-b03
          speaker: lady
          text: Jack carries himself like a gentleman born.
        - id: ch05-b04
          speaker: lord
          text: Then I shall make him my steward.
        - id: ch05-b05
          speaker: narrator
          text: Jack brought his mother to live comfortably near the castle.
        - id: ch05-b06
          speaker: narrator
          text: And they were all as happy as you please.
