audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    jack:
      display_name: 杰克
      tts:
        delivery: 爽朗机敏，心地善良，遇事果断
        timbre: 年轻明亮
        pace: 中速
        pitch: 中音
    mother:
      display_name: 杰克的母亲
      tts:
        delivery: 慈爱朴实，话语里带着郑重的关切
        timbre: 温厚略显苍老
        pace: 舒缓
        pitch: 中低音
    neddy:
      display_name: 内迪
      tts:
        delivery: 忠厚直爽，带一点慢吞吞的乡野幽默
        timbre: 粗厚低沉
        pace: 稍慢
        pitch: 低音
    coley:
      display_name: 科利
      tts:
        delivery: 热情仗义，说话干脆利落
        timbre: 结实清亮
        pace: 中快
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 机灵有礼，饥饿时仍带着讨喜的诙谐
        timbre: 轻柔略沙哑
        pace: 中速
        pitch: 中高音
    black_cock:
      display_name: 黑公鸡
      tts:
        delivery: 神气十足，热心而善于一针见血
        timbre: 清脆响亮
        pace: 中快
        pitch: 高音
    robber_1:
      display_name: 强盗甲
      tts:
        delivery: 粗野贪婪，嘴里总像塞着食物
        timbre: 粗哑
        pace: 中速
        pitch: 中低音
    robber_2:
      display_name: 强盗乙
      tts:
        delivery: 爱抱怨，语气急躁
        timbre: 干涩
        pace: 中快
        pitch: 中音
    robber_3:
      display_name: 强盗丙
      tts:
        delivery: 贪杯懒散，话音拖沓
        timbre: 浑浊
        pace: 稍慢
        pitch: 中低音
    robber_4:
      display_name: 强盗丁
      tts:
        delivery: 斤斤计较，提到财宝时格外激动
        timbre: 尖窄
        pace: 中速
        pitch: 中高音
    robber_captain:
      display_name: 强盗头子
      tts:
        delivery: 逞强好胜，受挫后夸张而狼狈
        timbre: 低沉粗砺
        pace: 中速
        pitch: 低音
    porter:
      display_name: 看门人巴尼
      tts:
        delivery: 势利蛮横，心虚时慌忙辩解
        timbre: 刺耳发紧
        pace: 中快
        pitch: 中高音
    lord_dunlavin:
      display_name: 邓莱文勋爵
      tts:
        delivery: 威严公正，待客时慷慨爽快
        timbre: 饱满沉稳
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 杰克出门碰运气
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个穷寡妇，她只有杰克这么一个儿子。那年夏天，粮食少得可怜。新土豆还没长到能吃的时候，娘儿俩已经不知道日子该怎么熬下去了。一天傍晚，杰克打定主意，要出门为自己找一条活路。
        - id: ch01-b02
          speaker: jack
          text: 娘，替我烤个饼，再把那只母鸡杀了吧。我要到外面去碰碰运气。只要真叫我碰上了，我很快就回来，咱们一起享福。
        - id: ch01-b03
          speaker: narrator
          text: 母亲答应了他的请求。第二天天刚亮，杰克便背起食物动身。母亲陪着他走到院门口，临别时却让他在两样东西当中做个选择。
        - id: ch01-b04
          speaker: mother
          text: 杰克，你是愿意拿半张饼、半只鸡，带着我的祝福上路，还是把整张饼、整只鸡都拿走，却带上我的诅咒？
        - id: ch01-b05
          speaker: jack
          text: 哎呀，娘，您还用问吗？就算再把戴默家的全部田产送给我，只要里头有您的诅咒，我也绝不会要。
        - id: ch01-b06
          speaker: mother
          text: 那好，杰克。饼和鸡都归你，我还要送你千遍万遍的祝福。
        - id: ch01-b07
          speaker: narrator
          text: 母亲站在院墙边，不停为儿子祝福，直到再也望不见他的身影。杰克走了一程又一程，累得双腿发酸。沿路的农家，他一家家问过去，却没有一户需要雇小伙子。后来，他来到一片泥炭沼泽旁，瞧见一头驴陷在烂泥里，身子已经没到肩膀。驴拼命伸着脖子，想够到近旁的一大丛青草。
        - id: ch01-b08
          speaker: neddy
          text: 亲爱的杰克，快救我出去吧！不然我就要淹死了。
        - id: ch01-b09
          speaker: jack
          text: 不必再说第二遍，我这就来。
        - id: ch01-b10
          speaker: narrator
          text: 杰克搬来大石头，又挖下一块块草皮，全扔进泥浆里。驴的脚下渐渐有了能踩稳的地方，终于爬上坚硬的大路。
        - id: ch01-b11
          speaker: neddy
          text: 谢谢你，杰克。以后你有难处，我也一定帮你。你这是要去哪儿？
        - id: ch01-b12
          speaker: jack
          text: 我要出去碰碰运气，一直闯到收获季节。愿上帝保佑庄稼丰收！
        - id: ch01-b13
          speaker: neddy
          text: 你若不嫌弃，我想跟你一块儿走。谁知道咱们会遇上什么好运呢？
        - id: ch01-b14
          speaker: jack
          text: 那可太好了。天色已经不早，咱们赶路吧。
    - id: ch02
      title: 伙伴一个个来了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 杰克和驴走进一座村庄。前面一大群野小子正追赶一条狗，狗尾巴上还绑着一只水壶。可怜的狗一见杰克，立刻跑来求他保护。驴仰起脖子，发出一声可怕的吼叫。那群小坏蛋以为老魔鬼追来了，转身逃得一个不剩。
        - id: ch02-b02
          speaker: coley
          text: 杰克，干得漂亮！我真不知道该怎么谢你。你和这头牲口要上哪儿去？
        - id: ch02-b03
          speaker: jack
          text: 我们要到外面碰碰运气，一直走到收获季节。
        - id: ch02-b04
          speaker: coley
          text: 那我能跟你们走吗？我可太乐意了，也好永远甩掉那些没教养的小子。让他们倒霉去吧！
        - id: ch02-b05
          speaker: jack
          text: 来吧，把尾巴往胳膊上一搭，跟紧我们。
        - id: ch02-b06
          speaker: narrator
          text: 他们出了村镇，在一道老墙下坐下歇脚。杰克拿出面包和鸡肉，分给狗一份。驴在旁边嚼着蓟草。大伙儿边吃边说话，这时来了一只饿得半死的猫。他拖着长腔叫了一声，那声音凄惨得叫人心疼。
        - id: ch02-b07
          speaker: jack
          text: 看你这副模样，像是早饭以后翻过九重屋顶，却一口东西也没吃到。来，这根骨头上还带着肉。
        - id: ch02-b08
          speaker: tom
          text: 愿您的孩子永远不知道饿肚子的滋味！我眼下正需要这份好心。请问，诸位打算去哪儿？
        - id: ch02-b09
          speaker: jack
          text: 我们要出去碰碰运气，一直走到收获季节。你愿意的话，也跟我们来。
        - id: ch02-b10
          speaker: tom
          text: 我一万个愿意！谢谢你们肯带上我。
        - id: ch02-b11
          speaker: narrator
          text: 四个伙伴重新出发。等树影拉得有树身三倍那么长，他们听见路旁田野里传来一阵惊慌的咯咯叫。一只狐狸蹿过沟渠，嘴里正叼着一只漂亮的黑公鸡。
        - id: ch02-b12
          speaker: neddy
          text: 你这个天杀的恶棍！
          emotion: angry
        - id: ch02-b13
          speaker: jack
          text: 科利，快追！
        - id: ch02-b14
          speaker: narrator
          text: 杰克的话还没说完，科利已经飞奔出去，直追那只红毛狐狸。狐狸像扔掉一只烫手的土豆，立刻松开公鸡，自己逃得没影儿了。公鸡扑扇着翅膀，浑身发抖地回到伙伴们跟前。
        - id: ch02-b15
          speaker: black_cock
          text: 邻居们，今天能遇上你们，我的运气可真是好到顶了！以后你们若遇上难处，我绝不会忘记这份恩情。对了，你们究竟要去哪儿？
        - id: ch02-b16
          speaker: jack
          text: 我们要去碰碰运气，一直走到收获季节。你也来吧。腿脚和翅膀累了，就坐到内迪背后歇一歇。
        - id: ch02-b17
          speaker: narrator
          text: 队伍接着向前。太阳落山以后，他们四下一看，附近既没有茅屋，也没有农舍。
        - id: ch02-b18
          speaker: jack
          text: 眼下运气坏一点，下回说不定就更好。反正只是个夏夜，咱们到树林里去，睡在长草上吧。
        - id: ch02-b19
          speaker: narrator
          text: 大伙儿说睡就睡。杰克躺在干草上，内迪卧在近旁，科利和汤姆挨着驴温暖的肚腹，黑公鸡则飞到旁边的树上。夜深以后，他们一个个睡得又沉又香。谁知公鸡忽然来了兴致，放声啼叫起来。
        - id: ch02-b20
          speaker: neddy
          text: 黑公鸡，你可真讨厌！我正在梦里吃一束再好不过的干草，全让你搅了。到底出了什么事？
        - id: ch02-b21
          speaker: black_cock
          text: 天亮了呀！你没看见那边有光吗？
        - id: ch02-b22
          speaker: jack
          text: 那边确实亮着，可那是烛光，不是太阳。既然大家都醒了，不如过去问问人家肯不肯让我们住一夜。
    - id: ch03
      title: 林中强盗的屋子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 伙伴们抖抖身子，踩过青草和乱石，又钻过荆棘，一路下到洼地。黑影中透出那点烛光，歌声、笑声和咒骂声也一道传了过来。
        - id: ch03-b02
          speaker: jack
          text: 都放轻脚步，踮着脚尖过去。咱们先看清里头是什么人。
        - id: ch03-b03
          speaker: narrator
          text: 他们悄悄靠近窗户，看见屋里坐着六个强盗。那些家伙带着手枪、喇叭枪和短弯刀，正在桌边大嚼烤牛肉和烤猪肉，还喝着热香啤酒、葡萄酒和威士忌潘趣酒。
        - id: ch03-b04
          speaker: robber_1
          text: 咱们从邓莱文勋爵家捞的这一票，真是漂亮！要不是那位诚实的看门人，哪能到手这么多东西。来，祝他身体健康！
        - id: ch03-b05
          speakers: [robber_1, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: 祝看门人身体健康！
        - id: ch03-b06
          speaker: narrator
          text: 杰克朝伙伴们勾了勾手指，让他们挨得更近。
        - id: ch03-b07
          speaker: jack
          text: 都靠紧些。听准我的号令，我说动手，大家就一齐动手。
        - id: ch03-b08
          speaker: narrator
          text: 内迪把两只前蹄搭上窗台，科利爬到内迪头顶，汤姆又爬到科利头顶，黑公鸡站在最上面。杰克一打手势，四个伙伴同时扯开嗓门。
        - id: ch03-b09
          speakers: [neddy, coley, tom, black_cock]
          ensemble: chorus
          text: 咿——啊！汪汪！喵呜！喔喔喔——！
        - id: ch03-b10
          speaker: jack
          text: 举枪瞄准！把他们轰个粉碎，一个也别留下。预备——开火！
        - id: ch03-b11
          speaker: narrator
          text: 伙伴们又爆发出一声震天呐喊，一下撞碎了窗上所有玻璃。强盗们吓得魂都没了。他们吹灭蜡烛，撞翻桌子，从后门拼命逃走。一直逃进树林最深处，他们才敢停下。杰克一行进了屋，关好百叶窗，重新点亮蜡烛。他们吃着桌上的食物，喝着现成的酒水，直到谁也不饿不渴。随后，杰克睡进床里，内迪住进马厩，科利卧在门垫上，汤姆守着炉火，黑公鸡则上了栖架。
        - id: ch03-b12
          speaker: narrator
          text: 强盗们刚逃进密林时，还在庆幸自己保住了命。可湿草地又冷又难受，他们很快便想起屋里的种种好处，一个个越想越恼火。
        - id: ch03-b13
          speaker: robber_1
          text: 这片湿草地，哪能跟咱们暖和的屋子比！
        - id: ch03-b14
          speaker: robber_2
          text: 我还把一只肥美的猪蹄丢在了桌上。
        - id: ch03-b15
          speaker: robber_3
          text: 我最后那杯酒，连一茶匙都没喝到嘴里。
        - id: ch03-b16
          speaker: robber_4
          text: 更别提邓莱文勋爵的金银了。咱们把那些财宝全留在屋里啦！
        - id: ch03-b17
          speaker: robber_captain
          text: 我回去冒一次险，看看还能不能拿回点东西。
        - id: ch03-b18
          speakers: [robber_1, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: 好样的，头儿！
        - id: ch03-b19
          speaker: narrator
          text: 强盗头子独自回到屋外。里面没有一点灯光，他只好摸索着朝炉火走去。汤姆猛地扑上他的脸，又抓又咬。强盗头子痛得大叫，赶紧奔向房门，想进屋找根蜡烛。不料他踩中了科利的尾巴，胳膊和两条腿上立刻多了一圈圈牙印。
        - id: ch03-b20
          speaker: robber_captain
          text: 杀人啦！只要能让我逃出这座倒霉屋子就好！
          emotion: fearful
        - id: ch03-b21
          speaker: narrator
          text: 他刚摸到临街的大门，黑公鸡便从高处扑下来，尖爪利喙一齐往他身上招呼。跟这一顿啄抓相比，刚才猫咬狗撕简直只是跳蚤叮了一口。
        - id: ch03-b22
          speaker: robber_captain
          text: 你们这些没心肝的流氓，全都倒大霉去吧！
          emotion: angry
        - id: ch03-b23
          speaker: narrator
          text: 强盗头子喘着粗气，踉踉跄跄地转来转去，最后背朝后栽进马厩。内迪抬起后蹄，正中他裤子最宽的地方，一脚把他送上粪堆。他昏了好一阵，醒来后先挠挠脑袋，才慢慢想起方才发生的一切。等两条腿勉强能走，他便拖着脚，一点一点爬回树林。
    - id: ch04
      title: 强盗头子的可怕遭遇
      blocks:
        - id: ch04-b01
          speakers: [robber_1, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: 怎么样，头儿？咱们的财物还有希望拿回来吗？
        - id: ch04-b02
          speaker: narrator
          text: 强盗头子刚走到同伴们能听清他说话的地方，大伙儿便一齐围上去。他浑身都是抓伤、咬痕和青肿，却把屋里的动物全认成了更加可怕的东西。
        - id: ch04-b03
          speaker: robber_captain
          text: 别提什么希望了，我碰上的全是天底下最没希望的事。你们谁替我拔一床干草，让我躺下吧。就算搬来恩尼斯科西所有的橡皮膏，也贴不完我这一身伤。你们根本不知道，我为了大家受了多少罪！我摸到厨房炉边，想找一块燃着的泥炭，那里却坐着一个梳亚麻的老太婆。她拿梳板把我的脸抓成了这样。我拼命往房门逃，又绊上一个鞋匠和他的凳子。他拿锥子和钳子狠狠收拾我。要是我撒谎，你们只管骂我是骗子。后来我总算摆脱了鞋匠，可一走到大门口，魔鬼亲自扑到了我身上。那东西有尖爪，有一口像六便士铁钉那么厉害的牙，还有一双翅膀。愿他走到哪里，哪里就倒霉！最后我冲进马厩，迎面又挨了一柄大铁锤。那一下把我打飞了半英里。谁若不信，就自己回去看看！
        - id: ch04-b04
          speakers: [robber_1, robber_2, robber_3, robber_4]
          ensemble: chorus
          text: 可怜的头儿，我们全信！别说走进那间倒霉屋子，就算还隔着母鸡跑一程那么远，我们也绝不靠近！
        - id: ch04-b05
          speaker: narrator
          text: 第二天早晨，太阳还没来得及抖开外衣，杰克和伙伴们便起了床。他们用昨夜剩下的食物饱餐一顿，随后商量出一个主意。屋里的金银本来属于邓莱文勋爵，他们应当全部送还。杰克把金银装进一只长口袋的两头，再把口袋横放到内迪背上。大伙儿越过泥炭地，爬上山坡，走下谷地，有时又踏上黄土大路。走了很久，他们终于来到邓莱文勋爵府邸的大门前。
        - id: ch04-b06
          speaker: narrator
          text: 门口站着一个人，正在那里晾晒扑过粉的脑袋、白长袜和红马裤。正是那个暗中帮助强盗的看门人。
        - id: ch04-b07
          speaker: porter
          text: 你们来这儿干什么？我说，漂亮小伙子，这地方可容不下你们这一大群。
        - id: ch04-b08
          speaker: jack
          text: 我们想向你讨一样东西。不过你肯定拿不出来，那就是待人的起码礼数。
        - id: ch04-b09
          speaker: porter
          text: 你们这些懒骨头、流浪汉，马上滚！趁猫还没舔完一只耳朵，赶快从我眼前消失。不然我就放狗了！
          emotion: angry
        - id: ch04-b10
          speaker: black_cock
          text: 我倒有件事想请教。前些天夜里，究竟是谁替那些强盗打开了大门？
        - id: ch04-b11
          speaker: narrator
          text: 看门人那张红脸一下变得和衣领一样白。他还不知道，邓莱文勋爵和漂亮的女儿正站在客厅窗前。父女俩听到这里，都把头探了出来。
        - id: ch04-b12
          speaker: lord_dunlavin
          text: 巴尼，我也很想听听，你打算怎么回答这位长着红冠子的先生。
        - id: ch04-b13
          speaker: porter
          text: 老爷，千万别信这个坏蛋！我真的没有替那六个强盗开门。
          emotion: fearful
        - id: ch04-b14
          speaker: lord_dunlavin
          text: 可怜的老实人，那你怎么会知道强盗恰好有六个？
        - id: ch04-b15
          speaker: jack
          text: 先生，这件事先放一放。您的金银全在内迪背上的口袋里。我们从阿萨拉赫森林赶了这么远的路，您总不会舍不得给我们一顿晚饭和几张床吧？
        - id: ch04-b16
          speaker: lord_dunlavin
          text: 舍不得？绝不会！只要我还能帮上忙，你们当中谁也不会再过一天穷日子。
    - id: ch05
      title: 大伙儿都有了好归宿
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 邓莱文勋爵热热闹闹地迎接了杰克和他的伙伴。内迪、科利和黑公鸡在农场院子里各自得到最好的位置，汤姆则毫不客气地占下了厨房。勋爵让人替杰克从头到脚换上上等呢绒衣裳，配一件褶边雪白的衬衫，又给他穿上轻便皮鞋，还往他的表袋里放了一只怀表。
        - id: ch05-b02
          speaker: narrator
          text: 吃饭的时候，勋爵的女儿说，杰克身上有一种天生的绅士气派。勋爵当场决定，让杰克做自己的管家。杰克把母亲接来，让她在城堡附近安安稳稳地住下。从此，杰克、母亲和所有伙伴，都过上了称心如意的快活日子。
