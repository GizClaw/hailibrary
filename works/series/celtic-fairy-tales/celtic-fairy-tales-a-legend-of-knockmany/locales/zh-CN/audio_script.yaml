audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    fin:
      display_name: 芬恩·麦库尔
      tts:
        delivery: 豪爽爱面子，心虚时带着滑稽的慌张
        timbre: 粗厚洪亮
        pace: 中速
        pitch: 中低音
    oonagh:
      display_name: 乌娜
      tts:
        delivery: 机敏笃定，调侃和哄骗时从容自然
        timbre: 温暖明亮
        pace: 中速
        pitch: 中高音
    neighbour_1:
      display_name: 邻居甲
      tts:
        delivery: 直率好奇
        timbre: 朴实清亮
        pace: 中速
        pitch: 中音
    neighbour_2:
      display_name: 邻居乙
      tts:
        delivery: 随和风趣
        timbre: 温和厚实
        pace: 中速
        pitch: 中低音
    cucullin:
      display_name: 库库林
      tts:
        delivery: 自负强横，受挫后惊慌失措
        timbre: 低沉如雷
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 山顶上的大力神
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 爱尔兰的男女老少，谁没听过伟大而光荣的芬恩·麦库尔？从克利尔角一路问到巨人堤，再从巨人堤问回克利尔角，一个也找不出来。说到巨人堤，这个故事也该开场了。那时，芬恩正带着所有手下在那里干活，要筑一道横跨海面的桥，一直通往苏格兰。忽然间，他十分惦念独自在家的妻子乌娜，很想看看自己不在时，可怜的妻子日子过得怎样。于是他拔起一棵冷杉，砍去根枝，做成手杖，扛着它动身回家。
        - id: ch01-b02
          speaker: narrator
          text: 芬恩和乌娜住在诺克曼尼山最高的尖顶上。对面还有一座半山半岭的库拉莫尔山，活像诺克曼尼的表亲。那年月另有一个巨人叫库库林。有人说他来自爱尔兰，也有人说他来自苏格兰。究竟是哪国人并不打紧，谁都承认他是个厉害角色。他一发怒，跺一脚便能震动周围的乡野。他的威名传遍远近，据说只要还长着人的模样，跟他交手就绝没有胜算。当世没有哪个巨人招架得住他。
        - id: ch01-b03
          speaker: narrator
          text: 库库林曾一拳把一道雷电砸扁，压得像张薄饼，揣进口袋。每逢有人要同他交手，他总会先把那东西掏出来给对方看看。爱尔兰所有巨人几乎都挨过他的痛打，只有芬恩例外。他发誓，不论白天黑夜、严冬盛夏，都绝不罢休。只要抓住芬恩，也一定要给他尝尝同样的滋味。
        - id: ch01-b04
          speaker: narrator
          text: 芬恩听说库库林正赶往巨人堤，要同自己比力气。这消息一到，他忽然格外思念起孤单留在家里、日子过得不大舒坦的妻子。那份思念来得又突然又热烈。于是他拔起冷杉，削去根枝做成手杖，让那根手杖陪着自己一路回到了诺克曼尼山顶，去看心爱的乌娜。
        - id: ch01-b05
          speakers: [neighbour_1, neighbour_2]
          ensemble: duo
          text: 麦库尔先生，您为什么偏把家安在诺克曼尼山顶？那里一年四季，白天黑夜，风从来不停。风大得叫人还没上床、还没抬手喝酒，就得先戴稳睡帽。更糟的是，那里连水也没有啊！
        - id: ch01-b06
          speaker: fin
          text: 从我长到圆塔那么高起，人人就知道我爱看开阔的景致。邻居们，还有哪里比诺克曼尼山顶看得更远？水也不用担心，我正在打井。等巨人堤修好，我就来把它打完。
        - id: ch01-b07
          speaker: narrator
          text: 这只是芬恩说给人的一套大道理。真相是，他把家安得那么高，为的是远远望见库库林朝房子走来，好让自己早早有所准备。要在可爱又精明的阿尔斯特找一处严密瞭望的好地方，除了斯利夫克鲁布山、斯利夫多纳德山和对面的库拉莫尔，的确再没有哪里比这里妥帖方便了。而咱们私下里说，芬恩实在太需要这样一个地方了。
        - id: ch01-b08
          speaker: fin
          text: 愿上帝保佑屋里所有人！
        - id: ch01-b09
          speaker: oonagh
          text: 哎呀，芬恩，我的心肝！欢迎你回到乌娜身边，我亲爱的壮汉！
        - id: ch01-b10
          speaker: narrator
          text: 乌娜结结实实亲了他一口。据说山脚的湖水都为这份柔情起了涟漪，仿佛也懂得亲切和体贴。两人快活地过了两三天。若不算芬恩心里一直怕着库库林，他的日子实在过得很舒服。可那份恐惧一天比一天重，乌娜很快看出丈夫藏着心事，始终不肯说出口。女人若打定主意要从自家男人嘴里挖出或哄出一个秘密，自然有她的办法。芬恩就是明证。
        - id: ch01-b11
          speaker: fin
          text: 是库库林叫我不得安宁。他一发火，跺一脚能震动整片乡野。那家伙还截得住雷电，身上总带着一道压扁的，像薄饼一样，专给不信的人看。
        - id: ch01-b12
          speaker: narrator
          text: 芬恩把拇指含进嘴里。他想预知未来，或想知道自己不在时发生了什么，总会这样做。乌娜问他为什么。
        - id: ch01-b13
          speaker: fin
          text: 他来了。我看见他已经走到邓甘嫩下边。
        - id: ch01-b14
          speaker: oonagh
          text: 谢天谢地，亲爱的！你说的是谁呀？
        - id: ch01-b15
          speaker: fin
          text: 库库林那个畜生。我真不知道该怎么办。逃走会让我颜面扫地，可我的拇指说，我迟早非见他不可。
          emotion: fearful
        - id: ch01-b16
          speaker: oonagh
          text: 他什么时候到？
        - id: ch01-b17
          speaker: fin
          text: 明天下午两点左右。
          emotion: fearful
        - id: ch01-b18
          speaker: oonagh
          text: 我的壮汉，别泄气。把这件事交给我。你那拇指帮不上忙，我倒也许能让你漂漂亮亮地脱身。
          emotion: calm
    - id: ch02
      title: 乌娜的计策
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 乌娜在山顶燃起一道高高的烟，又把手指放进嘴里，连吹三声口哨。库库林看见信号，就知道库拉莫尔有人请他前去。很久以前，爱尔兰人正是这样向一切陌生人和过路旅客报信。他们一见烟，一听哨声，就知道主人欢迎自己登门。不论屋里当时有什么吃的喝的，来客都可以坐下来，一起分着享用。
        - id: ch02-b02
          speaker: narrator
          text: 芬恩却越想越愁，完全不知道该怎么办。库库林可不是容易对付的家伙。一想到他口袋里的那张雷电薄饼，芬恩连心都像被压扁了。那人一发怒，能把大地踩得像地震，还能把雷电砸成薄饼。自己再强壮勇敢，又怎会有胜算？向左向右，往前往后，他连该往哪里躲也想不出。
        - id: ch02-b03
          speaker: fin
          text: 乌娜，你就不能救救我吗？难道要看着我像兔子一样被串起来，让我在全族面前永远丢脸？我可是他们中最了不起的一个！那家伙像一座人形大山，又像地震和雷电凑成的怪物，口袋里还装着那张原本是——
          emotion: fearful
        - id: ch02-b04
          speaker: oonagh
          text: 安心吧，芬恩，我真替你害臊。老老实实待着。说起薄饼，咱们也许能请他吃点同样厉害的东西，不管他带来的是薄饼还是雷电。要是这一顿不能叫他终身难忘，以后就别再信乌娜。你只管照我说的做。
        - id: ch02-b05
          speaker: narrator
          text: 芬恩立刻宽心不少。说到底，他一向十分信任妻子，因为乌娜从前已经不止一次替他摆脱困境。乌娜取出九根不同颜色的毛线。每逢要办一件要紧的大事，她总用这些线找出最好的成功之道。她把毛线编成三条辫，每条各有三种颜色。一条戴在右臂，一条围住心口，第三条系在右脚踝。这三条辫子一系好，她便确信自己无论做什么都不会失败。
        - id: ch02-b06
          speaker: narrator
          text: 接着，她挨家挨户向邻居借来二十一块铁鏊，把每一块都揉进一张面饼的正中，再像平常烤饼那样放在火上。每烤好一张，她就把它收进食橱。她又煮了一大锅鲜奶，做出凝乳和乳清。所有东西都准备妥当，乌娜便心满意足地坐下来，等候第二天下午两点。
        - id: ch02-b07
          speaker: narrator
          text: 芬恩只要含一含拇指，就能知道库库林会在第二天下午两点到。这根拇指能预知事情，的确有种奇妙的本领。说来也巧，他的大敌库库林也有一根非同寻常的手指。众所周知，他全身的巨力都藏在右手中指里。一旦那根手指出了意外，再庞大的身躯也只剩普通人的力气。
        - id: ch02-b08
          speaker: narrator
          text: 第二天，库库林终于穿过山谷，远远出现在众人眼前。乌娜知道依计行动的时候到了，立刻把摇篮搬出来，让芬恩躺进去，再用被褥把他从头到脚严严实实盖好。
        - id: ch02-b09
          speaker: oonagh
          text: 你得装成自己的孩子。舒舒服服躺着，不许出声，一切听我安排。
        - id: ch02-b10
          speaker: narrator
          text: 到了预计的下午两点，库库林果然大步踏进门来。
        - id: ch02-b11
          speaker: cucullin
          text: 愿上帝保佑屋里所有人！大名鼎鼎的芬恩·麦库尔住在这里吗？
        - id: ch02-b12
          speaker: oonagh
          text: 正是，好汉。也愿上帝厚厚地保佑你。请坐吧？
        - id: ch02-b13
          speaker: cucullin
          text: 谢谢您。您想必就是麦库尔太太？
        - id: ch02-b14
          speaker: oonagh
          text: 正是。我想，我的丈夫没有什么叫我丢脸的地方。
        - id: ch02-b15
          speaker: cucullin
          text: 人人都说他是爱尔兰最强壮、最勇敢的人。不过附近有个人，很想同他握握手、较量一下。他在家吗？
        - id: ch02-b16
          speaker: oonagh
          text: 真不巧，他不在。有人告诉他，一个叫库库林的大块头蠢货正在巨人堤找他，他便怒冲冲地赶去逮人了。我只盼他们别遇上，也是为那个可怜的巨人着想。芬恩真碰上他，转眼就能把他捣成肉酱。
        - id: ch02-b17
          speaker: cucullin
          text: 我就是库库林。我找了他整整十二个月，可他一直躲着我。只要还没抓住他，我无论白天黑夜都不会休息。
        - id: ch02-b18
          speaker: narrator
          text: 乌娜听完放声大笑，满脸轻蔑，仿佛眼前只站着一个掌心大小的人。接着，她忽然换了口气。
        - id: ch02-b19
          speaker: oonagh
          text: 你亲眼见过芬恩吗？
        - id: ch02-b20
          speaker: cucullin
          text: 我怎么见得到？他总是小心躲得远远的。
        - id: ch02-b21
          speaker: oonagh
          text: 我就知道。你若肯听劝，就该日日夜夜祈祷，永远别碰上他。见到他的那一天，就是你的倒霉日。眼下风正对着门灌进来，芬恩又不在，能劳驾你把房子转个方向吗？他在家时总会自己转。
    - id: ch03
      title: 巨人的三场试炼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这要求连库库林也听得一惊。他还是站起来，把右手中指拉得喀啦响了三次。随后走到屋外，伸开双臂抱住房子，照乌娜的意思把整座屋转了过去。藏在摇篮里的芬恩把这一切看得清清楚楚，吓得全身每一个毛孔都直冒冷汗。乌娜却仗着自己的机智，连一丝慌乱也没有露出来。
        - id: ch03-b02
          speaker: oonagh
          text: 你这么好心，能不能再帮一个忙？这阵子旱得太久，我们缺水得厉害。芬恩说山坡后面的岩石底下藏着一眼好泉。他本想把石头扯开，可一听说你来了，气冲冲地赶去找你，连泉眼也忘了。你若肯帮忙，我可真要感激你。
        - id: ch03-b03
          speaker: narrator
          text: 乌娜领他走到山下。眼前没有半点泉水，只有连成一片的坚岩。库库林站在那里端详了一会儿，把右手中指拉得喀啦响了九次。接着，他俯下身，朝岩石猛力一扯，硬生生撕开一道约四百英尺深、四分之一英里长的裂谷。后来，人们给那地方取名叫拉姆福德峡谷。
        - id: ch03-b04
          speaker: oonagh
          text: 现在进屋吃点家常东西吧。芬恩即使与你为敌，也绝不会在自家屋里慢待你。他不在时，我若不好好招待客人，他会不高兴的。
        - id: ch03-b05
          speaker: narrator
          text: 乌娜领他回去，摆上半打铁鏊面饼，又拿来一两罐黄油、一大片煮咸肉和一大堆卷心菜，请他自己随意取用。诸位须知，那是很久以前的事，当时马铃薯还没有问世呢。库库林不只是饿，简直饿得发狂。他抓起一张饼塞进嘴里，张口便要狠狠咬下一大块。谁知一声雷鸣般的怪响突然从他喉咙里炸出来，半像愤怒的咆哮，半像疼痛的惨叫。
        - id: ch03-b06
          speaker: cucullin
          text: 鲜血和怒火啊！这是怎么回事？我掉了两颗牙！你给我吃的是什么面包？
          emotion: surprised
        - id: ch03-b07
          speaker: oonagh
          text: 怎么了？
        - id: ch03-b08
          speaker: cucullin
          text: 还问怎么了？我嘴里最好的两颗牙都掉了！
          emotion: angry
        - id: ch03-b09
          speaker: oonagh
          text: 这是芬恩在家唯一肯吃的面包。我忘了提醒你，除了他，就只有摇篮里的孩子咬得动。听说你在自己这种个头的小家伙里还算强壮，我以为你也能吃。我可不愿冒犯一个自以为能跟芬恩交手的人。再试一张吧，也许这张软些。
        - id: ch03-b10
          speaker: narrator
          text: 库库林饿得发狂，又扑向第二张饼。屋里顿时响起一声加倍响亮的惨叫。
        - id: ch03-b11
          speaker: cucullin
          text: 雷霆和绞架啊！快把面包拿走，不然我的牙一颗也剩不下！这回又掉了两颗！
          emotion: angry
        - id: ch03-b12
          speaker: oonagh
          text: 好了，好汉。吃不动，安静说一声就是，别吵醒摇篮里的孩子。你看，这下他真醒了。
        - id: ch03-b13
          speaker: narrator
          text: 芬恩立刻尖叫起来。这样响的嗓门竟来自一个小娃娃，库库林吓了一跳。
        - id: ch03-b14
          speaker: fin
          text: 妈妈，我饿了。给我拿点吃的。
        - id: ch03-b15
          speaker: narrator
          text: 乌娜走到摇篮边，把一张没有铁鏊的面饼递进他手里。芬恩看着别人吃了半天，胃口早被勾了起来，很快便把整张饼吞下肚。库库林看得目瞪口呆，又暗自感谢命运眷顾，让自己没有碰上真正的芬恩。连一个还躺在摇篮里的儿子，都能当着他的面嚼下这种面包。若是遇上每天吃这种东西的父亲，他哪里还有半点胜算？
        - id: ch03-b16
          speaker: cucullin
          text: 我想看看摇篮里的小伙子。一个婴儿能吃下这种东西，模样一定了不得。要是赶上歉收的夏天，养活他也不容易吧。
        - id: ch03-b17
          speaker: oonagh
          text: 我打心底里乐意。起来吧，心肝。让这位体面的小个子见识见识，可别辱没了你父亲芬恩·麦库尔。
        - id: ch03-b18
          speaker: narrator
          text: 芬恩早已尽量打扮成男孩模样。他爬出摇篮，把库库林领到外面。
        - id: ch03-b19
          speaker: fin
          text: 你力气大吗？
        - id: ch03-b20
          speaker: cucullin
          text: 雷霆和猎犬啊！这么小的家伙，怎么有这样大的嗓门！
          emotion: surprised
        - id: ch03-b21
          speaker: fin
          text: 我问你力气大不大。你能从这块白石头里挤出水吗？
        - id: ch03-b22
          speaker: narrator
          text: 他把白石递过去。库库林用尽力气，挤了又挤，却连一滴水也没有。
        - id: ch03-b23
          speaker: fin
          text: 唉，你真没用！这样也算巨人？把石头给我。我让你看看芬恩的小儿子能做什么，你就知道我爸爸有多厉害了。
        - id: ch03-b24
          speaker: narrator
          text: 芬恩接回石头，暗中换成一块凝乳。手上一使劲，清水般的乳清便淅淅沥沥地落下来。
        - id: ch03-b25
          speaker: fin
          text: 我要回摇篮了。连我爸爸的面包都吃不动，连石头里的水都挤不出，我才不肯陪这种人浪费时间。你最好在他回来前赶紧走。他要抓住你，不出两分钟就能把你捣成一摊糊糊。
    - id: ch04
      title: 藏在中指里的力量
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 库库林亲眼见过这一切，也觉得孩子说得有理。一想到芬恩就要回来，他吓得两膝不停相撞，匆忙向乌娜告辞。他再三向她保证，从今天起，自己再也不愿听见她丈夫的任何消息，更别说亲眼见到他。芬恩会出现的地方，他一辈子都不想靠近。
        - id: ch04-b02
          speaker: cucullin
          text: 我老实承认，自己力气虽大，却不是他的对手。告诉他，我会像躲瘟疫一样躲着他。只要还活着，我就绝不到这一带来。
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: 芬恩已经躺回摇篮，安安静静地等着。眼看库库林马上就要离开，又没识破他们使下的半点花招，他高兴得心都快跳到嗓子眼。
        - id: ch04-b04
          speaker: oonagh
          text: 算你运气好，偏巧他不在家。不然你早成了老鹰嘴里的肉。
        - id: ch04-b05
          speaker: cucullin
          text: 我知道，他还能把我变成什么呢？不过临走前，能让我摸摸这孩子的牙吗？我想知道，咬得动铁鏊面包的是怎样一口牙。
        - id: ch04-b06
          speaker: oonagh
          text: 当然可以。只是他的牙长得很靠里，你得把手指伸深一些。
        - id: ch04-b07
          speaker: narrator
          text: 库库林摸到这样一口有力的臼齿，心里已经十分惊讶。可等他把手从芬恩嘴里抽出来，眼前的情形更叫他惊骇万分。那根寄托着自己全部力量的中指，竟然留在了芬恩嘴里。他发出一声沉重的呻吟。失去中指以后，满身巨力也随之消失。恐惧和虚弱同时袭来，庞大的身躯当场倒在地上，再也没有了方才转动房屋、撕开山岩的威风。
        - id: ch04-b08
          speaker: narrator
          text: 芬恩等的正是这一刻。他心里清楚，自己最强大、最凶恶的仇敌如今已经任他摆布。他从摇篮里一跃而出，再也不用装成婴儿。没过几分钟，那个长久以来叫芬恩和所有追随者闻风丧胆的大巨人库库林，便一动不动，成了一具横在他面前的尸体。
        - id: ch04-b09
          speaker: narrator
          text: 就这样，芬恩靠妻子乌娜的聪明才智，用计谋战胜了那个单凭力气永远无法战胜的敌人。
