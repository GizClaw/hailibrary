audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, legendary, and composed
        timbre: rich and clear
        pace: measured
        pitch: medium
    fin_mcoul:
      display_name: Fin M'Coul
      tts:
        delivery: hearty, proud, and comically uneasy
        timbre: huge and resonant
        pace: measured
        pitch: low
    oonagh:
      display_name: Oonagh
      tts:
        delivery: clever, affectionate, and confidently teasing
        timbre: warm and bright
        pace: lively
        pitch: medium
    cucullin:
      display_name: Cucullin
      tts:
        delivery: boastful, forceful, and increasingly alarmed
        timbre: deep and rough
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: Fin Comes Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: What Irish man, woman, or child has never heard of the renowned, great, and glorious Fin M'Coul, our own Hibernian Hercules? Not one, from Cape Clear to the Giant's Causeway and all the way back again. And speaking of the Causeway brings us straight to the beginning of this story. Fin and all his men were working there, trying to build a bridge across to Scotland. Fin was very fond of his wife, Oonagh. One day, he suddenly decided to go home and see how the poor woman was managing while he was away. He pulled a fir tree right out of the earth, cut off its roots and branches, and made himself a walking stick. Then he set off to see Oonagh.
        - id: ch01-b02
          speaker: narrator
          text: Oonagh, or rather Fin, lived at the very top of Knockmany Hill. Across from it stood a cousin of a hill called Cullamore, half hill and half mountain.
        - id: ch01-b03
          speaker: narrator
          text: Now, another giant lived in those days. His name was Cucullin. Some said he was Irish and some said Scottish, but whether he came from Scotland or Ireland, everyone agreed that he was a fierce customer. No other giant alive could stand before him. His fame and his name traveled far and wide. When anger took him, one stamp of his foot could shake all the country around him. People said that nothing shaped like a man had any chance against him in a fight. With one blow of his fist, he had flattened a thunderbolt. He kept it in his pocket in the shape of a pancake and showed it to every enemy who doubted him before a fight.
        - id: ch01-b04
          speaker: narrator
          text: Cucullin had already given every giant in Ireland a sound beating except Fin M'Coul. He swore he would never rest, by night or day, in winter or summer, until he caught Fin and gave him the same treatment. Before long, Fin heard that Cucullin was coming to the Causeway for a trial of strength. At that very moment, Fin was seized by a warm and sudden affection for his poor wife, living her lonely and uncomfortable life without him. So, as I said, up came the fir tree. Fin trimmed it into a walking stick and set off toward his darling Oonagh on top of Knockmany.
        - id: ch01-b05
          speaker: narrator
          text: People often wondered why Fin had chosen such a windy place for his house, and they told him so.
        - id: ch01-b06
          speaker: narrator
          text: They asked what he meant by living on top of Knockmany, where the wind blew day and night, summer and winter, where a man often had to keep his nightcap on without even going to bed, and where there was hardly any water.
        - id: ch01-b07
          speaker: fin_mcoul
          text: Why, ever since I was as tall as a round tower, everyone has known that I enjoy a fine view. Where could I find a better one than the top of Knockmany? As for water, I'm sinking a pump. Please goodness, I'll finish it as soon as the Causeway is done.
        - id: ch01-b08
          speaker: narrator
          text: Now, that answer was more of Fin's philosophy than the truth. The real reason he had settled on Knockmany was that he could see Cucullin coming toward the house. Fin wanted a place where he could keep a sharp lookout. Between ourselves, he wanted it grievously. Apart from Slieve Croob, Slieve Donard, or Knockmany's own cousin Cullamore, he could hardly have found a neater or handier place in all the sweet and sensible province of Ulster.
        - id: ch01-b09
          speaker: fin_mcoul
          text: God save everyone here!
        - id: ch01-b10
          speaker: narrator
          text: Fin spoke cheerfully as he put his honest face through his own doorway.
        - id: ch01-b11
          speaker: oonagh
          text: Musha, Fin, my dear, welcome home to your own Oonagh, you darling bully!
        - id: ch01-b12
          speaker: narrator
          text: Then came a kiss so mighty that the lake at the foot of the hill is said to have curled its waters in kindness and sympathy.
    - id: ch02
      title: Oonagh Makes a Plan
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Fin passed two or three happy days with Oonagh. He felt very comfortable, considering the dread he had of Cucullin. But that dread kept growing. Before long, Oonagh could see that something was weighing on his mind, something he was keeping entirely to himself. When a woman means to ferret or coax a secret from her good man, you may trust her to do it. Fin soon proved that.
        - id: ch02-b02
          speaker: fin_mcoul
          text: It's Cucullin who's troubling me. When that fellow gets angry and starts stamping, he can shake a whole townland. And everyone knows he can stop a thunderbolt. He carries one in his pocket, flattened like a pancake, just to prove it to anyone who doubts him.
        - id: ch02-b03
          speaker: narrator
          text: As Fin spoke, he put his thumb into his mouth. He always did that when he wanted to prophesy or learn what had happened while he was away. Oonagh asked why he was doing it.
        - id: ch02-b04
          speaker: fin_mcoul
          text: He's coming. I can see him down below Dungannon.
          emotion: fearful
        - id: ch02-b05
          speaker: oonagh
          text: Thank goodness, dear! Who is coming? Glory be to God!
          emotion: surprised
        - id: ch02-b06
          speaker: fin_mcoul
          text: That brute Cucullin. I don't know what to do. If I run away, I'll be disgraced. But sooner or later I must face him. My thumb tells me so.
        - id: ch02-b07
          speaker: oonagh
          text: When will he reach us?
        - id: ch02-b08
          speaker: narrator
          text: Fin groaned before he answered.
        - id: ch02-b09
          speaker: fin_mcoul
          text: Tomorrow, at about two o'clock.
        - id: ch02-b10
          speaker: oonagh
          text: Well, my bully, don't lose heart. Depend on me. Maybe I'll pull you out of this scrape better than you could ever do with that rule-of-thumb of yours.
        - id: ch02-b11
          speaker: narrator
          text: Oonagh built a tall fire on the hilltop. Then she put a finger in her mouth and whistled three times. Cucullin understood that as an invitation to Cullamore. Long ago in Ireland, that was how people told strangers and travelers they were welcome to come and share whatever the house could offer.
        - id: ch02-b12
          speaker: narrator
          text: Meanwhile, Fin grew more and more miserable. He had no idea what to do or how to act. Cucullin was an ugly customer to meet, and the thought of that flattened thunderbolt turned Fin's very heart weak inside him. Strong and brave as he was, what chance had he against a man who could walk the country into earthquakes whenever anger took him, then punch a thunderbolt flat as a pancake? Fin could not tell which way to turn. Right or left, backward or forward, he had no guess where to go.
        - id: ch02-b13
          speaker: fin_mcoul
          text: Oonagh, can't you do anything for me? Where has all your cleverness gone? Must I be skewered like a rabbit before your eyes and have my name disgraced before my whole tribe, when I'm the best man among them? How can I fight that man-mountain, that great mixture of earthquake and thunderbolt, with a pancake in his pocket that was once—
          emotion: fearful
        - id: ch02-b14
          speaker: oonagh
          text: Easy, Fin. Troth, I'm ashamed of you. Keep your toe in your pump, will you? Since you're talking of pancakes, perhaps we'll feed him something every bit as good as the one he carries, thunderbolt or not. If I don't give him the smartest meal he's had in many a day, never trust Oonagh again. Leave him to me, and do exactly what I tell you.
        - id: ch02-b15
          speaker: narrator
          text: Fin felt greatly relieved. After all, he had enormous confidence in his wife. He knew very well that her cleverness had rescued him from many a tight place before. Oonagh took nine woolen threads, each of a different color. She always used them when she needed to discover the best way to succeed in some important business. She braided them into three plaits, with three colors in each. One went around her right arm, the second around her heart, and the third around her right ankle. Once they were in place, she knew that nothing she undertook could fail.
        - id: ch02-b16
          speaker: narrator
          text: Next she went around to the neighbors and borrowed twenty-one iron griddles. She kneaded one griddle into the heart of each of twenty-one loaves and baked the loaves over the fire in the usual way. As each one was done, she set it aside in the cupboard. Then she put a large pot of fresh milk on the fire and turned it into curds and whey. With everything prepared, Oonagh sat down quite contentedly. She waited for Cucullin to arrive at two o'clock the next day, the very hour Fin had learned by sucking his thumb.
        - id: ch02-b17
          speaker: narrator
          text: Fin's thumb was a curious thing indeed. Whenever he sucked it, he could foretell what was coming or learn what had happened while he was away. And his great enemy had a strange secret of his own. Everyone knew that all Cucullin's enormous strength lay in the middle finger of his right hand. If some mischance ever cost him that finger, then despite all his great bulk, he would be no stronger than an ordinary man.
        - id: ch02-b18
          speaker: narrator
          text: At last, the next day, Oonagh saw Cucullin crossing the valley. It was time to begin. She brought out the cradle, made Fin lie inside, and covered him with the bedclothes.
        - id: ch02-b19
          speaker: oonagh
          text: You must pretend to be your own child. Lie there quietly, say nothing, and follow my lead.
    - id: ch03
      title: The Giant at the Door
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At about two o'clock, just as Fin had predicted, Cucullin came into the house.
        - id: ch03-b02
          speaker: cucullin
          text: God save everyone here! Is this the home of the great Fin M'Coul?
        - id: ch03-b03
          speaker: oonagh
          text: Indeed it is, honest man. God save you kindly. Won't you sit down?
        - id: ch03-b04
          speaker: cucullin
          text: Thank you, ma'am. I suppose you're Mrs. M'Coul?
        - id: ch03-b05
          speaker: oonagh
          text: I am, and I hope I've no reason to be ashamed of my husband.
        - id: ch03-b06
          speaker: cucullin
          text: No. They say he's the strongest and bravest man in Ireland. All the same, a man who lives not far from here is very eager to try his strength against him. Is Fin at home?
        - id: ch03-b07
          speaker: oonagh
          text: Why, no. And if any man ever left his house in a fury, Fin did. Someone told him that a great clumsy giant called Cucullin was down at the Causeway looking for him. Fin rushed off to see if he could catch the fellow. Troth, for the poor giant's sake, I hope they don't meet. Fin would pound him into paste at once.
        - id: ch03-b08
          speaker: cucullin
          text: Well, I am Cucullin. I've searched for Fin these twelve months, but he has always stayed out of my way. I won't rest by night or day until I lay my hands on him.
        - id: ch03-b09
          speaker: narrator
          text: Oonagh gave a loud, scornful laugh and looked at him as though he were no more than a handful of a man. Then her manner changed all at once.
        - id: ch03-b10
          speaker: oonagh
          text: Have you ever seen Fin?
        - id: ch03-b11
          speaker: cucullin
          text: How could I? He always made sure to keep his distance.
        - id: ch03-b12
          speaker: oonagh
          text: Just as I thought. Take my advice, you poor-looking creature. Pray night and day that you never do see him, because the day you meet will be a black one for you. But meanwhile, the wind is blowing straight through the door. Since Fin is away, perhaps you'll be civil enough to turn the house around. Fin always does it when he's home.
        - id: ch03-b13
          speaker: narrator
          text: That request startled even Cucullin. Still, he got to his feet and pulled the middle finger of his right hand until it cracked three times. Then he went outside, put both arms around the house, and turned the whole building as Oonagh had asked. When Fin saw Cucullin do it, he felt the sweat of fear ooze from every pore in his skin. Oonagh, however, depended on her own woman's wit and was not daunted in the least.
        - id: ch03-b14
          speaker: oonagh
          text: Arrah, since you're so obliging, perhaps you'll do us one more kindness while Fin is away. This long dry spell has left us badly short of water. Fin says there is a fine spring beneath the rocks behind the hill. He meant to pull them apart, but when he heard about you, he left in such a fury that it slipped his mind. If you'd try to find the spring, I'd count it a kindness.
        - id: ch03-b15
          speaker: narrator
          text: Oonagh led Cucullin down behind the hill and showed him the place. It was not loose earth or broken stone, but one solid mass of rock. Cucullin looked it over for some time. Then he cracked the middle finger of his right hand nine times, bent down, and tore the rock apart. He opened a cleft about four hundred feet deep and a quarter of a mile long. From that day to this, the place has carried the name of Lumford's Glen.
        - id: ch03-b16
          speaker: oonagh
          text: Come inside now and eat a little of the humble food we can give you. Though you and Fin are enemies, he would scorn to deny you kindness beneath his own roof. If I failed to feed you while he was away, he wouldn't be pleased with me.
    - id: ch04
      title: Fin's Bread and Fin's Baby
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Oonagh brought Cucullin back into the house. She placed six of the special loaves in front of him, along with a can or two of butter, a whole side of boiled bacon, and a great stack of cabbage. Then she told him to help himself to whatever he wanted. This, you should know, happened long before potatoes were invented.
        - id: ch04-b02
          speaker: narrator
          text: Cucullin picked up one of the loaves and pushed it toward his mouth, meaning to take a tremendous bite. The instant his teeth struck the griddle inside, a thundering noise burst from him. It was something between a growl and a yell.
        - id: ch04-b03
          speaker: cucullin
          text: Blood and fury! What is this? Two of my teeth are out! What sort of bread have you given me?
          emotion: angry
        - id: ch04-b04
          speaker: oonagh
          text: What's the matter?
        - id: ch04-b05
          speaker: cucullin
          text: The matter? The two best teeth in my head are gone!
          emotion: angry
        - id: ch04-b06
          speaker: oonagh
          text: Why, that's Fin's bread. It's the only kind he eats at home. Indeed, I forgot to warn you that no one can eat it except Fin and that child in the cradle. Still, people say you're a fairly sturdy little fellow for your size, so I thought you might manage it. I wouldn't want to offend a man who believes he can fight Fin. Here, try another loaf. Perhaps this one isn't quite so hard.
        - id: ch04-b07
          speaker: narrator
          text: Cucullin was ravenously hungry, so he attacked a second loaf. At once, a yell twice as loud as the first rang through the house.
        - id: ch04-b08
          speaker: cucullin
          text: Thunder and gibbets! Take this bread away, or I won't have one tooth left in my head. Another pair is gone!
          emotion: angry
        - id: ch04-b09
          speaker: oonagh
          text: Well, honest man, if you can't eat the bread, just say so quietly. Don't wake the child in the cradle. There now, you've woken him.
        - id: ch04-b10
          speaker: narrator
          text: Fin let out a shriek. Cucullin jumped at hearing such a noise from one so young.
        - id: ch04-b11
          speaker: fin_mcoul
          text: Mother, I'm hungry. Bring me something to eat.
        - id: ch04-b12
          speaker: narrator
          text: Oonagh went over to the cradle and put a loaf into Fin's hand. This one had no iron griddle hidden inside it. Watching all that eating had sharpened Fin's appetite, and he soon swallowed the loaf. Cucullin was thunderstruck. In secret, he thanked his stars for the good fortune of missing Fin himself.
        - id: ch04-b13
          speaker: narrator
          text: Cucullin thought it through. He would have no chance at all against a man who could eat bread as hard as that, when even the man's son, still young enough for a cradle, could munch it right before his eyes.
        - id: ch04-b14
          speaker: cucullin
          text: I'd like one look at the lad in that cradle. A baby who can manage food like that must be something to see, and no small thing to feed in a lean summer.
        - id: ch04-b15
          speaker: oonagh
          text: With all the veins of my heart. Get up, my darling, and show this decent little man something worthy of your father, Fin M'Coul.
        - id: ch04-b16
          speaker: narrator
          text: Fin had been dressed to look as much like a boy as possible. He climbed out and led Cucullin outside.
        - id: ch04-b17
          speaker: fin_mcoul
          text: Are you strong?
        - id: ch04-b18
          speaker: cucullin
          text: Thunder and wounds! What a voice for such a small lad!
          emotion: surprised
        - id: ch04-b19
          speaker: fin_mcoul
          text: I asked if you're strong. Can you squeeze water out of this white stone?
        - id: ch04-b20
          speaker: narrator
          text: Fin put a white stone into Cucullin's hand. The giant squeezed and squeezed, but not one drop came out.
        - id: ch04-b21
          speaker: fin_mcoul
          text: Ah, you're a poor creature! And you call yourself a giant? Give me that stone. When you see what Fin's little son can do, you'll know what my daddy himself must be like.
        - id: ch04-b22
          speaker: narrator
          text: Fin took back the stone and secretly exchanged it for a handful of curds. He squeezed. Clear whey ran between his fingers in a little shower.
        - id: ch04-b23
          speaker: fin_mcoul
          text: I'm going back to my cradle. I won't waste time on anyone who can't eat my daddy's bread or squeeze water from a stone. Bedad, you'd better leave before he returns. If he catches you, he'll turn you into flummery in two minutes.
        - id: ch04-b24
          speaker: narrator
          text: After everything Cucullin had seen, he agreed with the boy. His knees knocked together from sheer terror at the thought of Fin returning. He hurried to bid Oonagh farewell. Before he left, he assured her that from that day forward, he never wished even to hear of her husband, much less to see him.
        - id: ch04-b25
          speaker: cucullin
          text: I freely admit that even with all my strength, I'm no match for Fin. Tell him I'll avoid him as I'd avoid the plague. As long as I live, I'll keep well away from this part of the country.
          emotion: fearful
    - id: ch05
      title: The Finger of Strength
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Meanwhile, Fin had slipped back into the cradle and lay there very quietly. His heart was in his mouth with delight. Cucullin was about to take his departure without discovering any of the tricks that Oonagh and Fin had played upon him.
        - id: ch05-b02
          speaker: oonagh
          text: It's lucky for you that Fin isn't here. He'd make nothing of you but food for the hawks.
        - id: ch05-b03
          speaker: cucullin
          text: I know it. Devil a thing else would he make of me. But before I go, may I feel the teeth of Fin's lad? I'd like to know what kind of teeth can chew griddle-bread like that.
        - id: ch05-b04
          speaker: oonagh
          text: With all the pleasure in life. Only his teeth are far back in his head, so you'll need to put your finger well inside.
        - id: ch05-b05
          speaker: narrator
          text: Cucullin was amazed to find such a powerful set of grinders in one so young. But he was far more amazed when he pulled his hand from Fin's mouth. The very middle finger on which all his enormous strength depended had stayed behind. Cucullin gave one loud groan and fell down at once, overcome by terror and weakness.
        - id: ch05-b06
          speaker: narrator
          text: That was all Fin wanted. Now he knew that his most powerful and bitterest enemy was at his mercy. Fin sprang out of the cradle. Within a few minutes, the great Cucullin, who for so long had been the terror of Fin and every one of his followers, lay dead before him.
        - id: ch05-b07
          speaker: narrator
          text: And so Fin overcame his enemy through the wit and invention of his wife, Oonagh. By force alone, he could never have done it.
