cover_prompt: |-
  A wordless cover scene on a windswept green hill above the western sea gathers the wonder of old Celtic fairy tales in a child-friendly late-nineteenth-century storybook world. A fiery-haired young prince in a russet cloak steps toward a gleaming crystal canoe where a radiant maiden in a pale flowing gown holds out her hand. Behind them, a small dark-haired village boy in a rough wool coat watches from beside an ancient earthen fairy mound, while a white hound stands alert among heather and weathered stones. The prince reaching toward the canoe is the clear focal action, with distant wooded hills, a round tower, and soft island silhouettes suggesting the many lands and adventures of the collection. Use a wide, gently elevated composition with the figures and shoreline in the lower two-thirds and calm room in the luminous evening sky at the top. Keep the clothing, landscape, boat, and architecture rooted in preindustrial Ireland, Scotland, and Wales, with original designs and a warm sense of mystery rather than danger. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
