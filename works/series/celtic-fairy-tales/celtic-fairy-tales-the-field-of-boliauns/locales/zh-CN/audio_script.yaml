audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    tom_fitzpatrick:
      display_name: 汤姆·菲茨帕特里克
      tts:
        delivery: 直爽冒失，起了贪念时急切而自信
        timbre: 明亮厚实
        pace: 明快
        pitch: 中音
    lepracaun:
      display_name: 小矮妖
      tts:
        delivery: 狡黠老练，话里常藏着促狭的圈套
        timbre: 细小而略带沙哑
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 树篱里的小鞋匠
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 收获季里的圣母节，是一年中数得上的大节日，人人都知道。那天阳光正好，汤姆·菲茨帕特里克在田野间闲逛，沿着树篱向阳的一面往前走。忽然，前方的篱笆里传出一阵咔嗒咔嗒的响声。
        - id: ch01-b02
          speaker: tom_fitzpatrick
          text: 真怪，这个时节都这么晚了，黑喉石䳭怎么还在叫？
        - id: ch01-b03
          speaker: narrator
          text: 汤姆踮起脚尖，一点点凑过去，想看看自己猜得对不对。响声停了。他从灌木间仔细望进去，看见角落里摆着一把棕色陶壶，大约能装一加仑半的酒。紧接着，一个小得不能再小的老头儿出现了。他戴着一顶丁点儿大的三角帽，身前挂着一小片皮围裙。他搬来小木凳，站上去，用小木桶从壶里舀出满满一桶酒，放在凳子边。随后，他坐到大陶壶底下，拿起一只正合自己脚穿的爱尔兰皮鞋，咔嗒咔嗒地钉起鞋后跟。
        - id: ch01-b04
          speaker: tom_fitzpatrick
          text: 凭老天的威力！小矮妖的故事我听过不少，可我一直没当真。眼前这个却是货真价实的。只要办得机灵，我这辈子就发达了。听说盯住他们以后，眼睛千万不能移开，不然他们转眼就会逃掉。
        - id: ch01-b05
          speaker: narrator
          text: 汤姆悄悄向前挪，双眼紧盯着小老头儿，就像猫盯住了老鼠。等他走到近前，才开口招呼。
        - id: ch01-b06
          speaker: tom_fitzpatrick
          text: 邻居，愿上帝保佑你手里的活计。
        - id: ch01-b07
          speaker: narrator
          text: 小老头儿抬起头来。
        - id: ch01-b08
          speaker: lepracaun
          text: 多谢你的好意。
        - id: ch01-b09
          speaker: tom_fitzpatrick
          text: 今天可是节日，你居然还在干活！
        - id: ch01-b10
          speaker: lepracaun
          text: 我干不干活，是我自己的事，轮不到你管。
    - id: ch02
      title: 石南酿的啤酒
      blocks:
        - id: ch02-b01
          speaker: tom_fitzpatrick
          text: 那么，你能不能赏个脸，告诉咱们那把壶里装着什么？
        - id: ch02-b02
          speaker: lepracaun
          text: 当然能，我很乐意。那是上好的啤酒。
        - id: ch02-b03
          speaker: tom_fitzpatrick
          text: 啤酒？雷霆烈火在上！你从哪儿弄来的？
        - id: ch02-b04
          speaker: lepracaun
          text: 从哪儿弄来的？自然是我自己酿的。你再猜猜，我拿什么酿的？
        - id: ch02-b05
          speaker: tom_fitzpatrick
          text: 鬼才知道。我猜是麦芽，还能用什么？
        - id: ch02-b06
          speaker: lepracaun
          text: 猜错啦。我用的是石南。
        - id: ch02-b07
          speaker: narrator
          text: 汤姆一听，忍不住哈哈大笑。
        - id: ch02-b08
          speaker: tom_fitzpatrick
          text: 石南？你把我当成什么傻瓜了，以为我连这种话也会信？
        - id: ch02-b09
          speaker: lepracaun
          text: 信不信随你，我说的可都是真的。丹麦人的故事，你没听过吗？
        - id: ch02-b10
          speaker: tom_fitzpatrick
          text: 听过啊，那又怎么样？
        - id: ch02-b11
          speaker: lepracaun
          text: 他们从前住在这里时，教会我们用石南酿啤酒。这个秘方从那以后就在我家代代相传。
        - id: ch02-b12
          speaker: tom_fitzpatrick
          text: 那能让我尝一口吗？
        - id: ch02-b13
          speaker: lepracaun
          text: 年轻人，你少拿傻问题来烦安分守己的人，还是去照看你父亲的家业吧。你在这里闲磨工夫，牛都闯进燕麦地了，正把庄稼踩得乱七八糟呢。
        - id: ch02-b14
          speaker: narrator
          text: 汤姆大吃一惊，正要回头去看，才猛然想起小矮妖的把戏。他怕同样的事再来一次，赶紧伸手一抓，把小矮妖紧紧攥在手心里。可他忙中出错，撞翻了陶壶，啤酒洒得一滴不剩。原本还想尝尝那酒，如今连它是什么滋味也无从知道了。
        - id: ch02-b15
          speaker: narrator
          text: 汤姆随即发誓，小矮妖要是不把藏钱的地方指给他，他就杀了他。他满脸凶相，杀气腾腾，小老头儿看得真害怕了。
        - id: ch02-b16
          speaker: lepracaun
          text: 跟我来吧。走过两块田，我就带你去找一坛金子。
          emotion: fearful
    - id: ch03
      title: 千里光下的金子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两人就这样上了路。汤姆把小矮妖牢牢抓在手里，一路都没有把目光从他身上移开。哪怕翻越树篱，跨过沟渠，又穿过一片弯弯曲曲的泥炭沼泽，他也始终盯得紧紧的。最后，他们来到一大片田野，田里到处长满了千里光。
        - id: ch03-b02
          speaker: narrator
          text: 小矮妖指向其中一棵高大的千里光。
        - id: ch03-b03
          speaker: lepracaun
          text: 就挖那棵千里光底下。那里有一只大坛子，里面装满了金币。
        - id: ch03-b04
          speaker: narrator
          text: 汤姆出门时太匆忙，根本没想到要带铁锹。他拿定主意，马上跑回家去取一把。为了回来还能认准地方，他解下一条红袜带，牢牢系在那棵千里光上。
        - id: ch03-b05
          speaker: tom_fitzpatrick
          text: 你得发誓，绝不从这棵千里光上解下我的袜带。
        - id: ch03-b06
          speaker: narrator
          text: 小矮妖立刻起誓，答应连碰也不碰那条袜带。
        - id: ch03-b07
          speaker: lepracaun
          text: 那么，你应该不再需要我了吧？
        - id: ch03-b08
          speaker: narrator
          text: 这一次，他说得客客气气。
        - id: ch03-b09
          speaker: tom_fitzpatrick
          text: 是啊，没别的事了。你现在可以走。愿上帝保佑你一路顺风，走到哪里都交好运。
        - id: ch03-b10
          speaker: lepracaun
          text: 再会了，汤姆·菲茨帕特里克。等你拿到金子，愿它给你带来天大的好处。
    - id: ch04
      title: 满田的红袜带
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 汤姆撒腿就跑，一口气冲回家，抓起铁锹，又拼尽全力赶回那片千里光田。可是到了地方，他抬眼一看，顿时傻了。
        - id: ch04-b02
          speaker: narrator
          text: 田里的每一棵千里光上，都系着一条红袜带，模样和他的那条分毫不差。想把整片地全挖一遍，根本办不到。那片田足足有四十多个爱尔兰英亩。
        - id: ch04-b03
          speaker: narrator
          text: 汤姆只能把铁锹扛上肩头，垂头丧气地往家走。他出发时那股火热的兴奋，回来时早凉了大半。从此以后，只要想起小矮妖送给他的这道漂亮圈套，他就会把那个狡猾的家伙痛痛快快地咒骂一番。
