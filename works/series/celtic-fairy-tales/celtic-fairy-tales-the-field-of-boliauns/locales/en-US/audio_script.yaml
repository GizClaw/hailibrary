audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, legendary, and composed
        timbre: rich and clear
        pace: measured
        pitch: medium
    tom_fitzpatrick:
      display_name: Tom Fitzpatrick
      tts:
        delivery: lively, confident, and quick-witted
        timbre: hearty and clear
        pace: brisk
        pitch: medium
    leprechaun:
      display_name: Leprechaun
      tts:
        delivery: dry, crafty, and self-possessed
        timbre: small and weathered
        pace: nimble
        pitch: medium-high
  chapters:
    - id: ch01
      title: A Clatter in the Hedge
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was a fine harvest day, and not just any day. It was Lady Day in harvest, one of the greatest holidays of the year, as everyone knew. Tom Fitzpatrick was out roaming over the land. He followed the sunny side of a hedge until he heard a strange clacking sound just ahead of him, somewhere among the leaves.
        - id: ch01-b02
          speaker: tom_fitzpatrick
          text: Well now, isn't that a wonder? The stonechats are singing very late in the season.
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: Tom crept forward on tiptoe to find out whether he had guessed right. The sound stopped. He peered sharply through the bushes and saw a brown pitcher tucked into a corner of the hedge. It was large enough to hold about a gallon and a half.
        - id: ch01-b04
          speaker: narrator
          text: Then a tiny old man appeared. A scrap of a cocked hat sat on top of his head, and a little leather apron hung in front of him. He pulled out a wooden stool and climbed onto it. With a small wooden cup, he dipped into the pitcher and set a full measure beside the stool. Then he sat down beneath the pitcher and began fixing a heel onto a brogue made to fit his own tiny foot.
        - id: ch01-b05
          speaker: tom_fitzpatrick
          text: By all the powers! I've often heard stories about Leprechauns, though to tell the truth, I never really believed them. But there is one, as real as can be. If I handle this wisely, my fortune is made. They say you must never take your eyes off one, or away he'll go.
    - id: ch02
      title: The Heather Beer
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Tom stole closer, never letting his gaze leave the little man. He watched him the way a cat watches a mouse. When he was near enough, Tom spoke.
        - id: ch02-b02
          speaker: tom_fitzpatrick
          text: God bless your work, neighbor.
        - id: ch02-b03
          speaker: narrator
          text: The little man looked up.
        - id: ch02-b04
          speaker: leprechaun
          text: Thank you kindly.
        - id: ch02-b05
          speaker: tom_fitzpatrick
          text: Should you be at work when everyone else is keeping the holiday?
        - id: ch02-b06
          speaker: leprechaun
          text: What I do with my time is no concern of yours.
        - id: ch02-b07
          speaker: tom_fitzpatrick
          text: Then do me one small courtesy. What's inside your pitcher?
        - id: ch02-b08
          speaker: leprechaun
          text: I'll gladly tell you. There's fine beer in it.
        - id: ch02-b09
          speaker: tom_fitzpatrick
          text: Beer? Thunder and fire! Where did you get that?
          emotion: surprised
        - id: ch02-b10
          speaker: leprechaun
          text: I didn't get it anywhere. I brewed it. Can you guess what I used?
        - id: ch02-b11
          speaker: tom_fitzpatrick
          text: I haven't the faintest idea. It must be malt, unless beer can be made from something else.
        - id: ch02-b12
          speaker: leprechaun
          text: Not this beer. Mine is brewed from heather.
        - id: ch02-b13
          speaker: narrator
          text: Tom burst out laughing.
        - id: ch02-b14
          speaker: tom_fitzpatrick
          text: Heather? Do you truly take me for such a fool?
        - id: ch02-b15
          speaker: leprechaun
          text: Suit yourself, but it's true all the same. Surely you've heard people speak of the Danes.
        - id: ch02-b16
          speaker: tom_fitzpatrick
          text: Of course I have. But what have the Danes got to do with your beer?
        - id: ch02-b17
          speaker: leprechaun
          text: When the Danes lived here, they taught us how to brew beer from heather. My family has kept the secret ever since.
        - id: ch02-b18
          speaker: tom_fitzpatrick
          text: How about giving me a little taste, then?
        - id: ch02-b19
          speaker: leprechaun
          text: Listen, young man. You ought to be minding your father's property instead of pestering decent, peaceful folk with silly questions. While you stand here wasting time, the cows have broken into the oats. They're trampling the corn everywhere.
    - id: ch03
      title: The Crock of Gold
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The news caught Tom so completely by surprise that he nearly turned to look. Just in time, he remembered the warning. Before the Leprechaun could try another trick, Tom snatched him up and held him tight in one hand. In his haste, though, he knocked over the pitcher. All the beer spilled away, so Tom never got to taste it or learn what kind of drink it really was.
        - id: ch03-b02
          speaker: narrator
          text: Tom swore he would kill the little man unless he showed him where his money was hidden. He looked so fierce and ready for blood that the Leprechaun was thoroughly frightened.
        - id: ch03-b03
          speaker: leprechaun
          text: Spare me and come along. Two fields from here, I'll lead you to a crock of gold.
          emotion: fearful
        - id: ch03-b04
          speaker: narrator
          text: Off they went. Tom kept the Leprechaun clenched in his hand and never once looked away from him. They crossed hedges and ditches, then struggled over a crooked stretch of bog. At last they reached a great field filled from end to end with boliauns. The Leprechaun pointed toward one large plant.
        - id: ch03-b05
          speaker: leprechaun
          text: Dig beneath that boliaun. You'll find a great crock there, filled with gold guineas.
    - id: ch04
      title: A Field of Red Garters
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: In all his hurry, Tom had never thought to bring a spade. He decided to run home for one. To make sure he could find the right spot again, he pulled off one of his red garters and tied it around the boliaun.
        - id: ch04-b02
          speaker: tom_fitzpatrick
          text: Swear that you won't take this garter off this boliaun.
        - id: ch04-b03
          speaker: narrator
          text: The Leprechaun immediately swore that he would not touch it. Then he addressed Tom with great politeness.
        - id: ch04-b04
          speaker: leprechaun
          text: That settles it, I believe. You won't be needing me any longer?
        - id: ch04-b05
          speaker: tom_fitzpatrick
          text: No, you're free to leave. God speed you, and good luck go with you wherever you wander.
        - id: ch04-b06
          speaker: leprechaun
          text: Good-bye, Tom Fitzpatrick. May you get plenty of good from the gold, once it's yours.
        - id: ch04-b07
          speaker: narrator
          text: Tom ran for dear life until he reached home and found a spade. Then he raced back toward the field of boliauns as fast as he could go.
        - id: ch04-b08
          speaker: narrator
          text: But when he arrived, what a sight met his eyes! Every boliaun in the whole field had a red garter tied around it, and every garter looked exactly like his own. Digging up the entire field was out of the question. It covered more than forty good Irish acres.
        - id: ch04-b09
          speaker: narrator
          text: So Tom went home again with the spade over his shoulder. He was much cooler now than when he had set out. And whenever he remembered the neat trick the Leprechaun had played on him, he gave the little fellow many a hearty curse.
