audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    connla:
      display_name: 康拉
      tts:
        delivery: 坦率真挚，内心渐渐被向往牵引
        timbre: 清朗年轻
        pace: 平稳，犹疑时稍慢
        pitch: 中高音
    fairy_maiden:
      display_name: 仙女
      tts:
        delivery: 从容笃定，带着遥远世界的召唤感
        timbre: 空灵明亮
        pace: 舒缓流畅
        pitch: 中高音
    king_conn:
      display_name: 康王
      tts:
        delivery: 威严果断，面对失子之惧时急切
        timbre: 浑厚沉稳
        pace: 稳健，焦急时加快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 乌斯纳高地上的来客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 赤发康拉是百战王康的儿子。一天，他陪父亲站在乌斯纳高地上，忽然看见一位衣着奇异的少女朝他走来。
        - id: ch01-b02
          speaker: connla
          text: 姑娘，你是从什么地方来的？
        - id: ch01-b03
          speaker: fairy_maiden
          text: 我来自永生平原。那里没有死亡，也没有罪恶。我们每天都在欢庆，快乐不需求助别人，也从不起争执。我们住在碧绿的圆丘里面，所以世人叫我们丘中仙族。
        - id: ch01-b04
          speaker: narrator
          text: 国王和随从只听见一个声音，却根本看不见说话的人，个个惊讶不已。原来除了康拉，谁也看不见那位仙女。
        - id: ch01-b05
          speaker: king_conn
          text: 儿子，你究竟在跟谁说话？
        - id: ch01-b06
          speaker: fairy_maiden
          text: 康拉在和一位青春美丽、永远不会衰老死亡的姑娘说话。我爱他，要带他去欢乐原野莫伊·梅尔。博阿达格永远统治那里。自他登上王位，那片土地再没有怨愤和悲伤。来吧，赤发康拉。你面庞红润如朝霞，肌肤泛着金褐色。仙人的王冠正等着装点你俊美的脸和高贵的身姿。跟我走吧，直到可怕的末日审判降临，你的美貌和青春也不会消逝。
        - id: ch01-b07
          speaker: narrator
          text: 国王听得见少女，却看不见她，心里顿时害怕起来。他高声呼唤自己的德鲁伊术士科兰。
        - id: ch01-b08
          speaker: king_conn
          text: 精通万般咒语和玄妙法术的科兰，快来帮我！这件事太难了，凭我的本领和智慧也无法应付。自从我夺得王位，再没有碰上过这么艰难的考验。一个看不见的少女要用法力夺走我亲爱又俊美的儿子。你若不相助，她的诱惑和巫术就会把他从你的国王身边带走。
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: 科兰走上前，对着声音传来的地方吟诵咒语。少女的声音消失了，康拉也再看不见她。可她在强大的咒法前隐去时，向康拉抛来一只苹果。
    - id: ch02
      title: 一个月后的召唤
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 接下来整整一个月，康拉除了那只苹果，什么也不吃，什么也不喝。奇怪的是，他每咬一口，苹果就重新长好，始终完完整整。他对那位少女的思念也一天比一天强烈。到了最后一天，康拉陪父王站在阿科明平原上，又看见少女朝自己走来。
        - id: ch02-b02
          speaker: fairy_maiden
          text: 康拉留在寿命短促、只等死期来临的凡人中间，地位确实十分显赫。可是生命之族，那些永生不死的人，如今都在恳求你，召唤你前往欢乐原野莫伊·梅尔。他们曾看见你在家中陪伴亲爱的人，早就认识你了。
        - id: ch02-b03
          speaker: narrator
          text: 康王又听见了少女的声音，立刻向手下高喊。
        - id: ch02-b04
          speaker: king_conn
          text: 快去把我的德鲁伊科兰叫来！她今天又有力量开口了。
        - id: ch02-b05
          speaker: fairy_maiden
          text: 威震四方、身经百战的康王啊，人们并不喜爱德鲁伊的法力。在那片住着许多正直之人的伟大国土上，它也得不到多少尊敬。等那律法降临，就会扫尽德鲁伊的魔咒，因为那些咒语出自虚伪的黑色恶魔之口。
        - id: ch02-b06
          speaker: narrator
          text: 这时康王才发现，少女出现以后，无论别人怎样跟儿子说话，康拉都一声不答。他便亲自问康拉。
        - id: ch02-b07
          speaker: king_conn
          text: 儿子，这女子说的这些话，合你的心意吗？
        - id: ch02-b08
          speaker: connla
          text: 这实在叫我为难。我爱自己的亲族，胜过世上的一切。可是……可是我控制不住自己，一心向往那位少女。
    - id: ch03
      title: 水晶舟驶向落日
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 少女听见康拉的回答，再次向他发出召唤。
        - id: ch03-b02
          speaker: fairy_maiden
          text: 大海再有力量，也比不上你心中汹涌的向往。跟我登上那叶晶莹闪亮、笔直滑行的水晶舟吧。我们很快就能抵达博阿达格的国度。灿烂的太阳正在下沉，不过路途虽远，我们还是能赶在天黑前到达。还有一片土地，也值得你远道前往。凡是寻找它的人，都会得到欢乐。那里只住着妇人和少女。你若愿意，我们就去找那片土地，从此两个人相伴，快活地生活在那里。
        - id: ch03-b03
          speaker: narrator
          text: 少女刚说完，赤发康拉便猛然离开众人，跳上那叶晶莹闪亮、笔直滑行的水晶舟。国王和满朝随从终于都看见了它。小舟越过明亮的海面，向落日滑去。它越去越远，越去越远，直到众人的眼睛再也望不见。康拉和仙女就这样从海上离去了。从此没有人再见过他们，也没有人知道他们到了哪里。
