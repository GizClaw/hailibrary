  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, legendary, and composed
        timbre: rich and clear
        pace: measured
        pitch: medium
    connla:
      display_name: Connla
      tts:
        delivery: youthful, earnest, and wondering
        timbre: bright and open
        pace: moderate
        pitch: medium
    fairy_maiden:
      display_name: Fairy Maiden
      tts:
        delivery: inviting, assured, and otherworldly
        timbre: luminous and smooth
        pace: unhurried
        pitch: medium-high
    conn:
      display_name: King Conn
      tts:
        delivery: commanding, protective, and grave
        timbre: deep and resonant
