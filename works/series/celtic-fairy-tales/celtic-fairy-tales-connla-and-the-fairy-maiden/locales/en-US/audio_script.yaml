  chapters:
    - id: ch01
      title: The Maiden on the Height of Usna
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Connla of the Fiery Hair was the son of Conn of the Hundred Fights. One day, Connla stood beside his father on the height of Usna. A maiden in strange clothing came toward him, though he alone could see her.
        - id: ch01-b02
          speaker: connla
          text: Where have you come from, maiden?
        - id: ch01-b03
          speaker: fairy_maiden
          text: I come from the Plains of the Ever Living, where there is no death and no sin. We celebrate forever. Our happiness needs no one's help, and there is no fighting in any of our pleasures. We make our homes inside the round green hills, so people call us the Hill Folk.
        - id: ch01-b04
          speaker: narrator
          text: The king and everyone with him heard her voice, yet they saw no one. They were filled with wonder, for only Connla could see the Fairy Maiden.
        - id: ch01-b05
          speaker: conn
          text: My son, who are you speaking to?
        - id: ch01-b06
          speaker: fairy_maiden
          text: Connla is speaking to a young and beautiful maiden who will never meet death or old age. I love him, and I have come to call him away to Moy Mell, the Plain of Pleasure. Boadag rules there forever, and since his reign began, no one in that land has known complaint or sorrow.
        - id: ch01-b07
          speaker: fairy_maiden
          text: Come with me, Connla of the Fiery Hair. Your tawny skin is ruddy as the dawn. A fairy crown is waiting to grace your handsome face and royal form. Come, and your beauty and youth will never fade, not until the last terrible day of judgment.
    - id: ch02
      title: Coran's Spell
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The king heard every word, though the maiden was still hidden from his eyes. Fear took hold of him, and he cried out for his Druid, Coran.
        - id: ch02-b02
          speaker: conn
          text: Coran, master of spells and cunning magic, I need your help. This trouble is beyond all my skill and wisdom. Nothing so difficult has faced me since I took the kingship. An unseen maiden has found us, and she means to use her power to steal away my dear and handsome son. If you do not help me, your king will lose him to her wiles and witchcraft.
          emotion: fearful
        - id: ch02-b03
          speaker: narrator
          text: Coran stepped forward. Facing the place where the maiden's voice had sounded, he began to chant his spells. At once her voice fell silent, and Connla could no longer see her. But just before the Druid's mighty spell made her vanish, she threw Connla an apple.
        - id: ch02-b04
          speaker: narrator
          text: For one whole month, Connla would eat and drink nothing except what came from that apple. Each time he ate from it, the fruit grew back and became whole again. And through all those days, his yearning for the maiden he had seen grew stronger and stronger.
    - id: ch03
      title: The Maiden Returns
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On the final day of that month, Connla was standing beside his father again, this time on the Plain of Arcomin. Once more he saw the maiden coming toward him, and once more she spoke.
        - id: ch03-b02
          speaker: fairy_maiden
          text: Connla may hold a glorious place among mortals, but their lives are short, and they must wait for death. Now the Folk of Life, the ever-living ones, ask you to come to Moy Mell, the Plain of Pleasure. They have come to know you by watching you here at home among those you love.
        - id: ch03-b03
          speaker: narrator
          text: King Conn heard the maiden's voice. He called loudly to his men.
        - id: ch03-b04
          speaker: conn
          text: Send for my Druid Coran at once! Today she has found the power to speak again.
        - id: ch03-b05
          speaker: fairy_maiden
          text: Mighty Conn, fighter of a hundred fights, the Druid's power is neither loved nor honored in that great land where so many upright people live. When the Law comes, it will sweep away the Druids' magic spells, for those spells come from the lips of the false black demon.
        - id: ch03-b06
          speaker: narrator
          text: Then the king noticed that ever since the maiden had returned, his son had answered no one who spoke to him. Conn turned to Connla.
        - id: ch03-b07
          speaker: conn
          text: My son, do you wish for what this woman is offering you?
        - id: ch03-b08
          speaker: connla
          text: This tears at me. I love my own people more than anything. But still... still I am overcome with longing for the maiden.
          emotion: sad
    - id: ch04
      title: The Crystal Canoe
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When the maiden heard Connla's answer, she spoke to him again.
        - id: ch04-b02
          speaker: fairy_maiden
          text: The ocean itself is not as strong as the waves of your longing. Come into my curragh, my gleaming crystal canoe that glides straight and swift. We can soon reach Boadag's realm. The bright sun is sinking far away, but we can be there before darkness falls.
        - id: ch04-b03
          speaker: fairy_maiden
          text: There is another land worth making the journey to, a joyful land for everyone who seeks it. Only wives and maidens live there. If you wish, we can go there and live alone together in happiness.
        - id: ch04-b04
          speaker: narrator
          text: As soon as the maiden stopped speaking, Connla of the Fiery Hair rushed away from his father and the others. He sprang into the curragh, the gleaming crystal canoe.
        - id: ch04-b05
          speaker: narrator
          text: Then the king and all his court saw the canoe glide over the bright sea toward the setting sun. Farther and farther it went, until no eye could see it anymore.
        - id: ch04-b06
          speaker: narrator
          text: Connla and the Fairy Maiden went on across the sea. They were never seen again, and no one ever knew where they had gone.
