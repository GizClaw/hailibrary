    mabon:
      display_name: 马邦
      tts:
        delivery: 困苦悲切，获救后显出坚韧勇猛
        timbre: 清亮有力
        pace: 中速
        pitch: 中音
    cow:
      display_name: 北不列颠的考乌
      tts:
        delivery: 冷峻利落，行事果决
        timbre: 粗沉坚实
        pace: 中速
        pitch: 低音
    goreu:
      display_name: 戈雷乌
      tts:
        delivery: 刚烈决绝，带着积压已久的仇恨
        timbre: 强硬低沉
        pace: 稍快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 命定的婚约
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 基利思国王的儿子基尔胡赫刚出生不久，母亲便去世了。临终前，她嘱咐国王，除非看见坟上长出一株开着两朵花的野蔷薇，否则千万不要续弦。从此，国王每天清早都派人去看。许多年以后，野蔷薇终于开了花，他便娶了多格德国王的遗孀。继母预言，基尔胡赫命中注定，只能娶一个名叫奥尔温的姑娘。父亲于是叫他去投奔表亲亚瑟王，请亚瑟王成全这门亲事。
        - id: ch01-b02
          speaker: narrator
          text: 基尔胡赫骑上一匹灰色骏马。马蹄像贝壳，辔头由金环相扣，马鞍也是金的。他手持两支银枪，枪头由百炼精钢制成，锋刃利得能割伤风，速度比六月清晨从芦叶尖落下的露珠还快。腿边的宝剑有金柄金身，嵌着一道十字，亮得像天边的闪电。两只白胸宽阔的斑纹灰犬戴着红宝石项圈，在马旁嬉戏。马蹄翻起的四块草皮，好似四只燕子绕着他飞。马背披着四角紫毯，每个角都缀着金苹果，就连马镫和蹄铁也是黄金做的。它一路走向亚瑟王的宫门，脚步轻得连草叶也没压弯。
        - id: ch01-b03
          speaker: narrator
          text: 亚瑟王以盛大的礼仪迎接他，请他留在宫中。年轻人却说，自己不是来享受酒肉的，而是来求国王赐下一份恩典。
        - id: ch01-b04
          speaker: arthur
          text: 既然你不肯留下，那么，酋长，只要愿望是你亲口说出的，我就答应。风吹得到的地方，雨润得到的地方，太阳走过、大海围住、大地伸展到的地方，全在我的誓言之内。只有我的船、披风、剑、长矛、盾牌、短剑，还有我的妻子桂妮薇，不能给你。
        - id: ch01-b05
          speaker: narrator
          text: 听过这番誓言，基尔胡赫说出了自己的请求。他要亚瑟王把伊斯巴达登·彭考尔的女儿奥尔温许配给他，还请求宫廷里的每一个人都来相助。这就是他远道而来的唯一心愿。
        - id: ch01-b06
          speaker: arthur
          text: 酋长，你说的姑娘和她的亲族，我从未听说。不过，我愿意派使者去找她。
        - id: ch01-b07
          speaker: culhwch
          text: 从今晚算起，我给你整整一年。
        - id: ch01-b08
          speaker: narrator
          text: 亚瑟王立刻派出使者，走遍治下各地。一年后，他们陆续回来，对奥尔温还是一无所知，和出发那天没有分别。
        - id: ch01-b09
          speaker: culhwch
          text: 别人都得到了所求的恩赐，只有我没有。我要走了，也把你的荣誉一并带走。
        - id: ch01-b10
          speaker: cai
          text: 莽撞的酋长！你竟敢责怪亚瑟王？跟我们来。在你承认世上没有这个姑娘，或是我们找到她以前，我们绝不会分开。
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: 凯伊说完便站了起来。他能在水下一口气待九天九夜，也能连续九天九夜不睡。他的剑伤了人，世上没有医生能够医治。只要愿意，他能长得和森林里最高的树一样高。他天生体热，任凭大雨倾盆，手里拿的东西靠近手掌的地方始终是干的。同伴冻得最厉害时，他的身体就像燃起的柴火，能替大家取暖。
        - id: ch01-b12
          speaker: narrator
          text: 亚瑟王又召来贝德维尔。凡是凯伊要去闯的险，他从不退缩，总会一起前往。整座岛上，论行动迅捷，只有亚瑟王和德里赫·艾尔·基布萨尔胜过他。他虽然只有一只手，上阵杀敌见血时，三个勇士加起来也不及他迅疾。他还有一项异能，一枪刺出的伤口，抵得上迎面九支长枪造成的伤势。
        - id: ch01-b13
          speaker: narrator
          text: 接着，亚瑟王命向导金塞利格随这位酋长出征。就算走进从未见过的地方，他也像走在故乡一样认路。格鲁希尔也被召来，因为他通晓天下所有语言。格瓦赫迈出门历险，从来不会空手而归。他既是最好的步战勇士，也是最好的骑士。他是亚瑟王姐姐的儿子，既是国王的外甥，也是基尔胡赫的表亲。门乌也加入了队伍。若众人到了蛮荒之地，他便能在大家身上施展魔法和幻术，让同伴看得见别人，别人却看不见他们。
    - id: ch02
      title: 奥尔温与三支毒镖
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一行人不停赶路，终于来到一片无边无际的旷野。他们望见远处有座巨大的城堡，美丽得世上无双。城堡看着虽在眼前，可他们走了一整天，直到夜里再看，竟像一点也没有靠近。第二天还是如此，直到第三天，众人才勉强抵达。堡前聚着一大群绵羊，浩浩荡荡，同样望不到尽头。他们向牧人说明来意。牧人听完，拼命劝他们回头，因为从前凡是为这件事来到这里的人，没有一个能活着离开。众人没有退缩，只送给他一枚金戒指。他拿回家交给妻子，也告诉了她客人的身份。
        - id: ch02-b02
          speaker: narrator
          text: 牧人回到家，把戒指交给妻子，也把来客是谁告诉了她。客人一走近，牧人的妻子便欢欢喜喜地跑出来迎接，伸手要搂住他们的脖子。凯伊猛地从柴堆抽出一根木柴，横在她两手之间。她用力一抱，木柴竟被挤成一团扭曲的木卷。要是抱住的是人，那双手会造成什么后果，谁都看得明白。
        - id: ch02-b03
          speaker: cai
          text: 夫人，你要这样抱我，往后可就没人会爱我了。这样的热情，真能要人的命。
        - id: ch02-b04
          speaker: narrator
          text: 众人进屋吃过饭。女人告诉他们，奥尔温姑娘每逢星期六都会来这里洗浴。他们郑重保证，绝不会伤害她，女人这才派人送信。奥尔温果然来了。她穿着火焰色的丝袍，颈间的赤金项圈镶满祖母绿和红宝石。她的头发比金雀花更灿烂，皮肤比浪花的泡沫更白。她的手和手指，比草甸泉水飞沫间盛开的银莲花更秀美。她的目光比鹰隼明亮，胸膛比白天鹅洁白，双颊比最红的玫瑰还鲜艳。无论是谁见到她，心里都会生出爱慕。她每走一步，足边便冒出四片白色三叶草，所以人们叫她奥尔温。
        - id: ch02-b05
          speaker: narrator
          text: 基尔胡赫同她并肩坐在长凳上，诉说自己的爱情。
        - id: ch02-b06
          speaker: olwen
          text: 我父亲无论提出什么条件，你都一一做到，就能娶我。
        - id: ch02-b07
          speaker: narrator
          text: 他们一同登上城堡，向她父亲说明来意。
        - id: ch02-b08
          speaker: ysbaddaden
          text: 我的眉毛垂下来，把眼睛遮住了。拿叉子撑起眉毛，让我看看未来的女婿长什么样。
        - id: ch02-b09
          speaker: narrator
          text: 众人照办。他说要到明天才答复。可众人刚转身，他便抓起身旁三支毒镖中的一支，朝他们背后掷去。贝德维尔接住毒镖，反手掷回，正中他的膝盖。
        - id: ch02-b10
          speaker: ysbaddaden
          text: 该诅咒的粗野女婿！因为你的无礼，我这辈子走路都要更艰难了。这毒铁刺得像牛虻在咬。打造它的铁匠该受诅咒，锻造它的铁砧也该受诅咒！
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: 骑士们回到牧人库斯滕宁家歇息。第二天黎明，他们再到城堡重提婚事。伊斯巴达登说，自己得先和奥尔温的四位曾祖母、四位曾祖父商议。骑士们又一次告退。他拿起第二支毒镖，从背后掷来。门乌接住毒镖，又掷了回去。毒镖穿透他的胸口，从后腰钻出。
        - id: ch02-b12
          speaker: ysbaddaden
          text: 该诅咒的粗野女婿！这硬铁刺得像水蛭在咬。烧红它的炉膛该受诅咒！从今以后，我每逢上坡，都要气短胸痛。
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 第三天，骑士们再次来到宫殿。伊斯巴达登掷出最后一支毒镖。基尔胡赫一把接住，用尽力气投了回去。毒镖穿透伊斯巴达登的眼球，从后脑钻了出来。
        - id: ch02-b14
          speaker: ysbaddaden
          text: 该诅咒的粗野女婿！只要我活着，这只眼睛就再也好不了。迎风走路时，我会不停流泪。每逢新月，说不定还会头脑发热、天旋地转。铸造它的炉火该受诅咒！这毒铁打在身上，就像疯狗咬了一口。
          emotion: angry
    - id: ch03
      title: 艰难的聘礼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 后来，众人一同去用饭。伊斯巴达登开口问基尔胡赫。
        - id: ch03-b02
          speaker: ysbaddaden
          text: 想娶我女儿的人，就是你吗？
        - id: ch03-b03
          speaker: culhwch
          text: 就是我。
        - id: ch03-b04
          speaker: ysbaddaden
          text: 那你得保证公平待我。等我要的东西全部送到，我就把女儿给你。
        - id: ch03-b05
          speaker: culhwch
          text: 我答应。你想要什么，只管说。
        - id: ch03-b06
          speaker: ysbaddaden
          text: 那我就说了。我的头发又粗又硬，天下的梳子和剪刀都不能梳理。只有塔雷德王子之子图尔赫·特鲁伊斯双耳之间的梳子和剪刀才行。他不会自愿交出，你也不可能逼他交出。
        - id: ch03-b07
          speaker: culhwch
          text: 这在你看来很难，对我却不难。
        - id: ch03-b08
          speaker: ysbaddaden
          text: 就算拿到了它们，还有一样你得不到。没有埃里之子格雷德的猎犬德鲁德温，就猎不到图尔赫·特鲁伊斯。而天下只有莫德伦之子马邦能带这条狗行猎。马邦出生才三夜，就从母亲身边被夺走。如今他在哪里，是死是活，谁也不知道。
        - id: ch03-b09
          speaker: culhwch
          text: 这在你看来很难，对我却不难。
        - id: ch03-b10
          speaker: ysbaddaden
          text: 即使得到猎犬，你还是找不到马邦。除非先找到他的血亲、埃尔之子埃多埃尔，否则一切都是白费。埃多埃尔是他的表亲。
        - id: ch03-b11
          speaker: culhwch
          text: 这在你看来很难，对我却不难。我会有骏马和许多骑士。我的主君兼亲族亚瑟王，会替我取得这一切。我一定娶到你的女儿，而你一定丢掉性命。
        - id: ch03-b12
          speaker: ysbaddaden
          text: 去吧。你寻找这些东西时，我女儿的衣食用不着你负担。等所有奇事都办成，你便可以娶她。
    - id: ch04
      title: 寻找马邦
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 众人回去，把经过禀告亚瑟王。
        - id: ch04-b02
          speaker: arthur
          text: 这些奇物之中，我们先找哪一样最好？
        - id: ch04-b03
          speakers: [retinue, retinue_2]
          ensemble: duo
          text: 最好先找莫德伦之子马邦。可要找到他，得先找到他的血亲埃尔之子埃多埃尔。
        - id: ch04-b04
          speaker: narrator
          text: 亚瑟王随即起身，率领不列颠群岛的勇士一同寻找埃多埃尔。他们走过很长的路，一路查问他的下落，最后来到格利维的城堡前。埃多埃尔就被囚禁在这座堡垒里。众勇士在城堡下停住，格利维则站在高高的堡顶，望着下方的大军，高声询问亚瑟王的来意。
        - id: ch04-b05
          speaker: gwythyr
          text: 亚瑟，你来向我索要什么？我的堡垒已经一无所有。这里没有欢喜，没有快乐，连小麦和燕麦也没有。
        - id: ch04-b06
          speaker: arthur
          text: 我不是来伤害你的。我只要找关在这里的囚徒。
        - id: ch04-b07
          speaker: gwythyr
          text: 我把囚徒交给你。我原以为无论谁来索要，都绝不会放人。如今我不但放他，还愿意支持你、帮助你。
        - id: ch04-b08
          speaker: retinue
          text: 主君，请回去吧。这样小小的历险，不值得您带着整支大军继续奔波。
        - id: ch04-b09
          speaker: arthur
          text: 格鲁希尔，这趟寻找最适合由你前往。天下的语言你全都明白，连飞禽走兽的话也听得懂。埃多埃尔，你也跟我的人去找表亲。凯伊、贝德维尔，无论面对什么险境，我都相信你们会成功。替我完成这次历险。
        - id: ch04-b10
          speaker: narrator
          text: 他们继续上路，先去见基尔格里的乌鸫。
        - id: ch04-b11
          speaker: gwrhyr
          text: 我以苍天之名恳求你。莫德伦之子马邦出生才三夜，就在母亲与墙壁之间被人夺走。你知道他的消息吗？请告诉我。
        - id: ch04-b12
          speaker: blackbird
          text: 我刚来这里时，地上放着一方铁匠的铁砧，那时我还是幼鸟。从此再没人用它打铁，只有我每天傍晚拿喙啄它。如今，铁砧连榛子大的一块都没剩下。经过这么漫长的岁月，如果我听说过你们寻找的人，就让苍天惩罚我。不过，有一族动物比我更早出生，我可以带你们去见它们。
        - id: ch04-b13
          speaker: narrator
          text: 于是，他们来到雷丁弗里的雄鹿面前。
        - id: ch04-b14
          speaker: gwrhyr
          text: 雷丁弗里的雄鹿，我们奉亚瑟王之命来见你。我们从没听说还有哪只动物比你年长。你知道马邦在哪里吗？
        - id: ch04-b15
          speaker: stag
          text: 我初来时，四周只是一片平原，地上除了一株橡树幼苗，什么树也没有。幼苗后来长成百枝伸展的大橡树，如今连大树也死了，只剩一截枯桩。从那时到今天，我一直住在这里，却从没听说过你们找的人。不过，我能带你们去见一只比我出生更早的动物。
        - id: ch04-b16
          speaker: narrator
          text: 他们又来到库姆·考尔维德的猫头鹰那里，向它打听马邦。
        - id: ch04-b17
          speaker: owl
          text: 我要是知道，自然会告诉你们。我刚到这里时，眼前这片大山谷还是树木茂密的峡谷。后来有人把树连根拔光，那里又长起第二片森林，而今已经是第三片了。看看我的翅膀，不也衰朽得像两截枯桩吗？经过这一切岁月，我从没听说过那个人。不过，我愿为亚瑟王的使团带路，去见世上最年长、游历最多的动物，格温·阿布伊的鹰。
    - id: ch05
      title: 最古老的动物
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 众人来到鹰的面前，格鲁希尔又问了同样的问题。
        - id: ch05-b02
          speaker: eagle
          text: 我在这里度过的岁月极其漫长。初来时，此地有一块巨岩。每天傍晚，我都站在岩顶啄击星辰。年复一年，那块巨岩被磨得越来越小，如今还不到一拃高。从那时直到今天，我从未听说过你们找的人。只有一回，我为了觅食，一直飞到林·利乌，一爪抓住一条鲑鱼，以为它足够我吃上很久。谁知它反而把我拖进深水，我拼尽全身力气才逃掉。后来，我召集全族去攻打它，想把它除掉。它先派使者来讲和，又亲自前来，请我从它背上拔掉五十支鱼叉。要是连它也不知道消息，我就想不出还有谁知道。我可以带你们去见它。
        - id: ch05-b03
          speaker: narrator
          text: 他们一同前往林·利乌。鹰向鲑鱼发问。
        - id: ch05-b04
          speaker: eagle
          text: 林·利乌的鲑鱼，我奉亚瑟王之命问你。莫德伦之子马邦出生才三夜，就在母亲与墙壁之间被人夺走。你知道他的消息吗？
        - id: ch05-b05
          speaker: salmon
          text: 我知道多少，就告诉你们多少。每次潮水上涨，我都会溯河而上，游到格洛斯特的城墙附近。我在那里受过一种苦，别处从没有过。要想知道我说的是真话，你们派一个人坐上我的一边肩头，再派一人坐上另一边。
        - id: ch05-b06
          speaker: narrator
          text: 凯伊和格鲁希尔坐上鲑鱼的双肩。鲑鱼载着他们一路前行，来到监牢的墙下。他们听见地牢里传来响亮的哀号和哭声。
        - id: ch05-b07
          speaker: gwrhyr
          text: 是谁在这座石屋里哭？
        - id: ch05-b08
          speaker: mabon
          text: 唉，是我，莫德伦之子马邦！我被关在这里！
          emotion: sad
        - id: ch05-b09
          speaker: narrator
          text: 他们立刻返回，把听见的声音和监牢所在之处全都告诉亚瑟王。亚瑟王召集勇士，向城堡发动进攻。战斗打得正激烈时，凯伊和贝德维尔再次坐上鲑鱼的双肩，由它载到监牢墙下。两人趁着大战闯进地牢，终于把莫德伦之子马邦救了出来。
    - id: ch06
      title: 猎取野猪的宝物
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 马邦获救以后，亚瑟王召来不列颠三座岛屿和邻近三岛的全部勇士，带领他们远赴爱尔兰的埃斯盖尔·奥克维尔。野猪图尔赫和七只小猪就在那里。猎犬从四面八方向它们扑去，野猪却一路横冲直撞，毁掉了爱尔兰五分之一的土地，随后渡海逃往威尔士。亚瑟王带着军队、骏马和猎犬在后面紧追不放。图尔赫不时停下来抵抗，杀死亚瑟王麾下许多勇士。亚瑟王追着它走遍威尔士各地，七只小猪也在漫长的围猎中一只接一只被杀。
        - id: ch06-b02
          speaker: narrator
          text: 最后，图尔赫想渡过塞文河，逃进康沃尔。莫德伦之子马邦紧紧追上，亚瑟王也率领不列颠的勇士一同猛攻。马邦从一侧催马上前，靠近野猪，从它身上夺下剃刀。凯伊从另一侧赶到，抢走了剪刀。可众人还没来得及取得梳子，野猪的四蹄已经重新踏稳地面。它一登上河岸，猎犬、勇士和骏马便没有一个能再追上，只能任它一路逃进康沃尔。
        - id: ch06-b03
          speaker: narrator
          text: 亚瑟王和大军循着野猪留下的足迹，一路追进康沃尔，终于又赶上了它。先前经历的种种艰险已经够苦了，可跟这场争夺梳子的恶战相比，不过像孩子的游戏。猎犬、勇士和骏马全都投入战斗，众人到底从图尔赫身上夺得了梳子，又合力把这头野猪赶进深海。从那一天以后，再也没有人知道它去了哪里。
    - id: ch07
      title: 基尔胡赫迎娶奥尔温
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 奇物全部到手，基尔胡赫随即动身。凡是对伊斯巴达登·彭考尔心怀敌意的人，都与他一同前往。他们带着历尽艰险取得的梳子、剪刀和其他奇物，回到伊斯巴达登的宫廷。北不列颠的考乌走上前，动手替他梳理粗硬的头发。他从一只耳朵剃到另一只耳朵，把胡须、皮肤和血肉都剃得干干净净，一直露出白骨。
        - id: ch07-b02
          speaker: culhwch
          text: 你剃干净了吗？
        - id: ch07-b03
          speaker: cow
          text: 剃干净了。
        - id: ch07-b04
          speaker: culhwch
          text: 那么，你的女儿现在归我了吗？
        - id: ch07-b05
          speaker: ysbaddaden
          text: 她归你了。可你不必谢我，该去感谢替你办成这一切的亚瑟王。若能由我作主，你永远也得不到她。女儿一旦离开我，我的命也就没了。
        - id: ch07-b06
          speaker: narrator
          text: 牧人库斯滕宁的儿子戈雷乌揪住伊斯巴达登的头发，把他拖到城堡主楼，砍下脑袋，插在城堡高处的尖桩上。
        - id: ch07-b07
          speaker: narrator
          text: 伊斯巴达登死后，这场漫长的历险终于结束。亚瑟王的大军随即四散而去，勇士们也各自踏上归途，回到自己的故乡。
        - id: ch07-b08
          speaker: narrator
          text: 就这样，凯利松之子基尔胡赫终于娶得伊斯巴达登·彭考尔之女奥尔温为妻。
