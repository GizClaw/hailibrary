  chapters:
    - id: ch01
      title: The Boon of Arthur
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Soon after Kilhuch, son of King Kilyth, was born, his mother died. Before she died, she made the king promise that he would not marry again until he saw a briar with two blossoms growing upon her grave. Every morning, Kilyth sent someone to see whether anything had begun to grow there. The grave remained bare for many years. At last the flowering briar appeared, and only then did Kilyth take another wife. She was the widow of King Doged.
        - id: ch01-b02
          speaker: narrator
          text: The new queen foretold that her stepson Kilhuch would marry a maiden named Olwen, and no one else. At his father's command, Kilhuch rode to the court of his cousin, King Arthur, to ask for her hand as a boon.
        - id: ch01-b03
          speaker: narrator
          text: He rode a gray horse whose hoofs were shaped like shells. Its bridle was made of linked gold, and its saddle was gold as well. In his hand, Kilhuch carried two finely tempered silver spears. Their heads were steel, their edges sharp enough to wound the wind and draw blood. They were swifter than a drop of dew falling from reed grass when the June dew lies at its heaviest. At his thigh hung a gold-hilted sword with a golden blade. A cross the color of lightning in the heavens was laid into it.
        - id: ch01-b04
          speaker: narrator
          text: Two brindled greyhounds bounded around him. Their breasts were white, and strong collars of rubies circled their necks. As the courser ran, its four hoofs tossed four clods into the air, and the clods flew around Kilhuch's head like four swallows. A four-cornered cloth of purple lay across the horse, with a golden apple hanging at each corner. Precious gold covered the stirrups and the shoes. Yet the courser stepped so lightly that not even a blade of grass bent beneath it as Kilhuch rode toward the gate of Arthur's palace.
        - id: ch01-b05
          speaker: narrator
          text: Arthur welcomed him with great ceremony and invited him to stay. Kilhuch answered that he had not come to eat and drink. He had come to ask the king for a boon.
        - id: ch01-b06
          speaker: arthur
          text: If you will not stay, chieftain, then name your boon. I will grant anything within the reach of wind, rain, sun, sea, and earth. Only my ships, my mantle, my weapons, and my wife Guinevere are not mine to give.
        - id: ch01-b07
          speaker: narrator
          text: Kilhuch asked for Olwen, daughter of Yspathaden Penkawr, and for the help of Arthur's whole court.
        - id: ch01-b08
          speaker: arthur
          text: Chieftain, I have never heard of this maiden or her family. Still, I will gladly send messengers to search for her.
        - id: ch01-b09
          speaker: kilhuch
          text: I will give you from tonight until the same night one year from now.
        - id: ch01-b10
          speaker: narrator
          text: Arthur sent messengers through every land he ruled. At the end of the year, they returned knowing no more about Olwen than they had on the first day.
        - id: ch01-b11
          speaker: kilhuch
          text: Everyone else has received his boon, but I still lack mine. I will leave now, and your honor will leave with me.
        - id: ch01-b12
          speaker: kay
          text: Reckless chieftain, would you shame Arthur? Come with us. We will stay beside you until you admit that no such maiden lives, or until we win her for you.
        - id: ch01-b13
          speaker: narrator
          text: At that, Kay rose. He had strange powers of his own. His breath could last for nine nights and nine days beneath the water, and he could live for nine nights and nine days without sleep. No physician could heal a wound made by Kay's sword. He was subtle and clever. Whenever he chose, he could make himself as tall as the tallest tree in the forest. Great heat lived in his body. In the hardest rain, whatever he held stayed dry for a handbreadth above and below his hand. And when his companions were coldest, that same heat gave them fuel enough to light their fire.
        - id: ch01-b14
          speaker: narrator
          text: Arthur next called Bedwyr. He never drew back from any undertaking that Kay had joined. Across the whole island, only Arthur himself and Drych Ail Kibthar could match Bedwyr's speed. Bedwyr had only one hand, yet on a field of battle, three warriors together could not shed blood faster than he could. His lance held a power of its own. A wound from that single weapon was equal to the wounds of nine enemy lances.
        - id: ch01-b15
          speaker: narrator
          text: Arthur called Kynthelig and ordered him to guide the chieftain. Kynthelig knew his way through a land he had never seen as surely as through his own country. Arthur also called Gwrhyr Gwalstawt Ieithoedd because he understood every tongue. Then he called Gwalchmai, son of Gwyar. Gwalchmai never returned home without achieving the adventure he had gone to seek. He was the finest knight and the finest man on foot. He was also Arthur's nephew, the son of Arthur's sister, and Kilhuch's cousin. Last, Arthur called Menw son of Teirgwaeth. If they entered a savage country, Menw could cast a charm over the company. They would see everyone around them, but no one would see them.
    - id: ch02
      title: Olwen and Her Father
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The company traveled until they reached a vast open plain. Far across it, they saw a great castle, the fairest castle in the world. Yet it stood at such a distance that after they had ridden all day, it looked no nearer than before. They journeyed on through another day and barely reached it on the third. Before the castle walls, they found an enormous flock of sheep. It stretched so far in every direction that no one could see where it ended.
        - id: ch02-b02
          speaker: narrator
          text: The travelers found the herdsman who watched the sheep and told him why they had come. He tried to persuade them to abandon their quest. Many had come to that place in search of Olwen, he warned them, and not one of those seekers had ever returned alive. The company would not turn aside. Instead, they gave the herdsman a golden ring. He carried it to his wife and told her the names of the visitors waiting outside.
        - id: ch02-b03
          speaker: narrator
          text: His wife ran out joyfully and reached to embrace them. Kay snatched a log from the woodpile and set it between her hands. She squeezed until the solid wood twisted into a coil.
        - id: ch02-b04
          speaker: kay
          text: Woman, if you had squeezed me like that, no one could ever have loved me afterward. That would have been a cruel welcome indeed.
        - id: ch02-b05
          speaker: narrator
          text: Inside the house, after they had eaten, she told them that Olwen came there every Saturday to wash. The travelers promised they would do her no harm, and a message was sent.
        - id: ch02-b06
          speaker: narrator
          text: Olwen came in a robe of flame-colored silk. Around her neck was a collar of red gold set with emeralds and rubies. Her hair was more golden than the flower of the broom, and her skin was whiter than foam on the waves. Her hands and fingers were fairer than wood anemones growing in the spray beside a meadow spring. Her eyes shone brighter than a falcon's. Her breast was whiter than the breast of a white swan, and her cheek was redder than the reddest rose. Whoever looked upon her was filled with love. Four white trefoils sprang from the earth wherever she walked. That was why she bore the name Olwen.
        - id: ch02-b07
          speaker: narrator
          text: Kilhuch sat beside her on a bench and told her of his love.
        - id: ch02-b08
          speaker: olwen
          text: You may win me for your bride, but first you must promise to do whatever my father asks.
        - id: ch02-b09
          speaker: narrator
          text: So they climbed to the castle and made their request before Yspathaden Penkawr.
        - id: ch02-b10
          speaker: yspathaden
          text: Lift the forks beneath my eyebrows. They have fallen across my eyes, and I want to see what sort of son-in-law stands before me.
        - id: ch02-b11
          speaker: narrator
          text: The visitors took hold of the forks and raised his heavy eyebrows away from his eyes. Yspathaden looked upon Kilhuch, then promised to give them his answer the following morning. The company turned and began to leave the castle. As they went, Yspathaden reached for one of the three poisoned darts lying beside him. He seized it and hurled it at their backs. Bedwyr spun around, caught the dart, and flung it straight back. It struck Yspathaden deep in the knee.
        - id: ch02-b12
          speaker: yspathaden
          text: A cursed, ill-mannered son-in-law! I will always walk worse because of you. This poisoned iron stings like a gadfly. Curse the smith who made it, and the anvil it was forged upon!
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: The knights slept at the herdsman's house. At dawn, they returned to the castle and asked again.
        - id: ch02-b14
          speaker: yspathaden
          text: I must consult Olwen's four great-grandmothers and her four great-grandfathers.
        - id: ch02-b15
          speaker: narrator
          text: The knights turned away from him a second time. As they walked out, Yspathaden snatched up the second poisoned dart and cast it after them. Menw saw it coming. He caught the dart in its flight and hurled it back at Yspathaden. The iron pierced the giant's breast, passed through his body, and came out at the small of his back.
        - id: ch02-b16
          speaker: yspathaden
          text: A cursed, ill-mannered son-in-law! This hard iron bites like a horse leech. Curse the hearth that heated it! Now I will lose my breath on every hill, and my chest will always ache.
          emotion: angry
        - id: ch02-b17
          speaker: narrator
          text: On the third day, the knights returned to the palace once more and stood before Yspathaden. Once again, he gave them no easy answer. As they went away, he took the third and final poisoned dart and threw it at them. This time Kilhuch caught the weapon himself. He hurled it back with all his strength. The dart struck Yspathaden through the eyeball and drove on until its point came out at the back of his head.
        - id: ch02-b18
          speaker: yspathaden
          text: A cursed, ill-mannered son-in-law! My sight will be worse as long as I live. The wind will make my eyes water, and every new moon may bring a burning head and dizziness. Curse the fire that forged this iron! Its stroke is like the bite of a mad dog.
          emotion: angry
        - id: ch02-b19
          speaker: narrator
          text: Then they went in to eat.
    - id: ch03
      title: The Impossible Tasks
      blocks:
        - id: ch03-b01
          speaker: yspathaden
          text: Are you the man who seeks my daughter?
        - id: ch03-b02
          speaker: kilhuch
          text: I am.
        - id: ch03-b03
          speaker: yspathaden
          text: Pledge that you will treat me justly. When you bring me everything I name, you may have my daughter.
        - id: ch03-b04
          speaker: kilhuch
          text: I give that promise freely. Name what you require.
        - id: ch03-b05
          speaker: yspathaden
          text: No comb or scissors in the world can order my coarse hair except those carried between the ears of Turch Truith, son of Prince Tared. He will never give them willingly, and you cannot force him.
        - id: ch03-b06
          speaker: kilhuch
          text: You may think it impossible, but I will accomplish it.
        - id: ch03-b07
          speaker: yspathaden
          text: Even if you do, you cannot hunt Turch Truith without Drudwyn, the hound of Greid son of Eri. And only one huntsman in the world can hunt with that dog. He is Mabon, son of Modron. Someone took him from his mother when he was three nights old. No one knows where he is, or whether he lives.
        - id: ch03-b08
          speaker: kilhuch
          text: You may think it impossible, but I will accomplish it.
        - id: ch03-b09
          speaker: yspathaden
          text: Even then, you will never find Mabon unless you first find his blood kinsman Eidoel, son of Aer. Without his cousin, the search would be useless.
        - id: ch03-b10
          speaker: kilhuch
          text: You may think it impossible, but I will accomplish it. I will have horses and warriors, and my lord and kinsman Arthur will win all these things for me. I will gain your daughter, and you will lose your life.
        - id: ch03-b11
          speaker: yspathaden
          text: Then go. While you seek these marvels, you will owe me nothing for my daughter's food or clothing. Complete them all, and she will be your wife.
        - id: ch03-b12
          speaker: narrator
          text: When the company told Arthur what had happened, he asked which marvel they should seek first.
        - id: ch03-b13
          speakers: [kay, bedwyr, gwrhyr, menw]
          ensemble: chorus
          text: We should seek Mabon son of Modron first. To find him, we must begin with his kinsman Eidoel son of Aer.
        - id: ch03-b14
          speaker: narrator
          text: Arthur rose with the warriors of the Islands of Britain. They traveled to Glivi's castle, where Eidoel was held prisoner. Glivi stood high on the fortress wall and called down.
        - id: ch03-b15
          speaker: glivi
          text: Arthur, what do you want from me? Nothing is left in this fortress. There is no joy here, no pleasure, not even wheat or oats.
        - id: ch03-b16
          speaker: arthur
          text: I did not come to harm you. I came for the prisoner you are holding.
        - id: ch03-b17
          speaker: glivi
          text: I never thought I would surrender him to anyone, but I will give him to you. You shall have my support and help as well.
        - id: ch03-b18
          speakers: [kay, bedwyr, gwrhyr, menw]
          ensemble: chorus
          text: Lord, return home. You should not lead your whole army on adventures as small as these.
        - id: ch03-b19
          speaker: arthur
          text: Gwrhyr, you know every language, even those of birds and beasts. You should lead this search. Eidoel, go with my men and seek your cousin. Kay and Bedwyr, I trust that you will finish any adventure you undertake. Complete this one for me.
    - id: ch04
      title: The Oldest Creatures
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The searchers went on until they found the Ousel of Cilgwri. Gwrhyr appealed to her in Heaven's name.
        - id: ch04-b02
          speaker: gwrhyr
          text: Tell me, do you know anything of Mabon son of Modron? He was taken from between his mother and the wall when he was only three nights old.
        - id: ch04-b03
          speaker: ousel
          text: When I first came here, I was a young bird, and a smith's anvil stood in this place. No tool has touched it since. Each evening I have pecked it once, and now less than a nut remains. Yet in all that time, Heaven knows, I have never heard of the man you seek. There are creatures older than I am, though. I will guide you to them.
        - id: ch04-b04
          speaker: narrator
          text: She led them to the Stag of Redynvre.
        - id: ch04-b05
          speaker: gwrhyr
          text: Stag of Redynvre, we come as messengers from Arthur. We have heard of no animal older than you. Do you know anything of Mabon?
        - id: ch04-b06
          speaker: stag
          text: When I first came here, a bare plain stretched around me. One young oak stood upon it. The tree grew until it had a hundred branches, and then it died. Nothing is left but a withered stump. I have been here all that time, yet I have never heard of the man you seek. But I know a creature older than I am, and I will lead you to him.
        - id: ch04-b07
          speaker: narrator
          text: The stag brought them to the Owl of Cwm Cawlwyd, and they asked him about Mabon.
        - id: ch04-b08
          speaker: owl
          text: If I knew, I would tell you. When I first came, this wide valley was a wooded glen. Men rooted out every tree. Another forest grew, and the forest here now is the third. Look at my wings. They are withered stumps. Through all those years, even to this day, I have never heard of Mabon. Still, I will guide Arthur's messengers to the oldest creature in the world, the one who has traveled farthest. He is the Eagle of Gwern Abwy.
        - id: ch04-b09
          speaker: narrator
          text: Gwrhyr asked the eagle the same question.
        - id: ch04-b10
          speaker: eagle
          text: I have lived here a very long time. When I arrived, a rock rose so high that I pecked at the stars from its top each evening. Now that rock stands less than a handspan tall. In all those years, I heard of Mabon only once.
        - id: ch04-b11
          speaker: eagle
          text: I had flown to Llyn Llyw in search of food. I sank my talons into a salmon that I thought would feed me for a long while, but he dragged me into the deep, and I barely escaped. My whole kindred came back with me to destroy him. Instead, he sent messengers, made peace, and begged me to pull fifty fish spears from his back. If that salmon knows nothing of the man you seek, then I know no one else who might. I will take you to him.
    - id: ch05
      title: Mabon in the House of Stone
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The eagle led them to Llyn Llyw and called to the salmon.
        - id: ch05-b02
          speaker: eagle
          text: Salmon of Llyn Llyw, I bring messengers from Arthur. Do you know anything of Mabon son of Modron, who was taken from between his mother and the wall when he was three nights old?
        - id: ch05-b03
          speaker: salmon
          text: I will tell you what I know. With every tide, I swim upriver as far as the walls of Gloucester. There I have found a wrong unlike any I have found elsewhere. If you want proof, let one of you ride on each of my shoulders.
        - id: ch05-b04
          speaker: narrator
          text: Kay and Gwrhyr climbed onto the salmon's shoulders. He carried them to the prison wall, where they heard loud weeping and sorrow from a dungeon.
        - id: ch05-b05
          speaker: gwrhyr
          text: Who is weeping inside this house of stone?
        - id: ch05-b06
          speaker: mabon
          text: Alas, I am Mabon son of Modron, and I am imprisoned here!
          emotion: sad
        - id: ch05-b07
          speaker: narrator
          text: They returned and told Arthur. He gathered his warriors and attacked the castle. While the battle raged, Kay and Bedwyr rode on the salmon's shoulders, broke into the dungeon, and carried Mabon away.
    - id: ch06
      title: The Hunt of Turch Truith
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Then Arthur summoned every warrior in the three islands of Britain and the three neighboring islands. He marched to Esgeir Ocrvel in Ireland, where the Boar Truith lived with his seven young pigs. The hunting dogs were loosed from every side.
        - id: ch06-b02
          speaker: narrator
          text: The Boar Truith tore across Ireland, laying waste to a fifth of the whole country. Then he left the land behind and plunged through the sea toward Wales. Arthur and all his hosts followed hard after him. Their horses and their hunting dogs followed too. Now and again, the great boar stopped his flight, turned upon his pursuers, and made a stand. Each time he fought, more of Arthur's champions were killed. Still Arthur hunted him onward through every part of Wales. As the chase crossed the country, the boar's seven young pigs were killed one after another.
        - id: ch06-b03
          speaker: narrator
          text: At last the boar reached the Severn. He meant to cross the water and escape into Cornwall, but Mabon son of Modron caught up with him there. Arthur and the champions of Britain fell upon the boar together. Mabon drove his spurs into his horse and rushed in from one side. He reached the boar and snatched away the razor. At that same moment, Kay came against him from the other side and took the scissors.
        - id: ch06-b04
          speaker: narrator
          text: Before they could take the comb, the boar found his footing and reached the shore. From then on, no dog, man, or horse could catch him until he reached Cornwall. Arthur and his hosts followed his tracks and overtook him there.
        - id: ch06-b05
          speaker: narrator
          text: Arthur and his warriors followed the boar's trail until they caught him in Cornwall. Their earlier hardships had been cruel, but those troubles seemed like child's play beside the battle to take the comb from between his ears. The struggle was long and hard. In the end, though, the champions won the comb. Then they hunted the Boar Truith onward and drove him out into the deep sea. He vanished into the water, and from that time forward, no one ever knew where he had gone.
        - id: ch06-b06
          speaker: narrator
          text: Kilhuch set out with all who wished Yspathaden harm. They carried the marvels to his court. Kaw of North Britain came forward and shaved Yspathaden's beard, skin, and flesh clean to the bone from ear to ear.
        - id: ch06-b07
          speaker: kilhuch
          text: Are you shaved now?
        - id: ch06-b08
          speaker: yspathaden
          text: I am shaved.
        - id: ch06-b09
          speaker: kilhuch
          text: Then is your daughter mine?
        - id: ch06-b10
          speaker: yspathaden
          text: She is yours, but do not thank me. Thank Arthur, who accomplished this for you. I would never have given her freely, for when I lose her, I lose my life.
        - id: ch06-b11
          speaker: narrator
          text: Goreu son of Custennin seized Yspathaden by the hair and dragged him to the keep. There he cut off Yspathaden's head and set it on a stake above the citadel.
        - id: ch06-b12
          speaker: narrator
          text: After that, Arthur's warriors scattered, each returning to his own country.
        - id: ch06-b13
          speaker: narrator
          text: And so Kilhuch, son of Kelython, won Olwen, daughter of Yspathaden Penkawr, for his wife.
