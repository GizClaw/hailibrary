audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    widow:
      display_name: 寡妇
      tts:
        delivery: 朴实爽直，责备里带着母亲的亲近
        timbre: 温厚而略显疲惫
        pace: 中速
        pitch: 中音
    tom:
      display_name: 汤姆
      tts:
        delivery: 豪爽无畏，机敏中带着乡野青年的幽默
        timbre: 洪亮结实
        pace: 中速
        pitch: 中低音
    giant:
      display_name: 巨人
      tts:
        delivery: 粗犷低沉，落败后直截了当
        timbre: 浑厚粗粝
        pace: 偏慢
        pitch: 低音
    redhead:
      display_name: 红头发
      tts:
        delivery: 尖刻狡猾，话里总藏着挑拨和算计
        timbre: 干涩尖细
        pace: 稍快
        pitch: 中高音
    king:
      display_name: 都柏林国王
      tts:
        delivery: 威严却容易慌张，发令时干脆响亮
        timbre: 饱满厚实
        pace: 中速
        pitch: 中低音
    princess:
      display_name: 公主
      tts:
        delivery: 克制端庄，动情时真挚急切
        timbre: 清亮柔和
        pace: 中速
        pitch: 中高音
    old_nick:
      display_name: 老魔王
      tts:
        delivery: 表面殷勤，翻脸时凶狠阴冷
        timbre: 阴沉沙哑
        pace: 偏慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 山羊皮与三件宝物
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，恩尼斯科西的炼铁坊下边住着一个穷寡妇。她穷得连一件衣裳也买不起，只能让儿子待在炉边的灰坑里，再把暖烘烘的炉灰堆在他身旁。儿子一年年长高，她便把坑越挖越深。后来，她千方百计总算弄来一张山羊皮，围在儿子腰间扎牢。小伙子觉得自己神气极了，还特意到街上走了一圈。
        - id: ch01-b02
          speaker: widow
          text: 汤姆，你这懒鬼！你都十九岁了，长得足有六英尺高，却从没做过一件有用的事。拿上绳子，到林子里给我捆担柴回来。
        - id: ch01-b03
          speaker: tom
          text: 母亲，您不用再说，我这就走。
        - id: ch01-b04
          speaker: narrator
          text: 汤姆拾好木柴，刚把它捆紧，一个九英尺高的巨人就抡着大棒扑来。汤姆往旁边一闪，抓起羊叉打过去，一下便叫巨人趴在地上啃泥。
        - id: ch01-b05
          speaker: tom
          text: 你若会祷告，现在就念。再迟一会儿，我可要把你打成碎片了。
        - id: ch01-b06
          speaker: giant
          text: 我不会祷告。你要肯饶我，我就把大棒送给你。只要你不犯下罪过，拿着它打仗，场场都能赢。
        - id: ch01-b07
          speaker: narrator
          text: 汤姆放走巨人，拿过大棒，在柴捆上坐下，又用小棍敲了敲它。
        - id: ch01-b08
          speaker: tom
          text: 柴捆呀，我费尽力气才拾好你，还差点为你送命。现在，你总该驮我回家吧。
        - id: ch01-b09
          speaker: narrator
          text: 这句话正是柴捆等着的。它立刻穿过树林，一路呻吟，一路咔嚓响，径直来到寡妇门前。柴烧完后，汤姆又进了树林。这次，他碰上一个双头巨人。打起来虽比上回费劲一点，也只多了那么一点。那巨人也不会祷告，便拿一支笛子换自己的命。无论谁听见笛声，都非跳舞不可。汤姆骑上大柴捆一吹，柴捆竟一路跳着舞，把他送回家。
        - id: ch01-b10
          speaker: narrator
          text: 第三个巨人生得俊美，却有三个脑袋。他和前两个一样，既不会祷告，也没学过教义问答。汤姆胜过他后，得到一瓶绿药膏。只要把药膏涂在身上，烈火烧不伤，滚水烫不坏，刀枪也损不了分毫。
        - id: ch01-b11
          speaker: giant
          text: 我们几个已经全叫你碰上啦。直到收获季的小疯狂节，你尽管来拾柴，再不会有巨人或仙灵打扰你。
    - id: ch02
      title: 公主的第一次笑声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 从此，汤姆骄傲得胜过十只孔雀，常在黄昏时到街上散步。几个没规矩的小男孩却像都柏林街头的小无赖，冲着他的大棒和山羊皮吐舌头。汤姆很恼火，又觉得挥手打他们实在有失身份。一天，一个像敲钟报信人的家伙来到镇上。他拿的不是钟，而是一支大号角，头戴猎人帽，身穿花花绿绿的上衣。我也不知道该怎么称呼他，姑且叫他号角手吧。他宣布，都柏林公主忧愁得整整七年没有笑过。谁能让她笑三次，国王就把她许配给谁。
        - id: ch02-b02
          speaker: tom
          text: 这件事正合我意，我也去试一试。
        - id: ch02-b03
          speaker: narrator
          text: 汤姆不肯再浪费一点天光。他吻别母亲，朝那些男孩挥挥大棒，沿着黄色大路奔向都柏林。来到一座城门时，守卫又骂又笑，就是不放行。汤姆起初全忍下了。其中一人后来声称只是开个玩笑，竟把刺刀扎进他肋下半英寸。汤姆没说什么，一手抓住他的后颈，一手提起灯芯绒裤的裤腰，把他扔进运河。有人忙着下水救人，有人拔出刀剑，想教训这个乡巴佬。汤姆拿棒子一点，便叫他们栽进壕沟，或是扑倒在石头上。没过多久，守卫们便纷纷求他住手。
        - id: ch02-b04
          speaker: narrator
          text: 有个守卫乖乖领他进了王宫庭院。国王、王后和公主坐在楼廊上，看人摔跤、比剑、跳长舞、演假面戏。节目一样接着一样，全是为了取悦公主，可她美丽的脸上没有半点笑意。众人看见汤姆，全都停住了。这个年轻巨人生着少年人的脸，留着长长的黑发和短卷胡子。他双臂粗壮，两腿赤裸，身上除了从腰间垂到膝头的山羊皮，什么遮盖也没有。他那可怜的母亲连剃刀都买不起。
        - id: ch02-b05
          speaker: narrator
          text: 一个干瘪的红头发也想娶公主。他发现公主睁大眼睛望着汤姆，立刻妒火中烧，便走上来厉声盘问。
        - id: ch02-b06
          speaker: tom
          text: 我来这里，是想让美丽的公主笑三次。愿上帝保佑她。
        - id: ch02-b07
          speaker: redhead
          text: 看见那些逗趣的好手和使剑的名家了吗？他们随便哪个都能蘸点盐把你吞了。可整整七年，谁也没能让公主笑一声。
        - id: ch02-b08
          speaker: narrator
          text: 红头发不停挑衅，其他人也围拢过来。汤姆终于说，这一大群人还不值一撮鼻烟。他们尽管一次上六个，看看谁更厉害。国王坐得远，没听清争吵，便问陌生人想做什么。
        - id: ch02-b09
          speaker: redhead
          text: 陛下，他想把您最出色的勇士都变成兔子。
        - id: ch02-b10
          speaker: king
          text: 原来如此。那就叫一个人出去，试试他有多少本事。
        - id: ch02-b11
          speaker: narrator
          text: 一名勇士拿着长剑，又举着锅盖般的盾牌，迎头砍来。汤姆先敲他的手肘，让长剑飞过众人头顶，又捶中他的头盔，把他打倒在碎石地上。第二个、第三个、第四个接连倒下，后来六个人一齐冲上去，照样连人带剑、盾牌和头盔滚成一片。他们叫着自己被杀了、残废了、伤得不轻，揉着可怜的胳膊肘和屁股，一瘸一拐地逃开。汤姆下手拿捏得很准，谁也没死。公主实在觉得有趣，发出七年来第一阵清脆响亮的笑声，整个庭院都听见了。
        - id: ch02-b12
          speaker: tom
          text: 都柏林国王，您的女儿已经有四分之一归我了。
        - id: ch02-b13
          speaker: narrator
          text: 国王不知道是喜是忧，公主心头的血却全涌上脸颊。当天再也没有人比武，汤姆还受邀和王室一家同桌吃了晚饭。
    - id: ch03
      title: 跳舞的恶狼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天，红头发告诉汤姆，城墙外有一头母牛犊那么大的狼，常在附近嗥叫，吞吃人畜。国王若能除掉它，一定非常高兴。
        - id: ch03-b02
          speaker: tom
          text: 我很乐意。派个城里的小子带路，我倒要瞧瞧，那头狼会怎样招待生人。
        - id: ch03-b03
          speaker: narrator
          text: 公主听见这个主意，很不高兴。汤姆已经换上漂亮衣裳，长卷发上戴着精致的绿色圆帽，看起来判若两人。更何况，他已从她那里赢得一次笑声。可是国王仍旧答应了。一个半小时后，可怕的巨狼竟自己走进王宫庭院。汤姆肩扛大棒，落后它一两步，悠然跟在后面，就像牧羊人跟着自己心爱的小羊羔。
        - id: ch03-b04
          speaker: narrator
          text: 国王一家躲在高高的楼廊上。院里的官员和仆从看见巨兽，都以为大难临头，争着往门里逃。狼舔舔嘴唇，那模样分明是在想，要是拿他们中的两个当早餐，该有多香。
        - id: ch03-b05
          speaker: king
          text: 披山羊皮的汤姆，快把这头可怕的狼带走！我把整个女儿都给你！
        - id: ch03-b06
          speaker: narrator
          text: 汤姆根本不理会。他取出笛子，拼命吹了起来。院里不管男人还是男孩，没有一个能停住双脚，全都甩开脚跟脚尖跳舞。连巨狼也被迫用后腿站起来，和大家一起跳《破衣杰克·沃尔什》。不少人勉强跳进屋里，赶忙锁上门，免得那毛茸茸的家伙逮住自己。留在外边的人一边跳一边喊。狼的双腿疼得厉害，也只能一边跳一边嚎。
        - id: ch03-b07
          speaker: narrator
          text: 狼死死盯着同样被关在门外的红头发，一只眼看他，另一只眼瞧汤姆，等着汤姆准许它吃人。汤姆只是摇头，笛声从未停下。红头发不停跳，不停叫。狼也一条腿抬起，一条腿落下，累得几乎站不住。公主见谁都不会丧命，又见红头发如此狼狈，忍不住第二次大笑。
        - id: ch03-b08
          speaker: tom
          text: 都柏林国王，您的女儿已经有两个一半归我啦！
        - id: ch03-b09
          speaker: king
          text: 别管一半还是整个，快弄走那头魔鬼狼！剩下的以后再说。
        - id: ch03-b10
          speaker: narrator
          text: 汤姆收起笛子。狼一屁股坐在地上，累得快晕过去了。
        - id: ch03-b11
          speaker: tom
          text: 回山里去吧，好家伙。往后规规矩矩地活着。要是你再走进任何城镇七英里以内，我就——
        - id: ch03-b12
          speaker: narrator
          text: 汤姆没有说完，只往掌心啐了一口，威风凛凛地抡起大棒。那可怜的狼只需看见这个，便明白了一切。它立刻夹紧尾巴，使出浑身力气逃走，连人带鬼一个也不敢回头看。从那以后，不论太阳、月亮还是星星，再没见它在都柏林附近出现。晚饭桌上人人都笑，只有狐狸般狡猾的红头发沉着脸。他正在暗暗盘算，明天该怎样除掉可怜的汤姆。
    - id: ch04
      title: 地狱里的连枷
      blocks:
        - id: ch04-b01
          speaker: redhead
          text: 都柏林国王，您真走运。丹麦人没完没了地折磨我们，让魔鬼把他们赶到拉斯克去吧！要说谁能救我们，只有这位披山羊皮的先生。地狱横梁上挂着一柄连枷，无论丹麦人还是魔鬼，都挡不住它。
        - id: ch04-b02
          speaker: tom
          text: 国王，要是我把连枷带回来，您就把公主剩下的一半给我吗？
        - id: ch04-b03
          speaker: princess
          text: 不，不！我宁可永远不做你的妻子，也不要看你去冒这种险。
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: 公主竭力阻拦，红头发却凑到汤姆身边，一面耳语，一面拿胳膊肘推他，说临阵退缩实在难看。汤姆便向他问清道路，独自出发。他走啊走啊，终于看见地狱的城墙。敲门以前，他没忘记三头巨人的礼物，先把绿色药膏仔仔细细涂遍全身。门一响，一百个小鬼立刻从铁栏杆间探出脑袋，一齐问他想要什么。
        - id: ch04-b05
          speaker: tom
          text: 我要见你们当中最大的魔鬼。把门打开。
        - id: ch04-b06
          speaker: narrator
          text: 大门很快被推开。老魔王弯腰作揖，装得十分殷勤，问汤姆来做什么。
        - id: ch04-b07
          speaker: tom
          text: 没什么大事。我只想借走横梁上的连枷，让都柏林国王拿它痛打丹麦人。
        - id: ch04-b08
          speaker: old_nick
          text: 丹麦人才是我的好主顾。不过你走了这么远，我也不好拒绝。小鬼，把那柄连枷递给他。
        - id: ch04-b09
          speaker: narrator
          text: 老魔王说着，用远离汤姆的那只眼睛使了个眼色。几个小鬼悄悄闩住大门，另一个年轻小鬼爬上横梁，取下连枷。它的长柄和短头全是烧得通红的铁。小恶棍咧着嘴，只等着看连枷把汤姆的双手烫烂。可汤姆握着它，就像握着一根结实的橡树苗，别说烫伤，连一点灼痛也没有。
        - id: ch04-b10
          speaker: tom
          text: 多谢。现在请把门打开，让我出去吧。我不会再来麻烦你们。
        - id: ch04-b11
          speaker: old_nick
          text: 滚你的吧！原来你打的是这个主意？这道门进来容易，出去可难。把连枷夺下，再给他尝尝马镫油！
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: 一个小鬼伸出爪子来抢。汤姆抡起连枷，重重抽中他的脑袋一侧，打断了他的一只角，疼得他像真正的魔鬼那样放声嚎叫。大小恶鬼一齐扑向汤姆，汤姆便把他们挨个痛打一顿，让他们许久都忘不了这一场教训。最后，连老魔王也揉着挨过打的手肘，只好认输。
        - id: ch04-b13
          speaker: old_nick
          text: 放这个蠢货出去！往后无论哪个大小恶鬼再让他进门，都叫他倒霉！
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: 汤姆大步走出地狱，根本不理会身后那些大小恶鬼，甚至没有停步回头看上一眼。他们站在城墙顶上，一阵接一阵地冲他叫喊咒骂。汤姆一路回到王宫宽阔的大围院，手中还稳稳拿着那柄烧红的连枷。
    - id: ch05
      title: 公主的第三次笑声
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 王宫大院顿时热闹起来，从来没有人见过这么多人争先恐后地奔跑，只为看一眼汤姆和那柄连枷。汤姆讲完经过，把连枷放在石阶上，郑重警告大家，谁也不能拿自己的性命冒险去碰它。国王、王后和公主本来就十分看重他，如今待他更好了十倍。
        - id: ch05-b02
          speaker: narrator
          text: 红头发这个卑鄙的赖皮却偷偷溜过去，想抓起连枷结果汤姆。他的手指刚碰到通红的铁，便发出一声惊天动地的吼叫，像天和地撞到了一起。他甩着两条胳膊乱跳，那模样看着实在可怜。汤姆刚一起身便冲过去，把那双烫伤的手握在自己粗大的两手之间，来来回回揉搓。还没等人数到一，灼人的疼痛便消失了。
        - id: ch05-b03
          speaker: narrator
          text: 红头发刚受过剧痛，如今忽然又舒服下来。痛苦和快活同时挤在他脸上，一半像哭，一半像笑，搅成一副从未有人见过的怪模样。大家轰然大笑，公主也和众人一样，怎么也停不住。这正是她的第三次笑声。
        - id: ch05-b04
          speaker: tom
          text: 公主殿下，就算您能分成五十个一半，我也盼您把它们全给我。
        - id: ch05-b05
          speaker: narrator
          text: 公主望了望父亲，随后走到汤姆面前，把一双纤细的手放进他那双粗糙的大手里。唉，我只恨那天站在汤姆鞋子里的人不是我！
        - id: ch05-b06
          speaker: narrator
          text: 汤姆不肯把连枷带进宫，别人当然也不敢靠近。第二天清早，早起的人从石阶旁经过，发现石头上裂开两道长缝。连枷已经烧出一条向下的通道，一路沉进石头底下，谁也不知道究竟沉了多深。到了中午，一名信使赶来报告，说丹麦人听闻连枷已经到了都柏林，吓得全都登上自己的船，扬帆逃走了。
        - id: ch05-b07
          speaker: narrator
          text: 我猜，汤姆成婚以前大概找了个像托门宁的帕特·马拉那样的人，教他所谓的礼貌原则，还有流数、枪炮术、筑城术、小数、实用算术和正三率。这样，他和王室一家坐在一起时，也能把话接下去。他是不是真把时间花在这些学问上，我可说不准。可是有一件事像命运一样确定：从那以后，他的母亲再也没有受过一点穷，一直到离世都是如此。
