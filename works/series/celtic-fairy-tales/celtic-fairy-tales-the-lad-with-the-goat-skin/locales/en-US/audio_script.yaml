  chapters:
    - id: ch01
      title: The Goat-Skin and the Giants
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a poor widow lived near the iron forge by Enniscorth. She was so poor that she had no clothes for her son. She kept him in a hollow by the fire, piling warm ashes around him, and as he grew, she dug the hollow deeper.
        - id: ch01-b02
          speaker: narrator
          text: At last, by hook or by crook, she found a goat-skin and fastened it around his waist. The lad felt grand in it and went walking down the street.
        - id: ch01-b03
          speaker: mother
          text: Tom, you rascal, you've never done a useful thing. You're six feet tall and past nineteen. Take that rope and fetch me a bundle of sticks from the wood.
        - id: ch01-b04
          speaker: tom
          text: You needn't tell me twice, Mother. Off I go.
        - id: ch01-b05
          speaker: narrator
          text: Tom gathered the sticks and tied them together. Then a giant nine feet tall came at him, swinging a club. Tom sprang aside, snatched up a ram-pike, and struck the giant so hard that he fell face-first on the ground.
        - id: ch01-b06
          speaker: tom
          text: If you know a prayer, say it now, before I smash you to pieces.
        - id: ch01-b07
          speaker: first_giant
          text: I know no prayers. Spare me, and I'll give you my club. As long as you keep from sin, you'll win every battle you fight with it.
        - id: ch01-b08
          speaker: narrator
          text: Tom made no difficulty about letting him go. Once the club was in his hands, he sat down on the bundle of brushwood and gave it a tap with a little stick.
        - id: ch01-b09
          speaker: tom
          text: Bundle, I worked hard to gather you and risked my life over you. The least you can do is carry me home.
        - id: ch01-b10
          speaker: narrator
          text: The bundle needed no more than that. It rushed through the wood, groaning and crackling, with Tom on top, and stopped at the widow's door.
        - id: ch01-b11
          speaker: narrator
          text: When those sticks were all burned, Tom went out to gather more. This time he met a giant with two heads. The fight gave him a little more trouble, but no more than that. To save his life, the giant gave Tom a fife that forced everyone who heard it to dance.
        - id: ch01-b12
          speaker: narrator
          text: Tom played the fife, and the great bundle danced all the way home while he sat on top. The next giant was a handsome fellow with three heads. He had no prayers and knew no catechism, any more than the others. In return for his life, he gave Tom a bottle of green ointment that would keep him from being burned, scalded, or wounded.
        - id: ch01-b13
          speaker: third_giant
          text: That's the last of us. You may gather sticks here until little Lunacy Day in harvest, and no giant or fairy-man will trouble you.
    - id: ch02
      title: The Road to Dublin
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Tom was now prouder than ten peacocks. He liked to stroll down the street in the evening, but the little boys mocked his club and goat-skin and stuck out their tongues. Tom hated it, though he knew it would be mean to strike them.
        - id: ch02-b02
          speaker: narrator
          text: One day, a man came through town with a great bugle, a huntsman's cap, and a painted shirt. He was not quite a bellman, so perhaps we had better call him a bugleman.
        - id: ch02-b03
          speaker: bugleman
          text: Hear this! The King of Dublin's daughter has been so sad that she has not laughed in seven years. The king will give her in marriage to whoever can make her laugh three times.
        - id: ch02-b04
          speaker: tom
          text: That's exactly the thing for me to try.
        - id: ch02-b05
          speaker: narrator
          text: Tom wasted no daylight. He kissed his mother, flourished his club at the little boys, and set off along the yellow highroad to Dublin.
        - id: ch02-b06
          speaker: narrator
          text: At one of the city gates, the guards laughed and cursed instead of letting him pass. Tom bore it for a while. Then one guard, claiming it was only a joke, pushed his bayonet half an inch into Tom's side.
        - id: ch02-b07
          speaker: narrator
          text: Tom did nothing more than seize the fellow by the back of his neck and the waistband of his corduroys, then toss him into the canal. Some guards ran to pull the man out. Others came to teach the stranger manners with swords and daggers. A tap of Tom's club sent them headlong into the moat or sprawling on the stones, and soon they begged him to stay his hand.
        - id: ch02-b08
          speaker: gate_guard
          text: Hold your hands! I'll show you the way to the palace yard.
        - id: ch02-b09
          speaker: narrator
          text: "In the palace yard, Tom found the king, queen, and princess watching from a gallery. Below them came one entertainment after another: wrestling, swordplay, long dances, and mummers in disguise. Every performance was meant to please the princess. Yet through all the skill, noise, and merriment, not one smile crossed her handsome face."
        - id: ch02-b10
          speaker: narrator
          text: Everything stopped when Tom appeared. He was a young giant with a boy's face, long black hair, a short curly beard, great arms, and bare legs. His poor mother had never been able to buy him a razor. The goat-skin was his only covering from waist to knees.
        - id: ch02-b11
          speaker: narrator
          text: A small, wizened red-haired man wanted the princess for himself. He saw how widely she opened her eyes at Tom, and he stepped forward in envy.
        - id: ch02-b12
          speaker: redhead
          text: What business have you here?
        - id: ch02-b13
          speaker: tom
          text: I've come to make the beautiful princess laugh three times. God bless her.
        - id: ch02-b14
          speaker: redhead
          text: Look at those merry fellows and expert swordsmen. They could swallow you with a grain of salt, yet not one of them has won a laugh from her in seven years.
        - id: ch02-b15
          speaker: narrator
          text: The men crowded around Tom, and Redhead kept provoking him until Tom had enough.
        - id: ch02-b16
          speaker: tom
          text: I don't care a pinch of snuff for the lot of you. Come at me six at a time, and let's see what you can do.
        - id: ch02-b17
          speaker: narrator
          text: The king was too far away to hear them clearly.
        - id: ch02-b18
          speaker: king
          text: What does the stranger want?
        - id: ch02-b19
          speaker: redhead
          text: He wants to turn your best men into hares.
        - id: ch02-b20
          speaker: king
          text: Oh, is that his game? Let one man step out and test his strength.
        - id: ch02-b21
          speaker: narrator
          text: A swordsman came forward with a sword and a round shield. When he slashed at Tom, Tom struck his elbow. The sword flew over everyone's heads, and another blow on the helmet dropped its owner onto the gravel.
        - id: ch02-b22
          speaker: narrator
          text: Another man took his place, then another, then another, and at last six came together. Tom sent swords, helmets, shields, and bodies rolling over one another across the yard. The men bawled that they were killed, disabled, and damaged. They rubbed their poor elbows and hips as they limped away. Through it all, Tom took care not to kill anyone.
        - id: ch02-b23
          speaker: narrator
          text: The sight amused the princess so much that a great, sweet laugh rang across the whole yard.
        - id: ch02-b24
          speaker: tom
          text: King of Dublin, I've won one quarter of your daughter.
        - id: ch02-b25
          speaker: narrator
          text: The king could not decide whether to be pleased or sorry. All the blood in the princess's heart rushed into her cheeks.
    - id: ch03
      title: The Dancing Wolf
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The fighting ended for the day, and Tom dined with the royal family. The next morning, Redhead told him about a wolf as large as a yearling heifer. It prowled around the city walls and ate both people and cattle.
        - id: ch03-b02
          speaker: redhead
          text: Think how pleased the king would be if someone killed that wolf.
        - id: ch03-b03
          speaker: tom
          text: Gladly. Send a city lad to show me its den, and we'll see how it treats a stranger.
        - id: ch03-b04
          speaker: narrator
          text: The princess disliked the plan. In fine clothes, with a neat green cap over his long curls, Tom looked like a different man. Besides, he had already won one laugh from her. Even so, the king gave permission.
        - id: ch03-b05
          speaker: narrator
          text: An hour and a half later, the horrible wolf walked into the palace yard. Tom followed a step or two behind with his club on his shoulder, as calmly as a shepherd following a pet lamb.
        - id: ch03-b06
          speaker: narrator
          text: The king, queen, and princess were safely above in their gallery. Down in the great palace yard, officers and courtiers had been strolling about with nothing to fear. The moment they saw the huge beast coming toward them, they gave themselves up for lost and rushed for every door and gate. The wolf licked its chops as though it were thinking how much it would enjoy two of them for breakfast.
        - id: ch03-b07
          speaker: king
          text: Tom with the Goat-Skin, take that dreadful wolf away! You shall have all of my daughter!
          emotion: fearful
        - id: ch03-b08
          speaker: narrator
          text: Tom paid him no attention. He drew out his fife and played with all his might. Every man and boy in the yard began dancing heel and toe. Even the wolf had to rise on its hind legs and dance "Tatther Jack Walsh" with the rest.
        - id: ch03-b09
          speaker: narrator
          text: Many people managed to get indoors and shut the doors before the hairy beast could pin them. Tom kept playing. Those left outside had no choice but to keep dancing and shouting. The wolf danced too, roaring at the pain in its legs, yet it could not stop while the tune went on.
        - id: ch03-b10
          speaker: narrator
          text: All the while, the wolf watched Redhead. Wherever Redhead danced, the beast followed, keeping one eye on him and the other on Tom, waiting for permission to eat him. Tom only shook his head and played on.
        - id: ch03-b11
          speaker: narrator
          text: Redhead danced and yelled. The wolf danced and roared, lifting one leg and then the other, until it was ready to collapse from weariness.
        - id: ch03-b12
          speaker: narrator
          text: Once the princess saw that no one would be killed, Redhead's misery delighted her. She gave another great laugh.
        - id: ch03-b13
          speaker: tom
          text: King of Dublin, now I've won two halves of your daughter.
        - id: ch03-b14
          speaker: king
          text: Halves or wholes, just get rid of that devil of a wolf! We'll settle the rest afterward.
        - id: ch03-b15
          speaker: narrator
          text: Tom pocketed the fife. The wolf sat back on its haunches, nearly fainting.
        - id: ch03-b16
          speaker: tom
          text: Off you go to your mountain, my fine fellow, and live like a respectable beast. If I ever find you within seven miles of a town, I'll...
        - id: ch03-b17
          speaker: narrator
          text: Tom said no more. He spat into his fist and flourished his club. That was enough. The poor wolf tucked its tail between its legs and ran without looking at anyone. Neither sun, moon, nor stars ever saw it near Dublin again.
    - id: ch04
      title: Redhead's Last Scheme
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At dinner, everyone laughed except the foxlike Redhead. He was already planning how to finish Tom the next day.
        - id: ch04-b02
          speaker: redhead
          text: King of Dublin, what luck you have! The Danes torment us without end. Let them run off to Lusk! If anyone can save us, it is this gentleman in the goat-skin. A flail hangs from a beam in hell, and no Dane or devil can stand against it.
        - id: ch04-b03
          speaker: tom
          text: If I bring you that flail, will you give me the other half of the princess?
        - id: ch04-b04
          speaker: princess
          text: No, no. I would rather never become your wife than see you face such danger.
        - id: ch04-b05
          speaker: narrator
          text: But Redhead whispered and nudged Tom, telling him how shameful it would look to back out of the adventure. Tom asked for the way, and Redhead directed him.
    - id: ch05
      title: The Flail in Hell
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Tom traveled on and on until the walls of hell came into sight. Before knocking at the gates, he rubbed the green ointment all over himself.
        - id: ch05-b02
          speaker: narrator
          text: At his knock, a hundred little imps poked their heads through the bars and demanded to know what he wanted.
        - id: ch05-b03
          speakers: [imp_one, imp_two, imp_three]
          ensemble: chorus
          text: What do you want here?
        - id: ch05-b04
          speaker: tom
          text: I want to speak to the chief devil. Open the gate.
        - id: ch05-b05
          speaker: narrator
          text: The gate soon flew open. Old Nick welcomed Tom with bows and flourishes, then asked his business.
        - id: ch05-b06
          speaker: tom
          text: It's a small matter. I've come to borrow that flail hanging from the beam. The King of Dublin needs it to give the Danes a thrashing.
        - id: ch05-b07
          speaker: old_nick
          text: The Danes are much better customers of mine. Still, you've walked a long way, so I won't refuse you. Young imp, hand him that flail.
        - id: ch05-b08
          speaker: narrator
          text: As he spoke, Old Nick winked with the eye farthest from Tom. Some imps quietly barred the gates while the young one climbed to the beam and brought down the flail. Its long handstaff and its swinging end were both made of red-hot iron.
        - id: ch05-b09
          speaker: narrator
          text: The little rogue grinned, expecting Tom's hands to burn. But the flail harmed him no more than an oak sapling would have done.
        - id: ch05-b10
          speaker: tom
          text: Thank you. Now open the gate for me, and I won't trouble you again.
        - id: ch05-b11
          speaker: old_nick
          text: Away with you! Is that what you think? Getting inside these gates is easier than getting out. Take that tool from him and give him a taste of the stirrup oil.
        - id: ch05-b12
          speaker: narrator
          text: One devil reached out his claws for the flail. Tom struck him on the side of the head, breaking off a horn and making him roar like the devil he was.
        - id: ch05-b13
          speaker: narrator
          text: Then every devil rushed Tom together. He thrashed them, great and small, so soundly that none of them forgot it for a long while.
        - id: ch05-b14
          speaker: old_nick
          text: Let the fool out! And woe to anyone, great or small, who ever lets him in again!
          emotion: angry
        - id: ch05-b15
          speaker: narrator
          text: Tom marched out through the gates and went on his way. From the tops of the walls, the devils shouted and cursed after him, but he never troubled himself to look back or answer them.
    - id: ch06
      title: The Third Laugh
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: When Tom reached the palace yard, everyone ran to see him and the flail. After telling his story, he laid it on the stone steps and warned them for their lives not to touch it.
        - id: ch06-b02
          speaker: narrator
          text: The king, queen, and princess had made much of Tom before. Now they made ten times more of him. But mean Redhead crept over, hoping to seize the flail and put an end to Tom.
        - id: ch06-b03
          speaker: narrator
          text: The instant his fingers touched the iron, he roared as though heaven and earth were crashing together. He flung his arms about and danced in such pain that it was pitiful to see.
        - id: ch06-b04
          speaker: narrator
          text: As soon as Tom could get near, he caught both Redhead's hands and rubbed them between his own. Before anyone could count to one, the burning pain was gone.
        - id: ch06-b05
          speaker: narrator
          text: Redhead had only just escaped the pain, and now relief flooded over him. Between the two, his face became the strangest mixture of laughter and tears that anyone had ever seen. The sight set the whole company laughing. The princess tried no harder to stop than anyone else, and so Tom won her third laugh.
        - id: ch06-b06
          speaker: tom
          text: Now, ma'am, if there were fifty halves of you, I hope you'll give me every one of them.
        - id: ch06-b07
          speaker: narrator
          text: The princess looked at her father. Then, upon my word, she crossed to Tom and placed her two delicate hands inside his two rough ones. I only wish I had been in Tom's shoes that day!
    - id: ch07
      title: Tom's Good Fortune
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Tom refused to take the flail inside the palace, and no one else dared go near it. Early the next morning, people found two long cracks in the stone steps. The burning flail had made itself a path downward, though no one could tell how far it had gone.
        - id: ch07-b02
          speaker: narrator
          text: At noon, a messenger arrived with news.
        - id: ch07-b03
          speaker: messenger
          text: The Danes heard that the flail had come to Dublin. It frightened them so badly that they boarded their ships and sailed away.
        - id: ch07-b04
          speaker: narrator
          text: Before the wedding, I suppose Tom found some man like Pat Mara of Tomenine to teach him the principles of politeness, fluxions, gunnery and fortification, decimal fractions, practice, and the rule of three direct. That way, he could keep up a conversation with the royal family.
        - id: ch07-b05
          speaker: narrator
          text: "I cannot be sure whether he ever wasted his time learning those sciences. But this is as sure as fate: his mother never knew want again for the rest of her days."
