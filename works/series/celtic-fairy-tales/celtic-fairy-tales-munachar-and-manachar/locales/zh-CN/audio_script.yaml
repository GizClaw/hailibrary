audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    munachar:
      display_name: 穆纳哈尔
      tts:
        delivery: 执拗认真，反复说明来意时节奏鲜明
        timbre: 清亮朴实
        pace: 中速
        pitch: 中音
    rod:
      display_name: 枝条
      tts:
        delivery: 干脆直接，带一点顽固
        timbre: 轻细坚韧
        pace: 中速
        pitch: 中高音
    axe:
      display_name: 斧头
      tts:
        delivery: 沉稳硬朗，回答简洁
        timbre: 厚重清脆
        pace: 中速
        pitch: 低音
    flagstone:
      display_name: 磨刀石
      tts:
        delivery: 平实笃定，不紧不慢
        timbre: 粗粝低沉
        pace: 从容
        pitch: 中低音
    water:
      display_name: 水
      tts:
        delivery: 流畅轻快，语气自然
        timbre: 清澈柔和
        pace: 中速
        pitch: 中高音
    deer:
      display_name: 鹿
      tts:
        delivery: 警觉灵敏，答话利落
        timbre: 清朗轻盈
        pace: 稍快
        pitch: 中音
    hound:
      display_name: 猎犬
      tts:
        delivery: 直率有力，带着急切
        timbre: 粗厚响亮
        pace: 中速
        pitch: 中低音
    butter:
      display_name: 黄油
      tts:
        delivery: 柔和从容，语气略带挑剔
        timbre: 柔润轻暖
        pace: 从容
        pitch: 中高音
    cat:
      display_name: 猫
      tts:
        delivery: 机灵挑剔，语调轻巧
        timbre: 细柔明亮
        pace: 中速
        pitch: 高音
    cow:
      display_name: 母牛
      tts:
        delivery: 温厚务实，回答慢条斯理
        timbre: 醇厚柔和
        pace: 舒缓
        pitch: 中低音
    thresher_1:
      display_name: 打谷人甲
      tts:
        delivery: 朴实爽快，说话有劳动者的力度
        timbre: 粗犷结实
        pace: 中速
        pitch: 中低音
    thresher_2:
      display_name: 打谷人乙
      tts:
        delivery: 朴实爽快，与同伴答话整齐
        timbre: 明朗厚实
        pace: 中速
        pitch: 中音
    miller:
      display_name: 磨坊主
      tts:
        delivery: 精明镇定，提出条件时毫不含糊
        timbre: 干爽沉着
        pace: 中速
        pitch: 中低音
    crow:
      display_name: 乌鸦
      tts:
        delivery: 机敏响亮，叫声短促而有提示意味
        timbre: 沙哑清脆
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 覆盆子与枝条
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，世上住着穆纳哈尔和马纳哈尔。那真是很久以前的事了。他们若活在今日，当年自然就不会活着。
        - id: ch01-b02
          speaker: narrator
          text: 有一天，两人一同去采覆盆子。穆纳哈尔采一颗，马纳哈尔便吃一颗。采了多少，就被吃掉多少。穆纳哈尔气不过，决定找根枝条，把它拧成绳索，再用绳索吊死吃光覆盆子的马纳哈尔。他走着走着，找到了枝条。
        - id: ch01-b03
          speaker: rod
          text: 今天带来了什么消息？
        - id: ch01-b04
          speaker: munachar
          text: 我正忙着办自己的事。我要找根枝条，把枝条拧成绳，再用绳子吊死马纳哈尔。他把我的覆盆子一个不剩，全吃光了。
        - id: ch01-b05
          speaker: rod
          text: 先给我找把斧头来。没有斧头砍我，你可带不走我。
        - id: ch01-b06
          speaker: narrator
          text: 穆纳哈尔只好再去找斧头。等他找到了，斧头也问起他的消息。
        - id: ch01-b07
          speaker: axe
          text: 你今天为什么跑到这里来？
        - id: ch01-b08
          speaker: munachar
          text: 我要找把斧头。斧头砍枝条，枝条拧成绳，绳子吊死马纳哈尔。他把我的覆盆子全吃光了。
        - id: ch01-b09
          speaker: axe
          text: 那就先找块磨刀石，把我磨快。不然，你也带不走我。
        - id: ch01-b10
          speaker: narrator
          text: 穆纳哈尔又找到磨刀石。磨刀石照样要听听他的消息。
        - id: ch01-b11
          speaker: flagstone
          text: 今天有什么事呀？
        - id: ch01-b12
          speaker: munachar
          text: 我要找块磨刀石。磨刀石磨斧头，斧头砍枝条，枝条拧成绳，绳子吊死马纳哈尔。他吃光了我的覆盆子。
        - id: ch01-b13
          speaker: flagstone
          text: 你先弄些水来打湿我，才可以把我带走。
    - id: ch02
      title: 越来越长的差事
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 穆纳哈尔找到水，水也问他今日有什么消息。
        - id: ch02-b02
          speaker: munachar
          text: 我要找些水。水打湿磨刀石，磨刀石磨斧头，斧头砍枝条，枝条拧成绳，绳子吊死马纳哈尔。他把我的覆盆子一个不剩，全吃光了。
        - id: ch02-b03
          speaker: water
          text: 你得先找头鹿游过我，不然休想把我带走。
        - id: ch02-b04
          speaker: narrator
          text: 穆纳哈尔找到了鹿。鹿也问他，今天有什么消息。穆纳哈尔便说明自己的来意。
        - id: ch02-b05
          speaker: munachar
          text: 我要找头鹿。鹿游过水，水打湿磨刀石，磨刀石磨斧头，斧头砍枝条，枝条拧成绳，绳子吊死马纳哈尔。他吃光了我的覆盆子。
        - id: ch02-b06
          speaker: deer
          text: 先找条猎犬来追我。没有猎犬，我可不跟你走。
        - id: ch02-b07
          speaker: narrator
          text: 穆纳哈尔接着找到猎犬。猎犬又要听他的消息。
        - id: ch02-b08
          speaker: munachar
          text: 我要找条猎犬。猎犬追鹿，鹿游过水，水打湿磨刀石，磨刀石磨斧头，斧头砍枝条，枝条拧成绳，绳子吊死马纳哈尔。他把我的覆盆子全吃光了。
        - id: ch02-b09
          speaker: hound
          text: 你先拿一小块黄油，塞进我的爪子里。办不到，我就不去。
        - id: ch02-b10
          speaker: narrator
          text: 穆纳哈尔找到黄油。黄油问他，为何一路找到了这里。
        - id: ch02-b11
          speaker: munachar
          text: 我要找块黄油。黄油塞进猎犬的爪子，猎犬追鹿，鹿游过水，水打湿磨刀石，磨刀石磨斧头，斧头砍枝条，枝条拧成绳，绳子吊死马纳哈尔。他把我的覆盆子吃得一颗不剩。
        - id: ch02-b12
          speaker: butter
          text: 先找只猫来刮我吧。猫不来，你就别想带走我。
        - id: ch02-b13
          speaker: narrator
          text: 穆纳哈尔找到猫。猫也开口问他有什么消息。
        - id: ch02-b14
          speaker: munachar
          text: 我要找只猫。猫刮黄油，黄油塞进猎犬的爪子，猎犬追鹿，鹿游过水，水打湿磨刀石，磨刀石磨斧头，斧头砍枝条，枝条拧成绳，绳子吊死马纳哈尔。他吃光了我的覆盆子。
        - id: ch02-b15
          speaker: cat
          text: 那你先给我弄些牛奶来喝。没有牛奶，我才不去。
        - id: ch02-b16
          speaker: narrator
          text: 穆纳哈尔找到母牛。母牛听说他来找牛奶，便问他究竟要做什么。
        - id: ch02-b17
          speaker: munachar
          text: 我要请你给我牛奶。牛奶拿去喂猫，猫刮黄油，黄油塞进猎犬的爪子，猎犬追鹿，鹿游过水，水打湿磨刀石，磨刀石磨斧头，斧头砍枝条，枝条拧成绳，绳子吊死马纳哈尔。他把我的覆盆子全吃光了。
        - id: ch02-b18
          speaker: cow
          text: 看见那边打谷的人了吗？先向他们要一束稻草来喂我，不然我可不给你奶。
        - id: ch02-b19
          speaker: narrator
          text: 穆纳哈尔走到打谷人面前。他们一齐问，今天有什么消息。
        - id: ch02-b20
          speaker: munachar
          text: 我要向你们讨一束稻草。稻草拿去喂母牛，母牛给我牛奶，牛奶拿去喂猫，猫刮黄油，黄油塞进猎犬的爪子，猎犬追鹿，鹿游过水，水打湿磨刀石，磨刀石磨斧头，斧头砍枝条，枝条拧成绳，绳子吊死马纳哈尔。他把我的覆盆子吃光了。
        - id: ch02-b21
          speakers: [thresher_1, thresher_2]
          ensemble: duo
          text: 先从那边的磨坊主手里拿来做饼的材料。没有材料，我们就不给你稻草。
    - id: ch03
      title: 一筛河水
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 穆纳哈尔找到磨坊主。磨坊主问他，今天又带来了什么消息。
        - id: ch03-b02
          speaker: munachar
          text: 我要找些做饼的材料。材料交给打谷人，打谷人给我稻草，稻草拿去喂母牛，母牛给我牛奶，牛奶拿去喂猫，猫刮黄油，黄油塞进猎犬的爪子，猎犬追鹿，鹿游过水，水打湿磨刀石，磨刀石磨斧头，斧头砍枝条，枝条拧成绳，绳子吊死马纳哈尔。他把我的覆盆子一个不剩，全吃光了。
        - id: ch03-b03
          speaker: miller
          text: 拿着这只筛子，到那边的河里盛满一筛水。你把水带回来，我才给你做饼的材料。
        - id: ch03-b04
          speaker: narrator
          text: 穆纳哈尔拿着筛子来到河边。他弯腰盛满水，可筛子刚一提起，水就从洞眼里漏得精光。他试了一回又一回，结果总是一样。说真的，就算从那一天一直试到今天，他也不可能把筛子盛满。
        - id: ch03-b05
          speaker: narrator
          text: 这时，一只乌鸦从穆纳哈尔头顶飞过。
        - id: ch03-b06
          speaker: crow
          text: 快抹泥！快抹泥！
        - id: ch03-b07
          speaker: munachar
          text: 愿福气落在你身上！你给我出的这个主意可真好。
        - id: ch03-b08
          speaker: narrator
          text: 穆纳哈尔捧起河岸边的红黏土和泥巴，涂在筛子底下，把所有窟窿都堵严了。这一回，筛子终于盛住了水。
        - id: ch03-b09
          speaker: narrator
          text: 他把水送给磨坊主，换来做饼的材料。材料交给打谷人，换来一束稻草。稻草喂给母牛，换来牛奶。牛奶给猫喝，猫便刮下黄油。黄油塞进猎犬的爪子，猎犬就去追鹿。鹿游过水，水打湿磨刀石。磨刀石磨快斧头，斧头砍下枝条，枝条终于拧成了绳索。
        - id: ch03-b10
          speaker: narrator
          text: 穆纳哈尔备好绳索，正要去吊死马纳哈尔，却发现马纳哈尔早已撑爆了。
