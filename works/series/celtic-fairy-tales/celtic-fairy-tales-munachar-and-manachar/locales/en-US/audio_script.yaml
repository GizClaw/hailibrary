  chapters:
    - id: ch01
      title: Raspberries and a Rod
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, Munachar and Manachar lived together. It was so long ago that if they were alive now, they could not have been alive then. One day they went to gather raspberries. But every time Munachar picked some, Manachar ate them. At last Munachar went looking for a rod. He meant to twist it into a rope and hang Manachar for eating every one of his berries.
        - id: ch01-b02
          speaker: rod
          text: What news have you today?
        - id: ch01-b03
          speaker: munachar
          text: My own news is what I'm after. I need a rod to twist into a rope, so I can hang Manachar for eating every raspberry I picked.
        - id: ch01-b04
          speaker: rod
          text: You cannot have me until you bring an axe to cut me.
        - id: ch01-b05
          speaker: narrator
          text: So Munachar went to the axe.
        - id: ch01-b06
          speaker: axe
          text: What news do you bring today?
        - id: ch01-b07
          speaker: munachar
          text: I'm searching for my own news. I need an axe to cut the rod, and the rod will make a rope to hang Manachar, who ate all my raspberries.
        - id: ch01-b08
          speaker: axe
          text: You will not get me until you bring a sharpening stone to put an edge on me.
        - id: ch01-b09
          speaker: narrator
          text: Munachar went on until he came to the sharpening stone.
        - id: ch01-b10
          speaker: flag
          text: What news is there today?
        - id: ch01-b11
          speaker: munachar
          text: It's my own news I'm looking for. I need the stone to sharpen the axe, the axe to cut the rod, and the rod to make a rope to hang Manachar, because he ate every one of my raspberries.
        - id: ch01-b12
          speaker: flag
          text: You cannot have me until you bring water to wet me.
        - id: ch01-b13
          speaker: narrator
          text: Then Munachar came to the water.
        - id: ch01-b14
          speaker: water
          text: What news have you today?
        - id: ch01-b15
          speaker: munachar
          text: I'm after my own news. I need water to wet the stone, the stone to sharpen the axe, the axe to cut the rod, and the rod to make a rope to hang Manachar, who ate all my raspberries.
        - id: ch01-b16
          speaker: water
          text: You will not get me until you bring a deer to swim through me.
    - id: ch02
      title: The Chain Grows Longer
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Munachar went on until he found the deer.
        - id: ch02-b02
          speaker: deer
          text: What news do you have today?
        - id: ch02-b03
          speaker: munachar
          text: My own news is what I'm seeking. I need a deer to swim the water, water to wet the stone, the stone to sharpen the axe, the axe to cut the rod, and the rod to make a rope to hang Manachar, who ate every raspberry I picked.
        - id: ch02-b04
          speaker: deer
          text: You cannot have me until you bring a hound to hunt me.
        - id: ch02-b05
          speaker: narrator
          text: Next, Munachar came to the hound.
        - id: ch02-b06
          speaker: hound
          text: What news have you today?
        - id: ch02-b07
          speaker: munachar
          text: I'm looking for my own news. I need a hound to hunt the deer, the deer to swim the water, water to wet the stone, the stone to sharpen the axe, the axe to cut the rod, and the rod to make a rope to hang Manachar for eating all my raspberries.
        - id: ch02-b08
          speaker: hound
          text: You will not get me until you bring a bit of butter for my paw.
        - id: ch02-b09
          speaker: narrator
          text: So Munachar went and found the butter.
        - id: ch02-b10
          speaker: butter
          text: What news do you bring today?
        - id: ch02-b11
          speaker: munachar
          text: It's my own news I'm after. I need butter for the hound's paw, the hound to hunt the deer, the deer to swim the water, water to wet the stone, the stone to sharpen the axe, the axe to cut the rod, and the rod to make a rope to hang Manachar, who ate every one of my raspberries.
        - id: ch02-b12
          speaker: butter
          text: You cannot have me until you bring a cat to scrape me.
        - id: ch02-b13
          speaker: narrator
          text: Munachar came to the cat.
        - id: ch02-b14
          speaker: cat
          text: What news have you today?
        - id: ch02-b15
          speaker: munachar
          text: My own news is what I'm seeking. I need a cat to scrape the butter, butter for the hound's paw, the hound to hunt the deer, the deer to swim the water, water to wet the stone, the stone to sharpen the axe, the axe to cut the rod, and the rod to make a rope to hang Manachar for eating all my raspberries.
        - id: ch02-b16
          speaker: cat
          text: You will not get me until you bring me some milk.
        - id: ch02-b17
          speaker: narrator
          text: Then Munachar went to the cow.
        - id: ch02-b18
          speaker: cow
          text: What news do you have today?
        - id: ch02-b19
          speaker: munachar
          text: I'm searching for my own news. I need the cow to give me milk for the cat, the cat to scrape the butter, butter for the hound's paw, the hound to hunt the deer, the deer to swim the water, water to wet the stone, the stone to sharpen the axe, the axe to cut the rod, and the rod to make a rope to hang Manachar, who ate all my raspberries.
        - id: ch02-b20
          speaker: cow
          text: You will get no milk from me until you bring me a wisp of straw from those threshers over there.
        - id: ch02-b21
          speaker: narrator
          text: Munachar went over to the threshers.
        - id: ch02-b22
          speakers: [thresher_1, thresher_2, thresher_3]
          ensemble: chorus
          text: What news have you today?
        - id: ch02-b23
          speaker: munachar
          text: My own news is what I'm after. I need a wisp of your straw for the cow, the cow to give me milk for the cat, the cat to scrape the butter, butter for the hound's paw, the hound to hunt the deer, the deer to swim the water, water to wet the stone, the stone to sharpen the axe, the axe to cut the rod, and the rod to make a rope to hang Manachar for eating every raspberry I picked.
        - id: ch02-b24
          speakers: [thresher_1, thresher_2, thresher_3]
          ensemble: chorus
          text: You will get no straw from us until you bring us the makings of a cake from the miller over there.
        - id: ch02-b25
          speaker: narrator
          text: So Munachar came to the miller.
        - id: ch02-b26
          speaker: miller
          text: What news do you bring today?
        - id: ch02-b27
          speaker: munachar
          text: I'm looking for my own news. I need the makings of a cake for the threshers, the threshers to give me straw for the cow, the cow to give me milk for the cat, the cat to scrape the butter, butter for the hound's paw, the hound to hunt the deer, the deer to swim the water, water to wet the stone, the stone to sharpen the axe, the axe to cut the rod, and the rod to make a rope to hang Manachar, who ate all my raspberries.
        - id: ch02-b28
          speaker: miller
          text: You will get no cake makings from me until you bring me that sieve filled with water from the river over there.
    - id: ch03
      title: The Sieve and the Surprise
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Munachar took the sieve and went to the river. Again and again, he bent down and filled it. Each time he lifted it, the water ran straight through. He could have stayed there from that day to this and never filled it. Then a crow flew over his head.
        - id: ch03-b02
          speaker: crow
          text: Daub it! Daub it!
        - id: ch03-b03
          speaker: munachar
          text: Bless you! That's good advice indeed.
        - id: ch03-b04
          speaker: narrator
          text: Red clay and daub lay by the riverbank. Munachar rubbed them over the bottom of the sieve until every hole was stopped. This time the sieve held the water.
        - id: ch03-b05
          speaker: narrator
          text: He carried the water to the miller, and the miller gave him the makings of a cake. Munachar gave those to the threshers, and they gave him a wisp of straw. He brought the straw to the cow, and the cow gave him milk. He gave the milk to the cat, and the cat scraped the butter. The butter went into the hound's paw. The hound hunted the deer. The deer swam the water. The water wet the sharpening stone. The stone sharpened the axe. The axe cut the rod, and the rod was twisted into a rope.
        - id: ch03-b06
          speaker: narrator
          text: But when Munachar had the rope ready to hang Manachar, he found that Manachar had burst.
