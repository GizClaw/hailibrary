        delivery: warm, legendary, and composed
        timbre: rich and clear
        pace: measured
        pitch: medium
    jack:
      display_name: Jack
      tts:
        delivery: shrewd, playful, and confidently literal
        timbre: clear and youthful
        pace: lively
        pitch: medium
    eldest_brother:
      display_name: Eldest Brother
      tts:
        delivery: clever, weary, and bitter
        timbre: lean and strained
        pace: measured
        pitch: medium-low
    second_brother:
      display_name: Second Brother
      tts:
        delivery: clever, proud, and hot-tempered
        timbre: firm and youthful
