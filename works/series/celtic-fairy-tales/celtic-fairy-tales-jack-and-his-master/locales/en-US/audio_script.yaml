  chapters:
    - id: ch01
      title: The Bargain of the Gray Churl
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A poor woman had three sons. The two older boys were sharp and cunning. They called the youngest Jack the Fool, because they thought he was nothing but a simpleton.
        - id: ch01-b02
          speaker: narrator
          text: One day, the eldest grew tired of home and went away to find service. A full year passed before he came back. He dragged one foot after the other. His face was thin and withered, and he was as cross as two sticks. Once he had rested and eaten, he told the family what had happened.
        - id: ch01-b03
          speaker: eldest_brother
          text: I hired myself to the Gray Churl of the Townland of Mischance. We agreed that the first one to say he regretted the bargain would lose a strip of skin an inch wide, all the way from shoulder to hip. If the master said it, he would pay double wages too. If the servant said it, he would get no wages at all.
        - id: ch01-b04
          speaker: eldest_brother
          text: But that thief gave me hardly anything to eat and worked me past all endurance. Once, when I was furious, he asked whether I regretted our bargain. I was mad enough to say yes. Now I am crippled for life.
        - id: ch01-b05
          speaker: narrator
          text: His mother and brothers were deeply troubled. Right away, the second brother declared that he would serve the Gray Churl himself. He meant to plague the old man until the master regretted the agreement.
        - id: ch01-b06
          speaker: second_brother
          text: How glad I will be when they strip the skin from that old villain's back!
        - id: ch01-b07
          speaker: narrator
          text: No one could stop him. He set off for the Townland of Mischance, and twelve months later he came home just as helpless and miserable as his brother.
        - id: ch01-b08
          speaker: narrator
          text: Then Jack the Fool decided to see whether he could put the Gray Churl in his place. His poor mother tried to stop him, but Jack went. He agreed to work for a year for twenty pounds, under the same bargain about who would be sorry first.
        - id: ch01-b09
          speaker: gray_churl
          text: Now, Jack, if you refuse any job you are able to do, you lose one month's wages.
        - id: ch01-b10
          speaker: jack
          text: That suits me. And if you order me to do something, then stop me from doing it, you must pay me an extra month's wages.
        - id: ch01-b11
          speaker: gray_churl
          text: That suits me.
        - id: ch01-b12
          speaker: jack
          text: And if you blame me for following your orders, you must pay the same.
        - id: ch01-b13
          speaker: gray_churl
          text: I agree to that as well.
    - id: ch02
      title: Three Meals and a Nap
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: On Jack's first day, the Gray Churl fed him poorly and worked him almost past bearing. The next day, Jack came in just before dinner was carried to the parlour. A goose was coming off the spit. Jack snatched up a knife, cut away half the breast, one leg and thigh, and one wing, and began to eat.
        - id: ch02-b02
          speaker: narrator
          text: The master came in and cursed Jack for his boldness.
        - id: ch02-b03
          speaker: jack
          text: You are meant to feed me, master. Wherever this goose goes, that place will not need filling again until supper. Do you regret our bargain?
        - id: ch02-b04
          speaker: narrator
          text: The Gray Churl nearly cried yes, but he caught himself in time.
        - id: ch02-b05
          speaker: gray_churl
          text: Oh no. Not in the least.
        - id: ch02-b06
          speaker: jack
          text: Good. That is settled.
        - id: ch02-b07
          speaker: narrator
          text: The next morning, Jack was sent to stack turf on the bog. Everyone was glad to have him away from the kitchen at dinner. His breakfast had not weighed heavily on him, so he spoke to the mistress before he left.
        - id: ch02-b08
          speaker: jack
          text: Ma'am, I had better eat my dinner now. Then I will not waste time coming back from the bog.
        - id: ch02-b09
          speaker: mistress
          text: That is true, Jack.
        - id: ch02-b10
          speaker: narrator
          text: She brought him a fine cake, a slab of butter, and a bottle of milk, expecting him to carry them away. Jack stayed in his seat until every bit had gone down the red lane.
        - id: ch02-b11
          speaker: jack
          text: Mistress, I could start earlier tomorrow if I slept beside a dry peat stack, on the sheltered side, instead of walking home and back. You may as well give me supper now and finish the day's trouble.
        - id: ch02-b12
          speaker: narrator
          text: She gave him supper, thinking that too was going to the bog. Jack ate it on the spot and left no scrap behind. The mistress could only stare.
        - id: ch02-b13
          speaker: narrator
          text: Jack called the master into the farmyard and asked what servants in that country did after supper.
        - id: ch02-b14
          speaker: gray_churl
          text: Nothing at all. They go to bed.
        - id: ch02-b15
          speaker: jack
          text: Very well, sir.
        - id: ch02-b16
          speaker: narrator
          text: Jack climbed to the stable loft, undressed, and lay down. Someone saw him and told the master, who stormed upstairs.
        - id: ch02-b17
          speaker: gray_churl
          text: Jack, you shameless scoundrel! What do you think you are doing?
          emotion: angry
        - id: ch02-b18
          speaker: jack
          text: Going to sleep, master. God bless the mistress, for she has given me breakfast, dinner, and supper. You told me bed came next. Do you blame me?
        - id: ch02-b19
          speaker: gray_churl
          text: Yes, you rascal, I do!
          emotion: angry
        - id: ch02-b20
          speaker: jack
          text: Then please hand me one pound, thirteen shillings, and fourpence.
        - id: ch02-b21
          speaker: gray_churl
          text: One devil and thirteen imps! What would I pay you for?
        - id: ch02-b22
          speaker: jack
          text: Ah, you have forgotten the bargain. Do you regret it?
        - id: ch02-b23
          speaker: gray_churl
          text: Oh, ye—no, I mean! I will pay you after your nap.
    - id: ch03
      title: Jack Takes Every Word Literally
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Early the next morning, Jack asked what work he should do.
        - id: ch03-b02
          speaker: gray_churl
          text: Hold the plough in that fallow field beyond the paddock.
        - id: ch03-b03
          speaker: narrator
          text: At about nine, the master went to judge Jack's ploughing. The little boy was driving the beasts. The ploughshare and blade skimmed over the grass without cutting it, while Jack pulled with all his strength against the horses as they tried to move ahead.
        - id: ch03-b04
          speaker: gray_churl
          text: What are you doing, you contrary thief?
          emotion: angry
        - id: ch03-b05
          speaker: jack
          text: Am I not trying to hold this devil of a plough, just as you told me? But that blockhead of a boy keeps whipping the beasts on, no matter what I say. Will you speak to him?
        - id: ch03-b06
          speaker: gray_churl
          text: No, but I will speak to you! When I said to hold the plough, did you not know I meant to turn the soil?
          emotion: angry
        - id: ch03-b07
          speaker: jack
          text: If that was your meaning, you should have said so. Do you blame me for what I did?
        - id: ch03-b08
          speaker: narrator
          text: The master stopped himself just in time. He was too furious to answer.
        - id: ch03-b09
          speaker: gray_churl
          text: Go on now, you knave. Turn the soil the way any other ploughman would.
        - id: ch03-b10
          speaker: jack
          text: And do you regret our agreement?
        - id: ch03-b11
          speaker: gray_churl
          text: Oh, not at all. Not at all!
        - id: ch03-b12
          speaker: narrator
          text: Jack spent the rest of the day ploughing as well as any good workman.
        - id: ch03-b13
          speaker: narrator
          text: A day or two later, the master sent him to watch the cows in a field where young wheat grew over half the ground.
        - id: ch03-b14
          speaker: gray_churl
          text: Above all, keep Browney out of the wheat. If she stays out of trouble, you need not fear the others.
        - id: ch03-b15
          speaker: narrator
          text: At noon, the Gray Churl came to see how Jack was doing. Jack lay asleep with his face against the ground. Browney grazed beside a thorn tree, tied to it by a long rope around her horns. Every other cow was trampling and eating the green wheat. The master's switch came down on Jack.
        - id: ch03-b16
          speaker: gray_churl
          text: Jack, you vagabond! Can you see what those cows are doing?
          emotion: angry
        - id: ch03-b17
          speaker: jack
          text: And do you blame me, master?
        - id: ch03-b18
          speaker: gray_churl
          text: Of course I do, you lazy sluggard!
          emotion: angry
        - id: ch03-b19
          speaker: jack
          text: Then hand me one pound, thirteen shillings, and fourpence. You said the others would do no harm if I kept Browney from mischief. There she stands, harmless as a lamb. Do you regret hiring me?
        - id: ch03-b20
          speaker: gray_churl
          text: Of cour—that is, not at all. I will pay at dinner. Now listen. For the rest of today, no cow is to leave this field or enter the wheat.
        - id: ch03-b21
          speaker: jack
          text: Never fear, master.
        - id: ch03-b22
          speaker: narrator
          text: Jack obeyed him exactly. But the Gray Churl would have given a great deal never to have hired him.
    - id: ch04
      title: Likely Places and Unlikely Ones
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The next day, three heifers went missing, and the master ordered Jack to go in search of them.
        - id: ch04-b02
          speaker: jack
          text: Where should I look?
        - id: ch04-b03
          speaker: gray_churl
          text: Everywhere they are likely to be, and everywhere they are unlikely to be.
        - id: ch04-b04
          speaker: narrator
          text: The Gray Churl was learning to choose his words carefully. Yet when he came into the farmyard at dinner, Jack was tearing great armfuls of thatch from the roof. Each time he opened another hole, he bent down and peered inside it.
        - id: ch04-b05
          speaker: gray_churl
          text: What are you doing up there, you rascal?
          emotion: angry
        - id: ch04-b06
          speaker: jack
          text: Why, I am looking for the poor heifers!
        - id: ch04-b07
          speaker: gray_churl
          text: What could possibly bring them onto my roof?
        - id: ch04-b08
          speaker: jack
          text: I doubt anything could. First I searched the likely places—the cow sheds, the pastures, and the nearby fields. Now I am searching the unlikeliest place I know. Perhaps that does not please you.
        - id: ch04-b09
          speaker: gray_churl
          text: Of course it does not please me, you maddening fool!
          emotion: angry
        - id: ch04-b10
          speaker: jack
          text: Then please pay me one pound, thirteen shillings, and fourpence before you eat. I fear you regret ever hiring me.
        - id: ch04-b11
          speaker: gray_churl
          text: May the dev—oh no, I do not regret it! Now put the thatch back as carefully as if this were your mother's cabin.
        - id: ch04-b12
          speaker: jack
          text: Gladly, sir. With all my heart.
        - id: ch04-b13
          speaker: narrator
          text: By the time the farmer finished dinner, Jack had replaced the thatch and left the roof better than before. He had made the boy bring him fresh straw instead of putting back the old.
        - id: ch04-b14
          speaker: gray_churl
          text: Go and search for those heifers now, Jack, and bring them home.
        - id: ch04-b15
          speaker: jack
          text: And where shall I search this time?
        - id: ch04-b16
          speaker: gray_churl
          text: Look for them as if they belonged to you.
        - id: ch04-b17
          speaker: narrator
          text: All three heifers were back in the paddock before sunset.
        - id: ch04-b18
          speaker: narrator
          text: The next morning, the master had another order.
        - id: ch04-b19
          speaker: gray_churl
          text: The bog path to the pasture is terrible. The sheep sink at every step. Go and make the sheep's feet a good path.
        - id: ch04-b20
          speaker: narrator
          text: An hour later, the master reached the bog. The sheep stood and grazed nearby, while Jack sharpened a carving knife.
        - id: ch04-b21
          speaker: gray_churl
          text: Is this how you mend a path, Jack?
        - id: ch04-b22
          speaker: jack
          text: Everything needs a beginning, master, and a good beginning is half the work. I am sharpening this knife. I will have every foot off every sheep before you can bless yourself.
        - id: ch04-b23
          speaker: gray_churl
          text: Cut the feet off my sheep? You wicked rogue! Why would you do that?
          emotion: angry
        - id: ch04-b24
          speaker: jack
          text: To mend the path, as you ordered. You told me to make a path with the sheep's feet.
        - id: ch04-b25
          speaker: gray_churl
          text: You fool! I meant repair the path so the sheep could walk on it.
        - id: ch04-b26
          speaker: jack
          text: What a pity you did not say so. If you will not let me finish, hand me one pound, thirteen shillings, and fourpence.
        - id: ch04-b27
          speaker: gray_churl
          text: Devil take you and your pound, thirteen shillings, and fourpence!
        - id: ch04-b28
          speaker: jack
          text: Praying is better than cursing, master. Could it be that you regret our bargain?
        - id: ch04-b29
          speaker: gray_churl
          text: Of course I do—not yet, anyway!
    - id: ch05
      title: Three Sheep's Eyes
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The following night, the master was going to a wedding. Before leaving, he gave Jack his instructions.
        - id: ch05-b02
          speaker: gray_churl
          text: I will leave at midnight. Come and help me home, in case the drink overcomes me. If you arrive before I am ready, throw a sheep's eye at me. I will see that they give you a drink of your own.
        - id: ch05-b03
          speaker: narrator
          text: At about eleven, while the master was enjoying himself among the wedding guests, something wet and clammy struck his cheek. It fell beside his glass. It was a sheep's eye. He could not imagine who had thrown it or why. Soon another sheep's eye struck his other cheek. He was furious, but decided it was better to keep quiet.
        - id: ch05-b04
          speaker: narrator
          text: Two minutes later, the master opened his mouth for a sip, and a third sheep's eye slapped straight into it. He spat it out.
        - id: ch05-b05
          speaker: gray_churl
          text: Man of the house, is it not shameful to let someone in this room do such a filthy thing?
          emotion: disgusted
        - id: ch05-b06
          speaker: jack
          text: Do not blame the honest man, master. I threw those sheep's eyes. I wanted you to remember I was here, so I could drink the bride and bridegroom's health. You told me to do it yourself.
        - id: ch05-b07
          speaker: gray_churl
          text: You are a terrible rascal! Where did you get those eyes?
          emotion: angry
        - id: ch05-b08
          speaker: jack
          text: Where else would I get them but from your own sheep? Would you have me touch a neighbour's animals and be thrown into jail for it?
        - id: ch05-b09
          speaker: gray_churl
          text: Sorrow on me for the bad luck that ever brought you across my path!
        - id: ch05-b10
          speaker: jack
          text: You all heard him. My master says he is sorry he ever met me. My service is finished. Master, pay me double wages. Then come into the next room and lie down decently while I cut a strip of skin an inch wide from your shoulder to your hip.
        - id: ch05-b11
          speaker: narrator
          text: Everyone shouted against it. Jack answered them at once.
        - id: ch05-b12
          speaker: jack
          text: None of you stopped him when he cut the same strips from my two brothers. He sent them home helpless and without a penny to our poor mother.
        - id: ch05-b13
          speaker: narrator
          text: Once the wedding guests heard the whole truth, they were eager to see the bargain carried out. The master yelled and roared, but no help came. They stripped him to the hips and laid him on the floor in the next room. Jack stood ready with the carving knife.
    - id: ch06
      title: Skin Churl Jack
      blocks:
        - id: ch06-b01
          speaker: jack
          text: Now, you cruel old villain, I will offer you a choice. Give me my double wages and two hundred guineas to support my poor brothers, and I will spare you the strip of skin.
        - id: ch06-b02
          speaker: narrator
          text: Jack scraped the knife twice along the floor.
        - id: ch06-b03
          speaker: gray_churl
          text: No! I would sooner let you skin me from head to foot.
        - id: ch06-b04
          speaker: jack
          text: Then here I go.
        - id: ch06-b05
          speaker: narrator
          text: Jack grinned and made the first tiny cut. The Gray Churl roared.
        - id: ch06-b06
          speaker: gray_churl
          text: Stop your hand! I will pay the money!
          emotion: fearful
        - id: ch06-b07
          speaker: jack
          text: Now, neighbours, do not think me worse than I deserve. I would not have the heart to take the eye from a rat. I bought half a dozen sheep's eyes from the butcher, and I used only three.
        - id: ch06-b08
          speaker: narrator
          text: Everyone returned to the wedding room. Jack was given a seat among the company. One after another, the guests drank his health. Then Jack raised his own glass and drank the health of everyone there in a single toast.
        - id: ch06-b09
          speaker: narrator
          text: Six strong men escorted Jack and the master home. They waited in the parlour while the Gray Churl went upstairs and brought down two hundred guineas, along with Jack's double wages.
        - id: ch06-b10
          speaker: narrator
          text: When Jack reached home, it was as if he brought summer with him to his poor mother and his disabled brothers.
        - id: ch06-b11
          speaker: narrator
          text: After that, no one called him Jack the Fool. From then on, he was Skin Churl Jack.
