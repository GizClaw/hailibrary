audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    king_otoole:
      display_name: 奥图尔国王
      tts:
        delivery: 豪爽率直，年老时仍带着猎人的热烈和乡野幽默
        timbre: 苍老浑厚
        pace: 中速
        pitch: 中低音
    saint_kavin:
      display_name: 圣凯文
      tts:
        delivery: 从容机敏，话里带着善意的试探和自信
        timbre: 清朗温厚
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 年老的国王与鹅
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 哎呀，我原以为，远近天下人人都听说过奥图尔国王。看来世人孤陋寡闻起来，还真是说也说不尽。既然您从前没听过，我就从头讲吧。很久很久以前，有位国王名叫奥图尔。那是位顶好的老国王。早年间，那些教堂可都是他的。这位国王是条真正的好汉，把打猎玩乐看得和性命一样重，尤其喜欢狩猎。每天太阳刚一升起，他便起身出发，翻山越岭地追赶鹿群。那时候的日子，别提有多快活了。
        - id: ch01-b02
          speaker: narrator
          text: 国王身子硬朗的时候，一切自然好得很。可是年深日久，他老了，四肢也慢慢僵硬。上了年纪以后，他再也不能打猎。没了消遣，他的心气也垮了，连活着都觉得没意思。说真的，可怜的国王最后只好养一只鹅给自己解闷。您爱笑就笑吧，这可是真事。那只鹅会游过整片湖面，潜到水下捉鳟鱼。每逢星期五，它给国王弄鱼吃。其他日子，它就绕着湖飞来飞去，逗主人开心。
        - id: ch01-b03
          speaker: narrator
          text: 日子一直过得挺好。后来，鹅也跟主人一样老了，再没法逗他开心。可怜的国王这下彻底没了指望。一天早晨，他独自沿着湖边走，一面哀叹自己的命苦，一面想着，人生既然再没一点乐趣，还不如投湖算了。就在这时，他突然转过一道弯，迎面来了一个十分体面的年轻人，正朝他走来。
        - id: ch01-b04
          speaker: king_otoole
          text: 愿上帝保佑你。
        - id: ch01-b05
          speaker: saint_kavin
          text: 也愿上帝厚厚地保佑您，奥图尔国王。
        - id: ch01-b06
          speaker: king_otoole
          text: 让你说中了。我就是奥图尔国王，是这一带的亲王兼全权大掌事。可你怎么认得我？
        - id: ch01-b07
          speaker: saint_kavin
          text: 噢，这个您就别问了。
        - id: ch01-b08
          speaker: narrator
          text: 您听出来了吧，这年轻人正是圣凯文。圣人亲自改换装束来到这里，不是别人。
        - id: ch01-b09
          speaker: saint_kavin
          text: 我知道的事情还多着呢。容我冒昧问一句，奥图尔国王，您的鹅近来怎么样？
        - id: ch01-b10
          speaker: king_otoole
          text: 老天爷呀，你怎么连我的鹅也知道？
          emotion: surprised
        - id: ch01-b11
          speaker: saint_kavin
          text: 没什么，有人把这事告诉了我。
    - id: ch02
      title: 一桩买卖
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两人又谈了几句，国王忍不住问起年轻人的来历。
        - id: ch02-b02
          speaker: king_otoole
          text: 你究竟是做什么的？
        - id: ch02-b03
          speaker: saint_kavin
          text: 我是个老实人。
        - id: ch02-b04
          speaker: king_otoole
          text: 那么，老实人，你怎么能这么轻松地挣钱？
        - id: ch02-b05
          speaker: saint_kavin
          text: 我有办法让旧东西恢复如新。
        - id: ch02-b06
          speaker: king_otoole
          text: 这么说，你是补锅匠？
        - id: ch02-b07
          speaker: saint_kavin
          text: 我可不靠补锅吃饭，奥图尔国王。我的手艺比那高明。要是我能让您的老鹅返老还童，您觉得怎么样？
        - id: ch02-b08
          speaker: narrator
          text: 亲爱的，一听说老鹅能返老还童，可怜的老国王两只眼睛都快跳出眼眶了。他立刻吹了声口哨，那只可怜的鹅便像猎犬一样跑下来，摇摇摆摆地走到跛脚的主人身边。一个是衰老的鹅，一个是跛脚的国王，主仆俩真像一个豆荚里的两颗豆子。圣凯文刚把目光落到鹅身上，便答应接下这桩活儿。
        - id: ch02-b09
          speaker: king_otoole
          text: 凭天发誓！你要真能办到，我就说你是方圆七个教区里最有本事的人。
        - id: ch02-b10
          speaker: saint_kavin
          text: 哎呀，说真的，那可不够。您得拿出比一句夸奖更多的好处。我还没傻到白白替您医好老鹅。要是我把这活儿办成了，您究竟肯拿什么给我？咱们先把话说到明处。
        - id: ch02-b11
          speaker: king_otoole
          text: 你要什么，我就给什么。这样总公道吧？
        - id: ch02-b12
          speaker: saint_kavin
          text: 再公道不过，这才是谈生意的办法。听好啦，奥图尔国王，我想跟您定下这样一桩买卖。等我把鹅变得和新的一样，它头一回飞过的全部土地都归我。您肯答应吗？
        - id: ch02-b13
          speaker: king_otoole
          text: 我答应。
        - id: ch02-b14
          speaker: saint_kavin
          text: 您不会反悔？
        - id: ch02-b15
          speaker: king_otoole
          text: 一言为定！
        - id: ch02-b16
          speaker: narrator
          text: 国王说着，伸出了拳头。
        - id: ch02-b17
          speaker: saint_kavin
          text: 一言为定，这买卖成交了。过来吧，你这倒霉的老跛子。我来让你重新变成一只矫健的飞鸟。
    - id: ch03
      title: 鹅又飞起来了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 圣凯文抓起鹅的两只翅膀，说要用自己十字架的圣号祝福它。他说话的同时，在鹅身上画下神圣的十字。接着，他把鹅往空中一抛，又呼地吹了一口气，助它一把。我的宝贝，那只鹅顿时撒开腿飞了起来。它像雄鹰一样冲上天空，又像暴雨来临前的燕子，在空中翻出不知多少花样。
        - id: ch03-b02
          speaker: narrator
          text: 好啦，亲爱的，那景象可真美。国王张大嘴巴站在那里，仰头望着自己那只可怜的老鹅。它飞得像云雀一样轻盈，比从前任何时候都更出色。等它稳稳落在国王脚边，国王弯下腰，满心欢喜地摸了摸它的脑袋。
        - id: ch03-b03
          speaker: king_otoole
          text: 我的心肝宝贝呀，你真是全世界最可爱的宝儿。
          emotion: happy
        - id: ch03-b04
          speaker: saint_kavin
          text: 我把它变成了这样，您有什么话对我说？
        - id: ch03-b05
          speaker: king_otoole
          text: 天哪，我只能说，除了蜜蜂的本事，没有什么胜得过人的手艺。
        - id: ch03-b06
          speaker: saint_kavin
          text: 您就只说这些？
        - id: ch03-b07
          speaker: king_otoole
          text: 还要说，我欠你一份大恩。
        - id: ch03-b08
          speaker: saint_kavin
          text: 那么，鹅刚才飞过的土地，您肯全给我吗？
        - id: ch03-b09
          speaker: king_otoole
          text: 我肯，全都送给你。哪怕那是我仅剩的最后一亩地，我也心甘情愿。
        - id: ch03-b10
          speaker: saint_kavin
          text: 您会守住诺言吧？
        - id: ch03-b11
          speaker: king_otoole
          text: 我的诺言像天上的太阳一样真。
        - id: ch03-b12
          speaker: saint_kavin
          text: 奥图尔国王，幸亏您说了这句话。不然，您的鹅休想再飞动一丁点儿。
    - id: ch04
      title: 圣人的真面目
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 国王果然照约定，把鹅飞过的每一片土地都给了圣凯文，一亩也没有留下。圣凯文见他这样信守诺言，心里很满意，这才决定向国王显出真正的身份。
        - id: ch04-b02
          speaker: saint_kavin
          text: 奥图尔国王，您是个正派人。我特意来到这里，只是为了试试您会不会守住诺言。您一直没有认出我，那是因为我改换了自己的装束。
        - id: ch04-b03
          speaker: king_otoole
          text: 哎哟！那么，你到底是谁？
          emotion: surprised
        - id: ch04-b04
          speaker: saint_kavin
          text: 我是圣凯文。
        - id: ch04-b05
          speaker: narrator
          text: 圣人说出自己的名字，同时在胸前画了个十字。国王听见以后，也赶紧在双眼之间画着十字，扑通一声跪倒在圣人面前。
        - id: ch04-b06
          speaker: king_otoole
          text: 天后圣母呀！原来您就是伟大的圣凯文！我竟跟您谈了这么久，一直把您当成一个普普通通的毛头小伙子。您真是一位圣人？
          emotion: surprised
        - id: ch04-b07
          speaker: saint_kavin
          text: 正是。
        - id: ch04-b08
          speaker: king_otoole
          text: 天哪，我还以为自己只是在跟一个挺不错的小伙子说话。
        - id: ch04-b09
          speaker: saint_kavin
          text: 好啦，现在您总算知道其中的分别了。我就是圣凯文，是所有圣人当中最伟大的一位。
    - id: ch05
      title: 星期五的马鳗
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 就这样，国王的鹅真的恢复如新。只要国王还活着，它就一直陪伴在他身边，替他解闷。圣人得到了鹅飞过的土地，也照我方才说的，一直供养着国王，直到他去世的那一天。
        - id: ch05-b02
          speaker: narrator
          text: 不过，那一天没过多久就来了。一个星期五，可怜的鹅照常下水，想给国王捉一条鳟鱼当晚餐。它以为自己已经捉到了，可我的宝贝，它弄错了。水里的东西根本不是鳟鱼，而是一条该死的偷儿马鳗。鹅没能杀掉鳟鱼给国王做晚餐，倒让那条鳗鱼把自己杀死了。这也怪不得鳗鱼。不过，鳗鱼终究没有把鹅吃掉。圣凯文曾把蒙福的双手按在这只鹅身上，它可不敢下嘴。
