audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, legendary, and composed
        timbre: rich and clear
        pace: measured
        pitch: medium
    king_otoole:
      display_name: King O'Toole
      tts:
        delivery: hearty, candid, and humorously grand
        timbre: weathered and full
        pace: unhurried
        pitch: medium-low
    saint_kavin:
      display_name: Saint Kavin
      tts:
        delivery: assured, playful, and quietly commanding
        timbre: clear and mellow
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: The King and His Goose
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Och, I thought everyone, near and far, had heard of King O'Toole. Well, well, there is no telling how little mankind knows! Since you haven't heard the tale before, you must understand that King O'Toole was a fine old king in the ancient days, long ago. In those early times, it was he who owned the churches. And the king was the right sort. He was a grand fellow who loved sport as dearly as he loved life, and hunting most of all. The moment the sun rose, up he got. Then off he went over the mountains after the deer. Ah, those were fine times.
        - id: ch01-b02
          speaker: narrator
          text: It all went very well while the king had his health. But time passed, and the king grew old. His limbs turned stiff, and as the years weighed on him, his heart began to fail. He was utterly lost without any sport because he could not go hunting anymore. At last, the poor king had to get a goose to amuse him. Oh, laugh if you like, but I am telling you the truth. Here is how she did it. The goose would swim across the lake and dive for trout. Every Friday she caught a fish for the king. On every other day, she flew all around the lake, and the poor king watched her for his amusement.
        - id: ch01-b03
          speaker: narrator
          text: That went on splendidly for a long while. Then the goose grew old, just like her master, and she could amuse him no longer. Once again, the poor king felt completely lost. One morning he walked along the edge of the lake, grieving over his cruel luck. Life held no amusement for him now, and he was even thinking of drowning himself. All at once, he turned a corner and found a very respectable young man walking toward him.
    - id: ch02
      title: A Stranger by the Lake
      blocks:
        - id: ch02-b01
          speaker: king_otoole
          text: God save you.
        - id: ch02-b02
          speaker: saint_kavin
          text: And God save you kindly, King O'Toole.
        - id: ch02-b03
          speaker: king_otoole
          text: True enough, I am King O'Toole, prince and plennypennytinchery of these parts. But how did you know me?
        - id: ch02-b04
          speaker: saint_kavin
          text: Oh, never mind that.
        - id: ch02-b05
          speaker: narrator
          text: Now, this young man was Saint Kavin himself. Yes, the very saint, and nobody else. But he had come in disguise, so the king had no idea who stood before him.
        - id: ch02-b06
          speaker: saint_kavin
          text: Never mind how I know. I know more than that. If I may ask, King O'Toole, how is your goose?
        - id: ch02-b07
          speaker: king_otoole
          text: Blur-an-agers! How did you hear about my goose?
          emotion: surprised
        - id: ch02-b08
          speaker: saint_kavin
          text: Oh, that doesn't matter. Someone gave me word of her.
        - id: ch02-b09
          speaker: narrator
          text: The two of them went on talking for a little while. At last, the king looked at the stranger and asked him what sort of man he was.
        - id: ch02-b10
          speaker: saint_kavin
          text: I'm an honest man.
        - id: ch02-b11
          speaker: king_otoole
          text: Well then, honest man, how do you earn your money so easily?
        - id: ch02-b12
          speaker: saint_kavin
          text: I make old things as good as new.
        - id: ch02-b13
          speaker: king_otoole
          text: So you're a tinker, are you?
        - id: ch02-b14
          speaker: saint_kavin
          text: No, King O'Toole, tinkering isn't my trade. I have a better one. What would you say if I made your old goose as good as new?
        - id: ch02-b15
          speaker: narrator
          text: My dear, the moment he heard that his goose could be made as good as new, the poor old king's eyes looked ready to jump from his head. He gave a whistle. Down came the poor goose, just like a hound answering its master. She waddled over to the poor crippled king, and the old goose and her old master looked as much alike as two peas. The instant the saint set eyes on her, he knew what to say.
        - id: ch02-b16
          speaker: saint_kavin
          text: King O'Toole, I'll do the job for you.
    - id: ch03
      title: The Bargain
      blocks:
        - id: ch03-b01
          speaker: king_otoole
          text: By Jaminee! If you do that, I'll call you the cleverest fellow in all seven parishes.
        - id: ch03-b02
          speaker: saint_kavin
          text: Oh, by dad, you'll have to offer more than praise. I'm not such a soft fool that I would mend your old goose for nothing at all. What will you give me if I do this job for you? That is the real question.
        - id: ch03-b03
          speaker: king_otoole
          text: Whatever you ask. Isn't that fair?
        - id: ch03-b04
          speaker: saint_kavin
          text: Devil a thing could be fairer. That is the proper way to do business. Now listen to the bargain I will make with you, King O'Toole. After I make the goose as good as new, will you give me all the ground she flies over on her very first flight?
        - id: ch03-b05
          speaker: king_otoole
          text: I will.
        - id: ch03-b06
          speaker: saint_kavin
          text: And you won't take back your word?
        - id: ch03-b07
          speaker: narrator
          text: King O'Toole held out his fist.
        - id: ch03-b08
          speaker: king_otoole
          text: Honour bright!
        - id: ch03-b09
          speaker: saint_kavin
          text: Honour bright, then. We have a bargain. Come here, you poor old crippled goose. I'll make a sporting bird of you yet.
        - id: ch03-b10
          speaker: narrator
          text: With that, my dear, Saint Kavin lifted the goose by her two wings. He said a holy word over her and marked her with the blessed sign at that very moment. Then he threw her high into the air. He gave a quick whistle, just one little blast to help her along. Away she went, flying like one of the eagles themselves and cutting as many capers as a swallow before a shower of rain.
        - id: ch03-b11
          speaker: narrator
          text: Well, my dear, it was a beautiful sight. The king stood there with his mouth wide open and watched his poor old goose soar as lightly as a lark. She flew even better than she ever had in her younger days. At last she came down and landed right at his feet. The delighted king bent over and patted her on the head.
        - id: ch03-b12
          speaker: king_otoole
          text: Ma vourneen, you're the darling of the world.
          emotion: happy
    - id: ch04
      title: The King's Word
      blocks:
        - id: ch04-b01
          speaker: saint_kavin
          text: And what do you say to me for making her like that?
        - id: ch04-b02
          speaker: king_otoole
          text: By Jabers, nothing beats a man's skill, except the bees.
        - id: ch04-b03
          speaker: saint_kavin
          text: Is that all you have to say?
        - id: ch04-b04
          speaker: king_otoole
          text: And I'm grateful to you.
        - id: ch04-b05
          speaker: saint_kavin
          text: But will you give me all the ground the goose flew over?
        - id: ch04-b06
          speaker: king_otoole
          text: I will, and you're welcome to it, though it is the last acre I own.
        - id: ch04-b07
          speaker: saint_kavin
          text: You'll keep your word faithfully?
        - id: ch04-b08
          speaker: king_otoole
          text: As faithfully as the sun.
        - id: ch04-b09
          speaker: saint_kavin
          text: It is well for you that you gave me your word, King O'Toole. If you had refused to say it, then devil a bit of your goose would ever have flown again.
        - id: ch04-b10
          speaker: narrator
          text: King O'Toole proved as good as his word and gave Saint Kavin the ground. That pleased the saint. Once the bargain was honestly fulfilled, Saint Kavin decided to let the king know who he truly was.
        - id: ch04-b11
          speaker: saint_kavin
          text: King O'Toole, you're a decent man. I came only to test you. You didn't recognize me because I was disguised.
        - id: ch04-b12
          speaker: king_otoole
          text: Musha, then who are you?
        - id: ch04-b13
          speaker: saint_kavin
          text: I am Saint Kavin.
        - id: ch04-b14
          speaker: narrator
          text: As Saint Kavin spoke, he blessed himself. The king cried out to the queen of heaven. He made the sign of the cross between his eyes, then fell straight down on his knees before the saint.
        - id: ch04-b15
          speaker: king_otoole
          text: Queen of heaven! Have I been talking all this time to the great Saint Kavin without knowing it? I treated you just like some young lad. So you truly are a saint?
          emotion: surprised
        - id: ch04-b16
          speaker: saint_kavin
          text: I am.
        - id: ch04-b17
          speaker: king_otoole
          text: By Jabers, I thought I was only talking with a decent young fellow.
        - id: ch04-b18
          speaker: saint_kavin
          text: Well, now you know the difference. I am Saint Kavin, the greatest of all the saints.
    - id: ch05
      title: The Goose's Last Catch
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: And so King O'Toole had his goose as good as new. She went on amusing him for as long as he lived. Once Saint Kavin came into possession of the promised land, he supported the king from then until the day of his death, just as I told you.
        - id: ch05-b02
          speaker: narrator
          text: And that day came soon after. One Friday, the poor goose thought she was catching a trout. But, my jewel, she had made a mistake. What she caught was a thieving horse-eel. So instead of the goose killing a trout for the king's supper, by dad, the eel killed the king's goose. Small blame to him. But he did not eat her afterward, because he dared not eat anything Saint Kavin had laid his blessed hands upon.
