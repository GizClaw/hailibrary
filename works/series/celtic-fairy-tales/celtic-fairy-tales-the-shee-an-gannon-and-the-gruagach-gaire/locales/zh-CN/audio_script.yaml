audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    shee_an_gannon:
      display_name: 希安·甘农
      tts:
        delivery: 勇敢果断，面对强敌时毫不退缩
        timbre: 年轻坚实
        pace: 中速
        pitch: 中音
    king_of_erin:
      display_name: 爱尔兰国王
      tts:
        delivery: 威严冷峻，裁断事情时不容争辩
        timbre: 浑厚沉稳
        pace: 稍慢
        pitch: 中低音
    gruagach_gaire:
      display_name: 会笑的格鲁阿加赫
      tts:
        delivery: 饱经创痛，平日低沉克制，重获亲人时豁然开朗
        timbre: 苍劲宽厚
        pace: 从容
        pitch: 低音
    five_headed_giant:
      display_name: 五头巨人
      tts:
        delivery: 凶蛮自大，威吓别人时粗暴张扬
        timbre: 粗砺轰响
        pace: 稍慢
        pitch: 低音
    yellow_face:
      display_name: 黄脸
      tts:
        delivery: 阴狠狡诈，受到挑战时尖厉暴躁
        timbre: 干冷刺耳
        pace: 中速
        pitch: 中高音
  chapters:
    - id: ch01
      title: 十二根铁刺
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 希安·甘农早晨出生，中午有了名字。到了傍晚，他已经来到爱尔兰国王面前，要娶国王的女儿。
        - id: ch01-b02
          speaker: king_of_erin
          text: 我可以把女儿嫁给你，但你得先带回我要的答案。会笑的格鲁阿加赫从前总是笑个不停，笑声震天，全世界都听得见。你要查出究竟是什么止住了他的笑声。花园里有十二根铁刺，十一根已经插着求婚王子的头。他们全都没找到答案。你若也空手回来，第十二根铁刺上就是你的头。
        - id: ch01-b03
          speaker: narrator
          text: 希安·甘农听完一言不发，辞别国王，立刻去寻找答案。他要亲自弄清，究竟是什么让格鲁阿加赫沉默。一路上，他一步跨过一道山谷，一跃翻过一座山丘，整整赶了一天的路。直到傍晚，他才看见一所房子。屋主人迎出来，问这个陌生的年轻人是做什么的。
        - id: ch01-b04
          speaker: shee_an_gannon
          text: 我是来找活儿干的。
        - id: ch01-b05
          speaker: gruagach_gaire
          text: 那正好。我缺一个放牛人。你肯留下，就能吃上世上最好的饭菜，晚上也有柔软的床睡。
        - id: ch01-b06
          speaker: narrator
          text: 希安·甘农答应留下做工，先坐下来吃了一顿晚饭。饭后，主人这才说出自己的身份。他正是会笑的格鲁阿加赫。既然年轻人已经成了他的雇工，也吃饱了肚子，当晚便可以睡在丝绸铺成的床上。
        - id: ch01-b07
          speaker: gruagach_gaire
          text: 明早把我的五头金牛和无角公牛赶去吃草。记住，千万别让它们靠近巨人的领地。
    - id: ch02
      title: 五头巨人的舌头
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天早饭过后，希安·甘农解开五头金牛和无角公牛，赶着它们去吃草。巨人的土地长满密林，四面还围着高墙。他偏偏走到墙下，用后背抵住石墙，猛一发力，将好长一段墙推倒在里面。接着他跨进去，又把另一大段墙推向外边，随后故意将六头牛都赶上巨人的土地。
        - id: ch02-b02
          speaker: narrator
          text: 他自己爬上一棵苹果树，摘下甜苹果慢慢吃，把酸苹果全扔给格鲁阿加赫的牛群。不久，树林深处传来一阵轰隆隆的巨响。一路上，小树被压得弯腰，老树一棵棵折断。希安·甘农回头望去，只见一个五头巨人从密林里硬闯出来，转眼已经站到树前。
        - id: ch02-b03
          speaker: five_headed_giant
          text: 你这倒霉虫，竟敢跑来我的地盘捣乱！一口吞你太大，两口吃你又太小。没别的办法，我只好把你撕碎。
        - id: ch02-b04
          speaker: shee_an_gannon
          text: 你这恶心的畜生，我根本不怕你！
        - id: ch02-b05
          speaker: narrator
          text: 希安·甘农跳下树，两人立刻扑向对方。那场搏斗的声势惊天动地，仿佛世间万物都停下来观看，也都竖起耳朵听着。两人一直打到午后将尽，巨人才渐渐占了上风。希安·甘农心想，自己若死在这里，父母永远找不到他，也再不能看他一眼，他更不可能娶到爱尔兰国王的女儿。这个念头一闪过，他的心又变得强壮，浑身重新有了力气。
        - id: ch02-b06
          speaker: narrator
          text: 他猛扑上去，抱紧巨人又挤又撞。第一下，巨人陷进坚硬的土地，泥土没到膝盖。第二下，陷到了腰间。第三下撞下去，巨人的身子已经埋到肩头。
        - id: ch02-b07
          speaker: shee_an_gannon
          text: 总算抓住你了。这回你完蛋啦！
        - id: ch02-b08
          speaker: narrator
          text: 希安·甘农拔出刀，接连砍掉巨人的五颗脑袋。他又从每颗头里割出舌头，把头颅全都扔过高墙，只将五条舌头收进口袋。做完这些，他赶着牛群回家。那天傍晚，五头金牛产出的奶多得惊人，格鲁阿加赫找遍自己的庄园，也凑不够容器来盛。
        - id: ch02-b09
          speaker: narrator
          text: 可希安·甘农还在赶牛回家的路上，蒂尚国王的儿子就来到墙外，捡走了巨人的五颗头颅。那人准备冒领功劳，声称等格鲁阿加赫重新发笑，自己便有资格迎娶公主。晚饭过后，希安·甘农对主人只字不提白天的事。他把心思藏在心里，独自回到丝绸床上睡了。
        - id: ch02-b10
          speaker: narrator
          text: 第二天，他比主人醒得更早，一见面便直问那桩秘密。
        - id: ch02-b11
          speaker: shee_an_gannon
          text: 你从前笑得全世界都听得见，后来为什么不笑了？
        - id: ch02-b12
          speaker: gruagach_gaire
          text: 原来是爱尔兰国王的女儿派你来的，真叫人遗憾。
          emotion: sad
        - id: ch02-b13
          speaker: shee_an_gannon
          text: 你若不肯说，我就逼你开口。
        - id: ch02-b14
          speaker: narrator
          text: 说罢，他摆出一副骇人的脸色，像疯子似的冲遍屋子，想找一样能让格鲁阿加赫吃足苦头的东西。最后，他看见墙上挂着几根生羊皮绳，便一把扯了下来。他抓住格鲁阿加赫，绕着腰、腰眼和腹股沟牢牢捆紧，直绑得他的小脚趾几乎能凑到耳边说悄悄话。
        - id: ch02-b15
          speaker: gruagach_gaire
          text: 放开我吧。我告诉你，我为什么再也笑不出来。
    - id: ch03
      title: 格鲁阿加赫的伤心事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 希安·甘农解开绳子。两人并肩坐下，格鲁阿加赫说起从前的事。
        - id: ch03-b02
          speaker: gruagach_gaire
          text: 从前，我和十二个儿子一同住在这座城堡里。我们吃饭、喝酒、打牌，日子过得十分畅快。一天，正当我们玩牌的时候，一只细瘦的棕兔忽然冲进屋。它跳上壁炉，把炉灰一直扬到屋梁那么高，随后转身逃走了。
        - id: ch03-b03
          speaker: gruagach_gaire
          text: 又有一天，它再次闯进来。这回我和十二个儿子早有准备。它刚扬完炉灰跑掉，我们便追了出去，一直追到天黑。兔子钻进一道山谷，我们看见前方有光。我跑在最前面，来到一所房子。里面有个宽敞的大厅，住着黄脸和他的十二个女儿。那只兔子就拴在大厅一侧，紧靠着姑娘们。火上架着一口大锅，里面煮着一只硕大的鹳。黄脸只叫我带着儿子们去大厅尽头，坐到几捆灯心草旁边。
        - id: ch03-b04
          speaker: gruagach_gaire
          text: 黄脸走进隔壁房间，拿来一支铁矛和一支木矛，让我自己挑选。我担心有人突然袭击，觉得铁矛更能防身，便选了铁的。他还让我先从锅里挑肉，可铁矛只能挑出小小一片。黄脸用木矛一伸，竟取走了其余全部。那一夜，我们只能饿着肚子。黄脸和十二个女儿吃完鹳肉，又把啃光的骨头朝我和儿子们脸上砸来。我们无处可逃，只能整夜挨打。
        - id: ch03-b05
          speaker: gruagach_gaire
          text: 第二天早晨，我们正要离开，黄脸却叫我稍等。他从隔壁拿出十二只铁套索和一只木套索，要我选择。要么让十二个儿子把头伸进铁套索，要么我自己戴上木套索。我只想保住自己的脑袋，就选了十二只铁的。黄脸把铁套索套住我儿子们的脖子，自己却戴上木的。随后，他一只接一只猛收铁环，砍下十二颗头，将头颅和尸身统统扔到屋外。木套索却丝毫没有伤到他。
        - id: ch03-b06
          speaker: gruagach_gaire
          text: 杀死我的儿子以后，黄脸又一把抓住我，从后腰往下剥掉我的皮肉。他取下墙上挂了整整七年的一张黑羊皮，拍在我身上，拿它替代原来的皮肉。那张羊皮竟就此长牢了。从那以后，我每年都得给自己剪羊毛。我穿的袜子上，每一缕毛都来自自己的后背。
        - id: ch03-b07
          speaker: narrator
          text: 格鲁阿加赫转过身，让希安·甘农看见满背厚密的黑羊毛。
        - id: ch03-b08
          speaker: shee_an_gannon
          text: 我明白了。遭过这样的事，你怎么笑得出来？那只兔子现在还来吗？
        - id: ch03-b09
          speaker: gruagach_gaire
          text: 它当然还来。
        - id: ch03-b10
          speaker: narrator
          text: 两人坐到桌边打牌。没过多久，棕兔果然又冲进屋，还没等他们拦住，就已经扬起炉灰逃走了。希安·甘农追在最前，格鲁阿加赫紧随其后。两个人使出腿上所有力气，一直奔到天黑。兔子刚要钻进那座杀死十二个儿子的城堡，希安·甘农便从后面抓住它两条腿，将它的脑袋狠撞在墙上。兔子当场脑浆迸裂，头盖骨撞穿墙壁，飞进城堡的主厅，正落在黄脸脚边。
    - id: ch04
      title: 格鲁阿加赫又笑了
      blocks:
        - id: ch04-b01
          speaker: yellow_face
          text: 谁敢动我的斗兽？
          emotion: angry
        - id: ch04-b02
          speaker: shee_an_gannon
          text: 是我。你的宠物若懂规矩，现在也许还活着。
        - id: ch04-b03
          speaker: narrator
          text: 希安·甘农和格鲁阿加赫走到炉火旁。大锅里依旧煮着一只鹳，和格鲁阿加赫第一次来时没有两样。黄脸也照旧走进隔壁房间，取来一支铁矛和一支木矛。
        - id: ch04-b04
          speaker: yellow_face
          text: 这一次，你选哪一支？
        - id: ch04-b05
          speaker: shee_an_gannon
          text: 我要木矛，铁矛留给你。
        - id: ch04-b06
          speaker: narrator
          text: 希安·甘农接过木矛，走到锅前一挑，除了小小一口肉，其余整只鹳都被他挑了出来。他和格鲁阿加赫立刻吃起来，整整一夜都在享用鹳肉。这一回，他们在黄脸的屋里自在得就像待在自己家中。
        - id: ch04-b07
          speaker: narrator
          text: 天亮后，黄脸又走进隔壁房间，取下十二只铁套索和一只木套索。他把它们全拿出来摆好，再问希安·甘农要十二只铁的，还是一只木的。
        - id: ch04-b08
          speaker: shee_an_gannon
          text: 十二只铁的，我和主人拿来有什么用？我要那只木的。
        - id: ch04-b09
          speaker: narrator
          text: 希安·甘农把木套索戴在自己的颈上，又拿起十二只铁套索，分别套住黄脸十二个女儿的脖子。他猛地收紧套索，一口气砍下十二颗头，随后转身面对她们的父亲。
        - id: ch04-b10
          speaker: shee_an_gannon
          text: 立刻让我的主人的十二个儿子复活，恢复得和被你砍头前一样强壮。不然，你也会得到同样的下场。
        - id: ch04-b11
          speaker: narrator
          text: 黄脸走出屋去，果真让十二个儿子重新活了过来。他们个个活生生地站在那里，身体也和被杀以前一样康健强壮。格鲁阿加赫一看见所有儿子都回到面前，忽然爆发出一阵大笑。那笑声响彻天地，整个东方世界都听见了。
        - id: ch04-b12
          speaker: shee_an_gannon
          text: 你这一笑可害苦我了！公主听见笑声，明天就要嫁人。
        - id: ch04-b13
          speaker: gruagach_gaire
          text: 那我们一定得及时赶到！
          emotion: surprised
        - id: ch04-b14
          speaker: narrator
          text: 希安·甘农、格鲁阿加赫和他的十二个儿子立刻离开黄脸的住处，用最快的速度拼命赶路。等他们来到离国王城堡三英里的地方，前方已经挤满了赶来参加婚礼的人。人群密得像一堵墙，谁也没办法再往前迈出一步。
        - id: ch04-b15
          speaker: shee_an_gannon
          text: 我们得从这里清出一条路。
        - id: ch04-b16
          speaker: gruagach_gaire
          text: 对，非这样不可。
        - id: ch04-b17
          speaker: narrator
          text: 他们立刻动手，有的人被推到左边，有的人被推到右边。没过多久，人海中便让出一条通道，足够他们一路赶进国王的城堡。
    - id: ch05
      title: 真正赢得公主的人
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 他们冲进大厅时，爱尔兰国王的女儿和蒂尚国王的儿子正双双跪在地上，眼看下一刻就要结成夫妻。希安·甘农走到新郎跟前，抬手重重一击。那人被打得一路旋转，横穿整间大厅，最后滚进另一头的桌子底下才停住。
        - id: ch05-b02
          speaker: king_of_erin
          text: 哪个恶棍动的手？
          emotion: angry
        - id: ch05-b03
          speaker: shee_an_gannon
          text: 是我。
        - id: ch05-b04
          speaker: king_of_erin
          text: 你为什么打那个赢得我女儿的人？
        - id: ch05-b05
          speaker: shee_an_gannon
          text: 真正赢得公主的是我，不是他。您若不信，格鲁阿加赫就在这里。他会把一切从头讲给您听，也会让您看看巨人的舌头。
        - id: ch05-b06
          speaker: narrator
          text: 格鲁阿加赫走到国王面前，从头到尾说出全部经过。他讲了希安·甘农如何成了自己的牧牛人，如何把五头金牛和无角公牛赶去吃草，如何砍下五头巨人的脑袋，杀死会魔法的兔子，又如何逼迫黄脸救活他的十二个儿子，让他们恢复得像从前一样强壮。
        - id: ch05-b07
          speaker: gruagach_gaire
          text: 全世界只有他听我说过，我为什么不再发笑。也只有他亲眼见过我背上的羊毛皮。
        - id: ch05-b08
          speaker: narrator
          text: 国王听完格鲁阿加赫的话，又取来希安·甘农一直保存在口袋里的舌头。他将它们放进蒂尚王子带来的巨人头颅里，五条舌头正好一一嵌合，清清楚楚证明了究竟是谁杀死巨人。真相终于大白。国王让希安·甘农跪到女儿身边，两人就在所有人面前当场成婚。
        - id: ch05-b09
          speaker: narrator
          text: 冒领功劳的蒂尚王子当场被人抓住，投入牢狱。到了第二天，人们燃起一堆熊熊大火，将这个欺骗国王、妄想骗娶公主的人烧成灰烬。
        - id: ch05-b10
          speaker: narrator
          text: 婚宴一连办了九天，最后一天比第一天还要热闹。
