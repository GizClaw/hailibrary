audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, legendary, and composed
        timbre: rich and clear
        pace: measured
        pitch: medium
    shee_an_gannon:
      display_name: The Shee an Gannon
      tts:
        delivery: bold, direct, and quick-witted
        timbre: clear and youthful
        pace: brisk
        pitch: medium
    king_of_erin:
      display_name: King of Erin
      tts:
        delivery: grave, formal, and unyielding
        timbre: resonant and mature
        pace: measured
        pitch: medium-low
    gruagach_gaire:
      display_name: The Gruagach Gaire
      tts:
        delivery: hospitable, sorrowful, and deeply earnest
        timbre: full and weathered
        pace: unhurried
        pitch: medium-low
    five_headed_giant:
      display_name: Five-Headed Giant
      tts:
        delivery: threatening, scornful, and explosive
        timbre: massive and rough
        pace: deliberate
        pitch: very low
    yellow_face:
      display_name: Yellow Face
      tts:
        delivery: cruel, calculating, and sharp
        timbre: dry and cutting
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Twelfth Iron Spike
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Shee an Gannon was born in the morning and given his name at noon. By evening, he had gone to the king of Erin to ask for the king's daughter.
        - id: ch01-b02
          speaker: king_of_erin
          text: I will give you my daughter in marriage, but you will not have her unless you bring me the news I want. Tell me why the Gruagach Gaire no longer laughs. Before this, he laughed all the time, and his laughter was so loud that the whole world could hear it.
        - id: ch01-b03
          speaker: king_of_erin
          text: Behind my castle stand twelve iron spikes. Eleven hold the heads of kings' sons who wanted to marry my daughter. Each man went after the same answer, and each came back without it. So I cut off their heads. I fear yours will go on the last spike, because I will do the same to you unless you learn what ended the Gruagach's laughter.
        - id: ch01-b04
          speaker: narrator
          text: The Shee an Gannon gave no answer. He left the king and set out to discover why the Gruagach had fallen silent. He crossed a glen in one stride and a hill in one leap, and he traveled until evening. Then he came to a house.
        - id: ch01-b05
          speaker: narrator
          text: The master asked what kind of man he was.
        - id: ch01-b06
          speaker: shee_an_gannon
          text: A young man looking for work.
        - id: ch01-b07
          speaker: gruagach_gaire
          text: I was going out tomorrow to hire someone to watch my cows. Work for me, and you'll have the best food a man could eat and a soft bed at night.
        - id: ch01-b08
          speaker: narrator
          text: The Shee an Gannon agreed to serve him and ate his supper.
        - id: ch01-b09
          speaker: gruagach_gaire
          text: I am the Gruagach Gaire. Now that you're in my service and your supper is eaten, you shall sleep in a bed of silk.
    - id: ch02
      title: The Five Golden Cows
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After breakfast the next morning, the Gruagach spoke to his new cowboy.
        - id: ch02-b02
          speaker: gruagach_gaire
          text: Loose my five golden cows and my hornless bull, and drive them out to graze. Once they're on the grass, take care that they never stray onto the giant's land.
        - id: ch02-b03
          speaker: narrator
          text: The cowboy drove the cattle toward the pasture. Near the giant's country, he found a forest shut in by a high wall. He braced his back against that wall and flung a great length of it inward. Once inside, he tore out another great length and drove the five golden cows and the hornless bull through the opening.
        - id: ch02-b04
          speaker: narrator
          text: He climbed a tree and ate its sweet apples, while he tossed the sour ones down to the Gruagach's cattle. Before long, a tremendous crashing sounded through the woods. Young trees bent, old trees broke, and a giant with five heads forced his way toward him.
        - id: ch02-b05
          speaker: five_headed_giant
          text: You wretched little creature! What made you bold enough to trespass on my land and plague me like this? You're too big for a single bite and too small for two. I suppose I'll have to rip you apart.
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: The cowboy climbed down from the tree to face him.
        - id: ch02-b07
          speaker: shee_an_gannon
          text: You filthy brute! I don't care that much for you.
        - id: ch02-b08
          speaker: narrator
          text: They rushed at each other. The battle made such a noise that everything in the world seemed to be watching and listening. They fought until late afternoon, when the giant began to overpower the cowboy.
        - id: ch02-b09
          speaker: narrator
          text: Then the cowboy thought of what would happen if the giant killed him. His father and mother would never find him or see him again, and he would never win the king of Erin's daughter. At that thought, his heart grew strong. He sprang upon the giant. With one squeeze and thrust, he drove him to his knees in the hard earth. The second drove him to his waist, and the third to his shoulders.
        - id: ch02-b10
          speaker: shee_an_gannon
          text: I have you now. This is the end of you!
        - id: ch02-b11
          speaker: narrator
          text: He drew his knife and cut off all five heads. Then he cut out the tongues, slipped them into his pocket, and threw the heads over the wall. After that, he gathered the cattle and drove them home.
        - id: ch02-b12
          speaker: narrator
          text: That evening, there were not enough vessels in the whole place to hold the milk from the five golden cows. But while the cowboy was still on the road with the cattle, the prince of Tisean came upon the giant's heads. He carried them away and planned to claim the princess in marriage as soon as the Gruagach Gaire laughed again.
        - id: ch02-b13
          speaker: narrator
          text: After supper, the cowboy told his master nothing. He kept his thoughts to himself and went to sleep in the bed of silk.
    - id: ch03
      title: Why the Gruagach Stopped Laughing
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next morning, the cowboy rose before his master. His first words went straight to the secret.
        - id: ch03-b02
          speaker: shee_an_gannon
          text: What keeps you from laughing now, when your laughter once rang through the whole world?
        - id: ch03-b03
          speaker: gruagach_gaire
          text: I am sorry the king of Erin's daughter sent you here.
          emotion: sad
        - id: ch03-b04
          speaker: shee_an_gannon
          text: Tell me willingly, or I'll force the answer out of you.
        - id: ch03-b05
          speaker: narrator
          text: The cowboy made his face terrible to see. He raced through the house like a madman, searching for something that could hurt the Gruagach enough. At last he found ropes of untanned sheepskin hanging on the wall.
        - id: ch03-b06
          speaker: narrator
          text: He seized the Gruagach, bound him around the three smalls, and pulled him so tight that his little toes were whispering to his ears.
        - id: ch03-b07
          speaker: gruagach_gaire
          text: Set me free, and I'll tell you what stopped my laughter.
        - id: ch03-b08
          speaker: narrator
          text: The cowboy untied him, and the two sat down together.
        - id: ch03-b09
          speaker: gruagach_gaire
          text: I once lived in this castle with my twelve sons. We ate and drank, played cards, and enjoyed ourselves. Then one day, while we were playing, a slender brown hare rushed inside. It leaped onto the hearth, kicked the ashes clear up to the rafters, and ran away.
        - id: ch03-b10
          speaker: gruagach_gaire
          text: The hare returned another day, but this time my twelve sons and I were waiting. As soon as it scattered the ashes and fled, we chased it. We followed until night, when it ran into a glen. A light shone ahead of us, so I hurried on and found a house with one great room.
        - id: ch03-b11
          speaker: gruagach_gaire
          text: A man called Yellow Face lived there with his twelve daughters. The hare was tied beside the room near the women. Over the fire hung a large pot, and a great stork was boiling inside it.
        - id: ch03-b12
          speaker: yellow_face
          text: There are bundles of rushes at the far end of the room. Go sit there with your men.
        - id: ch03-b13
          speaker: gruagach_gaire
          text: Yellow Face went into the next room and came back with two pikes, one wooden and one iron. He asked which one I wanted.
        - id: ch03-b14
          speaker: gruagach_gaire
          text: Give me the iron pike. If anyone attacks me, iron will serve me better than wood.
        - id: ch03-b15
          speaker: gruagach_gaire
          text: He handed me the iron pike and gave me the first chance to take whatever I could from the pot. But its point brought out only a little bit of stork. Yellow Face used the wooden pike and lifted out all the rest. My sons and I had to fast that night while he and his twelve daughters ate the meat. As they finished each piece, they hurled the bare bones into our faces. We stayed there until morning, taking blow after blow from those bones.
        - id: ch03-b16
          speaker: gruagach_gaire
          text: In the morning, as we were leaving, Yellow Face asked me to wait. He brought out twelve iron loops and one wooden loop.
        - id: ch03-b17
          speaker: yellow_face
          text: Choose. Put your twelve sons' heads into the iron loops, or put your own head into the wooden one.
        - id: ch03-b18
          speaker: gruagach_gaire
          text: I'll put my sons into the twelve iron loops and keep my own head out of the wooden loop.
        - id: ch03-b19
          speaker: gruagach_gaire
          text: He fastened an iron loop around the neck of every one of my twelve sons, while he put the wooden loop around his own neck. Then he snapped the iron loops, one after another, and took off all twelve heads. He threw my sons' heads and bodies out of the house. But when he snapped the wooden loop, it did nothing at all to his own neck.
        - id: ch03-b20
          speaker: gruagach_gaire
          text: After killing them, he seized me. From the small of my back downward, he stripped away my skin and flesh. A black sheepskin had hung on his wall for seven years. He pressed it onto my body in place of what he had taken, and it grew fast to me. Every year since, I have sheared myself. All the wool in the stockings I wear comes from my own back.
        - id: ch03-b21
          speaker: narrator
          text: When the tale was told, the Gruagach showed the cowboy his back. Thick black wool covered it.
        - id: ch03-b22
          speaker: shee_an_gannon
          text: Now I know why you cannot laugh, and no one could blame you. But does that hare still come here?
        - id: ch03-b23
          speaker: gruagach_gaire
          text: Indeed he does.
    - id: ch04
      title: Back to Yellow Face
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The two men sat at the table and began to play. They had not been at the cards long when the hare dashed in and escaped before they could stop him.
        - id: ch04-b02
          speaker: narrator
          text: The cowboy raced after the hare, and the Gruagach followed him. They ran as fast as their legs could carry them until nightfall. Just as the hare entered the castle where the twelve sons had died, the cowboy caught it by both hind legs. He dashed its brains against the wall. The hare's skull flew into the main room and landed at its master's feet.
        - id: ch04-b03
          speaker: yellow_face
          text: Who dared lay a hand on my fighting pet?
          emotion: angry
        - id: ch04-b04
          speaker: shee_an_gannon
          text: I did. If your pet had known how to behave, he might still be alive.
        - id: ch04-b05
          speaker: narrator
          text: The cowboy and the Gruagach stood beside the fire. Just as before, a stork boiled in the pot. Yellow Face fetched an iron pike and a wooden one, then offered the cowboy his choice.
        - id: ch04-b06
          speaker: shee_an_gannon
          text: I'll have the wooden pike. You can keep the iron one.
        - id: ch04-b07
          speaker: narrator
          text: With the wooden pike, the cowboy lifted the whole stork from the pot except for one small bite. He and the Gruagach began to eat, and they kept eating the stork through the night. On this visit, no one made them fast or threw bones in their faces. This time, the two of them were masters of the place.
    - id: ch05
      title: The Gruagach Laughs Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: In the morning, Yellow Face went into the next room. He returned with the twelve iron loops and the single wooden one, and asked the cowboy which he would take.
        - id: ch05-b02
          speaker: shee_an_gannon
          text: What use would twelve iron loops be to my master or me? I'll take the wooden one.
        - id: ch05-b03
          speaker: narrator
          text: The cowboy put the wooden loop around his own neck. Then he took the twelve iron loops and placed one around the neck of each of Yellow Face's twelve daughters. He snapped the loops, and all twelve heads came off. The wooden loop left him unharmed. He turned to the daughters' father and gave him one choice.
        - id: ch05-b04
          speaker: shee_an_gannon
          text: Bring my master's twelve sons back to life, healthy and strong as they were before you beheaded them. If you don't, I'll do the same to you.
        - id: ch05-b05
          speaker: narrator
          text: Yellow Face went outside and brought all twelve sons back to life. They stood as well and strong as they had been on the day he took their heads. The moment the Gruagach saw every one of his sons alive again, he let out a laugh. The whole Eastern world heard it.
        - id: ch05-b06
          speaker: shee_an_gannon
          text: You have done me a bad turn. The king of Erin's daughter will be married the day after your laughter is heard.
        - id: ch05-b07
          speaker: gruagach_gaire
          text: Then we must reach the castle in time!
          emotion: surprised
        - id: ch05-b08
          speaker: narrator
          text: They all rushed away from Yellow Face's castle as fast as they could go. The cowboy led them, with the Gruagach and his twelve sons close behind.
    - id: ch06
      title: The Wedding Interrupted
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: When they came within three miles of the king's castle, the road was packed so tightly with people that no one could move a step forward.
        - id: ch06-b02
          speaker: shee_an_gannon
          text: We have to open a road through this crowd.
        - id: ch06-b03
          speaker: gruagach_gaire
          text: We certainly do.
        - id: ch06-b04
          speaker: narrator
          text: They set to work, tossing people to one side and the other. Soon they had cleared a way to the castle.
        - id: ch06-b05
          speaker: narrator
          text: They entered just as the king of Erin's daughter and the prince of Tisean knelt to be married. The cowboy swung his hand at the bridegroom. One blow sent the prince spinning across the room until he stopped beneath a table.
        - id: ch06-b06
          speaker: king_of_erin
          text: What scoundrel struck that blow?
          emotion: angry
        - id: ch06-b07
          speaker: shee_an_gannon
          text: I did.
        - id: ch06-b08
          speaker: king_of_erin
          text: Why did you strike the man who won my daughter?
        - id: ch06-b09
          speaker: shee_an_gannon
          text: He did not win her. I did. If you doubt me, the Gruagach Gaire is here. He can tell you everything from the beginning, and he can show you the giant's tongues.
    - id: ch07
      title: The True Bridegroom
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: The Gruagach stepped forward and told the king the whole story from beginning to end. The Shee an Gannon had entered his service as a cowboy and taken the five golden cows and the hornless bull to pasture. On the giant's land, he had fought the five-headed giant and cut off every head. Then he had killed the enchanted hare, faced Yellow Face in his own castle, and forced him to bring the Gruagach's twelve sons back to life, as healthy and strong as ever.
        - id: ch07-b02
          speaker: gruagach_gaire
          text: He is the only man in the world I have ever told why my laughter stopped. He is also the only man who has seen the fleece growing on my back.
        - id: ch07-b03
          speaker: narrator
          text: The king of Erin heard every word. Then the giant's five heads were brought before him, and the tongues the cowboy had kept were fitted back into them. The proof was plain. At once, the king ordered the Shee an Gannon to kneel beside his daughter. They were married on the spot, in the very place where the false bridegroom had been waiting.
        - id: ch07-b04
          speaker: narrator
          text: The prince of Tisean was thrown into prison. The next day, a great fire was built, and the deceiver was burned to ashes.
        - id: ch07-b05
          speaker: narrator
          text: The wedding lasted nine days, and the last day was better than the first.
