  chapters:
    - id: ch01
      title: The Cottage at Treneglwys
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In Treneglwys, there is a shepherd's cottage called Twt y Cymrws. It took that name from a strange quarrel that happened there long ago. A man and his wife once lived in the cottage with their twin babies, and the mother cared for them tenderly.
        - id: ch01-b02
          speaker: narrator
          text: One day, a neighbor who lived some distance away sent for her. The mother hated to leave the little ones alone in such a lonely place. She had heard stories about the good folk who haunted that country.
        - id: ch01-b03
          speaker: narrator
          text: Still, she went, and she hurried back as soon as she could. On the way home, even in the middle of the day, some old elves in blue petticoats crossed her path. The sight frightened her, and she ran all the way to the cottage.
        - id: ch01-b04
          speaker: narrator
          text: Yet the two babies were lying in their cradle, and everything looked just as she had left it.
    - id: ch02
      title: The Great Strife
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After a while, the good people began to fear that something was wrong. The twins did not grow at all.
        - id: ch02-b02
          speaker: husband
          text: Those children aren't ours.
        - id: ch02-b03
          speaker: mother
          text: Then whose children could they be?
        - id: ch02-b04
          speaker: narrator
          text: That was how the great quarrel began. It grew so fierce that the neighbors named the cottage after it. The mother was deeply unhappy. At last, one evening, she decided to visit the Wise Man of Llanidloes. He knew everything, and she believed he could tell her what to do.
    - id: ch03
      title: The Wise Man's Test
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The mother went to Llanidloes and told the Wise Man the whole story. The rye and oats would soon be ready for harvest, and he gave her a strange set of instructions.
        - id: ch03-b02
          speaker: wise_man
          text: When you make dinner for the reapers, empty a hen's egg and cook some porridge in the shell. Carry it to the door as though it were the reapers' dinner, then listen to the twins. If they talk about things no child could understand, take them up and throw them into the waters of Lake Elvyn. But if they say nothing remarkable, you must not harm them.
        - id: ch03-b03
          speaker: narrator
          text: When harvest day came, the mother followed every instruction. She set the eggshell over the fire, lifted it off again, and carried it to the doorway. Then she stood there and listened.
    - id: ch04
      title: The Brewery of Eggshells
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One of the children spoke to the other.
        - id: ch04-b02
          speaker: changeling
          text: I knew the acorn before the oak, and the egg before the hen. But never have I heard of an eggshell brewing dinner for the harvest men.
        - id: ch04-b03
          speaker: narrator
          text: The mother went straight back into the house. She seized the children and threw them into the lake. Goblins in blue trousers rushed in and saved their little dwarfs. Then the mother's own children were returned to her, and the great strife came to an end.
