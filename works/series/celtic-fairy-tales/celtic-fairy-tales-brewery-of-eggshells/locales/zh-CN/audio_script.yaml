audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而富有古老传说的神秘感
        timbre: 温暖清澈
        pace: 从容舒缓
        pitch: 中音
    husband:
      display_name: 丈夫
      tts:
        delivery: 直率坚定，心存疑虑时毫不含糊
        timbre: 朴实厚重
        pace: 中速
        pitch: 中低音
    mother:
      display_name: 母亲
      tts:
        delivery: 温柔爱子，忧心时仍有决断
        timbre: 温暖清晰
        pace: 中速
        pitch: 中音
    wise_man:
      display_name: 兰尼德洛伊斯的智者
      tts:
        delivery: 睿智沉着，叮嘱得清楚周全
        timbre: 苍老稳健
        pace: 舒缓
        pitch: 低音
    changeling:
      display_name: 精灵孩子
      tts:
        delivery: 古怪神秘，念唱时抑扬分明
        timbre: 稚嫩清亮
        pace: 中速
        pitch: 高音
  chapters:
    - id: ch01
      title: 特雷内格卢伊斯的小屋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 特雷内格卢伊斯有一间牧羊人的小屋，名叫特乌特·伊·库姆鲁斯。这个名字，来自许多年前发生在那里的一场怪争执。当时，一对夫妻带着一双孪生子住在屋里。母亲疼爱两个孩子，照料得十分细心。
        - id: ch01-b02
          speaker: narrator
          text: 一天，远处一户邻居请她过去。母亲不愿把两个小宝贝单独留在荒僻的屋子里，因为她听说，这一带时常有仙灵出没。可她还是出了门，并且尽早往回赶。
        - id: ch01-b03
          speaker: narrator
          text: 回家的路上，几个穿蓝裙的老精灵忽然从她面前经过。那时分明是正午，她却吓得心里发紧，一路飞奔回家。两个小家伙还好好躺在摇篮里，屋里看起来也没有任何变化。
    - id: ch02
      title: 一场大争执
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 过了一阵子，夫妻俩发觉不对劲了。这对孪生子一点儿也没有长大。
        - id: ch02-b02
          speaker: husband
          text: 这两个孩子不是我们的。
        - id: ch02-b03
          speaker: mother
          text: 不是我们的孩子，那又会是谁的？
        - id: ch02-b04
          speaker: narrator
          text: 两人就这样争执起来，闹得邻人都知道了。后来，大家干脆用这场争执给小屋起了名字。母亲为此非常伤心。一天傍晚，她决定去找兰尼德洛伊斯的智者。他什么都知道，一定能告诉她该怎么做。
    - id: ch03
      title: 智者的办法
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 母亲到了兰尼德洛伊斯，把整件事讲给智者听。黑麦和燕麦很快就要收割了，智者便告诉她一个古怪的试探办法。
        - id: ch03-b02
          speaker: wise_man
          text: 等你给割麦人做饭，把一只鸡蛋掏空，在蛋壳里煮点粥。再把它端到门口，就像真要拿这份饭给割麦人吃一样。你留心听那两个孩子说什么。要是他们谈起小孩子根本不懂的事，就进去抱起他们，扔进埃尔温湖。可要是没听见什么怪话，绝不能伤害他们。
        - id: ch03-b03
          speaker: narrator
          text: 收割那天，母亲照着智者的话一一做了。她把蛋壳放在火上，煮好后端到门边，随后站在那里仔细听着。
    - id: ch04
      title: 蛋壳熬粥
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这时，一个孩子开口对另一个念道。
        - id: ch04-b02
          speaker: changeling
          text: 橡树未生，我先识橡果。母鸡未有，我先见鸡蛋。可从没听说蛋壳能把粥煮妥，给收割庄稼的人当饭。
        - id: ch04-b03
          speaker: narrator
          text: 母亲听罢，立刻回到屋里，抓起两个孩子，把他们扔进湖中。穿蓝裤子的妖精赶来，救走了自家的小矮人。母亲也终于找回亲生骨肉，那场大争执就此结束。
