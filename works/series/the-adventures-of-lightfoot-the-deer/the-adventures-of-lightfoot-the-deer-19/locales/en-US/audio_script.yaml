audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
    paddy:
      display_name: Paddy the Beaver
      tts:
        delivery: friendly, practical, and good-natured
        timbre: sturdy and mellow
        pace: steady
        pitch: medium-low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: alert, curious, and quick-thinking
        timbre: bright and crisp
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: SAMMY JAY IS MODEST
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: As soon as the angry hunter with the terrible gun disappeared among the trees of the Green Forest, and Lightfoot was certain the man had gone for good, he left his hiding place on top of the ridge and walked down to Paddy the Beaver's pond for a drink.
        - id: ch01-b02
          speaker: narrator
          text: Lightfoot knew it was quite safe to do so because Sammy Jay had followed the hunter the whole time, calling, "Thief! Thief! Thief!" Everyone within hearing could tell exactly where the hunter was just by listening to Sammy's voice. The calls grew fainter and fainter, so Lightfoot knew the man was moving farther and farther away.
        - id: ch01-b03
          speaker: narrator
          text: Paddy swam out from his hiding place and climbed onto the bank beside Lightfoot. His eyes had a twinkle in them.
        - id: ch01-b04
          speaker: paddy
          text: That blue-coated troublemaker has a good heart after all, doesn't he?
        - id: ch01-b05
          speaker: narrator
          text: Lightfoot raised his beautiful head. He pointed his ears forward and listened for Sammy's distant voice.
        - id: ch01-b06
          speaker: lightfoot
          text: Some may call Sammy Jay a troublemaker, but when danger comes, you can count on him as a true friend. He warned me about the hunter the other morning. A little while ago, you saw him save Mr. and Mrs. Quack. Then he actually chased that hunter away. Sammy has probably saved more lives than anyone else I know. I wish he'd come back so I could thank him.
        - id: ch01-b07
          speaker: narrator
          text: Some time later, Sammy Jay returned. He smoothed his feathers before he spoke.
        - id: ch01-b08
          speaker: sammy_jay
          text: Well, I chased that fellow all the way to the edge of the Green Forest. We shouldn't have any more trouble from him today. I'm glad he hasn't caught you, Lightfoot. I've been rather worried about you.
        - id: ch01-b09
          speaker: lightfoot
          text: Sammy, you're one of my very best friends. After all you've done for me, I don't know how I'll ever thank you.
        - id: ch01-b10
          speaker: sammy_jay
          text: Don't bother. I only did what anyone else would have done. Old Mother Nature gave me sharp eyes and a strong voice, and I use them as well as I can. The very sight of a hunter with a terrible gun makes me angry all through. I'd sooner ruin his hunt than eat.
          emotion: angry
        - id: ch01-b11
          speaker: paddy
          text: Be careful, Sammy. One day, a hunter may get so angry that he shoots at you just to pay you back.
        - id: ch01-b12
          speaker: sammy_jay
          text: You don't need to worry about me. I know exactly how far those terrible guns can shoot, and I never take chances. But Lightfoot, there's something you ought to know. The Green Forest is full of hunters searching for you. I've seen many of them. I know you're the one they want because they won't shoot at anyone else, even when they get the chance.
