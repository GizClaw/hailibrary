audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
    paddy:
      display_name: 帕迪
      tts:
        delivery: 朴实爽朗，语气热心而直率
        timbre: 厚实温暖
        pace: 稳健
        pitch: 中低音
    sammy_jay:
      display_name: 蓝松鸦萨米
      tts:
        delivery: 机敏活泼，直来直去，遇事反应很快
        timbre: 清亮利落
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十九章　蓝松鸦萨米很谦虚
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那个猎人拿着可怕的枪，气冲冲地走进绿森林，很快就消失在树木中间。轻足确定他真的走远了，才离开土冈顶上的藏身处，下到海狸帕迪的池塘边喝水。
        - id: ch01-b02
          speaker: narrator
          text: 轻足一点也不担心。蓝松鸦萨米始终跟在猎人后面，一路大叫着“小偷！小偷！小偷！”只要听得见萨米的声音，谁都知道猎人走到了哪里。叫声越来越轻，也越来越远，这说明猎人正离池塘远去。
        - id: ch01-b03
          speaker: narrator
          text: 海狸帕迪也从藏身的地方游了出来。他爬上岸，来到轻足旁边，眼睛里带着笑。
        - id: ch01-b04
          speaker: paddy
          text: 那个穿蓝衣服的捣蛋鬼，其实心眼儿还不错，对吧？
        - id: ch01-b05
          speaker: narrator
          text: 轻足抬起漂亮的头，两只耳朵朝前竖着，仔细听远处萨米的声音。
        - id: ch01-b06
          speaker: lightfoot
          text: 有些人说萨米爱捣蛋，可真有了危险，他就是靠得住的朋友。前几天早晨，他来提醒我猎人要来了。刚才，你又亲眼看见他救下野鸭先生和太太，还把猎人赶出了这里。我认识的朋友当中，恐怕没有谁比萨米救过更多性命了。要是他肯回来，我真想当面谢谢他。
        - id: ch01-b07
          speaker: narrator
          text: 又过了一阵，蓝松鸦萨米果然飞了回来。他先理了理身上的羽毛，这才开口。
        - id: ch01-b08
          speaker: sammy_jay
          text: 好了，我把那家伙一路赶到了绿森林边上。今天，他应该不会再来找麻烦了。轻足，看见你还好好的，我可真高兴。刚才我一直惦记着你呢。
        - id: ch01-b09
          speaker: lightfoot
          text: 萨米，你是我最要好的朋友之一。你替我做了这么多，我都不知道该怎样感谢你。
        - id: ch01-b10
          speaker: sammy_jay
          text: 可别谢我。我只是做了大家都会做的事。大自然老妈妈给了我好眼力，又给了我响亮的嗓门，我当然要好好用。只要看到猎人拿着那支可怕的枪，我浑身就来气。能坏了他的狩猎，我宁可连东西都不吃。
          emotion: angry
        - id: ch01-b11
          speaker: paddy
          text: 萨米，你还是当心些吧。哪天有个猎人气急了，说不定会为了报复，特意开枪打你。
        - id: ch01-b12
          speaker: sammy_jay
          text: 你不用替我操心。那些可怕的枪能打多远，我心里有数，绝不会拿自己冒险。不过轻足，有件事你得知道。现在绿森林里满是找你的猎人，我已经碰见很多个了。他们有机会也不打别人，所以我敢肯定，他们要找的就是你。
