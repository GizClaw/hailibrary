audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
    hunter:
      display_name: Hunter
      tts:
        delivery: watchful, calculating, and self-assured
        timbre: firm and weathered
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: WIT AGAINST WIT
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The hunter with the terrible gun and Lightfoot the Deer were playing a dreadful game in the Green Forest. It was wit against wit. The hunter was trying to take Lightfoot's life, and Lightfoot was trying to save it. Years of experience had taught Lightfoot a great deal about hunters, and he remembered every lesson. But the hunter knew a great deal about Deer, too. Each one was doing his best to guess what the other would do next.
        - id: ch01-b02
          speaker: narrator
          text: The hunter reached the hiding place Lightfoot had left after Sammy Jay's warning. From there, he followed Lightfoot's trail for a short way. Tracking was slow without snow on the ground. Lightfoot had left a footprint only here and there, where he had stepped on soft earth. It took trained eyes to notice the smaller signs. One leaf had just been turned over. A patch of moss had been lightly crushed. The hunter could read those signs, and they showed him which way Lightfoot had gone.
        - id: ch01-b03
          speaker: narrator
          text: He went on slowly, patiently, and watchfully. After a while, he stopped and gave a satisfied grin.
        - id: ch01-b04
          speaker: hunter
          text: Just what I thought. He heard that pesky Jay, then circled around to catch my scent. I'll cut back across to my old trail. Unless I'm badly mistaken, his tracks will be there.
        - id: ch01-b05
          speaker: narrator
          text: The hunter moved quickly but silently across to his old trail. Within a few moments, he found exactly what he expected. There was one of Lightfoot's footprints. He grinned again.
        - id: ch01-b06
          speaker: hunter
          text: Well, old fellow, I've outguessed you this time. I'm behind you now, and the wind is blowing from you toward me. You can't catch my scent. I wouldn't be surprised if you've gone straight back to that old windfall where you started.
        - id: ch01-b07
          speaker: narrator
          text: At once, the hunter crept forward, silent and cautious. His eyes and ears were alert, and his terrible gun was ready to use in an instant.
        - id: ch01-b08
          speaker: narrator
          text: Meanwhile, Lightfoot had been following behind the hunter. When the man's scent disappeared, Lightfoot knew at once what must have happened. The hunter had found his tracks and started following them. Lightfoot stood perfectly still and listened as hard as he could. He hoped some tiny sound would tell him where the hunter was. But he heard nothing.
        - id: ch01-b09
          speaker: narrator
          text: After a little while, Lightfoot began to move again. He didn't dare stay in one place. If he did, the hunter might creep close enough to shoot him. Only one direction was safe. Lightfoot had to go toward the Merry Little Breezes, so they would blow straight into his face. As long as they carried no dreaded man-smell, he knew the way ahead was clear.
        - id: ch01-b10
          speaker: narrator
          text: The hunter might be behind him. In fact, he probably was. But as long as the Merry Little Breezes came toward Lightfoot without bringing the scent of man, there was safety ahead.
