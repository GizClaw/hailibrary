audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    hunter:
      display_name: 猎人
      tts:
        delivery: 老练警觉，说话低沉而自信
        timbre: 粗哑厚重
        pace: 沉稳
        pitch: 低音
  chapters:
    - id: ch01
      title: 一场凶险的较量
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 绿森林里，一场凶险的较量正在进行。拿着可怕猎枪的猎人想取鹿轻足的性命，鹿轻足则一心要保住自己。这不是比谁跑得快，而是比谁更能猜透对方的心思。
        - id: ch01-b02
          speaker: narrator
          text: 鹿轻足经历过好几个狩猎季，早就摸清了猎人的许多手段，而且一样也没忘。可是这个猎人也很了解鹿的习性。双方都在竭尽全力，想比对方先想到下一步。
        - id: ch01-b03
          speaker: narrator
          text: 猎人赶到鹿轻足先前藏身的地方，却扑了个空。听见蓝松鸦萨米的警告后，鹿轻足已经离开。猎人便循着踪迹，一点一点往前追。
        - id: ch01-b04
          speaker: narrator
          text: 这件事做起来很慢。地上没有雪，鹿轻足只在偶尔踩过松软泥土时，才会留下一枚蹄印。换成没有受过训练的人，根本看不出他去了哪里。
        - id: ch01-b05
          speaker: narrator
          text: 可猎人的眼睛认得别的线索。这里有片叶子刚被翻动，那里有块苔藓轻轻压扁。就是这些不起眼的痕迹，给他指明了鹿轻足离开的方向。
    - id: ch02
      title: 猎人抢先一步
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 猎人耐着性子，慢慢追踪，一路都仔细戒备。走了一阵，他忽然停下，满意地咧开嘴笑了。
        - id: ch02-b02
          speaker: hunter
          text: 果然让我猜中了。鹿轻足听见那只讨厌的蓝松鸦，就绕了个圈，想转到后面闻我的气味。
        - id: ch02-b03
          speaker: hunter
          text: 我现在抄近路回到刚才那条路上。要是没猜错，那里准能找到他的蹄印。
        - id: ch02-b04
          speaker: narrator
          text: 猎人立刻穿过林子，走得很快，脚下却一点声音也没有。几分钟后，他回到原来的路上，果真看见一枚鹿轻足留下的蹄印。他又笑了。
        - id: ch02-b05
          speaker: hunter
          text: 老伙计，这回我可抢在你前头了。我在你身后，风从你那边往我这里吹，你怎么也闻不到我。
        - id: ch02-b06
          speaker: hunter
          text: 我看啊，你说不定已经回到原来的地方，躲在那堆倒木后面了。
        - id: ch02-b07
          speaker: narrator
          text: 猎人马上悄悄向前摸去。他走得小心极了，眼睛盯着四周，耳朵也听着周围的动静。那杆可怕的枪端在手里，随时都能开火。
    - id: ch03
      title: 风吹来的方向
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这时，鹿轻足本来还跟在猎人后面，却突然闻不到那个人的气味了。他马上明白，猎人一定发现了自己的蹄印，现在正顺着踪迹追过来。
        - id: ch03-b02
          speaker: narrator
          text: 鹿轻足停下来，使劲听着。他盼望能捕捉到一丁点声响，好知道猎人在哪里。可是森林里静悄悄的，什么也听不见。
        - id: ch03-b03
          speaker: narrator
          text: 等了一会儿，他只好继续走。他不敢一直站在那里。万一猎人无声无息地靠近，走进猎枪打得到的距离，那就太危险了。
        - id: ch03-b04
          speaker: narrator
          text: 鹿轻足只有一个方向可以走，那就是快乐小风儿迎面吹来的方向。只要风里没有那股可怕的人味，他便知道前面没有猎人。
        - id: ch03-b05
          speaker: narrator
          text: 猎人也许就在身后，而且多半的确在那里。可只要快乐小风儿吹在鹿轻足脸上，没有捎来人味，前方就是安全的。
