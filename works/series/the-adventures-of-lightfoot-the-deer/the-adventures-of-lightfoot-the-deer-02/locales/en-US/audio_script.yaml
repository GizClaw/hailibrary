audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, earnest, and quick to react
        timbre: light and youthful
        pace: quick
        pitch: medium-high
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: LIGHTFOOT'S NEW ANTLERS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit was puzzled. He gave Lightfoot the Deer a suspicious stare and asked his question again. Peter had always believed Lightfoot was every bit as gentle, harmless, and timid as he was. He didn't like the thought that Lightfoot might have torn someone's coat. Still, what else could those ragged pieces mean?
        - id: ch01-b02
          speaker: peter_rabbit
          text: Did you tear somebody's coat?
        - id: ch01-b03
          speaker: narrator
          text: Lightfoot slowly shook his head.
        - id: ch01-b04
          speaker: lightfoot
          text: No, I didn't tear anyone's coat.
        - id: ch01-b05
          speaker: peter_rabbit
          text: Then why are those rags hanging from your antlers?
        - id: ch01-b06
          speaker: narrator
          text: Lightfoot chuckled.
        - id: ch01-b07
          speaker: lightfoot
          text: Those are pieces of the covering that grew over my new antlers.
        - id: ch01-b08
          speaker: peter_rabbit
          text: Your new antlers? What do you mean?
          emotion: surprised
        - id: ch01-b09
          speaker: narrator
          text: Peter sat up very straight. He fixed his eyes on Lightfoot's antlers as if he had never seen them before.
        - id: ch01-b10
          speaker: lightfoot
          text: I mean exactly what I said. Well, what do you think of them? I believe they're the finest antlers I've ever had. Once I rub away the rest of those rags, they'll be as handsome as any pair ever grown in the Green Forest.
        - id: ch01-b11
          speaker: narrator
          text: Lightfoot scraped his antlers against a tree trunk until some of the hanging pieces fell away. Peter blinked hard. He tried to make sense of it, but he couldn't. At last, he said so.
        - id: ch01-b12
          speaker: peter_rabbit
          text: What kind of story are you trying to make me believe? Are you saying these aren't the antlers you've had ever since I've known you? How could anything as hard as an antler possibly grow out of your head? If these are new, where are the old ones? Show them to me, and maybe I'll believe you. Antlers growing like plants! Why, I've watched Bossy the Cow all summer long. She still has the very same horns she had last summer. New antlers indeed!
          emotion: angry
        - id: ch01-b13
          speaker: lightfoot
          text: You're right about Bossy the Cow, Peter. She doesn't grow new horns. But why should that mean I can't grow new antlers? Her horns and my antlers aren't the same. I grow a new pair every year. You haven't seen me all summer, have you?
        - id: ch01-b14
          speaker: peter_rabbit
          text: No, I don't believe I have.
        - id: ch01-b15
          speaker: narrator
          text: Peter tried very hard to remember the last time he had seen Lightfoot.
        - id: ch01-b16
          speaker: lightfoot
          text: I know you haven't seen me. I've been hiding in a place you never go.
        - id: ch01-b17
          speaker: peter_rabbit
          text: Why were you hiding?
        - id: ch01-b18
          speaker: lightfoot
          text: I was waiting for my new antlers to grow. Whenever they're growing, I want to be off by myself. I don't like anyone seeing me without antlers or with a pair that's only half grown. Besides, I'm very uncomfortable while they're coming in, and that makes me want to be alone.
        - id: ch01-b19
          speaker: narrator
          text: Lightfoot sounded as though he truly meant every word. Even so, Peter simply couldn't believe it. How could such wonderfully large antlers have grown all the way out of Lightfoot's head in a single summer? When Peter spoke again, doubt filled his voice.
        - id: ch01-b20
          speaker: peter_rabbit
          text: When did your old antlers fall off, and where did you leave them?
        - id: ch01-b21
          speaker: lightfoot
          text: They dropped off last spring, but I honestly can't remember where. I was too glad to be rid of them to pay attention. They had grown loose and uncomfortable, and I had no more use for them. I already knew this year's antlers would be bigger and better. Look closely. Each one has an extra point that wasn't there last year.
        - id: ch01-b22
          speaker: narrator
          text: Lightfoot went back to rubbing his antlers against the tree. He worked at the strange rags and polished the points. Peter watched without a word for a few minutes. Then all his suspicion came rushing back.
        - id: ch01-b23
          speaker: peter_rabbit
          text: But you still haven't explained those rags hanging from your antlers.
        - id: ch01-b24
          speaker: lightfoot
          text: And you still haven't believed anything I've told you. I don't like explaining things to someone who won't believe me.
