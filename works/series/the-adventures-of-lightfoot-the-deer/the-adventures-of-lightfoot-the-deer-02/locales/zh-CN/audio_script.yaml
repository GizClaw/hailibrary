audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 机灵直率，情绪来得快，偶尔有些冒失
        timbre: 明亮轻巧
        pace: 稍快
        pitch: 中高音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 鹿角上的破布
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔怎么也想不明白。他带着几分怀疑，盯住了鹿轻足，又把刚才的问题问了一遍。彼得一直相信，轻足跟自己一样温和老实，又胆小怕事。他实在不愿意把扯破外套这种事想到轻足头上，可眼前的事还能怎么解释呢？
        - id: ch01-b02
          speaker: peter_rabbit
          text: 轻足，你真的没有扯破谁的外套吗？
        - id: ch01-b03
          speaker: narrator
          text: 轻足慢慢摇了摇头。
        - id: ch01-b04
          speaker: lightfoot
          text: 没有，我没扯破过谁的外套。
        - id: ch01-b05
          speaker: peter_rabbit
          text: 那你的鹿角上为什么挂着那些破布？
        - id: ch01-b06
          speaker: narrator
          text: 轻足低声笑了起来。
        - id: ch01-b07
          speaker: lightfoot
          text: 那是新鹿角生长时包在外面的东西，现在脱落了，只剩下这些。
        - id: ch01-b08
          speaker: peter_rabbit
          text: 等等，什么叫新鹿角？
          emotion: surprised
        - id: ch01-b09
          speaker: narrator
          text: 彼得一下坐得笔直，双眼紧盯着轻足的鹿角，仿佛从前从没见过它们。
        - id: ch01-b10
          speaker: lightfoot
          text: 就是我刚说的意思。你仔细看看，这对鹿角怎么样？我觉得，这是我长过的鹿角里最好的一对。等我把剩下这些东西全蹭掉，它们一定会成为绿森林里最漂亮的一对鹿角。
        - id: ch01-b11
          speaker: narrator
          text: 轻足把鹿角抵在树干上来回磨蹭，几片破布似的东西随即掉了下来。彼得使劲眨眼，越想弄明白，脑子里反倒越糊涂。最后，他忍不住说出了心里的话。
    - id: ch02
      title: 彼得不肯相信
      blocks:
        - id: ch02-b01
          speaker: peter_rabbit
          text: 你编了个什么故事来糊弄我？难道这不是我认识你以来一直见到的那对鹿角？它们那么硬，怎么可能长出来？要真是新的，旧鹿角又在哪里？你把旧的拿给我看，我也许才会相信。鹿角怎么会像花草一样生长！整个夏天我都见过母牛花花，她头上的角还是去年那对。什么新鹿角，我才不信呢！
          emotion: angry
        - id: ch02-b02
          speaker: lightfoot
          text: 母牛花花的事，你说得一点不错。她从来不会换新角，可这不能说明我也不会，对吧？她头上的牛角跟我的鹿角完全不同。我的鹿角每年都要换一对新的。彼得，你整个夏天都没有见过我，是不是？
        - id: ch02-b03
          speaker: peter_rabbit
          text: 好像真没有。让我好好想想，我确实记不起上一次是什么时候见到你了。
        - id: ch02-b04
          speaker: lightfoot
          text: 我就知道。这个夏天，我一直藏在一个你从来不去的地方。
        - id: ch02-b05
          speaker: peter_rabbit
          text: 你为什么要躲起来？
        - id: ch02-b06
          speaker: lightfoot
          text: 因为我要等我的新鹿角长好。新鹿角生长的时候，我只想一个人待着。我不愿意让别人看见我头上没有鹿角，也不愿意让人看到鹿角只长了一半的样子。再说，那段时间我浑身都不舒服，所以更想独自清静一阵。
        - id: ch02-b07
          speaker: narrator
          text: 轻足说得句句认真，可彼得想来想去，心里仍旧怎么也没法相信。他就是想不通，这么漂亮、这么大的一对鹿角，怎么会在一个夏天里从轻足头上长出来。
        - id: ch02-b08
          speaker: peter_rabbit
          text: 那你的旧鹿角是什么时候掉的？又掉在哪里了？
        - id: ch02-b09
          speaker: narrator
          text: 彼得问话时，口气里仍然满是怀疑。
    - id: ch03
      title: 轻足不再解释
      blocks:
        - id: ch03-b01
          speaker: lightfoot
          text: 今年春天就掉了，可我实在记不起掉在什么地方。那时旧鹿角已经松动了，弄得我很不舒服，我巴不得早点摆脱它们，哪还顾得上它们落在哪里。反正旧的已经没用了，因为我知道，新鹿角一定会长得更大、更好。你看，今年两边都比去年多了一个角叉。
        - id: ch03-b02
          speaker: narrator
          text: 轻足又把鹿角往树上蹭。他要磨掉那些古怪的残片，也要把每个角尖都磨得光亮。彼得一声不响地看了几分钟，刚压下去的疑心又全冒了出来。
        - id: ch03-b03
          speaker: peter_rabbit
          text: 可你还是没说清楚，鹿角上那些破布到底是什么呀。
        - id: ch03-b04
          speaker: lightfoot
          text: 我前面说的那些，你一句也不肯信。我可不想再把事情讲给一个不相信我的人听。
