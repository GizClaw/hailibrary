audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 机灵直率，情绪来得快，偶尔有些冒失
        timbre: 明亮轻巧
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 本该欢乐的秋天
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 白昼渐渐寒冷，夜空变得清明，恐惧之灵却在外面四处潜行。这是鹿轻足说过的话。
        - id: ch01-b02
          speaker: narrator
          text: 说来难过，可秋天的确成了一年中悲凉的时节。它本来不该这样，大自然老妈妈也从没这样打算。她原想让秋天充满欢乐。绿森林和绿草原上的小居民已经熬过了养育儿女的操劳，也教会了孩子怎样照顾自己。食物到处都是，大家吃得肥肥壮壮，本该放下牵挂，无忧无虑地生活。
        - id: ch01-b03
          speaker: narrator
          text: 寒冷的天气很快就会到来，也会带来艰难的日子。可在严寒到来前的这段时间，大自然老妈妈原想让所有小居民快快活活，什么也不用担心。这原本该是他们一年中最少操心、最自在的一段日子。
    - id: ch02
      title: 恐惧之灵四处游荡
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可一道阴森森的黑影偏偏走过绿草原，又钻进绿森林。它就是恐惧之灵。它探看每一个藏身处，只要发现一个小居民，就让一阵阵寒意钻进他的身体。即使圆滚滚、乐呵呵的太阳公公放出最亮的光，也赶不走那股寒意。
        - id: ch02-b02
          speaker: narrator
          text: 白天也好，夜里也好，恐惧之灵一直在寻找草原和森林里的小居民。它不让大家好好睡觉，也不让大家安心吃东西。它逼着他们换个地方躲藏，等他们好不容易找到新的藏身处，又把他们从那里赶出去。只要响起一点轻微的声音，大家马上就要准备飞走或逃跑。
        - id: ch02-b03
          speaker: narrator
          text: 彼得兔坐在亲爱的老荆棘丛边，望着远处的绿森林，心里正想着这些事。森林已经不再只有绿色。大自然老妈妈让霜杰克给树叶上色，他把枫树、山毛榉、桦树、白杨和栗树都画得好极了。
        - id: ch02-b04
          speaker: narrator
          text: 松树、云杉和铁杉依旧一片墨绿，红色、黄色和褐色的叶子映在其中，显得格外鲜艳，也格外美丽。远处的紫山披着一层柔和的紫色，比一年中任何时候都要温柔。眼前这一切，实在美极了。
        - id: ch02-b05
          speaker: narrator
          text: 可彼得一点也顾不上看。恐惧之灵甚至来到了亲爱的老荆棘丛，彼得害怕极了。他并不是怕狐狸雷迪、红尾鹰、猫头鹰胡迪或郊狼老先生。那几个家伙总想抓他，可彼得相信自己足够机灵，不会落进他们的爪子。
        - id: ch02-b06
          speaker: narrator
          text: 他们突然出现时，当然也会让彼得吓一跳。不过，只要逃进最近的一片乱荆棘，或者钻进他们够不着的空心树干，那阵惊吓很快就会过去。现在这股冻住他心头的恐惧却不一样，它一刻也不肯离开。
    - id: ch03
      title: 远处的一声枪响
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得知道，大家心里都被同一种恐惧紧紧抓住了。鹌鹑鲍勃藏在褐色的庄稼茬里，松鸡太太伏在绿森林最浓密的荆棘中。负鼠比利叔叔和浣熊博比各自躲进空心树，麝鼠杰里藏在微笑池塘，松鼠快乐杰克躲上树梢，鹿轻足则卧在他能找到的最茂密的灌木丛里。
        - id: ch03-b02
          speaker: narrator
          text: 就连狐狸奶奶、狐狸雷迪，还有高大强壮的熊巴斯特，也被恐惧攫住了心。彼得觉得，不管一个家伙有多大或多小，可怕的恐惧之灵都能把他找出来。
        - id: ch03-b03
          speaker: narrator
          text: 突然，远处传来“砰”的一声。彼得猛地跳起来，浑身发抖。他知道，所有听见枪响的人都跟他一样，也跳了起来，也在瑟瑟发抖。猎人带着可怕猎枪出没的季节又到了。
        - id: ch03-b04
          speaker: narrator
          text: 大自然老妈妈把万物装点得这样美，就是想让草原和森林里的小居民在这段日子过得最快乐，最少烦恼。可人类偏偏放出了恐惧之灵，让大家心里发冷。大自然老妈妈费尽心思，想把秋天变成一年中最美的时节，人类却把本该欢乐的秋天变成了一年中最悲凉的时节。
        - id: ch03-b05
          speaker: narrator
          text: 彼得和小彼得太太躲在亲爱的老荆棘丛中，害怕地望着外面。彼得忍不住开了口。
        - id: ch03-b06
          speaker: peter_rabbit
          text: 我真不懂这些人类。他们居然觉得杀我们很有意思，还真的拿这件事取乐。我怎么也想不明白。他们肯定没有心。一定是这样，他们根本没有心。
