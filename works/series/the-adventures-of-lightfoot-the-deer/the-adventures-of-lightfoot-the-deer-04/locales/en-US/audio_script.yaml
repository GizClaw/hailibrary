  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, earnest, and quick to react
        timbre: light and youthful
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: THE SPIRIT OF FEAR
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When the days turn cold and the nights are clear, the Spirit of Fear goes stalking abroad.
        - id: ch01-b02
          speaker: narrator
          text: It is sad, but it is true. People often call autumn the sad season, and that is what it has become. Yet Old Mother Nature never meant autumn to be sad. She meant it to be the glad time of year.
        - id: ch01-b03
          speaker: narrator
          text: By autumn, all the little people of the Green Forest and the Green Meadows have finished raising their families. Their children have learned how to watch out for themselves. Food is plentiful, everyone is fat, and everyone is free of the worries that filled the earlier seasons. At least, that is how it ought to be.
        - id: ch01-b04
          speaker: narrator
          text: Old Mother Nature meant her little people to be happy during this short season. She wanted them to have nothing to trouble them before the cold weather arrived, bringing the hard times that always follow it.
        - id: ch01-b05
          speaker: narrator
          text: Instead, a grim, dark figure stalks across the Green Meadows and through the Green Forest. It is called the Spirit of Fear. It peers into every hiding place. Whenever it finds one of the little people, it sends cold little chills through him. Even jolly, round, bright Mr. Sun cannot drive those chills away, no matter how brightly he shines.
        - id: ch01-b06
          speaker: narrator
          text: The Spirit of Fear searches for the meadow and forest people all day and all night. It will not let them sleep. It will not let them eat in peace. It makes them hunt for new hiding places, then drives them from those places too. At the smallest sound, they are ready to run or fly.
        - id: ch01-b07
          speaker: narrator
          text: Peter Rabbit was thinking about all this as he sat at the edge of the dear Old Briar-patch and looked toward the Green Forest. The forest was no longer simply green. Old Mother Nature had sent Jack Frost to paint the leaves of the maples, beeches, birches, poplars, and chestnuts. He had done his work well.
        - id: ch01-b08
          speaker: narrator
          text: Reds and yellows and browns shone beautifully against the dark green pines, spruces, and hemlocks. In the distance, the Purple Hills looked more softly purple than they did at any other time of year. Everywhere Peter looked, the autumn world was lovely.
        - id: ch01-b09
          speaker: narrator
          text: Peter noticed none of that beauty. The Spirit of Fear had come even to the dear Old Briar-patch, and Peter was afraid. He was not afraid of Reddy Fox, Redtail the Hawk, Hooty the Owl, or Old Man Coyote. They were always trying to catch him, but they did not fill his heart with terror. Peter believed he was clever enough to stay out of their claws.
        - id: ch01-b10
          speaker: narrator
          text: Of course, one of them sometimes surprised Peter and gave him a sudden fright. But that fear lasted only until he reached a thick tangle of brambles or a hollow log where the hunter could not touch him. The fear that chilled his heart now was different. It never left him, even for a moment.
        - id: ch01-b11
          speaker: narrator
          text: Peter knew the same fear had hold of Bob White, hidden in the brown stubble, and Mrs. Grouse, crouched in the thickest bramble tangle in the Green Forest. Uncle Billy Possum and Bobby Coon felt it inside their hollow trees. Jerry Muskrat felt it in the Smiling Pool. Happy Jack Squirrel felt it while he hid high in the treetops.
        - id: ch01-b12
          speaker: narrator
          text: Lightfoot the Deer felt it too, lying in the thickest thicket he could find. Even Granny Fox, Reddy Fox, and great big Buster Bear could not escape it. To Peter, it seemed that no one was too large or too small for the terrible Spirit of Fear to find.
        - id: ch01-b13
          speaker: narrator
          text: Far away, a sudden bang rang out. Peter jumped and shivered. He knew every other creature who heard it had jumped and shivered too.
        - id: ch01-b14
          speaker: narrator
          text: The season of hunters with terrible guns had begun. It was man who had sent the Spirit of Fear to chill the hearts of the meadow and forest people. And he had sent it at the very time when Old Mother Nature had made everything so beautiful, the time when she meant her little people to be happiest and most free from care.
        - id: ch01-b15
          speaker: narrator
          text: Man had turned autumn from a glad season into a sad one. He had made it the saddest season of all, just when Old Mother Nature had done her very best to make it the most beautiful.
        - id: ch01-b16
          speaker: narrator
          text: Peter and little Mrs. Peter stared fearfully out from the dear Old Briar-patch.
        - id: ch01-b17
          speaker: peter_rabbit
          text: I just can't understand those men. They really seem to enjoy trying to kill us. How could anyone enjoy that? I don't understand them at all. They must not have any hearts. Yes, that has to be the reason. They haven't any hearts.
          emotion: fearful
