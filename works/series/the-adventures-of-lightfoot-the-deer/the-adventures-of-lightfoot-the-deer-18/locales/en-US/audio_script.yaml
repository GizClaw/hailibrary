  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    hunter:
      display_name: The Hunter
      tts:
        delivery: calculating and self-satisfied, with a quick temper
        timbre: firm and rough-edged
        pace: steady
        pitch: medium-low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: alert, outspoken, and brisk
        timbre: bright and piercing
        pace: quick
        pitch: high
    mr_quack:
      display_name: Mr. Quack
      tts:
        delivery: earnest and friendly
        timbre: rounded and clear
        pace: steady
        pitch: medium
    mrs_quack:
      display_name: Mrs. Quack
      tts:
        delivery: warm and sincere
        timbre: soft and clear
