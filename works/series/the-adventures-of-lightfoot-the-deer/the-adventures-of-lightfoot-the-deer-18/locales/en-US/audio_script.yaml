  chapters:
    - id: ch01
      title: THE HUNTER LOSES HIS TEMPER
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The hunter was still hidden near Paddy the Beaver's pond. When Sammy Jay warned Mr. and Mrs. Quack about Reddy Fox, the hunter laughed to himself without making a sound. He thought Sammy's warning had played a fine joke on Reddy, and it pleased him very much.
        - id: ch01-b02
          speaker: narrator
          text: The hunter wanted those Ducks for himself. He believed they would stay at the little pond for several days. After he got Lightfoot the Deer, he meant to come back and shoot them. But Lightfoot had to come first. The hunter knew that firing at anything else might cost him his chance at the Deer.
        - id: ch01-b03
          speaker: hunter
          text: Sammy Jay helped me without even knowing it. Reddy Fox surely would have caught one of those Ducks if Sammy hadn't come along at just the right moment. What a shame it would have been for that Fox to catch one! I mean to get one myself, and I hope I get them both.
        - id: ch01-b04
          speaker: narrator
          text: Think about that for a moment. It would have been much worse for the hunter to kill Mr. and Mrs. Quack than for Reddy to do it. Reddy hunted because he was hungry. The hunter would shoot the Ducks for sport. He did not need them, because he already had plenty of food. Reddy Fox never kills merely for the pleasure of killing.
        - id: ch01-b05
          speaker: narrator
          text: So the hunter stayed in his hiding place, feeling very friendly toward Sammy Jay. Sammy watched Reddy Fox disappear. Then he flew to the side of the pond where the hunter was sitting.
        - id: ch01-b06
          speakers: [mr_quack, mrs_quack]
          ensemble: duo
          text: Thank you, Sammy!
        - id: ch01-b07
          speaker: sammy_jay
          text: I only did what I'd do for anyone. You would have done the same thing for me.
        - id: ch01-b08
          speaker: narrator
          text: Sammy rested quietly in the top of a tree for a while, but his sharp eyes never stopped searching. Before long, he noticed the hunter sitting on the log. At first, Sammy could not tell what he was seeing. The shape did not move at all, yet it made him suspicious.
        - id: ch01-b09
          speaker: narrator
          text: Sammy flew to another tree so he could get a better look. At once he saw the terrible gun, and he knew exactly what it was.
        - id: ch01-b10
          speaker: sammy_jay
          text: Thief! Thief! Thief!
        - id: ch01-b11
          speaker: narrator
          text: Sammy shouted as loudly as he could. That was when the hunter lost his temper. Sammy Jay had discovered him, and the hunter knew there was no use staying any longer. He was angry clear through.
