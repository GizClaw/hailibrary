audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    hunter:
      display_name: 猎人
      tts:
        delivery: 老练警觉，说话低沉而自信
        timbre: 粗哑厚重
        pace: 沉稳
        pitch: 低音
    sammy_jay:
      display_name: 蓝松鸦萨米
      tts:
        delivery: 机敏活泼，直来直去，遇事反应很快
        timbre: 清亮利落
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十八章　猎人发了脾气
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 猎人藏在海狸帕迪的池塘边，无声地笑了起来。蓝松鸦萨米刚刚提醒野鸭先生和太太，搅黄了狐狸雷迪的好事。猎人觉得这一幕实在可笑，心里也十分高兴，因为他自己同样想得到那两只野鸭。
        - id: ch01-b02
          speaker: narrator
          text: 他料想野鸭夫妇还会在小池塘里住上几天，就盘算着先猎到鹿轻足，再回来朝他们开枪。眼下，他最想得到的是轻足。要是先去打别的猎物，很可能连向轻足开枪的机会也会丢掉。
        - id: ch01-b03
          speaker: hunter
          text: 萨米可真是帮了我一个大忙，偏偏他自己还不知道。要不是他来得及时，雷迪准会抓住一只野鸭。让那只狐狸吃掉他们中的一个，多可惜啊！我得亲手猎到一只，最好把两只都弄到手。
        - id: ch01-b04
          speaker: narrator
          text: 可仔细想想，猎人杀死野鸭先生和太太，其实比雷迪杀死他们可耻得多。雷迪捕猎，是为了填饱肚子。猎人开枪，却只图好玩。他不缺食物，也根本不需要那两只野鸭。狐狸雷迪可不会为了享受杀戮，平白夺走别人的性命。
        - id: ch01-b05
          speaker: narrator
          text: 猎人仍旧坐在藏身处，这会儿，他对蓝松鸦萨米满怀好感。萨米目送雷迪跑远，便飞到了猎人所在的池塘这一边。
        - id: ch01-b06
          speaker: narrator
          text: 野鸭先生和太太高声向萨米道谢。萨米说，自己不过做了愿意为任何人做的事，要是换成他们，他们也一定会帮助他。
        - id: ch01-b07
          speaker: narrator
          text: 接下来的一阵子，萨米安安静静地坐在树顶，那双锐利的眼睛却一直忙个不停。不久，他发现圆木上坐着一个东西。那东西一动也不动，萨米起先看不出究竟是什么，可心里已经有了疑虑。
        - id: ch01-b08
          speaker: narrator
          text: 他飞到另一棵树上，想看得更清楚。那支可怕的猎枪立刻落进他的眼里。萨米认识猎枪，也马上明白了坐在那里的是谁。
        - id: ch01-b09
          speaker: sammy_jay
          text: 有小偷！有小偷！有小偷！
        - id: ch01-b10
          speaker: narrator
          text: 萨米又一次扯开嗓子大叫。猎人这下发了脾气。他知道蓝松鸦萨米已经发现自己，再躲下去也毫无用处。猎人浑身上下都气坏了。
