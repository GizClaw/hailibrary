  chapters:
    - id: ch01
      title: LIGHTFOOT DOES THE WISE THING
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: For the rest of that day, the hunter with the terrible gun stayed hidden among the bushes in the pasture. From that hiding place, he kept watch on the safe spot where Lightfoot the Deer was resting. He meant to catch Lightfoot leaving. Waiting took a great deal of patience, but the hunter had plenty of it. Sometimes hunters seem more patient than anyone else.
        - id: ch01-b02
          speaker: narrator
          text: But all his waiting came to nothing. Jolly, round, red Mr. Sun went down in the west and slipped behind the Purple Hills. The Black Shadows crept out and deepened. Then the stars began to twinkle, one after another. The hunter kept watching, but Lightfoot never appeared.
        - id: ch01-b03
          speaker: narrator
          text: At last, the darkness made it useless to stay. The disappointed hunter grew angry again. He tramped back to the Big River, climbed into his boat, and rowed to the other side. Then he walked home with bitter thoughts.
        - id: ch01-b04
          speaker: narrator
          text: He knew he could have shot Lightfoot if the farmer had not protected the Deer. Now he even wondered whether the farmer had killed Lightfoot himself. The hunter had been certain Lightfoot would head for the woods as soon as he was rested. Yet Lightfoot had stayed out of sight. The hunter had not caught even one more glimpse of him.
        - id: ch01-b05
          speaker: narrator
          text: The hunter was disappointed because Lightfoot had been wise. Lightfoot understood that the man who saved him was a true friend. All afternoon, Lightfoot rested on soft hay inside the open shed. He watched the man at work and saw how carefully the man avoided frightening him.
        - id: ch01-b06
          speaker: lightfoot
          text: He won't let anyone hurt me, and he won't hurt me either. When he's close by, I'm safe. I'll stay here until hunting season is over. Then I'll swim back across the Big River and go home to my dear Green Forest.
        - id: ch01-b07
          speaker: narrator
          text: So Lightfoot rested all afternoon without putting so much as his nose outside the shed. That was why the hunter never saw him.
        - id: ch01-b08
          speaker: narrator
          text: When night came and the darkness was deep enough to end the danger, Lightfoot rose and stepped out beneath the stars. He felt like himself again, and all his splendid strength had returned. He bounded lightly over the meadow and up into the brushy pasture where the hunter had been hiding.
        - id: ch01-b09
          speaker: narrator
          text: Lightfoot browsed there and in the woods beyond the pasture. At the first hint of another day, he turned back. Early that morning, his friend the farmer came out to milk the cows. There was Lightfoot, safely back inside the open shed. The farmer smiled.
        - id: ch01-b10
          speaker: lightfoots_friend
          text: Old fellow, you're every bit as wise as you are handsome.
