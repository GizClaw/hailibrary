audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    hunter:
      display_name: 猎人
      tts:
        delivery: 强硬急躁，恼怒时咄咄逼人
        timbre: 粗哑厚重
        pace: 偏快
        pitch: 中低音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 机敏真诚，心里有了把握时坚定坦然
        timbre: 清亮温和
        pace: 轻快自然
        pitch: 中音
    lightfoots_friend:
      display_name: 轻足的朋友
      tts:
        delivery: 正直坚定，说话直接而毫不退让
        timbre: 沉稳清晰
        pace: 从容有力
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十六章　轻足做了聪明事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那天剩下的时间里，带着可怕猎枪的猎人一直躲在牧场的灌木丛中。他等着轻足走出那处安全的地方。这件事很考验耐心，可猎人偏偏耐心得很。有时候，他们似乎比谁都能等。
        - id: ch01-b02
          speaker: narrator
          text: 可这一次，猎人白等了。圆圆的红太阳落到西边，睡进了紫山背后。黑影爬出来，颜色越来越深。星星也一颗接一颗亮了起来。猎人还是守在那里，轻足却连影子也没露。
        - id: ch01-b03
          speaker: narrator
          text: 最后，天黑得什么都看不清了。猎人知道，再留下也没有用，只好失望地回到大河边。他又生起气来，脚步踩得很重。到了河边，他爬进船里，划过大河，然后一路走回家，心里满是怨恨。
        - id: ch01-b04
          speaker: narrator
          text: 他认定，要不是那个男人护着轻足，自己早就开枪打中那头鹿了。他甚至怀疑，轻足已经被那个人亲手杀死。猎人原以为，轻足休息够了就一定会进树林。可轻足根本没有动身，猎人也再没看见过他。
        - id: ch01-b05
          speaker: narrator
          text: 猎人会这样失望，是因为轻足比他聪明。轻足看得出来，那个人从猎人手里救下自己，正是因为他真心把自己当朋友。整个下午，轻足都躺在敞棚里柔软的干草上休息。他望着那个人来回干活。对方处处小心，一点也不想惊着他。
        - id: ch01-b06
          speaker: lightfoot
          text: 他不只会拦住别人，不让他们伤害我。他自己也绝不会伤害我。只要他在附近，我就不会有危险。我要留在这里，等狩猎季结束，再游过大河，回到我亲爱的绿森林。
        - id: ch01-b07
          speaker: narrator
          text: 就这样，轻足在棚里休息了一下午，鼻子都没往外探一下。难怪猎人始终看不见他。夜色深到已经没有危险时，轻足才站起来，走进星光下。他又恢复了精神，原先那一身强健的力气也回来了。
        - id: ch01-b08
          speaker: narrator
          text: 轻足轻轻一跃，穿过草地，跑上长满灌木的牧场。猎人白天就藏在这里。他在牧场和后面的树林里慢慢吃着嫩枝叶。可是，新的一天才刚露出一点迹象，他便转身往回走。
        - id: ch01-b09
          speaker: narrator
          text: 一大早，轻足的朋友，也就是那位农夫，出来给奶牛挤奶。他来到敞棚前一看，轻足已经回来了。农夫笑了。
        - id: ch01-b10
          speaker: lightfoots_friend
          text: 老伙计，你不只是长得漂亮，脑子也一样聪明。
