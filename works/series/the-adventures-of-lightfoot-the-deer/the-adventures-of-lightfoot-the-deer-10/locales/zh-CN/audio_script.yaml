audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 聪明还得小心
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 鹿轻足很聪明，真的很聪明。狩猎季节里，他要想保住性命，就非得聪明不可。要不然，他早就没命了。
        - id: ch01-b02
          speaker: narrator
          text: 他从不以为别人都是傻瓜。清早出发追赶他的那个猎人，既不会轻易泄气，也不会被简单的小把戏骗倒。鹿轻足很清楚那猎人有多机警，所以一刻也不敢大意。
        - id: ch01-b03
          speaker: narrator
          text: 有时，明知危险在哪里，反而比不知道究竟有没有危险好受。鹿轻足想，只要弄清猎人的位置，自己就知道下一步该怎么做。也许猎人已经放弃了，那他就能休息，不必再担心。就算猎人还在追，知道了也总比蒙在鼓里强。
        - id: ch01-b04
          speaker: narrator
          text: 可是，要怎么才能查明呢？鹿轻足穿过绿森林，心里来来回回想着这个问题。忽然，他想出了一个主意。
        - id: ch01-b05
          speaker: lightfoot
          text: 我知道怎么办了。这次我一定能弄清他还追不追，也能歇上一会儿。老天知道，我真该休息了。
    - id: ch02
      title: 山丘上的藏身处
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 鹿轻足立刻飞奔出去。跑过好一段路，他掉转方向，又快又轻地沿着来路往回走，脚下几乎没有一点声响，只是稍稍绕到了旧足迹旁边。
        - id: ch02-b02
          speaker: narrator
          text: 不久，他在一座小山丘顶附近找到了要找的东西。那是一堆枝条，是伐木工人修剪倒下的树木时留下的。鹿轻足登上山丘，停在枝条堆后面，一动不动地看了片刻，又侧耳听了片刻。
        - id: ch02-b03
          speaker: narrator
          text: 四周没有异常，他轻轻松了口气，便伏下身来。藏在这里，猎人看不见他，他却能望见山脚下洼地里的旧足迹。要是猎人还跟在后面，就一定会从那片洼地经过，清清楚楚地落进他的眼里。
    - id: ch03
      title: 森林依旧安静
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 鹿轻足舒舒服服地伏在枝条堆后面，等了很久。绿森林里听不见可疑的声音，也看不见可疑的动静，好像根本没有危险在附近游荡。
        - id: ch03-b02
          speaker: narrator
          text: 松鸡先生和松鸡太太从空中飞落，越过洼地，钻进对面的树林，不见了。负鼠比利大叔正在察看一棵空心树。鹿轻足猜，他大概准备搬进去过冬。
        - id: ch03-b03
          speaker: narrator
          text: 野兔跳跳蹲到低垂的铁杉树枝下面，准备睡个午觉。不远处，啄木鸟鼓手正忙着在树上啄洞找虫，那声音清清楚楚地传了过来。
        - id: ch03-b04
          speaker: narrator
          text: 鹿轻足的心渐渐安定了。那个猎人一定已经泄了气，不再追他了。
