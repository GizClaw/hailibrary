audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: LIGHTFOOT'S CLEVER TRICK
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Lightfoot the Deer is smart. Yes, sir, he is very smart. He has to be, especially during hunting season, when his life depends on it. Without his wits, he would have been killed long ago. And Lightfoot never makes the foolish mistake of thinking that no one else is clever.
        - id: ch01-b02
          speaker: narrator
          text: A hunter had begun following him early that morning. Lightfoot knew this man would not give up easily, and simple tricks would not fool him. Lightfoot had great respect for the hunter's cleverness. He could not let himself be careless, not even for one little minute.
        - id: ch01-b03
          speaker: narrator
          text: Knowing that danger is near can be easier than wondering whether danger is there at all. Lightfoot felt that if he knew exactly where the hunter was, he could decide what to do. Perhaps the hunter had grown discouraged and stopped following him. Then Lightfoot could rest without worrying. Even knowing the man was still behind him would be better than not knowing. But how could he find out? As Lightfoot traveled through the Green Forest, he turned the problem over and over in his mind. At last, an idea came to him.
        - id: ch01-b04
          speaker: lightfoot
          text: Now I know what to do. I'll find out whether that hunter is still on my trail, and I'll get some rest at the same time. Goodness knows I need it.
        - id: ch01-b05
          speaker: narrator
          text: Lightfoot bounded away at top speed. After running for some distance, he turned around. Then he moved back toward the place he had just left, quickly but very, very quietly. This time he kept a little to one side of his old trail.
        - id: ch01-b06
          speaker: narrator
          text: Before long, Lightfoot found just what he wanted. Near the top of a little hill lay a pile of branches. Woodchoppers had left them there after trimming the trees they had cut down. Lightfoot climbed the hill and stopped behind the brush pile. For a few moments, he stood perfectly still and watched and listened.
        - id: ch01-b07
          speaker: narrator
          text: Then Lightfoot gave a small sigh of relief and lay down. The brush hid him from sight, but he could still watch his old trail where it crossed the hollow below. If the hunter was still following, he would come through that hollow in plain view.
        - id: ch01-b08
          speaker: narrator
          text: Lightfoot rested comfortably behind the brush for a long time. Nothing moved or made a sound that might warn him of danger in the Green Forest.
        - id: ch01-b09
          speaker: narrator
          text: He watched Mr. and Mrs. Grouse fly across the hollow and disappear among the trees on the other side. He saw Unc' Billy Possum inspecting a hollow tree and guessed that Unc' Billy was preparing to settle into his winter quarters.
        - id: ch01-b10
          speaker: narrator
          text: Then Lightfoot saw Jumper the Hare crouch beneath a low hemlock branch and get ready for a nap. Nearby, he heard Drummer the Woodpecker drilling into a tree in search of worms.
        - id: ch01-b11
          speaker: narrator
          text: Little by little, Lightfoot stopped worrying. The hunter must have become discouraged. He must no longer be following Lightfoot.
