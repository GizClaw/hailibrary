  chapters:
    - id: ch01
      title: THE HUNTED WATCHES THE HUNTER
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Everything was quiet, peaceful, and lovely in the Green Forest. Near the top of a little hill, Lightfoot the Deer lay resting behind a pile of brush. In such a place, it hardly seemed possible that sudden death could be close by. There seemed to be no reason at all to keep watch.
        - id: ch01-b02
          speaker: narrator
          text: But Lightfoot had learned long ago that danger is often closest when you least expect it. He would have liked to take a nap, but he was far too wise to do such a foolish thing. His beautiful, great, soft eyes stayed fixed on the way the hunter with the terrible gun would have to come, if the man was still following his trail. All the while, Lightfoot gently moved his great ears, listening for every little sound.
        - id: ch01-b03
          speaker: narrator
          text: After a while, Lightfoot began to think the hunter might have stopped hunting for the day. Even so, he did not relax his watch for a moment. It was better to watch too carefully than to grow even a little careless. Then his keen ears caught the snap of a small stick far away. The sound was so faint that you or I would never have noticed it. Lightfoot heard it. At once, he became twice as alert and stared toward the place it had come from. A long, long time seemed to pass before he saw something move. A moment later, a man appeared. It was the hunter, carrying the terrible gun across one arm.
        - id: ch01-b04
          speaker: narrator
          text: Now Lightfoot knew that this hunter was patient and determined. The man had not given up hope of coming close enough to shoot him. The hunter crept forward slowly and placed each foot with the greatest care. He did not want to break a stick or stir the leaves. His eyes searched the forest ahead, and he was ready to shoot if Lightfoot came into view within range.
        - id: ch01-b05
          speaker: narrator
          text: The hunter went straight through the hollow at the bottom of Lightfoot's little hill. He was no longer looking at the ground for tracks. Down there, the earth was so hard and dry that Lightfoot had left none. Instead, the hunter moved in the direction the Merry Little Breezes were blowing from. He knew Lightfoot had gone that way. He also knew that as long as the deer remained ahead of him, the breeze could not carry the hunter's scent forward to warn Lightfoot. This is called hunting up-wind.
        - id: ch01-b06
          speaker: narrator
          text: Lightfoot stayed perfectly still and watched until the hunter vanished among the trees. Then he rose without a sound, gave himself a light shake, and slipped noiselessly over the top of the hill toward another part of the Green Forest.
        - id: ch01-b07
          speaker: narrator
          text: Lightfoot felt sure that hunter would not find him again that day.
