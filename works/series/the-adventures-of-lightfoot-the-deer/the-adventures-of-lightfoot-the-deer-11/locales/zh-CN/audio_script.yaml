audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
  chapters:
    - id: ch01
      title: 安静中的危险
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 绿森林里安安静静，一片宁和，景色也很美。鹿轻足伏在小山丘顶附近的枝条堆后休息。眼前一切都很安稳，谁能想到，突然降临的死亡竟然就在近旁呢？这里看起来，用不着提防什么。
        - id: ch01-b02
          speaker: narrator
          text: 可鹿轻足早就明白，越是觉得危险不可能出现，危险有时反而离得越近。他虽然很想睡上一觉，却知道那样太不明智，绝不能真的睡着。
        - id: ch01-b03
          speaker: narrator
          text: 他一直用那双美丽、柔和的大眼睛望着猎人可能出现的方向。如果那个猎人还带着可怕的枪，沿足迹追赶，就会从那边过来。同时，鹿轻足的一对大耳朵也在轻轻转动，捕捉周围每一丝声音。
    - id: ch02
      title: 猎人出现了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 鹿轻足几乎已经断定，猎人今天不再追了。不过，他一点也没有放松。宁可多留几分神，也不能有半点大意。
        - id: ch02-b02
          speaker: narrator
          text: 过了一会儿，远处传来一根小树枝折断的轻响。那声音实在太小，你我多半根本听不见，鹿轻足敏锐的耳朵却抓住了。他马上更加警觉，目不转睛地望向声音传来的地方。
        - id: ch02-b03
          speaker: narrator
          text: 时间好像过去了很久很久，他终于发现那边有东西在动。没一会儿，一个人走进了视野。果然是那个猎人，胳膊上还横托着那杆可怕的枪。
        - id: ch02-b04
          speaker: narrator
          text: 鹿轻足这才看清，这个猎人既有耐心，也有毅力。他还没有死心，仍想靠近到能够射中鹿轻足的地方。
        - id: ch02-b05
          speaker: narrator
          text: 猎人慢慢向前，每只脚落下时都格外小心。他不愿踩断一根树枝，也不愿惊动地上的落叶。两眼紧紧望着前面，只要鹿轻足在射程内露出身影，他随时都会开枪。
    - id: ch03
      title: 迎风而行
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 猎人就这样从小山丘脚下走过，穿进了鹿轻足下方的洼地。他不再低头查看蹄印。那里的地面又硬又干，鹿轻足没有留下任何足迹。
        - id: ch03-b02
          speaker: narrator
          text: 于是，猎人只管朝快乐小微风吹来的方向寻找。他知道鹿轻足往那边去了，也知道风正迎面吹来。只要鹿轻足还在前方，猎人的气味就不会顺风飘到他那里。这种办法，就叫“迎风追猎”。
        - id: ch03-b03
          speaker: narrator
          text: 鹿轻足始终一动不动，眼看着猎人消失在树林深处。随后，他才悄悄站起来，轻轻抖了抖身子，无声地越过山顶，往绿森林的另一处去了。
        - id: ch03-b04
          speaker: narrator
          text: 他相信，今天那个猎人再也找不到自己了。
