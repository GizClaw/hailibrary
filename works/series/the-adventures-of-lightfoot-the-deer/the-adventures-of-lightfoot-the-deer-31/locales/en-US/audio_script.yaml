  chapters:
    - id: ch01
      title: A SURPRISING DISCOVERY
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There may not have been a happier Thanksgiving anywhere in the Great World than Lightfoot the Deer's. The dreadful hunting season was over, and he was back in his beloved Green Forest with nothing to fear. All his neighbors came to say how glad they were that he had escaped. They told him the Green Forest would not have been the same without him.
        - id: ch01-b02
          speaker: narrator
          text: Lightfoot could roam wherever he pleased without being afraid, and he was happy. He did not think he could possibly be happier. There was plenty to eat, and he had that blessed feeling of being safe. What more could anyone want? He began to look sleek and well fed, and he was handsomer than ever. The days grew colder, and the frosty air made him feel good.
        - id: ch01-b03
          speaker: narrator
          text: One evening, just at dusk, Lightfoot went to his favorite drinking place beside the Laughing Brook. He lowered his head toward the water. Then he saw something so surprising that he forgot all about being thirsty. Can you guess what it was? A footprint in the soft mud. Yes, Sir, a footprint.
        - id: ch01-b04
          speaker: narrator
          text: Lightfoot stood there for a long time, staring at it. Wonder and surprise showed in his great, soft eyes. The print looked exactly like one of his own, except that it was smaller. To Lightfoot, it was a very wonderful footprint. He was certain he had never seen one so dainty.
        - id: ch01-b05
          speaker: narrator
          text: He forgot about drinking and began to look for more tracks. Before long, he found them. Every one was just as dainty as the first.
        - id: ch01-b06
          speaker: narrator
          text: Who had made those footprints? Lightfoot wanted to know, and he meant to find out. A stranger was clearly somewhere in the Green Forest. Yet Lightfoot did not mind at all. In fact, he was glad. He could not have explained why, but he truly was.
        - id: ch01-b07
          speaker: narrator
          text: Lightfoot lowered his nose to the footprints and sniffed them. The tracks already showed him that a stranger had made them, and their scent told him the same thing. Now he longed to find whoever had left them.
        - id: ch01-b08
          speaker: narrator
          text: He raised his handsome head and listened for the faintest sound that might mean the stranger was near. Then he tested the wandering little Night Breezes with his delicate nostrils. Perhaps they would carry a trace of scent and show him which way to go. But he heard nothing, and the wandering little Night Breezes brought him no answer.
        - id: ch01-b09
          speaker: narrator
          text: Lightfoot followed the dainty footprints up the bank. There, where the ground became hard, they vanished. He stopped, unable to decide which way to go.
