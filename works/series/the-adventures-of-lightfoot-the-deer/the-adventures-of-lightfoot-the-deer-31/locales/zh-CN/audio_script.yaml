audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
  chapters:
    - id: ch01
      title: 第三十一章　惊人的发现
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 整个大世界里，恐怕谁也没有轻足过得这么快乐。感恩节到了，可怕的狩猎季也终于过去了。他又回到心爱的绿森林，再没有什么需要担心。邻居们一个接一个地来看他，都说他能平安逃回来，大家实在太高兴了。要是少了轻足，绿森林就不像原来的绿森林啦。
        - id: ch01-b02
          speaker: narrator
          text: 轻足又能放心地到处走动，心里别提多快活了。他觉得，自己再也不可能比现在更幸福。吃的东西很充足，而且什么都不用怕，还能再想要什么呢？轻足渐渐长得皮毛油亮，身体壮实，模样比过去更俊美。日子越来越冷，空气里带着霜意，呼吸起来让他觉得十分舒服。
        - id: ch01-b03
          speaker: narrator
          text: 有一天，天刚擦黑，轻足来到欢笑溪边，走到自己最喜欢的饮水处。他低头正想喝水，却突然看见一样东西，惊讶得连口渴都忘了。你猜那是什么？松软的泥地上，留下了一个蹄印。是的，先生，真的是一个蹄印。
        - id: ch01-b04
          speaker: narrator
          text: 轻足站了好久，只顾盯着那个蹄印，柔和的大眼睛里全是惊奇。那个蹄印和他自己的完全一样，只不过小了一点儿。对轻足来说，这可不是一个寻常的发现。他从来没见过这么秀气的蹄印。水也顾不上喝了，他马上找起别的蹄印来。没过多久，他就找到了，而且每一个都同第一个一样秀气。
        - id: ch01-b05
          speaker: narrator
          text: 到底是谁留下了这些蹄印？轻足很想知道，也一定要找出答案。他看得出来，绿森林里来了一位陌生客。奇怪的是，他一点儿也不讨厌这件事，反倒觉得高兴。为什么会这样呢？连轻足自己也说不清，可他心里确实很高兴。
        - id: ch01-b06
          speaker: narrator
          text: 轻足把鼻子贴近蹄印，好好闻了闻。就算他的眼睛没有看出这些蹄印属于陌生客，鼻子也能把这件事告诉他。现在，他满脑子只想找到蹄印的主人。他抬起漂亮的头，仔细听着周围的动静。也许只要传来一点声音，他就能知道陌生客是不是还在附近。
        - id: ch01-b07
          speaker: narrator
          text: 接着，轻足又用灵敏的鼻孔，闻了闻那些四处飘荡的小夜风。他盼着风能送来一丝气味，好告诉他应该往哪边走。可是，周围一点儿声音也没有，小夜风同样没有带来任何消息。轻足只好顺着那串秀气的蹄印，一路追上溪岸。可岸上的地面很硬，蹄印到了那里就不见了。轻足停下来，一时不知道该往哪边走。
