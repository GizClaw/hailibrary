audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    sammy_jay:
      display_name: 蓝松鸦萨米
      tts:
        delivery: 机敏活泼，直来直去，遇事反应很快
        timbre: 清亮利落
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十七章　大战
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 轻足满眼怒火，从海狸帕迪池塘后面的山脊顶上直冲下来。他听懂了蓝松鸦萨米的尖叫，也知道自己一直在找的那个大块头陌生客，就在山脊下面。
        - id: ch01-b02
          speaker: narrator
          text: 那个陌生客也听懂了萨米的叫声。他心里明白，现在逃走，就会显得像个胆小鬼，还会永远在秀足小姐面前丢脸。秀足小姐，正是他一路寻找的那位美丽陌生客。
        - id: ch01-b03
          speaker: narrator
          text: 他非打不可，已经没有别的路了。陌生客气得颈后的毛都竖了起来，两眼也冒着火光，跟轻足一模一样。他纵身跳进帕迪池塘边的一小片空地，站在那里等着轻足。
        - id: ch01-b04
          speaker: narrator
          text: 萨米兴奋极了，一边到处飞，一边扯开嗓子尖叫。
        - id: ch01-b05
          speaker: sammy_jay
          text: 打起来啦！打起来啦！打起来啦！
        - id: ch01-b06
          speaker: narrator
          text: 乌鸦黑仔在绿森林的另一边听见了，也跟着这样喊起来，马上赶到帕迪的池塘。附近听到动静的伙伴，一个接一个，全都匆匆赶来看这场争斗。
        - id: ch01-b07
          speaker: narrator
          text: 浣熊博比和负鼠比利大叔爬上树，那里既看得清楚，又很安全。水貂比利跑到帕迪的水坝上，找了个不会遇险的位置。帕迪自己爬上池塘中央那座屋子的屋顶。
        - id: ch01-b08
          speaker: narrator
          text: 彼得兔和野兔跳跳恰好就在附近。他们躲到几棵小铁杉下面，悄悄探头向外看。大熊巴斯特拖着沉重的脚步走下山坡，在池塘对岸停下来。狐狸雷迪和狐狸奶奶也到了。
        - id: ch01-b09
          speaker: narrator
          text: 轻足和大块头陌生客一动不动，只管恶狠狠地瞪着对方。那段时间仿佛怎么也过不完，其实只有短短一分钟。忽然，两只鹿愤怒地喷着鼻息，低下头，朝对方猛冲过去。
        - id: ch01-b10
          speaker: narrator
          text: 两对鹿角轰然撞在一起，响声传遍了绿森林，两只鹿也一起跪倒在地。他们就这样跪着，用鹿角抵住对方，拼命推挤，拼命扭斗。接着，他们分开来，各自向后退，又一次迎头撞上去。
        - id: ch01-b11
          speaker: narrator
          text: 这场争斗实在可怕，每一个看客都这么说。从前要是还有谁不明白那些大鹿角有什么用，现在可全都看明白了。
        - id: ch01-b12
          speaker: narrator
          text: 有一回，大块头陌生客用鹿角上的一个尖头刺中了轻足的右肩，在他灰色的皮毛上划开一道长长的口子。这一击没有让轻足退缩，反而叫他打得更凶了。
        - id: ch01-b13
          speaker: narrator
          text: 有时候，两只鹿会用后腿直立起来，抬起锋利的蹄子踢打对方。他们你来我往，一次又一次冲向彼此，脚下的地面也被踩得乱七八糟。
        - id: ch01-b14
          speaker: narrator
          text: 渐渐地，两只鹿都喘不过气了，只好不时停下来歇一小会儿。可刚刚缓过气，他们便再次扑到一起，打得比先前还要猛烈。
        - id: ch01-b15
          speaker: narrator
          text: 绿森林里，从来没有人见过这样一场大战。
