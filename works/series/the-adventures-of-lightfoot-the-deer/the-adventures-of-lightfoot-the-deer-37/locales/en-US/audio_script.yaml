audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, excitable, and eager to spread news
        timbre: bright and piercing
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: THE GREAT FIGHT
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Lightfoot the Deer plunged down from the top of the ridge behind Paddy the Beaver's pond. His eyes blazed with rage. He had understood Sammy Jay's screams, and he knew the big stranger he had been hunting for was somewhere below.
        - id: ch01-b02
          speaker: narrator
          text: The big stranger had understood Sammy just as well. If he ran away now, Miss Daintyfoot would think him a coward, and he would be disgraced in her eyes forever. Miss Daintyfoot was the beautiful stranger he had been searching for. There was no escape from it. He had to fight. Anger made the hair rise along his neck, just as it had on Lightfoot's, and his eyes blazed too. He bounded into a small clearing beside Paddy's pond and waited there.
        - id: ch01-b03
          speaker: narrator
          text: Meanwhile, Sammy Jay flew about in tremendous excitement, screaming as loudly as he could.
        - id: ch01-b04
          speaker: sammy_jay
          text: A fight! A fight! A fight!
        - id: ch01-b05
          speaker: narrator
          text: Blacky the Crow heard him from another part of the Green Forest. He took up the cry and hurried straight to Paddy's pond. Everyone close enough to hear came rushing over. Bobby Coon and Unc' Billy Possum climbed trees where they could watch and still be safe. Billy Mink found a safe place on Paddy's dam. Paddy climbed onto the roof of his house out in the pond. Peter Rabbit and Jumper the Hare happened to be nearby, so they hurried beneath some young hemlock trees and peeped out. Buster Bear shuffled down the hill to watch from across the pond. Reddy Fox and Granny Fox were there too.
        - id: ch01-b06
          speaker: narrator
          text: Lightfoot and the big stranger stood perfectly still and glared at one another. It felt like the longest wait imaginable, though it lasted only a minute. Then both Deer snorted with rage. They lowered their heads and charged. Their antlers crashed together with a sound that rang through the Green Forest, and the force knocked both of them to their knees. They pushed and struggled, then broke apart and backed away. A moment later, they charged and did it all again.
        - id: ch01-b07
          speaker: narrator
          text: It was a terrible fight. Everyone watching agreed about that. If any of them had ever wondered what those great antlers were for, now they knew. Once, the big stranger caught Lightfoot's right shoulder with a sharp antler point. It tore a long gash through Lightfoot's gray coat. That only made Lightfoot fight harder.
        - id: ch01-b08
          speaker: narrator
          text: At times, the two Deer reared up and struck at each other with their sharp hoofs. They lunged back and forth until their feet tore up the ground. Both were running out of breath. Every so often, they had to stop and rest for a moment. Then they rushed together once more, fiercer than before. The Green Forest had never seen a fight like it.
