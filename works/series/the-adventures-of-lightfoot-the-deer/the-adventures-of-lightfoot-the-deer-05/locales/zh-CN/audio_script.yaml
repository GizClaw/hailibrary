audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    sammy_jay:
      display_name: 蓝松鸦萨米
      tts:
        delivery: 机敏活泼，直来直去，遇事反应很快
        timbre: 清亮利落
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 一大早的意外
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 蓝松鸦萨米很信那句老话，早睡早起。他从来不需要闹钟。天一亮，刚刚能看清东西，他就醒了，绝不会把时间浪费在盼着多睡一会儿上。就算他真想睡，肚子也不肯答应。萨米每天醒来都饿得很，这一点，所有长着羽毛的邻居都跟他一样。
        - id: ch01-b02
          speaker: narrator
          text: 萨米一睁开眼，就先把自己收拾得整整齐齐。他一向很爱干净，收拾完才出门找早餐。很久以前他就发现，要去那些名叫人类的两条腿动物家门前找吃的，再没有比清早更安全的时候。这天，他本想飞去农夫布朗家的院子，临走却改了主意，转身飞向另一座农场。
        - id: ch01-b03
          speaker: narrator
          text: 时间实在太早，萨米根本没料到会有人起来。可那片院子刚进入他的视野，屋门就开了，一个男人从里面走出来。你可以想想，萨米有多吃惊。他赶紧停在离院子最近的一棵树顶上。
        - id: ch01-b04
          speaker: sammy_jay
          text: 那个人怎么这么早就起来了？
        - id: ch01-b05
          speaker: narrator
          text: 萨米低声嘀咕着，忽然看见男人胳膊下面夹着一样东西。他根本用不着再看第二眼，马上就认出来了。那是一杆猎枪！没错，一杆可怕的猎枪。
    - id: ch02
      title: 猎人走向绿森林
      blocks:
        - id: ch02-b01
          speaker: sammy_jay
          text: 哈！这个家伙天刚亮就带着枪，到底想找谁？他是要去亲爱的老荆棘丛抓彼得兔，还是去老牧场找狐狸雷迪？难道他想杀掉松鸡先生和松鸡太太？我就在这里坐着瞧瞧吧。
        - id: ch02-b02
          speaker: narrator
          text: 萨米连自己的肚子还空着也忘了，就坐在树顶，一直盯着那个拿着可怕猎枪的猎人。只见猎人径直朝绿森林走去，一点也没有转向别处。
        - id: ch02-b03
          speaker: sammy_jay
          text: 看来他真是去找松鸡先生和松鸡太太。我要是知道他们在哪儿，就飞过去提醒他们。
        - id: ch02-b04
          speaker: narrator
          text: 可萨米根本不知道松鸡先生和松鸡太太究竟在哪里。他也明白，要找到他们，也许得花上很长时间。于是，他又想起了还没吃到的早餐。偏偏就在这时，另一个念头跳进了脑海。他想到了鹿轻足。
    - id: ch03
      title: 萨米赶去报信
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 萨米看着猎人走进绿森林，便一声不响地跟了上去。他留心观察那人的走法，很快断定，猎人想找的不是松鸡先生和松鸡太太。
        - id: ch03-b02
          speaker: sammy_jay
          text: 这人准是冲着鹿轻足去的，错不了。得给鹿轻足报信，真的得告诉他。我知道他在哪儿，还是由我亲自去提醒他吧。
        - id: ch03-b03
          speaker: narrator
          text: 萨米赶到自己料想的地方，果然找到了鹿轻足。
        - id: ch03-b04
          speaker: sammy_jay
          text: 他来了！有个猎人拿着一杆可怕的猎枪，正朝这边来！
