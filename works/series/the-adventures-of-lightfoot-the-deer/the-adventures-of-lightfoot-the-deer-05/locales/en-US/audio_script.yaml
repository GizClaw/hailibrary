audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: alert, curious, and quick-thinking
        timbre: bright and crisp
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: SAMMY JAY BRINGS LIGHTFOOT WORD
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sammy Jay believes in the wisdom of the old saying, "Early to bed and early to rise." He doesn't need an alarm clock to wake him in the morning. As soon as there is enough light to see, his eyes are open. He never lies there wishing for a little more sleep. Even if he wanted to, his stomach wouldn't allow it. Sammy always wakes up hungry, just like all his feathered neighbors.
        - id: ch01-b02
          speaker: narrator
          text: The moment Sammy opened his eyes that morning, he made his toilet. Sammy was always very neat. Then he set out to find his breakfast. Long ago, he had learned that the safest time to visit the dooryards of men was very early in the morning.
        - id: ch01-b03
          speaker: narrator
          text: Sammy had planned to fly to Farmer Brown's dooryard. At the last moment, though, he changed his mind and headed for another farm. It was so early that he didn't expect anyone to be awake or moving around. Imagine his surprise when the dooryard came into sight, the farmhouse door opened, and a man stepped outside.
        - id: ch01-b04
          speaker: narrator
          text: Sammy stopped on top of the nearest tree.
        - id: ch01-b05
          speaker: sammy_jay
          text: What is that man doing up so early?
        - id: ch01-b06
          speaker: narrator
          text: Then Sammy noticed something tucked under the man's arm. One look was enough. It was a gun. Yes, sir, it was a terrible gun. Sammy forgot all about his empty stomach.
        - id: ch01-b07
          speaker: sammy_jay
          text: Ha! Who could he be hunting at this hour? Maybe he's going to the dear Old Briar-patch to find Peter Rabbit. Or perhaps he'll search the Old Pasture for Reddy Fox. He might be hoping to kill Mr. and Mrs. Grouse. I'll stay right here and see where he goes.
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: Sammy stayed high in the treetop and watched the hunter with the terrible gun. He kept his eyes on the man and saw him walk straight toward the Green Forest.
        - id: ch01-b09
          speaker: sammy_jay
          text: I suppose he really is after Mr. and Mrs. Grouse. If I knew exactly where they were, I'd fly over and warn them.
        - id: ch01-b10
          speaker: narrator
          text: But Sammy didn't know exactly where the Grouse were. Finding them might take a long time. Soon he was thinking about breakfast again. Then, right at that moment, another thought popped into his head. He remembered Lightfoot the Deer.
        - id: ch01-b11
          speaker: narrator
          text: Sammy watched until the hunter entered the Green Forest. Then he silently followed and kept the man in sight. The way the hunter moved convinced Sammy that Mr. and Mrs. Grouse were not the ones he wanted.
        - id: ch01-b12
          speaker: sammy_jay
          text: He's after Lightfoot the Deer. I'm sure of it! Lightfoot ought to know. He must be warned, and I know just where to find him. I'll go tell him myself.
        - id: ch01-b13
          speaker: narrator
          text: Sammy found Lightfoot exactly where he expected him to be.
        - id: ch01-b14
          speaker: sammy_jay
          text: He's coming! A hunter with a terrible gun is coming!
