  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: LIGHTFOOT'S LONG SWIM
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Big River was very wide. Even if Lightfoot had been fresh and at his best, swimming across it would have taken a long time. It may seem strange, but Lightfoot is a splendid swimmer in spite of his small, delicate feet. He enjoys the water.
        - id: ch01-b02
          speaker: narrator
          text: But Lightfoot was terribly tired now. He had been running for so long with the hounds behind him. At first, he swam quickly. Then his worn-out muscles grew even more weary. By the time he reached the middle of the Big River, he felt as though he were making no progress at all.
        - id: ch01-b03
          speaker: narrator
          text: When he entered the water, Lightfoot had aimed for a clump of trees on the opposite bank, a little way upriver. To reach them, he had to fight the current. He soon realized he was not strong enough. So he turned toward a place farther down the Big River. Now the current carried him along instead of pushing against him, and the swimming became easier.
        - id: ch01-b04
          speaker: narrator
          text: Even with the current helping him, Lightfoot could feel his strength slipping away. Had he escaped the hounds and those terrible hunters only to drown in the Big River? For a little while, that new fear gave him fresh strength. But it did not last.
        - id: ch01-b05
          speaker: narrator
          text: Lightfoot was three quarters of the way across, yet the far bank still seemed a long way off. Little by little, the hope in his heart faded. He would keep swimming as long as he could. After that... well, drowning would be better than being torn to pieces by dogs.
        - id: ch01-b06
          speaker: narrator
          text: At last, Lightfoot felt he could not make one more stroke. He thought the end had come. Then one foot touched something. A moment later, all four feet touched bottom. Lightfoot had found firm ground. He stood there with the water reaching only to his knees. Out in the middle of the Big River, he had discovered a little sandbar.
        - id: ch01-b07
          speaker: narrator
          text: Hope came back with a small gasp. Lightfoot waded along the sandbar until the water started to deepen again. He had hoped he could walk all the way to shore. Now he saw that he would have to swim once more.
        - id: ch01-b08
          speaker: narrator
          text: For a long time, Lightfoot stayed exactly where he was. He was so tired that his whole body trembled, and he was every bit as frightened as he was weary. Standing there in the open water made him nervous. Anyone could see him from far away.
        - id: ch01-b09
          speaker: narrator
          text: What if a hunter on the bank ahead spotted him? Lightfoot would have no chance at all. The hunter could simply wait and shoot him as he climbed out of the river.
        - id: ch01-b10
          speaker: narrator
          text: Still, Lightfoot had to rest. So he stood on that little sandbar in the Big River for a long time. Slowly, little by little, he felt his strength returning.
