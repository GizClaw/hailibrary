audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十二章　轻足的长途泅渡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 大河宽得很。哪怕轻足精神十足，正有力气，要游到对岸也得游上好一阵。别看他的四只脚小巧纤细，他的水性可好着呢，而且他本来就喜欢游水。
        - id: ch01-b02
          speaker: narrator
          text: 可这一次不同。轻足为了躲开猎犬，已经在前面跑了那么远，实在累坏了。起初，他还游得很快。慢慢地，疲乏的肌肉越来越使不上劲。游到大河中央时，他甚至觉得自己根本没在向前。
        - id: ch01-b03
          speaker: narrator
          text: 刚下水时，轻足看准了对岸上游的一丛树，想往那里游。可他得迎着水流往前，没过多久便明白，自己的力气撑不住了。他只好转个方向，朝下游的一处河岸游去。顺着水流以后，游起来轻松了一点。河水不再拦着他，反而在后面推他。
        - id: ch01-b04
          speaker: narrator
          text: 即使这样，轻足还是感觉到，身上的力气正在一点点消失。难道他躲过了猎犬，又逃过了可怕的猎人，最后却要淹死在大河里？这个新冒出来的恐惧，又给了他一点力气，可那点力气很快也用完了。
        - id: ch01-b05
          speaker: narrator
          text: 轻足已经游过了四分之三的河面，对岸看起来却还是那么远。他心里的希望一点点灭了。只要还能划动，他就继续往前游。等到再也游不动的时候……唉，淹死总比让狗撕成碎片好。
        - id: ch01-b06
          speaker: narrator
          text: 轻足觉得自己连一下也划不动了。他以为，一切就要结束。就在这时，一只脚忽然碰到了什么。接着，四只脚都碰到了。他终于踩稳了，站在河水里，水只没到膝盖。原来大河中央藏着一小片沙洲。
        - id: ch01-b07
          speaker: narrator
          text: 希望又回来了。轻足轻轻喘了一口气，沿着沙洲向前蹚。可是没走多远，河水又渐渐深了。他原本盼着能一直蹚到岸边，现在才知道，剩下的路还得靠游。
        - id: ch01-b08
          speaker: narrator
          text: 轻足在原地站了很久。他实在太累，浑身都在发抖。他有多疲惫，心里就有多害怕。站在空荡荡的河水中，远处的人也能看见他。一想到这一点，他就又紧张，又恐惧。
        - id: ch01-b09
          speaker: narrator
          text: 要是他要去的那一岸，正有一个猎人看见他呢？那他可就一点机会也没有了。猎人什么都不用做，只要等在那里，等轻足一走出河水，就朝他开枪。
        - id: ch01-b10
          speaker: narrator
          text: 可是，轻足必须休息。他只能站在大河里的这片小沙洲上，久久不动。就这样，他的力气慢慢地、一点一点地回来了。
