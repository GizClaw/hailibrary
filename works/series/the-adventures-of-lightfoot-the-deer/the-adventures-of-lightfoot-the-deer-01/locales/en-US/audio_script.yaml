audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, earnest, and quick to react
        timbre: light and youthful
        pace: quick
        pitch: medium-high
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: PETER RABBIT MEETS LIGHTFOOT
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit was heading home from Paddy the Beaver's pond, deep in the Green Forest. He had just watched Mr. and Mrs. Quack leave for the Big River. They were making one short visit there before beginning their long, hard journey to the far-away Southland. Saying goodbye is always a little sad. This goodbye had left Peter with a queer lump in his throat, as if he could hardly swallow.
        - id: ch01-b02
          speaker: peter_rabbit
          text: If only I knew they'd be back next spring, I wouldn't feel so bad. It's those terrible guns. I know what it's like to watch out for them. Farmer Brown's boy used to hunt me with a gun, though he doesn't do it anymore. Even then, I never faced what the Ducks do. If I kept my eyes and ears open, I could tell when a hunter was coming. I could hide in a hole if I needed to, and I never had to worry about finding a meal. The Ducks have it a thousand times worse. They have to eat along that long journey, and they can only stop where the right food grows. Hunters know those places. They hide and wait for the Ducks, and the Ducks can't know they're there. That isn't hunting. It's... it's...
        - id: ch01-b03
          speaker: lightfoot
          text: Well, what is it? And what are you muttering to yourself about, Peter Rabbit?
        - id: ch01-b04
          speaker: narrator
          text: Peter jumped and looked up. Over the top of a little hemlock tree, Lightfoot the Deer was gazing down at him with his soft, beautiful eyes.
        - id: ch01-b05
          speaker: peter_rabbit
          text: It's awful! It's worse than unfair. The Ducks don't get any chance at all.
        - id: ch01-b06
          speaker: lightfoot
          text: If you say so, I suppose it must be. But perhaps you could tell me what is so awful.
        - id: ch01-b07
          speaker: narrator
          text: Peter grinned. Then he started at the beginning. He told Lightfoot about Mr. and Mrs. Quack, and about all the dangers they would meet on their long trip to the far-away Southland and home again in spring. Those dangers were there because heartless hunters waited with terrible guns. Lightfoot listened, and his great soft eyes filled with pity for the Quack family.
        - id: ch01-b08
          speaker: lightfoot
          text: I hope they make the journey safely, and I hope they come back in spring. Being hunted by men during one season is bad enough. No one knows that better than I do. But being hunted in spring as well as fall is much more than twice as bad. Men are strange creatures. I don't understand them at all. No one who lives in the Green Forest would dream of doing such terrible things. I suppose hunting another creature for enough food is all right, though I'm thankful I've never had to do it. But hunting someone just for the fun of it? I can't understand that. And yet men seem to do exactly that. Maybe the trouble is that no one has ever hunted them, so they don't know how it feels. Sometimes I think I ought to hunt a man someday, just to teach him a lesson. What are you laughing at, Peter?
        - id: ch01-b09
          speaker: peter_rabbit
          text: I'm laughing at the thought of you hunting a man. Your heart is in the right place, Lightfoot, but you're much too shy and gentle to scare anyone. I wouldn't be afraid of you, no matter how big you are.
        - id: ch01-b10
          speaker: narrator
          text: In one quick bound, Lightfoot sprang out in front of Peter. He stamped his sharp hoofs. Then he lowered his handsome head and aimed the pointed tips of his antlers straight at Peter. People often call those antlers horns. The hair rose along the back of Lightfoot's neck, and he moved as though he were about to charge. His eyes had always seemed soft and gentle to Peter. Now they appeared to flash with fire.
        - id: ch01-b11
          speaker: peter_rabbit
          text: Oh!
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: Peter's cry came out faint and frightened. He leaped aside before the thought entered his foolish little head that Lightfoot was only pretending. Lightfoot chuckled.
        - id: ch01-b13
          speaker: lightfoot
          text: Were you saying that I couldn't frighten anyone?
        - id: ch01-b14
          speaker: peter_rabbit
          text: I... I didn't know you could look so terribly fierce. Those antlers really do look dangerous when you point them like that. Why... what is hanging from them? It looks like pieces of old fur. Lightfoot, have you been tearing somebody's coat?
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: Peter stared at him, his eyes wide with wonder and suspicion.
