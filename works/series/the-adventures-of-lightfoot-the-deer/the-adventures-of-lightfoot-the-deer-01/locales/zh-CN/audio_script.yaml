audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 机灵直率，情绪来得快，偶尔有些冒失
        timbre: 明亮轻巧
        pace: 稍快
        pitch: 中高音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 告别后的忧心
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔离开绿森林深处海狸帕迪的池塘，正在往回走。他刚刚送别野鸭先生和太太。他们要先去大河边待几天，然后就得飞向遥远的南方。前面的路又长又难。这样的告别总叫人伤心，彼得更是觉得喉咙发紧，像被什么东西堵住了。
        - id: ch01-b02
          speaker: peter_rabbit
          text: 要是我能肯定他们明年春天会回来，心里就不会这么难受了。可那些猎枪实在太可怕，我知道整天提防它们是什么滋味。布朗农夫家的男孩以前也拿枪追过我，好在如今不再追了。但我的危险哪能跟野鸭们相比呀！我只要睁大眼睛、竖起耳朵，发现猎人来了，就能钻进洞里。我也从来不愁没东西吃。野鸭们却得一边赶那么远的路，一边找吃的。他们只能在有合适食物的地方停下来，猎人偏偏知道那些地方，还会事先躲好。野鸭飞过去的时候，根本不知道猎人是不是正等着他们。这哪里算打猎？这分明是……是……
        - id: ch01-b03
          speaker: lightfoot
          text: 是什么？彼得兔，你一个人在念叨什么呢？
        - id: ch01-b04
          speaker: narrator
          text: 彼得吓了一跳。他抬起头，看见一棵小铁杉的树梢上方，有一双又大又温柔的眼睛正望着自己。原来，鹿轻足就站在那里。
        - id: ch01-b05
          speaker: peter_rabbit
          text: 这事实在太可怕了，比不公平还过分。他们连躲开的机会都没有！
        - id: ch01-b06
          speaker: lightfoot
          text: 你既然这么说，那一定有你的道理。不过，你得先告诉我，到底是什么事这么可怕。
        - id: ch01-b07
          speaker: narrator
          text: 彼得咧嘴一笑，便从头讲了起来。他说到野鸭先生和太太怎样飞往遥远的南方，又怎样在春天赶回来。一路上那些狠心的猎人，还会拿着可怕的猎枪给他们带来许多危险。轻足一直听着，那双柔和的大眼睛里，渐渐盛满了对野鸭一家的怜惜。
    - id: ch02
      title: 轻足谈猎人
      blocks:
        - id: ch02-b01
          speaker: lightfoot
          text: 真希望他们这一路都平安，也希望明年春天还能回来。一年里只在一个季节被人追捕，就已经够难受了，这滋味我最清楚。可他们春天和秋天都逃不过，受的罪可不止多一倍。人类真奇怪，我怎么想也想不通。绿森林里没有谁会做这种事。为了吃饱肚子去捕猎别人，或许还说得过去，幸好我从来不必那样做。可是只图自己好玩，就追着别人打，我实在不能明白。人类似乎偏偏就是这么干的。大概因为他们从没尝过被追捕的滋味吧。有时候我真想也去追一回猎人，让他亲自学个明白。彼得，你在笑什么？
        - id: ch02-b02
          speaker: peter_rabbit
          text: 我在笑你要去追猎人呀。轻足，你心肠当然很好，可你又胆小又温和，根本吓不住谁。你长得再高大，我也不怕你。
    - id: ch03
      title: 谁也吓不着吗
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 轻足忽然纵身一跃，正好落在彼得面前。他用尖蹄重重跺地，低下那颗英俊的脑袋，把一对尖角直直对准彼得。人们也把鹿角叫作犄角。轻足颈后的毛全竖了起来，身子往前一冲，像是就要扑上去。那双彼得一直觉得温柔和善的眼睛，这会儿竟仿佛冒出了火光。
        - id: ch03-b02
          speaker: peter_rabbit
          text: 哎呀，你这样真吓人！
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: 彼得的叫声又细又怕。他赶紧跳到一旁，跳开以后才终于想明白，轻足不过是在装凶吓他。
        - id: ch03-b04
          speaker: narrator
          text: 轻足忍不住低声笑了。
        - id: ch03-b05
          speaker: lightfoot
          text: 你刚才是不是说，我谁也吓不着？
        - id: ch03-b06
          speaker: peter_rabbit
          text: 我……我哪知道你凶起来这么吓人！你这样拿鹿角对着我，看起来真的很危险。咦……角上挂的是什么？好像是几块旧毛皮。轻足，你是不是把谁的外套给扯坏了？
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: 彼得瞪圆了眼睛，目光里既有惊奇，又有怀疑。
