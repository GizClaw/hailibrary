  chapters:
    - id: ch01
      title: SAMMY JAY ARRIVES
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When Reddy Fox reached Paddy the Beaver's pond, the hunter in hiding saw him at once. Lightfoot saw him too, but no one else did. Reddy came forward with the same care and caution he always used while hunting. Then he reached a spot where the whole pond lay before him, and he stopped as if he had turned to stone. One paw was still raised for his next step. Reddy had spotted Mr. and Mrs. Quack.
        - id: ch01-b02
          speaker: narrator
          text: There was nothing Reddy liked better for dinner than a Duck. A hungry gleam came into his eyes, and his mouth began to water. Still, he stood perfectly motionless and watched. He waited until Mr. and Mrs. Quack both dipped their heads underwater to search the mud at the bottom of the pond for food. Then Reddy bounded behind Paddy's dam like a red flash and vanished from sight.
        - id: ch01-b03
          speaker: narrator
          text: Before long, the hunter saw Reddy's black nose appear at the end of the dam. Reddy was peeking around it at Mr. and Mrs. Quack. The two Ducks were feeding their way slowly toward him, and Reddy saw that right away. If he stayed exactly where he was and they kept coming, he had a good chance of getting a fat Duck for dinner. He needed only enough patience to wait for them. So Reddy crouched behind Paddy's dam. He stayed quiet and ready, never taking his eyes off the Ducks.
        - id: ch01-b04
          speaker: narrator
          text: The hunter watched Reddy and the Ducks so closely that he almost forgot about Lightfoot. Mr. and Mrs. Quack drew nearer and nearer to Reddy's hiding place. The hunter felt like standing up and scaring them away. He did not want Reddy to catch them, because he hoped to get those Ducks himself someday.
        - id: ch01-b05
          speaker: hunter
          text: I suppose I was foolish not to shoot them when I had the chance. They're too far away now, and that red rascal looks likely to catch one. Maybe I'll ruin his plans and frighten them off. I don't think that Deer will come back today anyway, so I might as well save those Ducks.
        - id: ch01-b06
          speaker: narrator
          text: But the hunter never did it. Just as he was about to step out of hiding, Sammy Jay arrived. Sammy perched in a tree near the end of Paddy's dam and immediately spotted Reddy Fox. In a moment he understood exactly why Reddy was hiding there.
        - id: ch01-b07
          speaker: sammy
          text: Thief! Thief! Thief!
        - id: ch01-b08
          speaker: narrator
          text: Sammy looked down at Reddy, mischief shining in his sharp eyes. Nothing pleased Sammy Jay more than spoiling Reddy Fox's plans. The moment Mr. and Mrs. Quack heard Sammy's call, they hurried toward the middle of the pond. They knew just what his warning meant.
        - id: ch01-b09
          speaker: narrator
          text: Reddy looked up at Sammy Jay and snarled angrily. There was no use hiding any longer. He bounded away through the Green Forest to hunt somewhere else.
