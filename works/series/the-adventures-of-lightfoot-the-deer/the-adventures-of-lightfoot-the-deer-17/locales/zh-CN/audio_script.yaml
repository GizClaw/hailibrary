audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    hunter:
      display_name: 猎人
      tts:
        delivery: 老练警觉，说话低沉而自信
        timbre: 粗哑厚重
        pace: 沉稳
        pitch: 低音
    sammy_jay:
      display_name: 蓝松鸦萨米
      tts:
        delivery: 机敏活泼，直来直去，遇事反应很快
        timbre: 清亮利落
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十七章　蓝松鸦萨米来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 狐狸雷迪一来到海狸帕迪的池塘，藏在那里的猎人就发现了他，轻足也看得一清二楚。除此以外，没有谁注意到雷迪。他正用自己捕猎时一贯的办法，小心又谨慎地往前走。
        - id: ch01-b02
          speaker: narrator
          text: 等走到一处能看遍整个池塘的地方，雷迪忽然定住了，活像变成了一块石头。他正要迈步，一只脚还抬在半空。是什么让他停下来的？原来，他瞧见了野鸭先生和太太。
        - id: ch01-b03
          speaker: narrator
          text: 要说雷迪最想吃的晚餐，那就是野鸭。他看见野鸭夫妇，眼里立刻有了渴望的亮光，口水也流了出来。不过，他没有乱动，只等着他们双双把头伸进水里，到池底的泥中找食物。
        - id: ch01-b04
          speaker: narrator
          text: 就在这时，一道红影一闪，雷迪跳到了帕迪的水坝后面，转眼便不见了踪影。过了一会儿，猎人看见坝头冒出一个黑鼻子。雷迪躲在那里探头张望，留心野鸭夫妇的一举一动。
        - id: ch01-b05
          speaker: narrator
          text: 那两只野鸭一边觅食，一边慢慢向水坝游来。雷迪马上明白，自己只要守在原地，耐心等他们继续靠近，就很有机会吃上一顿肥野鸭。他伏在坝后，眼睛紧紧盯着他们，一动也不动。
        - id: ch01-b06
          speaker: narrator
          text: 猎人只顾看着雷迪和野鸭，差点把鹿轻足忘了。野鸭夫妇离埋伏越来越近，他很想站起来吓跑他们。他不愿意让雷迪得手，因为他还打算以后亲自猎到这两只野鸭。
        - id: ch01-b07
          speaker: hunter
          text: 刚才有机会的时候，我没开枪，恐怕真是犯傻了。现在他们离得太远，看样子，那个红毛坏蛋就要逮住一只。我干脆把他们吓跑，坏了那家伙的好事。反正那头鹿今天多半不会再回来，不如先救下这两只野鸭。
        - id: ch01-b08
          speaker: narrator
          text: 可猎人到底没有那么做。他刚准备走出藏身的地方，蓝松鸦萨米正好飞来了。萨米落在水坝尽头附近的一棵树上，马上瞧见了雷迪。根本用不着多想，他一下就猜到了雷迪为什么躲在那里。
        - id: ch01-b09
          speaker: sammy_jay
          text: 有小偷！有小偷！有小偷！
        - id: ch01-b10
          speaker: narrator
          text: 萨米尖声叫着，低头望向雷迪，锐利的眼睛里透着淘气。每次能让狐狸雷迪的算盘落空，他就再开心不过了。野鸭先生和太太一听见这个声音，赶忙游向池塘中央。他们很清楚，这一声警告意味着什么。
        - id: ch01-b11
          speaker: narrator
          text: 雷迪抬头冲萨米气恼地低吼了一声。既然藏着也没用了，他只好奔进绿森林，换个地方打猎去了。
