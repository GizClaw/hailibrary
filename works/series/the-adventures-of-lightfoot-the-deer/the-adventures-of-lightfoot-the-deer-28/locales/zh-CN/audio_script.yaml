audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    sammy_jay:
      display_name: 蓝松鸦萨米
      tts:
        delivery: 机敏活泼，直来直去，遇事反应很快
        timbre: 清亮利落
        pace: 稍快
        pitch: 中高音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 朴实沉稳，心地厚道，说话若有所思
        timbre: 温和圆润
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十八章　狩猎季结束了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 再坏的事情，也总有结束的一天。不管它有多糟，都不可能永远继续。轻足熬过的狩猎季也是这样。终于，法律开始保护所有的鹿了。从这天起，猎人不能再到处寻找轻足。
        - id: ch01-b02
          speaker: narrator
          text: 往年到了这一天，绿森林和绿草原上的小居民们都会高兴极了。大家知道，从这天起，直到下一个狩猎季到来，轻足都不会再受到猎人的威胁。可这一年，谁也高兴不起来。轻足不见了，大家怎么找也找不到他。
        - id: ch01-b03
          speaker: narrator
          text: 最后一次有人看见轻足时，他正在拼命逃跑。身后有两条猎犬一路狂叫，绿森林里还到处都是猎人。他们都在等机会朝轻足开枪。
        - id: ch01-b04
          speaker: narrator
          text: 蓝松鸦萨米找遍了绿森林。乌鸦黑仔也来帮忙，他的眼睛和萨米一样尖。可他们还是没找到轻足留下的半点踪迹。海狸帕迪说，轻足已经三天没到他的池塘喝水了。水貂比利常常沿着欢笑溪来来回回，他查看了岸边的软泥，却只看见从前留下的蹄印。到了夜里，野兔跳跳又去找遍轻足最爱去的几处觅食地，可轻足一处也没去过。
        - id: ch01-b05
          speaker: sammy_jay
          text: 博比，轻足肯定出事了。也许那两条猎犬追上去咬死了他，也许某个猎人开枪打中了他。少了轻足，绿森林就不再是原来的样子了。我以后恐怕也不想常来这边。在这里生活的所有人当中，谁不见了，都不会像轻足这样让大家惦记。
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: 博比听完，点了点头。
        - id: ch01-b07
          speaker: bobby_coon
          text: 萨米，你说得没错。没有轻足，绿森林就变了。他从没伤害过任何人，猎人为什么偏要杀死这么美丽的一个人？我怎么也想不通。其实，我连他们为什么要杀我们当中的任何一个都不明白。要是他们非得靠我们填饱肚子，那倒还不一样，可事实并不是这样。你去老牧场问过郊狼老先生吗？他有没有见到轻足？
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: 萨米也点了点头。
        - id: ch01-b09
          speaker: sammy_jay
          text: 我去过两回。郊狼老先生白天一直躲着，夜里却走了不少地方。他的鼻子有多灵，你是知道的。可自从猎犬追赶轻足那天起，他连一点轻足的气味都没闻到。我还以为，他也许能找到轻足遇害的地方，可他找过了，什么也没发现。如今追猎轻足的季节总算结束了。可我怕，它结束得太迟了。
          emotion: sad
