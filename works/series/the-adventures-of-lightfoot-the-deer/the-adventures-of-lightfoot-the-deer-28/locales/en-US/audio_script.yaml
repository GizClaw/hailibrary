  chapters:
    - id: ch01
      title: THE HUNTING SEASON ENDS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Even the very worst things finally end. No matter how bad something is, it cannot go on forever. And so, at last, the hunting season ended for Lightfoot the Deer. The day came when the law protected every Deer, and hunters could no longer go looking for Lightfoot.
        - id: ch01-b02
          speaker: narrator
          text: Usually, the little people of the Green Forest and the Green Meadows were overjoyed when hunting season ended. They knew Lightfoot would face no more danger from hunters until the next hunting season began. But this year, no one celebrated. No one could find Lightfoot. The last time anyone had seen him, he was running for his life. Two hounds were baying behind him, and the Green Forest was full of hunters waiting for a chance to shoot him.
        - id: ch01-b03
          speaker: narrator
          text: Sammy Jay searched all through the Green Forest. Blacky the Crow joined him, and Blacky's eyes were every bit as sharp as Sammy's. Still, they found no sign of Lightfoot. Paddy the Beaver said Lightfoot had not come to his pond for a drink in three days. Billy Mink traveled up and down the Laughing Brook, checking the soft ground along its banks. He found only old footprints. At night, Jumper the Hare visited Lightfoot's favorite feeding places, but Lightfoot had not been to any of them. Every search ended the same way. Lightfoot was nowhere to be found.
        - id: ch01-b04
          speaker: sammy_jay
          text: Bobby, something must have happened to Lightfoot. Either those hounds caught and killed him, or one of the hunters shot him. The Green Forest will never feel the same without him. I don't think I'll want to visit very often. Of all the people who live here, no one would be missed as much as Lightfoot.
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: Bobby Coon nodded.
        - id: ch01-b06
          speaker: bobby_coon
          text: You're right, Sammy. Without Lightfoot, the Green Forest will never be the same. He never hurt anyone. I can't understand why those hunters wanted so badly to kill someone so beautiful. Really, I don't understand why they want to kill any of us. It might be different if they truly needed us for food, but they don't. Did you go to the Old Pasture and ask Old Man Coyote whether he'd seen any sign of Lightfoot?
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: Sammy nodded.
        - id: ch01-b08
          speaker: sammy_jay
          text: I've been there twice. Old Man Coyote has kept out of sight during the day, but he's traveled a great deal at night. You know what a fine nose he has. Yet since the day those hounds chased Lightfoot, he hasn't caught even the faintest bit of Lightfoot's scent. I thought he might find the place where Lightfoot was killed, but he looked and found nothing. Well, hunting season is over for Lightfoot. I'm afraid it ended too late.
          emotion: sad
