audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
  chapters:
    - id: ch01
      title: 第三十九章　轻足发现了爱
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 海狸帕迪池塘边的小空地上，轻足骄傲地昂着头。他刚打赢那场大战，把从大山来的大块头陌生客赶跑。绿森林的邻居们都来祝贺他。这时候的轻足，真是英俊得出奇。
        - id: ch01-b02
          speaker: narrator
          text: 美丽的秀足小姐一直躲在灌木丛里看着。她悄悄探出头，觉得轻足就是整个大世界里最了不起的人。她深深地爱着他，已经不可能爱得更多了。
        - id: ch01-b03
          speaker: narrator
          text: 可轻足一点儿也不知道。他甚至没发现，秀足小姐就在附近。之前，他满脑子只想着赶走那个陌生客。他怕对方找到秀足小姐，把她带走，所以才又生气，又非要跟对方打一场不可。轻足那时还不明白，其实自己是在嫉妒。
        - id: ch01-b04
          speaker: narrator
          text: 如今大战结束，陌生客正匆匆逃回大山，轻足心里的怒火也全消了。他只想赶快找到秀足小姐。那双大眼睛又恢复了往日的温柔和美丽，眼里还透着惆怅。
        - id: ch01-b05
          speaker: narrator
          text: 轻足实在渴坏了，便走到水边喝水。喝完以后，他转过身，准备接着去找美丽的秀足小姐。
        - id: ch01-b06
          speaker: narrator
          text: 这一转，他正对着秀足小姐藏身的那片灌木丛。他敏锐地瞧见树枝轻轻一动，随后，一颗美丽的脑袋慢慢探了出来。轻足又看见了那双温柔的眼睛。在他看来，那一定是整个大世界里最美的一双眼睛。
        - id: ch01-b07
          speaker: narrator
          text: 他心里却有些不安。秀足小姐会不会像上次那样，突然消失，转身跑掉呢？轻足试着朝前走了一两步，那颗美丽的脑袋果然缩了回去。他的心一下子沉了下去，马上纵身跳进灌木丛。
        - id: ch01-b08
          speaker: narrator
          text: 轻足几乎认定，里面已经没有谁了。可他一进去，就遇上了这一生最奇妙的惊喜。秀足小姐还站在那里。她胆怯又羞涩，可她眼里的情意，轻足绝不会看错。
        - id: ch01-b09
          speaker: narrator
          text: 就在这一刻，轻足终于懂了。为什么自己一直渴望找到她？为什么一发现大山来的陌生客，他便那样愤怒？原来，那就是爱。轻足知道自己爱着秀足小姐。望着她温柔和善的眼睛，他也知道，秀足小姐同样爱着他。
