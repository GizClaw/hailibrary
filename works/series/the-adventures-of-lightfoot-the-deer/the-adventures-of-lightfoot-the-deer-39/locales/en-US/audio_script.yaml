  chapters:
    - id: ch01
      title: LIGHTFOOT DISCOVERS LOVE
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Lightfoot the Deer looked wonderfully handsome as he stood in the little opening beside Paddy the Beaver's pond. He held his head high and proud while his neighbors from the Green Forest congratulated him. They had all seen him win the great fight against the big stranger from the Great Mountain.
        - id: ch01-b02
          speaker: narrator
          text: Beautiful Miss Daintyfoot was peeping from the thicket where she had hidden to watch the fight. To her, Lightfoot was the most wonderful person in the whole Great World. She adored him. She loved him as much as she possibly could.
        - id: ch01-b03
          speaker: narrator
          text: Lightfoot knew nothing about that. He did not even know Miss Daintyfoot was there. He had thought only of driving the big stranger out of the Green Forest. Lightfoot had been jealous without knowing it. He had feared that the stranger would find Miss Daintyfoot and take her away. That fear was the true cause of his anger and his wish to fight.
        - id: ch01-b04
          speaker: narrator
          text: Now the fight was over, and the big stranger was hurrying back to the Great Mountain. All of Lightfoot's anger melted away. In its place came a great longing to find Miss Daintyfoot. His great eyes grew soft and beautiful again, and they held a wistful look. Lightfoot walked to the water's edge and drank, for he was very, very thirsty. Then he turned to begin searching for Miss Daintyfoot once more.
        - id: ch01-b05
          speaker: narrator
          text: When Lightfoot turned, he found himself facing the thicket where Miss Daintyfoot was hiding. His keen eyes noticed a slight movement among the branches. Slowly, a beautiful head appeared. Once again, Lightfoot gazed into the soft eyes he thought were the most beautiful in all the Great World. He wondered if she would vanish and run away, just as she had the last time he saw her.
        - id: ch01-b06
          speaker: narrator
          text: He stepped toward her. The beautiful head disappeared into the thicket, and Lightfoot's heart sank. Then he bounded into the bushes. He more than half expected to find no one there. Instead, he received the most wonderful surprise of his life. Miss Daintyfoot stood right there before him. She was timid and bashful, but there was something in her eyes that Lightfoot could not misunderstand.
        - id: ch01-b07
          speaker: narrator
          text: At that moment, Lightfoot understood the longing that had kept him searching for her. He understood the rage that had filled him when he discovered the big stranger from the Great Mountain. It was love.
        - id: ch01-b08
          speaker: narrator
          text: Lightfoot knew he loved Miss Daintyfoot. And when he looked into her soft, gentle eyes, he knew that Miss Daintyfoot loved him.
