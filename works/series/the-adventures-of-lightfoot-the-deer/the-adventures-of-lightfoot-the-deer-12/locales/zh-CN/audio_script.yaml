audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 帕迪的池塘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 绿森林深处有一片池塘，海狸帕迪就住在那儿。这片池塘是帕迪亲手造的。他在欢笑溪上筑了一道水坝，溪水就汇成了自己的池塘。
        - id: ch01-b02
          speaker: narrator
          text: 鹿轻足在高处看着猎人穿过下方的洼地，随后纵身奔进了绿森林。这时候，他想起了帕迪的池塘。
        - id: ch01-b03
          speaker: lightfoot
          text: 我就去那里吧。那一带很偏僻，猎人大概不会过去。我正好也去看看帕迪。
        - id: ch01-b04
          speaker: narrator
          text: 鹿轻足一路跳跃，越跑越深入绿森林。不一会儿，他从树木之间瞧见了闪闪的水光。帕迪的池塘就在前面。
    - id: ch02
      title: 一刻也不能大意
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 鹿轻足小心地走近。他相信，今天紧追自己的那个猎人已经被甩掉了。不过，绿森林里也许还藏着别的猎人，他连一小会儿都不能疏忽。
        - id: ch02-b02
          speaker: narrator
          text: 鹿轻足活了这么久，早就懂得，绿森林和绿草原上那些伤心又可怕的事情，多半都是大意招来的。只要正在被追猎，不管个头多大或多小，就绝不能放松警惕。
        - id: ch02-b03
          speaker: narrator
          text: 从前有猎人躲在水边，等鹿轻足来喝水时朝他开枪。他一直觉得，这种做法既卑劣又不公平。可猎人以前干过，将来就可能再干。
        - id: ch02-b04
          speaker: narrator
          text: 所以，他选择迎着风靠近池塘。他从上风一侧往前走，让快乐小微风迎面吹来，还一路不停地用鼻子闻着。
        - id: ch02-b05
          speaker: narrator
          text: 要是真有猎人藏在那里，风就会把猎人的气味送到他这边，及时给他报信。
    - id: ch03
      title: 对岸的巨响
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 鹿轻足快走到池塘边时，对岸突然传来轰的一声。他着实吓了一跳，可转眼就猜到了那是什么声音。一棵树倒下了。
        - id: ch03-b02
          speaker: narrator
          text: 当时的风很小，连最摇摇欲坠的枯树也吹不倒。周围又一直没有斧头声，所以那棵树不可能是人砍的。
        - id: ch03-b03
          speaker: narrator
          text: 一定是海狸帕迪咬断了树。帕迪既然敢在白天干活，就说明这片池塘已经很久没有人来过。想到这里，鹿轻足急切地往前赶，但每一步依旧很谨慎。
        - id: ch03-b04
          speaker: narrator
          text: 来到岸边，他朝倒树声传来的方向望去。水里有一根树枝正在移动，旁边还露着半颗棕色的脑袋。
        - id: ch03-b05
          speaker: narrator
          text: 原来是海狸帕迪，正把那根树枝运到自己储存食物的地方。
