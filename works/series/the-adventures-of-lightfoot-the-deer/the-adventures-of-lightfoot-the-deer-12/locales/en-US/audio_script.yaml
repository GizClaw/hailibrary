  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: alert, thoughtful, and quietly expressive
        timbre: warm and youthful
        pace: natural
        pitch: medium
  chapters:
    - id: ch01
      title: LIGHTFOOT VISITS PADDY THE BEAVER
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Deep in the Green Forest lies the pond where Paddy the Beaver lives. It belongs to Paddy because he made it himself. He built a dam across the Laughing Brook, and the water gathered behind it to form his pond.
        - id: ch01-b02
          speaker: narrator
          text: Lightfoot had just watched the hunter pass through the hollow below him. As he bounded away through the forest, he remembered Paddy's pond.
        - id: ch01-b03
          speaker: lightfoot
          text: That's where I'll go. It is such a lonely part of the Green Forest that I don't believe the hunter will come there. I'll run over and pay Paddy a friendly visit.
        - id: ch01-b04
          speaker: narrator
          text: Lightfoot bounded on, farther and farther into the Green Forest. After a while, he saw water gleaming through the trees. It was Paddy's pond. But Lightfoot did not rush toward it. He went closer with great care.
        - id: ch01-b05
          speaker: narrator
          text: He felt sure he had escaped the hunter who had followed him so far that day. Still, another hunter might be somewhere in the Green Forest. Lightfoot knew he could not be careless, even for one little minute. He had lived long enough to learn that carelessness causes most of the sad and dreadful things that happen in the Green Forest and on the Green Meadows. When someone is being hunted, whether big or little, that someone must always be careful.
        - id: ch01-b06
          speaker: narrator
          text: Lightfoot knew that hunters sometimes hid near water and waited for him to come and drink. To him, that was both dreadful and unfair. Yet hunters had done it before, and they might do it again.
        - id: ch01-b07
          speaker: narrator
          text: So Lightfoot approached Paddy's pond from up-wind. He went toward the side where the Merry Little Breezes were blowing from, and he kept his nose busy the whole time. If a hunter was hiding near the pond, those Breezes would carry the hunter's scent straight to Lightfoot and warn him.
        - id: ch01-b08
          speaker: narrator
          text: Lightfoot was almost at the water's edge when a sudden crash came from the far shore. For one terrible instant, it startled him. Then he understood what the sound must mean. A tree had fallen.
        - id: ch01-b09
          speaker: narrator
          text: There was not enough wind to knock down even the weakest dead tree. Lightfoot had heard no axes, so men could not have chopped it down. Paddy the Beaver must have cut it. And if Paddy had been working in daylight, then no one could have been near that pond for a long time.
        - id: ch01-b10
          speaker: narrator
          text: Lightfoot hurried eagerly toward the pond, though he was still cautious. When he reached the bank, he looked across the water toward the place where the tree had fallen. A branch was moving through the pond. Half hidden beneath it was a brown head. There was Paddy the Beaver, carrying the branch to his food pile.
