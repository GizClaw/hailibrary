audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二十章　轻足听见了可怕的声音
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天又一天，轻足都在跟那些想杀死他的猎人玩捉迷藏，只不过赌上的是自己的性命。他见过猎人好多次，猎人却谁也没瞧见他。有时，他们就从轻足藏身的地方旁边走过，根本不知道他近在眼前。
        - id: ch01-b02
          speaker: narrator
          text: 可怜的轻足快撑不住了。他越来越瘦，整天紧张得不得了。哪怕只有一片枯叶从树上落下来，也能把他吓一跳。一直被人追猎，实在太可怕了。现在每走过一棵树，他都觉得后面也许会冒出一个猎人。
        - id: ch01-b03
          speaker: narrator
          text: 只有等黑影把绿森林藏进夜色，轻足才能安稳一会儿。可这几个钟头就算没有危险，他还是放不下心，因为谁也不知道第二天会发生什么。
        - id: ch01-b04
          speaker: narrator
          text: 一天清早，一阵可怕的声音传遍绿森林。轻足吓得猛然跳起，站直了身子。那是一群猎犬追着踪迹发出的叫声。刚听见时，他倒没觉得有多可怕，因为这样的声音，他以前听过不少次。
        - id: ch01-b05
          speaker: narrator
          text: 猎犬鲍泽追红狐雷迪的时候，也总是这样一路叫着。那时轻足听了并不害怕，因为遇到危险的不是他。
        - id: ch01-b06
          speaker: narrator
          text: 所以这天早晨，轻足起初也以为，猎犬追的准是雷迪。他虽然吃了一惊，心里还不算担忧。可是听着听着，一个吓人的念头冒了出来。他越听越不安。没过几分钟，轻足就确定了，猎犬追着的，正是他留下的踪迹。
        - id: ch01-b07
          speaker: narrator
          text: 这一下，那阵叫声真的变得可怕极了。轻足必须逃命！猎犬会紧追不舍，根本不给他休息的机会。他一心躲避猎犬，就没法再仔细提防那些拿着可怕猎枪的猎人，也不能藏进浓密的灌木丛。说不定什么时候，他就会被一路赶到某个猎人面前。
        - id: ch01-b08
          speaker: narrator
          text: 轻足纵身跑了出去，一跃又一跃，那样的飞跃只有他做得到。过了一会儿，猎犬的声音慢慢远了。轻足停下喘气，一边发抖，一边留神听着。
        - id: ch01-b09
          speaker: narrator
          text: 可是叫声很快又响了起来，而且越来越近，越来越响。猎犬的鼻子实在厉害，顺着轻足的踪迹追赶，一点也不费劲。轻足怕得慌了神，只好再次飞奔起来。
        - id: ch01-b10
          speaker: narrator
          text: 他刚穿过一条旧路，一声可怕的枪响就震动了整个绿森林。紧接着，有什么东西从他背上方的树干上撕掉了一片树皮。那是一颗子弹，只差一点就打中了轻足。他更害怕了，也跑得更快了。
        - id: ch01-b11
          speaker: narrator
          text: 轻足就这样不停地跑啊，跑啊。猎犬的叫声紧跟在身后，始终回荡在绿森林里。
