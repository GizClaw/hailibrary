  chapters:
    - id: ch01
      title: LIGHTFOOT HEARS A DREADFUL SOUND
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Day after day, Lightfoot the Deer played a deadly game of hide and seek with the hunters who wanted to kill him. He caught sight of them many times, but not one of them ever saw him. More than once, a hunter passed close beside his hiding place and never guessed that Lightfoot was there.
        - id: ch01-b02
          speaker: narrator
          text: But the strain was wearing poor Lightfoot down. He was getting thin, and his nerves were so badly shaken that even a dead leaf dropping from a tree made him jump. Nothing is quite so terrible as being hunted all the time. Lightfoot had begun to expect a hunter behind every tree. He found a little peace only after the Black Shadows covered the Green Forest with darkness. Even then, while he was safe for the night, he dreaded whatever the next day might bring.
        - id: ch01-b03
          speaker: narrator
          text: Early one morning, a terrible sound echoed through the Green Forest. Lightfoot leaped to his feet in alarm. Hounds were baying as they followed a trail. At first, the sound did not seem so terrible. Lightfoot had heard it often. Many times, he had listened to Bowser the Hound baying after Reddy Fox. Back then, there had been no reason for Lightfoot to fear it, because he was not the one in danger.
        - id: ch01-b04
          speaker: narrator
          text: So when Lightfoot first listened that morning, he simply assumed the hounds were chasing Reddy again. The noise had startled him, but it did not worry him. Then a dreadful thought came to him. As he listened, he grew more and more anxious. Within a few minutes, he knew there could be no mistake. Those hounds were following his trail.
        - id: ch01-b05
          speaker: narrator
          text: Now their baying sounded truly terrible. Lightfoot had to run for his life. The hounds would never let him rest. Worse still, while he was running from them, he could not keep such a careful watch for hunters carrying terrible guns. He could not hide in the thickets, either. At any moment, the hounds might drive him straight past one of those hunters.
        - id: ch01-b06
          speaker: narrator
          text: Lightfoot bounded away in the great leaps that only he could make. Before long, the voices of the hounds faded into the distance. He stopped to catch his breath. Trembling, he stood and listened. Then the baying began to grow louder and louder again. The hounds' wonderful noses were following his trail without any trouble at all.
        - id: ch01-b07
          speaker: narrator
          text: Panic seized Lightfoot, and away he bounded once more. As he crossed an old road, the roar of a terrible gun shook the Green Forest. Something ripped a strip of bark from a tree trunk just above his back. A bullet had barely missed him. His terror grew, and with it, his speed.
        - id: ch01-b08
          speaker: narrator
          text: Lightfoot ran on and on. Behind him, the voices of the hounds kept ringing through the Green Forest.
