audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
  chapters:
    - id: ch01
      title: 第三十二章　轻足看见陌生客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 轻足很不快乐。这种感觉很奇怪，他以前从来没有体会过。原来，他发现绿森林里来了另一只鹿，是一位和他同类的陌生客。欢笑溪的泥地上，还有海狸帕迪的池塘边，都能看到秀气的蹄印。别的地方也时不时会出现一些踪迹。可是，轻足怎么找也找不到这位新来的客人。他找遍了各处，却每次都晚了一步。陌生客已经来过，又走了。
        - id: ch01-b02
          speaker: narrator
          text: 轻足这么想找到陌生客，并不是因为生气。他心里只有深深的渴望。有生以来第一次，他觉得自己很孤单。于是他不停地寻找，心里也越来越不好受。他吃不下东西，睡不了多久，总是不安地四处走动。他到处看，仔细听，还迎着每一缕欢快的小风嗅了又嗅，可始终没有找到一点儿线索。
        - id: ch01-b03
          speaker: narrator
          text: 后来有一天夜里，发生了一件让轻足永远也忘不了的事。那时，他正在欢笑溪边喝水，忽然觉得好像有谁在盯着自己。他抬起俊美的头，敏锐的眼睛一下捕捉到轻微的动静。就在不远处，有一片灌木丛。
        - id: ch01-b04
          speaker: narrator
          text: 温柔的月亮太太把银白的光洒在灌木丛上。那里探出了一颗脑袋。在轻足看来，那是整个大世界里最美丽的脑袋。当然，真要说起来，它还没有轻足自己的那么美，因为上面没有鹿角做成的王冠。轻足站着望了好久。一双又大又温柔的美丽眼睛，也静静地望着他。然后，那颗脑袋忽然不见了。
        - id: ch01-b05
          speaker: narrator
          text: 轻足使劲一跃，跳过欢笑溪，朝那片灌木丛冲过去。他一头闯进去，却连一个身影也没看见。他急得发疯，在里面到处寻找，可灌木丛中空空的，什么也没有。
        - id: ch01-b06
          speaker: narrator
          text: 轻足停下来，竖起耳朵细听。四周没有传来半点声音，静得仿佛整座绿森林里只剩下他一个活物。那位美丽的陌生客，早已像影子一样悄无声息地溜走了。
        - id: ch01-b07
          speaker: narrator
          text: 那一夜剩下的时间，轻足一直在绿森林里寻找，却还是白费力气。他想见到那位美丽陌生客的愿望越来越强烈，想得心里都疼了。他觉得，要是找不到她，自己就再也不会快乐。
