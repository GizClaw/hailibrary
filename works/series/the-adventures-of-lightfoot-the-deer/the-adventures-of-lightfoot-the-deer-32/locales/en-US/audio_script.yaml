  chapters:
    - id: ch01
      title: LIGHTFOOT SEES THE STRANGER
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Lightfoot the Deer was unhappy in a way he had never been before. He had discovered that a stranger was in the Green Forest, and the stranger was another Deer. Dainty footprints appeared in the mud beside the Laughing Brook and at the edge of Paddy the Beaver's pond. Every now and then, Lightfoot found other signs as well. Yet no matter how hard he searched, he could not find the newcomer. He looked everywhere, but he was always too late. The stranger had already come and gone.
        - id: ch01-b02
          speaker: narrator
          text: Lightfoot did not want to find the stranger because he was angry. What he felt was a great longing. For the first time in his life, he was lonely. He hunted and hunted, growing more unhappy all the while. He lost his appetite and hardly slept. He wandered restlessly through the forest, looking and listening. He tested every Merry Little Breeze for a clue, but found nothing.
        - id: ch01-b03
          speaker: narrator
          text: Then came a night Lightfoot would never forget. He was drinking at the Laughing Brook when a strange feeling swept over him. Someone was watching. Lightfoot raised his beautiful head. His quick eye caught a small movement and turned toward a nearby thicket. Gentle Mistress Moon poured her silvery light over it. From the leaves came the most beautiful head in all the Great World. At least, that was how it looked to Lightfoot. In truth, it was not as beautiful as his own, because no antlers crowned it. For one long minute, he stood and stared. Two wonderful, great, soft eyes looked back at him. Then the beautiful head vanished.
        - id: ch01-b04
          speaker: narrator
          text: With one mighty bound, Lightfoot cleared the Laughing Brook. He raced to the thicket where the head had disappeared and plunged inside. No one was there. He searched wildly, but the thicket was empty. At last, he stopped and listened. He heard nothing. The Green Forest was so still that it seemed no other living creature could be there. The beautiful stranger had slipped away as silently as a shadow.
        - id: ch01-b05
          speaker: narrator
          text: Lightfoot searched the Green Forest for the rest of the night, but it did no good. His longing to find the beautiful stranger had grown so strong that it almost hurt. He felt that he could never be happy again until he found her.
