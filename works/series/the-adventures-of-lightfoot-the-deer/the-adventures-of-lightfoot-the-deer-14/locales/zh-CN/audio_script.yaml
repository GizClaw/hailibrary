audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
    paddy:
      display_name: 帕迪
      tts:
        delivery: 朴实爽朗，语气热心而直率
        timbre: 厚实温暖
        pace: 稳健
        pitch: 中低音
  chapters:
    - id: ch01
      title: 一对特别的伙伴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 轻足和帕迪这对伙伴，看起来有点儿奇怪，其实再合适不过。他们做最好的朋友已经很久了。轻足每次到池塘来，帕迪都很高兴。说真的，帕迪很喜欢这位英俊的朋友。你知道，帕迪自己可算不上好看。他到了岸上，样子笨手笨脚的，相貌也很普通，所以他尤其欣赏轻足。这就是帕迪提议两人结成伙伴的一个原因。
        - id: ch01-b02
          speaker: narrator
          text: 轻足也觉得这个主意好极了。那天夜里，他没有走远，就在帕迪的池塘附近边走边吃枝叶。天一亮，他便卧进池塘上游的一片小铁杉树丛。那一天又安静，又平和，也美极了。四周静成这样，实在很难相信，竟然有猎人带着可怕的枪，在绿森林里寻找美丽的轻足。可是猎人真的来了。轻足心里明白，迟早会有人找到帕迪的池塘。所以，那一整天，他虽然都在休息，偶尔也打个小盹儿，心里却一直悬着，怎么也安稳不下来。
    - id: ch02
      title: 越来越近的危险
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天早晨，轻足又回到原来的地方。这回，他再也没有打盹儿。身子虽在歇息，眼睛和耳朵却始终警醒着。一股不安缠住了他。他从骨子里感觉到，危险已经不远了。那危险，就是一个带着可怕猎枪的猎人。
        - id: ch02-b02
          speaker: narrator
          text: 一个钟头又一个钟头过去，轻足慢慢没那么不安了。他开始盼着，今天也能像昨天一样平安。就在这时，池塘另一头猛地传来一声脆响，几乎像有人开了一枪。可那不是手枪，更不是任何枪声。那是帕迪用宽尾巴猛拍水面的声音。轻足立刻站了起来。他太明白这个信号了。帕迪一定看见、听见，或者闻到了猎人。
    - id: ch03
      title: 帕迪发出警报
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 果然，帕迪刚才听见一根枯枝断了。那声音很轻很轻，却已经足够提醒他。他只露出一个脑袋，浮在水面上，紧盯着声音传来的方向。过了一会儿，一个猎人悄悄朝池塘摸来，终于出现在帕迪眼前。帕迪马上使出全身力气，用宽阔的尾巴狠狠拍向水面。他知道，轻足一听就会明白，这是在警告他有危险。接着，帕迪潜进水中，从水下游回自己的屋子躲起来。他该做的已经做完，剩下的事，再也帮不上忙了。
