  chapters:
    - id: ch01
      title: HOW PADDY WARNED LIGHTFOOT
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Lightfoot and Paddy made an odd pair of partners, but they made a good pair. They had been close friends for a long time, and Paddy was always glad when Lightfoot came to his pond. The truth was, Paddy was quite fond of the handsome Deer. Paddy himself was not handsome at all. Out on land, he looked clumsy and rather homely. That made him admire Lightfoot all the more, and it was one reason he had suggested that they work together.
        - id: ch01-b02
          speaker: narrator
          text: Lightfoot thought it was a splendid plan. That night, he browsed near Paddy's pond. When daylight came, he settled down among some young hemlock trees near the upper end of the pond. The day was quiet, peaceful, and beautiful. It hardly seemed possible that hunters with terrible guns were searching the Green Forest for beautiful Lightfoot. Yet they were. Lightfoot knew that sooner or later, one of them was sure to come to Paddy's pond. He rested there and took short naps throughout the lovely day, but he could not stop feeling anxious.
        - id: ch01-b03
          speaker: narrator
          text: The next morning, Lightfoot returned to the same place. This time he did not nap. He rested, but he stayed watchful and alert. An uneasy feeling had come over him. Deep down, he felt that danger was close, and that it would come in the shape of a hunter carrying a terrible gun.
        - id: ch01-b04
          speaker: narrator
          text: The hours went by, and little by little, Lightfoot's uneasiness faded. He began to hope this day would be as peaceful as the day before. Then a sharp crack rang out from the far end of Paddy's pond. It sounded almost like a pistol, but it was not a pistol. It was not a gunshot at all. Paddy had slapped the water with his broad tail. Lightfoot sprang to his feet at once. He knew exactly what that sound meant. Paddy had seen, heard, or smelled a hunter.
        - id: ch01-b05
          speaker: narrator
          text: And that was just what had happened. Paddy had heard a dry stick snap. It was only the tiniest sound, but it was enough to warn him. He kept everything but his head below the water and watched the place the sound had come from. Before long, a hunter appeared, creeping quietly toward the pond. Paddy brought his broad tail down against the water with all his strength. He knew Lightfoot would understand the warning. Then Paddy dived and swam underwater to the safety of his house. He had done his part. There was nothing else he could do.
