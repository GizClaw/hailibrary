audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十三章　轻足找到一位朋友
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 轻足留在大河中央的小沙洲上歇息，努力让自己的呼吸平稳下来。那双又大又温柔的美丽眼睛，一会儿望向这岸，一会儿又望向对岸。他离开的那一边，有两个黑白相间的小点来回移动。河面上，还不断传来狗叫声。
        - id: ch01-b02
          speaker: narrator
          text: 那两个小点，就是把轻足逼进大河的猎犬。它们不再拖长声音追嗥，只是汪汪地叫着。没过多久，一个棕色的身影走到它们旁边。原来是猎人听见狗叫，赶到了河边。他离得很远，还伤不到轻足。可是，轻足一看见他，恐惧又涌了上来。猎人沿岸走了一段，钻进灌木丛，不见了。
        - id: ch01-b03
          speaker: narrator
          text: 不一会儿，一条小船从灌木丛那边驶了出来，船里正是那个猎人。小船直奔沙洲而来。轻足马上明白，他不能再歇了。要么重新下水，要么就会让船上的猎人开枪打死。他只好再次游向河岸。刚才那一阵休息，的确让他恢复了一些力气。可他还是累坏了，每划一下都很艰难。
        - id: ch01-b04
          speaker: narrator
          text: 轻足离河岸越来越近，可他游得太慢，实在太慢了。岸上会不会还有新的危险？他不知道。他从没来过大河这一边，对这里什么也不了解。不过，前面只是吉凶难料，身后的危险却明明白白。他听得见船桨划水的声音。猎人拼命划着船，想在轻足上岸以前截住他。
        - id: ch01-b05
          speaker: narrator
          text: 轻足还在挣扎着往前游。终于，他的脚碰到了河底。他摇摇晃晃地穿过岸边的灌木，爬上了岸。可就在这一刻，他几乎吓得心都停了。眼前竟然站着一个人！轻足上岸的地方，原来是这个人家的后院。
        - id: ch01-b06
          speaker: narrator
          text: 轻足和那个人都愣住了，谁也说不清他们两个哪一个更吃惊。轻足这下彻底绝望，放弃了逃跑。他根本跑不动，连走路都快没有力气。先是猎犬在大河那边一路追赶，接着又是这段漫长的泅渡。他已经耗尽了全部力气。
        - id: ch01-b07
          speaker: narrator
          text: 轻足心里最后一点希望也灭了。他站在那里一动不动，浑身不停地发抖。一半是因为害怕，一半是因为累。可就在这时，一件出人意料的事发生了。
        - id: ch01-b08
          speaker: narrator
          text: 那个人轻声跟轻足说着话，又慢慢走近。他没有吓唬轻足，动作很缓，态度也很友善。他先绕到轻足身后，再正对着轻足走过去。轻足往前挪了几步，那个人便跟上来，嘴里始终轻声说着。
        - id: ch01-b09
          speaker: narrator
          text: 那个人就这样一点一点地引着轻足，把他赶向一座敞开的棚子。棚里堆着一垛干草。轻足说不清自己是怎么知道的，可他心里明白，他终于找到了一位朋友。
        - id: ch01-b10
          speaker: narrator
          text: 轻足走进敞开的棚子，长长地舒了一口气，然后在柔软的干草上躺了下来。
