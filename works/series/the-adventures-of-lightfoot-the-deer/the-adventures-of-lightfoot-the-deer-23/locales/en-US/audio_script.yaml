  chapters:
    - id: ch01
      title: LIGHTFOOT FINDS A FRIEND
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Lightfoot rested on the little sandbar in the Big River and tried to catch his breath. His great, soft, beautiful eyes turned from one bank to the other. On the bank he had left, two black-and-white specks moved about. Across the water came the barking of dogs. They were the hounds that had chased him into the river. Now they were barking instead of baying.
        - id: ch01-b02
          speaker: narrator
          text: Before long, a brown shape appeared beside those two specks. It was a hunter, drawn there by the dogs' barking. He was too far away to hurt Lightfoot, but just seeing him filled Lightfoot with terror again. Lightfoot watched as the hunter walked along the bank and vanished into the bushes.
        - id: ch01-b03
          speaker: narrator
          text: Then a boat came out from those bushes, and the hunter was in it. He headed straight for Lightfoot. At once, Lightfoot knew his short rest was over. He had to swim again, or the hunter would shoot him from the boat. So Lightfoot struck out once more for shore. The rest had given him fresh strength, but he was still terribly tired. Every stroke was hard work.
        - id: ch01-b04
          speaker: narrator
          text: Slowly, so very slowly, Lightfoot came closer to the bank. He had no idea what new dangers might be waiting there. He had never been on that side of the Big River, and he knew nothing about the country beyond it. Still, whatever lay ahead was uncertain. The danger behind him was certain. He could hear the oars as the hunter pulled hard, trying to reach him before he made it to shore.
        - id: ch01-b05
          speaker: narrator
          text: Lightfoot struggled on. At last, his feet touched the bottom. He staggered up through the bushes along the bank. Then, for one instant, it seemed that his heart stopped. A man stood right in front of him. Lightfoot had come into the backyard of the man's home, and neither of them could have been much more surprised than the other.
        - id: ch01-b06
          speaker: narrator
          text: Right there, Lightfoot gave up in despair. He could not run. He could barely walk. The long chase by the hounds on the far side of the Big River, followed by the long swim across it, had used up all his strength.
        - id: ch01-b07
          speaker: narrator
          text: Lightfoot had not one spark of hope left. He simply stood still and trembled, partly from fear and partly from exhaustion.
        - id: ch01-b08
          speaker: narrator
          text: Then something surprising happened. The man spoke softly. He came forward slowly and in a friendly way, without threatening Lightfoot. He walked around behind the tired Deer, then moved straight toward him. Lightfoot took a few steps, and the man followed, still speaking softly. Little by little, he guided Lightfoot toward an open shed where a pile of hay was waiting.
        - id: ch01-b09
          speaker: narrator
          text: Lightfoot did not quite understand how he knew, but he knew he had found a friend. He went into the open shed. Then, with a long sigh, he lay down in the soft hay.
