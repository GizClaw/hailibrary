audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第三十三章　另一场捉迷藏
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 轻足又在绿森林里玩起了捉迷藏。不过，这一场和不久前那一场完全不同。上一次，他拿性命在躲猎人，一直藏起来的是他。这一次轮到轻足找，另一个人躲了起来。先前那种要命的恐惧，也换成了一股强烈的渴望。他只见过那位美丽的陌生客一眼，却天天都能发现她的脚印。轻足真想找到她，和她成为朋友。
        - id: ch01-b02
          speaker: narrator
          text: 轻足有时候会沉不住气。没错，他真的会发脾气。这样做很傻，可他就是控制不住。他气得直跺蹄子，又用宽展的大鹿角抽打灌木，好像面前站着一个敌人。其实，他闹脾气的时候，那双又大又温柔的眼睛不止一次在暗处看着他。轻足并不知道。要是他看见那双眼睛里满是赞赏，寻找那位美丽陌生客的心一定会更加急切。
        - id: ch01-b03
          speaker: narrator
          text: 另一些时候，轻足又会安静得像一道影子，在绿森林里一点声音也不发。他探看每片密林，也不放过倒树和枯枝堆的后面，想趁那位陌生客不留神时找到她。他可以耐心等上很久。可一旦来到一片灌木前，从痕迹看出她几分钟前才在那里，这份耐心马上就没了。轻足会飞快追上去，恨不得立刻赶上那位羞怯的陌生客。
        - id: ch01-b04
          speaker: narrator
          text: 可他每次都是白费力气。轻足原来还以为自己够聪明，现在才发现，这位陌生客比他更聪明。
        - id: ch01-b05
          speaker: narrator
          text: 没过多久，绿森林里的小居民全明白了。他们知道轻足又在玩捉迷藏，就像先前知道猎人追赶他一样清楚。只是这一次，大家谁也不帮轻足，因为他们正看得有趣呢。淘气的冠蓝鸦萨米更是几次给陌生客报信，只要轻足快走近了，他就出声提醒她。
        - id: ch01-b06
          speaker: narrator
          text: 萨米一开口，轻足当然知道是谁在捣乱，于是每回都要发脾气。这时候，他早把萨米从前帮过自己的事忘得干干净净了。那时被猎人追赶、四处躲藏的，可正是轻足自己。
        - id: ch01-b07
          speaker: narrator
          text: 有一次，轻足差点迎面撞上大熊巴斯特。他气自己太粗心，不但没赶紧跳开，反而真要摆开架势和巴斯特打一场。巴斯特却好脾气地咧嘴一笑。轻足这才改变主意，纵身离开，又接着去找那位陌生客。
        - id: ch01-b08
          speaker: narrator
          text: 有时候，轻足也会赌气。他闷闷不乐，那几句气话要对自己说上一遍又一遍。
        - id: ch01-b09
          speaker: lightfoot
          text: 我根本不在乎那个陌生客。我再也不花时间找她了。
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 可是还不到五分钟，轻足又开始四下张望，竖起耳朵细听，到处寻找蛛丝马迹，想知道她是不是还留在绿森林里。
