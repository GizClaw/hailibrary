audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: A DIFFERENT GAME OF HIDE AND SEEK
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once again, Lightfoot the Deer was playing hide and seek in the Green Forest. This game, though, was nothing like the one he had played a short time earlier. Back then, he had been hiding to save his life. Now Lightfoot was the one who was "it," while someone else hid from him.
        - id: ch01-b02
          speaker: narrator
          text: Fear had filled him during that other game. This time, he was full of longing. He wanted to find the beautiful stranger he had glimpsed only once, and he wanted to make friends with her. Each day he found her tracks, but he could never find her.
        - id: ch01-b03
          speaker: narrator
          text: Sometimes Lightfoot lost his temper. Yes, Sir, he really did. It was foolish, but he felt as if he simply couldn't help himself. He stamped his feet in anger. He swung his great, spreading antlers through the bushes as though the bushes were an enemy he had to fight.
        - id: ch01-b04
          speaker: narrator
          text: More than once, a pair of great, soft, gentle eyes watched him do it. Lightfoot never knew they were there. If he had seen those eyes, and the admiration in them, he would have wanted more than ever to find the beautiful stranger.
        - id: ch01-b05
          speaker: narrator
          text: At other times, Lightfoot slipped through the Green Forest without a sound, as quiet as a shadow. He looked into thickets. He searched behind heaps of fallen trees and piles of brush, hoping to catch the one he was seeking by surprise. Then he could be very, very patient.
        - id: ch01-b06
          speaker: narrator
          text: He might reach a thicket and read the signs there. The stranger had passed that very spot only moments ago. At once, his patience disappeared. He rushed ahead, eager to catch her. But it never did any good. Lightfoot had always believed he was clever. Now this stranger was showing him that she was cleverer still.
        - id: ch01-b07
          speaker: narrator
          text: Before long, all the little people of the Green Forest knew what was happening. They understood this game of hide and seek just as well as they had understood the game with the hunters. That time, they had tried to help Lightfoot. This time, they would not help him at all. The truth was, they were enjoying the game.
        - id: ch01-b08
          speaker: narrator
          text: Mischievous Sammy Jay even warned the stranger several times when Lightfoot came near. Lightfoot always knew when Sammy did it, and every warning made him lose his temper. For the moment, he completely forgot how much Sammy had helped him when the hunters were after him.
        - id: ch01-b09
          speaker: narrator
          text: Once, Lightfoot nearly ran straight into Buster Bear. He was so annoyed with himself for being careless that he did not leap away. Instead, he actually threatened to fight Buster. But Buster only gave him a good-natured grin. Lightfoot quickly thought better of fighting and bounded off to keep searching.
        - id: ch01-b10
          speaker: narrator
          text: Then there were times when Lightfoot sulked. Again and again, he told himself the same thing.
        - id: ch01-b11
          speaker: lightfoot
          text: I don't care about that stranger at all. I won't waste one more minute looking for her.
        - id: ch01-b12
          speaker: narrator
          text: Yet before five minutes had passed, Lightfoot would be watching and listening again, searching for some sign that she was still in the Green Forest.
