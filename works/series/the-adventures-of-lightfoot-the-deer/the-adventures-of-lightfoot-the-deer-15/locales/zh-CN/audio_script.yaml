audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
    paddy:
      display_name: 帕迪
      tts:
        delivery: 朴实爽朗，语气热心而直率
        timbre: 厚实温暖
        pace: 稳健
        pitch: 中低音
    hunter:
      display_name: 猎人
      tts:
        delivery: 精明谨慎，独自盘算时低沉直接
        timbre: 粗粝结实
        pace: 稍慢而克制
        pitch: 低音
  chapters:
    - id: ch01
      title: 警报之后
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 帕迪的宽尾巴猛地拍在水面上，响声就像手枪开火。轻足马上明白，这是危险的警报。他一跃而起，眼睛四下看，耳朵仔细听，鼻子也不停分辨气味，急着弄清危险从哪里来。过了一两分钟，他轻手轻脚地走上一道小土冈。那里离池塘有些距离，却能望见整个水面。轻足躲进一片茂密的小铁杉树丛。很快，他就看见一个猎人带着可怕的枪，走到了池塘岸边。
        - id: ch01-b02
          speaker: narrator
          text: 帕迪刚才拍水的响声，猎人当然也听见了。要是连那一声都没听见，他的耳朵可真该有毛病了。
        - id: ch01-b03
          speaker: hunter
          text: 真该死，这只河狸！池塘附近要是有鹿，现在多半已经逃远了。我先到处找找，看他留下什么踪迹没有。
          emotion: angry
    - id: ch02
      title: 泥地上的蹄印
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 猎人走到池边，绕着池塘慢慢转起来。他一边走，一边低头查看地面。没多久，他就在泥里发现了轻足的蹄印。轻足曾从这里走到水边喝水，脚印就是那时候留下的。
        - id: ch02-b02
          speaker: hunter
          text: 我就知道。这些蹄印是昨晚留下的。那只鹿刚才很可能还卧在附近。要不是这只讨厌的河狸坏了事，我本来可能已经开枪了。我先看看四周，再留在这里等一会儿。只要他没吓得太厉害，也许还会回来。
        - id: ch02-b03
          speaker: narrator
          text: 猎人绕完一整圈，把每个像是能藏身的地方都查看了一遍。他找到了轻足卧过的地方，也猜到帕迪发出警报时，轻足多半还没有离开。
        - id: ch02-b04
          speaker: hunter
          text: 追他没用。地面这么干，我根本找不到他的踪迹。说不定他还没受多大惊吓。我还是找个合适的地方，坐下来等吧。
    - id: ch03
      title: 三位守望者
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 猎人在几棵小树后面找到一根老树干，便坐了下来。从那里望出去，帕迪的池塘四周一览无余。猎人一动也不动。他很精明，知道自己只要不动，即使有眼睛锐利的动物经过，也很难留意到他。
        - id: ch03-b02
          speaker: narrator
          text: 可有一件事，猎人并不知道。轻足一直都在看着他，此刻就站在一个能把他看清的地方。
        - id: ch03-b03
          speaker: narrator
          text: 还有一件事，他也不知道。帕迪已经离开屋子，从水下游到了池塘对岸。他躲在那里，同样看见猎人在老树干上坐了下来。
        - id: ch03-b04
          speaker: narrator
          text: 就这样，猎人守望着轻足，轻足和帕迪也守望着猎人。
