  chapters:
    - id: ch01
      title: THE THREE WATCHERS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Paddy the Beaver brought his broad tail down hard on the water. The sound was as sharp as a pistol shot, and Lightfoot knew at once that it meant danger. He sprang to his feet. His eyes searched, his ears listened, and his nose tested the air for whatever had made Paddy give the warning.
        - id: ch01-b02
          speaker: narrator
          text: After a moment, Lightfoot slipped quietly toward the top of a little ridge some distance behind Paddy's pond. From there he could see the whole pond. He hid among a thick stand of young hemlock trees, and before long, he saw a hunter carrying a terrible gun come down to the shore.
        - id: ch01-b03
          speaker: narrator
          text: The hunter had heard the crack of Paddy's tail too. He could hardly have missed it.
        - id: ch01-b04
          speaker: hunter
          text: Confound that Beaver! If a Deer was anywhere near this pond, he's probably leaving now. Still, I'll look around for signs.
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: The hunter walked to the edge of the pond. Then he began circling it, studying the ground as he went. Soon he found Lightfoot's footprints in the mud where Lightfoot had come down for a drink.
        - id: ch01-b06
          speaker: hunter
          text: Just as I thought. These tracks were made last night. That Deer was probably resting somewhere close by. I might have gotten a shot at him if that pesky Beaver hadn't warned him. I'll look over the ground, then wait here for a while. If the Deer isn't too frightened, he may come back.
        - id: ch01-b07
          speaker: narrator
          text: The hunter made a full circle around the pond and peered into every place where a deer might hide. He found the spot where Lightfoot had been lying down. That told him Lightfoot had probably still been there when Paddy sounded the alarm.
        - id: ch01-b08
          speaker: hunter
          text: There's no point trying to follow him. The ground is too dry for me to track him. Maybe I didn't scare him too badly. I'll choose a good spot and wait.
        - id: ch01-b09
          speaker: narrator
          text: Behind some small trees, the hunter found an old log and sat down. From that place he could watch every part of Paddy's pond. He stayed perfectly still. He was a clever hunter, and he knew that sharp eyes passing nearby would probably miss him as long as he did not move.
        - id: ch01-b10
          speaker: narrator
          text: But the hunter did not know that Lightfoot had watched him the entire time. Even now, Lightfoot stood hidden where he could see the hunter clearly.
        - id: ch01-b11
          speaker: narrator
          text: There was something else the hunter did not know. Paddy had left his house and swum underwater to a hiding place on the opposite shore. From there, Paddy had also seen the hunter settle onto the log.
        - id: ch01-b12
          speaker: narrator
          text: And so the hunter watched for Lightfoot, while Lightfoot and Paddy watched the hunter.
