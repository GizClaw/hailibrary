audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第三十四章　惊人的新蹄印
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 轻足和那位美丽的陌生客，这场捉迷藏已经玩了好几天，也玩了好几个夜晚。当初，就是她那小巧秀气的蹄印，让轻足开始寻找她。可是这一天，轻足发现了一样东西，着实吃了一惊。
        - id: ch01-b02
          speaker: narrator
          text: 他轻手轻脚地来到欢笑溪边，想趁那位美丽的陌生客喝水时找到她。可溪边没有她的影子。轻足想知道她来过没有，就低头去看岸边的泥地，找找有没有她新留下的蹄印。他很快就发现了新鲜的足迹，可那并不是他熟悉的秀气蹄印。不，先生，绝对不是。这些蹄印几乎和轻足自己的大蹄印一样大，而且才留下不久。
        - id: ch01-b03
          speaker: narrator
          text: 轻足看到这些蹄印，心里猛地一惊。他马上明白了。绿森林里又来了一位陌生客，对方也像他一样长着鹿角。嫉妒顿时占满了轻足的心，怒火也跟着烧了起来。
        - id: ch01-b04
          speaker: lightfoot
          text: 他来这里，一定也是为了找那位美丽的陌生客。他想把她从我身边抢走！这是我的绿森林，他根本不该来。他一定是从大山上下来的，也该回到大山上去，因为他不可能来自别的地方。那位美丽的陌生客肯定也是从那里来的。我希望她留下，可这个家伙必须走。我要逼他跟我打一架。没错，就这么办！我不怕他，我要让他怕我！
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: 轻足狠狠地跺起蹄子，还用那对大鹿角抽打灌木，简直把灌木当成了自己要找的敌人。要是那时你能看进他的那双大眼睛，就再也找不到平日的温柔和美丽了。他的眼睛气得几乎发红，浑身因为愤怒不停地颤抖，连后颈上的毛都一根根竖了起来。这时候的轻足，哪里还有半点温和的模样。
        - id: ch01-b06
          speaker: narrator
          text: 那些灌木无辜又无力还手。轻足拿它们出过几分钟的气，这才高高昂起头，发出一声愤怒的长鸣。接着，他一跃跳过欢笑溪，又在绿森林里搜寻起来。
        - id: ch01-b07
          speaker: narrator
          text: 不过，这回他找的不是那位有着秀气蹄子的美丽陌生客。现在，轻足已经顾不上想她了。他必须先找到这个新来的家伙，而且一分钟也不肯耽搁。
