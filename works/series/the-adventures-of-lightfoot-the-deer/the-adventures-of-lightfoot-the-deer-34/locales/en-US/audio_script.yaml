audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: A STARTLING NEW FOOTPRINT
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: For several days and nights, Lightfoot the Deer and the beautiful stranger had been playing hide and seek. Her dainty footprints were what first sent him looking for her. Then one day, Lightfoot found something that gave him a shock.
        - id: ch01-b02
          speaker: narrator
          text: He crept very softly down to the Laughing Brook, hoping to catch the beautiful stranger there as she drank. But she was nowhere in sight. He wondered whether she had visited the brook before he arrived. Lightfoot searched the soft mud at the water's edge for any fresh prints those dainty feet might have left behind.
        - id: ch01-b03
          speaker: narrator
          text: He found fresh footprints almost at once, but they were not the ones he wanted. No, sir, these were not the dainty prints he knew so well. They were nearly as large as his own big tracks, and whoever had made them had passed by only a short time ago.
        - id: ch01-b04
          speaker: narrator
          text: Those tracks gave Lightfoot a dreadful shock. He knew at once what they meant. Another stranger had entered the Green Forest, and this one had antlers just as Lightfoot did. Jealousy swept over him and filled his heart with rage.
        - id: ch01-b05
          speaker: lightfoot
          text: He came here looking for the beautiful stranger I've been trying to find. He means to steal her away from me! He has no right to be in my Green Forest. He must belong up on the Great Mountain. There's nowhere else he could have come from. The beautiful stranger must have come from there too. I want her to stay, but this fellow has to go. I'll force him to fight. Yes, that's what I'll do! I'm not afraid of him. I'll make him afraid of me.
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: Lightfoot stamped his feet. He thrashed the bushes with his great antlers as though they were the enemy he wanted to fight. There was nothing soft or beautiful in his great eyes now. They were almost red with anger. Rage made him quiver all over, and the hair along the back of his neck stood up. Lightfoot looked anything but gentle.
        - id: ch01-b07
          speaker: narrator
          text: For several minutes, he took out his spite on the harmless, helpless bushes. Then he lifted his head high and gave an angry whistle. He leaped across the Laughing Brook and began searching the Green Forest again.
        - id: ch01-b08
          speaker: narrator
          text: This time, he was not searching for the beautiful stranger with the dainty feet. He had no time to think about her now. First he had to find the newcomer, and Lightfoot meant to waste no time doing it.
