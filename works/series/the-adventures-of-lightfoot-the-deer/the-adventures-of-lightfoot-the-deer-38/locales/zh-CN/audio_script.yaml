audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
  chapters:
    - id: ch01
      title: 第三十八章　暗中的观战者
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 轻足和那个来自大山的大块头陌生客，还在海狸帕迪池塘边的小空地上恶战。他们不知道有谁在看，也根本不在乎。两只鹿满心怒火，都想把对方赶出绿森林，也都想赢得秀足小姐的爱。
        - id: ch01-b02
          speaker: narrator
          text: 可他们没有想到，秀足小姐本人正躲在暗处观战。两对大鹿角第一次撞在一起时，她听见了那声巨响，马上明白出了什么事。她怯生生地走近，藏进一片安全的灌木丛，从那里看着这场可怕的争斗。
        - id: ch01-b03
          speaker: narrator
          text: 秀足小姐当然知道，两只鹿是在为她而战。她也早就看出，他们都在寻找自己。可是有一件事，她一时拿不定主意。她到底希望谁赢呢？
        - id: ch01-b04
          speaker: narrator
          text: 轻足和大块头陌生客都很英俊，真的，他俩都英俊极了。轻足只大那么一点点，在秀足小姐眼里，好像也俊那么一点点。她差点儿盼着轻足取胜。可她又看到，陌生客虽然身形略小，却打得很勇敢，一点儿也不落下风。于是，她又差点儿希望陌生客能赢。
        - id: ch01-b05
          speaker: narrator
          text: 大战持续了很久。美丽的秀足小姐只觉得，它简直永远也不会结束。过了一阵，轻足身形更大、力气更强的优势慢慢显了出来。陌生客一步一步退向空地边缘，还会被撞得跪倒在地，轻足却依旧站着。轻足一看，仿佛又有了新的力气。
        - id: ch01-b06
          speaker: narrator
          text: 最后，轻足瞅准机会，一下把陌生客掀翻了。陌生客挣扎着想站起来，轻足尖利的鹿角已经在他灰色的皮毛上划开一道道长口子。陌生客知道自己败了。他刚站稳，便立刻转身，一头逃进绿森林。轻足得意地喷了一声鼻息，追了上去。
        - id: ch01-b07
          speaker: narrator
          text: 这一败，让陌生客害怕起来。他再也不想打了，心里只剩下一个念头，那就是逃走。恐惧叫他跑得飞快，他径直奔向自己来时的那座大山。
        - id: ch01-b08
          speaker: narrator
          text: 轻足只追了一小段路。他知道，陌生客这回真的走了，再也不会回来。于是，他转身回到刚才争斗的空地，昂起美丽的头。那对大鹿角就像一顶王冠。他吹响口哨，向整个绿森林发出挑战。
        - id: ch01-b09
          speaker: narrator
          text: 秀足小姐望着轻足，终于明白了自己的心意。她原来一直希望轻足赢。她觉得，整个大世界里，再也不会有谁像他这样英俊、强壮而又勇敢。
