  chapters:
    - id: ch01
      title: AN UNSEEN WATCHER
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Lightfoot the Deer and the big stranger from the Great Mountain fought in the little opening near Paddy the Beaver's pond. Neither one knew or cared who might be watching. Rage filled them both. Each was determined to drive the other out of the Green Forest, and each was fighting for the right to win Miss Daintyfoot's love.
        - id: ch01-b02
          speaker: narrator
          text: Neither of them knew that Miss Daintyfoot herself was watching. But she was. She had heard their great antlers clash when they first came together, and she knew exactly what that sound meant. Timidly, she crept closer. She slipped into a thicket where she could stay safely hidden and watch the terrible fight.
        - id: ch01-b03
          speaker: narrator
          text: Of course she knew they were fighting for her. She had known all along that both of them were searching for her. There was just one thing she could not decide. Which one did she want to win?
        - id: ch01-b04
          speaker: narrator
          text: Lightfoot and the big stranger were both handsome. Yes, indeed, they were very handsome. Lightfoot was a little bigger, and to Miss Daintyfoot, he seemed a little more handsome too. She almost wanted Lightfoot to win. Then she saw how bravely the stranger fought. Though he was a little smaller, he held his own so well that she almost hoped he would win instead.
        - id: ch01-b05
          speaker: narrator
          text: The great fight went on and on. To pretty Miss Daintyfoot, it seemed as if it would never end. After a while, though, Lightfoot's greater size and strength began to make a difference. Step by step, the big stranger was driven toward the edge of the opening. Now the stranger was falling to his knees while Lightfoot stayed on his feet. When Lightfoot saw that, he seemed to find new strength.
        - id: ch01-b06
          speaker: narrator
          text: At last, Lightfoot caught the stranger just right and threw him over. The stranger struggled to rise, while Lightfoot's sharp antlers tore long rips in his gray coat. He was beaten, and he knew it. The moment he got back on his feet, he turned and plunged toward the shelter of the Green Forest. Lightfoot gave a triumphant snort and raced after him.
        - id: ch01-b07
          speaker: narrator
          text: Now that the stranger had lost, fear took hold of him. He no longer wanted to fight. He could think of nothing but escape, and fear made him swift. He headed straight back toward the Great Mountain, the place he had come from.
        - id: ch01-b08
          speaker: narrator
          text: Lightfoot chased him only a short way. He knew the stranger was leaving for good and would not return. So Lightfoot went back to the opening where they had fought. There he raised his beautiful head, crowned with its great antlers, and whistled a challenge to the whole Green Forest.
        - id: ch01-b09
          speaker: narrator
          text: As Miss Daintyfoot looked at him, she finally knew the answer. She had wanted Lightfoot to win. Surely, she thought, no one else in all the Great World could be so handsome, so strong, and so brave.
