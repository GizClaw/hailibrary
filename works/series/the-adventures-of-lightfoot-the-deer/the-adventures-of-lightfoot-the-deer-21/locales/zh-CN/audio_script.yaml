audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十一章　轻足怎样甩掉了猎犬
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 可怜的轻足！在他看来，这世上根本没有公道，也谈不上公平。要是一次只需跟一个猎人斗智，倒还不算太糟。偏偏许多猎人都拿着可怕的猎枪，到处寻找他。他刚躲开这个，随时又会碰上另一个。这已经够不公平了，如今竟然还有猎犬循着踪迹追他。
        - id: ch01-b02
          speaker: narrator
          text: 难怪轻足觉得，人全都是没有心肠的家伙。他哪里知道，这些猎犬并不是猎人放出来追他的。它们只是自己离开家，跑来找乐子。他更不知道，用狗追猎他，其实是违法的。
        - id: ch01-b03
          speaker: narrator
          text: 寻找轻足的那些猎人，谁也没有放出这群猎犬。可猎犬既然追上了他的踪迹，每个猎人都巴不得利用这个机会。轻足已经挨过一枪。他很清楚，只要被赶到猎人藏身的地方，枪声还会再次响起。
        - id: ch01-b04
          speaker: narrator
          text: 地面很潮湿，气味在湿地上最容易留下。猎犬有了不起的鼻子，跟踪轻足也就格外容易。轻足把能想到的办法都试了，只想让它们跟丢自己的气味。
        - id: ch01-b05
          speaker: lightfoot
          text: 要是能让它们跟丢一会儿，让我稍微歇口气，那也好啊。
        - id: ch01-b06
          speaker: narrator
          text: 轻足只停了一瞬，一边听着猎犬的长吠，一边喘着粗气。可他还是没能甩掉它们。猎犬紧追不舍，片刻也不让他休息。
        - id: ch01-b07
          speaker: narrator
          text: 轻足越来越累。刚开始，他还能轻轻跃过倒下的树木和灌木，现在却再也跳不动了。他喘得肺里一阵阵发疼。他明白，就算躲过了猎人的枪，只要甩不掉猎犬，仍然会落得更可怕的下场。
        - id: ch01-b08
          speaker: narrator
          text: 他总有跑不动、不得不停下来的时候。到那时，猎犬就会追上他，把他撕成碎片。
        - id: ch01-b09
          speaker: narrator
          text: 就在这时，轻足想起了大河。那是他唯一的生路，他心里十分清楚。他立刻转向大河，笔直穿过绿森林，又冲过绿草地，一直跑到了河岸边。
        - id: ch01-b10
          speaker: narrator
          text: 轻足停下短短一瞬，回头看了一眼。猎犬几乎已经追到他的脚后跟了。他不再迟疑，纵身跳进大河，游了起来。
        - id: ch01-b11
          speaker: narrator
          text: 猎犬停在岸边，失望地放声长吠。它们不敢追着轻足游进大河。
