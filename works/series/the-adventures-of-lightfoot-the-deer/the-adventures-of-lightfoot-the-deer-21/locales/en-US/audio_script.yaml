audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: alert and earnest
        timbre: warm and youthful
        pace: moderately quick
        pitch: medium
  chapters:
    - id: ch01
      title: HOW LIGHTFOOT GOT RID OF THE HOUNDS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Poor Lightfoot! To him, there seemed to be no justice or fair play anywhere. Facing one hunter at a time would have been bad enough. Instead, many hunters with terrible guns were searching for him. Whenever he dodged one, he might at any time run straight into another. That felt terribly unfair and unjust. And now hounds were following his trail too.
        - id: ch01-b02
          speaker: narrator
          text: Can you blame Lightfoot for thinking that men had no hearts at all? He did not know the hounds had left home to hunt for their own pleasure. No hunter had sent them after him, and hunting a Deer with dogs was against the law. Still, every hunter searching for Lightfoot was ready and eager to make use of those hounds. One hunter had already fired at him. Lightfoot knew another would do the same if the hounds drove him past a hiding place.
        - id: ch01-b03
          speaker: narrator
          text: The ground was damp, and a scent is strongest on damp ground. With their wonderful noses, the hounds could follow Lightfoot easily. He tried every trick he knew, hoping to throw them off his trail.
        - id: ch01-b04
          speaker: lightfoot
          text: If I could only make them lose my scent long enough for me to rest a little, it would help.
        - id: ch01-b05
          speaker: narrator
          text: Lightfoot panted those words after stopping for just an instant to listen to the hounds baying behind him. But he could not shake them. They gave him no chance to rest, and he was growing more and more tired. At first, he had bounded lightly over fallen logs and brush. He could not do that now. He gasped for breath, and his lungs ached.
        - id: ch01-b06
          speaker: narrator
          text: Then Lightfoot understood that escaping the hunters would not be enough. Unless he got rid of the hounds, an even more terrible death was waiting for him. Sooner or later, he would have to stop. The hounds would catch him then and tear him to pieces.
        - id: ch01-b07
          speaker: narrator
          text: That was when he remembered the Big River. He turned toward it at once. It was his only chance, and he knew it. Through the Green Forest he ran, then out across the Green Meadows, all the way to the riverbank.
        - id: ch01-b08
          speaker: narrator
          text: Lightfoot paused for one second and looked back. The hounds were almost at his heels. He did not wait again. He plunged into the Big River and began to swim.
        - id: ch01-b09
          speaker: narrator
          text: The hounds stopped on the bank and bayed in disappointment. They did not dare follow Lightfoot into the Big River.
