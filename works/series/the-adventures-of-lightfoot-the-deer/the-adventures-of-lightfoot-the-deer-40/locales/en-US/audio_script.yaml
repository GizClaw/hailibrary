  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
    mrs_lightfoot:
      display_name: Mrs. Lightfoot
      tts:
        delivery: gentle, perceptive, and warmly playful
        timbre: soft and clear
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: HAPPY DAYS IN THE GREEN FOREST
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: These were happy days in the Green Forest, especially for Lightfoot the Deer. In fact, they were the happiest days he had ever known. He had won the beautiful, slender young Miss Daintyfoot. Now she was Mrs. Lightfoot. To him, no one anywhere could be as beautiful as she was. And to Mrs. Lightfoot, no one could be as handsome or brave as he was.
        - id: ch01-b02
          speaker: narrator
          text: Mrs. Lightfoot went wherever Lightfoot went. He took her to every hiding place he liked best, then led her to all his favorite spots for food. She never told him that she already knew every one of them. She knew the Green Forest every bit as well as he did.
        - id: ch01-b03
          speaker: narrator
          text: After all, she had stayed out of sight day after day while he searched for her. If Lightfoot had thought about that, he would have understood that there was very little here she had not seen. But he never stopped to think. He proudly showed her one place after another, while Mrs. Lightfoot wisely acted delighted, as though each place were new to her.
        - id: ch01-b04
          speaker: narrator
          text: Before long, all the little people of the Green Forest came hurrying over. They wanted to pay their respects to Mrs. Lightfoot and tell Lightfoot how glad they were for him. They truly were glad. They all loved Lightfoot, and they knew he would be happier than ever now. Loneliness would no longer make him leave the Green Forest. Without Lightfoot the Deer, the forest simply would not be the same.
        - id: ch01-b05
          speaker: narrator
          text: Lightfoot told Mrs. Lightfoot about the terrible days of hunting season. He was so glad she had not been in the Green Forest then. Hunters carrying dreadful guns had never given him a moment of rest. At last, to escape the hounds, he had been forced to swim across the Big River.
        - id: ch01-b06
          speaker: mrs_lightfoot
          text: I know. I know all about it. There were hunters on the Great Mountain too. That's why I came down to the Green Forest. They hunted me so hard up there that I was afraid to stay. I came here because I thought there might not be as many hunters. I never imagined I could be grateful to hunters for anything, but I really am.
        - id: ch01-b07
          speaker: narrator
          text: Lightfoot looked puzzled.
        - id: ch01-b08
          speaker: lightfoot
          text: Grateful for what? I can't imagine anyone feeling grateful to hunters.
        - id: ch01-b09
          speaker: mrs_lightfoot
          text: Oh, you silly deer! Don't you see? If they hadn't driven me down from the Great Mountain, I never would have found you!
        - id: ch01-b10
          speaker: lightfoot
          text: You mean I never would have found you. I suppose I owe those hunters even more than you do. Because of them, I found the greatest happiness I've ever known. But I never would have thought of that on my own. Isn't it strange? Sometimes the things that seem as bad as they could possibly be turn out to be the very best things after all.
