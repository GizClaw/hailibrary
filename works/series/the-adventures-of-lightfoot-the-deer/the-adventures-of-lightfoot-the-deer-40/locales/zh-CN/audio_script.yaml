audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
    daintyfoot:
      display_name: 轻足太太
      tts:
        delivery: 温柔聪慧，话语亲切，偶尔带着俏皮的笑意
        timbre: 轻柔明亮
        pace: 舒缓自然
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第四十章　绿森林里的幸福日子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这些日子，绿森林里满是幸福。对小鹿轻足来说，更是如此。这是他一生中最快乐的时光，因为他终于赢得了美丽、苗条又年轻的秀足小姐。如今，她已经成了轻足太太。
        - id: ch01-b02
          speaker: narrator
          text: 轻足觉得，世上再没有谁比她更美。轻足太太也认定，世上再没有谁比轻足更英俊、更勇敢。
        - id: ch01-b03
          speaker: narrator
          text: 轻足走到哪儿，轻足太太就跟到哪儿。他带她看自己最喜欢的藏身处，又领她去自己最爱觅食的地方。其实，这些地方轻足太太早就熟悉了。她对绿森林的了解，并不比轻足少，只是没有说出来。
        - id: ch01-b04
          speaker: narrator
          text: 轻足要是想想，那些日子她怎么能天天躲开自己的目光，就该明白，绿森林里几乎没有什么地方是她不知道的。可他根本没细想，只顾得意地带她到处游览。轻足太太也很聪明，不管看见什么，都欢喜地赞叹，仿佛自己真是头一回来。
        - id: ch01-b05
          speaker: narrator
          text: 绿森林的小居民们当然都赶来拜访轻足太太，还纷纷告诉轻足，他们有多替他开心。这可全是真心话。大家都喜爱轻足，也知道从今以后，他会过得更加幸福，不会再因为孤单而离开这里。要是没有小鹿轻足，绿森林也就不再是原来的绿森林了。
        - id: ch01-b06
          speaker: narrator
          text: 轻足把狩猎季里那些可怕的经历，一件件讲给轻足太太听。他说，幸好那时候她不在绿森林。猎人拿着吓人的枪，追得他一刻也不能休息。为了甩掉猎犬，他甚至游过了大河。
        - id: ch01-b07
          speaker: narrator
          text: 轻足太太听完，便轻声回答他。
        - id: ch01-b08
          speaker: daintyfoot
          text: 我知道，这些事我全都知道。大山上也有猎人，我就是因为他们才来到绿森林的。他们不停地追我，逼得我不敢再留在山上。我想着，这边的猎人也许会少一点，就下山来了。
        - id: ch01-b09
          speaker: daintyfoot
          text: 我从来没想到，自己有一天会为了什么事感谢猎人。可现在，我真的很感谢他们。
        - id: ch01-b10
          speaker: narrator
          text: 轻足听得一脸困惑，马上追问她。
        - id: ch01-b11
          speaker: lightfoot
          text: 感谢他们什么？我实在想不出来，猎人还有哪一点值得感谢呀。
        - id: ch01-b12
          speaker: daintyfoot
          text: 哎，你这个傻瓜！这还不明白吗？如果他们没有把我从大山上赶下来，我又怎么会找到你呢？
        - id: ch01-b13
          speaker: lightfoot
          text: 应该说，我怎么会找到你才对。这样看来，我欠那些猎人的，比你欠他们的更多。他们让我得到了这一生最大的幸福，可我自己一直没有想到。
        - id: ch01-b14
          speaker: lightfoot
          text: 有些事明明看起来糟得不能再糟，最后却成了好得不能再好的事。你不觉得，这真奇怪吗？
