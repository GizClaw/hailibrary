    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
    landowner:
      display_name: Lightfoot's Friend
      tts:
        delivery: kind, principled, and firmly protective
