  chapters:
    - id: ch01
      title: THE HUNTER IS DISAPPOINTED
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Lightfoot couldn't have explained how he knew he was safe. He simply knew. After his long swim across the Big River, he had climbed the bank and found himself in a man's yard. He couldn't understand the man's words, but he didn't need to. Somehow, Lightfoot knew he had found a friend.
        - id: ch01-b02
          speaker: narrator
          text: The man gently guided him to an open shed where soft hay lay in a pile. Lightfoot let him do it. Then he lay down, so worn out that he felt he couldn't take one more step.
        - id: ch01-b03
          speaker: narrator
          text: Only a few minutes passed before the hunter who had followed Lightfoot across the river reached the bank and scrambled out of his boat. Lightfoot's new friend stood waiting at the top. The hunter saw him right away.
        - id: ch01-b04
          speaker: hunter
          text: Hello there! Did a deer come through here a few minutes ago? He swam across the river. If I know anything about deer, he's too tired to have gone far. I've been after that fellow for days, and with any luck, I'll finally get him this time.
        - id: ch01-b05
          speaker: landowner
          text: Then I'm afraid you're out of luck. I don't permit hunting on my land.
        - id: ch01-b06
          speaker: narrator
          text: The hunter stared in surprise. Then he grew angry.
        - id: ch01-b07
          speaker: hunter
          text: So you're planning to take that deer for yourself?
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: Lightfoot's friend shook his head.
        - id: ch01-b09
          speaker: landowner
          text: No, I mean nothing of the kind. I don't intend to kill him myself. I mean to keep that deer from being killed if I can. While he's on my land, I believe I can protect him. You'd better get back in your boat and row back where you came from. Are those your hounds barking across the river?
        - id: ch01-b10
          speaker: hunter
          text: No, certainly not. I know the law as well as you do, and hunting deer with dogs is illegal. I don't even know who owns those two hounds over there.
        - id: ch01-b11
          speaker: landowner
          text: That may be true. I don't doubt it. But you were willing to take advantage when someone else's dogs broke the law. You knew those dogs had driven that deer into the Big River. Then you hurried out in your boat, hoping to reach him before he could swim across. You aren't hunting for the pleasure of the hunt. You only want to kill. You know nothing about justice or fair play.
        - id: ch01-b12
          speaker: landowner
          text: Now leave my land. Get into your boat and go at once. That deer is close by, and he's too tired to move. As long as he stays here, he'll be safe. I hope he stays until this miserable hunting season is over. Now go.
        - id: ch01-b13
          speaker: narrator
          text: The hunter muttered angrily as he climbed back into his boat and pushed away from shore.
        - id: ch01-b14
          speaker: narrator
          text: But he did not row back across the river.
