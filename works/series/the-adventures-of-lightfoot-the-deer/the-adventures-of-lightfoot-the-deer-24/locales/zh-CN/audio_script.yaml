audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    hunter:
      display_name: 猎人
      tts:
        delivery: 强硬急躁，恼怒时咄咄逼人
        timbre: 粗哑厚重
        pace: 偏快
        pitch: 中低音
    lightfoots_friend:
      display_name: 轻足的朋友
      tts:
        delivery: 正直坚定，说话直接而毫不退让
        timbre: 沉稳清晰
        pace: 从容有力
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十四章　猎人大失所望
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 轻足说不清自己为什么会知道，可他心里就是明白，他真的已经安全了。仅此而已。他刚刚游过大河，又爬上河岸，走进一个人家的院子。院子主人说什么，他一个字也听不懂。不过，要认出一位朋友，并不一定非得听懂他的话。
        - id: ch01-b02
          speaker: narrator
          text: 轻足顺从地跟着那个人，慢慢走进一座敞开的棚子。棚里堆着柔软的干草。他躺了下来，累得觉得自己一步也走不动了。
        - id: ch01-b03
          speaker: narrator
          text: 才过了几分钟，那个驾船追过大河的猎人也到了。他从船里爬上岸，一抬头，就看见轻足的朋友站在河岸上等着他。
        - id: ch01-b04
          speaker: hunter
          text: 嘿，朋友！几分钟前，有一头鹿从这边过去，你看见了吗？他是游过河来的。照我看，他已经累坏了，这会儿肯定走不远。我追那家伙好几天了。只要这回运气不太差，我准能逮到他。
        - id: ch01-b05
          speaker: lightfoots_friend
          text: 那你恐怕不会走运了。我这块地上，不许任何人打猎。
        - id: ch01-b06
          speaker: narrator
          text: 猎人先是吃了一惊，紧接着便恼火起来。
        - id: ch01-b07
          speaker: hunter
          text: 原来你是想把那头鹿留给自己！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 轻足的朋友摇了摇头。
        - id: ch01-b09
          speaker: lightfoots_friend
          text: 不，你完全想错了。只要我拦得住，就不准任何人杀死那头鹿。现在他在我的土地上，这件事我就管得了。朋友，我劝你回到船里去，从哪儿来的，就划回哪儿去。对岸叫的那几声，是你的猎犬吗？
        - id: ch01-b10
          speaker: hunter
          text: 不是。我和你一样懂得法律。用狗追猎鹿是违法的。对岸那两条猎犬是谁家的，我根本不知道。
        - id: ch01-b11
          speaker: lightfoots_friend
          text: 这也许是真的，我相信你没有撒谎。可是，别人家的狗犯了法，你却正好借这件事占便宜。你明明知道，那两条狗把这头鹿逼进了大河。于是，你马上驾船追过去，想趁他还没游到对岸，就先抓到他。
        - id: ch01-b12
          speaker: lightfoots_friend
          text: 你并不是喜欢打猎，你只是想杀死猎物。你根本不懂什么叫公道，什么叫公平。现在，请你离开我的土地。马上回到船里，越快离开越好。
        - id: ch01-b13
          speaker: lightfoots_friend
          text: 那头鹿就在附近。他累得一点也动不了了。只要他愿意留在这里，就不会受到伤害。我真希望他一直住下去，等这个可恶的狩猎季彻底结束。好了，走吧。
        - id: ch01-b14
          speaker: narrator
          text: 猎人气呼呼地嘟囔着，到底还是回到了船上。他把船撑离河岸，却没有划回大河对面。
