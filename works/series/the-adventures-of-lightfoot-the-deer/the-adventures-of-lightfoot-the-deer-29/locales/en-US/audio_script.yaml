  chapters:
    - id: ch01
      title: MR. AND MRS. QUACK ARE STARTLED
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was evening on the day after the hunting season for Lightfoot the Deer had ended. Jolly, round, red Mr. Sun had gone to bed behind the Purple Hills. The Black Shadows were creeping across the Big River. Along the river's edge, Mr. and Mrs. Quack were eating their evening meal among the brown stalks of wild rice.
        - id: ch01-b02
          speaker: narrator
          text: They took turns searching the mud for grains of rice. Mrs. Quack tipped forward until she seemed to be standing on her head, while Mr. Quack watched for danger. Then Mrs. Quack stood guard while Mr. Quack tipped up and hunted for rice.
        - id: ch01-b03
          speaker: narrator
          text: Everything was wonderfully quiet and peaceful. Not a ripple stirred the Big River. They could even hear a dog barking at a farmhouse a mile away. They were too far from the bank for Reddy Fox or Old Man Coyote to trouble them. Only Hooty the Owl might be a danger. That was why they kept taking turns on watch. This was Hooty's favorite time to hunt.
        - id: ch01-b04
          speaker: narrator
          text: After a while, Hooty's hunting call came from far off in the Green Forest. Mr. and Mrs. Quack began to feel safer. They spoke together in low, contented voices. For a little while, at least, they thought there was nothing to fear.
        - id: ch01-b05
          speaker: narrator
          text: Suddenly, Mr. Quack's sharp ears caught a small splash somewhere out in the quiet Big River. Mrs. Quack lifted her head from the water to see what was happening.
        - id: ch01-b06
          speaker: mr_quack
          text: Keep quiet.
        - id: ch01-b07
          speaker: narrator
          text: Without a sound, they swam through the brown stalks until they could see across the river. Another little splash came from the middle of the water. A fish had not made that sound. Whatever made it was much bigger than any fish. Soon they saw a silver line moving toward them out of the Black Shadows. They knew someone was crossing the Big River in their direction. Could it be a hunter in a boat?
        - id: ch01-b08
          speaker: narrator
          text: Mr. and Mrs. Quack stretched their necks high and watched. The moment they saw danger, they were ready to use their strong wings. But they did not want to fly until they were sure. Even so, they were very much startled.
        - id: ch01-b09
          speaker: narrator
          text: At last, they could make out something that looked like a tree branch moving over the water toward them. That was very strange.
        - id: ch01-b10
          speaker: mr_quack
          text: That's queer. Very queer.
        - id: ch01-b11
          speaker: mrs_quack
          text: It certainly is.
        - id: ch01-b12
          speaker: narrator
          text: Both of them grew more suspicious. They could not understand what they were seeing, and it is always best to be suspicious of something you cannot understand. Mr. and Mrs. Quack half raised their wings, ready to fly.
