audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    mr_quack:
      display_name: 野鸭先生
      tts:
        delivery: 警觉务实，沉着中带着自然的情绪起伏
        timbre: 明亮圆润
        pace: 适中
        pitch: 中音
    mrs_quack:
      display_name: 野鸭太太
      tts:
        delivery: 机警稳妥，说话轻柔而有分寸
        timbre: 清亮轻盈
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十九章　野鸭先生和太太吓了一跳
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 轻足的狩猎季已经结束，这是第二天的傍晚。圆滚滚、红彤彤、快活的太阳先生躲到紫山后面睡觉去了。黑影爬出来，慢慢盖过大河。野鸭先生和太太正在河边枯黄的野稻秆中吃晚餐。
        - id: ch01-b02
          speaker: narrator
          text: 他们一个找吃的，一个放哨，过一会儿再交换。野鸭太太先把头扎进水里，从泥中寻找稻谷。她尾巴朝上，简直像在倒立。野鸭先生就在一旁提防危险。接下来轮到野鸭太太守望，野鸭先生也一头扎下去，到泥里找稻谷。
        - id: ch01-b03
          speaker: narrator
          text: 四周安安静静，大河上连一道波纹都没有。远在一英里外的农舍里，有一条狗在叫，他们竟然听得一清二楚。他们离河岸很远，狐狸雷迪和郊狼老先生都够不着。唯一要防的是猫头鹰胡迪，所以他们才轮流守望。这个时候，正是胡迪最爱出来捕猎的时辰。
        - id: ch01-b04
          speaker: narrator
          text: 过了一阵，绿森林深处传来了胡迪捕猎时的叫声。既然胡迪离得那么远，野鸭先生和太太总算安心了一点。他们满足地低声说起话来，觉得至少暂时不必害怕了。
        - id: ch01-b05
          speaker: narrator
          text: 就在这时，大河开阔的水面上轻轻响了一声。野鸭先生耳朵尖，马上听见了。野鸭太太刚从水里抬起头，他便赶紧提醒她。
        - id: ch01-b06
          speaker: mr_quack
          text: 别出声。
        - id: ch01-b07
          speaker: narrator
          text: 两只野鸭一点声音也没发出来，悄悄游过枯黄的稻秆，来到能看清大河的地方。河中央又响了一声。那绝不是鱼溅起的水声，因为弄出动静的东西比任何鱼都大。没多久，一道银线从黑影中伸出来，朝他们这边移来。他们明白了，河里有人正向他们靠近。难道那是一条船，船上坐着猎人？
        - id: ch01-b08
          speaker: narrator
          text: 野鸭先生和太太伸长脖子，紧盯着水面。一旦认出危险，他们立刻就能展开有力的翅膀飞走。可在弄清楚以前，他们不愿轻易起飞。尽管如此，他们还是吓了一跳，而且着实吓得不轻。
        - id: ch01-b09
          speaker: narrator
          text: 渐渐地，他们看出有个像树枝一样的东西，正贴着水面向这边移动。这件事实在太古怪了。
        - id: ch01-b10
          speaker: mr_quack
          text: 真奇怪，太奇怪了。
          emotion: surprised
        - id: ch01-b11
          speaker: mrs_quack
          text: 可不是吗，确实古怪。
          emotion: surprised
        - id: ch01-b12
          speaker: narrator
          text: 两只野鸭越来越疑心，却怎么也想不通自己看见了什么。遇到弄不明白的东西，多留一分戒心总是好的。野鸭先生和太太把翅膀张开一半，随时准备飞走。
