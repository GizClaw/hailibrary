audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: alert, curious, and quick-thinking
        timbre: bright and crisp
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: A GAME OF HIDE AND SEEK
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Danny Meadow Mouse once played a game of hide and seek with Buster Bear. For Danny, it was a dreadful game. Still, it was nothing like the game Lightfoot the Deer was now playing with the hunter in the Green Forest.
        - id: ch01-b02
          speaker: narrator
          text: Danny only had to stay beyond the reach of Buster's great paws. As long as Buster couldn't catch him, Danny was safe. And Danny is so small that he can hide beneath two or three leaves. Wherever he goes, he can usually find some little hiding place. Being small gives him a real advantage in hide and seek. Lightfoot is very different. He is one of the largest people in the Green Forest, and someone that big cannot hide so easily.
        - id: ch01-b03
          speaker: narrator
          text: There was another danger, too. A hunter with a terrible gun did not need to come close before he could kill. Lightfoot knew that as he waited for the hunter Sammy Jay had warned him about. The hunting season the year before had taught him many lessons, and he remembered every one. Forgetting even one might cost him his life. So Lightfoot stood perfectly still behind a tangle of fallen trees. He watched, and he listened.
        - id: ch01-b04
          speaker: narrator
          text: Before long, Lightfoot heard Sammy Jay calling from far off in the Green Forest.
        - id: ch01-b05
          speaker: sammy_jay
          text: Thief! Thief! Thief!
        - id: ch01-b06
          speaker: narrator
          text: Lightfoot let out a small sigh of relief. Sammy's cries were a warning. They told him where the hunter was, and once Lightfoot knew that, it was easier to decide what he should do.
        - id: ch01-b07
          speaker: narrator
          text: A Merry Little Breeze slipped through the Green Forest. It came from behind Lightfoot, then danced on toward the hunter and his terrible gun. At once, Lightfoot began to move softly away. He took great care not to make a sound. Instead of going straight ahead, he followed a wide half-circle. Every few steps he stopped to listen and test the air with his wonderful nose.
        - id: ch01-b08
          speaker: narrator
          text: Can you guess what Lightfoot was doing? He was trying to circle around behind the hunter. Then the Merry Little Breezes would carry the dreaded man-scent straight to him. As long as Lightfoot could smell it, he would know where the hunter was, even if he could neither see nor hear him. If he had stayed where Sammy found him, the hunter might have come close enough to shoot before Lightfoot knew exactly where he was.
        - id: ch01-b09
          speaker: narrator
          text: Meanwhile, the hunter with the terrible gun was also moving noiselessly through the Green Forest. He placed each foot with care so he would not snap a stick. His sharp eyes searched every thicket and every likely hiding place for one glimpse of Lightfoot. He also studied the ground for tracks or any other sign that Lightfoot had passed that way.
