audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    sammy_jay:
      display_name: 蓝松鸦萨米
      tts:
        delivery: 机敏活泼，直来直去，遇事反应很快
        timbre: 清亮利落
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 一场可怕的捉迷藏
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 草地鼠丹尼从前和熊巴斯特玩过一回捉迷藏。那场游戏把丹尼吓得够呛。可他当时再难，也远远比不上鹿轻足如今在绿森林里和猎人玩的这一场。
        - id: ch01-b02
          speaker: narrator
          text: 丹尼只要别让熊巴斯特够着，就不会有事。只要巴斯特的大爪子抓不到他，他就是安全的。况且丹尼小得很，两三片叶子就能把他遮住。不管到了哪里，他几乎都找得到藏身的地方。玩捉迷藏时，小个子确实占便宜，这一点可不假。
        - id: ch01-b03
          speaker: narrator
          text: 鹿轻足可不一样。他是绿森林里个头最大的居民之一。身子这么大，想藏起来就难多了。更危险的是，猎人有一杆可怕的枪，根本不必走到近前，就能把他杀死。
    - id: ch02
      title: 萨米从远处报信
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 鹿轻足等着蓝松鸦萨米警告过他的那个猎人，心里很清楚这些事。前一年的狩猎季已经教会他许多功课，每一课他都牢牢记着。哪怕只忘掉一课，也可能丢掉性命。所以，他一动不动地站在一堆倒木后面，仔细听着，也仔细看着。
        - id: ch02-b02
          speaker: narrator
          text: 过了一会儿，远处传来蓝松鸦萨米的尖叫。
        - id: ch02-b03
          speaker: sammy_jay
          text: 小偷！小偷！小偷！
        - id: ch02-b04
          speaker: narrator
          text: 鹿轻足轻轻松了口气。他知道，萨米是在给他报信，让他听出猎人在哪里。有了猎人的位置，他就更容易决定下一步该怎么办。
    - id: ch03
      title: 绕到猎人身后
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这时，一阵快乐小风儿悄悄穿过绿森林。它从鹿轻足背后吹来，一路舞向那个拿着可怕猎枪的猎人。鹿轻足马上放轻脚步，从原地悄悄走开，不让自己发出一点声音。
        - id: ch03-b02
          speaker: narrator
          text: 他沿着半个圆圈往前绕，每走几步，就停下来听一听，再用灵敏的鼻子嗅嗅空气。你猜，他想做什么？他要绕到猎人身后，让快乐小风儿把那股可怕的人味送到鼻边。
        - id: ch03-b03
          speaker: narrator
          text: 只要闻得到那股气味，哪怕看不见、听不见猎人，鹿轻足也知道他在哪里。要是一直待在萨米找到他的地方，也许猎人已经走到猎枪打得着的范围，他还没弄清对方的位置。
        - id: ch03-b04
          speaker: narrator
          text: 猎人也在绿森林里无声地走着。他迈出的每一步都很小心，生怕踩断脚下的枯枝。他用锐利的眼睛搜遍一片片灌木丛和每个可能藏身的地方，想找出鹿轻足的踪影。他还仔细查看地面，要从留下的痕迹中判断鹿轻足来过没有。
