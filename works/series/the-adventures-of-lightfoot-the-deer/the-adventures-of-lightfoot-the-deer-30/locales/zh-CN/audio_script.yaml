audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    mr_quack:
      display_name: 野鸭先生
      tts:
        delivery: 警觉务实，沉着中带着自然的情绪起伏
        timbre: 明亮圆润
        pace: 适中
        pitch: 中音
    mrs_quack:
      display_name: 野鸭太太
      tts:
        delivery: 机警稳妥，说话轻柔而有分寸
        timbre: 清亮轻盈
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十章　谜底揭开了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 眼前这件事太神秘了。真的，实在太神秘了。野鸭先生这么想，野鸭太太也一样。大河中央的黑影里，有个东西像一根树枝。可漂在水上的树枝应该顺流而下呀，这一根怎么径直横着游过来了？树枝哪会游泳呢？两只野鸭谁也想不明白。
        - id: ch01-b02
          speaker: narrator
          text: 他们伏在河边枯黄的野稻秆间，一动也不动，眼睛始终盯着那个怪东西。一旦看出危险，他们随时会腾空飞走，把性命交给那双迅捷的翅膀。可他们不愿意无缘无故地逃开。更何况，他们实在太好奇了，简直好奇得不得了，非要看看穿过水面、向他们靠近的究竟是什么。
        - id: ch01-b03
          speaker: narrator
          text: 那根仿佛会游泳的树枝越来越近，两只野鸭却越看越糊涂，也越发想弄清答案。要是在河狸帕迪的池塘里，他们准会以为，是帕迪衔着树枝去添自己的冬粮堆。可帕迪明明远在绿森林深处，待在他自己的池塘里。这样一来，眼前的东西就更叫人猜不透了。它越靠近，谜团反而越深。他们越来越紧张，越来越不安，好奇心也越来越强。
        - id: ch01-b04
          speaker: narrator
          text: 野鸭先生终于觉得，就算心里再好奇，也不能继续冒险了。他正准备飞起来，野鸭太太当然会跟着他。偏偏就在这时，他听见一个滑稽的小声音，一半像喷鼻，一半像咳嗽，仿佛是谁把水吸进鼻子里了。这个声音好像在哪儿听过。于是，野鸭先生决定再等几分钟。
        - id: ch01-b05
          speaker: mr_quack
          text: 我再等等。不管那是什么，等它游出黑影，到了月光底下，我就能看清了。不知道为什么，我总觉得我们不会有危险。
        - id: ch01-b06
          speaker: narrator
          text: 野鸭先生和太太便留了下来，一边等，一边看。过了几分钟，那个像树枝的东西终于离开黑影，游进了月光。就在这一刻，谜底揭开了，再没有什么可猜的啦。
        - id: ch01-b07
          speaker: narrator
          text: 原来，他们把轻足的鹿角当成了树枝。轻足正在横渡大河，要回到绿森林里的家去。野鸭先生和太太立刻游出去迎接他。他们要告诉轻足，看到他还活着，还平平安安，他们心里有多高兴。
