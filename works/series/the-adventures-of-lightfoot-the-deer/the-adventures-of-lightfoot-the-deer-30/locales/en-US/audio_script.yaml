  chapters:
    - id: ch01
      title: THE MYSTERY IS SOLVED
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was a mystery. Yes, Sir, it certainly was. Mr. Quack thought so, and Mrs. Quack agreed. Out in the Big River, among the Black Shadows, they could see something shaped like a tree branch. A floating branch should have drifted downstream. This one was coming straight across the river, almost as if it could swim. But how could a tree branch swim? Neither Mr. nor Mrs. Quack could make sense of it.
        - id: ch01-b02
          speaker: narrator
          text: They sat perfectly still among the brown wild-rice stalks at the river's edge. Their eyes never left the strange thing moving toward them. The instant they spotted danger, they were ready to leap into the air and trust their swift wings. Still, they would rather not fly unless they had to. And they were curious. Very curious. They wanted to know what that mysterious shape in the water could be.
        - id: ch01-b03
          speaker: narrator
          text: The swimming branch came closer and closer. The nearer it got, the more puzzled the two Ducks became, and the more they wanted an answer. If this had happened in Paddy the Beaver's pond, they would have guessed that Paddy was swimming with a branch for his winter food pile. But this was the Big River. Paddy was far away in his own pond, deep in the Green Forest, and they knew it.
        - id: ch01-b04
          speaker: narrator
          text: That only deepened the mystery. As the thing drew nearer, Mr. and Mrs. Quack grew more nervous and anxious. Part of them wanted to take wing before it came any closer. Yet their curiosity grew right along with their worry, and they stayed because they still wanted to learn what they were seeing.
        - id: ch01-b05
          speaker: narrator
          text: At last, Mr. Quack decided that curiosity was not worth the risk. He made ready to spring into the air, knowing Mrs. Quack would follow. Just then, a funny little noise reached him. It was half a snort and half a cough, like someone who had sniffed water up his nose. Mr. Quack knew that sound somehow, so he chose to wait a few minutes more.
        - id: ch01-b06
          speaker: mr_quack
          text: I'll wait until it comes out of those Black Shadows and into the moonlight. Whatever it is, I have a feeling it won't hurt us.
        - id: ch01-b07
          speaker: narrator
          text: So Mr. and Mrs. Quack stayed where they were and watched the strange shape cross the dark water toward them. A few minutes later, the thing that looked like a tree branch slipped out of the Black Shadows and into the moonlight. At once, the mystery was solved. There was nothing mysterious about it now.
        - id: ch01-b08
          speaker: narrator
          text: What they had taken for a branch was really the antlers of Lightfoot the Deer. Lightfoot himself was swimming across the Big River, heading home to the Green Forest. Mr. and Mrs. Quack swam out at once to meet him and tell him how glad they were to see him alive and safe.
