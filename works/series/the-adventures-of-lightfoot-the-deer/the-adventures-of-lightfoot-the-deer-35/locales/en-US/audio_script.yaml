audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: quick, outspoken, and deeply concerned
        timbre: bright and crisp
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: LIGHTFOOT IS RECKLESS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Lightfoot the Deer had become completely reckless as he searched for the new stranger in the Green Forest. When he had looked for the beautiful stranger with the dainty feet, he had slipped quietly from thicket to thicket, almost like a gray shadow. He was not quiet now. He bounded through the forest without caring how much noise he made.
        - id: ch01-b02
          speaker: narrator
          text: Every so often, Lightfoot stopped and whistled a challenge. He struck his horns against the trees and stamped the ground with his feet. Then, after each angry display, he stood still and listened. He hoped some sound would tell him where the stranger was.
        - id: ch01-b03
          speaker: narrator
          text: Now and then, Lightfoot came across the stranger's tracks. Those tracks told him that the stranger was doing exactly what Lightfoot had done. He, too, was trying to find the beautiful newcomer with the dainty feet. Each new sign made Lightfoot angrier than before.
        - id: ch01-b04
          speaker: narrator
          text: It did not take Sammy Jay long to learn what was happening. Very little escapes Sammy's sharp eyes. He had already discovered the game of hide-and-seek between Lightfoot and the beautiful young visitor from the Great Mountain.
        - id: ch01-b05
          speaker: narrator
          text: Then Sammy happened to visit the Laughing Brook just as the big stranger came down for a drink. For once, Sammy said nothing aloud. But he had plenty to say to himself.
        - id: ch01-b06
          speaker: sammy_jay
          text: Just wait until Lightfoot discovers this fellow. There'll be plenty of excitement then! If those two meet, and I have a feeling they will, we'll see quite a fight. I'd better spread the news.
        - id: ch01-b07
          speaker: narrator
          text: Sammy flew off to find his cousin, Blacky the Crow, and told him what he had discovered. Next he found Bobby Coon and told him. He spotted Unc' Billy Possum sitting in the doorway of his hollow tree, so Unc' Billy heard the news too. Then Sammy found Jumper the Hare beneath a little hemlock tree and told him all about it.
        - id: ch01-b08
          speaker: narrator
          text: After that, Sammy flew to the dear Old Briar-patch to tell Peter Rabbit. He also carried the news to Drummer the Woodpecker, Tommy Tit the Chickadee, and Yank Yank the Nuthatch in the Old Orchard.
        - id: ch01-b09
          speaker: narrator
          text: Drummer, Tommy Tit, and Yank Yank hurried straight to the Green Forest. They could not imagine missing something as exciting as a meeting between Lightfoot and the big stranger from the Great Mountain.
        - id: ch01-b10
          speaker: narrator
          text: Sammy remembered Paddy the Beaver as well. But when Sammy told him, Paddy already knew. He had seen the big stranger at the edge of his pond early the night before.
        - id: ch01-b11
          speaker: narrator
          text: Lightfoot knew nothing about Sammy or the news racing through the forest. He could think of only one thing. He meant to find that big stranger and drive him out of the Green Forest. So Lightfoot kept searching without rest.
