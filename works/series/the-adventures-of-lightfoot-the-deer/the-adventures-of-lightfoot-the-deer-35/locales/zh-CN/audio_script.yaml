audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    sammy_jay:
      display_name: 蓝松鸦萨米
      tts:
        delivery: 机敏活泼，直来直去，遇事反应很快
        timbre: 清亮利落
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十五章　轻足不顾一切
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 轻足一心要找到新来的陌生客，已经什么都不顾了。先前寻找那位有着秀气蹄子的美丽陌生客时，他总像一道灰影，悄悄从一片灌木溜到另一片灌木。可现在，他一路蹦跳着往前冲，闹出多大动静也不在乎。
        - id: ch01-b02
          speaker: narrator
          text: 每隔一会儿，轻足就会停下来，吹出长鸣向对方挑战。他拿鹿角撞树，又用力跺着蹄子。发泄过怒火，他才站住不动，仔细听听四周。他盼着能听见什么，好知道那位陌生客藏在哪里。
        - id: ch01-b03
          speaker: narrator
          text: 有时，轻足会找到对方留下的蹄印。那些足迹告诉他，这位陌生客也在做他先前做过的事。对方同样在寻找那位有着秀气蹄子的美丽新客。每发现一点新的踪迹，轻足就会变得更生气。
        - id: ch01-b04
          speaker: narrator
          text: 绿森林里出了这样的事，当然瞒不了蓝松鸦萨米多久。很少有什么能逃过他那双锐利的眼睛。那位美丽的小客人从大山来到绿森林以后，轻足跟她玩起了捉迷藏。萨米早就把这一切看明白了。
        - id: ch01-b05
          speaker: narrator
          text: 后来，萨米碰巧去了欢笑溪。那个大块头陌生客正好也到溪边喝水。萨米看见了他，这次却难得没有声张，只在心里盘算起来。
        - id: ch01-b06
          speaker: sammy_jay
          text: 等轻足发现这个家伙，绿森林里可就热闹了。他们俩只要碰上，准会狠狠打一架。我有预感，他们一定会遇见。这场好戏可不能只有我知道，我得赶紧把消息传开。
        - id: ch01-b07
          speaker: narrator
          text: 萨米先找到表兄乌鸦黑仔，把自己的发现告诉了他。接着，他又去找浣熊博比。负鼠比利大叔正坐在空心树洞门口，也听到了这个消息。萨米随后发现野兔跳跳坐在一棵小铁杉树下，便连他也一起告诉了。
        - id: ch01-b08
          speaker: narrator
          text: 之后，萨米飞到亲爱的老荆棘丛去找彼得兔。他当然也没有漏掉啄木鸟鼓手、山雀汤米和䴓鸟扬克。那三个家伙当时都在老果园里，一听说这件事，马上往绿森林赶。
        - id: ch01-b09
          speaker: narrator
          text: 轻足就要和那个来自大山的大块头陌生客碰面了。这样刺激的场面，鼓手、汤米和扬克说什么也不肯错过。
        - id: ch01-b10
          speaker: narrator
          text: 萨米没有忘记海狸帕迪。可是等他把消息带到，帕迪早就知道了。前一天夜里刚入夜，那个大块头陌生客曾在帕迪的池塘边出现，帕迪亲眼见过他。
        - id: ch01-b11
          speaker: narrator
          text: 这些事，轻足一点也不知道。他满脑子只有一个念头。一定要找到那个大块头陌生客，把他赶出绿森林。于是，轻足一刻也不停，继续四处寻找。
