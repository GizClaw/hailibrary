audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    sammy_jay:
      display_name: 蓝松鸦萨米
      tts:
        delivery: 机敏活泼，直来直去，遇事反应很快
        timbre: 清亮利落
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十七章　蓝松鸦萨米很担心
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 蓝松鸦萨米很少替别人担心。不过说真的，他连自己的事也不大担心。萨米脑子灵，他自己也清楚这一点。那顶尖帽子底下，装着绿森林里数得着的聪明头脑。他觉得自己照顾得了自己，所以向来不为自己发愁。
        - id: ch01-b02
          speaker: narrator
          text: 可这一回，萨米真的担心起来了。他惦记的是鹿轻足。没错，萨米正在为轻足发愁。他已经找了两天，既没见到轻足，也没发现半点踪迹。拿着可怕猎枪的猎人，他倒是碰见了不少。在萨米看来，绿森林里到处都是他们。他忍不住怀疑，会不会有哪个猎人已经杀死了轻足。
        - id: ch01-b03
          speaker: narrator
          text: 萨米知道轻足所有的藏身处。他一处接一处，全都找过了，可哪里也没有轻足。两天来，他遇见的每个人也都说，自己没见过轻足。
        - id: ch01-b04
          speaker: narrator
          text: 萨米心里很不好受，因为他是真心喜欢轻足。你还记得吧，狩猎季开始的那个早晨，猎人刚一出现，就是萨米赶去给轻足报信。从那以后，他总想方设法给猎人添麻烦。
        - id: ch01-b05
          speaker: narrator
          text: 每次发现猎人，萨米都会放开嗓门尖叫，让附近所有听得见的人知道猎人在哪里。有一回，一个猎人气得朝他开了枪。可萨米早就防着这一手，一直待在枪弹够不着的地方。
        - id: ch01-b06
          speaker: narrator
          text: 猎犬追赶轻足的事，萨米知道得一清二楚。其实，绿森林里的每个人都知道，因为大家都听见了狗叫。有一次，轻足就从萨米坐着的树下跑了过去。才过一会儿，两条猎犬也来了。它们把鼻子贴近地面，循着轻足的踪迹追了过去。
        - id: ch01-b07
          speaker: narrator
          text: 从那以后，萨米再也没见过轻足。他能帮轻足躲开猎人，却没办法替轻足摆脱那两条猎犬。
        - id: ch01-b08
          speaker: narrator
          text: 萨米把事情翻来覆去地想，越想越不安。他暗暗对自己说：
        - id: ch01-b09
          speaker: sammy_jay
          text: 恐怕那些猎犬把轻足赶到了空旷的地方，让猎人有机会开枪杀了他。要不然，它们就把他追得一点力气也没了，然后亲自杀了他。
          emotion: fearful
        - id: ch01-b10
          speaker: sammy_jay
          text: 如果轻足还活着，一定会有人看见他。可从猎犬追他的那天起，谁也没有见过他。我为了这件事，担心得连胃口都快没了。轻足恐怕已经死了，我几乎敢肯定。要真是这样，绿森林就再也不是从前的绿森林了。
          emotion: sad
