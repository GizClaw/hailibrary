audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: quick-witted, lively, and openly concerned
        timbre: bright and crisp
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: SAMMY JAY WORRIES
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sammy Jay doesn't often worry about anyone but himself. To tell the truth, he doesn't even worry about himself very much. Sammy is smart, and he knows it. Some of the cleverest wits in the whole Green Forest are tucked beneath his pointed cap. He feels perfectly able to look after himself.
        - id: ch01-b02
          speaker: narrator
          text: But now Sammy was worried about Lightfoot the Deer. Yes, Sir, Sammy Jay was truly worried about Lightfoot. He had searched for two days without finding him or a single sign of him. What Sammy did find were plenty of hunters carrying terrible guns. They seemed to be everywhere in the Green Forest. Sammy began to fear that one of them had killed Lightfoot.
        - id: ch01-b03
          speaker: narrator
          text: Sammy knew every place where Lightfoot liked to hide, and he checked them all. Lightfoot wasn't in any of them. None of the people Sammy met had seen him for two days, either.
        - id: ch01-b04
          speaker: narrator
          text: Sammy felt awful because he was very fond of Lightfoot. Remember, Sammy was the one who warned him that a hunter was coming on the morning the dreadful hunting season began.
        - id: ch01-b05
          speaker: narrator
          text: From the first day of hunting season, Sammy had done everything he could to cause trouble for the hunters. Each time he found one, he screamed as loudly as he could. That told everyone within hearing exactly where the hunter was.
        - id: ch01-b06
          speaker: narrator
          text: One hunter became so angry that he fired at Sammy. But Sammy had guessed that might happen, so he had stayed just beyond the hunter's reach.
        - id: ch01-b07
          speaker: narrator
          text: Sammy also knew that the hounds had chased Lightfoot. Everyone in the Green Forest knew, because everyone had heard the hounds calling as they ran.
        - id: ch01-b08
          speaker: narrator
          text: Once, Lightfoot had passed directly beneath the tree where Sammy sat. A few moments later, the two hounds came by with their noses pressed to the ground, following Lightfoot's trail. That was the last time Sammy had seen him. Sammy had been able to protect Lightfoot from hunters, but there was nothing he could do to protect him from the hounds.
        - id: ch01-b09
          speaker: narrator
          text: The longer Sammy thought about all this, the more worried he became.
        - id: ch01-b10
          speaker: sammy_jay
          text: I'm afraid those hounds chased him into the open, where a hunter could shoot him. Or maybe they wore him out and killed him themselves.
          emotion: fearful
        - id: ch01-b11
          speaker: sammy_jay
          text: If Lightfoot were still alive, surely someone would have seen him. But no one has seen him since the day those hounds chased him.
          emotion: fearful
        - id: ch01-b12
          speaker: sammy_jay
          text: Why, I've worried so much that I've lost my appetite. If Lightfoot is dead, and I'm almost certain he is, the Green Forest will never feel the same.
          emotion: sad
