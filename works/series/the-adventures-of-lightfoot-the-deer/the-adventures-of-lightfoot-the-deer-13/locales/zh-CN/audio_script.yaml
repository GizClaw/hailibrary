audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
    paddy:
      display_name: 帕迪
      tts:
        delivery: 朴实爽朗，语气热心而直率
        timbre: 厚实温暖
        pace: 稳健
        pitch: 中低音
  chapters:
    - id: ch01
      title: 池塘边的老朋友
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 鹿轻足一看见海狸帕迪，就明白至少眼下没有危险。帕迪是绿森林里最胆小谨慎的居民之一。他既然肯在白天出来干活，就说明这里已经很久没有受到惊扰。否则，他只会等到夜里再动手。
        - id: ch01-b02
          speaker: narrator
          text: 轻足刚踏上岸，帕迪差不多也看见了他。帕迪嘴里衔着一根白杨树枝，却没有停下来。他一直游向自己储存食物的地方。你应该还记得，帕迪的食物堆就藏在水里。他把树枝用力按下去，牢牢卡在那些已经沉入池塘的树枝中间。
        - id: ch01-b03
          speaker: narrator
          text: 等树枝安置好了，帕迪才游到轻足面前。
        - id: ch01-b04
          speaker: paddy
          text: 嗨，轻足！瞧瞧你，好像比从前更英俊了。这几天秋高气爽的，你过得怎么样？
    - id: ch02
      title: 狩猎季的第一天
      blocks:
        - id: ch02-b01
          speaker: lightfoot
          text: 焦虑。我心里实在焦虑得很。你知道今天是什么日子吗？
        - id: ch02-b02
          speaker: paddy
          text: 今天是什么日子？我哪知道，也不大关心。今天天气好得难得，光是这一点，我就知足啦。
        - id: ch02-b03
          speaker: narrator
          text: 轻足听了，满心都是惆怅。
        - id: ch02-b04
          speaker: lightfoot
          text: 真希望我也能像你这么想，帕迪，可我做不到。不，先生，我就是做不到。今天是一年里最可怕的那些日子的头一天。太阳先生还没真正起床，猎人就开始找我了。至少已经有一个猎人出动，我敢说还会有别人。我骗过了那一个，可从现在起，一直到狩猎季结束，只要天还亮着，我就没有一刻能觉得绝对安全。
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: 帕迪爬上岸，若有所思地嚼起一小截白杨嫩枝。他常说，嘴里有东西可嚼，脑子才转得更好。
        - id: ch02-b06
          speaker: paddy
          text: 这消息可真不好，轻足。听你说完，我心里难受极了。真的，我怎么也弄不懂，像你这么英俊的家伙，怎么会有人忍心来猎杀呢？哎呀，再看看你这对鹿角，多漂亮啊！
          emotion: sad
        - id: ch02-b07
          speaker: narrator
          text: 轻足的声音里也带上了一点伤感。
        - id: ch02-b08
          speaker: lightfoot
          text: 我从来没长过这么好的一对鹿角。可是帕迪，我倒觉得，猎人追得这么狠，没准儿就有它们的缘故。长得漂亮，有时未必是好事。最近这附近有猎人来过吗？
          emotion: sad
    - id: ch03
      title: 两个伙伴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 帕迪摇了摇头。
        - id: ch03-b02
          speaker: paddy
          text: 一个也没见过。轻足，我倒有个主意，我们先做一阵子伙伴吧。你就留在我的池塘周围。我要是看见、听见或者闻见什么不对劲，马上给你报信。你要是发现了可疑的事，也来提醒我。两双眼睛、两对耳朵，再加两个鼻子，怎么也比一套管用。怎么样，你愿意吗？
        - id: ch03-b03
          speaker: lightfoot
          text: 就这么办。
