audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
    paddy:
      display_name: Paddy the Beaver
      tts:
        delivery: friendly, practical, and good-natured
        timbre: sturdy and mellow
        pace: steady
        pitch: medium-low
  chapters:
    - id: ch01
      title: LIGHTFOOT AND PADDY BECOME PARTNERS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The moment Lightfoot saw Paddy the Beaver, he knew there was no danger, at least for the time being. Paddy is one of the shyest little people in the Green Forest. Lightfoot knew that if Paddy was out working in daylight, he must have been left undisturbed for a long time. If there had been any trouble nearby, Paddy would have done his work only at night.
        - id: ch01-b02
          speaker: narrator
          text: Paddy noticed Lightfoot almost as soon as he came out onto the bank. But Paddy kept right on swimming with the branch of a poplar tree until he reached his food pile. Like every beaver's food pile, it was in the water. Paddy forced the new branch down until the other branches already sunk in the pond held it securely. Once that job was done, he swam over to where Lightfoot stood watching.
        - id: ch01-b03
          speaker: paddy
          text: Hello, Lightfoot! You're looking more handsome than ever. How have you been feeling on these fine autumn days?
        - id: ch01-b04
          speaker: lightfoot
          text: Anxious. Terribly anxious. Paddy, do you know what day this is?
        - id: ch01-b05
          speaker: paddy
          text: No, I don't, and I don't much care. Knowing it's one of the finest days we've had in a long time is enough for me.
        - id: ch01-b06
          speaker: lightfoot
          text: I wish I could feel that way, Paddy. I truly wish I could, but I can't. No, sir, I can't. You see, this is the first of the most dreadful days of the whole year for me. Hunters began looking for me before Mr. Sun was properly out of bed this morning. At least one hunter did, and I don't doubt there are others. I managed to fool that one. But from now until hunting season ends, there won't be a single moment of daylight when I feel completely safe.
        - id: ch01-b07
          speaker: narrator
          text: Paddy climbed out of the water and onto the bank. He found a small poplar twig and chewed it thoughtfully. Paddy says he can always think better when he has something to chew.
        - id: ch01-b08
          speaker: paddy
          text: That's bad news, Lightfoot. I truly am sorry to hear it. I can't understand why anyone would want to hunt a handsome fellow like you. And my, what a beautiful set of antlers you have!
        - id: ch01-b09
          speaker: lightfoot
          text: They're the best antlers I've ever had. But you know, Paddy, I think they may be one reason I'm hunted so much. Good looks aren't always something to wish for. Have you seen any hunters near here lately?
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: Paddy shook his head.
        - id: ch01-b11
          speaker: paddy
          text: Not one. I have an idea, Lightfoot. Let's be partners for a while. Stay close to my pond. If I see, hear, or smell anything suspicious, I'll warn you. You can do the same for me. Two pairs of eyes and ears, and two noses, are better than one. What do you say?
        - id: ch01-b12
          speaker: lightfoot
          text: I'll do it.
