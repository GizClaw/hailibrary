audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 池塘边的猎人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那个猎人很有耐心，也懂得绿森林和绿草地上那些小居民的习性。他知道，要是不想让他们看见，自己就不能动。所以，他坐在那里纹丝不动，简直成了身下那根树干的一部分。
        - id: ch01-b02
          speaker: narrator
          text: 过了好一阵，四周还是看不到半个活物。后来，大河方向的树梢上空传来翅膀急速飞过的呼啸声。野鸭先生和太太扑通落进池塘，在水面上停了一会儿。他们又看又听，留意着附近有没有危险。等到终于放心了，才开始梳理羽毛。看样子，他们觉得这里安全得很。
        - id: ch01-b03
          speaker: narrator
          text: 海狸帕迪很想提醒他们，池塘边可没有他们想的那么安全。不过，猎人始终没有动静，帕迪便决定先等一等。
        - id: ch01-b04
          speaker: narrator
          text: 猎人太想朝那两只野鸭开枪了，差点就没忍住。可他明白，枪声一响，今天就别想再射中鹿轻足。轻足才是他真正想要的。于是，野鸭先生和太太在那支可怕的枪前游来游去，近得很容易就能射中。他们却一点也不知道，危险就在身边。
    - id: ch02
      title: 水坝上的浣熊博比
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 又过了一会儿，猎人敏锐地发现，帕迪的水坝一端有东西动了一下。转眼间，浣熊博比现身了。他毫无戒心，还带着一样东西，猎人却分辨不出那是什么。
        - id: ch02-b02
          speaker: narrator
          text: 博比走到水边，把那样东西仔细洗干净，再爬上水坝吃起来。你是知道的，浣熊博比吃东西很讲究。只要附近有水，他总会先把食物洗一洗。猎人又想开枪，却再次忍住了。这对博比来说，真是再幸运不过。
        - id: ch02-b03
          speaker: narrator
          text: 轻足站在猎人身后土冈顶上的小铁杉树丛里，把这一切看得清清楚楚。他也明白，猎人为什么一次又一次忍着不开枪。想到这里，轻足心里泛起一阵苦涩。
        - id: ch02-b04
          speaker: lightfoot
          text: 他不朝野鸭先生和太太开枪，也不朝浣熊博比开枪，就是因为他想杀掉我。可我究竟做过什么，让他这么急着非杀我不可呢？
    - id: ch03
      title: 红衣访客
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 猎人仍旧坐着，一动也不动。野鸭先生和太太安安心心地在池底泥里寻找食物。浣熊博比吃完以后，走过水坝，消失在绿森林里。他是找地方睡午觉去了。
        - id: ch03-b02
          speaker: narrator
          text: 时间慢慢过去。猎人耐心等着轻足出现，轻足和海狸帕迪也一直盯着猎人。终于，池塘上游那一端又出现了一位访客。他披着一身漂亮非凡的红外衣。原来，狐狸雷迪来了。
