audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: VISITORS TO PADDY'S POND
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The hunter was a patient man, and he understood the ways of the little people in the Green Forest and the Green Meadows. If he wanted to stay hidden, he knew he must not move at all. So he sat as still as though he were part of the very log beneath him.
        - id: ch01-b02
          speaker: narrator
          text: For a while, there wasn't a sign of any living creature. Then came the whistle of swift wings from beyond the treetops, over toward the Big River. Mr. and Mrs. Quack splashed down in the pond.
        - id: ch01-b03
          speaker: narrator
          text: The two Ducks floated there for a few moments, watching and listening for danger. At last they were satisfied, and they began cleaning their feathers. They plainly felt safe. Paddy the Beaver wanted to warn them that they weren't as safe as they thought. But while the hunter stayed still, Paddy decided to wait.
        - id: ch01-b04
          speaker: narrator
          text: The hunter badly wanted to shoot the Ducks. But then he would lose his chance to get Lightfoot that day, and Lightfoot was the one he wanted. So Mr. and Mrs. Quack swam within easy range of that terrible gun without ever knowing danger was near.
        - id: ch01-b05
          speaker: narrator
          text: After a time, the hunter's sharp eyes caught a movement at one end of Paddy's dam. A moment later, Bobby Coon appeared. Bobby didn't suspect a thing. He was carrying something, though the hunter couldn't see what it was.
        - id: ch01-b06
          speaker: narrator
          text: Bobby took it to the water's edge and washed it carefully. Then he climbed onto the dam and began to eat. Bobby is very particular about his food. Whenever water is nearby, he washes his food before he eats it. The hunter was tempted once again, but he resisted. That was very fortunate for Bobby Coon.
        - id: ch01-b07
          speaker: narrator
          text: Lightfoot saw all of this from among the small hemlock trees on the ridge behind the hunter. He understood exactly what it meant.
        - id: ch01-b08
          speaker: lightfoot
          text: He won't shoot Mr. and Mrs. Quack or Bobby Coon because he wants to kill me. What have I ever done to make him want to kill me so badly?
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: Lightfoot thought this with some bitterness. Still, the hunter remained seated on the log without moving. Mr. and Mrs. Quack searched contentedly for food in the mud at the bottom of Paddy's pond. Bobby Coon finished his meal, crossed the dam, and vanished into the Green Forest. He had gone somewhere to take a nap.
        - id: ch01-b10
          speaker: narrator
          text: Time passed. The hunter patiently watched for Lightfoot, while Lightfoot and Paddy watched the hunter. At last, another visitor appeared at the upper end of the pond. This one wore a wonderful red coat. It was Reddy Fox.
