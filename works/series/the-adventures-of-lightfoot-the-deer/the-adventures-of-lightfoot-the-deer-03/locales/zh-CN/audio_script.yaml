audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 机灵直率，情绪来得快，偶尔有些冒失
        timbre: 明亮轻巧
        pace: 稍快
        pitch: 中高音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
    jumper:
      display_name: 野兔跳跳
      tts:
        delivery: 爽快自信，答话干脆，带着年长表兄的笃定
        timbre: 清亮结实
        pace: 明快
        pitch: 中音
  chapters:
    - id: ch01
      title: 彼得努力相信
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有些事听起来根本不可能，要相信它可不容易。可你觉得不可能的事，在别人那里，也许平常得很。所以，不能因为自己想不明白，就断定它绝不会发生。彼得兔很想相信鹿轻足刚才说的话，却还是信不起来。要是他亲眼见过鹿角生长，那自然好说。可从冬末到现在，他一次也没见过轻足。上次见面时，轻足明明就戴着一对跟眼前一样漂亮的鹿角。要说旧鹿角已经脱落，短短一个春夏又长出了一对新的，彼得不相信，也实在怪不得他。
        - id: ch01-b02
          speaker: narrator
          text: 不过，彼得并没有怪轻足。刚才他问起鹿角上的破布时，轻足说过，不愿把事情讲给不肯相信自己的人听。于是彼得谦逊地开了口。
        - id: ch01-b03
          speaker: peter_rabbit
          text: 我正在努力相信呢。
        - id: ch01-b04
          speaker: jumper
          text: 轻足说的全是真的。
        - id: ch01-b05
          speaker: narrator
          text: 另一个声音突然插了进来。彼得吓得跳起身，一回头，才发现是大个子表兄野兔跳跳。跳跳悄无声息地溜到近前，已经把他和轻足的谈话全听见了。
        - id: ch01-b06
          speaker: peter_rabbit
          text: 你怎么知道这是真的？
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: 彼得没好气地问。跳跳刚才那一声，着实把他吓了一跳。
        - id: ch01-b08
          speaker: jumper
          text: 轻足的旧鹿角掉下来以后，我亲眼见过。后来他长新鹿角，我也常常看到他。
        - id: ch01-b09
          speaker: peter_rabbit
          text: 那好！既然你说是真的，以后轻足告诉我的话，我全都信。
        - id: ch01-b10
          speaker: narrator
          text: 彼得一向很敬佩表兄跳跳。接着，他又转向轻足。
        - id: ch01-b11
          speaker: peter_rabbit
          text: 轻足，现在请你讲讲那些破布吧。求你了。
        - id: ch01-b12
          speaker: narrator
          text: 彼得特意说了“求你了”。轻足听到这句话，再也没法拒绝。
    - id: ch02
      title: 新鹿角怎样生长
      blocks:
        - id: ch02-b01
          speaker: lightfoot
          text: 我先前说过，那些破布原本是一层外皮。新鹿角生长时，它包在外面，保护着鹿角。如今只剩下这么一点了。我的旧鹿角掉了没多久，新的就开始往外长。刚长出来时，它们一点也不硬，和现在完全不同。鹿角又软又娇嫩，里面有血流过，就像我们身体里一样。外面那层皮还长着细毛，看起来像一层薄绒。角尖也不是现在这个样子，而是又大又圆，像一个个圆疙瘩。那时，它们根本不像鹿角，还弄得我的脑袋热烘烘的，难受得很，所以我才躲起来。
        - id: ch02-b02
          speaker: lightfoot
          text: 新鹿角长得特别快。我每天看看水里的倒影，都能发现它们又长了一点。有时候，我甚至觉得全身的力气都跑进了鹿角里。我还得处处小心，绝不能撞上东西。撞一下不但会疼，还可能把鹿角的形状碰坏。
        - id: ch02-b03
          speaker: lightfoot
          text: 等鹿角长到现在这么长，它们就开始收缩，慢慢变硬。末端那些圆疙瘩越缩越小，最后成了尖角。鹿角不再生长，血也就不再往里流。它们变硬以后，便不再娇嫩。外面那层皮渐渐干裂，我就在树干和灌木上把它蹭掉。你现在看见的小破布，就是剩下的外皮。不过，我很快就会把它们全弄掉。
        - id: ch02-b04
          speaker: lightfoot
          text: 到那时，要是真的非打不可，我也已经准备好了。除了人，我谁也不怕。就算是人，也只有他带着那把可怕的枪时，我才会怕他。
    - id: ch03
      title: 轻足威风的模样
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 轻足骄傲地扬起头，用那对非凡的鹿角撞向旁边的树，撞得树干咔咔作响。彼得凑近野兔跳跳，压低了声音。
        - id: ch03-b02
          speaker: peter_rabbit
          text: 你看他多神气！这么短的时间里，竟然长出了一对新鹿角，你听说过这么奇妙的事吗？确实很难相信，不过我想，这一定是真的。
        - id: ch03-b03
          speaker: jumper
          text: 当然是真的。彼得，我可不愿让轻足拿那对鹿角往我身上试，哪怕我长得跟人一样高大也不愿意。你总以为轻足胆小怕事，可你真该看看他发怒时的样子。到了那时候，没几个家伙敢站在他面前。
