audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, earnest, and quick to react
        timbre: light and youthful
        pace: quick
        pitch: medium-high
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
    jumper:
      display_name: Jumper the Hare
      tts:
        delivery: confident, matter-of-fact, and slightly teasing
        timbre: warm and sturdy
        pace: steady
        pitch: medium
  chapters:
    - id: ch01
      title: LIGHTFOOT TELLS HOW HIS ANTLERS GREW
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Something can be hard to believe when it seems impossible. But what seems impossible to you may be quite ordinary to someone else. So you cannot say a thing is impossible just because you do not understand it. Peter Rabbit wanted to believe what Lightfoot had told him, but he could not quite manage it. Seeing the antlers grow would have been different. Peter had not seen Lightfoot since the very end of winter, and Lightfoot had worn antlers then that looked just as handsome as the ones he wore now. No wonder Peter struggled to believe that the old pair had fallen off and a new pair had grown during only the spring and summer.
        - id: ch01-b02
          speaker: narrator
          text: Even so, Peter did not blame Lightfoot at all. Lightfoot had already said that he disliked telling things to people who would not believe him. When Peter answered, he was quite humble.
        - id: ch01-b03
          speaker: peter_rabbit
          text: I really am trying to believe you.
        - id: ch01-b04
          speaker: jumper
          text: Every word of it is true.
        - id: ch01-b05
          speaker: narrator
          text: Peter jumped and spun around. His big cousin, Jumper the Hare, stood there. Jumper had slipped up without being seen or heard, and he had listened to everything Peter and Lightfoot said.
        - id: ch01-b06
          speaker: peter_rabbit
          text: How can you be sure it's true?
        - id: ch01-b07
          speaker: narrator
          text: Peter sounded a little cross because Jumper had startled him.
        - id: ch01-b08
          speaker: jumper
          text: I saw Lightfoot's old antlers lying there after they fell off. And while this new pair was growing, I saw him many times.
        - id: ch01-b09
          speaker: peter_rabbit
          text: Then that's settled! If you say Lightfoot is telling the truth, I'll believe anything he tells me. Now, Lightfoot, will you please explain those ragged pieces?
        - id: ch01-b10
          speaker: narrator
          text: Peter admired his big cousin greatly. And Lightfoot could not resist that polite little plea.
        - id: ch01-b11
          speaker: lightfoot
          text: As I said before, those scraps are all that remains of the covering that protected my antlers as they grew. Soon after my old antlers dropped off, the new pair began to come in. They weren't hard like this. They were soft and very tender, with blood flowing through them just as it flows through the rest of our bodies. A skin covered them, and that skin had hair like thin fur.
        - id: ch01-b12
          speaker: lightfoot
          text: The ends weren't sharp, either. They were large and round, almost like knobs. In fact, they hardly looked like antlers at all. They made my head hot, and they were very uncomfortable. That's why I stayed hidden away.
        - id: ch01-b13
          speaker: lightfoot
          text: They grew so quickly that each day, when I looked at my reflection in the water, I could see they were a little longer. Sometimes it felt as though all my strength was going into those new antlers. I had to take great care not to strike them against anything. A blow would have hurt, and it might have ruined their shape.
        - id: ch01-b14
          speaker: lightfoot
          text: Once they reached the length you see now, they began to shrink and harden. The round knobs at the ends grew smaller until they turned into points. When the antlers stopped growing, blood no longer flowed up into them. As they hardened, they stopped being tender.
        - id: ch01-b15
          speaker: lightfoot
          text: Then the skin that had covered them dried out and split. I rubbed it away on trees and bushes. The little rags you see are the last bits, and soon those will be gone too. After that, I'll be ready to fight if I must. I won't fear anyone except man, and I'll fear him only when he carries a terrible gun.
        - id: ch01-b16
          speaker: narrator
          text: Lightfoot proudly tossed his head and rattled his wonderful antlers against the nearest tree.
        - id: ch01-b17
          speaker: peter_rabbit
          text: Isn't he handsome? And, Jumper, have you ever heard of anything as amazing as those new antlers growing so fast? It's hard to believe, but I suppose it has to be true.
        - id: ch01-b18
          speaker: narrator
          text: Peter spoke in a whisper to his cousin.
        - id: ch01-b19
          speaker: jumper
          text: It is true. And I'll tell you something, Peter. Even if I were as big as a man, I wouldn't want Lightfoot testing those antlers on me. You've always thought he was shy and easily frightened. You should see him when he's angry. Not many creatures want to face him then.
