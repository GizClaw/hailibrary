  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    hunter:
      display_name: Hunter
      tts:
        delivery: wary, calculating, and quietly determined
        timbre: firm and weathered
        pace: deliberate
        pitch: medium-low
  chapters:
    - id: ch01
      title: THE MERRY LITTLE BREEZES HELP LIGHTFOOT
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: If you could have watched the hunter with the terrible gun and Lightfoot the Deer on that first morning of hunting season, you might have wondered which one was doing the hunting. Lightfoot was behind the hunter, not ahead of him. He followed so he would always know where the hunter was. As long as Lightfoot could keep track of the man, he felt reasonably safe.
        - id: ch01-b02
          speaker: narrator
          text: The Merry Little Breezes are Lightfoot's best friends. As they wander through the Green Forest, they carry every scent they find to him. Lightfoot's nose is so delicate that even when a scent is very faint, he can tell exactly who or what made it. His big ears and beautiful eyes are useful, but he trusts his nose most of all when danger is near.
        - id: ch01-b03
          speaker: narrator
          text: That is why Lightfoot travels toward the Merry Little Breezes during hunting season. He keeps facing the direction they come from as he moves. Whatever danger may be waiting that way, the Breezes will bring him its scent and warn him.
        - id: ch01-b04
          speaker: narrator
          text: But the hunter who was searching for Lightfoot knew this too. He understood the ways of Lightfoot and the other little people of the Green Forest. When he entered the forest that morning, the first thing he did was find out which way the Merry Little Breezes were coming from. Then he hunted straight into them. That way, they carried his scent behind him instead of ahead.
        - id: ch01-b05
          speaker: narrator
          text: Without Sammy Jay's warning, the hunter probably would have reached Lightfoot's hiding place before Lightfoot even knew there was a hunter in the Green Forest.
        - id: ch01-b06
          speaker: narrator
          text: At last, the hunter came to the tangle of fallen trees where Lightfoot had been hiding. He moved slowly around it and watched every part of it with great care. His terrible gun was ready. If Lightfoot suddenly leaped out, the hunter could use it at once.
        - id: ch01-b07
          speaker: narrator
          text: Then the hunter found Lightfoot's footprints in the soft ground. He studied them and realized that Lightfoot had known he was coming.
        - id: ch01-b08
          speaker: hunter
          text: That confounded Jay gave me away. Lightfoot heard him and understood the warning. I know what Lightfoot did. He circled around behind me so he could catch my scent. Clever. Very clever. But he isn't the only one who can play that game. I'll try the same trick myself.
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: So the hunter made a wide circle back. Before long, the Merry Little Breezes no longer carried any of that dreaded man-smell to Lightfoot. He had lost track of the hunter.
