audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    hunter:
      display_name: 猎人
      tts:
        delivery: 老练警觉，说话低沉而自信
        timbre: 粗哑厚重
        pace: 沉稳
        pitch: 低音
  chapters:
    - id: ch01
      title: 谁在追谁
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 狩猎季开始的那个早晨，要是你看见猎人和鹿轻足在绿森林里的样子，说不定会弄错究竟是谁在追谁。猎人带着那杆可怕的枪，本来是来追鹿轻足的。可鹿轻足却悄悄跟在猎人后面，倒像是他在追猎人。
        - id: ch01-b02
          speaker: narrator
          text: 鹿轻足这样做，是为了盯住猎人的行踪。只要随时知道那个人在哪里，他心里就踏实多了。
        - id: ch01-b03
          speaker: narrator
          text: 快乐小风儿是鹿轻足最好的朋友。它们在绿森林里到处游走，把路上碰见的各种气味一一送到他身边。鹿轻足的鼻子灵敏极了。哪怕气味淡得几乎闻不见，他也分得清是谁，或者是什么东西留下的。
        - id: ch01-b04
          speaker: narrator
          text: 他的耳朵又大，眼睛也好看又好用，可真要提防危险，他最信得过的还是鼻子。所以一到狩猎季，鹿轻足出门时总会迎风走。快乐小风儿从哪个方向来，他就朝哪个方向去。前面若有危险，风儿自然会先把气味送来提醒他。
    - id: ch02
      title: 猎人的办法
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可那个拿着猎枪的人很了解鹿轻足，也熟悉绿森林里其他小居民的习性。他知道鹿轻足会怎样借助风向保护自己。
        - id: ch02-b02
          speaker: narrator
          text: 那天早晨，猎人刚走进绿森林，便先弄清快乐小风儿是从哪边吹来的。接着，他迎着风往前搜。这样，他身上的气味只会飘到后方，不会跑到前面给鹿轻足报信。
        - id: ch02-b03
          speaker: narrator
          text: 要不是蓝松鸦萨米及时警告，猎人很可能已经找到鹿轻足的藏身处，而鹿轻足还不知道这个危险的人进了森林。
        - id: ch02-b04
          speaker: narrator
          text: 猎人来到一堆纠缠在一起的倒木旁边。鹿轻足先前就躲在那后面。他端好枪，小心翼翼地绕着木堆慢慢察看，准备在鹿轻足跳出来的那一刻马上开枪。
        - id: ch02-b05
          speaker: narrator
          text: 很快，他在松软的地面上看见了鹿轻足的蹄印。他低头研究了一阵，立刻明白鹿轻足早就知道他来了。
    - id: ch03
      title: 风里失去的踪迹
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 猎人压低声音嘟囔起来。
        - id: ch03-b02
          speaker: hunter
          text: 都怪那只讨厌的蓝松鸦！鹿轻足一听见他叫，就知道出了什么事。
          emotion: angry
        - id: ch03-b03
          speaker: hunter
          text: 我知道了。鹿轻足绕了个圈，跑到我身后闻我的气味。这办法的确聪明，可会用这一招的又不只有他。我也绕给他看看。
        - id: ch03-b04
          speaker: narrator
          text: 说完，猎人也兜了一个大圈，转身往回走。没过多久，快乐小风儿送到鹿轻足鼻边的气味里，那股可怕的人味不见了。
        - id: ch03-b05
          speaker: narrator
          text: 鹿轻足失去了猎人的踪迹。
