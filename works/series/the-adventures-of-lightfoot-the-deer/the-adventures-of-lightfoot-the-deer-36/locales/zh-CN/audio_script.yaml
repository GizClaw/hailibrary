audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    sammy_jay:
      display_name: 蓝松鸦萨米
      tts:
        delivery: 机敏活泼，直来直去，遇事反应很快
        timbre: 清亮利落
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十六章　蓝松鸦萨米插手了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 蓝松鸦萨米跟在轻足后面，飞遍了绿森林。他兴奋得浑身都快冒出泡了，恨不得马上尖叫起来。可他硬是管住了自己的舌头，一声也没出。他不能让轻足知道，后面正有人跟着呢。
        - id: ch01-b02
          speaker: narrator
          text: 萨米那顶尖帽子底下，脑筋转得可快了。他很快就看出，轻足要找的那个大块头陌生客正在躲着轻足。偏偏轻足搜寻时什么也不顾，弄得到处都是响声。陌生客只要听声音，就知道轻足到了哪里，想避开他的视线一点也不难。
        - id: ch01-b03
          speaker: sammy_jay
          text: 那个陌生客的个头跟轻足差不了多少，可他明摆着不愿意打架。哼，他准是个胆小鬼。
        - id: ch01-b04
          speaker: narrator
          text: 但萨米猜错了。那个陌生客并不胆小。要是非打不可，他早就准备好迎战了。不过，只要能不动手，他还是想避开这场争斗。
        - id: ch01-b05
          speaker: narrator
          text: 他知道自己虽然高大，却比轻足稍小一点。他亲眼见过轻足留下的大蹄印，光看大小就明白，轻足一定比他个头更大，身子也更重。
        - id: ch01-b06
          speaker: narrator
          text: 而且，这位陌生客心里清楚，自己本来就不该待在绿森林。这里是轻足的家，他才是闯进来的那一个。轻足肯定也会这么想，真打起来，自然会格外拼命。所以，不到迫不得已，陌生客不想跟轻足交手。
        - id: ch01-b07
          speaker: narrator
          text: 可他更想找到那位有着秀气蹄子的美丽小客人。轻足有多想找到她，他也一样。他盼着自己先找到她，再带她回到大山。要是一定得为她而战，他不会退缩。但在那以前，他只想躲开轻足，继续寻找那位美丽的陌生客。
        - id: ch01-b08
          speaker: narrator
          text: 这些心思，萨米全都猜到了。他跟着轻足飞了好一阵，却始终没等到两只鹿碰面，觉得再这样白白跟下去也没意思了，便低声嘟囔了一句。
        - id: ch01-b09
          speaker: sammy_jay
          text: 看来，我非得亲自插手不可。再让轻足这样找下去，他永远也碰不上那个大块头陌生客！
        - id: ch01-b10
          speaker: narrator
          text: 萨米不再跟着轻足，转头去找那个陌生客。没用多长时间，他就在海狸帕迪的池塘附近找到了对方。
        - id: ch01-b11
          speaker: narrator
          text: 一看见陌生客，萨米立刻扯开嗓子，拼命尖叫。紧接着，帕迪池塘后面的小山脊顶上传来了树枝折断的声音。萨米马上明白，轻足听见了，也听懂了他的暗示。
