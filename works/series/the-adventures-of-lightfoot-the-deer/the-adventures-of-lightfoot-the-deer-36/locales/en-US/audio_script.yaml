audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: lively, sharp, and mischievous
        timbre: bright and piercing
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: SAMMY JAY TAKES A HAND
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sammy Jay was bubbling over with excitement as he flew here and there through the Green Forest, following Lightfoot the Deer. He was so excited that he wanted to scream. Still, he kept his beak shut. He did not want Lightfoot to discover that someone was following him.
        - id: ch01-b02
          speaker: narrator
          text: Sammy had quick wits under that pointed cap of his. Before long, he understood what was happening. The big stranger Lightfoot was hunting was trying to stay out of Lightfoot's way, and that was easy enough. Lightfoot searched so recklessly and made so much noise that the stranger always knew where he was. He could keep out of sight without any trouble.
        - id: ch01-b03
          speaker: sammy_jay
          text: That stranger is almost as big as Lightfoot, but he plainly doesn't want a fight. He must be a coward.
        - id: ch01-b04
          speaker: narrator
          text: But the stranger was no coward. He was ready to fight if he had to. He simply meant to avoid it if he could. Though he was big, he was not quite as big as Lightfoot, and he knew that. Lightfoot's footprints had shown him how much larger and heavier Lightfoot must be.
        - id: ch01-b05
          speaker: narrator
          text: The stranger also knew he had no real right to be in the Green Forest. It was Lightfoot's home, which made him the intruder. He expected Lightfoot to see it the same way and fight all the harder because of it. That was why he hoped to keep away from a fight.
        - id: ch01-b06
          speaker: narrator
          text: Still, there was something he wanted even more. He wanted to find the beautiful young visitor with the dainty feet, the very one Lightfoot was searching for. He hoped to find her first and take her back with him to the Great Mountain. If he had to fight for her, he would. Until then, he would stay out of the fight. So he kept dodging Lightfoot while he searched for the beautiful stranger himself.
        - id: ch01-b07
          speaker: narrator
          text: Sammy Jay guessed all of this as he watched the two deer. After a while, he grew tired of following Lightfoot when nothing ever came of it.
        - id: ch01-b08
          speaker: sammy_jay
          text: I suppose I'll have to step in myself. The way this is going, Lightfoot will never catch up with that big stranger!
        - id: ch01-b09
          speaker: narrator
          text: Sammy stopped trailing Lightfoot and began hunting through the Green Forest for the stranger instead. He soon found him near Paddy the Beaver's pond. The moment Sammy saw him, he screamed as loudly as he could. Then twigs snapped along the top of a little ridge behind the pond. Lightfoot had heard Sammy's call, and he knew what it meant.
