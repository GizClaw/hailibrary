audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    hunter:
      display_name: 猎人
      tts:
        delivery: 强硬急躁，恼怒时咄咄逼人
        timbre: 粗哑厚重
        pace: 偏快
        pitch: 中低音
    lightfoots_friend:
      display_name: 轻足的朋友
      tts:
        delivery: 正直坚定，说话直接而毫不退让
        timbre: 沉稳清晰
        pace: 从容有力
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十五章　猎人守株待兔
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那个追着轻足渡过大河的猎人，这会儿简直气坏了。他跟到轻足上岸的地方，却被那块土地的主人赶走，只好回到船上。不过，他没有划去对岸，而是顺流而下，在同一边重新上了岸。这里已经不属于轻足的朋友了。
        - id: ch01-b02
          speaker: hunter
          text: 那头鹿休息够了，心里就会不安。他不会一直留在那个人的地盘上，肯定会奔向最近的树林。我先去那儿等着。那个家伙竟敢把我赶走。就为了出这口气，我也一定要弄到这头鹿。要不是他碍事，我早就得手了。那头鹿累得走不远，而且我好多年没见过这么漂亮的鹿角了。把他的头卖掉，一定能卖个好价钱。
        - id: ch01-b03
          speaker: narrator
          text: 猎人把船拴在树上，再次爬上了岸。他登上河堤，朝四周仔细看了看。宽阔的草地那边，有一处长满灌木的老牧场，后面就是茂密的树林。猎人一看，咧开嘴笑了。
        - id: ch01-b04
          speaker: hunter
          text: 那头鹿准会往树林去。他没有别的地方可走。我只管耐心等着就好。
        - id: ch01-b05
          speaker: narrator
          text: 猎人提着那支可怕的枪，穿过草地，来到老牧场。他躲进灌木丛，从枝叶间望着轻足朋友的土地。刚才没能朝轻足开枪，他还在生气。可他又觉得，自己这个办法实在聪明，这回绝不会落空，不由得暗暗发笑。
        - id: ch01-b06
          speaker: narrator
          text: 轻足要进树林，就一定会经过他的枪口。猎人毫不怀疑，只要轻足恢复一点力气，马上就会朝树林出发。于是，他舒舒服服地藏好，准备一直等下去。要是非得等上一整天，他也不在乎。
        - id: ch01-b07
          speaker: narrator
          text: 可是，轻足的朋友已经看见猎人顺流划走，也猜到了他心里的打算。
        - id: ch01-b08
          speaker: lightfoots_friend
          text: 咱们来骗骗他。
        - id: ch01-b09
          speaker: narrator
          text: 他低声笑着，往轻足休息的棚子走去。不过，他没有靠得太近，免得轻足受惊。他只管让轻足能看见自己，然后仍照常忙着手里的活，像是根本没注意到轻足。
        - id: ch01-b10
          speaker: narrator
          text: 这个人喜欢绿森林和绿草地上的小居民，也了解他们。他知道，想让轻足相信自己，最好的办法就是别去理他。轻足静静看着，渐渐明白了。这个人是朋友，不会伤害他。
        - id: ch01-b11
          speaker: narrator
          text: 一点一点地，那种奇妙又可贵的安全感回到了轻足心里。在这里，再也没有猎人能够伤害他。
