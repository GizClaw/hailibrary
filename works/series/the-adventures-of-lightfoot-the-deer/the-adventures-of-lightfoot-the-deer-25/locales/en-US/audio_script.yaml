audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    hunter:
      display_name: The Hunter
      tts:
        delivery: calculating, impatient, and rough-edged
        timbre: hard and gravelly
        pace: deliberate
        pitch: medium-low
    lightfoots_friend:
      display_name: Lightfoot's Friend
      tts:
        delivery: kind, knowing, and quietly confident
        timbre: warm and grounded
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: THE HUNTER LIES IN WAIT
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: If ever a hunter was angry, it was the one who had followed Lightfoot the Deer across the Big River. Lightfoot's friend had ordered him off the land where Lightfoot came ashore. The hunter got back into his boat, but he did not row across the river. He went downstream instead. At last, he landed on the same side of the river, beyond the land owned by Lightfoot's friend.
        - id: ch01-b02
          speaker: hunter
          text: Once that Deer has rested, he'll get uneasy. He won't stay on that man's land. He'll make for the nearest woods, so I'll go up there and wait. I'll get him just to spite the fellow who drove me away. Without that man, I'd have the Deer already. He was too tired to go far, and those are the finest antlers I've seen in years. His head will bring a good price.
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: The hunter tied his boat to a tree and climbed onto the bank once more. He looked over the country ahead. A wide meadow stretched before him. Beyond it lay an old pasture thick with brush, with dense woods behind that. The hunter grinned.
        - id: ch01-b04
          speaker: hunter
          text: That's where the Deer will go. There's nowhere else for him to head. I only have to wait and be patient.
        - id: ch01-b05
          speaker: narrator
          text: He took his terrible gun and tramped across the meadow to the brushy pasture. Then he hid among the bushes. From there, he could peer out and watch the land belonging to Lightfoot's friend.
        - id: ch01-b06
          speaker: narrator
          text: He was still angry that he had not been allowed to shoot Lightfoot. But he chuckled too, because he thought he had been very clever. Lightfoot could not reach the safety of the woods without coming into range of his gun. And the hunter felt sure that as soon as Lightfoot was strong enough to travel, he would set out for those woods. So the hunter settled down. If he had to wait there for the rest of the day, he would.
        - id: ch01-b07
          speaker: narrator
          text: But Lightfoot's friend had watched the hunter row downstream. He guessed exactly what the man meant to do. As he started back toward the shed where poor Lightfoot was resting, he chuckled to himself.
        - id: ch01-b08
          speaker: lightfoots_friend
          text: We'll fool him.
        - id: ch01-b09
          speaker: narrator
          text: The friend did not come too close to Lightfoot. He had no wish to frighten him. Instead, he stayed where Lightfoot could see him and went on with his work as though he were paying no attention to the Deer.
        - id: ch01-b10
          speaker: narrator
          text: This man loved and understood the little people of the Green Forest and the Green Meadows. He knew the surest way to earn Lightfoot's confidence was to seem not to notice him at all. Lightfoot watched the man and understood. This was a friend who meant him no harm. Little by little, a wonderful, blessed feeling of safety came over Lightfoot. No hunter could harm him here.
