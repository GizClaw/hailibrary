  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: thoughtful, mild, and quietly playful
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: LIGHTFOOT BECOMES UNCERTAIN
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Lightfoot the Deer kept moving straight ahead through the Green Forest, toward the place where the Merry Little Breezes came from. Every few steps, he lifted his delicate nose and carefully tested all the scents they carried. As long as the Breezes blew into his face, he could be sure whether any danger waited ahead.
        - id: ch01-b02
          speaker: narrator
          text: Lightfoot uses his nose very much as you and I use our eyes. It tells him the things he wants to know. He knew Reddy Fox had gone along ahead of him, though he never caught even one glimpse of Reddy's red coat. Then the faintest trace of another scent made him stop all at once and test the air more carefully than ever. It was Buster Bear. The scent was so very faint that Lightfoot knew Buster was nowhere near, so he started forward again, taking even greater care than before.
        - id: ch01-b03
          speaker: narrator
          text: Before long, Buster's scent disappeared altogether. Lightfoot understood that Buster had only crossed there on his way to another part of the Green Forest.
        - id: ch01-b04
          speaker: narrator
          text: Lightfoot knew he had nothing to fear in that direction as long as the Breezes brought him none of the dreaded scent of a man. If a man was anywhere in front of him, he could trust them to carry that warning straight to his nose. You see, the Merry Little Breezes are Lightfoot's best friends. Still, he did not want to keep traveling that way all day.
        - id: ch01-b05
          speaker: narrator
          text: That path was taking him farther and farther from the familiar part of the Green Forest he called home. If he followed it long enough, it might even lead him right out of the forest, and that would never do at all. After a while, Lightfoot began to feel uncertain. He simply couldn't decide what to do because he had no way to tell if the hunter with the terrible gun was still following him.
        - id: ch01-b06
          speaker: narrator
          text: Again and again, Lightfoot stopped inside a thicket of young trees or behind a heap of fallen trees the wind had torn up by the roots. Each time, he faced the way he had come. He watched and listened for any sign of the hunter. But after a few minutes, he would grow uneasy. Then he would bound off toward the place where the Breezes came from, making sure he did not run straight into danger.
        - id: ch01-b07
          speaker: lightfoot
          text: If I could only tell whether that hunter is still behind me, I'd know what to do. I have to find out.
