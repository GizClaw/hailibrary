audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lightfoot:
      display_name: 轻足
      tts:
        delivery: 温和沉稳，认真时有庄重感，也藏着一点幽默
        timbre: 柔厚清朗
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 风里捎来的消息
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 鹿轻足继续往前走，穿过绿森林，始终朝着快乐小风儿吹来的方向。走不了几步，他就会抬起灵敏的鼻子，把风儿带来的每一种气味都仔细分辨一遍。风只要迎面吹来，他便能知道前面安不安全。
        - id: ch01-b02
          speaker: narrator
          text: 对鹿轻足来说，鼻子就像你我的眼睛，能告诉他许多想知道的事。他没有看见红狐雷迪，连那身红毛的影子都没瞧见，却从气味里知道，雷迪刚从前面走过。
        - id: ch01-b03
          speaker: narrator
          text: 忽然，一丝淡得几乎闻不出的气味钻进鼻子。鹿轻足马上停住，格外仔细地嗅了又嗅。那是熊巴斯特留下的气味。
        - id: ch01-b04
          speaker: narrator
          text: 气味实在太淡，巴斯特一定不在近处。鹿轻足这才继续走，不过脚下比刚才更谨慎。没过多久，风里再也闻不到巴斯特了。他明白，巴斯特只是去绿森林的别处时经过了这里。
    - id: ch02
      title: 离家越来越远
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 快乐小风儿没有带来那股可怕的人味，鹿轻足便知道前方没有什么危险。如果前面任何地方藏着人，风儿一定会先把气味送来。鹿轻足完全信得过它们，因为快乐小风儿是他最好的朋友。
        - id: ch02-b02
          speaker: narrator
          text: 可他不能整天这样走下去。再往前，就会离开自己熟悉的那片森林，离开那个被他叫作家的地方。要是一直走，说不定最后会出了绿森林，那可不行。
        - id: ch02-b03
          speaker: narrator
          text: 鹿轻足渐渐拿不定主意了。他该往哪里去呢？那个拿着可怕猎枪的人，也许还跟在后面，也许已经不追了。鹿轻足偏偏没有办法知道。
    - id: ch03
      title: 一定要弄明白
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 每隔一阵，鹿轻足就停下来。他有时藏进幼树丛，有时躲到被大风连根拔起的倒木后面，然后转过身，望着自己走来的方向。他一边看，一边竖起耳朵听，想找出猎人还在追赶的迹象。
        - id: ch03-b02
          speaker: narrator
          text: 可他在那里待不了几分钟，心里就又不安起来。接着，他会猛地跃出去，重新朝快乐小风儿吹来的方向奔跑。这样走，至少不会迎头撞上危险。
        - id: ch03-b03
          speaker: lightfoot
          text: 要是能弄清那个猎人到底还追不追，我就知道下一步该怎么走了。不行，我一定得查个明白。
