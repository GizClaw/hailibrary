audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gently rustic
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sly and boastfully cheerful
        timbre: bright and sharp
        pace: quick
        pitch: medium-high
    blacky_crow:
      display_name: Blacky the Crow
      tts:
        delivery: shrewd and rough-edged
        timbre: dark and raspy
        pace: deliberate
        pitch: low
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: hot-tempered and cunning
        timbre: lean and slightly rough
        pace: brisk
        pitch: medium
    shadow_weasel:
      display_name: Shadow the Weasel
      tts:
        delivery: quiet and watchful
        timbre: thin and smooth
        pace: controlled
        pitch: medium-high
    mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: slow and solemn with dry humor
        timbre: deep and gravelly
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: "VII. FOUR LITTLE SCAMPS PLAN MISCHIEF"
      blocks:
        - id: ch01-b01
          speaker: sammy_jay
          text: "Some folks think they're mighty smart—oh, la me! Oh, la me! Like the knave who stole the tart—oh, la me! Oh, la me! Some folks will waken up some day and find they can't fool Mr. Jay!"
        - id: ch01-b02
          speaker: narrator
          text: Sammy Jay was very pleased with himself. He had learned all about Peter Rabbit's plan. Peter meant to surprise Unc' Billy Possum with a party when his family arrived from Ol' Virginny. Everyone among the little forest and meadow people had been invited except Sammy, his cousin Blacky the Crow, Reddy Fox, and Shadow the Weasel. Each guest was supposed to bring something good to eat. Sammy smacked his lips at the thought. Then he looked up at jolly, round, red Mr. Sun and winked.
        - id: ch01-b03
          speaker: narrator
          text: No greater scamps lived anywhere on the Green Meadows or in the Green Forest than those four. Worse still, they were dishonest. They stole whenever they had the chance, and they were always trying to get others into trouble. That was why Peter Rabbit had left them out of his plans for Unc' Billy's surprise party.
        - id: ch01-b04
          speaker: narrator
          text: Sammy gathered the other three beneath the Lone Pine. He told them about Peter's plan and made sure they knew they had not been invited. Blacky, Reddy, and Shadow grew very angry. Nobody likes being left out of a good time. The more Sammy talked, the angrier they became, and deep inside, Sammy chuckled. He already had a plan. If the others stayed angry, they were more likely to help him.
        - id: ch01-b05
          speaker: reddy_fox
          text: "Just wait until I get hold of Peter Rabbit!"
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: Reddy showed every one of his teeth. For the moment, he forgot that all his cleverness had never helped him catch Peter Rabbit.
        - id: ch01-b07
          speaker: narrator
          text: Blacky the Crow scratched his head and thought for a while.
        - id: ch01-b08
          speaker: blacky_crow
          text: "We could ruin the surprise. All we have to do is tell Unc' Billy about the party before it happens."
        - id: ch01-b09
          speaker: narrator
          text: Sammy winked at each of them. He cleared his throat and checked all around to be certain that nobody else was nearby. Then he leaned toward them and whispered.
        - id: ch01-b10
          speaker: sammy_jay
          text: "Let's invite ourselves to that party."
        - id: ch01-b11
          speakers: [blacky_crow, reddy_fox, shadow_weasel]
          ensemble: chorus
          text: "What are you talking about?"
          emotion: surprised
        - id: ch01-b12
          speaker: sammy_jay
          text: "I mean exactly that. We'll be the real surprise. Before the party starts, all of you hide close by. Wait until everyone has arrived with the good things to eat. Then I'll fly over and shout, ‘Bowser the Hound is coming!’ Everyone will run away, and all that food will be ours."
        - id: ch01-b13
          speaker: blacky_crow
          text: "Haw, haw, haw! That's exactly what we'll do! We'll all be there."
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: The four little scamps shook hands and went their separate ways. As they crossed the Green Meadows, Sammy's voice drifted back toward the Lone Pine. He was singing again, though his singing voice was very poor.
        - id: ch01-b15
          speaker: sammy_jay
          text: "Some folks think they're mighty smart—oh, la me! Oh, la me! Like the knave who stole the tart—oh, la me! Oh, la me! Some folks will waken up some day and find they can't fool Mr. Jay!"
        - id: ch01-b16
          speaker: mr_toad
          text: "Is that so? Well now, I surely want to know."
        - id: ch01-b17
          speaker: narrator
          text: Old Mr. Toad crawled out from beneath the very piece of bark where Sammy had been sitting while he told his plan. Then Mr. Toad gave jolly, round, red Mr. Sun a slow, solemn wink and set off to find Peter Rabbit.
