audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵自得，盘算时透着狡猾
        timbre: 清脆明亮
        pace: 轻快灵活
        pitch: 中高音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 狡猾得意，说话时总带着几分刻薄
        timbre: 尖细灵活
        pace: 轻快
        pitch: 中高音
    blacky_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 粗声爽快，起坏心思时毫不遮掩
        timbre: 粗哑响亮
        pace: 明快
        pitch: 中低音
    shadow_weasel:
      display_name: 黄鼠狼黑影
      tts:
        delivery: 阴沉机警，话不多却处处戒备
        timbre: 细冷紧实
        pace: 稍快
        pitch: 中高音
    old_mr_toad:
      display_name: 蟾蜍老先生
      tts:
        delivery: 老成稳重，慢声慢气中透着明白
        timbre: 低沉沙哑
        pace: 缓慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 第七章　四个小坏蛋密谋捣乱
      blocks:
        - id: ch01-b01
          speaker: sammy_jay
          text: 有人自以为顶聪明，哎呀呀，哎呀呀！就像那偷馅饼的坏蛋一个样，哎呀呀，哎呀呀！总有一天梦醒来，才知骗不过松鸦先生的眼！
        - id: ch01-b02
          speaker: narrator
          text: 松鸦萨米得意极了。彼得兔准备等负鼠比利大叔一家从老弗吉尼亚赶来，就为他们办一场惊喜聚会。这个计划，萨米已经打听得清清楚楚。他还知道，森林和草地上的小居民全都收到了邀请，只有他、表哥乌鸦布莱基、狐狸雷迪和黄鼠狼黑影被落下了。受邀的人还会各自带来一样好吃的东西。
        - id: ch01-b03
          speaker: narrator
          text: 一想到那些吃的，萨米便咂了咂嘴。他抬头看看那位快活、滚圆、红彤彤的太阳公公，还冲他眨了眨眼。
        - id: ch01-b04
          speaker: narrator
          text: 绿草地和绿森林里，再没有谁比这四个家伙更会捣蛋了。更糟的是，他们都不老实。一有机会就偷东西，还总想让别人惹上麻烦。彼得正是因为这个，才没请他们参加负鼠比利大叔的惊喜聚会。
        - id: ch01-b05
          speaker: narrator
          text: 萨米把另外三个家伙叫到孤松树下，把彼得的计划和他们没受邀请的事全说了。布莱基、雷迪和黑影听完，个个气得不得了。谁愿意眼看着别人热闹，自己却被撇在外面呢？萨米越说，他们越气。可他们火气越大，萨米心里笑得越欢。
        - id: ch01-b06
          speaker: narrator
          text: 原来，萨米早就想好了一条计策。他知道，另外三个家伙气得越厉害，就越有可能帮他把这个主意变成真的。
        - id: ch01-b07
          speaker: reddy_fox
          text: 你们等着！等我逮住彼得兔，看我怎么收拾他！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 雷迪龇出满嘴牙齿。他早把一件事忘了。尽管他总觉得自己聪明，却一次也没抓住过彼得兔。
        - id: ch01-b09
          speaker: narrator
          text: 布莱基挠了挠头，认真想了一阵。
        - id: ch01-b10
          speaker: blacky_crow
          text: 咱们提前把计划告诉负鼠比利大叔，彼得的惊喜不就全泡汤了吗？
        - id: ch01-b11
          speaker: narrator
          text: 萨米朝三个家伙一个个眨过眼。他清清嗓子，又向四周看了看，确定附近没有别人，才探过身去，压低了声音。
        - id: ch01-b12
          speaker: sammy_jay
          text: 咱们不等人请，自己去参加聚会。
        - id: ch01-b13
          speakers: [blacky_crow, reddy_fox, shadow_weasel]
          ensemble: chorus
          text: 你这话是什么意思？
          emotion: surprised
        - id: ch01-b14
          speaker: sammy_jay
          text: 就是字面上的意思。到时候，真正叫他们大吃一惊的是我们。
        - id: ch01-b15
          speaker: sammy_jay
          text: 聚会开始以前，你们藏在附近。等人全到齐了，好吃的也全摆出来了，我就从空中飞过来，大喊一声：“猎犬鲍泽来啦！”
        - id: ch01-b16
          speaker: sammy_jay
          text: 大伙儿一听，当然会逃得干干净净。留下的那些好东西，就全归我们吃了。
        - id: ch01-b17
          speaker: blacky_crow
          text: 哈！哈！哈！这办法太妙啦！我们全都去！
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: 四个小坏蛋互相握了握手，这事就算说定了，随后他们各自离开。等他们走过绿草地，萨米的歌声还一路飘回孤松树下。虽然他的歌喉实在不怎么样，他还是唱得十分起劲。
        - id: ch01-b19
          speaker: sammy_jay
          text: 有人自以为顶聪明，哎呀呀，哎呀呀！就像那偷馅饼的坏蛋一个样，哎呀呀，哎呀呀！总有一天梦醒来，才知骗不过松鸦先生的眼！
          emotion: happy
        - id: ch01-b20
          speaker: old_mr_toad
          text: 真是这样吗？当真吗？我倒要弄个明白。
        - id: ch01-b21
          speaker: narrator
          text: 原来，蟾蜍老先生一直躲在一块树皮底下，而萨米讲述计策时，恰好就坐在那块树皮上。蟾蜍老先生这才慢慢爬出来，庄重地朝快活、滚圆、红彤彤的太阳公公眨了眨眼，动身去找彼得兔了。
