  chapters:
    - id: ch01
      title: "XVI. WHY UNC' BILLY POSSUM DIDN'T GO HOME"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Unc' Billy Possum had a very good reason for staying away from home. It really was a good one. Even old Mrs. Possum would have agreed, if only she had known. But she knew nothing about it. She sat at home in the big hollow tree in the Green Forest, worrying herself almost sick. Unc' Billy had not come back, and she had no idea what might have happened to him.
        - id: ch01-b02
          speaker: narrator
          text: At times, Unc' Billy wished he were back in that old hollow tree. At other times, he was glad to be exactly where he was. When he thought about what might happen if someone found him, little shivers of fear ran through him. Then he would bite a hole in the end of a freshly laid egg and suck out what was inside. A pleasant little tickle would run through him instead.
        - id: ch01-b03
          speaker: narrator
          text: Now, Unc' Billy was very, very crafty. He had spotted Jimmy Skunk's tracks leading straight up to the henhouse. So he placed each foot as carefully as he could inside Jimmy's prints. That way, Farmer Brown's boy might believe Jimmy Skunk had been the henhouse's only visitor. Yet with all that craftiness, Unc' Billy forgot one thing. Yes, sir, he forgot it completely. He was concentrating so hard on those footprints that he forgot to hold up his smooth, useful old tail. He let it trail right across the snow.
        - id: ch01-b04
          speaker: narrator
          text: Once he was safely inside the henhouse, Unc' Billy hurried from nest to nest. Eggs were everywhere. Nothing he had ever seen had looked even half as good. He ate and ate and ate, until he could not manage one more egg. A full stomach often makes a head sleepy, and Unc' Billy knew he ought to hurry home as fast as he could. But he did not go. No, sir, he did not. The henhouse was warm, and some of those hay-filled nests looked wonderfully comfortable. Besides, the long walk from the Green Forest had tired him out. He had walked so little that winter that he was out of practice. Why not have one teeny, weeny nap before heading home?
        - id: ch01-b05
          speaker: narrator
          text: Unc' Billy climbed to the final nest in the highest row, tucked far up in a dark corner. No one had used it for a long time, but it was full of soft, pleasant hay. He curled himself into the nest, gave a great sigh of contentment, and closed his eyes for that teeny, weeny nap. He did not open them again until an angry voice sounded very close by. Unc' Billy peeped out. It was broad daylight. Just below him stood Farmer Brown's boy, staring at all the empty eggshells Unc' Billy had left behind. The boy was angry. Yes, indeed, he was very, very angry. Unc' Billy shivered as he listened. Then he nestled under the hay until he was hidden from sight.
