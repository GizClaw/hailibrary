audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
  chapters:
    - id: ch01
      title: 没有回家的理由
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 比利大叔没有回家，理由可充分得很。要是负鼠老太太知道了，连她也会这么想。可她什么都不知道，只能守在绿森林那棵大空心树里的家中。比利大叔一直不回来，也不知道出了什么事，她心里实在担心得几乎病倒。
        - id: ch01-b02
          speaker: narrator
          text: 比利大叔呢，一会儿巴不得已经回到老空心树里，一会儿又庆幸自己还待在这里。想到万一被人发现，不知道会落得什么下场，他就吓得浑身一阵阵发抖。可他在刚下的鸡蛋上咬开一个洞，把里面的蛋液吸出来时，又觉得一股痒酥酥的快活流遍全身。
    - id: ch02
      title: 雪地上的尾巴印
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 比利大叔狡猾得很。他看见臭鼬吉米的脚印大大方方地通向鸡舍，就踩着那些脚印，小心地一步步往前走。这样一来，布朗农场主家的男孩就会以为，到过鸡舍的只有吉米。
        - id: ch02-b02
          speaker: narrator
          text: 可比利大叔再狡猾，还是漏掉了一件事。是的，先生，他把这件事忘得一干二净。他只顾着踩准吉米的脚印，忘了抬起自己那条又光滑又好用的老尾巴，就让它一路拖过雪地。
        - id: ch02-b03
          speaker: narrator
          text: 平安进了鸡舍以后，比利大叔赶紧从这个鸡窝奔到那个鸡窝。鸡蛋到处都是。看着眼前这些蛋，他觉得以前见过的任何东西，都没有它们一半诱人。他吃了又吃，直到再也塞不下一枚。
        - id: ch02-b04
          speaker: narrator
          text: 肚子吃饱了，脑袋往往就要犯困。比利大叔明明知道，自己该马上赶回家，可他没有。没有，先生，他就是没照办。鸡舍暖烘烘的，还有几个铺着干草、再舒服不过的鸡窝。他从绿森林一路走来，已经累了。这个冬天没怎么走动，两条腿也有点生疏。那么，回家以前，何不先打一个小小的、短短的盹儿呢？
    - id: ch03
      title: 醒来时天已大亮
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 比利大叔爬上最顶排的最后一个鸡窝。它高高地藏在昏暗的角落里，已经很久没有谁用过了，里面却铺满了柔软舒服的干草。他蜷起身子，心满意足地长叹一声，闭上眼睛，开始打那个小小的、短短的盹儿。
        - id: ch03-b02
          speaker: narrator
          text: 等他再次睁开眼睛，一个愤怒的声音已经在近旁响了起来。他偷偷往外一瞧，天早就大亮了。布朗农场主家的男孩就在下面，正看着比利大叔留下的空蛋壳。男孩生气了。是的，他当真气坏了。
        - id: ch03-b03
          speaker: narrator
          text: 比利大叔听着那个愤怒的声音，浑身直打哆嗦。他赶紧缩进鸡窝的干草底下，把自己藏得严严实实。
