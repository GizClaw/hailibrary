audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gently rustic
        pace: measured
        pitch: medium
    unc_billy:
      display_name: Unc' Billy Possum
      tts:
        delivery: easygoing and expressive with a gentle Southern flavor
        timbre: warm and slightly raspy
        pace: relaxed
        pitch: medium-low
    happy_jack:
      display_name: Happy Jack Squirrel
      tts:
        delivery: quick and lively with bright, direct expression
        timbre: clear and youthful
        pace: brisk
        pitch: medium-high
    mrs_possum:
      display_name: Mrs. Possum
      tts:
        delivery: practical and firmly outspoken
        timbre: warm and slightly husky
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: "News for Mrs. Possum"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Happy Jack Squirrel frisked through the snow toward Unc' Billy Possum's home in the big hollow tree. He had news for Mrs. Possum. Unc' Billy was safe in another hollow tree at the edge of the Green Forest. But he did not dare come home, because his footprints would show in the snow.
        - id: ch01-b02
          speaker: narrator
          text: When Happy Jack arrived, he found Mrs. Possum worried and in a very bad temper. Unc' Billy had been gone much longer than usual, and she had no idea what had happened to him.
        - id: ch01-b03
          speaker: narrator
          text: Of course, she felt greatly relieved when she heard he was safe. She had feared that something dreadful had happened. But the moment she knew he was all right, she forgot how worried she had been. Now she could think only of Unc' Billy going off for fresh eggs to fill his own stomach while she was left to care for herself and eight baby Possums.
        - id: ch01-b04
          speaker: mrs_possum
          text: Yo' tell Unc' Billy Ah don't care if he never comes home! Ah have more important things to worry about than a worthless, no-account Possum who won't look after his family!
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: She spoke crossly, then hurried inside. It was a cold day, and she had to make sure all eight little Possums were tucked properly into bed, where they had to stay to keep warm.
    - id: ch02
      title: "A Snowflake Brings an Idea"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Happy Jack chuckled as he started back with Mrs. Possum's message. He knew perfectly well that she did not mean what she had said. He knew Unc' Billy would understand that, too. Still, they both knew Unc' Billy would get a great scolding when he finally came home.
        - id: ch02-b02
          speaker: narrator
          text: Then, all at once, Happy Jack thought of a way for Unc' Billy to return without waiting for the snow to melt. That wait might have lasted a very long time, because deep snow covered the ground.
        - id: ch02-b03
          speaker: narrator
          text: And what do you suppose gave Happy Jack that idea? A tiny snowflake landed right on the end of his nose. Yes, sir, that one little snowflake gave Happy Jack Squirrel his bright idea.
        - id: ch02-b04
          speaker: narrator
          text: He rushed back to the hollow tree where Unc' Billy was hiding and scrambled up to the doorway.
        - id: ch02-b05
          speaker: happy_jack
          text: Hello, Unc' Billy! You can go home tonight!
          emotion: happy
    - id: ch03
      title: "Tracks in the Snow"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Unc' Billy Possum poked his head out through the doorway.
        - id: ch03-b02
          speaker: unc_billy
          text: What did yo' say, Brer Squirrel? The snow hasn't gone anywhere. Ah can see your tracks plain as day, and mine are bigger than yours.
        - id: ch03-b03
          speaker: happy_jack
          text: Just look up at the sky, Unc' Billy!
        - id: ch03-b04
          speaker: narrator
          text: Unc' Billy looked up. Dancing snowflakes filled the sky. They flew into his eyes and stuck to his whiskers. He shook his head with disgust.
        - id: ch03-b05
          speaker: unc_billy
          text: All Ah see is more snow, and yo' know Ah don't like snow! What are yo' getting at, Brer Squirrel?
          emotion: disgusted
        - id: ch03-b06
          speaker: narrator
          text: Happy Jack laughed.
        - id: ch03-b07
          speaker: happy_jack
          text: Why, it's easy, Unc' Billy! Wait until dark, then start for home. The snow will keep falling all night. By morning, every one of your tracks will be covered.
          emotion: happy
    - id: ch04
      title: "Unc' Billy Gets Home"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Unc' Billy broke into a grin.
        - id: ch04-b02
          speaker: unc_billy
          text: Ah believe yo' are right, Brer Squirrel. Ah surely do believe yo' are right!
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: And Happy Jack was right. Unc' Billy reached home safely that very night. The next morning, Farmer Brown's boy came into the Green Forest, but he could not find a single footprint anywhere.
        - id: ch04-b04
          speaker: narrator
          text: So Unc' Billy Possum learned that getting into trouble is easy, while getting out again can be very hard. And he is not the only one who has learned that lesson.
