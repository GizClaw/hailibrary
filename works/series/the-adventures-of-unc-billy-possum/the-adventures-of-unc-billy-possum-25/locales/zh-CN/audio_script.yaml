audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 慢悠悠又爱打趣，带着老弗吉尼亚乡音般的亲切腔调
        timbre: 粗暖松弛
        pace: 从容偏慢
        pitch: 中低音
    happy_jack_squirrel:
      display_name: 松鼠快乐杰克
      tts:
        delivery: 活泼爽快，兴奋时语调跳跃，生气时干脆有力
        timbre: 明亮轻巧
        pace: 轻快
        pitch: 中高音
    old_mrs_possum:
      display_name: 负鼠老太太
      tts:
        delivery: 慈爱精明，带着老弗吉尼亚乡音般的亲切腔调
        timbre: 温厚略带沙哑
        pace: 中等偏慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 松鼠快乐杰克的好主意
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 松鼠快乐杰克踩着雪，一路蹦蹦跳跳，赶往绿森林深处那棵大空心树。那是负鼠比利大叔的家。快乐杰克要去告诉负鼠老太太，比利大叔很安全，正待在绿森林边缘的另一棵空心树里。只是雪地会留下脚印，他还不敢回家。
        - id: ch01-b02
          speaker: narrator
          text: 快乐杰克找到负鼠老太太时，她正急得不得了，脾气也坏透了。比利大叔这次离家比往常久得多，她根本不知道他出了什么事。
        - id: ch01-b03
          speaker: narrator
          text: 听说比利大叔平安无事，她总算松了口气。先前，她一直怕他碰上了什么可怕的事。可现在一知道他没事，那些担心立刻全忘了。她只想着，比利大叔跑出去，是要把鲜鸡蛋装进自己的肚子，却把她留在家里，独自照看八只负鼠宝宝。
        - id: ch01-b04
          speaker: old_mrs_possum
          text: 你去告诉负鼠比利大叔，他爱回不回，哪怕永远不回来，俺也不在乎！俺要操心的事多着呢，才顾不上那个不中用、没出息的负鼠。他连自家人都不肯照管！
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: 负鼠老太太气呼呼地说完，赶紧进屋去了。她还得看看八只小负鼠有没有好好裹在被窝里。天冷极了，小家伙们只有躺在床上才能暖和。
        - id: ch01-b06
          speaker: narrator
          text: 快乐杰克动身回去传话，忍不住暗暗发笑。他清楚得很，负鼠老太太说的不是真心话，比利大叔听了也会明白。快乐杰克还知道，比利大叔自己也明白，等他回到家，一顿狠狠的数落可逃不掉。
        - id: ch01-b07
          speaker: narrator
          text: 就在这时，快乐杰克忽然想到一个办法。比利大叔不用一直等到雪化，也能回家了。地上的积雪那么厚，要等它融化，说不定得等上很久。
        - id: ch01-b08
          speaker: narrator
          text: 你猜，是什么把这个主意送进了快乐杰克的脑袋？是一片小小的雪花，正好落在他的鼻尖上！是的，先生，给松鼠快乐杰克带来好主意的，就是那片小雪花。
        - id: ch01-b09
          speaker: narrator
          text: 他急忙赶回比利大叔藏身的空心树，几下爬到树洞门口。
        - id: ch01-b10
          speaker: happy_jack_squirrel
          text: 喂，比利大叔！今天晚上你就能回家啦！
        - id: ch01-b11
          speaker: narrator
          text: 负鼠比利大叔从洞口探出脑袋。
        - id: ch01-b12
          speaker: unc_billy_possum
          text: 你刚才说啥，松鼠兄弟？俺看雪还在地上呢。你的脚印这么清楚，俺的脚印又比你的大得多。
        - id: ch01-b13
          speaker: happy_jack_squirrel
          text: 比利大叔，你抬头瞧瞧天上！
        - id: ch01-b14
          speaker: narrator
          text: 比利大叔抬头一看，满天雪花正在飞舞。雪花扑进他的眼睛，又粘上他的胡须。他厌烦地摇了摇头。
        - id: ch01-b15
          speaker: unc_billy_possum
          text: 俺只瞧见雪下得更大了。你明知道俺不喜欢雪！松鼠兄弟，你究竟想说啥？
          emotion: disgusted
        - id: ch01-b16
          speaker: narrator
          text: 快乐杰克笑了起来。
        - id: ch01-b17
          speaker: happy_jack_squirrel
          text: 这不是再简单不过了吗，比利大叔？等天一黑，你就往家走。雪会下一整夜。到了早晨，你留下的脚印一个也看不见，雪花早就把它们全盖住啦！
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: 比利大叔咧开嘴笑了。
        - id: ch01-b19
          speaker: unc_billy_possum
          text: 俺看你说得对，松鼠兄弟。俺看你说得一点儿不错！
          emotion: happy
        - id: ch01-b20
          speaker: narrator
          text: 快乐杰克果然没有说错。就在当天夜里，比利大叔平平安安地回了家。第二天一早，布朗农场主家的男孩来到绿森林，到处都看不见半个脚印。
        - id: ch01-b21
          speaker: narrator
          text: 这一次，负鼠比利大叔明白了，惹上麻烦很容易，想摆脱麻烦却很难。不过，发现这个道理的可不只有他一个。
