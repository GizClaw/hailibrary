audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 狡猾得意，说话时总带着几分刻薄
        timbre: 尖细灵活
        pace: 轻快
        pitch: 中高音
    shadow_weasel:
      display_name: 黄鼠狼黑影
      tts:
        delivery: 阴沉机警，话不多却处处戒备
        timbre: 细冷紧实
        pace: 稍快
        pitch: 中高音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵自得，盘算时透着狡猾
        timbre: 清脆明亮
        pace: 轻快灵活
        pitch: 中高音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼机敏，笑起来坦率又顽皮
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 直率倔强，懒洋洋中带着粗朴的自信
        timbre: 浑厚结实
        pace: 稍缓
        pitch: 中低音
    danny_meadow_mouse:
      display_name: 草原鼠丹尼
      tts:
        delivery: 轻巧活泼，笑声里带着孩子气的快活
        timbre: 细小明亮
        pace: 轻快
        pitch: 高音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 憨厚随性，困倦时含混慵懒
        timbre: 圆润柔和
        pace: 中等偏慢
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 实在机灵，开口直截了当又不失关切
        timbre: 温厚清晰
        pace: 中等
        pitch: 中音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机灵随和，打趣时一本正经
        timbre: 清润灵巧
        pace: 中等偏快
        pitch: 中高音
    jumper_hare:
      display_name: 野兔蹦蹦
      tts:
        delivery: 自信爽朗，说起赛跑总是兴致勃勃
        timbre: 明亮舒展
        pace: 明快
        pitch: 中音
  chapters:
    - id: ch01
      title: 空心树下的盛宴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔和野兔蹦蹦那棵逃跑的卷心菜，这会儿正躺在地上，活像一个绿油油的巨型针插。大家越看越觉得好笑，每一个人都说，这简直是他们听过的最好笑的笑话。
        - id: ch01-b02
          speaker: narrator
          text: 臭鼬吉米洗过澡，又取来两枚鹅蛋，正一手夹着一枚往回走。藏在空心木头里的狐狸雷迪和黄鼠狼黑影看得一清二楚。黑影馋得直咂嘴，心里早就打定主意，要把那两枚蛋弄到自己手里。
        - id: ch01-b03
          speaker: narrator
          text: 不一会儿，彼得兔请来的绿森林和绿草地小居民全都到了负鼠比利大叔的空心树下。每一位客人都带来了一样好吃的。哎呀，地上摆开的那顿大餐，可真够丰盛！大家只等比利大叔回来。他去迎接从“老弗吉尼亚”赶来的家人了。
        - id: ch01-b04
          speaker: narrator
          text: 乌鸦布莱基藏在高高的松树顶上，一边偷看，一边暗笑。狐狸雷迪却越等越不耐烦。他没吃早饭，肚子早就饿坏了。那些好吃的，他躲在木头里既看得见，又闻得到，馋得肚子一刻也不肯安静。他巴不得松鸦萨米马上飞来，假喊猎犬鲍泽来了，把其他人全都吓走。
        - id: ch01-b05
          speaker: reddy_fox
          text: 我都快饿死了！松鸦萨米怎么还不快点儿来？
        - id: ch01-b06
          speaker: narrator
          text: 这时，他们发现彼得兔忙了起来。他从这位客人身边跳到那位客人身边，一个接一个地凑到耳边说悄悄话。
        - id: ch01-b07
          speaker: reddy_fox
          text: 彼得兔挨个儿跟他们嘀咕，到底在说什么？
    - id: ch02
      title: 木头里的囚犯
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 突然，空心木头尽头的亮光不见了。一阵古怪的沙沙声跟着响起，雷迪的脊梁骨从上到下直打寒战。原来，豪猪刺毛波奇背靠木头的一端坐下了。那声音，就是他长外套里上千根小尖刺发出来的。
        - id: ch02-b02
          speaker: narrator
          text: 这一下，狐狸雷迪和黄鼠狼黑影成了关在木头里的囚犯。因为这截空心木头，压根儿没有第二个出口。
        - id: ch02-b03
          speaker: shadow_weasel
          text: 没事。等松鸦萨米一喊猎犬鲍泽来了，刺毛波奇自然会走。
        - id: ch02-b04
          speaker: narrator
          text: 高高的松树顶上，乌鸦布莱基也在琢磨彼得说了什么。他用锐利的眼睛盯着下面。彼得每跟一位绿草地或绿森林的小居民说完悄悄话，那位客人都会笑起来。
        - id: ch02-b05
          speaker: narrator
          text: 松鸦萨米对这些事一点儿也不知道。过了一阵，他觉得客人该到齐了，就穿过绿森林飞来，装得好像根本不知道这里有聚会。
        - id: ch02-b06
          speaker: narrator
          text: 萨米的毛病虽多，却是绿森林里最好的哨兵之一。那双尖眼睛只要发现危险，他就会扯开嗓子报警。他爱偷东西，也爱恶作剧，常把大家的日子搅得不得安生，可一听见他的警报，谁都会停下来听。正因为这样，萨米认定自己的把戏准能搅散聚会。
        - id: ch02-b07
          speaker: narrator
          text: 一看见那些绿草地和绿森林的小居民，他立刻放开嗓门尖叫起来。
        - id: ch02-b08
          speaker: sammy_jay
          text: 快跑！快跑！快跑！猎犬鲍泽来啦！
        - id: ch02-b09
          speaker: narrator
          text: 谁也没有动。萨米一下弄糊涂了，简直不知道该怎么办，只好继续尖叫，装得像鲍泽已经到了附近。可是大家仍旧站在原地。萨米落到一棵高松树上，又摆出急得不得了的样子。
        - id: ch02-b10
          speaker: sammy_jay
          text: 鲍泽就快到了，你们再不跑可来不及啦！
    - id: ch03
      title: 谁也没有上当
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 你猜接下来怎么样了？所有人一下子都叫嚷起来。彼得兔先放声大笑。
        - id: ch03-b02
          speaker: peter_rabbit
          text: 哈！哈！哈！
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: 土拨鼠约翰尼也笑得响亮极了。
        - id: ch03-b04
          speaker: johnny_chuck
          text: 呵！呵！呵！
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: 草原鼠丹尼更是咯咯地笑个不停。
        - id: ch03-b06
          speaker: danny_meadow_mouse
          text: 嘻！嘻！嘻！
          emotion: happy
        - id: ch03-b07
          speaker: bobby_coon
          text: 萨米，鲍泽究竟什么时候到呀？
        - id: ch03-b08
          speaker: jimmy_skunk
          text: 你见到鲍泽，就告诉他我们全都在这儿等着。
        - id: ch03-b09
          speaker: jerry_muskrat
          text: 鲍泽跑到哪儿了？他是不是已经累得上气不接下气啦？
        - id: ch03-b10
          speaker: narrator
          text: 野兔蹦蹦把身子坐得笔直，也跟着开了口。
        - id: ch03-b11
          speaker: jumper_hare
          text: 要是鲍泽真来，我正好跟他赛一场跑。那才痛快呢！
        - id: ch03-b12
          speaker: narrator
          text: 松鸦萨米这下既不知道该怎么办，也不知道还能说什么。他飞过绿森林时，那副又恼火又扫兴的模样，恐怕任何一只松鸦都比不上。他不停地想，不停地想，又不停地想，怎么都不明白，彼得兔和朋友们怎么会知道鲍泽根本不在绿森林。
        - id: ch03-b13
          speaker: narrator
          text: 原来，蟾蜍老先生早就把萨米的计划全告诉了彼得。刚才彼得挨个儿说给大家听的，正是这个消息。
