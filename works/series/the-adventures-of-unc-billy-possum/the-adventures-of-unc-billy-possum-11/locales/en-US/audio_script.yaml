  chapters:
    - id: ch01
      title: "XI. REDDY FOX GOES HUNGRY"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit and Jumper the Hare's runaway cabbage lay there like a great green pincushion. Everyone thought it was the best joke they had ever seen. Jimmy Skunk had gone to take a bath and fetch two more eggs for Peter's party. From their hiding place inside a hollow log, Reddy Fox and Shadow the Weasel watched him return with a big goose egg under each arm. Shadow smacked his lips. He meant to take those eggs for himself.
        - id: ch01-b02
          speaker: narrator
          text: Soon, all the little forest and meadow people Peter had invited were gathered at the foot of Unc' Billy Possum's hollow tree. Each guest had brought something good to eat, and what a feast they spread out! There were good things everywhere they looked, but they were still waiting for Unc' Billy. He had gone to meet his family, who were coming up from Ol' Virginny.
        - id: ch01-b03
          speaker: narrator
          text: High in a tall pine tree, Blacky the Crow hid among the branches and chuckled as he watched. Down in the hollow log, Reddy was losing patience. He had missed breakfast, and now all that food was right before his eyes. He could see it. He could smell it. His empty stomach would not leave him alone. If only Sammy Jay would hurry and give the false warning that Bowser the Hound was coming. Then everyone else would run away.
        - id: ch01-b04
          speaker: reddy_fox
          text: "I'm so hungry I can hardly stand it. Why doesn't Sammy Jay hurry?"
        - id: ch01-b05
          speaker: narrator
          text: Just then, Reddy and Shadow saw Peter Rabbit bustling from one guest to another. At each stop, Peter leaned close and whispered into the guest's ear.
        - id: ch01-b06
          speaker: reddy_fox
          text: "What can Peter be telling everyone?"
        - id: ch01-b07
          speaker: narrator
          text: All at once, the light at the end of the log vanished. A strange rattling sent shivers all along Reddy's backbone. Prickly Porky the Porcupine had settled down with his back against the opening. The rattling came from the thousand little spears in his long coat. Reddy and Shadow were trapped. The hollow log had no other way out.
        - id: ch01-b08
          speaker: shadow_weasel
          text: "Don't worry. When Sammy shouts that Bowser is coming, he'll move away with all the others."
        - id: ch01-b09
          speaker: narrator
          text: Blacky the Crow had seen Peter whispering too, and he wondered what it meant. His sharp eyes followed Peter closely. Each time Peter spoke into someone's ear, that guest began to laugh.
        - id: ch01-b10
          speaker: narrator
          text: Sammy Jay knew nothing about any of this. After a while, when he was sure everyone had arrived, he flew through the Green Forest as though he knew nothing at all about Peter's party. Sammy had plenty of faults, but he was one of the forest's best watchmen. Whenever his sharp eyes spotted danger, he screamed as loudly as he could. He stole things, played tricks, and made life miserable for the others, but they always stopped to listen when he called out a warning. Sammy counted on that. He was sure his trick would send everyone running and break up the party.
        - id: ch01-b11
          speaker: narrator
          text: The moment Sammy saw the little meadow and forest people, he began shrieking at the top of his lungs.
        - id: ch01-b12
          speaker: sammy_jay
          text: "Run! Run for your lives! Bowser the Hound is coming!"
        - id: ch01-b13
          speaker: narrator
          text: Nobody moved. Sammy was so puzzled that he hardly knew what to do. Still, he kept shrieking as if Bowser were almost upon them. No one budged. At last Sammy landed in a tall pine and made himself look terribly excited.
        - id: ch01-b14
          speaker: sammy_jay
          text: "You'd better get away before Bowser reaches you!"
        - id: ch01-b15
          speaker: narrator
          text: And then, what do you think happened? Every guest burst out at once.
        - id: ch01-b16
          speaker: peter_rabbit
          text: "Ha, ha, ha!"
          emotion: happy
        - id: ch01-b17
          speaker: johnny_chuck
          text: "Ho, ho, ho!"
          emotion: happy
        - id: ch01-b18
          speaker: danny_meadow_mouse
          text: "Hee, hee, hee!"
          emotion: happy
        - id: ch01-b19
          speaker: bobby_coon
          text: "Exactly what time should we expect Bowser?"
        - id: ch01-b20
          speaker: jimmy_skunk
          text: "Please tell him we're all here waiting for him."
        - id: ch01-b21
          speaker: jerry_muskrat
          text: "Has poor Bowser run himself out of breath?"
        - id: ch01-b22
          speaker: narrator
          text: Jumper the Hare sat up as straight as he could.
        - id: ch01-b23
          speaker: jumper_hare
          text: "I'd be delighted to race Bowser the Hound!"
        - id: ch01-b24
          speaker: narrator
          text: Sammy Jay had no idea what to say or do. No more disgusted-looking Jay had ever flown through the Green Forest. Again and again, he tried to understand how Peter and his friends could possibly know that Bowser was nowhere in the forest. He could not make sense of it. The answer was simple. Old Mr. Toad had told Peter all about Sammy's plan, and that was the secret Peter had whispered to every guest.
