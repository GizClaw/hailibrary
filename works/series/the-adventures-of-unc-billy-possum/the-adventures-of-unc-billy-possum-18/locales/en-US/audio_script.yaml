audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gently rustic
        pace: measured
        pitch: medium
    unc_billy:
      display_name: Unc' Billy Possum
      tts:
        delivery: easygoing and expressive with a gentle Southern flavor
        timbre: warm and slightly raspy
        pace: relaxed
        pitch: medium-low
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: practical and confident
        timbre: clear and youthful
        pace: steady
        pitch: medium
  chapters:
    - id: ch01
      title: "A Long Way Home"
      blocks:
        - id: ch01-b01
          speaker: unc_billy
          text: >-
            Mah home is in a holler tree. It's a long way home! Ah wish Ah was there, but here Ah be. It's a long way home! If only Ah'd been content, instead of getting into mischief, Ah wouldn't have cause to repent. It's a long way home!
          emotion: sad
        - id: ch01-b02
          speaker: narrator
          text: Unc' Billy Possum was curled beneath the hay in the highest nest, tucked into the darkest corner of Farmer Brown's henhouse. He did not dare sleep because Farmer Brown's boy might find him. And he wanted to learn what the boy was doing. So Billy kept still under the hay and peeped out from his hiding place.
        - id: ch01-b03
          speaker: narrator
          text: He peeked out and watched. The boy certainly was busy. Can you guess what he was doing? Unc' Billy could. Yes, sir, he knew exactly what was happening. Farmer Brown's boy was setting traps.
    - id: ch02
      title: "The Joke on Farmer Brown's Boy"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Unc' Billy's eyes began to twinkle as he watched. He knew every one of those traps was meant for him. But he had seen exactly where the boy put each one. He could avoid them all now, so of course he was not afraid.
        - id: ch02-b02
          speaker: narrator
          text: To Billy, it was a wonderful joke. There he was, watching Farmer Brown's boy set the traps one by one. Meanwhile, the boy thought he had hidden them so cleverly that no one could possibly find a trap without stepping into it and getting caught.
        - id: ch02-b03
          speaker: farmer_browns_boy
          text: There! Now I'd like to see anything get inside this henhouse without being caught!
        - id: ch02-b04
          speaker: narrator
          text: Unc' Billy nearly laughed out loud. Yes, sir, he nearly did. Farmer Brown's boy had gone to all that trouble to catch Billy coming into the henhouse. And all the while, Billy was already inside.
    - id: ch03
      title: "The Prisoner"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Farmer Brown's boy shut the henhouse door and walked away, whistling. Unc' Billy laughed softly to himself.
        - id: ch03-b02
          speaker: unc_billy
          text: Ho, ho, ho! Ha, ha, ha! Hee, hee!
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: Then, right in the middle of his laugh, he stopped short. A thought had struck him, and it was not funny at all. Farmer Brown's boy had placed traps at every opening of the henhouse. No one outside could come in without being caught. But that meant no one already inside could get out without being caught, either.
        - id: ch03-b04
          speaker: narrator
          text: So the joke was not on Farmer Brown's boy after all. It was on Unc' Billy Possum. Billy could not see anything funny about that. He was a prisoner in Farmer Brown's henhouse, and he had no idea how he would ever escape.
        - id: ch03-b05
          speaker: unc_billy
          text: It's a long way home.
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: He said it mournfully as he peered through a crack toward the Green Forest.
