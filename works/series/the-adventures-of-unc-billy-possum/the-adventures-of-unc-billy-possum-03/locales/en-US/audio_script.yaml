  chapters:
    - id: ch01
      title: "III. UNC' BILLY POSSUM SENDS FOR HIS FAMILY"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Word soon spread through the Green Forest and across the Green Meadows. Unc' Billy Possum was not dead after all. He was back in his hollow tree, and nearly everyone hurried over to pay him a visit. Everyone, that is, except Reddy Fox.
        - id: ch01-b02
          speaker: narrator
          text: Unc' Billy and his partner, Jimmy Skunk, told each visitor how Reddy had mistaken Unc' Billy for a ghost. Reddy had been so frightened that he ran as fast as his legs could carry him. Then Unc' Billy described how Reddy had sat beneath the hollow tree and tried to sing for joy because he thought Unc' Billy was dead. Unc' Billy grinned and sang Reddy's song in a funny, cracked voice. The little people of the forest and meadows laughed until their sides hurt.
        - id: ch01-b03
          speaker: narrator
          text: After that, whenever one of them spotted Reddy from a safe distance, a teasing call rang out.
        - id: ch01-b04
          speaker: forest_neighbor
          text: "Old Bill Possum has gone away! Old Bill Possum is gone for good!"
        - id: ch01-b05
          speaker: narrator
          text: Soon Reddy stopped coming down to the Green Meadows in daylight. At night, he kept out of everyone's way whenever he could. He even avoided his old friend Bobby Coon. And now Reddy hated Unc' Billy more than ever.
        - id: ch01-b06
          speaker: narrator
          text: Unc' Billy did not care one bit. All the other little people thought he was the cleverest among them because he had fooled Bowser the Hound and Farmer Brown's boy. He liked his neighbors, and he liked the Green Forest. So he decided he would stay right there.
        - id: ch01-b07
          speaker: narrator
          text: Yet even with so many friends around him, Unc' Billy felt lonely. The longer he stayed, the worse that loneliness became. He wanted the family he had left far away in Ol' Virginny. At last, he told Jimmy Skunk all about it. For once, Unc' Billy forgot how to grin. Great big tears rolled down as he wept from loneliness.
        - id: ch01-b08
          speaker: unc_billy_possum
          text: "Ah reckon Ah'll have to go back to Ol' Virginny. Ah surely do."
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: Jimmy Skunk fell deep into thought. Since he and Unc' Billy had become partners, Jimmy had eaten more eggs than ever before in his life. Now Unc' Billy was talking about leaving. Jimmy thought as hard as he could. Then an idea came to him.
        - id: ch01-b10
          speaker: jimmy_skunk
          text: "Why don't you ask your family to come live here with you in the Green Forest, Uncle Billy?"
        - id: ch01-b11
          speaker: narrator
          text: Unc' Billy stopped crying and looked up sharply with his two little eyes.
        - id: ch01-b12
          speaker: unc_billy_possum
          text: "But how do yo'all reckon Ah can get a message to them?"
        - id: ch01-b13
          speaker: narrator
          text: Jimmy scratched his head.
        - id: ch01-b14
          speaker: jimmy_skunk
          text: "Mr. Skimmer the Swallow is getting ready to fly South. Maybe he'll carry your message to your family."
        - id: ch01-b15
          speaker: narrator
          text: Unc' Billy wiped his eyes and cried out at once.
        - id: ch01-b16
          speaker: unc_billy_possum
          text: "That's just the answer! Thank yo', Sah. Ah truly do thank yo'. Ah'll go see Mistah Skimmer right now!"
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: Without another word, Unc' Billy Possum started down the Crooked Little Path toward the Green Meadows to look for Skimmer the Swallow.
