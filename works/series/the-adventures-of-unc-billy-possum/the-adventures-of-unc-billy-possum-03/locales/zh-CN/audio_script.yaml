audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 慢悠悠又爱打趣，带着老弗吉尼亚乡音般的亲切腔调
        timbre: 粗暖松弛
        pace: 从容偏慢
        pitch: 中低音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 实在机灵，开口直截了当又不失关切
        timbre: 温厚清晰
        pace: 中等
        pitch: 中音
    forest_neighbor:
      display_name: 森林邻居
      tts:
        delivery: 爱热闹，逗弄狐狸时透着顽皮
        timbre: 明亮轻巧
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三章　负鼠比利大叔捎信接家人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 负鼠比利大叔根本没死。他已经回到绿森林里的空心树了。这个消息很快传遍绿森林，又一路传到绿草地。大伙儿都赶来问候，唯独狐狸雷迪没有露面。
        - id: ch01-b02
          speaker: narrator
          text: 每来一位客人，比利大叔和搭档臭鼬吉米就要讲上一遍。雷迪把比利大叔当成了鬼，差点活活吓死，最后撒开四条腿，没命地逃走。
        - id: ch01-b03
          speaker: narrator
          text: 比利大叔咧着嘴，还说起雷迪怎样坐在空心树底下，因为他死了而高兴得想唱歌。说到这里，比利大叔便学着雷迪，用滑稽的破嗓子，把那支歌唱给大伙儿听。
        - id: ch01-b04
          speaker: unc_billy_possum
          text: 老比利负鼠先走一步！老比利负鼠从此再无！
        - id: ch01-b05
          speaker: narrator
          text: 绿森林和绿草地的小居民听了，一个个笑得肚子都疼了。
        - id: ch01-b06
          speaker: narrator
          text: 从那以后，只要有人远远瞧见雷迪，知道他靠不过来，就会扯开嗓子喊。
        - id: ch01-b07
          speaker: forest_neighbor
          text: 老比利负鼠先走一步！老比利负鼠从此再无！
        - id: ch01-b08
          speaker: narrator
          text: 后来，雷迪白天再也不去绿草地了。到了夜里，他也尽量躲着别人，连老朋友浣熊博比都不愿碰见。当然，他比从前更恨负鼠比利大叔了。
        - id: ch01-b09
          speaker: narrator
          text: 比利大叔却一点也不在乎。绿森林和绿草地的小居民都觉得，他能骗过猎犬鲍泽和农夫布朗家的男孩，一定是大伙儿当中最聪明的一个。
        - id: ch01-b10
          speaker: narrator
          text: 比利大叔喜欢这里的邻居，也喜欢绿森林。他拿定了主意，往后就住在这里。
        - id: ch01-b11
          speaker: narrator
          text: 可是，身边有这么多朋友，比利大叔心里还是孤单。他住得越久，就越寂寞。他想念自己的家人，想念那些被他留在遥远的“老弗吉尼亚”的亲人。
        - id: ch01-b12
          speaker: narrator
          text: 最后，比利大叔把心事全告诉了臭鼬吉米。这一回，他连怎么咧嘴笑都忘了。是的，先生，他只顾掉眼泪，一颗颗大泪珠，都是因为太寂寞了。
        - id: ch01-b13
          speaker: unc_billy_possum
          text: 俺看，俺非得回老弗吉尼亚不可了。俺真得回去。
          emotion: sad
        - id: ch01-b14
          speaker: narrator
          text: 臭鼬吉米认真想了起来。自从跟比利大叔搭伙，他这辈子还从没吃过这么多鸡蛋。现在，比利大叔却说要离开。吉米想啊想，终于有了一个好主意。
        - id: ch01-b15
          speaker: jimmy_skunk
          text: 比利大叔，你怎么不捎个信，请家里人搬到绿森林，跟你住在一起呢？
        - id: ch01-b16
          speaker: narrator
          text: 比利大叔马上不哭了。他抬起两只小眼睛，直直看着吉米。
        - id: ch01-b17
          speaker: unc_billy_possum
          text: 可是，俺拿什么办法把话捎给他们呢？
        - id: ch01-b18
          speaker: narrator
          text: 吉米挠了挠头。
        - id: ch01-b19
          speaker: jimmy_skunk
          text: 燕子斯基默先生不是正要往南方去吗？也许他肯替你给家里捎个信。
        - id: ch01-b20
          speaker: narrator
          text: 比利大叔一听，叫了起来。他赶紧擦干眼泪。
        - id: ch01-b21
          speaker: unc_billy_possum
          text: 这可正是俺要的办法！谢谢您，先生，俺是真心谢您。俺马上就去找斯基默先生。
        - id: ch01-b22
          speaker: narrator
          text: 话一说完，负鼠比利大叔就沿着弯弯曲曲的小径，朝绿草地走去。他要去找燕子斯基默。
