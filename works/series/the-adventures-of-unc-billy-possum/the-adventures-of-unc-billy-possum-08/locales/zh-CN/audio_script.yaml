audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
  chapters:
    - id: ch01
      title: 第八章　彼得兔传出消息
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那天早晨美丽极了。大家都这么说，而大家都这么说的事，通常不会有错。彼得兔更是笑得嘴都快咧到耳根了。他顺着孤零零小径又蹦又跳，一直来到绿草地上等候。
        - id: ch01-b02
          speaker: narrator
          text: 西风妈妈从紫山上下来，把大口袋倒过来一抖，快活的小风儿们便呼啦一下全滚了出来，准备各自去玩。可他们还没来得及跑开，彼得就把他们叫住了，挨个儿贴着耳朵说了几句悄悄话。
        - id: ch01-b03
          speaker: narrator
          text: 小风儿们一个接一个，跳着舞穿过绿草地，把消息送往四面八方。今天，彼得要为负鼠比利大叔办惊喜聚会。就在这个早晨，比利大叔的家人会从遥远的老弗吉尼亚赶来。
        - id: ch01-b04
          speaker: narrator
          text: 松鸦萨米那天起得特别早。他那双尖眼睛很快就发现，彼得正在派小风儿们四处传信。萨米的脑筋跟眼睛一样敏锐。这样的脑筋，你知道，实在很难瞒得过去。
        - id: ch01-b05
          speaker: narrator
          text: 萨米立刻猜到，小风儿们为什么忙成这样。不过，他没有马上动身，只坐在那里等着，仔细听着。过了一会儿，负鼠比利大叔的树洞附近响起一长串“哒哒哒哒”。那是啄木鸟鼓手敲出来的。
        - id: ch01-b06
          speaker: narrator
          text: 这下萨米全明白了。彼得的聚会就在今天。他咧嘴一笑，急忙去找乌鸦布莱基、狐狸雷迪和黄鼠狼黑影。
        - id: ch01-b07
          speaker: narrator
          text: 狐狸雷迪还赖在床上。听见萨米到了门口，他赶紧翻身下床，连早饭也没吃。反正他早就打定主意，到了聚会上，能吃多少就吃多少。
        - id: ch01-b08
          speaker: narrator
          text: 雷迪匆匆赶到聚会地点，放轻脚步，一点点溜近。确定四周没人之后，他钻进一根一头敞开的空心木头，在里面伸开身子，让自己躺得尽量舒服。
        - id: ch01-b09
          speaker: narrator
          text: 没过多久，黄鼠狼黑影也钻了进来。两个家伙躲在木头里，一边等，一边低声嘀咕，还不时偷偷发笑。
        - id: ch01-b10
          speaker: narrator
          text: 他们知道，乌鸦布莱基正藏在一棵高大松树的树梢上。那个位置很安全，周围发生什么，他都能看得清清楚楚。
        - id: ch01-b11
          speaker: narrator
          text: 松鸦萨米也没闲着。他飞过绿草地，又穿过绿森林，看上去只是在忙自己的事，其实两只眼睛始终盯着彼得的聚会准备。
        - id: ch01-b12
          speaker: narrator
          text: 附近还有一棵树。树顶上，豪猪刺毛波奇正在吃早饭。树脚下，蟾蜍老先生坐在那里，困得脑袋一点一点的。萨米看见了这位老先生，却半点也没有起疑。
        - id: ch01-b13
          speaker: narrator
          text: 萨米虽然精明，却让蟾蜍老先生那副老实无害的模样骗过去了。他哪里知道，自己打的那些坏主意，蟾蜍老先生早已全都听见了。
