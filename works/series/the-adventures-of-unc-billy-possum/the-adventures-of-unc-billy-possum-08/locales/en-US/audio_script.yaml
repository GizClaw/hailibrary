  chapters:
    - id: ch01
      title: "VIII. PETER RABBIT SENDS OUT WORD"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was a beautiful morning. Everybody said so, and when everybody says a thing, it usually is so. Peter Rabbit wore the broadest smile you could imagine. He hopped and skipped all the way down the Lone Little Path and out onto the Green Meadows. There he waited for Old Mother West Wind to come down from the Purple Hills. She turned her big bag upside down and tumbled out all her children, the Merry Little Breezes, so they could play. Before they could run off, Peter stopped them. He whispered to each one in turn. Then every Breeze danced away across the Green Meadows, carrying the news. This was the day of Peter Rabbit's surprise party for Unc' Billy Possum. Unc' Billy's family would arrive that very morning, all the way from Ol' Virginny.
        - id: ch01-b02
          speaker: narrator
          text: Sammy Jay had gotten up very early that morning. Almost at once, his sharp eyes caught sight of Peter sending the Merry Little Breezes on their way. Sammy's wits were every bit as sharp as his eyes, and sharp wits are very hard to fool. He guessed right away why the Breezes were in such a hurry. Still, he perched there to watch and listen. Before long, Drummer the Woodpecker began a long rat-a-tat-tat near Unc' Billy Possum's hollow tree. Now Sammy was certain. This had to be the day of Peter Rabbit's party. With a grin, he hurried away to find Blacky the Crow, Reddy Fox, and Shadow the Weasel.
        - id: ch01-b03
          speaker: narrator
          text: Reddy Fox was still in bed. But the moment he heard Sammy Jay at his door, he jumped up in a hurry. Reddy didn't even stop for breakfast. He meant to eat all he could at the party. Off he went to the place where the party would be held. He crept closer very carefully. Once he was sure no one was around, he crawled inside a hollow log with one end open. There he stretched out and settled himself as comfortably as he could.
        - id: ch01-b04
          speaker: narrator
          text: Before long, Shadow the Weasel slipped into the hollow log beside Reddy Fox. The two of them whispered and chuckled as they waited. They knew Blacky the Crow was safely hidden at the top of a tall pine, where he could watch everything that happened. Sammy Jay was flying over the Green Meadows and through the Green Forest. He made it look as though he was minding his own business, but all the while he was watching the preparations for Peter Rabbit's party. Prickly Porky the Porcupine was eating his breakfast high in a tree. Down at the foot of that same tree sat old Mr. Toad, sleepily nodding his head. Sammy Jay saw him there. Yet for all Sammy's cleverness, he never once suspected that innocent-looking old Mr. Toad. Sammy didn't know that Mr. Toad had overheard every one of his plans.
