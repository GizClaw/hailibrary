cover_prompt: |-
  A wordless cover scene at the snowy edge of the Green Forest in rural early-twentieth-century America shows a gray-furred Virginia opossum peering from the doorway of a standing hollow tree while fresh snowflakes cling to his white face, dark ears, whiskers, and long bare tail. A lively gray squirrel with a great arched tail balances on a nearby branch and looks up toward the thickening snowfall as if sharing a bright idea. Below them, the opossum's earlier footprints cross the soft snow but are already disappearing beneath the new flakes. The falling snow that will hide the trail and let the stranded animal return to his family is the clear focal action, hopeful and adventurous rather than frightening. Use a wide child-height woodland view with bare branches, evergreens, and the distant Green Meadows in pale winter daylight, leaving broad calm sky at the top. Keep the animals anatomically believable and independent of film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
