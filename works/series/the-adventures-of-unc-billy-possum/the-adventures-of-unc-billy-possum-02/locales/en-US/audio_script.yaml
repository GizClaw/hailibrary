  chapters:
    - id: ch01
      title: "II. REDDY FOX THINKS HE SEES A GHOST"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Reddy Fox came down the Lone Little Path through the Green Forest, heading for the Green Meadows. He had brushed his red coat until it shone. His white waistcoat was spotless, and he held his big tail high to keep it clean. Reddy felt every bit as fine as he looked. He wanted to sing, but whenever he tried, his voice cracked. He was afraid someone might hear and laugh, and Reddy hated being laughed at more than almost anything.
        - id: ch01-b02
          speaker: narrator
          text: As he walked, Reddy chuckled over what he had seen the afternoon before. Farmer Brown's boy had caught Unc' Billy Possum in the henhouse and carried him away by the tail. Reddy had watched it happen with his own eyes. Of course Unc' Billy was dead. There could be no doubt about it. And yes, Reddy was glad he was gone.
        - id: ch01-b03
          speaker: narrator
          text: Unc' Billy had made far too many friends in the Green Forest and on the Green Meadows for Reddy's liking. Worse still, Unc' Billy had turned Reddy into everyone's laughingstock. He had dared Reddy to face Bowser the Hound. Then Unc' Billy had truly waited for Bowser while Reddy ran away.
        - id: ch01-b04
          speaker: narrator
          text: Then Reddy remembered that Unc' Billy's hollow tree was not far away. He thought he would wander over that way, just to have another look. There stood the old tree, with the doorway halfway up where Unc' Billy used to peer down at him and grin. Now it was Reddy's turn to grin.
        - id: ch01-b05
          speaker: narrator
          text: Reddy sat with his back against the bottom of the tree and crossed his legs. He looked all around to be sure no one was near. Then he began to sing in his terribly cracked voice.
        - id: ch01-b06
          speaker: reddy_fox
          text: "Old Bill Possum has gone before! Old Bill Possum is here no more! Bill was a scamp, sir, and Bill was a thief. Bill stole an egg, sir, and came to grief. It served him right, and now he's gone. Old Bill Possum died last night!"
        - id: ch01-b07
          speaker: unc_billy_possum
          text: "Very good, suh, very good. Ah surely do thank yo'all for that serenade."
        - id: ch01-b08
          speaker: narrator
          text: The voice seemed to come right out of the tree behind him. Reddy sprang up as though someone had jabbed him with a pin. Every hair on him stood straight up as he stared at Unc' Billy's doorway, and then his teeth began chattering with fear. Something was looking out through that doorway and grinning down at him. It looked for all the world like Unc' Billy himself.
        - id: ch01-b09
          speaker: reddy_fox
          text: "That must be his ghost!"
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: Reddy tucked his tail between his legs and raced up the Crooked Little Path as fast as he could go.
        - id: ch01-b11
          speaker: narrator
          text: Reddy never looked back. If he had, he might have seen Unc' Billy climb down from the hollow tree and shake hands with Jimmy Skunk, who had just come along.
        - id: ch01-b12
          speaker: unc_billy_possum
          text: "How did Ah manage it? Why, when Farmer Brown's boy caught me, Ah simply pretended Ah was dead. Of course he wouldn't kill a dead possum. He tossed me onto the chopping block and turned his back. Then Ah just naturally came alive again, and here Ah am."
        - id: ch01-b13
          speaker: narrator
          text: Unc' Billy Possum grinned wider than ever, and Jimmy Skunk grinned too.
