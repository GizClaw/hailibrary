audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 狡猾得意，说话时总带着几分刻薄
        timbre: 尖细灵活
        pace: 轻快
        pitch: 中高音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 慢悠悠又爱打趣，带着老弗吉尼亚乡音般的亲切腔调
        timbre: 粗暖松弛
        pace: 从容偏慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二章　狐狸雷迪以为撞见了鬼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 狐狸雷迪沿着绿森林里那条孤零零的小径一路走下来，要去绿草地。他把红毛梳得油光水亮，雪白的坎肩干干净净，还把大尾巴高高举着，生怕沾上泥。瞧他那副神气的模样，就知道他心里也得意极了。
        - id: ch01-b02
          speaker: narrator
          text: 雷迪真想唱支歌。可他每回一开口，嗓子就劈了叉。他可不敢让谁听见，免得别人笑他。要知道，雷迪最受不了的事，就是被人取笑。
        - id: ch01-b03
          speaker: narrator
          text: 他一边走，一边想着心事，还咯咯笑了起来。你猜他想到了什么？昨天下午，他亲眼看见农夫布朗家的男孩提着负鼠比利大叔的尾巴，把比利大叔带走了。他也知道，男孩是在鸡舍里逮住比利大叔的。这么说来，比利大叔当然已经死了，哪还会有错？
        - id: ch01-b04
          speaker: narrator
          text: 雷迪一想到这件事，就高兴得不得了。比利大叔在绿森林和绿草地交了那么多朋友，在雷迪看来，实在太多了。比利大叔还激他去迎战猎犬鲍泽。比利大叔真留在原地等鲍泽，雷迪自己却逃了，害得大伙儿都拿他当笑柄。
        - id: ch01-b05
          speaker: narrator
          text: 这时，雷迪记起比利大叔住的那棵空心树就在附近。他决定顺路过去，再看一眼。老空心树还立在那里，树身半腰就是比利大叔家的门。从前，比利大叔总爱从门里探出头，低头冲他咧嘴笑。今天总算轮到雷迪笑了。
        - id: ch01-b06
          speaker: narrator
          text: 雷迪背靠树根坐下来，跷起两条腿。他先朝这边看看，又朝那边瞧瞧，确定周围一个人也没有，这才扯开那副难听的破嗓子，唱了起来。
        - id: ch01-b07
          speaker: reddy_fox
          text: 老比利负鼠先走一步！老比利负鼠从此再无！比利是个无赖，先生！比利是个小偷！比利偷了鸡蛋，先生！比利栽了跟头。老比利负鼠活该倒霉，昨夜一命呜呼，如今再也不回！
        - id: ch01-b08
          speaker: unc_billy_possum
          text: 唱得好，先生，唱得真好。您还特意给俺唱了支小夜曲，俺可真得好好谢谢您哪。
        - id: ch01-b09
          speaker: narrator
          text: 这声音听起来，就像是从雷迪背后的树里传出来的。雷迪猛地跳起来，活像挨了一针。他抬头望向比利大叔家的门，浑身的毛一下子全竖了起来，牙齿也吓得格格直响。
        - id: ch01-b10
          speaker: narrator
          text: 门里有个东西探出头来，正低头冲着雷迪咧嘴笑。雷迪左看右看，怎么看，那东西都活脱脱是比利大叔本人。
        - id: ch01-b11
          speaker: reddy_fox
          text: 那一定是他的鬼魂！
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: 雷迪把尾巴往两腿中间一夹，转身冲上弯弯曲曲的小径。两条腿能跑多快，他就跑多快。
        - id: ch01-b13
          speaker: narrator
          text: 雷迪一路上连头也没回。要是他回头看上一眼，也许就会瞧见负鼠比利大叔从空心树上爬下来，跟刚巧路过的臭鼬吉米握了握手。
        - id: ch01-b14
          speaker: unc_billy_possum
          text: 你问俺是咋办到的？农夫布朗家的男孩逮住俺时，俺不过是在装死。他当然不会再去杀一只已经死了的负鼠。所以，他把俺扔到劈柴墩上，一转过身，俺自然就又活过来啦。你看，俺现在不是好端端地站在这里吗？
        - id: ch01-b15
          speaker: narrator
          text: 负鼠比利大叔咧着嘴，笑得比刚才更欢了。臭鼬吉米也咧开嘴，跟着笑了起来。
