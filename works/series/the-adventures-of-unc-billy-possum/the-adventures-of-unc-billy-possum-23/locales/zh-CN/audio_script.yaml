audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 慢悠悠又爱打趣，带着老弗吉尼亚乡音般的亲切腔调
        timbre: 粗暖松弛
        pace: 从容偏慢
        pitch: 中低音
    happy_jack_squirrel:
      display_name: 松鼠快乐杰克
      tts:
        delivery: 活泼爽快，兴奋时语调跳跃，生气时干脆有力
        timbre: 明亮轻巧
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 松鼠快乐杰克意外来访
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 松鼠快乐杰克一向喜欢雪。雪一下，他就浑身来劲，在雪地里跑跑跳跳，还会刨开一个个小洞，寻找下雪前藏在落叶底下的坚果。脚冻冷了，他只要蹿上树，把脚缩进自己的毛皮大衣里，就又暖和了。那场大雪难住了负鼠比利大叔，却正合快乐杰克的心意。他在自己住的那片绿森林里痛痛快快地玩着，到处留下滑稽的小脚印。
        - id: ch01-b02
          speaker: narrator
          text: 快乐杰克根本不知道比利大叔遇上了麻烦。他还以为比利大叔平平安安地待在自家那棵大空心树里，像大半个冬天以来那样睡得正香。天气这么好，怎么会有人只想睡觉呢？快乐杰克想不通。不过，那是人家的事。他早就懂得，别人的事不必由自己操心。
        - id: ch01-b03
          speaker: narrator
          text: 每回撒欢累了，快乐杰克便停下来歇歇。他坐得直直的，把两手交叠在胸前，藏进大衣般的绒毛里。这样一来，两只手很快就暖和了。漂亮的灰色大尾巴高高弯过背脊，两只亮眼睛一闪一闪。高兴起来，他就放声大叫，每叫一声，还要猛甩一下尾巴。布朗农场主家的男孩说，那是在吠叫。可对快乐杰克来说，那明明是欢呼。
        - id: ch01-b04
          speaker: happy_jack_squirrel
          text: 我爱撒欢，我爱玩耍！整天快活，笑哈哈！我爱白雪，又软又白！我爱太阳，照得真亮！我爱这世界，你要问为什么，只因世界待我实在好得很！
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: 玩着玩着，快乐杰克来到了那棵倒下的空心树旁。布朗农场主家的男孩以为比利大叔躲在里面，才把它砍倒了。
        - id: ch01-b06
          speaker: happy_jack_squirrel
          text: 咦，这不是我表哥红松鼠查特勒的旧粮仓吗！附近也有我的一座旧粮仓。我得去看看，里面还剩没剩坚果。
        - id: ch01-b07
          speaker: narrator
          text: 快乐杰克蹿到附近另一棵空心树下，飞快地爬了上去。也只有他才能爬得那么利落。他身子一闪，从敞开的洞口钻了进去。这个树洞他来过不知多少回，从没想过要先瞧瞧脚下。这一次，他扑通落在了一团又软又暖的东西上！快乐杰克顿时愣住，不知道该怎么办。可就在一眨眼间，那团东西冒出了尖爪和利齿，树洞里也响起愤怒的低吼。
        - id: ch01-b08
          speaker: narrator
          text: 快乐杰克吓得连滚带爬，拼命逃出树洞。到了外面，他觉得安全了，火气却上来了。这明明是他的粮仓，就算早已不用，别人也不该闯进来！洞里传出怒气冲冲的声音。没过多久，负鼠比利大叔出现在了洞口。
        - id: ch01-b09
          speaker: narrator
          text: 比利大叔刚从酣睡中惊醒，光是这一点就足以让人恼火。更何况，他刚才还受了好大一场惊吓，脾气自然更坏了。他一看见快乐杰克，立刻厉声责问。
        - id: ch01-b10
          speaker: unc_billy_possum
          text: 你这是干吗？为什么跑来吓唬俺这样的老实人？
          emotion: angry
        - id: ch01-b11
          speaker: happy_jack_squirrel
          text: 那你呢？偷偷闯进别人家里，又算什么意思？
          emotion: angry
