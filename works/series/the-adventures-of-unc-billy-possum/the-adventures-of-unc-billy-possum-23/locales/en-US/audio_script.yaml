audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gently rustic
        pace: measured
        pitch: medium
    unc_billy:
      display_name: Unc' Billy Possum
      tts:
        delivery: easygoing and expressive with a gentle Southern flavor
        timbre: warm and slightly raspy
        pace: relaxed
        pitch: medium-low
    happy_jack:
      display_name: Happy Jack Squirrel
      tts:
        delivery: bright, quick, and spirited
        timbre: lively and youthful
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: "Happy Jack Loves the Snow"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Happy Jack Squirrel liked the snow. He always had. Snow made him feel frisky. He loved to run through it, leap over it, and dig little holes to find the nuts he had hidden beneath the leaves before the snow came. Whenever his feet grew cold, he simply scampered up a tree and tucked them into his own warm fur coat.
        - id: ch01-b02
          speaker: narrator
          text: >-
            That big snowstorm had brought Unc' Billy Possum plenty of trouble, but it suited Happy Jack perfectly. He had a grand time leaving funny little tracks all around his part of the Green Forest.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Happy Jack knew nothing about Unc' Billy's troubles. He thought Billy was safe in his big hollow tree, sleeping soundly as he had through most of the winter. Happy Jack could not see why anyone would sleep through such fine weather. Still, that was Billy's business. Long ago, Happy Jack had learned not to worry about anyone else's affairs.
        - id: ch01-b04
          speaker: narrator
          text: >-
            After romping for a while, Happy Jack would stop and rest. He sat very straight, with his hands folded against his chest where the fur kept them warm. His beautiful gray tail curved high over his back. His bright eyes flashed and twinkled. Then he shouted for sheer joy, jerking his great tail with every shout. Farmer Brown's boy called that sound barking, but to Happy Jack it was shouting.
        - id: ch01-b05
          speaker: happy_jack
          text: >-
            I love to romp! I love to play! I'm happy, happy all the day! I love the soft white snow, and I love the bright sunshine! I love the whole world, because the world is very good to me!
          emotion: happy
    - id: ch02
      title: "The Old Storehouse"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            After a while, Happy Jack reached the hollow tree that Farmer Brown's boy had cut down. The boy had thought Unc' Billy Possum was hiding inside it.
        - id: ch02-b02
          speaker: happy_jack
          text: >-
            Well, look at that! It's one of my cousin Chatterer the Red Squirrel's old storehouses. I have an old storehouse close by. Maybe I left a few nuts in it.
          emotion: surprised
        - id: ch02-b03
          speaker: narrator
          text: >-
            Happy Jack dashed over to another hollow tree nearby. Up the trunk he flew, the way only Happy Jack could, and through the open doorway he whisked. He had visited that hollow so many times that he never thought to look where he was going.
        - id: ch02-b04
          speaker: narrator
          text: >-
            He landed with a bump on something soft and warm. For one second, surprise left him frozen. Then, quick as a flash, that soft, warm something seemed to be all sharp claws and even sharper teeth. An angry growl filled the hollow tree.
    - id: ch03
      title: "An Unexpected Call"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Happy Jack was terrified. He scrambled outside as fast as he could. Once he was safely out, his fright turned to anger. How dare anyone settle in his storehouse, even if he had not used it for a long time? An angry voice was still sounding inside. A moment later, Unc' Billy Possum appeared in the doorway.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Unc' Billy had been deep asleep when Happy Jack landed on him. Being woken that way was enough to make anyone cross. And Billy had been badly frightened, too, which made him crosser than ever.
        - id: ch03-b03
          speaker: unc_billy
          text: >-
            What do yo' mean, barging in here and scaring honest folks like that?
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: >-
            Unc' Billy snapped those words as soon as he saw Happy Jack.
        - id: ch03-b05
          speaker: happy_jack
          text: >-
            And what do you mean, sneaking into somebody else's house?
          emotion: angry
