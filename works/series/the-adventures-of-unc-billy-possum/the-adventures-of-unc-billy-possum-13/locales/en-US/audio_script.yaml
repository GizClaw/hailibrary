  chapters:
    - id: ch01
      title: "XIII. UNC' BILLY POSSUM GROWS HUNGRY"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Through the coldest winter days, Unc' Billy Possum stayed curled up in his warm, snug home inside the big hollow tree in the Green Forest. He did not care for cold weather. Every now and then, he poked his head through his doorway. But Brother North Wind would come whooping roughly among the trees, and Unc' Billy would turn straight around and climb back into bed for another nap. All the while, he sang about the home he missed.
        - id: ch01-b02
          speaker: unc_billy_possum
          text: "Way down South, the sun keeps shining. Yes, sir, that is so! For that land my heart is pining. Yes, sir, that is so! The mockingbird sings all day. The alligators are at play. The flowers there are blooming fair, and my heart aches to be down there. Yes, sir, that is so!"
        - id: ch01-b03
          speaker: narrator
          text: Before winter came, Unc' Billy had made himself as fat as he possibly could. When Jack Frost first reached the Green Forest, Unc' Billy was so round that he could barely waddle. That was why he had worked so hard to grow fat. For quite a while, he could stay indoors without worrying about finding anything to eat. So once ice and snow covered the ground, he chose the comfort of his tree. By then, he was nearly as fat as Johnny Chuck was when Johnny settled down for his long winter sleep.
        - id: ch01-b04
          speaker: narrator
          text: Johnny Chuck could sleep through the whole winter without waking even once. Unc' Billy could not. He had to peek outside every so often and see how the world was getting along without him. On bright days, when the air was not too cold, he sometimes climbed down and walked a little way over the snow. He never enjoyed it much. The snow chilled his feet, and the tracks he left behind worried him even more. He scowled whenever he saw them. If Farmer Brown's boy came that way, those tracks would tell him at once who had made them. Then he might follow them and find Unc' Billy's home in the hollow tree. So Unc' Billy rarely went outside, especially when the snow was soft.
        - id: ch01-b05
          speaker: narrator
          text: Day after day went by, but to Unc' Billy Possum, winter seemed no closer to ending. The fat he had stored for winter was disappearing. Now he was growing thin, and hunger had begun to trouble him. Once he began thinking about food, every thought made his hunger stronger. One morning, he put his head outside his doorway. Down below came Jimmy Skunk, trotting along. Jimmy looked plump and comfortable, as if the cold did not trouble him at all.
        - id: ch01-b06
          speaker: unc_billy_possum
          text: "Morning, Jimmy Skunk."
        - id: ch01-b07
          speaker: narrator
          text: Jimmy looked up.
        - id: ch01-b08
          speaker: jimmy_skunk
          text: "Why, hello, Unc' Billy! It has been a long time since I saw you!"
          emotion: surprised
        - id: ch01-b09
          speaker: unc_billy_possum
          text: "Where have you been, Jimmy?"
        - id: ch01-b10
          speaker: narrator
          text: Jimmy winked one eye.
        - id: ch01-b11
          speaker: jimmy_skunk
          text: "I have been having fresh eggs for breakfast."
        - id: ch01-b12
          speaker: narrator
          text: At that, Unc' Billy's mouth began to water.
        - id: ch01-b13
          speaker: unc_billy_possum
          text: "Are there any eggs left?"
        - id: ch01-b14
          speaker: narrator
          text: Jimmy said there were. Unc' Billy watched him amble away along the Lone Little Path and let out a long sigh. There would be no more sleep for Unc' Billy now. No, sir, not even a wink. He could think of nothing but his hunger. Whenever he closed his eyes, he seemed to be looking straight into Farmer Brown's henhouse. Eggs were everywhere. Eggs, eggs, eggs. At last, Unc' Billy made up his mind.
        - id: ch01-b15
          speaker: unc_billy_possum
          text: "The very first dark night, I am going up there!"
