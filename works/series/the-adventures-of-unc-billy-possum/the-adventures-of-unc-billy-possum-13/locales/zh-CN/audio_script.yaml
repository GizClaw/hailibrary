audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 慢悠悠又爱打趣，带着老弗吉尼亚乡音般的亲切腔调
        timbre: 粗暖松弛
        pace: 从容偏慢
        pitch: 中低音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 实在机灵，开口直截了当又不失关切
        timbre: 温厚清晰
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 空心树里的寒冬
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 冬天最冷的日子里，负鼠比利大叔一直蜷在绿森林的大空心树里。他的家又暖和又舒服，他才不愿出去挨冻。有时，他从门口探出脑袋，刚听见粗暴的北风兄弟在林间呼号，就立刻转身回床上，再睡一觉。嘴里还会唱起这支歌。
        - id: ch01-b02
          speaker: unc_billy_possum
          text: 遥远南方阳光照，是呀，先生，正是这样！俺心日夜把故乡盼，是呀，先生，正是这样！嘲鸫整天把歌唱，短吻鳄儿嬉水忙。百花盛开多芬芳，想起南方俺心伤。是呀，先生，正是这样！
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: 比利大叔早就为冬天做了准备。他想尽办法把自己吃得胖胖的。霜杰克刚来绿森林时，他胖得走路都只能摇摇摆摆。这样一来，只要身上的肥肉够多，他就能很久不找吃的，也不必发愁。等到冰雪降临，他决定留在屋里时，几乎和土拨鼠约翰尼开始冬眠那会儿一样胖了。
        - id: ch01-b04
          speaker: narrator
          text: 约翰尼能一觉睡过整个冬天，中间一次也不醒。比利大叔却做不到。他隔一阵就要伸头看看，瞧瞧没有他的世界过得怎么样。要是太阳明亮，天也不太冷，他偶尔会爬下树，到雪上走一会儿。
        - id: ch01-b05
          speaker: narrator
          text: 可雪地一点也不好玩。双脚冻得冰冷，留在身后的脚印也叫他讨厌。他皱着眉盯住那些印子，心里明白，布朗农场主的儿子只要经过，一看就知道是谁走过，还会顺着脚印找到他在树洞里的家。于是，比利大叔很少出门。雪松软的时候，他更不肯出去。
    - id: ch02
      title: 臭鼬吉米的早餐
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 比利大叔觉得，这个冬天简直永远也过不完。他身上的肥肉一点点消下去，肚子当然也饿了。他越是惦记吃的，就越觉得饿。一天早晨，他从门口探出头，正好看见臭鼬吉米在树下小跑。吉米胖乎乎的，看着舒坦极了，好像根本不怕冷。
        - id: ch02-b02
          speaker: unc_billy_possum
          text: 早上好啊，臭鼬吉米。
        - id: ch02-b03
          speaker: narrator
          text: 吉米抬头一看，是好久不见的比利大叔。
        - id: ch02-b04
          speaker: jimmy_skunk
          text: 你好，比利大叔！我可有好长时间没看见你啦！
        - id: ch02-b05
          speaker: unc_billy_possum
          text: 臭鼬吉米，你这是上哪儿去了？
        - id: ch02-b06
          speaker: narrator
          text: 吉米眨了眨一只眼睛。
        - id: ch02-b07
          speaker: jimmy_skunk
          text: 我去吃早饭了。刚弄到几只新鲜鸡蛋，味道可真不错。
        - id: ch02-b08
          speaker: narrator
          text: 一听见鸡蛋，比利大叔的口水都快流出来了。
        - id: ch02-b09
          speaker: unc_billy_possum
          text: 你还给俺剩了几只没有？
        - id: ch02-b10
          speaker: narrator
          text: 这句话问得急切极了。吉米告诉他，鸡蛋还有剩下的。
    - id: ch03
      title: 满脑子都是鸡蛋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 比利大叔看着臭鼬吉米沿孤独小径慢悠悠地走远，忍不住长叹了一声。现在他再也睡不着了。不，先生，连一小会儿也睡不了。他脑子里只剩下一件事，那就是自己实在太饿了。
        - id: ch03-b02
          speaker: narrator
          text: 每次闭上眼睛，他好像都能一直望进布朗农场主家的鸡舍。那里到处都是鸡蛋，鸡蛋，鸡蛋。最后，比利大叔终于拿定了主意。
        - id: ch03-b03
          speaker: unc_billy_possum
          text: 碰上第一个漆黑的夜晚，俺就到那儿去！
