audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gently rustic
        pace: measured
        pitch: medium
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: direct and alert
        timbre: youthful and clear
        pace: medium
        pitch: medium
  chapters:
    - id: ch01
      title: "XVII. UNC' BILLY POSSUM LIES LOW"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Farmer Brown's boy was angry. Yes, Sir, he certainly was. He had found the empty shells from the eggs Unc' Billy had eaten during the night. From the sound of the boy's voice, Unc' Billy knew there was no doubt about it. Farmer Brown's boy meant to find the thief.
        - id: ch01-b02
          speaker: narrator
          text: Unc' Billy was in a terrible spot. He was trapped right there in the hen-house, with no chance to run away. How he wished he had never thought about those eggs! How he wished he were safe at home in the dear old hollow tree in the Green Forest! Oh, dear! Oh, dear! Why hadn't he gone straight home after eating the eggs? Why had he stopped for a nap? But that was just what he had done. He had slept too long, and now broad daylight had found him still inside the hen-house.
        - id: ch01-b03
          speaker: farmer_browns_boy
          text: A Skunk must have done it. If it was a Skunk, there ought to be tracks in the snow outside. I'll have a look around.
        - id: ch01-b04
          speaker: narrator
          text: Unc' Billy heard Farmer Brown's boy go outside, and he almost chuckled.
        - id: ch01-b05
          speaker: narrator
          text: He thought the boy would find Jimmy Skunk's tracks, but never his. Unc' Billy felt lucky that he had stepped exactly where Jimmy had stepped on the way to the hen-house.
        - id: ch01-b06
          speaker: narrator
          text: Unc' Billy lay perfectly still and listened while Farmer Brown's boy poked around outside.
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: Ah, I was right!
        - id: ch01-b08
          speaker: narrator
          text: Unc' Billy knew the boy had found the tracks Jimmy Skunk had left in the snow. Again, he nearly chuckled. He felt very clever for walking in Jimmy's tracks. Then he heard something that stopped every proud thought in its tracks. Little cold shivers ran all the way up and down his backbone.
        - id: ch01-b09
          speaker: farmer_browns_boy
          text: Well, these tracks are strange. That Skunk must have had a mighty queer tail. I can see where it dragged through the snow, and the mark looks like the tail of a very big rat.
          emotion: surprised
        - id: ch01-b10
          speaker: narrator
          text: For the first time, Unc' Billy remembered his tail. While he was feeling so smart about following Jimmy Skunk's tracks, he had forgotten to hold it up. He had dragged it across the snow, and of course it had made a mark.
        - id: ch01-b11
          speaker: farmer_browns_boy
          text: I guess more than one visitor came here last night. The Skunk's tracks lead away from the hen-house, but those other strange tracks don't. Whoever made them must still be somewhere close by.
        - id: ch01-b12
          speaker: narrator
          text: Farmer Brown's boy came back into the hen-house and searched every corner. He shifted all the boxes and peered into the grain bin. Then he started checking the nests. Unc' Billy heard him draw nearer and nearer. The boy looked into the nest right beside his. At last, he turned to the very nest where Unc' Billy was hiding. Unc' Billy Possum held his breath.
        - id: ch01-b13
          speaker: narrator
          text: Unc' Billy had chosen a nest in the highest row, tucked into the darkest corner of the hen-house. He had crawled beneath the hay. Maybe the corner was too dark. Maybe the nest was so high that Farmer Brown's boy did not truly expect anything to be there. Whatever the reason, the boy saw only hay. He did not bother reaching in to feel whether anything was hidden underneath it.
        - id: ch01-b14
          speaker: farmer_browns_boy
          text: That's very queer indeed! I suppose I'll have to set some traps.
        - id: ch01-b15
          speaker: narrator
          text: And through it all, Unc' Billy Possum held his breath and lay low.
