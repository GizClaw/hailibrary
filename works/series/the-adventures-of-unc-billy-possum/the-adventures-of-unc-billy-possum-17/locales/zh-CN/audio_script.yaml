audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 直率活泼，遇到意外时反应鲜明
        timbre: 清脆明朗的少年声线
        pace: 中等偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 偷蛋贼留下的线索
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 布朗农场主家的男孩生气了。是的，先生，他当真气坏了。地上那些空蛋壳，正是比利大叔夜里吃鸡蛋留下的。比利大叔听男孩说话的口气就知道，他非把偷蛋贼找出来不可。
        - id: ch01-b02
          speaker: narrator
          text: 这下可糟透了。比利大叔就在鸡舍里面，连逃跑的机会都没有。他拼命盼着自己压根儿没惦记过鸡蛋，也盼着已经平平安安回到绿森林那棵亲切的老空心树里。唉呀，唉呀！吃完那些鸡蛋以后，他怎么没径直回家，偏要留下来打盹儿呢？可他就是没有回去。他不但睡了，还睡过了头。如今已是大白天，他还被困在鸡舍里。
        - id: ch01-b03
          speaker: farmer_browns_boy
          text: 准是臭鼬偷的。要真是他，外面的雪地上肯定有脚印。我去四周找找看。
        - id: ch01-b04
          speaker: narrator
          text: 男孩走了出去，比利大叔听见以后，差点儿笑出声来。
        - id: ch01-b05
          speaker: narrator
          text: 他暗暗想着，男孩只会找到臭鼬吉米的脚印，绝不会找到自己的。幸亏来的时候，他想到了踩着吉米的脚印走。
    - id: ch02
      title: 雪地上的尾巴印
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 比利大叔躺着一动不动，听男孩在外面到处查看。不一会儿，男孩叫了一声。
        - id: ch02-b02
          speaker: farmer_browns_boy
          text: 哈，我就知道！
        - id: ch02-b03
          speaker: narrator
          text: 比利大叔一听就知道，男孩找到了臭鼬吉米留在雪地里的脚印。他又差点儿笑起来，心里直夸自己聪明，居然想到了踩着吉米的脚印走。可就在这时，男孩又开了口。比利大叔方才还在得意，满脑子都是自己有多聪明。听见这句话，那些念头顿时全没了，一阵阵冷颤顺着脊梁骨上下乱窜。
        - id: ch02-b04
          speaker: farmer_browns_boy
          text: 咦，这些脚印真怪！那只臭鼬的尾巴一定也怪得很。雪地上还有尾巴拖过的印子，看着倒像一只大老鼠的尾巴划出来的。
          emotion: surprised
        - id: ch02-b05
          speaker: narrator
          text: 比利大叔这才想起来，自己光顾着耍聪明，忘了把尾巴抬高。尾巴一路拖过雪地，当然会留下一道印子。
        - id: ch02-b06
          speaker: farmer_browns_boy
          text: 看来昨晚来的不止一个家伙。臭鼬的脚印已经离开鸡舍了，可那些怪脚印却没有往回走。留下它们的家伙，现在一定还躲在附近。
    - id: ch03
      title: 屏住呼吸
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 男孩回到鸡舍，开始在每个角落里翻找。他把所有箱子一只只挪开，又查看了粮食柜，接着逐个搜起鸡窝。比利大叔只能躲着听。他听见男孩越来越近，越来越近。男孩已经在查看紧挨着自己的那个鸡窝了。最后，他终于朝比利大叔藏身的鸡窝里望了进来。负鼠比利大叔连气都不敢喘。
        - id: ch03-b02
          speaker: narrator
          text: 比利大叔藏着的鸡窝在最高一排，正好位于鸡舍最暗的角落。他早已钻进干草底下。也许那个角落实在太暗，也许鸡窝的位置实在太高，男孩根本没料到那里会藏着什么。不管怎样，他只看见了干草，也没费事把手伸进去，摸摸草底下有没有东西。
        - id: ch03-b03
          speaker: farmer_browns_boy
          text: 真奇怪，实在太奇怪了！看来我得放几个捕兽夹才行。
        - id: ch03-b04
          speaker: narrator
          text: 从头到尾，负鼠比利大叔一直屏着呼吸，伏在低处，一动也不动。
