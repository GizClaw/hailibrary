audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gently rustic
        pace: measured
        pitch: medium
    unc_billy:
      display_name: Unc' Billy Possum
      tts:
        delivery: easygoing and expressive with a gentle Southern flavor
        timbre: warm and slightly raspy
        pace: relaxed
        pitch: medium-low
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: practical and confident
        timbre: clear and youthful
        pace: steady
        pitch: medium
    tommy_tit:
      display_name: Tommy Tit the Chickadee
      tts:
        delivery: bright and cheerfully curious
        timbre: light and crisp
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: "Where Unc' Billy Possum Was"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Where was Unc' Billy Possum? Farmer Brown's boy wanted to know, and so did Bowser the Hound. All that time, Unc' Billy was tucked inside another hollow tree. He peeped out at Farmer Brown's boy working so hard and laughed until his sides ached.
        - id: ch01-b02
          speaker: unc_billy
          text: Ah surely fooled him that time.
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: Unc' Billy watched Farmer Brown's boy wade home through the snow, with Bowser close behind him. Then a voice spoke from just above Unc' Billy's head.
        - id: ch01-b04
          speaker: tommy_tit
          text: You certainly did fool him, Unc' Billy! But how did you manage it?
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: Unc' Billy looked up in surprise. Tommy Tit the Chickadee was there. Unc' Billy grinned.
        - id: ch01-b06
          speaker: unc_billy
          text: Ah had a feeling company might come, so Ah got a little surprise ready. Yes, Sah, that's just what Ah did. Mah tracks showed up mighty plain in the snow. They showed every step Ah'd taken. When Ah climbed that tree and looked down at all those tracks, Ah began to worry. Ah got so anxious Ah couldn't rest mah mind at all. Ah knew Farmer Brown's boy would find them, and once he did, he'd follow them in a hurry. Sure enough, he came along just before sundown. He tracked me straight to the foot of the tree where Ah was hiding in the hollow. Then Ah heard him talking.
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: So this is where you live, is it, Mr. Possum? Bowser and I will come calling tomorrow.
        - id: ch01-b08
          speaker: unc_billy
          text: When Ah heard that, Ah felt mighty bad. Yes, Sah, mighty bad indeed. Ah thought and thought about how to fool that boy and Bowser. If Ah climbed down and went someplace else, Ah'd leave more tracks in the snow. Wherever Ah went, that boy was bound to follow those tracks and still find me just the same. Ah surely wished Ah had wings like you and Brer Buzzard.
        - id: ch01-b09
          speaker: unc_billy
          text: So po' ol' Unc' Billy sat there thinking and thinking. The longer Ah studied on it, the more troubled Ah got. After a while, Ah noticed something. One branch from that hollow tree rubbed against a branch on the next tree. Then a branch on that tree rubbed against one on another tree. From there, one good jump would bring me into this tree, with a hollow made just for me. Ah didn't waste another moment thinking. No, Sah. Ah moved right away, and here Ah am.
        - id: ch01-b10
          speaker: tommy_tit
          text: So you left no tracks, and you never needed wings!
        - id: ch01-b11
          speaker: unc_billy
          text: No. But if yo' look hard enough, yo' can almost always find a way out. Right now, Ah'm looking mighty hard for a way to get home. Ah reckon mah eyes must be failing, because Ah don't see one yet.
        - id: ch01-b12
          speaker: narrator
          text: Tommy Tit laughed merrily.
        - id: ch01-b13
          speaker: tommy_tit
          text: Dee, dee, dee! Be patient, Unc' Billy. Maybe you will find one.
          emotion: happy
