audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 慢悠悠又爱打趣，带着老弗吉尼亚乡音般的亲切腔调
        timbre: 粗暖松弛
        pace: 从容偏慢
        pitch: 中低音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 直率活泼，遇到意外时反应鲜明
        timbre: 清脆明朗的少年声线
        pace: 中等偏快
        pitch: 中高音
    tommy_tit:
      display_name: 黑顶山雀汤米
      tts:
        delivery: 快活机灵，好奇时语气轻巧明快
        timbre: 轻盈清脆
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 负鼠比利大叔藏在哪里
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 负鼠比利大叔究竟在哪儿？布朗农场主家的男孩想知道，猎犬鲍泽也想知道。其实呀，比利大叔一直藏在另一棵空心树里。他从洞口悄悄往外看，见男孩忙得那么辛苦，笑得肚子都疼了。
        - id: ch01-b02
          speaker: unc_billy_possum
          text: 哈，这回俺可把他骗过去啦。
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: 比利大叔望着男孩在深雪里一步一步蹚回家，猎犬鲍泽就跟在男孩脚后。这时，一个声音忽然从他头顶上方传了下来。
        - id: ch01-b04
          speaker: tommy_tit
          text: 你真的把他骗过去了，比利大叔！快说说，你到底是怎么办到的？
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: 比利大叔吃了一惊，抬头一瞧，原来是黑顶山雀汤米。他咧开嘴笑了。
        - id: ch01-b06
          speaker: unc_billy_possum
          text: 俺早就猜到会有客人来，所以给他备下了一个小惊喜。是的，先生，就是这么回事。雪地上的脚印实在太清楚了！每一步都明明白白地摆在白雪上，谁一眼都能瞧见。俺爬上那棵树，低头瞧见自己留下的那些脚印，心里一下就慌了。越想越不安，怎么也定不下心。俺知道，布朗农场主家的男孩准会发现它们。一旦发现，他很快就会追过来。果不其然，太阳快下山的时候，他来了。他顺着脚印，径直找到俺藏身的空心树下。接着，俺就听见他开口了。
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: 原来你住在这儿啊，负鼠先生？明天我和鲍泽再来拜访你。
        - id: ch01-b08
          speaker: unc_billy_possum
          text: 俺听了这话，心里难受得很。是的，先生，当真难受得很。俺想了又想，到底怎样才能骗过那个男孩和猎犬鲍泽。要是俺爬下树，另外找个地方躲，雪地上又会留下脚印。不管躲到哪儿，那个男孩还是会顺着脚印找到俺。那时候啊，俺真希望自己也像你和秃鹫兄弟一样，长着一双翅膀。
        - id: ch01-b09
          speaker: unc_billy_possum
          text: 可怜的比利大叔就坐在那里，一直想，一直发愁。过了一会儿，俺发现空心树上有根树枝，正好碰着旁边那棵树的树枝。旁边那棵树呢，又有根树枝碰着第三棵树的树枝。俺只要从那里使劲一跳，就能来到这棵树上。这里还有个树洞，简直就是给俺预备的。俺哪还会坐着多想？没有，先生，俺立刻搬了过来。这不，俺现在就在这儿嘛。
        - id: ch01-b10
          speaker: tommy_tit
          text: 这样一来，你一道脚印都没留下，也根本不用长翅膀！
        - id: ch01-b11
          speaker: unc_billy_possum
          text: 是啊。不过俺发现，只要肯用心找，差不多总能找到一条出路。现在，俺正拼命找回家的路呢。可俺这双眼睛大概不中用啦，到现在还没瞧见路在哪儿。
        - id: ch01-b12
          speaker: narrator
          text: 黑顶山雀汤米听了，快活地笑起来。
        - id: ch01-b13
          speaker: tommy_tit
          text: 滴，滴，滴！耐心等一等吧，比利大叔。说不定你会找到的。
          emotion: happy
