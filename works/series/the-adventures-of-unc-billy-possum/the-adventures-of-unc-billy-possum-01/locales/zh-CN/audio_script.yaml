audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 狡猾得意，说话时总带着几分刻薄
        timbre: 尖细灵活
        pace: 轻快
        pitch: 中高音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 直率活泼，遇到意外时反应鲜明
        timbre: 清脆明朗的少年声线
        pace: 中等偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第一章　负鼠比利大叔被逮住了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这天下午，天色已经不早。黑影刚从紫山上悄悄爬下来，绿草地上忽然热闹起来。消息是狐狸雷迪带来的。他说的时候咧着嘴，像是很爱听见这件事，更巴不得它是真的。
        - id: ch01-b02
          speaker: reddy_fox
          text: 老负鼠比利死啦。我亲眼看见农夫布朗家的男孩提着他的尾巴，把他带回家了。这下你们知道了吧？他哪有你们说的那么聪明。
        - id: ch01-b03
          speaker: narrator
          text: 雷迪最后这句话，说得可真不怀好意。大伙儿本来谁也不信他，因为这只狐狸难得说真话。可臭鼬吉米垂头丧气地沿着弯弯曲曲的小径走来，也说消息是真的，大家只好相信了。
        - id: ch01-b04
          speaker: narrator
          text: 大伙儿纷纷谈起比利大叔的好。他从“老弗吉尼亚”搬到绿森林以后，给大家带来了多少快乐啊！只有雷迪不肯说好话。他说，比利大叔落到这种下场也是活该，反正本来就没什么用。大家一听，全都朝他又嘘又叫。雷迪招架不住，只能灰溜溜地溜走。
        - id: ch01-b05
          speaker: narrator
          text: 可就在大家夸奖比利大叔的时候，他本人正经历着一场惊险。这一次，他胆子实在太大了。天还没黑，就跑去了农夫布朗家的鸡舍。臭鼬吉米想拦住他，他半句也不听。他肚子饿了，想吃鸡蛋，怎么也不肯等到天黑。负鼠比利大叔就是这么任性，这么固执，说走就走了。
        - id: ch01-b06
          speaker: narrator
          text: 他来到鸡舍，趁没人瞧见，悄悄溜了进去。窝里装满了鸡蛋。比利大叔吃得津津有味，竟忘了留神四周。忽然，门开了。农夫布朗家的男孩进来，要拿几个鸡蛋当晚饭。现在逃可来不及了。比利大叔往地上一倒，当场一动不动，装得跟死了一模一样。
        - id: ch01-b07
          speaker: narrator
          text: 男孩以前从没见过比利大叔，这会儿看着地上的家伙，一时不知道该怎么办。
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: 咦，这家伙出了什么事？不管是什么要了他的命，反正他已经死透了。可他跑进鸡舍来做什么呢？
        - id: ch01-b09
          speaker: narrator
          text: 男孩说着，用鞋尖把比利大叔翻了个身。就在这时，他看见比利大叔嘴唇上还沾着一点鸡蛋。
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: 哈！哈！原来一直偷我鸡蛋的贼就是你！
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: 男孩抓住比利大叔的尾巴，把他提起来，朝屋子走去。经过柴堆时，他先把比利大叔丢在劈柴墩上，再去抱一捆引火的小木柴，打算带回屋里。可等他回过身，要再提起比利大叔时，劈柴墩上已经空了。
        - id: ch01-b12
          speaker: narrator
          text: 男孩扔下怀里的木柴，把四下每个地方都找遍了。可是，不管他怎么找，连比利大叔的一点踪影也没发现。
