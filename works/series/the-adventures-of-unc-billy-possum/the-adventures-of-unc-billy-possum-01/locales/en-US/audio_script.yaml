  chapters:
    - id: ch01
      title: "I. UNC' BILLY POSSUM IS CAUGHT"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Late one afternoon, the Green Meadows were suddenly full of excitement. The black shadows had just begun creeping down from the Purple Hills when Reddy Fox came hurrying in with some news. As he told it, he wore a grin that made it plain he was glad.
        - id: ch01-b02
          speaker: reddy_fox
          text: "Old Billy Possum is dead. I know, because I saw Farmer Brown's boy carrying him home by the tail. So much for everyone thinking he was so smart."
        - id: ch01-b03
          speaker: narrator
          text: Reddy said that last part just to be mean. At first, nobody believed him. Everyone knew how seldom Reddy told the truth. But then Jimmy Skunk came sadly down the Crooked Little Path and said the news was true. After that, they had to believe it.
        - id: ch01-b04
          speaker: narrator
          text: Everyone began talking about Unc' Billy. They remembered how much they had enjoyed having him in the Green Forest since he came up from Ol' Virginny, and they had all kinds of good things to say about him. Everyone did except Reddy Fox. Reddy said Unc' Billy was no good anyway, and had gotten exactly what he deserved. The others hooted and hissed at Reddy until he was glad to slink away.
        - id: ch01-b05
          speaker: narrator
          text: But while they were saying those kind things about him, Unc' Billy Possum was right in the middle of an exciting adventure. This time, he had been too bold. Before dark, he had set off for Farmer Brown's henhouse. Jimmy Skunk tried to stop him, but Unc' Billy would not listen. He was hungry. He wanted an egg, and he refused to wait for nightfall. Once Unc' Billy made up his mind, he could be terribly headstrong and stubborn.
        - id: ch01-b06
          speaker: narrator
          text: Unc' Billy reached the henhouse and slipped inside without anyone seeing him. The nests were full of eggs. Soon he was enjoying such a fine feast that he forgot all about keeping watch. Then the door suddenly opened. In walked Farmer Brown's boy, looking for eggs for supper. Unc' Billy had no time to escape. He dropped where he stood and lay there as if he were dead.
        - id: ch01-b07
          speaker: narrator
          text: Farmer Brown's boy stared at him. He had never seen Unc' Billy before, so he could not imagine what sort of creature lay there or what had happened to it. He nudged Unc' Billy and rolled him over with the toe of his shoe.
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: "Well, now. What could have happened to this fellow? Whatever killed him, he certainly looks dead. And what was he doing in here?"
        - id: ch01-b09
          speaker: narrator
          text: Then Farmer Brown's boy noticed some egg still clinging to Unc' Billy's lips.
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: "Aha! So you're the thief who's been stealing my eggs!"
        - id: ch01-b11
          speaker: narrator
          text: He picked Unc' Billy up by the tail and started toward the house. When he reached the woodpile, he tossed Unc' Billy onto the chopping block. Then he turned away to gather an armful of kindling to carry inside.
        - id: ch01-b12
          speaker: narrator
          text: A moment later, Farmer Brown's boy turned back to pick up Unc' Billy. But Unc' Billy was gone.
        - id: ch01-b13
          speaker: narrator
          text: Farmer Brown's boy dropped the wood and searched everywhere. He looked and looked, but he could not find a single trace of Unc' Billy Possum.
