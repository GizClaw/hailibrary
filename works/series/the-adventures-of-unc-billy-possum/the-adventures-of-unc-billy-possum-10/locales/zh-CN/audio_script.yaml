audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 狡猾得意，说话时总带着几分刻薄
        timbre: 尖细灵活
        pace: 轻快
        pitch: 中高音
    shadow_weasel:
      display_name: 黄鼠狼黑影
      tts:
        delivery: 阴沉机警，话不多却处处戒备
        timbre: 细冷紧实
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 空心木头里的眼睛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 狐狸雷迪和黄鼠狼黑影藏在一截空心木头里。这地方离负鼠比利大叔家不远。雷迪听见动静，用胳膊肘轻轻碰了碰黑影。
        - id: ch01-b02
          speaker: reddy_fox
          text: 听，有人过来了。
        - id: ch01-b03
          speaker: narrator
          text: 黑影探头往外瞧了一眼，也压低了声音。
        - id: ch01-b04
          speaker: shadow_weasel
          text: 原来是蟾蜍老先生和豪猪刺毛波奇。
        - id: ch01-b05
          speaker: narrator
          text: 雷迪的喉咙深处立刻滚出一声低吼。他一向不喜欢刺毛波奇。
        - id: ch01-b06
          speaker: shadow_weasel
          text: 臭鼬吉米也来了！你瞧，他两只胳膊底下各夹着一枚大鹅蛋。
        - id: ch01-b07
          speaker: narrator
          text: 黑影馋得咂起嘴来。雷迪也扭动身子，凑到能看见外面的地方。
        - id: ch01-b08
          speaker: reddy_fox
          text: 我的天！孤零零小路上滚来的那个东西是什么？
        - id: ch01-b09
          speaker: narrator
          text: 黑影一看就笑了，雷迪也跟着笑起来。两个人谁也没笑出声，因为他们不想让别人发现这个藏身处。他们探着脑袋，盯着外面那番景象。实在太滑稽了。彼得兔和表亲野兔蹦蹦正沿着小路走来，还一起推着一棵硕大无比的卷心菜。
    - id: ch02
      title: 卷心菜逃跑了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 到了小山坡顶上，那棵卷心菜突然从他们手里溜走，翻滚着、蹦跳着直冲下去。彼得兔和野兔蹦蹦慌忙追在后面，拼命想把它截住。
        - id: ch02-b02
          speaker: narrator
          text: 土拨鼠约翰尼就在前面。他怀里抱着一大捆甜苜蓿，准备带去参加彼得兔的聚会。约翰尼没看见卷心菜滚过来，一下被撞得双脚离地，“咚”的一声仰面摔倒。野兔蹦蹦追得太紧，根本来不及躲，正好摔到约翰尼身上。彼得兔紧接着也栽了上去。三个家伙顿时滚成一团！
        - id: ch02-b03
          speaker: narrator
          text: 可大卷心菜还在一个劲儿地逃。臭鼬吉米从来不慌不忙。他听见背后的响动，转身想弄清到底出了什么事。可还没来得及多眨一下眼，卷心菜已经结结实实地撞上了他的肚子。
        - id: ch02-b04
          speaker: narrator
          text: 吉米闷哼一声，倒了下去。一枚大鹅蛋飞出去，撞在树上摔碎了。他自己又一屁股坐上另一枚，那一枚也碎了。
        - id: ch02-b05
          speaker: narrator
          text: 再瞧吉米，他那身漂亮的黑白外套，已经到处都在淌蛋液。眼睛里有，脸上也有，连胡须尖都在滴滴答答往下滴。空心木头里的雷迪和黑影笑得眼泪直流。只是黑影心里失望极了，因为他本来正想偷走那两枚鹅蛋。
    - id: ch03
      title: 绿色的巨型针插
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 大卷心菜越过臭鼬吉米，又跑出不远，便“砰”的一声撞上一截树桩。花栗鼠条纹正坐在树桩上，两边颊囊都塞满了黄澄澄的玉米粒。这一下来得太突然，他顿时失去平衡，从树桩上直摔下去。
        - id: ch03-b02
          speaker: narrator
          text: 蟾蜍老先生刚在树桩后面坐下，想歇一小会儿。花栗鼠条纹正好砸在他身上，把他肚子里的气全撞了出去。条纹嘴里的玉米也撒了个精光。
        - id: ch03-b03
          speaker: narrator
          text: 豪猪刺毛波奇听见响声，抬头看见一个古怪东西沿着孤零零小路一蹦一跳地冲过来。他没等看清那是什么，便照着遇到危险时的老办法，把身子蜷成一团，将脸藏进长外套里。
        - id: ch03-b04
          speaker: narrator
          text: 波奇刚蜷起来，藏在外套里的上千根小尖刺就齐刷刷地竖了起来。他看上去活像一颗硕大的栗子刺球。
        - id: ch03-b05
          speaker: narrator
          text: 逃跑的卷心菜从树桩上弹起，一头撞上波奇，这才终于停住。波奇那些锋利的小尖刺，一根根全扎进了卷心菜。
        - id: ch03-b06
          speaker: narrator
          text: 等彼得兔和野兔蹦蹦匆匆赶来时，那棵逃跑的大卷心菜正躺在那里，看上去简直就是一个绿油油的巨型针插。
