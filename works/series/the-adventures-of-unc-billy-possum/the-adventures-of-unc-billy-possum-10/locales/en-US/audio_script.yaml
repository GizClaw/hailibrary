  chapters:
    - id: ch01
      title: "X. THE RUNAWAY CABBAGE"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Reddy Fox and Shadow the Weasel were hiding in a hollow log near Unc' Billy Possum's home. Reddy nudged Shadow with his elbow.
        - id: ch01-b02
          speaker: reddy_fox
          text: "Someone's coming. I can hear them."
        - id: ch01-b03
          speaker: narrator
          text: Shadow peeped out of the log.
        - id: ch01-b04
          speaker: shadow_weasel
          text: "It's old Mr. Toad and Prickly Porky."
        - id: ch01-b05
          speaker: narrator
          text: A growl rumbled deep in Reddy's throat. He had no love at all for Prickly Porky.
        - id: ch01-b06
          speaker: shadow_weasel
          text: "Here comes Jimmy Skunk, too. He's carrying a big goose egg under each arm!"
        - id: ch01-b07
          speaker: narrator
          text: Shadow smacked his lips. Reddy wriggled forward until he could see out of the log as well.
        - id: ch01-b08
          speaker: reddy_fox
          text: "Goodness! What's that coming down the Lone Little Path?"
        - id: ch01-b09
          speaker: narrator
          text: Shadow looked, and then both of them began to laugh without making a sound. They did not want anyone to discover their hiding place. And what they saw really was funny. It was such a funny sight that they could hardly contain themselves. Peter Rabbit and his cousin Jumper the Hare were coming along the Lone Little Path, rolling a huge cabbage between them.
        - id: ch01-b10
          speaker: narrator
          text: Right at the top of a little hill, the cabbage slipped away from them. Off it went, rolling and bouncing farther down the path. Peter and Jumper raced after it, trying desperately to catch it before it got away.
        - id: ch01-b11
          speaker: narrator
          text: Johnny Chuck was just ahead with a big bundle of sweet clover for Peter's party. He never saw the cabbage coming. It swept his feet out from under him, and he landed flat on his back with a thump. Jumper was right behind the cabbage and had no time to dodge. He fell on Johnny, and then Peter tumbled on top of them both. What a mix-up!
        - id: ch01-b12
          speaker: narrator
          text: The big cabbage rolled on. Jimmy Skunk never hurried, but when he heard the noise behind him, he turned to see what was happening. He barely had time to blink before the cabbage struck him square in the stomach. Jimmy dropped with a grunt. One goose egg flew into a tree and broke. Jimmy landed on the other one and broke that, too.
        - id: ch01-b13
          speaker: narrator
          text: What a sight he was! Egg ran over every part of his handsome black-and-white coat. It covered his face and got into his eyes, and it dripped from the ends of his whiskers. Inside the hollow log, Reddy and Shadow laughed until tears ran down their cheeks. But Shadow was bitterly disappointed deep inside. He had meant to steal those very eggs for himself.
        - id: ch01-b14
          speaker: narrator
          text: A little farther on, the runaway cabbage slammed into a stump. Striped Chipmunk was sitting there with both cheek pockets stuffed full of yellow corn. The sudden jolt knocked him off balance. He tumbled behind the stump and landed right on old Mr. Toad, who had just sat down there to rest for a few minutes. The fall knocked all the breath out of Mr. Toad, and Striped Chipmunk spilled every bit of his corn.
        - id: ch01-b15
          speaker: narrator
          text: Prickly Porky the Porcupine heard the commotion and looked up. Something strange was bounding toward him down the Lone Little Path. He did not wait to find out what it was. Whenever he thought danger might be near, he did the same thing. He curled into a ball and hid his face in his waistcoat. A thousand little spears rose from his coat until he looked like a giant chestnut burr.
        - id: ch01-b16
          speaker: narrator
          text: The cabbage bounced away from the stump and struck Prickly Porky. At last, it stopped. His sharp little spears stuck fast in the spot where it had hit him. When Peter Rabbit and Jumper the Hare came hurrying up, the runaway cabbage lay there looking for all the world like a great green pincushion.
