audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gently rustic
        pace: measured
        pitch: medium
    prickly_porky:
      display_name: Prickly Porky
      tts:
        delivery: gruff and easily ruffled
        timbre: rough and bristly
        pace: measured
        pitch: medium-low
    mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: slow and solemn with dry humor
        timbre: deep and gravelly
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: "IX. MR. TOAD AND PRICKLY PORKY PUT THEIR HEADS TOGETHER"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Prickly Porky the Porcupine slowly climbed down from the top of a tall poplar tree. He had been eating tender young bark for breakfast. Now he carried a bundle of bark to take to Peter Rabbit's surprise party. The bundle made the climb awkward, and he grunted all the way down.
        - id: ch01-b02
          speaker: narrator
          text: When Prickly Porky reached the ground, he gave himself a hard shake. The thousand little spears hidden in his long coat rattled together.
        - id: ch01-b03
          speaker: mr_toad
          text: "Tee-hee-hee!"
        - id: ch01-b04
          speaker: prickly_porky
          text: "Who thinks they can laugh at me?"
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: Prickly Porky shook himself again. All those little spears rattled once more, and a few began to poke out through his long coat.
        - id: ch01-b06
          speaker: mr_toad
          text: "Nobody is laughing at you."
        - id: ch01-b07
          speaker: narrator
          text: The voice came from right behind him. Prickly Porky turned and saw old Mr. Toad sitting there. Mr. Toad's wide mouth was stretched even wider as he laughed to himself. Something had tickled him mightily.
        - id: ch01-b08
          speaker: narrator
          text: Prickly Porky scowled. A few more spears pushed out of his coat. No one likes being laughed at, and it certainly looked as though Mr. Toad was laughing at him.
        - id: ch01-b09
          speaker: narrator
          text: Mr. Toad stopped laughing, hopped one step closer, and slowly winked one eye.
        - id: ch01-b10
          speaker: mr_toad
          text: "It's a joke."
        - id: ch01-b11
          speaker: prickly_porky
          text: "Well, I don't see anything funny about it."
        - id: ch01-b12
          speaker: narrator
          text: Prickly Porky's voice sounded very fretful.
        - id: ch01-b13
          speaker: narrator
          text: Mr. Toad hopped another step nearer.
        - id: ch01-b14
          speaker: mr_toad
          text: "Are you on your way to Peter Rabbit's party?"
        - id: ch01-b15
          speaker: prickly_porky
          text: "Of course I am. What a silly thing to ask!"
        - id: ch01-b16
          speaker: mr_toad
          text: "Yes, yes. A very silly question indeed. But did you know that Sammy Jay, Blacky the Crow, Reddy Fox, and Shadow the Weasel weren't invited? They're planning to ruin the party and gobble up all the good things to eat."
        - id: ch01-b17
          speaker: narrator
          text: Prickly Porky put down his bundle of tender bark and stared at old Mr. Toad.
        - id: ch01-b18
          speaker: prickly_porky
          text: "How did you find that out?"
        - id: ch01-b19
          speaker: narrator
          text: A chuckle rumbled deep in Mr. Toad's throat.
        - id: ch01-b20
          speaker: mr_toad
          text: "Sammy Jay was sitting on a piece of bark when they made their plan. I happened to be underneath it. Of course, Sammy didn't know I was there, and I certainly didn't tell him."
        - id: ch01-b21
          speaker: prickly_porky
          text: "Of course you didn't."
        - id: ch01-b22
          speaker: narrator
          text: Prickly Porky was beginning to grin.
        - id: ch01-b23
          speaker: mr_toad
          text: "Of course I didn't."
        - id: ch01-b24
          speaker: narrator
          text: Mr. Toad was grinning now, too. Then he told Prickly Porky everything he had overheard. Reddy Fox, Shadow the Weasel, and Blacky the Crow meant to hide near Unc' Billy Possum's hollow tree. Sammy Jay would pretend Bowser the Hound was coming and scare everyone else away.
        - id: ch01-b25
          speaker: prickly_porky
          text: "Have you warned Peter Rabbit?"
        - id: ch01-b26
          speaker: mr_toad
          text: "Not yet. I'll tell him after a while. First, I want your help fooling Sammy Jay, Blacky the Crow, Reddy Fox, and Shadow the Weasel. Will you help me?"
        - id: ch01-b27
          speaker: prickly_porky
          text: "Of course I will, if I can. But what can I do?"
        - id: ch01-b28
          speaker: narrator
          text: Old Mr. Toad hopped close. He rose onto the tips of his toes and whispered into one of Prickly Porky's ears.
        - id: ch01-b29
          speaker: narrator
          text: A smile spread across Prickly Porky's face. Soon he was chuckling. Then he laughed so hard that he had to hold his sides.
        - id: ch01-b30
          speaker: mr_toad
          text: "Will you do it?"
        - id: ch01-b31
          speaker: narrator
          text: Prickly Porky reached down for his bundle of tender young bark. He was still chuckling.
        - id: ch01-b32
          speaker: prickly_porky
          text: "Of course I will. Come along, Mr. Toad. It's time for us to go."
