audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    prickly_porky:
      display_name: 豪猪刺毛波奇
      tts:
        delivery: 直率憨厚，容易着恼，笑起来毫不拘束
        timbre: 粗厚而温暖
        pace: 稍慢
        pitch: 中低音
    mr_toad:
      display_name: 蟾蜍老先生
      tts:
        delivery: 老成诙谐，说话不慌不忙，心里藏着主意
        timbre: 低沉圆润
        pace: 从容
        pitch: 低音
  chapters:
    - id: ch01
      title: 树下的笑声
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 豪猪刺毛波奇从高高的白杨树顶慢慢往下爬。他刚才一直待在树顶，拿鲜嫩的新树皮当早饭。这会儿，他还特意捆了一束树皮，打算带到彼得兔的惊喜聚会上。那束树皮压得他边爬边哼哼。好不容易落了地，他猛地一抖长外套，藏在里面的上千根小尖刺立刻沙沙响了起来。
        - id: ch01-b02
          speaker: mr_toad
          text: 嘻——嘻——嘻！
        - id: ch01-b03
          speaker: prickly_porky
          text: 谁这么大胆，竟敢笑我？
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 波奇使劲又抖了一下。藏在长外套里的小尖刺全都再次沙沙作响，还有几根已经从外套里冒出了头。
        - id: ch01-b05
          speaker: mr_toad
          text: 没人在笑你呀。
        - id: ch01-b06
          speaker: narrator
          text: 声音就在背后。波奇转身一看，原来蟾蜍老先生就坐在那里。他把那张大嘴咧得老宽，一个人笑个不停。也不知什么事在挠他的痒痒，竟把他逗成了这样。
        - id: ch01-b07
          speaker: narrator
          text: 波奇皱起眉，长外套里又有几根小尖刺探了出来。你知道，谁都不愿意让人当成笑话。何况蟾蜍老先生那副样子，怎么看都像是在笑他。
        - id: ch01-b08
          speaker: narrator
          text: 蟾蜍老先生终于止住笑，朝波奇跳近了一步，又慢吞吞地眨了眨一只眼睛。
        - id: ch01-b09
          speaker: mr_toad
          text: 我笑的是一件有趣的事。
        - id: ch01-b10
          speaker: prickly_porky
          text: 我可一点也没看出哪里有趣。
          emotion: angry
    - id: ch02
      title: 偷听来的计划
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 蟾蜍老先生又往前跳了一步。
        - id: ch02-b02
          speaker: mr_toad
          text: 你要去参加彼得兔的聚会吗？
        - id: ch02-b03
          speaker: prickly_porky
          text: 那还用问？我当然要去。你这问题真傻。
        - id: ch02-b04
          speaker: mr_toad
          text: 对，对，问得真傻，实在傻透了。可你知道吗？松鸦萨米、乌鸦布莱基、狐狸雷迪和黄鼠狼黑影都没收到邀请。他们打算把聚会搅散，再把那些好吃的全吞进肚子里。
        - id: ch02-b05
          speaker: narrator
          text: 波奇把那束鲜嫩的树皮放到地上，直盯着蟾蜍老先生。
        - id: ch02-b06
          speaker: prickly_porky
          text: 这事你怎么会知道？
        - id: ch02-b07
          speaker: narrator
          text: 蟾蜍老先生从喉咙深处发出一阵低低的笑声。
        - id: ch02-b08
          speaker: mr_toad
          text: 他们商量的时候，萨米坐在一块树皮上，我正好藏在树皮底下。他自然不知道我在那里，我也自然不会开口告诉他。
        - id: ch02-b09
          speaker: prickly_porky
          text: 那当然不能告诉他。
        - id: ch02-b10
          speaker: narrator
          text: 波奇忍不住笑了。蟾蜍老先生也笑着接过他的话。
        - id: ch02-b11
          speaker: mr_toad
          text: 可不是，当然不能说。
        - id: ch02-b12
          speaker: narrator
          text: 接着，蟾蜍老先生把偷听来的计划从头到尾讲了一遍。狐狸雷迪、黄鼠狼黑影和乌鸦布莱基要偷偷藏在负鼠比利大叔的树洞附近。松鸦萨米则会跑出来吓唬大家，装作猎犬鲍泽马上就要来了，好把其他客人统统吓走。
    - id: ch03
      title: 两位朋友有了主意
      blocks:
        - id: ch03-b01
          speaker: prickly_porky
          text: 这件事，你告诉彼得兔了吗？
        - id: ch03-b02
          speaker: mr_toad
          text: 还没有，我过一会儿就去。不过在那之前，我想请你帮忙。咱们先好好捉弄一下松鸦萨米、乌鸦布莱基、狐狸雷迪和黄鼠狼黑影。你愿不愿意？
        - id: ch03-b03
          speaker: prickly_porky
          text: 只要我做得到，我当然愿意。可你要我怎么做？
        - id: ch03-b04
          speaker: narrator
          text: 蟾蜍老先生跳到跟前，踮起脚，把嘴凑到波奇耳边，悄悄说了几句话。波奇先是微微一笑，接着低声笑起来，最后笑得只好用手捧住肚子。
        - id: ch03-b05
          speaker: mr_toad
          text: 怎么样，你肯照这个办法做吗？
        - id: ch03-b06
          speaker: narrator
          text: 波奇伸手拿起那束鲜嫩的树皮，嘴里还在笑。
        - id: ch03-b07
          speaker: prickly_porky
          text: 我当然肯。走吧，蟾蜍老先生，我们该出发了。
