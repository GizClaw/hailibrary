audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 慢悠悠又爱打趣，带着老弗吉尼亚乡音般的亲切腔调
        timbre: 粗暖松弛
        pace: 从容偏慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 喜欢雪，还是讨厌雪
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这时候，负鼠比利大叔可弄不明白了。他到底更喜欢雪呢，还是更讨厌雪？平常，他能躲开雪就躲开，一点儿也不愿意往雪地里去。偏偏这一次，雪帮了他一个大忙，把他从鸡舍里放了出来。
        - id: ch01-b02
          speaker: narrator
          text: 比利大叔一逃出鸡舍，马上动身去绿森林。可这段路实在难走。新落下来的雪又松又软，他每走一步，身子都陷下去，差不多一直没到腰。他喘个不停，嘴里还哼哼着，抱怨着。
        - id: ch01-b03
          speaker: narrator
          text: 整个冬天，比利大叔睡的觉太多了，哪里还吃得消这样的力气活。去绿森林的路还没走到一半，他就累得快挪不动了，只剩下张着嘴喘气的份儿。
        - id: ch01-b04
          speaker: narrator
          text: 到了这会儿，比利大叔总算拿定了主意。雪虽然帮他离开了布朗农场主家的鸡舍，可要问他究竟喜欢不喜欢，他还是讨厌得更多。
    - id: ch02
      title: 睡着的机灵劲儿
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 谁都不该让脑袋里的机灵劲儿睡过去。有人说，那不过是忘了事情。可忘事，不正是机灵劲儿打瞌睡吗？世上再没有什么比这更容易招来麻烦了。
        - id: ch02-b02
          speaker: narrator
          text: 比利大叔离开鸡舍的时候，他的机灵劲儿恰好睡着了。要是它们还睁着眼，他一定会记起那首小诗。
        - id: ch02-b03
          speaker: narrator
          text: 脑袋里的机灵劲儿，千万千万别睡着。若是一睡我便忘事，麻烦转眼就扑到。
        - id: ch02-b04
          speaker: narrator
          text: 可比利大叔的机灵劲儿就是睡得沉沉的。他满心只想着自己终于逃出了鸡舍，越想越高兴，别的事全被抛到了脑后。是的，先生，他真的忘了一件要紧事！
        - id: ch02-b05
          speaker: narrator
          text: 那是什么呢？柔软的白雪好心盖住了可怕的捕兽夹，让它们再也伤不到谁。可是，只要有人从雪里蹚过去，身后就一定会留下痕迹。比利大叔偏偏没想到这一层。
        - id: ch02-b06
          speaker: narrator
          text: 直到去绿森林的路走了一半，他坐下来歇一歇，想把气喘匀，才突然记起这件事。
    - id: ch03
      title: 雪地上的宽印迹
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 比利大叔扭头往身后一看，脸顿时白了。是的，先生，他真的吓白了脸！平平整整的白雪上，有一道宽阔的痕迹，从布朗农场主家的鸡舍一直拖到他脚下。那正是他一路蹚开积雪留下的。
        - id: ch03-b02
          speaker: narrator
          text: 布朗农场主家的男孩要是出来查看捕兽夹，马上就会发现它。他根本不用费心寻找，只要沿着痕迹往前走，就会一直追到比利大叔跟前。
        - id: ch03-b03
          speaker: unc_billy_possum
          text: 哎呀，哎呀！俺当初为什么非要离开鸡舍呀？
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: 现在，比利大叔脑袋里的机灵劲儿全醒了。可是回头已经不行。那男孩会从雪地上的痕迹看出他返回了鸡舍，随后把每个角落都找遍，非把他抓出来不可。
        - id: ch03-b05
          speaker: narrator
          text: 比利大叔只剩下一条路，那就是继续向前。他只能盼着大雪把那男孩困在家里，让他忙着铲开一条条路，忙到把捕兽夹忘得干干净净。
        - id: ch03-b06
          speaker: narrator
          text: 他深深吸了一口气，又转向绿森林，一步一步往前蹚。
        - id: ch03-b07
          speaker: unc_billy_possum
          text: 俺要是有双雪鞋该多好！俺要是也有松鸡太太那样的雪鞋就好了！
