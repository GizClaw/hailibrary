audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gently rustic
        pace: measured
        pitch: medium
    unc_billy:
      display_name: Unc' Billy Possum
      tts:
        delivery: easygoing and expressive with a gentle Southern flavor
        timbre: warm and slightly raspy
        pace: relaxed
        pitch: medium-low
  chapters:
    - id: ch01
      title: "Hard Going in the Snow"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Just then, Unc' Billy Possum could not decide how he felt about the snow. Did he like it more than he hated it, or hate it more than he liked it? Most of the time, he disliked snow and stayed out of it whenever he could. But this snow had helped him. It had helped him a great deal.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The moment he escaped from the henhouse, Unc' Billy headed for the Green Forest. But every step was a struggle. The new snow lay deep and soft, and he sank nearly to his middle as he pushed ahead. He huffed, puffed, grunted, and groaned.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Unc' Billy had slept so much that winter that he was not used to hard work. Before he had gone even halfway to the forest, he was worn out. He could barely move, and he was so short of breath that he could only gasp. By then, he felt quite sure he hated the snow more than he liked it, even though it had freed him from Farmer Brown's henhouse.
    - id: ch02
      title: "Sleepy Wits"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            It never pays to let your wits fall asleep. Some people call it forgetting, but forgetting is really nothing more than sleepy wits. And sleepy wits cause more trouble than almost anything else. Unc' Billy's wits had been fast asleep when he left Farmer Brown's henhouse. If they had been awake, he would have remembered a little saying.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The wits that live inside my head must never, never fall asleep. For if they do, I may forget, and Trouble soon may leap on me.
        - id: ch02-b03
          speaker: narrator
          text: >-
            But Unc' Billy's wits really had been asleep. He was so delighted to escape from the henhouse that he could think of nothing else. So he forgot. Yes, sir, Unc' Billy forgot something very important.
        - id: ch02-b04
          speaker: narrator
          text: >-
            What was it? The soft snow had kindly covered the dreadful traps and made them harmless. But no one could wade through that snow without leaving tracks. Unc' Billy never thought about those tracks until he was halfway to the Green Forest. Then he sat down to rest and catch his breath, and all at once, he remembered.
    - id: ch03
      title: "A Trail to Follow"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Unc' Billy looked back, and he turned pale. Yes, sir, he truly turned pale! A wide trail crossed the smooth white snow all the way from Farmer Brown's henhouse. Unc' Billy had plowed that trail himself. If Farmer Brown's boy came to inspect his traps, he would spot it at once. Then he would only have to follow it, and it would lead him straight to Unc' Billy.
        - id: ch03-b02
          speaker: unc_billy
          text: Oh, dear! Oh, dear! Ah never should have left that henhouse!
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: >-
            Unc' Billy wailed, but now his wits were wide awake. He could not turn back. Farmer Brown's boy would see that the trail returned to the henhouse. He would search every part of the place until he found Unc' Billy.
        - id: ch03-b04
          speaker: narrator
          text: >-
            No, Unc' Billy had to keep going. All he could do was hope Farmer Brown's boy was snowed in and too busy shoveling paths to remember the traps. Unc' Billy took a long breath and began wading toward the Green Forest once more.
        - id: ch03-b05
          speaker: unc_billy
          text: If only Ah had snowshoes! If only Ah had snowshoes like Mrs. Grouse!
