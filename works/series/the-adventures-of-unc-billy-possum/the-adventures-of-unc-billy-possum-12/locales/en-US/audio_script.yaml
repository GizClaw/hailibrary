  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gently rustic
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: "XII. PRICKLY PORKY MAKES HIMSELF AT HOME"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit's party looked as if it would be a great success. Old Mr. Toad had overheard Sammy Jay's plan and told Peter all about it. He also told Peter that Reddy Fox and Shadow the Weasel were hiding close by, inside an old hollow log.
        - id: ch01-b02
          speaker: narrator
          text: Peter quietly passed the news from ear to ear among the little forest and meadow people. He told each one that Prickly Porky was already sitting with his back pressed against the opening of that log.
        - id: ch01-b03
          speaker: narrator
          text: Everyone thought it was the best joke they had ever heard. They all knew Reddy and Shadow could never squeeze past the thousand little spears hidden in Prickly Porky's long coat.
        - id: ch01-b04
          speaker: narrator
          text: Prickly Porky made himself comfortable and began telling stories about his home, far away in the North Woods. Every few minutes, he rattled the thousand little spears in his coat. Nobody could see Reddy Fox or Shadow the Weasel inside the log, but they could all imagine the little shivers running up and down the backs of those two prisoners.
        - id: ch01-b05
          speaker: narrator
          text: Prickly Porky told them about the cold, cold winters in his northern home. Snow kept falling and piling higher until nearly all the forest folk who lived there had to leave. Some made the long trip south. Others tucked themselves into warm hollows in the trees or snug caves among the rocks. Then they slept through the long winter, just as Johnny Chuck does.
        - id: ch01-b06
          speaker: narrator
          text: He told them about the Indians who traveled through the great forest on wide, webbed shoes that kept them from sinking into the snow. They hunted for Lightfoot the Deer, but they never troubled Prickly Porky. They always treated him with the greatest respect.
        - id: ch01-b07
          speaker: narrator
          text: He had so many interesting things to tell about the great North Woods that all the meadow and forest folk crowded close to listen. Still, he never forgot the two scamps in the log. Every few minutes, right in the middle of a story, he shook his thousand little spears. Whenever he did, all his listeners smiled.
        - id: ch01-b08
          speaker: narrator
          text: Inside the hollow log, Reddy Fox was growing stiff and sore. There was not even enough room for him to turn over. Worse than that, he was so hungry he could have cried. He had crawled into the log very early that morning without eating breakfast. His plan had been to wait for Sammy Jay to break up Peter's party, then steal all the good things he wanted.
        - id: ch01-b09
          speaker: narrator
          text: Now Reddy could smell all that food. He could hear the others talking about the feast they would soon enjoy. And he knew that by the time Prickly Porky decided to let him out, there would not be one tiny crumb left for him.
        - id: ch01-b10
          speaker: narrator
          text: Shadow the Weasel was just as uncomfortable, and Shadow had a very short temper. Each time Reddy moved and squeezed him, Shadow snapped at Reddy. Both of them could hear every word spoken outside the log, and they did not like what they heard.
        - id: ch01-b11
          speaker: narrator
          text: Bobby Coon, Billy Mink, Johnny Chuck, Little Joe Otter, and Jimmy Skunk took turns telling about the mean things Reddy and Shadow had done and the sharp tricks they had played. The two prisoners grew so angry that they ground their teeth.
        - id: ch01-b12
          speaker: narrator
          text: But whenever either one made the smallest move, Prickly Porky gave his thousand little spears another shake. Then he settled his back even more firmly against the mouth of the hollow log. He was certainly enjoying himself. The thought of trapping clever, boastful Reddy Fox so easily tickled him almost to pieces.
        - id: ch01-b13
          speaker: narrator
          text: So they all waited through the long day for Unc' Billy Possum's family. At last, the family arrived, and the merriest surprise party anyone had ever seen began.
        - id: ch01-b14
          speaker: narrator
          text: Only Sammy Jay, Blacky the Crow, Reddy Fox, and Shadow the Weasel were unhappy. And, of course, nobody cared about that.
