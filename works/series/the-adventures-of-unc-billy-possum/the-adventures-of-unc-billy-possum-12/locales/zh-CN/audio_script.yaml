audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
  chapters:
    - id: ch01
      title: 木头洞口的好玩笑
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔的聚会眼看就要办得圆满极了。蟾蜍老先生无意中听到了松鸦萨米的诡计，不仅把事情全告诉了彼得，还告诉他，狐狸雷迪和黄鼠狼黑影就躲在附近一截空心老木头里。
        - id: ch01-b02
          speaker: narrator
          text: 彼得马上把消息悄悄传给绿森林和绿草地的每一位小居民。他还说，豪猪刺毛波奇正在木头洞口坐着，后背正好把出口堵得严严实实。
        - id: ch01-b03
          speaker: narrator
          text: 大家一听，都觉得再没有比这更好笑的事了。刺毛波奇那件长外套里藏着上千根小尖刺。狐狸雷迪和黄鼠狼黑影要想从他身后挤出去，根本没有可能。
        - id: ch01-b04
          speaker: narrator
          text: 刺毛波奇坐得舒舒服服，讲起了遥远的北方大森林，讲他的老家是什么模样。每过几分钟，他就抖抖外套，让上千根小尖刺沙沙作响。外面谁也看不见木头里的两个小坏蛋，可谁都想得到，那声音一响，寒战准会顺着他们的脊梁骨来回跑。
        - id: ch01-b05
          speaker: narrator
          text: 刺毛波奇说，北方的冬天冷得很，雪越下越深。住在那里的森林居民，大多只好走很远的路，搬到南方去。留下来的，就躲进树洞或岩洞，找个温暖安稳的地方，像土拨鼠约翰尼一样睡过整个冬天。
        - id: ch01-b06
          speaker: narrator
          text: 他还讲到，印第安人会穿着宽大的网状雪鞋走过茫茫森林。有了那双鞋，他们就不会陷进雪里。他们会追猎小鹿轻蹄，却从不招惹刺毛波奇，对他总是敬畏得很。
        - id: ch01-b07
          speaker: narrator
          text: 北方大森林里的新鲜事，一件接着一件。绿草地和绿森林的小居民越围越近，全都听入了迷。不过，刺毛波奇每隔一会儿还是要抖响他的尖刺。沙沙声一传出来，大家便忍不住相视而笑。
    - id: ch02
      title: 雷迪饿得想哭
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 空心木头里面，狐狸雷迪挤得浑身僵硬，哪儿都酸痛。那里窄得可怜，他连身子都翻不了。偏偏肚子又饿得厉害，简直快要哭出来了。
        - id: ch02-b02
          speaker: narrator
          text: 原来，雷迪一大早连饭都没吃，就爬进木头躲好。他盘算得挺美，等松鸦萨米把彼得兔的聚会搅散，自己就出去，把爱吃的东西随意拿个够。
        - id: ch02-b03
          speaker: narrator
          text: 可现在呢？盛宴的香味一阵阵钻进木头，外面的客人还在兴冲冲地谈论那顿大餐。雷迪只能闻，只能听，什么也吃不到。他很清楚，等刺毛波奇肯让开洞口时，别说好吃的，连一点点碎屑都不会留给他了。
    - id: ch03
      title: 最快乐的惊喜聚会
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 黄鼠狼黑影也没比雷迪舒服多少，而且他的脾气出了名的暴躁。雷迪只要稍微一动，挤到了他，他就会恶狠狠地朝雷迪咬过去。
        - id: ch03-b02
          speaker: narrator
          text: 外面说的每一句话，他们都听得清清楚楚。可那些话，哪一句也不顺耳。浣熊博比、水貂比利、土拨鼠约翰尼、水獭小乔，还有臭鼬吉米，轮流数落雷迪和黑影做过的坏事，也把他们耍过的阴险花招一件件说了出来。
        - id: ch03-b03
          speaker: narrator
          text: 木头里的两个小囚犯气得咬牙切齿。可是，他们才动一点点，刺毛波奇便抖响上千根尖刺，又把身子往洞口抵紧几分。他玩得开心极了。平时总爱吹嘘自己聪明的雷迪，竟这样轻轻松松就被他困住了。刺毛波奇只要想到这里，便乐得浑身发痒。
        - id: ch03-b04
          speaker: narrator
          text: 就这样，大家等了一整天，终于等来了负鼠比利大叔一家。客人到齐以后，一场从未有过的快乐惊喜聚会热热闹闹地开始了。
        - id: ch03-b05
          speaker: narrator
          text: 只有松鸦萨米、乌鸦布莱基、狐狸雷迪和黄鼠狼黑影一点也不快乐。当然了，根本没有谁在乎他们快不快乐。
