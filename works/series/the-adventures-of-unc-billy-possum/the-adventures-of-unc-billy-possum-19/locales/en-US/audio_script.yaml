  chapters:
    - id: ch01
      title: "What the Snow Did"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Unc' Billy Possum had plenty to think about. He was every bit as much a prisoner as if someone had locked him in a cage. He might not have minded being stuck in the henhouse if two worries had not troubled him so badly.
        - id: ch01-b02
          speaker: narrator
          text: >-
            First, he feared that his old friend and partner, Jimmy Skunk, might get hungry for eggs. Jimmy could come looking for them and walk straight into one of the traps. Worse still, Farmer Brown's boy might reach beneath the hay in the highest nest, the last one in the darkest corner. That was where Billy was hiding.
        - id: ch01-b03
          speaker: narrator
          text: >-
            So Billy spent most of his time thinking hard. He tried to find some way out. If he could not escape, then he needed a way to warn Jimmy Skunk to stay away from Farmer Brown's henhouse.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Without those worries, Billy would gladly have stayed all winter. The henhouse was wonderfully warm and cozy. He knew which nest Mrs. Speckles always chose and which one Mrs. Feathertoes liked best. He also knew that their eggs were the finest in the whole henhouse.
        - id: ch01-b05
          speaker: narrator
          text: >-
            With as many eggs as he could eat, Billy had become very particular. Only the best would satisfy him now. He would curl up beneath the hay in that last, high nest and wait until Mrs. Speckles called out in her sharp voice.
        - id: ch01-b06
          speaker: mrs_speckles
          text: Cut, cut, cut, cut, cut, cut-aa-cut! My eggs are the finest in the world!
        - id: ch01-b07
          speaker: narrator
          text: >-
            Billy would chuckle quietly, then wait a little longer. Soon Mrs. Feathertoes would answer.
        - id: ch01-b08
          speaker: mrs_feathertoes
          text: Cut, cut, cut, cut, cut-aa-cut, cut, cut, cut! Nobody lays eggs as splendid as mine!
        - id: ch01-b09
          speaker: narrator
          text: >-
            Then the two hens would begin arguing over whose eggs were better. While they were busy with that, Billy would slip from his hiding place and eat both freshly laid eggs for breakfast.
        - id: ch01-b10
          speaker: narrator
          text: >-
            This went on for almost a week. Billy lived in Farmer Brown's henhouse, ate the eggs laid by Mrs. Speckles and Mrs. Feathertoes, and hid under the hay in the last nest of the top row, deep in the darkest corner.
        - id: ch01-b11
          speaker: narrator
          text: >-
            But he shivered whenever he heard Farmer Brown's boy talking about what he would do if he caught the egg thief. Some days the henhouse door stood open. Billy would peek outside and wish he dared make a run for it. He never did. Bowser the Hound was always prowling nearby, and someone would almost surely see him.
        - id: ch01-b12
          speaker: narrator
          text: >-
            At last, snow began to fall. It came down all day and kept falling through the night. Rough Brother North Wind swept it into great drifts before the henhouse door and all along one side of the building. The traps disappeared so deep beneath the snow that they could not possibly catch anyone.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The moment the snow stopped, Billy went to the very hole where he had entered the henhouse. He began digging upward until he could reach the top of the drift. He did not enjoy it, because Unc' Billy Possum does not like snow. But this was his chance to get away, and he meant to use it well.
