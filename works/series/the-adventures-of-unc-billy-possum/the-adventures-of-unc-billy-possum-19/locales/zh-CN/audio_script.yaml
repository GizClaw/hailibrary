audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 慢悠悠又爱打趣，带着老弗吉尼亚乡音般的亲切腔调
        timbre: 粗暖松弛
        pace: 从容偏慢
        pitch: 中低音
    mrs_speckles:
      display_name: 斑点太太
      tts:
        delivery: 得意爽快，说起自己的鸡蛋格外神气
        timbre: 明亮清脆
        pace: 轻快
        pitch: 高音
    mrs_feathertoes:
      display_name: 羽趾太太
      tts:
        delivery: 骄傲活泼，不肯在争论中落后半分
        timbre: 轻盈清亮
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 囚徒的两桩心事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 负鼠比利大叔想了又想。他成了囚徒，跟关在笼子里没什么两样。其实，困在鸡舍里倒不要紧，真正叫他放不下的是两桩心事。
        - id: ch01-b02
          speaker: narrator
          text: 第一桩，是他的老朋友兼老搭档臭鼬吉米。要是吉米馋起鸡蛋，跑来一脚踩进捕兽夹怎么办？比利大叔想想就害怕。
        - id: ch01-b03
          speaker: narrator
          text: 可第二桩更吓人。万一布朗农场主家的男孩突然把手伸进最高一排最后一个鸡窝的干草底下呢？那里正是鸡舍最暗的角落，也是比利大叔藏身的地方。
        - id: ch01-b04
          speaker: narrator
          text: 所以，比利大叔整天都在动脑筋。他得找条路逃出去。实在逃不掉，也得警告吉米，千万别靠近布朗农场主家的鸡舍。
    - id: ch02
      title: 顶顶好的鸡蛋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 要不是这两桩烦心事，比利大叔真愿意住上一整个冬天。鸡舍里又暖和又舒服。他知道斑点太太总在哪儿下蛋，也知道羽趾太太最中意哪个鸡窝。
        - id: ch02-b02
          speaker: narrator
          text: 布朗农场主家所有母鸡下的蛋里，斑点太太和羽趾太太的最好吃。鸡蛋想吃多少就有多少，比利大叔的嘴越吃越刁。不是顶顶好的，他碰都不想碰。
        - id: ch02-b03
          speaker: narrator
          text: 每天，他都蜷在最暗的角落里，躲进最高一排最后那个鸡窝。过不了多久，斑点太太尖细的声音就会响起。她下完蛋，总要得意地叫上一阵。
        - id: ch02-b04
          speaker: mrs_speckles
          text: 咯，咯，咯，咯，咯，咯——咯咯！全世界最好吃的蛋，就是我下的！
        - id: ch02-b05
          speaker: narrator
          text: 比利大叔听了，只在暗处偷笑。他还要再等一小会儿。果然，羽趾太太很快也开了口。
        - id: ch02-b06
          speaker: mrs_feathertoes
          text: 咯，咯，咯，咯，咯——咯咯，咯，咯，咯！要说蛋下得棒，谁也比不过我！
        - id: ch02-b07
          speaker: narrator
          text: 斑点太太和羽趾太太立刻争起来，都说自己的蛋最好。比利大叔趁她们争个不停，悄悄溜出鸡窝，把两只刚下的蛋全吃了，正好当早饭。
        - id: ch02-b08
          speaker: narrator
          text: 这样的日子过了快一星期。比利大叔住在鸡舍里，吃着两位太太下的蛋，平时就藏在最高一排最后那个鸡窝。那里最暗，干草正好能遮住他。
        - id: ch02-b09
          speaker: narrator
          text: 可每当布朗农场主家的男孩说起，要是抓到了偷蛋贼，一定要让那个家伙怎样怎样，比利大叔听着就直哆嗦。
        - id: ch02-b10
          speaker: narrator
          text: 白天，鸡舍门有时也会开着。比利大叔向外望，多想鼓足勇气冲出去啊！但他不敢。猎犬鲍泽老在附近转悠，他一露面，也很可能被别人看见。
    - id: ch03
      title: 大雪铺出的路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 终于有一天，雪落了下来。它下了一整天，又下了一整夜。粗暴的北风兄弟卷着雪，堆起一座座雪堆。鸡舍门前堆满了，一侧也铺满了。
        - id: ch03-b02
          speaker: narrator
          text: 捕兽夹全被深埋在雪下，再也夹不到谁了。雪一停，比利大叔马上找到当初钻进鸡舍的洞口，从那里用力往上挖，要一直挖到积雪顶上。
        - id: ch03-b03
          speaker: narrator
          text: 比利大叔一点儿也不喜欢在雪里挖，因为他本来就讨厌雪。可是现在，逃走的机会终于来了。他下定决心，一定要好好抓住这个机会。
