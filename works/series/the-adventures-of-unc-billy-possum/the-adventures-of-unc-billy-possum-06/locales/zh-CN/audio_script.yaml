audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵自得，盘算时透着狡猾
        timbre: 清脆明亮
        pace: 轻快灵活
        pitch: 中高音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 狡猾得意，说话时总带着几分刻薄
        timbre: 尖细灵活
        pace: 轻快
        pitch: 中高音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 直率倔强，懒洋洋中带着粗朴的自信
        timbre: 浑厚结实
        pace: 稍缓
        pitch: 中低音
    drummer_woodpecker:
      display_name: 啄木鸟鼓手
      tts:
        delivery: 热心直爽，抱怨时嘴硬心软
        timbre: 清脆明亮
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第六章　松鸦萨米探到了彼得兔的秘密
      blocks:
        - id: ch01-b01
          speaker: sammy_jay
          text: 俺是松鸦老先生，嘻嘻嘻！俺是松鸦老先生，快瞧仔细！若想把俺骗过去，天不亮就得早早起。
        - id: ch01-b02
          speaker: narrator
          text: 松鸦萨米梳理着那身神气又漂亮的蓝白外套，把这支歌哼了一遍又一遍。唱完以后，他自己先笑了起来。四下明明没有谁离得够近，根本听不见他说话，他还是自言自语起来。
        - id: ch01-b03
          speaker: sammy_jay
          text: 彼得兔藏着一个秘密。他只要到处跟人说悄悄话，准是有秘密。他以为这事能瞒住我，那可不行！秘密只要让两个人以上知道，就再也守不住了。彼得已经跟五个人咬过耳朵。我要去探探狐狸雷迪的口风。
        - id: ch01-b04
          speaker: narrator
          text: 萨米把尾巴一摆，飞向绿草地。狐狸雷迪正在那里忙着找早饭。
        - id: ch01-b05
          speaker: sammy_jay
          text: 早上好啊，狐狸雷迪。今天天气真不错。
        - id: ch01-b06
          speaker: reddy_fox
          text: 我要是能快点填饱肚子，这天气才叫更不错呢。
        - id: ch01-b07
          speaker: sammy_jay
          text: 彼得兔那个秘密可真有意思，对不对？
        - id: ch01-b08
          speaker: narrator
          text: 萨米装出一副什么都知道的聪明样子。雷迪一听，马上竖起两只尖尖的小耳朵。
        - id: ch01-b09
          speaker: reddy_fox
          text: 什么秘密？
        - id: ch01-b10
          speaker: sammy_jay
          text: 你要是不知道，我就不告诉你。
        - id: ch01-b11
          speaker: narrator
          text: 萨米反驳得理直气壮，仿佛自己真知道全部内情。接着，他便飞去找表哥乌鸦布莱基。布莱基根本没听说过这个秘密。萨米半路又遇见黄鼠狼黑影，可黑影同样不知情。即便这样，萨米也一点儿没泄气。
        - id: ch01-b12
          speaker: sammy_jay
          text: 我再去问问土拨鼠约翰尼。他肯定知道。
        - id: ch01-b13
          speaker: narrator
          text: 萨米找到约翰尼时，他正坐在家门口，看着外面的世界从眼前经过。萨米落下来，深深鞠了一躬。
        - id: ch01-b14
          speaker: sammy_jay
          text: 早上好，土拨鼠约翰尼。
        - id: ch01-b15
          speaker: johnny_chuck
          text: 早上好。
        - id: ch01-b16
          speaker: narrator
          text: 约翰尼一向待人有礼。萨米又摆出那副仿佛什么都知道的样子。
        - id: ch01-b17
          speaker: sammy_jay
          text: 彼得兔的秘密真不错，是不是？
        - id: ch01-b18
          speaker: narrator
          text: 约翰尼扬起两道眉毛，脸上摆出一副惊讶极了的神情。
        - id: ch01-b19
          speaker: johnny_chuck
          text: 快说说看，那究竟是什么秘密？
        - id: ch01-b20
          speaker: sammy_jay
          text: 你既然不知道，我可不能告诉你。那样就不公平了。
        - id: ch01-b21
          speaker: narrator
          text: 萨米竭力摆出老实无辜的模样，然后飞向绿森林。飞在路上，他又悄悄下了判断。
        - id: ch01-b22
          speaker: sammy_jay
          text: 土拨鼠约翰尼骗不了我。他明明知道彼得兔的秘密。
        - id: ch01-b23
          speaker: narrator
          text: 到了绿森林，萨米看见啄木鸟鼓手正敲打一棵老栗树的空心枝干，闹出了好大的响声。他在旁边落下，听完一长串哒哒哒、哒哒哒。
        - id: ch01-b24
          speaker: sammy_jay
          text: 哎呀，敲得真棒！我要是也会这一手就好了。你一定是在练习吧？
        - id: ch01-b25
          speaker: narrator
          text: 这番话把啄木鸟鼓手夸得心里美滋滋的。
        - id: ch01-b26
          speaker: drummer_woodpecker
          text: 没错。我正为彼得兔的聚会练习呢。
          emotion: happy
        - id: ch01-b27
          speaker: sammy_jay
          text: 我早就猜到了。
        - id: ch01-b28
          speaker: narrator
          text: 其实萨米原先根本没往这上面想。鼓手敲了那么久，这时也坐下来歇息，又说起了那场聚会。
        - id: ch01-b29
          speaker: drummer_woodpecker
          text: 到时候，负鼠比利大叔一定会大吃一惊吧？
        - id: ch01-b30
          speaker: sammy_jay
          text: 那当然。他准会吓一大跳。
        - id: ch01-b31
          speaker: narrator
          text: 萨米接着把鼓手夸了又夸。鼓手终于把整个计划都说了出来。原来，彼得要为负鼠比利大叔办一场惊喜聚会。
        - id: ch01-b32
          speaker: narrator
          text: 过了一会儿，萨米踏上归途。他一路咯咯直笑，又唱起那支得意的小歌。
        - id: ch01-b33
          speaker: sammy_jay
          text: 若想把俺骗过去，天不亮就得早早起。
          emotion: happy
