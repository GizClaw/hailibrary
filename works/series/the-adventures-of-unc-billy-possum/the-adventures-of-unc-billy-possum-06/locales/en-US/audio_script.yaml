audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gently rustic
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: boastful and nosily playful
        timbre: bright and piercing
        pace: quick
        pitch: high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and sharp
        timbre: light and wiry
        pace: quick
        pitch: medium-high
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: courteous and straightforward
        timbre: round and earthy
        pace: unhurried
        pitch: medium-low
    drummer_woodpecker:
      display_name: Drummer the Woodpecker
      tts:
        delivery: eager and proudly animated
        timbre: crisp and resonant
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: "VI. SAMMY JAY LEARNS PETER RABBIT'S SECRET"
      blocks:
        - id: ch01-b01
          speaker: sammy_jay
          text: "I'm Mr. Jaybird, tee-hee-hee! I'm Mr. Jaybird. Just watch me! You'll have to rise before break of day if you want to fool old Mr. Jay."
        - id: ch01-b02
          speaker: narrator
          text: Sammy Jay hummed those words over and over while he brushed his handsome blue-and-white coat. Then he laughed and spoke aloud, though no one was close enough to hear him.
        - id: ch01-b03
          speaker: sammy_jay
          text: "Peter Rabbit has a secret. Whenever Peter goes around whispering, you can be sure of that. He thinks he can hide it from me, but he can't. Oh, no! Two people might keep a secret, but more than two never can. I've already seen Peter whispering to five. I'll find out what Reddy Fox knows."
        - id: ch01-b04
          speaker: narrator
          text: Sammy flicked his tail and flew to the Green Meadows. There he found Reddy Fox hunting for his breakfast.
        - id: ch01-b05
          speaker: sammy_jay
          text: "Fine morning, isn't it, Reddy?"
        - id: ch01-b06
          speaker: reddy_fox
          text: "It would be finer if I could fill my stomach a little faster."
        - id: ch01-b07
          speaker: sammy_jay
          text: "Peter Rabbit has quite a secret, doesn't he?"
        - id: ch01-b08
          speaker: narrator
          text: Sammy tried to look as if he knew everything. Reddy's sharp little ears pricked up.
        - id: ch01-b09
          speaker: reddy_fox
          text: "What secret?"
        - id: ch01-b10
          speaker: sammy_jay
          text: "If you don't know, then I'm not telling you."
        - id: ch01-b11
          speaker: narrator
          text: Sammy spoke as though he knew all about it. Then he flew off to find his cousin Blacky the Crow. Blacky knew nothing about Peter's secret. Neither did Shadow the Weasel, whom Sammy met along the way. Still, Sammy wasn't discouraged at all.
        - id: ch01-b12
          speaker: sammy_jay
          text: "I'll try Johnny Chuck. He'll know."
        - id: ch01-b13
          speaker: narrator
          text: Sammy found Johnny sitting on his doorstep and watching the world go by.
        - id: ch01-b14
          speaker: sammy_jay
          text: "Good morning, Johnny Chuck."
        - id: ch01-b15
          speaker: narrator
          text: Sammy gave him a low bow.
        - id: ch01-b16
          speaker: johnny_chuck
          text: "Good morning, Sammy."
        - id: ch01-b17
          speaker: narrator
          text: Johnny Chuck was always polite.
        - id: ch01-b18
          speaker: sammy_jay
          text: "That's a fine secret Peter Rabbit has, isn't it?"
        - id: ch01-b19
          speaker: narrator
          text: Once again, Sammy acted as though he knew the whole secret. Johnny raised his eyebrows and looked as surprised as he could.
        - id: ch01-b20
          speaker: johnny_chuck
          text: "Oh, please tell me what it is!"
          emotion: surprised
        - id: ch01-b21
          speaker: sammy_jay
          text: "Well, if you don't know, I won't tell you. That wouldn't be fair."
        - id: ch01-b22
          speaker: narrator
          text: Sammy did his best to look honest and innocent. Then he flew toward the Green Forest, thinking to himself as he went.
        - id: ch01-b23
          speaker: sammy_jay
          text: "Johnny Chuck can't fool me. He knows Peter Rabbit's secret."
        - id: ch01-b24
          speaker: narrator
          text: In the Green Forest, Drummer the Woodpecker was pounding away on the hollow limb of an old chestnut tree. Sammy settled nearby and listened until one long rat-a-tat-tat came to an end.
        - id: ch01-b25
          speaker: sammy_jay
          text: "My, that sounds wonderful! I wish I could do that. You must be practicing."
        - id: ch01-b26
          speaker: narrator
          text: Drummer was very flattered.
        - id: ch01-b27
          speaker: drummer_woodpecker
          text: "I am. I'm practicing for Peter Rabbit's party."
        - id: ch01-b28
          speaker: sammy_jay
          text: "That's just what I thought."
        - id: ch01-b29
          speaker: narrator
          text: Of course, Sammy had thought nothing of the kind.
        - id: ch01-b30
          speaker: drummer_woodpecker
          text: "Won't Unc' Billy Possum be surprised?"
        - id: ch01-b31
          speaker: narrator
          text: Drummer sat down to rest.
        - id: ch01-b32
          speaker: sammy_jay
          text: "He certainly will."
        - id: ch01-b33
          speaker: narrator
          text: Sammy went on flattering Drummer, again and again. At last, Drummer told him the whole plan. Peter was arranging a surprise party for Unc' Billy Possum.
        - id: ch01-b34
          speaker: narrator
          text: Later, as Sammy flew home, he chuckled to himself.
        - id: ch01-b35
          speaker: sammy_jay
          text: "You'll have to rise before break of day if you want to fool old Mr. Jay."
