audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gently rustic
        pace: measured
        pitch: medium
    mrs_possum:
      display_name: Old Mrs. Possum
      tts:
        delivery: motherly and spirited with a gently teasing edge
        timbre: warm and slightly weathered
        pace: unhurried
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: boastful and nosily playful
        timbre: bright and piercing
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: "XIV. OLD MRS. POSSUM GROWS WORRIED"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mrs. Possum counted her babies to make sure they were all tucked up snug and warm in their bed inside the old hollow tree.
        - id: ch01-b02
          speaker: mrs_possum
          text: One, two, three, four, five, six, seven, eight.
        - id: ch01-b03
          speaker: narrator
          text: Every one of them was there, safe and snug in bed. She looked at them with great pride, then sighed as she thought about how soon they would leave. The moment beautiful spring came, her babies would begin to slip away one by one. They would leave the old hollow tree, go out to see the great world, and make homes of their own. Mrs. Possum sighed again. She did not like winter. No, sir, she did not like it one bit. But when she thought about her babies leaving, she almost wished spring would never come.
        - id: ch01-b04
          speaker: narrator
          text: Once she was sure the babies were warm and comfortable, Mrs. Possum went to the door and peered outside. Anyone could see that she was worried. This was the tenth time she had looked out in half an hour. Her sharp little old face seemed sharper than ever. That always happened when she worried, just as worry makes some people's tongues sharper.
        - id: ch01-b05
          speaker: mrs_possum
          text: I just can't see what's keeping my old man. I'm worried near to death.
        - id: ch01-b06
          speaker: narrator
          text: At that very moment, a noise outside sent her hurrying back to the door. She thrust out her head once more. Sammy Jay was shrieking at the top of his lungs.
        - id: ch01-b07
          speaker: sammy_jay
          text: Thief! Thief! Thief!
        - id: ch01-b08
          speaker: narrator
          text: Mrs. Possum knew Sammy was a thief himself and a low-down maker of mischief, no matter how smart his clothes looked. Still, he knew a great deal about everything happening in the Green Forest. Perhaps he had seen her old man. So Mrs. Possum tried to make her sharp face look as pleasant as she could. She smiled across at Sammy in the next tree, showing every one of her sharp teeth.
        - id: ch01-b09
          speaker: mrs_possum
          text: Good morning, Brother Jay.
        - id: ch01-b10
          speaker: sammy_jay
          text: Hello! Where's Uncle Billy Possum?
        - id: ch01-b11
          speaker: narrator
          text: Sammy was not polite about it. Mrs. Possum shook her head. The worried look came back, though she tried very, very hard to hide it.
        - id: ch01-b12
          speaker: mrs_possum
          text: He went out for a walk. I suppose you just got up. Otherwise, you would have met him somewhere.
        - id: ch01-b13
          speaker: narrator
          text: She said that only to get Sammy talking. Sammy Jay had a quick temper, and quick-tempered people often say much more than they mean to. Mrs. Possum felt sure he would torment her by keeping quiet if he knew how worried she was about Unc' Billy. Being mean and tormenting others was just the sort of thing Sammy loved to do.
        - id: ch01-b14
          speaker: narrator
          text: Sammy's temper flared at once.
        - id: ch01-b15
          speaker: sammy_jay
          text: I've been awake since sunrise! Your old man isn't anywhere in the Green Forest, unless he's sleeping in some other hollow tree. And if he is, I don't blame him one bit. No, sir, not one bit!
          emotion: angry
        - id: ch01-b16
          speaker: mrs_possum
          text: Keep your temper, Brother Jay! Keep your temper, do, oh, pray!
        - id: ch01-b17
          speaker: narrator
          text: Mrs. Possum gave him the most aggravating grin and turned back to her babies. She had learned what she wanted to know. Sammy Jay had seen nothing of Unc' Billy Possum. Then she sat down with her head in her hands. Now she was more worried than ever.
