audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    old_mrs_possum:
      display_name: 负鼠老太太
      tts:
        delivery: 慈爱精明，带着老弗吉尼亚乡音般的亲切腔调
        timbre: 温厚略带沙哑
        pace: 中等偏慢
        pitch: 中低音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 尖刻急躁，话一出口便带着挑衅
        timbre: 清脆尖亮
        pace: 偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 孩子们和迟迟未归的老头子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 负鼠老太太把孩子们数了一遍。她要确定八个小家伙全都安稳地睡在绿森林那棵老空心树里，床铺舒舒服服，身上也暖暖和和。
        - id: ch01-b02
          speaker: old_mrs_possum
          text: 一、二、三、四、五、六、七、八。
        - id: ch01-b03
          speaker: narrator
          text: 一个也不少。她骄傲地望着孩子们，可想到他们很快就要离开，又忍不住叹了口气。美丽的春天一到，他们就会一个接一个悄悄走出这棵老空心树，去看看广大的世界，再各自安家。她又叹了一声。负鼠老太太不喜欢冬天。不，先生，一点儿也不喜欢。可想到孩子们就要离开自己，她又几乎盼着春天永远别来。
        - id: ch01-b04
          speaker: narrator
          text: 见孩子们睡得又暖又舒服，她走到门口往外看。谁都能瞧出她在担心。短短半个钟头，她已经看了十次。那张尖尖的老脸显得比平时更尖了。她着急时，脸总会变尖，就像有些人一着急，说话也会变得尖刻。
        - id: ch01-b05
          speaker: old_mrs_possum
          text: 俺真弄不明白，俺家老头子到底叫啥事绊住啦！俺都快担心死了。
          emotion: fearful
    - id: ch02
      title: 松鸦萨米知道些什么
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 就在她低声嘟囔的时候，外面忽然传来一阵响动。负鼠老太太赶紧奔到门边，又一次把脑袋探了出去。原来是松鸦萨米，正扯着嗓子尖叫，喊声响得不能再响。
        - id: ch02-b02
          speaker: sammy_jay
          text: 有贼！有贼！有贼！
        - id: ch02-b03
          speaker: old_mrs_possum
          text: 他自个儿就是个贼，还是个卑鄙的捣蛋鬼，别看衣裳穿得挺神气。不过，绿森林里出了啥事，他知道得可多啦。说不定，他见过俺家老头子。
        - id: ch02-b04
          speaker: narrator
          text: 她把那张本来就尖尖的老脸，努力堆出最和气的样子，又朝待在旁边那棵树上的萨米笑了笑。这一笑不要紧，满嘴尖牙全都露了出来。
        - id: ch02-b05
          speaker: old_mrs_possum
          text: 早上好啊，松鸦兄弟。
        - id: ch02-b06
          speaker: sammy_jay
          text: 你好！负鼠比利大叔在哪儿？
        - id: ch02-b07
          speaker: narrator
          text: 萨米一点儿也不客气。负鼠老太太摇摇头，忧心忡忡的神色又回到了脸上。她拼命忍着，哦，真是用尽了力气，不想让萨米看出来自己有多担心。
        - id: ch02-b08
          speaker: old_mrs_possum
          text: 他出去散步啦。俺寻思，你准是才起床。要不然，早该在什么地方碰见他了。
    - id: ch03
      title: 一句气话里的答案
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 负鼠老太太故意这么说，只是想引萨米开口。萨米脾气很急，而脾气急的人，常会把本不想说的话也一股脑儿倒出来。她心里很清楚，要是让这个心眼儿坏、最爱捉弄人的家伙发现自己正为比利大叔担心，他准会闭紧嘴巴，不肯说到底见没见过他。
        - id: ch03-b02
          speaker: narrator
          text: 果然，萨米的火气一下子蹿了上来。
        - id: ch03-b03
          speaker: sammy_jay
          text: 太阳刚升起来我就起床了！你家老头子根本不在绿森林里。除非他钻进别的空心树睡觉去了。真是那样，我也一点儿不怪他！不，先生，我半点儿也不怪他！
          emotion: angry
        - id: ch03-b04
          speaker: old_mrs_possum
          text: 消消气吧，松鸦兄弟！消消气吧，求求你！
        - id: ch03-b05
          speaker: narrator
          text: 负鼠老太太咧嘴一笑，那笑容真能把人气坏。接着，她转身回到孩子们身边。想知道的事已经探出来了，松鸦萨米根本没见过负鼠比利大叔。她坐下来，双手托着脑袋。这一回，她比刚才更加担心了。
