audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 慢悠悠又爱打趣，带着老弗吉尼亚乡音般的亲切腔调
        timbre: 粗暖松弛
        pace: 从容偏慢
        pitch: 中低音
    old_mrs_possum:
      display_name: 负鼠老太太
      tts:
        delivery: 慈爱精明，带着老弗吉尼亚乡音般的亲切腔调
        timbre: 温厚略带沙哑
        pace: 中等偏慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 满脑子都是鸡蛋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 要是比利大叔没有碰巧站在绿森林那棵大空心树门口往外看，要是臭鼬吉米没有正好经过，要是比利大叔没问他去了哪儿，吉米也没提到新鲜鸡蛋，那么，比利大叔就不会干傻事，负鼠老太太也不用担心。偏偏这些事全都发生了。
        - id: ch01-b02
          speaker: narrator
          text: 吉米一说起那顿用新鲜鸡蛋做成的美味早餐，比利大叔心里便再也装不下别的东西。他知道吉米从哪儿弄来的。是的，先生，他清楚得很。只要一闭眼，他就能看见布朗农场主家的鸡舍。鸡舍的一头，母鸡和公鸡一排排蹲在横木上，脑袋藏在翅膀底下。鸡窝也排成一排，里面放着漂亮的褐色鸡蛋。
        - id: ch01-b03
          speaker: narrator
          text: 吉米不会爬高，所以只能拿到低处鸡窝里的蛋。要是比利大叔当时也在那里，他却能一直爬到最高的鸡窝，然后……可现在想这些有什么用？他当时没去，这会儿也去不成，因为天已经亮了。
    - id: ch02
      title: 怎么也安静不下来
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 接下来一整天，比利大叔一次又一次试着睡觉。真睡着了，梦见的是鲜美、新鲜、可口的鸡蛋。醒着呢，想的还是鸡蛋。他越来越不安，动来动去，一刻也停不住。负鼠老太太终于受不了了。
        - id: ch02-b02
          speaker: old_mrs_possum
          text: 你到底是咋回事？俺只求你安安静静待上一小会儿，行不行？
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: 比利大叔含含糊糊地嘟囔了一句。负鼠老太太什么也没听清，只听见他嘴里念叨着“鸡蛋”两个字。
        - id: ch02-b04
          speaker: old_mrs_possum
          text: 别再惦记鸡蛋，干那种傻事！地上有雪，你跑去布朗农场主家的鸡舍偷偷摸摸，太不安全了。把鸡蛋忘掉，听见俺的话没有？
        - id: ch02-b05
          speaker: narrator
          text: 比利大叔点点头，表示自己听见了。可他的脑子里还是只有鸡蛋。他明明知道负鼠老太太说得对。跑去布朗农场主家的鸡舍附近胡闹，会在雪上留下一路清清楚楚的脚印，每一个从那里经过的人都看得见，当然不安全。
        - id: ch02-b06
          speaker: narrator
          text: 可即便明白这一切，比利大叔还是觉得，自己非吃到一枚鲜美的新鲜鸡蛋不可。他一定得吃到。没什么别的好说。
    - id: ch03
      title: 朝鸡舍去了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 到了晚上，快活、滚圆、红彤彤的太阳先生躲到紫山背后睡觉去了。比利大叔立刻从空心树的家里悄悄爬出来。
        - id: ch03-b02
          speaker: old_mrs_possum
          text: 你这是上哪儿去？
        - id: ch03-b03
          speaker: unc_billy_possum
          text: 俺就是出去动一动，把两条腿伸展开。
        - id: ch03-b04
          speaker: narrator
          text: 负鼠老太太满腹狐疑地盯着他的背影，在后面喊了起来。
        - id: ch03-b05
          speaker: old_mrs_possum
          text: 你可不许去干傻事！
        - id: ch03-b06
          speaker: narrator
          text: 比利大叔没有回答。他已经朝布朗农场主家的鸡舍去了。
