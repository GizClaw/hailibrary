  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gently rustic
        pace: measured
        pitch: medium
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: easygoing and humorously self-assured
        timbre: warm and slightly cracked
        pace: relaxed
        pitch: medium-low
    mrs_possum:
      display_name: Mrs. Possum
      tts:
        delivery: practical and firmly outspoken
        timbre: warm and slightly husky
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: "XV. THE FOOLISHNESS OF UNC' BILLY POSSUM"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Unc' Billy Possum happened to look out from the doorway of his big hollow tree in the Green Forest. Jimmy Skunk happened along at that very moment, and Unc' Billy asked where he had been. Then Jimmy mentioned nice fresh eggs. If any one of those things had not happened, Unc' Billy would not have done something foolish, and old Mrs. Possum would not have worried. But every one of them did happen.
        - id: ch01-b02
          speaker: narrator
          text: Once Jimmy Skunk told him about his fine breakfast of fresh eggs, Unc' Billy could think of nothing else. He knew exactly where Jimmy had found them. Why, he could close his eyes and see the inside of Farmer Brown's henhouse. At one end, rows of hens and roosters sat on their roosts with their heads tucked under their wings. There were rows of nests, too, filled with beautiful brown eggs. Jimmy could not climb, so he could only reach the lower nests. If Unc' Billy had been there, he could have climbed all the way to the highest one. But there was no use thinking about that. He had not been there, and now it was daylight, so he could not go.
        - id: ch01-b03
          speaker: narrator
          text: All day long, Unc' Billy tried to sleep. Whenever he drifted off, he dreamed of nice, fresh, delicious eggs. Whenever he woke, eggs were still all he could think about. He grew more restless and fidgety by the hour. At last, old Mrs. Possum could stand it no longer.
        - id: ch01-b04
          speaker: mrs_possum
          text: What in the world is wrong with yo'? Ah wish yo' would sit still for just one minute!
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: Unc' Billy mumbled an answer, but Mrs. Possum caught only one word. Eggs.
        - id: ch01-b06
          speaker: mrs_possum
          text: Now don't yo' start thinking about any foolishness with eggs. With snow on the ground, it isn't safe to go snooping around Farmer Brown's henhouse. Just put those eggs out of yo' mind! Do yo' hear me?
        - id: ch01-b07
          speaker: narrator
          text: Unc' Billy nodded. He had heard her, all right. Still, he could not get eggs out of his thoughts. He knew Mrs. Possum was right. With snow covering the ground, anyone who came by could see the tracks he left around Farmer Brown's henhouse. It was not safe to fool around there. Even so, Unc' Billy felt he simply had to have one nice fresh egg. He had to have it. That was all there was to it.
        - id: ch01-b08
          speaker: narrator
          text: That night, jolly, round, red Mr. Sun went to bed behind the Purple Hills. As soon as he was gone, Unc' Billy crept out of his hollow-tree home.
        - id: ch01-b09
          speaker: mrs_possum
          text: Where are yo' off to?
        - id: ch01-b10
          speaker: unc_billy_possum
          text: Ah'm only going out to stretch the stiffness from mah legs.
        - id: ch01-b11
          speaker: narrator
          text: Old Mrs. Possum watched him go with suspicion.
        - id: ch01-b12
          speaker: mrs_possum
          text: Don't yo' go doing anything foolish!
        - id: ch01-b13
          speaker: narrator
          text: Unc' Billy gave no answer. He was already on his way to Farmer Brown's henhouse.
