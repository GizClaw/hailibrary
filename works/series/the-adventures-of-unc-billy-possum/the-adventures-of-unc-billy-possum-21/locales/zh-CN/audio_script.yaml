audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 直率活泼，遇到意外时反应鲜明
        timbre: 清脆明朗的少年声线
        pace: 中等偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 木屑飞起来了
      blocks:
        - id: ch01-b01
          speaker: farmer_browns_boy
          text: |-
            从前有只老负鼠，住在一棵树上。
            嗨哟，看那木屑飞！
            你从没见过哪个贼，像他那样狡猾。
            嗨哟，看那木屑飞！
            黑夜里他吃呀吃，吃个没完。
            等到天一亮，鸡蛋一只也不见。
            如今我知道，他把床铺在了哪里。
            鸡蛋不吃也罢，今天我就吃掉他！
            嗨哟，看那木屑飞！
        - id: ch01-b02
          speaker: narrator
          text: 布朗农场主家的男孩唱着歌，手里的利斧一下接一下。木屑真的飞了起来，四面八方撒在白雪上。他唱得越响，木屑也飞得越快。
        - id: ch01-b03
          speaker: narrator
          text: 这天一大早，他就来到了绿森林。他已经认准了，今天准能带一只肥负鼠回家当晚餐，根本没想过会空手而归，所以砍树时才唱得那么起劲。
        - id: ch01-b04
          speaker: narrator
          text: 男孩沿着负鼠的脚印，一直追到这棵树下。只有来的脚印，没有离开的脚印。再抬头一看，树顶附近恰好有个洞，正是负鼠爱住的样子。只要砍倒大树，劈开树干，负鼠先生就是他的了。
    - id: ch02
      title: 大树轰然倒下
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 男孩又抡起斧头。咔嚓，咔嚓，咔嚓！木屑不断落上白雪，他也一直唱个不停。他只顾着砍，压根儿没想过，被他追赶的负鼠这会儿是什么滋味。
        - id: ch02-b02
          speaker: narrator
          text: 那些脚印当然是比利大叔留下的。他早就担心男孩会在鸡舍外看见它们。可雪地上的痕迹清清楚楚，男孩想不看见都难。
        - id: ch02-b03
          speaker: narrator
          text: 比利大叔从鸡舍赶到绿森林，一路又远又难走，心里还始终悬着。积雪深得很，他每走一步都费劲。好不容易到了这棵空心树下，他已经累得几乎连树都爬不上去了。
        - id: ch02-b04
          speaker: narrator
          text: 这里当然不是他的家。负鼠老太太和八只小负鼠住在另一棵空心树里。比利大叔可没糊涂到往家走，让男孩顺着脚印追到家门口。
        - id: ch02-b05
          speaker: narrator
          text: 所以，眼前有这么一棵空心树可以躲，他真是庆幸极了。可他最怕的事还是来了。布朗农场主家的男孩找到了这里。
        - id: ch02-b06
          speaker: narrator
          text: 咔嚓，咔嚓，咔嚓！雪地已经铺满木屑。咔嚓，咔嚓，咔嚓！大树先打哆嗦，接着摇晃起来。喀——嚓！随着一声巨响，它轰然倒下！
    - id: ch03
      title: 难道负鼠长了翅膀
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 猎犬鲍泽兴奋地叫起来，和男孩一起冲向树顶附近的洞口。他们等着负鼠先生跑出来，好当场抓住他。可是，洞里没有动静。男孩拿斧柄敲敲树干，还是没有谁出来。
        - id: ch03-b02
          speaker: farmer_browns_boy
          text: 我看，他准是在里面装死。
        - id: ch03-b03
          speaker: narrator
          text: 男孩说完就开始劈树干，想把树洞打开。他砍着砍着，又唱起了歌。没过多久，树干就被劈得大敞开来。
        - id: ch03-b04
          speaker: narrator
          text: 树洞底下有红松鼠查特勒留下的一只旧窝。除了这个，里面什么也没有。
        - id: ch03-b05
          speaker: narrator
          text: 男孩揉揉眼睛，盯住树洞，看了一遍又一遍。比利大叔的脚印明明一直通到树下，却没有一道离开的脚印。
        - id: ch03-b06
          speaker: narrator
          text: 难道那只负鼠长了翅膀不成？
