audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gently rustic
        pace: measured
        pitch: medium
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: practical and confident
        timbre: clear and youthful
        pace: steady
        pitch: medium
  chapters:
    - id: ch01
      title: "See the Chips Fly"
      blocks:
        - id: ch01-b01
          speaker: farmer_browns_boy
          text: >-
            There once was an old Possum who lived in a tree. Hi, ho, see the chips fly! He was the slyest old thief you could ever see. Hi, ho, see the chips fly! He ate through the night till the eggs were all gone. But now I know where he sleeps before dawn. I'll do without eggs and eat him instead. Hi, ho, see the chips fly!
        - id: ch01-b02
          speaker: narrator
          text: Farmer Brown's boy sang while he swung his sharp axe, and the chips really did fly. They scattered over the white snow in every direction. The louder he sang, the faster he chopped.
        - id: ch01-b03
          speaker: narrator
          text: He had come to the Green Forest bright and early that morning, determined to carry home a fat Possum for dinner. He was certain he would get one. That was why he sang so cheerfully as the chips flew.
        - id: ch01-b04
          speaker: narrator
          text: He had followed the Possum's tracks straight to this tree, and not one track led away. Near the top, he could see the very kind of hollow a Possum would choose. All he had to do was bring the tree down and split it open. Then Mr. Possum would be his.
    - id: ch02
      title: "Unc' Billy's Hard Journey"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: So Farmer Brown's boy kept swinging his axe. Chop, chop, chop! More chips sailed across the snow. He sang on, never once wondering how the Possum inside might feel.
        - id: ch02-b02
          speaker: narrator
          text: Of course, the tracks belonged to Unc' Billy Possum. Farmer Brown's boy had found them outside the henhouse, just as Billy had feared. They were so plain in the snow that the boy could hardly have missed them.
        - id: ch02-b03
          speaker: narrator
          text: Unc' Billy had made a long, hard, worried journey from the henhouse to the Green Forest. The snow was so deep that he could barely push through it. By the time he reached this hollow tree, he was almost too tired to climb.
        - id: ch02-b04
          speaker: narrator
          text: This was not Billy's own hollow tree, where old Mrs. Possum and their eight little Possums lived. Billy knew better than to leave Farmer Brown's boy a clear trail all the way home. He had been very thankful to find this other hollow and climb inside. Now the very thing he feared had happened. Farmer Brown's boy was right below him.
    - id: ch03
      title: "The Tree Comes Down"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Chop, chop, chop! By now, chips covered the snow. Chop, chop, chop! The tree began to shiver. Then it started to shake.
        - id: ch03-b02
          speaker: narrator
          text: Cra-a-ck! With one great crash, the tree toppled over.
        - id: ch03-b03
          speaker: narrator
          text: Bowser the Hound barked with excitement. He and Farmer Brown's boy rushed to the hollow near the top, ready to catch Mr. Possum if he ran out. But no Possum appeared.
        - id: ch03-b04
          speaker: narrator
          text: Farmer Brown's boy struck the fallen tree with the handle of his axe. Still, no one came out.
    - id: ch04
      title: "An Empty Hollow"
      blocks:
        - id: ch04-b01
          speaker: farmer_browns_boy
          text: I suppose he's pretending to be dead.
        - id: ch04-b02
          speaker: narrator
          text: Farmer Brown's boy began chopping the tree apart so he could reach into the hollow. As he worked, he started singing again. Before long, he had split the trunk wide open.
        - id: ch04-b03
          speaker: narrator
          text: At the bottom of the hollow lay an old nest that belonged to Chatterer the Red Squirrel. There was nothing else inside.
        - id: ch04-b04
          speaker: narrator
          text: Farmer Brown's boy rubbed his eyes. He stared, and stared, and stared. Unc' Billy's tracks ran straight to the tree, with none leading away from it.
        - id: ch04-b05
          speaker: narrator
          text: Could that Possum have wings?
