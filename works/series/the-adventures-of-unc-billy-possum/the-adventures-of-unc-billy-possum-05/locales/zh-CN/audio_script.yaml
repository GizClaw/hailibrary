audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 慢悠悠又爱打趣，带着老弗吉尼亚乡音般的亲切腔调
        timbre: 粗暖松弛
        pace: 从容偏慢
        pitch: 中低音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 憨厚随性，困倦时含混慵懒
        timbre: 圆润柔和
        pace: 中等偏慢
        pitch: 中音
  chapters:
    - id: ch01
      title: 第五章　浣熊博比被叫醒
      blocks:
        - id: ch01-b01
          speaker: unc_billy_possum
          text: 他们快来了，他们快来了，很快就要到。可俺还是嫌他们来得不够早！他们快来了，他们快来了，月儿转弯就来到。俺在这棵老空心树里，把他们等呀等！
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: 负鼠比利大叔刚从农夫布朗家的鸡舍出来，正慢慢往家走。他一路哼着歌，心里美滋滋的，简直不能更得意了。
        - id: ch01-b03
          speaker: narrator
          text: 要说谁最懂刚下的鸡蛋有多鲜美，那可没有谁比得过比利大叔。鸡舍里有好多鸡蛋等着他，多得他吃到肚子饱饱的，还没能全吃完。
        - id: ch01-b04
          speaker: narrator
          text: 家里已经打扫干净，也收拾妥当了，只等“老弗吉尼亚”的家人赶来。他要做的，就只剩下等他们了。于是，他拖着步子，用那滑稽的破嗓子一路唱回去。
        - id: ch01-b05
          speaker: narrator
          text: 到了大空心树下，比利大叔开始往自家门口爬。爬到一半，他唱到半截忽然收了声，就在一根正合适的树枝上坐下来。
        - id: ch01-b06
          speaker: narrator
          text: 他把一只耳朵贴上树干，仔细听了听，又换另一只耳朵去听。果然有个古怪的声音，听起来正是从空心树里面传出来的。比利大叔转身望着自家门口，一边琢磨，一边用手挠脑袋。
        - id: ch01-b07
          speaker: unc_billy_possum
          text: 俺的老天！这声音明明是从屋里传出来的。俺家准是进了谁！
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: 比利大叔轻手轻脚地爬到门边，探头一瞧。屋里黑漆漆的，几乎什么也看不清，只有那张刚刚铺好、又漂亮又舒服的小床，已经被弄得乱七八糟。
        - id: ch01-b09
          speaker: narrator
          text: 眼睛看不见，耳朵却听得真真切切。没错，比利大叔听得清清楚楚。那是鼾声！有人钻进他的家，还躺在他的床上睡熟了。
        - id: ch01-b10
          speaker: unc_billy_possum
          text: 俺的老天！俺的老天！
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: 比利大叔两只尖尖的小眼睛直冒火。他把脑袋伸进门里，扯开嗓门喊了起来。
        - id: ch01-b12
          speaker: unc_billy_possum
          text: 喂，里头的！你跑到俺家来干啥？
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: 屋里只回了他一声呼噜。比利大叔等了一会儿，又把脑袋探进去。
        - id: ch01-b14
          speaker: unc_billy_possum
          text: 不管你是谁，赶紧从俺家出来！要不然，俺可要进去把你扔出来啦！
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: 回答他的还是呼噜声，这回比刚才更响。比利大叔彻底火了。一个根本不该待在这里的家伙，居然闯进了他的屋子！他不知道那是谁，也懒得管。今天非叫那家伙出来不可，倒要看看对方凭什么赖着不走。比利大叔咬紧牙关，冲了进去。
        - id: ch01-b16
          speaker: narrator
          text: 哎呀呀，那棵空心树里顿时闹翻了天！彼得兔正巧从附近路过，听见动静便停下来。他瞪圆眼睛，张大嘴巴，直盯着那棵空心树。里面又是低吼，又是咆哮。很快，树叶和苔藓也从门口飞了出来，那些全是比利大叔床上的东西。
        - id: ch01-b17
          speaker: narrator
          text: 接着，一条带环纹的大尾巴从门口垂了下来。彼得一眼就认出来了。除了浣熊博比，谁也没有这样的尾巴。
        - id: ch01-b18
          speaker: narrator
          text: 没过多久，博比跟着尾巴一起现了身，慌忙倒退着爬下树。比利大叔那张尖尖的老脸也从门口冒出来。他低头看着彼得兔，咧嘴一笑。
        - id: ch01-b19
          speaker: unc_billy_possum
          text: 俺看，浣熊先生爬上俺的床时，准是走错门了。
        - id: ch01-b20
          speaker: narrator
          text: 浣熊博比难为情地承认，他确实走错了。
