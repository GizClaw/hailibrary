audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gently rustic
        pace: measured
        pitch: medium
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: easygoing and humorously self-assured
        timbre: warm and slightly cracked
        pace: relaxed
        pitch: medium-low
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: sturdy and good-natured
        timbre: rounded and slightly rough
        pace: natural
        pitch: medium-low
  chapters:
    - id: ch01
      title: "V. BOBBY COON IS WAKED UP"
      blocks:
        - id: ch01-b01
          speaker: unc_billy_possum
          text: "They're coming, they're coming, they're coming mighty soon. But they can't come soon enough for me! They're coming, they're coming when the moon is turning, to the old hollow tree where I wait!"
        - id: ch01-b02
          speaker: narrator
          text: Unc' Billy Possum sang to himself as he trudged slowly home from Farmer Brown's henhouse. He felt very good indeed. Nobody enjoyed a truly fresh egg more than Unc' Billy, and he had found more eggs waiting there than he could eat. He had eaten all he could hold, and now his stomach was full. His house had already been cleaned and put in order. Everything was ready for his family to arrive from Ol' Virginny. There was nothing left for him to do but wait. So he walked along, singing in his funny, cracked voice.
        - id: ch01-b03
          speaker: narrator
          text: When he reached his big hollow tree, Unc' Billy began climbing toward his door. Halfway up, he stopped right in the middle of his song and sat on a handy branch. He pressed one ear against the trunk and listened. Then he tried the other ear and listened once more. There truly was a strange noise, and it seemed to come from inside the tree. Unc' Billy looked up at his doorway and scratched his head.
        - id: ch01-b04
          speaker: unc_billy_possum
          text: "My goodness! It surely sounds as if somebody is in my house!"
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: Very softly, Unc' Billy crept up to the doorway and peered inside. It was too dark to see much. Still, he could tell that his neat, comfortable bed had been tossed into a mess. And though he could not see what was in there, he could hear it perfectly well. Someone was snoring. There was a visitor in Unc' Billy's house, fast asleep in Unc' Billy's own bed.
        - id: ch01-b06
          speaker: unc_billy_possum
          text: "My goodness! My goodness!"
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: Unc' Billy's two sharp little eyes began to flash. He stuck his head through the doorway and called inside.
        - id: ch01-b08
          speaker: unc_billy_possum
          text: "Hey, you in there! What are you doing in my house?"
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: The only reply was another snore. Unc' Billy waited for a moment, then put his head through the doorway again.
        - id: ch01-b10
          speaker: unc_billy_possum
          text: "You'd better get out of my house, whoever you are. If you don't, I'm coming in to throw you out myself!"
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: This time, the answer was an even louder snore. That was too much for Unc' Billy, and he completely lost his temper. A stranger who had no right to be there was sleeping in his house. Unc' Billy did not know who it was, and he did not care. The intruder was coming out, or Unc' Billy would find out why not. He gritted his teeth and went in.
        - id: ch01-b12
          speaker: narrator
          text: My, my, my, what a rumpus broke out inside that hollow tree! Peter Rabbit happened to be passing nearby, and he heard it. He stopped and stared at the tree with his eyes and mouth wide open. Snarls and growls came from inside. Then leaves and moss began flying out through the doorway. They were pieces of Unc' Billy's bed.
        - id: ch01-b13
          speaker: narrator
          text: Next, Peter saw a big ringed tail dangling from the doorway. He knew that tail at once. It could belong to no one but Bobby Coon.
        - id: ch01-b14
          speaker: narrator
          text: A moment later, Bobby followed his tail out of the tree, backing down in a great hurry. Then Unc' Billy's sharp little old face appeared in the doorway. He looked down at Peter Rabbit and grinned.
        - id: ch01-b15
          speaker: unc_billy_possum
          text: "I reckon Mr. Coon made a mistake when he chose my house for his bed."
        - id: ch01-b16
          speaker: narrator
          text: Bobby Coon looked sheepish.
        - id: ch01-b17
          speaker: bobby_coon
          text: "I surely did."
