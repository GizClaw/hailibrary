  chapters:
    - id: ch01
      title: "IV. BOBBY COON ENTERS THE WRONG HOUSE"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once Unc' Billy Possum had asked Skimmer the Swallow to carry a message south to his family in Ol' Virginny, he got busy preparing for them. The message told them to come join him in the Green Forest. Now, Unc' Billy was not fond of work. He would much rather have someone else do it, and he was clever enough to make that happen most of the time.
        - id: ch01-b02
          speaker: narrator
          text: But getting ready for his family was different. Nobody else could arrange things exactly the way he wanted. This was Unc' Billy's own job, and he worked at it all day long.
        - id: ch01-b03
          speaker: narrator
          text: First, he had to clean his house. He had lived alone in the big hollow tree for so long that it had become rather untidy. As he cleaned, Unc' Billy whistled and sang. Peter Rabbit happened to pass by and heard his song.
        - id: ch01-b04
          speaker: unc_billy_possum
          text: "My ol' woman is way down South. Come along! Come along! There ain't a thing sharper than the tongue in her mouth. Come along! Come along! She was pretty once, but she ain't anymore. Still, she cooks my meals and sweeps my floor. She darns my stockings and mends my coat, and she knows just how to care for our children. Come along! Come along!"
        - id: ch01-b05
          speaker: unc_billy_possum
          text: "My little ones are heading this way. Come along! Come along! Their daddy watches for them every day. Come along! Come along! My poor ol' head aches when I think of the noise those girls and boys are bound to make. But I don't care if it breaks in two, as long as the good Lord brings those children through. Come along! Come along!"
        - id: ch01-b06
          speaker: narrator
          text: Every little while, Unc' Billy sat down to rest. He was not used to doing so much real work. At last, though, his house was clean and as comfortable as he could make it.
        - id: ch01-b07
          speaker: narrator
          text: Right about then, Unc' Billy began thinking how good an egg would taste. The longer he thought about that egg, the more he wanted it.
        - id: ch01-b08
          speaker: unc_billy_possum
          text: "There's no use pretending otherwise. I just naturally have to get myself that egg."
        - id: ch01-b09
          speaker: narrator
          text: So Unc' Billy set off for Farmer Brown's.
        - id: ch01-b10
          speaker: narrator
          text: Unc' Billy was barely out of sight when Bobby Coon came along. Bobby had been out all night. Perhaps he was absent-minded, or perhaps he was so sleepy that he did not know what he was doing. Whatever the reason, when he reached Unc' Billy's hollow tree, he climbed right up as though it were his own home.
        - id: ch01-b11
          speaker: narrator
          text: Bobby peered through Unc' Billy's doorway. Inside was the most comfortable bed he had seen in a long while. He looked one way, then the other. Nobody was around. He peeked inside again. That bed certainly looked soft and comfortable. Bobby chuckled to himself.
        - id: ch01-b12
          speaker: bobby_coon
          text: "I think I'll find out whether that bed feels as comfortable as it looks."
        - id: ch01-b13
          speaker: narrator
          text: Two minutes later, Bobby Coon was curled up in Unc' Billy Possum's bed, fast asleep.
