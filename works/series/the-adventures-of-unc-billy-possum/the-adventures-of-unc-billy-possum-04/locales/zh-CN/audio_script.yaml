audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点讲动物故事时的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 慢悠悠又爱打趣，带着老弗吉尼亚乡音般的亲切腔调
        timbre: 粗暖松弛
        pace: 从容偏慢
        pitch: 中低音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 憨厚随性，困倦时含混慵懒
        timbre: 圆润柔和
        pace: 中等偏慢
        pitch: 中音
  chapters:
    - id: ch01
      title: 第四章　浣熊博比进错了家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 燕子斯基默要往南方飞。负鼠比利大叔托他给“老弗吉尼亚”的家人捎了信，请他们来绿森林团聚。信一送走，比利大叔马上忙着做起了准备。
        - id: ch01-b02
          speaker: narrator
          text: 比利大叔平时可不爱干活。只要能请别人代劳，他自己就不愿动手。他偏偏又很聪明，常常真能想出办法，让别人替他干。
        - id: ch01-b03
          speaker: narrator
          text: 可迎接家人不同。别人收拾的屋子，不一定合他的心意。这回是他自己的事，他从早到晚，一刻不停。第一件事，就是把家打扫干净。
        - id: ch01-b04
          speaker: narrator
          text: 比利大叔独自在大空心树里住了太久，屋子乱得很。他一边收拾，一边吹口哨，还唱起歌来。彼得兔正巧路过，听见他唱的是这个。
        - id: ch01-b05
          speaker: unc_billy_possum
          text: 俺家老伴还在南方——快些来！快些来！她那张嘴呀，比刀子还厉害——快些来！快些来！她从前漂亮，如今可不再，可她给俺做饭，把地扫起来。她补俺的袜子，也缝俺的衣裳，还最会把俺的娃儿照料妥当——快些来！快些来！
          emotion: happy
        - id: ch01-b06
          speaker: unc_billy_possum
          text: 俺家的小娃儿正朝这边来——快些来！快些来！爹爹俺一天一天等他们来——快些来！快些来！一想到男娃女娃吵翻了天，俺这颗老脑袋就疼得可怜。可哪怕疼得裂成两半，俺也不管，只求好心的主把娃儿平安送到俺面前——快些来！快些来！
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: 比利大叔干一会儿，就要坐下来歇一歇。他实在不习惯一下子做这么多活。不过到了最后，屋子总算干净了，也被他收拾得舒舒服服。
        - id: ch01-b08
          speaker: narrator
          text: 忙完这些，比利大叔忽然想起了鸡蛋。他心想，这会儿要是能吃上一只，该有多香。他越想越馋，最后再也忍不住了。
        - id: ch01-b09
          speaker: unc_billy_possum
          text: 没啥好说的，俺天生就非吃到那只鸡蛋不可。
        - id: ch01-b10
          speaker: narrator
          text: 比利大叔对自己说完这句话，就朝农夫布朗家去了。
        - id: ch01-b11
          speaker: narrator
          text: 他刚走远，浣熊博比就来了。博比在外面逛了一整夜，不是心不在焉，就是困得糊里糊涂。走到比利大叔的空心树下，他竟顺着树干往上爬，好像回到了自己家。
        - id: ch01-b12
          speaker: narrator
          text: 博比从门口往里一瞧，眼前那张床，是他好久没见过的舒服模样。他看看这边，又看看那边，四周一个人影也没有。
        - id: ch01-b13
          speaker: narrator
          text: 他又朝门里看了一回。那张床瞧着可真软和，真舒服。博比忍不住偷偷笑了。
        - id: ch01-b14
          speaker: bobby_coon
          text: 俺就试一试，看这张床是不是真有瞧着那么舒服。
        - id: ch01-b15
          speaker: narrator
          text: 才过了两分钟，浣熊博比已经蜷在负鼠比利大叔的床上，呼呼睡熟了。
