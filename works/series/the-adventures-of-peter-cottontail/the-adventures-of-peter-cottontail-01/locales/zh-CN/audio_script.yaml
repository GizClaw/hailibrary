audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 从容机灵，话里带笑
        timbre: 柔和沉稳
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第一章　彼得兔决定改名
      blocks:
        - id: ch01-b01
          speaker: peter_rabbit
          text: “彼得兔！彼得兔！大自然妈妈怎么偏偏给了我这么普通的名字？大家就是因为这个才笑我。要是名字听起来气派，他们肯定不笑。有些家伙总说，名字算不了什么。可我知道，名字明明很要紧。就算我做出一件了不起的大事，别人也不会放在心上。不，先生，谁都不会在意，只因为做那件事的是彼得兔。”
        - id: ch01-b02
          speaker: narrator
          text: 彼得嘴上说个不停，其实只是在跟自己说话。他独自坐在亲爱的老荆棘丛里，平日快活的脸紧紧皱着。太阳照着青草地，西风妈妈的快乐小微风在草上跳舞，鸟儿也唱得起劲。春天那份欢欣雀跃的幸福到处都是，偏偏进不了彼得的心。他心里像是再也装不下别的，只剩下一肚子不知足。为了自己的名字这样不快活，实在很傻。可是呀，跟彼得一样犯傻的人还真不少。
        - id: ch01-b03
          speaker: jimmy_skunk
          text: “那你准备怎么办？”
        - id: ch01-b04
          speaker: narrator
          text: 突然响起的声音吓了彼得一跳。他急忙回头，看见臭鼬吉米正从彼得的一条私用小径入口探头进来，还咧着嘴笑。彼得看见那副笑脸，就知道自己的话都被听见了。他一句也答不上来，只能羞惭地低下头。
        - id: ch01-b05
          speaker: jimmy_skunk
          text: “有件事，你得明白。”
        - id: ch01-b06
          speaker: peter_rabbit
          text: “什么事？”
        - id: ch01-b07
          speaker: jimmy_skunk
          text: “我说给你听。名字本来没什么，全看自己怎么做。不由别人来作主，人家如何看你我。每天怎样过日子，说了什么，做什么，能让名字大起来，也能小得没着落。名字只把你我说，全看自己怎么做。道理只有这一条，人家才会这样看你我。”
        - id: ch01-b08
          speaker: narrator
          text: 彼得冲吉米扮了个鬼脸。
        - id: ch01-b09
          speaker: peter_rabbit
          text: “我才不爱听别人教训我。”
        - id: ch01-b10
          speaker: jimmy_skunk
          text: “我不是在教训你。我只是告诉你一件本来不用人说、你自己也该懂的事。既然不喜欢这个名字，你干吗不换一个？”
        - id: ch01-b11
          speaker: peter_rabbit
          text: “你说什么？”
          emotion: surprised
        - id: ch01-b12
          speaker: jimmy_skunk
          text: “我说，你既然不喜欢自己的名字，换一个不就行了？”
        - id: ch01-b13
          speaker: narrator
          text: 彼得立刻坐直了。刚才那副让人看着都不舒服的愁眉苦脸，一下从他脸上消失了。他慢慢开口，话还有些结巴。
        - id: ch01-b14
          speaker: peter_rabbit
          text: “我……我还真没想到。吉米，你说我真的能换吗？”
        - id: ch01-b15
          speaker: jimmy_skunk
          text: “这可是世上最容易的事。挑一个自己喜欢的名字，再请所有朋友以后都这么叫你。”
        - id: ch01-b16
          speaker: peter_rabbit
          text: “我想好了，我要换！”
          emotion: happy
        - id: ch01-b17
          speaker: jimmy_skunk
          text: “行，等你选好了，记得告诉我新名字。”
        - id: ch01-b18
          speaker: narrator
          text: 吉米说完，便动身回家。他沿着弯弯小径一路往上走，一路暗暗发笑。只要想到傻乎乎的彼得竟然要给自己改名字，他就忍不住笑。
