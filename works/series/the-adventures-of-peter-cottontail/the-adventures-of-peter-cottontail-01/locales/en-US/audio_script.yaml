audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, knowing, and quietly amused
        timbre: mellow and dry
        pace: relaxed
        pitch: medium-low
  chapters:
    - id: ch01
      title: Peter Is Unhappy with His Name
      blocks:
        - id: ch01-b01
          speaker: peter_rabbit
          text: "Peter Rabbit! Peter Rabbit! Why did Mother Nature give me such a common-sounding name? People laugh at me. They wouldn't laugh if I had a grand name. Some folks say a name doesn't amount to anything, but they're wrong. Suppose I did something wonderful. Nobody would think much of it. No, sir, nobody would think anything of it at all! And why? Just because it was done by Peter Rabbit."
        - id: ch01-b02
          speaker: narrator
          text: "Peter was talking aloud to himself. He sat in the dear Old Briar-patch, wearing an ugly scowl on a face that was usually happy. The sun shone over the Green Meadows. The Merry Little Breezes of Old Mother West Wind danced, the birds sang, and the glad joy of spring was everywhere. Everywhere, that is, except in Peter's heart."
        - id: ch01-b03
          speaker: narrator
          text: "There was no room in it for anything but discontent. And what foolish discontent it was! Peter Rabbit was unhappy with his own name. Yet plenty of people can be just as foolish as Peter."
    - id: ch02
      title: What Jimmy Skunk Knows About Names
      blocks:
        - id: ch02-b01
          speaker: jimmy_skunk
          text: "So, what will you do about it?"
        - id: ch02-b02
          speaker: narrator
          text: "The voice startled Peter. He jumped and spun around in a hurry. Jimmy Skunk was poking his head through the opening of one of Peter's private little paths. Jimmy was grinning, and Peter knew from that grin that Jimmy had heard every word. Peter couldn't think of anything to say. He lowered his head, looking thoroughly ashamed."
        - id: ch02-b03
          speaker: jimmy_skunk
          text: "There's something you still need to learn."
        - id: ch02-b04
          speaker: peter_rabbit
          text: "What's that?"
        - id: ch02-b05
          speaker: jimmy_skunk
          text: "It's this. A name has nothing in it except what we choose to make of it. It lies with us, and no one else, how other folks will take it. What we do, what we say, and how we live each passing day can make a name big or small, or even worse than no name at all. A name simply stands for what we are. We choose what to make of it, and that's how other folks will take it."
        - id: ch02-b06
          speaker: narrator
          text: "Peter Rabbit pulled a face at Jimmy Skunk."
        - id: ch02-b07
          speaker: peter_rabbit
          text: "I don't want a sermon."
        - id: ch02-b08
          speaker: jimmy_skunk
          text: "I'm not giving you one. I'm only saying what you should already know. But if you dislike your name so much, why not change it?"
    - id: ch03
      title: Peter Decides to Change His Name
      blocks:
        - id: ch03-b01
          speaker: peter_rabbit
          text: "Wait, what was that? What did you just say?"
          emotion: surprised
        - id: ch03-b02
          speaker: jimmy_skunk
          text: "I said, if you don't like your name, why not pick another one?"
        - id: ch03-b03
          speaker: narrator
          text: "Peter sat straight up. The disagreeable frown had vanished from his face. When he answered, he spoke slowly."
        - id: ch03-b04
          speaker: peter_rabbit
          text: "I... I never thought of that. Jimmy Skunk, do you really think I could?"
        - id: ch03-b05
          speaker: jimmy_skunk
          text: "Nothing could be easier. Choose the name you want, then tell all your friends to use it."
        - id: ch03-b06
          speaker: peter_rabbit
          text: "That's exactly what I'll do!"
          emotion: happy
        - id: ch03-b07
          speaker: jimmy_skunk
          text: "Then tell me the new name when you've chosen it."
        - id: ch03-b08
          speaker: narrator
          text: "Then Jimmy started for home. All the way up the Crooked Little Path, he chuckled to himself as he thought about foolish Peter Rabbit trying to change his name."
