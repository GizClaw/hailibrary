audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 急躁冲动，发怒时语气逼人
        timbre: 尖亮而略显粗粝
        pace: 偏快
        pitch: 中高音
    sammy_jay:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 热闹夸张，兴奋劲十足
        timbre: 明亮尖脆
        pace: 偏快
        pitch: 高音
  chapters:
    - id: ch01
      title: 两个淘气鬼的诡计
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 冠蓝鸦萨米四处寻摸着，想找点坏事来做。他走到红狐雷迪家门前，只见雷迪坐在台阶上，双手托着下巴，仿佛全世界一个朋友也没有。萨米开口问他。
        - id: ch01-b02
          speaker: sammy_jay
          text: “你坐在这里干什么？”
        - id: ch01-b03
          speaker: reddy_fox
          text: “我在想事情。”
        - id: ch01-b04
          speaker: sammy_jay
          text: “想什么呢？说来听听，也许我能帮你。”
        - id: ch01-b05
          speaker: narrator
          text: 雷迪长长地叹了一口气。
        - id: ch01-b06
          speaker: reddy_fox
          text: “我在想，到底怎样才能抓住彼得兔。”
        - id: ch01-b07
          speaker: narrator
          text: 萨米听了，若有所思地挠挠头。雷迪仍旧托着下巴，想了又想。萨米单脚站着，用另一只脚挠了又挠。忽然，他抬起头来。
        - id: ch01-b08
          speaker: sammy_jay
          text: “有办法了！老山核桃树那边有一截空心木头，你还记得吗？”
        - id: ch01-b09
          speaker: narrator
          text: 雷迪点点头。萨米便把计策说给他听。
        - id: ch01-b10
          speaker: sammy_jay
          text: “我去找彼得，就说带他看世界上最稀奇的东西。你知道，他好奇心可重了。你先躲进空心木头。等我说‘世界上最稀奇的东西就在那边等着你呢，彼得’，你就跳出来。到时候，他还能跑得了吗？”
        - id: ch01-b11
          speaker: narrator
          text: 雷迪一下来了精神，这个主意听起来确实不错。他越想越觉得，萨米的计策准能成功。彼得一次又一次地戏弄他，他都快绝望了。要是雷迪自己再去请彼得，彼得立刻就会猜到其中有鬼。可谁会想到冠蓝鸦萨米也在打坏主意呢？大家只知道，萨米是绿色森林里最爱传消息的家伙。
    - id: ch02
      title: 世界上最稀奇的东西
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 雷迪跑到大山核桃树旁，钻进那截空心木头。萨米飞往老荆棘丛，在一大丛黑莓灌木下面找到了彼得兔。他摆出最客气的样子，向彼得问好。
        - id: ch02-b02
          speaker: sammy_jay
          text: “早上好，彼得兔。”
        - id: ch02-b03
          speaker: narrator
          text: 彼得回了礼，又警觉地看着萨米。这个家伙平时可没这么有礼貌。彼得心里直犯嘀咕，萨米今天到底是什么意思？
        - id: ch02-b04
          speaker: sammy_jay
          text: “今天早上，我见到了一样东西，那可是全世界最稀奇的。”
        - id: ch02-b05
          speaker: narrator
          text: 彼得的耳朵立刻竖了起来。他明明不想上钩，可还是忍不住好奇。
        - id: ch02-b06
          speaker: peter_rabbit
          text: “你看到什么了，冠蓝鸦萨米？”
        - id: ch02-b07
          speaker: narrator
          text: 萨米故意摆出一副神秘的神情。
        - id: ch02-b08
          speaker: sammy_jay
          text: “说实话，我也弄不清那是什么。不过，你要想亲眼看一看，我可以带你去，彼得兔。”
        - id: ch02-b09
          speaker: narrator
          text: 彼得当然想看，于是跟着萨米穿过绿草原。路越走越远，他想事情的工夫也越来越多。还没走到老山核桃树跟前，彼得已经开始怀疑，这会不会是个圈套。
        - id: ch02-b10
          speaker: narrator
          text: 萨米打着手势，叫他轻轻靠近，又压低了声音。
        - id: ch02-b11
          speaker: sammy_jay
          text: “就在那边的空心木头里。你凑过去，朝里面看一眼，马上就能见到。”
        - id: ch02-b12
          speaker: narrator
          text: 萨米说完，便准备向红狐雷迪发出暗号。
    - id: ch03
      title: 一股古怪的气味
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得向前跳了两步，直直坐起身，盯住那截空心木头。他越看越觉得不对劲。为什么不对，他也说不清。反正那截木头的样子，就是叫他不喜欢。
        - id: ch03-b02
          speaker: narrator
          text: 正巧，西风老妈妈手下的一阵快乐小风跳着舞来了。小风掠过空心木头，跑到彼得身边，还带来了一股古怪的气味。
        - id: ch03-b03
          speaker: narrator
          text: 彼得那只会翕动的小鼻子皱了起来。这味道太熟悉了，分明就是红狐雷迪的气味。他又用力闻了闻，突然掉转身子。
        - id: ch03-b04
          speaker: peter_rabbit
          text: “对不起啦，冠蓝鸦萨米！我刚刚想起来，还有一件特别要紧的事！”
        - id: ch03-b05
          speaker: narrator
          text: 萨米还没来得及张嘴，彼得已经像一道棕色的小影子，飞快地奔回老荆棘丛去了。
