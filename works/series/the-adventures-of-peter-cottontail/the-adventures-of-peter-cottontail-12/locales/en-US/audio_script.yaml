audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: smooth and sly, with forced sweetness when hiding his temper
        timbre: lean and slightly rough
        pace: measured
        pitch: medium-low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: bright and meddlesome, with a clever, knowing air
        timbre: crisp and slightly sharp
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Plot of Two Scamps
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Sammy Jay was out looking for mischief when he found Reddy Fox on his doorstep. Reddy had his chin in both hands and looked as though he had no friends at all."
        - id: ch01-b02
          speaker: sammy_jay
          text: "What are you doing, Reddy?"
        - id: ch01-b03
          speaker: reddy_fox
          text: "I'm trying to work something out."
        - id: ch01-b04
          speaker: sammy_jay
          text: "What are you working out? Maybe I can help."
        - id: ch01-b05
          speaker: narrator
          text: "Reddy let out a long sigh."
        - id: ch01-b06
          speaker: reddy_fox
          text: "I'm trying to work out how to catch Peter Rabbit."
        - id: ch01-b07
          speaker: narrator
          text: "Sammy scratched his head and thought. Reddy stayed there with his chin in his hands, thinking and thinking. Sammy balanced on one foot while he scratched and scratched with the other. All at once, he looked up."
        - id: ch01-b08
          speaker: sammy_jay
          text: "I've got it! Remember that hollow log beyond the old hickory tree?"
        - id: ch01-b09
          speaker: narrator
          text: "Reddy nodded."
        - id: ch01-b10
          speaker: sammy_jay
          text: "I'll invite Peter over there to see the strangest thing in the world. You know how curious he is. Hide inside the hollow log. When you hear me tell Peter that the strangest thing in the world is waiting over there, jump out and catch him."
        - id: ch01-b11
          speaker: narrator
          text: "Reddy brightened at once. The plan looked very good to him. Peter had fooled him so many times that Reddy had nearly given up hope of catching him. Reddy knew that if he invited Peter again, Peter would suspect mischief right away. But Peter wouldn't think Sammy was planning a trick. Everyone knew Sammy as the greatest news teller in the Green Forest."
        - id: ch01-b12
          speaker: narrator
          text: "Reddy trotted down to the hollow log near the big hickory tree and crawled inside. Sammy flew to the Old Briar-patch and found Peter sitting beneath a large bramble bush."
        - id: ch01-b13
          speaker: sammy_jay
          text: "Good morning, Peter Rabbit."
        - id: ch01-b14
          speaker: narrator
          text: "Sammy used his very finest manners. Peter returned the greeting, but he looked sharply at Sammy. Sammy was not usually so polite to him. Peter began turning the strange greeting over in his mind, trying to understand what it meant."
        - id: ch01-b15
          speaker: sammy_jay
          text: "I saw the strangest thing in the world this morning."
        - id: ch01-b16
          speaker: narrator
          text: "Peter's ears stood up. In spite of all his questions about Sammy, he couldn't help growing curious."
        - id: ch01-b17
          speaker: peter_rabbit
          text: "What did you see, Sammy Jay?"
        - id: ch01-b18
          speaker: narrator
          text: "Sammy looked very mysterious."
        - id: ch01-b19
          speaker: sammy_jay
          text: "I really don't know what it is. But if you want to see it for yourself, Peter Rabbit, I can show you where it is."
        - id: ch01-b20
          speaker: narrator
          text: "Of course Peter wanted to see this strange thing for himself, so he set off across the Green Meadows with Sammy. The farther they went, the more time Peter had to think about Sammy's unusual invitation. By the time they were close to the old hickory tree, he had begun to suspect a trick."
        - id: ch01-b21
          speaker: narrator
          text: "Sammy motioned for Peter to come closer very carefully."
        - id: ch01-b22
          speaker: sammy_jay
          text: "It's right over there inside that hollow log. Go take a peek, Peter, and you'll see it."
        - id: ch01-b23
          speaker: narrator
          text: "Sammy got ready to give Reddy the signal. Peter hopped two steps closer. Then he sat up very straight and stared at the hollow log. Somehow, he didn't like the look of it. He couldn't say why. He simply didn't."
        - id: ch01-b24
          speaker: narrator
          text: "Just then, one of Old Mother West Wind's Merry Little Breezes came dancing along. He swept right past the hollow log and up to Peter, carrying a funny smell with him."
        - id: ch01-b25
          speaker: narrator
          text: "Peter's little wobbly nose wrinkled. That smell certainly reminded him of Reddy Fox. He wrinkled his nose once more, then suddenly spun around."
        - id: ch01-b26
          speaker: peter_rabbit
          text: "Excuse me, Sammy Jay! I just remembered something very important!"
          emotion: surprised
        - id: ch01-b27
          speaker: narrator
          text: "Before Sammy could open his mouth, Peter raced away like a little brown streak, straight back to the Old Briar-patch."
