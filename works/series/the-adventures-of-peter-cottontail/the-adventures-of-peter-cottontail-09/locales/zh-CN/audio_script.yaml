audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 急躁冲动，发怒时语气逼人
        timbre: 尖亮而略显粗粝
        pace: 偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 月光下的卷心菜
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔抬头看看银白的月亮，忍不住放声大笑。他快活地踢起后脚，又笑了一回，这才穿过绿草原，朝农夫布朗的菜园跑去。
        - id: ch01-b02
          speaker: narrator
          text: 原来，彼得对红狐雷迪一直很提防。今晚月色这么美，正适合出去走走。他便想去菜园转一趟，看看雷迪说的那片新卷心菜到底在不在那里。
        - id: ch01-b03
          speaker: narrator
          text: 彼得蹦蹦跳跳地走过绿草原，一路唱着歌。
        - id: ch01-b04
          speaker: peter_rabbit
          text: “月亮太太，先别走，把灯高高挂在夜空！给我照路，给我照路！小星星亮晶晶，夜里的伙伴都出来玩喽！”
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: 到了菜园，他很快就找到了刚种下的卷心菜。叶子真嫩，味道也真好！彼得马上吃起来，一口又一口，只想把圆圆的小肚子填得满满的。
        - id: ch01-b06
          speaker: narrator
          text: 吃到再也塞不下一口时，他无意间望向一片月光。就在那一瞬间，彼得吓得心都像停了。红狐雷迪正朝这片卷心菜直直走来！
    - id: ch02
      title: 会动的旧草帽
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得顿时慌了。雷迪眼下还没瞧见他，可过不了多久就会发现，除非他赶紧找地方藏起来。亲切的老荆棘丛离得太远，他来不及逃回去，只好急忙东张西望。
        - id: ch02-b02
          speaker: narrator
          text: 巧了，农夫布朗家小子的旧草帽就丢在旁边。晚饭号角一响，那小子把帽子留在这里，自己走了。彼得赶紧钻进去，整只兔子藏得严严实实。
        - id: ch02-b03
          speaker: narrator
          text: 他从帽檐下偷偷往外看。雷迪站在月光里，盯着新种的卷心菜，脸上还带着美滋滋的笑，仿佛心里正想着什么好事。彼得打了个寒战。他猜得到，雷迪正在盘算，等他离开安全的老荆棘丛，就把他一口吞下去。
        - id: ch02-b04
          speaker: narrator
          text: 彼得越想越气，竟忘了自己还在躲藏。他猛地用后腿坐起来，头顶的草帽也跟着升了起来。刚想起自己的处境，他又慌忙伏下去，草帽也一下落回原处。
    - id: ch03
      title: 雷迪逃跑了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 过了一会儿，彼得再次悄悄探头。雷迪正死死盯着那顶旧草帽，已经笑不出来了，看上去居然很害怕。彼得一下有了主意。
        - id: ch03-b02
          speaker: narrator
          text: 他仍把草帽罩在身上，朝雷迪连跳三大步。彼得藏得一点儿不露，帽子却跟着向前蹦。远远看去，简直像是草帽自己活了过来。
        - id: ch03-b03
          speaker: narrator
          text: 雷迪盯着这个穿过卷心菜地、一步步逼近的怪东西，又看了好一阵。接着，他夹起尾巴，使出全身力气，飞快地逃回家去了。
        - id: ch03-b04
          speaker: narrator
          text: 彼得就在原地趴下，笑呀，笑呀，怎么也笑不够。听起来，连那顶旧草帽都像是在陪他一起笑呢。
