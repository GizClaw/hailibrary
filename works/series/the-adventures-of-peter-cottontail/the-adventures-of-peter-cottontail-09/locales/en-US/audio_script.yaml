audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Reddy Fox Gets a Scare
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Peter Rabbit looked up at the silver moon and laughed out loud. Then he kicked up his heels, laughed once more, and set off across the Green Meadows toward Farmer Brown's garden. Peter was very suspicious of Reddy Fox. And since it was such a beautiful night for a walk, he meant to find out whether that newly planted cabbage bed Reddy had mentioned was really there."
        - id: ch01-b02
          speaker: narrator
          text: "Peter hopped and skipped across the meadows, singing as he went."
        - id: ch01-b03
          speaker: peter_rabbit
          text: "Hold, old Miss Moon, hold up your light! Show me the way, show me the way! The little stars are shining bright, and all the night folks are out to play."
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: "At Farmer Brown's garden, Peter quickly found the new cabbage plants. They were tender, and they tasted wonderful. My, how good they were! Peter began filling his little round stomach. He ate and ate and ate and ate. At last, just when he thought he couldn't manage one more mouthful, he glanced toward a patch of moonlight. For one second, his heart seemed to stop. Reddy Fox was coming straight toward the cabbage bed."
        - id: ch01-b05
          speaker: narrator
          text: "Peter didn't know what to do. Reddy hadn't seen him, but he soon would unless Peter found a hiding place. The dear Old Briar-patch was too far away. Peter looked one way, then the other. There it was! Farmer Brown's boy had left his old straw hat on the ground when the supper horn sounded. Peter crawled underneath, and the hat covered him completely."
        - id: ch01-b06
          speaker: narrator
          text: "Peter peeked from beneath one edge. Reddy stood in the moonlight, gazing at the newly planted cabbage. He wore a smile, as though he was thinking pleasant thoughts. Peter shivered. He could easily guess what Reddy had in mind. Once Peter was away from the safety of the Old Briar-patch, Reddy meant to gobble him up."
        - id: ch01-b07
          speaker: narrator
          text: "That thought made Peter so angry that he forgot he was hiding. He sat straight up on his hind legs, lifting the straw hat with him. Then he remembered where he was and dropped down in a hurry. The hat dropped just as fast."
        - id: ch01-b08
          speaker: narrator
          text: "After a moment, Peter peeked out again. Reddy Fox was staring and staring at the old hat. His smile was gone. In fact, he looked frightened. That gave Peter an idea."
        - id: ch01-b09
          speaker: narrator
          text: "Still hidden beneath the hat, Peter took three long hops straight toward Reddy. The old hat moved right along with him. Since it covered Peter from view, it looked for all the world as if the hat itself were alive."
        - id: ch01-b10
          speaker: narrator
          text: "Reddy gave the strange thing one last, long look as it came toward him through the cabbage bed. Then he raced for home as fast as he could go, with his tail between his legs."
        - id: ch01-b11
          speaker: narrator
          text: "Peter Rabbit lay down right where he was and laughed and laughed and laughed. It almost seemed as though the old straw hat was laughing, too."
