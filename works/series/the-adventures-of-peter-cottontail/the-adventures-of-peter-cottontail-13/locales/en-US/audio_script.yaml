audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and smooth, turning sharp when his temper breaks
        timbre: lean and slightly raspy
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Bobby Coon Finds Reddy
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Reddy Fox lay on the hillside. When Bobby Coon found him there and spoke to him, Reddy didn't answer. Bobby went closer for a look. Reddy's eyes were shut."
        - id: ch01-b02
          speaker: narrator
          text: "Bobby grinned. He crept a little nearer on tiptoe, put his face close to one of Reddy's little black ears, and shouted, ‘Boo!’ Reddy never moved."
        - id: ch01-b03
          speaker: narrator
          text: "Now Bobby looked serious. He gave Reddy a poke with his foot, but nothing happened. He pulled Reddy's tail. Still nothing. Bobby decided that Reddy Fox must be dead, and hurried away to spread the news."
    - id: ch02
      title: The Little People Gather
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "The news that Reddy Fox was dead caused a great stir on the Green Meadows and in the Green Forest. Everyone wanted to see him. Before long, a whole procession of little meadow and forest people was hurrying across the Green Meadows toward the hillside."
        - id: ch02-b02
          speaker: narrator
          text: "Jimmy Skunk came, and Johnny Chuck, Billy Mink, Little Joe Otter, Unc' Billy Possum, Danny Meadow Mouse, Spotty the Turtle, Old Mr. Toad, Grandfather Frog, Jerry Muskrat, Sammy Jay, Blacky the Crow, Happy Jack Squirrel, Striped Chipmunk, Jumper the Hare, and Prickly Porky. They all stood in a great circle around Reddy Fox."
        - id: ch02-b03
          speaker: narrator
          text: "Then they began talking about him. Some remembered the good things Reddy had done and called him a fine gentleman. Others remembered his mean deeds. They were glad they wouldn't have to keep watching out for him anymore."
        - id: ch02-b04
          speaker: narrator
          text: "It was surprising how many bad things they had to say. But they felt perfectly safe saying them. After all, wasn't Reddy lying there before them, stone dead?"
    - id: ch03
      title: Peter Has an Idea
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Peter Rabbit didn't hear the news until late that day. As soon as he did, he raced off as fast as his long legs could carry him, eager for one last look at Reddy."
        - id: ch03-b02
          speaker: narrator
          text: "Halfway there, Peter stopped and scratched one of his long ears. He had begun to think. It seemed very strange for Reddy Fox to die when no one had even heard that he was sick."
        - id: ch03-b03
          speaker: narrator
          text: "Peter set off again, but now he took his time. On the way, he cut a long twig and carried it with him. When he reached the circle around Reddy, he slipped up behind Prickly Porky the Porcupine and whispered in his ear."
        - id: ch03-b04
          speaker: narrator
          text: "Prickly Porky took the twig from Peter. Peter moved some distance away and climbed onto an old stump where he could watch. Then Prickly Porky leaned over and tickled one of Reddy's black ears."
        - id: ch03-b05
          speaker: narrator
          text: "For a moment, nothing happened. Then the black ear twitched. Prickly Porky tickled the tip of Reddy's little black nose. He tickled it once more. And what do you think happened? Reddy Fox sneezed!"
    - id: ch04
      title: Reddy Comes to Life
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "My, my, my! That circle around Reddy vanished in a flash. Everyone who was afraid of him scampered off as fast as they could run. The others stayed and laughed. Peter Rabbit laughed louder than anyone as he started home to the Old Briar-patch."
        - id: ch04-b02
          speaker: narrator
          text: "Reddy knew there was no point pretending to be dead now. He sprang to his feet and chased after Peter as fast as he could go. But by the time he reached the Old Briar-patch, Peter was safely inside. Reddy could hear him laughing as though his sides would split. Then Peter shouted from inside."
        - id: ch04-b03
          speaker: peter_rabbit
          text: "If at first you don't succeed, try, try again!"
          emotion: happy
