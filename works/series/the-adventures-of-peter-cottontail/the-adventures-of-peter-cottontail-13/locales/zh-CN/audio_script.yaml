audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 山坡上的红狐雷迪
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 浣熊博比在山坡上发现了红狐雷迪。博比开口叫他，雷迪却没有回答。他走近一看，雷迪双眼紧闭。博比暗暗一笑，踮着脚又靠近些，对准雷迪一只黑色的小耳朵猛喊一声：“嘿！”雷迪还是不动。博比不笑了。他伸脚捅捅雷迪，又拉了拉雷迪的尾巴，可雷迪始终没有动静。博比心想，红狐雷迪一定死了，便匆匆赶去把消息告诉大家。
        - id: ch01-b02
          speaker: narrator
          text: 绿色草原和绿色森林一下子轰动起来。小居民们听说雷迪死了，谁都想亲眼看一看。很快，大家排成长长的队伍，穿过绿色草原，赶往雷迪躺着的那片山坡。臭鼬吉米、土拨鼠约翰尼、水貂比利、小水獭乔、负鼠比利大叔、草地鼠丹尼、斑点龟、老蟾蜍先生、青蛙爷爷、麝鼠杰里、冠蓝鸦萨米、乌鸦布莱基、松鼠快乐杰克、条纹花栗鼠、野兔跳跳和豪猪刺刺，全都来了。他们围着雷迪站成一个大圆圈。
        - id: ch01-b03
          speaker: narrator
          text: 大家开始议论雷迪。有些小居民讲起他做过的好事，说他是位多么出色的绅士。另一些小居民却数落他做过的坏事，还说往后再也不用时时提防他了，实在叫人高兴。大家说出来的坏事竟有那么多，实在令人吃惊。不过，这些话说起来很安全。雷迪不是正躺在他们眼前，已经死得硬邦邦了吗？
    - id: ch02
      title: 彼得的试探
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得兔直到天色已晚才听见消息。他立刻迈开长腿，拼命赶去见雷迪最后一面。可走到半路，彼得忽然停下，挠了挠一只长耳朵。他越想越觉得奇怪。大家从没听说雷迪生病，他怎么会突然死了呢？彼得继续上路，这次却不再着急。过了一会儿，他折下一根长树枝，带在身边。到了人群外面，他悄悄走到豪猪刺刺身后，贴着刺刺的耳朵说了几句话。
        - id: ch02-b02
          speaker: narrator
          text: 刺刺接过彼得递来的树枝。彼得走到稍远的地方，爬上一个老树桩，好把一切看清楚。刺刺探过身，用树枝搔了搔雷迪的一只黑耳朵。起初什么也没发生。过了一会儿，那只耳朵忽然抽动一下。刺刺又去搔雷迪黑色小鼻子的尖儿，搔了一回，又搔一回。你猜怎么了？红狐雷迪竟然打了个喷嚏！
        - id: ch02-b03
          speaker: narrator
          text: 哎呀呀！那个大圆圈转眼就消失了！害怕雷迪的小居民全都撒腿逃跑，能跑多快就跑多快。不怕雷迪的那些，却留在那里哈哈大笑。笑得最响的就是彼得兔。他一边笑，一边动身返回老荆棘丛。
    - id: ch03
      title: 雷迪活过来了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 雷迪当然知道，再装死已经一点用也没有了。他一跃而起，使出全身力气追赶彼得。可是，等他冲到老荆棘丛，彼得早已安安全全地躲在里面。雷迪只能站在外面，听着彼得笑个不停。那笑声听起来，简直快把彼得的肚皮都笑破了。
        - id: ch03-b02
          speaker: peter_rabbit
          text: “一次不成，就再试一回呀！”
          emotion: happy
