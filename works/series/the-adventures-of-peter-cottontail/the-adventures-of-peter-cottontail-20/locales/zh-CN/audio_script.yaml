audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    ol_mistah_buzzard:
      display_name: 老秃鹫先生
      tts:
        delivery: 悠然风趣，话里藏着笑意
        timbre: 粗粝宽厚
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 越想越糊涂
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔坐在微笑池边，盯着青蛙爷爷刚才消失的地方。那儿溅起的水花早已落下，只剩一圈圈细小的波纹。波纹越荡越大，最后也看不见了。
        - id: ch01-b02
          speaker: narrator
          text: 可彼得心里的疑问一点儿也没消失。青蛙爷爷为什么说春天再见？土拨鼠约翰尼走进舒适小屋的长过道时，也说过同样的话。现在还没到冬天，离春天远着呢。他们整个冬天要待在哪儿，又会做些什么？彼得越想越不明白。
        - id: ch01-b03
          speaker: peter_rabbit
          text: “我的脑袋转呀转，怪事越想越没完。大家都说天冷没法待，可又不见谁要离开。他们都说春天再相见，为何这样，却不讲半点？”
        - id: ch01-b04
          speaker: peter_rabbit
          text: “他们一回到自己家，就只管跟我说再见。我真是怎么想也想不通！”
        - id: ch01-b05
          speaker: narrator
          text: 彼得望着那片大睡莲叶。整个夏天，青蛙爷爷都坐在那里，专等傻乎乎的绿头苍蝇自己送上门。如今叶子空了，不知为什么，彼得忽然觉得孤单极了。
        - id: ch01-b06
          speaker: narrator
          text: 就在这时，他一下有了个好主意。
        - id: ch01-b07
          speaker: peter_rabbit
          text: “我去问老秃鹫先生！他一定知道这一切究竟是怎么回事。”
    - id: ch02
      title: 快追上老秃鹫先生
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得说走就走，一蹦一跳地赶往绿色森林。没过多久，他已经能望见那棵高高的枯树了。老秃鹫先生最爱在那里歇脚。这会儿，他正舒展着两只大翅膀，看样子马上就要飞走。
        - id: ch02-b02
          speaker: narrator
          text: 彼得赶紧加快脚步。要是还没问明白约翰尼和青蛙爷爷的话，老秃鹫先生就飞走，那可怎么办？彼得本想喊住他，可他的嗓门本来就不大，况且一路跑来，早已喘得说不出响亮的话了。
        - id: ch02-b03
          speaker: narrator
          text: 他只好让两条长腿拼命往前跑。彼得的长腿一旦跑起来，速度可真是快得不得了。
        - id: ch02-b04
          speaker: narrator
          text: 眼看就要赶到枯树下，老秃鹫先生却从树枝上跳了下来。他用宽大的翅膀扑扇两三下，再把翅膀完全展开，就这样一圈圈盘旋着，越飞越高。这样的本事，只有老秃鹫先生才有。
        - id: ch02-b05
          speaker: peter_rabbit
          text: “等等！请等一等！老秃鹫先生，等等我！”
        - id: ch02-b06
          speaker: narrator
          text: 彼得上气不接下气，喊出来的声音太弱了，老秃鹫先生根本没听见。他倒是看到了彼得，却不知道彼得有话要说。只见他划出一道长长的弧线，从彼得头顶滑翔过去。
    - id: ch03
      title: 又是春天再见
      blocks:
        - id: ch03-b01
          speaker: ol_mistah_buzzard
          text: “兔子兄弟，再会啦！咱们春天见哩！”
        - id: ch03-b02
          speaker: narrator
          text: 彼得还来不及说一个字，老秃鹫先生已经飞到高空，听不见他的声音了。
        - id: ch03-b03
          speaker: narrator
          text: 彼得一直仰头望着。他看老秃鹫先生越升越高，越飞越远，最后在蓝蓝的天空里变成了一个小黑点。
        - id: ch03-b04
          speaker: peter_rabbit
          text: “他这话是什么意思？难道他要一直待在天上，等到春天才下来吗？”
        - id: ch03-b05
          speaker: narrator
          text: 彼得这样问着自己。可他不知道答案，自然也没法回答。
