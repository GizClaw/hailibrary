audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    ol_mistah_buzzard:
      display_name: Ol' Mistah Buzzard
      tts:
        delivery: slow, genial, and knowingly amused
        timbre: deep and airy
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Peter Tries Ol' Mistah Buzzard
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Peter Rabbit sat beside the Smiling Pool, staring at the spot where Grandfather Frog had vanished with a great splash. Tiny waves spread into wider and wider rings, and at last they vanished too. What had Grandfather Frog meant when he said he would see Peter in the spring?"
        - id: ch01-b02
          speaker: narrator
          text: "Johnny Chuck had said the very same thing before going down the long hall of his snug home. But spring was still a long, long way off. Winter had not even begun. Where would they be all winter? What would they do? The more Peter thought about it, the less sense it made."
        - id: ch01-b03
          speaker: peter_rabbit
          text: "My head is whirling round and round. So many funny things I've found. Folks say it grows too cold to stay, yet they don't seem to go away. They talk of meeting in the spring, but don't explain a single thing."
        - id: ch01-b04
          speaker: peter_rabbit
          text: "They just go into their homes and say good-bye. I don't understand it. I don't understand it at all."
        - id: ch01-b05
          speaker: narrator
          text: "Peter gazed at the big lily pad where Grandfather Frog had spent the whole summer watching for foolish green flies to come his way. Somehow, that empty lily pad made Peter feel terribly lonely. Then a happy thought came to him."
        - id: ch01-b06
          speaker: peter_rabbit
          text: "I'll run over and ask Ol' Mistah Buzzard what it means. He'll know for sure."
        - id: ch01-b07
          speaker: narrator
          text: "Off Peter went, lipperty-lipperty-lip, toward the Green Forest. When the tall dead tree came into view, he saw Ol' Mistah Buzzard on his favorite perch. The old Buzzard was stretching his great wings as if he meant to fly away."
        - id: ch01-b08
          speaker: narrator
          text: "Peter hurried faster. He didn't want Mistah Buzzard to get away before he could ask what Johnny Chuck and Grandfather Frog had meant. Peter couldn't call out. He had very little voice, and now he was out of breath anyway. So he made those long legs go as fast as they could, and they could go very fast indeed."
        - id: ch01-b09
          speaker: narrator
          text: "Peter was almost at the tree when Ol' Mistah Buzzard leaped from his branch. He beat his huge wings two or three times, spread them wide, and began sailing round and round, higher and higher, in the way only Ol' Mistah Buzzard could."
        - id: ch01-b10
          speaker: peter_rabbit
          text: "Wait! Please wait for me!"
        - id: ch01-b11
          speaker: narrator
          text: "Peter panted the words so weakly that Ol' Mistah Buzzard never heard. He did see Peter, but he had no idea that Peter wanted to speak with him. With one long swoop, he sailed directly over Peter's head."
        - id: ch01-b12
          speaker: ol_mistah_buzzard
          text: "Good-bye, Brer Rabbit. Ah'll see yo' in the spring!"
        - id: ch01-b13
          speaker: narrator
          text: "Before Peter could say a word, Ol' Mistah Buzzard was out of hearing, high in the sky. Peter watched him climb higher and higher until he was no more than a speck in the blue, blue sky."
        - id: ch01-b14
          speaker: peter_rabbit
          text: "Now what did he mean by that? Is he going to stay up in the sky until spring?"
        - id: ch01-b15
          speaker: narrator
          text: "Peter asked himself, but of course he didn't know. And so he couldn't answer."
