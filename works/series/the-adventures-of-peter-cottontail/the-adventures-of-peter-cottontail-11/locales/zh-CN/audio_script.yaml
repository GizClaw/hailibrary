audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 急躁冲动，发怒时语气逼人
        timbre: 尖亮而略显粗粝
        pace: 偏快
        pitch: 中高音
    shadow_weasel:
      display_name: 黄鼠狼影子
      tts:
        delivery: 阴冷自负，恼怒时尖刻急促
        timbre: 细窄而冷硬
        pace: 偏快
        pitch: 高音
    meadow_teaser:
      display_name: 取笑雷迪的小动物
      tts:
        delivery: 调皮而毫不掩饰地取笑
        timbre: 清亮
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 雷迪的坏主意
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 绿草原上的动物全听说了，彼得兔用一顶旧草帽，把红狐雷迪吓得够呛。打那以后，雷迪不管走到哪儿，总有人跟在后面唱歌笑他。
        - id: ch01-b02
          speaker: meadow_teaser
          text: “红狐雷迪真神气，胆子大得没人比，可惜见了旧草帽，东南西北全忘记！”
        - id: ch01-b03
          speaker: narrator
          text: 雷迪一听就发火，转身去追那些取笑他的家伙。他最想捉住的还是彼得兔。篱笆拐角、灌木后面、大树背后，他都躲过，可彼得每次都像早知道他在那里。
        - id: ch01-b04
          speaker: narrator
          text: 彼得只要钻进老荆棘丛就安全了。雷迪追进去过，可里面的小路太窄，荆棘又扯破衣裳，把他抓得浑身是伤。他只能退出来。
        - id: ch01-b05
          speaker: narrator
          text: 有一天，雷迪坐在家门口，阴着脸盯住老荆棘丛，忽然想到了黄鼠狼影子。影子身子细长，差不多什么地方都钻得进。他还特别凶，草原上的小动物没有几个不怕他。
        - id: ch01-b06
          speaker: narrator
          text: 雷迪露出一副阴险、恶毒又狡猾的笑容，跳起来就去找影子，把自己的计策说了出来。影子听完，也笑了。
        - id: ch01-b07
          speaker: shadow_weasel
          text: “这有什么难的，红狐雷迪？天底下再没有比这更容易的事了。肥母鸡有多好吃，咱们抓住彼得兔就有多准！”
        - id: ch01-b08
          speaker: narrator
          text: 两个家伙一起去了老荆棘丛。雷迪的办法很简单。影子钻进窄路追彼得，把他赶到绿草原上，雷迪就能一把将他捉住。
    - id: ch02
      title: 弯弯绕绕的小路
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 雷迪坐在外面等着，影子钻进了老荆棘丛。彼得听见他来了，马上跑了起来。不过，彼得当初在这里安家时，就料到影子有一天可能会来追他。
        - id: ch02-b02
          speaker: narrator
          text: 所以，彼得早就开出了数也数不清的小路。它们绕来绕去，互相交错，又一次次重叠。彼得熟悉每一个转弯，影子却没走多远，就不知道自己在哪儿了。
        - id: ch02-b03
          speaker: narrator
          text: 影子把尖鼻子贴在地上，闻着彼得的足迹往前追。可彼得不断横穿自己走过的路。没过多久，影子连彼得最后走了哪一条路也分不清了。
        - id: ch02-b04
          speaker: narrator
          text: 彼得把他越引越深，一直带到老荆棘丛正中央。那里有一大片水洼。彼得纵身一跳，稳稳落在对岸。别忘了，他那双长腿天生就适合跳跃。
    - id: ch03
      title: 水洼边的较量
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 影子最讨厌弄湿脚。他走到水洼边就停住了，只拿那双凶狠的小红眼睛瞪着对岸。彼得坐在那里望着他。影子没办法，只好沿着水边绕过去。
        - id: ch03-b02
          speaker: narrator
          text: 眼看影子就要绕到对岸，彼得轻轻一跃，又跳回这边。影子只得转过身，沿原路绕回来。谁知彼得又来了同样一招，还在心里偷偷发笑。影子越追越恼火。
        - id: ch03-b03
          speaker: narrator
          text: 最后，影子气昏了头，也想从水洼上跳过去。只听“扑通”一声，他结结实实掉进了水里！
        - id: ch03-b04
          speaker: narrator
          text: 影子爬上岸时，身上又湿又脏，彼得却已经不见了。他不知道彼得走了哪条路。更糟的是，他连自己该怎么出去也不知道。
        - id: ch03-b05
          speaker: narrator
          text: 影子一条路接一条路地试，每次没走多久，又回到了中央的水洼旁。黄鼠狼影子迷路了！没错，他真的在老荆棘丛里迷路了。
    - id: ch04
      title: 从小路里爬出来的家伙
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 红狐雷迪守在外面，一边等，一边盯着老荆棘丛。照原来的计划，受惊的彼得兔这会儿早该跳出来了。可他等了又等，连彼得的影子也没见着。雷迪怎么也想不明白，这究竟是出了什么事。
        - id: ch04-b02
          speaker: narrator
          text: 过了好久好久，终于有个家伙从彼得的一条小路里爬了出来。他满身泥泞，浑身湿透，累得几乎动不了。那正是黄鼠狼影子。
        - id: ch04-b03
          speaker: narrator
          text: 雷迪只看了他一眼，便赶紧离开。他一点儿也不想听影子会对他说什么。雷迪匆匆穿过绿草原时，老荆棘丛中央传来了彼得的喊声。
        - id: ch04-b04
          speaker: peter_rabbit
          text: “一次不成别灰心，再试，再试，还要再试！”
        - id: ch04-b05
          speaker: narrator
          text: 红狐雷迪听见了，气得直咬牙。
