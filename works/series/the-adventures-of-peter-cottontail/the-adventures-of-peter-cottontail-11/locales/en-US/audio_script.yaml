audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: smooth and sly, with forced sweetness when hiding his temper
        timbre: lean and slightly rough
        pace: measured
        pitch: medium-low
    shadow_weasel:
      display_name: Shadow the Weasel
      tts:
        delivery: sharp and menacing, with impatient confidence
        timbre: thin and cutting
        pace: quick
        pitch: medium-high
    meadow_neighbor:
      display_name: Meadow Neighbor
      tts:
        delivery: teasing and bold
        timbre: light and clear
        pace: lively
        pitch: medium
  chapters:
    - id: ch01
      title: Shadow the Weasel Gets Lost
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Everyone on the Green Meadows had heard how Peter Rabbit frightened Reddy Fox with an old straw hat. Wherever Reddy went, someone was sure to call after him."
        - id: ch01-b02
          speaker: meadow_neighbor
          text: "Reddy Fox looks brave and fine, until an old straw hat comes along. Then he doesn't know where he is!"
        - id: ch01-b03
          speaker: narrator
          text: "Every time he heard that teasing rhyme, Reddy lost his temper and chased whoever had shouted it. More than anyone, he wanted to catch Peter Rabbit. He waited for Peter in fence corners and hid behind bushes and trees. Somehow, Peter always seemed to know he was there."
        - id: ch01-b04
          speaker: narrator
          text: "Peter was safe inside the Old Briar-patch. Reddy had tried to follow him, but Peter's paths were too narrow. The brambles tore Reddy's clothes and scratched him until he had to give up."
        - id: ch01-b05
          speaker: narrator
          text: "One day, Reddy sat on his doorstep and scowled at the Old Briar-patch. As he thought about those narrow paths, Shadow the Weasel suddenly came to mind. Shadow was slim enough to go almost anywhere, and he was so fierce that nearly all the Little Meadow people were terribly afraid of him. Reddy smiled a mean, wicked, crafty smile. Then he jumped up and hurried off to find Shadow and explain his plan."
        - id: ch01-b06
          speaker: narrator
          text: "Shadow listened. Soon he was smiling too."
        - id: ch01-b07
          speaker: shadow_weasel
          text: "Why, this will be easy, Reddy Fox. Nothing could be easier! We'll catch Peter Rabbit just as surely as fat hens make a good meal."
        - id: ch01-b08
          speaker: narrator
          text: "The two of them started toward the Old Briar-patch. Reddy's plan was simple. Shadow would follow Peter through the little paths and drive him out onto the Green Meadows. Once Peter came out, Reddy would be there to catch him."
        - id: ch01-b09
          speaker: narrator
          text: "Reddy sat down outside to wait, and Shadow slipped into the briars. Peter heard him coming and began to run. Long ago, when Peter first made his home there, he knew Shadow might someday hunt him. So Peter had made dozens and dozens of paths. They twisted, turned, crossed, and crossed again until no stranger could tell where they led. Peter knew every turn, but Shadow soon became completely confused."
        - id: ch01-b10
          speaker: narrator
          text: "Shadow kept his sharp little nose close to the ground, trying to smell Peter's footsteps. But Peter crossed his own tracks again and again. Before long, Shadow couldn't tell which path Peter had taken last. Peter kept leading him deeper into the very middle of the Old Briar-patch."
        - id: ch01-b11
          speaker: narrator
          text: "There, Shadow came to a great big puddle. Peter had jumped clear across it. His long legs were made for jumping. Shadow hated getting his feet wet, so he stopped at the edge. With his fierce little red eyes, he glared at Peter sitting safely on the other side. Then Shadow began going around the puddle."
        - id: ch01-b12
          speaker: narrator
          text: "Peter waited until Shadow was almost all the way around. Then Peter sprang back across the water. Shadow had no choice but to turn and go around again. Peter played the same trick once more, laughing quietly to himself while Shadow grew angrier and angrier."
        - id: ch01-b13
          speaker: narrator
          text: "At last, Shadow became so angry that he tried to jump across the puddle himself. He fell right into the water with a tremendous splash!"
        - id: ch01-b14
          speaker: narrator
          text: "Shadow crawled out wet and muddy, but Peter had disappeared. Shadow couldn't tell which path Peter had taken. Even worse, he no longer knew which path would take him out. He tried one path, then another. Each time, after wandering for a while, he found himself right back at the puddle in the middle of the briars. Shadow the Weasel was lost. Yes, sir, he was truly lost in the Old Briar-patch."
        - id: ch01-b15
          speaker: narrator
          text: "Outside, Reddy Fox waited and watched. The frightened Peter Rabbit he expected never came jumping out. Reddy couldn't understand what had happened. After a long, long time, someone crawled from one of Peter's little paths. He was muddy, wet, and very tired. It was Shadow the Weasel."
        - id: ch01-b16
          speaker: narrator
          text: "Reddy took one good look at Shadow and hurried away. He didn't want to hear what Shadow might say. As Reddy crossed the Green Meadows, Peter's voice called from the middle of the Old Briar-patch."
        - id: ch01-b17
          speaker: peter_rabbit
          text: "If you don't succeed the first time, try, try again!"
        - id: ch01-b18
          speaker: narrator
          text: "Reddy Fox ground his teeth."
