audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 急躁冲动，发怒时语气逼人
        timbre: 尖亮而略显粗粝
        pace: 偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 太阳升起以前
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 天还黑着，离太阳升起足足有两个钟头。彼得兔已经悄悄离开老荆棘丛里那张暖和的小床，匆匆赶到老山核桃树下。雷迪果然没说错，树旁真有一片长得极好的香甜苜蓿。彼得越吃越开心，还忍不住暗自偷笑。他吃了又吃，直到小肚子撑得圆滚滚的，连蹦起来都费劲。
        - id: ch01-b02
          speaker: narrator
          text: 实在吃不下了，彼得才赶回老荆棘丛，准备再睡一会儿。一路上，他心里还在笑。原来，他根本信不过红狐雷迪，特意抢在太阳升起两个钟头以前，独自吃完了这顿早餐。
        - id: ch01-b03
          speaker: narrator
          text: 彼得前脚刚走，红狐雷迪后脚就到了。雷迪伏在草原上高高的长草丛里，咧着嘴等啊等。时间慢慢过去，快活、滚圆、红彤彤的太阳公公从紫山后面升起来了，彼得兔却始终没有露面。雷迪脸上的笑一下子没了。
        - id: ch01-b04
          speaker: reddy_fox
          text: “也许彼得正在老荆棘丛边等我。他大概没想耍我。”
    - id: ch02
      title: 最和气的笑脸
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 雷迪急忙赶到老荆棘丛。彼得果然正坐在边上，一见他来，马上闪到一大簇亲切的老荆棘后面。雷迪走近了，脸上堆着最灿烂的笑。
        - id: ch02-b02
          speaker: reddy_fox
          text: “早上好，彼得兔。咱们这就去吃那片香甜的苜蓿吧？”
        - id: ch02-b03
          speaker: narrator
          text: 彼得赶紧用手捂住嘴，不让雷迪看见他在笑。
        - id: ch02-b04
          speaker: peter_rabbit
          text: “哎呀，我实在太饿了，根本等不到太阳出来，所以两个钟头以前就去吃过啦。红狐雷迪，你可别见怪。谢谢你告诉我那片新苜蓿在哪儿，你真是太好心了。我只希望没给你添什么麻烦。”
        - id: ch02-b05
          speaker: reddy_fox
          text: “当然没有。能让你高兴，我也高兴极了。我最喜欢的，就是让别人高兴。”
        - id: ch02-b06
          speaker: narrator
          text: 只要雷迪愿意，他说起话来，听着真是再和气不过。
        - id: ch02-b07
          speaker: reddy_fox
          text: “对了，我刚听说，农夫布朗在菜园角落新种了一片嫩卷心菜。明天太阳一出来，你还到这里来，跟我一起去吃，怎么样？”
        - id: ch02-b08
          speaker: peter_rabbit
          text: “我当然愿意，真的愿意！”
        - id: ch02-b09
          speaker: narrator
          text: 彼得回答的时候，仍旧用手挡着脸，在后面偷偷发笑。
    - id: ch03
      title: 谁更聪明
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 雷迪向彼得告别的时候，脸上的笑容、嘴里的声音，全都和气得不能再和气了。可在心底深处，他早就气得不知该怎么办。他答应过老狐狸奶奶，要带一只鲜嫩的小兔子回家，如今却只能两手空空地回去。
        - id: ch03-b02
          speaker: narrator
          text: 雷迪一边走，一边在心里重新打起了主意。
        - id: ch03-b03
          speaker: reddy_fox
          text: “这一回，我要比太阳早两个钟头赶到那里。彼得兔，到时候咱们就瞧瞧，究竟谁更聪明！”
          emotion: angry
