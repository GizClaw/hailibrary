audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: smooth and sly, with forced sweetness when hiding his temper
        timbre: lean and slightly rough
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Peter Rabbit Gets an Early Breakfast
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Two hours before sunrise, Peter Rabbit slipped out of his snug little bed in the middle of the Old Briar-patch. He hurried to the big hickory tree. Sure enough, a beautiful patch of sweet clover grew nearby, just where Reddy Fox had said it would be. Peter chuckled while he ate and ate. Soon his round little stomach was so full he could barely hop."
        - id: ch01-b02
          speaker: narrator
          text: "Once he couldn't eat another bite, Peter hurried right back home to finish his morning nap, chuckling to himself the whole way. Peter didn't trust Reddy Fox, so he'd gone to the clover patch alone, two hours before sunrise."
        - id: ch01-b03
          speaker: narrator
          text: "Peter had hardly left the sweet clover patch when Reddy Fox arrived. Reddy settled into the long meadow grass and grinned to himself as he waited for Peter. The minutes went by, slowly and more slowly. At last, jolly, round, red Mr. Sun rose from behind the Purple Hills, but Peter Rabbit never came. Reddy stopped grinning."
        - id: ch01-b04
          speaker: reddy_fox
          text: "Maybe Peter's waiting for me at the edge of the Old Briar-patch. Perhaps he wasn't planning to trick me after all."
        - id: ch01-b05
          speaker: narrator
          text: "Reddy hurried to the Old Briar-patch. Sure enough, Peter sat right at the edge. The moment Peter saw him, he ducked behind a big clump of friendly old brambles. Reddy walked up wearing his broadest smile."
        - id: ch01-b06
          speaker: reddy_fox
          text: "Good morning, Peter Rabbit. Are you ready to go to that patch of sweet clover?"
        - id: ch01-b07
          speaker: narrator
          text: "Peter covered his mouth with one hand so Reddy wouldn't see his smile."
        - id: ch01-b08
          speaker: peter_rabbit
          text: "Oh, I was so terribly hungry for sweet clover that I couldn't wait for sunrise. I went there two hours ago. I hope you'll forgive me, Reddy Fox. It was very kind of you to tell me about that new clover patch. I hope I haven't caused you any trouble."
        - id: ch01-b09
          speaker: reddy_fox
          text: "Certainly not. It's a great pleasure to give you pleasure. There's nothing I like better than making others happy. By the way, I just heard that Farmer Brown has a new planting of young cabbage in the corner of his garden. Will you meet me here at sunrise tomorrow so we can go there together?"
        - id: ch01-b10
          speaker: narrator
          text: "Reddy used his sweetest voice. And Reddy Fox could sound very pleasant indeed when he chose to."
        - id: ch01-b11
          speaker: peter_rabbit
          text: "I'd be delighted. I truly would!"
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: "All the while, Peter hid a smile behind his hand. Reddy gave him the most pleasant good-bye you could imagine. But deep inside, Reddy was so angry he hardly knew what to do. Now he had to return to Granny Fox without the tender young rabbit he'd promised her."
        - id: ch01-b13
          speaker: reddy_fox
          text: "Next time, I'll be here two hours before sunrise. Then we'll see which of us is the clever one, Peter Rabbit!"
          emotion: angry
