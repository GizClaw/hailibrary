audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 从容淘气，话里带着坏笑
        timbre: 柔和厚实
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 一路说笑
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔沿着弯弯小径一路蹦跳而来。负鼠比利大叔总叫他兔子兄弟，别人却都叫他彼得。那天早上，彼得觉得浑身舒畅，真是说不出的快活。每隔一会儿，他就腾空一跃，在半空碰一碰两只脚后跟，只因为这样好玩。没过多久，他碰见了臭鼬吉米。
        - id: ch01-b02
          speaker: narrator
          text: 吉米刚从农夫布朗家的玉米地回来。他在那里帮乌鸦布莱基挣脱了套索。想到布莱基落入圈套的样子，他仍觉得又得意又好笑，一路上还在咯咯直乐。见到彼得，他非得把整件事从头到尾讲一遍不可。
        - id: ch01-b03
          speaker: narrator
          text: 彼得听了，也觉得这笑话妙极了。两个伙伴便肩并肩往前小跑，一路盘算该怎样把消息传遍绿色草原。一定要让大家都知道，那个总以为自己最聪明的乌鸦布莱基，居然也被捉住啦！
        - id: ch01-b04
          speaker: jimmy_skunk
          text: “说到这里，我才想起还没吃早饭呢。彼得兔，你今天早上看见甲虫了吗？”
        - id: ch01-b05
          speaker: narrator
          text: 彼得停下来，抬起长长的左后腿，挠了挠长长的左耳朵。
        - id: ch01-b06
          speaker: peter_rabbit
          text: “你这么一说，我好像真见过。”
        - id: ch01-b07
          speaker: jimmy_skunk
          text: “快告诉我，在哪儿？”
        - id: ch01-b08
          speaker: narrator
          text: 彼得装出使劲回想的样子。
        - id: ch01-b09
          speaker: peter_rabbit
          text: “我记得是在弯弯小径后头，就在山坡顶上那一带。”
        - id: ch01-b10
          speaker: jimmy_skunk
          text: “那我马上去找。”
        - id: ch01-b11
          speaker: peter_rabbit
          text: “走吧，我来带路。”
    - id: ch02
      title: 树桩边的甲虫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得兔在前面带路，沿着弯弯小径一跳一跳地往上走。臭鼬吉米就在后面紧紧跟着，一路小跑。走了一阵，他们来到一个老松树桩前。彼得停住脚，把一只手指放在嘴唇上。
        - id: ch02-b02
          speaker: peter_rabbit
          text: “嘘！树桩那边好像有一大家子甲虫。你从那边悄悄绕过去，我走这边。听见我跺地，你就立刻蹿出去，别让它们跑掉！”
        - id: ch02-b03
          speaker: narrator
          text: 吉米悄悄绕向树桩的一边，彼得也悄悄绕向另一边。忽然，彼得使劲跺了两下地。吉米早已在那边等着，连猛扑出去的架势都摆好了。一听到那两声响，他立刻使出全身力气，能蹿多快就蹿多快。你猜接着发生了什么？
    - id: ch03
      title: 扑了个正着
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 嘿，吉米“砰”的一声，正好落在红狐雷迪身上！原来，雷迪正在老松树桩的另一边晒着太阳打盹呢！
        - id: ch03-b02
          speaker: narrator
          text: 彼得兔放声大笑：“哈，哈，哈！”随即，他撒开两条长腿，沿着弯弯小径飞快地跑了。那双长腿能带他跑多快，他就跑多快。
