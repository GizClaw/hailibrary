audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, knowing, and quietly amused
        timbre: mellow and dry
        pace: relaxed
        pitch: medium-low
  chapters:
    - id: ch01
      title: Peter Rabbit Fools Jimmy Skunk
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Peter Rabbit came hopping and skipping down the Crooked Little Path. Unc' Billy Possum always called him Brer Rabbit, though everyone else called him Peter. That morning, Peter felt very fine indeed. Every few minutes he jumped high into the air and kicked his heels together, all for the fun of it. Before long, he met Jimmy Skunk."
        - id: ch01-b02
          speaker: narrator
          text: "Jimmy was coming back from Farmer Brown's cornfield. He had been helping Blacky the Crow escape from a snare, and he was still tickled and laughing over the way Blacky had been caught. Jimmy simply had to tell Peter the whole story."
        - id: ch01-b03
          speaker: narrator
          text: "Peter found it every bit as funny as Jimmy did. The two trotted along side by side, planning how to spread the news all over the Green Meadows. Soon everyone would hear that Blacky the Crow, who thought he was so clever, had been caught."
        - id: ch01-b04
          speaker: jimmy_skunk
          text: "That reminds me. I haven't eaten breakfast yet. Peter, have you spotted any beetles this morning?"
        - id: ch01-b05
          speaker: narrator
          text: "Peter stopped. With his long left hind foot, he scratched his long left ear."
        - id: ch01-b06
          speaker: peter_rabbit
          text: "Now that you mention it, I believe I did see some."
        - id: ch01-b07
          speaker: jimmy_skunk
          text: "Where were they?"
        - id: ch01-b08
          speaker: narrator
          text: "Jimmy asked eagerly, while Peter made a great show of thinking hard."
        - id: ch01-b09
          speaker: peter_rabbit
          text: "I think they were back up the hill, at the top of the Crooked Little Path."
        - id: ch01-b10
          speaker: jimmy_skunk
          text: "Then I'll go and look for them right now."
        - id: ch01-b11
          speaker: peter_rabbit
          text: "All right. I'll lead you there."
        - id: ch01-b12
          speaker: narrator
          text: "Up the Crooked Little Path went Peter, with Jimmy trotting close behind. After a while, they reached an old pine stump. Peter stopped and raised one hand to his lips."
        - id: ch01-b13
          speaker: peter_rabbit
          text: "Shh! I think a whole family of beetles is hiding on the far side of this stump. You sneak around one way, and I'll go around the other. When you hear me thump the ground, jump out and catch them before they get away."
        - id: ch01-b14
          speaker: narrator
          text: "Jimmy crept around one side of the stump. Peter crept around the other. Then Peter struck the ground hard, two times. Jimmy was waiting, ready to pounce. The moment he heard those thumps, he sprang as fast as he could. And what do you suppose happened?"
        - id: ch01-b15
          speaker: narrator
          text: "Jimmy Skunk landed with a thump right on top of Reddy Fox, who had been taking a sunny nap behind the pine stump!"
        - id: ch01-b16
          speaker: peter_rabbit
          text: "Ha, ha, ha!"
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: "Peter raced down the Crooked Little Path as fast as his long legs could carry him."
