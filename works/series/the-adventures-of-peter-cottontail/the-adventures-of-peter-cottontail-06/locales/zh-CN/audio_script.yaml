audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 急躁冲动，发怒时语气逼人
        timbre: 尖亮而略显粗粝
        pace: 偏快
        pitch: 中高音
    bowser_hound:
      display_name: 猎犬鲍泽
      tts:
        delivery: 洪亮有力，追赶时十分急切
        timbre: 浑厚响亮
        pace: 明快
        pitch: 中低音
    sheep:
      display_name: 绵羊
      tts:
        delivery: 温顺质朴，受惊时叫声急促
        timbre: 柔软清亮
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 老把戏不管用
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 红狐雷迪一路冲过绿色草原，跑上山坡，又钻进绿色森林。他已经使出了最快的速度。猎犬鲍泽就在后面，鼻子始终贴着地，响亮的吠声一路追着雷迪不放。
        - id: ch01-b02
          speaker: narrator
          text: 雷迪踏着一道老石墙往前跑，忽然使劲一跃，远远跳进田野。落地以后，他赶紧坐下来喘气。
        - id: ch01-b03
          speaker: reddy_fox
          text: “这一招应该能拖住他一阵子。”
        - id: ch01-b04
          speaker: narrator
          text: 鲍泽追到雷迪跳上石墙的地方，却只是咧嘴一笑。
        - id: ch01-b05
          speaker: bowser_hound
          text: “这么老的花样，还想瞒住我？一分钟都不可能。”
        - id: ch01-b06
          speaker: narrator
          text: 鲍泽绕着那里兜了个大圈。几分钟后，雷迪的足迹又被他找到了。
        - id: ch01-b07
          speaker: narrator
          text: 老狐狸奶奶讲过不少甩掉猎犬的办法，雷迪一种接一种地试，可没有一种奏效。雷迪做了什么，鲍泽好像全都知道，追赶时一点时间也没浪费。
    - id: ch02
      title: 毛茸茸的坐骑
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 雷迪越来越不安。他喘得上气不接下气，四条腿酸痛不已。就连那条平时最叫他骄傲的蓬松大尾巴，如今也像重得拖不动了。
        - id: ch02-b02
          speaker: narrator
          text: 老狐狸奶奶早就警告过他，除非到了保命的关头，千万不能往他们挖好的洞穴里跑。鲍泽一旦发现他们的家，他们就只能搬走。
        - id: ch02-b03
          speaker: narrator
          text: 雷迪真希望聪明的奶奶能来帮忙。这时，他正在农夫布朗家牧场后边奔逃，鲍泽的叫声听起来近得吓人。他一边跑，一边四处寻找逃走的机会。
        - id: ch02-b04
          speaker: narrator
          text: 前面出现了一大群毛茸茸的朋友，正是农夫布朗家的羊。雷迪一下有了主意。他猛地跳上一只羊的后背。那只羊受到的惊吓，一点也不比早晨臭鼬吉米落到雷迪身上时，雷迪受的惊吓小。
        - id: ch02-b05
          speaker: sheep
          text: “咩——咩——咩！”
          emotion: fearful
        - id: ch02-b06
          speaker: narrator
          text: 绵羊拔腿就跑。雷迪牢牢趴在羊背上，就这样飞快地越过了牧场。
    - id: ch03
      title: 鲍泽失去了踪迹
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 鲍泽追踪雷迪、彼得兔，还有自己的小主人——农夫布朗家的男孩时，靠的全是鼻子。他没有抬头看，自然没瞧见雷迪跳上羊背。
        - id: ch03-b02
          speaker: narrator
          text: 等鲍泽来到雷迪找到那匹古怪坐骑的地方，气味的线索忽然断了。他困惑地绕着圈子找了一遍又一遍，怎么也找不到雷迪留下的踪迹。
        - id: ch03-b03
          speaker: narrator
          text: 这时候，雷迪早已到了牧场另一头。他躲在石墙后面，一边把气喘匀，一边笑个不停。想到自己用这么聪明的办法骗过了猎犬鲍泽，他别提有多得意了。
