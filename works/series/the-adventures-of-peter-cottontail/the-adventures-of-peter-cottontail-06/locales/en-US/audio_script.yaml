audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: clever and confident, with quick flashes of worry
        timbre: bright and wiry
        pace: brisk
        pitch: medium-high
    bowser_hound:
      display_name: Bowser the Hound
      tts:
        delivery: determined and self-assured
        timbre: deep and resonant
        pace: steady
        pitch: low
    sheep:
      display_name: Sheep
      tts:
        delivery: startled and breathless
        timbre: soft and woolly
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Reddy Fools Bowser the Hound
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Reddy Fox raced across the Green Meadows, up the hill, and through the Green Forest as fast as he could go. Bowser the Hound followed close behind with his nose to the ground, baying as loudly as he could. Reddy ran along an old stone wall. Then he leaped from it as far out into the field as he could."
        - id: ch01-b02
          speaker: reddy_fox
          text: "That ought to fool him for a little while."
        - id: ch01-b03
          speaker: narrator
          text: "Reddy was panting as he sat down to catch his breath. But when Bowser reached the spot where Reddy had jumped onto the wall, he only grinned."
        - id: ch01-b04
          speaker: bowser_hound
          text: "That old trick won't fool me, not even for a minute."
        - id: ch01-b05
          speaker: narrator
          text: "Bowser made one wide circle. Within a few minutes, he had picked up Reddy's tracks again. Reddy tried every trick he had ever heard old Granny Fox tell about. Not one of them helped. Bowser always seemed to know exactly what Reddy was doing, and he never wasted any time."
        - id: ch01-b06
          speaker: narrator
          text: "Now Reddy was getting worried. He could hardly catch his breath. His legs hurt, and his big, plumey tail had grown terribly heavy. Reddy was very, very proud of that tail. Granny Fox had warned him never to run into their snug underground house unless he had to do it to save his life. If Bowser found out where they lived, they would have to move."
        - id: ch01-b07
          speaker: narrator
          text: "Reddy wished with all his heart that wise old Granny Fox would come and help him. He was running along the back of Farmer Brown's pasture, and Bowser sounded much too close. Reddy looked one way, then the other, searching for some way to escape. Just ahead stood a crowd of woolly friends. They were Farmer Brown's sheep."
        - id: ch01-b08
          speaker: narrator
          text: "Then Reddy had a bright idea. In a flash, he sprang onto the back of one of the sheep. The poor sheep was just as frightened as Reddy had been that morning, when Jimmy Skunk landed on him."
        - id: ch01-b09
          speaker: sheep
          text: "Baa! Baa! Baa!"
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: "The sheep began to run. Reddy held on tight, and off they raced across the pasture."
        - id: ch01-b11
          speaker: narrator
          text: "Bowser depends entirely on his nose when he follows Reddy Fox, Peter Rabbit, or even his master, Farmer Brown's boy. He never saw Reddy jump onto the sheep. So when Bowser reached the place where Reddy had found his strange horse, he couldn't understand what had happened. He went around and around in circles, but he could not find one trace of Reddy."
        - id: ch01-b12
          speaker: narrator
          text: "All that time, Reddy was sitting behind the stone wall on the far side of the pasture. He caught his breath and laughed and laughed. He had fooled Bowser the Hound, and he was mighty pleased with how cleverly he had done it."
