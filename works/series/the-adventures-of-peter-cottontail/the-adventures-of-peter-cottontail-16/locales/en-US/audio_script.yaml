audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: smooth and sly, with forced sweetness when hiding his temper
        timbre: lean and slightly rough
        pace: measured
        pitch: medium-low
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: easygoing and good-humored, with a teasing edge when playing a joke
        timbre: friendly and mellow
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Reddy Fox Tells a Wrong Story
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Reddy Fox was a sight that morning. He limped down toward the Green Meadows like a very old man. His head was so swollen that one eye was shut, and he could barely see from the other. He would never have gone out at all, except that he had to get fresh mud from the Smiling Pool."
        - id: ch01-b02
          speaker: narrator
          text: "Reddy waited until most of the little meadow people had gone. Then he hurried as much as he could, hoping to get home quickly. But Johnny Chuck spotted him. Johnny guessed at once what had happened and rushed off to tell Peter Rabbit."
        - id: ch01-b03
          speaker: narrator
          text: "Those two little scalawags found Jimmy Skunk and Bobby Coon and told them too. Then all four hid beside the Lone Little Path to wait for Reddy to come back."
        - id: ch01-b04
          speaker: narrator
          text: "Before long, Reddy came limping along. Even Johnny was surprised by how much his face had swollen. Fresh mud covered it all over, and poor Reddy looked sorrier than ever."
        - id: ch01-b05
          speaker: narrator
          text: "Bobby Coon acted amazed to see him that way. Of course, Johnny had already told Bobby the whole story. The day before, Reddy had run headfirst into the home of old Mrs. Hornet and her family."
        - id: ch01-b06
          speaker: narrator
          text: "Bobby stepped out onto the Lone Little Path."
        - id: ch01-b07
          speaker: bobby_coon
          text: "Why, Reddy Fox! What in the world happened to you?"
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: "Reddy never noticed the others hiding in the long grass. And he certainly didn't want Bobby to know how carelessly he had run into a hornets' nest. So Reddy made up a story instead. He tried to pull a long face, or as long a face as all that swelling would allow."
        - id: ch01-b09
          speaker: reddy_fox
          text: "Bobby Coon, I've had the most dreadful accident."
        - id: ch01-b10
          speaker: narrator
          text: "Reddy gave a pitiful sigh and began his tale."
        - id: ch01-b11
          speaker: reddy_fox
          text: "It happened yesterday, when I was coming home from an errand beyond the hill. I was passing through the deepest part of the woods when I heard someone crying. Naturally, I stopped to see what was wrong."
        - id: ch01-b12
          speaker: bobby_coon
          text: "Naturally! Certainly! Why, of course you did!"
        - id: ch01-b13
          speaker: narrator
          text: "Reddy gave Bobby a suspicious look. Then he went on."
        - id: ch01-b14
          speaker: reddy_fox
          text: "There, in the darkest, thickest part of the woods, I found one of Unc' Billy Possum's children. Digger the Badger was worrying that poor little Possum nearly to death. I couldn't stand by and watch the little fellow get hurt."
        - id: ch01-b15
          speaker: bobby_coon
          text: "No, of course you couldn't!"
        - id: ch01-b16
          speaker: reddy_fox
          text: "So I leaped in and fought old Digger. I had him nearly beaten when my foot slipped over the edge of a great rock on the hillside. The fall scraped all the skin from my face and bruised me terribly. But that doesn't matter, as long as I saved the little Possum."
        - id: ch01-b17
          speaker: narrator
          text: "With that, Reddy started on his way. Johnny Chuck crept up behind him and poked a sharp brier into the seat of Reddy's pants. At that very moment, Johnny made a noise like a whole family of hornets."
        - id: ch01-b18
          speaker: narrator
          text: "Reddy forgot all about his limp. He didn't even turn to see what was behind him. He simply raced away at his very best speed. Only when a roar of laughter sounded behind him did Reddy understand that he had been fooled again."
