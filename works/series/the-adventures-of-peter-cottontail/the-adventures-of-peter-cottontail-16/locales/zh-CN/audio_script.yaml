audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 急躁冲动，发怒时语气逼人
        timbre: 尖亮而略显粗粝
        pace: 偏快
        pitch: 中高音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 机灵顽皮，主意很多
        timbre: 圆润明亮
        pace: 轻快
        pitch: 中音
  chapters:
    - id: ch01
      title: 雷迪的狼狈模样
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 红狐雷迪那天早晨的模样，真叫人吓一跳。这可一点儿也不假。他一瘸一拐地走向绿色草原，活像个年纪很老很老的人。没错，雷迪看起来实在可怜。脑袋肿得老高，一只眼睛睁不开，另一只也几乎看不见。要不是非得去微笑池弄点新鲜泥巴，他根本不会出门。
        - id: ch01-b02
          speaker: narrator
          text: 雷迪特意等到草原上的小居民差不多都走了，才赶紧动身，想早去早回。可土拨鼠约翰尼眼尖，一下就发现了他，也猜到了出了什么事。约翰尼连忙告诉彼得兔。这两个小淘气又找到臭鼬吉米和浣熊博比，把消息也告诉了他们。四个伙伴躲在孤零零小径旁，等雷迪回来。
        - id: ch01-b03
          speaker: narrator
          text: 没过多久，雷迪一瘸一拐地出现了。连约翰尼都没料到，他的脸会肿得那么厉害。雷迪满脸都糊着刚从微笑池弄来的泥巴，别提有多狼狈了。
        - id: ch01-b04
          speaker: narrator
          text: 博比装出一副十分吃惊的样子。其实约翰尼早把一切都告诉了他。头一天，雷迪一头撞进了老黄蜂太太和她全家的家里。博比走到孤零零小径上。
        - id: ch01-b05
          speaker: bobby_coon
          text: “哎呀，红狐雷迪，你怎么变成这样啦？”
          emotion: surprised
    - id: ch02
      title: 一个假故事
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 雷迪没看见其他伙伴藏在高高的草丛里。他不想让博比知道，自己竟然粗心到一头撞进黄蜂窝，就决定编个故事。他还故意拉长了脸。只是那张脸肿成这样，想拉也拉不了多长。
        - id: ch02-b02
          speaker: reddy_fox
          text: “浣熊博比，我遇上了一桩可怕极了的意外。”
        - id: ch02-b03
          speaker: narrator
          text: 雷迪可怜巴巴地叹了口气，开始讲起来。
        - id: ch02-b04
          speaker: reddy_fox
          text: “事情就发生在昨天。我去山那边办完事，正往回走。到了树林最深的地方，我听见有人在哭。我当然得停下来，看看究竟出了什么事。”
        - id: ch02-b05
          speaker: bobby_coon
          text: “那当然！当然啦！可不是嘛！那还用说！”
        - id: ch02-b06
          speaker: narrator
          text: 雷迪疑心地瞧了博比一眼，还是接着往下讲。
        - id: ch02-b07
          speaker: reddy_fox
          text: “就在林子最密、最黑的地方，我看见负鼠比利大叔的一个孩子。獾迪格正欺负他，都快把那个小家伙折磨死了。我总不能眼睁睁看着他受伤吧。”
        - id: ch02-b08
          speaker: bobby_coon
          text: “当然不能！”
    - id: ch03
      title: 雷迪又上当了
      blocks:
        - id: ch03-b01
          speaker: reddy_fox
          text: “所以我马上扑过去，跟老獾打了起来。我眼看就要赢了，脚下一滑，从山坡上一块大岩石边上摔了下去。脸上的皮全擦破了，身上也撞得厉害极了。不过，只要那个负鼠小家伙得救，我才不在乎呢。”
        - id: ch03-b02
          speaker: narrator
          text: 雷迪说完，便继续赶路。土拨鼠约翰尼悄悄摸到他身后，拿一根尖利的荆棘，猛地戳在他裤子屁股那一块。与此同时，约翰尼还学一大家子黄蜂，发出一片嗡嗡声。
        - id: ch03-b03
          speaker: narrator
          text: 红狐雷迪顿时忘了自己还瘸着。他连头也没回，根本没看身后是什么，只管使出最快的速度拔腿就逃。直到背后爆发出一阵哄堂大笑，他才明白，自己又上当了。
