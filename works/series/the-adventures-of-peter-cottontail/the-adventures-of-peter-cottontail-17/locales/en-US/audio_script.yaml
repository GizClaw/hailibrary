audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: smooth and sly, with forced sweetness when hiding his temper
        timbre: lean and slightly rough
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Reddy Almost Gets Peter Rabbit
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Reddy Fox had been badly stung by old Mrs. Hornet and her family after he knocked in the side of their house. The stings had nearly made him ill, and he felt miserable. For several days, he limped about with his head terribly swollen. Yes, Sir, Reddy was in a dreadful state. Worst of all, none of the little people in the meadow or forest seemed sorry for him. Some even laughed. Peter Rabbit laughed too. Reddy had made Peter's life uncomfortable for so long that Peter was enjoying his trouble now."
        - id: ch01-b02
          speaker: narrator
          text: "While Reddy was laid up, he had plenty of time to think. Whenever he went walking, he saw that the little people who once stayed safely out of reach hardly moved aside now. They knew he was too sore and cross to chase them. Peter Rabbit barely changed his path at all. Then Reddy had a clever idea. Even after he got well, he would pretend he was still suffering. He would keep his head wrapped up and limp to the Smiling Pool for mud each day. Once Peter came close enough, Reddy would catch him."
        - id: ch01-b03
          speaker: narrator
          text: "So every day, Reddy limped down to the Smiling Pool. His head stayed tied up as though it had never improved, and he groaned with every step as if he were in awful pain. Before long, even some of the little people who disliked him most began to feel a bit sorry for him. Peter had a very soft heart. He knew Reddy would love to gobble him up, but even Peter began to pity him."
        - id: ch01-b04
          speaker: narrator
          text: "One morning, Peter was sitting just outside the Old Briar-patch when Reddy came limping by. He looked more miserable than ever. As he had for several days, Reddy kept one eye closed."
        - id: ch01-b05
          speaker: peter_rabbit
          text: "It must be awfully hard to see with just one eye."
        - id: ch01-b06
          speaker: narrator
          text: "Reddy gave a great sigh."
        - id: ch01-b07
          speaker: reddy_fox
          text: "Oh, it is, Peter. It really is very hard."
        - id: ch01-b08
          speaker: peter_rabbit
          text: "How do you ever find enough food to eat?"
        - id: ch01-b09
          speaker: narrator
          text: "Peter sounded as sympathetic as he could. Reddy sighed once more."
        - id: ch01-b10
          speaker: reddy_fox
          text: "I don't find enough, Peter Rabbit. I hardly get anything to eat. Why, I'm nearly starving right now."
        - id: ch01-b11
          speaker: narrator
          text: "There was such longing in Reddy's voice that Peter became suspicious at once. He did feel sorry for Reddy, but he had no wish to cheer him up by becoming Reddy's meal. Peter hopped around to Reddy's blind side, turned his back, and asked how old Granny Fox was feeling."
        - id: ch01-b12
          speaker: narrator
          text: "Now, Peter's eyes sit so far around the sides of his head that he can see behind himself without turning. Reddy didn't know that, or perhaps he had forgotten. Very slowly and very slyly, Reddy opened his closed eye just a crack. A hungry look gleamed through that thin line of yellow. Peter saw it. With one great leap, he landed safely behind a friendly bramble bush in the Old Briar-patch."
        - id: ch01-b13
          speaker: peter_rabbit
          text: "Ha, ha! I'd much rather talk to you when your closed eye doesn't have such a hungry look in it. Ta-ta, Reddy Fox!"
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: "Reddy Fox could only shake his fist at Peter. Then he started home, pulling the bandage from his head as he went."
