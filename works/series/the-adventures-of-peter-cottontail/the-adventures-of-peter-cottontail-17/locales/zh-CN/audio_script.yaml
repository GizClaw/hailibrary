audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 急躁冲动，发怒时语气逼人
        timbre: 尖亮而略显粗粝
        pace: 偏快
        pitch: 中高音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 机敏活泼，善良中带着谨慎
        timbre: 清亮稚气
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 雷迪差点捉住彼得兔
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 红狐雷迪撞破老黄蜂太太家的墙以后，被她和全家狠狠蜇了一顿，差点真的病倒。他一连几天都只能瘸着走路，脑袋也肿得老高，处境实在糟透了。可最让他难受的，是草原和森林里的小居民似乎没有谁同情他。有几个还拿他取笑，彼得兔也是其中之一。雷迪已经欺负彼得很久了。现在轮到雷迪吃苦头，彼得心里确实觉得有点痛快。
        - id: ch01-b02
          speaker: narrator
          text: 养伤的日子里，雷迪有的是时间打主意。他发现，自己一出门，那些平常远远见了他就躲的小居民，现在连路都不太肯让。大家都知道，他浑身疼，脾气又坏，根本追不上谁。连彼得兔也几乎不肯绕道了。雷迪忽然想到一个绝妙的办法。等伤养好了，他还要装成没有康复，脑袋照样缠着，每天瘸着走到微笑池去弄泥巴。等彼得走得够近，他就一把将彼得捉住。
        - id: ch01-b03
          speaker: narrator
          text: 就这样，雷迪一天又一天跛着脚去微笑池。他总把脑袋包得严严实实，好像伤势一点也没有好。走路时，他还装得痛苦极了，不停地呻吟。慢慢地，就连最讨厌他的几个小居民也有点同情他了。彼得的心很软。他明知道雷迪恨不得一口吞掉自己，却还是开始为雷迪难过。
        - id: ch01-b04
          speaker: narrator
          text: 一天早晨，彼得正坐在老荆棘丛外，雷迪一瘸一拐地走来了。他看起来比平时更加凄惨。和前几天一样，他的一只眼睛还是闭得紧紧的。
        - id: ch01-b05
          speaker: peter_rabbit
          text: “只睁着一只眼睛走路，肯定很费劲吧。”
        - id: ch01-b06
          speaker: reddy_fox
          text: “那当然了，真是费劲极了。”
        - id: ch01-b07
          speaker: narrator
          text: 雷迪说着，深深叹了口气。
        - id: ch01-b08
          speaker: peter_rabbit
          text: “你这个样子，怎么找得到足够的东西吃呢？”
        - id: ch01-b09
          speaker: narrator
          text: 彼得越说越同情雷迪。雷迪又叹了一声。
        - id: ch01-b10
          speaker: reddy_fox
          text: “我根本找不到那么多吃的，彼得兔。我一直吃不饱，都快要饿死了。”
        - id: ch01-b11
          speaker: narrator
          text: 可雷迪说到这里，声音里忽然露出一股馋得不得了的劲儿。彼得马上起了疑心。他虽然同情雷迪，却一点也不想把自己送给雷迪当饭吃，让雷迪舒服起来。于是，彼得蹦到雷迪看不见的那一边，背对着他，问起狐狸奶奶的身体怎么样。
        - id: ch01-b12
          speaker: narrator
          text: 彼得的眼睛长在脑袋两边，所以不用回头，也看得清身后的动静。雷迪却不知道这一点。就算他知道，也早就忘得干干净净了。只见他那只紧闭的眼睛极慢、极狡猾地睁开一条小缝。那一线黄色的眼珠里，露出了饥饿的神色。彼得看得清清楚楚，猛地一跳，落进老荆棘丛，躲到一株能保护他的荆棘后面。
        - id: ch01-b13
          speaker: peter_rabbit
          text: “哈！哈！红狐雷迪，等你那只闭着的眼睛不再馋巴巴地盯着我，我再来跟你聊天。再见啦！”
        - id: ch01-b14
          speaker: narrator
          text: 红狐雷迪拿彼得一点办法也没有，只能朝他挥了挥拳头，然后转身回家。他边走边扯下了缠在脑袋上的绷带。
