audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 亲切风趣，带着悠然的乡音
        timbre: 圆润厚实
        pace: 从容
        pitch: 中低音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 随和贪玩，透着跃跃欲试的劲头
        timbre: 温暖而略带沙哑
        pace: 轻松
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 安静随和，藏着不动声色的幽默
        timbre: 平稳厚实
        pace: 舒缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 彼得兔得到了教训
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔蜷在小卧房里，一会儿翻过来，一会儿转过去，怎么也睡不着。这间卧房就在长过道的尽头，整座老房子是臭鼬爷爷许多年前盖的。彼得越想睡，眼睛反倒睁得越亮。他又想到了红狐雷迪和狐狸奶奶。要是他们找来，看见自己在这里睡得正香，那可怎么办？念头刚转到这里，一阵响动猛地吓了彼得一跳。他一下撞到了脑袋。
        - id: ch01-b02
          speaker: narrator
          text: 可彼得连疼都没留意。他实在太害怕了，只敢屏住气听着，心里扑通、扑通直跳。那阵声音又来了！长长的黑过道里真的有人。彼得听得清清楚楚，那是爪子在抓挠。来者正在挖洞！一想到这里，他全身的毛都竖了起来。
        - id: ch01-b03
          speaker: narrator
          text: 彼得赶紧把认识的伙伴想了一遍。土拨鼠约翰尼早已睡下过冬。臭鼬吉米不费一点儿力气就能走进来，他最怕麻烦，能直接进门，决不会多挖一下。浣熊博比和负鼠比利大叔也不爱钻地下的房子，除非遇到危险，无处可逃。就算到了那一步，他们也很少往地下躲。
        - id: ch01-b04
          speaker: narrator
          text: 那么，过道里的家伙一定太大了，非得把路挖宽才能进来。彼得能想到的，只有猎狗鲍泽、红狐雷迪和狐狸奶奶。他越想越抖。这所房子可不像土拨鼠约翰尼的家，连一道后门也没有。
        - id: ch01-b05
          speaker: peter_rabbit
          text: 如果来的是猎狗鲍泽，他也许挖累了就走了。我很快就能听出来。他一定会到处嗅，还会呼哧呼哧，把鼻子里的沙子喷出去。
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: 彼得竖直耳朵，等着听鲍泽吸鼻子的声音。可是过道里没有嗅来嗅去的动静，也没有谁在呼呼喷气。偏偏就在这时，一声狐狸的叫声从门外传来，听着简直和红狐雷迪一模一样。彼得的心差点儿又不跳了。他认定，狐狸奶奶正在朝小卧房里挖，红狐雷迪就在外面替她望风。
        - id: ch01-b07
          speaker: peter_rabbit
          text: 哎呀，哎呀！我怎么就不能照从前的样子安稳过日子呢？明明不是我天生会做的事，我为什么偏要去试呀？
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: 彼得怕得越抖越厉害，可眼下除了老老实实坐着等，什么办法也没有。他尽量不动一下。过了一会儿，长过道里的声音停了。他等了好久，四周始终静悄悄的，心里才松快了一点儿。说不定狐狸奶奶根本不知道他在这里，只是挖累了，已经走远了。
        - id: ch01-b09
          speaker: narrator
          text: 彼得又耐着性子等了很久，终于探头望向长过道。过道尽头的门口透着亮光。既然能看见那片光，里面就一定没人。他的心还是扑通直响，只好一点一点往前挪，最后总算能朝门外张望了。
        - id: ch01-b10
          speaker: narrator
          text: 外面一个人也看不见。彼得紧张得心都快蹦到嗓子眼儿了。他猛地蹿出门，撒开两条长腿，飞快地往亲爱的老荆棘丛跑。就在这时，一阵声音钻进耳朵，他突然停下来，直起身子坐着。
        - id: ch01-b11
          speakers: [unc_billy_possum, bobby_coon, jimmy_skunk]
          ensemble: chorus
          text: 哈，哈，哈！呵，呵，呵！嘻，嘻，嘻！
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: 灌木丛后面，负鼠比利大叔、浣熊博比和臭鼬吉米笑得都快喘不上气了。彼得这才弄明白，刚才的一切都是他们合起来开的玩笑。他气呼呼地朝三个伙伴挥了挥拳头，心里却很庆幸。
        - id: ch01-b13
          speaker: narrator
          text: 彼得知道，这一回自己总算得到了教训。大自然老妈妈从没打算让他做的事，他就不该硬要去做。
        - id: ch01-b14
          speaker: narrator
          text: 当然，彼得兔的冒险故事还远远没有讲完。真的，还多着呢！不过，绿色草原和绿色森林里还有许多小家伙。他们也有自己的冒险，也常常闯进好笑的麻烦。暂时跟彼得道声晚安吧，我们该去听听其他伙伴的故事了。下一本书要讲彼得的一位朋友，那就是负鼠比利大叔。我们会听到他的烦恼和麻烦，也会听到他怎样一次次惊险逃生。
