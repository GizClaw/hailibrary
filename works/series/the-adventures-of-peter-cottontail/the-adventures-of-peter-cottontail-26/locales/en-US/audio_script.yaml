audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: easygoing and teasing, with a warm Southern lilt
        timbre: mellow and slightly rough
        pace: unhurried
        pitch: medium-low
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: playful and good-natured, with an impish edge
        timbre: soft and slightly husky
        pace: relaxed
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: calm and dryly amused
        timbre: smooth and mellow
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Peter Rabbit Learns His Lesson
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Peter Rabbit lay curled up in the little bedchamber at the far end of the long hall. The old underground house had been built long ago by Grandfather Skunk. Peter twisted one way, then the other, trying to feel sleepy. But the harder he tried, the wider awake he became."
        - id: ch01-b02
          speaker: narrator
          text: "Soon he began thinking about Reddy Fox and Granny Fox. What if they found him there, sound asleep? Just then, a noise made Peter jump so high that he bumped his head."
        - id: ch01-b03
          speaker: narrator
          text: "Peter never even noticed the bump. No, sir! He was far too frightened. He held his breath and listened while his heart went pit-a-pat, pit-a-pat. Then he heard the noise again. Someone was in that long, dark hall. He could hear claws scratching. Whoever it was, that someone was digging."
        - id: ch01-b04
          speaker: narrator
          text: "Digging! Every hair on Peter Rabbit stood on end. It couldn't be Johnny Chuck, because Johnny had gone to sleep for the winter. Jimmy Skunk could walk right in, and Jimmy never went to any trouble he could avoid. Bobby Coon and Unc' Billy Possum hardly ever entered underground houses either. They did it only when they had to escape from danger."
        - id: ch01-b05
          speaker: narrator
          text: "So if someone was digging in the hall, there could be only one reason. That visitor was too big to fit unless the hall was made wider. Peter could think of only Bowser the Hound, Reddy Fox, or Granny Fox. He began to shiver. Unlike Johnny Chuck's house, this old place had no back door."
        - id: ch01-b06
          speaker: peter_rabbit
          text: "If that's Bowser the Hound, maybe he'll get tired and leave. I'll know soon enough. He'll sniff and snuff, then blow the sand out of his nose."
        - id: ch01-b07
          speaker: narrator
          text: "Peter strained his ears, waiting for the first sniff."
        - id: ch01-b08
          speaker: narrator
          text: "But he heard no sniffing or snuffing. Instead, another sound nearly stopped his heart. It was a bark, and it sounded very much like Reddy Fox. The bark came from just outside the door. Peter was sure he understood now. Old Granny Fox must be digging her way into the bedchamber while Reddy stood watch outside."
        - id: ch01-b09
          speaker: peter_rabbit
          text: "Oh, dear! Why couldn't I be content to live the way I've always lived? Why did I ever try to do something I wasn't meant to do?"
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: "Peter shook harder than ever. There was nothing he could do except sit still and wait, so he made himself as still as he possibly could."
        - id: ch01-b11
          speaker: narrator
          text: "After a while, the digging in the long, dark hall stopped. Peter waited and waited. Everything stayed quiet, and he began to feel a little better. Perhaps Granny Fox didn't know he was there. Perhaps she had grown tired of digging and gone away."
        - id: ch01-b12
          speaker: narrator
          text: "Peter waited a long time before peeping into the hall. Far away at the other end, light shone through the doorway. That told him no one was inside."
        - id: ch01-b13
          speaker: narrator
          text: "Little by little, with his heart still going pit-a-pat, Peter crept along the hall until he could peek outside. He couldn't see anyone. His heart seemed to be right in his mouth as he sprang out and raced toward the dear Old Briar-patch as fast as his long legs could carry him."
        - id: ch01-b14
          speaker: narrator
          text: "Then a sound made him stop short and sit up."
        - id: ch01-b15
          speakers: [unc_billy_possum, bobby_coon, jimmy_skunk]
          ensemble: chorus
          text: "Ha, ha, ha! Ho, ho, ho! Hee, hee, hee!"
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: "There behind some bushes were Unc' Billy Possum, Bobby Coon, and Jimmy Skunk. They were laughing as hard as they could."
        - id: ch01-b17
          speaker: narrator
          text: "At once, Peter knew the three of them had played a joke on him. He shook his fist at them. But deep down, Peter was glad. He had learned his lesson. He had no business trying to do something Old Mother Nature had never meant for him to do."
        - id: ch01-b18
          speaker: narrator
          text: "Of course, these aren't all of Peter Rabbit's adventures. Oh my, no! But many other little people live on the Green Meadows and in the Green Forest. They have adventures too, and they get into some very funny scrapes. So I'm sure you won't mind saying good night to Peter for a little while. It's time to hear what has happened to some of the others."
        - id: ch01-b19
          speaker: narrator
          text: "In the next book, I'll tell you about the worries, troubles, and exciting escapes of one of Peter's friends, Unc' Billy Possum."
