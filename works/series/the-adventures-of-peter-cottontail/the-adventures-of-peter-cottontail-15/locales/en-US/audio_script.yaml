audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and smooth, turning sharp when his temper breaks
        timbre: lean and slightly raspy
        pace: measured
        pitch: medium-low
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: friendly and good-hearted, with a practical, playful wit
        timbre: warm and sturdy
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and matter-of-fact, with quiet confidence
        timbre: mellow and slightly nasal
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Johnny Chuck Helps Peter
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Johnny Chuck had watched Reddy Fox try again and again to fool Peter Rabbit and catch him. Sometimes Johnny had been terribly afraid that Reddy might succeed. But Peter was too clever for him every time. Whenever the Merry Little Breezes brought another story of how Peter had outwitted Reddy, Johnny laughed along with all the other little people of the Green Meadows."
        - id: ch01-b02
          speaker: narrator
          text: "One fine morning, Johnny was laughing harder than ever over one of Peter's tricks. Then Jimmy Skunk stopped to chat with him."
        - id: ch01-b03
          speaker: jimmy_skunk
          text: "Peter will have to be more watchful than ever. Granny Fox is almost well, and she's very angry that Reddy couldn't catch Peter for her while she was sick. She says she'll show that stupid Reddy how to catch him, and she'll do it quickly."
        - id: ch01-b04
          speaker: narrator
          text: "The laughter vanished from Johnny's face. He looked very serious indeed."
        - id: ch01-b05
          speaker: johnny_chuck
          text: "We can't let old Granny Fox catch Peter. We can't let that happen at all. Every one of us must help him. Why, what would the Green Meadows and the Green Forest be like without Peter Rabbit?"
        - id: ch01-b06
          speaker: narrator
          text: "Late that afternoon, Johnny happened upon Peter Rabbit taking a nap. Yes, sir, Peter had truly fallen asleep outside the dear Old Briar-patch. Johnny's first thought was to wake him and warn him that Reddy Fox was hunting nearby."
        - id: ch01-b07
          speaker: narrator
          text: "But then Johnny's bright eyes caught sight of something that made him chuckle. There was the beautiful home of some hot-tempered friends of his. It looked as if it were made of gray paper, and it hung from a bush just above a little path. That path led straight to the spot where Peter lay sound asleep."
        - id: ch01-b08
          speaker: narrator
          text: "Johnny chuckled once more and hurried away. He settled on top of a little hill. Before long, Reddy Fox came through the hollow below."
        - id: ch01-b09
          speaker: johnny_chuck
          text: "Hello, Reddy Fox! Would you like me to tell you how to catch Peter Rabbit?"
        - id: ch01-b10
          speaker: narrator
          text: "Reddy looked up, uncertain what to say. Johnny Chuck and Peter had always been the best of friends. Still, friends did sometimes quarrel. Perhaps Johnny and Peter had quarreled too. Reddy decided to be polite."
        - id: ch01-b11
          speaker: reddy_fox
          text: "I certainly would, Johnny Chuck. Can you really tell me how?"
        - id: ch01-b12
          speaker: johnny_chuck
          text: "Yes. Peter is sleeping over there, behind that little clump of huckleberry bushes. A small path runs right through them. Just race up that path as fast and quietly as you can."
        - id: ch01-b13
          speaker: narrator
          text: "Reddy Fox didn't wait to hear another word. His eyes gleamed, and off he went up the little path as fast as he could run. Just as Johnny expected, Reddy was in such a hurry that he used his eyes only to search for Peter Rabbit."
        - id: ch01-b14
          speaker: narrator
          text: "Bang! Reddy ran headfirst into the paper home of Johnny Chuck's hot-tempered friends. He smashed the whole side of it. Out rushed old Mrs. Hornet and her entire family, all carrying their little needles."
        - id: ch01-b15
          speaker: narrator
          text: "Reddy forgot Peter Rabbit at once. He howled as loudly as he could and raced for home. He slapped at old Mrs. Hornet, but he could never hit her. Every few minutes, he stopped to roll over and over."
        - id: ch01-b16
          speaker: narrator
          text: "Naturally, Reddy's howling woke Peter. Peter sat up to find out what all the fuss was about. He saw Reddy running as though his life depended on it. Then he spotted Johnny Chuck on the little hill, laughing until tears streamed down his face."
        - id: ch01-b17
          speaker: narrator
          text: "Peter began laughing too. Then he ran over and asked Johnny to tell him the whole story."
