audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 急躁冲动，发怒时语气逼人
        timbre: 尖亮而略显粗粝
        pace: 偏快
        pitch: 中高音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 热心机敏，笑起来爽朗
        timbre: 厚实明亮
        pace: 适中而轻快
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 随和直爽，说消息时认真
        timbre: 温和略低沉
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 狐狸奶奶要出手了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 土拨鼠约翰尼亲眼见过红狐雷迪一次次哄骗彼得兔，想把彼得捉住。有几回，他真怕雷迪会得手，心里着实替彼得担忧。可每一次，彼得都比雷迪更机灵。快乐小微风每带回一个新故事，说彼得又怎样胜过了雷迪，约翰尼就会和绿色草原上的其他小居民一起笑个痛快。
        - id: ch01-b02
          speaker: narrator
          text: 一个晴朗的早晨，臭鼬吉米停下来，跟约翰尼聊起这件事。
        - id: ch01-b03
          speaker: jimmy_skunk
          text: “彼得往后得更当心才行。狐狸奶奶快病好了。她生病时，雷迪没能替她捉到彼得，她气坏了。她说，要让那个笨蛋雷迪瞧瞧，怎样才能又快又利落地把彼得捉住。”
        - id: ch01-b04
          speaker: narrator
          text: 约翰尼刚才还在笑彼得耍过的一个妙招。听完这番话，他马上严肃起来，而且严肃极了。
        - id: ch01-b05
          speaker: johnny_chuck
          text: “可不能让狐狸奶奶捉住彼得，绝对不行。咱们大家都要帮他。你想，要是没了彼得兔，绿色草原和绿色森林会成什么样？”
    - id: ch02
      title: 通向彼得的小路
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那天下午很晚了，约翰尼碰巧看见彼得在睡午觉。没错，先生，他竟然睡在亲爱的老荆棘丛外面。约翰尼本想叫醒他，告诉他雷迪就在附近搜寻。可他忽然看到一样东西，忍不住轻声笑了。
        - id: ch02-b02
          speaker: narrator
          text: 那是几位暴脾气朋友的家，漂亮得很，看起来像灰纸做的。它牢牢粘在一丛灌木上，下面正好有条小路，一直通向彼得熟睡的地方。约翰尼又笑一声，匆匆离开，来到一座小山顶上坐好。没多久，雷迪沿着山下的洼地走来了。
        - id: ch02-b03
          speaker: johnny_chuck
          text: “你好啊，红狐雷迪！你想不想知道，怎么才能捉住彼得兔？”
        - id: ch02-b04
          speaker: narrator
          text: 雷迪抬头看着约翰尼，不知道该怎么回答。他明明知道，约翰尼和彼得一向是最好的朋友。可是朋友偶尔也会闹翻，说不定他俩真的翻脸了。雷迪决定客气一点。
        - id: ch02-b05
          speaker: reddy_fox
          text: “我当然想知道，土拨鼠约翰尼。你能告诉我吗？”
        - id: ch02-b06
          speaker: johnny_chuck
          text: “能。彼得就在那边一小丛越橘灌木后面睡觉。灌木里有条小路。你沿着它冲过去就行，动作越快越好，声音越轻越好。”
        - id: ch02-b07
          speaker: narrator
          text: 雷迪一句也不肯再等。他眼睛闪着亮光，使出最快的速度，飞快地冲上那条小路。事情果然和约翰尼料想的一样。雷迪跑得太急，眼睛只顾找彼得兔的踪影，别的东西一样也没看。
    - id: ch03
      title: 暴脾气朋友的尖针
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 砰！雷迪一头撞上了那座纸房子。那正是约翰尼那几位暴脾气朋友的家，连一整面墙都被撞塌了。老黄蜂太太带着全家一涌而出，每一只都带着自己的小尖针。雷迪立刻忘了彼得兔。他放声大叫，撒腿往家逃。一路上，他不停拍打老黄蜂太太，却一下也打不中。每隔几分钟，还得停下来满地翻滚。
        - id: ch03-b02
          speaker: narrator
          text: 雷迪叫得那么响，彼得当然醒了。他坐起来，想看看出了什么事。只见雷迪拼命飞奔，就像这条命全靠两条腿保着。再望向小山，约翰尼笑得眼泪都流下来了。
        - id: ch03-b03
          speaker: narrator
          text: 彼得也笑了。他跑到约翰尼身边，请约翰尼把整件事从头讲给他听。
