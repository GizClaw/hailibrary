audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 急躁冲动，发怒时语气逼人
        timbre: 尖亮而略显粗粝
        pace: 偏快
        pitch: 中高音
    blacky_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 响亮机敏，善于一本正经地逗趣
        timbre: 清朗略带沙哑
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 大石头下的午睡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: “蹦蹦跳，向前跑，阳光明亮亮。哼支曲，唱支歌，我的心儿多欢畅。”彼得兔就是这样，总把日子过得无忧无虑。红狐雷迪接连好多天都想捉住他。为了躲开雷迪，彼得只得把脑筋转得飞快，时时留神。可这件事似乎并没有让他发愁。此刻，他正沿着那条孤零零的小路一路蹦跳，心里没有半点烦恼。
        - id: ch01-b02
          speaker: narrator
          text: 走着走着，彼得在一块大石头旁找到一片凉爽的树荫。石头一边的下面留着一个空当，正好够他钻进去睡午觉。彼得也困了，便往里一钻，很快睡得香甜。
        - id: ch01-b03
          speaker: narrator
          text: 睡梦里，彼得走了好远好远，离安全的老荆棘丛越来越远。突然，红狐雷迪从一大丛灌木后面蹿出来。眼看那排牙齿就要咬到自己，彼得猛然惊醒。
        - id: ch01-b04
          speaker: narrator
          text: 原来他还好端端地躺在大石头底下，又舒服又安全。彼得一下子松了口气，差点欢呼起来，幸好及时忍住了。才过一分钟，他就万分庆幸自己没有出声。一个声音在耳边响起，近得不得了。那是谁？没错，先生，正是红狐雷迪。
    - id: ch02
      title: 石头上面的圈套
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得连大气也不敢出，更别说弄出一点声响了。你尽可以相信，就连最轻的一点动静，他也没有弄出来。雷迪就坐在彼得歇息的那块石头上，正和乌鸦布莱基说话。彼得竖起耳朵，拼命去听。你猜雷迪在说什么？原来，他想出了一个捉彼得的新圈套，还要请布莱基来帮忙。
        - id: ch02-b02
          speaker: narrator
          text: 彼得从没这么害怕过。雷迪坐在石头边沿，两只脚跟就在他眼前晃来晃去，近得让彼得一伸爪子就能碰到。过了一会儿，布莱基开了口。
        - id: ch02-b03
          speaker: blacky_crow
          text: “今天一大早，我看见彼得往这边来了。他应该还没回家。你去老荆棘丛附近藏好，等他回来，不就能捉住他了吗？我替你盯着。要是碰见彼得，我就说你翻过大山，到很远的地方找早饭去了。这样一来，他准不会提防。”
        - id: ch02-b04
          speaker: reddy_fox
          text: “这办法太合适了！只要能捉住彼得，我一定会好好谢你，布莱基。我现在就去。”
        - id: ch02-b05
          speaker: narrator
          text: 两个坏家伙又仔细盘算了一番。想到彼得兔这回就要上当，他们忍不住得意地咯咯直笑。
        - id: ch02-b06
          speaker: reddy_fox
          text: “我的肚子饿了。这块老石头下面，会不会藏着一只田鼠？我要看看。”
        - id: ch02-b07
          speaker: narrator
          text: 雷迪说着站起来，伸了个懒腰，接着从大石头上滑了下来。
    - id: ch03
      title: 真够险的
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得听见动静，心几乎停跳了。他拼命朝石头深处扭动，又把气屏住。就在这时，乌鸦布莱基忽然尖叫起来：“哇！哇！哇！”这叫声表示他看见了什么。紧接着，彼得听见猎犬鲍泽的声音。平日里，这声音常把他吓坏，现在听来却比什么都叫人高兴。
        - id: ch03-b02
          speaker: narrator
          text: 雷迪也听见了。他再也没有停下来查看大石头底下，立刻逃走了。
        - id: ch03-b03
          speaker: narrator
          text: 彼得又等了一会儿，才小心地从歇息的地方爬出来。他爬到一处高地，从那里可以望遍绿色草原。远在草原另一边，红狐雷迪正使出全力飞奔，猎犬鲍泽就在后面紧追不舍。
        - id: ch03-b04
          speaker: narrator
          text: 彼得终于伸了伸四肢。
        - id: ch03-b05
          speaker: peter_rabbit
          text: “哎呀，刚才真是险得不能再险了！”
