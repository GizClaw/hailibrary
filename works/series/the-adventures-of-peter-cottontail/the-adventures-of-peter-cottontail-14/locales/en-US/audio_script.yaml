audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and smooth, turning sharp when his temper breaks
        timbre: lean and slightly raspy
        pace: measured
        pitch: medium-low
    blacky_crow:
      display_name: Blacky the Crow
      tts:
        delivery: shrewd and matter-of-fact, with a knowing edge
        timbre: dry and crisp
        pace: measured
        pitch: medium
    bowser_hound:
      display_name: Bowser the Hound
      tts:
        delivery: loud and determined, with an eager hunting call
        timbre: deep and full
        pace: brisk
        pitch: low
  chapters:
    - id: ch01
      title: Peter Rabbit in a Tight Place
      blocks:
        - id: ch01-b01
          speaker: peter_rabbit
          text: "Hop along, skip along, while the sun is shining bright. Hum a song, sing a song, for my heart is always light."
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: "It was true. Peter Rabbit was almost always lighthearted. For days, Reddy Fox had been trying to catch him. Peter had needed all his wits to stay out of Reddy's way, but he didn't seem very worried. Just then, he was hopping and skipping down the Lone Little Path without a care in the world."
        - id: ch01-b03
          speaker: narrator
          text: "Soon Peter found a cool, shady spot beside a big rock. There was just enough room beneath one edge for him to crawl under. It looked like the perfect place for a nap. Peter was growing sleepy, so in he went. Before long, he was fast asleep."
        - id: ch01-b04
          speaker: narrator
          text: "After a while, Peter began to dream. In his dream, he had wandered far, far away from the safe Old Briar-patch. Suddenly, Reddy Fox sprang from behind a big bush. Just as Reddy's teeth were about to close on him, Peter woke up."
        - id: ch01-b05
          speaker: narrator
          text: "What a relief! Peter was tucked safely beneath the big rock. He nearly shouted out loud, but he stopped himself. A minute later, he was very glad he had. A voice sounded almost right in his ear. It belonged to Reddy Fox. Yes, sir, Reddy Fox himself was speaking."
        - id: ch01-b06
          speaker: narrator
          text: "Peter scarcely dared to breathe. He didn't make the tiniest sound. Reddy was sitting on the very rock above him, talking to Blacky the Crow. Peter listened as hard as he could. Reddy was telling Blacky about a new plan to catch Peter Rabbit, and he wanted Blacky's help."
        - id: ch01-b07
          speaker: narrator
          text: "Peter had never been so frightened. Reddy was close enough for Peter to reach out and touch one of his legs as the fox kicked his heels over the rock's edge. At last, Blacky spoke."
        - id: ch01-b08
          speaker: blacky_crow
          text: "I saw Peter Rabbit heading this way early this morning, and I don't think he's gone home yet. Why don't you hide near the Old Briar-patch and catch him when he comes back? I'll keep watch. If I see Peter, I'll tell him you went looking for breakfast far beyond the big hill. Then he won't be watching for you."
        - id: ch01-b09
          speaker: reddy_fox
          text: "That's just the plan we need! If I catch him, Blacky, I'll be sure to do something for you. I think I'll leave right now."
        - id: ch01-b10
          speaker: narrator
          text: "The two rascals went over their plan together. They chuckled when they imagined how they would outwit Peter Rabbit and catch him on his way home. Peter lay beneath them and heard it all."
        - id: ch01-b11
          speaker: reddy_fox
          text: "I'm getting hungry. Maybe a field mouse is hiding under this old rock. I'll take a look."
        - id: ch01-b12
          speaker: narrator
          text: "Reddy stood up and stretched, ready to search for the field mouse he thought might be there. As Peter heard him slide down from the big rock, his heart nearly stopped. Peter wriggled even farther underneath and held his breath."
        - id: ch01-b13
          speaker: blacky_crow
          text: "Caw, caw, caw!"
        - id: ch01-b14
          speaker: narrator
          text: "Blacky's sharp call meant that he had spotted something. Almost at once, Peter heard a sound that sometimes filled him with fear. This time, it filled him with joy. It was Bowser the Hound's voice. Reddy heard it too, and he didn't wait to look beneath the rock."
        - id: ch01-b15
          speaker: bowser_hound
          text: "Bow-wow-wow!"
        - id: ch01-b16
          speaker: narrator
          text: "Peter waited a little while. Then he crept very cautiously from his hiding place and climbed up where he could look across the Green Meadows. Far away on the other side, he saw Reddy Fox running at the very top of his speed, with Bowser the Hound racing behind him."
        - id: ch01-b17
          speaker: peter_rabbit
          text: "My, that was a tight place!"
        - id: ch01-b18
          speaker: narrator
          text: "Peter stretched himself as he said it."
