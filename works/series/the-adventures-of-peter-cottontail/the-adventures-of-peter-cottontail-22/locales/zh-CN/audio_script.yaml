audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 亲切风趣，带着悠然的乡音
        timbre: 圆润厚实
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 月光下的巧遇
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔一整天都躲在亲爱的老荆棘丛中央，安安静静，一动也不动。圆圆的红太阳已经落到紫山背后睡觉去了。黑影越过绿色草原，跑进绿色森林，月光又把它们往后赶开了一点儿。
        - id: ch01-b02
          speaker: narrator
          text: 彼得跳出老荆棘丛，站在月光下，先伸伸这条腿，再伸伸那条腿。他又上下跳了三四回，把蜷得发僵的两条长后腿舒展开，这才沿着孤单小径出发，一蹦，一跳，又一蹦。
        - id: ch01-b03
          speaker: narrator
          text: 走到一半，彼得差点儿跟负鼠比利大叔撞个满怀。
        - id: ch01-b04
          speaker: unc_billy_possum
          text: “我的天哪，兔子兄弟！你可把俺吓了一大跳。跑得这么急，这是要上哪儿呀？”
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: 彼得停下来，咧嘴笑了。
        - id: ch01-b06
          speaker: peter_rabbit
          text: “我可不是故意吓您的，比利大叔。其实，我正想去您家看看，瞧瞧您、负鼠老太太和孩子们，这个秋天过得好不好。”
        - id: ch01-b07
          speaker: narrator
          text: 比利大叔仔细看了看彼得。
        - id: ch01-b08
          speaker: unc_billy_possum
          text: “你怎么突然这么惦记俺们一家啦？兔子兄弟，俺都不记得有多久没在家门口见过你了。”
        - id: ch01-b09
          speaker: narrator
          text: 彼得有点儿难为情。说起来，他的确很久没去过比利大叔的树洞了。
        - id: ch01-b10
          speaker: peter_rabbit
          text: “这个嘛，我一直忙着为过冬作准备呢。”
    - id: ch02
      title: 比利大叔笑什么
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 比利大叔听了，先咯咯笑，接着放声大笑。他两手撑着膝盖，笑了又笑，怎么也停不下来。彼得却不知道这有什么可笑的，心里渐渐有点儿生气了。
        - id: ch02-b02
          speaker: peter_rabbit
          text: “到底有什么好笑的？”
        - id: ch02-b03
          speaker: unc_billy_possum
          text: “兔子兄弟居然会为过冬作准备，还说自己忙得很！你呀，除了管别人的事，还会忙什么呢？”
          emotion: happy
        - id: ch02-b04
          speaker: narrator
          text: 比利大叔笑得眼泪都出来了，一边说，一边擦着眼睛。彼得想让自己真的发火，也努力摆出一副生气的样子，可他办不到。不，先生，他就是办不到。比利大叔眼里的笑意一闪一闪，彼得看着看着，也忍不住笑了。
        - id: ch02-b05
          speaker: narrator
          text: 两个人终于不笑了。彼得这才把最近一直困扰他的那些事，从头到尾告诉了比利大叔。
        - id: ch02-b06
          speaker: peter_rabbit
          text: “土拨鼠约翰尼钻进了家，还说春天再见。他到底是什么意思？”
        - id: ch02-b07
          speaker: unc_billy_possum
          text: “就是那句话的意思呀。他已经钻进被窝，睡下啦。这一觉，要一直睡到明年春天。”
        - id: ch02-b08
          speaker: narrator
          text: 彼得把眼睛瞪得老大，简直快要掉出来了。
        - id: ch02-b09
          speaker: peter_rabbit
          text: “那青蛙爷爷呢？他去哪儿了？”
        - id: ch02-b10
          speaker: unc_billy_possum
          text: “青蛙爷爷也睡觉去啦。他就在微笑池池底的泥巴里。等春天一到，你准会看见他精神十足地钻出来。”
    - id: ch03
      title: 谁睡觉，谁去南方
      blocks:
        - id: ch03-b01
          speaker: peter_rabbit
          text: “还有老秃鹫先生！他从蓝蓝的天空里喊下来，说要等到春天再见。难道他也在天上睡觉吗？”
        - id: ch03-b02
          speaker: narrator
          text: 比利大叔仰起脑袋，笑得几乎喘不过气来。
        - id: ch03-b03
          speaker: unc_billy_possum
          text: “看在你那双长耳朵的分上，当然不是啦，兔子兄弟！绝对不是，哪能呢！秃鹫兄弟飞到南方老弗吉尼亚去了。整个寒冷的冬天，他都会待在那里。”
          emotion: happy
        - id: ch03-b04
          speaker: unc_billy_possum
          text: “说真的，俺倒希望自己也跟他一块儿去了。”
        - id: ch03-b05
          speaker: narrator
          text: 说到这儿，比利大叔忽然收起笑容，认真起来。彼得也猛地想到了一件事。
        - id: ch03-b06
          speaker: peter_rabbit
          text: “比利大叔，您不会也要离开，然后睡上整整一个冬天吧？”
          emotion: fearful
        - id: ch03-b07
          speaker: narrator
          text: 彼得问得很担心。比利大叔脸上又露出了笑容。
        - id: ch03-b08
          speaker: unc_billy_possum
          text: “不会的，兔子兄弟。今年冬天，只要敲门敲得够响，你差不多随时都能在树洞里找到俺。不过，俺不打算常常出门，倒是打算好好睡上许多觉。”
