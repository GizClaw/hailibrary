audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: easygoing and teasing, with a warm Southern lilt
        timbre: mellow and slightly rough
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Unc' Billy Possum Explains Things
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Peter Rabbit had stayed very still all day in his safe hiding place, deep inside the dear Old Briar-patch. At last, jolly, round, red Mr. Sun went to bed behind the Purple Hills. Black shadows raced across the Green Meadows and into the Green Forest, until the moonlight pushed them back a little."
        - id: ch01-b02
          speaker: narrator
          text: "Peter hopped into the moonlight. He stretched one leg, then another, and jumped up and down a few times to loosen his long hind legs. Then he set off along the Lone Little Path, lipperty-lipperty-lip. Halfway up, he nearly ran straight into Unc' Billy Possum."
        - id: ch01-b03
          speaker: unc_billy_possum
          text: "Mah goodness, Brer Rabbit, yo' gave me a powerful fright! What has yo' in such a mighty big hurry tonight?"
          emotion: surprised
        - id: ch01-b04
          speaker: narrator
          text: "Peter stopped and gave him a grin."
        - id: ch01-b05
          speaker: peter_rabbit
          text: "I didn't mean to scare you, Uncle Billy. The truth is, I was on my way to your house. I wanted to see how you, old Mrs. Possum, and all the children are doing in this fine fall weather."
        - id: ch01-b06
          speaker: narrator
          text: "Unc' Billy gave Peter a sharp look."
        - id: ch01-b07
          speaker: unc_billy_possum
          text: "Seems to me yo' have taken a mighty sudden interest in all of us. Why, I don't remember seeing yo' anywhere near our place for a long, long time, Brer Rabbit."
        - id: ch01-b08
          speaker: narrator
          text: "Peter looked a little foolish. It was true. He hadn't visited Unc' Billy's hollow tree in a long while."
        - id: ch01-b09
          speaker: peter_rabbit
          text: "You see, I've been terribly busy getting everything ready for winter."
        - id: ch01-b10
          speaker: narrator
          text: "That was Peter's excuse. Unc' Billy began to chuckle. Then he laughed and laughed, with both hands resting on his knees. Peter couldn't see what was funny, and he grew just a little annoyed."
        - id: ch01-b11
          speaker: peter_rabbit
          text: "What's so funny?"
        - id: ch01-b12
          speaker: unc_billy_possum
          text: "Just think of it! Brer Rabbit getting ready for winter! Why, imagine him being busy with anything besides everybody else's business!"
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: "Unc' Billy wiped his eyes. Peter tried hard to look angry, but he couldn't do it. No, sir, he couldn't. The twinkle in Unc' Billy's eyes made Peter want to laugh too. Before long, he simply had to join in."
        - id: ch01-b14
          speaker: narrator
          text: "At last, they both stopped laughing. Then Peter told Unc' Billy about everything that had been troubling him."
        - id: ch01-b15
          speaker: peter_rabbit
          text: "Johnny Chuck went down into his house and disappeared. He said he'd see me in the spring. What did he mean?"
        - id: ch01-b16
          speaker: unc_billy_possum
          text: "He meant exactly what he told yo'. Johnny has gone down to his bed and fallen asleep, and he's going to stay asleep until next spring."
        - id: ch01-b17
          speaker: narrator
          text: "Peter's eyes opened so wide they looked ready to pop right out of his head."
        - id: ch01-b18
          speaker: peter_rabbit
          text: "Then what happened to Grandfather Frog?"
          emotion: surprised
        - id: ch01-b19
          speaker: unc_billy_possum
          text: "Oh, Grandfather Frog has gone to sleep too. He's down in the mud at the very bottom of the Smiling Pool. I reckon yo' will see him come right back up in the spring."
        - id: ch01-b20
          speaker: peter_rabbit
          text: "And Ol' Mistah Buzzard called from the blue, blue sky that he'd see me in the spring. Did he go to sleep up there?"
        - id: ch01-b21
          speaker: narrator
          text: "Unc' Billy threw back his head and laughed as hard as he could."
        - id: ch01-b22
          speaker: unc_billy_possum
          text: "Bless yo' long ears, no, Brer Rabbit! No indeed! Oh my, no! Brer Buzzard flew far away down South to old Virginia, where he'll stay all through the cold winter. And I almost wish I'd gone right along with him."
        - id: ch01-b23
          speaker: narrator
          text: "As he said that last part, Unc' Billy suddenly became serious. Then a new thought came to Peter."
        - id: ch01-b24
          speaker: peter_rabbit
          text: "You aren't going away to sleep all winter too, are you, Uncle Billy?"
          emotion: fearful
        - id: ch01-b25
          speaker: narrator
          text: "The grin returned to Unc' Billy's face."
        - id: ch01-b26
          speaker: unc_billy_possum
          text: "No, Brer Rabbit. I reckon yo' can find me right there in mah hollow tree nearly any time this winter, if yo' knock loudly enough. But I don't reckon I'll go out very much, and I do reckon I'm going to get a mighty big lot of sleep."
