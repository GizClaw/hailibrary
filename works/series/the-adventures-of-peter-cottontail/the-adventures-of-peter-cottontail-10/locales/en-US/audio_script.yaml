audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and smooth, turning sharp when his temper breaks
        timbre: lean and slightly raspy
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Peter Has Another Great Laugh
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "The sun was only just coming up when Reddy Fox set off down the Lone Little Path toward the Green Meadows. He was late. He should have reached the Old Briar-patch by now, and he was beginning to fear that Peter Rabbit would be gone. But when the briar-patch came into view, Peter was still there, sitting right at its edge."
        - id: ch01-b02
          speaker: reddy_fox
          text: "Good morning, Peter Rabbit. I'm very sorry I kept you waiting. I had such a terrible fright last night."
        - id: ch01-b03
          speaker: narrator
          text: "Reddy spoke as politely as he could. Peter ducked behind a big bramble bush so Reddy wouldn't see his smile."
        - id: ch01-b04
          speaker: peter_rabbit
          text: "You did? What frightened you?"
        - id: ch01-b05
          speaker: reddy_fox
          text: "Well, I went to Farmer Brown's garden to make sure the new bed of young cabbage was all right. That's where I met a terrible monster. It scared me so badly that I wouldn't come out this morning until jolly, round Mr. Sun had started climbing the sky. That's why I'm a little late. Are you ready to come with me to the young cabbage now?"
        - id: ch01-b06
          speaker: narrator
          text: "And what do you think Peter did? He burst out laughing. He laughed and shouted, then rolled onto his back and kicked his heels with delight. Even so, he made sure that the big, friendly bramble bush stayed between him and Reddy."
        - id: ch01-b07
          speaker: narrator
          text: "Reddy stared at him. He couldn't understand it at all. There was nothing funny that Reddy could see, but Peter was laughing so hard that Reddy began to wonder if he had gone crazy. At last, Peter stopped and sat up."
        - id: ch01-b08
          speaker: peter_rabbit
          text: "Did the monster catch you, Reddy?"
        - id: ch01-b09
          speaker: narrator
          text: "Peter wiped his eyes as he asked."
        - id: ch01-b10
          speaker: reddy_fox
          text: "No, it didn't catch me. I could run faster than it could, but it chased me all the way home."
        - id: ch01-b11
          speaker: peter_rabbit
          text: "Then I don't think I'll visit the cabbage bed this morning. I can't run as fast as you can, Reddy, so that monster might catch me. Besides, I've already eaten all the tender young cabbage I wanted, and it was very good indeed."
        - id: ch01-b12
          speaker: narrator
          text: "Peter said this with a very grave face."
        - id: ch01-b13
          speaker: reddy_fox
          text: "What did you say?"
          emotion: surprised
        - id: ch01-b14
          speaker: peter_rabbit
          text: "Yes. I couldn't wait until morning, so I went there early last night. Thank you for telling me about it, Reddy. I truly am grateful."
        - id: ch01-b15
          speaker: narrator
          text: "For one little moment, an ugly look crossed Reddy's face. Now he knew Peter had fooled him again. But Reddy held on to his temper and managed a smile."
        - id: ch01-b16
          speaker: reddy_fox
          text: "Oh, you're quite welcome, Peter Rabbit. But tell me, didn't you run into the monster?"
        - id: ch01-b17
          speaker: peter_rabbit
          text: "No, I didn't."
        - id: ch01-b18
          speaker: narrator
          text: "Peter tried his best to keep a straight face, but he couldn't do it for another second. Once again, he began to laugh."
        - id: ch01-b19
          speaker: reddy_fox
          text: "What's so funny, Peter Rabbit? Tell me the joke so I can laugh too."
        - id: ch01-b20
          speaker: narrator
          text: "Reddy begged for an answer. When Peter finally caught his breath, he told him."
        - id: ch01-b21
          speaker: peter_rabbit
          text: "The joke is that your terrible monster was only the old straw hat belonging to Farmer Brown's boy. And I was underneath it! Ha, ha, ha! Ho, ho, ho!"
          emotion: happy
        - id: ch01-b22
          speaker: narrator
          text: "Then Reddy understood just how completely Peter had fooled him. With a snarl, he sprang straight over the bramble bush. Peter had been watching, though. He darted away along one of his own little paths through the Old Briar-patch."
        - id: ch01-b23
          speaker: narrator
          text: "Reddy tried to follow. The brambles tore his clothes, scratched his face, and stuck into his feet. At last, he had to give up. Torn, bleeding, and angry, he turned for home. And as he left the Old Briar-patch, he could still hear Peter Rabbit laughing."
