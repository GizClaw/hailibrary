audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 急躁冲动，发怒时语气逼人
        timbre: 尖亮而略显粗粝
        pace: 偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 迟到的雷迪
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 太阳才刚升起来，红狐雷迪就沿着孤零零的小路，往绿草原走去。他已经迟到了。这时候，他原本该到老荆棘丛才对。雷迪担心彼得兔不会再等他。可老荆棘丛刚一出现，他就看见彼得坐在荆棘丛边上。
        - id: ch01-b02
          speaker: reddy_fox
          text: “早上好，彼得兔。让你等了这么久，真对不住。都因为昨晚有个东西把我吓得够呛。”
        - id: ch01-b03
          speaker: narrator
          text: 雷迪装出最客气的样子。彼得却缩到一大丛荆棘后面，藏住脸上的笑。
        - id: ch01-b04
          speaker: peter_rabbit
          text: “真的吗？你碰上什么了？”
        - id: ch01-b05
          speaker: reddy_fox
          text: “我昨晚去了农夫布朗的菜园，想瞧瞧新种的卷心菜长得怎么样。没想到，我在那里撞见一个吓人的怪物！今天早晨，我一直等到快活的圆太阳先生爬上天空，才敢出门，所以晚了一会儿。彼得兔，你准备好跟我去看新卷心菜了吗？”
        - id: ch01-b06
          speaker: narrator
          text: 雷迪问这话时，语气比刚才还要和气。可你猜彼得怎么了？他再也憋不住，忽然大笑起来。他笑个不停，还高兴得大声嚷嚷，最后索性仰面躺下，直蹬后脚。不过，他始终没忘记躲在那丛亲切的荆棘后面。
        - id: ch01-b07
          speaker: narrator
          text: 雷迪瞪着彼得，完全弄不懂他在笑什么，甚至怀疑他是不是疯了。眼前明明没有一点儿好笑的事，彼得却快要笑得喘不过气。过了好一阵，彼得才停下来，坐直身子。
    - id: ch02
      title: 彼得的秘密
      blocks:
        - id: ch02-b01
          speaker: peter_rabbit
          text: “那——那个怪物，把你抓住了吗，红狐雷迪？”
        - id: ch02-b02
          speaker: narrator
          text: 彼得一边问，一边擦着笑出来的眼泪。
        - id: ch02-b03
          speaker: reddy_fox
          text: “它当然没抓住我。我比它跑得快。不过，它一路追在后面，一直追到我家。”
        - id: ch02-b04
          speaker: narrator
          text: 彼得听完，故意板起脸，装出一副十分严肃的样子。
        - id: ch02-b05
          speaker: peter_rabbit
          text: “那我今早还是别去卷心菜地了。我连你都跑不过，万一让那个怪物抓住可怎么办？再说，嫩卷心菜我已经吃得饱饱的，味道可真不错。”
        - id: ch02-b06
          speaker: reddy_fox
          text: “你说什么！”
          emotion: surprised
        - id: ch02-b07
          speaker: peter_rabbit
          text: “没错。我实在等不到天亮，昨晚早早就去了。雷迪，多谢你告诉我有那片菜地，我真该谢谢你。”
        - id: ch02-b08
          speaker: narrator
          text: 雷迪的脸一下变得很难看。他终于明白，自己又让彼得耍了一回。不过那副凶相只露了一小会儿，他就压住火气，勉强笑了笑。
        - id: ch02-b09
          speaker: reddy_fox
          text: “不用谢，彼得兔，千万别谢。不过我倒想问问，你难道没遇见那个怪物？”
        - id: ch02-b10
          speaker: peter_rabbit
          text: “我没碰见。”
        - id: ch02-b11
          speaker: narrator
          text: 彼得刚说完，就再也装不下去了。他又跟刚才一样，放声笑起来。
        - id: ch02-b12
          speaker: reddy_fox
          text: “彼得兔，你到底在笑什么？快告诉我，让我也笑一笑呀。”
        - id: ch02-b13
          speaker: narrator
          text: 雷迪央求起来。彼得好不容易才喘匀了气。
        - id: ch02-b14
          speaker: peter_rabbit
          text: “原来，把你吓成那样的怪物，就是农夫布朗家小子的旧草帽。我当时正躲在帽子底下呢。哈，哈，哈！呵，呵，呵！”
          emotion: happy
    - id: ch03
      title: 荆棘丛里的笑声
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这回，雷迪全明白了。彼得把他耍得实在太惨。雷迪低吼一声，猛地越过荆棘，直扑彼得。
        - id: ch03-b02
          speaker: narrator
          text: 可彼得一直留着神。他转身就跑，钻进老荆棘丛里一条只有自己才熟悉的窄路。雷迪也追进去，荆棘却扯破他的衣裳，抓伤他的脸，还扎进他的脚里。
        - id: ch03-b03
          speaker: narrator
          text: 雷迪最后只能放弃。他浑身破破烂烂，伤口流着血，气得要命，只好回家。走出老荆棘丛时，他还能听见彼得兔在身后不停地笑。
