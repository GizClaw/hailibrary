audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年迈睿智，困倦时略显暴躁
        timbre: 低沉浑厚
        pace: 缓慢而沉稳
        pitch: 低音
  chapters:
    - id: ch01
      title: 约翰尼的话是什么意思
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔在土拨鼠约翰尼家的门阶上坐了足足五分钟。他先用一只手挠头，又换另一只手挠，怎么也想不明白。
        - id: ch01-b02
          speaker: peter_rabbit
          text: “约翰尼为什么说春天再见呢？现在还没到冬天，离春天远着呢。可听他的口气，好像冬天过去以前都不会见到我。他要去别的地方吗？要是不走，为什么整个冬天我都见不着他？夏天里我明明一直能见到他呀。”
        - id: ch01-b03
          speaker: narrator
          text: 彼得越想越糊涂。过了一会儿，他终于有了主意，一下子高兴起来。
        - id: ch01-b04
          speaker: peter_rabbit
          text: “我去微笑池问青蛙爷爷。他年纪大，见识多，一定明白约翰尼是什么意思。”
        - id: ch01-b05
          speaker: narrator
          text: 彼得撒开后脚，一路踢着脚跟，沿着孤零零小径蹦蹦跳跳，穿过绿色草原，直奔微笑池。
    - id: ch02
      title: 困倦的青蛙爷爷
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 青蛙爷爷还像平常一样坐在大睡莲叶上。可睡莲叶已经没有从前那么绿了，他也没有平日那副神气模样。那双鼓鼓的大眼睛又沉又暗，像是什么也看不清。他困得不停点头，有一回差点儿从叶子上栽下去。
        - id: ch02-b02
          speaker: peter_rabbit
          text: “早上好，青蛙爷爷！”
        - id: ch02-b03
          speaker: narrator
          text: 青蛙爷爷眨眨眼睛，又把一只手拢在耳后，仿佛没听清。
        - id: ch02-b04
          speaker: grandfather_frog
          text: “嗯？你说什么？”
        - id: ch02-b05
          speaker: peter_rabbit
          text: “我说，早上好，青蛙爷爷！”
        - id: ch02-b06
          speaker: narrator
          text: 这一回，彼得喊得比刚才更响。青蛙爷爷却没好气地回了他一句，还冷得打了个寒战。
        - id: ch02-b07
          speaker: grandfather_frog
          text: “这早上一点儿也不好。天气太冷了！”
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: 彼得假装没看出青蛙爷爷正在发脾气，还摆出自己最有礼貌的样子，客客气气地问他。
        - id: ch02-b09
          speaker: peter_rabbit
          text: “青蛙爷爷，您能告诉我，土拨鼠约翰尼冬天住在哪儿吗？”
        - id: ch02-b10
          speaker: grandfather_frog
          text: “当然住在自己家里。别拿这种傻问题来烦我！”
          emotion: angry
        - id: ch02-b11
          speaker: peter_rabbit
          text: “可他既然在家过冬，为什么又说春天再见？听起来，好像春天以前他都不会再见到我。”
        - id: ch02-b12
          speaker: narrator
          text: 彼得还是不肯罢休。青蛙爷爷打了个哈欠，抖抖身子，接着又打了一个哈欠。
    - id: ch03
      title: 又一次春天再见
      blocks:
        - id: ch03-b01
          speaker: grandfather_frog
          text: “约翰尼大概就是那个意思。我看，我也该照他的办法做了。天气越来越冷，我这把老骨头可吃不消，连骨头缝里都觉得冷。我困得眼皮直打架，还是越快找到床越好。我的床就在微笑池底的泥里。”
        - id: ch03-b02
          speaker: grandfather_frog
          text: “咕嘎隆！约翰尼真聪明。彼得，咱们春天再见。到时候，我再把这件事从头到尾讲给你听。”
        - id: ch03-b03
          speaker: narrator
          text: 话音刚落，青蛙爷爷就“扑通”一声跳进微笑池，溅起了老大一片水花。
