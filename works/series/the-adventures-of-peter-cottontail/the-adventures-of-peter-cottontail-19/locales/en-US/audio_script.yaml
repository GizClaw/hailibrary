audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: old and wise, with a sleepy, gruff manner
        timbre: deep and croaky
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: What Did Johnny Mean?
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Peter Rabbit sat on Johnny Chuck's doorstep for five long minutes. First he scratched his head with one hand, and then he scratched it with the other."
        - id: ch01-b02
          speaker: peter_rabbit
          text: "What did Johnny mean when he said he'd see me in the spring? Winter isn't even here yet, and spring is still a long, long way off. But Johnny talked as if he wouldn't see me until winter was over. Is he going somewhere? If he's staying here, why won't I see him all winter, the way I saw him all summer?"
        - id: ch01-b03
          speaker: narrator
          text: "The longer Peter thought, the more puzzled he was. Then a happy idea came to him."
        - id: ch01-b04
          speaker: peter_rabbit
          text: "I'll run down to the Smiling Pool and ask Grandfather Frog. He's very old and very wise. He'll know what Johnny meant."
    - id: ch02
      title: A Chilly Morning at the Smiling Pool
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Peter kicked up his heels and started down the Lone Little Path. Lipperty-lipperty-lip, he went across the Green Meadows to the Smiling Pool. Grandfather Frog was sitting in his usual place on his big lily pad. But the lily pad wasn't as green as it used to be, and Grandfather Frog didn't look as smart as usual. His big, goggly eyes were heavy and dull. They looked as though they could hardly see anything at all. He nodded sleepily and almost fell off the lily pad."
        - id: ch02-b02
          speaker: peter_rabbit
          text: "Good morning, Grandfather Frog!"
        - id: ch02-b03
          speaker: grandfather_frog
          text: "Eh? What was that?"
        - id: ch02-b04
          speaker: narrator
          text: "Grandfather Frog blinked and held one hand behind his ear, as though he couldn't hear very well. Peter called out again, louder this time."
        - id: ch02-b05
          speaker: peter_rabbit
          text: "I said, good morning, Grandfather Frog!"
        - id: ch02-b06
          speaker: grandfather_frog
          text: "No, it is not a good morning. It's much too chilly."
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: "Grandfather Frog spoke grumpily and gave a shiver. Peter pretended not to notice. He asked his question as politely as he could."
        - id: ch02-b08
          speaker: peter_rabbit
          text: "Grandfather Frog, can you please tell me where Johnny Chuck stays during the winter?"
    - id: ch03
      title: Another Spring Goodbye
      blocks:
        - id: ch03-b01
          speaker: grandfather_frog
          text: "At home, of course! Don't bother me with foolish questions."
          emotion: angry
        - id: ch03-b02
          speaker: peter_rabbit
          text: "But if he'll be home all winter, why did he say he'd see me in the spring? He spoke as if he didn't expect to see me before then."
        - id: ch03-b03
          speaker: narrator
          text: "Peter would not give up. Grandfather Frog yawned, gave himself a shake, and then yawned once more. At last, he answered."
        - id: ch03-b04
          speaker: grandfather_frog
          text: "Johnny Chuck most likely meant exactly what he said, and I think I'll do the same thing. It's getting too cold for an old fellow like me. I can feel it in my bones. I'm so sleepy that I'd better find my bed in the mud at the bottom of the Smiling Pool. Chugarum! Johnny Chuck is wise. I'll see you in the spring, Peter Rabbit. Then I'll tell you all about it."
        - id: ch03-b05
          speaker: narrator
          text: "With that, Grandfather Frog dived into the Smiling Pool with a great splash."
