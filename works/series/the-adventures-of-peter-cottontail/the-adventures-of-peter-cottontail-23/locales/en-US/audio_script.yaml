audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    uncle_billy_possum:
      display_name: Uncle Billy Possum
      tts:
        delivery: easygoing and knowing, with a warm Southern lilt
        timbre: mellow and full
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Peter Rabbit Has a Bright Idea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Peter Rabbit had what he thought was a bright idea, and he chuckled over it again and again. The more he considered it, the better it sounded. He would do just what Johnny Chuck and Grandfather Frog did. He would escape the cold, stormy weather by sleeping all winter. Yes, Sir, that was Peter Rabbit's bright idea."
        - id: ch01-b02
          speaker: peter_rabbit
          text: "If Johnny Chuck can sleep right through the long, stormy winter, then it seems to me that I can do it too."
        - id: ch01-b03
          speaker: narrator
          text: "Peter said this to himself while he sat in the middle of the Old Briar-patch, chewing the end of a straw. If Johnny Chuck could do it, Peter was sure he could. All he would have to do was find an empty little house that was snug and warm. Then he could make a comfortable bed, curl up, and fall asleep."
        - id: ch01-b04
          speaker: narrator
          text: "He pictured himself sleeping the whole time, while snow lay deep across the Green Meadows. The Smiling Pool would not be able to smile at all. Hard, black ice would cover it and refuse to let it smile."
        - id: ch01-b05
          speaker: narrator
          text: "At last Peter couldn't sit still any longer. He had to tell someone about his idea. Besides, there was one thing he didn't quite understand. How could he fall asleep and stay asleep for so long? In all his life, Peter had never slept more than a very short while without waking to make sure no danger was near."
        - id: ch01-b06
          speaker: peter_rabbit
          text: "I'll run up and ask Uncle Billy Possum!"
        - id: ch01-b07
          speaker: narrator
          text: "Uncle Billy Possum was sitting in the doorway of his big hollow tree in the Green Forest. Up came Peter, hurrying lipperty-lipperty-lip. He barely stopped to say good morning before telling Uncle Billy all about his bright idea. Uncle Billy listened with a solemn face, though his eyes had a twinkle in them."
        - id: ch01-b08
          speaker: uncle_billy_possum
          text: "First, Brer Rabbit, yo' have to find a warm place where yo' can sleep."
        - id: ch01-b09
          speaker: peter_rabbit
          text: "Oh, that will be easy!"
        - id: ch01-b10
          speaker: uncle_billy_possum
          text: "Then, Brer Rabbit, yo' have to get fat."
        - id: ch01-b11
          speaker: peter_rabbit
          text: "What did you say?"
          emotion: surprised
        - id: ch01-b12
          speaker: narrator
          text: "Peter looked thoroughly puzzled. Uncle Billy slapped his own fat sides as he answered."
        - id: ch01-b13
          speaker: uncle_billy_possum
          text: "Ah said yo' have to get fat."
        - id: ch01-b14
          speaker: peter_rabbit
          text: "Why do I need to do that?"
        - id: ch01-b15
          speaker: uncle_billy_possum
          text: "So yo' will stay warm while yo' sleep."
        - id: ch01-b16
          speaker: peter_rabbit
          text: "Do I have to get very fat?"
        - id: ch01-b17
          speaker: uncle_billy_possum
          text: "Yes, Sah. Yo' have to get very fat indeed."
        - id: ch01-b18
          speaker: narrator
          text: "Uncle Billy smiled. It was hard to imagine Peter Rabbit being very fat. Peter began to look a little worried."
        - id: ch01-b19
          speaker: peter_rabbit
          text: "But how can I get fat?"
        - id: ch01-b20
          speaker: uncle_billy_possum
          text: "Eat and eat and eat. Between meals, sit still."
        - id: ch01-b21
          speaker: peter_rabbit
          text: "That sounds easy. At least the eating part does! Is that everything, Uncle Billy?"
        - id: ch01-b22
          speaker: narrator
          text: "Peter, you know, thought a great deal about his stomach."
        - id: ch01-b23
          speaker: uncle_billy_possum
          text: "That is nearly everything, Brer Rabbit. When yo' try to sleep, nothing must be worrying yo'. Yo' can't lie there wondering whether Brer Fox will find yo' asleep."
        - id: ch01-b24
          speaker: narrator
          text: "Uncle Billy grinned when Peter happened to turn his head. Peter thanked him, then hurried back to the Old Briar-patch. He wanted to think over everything Uncle Billy had told him."
        - id: ch01-b25
          speaker: peter_rabbit
          text: "I certainly am going to try it."
