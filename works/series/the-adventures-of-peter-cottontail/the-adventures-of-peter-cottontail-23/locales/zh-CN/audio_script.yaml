audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 亲切风趣，带着悠然的乡音
        timbre: 圆润厚实
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 彼得的好主意
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔想出了一个好主意。至少，他自己觉得这主意好极了，还独自偷笑了好一阵。这个念头在心里转得越久，他就越觉得妙。你猜是什么？他要学土拨鼠约翰尼和青蛙爷爷，睡过整个冬天，这样就不用挨那又冷又常有风暴的天气了。是的，先生，这就是彼得的好主意。
        - id: ch01-b02
          speaker: peter_rabbit
          text: “要是土拨鼠约翰尼能睡呀睡，漫长的风雪冬天一睡到底，那么我想，这个好办法，正合适让我也照着做呀。”
        - id: ch01-b03
          speaker: narrator
          text: 彼得坐在老荆棘丛中央，嘴里嚼着草秆尖儿，把这几句念给自己听。他心想，约翰尼都能办到，自己当然也行。只须找一间没人使用、又暖和又安稳的屋子，亲手铺好一张舒服的床，再蜷起身子睡过去。
        - id: ch01-b04
          speaker: narrator
          text: 他仿佛看见自己一直安睡，绿色草原上已经盖满厚厚的雪。坚硬的黑冰封住了微笑池，连它也笑不出来了。
        - id: ch01-b05
          speaker: narrator
          text: 到最后，彼得再也坐不住了。他非找个人讲讲这个主意不可。还有一件事，他也拿不准。彼得这辈子还从来没有长睡过。每次睡着，只过很短很短的一会儿，他就会醒来看看附近有没有危险。他究竟怎样才能一直睡下去呢？
        - id: ch01-b06
          speaker: peter_rabbit
          text: “我去问问负鼠比利大叔！”
    - id: ch02
      title: 睡觉先要找暖屋子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得一蹦，一跳，又一蹦，急匆匆赶到了绿色森林。比利大叔正坐在那棵大空心树的家门口。彼得几乎连一句早安都等不及说完，就把自己的好主意从头讲了一遍。比利大叔一本正经地听着，眼睛里却藏着笑。
        - id: ch02-b02
          speaker: unc_billy_possum
          text: “兔子兄弟，你得先找个暖和的地方睡觉。”
        - id: ch02-b03
          speaker: peter_rabbit
          text: “这个简单！”
        - id: ch02-b04
          speaker: unc_billy_possum
          text: “接下来嘛，兔子兄弟，你得把自己吃胖。”
        - id: ch02-b05
          speaker: narrator
          text: 彼得满脸不明白，吃惊地望着他。
        - id: ch02-b06
          speaker: peter_rabbit
          text: “您刚才说什么？”
          emotion: surprised
        - id: ch02-b07
          speaker: unc_billy_possum
          text: “俺说，你得长胖。”
        - id: ch02-b08
          speaker: narrator
          text: 比利大叔说着，拍了拍自己肥肥的腰身。
        - id: ch02-b09
          speaker: peter_rabbit
          text: “为什么要长胖呀？”
        - id: ch02-b10
          speaker: unc_billy_possum
          text: “有了这一身肉，你睡着以后才暖和呀。”
        - id: ch02-b11
          speaker: peter_rabbit
          text: “那我得长得特别胖吗？”
        - id: ch02-b12
          speaker: unc_billy_possum
          text: “是啊，先生，非得很胖很胖才行。”
        - id: ch02-b13
          speaker: narrator
          text: 比利大叔笑了。要想象彼得兔变得肥肥胖胖，实在不容易。
    - id: ch03
      title: 还不能有心事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得有点儿发愁，连问话也结巴起来。
        - id: ch03-b02
          speaker: peter_rabbit
          text: “那……那我要怎么吃，才能胖起来？”
        - id: ch03-b03
          speaker: unc_billy_possum
          text: “吃了再吃，一直吃。两顿之间呢，就老老实实坐着别动。”
        - id: ch03-b04
          speaker: peter_rabbit
          text: “这可不难，反正吃东西不难！还有别的吗，比利大叔？”
        - id: ch03-b05
          speaker: narrator
          text: 你也知道，彼得一向十分看重自己的肚子。
        - id: ch03-b06
          speaker: unc_billy_possum
          text: “差不多没啦。不过你要睡觉，心里就不能惦记着事。兔子兄弟，你可别躺下以后还担心，狐狸兄弟会不会趁你睡着找上门来。”
        - id: ch03-b07
          speaker: narrator
          text: 彼得正好转过了头，比利大叔便咧嘴一笑。彼得谢过他，急急忙忙赶回老荆棘丛，把听来的话一句一句想了又想。
        - id: ch03-b08
          speaker: peter_rabbit
          text: “我一定要试一试。”
