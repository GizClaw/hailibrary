cover_prompt: |-
  A wordless cover scene in the Green Meadows and the edge of the Green Forest in rural early-twentieth-century America shows a small brown cottontail rabbit racing toward the shelter of a dense old briar patch. His long ears stream backward and his round white tail flashes as a lean red fox follows several bounds behind on the crooked woodland path. A black-and-white skunk and a gray raccoon watch from beside a pine stump with lively but friendly expressions, while a crow circles above the meadow. The rabbit's quick turn toward the thorny refuge is the clear focal action, playful and adventurous rather than frightening. Use a wide child-height view with spring grasses, wildflowers, scattered pines, and the forest receding into soft daylight, leaving broad calm sky at the top. Keep every animal anatomically believable and independent of film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
