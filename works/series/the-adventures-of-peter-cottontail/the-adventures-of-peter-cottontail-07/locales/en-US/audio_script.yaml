audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    granny_fox:
      display_name: Granny Fox
      tts:
        delivery: elderly, shrewd, and plainly spoken
        timbre: dry and weathered
        pace: unhurried
        pitch: medium-low
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and polished, with quick flashes of impatience
        timbre: smooth and keen
        pace: medium
        pitch: medium
    breeze_1:
      display_name: Merry Little Breeze One
      tts:
        delivery: cheerful, helpful, and lighthearted
        timbre: airy and bright
        pace: lively
        pitch: high
    breeze_2:
      display_name: Merry Little Breeze Two
      tts:
        delivery: buoyant, friendly, and eager
        timbre: light and clear
        pace: brisk
        pitch: medium-high
    breeze_3:
      display_name: Merry Little Breeze Three
      tts:
        delivery: playful, sunny, and warm
        timbre: soft and sparkling
        pace: lively
        pitch: high
  chapters:
    - id: ch01
      title: Reddy Invites Peter Rabbit to Take a Walk
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Old Granny Fox was not feeling well. She had been unable to hunt for three days, and all that time Reddy Fox had tried to tempt her appetite. He brought her a tender young chicken from Farmer Brown's hen yard. He even stole a plump trout from Billy Mink's storehouse. Granny only turned up her nose at both of them."
        - id: ch01-b02
          speaker: granny_fox
          text: "What I need is a tender young rabbit."
        - id: ch01-b03
          speaker: narrator
          text: "Reddy was very fond of Granny Fox. Once she said she needed a tender young rabbit, he made up his mind to get one for her. He had no idea how. He had tried to catch Peter Rabbit dozens of times, but Peter's long legs always carried him safely away. Reddy sat on his doorstep and gazed across the Green Meadows."
        - id: ch01-b04
          speaker: reddy_fox
          text: "I'll have to trick Peter Rabbit. That's the only way."
        - id: ch01-b05
          speaker: narrator
          text: "Reddy Fox was so sly that no one could ever be quite sure when he was honest and when he was playing a trick. As he watched the Green Meadows, he saw the Merry Little Breezes coming toward him. Reddy smiled to himself. When they came close, he called out."
        - id: ch01-b06
          speaker: reddy_fox
          text: "Would you do something for me?"
        - id: ch01-b07
          speakers: [breeze_1, breeze_2, breeze_3]
          ensemble: chorus
          text: "Of course we will!"
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: "The Merry Little Breezes were always delighted when they could do something for someone else."
        - id: ch01-b09
          speaker: reddy_fox
          text: "Please find Peter Rabbit. Tell him I've discovered a new bed of tender young carrots in Farmer Brown's garden. Ask him to meet me tomorrow at sunrise so we can go there together."
        - id: ch01-b10
          speaker: narrator
          text: "Away raced the Merry Little Breezes. They found Peter Rabbit and gave him Reddy's invitation. Before long, they came racing back with his answer. Peter would be delighted to meet Reddy at the edge of the Old Briar-patch when the sun came up. Then they would go together to Farmer Brown's garden for those tender young carrots."
        - id: ch01-b11
          speaker: narrator
          text: "Reddy smiled to himself. Now he felt certain that Peter Rabbit would become Granny's breakfast."
        - id: ch01-b12
          speaker: narrator
          text: "Early the next morning, just before sunrise, Reddy hurried down the Lone Little Path and crossed the Green Meadows to the Old Briar-patch. He had put on his very best clothes, and he looked smart and handsome. But when he reached the briar patch, Peter Rabbit was nowhere to be seen. Reddy waited and waited and waited. Peter still did not come."
        - id: ch01-b13
          speaker: narrator
          text: "At last, Reddy gave up waiting. He decided to go over to Farmer Brown's garden and take a look at the young carrots for himself. And what do you suppose he found when he got there? Footprints went all around the bed of tender young carrots. There was no mistaking them. They were Peter Rabbit's footprints!"
        - id: ch01-b14
          speaker: narrator
          text: "Reddy ground his teeth and snarled wickedly. He knew the truth now. He had not fooled Peter Rabbit at all. Peter had fooled him. Just then, one of Old Mother West Wind's Merry Little Breezes came along."
        - id: ch01-b15
          speaker: breeze_1
          text: "Good morning, Reddy Fox."
        - id: ch01-b16
          speaker: reddy_fox
          text: "Good morning."
        - id: ch01-b17
          speaker: narrator
          text: "If you had seen Reddy and heard that pleasant answer, you never would have guessed how bad-tempered he felt inside."
        - id: ch01-b18
          speaker: breeze_1
          text: "Peter Rabbit asked me to bring you a message. He's very sorry he couldn't meet you at the briar patch this morning. Thinking about those tender young carrots made him so hungry that he had to come and eat some before sunrise. He thanks you very much for telling him where they were. He says they're the finest young carrots he has ever tasted."
        - id: ch01-b19
          speaker: narrator
          text: "Reddy's heart was full of rage, but he did not let the Merry Little Breeze see it. He only smiled."
        - id: ch01-b20
          speaker: reddy_fox
          text: "Please tell Peter how glad I am that he enjoyed the carrots. And invite him to meet me at the edge of the Old Briar-patch tomorrow at sunrise. I've found some sweet clover near the old hickory tree, and we can go there together."
        - id: ch01-b21
          speaker: narrator
          text: "The Merry Little Breeze danced away with Reddy's message. Before long, the Breeze returned with Peter's answer. Peter Rabbit would be delighted to go to the sweet-clover patch the next morning. Reddy grinned to himself as he trudged home."
        - id: ch01-b22
          speaker: reddy_fox
          text: "Tomorrow I'll be waiting at that clover patch an hour before sunrise. Then we'll see who fools whom!"
