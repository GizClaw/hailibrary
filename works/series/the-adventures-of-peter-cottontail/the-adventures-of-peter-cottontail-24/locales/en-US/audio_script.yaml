audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: easygoing and knowing, with a dry, amused drawl
        timbre: mellow and slightly rough
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Peter Prepares for a Long Sleep
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Day after day, Peter Rabbit hurried back and forth across the Green Meadows and through the Green Forest. He looked as if something important was on his mind. Jimmy Skunk noticed. Billy Mink and Bobby Coon noticed too. But Peter was always in too much of a hurry to explain. Whenever he met them, he just called hello over his shoulder and kept running, lipperty-lipperty-lip. Only Unc' Billy Possum guessed what Peter was doing."
        - id: ch01-b02
          speaker: narrator
          text: "Unc' Billy watched Peter rush about with such a serious, important air, and he grinned."
        - id: ch01-b03
          speaker: unc_billy_possum
          text: "Brer Rabbit is trying mighty hard to fool himself. I reckon he's hunting for a place where he can curl up and sleep all winter."
        - id: ch01-b04
          speaker: narrator
          text: "And Unc' Billy was exactly right. Peter wanted a snug place where he could sleep through the winter. He was too lazy to dig a new home, and by then it was late in the fall anyway. He decided to use an old, empty house that one of Jimmy Skunk's relatives or one of Johnny Chuck's relations had left behind. Peter poked his nose into every old house he knew. He needed one that wasn't too tumbledown to use."
        - id: ch01-b05
          speaker: narrator
          text: "At last, Peter found a house that seemed just right. He chuckled as he imagined curling up in the bedchamber, far down at the end of its long hall."
        - id: ch01-b06
          speaker: peter_rabbit
          text: "No one will ever guess where I am!"
        - id: ch01-b07
          speaker: narrator
          text: "Peter laughed out loud. Then he remembered something Unc' Billy Possum had told him. Before settling down to sleep, Peter would have to eat a great deal and grow very fat. That fat would keep him warm all winter. So Peter set out to fatten himself up. He thought this would be the best kind of fun. Peter loved nothing more than filling his stomach, except perhaps satisfying his curiosity."
        - id: ch01-b08
          speaker: narrator
          text: "Peter Rabbit's stomach is a truly amazing thing. It takes him so long to fill it that he hardly has time to be lazy. Perhaps that's why, whenever Peter isn't eating, he likes to loaf around and watch everyone else work."
        - id: ch01-b09
          speaker: narrator
          text: "Peter could eat an enormous amount. Now that he meant to grow fat, he thought he should eat more than ever. He began right away, eating and eating and eating. But Peter had forgotten one very important thing. It was late in the fall. All the tender young greens he loved were gone. He couldn't visit the sweet clover patch and eat until he nearly burst. Farmer Brown had already taken away the cabbages, carrots, and turnips that had once made his garden so tempting."
        - id: ch01-b10
          speaker: narrator
          text: "Now Peter had to search for every bite he ate. Searching meant a great deal of running, and it's very hard to grow fat while you're running around. The more Peter ate, the more food he had to find. The more food he had to find, the more he had to run. And the more he ran, the faster he hurried from place to place. Of course, all that running took the fat right off again."
        - id: ch01-b11
          speaker: peter_rabbit
          text: "Oh, dear! Growing fat isn't nearly as easy as I thought it would be!"
