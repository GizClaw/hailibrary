audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 亲切风趣，带着悠然的乡音
        timbre: 圆润厚实
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 忙着寻找旧屋子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天又一天，彼得兔在绿色草原上东奔西跑，又穿过绿色森林到处乱窜，看起来像是心里藏着一件事。臭鼬吉米注意到了，水貂比利和浣熊博比也看出了异样。可彼得不肯停下来说个明白。他总是急急忙忙的，见到他们，也只是回头喊一声“你们好”，两只脚仍旧一蹦一跳，飞快地跑远。只有负鼠比利大叔猜到了他的心思。
        - id: ch01-b02
          speaker: narrator
          text: 比利大叔瞧着彼得一本正经、煞有介事地忙来忙去，咧开嘴笑了。
        - id: ch01-b03
          speaker: unc_billy_possum
          text: “兔子兄弟这是使足了劲儿，想把自己也蒙过去哩。俺看，他准是在找地方，打算蜷起来睡过一冬。”
        - id: ch01-b04
          speaker: narrator
          text: 比利大叔猜得一点儿不错。彼得确实在找一个能让他蜷着身子、睡完整个冬天的地方。他懒得给自己另挖一间屋子，而且秋天已经很深，现在动手也太迟了。他想找一间废弃的旧屋，也许是臭鼬吉米的亲戚搬走的，也许是土拨鼠约翰尼的亲戚不用的。
        - id: ch01-b05
          speaker: narrator
          text: 彼得钻进每一间自己知道的旧屋里查看，只想挑出一间还没破得不能住的。终于，他找到一个自认为再合适不过的地方。他打算沿着长长的过道走到底，蜷在那里的卧房中。光是想一想，他就忍不住暗自发笑。
        - id: ch01-b06
          speaker: peter_rabbit
          text: “谁也别想猜到我躲在哪儿！”
        - id: ch01-b07
          speaker: narrator
          text: 彼得对自己说完，放声笑了起来。
    - id: ch02
      title: 最快活的长胖办法
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这时，彼得记起了负鼠比利大叔的话。睡觉以前，他得吃下许多东西，让自己变得肥肥胖胖。这样，整个冬天才不会冷。于是，彼得开始努力长胖。对他来说，这可太好玩了，简直是世上最好的乐事。彼得兔最爱的就是把肚子填满，要说还有什么能跟吃东西相比，那也只有满足自己的好奇心了。
        - id: ch02-b02
          speaker: narrator
          text: 彼得兔的肚皮呀，实在叫人惊奇。半天总也填不满，哪有闲工夫偷懒休息。
        - id: ch02-b03
          speaker: narrator
          text: 也许正是这个缘故，彼得不吃东西的时候，就爱闲在一旁，看别人干活。不管怎么说，他的饭量大得吓人。现在为了长胖，他觉得自己应该吃得比过去更多。于是，他马上吃了起来，吃呀，吃呀，一个劲儿地吃。
        - id: ch02-b04
          speaker: narrator
          text: 可是，有一件非常要紧的事，彼得忘得干干净净。如今已经到了深秋，他最爱吃的鲜嫩绿叶全都不见了。那片香甜的苜蓿地也不能再让他一口气吃到肚皮快撑破。布朗农夫早已收走菜园里的卷心菜、胡萝卜和芜菁，那些可全是彼得看了就眼馋的东西。
    - id: ch03
      title: 越吃却越难长胖
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得只好到处寻找能吃的东西。这就意味着，他得跑上许多路。可是，要是一天到晚不停地跑，长胖可就难了。彼得越想多吃，越得四处找食物。找得越多，跑的路也越多。路跑得越多，他心里越着急，脚下也就越来越快。当然啦，跑来跑去，身上的肉是会掉下去的。
        - id: ch03-b02
          speaker: narrator
          text: 彼得终于明白，事情根本没有自己想得那么简单。
        - id: ch03-b03
          speaker: peter_rabbit
          text: “哎呀！原来想长胖这么难！”
