audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: easygoing and teasing, with a warm Southern lilt
        timbre: mellow and slightly rough
        pace: unhurried
        pitch: medium-low
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: good-natured and playful, with an eager spark
        timbre: warm and slightly husky
        pace: easy
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: quiet and agreeable, with dry playful humor
        timbre: smooth and grounded
        pace: relaxed
        pitch: medium-low
  chapters:
    - id: ch01
      title: Unc' Billy Possum Plays a Joke
      blocks:
        - id: ch01-b01
          speaker: unc_billy_possum
          text: "Some folks never seem to be satisfied or quite content. They're always wanting something more that was never meant for them."
        - id: ch01-b02
          speaker: narrator
          text: "Unc' Billy Possum said this to himself while he watched Peter Rabbit hurry through the Green Forest and across the Green Meadows. Peter was eating as fast as he could. He wanted to grow fat enough to stay warm while he slept all winter."
        - id: ch01-b03
          speaker: narrator
          text: "But Unc' Billy knew perfectly well that Peter could not sleep through the winter the way Johnny Chuck did. Old Mother Nature had never planned that for Peter. Telling him would do no good, though. Peter would never believe it. So Unc' Billy chuckled as Peter rushed about looking for food. Instead of growing fatter, Peter was running off the little fat he already had."
        - id: ch01-b04
          speaker: narrator
          text: "As it happened, Unc' Billy was close to the old house Grandfather Skunk had built long ago. This was the very house where Peter had decided to spend the winter asleep. Unc' Billy saw him go down the long hall at last. Peter reached the little bedchamber at the end, curled up, and tried to fall asleep."
        - id: ch01-b05
          speaker: narrator
          text: "Unc' Billy grinned. Then he chuckled. At last he laughed so hard that his fat sides shook."
        - id: ch01-b06
          speaker: unc_billy_possum
          text: "Ah reckon Ah'm going to have some fun with Brer Rabbit."
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: "Still chuckling, Unc' Billy trotted away through the Green Forest. He went to Bobby Coon's house and found Bobby getting ready for bed after being out all night. Bobby was always ready to play a joke. As soon as Unc' Billy told him about Peter, and how much fun it would be to give him a scare, Bobby scrambled straight down from his hollow tree."
        - id: ch01-b08
          speaker: narrator
          text: "Then the two of them found Jimmy Skunk. All three set off for Grandfather Skunk's old house, where Peter Rabbit was trying to sleep for the winter."
        - id: ch01-b09
          speaker: unc_billy_possum
          text: "Ah told Peter not to start thinking about what might happen if Brer Fox came along and found him asleep. Ah reckon that was the first thing he thought about after he curled up. And right this blessed minute, he's probably thinking about it harder than ever. Yo'all wait here while Ah listen at the door."
        - id: ch01-b10
          speaker: narrator
          text: "Unc' Billy crept softly up to the door of the old house. A grin spread across his face, and he motioned for Bobby Coon and Jimmy Skunk to come and listen."
        - id: ch01-b11
          speaker: narrator
          text: "From the little bedchamber far down the long hall came one long sigh after another. They heard Peter twisting and turning as he tried to get comfortable. Then they heard him repeating a verse over and over, hoping it would help him sleep. Unc' Billy, Bobby, and Jimmy had to cover their mouths with their hands to keep from laughing aloud."
        - id: ch01-b12
          speaker: narrator
          text: "After a while, they had heard enough. Unc' Billy whispered to Jimmy Skunk, and Jimmy grinned. He crept a short way down the long hall. Then he scratched with his stout claws, just as if he were digging."
        - id: ch01-b13
          speaker: narrator
          text: "When Jimmy stopped, Unc' Billy lowered his mouth close to the doorway and made the best imitation of Reddy Fox's bark that he could. Jimmy started digging again. Before long, Unc' Billy barked once more. Then the three friends slipped quietly away and hid behind some bushes."
        - id: ch01-b14
          speaker: unc_billy_possum
          text: "Ah reckon Brer Rabbit is mighty wide-awake now, instead of sleeping through the winter!"
          emotion: happy
