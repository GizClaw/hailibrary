audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 亲切风趣，带着悠然的乡音
        timbre: 圆润厚实
        pace: 从容
        pitch: 中低音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 随和贪玩，透着跃跃欲试的劲头
        timbre: 温暖而略带沙哑
        pace: 轻松
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 安静随和，藏着不动声色的幽默
        timbre: 平稳厚实
        pace: 舒缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 负鼠比利大叔开了个玩笑
      blocks:
        - id: ch01-b01
          speaker: unc_billy_possum
          text: 有些家伙呀，好像怎么也不会心满意足，总想要更多，哪怕那东西原本就不属于他。
        - id: ch01-b02
          speaker: narrator
          text: 负鼠比利大叔在心里念叨着这几句话。他看见彼得兔在绿色森林和绿色草原上来回奔忙，还是像先前一样，能吃多快就吃多快。彼得想赶紧把自己养得胖胖的，这样睡上一冬也不会冷。
        - id: ch01-b03
          speaker: narrator
          text: 比利大叔却很清楚，彼得不可能像土拨鼠约翰尼那样睡过整个冬天。大自然老妈妈从一开始就没打算给彼得这样的本领。他也知道，就算把这番道理说给彼得听，也是一点儿用都没有，彼得决不会信。于是，比利大叔只管暗暗发笑。彼得到处飞奔着找食物，没能多长一点儿肉，反而把身上仅有的那点儿肉也跑掉了。
        - id: ch01-b04
          speaker: narrator
          text: 说来也巧，比利大叔正好来到了臭鼬爷爷许多年前盖的老房子旁边。彼得已经打定主意，要在这所房子里睡过整个冬天。更巧的是，比利大叔还亲眼看着他走进长过道尽头的小卧房，蜷好身子，努力想睡着。
        - id: ch01-b05
          speaker: narrator
          text: 比利大叔先咧嘴笑了笑，又低声笑起来，最后笑得两边肥胖的肚皮直打颤。
        - id: ch01-b06
          speaker: unc_billy_possum
          text: 俺看，该拿兔子兄弟寻点儿乐子了。
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: 比利大叔一路笑着穿过绿色森林，跑到浣熊博比家。博比在外面忙了一整夜，这时刚准备上床睡觉。不过，他什么时候都乐意开个玩笑。比利大叔说起彼得，又说吓唬他一定很好玩，博比马上从空心树屋里爬下来。随后，他们找来臭鼬吉米，三个伙伴一同赶往臭鼬爷爷的老房子。彼得正在那里一心想睡过冬天。
        - id: ch01-b08
          speaker: unc_billy_possum
          text: 俺早跟彼得说过，想睡觉的时候，可别琢磨红狐雷迪万一找过来，发现他睡着了，那可怎么办。俺寻思，他刚蜷好身子，头一个想起的准是这件事。到了这会儿，他怕是越想越厉害哩。你们在这儿等着，俺去门口听听。
        - id: ch01-b09
          speaker: narrator
          text: 比利大叔轻手轻脚地摸到老房子的门边。听了一会儿，他咧开嘴，招手叫博比和吉米也来听。长过道尽头的小卧房里，一声接一声地传来彼得的长叹。他翻来覆去，想让自己躺得舒服一点儿，却怎么也办不到。后来，他一遍又一遍地念起一首小诗，想哄自己睡着。三个伙伴只好赶紧用手捂住嘴，这才没当场笑出声来。
        - id: ch01-b10
          speaker: narrator
          text: 他们听了好一阵，直到觉得没意思了，比利大叔才贴着吉米的耳朵低声说了几句。吉米咧嘴一笑，悄悄朝长过道里面爬了一小段，用结实的爪子抓挠起来，听着就像有人正在挖洞。
        - id: ch01-b11
          speaker: narrator
          text: 吉米一停，比利大叔便把嘴凑到门口，学着红狐雷迪叫了几声，学得几乎一模一样。吉米接着挖，比利大叔过一会儿又叫几声。随后，三个伙伴悄悄溜出去，藏在几丛灌木后面。
        - id: ch01-b12
          speaker: unc_billy_possum
          text: 俺看，兔子兄弟这会儿可清醒得很，哪还能睡过一冬哟！
          emotion: happy
