audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    happy_jack_squirrel:
      display_name: Happy Jack Squirrel
      tts:
        delivery: energetic and practical, becoming short-tempered when interrupted
        timbre: light and lively
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Happy Jack Squirrel Is To Busy To Talk
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Peter Rabbit sat with his mouth wide open, staring into the blue, blue sky. Ol' Mistah Buzzard was growing smaller and smaller. At last he was only a teeny, weeny speck. Then Peter couldn't see him at all."
        - id: ch01-b02
          speaker: narrator
          text: "Peter hitched up his trousers and sat there for a long while, looking very thoughtful. Something was troubling him. First Johnny Chuck had said he would see Peter in the spring, and then he had gone underground. Grandfather Frog had said the same thing before disappearing into the Smiling Pool. Now Ol' Mistah Buzzard had promised to see him in the spring too, and had vanished into that blue, blue sky."
        - id: ch01-b03
          speaker: peter_rabbit
          text: "They all sounded as if they truly meant it. I'll go ask Happy Jack Squirrel. Maybe he can explain what they meant."
        - id: ch01-b04
          speaker: narrator
          text: "Off Peter went through the Green Forest, lipperty-lipperty-lip, looking for Happy Jack Squirrel. Before long, he caught sight of Happy Jack's gray coat."
        - id: ch01-b05
          speaker: peter_rabbit
          text: "Hi, Happy Jack!"
        - id: ch01-b06
          speaker: narrator
          text: "Peter hurried toward him as fast as he could. Happy Jack kept digging a little hole in the ground while he answered."
        - id: ch01-b07
          speaker: happy_jack_squirrel
          text: "Hello, Peter Rabbit! Please don't bother me this morning. I have far too much work to do."
        - id: ch01-b08
          speaker: narrator
          text: "Peter became curious at once. In fact, he was so curious that he completely forgot the question he had come to ask. He sat down and watched Happy Jack drop a nut into the hole and cover it with earth. Then Happy Jack hurried off, dug another hole, and did the very same thing."
        - id: ch01-b09
          speaker: peter_rabbit
          text: "Why are you doing that?"
        - id: ch01-b10
          speaker: happy_jack_squirrel
          text: "Why am I doing it? I'm getting ready for winter, of course, you silly rabbit!"
        - id: ch01-b11
          speaker: narrator
          text: "Happy Jack stopped just long enough to catch his breath."
        - id: ch01-b12
          speaker: peter_rabbit
          text: "But I thought you kept your nuts and corn inside a hollow tree!"
        - id: ch01-b13
          speaker: happy_jack_squirrel
          text: "I do. But it would be foolish to keep every bit of food in one place, so I bury some of it."
        - id: ch01-b14
          speaker: peter_rabbit
          text: "Then how can you remember where you buried it all?"
        - id: ch01-b15
          speaker: happy_jack_squirrel
          text: "Sometimes I don't remember. When that happens, my nose helps me find it. I only have to dig down and take it out. Now I really can't talk any longer. I'm late with my work this year, and winter may be here before I know it."
        - id: ch01-b16
          speaker: narrator
          text: "That reminded Peter why he had come."
        - id: ch01-b17
          speaker: peter_rabbit
          text: "Oh, Happy Jack! Why did Johnny Chuck and Grandfather Frog and Ol' Mistah Buzzard all say they would see me in the spring?"
        - id: ch01-b18
          speaker: happy_jack_squirrel
          text: "I can't stop and explain it now! Winter is coming, and I have to be ready. I can't stop to talk!"
        - id: ch01-b19
          speaker: narrator
          text: "Happy Jack ran one way and then another, turning over the fallen leaves as he searched for another nut. That was the only answer Peter could get. He followed Happy Jack around and kept asking questions until the busy squirrel finally lost his temper. Peter sighed. Then he noticed Chatterer the Red Squirrel and Striped Chipmunk. They were every bit as busy as Happy Jack."
        - id: ch01-b20
          speaker: peter_rabbit
          text: "There is no use asking them. They're doing exactly what Happy Jack is doing. I don't understand why everyone is making such a fuss about winter. I don't have to prepare for it. I'll go back to the Smiling Pool and see if Grandfather Frog has come up again."
