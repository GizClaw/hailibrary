audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    happy_jack_squirrel:
      display_name: 松鼠快乐杰克
      tts:
        delivery: 机灵爽快，忙碌时略显急躁
        timbre: 明亮有力
        pace: 偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 大家都说春天见
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔张着嘴，仰头望向蓝蓝的天空。老秃鹫先生越飞越远，身影越来越小，先缩成一个丁点儿大的黑点，后来连黑点也不见了。
        - id: ch01-b02
          speaker: narrator
          text: 彼得往上提了提裤子，仍旧坐在那里，认认真真地想了很久。他心里很不安，一直绕着同一个疑问。土拨鼠约翰尼说过春天再见，随后钻进了地下。青蛙爷爷也说过春天再见，随后沉入微笑池。刚才，老秃鹫先生又说春天见，然后消失在高高的天空里。
        - id: ch01-b03
          speaker: peter_rabbit
          text: “他们三个说这句话的时候，听着可都是认真的。我去找快乐杰克问问吧，也许他知道这究竟是怎么回事。”
        - id: ch01-b04
          speaker: narrator
          text: 彼得立刻动身。他一路蹦蹦跳跳，穿过绿色森林，四处寻找松鼠快乐杰克。不一会儿，他瞧见了那件灰色外套。
        - id: ch01-b05
          speaker: peter_rabbit
          text: “嗨，快乐杰克！”
        - id: ch01-b06
          speaker: narrator
          text: 彼得使出最快的速度，急忙赶了过去。
        - id: ch01-b07
          speaker: happy_jack_squirrel
          text: “你好，彼得兔！今天早上别来打扰我，我要忙的事情实在太多了。”
        - id: ch01-b08
          speaker: narrator
          text: 快乐杰克嘴里说着话，手上也没闲着，还在地面挖出了一个小洞。彼得赶到跟前，他也始终没有停下手里的活。
    - id: ch02
      title: 埋起来的坚果
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得一下子来了兴致，越看越想弄明白，早把原先的问题抛到脑后。他坐在旁边，看快乐杰克将一颗坚果放进洞中，再盖上泥土。快乐杰克紧接着又挖了一个洞，照样埋下一颗。
        - id: ch02-b02
          speaker: peter_rabbit
          text: “你干吗把坚果埋进地里？”
        - id: ch02-b03
          speaker: happy_jack_squirrel
          text: “这还用问？当然是要为过冬做好准备呀，笨蛋！”
        - id: ch02-b04
          speaker: narrator
          text: 快乐杰克总算停了一下，喘了口气。
        - id: ch02-b05
          speaker: peter_rabbit
          text: “我一直以为，你会把坚果和玉米全都收进树洞里呢！”
          emotion: surprised
        - id: ch02-b06
          speaker: happy_jack_squirrel
          text: “树洞里当然要存。可要是把所有吃的全塞在一个地方，那不是太傻了吗？所以我还得在别处埋上一些。”
        - id: ch02-b07
          speaker: peter_rabbit
          text: “那你怎么记得每一颗都埋在哪儿？”
        - id: ch02-b08
          speaker: happy_jack_squirrel
          text: “也有记不住的时候。不过不要紧，我的鼻子会帮我找到。闻准了地方，往下一挖，坚果就出来了。”
        - id: ch02-b09
          speaker: happy_jack_squirrel
          text: “我真不能再聊了。今年已经耽搁得够晚，再磨蹭下去，冬天转眼就到了。”
    - id: ch03
      title: 还是没问出答案
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这句话终于让彼得想起了自己为什么跑来。
        - id: ch03-b02
          speaker: peter_rabbit
          text: “对了，快乐杰克！约翰尼、青蛙爷爷和老秃鹫先生都说要等到春天再见。他们到底是什么意思？”
        - id: ch03-b03
          speaker: happy_jack_squirrel
          text: “现在顾不上给你解释！”
        - id: ch03-b04
          speaker: narrator
          text: 快乐杰克一会儿跑到这边，一会儿奔向那边，不断翻开落叶，寻找下一颗坚果。
        - id: ch03-b05
          speaker: happy_jack_squirrel
          text: “冬天快来了，我必须先把东西备齐。哪还有时间聊天！”
        - id: ch03-b06
          speaker: narrator
          text: 彼得能从快乐杰克嘴里问出的也只有这些了。他还是跟着快乐杰克到处转，一个问题接着一个问题，没完没了地烦他，直到快乐杰克真的发起了脾气。彼得只好叹了口气。
        - id: ch03-b07
          speaker: narrator
          text: 接着，他又看见了红松鼠喋喋和花栗鼠条纹。那两个家伙跟快乐杰克一样，也都忙得不可开交。
        - id: ch03-b08
          speaker: peter_rabbit
          text: “他们做的事和快乐杰克一样，问了肯定也没用。大家为什么要为冬天忙成这样？我可不用准备什么。还是再去微笑池看看吧，说不定青蛙爷爷已经出来了。”
