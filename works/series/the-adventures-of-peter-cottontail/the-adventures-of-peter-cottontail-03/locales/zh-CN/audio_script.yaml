audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    ol_mistah_buzzard:
      display_name: 老秃鹫先生
      tts:
        delivery: 悠然风趣，话里藏着笑意
        timbre: 粗粝宽厚
        pace: 从容
        pitch: 中低音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 机灵顽皮，主意很多
        timbre: 圆润明亮
        pace: 轻快
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 从容淘气，话里带着坏笑
        timbre: 柔和厚实
        pace: 适中
        pitch: 中音
    blacky_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 响亮机敏，善于一本正经地逗趣
        timbre: 清朗略带沙哑
        pace: 明快
        pitch: 中高音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 随和机灵，语气里藏着笑
        timbre: 温和清晰
        pace: 适中
        pitch: 中音
    sammy_jay:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 热闹夸张，兴奋劲十足
        timbre: 明亮尖脆
        pace: 偏快
        pitch: 高音
  chapters:
    - id: ch01
      title: 一场恶作剧
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 浣熊博比和臭鼬吉米把脑袋凑到了一起。这两个家伙只要这样碰头，你就尽管断定，准有恶作剧要发生。对，先生，这回也不例外。要是彼得兔看见他们，心里也许就不会那么踏实了。可彼得压根儿没看见。他只顾着摆出一副气派模样，好让自己配得上那个响亮的新名字。他一路端着架子，竭力让自己显得像个大人物。这会儿，他正高高昂着头，朝笑脸池走去，要拜访麝鼠杰里。
        - id: ch01-b02
          speaker: narrator
          text: 从此以后，只要有人叫他的老名字，彼得就假装没听见。他装作自己从来不知道那个名字，更不知道对方是在叫他。博比和吉米觉得这事太可笑了。他们想逗逗彼得，也想让他看看自己到底有多傻。对，先生，他们打算给彼得一个教训。博比赶紧去找红狐雷迪。他告诉雷迪，彼得去了笑脸池，只要藏在路边，也许就能在回程截住他。
        - id: ch01-b03
          speaker: narrator
          text: 吉米则找来乌鸦布莱基和冠蓝鸦萨米，把计划和需要他们帮的忙说了一遍。他们当然答应了。随后，吉米又把老秃鹫先生请来。老秃鹫先生咧嘴笑了，也答应做好自己的那一份。每个人都清楚了自己该做什么。安排妥当以后，博比和吉米便藏到一旁，等着把接下来的一切看个清楚。
    - id: ch02
      title: 两个重要消息
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得已经到了笑脸池。他坐在岸边，欣赏着水里的倒影，还跟麝鼠杰里聊个不停。他刚告诉杰里，以后谁喊他的老名字，他都听不见了，乌鸦布莱基就飞了过来。
        - id: ch02-b02
          speaker: blacky_crow
          text: “你好，彼得兔！我正到处找你呢。我有个特别重要的口信，一定得告诉你。”
        - id: ch02-b03
          speaker: narrator
          text: 彼得好奇得心里直发痒，真想知道口信里说了什么，恨不得马上问个明白。可他还是只管和杰里说话，装作一点也没听见。
        - id: ch02-b04
          speaker: blacky_crow
          text: “彼得兔，我在叫你呢！难道你听不见吗？”
        - id: ch02-b05
          speaker: narrator
          text: 杰里抬头望着布莱基，悄悄朝他眨了眨眼。
        - id: ch02-b06
          speaker: jerry_muskrat
          text: “彼得兔不在这儿。这一位叫彼得·棉尾巴。”
        - id: ch02-b07
          speaker: blacky_crow
          text: “原来是这样！我的口信只给彼得兔，而且这件事他非知道不可。可惜他不在这儿。”
        - id: ch02-b08
          speaker: narrator
          text: 布莱基说完就飞走了，一路还在偷偷地笑。彼得心里有多别扭，脸上的神情就有多别扭。可他才吹嘘过，谁叫他彼得兔，他都听不见，现在当然不能开口。没一会儿，冠蓝鸦萨米也来了。他显得激动极了。
        - id: ch02-b09
          speaker: sammy_jay
          text: “彼得兔，我总算找到你啦！我有个特别重要的消息，正要告诉你呢。”
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: 彼得费了好大劲，才让自己稳稳坐着，继续假装没听见。可他到底忍住了。
        - id: ch02-b11
          speaker: jerry_muskrat
          text: “你认错啦，这一位是彼得·棉尾巴。”
        - id: ch02-b12
          speaker: sammy_jay
          text: “是吗？可我的消息只给彼得兔！”
        - id: ch02-b13
          speaker: narrator
          text: 萨米也飞走了，飞着飞着，还暗自笑个不停。
    - id: ch03
      title: 到底还是老名字好
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得这下比刚才更不自在，脸色也更难看了。他向麝鼠杰里告别，动身回亲爱的老荆棘丛去，想把这件事好好琢磨明白。刚走到半路，老秃鹫先生从天上悠悠地滑翔下来。
        - id: ch03-b02
          speaker: ol_mistah_buzzard
          text: “棉尾巴兄弟，你要是瞧见兔子兄弟，就替我告诉他，狐狸兄弟正躲在前面那一大丛草后头哩。”
        - id: ch03-b03
          speaker: narrator
          text: 彼得猛地停下，心一下跳得老高。那片草丛后面果然露着一点红色。他哪还顾得上再看，转身就朝绿色森林里一个熟悉的藏身处飞奔。红狐雷迪紧紧追在后面。跑着跑着，彼得听见乌鸦布莱基和冠蓝鸦萨米的笑声，这才明白，他们刚才说的重要消息就是这个。
        - id: ch03-b04
          speaker: peter_rabbit
          text: “我——我——看，彼得兔这个名字，到底也挺好的。”
