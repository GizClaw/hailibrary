audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, knowing, and quietly amused
        timbre: mellow and dry
        pace: relaxed
        pitch: medium-low
    jerry_muskrat:
      display_name: Jerry Muskrat
      tts:
        delivery: friendly, practical, and ready to share a joke
        timbre: light and smooth
        pace: conversational
        pitch: medium
    blacky_crow:
      display_name: Blacky the Crow
      tts:
        delivery: bold, clever, and teasing
        timbre: crisp and slightly raspy
        pace: lively
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: excitable, mischievous, and full of importance
        timbre: bright and sharp
        pace: quick
        pitch: medium-high
    ol_mistah_buzzard:
      display_name: Ol' Mistah Buzzard
      tts:
        delivery: slow, genial, and knowingly amused
        timbre: deep and airy
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Mischief Is Afoot
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Bobby Coon and Jimmy Skunk had their heads together. Whenever those two did that, you could be sure they were planning some mischief. Yes, sir, mischief was certainly afoot this time. If Peter Rabbit had seen them, he might not have felt quite so easy. But Peter didn't see a thing. He was much too busy trying to look as important as his new name sounded. With his head held very high, he strutted down toward the Smiling Pool to visit Jerry Muskrat."
        - id: ch01-b02
          speaker: narrator
          text: "If anyone called him by his old name, Peter acted as though he hadn't heard. He behaved as if the name meant nothing to him and no one could possibly be talking to him. Bobby and Jimmy thought this was a wonderful joke. They decided to have some fun with Peter and show him just how foolish he looked. In other words, they were going to teach him a lesson."
        - id: ch01-b03
          speaker: narrator
          text: "Bobby hurried off to find Reddy Fox. He told Reddy that Peter had gone to the Smiling Pool. If Reddy hid beside the path, he might catch Peter on his way home."
        - id: ch01-b04
          speaker: narrator
          text: "Jimmy found Blacky the Crow and Sammy Jay. He explained his plan and told them how they could help. Both of them gladly promised to do their part. Then Jimmy went to Ol' Mistah Buzzard. The old Buzzard grinned when he heard the plan and promised to help, too. After that, Bobby and Jimmy hid where they could watch everything happen."
    - id: ch02
      title: Two Important Messages
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "By then, Peter had reached the Smiling Pool. He sat on the bank, admiring his reflection in the water while he talked with Jerry Muskrat. Peter had just finished boasting that he no longer heard anyone who used his old name. That was when Blacky the Crow came along."
        - id: ch02-b02
          speaker: blacky_crow
          text: "Hello, Peter Rabbit! You're exactly who I've been looking for. I have a very important message for you!"
        - id: ch02-b03
          speaker: narrator
          text: "Peter went right on talking to Jerry as though he had heard nothing. Inside, though, he was burning with curiosity. What could that important message be?"
        - id: ch02-b04
          speaker: blacky_crow
          text: "Peter Rabbit! Can't you hear me?"
        - id: ch02-b05
          speaker: narrator
          text: "Jerry looked up at Blacky and gave him a wink."
        - id: ch02-b06
          speaker: jerry_muskrat
          text: "Peter Rabbit isn't here. This fellow is Peter Cottontail."
        - id: ch02-b07
          speaker: blacky_crow
          text: "Oh, I see. Well, my message is meant for Peter Rabbit, and he really should hear it. Too bad he isn't here."
        - id: ch02-b08
          speaker: narrator
          text: "Blacky flew away, chuckling to himself. Peter looked every bit as uncomfortable as he felt. But after all his boasting about never hearing the name Peter Rabbit, he couldn't say a single word."
        - id: ch02-b09
          speaker: narrator
          text: "Before long, Sammy Jay appeared. He seemed terribly excited."
        - id: ch02-b10
          speaker: sammy_jay
          text: "Peter Rabbit! At last, I've found you! I have some very important news to tell you."
        - id: ch02-b11
          speaker: narrator
          text: "It took all of Peter's strength to stay seated and pretend he couldn't hear. Somehow, he managed it. Jerry winked at Sammy."
        - id: ch02-b12
          speaker: jerry_muskrat
          text: "You've made a mistake. This is Peter Cottontail."
        - id: ch02-b13
          speaker: sammy_jay
          text: "Oh! But my news is for Peter Rabbit."
        - id: ch02-b14
          speaker: narrator
          text: "Away Sammy flew, chuckling to himself. Now Peter looked and felt worse than ever. He said good-by to Jerry and set off for the dear Old Briar-patch. He had a great deal to think about."
    - id: ch03
      title: A Warning for Brer Rabbit
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Peter was halfway home when Ol' Mistah Buzzard came sailing down from the sky."
        - id: ch03-b02
          speaker: ol_mistah_buzzard
          text: "Brer Cottontail, if yo' happen to see Brer Rabbit, tell him Brer Fox is hiding behind that big clump of grass up ahead."
        - id: ch03-b03
          speaker: narrator
          text: "Peter stopped dead. His heart gave a great leap. Sure enough, something red was showing behind the grass. Peter didn't wait for a better look. He raced as fast as he could toward a hiding place he knew in the Green Forest. Reddy Fox tore after him."
        - id: ch03-b04
          speaker: narrator
          text: "As Peter ran, he heard Blacky the Crow and Sammy Jay laughing. At once he understood. This was the important message and the important news they had tried to give him."
    - id: ch04
      title: The Old Name After All
      blocks:
        - id: ch04-b01
          speaker: peter_rabbit
          text: "I... I guess Peter Rabbit is a good enough name after all!"
