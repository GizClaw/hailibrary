audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 从容淘气，话里带着坏笑
        timbre: 柔和厚实
        pace: 适中
        pitch: 中音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 急躁冲动，发怒时语气逼人
        timbre: 尖亮而略显粗粝
        pace: 偏快
        pitch: 中高音
    bowser_hound:
      display_name: 猎犬鲍泽
      tts:
        delivery: 洪亮有力，追赶时十分急切
        timbre: 浑厚响亮
        pace: 明快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 树桩后的误会
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 红狐雷迪蜷在大松树桩后头，正梦见一整鸡舍的鸡。那儿没有猎犬鲍泽守着，想吃多少就有多少。冷不防，有个东西“砰”地落到他身上，撞得他一口气都喘不上来。雷迪吓得直哆嗦。好不容易回过神，他才看清，原来是臭鼬吉米跳到了自己身上。
        - id: ch01-b02
          speaker: narrator
          text: 吉米客客气气地赔了不是，一再说这只是个误会。彼得兔捉弄了他们两个，而他呢，不过想找几只甲虫当早饭。
        - id: ch01-b03
          speaker: narrator
          text: 可雷迪的脾气一点就着。他一听自己竟成了笑话里的倒霉蛋，火气一下全冒了出来。他瞪住吉米，气得舌头都不听使唤。
        - id: ch01-b04
          speaker: reddy_fox
          text: “你——你——你，你就是故——故意扑我的！”
          emotion: angry
        - id: ch01-b05
          speaker: jimmy_skunk
          text: “才不是呢！这全是彼得兔玩的把戏。你不信，就朝下面的绿色草原看看。”
        - id: ch01-b06
          speaker: narrator
          text: 雷迪低头一瞧，彼得正坐在那儿，两手叉着腰。两只长耳朵笔直地指向蓝天，嘴巴张得老大，看着恶作剧的结果笑个不停。
        - id: ch01-b07
          speaker: narrator
          text: 雷迪冲他挥起了拳头。
        - id: ch01-b08
          speaker: peter_rabbit
          text: “哈，哈，哈！”
          emotion: happy
    - id: ch02
      title: 穿过绿色草原
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 雷迪又狠狠瞪了吉米一眼。他很想跟吉米吵一架，可草原和森林里的小居民都知道，臭鼬吉米可不好惹，雷迪也明白这一点。想来想去，他决定还是别招惹吉米了，转身便使出全力去追彼得。
        - id: ch02-b02
          speaker: narrator
          text: 雷迪跑起来快极了。彼得见他直冲过来，知道自己的两条长腿这回可不能偷懒。他们就这样一前一后，飞奔着穿过绿色草原。
        - id: ch02-b03
          speaker: narrator
          text: 吉米坐在山顶看得清清楚楚。彼得裤子后面那块白斑左摇一下，右晃一下，雷迪就紧贴在后面追。彼得一时还跑得过他。你还记得吧，彼得不用回头也能看见身后，所以雷迪离得多近，他心里一清二楚。
        - id: ch02-b04
          speaker: narrator
          text: 两个家伙沿着草原边缘，在灌木丛里钻进钻出。雷迪越追越生气，根本没留意他们跑向了哪里。他满脑子只剩下一件事，那就是抓住彼得。
    - id: ch03
      title: 鲍泽追来了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得渐渐没了力气，便慢慢转向农夫布朗家的玉米地。他知道，农夫布朗家的男孩正带着猎犬鲍泽藏在那儿。彼得忽左忽右，一路把雷迪引向篱笆角。先前，臭鼬吉米就是在那里看见乌鸦布莱基中了套索。
        - id: ch03-b02
          speaker: narrator
          text: 彼得故意放慢一点，让雷迪差点碰到自己，接着猛一闪身，冲进了空旷的玉米地。雷迪哪里肯停，当然也跟了进去。
        - id: ch03-b03
          speaker: bowser_hound
          text: “汪！汪！汪汪！”
        - id: ch03-b04
          speaker: narrator
          text: 雷迪连头也不用回，就明白出了什么事。鲍泽已经发现他，正从后面追来。
        - id: ch03-b05
          speaker: narrator
          text: 彼得一低头，钻到一大丛草后面，坐下歇气。雷迪可不敢歇。他拼尽力气向前飞奔，猎犬鲍泽就在身后一路紧追。
