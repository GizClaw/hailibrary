audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, knowing, and quietly amused
        timbre: mellow and dry
        pace: relaxed
        pitch: medium-low
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sharp and hot-tempered, with restless energy
        timbre: lean and slightly rough
        pace: quick
        pitch: medium
    bowser_the_hound:
      display_name: Bowser the Hound
      tts:
        delivery: forceful and eager, with a booming bark
        timbre: deep and full
        pace: brisk
        pitch: low
  chapters:
    - id: ch01
      title: Reddy Pox Gets into Trouble
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Reddy Fox lay curled up behind the big pine stump. He was dreaming about a chicken coop with no Bowser the Hound around to guard it. Then something dropped onto him with a thump and knocked every bit of breath from his body. Reddy was so frightened that, for a moment, he could do nothing but shake. When he finally gathered his senses, he discovered that Jimmy Skunk had landed on him."
        - id: ch01-b02
          speaker: narrator
          text: "Jimmy was very polite about it. He begged Reddy to forgive him and insisted that the whole thing had been a mistake. Peter Rabbit had played a trick on both of them, Jimmy explained. He had only been searching for beetles to eat for breakfast."
        - id: ch01-b03
          speaker: narrator
          text: "Reddy Fox had a quick temper. The moment he understood that someone had made him the victim of a joke, that temper burst out. He glared at Jimmy, so furious that he could hardly get the words past his lips."
        - id: ch01-b04
          speaker: reddy_fox
          text: "Y-y-you... y-y-you did that on p-p-purpose!"
          emotion: angry
        - id: ch01-b05
          speaker: jimmy_skunk
          text: "I did no such thing! Peter Rabbit played the joke. If you don't believe me, look down there on the Green Meadows."
        - id: ch01-b06
          speaker: narrator
          text: "Reddy looked down. There was Peter with his hands on his hips. His long ears pointed straight toward the blue sky, and his mouth was wide open as he laughed at what his trick had done. Reddy shook his fist at him."
        - id: ch01-b07
          speaker: peter_rabbit
          text: "Ha, ha, ha!"
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: "Reddy gave Jimmy Skunk a hard look. Like all the other little people of the meadow and forest, though, Reddy had great respect for Jimmy. He wanted to quarrel with him, but he decided that would not be wise. So he turned away and raced after Peter Rabbit as fast as his legs could carry him."
        - id: ch01-b09
          speaker: narrator
          text: "Reddy could run very fast. When Peter saw him coming, he knew he would need every bit of speed in his own long legs. Off they flew across the Green Meadows. From the top of the hill, Jimmy watched the white patch on the seat of Peter's trousers bob one way and then the other, with Reddy close behind."
        - id: ch01-b10
          speaker: narrator
          text: "Peter was fast enough to stay ahead for a while. And remember, his eyes were placed so that he could see behind him without turning his head. That meant he always knew when Reddy was getting too close."
        - id: ch01-b11
          speaker: narrator
          text: "They darted in and out among the bushes at the edge of the Green Meadows. The farther Reddy ran, the angrier he became. He never noticed where Peter was leading him. He could think of nothing but catching that rabbit."
        - id: ch01-b12
          speaker: narrator
          text: "After a while, Peter began to tire. He worked his way toward Farmer Brown's cornfield, because he knew Farmer Brown's boy was hiding there with Bowser the Hound. Peter dodged back and forth until he reached the corner of the fence. It was the very place where Jimmy Skunk had watched Blacky the Crow get caught in a snare."
        - id: ch01-b13
          speaker: narrator
          text: "Peter let Reddy come very close to catching him. Then he dodged out into the open cornfield. Of course, Reddy followed."
        - id: ch01-b14
          speaker: bowser_the_hound
          text: "Bow-wow! Bow-wow-wow!"
        - id: ch01-b15
          speaker: narrator
          text: "Reddy did not have to turn around to know what had happened. Bowser had spotted him and was racing after him. Peter ducked behind a big clump of grass and sat down to catch his breath. Reddy ran on as hard as he could, with Bowser the Hound right behind him."
