audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively and impulsive, quick to complain and quick to brighten
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: practical and plainspoken, growing sleepy and mildly cross when questioned
        timbre: sturdy and mellow
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Johnny Chuck Prepares for Winter
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "There was something in the air that Peter Rabbit couldn't understand. It made him feel frisky and happy, ready to race or romp with anyone who came along. Peter couldn't see why his friends and neighbors in the Green Meadows and the Green Forest didn't feel the same way. But they didn't. Some of his favorite playmates wouldn't play at all, not even for a few minutes. They said they were too busy."
        - id: ch01-b02
          speaker: narrator
          text: "Peter kept wondering about it as he scampered down the Lone Little Path. He kicked up his heels and tried to leap over his own shadow. Just ahead, Johnny Chuck was sitting on his doorstep. Peter noticed how very fat Johnny was getting. Then he called out to him."
        - id: ch01-b03
          speaker: peter_rabbit
          text: "Come play hide-and-seek with me, Johnny Chuck!"
        - id: ch01-b04
          speaker: narrator
          text: "Johnny shook his head."
        - id: ch01-b05
          speaker: johnny_chuck
          text: "I can't. I have to get ready for winter."
        - id: ch01-b06
          speaker: narrator
          text: "Peter sat down and stared at Johnny. Why would anyone go to all that trouble to prepare for winter? Peter never did anything except put on a warmer coat, so he couldn't imagine what Johnny needed to do."
        - id: ch01-b07
          speaker: peter_rabbit
          text: "How do you get ready?"
        - id: ch01-b08
          speaker: johnny_chuck
          text: "Get ready for what?"
          emotion: surprised
        - id: ch01-b09
          speaker: narrator
          text: "Johnny looked up in surprise. Peter was beginning to lose patience."
        - id: ch01-b10
          speaker: peter_rabbit
          text: "For winter, of course!"
        - id: ch01-b11
          speaker: narrator
          text: "Johnny gave Peter a look that made it quite clear what he thought. How could Peter be so foolish?"
        - id: ch01-b12
          speaker: johnny_chuck
          text: "I eat. What else would I do?"
        - id: ch01-b13
          speaker: narrator
          text: "With that, Johnny began stuffing himself as though he hadn't eaten for a week. Yet he was already so fat and round that he could hardly waddle. Peter's eyes began to twinkle."
        - id: ch01-b14
          speaker: peter_rabbit
          text: "You certainly do eat! I wouldn't mind getting ready for winter like that. Why, you look as if you're trying to eat enough food to last the whole winter."
        - id: ch01-b15
          speaker: narrator
          text: "Peter always thought a great deal about his stomach. Johnny gave a sleepy yawn, then went right back to eating."
        - id: ch01-b16
          speaker: johnny_chuck
          text: "That's exactly what I'm doing."
        - id: ch01-b17
          speaker: narrator
          text: "Johnny spoke with his mouth full. Peter's great big eyes nearly popped out."
        - id: ch01-b18
          speaker: peter_rabbit
          text: "What did you say?"
          emotion: surprised
        - id: ch01-b19
          speaker: johnny_chuck
          text: "I said I'm eating enough to last all winter. That's how I get ready for it."
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: "Johnny sounded just a little cross. Then he decided he had finally eaten enough. The air was getting cool, and sleep was calling him down below."
        - id: ch01-b21
          speaker: johnny_chuck
          text: "I think I'll go down now and sleep. See you in the spring, Peter Rabbit."
        - id: ch01-b22
          speaker: peter_rabbit
          text: "Wha—what did you say?"
          emotion: surprised
        - id: ch01-b23
          speaker: narrator
          text: "Peter looked as though he couldn't have heard Johnny correctly. But it was too late to ask again. Johnny Chuck had disappeared inside his house."
