audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼直率，情绪来得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 热心机敏，笑起来爽朗
        timbre: 厚实明亮
        pace: 适中而轻快
        pitch: 中音
  chapters:
    - id: ch01
      title: 空气里的变化
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 空气里像是多了什么，彼得兔却说不清那是什么。他只觉得浑身有劲，心里快活，真想找个路过的伙伴赛跑，再痛痛快快地玩一场。
        - id: ch01-b02
          speaker: narrator
          text: 可绿色草原和绿色森林里的朋友们并没有这种感觉。真的，他们一点儿也不想玩。彼得最爱找的几个玩伴，一个也不肯陪他，连几分钟都不行。大家都说自己没工夫。
        - id: ch01-b03
          speaker: narrator
          text: 彼得想不通。他沿着孤零零小径一路飞奔，后脚踢得老高，还试着跳过自己的影子。跑着跑着，他看见土拨鼠约翰尼正坐在自家门阶上。
        - id: ch01-b04
          speaker: narrator
          text: 彼得心里一惊，约翰尼怎么越来越胖了！他马上高声招呼起来。
        - id: ch01-b05
          speaker: peter_rabbit
          text: “约翰尼，快来呀，咱们玩捉迷藏！”
        - id: ch01-b06
          speaker: narrator
          text: 约翰尼摇了摇头。
        - id: ch01-b07
          speaker: johnny_chuck
          text: “不行，我还得为过冬做准备呢。”
    - id: ch02
      title: 约翰尼的准备办法
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得坐下来，好奇地瞧着约翰尼。他不明白，过个冬天为什么还要特意准备。彼得自己除了换上一身更暖和的皮毛，什么也不做，所以他实在想不出约翰尼为什么非准备不可。
        - id: ch02-b02
          speaker: peter_rabbit
          text: “那你到底怎么准备呀？”
        - id: ch02-b03
          speaker: narrator
          text: 约翰尼惊讶地抬起头。
        - id: ch02-b04
          speaker: johnny_chuck
          text: “准备什么？”
          emotion: surprised
        - id: ch02-b05
          speaker: peter_rabbit
          text: “还能是什么？当然是准备过冬呀。”
        - id: ch02-b06
          speaker: narrator
          text: 彼得已经有点不耐烦了。约翰尼望着他，简直像在看一个笨得出奇的家伙。
        - id: ch02-b07
          speaker: johnny_chuck
          text: “那当然是吃东西。”
        - id: ch02-b08
          speaker: narrator
          text: 约翰尼说完，立刻大口吃起来，活像饿了整整一个星期。其实他早就胖得圆滚滚的，走起路来都快摇不动了。
        - id: ch02-b09
          speaker: narrator
          text: 彼得眼里闪着笑意。
        - id: ch02-b10
          speaker: peter_rabbit
          text: “看得出来，你可真没少吃！要是这样就能准备过冬，我也很乐意。照我看，你是想现在吃个够，一直撑过整个冬天吧。”
        - id: ch02-b11
          speaker: narrator
          text: 你知道，彼得一向把自己的肚子看得很要紧。
    - id: ch03
      title: 春天再见
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 约翰尼困倦地打了个哈欠，接着又吃起来。他嘴里塞得满满的，只含含糊糊地应了一声。
        - id: ch03-b02
          speaker: johnny_chuck
          text: “没错，我就是这么打算的。”
        - id: ch03-b03
          speaker: peter_rabbit
          text: “你刚才说什么？”
          emotion: surprised
        - id: ch03-b04
          speaker: narrator
          text: 彼得的一双大眼睛一下瞪得溜圆。约翰尼有点恼火，只好把话再说一遍。
        - id: ch03-b05
          speaker: johnny_chuck
          text: “我说，我要吃下够我撑过整个冬天的食物。这就是我准备过冬的办法。我想现在已经吃够了。天气越来越凉，我也该下去睡觉啦。彼得，咱们春天再见。”
        - id: ch03-b06
          speaker: peter_rabbit
          text: “什……什么？你说春天再见？”
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: 彼得还以为自己听错了。可就在他说话的时候，约翰尼已经钻进屋里，不见了。
