audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    butcher:
      display_name: 屠夫
      tts:
        delivery: 直率严厉，发怒时仍讲道理
        timbre: 粗厚有力
        pace: 稍快
        pitch: 中低
    butcher_son:
      display_name: 屠夫的儿子
      tts:
        delivery: 倔强急躁，辩解时一口气说个不停
        timbre: 年轻而略显粗哑
        pace: 快
        pitch: 中
  chapters:
    - id: ch01
      title: 伦敦街头的马
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 在伦敦，我见过马儿吃许多苦。其实，人只要稍微懂点道理，其中很多苦本来都能免掉。我们不怕重活，只求别人待我们合情合理。有些马虽替穷苦人做事，日子却比我当年拉W伯爵夫人的马车时还快活。那时候，我吃着上好的饲料，身上还佩着银饰挽具呢。
        - id: ch01-b02
          speaker: narrator
          text: 每逢看见小马受人糟蹋，我都十分难受。有的拖着重载，挣扎着往前走。有的挨着狠毒孩子的重鞭，脚步都踉跄了。这样的事，我在伦敦不知见过多少回。
        - id: ch01-b03
          speaker: narrator
          text: 有一回，我遇见一匹灰色小马。他鬃毛浓密，脑袋俊秀，简直就是快乐腿的模样。若不是我还套在车上，准会朝他叫一声。可他正拼尽力气拉一辆重车。一个粗壮野蛮的男孩还用鞭子抽他的肚腹，又狠狠扯动嚼子，弄疼他小小的嘴巴。
        - id: ch01-b04
          speaker: narrator
          text: 那会不会真是快乐腿？实在太像了。可布洛姆菲尔德先生从没打算卖掉他，我想他也不会那样做。也许眼前这匹小马一样善良，小时候也曾有过一个快活的家。
    - id: ch02
      title: 屠夫家的送货车
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我总看见屠夫家的马被赶得飞快，却不明白为什么。一天，我们在圣约翰林停了很久，隔壁恰好是家肉铺。一辆送货车忽然飞奔而来。拉车的马浑身滚烫，已经累透了。他低着头，两胁一起一伏，四条腿抖个不停。车上的小伙子跳下来，正要拿货篮，店主便沉着脸走出了铺子。他看了看马，转身训斥那个小伙子。
        - id: ch02-b02
          speaker: butcher
          emotion: angry
          text: 我还要讲多少次？不准再这样赶车！上一匹马就是被你毁掉的，连喘气都落下了病。现在，你又想用同样的办法毁掉这一匹。要不是你是我的亲儿子，我立刻就辞掉你。你把马赶成这样回店，真给我丢脸！警察随时会抓你。真到了那一步，别等我花钱保你出来。该说的我已经说够了，你自己承担后果吧。
        - id: ch02-b03
          speaker: narrator
          text: 父亲训话时，男孩一直阴着脸站在旁边，满心不服。父亲刚住口，他就气冲冲地顶了回去。他说这不是自己的错，自己不肯替人担罪，一路不过是在照吩咐送货。
        - id: ch02-b04
          speaker: butcher_son
          emotion: angry
          text: 您一天到晚只催我，快一点，动作再麻利一点！我到了客人家，这家要赶着早些吃饭，让我一刻钟内送来一条羊腿。那家的厨娘忘订牛肉，我得跑去取，马上赶回去，不然女主人就骂她。又有管家说，客人忽然来了，排骨必须立刻送到。
        - id: ch02-b05
          speaker: butcher_son
          emotion: angry
          text: 新月街四号那位太太更是每次都等午饭的肉到了，才肯订晚饭。哪一趟不是赶、赶、赶？那些有钱人要是早些想好吃什么，头一天就把肉订下，今天根本不会闹成这样！
        - id: ch02-b06
          speaker: butcher
          text: 我也真巴不得他们肯这样！那会替我省下不知多少烦恼。要是早些知道，我也能把每位客人伺候得更周到。可说了又有什么用？谁替屠夫想过方不方便？谁又想过屠夫的马？
        - id: ch02-b07
          speaker: butcher
          text: 好了，把马牵进去，仔细照料。今天绝不能再让他出门。还有东西要送，你就自己提着篮子走过去。
        - id: ch02-b08
          speaker: narrator
          text: 屠夫说完便回了铺子，那匹疲惫的马也被牵走了。
    - id: ch03
      title: 朋友的手和声音
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 好在男孩并不全都残忍。有些孩子把自己的小马或驴子当作最心爱的狗来疼。那些小家伙也欢欢喜喜，甘心替小主人做事，就像我甘心替杰里干活一样。活计有时确实很重，可朋友温柔的手，还有朋友熟悉的声音，会让重活也轻松起来。
        - id: ch03-b02
          speaker: narrator
          text: 有个卖蔬菜的小男孩，常带着青菜和土豆来到我们街上。他那匹老小马不大漂亮，却是我见过最开朗、最勇敢的小家伙。看他们彼此那样亲爱，真叫人高兴。小马平时像狗一样跟着主人。男孩一坐上车，不必挥鞭，也不用吆喝，他自己便小跑起来。小车的轮子一路欢响，仿佛他刚从女王的马厩出来。
        - id: ch03-b03
          speaker: narrator
          text: 杰里很喜欢这个男孩，给他起了个外号，叫“查理王子”。杰里还说，这孩子将来准会成为赶车人中的国王。
        - id: ch03-b04
          speaker: narrator
          text: 从前还有一位老人，常拉着一辆小煤车来到街上。他戴着煤炭搬运工的帽子，模样粗糙黝黑。他和自己的老马总是慢慢走在一起，像两个彼此会意的好搭档。到了买煤的人家门前，马不用吩咐，自己便会停下，还一直把一只耳朵朝主人那边侧着。
        - id: ch03-b05
          speaker: narrator
          text: 老人还没走近，叫卖声早已从街那头传来。我从没听懂他喊的是什么。孩子们觉得那声音像“老巴——呼”，便这样叫他。波莉向老人买煤，对他十分友好。杰里说，想到一匹老马在穷苦人家也能这样幸福，心里真是宽慰。
