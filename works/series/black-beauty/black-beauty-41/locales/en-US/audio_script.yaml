audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    butcher:
      display_name: Butcher
      tts:
        delivery: firm, practical, and easily harried
        timbre: sturdy and mature
        pace: moderate
        pitch: medium-low
    butcher_son:
      display_name: Butcher's Son
      tts:
        delivery: defensive, blunt, and quick-spoken
        timbre: youthful and rough-edged
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: Trouble in London
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I saw a great deal of trouble among the horses in London, and a little common sense could have prevented much of it. We horses don't mind working hard when people treat us reasonably. Many horses owned by poor men had happier lives than I did pulling the Countess of W----'s carriage, even with my fine food and silver-mounted harness.
        - id: ch01-b02
          speaker: narrator
          text: >-
            It hurt me to see little ponies straining against heavy loads, or staggering while some cruel young driver beat them. Once I saw a small gray pony with a thick mane and a pretty head. He looked so much like Merrylegs that, if I hadn't been in harness, I would have called out to him.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The pony was pulling as hard as he could at a heavy cart. A strong, rough boy kept lashing him under the belly and jerking cruelly at his little mouth. Could that really be Merrylegs? He looked just like him. But Mr. Blomefield had said he would never sell Merrylegs, and I didn't think he would. Still, this pony might once have been just as good and happy when he was young.
    - id: ch02
      title: The Butcher's Horse
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            I often noticed how fast butchers made their horses go, though I didn't understand why until one day in St. John's Wood. We had been waiting there for some time beside a butcher's shop when a butcher's cart came racing up. Its horse was hot and worn out. His head hung low, his sides heaved, and his legs trembled from the hard drive.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The boy jumped down and started to take out a basket. Then his father came from the shop, clearly displeased. He looked over the horse and turned on his son.
        - id: ch02-b03
          speaker: butcher
          emotion: angry
          text: >-
            How many times do I have to tell you not to drive like that? You ruined our last horse and damaged his breathing, and now you're doing the same to this one. If you weren't my son, I'd fire you right now. It's a disgrace to bring a horse back to the shop in this condition. The police could arrest you for driving this way. If they do, don't expect me to pay your bail. I've warned you until I'm tired of saying it. You'll have to answer for yourself.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The boy had listened with a stubborn look. As soon as his father stopped, he burst out angrily. He said it wasn't his fault and he wouldn't accept the blame. He had only been following orders.
        - id: ch02-b05
          speaker: butcher_son
          emotion: angry
          text: >-
            You're always telling me, "Hurry up! Be quick!" Then I reach one house, and they want a leg of mutton for an early dinner, so I have fifteen minutes to bring it. At the next house, the cook forgot to order beef. I have to fetch it at once or her mistress will scold her. Then a housekeeper says unexpected company is coming and she needs chops right away. And the lady at Number Four in the Crescent never orders dinner until the lunch meat arrives. It's hurry, hurry, hurry all day long. If those gentlefolk planned what they wanted and ordered their meat the day before, we wouldn't have all this trouble!
        - id: ch02-b06
          speaker: butcher
          text: >-
            I wish they would. It would save me no end of worry, and I could serve them much better if I knew ahead of time. But what good does talking do? Who ever thinks about a butcher's convenience, or a butcher's horse? Now take him in and care for him properly. He isn't going out again today. If another order comes, you'll carry it yourself in the basket.
        - id: ch02-b07
          speaker: narrator
          text: >-
            With that, the butcher went inside, and the tired horse was led away.
    - id: ch03
      title: Prince Charlie
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            But not every boy was cruel. I saw boys who loved their pony or donkey as dearly as a favorite dog. The little animals worked for their young drivers as cheerfully and willingly as I worked for Jerry. The work could still be hard, but a friend's hand and voice made it easier.
        - id: ch03-b02
          speaker: narrator
          text: >-
            One young coster-boy came along our street selling greens and potatoes. His old pony wasn't much to look at, but he was the most cheerful, spirited little fellow I ever saw. It was a pleasure to watch how fond they were of each other.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The pony followed the boy like a dog. Once his master climbed into the cart, the pony trotted away without a whip or even a word. He rattled down the street as merrily as if he had come from the queen's own stables. Jerry liked the boy and called him "Prince Charlie." He said the boy would become a king among drivers someday.
    - id: ch04
      title: Two Good Partners
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            An old man also came along our street with a small coal cart. He wore a coal-heaver's hat and looked rough and black with dust. He and his old horse plodded down the road together like two good partners who understood one another.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The horse stopped by himself at every door where people bought coal from them, always keeping one ear turned toward his master. You could hear the old man's call far up the street before he came near. I never understood his words, but the children called him "Old Ba-a-ar Hoo" because that was how his cry sounded.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Polly bought her coal from him and treated him kindly. Jerry said it was comforting to know that even in a poor home, an old horse could still be happy.
