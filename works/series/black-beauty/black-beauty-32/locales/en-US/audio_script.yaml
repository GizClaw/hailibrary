  chapters:
    - id: ch01
      title: Sights at the Horse Fair
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A horse fair must be great fun for anyone who has nothing to lose. There was certainly plenty to watch.

            Long lines of young country horses had come fresh from the marshes. Shaggy little Welsh ponies stood no taller than Merrylegs. There were hundreds of cart horses too. Some had long tails braided and tied with scarlet cord. And many horses were like me: handsome and well bred, but brought down into the middle class by an accident, a blemish, bad wind, or some other trouble.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Some splendid horses were still in their prime and ready for any work. They lifted their legs high and showed off their best paces while grooms ran beside them with leading reins.

            Behind them stood very different horses. Hard work had broken some down until their front knees bent forward and their hind legs swung out at every step. Old horses stood with drooping lips and heavy, backward ears, as though life held no pleasure or hope anymore. Some were so thin that every rib showed. Others had old sores across their backs and hips. A horse cannot look at such things without wondering if the same fate may one day be his.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Bargaining went on everywhere. Prices rose and fell, and from what I could understand, that fair held more lies and tricks than even a clever man could count.

            I was placed beside two or three other strong, useful-looking horses. Plenty of people came over to inspect us. Gentlemen always turned away once they saw my broken knees, though my salesman swore I had only slipped in my stall.
    - id: ch02
      title: The Gray-Eyed Man
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Every buyer began by pulling my mouth open. Then came a look at my eyes, hands running all the way down my legs, a hard squeeze of my skin and flesh, and finally a test of my paces.

            But people did these things in very different ways. Some handled me roughly and carelessly, as if I were nothing but a piece of wood. Others moved their hands gently over my whole body and gave me an occasional pat that seemed to say, “If you please.” Naturally, I formed much of my opinion of each buyer from the way he treated me.
        - id: ch02-b02
          speaker: narrator
          text: >-
            One man made me hope he would buy me. He was neither a gentleman nor one of those loud, flashy men who claimed to be gentlemen. He was small but well built, and every movement was quick. The moment he touched me, I knew he understood horses. He spoke softly, and his gray eye looked kind and cheerful.

            This may sound strange, but I liked his clean, fresh smell too. There was none of the old beer and tobacco I hated. He smelled as though he had just stepped out of a hayloft.
        - id: ch02-b03
          speaker: narrator
          text: >-
            He offered twenty-three pounds, but the salesman refused. The man walked away, and I watched until he disappeared.

            Then a hard-faced man with a loud voice came up. I was terribly afraid he might buy me, but he left. One or two other people looked without any real intention of buying. At last, the hard-faced man returned and offered twenty-three pounds. The bargaining grew close. My salesman had asked for more, but now he was beginning to see that he might not get his price and would have to come down.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Just then, the gray-eyed man came back. I could not stop myself from stretching my head toward him. He gently stroked my face.
        - id: ch02-b05
          speaker: gray_eyed_man
          text: >-
            Well, old fellow, I think you and I would get along. I'll pay twenty-four pounds for him.
        - id: ch02-b06
          speaker: salesman
          text: >-
            Make it twenty-five, and he's yours.
        - id: ch02-b07
          speaker: gray_eyed_man
          text: >-
            Twenty-four pounds ten. Not one more sixpence. Yes or no?
        - id: ch02-b08
          speaker: salesman
          text: >-
            Done. You can count on this horse having a great deal of quality. If you need him for cab work, you've found yourself a bargain.
    - id: ch03
      title: The Road to London
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The money changed hands right there. My new master took my halter and led me away from the fair to an inn, where a saddle and bridle were waiting. He gave me a good feed of oats and stayed beside me while I ate, talking partly to himself and partly to me.

            Half an hour later, we set out for London. Pleasant lanes and country roads carried us to the great London thoroughfare. We followed it steadily until twilight, when we reached the enormous city.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The gas lamps were already burning. Streets ran to the right and left and crossed one another, mile after mile. I began to think they would never end.

            At last, we passed a long line of cabs. My rider called out cheerfully.
        - id: ch03-b03
          speaker: gray_eyed_man
          text: >-
            Good night, governor!
        - id: ch03-b04
          speaker: governor
          text: >-
            Hello there! Did you find a good one?
        - id: ch03-b05
          speaker: gray_eyed_man
          text: >-
            I believe I did.
        - id: ch03-b06
          speaker: governor
          text: >-
            Then I hope he brings you luck.
        - id: ch03-b07
          speaker: gray_eyed_man
          text: >-
            Thank you, governor.
        - id: ch03-b08
          speaker: narrator
          text: >-
            We rode on and soon entered a side street. Halfway along it, we turned into a much narrower one. Rather poor-looking houses stood on one side. On the other were buildings that seemed to be coach houses and stables.
    - id: ch04
      title: A Happy Welcome
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            My owner stopped at one of the houses and whistled. The door flew open. A young woman ran out, with a little girl and boy close behind her. They greeted my rider with great excitement as he got down.
        - id: ch04-b02
          speaker: gray_eyed_man
          text: >-
            All right, Harry, open the gates. Mother can bring us the lantern.
        - id: ch04-b03
          speaker: narrator
          text: >-
            A moment later, the whole family stood around me in a small stable yard.
        - id: ch04-b04
          speaker: dolly
          text: >-
            Father, is he gentle?
        - id: ch04-b05
          speaker: gray_eyed_man
          text: >-
            Yes, Dolly. He's as gentle as your own kitten. Come give him a pat.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Right away, her small hand moved fearlessly over my shoulder. It felt so good.
        - id: ch04-b07
          speaker: polly
          text: >-
            I'll make him a bran mash while you rub him down.
        - id: ch04-b08
          speaker: gray_eyed_man
          text: >-
            Please do, Polly. That's exactly what he needs. And I know you've made a fine meal for me too.
        - id: ch04-b09
          speaker: harry
          text: >-
            Sausage dumpling and apple turnover!
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: >-
            They all burst out laughing. Then I was led into a comfortable stall that smelled clean and held plenty of dry straw. After an excellent supper, I lay down with one thought in my mind.

            I was going to be happy.
