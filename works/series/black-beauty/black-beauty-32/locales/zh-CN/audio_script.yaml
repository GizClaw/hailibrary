audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    new_master:
      display_name: 新主人
      tts:
        delivery: 爽朗和气，懂马而做事利落
        timbre: 清爽结实
        pace: 明快
        pitch: 中
    salesman:
      display_name: 卖马人
      tts:
        delivery: 精明老练，谈价时紧咬不放
        timbre: 粗亮有力
        pace: 稍快
        pitch: 中低
    cab_governor:
      display_name: 马车行老板
      tts:
        delivery: 隔街招呼般直爽热络
        timbre: 洪亮厚实
        pace: 明快
        pitch: 中低
    polly:
      display_name: 波莉
      tts:
        delivery: 体贴能干，话语温暖自然
        timbre: 柔和明净
        pace: 适中
        pitch: 中
    harry:
      display_name: 哈里
      tts:
        delivery: 活泼顽皮，说话爽脆
        timbre: 清亮稚嫩
        pace: 偏快
        pitch: 中高
    dolly:
      display_name: 朵莉
      tts:
        delivery: 天真亲近，带着孩子的好奇
        timbre: 轻柔稚嫩
        pace: 适中
        pitch: 高
  chapters:
    - id: ch01
      title: 马市里的众生相
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 对于没什么可损失的人，马市大概十分有趣。至少，那里的热闹多得看不完。
        - id: ch01-b02
          speaker: narrator
          text: 乡下来的小马排成了长队，身上还带着刚离开沼泽地的那股野气。毛茸茸的威尔士矮马成群结队，个头还不及快乐脚。各式挽马更有好几百匹，有些还把长尾编起来，用鲜红的绳子束好。
        - id: ch01-b03
          speaker: narrator
          text: 也有不少马跟我一样，模样俊秀，血统优良，却因为意外、伤疤、呼吸不畅或别的毛病，只能算作中等马。另一些好马神采奕奕，正值壮年，无论派什么用场都能胜任。马夫牵着缰绳在旁边跑，它们便高高扬蹄，把步态尽情亮给买主看。
        - id: ch01-b04
          speaker: narrator
          text: 可在后边，还站着许多被苦活拖垮的可怜马。它们的前膝弯了，后腿每走一步都向外甩。老马们更是垂头丧气，下唇耷拉着，耳朵沉沉倒向后面，像是活着再没有乐趣，也没有指望。
        - id: ch01-b05
          speaker: narrator
          text: 有的瘦得肋骨根根分明，有的背上、臀上还留着陈年的疮。看见它们，我心里实在难受。我们这些马，谁也不知道自己有一天会不会落到同样的境地。
        - id: ch01-b06
          speaker: narrator
          text: 场上到处有人讨价还价，一会儿抬价，一会儿压价。凭一匹马懂得的那些事，我敢说，这里的谎话和骗局，多得连最聪明的人也数不清。
        - id: ch01-b07
          speaker: narrator
          text: 我和另外两三匹强壮能干的马拴在一起，来看的人很多。那些绅士一瞧见我受过伤的膝盖，就转身离开。卖我的人却赌咒发誓，说我只是在马厩里滑了一跤。
        - id: ch01-b08
          speaker: narrator
          text: 买主们先掰开我的嘴，看过眼睛，再把四条腿从上到下摸一遍，使劲捏捏皮肉，最后还要试我的步子。同样几件事，各人的做法竟相差那么远。有人下手粗鲁随便，仿佛我不过是一块木头。也有人轻轻摸过我的身体，偶尔拍一拍，像是在客气地说，劳驾，让我瞧瞧。我当然会从他们对待我的方式判断他们的为人。
    - id: ch02
      title: 灰眼睛的买主
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 有个买主让我一见就想，要是他肯买下我，我会过得很幸福。他不算绅士，也不像那些嗓门响亮、打扮招摇，却自称绅士的人。他个头偏矮，身体结实，动作非常利落。
        - id: ch02-b02
          speaker: narrator
          text: 他一碰我，我就知道他懂马。他说话轻声和气，灰眼睛里满是亲切爽朗的神情。说来也许奇怪，他身上干净清新的气味也让我喜欢。那里没有我讨厌的陈啤酒和烟草味，倒像是刚从干草棚出来。
        - id: ch02-b03
          speaker: narrator
          text: 他出二十三镑，卖主没答应，他便走了。我伸着脖子一直望着，可转眼就看不见他了。随后来了个冷脸大嗓门的男人，我吓得厉害，生怕他会买我。幸好，那人看过以后也离开了。
        - id: ch02-b04
          speaker: narrator
          text: 又有一两个人只看不买。那个冷脸男人倒回来，再次出到二十三镑。双方把价钱咬得很紧。卖马人明白自己拿不到原先想要的数目，眼看就要让步。这时，灰眼睛的买主回来了。我忍不住把头伸向他，他也亲切地摸了摸我的脸。
        - id: ch02-b05
          speaker: new_master
          text: 老伙计，我看咱俩一定合得来。这匹马，我出二十四镑。
        - id: ch02-b06
          speaker: salesman
          text: 给二十五镑，你就把它牵走。
        - id: ch02-b07
          speaker: new_master
          text: 二十四镑十先令，再多六便士也不加。你到底卖不卖？
        - id: ch02-b08
          speaker: salesman
          text: 成交！这匹马底子好得很，你尽管放心。拿去拉出租马车，准是一笔划算的买卖。
    - id: ch03
      title: 暮色中的伦敦
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 钱当场付清。新主人接过我的笼头，把我带到马市外的一家客店。马鞍和辔头已经备好，他又给我一顿上好的燕麦。我吃着，他始终站在旁边守着，直到我把燕麦吃完。这期间，他一会儿自言自语，一会儿同我讲话。
        - id: ch03-b02
          speaker: narrator
          text: 半小时后，我们向伦敦出发。走过宜人的小巷和乡间道路，我们上了通往伦敦的大道，一路稳稳向前。等到暮色降临，那座大城终于到了。
        - id: ch03-b03
          speaker: narrator
          text: 煤气灯已经亮了。右边是街，左边是街，前后还有街道互相交错，一英里接着一英里。我几乎以为永远也走不完。后来经过一条街，我们来到一长排候客的出租马车旁。主人骑在我背上，快活地朝那边打招呼。
        - id: ch03-b04
          speaker: new_master
          text: 晚安，老板！
        - id: ch03-b05
          speaker: cab_governor
          text: 嘿！买到好马了吗？
        - id: ch03-b06
          speaker: new_master
          text: 我看它不错。
        - id: ch03-b07
          speaker: cab_governor
          text: 那就祝你和它交好运。
        - id: ch03-b08
          speaker: new_master
          text: 谢谢你，老板。
        - id: ch03-b09
          speaker: narrator
          text: 主人骑着我继续走，很快转入一条支路。走到这条路大约一半的地方，我们又拐进一条很窄的街。一边的房屋有些寒酸，另一边看起来都是车房和马厩。
    - id: ch04
      title: 温暖的新家
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 主人在一所房子前勒住我，吹了声口哨。门一下开了，一个年轻女人跑出来，身后跟着一个小姑娘和一个男孩。他刚下马，一家人就热热闹闹地迎了上来。
        - id: ch04-b02
          speaker: new_master
          text: 哈里，来把门打开。妈妈去给咱们拿灯。
        - id: ch04-b03
          speaker: narrator
          text: 一转眼，他们全都围着我，站在小小的马厩院子里。
        - id: ch04-b04
          speaker: dolly
          text: 爸爸，它温顺吗？
        - id: ch04-b05
          speaker: new_master
          text: 温顺极了，朵莉，跟你的小猫一样。过来摸摸它吧。
        - id: ch04-b06
          speaker: narrator
          text: 那只小手立刻在我肩上轻轻拍抚，哪里都敢摸，一点也不害怕。那感觉可真好！
        - id: ch04-b07
          speaker: polly
          text: 你给它擦擦身子吧，我去调一盆麦麸粥。
        - id: ch04-b08
          speaker: new_master
          text: 去吧，波莉，它正需要这个。我知道，你也给我备了一顿美餐。
        - id: ch04-b09
          speaker: harry
          text: 香肠团子，还有苹果酥饼！
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: 大家都被他逗笑了。我被牵进一间舒适的马栏，里面气味清新，还铺着许多干稻草。美美吃过一顿，我躺了下来，心里想着，往后的日子，我一定会很幸福。
