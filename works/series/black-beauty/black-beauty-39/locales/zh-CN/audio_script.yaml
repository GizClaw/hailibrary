audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts: {delivery: 温和真挚，讲述亲历往事时细腻而坦率, timbre: 清朗柔和, pace: 舒缓而自然, pitch: 中低}
    governor:
      display_name: 管事
      tts: {delivery: 厚道直率，谈到马匹受苦时沉痛而诚恳, timbre: 成熟沉稳, pace: 平稳, pitch: 中低}
    seedy_sam:
      display_name: 落魄的萨姆
      tts: {delivery: 疲惫急切，诉说生计时近乎绝望, timbre: 粗哑干涩, pace: 随情绪逐渐加快, pitch: 中低}
    cabman:
      display_name: 车夫
      tts: {delivery: 直白而愤愤不平，带着同病相怜的口吻, timbre: 粗粝清楚, pace: 自然, pitch: 中}
    substitute_driver:
      display_name: 代班车夫
      tts: {delivery: 朴实克制，报信时低沉简短, timbre: 暗哑成熟, pace: 稍慢, pitch: 中低}
  chapters:
    - id: ch01
      title: 候车处的落魄萨姆
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 要说做一匹出租马车的马，我的日子实在很好。杰里既是车夫，也是我的主人。他本来就是个好人。哪怕他不是，为了自己的利益，也会好好待我，不让我干活过头。
        - id: ch01-b02
          speaker: narrator
          text: 可许多马属于经营大批出租马车的车主。车主每天收一笔租金，把车马租给车夫。车夫得先挣够租金，再挣一家人的生活费。马不是他们自己的，他们一心只想着怎样从马身上挣出这两笔钱。有些马因此过着十分悲惨的日子。
        - id: ch01-b03
          speaker: narrator
          text: 那时我不大懂这些事，只是常听候车处的人谈起。管事心地厚道，也爱惜马。要是哪匹马回来时累得快要垮了，或是一眼就能看出受了苛待，他有时会站出来说话。
        - id: ch01-b04
          speaker: narrator
          text: 一天，一个衣衫破旧、满脸凄苦的车夫赶着马回来。大家叫他“落魄的萨姆”。他带来的马已经累得不成样子。
        - id: ch01-b05
          speaker: governor
          text: 看看你和你的马吧。你们不像该来候车处，倒像该去警察局。
        - id: ch01-b06
          speaker: narrator
          text: 萨姆把破毯子往马背上一甩，猛地转身面对管事。开口时，他的声音几乎透着绝望。
        - id: ch01-b07
          speaker: seedy_sam
          text: 警察真要管这件事，就该去管收我们重租的车主，也该管管定得这么低的车费。旺季里，我们许多人每天租一辆车、两匹马，要交十八先令。得先把这笔钱挣出来，往后挣到的第一个便士才归自己。这哪儿只是辛苦！每匹马一天得先挣足九先令，我们才能开始挣生活费。
        - id: ch01-b08
          speaker: seedy_sam
          text: 你知道我说的是实话。马不干活，我们就得挨饿，我和孩子们早就尝过那滋味。我有六个孩子，只有一个能挣点钱。我一天要在候车处守十四到十六个钟头，已经十个还是十二个星期没歇过星期日了。斯金纳只要能不给假，就绝不会给。我要还不算拼命，谁才算？
        - id: ch01-b09
          speaker: seedy_sam
          text: 我需要一件暖和的大衣，也需要一件防水外套。可家里这么多张嘴等着吃饭，哪儿还有钱买？上星期为了把钱交给斯金纳，我把钟都当了。这辈子怕是再也赎不回来。
        - id: ch01-b10
          speaker: narrator
          text: 几个车夫围在旁边，一面点头，一面说萨姆讲得对。可萨姆的话还没说完。
    - id: ch02
      title: 十八英里与六先令
      blocks:
        - id: ch02-b01
          speaker: seedy_sam
          text: 你们有自己的车马，或是替好车主赶车，还有机会把日子过好，也有机会凭良心做事。我没有。四英里以内，过了头一英里，每英里最多只能收六便士。今天早晨，我跑了整整六英里，只收到三先令。回程揽不到客，马只好空跑回来。它一共跑了十二英里，我才得三先令。
        - id: ch02-b02
          speaker: seedy_sam
          text: 后来又接了一趟三英里的生意。客人的包裹和箱子多得很。要是放在车外，本来能多收好些个两便士。可客人把前座能塞的地方全塞满了，只把三个沉箱子放在车顶。行李收六便士，车费是一先令六便士，回程又挣一先令。
        - id: ch02-b03
          speaker: seedy_sam
          text: 你们算算，马已经跑了十八英里，我总共才进账六先令。这匹马还得再挣三先令，下午那匹马还得挣九先令，之后才轮得到我挣第一个便士。日子不见得天天都这样糟，可这样的事也常有。
        - id: ch02-b04
          speaker: seedy_sam
          text: 所以，叫车夫别让马过度劳累，简直是在拿人取笑。牲口真累垮了，除了用鞭子逼它继续抬腿，就没有别的办法。你根本没得选。妻子儿女总得排在马前头。这件事该由车主管，我们管不了。我不是为了痛快才虐待马，你们谁也不能说我是那种人。
        - id: ch02-b05
          speaker: seedy_sam
          text: 这世道总有哪里不对。一天也歇不成，也没有一个钟头能安静陪陪妻子孩子。我才四十五岁，却常觉得自己老了。那些体面人动不动就疑心我们骗人、多收车费。他们把钱袋攥在手里，一个便士一个便士地数，还拿看扒手的眼神看我们。
        - id: ch02-b06
          speaker: seedy_sam
          text: 真该让他们也坐上我的车夫座，每天熬十六个钟头，风吹雨打都不能停。让他们试试既要挣自家的生活费，还得替车主挣十八先令。那样，他们就不会死活不肯多给六便士，也不会把所有行李都硬塞进车里。是有人偶尔会给一笔大方的小费，要不然我们根本活不下去。可那种钱能指望吗？
        - id: ch02-b07
          speaker: narrator
          text: 围在旁边的车夫都很赞同这番话。其中一个人忍不住开了口。
        - id: ch02-b08
          speaker: cabman
          text: 这日子苦得叫人绝望。一个人有时做错了事，也没什么可奇怪的。就算他多喝了一杯，谁又有资格骂他？
        - id: ch02-b09
          speaker: narrator
          text: 杰里一直没有插话，可我从没见过他的神情这么悲伤。管事一直把两只手插在口袋里。听到这里，他从帽子里取出手帕，擦了擦额头。
        - id: ch02-b10
          speaker: governor
          text: 萨姆，你把我说服了。你说的句句是实话。我不会再拿警察局的话责怪你了。刚才是那匹马眼里的神情叫我忍不住开口。人活得苦，牲口也活得苦。谁能把这事改好，我不知道。
        - id: ch02-b11
          speaker: governor
          text: 不过，你总可以告诉那匹可怜的马，你这样拿它出气，心里也不好受。有时候，我们能给这些可怜牲口的，只有一句好话。可它们能听懂多少，真会叫人吃惊。
    - id: ch03
      title: 给我们的警钟
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这番谈话过去几天。一天早晨，一个生面孔赶着萨姆的车来到候车处。
        - id: ch03-b02
          speaker: cabman
          text: 喂，落魄的萨姆出什么事了？
        - id: ch03-b03
          speaker: substitute_driver
          text: 他病倒在床上了。昨晚他在车场里发病，几乎爬不回家。今早他妻子叫一个男孩来传话，说他父亲发高烧，起不了床，所以我来替他。
        - id: ch03-b04
          speaker: narrator
          text: 第二天早晨，来的还是这个人。
        - id: ch03-b05
          speaker: governor
          text: 萨姆怎么样了？
        - id: ch03-b06
          speaker: substitute_driver
          text: 他已经走了。
        - id: ch03-b07
          speaker: governor
          text: 什么，走了？你不是说他死了吧？
          emotion: surprised
        - id: ch03-b08
          speaker: substitute_driver
          text: 就那么熄了气。今天凌晨四点死的。昨天一整天他都在说胡话，反反复复念叨斯金纳，还念叨没有星期日休息。他最后说的是：“我从来没歇过一个星期日。”
        - id: ch03-b09
          speaker: narrator
          text: 一时间，谁也没有出声。过了一会儿，管事开口了。
        - id: ch03-b10
          speaker: governor
          text: 伙计们，我告诉你们，萨姆的事是在给我们敲警钟。
