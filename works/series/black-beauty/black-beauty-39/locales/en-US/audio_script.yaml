  chapters:
    - id: ch01
      title: Seedy Sam at the Stand
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            For a cab horse, I was very fortunate. My driver owned me, so treating me well and not working me too hard was in his own interest. He would have been kind to me anyway. Many other horses belonged to large cab owners, who rented them to drivers for a set price each day. Since those drivers did not own the horses, they thought first about earning enough to pay the owner, then enough to live on. Some of their horses had a dreadful life.
        - id: ch01-b02
          speaker: narrator
          text: >-
            I understood little about it then, but the drivers often discussed it at the stand. Our governor was kindhearted and fond of horses. When a horse came in exhausted or badly treated, he sometimes spoke up.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One day, a shabby driver known as Seedy Sam arrived with a horse that looked completely worn out.
        - id: ch01-b04
          speaker: governor
          text: >-
            You and that horse look as if you belong at the police station, not on this cabstand.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Sam threw his ragged rug over the horse. Then he turned squarely toward the governor. When he answered, he sounded almost desperate.
        - id: ch01-b06
          speaker: seedy_sam
          text: >-
            If the police should go after anyone, it ought to be the owners who charge us so much, or the people who set the fares so low. In the busy season, many of us pay eighteen shillings a day for a cab and two horses. We have to earn every bit of that before we make one penny for ourselves. That's more than hard work. Each horse has to bring in nine shillings before we can even start earning our living.
        - id: ch01-b07
          speaker: seedy_sam
          text: >-
            You know it's true. If the horses don't work, we starve. My children and I know what hunger feels like. I've got six children, and only one of them earns anything. I spend fourteen or sixteen hours a day on the stand. I haven't had a Sunday off in ten or twelve weeks. You know Skinner avoids giving us a day off whenever he can. If that isn't hard work, what is?
        - id: ch01-b08
          speaker: seedy_sam
          text: >-
            I need a warm coat and a raincoat, but how can I buy them with so many mouths to feed? Last week I pawned my clock so I could pay Skinner. I'll never get it back.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Several drivers gathered around. They nodded and agreed that Sam was right. But Sam had more to say.
        - id: ch01-b10
          speakers: [cabman_1, cabman_2, cabman_3]
          ensemble: chorus
          text: >-
            He's right. Every word of it.
    - id: ch02
      title: Eighteen Miles and Six Shillings
      blocks:
        - id: ch02-b01
          speaker: seedy_sam
          text: >-
            Those of you who own your horses and cabs, or who work for decent owners, have a chance to get ahead and do what's right. I don't. After the first mile, we're allowed to charge only sixpence a mile inside the four-mile limit. This morning I took someone six full miles and earned only three shillings. There was no passenger coming back, so the horse had to travel all six miles home again. That's twelve miles for the horse and three shillings for me.
        - id: ch02-b02
          speaker: seedy_sam
          text: >-
            Then I got a three-mile fare. Those passengers had enough bags and boxes to earn plenty of extra twopences if they'd put them outside. You know what people do instead. They pile everything they can onto the front seat inside, then put only the heaviest boxes on top. Three heavy boxes brought me sixpence. The fare was one shilling and sixpence, and on the return trip I made another shilling.
        - id: ch02-b03
          speaker: seedy_sam
          text: >-
            Add it up. The horse has gone eighteen miles, and I've earned six shillings. That horse still has to make three more shillings, and the afternoon horse must make another nine, before a single penny belongs to me. It isn't always that bad, but you know it often is.
        - id: ch02-b04
          speaker: seedy_sam
          text: >-
            So don't tell a man not to overwork his horse. When the poor animal is completely tired, only the whip keeps his legs moving. What choice do you have? Your wife and children must come before the horse. The owners need to put that right, because we can't. I don't mistreat a horse because I enjoy it. Not one of you can say I do.
        - id: ch02-b05
          speaker: seedy_sam
          text: >-
            Something is wrong somewhere. We never get a day of rest, or even a quiet hour with our wives and children. I'm only forty-five, but I often feel old. And some of the fine passengers are so quick to suspect us of cheating them. They stand there with their purses out, counting every penny, staring at us as if we're pickpockets.
        - id: ch02-b06
          speaker: seedy_sam
          text: >-
            I wish some of them had to sit on my cab box for sixteen hours in every kind of weather. Let them try to earn their own living and eighteen shillings besides. Maybe then they wouldn't be so careful never to give us one extra sixpence, or so eager to stuff every piece of luggage inside. Yes, a few people give us a generous tip now and then. We couldn't live otherwise. But you can't count on it.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The drivers around Sam strongly approved of what he had said. One of them spoke up.
        - id: ch02-b08
          speaker: cabman_1
          text: >-
            It's terribly hard. You can hardly wonder when a man does something wrong now and then. And if he drinks a little too much, who's got the right to lecture him?
        - id: ch02-b09
          speaker: narrator
          text: >-
            Jerry had said nothing through all of this, but I had never seen him look so sad. The governor had been standing with both hands in his pockets. Now he took the handkerchief from his hat and wiped his forehead.
        - id: ch02-b10
          speaker: governor
          text: >-
            You've beaten me, Sam, because every word is true. I won't bring up the police again. It was the look in that horse's eye that got to me. Life is hard for the man and hard for the animal, and I don't know who can set it right.
        - id: ch02-b11
          speaker: governor
          text: >-
            Still, you could tell the poor horse you're sorry you had to take it out on him. Sometimes a kind word is all we can give these poor creatures. It's amazing how much they understand.
    - id: ch03
      title: A Warning for Us
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            A few mornings after that conversation, a new driver arrived at the stand with Sam's cab.
        - id: ch03-b02
          speaker: cabman_2
          text: >-
            Hello! What's happened to Seedy Sam?
        - id: ch03-b03
          speaker: substitute_driver
          text: >-
            He's sick in bed. He was taken ill in the yard last night and could barely crawl home. This morning, his wife sent a boy to say his father had a high fever and couldn't get up. So I'm taking his place.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The next morning, the same driver returned.
        - id: ch03-b05
          speaker: governor
          text: >-
            How is Sam doing?
        - id: ch03-b06
          speaker: substitute_driver
          text: >-
            He's gone.
        - id: ch03-b07
          speaker: governor
          emotion: surprised
          text: >-
            Gone? You don't mean he's dead.
        - id: ch03-b08
          speaker: substitute_driver
          text: >-
            He just went out like a candle. He died at four this morning. All day yesterday, he was raving about Skinner and never getting Sundays off. His last words were, “I never had a Sunday's rest.”
        - id: ch03-b09
          speaker: narrator
          text: >-
            For a while, no one said a word. Then the governor spoke.
        - id: ch03-b10
          speaker: governor
          text: >-
            I'll tell you this, mates. Sam's death is a warning for all of us.
