audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述成长经历时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    ginger:
      display_name: 金吉尔
      tts:
        delivery: 坦率而敏感，回忆受伤往事时带着压抑不住的烈性
        timbre: 清亮而略显沙哑
        pace: 自然，情绪激动时稍快
        pitch: 中
    merrylegs:
      display_name: 快乐脚
      tts:
        delivery: 活泼自信，热心健谈，偶尔摆出老资格的神气
        timbre: 轻快明亮
        pace: 稍快而灵动
        pitch: 中高
    sir_oliver:
      display_name: 奥利弗爵士
      tts:
        delivery: 温厚而刚烈，谈及不公时沉痛有力
        timbre: 苍老浑厚
        pace: 沉稳，激动时略有顿挫
        pitch: 低
    justice:
      display_name: 正义
      tts:
        delivery: 冷静理智，说话从容而条理清楚
        timbre: 平和坚实
        pace: 不疾不徐
        pitch: 中低
  chapters:
    - id: ch01
      title: 骑马出游
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 金吉尔和我都不是寻常那种高大的车马。我们身上有更多赛马的血统，约莫十五掌半高，既适合拉车，也适合供人骑乘。
        - id: ch01-b02
          speaker: narrator
          text: 主人常说，无论是马还是人，只会做一件事，他都不喜欢。他不打算去伦敦的公园里炫耀，所以更喜欢灵活又有用的马。
        - id: ch01-b03
          speaker: narrator
          text: 我们最高兴的，就是备好马鞍，陪一家人骑马出游。主人骑金吉尔，女主人骑我，两位小姐分别骑奥利弗爵士和快乐脚。大家一同小跑，一同奔驰，我们每次都兴高采烈。
        - id: ch01-b04
          speaker: narrator
          text: 而我最有福气，因为我总是驮着女主人。她身子轻，声音甜美，握缰绳的手也轻柔极了。我几乎感觉不到缰绳，就知道她想往哪里走。
        - id: ch01-b05
          speaker: narrator
          text: 要是人们知道，一双轻柔的手能让马多么舒服，还能保住马嘴的灵敏和温顺的脾气，他们一定不会总是猛扯乱拽缰绳。
        - id: ch01-b06
          speaker: narrator
          text: 马嘴很娇嫩。只要没被粗暴无知的对待弄伤磨硬，赶车人的手稍微一动，我们立刻就能感觉到，也知道该怎么做。
        - id: ch01-b07
          speaker: narrator
          text: 我的嘴从没受过损伤。我想，女主人喜欢骑我而不是金吉尔，原因就在这里。其实金吉尔的步法一点也不比我差，她自己也常为这件事不平。
        - id: ch01-b08
          speaker: ginger
          text: 都怪我当初没有受过好调教，还怪伦敦那副勒人的嚼子。不然，我的嘴也会像你的一样灵敏。
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: 每逢这时候，年老的奥利弗爵士都会安慰她。
        - id: ch01-b10
          speaker: sir_oliver
          text: 好啦，别为这件事难过。主人那么高大沉重，你驮得动他，步子还那么轻快活泼，这才是最大的体面。不能驮女主人，也不用垂头丧气。只要人家待咱们和善，咱们遇上什么就接受什么，知足又情愿地把事情做好。
          emotion: calm
    - id: ch02
      title: 奥利弗爵士的短尾巴
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我一直不明白，奥利弗爵士的尾巴为什么那么短。它只有六七英寸长，末端垂着一小撮毛。一天，我们在果园里休息，我终于问他，是哪场意外让他失去了尾巴。
        - id: ch02-b02
          speaker: sir_oliver
          text: 意外？那根本不是意外！那是一件残忍、可耻又冷酷的事！
          emotion: angry
        - id: ch02-b03
          speaker: sir_oliver
          text: 我年轻时被带到一个专做这种事的地方。他们把我牢牢捆住，叫我一下也动不了。然后，他们割掉了我又长又漂亮的尾巴。刀穿过皮肉，连骨头也割断了。他们就这样把它拿走了。
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: 我听得心里发冷，忍不住说，这实在太可怕了。
        - id: ch02-b05
          speaker: sir_oliver
          text: 是啊，太可怕了。那不只是疼，虽然伤口疼得厉害，还疼了很久。那也不只是受辱，虽然他们拿走了我身上最美的东西，已经够糟了。
          emotion: sad
        - id: ch02-b06
          speaker: sir_oliver
          text: 更要命的是，从那以后，我要拿什么赶走身子两侧和后腿上的苍蝇？你们有尾巴，随手一甩就把苍蝇赶跑，根本不用多想。
        - id: ch02-b07
          speaker: sir_oliver
          text: 可你们不知道，苍蝇落满身上，一口又一口地叮，你却没有任何东西能把它们抽走，那有多折磨。这个伤害要跟我一辈子，失去的尾巴也一辈子回不来。幸好，如今人们不再这样做了。
          emotion: sad
        - id: ch02-b08
          speaker: ginger
          text: 那么，他们当初为什么要割掉马的尾巴？
        - id: ch02-b09
          speaker: narrator
          text: 奥利弗爵士重重跺了一下蹄子。
        - id: ch02-b10
          speaker: sir_oliver
          text: 为了时髦！在我年轻的时候，凡是出身体面的幼马，尾巴都要这样被截掉。好像创造我们的上帝反而不知道，我们需要什么，又怎样才最好看。
          emotion: angry
        - id: ch02-b11
          speaker: ginger
          text: 这么说，他们用那些可怕的嚼子把我们的头高高勒住，也是为了时髦。我在伦敦可被那东西折磨惨了。
          emotion: angry
    - id: ch03
      title: 为了时髦
      blocks:
        - id: ch03-b01
          speaker: sir_oliver
          text: 当然是为了时髦。依我看，时髦是世上最邪恶的东西之一。看看人们怎样对狗吧。为了让狗看起来勇猛，他们截掉狗的尾巴。为了让狗显得机警，他们又把漂亮的小耳朵剪成尖尖的样子。
          emotion: angry
        - id: ch03-b02
          speaker: sir_oliver
          text: 我从前有个很亲近的朋友，是一只名叫斯凯的棕色㹴犬。她非常喜欢我，从不肯睡在我的马栏外面。她把窝安在食槽下面，还在那里生了五只漂亮的小狗。
        - id: ch03-b03
          speaker: sir_oliver
          text: 因为品种名贵，没有哪只小狗被淹死。斯凯高兴极了。后来，小狗们睁开眼，开始到处爬，那景象真招人喜欢。
        - id: ch03-b04
          speaker: sir_oliver
          text: 可有一天，一个男人把小狗全抱走了。我还以为，他只是怕我不小心踩到它们。到了晚上，斯凯把孩子们一只一只衔了回来，我才知道自己想错了。
        - id: ch03-b05
          speaker: sir_oliver
          text: 那些小狗已经不再快活了。它们流着血，叫得十分凄惨。每一只的尾巴都被割掉一截，耳朵上柔软漂亮的耳瓣也全被剪掉了。
          emotion: sad
        - id: ch03-b06
          speaker: sir_oliver
          text: 可怜的斯凯不停地舔着孩子，急得不知怎么办。那一幕，我从来没有忘记。伤口后来愈合了，小狗也忘了疼。可是原本保护耳朵娇嫩部位、不让尘土进去的柔软耳瓣，却永远回不来了。
          emotion: sad
        - id: ch03-b07
          speaker: sir_oliver
          text: 他们怎么不把自己孩子的耳朵也剪尖，好让孩子显得机警？怎么不割掉孩子的鼻尖，好让孩子显得勇猛？两种做法不是一样聪明吗？他们凭什么折磨上帝创造的生灵，还把它们弄得残缺不全？
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: 奥利弗爵士一向温顺，却有一副刚烈的性子。他说的这些事，我从来没有听过。它们如此可怕，我心里第一次对人类生出一股苦涩的怨恨。
        - id: ch03-b09
          speaker: narrator
          text: 金吉尔更是激动。她猛地昂起头，双眼发亮，鼻孔张得大大的。
        - id: ch03-b10
          speaker: ginger
          text: 人类既野蛮，又愚蠢！
          emotion: angry
    - id: ch04
      title: 快乐脚让大家平静下来
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 快乐脚刚从老苹果树那边走过来。方才，他一直拿身子蹭一根低垂的树枝。
        - id: ch04-b02
          speaker: merrylegs
          text: 是谁在说愚蠢？我听见有人说这个词了。我看，这可不是什么好话。
        - id: ch04-b03
          speaker: ginger
          text: 遇上坏东西，当然就该用坏话来说。
        - id: ch04-b04
          speaker: narrator
          text: 金吉尔把奥利弗爵士说的事情告诉了他。快乐脚听完，声音也低落下来。
        - id: ch04-b05
          speaker: merrylegs
          text: 他说的全是真的。我在最早住过的地方，一次又一次看见人们这样对狗。不过，咱们别在这里谈这些了。
          emotion: sad
        - id: ch04-b06
          speaker: merrylegs
          text: 主人、约翰和詹姆斯一直对咱们很好。在这里说人类的坏话，不太公道，也显得咱们不知感恩。世上还有别的好主人、好马夫呢。当然，咱们家的还是最好。
        - id: ch04-b07
          speaker: narrator
          text: 善良的小快乐脚说了这番明白又有道理的话。我们知道他说得对，便渐渐消了气。奥利弗爵士尤其听得进去，因为他深深爱着主人。
        - id: ch04-b08
          speaker: narrator
          text: 为了换个话题，我问大家，马眼罩到底有什么用。那匹叫正义的杂色矮脚马也在旁边。
        - id: ch04-b09
          speaker: sir_oliver
          text: 没用。它一点用也没有。
        - id: ch04-b10
          speaker: justice
          text: 人们认为，眼罩能防止马突然受惊闪避，或惊慌乱窜，这样便不会造成事故。
        - id: ch04-b11
          speaker: narrator
          text: 我听了更不明白。如果眼罩真能避免事故，为什么骑乘的马不用戴，尤其是小姐们骑的马？
        - id: ch04-b12
          speaker: justice
          text: 没有道理，除了时髦。人们说，马要是看见自己拉的货车或马车的轮子从身后跟来，一定会吓得逃跑。可我们被人骑着走过拥挤的街道时，明明到处都看得见车轮。
        - id: ch04-b13
          speaker: justice
          text: 有时车轮靠得太近，的确叫马不舒服。不过我们不会逃跑，因为我们看惯了，也明白那是什么。要是从来不戴眼罩，我们就不会需要它。我们能看清周围有什么，知道每样东西是什么，反而不容易害怕。
        - id: ch04-b14
          speaker: justice
          text: 戴着眼罩，只能瞧见一些零碎的东西，又弄不懂它们是什么，那才容易受惊。当然，有些马胆子小，或小时候受过伤、受过惊，眼罩也许对它们有好处。可我从来不胆小，所以没法断定。
    - id: ch05
      title: 黑夜里的眼罩
      blocks:
        - id: ch05-b01
          speaker: sir_oliver
          text: 依我看，夜里戴眼罩尤其危险。马在黑暗里比人看得清楚。要是马能充分使用自己的眼睛，许多事故根本不会发生。
        - id: ch05-b02
          speaker: sir_oliver
          text: 几年前的一个黑夜，两匹马拉着一辆灵车回程。到了斯派洛农夫家旁边，路边紧挨着一个池塘。车轮走得太靠边，灵车翻进水里，两匹马都淹死了，车夫也差点没能逃出来。
          emotion: sad
        - id: ch05-b03
          speaker: sir_oliver
          text: 出事以后，人们当然在池塘边装上了一道结实的白栏杆，一眼就能看见。可那两匹马若不是一半视野被挡住，自己就会离路边远些，根本不会连车一起落进水里，那场事故也不会发生。
        - id: ch05-b04
          speaker: sir_oliver
          text: 你来以前，咱们主人的马车也翻过。人们说，如果左边的车灯没有熄灭，约翰就能看见修路工留下的大坑。这话也许没错。
        - id: ch05-b05
          speaker: sir_oliver
          text: 可老科林要是没戴眼罩，不管有没有灯，都会发现那个坑。他那么有经验，绝不会往危险里闯。结果他受了重伤，马车也摔坏了。至于约翰怎么逃过一劫，谁也说不清。
        - id: ch05-b06
          speaker: narrator
          text: 金吉尔卷起鼻翼，讽刺起那些自以为聪明的人。
        - id: ch05-b07
          speaker: ginger
          text: 他们最好下道命令，叫以后所有小马驹出生时，眼睛都长在前额正中央，别再长在头的两边。他们总以为自己比大自然聪明，还能把上帝造的东西修得更好。
          emotion: angry
        - id: ch05-b08
          speaker: narrator
          text: 大家的火气眼看又要上来，快乐脚却抬起那张聪明的小脸，说自己知道一个秘密。
        - id: ch05-b09
          speaker: merrylegs
          text: 我相信约翰也不赞成眼罩。有一天，我听见他和主人谈过这件事。
        - id: ch05-b10
          speaker: merrylegs
          text: 主人说，如果马已经习惯戴眼罩，有些时候突然摘掉，可能会有危险。约翰说，所有小马从受训开始就不戴眼罩，才是好办法。有些外国就是这样做的。
        - id: ch05-b11
          speaker: merrylegs
          text: 所以，咱们都高兴起来吧！跑到果园另一头去。我想，风吹落了一些苹果。与其留给蛞蝓，还不如让咱们吃掉。
        - id: ch05-b12
          speaker: narrator
          text: 谁也拒绝不了快乐脚。我们结束了这场长谈，跑去嚼散落在草地上的苹果。那些苹果很甜，大家的心情也重新好了起来。
