audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    ginger:
      display_name: Ginger
      tts:
        delivery: spirited, candid, and emotionally guarded
        timbre: rich and slightly rough
        pace: moderately brisk
        pitch: medium
    merrylegs:
      display_name: Merrylegs
      tts:
        delivery: lively, shrewd, and warmly self-assured
        timbre: bright and sturdy
        pace: moderately brisk
        pitch: medium-high
    sir_oliver:
      display_name: Sir Oliver
      tts:
        delivery: dignified, kindly, and fiery when stirred
        timbre: deep and seasoned
        pace: unhurried
        pitch: low
    justice:
      display_name: Justice
      tts:
        delivery: calm, practical, and thoughtful
        timbre: steady and mellow
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Riding Together
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Ginger and I weren't built like the usual tall carriage horses. We had more racing blood and stood about fifteen and a half hands high. That made us just as useful under saddle as we were in harness. Our master often said he had little use for a horse, or a man, who could do only one thing. He wasn't interested in showing off in the London parks. He wanted horses that were active and useful.

            Nothing pleased us more than being saddled for a riding party. The master rode Ginger, the mistress rode me, and the young ladies rode Sir Oliver and Merrylegs. Trotting and cantering together always lifted our spirits.

            I had the best place of all, because I carried the mistress. She was light, her voice was sweet, and her hand on the rein was so gentle that I could follow her guidance almost without feeling it.
        - id: ch01-b02
          speaker: narrator
          text: >-
            If only people understood what a comfort that light hand is to a horse. It helps us keep a sensitive mouth and an even temper. Then perhaps they wouldn't jerk, drag, and pull the reins the way so many do.

            A horse's mouth is very tender unless harsh or ignorant treatment has made it hard. We can feel the smallest movement of a driver's hand and know at once what we're being asked to do. My mouth had never been damaged. I think that was why the mistress chose me instead of Ginger, even though Ginger moved every bit as well as I did.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Ginger often envied me. She said the way she'd been broken in, along with the gag bit she'd worn in London, had kept her mouth from being as good as mine. Whenever she worried over it, old Sir Oliver tried to comfort her.
        - id: ch01-b04
          speaker: sir_oliver
          emotion: calm
          text: >-
            Now, now, don't upset yourself. You have the greater honor. A mare who can carry a tall man of our master's weight and still move with all your spring and spirit has no reason to hang her head because she doesn't carry the lady. We horses have to take life as it comes. As long as we're treated kindly, we should stay willing and content.
    - id: ch02
      title: Sir Oliver's Tail
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            I'd often wondered why Sir Oliver's tail was so short. It was only six or seven inches long, with a little tassel of hair at the end. One holiday in the orchard, I finally worked up the courage to ask what accident had taken the rest of it. He gave a fierce snort and looked at me before he answered.
        - id: ch02-b02
          speaker: sir_oliver
          emotion: angry
          text: >-
            Accident? It wasn't an accident! It was cruel, shameful, and cold-blooded. When I was young, they took me to a place where such things were done. They tied me so tightly that I couldn't move. Then they cut off my long, beautiful tail, straight through flesh and bone, and carried it away.
        - id: ch02-b03
          speaker: narrator
          text: >-
            I cried out that it was dreadful.
        - id: ch02-b04
          speaker: sir_oliver
          emotion: angry
          text: >-
            Dreadful? Yes, it was. And it wasn't only the pain, though that was terrible and lasted a long time. It wasn't only the shame of losing my finest ornament, bad as that was. Afterward, how was I supposed to brush flies from my sides and hind legs?

            You two flick them away without even thinking. You can't know the torment of having flies land on you and sting again and again, with nothing in the world to drive them off. It was a lifelong wrong and a lifelong loss. Thank heaven they don't do it now.
        - id: ch02-b05
          speaker: ginger
          text: >-
            Why did they ever do it?
        - id: ch02-b06
          speaker: sir_oliver
          emotion: angry
          text: >-
            Fashion! That's why. In my day, nearly every well-bred young horse had his tail cut off in that disgraceful way. It was as if the good God who made us didn't know what we needed or what looked best.
        - id: ch02-b07
          speaker: ginger
          text: >-
            Then I suppose fashion is why they strapped my head up with those horrible bits that tortured me in London.
        - id: ch02-b08
          speaker: sir_oliver
          text: >-
            Of course it is. I think fashion is one of the wickedest things in the world. Just look at what people do to dogs. They cut their tails to make them look brave, then trim their pretty ears into points to make them look sharp.

            I once had a dear friend, a brown terrier named Skye. She loved me so much that she always slept in my stall, beneath the manger. She had five beautiful puppies there. Because they were valuable, not one was drowned. Skye was so proud of them. Once their eyes opened and they began crawling around, they were lovely to watch.

            Then one day, a man carried all five away. I thought he was worried that I might step on them. But that evening, poor Skye brought them back in her mouth, one at a time. They weren't the happy little puppies she'd sent away. They were bleeding and crying. Part of every tail had been cut off, along with the soft flap of each little ear.

            Their mother licked them and worried over them, poor thing. I've never forgotten it. The puppies healed, and in time they forgot the pain. But those soft flaps, meant to guard the tender inside of their ears from dust and injury, were gone forever. Nothing could bring them back.

            Why don't people point their own children's ears to make them look sharp? Why not cut off the ends of their noses to make them look brave? One makes as much sense as the other. What right do they have to torment and disfigure God's creatures?
    - id: ch03
      title: Good Men and Bad Things
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Sir Oliver was gentle by nature, but there was fire in the old horse. Everything he'd told me was new and terrible. For the first time, I felt bitterness toward people rising inside me.

            Ginger was even more worked up. She tossed her head, her eyes flashed, and her nostrils opened wide. She declared that men were both brutes and blockheads, and she meant every word.
        - id: ch03-b02
          speaker: merrylegs
          text: >-
            Who's talking about blockheads? I think that's a bad word.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Merrylegs had just come over from the old apple tree, where he'd been rubbing against a low branch. He repeated his question about blockheads. Ginger answered him, then told him everything Sir Oliver had said.
        - id: ch03-b04
          speaker: ginger
          emotion: angry
          text: >-
            Bad words are meant for bad things.
        - id: ch03-b05
          speaker: merrylegs
          emotion: sad
          text: >-
            It's all true. I saw people do that to dogs again and again where I first lived. But let's not talk about it here. Our master, John, and James are always good to us. Speaking against people in a place like this doesn't feel fair or grateful.

            There are other good masters and good grooms, too. Though ours are the best, of course.
        - id: ch03-b06
          speaker: narrator
          text: >-
            We all knew the wise little fellow was right, and his words cooled us down. They especially settled Sir Oliver, who dearly loved his master. I changed the subject and asked whether anyone could tell me what blinkers were good for.
        - id: ch03-b07
          speaker: sir_oliver
          text: >-
            No, because they aren't good for anything.
        - id: ch03-b08
          speaker: justice
          text: >-
            People say blinkers keep horses from shying or starting, getting frightened, and causing accidents.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Then I asked why riding horses didn't wear them, especially horses ridden by ladies.
        - id: ch03-b10
          speaker: justice
          text: >-
            There's no reason except fashion. People claim a horse would panic if he saw the wheels of his own cart or carriage coming up behind him. Yet a riding horse sees wheels all around him on a crowded street.

            I admit they sometimes come closer than we'd like, but we don't run away. We're used to them, and we understand what they are. If no one ever put blinkers on us, we wouldn't need them. We'd see the whole thing and know what it was. That would frighten us far less than catching little glimpses of things we can't understand.

            Now, a nervous horse who was injured or badly frightened when he was young might do better with blinkers. I've never been nervous myself, so I can't say.
    - id: ch04
      title: Seeing the Danger
      blocks:
        - id: ch04-b01
          speaker: sir_oliver
          text: >-
            I say blinkers are dangerous at night. Horses see much better in the dark than men do. Many accidents could have been avoided if horses had been allowed to use their eyes fully.

            I remember a hearse drawn by two horses on its way back one dark night. Near Farmer Sparrow's house, where the pond lies close to the road, its wheels went too near the edge. The hearse overturned into the water. Both horses drowned, and the driver barely escaped.

            Afterward, they put up a strong white rail that was easy to see. But if those horses hadn't been partly blinded, they would have kept away from the edge themselves. The accident would never have happened.

            Then there was the time our master's carriage overturned, before you came here. People said John would have seen the enormous hole left by the road workers if the lamp on the left hadn't gone out. Perhaps he would. But old Colin would have seen it with or without a lamp if he hadn't been wearing blinkers. He was far too sensible to run straight into danger.

            Instead, Colin was badly injured, the carriage was broken, and no one knew how John escaped.
        - id: ch04-b02
          speaker: ginger
          text: >-
            Since men are so wise, perhaps they should order every foal to be born with both eyes in the middle of its forehead instead of on the sides. They're always trying to improve nature and repair what God has made.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Ginger curled her nostril as she spoke. Feelings were starting to run high again. Before the talk could turn bitter, Merrylegs lifted his clever little face.
        - id: ch04-b04
          speaker: merrylegs
          text: >-
            I'll tell you a secret. I don't think John approves of blinkers. One day, I heard him talking about them with the master.

            The master said that once horses were used to blinkers, taking them off could sometimes be dangerous. John said it would be better if all young horses were trained without them, the way they are in some other countries.

            So let's cheer up and race to the far end of the orchard. I think the wind has knocked down some apples. We might as well eat them before the slugs do.
        - id: ch04-b05
          speaker: narrator
          text: >-
            No one could resist Merrylegs. We ended our long talk, lifted our spirits, and munched the very sweet apples scattered across the grass.
