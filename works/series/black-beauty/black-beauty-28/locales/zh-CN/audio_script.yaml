audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    careless_driver:
      display_name: 粗心的车夫
      tts:
        delivery: 自以为是而漫不经心，抱怨时粗鲁急躁
        timbre: 粗厚松散
        pace: 偏快
        pitch: 中
    farmer:
      display_name: 农夫
      tts:
        delivery: 热心直率，谈到马匹时笃定而利落
        timbre: 朴实厚实
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 各式各样的坏车夫
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 以前驾车的人，至少都知道该怎么赶马。可到了这间车行，我才见识了车夫能有多少种糟糕的赶法，又有多少人其实根本不懂马。
        - id: ch01-b02
          speaker: narrator
          text: 我成了一匹出租马。只要有人想雇车，车行就可能把我租出去。我的脾气温顺，做事也靠得住。也正因为这样，不会驾车的人似乎比租别的马更常租到我。他们赶车的花样太多，我只挑几种来说。
        - id: ch01-b03
          speaker: narrator
          text: 有些人把缰绳勒得死紧。他们好像觉得，手上使的力气越大，车就赶得越好。他们一直扯着马嘴，一点活动的余地也不给，还总说要把马控制住，把马支撑起来。听起来，倒像马自己不会站稳一样。
        - id: ch01-b04
          speaker: narrator
          text: 有些可怜的马早已累垮，嘴也被这类人勒得又硬又麻，或许真得靠缰绳借一点力。可一匹马若能靠自己的腿站稳，嘴又灵敏，很容易引导，这么勒着他，只会叫他受罪，而且实在愚蠢。
        - id: ch01-b05
          speaker: narrator
          text: 另一种人恰好相反。他们把缰绳松松地搭在马背上，自己的手懒洋洋地搁在膝头。要是突然出了事，他们当然管不住马。马一受惊，一起步，或是一绊，他们就全没了办法，既帮不了马，也救不了自己。等他们能做点什么，祸已经闯下了。
        - id: ch01-b06
          speaker: narrator
          text: 我不大会突然乱跑，也很少绊倒，所以缰绳松一点，本来不妨事。可我一向要靠车夫指路，也需要他的鼓励。下坡时，还是能感觉到缰绳轻轻托着才好。至少，这能叫我知道车夫没有睡着。
        - id: ch01-b07
          speaker: narrator
          text: 懒散的赶法还会把马带坏，让他越来越散漫，甚至学会偷懒。等他换了主人，这些毛病往往要靠鞭子才能改掉，总免不了不同程度的疼痛和麻烦。戈登先生总要我们走出最好的步态，也守住最好的规矩。他说，任由马养成坏习惯，就像惯坏孩子一样残忍。最后受苦的，还是他们自己。
    - id: ch02
      title: 蹄子里的石头
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这些车夫通常不只是赶车马虎。他们什么都肯留意，偏偏不肯留意自己的马。有一天，其中一人驾着轻便四轮马车带我出门，后面坐着一位太太和两个孩子。
        - id: ch02-b02
          speaker: narrator
          text: 刚一出发，他就乱甩缰绳。我明明已经好好走起来了，他还没来由地挥鞭抽了我几下。那时路上有不少地方正在修整。就连没有刚铺上石子的路段，也到处散着松动的碎石。
        - id: ch02-b03
          speaker: narrator
          text: 车夫只顾和太太、孩子说笑，一会儿谈右边的景色，一会儿又说起左边的乡野。他觉得没必要看自己的马，也不肯挑平坦的地方走。没过多久，一块石头便嵌进了我的前蹄。
        - id: ch02-b04
          speaker: narrator
          text: 要是戈登先生、约翰，或者任何一个懂行的车夫在场，我走不出三步，他就能发现不对。哪怕天黑，有经验的人也能从缰绳上觉出我的步子变了。他会立刻下车，把石头挑出来。
        - id: ch02-b05
          speaker: narrator
          text: 可这个人还在一路说笑。我每走一步，石头就在蹄铁和蹄叉之间卡得更紧。它朝里的一面很尖，朝外却是圆的。人人都知道，这是马蹄最怕卡住的一种石头。它一面割伤蹄子，一面让马更容易绊倒摔跤。
        - id: ch02-b06
          speaker: narrator
          text: 我不知道那个人是看不清路，还是粗心得厉害。他让我带着那块石头，足足走了半英里。等他终于发现时，我已经疼得一瘸一拐。
        - id: ch02-b07
          speaker: careless_driver
          text: 嘿，这是怎么回事？他们竟然给我们一匹瘸马，实在太不像话了！
        - id: ch02-b08
          speaker: narrator
          text: 他猛扯缰绳，又胡乱挥起鞭子。
        - id: ch02-b09
          speaker: careless_driver
          text: 行了，别跟我装老兵耍滑头！这趟路还没走完。你现在装瘸犯懒，根本没用。
          emotion: angry
    - id: ch03
      title: 农夫伸出援手
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 就在这时，一个农夫骑着棕色的矮壮马赶了上来。他抬帽致意，又勒马停下。
        - id: ch03-b02
          speaker: farmer
          text: 打扰了，先生。我看您的马像是出了毛病。他这么走路，多半是蹄铁里进了石头。您若不介意，我替他看看吧。路上散着这些石头，对马实在危险。
        - id: ch03-b03
          speaker: careless_driver
          text: 这马是租来的。我不知道他到底怎么了，不过车行把一匹瘸马交给客人，真不像话。
        - id: ch03-b04
          speaker: narrator
          text: 农夫下了马，把自己的缰绳搭在胳膊上，马上抬起我左边的前蹄。
        - id: ch03-b05
          speaker: farmer
          text: 老天，果然卡着一块石头！难怪他会瘸！
          emotion: surprised
        - id: ch03-b06
          speaker: narrator
          text: 他先想用手取出石头，可石头已经楔得太紧。于是，他从口袋里拿出剔石器，小心地忙了好一阵，终于把它弄了出来。随后，他把那块石头举给车夫看。
        - id: ch03-b07
          speaker: farmer
          text: 瞧，就是这块石头进了马蹄。他没有摔倒，没把两个膝盖也磕坏，真算走运！
        - id: ch03-b08
          speaker: careless_driver
          text: 哎呀，还真有石头！这可新鲜。我以前从不知道马蹄会卡进石头。
          emotion: surprised
        - id: ch03-b09
          speaker: farmer
          text: 您不知道吗？马蹄当然会卡进石头，再好的马也免不了。在这样的路上，有时他们根本躲不开。您若不想把马弄瘸，就得多留神，一发现便赶快取出来。
        - id: ch03-b10
          speaker: narrator
          text: 农夫轻轻放下我的蹄子，又拍了拍我。
        - id: ch03-b11
          speaker: farmer
          text: 这只蹄子已经撞伤得很厉害了。先生，听我一句劝，先让他慢慢走一阵吧。伤得这么重，不会马上就不瘸的。
        - id: ch03-b12
          speaker: narrator
          text: 农夫重新骑上那匹矮壮马，向车里的太太抬了抬帽子，便小跑着离开了。
    - id: ch04
      title: 出租马的遭遇
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 农夫一走，我的车夫又甩起缰绳，还拿鞭子去抽挽具。我明白，他这是叫我继续赶路。我当然照做了。那块石头终于不在蹄子里，我很庆幸，可伤处仍旧疼得厉害。
        - id: ch04-b02
          speaker: narrator
          text: 我们这些出租马，常常遇上这样的事。
