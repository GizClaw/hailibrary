audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    careless_driver:
      display_name: Careless Driver
      tts:
        delivery: careless, self-assured, and impatient
        timbre: ordinary and slightly coarse
        pace: conversational
        pitch: medium
    farmer:
      display_name: Farmer
      tts:
        delivery: observant, practical, and firmly courteous
        timbre: sturdy and clear
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: A Horse for Hire
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Until then, everyone who had driven me had at least known how to do it. That changed at the livery stable. I was now a job horse, hired out to anyone who wanted me. There I learned just how many kinds of bad and ignorant driving a horse may have to endure.

            Because I was gentle and good-tempered, I believe they gave me to ignorant drivers more often than they gave them some of the other horses. They knew they could depend on me. I could never tell you about every strange way people drove me, but I can tell you about a few.
    - id: ch02
      title: Too Tight and Too Loose
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            First came the drivers who kept the reins painfully tight. They seemed to think good driving meant pulling as hard as they could. They never eased the pressure on a horse's mouth or gave him any freedom to move. They talked about keeping a horse well in hand and holding him up, as if a horse had not been made to hold himself up.

            A poor, worn-out horse may have a hard, numb mouth because drivers like these have pulled on it for years. Perhaps such a horse does get some support from the reins. But a horse who can trust his own legs, who has a sensitive mouth and responds easily, gets nothing from that treatment but pain and trouble.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Then there were drivers who did the opposite. They let the reins lie loose across our backs while one lazy hand rested on a knee. If anything happened suddenly, they had no control at all. A horse might shy, start, or stumble, and by the time the driver could help either the horse or himself, the harm would already be done.

            For my own part, loose reins did not trouble me much. I was not likely to start or stumble. Still, I had always depended on my driver for direction and encouragement. Going downhill, it was reassuring to feel a little support through the rein. It was also good to know that the person behind me had not fallen asleep.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Careless driving also teaches a horse careless and lazy habits. When the horse changes owners, someone may whip those habits out of him, causing pain and trouble. Squire Gordon had always expected our best pace and our best manners. He used to say that letting a horse grow spoiled was as cruel as spoiling a child, because both would suffer for it later.
    - id: ch03
      title: A Stone in My Hoof
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Drivers like these often paid more attention to everything around them than to their horses. One day, a man took me out in a phaeton with a lady and two children riding behind him. As we set off, he flapped the reins and struck me several times for no reason, although I was already moving properly.

            The road had been under repair. Even where no fresh stones had been laid, loose ones were scattered everywhere. My driver laughed and joked with the lady and the children. He pointed out the countryside on one side and then the other. He never bothered to watch me or guide me over the smoothest ground. Before long, a stone lodged in one of my front hooves.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Mr. Gordon, John, or any other good driver would have noticed something was wrong before I had taken three more steps. Even in the dark, an experienced driver would have felt the change in my stride through the reins. He would have stopped, climbed down, and removed the stone.

            This man kept laughing and talking. With every step, the stone drove itself more tightly between my shoe and the frog of my hoof. It was sharp on the inside and rounded on the outside. That is the most dangerous sort a horse can pick up. It cuts into the foot while also making the horse likely to stumble and fall.
        - id: ch03-b03
          speaker: narrator
          text: >-
            I cannot say whether the man was partly blind or simply very careless. He made me travel a full half mile with that stone in my hoof before he noticed anything. By then, the pain had made me so lame that even he finally saw it.
        - id: ch03-b04
          speaker: careless_driver
          text: >-
            Well, look at this! They've sent us out with a lame horse. What a disgrace!
          emotion: surprised
        - id: ch03-b05
          speaker: narrator
          text: >-
            He jerked the reins and flicked the whip around.
        - id: ch03-b06
          speaker: careless_driver
          text: >-
            Come on, now. You can't fool me with that old trick. We still have a journey to finish, so quit acting lame and lazy.
    - id: ch04
      title: The Farmer's Help
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Just then, a farmer rode up on a brown cob. He raised his hat and stopped beside us.
        - id: ch04-b02
          speaker: farmer
          text: >-
            Excuse me, sir, but I believe something is wrong with your horse. The way he's stepping makes me think there's a stone in his shoe. If you don't mind, I'll check his feet. Loose stones scattered over a road like this are terribly dangerous for horses.
        - id: ch04-b03
          speaker: careless_driver
          text: >-
            He's only a hired horse. I don't know what's wrong with him, but they should be ashamed of sending out a lame animal like this.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The farmer got down, slipped his cob's rein over his arm, and immediately lifted my left front hoof.
        - id: ch04-b05
          speaker: farmer
          text: >-
            Good heavens, there is a stone! No wonder the poor horse is lame.
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: >-
            He first tried to loosen it with his fingers. It was wedged too firmly, so he took a stone pick from his pocket. Working carefully, and with some difficulty, he finally pulled it free. Then he held the stone up for the driver to see.
        - id: ch04-b07
          speaker: farmer
          text: >-
            Here it is. This is the stone your horse picked up. It's a wonder he didn't fall and smash his knees as well.
        - id: ch04-b08
          speaker: careless_driver
          text: >-
            Well, imagine that! I never knew horses could pick up stones.
          emotion: surprised
        - id: ch04-b09
          speaker: farmer
          text: >-
            You didn't? They certainly can. Even the finest horse may pick one up and be unable to help it, especially on a road like this. If you don't want to lame your horse, you need to pay attention and remove a stone quickly.
        - id: ch04-b10
          speaker: narrator
          text: >-
            He gently set my hoof down and patted me.
        - id: ch04-b11
          speaker: farmer
          text: >-
            This hoof is badly bruised. If I may offer some advice, sir, drive him gently for a while. His foot has been hurt quite a bit, and he won't stop limping right away.
        - id: ch04-b12
          speaker: narrator
          text: >-
            The farmer mounted his cob again, raised his hat to the lady, and trotted away.

            As soon as he was gone, my driver began flapping the reins and striking the harness with his whip. I understood that he wanted me to go on, so I did. I was thankful to have the stone out, though my hoof still hurt badly.
        - id: ch04-b13
          speaker: narrator
          text: >-
            That was the kind of treatment we job horses often had to endure.
