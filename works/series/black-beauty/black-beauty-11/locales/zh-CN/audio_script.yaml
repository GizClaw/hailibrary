audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述成长经历时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    master:
      display_name: 道格拉斯先生
      tts:
        delivery: 正直坚定，平日温厚，斥责残忍时严厉有力
        timbre: 沉稳清晰
        pace: 从容，激动时略有顿挫
        pitch: 中低
    sawyer:
      display_name: 索耶先生
      tts:
        delivery: 粗暴强硬，发怒时蛮横而不耐烦
        timbre: 粗重紧绷
        pace: 稍快而生硬
        pitch: 中低
    captain_langley:
      display_name: 兰利上尉
      tts:
        delivery: 自信爽直，受人劝说时带着绅士式的克制
        timbre: 洪亮利落
        pace: 自然而明快
        pitch: 中
  chapters:
    - id: ch01
      title: 伯特威克的善意
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我在伯特威克住得越久，就越庆幸自己有这样的归宿。凡是认识主人和女主人的人，都敬重他们，也爱戴他们。
        - id: ch01-b02
          speaker: narrator
          text: 他们不只善待男女老少，也善待马、驴、狗、猫、牛和鸟。任何受欺负、遭虐待的生灵，都能从他们那里得到帮助，家里的仆人也是一样。
        - id: ch01-b03
          speaker: narrator
          text: 要是村里的孩子虐待动物，庄园很快就会出面告诫他们。乡绅和格雷农夫还一起努力了二十多年，想让拉货车的马不再受挽缰折磨。所以在我们那一带，挽缰已经很少见了。
        - id: ch01-b04
          speaker: narrator
          text: 女主人偶尔见到负载很重、头又被高高勒起的马，就会叫马车停下，亲自下车。她用甜美而认真的声音跟车夫讲道理，让他明白这种做法既愚蠢又残忍。我想，没有谁能拒绝她的劝说。真希望所有太太都像她一样。
        - id: ch01-b05
          speaker: narrator
          text: 主人遇到这种事，也会毫不客气地说出心里话。
    - id: ch02
      title: 庄园门前的小马
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天早晨，主人骑着我回家。一个壮实的男人驾着轻便矮马车迎面而来，车前是一匹漂亮的小栗色矮马。它四肢纤细，头脸俊秀，看上去十分敏感。
        - id: ch02-b02
          speaker: narrator
          text: 走到庄园门前，小马转身想往门里走。那男人一句话也没说，更没有事先警告，便猛地扭过它的头，险些让它一屁股坐到地上。小马好不容易站稳，刚要继续向前，他又凶狠地抽起鞭子。
        - id: ch02-b03
          speaker: narrator
          text: 小马向前猛冲，那只粗重有力的手却把这个漂亮的小家伙死死勒住，几乎要扯断它的下巴，鞭子仍旧一下下落在身上。我知道那张娇嫩的嘴正在承受多么可怕的疼痛，眼前的情景实在叫我不忍再看。主人一声令下，我立刻追了上去。
        - id: ch02-b04
          speaker: master
          text: 索耶，那匹小马难道不是血肉之躯吗？
          emotion: angry
        - id: ch02-b05
          speaker: sawyer
          text: 它不只有血有肉，还有一副坏脾气！它总爱由着自己的性子来，我可容不下这个毛病。
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: 索耶怒气冲冲。他是个建筑商，经常到庄园来办事。
        - id: ch02-b07
          speaker: master
          text: 你这样对待它，难道它就会愿意照你的意思走吗？
          emotion: angry
        - id: ch02-b08
          speaker: sawyer
          text: 它就不该拐弯！它明明应该一直往前走！
          emotion: angry
        - id: ch02-b09
          speaker: master
          text: 你常常驾着它到我家。它会转向大门，正说明它记性好，也有灵性。它怎么会知道，你今天不是还要去我家呢？
        - id: ch02-b10
          speaker: master
          text: 不过，这还不是最要紧的。索耶先生，我从没见过有人这样怯懦又野蛮地对待一匹小马。看见这一幕，实在叫我痛心。
          emotion: angry
        - id: ch02-b11
          speaker: master
          text: 你任凭怒气支配自己，伤害自己的品格，并不比伤害这匹马轻，甚至还要更重。请记住，我们终有一天要凭自己的所作所为受评判，不管我们面对的是人，还是牲畜。
        - id: ch02-b12
          speaker: narrator
          text: 回家的路上，主人骑着我走得很慢。我从他的声音里听得出来，刚才亲眼看见的残忍情景让他非常难过。
    - id: ch03
      title: 主人的心爱主张
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 主人不只敢斥责地位比自己低的人。面对身份相当的绅士，他也照样直言不讳。
        - id: ch03-b02
          speaker: narrator
          text: 又有一天，我们在外面遇见了主人的朋友兰利上尉。他驾着一辆四轮敞篷马车，前面套着一对非常神气的灰马。两人先寒暄了几句，上尉便向主人请教。
        - id: ch03-b03
          speaker: captain_langley
          text: 道格拉斯先生，你觉得我这对新马怎么样？你是这一带最懂马的人，我很想听听你的看法。
        - id: ch03-b04
          speaker: narrator
          text: 主人让我退后几步，把那对马从头到脚看了个仔细。
        - id: ch03-b05
          speaker: master
          text: 它们真是少见的漂亮。要是本领也和模样一样好，你就再也找不到更称心的马了。可你还是舍不得那个心爱的法子，非要折磨自己的马，削弱它们的力气。
        - id: ch03-b06
          speaker: captain_langley
          text: 你说的是挽缰吗？对，我知道这是你最爱谈的主张。其实，我只是喜欢看马把头高高昂起来。
        - id: ch03-b07
          speaker: master
          text: 我也爱看马昂首，和谁都一样。可要是用绳子硬把头吊起来，那份神气就全没了。
        - id: ch03-b08
          speaker: master
          text: 兰利，你是军人，当然喜欢看自己的部队在校阅时昂首挺胸。可要是每个士兵的脑袋都被绑在背板上，你总不会觉得这叫操练有方吧？
        - id: ch03-b09
          speaker: master
          text: 校阅时这样做，也许只会让他们难受疲惫。可等他们挺着刺刀冲向敌人，全身肌肉都要活动自如，所有力气都得往前使。到了那时候，他们还有多少胜算？
        - id: ch03-b10
          speaker: master
          text: 马也是一样。挽缰让它们烦躁，削弱它们的力气，还不许它们把身体的重量用在工作上。它们只好过分依靠关节和肌肉，身体当然损耗得更快。
        - id: ch03-b11
          speaker: master
          text: 马的头本来就该自由活动，和人的头一样自由。我们要是多照常理办事，少追些时髦，许多事情都会轻松得多。
        - id: ch03-b12
          speaker: master
          text: 你和我一样清楚，马一旦失足，如果头颈被向后拴住，就更难重新站稳，也更难免于摔倒。
        - id: ch03-b13
          speaker: narrator
          text: 说到这里，主人笑了起来。
        - id: ch03-b14
          speaker: master
          text: 好啦，我已经让自己心爱的这匹“主张”痛痛快快跑了一圈。上尉，你还不肯也骑上它吗？只要你肯带头，就能起很大的作用。
        - id: ch03-b15
          speaker: captain_langley
          text: 我相信，从道理上说，你是对的。拿士兵来打比方，也确实叫我难以招架。不过……这个嘛……我会好好想一想。
        - id: ch03-b16
          speaker: narrator
          text: 说完，他们便分道而行。
