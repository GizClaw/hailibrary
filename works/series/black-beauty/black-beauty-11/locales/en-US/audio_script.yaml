  chapters:
    - id: ch01
      title: Kindness at Birtwick
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The longer I lived at Birtwick, the prouder and happier I was to call it home. Everyone who knew our master and mistress respected and loved them. Their kindness reached everyone and everything around them. Men and women, horses and donkeys, dogs and cats, cattle and birds all had friends at the Hall. Their servants followed their example. If any village child was known to be cruel to an animal, word soon came from the Hall.

            The squire and Farmer Grey said they had worked together for more than twenty years to put an end to check-reins on cart horses. By then, you rarely saw one in our area. Sometimes the mistress met a heavily loaded horse whose head was pulled high. She would stop the carriage, get out, and speak to the driver in her sweet, serious voice. She tried to make him understand how foolish and cruel it was.

            I don't think any man could stand against our mistress. I wished every lady were like her. Our master could speak very strongly, too.
    - id: ch02
      title: The Little Bay Pony
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            One morning, the master was riding me home when a powerful man drove toward us in a light pony chaise. His pony was a beautiful little bay, with slender legs and a fine, sensitive head and face.

            As they reached the park gates, the pony turned toward them. Without a word or a warning, the man suddenly wrenched the little creature's head around so hard that he nearly forced him back onto his haunches. The pony recovered and tried to go on. Then the man began whipping him furiously. The pony plunged ahead, but that heavy hand dragged him back with enough force to almost break his jaw, while the whip kept cutting into him.

            It was dreadful to watch. I knew the terrible pain that rough handling caused in such a delicate mouth. The master gave me the word, and a second later we were beside them.
        - id: ch02-b02
          speaker: master
          emotion: angry
          text: >-
            Sawyer, is that pony made of flesh and blood?
        - id: ch02-b03
          speaker: sawyer
          emotion: angry
          text: >-
            Flesh and blood, and temper besides. He's too determined to get his own way, and I won't have it.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Sawyer was a builder who often came to the park on business. He spoke as if he were in a fierce rage.
        - id: ch02-b05
          speaker: master
          emotion: angry
          text: >-
            And you think treating him this way will make him want to follow your wishes?
        - id: ch02-b06
          speaker: sawyer
          emotion: angry
          text: >-
            He had no right to turn there! The road went straight ahead!
        - id: ch02-b07
          speaker: master
          emotion: angry
          text: >-
            You've driven that pony to my place many times. His turn only shows his memory and intelligence. How could he know you weren't going there again?

            But that is hardly the point. Mr. Sawyer, I have never had the pain of seeing a little pony treated in a more brutal or unmanly way. When you give in to such rage, you damage your own character even more than you damage your horse. Remember, we will all be judged by what we do, whether we do it to a man or to an animal.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The master rode me slowly home. I could hear in his voice how deeply the sight had grieved him.
    - id: ch03
      title: Heads Up, but Never Held Up
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The master spoke just as freely to gentlemen of his own rank as he did to people below him. Another day, while we were out, we met his friend Captain Langley. The captain was driving a splendid pair of gray horses in a kind of break. After they had talked for a little while, the captain asked about his new team.
        - id: ch03-b02
          speaker: captain_langley
          text: >-
            What do you think of them, Mr. Douglas? Everyone around here trusts your judgment of horses, and I'd like to hear your opinion.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The master backed me up a little so he could see the pair clearly.
        - id: ch03-b04
          speaker: master
          text: >-
            They're exceptionally handsome. If they're as good as they look, you couldn't ask for anything better. But I see you're still devoted to that favorite plan of yours for worrying your horses and taking away their strength.
        - id: ch03-b05
          speaker: captain_langley
          text: >-
            What do you mean, the check-reins? Oh, yes. I know that's your favorite subject. The truth is, I like seeing my horses with their heads up.
        - id: ch03-b06
          speaker: master
          text: >-
            So do I, as much as anyone. But I don't like seeing their heads held up. That takes all the beauty out of it.

            You're a military man, Langley. No doubt you like your regiment to look fine on parade, with every man's head up. But would you take much pride in the drill if all their heads were tied to backboards? On parade, it might do nothing worse than tire and bother them. But imagine them charging the enemy with bayonets. They need every muscle free and all their strength driving forward. Tied up that way, they wouldn't have much chance of victory.

            It's just the same for horses. Check-reins irritate and upset them, and they reduce the horses' power. The horses can't put their weight into the work, so their joints and muscles have to do too much. That wears them out sooner.

            You can be sure horses were meant to carry their heads as freely as men do. If we followed common sense a little more and fashion a good deal less, many things would work better. And you know as well as I do that when a horse takes a false step, he has far less chance to recover if his head and neck are fastened back.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The master laughed as he finished.
        - id: ch03-b08
          speaker: master
          emotion: happy
          text: >-
            Well, I've given my favorite hobby a good trot. Can't you make up your mind to ride it too, Captain? Your example would influence a great many people.
        - id: ch03-b09
          speaker: captain_langley
          text: >-
            I believe your argument is right, and that comparison with the soldiers struck rather hard. Still... well, I'll think about it.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Then they went their separate ways.
