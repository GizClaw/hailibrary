audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    jerry:
      display_name: 杰里·巴克
      tts:
        delivery: 爽朗亲切，说起原则时坚定而不说教
        timbre: 结实温暖
        pace: 明快平稳
        pitch: 中低
    young_man_1:
      display_name: 第一个年轻人
      tts:
        delivery: 冒失急躁，带着不耐烦的催促
        timbre: 年轻响亮
        pace: 急促
        pitch: 中
    larry:
      display_name: 拉里
      tts:
        delivery: 油滑爱逗弄人，受指责时嘴硬
        timbre: 粗哑干瘦
        pace: 偏快
        pitch: 中
    injured_young_man:
      display_name: 受伤的年轻人
      tts:
        delivery: 忍着疼痛，语气恳切而焦急
        timbre: 虚弱透气
        pace: 急而吃力
        pitch: 中
    cabman_1:
      display_name: 第一个车夫
      tts:
        delivery: 不信服，开口干脆直接
        timbre: 粗粝干涩
        pace: 偏快
        pitch: 中低
    cabman_2:
      display_name: 第二个车夫
      tts:
        delivery: 尖刻嘲弄，说话毫不客气
        timbre: 尖细带鼻音
        pace: 快
        pitch: 中
    governor_gray:
      display_name: 格雷老爹
      tts:
        delivery: 老练沉着，训人时严厉又带讥诮
        timbre: 低沉沧桑
        pace: 从容
        pitch: 低
  chapters:
    - id: ch01
      title: 杰里一家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我这辈子再没遇见过比新主人更好的人。杰里心地善良，认准了是非，就像约翰·曼利一样坚定。他脾气随和，人又快活，几乎谁也没法跟他吵起来。
        - id: ch01-b02
          speaker: narrator
          text: 杰里爱随口编些小歌，再唱给自己听。他最喜欢的一首是：“爸爸妈妈快来呀，姐妹兄弟也别落下，大家都来搭把手，你帮我来我帮他。”
        - id: ch01-b03
          speaker: narrator
          text: 这一家人还真是这么做的。哈里年纪不大，料理马厩却很在行，总想多帮一点忙。每天早晨，波莉和多莉也来收拾马车。她们刷坐垫、拍灰尘、擦玻璃，杰里在院里给上尉和我刷洗，哈里就在一旁擦挽具。
        - id: ch01-b04
          speaker: narrator
          text: 大家干着活，说着笑着。上尉和我听见这些笑声，心里也跟着舒畅。要是耳边尽是责骂和难听的话，那可完全不同。
        - id: ch01-b05
          speaker: narrator
          text: 他们每天都起得很早，因为杰里还有一首常唱的小歌：“清早若把光阴抛，一天到晚找不着。任你匆匆四处跑，又慌又急又烦恼，失去便是永失去，再也不能把它找。”
        - id: ch01-b06
          speaker: narrator
          text: 杰里最受不了人磨磨蹭蹭，白白浪费时间。要是谁自己总迟到，转头却逼着拉车的马拼命跑，想把耽误的工夫追回来，他就格外生气。
    - id: ch02
      title: 一个先令不值得
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，两个模样放荡的年轻人从候车处附近的酒馆出来，高声叫住杰里。
        - id: ch02-b02
          speaker: young_man_1
          text: 喂，车夫，快点！我们晚了。赶紧加速，把我们送到维多利亚车站，得赶上一点钟的火车。我们多给你一个先令。
        - id: ch02-b03
          speaker: jerry
          text: 两位先生，我会按平常的速度送你们去。多给一个先令，也不值得这样逼马狠跑。
        - id: ch02-b04
          speaker: narrator
          text: 拉里的马车正停在旁边。他猛地拉开车门。
        - id: ch02-b05
          speaker: larry
          text: 两位先生，你们找我就对了！坐我的车，我的马准能及时送到。
        - id: ch02-b06
          speaker: narrator
          text: 两人上了车。拉里关门时朝杰里挤挤眼睛，又挖苦了一句。
        - id: ch02-b07
          speaker: larry
          text: 他的良心不让他跑得比慢颠快。
        - id: ch02-b08
          speaker: narrator
          text: 说完，他一鞭抽向那匹疲惫的马，拼命赶着车走了。杰里拍拍我的脖子。
        - id: ch02-b09
          speaker: jerry
          text: 不，杰克。为了一个先令这么干，可不值得。对不对，老伙计？
        - id: ch02-b10
          speaker: narrator
          text: 杰里不肯为了迁就粗心的人狠命赶马，不过平时总把车赶得又稳又快。只要事情确实要紧，他也很愿意让我使足劲跑。
    - id: ch03
      title: 必须赶上的火车
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 有天早晨，我们在候车处等客。一名年轻人提着沉重的旅行箱，踩上一块橘子皮，猛地摔在地上。杰里第一个跑过去扶他。年轻人摔得晕头转向，被人搀进店铺时，每走一步都像疼得厉害。
        - id: ch03-b02
          speaker: narrator
          text: 杰里回到候车处。大约十分钟后，店里有个伙计出来叫他，我们便驶到路边。
        - id: ch03-b03
          speaker: injured_young_man
          text: 能送我去东南铁路车站吗？这一跤把时间耽误了，可我绝不能错过十二点那班火车，这件事对我非常要紧。只要能及时赶到，我一定十分感激，也愿意多付车钱。
        - id: ch03-b04
          speaker: jerry
          text: 我一定尽全力，先生。只要您觉得身体还撑得住。
        - id: ch03-b05
          speaker: narrator
          text: 年轻人脸白得吓人，看上去很不舒服。
        - id: ch03-b06
          speaker: injured_young_man
          text: 我非去不可。请开门吧，一分钟也别再耽误。
        - id: ch03-b07
          speaker: narrator
          text: 转眼间，杰里已经坐上车夫座。他快活地咂嘴催我，又轻轻带了一下缰绳。我立刻明白了。
        - id: ch03-b08
          speaker: jerry
          text: 来吧，杰克，痛痛快快跑起来！只要明白是为了什么，就让他们看看咱们有多快。
        - id: ch03-b09
          speaker: narrator
          text: 白天的伦敦满街都是车辆，想快跑可不容易。不过，好车夫和好马彼此了解，又一条心，能做到的事真叫人吃惊。我的嘴很灵，缰绳只要轻轻一碰，我就知道该往哪里走。这在伦敦格外要紧。
        - id: ch03-b10
          speaker: narrator
          text: 马车、公共马车、大车、运货车、卡车、出租马车，还有沉重的大货车，全在街上慢慢挪动。有的往这边走，有的往那边走。有的慢吞吞，后面的却急着超过去。公共马车每隔几分钟就突然停下接客，后面的马只好跟着停，或是设法绕到它前面。
        - id: ch03-b11
          speaker: narrator
          text: 也许你刚想从旁边超过去，另一辆车却突然钻进那道窄缝，你只得重新跟在公共马车后面。好不容易抢到前头，两旁的车轮又挨得极近，再近半英寸就会刮上。才走一小段，又陷进长长的大小车队，所有车辆都只能一步一步往前挪。
        - id: ch03-b12
          speaker: narrator
          text: 有时整条街会堵死，大家几分钟都动不了，非得等某辆车拐进小街，或等警察来疏通。你得一直盯着机会，一有空隙就冲出去，还要像捕鼠梗那样机灵，马上看准地方够不够、时间来不来得及。不然，自己的车轮会跟别人的绞在一起，甚至撞坏，别人的车辕也可能直戳你的胸口或肩膀。这些危险，随时都得防着。
        - id: ch03-b13
          speaker: narrator
          text: 所以，要在大白天飞快穿过伦敦，非有丰富的经验不可。杰里和我早就习惯了。只要我们认真赶路，谁也胜不过我们。我动作快，胆子大，无论车流多乱都信得过车夫。杰里又敏捷又沉着，既能抓住机会，也有耐心等候，还一样信得过他的马。
        - id: ch03-b14
          speaker: narrator
          text: 他很少动鞭子。我听见他的声音和“啧、啧”的催促，就知道该加快脚步。缰绳往哪边轻轻一带，我便往哪边走，根本用不着挨鞭子。一个信得过车夫，一个信得过马，这对我们俩都十分要紧。好了，我还是接着说那天的事吧。
        - id: ch03-b15
          speaker: narrator
          text: 那天街上格外拥挤。直到齐普赛街尽头，我们都走得不错，可在那里堵了三四分钟。年轻人焦急地把头探出车外。
        - id: ch03-b16
          speaker: injured_young_man
          text: 我还是下车走吧。再这么堵下去，我永远也赶不到了。
        - id: ch03-b17
          speaker: jerry
          text: 先生，我会尽力的。我想咱们赶得上。这阵拥堵不会持续太久，您的行李又太重，自己提着走受不了。
        - id: ch03-b18
          speaker: narrator
          text: 就在这时，前面的大车开始移动，好运也来了。我们忽左忽右，从车缝里穿进穿出，马能跑多快，我们就跑多快。伦敦桥上竟然一路畅通。一长列出租马车和别的车辆都朝着同一个方向快步小跑，也许都在赶那班火车。
        - id: ch03-b19
          speaker: narrator
          text: 我们跟着车流飞驰进站，大钟正指向十二点差八分。
        - id: ch03-b20
          speaker: injured_young_man
          text: 感谢上帝，我们赶上了！也谢谢你，我的朋友，还有你的好马。你们帮了我天大的忙，多少钱都报答不了。请收下这额外的半克朗。
          emotion: happy
        - id: ch03-b21
          speaker: jerry
          text: 不，先生，不用了，不过还是谢谢您。能及时赶到，我真替您高兴。您别耽搁，铃已经响了。搬运工！请拿这位先生的行李。十二点去多佛的火车，对，就是那班。
        - id: ch03-b22
          speaker: narrator
          text: 杰里没等他再开口，便把我掉转过来，给那些在最后一刻飞奔进车站的马车让路。我们停到一旁，一直等到这阵拥挤过去。
        - id: ch03-b23
          speaker: jerry
          text: 真替他高兴，真高兴！可怜的年轻人。到底是什么事，让他急成这样？
        - id: ch03-b24
          speaker: narrator
          text: 车子停着不动时，杰里常常这样大声自言自语，声音响得连我也听得见。
    - id: ch04
      title: 比钱更好的报酬
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 杰里回到候车处，其他车夫立刻又笑又挖苦。他们说，他为了多挣车钱，居然一路赶着马飞跑，完全违背了自己的原则。大家围着追问，想知道他这一趟究竟多揣了多少钱。
        - id: ch04-b02
          speaker: jerry
          text: 比我平常挣的多得多。他给我的报酬，够我舒舒服服过上好几天了。
        - id: ch04-b03
          speaker: narrator
          text: 杰里说着，狡黠地点了点头。
        - id: ch04-b04
          speaker: cabman_1
          text: 你这话全是胡扯！
        - id: ch04-b05
          speaker: cabman_2
          text: 他就是个假正经。平时教训我们，轮到自己还不是照样干。
        - id: ch04-b06
          speaker: jerry
          text: 听着，伙计们。那位先生确实要多给半克朗，可我没收。看见他赶上火车，高兴成那样，对我来说就是很好的报酬。至于我和杰克偶尔想痛快跑一趟，给自己找点乐子，那是我们的事，与你们无关。
        - id: ch04-b07
          speaker: larry
          text: 好吧，你这辈子是成不了有钱人啦。
        - id: ch04-b08
          speaker: jerry
          text: 多半成不了。可我也不觉得，这会让我少快活一点。我听人念过许多次《十诫》，从没听见哪一条说“你必须发财”。《新约》里还有不少关于有钱人的稀奇话。我要真成了有钱人，想到那些话，心里恐怕会很不自在。
        - id: ch04-b09
          speaker: governor_gray
          text: 杰里，你要是真有一天发了财，那也是你应得的，你的财富也不会带着诅咒来。至于你，拉里，你到死也富不了。你在鞭梢上花的钱太多了。
        - id: ch04-b10
          speaker: narrator
          text: 格雷老爹从自家马车顶上回过头来说了这番话。
        - id: ch04-b11
          speaker: larry
          text: 马不挨鞭子就不肯走，我还能怎么办？
        - id: ch04-b12
          speaker: governor_gray
          text: 你从来没有耐心试一试，不抽鞭子，它到底肯不肯走。你的鞭子总挥个不停，像是胳膊犯了圣维特舞蹈症。就算没把你自己累垮，也早晚会把马累垮。你自己也知道，你总是在换马。为什么呢？因为你从不给它们片刻安生，也从不肯好好鼓励它们。
        - id: ch04-b13
          speaker: larry
          text: 唉，我就是运气不好。问题全在这儿。
        - id: ch04-b14
          speaker: governor_gray
          text: 你永远也不会有好运。好运这位小姐挑同行的人，可讲究着呢。她大多愿意跟有常识、心肠又好的人走。至少我活到现在，看到的就是这样。
        - id: ch04-b15
          speaker: narrator
          text: 格雷老爹转回去继续看报，其他车夫也各自走回自己的马车旁。
