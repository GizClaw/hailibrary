audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    jerry:
      display_name: Jerry Barker
      tts:
        delivery: good-humored, direct, and warmly principled
        timbre: sturdy and friendly
        pace: lively and even
        pitch: medium-low
    young_man_1:
      display_name: First Young Man
      tts:
        delivery: impatient and careless
        timbre: brash and youthful
        pace: quick
        pitch: medium
    larry:
      display_name: Larry
      tts:
        delivery: cocky, teasing, and defensive
        timbre: rough and wiry
        pace: brisk
        pitch: medium
    injured_young_man:
      display_name: Injured Young Man
      tts:
        delivery: strained but earnest
        timbre: thin and breathy
        pace: urgent
        pitch: medium
    cabman_1:
      display_name: First Cabman
      tts:
        delivery: skeptical and blunt
        timbre: coarse and dry
        pace: brisk
        pitch: medium-low
    cabman_2:
      display_name: Second Cabman
      tts:
        delivery: mocking and sharp
        timbre: nasal and cutting
        pace: quick
        pitch: medium
    governor_gray:
      display_name: Governor Gray
      tts:
        delivery: seasoned, firm, and wry
        timbre: deep and weathered
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Jerry Barker
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I never knew a better man than my new master. Jerry was kind and good, and he stood up for what was right as firmly as John Manly had. He was so cheerful and easygoing that hardly anyone could quarrel with him. He loved making up little songs and singing them to himself. One favorite went like this: “Come, father and mother, and sister and brother. Come, all of you, turn to and help one another.”

            And that was exactly what the family did. Harry handled stable work as cleverly as a much older boy and was always ready to help. In the mornings, Polly and Dolly worked on the cab. They brushed and beat the cushions and polished the glass while Jerry cleaned Captain and me in the yard and Harry rubbed the harness. Everyone laughed and joked together. Captain and I felt much better hearing that than we would have felt listening to scolding and harsh words.
        - id: ch01-b02
          speaker: narrator
          text: >-
            They always started early, because Jerry had another little song: “If you throw your minutes away in the morning, you can't pick them up later that day. You may hurry and scurry, and flurry and worry, but you've lost them forever and aye.”

            Jerry couldn't stand careless dawdling or wasted time. Almost nothing angered him more than people who were always late and then expected a cab horse to race because they had been idle.
    - id: ch02
      title: A Shilling Would Not Pay
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            One day, two wild-looking young men came out of a tavern near the cabstand and called for Jerry.
        - id: ch02-b02
          speaker: young_man_1
          text: >-
            Cabby, hurry! We're running late. Put on some speed and get us to Victoria in time for the one o'clock train. We'll give you an extra shilling.
        - id: ch02-b03
          speaker: jerry
          text: >-
            I'll take you at the usual pace, gentlemen. A shilling isn't enough to make me drive a horse like that.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Larry's cab stood next to ours. He threw open its door.
        - id: ch02-b05
          speaker: larry
          text: >-
            I'm the driver you want, gentlemen! Take my cab. My horse will get you there in time.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Larry shut them inside, winked at Jerry, and added one more jab.
        - id: ch02-b07
          speaker: larry
          text: >-
            His conscience won't let him go faster than a jog.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Then Larry lashed his tired horse and drove off as hard as he could. Jerry patted my neck.
        - id: ch02-b09
          speaker: jerry
          text: >-
            No, Jack. One shilling wouldn't make that worthwhile, would it, old boy?
        - id: ch02-b10
          speaker: narrator
          text: >-
            Jerry would never drive a horse hard just to please careless people. Still, he always kept up a good, fair pace. And he wasn't against putting on the speed, as he called it, when he knew there was a real reason.
    - id: ch03
      title: The Twelve O'Clock Train
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            I remember one morning when we were waiting at the stand. A young man came along carrying a heavy suitcase. He stepped on a piece of orange peel on the sidewalk and fell hard.

            Jerry reached him first and helped him up. The man looked dazed. When some people led him into a shop, he walked as though he were in great pain. Jerry returned to the stand. About ten minutes later, one of the shopmen called him, and we pulled up beside the sidewalk.
        - id: ch03-b02
          speaker: injured_young_man
          text: >-
            Can you take me to the South-Eastern Railway? I'm afraid that fall has made me late, but I absolutely must catch the twelve o'clock train. If you can get me there in time, I'll gladly pay you extra.
        - id: ch03-b03
          speaker: jerry
          text: >-
            I'll do everything I can, sir, if you're well enough to travel.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The man looked terribly pale and sick.
        - id: ch03-b05
          speaker: injured_young_man
          text: >-
            I have to go. Please open the door. We can't lose another minute.
        - id: ch03-b06
          speaker: narrator
          text: >-
            A moment later, Jerry was on the driver's seat. He gave me a cheerful chirrup and the little pull on the reins that I understood so well.
        - id: ch03-b07
          speaker: jerry
          text: >-
            All right, Jack, my boy. Let's move! We'll show them how fast we can cover the ground when we know the reason.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Driving fast through the city at midday is always difficult because the streets are packed. Still, we did everything we could. A good driver and a good horse can do wonders when they understand each other and want the same thing.

            My mouth was very responsive, so Jerry could guide me with the lightest touch of the rein. That mattered in London. Carriages, omnibuses, carts, vans, trucks, cabs, and huge wagons crowded the streets. Some moved one way and some another. Some crawled while others tried to pass. An omnibus might stop without warning to collect a passenger. The horse behind it had to stop too, or try to get around.

            You might spot an opening and start to pass, only to have another vehicle rush into the narrow space. Then you had to fall in behind the omnibus again. When another chance came, you squeezed forward so close to the wheels on both sides that another half inch would make them scrape.
        - id: ch03-b09
          speaker: narrator
          text: >-
            You might make good progress for a while, then meet a long line of carts and carriages forced to walk. Sometimes the whole street jammed, and you stood still for several minutes. Nothing moved until a vehicle turned into a side street or a police officer stepped in.

            A driver and horse had to watch for every chance. If a gap opened, they had to spring forward. They had to judge the space and timing as quickly as a ratting dog. One mistake could lock or smash their wheels, or send another vehicle's shaft into the horse's chest or shoulder. Getting through London quickly in the middle of the day took a great deal of practice.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Jerry and I knew that work well, and no one could beat us when we were determined. I was quick and bold, and I could always trust my driver. Jerry was quick but patient, and he trusted his horse. He hardly ever used the whip. His voice and his clicking sound told me when to hurry, and the rein showed me where to go. He never needed to strike me.

            But I must return to that journey.
        - id: ch03-b11
          speaker: narrator
          text: >-
            The streets were especially crowded that day. We made fair progress until we reached the bottom of Cheapside, where traffic stopped us for three or four minutes. The young man leaned his head out anxiously.
        - id: ch03-b12
          speaker: injured_young_man
          emotion: fearful
          text: >-
            Maybe I should get out and walk. If this keeps up, I'll never make it.
        - id: ch03-b13
          speaker: jerry
          text: >-
            I'll do everything that can be done, sir. I think we'll arrive in time. This jam can't last much longer, and that suitcase is far too heavy for you to carry.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Just then, the cart ahead began moving, and our luck changed. We wove in and out as fast as any horse could go. To our surprise, London Bridge was clear. A whole stream of cabs and carriages trotted quickly in our direction. Perhaps they were all trying to catch the same train.

            We swept into the station among them just as the great clock reached eight minutes before twelve.
        - id: ch03-b15
          speaker: injured_young_man
          emotion: happy
          text: >-
            Thank God, we made it! And thank you, my friend, and your good horse too. You've saved me in a way money could never repay. Please take this extra half-crown.
        - id: ch03-b16
          speaker: jerry
          text: >-
            No, sir, thank you. I'm just glad we got here in time. Don't wait now. The bell is ringing. Porter! This gentleman's suitcase, please. He's taking the twelve o'clock train on the Dover line. That's right!
        - id: ch03-b17
          speaker: narrator
          text: >-
            Without waiting for another word, Jerry turned me around to clear the way for the cabs racing up at the last moment. We waited to one side until the crush had passed.
        - id: ch03-b18
          speaker: jerry
          text: >-
            So glad. So glad! Poor young fellow. I wonder why he needed to get there so badly.
        - id: ch03-b19
          speaker: narrator
          text: >-
            When we weren't moving, Jerry often spoke to himself loudly enough for me to hear.
    - id: ch04
      title: More Than Money Could Pay
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            When Jerry returned to the cabstand, the other drivers laughed and teased him. They said he had broken his own rule and raced to the train for extra money. They wanted to know how much he had put in his pocket.
        - id: ch04-b02
          speaker: jerry
          text: >-
            Much more than I usually earn.
        - id: ch04-b03
          speaker: narrator
          text: >-
            He gave them a sly nod.
        - id: ch04-b04
          speaker: jerry
          text: >-
            What he gave me will buy little comforts for several days.
        - id: ch04-b05
          speaker: cabman_1
          text: >-
            Nonsense!
        - id: ch04-b06
          speaker: cabman_2
          text: >-
            He's a fraud. He lectures us, then turns around and does the very same thing.
        - id: ch04-b07
          speaker: jerry
          text: >-
            Listen, mates. The gentleman offered me an extra half-crown, but I turned it down. Seeing how happy he was to catch that train was payment enough. And if Jack and I decide to enjoy a fast run once in a while, that's our concern, not yours.
        - id: ch04-b08
          speaker: larry
          text: >-
            Well, you'll never get rich that way.
        - id: ch04-b09
          speaker: jerry
          text: >-
            Probably not. But I don't see why that should make me any less happy. I've heard the commandments read many times, and I never heard one say, “You must be rich.” The New Testament says some strange things about rich men too. I think I'd feel rather uneasy if I were one of them.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Governor Gray looked over his shoulder, across the top of his cab.
        - id: ch04-b11
          speaker: governor_gray
          text: >-
            If you ever do become rich, Jerry, you'll have earned it, and your money won't come with a curse. But Larry, you'll die poor. You waste too much money on whipcord.
        - id: ch04-b12
          speaker: larry
          text: >-
            What am I supposed to do when my horse refuses to move without it?
        - id: ch04-b13
          speaker: governor_gray
          text: >-
            You've never bothered to find out whether he would move without it. That whip of yours never stops, as if your arm has St. Vitus' dance. If it doesn't wear you out, it wears out your horse. You're always replacing your horses, and you know why. You never give them peace or encouragement.
        - id: ch04-b14
          speaker: larry
          text: >-
            I've just had bad luck. That's the real trouble.
        - id: ch04-b15
          speaker: governor_gray
          text: >-
            And you'll keep having it. Good Luck is choosy about the people she rides with. She usually prefers someone with common sense and a good heart. At least, that's what I've found.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Governor Gray turned back to his newspaper, and the other men returned to their cabs.
