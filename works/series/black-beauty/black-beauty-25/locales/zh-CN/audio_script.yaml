audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    reuben:
      display_name: 鲁本·史密斯
      tts:
        delivery: 平日能干和气，醉后粗暴急躁，前后反差鲜明
        timbre: 厚实略哑
        pace: 适中，醉后急促含混
        pitch: 中低
    blantyre:
      display_name: 布兰太尔先生
      tts:
        delivery: 有教养而谨慎，危急时果断急切
        timbre: 清晰沉稳
        pace: 稳健
        pitch: 中低
    hostler:
      display_name: 客店马夫
      tts:
        delivery: 朴实尽责，说话直接
        timbre: 粗朴清楚
        pace: 适中
        pitch: 中
    landlord:
      display_name: 客店老板
      tts:
        delivery: 谨慎关切，提醒时郑重有力
        timbre: 洪亮稳重
        pace: 稍慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 鲁本·史密斯
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 约克去了伦敦，马房便由鲁本·史密斯照管。说到这门差事，没人比他更懂行。只要他一切正常，他就是最忠心、最得力的人。
        - id: ch01-b02
          speaker: narrator
          text: 鲁本对马温和，照料得也高明。他跟过兽医两年，治起马病来，几乎不输蹄铁匠。驾车更是他的拿手本领，四马并驾、前后双驾、普通双驾，他都驾得轻轻松松。他长得英俊，读过书，待人又和气。我想人人都喜欢他，至少我们这些马很喜欢他。
        - id: ch01-b03
          speaker: narrator
          text: 这样的人只做个下属，没有像约克那样当上马车夫总管，实在叫人奇怪。原因只有一个，他贪杯。他并非天天喝，往往能忍上几星期，甚至几个月。可一破戒，就会像约克说的那样“痛饮一场”。到那时，他自己丢尽脸面，妻子整日害怕，身边的人也全不得安宁。
        - id: ch01-b04
          speaker: narrator
          text: 因为鲁本太能干，约克曾替他压下两三回乱子，没有让伯爵知道。后来有一晚，鲁本驾车送舞会上的客人回家，竟醉得握不住缰绳。车上一位先生只好坐到车夫座上，亲自把女士们送回去。这一回再也瞒不住了。鲁本马上被辞退，他的妻子和年幼的孩子也得搬出公园门边那座漂亮的小屋，另外找地方住。
        - id: ch01-b05
          speaker: narrator
          text: 事情过去很久了，这些都是老马克斯告诉我的。就在我和姜饼来这里前不久，史密斯又被召了回来。约克替他向好心的伯爵求情，鲁本也郑重保证，只要住在这里，就再不碰一滴酒。
        - id: ch01-b06
          speaker: narrator
          text: 此后，他一直守着这个承诺。约克这才相信，自己不在时，可以放心让鲁本代管马房。况且鲁本既能干又诚实，再没有比他更合适的人了。
    - id: ch02
      title: 城里的旧朋友
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 到了四月初，主人一家预计五月间回来。那辆轻便四轮马车要送去整修，布兰太尔上校也该返回军团。于是，鲁本驾车送他进城，再骑马回府。他带上马鞍，选了我走这一趟。
        - id: ch02-b02
          speaker: narrator
          text: 到车站以后，布兰太尔上校把一些钱塞进鲁本手中，临别时还特意叮嘱他。
        - id: ch02-b03
          speaker: blantyre
          text: 鲁本，替我照看好你家年轻的小姐。别让哪个来路不明又自以为是的小伙子乱骑黑奥斯特，把他骑坏了。要把他留给小姐。
        - id: ch02-b04
          speaker: narrator
          text: 我们把车留在制造商那里。鲁本骑我到了白狮客店，叫马夫好好喂我，下午四点备妥。来城里的路上，我一只前蹄铁上的钉子松了。直到快四点，马夫才发现。
        - id: ch02-b05
          speaker: narrator
          text: 鲁本五点才进院子。他说遇见几位老朋友，六点再走。马夫便告诉他，蹄铁钉松了，又问要不要叫人查看。
        - id: ch02-b06
          speaker: hostler
          text: 史密斯先生，要不要找人看看这只蹄铁？
        - id: ch02-b07
          speaker: reuben
          text: 不用。撑到家没问题。
        - id: ch02-b08
          speaker: narrator
          text: 他的嗓门很大，口气也满不在乎。我立刻觉得这不像他。平日里，我们的蹄铁钉只要松一点，他都会仔细处理。可是那天，六点不见他，七点、八点也不见他。快到九点，他才粗声粗气地叫人牵我出来。
        - id: ch02-b09
          speaker: narrator
          text: 鲁本的脾气坏透了。他对着马夫一通辱骂，我根本听不出马夫做错了什么。
    - id: ch03
      title: 黑暗的石路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 客店老板站在门口，忍不住提醒他。
        - id: ch03-b02
          speaker: landlord
          text: 史密斯先生，路上当心！
        - id: ch03-b03
          speaker: narrator
          text: 鲁本却恼怒地咒骂了一句。我们才出城不远，他就逼我飞奔。我明明已经跑到最快，他还是一次次用鞭子狠抽。
        - id: ch03-b04
          speaker: narrator
          text: 月亮还没升起来，四周黑得什么也看不清。道路不久前才修过，地上满是石块。我这样一路疾驰，蹄铁越来越松。快到收费关卡时，它终于掉了。
        - id: ch03-b05
          speaker: narrator
          text: 鲁本如果神志清醒，一定会从我的步子里察觉异常。可他已经醉得什么都不知道了。
        - id: ch03-b06
          speaker: narrator
          text: 关卡外有一段长路，刚铺上又大又尖的新石料。任何马在这样的路上疾驰，都会有危险。可我少了一只蹄铁，仍得拼尽全力飞奔。鲁本一面挥鞭抽我，一面疯狂咒骂，催我再快些。
        - id: ch03-b07
          speaker: narrator
          text: 那只没有蹄铁保护的脚痛得厉害。蹄壳被石块撞碎，裂口一直深入嫩肉，蹄子里面也让尖石割得遍体是伤。
    - id: ch04
      title: 月光下
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我再也跑不下去了。那样的路，那样的疼痛，没有哪匹马还能站稳。我猛地绊倒，两只前膝重重跪在地上。鲁本从我背上飞了出去。当时速度那么快，他一定摔得很重。
        - id: ch04-b02
          speaker: narrator
          text: 我很快站起来，一瘸一拐地挪到没有石子的路边。月亮刚刚升过树篱。我借着月光，看见鲁本躺在几码之外。他没有起来，只微微挣扎了一下，随即发出一声沉重的呻吟。
        - id: ch04-b03
          speaker: narrator
          text: 我的蹄子和双膝都疼得钻心，也很想呻吟。可是马早就习惯默默忍痛。我没有出声，只站在那里听。鲁本又重重呻吟了一声。此时，月光已经完全照在他身上，可他一动也不动了。
        - id: ch04-b04
          speaker: narrator
          text: 我帮不了他，也救不了自己。啊，我多想听见一声马蹄响、一阵车轮响，或者一个人的脚步声！这条路本来就少有人经过，又是深夜。也许我们要等上好几个钟头，才会有人来。我只能站着，不停地看，不停地听。
        - id: ch04-b05
          speaker: narrator
          text: 那是一个安静而温柔的四月夜晚。四周只有夜莺偶尔低低唱几声。月亮旁的白云缓缓飘动，一只褐色猫头鹰掠过树篱，除此之外，什么也没有动。
        - id: ch04-b06
          speaker: narrator
          text: 眼前的夜色让我想起很久以前的夏夜。那时，我总躺在格雷农场那片碧绿宜人的草地上，依偎在母亲身旁。
