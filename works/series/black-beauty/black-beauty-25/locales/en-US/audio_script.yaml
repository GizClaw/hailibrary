  chapters:
    - id: ch01
      title: Reuben Smith
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I must tell you something about Reuben Smith. York had left him in charge of the stables while York was in London. No one knew the work better. When Reuben was himself, no man could have been more faithful or useful.

            He was gentle with horses and very clever at handling them. After spending two years with a veterinary surgeon, he could treat a sick horse nearly as well as a farrier could. He was an excellent driver too. A team of four, a tandem, or a pair all seemed equally easy in his hands.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Reuben was handsome, well educated, and pleasant to speak with. Everyone seemed to like him, and the horses certainly did. With all his ability, you might wonder why he served under a head coachman instead of holding a position like York's himself.

            The reason was one terrible weakness. Reuben loved drink.
        - id: ch01-b03
          speaker: narrator
          text: >-
            He did not drink all the time. He might stay sober for weeks, even months. Then he would begin what York called a bout. He would disgrace himself, frighten his wife, and cause trouble for everyone around him.

            Reuben was so valuable that York had covered for him two or three times and kept the earl from hearing about it. Then, one night, Reuben was supposed to drive a party home from a ball. He was too drunk even to hold the reins. One of the gentlemen had to climb onto the box and drive the ladies home himself.
        - id: ch01-b04
          speaker: narrator
          text: >-
            There was no hiding that. Reuben was dismissed at once. His poor wife and young children had to leave their pretty cottage by the park gate and find somewhere else to live.

            Old Max told me the story, because all this happened long before. But shortly before Ginger and I arrived, Reuben had been taken back. York had spoken for him to the kindhearted earl, and Reuben had solemnly promised never to taste another drop while he lived there.
        - id: ch01-b05
          speaker: narrator
          text: >-
            He had kept that promise so faithfully that York believed he could safely leave the stables in Reuben's care. And since Reuben was both skilled and honest, there seemed to be no one better for the job.
    - id: ch02
      title: The Loose Shoe
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            It was early April, and the family was expected home sometime in May. The light brougham needed to be refurbished. Colonel Blantyre also had to return to his regiment, so Reuben was to drive him into town in the brougham and ride back afterward.

            Reuben brought a saddle along for the return journey, and I was chosen to take them.
        - id: ch02-b02
          speaker: narrator
          text: >-
            At the station, Colonel Blantyre put some money into Reuben's hand and said goodbye.
        - id: ch02-b03
          speaker: blantyre
          text: >-
            Look after your young mistress, Reuben. And don't let some foolish young gentleman ride Black Auster all over the place. Keep him for Lady Anne.
        - id: ch02-b04
          speaker: narrator
          text: >-
            We took the carriage to the maker's shop. Then Reuben rode me to the White Lion and told the hostler to give me a good feed and have me ready by four.

            One of the nails in my front shoes had begun to work loose on the way into town. The hostler did not see it until almost four o'clock. Reuben did not enter the yard until five. He said he had met some old friends and would not be leaving until six.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The hostler told him about the loose nail and asked whether he should have someone examine the shoe.
        - id: ch02-b06
          speaker: hostler
          text: >-
            Shall I get that shoe looked at before you go, Mr. Smith?
        - id: ch02-b07
          speaker: reuben_smith
          text: >-
            No. It'll hold until we get home.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Reuben spoke loudly and carelessly. That did not sound like him at all. Usually, he was extremely particular about any loose nail in our shoes.

            Six o'clock passed, and he did not come. Then seven passed, and eight. It was nearly nine before he finally called for me. His voice was loud and harsh. He seemed to be in a foul temper, and he shouted abuse at the hostler, though I could not understand why.
    - id: ch03
      title: The Ride in the Dark
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The landlord was standing in the doorway as we set out. He called a warning after Reuben.
        - id: ch03-b02
          speaker: landlord
          text: >-
            Be careful, Mr. Smith!
        - id: ch03-b03
          speaker: narrator
          text: >-
            Reuben answered angrily with an oath. Before we were even clear of the town, he drove me into a gallop. Again and again, he struck me sharply with his whip, though I was already running at full speed.

            The moon had not risen, and the night was very dark. The roads had recently been repaired, so they were covered with stones. As I raced over them, my shoe worked looser and looser. Near the turnpike gate, it came off completely.
        - id: ch03-b04
          speaker: narrator
          text: >-
            If Reuben had been in his right mind, he would have felt the change in my stride and known something was wrong. But he was too drunk to notice.

            Beyond the turnpike stretched a long section of road where fresh stones had just been laid. They were large and sharp. No horse could travel quickly over them without danger.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Still, Reuben forced me to gallop over that road as fast as I could, with one front shoe gone. He kept cutting me with the whip and shouting wild curses, demanding that I go even faster.

            My bare foot suffered terribly. The sharp stones broke and split the hoof all the way down to the tender flesh. They cut the inside of it badly too.
        - id: ch03-b06
          speaker: narrator
          text: >-
            It could not continue. No horse could keep his footing in such pain on a road like that.

            I stumbled. I crashed down hard on both knees, and the fall threw Reuben from my back. At the speed we had been going, he must have struck the ground with tremendous force.
    - id: ch04
      title: Under the Moon
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            I was soon on my feet again. I limped to the side of the road, where there were no stones.

            The moon had just climbed above the hedge. In its light, I could see Reuben lying a few yards away. He did not get up. He made one small attempt to rise, and then I heard a deep groan.
        - id: ch04-b02
          speaker: narrator
          text: >-
            I could have groaned too. The pain in my foot and both knees was intense. But horses learn to suffer silently. I made no sound. I only stood and listened.

            One more heavy groan came from Reuben. By then he lay in the full moonlight, but I could see no movement.
        - id: ch04-b03
          speaker: narrator
          text: >-
            I could do nothing for him, and nothing for myself. How desperately I listened for a horse, a carriage, or even footsteps. Few people used that road. At such a late hour, we might be there for many hours before anyone came.

            So I stood watching and listening.
        - id: ch04-b04
          speaker: narrator
          text: >-
            It was a calm, sweet April night. The only sounds were a few soft notes from a nightingale. Nothing moved except the white clouds near the moon and a brown owl gliding over the hedge.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The quiet night carried my thoughts back to summers long ago, when I used to lie beside my mother in the pleasant green meadow at Farmer Grey's.
