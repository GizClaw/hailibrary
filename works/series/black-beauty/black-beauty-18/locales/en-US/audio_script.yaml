audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    john:
      display_name: John Manly
      tts:
        delivery: steady, good-humored, and deeply sincere
        timbre: mature and grounded
        pace: unhurried
        pitch: medium-low
    squire:
      display_name: Squire Gordon
      tts:
        delivery: dignified, direct, and caring
        timbre: mature and resonant
