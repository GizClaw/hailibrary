  chapters:
    - id: ch01
      title: The Bell in the Night
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A few nights after James left, I finished my hay and fell fast asleep in the straw. Then the stable bell rang out, loud and sudden. I heard John rush from his house to the hall. Almost at once, he came running back, unlocked the stable, and called to me.
        - id: ch01-b02
          speaker: john
          text: >-
            Wake up, Beauty! Tonight you must run better than you ever have before.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Before I could gather my thoughts, the saddle was on my back and the bridle was over my head. John ran for his coat, then trotted me quickly to the hall door. The squire stood waiting with a lamp.
        - id: ch01-b04
          speaker: squire
          text: >-
            John, ride as if a life depends on it, because your mistress's life does. We can't lose a moment. Take this note to Doctor White. Rest Beauty at the inn, then come back as quickly as you can.
          emotion: fearful
        - id: ch01-b05
          speaker: john
          text: >-
            Yes, sir.
        - id: ch01-b06
          speaker: narrator
          text: >-
            John was on my back in an instant. The gardener at the lodge had heard the bell and already had the gate open. We raced through the park, through the village, and down the hill to the tollgate. John shouted and pounded on the door until the keeper hurried out and swung the gate wide.
        - id: ch01-b07
          speaker: john
          text: >-
            Leave this gate open for the doctor. Here's the toll.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Then we were off again.
    - id: ch02
      title: Eight Miles to Town
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            A long, level road stretched beside the river.
        - id: ch02-b02
          speaker: john
          text: >-
            Now, Beauty, give me everything you've got.
        - id: ch02-b03
          speaker: narrator
          text: >-
            And I did. I needed no whip and no spur. For two miles, I galloped as fast as my feet could strike the ground. I don't believe even my grandfather, who won a race at Newmarket, could have run faster.

            At the bridge, John slowed me a little and patted my neck.
        - id: ch02-b04
          speaker: john
          text: >-
            That's it, Beauty! Well done, old fellow.
          emotion: happy
        - id: ch02-b05
          speaker: narrator
          text: >-
            John would have let me ease my pace, but my blood was up. I sprang forward just as fast as before. The air was frosty, the moon shone bright, and running felt wonderful. We passed through another village, a dark wood, up one hill and down another.

            After eight miles, we reached the town. My hoofbeats rang over the stones of the silent streets while everyone slept. The church clock struck three just as we stopped at Doctor White's door. John rang twice, then hammered on the door. A window flew open, and the doctor leaned out in his nightcap.
        - id: ch02-b06
          speaker: doctor_white
          text: >-
            Who is it? What do you need?
        - id: ch02-b07
          speaker: john
          text: >-
            Mrs. Gordon is dangerously ill, sir. The master needs you there right away. He believes she'll die if you don't come. I have his note.
          emotion: fearful
        - id: ch02-b08
          speaker: doctor_white
          text: >-
            Wait there. I'm coming down.
    - id: ch03
      title: The Doctor Takes the Saddle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The window closed, and Doctor White soon appeared at the door.
        - id: ch03-b02
          speaker: doctor_white
          text: >-
            Here's the trouble. My horse worked all day and has nothing left. My son was called away and took the other horse. What can we do? May I ride yours?
        - id: ch03-b03
          speaker: john
          text: >-
            Beauty galloped almost the whole way, sir, and I was told to rest him here. Still, I don't think the master would object if you believe this is necessary.
        - id: ch03-b04
          speaker: doctor_white
          text: >-
            Good. I'll be ready in a moment.
        - id: ch03-b05
          speaker: narrator
          text: >-
            John stayed beside me, stroking my neck while I stood there burning hot. The doctor returned carrying his riding whip.
        - id: ch03-b06
          speaker: john
          text: >-
            You can leave that behind, sir. Black Beauty will keep going until he falls. Please be careful with him if you can. I'd hate for anything to happen to him.
        - id: ch03-b07
          speaker: doctor_white
          text: >-
            Of course, John. I hope no harm comes to him.
        - id: ch03-b08
          speaker: narrator
          text: >-
            A minute later, we had left John far behind.
    - id: ch04
      title: Home and Shivering
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            I won't tell the whole story of that ride back. The doctor was heavier than John and not nearly as good a rider, but I gave him my best. The tollgate stood open for us. At the hill, the doctor pulled me up.
        - id: ch04-b02
          speaker: doctor_white
          text: >-
            Easy now, good fellow. Stop and catch your breath.
          emotion: calm
        - id: ch04-b03
          speaker: narrator
          text: >-
            I was thankful. I had almost nothing left, but that short rest helped me reach the park. Joe waited at the lodge gate. My master stood at the hall door because he had heard us coming. He didn't say a word. He took the doctor inside, and Joe led me to the stable.

            I was glad to be home, but my legs shook beneath me. All I could do was stand and gasp. Not one hair on me was dry. Water streamed down my legs, and steam rose from my whole body. Joe used to say I looked like a pot over the fire.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Poor Joe was young and small, and he still knew very little. His father could have helped him, but he had been sent to the next village. Joe did the best he knew. He rubbed my chest and legs, but he didn't cover me with my warm cloth. Since I was so hot, he thought I wouldn't want it.

            Then he brought me a full pail of cold water. It tasted wonderful, and I drank every drop. He gave me hay and corn, thought he had done everything right, and went away.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Before long, I began to shake and tremble. A deadly cold came over me. My legs hurt. My back hurt. My chest hurt. I was sore everywhere. How I longed for my thick, warm cloth as I stood there shivering. I wanted John, but he had eight miles to walk. At last, I lay down in the straw and tried to sleep.

            Much later, I heard John at the door. I let out a low moan because the pain was so great. He was beside me at once, bending down close. I couldn't tell him what was wrong, but somehow he understood. He covered me with two or three warm cloths, then ran to the house for hot water. He made warm gruel for me to drink. After that, I think I fell asleep.
        - id: ch04-b06
          speaker: narrator
          text: >-
            John was terribly upset. I heard him muttering the same words again and again.
        - id: ch04-b07
          speaker: john
          text: >-
            Foolish boy! No blanket, and I'll bet the water was cold too. Boys are no use at all!
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: >-
            But Joe really was a good boy.
    - id: ch05
      title: What the Run Had Saved
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            By then, I was very sick. A severe inflammation had settled in my lungs, and every breath hurt. John cared for me day and night. He got up two or three times each night just to check on me. My master often came too. One day, he stood beside me and spoke.
        - id: ch05-b02
          speaker: squire
          text: >-
            My poor Beauty. My good horse, you saved your mistress's life. Yes, Beauty, you saved her.
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: >-
            I was very glad to hear it. The doctor had said that if we'd arrived even a little later, it would have been too late. John told my master he had never seen a horse run so fast. It was almost as though the horse understood what was happening, he said.

            Of course I understood, though John didn't think so. At least I knew this much. John and I had to go as fast as we possibly could, and we were doing it for our mistress.
