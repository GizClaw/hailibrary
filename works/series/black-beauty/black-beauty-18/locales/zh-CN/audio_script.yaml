audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    john:
      display_name: 约翰
      tts:
        delivery: 稳重耐心，谈起马匹时专业而亲切
        timbre: 温厚沉稳
        pace: 从容
        pitch: 中低
    squire:
      display_name: 主人
      tts:
        delivery: 宽厚庄重，紧要关头果断而克制
        timbre: 深沉清晰
        pace: 沉稳
        pitch: 中低
    doctor_white:
      display_name: 怀特医生
      tts:
        delivery: 干练直接，行医时镇定而体恤
        timbre: 成熟厚实
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 深夜的铃声
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 詹姆斯走了几天以后，有天夜里，我吃完干草，躺在麦秸上睡得正沉。马厩铃忽然大响，把我惊醒了。我听见约翰打开家门，跑向大宅。没过一会儿，他又跑回来，开门冲进马厩。
        - id: ch01-b02
          speaker: john
          text: 醒醒，黑骏马！这一次，你可得使出全部本事来！
        - id: ch01-b03
          speaker: narrator
          text: 我还没反应过来，他已经给我安好马鞍，套上辔头。约翰回去抓起外套，便带着我快步小跑到大宅门前。主人提着灯，正在那里等候。
        - id: ch01-b04
          speaker: squire
          text: 约翰，拼命赶吧。你是在救女主人的命，一刻也不能耽误。把这封信送给怀特医生，让马在客店歇一歇，再尽快回来。
        - id: ch01-b05
          speaker: john
          text: 是，先生，我这就去。
        - id: ch01-b06
          speaker: narrator
          text: 约翰立刻骑到我背上。住在门房的园丁听见铃声，已经把大门打开了。我们冲出庄园，奔过村子，一路下坡，赶到收费关卡。约翰一边大声呼喊，一边用力捶门。守关人很快跑出来，拉开栏门。
        - id: ch01-b07
          speaker: john
          text: 先让门开着，医生待会儿要从这里过。这是过路钱。
        - id: ch01-b08
          speaker: narrator
          text: 话音刚落，我们又向前飞奔。
    - id: ch02
      title: 月下飞奔
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 前方是一条沿着河岸伸展开的平路。
        - id: ch02-b02
          speaker: john
          text: 黑骏马，现在看你的了。尽全力跑吧！
        - id: ch02-b03
          speaker: narrator
          text: 我真的用尽了全力。根本不需要鞭子，也不需要马刺。整整两英里，我的四蹄能落多快，就跑多快。那一刻，我想，就算那位在纽马克特赛马中得过冠军的老祖父，也未必胜得过我。
        - id: ch02-b04
          speaker: narrator
          text: 到了桥边，约翰稍稍把我收住，还拍了拍我的脖子。
        - id: ch02-b05
          speaker: john
          text: 跑得真好，黑骏马！好伙计！
        - id: ch02-b06
          speaker: narrator
          text: 他原想让我慢下来，可我已经跑得兴起，转眼又恢复了先前的速度。寒夜里的空气清冽，月光明亮，跑起来十分痛快。我们穿过村庄，又穿过一片黑沉沉的树林，翻过上坡，再冲下坡。一路跑了八英里，我们终于进城，沿街来到集市广场。
        - id: ch02-b07
          speaker: narrator
          text: 所有人都睡着了，四周静悄悄的，只有我的铁蹄敲着石路，嗒嗒作响。我们停在怀特医生门前，教堂的钟正好敲了三下。约翰拉了两次门铃，又把门敲得像雷响。一扇窗猛地打开，怀特医生戴着睡帽，把头探了出来。
        - id: ch02-b08
          speaker: doctor_white
          text: 出什么事了？
        - id: ch02-b09
          speaker: john
          text: 戈登太太病得很重，先生。主人请您立刻过去。他说，您要是赶不到，她恐怕会没命。这是给您的信。
        - id: ch02-b10
          speaker: doctor_white
          text: 在这儿等着，我马上下来。
        - id: ch02-b11
          speaker: narrator
          text: 医生关上窗，很快便到了门口。
        - id: ch02-b12
          speaker: doctor_white
          text: 可现在有个麻烦。我的马在外面跑了一整天，已经累垮了。我儿子刚刚也出了诊，骑走了另一匹马。眼下该怎么办？我能骑你的马去吗？
        - id: ch02-b13
          speaker: john
          text: 先生，他这一路几乎全是飞奔过来的，主人还吩咐我让他在这儿休息。不过，既然您认为非这样不可，我想主人不会反对。
        - id: ch02-b14
          speaker: doctor_white
          text: 好，我马上准备。
        - id: ch02-b15
          speaker: narrator
          text: 约翰守在我身旁，轻轻抚摸我的脖子。我的全身都烫得厉害。医生出来时，手里还拿着马鞭。
        - id: ch02-b16
          speaker: john
          text: 先生，别带马鞭了。黑骏马会一直跑，直到自己倒下。请您尽量照顾好他，我不愿他受一点伤。
        - id: ch02-b17
          speaker: doctor_white
          text: 放心吧，约翰，我也希望他不会出事。
        - id: ch02-b18
          speaker: narrator
          text: 转眼之间，我和医生已经把约翰远远留在了身后。
    - id: ch03
      title: 筋疲力尽地回家
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 回去的那段路，我就不一一细说了。医生的身子比约翰重，骑马也没有约翰那么稳，可我仍旧拼尽全力。收费关卡已经为我们开着。到了山坡，医生终于收住了我。
        - id: ch03-b02
          speaker: doctor_white
          text: 好伙计，先喘几口气吧。
        - id: ch03-b03
          speaker: narrator
          text: 我已经快撑不住了，真庆幸他肯让我歇一歇。这几口喘息给了我继续赶路的力气。很快，我们进了庄园。乔等在门房的大门旁，主人听见蹄声，也已经来到大宅门口。他什么也没说，直接带医生进屋。乔则牵着我回到马厩。
        - id: ch03-b04
          speaker: narrator
          text: 我很高兴自己终于回了家，可两条前腿和两条后腿全在发抖，我只能站在那里不停喘气。浑身没有一根干毛，水沿着腿向下流，热气从身上直往外冒。乔后来常说，我当时活像炉火上的一口锅。
        - id: ch03-b05
          speaker: narrator
          text: 可怜的乔年纪小，个子也小，还没学会多少东西。他父亲原本能帮他，却被派去了邻村。我相信乔已经尽力去做所有自己懂得的事。他替我揉了腿和胸口，却没给我披上暖和的马衣。他觉得我这么热，一定不想盖东西。
        - id: ch03-b06
          speaker: narrator
          text: 接着，他给我一大桶冷水。那水喝起来太痛快了，我一口气全喝光了。乔又拿来干草和燕麦，以为已经把我照料妥当，便走了。
        - id: ch03-b07
          speaker: narrator
          text: 不久，我开始不停打战，身上冷得要命。腿痛，腰痛，胸口也痛，仿佛哪儿都疼。我站在那里发抖，只盼着有人把厚实暖和的马衣披到我身上。我也盼着约翰，可他得走上八英里才能回来。我只好躺进麦秸，试着睡一会儿。
        - id: ch03-b08
          speaker: narrator
          text: 过了很久，我终于听见约翰到了门口。身上的剧痛让我低声呻吟。他一下子赶到我身边，俯下身来。我说不出自己有多难受，可约翰仿佛全都明白。他给我盖上两三条暖毯，又跑去大宅取热水。随后，他调好热麦粥给我喝。喝完以后，我大概睡着了。
        - id: ch03-b09
          speaker: narrator
          text: 约翰气得不轻。我听见他一次又一次地嘟囔。
        - id: ch03-b10
          speaker: john
          text: 这个笨孩子！这个笨孩子！马衣也没披，给他的水肯定还是冷的。小孩子就是靠不住！
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: 可乔毕竟是个好孩子。
    - id: ch04
      title: 救下女主人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这一次，我病得非常重。肺部发了炎，每吸一口气都疼。约翰白天黑夜地护理我，夜里也会起来两三次，专程到马厩看我。主人同样常来看望我。有一天，他站在我身边开了口。
        - id: ch04-b02
          speaker: squire
          text: 我可怜的黑骏马，我的好马。你救了女主人的命。黑骏马，真的是你救了她。
        - id: ch04-b03
          speaker: narrator
          text: 听到这句话，我心里非常高兴。医生说过，我们要是再晚到一会儿，就来不及了。约翰也告诉主人，他这辈子从没见过哪匹马跑得那么快。看上去，那匹马简直明白发生了什么。
        - id: ch04-b04
          speaker: narrator
          text: 我当然明白，尽管约翰以为我不懂。至少有一件事，我从头到尾都知道。我和约翰必须用最快的速度赶路，因为我们是在救女主人。
