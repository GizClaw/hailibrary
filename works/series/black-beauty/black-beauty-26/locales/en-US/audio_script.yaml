  chapters:
    - id: ch01
      title: How it Ended
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            It must have been close to midnight when I heard a horse far away. At times the hoofbeats faded. Then they came back, clearer and closer.

            The road to Earlshall ran through the earl's woods, and that was where the sound came from. I hoped someone was looking for us. As the horse drew nearer, I began to recognize Ginger's step. A little later, I could tell she was pulling the dog-cart.
        - id: ch01-b02
          speaker: narrator
          text: >-
            I neighed as loudly as I could. Ginger answered, and I heard men's voices. They came slowly over the stones and stopped beside the dark shape on the ground.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One man jumped down and bent over the body.
        - id: ch01-b04
          speaker: robert
          text: >-
            It's Reuben. He isn't moving!
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: >-
            The other man climbed down and leaned over him too.
        - id: ch01-b06
          speaker: ned
          text: >-
            He's dead. Feel his hands. They're cold.
        - id: ch01-b07
          speaker: narrator
          text: >-
            They lifted Reuben, but there was no life in him. His hair was soaked with blood. They laid him down again, came over to me, and quickly saw the cuts on my knees.
        - id: ch01-b08
          speaker: unidentified_man
          text: >-
            The horse went down and threw him! Who ever thought the black horse could fall? No one did. Reuben must have been here for hours. And isn't it strange that the horse stayed right where it happened?
        - id: ch01-b09
          speaker: narrator
          text: >-
            Robert tried to lead me on. I took one step and nearly fell again.
        - id: ch01-b10
          speaker: robert
          text: >-
            Wait! His foot is hurt too, not just his knees. Look at that hoof. It's cut to pieces. No wonder the poor fellow fell.

            Ned, I don't think Reuben was himself tonight. Imagine riding a horse over these stones with a shoe missing. If he'd been thinking clearly, he might as well have tried to ride him over the moon. I'm afraid it was the old trouble again.

            Poor Susan. She was terribly pale when she came to ask if he'd been by my house. She pretended she wasn't worried and named all sorts of things that might have delayed him. But she still begged me to ride out and meet him.

            Now what can we do? We have to get both Reuben and the horse home, and neither will be easy.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The two men talked it over. In the end, they agreed that Robert, who was a groom, would lead me, while Ned took Reuben's body.

            Getting him into the dog-cart was hard because no one could hold Ginger. But she understood what was happening as well as I did, and she stood as still as stone. I noticed it because standing patiently was the one thing she was not usually good at.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Ned set off very slowly with his sad load. Robert examined my foot once more, wrapped his handkerchief tightly around it, and began leading me home.

            I will never forget that walk. We had more than three miles to go. Robert moved very slowly, and I limped and hobbled beside him as well as I could, though every step hurt badly. I knew he felt sorry for me. Again and again, he patted me, encouraged me, and spoke in a kind voice.
        - id: ch01-b13
          speaker: narrator
          text: >-
            At last, I reached my own stall and ate some corn. Robert covered my knees with wet cloths. Then he packed my foot in a warm bran poultice and tied it in place. That would draw out the heat and clean the wound before the horse doctor came in the morning.

            Somehow, I lowered myself onto the straw and slept in spite of the pain.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The next day, the farrier examined all my wounds.
        - id: ch01-b15
          speaker: farrier
          text: >-
            I hope the joint hasn't been hurt. If it hasn't, he'll still be fit for work. But those marks will never disappear.
        - id: ch01-b16
          speaker: narrator
          text: >-
            I believe they did everything they could to heal me well, but the cure took a long time and caused a great deal of pain.

            What they called proud flesh grew on my knees, and they burned it away with caustic. When the wounds had finally closed, they spread a blistering liquid across the front of both knees so all the hair would come off. They had some reason for doing it, and I suppose it was the right treatment.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Reuben Smith had died suddenly, with no one there to see what happened, so an inquest was held. The landlord and the hostler from the White Lion gave evidence, along with several other people. They said Reuben had been drunk when he left the inn.

            The tollgate keeper said Reuben rode through the gate at a hard gallop. My missing shoe was found among the stones. With all that evidence, the truth seemed clear to them, and they placed no blame on me.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Everyone felt sorry for Susan. Grief nearly drove her out of her mind. She kept crying the same words again and again.
        - id: ch01-b19
          speaker: susan
          text: >-
            Oh, he was so good. So good! It was that cursed drink. Why do they sell that cursed drink? Oh, Reuben! Reuben!
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: >-
            She went on that way until after Reuben was buried.

            Then Susan was left with no home and no family to help her. She and her six young children had to leave the pleasant cottage by the tall oak trees once again. They went back to the great, gloomy Union House.
