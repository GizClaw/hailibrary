audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    robert:
      display_name: 罗伯特
      tts:
        delivery: 朴实稳重，对马充满体恤
        timbre: 温厚清晰
        pace: 适中
        pitch: 中低
    ned:
      display_name: 内德
      tts:
        delivery: 沉着直接，面对惨事时语气凝重
        timbre: 粗朴低沉
        pace: 稍慢
        pitch: 低
    susan:
      display_name: 苏珊
      tts:
        delivery: 悲痛失措，话语反复而哽咽
        timbre: 柔弱沙哑
        pace: 时缓时急
        pitch: 中高
  chapters:
    - id: ch01
      title: 深夜的马蹄声
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我听见远处的马蹄声时，大概已经快到午夜了。那声音一会儿听不见，一会儿又响起来，而且越来越近。通往伯爵府的路穿过伯爵的树林，声音就是从那边传来的。我盼着有人出来找我们了。
        - id: ch01-b02
          speaker: narrator
          text: 马蹄声靠近以后，我几乎可以肯定，那是姜饼的步子。再听一会儿，我又认出她拉着双轮轻便马车。我立刻高声嘶鸣。姜饼也用嘶鸣回应了我，我还听见了男人的说话声，心里别提多高兴了。
        - id: ch01-b03
          speaker: narrator
          text: 他们沿着石路缓缓走来，在地上那团黑影旁停住。一个男人跳下车，弯腰看了看。
        - id: ch01-b04
          speaker: robert
          text: 是鲁本。他怎么一点儿也不动！
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: 另一个男人也跟着下来，俯身察看鲁本。
        - id: ch01-b06
          speaker: ned
          text: 他已经死了。你摸摸，他的手都冷透了。
        - id: ch01-b07
          speaker: narrator
          text: 两人把鲁本扶起来，可他已经没有气息，头发被血浸得湿透。他们只好把他重新放下，又来到我身边，很快就看见了我双膝上的伤。
        - id: ch01-b08
          speaker: ned
          text: 原来是马摔倒，把鲁本甩下来了！谁能想到这匹黑马会跌倒呢？大家都以为他绝不会失足。鲁本恐怕已经在这里躺了几个钟头。可这匹马为什么一直守在原地？
        - id: ch01-b09
          speaker: narrator
          text: 罗伯特牵着我，想让我往前走。我刚迈出一步，就差点再次倒下。
    - id: ch02
      title: 鲁本又犯了老毛病
      blocks:
        - id: ch02-b01
          speaker: robert
          text: 喂，他伤的不只是膝盖，脚也坏了。你看看，蹄子被割得乱七八糟。难怪这可怜的家伙会摔倒！
          emotion: surprised
        - id: ch02-b02
          speaker: robert
          text: 内德，我看鲁本今晚很不对劲。少了一只蹄铁，他还让马跑过这种石头路。若是头脑清醒，他宁可骑着马越过月亮，也不会这么干。恐怕他的老毛病又犯了。
        - id: ch02-b03
          speaker: robert
          text: 可怜的苏珊来我家问过，想知道鲁本是不是还没有回去。她脸白得吓人，却硬说自己一点儿也不担心，还说了许多可能耽搁他的理由。可她最后还是求我出来接他。
        - id: ch02-b04
          speaker: robert
          text: 眼下该怎么办？尸首要运回去，这匹马也得带回去。两件事都不好办。
        - id: ch02-b05
          speaker: narrator
          text: 他们商量了一会儿，决定由马夫罗伯特牵我回去，内德用车运走鲁本的尸首。可没人能腾出手拉住姜饼，要把尸首抬上车十分困难。
        - id: ch02-b06
          speaker: narrator
          text: 姜饼和我一样，完全明白发生了什么。她站得像块石头，一动也不动。我特别留意到这一点，因为她若有什么毛病，就是停在原地时总会不耐烦。
        - id: ch02-b07
          speaker: narrator
          text: 内德载着那令人悲伤的重负，极慢地出发了。罗伯特又检查了一遍我的脚，拿出手帕紧紧裹住伤处，这才牵着我往家走。
    - id: ch03
      title: 漫长的归途
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 那一夜的路，我永远也忘不了。回家有三英里多，罗伯特只能领着我一点点往前挪。我痛得厉害，还是尽力一瘸一拐地跟着他。
        - id: ch03-b02
          speaker: narrator
          text: 我知道罗伯特很心疼我。他一路上常常拍拍我，替我鼓劲，还用温和的声音陪我说话。
        - id: ch03-b03
          speaker: narrator
          text: 我总算回到自己的马厩隔间，吃了一些谷料。罗伯特先用湿布裹好我的双膝，又在伤蹄上敷了麦麸膏，仔细扎紧。这样能拔去热毒，也能清洁伤口，等到早晨再让马医查看。我勉强在稻草上躺下来，虽然伤处还在疼，最后还是睡着了。
        - id: ch03-b04
          speaker: narrator
          text: 第二天，蹄铁匠检查了我的伤。他说，只要关节没有受损，我以后干活就不受影响。不过，那些伤疤再也不会消失。
        - id: ch03-b05
          speaker: narrator
          text: 大家确实尽力替我医治，可我熬了很久，也吃了不少苦。膝盖上长出他们所说的赘肉，得用腐蚀剂烧掉。等伤口好不容易愈合，他们又在两个膝盖正面涂上发泡药水，把那里的毛全弄掉。他们这样做一定有道理，我想不会错。
    - id: ch04
      title: 调查与离别
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 史密斯突然死去，出事时身边又没有目击者，因此人们举行了死因调查。白狮客店的老板、马夫，还有另外几个人都出来作证。他们说，史密斯离开客店时已经醉了。
        - id: ch04-b02
          speaker: narrator
          text: 收费关卡的看守也说，史密斯骑着我从关口飞奔而过。后来，人们又在石路上找到了我脱落的蹄铁。证据已经很清楚，我也被免去了一切罪责。
        - id: ch04-b03
          speaker: narrator
          text: 大家都很同情苏珊。她几乎失去了理智，只会一遍又一遍地念叨。
        - id: ch04-b04
          speaker: susan
          text: 他原本那么好，那么好啊！全是那该诅咒的酒害了他！那些人为什么还要卖这种该诅咒的酒？鲁本，鲁本啊！
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: 她就这样反复说着，直到鲁本下葬。鲁本下葬以后，苏珊没有家，也没有亲人可以投靠。她只得带上六个年幼的孩子，再一次离开高大橡树旁那个舒适的家，搬进那座又大又阴森的济贫院。
