audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    jerry:
      display_name: 杰里·巴克
      tts:
        delivery: 爽朗亲切，说起原则时坚定而不说教
        timbre: 结实温暖
        pace: 明快平稳
        pitch: 中低
    polly:
      display_name: 波莉·巴克
      tts:
        delivery: 温柔务实，谈到家人时沉静而坚决
        timbre: 温暖柔和
        pace: 舒缓
        pitch: 中
    harry:
      display_name: 哈里
      tts:
        delivery: 活泼顽皮，说话爽脆
        timbre: 清亮稚嫩
        pace: 偏快
        pitch: 中高
    dolly:
      display_name: 朵莉
      tts:
        delivery: 天真亲近，带着孩子的好奇
        timbre: 轻柔稚嫩
        pace: 适中
        pitch: 高
  chapters:
    - id: ch01
      title: 杰里的选择
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天下午，我们刚驶进院子，波莉便迎了出来，叫住了杰里。
        - id: ch01-b02
          speaker: polly
          text: 杰里，B先生刚来问过你的选票。他还想在选举那天租咱们的马车，说等会儿再来听你的答复。
        - id: ch01-b03
          speaker: jerry
          text: 那你就告诉他，我的车已经另有差事。我可不想让他们把大张告示贴满车身，更不想赶着杰克和上尉，在一家家酒馆之间飞跑，去接那些喝得半醉的选民。这是在侮辱马儿，我不干。
        - id: ch01-b04
          speaker: polly
          text: 不过，你会把票投给那位先生吧？他说你们的政见是一样的。
        - id: ch01-b05
          speaker: jerry
          text: 有些事情上是一样，可我不会投给他。波莉，你知道他做的是什么买卖。
        - id: ch01-b06
          speaker: polly
          text: 我知道。
        - id: ch01-b07
          speaker: jerry
          text: 靠那门买卖发了财的人，别的方面也许还不错，可他根本不明白劳动者需要什么。凭良心说，我不能送他进议会制定法律。他们大概会生气，可每个人都得照自己认定的方式，为国家尽心。
    - id: ch02
      title: 泥点与党派颜色
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 选举前一天早晨，杰里正把我套进车辕，朵莉突然哭着跑进院子。她的蓝色小裙子和白围裙上，到处都溅着泥点。
        - id: ch02-b02
          speaker: jerry
          text: 朵莉，怎么了？出了什么事？
        - id: ch02-b03
          speaker: dolly
          emotion: sad
          text: 那些坏孩子把泥巴扔了我一身，还骂我是个蓝色的小破……破……
        - id: ch02-b04
          speaker: narrator
          text: 哈里也跑了进来，脸上还带着怒气。他替妹妹说出了那个骂人的称呼。
        - id: ch02-b05
          speaker: harry
          emotion: angry
          text: 爸爸，他们骂她是穿蓝衣的小叫花子！不过我已经收拾过他们了。他们不会再欺负我妹妹。我狠狠揍了他们一顿，准叫他们忘不了。那群拥护橙党的家伙，又胆小又卑鄙！
        - id: ch02-b06
          speaker: narrator
          text: 杰里亲了亲朵莉，让她去找妈妈。
        - id: ch02-b07
          speaker: jerry
          text: 乖宝贝，进去告诉妈妈，我看你今天还是留在家里，帮她做点事吧。
        - id: ch02-b08
          speaker: narrator
          text: 接着，杰里转身望着哈里，神情严肃起来。
        - id: ch02-b09
          speaker: jerry
          text: 孩子，我希望你永远保护妹妹。谁欺负她，你就狠狠教训他，这没有错。可你记住，我的院子里不许有选举时那套粗野行径。
        - id: ch02-b10
          speaker: jerry
          text: 蓝党里有坏蛋，橙党里也一样。白的、紫的，不管什么颜色，都少不了这种人。我不许家里任何人掺和进去。女人和孩子也会为一种颜色吵起来，可十个人里，未必有一个真知道自己在争什么。
    - id: ch03
      title: 真正的自由
      blocks:
        - id: ch03-b01
          speaker: harry
          text: 可是爸爸，我还以为蓝色代表自由呢。
        - id: ch03-b02
          speaker: jerry
          text: 孩子，自由不是从颜色里来的。颜色只说明你站在哪个党派。那些颜色能给你什么自由？无非是花别人的钱喝个烂醉，坐肮脏的旧马车去投票，辱骂每个不戴你那种颜色的人，再为了自己只懂一半的事情，喊到嗓子都哑掉。这就叫自由吗？
        - id: ch03-b03
          speaker: harry
          text: 哎呀，爸爸，你是在逗我吧。
        - id: ch03-b04
          speaker: jerry
          text: 不，哈里，我说的是真话。那些人本来应该懂事些，却闹成这个样子，我看着都替他们害臊。选举是件很严肃的事，至少本来应该是。每个人都该凭自己的良心投票，也该让邻人照他自己的良心去投。
