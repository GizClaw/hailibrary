  chapters:
    - id: ch01
      title: Jerry's Vote
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One afternoon, as we came into the yard, Polly stepped outside to meet us.
        - id: ch01-b02
          speaker: polly
          text: >-
            Jerry, Mr. B---- came by to ask how you're voting. He also wants to hire your cab for the election. He'll come back for your answer.
        - id: ch01-b03
          speaker: jerry
          text: >-
            Then tell him my cab is already busy. I don't want it covered with those huge campaign bills. And I won't make Jack and Captain race from one public house to another, picking up voters who are half drunk. That would be an insult to the horses. No, I won't do it.
        - id: ch01-b04
          speaker: polly
          text: >-
            But you'll vote for the gentleman, won't you? He said you agreed with his politics.
        - id: ch01-b05
          speaker: jerry
          text: >-
            I agree with him about some things, but I'm not voting for him. You know what business he's in, Polly.
        - id: ch01-b06
          speaker: polly
          text: >-
            Yes, I do.
        - id: ch01-b07
          speaker: jerry
          text: >-
            A man can grow rich in that trade and still be decent in some ways. But he doesn't understand what workingmen need. I couldn't honestly send him to help make the laws. His people may be angry with me, but every man has to do what he believes is best for his country.
    - id: ch02
      title: More Than a Color
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            On the morning before the election, Jerry was harnessing me to the cab. Dolly came into the yard sobbing. Mud was splattered all over her little blue dress and white pinafore.
        - id: ch02-b02
          speaker: jerry
          text: >-
            Why, Dolly, what's wrong?
        - id: ch02-b03
          speaker: dolly
          emotion: sad
          text: >-
            Those naughty boys threw dirt all over me. And they called me a little raga... raga...
        - id: ch02-b04
          speaker: narrator
          text: >-
            Harry ran into the yard, looking furious.
        - id: ch02-b05
          speaker: harry
          emotion: angry
          text: >-
            They called her a little blue ragamuffin, Father. But I taught them a lesson. They won't insult my sister again. I gave them a beating they'll remember, those cowardly, rotten orange blackguards.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Jerry kissed Dolly.
        - id: ch02-b07
          speaker: jerry
          text: >-
            Go inside to Mother, my pet. Tell her I think you should stay home today and help her.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Then he turned to Harry with a grave look.
        - id: ch02-b09
          speaker: jerry
          text: >-
            My boy, I hope you'll always stand up for your sister. Anyone who insults her deserves a good beating. That's only right. But listen. I won't allow any election name-calling in this yard. There are just as many blue blackguards as orange ones, and as many white as purple, or any other color. No one in my family is going to join in. Women and children are quarreling over colors now, and hardly one in ten even knows what the argument is about.
        - id: ch02-b10
          speaker: harry
          text: >-
            But Father, I thought blue stood for Liberty.
        - id: ch02-b11
          speaker: jerry
          text: >-
            Liberty doesn't come from a color, my boy. Colors only tell you which party a person supports. What kind of liberty do they bring? The liberty to get drunk at somebody else's expense. The liberty to ride to the polls in a filthy old cab. The liberty to insult anyone who won't wear your color, and to shout yourself hoarse about something you only half understand. That's their liberty!
        - id: ch02-b12
          speaker: harry
          text: >-
            Oh, Father, you're making fun of it.
        - id: ch02-b13
          speaker: jerry
          text: >-
            No, Harry, I mean every word. I'm ashamed when grown men who should know better behave this way. An election is serious. At least, it ought to be. Every man should vote according to his own conscience, and he should let his neighbor do the same.
