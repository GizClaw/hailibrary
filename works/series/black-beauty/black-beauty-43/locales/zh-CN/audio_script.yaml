audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    jerry:
      display_name: 杰里·巴克
      tts:
        delivery: 爽朗亲切，说起原则时坚定而不说教
        timbre: 结实温暖
        pace: 明快平稳
        pitch: 中低
    young_woman:
      display_name: 年轻母亲
      tts:
        delivery: 谦卑焦急，疼惜孩子时真挚而克制
        timbre: 柔弱疲惫
        pace: 适中
        pitch: 中高
    campaigner_1:
      display_name: 竞选人甲
      tts:
        delivery: 蛮横急躁，带着理所当然的傲慢
        timbre: 洪亮生硬
        pace: 偏快
        pitch: 中
    campaigner_2:
      display_name: 竞选人乙
      tts:
        delivery: 盛气凌人，虚张声势
        timbre: 粗哑厚重
        pace: 偏快
        pitch: 中低
    porter:
      display_name: 医院门房
      tts:
        delivery: 干脆利落，公事公办
        timbre: 响亮朴实
        pace: 明快
        pitch: 中
    former_mistress:
      display_name: 波莉从前的女主人
      tts:
        delivery: 亲切端庄，关心别人时诚恳细致
        timbre: 成熟柔润
        pace: 从容
        pitch: 中
  chapters:
    - id: ch01
      title: 忙乱的选举日
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            选举日终于来了，杰里和我从早忙个不停。先有一位胖先生喘着粗气，提着旅行包，要去毕晓普斯盖特车站。接着，一群人叫我们去摄政公园。下一趟，我们又到旁边的小街，接上一位焦急的老太太，把她送去银行，还得等她办完事，再送她回来。
        - id: ch01-b02
          speaker: narrator
          text: >-
            老太太刚下车，一位红脸先生就攥着一把文件跑来，累得上气不接下气。杰里还没来得及下车，他已经自己开门钻进车厢，催我们快去弓街警察局。我们载着他飞奔而去，又接了一两趟客人。等回到车站，别的出租马车全都出去了。
        - id: ch01-b03
          speaker: narrator
          text: 杰里赶紧给我套上饲料袋。
        - id: ch01-b04
          speaker: jerry
          text: 这种日子，只要有空就得吃。好好嚼吧，杰克，老伙计，能吃几口就多吃几口。
        - id: ch01-b05
          speaker: narrator
          text: >-
            袋里装着湿润的碎燕麦，还拌了一点麸皮。平日这就是美餐，此刻更让我又解饿又提神。杰里总是这样体贴，这样疼惜我。有这样的主人，哪匹马不肯尽力呢？他也拿出波莉做的肉馅饼，站在我身边吃起来。
        - id: ch01-b06
          speaker: narrator
          text: >-
            街上人挤人。各辆马车挂着候选人的颜色，在人群里横冲直撞，像是撞伤人、闹出人命也无所谓。那一天，我们亲眼看见两个人被撞倒，其中一个还是女人。可怜的马儿们吃尽苦头，车里的选民却不在乎。许多人已经半醉，看见本党的人经过，就探出车窗大声欢呼。
        - id: ch01-b07
          speaker: narrator
          text: 那是我头一回见识选举，也再不想见第二回了。不过后来听说，如今已经好了一些。
    - id: ch02
      title: 去医院的路
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            我和杰里还没吃上几口，一个穷苦的年轻女人抱着沉甸甸的孩子走来。她东张西望，显然已经迷了路。她问杰里，圣托马斯医院该往哪里走，还有多远。
        - id: ch02-b02
          speaker: narrator
          text: >-
            她早晨搭赶集的货车从乡下来，根本不知道伦敦正在选举，自己又从没来过这座城。她手里的医院收治单，是专门为小儿子拿到的。怀里的孩子有气无力地哭着，那哭声里全是病痛。
        - id: ch02-b03
          speaker: young_woman
          emotion: sad
          text: >-
            我这可怜的孩子疼得太厉害了。他已经四岁，却跟小婴儿一样，一步也走不了。医生说，只要能进医院，也许还有希望治好。求求您告诉我，先生，医院有多远？我该往哪里走？
        - id: ch02-b04
          speaker: jerry
          text: 大嫂，街上挤成这样，你怎么抱着孩子一路走过去？医院足足有三英里呢，这孩子又这么沉。
        - id: ch02-b05
          speaker: young_woman
          text: 是啊，愿上帝保佑他，他确实很沉。不过感谢上帝，我身子还结实。只要您告诉我路，我总能想法子走到。
        - id: ch02-b06
          speaker: jerry
          text: >-
            这可不行。你说不定会被人撞倒，孩子还会叫车轧着。来，上我的马车，我平安送你去医院。你看，马上就要下雨了。
        - id: ch02-b07
          speaker: young_woman
          text: 不行，先生，谢谢您的好意。我身上的钱只够回家，实在坐不起车。您给我指指路就好。
        - id: ch02-b08
          speaker: jerry
          text: >-
            听我说，大嫂。我家里也有妻子和几个心爱的孩子，我懂做父亲的心情。快上车吧，我不收钱。要是眼看一个女人抱着病孩子去冒险，我还不管，那才真该羞愧。
        - id: ch02-b09
          speaker: young_woman
          emotion: sad
          text: 愿上天保佑您！
        - id: ch02-b10
          speaker: narrator
          text: 她说着，眼泪一下涌了出来。
        - id: ch02-b11
          speaker: jerry
          emotion: calm
          text: 好了，别难过。很快就能到了。来，我扶你上车。
        - id: ch02-b12
          speaker: narrator
          text: >-
            杰里正要打开车门，两个男人跑了过来。他们的帽子和纽扣眼里，都插着竞选党派的彩带。
        - id: ch02-b13
          speakers: [campaigner_1, campaigner_2]
          ensemble: duo
          text: 我们要一辆马车！
        - id: ch02-b14
          speaker: jerry
          text: 对不起，这辆车已经有人订了。
        - id: ch02-b15
          speaker: narrator
          text: >-
            一个男人推开那女人，跳进车厢，另一个也跟着钻了进去。杰里板起脸来，严厉得活像一名警察。
        - id: ch02-b16
          speaker: jerry
          text: 两位先生，这辆车已经由那位女士雇下了。
        - id: ch02-b17
          speaker: campaigner_1
          text: >-
            什么女士？她等一等就是了。我们的事情要紧，再说我们先上了车，这车就该归我们。我们坐在这里不走了。
        - id: ch02-b18
          speaker: narrator
          text: 杰里脸上浮起一丝好笑的神情，随手替他们关好了车门。
        - id: ch02-b19
          speaker: jerry
          text: 行啊，两位先生。你们爱坐多久就坐多久。你们慢慢歇脚，我在这里等着。
        - id: ch02-b20
          speaker: narrator
          text: 说完，他转过身，走到站在我旁边的年轻女人面前。
        - id: ch02-b21
          speaker: jerry
          text: 别担心，他们马上就会走的。
        - id: ch02-b22
          speaker: narrator
          text: >-
            杰里笑了。那两人很快看穿了他的法子，只好下车。他们把能想到的难听话全骂了出来，又嚷着要记下车号，叫法院传杰里去受审。
    - id: ch03
      title: 圣托马斯医院门前
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            耽搁了一小会儿，我们便出发去医院。杰里尽量挑僻静的小街走。到了门口，他拉响那口大铃，又扶年轻女人下车。
        - id: ch03-b02
          speaker: young_woman
          text: 真不知该怎样谢您。要是靠我自己，怎么也到不了这里。
        - id: ch03-b03
          speaker: jerry
          text: 不用客气。愿这个可怜的孩子很快好起来。
        - id: ch03-b04
          speaker: narrator
          text: 杰里一直望着她走进大门，才轻声对自己说了一句话。
        - id: ch03-b05
          speaker: jerry
          text: 你们既做在我这弟兄中一个最小的身上……
        - id: ch03-b06
          speaker: narrator
          text: 随后，他拍了拍我的脖子。每逢有什么事令他欣慰，他总会这样做。
        - id: ch03-b07
          speaker: narrator
          text: >-
            这时雨越下越大。我们刚要从医院门前离开，大门又打开了，门房在里面叫住我们。
        - id: ch03-b08
          speaker: porter
          text: 请来一辆马车！
        - id: ch03-b09
          speaker: narrator
          text: 我们停了下来。一位太太走下台阶，杰里像是一眼便认出了她。她抬手掀开面纱。
        - id: ch03-b10
          speaker: former_mistress
          emotion: happy
          text: >-
            巴克！你是杰里迈亚·巴克吧？真高兴能在这里遇见你。你正是我眼下需要的朋友。今天在伦敦这一带，出租马车太难找了。
        - id: ch03-b11
          speaker: jerry
          emotion: happy
          text: 能为您效劳是我的荣幸，太太。幸好今天碰巧来了这里，我也打心眼儿里高兴。您要去哪里？
        - id: ch03-b12
          speaker: former_mistress
          text: >-
            请送我去帕丁顿车站。要是时间还早，我想一定会来得及，你就在路上把玛丽和孩子们的近况都讲给我听。
    - id: ch04
      title: 一番好意
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            我们及时赶到了车站。进了遮雨棚以后，那位太太没有马上离开，而是站在那里跟杰里谈了好一阵。我听着他们说话，才知道她从前是波莉的女主人。她仔细问过波莉的近况，又问起杰里的差事。
        - id: ch04-b02
          speaker: former_mistress
          text: 冬天赶出租马车，你的身体吃得消吗？我知道玛丽去年一直很替你担心。
        - id: ch04-b03
          speaker: jerry
          text: >-
            是的，太太。那场重咳一直缠到天气暖和才好。我只要在外面待得太晚，玛丽就免不了牵挂。这份活不分早晚，也不管刮风下雨，确实很磨人的身子。不过我眼下还过得去。再说，没有马儿让我照料，我准会觉得少了点什么。我从小就干这一行，换一门活计，恐怕反倒做不好。
        - id: ch04-b04
          speaker: former_mistress
          text: >-
            巴克，要是为这份活真把身体弄坏了，那太不值得。不只为了你自己，也得想想玛丽和孩子们。许多地方都缺好车夫和好马夫。哪天你觉得该放下出租马车的活了，一定要来告诉我。
        - id: ch04-b05
          speaker: narrator
          text: 她又托杰里向玛丽问好，接着往他手里放了些钱。
        - id: ch04-b06
          speaker: former_mistress
          text: 这是给两个孩子的，一人五先令。玛丽自然知道该怎么花。
        - id: ch04-b07
          speaker: narrator
          text: 杰里向她道谢，显得十分高兴。我们出了车站，忙完这漫长的一天，终于回到家。别人怎样我不知道，至少，我已经累坏了。
