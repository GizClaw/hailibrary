audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    john:
      display_name: 约翰
      tts:
        delivery: 稳重耐心，谈起马匹时专业而亲切
        timbre: 温厚沉稳
        pace: 从容
        pitch: 中低
    joe_green:
      display_name: 乔·格林
      tts:
        delivery: 年少温和，遇见不公时急切而坚定
        timbre: 清亮稚嫩
        pace: 稍快而清楚
        pitch: 中高
    carter:
      display_name: 车夫
      tts:
        delivery: 粗暴蛮横，醉怒时含混而凶狠
        timbre: 粗哑沉重
        pace: 急促
        pitch: 中低
    mr_clay:
      display_name: 克莱先生
      tts:
        delivery: 爽直果断，听到急事时认真利落
        timbre: 成熟厚实
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 送信路上
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 乔·格林学得很快，做事又专心又仔细。约翰渐渐信任他，把不少活儿交给他。不过，乔比同龄的孩子个子小，平时很少有人准他骑姜饼或我出去活动。
        - id: ch01-b02
          speaker: narrator
          text: 一天早晨，约翰驾着正义和行李车出门了。主人有一封短信，得立刻送到三英里外一位绅士家里。他让乔给我备好鞍，骑我送信，还叮嘱他一路稳稳地走。
        - id: ch01-b03
          speaker: narrator
          text: 信顺利送到，我们安静地踏上回程。到了砖场，我们看见一辆装满砖的重车。车轮深陷在黏硬的车辙里，怎么也出不来。车夫一边吼，一边狠命鞭打那两匹马。乔立刻勒住了我。
        - id: ch01-b04
          speaker: narrator
          text: 那情景真叫人难受。两匹马拼尽力气，一次次往前挣，车子却纹丝不动。汗从腿上和腰肋往下淌，它们喘得身侧不停起伏，全身肌肉都绷紧了。车夫还凶狠地扯着辕马的笼头，嘴里咒骂着，鞭子一下接一下落在马身上。
        - id: ch01-b05
          speaker: joe_green
          text: 快住手！车轮卡得那么死，它们根本拉不动。别再抽它们了！
        - id: ch01-b06
          speaker: narrator
          text: 车夫根本不理他，仍旧挥着鞭子。
        - id: ch01-b07
          speaker: joe_green
          text: 求你停下吧！我来帮你卸掉一些砖。车这么重，它们现在拉不出来！
        - id: ch01-b08
          speaker: carter
          text: 你这个没规矩的小混蛋，少来管我的事！管好你自己，我的事用不着你管！
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: 那人醉醺醺的，正暴跳如雷，说完又抽了一鞭。乔拨转我的头，我们立刻朝砖场主人的宅子飞奔。我不知道约翰会不会赞成这个速度，可乔和我都气坏了，谁也不想慢下来。
    - id: ch02
      title: 请克莱先生出面
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那所宅子就在路边。乔敲响大门，朝里面高声询问克莱先生在不在家。门一开，克莱先生亲自走了出来。
        - id: ch02-b02
          speaker: mr_clay
          text: 小伙子，你这么急，是乡绅今早有事吩咐吗？
        - id: ch02-b03
          speaker: joe_green
          text: 不是，克莱先生。您砖场里有个人，正把两匹马往死里抽。我劝他住手，他不听。我说帮忙卸下一些砖，他还是不肯。先生，我只好赶来告诉您，请您快去看看吧！
        - id: ch02-b04
          speaker: narrator
          text: 乔激动得连声音都发抖了。
        - id: ch02-b05
          speaker: mr_clay
          text: 谢谢你来告诉我，孩子。
        - id: ch02-b06
          speaker: narrator
          text: 克莱先生转身跑进去拿帽子，又在门口停了一下。
        - id: ch02-b07
          speaker: mr_clay
          text: 要是我把他送到治安法官面前，你肯为自己亲眼看见的事作证吗？
        - id: ch02-b08
          speaker: joe_green
          text: 我肯！我正愿意这么做！
        - id: ch02-b09
          speaker: narrator
          text: 克莱先生赶去砖场，我们也踏着轻快的小跑回了家。
    - id: ch03
      title: 人人都该管的事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一回到马厩，乔便从鞍上跳了下来。约翰看了看他，马上发觉不对。
        - id: ch03-b02
          speaker: john
          text: 乔，你这是怎么了？瞧你气得，浑身上下都像冒着火呢。
        - id: ch03-b03
          speaker: joe_green
          text: 我就是气得浑身冒火！
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: 乔又急又快地把事情从头讲了一遍。他平时一直是个安静温和的小家伙，如今竟被激怒成这样，实在叫人吃惊。
        - id: ch03-b05
          speaker: john
          text: 乔，你做得对。不管那个人最后会不会接到传票，你都没有做错。许多人看见了，只会骑马走开，说这事和自己无关。可只要亲眼看见残暴欺压的事，人人都该出面制止。孩子，你这次做得对。
        - id: ch03-b06
          speaker: narrator
          text: 听见约翰这样说，乔完全平静了。他为得到约翰的赞同而自豪，替我清蹄、擦身时，手上的力气也比平常足了。
    - id: ch04
      title: 站出来作证
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 他们正准备回去吃午饭，男仆来到马厩，说主人叫乔马上去他的私人房间。有人虐待马匹，被带到了主人面前，现在需要乔的证词。乔一直红到了额头，眼睛也亮了起来。
        - id: ch04-b02
          speaker: joe_green
          text: 好，我会把自己看到的全都说清楚。
        - id: ch04-b03
          speaker: john
          text: 先把衣服理整齐一点儿。
        - id: ch04-b04
          speaker: narrator
          text: 乔扯正领带，抻了抻短上衣，转眼就跑了。主人是本郡的治安法官之一，人们常把案子带来，请他裁断，或者决定下一步该怎么办。那会儿正是伙计们吃午饭的时候，马厩里安静了好一阵。
        - id: ch04-b05
          speaker: narrator
          text: 乔再进马厩时，满脸都是喜色。他亲热地拍了我一下。
        - id: ch04-b06
          speaker: joe_green
          text: 老伙计，我们绝不能眼看着这种事发生，对吧？
        - id: ch04-b07
          speaker: narrator
          text: 后来我们听说，乔把证词讲得十分清楚。那两匹马已经累得筋疲力尽，身上还有遭受毒打的伤痕。车夫因此被收押候审，很可能要坐两三个月的牢。
        - id: ch04-b08
          speaker: narrator
          text: 从那以后，乔身上有了惊人的变化。约翰笑着说，这一个星期里，他足足长高了一英寸。我相信真是这样。乔仍旧那么善良温和，可他做每件事，都比从前更有主见，也更坚决。仿佛就在那一刻，他从男孩一下长成了男人。
