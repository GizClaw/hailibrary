  chapters:
    - id: ch01
      title: Joe Green
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Joe Green was doing very well. He learned fast and paid such close attention to his work that John began trusting him with more and more. Still, Joe was small for his age, so he was rarely allowed to exercise Ginger or me.

            One morning, though, John had taken Justice out with the luggage cart. The master needed a note delivered at once to a gentleman who lived about three miles away. He told Joe to saddle me, carry the note, and be sure to ride at a steady pace.
        - id: ch01-b02
          speaker: narrator
          text: >-
            We delivered the note and were coming quietly home when we reached the brickfield. A cart loaded heavily with bricks was stuck there. Its wheels had sunk deep into the thick mud of the ruts. The carter was yelling and whipping his two horses without mercy.

            Joe stopped me. The sight was miserable. Both horses pulled and fought with all their strength, but the cart would not move. Sweat ran down their legs and sides. Their flanks heaved, and every muscle stood out with the strain. The man hauled fiercely at the lead horse's head, swearing and striking him again and again.
        - id: ch01-b03
          speaker: joe_green
          text: >-
            Hold on! Don't keep beating them like that. Those wheels are stuck so deep, the horses can't move the cart.
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: >-
            The carter ignored him and kept using the whip.
        - id: ch01-b05
          speaker: joe_green
          text: >-
            Stop, please! I'll help you take some bricks off. They can't pull that load out as it is.
          emotion: angry
        - id: ch01-b06
          speaker: carter
          text: >-
            You mind your own business, you rude little rascal, and I'll mind mine!
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: >-
            The man was wild with anger and had been drinking. He raised the whip and struck the horses once more.

            Joe turned me around. A moment later, we were galloping hard toward the master brickmaker's house. I don't know whether John would have approved of our speed. But Joe and I felt exactly the same. We were both so angry that neither of us could have gone any slower.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The house stood close to the road. Joe knocked at the door and called out.
        - id: ch01-b09
          speaker: joe_green
          text: >-
            Hello! Is Mr. Clay home?
        - id: ch01-b10
          speaker: narrator
          text: >-
            The door opened, and Mr. Clay himself stepped outside.
        - id: ch01-b11
          speaker: mr_clay
          text: >-
            Well, young man, you're certainly in a hurry. Does the squire have orders for me this morning?
        - id: ch01-b12
          speaker: joe_green
          text: >-
            No, Mr. Clay. There's a man in your brickyard beating two horses nearly to death. I told him to stop, but he wouldn't. I offered to help unload some of the bricks, and he refused that too. So I came straight here to tell you. Please, sir, hurry!
        - id: ch01-b13
          speaker: narrator
          text: >-
            Joe's voice shook with excitement.
        - id: ch01-b14
          speaker: mr_clay
          text: >-
            Thank you, my boy.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Mr. Clay ran inside for his hat. Then he paused for a moment.
        - id: ch01-b16
          speaker: mr_clay
          text: >-
            If I take that man before a magistrate, will you tell them exactly what you saw?
        - id: ch01-b17
          speaker: joe_green
          text: >-
            I will. I'll be glad to do it.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Mr. Clay hurried away, and we started home at a fast trot.
        - id: ch01-b19
          speaker: john
          text: >-
            What's happened to you, Joe? You look angry from head to toe.
        - id: ch01-b20
          speaker: narrator
          text: >-
            John asked as Joe threw himself down from the saddle.
        - id: ch01-b21
          speaker: joe_green
          text: >-
            I am angry from head to toe, I can tell you!
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: >-
            Then Joe rushed through the whole story in quick, excited words. He was usually such a quiet, gentle little fellow that it was astonishing to see him so stirred up.
        - id: ch01-b23
          speaker: john
          text: >-
            You were right, Joe. You did exactly the right thing, whether that man gets a summons or not. Plenty of people would have ridden past and said it wasn't their concern. But when someone is being cruel or putting others down, it becomes everyone's concern. If we see it happening, we should step in. You did right, my boy.
        - id: ch01-b24
          speaker: narrator
          text: >-
            By then, Joe had settled down. He was proud that John approved of him. He cleaned my feet and rubbed me down with a firmer hand than usual.

            The men were just about to go home for dinner when the footman came to the stable.
        - id: ch01-b25
          speaker: footman
          text: >-
            Joe is wanted in the master's private room right away. A man has been brought in for mistreating horses, and they need Joe to give evidence.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Joe flushed all the way to his forehead, and his eyes shone.
        - id: ch01-b27
          speaker: joe_green
          text: >-
            Then they'll have my evidence.
        - id: ch01-b28
          speaker: john
          text: >-
            Straighten yourself up a little first.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Joe tugged his necktie into place, gave his jacket a quick pull, and hurried off.

            Our master was one of the county magistrates. People often brought cases to him so he could settle them or decide what should happen next. We heard nothing more in the stable for a while because it was the men's dinner hour. But when Joe came back, I could see that he was in high spirits. He gave me a friendly slap.
        - id: ch01-b30
          speaker: joe_green
          text: >-
            We won't stand by and let things like that happen, will we, old fellow?
        - id: ch01-b31
          speaker: narrator
          text: >-
            Later, we learned that Joe had told his story very clearly. The horses were completely worn out, and their bodies carried the marks of brutal treatment. Because of that evidence, the carter was sent to stand trial. He might receive two or three months in prison.
        - id: ch01-b32
          speaker: narrator
          text: >-
            The change in Joe was remarkable. John laughed and said the boy had grown an inch taller that week. I believe he had. Joe was every bit as kind and gentle as before, but now everything he did showed more purpose and determination. It was as if he had suddenly leaped from being a boy into being a man.
