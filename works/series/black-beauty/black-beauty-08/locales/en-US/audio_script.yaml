  chapters:
    - id: ch01
      title: The Check-Rein
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The next time Ginger and I were together in the paddock, she told me what happened at her first place.
        - id: ch01-b02
          speaker: ginger
          text: >-
            After my training, a dealer bought me to match another chestnut horse. He drove us together for a few weeks. Then a fashionable gentleman bought us and sent us to London.

            The dealer had used a check-rein on me, and I hated it more than anything. At our new place, they pulled it much tighter. The coachman and his master thought that made us look stylish. They often drove us through the park and other fashionable places. You've never worn a check-rein, so you can't know what it's like. I can tell you this. It's dreadful.

            I enjoy tossing my head and carrying it high as much as any horse. But imagine throwing your head up and then being forced to hold it there for hours. You can't move it at all, except to jerk it even higher. Your neck aches until you can hardly stand it.

            And I had two bits instead of one. One was sharp. It cut my tongue and hurt my jaw. I fought against the bits and rein, and blood from my tongue turned the foam flying from my lips red.

            The worst times were when we stood for hours outside some grand party, waiting for our mistress. If I grew restless or stamped a foot, they whipped me. It was enough to drive any horse mad.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I asked whether her master ever thought about what she was suffering.
        - id: ch01-b04
          speaker: ginger
          text: >-
            No. All he cared about was what they called a stylish turnout. I don't think he understood horses at all. He left everything to his coachman. That man told him I had a bad temper and had never learned to accept the check-rein. He said I'd soon get used to it.

            He was never going to teach me. When I stood in the stable, miserable and angry, he didn't soothe me or treat me kindly. I got a harsh word or a blow. If he had treated me decently, I would have tried to endure it. I was willing to work, and willing to work hard. But they hurt me for nothing more than their own fancy. What right did they have to make me suffer that way?

            My mouth was sore, my neck ached, and the rein troubled my windpipe. If I'd stayed there much longer, it would have ruined my breathing. I became more restless and short-tempered every day. I couldn't help it. Soon I began snapping and kicking whenever anyone came to harness me, and the groom beat me for that.

            One day, they had just fastened us to the carriage and were hauling my head up with that rein. I plunged and kicked with all my strength. I broke a great deal of harness and kicked myself free. That ended my time at that place.
    - id: ch02
      title: Sold Again
      blocks:
        - id: ch02-b01
          speaker: ginger
          text: >-
            They sent me to Tattersall's to be sold. Of course, no one could promise that I was free from bad habits, so they simply said nothing about it. My looks and my fine way of moving soon caught a gentleman's eye, and another dealer bought me.

            He tested me in every sort of way and tried different bits. Before long, he understood exactly what I couldn't bear. At last, he drove me with no check-rein at all. Then he sold me to a country gentleman as a perfectly quiet horse.

            That gentleman was a good master, and things went very well at first. But then his old groom left, and a new man took his place. The new groom had a hard temper and rough hands, just like Samson. He always spoke sharply. If I didn't move in my stall the instant he wanted me to, he struck me above the hocks with whatever he was holding, either the stable broom or the fork.

            Everything he did was rough, and I began to hate him. He wanted me to fear him, but I had too much spirit for that. One day, he provoked me worse than usual, and I bit him. He flew into a rage and hit me around the head with a riding whip.

            After that, he never dared enter my stall again. My heels or my teeth were always waiting, and he knew it. I stayed perfectly quiet with my master. But naturally, my master believed what the groom told him, and I was sold once more.
        - id: ch02-b02
          speaker: ginger
          text: >-
            The same dealer heard about me and said he knew a place where I might do well.
        - id: ch02-b03
          speaker: dealer
          text: >-
            It's a shame to see such a fine horse go bad just because no one has given her a truly fair chance.
        - id: ch02-b04
          speaker: ginger
          text: >-
            And that is how I came here, not long before you did. By then, I had decided that men were my natural enemies and I had to protect myself from them.

            Things are certainly different here. But how do I know how long that will last? I wish I could see things as you do. After everything I've been through, I just can't.
    - id: ch03
      title: A Fair Chance
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            I told her it would be a terrible shame if she ever bit or kicked John or James.
        - id: ch03-b02
          speaker: ginger
          text: >-
            I won't, as long as they're kind to me. I did give James a hard bite once. But John told him to try kindness with me. I expected punishment. Instead, James came back with his arm bandaged. He brought me a warm bran mash and stroked me. I've never snapped at him since, and I never will.
        - id: ch03-b03
          speaker: narrator
          text: >-
            I felt sorry for Ginger. Still, I knew very little in those days, and I thought she had probably made everything sound as bad as she could.

            As the weeks passed, though, she became much gentler and more cheerful. The guarded, defiant look she used to give every stranger slowly disappeared. Then one day, James spoke to John about her.
        - id: ch03-b04
          speaker: james
          emotion: happy
          text: >-
            I really believe that mare is starting to like me. I rubbed her forehead this morning, and she whinnied when I walked away.
        - id: ch03-b05
          speaker: john
          text: >-
            Yes, Jim. That's the Birtwick balls at work. Before long, she'll be as good as Black Beauty. Kindness is the only medicine the poor thing needs.
    - id: ch04
      title: The Birtwick Horseballs
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Our master noticed Ginger's change as well. One day, he stepped down from the carriage and came over to speak to us, as he often did. He stroked Ginger's beautiful neck.
        - id: ch04-b02
          speaker: master
          text: >-
            Well, my pretty one, how are things with you now? I think you're much happier than you were when you first came to us.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Ginger lifted her nose toward him in a friendly, trusting way, and he rubbed it gently.
        - id: ch04-b04
          speaker: master
          text: >-
            We'll cure her yet, John.
        - id: ch04-b05
          speaker: john
          emotion: happy
          text: >-
            Yes, sir. She's improved wonderfully. She's hardly the same creature now. It's the Birtwick balls, sir.
        - id: ch04-b06
          speaker: narrator
          text: >-
            John laughed as he said it. The Birtwick balls were his little joke. He liked to say that a regular course of Birtwick horseballs could cure almost any vicious horse.

            His recipe called for patience, gentleness, firmness, and petting, one pound of each. He mixed those with half a pint of common sense and gave the medicine to the horse every day.
