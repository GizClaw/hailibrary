audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述成长经历时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    ginger:
      display_name: 金吉尔
      tts:
        delivery: 坦率而敏感，回忆受伤往事时带着压抑不住的烈性
        timbre: 清亮而略显沙哑
        pace: 自然，情绪激动时稍快
        pitch: 中
    dealer:
      display_name: 马贩子
      tts:
        delivery: 老练直率，谈论马匹时带着几分惋惜
        timbre: 粗厚清晰
        pace: 适中
        pitch: 中低
    james:
      display_name: 詹姆斯
      tts:
        delivery: 开朗随和，谈话时自然爽快
        timbre: 年轻清亮
        pace: 适中
        pitch: 中
    john:
      display_name: 约翰
      tts:
        delivery: 稳重耐心，谈起马匹时专业而亲切
        timbre: 温厚沉稳
        pace: 从容
        pitch: 中低
    squire:
      display_name: 戈登乡绅
      tts:
        delivery: 明快稳健，待人和气而有主见
        timbre: 厚实清晰
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 伦敦的压颈缰
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 后来，我和金吉尔又在牧场里待到一起。那一次，她说起了受训后的第一任主人。
        - id: ch01-b02
          speaker: ginger
          text: 我受完训练，就被一个马贩子买走，和另一匹栗色马配成一对。他把我们合套了几个星期，又卖给一个爱讲排场的绅士，我们就这样去了伦敦。
        - id: ch01-b03
          speaker: ginger
          text: 马贩子赶车时，已经给我戴着压颈缰。我最恨的就是那东西。可到了新主人那里，缰绳反而收得更紧了。主人和马车夫觉得，这样才显得气派。他们常赶着我们去公园和那些时髦地方。你从没戴过压颈缰，不知道那有多可怕。
        - id: ch01-b04
          speaker: ginger
          text: 我也爱昂着头，别的马能扬多高，我也能。可是，你试着想想。头一旦扬起来，就得在那里僵上几个钟头，一动也不能动。想换个姿势，只能再猛地往高处一挣。脖子疼得受不住，还没有办法低下来。
        - id: ch01-b05
          speaker: ginger
          text: 我的嘴里还塞了两副嚼子，其中一副特别尖。舌头和下颌都被割痛了。我越疼，越忍不住咬嚼子、扯缰绳，嘴边不停冒出白沫，连舌头流的血也混在里面。
        - id: ch01-b06
          speaker: ginger
          text: 主人太太去参加宴会的时候最难熬。我们得在外面站着等，一等就是几个钟头。我只要烦躁，或者不耐烦地跺一下脚，鞭子马上就抽下来。那样折磨一匹马，真能把她逼疯。
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: 我问她，难道她的主人从来不替她想一想吗？
        - id: ch01-b08
          speaker: ginger
          text: 不会。他只管自己的车马看起来够不够气派，根本不懂马。他把一切交给马车夫。那个人还对主人说，是我性情暴躁，又没有好好学会戴压颈缰，只要再忍一阵，我自然会习惯。
    - id: ch02
      title: 被逼出来的反抗
      blocks:
        - id: ch02-b01
          speaker: ginger
          text: 可那个马车夫只会让我越来越受不了。我在马厩里又难受又生气，他从不肯好好安抚我，只会骂我，或者打我。他要是肯和气一点，我原本会尽力忍着。我愿意干活，也不怕卖力，可他们只为自己好看，就白白折磨我。他们凭什么这样做？
          emotion: angry
        - id: ch02-b02
          speaker: ginger
          text: 我的嘴和脖子一直疼，气管也被勒得难受。要是长久待在那里，连呼吸都会被毁掉。我越来越焦躁，脾气也越来越坏，实在控制不了。后来，一有人来套挽具，我就张嘴咬，抬腿踢，马夫便为这个打我。
        - id: ch02-b03
          speaker: ginger
          text: 有一天，他们刚把我们套上马车，又开始用压颈缰把我的头往高处勒。我再也忍不住，拼命跳，拼命踢。我扯断了不少挽具，也终于把自己挣脱出来。那以后，他们便不再留我了。
        - id: ch02-b04
          speaker: ginger
          text: 我被送到塔特索尔的马市。谁也不能保证我没有恶习，他们索性什么都不说。凭着模样和步态，我很快引来一个绅士出价，最后却是另一个马贩子买下了我。
        - id: ch02-b05
          speaker: ginger
          text: 他换着法子试我，也换过好几种嚼子，不久就明白我究竟受不了什么。最后一次，他完全不用压颈缰来赶车。我果然安安静静，于是他把我当作一匹温顺的马，卖给了乡下一位绅士。
    - id: ch03
      title: 又一次被卖掉
      blocks:
        - id: ch03-b01
          speaker: ginger
          text: 那位乡下主人待我很好，我本来过得很顺。后来，他的老马夫走了，换来一个新人。这个人和萨姆森一样，脾气又硬，下手又重。他开口总是粗声粗气，没有一点耐心。
        - id: ch03-b02
          speaker: ginger
          text: 他想让我在隔栏里挪动，我要是没有马上照办，他手里有什么就用什么。拿着扫帚，他就用扫帚打。拿着草叉，他便用草叉打。每次都打在我后腿膝关节上方。他做什么都粗暴，我很快便恨上了他。
        - id: ch03-b03
          speaker: ginger
          text: 他想逼我怕他，可我性子太烈，绝不会向他低头。有一天，他比平时更过分，我一口咬了他。他气得发疯，举起马鞭往我头上乱打。从那以后，他再也不敢进我的隔栏。因为只要他进来，我的后蹄或牙齿总有一样等着他，他心里很清楚。
          emotion: angry
        - id: ch03-b04
          speaker: ginger
          text: 主人亲自来时，我一直很安静。可是，他当然听了马夫的话，还是把我卖了。先前那个马贩子听说以后，想起有个地方也许适合我。
        - id: ch03-b05
          speaker: dealer
          text: 这么好的一匹马，只因没有得到一次真正的好机会，就这样变坏，实在太可惜了。
        - id: ch03-b06
          speaker: ginger
          text: 就这样，我在你来之前不久到了这里。可那时候，我已经认定，人天生就是我的敌人，我只能保护自己。这里当然完全不同，可这样的日子又能维持多久？我真希望自己能像你那样想，但经历了那些事，我做不到。
          emotion: sad
        - id: ch03-b07
          speaker: narrator
          text: 我对她说，要是她咬约翰，或者踢詹姆斯，那可实在不应该。
        - id: ch03-b08
          speaker: ginger
          text: 只要他们好好待我，我不会那样做。有一回，我的确狠狠咬了詹姆斯。可约翰没有叫他惩罚我。
        - id: ch03-b09
          speaker: john
          text: 先别处罚她。用善意待她试试。
        - id: ch03-b10
          speaker: ginger
          text: 后来，詹姆斯缠着受伤的胳膊来找我。他不但没打我，还带来一份麸皮粥，又伸手抚摸我。从那以后，我再没朝他咬过，以后也不会。
    - id: ch04
      title: 善意改变了金吉尔
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我听了很同情金吉尔。可我那时知道的事情太少，还以为她多半把遭遇说得太糟了。接下来的几个星期里，她真的一天比一天温顺，也一天比一天快活。
        - id: ch04-b02
          speaker: narrator
          text: 从前只要陌生人靠近，她就会转过头，用戒备又不肯服输的眼神盯着人。渐渐地，那种眼神消失了。有一天，詹姆斯忍不住对约翰说起她的变化。
        - id: ch04-b03
          speaker: james
          text: 我看这匹母马是真的开始喜欢我了。今天早晨我给她揉过额头，等我走开，她还在后面嘶鸣着叫我呢。
        - id: ch04-b04
          speaker: john
          text: 对啦，吉姆，这就是“伯特威克药丸”的功效。再过些时候，她会和黑骏马一样乖。可怜的姑娘，她要吃的药其实只有善意。
        - id: ch04-b05
          speaker: narrator
          text: 主人也看出了变化。一天，他下了马车，像平常一样过来同我们说话，还伸手抚摸金吉尔漂亮的脖子。
        - id: ch04-b06
          speaker: squire
          text: 怎么样，我的漂亮姑娘？现在过得好不好？我看哪，你比刚来我们这里时快活多了。
        - id: ch04-b07
          speaker: narrator
          text: 金吉尔亲热地把鼻子凑过去，眼里满是信任。主人轻轻给她揉了揉。
        - id: ch04-b08
          speaker: squire
          text: 约翰，我们会把她治好的。
        - id: ch04-b09
          speaker: john
          text: 是的，先生。她好得叫人吃惊，简直不像从前那匹马了。这都是“伯特威克药丸”的功效，先生。
        - id: ch04-b10
          speaker: narrator
          text: 约翰说完便笑了。这种“药丸”，原本就是他常说的一句玩笑话。
    - id: ch05
      title: 伯特威克马药丸
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 约翰总说，只要照规矩吃上一段时间的“伯特威克马药丸”，几乎什么样的坏脾气都能治好。
        - id: ch05-b02
          speaker: narrator
          text: 这药是怎么配的呢？要用耐心、温柔、坚定和爱抚，每样各一磅，再兑上半品脱常识，仔细调在一起，每天给马吃一次。
