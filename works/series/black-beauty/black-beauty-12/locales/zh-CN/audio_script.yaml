audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述成长经历时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    master:
      display_name: 道格拉斯先生
      tts:
        delivery: 正直坚定，平日温厚，斥责残忍时严厉有力
        timbre: 沉稳清晰
        pace: 从容，激动时略有顿挫
        pitch: 中低
    john:
      display_name: 约翰
      tts:
        delivery: 稳重耐心，谈起马匹时专业而亲切
        timbre: 温厚沉稳
        pace: 从容
        pitch: 中低
    toll_keeper:
      display_name: 守关人
      tts:
        delivery: 朴实警醒，遇到险情时急切响亮
        timbre: 粗厚清楚
        pace: 适中，呼喊时急促
        pitch: 中
    mrs_gordon:
      display_name: 戈登太太
      tts:
        delivery: 温柔大方，言谈亲昵而敏锐
        timbre: 柔和明亮
        pace: 舒缓
        pitch: 中
  chapters:
    - id: ch01
      title: 风雨中的去程
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 深秋的一天，主人要出远门办事。他们把我套上轻便双轮马车，约翰陪主人一道去。我很喜欢拉这种车，车身轻，高高的轮子转起来又轻快。前些日子雨下得很多，这天风也很大，枯叶被卷起来，一阵阵扫过道路。
        - id: ch01-b02
          speaker: narrator
          text: 我们一路走得很欢快，不久便到了收费关卡和那座低矮的木桥。河岸颇高，桥面却平平地横在水上，一点也没有拱起。河水涨满时，桥中央的水面几乎挨着木架和桥板。好在两边的栏杆十分结实，来往的人也就不太在意。
        - id: ch01-b03
          speaker: narrator
          text: 守关人告诉我们，河水涨得很快，夜里恐怕会有一场厉害的风暴。好些草地已经进了水。一段低洼的路上，水漫到了我膝盖一半高的地方。不过路底很硬，主人赶得又小心，所以并没有什么妨碍。
        - id: ch01-b04
          speaker: narrator
          text: 到了城里，我自然好好吃了一顿。主人的事情办了很久，等我们踏上归途，下午已经很晚了。风比先前更猛。主人告诉约翰，他从没在这样的暴风里赶过路。
        - id: ch01-b05
          speaker: narrator
          text: 我们沿着一片树林的边缘前行。那些粗大的树枝摇来摆去，竟像细枝条一样，风从林间奔涌而过，声音听着实在可怕。我心里也觉得，这场风暴非同寻常。
        - id: ch01-b06
          speaker: master
          text: 但愿我们能安安稳稳地走出这片林子。
        - id: ch01-b07
          speaker: john
          text: 是啊，先生。万一有根树枝砸到车上，事情就麻烦了。
    - id: ch02
      title: 倒下的橡树
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 约翰的话刚说完，林中便传来一阵呻吟般的吱嘎声。紧接着，树木断裂、撕开的声音一齐响起。一棵橡树被连根拔起，沿路撞断别的枝杈，轰然倒在我们前面，正好横断了道路。
        - id: ch02-b02
          speaker: narrator
          text: 我确实吓坏了，立刻停住，身子大概也在发抖。可我没有掉头，更没有逃跑，因为我从小受的教养不许我那样做。约翰一下跳出车外，转眼便守在我头边。
        - id: ch02-b03
          speaker: master
          text: 刚才真是险极了。现在我们该怎么办？
        - id: ch02-b04
          speaker: john
          text: 先生，这棵树既越不过去，也没法绕开。只能退回四岔路口，改走另一条路。兜这么一圈，至少要多走六英里，才能再回到木桥。我们会晚些到家，好在马的精神还足。
        - id: ch02-b05
          speaker: narrator
          text: 我们只得原路返回，再从四岔路绕过去。等木桥重新出现在前方，天已经快黑透了。水漫过了桥中央，我们只能勉强看清。洪水来时，这种情况以前也有过，所以主人没有叫停。
        - id: ch02-b06
          speaker: narrator
          text: 我正快步走着，蹄子才碰到桥头，便知道有什么地方不对。我一动不动地站住，再也不敢往前迈。
        - id: ch02-b07
          speaker: master
          text: 往前走，美人儿。
        - id: ch02-b08
          speaker: narrator
          text: 主人先用鞭子轻轻碰了我一下，可我还是不动。他又重重抽了一鞭。我受惊跳起，却无论如何也不肯上桥。
        - id: ch02-b09
          speaker: john
          text: 先生，这里一定有什么不对。
        - id: ch02-b10
          speaker: narrator
          text: 约翰从车上一跃而下，走到我头边，四下看了又看。随后，他握着缰绳，想把我领上前去。
        - id: ch02-b11
          speaker: john
          text: 来吧，美人儿。你到底怎么啦？
        - id: ch02-b12
          speaker: narrator
          text: 我没办法回答他，可我心里清清楚楚，这座桥已经不安全了。
    - id: ch03
      title: 断桥前止步
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 就在这时，对岸的守关人从屋里冲了出来。他像发了疯似的挥动火把，朝我们大声呼喊。
        - id: ch03-b02
          speaker: toll_keeper
          text: 喂！停下！千万别再往前走！
          emotion: fearful
        - id: ch03-b03
          speaker: master
          text: 出什么事了？
        - id: ch03-b04
          speaker: toll_keeper
          text: 桥中间断了，有一截已经被水冲走！你们再走，就要掉进河里啦！
          emotion: fearful
        - id: ch03-b05
          speaker: master
          text: 感谢上帝！
        - id: ch03-b06
          speaker: john
          text: 好个美人儿！
        - id: ch03-b07
          speaker: narrator
          text: 约翰牵住我，轻轻把我掉转过来，我们拐上右边那条沿河的路。太阳早已落山。刚才拔起大树的那阵狂风过去以后，风势好像平息了。天色越来越暗，四周越来越静。
        - id: ch03-b08
          speaker: narrator
          text: 我安静地小跑，车轮碾过松软的路面，几乎听不见声音。很长一段路上，主人和约翰谁也没有开口。后来，主人用十分严肃的口气说起刚才的险境。
        - id: ch03-b09
          speaker: narrator
          text: 他们的话我不能全听懂，不过大意我明白。要是我听从主人，继续踏上那座桥，桥很可能会在我们脚下垮掉。到那时，马、车、主人和车夫都会跌进河里。水流那么急，四下没有灯火，附近也无人援救，我们多半一个也活不下来。
        - id: ch03-b10
          speaker: narrator
          text: 主人说，上帝给了人理性，让人能靠自己弄明白许多事情。动物得到的却是另一种知觉，它不依靠推理，在自己的用处上更加敏捷，也更加完善。动物常常就是凭着它，救下人的性命。
        - id: ch03-b11
          speaker: narrator
          text: 约翰接着讲了许多狗和马的故事，说起它们做过的那些不可思议的事。他认为，人们实在太不看重动物，也很少把它们当作真正的朋友。可我知道，世上要是有人真心和动物做朋友，约翰一定是其中一个。
    - id: ch04
      title: 平安归来
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我们终于来到庄园门口，园丁正站在那里等着。他说，自从天黑，女主人就一直心急如焚，生怕我们出了意外。她已经叫詹姆斯骑着那匹杂色矮马正义，赶往木桥打听我们的消息。
        - id: ch04-b02
          speaker: narrator
          text: 大厅门口和楼上的窗户都亮着灯。我们一走近，女主人便从屋里跑了出来。
        - id: ch04-b03
          speaker: mrs_gordon
          text: 亲爱的，你真的平安回来了？我一直担心得不得了，脑子里尽是各种可怕的事情。你们没有出意外吧？
          emotion: fearful
        - id: ch04-b04
          speaker: master
          text: 没有，亲爱的。不过，要不是你的黑骏马比我们更聪明，我们早就连人带车从木桥上掉下去，被河水冲走了。
        - id: ch04-b05
          speaker: narrator
          text: 他们进了屋，后面的话我便听不见了。约翰把我带回马厩。那天晚上，他给我准备了一顿极好的晚餐，有热乎乎的麦麸糊，燕麦里还拌了碾碎的豆子。脚下的稻草也铺得又厚又软。我已经累坏了，这些正是我最需要的。
