  chapters:
    - id: ch01
      title: A Stormy Day
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Late one autumn day, my master had to make a long business trip. They hitched me to the dog-cart, and John went along with him. I always enjoyed pulling that cart. It was light, and its high wheels rolled so easily.

            A great deal of rain had fallen. Now a fierce wind sent showers of dry leaves racing across the road. We traveled along happily until we reached the tollgate and the low wooden bridge. The riverbanks stood fairly high, but the bridge crossed straight and level. When the river was full, the water in the middle came almost up to the planks and woodwork. Strong rails ran along both sides, so people usually weren't worried.
        - id: ch01-b02
          speaker: tollkeeper
          text: >-
            The river's rising fast. I'm afraid we're in for a bad night.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Many of the meadows were already flooded. At one low place, the water reached halfway to my knees. The ground underneath was firm, and the master drove carefully, so we crossed without trouble.

            In town, I was given a good meal and rest. The master's business took a long time, though, and we didn't start home until late afternoon. By then the wind was much stronger. The master told John he had never been out in such a storm.

            I understood why as we passed the edge of a wood. Great branches swung around like little twigs, and their rushing roar was terrible.
        - id: ch01-b04
          speaker: master
          text: >-
            I wish we were safely out of these woods.
        - id: ch01-b05
          speaker: john
          text: >-
            Yes, sir. We'd be in a bad spot if one of those branches fell on us.
        - id: ch01-b06
          speaker: narrator
          text: >-
            He had barely finished when we heard a deep groan, then a crack and a ripping, splitting sound. An oak tore up by the roots and crashed through the other trees. It landed across the road just ahead of us.

            I won't pretend I wasn't frightened. I stopped at once, and I believe I trembled. But I didn't spin around or bolt. I had been taught better than that. John jumped down and hurried to my head.
        - id: ch01-b07
          speaker: master
          text: >-
            That was much too close. What can we do now?
        - id: ch01-b08
          speaker: john
          text: >-
            We can't drive over that tree, sir, and there's no way around it. We'll have to go back to the crossroads. It'll add a good six miles before we reach the wooden bridge again. We'll be late, but Beauty is still fresh.
        - id: ch01-b09
          speaker: narrator
          text: >-
            We turned back and went around by the crossroads. It was nearly dark when we finally reached the bridge again. We could just make out water covering its middle. That sometimes happened during a flood, so the master kept going.

            We approached at a good pace. But the instant my feet touched the first part of the bridge, I knew something was wrong. I didn't dare take another step. I stopped dead.
        - id: ch01-b10
          speaker: master
          text: >-
            Go on, Beauty.
        - id: ch01-b11
          speaker: narrator
          text: >-
            He touched me with the whip, but I couldn't move forward. Then he struck me sharply. I jumped, yet I still refused to go on.
        - id: ch01-b12
          speaker: john
          text: >-
            Something's wrong, sir.
        - id: ch01-b13
          speaker: narrator
          text: >-
            John sprang out of the dog-cart, came to my head, and looked around. Then he tried to lead me ahead.
        - id: ch01-b14
          speaker: john
          text: >-
            Come on, Beauty. What's bothering you?
        - id: ch01-b15
          speaker: narrator
          text: >-
            I had no way to tell him, but I knew the bridge wasn't safe.

            Just then, the tollkeeper ran out of his house on the far side. He waved a torch wildly in the air.
        - id: ch01-b16
          speaker: tollkeeper
          emotion: fearful
          text: >-
            Hey! Stop! Stop right there!
        - id: ch01-b17
          speaker: master
          text: >-
            What's happened?
        - id: ch01-b18
          speaker: tollkeeper
          emotion: fearful
          text: >-
            The middle of the bridge has broken! Part of it washed away. If you keep coming, you'll go straight into the river!
        - id: ch01-b19
          speaker: master
          text: >-
            Thank God!
        - id: ch01-b20
          speaker: john
          text: >-
            Oh, Beauty!
        - id: ch01-b21
          speaker: narrator
          text: >-
            John took my bridle and gently turned me onto the road that ran to the right beside the river.
        - id: ch01-b22
          speaker: narrator
          text: >-
            The sun had gone down some time before. After that furious blast that uprooted the oak, the wind seemed to settle. The night grew darker and quieter with every minute.

            I trotted peacefully along the soft road. Even the wheels made hardly a sound. For quite a while, neither the master nor John spoke. Then the master began talking in a serious voice. I couldn't understand everything they said, but I understood enough.

            They believed that if I had obeyed the master and stepped farther onto the bridge, it probably would have collapsed beneath us. Horse, cart, master, and man would all have fallen into the river. The current was running hard, the night was dark, and no one was close enough to help. Most likely, every one of us would have drowned.
        - id: ch01-b23
          speaker: master
          text: >-
            God gave people reason, so we can discover things for ourselves. But animals have another kind of knowledge. It doesn't come from reason. In its own way, it acts faster and more surely, and animals have often used it to save people's lives.
        - id: ch01-b24
          speaker: narrator
          text: >-
            John answered with many stories about dogs and horses and the wonderful things they had done. He thought people valued their animals far too little. They ought to treat them as friends, he said. If any man ever made friends with animals, I am certain John did.

            At last we reached the park gates. The gardener was there watching for us.
        - id: ch01-b25
          speaker: gardener
          text: >-
            The mistress has been terribly worried ever since dark, sir. She was sure some accident had happened. She sent James out on Justice, the roan cob, toward the wooden bridge to look for you.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Lights shone at the front door and in the upstairs windows. As we came up, the mistress ran outside.
        - id: ch01-b27
          speaker: mistress
          emotion: fearful
          text: >-
            Oh, my dear, are you truly safe? I've been so worried. I kept imagining every terrible thing that might have happened. You haven't had an accident, have you?
        - id: ch01-b28
          speaker: master
          text: >-
            No, my dear. But if your Black Beauty hadn't been wiser than we were, the river would have swept us all away at the wooden bridge.
        - id: ch01-b29
          speaker: narrator
          text: >-
            That was all I heard. They went into the house, and John led me to the stable.

            What a fine supper he gave me that night! I had a good bran mash, crushed beans mixed with my oats, and a deep bed of straw. I was very glad for all of it, because I was tired.
