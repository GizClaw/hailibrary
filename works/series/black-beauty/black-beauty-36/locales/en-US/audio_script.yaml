  chapters:
    - id: ch01
      title: The Sunday Fare
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One morning, Jerry had just backed me into the shafts and was fastening the traces when a gentleman entered the yard. Jerry greeted him politely.
        - id: ch01-b02
          speaker: jerry
          text: >-
            Good morning, sir.
        - id: ch01-b03
          speaker: mr_briggs
          text: >-
            Good morning, Mr. Barker. I'd like to arrange for you to drive Mrs. Briggs to church every Sunday morning. We attend the New Church now, and it's farther than she can walk.
        - id: ch01-b04
          speaker: jerry
          text: >-
            Thank you, sir, but my license is only for six days a week. I can't legally take a fare on Sunday.
        - id: ch01-b05
          speaker: narrator
          text: >-
            At that time, cab owners could buy either a six-day or a seven-day license. A few years later, the fee was lowered and that difference disappeared.
        - id: ch01-b06
          speaker: mr_briggs
          text: >-
            Oh, I didn't realize yours was a six-day cab. You could easily change the license, though. I'd make sure the arrangement paid you well. Mrs. Briggs would much rather have you drive her than anyone else.
        - id: ch01-b07
          speaker: jerry
          text: >-
            I'd gladly help Mrs. Briggs if I could, sir. But I used to have a seven-day license, and it was too much for me and too much for my horses. We worked week after week without one day off. I never had a Sunday with my wife and children, and I couldn't attend worship as I'd always done before I became a cabman. Five years ago, I changed to a six-day license. It's been better for all of us.
        - id: ch01-b08
          speaker: mr_briggs
          text: >-
            Of course everyone ought to rest and have the chance to attend church on Sunday. Still, this is only a short trip for the horse, once in the morning. The whole afternoon and evening would remain yours. And you know we've been very good customers.
        - id: ch01-b09
          speaker: jerry
          text: >-
            That's true, sir, and I'm grateful for every bit of business you've given me. I'd be proud to do anything else I could for you or Mrs. Briggs. But I can't give up my Sundays. I truly can't. I've read that God made people, horses, and all the other animals, and then gave them a day of rest. He told them to rest one day in seven. I believe He knew what was good for us.

            That day is certainly good for me. Since I've had a regular rest, I've become stronger and healthier. My horses stay fresher, and they don't wear out nearly as quickly. Every six-day driver I know says the same. I've even saved more money than I did when I worked seven days. And my wife and children? Goodness, sir, nothing you could offer would make them want those old seven-day weeks again.
        - id: ch01-b10
          speaker: mr_briggs
          text: >-
            Very well, Mr. Barker. You needn't explain any further. I'll ask someone else.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Mr. Briggs walked away. Jerry turned to me.
        - id: ch01-b12
          speaker: jerry
          text: >-
            We can't help it, Jack, old boy. We have to keep our Sundays.
    - id: ch02
      title: Our Sundays Are Our Own
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Then Jerry called loudly for Polly. She came out within a minute.
        - id: ch02-b02
          speaker: polly
          text: >-
            What happened, Jerry?
        - id: ch02-b03
          speaker: jerry
          text: >-
            Mr. Briggs wants me to take Mrs. Briggs to church every Sunday morning. I told him I only have a six-day license. He said I should get a seven-day one, and he'd pay enough to make it worthwhile.

            They are very good customers, Polly. Mrs. Briggs hires us for hours when she goes shopping or visiting, and she always pays the proper fare without trying to turn three hours into two and a half. Her trips are easy on the horses, too. They're nothing like racing for a train because someone left home fifteen minutes late. If I refuse this Sunday work, we may lose all their business. What do you think, little woman?
        - id: ch02-b04
          speaker: narrator
          text: >-
            Polly answered very slowly.
        - id: ch02-b05
          speaker: polly
          emotion: sad
          text: >-
            Jerry, even if Mrs. Briggs offered you a sovereign every Sunday morning, I wouldn't want you to become a seven-day cabman again. We remember what it was like to have no Sundays. Now we know what it means to have that day for ourselves.

            Thank God, you earn enough to support us, even if paying for the oats, hay, license, and rent can be a struggle. Harry will soon begin earning something too. I'd rather struggle even harder than go back to those dreadful days. You barely had time to look at your own children. We could never attend worship together or spend one peaceful, happy day as a family. God keep us from ever returning to that life. That's my answer, Jerry.
        - id: ch02-b06
          speaker: jerry
          emotion: calm
          text: >-
            And that's exactly what I told Mr. Briggs, my dear. I mean to stand by it. Don't upset yourself, Polly.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Polly had begun to cry.
        - id: ch02-b08
          speaker: jerry
          emotion: calm
          text: >-
            I wouldn't return to those old days even for twice the money. So it's settled, little woman. Cheer up now, and I'll go on to the stand.
    - id: ch03
      title: Holding On to a Day of Rest
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Three weeks went by, and Mrs. Briggs sent no more orders. Jerry had to depend entirely on jobs from the cabstand. The work was harder for both horse and man, and he worried about losing such a good customer. But Polly always encouraged him.
        - id: ch03-b02
          speaker: polly
          emotion: calm
          text: >-
            Never mind, father. Never mind. Do your best and leave the rest. It'll all come right, some day or night.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Before long, the other cabmen heard that Jerry had lost his best customer and learned why. Most called him a fool, though two or three defended him.
        - id: ch03-b04
          speaker: truman
          text: >-
            If workingmen don't protect their Sundays, they'll soon lose them. A day of rest belongs to every man and every animal. God's law gives us that day, and so does the law of England. We ought to hold on to that right and keep it safe for our children.
        - id: ch03-b05
          speaker: larry
          text: >-
            That's easy for you religious fellows to say. Me, I'll earn a shilling whenever I get the chance. I don't believe in religion. The people who claim to be religious don't seem any better than anyone else.
        - id: ch03-b06
          speaker: jerry
          text: >-
            If they aren't better, then they aren't truly religious. You might as well say England's laws are bad because some people break them. A man may attend church all he likes, but if he loses his temper, speaks badly about his neighbor, and refuses to pay his debts, he isn't religious.

            Some men may be frauds and hypocrites, but that doesn't make religion false. Real religion is the best and truest thing in the world. It's the only thing that can make a man truly happy or make this world any better.
        - id: ch03-b07
          speaker: jones
          text: >-
            If religion were worth anything, it would stop religious people from making us work on Sundays. You know plenty of them do it. That's why I call religion a fraud. If churchgoers and chapelgoers didn't hire us, there'd hardly be any reason to bring out our cabs on Sunday. They keep what they call their privileges, while I go without mine. If I never get a chance to save my soul, they can answer for it.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Several men applauded Jones. Then Jerry answered him.
        - id: ch03-b09
          speaker: jerry
          text: >-
            That may sound convincing, but it won't do. Every man has to care for his own soul. You can't leave it at another man's door like an abandoned baby and expect him to raise it.

            And think about this. If you spend every Sunday sitting on your cab and waiting for a fare, people tell themselves, “If I don't hire him, someone else will. He clearly doesn't want Sunday off.” They don't follow the matter all the way through. If no one ever came looking for a cab on Sunday, there'd be no point in your waiting there. People don't always want to examine a question that closely, especially when the answer would inconvenience them. But if every Sunday driver demanded a day of rest, you'd get it.
        - id: ch03-b10
          speaker: larry
          text: >-
            Then how would all those good people reach their favorite preachers?
        - id: ch03-b11
          speaker: jerry
          text: >-
            It isn't my place to arrange everyone else's life. If their usual church is too far to walk, they can attend one that's closer. If it rains, they can wear raincoats, just as they do during the week. When something is right, there's a way to do it. When it's wrong, we can do without it. A good man will find a way. And that goes for cabmen just as much as churchgoers.
