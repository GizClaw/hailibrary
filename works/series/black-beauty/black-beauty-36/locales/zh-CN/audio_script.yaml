audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    jerry:
      display_name: 杰里·巴克
      tts:
        delivery: 爽朗亲切，说起原则时坚定而不说教
        timbre: 结实温暖
        pace: 明快平稳
        pitch: 中低
    mr_briggs:
      display_name: 布里格斯先生
      tts:
        delivery: 彬彬有礼又颇为自信，劝说时略带坚持
        timbre: 饱满讲究
        pace: 从容
        pitch: 中低
    polly:
      display_name: 波莉·巴克
      tts:
        delivery: 温柔务实，谈到家人时沉静而坚决
        timbre: 温暖柔和
        pace: 舒缓
        pitch: 中
    truman:
      display_name: 杜鲁门
      tts:
        delivery: 诚恳坚定，说话朴实直接
        timbre: 厚实沧桑
        pace: 平稳
        pitch: 中低
    larry:
      display_name: 拉里
      tts:
        delivery: 油滑爱逗弄人，受指责时嘴硬
        timbre: 粗哑干瘦
        pace: 偏快
        pitch: 中
    jones:
      display_name: 琼斯
      tts:
        delivery: 愤愤不平，怀疑一切，说话咄咄逼人
        timbre: 粗粝紧绷
        pace: 偏快
        pitch: 中低
  chapters:
    - id: ch01
      title: 星期日的生意
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天早晨，杰里刚把我套进车辕，正在扣挽索，一位先生走进院子。
        - id: ch01-b02
          speaker: jerry
          text: 先生，听候您吩咐。
        - id: ch01-b03
          speaker: mr_briggs
          text: 早上好，巴克先生。我想和你定下来，以后每个星期日早晨，都请你送布里格斯太太去教堂。我们如今改去新教堂了，路远了一点，她走不了那么远。
        - id: ch01-b04
          speaker: jerry
          text: 谢谢您，先生。可我只有六日营业执照，星期日不能收钱载客，那不合法。
        - id: ch01-b05
          speaker: narrator
          text: 那时，出租马车有六日和七日两种营业执照。几年后，执照年费大幅降低，这项区别也取消了。
        - id: ch01-b06
          speaker: mr_briggs
          text: 原来你的车只在六日营业，我还真不知道。换个执照并不难，我会让你这趟生意做得划算。布里格斯太太尤其愿意坐你赶的车。
        - id: ch01-b07
          speaker: jerry
          text: 我很愿意为太太效劳。可我以前办过七日执照，那对我和马都太苦了。一年到头，不论什么季节，一天也不能歇。我没有一个星期日能陪妻子孩子，也不能像坐上车夫座以前那样去做礼拜。所以这五年，我一直只办六日营业执照，方方面面都比从前好。
        - id: ch01-b08
          speaker: mr_briggs
          text: 人人都该休息，星期日也该能上教堂，这当然很应该。不过这段路对马来说很短，一天又只跑这一趟，我原以为你不会介意。整个下午和晚上还全是你自己的。再说，你也知道，我们一直是很照顾你生意的老主顾。
        - id: ch01-b09
          speaker: jerry
          text: 这话不假，先生。您照顾我的每一笔生意，我都感激。别的事，只要我能为您或太太办到，我一定又荣幸又乐意。可星期日我真不能放弃。《圣经》说，上帝造了人，也造了马和所有牲畜。才造完，祂便定下安息日，让大家每七天歇一天。我想，祂一定知道什么对众生有益。
        - id: ch01-b10
          speaker: jerry
          text: 有了这一天休息，我整个人更强壮，也更健康。马也总是精神饱满，不会像从前那么快累垮。只做六天的车夫都对我说，他们的情形也一样。我现在存进储蓄银行的钱，甚至比七天都干活时更多。至于我的妻子孩子，哎呀，先生，您把世上的好东西全摆在他们面前，他们也不肯回到一周干七天的生活。
        - id: ch01-b11
          speaker: mr_briggs
          text: 那好吧，巴克先生，不必再解释了。我去问问别人。
        - id: ch01-b12
          speaker: narrator
          text: 布里格斯先生说完便走了。杰里转过来对我说话。
        - id: ch01-b13
          speaker: jerry
          text: 这也没办法，杰克，老伙计。我们的星期日一定得留住。
    - id: ch02
      title: 属于我们的星期日
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 杰里大声喊波莉过来。不到一分钟，她就来了。
        - id: ch02-b02
          speaker: polly
          text: 出了什么事，杰里？
        - id: ch02-b03
          speaker: jerry
          text: 布里格斯先生想让我每个星期日早晨送他太太去教堂。我说自己只有六日执照，他却让我换成七日的，还说会多给钱，不会叫我吃亏。可他们确实是好主顾。布里格斯太太出去买东西、登门拜访，常常一坐就是几个钟头。结账时，她总像一位真正的淑女，公道又痛快，从不讨价还价，也不会坐了三个钟头，偏说只有两个半钟头。
        - id: ch02-b04
          speaker: jerry
          text: 她坐车，对马也轻省。不像那些总晚一刻钟出门的人，赶火车时非让马飞跑。我要是不答应，平日的生意恐怕也会全丢掉。小女人，你说怎么办？
        - id: ch02-b05
          speaker: narrator
          text: 波莉开口时，说得很慢。
        - id: ch02-b06
          speaker: polly
          emotion: sad
          text: 杰里，就算布里格斯太太每个星期日早晨给你一枚金镑，我也不愿你再做一周七天的车夫。没有星期日是什么滋味，我们已经尝过。如今，我们也知道能把星期日称作自己的日子，又是什么滋味。
        - id: ch02-b07
          speaker: polly
          emotion: sad
          text: 感谢上帝，你挣的钱够养活我们。燕麦、干草、执照费和房租样样都要付，手头有时确实很紧，可哈里很快也能挣些钱了。我宁愿比现在过得更艰难，也不要回到那些可怕的日子。那时你忙得连看一眼自己的孩子都几乎抽不出工夫。我们从不能一起去做礼拜，一家人也过不上一个安静快活的日子。求上帝别让我们再回到从前。这就是我的意思，杰里。
        - id: ch02-b08
          speaker: jerry
          emotion: calm
          text: 亲爱的，我对布里格斯先生说的也是这些，我一定会守住。别再难过了，波莉。
        - id: ch02-b09
          speaker: narrator
          text: 波莉已经哭了起来。
        - id: ch02-b10
          speaker: jerry
          emotion: calm
          text: 就算能挣两倍的钱，我也不回到过去。事情就这么定了，小女人。打起精神来吧，我该去候车处了。
    - id: ch03
      title: 守住休息日
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 三个星期过去，布里格斯太太再没叫过车。杰里只能靠候车处的零活挣钱，人和马都比从前辛苦，他也很为此烦恼。不过波莉总给他打气。
        - id: ch03-b02
          speaker: polly
          emotion: calm
          text: 别放在心上，孩子他爸。凡事尽力做，其余且放过。总有一天或一夜，一切都会有着落。
        - id: ch03-b03
          speaker: narrator
          text: 不久，别的车夫都知道杰里丢了自己最好的主顾，也知道他究竟是为了什么才丢掉这笔生意。大多数人都说他是傻瓜，只有两三个人站在他这边替他说话。
        - id: ch03-b04
          speaker: truman
          text: 做工的人要是不守住自己的星期日，很快就一个也剩不下。这是每个人的权利，也是每头牲畜的权利。上帝的律法给了我们一个安息日，英格兰的法律也给了我们一天休息。既然两种法律都给了我们这份权利，我们就该牢牢守住，再把它留给自己的孩子。
        - id: ch03-b05
          speaker: larry
          text: 你们这些信教的人，说起来当然好听。我只要有机会，就要去挣一先令。我不信宗教，那些自称信教的人，也没见得比别人更好。
        - id: ch03-b06
          speaker: jerry
          text: 他们要是没有变得更好，那是因为他们根本不是真正信教。这就像有些人犯法，你便说我们国家的法律不好。一个人若是任性发脾气，说邻居的坏话，还欠债不还，那他去多少次教堂也不算真正信教。我才不管他去得有多勤。
        - id: ch03-b07
          speaker: jerry
          text: 有些人虚伪骗人，并不能证明宗教是假的。真正的信仰，是世上最好、最真实的东西。只有它能给人真正的快乐，也能让我们生活的世界变好。
        - id: ch03-b08
          speaker: jones
          text: 宗教要真有用，就该拦住那些信教的人，别让他们逼我们星期日也干活。你明明知道，偏偏这样的人多得很，所以我才说宗教是骗局。要不是那些去教堂和小礼拜堂的人，星期日根本不值得把车赶出来。他们享受着所谓的特权，我自己的权利却没有了。我要是连拯救灵魂的机会都得不到，就让他们替我的灵魂负责。
        - id: ch03-b09
          speaker: narrator
          text: 好几个车夫听完这番话都纷纷叫好。杰里这才开口回答。
        - id: ch03-b10
          speaker: jerry
          text: 这话也许听着很漂亮，却根本行不通。每个人都得照看自己的灵魂。你不能像把弃婴放在别人门口一样，把自己的灵魂往那儿一搁，就指望那个人替你照管、替你养大。
        - id: ch03-b11
          speaker: jerry
          text: 你们每个星期日都坐在车夫座上等客，人家便会想：“我不坐他的车，也会有别人坐。看样子，他并不想歇星期日。”他们没有把事情想到底。要是根本没人来雇车，你们守在那里也没有用。可人们往往不愿把事情想透，因为真想明白了，也许会给自己添麻烦。要是所有星期日出车的人一起坚持要一天休息，这事自然就成了。
        - id: ch03-b12
          speaker: larry
          text: 那些善男信女要是坐不到车，怎么去听他们最喜欢的牧师讲道？
        - id: ch03-b13
          speaker: jerry
          text: 我可不能替别人安排生活。他们若是走不了那么远，可以改去离家更近一些的教堂。碰上下雨，也能像平日一样穿上防雨大衣。事情若是对的，总有办法做到。事情若是错的，不做也罢。一个好人自然会找到办法。这话对我们出租马车夫适用，对那些去教堂的人也一样。
