  chapters:
    - id: ch01
      title: 03 My Breaking In
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I was growing into a handsome young horse. My coat had become fine and soft, and it shone a bright black. One foot was white, and I had a pretty white star on my forehead. People thought I was very handsome. Still, my master would not sell me until I was four. He believed boys should not have to do a man's work, and a colt should not do a grown horse's work before he was fully grown.
        - id: ch01-b02
          speaker: narrator
          text: >-
            When I turned four, Squire Gordon came to see me. He looked at my eyes, mouth, and legs, and felt all the way down each leg. Then he watched me walk, trot, and gallop. He seemed pleased.
        - id: ch01-b03
          speaker: squire_gordon
          text: >-
            Once he's been properly broken in, he should do very well.
        - id: ch01-b04
          speaker: narrator
          text: >-
            My master said he would break me in himself. He did not want anyone frightening or hurting me. He started the very next day.
        - id: ch01-b05
          speaker: narrator
          text: >-
            You may not know what breaking in means, so let me explain. A horse must learn to wear a saddle and bridle and carry a man, woman, or child. He must go exactly where his rider wants and move quietly. He also learns to wear a collar, a crupper, and breeching, and to stand still while each piece is put on. Then a cart or chaise is fastened behind him. After that, every step means pulling it along, whether the driver asks him to go fast or slow.
        - id: ch01-b06
          speaker: narrator
          text: >-
            He must not jump at anything he sees. He must not call to other horses, bite, kick, or choose for himself. He must obey his master even when he is tired or hungry. Worst of all, once the harness is on, he cannot leap for joy or lie down when he is worn out. So breaking in is a very serious thing.
        - id: ch01-b07
          speaker: narrator
          text: >-
            I was already used to a halter and headstall. I could be led quietly through fields and lanes. But now I had to wear a bit and bridle. My master gave me my oats as usual. With plenty of coaxing, he slipped the bit into my mouth and fastened the bridle. What a nasty thing it was!
        - id: ch01-b08
          speaker: narrator
          text: >-
            Unless you have had a bit in your own mouth, you cannot imagine how bad it feels. Picture a piece of cold, hard steel as thick as a man's finger. It is pushed between your teeth and over your tongue, with the ends sticking out at the corners of your mouth. Straps hold it tight over your head, beneath your throat, around your nose, and under your chin. There is no possible way to get that hard, hateful thing out. It felt very bad. Yes, very bad indeed.
        - id: ch01-b09
          speaker: narrator
          text: >-
            But I knew my mother wore a bit whenever she went out, and all grown horses wore one. The oats helped. So did my master's pats, his kind voice, and his gentle hands. In time, I learned to wear the bit and bridle.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The saddle came next, and it was not nearly as bad. Old Daniel held my head while my master laid the saddle gently on my back. He tightened the girths beneath my body, talking to me and patting me the whole time. Then came a few oats and a little walk. He repeated this every day until I began to look forward to both the oats and the saddle.
        - id: ch01-b11
          speaker: narrator
          text: >-
            At last, one morning, my master climbed onto my back and rode me around the meadow on the soft grass. It certainly felt strange. Even so, I was rather proud to carry him. He rode me a little each day, and before long I was used to it.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The next unpleasant lesson was wearing iron shoes. That was hard at first, too. My master took me to the blacksmith's forge himself so he could make sure I was neither hurt nor frightened. The blacksmith lifted my feet one at a time and trimmed away part of each hoof. It did not hurt, so I stood quietly on three legs until he had finished all four.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Then he took an iron piece shaped like my foot and clapped it into place. He drove nails through the shoe and right into my hoof until it held firmly. My feet felt stiff and heavy afterward, but I grew used to the shoes in time.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Once I had come that far, my master began teaching me to work in harness. That meant even more unfamiliar things to wear. First came a stiff, heavy collar around my neck. The bridle had large pieces beside my eyes called blinkers. They deserved the name. I could not see to either side at all. I could only look straight ahead.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Next came a small saddle and a nasty, rigid strap beneath my tail. That was the crupper. I hated it. My long tail had to be doubled up and pushed through the strap, and it felt almost as awful as the bit. I had never wanted to kick so badly. But I could not kick such a good master. Little by little, I became used to every part of the harness, and at last I could do my work as well as my mother.
        - id: ch01-b16
          speaker: narrator
          text: >-
            There was another part of my training that gave me a great advantage. My master sent me to a neighboring farmer for two weeks. One side of the farmer's meadow ran beside the railway. Sheep and cows grazed there, and I was turned out among them.
        - id: ch01-b17
          speaker: narrator
          text: >-
            I will never forget the first train that passed. I was grazing peacefully near the fence between the meadow and the tracks when I heard a strange noise in the distance. Before I could tell where it came from, something long and black flew past with a rush and a clatter, blowing out smoke. It was gone before I could catch my breath.
        - id: ch01-b18
          speaker: narrator
          text: >-
            I spun around and galloped to the far side of the meadow as fast as I could. There I stood, snorting in fear and amazement. Many more trains passed that day, some moving more slowly. Those stopped at the nearby station. Sometimes they gave an awful shriek and groan before coming to a stop.
        - id: ch01-b19
          speaker: narrator
          text: >-
            I thought the whole thing was dreadful. Yet the cows kept eating quietly. They barely lifted their heads while that frightening black thing puffed and ground its way past them.
        - id: ch01-b20
          speaker: narrator
          text: >-
            For the first few days, I could not graze in peace. Then I began to notice that the terrible creature never entered the field and never harmed me. Soon I paid no more attention to a passing train than the cows and sheep did.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Since then, I have seen many horses become frightened and restless at the sight or sound of a steam engine. Thanks to my good master's care, I feel as safe at a railway station as I do in my own stable.
        - id: ch01-b22
          speaker: narrator
          text: >-
            If anyone wants to break in a young horse well, that is the way to do it.
        - id: ch01-b23
          speaker: narrator
          text: >-
            My master often drove me beside my mother in double harness. She was steady and could teach me how to move together with her better than an unfamiliar horse could. She told me that good behavior would bring better treatment, and that the wisest thing was always to do my best for my master.
        - id: ch01-b24
          speaker: duchess
          text: >-
            But remember, there are many kinds of men. Some are good and thoughtful, like our master. Any horse can be proud to serve a man like that. Others are bad and cruel. They should never be allowed to call a horse or dog their own.
        - id: ch01-b25
          speaker: duchess
          text: >-
            And then there are the foolish ones. They may be vain, ignorant, or careless, and they never stop to think. Those men ruin more horses than anyone else, simply because they have no sense. They may not mean to cause harm, but they cause it all the same.
        - id: ch01-b26
          speaker: duchess
          text: >-
            I hope you end up in good hands. Still, a horse can never know who might buy him or who might drive him. For us, it is all a matter of chance. Wherever you are, do your best and keep your good name.
