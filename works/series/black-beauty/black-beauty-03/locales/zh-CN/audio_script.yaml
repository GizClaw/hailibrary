audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述成长经历时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    mother:
      display_name: 公爵夫人
      tts:
        delivery: 慈爱稳重，劝诫时清醒而郑重
        timbre: 温暖醇厚
        pace: 从容
        pitch: 中低
    squire_gordon:
      display_name: 戈登乡绅
      tts:
        delivery: 沉稳审慎，说话简洁笃定
        timbre: 厚实清晰
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 长大了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我渐渐长得漂亮了。毛变得又细又软，浑身乌黑发亮。我有一只白蹄，额头上还长着一颗好看的白星。大家都说我十分俊美。可主人直到我满四岁才肯卖我。他总说，少年不能像成年男人那样干活，小马没长成，也不能当成年马使唤。
        - id: ch01-b02
          speaker: narrator
          text: 四岁那年，戈登乡绅来看我。他先看我的眼睛和嘴，又查看四条腿，从上到下都摸了一遍。然后，我在他面前走了几步，又小跑，再放开腿飞奔。他似乎很喜欢我。
        - id: ch01-b03
          speaker: squire_gordon
          text: 这匹马要是认真调教好了，会很出色。
        - id: ch01-b04
          speaker: narrator
          text: 主人说，他会亲自调教我。他不愿让我受惊，也不愿我受伤。第二天，训练就开始了。
        - id: ch01-b05
          speaker: narrator
          text: 你也许不知道，调教一匹马要教些什么。马得学会戴马鞍和辔头，让男人、女人或孩子骑在背上。他们想往哪儿，马就得往哪儿，还要走得安安静静。马也得习惯颈圈、尻带和后鞧，穿戴这些东西时站着不动。接下来，身后还会套上货车或轻便马车。这样一来，无论走还是跑，都得把车拖在后面。赶车人要快，就得快。赶车人要慢，也得慢。
        - id: ch01-b06
          speaker: narrator
          text: 看见什么都不能受惊，不能跟别的马打招呼，也不能咬，不能踢。马不能再由着自己的性子来。哪怕累了，饿了，也得听主人的话。最难的是，套具一上身，高兴了不能蹦，累坏了也不能躺下。你看，调教一匹马，真不是一件小事。
    - id: ch02
      title: 嚼子、马鞍和蹄铁
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 笼头和马络头，我早就戴惯了。有人牵着我在田野和小路上走，我也能一直安安静静。可现在，我要戴嚼子和辔头了。主人照常拿来燕麦，耐心哄了我很久，才把嚼子塞进我嘴里，把辔头系好。那东西可真难受！
        - id: ch02-b02
          speaker: narrator
          text: 没含过嚼子的人，想不到那滋味有多糟。一大块冰冷的硬钢，足有人的手指那么粗，就这样塞进嘴里，卡在牙齿之间，压着舌头。钢条两头从嘴角伸出去，再用皮带从头顶、喉下、鼻子和下巴绕过去，牢牢固定住。不管怎么挣，都甩不掉这个又硬又讨厌的东西。太难受了，真的太难受了！至少，那时我是这么想的。
        - id: ch02-b03
          speaker: narrator
          text: 可我知道，母亲每次出门都要戴嚼子，马长大以后都是这样。主人又给我香香的燕麦，轻轻拍我，温和地跟我说话，做什么都很轻柔。慢慢地，我总算肯戴嚼子和辔头了。
        - id: ch02-b04
          speaker: narrator
          text: 接着轮到马鞍。这就没有嚼子那么糟。老丹尼尔扶着我的头，主人轻轻把鞍放到我背上，再从肚子底下扣紧肚带。他一边做，一边拍着我，和我说话。然后，他给我几口燕麦，牵着我走一会儿。每天都是这样。后来，我一看见燕麦和马鞍，心里反倒盼着它们来了。
        - id: ch02-b05
          speaker: narrator
          text: 终于有一天早晨，主人跨到我背上，骑着我绕牧场走。脚下是柔软的青草。背上驮着人，感觉的确很古怪。不过，能驮主人，我还有点自豪。他每天只骑一小会儿，很快我就习惯了。
        - id: ch02-b06
          speaker: narrator
          text: 下一件不舒服的事，是钉蹄铁。刚开始也很难熬。主人陪我到铁匠铺，亲眼看着，免得我受伤或受惊。铁匠把我的蹄子一只只托起来，削去一点蹄甲。那并不疼，我就用三条腿站好，等他把四只蹄子全修完。
        - id: ch02-b07
          speaker: narrator
          text: 铁匠拿来一块和我蹄子形状一样的铁，啪地扣上去，再把钉子穿过蹄铁，钉进蹄甲里。这样，蹄铁就牢牢固定住了。起初，我觉得四只脚又僵又沉。后来，也就习惯了。
    - id: ch03
      title: 套具和火车
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 学到这里，主人开始教我驾车。身上又多了好些陌生东西。先是又硬又重的颈圈，正好套住脖子。辔头两边还有两大片眼罩，贴在眼睛旁边。它们叫眼罩，真是一点也没叫错。戴上以后，两边什么都看不见，只看得到正前方。
        - id: ch03-b02
          speaker: narrator
          text: 然后是一副小马鞍，还有一条又硬又讨厌的带子，正好勒在尾巴下面。那就是尻带。我恨透了它。长尾巴被折起来，还得硬从那条带子里穿过去，难受得几乎不比嚼子差。我从来没有那么想踢人。可主人对我这么好，我当然不能踢他。日子一久，所有套具我都习惯了，干起活来也能像母亲一样好。
        - id: ch03-b03
          speaker: narrator
          text: 我的训练里还有一件很要紧的事。它后来给了我很大好处。主人把我送到附近的一户农场，住上两个星期。那里的牧场有一边紧挨着铁路，里面还放着几只羊和几头牛。我也和它们一起待在牧场上。
        - id: ch03-b04
          speaker: narrator
          text: 第一列火车从旁边开过时，我正在铁路边的木栅栏附近安静吃草。远处忽然传来一种怪声。我还没弄清声音从哪儿来，就听见轰隆哐啷的一阵巨响，烟气呼呼地喷着，一长列黑乎乎的东西从眼前飞了过去。我还没来得及喘口气，它已经不见了。
        - id: ch03-b05
          speaker: narrator
          text: 我转身就跑，一口气冲到牧场最远的那头，站在那里不停喷着鼻息，又惊讶又害怕。那一天，火车一列接一列地经过。有些开得慢，会停在附近的车站。有时，火车停下来以前，还会发出吓人的尖啸和呻吟。我觉得太可怕了。可那些牛只管安静吃草。那黑色的怪东西喷着气，嘎吱轧轧地开过去，它们连头都很少抬。
        - id: ch03-b06
          speaker: narrator
          text: 头几天，我连草也吃不安稳。后来，我看出这头可怕的怪物从不闯进牧场，也不会伤害我，就不再那么在意了。没过多久，火车经过时，我和那些牛羊一样，根本不把它当回事。
        - id: ch03-b07
          speaker: narrator
          text: 后来，我见过不少马。它们一看见蒸汽机车，或是一听见它的声音，就惊慌得不肯安静。可主人早早替我想到了这一点。多亏他照料得周到，我待在火车站，就像待在自己的马厩里一样镇定。要想把一匹小马调教好，就该用这样的办法。
    - id: ch04
      title: 母亲的叮嘱
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 主人常让我和母亲并排套在一起拉车。她性情稳重，教我怎样走，比一匹陌生的马教得更好。母亲告诉我，表现得越好，别人也会待我越好。无论什么时候，尽力让主人满意，才是最聪明的做法。可她还有一番更郑重的话要告诉我。
        - id: ch04-b02
          speaker: mother
          text: 人有许多种。像我们主人这样善良、体贴的人，任何一匹马都可以为侍奉他而自豪。可也有坏心肠的残忍之徒，他们根本不配拥有马，也不配拥有狗。
        - id: ch04-b03
          speaker: mother
          text: 还有很多人十分愚蠢。他们爱慕虚荣，无知，粗心，从来不肯动脑子想一想。糟蹋马最多的，反而是这种人，只因为他们没有见识。他们并不是存心害马，可到头来，还是把马害了。
        - id: ch04-b04
          speaker: mother
          text: 我盼着你以后能落到好人手里。可一匹马永远不知道谁会买下他，也不知道往后由谁来驾驭。我们全得碰运气。不过我还是那句话，不管到了哪里，都要尽力做到最好，守住自己的好名声。
