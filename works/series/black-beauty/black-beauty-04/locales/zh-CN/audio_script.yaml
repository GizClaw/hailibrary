audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述成长经历时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    master:
      display_name: 主人
      tts:
        delivery: 平日亲切和善，斥责恶行时果断严厉
        timbre: 厚实明亮
        pace: 稳健
        pitch: 中
    merrylegs:
      display_name: 快乐脚
      tts:
        delivery: 活泼自信，热心健谈，偶尔摆出老资格的神气
        timbre: 轻快明亮
        pace: 稍快而灵动
        pitch: 中高
    ginger:
      display_name: 姜黄
      tts:
        delivery: 戒备而尖锐，话里带着受过伤害后的倔强
        timbre: 清晰硬朗
        pace: 稍慢
        pitch: 中
  chapters:
    - id: ch01
      title: 离开第一个家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那时候，我住在马厩里，每天都有人替我刷毛，一直刷到我的黑毛像乌鸦翅膀那样发亮。五月初，戈登乡绅家来了一个人，要把我带到庄园去。临走时，主人来向我告别。
        - id: ch01-b02
          speaker: master
          text: 再见了，小黑。要做一匹好马，不管遇到什么事，都要尽力做好。
        - id: ch01-b03
          speaker: narrator
          text: 我不会开口说“再见”，只能把鼻子放进主人手里。他亲切地拍了拍我，我便离开了出生后的第一个家。后来，我在戈登乡绅那里住了好几年。先让我说说那座庄园吧。
        - id: ch01-b04
          speaker: narrator
          text: 庄园紧挨着伯特威克村。入口有一扇高大的铁门，旁边立着第一座门房。进门以后，要沿平坦的路向前小跑，从一丛丛高大古老的树木之间穿过。再过一座门房和一道门，眼前就是宅邸和花园。后面还有近宅牧场、老果园和马厩。
        - id: ch01-b05
          speaker: narrator
          text: 那里能容下许多马匹和车辆，不过我只说自己住的马厩。马厩很宽敞，有四个舒服的马栏。一扇大活页窗朝院子敞开，屋里透气又舒适。头一个马栏方方正正，格外宽大，后面还用一道木门围住。其余几个虽然也不错，却小得多。
        - id: ch01-b06
          speaker: narrator
          text: 大马栏里的干草架和谷料槽都很低。它叫散放栏，因为住在里面的马不用拴住，可以随意走动。对一匹马来说，能有这样的地方住，可真好。
    - id: ch02
      title: 新邻居快乐脚
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 马夫把我带进散放栏。里面很干净，气味清爽，空气也流通。我从没住过比这里更好的地方。墙不太高，上面装着铁栏杆，外面的动静我全能看见。马夫给我上好的燕麦，又拍拍我，温和地说了几句话，才转身离开。
        - id: ch02-b02
          speaker: narrator
          text: 吃完谷料以后，我四下看了看。隔壁站着一匹又矮又胖的灰色小马。他的鬃毛和尾巴很浓密，脑袋十分漂亮，小鼻子神气地翘着。我把头抬到散放栏上方的铁栏杆边，向他问好。
        - id: ch02-b03
          speaker: narrator
          text: 你好呀！你叫什么名字？
        - id: ch02-b04
          speaker: narrator
          text: 他受笼头系绳拘着，只能尽量把身子转过来，然后高高昂起了头。
        - id: ch02-b05
          speaker: merrylegs
          text: 我叫快乐脚，模样可俊啦！小小姐们常骑我，有时我还拉着低矮的轻便马车，送女主人出门。她们都很看重我，詹姆斯也很喜欢我。你以后就住我隔壁吗？
        - id: ch02-b06
          speaker: narrator
          text: 我回答说，是的。
        - id: ch02-b07
          speaker: merrylegs
          text: 那我可希望你脾气好。我不愿意住在一匹会咬人的马旁边。
    - id: ch03
      title: 姜黄的不满
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 话音刚落，更远的马栏上方探出一只马头。她是一匹高挑的栗色母马，脖颈修长漂亮，可耳朵向后压着，目光也不大友善。她越过快乐脚盯着我。
        - id: ch03-b02
          speaker: ginger
          text: 原来是你占了我的散放栏。你这么一匹小公马，一来就把一位女士赶出自己的家，倒真少见。
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: 我请她原谅，也请她别误会。我根本没有把谁赶出去，是带我来的人把我安置在这里，这件事由不得我。再说，我已经满四岁，是一匹成年马了。在这以前，我从没跟任何公马或母马争吵过，只希望大家能和睦相处。
        - id: ch03-b04
          speaker: ginger
          text: 是不是这样，以后就知道了。我当然不想跟你这样的小年轻争吵。
        - id: ch03-b05
          speaker: narrator
          text: 我没有再接话。到了下午，姜黄出门以后，快乐脚才把原委讲给我听。
    - id: ch04
      title: 散放栏的原委
      blocks:
        - id: ch04-b01
          speaker: merrylegs
          text: 姜黄有个坏习惯，总爱张嘴咬人，还会猛扑过去，所以大家才给她起了这个名字。以前住散放栏的时候，她就常这么干。有一回，她把詹姆斯的胳膊都咬出了血。
        - id: ch04-b02
          speaker: merrylegs
          text: 弗洛拉小姐和杰茜小姐本来最喜欢我，可那以后，她们吓得不敢进马厩了。过去她们常给我带苹果、胡萝卜，或者一片面包。自从姜黄住进散放栏，她们就不再来了，我可想她们呢。只要你不咬人，也不扑人，也许她们又肯来了。
        - id: ch04-b03
          speaker: narrator
          text: 我告诉快乐脚，我只咬过青草、干草和谷料，怎么也想不通，姜黄为什么会觉得咬人有意思。
        - id: ch04-b04
          speaker: merrylegs
          text: 我想，她并不觉得有意思。那只是个坏习惯。她说从没有人好好待过她，既然如此，她为什么不能咬人？这毛病当然很不好。不过，她讲的若都是真的，那她来这里以前，一定吃过很多苦。
        - id: ch04-b05
          speaker: merrylegs
          text: 约翰和詹姆斯都想尽办法让她高兴。只要马做得对，主人从来不用鞭子。所以到了这里，她本来可以改改脾气的。
        - id: ch04-b06
          speaker: narrator
          text: 快乐脚摆出一副见多识广的神气，又接着说下去。
        - id: ch04-b07
          speaker: merrylegs
          text: 你看，我已经十二岁，知道的事可多了。方圆这一带，没有比这里更适合马儿生活的地方。约翰是世上最好的马夫，在这里干了十四年。詹姆斯也是你从没见过的那种好心肠小伙子。所以呀，姜黄没能继续住在散放栏，完全是她自己的错。
