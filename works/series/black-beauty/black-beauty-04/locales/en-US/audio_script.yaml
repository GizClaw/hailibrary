audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    old_master:
      display_name: My First Master
      tts:
        delivery: kind and quietly encouraging
        timbre: mature and warm
        pace: unhurried
        pitch: medium-low
    merrylegs:
      display_name: Merrylegs
      tts:
        delivery: lively, confident, and good-natured
        timbre: bright and friendly
        pace: moderately quick
        pitch: medium-high
    ginger:
      display_name: Ginger
      tts:
        delivery: proud, guarded, and sharp
        timbre: strong and slightly rough
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Leaving My First Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Around that time, I stood in the stable each day while my coat was brushed until it shone like a rook's wing. Then, early in May, a man came from Squire Gordon's and took me away to the hall.
        - id: ch01-b02
          speaker: old_master
          text: >-
            Goodbye, Darkie. Be a good horse, and always do your best.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I could not say goodbye, so I pressed my nose into his hand. He gave me a kind pat, and I left the first home I had ever known. I would spend several years with Squire Gordon, so let me tell you about the place.
        - id: ch01-b04
          speaker: narrator
          text: >-
            His park ran along the edge of Birtwick village. You entered through a broad iron gate beside the first lodge. A smooth road led between groups of grand old trees to another lodge and another gate. Beyond those stood the house and gardens. Farther on were the home paddock, the old orchard, and the stables.
        - id: ch01-b05
          speaker: narrator
          text: >-
            There was room for many horses and carriages, but the stable where they put me is the one that matters here. It was spacious, with four good stalls and a large swinging window that opened onto the yard. Fresh air came through, and the whole stable felt pleasant.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The first stall was a large square space with a wooden gate across the back. The other three were ordinary stalls. They were good ones, though much smaller. The large stall had a low rack for hay and a low manger for corn. It was called a loose box because a horse stayed there without being tied and could move around as he pleased. A loose box is a wonderful thing.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The groom led me into that fine box. It was clean, sweet-smelling, and airy. I had never known a better one. Its sides were low enough for me to watch everything through the iron rails along the top. The groom gave me delicious oats, patted me, spoke gently, and left.
    - id: ch02
      title: My New Neighbors
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            After I finished my corn, I looked around. A small, plump gray pony stood in the next stall. He had a thick mane and tail, a lovely head, and a pert little nose. I raised my head to the rails above my box.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Hello there. What's your name?
        - id: ch02-b03
          speaker: narrator
          text: >-
            He turned as far as his halter allowed and lifted his head.
        - id: ch02-b04
          speaker: merrylegs
          text: >-
            I'm Merrylegs, and I'm very handsome. The young ladies ride on my back, and sometimes I pull our mistress in the low chair. They think the world of me, and James does too. So, will you be living in that box next to me?
        - id: ch02-b05
          speaker: narrator
          text: >-
            Yes, I will.
        - id: ch02-b06
          speaker: merrylegs
          text: >-
            Then I hope you have a pleasant temper. I can't stand having a neighbor who bites.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Just then, another horse looked over from the stall beyond him. Her ears lay back, and her eye seemed rather cross. She was a tall chestnut mare with a long, handsome neck.
        - id: ch02-b08
          speaker: ginger
          text: >-
            So you're the one who pushed me out of my box. Imagine a young colt coming in and taking a lady's own home!
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: >-
            I'm sorry, but I didn't push anyone out. The man who brought me chose this box. I had no say in it. And I'm not a colt anymore. I'm four years old and fully grown. I've never quarreled with any horse or mare, and I want us to live peacefully.
        - id: ch02-b10
          speaker: ginger
          text: >-
            We'll see about that. I certainly don't plan to quarrel with a youngster like you.
        - id: ch02-b11
          speaker: narrator
          text: >-
            I let the matter end there.
    - id: ch03
      title: What Merrylegs Knew
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            That afternoon, Ginger went out, and Merrylegs explained everything to me.
        - id: ch03-b02
          speaker: merrylegs
          text: >-
            Here's what happened. Ginger has a nasty habit of biting and snapping. That's how she got her name. When she had the loose box, she snapped at everyone. One day she bit James's arm and drew blood. After that, Miss Flora and Miss Jessie were afraid to enter the stable.
        - id: ch03-b03
          speaker: merrylegs
          text: >-
            Those girls are very fond of me. They used to bring me treats, like an apple, a carrot, or a piece of bread. But once Ginger moved into that box, they didn't dare come near, and I missed them terribly. If you don't bite or snap, perhaps they'll visit again.
        - id: ch03-b04
          speaker: narrator
          text: >-
            I told him I had never bitten anything except grass, hay, and corn. I could not imagine what Ginger got from doing it.
        - id: ch03-b05
          speaker: merrylegs
          text: >-
            I doubt she gets any pleasure from it. It's simply a bad habit. She says nobody was ever kind to her, so why shouldn't she bite? Of course it's wrong. Still, if her story is true, people must have treated her very badly before she came here.
        - id: ch03-b06
          speaker: merrylegs
          text: >-
            John and James both do everything they can to make her comfortable. Our master never whips a horse that behaves properly. You'd think Ginger could learn to be good-tempered here.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Merrylegs gave me a very knowing look.
        - id: ch03-b08
          speaker: merrylegs
          text: >-
            I'm twelve years old, you know. I've learned a great deal, and I can tell you there isn't a better home for a horse anywhere around. John is the finest groom there is, and he's worked here for fourteen years. As for James, you could never find a kinder boy. So if Ginger lost that loose box, she has only herself to blame.
