audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    john:
      display_name: 约翰
      tts:
        delivery: 稳重耐心，谈起马匹时专业而亲切
        timbre: 温厚沉稳
        pace: 从容
        pitch: 中低
    master:
      display_name: 主人
      tts:
        delivery: 宽厚克制，忧心时声音低沉而真诚
        timbre: 成熟温润
        pace: 沉稳
        pitch: 中低
    mistress:
      display_name: 女主人
      tts:
        delivery: 温柔亲切，病中虚弱却仍带关怀
        timbre: 甜美轻柔
        pace: 缓慢
        pitch: 中高
    villager_1:
      display_name: 村民甲
      tts:
        delivery: 朴实诚挚，告别时满怀关切
        timbre: 成熟温厚
        pace: 适中
        pitch: 中
    villager_2:
      display_name: 村民乙
      tts:
        delivery: 朴实诚挚，告别时满怀关切
        timbre: 清晰柔和
        pace: 适中
        pitch: 中高
    villager_3:
      display_name: 村民丙
      tts:
        delivery: 朴实诚挚，告别时满怀关切
        timbre: 低沉温暖
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 悲伤的变故
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我在那个幸福的家里住了三年。可就在这时，一场令人难过的变故临近了。我们常听人说，女主人病了。医生一次次来到宅子，主人脸上也总带着忧虑。
        - id: ch01-b02
          speaker: narrator
          text: 后来，消息终于传来。女主人必须马上离家，到温暖的地方住两三年。这个消息就像丧钟一样落在全家人心上。人人都很悲伤，可主人只能立刻遣散家中上下，准备离开英国。马厩里从早到晚谈的也只有这件事。
        - id: ch01-b03
          speaker: narrator
          text: 约翰干活时沉默不语，满脸愁容。就连乔，也几乎不吹口哨了。宅子里整天有人进进出出，姜饼和我忙个不停。
        - id: ch01-b04
          speaker: narrator
          text: 最先走的是杰茜小姐、弗洛拉小姐和她们的女家庭教师。临行前，她们特意来向我们告别，还紧紧搂住快乐腿，把他当作相伴多年的老朋友。他也的确是。
        - id: ch01-b05
          speaker: narrator
          text: 我们很快也知道了自己的去处。主人把姜饼和我卖给老朋友W伯爵，相信伯爵会好好待我们。牧师家正想为布洛姆菲尔德太太找一匹小马，主人便把快乐腿送给了牧师，但有两个条件。他永远不能再被卖掉。等他老得不能干活了，就该给他一枪，让他安静地死去，再好好埋葬。
        - id: ch01-b06
          speaker: narrator
          text: 乔会到牧师家照料快乐腿，也帮着料理家事。我听了很放心，知道快乐腿有了好归宿。约翰倒有好几个不错的职位可以选，可他不急着答应，只说要再看一看。
    - id: ch02
      title: 约翰的打算
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 临走的前一天晚上，主人来到马厩，交代完事情，又最后一次拍了拍自己的马。他的声音低沉极了。我一听便知道，他心里有多难过。我们马能从声音里听懂的东西，也许比许多人还多。
        - id: ch02-b02
          speaker: master
          text: 约翰，你想好接下来做什么了吗？听说那几个职位，你都没有答应。
        - id: ch02-b03
          speaker: john
          text: 是的，先生。我想去找一位真正出色的幼马调教师或驯马师，跟着他做事。许多年轻牲口本来可以好好的，却因为人用错了办法，受了惊，连脾气也毁了。要是从一开始就有人好好带它们，事情不会变成那样。
        - id: ch02-b04
          speaker: john
          text: 我一向能和马相处。若能帮一些年轻的马顺顺当当地迈出第一步，我也算做了点好事。先生，您觉得这条路合适吗？
        - id: ch02-b05
          speaker: master
          text: 我想遍了认识的人，也找不出谁比你更合适。你懂马，马也不知不觉地懂你。往后，你还可以自己开业。我看这就是最好的选择。需要我帮忙时，只管写信来。我会告诉伦敦的代理人，也把你的品行证明留给他。
        - id: ch02-b06
          speaker: narrator
          text: 主人把代理人的姓名和地址给了约翰，又感谢他多年来一直忠心效劳。可约翰听不下去了。
        - id: ch02-b07
          speaker: john
          text: 先生，请别再说了，我实在受不住。您和我亲爱的女主人帮了我那么多，我这一辈子也还不清。我们永远不会忘记您。愿上帝保佑，也许有一天，女主人会像从前一样健康地回来。先生，咱们不能丢掉希望。
        - id: ch02-b08
          speaker: narrator
          text: 主人握住约翰的手，却什么也说不出来。随后，他们一起离开了马厩。
    - id: ch03
      title: 最后一次出发
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 最后那个悲伤的日子还是来了。男仆和大件行李头一天已经先走，家里只留下主人、女主人和她的贴身女仆。姜饼和我把马车拉到宅邸门前。这是最后一次了。
        - id: ch03-b02
          speaker: narrator
          text: 仆人们把靠垫、毯子和许多随身物品搬上车。等一切放好，主人抱着女主人走下台阶。我套在靠近宅子的一边，把眼前的一切都看得清清楚楚。他轻轻把女主人安顿在车里，家里的仆人围在四周，谁都忍不住流泪。
        - id: ch03-b03
          speaker: master
          text: 再向大家道一声珍重吧。你们每一个人，我们都不会忘记。
        - id: ch03-b04
          speaker: narrator
          text: 主人说完便上了车。
        - id: ch03-b05
          speaker: master
          text: 走吧，约翰。
        - id: ch03-b06
          speaker: narrator
          text: 乔跳上车，我们缓缓小跑着穿过庄园，又穿过村子。村民们都站在自家门口，只为再看主人一家最后一眼。
        - id: ch03-b07
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: 愿上帝保佑他们。
        - id: ch03-b08
          speaker: narrator
          text: 村民们站在门前说着这句话，目送我们离开。
    - id: ch04
      title: 不再是我们的家
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了火车站，我想女主人是自己从马车走进候车室的。随后，我听见她用一贯甜美的声音向约翰告别。
        - id: ch04-b02
          speaker: mistress
          text: 再见，约翰。愿上帝保佑你。
        - id: ch04-b03
          speaker: narrator
          text: 我感觉缰绳轻轻动了一下，可约翰没有回答。也许那时的他根本说不出话。乔卸完车上的东西，约翰让他守在我们身边，自己走上了月台。
        - id: ch04-b04
          speaker: narrator
          text: 可怜的乔紧紧挨着我们的头，用我们挡住脸上的泪。很快，火车喷着蒸汽进站了。只过了两三分钟，车门接连砰砰关上，列车员吹响哨子，火车缓缓滑走。站里只剩下一团团白烟，还有几颗无比沉重的心。
        - id: ch04-b05
          speaker: narrator
          text: 火车彻底看不见以后，约翰才回到我们身边。
        - id: ch04-b06
          speaker: john
          text: 我们再也见不到她了。再也见不到了。
          emotion: sad
        - id: ch04-b07
          speaker: narrator
          text: 他拿起缰绳，登上车夫座，和乔一起慢慢驾车回去。可是，那里已经不再是我们的家了。
