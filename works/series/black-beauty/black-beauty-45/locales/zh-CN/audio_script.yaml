audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    gentleman:
      display_name: 一位先生
      tts:
        delivery: 习惯发号施令，对等候者缺少体谅
        timbre: 清晰端正
        pace: 适中
        pitch: 中
    servant:
      display_name: 仆人
      tts:
        delivery: 敷衍随意，不把车夫的处境放在心上
        timbre: 平直清楚
        pace: 适中
        pitch: 中
    polly:
      display_name: 波莉·巴克
      tts:
        delivery: 温柔务实，谈到家人时沉静而坚决
        timbre: 温暖柔和
        pace: 舒缓
        pitch: 中
    jerry:
      display_name: 杰里·巴克
      tts:
        delivery: 爽朗亲切，说起原则时坚定而不说教
        timbre: 结实温暖
        pace: 明快平稳
        pitch: 中低
    harry:
      display_name: 哈里
      tts:
        delivery: 活泼顽皮，说话爽脆
        timbre: 清亮稚嫩
        pace: 偏快
        pitch: 中高
    grant:
      display_name: 格兰特
      tts:
        delivery: 坦率随和，承认弱点时带着惭愧和自嘲
        timbre: 粗厚朴实
        pace: 适中
        pitch: 中低
    dolly:
      display_name: 多莉
      tts:
        delivery: 天真亲近，带着孩子的好奇
        timbre: 轻柔稚嫩
        pace: 适中
        pitch: 高
  chapters:
    - id: ch01
      title: 风雪中的新年前夜
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            圣诞节和新年，有些人过得快快活活。可对出租马车夫和他们的马来说，这时候生意虽好，却没有一天像假日。聚会、舞会和娱乐场所都开着，活儿又重，收工又晚。屋里的人伴着音乐不停地跳舞，门外的车夫和马却常要在雨里、霜里等上几个钟头，冷得浑身直发抖。我总在想，那些衣着华美的太太小姐，有没有想过车夫还坐在高高的车座上，已经疲惫不堪。他那匹耐心的马也一直站着，四条腿都快冻僵了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            那阵子，晚上的活儿大多由我来干。我已经习惯久站，杰里也怕年轻的烈火受寒。圣诞节那一周，我们常常忙到深夜，杰里的咳嗽越来越厉害。不论我们回去得有多晚，波莉总会一直守着等他，再提着一盏灯笼从屋里出来迎接。她望着杰里时，脸上的焦虑和忧愁，谁都看得出来。
        - id: ch01-b03
          speaker: narrator
          text: >-
            新年前夜，我们送两位先生去西区一座广场上的人家。晚上九点，他们下了车，叫我们十一点再回来。
        - id: ch01-b04
          speaker: gentleman
          text: 今晚打牌，散场时也许会晚几分钟。你们可别迟到。
        - id: ch01-b05
          speaker: narrator
          text: >-
            十一点的钟声刚刚响起，我们已经准时停在那户人家的门口。杰里向来守时。可一刻钟、两刻钟、三刻钟接连过去，后来连十二点也敲过了，那扇门还是没有打开。
        - id: ch01-b06
          speaker: narrator
          text: >-
            白天的风向变来变去，还夹着一阵阵雨。到了夜里，凛冽的风卷着雨夹雪，像是从四面八方直扑过来。天气冷得刺骨，四周连个避风处都没有。杰里下了车座，把我身上的一块罩布往颈上多拉了些。他来回走了两趟，用力跺脚，又甩起胳膊取暖，可这一动便咳个不停。
        - id: ch01-b07
          speaker: narrator
          text: >-
            他只好打开车门，坐到车厢底下，两脚搁在人行道上，多少能挡一点风。钟声每隔一刻钟仍会响起，却始终没人出来。十二点半，杰里去按门铃，问仆人今晚到底还用不用车。
        - id: ch01-b08
          speaker: servant
          text: 当然用得着。你不能走，牌局很快就散了。
        - id: ch01-b09
          speaker: narrator
          text: >-
            杰里只得又坐下来。他的声音已经哑得让我几乎听不清。一点一刻，门终于打开，两位先生总算出来了。他们一句话也没说，钻进车厢便叫杰里赶往近两英里外的地方。我的四条腿早已冻麻了，刚起步时，我真怕自己会失蹄跌倒。
        - id: ch01-b10
          speaker: narrator
          text: >-
            到了地方，两人下了车，没有为让我们苦等这么久说一句抱歉，反而嫌车钱太贵。杰里从来不多收应得的钱，却也绝不会少收，他们只得付足两个钟头又一刻钟的等候费。只是这笔钱，杰里挣得实在太苦了。
    - id: ch02
      title: 杰里病倒了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            我们总算回到家时，杰里已经几乎说不出话，咳嗽声也十分吓人。波莉什么都没有追问，只打开门，提着灯笼替他照亮。
        - id: ch02-b02
          speaker: polly
          text: 我能替你做些什么？
        - id: ch02-b03
          speaker: jerry
          text: 先给杰克弄点热乎的，再替我煮些燕麦粥。
        - id: ch02-b04
          speaker: narrator
          text: >-
            这几句话只是嘶哑的耳语，他连气都快喘不上来了。可他还是像平常每次收工后那样，仔细替我擦净身子。他甚至爬上干草棚，多抱下一整捆麦秸，把我的床铺得更厚。波莉又端来一份温热的麸皮粥，我吃下去，身上舒服多了。等我安顿好，他们才锁上马房门走了。
        - id: ch02-b05
          speaker: narrator
          text: >-
            第二天很晚才有人来，而且只有哈里一个。他替我们梳洗、喂食，打扫马栏，又像星期日那样把麦秸铺回去。他安静得出奇，既不吹口哨，也不唱歌。中午，他带着多莉再来添草料、喂水。多莉一直在哭。我从他们的话里听出，杰里病得很危险，医生也说情况很糟。
        - id: ch02-b06
          speaker: narrator
          text: >-
            两天就这样过去，屋里人人忧心不已。我们只见得到哈里，偶尔也见到多莉。波莉始终守在杰里身边，而杰里必须安安静静地休养，不能受到一点打扰。我想，多莉是因为没人陪伴，才会跑来马房找我们的。
        - id: ch02-b07
          speaker: narrator
          text: 第三天，哈里正在马房里，门上轻轻响了几下。格兰特走了进来。
        - id: ch02-b08
          speaker: grant
          text: 孩子，我不去屋里打扰了，只想问问你父亲现在怎么样。
        - id: ch02-b09
          speaker: harry
          text: >-
            他病得很重，恐怕不能更糟了。他们说这叫“支气管炎”。医生说，熬过今晚，病情就会见分晓。
          emotion: fearful
        - id: ch02-b10
          speaker: grant
          text: >-
            这可太糟了。我认识的两个人上星期就死在这病上，它要起命来快得很。不过，人只要活着就还有希望。你得打起精神来。
        - id: ch02-b11
          speaker: harry
          text: >-
            医生说，父亲不喝酒，所以比大多数人更有希望。昨天烧得那么厉害，要是他平时喝酒，高热早就像烧一张纸那样把他烧光了。我觉得医生相信他能挺过来。格兰特先生，您也相信他会好起来，对吧？
          emotion: fearful
        - id: ch02-b12
          speaker: narrator
          text: 格兰特听了，脸上露出为难的神情。
        - id: ch02-b13
          speaker: grant
          text: >-
            要是好人都该熬过这种病，那你父亲一定能挺过来。他是我认识的人里最好的一个。明天一早，我再来看你们。
    - id: ch03
      title: 格兰特伸出援手
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天一早，格兰特果然又来了。
        - id: ch03-b02
          speaker: grant
          text: 你父亲怎么样了？
        - id: ch03-b03
          speaker: harry
          text: 父亲好些了。母亲盼着他能熬过去。
        - id: ch03-b04
          speaker: grant
          text: >-
            感谢上帝！你们要让他暖暖和和的，别让他操心。说到这里，我也想谈谈两匹马。杰克在暖和的马房里休息一两个星期，反而会更好。你每天牵他去街上走走，让他活动腿脚就够了。
          emotion: happy
        - id: ch03-b05
          speaker: grant
          text: >-
            可那匹年轻马不一样。没活儿干，他很快就会憋得浑身是劲，你恐怕管不住。等他再次出门，准会闹出事故。
        - id: ch03-b06
          speaker: harry
          text: 他现在已经快成这样了。我给他减了燕麦，可他还是精神十足，我真不知道该怎么办。
        - id: ch03-b07
          speaker: grant
          text: >-
            那就这么办。只要你母亲答应，在事情安排好以前，我每天来牵烈火出去，让他好好干一阵。他挣的钱，我分一半给你母亲，正好贴补草料。你父亲入的互助会虽好，那笔钱却养不了马。它们一直闲着，只吃不干，家里可受不了。我中午再来听你母亲怎么说。
        - id: ch03-b08
          speaker: narrator
          text: >-
            格兰特没等哈里开口道谢便走了。中午，他应当已经见过波莉，因为他和哈里一起来到马房，给烈火套好挽具，把他牵出去干活。此后一个多星期，他每天都来。哈里只要向他道谢，或提起他的好意，他总笑着把话岔开。他说，这是自己运气好，因为他手下的马正需要歇一歇，要不是有烈火，它们还没有这个机会呢。
        - id: ch03-b09
          speaker: narrator
          text: >-
            杰里的身体一天比一天好起来。可医生说，他要想平平安安活到老，就再也不能回去赶出租马车。两个孩子常常凑在一起商量，父亲母亲以后该怎么办，他们自己又能怎样帮家里挣钱。
    - id: ch04
      title: 费尔斯托的来信
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一天下午，烈火回来时浑身又湿又脏。
        - id: ch04-b02
          speaker: grant
          text: 街上全是雪泥。孩子，把他刷干净、擦干，你自己也能暖和起来。
        - id: ch04-b03
          speaker: harry
          text: 没问题。不把他收拾干净，我绝不会走。您知道，我是父亲一手教出来的。
        - id: ch04-b04
          speaker: grant
          text: 真希望所有孩子都像你一样受过教导。
        - id: ch04-b05
          speaker: narrator
          text: 哈里正用海绵擦掉烈火身上和腿上的泥。多莉走进来，满脸都是藏不住的心事。
        - id: ch04-b06
          speaker: dolly
          text: 哈里，谁住在费尔斯托？母亲收到那里寄来的信，高兴极了，拿着信就跑上楼找父亲去了。
        - id: ch04-b07
          speaker: harry
          text: >-
            你不记得吗？福勒太太住在那里，就是母亲从前服侍过的女主人。去年夏天父亲遇见过她，她还送给你和我每人五先令。
        - id: ch04-b08
          speaker: dolly
          text: 原来是福勒太太！我当然记得。真想知道她在信里说了些什么。
        - id: ch04-b09
          speaker: harry
          text: >-
            母亲上星期给她写过信。福勒太太说过，父亲哪天不赶出租马车了，一定要告诉她。快进去看看回信写了什么吧。
        - id: ch04-b10
          speaker: narrator
          text: >-
            哈里继续用力刷马，嘴里“嘘唰、嘘唰”地吆喝，活像个老马夫。没过几分钟，多莉便连蹦带跳地跑回马房。
        - id: ch04-b11
          speaker: dolly
          text: >-
            哈里，再没有比这更好的事了！福勒太太请我们全家搬去她附近。那里有座空着的小屋，正适合我们住，还有花园、鸡舍、苹果树，什么都有！她的车夫春天要走，到时候她想请父亲接替他。
          emotion: happy
        - id: ch04-b12
          speaker: dolly
          text: >-
            附近还有好些体面人家。你可以去做园丁、马夫，也可以当侍童。我也有好学校可以上。母亲一会儿笑，一会儿哭，父亲看起来别提多高兴了！
          emotion: happy
        - id: ch04-b13
          speaker: harry
          text: >-
            这可真是太棒了，父亲母亲都会喜欢。不过，我才不要穿着紧绷绷的衣服，扣上一排排纽扣去当侍童。我要做马夫，要不就做园丁。
          emotion: happy
    - id: ch05
      title: 告别杰里一家
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            事情很快定了下来。等杰里的身体经得住路途，他们便搬到乡下。出租马车和两匹马，也要尽快卖掉。
        - id: ch05-b02
          speaker: narrator
          text: >-
            这个消息落在我心上，却十分沉重。我已经不年轻，不能指望往后的日子会变好。离开伯特威克以后，我从没有像跟着亲爱的主人杰里时这样幸福。可是，就算得到最好的照料，拉上三年出租马车也会损耗体力。我知道，自己已经不是从前的那匹马了。
        - id: ch05-b03
          speaker: narrator
          text: >-
            格兰特马上说，他愿意收下烈火。车站也有几个车夫想买我，可杰里不肯把我随便卖给谁，再让我去拉出租马车。格兰特便答应杰里，一定会替我找一个能过得舒适安稳的去处。
        - id: ch05-b04
          speaker: narrator
          text: >-
            离开的日子终于到了。杰里仍不准出门。从那个新年前夜起，我再也没有见过他。波莉和孩子们来到马房，向我告别。
        - id: ch05-b05
          speaker: polly
          text: 可怜的老杰克，亲爱的老杰克！真希望我们能带你一起走。
          emotion: sad
        - id: ch05-b06
          speaker: narrator
          text: >-
            波莉说完，把手放在我的鬃毛上，又把脸贴近我的脖颈，轻轻亲了亲我。多莉一边哭，一边也走过来亲我。哈里一句话都没有说，只是把我抚摸了很久。他看起来非常悲伤。最后，我被人从这个家牵走，去往了一个新的住处。
