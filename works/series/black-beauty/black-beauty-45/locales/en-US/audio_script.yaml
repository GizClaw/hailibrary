  chapters:
    - id: ch01
      title: New Year's Eve
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Christmas and New Year's may be merry for some people, but they are no holiday for cabmen or their horses. The work may pay well, yet it is hard and often lasts late into the night. Parties, balls, and other amusements keep the cabs busy. A driver and his horse may wait for hours in rain or frost, shivering outside while music plays and people dance indoors. I have often wondered whether the beautifully dressed ladies ever think of the tired cabman on his box, or the patient horse whose legs are growing stiff with cold.
        - id: ch01-b02
          speaker: narrator
          text: >-
            By then, I did most of the evening work. I was used to standing still, and Jerry worried more about Hotspur catching cold. During Christmas week, we had many late nights, and Jerry's cough grew worse. No matter how late we returned, Polly waited up. She always came out with a lantern to meet him, and her face looked anxious and troubled.
        - id: ch01-b03
          speaker: narrator
          text: >-
            On New Year's Eve, we drove two gentlemen to a house in one of the West End squares. We let them out at nine o'clock. They told Jerry to return at eleven.
        - id: ch01-b04
          speaker: gentleman_one
          text: >-
            It's a card party, so you may have to wait a few minutes. Just don't be late.
        - id: ch01-b05
          speaker: narrator
          text: >-
            When the clock struck eleven, we were waiting at the door. Jerry was always punctual. The clock chimed each quarter hour. One quarter, then two, then three. At last it struck twelve, but the door still did not open.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The wind had shifted all day, bringing sudden showers. Now sharp sleet drove at us from every side. It was bitterly cold, and there was nowhere to shelter. Jerry climbed down and pulled one of my cloths farther over my neck. He walked back and forth a couple of times, stamping his feet. Then he beat his arms against himself, but that started his cough again. So he opened the cab door and sat low inside it, with his feet on the pavement. That gave him a little protection.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Still the quarter hours chimed, and no one came. At half past twelve, Jerry rang the bell and asked the servant whether the gentlemen would need him that night.
        - id: ch01-b08
          speaker: servant
          text: >-
            Oh, they'll need you, all right. You can't leave. The party will be over soon.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Jerry sat down again. His voice had become so hoarse that I could barely hear him. Not until a quarter past one did the door finally open. The two gentlemen came out, got into the cab without a word, and gave Jerry an address nearly two miles away.
        - id: ch01-b10
          speaker: narrator
          text: >-
            My legs were numb with cold, and I thought I might stumble. When we reached the address, the men got out. They never apologized for making us wait so long. Instead, they complained about the fare. Jerry never charged more than he was owed, but he never accepted less either. They had to pay for two hours and fifteen minutes of waiting. Jerry had earned that money the hard way.
    - id: ch02
      title: Jerry Falls Ill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            At last we reached home. Jerry could hardly speak, and his cough sounded dreadful. Polly did not ask questions. She opened the door and held up the lantern for him.
        - id: ch02-b02
          speaker: polly
          text: >-
            Is there anything I can do?
        - id: ch02-b03
          speaker: jerry
          text: >-
            Yes. Make Jack something warm, then boil some gruel for me.
        - id: ch02-b04
          speaker: narrator
          text: >-
            He could only whisper the words, and he was struggling to breathe. Even so, he rubbed me down as he always did. He even climbed into the hayloft and brought back an extra bundle of straw for my bed. Polly gave me a warm mash, which made me comfortable. Then they locked the stable door.
        - id: ch02-b05
          speaker: narrator
          text: >-
            No one came until late the next morning, and then it was only Harry. He cleaned and fed us, swept the stalls, and put the straw back as though it were Sunday. He was very quiet. He did not whistle or sing. At noon, he returned with our food and water, and this time Dolly came too. She was crying. From their words, I understood that Jerry was dangerously ill. The doctor said it was a serious case.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Two days passed with great worry inside the house. We saw only Harry, and sometimes Dolly. I think Dolly came because she wanted company. Polly stayed beside Jerry, who had to be kept very quiet.
        - id: ch02-b07
          speaker: narrator
          text: >-
            On the third day, Harry was in the stable when someone tapped at the door. Governor Grant came in.
        - id: ch02-b08
          speaker: grant
          text: >-
            I didn't want to bother anyone at the house, Harry, but I need to know. How is your father?
        - id: ch02-b09
          speaker: harry
          text: >-
            He's terribly sick. He could hardly be worse. They call it bronchitis. The doctor says that tonight it will either turn for the better or the worse.
        - id: ch02-b10
          speaker: grant
          text: >-
            That's bad. Very bad. Two men I knew died from it last week. It can take a man so quickly. But while there's life, there's hope. You must keep your courage up.
        - id: ch02-b11
          speaker: harry
          text: >-
            I will. The doctor said Father has a better chance than most men because he doesn't drink. Yesterday his fever was so high that, if he'd been a drinking man, it would have burned him up like paper. I think the doctor believes he'll recover. Don't you think he will, Mr. Grant?
        - id: ch02-b12
          speaker: narrator
          text: >-
            Grant looked uncertain.
        - id: ch02-b13
          speaker: grant
          text: >-
            If good men had a special right to recover from an illness like this, then your father surely would. He's the best man I know. I'll come by early tomorrow.
        - id: ch02-b14
          speaker: narrator
          text: >-
            Grant returned early the next morning.
        - id: ch02-b15
          speaker: grant
          text: >-
            Well? How is he?
        - id: ch02-b16
          speaker: harry
          text: >-
            Father's better. Mother hopes he's going to recover.
        - id: ch02-b17
          speaker: grant
          emotion: happy
          text: >-
            Thank God!
    - id: ch03
      title: Grant Lends a Hand
      blocks:
        - id: ch03-b01
          speaker: grant
          text: >-
            Now you must keep him warm and keep his mind free from worry. That brings me to the horses. A week or two of rest in a warm stable will do Jack good. You can lead him up and down the street now and then so he can stretch his legs. But the young horse is different. Without work, he'll get so full of energy that you won't be able to manage him. Then, when he finally does go out, there could be an accident.
        - id: ch03-b02
          speaker: harry
          text: >-
            He's nearly at that point already. I've cut down his corn, but he has so much spirit that I don't know what to do with him.
        - id: ch03-b03
          speaker: grant
          text: >-
            That's just what I thought. Tell your mother that, if she agrees, I'll come for Hotspur every day until your family makes other plans. I'll give him a good stretch of work. Whatever he earns, I'll bring half to your mother. That will help pay for the horses' feed. I know your father belongs to a good club, but the club won't feed these two while they stand here eating and earning nothing. I'll return at noon and hear what she says.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Grant left before Harry could thank him. At noon, I believe he spoke with Polly. Then he and Harry came into the stable together, harnessed Hotspur, and took him out.
        - id: ch03-b05
          speaker: narrator
          text: >-
            For more than a week, Grant came each day for Hotspur. Whenever Harry thanked him or mentioned his kindness, Grant laughed it away. He claimed the arrangement was simply good luck for him, since it gave his own horses a rest they would not otherwise have had.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Jerry steadily improved, but the doctor gave him a warning. If Jerry hoped to live to old age, he must never drive a cab again. The children held many talks about what their father and mother could do next, and how they might help earn money.
        - id: ch03-b07
          speaker: narrator
          text: >-
            One afternoon, Hotspur returned soaked and covered in dirt.
        - id: ch03-b08
          speaker: grant
          text: >-
            The streets are all slush today. Cleaning and drying him will warm you up nicely, my boy.
        - id: ch03-b09
          speaker: harry
          text: >-
            I'll take care of him, Governor. I won't leave until he's clean and dry. My father trained me well, you know.
        - id: ch03-b10
          speaker: grant
          text: >-
            I wish every boy had been trained as well as you.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Harry began sponging the mud from Hotspur's body and legs. Then Dolly came into the stable. She looked as if she were bursting with news.
        - id: ch03-b12
          speaker: dolly
          text: >-
            Harry, who lives at Fairstowe? Mother got a letter from there. She looked so pleased, and she ran upstairs to show it to Father.
        - id: ch03-b13
          speaker: harry
          text: >-
            Don't you remember? Fairstowe is Mrs. Fowler's home. She was Mother's mistress years ago. Father met her last summer, and she sent five shillings to each of us.
        - id: ch03-b14
          speaker: dolly
          text: >-
            Oh, Mrs. Fowler! Of course I remember her. What do you think she's writing to Mother about?
        - id: ch03-b15
          speaker: harry
          text: >-
            Mother wrote to her last week. Mrs. Fowler once said she wanted to know if Father ever stopped driving a cab. I wonder what her answer says. Run inside and find out, Dolly.
        - id: ch03-b16
          speaker: narrator
          text: >-
            Harry kept scrubbing Hotspur and made the same soothing sounds an old stableman would make. A few minutes later, Dolly came dancing back into the stable.
    - id: ch04
      title: The Letter from Fairstowe
      blocks:
        - id: ch04-b01
          speaker: dolly
          emotion: happy
          text: >-
            Oh, Harry, nothing could be more wonderful! Mrs. Fowler says we're all to go and live near her. There's an empty cottage that will be just right for us. It has a garden, a henhouse, apple trees, and everything! Her coachman is leaving in the spring, and then she wants Father to take his place. There are good families nearby too, so you could find work in a garden or a stable, or become a page boy. And there's a good school for me! Mother keeps laughing and crying, and Father looks so happy!
        - id: ch04-b02
          speaker: harry
          emotion: happy
          text: >-
            That's wonderful news! It sounds exactly right for both Father and Mother. But I won't be a page boy, dressed in tight clothes with rows of buttons. I'll be a groom or a gardener.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The family soon decided everything. As soon as Jerry was strong enough, they would move to the country. The cab and both horses would be sold as quickly as possible.
    - id: ch05
      title: Good-bye to Jerry's Family
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            That news weighed heavily on me. I was no longer young, and I could not expect my circumstances to improve. Since leaving Birtwick, I had never been as happy as I was with my dear master Jerry. But even under the best care, three years of cab work will wear down a horse's strength. I knew I was not the horse I once had been.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Grant immediately offered to take Hotspur. Some men at the cabstand would have bought me, but Jerry refused to send me back into cab work with just anyone. Grant promised him that he would find me a place where I could be comfortable.
        - id: ch05-b03
          speaker: narrator
          text: >-
            At last, the day came for the family to leave. Jerry still was not allowed outside. I never saw him again after that New Year's Eve. Polly and the children came to say good-bye to me.
        - id: ch05-b04
          speaker: polly
          emotion: sad
          text: >-
            Poor old Jack. Dear old Jack. I wish we could take you with us.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Polly rested a hand on my mane. Then she brought her face close to my neck and kissed me. Dolly was crying, and she kissed me too. Harry stroked me again and again, but he said nothing. He only looked very sad.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Then I was led away to my new home.
