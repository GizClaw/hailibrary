audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    friend_coachman:
      display_name: 车夫
      tts:
        delivery: 友善爽直，谈起马匹时笃定而有经验
        timbre: 温暖粗厚
        pace: 适中
        pitch: 中低
    john:
      display_name: 约翰
      tts:
        delivery: 稳重耐心，谈起马匹时专业而亲切
        timbre: 温厚沉稳
        pace: 从容
        pitch: 中低
    james:
      display_name: 詹姆斯
      tts:
        delivery: 开朗随和，谈话时自然爽快
        timbre: 年轻清亮
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 回到自己的马厩
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 接下来的路走得很轻松。太阳落山没多久，我们就到了主人朋友家。有人把我们牵进一间干净又舒适的马厩。那里的车夫很和气。他听过火灾的事，对詹姆斯十分敬重，也把我们安顿得妥妥帖帖。
        - id: ch01-b02
          speaker: friend_coachman
          text: 年轻人，有件事很清楚，你的马知道谁靠得住。马厩不管是着了火，还是进了大水，要把马牵出去都难极了。我也说不清他们为什么不肯走，可他们就是不走。二十匹马里，恐怕都找不出一匹肯出来的。
        - id: ch01-b03
          speaker: narrator
          text: 我们在那儿住了两三天，才动身回家。一路平平安安。我们回到自己的马厩，心里很高兴，约翰看到我们，也一样高兴。
        - id: ch01-b04
          speaker: narrator
          text: 晚上，约翰和詹姆斯要走的时候，詹姆斯提起了接替他的人。
        - id: ch01-b05
          speaker: james
          text: 不知道谁会到这儿，接下我的活儿。
        - id: ch01-b06
          speaker: john
          text: 是门房家的小乔·格林。
        - id: ch01-b07
          speaker: james
          text: 小乔·格林？他不还是个孩子吗？
        - id: ch01-b08
          speaker: john
          text: 他已经十四岁半了。
        - id: ch01-b09
          speaker: james
          text: 可他个子那么小！
        - id: ch01-b10
          speaker: john
          text: 个子是小了点，可他脑子快，肯干活，心眼儿也好。他很想来，他父亲也愿意让他来。主人呢，也想给他一次机会。主人说，要是我觉得这孩子不合适，他就去找个大些的。我说可以先让乔试六个星期。
        - id: ch01-b11
          speaker: james
          text: 才六个星期？他起码得学上六个月，才能真正帮得上忙。这么一来，你可要多干好多活儿了，约翰。
        - id: ch01-b12
          speaker: john
          text: 那有什么可怕的？我和活儿向来是好朋友。我这辈子还没怕过干活呢。
        - id: ch01-b13
          speaker: james
          text: 约翰，你真是个好人。但愿我以后也能像你一样。
    - id: ch02
      title: 约翰往日的故事
      blocks:
        - id: ch02-b01
          speaker: john
          text: 我平常很少讲自己的事。可你马上要离开我们，一个人到外头谋生活了，我就告诉你，我为什么这样看。父母染上热病、先后去世时，我和约瑟夫现在一样大。两个人走了还不到十天，只留下我和瘸腿的妹妹奈莉。我们在世上孤零零的，连一个可以投靠的亲戚也没有。
        - id: ch02-b02
          speaker: john
          text: 那时我只是农场里的小工，赚来的钱连自己都不够用，哪里养得起两个人。要不是女主人帮忙，奈莉就只能进济贫院。奈莉一直叫她天使，她也确实当得起。女主人出钱，让她在马利特寡妇家租了一间屋。奈莉身体好些的时候，女主人就把编织和针线活儿交给她。等她病了，又送去饭菜和许多舒服实用的东西，照顾她就像照顾自己的女儿。
        - id: ch02-b03
          speaker: john
          text: 主人把我领到马厩，让我跟当时的车夫老诺曼学本事。我在宅子里吃饭，晚上睡在草料棚上。主人还给我一套衣服，每星期三个先令，所以我能拿钱帮助奈莉。
        - id: ch02-b04
          speaker: john
          text: 老诺曼年纪已经大了。他本来大可以说，自己不愿费神去教一个刚从犁后面来的毛头孩子。可他没有。他待我像亲生父亲，不知花了多少心思教我。几年后，老人去世了，我就接下他的职位。现在我拿的是最高一等工钱，还能存些钱，不论下雨天还是晴天，都有个准备。奈莉也活得像小鸟一样快活。
        - id: ch02-b05
          speaker: john
          text: 所以你看，詹姆斯，我受过别人这么多照顾，又怎么能嫌弃一个小孩子，让善良的主人失望？我当然不能那么做。我会很想念你，可我们总能把事情办好。行善的机会送到眼前，就该伸手去做。没有什么比这更好了。我能帮上乔，心里很高兴。
    - id: ch03
      title: 不能只顾自己
      blocks:
        - id: ch03-b01
          speaker: james
          text: 那么，你不赞成那句话了？人人只管自己，先把自己照顾好。
        - id: ch03-b02
          speaker: john
          text: 我当然不赞成。要是主人、女主人，还有老诺曼，当年都只顾自己，我和奈莉会怎么样？她早进了济贫院，我还在田里锄芜菁呢。要是你在火里也只想着自己，黑骏马和金儿会落到什么下场？他们早就给活活烤死了！
        - id: ch03-b03
          speaker: john
          text: 不，吉姆，那种话不管是谁说的，都又自私又没良心。一个人要是觉得活着什么都不用管，只要顾好自己，那他还不如没睁开眼，就像刚生下来的小狗小猫一样被淹死。这就是我的看法。
        - id: ch03-b04
          speaker: narrator
          text: 约翰说完，坚决地猛点了一下头。詹姆斯笑了，可他再开口时，嗓子有些发紧。
        - id: ch03-b05
          speaker: james
          text: 除了母亲，你就是我最好的朋友。我希望你不会把我忘了。
          emotion: sad
        - id: ch03-b06
          speaker: john
          text: 不会，孩子，我当然不会。以后只要有我能帮你的事，你也别忘了来找我。
    - id: ch04
      title: 小乔开始学活儿
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天，乔来到马厩。他想赶在詹姆斯走以前，能学多少就学多少。他先学扫马厩，又学着搬麦秸和干草。后来，他开始擦挽具，还帮忙洗马车。
        - id: ch04-b02
          speaker: narrator
          text: 乔的个子太矮了，根本够不着给金儿和我好好梳洗。詹姆斯便让他先在快乐腿身上练习。等詹姆斯走后，乔要在约翰照看下，独自负责快乐腿。他是个讨人喜欢的小家伙，聪明又活泼，每次来做事，都是一路吹着口哨。
        - id: ch04-b03
          speaker: narrator
          text: 快乐腿起初很不高兴。按他的话说，一个什么都不会的孩子，成天在他身上乱摸乱弄，实在叫他受不了。可到了第二个星期快结束时，他却悄悄告诉我，这孩子以后应该能干得很好。
    - id: ch05
      title: 詹姆斯离开家
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 詹姆斯该走的日子终于来了。他平时一直兴高采烈，那天早上却显得十分难过。
        - id: ch05-b02
          speaker: james
          text: 约翰，你看，我这一走，要留下的实在太多了。母亲、贝茜，还有你。这里有这么好的主人和女主人，有这些马，还有我的老快乐腿。可到了新地方，我连一个认识的人都没有。要不是那份职位更好，能让我多帮母亲一点，我真不知道自己能不能下定决心。这一关太难过了。
          emotion: sad
        - id: ch05-b03
          speaker: john
          text: 是啊，詹姆斯，孩子，我知道这不好受。可你第一次离开家，要是一点也不难过，我反而会看轻你。打起精神来。你到了那边会认识新朋友的。你一定能把事情做好。这样一来，你母亲也会得到不少帮助。你能进那么好的人家做事，她不知会多么骄傲。
        - id: ch05-b04
          speaker: narrator
          text: 约翰就这样劝他振作。可大家都舍不得詹姆斯，快乐腿尤其想他。詹姆斯走后，快乐腿一连几天没精打采，连东西也吃不下。于是约翰带我活动时，连续几个早晨都给快乐腿系上牵绳，让他跟在我旁边小跑一阵，再痛痛快快地飞奔一阵。小家伙的精神慢慢回来了，不久就完全恢复了。
        - id: ch05-b05
          speaker: narrator
          text: 乔的父亲懂马厩里的活儿，常常过来帮一点忙。乔自己也肯花心思学。约翰看着他的进步，心里越来越有信心。
