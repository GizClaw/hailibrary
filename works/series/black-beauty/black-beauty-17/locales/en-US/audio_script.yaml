  chapters:
    - id: ch01
      title: Home Again
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The rest of our trip was easy. A little after sunset, we reached the home of my master's friend. Ginger and I were led into a clean, cozy stable. The coachman there was kind and made us comfortable. When he heard about the fire, he was clearly impressed with James.
        - id: ch01-b02
          speaker: kind_coachman
          text: >-
            One thing's certain, young man. Your horses know they can trust you. Getting horses out of a burning or flooded stable is one of the hardest jobs there is. I couldn't tell you why they refuse to leave, but they do. You might get one horse in twenty to come out.
        - id: ch01-b03
          speaker: narrator
          text: >-
            We stayed there for two or three days, then started home. The return trip went smoothly. Ginger and I were glad to see our own stable again, and John was just as glad to see us.

            That night, before John and James left the stable, James asked who would take his place.
        - id: ch01-b04
          speaker: james
          text: >-
            So, who's coming in after I leave?
        - id: ch01-b05
          speaker: john
          text: >-
            Little Joe Green, from the lodge.
        - id: ch01-b06
          speaker: james
          text: >-
            Little Joe Green? He's only a child!
        - id: ch01-b07
          speaker: john
          text: >-
            He's fourteen and a half.
        - id: ch01-b08
          speaker: james
          text: >-
            But he's such a small fellow!
    - id: ch02
      title: Giving Joe a Chance
      blocks:
        - id: ch02-b01
          speaker: john
          text: >-
            That's true. But he's quick, willing, and kindhearted. He wants the job badly, and his father wants it for him too. The master would like to give him a chance. He told me he'd find a bigger boy if I didn't think Joe could manage. I said I'd be happy to try him for six weeks.
        - id: ch02-b02
          speaker: james
          text: >-
            Six weeks? It'll take him six months before he's much help! You'll be giving yourself a lot more work, John.
        - id: ch02-b03
          speaker: narrator
          text: >-
            John laughed.
        - id: ch02-b04
          speaker: john
          text: >-
            Work and I get along just fine. I've never been afraid of it.
        - id: ch02-b05
          speaker: james
          text: >-
            You're a good man, John. I hope I can be like you someday.
        - id: ch02-b06
          speaker: john
          text: >-
            I don't talk about myself very often. But you're about to leave us and make your own way in the world, so I'll tell you why I see things this way.
    - id: ch03
      title: What Kindness Had Done
      blocks:
        - id: ch03-b01
          speaker: john
          text: >-
            I was the same age Joseph is now when my father and mother caught the fever. They died within ten days of each other. That left my sister Nelly and me alone, with no family we could ask for help. Nelly was disabled, and I was only a farm boy. I didn't earn enough to support myself, much less both of us. She would have been sent to the workhouse if our mistress hadn't stepped in. Nelly calls her an angel, and she has every right to.

            The mistress rented Nelly a room with old Widow Mallet. When Nelly was well enough, she gave her knitting and sewing to do. When Nelly was sick, she sent over dinners and all kinds of comforting things. She treated my sister like a mother.
        - id: ch03-b02
          speaker: john
          text: >-
            Then the master put me to work in the stable under old Norman, who was the coachman back then. I got my meals at the house, a bed in the loft, a suit of clothes, and three shillings each week. That meant I could help Nelly.

            And Norman could have said he was too old to bother with a farm boy who knew nothing but walking behind a plow. Instead, he treated me like a son. He took endless trouble teaching me. When he died some years later, I took his place. Now I earn the top wage and can save something for a rainy day, or a sunny one, whichever comes. And Nelly is as happy as a bird.
        - id: ch03-b03
          speaker: john
          text: >-
            So you see, James, I'm the last man who should look down on a little boy and disappoint a kind master. No, no. I'll miss you terribly, but we'll manage. When the chance to do someone a kindness comes your way, there's nothing like taking it. I'm glad I can.
        - id: ch03-b04
          speaker: james
          text: >-
            Then you don't agree with that saying, "Everybody look after himself, and take care of number one"?
        - id: ch03-b05
          speaker: john
          text: >-
            Not for a moment! Where would Nelly and I be if the master, the mistress, and old Norman had cared only about themselves? She'd be in the workhouse, and I'd still be hoeing turnips. And where would Black Beauty and Ginger be if you'd put yourself first? You'd have left them to burn to death!

            No, Jim. Whoever says such a thing is selfish and godless. A man who believes his only duty is to take care of himself might as well have been drowned like a puppy or kitten before his eyes were open. That's what I think.
        - id: ch03-b06
          speaker: narrator
          text: >-
            John finished with a sharp, certain jerk of his head. James laughed, but when he answered, his voice sounded thick with feeling.
        - id: ch03-b07
          speaker: james
          text: >-
            You've been my best friend, except for my mother. I hope you won't forget me.
          emotion: sad
        - id: ch03-b08
          speaker: john
          text: >-
            No, lad, never. And if there's ever something I can do for you, I hope you'll remember me too.
    - id: ch04
      title: Joe Learns the Work
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Joe came to the stable the next day so he could learn as much as possible before James left. He learned how to sweep, carry in straw and hay, and clean the harness. He also helped wash the carriage.

            Joe was far too short to groom Ginger or me, so James taught him by letting him practice on Merrylegs. Joe would be responsible for the pony, though John would supervise him. Joe was a bright, pleasant little fellow, and he always came to work whistling.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Merrylegs was quite annoyed at first. As he put it, a boy who knew nothing was mauling him about. But near the end of the second week, he spoke to me privately.
        - id: ch04-b03
          speaker: merrylegs
          text: >-
            You know, Beauty, I think that boy may turn out all right after all.
    - id: ch05
      title: James Says Goodbye
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            At last, the day came for James to leave. He was usually cheerful, but that morning he looked deeply unhappy.
        - id: ch05-b02
          speaker: james
          text: >-
            You see, John, I'm leaving so much behind. There's my mother and Betsy, and you. There's a good master and mistress, all the horses, and my old Merrylegs. At the new place, I won't know a single person. If it weren't a better position, and if it didn't mean I could help my mother more, I don't think I could make myself go. Leaving really hurts, John.
          emotion: sad
        - id: ch05-b03
          speaker: john
          text: >-
            It does, James, and I'd think less of you if you could leave home for the first time without feeling it. But keep your spirits up. You'll make friends there. I'm sure you'll do well, and that will mean a great deal to your mother. She'll be mighty proud to have you in such a good position.
          emotion: calm
        - id: ch05-b04
          speaker: narrator
          text: >-
            John managed to encourage him, but everyone was sorry to lose James. Merrylegs missed him so badly that for several days he hardly ate. John began taking him along on a lead rein in the mornings when he exercised me. The little pony trotted and galloped beside me until his spirits returned, and soon he was himself again.

            Joe's father understood stable work, and he often came in to lend a hand. Joe worked very hard to learn. The more John saw of him, the more hopeful he became.
