cover_prompt: |-
  A wordless cover scene in the English countryside of the nineteenth century centers on Black Beauty in a green meadow after rain. He is a strong glossy black horse with a clear white star on his forehead, one white foot, alert ears, and a gentle intelligent gaze. His chestnut friend Ginger and small gray pony Merrylegs stand farther back near a wooden stable and an elm-lined lane, while a kind young groom in plain period work clothes opens the pasture gate. Black Beauty steps freely toward the open gate, making trust and dignity the focal action. Use a low horse-height three-quarter view with the path curving into layered fields and generous clearing sky at the top. Keep tack, clothing, stable details, and equine anatomy historically and physically credible, with no frightening treatment of hardship. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
