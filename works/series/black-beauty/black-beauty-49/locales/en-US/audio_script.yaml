  chapters:
    - id: ch01
      title: A Trial with the Ladies
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One day that summer, the groom cleaned me with extraordinary care. He trimmed the hair around my legs, brushed tar over my hoofs, and even parted my forelock. My harness seemed to have an extra shine, too. I was sure another change was coming. Willie looked both excited and uneasy as he climbed into the chaise beside his grandfather.
        - id: ch01-b02
          speaker: thoroughgood
          text: >-
            If the ladies like him, this could be a good home for him and a good horse for them. We can only give it a try.
        - id: ch01-b03
          speaker: narrator
          text: >-
            A mile or two beyond the village, we stopped at a pretty low house. A lawn and shrubs stood in front, with a drive leading to the door. Willie rang the bell and asked for Miss Blomefield or Miss Ellen. Both were home. Willie stayed with me while Mr. Thoroughgood went inside.
        - id: ch01-b04
          speaker: narrator
          text: >-
            About ten minutes later, he came out with three ladies. One was tall and pale, wrapped in a white shawl. She leaned on a younger woman with dark eyes and a cheerful face. The third was the stately Miss Blomefield. They looked me over and asked several questions. The younger lady, Miss Ellen, liked me at once.
        - id: ch01-b05
          speaker: miss_ellen
          text: >-
            I'm sure I would like him. He has such a kind face.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The tall, pale lady was not so sure.
        - id: ch01-b07
          speaker: miss_lavinia
          emotion: fearful
          text: >-
            I would always feel nervous riding behind a horse that has fallen once. He might fall again, and if he did, I don't think I would ever recover from the fright.
        - id: ch01-b08
          speaker: thoroughgood
          text: >-
            You know, ladies, many excellent horses have had their knees broken because a driver was careless. It wasn't the horse's fault at all. From what I've seen, I believe that is what happened to this one. Still, I don't want to sway you. You may take him on trial if you wish, and your coachman can judge him for himself.
        - id: ch01-b09
          speaker: miss_blomefield
          text: >-
            You have always given us sound advice about our horses, so your recommendation means a great deal to me. If my sister Lavinia has no objection, we will gladly accept a trial.
        - id: ch01-b10
          speaker: narrator
          text: >-
            They arranged to send for me the next day.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The next morning, a smart-looking young man arrived. He seemed pleased at first. Then he noticed my knees, and his voice fell with disappointment.
        - id: ch01-b12
          speaker: joe_green
          text: >-
            Sir, I didn't expect you to recommend a blemished horse like this to my ladies.
        - id: ch01-b13
          speaker: thoroughgood
          text: >-
            A horse proves his worth by what he does. You're only taking him on trial, and I know you'll treat him fairly. If he isn't as safe as any horse you've ever driven, send him back.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The young man led me to my new home. There I was put in a comfortable stable, given food, and left alone.
    - id: ch02
      title: Joe Green Knows Me
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The next day, the groom was cleaning my face when he noticed the white mark on my forehead.
        - id: ch02-b02
          speaker: joe_green
          text: >-
            That star looks just like Black Beauty's. He's about the same height, too. I wonder where Beauty is now.
        - id: ch02-b03
          speaker: narrator
          text: >-
            As he worked down my neck, he found the small knot in my skin where I had once been bled. He nearly jumped. Then he began examining me from end to end, talking under his breath.
        - id: ch02-b04
          speaker: joe_green
          text: >-
            A white star on his forehead. One white foot on the far side. That little knot in exactly the right place. And look at the middle of his back! There's the patch of white hair John called Beauty's three-penny bit. This has to be Black Beauty! Beauty, do you know me? I'm little Joe Green, the boy who nearly killed you!
        - id: ch02-b05
          speaker: narrator
          text: >-
            He patted me again and again, overjoyed. I could not honestly say I remembered him. He was a grown man now, with black whiskers and a man's voice. But I knew he recognized me, and I was very glad he was Joe Green. I raised my nose to him and tried to show that we were friends. I had never seen a man so delighted.
        - id: ch02-b06
          speaker: joe_green
          emotion: happy
          text: >-
            Give you a fair trial? Of course I will! I wish I knew what scoundrel broke your knees, my old Beauty. Someone has treated you terribly. Well, things will be good for you now if I can help it. I only wish John Manly were here to see you.
        - id: ch02-b07
          speaker: narrator
          text: >-
            That afternoon, I was harnessed to a low park chair and brought to the door. Miss Ellen wanted to try me, and Joe went with her. I soon learned that she was a good driver, and she seemed pleased with the way I moved. As we went along, Joe told her about me. He was certain I was the Black Beauty who had belonged to Squire Gordon.
        - id: ch02-b08
          speaker: narrator
          text: >-
            When we came back, her sisters stepped outside to hear how I had behaved. Miss Ellen told them what Joe had just discovered.
        - id: ch02-b09
          speaker: miss_ellen
          text: >-
            I will write to Mrs. Gordon and tell her that her favorite horse has come to us. She'll be so pleased!
        - id: ch02-b10
          speaker: narrator
          text: >-
            For the next week or so, they drove me every day. Once I had shown how safe I was, Miss Lavinia finally rode behind me in the small closed carriage. That settled it. The ladies would keep me, and they would call me by my old name, Black Beauty.
    - id: ch03
      title: My Last Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            I have lived in this happy home for a full year now. Joe is the kindest and best of grooms. My work is easy and pleasant, and I can feel my strength and good spirits returning. The other day, Mr. Thoroughgood spoke to Joe about me.
        - id: ch03-b02
          speaker: thoroughgood
          text: >-
            With you caring for him, he should live to twenty years old, and perhaps even longer.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Willie talks to me whenever he can and treats me as his own special friend. My ladies have promised that I will never be sold, so there is nothing left for me to fear.
        - id: ch03-b04
          speaker: narrator
          text: >-
            And here my story ends. My troubles are over, and I am home. Often, just before I am fully awake, I imagine that I am back in the orchard at Birtwick, standing with my old friends beneath the apple trees.
