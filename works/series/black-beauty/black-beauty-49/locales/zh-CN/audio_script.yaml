audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温厚沉静，带着历尽波折后的从容
        timbre: 温暖清朗
        pace: 舒缓
        pitch: 中低
    thoroughgood:
      display_name: 瑟罗古德先生
      tts:
        delivery: 仁厚稳重，略带朴实的幽默
        timbre: 饱满温暖
        pace: 从容
        pitch: 中低
    miss_blomefield:
      display_name: 布洛姆菲尔德小姐
      tts:
        delivery: 端庄周全，语气笃定
        timbre: 沉稳清晰
        pace: 平稳
        pitch: 中
    miss_ellen:
      display_name: 埃伦小姐
      tts:
        delivery: 热情爽朗，真挚亲切
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高
    miss_lavinia:
      display_name: 拉维尼娅小姐
      tts:
        delivery: 温柔谨慎，略显怯弱
        timbre: 轻柔纤细
        pace: 舒缓
        pitch: 中
    joe_green:
      display_name: 乔·格林
      tts:
        delivery: 干练诚恳，激动时热切奔放
        timbre: 清朗结实
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 几位小姐来相马
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            那年夏天的一天，马夫把我收拾得异乎寻常地仔细。他修齐我腿上的长毛，在蹄子上刷了焦油，连额前的鬃毛也分梳好了。挽具似乎也擦得格外亮。我心里明白，大概又要有变动了。威利跟祖父坐上轻便马车时，看起来又欢喜，又有点不安。
        - id: ch01-b02
          speaker: thoroughgood
          text: >-
            要是几位小姐喜欢他，这匹马和她们就都找对了。先让她们试试吧。
        - id: ch01-b03
          speaker: narrator
          text: >-
            我们走出村子一两英里，来到一所漂亮的矮房子前。屋前铺着草坪，栽着灌木，一条车道直通门口。威利按了门铃，问布洛姆菲尔德小姐或埃伦小姐在不在。两位都在。于是威利陪着我，瑟罗古德先生进屋去了。
        - id: ch01-b04
          speaker: narrator
          text: >-
            大约十分钟后，三位女士跟着他出来了。一位身材高挑，脸色苍白，身上裹着白披肩，正倚着一位黑眼睛、笑盈盈的年轻女士。第三位举止庄重，她就是布洛姆菲尔德小姐。三个人围着我细看，又问了许多问题。年轻的埃伦小姐一见我就很中意。
        - id: ch01-b05
          speaker: miss_ellen
          text: >-
            我准会喜欢他的。你们瞧，他这张脸多和善呀。
        - id: ch01-b06
          speaker: narrator
          text: >-
            可那位脸色苍白的女士始终放不下心。
        - id: ch01-b07
          speaker: miss_lavinia
          emotion: fearful
          text: >-
            这匹马从前摔倒过，我坐在他拉的车里，总会害怕。万一他再摔一次，我恐怕一辈子都忘不了那场惊吓。
        - id: ch01-b08
          speaker: thoroughgood
          text: >-
            几位小姐，很多顶好的马都因为车夫粗心摔坏过膝盖，马自己一点错也没有。依我看，这匹马就是这样。不过我不想替你们拿主意。你们愿意的话，可以先留下他试用，让你们的马车夫亲自看看他究竟怎么样。
        - id: ch01-b09
          speaker: miss_blomefield
          text: >-
            您一向很懂马，也一直肯给我们好建议，所以您的举荐，我十分看重。妹妹拉维尼娅要是没有异议，我们就先试用他。多谢您的好意。
        - id: ch01-b10
          speaker: narrator
          text: >-
            就这样，她们说定第二天派人来接我。
    - id: ch02
      title: 年轻马夫认出了我
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天早晨，一个衣着利落的年轻人来了。起先，他好像很满意，可一瞧见我的膝盖，声音里立刻透出了失望。
        - id: ch02-b02
          speaker: joe_green
          text: >-
            先生，我真没想到，您会把这样一匹膝盖留着伤痕的马举荐给我家几位小姐。
        - id: ch02-b03
          speaker: thoroughgood
          text: >-
            别光看模样，做得好才是真的好。你只是把他带回去试用。我知道你会公道地待他。要是他没有你赶过的任何一匹马那么稳当，就把他送回来。
        - id: ch02-b04
          speaker: narrator
          text: >-
            年轻人把我牵到新家，安置在一间舒服的马厩里，喂过我以后，便让我独自休息。第二天，他替我清理面部时，忽然注意到了我额头上的白星。
        - id: ch02-b05
          speaker: joe_green
          text: >-
            这块白星真像黑骏马的，他的个头也差不多。不知道黑骏马现在到哪儿去了。
        - id: ch02-b06
          speaker: narrator
          text: >-
            他接着往下刷，摸到了我颈上放过血的地方。那里的皮肤留着一个小硬结。他猛地一惊，从头到尾仔细端详起我来，嘴里还不停念叨。
        - id: ch02-b07
          speaker: joe_green
          text: >-
            额头有白星，右边一只蹄子是白的，这里又正好有个小硬结。再看看背脊中间……没错，那一小块白毛也在。约翰从前总管它叫“美人的三便士银币”。这一定就是黑骏马！美人！美人！你认得我吗？我是小乔·格林呀，就是那个差点害死你的孩子！
        - id: ch02-b08
          speaker: narrator
          text: >-
            他欢喜极了，一下又一下地拍着我。我却不能说自己认出了他。眼前这个英俊青年蓄着黑色的络腮胡，说话也是成年人的声音，早已不是当年的小孩子。不过，我确信他认得我，也确信他正是乔·格林，心里别提多高兴了。我把鼻子凑过去，想让他知道，我们仍是朋友。我从没见过谁欢喜成这个样子。
        - id: ch02-b09
          speaker: joe_green
          text: >-
            当然要公道地试用你，这还用说吗！我的老美人，究竟是哪个恶棍摔坏了你的膝盖？你一定在什么地方吃了不少苦。好了，好了，以后要是你过不上好日子，那就是我的错。我真希望约翰·曼利也在这里，能亲眼看看你。
    - id: ch03
      title: 我留下了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            下午，我套上了一辆低矮的四轮游园马车，被带到门口。埃伦小姐要亲自试车，格林也跟她一起去。我很快就发现，她驾车很在行。她似乎也很满意我的步态。一路上，我听见乔把我的往事讲给她听，还说他敢肯定，我就是戈登乡绅从前的黑骏马。
        - id: ch03-b02
          speaker: narrator
          text: >-
            回到家，另外两姐妹都出来了，急着听我一路表现得怎么样。埃伦小姐把刚知道的事讲给她们听。
        - id: ch03-b03
          speaker: miss_ellen
          emotion: happy
          text: >-
            我一定要写信给戈登太太，告诉她，她最心爱的马来到了我们家。她知道以后，该有多高兴呀！
        - id: ch03-b04
          speaker: narrator
          text: >-
            接下来一个多星期，我天天驾车出门。大家看出我确实稳当，拉维尼娅小姐终于鼓起勇气，坐着那辆小小的封闭马车出去了一趟。此后，她们便拿定主意留下我，还用我原来的名字叫我，也就是黑骏马。
    - id: ch04
      title: 我的故事结束了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            到如今，我已经在这个幸福的地方住了整整一年。乔是最好、最和善的马夫。我要做的活儿轻松又称心，体力和精神也一点点恢复了。前几天，瑟罗古德先生还对乔谈起我。
        - id: ch04-b02
          speaker: thoroughgood
          text: >-
            留在你这里，他活到二十岁不成问题，说不定还能更长寿呢。
        - id: ch04-b03
          speaker: narrator
          text: >-
            威利只要见到我，总会跟我说话，把我当作格外亲近的朋友。几位女主人也答应过，永远不会卖掉我。从此，我再没有什么可怕的了。
        - id: ch04-b04
          speaker: narrator
          text: >-
            我的故事就讲到这里。所有苦难都过去了，我终于回到了家。常常在半梦半醒之间，我仿佛还站在伯特威克的果园里，和那些老朋友一起，守在苹果树下。
