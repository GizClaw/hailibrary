audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    james:
      display_name: 詹姆斯
      tts:
        delivery: 开朗随和，谈话时自然爽快
        timbre: 年轻清亮
        pace: 适中
        pitch: 中
    old_hostler:
      display_name: 老马夫
      tts:
        delivery: 热情爽朗，谈起马匹时熟练自信又满怀疼爱
        timbre: 略显苍老而明亮
        pace: 明快
        pitch: 中高
  chapters:
    - id: ch01
      title: 四十六英里的旅程
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 后来，主人和女主人决定去拜访几位朋友。他们住在四十六英里以外，詹姆斯负责赶车。第一天，我们就走了三十二英里。一路有好几道又长又陡的坡，可詹姆斯赶得细心又稳当，我们并不觉得吃力。
        - id: ch01-b02
          speaker: narrator
          text: 每逢下坡，他都记得扣好刹车，到了平地再及时松开。他还会挑最平整的路面让我们落脚。上坡若是太长，就让车轮略微横过来，挡住马车后退，好给我们留点时间喘气。马最受用的，就是这些细微的照料，更何况他一路还总有温和的话送给我们。
        - id: ch01-b03
          speaker: narrator
          text: 路上歇过一两回，直到太阳将要落山，我们才进了过夜的镇子。集市广场上有一家最大的旅店。马车从拱门下驶进去，里面是一座狭长的院子，马厩和车房都在最深处。
        - id: ch01-b04
          speaker: narrator
          text: 两个马夫迎上来替我们卸套。领头的是个小个子，一条腿有些弯，穿着黄条纹背心，模样和气，动作却快得惊人。他转眼就解开了挽具，拍拍我，说了句好听的话，又把我领进长马厩。那里有六到八个隔间，还住着两三匹马。另一个马夫牵来了金儿，詹姆斯站在一旁，看着他们给我们擦洗干净。
    - id: ch02
      title: 老马夫的手艺
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那个小老头的手又轻又快，我从没让人这样刷洗过。他刚停手，詹姆斯便走近，在我身上到处摸了摸。大概他不相信这么短的工夫能收拾周全，可我的皮毛确实干干净净，摸起来像丝绸一样光滑。
        - id: ch02-b02
          speaker: james
          text: 真了不起。我还以为自己动作已经够快，我们约翰比我更快。可要论又快又周到，我见过的人里，谁也赶不上您。
        - id: ch02-b03
          speaker: old_hostler
          text: 那还不是熟能生巧！干了四十年，要是连这点本事都没练出来，岂不可惜？哈哈！手脚麻利也只是习惯。习惯了快，做起来跟慢一样容易，我看还更轻松呢。明明一会儿就能干完的活，偏要笨手笨脚地拖上一倍时间，我的身子可吃不消。我要也像有些人那样磨蹭，干活时哪还吹得出口哨！
        - id: ch02-b04
          speaker: old_hostler
          text: 我十二岁起就跟马待在一起。猎马厩干过，赛马厩也干过。因为个子小，我还当了好几年骑师。后来在古德伍德，赛场的草地滑得厉害。我那匹可怜的飞燕草摔倒了，我也伤了膝盖，从此再不能在那里做事。可我哪里离得开马，只好转到旅店来。
        - id: ch02-b05
          speaker: old_hostler
          text: 能亲手照料眼前这样的马，真叫人高兴。他血统好，懂规矩，又一直有人用心照看。一匹马平常过的是什么日子，我看得出来。只要让我照料二十分钟，我就能说出他从前遇到的是怎样的马夫。
        - id: ch02-b06
          speaker: old_hostler
          text: 就说这一匹吧，安静又温顺。你要他转身，他就照做。你要清理马蹄，或做别的事，他也肯乖乖抬脚。可有的马总是焦躁不安，不肯按你的意思走，还会突然蹿过隔间。人刚一靠近，他便猛地昂头，压低耳朵，像是怕极了。还有的会转过身，拿后蹄对着你。
        - id: ch02-b07
          speaker: old_hostler
          text: 唉，那些可怜的马。我知道他们以前受过怎样的对待。胆小的马遭到虐待，会受惊乱跳，处处害怕。性子烈的，就会变得凶狠又危险。马长大后的脾气，多半在幼年已经养成。他们和孩子一样。那本好书说得明白，小时候领他走上该走的路，等他年老，只要有机会，也不会离开那条路。
        - id: ch02-b08
          speaker: james
          text: 我真喜欢听您谈这些。我们主人家也是按这个道理对待马的。
        - id: ch02-b09
          speaker: old_hostler
          text: 年轻人，要是方便说，你的主人是哪一位？单看你们的样子，我猜他待马一定很好。
        - id: ch02-b10
          speaker: james
          text: 他是戈登乡绅，住在灯塔山另一边的比特威克庄园。
    - id: ch03
      title: 比狐狸尾巴更贵重
      blocks:
        - id: ch03-b01
          speaker: old_hostler
          text: 原来是戈登乡绅，我听说过他。他很懂马，对吧？听说他还是本郡骑术最好的人。
        - id: ch03-b02
          speaker: james
          text: 我也相信是这样。不过那位可怜的少主人丧命以后，他就很少骑马了。
        - id: ch03-b03
          speaker: old_hostler
          text: 唉，真是不幸。出事的时候，报纸上从头到尾都登了。我记得还有一匹好马也死了，对不对？
          emotion: sad
        - id: ch03-b04
          speaker: james
          text: 是的。那匹马非常出色，是眼前这一匹的兄弟，模样也和他几乎一样。
        - id: ch03-b05
          speaker: old_hostler
          text: 太可惜了，实在可惜。我记得那地方根本不适合跳过去。上面只有一道稀疏的篱笆，下面是直落溪边的陡坡，对不对？马根本看不见自己会落在哪里。
          emotion: sad
        - id: ch03-b06
          speaker: old_hostler
          text: 我并不反对大胆骑行，可有些障碍，只有经验极深的老猎手才有资格去跳。一个人的命和一匹马的命，都比一条狐狸尾巴贵重。至少在我看来，本来就该这样。
        - id: ch03-b07
          speaker: narrator
          text: 他们说话时，另一个马夫已经把金儿收拾好了，也送来了我们的饲料。随后，詹姆斯和老人一起走出了马厩。
