  chapters:
    - id: ch01
      title: The Road to the Hotel
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Not long after that, my master and mistress decided to visit friends who lived about forty-six miles from our home. James was to drive them. We covered thirty-two miles on the first day.

            Some of the hills were long and hard, but James handled us with such care that we never felt badly strained. Going downhill, he always put on the brake, then released it at the proper place. He guided our feet over the smoothest ground. When a climb went on for a long way, he turned the carriage wheels slightly across the road so it could not roll backward, and he let us stop to catch our breath. Small acts like those make a great difference to a horse, especially when they come with kind words.
        - id: ch01-b02
          speaker: narrator
          text: >-
            We rested once or twice along the way. Just as the sun was setting, we reached the town where we would stay that night.

            The main hotel stood in the marketplace, and it was enormous. We passed under an arch into a long yard. The stables and coach houses were at the far end, where two hostlers came to unharness us.

            The head hostler was a pleasant, lively little man. One leg was crooked, and he wore a yellow striped waistcoat. I had never seen anyone undo harness so fast. With a friendly pat and a kind word, he led me into a long stable. It held six or eight stalls, though only two or three other horses were there. The second hostler brought Ginger in, and James stayed while they rubbed us down and cleaned us.
        - id: ch01-b03
          speaker: narrator
          text: >-
            That little old man cleaned me more lightly and quickly than anyone ever had. When he finished, James came over and ran a hand across me. He seemed doubtful that such fast work could have been complete, but my coat was as clean and smooth as silk.
        - id: ch01-b04
          speaker: james
          text: >-
            Well, I used to think I was fast, and our John is faster still. But I've never seen anyone work as quickly and thoroughly as you do.
    - id: ch02
      title: Forty Years with Horses
      blocks:
        - id: ch02-b01
          speaker: old_hostler
          text: >-
            Practice makes perfect. It certainly ought to, anyway. Forty years of practice, and still not perfect? Ha! That would be a shame.

            As for speed, that's just habit. Once you get used to working quickly, it's every bit as easy as working slowly. Easier, if you ask me. My health wouldn't stand all that lumbering around, taking twice as long as a job requires. Why, I couldn't even whistle if I crept through my work the way some people do!

            I've worked with horses since I was twelve. I started in hunting stables, then racing stables. I was small, you see, so I spent several years as a jockey. Then, at Goodwood, the turf was terribly slippery. My poor Larkspur fell, and I broke my knee. Of course, I was no use as a jockey after that.

            But live without horses? I couldn't do it. Of course I couldn't. So I began working at hotels.
        - id: ch02-b02
          speaker: old_hostler
          text: >-
            And let me tell you, handling an animal like this is a real pleasure. He's well bred, well behaved, and well cared for. Oh, I can tell how a horse has been treated. Let me handle one for twenty minutes, and I'll tell you what kind of groom he's had.

            Look at this fellow. He's friendly and quiet. He turns when you ask him to, and he lifts his feet for cleaning or anything else you need. Then another horse comes in, restless and worried. He won't move where you want him. He jumps across the stall, throws up his head when you come near, pins back his ears, and acts afraid. Or maybe he wheels around and points his heels at you.

            Poor creatures. I know what kind of handling they've known. Treat a timid horse badly, and he'll start or shy. Treat a spirited horse that way, and he'll grow vicious or dangerous. Most horses form their tempers when they're young.

            Horses are like children. Teach them the right way while they're young, as the Good Book says, and when they're old, they won't leave it, so long as they're given the chance.
        - id: ch02-b03
          speaker: james
          text: >-
            I enjoy hearing you say that. We believe the very same thing at home, in our master's stable.
    - id: ch03
      title: A Horse's Life Is Worth More
      blocks:
        - id: ch03-b01
          speaker: old_hostler
          text: >-
            Who is your master, young man, if you don't mind my asking? From what I see here, I'd say he's a good one.
        - id: ch03-b02
          speaker: james
          text: >-
            Squire Gordon of Birtwick Park, on the other side of the Beacon Hills.
        - id: ch03-b03
          speaker: old_hostler
          text: >-
            Ah, yes. I've heard of him. He knows horses, doesn't he? Best rider in the county, they say.
        - id: ch03-b04
          speaker: james
          text: >-
            I believe he is. But he hardly rides now, not since the young master was killed.
        - id: ch03-b05
          speaker: old_hostler
          text: >-
            Ah, the poor gentleman. I read the whole account in the newspaper when it happened. A fine horse was killed too, wasn't he?
        - id: ch03-b06
          speaker: james
          text: >-
            Yes. He was a magnificent horse, this one's brother, and the two looked just alike.
        - id: ch03-b07
          speaker: old_hostler
          text: >-
            What a pity. If I remember correctly, that was a bad place for a jump. There was a thin fence at the top, then a steep bank down to the stream. The horse had no chance to see where he was going.

            Now, I favor bold riding as much as anyone. Even so, there are jumps that only a very experienced old huntsman has any right to attempt. A man's life and a horse's life are worth more than a fox's tail. At least, they ought to be.
        - id: ch03-b08
          speaker: narrator
          text: >-
            While they talked, the second hostler finished caring for Ginger and brought our corn. Then James and the old man walked out of the stable together.
