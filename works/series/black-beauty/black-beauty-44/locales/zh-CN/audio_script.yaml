audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    jerry:
      display_name: 杰里·巴克
      tts:
        delivery: 爽朗亲切，说起原则时坚定而不说教
        timbre: 结实温暖
        pace: 明快平稳
        pitch: 中低
    grant:
      display_name: 格兰特
      tts:
        delivery: 坦率随和，承认弱点时带着惭愧和自嘲
        timbre: 粗厚朴实
        pace: 适中
        pitch: 中低
    under_groom:
      display_name: 副马夫
      tts:
        delivery: 熟悉马匹，解释事故时认真而直截了当
        timbre: 清楚结实
        pace: 适中
        pitch: 中
    hotspur:
      display_name: 烈火
      tts:
        delivery: 年轻自负，抱怨中仍有爽快和明理
        timbre: 明亮有力
        pace: 稍快
        pitch: 中
  chapters:
    - id: ch01
      title: 上尉遭了难
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我和上尉是很要好的朋友。他年纪虽大，性情却高贵可亲，陪伴他总叫人愉快。我从没料到，他也会有离开这个家、走上下坡路的一天。可那一天还是来了。我没有亲眼看见事故，却把事情的前后都听说了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            上尉和杰里送一群客人到伦敦桥那边的大火车站。回程走到桥与纪念碑之间时，一辆酿酒厂的空货车过来了，前面套着两匹强壮的马。车夫拿沉重的鞭子不停抽打。车上没有货，两匹马越跑越疯，车夫已经完全管不住它们，而街上到处都是车和人。
        - id: ch01-b03
          speaker: narrator
          text: >-
            它们先撞倒一个年轻姑娘，车轮从她身上轧过去，转眼又猛撞上我们的马车。两个车轮全飞了，车厢也翻倒了。上尉被拖在地上，车辕撞断，一根碎木直插进他的身体。杰里也摔了出去，幸好只有些擦伤。没有人知道他怎么逃过来的，他一直说，那是个奇迹。
        - id: ch01-b04
          speaker: narrator
          text: >-
            人们把上尉扶起来，才看清他浑身都是割伤和撞伤。杰里放慢脚步，轻轻牵他回家。血已经浸进他白色的皮毛，还从肋侧和肩膀往下滴，那模样实在令人心碎。后来，人们查明货车夫醉得厉害，便罚了他。酿酒厂老板也赔了我们主人一笔钱。可是，上尉受的苦，谁又能赔给他呢？
        - id: ch01-b05
          speaker: narrator
          text: >-
            蹄铁匠和杰里想尽办法替他减轻疼痛，让他尽量舒服些。撞坏的出租马车也要修。我几天都没出门，杰里自然没有收入。事故之后，我们头一回回到车站候客，格兰特便来问上尉怎么样了。
        - id: ch01-b06
          speaker: jerry
          emotion: angry
          text: >-
            他好不了了，至少再也不能跟着我拉出租马车。蹄铁匠今早说，他或许还能拉货。拉货？伦敦那些拉货的马最后是什么样，我看得太多了！这件事把我害得不轻。我真恨不得把所有醉鬼都关进疯人院，省得他们出来祸害清醒的人。
        - id: ch01-b07
          speaker: jerry
          emotion: angry
          text: >-
            他们要是只摔断自己的骨头，撞坏自己的车，弄瘸自己的马，那还算他们自己的事。可每回受苦的偏偏都是无辜的人。出了事，他们又说可以赔偿。怎么赔？惹来的麻烦，受过的气，耽误的工夫，还有一匹像老朋友一样的好马，全都赔不回来。要问我最想把哪个魔鬼扔进无底深渊，那就是酒魔！
    - id: ch02
      title: 杰里怎样挣脱酒魔
      blocks:
        - id: ch02-b01
          speaker: grant
          text: >-
            杰里，你这些话句句都戳着我的痛处。我可没有你那么好，说来真叫人惭愧。我也希望自己能像你一样。
        - id: ch02-b02
          speaker: jerry
          text: 那就把酒戒了吧，格兰特。你这样好的人，怎么能一直给那东西当奴隶？
        - id: ch02-b03
          speaker: grant
          text: 我真是个大傻瓜。我以前戒过一次，只熬了两天，就觉得自己快没命了。杰里，你是怎么挺过来的？
        - id: ch02-b04
          speaker: jerry
          text: >-
            我也苦苦熬了几个星期。我从没真的喝醉过，可酒瘾一来，我连一句“不喝”都很难说出口。那时候我才明白，我已经做不了自己的主。酒魔和杰里·巴克，总有一个得认输。我求上帝帮我，也告诉自己，认输的绝不能是杰里·巴克。
        - id: ch02-b05
          speaker: jerry
          text: >-
            那场仗可不好打，我能找到的帮助一样也少不了。没开始戒酒时，我根本不知道这个习惯有多厉害。波莉费了好多心，让我每顿都吃得好。酒瘾上来，我就喝杯咖啡，吃点薄荷糖，或者翻开书读一阵，这样就能好受一些。
        - id: ch02-b06
          speaker: jerry
          text: >-
            有时我只能一遍又一遍提醒自己，要么戒酒，要么丢掉灵魂。要么戒酒，要么伤透波莉的心。多亏上帝，也多亏我的好妻子，我总算挣断了那副锁链。十年了，我再没碰过一滴酒，也一点儿不想碰。
        - id: ch02-b07
          speaker: grant
          text: 我真想再试一次。一个人连自己都管不住，实在太可怜了。
        - id: ch02-b08
          speaker: jerry
          text: >-
            那就试，格兰特，你不会后悔的。车站上那些可怜的伙计要是看见你不用喝酒也能过，对他们也是个帮衬。我知道有两三个早就想躲开那家酒馆，只是自己做不到。
    - id: ch03
      title: 告别老朋友
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            开头几天，上尉像是慢慢好了些。可他毕竟是一匹老马。这些年，全靠他天生体格强健，又有杰里用心照料，他才能一直拉车。受伤以后，他的身体很快垮了。
        - id: ch03-b02
          speaker: narrator
          text: >-
            蹄铁匠说，养上一阵，也许还能卖几英镑。杰里坚决不同意。他说，要是把一匹忠心多年的老马卖去干苦活、受折磨，那么卖来的几英镑会把他其余的钱也全弄脏。他又找不到一位好心的主人，让上尉安度余生。思来想去，最仁慈的办法只有一个，就是稳稳给他一枪，让这匹出色的老马永远摆脱痛苦。
        - id: ch03-b03
          speaker: narrator
          text: >-
            作出决定的第二天，哈里牵我去铁匠铺换蹄铁。等我回到家，上尉已经走了。我们全家都舍不得他，我心里也难过极了。
        - id: ch03-b04
          speaker: narrator
          text: >-
            杰里只好再找一匹马。他有个熟人在贵族家的马房里做副马夫，很快便送来一个消息。那里有匹年轻的好马，原本十分值钱，却曾受惊狂奔，撞上一辆马车，还把爵爷掀了出去。他自己也割伤了，身上留了疤，再也进不了体面人家的马房。车夫便吩咐手下尽量把他卖个好价钱。
        - id: ch03-b05
          speaker: jerry
          text: 马儿精神足些，我能应付。只要他没有坏性子，嘴也不硬就行。
        - id: ch03-b06
          speaker: under_groom
          text: >-
            他没有一点坏性子，嘴还特别嫩。依我看，事故就是这么来的。他刚剪过毛，天气又糟，平常没能好好活动。好容易出门一次，浑身的劲儿都涨起来了，活像一只气球。
        - id: ch03-b07
          speaker: under_groom
          text: >-
            我们那位管事的车夫怕制不住他，就把挽具收得死紧，又给他套上马丁革和勒缰，用最厉害的大勒衔，连缰绳也扣在最下面一格。那匹马嘴那么嫩，精神又足，我看这些东西硬是把他逼疯了。
        - id: ch03-b08
          speaker: jerry
          text: 听起来很有可能。我去看看他。
    - id: ch04
      title: 烈火来了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            第二天，那匹叫烈火的马便来到家里。他浑身棕色，没有一根白毛，个头跟上尉一样高，头生得很俊，而且只有五岁。我用马儿的方式友好地欢迎他，却没有追问他的往事。
        - id: ch04-b02
          speaker: narrator
          text: >-
            头一夜，他怎么也安静不下来。他不肯躺下，只把笼头绳在铁环里扯上扯下，绳头的木块不停撞着食槽，害得我一夜睡不好。第二天，他拉了五六个钟头的车，回来时却已经平静多了，也懂事多了。
        - id: ch04-b03
          speaker: narrator
          text: >-
            杰里常常拍拍烈火，跟他说话，不久他们就懂得该怎样彼此相处。杰里说，给他一副不伤嘴的嚼子，再让他有足够的活干，他就会温顺得像羊羔。看来，再坏的风也会给某个人吹来好处。爵爷丢了一匹价值一百基尼的爱马，赶出租马车的杰里却得到一匹年轻力壮的好马。
        - id: ch04-b04
          speaker: narrator
          text: >-
            烈火起初觉得，自己沦落到拉出租马车，身份实在降得太低。站在车站排队等客，更叫他满心厌烦。一个星期过去，他终于对我说了实话。
        - id: ch04-b05
          speaker: hotspur
          text: >-
            这里也不是全无好处。嘴里不用再受罪，脑袋又能自由活动，许多不痛快也就算了。再说，拉出租马车再怎么丢脸，也比上鞍以后把头和尾巴绑在一起强。
        - id: ch04-b06
          speaker: narrator
          text: 烈火就这样安顿下来。杰里也很喜欢他。
