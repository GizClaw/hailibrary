  chapters:
    - id: ch01
      title: The Accident
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Captain and I were close friends. He was a noble old horse and wonderful company. I never imagined he would have to leave his home and go downhill. But his turn came. I wasn't there when it happened, though I heard the whole story afterward.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Captain and Jerry had taken a party to the great railway station at London Bridge. On their way back, somewhere between the bridge and the Monument, Jerry saw an empty brewer's dray coming toward them. Two powerful horses were pulling it. The dray was light, and their driver kept striking them with his heavy whip. They tore down the crowded street at a furious pace, completely beyond his control.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The runaway team knocked down a young girl and rolled over her. A moment later, the dray crashed into our cab. Both wheels were ripped away, and the cab toppled over. Captain went down, the shafts broke apart, and one jagged piece drove into his side. Jerry was thrown too, but somehow escaped with bruises. He always called it a miracle.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Poor Captain was badly cut and battered. Jerry led him slowly home. Blood soaked through his white coat and fell from his side and shoulder. It was a dreadful sight. The drayman turned out to be very drunk. He was fined, and the brewer had to pay our master for the damage. But no one could pay poor Captain for what he had suffered.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Jerry and the farrier did everything they could to ease his pain and keep him comfortable. The cab had to be repaired, so for several days I stayed home and Jerry earned nothing.
    - id: ch02
      title: The Drink Devil
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The first time we returned to the cabstand, Grant came over to ask about Captain.
        - id: ch02-b02
          speaker: jerry
          emotion: angry
          text: >-
            He'll never recover enough for my work. The farrier told me so this morning. He says Captain might still manage hauling carts, but I've seen what that work does to horses around London. And all because of a drunk man! I wish every drunkard could be shut away instead of being left free to crash into sober people. If they broke only their own bones, wrecked only their own carts, and crippled only their own horses, that would be their affair. But innocent people always suffer. Then everyone talks about compensation. Money can't repay the trouble, the worry, the lost time, or the loss of a good horse who is like an old friend. Of all the devils in the world, the drink devil is the one I'd most like to see thrown into the bottomless pit.
        - id: ch02-b03
          speaker: grant
          text: >-
            Jerry, that hits pretty close to home for me. I'm not as good a man as you are, and I'm ashamed of it. I wish I were better.
        - id: ch02-b04
          speaker: jerry
          text: >-
            Then why not quit, Grant? You're too good a man to let a thing like drink make a slave of you.
        - id: ch02-b05
          speaker: grant
          text: >-
            I've been a great fool. Once I tried stopping for two days, and I thought it would kill me. How did you manage it?
        - id: ch02-b06
          speaker: jerry
          text: >-
            It was hard for several weeks. I never got drunk, but when the craving came, I found out I wasn't my own master. Saying no took everything I had. Either the drink devil had to give in, or Jerry Barker did, and with God's help, I decided it wouldn't be Jerry Barker.
        - id: ch02-b07
          speaker: jerry
          text: >-
            I needed every bit of help I could get. Until I tried to stop, I had no idea how strong the habit was. Polly made sure I had good food. When the craving came, I'd drink coffee or peppermint, or read from my book. Sometimes I kept telling myself, “Give up the drink, or lose your soul. Give up the drink, or break Polly's heart.” Thank God, and my dear wife, those chains were broken. I haven't touched a drop in ten years, and I don't want one now.
        - id: ch02-b08
          speaker: grant
          text: >-
            I think I may try again. It's a poor thing when a man can't be his own master.
        - id: ch02-b09
          speaker: jerry
          text: >-
            Do it, Grant. You won't regret it. And think what it could mean to the other fellows at our stand. I know two or three who would gladly stay out of that tavern if they could. Seeing you give it up might help them do the same.
    - id: ch03
      title: Good-bye to Captain
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At first Captain seemed to be healing. But he was very old. Only his strong constitution and Jerry's careful treatment had kept him at cab work for so long. After the accident, his health quickly failed.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The farrier thought Captain might recover enough to sell for a few pounds. Jerry refused. He said that if he earned money by sending a faithful old servant into hard work and misery, those few pounds would spoil all the rest of his money. He couldn't find a kind master who would care for Captain through his last years. So Jerry believed the merciful choice was a sure bullet through the old horse's head. Then Captain would never suffer again.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The next day, after the decision was made, Harry took me to the forge for new shoes. When I came home, Captain was gone.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The whole family and I felt his loss deeply.
    - id: ch04
      title: A Horse Called Hotspur
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Jerry now had to find another horse. Before long, an acquaintance who worked as an under-groom in a nobleman's stable told him about a valuable young horse. The horse had run away, struck another carriage, and thrown his lordship out. He had also cut and marked himself so badly that he was no longer suitable for a gentleman's stable. The coachman had been ordered to sell him for the best price he could get.
        - id: ch04-b02
          speaker: jerry
          text: >-
            High spirits don't trouble me, as long as the horse isn't vicious and doesn't have a hard mouth.
        - id: ch04-b03
          speaker: stable_hand
          text: >-
            He isn't vicious at all. In fact, his mouth is very sensitive, and I think that caused the accident. He'd just been clipped. The weather was bad, so he hadn't had enough exercise. When they finally took him out, he was bursting with energy.
        - id: ch04-b04
          speaker: stable_hand
          text: >-
            Our coachman strapped him in as tightly as possible. He used the martingale, the checkrein, a very sharp curb, and fastened the reins to the bottom bar. A sensitive mouth, all that high spirit, and harness like that? I believe it drove the horse nearly mad.
        - id: ch04-b05
          speaker: jerry
          text: >-
            That sounds very likely. I'll come take a look at him.
    - id: ch05
      title: Hotspur Settles In
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Hotspur came home the next day. He was a handsome brown horse without a single white hair, as tall as Captain, with a fine head. He was only five years old. I greeted him warmly, as one horse to another, but I didn't ask any questions.
        - id: ch05-b02
          speaker: narrator
          text: >-
            That first night, he was terribly restless. He never lay down. Instead, he kept jerking his halter rope through the ring and banging the wooden block against the manger. I couldn't sleep. But the next day, after five or six hours pulling the cab, he came home quiet and sensible.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Jerry spent plenty of time patting Hotspur and talking to him. The two soon understood each other. Jerry said that with a gentle bit and enough work, Hotspur would become as mild as a lamb. One man's bad luck had helped another. His lordship had lost a favorite worth a hundred guineas, but a cabman had gained a good young horse with all his strength still in him.
        - id: ch05-b04
          speaker: narrator
          text: >-
            At first, Hotspur thought becoming a cab horse was a terrible step down. Standing at the cabstand disgusted him. But by the end of the week, he admitted something to me.
        - id: ch05-b05
          speaker: hotspur
          text: >-
            Having a gentle bit and freedom around my head makes up for a lot. And really, this work isn't nearly as humiliating as being ridden with my head and tail practically tied together.
        - id: ch05-b06
          speaker: narrator
          text: >-
            The truth was, Hotspur settled in very well, and Jerry grew quite fond of him.
