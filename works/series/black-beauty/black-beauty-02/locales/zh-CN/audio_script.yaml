audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，回忆惨痛往事时克制而清醒
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    mother:
      display_name: 公爵夫人
      tts:
        delivery: 慈爱稳重，谈论伤亡时沉静而严肃
        timbre: 温暖醇厚
        pace: 从容
        pitch: 中低
    oldest_colt:
      display_name: 年长的小公马
      tts:
        delivery: 好奇兴奋，说话爽快
        timbre: 年轻明亮
        pace: 轻快
        pitch: 中高
    old_horse:
      display_name: 老骑乘马
      tts:
        delivery: 见多识广，对狩猎熟悉而关注
        timbre: 粗粝低沉
        pace: 稳健
        pitch: 低
    young_colt:
      display_name: 小公马
      tts:
        delivery: 年轻直率，情绪来得快
        timbre: 清脆有力
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 猎犬来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我还没满两岁，就遇见了一件一辈子也忘不了的事。那是一个早春的清晨。夜里结过一点霜，薄雾还罩着树林和草地。我和别的小公马正在牧场下头吃草，远远听见一阵声音，像是许多狗在叫。
        - id: ch01-b02
          speaker: narrator
          text: 年纪最大的小公马立刻抬起头，把耳朵竖得直直的。
        - id: ch01-b03
          speaker: oldest_colt
          text: 是猎犬！猎犬来了！
        - id: ch01-b04
          speaker: narrator
          text: 他马上朝牧场上头跑去，我们也全跟了过去。那里能越过树篱，看清远处一片又一片田野。母亲和主人那匹上了年纪的骑乘马也在旁边。看样子，他们知道是怎么回事。
        - id: ch01-b05
          speaker: mother
          text: 猎犬找着野兔了。要是它们追到这边，我们就能看见狩猎了。
        - id: ch01-b06
          speaker: narrator
          text: 很快，猎犬就飞奔着穿过隔壁的青麦田。我从没听过那么大的动静。它们不汪汪叫，也不嗥叫，更不呜咽，只是一齐扯开嗓门喊着“哟！哟——噢、噢！哟！哟——噢、噢！”
        - id: ch01-b07
          speaker: narrator
          text: 后面有一大群骑马的男人，有几个穿着绿外套。人人都催马狂奔。老马打着响鼻，目不转睛地追着他们看。我们这些小马也真想加入他们，可那支队伍一下就跑远了，到了下边的田野。
        - id: ch01-b08
          speaker: narrator
          text: 那边的追逐像是忽然停住了。猎犬不再叫，只顾低着头，把鼻子贴近地面，到处寻找。
        - id: ch01-b09
          speaker: old_horse
          text: 气味断了。那只野兔说不定能逃走。
        - id: ch01-b10
          speaker: narrator
          text: 你们说的是哪一只野兔？
        - id: ch01-b11
          speaker: old_horse
          text: 我哪知道是哪一只。也许就是从我们林子里跑出去的。猎犬和那些人不在乎，找到哪只就追哪只。
    - id: ch02
      title: 一只小小的野兔
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 没过多久，“哟！哟——噢、噢”的叫声又响了起来。猎犬结成一群，全速往回冲，直奔我们的牧场。它们冲去的地方，正是高岸和树篱悬在小溪上方的那一段。
        - id: ch02-b02
          speaker: mother
          text: 看吧，这回野兔就要出现了。
        - id: ch02-b03
          speaker: narrator
          text: 话音刚落，一只惊慌到发狂的野兔从我们眼前蹿过，直逃向树林。猎犬冲过高岸，跳过小溪，从牧场上疾驰而过。猎人也追来了。六七个人纵马跃过溪水，落得干净利落，紧跟在猎犬后面。
        - id: ch02-b04
          speaker: narrator
          text: 野兔想钻过篱笆，可枝条长得太密，根本钻不进去。她猛地掉头，打算逃上大路。可是已经晚了。猎犬狂叫着扑住了她。我们听见一声尖叫，随后，她就死了。
        - id: ch02-b05
          speaker: narrator
          text: 一名猎人骑马上前，用鞭子把猎犬赶开。再迟一点，它们就会把野兔撕碎。他抓住野兔的一条腿，把那血肉模糊、还在流血的身子提起来。那些先生看着这一切，个个都很满意。
    - id: ch03
      title: 小溪边的惨祸
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我被刚才的一幕惊呆了，起初竟没发现小溪边也出了事。等我转头望去，才看见更悲惨的景象。两匹健壮的马倒下了。一匹在水里挣扎，另一匹躺在草地上呻吟。一个骑手满身泥水，正往岸上爬。另一个躺在那里，完全不动。
        - id: ch03-b02
          speaker: mother
          text: 那个人的脖子断了。
        - id: ch03-b03
          speaker: young_colt
          text: 他这是自作自受。
        - id: ch03-b04
          speaker: narrator
          text: 当时我也觉得他说得对，可母亲没有附和我们。
        - id: ch03-b05
          speaker: mother
          text: 不，不能这么说。我活了这些年，见过、听过的事情不少，却一直弄不懂，人为什么偏爱这样的消遣。他们常常伤到自己，也常常毁掉好马，还会踏坏田地。费了这么大力气，只为一只野兔、一只狐狸，或者一头鹿。那些动物，他们用别的办法明明更容易捉到。可是，我们只是马，大概不会明白吧。
        - id: ch03-b06
          speaker: narrator
          text: 母亲说话时，我们还在看着。许多骑手已经围到那个年轻人身边。主人本来就在远处看，他第一个赶过去，把人扶了起来。年轻人的头向后垂着，两条手臂也软软地垂下来。大家的脸色都变得十分沉重。
        - id: ch03-b07
          speaker: narrator
          text: 四周安静了，再也没有刚才的喧闹。连猎犬都静了下来，仿佛也知道出了大事。人们把年轻人抬进主人家。后来我才听说，他是乡绅唯一的儿子，名叫乔治·戈登。他英俊高大，是全家人的骄傲。
        - id: ch03-b08
          speaker: narrator
          text: 骑手们随即朝四面八方奔去。有人请医生，有人找蹄铁匠，想必也有人去向戈登乡绅报信。蹄铁匠邦德先生赶来，仔细摸过草地上那匹呻吟的黑马，然后摇了摇头。马的一条腿断了。
        - id: ch03-b09
          speaker: narrator
          text: 有人跑进主人家，回来时手里多了一杆枪。过了一会儿，“砰”的一声巨响传来，黑马发出一声凄厉的嘶鸣。接着，什么声音也没有了。他再也没有动过。
    - id: ch04
      title: 丧钟
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 母亲看起来十分难过。她告诉我，自己认识那匹马已经许多年。他叫罗布·罗伊，性情很好，从来没有恶习。从那以后，母亲再也不肯走近牧场的那个地方。
        - id: ch04-b02
          speaker: narrator
          text: 几天后，教堂的钟敲了很久。我们越过栅栏门望出去，看见一辆又长又古怪的黑色马车。车身蒙着黑布，拉车的也是黑马。它后面还有一辆、又一辆，再一辆，全都是黑色的。钟声始终没有停。
        - id: ch04-b03
          speaker: narrator
          text: 那支送葬队伍要把年轻的戈登送进教堂墓园。他再也不能骑马了。人们后来怎样处置罗布·罗伊，我一直不知道。可这一切，全都是为了一只小小的野兔。
