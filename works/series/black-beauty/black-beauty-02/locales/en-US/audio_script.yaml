  chapters:
    - id: ch01
      title: 02 The Hunt
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Something happened before I was two years old that I have never forgotten. It was early spring. A little frost had fallen during the night, and a thin mist still lay over the woods and meadows. The other colts and I were grazing at the lower end of the field when we heard dogs crying far away.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The oldest colt lifted his head and pricked his ears.
        - id: ch01-b03
          speaker: oldest_colt
          text: >-
            Those are the hounds!
        - id: ch01-b04
          speaker: narrator
          text: >-
            He cantered toward the top of the field, and all of us followed. From there, we could see over the hedge and across several more fields. My mother stood nearby with one of our master's old riding horses. They both seemed to understand exactly what was happening.
        - id: ch01-b05
          speaker: duchess
          text: >-
            They've found a hare. If they come toward us, we'll see the hunt.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Soon the dogs came racing through the field of young wheat beside ours. I had never heard a sound like theirs. They weren't barking, howling, or whining. They kept crying, “Yo! Yo-o-o! Yo! Yo-o-o!” as loudly as they could. A crowd of men on horseback followed them. Some wore green coats, and every one of them was galloping at full speed.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The old horse snorted and watched eagerly. We young colts wished we could gallop after them. But they quickly swept into the lower fields. Then they seemed to stop. The dogs fell silent and scattered in every direction, noses pressed to the ground.
        - id: ch01-b08
          speaker: old_riding_horse
          text: >-
            They've lost the scent. Maybe the hare will escape.
        - id: ch01-b09
          speaker: narrator
          text: >-
            I didn't understand.
        - id: ch01-b10
          speaker: narrator
          text: >-
            What hare?
        - id: ch01-b11
          speaker: old_riding_horse
          text: >-
            Who knows which hare? It could easily be one from our own woods. Any hare they find will suit those dogs and men. They only want something to chase.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Before long, the dogs took up that wild cry again. This time they all came racing back together, straight toward our meadow where the high bank and hedge hung over the brook.
        - id: ch01-b13
          speaker: duchess
          text: >-
            Now we'll see the hare.
        - id: ch01-b14
          speaker: narrator
          text: >-
            At that moment, a hare rushed past us, frantic with fear, and headed for the woods. The dogs came right behind her. They burst over the bank, jumped the stream, and tore across the field. The hunters followed. Six or eight men sent their horses sailing clean over the brook, close behind the dogs.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The hare tried to force her way through the fence, but it was too thick. She spun around and raced toward the road. She was too late. The dogs caught her, still giving those wild cries. We heard one shriek, and then her life was over.
        - id: ch01-b16
          speaker: narrator
          text: >-
            One hunter rode up and drove the dogs away before they could tear her apart. He lifted her by one leg. She was torn and bleeding, and all the gentlemen looked pleased.
        - id: ch01-b17
          speaker: narrator
          text: >-
            I was so shocked that, at first, I missed what had happened beside the brook. When I finally looked, I saw something terrible. Two fine horses were down. One thrashed in the stream. The other lay on the grass, groaning. One rider was climbing out of the water, covered in mud. The other lay perfectly still.
        - id: ch01-b18
          speaker: duchess
          text: >-
            His neck is broken.
        - id: ch01-b19
          speaker: colt
          text: >-
            That's what he deserves.
        - id: ch01-b20
          speaker: narrator
          text: >-
            I felt the same way, but my mother did not agree with us.
        - id: ch01-b21
          speaker: duchess
          text: >-
            No. You mustn't say that. I'm an old horse, and I've seen and heard a great deal. But I still can't understand why men enjoy this sport so much. They often injure themselves. They ruin good horses and tear up the fields, all for a hare, a fox, or a stag they could catch much more easily another way. Still, we're only horses. We don't know.
        - id: ch01-b22
          speaker: narrator
          text: >-
            We stood watching while my mother spoke. Many of the riders went over to the young man. Our master had also been watching, and he was the first to lift him. The young man's head fell back, and his arms hung loose. Everyone became very serious. The whole place was quiet now. Even the dogs seemed to know that something was wrong.
        - id: ch01-b23
          speaker: narrator
          text: >-
            They carried him to our master's house. Later I learned that he was young George Gordon, the squire's only son. He was a fine, tall young man and the pride of his family.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Riders hurried away in every direction. Some went for the doctor, some for the farrier, and no doubt someone went to tell Squire Gordon about his son.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Mr. Bond, the farrier, came to examine the black horse that was groaning on the grass. He felt the horse all over, then shook his head. One of the horse's legs was broken. Someone ran to our master's house and returned with a gun. A loud bang rang out, followed by a dreadful shriek. Then everything was still. The black horse never moved again.
        - id: ch01-b26
          speaker: narrator
          text: >-
            My mother was deeply troubled. She had known that horse for years. His name was Rob Roy, and he was a good horse without a trace of badness in him. After that day, she would never go near that part of the field again.
        - id: ch01-b27
          speaker: narrator
          text: >-
            A few days later, the church bell began tolling and went on for a long time. From the gate, we watched a strange black coach pass by. Black cloth covered it, and black horses pulled it. Another black coach followed, then another, and another, while the bell kept tolling. They were taking young Gordon to the churchyard to bury him. He would never ride again.
        - id: ch01-b28
          speaker: narrator
          text: >-
            I never learned what they did with Rob Roy. And all of it happened because of one little hare.
