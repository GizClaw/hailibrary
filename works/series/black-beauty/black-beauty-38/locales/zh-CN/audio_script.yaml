audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    jerry:
      display_name: 杰里·巴克
      tts:
        delivery: 爽朗亲切，说起原则时坚定而不说教
        timbre: 结实温暖
        pace: 明快平稳
        pitch: 中低
    wright:
      display_name: 赖特先生
      tts:
        delivery: 平日谦和有礼，面对恶行时果断刚毅
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    carter:
      display_name: 货车夫
      tts:
        delivery: 粗鲁暴躁，酒后言语凶横
        timbre: 低沉粗哑
        pace: 急促
        pitch: 低
    companion:
      display_name: 赖特先生的同伴
      tts:
        delivery: 随和世故，打趣时轻松自然
        timbre: 温和明朗
        pace: 自然
        pitch: 中
  chapters:
    - id: ch01
      title: 湿冷的冬日
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那年冬天来得很早，接连几个星期又湿又冷。差不多天天不是下雪、落冰雨，就是下雨。好不容易变个天，等来的却是刺骨的风和冻人的霜。所有的马都吃不消。
        - id: ch01-b02
          speaker: narrator
          text: 干冷的时候，两条厚马毯就能护住身上的暖气。可雨水一旦把毯子浸透，它就再厚也不管用了。有些车夫买得起防水罩，可以罩在外面。另一些人太穷，自己和马都没有东西遮护。那个冬天，他们受了不少罪。
        - id: ch01-b03
          speaker: narrator
          text: 我们干完半天活，还能回到干燥的马厩歇一歇。车夫们却得一直守在座位上。若要等宴会散场的客人，有时熬到凌晨一两点也回不了家。
        - id: ch01-b04
          speaker: narrator
          text: 最叫马难受的，是霜雪把街道冻得溜滑。脚下踩不稳，还拖着重车，这样走一英里，比在好路上走四英里更费力。为了不失去平衡，我们每一根神经、每一块肌肉都得绷紧。更磨人的，是一步一步都怕摔倒。路面实在太坏，人们会给蹄铁做上防滑齿，可刚换上时，我们心里还是紧张。
    - id: ch02
      title: 多莉送来的热食
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 天气太坏，许多车夫会躲进附近的酒馆，托人替他们盯着客人。可这样常常错过生意，而且杰里说，人进了酒馆，总免不了花钱。他从不去“旭日”酒馆。附近有家咖啡馆，他偶尔进去坐坐。也有个老人常把热咖啡和馅饼送到候车处，杰里会向他买些吃喝。
        - id: ch02-b02
          speaker: narrator
          text: 杰里觉得，烈酒和啤酒下肚以后，反倒会叫人更冷。真正能让车夫暖起来的，是干衣服、好饭菜、快活的心情，还有家里那位体贴的妻子。杰里回不了家，波莉总会替他备好吃的。
        - id: ch02-b03
          speaker: narrator
          text: 有时候，小多莉会从街角探出头，看看爸爸在不在候车处。只要看见他，她就飞奔回家，很快又提着铁皮罐或篮子回来，送上波莉做好的热汤或布丁。街上常挤满马匹车辆，她这么小，却总能平安穿过，实在不容易。
        - id: ch02-b04
          speaker: narrator
          text: 多莉胆子大，也把给爸爸送“第一道菜”看成一件很光荣的事。候车处的车夫个个喜欢她。哪怕杰里当时腾不出手，那里也没有一个人会不管她，总会有人护着她平安穿过拥挤的街道。
        - id: ch02-b05
          speaker: narrator
          text: 一个寒风呼啸的日子，多莉送来一碗热食，站在杰里身旁。杰里才刚吃，一位先生就快步向我们走来，举起雨伞示意。杰里碰了碰帽檐，把碗交给多莉，伸手要揭我的马毯。那位先生已经赶到车前。
        - id: ch02-b06
          speaker: wright
          text: 别急，朋友，你先把汤喝完。我确实赶时间，不过等你吃好，再把小姑娘平安送上人行道，这点时间还是有的。
        - id: ch02-b07
          speaker: narrator
          text: 说完，他便坐进车里。杰里诚心谢过他，又回到多莉身边。
        - id: ch02-b08
          speaker: jerry
          text: 多莉，你看见了吗？这才是真正的绅士。他自己赶时间，心里还惦记着一个穷车夫舒不舒服，也惦记着一个小姑娘安不安全。
        - id: ch02-b09
          speaker: narrator
          text: 杰里吃完，把多莉送过马路，这才问清那位先生的吩咐，驾车前往克拉珀姆坡。后来，那位先生又坐过我们几次车。我想他很喜欢狗，也喜欢马。每次送他到家，总有两三条狗蹦跳着出来迎接。
        - id: ch02-b10
          speaker: narrator
          text: 有时他还会特意绕到我身边，轻轻拍一拍我，再用安静亲切的声音说话。肯这样留意一匹刚替自己干完活的马，实在少见。
        - id: ch02-b11
          speaker: wright
          text: 这匹马有个好主人。它配得上这样的主人。
        - id: ch02-b12
          speaker: narrator
          text: 乘客很少会留意那匹刚替自己卖过力的马。偶尔有几位女士会这样做，这位先生和另外一两个人也会拍拍我，说句好话。可一百个人里，有九十九个根本想不到这回事，就像他们不会去拍拍拉火车的蒸汽机。
        - id: ch02-b13
          speaker: narrator
          text: 那位先生已不年轻，肩膀微微向前弯着，像是总在迎着什么事情赶去。他嘴唇很薄，常抿得紧紧的，笑起来却十分和气。他目光敏锐，下颌的线条和点头的动作都透着坚决。只要拿定主意，他就一定会做到底。他的声音亲切悦耳，任何一匹马都会信任，同时又能听出那里面的果断。
    - id: ch03
      title: 酒窖门前
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 有一天，那位先生和一位朋友坐上我们的车。他们在R——街的一家商店前停下。朋友进了店，他留在门口。街对面不远处，一辆货车停在几间酒窖前，车上套着两匹十分漂亮的马，车夫却不见人影。
        - id: ch03-b02
          speaker: narrator
          text: 我不知道那两匹马已经等了多久。它们大概觉得等得够久了，便自己往前走。才走几步，车夫就从里面冲出来拦住它们。他气得发狂，又抽鞭子，又狠扯缰绳，甚至拿鞭子往马头上打。
        - id: ch03-b03
          speaker: narrator
          text: 那位先生全看见了。他马上穿过街道，开口时语气不容争辩。
        - id: ch03-b04
          speaker: wright
          emotion: angry
          text: 立刻住手！否则我就叫人逮捕你。你把马丢在这里不管，又这样残酷地虐待它们，这两件事我都会追究。
        - id: ch03-b05
          speaker: narrator
          text: 那车夫显然喝过酒，张嘴便骂个不停，不过总算不再打马。他抓起缰绳，爬上货车。那位先生从容地掏出记事簿，看清车身上漆着的姓名和地址，把它们记了下来。
        - id: ch03-b06
          speaker: carter
          emotion: angry
          text: 你记下那些东西想干什么？
        - id: ch03-b07
          speaker: narrator
          text: 车夫咆哮着甩响鞭子，准备离开。那位先生只向他点了一下头，冷峻地笑了笑，一句话也没说。
    - id: ch04
      title: 真正的绅士
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 那位先生回到我们车旁，他的朋友也正好从店里出来。朋友笑着打趣他。
        - id: ch04-b02
          speaker: companion
          text: 赖特，我还以为你自己的事已经够忙了。怎么连别人的马和仆人，你也要费心去管？
        - id: ch04-b03
          speaker: narrator
          text: 赖特先生停下脚步，头微微向后一仰。
        - id: ch04-b04
          speaker: wright
          text: 你知道这个世界为什么会坏到这般地步吗？
        - id: ch04-b05
          speaker: companion
          text: 我不知道。
        - id: ch04-b06
          speaker: wright
          text: 那我告诉你。因为人人只管自己的事，不肯替受欺压的弱者出头，也不肯揭露做坏事的人。每次看见这种恶行，我都会尽力阻止。不少主人还谢过我，因为我让他们知道了自己的马曾受过怎样的虐待。
        - id: ch04-b07
          speaker: jerry
          text: 先生，我真希望世上多一些像您这样的绅士。这座城实在太需要这样的人了。
        - id: ch04-b08
          speaker: narrator
          text: 说完这些，我们继续赶路。两位先生下车时，赖特先生还在讲他的信条。
        - id: ch04-b09
          speaker: wright
          text: 我认为，只要我们看见残忍或不公的事，明明有能力阻止，却什么也不做，那我们也就分担了这份罪责。
