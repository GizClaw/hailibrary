  chapters:
    - id: ch01
      title: Dolly and a Real Gentleman
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Winter came early, bringing weeks of cold and wet. Almost every day there was snow, sleet, or rain. When that stopped, we faced biting winds or hard frost. All the horses suffered. In dry cold, two thick rugs could hold in our warmth. In soaking rain, the rugs soon got wet through and did no good.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Some drivers had waterproof covers to throw over themselves, which helped greatly. Others were too poor to protect themselves or their horses, and many suffered badly that winter. After half a day's work, we horses could return to dry stables and rest. The drivers had to remain on their boxes in the wet and cold. If they were waiting for a party, they might stay out until one or two in the morning.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Slippery streets were worst of all for us. Pulling a load for one mile over frost or snow took more strength than four miles on a good road. With no firm footing, every nerve and muscle strained to keep us balanced. The fear of falling wore us out most of all. On the very worst roads, our shoes were roughed to give us a grip, though that made us nervous at first.
        - id: ch01-b04
          speaker: narrator
          text: >-
            In terrible weather, many drivers went into the nearby tavern and asked someone outside to watch for them. Even then, they often missed a fare. And as Jerry said, a man could hardly sit in the tavern without spending money. Jerry never went into the Rising Sun. Sometimes he visited a coffee shop nearby. Other times, he bought hot coffee and pies from an old man who came to our cabstand with them in tins.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Jerry believed beer and spirits only left a man colder afterward. To keep a cabman warm, he trusted dry clothes, good food, a cheerful heart, and a comfortable wife at home. Polly always packed him something to eat when he couldn't come home.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Sometimes little Dolly peeked around the street corner to see whether her father was at the stand. If he was, she raced home and soon returned with hot soup or pudding that Polly had ready in a tin or basket. The street was often crowded with horses and carriages, yet that brave little girl always crossed safely. She considered it an honor to bring what Jerry called his “first course.” Everyone at the stand liked her, and any driver there would have helped her cross if Jerry could not.
        - id: ch01-b07
          speaker: narrator
          text: >-
            One cold, windy day, Dolly brought Jerry a bowl of something hot and stood beside him while he ate. He had barely started when a gentleman hurried toward us and raised his umbrella. Jerry touched his hat, handed the bowl to Dolly, and began taking off my cloth.
        - id: ch01-b08
          speaker: wright
          text: >-
            No, no, my friend. Finish your soup. I'm in a hurry, but I can wait until you're done and your little girl is safely back on the sidewalk.
        - id: ch01-b09
          speaker: narrator
          text: >-
            With that, the gentleman sat down in the cab. Jerry thanked him warmly and went back to Dolly.
        - id: ch01-b10
          speaker: jerry
          text: >-
            There, Dolly. That's what a real gentleman is. He has time to think about a poor cabman's comfort, and a little girl's too.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Jerry finished his soup, took Dolly safely across, and asked where the gentleman wished to go. The answer was Clapham Rise.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The same gentleman rode with us several more times. I thought he must be fond of dogs and horses. Whenever we took him home, two or three dogs bounded out to greet him. Sometimes he walked around to me and gave me a pat.
        - id: ch01-b13
          speaker: wright
          text: >-
            This horse has a good master, and he deserves one.
        - id: ch01-b14
          speaker: narrator
          text: >-
            He always said it in a quiet, pleasant way. Very few passengers ever noticed the horse who had worked for them. Now and then, a lady would offer a kind word or a pat. This gentleman did, and perhaps one or two others. But ninety-nine people out of a hundred were no more likely to pat us than they were to pat the steam engine pulling their train.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The gentleman wasn't young. There was a forward stoop in his shoulders, as though he were always moving toward some task. His lips were thin and firmly closed, though his smile was pleasant. His keen eyes, strong jaw, and the way he moved his head made you think that once he set his mind on something, he would see it through. His voice was kind and pleasant, but just as decided as the rest of him. Any horse would have trusted it.
        - id: ch01-b16
          speaker: narrator
          text: >-
            One day, he and another gentleman hired our cab. They stopped at a shop on R Street, and his companion went inside while he waited at the door. A little farther ahead, across the street, two very fine horses stood hitched to a cart outside some wine vaults. Their driver had left them there alone. I couldn't tell how long they had been waiting, but the horses seemed to feel it had been long enough. At last, they began moving away.
        - id: ch01-b17
          speaker: narrator
          text: >-
            They had gone only a short distance when the carter ran out and caught them. Furious that they had moved, he attacked them with whip and rein. He even struck them around the head. Our gentleman saw everything and crossed the street quickly.
        - id: ch01-b18
          speaker: wright
          text: >-
            Stop that at once, or I'll have you arrested for abandoning your horses and treating them brutally.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The carter had clearly been drinking. He shouted abuse, but he stopped beating the horses. Then he took the reins and climbed into his cart. Meanwhile, our friend calmly pulled out a notebook. He copied the name and address painted on the cart.
        - id: ch01-b20
          speaker: carter
          emotion: angry
          text: >-
            What are you writing that down for?
        - id: ch01-b21
          speaker: narrator
          text: >-
            As the carter cracked his whip and drove away, the only answer he received was a nod and a grim smile.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Our friend returned to the cab just as his companion came out of the shop. The other man laughed.
        - id: ch01-b23
          speaker: companion
          text: >-
            Wright, I would've thought you had enough work of your own without taking on other people's horses and servants.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Wright stood still for a moment and tipped his head slightly back.
        - id: ch01-b25
          speaker: wright
          text: >-
            Do you know why the world is in such a bad state?
        - id: ch01-b26
          speaker: companion
          text: >-
            No, I don't.
        - id: ch01-b27
          speaker: wright
          text: >-
            Then I'll tell you. People think only of their own affairs. They won't take the trouble to defend those being mistreated or expose the person doing wrong. When I see cruelty like that, I do whatever I can. Many an owner has thanked me for telling him how his horses were treated.
        - id: ch01-b28
          speaker: jerry
          text: >-
            I wish there were more gentlemen like you, sir. This city surely needs them.
        - id: ch01-b29
          speaker: narrator
          text: >-
            We continued on our way. When the two gentlemen stepped out of the cab, Wright was still speaking.
        - id: ch01-b30
          speaker: wright
          text: >-
            This is what I believe. If we see cruelty or wrongdoing that we have the power to stop, and we do nothing, then we share the guilt.
