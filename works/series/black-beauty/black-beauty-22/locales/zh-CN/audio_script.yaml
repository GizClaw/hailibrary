audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    john:
      display_name: 约翰
      tts:
        delivery: 稳重耐心，谈起马匹时专业而亲切
        timbre: 温厚沉稳
        pace: 从容
        pitch: 中低
    york:
      display_name: 约克
      tts:
        delivery: 干练威严，对上恭敬，对马务实
        timbre: 结实清晰
        pace: 稳健
        pitch: 中低
    earl:
      display_name: W伯爵
      tts:
        delivery: 理性温和，发话时自然带着主人的权威
        timbre: 成熟醇厚
        pace: 从容
        pitch: 中低
    lady:
      display_name: 伯爵夫人
      tts:
        delivery: 冷傲强势，命令简短而不容置疑
        timbre: 清亮偏冷
        pace: 稍慢
        pitch: 中高
    ginger:
      display_name: 姜饼
      tts:
        delivery: 敏锐刚烈，受委屈时直率而有戒心
        timbre: 明亮有力
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 来到伯爵府
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天吃过早饭，乔把快乐腿套上女主人那辆低矮的轻便马车，要送他去牧师家。临走前，乔来向我们告别，快乐腿也从院子里朝我们嘶鸣。
        - id: ch01-b02
          speaker: narrator
          text: 约翰给姜饼备好鞍，又给我系上牵引缰绳。他骑着姜饼，牵着我，在乡间走了大约十五英里，把我们带到W伯爵居住的伯爵府庄园。
        - id: ch01-b03
          speaker: narrator
          text: 那里的宅邸十分宏伟，马厩也多得很。我们穿过一道石门进了院子。约翰请人去叫约克先生，可等了好一阵，他才露面。
        - id: ch01-b04
          speaker: narrator
          text: 约克人到中年，相貌堂堂。他一开口，你就听得出他惯于发号施令，也惯于别人服从。不过，他待约翰友好又客气。看了我们一眼，他便叫马夫领我们进马栏，又请约翰去吃些点心。
        - id: ch01-b05
          speaker: narrator
          text: 我们住进一间明亮通风的马厩，两间马栏正好相邻。马夫替我们擦洗干净，又喂了饲料。约莫半小时后，约翰和我们的新车夫约克一起来了。
        - id: ch01-b06
          speaker: york
          text: 曼利先生，这两匹马我仔细看过了，挑不出一点毛病。不过，马和人一样，各有各的脾气，有时得换个法子对待。你若有什么特别要交代的，只管告诉我。
        - id: ch01-b07
          speaker: john
          text: 要我说，全国也找不出比他们更好的一对马。如今要分开，我心里实在难受。不过，他们俩的性情确实不同。
        - id: ch01-b08
          speaker: john
          text: 这匹黑马是我见过脾气最好的。想来他从出生起，没听过一句重话，也没挨过一下打。他最乐意做的事，就是照你的意思把活儿干好。
        - id: ch01-b09
          speaker: john
          text: 这匹栗色母马就不一样了。我猜她从前受过虐待，马贩子也这样说。刚到我们那里时，她爱咬人，不肯信人。后来她知道我们是怎么待马的，那些毛病才慢慢消失。这三年里，我再没见她发过一点脾气。
        - id: ch01-b10
          speaker: john
          text: 只要待她好，就没有比她更肯出力的马。不过她天生急躁些，苍蝇叮咬会让她更烦，挽具有一点不合适，她也更难受。谁要虐待她，或是对她不公平，她多半会还回去。许多性情刚烈的马都会这样，你也知道。
        - id: ch01-b11
          speaker: york
          text: 我明白。不过这么大的马厩里，很难叫每个马夫都样样称职。我会尽力，别的也只能听其自然。你说的这匹母马，我会留心。
    - id: ch02
      title: 约翰最后的嘱咐
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两个人正要离开马厩，约翰忽然停住。他还有一件要紧事，不能不说。
        - id: ch02-b02
          speaker: john
          text: 我最好再提一句。我们从没给他们戴过仰头缰。这匹黑马一次也没戴过。马贩子还说，另一匹马的脾气，就是给勒口衔铁毁掉的。
        - id: ch02-b03
          speaker: york
          text: 他们既然来到这里，仰头缰就非戴不可。我自己也喜欢放松些，伯爵大人对马也很通情达理。可伯爵夫人就不同了。她要的是气派，拉车的马不把头高高勒起，她根本不肯看。
        - id: ch02-b04
          speaker: york
          text: 勒口衔铁，我一向反对，以后也会反对。可夫人坐车的时候，仰头缰一定得勒紧。
        - id: ch02-b05
          speaker: john
          text: 听你这样说，我实在遗憾。可我得走了，再不走就赶不上火车了。
        - id: ch02-b06
          speaker: narrator
          text: 约翰走到我们两个身边，最后一次拍拍我们，又低声同我们说话。他的声音悲伤极了。
        - id: ch02-b07
          speaker: narrator
          text: 我把脸紧紧贴近他。这就是我能说的再见。随后，他走了。从那以后，我再也没有见过他。
        - id: ch02-b08
          speaker: narrator
          text: 第二天，W伯爵来看我们。瞧他的样子，他对我们很满意。
        - id: ch02-b09
          speaker: earl
          text: 戈登先生是我的朋友。他把这两匹马说得这样好，我自然信得过他们。他们的毛色虽然配不成一对，不过我们住在乡下时，用他们拉车正合适。
        - id: ch02-b10
          speaker: earl
          text: 去伦敦以前，我得给男爵找一匹毛色相配的马。至于这匹黑马，我看骑起来再好不过。
        - id: ch02-b11
          speaker: narrator
          text: 约克把约翰交代的那些话告诉了伯爵。
        - id: ch02-b12
          speaker: earl
          text: 那匹母马，你要多留心。仰头缰也先放松些。刚开始顺着他们一点，他们应该会干得很好。这件事，我会和夫人说。
    - id: ch03
      title: 第一次戴上仰头缰
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 下午，我们套上挽具，驾到了马车前。马厩的钟敲过三下，我们便被牵到宅邸正门。眼前处处富丽堂皇，比伯特威克的老宅大了三四倍。可要是马也能说说看法，这里还没有老宅一半舒适。
        - id: ch03-b02
          speaker: narrator
          text: 两个男仆早已候在那里。他们穿着浅褐色制服、猩红色短裤和白色长袜。没多久，一阵丝绸的窸窣声从石阶上传来。伯爵夫人走下长阶，绕到我们面前打量。
        - id: ch03-b03
          speaker: narrator
          text: 她身材高挑，神情傲慢，似乎对什么地方不满意，却一句话也没说，径直上了马车。
        - id: ch03-b04
          speaker: narrator
          text: 这是我第一次戴仰头缰。头不能偶尔低一低，的确很不舒服。好在它并没有把我的头勒得比平日更高。我担心姜饼，不过她看上去还算平静自在。
        - id: ch03-b05
          speaker: narrator
          text: 第二天下午三点，我们又停在门前。两个男仆照旧等在那里。丝裙窸窣作响，夫人走下台阶，一开口就是命令。
        - id: ch03-b06
          speaker: lady
          text: 约克，把这两匹马的头勒高一点。他们这个样子，根本见不得人。
        - id: ch03-b07
          speaker: narrator
          text: 约克下了车，态度极其恭敬。
        - id: ch03-b08
          speaker: york
          text: 请您见谅，夫人。这两匹马已经三年没把头勒高了。伯爵大人说，慢慢让他们适应会更安全。不过您若吩咐，我可以再收紧一点。
        - id: ch03-b09
          speaker: lady
          text: 那就收紧些。
        - id: ch03-b10
          speaker: narrator
          text: 约克亲自走到我们头前，把缰绳缩短了一格，我想是一格。哪怕只动一点，无论是变好还是变坏，身上的感觉都会不同。偏偏那天，我们还得爬一道陡坡。
    - id: ch04
      title: 一格又一格
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了坡下，我终于明白，过去听人说的那些苦处是什么滋味。照从前的拉法，我会把头向前伸，痛痛快快地把车拉上去。可这一次，我只能仰着头使劲。
        - id: ch04-b02
          speaker: narrator
          text: 我的劲头一下全泄了，背上和腿上都承受着拉扯。回到马厩以后，姜饼开了口。
        - id: ch04-b03
          speaker: ginger
          text: 这下你知道是什么滋味了吧。不过眼下还不算太糟。只要别再勒紧多少，我就不出声。毕竟这里待我们很不错。
        - id: ch04-b04
          speaker: ginger
          text: 可他们要是把我勒得死紧，那就叫他们当心！我受不了，也绝不会忍着。
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: 从那以后，日子每过一天，仰头缰就又缩短一格。从前，一想到要套上挽具，我总是满心欢喜。现在，我却开始害怕了。
        - id: ch04-b06
          speaker: narrator
          text: 姜饼也越来越焦躁，只是很少说话。后来接连几天，缰绳都没再收紧。我以为最难熬的时候总算过去了。
        - id: ch04-b07
          speaker: narrator
          text: 我决定尽量忍受，照旧做好自己的本分。尽管套车已经不再是快乐，反倒成了无休无止的折磨。
        - id: ch04-b08
          speaker: narrator
          text: 可是，最坏的时候还没有来。
