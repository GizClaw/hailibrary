  chapters:
    - id: ch01
      title: Arrival at Earlshall
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The next morning, after breakfast, Joe harnessed Merrylegs to the mistress's low chaise and took him to the vicarage. Joe came to say goodbye first, and Merrylegs called to us from the yard. Then John saddled Ginger, fastened a leading rein to me, and rode with us about fifteen miles across the country to Earlshall Park, the home of the Earl of W----.

            The house was very grand, with a great many stables. We passed through a stone gateway into the yard, where John asked for Mr. York. We waited some time before he appeared. He was a handsome, middle-aged man, and the sound of his voice made it clear that he was used to being obeyed. Still, he greeted John warmly and politely. After a quick look at Ginger and me, he called a groom to take us to our stalls and invited John inside for something to eat.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The stable was bright and airy. Ginger and I were put in stalls beside each other, rubbed down, and fed. About half an hour later, John returned with Mr. York, who was to be our new coachman. York looked us both over carefully before he spoke.
        - id: ch01-b03
          speaker: york
          text: >-
            Mr. Manly, I can't find a fault with either horse. But horses have their own ways, just as people do, and one may need different handling from another. Is there anything special about either of them that I ought to know?
        - id: ch01-b04
          speaker: john
          text: >-
            I don't believe you'll find a better pair anywhere, and it grieves me to part with them. But they aren't alike. The black horse has the finest temper I've ever known. I doubt he's heard a harsh word or felt a blow since he was born. All he wants is to do whatever you ask.

            The chestnut mare is different. I believe she was treated badly before she came to us. The dealer told us as much. At first she was suspicious and ready to snap, but once she understood what kind of home ours was, that slowly disappeared. In three years, I haven't seen the least sign of bad temper. Treat her well, and you won't find a more willing horse.

            Still, she is more sensitive than the black horse. Flies bother her more, and the smallest trouble with her harness bothers her too. If anyone uses her badly or treats her unfairly, she may very well answer in kind. Many spirited horses will.
        - id: ch01-b05
          speaker: york
          text: >-
            Yes, I understand. But in stables this large, it isn't easy to make every groom behave exactly as he should. I do my best, and that's all I can do. I'll remember what you've told me about the mare.
    - id: ch02
      title: John's Last Goodbye
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            They were about to leave the stable when John stopped. There was one more thing he needed to say.
        - id: ch02-b02
          speaker: john
          text: >-
            I should mention that we've never used a checkrein on either horse. The black one has never worn one at all, and the dealer said a gag bit was what ruined the mare's temper.
        - id: ch02-b03
          speaker: york
          text: >-
            If they stay here, they'll have to wear checkreins. I prefer them loose myself, and his lordship is always reasonable where horses are concerned. But my lady is another matter. She insists on style. If the carriage horses aren't reined up tightly, she won't even look at them. I always refuse to use a gag bit, and I will keep refusing. But when my lady rides, their heads must be held high.
        - id: ch02-b04
          speaker: john
          text: >-
            I'm very sorry to hear that. Truly, I am. But I must leave now, or I'll miss my train.
          emotion: sad
        - id: ch02-b05
          speaker: narrator
          text: >-
            John came to each of us and gave us one last pat. He spoke to us, and his voice was full of sadness.

            I pressed my face close to him. It was the only way I could say goodbye. Then he left, and I never saw him again.
    - id: ch03
      title: The First Drives
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The next day, Lord W---- came to see us. He seemed pleased with the way we looked.
        - id: ch03-b02
          speaker: lord_w
          text: >-
            I have great confidence in these horses because my friend Mr. Gordon spoke so highly of them. They don't match in color, of course, but I think they'll suit the carriage well enough while we're in the country. Before we return to London, I'll have to find a match for Baron. And I understand the black horse is an excellent mount.
        - id: ch03-b03
          speaker: narrator
          text: >-
            York told him what John had said about our different tempers and the checkreins.
        - id: ch03-b04
          speaker: lord_w
          text: >-
            Keep a close watch on the mare, then, and leave the checkrein easy. Give them a little patience at first, and I'm sure they'll do well. I'll speak to her ladyship about it.
        - id: ch03-b05
          speaker: narrator
          text: >-
            That afternoon, we were harnessed to the carriage. When the stable clock struck three, we were led around to the front of the house. Everything there was grand, and the place was three or four times the size of our old home at Birtwick. But if a horse may have an opinion, it wasn't half as pleasant.

            Two footmen stood waiting in gray-brown coats, scarlet breeches, and white stockings. Soon we heard silk rustling as my lady came down the broad stone steps. She walked around us and looked us over. She was tall and proud, and something seemed to displease her, though she said nothing. Then she got into the carriage.

            It was my first time wearing a checkrein. I certainly disliked being unable to lower my head now and then, but the rein did not hold it any higher than I normally carried it. I worried about Ginger, but she appeared quiet and content.
    - id: ch04
      title: Hole by Hole
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            At three the next afternoon, we stood at the door again, with the footmen waiting as before. We heard the rustle of silk, and the lady came down the steps. Her voice was commanding.
        - id: ch04-b02
          speaker: lady_w
          text: >-
            York, you must hold those horses' heads higher. As they are now, they aren't fit to be seen.
        - id: ch04-b03
          speaker: narrator
          text: >-
            York climbed down and answered her with great respect.
        - id: ch04-b04
          speaker: york
          text: >-
            I beg your pardon, my lady. These horses haven't been reined up for three years, and his lordship thought it would be safer to tighten the reins gradually. But if you wish, I can raise them a little more now.
        - id: ch04-b05
          speaker: lady_w
          text: >-
            Then do it.
        - id: ch04-b06
          speaker: narrator
          text: >-
            York came around to our heads and shortened each rein himself. I think he moved it by one hole. Even that small change mattered, for better or worse, and that day our road took us up a steep hill.

            Then I understood what I had heard about checkreins. I wanted to stretch my head forward and put my strength into pulling the carriage uphill, just as I had always done. But I couldn't. Now I had to pull with my head held up. It took the spirit out of me, and the strain fell on my back and legs.
        - id: ch04-b07
          speaker: narrator
          text: >-
            When we returned to the stable, Ginger spoke to me.
        - id: ch04-b08
          speaker: ginger
          text: >-
            Now you know what it's like. This isn't too bad yet, and if it doesn't become much worse, I won't make trouble. We're treated very well here. But if they pull my head up tight, they'd better watch out. I can't bear that, and I won't.
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: >-
            Day after day, one hole at a time, our bearing reins were shortened. I used to look forward to being harnessed. Now I began to dread it. Ginger grew restless too, though she said very little.

            At last, the shortening stopped for several days, and I thought the worst must be over. I decided to endure it and do my duty. Wearing the harness had become a constant torment instead of a pleasure, but I meant to make the best of it.

            The worst had not yet come.
