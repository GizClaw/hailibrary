audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    barry:
      display_name: Mr. Barry
      tts:
        delivery: courteous and somewhat uncertain
        timbre: clear and polished
        pace: conversational
        pitch: medium
    alfred_smirk:
      display_name: Alfred Smirk
      tts:
        delivery: smoothly deferential and self-satisfied
        timbre: neat and light
        pace: conversational
        pitch: medium
    farrier:
      display_name: Farrier
      tts:
        delivery: practical, direct, and assured
        timbre: sturdy and clear
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The New Groom
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Mr. Barry did not find a new groom right away, but after a few days, Alfred Smirk arrived. He was tall and good-looking, and he knew exactly how to impress people. If a groom could ever be called a humbug, Alfred was one.

            He was always polite to me and never treated me cruelly. When Mr. Barry was watching, Alfred stroked and patted me again and again. Before taking me to the door, he wet my mane and tail and rubbed oil on my hoofs so I would look smart. But he barely thought about cleaning my feet, checking my shoes, or giving me a proper grooming. He let my bit grow rusty. My saddle stayed damp, and my crupper went stiff.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Alfred thought he was very handsome. He spent a long time in front of the little mirror in the harness room, fixing his hair, whiskers, and necktie. Whenever Mr. Barry spoke to him, Alfred touched his hat and agreed with every word.
        - id: ch01-b03
          speaker: alfred_smirk
          text: >-
            Yes, sir. Of course, sir.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Everyone decided he was a fine young man and that Mr. Barry was lucky to have found him. To me, he was the laziest and vainest fellow I had ever met.

            I was thankful that he did not abuse me, but a horse needs more than that. I had a loose box where I could have been very comfortable. Alfred was simply too lazy to clean it properly. He never removed all the old straw. The damp mess beneath it smelled awful, and the strong fumes stung my eyes until they became inflamed. Even my appetite began to fade.
    - id: ch02
      title: The Smell in the Stable
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            One day, Mr. Barry came into the stable and noticed the smell.
        - id: ch02-b02
          speaker: barry
          text: >-
            Alfred, the stable smells quite strong. Shouldn't you scrub that stall well and use plenty of water?
        - id: ch02-b03
          speaker: narrator
          text: >-
            Alfred touched his cap.
        - id: ch02-b04
          speaker: alfred_smirk
          text: >-
            If that's what you want, sir, I'll do it. But putting water in a horse's box can be dangerous. Horses can catch cold that way, sir. I wouldn't want to harm him, though I'll wash it if you say so.
        - id: ch02-b05
          speaker: barry
          text: >-
            No, I wouldn't want him catching cold. Still, I don't like this smell. Are the drains working properly?
        - id: ch02-b06
          speaker: alfred_smirk
          text: >-
            Now that you mention it, sir, the drain does seem to send a smell back sometimes. There may be a problem there.
        - id: ch02-b07
          speaker: barry
          text: >-
            Then call the bricklayer and have him examine it.
        - id: ch02-b08
          speaker: alfred_smirk
          text: >-
            Yes, sir. I will.
        - id: ch02-b09
          speaker: narrator
          text: >-
            The bricklayer came and pulled up a great many bricks, but nothing was wrong with the drain. He spread some lime, charged Mr. Barry five shillings, and left. The smell in my box was every bit as bad as before.

            And the smell was not the only harm. I stood day after day on all that moist straw. Before long, my feet became unhealthy and sore. Mr. Barry noticed the change.
        - id: ch02-b10
          speaker: barry
          text: >-
            I can't understand what's wrong with this horse. His steps are so uncertain that I'm sometimes afraid he'll stumble.
        - id: ch02-b11
          speaker: alfred_smirk
          text: >-
            Yes, sir. I've seen it too when I've taken him out for exercise.
    - id: ch03
      title: No Exercise and the Wrong Medicine
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The truth was, Alfred hardly ever exercised me at all. Whenever Mr. Barry was busy, I might stand for days without once stretching my legs. All that time, I was fed as richly as though I had been working hard.

            It often upset my health. Sometimes I felt heavy and dull. More often, I grew restless and feverish. Alfred never gave me green food or a bran mash to cool me down. He was just as ignorant as he was conceited.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Instead of giving me exercise or changing my food, he made me swallow horse balls and medicines. Having them poured down my throat was bad enough. Afterward, they left me feeling sick and miserable.
    - id: ch04
      title: What the Farrier Found
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            One day, my feet were especially tender. Mr. Barry was riding me over some newly laid stones, and I stumbled badly twice. As we came down Lansdown into the city, he stopped at the farrier's and asked the man to find out what was wrong.

            The farrier lifted each of my feet and examined it. Then he stood up and brushed the dust from his hands.
        - id: ch04-b02
          speaker: farrier
          text: >-
            Your horse has thrush, and it's a bad case. His feet are extremely tender. You're lucky he hasn't fallen. I can't understand why your groom didn't deal with this sooner. We see this when a stable is filthy and the old bedding is never cleared out properly.

            Send him back tomorrow, and I'll treat the hoof. I'll also show your groom how to use the liniment I'm giving him.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The next day, my feet were cleaned out thoroughly and packed with tow soaked in a strong lotion. It was very unpleasant.

            The farrier ordered Alfred to remove every bit of bedding from my box each day and keep the floor perfectly clean. Until my feet healed, I was to have bran mashes, a little green food, and less corn.
        - id: ch04-b04
          speaker: narrator
          text: >-
            With that care, my spirits soon returned. But Mr. Barry was disgusted that two grooms had now deceived him. He decided he would no longer keep a horse and would hire one whenever he needed to ride.

            He kept me until my feet were completely sound. Then I was sold once more.
