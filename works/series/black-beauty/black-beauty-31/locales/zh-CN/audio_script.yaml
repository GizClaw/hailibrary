audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    barry:
      display_name: 巴里先生
      tts:
        delivery: 待人温和，对马匹的事不甚在行
        timbre: 温厚清楚
        pace: 适中
        pitch: 中
    alfred:
      display_name: 阿尔弗雷德·斯默克
      tts:
        delivery: 表面恭敬殷勤，实际圆滑懒散
        timbre: 清亮圆润
        pace: 从容偏慢
        pitch: 中
    farrier:
      display_name: 蹄铁匠
      tts:
        delivery: 经验丰富，说话直截了当
        timbre: 粗厚清晰
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 装模作样的马夫
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 主人没有马上找到合适的人。几天以后，我的新马夫来了，名叫阿尔弗雷德·斯默克。他个子高，模样也俊俏，可要论装模作样，没有哪个马夫比得过他。
        - id: ch01-b02
          speaker: narrator
          text: 他对我很客气，从不虐待我。主人在旁边时，他尤其喜欢摸摸我、拍拍我。每逢牵我到门口，他总用水梳亮我的鬃毛和尾巴，再给蹄子涂油，让我看起来格外神气。
        - id: ch01-b03
          speaker: narrator
          text: 可是蹄底该不该清理，蹄铁该不该查看，身上该不该好好刷洗，他一点也不在意，仿佛我只是一头奶牛。嚼子锈了，马鞍潮了，后鞧硬了，他也全不理会。
        - id: ch01-b04
          speaker: narrator
          text: 阿尔弗雷德觉得自己相貌出众，常站在鞍具房的小镜子前，花很久摆弄头发、络腮胡和领结。主人一跟他说话，他就碰一下帽檐，恭恭敬敬地连声答应。
        - id: ch01-b05
          speaker: alfred
          text: 是，先生。是，先生。
        - id: ch01-b06
          speaker: narrator
          text: 人人都觉得这个年轻人好极了，还说巴里先生遇上他真走运。可在我眼里，他是我见过最懒、最自负的家伙。他不欺负我当然是好事，但一匹马需要的远不止不受欺负。
        - id: ch01-b07
          speaker: narrator
          text: 我住的是一间宽敞的单间马厩。他若肯认真清扫，我本可以很舒服。可他从不把旧草全部铲走，底下的污物臭气难闻，浓烈的浊气熏得我眼睛刺痛发炎，连胃口也变差了。
    - id: ch02
      title: 臭气的借口
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 有一天，主人走进马厩，闻到了那股重重的气味。
        - id: ch02-b02
          speaker: barry
          text: 阿尔弗雷德，这里太臭了。你该把马厩仔细刷洗一遍，再多用些水冲一冲吧？
        - id: ch02-b03
          speaker: narrator
          text: 阿尔弗雷德碰了碰帽檐，又摆出那副一心为我着想的样子。
        - id: ch02-b04
          speaker: alfred
          text: 您吩咐的话，我当然照办，先生。不过，往马厩里泼水可有些危险，马很容易着凉。我不愿害它生病，可您要我做，我就做，先生。
        - id: ch02-b05
          speaker: barry
          text: 我也不想让它着凉，可这里的气味实在不好闻。会不会是排水沟出了毛病？
        - id: ch02-b06
          speaker: alfred
          text: 您这么一说，我也想起来了。排水沟有时确实会往上返臭，也许真出了问题，先生。
        - id: ch02-b07
          speaker: barry
          text: 那就叫泥瓦匠来看看。
        - id: ch02-b08
          speaker: alfred
          text: 是，先生，我这就去。
        - id: ch02-b09
          speaker: narrator
          text: 泥瓦匠赶来，撬起许多块砖，却没找到任何毛病。他只撒了些石灰，收了主人五先令。我的马厩呢，还是一样臭。
        - id: ch02-b10
          speaker: narrator
          text: 更糟的是，我天天踩着那堆湿草，蹄子渐渐出了毛病，变得又疼又嫩。主人看我走路磕磕绊绊，心里很不放心。
        - id: ch02-b11
          speaker: barry
          text: 这匹马到底怎么了？走起路来总不稳。我有时真怕它会失蹄摔倒。
        - id: ch02-b12
          speaker: alfred
          text: 是的，先生。我带它出去活动时，也发现它走路有这个问题。
    - id: ch03
      title: 蹄子出了毛病
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 其实，阿尔弗雷德几乎从不带我活动。主人忙的时候，我常常一连几天站在马厩里，腿也伸展不开，吃的精料却还跟干重活时一样多。
        - id: ch03-b02
          speaker: narrator
          text: 我的身体因此常常不舒服。有时我沉重倦怠，更多时候却焦躁发热。青草和麦麸粥本来能帮我清凉降火，他却一次也没给过我。他有多自负，就有多无知。
        - id: ch03-b03
          speaker: narrator
          text: 他不让我活动，也不换换饲料，反倒给我吃马药丸，硬往我嘴里灌药水。那些东西灌下去已经够难受了，过后还让我浑身不舒服。
        - id: ch03-b04
          speaker: narrator
          text: 一天，我的蹄子疼得格外厉害。主人骑着我小跑经过新铺的碎石路，我接连两次重重踉跄。走到兰斯当下坡进城的地方，他在一家蹄铁匠铺前停下，请人替我检查。
        - id: ch03-b05
          speaker: narrator
          text: 蹄铁匠逐一抬起我的四只脚，看得十分仔细。检查完，他直起身，拍了拍两手的灰尘。
        - id: ch03-b06
          speaker: farrier
          text: 您的马得了蹄叉腐烂，而且很严重。它的蹄子疼得厉害，幸好还没摔倒。真不明白您的马夫为什么没有早点发现。
        - id: ch03-b07
          speaker: farrier
          text: 这种毛病常出在肮脏的马厩里，特别是垫草从来不彻底清走的地方。明天把马送来吧，我给它治蹄子，再教您的马夫怎样用我配的搽剂。
    - id: ch04
      title: 再一次被卖掉
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天，我的蹄子被彻底洗净，里面又塞满浸过烈性药水的麻絮。那番治疗实在不好受。
        - id: ch04-b02
          speaker: narrator
          text: 蹄铁匠吩咐马夫，每天都要把我房里的垫草全部清出去，地面必须保持洁净。等蹄子康复以前，我要吃麦麸粥和少量青草，谷料则得少吃些。
        - id: ch04-b03
          speaker: narrator
          text: 这样照料了一阵，我很快又有了精神。可是巴里先生已经接连被两个马夫欺骗，实在厌烦透了。他决定不再自己养马，以后需要时就临时租一匹。
        - id: ch04-b04
          speaker: narrator
          text: 于是，他们把我留下，直到我的蹄子完全康复。随后，我又一次被卖掉了。
