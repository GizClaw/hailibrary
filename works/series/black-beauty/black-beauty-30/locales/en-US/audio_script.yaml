  chapters:
    - id: ch01
      title: A Thief
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            My new master was an unmarried businessman who lived in Bath. His doctor told him he ought to exercise on horseback, and that was why he bought me. He rented a stable not far from his rooms and hired a groom named Filcher.

            Mr. Barry knew very little about horses, but he was kind to me. I would have had an easy, comfortable place with him if certain things had not been hidden from him. He ordered the very best hay for me, along with plenty of oats, crushed beans, and bran. Filcher could add vetches or rye grass whenever he thought I needed them. I heard those orders myself, so I knew there should be plenty of good food. I thought I had landed in a fine home.
        - id: ch01-b02
          speaker: narrator
          text: >-
            At first, everything went well. Filcher understood his work. He kept my stable clean and full of fresh air, groomed me carefully, and always handled me gently. He had once worked as a hostler at one of Bath's large hotels. Now he grew fruit and vegetables to sell at market, while his wife raised and fattened poultry and rabbits for sale.

            Before long, though, my oats began to run short. I still got the beans, but they were mixed with bran instead of oats. There were hardly any oats at all, perhaps a quarter of what I should have had.
        - id: ch01-b03
          speaker: narrator
          text: >-
            After two or three weeks, the poor feeding began to drain my strength and spirits. The green food was good, but without enough grain it could not keep me in condition. I had no way to complain or tell anyone what I needed. This went on for about two months, and I kept wondering why my master did not notice that something was wrong.

            Then one afternoon, he rode me into the country to visit a friend. The friend was a gentleman farmer who lived along the road to Wells, and he had a sharp eye for horses.
        - id: ch01-b04
          speaker: narrator
          text: >-
            As soon as the farmer had welcomed Mr. Barry, he looked me over closely.
        - id: ch01-b05
          speaker: farmer
          text: >-
            Barry, your horse doesn't look nearly as well as he did when you bought him. Has he been sick?
        - id: ch01-b06
          speaker: barry
          text: >-
            Not that I know of. He certainly isn't as lively as he used to be. My groom says horses always lose some strength and energy in the fall, so I should expect it.
        - id: ch01-b07
          speaker: farmer
          text: >-
            Fall? Nonsense! It's only August. Even if it were fall, a horse with such light work and good food shouldn't be losing condition like this. What are you feeding him?
        - id: ch01-b08
          speaker: narrator
          text: >-
            Mr. Barry described the food he had ordered. The farmer slowly shook his head, then began running his hands over me.
        - id: ch01-b09
          speaker: farmer
          text: >-
            I couldn't tell you who's eating the grain you pay for, my friend. But I'd be very surprised if this horse is getting it. Did you ride him hard today?
        - id: ch01-b10
          speaker: barry
          text: >-
            No. We came along very gently.
        - id: ch01-b11
          speaker: farmer
          text: >-
            Then feel right here.
        - id: ch01-b12
          speaker: narrator
          text: >-
            He passed his hand across my neck and shoulder.
        - id: ch01-b13
          speaker: farmer
          text: >-
            He's warm and damp, just like a horse brought straight in from pasture. You need to pay closer attention to that stable of yours. I don't like suspecting people. Thank heaven, I can trust my own men whether I'm there or not. But some miserable scoundrels will steal food from a helpless animal. You'd better investigate.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Then he turned to the man who had come to lead me away.
        - id: ch01-b15
          speaker: farmer
          text: >-
            Give this horse a generous feed of crushed oats. Make sure he gets all he needs.
        - id: ch01-b16
          speaker: narrator
          text: >-
            A helpless animal. Yes, I was helpless because I could not speak. If I had been able to tell Mr. Barry what I knew, I could have shown him exactly where his oats were going.

            Filcher arrived at the stable every morning around six, and a little boy always came with him carrying a covered basket. The boy followed his father into the harness room where the grain was stored. Whenever the door stood partly open, I could see them filling a small bag from the oat bin. Then the boy would hurry away with it.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Five or six mornings after our visit to the farmer, the boy had just left the stable when the door suddenly opened again. A policeman came in, gripping the child firmly by the arm. A second policeman followed them and locked the door from the inside.
        - id: ch01-b18
          speaker: policeman
          text: >-
            Show me where your father stores the food for his rabbits.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The boy looked terrified and began to cry. There was no way out, so he led the officers to the grain bin. There they found another empty bag, exactly like the one they had already discovered full of oats in his basket.

            Filcher was cleaning my feet at the time. The policemen soon spotted him. He made a loud fuss and tried to argue, but it did him no good. They marched him off to the lockup and took his son along with him.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Later, I heard that the boy was not considered guilty. Filcher, however, was sentenced to two months in prison.
