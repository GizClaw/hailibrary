audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    barry:
      display_name: 巴里先生
      tts:
        delivery: 待人温和，对马匹的事不甚在行
        timbre: 温厚清楚
        pace: 适中
        pitch: 中
    farmer:
      display_name: 农场主
      tts:
        delivery: 眼光敏锐，说话直率而有分寸
        timbre: 沉稳明亮
        pace: 从容
        pitch: 中低
    policeman:
      display_name: 警察
      tts:
        delivery: 严肃果断，办案时简洁有力
        timbre: 坚实清晰
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 燕麦越来越少
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我的新主人巴里先生是个单身汉，住在巴斯，每天忙着做生意。医生劝他骑骑马，活动身体，他便买下了我。他还在住处附近租了马厩，雇来一个叫菲尔彻的马夫。
        - id: ch01-b02
          speaker: narrator
          text: 主人不怎么懂马，对我倒很好。如果不是暗中出了些他不知道的事，我这份差事原本会很轻松。他明明吩咐过，要给我最好的干草、足量的燕麦、碾碎的豆子和麦麸，再看需要添些野豌豆或黑麦草。这些话我都听见了，所以一直以为自己吃得很好。
        - id: ch01-b03
          speaker: narrator
          text: 起初几天，什么问题也没有。菲尔彻熟悉马夫的活儿，马厩收拾得干净又通风，我也总被刷洗得很仔细。他对我从不粗暴。从前，他在巴斯一家大旅馆做马倌，后来改种水果和蔬菜去卖。他的妻子也做营生，养鸡养兔，养肥了再出售。
        - id: ch01-b04
          speaker: narrator
          text: 可是过了一阵，我吃到的燕麦越来越少。豆子还在，里面掺的却几乎全是麦麸。真正的燕麦，连该有的四分之一也不到。才过两三个星期，我便没了力气，精神也差了。青草饲料再好，没有谷物也撑不起身体。我不会诉苦，更说不出自己缺什么，只能这样熬了大约两个月。
        - id: ch01-b05
          speaker: narrator
          text: 我总不明白，主人怎么还没看出我的样子不对。后来一天下午，他骑着我去乡下拜访朋友。那位朋友既是乡绅，也是农场主，就住在通往韦尔斯的路边。
    - id: ch02
      title: 农场主看出了问题
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 农场主很会看马。招呼过巴里先生，他马上把我上下打量了一遍。
        - id: ch02-b02
          speaker: farmer
          text: 巴里，你这匹马的样子可不如刚买来时了。他最近身体好吗？
        - id: ch02-b03
          speaker: barry
          text: 应该没什么病，只是远不如从前活泼。马夫说，一到秋天，马总会没有精神，身上也没力气，我只能等它过去。
        - id: ch02-b04
          speaker: farmer
          text: 秋天？别听这种胡话！现在才八月。他干这么轻的活，又吃着好饲料，就算真是秋天，也不该瘦弱下去。你每天给他吃些什么？
        - id: ch02-b05
          speaker: narrator
          text: 主人把那些饲料一一说了。农场主慢慢摇着头，又伸手摸遍我的身体。
        - id: ch02-b06
          speaker: farmer
          text: 老兄，我不知道你的谷物让谁吃了，可这匹马肯定没吃到。你刚才一路跑得很快吗？
        - id: ch02-b07
          speaker: barry
          text: 没有，我让他慢慢走来的。
        - id: ch02-b08
          speaker: narrator
          text: 农场主让主人伸手摸摸，自己也把手从我的脖颈抚到肩头。
        - id: ch02-b09
          speaker: farmer
          text: 你摸，他身上又热又潮，简直像刚从牧场赶上来的马。往后你得多留心马厩里的事。我不喜欢平白无故怀疑别人。谢天谢地，我也用不着怀疑自己的伙计，因为不管我在不在，他们都靠得住。可世上就是有卑鄙的恶棍，连不会说话的牲口嘴里的食物都忍心偷。你一定得查清楚。
        - id: ch02-b10
          speaker: narrator
          text: 说完，他转身吩咐前来牵我的伙计。
        - id: ch02-b11
          speaker: farmer
          text: 给这匹马好好吃一顿碾碎的燕麦，分量要足，别舍不得。
    - id: ch03
      title: 小偷落网
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 不会说话的牲口，他说得没错。可我要是能说话，早就告诉主人燕麦去了哪里。菲尔彻每天早晨六点左右来马厩，总带着一个小男孩，孩子手里提着一只有盖的篮子。他跟着父亲进存放谷物的挽具房。门只要留着一道缝，我就能看见他们从粮箱里舀出燕麦，装满一个小袋子，再让男孩带走。
        - id: ch03-b02
          speaker: narrator
          text: 五六天后，男孩刚刚离开马厩，门突然开了。一名警察抓紧他的胳膊，把他带回里面。另一名警察跟着进来，转身锁上了门。
        - id: ch03-b03
          speaker: policeman
          text: 领我过去，让我看看你父亲把兔子的饲料藏在哪儿。
        - id: ch03-b04
          speaker: narrator
          text: 男孩吓得哭起来，却没有地方可逃，只得把他们领到粮箱边。警察在那里找出一个空口袋，和男孩篮子里那只装满燕麦的袋子完全一样。
        - id: ch03-b05
          speaker: narrator
          text: 菲尔彻当时正在替我清理蹄子，很快也被发现了。他大声吵嚷了一通，可两名警察还是把他和儿子一同押到拘留所。后来我听说，男孩没有被判有罪，菲尔彻却被判了两个月监禁。
