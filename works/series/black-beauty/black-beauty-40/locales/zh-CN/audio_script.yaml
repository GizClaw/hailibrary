audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    ginger:
      display_name: 姜饼
      tts:
        delivery: 直率敏锐，叙说见闻时简洁而关切
        timbre: 清亮而有韧性
        pace: 自然
        pitch: 中
  chapters:
    - id: ch01
      title: 公园外的重逢
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天，公园里正演奏音乐。我们的马车和许多别的车一起停在外面候客。这时，一辆破旧的出租马车赶过来，停在我们旁边。
        - id: ch01-b02
          speaker: narrator
          text: 拉车的是一匹上了年纪的栗色马。她已经累垮了，皮毛也没人好好照料，肋骨根根露在外面。两只膝盖向前弯着，前腿直打晃。
        - id: ch01-b03
          speaker: narrator
          text: 我正在吃干草，风把一小绺草吹到她那边。她伸出细长的脖子，把草衔起来吃掉，又扭头四处寻找。那双暗淡的眼睛里透着绝望，我看了怎么也不能不在意。
        - id: ch01-b04
          speaker: narrator
          text: 我正想着从前在哪里见过她，她忽然直直望向我。
        - id: ch01-b05
          speaker: ginger
          text: 黑骏马，真的是你吗？
        - id: ch01-b06
          speaker: narrator
          text: 原来是姜饼！可她已经变得几乎叫我认不出了。从前那弯曲得那么好看、毛色又那么光亮的脖颈，如今又直又瘦，软塌塌地陷了下去。她原先匀净笔直的腿和秀气的球节全都肿着，关节也被长年的苦活磨得变了形。
        - id: ch01-b07
          speaker: narrator
          text: 那张脸曾经满是活力和锐气，现在却只剩下痛苦。她两胁不停起伏，还一阵阵咳嗽。我一看就知道，她连喘气都已经很艰难。
        - id: ch01-b08
          speaker: narrator
          text: 我们的车夫正在不远处说话。我便侧过身，往她那里挪了一两步，好让我们安静地谈一会儿。姜饼要告诉我的，是一段悲惨的经历。
    - id: ch02
      title: 一直用到报废
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 姜饼在伯爵府休养了整整一年。人们觉得她又能干活了，便把她卖给一位绅士。起先，她过得还不错。后来有一次，她跑得比平常远，旧伤又发作了。人们让她休息，也给她医治，可最后还是再次卖掉了她。她就这样换了好几个主人，日子也一次比一次糟。
        - id: ch02-b02
          speaker: ginger
          text: 到最后，一个车主买下了我。他养着许多马，也有许多出租马车，专门把车马租给车夫。你看起来过得不错，我真替你高兴。可我这些日子是怎么熬过来的，根本没法对你说清。
        - id: ch02-b03
          speaker: ginger
          emotion: sad
          text: 他们发现我有旧伤，就说买我的钱花得不值。他们非要让我去拉最下等的车，一直把我用到报废。现在，他们就是这么对我的。他们只管抽我，逼我干活，从来不想想我受着什么苦。
        - id: ch02-b04
          speaker: ginger
          text: 他们说，既然花钱买了我，就得从我身上把钱赚回来。眼下租我赶车的人，每天也得交给车主一大笔钱，所以他也非从我身上挣回来不可。就这样，一星期天天绕来绕去，连星期日也不让我歇一歇。
        - id: ch02-b05
          speaker: narrator
          text: 我想起从前的姜饼，忍不住问她。
        - id: ch02-b06
          speaker: narrator
          text: 从前有人欺负你，你不是总会反抗吗？
        - id: ch02-b07
          speaker: ginger
          emotion: sad
          text: 唉，我从前是反抗过。可那有什么用？人比我们强。只要他们残忍，没有一点怜悯，我们就毫无办法，只能忍下去，一直忍到生命尽头。
        - id: ch02-b08
          speaker: ginger
          emotion: sad
          text: 我真希望那一天快点来，真希望自己死掉。我见过死去的马，知道它们再也不会疼了。我只盼着干活时能一下倒地死去，别再被送到屠马场。
        - id: ch02-b09
          speaker: narrator
          text: 我心里难过极了，只能把鼻子贴近她的鼻子，却连一句安慰的话也说不出来。姜饼见到我，想来是高兴的。她对我说了最后一句话。
        - id: ch02-b10
          speaker: ginger
          emotion: sad
          text: 你是我这一生唯一有过的朋友。
        - id: ch02-b11
          speaker: narrator
          text: 就在这时，她的车夫走过来，猛地扯住嚼子，让她从车队里倒出去，随即赶着走了。我留在原地，心里悲伤极了。
    - id: ch03
      title: 苦难终于结束
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 没过多久，一辆大车从我们的候车处旁经过，车里载着一匹死马。马头垂在车尾外，毫无生气的舌头缓缓往下滴着血。还有那双深陷的眼睛！我实在说不下去，那情景太可怕了。
        - id: ch03-b02
          speaker: narrator
          text: 那是一匹脖子细长的栗色马，额头上有一道白纹。我相信她就是姜饼。我也希望那是她，因为这样一来，她的苦难终于结束了。
        - id: ch03-b03
          speaker: narrator
          text: 唉！人如果能多一点怜悯，就该在我们悲惨到这种地步以前，一枪结束我们的生命。
