audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    ginger:
      display_name: Ginger
      tts:
        delivery: weary, candid, and deeply sorrowful
        timbre: breath-worn and mature
        pace: slow and uneven
        pitch: medium-low
  chapters:
    - id: ch01
      title: Poor Ginger
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One day, our cab was waiting with many others outside a park where music was playing. A shabby old cab pulled up beside us. Its horse was a worn-out chestnut. Her coat was neglected, and her bones showed beneath it. Her knees bent forward, and her front legs shook.
        - id: ch01-b02
          speaker: narrator
          text: >-
            I had been eating hay when the wind rolled a small lock toward her. The poor horse stretched out her long, thin neck and picked it up. Then she looked around for more. Her dull eyes held such a hopeless look that I could not ignore it. I was trying to remember where I had seen her when she looked straight at me.
        - id: ch01-b03
          speaker: ginger
          emotion: surprised
          text: >-
            Black Beauty? Is that really you?
        - id: ch01-b04
          speaker: narrator
          text: >-
            It was Ginger. But she had changed terribly. Her neck had once been glossy and beautifully arched. Now it was straight, thin, and sunken. Her legs had once been clean and strong, with delicate fetlocks. Now they were swollen, and hard work had pulled her joints out of shape.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The face once so full of life and spirit now showed only suffering. Her sides heaved, and she coughed again and again. I could tell how hard it was for her to breathe.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Our drivers were talking together a short distance away. I edged a step or two closer to Ginger so we could speak quietly. The story she told me was a sad one.
        - id: ch01-b07
          speaker: narrator
          text: >-
            She had been allowed to rest at Earlshall for a year. After that, people thought she was ready to work again, and a gentleman bought her. For a while, she did quite well. Then she was taken on a longer gallop than usual, and the old injury came back.
        - id: ch01-b08
          speaker: narrator
          text: >-
            They rested her and treated her, but then they sold her again. She passed from one owner to another several times, and each time she fell a little lower.
        - id: ch01-b09
          speaker: ginger
          text: >-
            At last, a man bought me who owns a number of cabs and horses and rents them out. You look as if life has treated you well, Beauty, and I'm glad. But I could never tell you all that my own life has been.
        - id: ch01-b10
          speaker: ginger
          text: >-
            Once they discovered my weakness, they said I wasn't worth what they had paid. They put me in one of the lowest cabs so they could use me up. And that is exactly what they're doing. They whip me and work me without ever thinking about how much I suffer. They say they paid for me, so they have to get their money out of me.
        - id: ch01-b11
          speaker: ginger
          text: >-
            The man who hires me now has to pay the owner a great deal every day. So he says he has to get his money out of me too. It goes on all week, around and around, without even a Sunday to rest.
        - id: ch01-b12
          speaker: narrator
          text: >-
            I reminded her that she had once fought back whenever anyone treated her badly.
        - id: ch01-b13
          speaker: ginger
          text: >-
            I did once. But it doesn't help. Men are stronger than we are. When they are cruel and have no feeling, all we can do is bear it. We bear it again and again, right to the end.
        - id: ch01-b14
          speaker: ginger
          emotion: sad
          text: >-
            I wish the end would come. I wish I were dead. I've seen dead horses, and I know they feel no pain. I hope I fall down dead while I'm working, so they won't send me away to the knacker's yard.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Her words troubled me deeply. I reached out and touched my nose to hers, but there was nothing I could say that would comfort her. I think she was glad to see me, because she spoke once more.
        - id: ch01-b16
          speaker: ginger
          emotion: sad
          text: >-
            You are the only friend I ever had.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Just then, her driver came back. He gave her mouth a hard tug, backed her out of the line, and drove away. I was left behind, feeling very sad.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Not long afterward, a cart carrying a dead horse passed our cabstand. The horse's head hung out over the back. Its lifeless tongue drooped slowly, streaked with blood. And the sunken eyes—I cannot speak of them. The sight was too dreadful.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The horse was a chestnut with a long, thin neck. A white streak ran down its forehead. I believe it was Ginger. I hoped it was, because then her suffering had ended.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Oh, if only men were more merciful. They would shoot us before we ever came to such misery.
