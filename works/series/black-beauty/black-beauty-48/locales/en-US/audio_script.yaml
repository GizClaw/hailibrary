audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    thoroughgood:
      display_name: Farmer Thoroughgood
      tts:
        delivery: kindly, thoughtful, and quietly good-humored
        timbre: full and warm
        pace: unhurried
        pitch: medium-low
    willie:
      display_name: Willie
      tts:
        delivery: eager, tenderhearted, and sincere
        timbre: youthful and bright
        pace: lively
        pitch: medium-high
    seller:
      display_name: The Seller
      tts:
        delivery: persuasive, practical, and familiar
        timbre: rough and plain
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: At the Horse Sale
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            At the sale, I found myself among the old, broken-down horses. Some were lame, some could hardly breathe, and some were so worn out that shooting them would have been a mercy.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Many of the buyers and sellers looked almost as badly off as the animals. Poor old men searched for a horse or pony, hoping to spend only a few pounds on something that could pull a little wood or coal cart. Other poor men were trying to sell a worn-out horse for two or three pounds because killing it would cost them even more.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Hard times had made some of them hard, too. But others were shabby and poor yet still kind and human. I trusted their voices, and I would gladly have spent the last of my strength serving them. One unsteady old man took a great liking to me, and I liked him, too. But I was not strong enough for what he needed. It was an anxious time.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Then a gentleman farmer came over from the better part of the fair with a young boy beside him. The man had a broad back, round shoulders, a kind, ruddy face, and a broad-brimmed hat. He stopped near us and looked around with pity. When his eyes settled on me, I pricked up my ears and looked back. My mane and tail were still good, and they helped my appearance.
        - id: ch01-b05
          speaker: thoroughgood
          text: >-
            Look at that horse, Willie. He's certainly known better days.
        - id: ch01-b06
          speaker: willie
          text: >-
            Poor old fellow! Grandpapa, do you think he used to be a carriage horse?
        - id: ch01-b07
          speaker: thoroughgood
          text: >-
            Oh, yes, my boy. When he was young, he might have been fit for almost anything. Look at his nostrils and ears, and the shape of his neck and shoulders. That horse comes from very good stock.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The farmer stepped closer and patted my neck. I reached my nose toward him in answer to his kindness, and the boy stroked my face.
        - id: ch01-b09
          speaker: willie
          text: >-
            Poor fellow! See how well he understands when we're kind to him. Couldn't you buy him and make him young again, the way you did with Ladybird?
        - id: ch01-b10
          speaker: thoroughgood
          text: >-
            My dear boy, I can't make every old horse young again. And Ladybird wasn't really so old. She had been badly treated and was simply run down.
        - id: ch01-b11
          speaker: willie
          text: >-
            Well, I don't think this horse is old. Just look at his mane and tail. Please check his mouth so you can tell. He's terribly thin, but his eyes aren't sunken like the other old horses' eyes.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The old gentleman laughed.
        - id: ch01-b13
          speaker: thoroughgood
          emotion: happy
          text: >-
            Bless you, Willie! You're every bit as horse-crazy as your old grandfather.
        - id: ch01-b14
          speaker: willie
          text: >-
            But please look at his mouth, Grandpapa, and ask what he costs. I know he'd grow young again in our meadows.
    - id: ch02
      title: Five Pounds and a Chance
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The man who had brought me to the sale joined the conversation.
        - id: ch02-b02
          speaker: seller
          text: >-
            The young gentleman knows his horses, sir. Truth is, this one has been pulled down by too much cab work. He isn't old. I heard the veterinarian say that six months turned out to pasture would put him right again, since his wind isn't broken. I've cared for him these past ten days, and I've never met a more grateful or pleasant animal. Give five pounds for him and give him a chance. By next spring, I'll warrant he'll be worth twenty.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The old gentleman laughed again, and the boy looked up at him eagerly.
        - id: ch02-b04
          speaker: willie
          text: >-
            Grandpapa, didn't you say the colt sold for five pounds more than you expected? Buying this horse wouldn't leave you any poorer.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The farmer slowly felt my legs. They were badly swollen and strained. Then he looked into my mouth.
        - id: ch02-b06
          speaker: thoroughgood
          text: >-
            I'd say he's thirteen or fourteen. Would you trot him out for me?
        - id: ch02-b07
          speaker: narrator
          text: >-
            I arched my poor, thin neck, lifted my tail a little, and stretched out my legs as well as I could. They were very stiff.
        - id: ch02-b08
          speaker: thoroughgood
          text: >-
            What's the very lowest price you'll take for him?
        - id: ch02-b09
          speaker: seller
          text: >-
            Five pounds, sir. My master won't take any less.
        - id: ch02-b10
          speaker: narrator
          text: >-
            The old gentleman shook his head, but slowly drew out his purse at the same time.
        - id: ch02-b11
          speaker: thoroughgood
          text: >-
            It's a gamble. Quite a gamble! Do you have any more business here?
        - id: ch02-b12
          speaker: narrator
          text: >-
            As he spoke, he counted five gold sovereigns into the seller's hand.
        - id: ch02-b13
          speaker: seller
          text: >-
            No, sir. I can take him to the inn for you, if you'd like.
        - id: ch02-b14
          speaker: thoroughgood
          text: >-
            Please do. I'm headed there now.
        - id: ch02-b15
          speaker: narrator
          text: >-
            They walked ahead while I was led behind. Willie could hardly contain his delight, and his grandfather seemed to enjoy seeing him so happy. At the inn, I had a good meal. Then one of my new master's servants rode me gently home and turned me into a large meadow with a shed in one corner.
    - id: ch03
      title: Old Crony
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            My benefactor's name was Mr. Thoroughgood. He ordered that I should have hay and oats every morning and night, with the freedom of the meadow during the day.
        - id: ch03-b02
          speaker: thoroughgood
          text: >-
            Willie, I want you to keep an eye on him. I'm putting him in your care.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Willie was proud of that responsibility, and he took it very seriously. Not a day went by without a visit from him. Sometimes he found me among the other horses and brought me a piece of carrot or another treat. Sometimes he simply stood beside me while I ate my oats.
        - id: ch03-b04
          speaker: narrator
          text: >-
            He always came with kind words and gentle pats, so of course I grew very fond of him. Willie called me Old Crony because I would come to him in the field and follow him around. Now and then, he brought his grandfather along. Mr. Thoroughgood always examined my legs closely.
        - id: ch03-b05
          speaker: thoroughgood
          text: >-
            His legs are the part we need to watch, Willie. But he's getting steadily better. I think we'll see a real change by spring.
    - id: ch04
      title: Young Again
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Complete rest, good food, soft grass, and gentle exercise soon improved both my health and my spirits. I had inherited a strong constitution from my mother. No one had strained me while I was young, either. That gave me a better chance of recovering than horses put to work before reaching their full strength.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Through the winter, my legs improved so much that I began to feel quite young again. Spring arrived, and one day in March, Mr. Thoroughgood decided to try me in the phaeton. I was pleased. He and Willie drove me for a few miles. My legs were no longer stiff, and I pulled the carriage with perfect ease.
        - id: ch04-b03
          speaker: thoroughgood
          emotion: happy
          text: >-
            He's growing young again, Willie. We'll start giving him a little gentle work. By midsummer, he'll be every bit as good as Ladybird. He responds beautifully to the reins, and his way of moving couldn't be better.
        - id: ch04-b04
          speaker: willie
          emotion: happy
          text: >-
            Oh, Grandpapa, I'm so glad you bought him!
        - id: ch04-b05
          speaker: thoroughgood
          text: >-
            So am I, my boy. But he owes more thanks to you than to me. Now we must find him a quiet, respectable home where people will value him.
