audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 克制真诚，带着历经磨难后的敏锐与温厚
        timbre: 温暖清晰的成年男声
        pace: 舒缓而有起伏
        pitch: 中低
    thoroughgood:
      display_name: 瑟罗古德先生
      tts:
        delivery: 厚道沉稳，说起马来经验老到
        timbre: 温暖结实的老年男声
        pace: 从容
        pitch: 低
    willie:
      display_name: 威利
      tts:
        delivery: 天真热切，对马充满怜爱
        timbre: 清亮自然的男孩声
        pace: 轻快
        pitch: 高
    seller:
      display_name: 卖马人
      tts:
        delivery: 世故健谈，带着市集商贩的殷勤
        timbre: 略显粗哑的成年男声
        pace: 稍快
        pitch: 中
  chapters:
    - id: ch01
      title: 拍卖场上的相遇
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 在这场拍卖会上，我和一群年老体衰的马挤在一起。有的瘸了，有的喘不过气，有的实在太老。还有几匹，让它们痛快死去，反倒更仁慈。
        - id: ch01-b02
          speaker: narrator
          text: 来买卖牲口的人，有许多也不比这些可怜的马强多少。穷苦老人想用几英镑买匹马，好拉一辆小木柴车或煤车。也有人想把累垮的牲口卖上两三英镑，免得宰掉以后损失更多。有些人已经被苦日子磨硬了心。另一些人虽然衣衫寒酸，却依旧厚道，他们说话的声音也叫我信得过。要是能为这样的人效劳，我愿意用尽最后一分力气。
        - id: ch01-b03
          speaker: narrator
          text: 有个步履蹒跚的老人很喜欢我，我也喜欢他，可惜我已经没有足够的力气替他干活。那段等待的工夫，真叫人揪心。后来，从集市另一边走来一位体面的农场主，身旁跟着一个小男孩。他背膀宽阔，肩头浑圆，戴着宽檐帽，红润的脸上透着和气。他停在我们面前，怜悯地看了一圈，目光最后落在我身上。
        - id: ch01-b04
          speaker: narrator
          text: 我的鬃毛和尾巴还算漂亮，多少替模样添了点精神。我竖起耳朵，也望着他。
        - id: ch01-b05
          speaker: thoroughgood
          text: 威利，你看看这匹马。它从前一定有过好日子。
        - id: ch01-b06
          speaker: willie
          text: 真可怜！爷爷，你说它以前拉过马车吗？
        - id: ch01-b07
          speaker: thoroughgood
          text: 那是一定的，孩子。它年轻的时候，什么活儿都可能干得了。瞧瞧它的鼻孔和耳朵，再看看脖颈和肩膀。这匹马的血统相当不错。
        - id: ch01-b08
          speaker: narrator
          text: 农场主走近，亲切地拍了拍我的脖子。我把鼻子探向他，回应这份好意。男孩也轻轻摸着我的脸。
        - id: ch01-b09
          speaker: willie
          text: 爷爷，你瞧，它明白我们对它好呢！你把它买回去吧。你从前能让瓢虫恢复过来，也一定能叫它重新年轻，对不对？
        - id: ch01-b10
          speaker: thoroughgood
          text: 好孩子，我哪能叫所有的老马都返老还童。再说，瓢虫当时不算太老，只是累坏了，又受过虐待。
        - id: ch01-b11
          speaker: willie
          text: 可我不相信它老了。你看看它的鬃毛和尾巴嘛。再看看它的牙，你就能判断了。它是瘦得厉害，可眼睛没有像那些老马一样凹下去呀。
        - id: ch01-b12
          speaker: narrator
          text: 老人听得笑了。
        - id: ch01-b13
          speaker: thoroughgood
          text: 这孩子呀！谈起马来，跟他爷爷一模一样。
        - id: ch01-b14
          speaker: willie
          text: 那你就看看它的牙，再问问要多少钱吧。只要到了咱们的草场，它准会重新年轻起来。
    - id: ch02
      title: 五英镑的冒险
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 把我牵来拍卖的人听到这里，也插进话来。
        - id: ch02-b02
          speaker: seller
          text: 小少爷是真懂马呀，先生。跟您说实话，这匹马不老。它拉出租马车，活儿太重，才累成这样。我还听说兽医看过，它的肺没坏，只要歇上半年，准能养回来。这十天都是我照料它，再没有比它更知恩、更温顺的牲口了。花五英镑给它一次机会，绝不会吃亏。等到明年春天，我敢保证它能值二十英镑。
        - id: ch02-b03
          speaker: narrator
          text: 老人笑了。小男孩急切地仰头看着他。
        - id: ch02-b04
          speaker: willie
          text: 爷爷，那匹小马不是比你预想的多卖了五英镑吗？现在花五英镑买下它，你又不会少钱。
        - id: ch02-b05
          speaker: narrator
          text: 农场主慢慢摸过我又肿又伤的腿，随后检查了我的牙。
        - id: ch02-b06
          speaker: thoroughgood
          text: 我看，它有十三四岁。麻烦让它小跑一圈吧。
        - id: ch02-b07
          speaker: narrator
          text: 我拱起瘦弱的脖颈，稍稍扬起尾巴，尽力迈开四条僵硬的腿。等我回到他们面前，农场主又开口了。
        - id: ch02-b08
          speaker: thoroughgood
          text: 你最低肯收多少钱？
        - id: ch02-b09
          speaker: seller
          text: 五英镑，先生。这是我主人定下的最低价。
        - id: ch02-b10
          speaker: thoroughgood
          text: 这笔钱是在冒险，实实在在的冒险！
        - id: ch02-b11
          speaker: narrator
          text: 老人嘴上这么说，手却慢慢掏出了钱袋。他把金币一枚枚数进卖马人手中。
        - id: ch02-b12
          speaker: thoroughgood
          text: 你在这里还有别的事吗？
        - id: ch02-b13
          speaker: seller
          text: 没有了，先生。您要是愿意，我可以替您把它牵到旅店。
        - id: ch02-b14
          speaker: thoroughgood
          text: 好，那就牵去吧。我也正要到那里。
        - id: ch02-b15
          speaker: narrator
          text: 他们走在前面，我被牵在后头。男孩欢喜得几乎按捺不住，老人看着他高兴，自己也很快活。我在旅店里饱饱吃了一顿。随后，新主人的仆人轻轻骑着我回了家，把我放进一片宽阔的草场。草场一角，还有一座棚子。
    - id: ch03
      title: 威利的老朋友
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我的恩人姓瑟罗古德。他吩咐人每天早晚给我干草和燕麦，白天就让我在草场上自由走动。然后，他把照料我的任务交给了威利。
        - id: ch03-b02
          speaker: thoroughgood
          text: 威利，你得好好照看它。从现在起，我把它交给你了。
        - id: ch03-b03
          speaker: narrator
          text: 威利为这份托付感到骄傲，也当真认真地做了起来。他一天不落地来看我。有时，他从别的马中找到我，喂我一小块胡萝卜，或者别的好东西。有时，我吃燕麦，他就在旁边陪着。每一次，他都带来温柔的话语和爱抚，我自然越来越喜欢他。
        - id: ch03-b04
          speaker: narrator
          text: 他叫我“老朋友”。因为只要他来到草场，我就会迎上前，再跟着他到处走。有时，他也把祖父带来。老人每次都仔细查看我的腿。
        - id: ch03-b05
          speaker: thoroughgood
          text: 威利，成不成就看这双腿了。不过，它一直在稳稳恢复。我想等到春天，咱们会看到很大的起色。
    - id: ch04
      title: 又年轻起来
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 充分休息，吃上好饲料，在柔软的草地上做些舒缓的活动，我的身体和精神很快都有了变化。我从母亲那里承继了一副好体格，年幼时又没有受过劳损。许多马还没长结实就开始干活，相比之下，我恢复的希望大得多。
        - id: ch04-b02
          speaker: narrator
          text: 整个冬天，我的腿越来越好，到后来，我真觉得自己又年轻了。春天到来以后，三月的一天，瑟罗古德先生决定让我试拉轻便四轮马车。我很乐意。他和威利坐着车走了几英里，我的腿不再僵硬，拉起来一点也不费力。
        - id: ch04-b03
          speaker: thoroughgood
          text: 威利，它真的在变年轻。现在可以让它做一点轻省的活儿。等到仲夏，它就会跟瓢虫一样健壮。它对口衔的反应很好，步态也漂亮，简直无可挑剔。
        - id: ch04-b04
          speaker: willie
          text: 爷爷，你买下它，我真是太高兴了！
          emotion: happy
        - id: ch04-b05
          speaker: thoroughgood
          text: 我也很高兴，孩子。不过，它更应该感谢你。现在，我们得替它找一个清静体面的去处，让那里的人真心爱惜它。
