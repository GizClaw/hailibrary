audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    lady_anne:
      display_name: 安妮小姐
      tts:
        delivery: 开朗自信，言语亲切又带着不肯服输的爽快
        timbre: 明亮柔美
        pace: 轻快
        pitch: 中高
    blantyre:
      display_name: 布兰太尔先生
      tts:
        delivery: 有教养而谨慎，危急时果断急切
        timbre: 清晰沉稳
        pace: 稳健
        pitch: 中低
    footman:
      display_name: 男仆
      tts:
        delivery: 恭敬利落，传话时字句清楚
        timbre: 平实清晰
        pace: 适中
        pitch: 中
    woman:
      display_name: 路边的妇人
      tts:
        delivery: 热心急切，回答干脆响亮
        timbre: 明快朴实
        pace: 稍快
        pitch: 中高
    road_mender:
      display_name: 修路老人
      tts:
        delivery: 朴实紧张，隔着路高声指引
        timbre: 苍老粗粝
        pace: 稍慢
        pitch: 中低
    turf_cutter:
      display_name: 割泥炭的男人
      tts:
        delivery: 忠厚勇敢，乡音朴实，危急时全心相助
        timbre: 粗厚温暖
        pace: 适中
        pitch: 中低
    doctor:
      display_name: 阿什利医生
      tts:
        delivery: 专注克制，在紧急诊治中简洁明确
        timbre: 沉静清楚
        pace: 稳健
        pitch: 中
    ginger:
      display_name: 姜饼
      tts:
        delivery: 直率敏锐，叙说见闻时简洁而关切
        timbre: 清亮而有韧性
        pace: 自然
        pitch: 中
  chapters:
    - id: ch01
      title: 换马出行
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 初春，W伯爵带着几位家人去伦敦，也把约克带走了。我、姜饼和另外几匹马留在府里，由马房总管照料。
        - id: ch01-b02
          speaker: narrator
          text: 留在府里的哈丽雅特小姐身体一直很弱，从不坐马车出门。安妮小姐却爱同弟弟或表兄弟们骑马。她骑术精湛，人又美丽、开朗、温柔。她挑中我做坐骑，还叫我“黑奥斯特”。清冷明净的天气里，我们常常出去，有时和姜饼同行，有时和莉齐同行。我非常喜欢这样的出游。
        - id: ch01-b03
          speaker: narrator
          text: 莉齐是一匹鲜亮的枣红母马，血统近乎纯种。她步态好看，性子活泼，先生们都很喜欢她。姜饼比我更了解莉齐，说她容易紧张。
        - id: ch01-b04
          speaker: narrator
          text: 当时，府里住着布兰太尔先生。他总骑莉齐，又总夸她。一天，安妮小姐吩咐人把侧鞍装到莉齐背上，普通马鞍则装给我。我们来到门口，布兰太尔先生一看就不放心。
        - id: ch01-b05
          speaker: blantyre
          text: 怎么换马了？你骑腻那匹可靠的黑奥斯特了吗？
        - id: ch01-b06
          speaker: lady_anne
          text: 一点儿也没有。我只是好心让你骑他一回，也想试试你那匹迷人的莉齐。论个头和模样，她可比我最喜欢的奥斯特更像小姐该骑的马，这一点你总得承认吧。
        - id: ch01-b07
          speaker: blantyre
          text: 还是别骑她吧。莉齐确实讨人喜欢，可她太容易紧张，不适合小姐骑。我不能保证她稳妥。请你让人把鞍换回来。
        - id: ch01-b08
          speaker: lady_anne
          text: 好表兄，别拿你那颗谨慎的脑袋替我操心。我还是婴儿时就骑马，跟着猎犬队也出去过很多回。我知道你不赞成小姐打猎，可我就是骑过。你们都那么喜欢莉齐，我今天偏要试一试。现在，像个好朋友那样扶我上马吧。
        - id: ch01-b09
          speaker: narrator
          text: 布兰太尔再没有什么可说，只好小心扶她坐稳，又查过口衔和勒链，把缰绳轻轻交到她手里，自己骑上我。我们正要走，一名男仆拿着纸条从屋里跑出来，替哈丽雅特小姐传话。
        - id: ch01-b10
          speaker: footman
          text: 请二位到阿什利医生家替小姐问问纸上的事，再把答复带回来。
        - id: ch01-b11
          speaker: narrator
          text: 村庄离府邸约有一英里，医生家在村子尽头。我们一路轻快地到了门前。门里是一条不长的车道，两边高大的常青树一直排到宅子。
        - id: ch01-b12
          speaker: narrator
          text: 布兰太尔在门口下马，要替安妮小姐开门。
        - id: ch01-b13
          speaker: lady_anne
          text: 我就在这里等。你把奥斯特的缰绳挂到门上吧。
        - id: ch01-b14
          speaker: blantyre
          text: 我五分钟就回来。
        - id: ch01-b15
          speaker: lady_anne
          text: 不用赶。莉齐和我又不会扔下你跑掉。
    - id: ch02
      title: 莉齐失控
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他把我的缰绳挂在铁门尖上，很快走进树丛。莉齐背朝着我，在几步外的路边静静站着。安妮小姐松松握着缰绳，坐得很自在，嘴里还哼着小曲。我听见布兰太尔走到宅子，敲响了门。
        - id: ch02-b02
          speaker: narrator
          text: 对面草地的栅门开着。几匹拉车的马和小马驹乱哄哄地跑出来，后面一个男孩不停甩响长鞭。小马驹又野又贪玩，其中一匹冲过大路，一头撞上莉齐的后腿。究竟是那匹蠢马驹，还是鞭子的巨响吓坏了她，我说不清。也许两样都是。
        - id: ch02-b03
          speaker: narrator
          text: 莉齐猛踢一脚，接着就不管不顾地飞奔。事情来得太突然，安妮小姐差点被甩下马，好在她很快又坐稳了。我扬起声音尖声嘶叫，一声接着一声地求救。我急得不停刨地，又拼命甩头，想从铁门上挣开缰绳。
        - id: ch02-b04
          speaker: narrator
          text: 我没有等多久。布兰太尔飞快跑到门口，焦急地四下张望，只见那个飞驰的身影已经到了大路远处。他立刻跳上马鞍。我和他一样急着救人，根本不用鞭子或马刺。他明白我的心意，完全放开缰绳，身子微微前倾，我们一起飞驰着追了出去。
        - id: ch02-b05
          speaker: narrator
          text: 大路笔直地延伸了一英里半，随后右转，再分成两条。没到转弯处，莉齐已经不见了。她们究竟走了哪边？一个妇人站在花园门口，手搭在额前，正急切地望着大路。布兰太尔几乎没减速，只喊了一声。
        - id: ch02-b06
          speaker: blantyre
          text: 哪边？
        - id: ch02-b07
          speaker: woman
          text: 她们往右边去了！
        - id: ch02-b08
          speaker: narrator
          text: 她一边喊，一边抬手指路。我们便沿右边追。转过弯，我们短暂地看见了她们，下一个弯后又看不见了。一路上，我们几次望见她们，接着又跟丢了。那两道身影时隐时现，我们却好像始终没有追近多少。
        - id: ch02-b09
          speaker: narrator
          text: 石堆旁站着一位修路老人，铁锹已经掉在地上，两手举得高高的。他见我们过来，急忙打手势。布兰太尔稍稍收缰。
        - id: ch02-b10
          speaker: road_mender
          text: 往荒地去了，先生！她从那里拐下去了！
        - id: ch02-b11
          speaker: narrator
          text: 那片荒地我熟悉得很。地面大多高低不平，长满石南、墨绿色的荆豆，还有零星几棵矮小的老山楂树。几片短草地上，又到处都是蚁丘和鼹鼠拱起的土堆。要是不管不顾地狂奔，再没有比那里更糟的地方了。
        - id: ch02-b12
          speaker: narrator
          text: 我们一拐上荒地，又看见前面翻飞的绿色骑装。安妮小姐的帽子掉了，棕色长发向后飘着。她把头和身体拼命向后仰，用仅剩的力气拉住缰绳，而那力气眼看也要耗光。粗糙的地面拖慢了莉齐，我们终于有希望追上。
        - id: ch02-b13
          speaker: narrator
          text: 在大路上，布兰太尔一直放开缰绳，由着我跑。到了荒地，他的手势轻巧，眼光又准，引着我越过高低不平的地面，避开一处处危险。我几乎没有减速。现在，我们确实离她们越来越近了。
        - id: ch02-b14
          speaker: narrator
          text: 荒地中央新挖了一道很宽的沟，挖出来的泥土粗粗糙糙地堆在另一边。我以为这下一定能拦住莉齐。可她几乎没停就跳了过去，落在坚硬的土块间，脚下一绊，重重摔倒。布兰太尔见她倒下，痛苦地呻吟了一声。
        - id: ch02-b15
          speaker: blantyre
          text: 奥斯特，现在全靠你了！
        - id: ch02-b16
          speaker: narrator
          text: 他稳稳拉住缰绳。我收紧身体，奋力一跃，连沟带土堤一起越了过去。
    - id: ch03
      title: 荒地上的救援
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我可怜的年轻女主人脸朝下伏在石南丛里，一动不动。布兰太尔跪下呼唤她，没有回应。他轻轻翻过她的脸。那张脸白得吓人，眼睛紧闭着。
        - id: ch03-b02
          speaker: blantyre
          text: 安妮，亲爱的安妮，说句话吧！
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: 她还是不答。布兰太尔解开骑装的纽扣，松开她的衣领，又摸了摸她的手和手腕。接着，他猛地站起来，发疯似的四处寻找帮手。
        - id: ch03-b04
          speaker: narrator
          text: 不远处有两个男人在割泥炭。他们看见莉齐独自乱跑，背上一个人也没有，便停下手里的活，去捉住她。布兰太尔高喊一声，两人很快赶来。跑在前面的男人看到安妮小姐躺在地上，心里十分不安，忙问自己能做什么。
        - id: ch03-b05
          speaker: blantyre
          text: 你会骑马吗？
        - id: ch03-b06
          speaker: turf_cutter
          text: 先生，我骑得不算好。可为了安妮小姐，摔断脖子我也愿意。去年冬天，她待我妻子实在太好了。
        - id: ch03-b07
          speaker: blantyre
          text: 那就骑上这匹马，朋友，你的脖子不会有事。先去找医生，请他马上赶来。再去府里，把你知道的都告诉他们，叫他们派马车来，带上安妮小姐的女仆，再多来几个人。我留在这里。
        - id: ch03-b08
          speaker: turf_cutter
          text: 好，先生，我一定尽力。愿上帝保佑亲爱的小姐快点睁开眼睛。乔，快去找水，再叫我家女人马上过来照看安妮小姐！
        - id: ch03-b09
          speaker: narrator
          text: 他不知怎么手脚并用，好不容易爬上马鞍，喊了声“驾”，两腿往我身侧一夹，我们便出发了。他先绕了一个小圈，避开那道宽沟。因为手里没有鞭子，他起初还有些发愁，可我的速度马上让他顾不上这件事。他发现自己最要紧的是牢牢坐稳，再尽力拉着我，而他确实做得很勇敢。
        - id: ch03-b10
          speaker: narrator
          text: 我尽量少颠他。可经过崎岖处时，他还是叫了一两回。
        - id: ch03-b11
          speaker: turf_cutter
          text: 稳住！吁，稳住！
        - id: ch03-b12
          speaker: narrator
          text: 上了大路就顺利了。他先到医生家，又赶到府里，把差事办得又忠实又妥当。有人请他进去喝一小口提提神，他却拒绝了。
        - id: ch03-b13
          speaker: turf_cutter
          text: 不，不。我得抄近路穿过田野，回去陪他们。我还能赶在马车前面到。
        - id: ch03-b14
          speaker: narrator
          text: 消息一传开，府里立刻忙乱起来，人人都焦急万分。我刚被牵进马厩隔间，马鞍和辔头就卸下来了，身上也盖了毯子。
        - id: ch03-b15
          speaker: narrator
          text: 人们匆匆给姜饼备了鞍，派她去找乔治少爷。不久，我听见马车隆隆驶出院子。接下来那段时间显得格外漫长。我等了很久，姜饼才回来。又等了好一阵，身边的人才终于散去，她便把自己看见的一切告诉了我。
    - id: ch04
      title: 安妮脱险
      blocks:
        - id: ch04-b01
          speaker: ginger
          text: 我知道得不多。我们几乎一路飞奔，到那儿时，医生也刚骑马赶到。一个女人坐在地上，把小姐的头抱在膝上。医生往她嘴里喂了点东西，我只听清一句话。
        - id: ch04-b02
          speaker: doctor
          text: 她还活着。
        - id: ch04-b03
          speaker: ginger
          text: 后来，一个男人把我牵远了些。又过了一阵，他们把小姐抬上马车，我们也一起回府。路上有位先生拦住主人打听，我听见主人说，希望她没有摔断骨头，可她一直还没开口。
        - id: ch04-b04
          speaker: narrator
          text: 乔治少爷带姜饼去打猎时，约克曾摇头说，马第一次参加狩猎，得由一双稳当的手来训练，不能让乔治少爷那样莽撞的骑手去骑。
        - id: ch04-b05
          speaker: narrator
          text: 姜饼本来很喜欢打猎。可有时她回来，我看得出她累伤得很厉害，偶尔还会短促地咳嗽。她太要强，从来不抱怨，我却免不了替她担心。
        - id: ch04-b06
          speaker: narrator
          text: 事故过去两天，布兰太尔来看我。他一边拍我，一边不停夸奖。他对乔治少爷说，这匹马和自己一样清楚安妮遇到了危险。
        - id: ch04-b07
          speaker: blantyre
          text: 就算我想收住他，也根本拦不住。安妮以后不该再骑别的马了。
        - id: ch04-b08
          speaker: narrator
          text: 从他们的交谈里，我得知年轻的女主人已经脱离危险，很快又能骑马了。这消息让我十分欢喜，我也开始盼望往后能过上幸福的日子。
