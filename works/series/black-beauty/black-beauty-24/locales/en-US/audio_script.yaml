  chapters:
    - id: ch01
      title: Lady Anne Chooses Lizzie
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Early that spring, Lord W---- took part of his family to London, and York went with them. Ginger, several other horses, and I stayed at the hall under the head groom's care.

            Lady Harriet remained there too. She was often ill and never rode in the carriage. Lady Anne preferred going out on horseback with her brother or her cousins. She rode beautifully, and she was as cheerful and gentle as she was lovely. She chose me for her own horse and called me Black Auster. I loved our rides in the clear, cold air, whether Ginger came with us or Lizzie did.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Lizzie was a bright bay mare, nearly thoroughbred. The gentlemen admired her lively spirit and the fine way she moved. Ginger knew her better than I did, though, and said she could be nervous.

            A gentleman named Blantyre was staying at the hall. He always rode Lizzie and praised her so highly that one day Lady Anne had the side-saddle put on Lizzie and the other saddle put on me. When we came to the door, Blantyre looked very uneasy.
        - id: ch01-b03
          speaker: blantyre
          text: >-
            What are you doing? Surely you haven't had enough of faithful Black Auster.
        - id: ch01-b04
          speaker: lady_anne
          text: >-
            Of course not. I'm generously lending him to you for one ride, and I'll see whether Lizzie deserves all your praise. Just look at her. She's the right size and far more elegant for a lady than my own favorite.
        - id: ch01-b05
          speaker: blantyre
          text: >-
            I really wish you wouldn't ride her. Yes, she's lovely, but she's much too nervous. I can't promise she'll be safe with a lady. Please let us switch the saddles again.
        - id: ch01-b06
          speaker: lady_anne
          text: >-
            Dear cousin, you can stop worrying about me. I've ridden since I was a baby, and I've been out with the hounds again and again. You may not approve of women hunting, but I've done it. Today I'm trying the mare all you gentlemen fuss over. So please be kind and help me up.
        - id: ch01-b07
          speaker: narrator
          text: >-
            There was nothing more he could say. He settled her carefully in the saddle, checked the bit and curb, and placed the reins gently in her hand. Then he mounted me.

            Just as we started, a footman came out with a note and a message from Lady Harriet.
        - id: ch01-b08
          speaker: footman
          text: >-
            Lady Harriet would like you to ask Dr. Ashley this question and return with his reply.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The village was about a mile away, and the doctor's house stood at its far end. We went along pleasantly until we reached his gate. A short drive led between tall evergreens toward the house.

            Blantyre got down to open the gate for Lady Anne.
        - id: ch01-b10
          speaker: lady_anne
          text: >-
            I'll wait here. You can hang Auster's rein on the gate.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Blantyre gave her a doubtful look.
        - id: ch01-b12
          speaker: blantyre
          text: >-
            I won't be more than five minutes.
        - id: ch01-b13
          speaker: lady_anne
          text: >-
            Take your time. Lizzie and I will still be here when you return.
        - id: ch01-b14
          speaker: narrator
          text: >-
            He looped my rein over an iron spike and disappeared among the trees. Lizzie stood quietly a few steps down the road with her back toward me. Lady Anne sat easily, holding a loose rein and humming a little song. I listened as Blantyre reached the house and knocked.
    - id: ch02
      title: The Runaway
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Across the road, the gate to a meadow stood open. Just then, several cart horses and young colts came trotting out in a disorderly bunch. A boy followed them, cracking a large whip. The colts were wild with play. One dashed across the road and blundered into Lizzie's hind legs.

            Perhaps the colt startled her, or perhaps it was the sharp crack of the whip. It may have been both. Lizzie kicked violently and shot away at a headlong gallop. The rush nearly threw Lady Anne from the saddle, but she quickly found her balance again.
        - id: ch02-b02
          speaker: narrator
          text: >-
            I gave a loud, piercing neigh for help. I called again and again as I pawed the ground and tossed my head, trying to free my rein. I did not wait long. Blantyre came running to the gate. He searched the road anxiously and caught one glimpse of Lady Anne already flying far into the distance.

            In an instant, he was in my saddle. I needed neither whip nor spur. I wanted to reach her as badly as he did. He understood, gave me my head, and leaned forward. We raced after them.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The road ran straight for about a mile and a half, then curved right and divided. Lady Anne had vanished well before we reached the turn. Which road had she taken?

            A woman stood at her garden gate, one hand shading her eyes as she stared up the road. Blantyre hardly slowed me before he called out.
        - id: ch02-b04
          speaker: blantyre
          text: >-
            Which way did she go?
        - id: ch02-b05
          speaker: woman_at_gate
          text: >-
            Take the right!
        - id: ch02-b06
          speaker: narrator
          text: >-
            She pointed, and we tore up the right-hand road. For a moment, we saw Lady Anne ahead. Another bend hid her. Again and again we caught a glimpse, then lost it, and we hardly gained any ground.

            An old road mender stood beside a pile of stones. His shovel lay where he had dropped it, and both hands were raised. As we came close, he signaled that he had something to tell us. Blantyre checked me slightly.
        - id: ch02-b07
          speaker: road_mender
          text: >-
            She's gone toward the common, sir! She turned off there!
        - id: ch02-b08
          speaker: narrator
          text: >-
            I knew that common well. Most of it was rough and uneven, covered in heather and dark green furze, with a few scrubby old thorn trees. Even the open patches of short grass were broken by ant hills and molehills. I had never known a worse place for a runaway gallop.
    - id: ch03
      title: Across the Common
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            We had barely turned onto the common when Lady Anne came into sight again. Her green riding habit streamed behind her. Her hat was gone, and her long brown hair flew out in the wind. She leaned her head and body far back as she pulled with all the strength she had left, and that strength was almost gone.

            The rough ground had slowed Lizzie a great deal. At last, it seemed possible that we might catch her.
        - id: ch03-b02
          speaker: narrator
          text: >-
            On the road, Blantyre had let me choose my own pace. Now he guided me over the common with a light hand and an experienced eye. He picked our way so skillfully that I hardly had to slow down. We began to gain on them.

            Halfway across the heath, a wide ditch had recently been cut. The loose earth had been thrown into a rough bank on the far side. Surely that would stop Lizzie.
        - id: ch03-b03
          speaker: narrator
          text: >-
            It did not. She leaped almost without pausing, stumbled among the heavy clods, and fell. Blantyre groaned.
        - id: ch03-b04
          speaker: blantyre
          text: >-
            Now, Auster, give me everything you have!
        - id: ch03-b05
          speaker: narrator
          text: >-
            He steadied the rein. I gathered myself and made one determined leap, clearing both the ditch and the bank.

            My poor young mistress lay facedown among the heather, perfectly still. Blantyre dropped to his knees and called her name. She made no sound. He gently turned her face upward. It was deathly white, and her eyes were shut.
        - id: ch03-b06
          speaker: blantyre
          text: >-
            Annie! Dear Annie, please say something!
          emotion: fearful
        - id: ch03-b07
          speaker: narrator
          text: >-
            There was no answer. He opened the top of her riding habit, loosened her collar, and felt her hands and wrist. Then he jumped up and looked wildly around for help.

            Not far away, two men had been cutting turf. They saw Lizzie running loose without her rider and left their work to catch her. Blantyre shouted, and they hurried over. The first man was deeply troubled by what he saw. He asked how he could help.
        - id: ch03-b08
          speaker: blantyre
          text: >-
            Can you ride?
        - id: ch03-b09
          speaker: turf_cutter
          text: >-
            Not very well, sir. Still, for Lady Anne, I'll take the chance. She treated my wife kindly last winter.
        - id: ch03-b10
          speaker: blantyre
          text: >-
            Get on this horse, then. He won't put you in danger. Go straight to the doctor and bring him here immediately. After that, hurry to the hall. Explain what happened and send back the carriage, Lady Anne's maid, and more help. I'll remain with her.
        - id: ch03-b11
          speaker: turf_cutter
          text: >-
            I'll give it everything I've got, sir. May God help the dear young lady wake up soon.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Then he called to the other man.
        - id: ch03-b13
          speaker: turf_cutter
          text: >-
            Joe, fetch some water! Tell my wife to come to Lady Anne as fast as she can!
    - id: ch04
      title: A Ride for Help
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The turf cutter somehow scrambled into my saddle. He called, “Get up,” clapped both legs against my sides, and started off. He made a small circle around the ditch. Not having a whip seemed to worry him at first, but my speed soon cured that concern. Before long, all he could do was cling to the saddle and try to hold me back. To his credit, he did it bravely.

            I tried not to jolt him more than I had to. Once or twice on the rough common, he called out.
        - id: ch04-b02
          speaker: turf_cutter
          text: >-
            Steady! Whoa there, steady!
        - id: ch04-b03
          speaker: narrator
          text: >-
            Once we reached the road, we had no trouble. At the doctor's house and then at the hall, he delivered every part of the message faithfully. They invited him inside to take a drink.
        - id: ch04-b04
          speaker: turf_cutter
          text: >-
            No, thank you. I'm going back across the fields. That shortcut will get me there ahead of the carriage.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The news set the whole household hurrying. They had only just put me in my stall when they pulled off my saddle and bridle and threw a cloth over me.

            Ginger was saddled and sent off at once to fetch Lord George. Soon afterward, I heard the carriage roll out of the yard.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Ginger seemed to be gone a very long time. At last she returned, and eventually we were left alone. Then she told me what she had seen.
        - id: ch04-b07
          speaker: ginger
          text: >-
            I can't tell you very much. We galloped almost the whole way and arrived just as the doctor rode up. A woman was sitting on the ground with Lady Anne's head in her lap. The doctor poured something into her mouth, but the only words I heard were, “She isn't dead.” Then a man led me a short distance away.

            After a while, they carried her to the carriage, and we all came home together. A gentleman stopped my master to ask what had happened. I heard him say he hoped no bones were broken, but she still hadn't spoken.
    - id: ch05
      title: Good News
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            When Lord George took Ginger hunting, York would shake his head. He believed a horse in her first hunting season needed a steady rider to train her, not someone as reckless as Lord George.

            Ginger enjoyed the hunting very much. Still, I sometimes saw how badly strained she was when she came home, and now and then she gave a short cough. She had too much spirit to complain, but I could not help worrying about her.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Two days after the accident, Blantyre came to see me. He patted me and praised me warmly. Then he told Lord George he was certain I had understood Annie's danger as clearly as he had.
        - id: ch05-b03
          speaker: blantyre
          text: >-
            I couldn't have held him back even if I'd wanted to. She should never ride any other horse.
        - id: ch05-b04
          speaker: narrator
          text: >-
            As I listened to them, I learned that my young mistress was out of danger and would soon be able to ride again.

            That was wonderful news to me, and I looked forward to a happy life.
