audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    rough_driver:
      display_name: 粗暴的车夫
      tts:
        delivery: 蛮横急躁，吆喝时毫不体谅马匹
        timbre: 粗硬响亮
        pace: 偏快
        pitch: 中低
    peggy:
      display_name: 佩吉
      tts:
        delivery: 温顺诚恳，诉说遭遇时忧郁而不怨愤
        timbre: 柔和朴实
        pace: 平缓
        pitch: 中
    young_horse:
      display_name: 年轻的马
      tts:
        delivery: 坦率敏感，回忆受惊经历时带着困惑和委屈
        timbre: 清亮略紧
        pace: 自然稍快
        pitch: 中
    old_gentleman:
      display_name: 老先生
      tts:
        delivery: 明白事理，制止错误时严正果断
        timbre: 苍劲清楚
        pace: 稳健
        pitch: 中低
    tall_gentleman:
      display_name: 高个子先生
      tts:
        delivery: 体贴沉着，谈到马匹时温和而有把握
        timbre: 温厚清晰
        pace: 从容
        pitch: 中低
    hostler:
      display_name: 马夫
      tts:
        delivery: 熟悉马匹，回答问题时朴实直率
        timbre: 粗朴清楚
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 把马当成蒸汽机
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 还有一种车夫，赶起车来，简直把马当成了蒸汽机。他们大多从城里来，自己从没养过马，平日出门多半坐火车。
        - id: ch01-b02
          speaker: narrator
          text: 在他们眼里，马大概就是一台小号的蒸汽机。反正钱已经付了，马就该照他们的意思，想走多远走多远，想跑多快跑多快，想拉多重拉多重。路上是烂泥还是干地，是石子还是平路，是上坡还是下坡，他们都不管。只管向前，一直向前，速度一点也不能慢，更别说让马喘口气，替马想一想了。
        - id: ch01-b03
          speaker: narrator
          text: 碰上陡坡，他们也绝不会下车走几步。他们花钱就是来坐车的，怎么肯走路？至于马，他们会说，马不是早就习惯了吗？马生来不就是拖人上坡的吗？让客人自己走，岂不是笑话！
        - id: ch01-b04
          speaker: narrator
          text: 于是，鞭子落下来，缰绳猛地抖起来，耳边还会响起粗声粗气的呵斥。
        - id: ch01-b05
          speaker: rough_driver
          text: 快走，你这懒畜生！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 紧接着，又是一鞭。其实我们一句怨言也没有，一直规规矩矩地尽全力往前走。可这样折腾下去，再肯干的马也会疲惫，也会灰心。
        - id: ch01-b07
          speaker: narrator
          text: 没有哪一种赶法，比这种蒸汽机式的赶法更耗马。我宁肯跟着体谅马的好车夫走二十英里，也不愿被这些人赶上十英里。走二十英里的那一趟，反而轻松得多。
        - id: ch01-b08
          speaker: narrator
          text: 下坡时也一样。不管坡有多陡，他们几乎从不用刹车，所以难免闯出大祸。偶尔用了刹车，到了坡底，他们又会忘记松开。我不止一次拖着一只卡死的车轮，吃力地爬上下一座坡。一直走到半山腰，车夫才终于想起刹车还没松。那股力全压在马身上，实在难熬。
        - id: ch01-b09
          speaker: narrator
          text: 这些城里车夫起步也不肯慢慢来。他们一出马厩院子，就让马全速飞奔。等他们想停车，会先抽上一鞭，再突然勒紧缰绳，害得我们差点向后坐倒，嘴也被嚼子狠狠扯痛。他们还把这叫作收得利落。转弯更是说拐就拐，好像道路根本不分该走哪一边。
    - id: ch02
      title: 罗里的事故
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我一直记得那个春天的傍晚。我和罗里在外面跑了一整天。每次需要两匹马一起拉车，多半都是他和我搭档。他忠厚可靠，是个很好的伙伴。
        - id: ch02-b02
          speaker: narrator
          text: 那天是我们自己的车夫赶车。他一向温和，也懂得体谅我们，所以一天过得很愉快。天快黑时，我们用轻快稳健的步子往家赶。前面的路突然向左拐。我们贴着自己这边的树篱走，旁边明明还有足够的地方让别的车经过，车夫也就没有再把我们往里带。
        - id: ch02-b03
          speaker: narrator
          text: 快到转角时，我听见一匹马拉着双轮车，正从坡上飞快地冲来。树篱太高，我什么也看不见。下一刻，两辆车已经撞到了一起。
        - id: ch02-b04
          speaker: narrator
          text: 幸好我在靠树篱的一边。罗里却套在车辕左边，身旁连根车杠都没有，什么也挡不住。对面那个车夫直冲着转角过来。等他终于看见我们，已经来不及让回自己那边了。
        - id: ch02-b05
          speaker: narrator
          text: 那一下全撞在罗里身上。轻便马车的车杠直插进他的胸口，他惨叫着向后踉跄。那声惨叫，我永远也忘不了。对面的马被撞得坐倒在后腿上，车杠也断了一根。后来我们才知道，那匹马也来自我们的马厩，拉的正是年轻人最喜欢的高轮轻便马车。
        - id: ch02-b06
          speaker: narrator
          text: 驾车的是个莽撞又无知的家伙。他连路该走哪边都不知道，或者即使知道，也根本不在乎。可怜的罗里皮肉撕开，血不停地往下流。人们说，车杠只要再偏一点，就会当场要了他的命。对他来说，那或许反而更好。
        - id: ch02-b07
          speaker: narrator
          text: 罗里的伤过了很久才长好，可他已经残废了，后来被卖去拉煤车。拖着煤车在那些陡坡上来来回回是什么滋味，只有马自己知道。
        - id: ch02-b08
          speaker: narrator
          text: 我在那里见过一些景象，到现在想起来仍然难过。一匹马走下陡坡，后面拖着装满重物的双轮车，偏偏那种车根本装不了刹车。
    - id: ch03
      title: 佩吉的短腿
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 罗里受伤以后，我常和一匹叫佩吉的母马一起拉车。她住在我隔壁的马栏里，身子结实，体形匀称。她的皮毛是明亮的暗黄色，带着漂亮的斑纹，鬃毛和尾巴则是深棕色。她没有高贵的血统，却长得秀气，脾气格外温柔，干活也很肯出力。
        - id: ch03-b02
          speaker: narrator
          text: 不过，她的眼睛里总有一丝不安，我知道她一定有烦恼。我们第一次搭档出门，我就发现她的步子很怪。她像是在小跑，又像是在慢跑，走三四步，便突然往前蹿一下。
        - id: ch03-b03
          speaker: narrator
          text: 和她一起拉车，哪匹马都会觉得别扭，我也被那节奏弄得心神不宁。回到马厩以后，我问她为什么这样走路。
        - id: ch03-b04
          speaker: peggy
          text: 唉，我知道自己的步子很难看，可我能怎么办呢？这真的不是我的错，只因为我的腿太短。我站起来差不多和你一样高，可你的腿从膝盖往上，比我足足长三英寸。你当然迈得更远，也跑得更快。
          emotion: sad
        - id: ch03-b05
          speaker: peggy
          text: 你瞧，我又不能挑自己长成什么样。要是能挑，我一定给自己长一双长腿。我所有的苦处，都是这双短腿惹来的。
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: 佩吉说到这里，越发灰心。我不明白，便问她身体这么强壮，脾气又好，也肯出力，怎么还是会落到这种地步。
        - id: ch03-b07
          speaker: peggy
          text: 还不是因为人总想赶得飞快。一匹马要是跟不上别的马，就只能挨鞭子。一下，又一下，没完没了。为了追上他们，我只好想尽办法，最后就养成了这种难看的碎步，还得不时向前蹿一下。
        - id: ch03-b08
          speaker: peggy
          text: 我从前不是这样的。跟着第一位主人时，我总能稳稳地小跑。他不那么着急。他是乡下的一位年轻牧师，要照管两座相隔很远的教堂，每天有许多工作。可他从不因为我跑得不够快就骂我、打我。他很疼爱我。我真希望现在还跟着他。可后来他要搬去一座大城，我便被卖给了一个农夫。
        - id: ch03-b09
          speaker: peggy
          text: 有些农夫是很好的主人，这我知道。可我遇见的那个实在粗鄙。他不在乎马好不好，也不在乎车赶得好不好，只想跑得快。我已经尽了力，他还是不满意，总拿鞭子抽我。为了跟上，我才学会一下一下往前蹿。每逢赶集，他总在小酒馆待到很晚，然后一路飞奔回家。
        - id: ch03-b10
          speaker: peggy
          text: 有一晚，天很黑，他又像平常那样赶着我飞奔。忽然，车轮撞上路中间一个又大又沉的东西，轻便马车立刻翻了。他被甩出去，摔断了一条胳膊，我想还断了几根肋骨。反正从那以后，我再也不用跟着他了。我一点也不惋惜。
        - id: ch03-b11
          speaker: peggy
          text: 可只要人非得跑那么快，不管我到了哪里，恐怕都得过一样的日子。我真希望自己的腿能长一点。
          emotion: sad
        - id: ch03-b12
          speaker: narrator
          text: 可怜的佩吉。我很同情她，却没有办法安慰她。我太清楚了，让步子慢的马和快马搭档，慢马要受多大的苦。所有的鞭子都会落在她身上，可她根本改变不了自己的步子。
        - id: ch03-b13
          speaker: narrator
          text: 佩吉常被套上四轮敞篷马车。几位太太很喜欢她，因为她性情温顺。过了一段时间，她被卖给两位自己驾车的太太。她们想要的，正是一匹安全又可靠的好马。
        - id: ch03-b14
          speaker: narrator
          text: 后来，我在乡间见过她好几次。她走得稳稳当当，看起来神采飞扬，心满意足。一匹马能有多快活，她就有多快活。看到她过得这样好，我也很高兴，因为她配得上这样的归宿。
    - id: ch04
      title: 马为什么会受惊
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 佩吉离开以后，另一匹马来顶替她。他还年轻，却已经背上了坏名声。人们说他容易受惊闪躲，还会突然向前猛冲。正因为这样，他丢掉了一个好差事。我问他，究竟为什么总是受惊。
        - id: ch04-b02
          speaker: young_horse
          text: 嗯，我自己也不太清楚。我小时候胆子小，又有好几次被吓得很厉害。那时只要看见陌生的东西，我就会转头看一看。我们戴着眼罩，不回头的话，根本看不清那是什么，也弄不明白。
        - id: ch04-b03
          speaker: young_horse
          text: 可我每次回头，主人都会抽我一鞭。那一下当然会吓得我往前猛冲，却不会让我少害怕一点。我总觉得，他要是肯让我安安静静看清楚，等我知道那东西伤不了我，也就没事了。慢慢地，我自然会习惯。
        - id: ch04-b04
          speaker: young_horse
          text: 有一天，一位老先生和主人一起坐车。一大张白纸，也可能是一块白布，忽然从我身旁吹过去。我吓得向旁边一闪，又往前冲。主人像往常一样，狠狠抽了我一鞭。可那位老先生马上喊了起来。
        - id: ch04-b05
          speaker: old_gentleman
          text: 你这样做不对！马受惊闪躲时，绝不能用鞭子打。他躲，是因为他害怕。你再打他，只会让他更害怕，也会让这个毛病越来越重。
        - id: ch04-b06
          speaker: young_horse
          text: 所以我想，并不是每个人都会那样对马。我敢说，我绝不是为了好玩才故意受惊。可要是人从不许我们慢慢熟悉一样东西，我们怎么分得清什么危险，什么不危险呢？我认识的东西，从来不会叫我害怕。
        - id: ch04-b07
          speaker: young_horse
          text: 我是在一座庄园里长大的，那里养着鹿。所以在我看来，鹿就和绵羊、奶牛一样平常。可别处不常见到鹿。我认识不少很聪明的马，他们一看见鹿照样害怕。要他们从养鹿的围场旁经过，总得先闹出好大一场乱子。
        - id: ch04-b08
          speaker: narrator
          text: 我知道这个伙伴说的都是真话。我只希望，每一匹小马都能遇见格雷农夫和戈登乡绅那样的好主人。
    - id: ch05
      title: 一位真正懂马的车夫
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 当然，我在这里偶尔也会遇到真正会赶车的人。一天早晨，人们把我套上一辆轻便双轮马车，带到普尔特尼街的一所房子前。两位先生从屋里走出来。个子较高的那位绕到我头前，先检查嚼子和笼头，又用手挪了挪颈圈，看看我戴着舒不舒服。
        - id: ch05-b02
          speaker: tall_gentleman
          text: 你觉得这匹马非用大勒衔不可吗？
        - id: ch05-b03
          speaker: hostler
          text: 依我看，不用大勒衔，他也一样走得很好。他的嘴格外灵敏，性子虽然有精神，却一点坏毛病也没有。不过，大多数客人还是喜欢用它。
        - id: ch05-b04
          speaker: tall_gentleman
          text: 我不喜欢。劳驾把它卸下来，把缰绳扣到两边的环上。走远路时，嘴里舒服很要紧。对不对，老伙计？
        - id: ch05-b05
          speaker: narrator
          text: 他说着拍了拍我的脖子，然后接过缰绳，和同伴一起上车。直到今天，我还记得他怎样安安静静地让我转过身，又怎样轻轻带住缰绳，让鞭梢柔和地从我背上拂过。接着，我们便出发了。
        - id: ch05-b06
          speaker: narrator
          text: 我昂起脖颈，用自己最好的步子跑起来。我知道，坐在身后的这个人懂得一匹好马该怎样驾驭。那感觉就像又回到了从前，我也重新快活起来。
        - id: ch05-b07
          speaker: narrator
          text: 这位先生很喜欢我。后来，他又骑着我试了几次，便说服我的主人，把我卖给他的一位朋友。那位朋友想找一匹安全又好骑的坐骑。就这样，那年夏天，我被卖给了巴里先生。
