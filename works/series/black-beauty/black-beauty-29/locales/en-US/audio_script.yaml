  chapters:
    - id: ch01
      title: The Steam-Engine Style
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Then there was what I call the steam-engine style of driving. Most of these drivers came from towns. They had never owned a horse and usually traveled by train. They seemed to imagine that a horse was simply a smaller steam engine. Once they had paid their fare, they expected him to carry any load as far and as fast as they pleased.

            The road might be muddy or dry, rough or smooth, uphill or down. It made no difference to them. The horse must keep going at the same pace, without rest or consideration.
        - id: ch01-b02
          speaker: narrator
          text: >-
            They never thought of getting out and walking up a steep hill. They had paid to ride, so ride they would. In their minds, horses were made to drag people uphill and were used to doing it. Walking themselves seemed like a great joke.

            So they worked the whip, jerked the reins, and scolded us in rough voices.
        - id: ch01-b03
          speaker: rough_driver
          text: >-
            Get moving, you lazy beast!
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: >-
            Then came another cut from the whip. All the while, we were doing our very best without complaint, though we were badly worn down and discouraged.

            Nothing used up a horse faster than that steam-engine driving. I would much rather travel twenty miles with a thoughtful driver than ten with one of those men. The longer journey would take less out of me.
        - id: ch01-b05
          speaker: narrator
          text: >-
            They hardly ever used the brake, no matter how steep the descent, and that could cause terrible accidents. If they did put it on, they often forgot to release it at the bottom. More than once, I pulled halfway up the next hill with one wheel still locked before my driver remembered the brake. That puts a dreadful strain on a horse.

            These town drivers did everything abruptly. Instead of leaving the stable yard at an easy pace, they rushed out at full speed. When they wanted to stop, they whipped us first and then hauled on the reins so sharply that we almost fell back on our haunches and the bit tore at our mouths. They called that stopping with a dash. They took corners just as sharply, as though roads had no right side or wrong side.
    - id: ch02
      title: What Happened to Rory
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            I remember one spring evening when Rory and I were returning from a day out. Rory usually worked beside me whenever a pair was ordered. He was a good, honest horse. Our own driver had been gentle and considerate, so the day had been pleasant.

            Near twilight, we were coming home at a good, quick pace. The road bent sharply left. We were close to the hedge on our own side, with plenty of room for another carriage to pass, so our driver did not pull us in.
        - id: ch02-b02
          speaker: narrator
          text: >-
            As we approached the corner, I heard a horse and a two-wheeled gig racing downhill toward us. The hedge was too high for me to see anything. A moment later, we met head-on.

            Luckily, I was nearest the hedge. Rory was on the left of the pole, with no shaft to shield him. The other driver headed straight into the corner. By the time he saw us, he could not move over to his side of the road.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Rory took the entire blow. The gig shaft drove into his chest, and he staggered backward with a cry I will never forget. The other horse dropped onto his haunches, and one of the shafts broke. The horse and the high-wheeled gig both belonged to our stable. It was the kind of gig the young men loved to drive.

            The man holding the reins was one of those reckless, ignorant fellows who either did not know his side of the road or did not care. Poor Rory stood there with his flesh torn open and blood streaming down. They said that if the shaft had struck a little farther to one side, it would have killed him. For poor Rory, that might have been kinder.
        - id: ch02-b04
          speaker: narrator
          text: >-
            His wound took a long time to heal. Afterward, he was sold to haul coal carts. Only horses know what that work is like on steep hills. I saw things there that still make me sad, especially horses struggling downhill with heavily loaded two-wheeled carts behind them and no brake to hold the weight back.
    - id: ch03
      title: Peggy's Uneven Pace
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            After Rory was injured, I often worked in the carriage with Peggy, the mare in the stall next to mine. She was strong and well made, with a bright dun coat covered in beautiful dapples and a dark-brown mane and tail. She was not finely bred, but she was very pretty, remarkably sweet-tempered, and always willing.

            Still, I could see worry in her eyes, and I knew something troubled her. On our first drive together, I noticed her strange pace. She would half trot and half canter for three or four steps, then make a little jump forward. Pulling beside her was very uncomfortable, and it made me restless.
        - id: ch03-b02
          speaker: narrator
          text: >-
            When we returned to the stable, I asked why she moved in that awkward way.
        - id: ch03-b03
          speaker: peggy
          text: >-
            I know my pace is bad, but what can I do? It truly isn't my fault. My legs are too short. I'm almost as tall as you, but your legs are a good three inches longer above the knee. You can take longer steps and move much faster.

            I didn't make myself. If I had, I would have given myself long legs. My short legs have caused all my trouble.
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: >-
            I could not understand how that had caused such an odd pace. Peggy was strong, good-tempered, and willing, so I asked her to explain.
        - id: ch03-b05
          speaker: peggy
          text: >-
            Men always want to go fast. If a horse can't keep up with the others, she gets the whip again and again. I had to keep pace any way I could, and that's how I learned this ugly shuffle.

            I didn't always move this way. With my first master, I had a good, steady trot. He was a young country clergyman, and he wasn't always rushing. His two churches were far apart, and he had plenty of work, but he never scolded or whipped me for being too slow. He was kind and very fond of me. I wish I were still with him. But he had to move to a large town, and I was sold to a farmer.
        - id: ch03-b06
          speaker: peggy
          text: >-
            Some farmers are excellent masters, but mine was a common sort of man. He cared nothing about good horses or careful driving. He only wanted speed. I went as fast as I could, but it was never enough, and he kept whipping me. So I began springing forward just to keep up.

            On market nights, he stayed at the inn until very late. Then he drove home at a gallop.
        - id: ch03-b07
          speaker: peggy
          text: >-
            One dark night, we were galloping home as usual when the wheel struck something large and heavy in the road. The gig overturned at once. The farmer was thrown out. His arm was broken, and I think some ribs were too.

            Anyway, that ended my time with him, and I wasn't sorry. But it will be the same wherever I go if men insist on such speed. Oh, I wish my legs were longer!
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: >-
            Poor Peggy. I felt deeply sorry for her, but I had no comfort to offer. I knew how hard it was for a slow horse to be paired with a fast one. The slower horse received all the whipping and could do nothing to change it.
    - id: ch04
      title: A Better Home for Peggy
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Peggy often pulled the phaeton. Some of the ladies liked her very much because she was so gentle. After a while, two ladies who drove for themselves bought her. They wanted a good, safe horse.

            I met Peggy several times afterward on country roads. She traveled at a good, steady pace and looked as cheerful and contented as a horse could be. I was very glad. She deserved a good home.
    - id: ch05
      title: Afraid of Strange Things
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            After Peggy left, a young horse took her place. He was known for shying and starting, and that reputation had already cost him a good home. I asked why he shied.
        - id: ch05-b02
          speaker: young_horse
          text: >-
            I'm not quite sure. I was timid when I was young, and several things frightened me badly. Whenever I saw something strange, I would turn and look. With blinkers on, a horse can't see what a thing is or understand it without turning around.

            My master always whipped me for looking. That made me leap forward, but it never made me less afraid. If he had let me stand quietly and see that nothing was going to hurt me, I think I would have been fine. In time, I would have grown used to those things.
        - id: ch05-b03
          speaker: young_horse
          text: >-
            One day, an old gentleman was riding with my master when a large piece of white paper or cloth blew past close beside me. I shied and jumped forward. As usual, my master whipped me hard. But the old gentleman called out to him.
        - id: ch05-b04
          speaker: old_gentleman
          text: >-
            You're handling him the wrong way! Never whip a horse for shying. He shies because he's frightened. Whipping only scares him more and makes the habit worse.
        - id: ch05-b05
          speaker: young_horse
          text: >-
            So I suppose not every man treats a horse that way. I certainly don't shy because I enjoy it. But how can a horse learn what is dangerous and what isn't if no one lets him get used to anything?

            Nothing familiar scares me. I grew up in a park with deer, so I knew them as well as sheep or cows. But deer aren't common everywhere. I know plenty of sensible horses who are frightened by them and make a tremendous fuss before they'll pass a paddock where deer are kept.
        - id: ch05-b06
          speaker: narrator
          text: >-
            I knew he was right. I wished every young horse could have masters as good as Farmer Grey and Squire Gordon.
    - id: ch06
      title: A Driver Who Understood
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Of course, I did sometimes meet good drivers at the livery stable. One morning, I was harnessed to the light gig and taken to a house on Pulteney Street. Two gentlemen came outside. The taller one walked around to my head. He examined my bit and bridle, then moved the collar with his hand to make sure it sat comfortably.
        - id: ch06-b02
          speaker: gentleman
          text: >-
            Do you think this horse needs a curb bit?
        - id: ch06-b03
          speaker: narrator
          text: >-
            He put the question to the hostler.
        - id: ch06-b04
          speaker: hostler
          text: >-
            I'd say he'd go just as well without one, sir. His mouth is unusually good. He has plenty of spirit, but there's no vice in him. Most customers prefer the curb, though.
        - id: ch06-b05
          speaker: gentleman
          text: >-
            I don't. Please remove it and fasten the rein at the cheek instead.
        - id: ch06-b06
          speaker: narrator
          text: >-
            Then he patted my neck and spoke to me.
        - id: ch06-b07
          speaker: gentleman
          text: >-
            A comfortable mouth makes a long journey much easier, doesn't it, old fellow?
        - id: ch06-b08
          speaker: narrator
          text: >-
            He took the reins, and both gentlemen climbed into the gig. He turned me around quietly. Then I felt the lightest touch on the reins and the gentle sweep of the whip across my back, and we were moving.

            I arched my neck and gave him my best pace. At once, I knew the man behind me understood how a good horse should be driven. It felt like old times, and my spirits rose.
        - id: ch06-b09
          speaker: narrator
          text: >-
            The gentleman became very fond of me. After riding me under saddle several times, he persuaded my master to sell me to a friend who wanted a safe, pleasant riding horse.

            And so, that summer, I was sold to Mr. Barry.
