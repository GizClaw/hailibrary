audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    new_master:
      display_name: 新主人
      tts:
        delivery: 爽朗和气，懂马而做事利落
        timbre: 清爽结实
        pace: 明快
        pitch: 中
    polly:
      display_name: 波莉
      tts:
        delivery: 体贴能干，话语温暖自然
        timbre: 柔和明净
        pace: 适中
        pitch: 中
    funeral_driver:
      display_name: 车夫甲
      tts:
        delivery: 随口打趣，语气直率
        timbre: 粗实
        pace: 适中
        pitch: 中低
    jones:
      display_name: 琼斯
      tts:
        delivery: 自以为老练，爱挑毛病
        timbre: 略显干涩
        pace: 适中
        pitch: 中
    cab_governor:
      display_name: 马车行老板
      tts:
        delivery: 隔街招呼般直爽热络
        timbre: 洪亮厚实
        pace: 明快
        pitch: 中低
  chapters:
    - id: ch01
      title: 杰里一家和上尉
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我的新主人叫杰里迈亚·巴克。不过谁都叫他杰里，我也跟着这样叫。妻子波莉跟他再般配不过了。她个子娇小，身材丰润，衣着整洁，做事利落。乌黑的头发梳得平平顺顺，黑眼睛亮亮的，嘴边总带着笑。
        - id: ch01-b02
          speaker: narrator
          text: 儿子哈里十二岁，个子高高的，性情坦率又温和。八岁的多萝西是个小姑娘，大家叫她朵莉。她活脱脱就是小时候的母亲。一家人彼此疼爱，我从前没见过这么幸福快活的一家，后来也再没见过。
        - id: ch01-b03
          speaker: narrator
          text: 杰里自己有一辆出租马车，还有两匹马，全由他亲自赶，亲自照料。另一匹马叫上尉。他身材高大，毛色雪白，骨架也大。虽然已经老了，年轻时一定威风得很。
        - id: ch01-b04
          speaker: narrator
          text: 上尉至今还会骄傲地昂头，弓起脖子。他出身高贵，举止优雅，从头到脚都透着老骏马的气度。他告诉过我，年轻时跟着一位骑兵军官上过克里米亚战场，还常常走在全团前面。他的故事，以后我再讲。
        - id: ch01-b05
          speaker: narrator
          text: 第二天一早，我被刷洗得干干净净。波莉带着朵莉来到院子里看我，想和我交个朋友。哈里天刚亮就帮父亲干活，还说我准是个顶呱呱的好伙计。
        - id: ch01-b06
          speaker: narrator
          text: 波莉拿来一片苹果，朵莉送我一块面包。她们那样疼我，仿佛我就是古时候那匹大名鼎鼎的黑骏马。又有人轻轻爱抚我，温柔地跟我说话，真叫我快活。我也尽量让她们明白，我愿意亲近她们。
        - id: ch01-b07
          speaker: narrator
          text: 波莉觉得我漂亮得很。她说，要不是膝盖受过伤，让我拉出租马车实在可惜。
        - id: ch01-b08
          speaker: new_master
          text: 可没人知道，那伤到底该怪谁。既然弄不清，我就往好处想吧。我骑过那么多马，没见过比他走得更稳、更利落的。还叫他杰克，接着从前那匹马的名字，好不好，波莉？
        - id: ch01-b09
          speaker: polly
          text: 好呀。一个好名字，就该一直传下去。
    - id: ch02
      title: 第一天出车
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那天上午，上尉一直套着车在外面奔忙。哈里放学回来，给我添了饲料和水。下午轮到我出车。杰里检查项圈和辔头合不合适，舒不舒服，仔细得让我想起了约翰·曼利。
        - id: ch02-b02
          speaker: narrator
          text: 他把臀带放长一两个扣眼，整套挽具就都合身了。没有勒住脖子的缰绳，也没有带链条的马嚼子，只有一副普通的环形轻嚼子。这可真是天大的福气！
        - id: ch02-b03
          speaker: narrator
          text: 我们穿过一条支路，来到昨晚杰里跟人道晚安的那个大车站。宽街一边是高楼，店铺门面漂亮得叫人惊叹。另一边是古老的教堂和墓园，四周围着铁栅栏。
        - id: ch02-b04
          speaker: narrator
          text: 栅栏边停着一长排出租马车，都在等乘客。地上散着干草。有些车夫凑在一起聊天，有些坐在车座上看报，还有一两个人正给马喂草、喂水。我们排在最后一辆车的后面。
        - id: ch02-b05
          speaker: narrator
          text: 两三个车夫围过来，把我上上下下看了一遍，又当面议论起来。
        - id: ch02-b06
          speaker: funeral_driver
          text: 这匹马拿去送葬，倒挺合适。
        - id: ch02-b07
          speaker: jones
          text: 他这副模样太漂亮了，反倒靠不住。哪天一大早，你准会发现他有毛病。要不然，我琼斯就改名。
        - id: ch02-b08
          speaker: new_master
          text: 那我就等毛病自己露面，再去认识它吧。真有那么一天，我也好趁现在多快活一阵。
        - id: ch02-b09
          speaker: narrator
          text: 这时来了一个宽脸膛的男人。他穿着灰色厚大衣，披着宽大的灰斗篷，衣服上钉着硕大的白纽扣。灰帽子下面的头发也是灰的，脖子上还松松系着一条蓝围巾。
        - id: ch02-b10
          speaker: narrator
          text: 他看着倒很爽朗，其他车夫也纷纷让路。他像个要买我的人那样，从头到脚仔细打量了一遍。随后哼了一声，挺直了身子。
        - id: ch02-b11
          speaker: cab_governor
          text: 杰里，这匹马跟你正合适。不管花了多少钱，他都值这个价。
        - id: ch02-b12
          speaker: narrator
          text: 就凭这一句话，我在车站上的名声算是定了下来。
        - id: ch02-b13
          speaker: narrator
          text: 那人姓格兰特，大家叫他灰格兰特，也叫格兰特老板。他在这个车站待得最久，遇上事情总由他裁断，碰到争执也由他平息。平日里，他随和又明理。可偶尔喝多了酒，他也会发火。那时没人愿意挨他的拳头太近，因为他一拳真能把人打得够呛。
    - id: ch03
      title: 我和杰里的默契
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 做出租马车马的头一个星期，我过得很辛苦。我从没习惯过伦敦。四周闹哄哄的，人人都在赶路。马匹、大车和各式马车挤满街道，我还得从中穿过去，心里既紧张，又疲惫。
        - id: ch03-b02
          speaker: narrator
          text: 可没过多久，我就知道自己的车夫完全靠得住。心里安定下来，我也渐渐适应了。
        - id: ch03-b03
          speaker: narrator
          text: 杰里是我见过的最出色的车夫之一。更难得的是，他顾惜自己的马，就像顾惜自己。他很快发现，我肯卖力气，也总想把事情做好。所以，他从来不用鞭子抽我。
        - id: ch03-b04
          speaker: narrator
          text: 要我起步时，他至多拿鞭梢在我背上轻轻一带。其实，他只要把缰绳往手里一收，我多半就明白了。他的鞭子插在身边的时候，总比握在手里的时候多。
        - id: ch03-b05
          speaker: narrator
          text: 很快，我和主人便有了默契。马和人之间能有多么相知，我们就有多么相知。在马厩里，杰里也想尽办法让我们舒服。
        - id: ch03-b06
          speaker: narrator
          text: 马栏是旧式的，地面斜得太厉害。不过，他在每间马栏后面装了两根活动横杆。到了夜里，或是我们休息时，他会解下笼头，再把横杆拦好。这样我们就能转身，想朝哪边站就朝哪边站，舒服多了。
    - id: ch04
      title: 水、食物和星期日
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 杰里总把我们刷洗得干干净净，也尽量换着花样喂食，而且每次都给得足足的。他还让我们一直有清洁的新鲜水喝。只有刚跑得浑身发热时，水盆才不会放在身边。其余时候，不论白天还是夜里，我们想喝就能喝。
        - id: ch04-b02
          speaker: narrator
          text: 有些人说，不能让马想喝多少就喝多少。可按我知道的情形，只要随时有水，我们每次只会喝一点。这样对身体更好。要是一直没有水，非等到渴得难受才喝，我们就会一口气吞下半桶。
        - id: ch04-b03
          speaker: narrator
          text: 有些马夫只顾回家喝啤酒，把马丢下好几个钟头。马儿面前只有干草和燕麦，连一口润食物的水也没有。后来见到水，自然一下喝得太猛。这样会伤了呼吸，有时还会让肚子受凉。
        - id: ch04-b04
          speaker: narrator
          text: 不过，在这个家里最叫我们享福的，是星期日可以休息。平日的活儿那么重，要没有这一天，我想我们根本撑不下去。而且到了星期日，我们也终于有工夫彼此作伴。
        - id: ch04-b05
          speaker: narrator
          text: 上尉的身世，就是在这些星期日里讲给我听的。
