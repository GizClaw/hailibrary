  chapters:
    - id: ch01
      title: A London Cab Horse
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            My new master's name was Jeremiah Barker. Everyone called him Jerry, so I will too. His wife, Polly, was as good a match as any man could want. She was plump, neat, and tidy, with smooth dark hair, dark eyes, and a merry little mouth. Their son Harry was twelve, tall, openhearted, and good-tempered. Little Dorothy, or Dolly, was eight and looked just like her mother.

            They were wonderfully fond of one another. Never before or since have I known such a happy, cheerful family. Jerry owned his cab and cared for both of his horses himself.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The other horse was Captain, a tall white horse with a large, bony frame. He was old now, but he must have been splendid when he was young. He still held his head proudly and arched his neck. Everything about him showed that he was noble, well-bred, and beautifully mannered.

            Captain told me that when he was young, he had gone to the Crimean War. He belonged to a cavalry officer and used to lead the regiment. I will tell you more about that later.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The next morning, after I had been carefully groomed, Polly and Dolly came into the yard to meet me. Harry had helped his father since early morning, and he had already decided I would turn out to be a first-rate horse.

            Polly brought me a slice of apple, and Dolly brought a piece of bread. They fussed over me as if I were the famous Black Beauty from long ago. It had been a long time since anyone had petted me and spoken to me in such a gentle voice. What a wonderful treat it was. I could not speak to them, but I did everything I could to show that I wanted to be friends.

            Polly said I was very handsome and much too good for cab work, except for my broken knees.
        - id: ch01-b04
          speaker: gray_eyed_man
          text: >-
            There's no one here who can tell us whose fault those knees were. Until I know, I'll give him the benefit of the doubt. I've never ridden a horse with a firmer, cleaner step. Why don't we call him Jack, after the old one, Polly?
        - id: ch01-b05
          speaker: polly
          text: >-
            Yes, let's do that. I like keeping a good name alive.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Captain pulled the cab all morning. After school, Harry came in to feed me and give me water. Then, that afternoon, it was my turn to be put into the cab.

            Jerry checked my collar and bridle with as much care as John Manly ever had. Once he loosened the crupper by a hole or two, everything fit well. There was no check-rein and no curb, only a plain ring snaffle. What a blessing!
        - id: ch01-b07
          speaker: narrator
          text: >-
            We drove through the side street and reached the large cab stand where Jerry had called good night the evening before. Tall houses with wonderful shop windows lined one side of the broad street. Across from them stood an old church and churchyard behind iron railings.

            Cabs waited in a row beside those rails. Bits of hay lay scattered on the ground. Some drivers stood talking, some sat on their boxes reading newspapers, and one or two gave their horses hay and water. We took our place at the very back. Two or three men gathered around me and began giving their opinions.
        - id: ch01-b08
          speaker: cabman
          text: >-
            He'd do very well for a funeral.
        - id: ch01-b09
          speaker: jones
          text: >-
            He looks too smart. One fine morning, you'll discover something wrong with him. If you don't, my name isn't Jones.
        - id: ch01-b10
          speaker: gray_eyed_man
          text: >-
            Well, I don't have to discover it before it shows itself, do I? Until then, I'll keep my spirits up.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Then a broad-faced man walked up. He wore a large gray coat with a gray cape and big white buttons. His hat was gray, his hair was gray, and a blue scarf hung loosely around his neck. For all that gray, he looked like a cheerful fellow. The other men moved aside and let him through.

            He examined me all over as if he meant to buy me. Then he straightened up with a grunt.
        - id: ch01-b12
          speaker: governor
          text: >-
            He's exactly the right sort for you, Jerry. I don't care what you paid. He'll be worth it.
        - id: ch01-b13
          speaker: narrator
          text: >-
            And just like that, my reputation at the stand was settled.

            The man's name was Grant, though people called him Gray Grant or Governor Grant. He had worked at that stand longer than any of the others, and he took it upon himself to settle problems and stop arguments. Most of the time, he was sensible and good-natured. But when drink put him in a temper, no one wanted to get near his fist. He could strike a very heavy blow.
        - id: ch01-b14
          speaker: narrator
          text: >-
            My first week as a cab horse was hard. I was not used to London. The noise, the rush, and the crowds of horses, carts, and carriages made me anxious as I tried to find my way through them. But I soon learned that I could trust my driver completely. Then I relaxed and grew used to the work.

            Jerry was one of the best drivers I had ever known. Better still, he cared as much about his horses as he did about himself. He quickly saw that I was willing to work and always tried my best. He never used the whip on me except to draw its tip gently across my back when it was time to move. Usually, I could tell from the way he picked up the reins. I think his whip spent far more time tucked beside him than held in his hand.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Before long, my master and I understood each other as well as a horse and man can. He also did everything he could to make us comfortable in the stable.

            Our old-fashioned stalls sloped too steeply. So Jerry put two movable bars across the back. At night, or whenever we rested, he took off our halters and set the bars in place. That let us turn around and stand in whichever direction we liked, and it was a great comfort.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Jerry kept us very clean. He gave us as much variety in our food as he could, and always gave us plenty. We also had clean, fresh water beside us day and night, except when we came in hot.

            Some people say horses should not drink as much as they want. But when water is always there, we take only a little at a time, and that does us much more good. Leave us thirsty and miserable, and we may swallow half a bucket at once. Some grooms go off for their beer and leave horses for hours with dry hay and oats and nothing to moisten them. Of course those horses gulp down too much when water finally comes. That can harm their breathing and sometimes chill their stomachs.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Best of all were our Sundays of rest. We worked so hard all week that I do not think we could have kept going without that one day. Sundays also gave us time to enjoy each other's company.

            That was when I learned Captain's story.
