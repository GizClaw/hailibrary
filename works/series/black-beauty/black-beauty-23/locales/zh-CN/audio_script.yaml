audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    york:
      display_name: 约克
      tts:
        delivery: 干练威严，对上恭敬，对马务实
        timbre: 结实清晰
        pace: 稳健
        pitch: 中低
    lady:
      display_name: 伯爵夫人
      tts:
        delivery: 冷傲强势，命令简短而不容置疑
        timbre: 清亮偏冷
        pace: 稍慢
        pitch: 中高
    max:
      display_name: 麦克斯
      tts:
        delivery: 饱经磨损而清醒，说起残酷现实直白克制
        timbre: 沉厚略显疲惫
        pace: 从容
        pitch: 中低
    gentleman:
      display_name: 一位先生
      tts:
        delivery: 出于不解而发问，语气自然直接
        timbre: 清晰平和
        pace: 适中
        pitch: 中
    onlooker:
      display_name: 看客
      tts:
        delivery: 只看外表，赞叹中带着不知情的兴奋
        timbre: 明快响亮
        pace: 适中
        pitch: 中
    dealer:
      display_name: 马贩子
      tts:
        delivery: 精于买卖，把残酷行规说得轻描淡写
        timbre: 干涩利落
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 姜饼的反抗
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有一天，夫人比平常晚些下楼。她走来时，丝裙窸窣作响，声音比以往更响。
        - id: ch01-b02
          speaker: lady
          text: 去B公爵夫人府上。约克，你到底还要不要把他们的头勒起来？马上勒高。别再由着这两匹马，做这种荒唐事！
        - id: ch01-b03
          speaker: narrator
          text: 马夫守在姜饼头前，约克先走到我身边。他把我的头往后一扳，再收紧缰绳，紧得叫我几乎受不了。接着，他走向姜饼。她已经不耐烦了，正顶着口衔铁，猛地上下甩头。近来她总是这样。
        - id: ch01-b04
          speaker: narrator
          text: 姜饼知道他要做什么。约克才把缰绳从缰环上解下来，准备收短，她便猛地扬起前蹄。约克鼻子上重重挨了一下，帽子也飞了出去。马夫险些被掀翻。
        - id: ch01-b05
          speaker: narrator
          text: 两个人赶紧扑到她头前。可他们制不住她。姜饼拼命冲撞，一次次腾起身子，又不停尥蹶子。最后，她一条后腿踢过车辕，整匹马摔倒了。倒下之前，她还狠狠踢中我左边的后臀。
        - id: ch01-b06
          speaker: narrator
          text: 约克立刻整个人坐到她头上，不许她挣扎。若不是这样，谁也不知道她还会闯出什么祸。他一边压住姜饼，一边大声叫人。
        - id: ch01-b07
          speaker: york
          text: 快解开黑马！去拿绞盘，把车辕卸下来！要是挽绳解不开，谁来从这里把它割断！
        - id: ch01-b08
          speaker: narrator
          text: 一个男仆跑去拿绞盘，另一个从宅子里取来刀。马夫很快把我从姜饼和马车旁解开，牵回马栏。他什么也顾不上卸，只把我领进去，转身又跑去帮约克。
        - id: ch01-b09
          speaker: narrator
          text: 方才的乱子让我浑身激动。假如我从前踢过人，或是扬起前蹄反抗，那一刻一定也会发作。可我从没那样做过，只能站着生气。我的腿疼得厉害，头还被缰绳吊在鞍上的缰环边，怎么也低不下来。我难受极了，甚至想踢第一个靠近我的人。
    - id: ch02
      title: 事后
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 没过多久，两个马夫把姜饼牵了进来。她身上撞伤了许多地方，到处青肿。约克跟着进来，先把事情吩咐好，才来查看我。他马上松开缰绳，让我终于能低下头。
        - id: ch02-b02
          speaker: york
          text: 这些该死的仰头缰！我早知道快要出事了。伯爵大人准会气坏。可连她丈夫都管不住她，一个仆人又能怎么办？这事我不管了。她去不成公爵夫人的花园宴会，也怪不到我头上。
        - id: ch02-b03
          speaker: narrator
          text: 约克只敢自言自语。别人在场时，他说话一向恭恭敬敬。他把我全身摸了一遍，很快发现飞节上方挨踢的地方。那里又肿又痛。他叫人先用热水敷洗，再涂上药水。
        - id: ch02-b04
          speaker: narrator
          text: W伯爵听说以后十分恼火，怪约克太迁就夫人。约克回答，往后他宁愿只听伯爵一人的命令。可我想，这番话没有起什么作用，后来还是一切照旧。我总觉得，约克本来可以更坚决地替他的马说话。不过，也许这事不该由我评判。
        - id: ch02-b05
          speaker: narrator
          text: 姜饼从此再没被套上马车。等她养好伤，伯爵的一个小儿子想要她，还认定她会成为一匹出色的猎马。
    - id: ch03
      title: 麦克斯的话
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我却仍得拉车，只是身边换了一匹叫麦克斯的马。他一直戴着勒紧的仰头缰，早已习惯。我问他，究竟是怎么忍下来的。
        - id: ch03-b02
          speaker: max
          text: 我非忍不可，只能受着。可这东西正在一点点折损我的寿命。你要是一直戴下去，也会被它折寿。
        - id: ch03-b03
          speaker: narrator
          text: 我又问，主人们知不知道，我们戴着它有多难受。
        - id: ch03-b04
          speaker: max
          text: 这我说不准。不过马贩子和马医全都明白。我从前待过一家马行。那里的马贩子训练我和另一匹马，要把我们配成一对。他每天都收一点缰绳，让我们的头一天比一天高。
        - id: ch03-b05
          speaker: max
          text: 当时有位先生在旁边看着。
        - id: ch03-b06
          speaker: gentleman
          text: 你为什么非要这样做？
        - id: ch03-b07
          speaker: dealer
          text: 不这样做，客人就不肯买。伦敦人都喜欢马高高昂着头，腿也抬得高。当然，这对马很不好，可对生意有好处。马很快就会累垮，或是得病，客人自然会再来买一对。
        - id: ch03-b08
          speaker: max
          text: 他就是这么说的，我亲耳听得清清楚楚。到底是怎么回事，你自己判断吧。
    - id: ch04
      title: 没有朋友
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我在夫人的马车前整整熬了四个月。那条缰绳带来的苦，很难用话说清。我敢肯定，要是再熬久一点，我的身体或是性情，总有一样会被毁掉。
        - id: ch04-b02
          speaker: narrator
          text: 从前，我根本不知道嘴里冒白沫是什么滋味。现在，尖利的口衔铁总压着我的舌头和下颌，头和喉咙又被迫保持着别扭的姿势，嘴边便常常泛起白沫，只是多少不同罢了。
        - id: ch04-b03
          speaker: narrator
          text: 有些人看见了，还觉得十分威风。
        - id: ch04-b04
          speaker: onlooker
          text: 瞧啊，这些马多有精神！
        - id: ch04-b05
          speaker: narrator
          text: 可马口吐白沫，就和人口吐白沫一样反常。那明明表示身体不舒服，应该引起注意。缰绳还压着我的气管，常常让我连呼吸都觉得难受。
        - id: ch04-b06
          speaker: narrator
          text: 每次干完活回来，我的脖颈和胸口都被扯得疼痛，嘴巴和舌头也又痛又嫩。我累得浑身无力，心情也低落下来。
        - id: ch04-b07
          speaker: narrator
          text: 在从前的家，我一直知道约翰和主人都是我的朋友。可在这里，虽然不少地方还算善待我，我却没有一个朋友。
        - id: ch04-b08
          speaker: narrator
          text: 约克本来该知道，那条缰绳是怎么折磨我的。说不定他其实知道，只是觉得事情本来如此，谁也没有办法。总之，没有一个人为我做过什么，也没有人替我减轻痛苦。
