  chapters:
    - id: ch01
      title: A Strike for Liberty
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One day, my lady came down later than usual. Her silk rustled more loudly than ever.
        - id: ch01-b02
          speaker: lady_w
          text: >-
            Take me to the Duchess of B----'s. And York, are you ever going to hold those horses' heads up properly? Tighten the reins now. I've had enough of this foolish coddling.
        - id: ch01-b03
          speaker: narrator
          text: >-
            York came to me first while the groom held Ginger. He pulled my head back and fastened the rein so tightly that I could hardly bear it. Then he went to Ginger. By now, she had taken to jerking her head up and down against the bit, and she was doing it impatiently. She seemed to know exactly what was coming.

            The instant York slipped her rein off the terret to shorten it, Ginger seized her chance. She reared so suddenly that her head struck York hard on the nose and knocked off his hat. The groom was almost thrown from his feet.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Both men rushed at once to her head, but Ginger was too much for them. She plunged, reared, and kicked with desperate force. At last, she kicked clear over the carriage pole and fell. As she went down, she struck me hard on my left hindquarter.

            No one could tell what more she might have done if York had not quickly sat flat on her head to stop her from struggling. From there, he shouted orders.
        - id: ch01-b05
          speaker: york
          text: >-
            Unbuckle the black horse! Hurry, get the winch and unscrew the carriage pole! If you can't unhitch that trace, somebody cut it!
        - id: ch01-b06
          speaker: narrator
          text: >-
            One footman ran for the winch, and another brought a knife from the house. The groom quickly freed me from Ginger and the carriage, then led me to my stall. He turned me loose just as I was and ran straight back to York.

            The whole accident had badly shaken me. If I had ever learned to kick or rear, I believe I would have done it then. But I never had. So I stood there, angry and miserable, with a sore leg and my head still pulled up to the terret on my saddle. I had no way to lower it. I felt ready to kick the first person who came near me.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Before long, two grooms brought Ginger in. She had been knocked about and was badly bruised. York came in with her, gave the men their orders, and then walked over to examine me. The moment he saw me, he lowered my head.
        - id: ch01-b08
          speaker: york
          text: >-
            Curse these checkreins. I knew we'd have an accident before long. His lordship will be furious. But if a husband can't control his own wife, a servant certainly can't. I'm done taking responsibility for it. If she misses the duchess's garden party, that's not my fault.
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: >-
            York said this only to himself. He never spoke that way when the other men could hear him. In front of them, he was always respectful.

            He felt me all over and soon found the place above my hock where Ginger had kicked me. It was swollen and painful. He ordered the men to bathe it with hot water, and afterward they put lotion on it.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Lord W---- was very upset when he heard what had happened. He blamed York for giving in to my lady. York answered that from then on, he would much rather take orders from his lordship alone. Still, I don't think anything came of it. Everything continued just as before.

            I thought York might have defended his horses more firmly, though perhaps I wasn't the one to judge him.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Ginger was never harnessed to the carriage again. Once her bruises healed, one of Lord W----'s younger sons asked to have her. He felt sure she would make a good hunter.

            I still had to pull the carriage. They gave me a new partner named Max, who had always worked in a tight rein. I asked him how he managed to stand it.
        - id: ch01-b12
          speaker: max
          text: >-
            I stand it because I have no choice. But it's cutting my life short. If you have to keep wearing it, it'll shorten yours too.
        - id: ch01-b13
          speaker: narrator
          text: >-
            I asked whether he thought our masters understood how much the rein hurt us.
        - id: ch01-b14
          speaker: max
          text: >-
            I don't know. The horse dealers and veterinarians certainly understand. I once belonged to a dealer who was training another horse and me to work as a pair. Every day, he pulled our heads a little higher. That was how he described it, anyway.

            One day, a gentleman who was there asked him why he did it.
        - id: ch01-b15
          speaker: gentleman
          text: >-
            Why do you keep raising their heads like that?
        - id: ch01-b16
          speaker: dealer
          text: >-
            Because no one will buy them if I don't. People in London want carriage horses with high heads and high steps. Naturally, it's terrible for the horses, but it's excellent for business. They wear out fast or become sick, and then their owners come back to buy another pair.
        - id: ch01-b17
          speaker: max
          text: >-
            I heard him say every word of that. You can decide for yourself what it means.
        - id: ch01-b18
          speaker: narrator
          text: >-
            For four long months, I suffered under that tight rein in my lady's carriage. It is hard to put the misery of it into words. I know that if it had gone on much longer, either my health or my temper would have broken down.

            Before then, I had never foamed at the mouth. Now the sharp bit pressed against my tongue and jaw while the rein forced my head and throat into that cramped position. It made me froth at the mouth every time, at least a little.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Some people thought that sight was splendid. They would call us wonderfully spirited animals. But foaming at the mouth is no more natural for a horse than it is for a person. It is a sure sign that something is wrong, and people ought to pay attention to it.

            The rein also pressed against my windpipe, so breathing was often difficult. After work, my neck and chest ached from the strain. My mouth and tongue were sore, and I came home exhausted and miserable.
        - id: ch01-b20
          speaker: narrator
          text: >-
            At my old home, I always knew that John and my master were my friends. Here, I was treated well in many ways, but I had no friend.

            York could have known how badly that rein tormented me, and he probably did. I suppose he accepted it as something that could not be changed. Whatever the reason, no one did anything to ease my suffering.
