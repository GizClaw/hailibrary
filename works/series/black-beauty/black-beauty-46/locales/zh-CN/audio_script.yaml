audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    jakes:
      display_name: 杰克斯
      tts:
        delivery: 粗声直气，起初急躁强硬，后来流露出朴实和一点惭愧
        timbre: 粗厚结实
        pace: 适中偏快
        pitch: 中低
    foreman:
      display_name: 管事
      tts:
        delivery: 催促强硬，只顾把生意尽快办完
        timbre: 干硬响亮
        pace: 偏快
        pitch: 中
    lady:
      display_name: 一位女士
      tts:
        delivery: 温柔恳切，劝说时从容坚定而不盛气凌人
        timbre: 清澈柔和
        pace: 舒缓清楚
        pitch: 中
  chapters:
    - id: ch01
      title: 沉重的货车
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            杰里认识一个兼做粮食生意的面包师，后来，我被卖给了这个人。杰里觉得，我在那里会有好饲料，干的活儿也不会太重。饲料这件事，他确实说对了。要是主人总在店里，我想他们也不会让我拉得过重。可店里有个管事，整天催这个赶那个。车已经装得很满了，他还常常叫人再添东西。
        - id: ch01-b02
          speaker: narrator
          text: >-
            我的车夫叫杰克斯。他常对管事说，这些货已经超过了我该拉的分量，可管事从来不听。
        - id: ch01-b03
          speaker: foreman
          text: 一趟能运完，何必跑两趟？生意就得赶紧往前做。
        - id: ch01-b04
          speaker: narrator
          text: >-
            杰克斯也和别的车夫一样，总把我的勒颈革带收得高高的。头被吊住，我就很难使力。到了那里三四个月以后，这份活儿已经把我的体力消耗得很厉害。
        - id: ch01-b05
          speaker: narrator
          text: >-
            有一天，车上的货比平时更多，途中还有一段陡坡。我使尽力气，还是拉不上去，只能走走停停。杰克斯恼了，举起鞭子狠狠抽我。
        - id: ch01-b06
          speaker: jakes
          text: 快走，你这懒东西！再不走，我就叫你好看。
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: >-
            我重新拖起那辆重车，拼命往前挪了几码。鞭子又落下来，我只得再次向前挣扎。粗大的车鞭抽在身上，痛得钻心，可心里的痛一点也不比两肋轻。我已经尽了全力，却还要受罚挨骂，那滋味几乎把我的心气全打掉了。杰克斯第三次狠命抽我时，一位女士快步走来。她的声音温柔，却十分恳切。
        - id: ch01-b08
          speaker: lady
          text: >-
            请别再打这匹好马了！路这么陡，他一定已经使出了全部力气。他真的尽力了。
        - id: ch01-b09
          speaker: jakes
          text: 太太，要是尽了全力还拉不上去，他就得再多使点力。我只知道这个。
        - id: ch01-b10
          speaker: lady
          text: 可这车货是不是太重了？
        - id: ch01-b11
          speaker: jakes
          text: >-
            是，确实太重了。可这不是我的错。临出发的时候，管事硬叫人再装三英担，好给自己省事。我也只能想法子把车赶过去。
        - id: ch01-b12
          speaker: narrator
          text: 杰克斯说完，又把鞭子举了起来。女士赶紧拦住他。
        - id: ch01-b13
          speaker: lady
          text: 请等一等。你要是肯让我试试，我想我能帮你。
        - id: ch01-b14
          speaker: narrator
          text: 杰克斯笑了。女士接着劝他。
        - id: ch01-b15
          speaker: lady
          text: >-
            你没有给他好好出力的机会。勒颈革带把他的头紧紧吊住，他怎么能使出全身的力量呢？把革带解开吧，他一定会拉得更好。请你试一试，你若肯试，我会很高兴的。
        - id: ch01-b16
          speaker: jakes
          text: 好吧，好吧。只要能让女士高兴，当然可以。太太，您想把革带放低多少？
        - id: ch01-b17
          speaker: lady
          text: 全放下来，让他的头完全自由。
    - id: ch02
      title: 给我一个机会
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            革带一解开，我马上把头低到膝盖边。真是舒服极了！我又上下甩了好几次头，好让脖子上那股又痛又僵的劲儿散开。
        - id: ch02-b02
          speaker: lady
          text: >-
            可怜的家伙，原来你需要的是这个。现在，请你好声好气地跟他说话，再牵着他往前走。我相信他能拉得更好。
        - id: ch02-b03
          speaker: narrator
          text: 女士一边说，一边用温柔的手轻轻拍我、抚摸我。杰克斯拿起缰绳。
        - id: ch02-b04
          speaker: jakes
          text: 来吧，小黑。
        - id: ch02-b05
          speaker: narrator
          text: >-
            我低下头，把全身的重量都压到颈圈上，没有留下一丝力气。货车动了。我稳稳地把它拉上坡顶，这才停住喘气。女士一直沿着人行道往上走，这时又穿过道路来到我身旁。她抚摸着我的脖颈，轻轻拍了又拍。我已经很久没有受过这样的抚慰了。
        - id: ch02-b06
          speaker: lady
          text: >-
            你看，只要给他机会，他很愿意出力。这匹马的性情一定很好，以前大概也过过更好的日子。你不会再把革带扣回去吧？
        - id: ch02-b07
          speaker: narrator
          text: 她会这样问，是因为杰克斯正准备照原来的样子，把革带重新挂起来。
        - id: ch02-b08
          speaker: jakes
          text: >-
            太太，我得承认，让他的头能自由活动，确实帮他上了这道坡。下次我会记住，也谢谢您。可我要是不用勒颈革带，别的车夫准会笑话我。您知道，大家都这么赶车。
        - id: ch02-b09
          speaker: lady
          text: >-
            与其跟着坏风气走，为什么不带头兴一个好风气呢？现在已有许多绅士不用勒颈革带了。我们家的马车马十五年没戴过它，干活时比那些戴着的马轻松得多。
        - id: ch02-b10
          speaker: lady
          text: >-
            而且，没有充分的理由，我们无权让上帝创造的任何生灵受苦。人们说它们是不会说话的牲畜，它们的确不能告诉我们自己有什么感受。可它们没有言语，不等于它们受的痛苦更少。
        - id: ch02-b11
          speaker: lady
          text: >-
            好了，我不能再耽搁你。谢谢你肯在这匹好马身上试我的办法。你一定会发现，这比鞭打管用得多。再见。
        - id: ch02-b12
          speaker: narrator
          text: 女士又轻轻拍了拍我的脖颈，迈着轻快的步子穿过小路。从此，我再也没有见过她。
    - id: ch03
      title: 黑暗的马房
      blocks:
        - id: ch03-b01
          speaker: jakes
          text: >-
            我敢说，那才是真正的女士。她对我那么客气，简直把我当成了绅士。往后上坡的时候，我至少要试试她的办法。
        - id: ch03-b02
          speaker: narrator
          text: >-
            杰克斯是自言自语，不过凭良心说，他后来确实把我的革带放松了好几个扣眼。每次上坡，他也总肯让我自由低头。可那些沉重的货物，还是一车接着一车。
        - id: ch03-b03
          speaker: narrator
          text: >-
            活儿再重，只要饲料好，休息也足，体力还维持得住。可世上没有一匹马能长久承受超载。我被这样的重活拖垮了，主人便买来一匹年轻马替换我。
        - id: ch03-b04
          speaker: narrator
          text: >-
            那段日子，还有另一件事让我吃了不少苦。我曾听别的马说起这种祸害，自己却没有经历过，那就是光线昏暗的马房。马房尽头只有一扇很小的窗，里面的马栏几乎总是一片漆黑。
        - id: ch03-b05
          speaker: narrator
          text: >-
            这种黑暗让我心情低落，也大大损伤了视力。每次有人突然把我从黑暗中牵到耀眼的日光下，我的眼睛都疼得厉害。好几回，我被门槛绊得踉踉跄跄，几乎看不清要往哪里走。
        - id: ch03-b06
          speaker: narrator
          text: >-
            要是继续在那里待下去，我相信自己一定会变得半瞎。那可是极大的不幸。我听人说，一匹完全失明的马，反倒比视力模糊的马拉车更安全，因为看不真切往往会使马非常胆怯。好在我逃过了这一劫，视力没有留下永久的损伤。后来，我被卖给了一个拥有许多出租马车的车行老板。
