audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    jakes:
      display_name: Jakes
      tts:
        delivery: practical, hurried, and somewhat rough
        timbre: sturdy and worn
        pace: moderate
        pitch: medium-low
    lady:
      display_name: The Lady
      tts:
        delivery: compassionate, earnest, and persuasive
        timbre: gentle and clear
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Too Much to Pull
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I was sold to a corn dealer and baker Jerry knew. Jerry believed I would be fed well and given fair work there. He was right about the food. And if my master had always been around, I don't think anyone would have loaded me too heavily. But the foreman was always rushing everyone along. Even when my cart was full, he often ordered the men to put on something more.
        - id: ch01-b02
          speaker: narrator
          text: >-
            My carter was named Jakes. He often told the foreman that the load was more than I should have to pull. The foreman always had his way. He said there was no point making two trips when one would do, and he wanted the work moved along.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Like the other carters, Jakes always kept my check-rein pulled up. With my head held there, I couldn't put my strength into the work properly. After three or four months, I could feel how much the strain was wearing me down.
    - id: ch02
      title: On the Steep Hill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            One day, the cart was loaded more heavily than usual, and part of our road climbed a steep hill. I pulled with all the strength I had, but I couldn't keep the cart moving. Again and again, I had to stop. Jakes grew impatient and struck me hard with his whip.
        - id: ch02-b02
          speaker: jakes
          emotion: angry
          text: >-
            Move on, you lazy horse, or I'll give you something to move for!
        - id: ch02-b03
          speaker: narrator
          text: >-
            I started the heavy load again and fought my way forward for a few yards. The whip fell again, and once more I struggled on. That great cart whip cut sharply into my sides. But the unfairness hurt me just as badly. I was already doing everything I could. Being beaten and called lazy for it took the heart out of me.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Jakes was whipping me cruelly for the third time when a lady hurried up to him. Her voice was gentle, but very earnest.
        - id: ch02-b05
          speaker: lady
          text: >-
            Oh, please don't whip your good horse again. The hill is terribly steep, and I'm certain he's pulling as hard as he can. He really is doing his best.
        - id: ch02-b06
          speaker: jakes
          text: >-
            If his best won't take this load up, ma'am, then he'll have to do better than his best. That's all I can tell you.
        - id: ch02-b07
          speaker: lady
          text: >-
            But isn't the cart much too heavy?
        - id: ch02-b08
          speaker: jakes
          text: >-
            Yes, it is too heavy. But that isn't my doing. Just as we were leaving, the foreman made us add another three hundredweight so he wouldn't have to bother with it later. Now I have to get the load through somehow.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Jakes lifted the whip again.
        - id: ch02-b10
          speaker: lady
          text: >-
            Please wait. If you'll allow me, I think I can help you.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Jakes laughed.
        - id: ch02-b12
          speaker: lady
          text: >-
            Look at the way his head is pulled back by that check-rein. He can't use his full strength like that. Take it off and give him a fair chance. I'm sure he'll pull better. Please, just try it. I'd be so glad if you would.
        - id: ch02-b13
          speaker: jakes
          text: >-
            Well, of course I'll try it if it pleases a lady. How far down do you want the rein, ma'am?
        - id: ch02-b14
          speaker: lady
          text: >-
            All the way down. Let him have his head completely.
    - id: ch03
      title: A Fair Chance
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Jakes took off the check-rein. At once, I lowered my head nearly to my knees. What a relief that was! Then I tossed it up and down several times, trying to work the painful stiffness out of my neck.
        - id: ch03-b02
          speaker: lady
          text: >-
            Poor fellow. That's what you needed.
        - id: ch03-b03
          speaker: narrator
          text: >-
            She stroked and patted me with a gentle hand.
        - id: ch03-b04
          speaker: lady
          text: >-
            Now speak kindly to him and lead him forward. I believe he'll manage much better.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Jakes took hold of the rein.
        - id: ch03-b06
          speaker: jakes
          text: >-
            Come on, Blackie.
        - id: ch03-b07
          speaker: narrator
          text: >-
            I lowered my head and leaned my whole weight into the collar. I held nothing back. The cart began to move, and I pulled it steadily all the way up the hill. At the top, I stopped to catch my breath.
        - id: ch03-b08
          speaker: narrator
          text: >-
            The lady had followed us along the footpath. Now she crossed into the road and stroked my neck. No one had patted me that way for a very long time.
        - id: ch03-b09
          speaker: lady
          text: >-
            You see? He was perfectly willing once you gave him a chance. I'm sure he has a fine temper, and I expect he's known better days. You won't fasten that rein up again, will you?
        - id: ch03-b10
          speaker: narrator
          text: >-
            Jakes had already started to hitch it back in its old position.
        - id: ch03-b11
          speaker: jakes
          text: >-
            I can't deny that letting him move his head got us up the hill. I'll remember that next time, and thank you, ma'am. But if I drove without a check-rein, all the other carters would laugh at me. It's the fashion, you see.
        - id: ch03-b12
          speaker: lady
          text: >-
            Wouldn't you rather set a good fashion than follow a bad one? Many gentlemen have stopped using check-reins. Our carriage horses haven't worn them for fifteen years, and they can work with far less strain than horses that do.
        - id: ch03-b13
          speaker: narrator
          text: >-
            Her voice became very serious.
        - id: ch03-b14
          speaker: lady
          text: >-
            Besides, we have no right to make any of God's creatures suffer without a very good reason. We call animals dumb because they can't tell us what they feel. But having no words doesn't make their pain any less. I must let you go now. Thank you for trying my plan with your good horse. I believe you'll find kindness works much better than the whip. Good day.
        - id: ch03-b15
          speaker: narrator
          text: >-
            She gave my neck one more soft pat, stepped lightly across the path, and disappeared from my life.
        - id: ch03-b16
          speaker: jakes
          text: >-
            Now, that was a true lady. She talked to me as politely as if I'd been a gentleman. I'll try her way on the hills, at least.
        - id: ch03-b17
          speaker: narrator
          text: >-
            And to be fair to Jakes, he did loosen my rein by several holes. From then on, whenever we went uphill, he let me lower my head.
    - id: ch04
      title: The Dark Stable
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            But the heavy loads did not stop. Good food and enough rest can keep a horse strong through a full day's work. No horse, though, can keep going under too much weight. The constant overloading wore me down so completely that my owner bought a younger horse to take my place.
        - id: ch04-b02
          speaker: narrator
          text: >-
            There was another hardship at that place that I should mention. I had heard other horses talk about it, but I had never suffered it myself. The stable was badly lit. It had only one tiny window at the far end, so the stalls were almost completely dark.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Living in that darkness lowered my spirits, and it also weakened my sight. Whenever I was led straight from the stable into the glare of daylight, my eyes hurt badly. More than once, I stumbled over the threshold because I could hardly see where I was going.
        - id: ch04-b04
          speaker: narrator
          text: >-
            If I had stayed much longer, I believe my sight would have remained partly damaged. That would have been a terrible misfortune. I had heard men say that a completely blind horse was safer to drive than one who could see only imperfectly, because uncertain sight usually made a horse very timid.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Fortunately, I got away without any lasting injury to my eyes. I was sold again, this time to the owner of a large cab business.
