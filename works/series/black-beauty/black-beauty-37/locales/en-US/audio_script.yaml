  chapters:
    - id: ch01
      title: It All Came Right
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Two or three weeks later, we came into the yard late one evening. Polly ran across the road carrying the lantern, as she always did when the weather wasn't too wet. She had exciting news for Jerry.
        - id: ch01-b02
          speaker: polly
          text: >-
            Jerry, it all worked out! Mrs. Briggs sent her servant over this afternoon. She wants you to drive her tomorrow at eleven. I told him I thought you'd be glad to, though we'd assumed she had hired someone else.
        - id: ch01-b03
          speaker: servant
          text: >-
            The truth is, Mr. Briggs was upset when Mr. Barker wouldn't work Sundays, so he's been trying other cabs. But there's a problem with every one of them. Some go too fast and some too slow. Mrs. Briggs says none are as pleasant and clean as Mr. Barker's cab, and now she won't have any other.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Polly was nearly out of breath by the time she finished telling it. Jerry burst into a cheerful laugh.
        - id: ch01-b05
          speaker: jerry
          emotion: happy
          text: >-
            You were right, my dear. “It'll all come right, some day or night.” You usually are right. Run in and start supper. I'll take off Jack's harness and have him comfortable in no time.
        - id: ch01-b06
          speaker: narrator
          text: >-
            After that, Mrs. Briggs hired Jerry's cab just as often as she had before, but never on a Sunday. Then one Sunday did bring us work, and this is how it happened. We had all come home very tired on Saturday night. We were glad the next day would be nothing but rest, but it wasn't to turn out that way.
    - id: ch02
      title: A Sunday Journey
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            On Sunday morning, Jerry was grooming me in the yard when Polly came over. She looked as if she had something important on her mind.
        - id: ch02-b02
          speaker: jerry
          text: >-
            What is it?
        - id: ch02-b03
          speaker: polly
          text: >-
            Oh, Jerry, poor Dinah Brown has just gotten a letter. Her mother is dangerously ill, and Dinah must leave at once if she hopes to see her alive. Her family lives more than ten miles away in the country. Even if she takes the train, she'll still have four miles to walk. She's so weak, and her baby is only four weeks old. She could never manage it. She wants to know if you'll drive her there in your cab. She says she'll be sure to pay you once she can get the money.
        - id: ch02-b04
          speaker: jerry
          text: >-
            Oh, never mind the money. That's not what worries me. It's giving up our Sunday. The horses are tired, and I'm tired too. That's the hard part.
        - id: ch02-b05
          speaker: polly
          text: >-
            It's hard for all of us. Without you, it only feels like half a Sunday. But we ought to treat other people the way we'd want them to treat us. I know what I'd hope someone would do if my mother were dying. And Jerry, dear, I'm sure this won't spoil the Sabbath. If it's right to pull a poor animal out of a pit on Sunday, then it must be right to take poor Dinah to her mother.
        - id: ch02-b06
          speaker: jerry
          text: >-
            Why, Polly, that was as good as any minister's sermon. Since I've had my Sunday sermon early, go tell Dinah I'll be ready when the clock strikes ten. Wait, though. Stop by Braydon the butcher's shop first. Give him my regards and ask if he'll lend me his light trap. He never uses it on Sunday, and a lighter carriage would make a great difference to the horse.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Polly hurried away. Before long, she returned with Braydon's answer.
        - id: ch02-b08
          speaker: polly
          text: >-
            He says you may take the trap, and you're very welcome to it.
        - id: ch02-b09
          speaker: jerry
          text: >-
            Good. Pack me a little bread and cheese, and I'll come home this afternoon as soon as I can.
        - id: ch02-b10
          speaker: polly
          text: >-
            Then I'll save the meat pie for an early tea instead of serving it at dinner.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Polly went inside, and Jerry prepared for the trip. As he worked, he sang his favorite tune about Polly being just the right woman.
    - id: ch03
      title: A Meadow Sabbath
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Jerry chose me for the journey. At ten o'clock, we set out in a light gig with high wheels. It rolled so easily that, after pulling the four-wheeled cab, it hardly felt like a carriage at all.

            It was a beautiful day in May. Once we left the town, the sweet air and the smell of new grass brought back the old days. The country roads felt soft beneath my feet, and soon I felt fresh again.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Dinah's family lived in a little farmhouse along a green lane. Beside it was a meadow where two cows grazed under fine shade trees. A young man came out to meet Jerry.
        - id: ch03-b03
          speaker: young_man
          text: >-
            Bring the trap into the meadow. I can tie your horse in the cowshed, though I wish I had a better stable to offer you.
        - id: ch03-b04
          speaker: jerry
          text: >-
            If your cows won't mind, my horse would enjoy an hour or two in that lovely meadow more than anything. He's quiet, and being loose on the grass would be a rare treat for him.
        - id: ch03-b05
          speaker: young_man
          text: >-
            Please do. You're welcome to the best we have after being so kind to my sister. We'll have dinner in about an hour, and I hope you'll join us. Mother's illness has everyone in the house feeling troubled, though.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Jerry thanked him kindly. He said he had brought his own dinner, and there was nothing he'd enjoy more than walking around the meadow.

            When Jerry took off my harness, I couldn't decide what to do first. Should I eat the grass, roll on my back, lie down and rest, or gallop across the meadow simply because I was free? So I did each one in turn.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Jerry seemed every bit as happy as I was. First, he sat on a bank beneath a shady tree and listened to the birds. Then he sang, and read aloud from the little brown book he loved. After that, he walked around the meadow and followed a small stream. He gathered flowers and hawthorn there, then tied them together with long strands of ivy.

            At last, he gave me a good helping of the oats he'd brought. Still, our time there felt much too short. I hadn't been free in a field since I left poor Ginger at Earlshall.
        - id: ch03-b08
          speaker: narrator
          text: >-
            We traveled gently on the way home. As soon as we entered the yard, Jerry called out to Polly.
        - id: ch03-b09
          speaker: jerry
          emotion: happy
          text: >-
            Well, Polly, I didn't lose my Sunday after all. The birds were singing hymns from every bush, and I joined right in with the service. And Jack? Why, he was as lively as a young colt.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Then Jerry handed Dolly the flowers. She jumped about for joy.
