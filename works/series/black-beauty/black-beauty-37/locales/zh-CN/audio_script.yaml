audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    jerry:
      display_name: 杰里·巴克
      tts:
        delivery: 爽朗亲切，说起原则时坚定而不说教
        timbre: 结实温暖
        pace: 明快平稳
        pitch: 中低
    polly:
      display_name: 波莉·巴克
      tts:
        delivery: 温柔务实，谈到家人时沉静而坚决
        timbre: 温暖柔和
        pace: 舒缓
        pitch: 中
    young_man:
      display_name: 黛娜的哥哥
      tts:
        delivery: 朴实厚道，忧心家人却待客热诚
        timbre: 年轻温厚
        pace: 平稳自然
        pitch: 中
  chapters:
    - id: ch01
      title: 一切都有了着落
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 又过了两三个星期。一天傍晚，我们回来得很晚，刚走进院子，波莉就提着灯笼从马路对面跑来。只要雨不太大，她总会把灯送出来。
        - id: ch01-b02
          speaker: polly
          emotion: happy
          text: 杰里，事情真的有转机了！布里格斯太太派仆人来问，你明天十一点能不能送她出门。我答应替你问问，还说我们本以为她已经改雇别人的车了。
        - id: ch01-b03
          speaker: polly
          text: 那仆人这才告诉我，布里格斯先生还在为你不肯星期日出车生气，所以试了好几辆别的出租马车。可每一辆都有不称心的地方，不是赶得太快，就是赶得太慢。太太说，没有一辆车像你的这样整洁干净，往后非要再坐巴克先生的车不可。
        - id: ch01-b04
          speaker: narrator
          text: 波莉一口气说完，几乎喘不过气来。杰里听了，快活地大笑。
        - id: ch01-b05
          speaker: jerry
          emotion: happy
          text: 你那句“总有一天或一夜，一切都会有着落”，果然说中了。亲爱的，你往往都是对的。快去准备晚饭吧，我马上替杰克卸下挽具，让他安安稳稳歇着。
        - id: ch01-b06
          speaker: narrator
          text: 打那以后，布里格斯太太又像从前一样频繁地来雇杰里的车，只是从不在星期日找他。不过有一回，我们偏偏在星期日出了门。那天之前的星期六晚上，我们回到家时，人和马都累极了，还满心盼着第二天从早到晚好好休息。谁知事情另有安排。
    - id: ch02
      title: 星期日的请求
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 星期日早晨，杰里正在院子里替我梳洗。波莉走过来，脸上的神情明明白白地告诉人，她心里压着一件事。
        - id: ch02-b02
          speaker: jerry
          text: 怎么了？
        - id: ch02-b03
          speaker: polly
          emotion: sad
          text: 可怜的黛娜·布朗刚收到信，她母亲病危了。她若想见母亲最后一面，就得立刻赶去。她家在十多英里外的乡下，就算搭火车，下车还要走四英里。她身子虚，孩子又才四个星期大，怎么走得了？她想请你赶车送她去，等凑到钱，保证一分不少地付给你。
        - id: ch02-b04
          speaker: jerry
          text: 嗐，钱以后再说。我愁的是这个星期日又不能歇了。马累，我也累，这才叫人为难。
        - id: ch02-b05
          speaker: polly
          text: 这事谁都为难。你不在家，我的星期日也只剩下一半。可我们想让别人怎样待自己，就该怎样待别人。要是我母亲快去世了，我很清楚自己会盼着有人怎样帮我。杰里，我相信送这一趟不会坏了安息日。既然星期日可以把掉进坑里的可怜牲口或驴子拉出来，当然也可以送可怜的黛娜去见母亲。
        - id: ch02-b06
          speaker: jerry
          emotion: happy
          text: 波莉，你讲得真不比牧师差。我今天的晨间布道已经听完了。告诉黛娜，十点钟一响，我准时等她。对了，你先去布雷登肉铺，替我问候一声，再问他能不能借我那辆轻便车。他星期日不用它，换上轻车，马能省下不少力气。
        - id: ch02-b07
          speaker: narrator
          text: 波莉马上去了，很快便回来报信，说布雷登愿意把车借给杰里。
        - id: ch02-b08
          speaker: jerry
          text: 好极了。再给我包点面包和奶酪，我下午尽量早些回来。
        - id: ch02-b09
          speaker: polly
          text: 那我不在午饭时吃肉馅饼了，留着早点喝下午茶时吃，正好等你回来。
        - id: ch02-b10
          speaker: narrator
          text: 波莉去忙了。杰里一边准备出门，一边哼起他最喜欢的调子，唱的是“波莉才是真正的好女人”。
    - id: ch03
      title: 草地上的安息日
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 杰里选了我来跑这一趟。十点钟，我们驾着一辆轻巧的高轮双轮马车出发。和沉重的四轮出租马车相比，它拉起来轻得简直像身后空无一物。
        - id: ch03-b02
          speaker: narrator
          text: 那是五月里一个晴朗的日子。我们一出城，清甜的空气、青草的香味和松软的乡间道路，就唤回了旧日的舒畅。我很快又精神起来。
        - id: ch03-b03
          speaker: narrator
          text: 黛娜一家住在一座小农舍里，要沿着绿意浓浓的小路才能到达。农舍旁边就是草地，地里长着几棵枝叶浓密的大树，两头母牛正在吃草。一个年轻人请杰里把车赶进草地，说能把我拴进牛棚，只恨家里没有一间更好的马厩来安顿我。
        - id: ch03-b04
          speaker: jerry
          text: 只要你家的牛不介意，就让我的马在这片漂亮的草地上待一两个钟头吧。他很温顺，再没有什么比这更合他的心意了，这可是难得的享受。
        - id: ch03-b05
          speaker: young_man
          text: 尽管让他去吧。您这样帮助我妹妹，我们家里最好的东西都该拿来招待您。一个钟头后就吃午饭了，请您进屋一起吃。只是母亲病得太重，家里人人心乱，恐怕招待不周。
        - id: ch03-b06
          speaker: narrator
          text: 杰里亲切地谢过他，说自己带了午饭，只想在草地上自在地走一走。
        - id: ch03-b07
          speaker: narrator
          text: 挽具一卸，我竟不知道先做什么好。是先低头吃草，还是仰面打个滚？是躺下来休息，还是因为重获自由，撒开腿跑过草地？我兴奋得每一样都轮流做了一遍。杰里看上去也和我一样快活。他坐在树荫下的土坡边听鸟儿歌唱，后来自己也唱起歌，又读了一会儿那本心爱的小棕皮书。
        - id: ch03-b08
          speaker: narrator
          text: 接着，他在草地上四处闲走，一直走到小溪边。他采来鲜花和山楂花，用长长的常春藤枝扎成一束，又把随身带来的燕麦好好喂了我一顿。可这段自在的时光还是太短。自从在伯爵府庄园与可怜的姜饼分别以后，我再也没有踏进过草地。
        - id: ch03-b09
          speaker: narrator
          text: 回家的路上，杰里一直让车平稳地走得很从容。我们刚进院子，他开口便先对波莉说起这一天。
        - id: ch03-b10
          speaker: jerry
          emotion: happy
          text: 波莉，我到底没有丢掉这个星期日。每一丛灌木里都有鸟儿唱赞美诗，我也参加了它们的礼拜。至于杰克，他又快活得像一匹小马驹了。
        - id: ch03-b11
          speaker: narrator
          text: 杰里把花束递给多莉，她高兴得蹦蹦跳跳。
