audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，带着回望童年的亲切口吻
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    mother:
      display_name: 公爵夫人
      tts:
        delivery: 慈爱稳重，叮嘱时认真而不严厉
        timbre: 温暖醇厚
        pace: 从容
        pitch: 中低
    master:
      display_name: 主人
      tts:
        delivery: 平日亲切和善，斥责恶行时果断严厉
        timbre: 厚实明亮
        pace: 稳健
        pitch: 中
  chapters:
    - id: ch01
      title: 牧场里的童年
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我最早记得的家，是一片又大又舒服的牧场。牧场里有一池清水，几棵枝叶浓密的大树斜斜地伸到水面上。池水深的地方，长着灯心草和睡莲。隔着一边的树篱，我们能看见犁过的田地。另一边有道栅栏门，门外就是主人临路的房子。牧场上头是一片冷杉林，下头有小溪流过，溪岸又陡又高。
        - id: ch01-b02
          speaker: narrator
          text: 那时我还小，不会吃草，只能喝母亲的奶。白天，我跟着她到处跑。到了夜里，我就挨着她躺下。天热，我们站在池边的树荫下。天气冷了，冷杉林旁边还有一间暖和舒服的棚屋。后来我能吃草了，母亲白天便出去干活，直到傍晚才回来。
        - id: ch01-b03
          speaker: narrator
          text: 牧场里还有六匹小公马，全都比我大。有几匹长得很高，差不多已经像成年马了。我喜欢跟他们一起玩。我们成群结队，绕着牧场一圈一圈地飞跑，有多快就跑多快。只是他们玩起来有点粗鲁，不光奔跑，还常常互相踢咬。
    - id: ch02
      title: 母亲的教诲
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 有一天，小马们又踢闹起来，而且闹得很凶。母亲嘶鸣一声，把我叫到身边。她有一番要紧的话要告诉我。
        - id: ch02-b02
          speaker: mother
          text: 你要仔细听我说。这里的小马心地都不坏，可他们是拉车马的孩子，还没学会规矩。你生来血统好，也受过好教养。你父亲在这一带很有名气，你祖父两年前还赢得过纽马克特赛马会的奖杯。你祖母呢，是我认识的马里性情最温顺的一匹。
        - id: ch02-b03
          speaker: mother
          text: 你从来没见我踢谁、咬谁，对不对？我希望你长大以后温和善良，坏习惯一样也别学。干活要乐意去做，小跑时把脚抬好。就算只是玩，也绝不能踢人、咬人。
        - id: ch02-b04
          speaker: narrator
          text: 母亲的话，我一辈子都没有忘。她年长又聪明，主人也很看重她。她的名字叫公爵夫人，可主人常常亲昵地叫她“宝贝”。
    - id: ch03
      title: 善良的主人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 主人是个善良厚道的人。他让我们吃得好、住得好，对我们说话也总是和声细气，就像对自己的小孩子一样。大家都喜欢他，母亲更是爱他。每次在栅栏门边瞧见主人，她都会高兴地嘶鸣，再小跑着迎过去。主人便拍拍她，摸摸她。
        - id: ch03-b02
          speaker: master
          text: 老宝贝，今天怎么样？你的小黑子还好吗？
        - id: ch03-b03
          speaker: narrator
          text: 我那时一身暗黑，所以主人叫我“小黑子”。问候过母亲，他会给我一片很好吃的面包，有时也给母亲带一根胡萝卜。所有的马一见他都会围上来，不过我觉得，他最宠爱的还是我和母亲。赶集那天，母亲总会套上一辆轻便的双轮马车，拉着他进城。
        - id: ch03-b04
          speaker: narrator
          text: 农场里还有个赶犁的小伙子，名叫迪克。他偶尔会跑进牧场，从树篱上摘黑莓吃。等黑莓吃够了，他就拿我们找“乐子”。他朝小马扔石头、丢棍子，非要逼得我们奔跑。我们能够跑开，原本不大理会他。可石头有时会砸在身上，打得很疼。
        - id: ch03-b05
          speaker: narrator
          text: 一天，迪克又这样欺负我们。他哪里知道，主人就在隔壁田里，把一切都看见了。主人一下跳过树篱，抓住迪克的胳膊，狠狠扇了他一记耳光。迪克又惊又痛，放声号叫。我们见主人来了，也小跑着靠近，想看看接下来会怎样。
        - id: ch03-b06
          speaker: master
          text: 坏小子！竟敢追赶这些小马！你这么干，早就不止一两回了，但今天一定是最后一回。拿着，这是你的工钱。回家去吧，我的农场再也不用你了。
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: 从那以后，我们再也没见过迪克。照料马匹的老丹尼尔和主人一样温和。有这样的人照看，我们的日子过得很不错。
