audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    duchess:
      display_name: Duchess
      tts:
        delivery: wise and lovingly firm
        timbre: rich and soothing
        pace: unhurried
        pitch: medium-low
    master:
      display_name: The Master
      tts:
        delivery: kind and plainspoken, turning stern when needed
        timbre: sturdy and warm
        pace: steady
        pitch: low
  chapters:
    - id: ch01
      title: The Meadow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The first home I can remember was a wide, pleasant meadow with a pond of clear water. Shady trees leaned over the pond, and rushes and water lilies grew at the deep end. On one side, we could look across the hedge into a plowed field. On the other, a gate opened toward our master's house beside the road. A grove of fir trees stood at the top of the meadow. At the bottom, a brook ran beneath a steep bank.
        - id: ch01-b02
          speaker: narrator
          text: >-
            When I was very young, I couldn't eat grass, so I lived on my mother's milk. I ran beside her through the day and lay close to her at night. In hot weather, we stood in the cool shade by the pond. When it was cold, we had a warm shed near the fir grove.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Once I was old enough to graze, my mother began going out to work during the day. She always came home in the evening.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Six other young colts shared the meadow with me. They were older, and some were almost as big as full-grown horses. I loved running with them. We would all gallop around and around the field as fast as we could. But our games could get rough. The colts often bit and kicked while they ran.
    - id: ch02
      title: My Mother's Advice
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            One day, the kicking got especially wild. My mother whinnied for me to come over. Then she began to speak.
        - id: ch02-b02
          speaker: duchess
          text: >-
            I want you to listen carefully to what I'm about to tell you. The colts here are good colts, but they're cart-horse colts, and no one has taught them proper manners. You come from a fine family. Your father is famous all through this country, and two years ago your grandfather won the cup at the Newmarket races. Your grandmother was the sweetest-tempered horse I ever knew. And you've never seen me bite or kick, have you?
        - id: ch02-b03
          speaker: duchess
          text: >-
            I hope you'll grow up gentle and good. Don't pick up bad habits. Do your work willingly, and lift your feet properly when you trot. Most of all, never bite or kick, not even when you're playing.
        - id: ch02-b04
          speaker: narrator
          text: >-
            I never forgot that advice. I knew my mother was a wise old horse, and our master valued her highly. Her name was Duchess, though he often called her Pet.
    - id: ch03
      title: Our Kind Master
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Our master was a good and kind man. He gave us plenty to eat, a comfortable place to live, and gentle words. He spoke to us as kindly as he spoke to his own little children. We all loved him, and my mother was especially fond of him.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Whenever Duchess saw him at the gate, she neighed happily and trotted over. He would stroke and pat her, then ask about me.
        - id: ch03-b03
          speaker: master
          text: >-
            Well, old Pet, how is your little Darkie doing?
        - id: ch03-b04
          speaker: narrator
          text: >-
            My coat was a deep, dull black, and that was why he called me Darkie. He would give me a piece of bread, which tasted wonderful. Sometimes he brought my mother a carrot. Every horse came to greet him, but I believe my mother and I were his favorites. On market days, Duchess always pulled his light carriage into town.
    - id: ch04
      title: The Last of Dick
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            A plowboy named Dick sometimes came into our field to pick blackberries from the hedge. After eating all he wanted, he would start what he called his fun. He threw stones and sticks at the colts to make us gallop. Most of the time, we simply ran away from him. Even so, now and then a stone struck one of us and caused real pain.
        - id: ch04-b02
          speaker: narrator
          text: >-
            One day, Dick was playing this cruel game again. He had no idea that the master was in the next field, watching him. In an instant, the master leaped over the hedge, seized Dick by the arm, and gave him a sharp box on the ear. Dick roared from the pain and the shock. When we saw our master, we trotted closer to find out what was happening.
        - id: ch04-b03
          speaker: master
          text: >-
            You bad boy! Chasing the colts again! You've done this before, more than once, but you'll never do it here again. Take your pay and go home. I won't have you working on my farm anymore.
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: >-
            We never saw Dick again. Old Daniel, the man who cared for the horses, was every bit as gentle as our master. We horses had a very good life there.
