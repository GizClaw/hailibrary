  chapters:
    - id: ch01
      title: The Pony at the Gate
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One day, John and I were coming back from an errand for our master. We were moving gently along a long, straight road when we saw a boy ahead of us. He was trying to make a pony jump over a gate.

            The pony wouldn't do it. The boy whipped him, and the pony turned away to one side. The boy struck him again, and this time the pony turned the other way. Then the boy got down and beat him hard, even hitting him around the head. He climbed back on and tried the gate once more, kicking the poor pony the whole time. Still, the pony refused.

            Just as we came near, the pony dropped his head and kicked up his heels. The boy sailed neatly into a wide thorn hedge. Then the pony, with his reins hanging loose, galloped straight home.

            John burst out laughing.
        - id: ch01-b02
          speaker: john
          text: >-
            That's exactly what he deserved.
        - id: ch01-b03
          speaker: bill
          text: >-
            Ow! Oh! Help me! Come on, get me out of here!
        - id: ch01-b04
          speaker: narrator
          text: >-
            The boy was twisting and struggling among the thorns.
        - id: ch01-b05
          speaker: john
          text: >-
            No, thank you. I think you're right where you belong. A few scratches may teach you not to force a pony over a gate that's too high for him.
        - id: ch01-b06
          speaker: narrator
          text: >-
            John rode on. Then he spoke quietly to himself.
        - id: ch01-b07
          speaker: john
          text: >-
            A cruel young fellow like that may lie about what happened, too. Beauty, we'll go home past Farmer Bushby's place. Then if anyone asks, you and I can tell them the truth.
    - id: ch02
      title: At Farmer Bushby's
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            We turned to the right and soon reached the farmer's stack-yard, where we could see the house. Mr. Bushby was hurrying toward the road. His wife stood at the gate, looking badly frightened.
        - id: ch02-b02
          speaker: farmer_bushby
          text: >-
            Have you seen my boy? He left an hour ago on my black pony, and the pony has just come home without him.
        - id: ch02-b03
          speaker: john
          text: >-
            Sir, that pony is better off without a rider, unless your boy learns how to ride him properly.
        - id: ch02-b04
          speaker: farmer_bushby
          text: >-
            What do you mean by that?
        - id: ch02-b05
          speaker: john
          text: >-
            I saw your son whipping, kicking, and hitting that good little pony because he wouldn't jump a gate that was too high. The pony did nothing wrong and showed no bad temper. At last, he kicked up and tipped the young gentleman into the thorn hedge.

            He asked me to pull him out, but I hope you'll excuse me. I didn't care to do it. No bones are broken. He'll only have some scratches. I love horses, sir, and it makes me angry to see one mistreated. If you keep pushing an animal until he uses his heels, he may do it again.
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: >-
            While John explained, Mrs. Bushby began to cry.
        - id: ch02-b07
          speaker: mrs_bushby
          text: >-
            Oh, my poor Bill! I have to go meet him. He must be hurt!
          emotion: fearful
        - id: ch02-b08
          speaker: farmer_bushby
          text: >-
            You'd better go inside, wife. Bill needs a lesson, and I'll make sure he gets one. This isn't the first or even the second time he has mistreated that pony. I'm going to put a stop to it. Thank you, Manly. Good evening.
    - id: ch03
      title: The Devil's Trade Mark
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            We went on, and John chuckled all the way home. When we arrived, he told James what had happened. James laughed.
        - id: ch03-b02
          speaker: james
          text: >-
            That's what he deserved. I knew Bill at school. He thought being a farmer's son made him important, so he strutted around and bullied the smaller boys. We older boys wouldn't allow it. We made it clear that at school and on the playground, a farmer's son was no better than a laborer's son.

            I remember finding him at the big window one afternoon before school. He was catching flies and pulling off their wings. He didn't see me, so I boxed his ears and knocked him flat on the floor.

            I was furious, but then he started roaring so loudly that he almost frightened me. Boys rushed in from the playground, and the master ran in from the road. Anyone would have thought someone was being murdered.

            I told the master right away what I'd done and why. Then I showed him the flies. Some were crushed, and others were crawling around helplessly. Their torn-off wings lay on the windowsill.

            I'd never seen the master so angry. But Bill was still howling and whining, so the master didn't punish him with another beating. Instead, he put Bill on a stool for the rest of the afternoon and kept him from playing outside for the whole week.

            Then the master spoke very seriously to all of us about cruelty. He said it was cowardly and hardhearted to hurt anyone weak and helpless. But one thing he said has stayed with me. Cruelty was the devil's own trade mark. If someone took pleasure in being cruel, you could tell who he belonged to. The devil had been a murderer from the beginning and would be a tormentor to the end.

            But when people loved their neighbors and were kind to both people and animals, that kindness was God's mark.
        - id: ch03-b03
          speaker: john
          text: >-
            Your master never taught you anything truer. There is no religion without love. People can talk about their religion all they please, but if it doesn't teach them to be good and kind to people and animals, then it's a sham. All a sham, James. It won't hold up when everything is shown for what it really is.
