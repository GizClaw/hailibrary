audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    second_hostler:
      display_name: 年轻马夫
      tts:
        delivery: 直爽勤快，危急时慌张急促
        timbre: 年轻而略显粗哑
        pace: 适中
        pitch: 中
    dick_towler:
      display_name: 迪克·陶勒
      tts:
        delivery: 懒散随便，说话漫不经心
        timbre: 年轻松散
        pace: 偏慢
        pitch: 中
    old_hostler:
      display_name: 老马夫
      tts:
        delivery: 热情爽朗，谈起马匹时熟练自信又满怀疼爱
        timbre: 略显苍老而明亮
        pace: 明快
        pitch: 中高
    james:
      display_name: 詹姆斯
      tts:
        delivery: 开朗随和，谈话时自然爽快
        timbre: 年轻清亮
        pace: 适中
        pitch: 中
    squire:
      display_name: 戈登乡绅
      tts:
        delivery: 明快稳健，待人和气而有主见
        timbre: 厚实清晰
        pace: 适中
        pitch: 中
    big_man:
      display_name: 高个男人
      tts:
        delivery: 豪爽直率，语气笃定
        timbre: 洪亮厚重
        pace: 适中
        pitch: 低
    caller_1:
      display_name: 呼喊者甲
      tts:
        delivery: 紧迫响亮，危急中用力呼喊
        timbre: 清晰有力
        pace: 较快
        pitch: 中高
    caller_2:
      display_name: 呼喊者乙
      tts:
        delivery: 紧迫响亮，危急中用力呼喊
        timbre: 粗亮有力
        pace: 较快
        pitch: 中
  chapters:
    - id: ch01
      title: 烟从头顶钻下来
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那天晚上，第二个马夫又牵进来一匹旅客的马。他正替马刷洗，一个叼着烟斗的年轻人晃进马厩，找他闲聊。
        - id: ch01-b02
          speaker: second_hostler
          text: 陶勒，劳驾你上草料棚拿些干草下来，放进这匹马的料架。记得先把烟斗放下。
        - id: ch01-b03
          speaker: dick_towler
          text: 行，没问题。
        - id: ch01-b04
          speaker: narrator
          text: 陶勒从活板门爬了上去。我听见他走过头顶的地板，又放下干草。临睡前，詹姆斯最后来看了我们一次，随后马厩便锁了门。
        - id: ch01-b05
          speaker: narrator
          text: 不知睡了多久，我难受得醒了过来，却说不清是为什么。站起来才发现，空气浓浊呛人。金儿在咳嗽，另一匹马也焦躁不安。四下一片漆黑，我什么都看不见，只觉得马厩里全是烟，连气都喘不上来。
        - id: ch01-b06
          speaker: narrator
          text: 通往草料棚的活板门还开着，我猜烟就是从那儿钻下来的。上面有低低的呼呼声，还夹着噼啪爆响。我不知道那是什么，可那声音怪得吓人，叫我浑身发抖。所有马都醒了，有的猛扯笼头，有的不停跺蹄子。
        - id: ch01-b07
          speaker: narrator
          text: 外面终于响起脚步。刚才安顿旅客坐骑的年轻马夫提着灯冲进来，急着给马解开缰绳，一个个往外牵。可他自己又慌又怕，反倒让我们更害怕。第一匹马不肯跟他走，他赶紧去试第二匹、第三匹，可他们也一步不动。轮到我时，他想用力把我拖出隔间，自然没有用。所有马都试过以后，他只得离开马厩。
    - id: ch02
      title: 詹姆斯冲进火场
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我们那时确实很愚蠢，可危险像是从四面八方围了上来，身边又没有一个认识并且信得过的人。一切都是陌生的，谁也不知道接下来会发生什么。门开着，新鲜空气涌进来，呼吸稍稍容易了些。可头顶的呼呼声越来越大。我从空料架的栏杆间抬头望去，看见摇动的红光映在墙上。
        - id: ch02-b02
          speaker: narrator
          text: 外面忽然传来一声大喊，有人终于喊出了“着火了”。老马夫立刻进来，神情沉着，动作飞快。他先牵出去一匹马，转身又来救另一匹。这时，火焰已经绕着活板门四周蹿动，头顶的轰鸣声听着实在骇人。
        - id: ch02-b03
          speaker: narrator
          text: 随后传来了詹姆斯的声音。即使在这种时候，他听起来仍旧镇定又快活。
        - id: ch02-b04
          speaker: james
          text: 漂亮伙计们，该走啦。都醒一醒，跟我出去。
        - id: ch02-b05
          speaker: narrator
          text: 我离门最近，詹姆斯便先走向我，一边走一边轻轻拍我。
        - id: ch02-b06
          speaker: james
          text: 来吧，美人儿，好孩子。戴好笼头，咱们马上就能离开这呛人的地方。
        - id: ch02-b07
          speaker: narrator
          text: 他很快替我戴好笼头，又解下围巾，松松蒙住我的眼睛。詹姆斯一路轻拍，柔声哄着，把我领到了院子里。到了安全的地方，他才揭下围巾。
        - id: ch02-b08
          speaker: james
          text: 来个人牵住这匹马！我得回去救另一匹！
        - id: ch02-b09
          speaker: narrator
          text: 一个高大魁梧的男人接住了我，詹姆斯马上又冲回马厩。我看着他消失在门里，忍不住尖声嘶鸣。金儿后来告诉我，正是这声嘶鸣给了她勇气。要不是听见我已在外面，她绝不敢走出来。
    - id: ch03
      title: 浓烟中的身影
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 院子里一片混乱。别处马厩的马正被牵出来，马车和轻便马车也纷纷拖出车房和棚屋，大家生怕火势继续蔓延。院子另一边的窗户全被推开，人们探出身子，七嘴八舌地喊着。我却始终盯住马厩门口。那里涌出的烟越来越浓，浓烟里面不时闪过红光。
        - id: ch03-b02
          speaker: narrator
          text: 忽然，一个响亮清楚的声音盖过了满院的喧嚷。我听出那是主人。
        - id: ch03-b03
          speaker: squire
          text: 詹姆斯·霍华德！詹姆斯·霍华德！你在里面吗？
        - id: ch03-b04
          speaker: narrator
          text: 没有回答。马厩里轰然一响，像是什么塌了。下一刻，詹姆斯牵着金儿从浓烟里走了出来。我欢喜得放声长嘶。金儿咳得厉害，詹姆斯也已经说不出话。
        - id: ch03-b05
          speaker: squire
          text: 勇敢的好小伙！你受伤了吗？
        - id: ch03-b06
          speaker: narrator
          text: 主人把手按在詹姆斯肩上。詹姆斯还没法开口，只摇了摇头。
        - id: ch03-b07
          speaker: big_man
          text: 这小伙子是真勇敢，一点儿不假。
        - id: ch03-b08
          speaker: squire
          text: 詹姆斯，等你喘过气来，我们就赶快离开这里。
    - id: ch04
      title: 穿过寂静的广场
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我们正往出口走，集市广场那边忽然传来急促的马蹄声，还有车轮滚动的隆隆巨响。
        - id: ch04-b02
          speakers: [caller_1, caller_2]
          ensemble: duo
          text: 消防车来了！大家退后，快让开路！
        - id: ch04-b03
          speaker: narrator
          text: 两匹马拉着一架沉重的消防车，踩得石板路铿锵作响，伴着雷鸣般的车轮声一路冲进院子。消防员纷纷跳下车，根本不用问哪里着火。熊熊烈焰已经从屋顶翻卷而起，直往上蹿。
        - id: ch04-b04
          speaker: narrator
          text: 我们赶紧来到宽阔安静的集市广场。星星还在天上闪烁，除了身后的喧闹，四周一片寂静。主人把我们领到广场对面的一家大旅店。等那里的马夫赶来，他便把事情交代给詹姆斯。
        - id: ch04-b05
          speaker: squire
          text: 詹姆斯，我必须马上赶去找你们女主人。马全交给你了，需要什么，你只管吩咐。
        - id: ch04-b06
          speaker: narrator
          text: 说完，主人便走了。他没有跑，可我从没见过哪个人能走得像他那晚那么快。
        - id: ch04-b07
          speaker: narrator
          text: 还没进入新的隔间，我们听见了最可怕的声音。那些没能逃出来的马，正在火里发出临死的惨叫。那声音实在恐怖得让人无法忍受，金儿和我听得难受极了。幸好，我们进了马厩以后，得到了周到的照料。
    - id: ch05
      title: 大火的缘由
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天早上，主人来看我们，也来和詹姆斯说话。马夫正替我刷毛，我听不清全部谈话，却看得出詹姆斯很高兴，主人也为他感到骄傲。
        - id: ch05-b02
          speaker: narrator
          text: 女主人夜里受了很大惊吓，原定的行程只好推迟到下午。詹姆斯便有了一个上午的空闲。他先回原来的旅店查看我们的挽具和马车，又留下来打听更多火灾的消息。等他回来，我们听见他把查到的事讲给这里的马夫。
        - id: ch05-b03
          speaker: narrator
          text: 起初，没人猜得出火是怎么烧起来的。后来有人说，他看见迪克·陶勒叼着烟斗进了马厩，出来时烟斗已经不见，还去酒吧又要了一支。年轻马夫也承认，是他叫迪克上去拿干草，不过明明叮嘱过他，要先把烟斗放下。
        - id: ch05-b04
          speaker: narrator
          text: 迪克一口否认自己带着烟斗爬上去，可谁也不信。我想起约翰·曼利的规矩，马厩里绝不能有烟斗。我觉得所有地方都该这样做。
        - id: ch05-b05
          speaker: narrator
          text: 詹姆斯还说，屋顶和楼板已经全部塌下，只剩烧黑的墙还立着。那两匹没能救出的可怜马儿，就埋在烧焦的椽木和瓦片下面。
