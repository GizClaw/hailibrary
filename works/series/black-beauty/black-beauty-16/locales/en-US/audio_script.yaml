  chapters:
    - id: ch01
      title: A Careless Pipe
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Later that evening, the second hostler brought in a traveler's horse. As he cleaned the horse, a young man wandered into the stable with a pipe in his mouth and stopped to gossip.
        - id: ch01-b02
          speaker: second_hostler
          text: >-
            Hey, Towler, would you climb into the loft and drop some hay into this horse's rack? Just put your pipe down first.
        - id: ch01-b03
          speaker: dick_towler
          text: >-
            Sure.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He climbed through the trapdoor. I heard him walking across the floor above us, then pushing down the hay. Before bedtime, James came in for one last look at us. After that, the stable door was locked.
    - id: ch02
      title: Smoke in the Dark
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            I don't know how long I slept, or what time it was when I woke. I only knew that something felt terribly wrong. I stood up. The air was thick enough to choke me. Ginger was coughing, and another horse was shifting uneasily. The stable was pitch-dark, so I couldn't see a thing. But smoke filled the air, and every breath was hard.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The trapdoor had been left open, and the smoke seemed to be coming through it. I listened. Above me was a soft rushing sound, with quiet cracks and snaps mixed in. I had no idea what it meant. Still, there was something so strange about it that my whole body trembled.

            By then, every horse was awake. Some pulled at their halters. Others stamped the floor.
        - id: ch02-b03
          speaker: narrator
          text: >-
            At last, I heard footsteps outside. The second hostler burst in carrying a lantern. He started untying us and tried to lead us out. But he was rushing, and his own fear only frightened me more.

            The first horse refused to follow him. So did the second and the third. Then he came to my stall and tried to drag me out by force. Of course, that didn't work. After trying each of us, he left the stable.
        - id: ch02-b04
          speaker: narrator
          text: >-
            We must have seemed very foolish. But danger felt as if it were everywhere, and there was no familiar person for us to trust. Everything was strange. Nothing felt safe.

            Fresh air came through the open door, and breathing grew easier. Still, the rushing above us got louder. I looked up through the bars of my empty rack and saw red light flickering across the wall.
        - id: ch02-b05
          speaker: yard_voice_1
          text: >-
            Fire!
          emotion: fearful
        - id: ch02-b06
          speaker: narrator
          text: >-
            Then the old hostler came in, moving quickly but quietly. He got one horse outside and turned to another. Flames were already dancing around the trapdoor, and the roar overhead was dreadful.
    - id: ch03
      title: James Comes Back
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Then I heard James. His voice was quiet and cheerful, just as it always was.
        - id: ch03-b02
          speaker: james
          text: >-
            Come on, my beauties. Time to get moving. Wake up now, and come with me.
          emotion: calm
        - id: ch03-b03
          speaker: narrator
          text: >-
            My stall was nearest the door, so he came to me first, patting me as he approached.
        - id: ch03-b04
          speaker: james
          text: >-
            Come on, Beauty. Let's get your bridle on, my boy. We'll be out of this smoke in no time.
          emotion: calm
        - id: ch03-b05
          speaker: narrator
          text: >-
            He slipped the bridle on at once. Then he took the scarf from his neck and tied it lightly over my eyes. With pats and gentle encouragement, he led me out.

            Once we were safe in the yard, James removed the scarf.
        - id: ch03-b06
          speaker: james
          text: >-
            Someone take this horse! I have to go back for the other one!
        - id: ch03-b07
          speaker: narrator
          text: >-
            A tall, broad man stepped up and took hold of me. James rushed back into the stable. When I saw him disappear inside, I let out a sharp whinny.

            Ginger told me later that my call was the best thing I could have done for her. If she hadn't heard me outside, she never would have found the courage to come out.
        - id: ch03-b08
          speaker: narrator
          text: >-
            The yard was in confusion. Horses were being led from the other stables. People pulled carriages and gigs out of coach houses and sheds in case the flames spread. Across the yard, windows flew open and people shouted all kinds of things.

            I watched only the stable door. Smoke poured from it more thickly every moment, with flashes of red inside. Then one clear, powerful voice rose above all the noise. It was my master's.
        - id: ch03-b09
          speaker: master
          text: >-
            James Howard! James Howard! Are you in there?
          emotion: fearful
        - id: ch03-b10
          speaker: narrator
          text: >-
            There was no answer. Something crashed inside the stable. A moment later, I gave a loud, joyful neigh. James appeared through the smoke with Ginger beside him. She was coughing hard, and James couldn't speak.
        - id: ch03-b11
          speaker: master
          text: >-
            My brave boy! Are you hurt?
        - id: ch03-b12
          speaker: narrator
          text: >-
            James shook his head. He still couldn't get any words out.
        - id: ch03-b13
          speaker: broad_man
          text: >-
            He's a brave lad, all right. No question about it.
        - id: ch03-b14
          speaker: master
          text: >-
            Once you've caught your breath, James, we need to leave this place as fast as we can.
    - id: ch04
      title: Across the Marketplace
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            We had just started toward the entrance when galloping hooves and the rumble of heavy wheels came from the marketplace.
        - id: ch04-b02
          speakers: [yard_voice_1, yard_voice_2]
          ensemble: duo
          text: >-
            It's the fire engine! Stand back! Make way!
        - id: ch04-b03
          speaker: narrator
          text: >-
            Two horses charged over the stones and into the yard, pulling the heavy engine behind them. The firemen jumped down. No one had to tell them where the fire was. A great blaze was rolling up from the roof.
        - id: ch04-b04
          speaker: narrator
          text: >-
            We hurried into the wide, quiet marketplace. Stars shone overhead. Except for the noise behind us, everything was still.

            Master led us to a large hotel on the other side. As soon as its hostler arrived, he turned to James.
        - id: ch04-b05
          speaker: master
          text: >-
            James, I must get to your mistress. I'm leaving the horses completely in your care. Order anything you think they need.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Then he was gone. Master did not run, but I had never seen any man walk so fast as he did that night.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Before we reached our stalls, a terrible sound came from the burning stable. The horses left inside were shrieking. Ginger and I felt terrible when we heard them.

            We were taken in, and the people there cared for us well.
    - id: ch05
      title: What Caused the Fire
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The next morning, Master came to see how we were and to talk with James. I couldn't hear much while the hostler rubbed me down. But James looked very happy, and I thought Master looked proud of him.

            Mistress had been so badly frightened during the night that our journey was delayed until afternoon. That left James free for the morning. First, he went back to the inn to check on our harness and the carriage. Then he went to learn more about the fire.
        - id: ch05-b02
          speaker: narrator
          text: >-
            When James returned, we heard him tell the hostler what he had learned. At first, no one knew how the fire had started. Then a man said he had seen Dick Towler enter the stable with a pipe in his mouth. When Dick came out, the pipe was gone, and he went to the tap for another one.

            The second hostler admitted that he had sent Dick up the ladder for hay, though he had told him to put down his pipe first. Dick insisted that he had not taken it into the loft. No one believed him.
        - id: ch05-b03
          speaker: narrator
          text: >-
            I remembered John Manly's rule. He never allowed a pipe in the stable. I thought every stable should have the same rule.
        - id: ch05-b04
          speaker: narrator
          text: >-
            James said the roof and floor had both collapsed. Only the blackened walls were left standing.

            The two poor horses that could not be saved lay buried beneath the burned rafters and tiles.
