audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    driver:
      display_name: 车夫
      tts:
        delivery: 粗暴冷硬，只顾催赶和揽客
        timbre: 粗哑干涩
        pace: 偏快
        pitch: 中低
    grace:
      display_name: 格雷丝
      tts:
        delivery: 善良敏锐，为受苦的动物据理恳求
        timbre: 清澈柔和
        pace: 适中
        pitch: 中高
    porter:
      display_name: 搬运工
      tts:
        delivery: 务实直率，忙碌中仍留意分量
        timbre: 朴实清楚
        pace: 适中
        pitch: 中
    father:
      display_name: 格雷丝的父亲
      tts:
        delivery: 盛气凌人，言语急躁而不容反驳
        timbre: 洪亮强硬
        pace: 偏快
        pitch: 中低
    bystander:
      display_name: 路人
      tts:
        delivery: 看到倒地的马时直截了当
        timbre: 普通清晰
        pace: 适中
        pitch: 中
    skinner:
      display_name: 尼古拉斯·斯金纳
      tts:
        delivery: 冷酷算计，把马只当作赚钱的工具
        timbre: 刺耳粗厉
        pace: 适中
        pitch: 中低
    farrier:
      display_name: 蹄铁匠
      tts:
        delivery: 经验老到，判断病情时平实客观
        timbre: 沉稳厚实
        pace: 不疾不徐
        pitch: 中低
  chapters:
    - id: ch01
      title: 斯金纳的马房
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我的新主人叫尼古拉斯·斯金纳，这个人我一辈子也忘不了。他有一双黑眼睛，一个鹰钩鼻，嘴里的牙齿多得像斗牛犬。那副嗓门更难听，就像车轮从碎石上碾过去。我想，可怜的瘦山姆以前赶车，替的就是他。
        - id: ch01-b02
          speaker: narrator
          text: >-
            人常说，亲眼看见才会相信。可依我说，非得亲身受过，才会真的相信。我以前见过许多苦事，直到这时候才明白，出租马车的马究竟能活得多惨。
        - id: ch01-b03
          speaker: narrator
          text: >-
            斯金纳的车又破又差，手下的车夫也好不到哪里去。他苛待车夫，车夫转过身来苛待马。那时正是盛夏，我们连星期日也不能休息。
        - id: ch01-b04
          speaker: narrator
          text: >-
            有些星期日，一群只顾玩乐的男人会包下马车用上一整天。四个人坐在车里，还有一个挤在车夫身旁。我得拉着他们往乡下跑十英里，有时甚至十五英里，然后再拉回来。坡再陡，天再热，也没人肯下来走几步。只有车夫自己怕我实在上不去时，才会让他们下车。
        - id: ch01-b05
          speaker: narrator
          text: >-
            有时我累得浑身发烫，连料都吃不下。这便叫我想起杰里。他总在炎热的星期六晚上，给我们一顿加了硝石的麸皮粥。吃下去，一身的燥热都退了。随后，我们能安安稳稳歇两个晚上和一整个白天，星期一早晨又像小马一样有精神。
        - id: ch01-b06
          speaker: narrator
          text: >-
            可这里根本没有休息。赶我的车夫和斯金纳一样狠。他的鞭梢尖利得能抽出血来，甚至会往我肚皮上抽，把鞭子甩到我头上。这样的羞辱，一次次叫我心灰意冷。可我还是尽力拉车，从不往后缩。可怜的金吉说过，反抗没有用，因为人总是更强的一方。
        - id: ch01-b07
          speaker: narrator
          text: >-
            我的日子苦得再也受不住了。我真盼着能像金吉那样，在干活时倒下死去，从此什么苦也不用受。后来有一天，这个愿望几乎成了真。
    - id: ch02
      title: 沉重的一车
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            那天早晨八点，我就到了候车点，已经拉过不少生意，后来又送一位客人去火车站。眼看一列长长的火车要进站，车夫把我停在外面几辆马车后头，想等个返程客。那班车下来的人很多，前面的马车一下都被雇走，很快就轮到了我们。
        - id: ch02-b02
          speaker: narrator
          text: >-
            客人有四位。一名男子声音很大，举止蛮横，身边跟着一位太太、一个小男孩和一个年轻姑娘。他们还带了一大堆行李。太太和男孩先上了车，那男人忙着指使别人搬箱子，年轻姑娘却走到我身边看了又看。
        - id: ch02-b03
          speaker: grace
          text: 爸爸，这匹马又瘦弱又疲惫。他拉着我们，再加上这么多行李，肯定走不了那么远。您快看看他吧。
        - id: ch02-b04
          speaker: driver
          text: 他好着呢，小姐。力气足够拉这一车。
        - id: ch02-b05
          speaker: narrator
          text: 搬运工正拖着几只沉重的箱子。他看了看这堆行李，便向那位先生提了个建议。
        - id: ch02-b06
          speaker: porter
          text: 行李这么多，要不要再雇一辆马车？
        - id: ch02-b07
          speaker: father
          text: 你的马究竟拉得动，还是拉不动？
        - id: ch02-b08
          speaker: driver
          text: 当然拉得动，先生。把箱子都搬上来吧，再多一点也不成问题。
        - id: ch02-b09
          speaker: narrator
          text: >-
            车夫自己也上手，拽起一只重得惊人的箱子。箱子刚放上去，我便感觉车身的弹簧沉了下去。
        - id: ch02-b10
          speaker: grace
          text: 爸爸，求您再叫一辆车吧。我们这样做是不对的，对这匹马太残忍了。
        - id: ch02-b11
          speaker: father
          text: >-
            胡说，格雷丝！马上上车，别再闹了。难道做生意的人每次雇马车，都得先把马检查一遍吗？车夫当然知道自己在做什么。快上去，不许再说了！
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: >-
            这位温柔的朋友只好听从父亲。箱子一只接一只地堆上车顶，或是塞到车夫旁边。全部装好以后，车夫照旧猛扯一下缰绳，抽下一鞭，把我赶出了车站。
        - id: ch02-b13
          speaker: narrator
          text: >-
            这一车实在太重，而我从早晨起没吃过东西，也没歇过一刻。哪怕受到的全是残酷和不公，我仍像从前一样，拿出所有力气往前走。
    - id: ch03
      title: 倒在卢德盖特山
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            到卢德盖特山以前，我还勉强撑得住。可到了坡上，车太重，我也实在耗尽了力气。车夫不停地猛扯缰绳，又一鞭鞭抽下来，我只能挣扎着往前挪。
        - id: ch03-b02
          speaker: narrator
          text: >-
            忽然之间，我的四蹄从身下滑了出去。我根本不知道是怎么发生的，只觉得自己侧着身子重重摔在地上。那一下又猛又突然，像是把我身体里的气全撞了出去。我静静躺着，一点也动不了，只当自己终于要死了。
        - id: ch03-b03
          speaker: narrator
          text: >-
            周围顿时乱了起来。有人愤怒地大声叫嚷，有人在往下搬行李，可那些声音听来都像一场梦。迷迷糊糊中，我又听见了那个甜美而怜悯的声音。
        - id: ch03-b04
          speaker: grace
          text: 哦，这匹可怜的马！都是我们害的。
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: >-
            有人替我松开笼头上的喉带，又卸掉挽绳，不让颈圈继续紧勒着我。接着，一个声音从旁边传来。
        - id: ch03-b06
          speaker: bystander
          text: 他已经死了，再也站不起来了。
        - id: ch03-b07
          speaker: narrator
          text: >-
            我还听见警察在指挥众人，可连眼睛也睁不开，只能隔一会儿艰难地喘口气。冷水泼到了我头上，有人把提神的药酒灌进我嘴里，又拿东西盖住了我的身体。
        - id: ch03-b08
          speaker: narrator
          text: >-
            我不知道自己躺了多久。后来，生命一点点回来了。一位声音和善的男人轻轻拍着我，鼓励我起来。又喝下一点药酒，试过一两次以后，我终于摇晃着站住了。人们小心地把我牵到附近的马房，安置在铺满厚垫草的马栏里，还送来一盆温热的稀粥。我感激地把它喝了下去。
    - id: ch04
      title: 等待拍卖
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            到了晚上，我恢复了一些，已经能被牵回斯金纳的马房。我想，他们也尽力照料了我。第二天早晨，斯金纳带来一名蹄铁匠。那人把我从头到脚仔细检查了一遍。
        - id: ch04-b02
          speaker: farrier
          text: >-
            他主要是干活过度，累垮了，不是得了什么病。要是让他休养六个月，以后还能继续干活。可现在，他身上一点力气也没有了。
        - id: ch04-b03
          speaker: skinner
          text: >-
            那就让他完蛋吧。我没有草场养病马。他也许能好，也许永远好不了，我做生意可不吃这一套。马只要还能走，我就让它干。等它走不动了，就卖到屠马场，或者随便什么地方，能卖多少算多少。
        - id: ch04-b04
          speaker: farrier
          text: >-
            要是他得了喘症，最好马上杀掉。可他没有。再过十天左右正好有一场马匹拍卖。你让他歇一歇，多喂些料，也许还能恢复一点。到时候，不管怎样也能卖得比一张马皮贵。
        - id: ch04-b05
          speaker: narrator
          text: >-
            斯金纳听了，才很不情愿地下令好好喂我、照顾我。幸好马夫执行命令时，比主人下命令时用心得多。此后整整十天，我完全不用干活，每天都有充足的好燕麦、干草和麸皮粥，粥里还拌着煮熟的亚麻籽。再没有什么比这些更能让我恢复体力了。
        - id: ch04-b06
          speaker: narrator
          text: >-
            亚麻籽粥实在好吃。我慢慢觉得，活着终究还是比完蛋好。出事后的第十二天，他们把我带到伦敦城外几英里的一处拍卖场。不管换去哪里，总会比斯金纳这里好。我便抬起头，盼着接下来能有一点好运。
