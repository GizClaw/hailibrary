  chapters:
    - id: ch01
      title: No Rest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I will never forget my new master. He had black eyes, a hooked nose, and a mouth packed with teeth like a bulldog's. His voice sounded as harsh as cart wheels grinding over gravel. His name was Nicholas Skinner. I believe he was the same man poor Seedy Sam had driven for.
        - id: ch01-b02
          speaker: narrator
          text: >-
            People say seeing is believing. I would say feeling is believing. I had seen plenty of suffering before, but only now did I learn just how miserable a cab horse's life could be.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Skinner kept a shabby group of cabs and hired shabby drivers. He treated the men hard, and they treated the horses hard. We never got a Sunday off, even though it was the hottest part of summer.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Some Sunday mornings, a party of wild young men would hire my cab for the whole day. Four crowded inside, and one more rode beside the driver. I had to carry them ten or fifteen miles into the country and all the way back. No one would get out and walk up a hill, no matter how steep it was or how hot the day felt. They only climbed down if the driver feared I could not make it.
        - id: ch01-b05
          speaker: narrator
          text: >-
            At times I came home so hot and worn out that I could barely eat. I longed for the bran mash with niter that Jerry used to give us on hot Saturday nights. It cooled us down and left us comfortable. Then we had two nights and a full day of quiet rest. By Monday morning, we felt like young horses again.
        - id: ch01-b06
          speaker: narrator
          text: >-
            There was nothing like that here. My driver was every bit as hard as Skinner. His cruel whip had such a sharp tip that it sometimes drew blood. He would strike me under the belly and flick the lash at my head. That kind of treatment crushed my spirit. Still, I always tried my best and never held back. Poor Ginger had been right. There was no use fighting it. Men were stronger.
        - id: ch01-b07
          speaker: narrator
          text: >-
            My life had become so wretched that I wished I could fall dead at work, as Ginger had, and escape my misery. One day, that wish almost came true.
    - id: ch02
      title: The Heavy Fare
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            I went to the cab stand at eight that morning and had already done a good deal of work when we took a passenger to the railway. A long train was due, so my driver pulled in behind the cabs outside and waited for a return fare. The train was very full. Soon every cab was taken, and someone called for ours.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The party had four people and a great pile of luggage. There was a loud, overbearing man, a lady, a little boy, and a young girl. The lady and boy climbed into the cab. While the man gave orders about the baggage, the girl came over and looked closely at me.
        - id: ch02-b03
          speaker: grace
          text: >-
            Papa, this poor horse can't possibly carry all of us and the luggage so far. Look at him. He's terribly weak and worn out.
        - id: ch02-b04
          speaker: driver
          text: >-
            He's fine, miss. He's plenty strong enough.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The porter was dragging some heavy boxes into place. Seeing how much baggage there was, he asked the gentleman if he might want a second cab.
        - id: ch02-b06
          speaker: porter
          text: >-
            Sir, with all this luggage, would you rather take another cab as well?
        - id: ch02-b07
          speaker: gentleman
          text: >-
            Can your horse manage it or not?
        - id: ch02-b08
          speaker: driver
          text: >-
            Of course he can, sir. Load the boxes up, porter. He could carry more than this.
        - id: ch02-b09
          speaker: narrator
          text: >-
            My driver helped haul up a box so heavy that I felt the cab springs sink beneath it.
        - id: ch02-b10
          speaker: grace
          emotion: sad
          text: >-
            Papa, please get another cab. This isn't right. It's cruel to make him pull all of this.
        - id: ch02-b11
          speaker: gentleman
          emotion: angry
          text: >-
            Nonsense, Grace. Get in now and stop making such a fuss. A businessman can't inspect every cab horse before hiring one. The driver knows his own work. Now get in and be quiet!
        - id: ch02-b12
          speaker: narrator
          text: >-
            My gentle friend had to obey. Box after box was dragged up and fastened on top of the cab or placed beside the driver. When everything was finally ready, my driver jerked the reins as usual, slashed me with the whip, and drove out of the station.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The load was crushingly heavy. I had gone without food or rest since morning, but I kept doing my best, just as I always had, no matter how cruelly or unfairly I was treated.
    - id: ch03
      title: Down on Ludgate Hill
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            I managed fairly well until we reached Ludgate Hill. There, the weight of the load and my exhaustion became too much. I fought to keep moving while the driver kept jerking the reins and using his whip. Then, in a single moment, my feet slipped out from under me. I don't know how it happened. I crashed onto my side with such force that all the breath seemed to leave my body.
        - id: ch03-b02
          speaker: narrator
          text: >-
            I lay perfectly still because I had no strength to move. I thought I was about to die. There was confusion all around me. I heard loud, angry voices and the luggage being taken down, but it all seemed like a dream.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Through the noise, I thought I heard that sweet, sorrowful voice again.
        - id: ch03-b04
          speaker: grace
          emotion: sad
          text: >-
            Oh, that poor horse! This is all our fault.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Someone loosened the throat strap on my bridle and unfastened the traces that held the collar tight against me.
        - id: ch03-b06
          speaker: bystander
          text: >-
            He's dead. He'll never stand up again.
        - id: ch03-b07
          speaker: narrator
          text: >-
            A policeman began giving orders, but I could not even open my eyes. Now and then, I managed one gasping breath. Someone threw cold water over my head. Someone else poured a cordial into my mouth, and then they covered me with something.
        - id: ch03-b08
          speaker: narrator
          text: >-
            I have no idea how long I lay there. At last, I felt life returning. A man with a kind voice patted me and urged me to rise.
        - id: ch03-b09
          speaker: kind_man
          emotion: calm
          text: >-
            Come on now. Try to get up. Easy does it.
        - id: ch03-b10
          speaker: narrator
          text: >-
            They gave me more cordial. After one or two attempts, I staggered to my feet. Then they gently led me to some stables nearby. I was placed in a stall with plenty of bedding, and they brought me warm gruel. I drank it gratefully.
    - id: ch04
      title: Ten Days of Rest
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            By evening, I had recovered enough to be led back to Skinner's stables. I think they did all they could for me there. The next morning, Skinner brought a farrier to examine me. The farrier looked me over very carefully.
        - id: ch04-b02
          speaker: farrier
          text: >-
            This horse is suffering from overwork more than illness. Give him six months at pasture, and he should be able to work again. Right now, though, he hasn't an ounce of strength left.
        - id: ch04-b03
          speaker: skinner
          text: >-
            Then he can go to the dogs. I don't own meadows for nursing sick horses. Maybe he'd recover and maybe he wouldn't, but that doesn't work for my business. I use horses as long as they can keep going. Then I sell them for whatever they'll bring, whether it's to the knacker or somebody else.
        - id: ch04-b04
          speaker: farrier
          text: >-
            If his wind were broken, I'd tell you to have him killed at once. But it isn't. There's a horse sale in about ten days. Let him rest and feed him well until then. He may improve enough to bring you more than the price of his hide.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Skinner followed the advice, though I don't think he liked it. He ordered that I be well fed and cared for. Luckily for me, the stableman carried out those orders far more willingly than Skinner had given them.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Ten days of complete rest helped me more than anything else could have. I had plenty of good oats and hay, along with bran mash mixed with boiled linseed. Those linseed mashes tasted wonderful. I began to think that living might be better than going to the dogs after all.
        - id: ch04-b07
          speaker: narrator
          text: >-
            On the twelfth day after my fall, they took me to a horse sale a few miles outside London. Any change had to be better than staying where I was. So I held my head up and hoped for the best.
