audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    captain:
      display_name: Captain
      tts:
        delivery: seasoned, thoughtful, and quietly grave
        timbre: aged and resonant
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Training and the Voyage
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Captain had been trained as an army horse. His first owner was a cavalry officer who was leaving for the Crimean War. Captain told me he had enjoyed learning his drills with all the other horses. They trotted and turned together, right or left. They stopped at a command, then raced forward at the trumpet or an officer's signal.

            In those days, Captain was a handsome dark iron-gray with dapples. His master was a spirited young gentleman who cared deeply for him and always treated him kindly. Army life seemed very pleasant to Captain at first. Then they had to cross the sea in a great ship, and he nearly changed his mind.
        - id: ch01-b02
          speaker: captain
          emotion: fearful
          text: >-
            That part was dreadful. We couldn't simply walk from the shore onto the ship. They fastened strong straps beneath us and lifted us right off our feet, no matter how hard we struggled. We swung through the air, over the water, and down onto the deck.

            Then they shut us into small, cramped stalls. For a long time, we never saw the sky or had room to stretch our legs. In high winds the ship rolled, throwing us around and making us feel miserable.
        - id: ch01-b03
          speaker: captain
          emotion: happy
          text: >-
            At last the voyage ended. They hauled us up and swung us through the air once more, this time onto land. We were so glad to feel solid ground under our feet again that we snorted and neighed for joy.
        - id: ch01-b04
          speaker: captain
          text: >-
            We soon learned how different that country was from England. The fighting wasn't our only hardship. There was snow and rain, and everything seemed to be in disorder. Still, many of the soldiers loved their horses and did all they could to keep us comfortable.
    - id: ch02
      title: Under Fire
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            I asked Captain if the fighting had been worse than everything else.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Captain wasn't sure. The horses always liked hearing the trumpet call them out, and they were eager to begin. Sometimes they stood waiting for orders for hours. But once the command came, they sprang forward as cheerfully as if there were no cannonballs, bayonets, or bullets ahead.
        - id: ch02-b03
          speaker: captain
          text: >-
            As long as we could feel our riders sitting firmly in the saddle, with steady hands on the reins, none of us gave in to fear. We held on even when those terrible shells screamed through the air and burst into a thousand pieces.
        - id: ch02-b04
          speaker: captain
          text: >-
            My brave master and I went through many battles without being hurt. Around me, horses were shot, pierced by lances, and slashed by sabers. Some lay dead on the field. Others were left dying from terrible wounds. Even then, I don't believe I feared for myself.

            My master's bright voice urged his men onward, and somehow it made me feel that neither of us could be killed. I trusted him completely. While he guided me, I would have charged right up to the mouth of a cannon.
        - id: ch02-b05
          speaker: captain
          text: >-
            I saw brave men cut down and others fall from their saddles with mortal wounds. I heard the cries and groans of the dying. I cantered over ground made slippery with blood, and again and again I turned aside so I wouldn't trample a wounded man or horse.

            Yet I never knew terror until one dreadful day. I will never forget it.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Old Captain stopped and took a long breath. I waited quietly until he began again.
    - id: ch03
      title: Before the Last Charge
      blocks:
        - id: ch03-b01
          speaker: captain
          text: >-
            It was an autumn morning. An hour before dawn, as usual, our cavalry had assembled with every horse saddled and bridled. We were ready for whatever the day might bring, whether it was battle or more waiting. The men stood beside us, listening for orders.

            As the sky grew lighter, the officers seemed uneasy. Before morning had fully come, the enemy's guns began to fire.
        - id: ch03-b02
          speaker: captain
          text: >-
            An officer rode up and ordered the men to mount. In a moment, every rider was in the saddle. Every horse waited for the smallest pull on the reins or pressure from a rider's heels. We were excited and ready, but our training held us still. Only the chewing of our bits and an occasional toss of the head showed how eager we were.
        - id: ch03-b03
          speaker: captain
          text: >-
            My dear master and I stood at the head of the line. While everyone sat motionless and watchful, he noticed a loose lock of my mane hanging on the wrong side. He moved it back and smoothed it with his hand. Then he patted my neck.
        - id: ch03-b04
          speaker: captain
          text: >-
            Bayard, my beauty, today will be a hard one. But we'll do our duty, just as we always have.
        - id: ch03-b05
          speaker: captain
          text: >-
            He kept stroking my neck, more than he ever had before. His hand moved quietly on and on, as though his thoughts were somewhere else. I loved feeling his hand there. I arched my neck, proud and happy, but I stayed perfectly still. I knew every one of his moods. I knew when he wanted me quiet and when he wanted me lively.
        - id: ch03-b06
          speaker: captain
          text: >-
            I can't tell you everything that happened that day. But I can tell you about the last charge we made together. We crossed a valley straight toward the enemy's cannon.

            By then, the roar of heavy guns, the crack of muskets, and shots flying close were nothing new to us. But we had never ridden through fire like that. Shells and shot poured in from the right, the left, and directly ahead.
    - id: ch04
      title: The Charge
      blocks:
        - id: ch04-b01
          speaker: captain
          text: >-
            Brave men went down all around us. Horses fell and hurled their riders onto the ground. Other horses lost their riders and ran wildly out of line. Frightened to be alone, with no guiding hand, they pushed back among their old companions and raced with us toward the guns.
        - id: ch04-b02
          speaker: captain
          text: >-
            Terrible as it was, no one stopped or turned back. Our lines grew thinner every moment. Whenever a comrade fell, the rest of us closed the gap. We didn't slow down or lose our nerve. The closer we came to the cannon, the faster we galloped.
        - id: ch04-b03
          speaker: captain
          text: >-
            My master, my dear master, raised his right arm high and cheered his comrades on. Then a ball whistled close to my head and struck him. He made no sound, but I felt the blow shake him. I tried to slow down. His sword slipped from his right hand, and the reins fell loose from his left. He sank backward out of the saddle and dropped to the earth.

            The other riders swept past. The force of their charge drove me away from him.
        - id: ch04-b04
          speaker: captain
          emotion: fearful
          text: >-
            I wanted to stay beside him and not leave him beneath that rush of horses' feet, but there was nothing I could do. I was alone on that vast field of slaughter, with no master and no friend. Then fear seized me, and I trembled as I had never trembled before.
        - id: ch04-b05
          speaker: captain
          text: >-
            I tried to do what I had seen other riderless horses do. I pushed toward the ranks so I could gallop with them, but the soldiers drove me away with their swords. Then a soldier whose horse had been killed grabbed my bridle and climbed onto my back. With that new rider, I went forward again.
        - id: ch04-b06
          speaker: captain
          text: >-
            Our gallant company was badly overpowered. After the fierce struggle for the guns, those still alive came racing back across the same ground. Some horses had lost so much blood that they could barely move. Some tried to drag themselves along on three legs. Others struggled to lift themselves on their front legs because a shot had shattered their hind legs.

            When the battle ended, the wounded men were carried in, and the dead were buried.
    - id: ch05
      title: What War Looks Like
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            I asked Captain what happened to the wounded horses. Had they simply been left there to die?
        - id: ch05-b02
          speaker: captain
          text: >-
            No. The army farriers crossed the field with pistols and shot every horse that was beyond help. Horses with only slight wounds were brought back and cared for. But most of the noble, willing creatures that had gone out that morning never returned. Only about one horse in four came back to our stables.
        - id: ch05-b03
          speaker: captain
          emotion: sad
          text: >-
            I never saw my dear master again. I believe he died when he fell from the saddle, and I never loved another master as much. I fought in many more battles. I was wounded only once, and it wasn't serious. When the war ended, I returned to England just as sound and strong as when I had left.
        - id: ch05-b04
          speaker: narrator
          text: >-
            I told him I had heard people speak of war as though it were a very fine thing.
        - id: ch05-b05
          speaker: captain
          text: >-
            Then I don't suppose they've ever seen it. War does look fine when there's no enemy, when it's only drills, parades, and pretend battles. Yes, it looks very fine then. But when thousands of good, brave men and horses are killed or crippled for life, it looks very different.
        - id: ch05-b06
          speaker: narrator
          text: >-
            I asked if he knew what they had been fighting about.
        - id: ch05-b07
          speaker: captain
          text: >-
            No. That's more than a horse can understand. Still, the enemy must have been terribly wicked if it was right for us to cross the whole sea just to kill them.
