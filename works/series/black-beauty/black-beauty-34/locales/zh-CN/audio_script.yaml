audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    captain:
      display_name: 上尉
      tts:
        delivery: 沉稳苍老，回忆战场时克制而深切
        timbre: 低沉厚实
        pace: 从容，紧张处略微加快
        pitch: 低
  chapters:
    - id: ch01
      title: 从操练到渡海
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 上尉年轻时受过专门训练，是一匹军马。第一位主人是个年轻气盛的骑兵军官，正要去克里米亚打仗。他很疼上尉，从一开始就照料得格外用心。
        - id: ch01-b02
          speaker: narrator
          text: 那时，上尉一身深铁灰色的斑驳毛皮，模样十分英俊。他还很喜欢跟别的马一起操练。大家一同小跑，一同左右转向，听到口令就停下。军号一响，或是军官发出信号，他们便全速向前冲。
        - id: ch01-b03
          speaker: narrator
          text: 他原以为军马的日子很快活。直到人们要用大船送他们渡海去国外，他才差点改变了看法。
        - id: ch01-b04
          speaker: captain
          text: 渡海那一段真可怕！马又不能从岸上走进船里，人们只好拿结实的吊带兜住我们的身子。任凭我们挣扎，还是被吊得四蹄离地，从海面上空一直荡到大船的甲板上。
          emotion: fearful
        - id: ch01-b05
          speaker: captain
          text: 船上的隔栏又小又闷。我们在里面关了很久，看不见天，也伸不开四条腿。风一大，船就摇得厉害，我们也在里面撞来撞去，实在难受。
        - id: ch01-b06
          speaker: captain
          text: 好在这段日子终于过去了。人们又把我们吊起来，荡过船舷，送回陆地。四蹄重新踩到稳稳的地面，我们高兴得直喷响鼻，放声嘶鸣。
          emotion: happy
        - id: ch01-b07
          speaker: captain
          text: 到了那里，我们很快发现，这个国家和故乡大不一样。除了战斗，还有不少苦头要吃。可许多士兵很爱自己的马。哪怕下雪、淋雨，四下一团乱，什么都不顺手，他们也会想尽办法，好让马过得舒服一点。
        - id: ch01-b08
          speaker: narrator
          text: 那战斗本身呢？难道不比别的苦头都可怕吗？
        - id: ch01-b09
          speaker: captain
          text: 我也说不好。军号一响，命令我们出动，大家听着总很兴奋，恨不得马上奔出去。有时我们得一动不动站上好几个钟头，只等最后那一声号令。可号令一到，照样欢欢喜喜、迫不及待地往前冲，好像面前根本没有炮弹、刺刀和子弹。
        - id: ch01-b10
          speaker: captain
          text: 只要骑手稳稳坐在鞍上，握缰绳的手一点不慌，我们谁也不会害怕。就算炸弹旋转着从空中飞过，再轰的一声碎成千百片，也没有马往后退。
    - id: ch02
      title: 那个永远忘不了的早晨
      blocks:
        - id: ch02-b01
          speaker: captain
          text: 我和主人一起打过很多仗，一直没有受伤。我亲眼见过马被子弹打倒，被长矛刺穿，也见过军刀在他们身上留下可怕的伤口。我们只能把他们留在战场上，有的已经死去，有的还在伤痛里苦苦挣扎。可即使看过这些，我那时也从没替自己害怕过。
        - id: ch02-b02
          speaker: captain
          text: 主人鼓励士兵时，声音总那么有力量。只要听见他，我就觉得我和他都不会死。我完全信任他。由他带着我，哪怕要一直冲到大炮口前，我也愿意。
        - id: ch02-b03
          speaker: captain
          text: 我看过勇敢的人被砍倒，也看过受了致命伤的人从马鞍上跌下来。我听过垂死者的哭喊和呻吟，还曾跑过被鲜血浸得打滑的地面。为了不踩到受伤的人和马，我常常得赶紧转开。
        - id: ch02-b04
          speaker: captain
          text: 可在那个可怕的日子以前，我从不知道真正的恐惧是什么。那一天，我永远忘不了。
        - id: ch02-b05
          speaker: narrator
          text: 老上尉说到这里，停下来，深深吸了一口气。我没有催他，只静静等着。过了一会儿，他继续讲下去。
        - id: ch02-b06
          speaker: captain
          text: 那是一个秋天的早晨。天亮前一个钟头，骑兵队已经出来了。所有马都带齐装具，准备应付这一天。也许要战斗，也许只是等候。士兵们站在马旁，等着命令。
        - id: ch02-b07
          speaker: captain
          text: 天色越来越亮，军官们中间像是出了什么动静。清晨还没真正过去，我们便听见敌人的炮响。
        - id: ch02-b08
          speaker: captain
          text: 一名军官骑马过来，下令上马。一眨眼，所有士兵都坐进了鞍子。每匹马都站在那里，等着缰绳轻轻一动，或是骑手用脚跟碰一下身子。大家都来了精神，浑身都是劲，只等着出发。
        - id: ch02-b09
          speaker: captain
          text: 不过，我们训练得很好。除了咬得嚼铁作响，偶尔不安地甩甩头，谁也没有挪动。
        - id: ch02-b10
          speaker: captain
          text: 我和主人在队伍最前面。所有人都静静坐着，警觉地等候。主人看到我有一小绺鬃毛翻错了边，就替我理回去，再用手抚平。
        - id: ch02-b11
          speaker: captain
          text: 他拍了拍我的脖子，对我说：“贝亚德，我的漂亮伙计，今天准有一场硬仗。不过，我们还像从前一样，尽好自己的本分。”
          emotion: calm
        - id: ch02-b12
          speaker: captain
          text: 那天早晨，他摸了我一次又一次，比从前任何时候都多。他的手很安静，心里仿佛还在想着别的事。我喜欢他这样抚摸，便骄傲又快活地弓起脖子，可脚下一动不动。我了解他的每一种心情，知道他什么时候要我安静，什么时候要我活泼。
    - id: ch03
      title: 最后一次冲锋
      blocks:
        - id: ch03-b01
          speaker: captain
          text: 那一天的事，我没法全说完。我只讲我和主人最后一次一起冲锋。我们得横穿一道山谷，敌人的大炮就在正前面。
        - id: ch03-b02
          speaker: captain
          text: 那时，我们早听惯了重炮轰鸣和步枪密集的响声，炮弹从身边飞过也不新鲜。可那天的火力，是我从未经历过的。枪弹和炮弹从左边、右边、正前方，一齐向我们打来。
        - id: ch03-b03
          speaker: captain
          text: 勇敢的士兵一个接一个倒下，许多马也摔倒，把骑手掀在地上。失去骑手的马发疯似的冲出队列，可身边没有人引路，他们又吓得挤回老伙伴中间，跟着队伍继续冲锋。
        - id: ch03-b04
          speaker: captain
          text: 情形再可怕，也没有谁停下，没有谁回头。队伍越来越稀。伙伴一倒下，我们就彼此靠拢，不让阵形散掉。越靠近大炮，我们反倒跑得越快。
        - id: ch03-b05
          speaker: captain
          text: 我的主人，我亲爱的主人，正高举右臂，给战友们鼓劲。忽然，一颗炮弹贴着我的头呼啸而过，击中了他。我感觉他的身子猛地一晃，可他没有喊叫。
        - id: ch03-b06
          speaker: captain
          text: 我想慢下来，可军刀已经从他的右手掉了，缰绳也从左手松开。他向后倒出马鞍，重重摔在地上。其他骑兵从旁边冲过去，那股力量硬把我带离了他。
        - id: ch03-b07
          speaker: captain
          text: 我只想留在主人身边，不愿让他躺在奔腾的马蹄下面，可我怎么也回不去。没有了主人，也没有朋友，我独自站在那片巨大的屠场上。恐惧抓住了我，我从来没有抖得那么厉害。
          emotion: fearful
        - id: ch03-b08
          speaker: captain
          text: 我学着那些失去骑手的马，想挤进队伍，跟他们一起跑，却被士兵用剑赶开。这时，一个坐骑被打死的士兵抓住我的缰绳，骑到我背上。我驮着这个新主人，又往前冲。
        - id: ch03-b09
          speaker: captain
          text: 可我们这支英勇的队伍到底敌不过对方。大家为争夺大炮苦战一场，活下来的人又沿着刚才冲锋的原路飞奔回来。有的马伤得太重，血流得太多，几乎走不动了。有的高贵的生命只剩三条腿能用，还在拼命拖着身子往前挪。还有些马的后腿被炮弹打碎，只能靠前腿挣扎着想站起来。
        - id: ch03-b10
          speaker: captain
          text: 战斗结束后，伤兵被抬了回来，死去的人也被安葬了。
        - id: ch03-b11
          speaker: narrator
          text: 那受伤的马呢？难道就把他们扔在那里等死吗？
        - id: ch03-b12
          speaker: captain
          text: 没有。军队的蹄铁匠带着手枪走遍战场，把已经救不回来的马一匹匹射杀。伤得轻的，有些被带回来照料。可那天早晨出发的那些高贵又温顺的马，大多数再也没回来。马厩里每四匹马，大约只回来一匹。
          emotion: sad
    - id: ch04
      title: 战争的另一副模样
      blocks:
        - id: ch04-b01
          speaker: captain
          text: 从那以后，我再也没见过亲爱的主人。我想，他掉下马鞍时就已经死了。我后来再没有那样爱过别的主人。
          emotion: sad
        - id: ch04-b02
          speaker: captain
          text: 我又参加了许多战斗，却只受过一次伤，而且不严重。战争结束后，我回到英格兰，身体还像出发时一样健康强壮。
        - id: ch04-b03
          speaker: narrator
          text: 我听人说起战争，总把它讲得像一件很了不起的好事。
        - id: ch04-b04
          speaker: captain
          text: 那些人准没亲眼见过战争。没有敌人时，只操练、检阅，再来一场演习，看上去当然很威风。那时候，确实很威风。
        - id: ch04-b05
          speaker: captain
          text: 可要是成千上万善良勇敢的人和马被杀死，或是一辈子残疾，战争看起来就完全不同了。
        - id: ch04-b06
          speaker: narrator
          text: 那你知道，他们到底为什么打仗吗？
        - id: ch04-b07
          speaker: captain
          text: 不知道。这种事，一匹马可弄不明白。不过，要是特意漂洋过海去杀那些人也算做得对，那些敌人一定坏得不得了吧。
