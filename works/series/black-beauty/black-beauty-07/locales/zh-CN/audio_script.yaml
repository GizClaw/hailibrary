audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述成长经历时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    ginger:
      display_name: 金吉尔
      tts:
        delivery: 坦率而敏感，回忆受伤往事时带着压抑不住的烈性
        timbre: 清亮而略显沙哑
        pace: 自然，情绪激动时稍快
        pitch: 中
    old_master:
      display_name: 莱德先生
      tts:
        delivery: 亲切而果断，安抚马匹时格外温柔
        timbre: 饱满清晰的老年男声
        pace: 沉稳从容
        pitch: 中低
    samson:
      display_name: 萨姆森
      tts:
        delivery: 粗硬傲慢，受挫后满腹怨气
        timbre: 粗粝有力
        pace: 偏快
        pitch: 低
  chapters:
    - id: ch01
      title: 树荫下的谈话
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有一天，我和金吉尔单独站在树荫下，聊了很久。她问起我从小是怎么长大的，又是怎么受训的，我便全都讲给她听。
        - id: ch01-b02
          speaker: ginger
          text: 唉，如果我也像你那样长大，也许脾气会和你一样好。可现在，我恐怕永远都不会有那样的好脾气了。
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: 我问她，为什么这样说。
        - id: ch01-b04
          speaker: ginger
          text: 因为我经历的一切都和你不一样。从来没有一匹马、也没有一个人真心待我好，更没有谁能让我愿意讨他欢心。
    - id: ch02
      title: 没有人温柔相待
      blocks:
        - id: ch02-b01
          speaker: ginger
          text: 我刚断奶就离开了母亲，被放进一群小马驹中间。它们不在乎我，我也不在乎它们。我身边没有你那样慈爱的主人，没有人照看我、陪我说话，也没有人给我带好吃的东西。管我们的那个人一辈子没对我说过一句好话。他倒没有虐待我们，可除了让我们吃饱、冬天有地方躲避风雨，他什么也不管。
        - id: ch02-b02
          speaker: ginger
          text: 有一条小路从牧场中间穿过。那些大孩子经过时，常朝我们扔石头，只为了看我们四处飞奔。我没有挨中过，可有一匹漂亮的小马驹被石头划破了脸，那道疤大概要留一辈子。我们本来并不理会那些孩子，经这一闹却变得更野，也把所有男孩子都当成了敌人。
        - id: ch02-b03
          speaker: ginger
          text: 不受拘束的时候，我们倒也过得很快活。大家在草场上来回飞奔，绕着牧场你追我赶，累了就停在树荫下面。可等到人们要训练我，苦日子便开始了。
        - id: ch02-b04
          speaker: ginger
          text: 好几个人一起来抓我，把我逼进牧场的角落。一个揪着我的额发，一个死死捏住我的鼻子，我几乎连气也喘不上来。还有人抓住我的下颌，硬把嘴撬开。他们强行给我套上笼头，把横衔塞进嘴里。接着，一个人在前面拖，另一个在后面抽。这就是我第一次领教人的“善意”。没有解释，也没有让我明白的机会，从头到尾只有强迫。
          emotion: angry
        - id: ch02-b05
          speaker: ginger
          text: 我血统好，性子也烈。那时确实很野，想必没少给他们添麻烦。可我从前一直自由自在，突然一天又一天被关在隔栏里，怎么能不难受？我烦躁得吃不下东西，只想逃出去。你也受过训练，当然知道，就算主人温柔肯哄，这件事也够难熬了。我那里却一点温情都没有。
    - id: ch03
      title: 萨姆森的硬手段
      blocks:
        - id: ch03-b01
          speaker: ginger
          text: 只有一个人不一样，就是老主人莱德先生。我想，他很快就能取得我的信任，让我心甘情愿地照他说的做。可他已经把最难的活儿交给儿子和另一位老练的驯马师，自己只偶尔亲自过来查看情况。
        - id: ch03-b02
          speaker: ginger
          text: 他的儿子高大、强壮，胆子也很大，大家叫他萨姆森。他总夸口，说没有哪匹马能把他摔下来。他不像父亲那样温和。他的声音硬，眼神硬，手也硬。我一开始就知道，他想把我的精神全磨掉，把我变成一块安静、低顺、听话的马肉。马肉！对他来说，我不过就是这个。
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: 一说到萨姆森，金吉尔又气得跺起蹄子。随后，她继续讲了下去。
        - id: ch03-b04
          speaker: ginger
          text: 我只要没有完全按他的意思做，他就会发火。他用长缰绳赶着我绕训练场跑，一直跑到我精疲力尽。我想他很爱喝酒，而且他喝得越多，对我就越狠。
        - id: ch03-b05
          speaker: ginger
          text: 有一天，他想尽办法折腾我。等我终于躺下，已经又累、又痛苦、又愤怒，只觉得这一切太不公平。第二天一早，他又来赶我绕圈跑。还没让我歇上一个钟头，他便带着马鞍、缰绳和一种新嚼子回来。
    - id: ch04
      title: 训练场上的搏斗
      blocks:
        - id: ch04-b01
          speaker: ginger
          text: 我到现在也不知道事情到底是怎么闹起来的。他刚骑到我背上，我不知哪一下惹怒了他，他猛地勒紧缰绳。新嚼子疼得厉害，我一下扬起前蹄。他更加恼火，举起鞭子便抽。
        - id: ch04-b02
          speaker: ginger
          text: 我全身的烈性都被激了起来，只想反抗。我踢腿、蹦跳、一次次直立起来，闹得比从前任何时候都凶。我们真的打了一场。他在鞍上撑了很久，用鞭子和马刺残酷地惩罚我。可那时我已经怒不可遏，只要能甩掉他，他怎么伤我，我都顾不上了。
          emotion: angry
        - id: ch04-b03
          speaker: ginger
          text: 一番可怕的搏斗之后，我终于把他从后面摔了下去。我听见他重重落在草地上，头也没回，一口气跑到牧场另一头。我在那里转身，看着那个折磨我的人慢慢爬起来，走回马厩。我躲到一棵橡树下等着，却一直没人来抓我。
        - id: ch04-b04
          speaker: ginger
          text: 太阳火辣辣地晒着。苍蝇成群围过来，落在我流血的两胁上。那些伤口，全是马刺扎出来的。我从清早起就没吃东西，已经饿坏了，可草地上的草少得连一只鹅都养不活。我想躺下休息，紧紧缚着的马鞍又让我没法舒服地躺着。那里连一滴水也没有。
        - id: ch04-b05
          speaker: ginger
          text: 下午一点点过去，太阳也慢慢沉了下去。别的小马驹都被领进去了，我知道，它们正在吃一顿饱饭。
          emotion: sad
    - id: ch05
      title: 老主人的声音
      blocks:
        - id: ch05-b01
          speaker: ginger
          text: 太阳刚落下时，老主人终于出来了，手里拿着一只装燕麦的筛子。他满头白发，是位仪表堂堂的老先生。可真正让我永远不会认错的，是他的声音。那声音不高也不低，饱满、清楚，而且亲切。他下命令时又沉稳又果断，人和马一听都知道，他说的话是一定要照办的。
        - id: ch05-b02
          speaker: ginger
          text: 他慢慢朝我走来，偶尔晃一晃筛里的燕麦，还用轻快温柔的声音呼唤我。
        - id: ch05-b03
          speaker: old_master
          text: 来吧，小姑娘。过来吧，小姑娘。来吧，过来吧。
          emotion: calm
        - id: ch05-b04
          speaker: ginger
          text: 我站在原地，让他走到身边。他把燕麦递给我，我一点也不害怕，低头便吃。他的声音把我的恐惧全都赶走了。我吃着，他就在旁边轻轻拍我、抚摸我。看见我两胁凝着血块，他很生气。
        - id: ch05-b05
          speaker: old_master
          text: 可怜的小姑娘。这事办得太糟了，真是太糟了。
          emotion: sad
        - id: ch05-b06
          speaker: ginger
          text: 他轻轻牵住缰绳，带我回马厩。萨姆森正站在门口。我一见他，便把耳朵紧贴向后，张嘴要咬。
        - id: ch05-b07
          speaker: old_master
          text: 退后，离她远一点。你今天可把这匹小母马害苦了。
          emotion: angry
        - id: ch05-b08
          speaker: samson
          text: 这畜生本来就凶得很。
          emotion: angry
        - id: ch05-b09
          speaker: old_master
          text: 你听好了。脾气坏的人，永远调教不出脾气好的马。萨姆森，你还没学会这门手艺。
          emotion: angry
        - id: ch05-b10
          speaker: ginger
          text: 他把我带进单间，亲手卸下马鞍和缰绳，再把我拴好。随后，他叫人拿来温水和海绵，脱下外衣。马夫提着水桶，他一点点替我擦洗两胁，动作非常轻柔。他一定知道，那些伤有多重，又有多疼。
        - id: ch05-b11
          speaker: old_master
          text: 吁，漂亮姑娘。站稳，站稳。
          emotion: calm
        - id: ch05-b12
          speaker: ginger
          text: 光听着他的声音，我就好受多了，温水洗过伤口更是舒服。我的嘴角已经磨破，干草梗一碰就疼，根本吃不了。他仔细看了看，摇摇头，叫马夫拿来上好的麸皮粥，还在里面添了谷粉。
        - id: ch05-b13
          speaker: ginger
          text: 那份粥真好吃，又软和，吃下去连嘴上的伤都舒服了。他一直陪在旁边，一面抚摸我，一面和马夫说话。
        - id: ch05-b14
          speaker: old_master
          text: 这样一匹性子刚烈的马，如果不能用公道温和的办法驯服，以后就再也不会有什么用了。
        - id: ch05-b15
          speaker: ginger
          text: 从那以后，老主人常来看我。等嘴上的伤好了，另一位驯马师接手训练我，大家叫他乔布。他做事沉稳，也很细心，我很快就听懂了他的意思。
