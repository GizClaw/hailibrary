audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    ginger:
      display_name: Ginger
      tts:
        delivery: spirited, candid, and emotionally guarded
        timbre: rich and slightly rough
        pace: moderately brisk
        pitch: medium
    old_master:
      display_name: Mr. Ryder
      tts:
        delivery: kind, steady, and quietly authoritative
        timbre: full and clear
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Ginger's Early Days
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One day, Ginger and I were alone together in the shade. We talked for a long time. She wanted to hear how I had been raised and trained, so I told her.
        - id: ch01-b02
          speaker: ginger
          text: >-
            Well, if I had grown up as you did, perhaps my temper would be as good as yours. But I don't think it ever will be now.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I asked her why.
        - id: ch01-b04
          speaker: ginger
          text: >-
            Because my life was completely different. As soon as I was weaned, they took me from my mother and put me with a group of young colts. None of them cared about me, and I cared just as little about them. I had no kind master like yours to watch over me, speak gently to me, or bring me treats.

            The man in charge never once gave me a kind word. He didn't abuse us, but all he cared about was making sure we had enough food and some shelter in winter. A footpath crossed our field. Big boys often came along and threw stones just to make us run. They never hit me, but one fine young colt had his face badly cut. I expect he carried that scar for life. After that, we decided boys were our enemies, and their cruelty only made us wilder.

            We did have great fun in the open meadows. We galloped up and down, chased one another around the field, and rested beneath the trees. But when they began training me, everything changed.
        - id: ch01-b05
          speaker: ginger
          text: >-
            Several men came after me. At last they trapped me in a corner. One grabbed my forelock. Another clamped my nose so tightly that I could hardly breathe. A third seized my lower jaw and forced my mouth open. That was how they got the halter on me and shoved the bar into my mouth. One man dragged me forward by the halter while another whipped me from behind.

            That was my first experience of men's kindness. It was all force. They never gave me a chance to understand what they wanted. I was well bred, full of spirit, and certainly very wild. I'm sure I gave them plenty of trouble. But being shut in a stall day after day was dreadful after all that freedom. I worried and pined, and all I wanted was to escape. You know how hard confinement can be even with a gentle master who coaxes you. I had none of that.
    - id: ch02
      title: The Fight with Samson
      blocks:
        - id: ch02-b01
          speaker: ginger
          text: >-
            There was one man who might have won me over. He was the old master, Mr. Ryder. I believe he could have done anything with me. But he had left the hardest training to his son and another experienced man, and only stopped by now and then to supervise.

            His son was tall, strong, and bold. They called him Samson, and he boasted that no horse had ever thrown him. He had none of his father's gentleness. Everything about him was hard. His voice, his eyes, and his hands were hard. From the beginning, I felt that he meant to crush every bit of spirit out of me and turn me into a meek, obedient piece of horseflesh. Horseflesh! That was all I was to him.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Ginger stamped her foot. Even the thought of Samson still made her angry. Then she continued.
        - id: ch02-b03
          speaker: ginger
          emotion: angry
          text: >-
            If I failed to do exactly what he wanted, he lost his temper. He made me circle the training field on a long rein until I was worn out. I think he drank heavily, and the more he drank, the worse he treated me.

            One day, he worked me as hard as he possibly could. When I finally lay down, I was exhausted, miserable, and angry. It all felt terribly unfair. Early the next morning, he took me out and ran me in circles for another long stretch. I had barely rested an hour before he returned with a saddle, a bridle, and a new kind of bit.

            I never understood exactly how it started. He had only just mounted me in the training ground when something I did made him furious. He jerked the rein hard. The new bit hurt terribly, and I suddenly reared. That enraged him even more, and he began whipping me.

            Every part of me turned against him. I kicked, plunged, and reared more fiercely than I ever had before. It became a real fight. For a long time, he stayed in the saddle and punished me cruelly with his whip and spurs. But by then my blood was up. I didn't care what he did, as long as I could throw him off.

            At last, after a terrible struggle, I hurled him backward. I heard him strike the ground hard. Without looking back, I galloped to the far end of the field. When I turned, I saw my persecutor slowly get up and walk into the stable.
        - id: ch02-b04
          speaker: ginger
          text: >-
            I waited under an oak tree, but no one came for me. The hours passed. The sun beat down, and flies swarmed around the bleeding places where the spurs had cut my sides. I was hungry because I had eaten nothing since early morning, and that meadow hardly had enough grass for a goose. I wanted to lie down, but the saddle was strapped too tightly for me to rest. There wasn't even a drop of water.

            The afternoon dragged on and the sun sank lower. I watched the other colts being led inside, and I knew they were getting a good meal.
    - id: ch03
      title: The Old Master's Kindness
      blocks:
        - id: ch03-b01
          speaker: ginger
          text: >-
            At last, just as the sun was setting, the old master came out carrying a sieve. He was a fine old gentleman with snow-white hair, but I would have known his voice among a thousand. It was neither high nor low. It was full, clear, and kind. When he gave an order, his voice was so steady and certain that horses and men alike knew he expected them to obey.

            He approached quietly, shaking the oats in the sieve now and then. All the while, he spoke to me in a cheerful, gentle voice.
        - id: ch03-b02
          speaker: old_master
          emotion: calm
          text: >-
            Come along, lassie. That's it. Come along now.
        - id: ch03-b03
          speaker: ginger
          text: >-
            I stayed where I was and let him reach me. He offered me the oats, and I ate without fear. His voice had taken all my fear away. As I ate, he stood beside me, patting and stroking me. Then he noticed the clotted blood on my sides, and he was deeply upset.
        - id: ch03-b04
          speaker: old_master
          text: >-
            Poor lassie. This was badly done. Badly done.
        - id: ch03-b05
          speaker: ginger
          text: >-
            He quietly took the rein and led me toward the stable. Samson was standing right beside the door. I pinned my ears back and snapped at him.
        - id: ch03-b06
          speaker: old_master
          text: >-
            Get back, and stay out of her way. You've done terrible work with this filly today.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Samson muttered something about a vicious brute.
        - id: ch03-b08
          speaker: old_master
          text: >-
            Listen to me, Samson. A bad-tempered man will never make a good-tempered horse. You haven't learned your trade yet.
        - id: ch03-b09
          speaker: ginger
          text: >-
            The old master led me into my box. With his own hands, he removed the saddle and bridle and tied me up. Then he asked for warm water and a sponge. He took off his coat, and while the stableman held the pail, he gently washed my sides for a long time. I knew he understood how bruised and sore they were.
        - id: ch03-b10
          speaker: old_master
          emotion: calm
          text: >-
            Whoa, my pretty one. Stand still now. Stand still.
        - id: ch03-b11
          speaker: ginger
          text: >-
            Just hearing his voice made me feel better, and the warm bathing was wonderfully soothing. The corners of my mouth were so raw that the hay stalks hurt too much for me to eat. He examined my mouth closely, shook his head, and told the man to bring me a good bran mash with meal mixed into it.

            That mash tasted so good, and it felt soft and healing in my mouth. The old master stayed beside me the whole time I ate. He stroked me as he spoke to the man.
        - id: ch03-b12
          speaker: old_master
          text: >-
            If a high-spirited creature like this cannot be trained with fair treatment, she will never be useful at all.
        - id: ch03-b13
          speaker: ginger
          text: >-
            After that, he came to see me often. Once my mouth had healed, the other trainer took over. His name was Job. He was steady and thoughtful, and I quickly learned what he wanted from me.
