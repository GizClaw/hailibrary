  chapters:
    - id: ch01
      title: A Lesson for the Boys
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Mr. Blomefield, the vicar, had a large family of boys and girls. Sometimes they came to play with Miss Jessie and Flora. One girl was Jessie's age, two boys were older, and there were several younger children.

            Whenever they visited, Merrylegs had plenty to do. Nothing delighted them more than taking turns on his back and riding all around the orchard and the paddock near the house. They could keep at it for hours.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One afternoon, Merrylegs had been out with them for a long while. James brought him into the stable, put on his halter, and warned him to behave himself or there would be trouble.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I asked Merrylegs what he had done.
        - id: ch01-b04
          speaker: merrylegs
          text: >-
            Oh, I only taught those young people a lesson. They didn't know when they'd had enough, or when I'd had enough. So I tipped them off backward. That was the one thing they understood.
        - id: ch01-b05
          speaker: narrator
          text: >-
            I was shocked. I asked if he had really thrown the children off, and whether he had thrown Miss Jessie or Miss Flora.
        - id: ch01-b06
          speaker: merrylegs
          emotion: angry
          text: >-
            Of course I didn't! I wouldn't do that for the finest oats in the stable. I'm as careful with our young ladies as the master himself. And I'm the one who teaches the little children to ride.

            If they seem frightened or a bit unsteady on my back, I move as softly and quietly as an old cat stalking a bird. Once they're settled, I speed up again so they can get used to it. You don't need to lecture me. Those children couldn't have a better friend or riding teacher.

            I wasn't talking about them. I meant the boys. Boys are different. They need training, just as we did when we were colts. Someone has to teach them how things work.
    - id: ch02
      title: What Merrylegs Did
      blocks:
        - id: ch02-b01
          speaker: merrylegs
          text: >-
            The other children had already ridden me for nearly two hours when the boys decided it was their turn. That was fair enough, and I didn't object. They took turns riding while I galloped up and down the fields and around the orchard for another full hour.

            Each boy had cut himself a thick hazel stick to use as a whip. They hit me a little too hard, but I put up with it. At last, I decided we'd all done enough. I stopped two or three times to give them a hint.

            Boys seem to think a horse or pony is some kind of steam engine or threshing machine. They expect us to go as long and as fast as they want. It never occurs to them that a pony gets tired or has feelings.

            The boy whipping me still didn't understand, so I rose onto my hind legs and let him slide off behind me. Nothing more than that. He climbed back on, and I did it again. Then the other boy mounted. The moment he started with his stick, I set him down on the grass. I kept doing that until they finally understood.

            They aren't bad boys, and they don't mean to be cruel. I like them well enough. But I had to teach them. When they brought me to James and told him what happened, he saw those big sticks and became very angry. He said sticks like that belonged with drovers or gypsies, not young gentlemen.
        - id: ch02-b02
          speaker: ginger
          emotion: angry
          text: >-
            If I'd been in your place, I would have given those boys a hard kick. That would have taught them.
        - id: ch02-b03
          speaker: merrylegs
          text: >-
            I'm sure you would have. But, if you'll forgive me, I'm not foolish enough to anger our master or make James ashamed of me. Besides, the children are my responsibility while they're riding. They've been trusted to me.
        - id: ch02-b04
          speaker: merrylegs
          text: >-
            Why, just the other day, I heard our master speaking to Mrs. Blomefield.
        - id: ch02-b05
          speaker: master
          emotion: calm
          text: >-
            My dear madam, you needn't worry about the children. My old Merrylegs will care for them as well as you or I could. I wouldn't sell that pony for any amount of money. He is wonderfully good-tempered and trustworthy.
        - id: ch02-b06
          speaker: merrylegs
          text: >-
            Do you think I could forget five years of kind treatment and all the trust they've placed in me? Should I turn vicious just because two ignorant boys treated me badly? No, no.

            You've never had a good home where people were kind to you, so you don't understand. I'm sorry for that. But I can tell you this. Good places make good horses. I wouldn't upset our people for anything. I truly love them.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Merrylegs gave a low "ho, ho, ho" through his nose. It was the same sound he made in the morning when he heard James coming to the stable door.
    - id: ch03
      title: A Good Home
      blocks:
        - id: ch03-b01
          speaker: merrylegs
          text: >-
            And where would I end up if I started kicking? I'd be sold before I knew it, with no good character to my name.

            I might spend my days slaving for a butcher's boy. Or I could be worked to death at some seaside town, where no one cared about me except to see how fast I could go. I might be whipped along in a cart carrying three or four big men out for a Sunday spree. I saw that often enough at the place where I lived before this one.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Merrylegs shook his head.
        - id: ch03-b03
          speaker: merrylegs
          emotion: fearful
          text: >-
            No. I hope I never come to that.
