audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述成长经历时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    merrylegs:
      display_name: 快乐脚
      tts:
        delivery: 活泼自信，热心健谈，偶尔摆出老资格的神气
        timbre: 轻快明亮
        pace: 稍快而灵动
        pitch: 中高
    ginger:
      display_name: 金吉尔
      tts:
        delivery: 坦率而敏感，回忆受伤往事时带着压抑不住的烈性
        timbre: 清亮而略显沙哑
        pace: 自然，情绪激动时稍快
        pitch: 中
    james:
      display_name: 詹姆斯
      tts:
        delivery: 开朗随和，谈话时自然爽快
        timbre: 年轻清亮
        pace: 适中
        pitch: 中
    squire:
      display_name: 戈登乡绅
      tts:
        delivery: 明快稳健，待人和气而有主见
        timbre: 厚实清晰
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 孩子们来骑马
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 布洛姆菲尔德先生是位牧师，家里有一大群孩子，男孩女孩都有。他们有时会来找杰茜小姐和弗洛拉小姐玩。一个女孩和杰茜小姐同岁，两个男孩更大些，此外还有好几个小不点儿。
        - id: ch01-b02
          speaker: narrator
          text: 每逢他们过来，快乐脚就忙起来了。孩子们最喜欢轮流爬上他的背，在果园和近宅牧场里骑得到处跑。一玩起来，几个钟头很快就过去了。
        - id: ch01-b03
          speaker: narrator
          text: 一天下午，快乐脚已经陪他们在外面待了很久。詹姆斯把他牵回马厩，给他套上笼头，还特意叮嘱了他一句。
        - id: ch01-b04
          speaker: james
          text: 好啦，你这个淘气鬼。接下来可要规矩些，要不然，咱们都得惹麻烦。
        - id: ch01-b05
          speaker: narrator
          text: 我听了十分奇怪，便问快乐脚，他究竟做了什么。
        - id: ch01-b06
          speaker: merrylegs
          text: 嗐，我只是给那些年轻人上了一课。他们不知道自己什么时候该停，也不管我什么时候该歇。我只好让他们从我背后滑下去。除此以外，他们什么都听不明白。
        - id: ch01-b07
          speaker: narrator
          text: 我吃了一惊。他居然把孩子们摔了下去！我原以为他很明白事理，绝不会这样做。我赶紧问他，杰茜小姐和弗洛拉小姐是不是也被摔了。
        - id: ch01-b08
          speaker: narrator
          text: 快乐脚听了，简直像受了莫大的冒犯。
        - id: ch01-b09
          speaker: merrylegs
          text: 当然没有！就算把世上最好的燕麦摆在我面前，我也不会那样对待两位小小姐。主人有多仔细，我照看她们就有多仔细。那些年幼的孩子，还是我教会他们骑马的呢。
        - id: ch01-b10
          speaker: merrylegs
          text: 孩子要是害怕了，或者在我背上坐不稳，我就走得特别平稳，特别安静，像老猫悄悄追鸟一样。等他们坐好了，我才一点点加快，让他们慢慢习惯。你不用来教训我。那些孩子最好的朋友和骑术老师，就是我。
    - id: ch02
      title: 快乐脚的一课
      blocks:
        - id: ch02-b01
          speaker: merrylegs
          text: 我说的不是那些小孩子，是那两个男孩。男孩可完全不一样。他们也得像我们小时候那样受点调教，才会懂规矩。
        - id: ch02-b02
          speaker: merrylegs
          text: 别的孩子骑着我跑了快两个钟头，两个男孩才觉得该轮到自己。他们这么想也没错，我也愿意驮他们。后来，他们轮流骑我，我在田野里来来回回飞跑，又绕着果园跑了个遍。这一跑，足足又是一个钟头。
        - id: ch02-b03
          speaker: merrylegs
          text: 两个人都砍了根粗大的榛木棍，当成马鞭来用。他们下手重了一点，起初我没跟他们计较。可后来，我觉得大家都已经跑够了，就停下两三次，想提醒他们该歇歇了。
        - id: ch02-b04
          speaker: merrylegs
          text: 可男孩子总把马和小马当成蒸汽机或脱谷机。他们想叫我们跑多快、跑多久，我们就该一直跑下去。他们从来不想，小马也会累，也有感觉。
        - id: ch02-b05
          speaker: merrylegs
          text: 骑在我背上挥棍子的那个男孩，一点也没懂我的提醒。我就抬起前腿，用后腿站起来，让他从后面滑到了地上。事情就这么简单。
        - id: ch02-b06
          speaker: merrylegs
          text: 他重新骑上来，我就再做一次。另一个男孩接着上了我的背。他刚挥起木棍，我便把他也放到草地上。他们一次次爬上来，我也一次次让他们下去。到后来，他们总算明白我的意思了。
        - id: ch02-b07
          speaker: merrylegs
          text: 他们并不是坏孩子，也不想存心虐待我。我其实很喜欢他们，只是非给他们上这一课不可。他们把我交给詹姆斯时，也把事情说了。詹姆斯一看见那两根粗木棍，气得可不轻。
        - id: ch02-b08
          speaker: james
          text: 这种棍子只配给赶牲口的人或吉卜赛人用，年轻绅士可不该拿它抽马。
        - id: ch02-b09
          speaker: ginger
          text: 换成我，我一定狠狠踢那两个男孩一脚。那才叫给他们一个教训。
    - id: ch03
      title: 托付给快乐脚的孩子
      blocks:
        - id: ch03-b01
          speaker: merrylegs
          text: 你当然会这么干。请你原谅，可我还没傻到为了这件事惹主人发火，也不想让詹姆斯因为我而抬不起头。
        - id: ch03-b02
          speaker: merrylegs
          text: 再说，孩子们骑在我背上，就归我照看。人家把他们托付给了我，我可不能忘记这件事。
        - id: ch03-b03
          speaker: merrylegs
          text: 就在前几天，我亲耳听见主人和布洛姆菲尔德太太说话。
        - id: ch03-b04
          speaker: squire
          text: 亲爱的太太，你不用担心孩子。我的老快乐脚会像你我一样仔细照看他们。无论别人出多少钱，我也不会卖掉这匹小马。他的脾气好得挑不出一点毛病，而且完全靠得住。
        - id: ch03-b05
          speaker: merrylegs
          text: 你说，我能忘掉他们对我的信任吗？我在这里住了五年，得到的全是善待。难道只因为两个不懂事的男孩对我不好，我就该变成一头凶恶又忘恩负义的畜生？不，我绝不会。
        - id: ch03-b06
          speaker: merrylegs
          text: 你从来没住过一个人人都善待你的好地方，所以你不明白这些。我真替你难过。不过我可以告诉你，好地方会养出好马。无论如何，我都不愿意让这里的人伤心。我爱他们，我真的爱。
        - id: ch03-b07
          speaker: narrator
          text: 快乐脚说到这里，从鼻子里低低地发出“呵、呵、呵”的声音。每天早晨，只要听见詹姆斯走到门外，他总会这样轻声欢叫。
    - id: ch04
      title: 他不愿失去的家
      blocks:
        - id: ch04-b01
          speaker: merrylegs
          text: 还有，要是我从此养成踢人的习惯，接下来会怎么样？用不了多久，我就会被卖掉，连好名声也没有了。
        - id: ch04-b02
          speaker: merrylegs
          text: 到那时，我说不定会落到肉铺的小伙计手里，整天替他当苦力。也可能被送到海滨的游乐地，活活干到累死。那里的人根本不管我舒不舒服，只想知道我究竟能跑多快。
        - id: ch04-b03
          speaker: merrylegs
          text: 或许我还会被套在一辆车上，车里挤着三四个大块头。他们星期日出门寻欢作乐，一路拿鞭子赶我。来这里以前，我住过的那个地方就常有这种事，我亲眼见过许多次。
        - id: ch04-b04
          speaker: narrator
          text: 快乐脚摇了摇头。
        - id: ch04-b05
          speaker: merrylegs
          text: 不，我但愿自己永远不会落到那种境地。
