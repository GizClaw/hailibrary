audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    john:
      display_name: John Manly
      tts:
        delivery: steady, good-humored, and deeply sincere
        timbre: mature and grounded
        pace: unhurried
        pitch: medium-low
    thomas_green:
      display_name: Thomas Green
      tts:
        delivery: kindhearted and plainspoken
        timbre: mature and gentle
        pace: conversational
        pitch: medium
  chapters:
    - id: ch01
      title: Only Ignorance
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I never knew how long I was sick. Mr. Bond, the horse doctor, came to see me every day. On one of those visits, he bled me while John held the pail. Afterward I felt so weak that I thought I was dying. I believe everyone else feared the same thing.

            Ginger and Merrylegs were moved to the other stable so I could have quiet. The fever made every sound seem loud. I could hear each person's footsteps between the house and the stable, so I knew everything that was happening.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One night, John had to give me some medicine, and Thomas Green came in to help. When I had swallowed it, John did all he could to make me comfortable. He planned to wait half an hour and see how the medicine affected me. Thomas offered to wait too.

            They sat on a bench that had been carried into Merrylegs's stall. To keep the light from bothering me, they set the lantern by their feet. For a while, neither man spoke. Then Thomas lowered his voice.
        - id: ch01-b03
          speaker: thomas_green
          text: >-
            John, couldn't you say something kind to Joe? The boy's heartbroken. He can't eat, and he doesn't smile anymore. He says it's all his fault, even though he did the best he knew how. He thinks that if Beauty dies, no one will ever speak to him again. It hurts me to hear him talk that way. He's not a bad boy.
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: >-
            John waited a moment before answering.
        - id: ch01-b05
          speaker: john
          text: >-
            Don't judge me too harshly, Tom. I know Joe meant no harm. I never said he did, and I know he isn't a bad boy. But I'm hurting too. That horse is the pride of my heart, and the master and mistress love him dearly. I can't bear to think his life may be thrown away like this. Still, if you believe I've been hard on Joe, I'll try to say something kind to him tomorrow. That is, if Beauty is doing better.
          emotion: sad
        - id: ch01-b06
          speaker: thomas_green
          text: >-
            Thank you, John. I knew you didn't mean to be too hard on him. I'm glad you understand that he acted out of ignorance.
        - id: ch01-b07
          speaker: narrator
          text: >-
            John's answer came so sharply that it almost startled me.
        - id: ch01-b08
          speaker: john
          text: >-
            Only ignorance? How can you say "only" ignorance? Next to wickedness, it's the worst thing in the world. Heaven knows which one causes more harm. People say, "I didn't know. I didn't mean any harm," and then they think everything is all right.

            Martha Mulwash probably didn't mean to kill that baby when she gave it Dalby and soothing syrups. But the baby died, and Martha was tried for manslaughter.
          emotion: angry
        - id: ch01-b09
          speaker: thomas_green
          text: >-
            And rightly so. No woman should care for a helpless little child unless she knows what's safe for it and what isn't.
        - id: ch01-b10
          speaker: john
          text: >-
            Bill Starkey didn't intend to frighten his brother into fits. He only dressed as a ghost and chased him through the moonlight. But that's what happened. That bright, handsome little boy could have made any mother proud. Now he'll never be any better than an idiot, even if he lives to be eighty.

            And two weeks ago, you were miserable when those young ladies left your hothouse door open. That frosty east wind blew straight inside, and you said it killed many of your plants.
        - id: ch01-b11
          speaker: thomas_green
          text: >-
            Many? Every single tender cutting was ruined. I have to start all over, and I don't even know where I'll find fresh ones. When I walked in and saw the damage, I was nearly out of my mind.
          emotion: angry
        - id: ch01-b12
          speaker: john
          text: >-
            And I'm sure those young ladies never meant to do it. They simply didn't know.
        - id: ch01-b13
          speaker: narrator
          text: >-
            I heard no more. The medicine worked well and carried me off to sleep. By morning, I felt much better.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Later, when I had seen more of the world, I often remembered John's words.
