audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    john:
      display_name: 约翰
      tts:
        delivery: 稳重耐心，谈起马匹时专业而亲切
        timbre: 温厚沉稳
        pace: 从容
        pitch: 中低
    thomas_green:
      display_name: 托马斯·格林
      tts:
        delivery: 朴实厚道，劝说别人时诚恳而体谅
        timbre: 温暖质朴
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 病中的夜晚
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我也说不清自己病了多久。马医邦德先生每天都来。有一天，他替我放血，约翰就在一旁提桶接着。血放完以后，我虚弱极了，觉得自己恐怕活不成了。看他们的样子，大概也有同样的担心。
        - id: ch01-b02
          speaker: narrator
          text: 姜饼和快乐腿都搬去了另一间马厩，好让我静静休养。发烧以后，我的耳朵灵敏得出奇，再小的声音也会变得很响。有人进屋或出门，我听脚步就知道是谁。周围发生的事，一件也瞒不过我。
        - id: ch01-b03
          speaker: narrator
          text: 一天夜里，约翰要给我灌药，托马斯·格林进来帮了他。药服下去以后，约翰尽力让我躺得舒服些。他打算再等半个钟头，看看药下去以后是不是安稳。托马斯也愿意陪着。两个人便走到快乐腿的马位，坐上那张临时搬来的长凳。他们把灯搁在脚边，免得光亮扰得我不能休息。
        - id: ch01-b04
          speaker: narrator
          text: 他们先是默默坐了一会儿。过了一阵，汤姆把声音压得很低，向约翰开了口。
        - id: ch01-b05
          speaker: thomas_green
          text: 约翰，你能不能跟乔说一两句宽心话？那孩子难过得饭也吃不下，脸上一点笑容都没有。他知道这全怪自己，可他也说，自己已经把懂得的事都做了。他还怕黑骏马一死，就再也没有人肯理他。我听着实在心疼。你就安慰他一句吧，他并不是坏孩子。
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: 约翰停了一会儿，才慢慢回答。
        - id: ch01-b07
          speaker: john
          text: 汤姆，你别觉得我真有那么狠。我知道乔没想害谁，也从来没说过他是故意的。他不是坏孩子，这我也明白。可我自己心里同样难受。黑骏马一直是我的骄傲，主人和女主人又那么疼爱他。如今，他的命可能就这么白白丢掉，我怎么受得了？不过，你既然觉得我对乔太严厉，明天我会尽量跟他说句好话。只要黑骏马能够好一些。
          emotion: sad
        - id: ch01-b08
          speaker: thomas_green
          text: 谢谢你，约翰。我就知道，你不是真想这样苛责他。你能看出来他只是无知，我就放心了。
    - id: ch02
      title: 不能轻看无知
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 约翰猛然提高了声音，几乎把我吓了一跳。
        - id: ch02-b02
          speaker: john
          text: 只是无知！只是无知！你怎么能把无知说成一件小事？世上除了存心作恶，最糟糕的就是无知。到底哪一样惹出的祸更多，恐怕只有上天知道。有人闯了祸，只要说一句“我不知道，我又不是故意害人的”，就觉得自己没有错了。
          emotion: angry
        - id: ch02-b03
          speaker: john
          text: 玛莎·穆尔沃什给那个婴儿灌达尔比药水和安抚糖浆时，我想她也没打算害死孩子。可孩子还是被她害死了，她也因为过失杀人受了审判。
        - id: ch02-b04
          speaker: thomas_green
          text: 她受审也是活该。要是连什么对娇弱的婴儿有益，什么会伤害孩子都不知道，一个女人就不该去照料人家的孩子。
        - id: ch02-b05
          speaker: john
          text: 还有比尔·斯塔基。他扮成鬼，趁着月光追赶自己的弟弟，当然也没想把人吓得抽搐。可结果呢？那个小家伙原本又聪明又漂亮，哪个母亲都会为他骄傲。现在他却跟傻子没有两样，就算能活到八十岁，也永远不会恢复了。
        - id: ch02-b06
          speaker: john
          text: 汤姆，你自己也遇到过这样的事。就在两个星期前，那几位年轻小姐忘了关温室的门，结霜的东风一直往里面灌。你当时不是难受得很吗？你说，好多花木都冻死了。
        - id: ch02-b07
          speaker: thomas_green
          text: 哪儿只是死了好多，娇嫩的插条根本一株也没剩！我得从头再扦插，可最麻烦的是，我还不知道该去哪里找新的枝条。那天我一进温室，看见里面全毁了，差点没气疯。
          emotion: angry
        - id: ch02-b08
          speaker: john
          text: 可那些年轻小姐肯定也不是故意的。她们不过是无知罢了。
    - id: ch03
      title: 醒来以后
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 后面的话，我一句也没听见。那服药起了作用，很快就让我睡着了。等到第二天早晨醒来，我已经觉得好多了。
        - id: ch03-b02
          speaker: narrator
          text: 从那以后，我见过的世事越来越多，也就越来越常想起约翰在那个夜晚说过的话。
