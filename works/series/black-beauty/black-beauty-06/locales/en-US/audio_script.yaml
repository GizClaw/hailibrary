audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Black Beauty
      tts:
        delivery: reflective and gently expressive
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    john:
      display_name: John Manly
      tts:
        delivery: capable, gentle, and straightforward
        timbre: sturdy and warm
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Liberty I Missed
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I was quite happy in my new home. Everyone who cared for me was good, my stable was light and airy, and my food was the best. If I missed one thing, that did not mean I was unhappy. Still, there was something more I wanted. I wanted liberty.
        - id: ch01-b02
          speaker: narrator
          text: >-
            For the first three and a half years of my life, I had all the freedom I could wish for. Now I had to stand in a stable, night and day, week after week and month after month. I came out only when someone needed me. Then I had to be as steady and quiet as a horse that had worked for twenty years. There were straps here and straps there, a bit in my mouth, and blinkers over my eyes.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I am not complaining. I knew that was how things had to be. But I was young, strong, and full of spirit. I had been used to a wide field or open plain, where I could throw up my head, toss my tail, and gallop at full speed. I could race away, wheel around, and come snorting back to my companions. It was hard never to have even a little freedom to do as I pleased.
    - id: ch02
      title: The Fidgets in My Feet
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Sometimes I had less exercise than usual. Then I felt so full of life and spring that I could hardly keep still when John took me out. No matter how I tried, I felt I had to jump or dance or prance. I know I gave him many a good shake, especially at first. But John was always patient with me.
        - id: ch02-b02
          speaker: john
          text: >-
            Easy now, my boy. Just wait a little. We'll get into a good stride soon and work that tickle out of your feet.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Once we were beyond the village, he would let me fly along at a brisk trot for a few miles. I came back just as fresh as before, but what John called my fidgets were gone.
        - id: ch02-b04
          speaker: narrator
          text: >-
            People often call spirited horses skittish when they have not had enough exercise. Many times, the horse is only trying to play. Some grooms punish a horse for that, but John never did. He understood that I was simply overflowing with high spirits.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Even so, John had ways of making me understand. I could hear it in his voice or feel it through the rein. When his voice became serious and firm, I always knew he meant it. His voice had more power over me than anything else because I was so fond of him.
    - id: ch03
      title: A Few Hours Free
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Every now and then, we did have our liberty for a few hours. It usually happened on a fine Sunday in summer. The church was close by, so the carriage never went out on Sundays.
        - id: ch03-b02
          speaker: narrator
          text: >-
            What a treat it was when they turned us loose in the home paddock or the old orchard. The grass felt cool and soft under our feet, the air smelled sweet, and we could do whatever we liked. We could gallop, lie down and roll onto our backs, or nibble the sweet grass.
        - id: ch03-b03
          speaker: narrator
          text: >-
            It was also the perfect time for us to talk as we stood together in the shade of the great chestnut tree.
