audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述成长经历时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    john:
      display_name: 约翰
      tts:
        delivery: 稳重耐心，谈起马匹时专业而亲切
        timbre: 温厚沉稳
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 我所想念的自由
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我在新住处过得很快乐。照料我的人个个待我很好，马厩宽敞、明亮，空气也好，吃的更是没得挑。要说我还想念什么，那可不表示我不知足。我想念的，是自由。
        - id: ch01-b02
          speaker: narrator
          text: 我生命中的头三年半，想要多少自由就有多少。可如今，一星期接一星期，一个月接一个月，往后大概还会一年接一年。没有事情要我出去时，我日夜都得站在马厩里。轮到我干活，又必须沉着安静，像一匹已经劳作二十年的老马。身上到处是皮带，嘴里衔着嚼子，眼旁还戴着眼罩。
        - id: ch01-b03
          speaker: narrator
          text: 我不是在抱怨，因为我知道事情只能这样。我只是觉得，一匹年轻的马浑身有用不完的力气，过去总能在开阔的田野上昂起头、扬起尾巴，放开四蹄飞奔出去，再绕回来，朝同伴响亮地喷一声鼻息。如今，却连片刻随心所欲的自由也没有了，这实在不好受。
        - id: ch01-b04
          speaker: narrator
          text: 有时，我活动得比平常少，就觉得全身的活力都要蹦出来。约翰带我出去时，我怎么也安静不住。哪怕努力克制，还是忍不住跳几下、舞几步，再蹦跶一阵。我知道自己把他颠得够呛，刚开始尤其如此。可他一直很和善，也很有耐心。
    - id: ch02
      title: 脚底的痒劲儿
      blocks:
        - id: ch02-b01
          speaker: john
          text: 稳住，稳住，小伙子。再忍一会儿，等出了村子，我就让你好好跑上一阵，很快便能把你脚底那股痒劲儿甩掉。
          emotion: calm
        - id: ch02-b02
          speaker: narrator
          text: 一出村子，约翰便让我痛快地快步跑上几英里。等我们回来，我还是和出门时一样精神，不过已经不再坐立不安了。他管那叫把痒劲儿甩掉。
        - id: ch02-b03
          speaker: narrator
          text: 精力旺盛的马若是活动不够，常会被人说成容易受惊，其实它们只是在玩闹。有些马夫会惩罚它们，约翰从来不会。他明白那不过是精神太足。不过，他也有自己的办法叫我听懂。有时他改变说话的声调，有时只把缰绳轻轻一带。只要声音一严肃起来，我就知道他已经打定主意。那声音比什么都管用，因为我非常喜欢他。
    - id: ch03
      title: 夏日星期天的奖赏
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 话说回来，我们偶尔也能享受几个钟头的自由。通常是在天气晴好的夏日星期天。教堂离得不远，所以星期天马车从不出门。
        - id: ch03-b02
          speaker: narrator
          text: 每逢这时，人们会把我们放进宅旁的围场，或是那座老果园。这对我们来说，真是一场难得的享受。青草踩在脚下，又凉又软，空气里带着甜香。更快活的是，我们终于能顺着自己的心意活动。想飞奔就飞奔，想躺下就躺下，还能翻过身来打滚，或低头嚼几口鲜甜的草。
        - id: ch03-b03
          speaker: narrator
          text: 等我们并肩站到大栗树的浓荫下，又到了彼此好好谈心的时候。
