audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述成长经历时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    john:
      display_name: 约翰
      tts:
        delivery: 稳重耐心，谈起马匹时专业而亲切
        timbre: 温厚沉稳
        pace: 从容
        pitch: 中低
    squire:
      display_name: 戈登乡绅
      tts:
        delivery: 明快稳健，待人和气而有主见
        timbre: 厚实清晰
        pace: 适中
        pitch: 中
    mrs_gordon:
      display_name: 戈登太太
      tts:
        delivery: 温柔大方，言谈亲昵而敏锐
        timbre: 柔和明亮
        pace: 舒缓
        pitch: 中
    james:
      display_name: 詹姆斯
      tts:
        delivery: 开朗随和，谈话时自然爽快
        timbre: 年轻清亮
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 约翰试马
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 马车夫叫约翰·曼利。他有妻子和一个年幼的孩子，一家人就住在马厩附近的小屋里。第二天早晨，他把我牵进院子，替我好好刷洗了一番。我正要带着一身柔亮的皮毛回马栏，乡绅进来看我了。他似乎很满意，便吩咐约翰带我出去试试。
        - id: ch01-b02
          speaker: squire
          text: 约翰，我本想今早亲自试这匹新马，可我还有别的事。你吃过早饭带他出去转一圈吧。先过公地和海伍德，回来时走水磨坊和河边。这样就看得出他的步法怎么样了。
        - id: ch01-b03
          speaker: john
          text: 好的，先生。
        - id: ch01-b04
          speaker: narrator
          text: 早饭后，约翰来给我套辔头。他把每根皮带收收放放，一直调到我的头戴着舒服才停手。第一副马鞍不够宽，他马上看出不合我的背，立刻换了一副正合适的。他先让我慢慢走，接着小跑，再轻快跑。到了公地，他用鞭子轻轻一点，我们便畅快地飞奔起来。最后，他才收住缰绳。
        - id: ch01-b05
          speaker: john
          text: 嗬，嗬，小伙子！我看哪，你一定很想跟着猎犬去打猎。
    - id: ch02
      title: 安稳勇敢的性情
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我们穿过庄园回来，正遇见乡绅和戈登太太散步。他们停了下来，约翰也翻身下马。
        - id: ch02-b02
          speaker: squire
          text: 怎么样，约翰？他跑起来如何？
        - id: ch02-b03
          speaker: john
          text: 一等一的好，先生。他快得像鹿，精神也足，可缰绳只要轻轻一带，他就听从指引。公地尽头有辆行商车，外面挂满篮子、毯子之类的东西。很多马见了这种车都不肯安静经过，可他认真看了看，就稳稳当当地走过去了。
        - id: ch02-b04
          speaker: john
          text: 海伍德附近还有人在打兔子，一枪就在旁边响了。他只是稍稍停住看了看，向左向右都没挪一步。我稳稳握着缰绳，没有催他。依我看，他小时候没受过惊，也没人虐待过他。
        - id: ch02-b05
          speaker: squire
          text: 那很好。明天我自己来试试他。
        - id: ch02-b06
          speaker: narrator
          text: 第二天，人们把我牵给主人。我记着母亲的劝告，也没有忘记从前那位善良老主人的教导，尽力照主人的意思去做。他骑术很好，对自己的马也处处体贴。我们回到宅邸时，戈登太太正站在门厅前等候。
    - id: ch03
      title: 黑骏马这个名字
      blocks:
        - id: ch03-b01
          speaker: mrs_gordon
          text: 怎么样，亲爱的？你喜欢他吗？
        - id: ch03-b02
          speaker: squire
          text: 他果然和约翰说的一样。我再也不求骑一匹比他更讨人喜欢的马了。不过，我们该给他取个什么名字？
        - id: ch03-b03
          speaker: mrs_gordon
          text: 叫乌木好吗？你看，他黑得就像乌木。
        - id: ch03-b04
          speaker: squire
          text: 不，别叫乌木。
        - id: ch03-b05
          speaker: mrs_gordon
          text: 那就叫黑鸟吧，和你叔叔从前那匹老马一样。
        - id: ch03-b06
          speaker: squire
          text: 也不好。他可比老黑鸟当年漂亮得多。
        - id: ch03-b07
          speaker: mrs_gordon
          text: 说得也是。他真漂亮，脸庞温顺和善，还有一双又漂亮又聪明的眼睛。要不，就叫他黑骏马？
        - id: ch03-b08
          speaker: squire
          text: 黑骏马？嗯，这名字很好。既然你喜欢，以后他就叫黑骏马吧。
        - id: ch03-b09
          speaker: narrator
          text: 就这样，我有了黑骏马这个名字。约翰回到马厩后，还对詹姆斯说，主人和女主人给我取的是个实在又像样的英国名字，一听就有意思，可不像马伦戈、珀伽索斯或阿卜杜拉。两个人听了都笑起来。
        - id: ch03-b10
          speaker: james
          text: 要不是会叫人想起从前，我倒想叫他罗布·罗伊。我还从没见过两匹马长得这么像。
        - id: ch03-b11
          speaker: john
          text: 那有什么奇怪？难道你不知道，格雷农场主那匹老公爵夫人，正是他们俩的母亲？
        - id: ch03-b12
          speaker: narrator
          text: 我从不知道这件事。原来，在那场狩猎中死去的可怜的罗布·罗伊，竟然是我的亲兄弟！母亲当时那么悲痛，也就不奇怪了。看来，马是没有亲人的。至少被卖掉以后，亲人之间便再也认不出彼此。
    - id: ch04
      title: 温柔的照料
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 约翰似乎很为我骄傲。他总把我的鬃毛和尾巴梳得十分光滑，就像女士的头发。他也常对我说话。那些话我当然不能全听懂，不过，我越来越明白他的意思，也越来越清楚他希望我怎么做。
        - id: ch04-b02
          speaker: narrator
          text: 我越来越喜欢约翰，因为他既温柔又善良，仿佛完全知道一匹马会有什么感受。他替我刷洗时，清楚哪里怕疼，哪里怕痒。刷到头部，他从我眼睛上方经过时格外小心，就像那是他自己的眼睛，从来不惹我烦躁。
        - id: ch04-b03
          speaker: narrator
          text: 马厩里的年轻人詹姆斯·霍华德也很温和亲切，我觉得自己真是交了好运。院子里还有一个帮工，只是他很少照料姜黄和我。
    - id: ch05
      title: 新伙伴们
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 几天后，我要和姜黄一起套车出门。我起初还不知道我们合不合得来。别人把我牵到她身边时，她把耳朵往后贴了贴，却再没有别的坏表现。她干活很踏实，自己该出的力气一点也不少。若要找一匹双驾的搭档，我再也不求比她更好的了。
        - id: ch05-b02
          speaker: narrator
          text: 每次上坡，姜黄不但不放慢，反而把全身重量压进颈圈，一鼓作气直往坡上拉。我们干活时都有同样的勇气，所以约翰常常要收住我们，反倒很少催我们。他一次也不必向我们挥鞭。我们步幅相近，小跑时很容易保持齐步，走起来十分舒服。主人爱看我们跑得整齐，约翰也爱看。一起出门两三次以后，我和姜黄变得友好又合得来，我也越来越觉得这里像自己的家。
        - id: ch05-b03
          speaker: narrator
          text: 我也很快和快乐脚成了好朋友。这个小家伙快活、勇敢，脾气又好，人人都喜欢他，杰茜小姐和弗洛拉小姐尤其喜欢。她们常骑着他在果园里玩，还带着小狗欢跳，大家玩得十分开心。
        - id: ch05-b04
          speaker: narrator
          text: 主人还有两匹马住在另一间马厩。一匹叫正义，是匹结实的杂色矮脚马，可以骑乘，也会拉行李车。另一匹是年迈的棕色猎马奥利弗爵士。他不能再干重活了，却一直深得主人喜爱，所以可以在庄园里自由走动。他有时拉拉轻便小车，年轻的小姐们陪父亲骑马时，也会有一位骑着他。他非常温顺，和快乐脚一样，可以放心让孩子骑。
        - id: ch05-b05
          speaker: narrator
          text: 正义强壮匀称，性情也好。我和他偶尔会在围场里聊几句，可我们自然不像我和姜黄那样亲近，因为姜黄同我住在一间马厩里。
