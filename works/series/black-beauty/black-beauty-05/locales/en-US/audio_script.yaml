  chapters:
    - id: ch01
      title: John's Trial Ride
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The coachman's name was John Manly. He lived with his wife and their little child in a cottage close to the stables.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The next morning, John took me into the yard and groomed me well. My coat was soft and shining when I started back toward my box. Just then, the squire came in to see me, and he seemed pleased.
        - id: ch01-b03
          speaker: squire
          text: >-
            John, I planned to try the new horse this morning, but I have other business. Take him out after breakfast. Ride across the common and past Highwood, then come back by the watermill and the river. That should show you how he moves.
        - id: ch01-b04
          speaker: john
          text: >-
            Yes, sir. I will.
        - id: ch01-b05
          speaker: narrator
          text: >-
            After breakfast, John fitted me with a bridle. He adjusted every strap until it sat comfortably on my head. The first saddle he brought was too narrow for my back. He noticed at once, fetched another, and that one fit me nicely.
        - id: ch01-b06
          speaker: narrator
          text: >-
            He rode me slowly at first, then asked for a trot and a canter. Out on the common, he touched me lightly with his whip, and away we went in a splendid gallop. When he pulled me up, he spoke to me.
        - id: ch01-b07
          speaker: john
          text: >-
            Well, my boy! I think you'd enjoy following the hounds.
        - id: ch01-b08
          speaker: narrator
          text: >-
            On our way back through the park, we met Squire Gordon and Mrs. Gordon walking together. They stopped, and John jumped down.
        - id: ch01-b09
          speaker: squire
          text: >-
            Well, John? How did he go?
        - id: ch01-b10
          speaker: john
          text: >-
            First-rate, sir. He's quick as a deer and full of spirit, but the slightest pull on the rein guides him. We met one of those traveling carts covered with baskets and rugs at the far end of the common. Plenty of horses won't pass one quietly. He looked it over, then walked right by without any trouble.
        - id: ch01-b11
          speaker: john
          text: >-
            People were shooting rabbits near Highwood, too. A gun went off close to us. He stopped and looked, but he didn't jump one way or the other. I kept the rein steady and gave him time. I'd say no one frightened or mistreated him when he was young.
        - id: ch01-b12
          speaker: squire
          text: >-
            Good. I'll ride him myself tomorrow.
    - id: ch02
      title: A Name of My Own
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The next day, they brought me out for my master. I remembered what my mother and my good old master had taught me, and I tried to do exactly what he asked. He rode very well, and he thought about his horse as he rode. When we returned, Mrs. Gordon was waiting at the hall door.
        - id: ch02-b02
          speaker: mrs_gordon
          text: >-
            Well, my dear, what do you think of him?
        - id: ch02-b03
          speaker: squire
          text: >-
            John was exactly right. I couldn't ask for a more pleasant horse to ride. Now, what should we call him?
        - id: ch02-b04
          speaker: mrs_gordon
          text: >-
            How about Ebony? His coat is black as ebony.
        - id: ch02-b05
          speaker: squire
          text: >-
            No, not Ebony.
        - id: ch02-b06
          speaker: mrs_gordon
          text: >-
            Then what about Blackbird, after your uncle's old horse?
        - id: ch02-b07
          speaker: squire
          text: >-
            No. He's much more handsome than old Blackbird ever was.
        - id: ch02-b08
          speaker: mrs_gordon
          text: >-
            He truly is a beauty. Look at that sweet, good-natured face and those bright, intelligent eyes. What if we call him Black Beauty?
        - id: ch02-b09
          speaker: squire
          text: >-
            Black Beauty. Yes, that's a very good name. If you like it, that will be his name.
        - id: ch02-b10
          speaker: narrator
          text: >-
            And so it was. When John returned to the stable, he told James that the master and mistress had chosen a sensible English name for me, one that meant something. It wasn't a name like Marengo, Pegasus, or Abdallah. They both laughed.
        - id: ch02-b11
          speaker: james
          text: >-
            If it didn't bring back sad memories, I'd have called him Rob Roy. I've never seen two horses look more alike.
        - id: ch02-b12
          speaker: john
          text: >-
            Of course they look alike. Didn't you know Farmer Grey's old Duchess was mother to them both?
        - id: ch02-b13
          speaker: narrator
          text: >-
            I had never known that. Poor Rob Roy, the horse killed at the hunt, was my brother. Now I understood why my mother had been so troubled. It seems horses have no family, or at least they never know their relatives once they have been sold.
    - id: ch03
      title: Kind Hands in the Stable
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            John was very proud of me. He smoothed my mane and tail until they were almost as neat as a lady's hair, and he talked to me often. I couldn't understand every word, of course. Still, I learned more and more about what he meant and what he wanted me to do.
        - id: ch03-b02
          speaker: narrator
          text: >-
            I became very fond of him because he was so gentle and kind. He seemed to understand exactly how a horse feels. When he cleaned me, he knew which places were tender and which were ticklish. Around my eyes, he brushed as carefully as if they were his own. He never gave me any reason to lose my temper.
        - id: ch03-b03
          speaker: narrator
          text: >-
            James Howard, the stable boy, was gentle and pleasant in his own way, too. I felt very fortunate. Another man helped around the yard, but he had little to do with Ginger or me.
    - id: ch04
      title: Friends and Partners
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            A few days later, Ginger and I went out together in the carriage. I wondered how we would manage as a team. She laid her ears back when they first led me beside her, but after that, she behaved very well.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Ginger worked honestly and always did her full share. I could never ask for a better partner in double harness. When we reached a hill, she didn't slow down. She leaned her weight into the collar and pulled straight up.
        - id: ch04-b03
          speaker: narrator
          text: >-
            We had the same kind of courage for our work. John had to hold us back more often than urge us on, and he never needed the whip with either of us. Our strides matched well, too. At a trot, keeping step with her came easily. Both John and our master liked to see us moving together. After two or three outings, Ginger and I grew friendly and sociable. That helped me feel truly at home.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Merrylegs and I soon became great friends as well. He was cheerful, brave, and good-tempered, so everyone loved him. Miss Jessie and Flora were especially fond of him. They rode him around the orchard and played wonderful games with him and their little dog, Frisky.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Our master kept two more horses in another stable. Justice was a roan cob who carried riders or pulled the luggage cart. Sir Oliver was an old brown hunter. His working days were mostly over, but the master loved him and let him roam through the park.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Sir Oliver sometimes pulled a light cart around the estate. He also carried one of the young ladies when they rode with their father. He was so gentle that a child could be trusted with him just as safely as with Merrylegs.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Justice was strong, well-built, and good-tempered. Now and then, we talked in the paddock. But I could never know him as well as Ginger, who shared my stable.
