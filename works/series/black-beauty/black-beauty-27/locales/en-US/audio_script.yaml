  chapters:
    - id: ch01
      title: Ruined and Going Downhill
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            As soon as my knees had healed enough, I was put into a small meadow for a month or two. I had the whole place to myself. The freedom and sweet grass were pleasant, but after living with other horses for so long, I felt very lonely.

            Ginger and I had become close friends, and I missed her terribly. Whenever I heard horses passing on the road, I would call to them. Most of the time, no one answered.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Then one morning, the gate opened, and in came dear old Ginger. A man took off her halter and left her in the field. I gave a joyful whinny and trotted over. We were both delighted to be together again.

            But I soon learned that Ginger had not been brought there for our happiness. Hard riding had ruined her, and now they wanted to see what rest might do for her.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Lord George was young and would listen to no warning. He rode hard and hunted whenever he had the chance, without caring what it cost his horse.

            Soon after I left the stable, he decided to enter a steeplechase. The groom warned him that Ginger had a slight strain and was not fit to race. Lord George refused to believe it. On race day, he pushed her to stay with the leading riders.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Ginger's brave spirit made her give everything she had. She finished among the first three horses, but the effort damaged her breathing. Lord George was too heavy for her, too, and the race strained her back.
        - id: ch01-b05
          speaker: ginger
          text: >-
            So here we are, ruined while we're still young and strong. A drunkard ruined you, and a fool ruined me. It's terribly hard.
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: >-
            We could both feel that we were no longer the horses we had once been. Still, that did not take away the comfort of being together. We could not gallop around as we used to, but we grazed side by side and lay down together. Sometimes we stood for hours beneath one of the shady lime trees, our heads close.

            That was how we spent our days until the family came back from town.
        - id: ch01-b07
          speaker: narrator
          text: >-
            One day, the earl came into the meadow with York. Ginger and I stayed beneath our lime tree and let them walk up to us. They examined us carefully, and the earl looked deeply annoyed.
        - id: ch01-b08
          speaker: lord_w
          text: >-
            That's three hundred pounds thrown away for nothing. But what troubles me most is that these horses belonged to my old friend. He trusted me to give them a good home, and now they're ruined.

            The mare can have a full year at pasture. Then we'll see what the rest has done for her. But the black horse must be sold. It's a great pity, but I can't keep a horse with knees like those in my stables.
        - id: ch01-b09
          speaker: york
          text: >-
            No, my lord, of course not. Still, he may find a place where his looks don't matter so much and where he'll be treated well. I know a man in Bath who runs livery stables. He often needs a good horse at a low price, and he takes proper care of them.

            The inquest cleared the horse of any blame. A recommendation from you or from me should be enough to satisfy the man.
        - id: ch01-b10
          speaker: lord_w
          text: >-
            Write to him, York. I care more about finding the right place than about the price the horse brings.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Then they walked away and left us beneath the tree.
        - id: ch01-b12
          speaker: ginger
          text: >-
            They'll take you away soon. I'll lose the only friend I have, and we'll probably never see each other again. It's a hard world.
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: >-
            About a week later, Robert came into the field carrying a halter. He slipped it over my head and led me away.

            Ginger and I had no real chance to say goodbye. We called to each other as I left. She trotted anxiously beside the hedge, calling after me for as long as she could hear my hoofbeats.
        - id: ch01-b14
          speaker: narrator
          text: >-
            With York's recommendation, the owner of the livery stables bought me. I had to travel by train. It was my first time, and it took a great deal of courage.

            The engine puffed, rushed, and whistled, while the horse-box trembled around me. But none of it actually hurt me, and before long, I was able to take the journey quietly.
        - id: ch01-b15
          speaker: narrator
          text: >-
            At the end of the trip, I found myself in a fairly comfortable stable where I was well cared for. It was not as airy or pleasant as the stables I had known before. The stalls sloped instead of lying level. Since my head was tied to the manger, I had to stand on that slope all the time, and it was very tiring.

            People still did not seem to understand that horses can do more work when they can stand comfortably and turn around.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Even so, I was fed well and kept clean. On the whole, I believe the master looked after us as well as he could.

            He kept many horses and several kinds of carriages for hire. Sometimes his own men drove them. At other times, a gentleman or lady hired a horse and chaise and did the driving.
