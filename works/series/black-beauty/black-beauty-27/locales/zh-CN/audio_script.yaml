audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述亲历往事时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    ginger:
      display_name: 姜饼
      tts:
        delivery: 直率敏锐，叙说见闻时简洁而关切
        timbre: 清亮而有韧性
        pace: 自然
        pitch: 中
    earl:
      display_name: W伯爵
      tts:
        delivery: 理性温和，发话时自然带着主人的权威
        timbre: 成熟醇厚
        pace: 从容
        pitch: 中低
    york:
      display_name: 约克
      tts:
        delivery: 干练威严，对上恭敬，对马务实
        timbre: 结实清晰
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 草场重逢
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我的膝盖刚能走动，人们就把我放进一小片草场，让我休养一两个月。那里没有别的动物。青草鲜甜，又能自由活动，本来都是好事。可我早就过惯了有伙伴的日子，一个人待着，心里实在寂寞。
        - id: ch01-b02
          speaker: narrator
          text: 我尤其想念姜饼。我们已经成了亲密的朋友。路上每逢有马蹄经过，我都会嘶鸣着叫几声，可几乎没有谁回应我。
        - id: ch01-b03
          speaker: narrator
          text: 一天早晨，草场的门开了。进来的竟是姜饼！那人摘掉她的笼头，把她留了下来。我高兴地嘶鸣一声，小跑过去迎她。我们见到彼此，都很欢喜。
        - id: ch01-b04
          speaker: narrator
          text: 可我很快就明白，人们不是特意送她来陪我散心的。她的遭遇太长了，细说不完。结果是，人们骑她骑得太狠，已经毁了她的身子。如今只好让她在草场休息，看看还能不能恢复。
    - id: ch02
      title: 年轻力壮时被毁
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 乔治少爷年轻气盛，谁劝都不听。他骑起马来很狠，只要有机会就去打猎，从不替坐骑着想。我离开马厩后不久，他又执意参加一场越野障碍赛。
        - id: ch02-b02
          speaker: narrator
          text: 马夫明明告诉他，姜饼有点拉伤，不能参赛，他却不信。比赛那天，他硬逼着姜饼追赶最前面的骑手。姜饼又太要强，拼出了所有力气。她跟头三匹马一起冲过终点，肺却伤了。乔治少爷对她来说太重，她的背也拉伤了。
        - id: ch02-b03
          speaker: ginger
          text: 这下我们都毁了。明明正是年轻力壮的时候，你落到一个醉鬼手里，我落到一个傻瓜手里。这世道真是太苦了。
          emotion: sad
        - id: ch02-b04
          speaker: narrator
          text: 我们都感觉得到，自己再也不是从前的样子了。不过，有彼此相伴，仍旧是一件快活的事。我们不能再到处飞奔，就一起吃草，一起躺下。有时，我们会在浓荫蔽日的椴树下并肩站上几个钟头，头紧紧挨着头。
        - id: ch02-b05
          speaker: narrator
          text: 日子就这样过去，直到伯爵一家从城里回来。
    - id: ch03
      title: 再次被卖
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天，伯爵和约克走进草场。我们认出了他们，便静静站在椴树下，让他们来到跟前。两人把我们仔细看了一遍。伯爵显得十分懊恼。
        - id: ch03-b02
          speaker: earl
          text: 三百英镑就这样白白扔了，半点用处也没有。可钱还不是最叫我难受的。我的老朋友把这两匹马交给我，以为他们会有个好归宿，没想到如今都毁了。
        - id: ch03-b03
          speaker: earl
          text: 那匹母马让她放养一年吧，看看休息以后会不会好些。这匹黑马只能卖掉了，实在可惜。可他的膝盖伤成这样，我不能把他留在自己的马厩里。
        - id: ch03-b04
          speaker: york
          text: 当然不能，大人。不过，也许能替他找个不看重外表的地方，人家照样会好好待他。我在巴斯认识一个开出租马车行的人。他常想用不高的价钱买一匹好马，而且一向把马照料得很周到。
        - id: ch03-b05
          speaker: york
          text: 死因调查已经证明，这匹马没有过错。再有您或者我的推荐，对方就尽可放心了。
        - id: ch03-b06
          speaker: earl
          text: 那你写信给他吧，约克。我更在意这匹马会去什么地方，至于能卖多少钱，倒不重要。
        - id: ch03-b07
          speaker: narrator
          text: 说完，两人便走了。接着，姜饼说起了我们的离别。
        - id: ch03-b08
          speaker: ginger
          text: 他们很快就要带你走了。我会失去唯一的朋友。我们多半再也见不到了。这世道真苦啊！
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: 大约一星期后，罗伯特拿着笼头来到草场，套住我的头，把我牵了出去。我和姜饼连好好告别的机会也没有。离开时，我们彼此嘶鸣。她焦急地沿着树篱跟着我，一声声呼唤，直到再也听不见我的脚步。
    - id: ch04
      title: 新的马车行
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 经约克推荐，巴斯那家出租马车行的老板买下了我。我得乘火车去那里。这是头一回，我需要鼓起很大的勇气。
        - id: ch04-b02
          speaker: narrator
          text: 火车喷着气，向前飞驰，还不时尖声鸣叫。最吓人的是，我脚下的运马车厢不停震颤。后来我发现，这些动静其实伤不到我，也就渐渐安静下来。
        - id: ch04-b03
          speaker: narrator
          text: 到达以后，我住进一间还算舒适的马厩，也有人好好照料。只是这里不如我从前住的马厩通风，待着也没那么舒服。
        - id: ch04-b04
          speaker: narrator
          text: 马栏的地面是斜的，不是平的。我的头又拴在食槽上，不能转身，只好一直站在斜坡上，累得很。人类似乎还不明白，马若能舒服地站着，也能转动身体，其实可以多干许多活。
        - id: ch04-b05
          speaker: narrator
          text: 不过，我吃得不错，身上也总是刷洗干净。总的说来，老板已经尽力照顾我们了。他养着许多马，还有各式各样的马车，全都用来出租。
        - id: ch04-b06
          speaker: narrator
          text: 有时由老板手下的人驾车。有时，先生或太太会把马和轻便马车一起租走，亲自驾驶。
