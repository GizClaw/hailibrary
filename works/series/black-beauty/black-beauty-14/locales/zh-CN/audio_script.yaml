audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 黑骏马
      tts:
        delivery: 温和真挚，讲述成长经历时细腻而坦率
        timbre: 清朗柔和
        pace: 舒缓而自然
        pitch: 中低
    john:
      display_name: 约翰
      tts:
        delivery: 稳重耐心，谈起马匹时专业而亲切
        timbre: 温厚沉稳
        pace: 从容
        pitch: 中低
    james:
      display_name: 詹姆斯
      tts:
        delivery: 开朗随和，谈话时自然爽快
        timbre: 年轻清亮
        pace: 适中
        pitch: 中
    squire:
      display_name: 戈登乡绅
      tts:
        delivery: 明快稳健，待人和气而有主见
        timbre: 厚实清晰
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 主人的一封信
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 十二月的一天清早，约翰带我活动过，刚把我牵回隔间，正替我系马衣。詹姆斯也从饲料房取了燕麦，向这边走来。这时，主人拿着一封展开的信走进马厩，神情颇为严肃。约翰扣好隔间的门，碰了碰帽檐，等着主人吩咐。
        - id: ch01-b02
          speaker: squire
          text: 早上好，约翰。我想问问，你对詹姆斯有没有什么不满？
        - id: ch01-b03
          speaker: john
          text: 不满？没有，先生。
        - id: ch01-b04
          speaker: squire
          text: 他干活勤快吗？也一直尊重你吗？
        - id: ch01-b05
          speaker: john
          text: 是的，先生，一向如此。
        - id: ch01-b06
          speaker: squire
          text: 就算你转过身去，他也从不会敷衍手里的活儿？
        - id: ch01-b07
          speaker: john
          text: 从来不会，先生。
        - id: ch01-b08
          speaker: squire
          text: 那很好。不过我还得问一句。他带马出去活动，或者替人送信时，会不会停在路上跟熟人闲聊，或者进了不该进的人家，把马独自丢在外面？你有没有怀疑过这些事？
        - id: ch01-b09
          speaker: john
          text: 绝对没有，先生。谁要是这么议论詹姆斯，我不信。除非他能当着证人的面拿出真凭实据，否则我绝不会信。我不好说是谁想坏詹姆斯的名声，可有句话我敢说。这马厩里从没来过比他更稳重、更和气、更诚实、更机灵的年轻人。
        - id: ch01-b10
          speaker: john
          text: 他说的话和干的活儿，我都信得过。他对马温柔，也懂得照料。我宁愿把马交给他，也不愿交给那些戴镶边帽、穿号衣的年轻人。谁想打听詹姆斯·霍华德的人品，只管来问我约翰·曼利。
    - id: ch02
      title: 詹姆斯的新机会
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 主人一直严肃地听着。约翰说完，他脸上忽然绽开了笑容，又亲切地望向詹姆斯。詹姆斯始终端着燕麦，一动不动地站在门边。
        - id: ch02-b02
          speaker: squire
          text: 詹姆斯，小伙子，把燕麦放下，到这儿来。约翰对你的看法，和我自己的分毫不差，我很高兴。约翰向来谨慎，要他评价一个人可不容易。所以我才故意敲敲这边的灌木丛，好让鸟儿飞出来，叫我赶快听到想听的话。
        - id: ch02-b03
          speaker: squire
          text: 现在说正事。我妹夫住在克利福德庄园，他就是克利福德·威廉斯爵士。他来信托我物色一名可靠的年轻马夫，二十或二十一岁左右，还得熟悉本行。他的老车夫已经干了三十年，身体渐渐衰弱。他想找个年轻人跟在老人身边做事，把他的本领学会。等老车夫领养老金退下来，这个人就能接替他。
        - id: ch02-b04
          speaker: squire
          text: 起初每周有十八先令工钱，另给一套马厩工作服和一套赶车服。住处是车房楼上的一间卧室，手下还管着一个小伙计。克利福德爵士是位好主人。你要是能得到这个职位，往后就有了一个很好的开端。我舍不得你走。你离开这里，约翰就像少了右手一样。
        - id: ch02-b05
          speaker: john
          text: 确实如此，先生。可无论如何，我也不能挡他的前程。
        - id: ch02-b06
          speaker: squire
          text: 詹姆斯，你多大了？
        - id: ch02-b07
          speaker: james
          text: 到明年五月满十九岁，先生。
        - id: ch02-b08
          speaker: squire
          text: 是年轻了些。约翰，你怎么看？
        - id: ch02-b09
          speaker: john
          text: 是年轻，先生。不过他像成年人一样稳重，身体强壮，个子也长成了。赶车的经验虽不算多，他的手却又轻又稳，眼睛也快，做事还格外仔细。我敢保证，他照料的马绝不会因为没人查看蹄子和蹄铁而受损。
        - id: ch02-b10
          speaker: squire
          text: 你的话最有分量。克利福德爵士还在信后写了一句。他说，要是能找到一个由我家约翰调教出来的人，他会比任何人都更中意。所以，詹姆斯，你仔细想想，午饭时也跟母亲商量一下，再来告诉我你想怎么办。
    - id: ch03
      title: 练习赶车
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 几天以后，事情完全定了下来。再过一个月，至多六个星期，只要主人这边安排得开，詹姆斯就去克利福德庄园。在此之前，大家要尽量多给他练习赶车的机会。
        - id: ch03-b02
          speaker: narrator
          text: 我从没见过马车出门这么频繁。女主人不外出时，主人原本会亲自赶那辆双轮轻便马车。可如今，不论出门的是主人、年轻小姐们，还是只为跑一趟差事，金儿和我都会套上马车，由詹姆斯来赶。
        - id: ch03-b03
          speaker: narrator
          text: 最初，约翰会坐在车夫座上一直陪着他，随时教他该怎么做。过了一阵，詹姆斯便能独自赶车了。
        - id: ch03-b04
          speaker: narrator
          text: 从那以后，每逢星期六，主人要去城里的地方多得出奇。詹姆斯赶着我们，穿过一条又一条稀奇古怪的街道。主人总要算准火车进站的时候赶到车站。出租马车、私人马车、大车和公共马车，全都争着同时过桥。
        - id: ch03-b05
          speaker: narrator
          text: 铁路的钟声一响，要过那座桥，非得有好马和好车夫不可。桥很窄，通往车站的路又有一个急转弯。人若不睁大眼睛、打起十二分精神，车马彼此撞上简直再容易不过。
