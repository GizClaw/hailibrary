  chapters:
    - id: ch01
      title: James Howard
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Early one December morning, John brought me back to my stall after my daily exercise. He was fastening my blanket when James came in from the feed room with some oats. Just then, our master entered the stable. He looked serious, and an open letter was in his hand.

            John closed my stall door, touched his cap, and waited to hear what the master wanted.
        - id: ch01-b02
          speaker: master
          text: >-
            Good morning, John. Tell me, do you have any complaints about James?
        - id: ch01-b03
          speaker: john
          text: >-
            Complaints, sir? No, sir.
        - id: ch01-b04
          speaker: master
          text: >-
            Does he work hard? Is he always respectful to you?
        - id: ch01-b05
          speaker: john
          text: >-
            Yes, sir. Always.
        - id: ch01-b06
          speaker: master
          text: >-
            And when you turn your back, does he ever get careless with his work?
        - id: ch01-b07
          speaker: john
          text: >-
            Never, sir.
        - id: ch01-b08
          speaker: master
          text: >-
            Good. But I have one more question. When James takes the horses out for exercise or carries a message, have you ever suspected him of stopping to talk with friends? Does he go into houses where he has no reason to be and leave the horses standing outside?
        - id: ch01-b09
          speaker: john
          text: >-
            Certainly not, sir. If someone has been saying such things about James, I don't believe a word of it. And I won't believe it unless it's proved fairly, in front of witnesses.

            I can't say who might be trying to ruin his good name. But I can tell you this. I've never had a steadier, more pleasant, more honest, or sharper young man in this stable. I trust his word, and I trust his work. He's gentle with the horses, and he understands them. I'd sooner leave them with James than with half the young men I know who wear fancy hats and uniforms.

            If anyone wants to know what kind of man James Howard is, let him come and ask John Manly.
        - id: ch01-b10
          speaker: narrator
          text: >-
            John finished with a firm jerk of his head. The master had listened closely, looking very grave. But now a broad smile spread across his face. He glanced kindly at James, who had been standing silent by the door the whole time.
        - id: ch01-b11
          speaker: master
          text: >-
            James, my boy, put down those oats and come here. I'm very glad John's opinion of you matches mine so well.

            John is a careful man. It isn't always easy to get him to say exactly what he thinks of someone. So I asked my questions in a roundabout way. I knew that would bring the truth out quickly.

            Now, let's get to the matter itself. I've received a letter from my brother-in-law, Sir Clifford Williams of Clifford Hall. He needs a trustworthy young groom of about twenty or twenty-one, someone who knows his work. His coachman has served him for thirty years and is growing weak. Sir Clifford wants a young man to work beside him and learn his ways. Then, when the old coachman retires with a pension, that young man can take his place.

            The pay would begin at eighteen shillings a week. You'd receive one suit for stable work and another for driving. You'd have a bedroom above the coach house and a boy working under you. Sir Clifford is a good master. If you got the position, it would be an excellent start.

            I don't want to lose you. And if you leave us, I know John will lose his right hand.
        - id: ch01-b12
          speaker: john
          text: >-
            I certainly would, sir. But I wouldn't stand in James's way for anything in the world.
        - id: ch01-b13
          speaker: master
          text: >-
            How old are you, James?
        - id: ch01-b14
          speaker: james
          text: >-
            I'll be nineteen next May, sir.
        - id: ch01-b15
          speaker: master
          text: >-
            That's rather young. What do you think, John?
        - id: ch01-b16
          speaker: john
          text: >-
            He is young, sir. Still, he's as steady as a grown man, and he's strong and well built. He hasn't had much experience driving, but his hand is light and firm, and his eye is quick. He's very careful, too. I'm certain no horse in his care would suffer because its feet and shoes weren't properly checked.
        - id: ch01-b17
          speaker: master
          text: >-
            Your recommendation will carry the most weight, John. Sir Clifford added a note at the end of his letter. He said that if he could find a man trained by you, he'd prefer him over anyone else.

            So, James, think it over. Talk with your mother when you go home for dinner, and then tell me what you'd like to do.
        - id: ch01-b18
          speaker: narrator
          text: >-
            A few days later, everything was settled. James would leave for Clifford Hall in a month or six weeks, whenever the timing best suited our master. Until then, he was to get as much practice driving as possible.

            I had never known the carriage to go out so often. When the mistress stayed home, the master usually drove himself in the two-wheeled chaise. Now it didn't matter whether the master was going out, the young ladies wanted a ride, or someone simply had an errand to run. Ginger and I were harnessed to the carriage, and James took the reins.

            At first, John sat beside him on the driver's seat, giving him advice along the way. After that, James drove by himself.

            On Saturdays, it suddenly seemed our master had an amazing number of places to visit in the city. James drove us through all sorts of strange, narrow streets. The master always made sure we reached the railway station just when a train was arriving. Cabs, private carriages, carts, and large coaches would all be trying to cross the bridge at once.

            A driver had to be skillful there, and the horses had to be good. The bridge was narrow, and when the railway bell began ringing, everyone crowded forward together. At the far end, the road made a very sharp turn up toward the station. If people didn't watch closely and keep their heads, they could easily crash into one another.
