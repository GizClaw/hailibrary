audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静庄重，带着古老传说的悠远与克制的哀愁
        timbre: 温暖清澈，低沉而有回响
        pace: 舒缓从容，在景物转换处自然停顿
        pitch: 中低
    felician:
      display_name: 费利西安神父
      tts:
        delivery: 庄重慈悲，劝诫时坚定而满含哀痛
        timbre: 深沉温厚，清晰而有回响
        pace: 徐缓有分量，在祷词前自然停顿
        pitch: 中低
    evangeline:
      display_name: 伊凡吉林
      tts:
        delivery: 温柔真挚，悲痛时克制而颤抖
        timbre: 清澈柔和，年轻而明亮
        pace: 平稳舒缓，情绪激越时略快
        pitch: 中
    basil:
      display_name: 巴齐尔
      tts:
        delivery: 豪爽热情，谈起家园时坚定有力，安慰人时爽朗亲切
        timbre: 宽厚洪亮，带着久经劳作的粗粝
        pace: 从容明快，激动时短促有力
        pitch: 中低
    acadian_1:
      display_name: 阿卡迪亚伙伴甲
      tts:
        delivery: 热烈爽快，欢呼时精神振奋
        timbre: 明亮结实
        pace: 明快
        pitch: 中
    acadian_2:
      display_name: 阿卡迪亚伙伴乙
      tts:
        delivery: 朴实开朗，欢呼时充满喜悦
        timbre: 温暖浑厚
        pace: 明快
        pitch: 中低
    acadian_3:
      display_name: 阿卡迪亚伙伴丙
      tts:
        delivery: 兴奋热情，欢呼时清晰有力
        timbre: 清亮年轻
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 牧人的宅院
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            河岸边有一片橡树林。西班牙苔藓从枝头垂下来，和神秘的槲寄生一同迎风飘动，让人想起德鲁伊祭司在圣诞时节用金斧砍下的圣枝。牧人的宅院就静静藏在这片树荫里。
        - id: ch01-b02
          speaker: narrator
          text: |-
            花园围着房屋，盛开的花朵把香气送进空气。屋子由柏木梁材严密搭成，屋顶又宽又低，底下立着一排细柱。玫瑰和藤蔓绕过柱身，宽敞的游廊沿屋而建，蜂鸟和蜜蜂总在那里飞舞。
        - id: ch01-b03
          speaker: narrator
          text: |-
            花园两头各有一座鸽舍。鸽子们求偶不停，也为了爱情争斗不停，仿佛永远守着爱情的象征。四周一片寂静。夕阳的明暗分界已经爬上树梢，房屋仍留在阴影里。烟囱升起一缕淡蓝炊烟，慢慢融进傍晚。
        - id: ch01-b04
          speaker: narrator
          text: |-
            一条小路从屋后的花园门伸出去，穿过大片橡树林，直到无边草原。太阳正在那片花海里缓缓下沉。它的光路上立着一簇树，纠缠的葡萄藤就像船上的缆索。那些树仿佛几艘停在热带静海上的帆船，暗色的帆松松垂着，一动不动。
    - id: ch02
      title: 重逢巴齐尔
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            林地尽头连着草原的花浪。一个牧人骑马坐在那里，马背上装着西班牙式马鞍和马镫。他穿鹿皮衣和绑腿，宽边帽下的面孔宽阔黝黑，正以主人般威严的目光望着四周。
        - id: ch02-b02
          speaker: narrator
          text: |-
            数不清的牛在草地上安静吃草，也呼吸着河面漫来的湿润清气。牧人举起身边的号角，深吸一口气。悠长的号声穿过沉静的傍晚，又狂放，又甜美，传向很远的地方。
        - id: ch02-b03
          speaker: narrator
          text: |-
            牛群的白色长角忽然从草中抬起，像逆着海流翻卷的浪花。它们默默望了一刻，便哞叫着奔过草原。浩荡的牛群越跑越远，最后只剩一团云雾般的暗影。
        - id: ch02-b04
          speaker: narrator
          text: |-
            牧人掉转马头回家，从花园门里看见神父和少女向自己走来。他惊得跳下马，张开双臂迎上去。等两位来客看清他的脸，也认出来了。眼前的人，正是当年的铁匠巴齐尔。
        - id: ch02-b05
          speaker: narrator
          text: |-
            巴齐尔热情地把他们请进花园。三个人坐在玫瑰花架下，有问不完的话，也有答不完的话。他们拥抱，欢笑，落泪，随后又一同沉默。因为加布里埃尔不在那里，疑虑已经悄悄压上伊凡吉林的心。
        - id: ch02-b06
          speaker: narrator
          text: |-
            巴齐尔也有些不自在，终于先开了口。
        - id: ch02-b07
          speaker: basil
          text: |-
            你们是从阿查法拉亚来的吧？一路经过那么多河汊，怎么没遇见我家加布里埃尔的船？
        - id: ch02-b08
          speaker: narrator
          text: |-
            伊凡吉林脸上的光一下暗了。眼泪涌进她的眼睛，声音也颤抖起来。
        - id: ch02-b09
          speaker: evangeline
          text: |-
            他走了？加布里埃尔已经走了吗？
          emotion: sad
        - id: ch02-b10
          speaker: narrator
          text: |-
            她把脸埋在巴齐尔肩上，心里积压已久的重负终于冲破堤岸，化成了哭声。巴齐尔连忙安慰她，越说越显得欢快。
        - id: ch02-b11
          speaker: basil
          text: |-
            振作一点，我的孩子。他今天才走，并没有走远。这个傻小子，竟把我一个人留下来照管牛和马！
          emotion: calm
        - id: ch02-b12
          speaker: basil
          text: |-
            他这些日子越来越忧郁，心神不定，又疲惫又烦恼，再也过不下这种安稳日子。他总是想着你。不是闷声不响，就是只说你和他的苦处。男人听烦了，姑娘们也听烦了，到后来连我都受不了。
        - id: ch02-b13
          speaker: basil
          text: |-
            我便给他找了件事，让他去阿代斯城，跟西班牙人做骡马生意。办完以后，他会沿着印第安人的小路去奥扎克山，在林中打猎取皮毛，再到河边设陷阱捕河狸。
        - id: ch02-b14
          speaker: basil
          text: |-
            所以别难过。我们去追这个逃跑的情郎！命运和水路都不肯帮他，他一定跑不快。明天清早，我们就踏着红色晨光里的露水赶上去，把他抓回牢笼！
    - id: ch03
      title: 故人欢聚
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            河岸忽然传来欢呼声。伙伴们把提琴手米歇尔高高举在臂上，簇拥着他向宅院走来。他曾在巴齐尔家住过很久，日子过得像奥林匹斯山上的神仙。除了为凡人送去音乐，他什么也不必操心。那头银发和那把提琴，早已远近闻名。
        - id: ch03-b02
          speakers: [acadian_1, acadian_2, acadian_3]
          ensemble: chorus
          text: |-
            米歇尔万岁！阿卡迪亚勇敢的歌者万岁！
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: |-
            费利西安神父带着伊凡吉林迎上前，一遍遍问候老人，又同他谈起往事。巴齐尔见到旧伙伴和老相识，更是乐不可支。他笑得响亮，把做母亲的、做女儿的都亲热地拥进怀里。
        - id: ch03-b04
          speaker: narrator
          text: |-
            众人怎么也想不到，从前的铁匠如今有了辽阔土地和大群牲畜，举止也像一位受人敬重的大家长。巴齐尔又讲起这里的土壤与气候，还说草原上的牛多得数不清，谁捉到就归谁。听的人个个心动，都想照他的样子开创生活。
        - id: ch03-b05
          speaker: narrator
          text: |-
            大家登上台阶，穿过清风流动的游廊，走进大厅。巴齐尔迟归时要吃的晚餐已经摆好。老朋友们终于能坐在同一张桌边，一边休息，一边共享丰盛的食物。
    - id: ch04
      title: 月下的欢宴
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            宴席正热闹时，夜忽然降临了。屋外没有一点声息。带露的月亮与漫天繁星升起，把原野照成银色。屋里摇曳着灯火，朋友们的面孔却比月亮和星星更加明亮。
        - id: ch04-b02
          speaker: narrator
          text: |-
            巴齐尔坐在桌子上首的高位，心里的话和杯中的酒一起不断涌出来。他点起一斗芬芳的纳基托什烟草。客人含笑望着他，听他畅快地说下去。
        - id: ch04-b03
          speaker: basil
          text: |-
            朋友们，欢迎回来！你们漂泊了这么久，没有朋友，也没有家。如今又有家了，而且这个家说不定比从前那个更好！
          emotion: happy
        - id: ch04-b04
          speaker: basil
          text: |-
            这里没有饥寒的冬天，不会把人的血冻得像河水一样。地里也没有石头来惹农夫发火。犁头划过土壤，就像船底划过水面那么顺。橙树一年四季开花，一夜长出的草，比加拿大一个夏天长出的还多。
        - id: ch04-b05
          speaker: basil
          text: |-
            草原上到处是没人认领的牛。土地开口就能得到，树林里的木头砍上几斧，也就有了盖房的梁材。等你们住进新屋，田里的庄稼全变成金黄，英国的乔治国王再也不能赶走你们，烧你们的屋子和谷仓，抢你们的田地和牲畜！
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: |-
            巴齐尔从鼻孔喷出一团怒气腾腾的烟，大手重重拍在桌上。客人们全吓了一跳。费利西安神父送到鼻前的一撮鼻烟，也停在了半空。
        - id: ch04-b07
          speaker: narrator
          text: |-
            巴齐尔接着往下说，语气又轻松起来。
        - id: ch04-b08
          speaker: basil
          text: |-
            朋友们，只要小心这里的热病，可千万小心！它跟寒冷的阿卡迪亚那种热病不同。那一种呀，抓只蜘蛛塞进坚果壳，再挂到脖子上就能治好！
        - id: ch04-b09
          speaker: narrator
          text: |-
            门口又响起说话声。脚步踏过楼梯，来到通风的游廊。附近的克里奥尔人和经营小农庄的阿卡迪亚人应邀而来。旧伙伴紧紧相拥，原本陌生的人也因为同样远离故土，一见面就成了朋友。共同的故乡像一根温柔的纽带，把他们牵在了一起。
        - id: ch04-b10
          speaker: narrator
          text: |-
            邻厅传来米歇尔的提琴声，和谐的琴弦让谈话停了下来。众人像兴奋的孩子一样奔去跳舞，别的事全忘了。音乐带着他们飞旋摇摆。明亮的眼睛与翻飞的衣裳一起转动，整座大厅如同落进了梦里。
    - id: ch05
      title: 草原上的呼唤
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            大厅另一头，费利西安神父和巴齐尔坐在一起，谈过去，也谈现在和将来。伊凡吉林站在乐声中，却像中了魔法。旧日回忆接连浮起，她竟从喧闹的音乐里听见了海声。一阵无法压住的悲伤袭来，她悄悄离开人群，独自走进花园。
        - id: ch05-b02
          speaker: narrator
          text: |-
            月亮从森林的黑墙后升起，给树梢镀上银边。月光穿过枝叶，零星落在河面上，轻轻颤动。那微光就像温柔的爱，忽然照进一颗幽暗迷惘的心。
        - id: ch05-b03
          speaker: narrator
          text: |-
            四周的花朵吐出浓郁香气，仿佛把祈祷和忏悔交给夜晚。夜色则像沉默的加尔都西会修士，从花园中静静走过。伊凡吉林的心比花香更饱满，也沉沉浸在阴影和夜露里。神奇而安静的月光涌进她心中，唤起一种说不出的渴望。
        - id: ch05-b04
          speaker: narrator
          text: |-
            她出了花园门，沿着橡树下的小路，一直走到无边草原。草原铺在银雾中，无数萤火虫交错闪烁，飘向远方。群星悬在头顶，那是上帝留在天空的思想。世人早已忘了惊叹和膜拜，只有看见燃烧的彗星划过天穹，像一只手在神殿墙上写出“乌法珥新”，才会重新仰望。
        - id: ch05-b05
          speaker: narrator
          text: |-
            在天上的星辰和地上的萤火之间，伊凡吉林的灵魂孤独游荡。她终于呼喊起来。
        - id: ch05-b06
          speaker: evangeline
          text: |-
            加布里埃尔啊，我的爱人！你明明离我这么近，为什么我看不见你？你明明离我这么近，为什么我听不见你的声音？
          emotion: sad
        - id: ch05-b07
          speaker: evangeline
          text: |-
            你一定无数次走过这条小路，去往草原，也无数次望过我身边的树林。劳作回来，你一定常常躺在这棵橡树下休息，在睡梦里想着我。我要等到什么时候，才能亲眼见到你，亲手抱住你？
          emotion: sad
        - id: ch05-b08
          speaker: narrator
          text: |-
            近处忽然响起夜鹰明亮的啼声，像一支长笛吹过树林。叫声钻进灌木，越去越远，终于归于沉寂。橡树从洞穴般的黑暗深处低语，仿佛降下神谕，要她耐心等待。月光铺满草地，一声叹息随风回答她，明天。
    - id: ch06
      title: 追向阿代斯
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            第二天，太阳灿然升起。花瓣上的露水像眼泪，沐浴着它明亮的双足。花朵又从水晶般的杯中送出香气，仿佛把芬芳的香膏抹上太阳的头发。
        - id: ch06-b02
          speaker: narrator
          text: |-
            费利西安神父站在阴影里的门槛前，向即将出发的两个人告别。
        - id: ch06-b03
          speaker: felician
          text: |-
            再会！记得把那个挨饿受苦的浪子带回来，也别忘了那个新郎到来时还在沉睡的愚拙童女。
        - id: ch06-b04
          speaker: evangeline
          text: |-
            再会！
          emotion: happy
        - id: ch06-b05
          speaker: narrator
          text: |-
            伊凡吉林微笑着和巴齐尔走下河岸，船夫们早已在那里等候。他们迎着清晨和阳光出发，心里重新有了喜悦。他们要追上前面那个匆匆远去的人。可命运的风正卷着加布里埃尔，像卷着一片枯叶飞过荒野。
        - id: ch06-b06
          speaker: narrator
          text: |-
            第一天，他们没有发现踪迹。第二天仍然没有，第三天也是如此。湖泊、树林和河流都没有留下他的行踪。许多天过去，他们只能追着模糊不定的传闻，继续穿过荒凉的旷野。
        - id: ch06-b07
          speaker: narrator
          text: |-
            最后，两个人疲惫不堪地抵达西班牙人的城镇阿代斯，在一家小客栈前下船。喋喋不休的店主带来了消息。就在前一天，加布里埃尔带着马匹、向导和同伴离开村子，已经踏上通往草原的道路。
