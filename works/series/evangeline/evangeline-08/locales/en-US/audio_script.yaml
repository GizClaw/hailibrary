  chapters:
    - id: ch01
      title: Part the Second, III
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Near the riverbank, beneath oaks hung with Spanish moss and mistletoe, the herdsman's house stood quiet and apart. The mistletoe was the kind the Druids once cut with golden hatchets at Yule. A garden circled the house with rich blossoms and filled the air with fragrance. The walls were made of carefully fitted cypress timbers. The roof was broad and low. Slender columns held up a wide veranda, twined with roses and vines, where hummingbirds and bees came and went.

            At both ends of the house, dovecotes stood among the flowers. There the birds were always courting and always quarreling with their rivals. Silence lay over everything. The last light touched the treetops, while the house rested in shadow. A thin blue thread of smoke rose from the chimney and slowly widened in the evening air.
        - id: ch01-b02
          speaker: narrator
          text: |-
            Behind the house, a path led from the garden gate through great oak groves to the edge of the boundless prairie. The sun was sinking into that sea of flowers. In its path stood a cluster of trees, their grapevines tangled like ropes on ships becalmed at sea.

            Where the woods met the rolling edge of the flower-filled prairie, a herdsman sat on horseback. He rode in a Spanish saddle with Spanish stirrups, and wore gaiters and a doublet of deerskin. Beneath his wide Spanish sombrero, his broad brown face looked over the peaceful land with the commanding air of its master. Countless cattle grazed quietly around him in the meadows. They breathed the cool, misty freshness that rose from the river and spread across the whole landscape.
        - id: ch01-b03
          speaker: narrator
          text: |-
            The herdsman slowly raised the horn at his side. He filled his deep chest and blew a call that traveled wild and sweet and far through the still, damp evening. All at once, long white horns rose out of the grass like flakes of foam where ocean currents meet. The cattle stared for a moment. Then they bellowed and rushed across the prairie until the whole herd became a distant cloud of shadow.

            As the herdsman turned toward home, he saw a priest and a maiden coming through the garden gate. He leaped from his horse in amazement and ran to them with open arms and cries of wonder. They looked into his face and knew him at once. It was Basil the blacksmith.
        - id: ch01-b04
          speaker: narrator
          text: |-
            Basil welcomed them warmly and led them into the garden. Beneath an arbor of roses, questions and answers tumbled out. Old friends embraced again. One moment they laughed, the next they wept. Then they fell silent and thoughtful, because Gabriel had not come.

            Dark doubts crept into Evangeline's heart. Basil, uneasy himself, was the one who finally broke the silence.
        - id: ch01-b05
          speaker: basil
          text: If you came along the Atchafalaya, how did you miss Gabriel's boat on the bayous?
        - id: ch01-b06
          speaker: narrator
          text: A shadow crossed Evangeline's face. Tears filled her eyes.
        - id: ch01-b07
          speaker: evangeline
          text: Gabriel is gone? He has gone?
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: Her voice trembled. She hid her face against Basil's shoulder, and all the grief she had carried inside broke loose in sobs.
        - id: ch01-b09
          speaker: basil
          text: |-
            Take heart, my child. He left only today. Foolish boy! He has gone and left me alone with all my cattle and horses.

            He had grown so moody and restless, so weary and troubled, that he could not bear this quiet life any longer. He thought of you all the time. He was always uncertain and sad. Often he said nothing, and when he did speak, it was only about you or his troubles. At last he had tired every man and maiden around him, even me. So I thought of something for him to do. I sent him to Adayes to trade with the Spaniards for mules.

            From there, he means to follow the Indian trails into the Ozark Mountains. He will hunt for furs in the forests and trap beavers along the rivers. So take heart. We will go after your runaway lover. He has not gone far, and both fate and the streams will slow him down. Tomorrow, through the red morning dew, we will hurry after him and bring him back to his prison.
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: |-
            Glad voices came from the riverbank. Michael the fiddler appeared, carried high on the arms of his comrades. He had lived for years beneath Basil's roof like a god on Olympus, with no care except giving music to mortals. His silver hair and his fiddle were famous far and wide.
        - id: ch01-b11
          speakers: [comrade_1, comrade_2, comrade_3, comrade_4]
          ensemble: chorus
          text: Long life to Michael, our brave Acadian minstrel!
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: |-
            They carried him along in triumph. Father Felician and Evangeline stepped forward to greet the old man. Again and again, the priest spoke kindly to him and called up memories of earlier days. Basil welcomed his old companions and neighbors with booming laughter. He embraced mothers and daughters, overcome with joy.

            The newcomers marveled at the wealth of the man who had once been their blacksmith. They saw his broad lands, his herds, and the fatherly dignity with which he ruled his household. They listened in wonder as he told them about the rich soil and the warm climate. He told them, too, about the countless prairie cattle that belonged to whoever could take them. Each man secretly thought that he would go out and do the same.
        - id: ch01-b13
          speaker: narrator
          text: |-
            Together they climbed the steps, crossed the open veranda, and entered the hall. Basil's supper had been waiting for his late return. Now they rested and feasted together.

            Darkness fell suddenly over the joyful meal. Outside, all was still. The moon rose in the damp night, turning the land silver beneath thousands of stars. Inside, the faces of friends shone even brighter in the soft lamplight.

            Basil sat high at the head of the table. There, among the friends who had been scattered and homeless for so long, he poured out wine and poured out his heart just as freely. Then he filled his pipe with sweet Natchitoches tobacco and lit it. His guests turned toward him. They listened and smiled as he began to speak.
        - id: ch01-b14
          speaker: basil
          text: |-
            Welcome once again, my friends. You have been without friends and without homes for so long. Now you have a home again, and perhaps it is even better than the old one.

            Here, no hungry winter freezes the blood in our bodies and the rivers alike. No stony ground drives a farmer to anger. The plow passes through this soil as smoothly as a ship's keel through water. Orange groves bloom all year. In a single night, the grass grows more than it did through a whole Canadian summer.

            Countless cattle roam these prairies, wild and unclaimed. You need only ask for land. A few strokes of the axe will turn these forests into houses. Build your homes and let your fields grow yellow with harvest. This time, King George of England will never drive you from your land, burn your houses and barns, or steal your farms and cattle!
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: Basil blew an angry cloud of smoke from his nostrils. His great brown hand struck the table with a crash. Every guest jumped. Father Felician froze with a pinch of snuff halfway to his nose. Then Basil went on in a lighter, more cheerful voice.
        - id: ch01-b16
          speaker: basil
          text: |-
            Just watch out for the fever, my friends. You must watch out for that! It is nothing like a fever back in cold Acadie. You cannot cure this one by hanging a spider around your neck inside a nutshell.
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: |-
            Voices sounded at the door. Footsteps crossed the stairs and the floor of the airy veranda. Nearby Creoles and small Acadian planters had come at Basil's invitation.

            Old companions and neighbors met with delight. Friend folded friend into his arms. Exiles who had been strangers only moments before became friends at once. The gentle bond of their common country drew them together.

            Then Michael's fiddle began to sing from the next room, and all talk ended. Everyone hurried toward the music like delighted children, forgetting everything else. Bright-eyed dancers gave themselves to its dizzy whirl. Their clothes fluttered as the dance swept and swayed like a dream.
        - id: ch01-b18
          speaker: narrator
          text: |-
            At the far end of the hall, away from the dancing, Father Felician and Basil sat together. They talked of the past, the present, and what was still to come.

            Evangeline stood as if caught in a dream. Old memories rose inside her. Through the loud music, she heard the sound of the sea. A sadness she could not resist came over her, and she slipped out unseen into the garden.
        - id: ch01-b19
          speaker: narrator
          text: |-
            The night was beautiful. Behind the black wall of the forest, the moon rose and tipped the treetops with silver. Its unsteady light fell here and there upon the river through the branches, like gentle thoughts of love entering a dark and wandering heart.

            Flowers all around Evangeline poured their fragrance into the night as if offering prayers and confessions to a silent passing monk. Her own heart held a fragrance deeper than theirs, but it was also heavy with shadow and night dew. The calm, magical moonlight seemed to flood her soul and fill it with longings she could not name.
        - id: ch01-b20
          speaker: narrator
          text: |-
            She passed through the garden gate and followed the path beneath the oaks to the edge of the measureless prairie. It lay silent under a silver haze. Fireflies gleamed and floated in numbers beyond counting.

            The stars shone above her, like the thoughts of God written across the heavens. People had almost forgotten how to look up in wonder and worship. Only the blaze of a comet could startle them, like a hand writing the word “Upharsin” upon the temple wall.

            Between the stars and the fireflies, Evangeline's soul wandered alone. At last, she cried out.
        - id: ch01-b21
          speaker: evangeline
          text: |-
            Oh, Gabriel! My beloved! Can you be so near me when I still cannot see you? Can you be so near when your voice cannot reach me?

            How many times have your feet followed this path to the prairie? How many times have your eyes looked upon these woods around me? How often have you come home from your work, lain beneath this oak, and dreamed of me as you slept?

            When will my eyes see you again? When will my arms hold you?
          emotion: sad
        - id: ch01-b22
          speaker: narrator
          text: |-
            A whippoorwill called out, loud and sudden and close, like a flute sounding in the woods. Its note moved through the nearby thickets, farther and farther away, until it faded into silence.

            “Patience,” the oaks seemed to whisper from their deep chambers of darkness. From the moonlit meadow, a sigh seemed to answer, “Tomorrow.”
        - id: ch01-b23
          speaker: narrator
          text: |-
            The next morning, the sun rose bright. The garden flowers bathed its shining feet with their tears and touched its hair with the sweet balm held in their crystal cups.

            Father Felician stood in the shadowed doorway to say farewell.
        - id: ch01-b24
          speaker: father_felician
          text: Farewell. Be sure you bring back our Prodigal Son from his hunger, and our Foolish Virgin who slept while the bridegroom came.
        - id: ch01-b25
          speaker: evangeline
          text: Farewell!
          emotion: happy
        - id: ch01-b26
          speaker: narrator
          text: |-
            Evangeline smiled and went down with Basil to the riverbank, where the boatmen were waiting. So their journey began in morning light, sunshine, and gladness. They moved swiftly after Gabriel, who was hurrying on ahead of them, blown by fate like a dead leaf across the desert.

            They found no trace of him that day, nor the next, nor the day after that. Lakes, forests, and rivers gave them nothing. Many days passed, and still they did not find him. Only uncertain rumors led them through the wild and lonely country.

            At last they reached the little inn in the Spanish town of Adayes, weary and worn. There the talkative landlord told them that Gabriel had left the village the day before. With horses, guides, and companions, he had taken the road across the prairies.
