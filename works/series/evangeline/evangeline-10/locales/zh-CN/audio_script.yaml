audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静庄重，带着古老传说的悠远与克制的哀愁
        timbre: 温暖清澈，低沉而有回响
        pace: 舒缓从容，在景物转换处自然停顿
        pitch: 中低
    evangeline:
      display_name: 伊凡吉林
      tts:
        delivery: 温柔真挚，悲痛时克制而颤抖
        timbre: 清澈柔和，年轻而明亮
        pace: 平稳舒缓，情绪激越时略快
        pitch: 中
  chapters:
    - id: ch01
      title: 佩恩的城市
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            特拉华河流过一片可爱的土地。佩恩创建的城市就立在河岸，藏在林木的绿荫里。那里的空气温润得像香膏，桃子象征着美。街道还用森林中的树木命名，仿佛这样就能安抚那些失去住处的树泽仙女。
        - id: ch01-b02
          speaker: narrator
          text: |-
            伊凡吉林漂过动荡的大海，以流亡者的身份登上这里。她在佩恩的子民中间找到了家园，也找到了自己的国土。年迈的勒内·勒布朗在这里去世。他有上百名后人，临终时守在身边的却只有一个。
        - id: ch01-b03
          speaker: narrator
          text: |-
            这座城市的街道亲切地接纳了伊凡吉林，让她不再觉得自己是异乡人。贵格会教徒用古雅而亲近的方式彼此称呼，那声音总叫她想起从前的阿卡迪亚。故乡的人们彼此平等，人人都是兄弟姐妹。
        - id: ch01-b04
          speaker: narrator
          text: |-
            漫长的寻觅已经落空，在尘世间再也不会重新开始。伊凡吉林没有抱怨。她的心和脚步都转向这座城市，就像树叶转向阳光。清晨的雨雾从山顶散去时，山下的河流、城市和村庄都会在阳光里显露。她心中的雾也散了。世界不再幽暗，处处都被爱照亮。回头望去，就连她艰难走过的道路，也变得平坦而美好。
        - id: ch01-b05
          speaker: narrator
          text: |-
            加布里埃尔并没有被忘记。他仍旧住在她心里，永远保持着两人最后相见时的青春模样。死一般的沉默和长久的离别，反而让他的形象更加美好。在她思念他的地方，时间并不存在，岁月也不能改变他。他仿佛已经离开尘世，而不只是去了远方。
        - id: ch01-b06
          speaker: narrator
          text: |-
            苦难的一生教会伊凡吉林忍耐，教会她忘记自己，把一切献给别人。她的爱从此流向众人，却没有因此减少分毫，就像芬芳的香料让满室都染上香气，自身却并未耗尽。她没有别的希望，也没有别的愿望，只想温顺而虔敬地跟随救主的脚步。
        - id: ch01-b07
          speaker: narrator
          text: |-
            许多年里，她一直做着仁慈修女。她走进拥挤的小巷，探望一间间孤苦破败的屋子。贫困藏在那里，躲着阳光。阁楼上，疾病和悲伤无人照管，只能日渐衰弱。夜深以后，世人已经入睡，守夜人在狂风卷过的街上高声报着全城平安，总能看见某扇孤零零的高窗里亮着伊凡吉林的烛光。清晨天色还灰，德国农夫载着花果进城赶集，也总会遇见她结束整夜的看护，带着苍白而温顺的脸走回家。
    - id: ch02
      title: 瘟疫中的灯火
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            后来，瘟疫降临了这座城市。灾难到来以前，天空出现种种异象。成群的野鸽飞过，黑压压地遮住太阳，可它们的嗉囊里除了一颗橡子，什么也没有。
        - id: ch02-b02
          speaker: narrator
          text: |-
            九月的海潮能涌进一条银亮的小河，漫过两岸，在草地上铺成湖泊。死亡也这样灌进了生命。它越过原来的边界，把人生的银色溪流淹成一片苦咸的湖。财富不能收买这个暴君，美貌也不能叫它回心转意。无论是谁，都倒在同样的鞭笞下。
        - id: ch02-b03
          speaker: narrator
          text: |-
            最可怜的是那些没有亲友、也无人照看的穷人。他们只能悄悄爬到济贫院，在无家者之家等待死亡。那时，济贫院还在城郊，四面围着草地和树林。如今城市早已把它围住，可那谦卑的矮墙和一大一小两道门，仿佛还在轻声重复主的话：“因为常有穷人和你们同在。”
        - id: ch02-b04
          speaker: narrator
          text: |-
            伊凡吉林不分昼夜地来到这里。垂死的人抬头望她，觉得她的额头周围真的亮着天国的光。那光就像画家描绘在圣徒和使徒眉间的光环，也像夜里远望一座城市时，悬在城池上空的微光。他们相信，那正是天国之城的灯火。自己的灵魂很快就会走进闪耀的城门。
    - id: ch03
      title: 安息日的早晨
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            一个安息日的早晨，伊凡吉林穿过空寂无人的街道，走进济贫院。夏日的花园送来甜美的香气。她在去病房的路上停下脚步，采了几朵最美的花，想让垂死的人最后一次感受花朵的芬芳和美丽。
        - id: ch03-b02
          speaker: narrator
          text: |-
            她登上楼梯，走向东风吹得清凉的长廊。远处传来基督堂钟楼柔和的钟声。越过草地，维卡科瑞典教堂的赞美诗声也飘了过来，与钟声交织在一起。这一刻的宁静落在她心上，轻得仿佛羽翼徐徐降下。
        - id: ch03-b03
          speaker: narrator
          text: |-
            她心底有个声音说，磨难终于结束了。伊凡吉林眼里带着光，走进病房。勤勉细心的看护者无声地来回走动。他们润湿病人被高烧灼痛的嘴唇，也擦拭一张张疼痛的额头。有人死去，他们便默默合上那双再也看不见的眼睛，遮住死者的面容。简陋的铺位上，那些身体就像路边一堆堆积雪。
        - id: ch03-b04
          speaker: narrator
          text: |-
            伊凡吉林一出现，许多无力的头便从枕上抬起。她经过时，病人忍着痛转头看她。她的到来，就像一束阳光落在牢狱的墙上。环顾四周，她看见抚慰人的死神已把手放在许多人心上，让他们永远不再受苦。许多熟悉的身影在夜间消失了。空出的铺位，有些已经躺上陌生人。
    - id: ch04
      title: 最后的重逢
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            伊凡吉林突然停住了。像是被恐惧抓住，又像是看见了无法相信的景象，她毫无血色的嘴唇微微张开，全身一阵战栗。花朵从她忘记合拢的手指间掉落，眼里和脸上的晨光也一同消失。
        - id: ch04-b02
          speaker: narrator
          text: |-
            一声痛苦至极的呼喊从她口中迸出，连垂死的人都从枕上惊起。她面前的铺位上，躺着一个老人。鬓边的头发又长又稀，已经灰白。可在晨光里，他的面容有一瞬间恢复了青年时的轮廓。临死的人，脸上有时会出现这样的变化。
        - id: ch04-b03
          speaker: narrator
          text: |-
            高烧留下的红晕还在他灼热的嘴唇上燃烧。那情形仿佛生命也学着古时的希伯来人，把鲜血洒在门楣上，好让死亡天使看见记号，从门前越过。老人一动不动，毫无知觉，正在死去。他疲惫的灵魂仿佛沉进无穷无尽的黑暗，沉进昏睡和死亡，一直下沉，一直下沉。
        - id: ch04-b04
          speaker: narrator
          text: |-
            就在那片阴影里，他听见痛苦的呼喊一层层传来。四周重新安静以后，一个温柔得像圣徒的声音低低响起。
        - id: ch04-b05
          speaker: evangeline
          text: |-
            加布里埃尔！啊，我的爱人！
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: |-
            声音渐渐消失。他却在梦中回到童年的家园，又看见阿卡迪亚碧绿的草地、林间的河流、村庄、群山和森林。树影下，年轻的伊凡吉林正向他走来，就像许多年前一样。
        - id: ch04-b07
          speaker: narrator
          text: |-
            泪水涌进他的眼睛。他慢慢睁开眼帘，幻象不见了，伊凡吉林却真的跪在床边。他想低声唤她的名字，可声音没能出口。只有嘴唇微微翕动，泄露了他想说的话。他还想坐起来，同样没有力气。
        - id: ch04-b08
          speaker: narrator
          text: |-
            伊凡吉林吻了吻他垂死的嘴唇，把他的头抱进怀里。他眼中的光温柔明亮，却突然沉入黑暗，就像窗边的一盏灯被疾风吹灭。
        - id: ch04-b09
          speaker: narrator
          text: |-
            一切都结束了。希望、恐惧和悲伤结束了。心痛、永远得不到满足的渴望，还有漫长忍耐中的折磨，也全都结束了。伊凡吉林把那颗已经失去生命的头再一次抱紧，然后温顺地低下头。
        - id: ch04-b10
          speaker: evangeline
          text: |-
            天父，我感谢你！
          emotion: calm
    - id: ch05
      title: 森林依然矗立
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            原始森林依然矗立。可在远离它浓荫的地方，那对恋人并肩睡在无名的坟墓里。他们长眠在小小的天主教墓园中，低矮的围墙环绕着他们。这里就在城市中心，他们却无人知道，也无人留意。
        - id: ch05-b02
          speaker: narrator
          text: |-
            生命的潮水每天都在他们身边涨落。成千颗心仍在跳动，而他们的心已经永远安息。成千个疼痛的头脑仍在操劳，而他们的思绪不再忙碌。成千双手还在工作，他们的双手已经停下。成千双疲惫的脚还在赶路，他们的旅程已经走完。
        - id: ch05-b03
          speaker: narrator
          text: |-
            原始森林依然矗立。只是它的枝叶下，已经住着另一个民族。他们有另一种风俗，也说着另一种语言。只有在忧伤而多雾的大西洋岸边，还留着少数阿卡迪亚农民。他们的先辈从流亡之地辗转归来，只愿死在故土的怀抱。
        - id: ch05-b04
          speaker: narrator
          text: |-
            渔夫的小屋里，纺车和织机仍忙个不停。少女们仍戴着诺曼底式的帽子，穿着土布裙裳。傍晚围坐在炉火旁，她们仍会讲起伊凡吉林的故事。附近的大海从岩洞深处发出低沉的声音，用凄凉的声调，回应森林的哀号。
