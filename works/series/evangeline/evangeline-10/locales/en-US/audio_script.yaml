  chapters:
    - id: ch01
      title: Part the Second, V
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            There is a lovely land beside the Delaware River. In the shade of its trees, it guards the name of Penn, the apostle. On the banks of that beautiful stream stands the city he founded.

            The air there is sweet. The peach is an emblem of beauty, and the streets still carry the names of forest trees. It is almost as if the city wished to make peace with the woodland spirits whose homes it had disturbed.

            Evangeline had come ashore there after her years on the troubled sea, an exile at last finding a home among the children of Penn. Old René Leblanc had died in that city. Of all his hundred descendants, only Evangeline was beside him when he went.
        - id: ch01-b02
          speaker: narrator
          text: |-
            Something in those friendly streets spoke to her heart, and she no longer felt like a stranger. She liked hearing the Quakers say “thee” and “thou.” Those words brought back the old Acadian country, where all people had lived as equals, like brothers and sisters.

            Her long search had brought nothing but disappointment. Now it had ended, never to begin again in this world. She did not complain. Like leaves turning toward the light, her thoughts and her footsteps turned toward this city.
        - id: ch01-b03
          speaker: narrator
          text: |-
            Think of the rainy mist rolling away from a mountaintop in the morning. Far below, the whole country appears in sunlight, with bright rivers, cities, and villages. In the same way, the mist lifted from Evangeline's mind. The world below her was no longer dark. Love shone over everything. Even the steep path she had traveled looked smooth and fair in the distance.

            She had not forgotten Gabriel. His image remained in her heart, young and beautiful as he had been when she last saw him. His deathlike silence and his absence only made that image more beautiful. Time never entered her thoughts of him. The years could not touch him there. To her heart, he was no longer someone absent, but someone dead and transformed.
        - id: ch01-b04
          speaker: narrator
          text: |-
            A life of sorrow and trial had taught Evangeline patience. It had taught her to give up her own desires and devote herself to others. Her love now spread out to everyone around her, yet none of it was lost. It was like the scent of spices filling the air while the spices themselves remain whole.

            She had no other earthly hope or wish. She wanted only to follow humbly and reverently in the sacred footsteps of her Savior.
        - id: ch01-b05
          speaker: narrator
          text: |-
            For many years, Evangeline lived as a Sister of Mercy. She visited lonely, miserable homes in the city's crowded lanes. In those places, suffering and need hid from the sunlight. In neglected attic rooms, sickness and sorrow waited with no one to tend them.

            Night after night, while the city slept, the watchman walked the windy streets and called that all was well. As he passed, he would see the light from Evangeline's candle high in some lonely window.

            Day after day, at the gray edge of dawn, a German farmer would plod through the outskirts with flowers and fruit for the market. On his way, he would meet her coming home from another night's watch, her face pale and gentle.
        - id: ch01-b06
          speaker: narrator
          text: |-
            Then a pestilence fell upon the city. Strange signs were said to have foretold it. Most remarkable were the great flocks of wild pigeons that darkened the sun as they flew overhead, though each bird carried nothing but an acorn in its crop.

            In September, the sea tide may rise into a silver stream until it spreads into a lake across the meadow. So death rose into the stream of life. It overflowed the stream's natural banks and spread into a bitter lake.
        - id: ch01-b07
          speaker: narrator
          text: |-
            Wealth could not bribe this oppressor, and beauty could not charm it. Rich and poor died beneath the same scourge. But the poor had no friends or attendants to care for them. They crept away to die in the almshouse, the home of those who had no home.

            In those days, the almshouse stood beyond the city, surrounded by meadows and woods. The city has grown around it now. Yet its humble walls, its gateway, and its little wicket still seem to whisper amid all that splendor, “The poor ye always have with you.”
        - id: ch01-b08
          speaker: narrator
          text: |-
            Evangeline came to that place by day and by night. When the dying looked into her face, they thought they saw a heavenly light shining around her forehead. It seemed like the light artists paint above saints and apostles, or the glow that hangs over a distant city after dark.

            To their eyes, that brightness seemed to come from the lamps of the heavenly city. Before long, they believed, their spirits would pass through its shining gates.
        - id: ch01-b09
          speaker: narrator
          text: |-
            One Sabbath morning, Evangeline made her quiet way through empty, silent streets and entered the almshouse. The summer air carried the sweet scent of the garden flowers. She stopped to gather the loveliest blossoms, so the dying might enjoy their fragrance and beauty once more.

            She climbed the stairs toward the corridors, where an east wind brought cool air. Far away, the bells of Christ Church sounded softly from the belfry. Across the meadows came another sound, mingling with the chimes. The Swedes were singing psalms in their church at Wicaco.

            The peace of that hour settled over her spirit as softly as descending wings.
        - id: ch01-b10
          speaker: evangeline
          text: At last, your trials are over.
          emotion: calm
        - id: ch01-b11
          speaker: narrator
          text: |-
            The words rose from somewhere within her. With light in her face, Evangeline entered the sickrooms.

            The careful attendants moved without noise. They moistened feverish lips and aching brows. In silence, they closed the eyes of the dead and covered their faces. The bodies lay on their pallets like drifts of snow beside a road.
        - id: ch01-b12
          speaker: narrator
          text: |-
            As Evangeline passed, many weary heads lifted and turned upon their painful pillows to watch her. Her presence touched their hearts like a ray of sunlight falling across the walls of a prison.

            She looked around and saw that Death, the consoler, had laid his hand upon many hearts and healed them forever. Familiar faces had vanished during the night. Their places were empty, or strangers already lay there instead.
        - id: ch01-b13
          speaker: narrator
          text: |-
            Suddenly Evangeline stopped. It was as if fear or wonder had caught and held her. Her colorless lips parted, and a shudder passed through her body. She forgot the flowers in her hand. They fell from her fingers, and all the morning light and color left her eyes and cheeks.

            Then a cry of terrible anguish broke from her. Even the dying heard it and started up from their pillows.
        - id: ch01-b14
          speaker: narrator
          text: |-
            An old man lay stretched upon the pallet before her. His hair was long, thin, and gray around his temples. Yet as the morning light touched him, his face seemed for a moment to take on the shape it had in early manhood. The faces of the dying sometimes change that way.

            The fever still burned hot and red upon his lips. It was as if life had marked its doorway with blood, like the Hebrew of old, so the Angel of Death might see the sign and pass over.
        - id: ch01-b15
          speaker: narrator
          text: |-
            He lay without motion or sense, close to death. His exhausted spirit seemed to be sinking through endless depths of darkness, down through sleep and death, always sinking farther.

            Then Evangeline's cry reached him in that shadowy place. It echoed again and again. In the hush that followed, a gentle voice whispered with saintly tenderness.
        - id: ch01-b16
          speaker: evangeline
          text: Gabriel! Oh, my beloved!
          emotion: sad
        - id: ch01-b17
          speaker: narrator
          text: |-
            Her voice faded into silence.

            In a dream, Gabriel saw the home of his childhood once more. The green meadows of Acadia opened before him, with wooded rivers winding through them. He saw the village, the mountain, and the forests. Beneath their shade walked Evangeline, just as she had in the days of her youth.

            Tears filled his eyes. Slowly he raised his eyelids. The vision vanished, and there was Evangeline herself, kneeling beside his bed.
        - id: ch01-b18
          speaker: narrator
          text: |-
            Gabriel tried to whisper her name, but no sound came. The word died upon his lips. Only their movement showed what he had wanted to say.

            He tried to rise, but he could not. Evangeline knelt close to him, kissed his dying lips, and laid his head against her breast.

            A sweet light shone in his eyes. Then it suddenly went dark, like a lamp blown out by a gust of wind at the window.
        - id: ch01-b19
          speaker: narrator
          text: |-
            Now everything had ended. Hope and fear and sorrow were over. So were the heartache, the restless longing that could never be satisfied, and the deep, unceasing pain of waiting.

            Evangeline pressed the lifeless head to her breast once more. Then she bowed her own head meekly and murmured.
        - id: ch01-b20
          speaker: evangeline
          text: Father, I thank thee.
          emotion: calm
        - id: ch01-b21
          speaker: narrator
          text: |-
            The ancient forest still stands. Yet far from its shadow, the two lovers sleep side by side in graves without names.

            They lie beneath the humble walls of a little Catholic churchyard in the heart of the city. No one knows them or notices them. Around their resting place, the tides of life rise and fall each day.

            Thousands of hearts beat nearby, while theirs are still forever. Thousands of aching minds remain busy, while theirs have no more cares. Thousands of hands keep working, while theirs have finished their labor. Thousands of tired feet pass them, while their journey is complete.
        - id: ch01-b22
          speaker: narrator
          text: |-
            The ancient forest still stands. But now another people lives beneath its branches, with different customs and a different language.

            Only along the mournful, misty shore of the Atlantic do a few Acadian peasants remain. Their fathers wandered home from exile so they could die in their native land.

            In the fisherman's cottage, the spinning wheel and the loom are still at work. Young women still wear their Norman caps and homespun skirts. Beside the evening fire, they tell the story of Evangeline again.
        - id: ch01-b23
          speaker: narrator
          text: |-
            Nearby, the ocean speaks from its rocky caverns in a deep voice. With sorrow in every sound, it answers the wail of the forest.
