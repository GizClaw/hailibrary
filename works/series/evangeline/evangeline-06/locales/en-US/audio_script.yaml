  chapters:
    - id: ch01
      title: Part the Second, I
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Many weary years had passed since Grand-Pre burned. On the falling tide, the loaded ships had carried a whole people into an exile that seemed to have no end. The Acadians came ashore far apart, on distant coasts. They were scattered like snowflakes driven sideways by a northeast wind through the fog over the Banks of Newfoundland.

            With no friends, no homes, and little hope, they wandered from one city to another. They went from the cold northern lakes to the hot savannas of the South, and from the harsh seacoast to the country of the Father of Waters. There, the great river tears earth from the hills, carries it toward the ocean, and buries ancient bones deep in the sand.

            They searched for friends and homes. But many grew so brokenhearted that they asked the earth for nothing more than a grave. Their history can still be read on the stones in churchyards.
        - id: ch01-b02
          speaker: narrator
          text: |-
            For a long time, one young woman could be seen among those wandering people. She was humble and gentle, waiting patiently through every hardship. Evangeline was still young and beautiful, but life stretched before her like a vast, silent desert. Its path was marked by the graves of those who had suffered before her, and by hopes that had gone cold and died. It was like an emigrant's trail across the western wilderness, marked by dead campfires and bones bleaching in the sun.

            Something in her life remained incomplete. It was as though a bright June morning, full of sunlight and music, had suddenly stopped in the sky, then slowly faded back into the east where it began.
        - id: ch01-b03
          speaker: narrator
          text: |-
            At times, Evangeline stayed in one town for a while. Then the fever inside her returned. Her spirit hungered and thirsted to know, and she began her endless search again.

            Sometimes she wandered through churchyards, studying the crosses and gravestones. She would sit beside an unknown grave and wonder whether Gabriel was already resting there. Then she longed to sleep beside him.

            At other times, a rumor came to her, no more than a half-heard whisper, and beckoned her onward. Now and then, she met people who had known her beloved. They had seen him long ago, in some distant place they could barely remember.
        - id: ch01-b04
          speakers: [acadian_1, acadian_2, acadian_3]
          ensemble: chorus
          text: Yes, we have seen Gabriel Lajeunesse! He was with Basil the blacksmith. They both went out to the prairies and became famous hunters and trappers.
        - id: ch01-b05
          speaker: narrator
          text: Others had a different report.
        - id: ch01-b06
          speakers: [acadian_1, acadian_2, acadian_3]
          ensemble: chorus
          text: Yes, we have seen Gabriel Lajeunesse! He is a voyageur down in the lowlands of Louisiana.
        - id: ch01-b07
          speaker: narrator
          text: Then the people would urge Evangeline to give up her long wait.
        - id: ch01-b08
          speakers: [acadian_1, acadian_2, acadian_3]
          ensemble: chorus
          text: Dear child, why keep dreaming of Gabriel and waiting for him? There are other young men just as handsome, with loving, faithful hearts. Baptiste Leblanc, the notary's son, has loved you for years. Take his hand and be happy. You are far too lovely to stay unmarried all your life.
        - id: ch01-b09
          speaker: narrator
          text: Evangeline always answered with quiet sorrow.
        - id: ch01-b10
          speaker: evangeline
          text: I cannot. My hand must follow where my heart has gone. It cannot go anywhere else. When the heart travels ahead like a lamp and lights the path, we can see many things that would otherwise stay hidden in darkness.
          emotion: sad
        - id: ch01-b11
          speaker: narrator
          text: Father Felician was her friend and confessor. He smiled as he answered her.
        - id: ch01-b12
          speaker: father_felician
          text: |-
            My daughter, this is how God speaks within you. Do not say that love is wasted. Love is never wasted. If it does not enrich another person's heart, it flows back to its own source, as rain returns to a spring and fills it with fresh water. Whatever the fountain pours out will come back to the fountain.

            Be patient, and complete the work your love has given you. Sorrow and silence have great strength, and patient endurance brings us close to God. Keep doing this work of love until your heart grows more like his, purified and strengthened, perfected and made more worthy of heaven.
          emotion: calm
        - id: ch01-b13
          speaker: narrator
          text: |-
            The good priest's words gave Evangeline courage. She went on working and waiting. In her heart, she could still hear the ocean singing its funeral song. But another voice now mingled with it and whispered, "Do not despair."

            And so that suffering soul continued to wander through need and joyless hardship, as if barefoot and bleeding over all the sharp fragments and thorns of life.
        - id: ch01-b14
          speaker: narrator
          text: |-
            Muse, help me follow the wanderer's footsteps. I will not trace every winding path or tell of every changing year. I will follow her as a traveler follows a little stream through a valley.

            Sometimes the traveler walks far from the bank and catches only an occasional flash of water in an open place. Then the path draws close again beneath shadowy trees that hide the stream from sight, though its murmur can still be heard. The traveler will be happy at last if the path leads to the place where the stream finds its way out.
