audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静庄重，带着古老传说的悠远与克制的哀愁
        timbre: 温暖清澈，低沉而有回响
        pace: 舒缓从容，在景物转换处自然停顿
        pitch: 中低
    felician:
      display_name: 费利西安神父
      tts:
        delivery: 庄重慈悲，劝诫时坚定而满含哀痛
        timbre: 深沉温厚，清晰而有回响
        pace: 徐缓有分量，在祷词前自然停顿
        pitch: 中低
    evangeline:
      display_name: 伊凡吉林
      tts:
        delivery: 温柔真挚，悲痛时克制而颤抖
        timbre: 清澈柔和，年轻而明亮
        pace: 平稳舒缓，情绪激越时略快
        pitch: 中
    witness_1:
      display_name: 旅人甲
      tts:
        delivery: 朴实直接，回想往事时稍带迟疑
        timbre: 粗粝温厚
        pace: 平稳自然
        pitch: 中低
    witness_2:
      display_name: 旅人乙
      tts:
        delivery: 诚恳直率，说起消息时清楚利落
        timbre: 清亮朴实
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 四散的民族
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            大草原村化为灰烬以后，疲惫的岁月一年年过去。那一天，满载的船趁着落潮离开，把整个民族和每户人家珍爱的一切，全都带上了流亡之路。这样的流亡没有尽头，史册上也从未有过。
        - id: ch01-b02
          speaker: narrator
          text: |-
            阿卡迪亚人在相隔遥远的海岸登陆，从此四散各处。他们就像雪片遇上东北风，被斜斜吹进纽芬兰渔场的浓雾，再也聚不到一起。
        - id: ch01-b03
          speaker: narrator
          text: |-
            他们没有亲友，没有家园，也看不见希望，只能从一座城流落到另一座城。北方寒冷的湖边有他们的足迹，南方闷热的草原也有。他们走过荒凉的海岸，又来到大河流经的土地。那条河仿佛伸出双手，把山丘拖进海洋，再用泥沙埋住散落的猛犸遗骨。
        - id: ch01-b04
          speaker: narrator
          text: |-
            流亡者一路寻找亲友，也寻找可以安身的家。许多人早已绝望，心也碎了。他们不再向大地求朋友，不再求一炉温暖的火，只求一座坟墓。墓园里的一块块石碑，写下了他们的故事。
    - id: ch02
      title: 漂泊的少女
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            在这些流亡者中，人们常年都能看见一位少女。她等待着，也漂泊着，性情谦卑温顺，默默忍受一切。她仍旧年轻美丽，可展现在眼前的，却是一片辽阔、凄凉、寂静的人生荒漠。
        - id: ch02-b02
          speaker: narrator
          text: |-
            她走的路上，尽是先她而去的受苦者留下的坟墓，尽是早已熄灭的热情和死去的希望。就像移民穿过西部荒漠，只能凭燃尽的营火和阳光下惨白的枯骨，认出前人走过的路。
        - id: ch02-b03
          speaker: narrator
          text: |-
            她的生命仿佛总缺少一部分，始终没有完成。那就像一个六月的早晨，本来满是歌声与阳光，却忽然停在天上，慢慢暗下去，又沉回刚刚升起的东方。
        - id: ch02-b04
          speaker: narrator
          text: |-
            有时，伊凡吉林会在一座城里住上一阵。可她心里的热望总会再次醒来。灵魂的饥渴让她无法安歇，又催着她踏上没有尽头的寻找之路。
        - id: ch02-b05
          speaker: narrator
          text: |-
            有时，她独自在墓园里徘徊，望着十字架和墓碑。她坐到一座无名坟旁，心想，加布里埃尔也许已经长眠在这里。要真是这样，她只愿也睡在他身边。
        - id: ch02-b06
          speaker: narrator
          text: |-
            有时，一点传闻，一句耳语，或是一阵听不清的议论，也会像无形的手，朝前方指一指，再招她继续赶路。
    - id: ch03
      title: 遥远的消息
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            她也遇见过认识加布里埃尔的人。他们确实见过他，可那已经是很久以前，地方不是远得难以追寻，就是早被人忘了。
        - id: ch03-b02
          speaker: witness_1
          text: |-
            加布里埃尔·拉热内斯？对，我见过。他那时跟铁匠巴西尔在一起。两个人后来去了大草原，当上林野行者，打猎、设陷阱捕兽，名气很大。
        - id: ch03-b03
          speaker: narrator
          text: |-
            另一些人说起加布里埃尔时，给出的却是另一个消息。
        - id: ch03-b04
          speaker: witness_2
          text: |-
            加布里埃尔·拉热内斯？见过。他在路易斯安那低地做船夫。
        - id: ch03-b05
          speaker: narrator
          text: |-
            可消息说过以后，人们常常反过来劝她，不要再等了。
        - id: ch03-b06
          speaker: witness_1
          text: |-
            好孩子，何必还一心想着他，年年等着他呢？世上又不是只有加布里埃尔一个好青年。别人也有温柔真诚的心，也能忠贞不贰。
        - id: ch03-b07
          speaker: witness_1
          text: |-
            公证人的儿子巴蒂斯特·勒布朗就爱了你许多年。把手交给他，好好过日子吧。你这么好的姑娘，不该留下来替圣凯瑟琳梳头发，孤独终老。
        - id: ch03-b08
          speaker: narrator
          text: |-
            伊凡吉林每次听见这样的劝说，总是平静地回答，声音里带着悲伤。
        - id: ch03-b09
          speaker: evangeline
          text: |-
            我不能答应。我的心去了哪里，我的手就只会跟到哪里，绝不会交给别人。心若走在前面，就像一盏灯照着路，许多藏在黑暗里的事，也会变得清楚。
          emotion: sad
    - id: ch04
      title: 深情的使命
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            她的朋友，也是为她听告解的费利西安神父，听后总会微微一笑。
        - id: ch04-b02
          speaker: felician
          text: |-
            女儿啊，这是上帝在你心里说话。别说你的深情白白耗尽了，深情永远不会白费。
          emotion: calm
        - id: ch04-b03
          speaker: felician
          text: |-
            如果它没能滋润另一个人的心，就会像雨水流回源头，让那里的泉水重新丰盈。泉中流出去的水，最后仍会回到泉中。
          emotion: calm
        - id: ch04-b04
          speaker: felician
          text: |-
            耐心一些，去做完你的使命，把这份爱交给你的事做完。悲伤和沉默自有力量，耐心忍受，也能让人接近神圣。
          emotion: calm
        - id: ch04-b05
          speaker: felician
          text: |-
            所以，继续完成你用爱承担的使命吧。让你的心经受净化，变得坚强、完整，也更配得上天国。
          emotion: calm
        - id: ch04-b06
          speaker: narrator
          text: |-
            善良神父的话安慰了伊凡吉林。从那以后，她一边劳作，一边等待。海洋的葬歌仍在她心里回响，可涛声中又混进一个轻轻的声音。
        - id: ch04-b07
          speaker: narrator
          text: |-
            那声音告诉她，不要绝望。
    - id: ch05
      title: 追随溪流
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            这个可怜的灵魂仍在匮乏和凄苦中流浪。她赤着流血的双脚，踏过人生遍地的碎石和荆棘。
        - id: ch05-b02
          speaker: narrator
          text: |-
            缪斯啊，请让我试着追上她的足迹吧。我不会走遍她人生中每条曲折的小路，也不会数尽那些不断变幻的年月。
        - id: ch05-b03
          speaker: narrator
          text: |-
            我要像一个旅人，循着谷中的溪水向前。有时，他离溪岸很远，只能偶尔从一片开阔地望见粼粼水光。
        - id: ch05-b04
          speaker: narrator
          text: |-
            过一阵，他又穿过幽暗的树林，走近岸边。树木把溪流遮住了，眼睛虽看不见，耳边却一直听得到流水低语。
        - id: ch05-b05
          speaker: narrator
          text: |-
            最后，若能找到溪水奔向归宿的地方，他便已经足够幸运。
