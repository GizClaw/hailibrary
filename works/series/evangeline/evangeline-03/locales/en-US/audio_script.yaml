  chapters:
    - id: ch01
      title: Part the First, III
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            The old notary's body was bent with age, like an oar straining through the ocean surf. Bent, but not broken. Thick yellow hair, soft as corn silk, fell over his shoulders. His forehead was high, and horn-rimmed glasses rested on his nose, giving him a look of uncommon wisdom.

            He had fathered twenty children, and more than a hundred grandchildren had sat on his knee to hear his great watch tick. During the war, he had spent four long years as a prisoner in an old French fort because he had sided with the English. He had suffered greatly there. The years had made him more cautious, but they had left no deceit or suspicion in him. He was wise, patient, simple, and childlike.

            Everyone loved him, especially the children. He knew all the old village tales. He told them about the werewolf in the forest, the goblin who came at night to water the horses, and the white ghost of an unbaptized child who wandered unseen through children's rooms. He told them that oxen spoke in their stalls on Christmas Eve, that a spider sealed in a nutshell could cure a fever, and that four-leaf clovers and horseshoes held wonderful powers.
        - id: ch01-b02
          speaker: narrator
          text: |-
            Then Basil the blacksmith rose from his chair beside the fire. He knocked the ashes from his pipe and slowly held out his right hand.
        - id: ch01-b03
          speaker: basil
          text: Father Leblanc, you've heard what people are saying in the village. Can you tell us anything about those ships and why they've come?
        - id: ch01-b04
          speaker: narrator
          text: The notary answered modestly.
        - id: ch01-b05
          speaker: father_leblanc
          text: I've heard plenty of talk, but it hasn't made me any wiser. I know no more than anyone else about their purpose. Still, I don't believe they've come to harm us. We are at peace, so why should they trouble us?
        - id: ch01-b06
          speaker: narrator
          text: Basil was quick-tempered, and now he shouted.
        - id: ch01-b07
          speaker: basil
          text: In God's name, must we always ask how and why before we believe danger is real? Injustice happens every day. The strongest take what they want and call it right!
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: Father Leblanc paid no attention to Basil's anger and went on.
        - id: ch01-b09
          speaker: father_leblanc
          text: People may be unjust, but God is just, and in the end justice wins. I remember a story that often comforted me when I was held prisoner in the old French fort at Port Royal.
        - id: ch01-b10
          speaker: narrator
          text: It was the old man's favorite tale. Whenever his neighbors complained of some injustice, he loved to tell it again.
        - id: ch01-b11
          speaker: father_leblanc
          text: |-
            Long ago, in a city whose name I've forgotten, a bronze statue of Justice stood high on a column in the public square. In her left hand she held a set of scales. In her right, she carried a sword. The statue was meant to show that justice watched over the country's laws and over the hearts and homes of its people. Birds even built nests in the scales, with no fear of the sword flashing above them in the sun.

            But as time passed, the laws became corrupt. Power took the place of right. The strong oppressed the weak and ruled them harshly.

            Then a pearl necklace vanished from a nobleman's palace. Suspicion fell upon an orphan girl who worked there as a maid. She was tried, condemned, and sent to die on the scaffold. She met her death patiently at the foot of the statue of Justice.

            As her innocent spirit rose to her Father in heaven, a storm broke over the city. Lightning struck the bronze statue. The scales came crashing from its left hand onto the pavement. Inside one of them, the people found a magpie's nest built of clay. The missing pearl necklace had been woven into its walls.
        - id: ch01-b12
          speaker: narrator
          text: |-
            When the tale ended, Basil fell silent, though it had not convinced him. He stood like a man who longed to speak but could find no words. Every thought had hardened into a line upon his face, like winter vapor freezing into strange shapes on a windowpane.

            Evangeline lit the brass lamp on the table. Then she filled the pewter tankard until nut-brown ale spilled over its rim. The home-brewed drink was famous throughout Grand-Pré for its strength.

            Father Leblanc took papers and an inkhorn from his pocket. With a steady hand, he wrote down the date, the ages of the bride and groom, and Evangeline's marriage portion in sheep and cattle. Everything was done in proper order. When the agreement was complete, he pressed the great seal of the law onto the margin, where it shone like a sun.

            Benedict tossed three times the notary's usual fee onto the table in solid silver coins. Father Leblanc rose and blessed the bride and bridegroom. He lifted the tankard, drank to their happiness, wiped the foam from his lip, bowed solemnly, and left.
        - id: ch01-b13
          speaker: narrator
          text: |-
            The others sat quietly by the fire until Evangeline brought the draught-board from its corner. Soon the old men were deep in a friendly game. They laughed at every lucky move and every failed plan, whenever a piece was crowned or a gap opened in the king row.

            Away from them, in the dim recess of a window, Evangeline and Gabriel sat whispering together. They watched the moon rise above the pale sea and the silver mist over the meadows. One after another, lovely stars bloomed silently across the endless fields of heaven, like the angels' forget-me-nots.
        - id: ch01-b14
          speaker: narrator
          text: |-
            So the evening slipped away. At last, the church bell rang nine, the village curfew. The guests rose and departed, and silence settled over the house. Their many farewells and sweet good nights lingered in Evangeline's heart and filled her with gladness.

            The glowing embers on the hearth were carefully covered. Benedict's footsteps sounded on the oak stairs. Soon Evangeline followed without a sound. A pool of light moved upward through the darkness, lit less by her lamp than by her shining face.

            She crossed the hall in silence and entered her room. It was a simple chamber, with white curtains and a tall, broad clothespress. On its shelves lay linen and woolen cloth, carefully folded and all woven by Evangeline's own hands. This was the precious marriage portion she would bring her husband. It was worth more than sheep or cattle because it showed her skill in caring for a home.
        - id: ch01-b15
          speaker: narrator
          text: |-
            Evangeline soon put out her lamp. Soft, glowing moonlight streamed through the windows and filled the room. Under its power, her heart rose and trembled like the tides of the ocean.

            How beautiful she was as she stood there, her bare white feet upon the gleaming floor. She never guessed that Gabriel waited below among the orchard trees, watching for the light of her lamp and the passing shadow of her figure.

            Yet her thoughts were with him. Now and then sadness crossed her heart, as a cloud's moving shadow slipped over the moonlit floor and darkened the room for a moment.
        - id: ch01-b16
          speaker: narrator
          text: At the window, Evangeline watched the moon pass serenely out from the folds of a cloud. One star followed in her path, like young Ishmael leaving Abraham's tent beside Hagar.
