audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静庄重，带着古老传说的悠远与克制的哀愁
        timbre: 温暖清澈，低沉而有回响
        pace: 舒缓从容，在景物转换处自然停顿
        pitch: 中低
    basil:
      display_name: 巴西尔
      tts:
        delivery: 坦率郑重，忧虑时仍保有铁匠的坚实与克制
        timbre: 低沉有力，带着劳作者的厚重
        pace: 平稳偏慢，陈述警讯时清楚凝重
        pitch: 低
    leblanc:
      display_name: 勒内·勒布朗
      tts:
        delivery: 谦和睿智，讲述古老故事时庄重而不失慈爱
        timbre: 苍老柔和，清晰而略带沙哑
        pace: 从容舒缓，在寓意深处自然停顿
        pitch: 中低
  chapters:
    - id: ch01
      title: 勒布朗老爹的故事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            勒内·勒布朗公证人老了，腰背弯得像一支在海浪里吃力划动的桨。岁月压弯了他，却没有把他折断。他的金发一绺绺垂到肩头，柔软得像玉米花丝。高高的额头下面，一副牛角架眼镜跨在鼻梁上，看起来满是智慧。
        - id: ch01-b02
          speaker: narrator
          text: |-
            他有二十个儿女，孙辈更有一百多人。孩子们喜欢骑在他的膝头，听他的大怀表滴答作响。战乱时，他因为亲近英国人，被关在一座古老的法国堡垒里，整整四年吃尽苦头。从那以后，他行事谨慎了些，可还是不会骗人，也不猜疑别人。他有老人的智慧，却依然耐心、质朴，保留着孩子般的心。
        - id: ch01-b03
          speaker: narrator
          text: |-
            人人都爱戴他，孩子们更是围着他不肯走。他会讲森林里的狼人，也会讲半夜来给马饮水的妖怪。他还讲过白色的莱蒂什，那是一个没来得及受洗便夭折的孩子，死后只能隐身游荡在孩子们的房间里。
        - id: ch01-b04
          speaker: narrator
          text: |-
            勒布朗老爹知道的传说可多了。他说，到了圣诞前夜，牛儿会在马厩里开口交谈。把蜘蛛封进坚果壳，可以治好热病。四叶苜蓿和马蹄铁，也都有神奇的力量。村里的古老传说，没有什么是他讲不出来的。
        - id: ch01-b05
          speaker: narrator
          text: |-
            巴西尔这时从炉边站了起来。他磕掉烟斗里的灰，慢慢伸出右手，向老人问起停在河口的船。
        - id: ch01-b06
          speaker: basil
          text: |-
            勒布朗老爹，村里那些议论，你一定都听见了吧？也许你知道些消息。那些船究竟为什么来，又想做什么？
        - id: ch01-b07
          speaker: narrator
          text: |-
            勒布朗神情谦和，轻声回答。
        - id: ch01-b08
          speaker: leblanc
          text: |-
            闲话我听了不少，可听来听去，还是没有弄明白。他们为什么来，我知道的并不比大家多。不过，我不觉得那些人怀着恶意。如今又没有打仗，他们何必来为难我们呢？
        - id: ch01-b09
          speaker: narrator
          text: |-
            急性子的巴西尔顿时恼了，高声喊起来。
        - id: ch01-b10
          speaker: basil
          text: |-
            上帝啊！难道每一件事都非得问清怎么做、为什么做、有什么道理吗？世上天天都有不公的事。强者仗着自己有力量，就把那力量当成公理！
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: |-
            勒布朗没有跟着他动怒，只管说了下去。
        - id: ch01-b12
          speaker: leblanc
          text: |-
            人会做出不公的事，上帝却是公正的。到了最后，公正总会获胜。当年我被关在皇家港那座老堡垒里，有一个故事常常安慰我。直到现在，我还记得清清楚楚。
        - id: ch01-b13
          speaker: narrator
          text: |-
            这正是老人最爱讲的故事。邻人只要抱怨自己受了不公，他就要把这个故事讲上一遍。
        - id: ch01-b14
          speaker: leblanc
          text: |-
            从前有一座古城，名字我早已忘了。城里的广场上立着一根高柱，柱顶站着青铜铸成的正义女神。她左手托着天平，右手握着宝剑。这是在告诉人们，正义守护着国家的法律，也守护着每个人的心和家园。

            鸟儿甚至敢在天平的秤盘里筑巢。它们一点儿也不怕头顶那柄宝剑，哪怕剑锋正在阳光下闪亮。可是后来，国家的法律渐渐败坏了。强权顶替了公理，弱者遭受欺压，权贵靠铁腕统治一切。

            有一天，一位贵族家里丢了一串珍珠项链。没过多久，大家就怀疑上一个孤女。她在那座府邸里做女仆。人们装模作样地审了她一场，便判她死刑。就在正义女神像脚下，这个无辜的姑娘安静地等来了死亡。

            她的灵魂刚刚升向天父，一场暴风雨突然压住了整座城。雷霆劈中青铜像，把女神左手的天平猛地打落。秤盘哐啷一声砸在石地上。人们往里面一看，竟发现那里藏着一只喜鹊的巢。丢失的珍珠项链，就编在泥做的巢壁里。
        - id: ch01-b15
          speaker: narrator
          text: |-
            故事讲完了。巴西尔不再争辩，却也没有被说服。他站在那里，明明很想开口，又怎么也找不到话。纷乱的念头全凝在他的脸上，变成一道道纹路，仿佛冬日的水汽在窗玻璃上冻出的奇异冰花。
    - id: ch02
      title: 婚约与星光
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            伊凡吉林点亮桌上的黄铜灯，把自家酿的棕色麦酒倒进白镴大杯，一直倒到酒从杯沿漫出来。这种麦酒酒劲很足，在大草原村十分有名。
        - id: ch02-b02
          speaker: narrator
          text: |-
            勒布朗从衣袋里拿出文书和墨水瓶。他的手很稳，先写下日期和新郎新娘的年龄，又记下新娘会带去多少羊、多少牛。一项项手续依着规矩办完，法律的大印盖在纸页边上，红得像一轮太阳。
        - id: ch02-b03
          speaker: narrator
          text: |-
            贝内迪克特从皮钱袋里掏出一枚枚足色银币，放到桌上。那是公证人应得酬金的三倍。勒布朗站起身，为新郎和新娘祝福。他把酒杯高高举起，祝两个人一生幸福，随后喝干了杯里的麦酒。他擦掉嘴边的泡沫，郑重鞠了一躬，便告辞离开。
        - id: ch02-b04
          speaker: narrator
          text: |-
            留下的人静静坐在炉火旁，各自想着心事。后来，伊凡吉林从墙角拿来了西洋跳棋棋盘。棋局很快摆开，两位老人也友好地较量起来。谁走出一步好棋，他们要笑。谁算错一步，他们也笑。棋子升了王，或者王线被攻破，照样惹得他们开怀。
        - id: ch02-b05
          speaker: narrator
          text: |-
            两个恋人避开众人，坐进窗洞的暮色里，轻声说着只有彼此听见的话。他们看着月亮从苍白的海面和银白的草地薄雾上升起。辽阔无边的天空牧场中，星辰一颗接一颗静静开放。那是天使的勿忘草。
    - id: ch03
      title: 月光下的伊凡吉林
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            夜晚就这样过去了。过了一阵，钟楼敲响九点，全村到了宵禁的时候。客人们立刻起身告辞，屋子也安静下来。
        - id: ch03-b02
          speaker: narrator
          text: |-
            在门阶上，恋人说了许多舍不得分开的话，又道了一声甜蜜的晚安。这些话久久留在伊凡吉林心里，让她满怀喜悦。壁炉石上发红的余烬被人仔细盖好。接着，贝内迪克特的脚步踏响了橡木楼梯。不久，伊凡吉林也轻轻跟了上去，没有发出一点声音。
        - id: ch03-b03
          speaker: narrator
          text: |-
            黑暗里，一片光亮沿着楼梯缓缓移动。真正照亮那片黑暗的，仿佛不是姑娘手里的灯，而是她容光焕发的脸。她默默穿过过道，走进自己的房间。
        - id: ch03-b04
          speaker: narrator
          text: |-
            房间很朴素，挂着白色帷幔，还放着一座又高又宽的衣柜。柜子的一层层木板上，整齐叠着亚麻布和毛织物，都是伊凡吉林亲手织成的。那些织物才是她出嫁时最珍贵的嫁妆，比牛羊更宝贵，因为它们证明了她操持家务的本领。
        - id: ch03-b05
          speaker: narrator
          text: |-
            伊凡吉林很快熄了灯。柔和明亮的月光从窗外流进来，照亮整个房间。姑娘的心也被月光牵引，渐渐涨满，就像海面上微微颤动的潮水。
        - id: ch03-b06
          speaker: narrator
          text: |-
            啊，她真美，美得叫人屏住呼吸。她赤着一双雪白的脚，站在闪亮的地板上。她哪里知道，楼下果园的树影之间，爱人还没有离开。他在那里等着，望着她的灯光，也望着她映在窗上的身影。
        - id: ch03-b07
          speaker: narrator
          text: |-
            可她想的也是他。只是偶尔，一丝忧伤会从她心上掠过。那忧伤就像月光里的云影，从地板上悄悄滑过，让房间暗下短短一瞬。
        - id: ch03-b08
          speaker: narrator
          text: |-
            伊凡吉林站在窗前，看见月亮安然走出云层的褶皱，一颗星紧紧跟着它。那景象就像年轻的以实玛利随着夏甲，一同走出亚伯拉罕的帐篷。
