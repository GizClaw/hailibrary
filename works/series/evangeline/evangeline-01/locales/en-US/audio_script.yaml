  chapters:
    - id: ch01
      title: Part the First, I
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            This is the forest primeval. Pines and hemlocks murmur in the twilight, draped in green and bearded with moss. They stand like ancient Druids, their voices sad and full of warning. They stand like old gray harpers whose beards have fallen across their chests. From rocky caves nearby, the deep voice of the ocean rises. It answers the forest's sorrow with a sorrow of its own.

            Yet where are the hearts that once leaped beneath these trees, quick as a deer hearing the hunter in the woods? Where is the thatched village where the Acadian farmers made their homes? Their lives once flowed as calmly as rivers through the woodland, shadowed by the earth but still reflecting heaven. Now the pleasant farms lie empty, and the farmers are gone forever. October winds caught them like dust and leaves, whirled them high, and scattered them far across the ocean. Only the story of beautiful Grand-Pré remains.

            If you believe in a love that can hope, endure, and wait, listen now. If you believe in the strength and beauty of a woman's devotion, hear the mournful story that the forest pines still sing. This is a tale of love in Acadie, once the home of a happy people.
        - id: ch01-b02
          speaker: narrator
          text: |-
            Grand-Pré lay in Acadian country beside the Basin of Minas, far away, secluded, and still. Wide meadows reached eastward from the little village. They gave Grand-Pré its name and fed more flocks than anyone could count. The farmers had worked without rest to build dikes against the rough tides. At appointed times they opened the floodgates, and the sea wandered freely across the grass.

            To the west and south, fields of flax, orchards, and corn spread over the open plain without fences. Northward stood Blomidon and the old forests. High on the mountains, fog from the great Atlantic seemed to pitch its tents. The mist watched over the happy valley but never came down. Among all those farms, the Acadian village rested.

            Its strong houses had frames of oak and chestnut, built in the old Norman way. The roofs were thatched, with windows set into them, and the upper gables reached out to shade the doors below.

            On peaceful summer evenings, the sunset lit the village street and gilded the weather vanes above the chimneys. Women and girls sat outside in snow-white caps and skirts of scarlet, blue, and green. Their spinning wheels turned flax into golden thread. Indoors, busy looms sent their shuttles clattering back and forth. That sound joined the hum of the wheels and the songs of the girls.

            The parish priest came solemnly along the street. Children stopped their games to kiss the hand he held out in blessing. The people honored him as he walked among them. Women rose to greet his slow approach with loving words of welcome.

            Then the laborers returned from the fields. The sun sank serenely, and twilight settled over Grand-Pré. Soon the Angelus sounded softly from the church tower. Above the roofs, pale blue smoke rose from a hundred hearths like clouds of incense. Each one marked a home filled with peace and contentment.

            These simple Acadian farmers lived together in love, devoted to God and to one another. They knew neither the fear that comes under a tyrant nor the envy that can trouble a republic. Their doors had no locks, and their windows had no bars. Their homes stood open to the day because their hearts were open too. Even the richest among them lived simply, while the poorest had all they needed.
        - id: ch01-b03
          speaker: narrator
          text: |-
            A little apart from the village, closer to the Basin of Minas, lived Benedict Bellefontaine. He was the wealthiest farmer in Grand-Pré. His daughter, gentle Evangeline, kept his household and was the pride of the village.

            Benedict had lived through seventy winters, yet he was still strong, upright, and healthy. He was like an oak covered in snow. His hair was as white as snow, and his cheeks were as brown as oak leaves.

            Evangeline was seventeen, and beautiful to see. Her eyes were as black as the berries on a roadside thorn, but they shone softly beneath her brown hair. Her breath was sweet as the breath of cattle feeding in the meadows. At harvest time, she carried jugs of home-brewed ale to the workers in the noon heat, and they saw how fair she was.

            She seemed fairer still on Sunday mornings. As the church bell scattered holy sounds through the air, she walked down the long street carrying her prayer beads and her missal. She wore her Norman cap, a blue skirt, and earrings brought long ago from France. The earrings had passed from mother to child through many generations.

            But her face held an even greater brightness when she came home quietly after confession, carrying God's blessing with her. Once she had gone by, it felt as though exquisite music had just ended.
        - id: ch01-b04
          speaker: narrator
          text: |-
            Benedict's house stood firmly on a hillside, built with great oak rafters and looking out over the sea. A shady sycamore grew beside the door, wrapped in climbing woodbine. The porch was simply carved, with seats beneath its shelter. From there, a path crossed a broad orchard and vanished into the meadow.

            Beehives stood beneath the sycamore, protected by a little roof. They looked like the roadside shelters that travelers might find in distant lands, built over a poor box or a blessed image of Mary. Farther down the hill was the well. Its old bucket, green with moss, hung from an iron fastening, and a trough for the horses stood close by.

            On the north side, barns and the farmyard guarded the house from storms. Broad-wheeled wagons stood there beside old plows and harrows. There were pens for the sheep. A proud turkey strutted among his flock of hens, while the rooster crowed with the same voice that had once startled the repentant Peter.

            The barns were so full of hay that they seemed like a village of their own. A wide thatched roof projected over each gable, and stairs climbed under the eaves to the sweet-smelling corn loft. Nearby stood the dovecote. Its gentle birds murmured endlessly of love. Above them, countless weathercocks rattled and sang whenever the wind changed.

            So Benedict lived on his sunny farm, at peace with God and the world, while Evangeline guided his household.
        - id: ch01-b05
          speaker: narrator
          text: |-
            Many young men noticed Evangeline. In church, a youth might open his missal and then gaze at her as though she were the saint he honored most. He counted himself lucky if he could touch her hand or even the edge of her dress.

            Many suitors came to her door under cover of darkness. After one knocked, he would wait for her footsteps and wonder which was pounding harder, his heart or the iron knocker. At the joyful feast of the village's patron saint, a young man might find more courage. During the dance, he would press her hand and whisper hurried words of love that seemed to blend into the music.

            Of all who came, only young Gabriel was welcome. He was Gabriel Lajeunesse, son of Basil the blacksmith. Basil was a powerful man, respected throughout the village. People everywhere had honored the blacksmith's craft since the earliest times.

            Basil and Benedict were friends. Their children had grown up side by side, as close as brother and sister. Father Felician, both priest and teacher in Grand-Pré, taught them their letters from the same book. Together they learned the church hymns and the plain-song.
        - id: ch01-b06
          speaker: narrator
          text: |-
            As soon as the hymn and the day's lesson were over, Evangeline and Gabriel hurried to Basil's forge. They stood in the doorway and watched in wonder. Basil could lift a horse's hoof into his leather apron as easily as if it were a toy, then nail the shoe into place. Beside him, the iron rim of a cartwheel lay among the cinders like a fiery snake curled into a ring.

            On many autumn evenings, darkness gathered outside while light blazed through every crack in the smithy. The children stayed warm beside the forge and watched the heavy bellows breathe. When the panting stopped, sparks faded into the ashes.
        - id: ch01-b07
          speakers: [evangeline, gabriel]
          ensemble: duo
          text: The sparks look like nuns going into chapel!
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: |-
            And the two children laughed merrily.

            In winter, they rode sledges down the hillside and swept across the meadow as swiftly as an eagle diving through the air. In the barns, they climbed toward the crowded nests among the rafters. They searched eagerly for the marvelous stone that, people said, a swallow carried from the seashore to restore the sight of its young. How lucky the child who found such a stone in a swallow's nest!

            A few quick years passed, and they were children no longer. Gabriel had become a brave young man. His face was bright as morning, bringing gladness wherever he went, and he was ready now to act in the world. Evangeline had become a woman, with a woman's heart and hopes.

            The villagers called her the Sunshine of Saint Eulalie. They believed that sunshine would fill their orchards with apples. In the same way, they believed Evangeline would bring joy and plenty to her husband's home, filling it with love and the rosy faces of children.
