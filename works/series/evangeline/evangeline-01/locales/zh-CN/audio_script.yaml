audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静庄重，带着古老传说的悠远与克制的哀愁
        timbre: 温暖清澈，低沉而有回响
        pace: 舒缓从容，在景物转换处自然停顿
        pitch: 中低
  chapters:
    - id: ch01
      title: 亘古的森林与格朗普雷
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            这里，就是那片亘古的森林。松树和铁杉在暮色里低声絮语。它们披着苍翠的衣袍，垂下苔藓长须，像远古的德鲁伊祭司，发出悲凉而又预示未来的声音。它们又像白发的竖琴师，长须一直落在胸前。近旁的大海从岩洞深处传来低沉的轰响。它用凄切的声调，回应着森林的哀吟。
        - id: ch01-b02
          speaker: narrator
          text: |-
            森林依旧在这里。可曾经在林下跃动的那些心灵，又去了哪里？它们听见猎人的呼声，便会像狍子一样怦然跳跃。那座茅顶村庄又在哪里？那里本是阿卡迪亚农人的家。他们的一生静静流淌，就像滋养林地的河流。河面虽落着尘世的阴影，也映得出天堂。如今，那些可爱的农庄已经荒芜，农人也永远离去了。十月的狂风卷起尘土和落叶，把它们抛向高空，又远远撒到大海彼岸。农人们也这样四散飘零。美丽的格朗普雷村，只留下了一则传说。
        - id: ch01-b03
          speaker: narrator
          text: |-
            如果你相信，有一种爱情能一直怀着希望，忍耐着，永不改变。如果你相信，女子的深情自有它的美与力量，那就来听这个故事吧。森林的松涛至今还在吟唱这段悲凉的往事。这是一个发生在阿卡迪亚的爱情故事，而那里，原本是幸福人们的家园。
        - id: ch01-b04
          speaker: narrator
          text: |-
            在阿卡迪亚大地上，米纳斯湾岸边，格朗普雷小村安卧在丰饶的山谷里。它遥远、幽静，与世隔绝。辽阔的草甸向东铺开，村庄因它得名，数不清的羊群也在那里吃草。农人们常年辛劳，筑起堤坝挡住汹涌的潮水。只有到了规定的时节，他们才打开水闸，让海水在草甸上自在漫游。西面和南面铺展着亚麻田、果园和玉米地，没有一道篱笆。北方远处，布洛米登山和古老的森林高高耸立。海雾在山顶扎下营帐。大西洋升起的烟岚从高处望着幸福的山谷，却从来不曾降下。

            阿卡迪亚人的村庄，就安睡在这片田园中央。房屋用橡木和栗木搭成坚实的骨架，还是亨利诸王时代诺曼底农人的式样。茅草屋顶开着老虎窗，突出的山墙为门口挡雨遮阳。宁静的夏日晚间，落日照亮村中街道，也把烟囱上的风向标染成金色。妇人和姑娘戴着雪白的帽子，穿着猩红、蔚蓝或碧绿的裙衣。她们坐着纺出金色的亚麻线。屋里，织机的梭子吵吵嚷嚷，和纺车的嗡鸣、姑娘的歌声响在一起。

            本堂神父庄严地沿街走来。孩子们停下游戏，亲吻他伸来祝福的手。妇人和姑娘也纷纷起身，亲切地迎接他缓步走近。接着，劳作的人从田野归来，太阳安详地沉下去，暮色笼罩了大地。不久，钟楼轻轻响起三钟经。百来处炉火升起淡蓝的炊烟，一缕一缕越过屋顶，就像升腾的香云。每一处炉火旁，都是安宁知足的家。

            这些朴实的农人就这样相亲相爱。他们爱上帝，也爱世人。暴君治下的恐惧，共和国里的嫉妒，在这里都不见踪影。他们的门不用锁，窗也没有铁闩。屋舍像白昼一样敞亮，屋主的心也是这样。最富的人不曾奢华，最穷的人也衣食丰足。
    - id: ch02
      title: 伊凡吉林
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            离开村庄，往米纳斯湾再近一些，就是格朗普雷最富有的农人贝内迪克特·贝尔方丹的土地。温柔的伊凡吉林和父亲住在那里，替他料理家务，也是全村的骄傲。贝内迪克特已经度过七十个寒冬，身形依旧魁梧挺拔。他精神矍铄，像一棵落满雪花的橡树。头发白得像雪，双颊却像橡树叶一样棕褐。

            伊凡吉林十七岁，生得秀美。她的眼睛像路旁荆棘结出的浆果那么黑。可那双眼睛从褐色发丝下望出来时，光芒却十分柔和。她的气息像草甸上吃草的母牛呼出的气息一样清甜。收获时节的正午，暑气逼人，她把一罐罐自酿麦酒送给割麦的人。那时的姑娘实在美丽。

            到了星期日清晨，她显得更美。钟楼把神圣的钟声洒向四方，就像神父用圣水枝向会众遍施祝福。她带着念珠和弥撒经书走过长街，头戴诺曼底帽，身穿蓝色裙衣。耳畔的耳环，是多年前从法国带来的传家宝，世世代代，由母亲传给女儿。可是，等她告解之后安然回家，身上带着上帝的赐福，脸庞和身姿便仿佛笼罩在天堂的光里，显出超越尘世的美。她走过去以后，就像一曲绝妙的音乐刚刚停下。
    - id: ch03
      title: 阳光照耀的农庄
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            贝内迪克特的屋子立在山坡上，可以俯瞰大海。橡木椽梁把它撑得牢牢的。门边有一棵浓荫蔽日的悬铃木，忍冬藤绕着树身攀援。雕饰粗朴的门廊下设着座椅。一条小径穿过宽阔的果园，一直消失在草甸深处。树下的蜂箱顶着斜棚。那模样，就像旅人在遥远地方的路旁看到的小棚，护着给穷人的施舍箱，或圣母玛利亚的神像。山坡下方有一口井，吊着生满青苔、箍着铁圈的水桶，旁边是马匹饮水的槽。

            北面的谷仓和农家庭院为屋子挡住风暴。宽轮大车停在那里，古老的犁和耙也放在那里。那里还有羊栏。威风的火鸡领主在自己的羽族后宫里踱步，公鸡昂首啼叫。它的声音，和千百年前惊醒悔罪彼得的那一声一模一样。谷仓里的干草满得快要迸出来，一座座谷仓本身就像一个村落。每座茅草屋顶都伸出山墙很远。屋檐遮护着楼梯，通向满是谷物香气的阁楼。鸽舍也在那里。温顺无邪的鸽子不停地咕咕低语，仿佛总在诉说爱情。它们上方，无数风向标随着变幻的风咔嗒作响，唱着世事无常。
        - id: ch03-b02
          speaker: narrator
          text: |-
            格朗普雷的农人就这样与上帝、与世间和平相处。他住在阳光照耀的农庄里，家务都由伊凡吉林操持。多少年轻人跪在教堂里，虽然翻开了弥撒经书，眼睛却望着她，把她当成自己最虔诚供奉的圣女。谁能碰到她的手，哪怕只碰到衣裙的边角，也会觉得无比幸福。

            夜色给求婚的人壮了胆。多少人来到她门前，敲响门环，等着听她的脚步，却分不清到底是自己的心跳得更响，还是铁门环敲得更响。到了村里守护圣徒的欢乐节庆，他们又大胆了些。有人在舞蹈中握紧她的手，匆匆说出爱语。那阵低语听起来，仿佛也是乐声的一部分。可这些人当中，只有年轻的加布里埃尔受到欢迎。

            加布里埃尔·拉热内斯是铁匠巴西尔的儿子。巴西尔身强力壮，村里人人都敬重他。因为从古到今，无论哪个时代，哪个国度，人们总看重铁匠的手艺。巴西尔和贝内迪克特是好友。两家的孩子从小一起长大，亲如兄妹。村里的费利西安神父既是神父，也是教师。他用同一本书教两个孩子识字，还教他们唱圣歌和素歌。

            每天唱完圣歌，做完功课，两人便飞快跑到巴西尔的铁匠铺。他们站在门口，睁大眼睛，看巴西尔把马蹄搁在皮围裙上，像摆弄玩具一样给它钉牢蹄铁。他身旁，车轮的铁箍盘在炭屑里，像一条火红的蛇。秋日傍晚，外面渐渐暗下去，铁匠铺里的亮光却像要从每道缝隙中迸出来。两个孩子守在温暖的炉边，看着风箱一起一伏，卖力喘气。等风箱不再喘息，火星熄灭在灰烬里，他们便快活地笑，说那些火星是走进礼拜堂的修女。

            冬天，他们常坐着雪橇冲下山坡，越过草甸，快得像鹰隼俯冲。他们也常爬上谷仓的椽梁，探看挤满雏鸟的燕巢。他们急着寻找一块神奇的石头。传说燕子会从海岸衔来这种石头，让失明的雏鸟重见光明。谁能在燕巢里找到它，谁就会有好运。

            几个年头飞快过去，他们不再是孩子。加布里埃尔成了勇敢的青年。他的面庞仿佛清晨，用光芒使大地欢欣。青春也已经成熟，化成了果敢的行动。伊凡吉林也长成了女子，有了女子的心事和憧憬。人们称她为“圣厄拉莉的阳光”。农人们相信，那样的阳光会使果园挂满苹果。她也会把欢乐与丰饶带进未来丈夫的家，让那里充满爱情，也满是孩子们红润的脸庞。
