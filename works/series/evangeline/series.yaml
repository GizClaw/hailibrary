cover_prompt: |-
  A wordless cover scene on the eighteenth-century Acadian shore shows Evangeline at the moment of parting and enduring hope. She is a young Acadian woman with dark braided hair, a white linen cap, muted blue bodice, cream blouse, and long russet skirt, standing beside Gabriel, a young man in a brown waistcoat and homespun trousers. Behind them lie Grand-Pre's wooden houses, orchards, marshland dikes, and distant sailing vessels beneath an expansive evening sky. Their hands reach toward one another as villagers are drawn in opposite directions, making the interrupted farewell the focal action without showing violence. Use a broad shore-level composition with sweeping horizontal movement and generous quiet sky above. Keep the mood solemn but child-safe and all clothing, vessels, and settlement details grounded in 1750s Acadia. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
