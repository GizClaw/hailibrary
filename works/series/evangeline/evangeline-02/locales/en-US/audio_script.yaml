  chapters:
    - id: ch01
      title: Part the First, II
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            The season had come again when nights grow longer and colder, and the setting sun enters the sign of the Scorpion. Birds of passage sailed through the gray air. They left the frozen, lonely bays of the north and flew toward tropical islands.

            The harvests were safely gathered. September winds wrestled with the forest trees as Jacob once wrestled with the angel. Every sign promised a long, bitter winter. The bees seemed to know that hunger was coming, for they had stored so much honey that it overflowed their hives. The Indian hunters said the cold would be severe because the foxes had grown such thick fur.

            So autumn arrived. Then came the lovely season the devout Acadian farmers called the Summer of All-Saints. A dreamy, magical light filled the air. The land looked newly made, fresh as childhood. Peace seemed to cover the earth, and even the restless heart of the ocean was quiet for a little while.

            Every sound blended with the others. Children played, roosters crowed in the farmyards, wings stirred in the sleepy air, and pigeons cooed. All of it was soft and low, like murmurs of love. The great sun looked through the golden mist with an eye of love. Each forest tree wore russet, scarlet, and yellow. Dew shone on the leaves, and every tree flashed like the plane tree a Persian king once covered with rich robes and jewels.
        - id: ch01-b02
          speaker: narrator
          text: |-
            Once more, rest, affection, and stillness ruled the evening. The day's heat and labor were over. As twilight came down, the evening star returned to the sky, and the herds came home.

            The cattle pawed the ground as they walked. They rested their necks against one another and breathed in the cool air through wide nostrils. At their head came Evangeline's beautiful heifer, carrying the bell. She moved slowly and quietly, proud of her snow-white hide and the ribbon floating from her collar, as though she knew how dearly people loved her.

            Then the shepherd returned from the seaside pasture with his bleating sheep. The watch-dog followed behind. He was patient, important, and very proud of his work. He paced from side to side, waving his bushy tail with a grand air and driving the stragglers onward. When the shepherd slept and wolves howled from the forest through the starry night, this dog ruled and guarded the flock.

            The moon was rising when the wagons finally came back from the marshes. They were piled with salty hay, and its smell filled the air. The horses neighed cheerfully, with dew on their manes and around their feet. Heavy wooden saddles rested high on their backs. Painted in bright colors and trimmed with crimson tassels, the saddles nodded like hollyhocks heavy with flowers.

            Meanwhile, the cows stood patiently as the milkmaids worked. Foaming streams of milk struck the pails in a loud, even rhythm. Cattle lowed, and laughter rang through the farmyard and echoed from the barns. Then those sounds died away. The heavy barn doors closed with a jolt. Wooden bars rattled into place, and for a time everything was still.
        - id: ch01-b03
          speaker: narrator
          text: |-
            Inside the house, Benedict sat at ease in his armchair beside the broad fireplace. He watched the flames and twisting smoke struggle together like enemies in a burning city. His great shadow leaped behind him, nodding and making strange gestures along the wall before it vanished into the dark. Rough faces carved into the oak back of his chair seemed to laugh in the flickering light. On the dresser, pewter plates caught the fire and flashed like soldiers' shields in the sun.

            The old farmer sang pieces of songs and Christmas carols. Long ago, his ancestors had sung the same music in the orchards of Normandy and the bright vineyards of Burgundy.

            Gentle Evangeline sat close beside her father, spinning flax for the loom in the corner. The loom's treadles and busy shuttle were quiet now. Only the steady hum of the spinning wheel continued beneath the old man's broken song and joined its pieces together. It was like a church when the choir falls silent and footsteps sound in the aisle, or the priest's words carry from the altar. Here, whenever Benedict's song paused, the clock kept clicking in measured time.
        - id: ch01-b04
          speaker: narrator
          text: |-
            As they sat there, footsteps approached. The wooden latch lifted with a sudden sound, and the door swung open. From the hobnails striking the floor, Benedict knew Basil the blacksmith had come. From the beating of her own heart, Evangeline knew who had come with him.
        - id: ch01-b05
          speaker: benedict
          text: |-
            Welcome, Basil, my friend! Come sit here by the fire. The settle always seems empty when you're not in it. Your pipe and tobacco are waiting on the shelf. You're never more yourself than when your cheerful red face shines through the smoke from your pipe or your forge, just like the harvest moon shining through the mist above the marshes.
        - id: ch01-b06
          speaker: narrator
          text: |-
            Smiling with contentment, Basil settled into his usual place by the fire.
        - id: ch01-b07
          speaker: basil
          text: |-
            Benedict Bellefontaine, you always have a joke or a song ready! You're at your merriest when everyone else expects trouble and sees ruin ahead. You're as lucky as a man who finds a horseshoe every day.
        - id: ch01-b08
          speaker: narrator
          text: |-
            Basil paused while Evangeline brought him his pipe. He lit it with a coal from the fire. Then he went on slowly.
        - id: ch01-b09
          speaker: basil
          text: |-
            The English ships have been anchored at the mouth of the Gaspereau for four days now, with their cannons aimed at us. No one knows what they mean to do. But tomorrow, we're all ordered to meet in the church. There, the King's command will be announced as the law of this land. Until then, all these fears of coming trouble are weighing on the people's hearts.
        - id: ch01-b10
          speaker: benedict
          text: |-
            Perhaps the ships have come for some kinder reason. Perhaps rain fell too soon in England, or the heat came at the wrong time and ruined their harvests. Perhaps they hope to take food from our overflowing barns and feed their cattle and their children.
        - id: ch01-b11
          speaker: narrator
          text: |-
            Basil shook his head. He answered warmly, then sighed before he continued.
        - id: ch01-b12
          speaker: basil
          text: |-
            That isn't what the villagers believe. No one has forgotten Louisburg, Beau Séjour, or Port Royal. Many people have already fled into the forest. They're hiding near its edge and waiting anxiously to learn what tomorrow will bring. Our guns and every kind of weapon have been taken from us. We have nothing left but a blacksmith's hammer and a mower's scythe.
        - id: ch01-b13
          speaker: narrator
          text: |-
            The cheerful farmer answered with an easy smile.
        - id: ch01-b14
          speaker: benedict
          text: |-
            We're safer without weapons, here among our flocks and cornfields. We're safer behind these peaceful dikes, with the ocean pressing around them, than our fathers were inside forts under enemy cannon fire.

            Don't fear trouble, my friend. Tonight, no shadow of sorrow should fall across this house or this hearth, because tonight is the night of the marriage contract. The house and barn are finished. The village lads built them well and strong. They broke the ground around them, filled the barn with hay, and stored enough food in the house for a whole year.

            René Leblanc will soon arrive with his papers and inkhorn. Shouldn't we be glad tonight and share in our children's joy?
        - id: ch01-b15
          speaker: narrator
          text: |-
            Evangeline stood apart by the window, her hand held in her lover's hand. She blushed as she listened to her father. His last words had scarcely faded when the worthy notary entered.
