audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静庄重，带着古老传说的悠远与克制的哀愁
        timbre: 温暖清澈，低沉而有回响
        pace: 舒缓从容，在景物转换处自然停顿
        pitch: 中低
    benedict:
      display_name: 贝内迪克特
      tts:
        delivery: 豁达亲切，谈笑间透着淳朴的乐观与长者的笃定
        timbre: 浑厚温暖，略带年迈的粗粝
        pace: 从容稳健，玩笑处轻快自然
        pitch: 中低
    basil:
      display_name: 巴西尔
      tts:
        delivery: 坦率郑重，忧虑时仍保有铁匠的坚实与克制
        timbre: 低沉有力，带着劳作者的厚重
        pace: 平稳偏慢，陈述警讯时清楚凝重
        pitch: 低
  chapters:
    - id: ch01
      title: 诸圣夏日
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            夜晚又开始变长，天气也一天比一天冷。西沉的太阳退入天蝎座。候鸟穿过铅灰色的天空，离开冰封荒凉的北方海湾，飞向热带岛屿的岸边。田里的庄稼已经收进仓中。九月的狂风却在森林里横冲直撞，树木迎着风奋力扭动，仿佛古时的雅各正与天使角力。
        - id: ch01-b02
          speaker: narrator
          text: |-
            所有征兆都在说，这会是一个漫长而严酷的冬天。蜜蜂像是预先知道饥馑将至，把蜂蜜存得满出蜂箱。印第安猎人也断定冬日必然寒冷，因为狐狸的皮毛长得格外浓密。秋天就这样来了。
        - id: ch01-b03
          speaker: narrator
          text: |-
            可紧跟着秋天的，是一段美好的日子。虔诚的阿卡迪亚农人把它叫作“诸圣夏日”。梦一般神奇的光辉弥漫在空中，大地仿佛刚刚创生，处处带着童年般的清新。和平似乎降临了人间，就连大海那颗躁动的心，也得到了片刻安慰。
        - id: ch01-b04
          speaker: narrator
          text: |-
            四周的声音融在一起。孩子们游戏的欢声，院里的鸡鸣，倦懒空气中的振翅声，还有鸽子的咕咕低语，全都低回轻柔，像爱人的呢喃。硕大的太阳隔着金色雾霭，向大地投下慈爱的目光。森林披上赤褐、猩红和明黄的衣袍。露珠映着光，每一棵树都闪闪发亮，像那棵被波斯人用锦袍和珠宝装点起来的悬铃木。
    - id: ch02
      title: 黄昏归家
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            安宁、亲爱和寂静又回到了人间。白昼带着重负和炎热退去，暮色把晚星送回天空，也把牲畜带回家园。它们刨着地走来，彼此把脖颈搭在同伴身上，张大鼻孔，呼吸清新的晚风。
        - id: ch02-b02
          speaker: narrator
          text: |-
            伊凡吉林那头漂亮的小母牛走在最前面，颈下系着铃铛。它一身雪白，颈圈上的丝带迎风飘动。它走得安静又缓慢，仿佛知道人们有多疼爱它。牧羊人也从海边回来，赶着一群咩咩叫的羊。那片海边草地，正是羊儿最喜欢的牧场。
        - id: ch02-b03
          speaker: narrator
          text: |-
            看门狗跟在羊群后面。它耐心又神气，对自己的本领很是骄傲。它像领主一样来回巡视，甩着蓬松的大尾巴，把掉队的羊赶上去。牧人睡着以后，它就是羊群的统领。夜里，狼嚎穿过森林，在繁星下的寂静中响起，它又守护着每一只羊。
        - id: ch02-b04
          speaker: narrator
          text: |-
            直到月亮升起，装满干草的大车才从沼泽归来。草里带着咸味，气息飘满四周。马儿快活地嘶鸣，鬃毛和球节沾着露水。它们背上的木鞍又高又沉，涂着鲜亮颜色，还垂着深红流苏。木鞍一路摇晃，像开满花、沉甸甸的蜀葵。
        - id: ch02-b05
          speaker: narrator
          text: |-
            母牛耐心站着，让挤奶姑娘挤出一道道带泡沫的乳汁。奶水有节奏地落进桶里，响声清亮。院里传来牛的低鸣和人们的笑声，谷仓也送回一阵阵回音。不久，一切慢慢安静下来。谷仓的大门发出刺耳的摩擦声，沉沉合上。木门闩咔嗒一响，四下暂时再没有声音。
    - id: ch03
      title: 炉边的歌
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            屋里，宽阔的壁炉口暖意融融。贝内迪克特闲坐在扶手椅上，看着火焰和一缕缕烟互相争斗，就像一座燃烧的城里，两边的仇敌还在交战。他身后那道硕大的影子从墙上掠过，点头晃脑，做出怪模怪样的姿势，像是在嘲弄谁，转眼又没入黑暗。
        - id: ch03-b02
          speaker: narrator
          text: |-
            椅背上粗粗刻出的橡木人脸，被摇曳的火光照得咧嘴发笑。餐具柜上的白镴盘子接住火光，又把它映出来，仿佛千军万马的盾牌正映着太阳。老人唱起零零落落的歌曲，又唱起圣诞颂歌。很久以前，他的祖先在诺曼底的果园和明亮的勃艮第葡萄园里，也唱过这些曲调。
        - id: ch03-b03
          speaker: narrator
          text: |-
            温柔的伊凡吉林紧挨着父亲坐下，纺着织布要用的亚麻线。墙角的织机歇着，踏板没有声响，勤快的梭子也停了下来。只有纺车发出单调的嗡鸣，像风笛拖长的低音。它跟着老人的歌，把一段段零落的曲子连在一起。
        - id: ch03-b04
          speaker: narrator
          text: |-
            教堂里的唱诗班停下吟唱时，人们会听见过道上的脚步，或祭坛前神父说出的话。此刻也是这样。老人每唱到一处停顿，时钟就用均匀的节拍，发出一声又一声滴答。
    - id: ch04
      title: 婚约之夜
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            父女俩正坐在炉边，外面忽然传来脚步。木门闩被人抬起，门也沿着铰链向后敞开。贝内迪克特一听那双钉掌鞋，就知道来的是铁匠巴西尔。伊凡吉林听着自己怦怦的心跳，也知道陪巴西尔进门的人是谁。
        - id: ch04-b02
          speaker: benedict
          text: |-
            欢迎，巴西尔，我的老朋友！快坐到壁炉旁那张长椅上。你不来，那地方就总是空荡荡的。把架子上的烟斗和烟草盒拿下来吧。烟斗也好，锻炉也好，只要烟雾里露出你那张亲切快活的脸，圆圆的、红红的，像沼泽雾里的丰收月亮，那才是我熟悉的巴西尔。
        - id: ch04-b03
          speaker: narrator
          text: |-
            铁匠满意地笑了，从容坐到炉边那个惯常的位子上。
        - id: ch04-b04
          speaker: basil
          text: |-
            贝内迪克特·贝尔方丹，你呀，什么时候都少不了玩笑和歌谣！别人满心都是不祥的预感，只看见灾难就要临头，你倒永远这么快活。你真有福气，简直像每天都能捡到一只马蹄铁。
        - id: ch04-b05
          speaker: narrator
          text: |-
            伊凡吉林把烟斗拿来。巴西尔接过烟斗，从余烬里夹起一块炭点燃，停了片刻，才缓缓说下去。
        - id: ch04-b06
          speaker: basil
          text: |-
            英国人的船已经在加斯佩罗河口停了四天，船上的大炮正对着我们。谁也不知道他们想做什么。可是全村人都接到了命令，明天必须去教堂集合。国王陛下的谕令会在那里宣读，从此就成了这片土地上的法令。唉，现在人人都在猜会有什么祸事，心里怎么能安稳？
          emotion: fearful
        - id: ch04-b07
          speaker: benedict
          text: |-
            也许这些船来到岸边，怀着的是更友善的用意。说不定英国的收成遇上了不合时令的雨水，或是来得更不是时候的酷热，已经毁了。他们也许只是想从我们满得快要迸开的谷仓里取些粮食，好喂养牲畜和孩子。
        - id: ch04-b08
          speaker: narrator
          text: |-
            巴西尔激动起来。他摇摇头，显然不能同意。接着，他叹了一口气。
        - id: ch04-b09
          speaker: basil
          text: |-
            村里人可不这么想。路易斯堡的事没人忘记，博塞茹尔和皇家港的事也没人忘记。已经有许多人逃进森林，藏在林子边上，焦急地等着明天那吉凶难料的命运。我们的枪械，还有各种兵器，全被收走了。如今剩下的，只有铁匠的大锤和割草人的长镰。
        - id: ch04-b10
          speaker: narrator
          text: |-
            快活的贝内迪克特听完，仍旧和气地笑着。
        - id: ch04-b11
          speaker: benedict
          text: |-
            我们手无寸铁，住在羊群和玉米地中间，反而更安全。我们安居在宁静的堤坝以内，就算受大海围困，也比祖先守在堡垒里、挨着敌军炮火时安全。朋友，别怕会有祸事。今晚更别让忧愁的影子落到这所屋子和这炉火上。因为今晚，我们要签订婚约。
        - id: ch04-b12
          speaker: benedict
          text: |-
            房子和谷仓都盖好了。村里的小伙子们欢欢喜喜，把它们盖得又牢又好。他们还开垦了周围的土地，让谷仓堆满干草，屋里也存下足够一整年的食物。勒内·勒布朗很快就会带着文书和墨水瓶来。孩子们这样幸福，我们怎么会不高兴，怎么会不分享他们的喜悦呢？
          emotion: happy
        - id: ch04-b13
          speaker: narrator
          text: |-
            伊凡吉林站在窗边，一只手握在爱人手里。听见父亲说出这番话，她的脸颊泛起红晕。父亲的话音刚刚落下，德高望重的公证人便走进门来。
