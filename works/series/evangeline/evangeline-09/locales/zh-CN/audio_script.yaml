audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静庄重，带着古老传说的悠远与克制的哀愁
        timbre: 温暖清澈，低沉而有回响
        pace: 舒缓从容，在景物转换处自然停顿
        pitch: 中低
    evangeline:
      display_name: 伊凡吉林
      tts:
        delivery: 温柔真挚，悲痛时克制而颤抖
        timbre: 清澈柔和，年轻而明亮
        pace: 平稳舒缓，情绪激越时略快
        pitch: 中
    shawnee_woman:
      display_name: 肖尼妇人
      tts:
        delivery: 温柔低回，叙说古老传说时神秘而忧伤
        timbre: 柔和幽深，带着饱经苦难的沉静
        pace: 缓慢从容，句间留有悠长停顿
        pitch: 中低
    missionary_priest:
      display_name: 传教站神父
      tts:
        delivery: 慈祥庄重，安慰人时坚定而温和
        timbre: 深沉温厚，清晰而有回响
        pace: 徐缓有分量
        pitch: 中低
  chapters:
    - id: ch01
      title: 西部荒原
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            遥远的西方，有一片辽阔的荒漠。终年积雪的群山从那里拔地而起，峰顶高耸，在天光下闪耀。山间的深谷又陡又险，峡口像一扇敞开的门，只给移民的篷车留下一条崎岖难行的路。
        - id: ch01-b02
          speaker: narrator
          text: |-
            俄勒冈河、沃洛韦河和奥怀希河从这里流向西方。内布拉斯加河却折向东边，绕过温德里弗群山，从甜水谷急急奔下。南面还有数不清的激流。它们发源于方丹基布和西班牙山脉，冲过沙地与岩石，任荒漠的风一路扫荡，最后全都奔向大海。那从不止息的轰鸣，好像竖琴上粗大的琴弦，在天地间发出庄严的震响。
        - id: ch01-b03
          speaker: narrator
          text: |-
            河流之间铺着美丽得让人惊叹的草原。草浪在日光和阴影中不断起伏，繁盛的玫瑰与紫色的紫穗槐开满原野。野牛、麋鹿和狍子从这里走过，狼群和无人骑乘的野马也从这里走过。野火烧焦万物，长途吹来的风已经疲倦。四散漂泊的以实玛利子孙踏过荒地，又用鲜血染红了它。
        - id: ch01-b04
          speaker: narrator
          text: |-
            战争留下的可怕小径上，秃鹫展开雄伟的翅膀，高高盘旋。它像一位战死酋长不肯离去的灵魂，踩着看不见的阶梯，一步步升向天空。荒野里有时冒出劫掠者营地的烟，湍急的河边有时又出现一片树林。阴沉寡言的熊，就像荒漠中的隐修僧，从黑暗的深谷爬到溪边挖草根。所有这一切上方，清澈如水晶的天空倒扣下来，仿佛上帝用手掌护住了大地。
    - id: ch02
      title: 追逐远去的烟
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            加布里埃尔已经走进这片神奇的土地，到了奥扎克山脚下。猎人和捕兽人跟在他身后。伊凡吉林与巴齐尔带着印第安向导，沿着他的足迹一天一天追赶，总觉得当天就能追上。
        - id: ch02-b02
          speaker: narrator
          text: |-
            有些早晨，他们远远看见平原上升起一缕营火的烟。也许是真的，也许只是太盼望看见。等他们在夜里赶到那里，剩下的只有余烬和灰。人已经疲惫，心也不免悲伤，希望却仍在前方引路。那希望就像海市蜃楼里的明亮湖水，总在他们快要接近时向后退去，最终消失。
    - id: ch03
      title: 火边的古老传说
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            一天傍晚，众人围坐在火边。一名印第安妇人静静走进营地。她脸上留着深深的哀伤，也有同样深的忍耐。她来自肖尼族，正从遥远的科曼奇人猎场返回故乡。她的丈夫是个加拿大林中猎人，已经在那里被人杀害。
        - id: ch03-b02
          speaker: narrator
          text: |-
            大家听得心里难过，热诚地欢迎她，又说了许多安慰的话。他们请她坐下来，一同吃余火烤熟的野牛肉和鹿肉。走了一整天，又追逐过鹿与野牛，巴齐尔和伙伴们都累坏了。饭后，他们裹着毯子躺在地上，很快睡熟。跳动的火光还照着他们黝黑的脸。
        - id: ch03-b03
          speaker: narrator
          text: |-
            肖尼妇人没有睡。她坐在伊凡吉林的帐篷门口，用柔和低沉的声音，慢慢讲自己的爱情。那带着印第安口音的话语有一种奇异的韵味。她讲相爱时的欢乐，也讲后来的痛苦与变故。
        - id: ch03-b04
          speaker: narrator
          text: |-
            伊凡吉林听得不断落泪。原来世上还有一颗和自己一样不幸的心，也曾爱过，也失去了所爱的人。她深深怜悯面前的妇人，又因为终于有人懂得这种痛苦，感到了一点安慰。于是，她也说出了自己怎样相爱，又怎样遭逢一场接一场的灾难。
        - id: ch03-b05
          speaker: narrator
          text: |-
            肖尼妇人惊讶得沉默了很久。后来，仿佛有一阵神秘的恐惧掠过她的心，她才讲起莫维斯的故事。
        - id: ch03-b06
          speaker: shawnee_woman
          text: |-
            莫维斯是冰雪变成的新郎。他赢得一个姑娘的心，娶她做了妻子。可是清晨一来，他就起身离开棚屋，在阳光下一点点融化，最后什么也没留下。姑娘追进森林，追了很远，从此却再也没有见到他。
        - id: ch03-b07
          speaker: narrator
          text: |-
            她的声音越来越像一段低柔的咒语。接着，她又说起美丽的莉莉瑙。
        - id: ch03-b08
          speaker: shawnee_woman
          text: |-
            爱上莉莉瑙的是一个幽灵。黄昏安静下来，他就像晚风一样穿过她父亲棚屋上方的松林，把爱的话轻轻送到她耳边。后来，莉莉瑙跟着他那顶青翠摇动的羽冠走进森林，再也没有回来。族人也再没见过她。
        - id: ch03-b09
          speaker: narrator
          text: |-
            伊凡吉林默默听着，又惊奇，又觉得一切如此陌生。那些带着魔力的话缓缓流过，四周仿佛成了被法术笼罩的土地，眼前黝黑的客人也仿佛成了一位女巫。
        - id: ch03-b10
          speaker: narrator
          text: |-
            月亮慢慢升过奥扎克山顶，照进小帐篷。神秘的月光抚过阴暗的叶子，把整片树林都抱在怀里。溪水带着悦耳的声音奔流，头顶的树枝轻轻摇动，像在发出听不清的叹息。
        - id: ch03-b11
          speaker: narrator
          text: |-
            伊凡吉林满心想着爱情，一种说不清的痛与恐惧却偷偷钻了进来，像冰冷的毒蛇爬进燕巢。那不是尘世的害怕。夜风里仿佛带着幽灵世界的气息。就在那一刻，她觉得自己也和传说里的印第安姑娘一样，追赶着一个幻影。她怀着这个念头睡着了，恐惧与幻影也随之消散。
    - id: ch04
      title: 林中的传教站
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            第二天一早，众人又出发了。路上，肖尼妇人告诉他们，山地西坡有一座小村庄，传教站的黑袍首领就住在那里。
        - id: ch04-b02
          speaker: shawnee_woman
          text: |-
            他教给族人许多道理，还向他们讲马利亚和耶稣。听他说话，人们的心有时欢喜得笑出声，有时又痛得流下泪来。
        - id: ch04-b03
          speaker: narrator
          text: |-
            一阵隐秘的激动忽然涌上伊凡吉林心头。
        - id: ch04-b04
          speaker: evangeline
          text: |-
            那就去传教站吧。我觉得，好消息一定在那里等着我们！
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: |-
            他们立刻掉转马头。太阳落山时，前方一道山嘴后传来了低低的人声。河边宽阔的绿草地上，立着许多基督徒的帐篷。这里正是耶稣会的传教站。
        - id: ch04-b06
          speaker: narrator
          text: |-
            村子中央长着一棵高大的橡树。黑袍神父与他的孩子们跪在树下。高处的树干钉着一具十字苦像，葡萄藤在它上面遮出绿荫。基督受难的脸俯视着跪拜的人群。这棵树，就是他们在荒野里的礼拜堂。
        - id: ch04-b07
          speaker: narrator
          text: |-
            晚祷的歌声穿过枝叶搭成的穹顶，升向高处，又与树枝柔软的沙响和叹息融在一起。旅人们摘下帽子，静静走近，也跪在草地上参加祈祷。
        - id: ch04-b08
          speaker: narrator
          text: |-
            礼拜结束，神父举手降福。祝福的话像播种人撒下的种子，落在人们心里。随后，他缓缓走向陌生人，欢迎他们。听见对方用自己的母语回答，神父在森林深处听到了故乡的声音，慈祥地笑了。他温言把众人领进棚屋，请他们坐在席子和兽皮上歇脚，又拿出玉米饼与盛水的葫芦。
        - id: ch04-b09
          speaker: narrator
          text: |-
            众人很快说完来意。神父听后，神色郑重起来。
        - id: ch04-b10
          speaker: missionary_priest
          text: |-
            还不到六天以前，加布里埃尔就坐在我身旁这张席子上。现在，这位姑娘正坐在同一个地方。他向我讲的，也是这个悲伤的故事。说完以后，他便起来继续赶路了。
        - id: ch04-b11
          speaker: narrator
          text: |-
            神父声音柔和，话里只有善意。可这些话落在伊凡吉林心上，却像冬天的雪片落进一只空巢，那里的鸟早已飞走。
        - id: ch04-b12
          speaker: missionary_priest
          text: |-
            他已经去了遥远的北方。不过等到秋天，狩猎结束，他还会回传教站来。
        - id: ch04-b13
          speaker: evangeline
          text: |-
            请让我留在您身边吧。我的心里全是忧伤，实在太痛苦了。
          emotion: sad
        - id: ch04-b14
          speaker: narrator
          text: |-
            大家都觉得，这样安排最妥当。第二天清早，巴齐尔骑上墨西哥骏马，带着印第安向导和伙伴回家去了。伊凡吉林独自留在传教站。
    - id: ch05
      title: 罗盘花的指引
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            日子慢慢地、慢慢地、慢慢地过去。一天变成一周，一周又变成一月。伊凡吉林初来时，玉米才从地里冒出绿芽。如今，细长的玉米秆已经高过她的头，交错的叶子搭成回廊，让乌鸦在里面乞食，也成了任松鼠偷取的粮仓。
        - id: ch05-b02
          speaker: narrator
          text: |-
            金色的收获季节到了。姑娘们剥开玉米外皮，看见血红色的穗子就羞红了脸，因为那表示恋人快来了。看见弯曲的穗子，她们却笑着叫它玉米地里的小偷。可是，就连血红的玉米穗，也没能给伊凡吉林带回她的爱人。
        - id: ch05-b03
          speaker: missionary_priest
          text: |-
            耐心一点。只要心里有信念，你的祈祷总会得到回应。你看草地上那株纤细的小花。它抬着头，所有叶片都准确地指向北方，就像磁针一样。它叫罗盘花。上帝把它悬在柔弱的细茎上，让它为旅人指路，带人走过像大海一样无路、也没有尽头的荒漠。
          emotion: calm
        - id: ch05-b04
          speaker: missionary_priest
          text: |-
            信念在人心里，就像这株花。激情的花开得更艳，更茂盛，也更芬芳，可它会迷惑人，把人引到歧路上，连香气都能害人。只有这株不起眼的小花，能引领我们走过今生。到了来世，它还会为我们戴上水仙花冠，花瓣上沾着忘忧泉的露水。
          emotion: calm
    - id: ch06
      title: 又一次落空
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            秋天来了，又过去了。冬天也来了，又过去了。加布里埃尔一直没有回来。春天开出花朵，知更鸟和蓝鸲在旷野与树林里唱着甜美的歌。加布里埃尔还是没有回来。
        - id: ch06-b02
          speaker: narrator
          text: |-
            到了夏天，风送来一则传闻。它比鸟歌更甜，比花朵的颜色和香气更让人心动。有人说，在遥远的东北方，在密歇根森林里，加布里埃尔的棚屋就在萨吉诺河岸。
        - id: ch06-b03
          speaker: narrator
          text: |-
            正好有一队向导要返回圣劳伦斯河一带的湖泊。伊凡吉林悲伤地告别传教站，跟着他们重新上路。道路漫长而危险，她走得疲惫不堪，终于来到密歇根森林深处。可眼前那座猎人棚屋已经空了，也已经坍塌破败。
    - id: ch07
      title: 岁月的暗影
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: |-
            漫长而悲伤的岁月，就这样流过。人们在不同的季节，也在相隔遥远的地方，看见那个一直漂泊的少女。她有时出现在温顺的摩拉维亚传教士建起的恩典帐幕中，有时走过军队喧闹的营地与战场。有时，她到了偏僻的村庄，有时又到了市镇和人烟稠密的城市。
        - id: ch07-b02
          speaker: narrator
          text: |-
            她像一个幻影，悄悄来了，又悄悄离开，没有人记得她。满怀希望开始这段漫长旅程时，她还年轻，也很美丽。等一次次失望终于结束了旅程，她的容颜已经凋谢，人也老了。
        - id: ch07-b03
          speaker: narrator
          text: |-
            每过一年，岁月就从她的美貌里带走一些东西，只把更宽、更深的阴郁和暗影留在那里。后来，几缕淡淡的灰白出现在她额前，渐渐蔓延开来。那仿佛是另一种生命的黎明，正越过她尘世的地平线，如同东方天空里最早出现的一线晨光。
