  chapters:
    - id: ch01
      title: Part the Second, IV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Far in the West lies a desert land. Mountains rise there, their bright summits covered in everlasting snow. Deep below, jagged ravines open like rough gateways for the wheels of emigrant wagons.

            Rivers run away from those heights in every direction. The Oregon, the Walleway, and the Owyhee flow west. The Nebraska leaps east through the Sweet-water Valley and among the Windriver Mountains. From Fontaine-qui-bout and the Spanish sierras, countless torrents race south across sand and rock toward the ocean. Their endless sound rolls through the desert like the solemn chords of a great harp.

            Between the rivers spread wonderful prairies, broad waves of grass moving through sun and shadow. Roses and purple amorphas bloom there. Buffalo, elk, roebuck, wolves, and riderless horses roam across the land. Fire scorches it. Winds cross it until they are weary. Scattered tribes wander and fight, leaving bloody trails behind them, while the vulture circles high above like the restless soul of a chief killed in battle.

            Here and there, smoke rises from the camps of raiders. Groves grow beside swift rivers. The grim, silent bear comes down through the dark ravines and digs for roots beside the streams. Over everything stretches a clear, crystal sky, like the protecting hand of God turned above the earth.
        - id: ch01-b02
          speaker: narrator
          text: |-
            Gabriel had gone far into this country near the base of the Ozark Mountains, with hunters and trappers following him. Day after day, Evangeline and Basil rode after him with their Indian guides. Each morning, they believed they might catch him before the day was done.

            Sometimes they saw, or thought they saw, the smoke of his campfire rising from the distant plain. But when they reached the place at night, they found nothing but embers and ashes. Their bodies grew tired, and their hearts were often sad. Still, hope drew them onward like the Fata Morgana, whose distant shining lakes always vanished as they came near.
        - id: ch01-b03
          speaker: narrator
          text: |-
            One evening, as they sat beside their fire, an Indian woman entered the little camp without a sound. Sorrow had marked her face deeply, but her patience was just as deep. She was a Shawnee woman on her way home to her people. She had come from the distant hunting grounds of the Comanches, where her Canadian husband, a woodsman, had been murdered.

            Her story touched them. They welcomed her with kind words and shared the buffalo meat and venison cooking over the coals.

            When the meal was over, Basil and the others lay down after their long march and the day's hunt. Soon they were asleep on the ground, wrapped in blankets while the firelight trembled across their faces.

            The Shawnee woman sat at the entrance to Evangeline's tent. In a soft, low voice, she told the whole story of her love, its happiness, its pain, and every cruel turn it had taken.
        - id: ch01-b04
          speaker: narrator
          text: |-
            Evangeline wept as she listened. Here was another unhappy heart that had loved and lost. Pity moved her deeply. Yet even in her sorrow, she was glad to have someone near who understood suffering. So Evangeline told the woman about her own love and all that had gone wrong.

            The Shawnee woman listened in silent wonder. Even when Evangeline finished, she said nothing. At last, a strange horror seemed to pass through her mind, and she began the tale of Mowis.
        - id: ch01-b05
          speaker: shawnee_woman
          text: |-
            Mowis was a bridegroom made of snow. He won a young woman's love, and she married him. But when morning came, he rose and left her wigwam. He faded and melted into the sunlight. She followed him far into the forest, but at last he disappeared, and she never saw him again.
        - id: ch01-b06
          speaker: narrator
          text: Then the woman spoke of fair Lilinau. Her sweet, low voice sounded almost like a spell.
        - id: ch01-b07
          speaker: shawnee_woman
          text: |-
            A phantom came to Lilinau in the quiet of twilight. From the pines above her father's lodge, he breathed like the evening wind and whispered of love. She followed his green, waving plume into the forest. She never came home, and her people never saw her again.
        - id: ch01-b08
          speaker: narrator
          text: |-
            Evangeline listened in amazement. The woman's soft words seemed full of magic. Soon the whole country around them felt enchanted, and her guest seemed like an enchantress.

            The moon rose slowly over the Ozark Mountains. Its mysterious light filled the little tent, touched the shadowed leaves, and spread through the woods. The brook hurried past with a lovely sound. Overhead, the branches swayed and sighed in whispers that could barely be heard.

            Evangeline's heart was full of love. But beneath it, she felt a secret pain and a shapeless fear creeping closer, like a cold, poisonous snake entering a swallow's nest. It was not an earthly fear. The night air seemed to carry a breath from the world of spirits. For a moment, she felt that she too was chasing a phantom.

            She fell asleep with that thought. By morning, both the fear and the phantom were gone.
        - id: ch01-b09
          speaker: narrator
          text: Early the next morning, the travelers began their march again. As they went, the Shawnee woman told them about a place beyond the mountains.
        - id: ch01-b10
          speaker: shawnee_woman
          text: |-
            On the western slope of these mountains, the Black Robe chief lives in his little mission village. He teaches the people many things and tells them about Mary and Jesus. When they hear him, their hearts laugh aloud with joy and weep with pain.
        - id: ch01-b11
          speaker: narrator
          text: A sudden, hidden feeling stirred in Evangeline, and she answered at once.
        - id: ch01-b12
          speaker: evangeline
          text: Let us go to the Mission. I know good news is waiting for us there!
        - id: ch01-b13
          speaker: narrator
          text: |-
            They turned their horses toward it. Just as the sun went down, they passed behind a shoulder of the mountains and heard many voices murmuring together. In a wide green meadow beside a river, they saw the tents of the Christian people and the Jesuit Mission.

            A towering oak stood in the middle of the village. Beneath it, the Black Robe chief knelt with his people. A crucifix was fastened high on the tree trunk under trailing grapevines. The suffering face looked down on everyone kneeling below. This was their chapel beneath the open sky.

            Their evening chant rose through the woven arches of the branches and mingled with the leaves sighing softly overhead. The travelers came near in silence with their heads uncovered. Then they knelt on the grass and joined the prayers.

            When the service ended, the priest raised his hands in blessing. Then he walked slowly toward the strangers and welcomed them. Their answer brought a gentle smile to his face. Here in the forest, he had heard the familiar sounds of his mother tongue. He led them kindly into his wigwam.

            They rested there on mats and skins. He gave them maize cakes to eat and water from his gourd. Before long, they had told him their story. The priest answered solemnly.
        - id: ch01-b14
          speaker: mission_priest
          text: |-
            Fewer than six days have passed since Gabriel sat here beside me, on the very mat where this young woman now rests. He told me the same sad story. Then he rose and continued on his way.
        - id: ch01-b15
          speaker: narrator
          text: |-
            The priest spoke softly and kindly. But his words fell on Evangeline's heart like winter snow falling into a lonely nest after the birds have gone.
        - id: ch01-b16
          speaker: mission_priest
          text: He has gone far to the north. When the autumn hunt is over, he will come back to the Mission.
        - id: ch01-b17
          speaker: narrator
          text: Evangeline answered in a meek, yielding voice.
        - id: ch01-b18
          speaker: evangeline
          text: Please let me stay with you. My heart is full of sorrow.
          emotion: sad
        - id: ch01-b19
          speaker: narrator
          text: Everyone agreed that this was wise. Early the next morning, Basil mounted his Mexican horse and started home with his Indian guides and companions. Evangeline remained at the Mission.
        - id: ch01-b20
          speaker: narrator
          text: |-
            Slowly, slowly, slowly, the days followed one another. Days became weeks, and weeks became months. When Evangeline arrived, the maize had only begun to rise green from the earth. Now the tall stalks waved above her. Their crossing leaves made little cloisters for begging crows and storehouses for thieving squirrels.

            Then the golden harvest weather came. The maidens husked the maize and blushed whenever they found a blood-red ear, because it promised a lover. When they found a crooked one, they laughed and called it a thief in the cornfield.

            But even a blood-red ear did not bring Evangeline's lover back. The priest would remind her to wait.
        - id: ch01-b21
          speaker: mission_priest
          text: |-
            Have patience. Keep your faith, and your prayer will be answered.

            Look at this delicate plant lifting its head from the meadow. Every leaf points north, as faithfully as a magnet. It is the compass flower. God has placed it on this fragile stem to guide travelers across the desert, an endless sea with no road.

            Faith is like that flower within the human soul. The bright blossoms of passion may be lovelier and sweeter. But they deceive us, and their perfume can lead us to death. Only this humble flower can guide us through this life and, afterward, crown us with asphodels washed in the dew of forgetfulness.
          emotion: calm
        - id: ch01-b22
          speaker: narrator
          text: |-
            Autumn came and passed. Winter followed, but Gabriel did not return. Spring opened into blossom. Robins and bluebirds sang sweetly across the fields and woods, but Gabriel did not return.

            Then the summer wind carried a rumor sweeter to Evangeline than birdsong, brighter than flowers, and more fragrant than their scent. Far to the north and east, in the forests of Michigan, Gabriel had made his lodge beside the Saginaw River.

            Some guides were returning toward the lakes of the Saint Lawrence. Evangeline said a sorrowful farewell to the Mission and went with them. The road was weary, and the marches were long and dangerous. At last, she reached the depths of the Michigan forest. There she found the hunter's lodge deserted and fallen into ruin.
        - id: ch01-b23
          speaker: narrator
          text: |-
            So the long, sad years slipped by. In season after season, people saw the wandering maiden in places far apart. She appeared among the gentle Moravians in their Tents of Grace. She passed through the noisy camps and battlefields of armies, then through quiet villages, towns, and crowded cities.

            Like a phantom, she came and went, and no one remembered her. She had been young and beautiful when hope led her onto that long road. She was faded and old when disappointment brought the journey to its end.

            Each year took something from her beauty and left the shadow around her wider and deeper. Faint strands of gray appeared above her forehead. They were the dawn of another life, breaking over the edge of her earthly world like the first pale light in the eastern sky.
