  chapters:
    - id: ch01
      title: Part the First, IV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            The next morning, the sun rose pleasantly over Grand-Pré. The Basin of Minas shone in the soft, sweet air, and ships lay at anchor with their shadows wavering beneath them.

            The village had been awake for hours. Work seemed to knock at the golden gates of morning with a hundred busy hands. Then the Acadian farmers began arriving from the countryside and the nearby hamlets, dressed for a holiday. Young people called out cheerful greetings and laughed as one group after another came up from the meadows. There were no paths across that green land, only wheel tracks in the grass. Some groups joined together, while others passed along the highway.

            Well before noon, every sound of work had stopped. The streets filled with people. Neighbors sat in merry groups at the doors, talking and laughing in the sunshine. Every house became an inn, ready to welcome and feed whoever entered. These simple people lived like brothers. What belonged to one belonged to another.

            Yet Benedict's home seemed more generous than all the rest. Evangeline stood among her father's guests, her face bright with smiles. As she offered each cup, her warm welcome seemed to bless it.
        - id: ch01-b02
          speaker: narrator
          text: |-
            The betrothal feast was spread beneath the open sky, in the sweet-smelling orchard where the branches bent under their golden fruit. Father Felician and the notary sat in the shade of the porch. Good Benedict sat with Basil, the sturdy blacksmith.

            A little apart from them, near the cider press and the beehives, sat Michael the fiddler. His heart was as gay as his waistcoat. Sunlight and shadow played through the leaves and over his white hair as it moved in the wind. His cheerful face glowed like a coal when someone blows the ashes from the fire.

            Michael played his fiddle and sang "Tous les Bourgeois de Chartres" and "Le Carillon de Dunkerque." Now and then, he beat time with his wooden shoes. Around him, the dancers spun merrily beneath the orchard trees and followed the path down toward the meadows. Old and young danced together, with children among them.

            Of all the village maidens, the fairest was Evangeline, Benedict's daughter. Of all the young men, the noblest was Gabriel, the blacksmith's son.
        - id: ch01-b03
          speaker: narrator
          text: |-
            So the morning passed. Then the church bell rang out from its tower, summoning the village, and a drum sounded across the meadows.

            Before long, the church was crowded with men. Outside in the churchyard, the women waited among the graves. They hung garlands of autumn leaves and fresh forest evergreens on the headstones.

            A guard came from the ships and marched proudly into the church. Their brass drums crashed harshly beneath the high ceiling, and the noise rang from the windows. Then it stopped. The heavy doors slowly closed, and the crowd waited in silence to hear what the soldiers wanted.

            Their commander rose on the altar steps. In his raised hands, he held a royal order with its seals.
        - id: ch01-b04
          speaker: commander
          text: |-
            You have been called here today by order of His Majesty. He has treated you with mercy and kindness. Ask your own hearts how you have answered him.

            This duty pains me by nature, and I know it will bring you grief. Still, I must obey and tell you the king's will. All your lands, your homes, and every kind of cattle you own now belong to the Crown. You yourselves will be carried away from this province to other lands.

            May God grant that you live there as faithful subjects, happy and at peace. For now, by His Majesty's pleasure, I declare you prisoners.
        - id: ch01-b05
          speaker: narrator
          text: |-
            The command struck the people's hearts like a sudden summer storm. One moment, the sky is still and burning hot. The next, hail tears down the farmer's corn and shatters his windows. It blots out the sun and rips thatch from the roofs, while cattle bellow and strain to break free.

            For a moment, the men stood without a word. They could hardly understand what they had heard. Then grief and anger rose among them, louder and louder, until they all rushed wildly toward the door.

            There was no escape. Shouts and bitter curses filled the house of prayer. Above the other heads rose Basil the blacksmith, his arms lifted high like a broken spar tossed on a stormy sea. His face was red and twisted with rage as he shouted.
        - id: ch01-b06
          speaker: basil
          text: Down with the English tyrants! We never swore loyalty to them! Death to these foreign soldiers who are taking our homes and our harvests!
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: |-
            Basil tried to say more. But a soldier struck him across the mouth without mercy and dragged him down onto the stone floor.

            While the struggle and angry uproar continued, the chancel door opened. Father Felician entered with a grave expression and climbed the altar steps. He raised one hand, and the whole shouting crowd fell silent.

            His voice was deep and solemn. Each mournful word came slowly and clearly, like a clock striking after an alarm bell.
        - id: ch01-b08
          speaker: father_felician
          text: |-
            My children, what are you doing? What madness has taken hold of you?

            I have worked among you for forty years. I taught you to love one another, not only through my words but through the way I lived. Is this what has come from all my labor, my sleepless nights, my prayers, and everything I went without? Have you forgotten so quickly every lesson of love and forgiveness?

            This is the house of the Prince of Peace. Will you dishonor it with violence and hearts full of hatred? Look at Christ upon the cross, watching you. See the gentleness and holy compassion in his sorrowful eyes. Listen. His lips still pray, "O Father, forgive them."

            When wicked men attack us, let us make that prayer our own. Let us say it now. O Father, forgive them.
          emotion: calm
        - id: ch01-b09
          speaker: narrator
          text: Father Felician's rebuke was brief, but it sank deep into the people's hearts. Their furious cries gave way to sobs of repentance. Then they repeated his prayer together.
        - id: ch01-b10
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: O Father, forgive them.
          emotion: sad
        - id: ch01-b11
          speaker: narrator
          text: |-
            Then the evening service began. Candles shone on the altar. Father Felician's voice was full and fervent, and the people answered him from their hearts, not merely with their lips. They sang the Ave Maria and fell to their knees. Their souls rose on the strength of prayer, like Elijah rising into heaven.
        - id: ch01-b12
          speaker: narrator
          text: |-
            Meanwhile, the terrible news had spread through the village. Women and children wandered from house to house, weeping.

            Evangeline stood for a long time at her father's door. She held one hand above her eyes and stared into the low sunlight. As the sun went down, it filled the village street with a strange splendor. Every cottage roof seemed covered in golden thatch, and every window shone.

            Inside, the table had long been waiting beneath its white cloth. A wheaten loaf stood there beside honey scented with wildflowers. There was a tankard of ale and cheese fresh from the dairy. At the head of the table waited her father's great armchair.

            Still Evangeline remained at the door. Sunset stretched the long shadows of the trees across the wide, sweet meadows. A deeper shadow had fallen over her spirit. Yet from within that darkness rose charity, gentleness, love, hope, forgiveness, and patience.

            At last, forgetting her own sorrow, she went out into the village. With her face and her words, she comforted the grieving women as they slowly crossed the darkening fields. Their household duties called them home, and their children could walk no farther.

            The great red sun sank and hid its face behind shimmering golden mist, like the prophet descending from Sinai. Above the village, the Angelus bell rang sweetly.
        - id: ch01-b13
          speaker: narrator
          text: |-
            In the gathering darkness, Evangeline stayed near the church. Everything inside was silent. She stood at the door and then at the windows, trying to see and listening for any sound. Nothing came. At last, overcome with feeling, she cried out in a trembling voice.
        - id: ch01-b14
          speaker: evangeline
          text: Gabriel!
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: |-
            No answer came from the graves of the dead, or from the church that had become a darker grave for the living.

            At last, Evangeline slowly returned to her father's empty house. The fire smoldered on the hearth. Supper still stood untouched on the table. Every room was empty and bleak, haunted by fears of what might come. Her footsteps echoed sadly on the stairs and across the floor of her room.

            Deep in the night, she heard rain whispering against the dry leaves of the sycamore beside her window. Lightning flashed sharply, and thunder echoed through the darkness. Its voice reminded her that God was in heaven and still ruled the world he had made.

            Then she remembered the story she had heard of Heaven's justice. Her troubled spirit grew quiet, and she slept peacefully until morning.
