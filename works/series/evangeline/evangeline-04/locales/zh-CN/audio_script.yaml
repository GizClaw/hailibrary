audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静庄重，带着古老传说的悠远与克制的哀愁
        timbre: 温暖清澈，低沉而有回响
        pace: 舒缓从容，在景物转换处自然停顿
        pitch: 中低
    commander:
      display_name: 卫队长
      tts:
        delivery: 威严克制，宣读命令时冷硬而带着勉强的沉重
        timbre: 坚实冷峻，清楚有穿透力
        pace: 稳健偏慢，句句分明
        pitch: 中低
    basil:
      display_name: 巴西尔
      tts:
        delivery: 坦率郑重，忧虑时仍保有铁匠的坚实与克制
        timbre: 低沉有力，带着劳作者的厚重
        pace: 平稳偏慢，陈述警讯时清楚凝重
        pitch: 低
    felician:
      display_name: 费利西安神父
      tts:
        delivery: 庄重慈悲，劝诫时坚定而满含哀痛
        timbre: 深沉温厚，清晰而有回响
        pace: 徐缓有分量，在祷词前自然停顿
        pitch: 中低
    evangeline:
      display_name: 伊凡吉林
      tts:
        delivery: 温柔真挚，悲痛时克制而颤抖
        timbre: 清澈柔和，年轻而明亮
        pace: 平稳舒缓，情绪激越时略快
        pitch: 中
    parishioner_1:
      display_name: 教民甲
      tts:
        delivery: 虔诚悔恨，随众祈祷时低声而真切
        timbre: 朴实温厚
        pace: 缓慢整齐
        pitch: 中
    parishioner_2:
      display_name: 教民乙
      tts:
        delivery: 虔诚悔恨，随众祈祷时低声而真切
        timbre: 粗粝低沉
        pace: 缓慢整齐
        pitch: 低
    parishioner_3:
      display_name: 教民丙
      tts:
        delivery: 虔诚悔恨，随众祈祷时低声而真切
        timbre: 柔和清亮
        pace: 缓慢整齐
        pitch: 中高
  chapters:
    - id: ch01
      title: 订婚的早晨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            第二天早晨，太阳欢欢喜喜地照着大草原村。米纳斯湾在芬芳的空气里闪着柔光，停泊的船只把摇曳的影子投在水面上。村里早就忙开了，劳作的声音像伸出一百只手，一齐敲响清晨金色的大门。
        - id: ch01-b02
          speaker: narrator
          text: |-
            四周的农场和村落里，阿卡迪亚农人穿上节日的衣裳，兴高采烈地赶来。辽阔的绿草地上看不见一条小路，只有车轮压出的辙痕。一群又一群人从那边出现，有的汇入人群，有的沿着大路继续向前。年轻人互道早安，笑声一路传开，连明亮的天空也像是更亮了。
        - id: ch01-b03
          speaker: narrator
          text: |-
            中午还没到，劳作声已经停了。街上挤满人，家家门前都有人晒着太阳，欢笑闲谈。每一户都像客栈，谁来了都能吃上一顿。这里的人亲如兄弟，一家所有，也就是大家所有。不过，要说待客最热情的，还是贝内迪克特家。
        - id: ch01-b04
          speaker: narrator
          text: |-
            伊凡吉林站在父亲的宾客中间，笑容明亮。她一面递酒，一面说着欢迎的话，那些喜悦的话仿佛也祝福了杯中的酒。
        - id: ch01-b05
          speaker: narrator
          text: |-
            果园里金色的果实压弯枝头，芳香充满四周。露天的订婚宴就摆在果树下。神父、公证人、贝内迪克特和巴西尔坐在门廊的阴影下。不远处，苹果榨汁机和蜂箱旁边，提琴手迈克尔穿着最鲜艳的背心，快活地坐在那里。
        - id: ch01-b06
          speaker: narrator
          text: |-
            他的白发随风飘动，树叶间的光影轮流掠过发梢。那张红亮的笑脸，就像灰烬被吹开后露出的炭火。他拉着琴，唱起《沙特尔的市民》和《敦刻尔克的钟声》，木鞋还不时踏着拍子。
        - id: ch01-b07
          speaker: narrator
          text: |-
            果树下和通往草地的小路上，舞圈转得叫人眼花。老人、青年和孩子全都混在一起。姑娘中最美的是贝内迪克特的女儿伊凡吉林。青年中最高贵的，是铁匠的儿子加布里埃尔。
    - id: ch02
      title: 王室的谕令
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            早晨就这样过去。忽然，塔楼上的钟发出洪亮的召唤，鼓声也越过草地传来。不久，男人们挤满了教堂。女人们留在外面的墓园，把秋叶花环和刚从森林采来的常青枝挂在墓碑上。
        - id: ch02-b02
          speaker: narrator
          text: |-
            船上的卫兵来到墓园，神气地从女人们中间穿过，列队走进神圣的教堂大门。铜鼓刺耳地轰响，声音撞着屋顶，又从一扇扇窗户间荡回来。可鼓声只响了一会儿，沉重的大门便慢慢关上，四下突然安静了。一时间谁也没有开口。人们默默等着，不知道士兵会宣布什么。
        - id: ch02-b03
          speaker: narrator
          text: |-
            卫队长走上祭坛的台阶，双手高举盖着印玺的王室谕令。
        - id: ch02-b04
          speaker: commander
          text: |-
            今天把你们召来，是奉国王陛下的命令。陛下一直待你们仁慈宽厚。你们怎样回报，就问问自己的良心吧。这件差事违背我的本性，叫我十分痛苦。我知道，你们听见也一定悲伤。可我必须服从，把君王的旨意告诉你们。
        - id: ch02-b05
          speaker: commander
          text: |-
            你们所有的土地、房屋和牲畜，从此都归王室。你们也要离开本省，被送往别处。愿上帝保佑你们在那里永远做忠诚的臣民，过幸福安宁的日子。现在，我宣布你们全是囚犯。这是陛下的意愿。
        - id: ch02-b06
          speaker: narrator
          text: |-
            这番话落在人们心上，就像盛夏晴空忽然压下一场风暴。冰雹打倒庄稼，砸碎窗户，遮住太阳，又把屋顶的茅草撒得满地都是。牛群吼叫着乱冲，只想撞破围栏。
        - id: ch02-b07
          speaker: narrator
          text: |-
            大家先是惊得说不出话。过了一会儿，悲痛和愤怒的哭喊越来越响。所有人一起扑向门口，却根本逃不出去。叫骂和诅咒顿时灌满了祈祷的地方。
        - id: ch02-b08
          speaker: narrator
          text: |-
            巴西尔举起双臂，高高露在人群头顶，像暴风海面上一根被浪头抛起的船桅。他的脸涨得通红，五官也被怒火扭曲了。
        - id: ch02-b09
          speaker: basil
          text: |-
            打倒英国暴君！我们从没有宣誓效忠他们！这些外国士兵抢走我们的家园和收成，他们该死！
          emotion: angry
        - id: ch02-b10
          speaker: narrator
          text: |-
            他还要再喊，一名士兵已经一掌打在他嘴上，把他拖倒在石板地上。
    - id: ch03
      title: 宽恕的祷告
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            争斗还在继续，教堂里满是怒吼和混乱。这时，圣坛的门打开了。费利西安神父神情严肃地走进来，登上祭坛台阶。他举起一只手，只一个动作，就让吵闹的人群全静下来。
        - id: ch03-b02
          speaker: narrator
          text: |-
            神父的声音低沉庄重，缓慢而悲凉。那声音就像急促的警钟停下以后，时钟一下一下，清清楚楚地报出时辰。
        - id: ch03-b03
          speaker: felician
          text: |-
            孩子们，你们在做什么？是什么疯狂控制了你们？四十年来，我一直生活在你们中间，教你们彼此相爱。我不只这样说，也一直这样做。难道我多年的劳苦、守夜、祈祷和牺牲，只换来今天这一幕吗？你们这么快就忘了爱与宽恕吗？
        - id: ch03-b04
          speaker: felician
          text: |-
            这里是和平之君的圣殿。你们难道要带着仇恨，在这里动手伤人吗？抬头看看吧。钉在十字架上的基督正望着你们。他悲伤的眼睛里，满是温顺和神圣的怜悯。听啊，他的双唇还在祈祷：“天父啊，宽恕他们！”
        - id: ch03-b05
          speaker: felician
          text: |-
            恶人伤害我们的时候，我们也该这样祈祷。现在，和我一起说吧：“天父啊，宽恕他们！”
        - id: ch03-b06
          speaker: narrator
          text: |-
            他的责备并不多，却一句句沉进人们心里。怒火退下去，教堂里响起悔恨的呜咽。众人跟着神父，一同祈祷。
        - id: ch03-b07
          speakers: [parishioner_1, parishioner_2, parishioner_3]
          ensemble: chorus
          text: |-
            天父啊，宽恕他们！
        - id: ch03-b08
          speaker: narrator
          text: |-
            接着，晚祷开始了。祭坛上的蜡烛闪着光，神父热烈而深沉的声音在教堂里回响。人们不只用嘴唇回应，更用整颗心回应。他们唱起《圣母颂》，跪在地上。虔诚带着他们的灵魂升起，仿佛以利亚乘着祈祷的火焰升往天国。
    - id: ch04
      title: 夕阳下的等待
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            噩耗很快传遍村子。女人和孩子哭着从一家走到另一家。伊凡吉林久久站在父亲门前，抬起右手，挡住西斜的阳光。
        - id: ch04-b02
          speaker: narrator
          text: |-
            夕阳带着神秘的光彩，照亮村中街道。农舍仿佛都换上金色的茅顶，窗子也灿然发亮。屋里的桌上，雪白的桌布早已铺好。麦面包、带着野花香气的蜂蜜、一大杯啤酒，还有刚从奶房取来的新鲜奶酪，都在等着无人归来的家人。桌子上首，还空着父亲那张宽大的扶手椅。
        - id: ch04-b03
          speaker: narrator
          text: |-
            伊凡吉林守在门前，看树木的长影越过辽阔芳香的草地。她心里落着一道更深的阴影，灵魂中却升起了来自天国的芬芳。那是仁爱、温顺、慈爱、希望、宽恕与忍耐。
        - id: ch04-b04
          speaker: narrator
          text: |-
            她忘了自己的悲伤，在村里一家家走过去，用目光和话语安慰绝望的女人。天色越来越暗，女人们这才慢慢穿过田野回家。家务还在等着她们，疲倦的孩子也走不动了。
        - id: ch04-b05
          speaker: narrator
          text: |-
            巨大的红日沉了下去，把脸上的光藏进闪着金色的云雾，仿佛先知从西奈山走下。晚祷钟声温柔地飘过村庄。
    - id: ch05
      title: 黑夜里的呼唤
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            暮色已经很深，伊凡吉林还留在教堂旁。里面一点声音也没有。她站在门口听，又走到窗边看，却什么也等不到。最后，压在心里的感情一下涌了上来。她颤声呼喊。
        - id: ch05-b02
          speaker: evangeline
          text: |-
            加布里埃尔！
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: |-
            没有回答。死者的坟墓沉默着，关住活人的那座更阴森的坟墓，也同样沉默。
        - id: ch05-b04
          speaker: narrator
          text: |-
            伊凡吉林终于慢慢回到父亲空荡荡的家。炉火还在暗暗燃烧，桌上的晚饭一口没动。每个房间都又空又冷，像是藏着恐怖的幽灵。她的脚步悲伤地响过楼梯，又响在自己房间的地板上。
        - id: ch05-b05
          speaker: narrator
          text: |-
            到了深夜，她听见雨点低声落下，敲着窗边悬铃木的枯叶。闪电猛地划破黑暗，雷声一阵阵回荡。那声音告诉她，上帝仍在天国，依然治理着自己创造的世界。
        - id: ch05-b06
          speaker: narrator
          text: |-
            她想起从前听过的那个故事，想起天理终会昭彰。纷乱的心渐渐安定下来。她终于平静地睡去，一直睡到清晨。
