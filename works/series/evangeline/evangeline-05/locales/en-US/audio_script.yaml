  chapters:
    - id: ch01
      title: Part the First, V
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Four full days had passed, each with its sunrise and sunset. On the fifth morning, the cock called cheerfully to the sleeping maids in the farmhouse.

            Soon the Acadian women came across the yellow fields from nearby farms and hamlets. They moved in a silent, sorrowful procession, driving heavy wagons filled with all they could carry from home. Again and again, they stopped to look back at their houses before the winding road and the woods hid them from sight. Their children ran close beside them, urging the oxen onward and clutching broken pieces of their toys.
        - id: ch01-b02
          speaker: narrator
          text: |-
            They hurried to the mouth of the Gaspereau. On the beach, the villagers' belongings lay in confused heaps. Boats traveled between the shore and the ships all day, while wagon after wagon labored down from Grand-Pré.

            Late that afternoon, as the sun neared the horizon, drums rolled across the fields from the churchyard. The women and children crowded toward the sound. Then the church doors opened. The guards marched out first, and behind them came the Acadian farmers, patient even after their long imprisonment.

            Like pilgrims journeying far from their homes and country, who sing so they can forget the weariness of the road, the farmers sang as they walked down to the shore among their wives and daughters. The young men led the procession. Their lips trembled as they raised a chant from the Catholic missions together.
        - id: ch01-b03
          speakers: [young_man_1, young_man_2]
          ensemble: duo
          text: Sacred heart of our Saviour, endless fountain, give our hearts strength, submission, and patience today.
        - id: ch01-b04
          speaker: narrator
          text: The old men joined them, and so did the women beside the road. Even the birds singing in the sunshine seemed to add the voices of those who had died.
        - id: ch01-b05
          speakers: [old_man, acadian_woman]
          ensemble: duo
          text: Sacred heart of our Saviour, endless fountain, give our hearts strength, submission, and patience today.
        - id: ch01-b06
          speaker: narrator
          text: |-
            Halfway to the shore, Evangeline waited without a word. Grief had not overcome her. In this hour of suffering, she stood strong, calm, and sad. Then the procession reached her, and she saw Gabriel's face, pale with emotion.

            Tears filled her eyes. She ran to him, took both his hands, and rested her head on his shoulder.
        - id: ch01-b07
          speaker: evangeline
          text: Gabriel, take heart. As long as we love each other, nothing can truly harm us, no matter what may come.
          emotion: calm
        - id: ch01-b08
          speaker: narrator
          text: |-
            She smiled as she spoke. Then she stopped. Her father was coming slowly toward her, and he looked terribly changed. The color had left his cheeks, and the fire had gone from his eyes. Each step seemed heavier beneath the sorrow in his heart.

            Evangeline put her arms around his neck. With a smile and a sigh, she spoke to him tenderly, though no words could comfort him. And so the mournful procession moved on to the mouth of the Gaspereau.
        - id: ch01-b09
          speaker: narrator
          text: |-
            Confusion ruled the shore as the people began to board. Loaded boats hurried back and forth. In the disorder, wives were torn away from their husbands. Mothers turned too late and saw their children still on land, reaching out and begging to be taken with them.

            Basil and Gabriel were carried to separate ships. Evangeline remained on the shore with her father, watching in despair.

            The sun went down before even half the work was finished. Twilight deepened and darkened around the waiting people. In haste, the retreating sea rushed away from the beach. Kelp, drift from the tide, and slippery seaweed covered the long stretch of wet sand. The sailors' boats were left stranded far inland and high on the shore.

            Farther inland, the homeless Acadian farmers made camp among their wagons and household goods. The scattered loads and people looked like a travelers' camp, or an army resting after battle. They lay there with the sea cutting off escape and sentinels standing close by. The ocean withdrew to its deepest caves, bellowing as it dragged rattling pebbles down the beach.
        - id: ch01-b10
          speaker: narrator
          text: |-
            Night came. The cattle returned from the pastures, and the damp, still air carried the sweet smell of milk. The cows waited a long while at the familiar farmyard gates. They called and looked in vain for the milkmaids whose voices and hands they knew.

            The village streets were silent. No Angelus rang from the church to mark the evening hour. No smoke rose from the roofs, and no light shone in the windows of the empty homes.
        - id: ch01-b11
          speaker: narrator
          text: |-
            Meanwhile, fires had been lit along the shore with driftwood cast up by storms and wrecks. Dark figures and sorrowful faces gathered around them. Women's and men's voices rose through the crying of children.

            Father Felician went from fire to fire, as though he were visiting every hearth in his parish. He comforted his people, blessed them, and tried to give them courage. Like Saint Paul among the shipwrecked on the lonely shore of Malta, the faithful priest moved among people who had lost their homes. At last he reached the place where Evangeline sat with her father.

            In the wavering light, Benedict's face looked hollow, pale, and worn. No thought or feeling crossed it. He was like the face of a clock after its hands have been taken away.

            Evangeline tried to cheer him with gentle words and caresses. She offered him food. Still he did not move, look at her, or speak. He only stared blankly into the flickering fire.
        - id: ch01-b12
          speaker: father_felician
          text: May God bless you.
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: |-
            The priest wanted to say more, but grief filled his heart. His voice failed on his lips, like a child's feet stopping at a doorway when the sorrow beyond leaves him hushed.

            Without speaking, Father Felician placed his hand on Evangeline's head. Tears filled his eyes as he looked up at the silent stars. Above them, the stars continued on their way, undisturbed by all the wrongs and sorrows of mortal lives. Then he sat beside her, and together they wept in silence.
        - id: ch01-b14
          speaker: narrator
          text: |-
            Suddenly, a red light rose in the south. It climbed the clear wall of the sky like a blood-red autumn moon, then reached across mountains and meadows with a hundred giant hands. It seized the rocks and rivers and heaped their shadows together.

            The glow spread wider and wider. It shone on the village roofs, across the sky and sea, and over the ships waiting in the roadstead. Bright columns of smoke rose into the air. Flames pushed through their folds and drew back again like the trembling hands of a suffering martyr.

            The wind caught burning straw and embers and whirled them high. All at once, smoke and flame burst from a hundred rooftops.
        - id: ch01-b15
          speaker: narrator
          text: The people on the shore and aboard the ships stared in horror. At first, no one could speak. Then their grief broke out in a cry.
        - id: ch01-b16
          speakers: [young_man_1, old_man, acadian_woman]
          ensemble: chorus
          text: We will never see our homes in Grand-Pré again!
          emotion: sad
        - id: ch01-b17
          speaker: narrator
          text: |-
            Suddenly the roosters began crowing loudly in the farmyards, fooled by the fire into thinking dawn had come. The cattle called through the evening air, while the barking of dogs broke between their cries.

            Then a terrible sound rose. It was like the thunder of wild horses racing past a sleeping camp, or a great herd of buffalo rushing toward a river. The cattle and horses had broken through their pens and fences. In terror, they swept across the meadows.
        - id: ch01-b18
          speaker: narrator
          text: |-
            Overwhelmed by what they saw, Evangeline and the priest could only stare. The terrible light before them grew wider and redder across the night. At last, they turned to speak to their silent companion, Benedict.

            He had fallen from his seat. His body lay motionless on the shore. His soul had left him.

            Slowly, Father Felician lifted the lifeless head. Evangeline knelt beside her father and cried out in terror. Then she fainted and fell with her head upon his chest.
        - id: ch01-b19
          speaker: narrator
          text: |-
            She lay there through the long night in a deep, unknowing sleep. When she woke from that trance, a great crowd stood near. She saw the pale faces of friends looking down at her. Their eyes were full of tears, and their faces held the deepest pity.

            The burning village still lit the land. It reddened the sky and shone across every face around her. To her uncertain senses, it seemed like the day of doom.

            Then she heard a familiar voice speaking to the people.
        - id: ch01-b20
          speaker: father_felician
          text: Let us bury him here beside the sea. Someday, when a happier time brings us home from the unknown land of our exile, we will carry his sacred remains to the churchyard and lay them there with honor.
        - id: ch01-b21
          speaker: narrator
          text: |-
            So they hurriedly buried the farmer of Grand-Pré beside the sea. The glare of the burning village served as their funeral torches, but there was no bell and no book.

            Father Felician recited the sorrowful service for the dead. The sea answered with a mournful sound, like the voice of a vast congregation, and its solemn roar joined the funeral songs.

            The tide was returning. From far across the empty ocean, it came heaving and hurrying toward the land with the first light of dawn.

            Once more, the noise and movement of boarding began. When the tide went out again, the ships sailed from the harbor. They left the dead behind on the shore, and Grand-Pré in ruins.
