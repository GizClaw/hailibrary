audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静庄重，带着古老传说的悠远与克制的哀愁
        timbre: 温暖清澈，低沉而有回响
        pace: 舒缓从容，在景物转换处自然停顿
        pitch: 中低
    felician:
      display_name: 费利西安神父
      tts:
        delivery: 庄重慈悲，劝诫时坚定而满含哀痛
        timbre: 深沉温厚，清晰而有回响
        pace: 徐缓有分量，在祷词前自然停顿
        pitch: 中低
    evangeline:
      display_name: 伊凡吉林
      tts:
        delivery: 温柔真挚，悲痛时克制而颤抖
        timbre: 清澈柔和，年轻而明亮
        pace: 平稳舒缓，情绪激越时略快
        pitch: 中
  chapters:
    - id: ch01
      title: 月下的水路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            五月里，一艘笨重的大船顺着美丽河向南漂去。它越过俄亥俄河岸和沃巴什河口，驶进宽阔湍急的密西西比河。金色水流托着船身，阿卡迪亚船夫一桨一桨划向前方。
        - id: ch01-b02
          speaker: narrator
          text: |-
            船上载着一群流亡者。那个遇难的民族早已散落在漫长的海岸，他们就像从沉船上漂下的一叶木筏，如今又聚在一起。共同的信仰和苦难，把男人、女人和孩子紧紧连在一处。他们听着零星传闻，抱着希望，去找自己的亲人。那些人也许正在阿卡迪亚人聚居的海岸耕种几英亩田地，也许住在美丽的奥珀卢萨草原。
        - id: ch01-b03
          speaker: narrator
          text: |-
            伊凡吉林也在船上，由费利西安神父一路引领。他们越过水下的沙洲，穿过森林阴沉的荒野。白天，船沿着汹涌的河水漂流。夜晚，众人就在岸边燃起篝火，露宿歇息。
        - id: ch01-b04
          speaker: narrator
          text: |-
            有时，急流带着他们冲过狭窄的水道，绕过一座座青翠的小岛。棉白杨的树冠轻得像羽毛，点着头投下浓荫。有时，他们驶进开阔的潟湖。银白沙洲躺在水中，细浪沿着沙洲边缘起伏。大群鹈鹕披着雪白羽毛，在浅水里慢慢走过。
        - id: ch01-b05
          speaker: narrator
          text: |-
            两岸地势渐渐平坦。楝树的阴影下，繁茂花园里立着种植园主的宅邸，周围还有黑奴的小屋和鸽舍。长夏不去的南方已经不远了。密西西比河穿过黄金海岸，又从香橙和枸橼的树林间庄严转向东方。
        - id: ch01-b06
          speaker: narrator
          text: |-
            大船跟着转了方向，驶进普拉克明河汊，很快就迷失在迟缓曲折的水道中。条条水路伸向四面八方，好像一张钢铁织成的网。高大幽暗的柏树在头顶合拢，搭起昏黑的穹顶。垂悬的苔藓在半空飘动，就像古老大教堂墙上的旗幡。
        - id: ch01-b07
          speaker: narrator
          text: |-
            四周静得像死亡。只有黄昏归巢的苍鹭，或向月亮发出恶魔般笑声的猫头鹰，偶尔会把寂静打破。月光却美得出奇。它在水上闪烁，照亮柏树和雪松的巨柱，又穿过枝叶穹顶的裂隙，像从废墟的石缝中漏下来。
        - id: ch01-b08
          speaker: narrator
          text: |-
            眼前的一切朦胧、陌生，像一场梦。众人既惊叹，又悲伤，心里压着一种看不见、说不清的凶兆。草原上的马蹄还在远处，前方含羞草的叶子就已合拢。命运也是这样。厄运还没落下，心已听见它的蹄声，害怕得缩紧了。
        - id: ch01-b09
          speaker: narrator
          text: |-
            可伊凡吉林仍有一个幻影支撑着。那是她心中的念头化成的形影，依稀飘在眼前，在月光里招手。加布里埃尔仿佛刚走过这些黑暗长廊。船桨每划一下，她就觉得自己离他更近一点。
    - id: ch02
      title: 午夜的号声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            一名桨手离开座位，走到船头。他猜想，也许还有和他们一样的人在这片午夜的幽暗水道上航行，便举起号角，吹出一声长鸣。
        - id: ch02-b02
          speaker: narrator
          text: |-
            号声狂野地穿过黑暗的柱廊和枝叶回廊，揭开沉默的封印，叫森林发出了声音。头顶的苔藓旗幡无声摆动，像在随着号声起伏。无数回声从水面和震响的枝桠下醒来，又渐渐死在远处。
        - id: ch02-b03
          speaker: narrator
          text: |-
            可黑暗里没有任何回应。等最后一缕回声也消失了，留下的寂静竟叫人觉得疼痛。
        - id: ch02-b04
          speaker: narrator
          text: |-
            后来，伊凡吉林睡着了。船夫们仍在午夜划桨。他们一阵沉默，一阵又唱起熟悉的加拿大船歌，那些歌，他们从前也曾在故乡阿卡迪亚的河上唱过。整夜都有神秘声响从荒野深处传来。那声音遥远又模糊，像林中的风，也像林中的浪，其中还混着鹤的高唳和凶猛短吻鳄的咆哮。
    - id: ch03
      title: 树下的梦
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            第二天还不到正午，大船便驶出了重重阴影。阳光把阿查法拉亚的湖群染成金色。船桨划过，水面微微起伏，无数睡莲随波摇荡。灿烂的莲花高高举着金色花冠，越过船夫们的头顶。
        - id: ch03-b02
          speaker: narrator
          text: |-
            木兰花的香气混着正午热气，让空气也变得慵懒。无数林木茂盛的小岛从船边经过，岛上密密围着盛放的蔷薇花篱，又香又静，仿佛在请人睡上一觉。众人终于在最美的一座岛边停了桨，把船牢牢系在岸旁的沃希托柳树下。
        - id: ch03-b03
          speaker: narrator
          text: |-
            他们彻夜劳作，早已疲惫，便散卧在草地上睡着了。一株高大的雪松在上方张开穹隆般的树冠。凌霄花和葡萄藤从粗壮枝臂上垂下来，长长的藤蔓好像雅各梦中的天梯。迅捷的蜂鸟就是梯上的天使，在摇晃的阶梯间忽上忽下，从一朵花飞向另一朵花。
        - id: ch03-b04
          speaker: narrator
          text: |-
            伊凡吉林睡在树下，梦里也看见了这番景象。她心中满是爱。一座正在开启的天国透出曙光，用圣洁境界的荣光照亮了她沉睡的灵魂。
    - id: ch04
      title: 擦肩而过
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            就在无数岛屿之间，一叶轻快的小船飞驰而来，越来越近。猎人和捕兽人用强壮的手臂奋力划桨。船头朝北，驶向野牛与河狸出没的土地。
        - id: ch04-b02
          speaker: narrator
          text: |-
            舵边坐着一个青年。他低头沉思，满脸憔悴，蓬乱的黑发遮着额头。那张脸上的忧伤，远远超过了他的年纪。他就是加布里埃尔。长久等待让他疲倦，他既不幸，又无法安宁，只想走进西部荒野，忘掉自己，也忘掉悲伤。
        - id: ch04-b03
          speaker: narrator
          text: |-
            小船贴着岛屿背风的一侧飞快驶过，却和流亡者停船的地方隔着对岸，又被一片棕榈丛挡住。猎人们没看见柳树下藏着的船。桨叶击水，也没有惊醒熟睡的人。没人发现他们，那里也没有上帝的天使唤醒沉睡的少女。
        - id: ch04-b04
          speaker: narrator
          text: |-
            加布里埃尔的小船飞快远去，像一片云影掠过草原。直到桨柄敲击桨架的声音消失在远处，睡着的人才像从魔法织成的梦里醒来。伊凡吉林叹了口气，向慈祥的神父说出心里的感觉。
        - id: ch04-b05
          speaker: evangeline
          text: |-
            费利西安神父，我心里有个声音，说加布里埃尔就在附近。可这会不会只是个傻梦，是我在胡思乱想？还是刚才真有一位天使从这里经过，把真相告诉了我的心？
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: |-
            说到这里，她脸红了，又责怪起自己的幻想。
        - id: ch04-b07
          speaker: evangeline
          text: |-
            唉，我怎么这么容易就信了这些念头。这样的话，您听来一定毫无意义。
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: |-
            可费利西安神父微笑着回答她。
        - id: ch04-b09
          speaker: felician
          text: |-
            女儿，你的话不是空想，对我也并非毫无意义。感情藏得很深，又安安静静。浮到表面的言语，就像水上摇动的浮标，让人知道锚沉在哪里。
          emotion: calm
        - id: ch04-b10
          speaker: felician
          text: |-
            所以，相信你的心吧，也相信世人说的那些幻觉。加布里埃尔确实离你很近。往南走不远，泰什河岸上就是圣莫尔和圣马丁。
          emotion: calm
        - id: ch04-b11
          speaker: felician
          text: |-
            漂泊已久的新娘会在那里重新见到新郎。离乡已久的牧人，也会找回他的羊群和羊圈。那地方有草原，也有果树林，美得很。脚下处处是鲜花，头顶是最蓝的天空。苍穹弯下来，就落在森林围成的墙上。那里的人称它为“路易斯安那的伊甸园”。
          emotion: calm
    - id: ch05
      title: 驶入泰什河
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            这番安慰让众人重新起身，继续赶路。黄昏轻柔地降临。西边地平线上的太阳像一位魔法师，把金色魔杖伸过大地。闪亮的雾气升了起来，天空、水面和森林仿佛被轻轻一点，便一同燃烧、熔化，最后交融在一起。
        - id: ch05-b02
          speaker: narrator
          text: |-
            小船划着滴水的桨，浮在一动不动的河面。水天相映，它仿佛成了一朵镶着银边的云，悬在两个天空之间。伊凡吉林心里有一种说不出的甜蜜。那魔法也碰到了她，感情的圣泉亮起爱的光，正像周围的天空和河水。
        - id: ch05-b03
          speaker: narrator
          text: |-
            忽然，附近树丛里传来嘲鸫的歌声。这个最狂放的歌者站在高悬水面的柳枝上，随着枝条轻轻摇荡。小小的喉咙里涌出一阵又一阵令人沉醉的音乐，天空、树林和水波仿佛全都安静下来，侧耳听它歌唱。
        - id: ch05-b04
          speaker: narrator
          text: |-
            歌声起初哀婉凄切，接着越飞越高，近乎疯狂，像在追赶，又像在引领酒神女信徒狂乱的舞步。随后，只剩一个个孤零零的音，低低诉说悲伤。最后，嘲鸫把所有声音聚到一起，带着嘲弄抛向四方。那就像暴风雨过后，一阵风吹过树梢，把残留的雨珠摇落，晶莹的水滴在枝头噼啪作响。
        - id: ch05-b05
          speaker: narrator
          text: |-
            就在这样的歌声里，众人心潮起伏，缓缓驶入泰什河。河水穿过青翠的奥珀卢萨。琥珀色的空气中，他们看见一户人家的炊烟越过林梢，笔直升起。前方传来了号角声，还有远处牛群低沉的哞叫。
