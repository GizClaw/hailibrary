  chapters:
    - id: ch01
      title: Part the Second, II
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            It was May. Far down the Beautiful River, beyond the Ohio shore and the mouth of the Wabash, a heavy boat entered the broad, swift, golden Mississippi. Acadian boatmen pulled at the oars.

            Their passengers were exiles, like one raft left from the wreck of a nation. Men, women, and children had been scattered along the coast. Now a shared faith and a shared sorrow held them together. Hope and rumor led them onward. They were searching for family among the small farms of the Acadian coast and across the prairies of Opelousas.

            Evangeline traveled with them, guided by Father Felician. Day after day, their boat crossed sunken sands and followed the troubled river through dark forests. Each night, they camped beside the water and built bright fires.

            At times the current swept them through rushing channels among green islands, where cotton trees nodded their shadowy crowns. Then the waterways opened into wide lagoons. Silver sandbars lay in the water, and great flocks of pelicans waded along the rippling edge, their white feathers shining like snow.
        - id: ch01-b02
          speaker: narrator
          text: |-
            The land became level. Planters' houses stood along the banks in rich gardens shaded by china trees, with cabins and dovecotes nearby. The travelers were drawing close to the country of endless summer. Here the river curved grandly east through the Golden Coast and groves of orange and citron.

            The boat turned too. It entered the Bayou of Plaquemine and was soon lost among slow, twisting waterways that spread in every direction like a net of steel.

            High overhead, the dark branches of cypress trees met in a dusky arch. Long mosses hung in the air and waved like banners on the walls of an ancient cathedral. The silence seemed as still as death. Only a heron returning to its cedar roost at sunset, or an owl greeting the moon with a wild laugh, broke the quiet.

            Moonlight glanced across the water and shone on the columns of cypress and cedar that held up those shadowy arches. It slipped through gaps in the branches as light slips through a ruined roof. Everything around the travelers seemed strange, dim, and dreamlike. Wonder and sadness came over them, along with a dark warning they could feel but could not understand.

            On a prairie, a mimosa closes its leaves before a horse has reached it. In the same way, the heart can shrink at the distant hoofbeats of fate before the blow itself arrives.

            Yet a vision kept Evangeline strong. It floated faintly before her and called her onward through the moonlight. Her own thoughts had given the vision shape. Gabriel had passed through these shadowy aisles before her, and every pull of the oars was bringing her nearer to him.
        - id: ch01-b03
          speaker: narrator
          text: |-
            Then one of the boatmen rose from his place at the prow. If other exiles happened to be sailing those dark waters at midnight, this would be his signal. He lifted a bugle and blew.

            The blast ran wild through the forest's leafy halls and broke the seal of silence. It seemed to give the woods a voice. Above the boat, the hanging banners of moss stirred soundlessly to the music. Countless echoes woke across the water and beneath the ringing branches. One by one, they faded into the distance.

            No voice answered. Nothing came back from the darkness. Once the last echo died, the silence itself felt painful.

            Evangeline fell asleep. The boatmen kept rowing through the middle of the night. Sometimes they were quiet. Sometimes they sang the old Canadian boat songs they had once sung on the rivers of Acadie. All around them came the mysterious sounds of the wilderness. Far away, something murmured like waves, or like wind moving through a forest. The whoop of a crane rose among those sounds, along with the roar of a grim alligator.
        - id: ch01-b04
          speaker: narrator
          text: |-
            Before the next noon, they came out of the shadows. Ahead, the lakes of the Atchafalaya lay under the golden sun. Thousands of water lilies rocked in the small waves made by the oars. Above the boatmen's heads, the splendid lotus lifted its golden crown.

            The warm air was heavy with the scent of magnolia blossoms. Countless wooded islands rose from the water. Flowering rose hedges covered them so thickly that each shore seemed to invite the tired travelers to sleep.

            At last the weary oars stopped beside the loveliest island. The boat was tied safely under the branches of Wachita willows at the water's edge. Worn out by their work through the night, the travelers lay across the grass and slept.

            A vast cedar spread high above them. Trumpet flowers and grapevines swung from its great limbs, hanging down like Jacob's ladder. Hummingbirds became the angels on that ladder. They darted up and down its swaying steps, from one blossom to another.

            As Evangeline slept beneath the tree, this was the vision she saw. Her heart was full of love. In her dreams, the dawn of an opening heaven lit her soul with the glory of a world above.
        - id: ch01-b05
          speaker: narrator
          text: |-
            All the while, a light, swift boat was darting among the many islands. The strong arms of hunters and trappers drove it quickly over the water. Its prow pointed north, toward the country of bison and beaver.

            A young man sat at the helm. His face was thoughtful and worn with care. Dark, neglected hair fell across his forehead, and he carried a sadness deeper than his years.

            It was Gabriel. He had grown tired of waiting. Restless and unhappy, he was going into the western wilderness, hoping to forget himself and his sorrow.

            His boat swept close beside the island, but it passed along the opposite shore. A screen of palmettos hid Evangeline's boat where it lay among the willows. The sleepers neither saw Gabriel nor stirred at the beat of his oars. No angel of God came to wake the sleeping maiden.

            The swift boat slipped away like the shadow of a cloud crossing the prairie. Soon even the sound of its oars against the thole pins had vanished in the distance.
        - id: ch01-b06
          speaker: narrator
          text: |-
            Then the travelers woke as if a spell had broken. Evangeline turned to the kindly priest and sighed.
        - id: ch01-b07
          speaker: evangeline
          text: |-
            Oh, Father Felician, my heart keeps telling me Gabriel is wandering somewhere near me. Is that only a foolish dream? Am I letting myself believe something that isn't there? Or did an angel pass by and show my spirit the truth?
        - id: ch01-b08
          speaker: narrator
          text: Evangeline blushed before she added one more thought.
        - id: ch01-b09
          speaker: evangeline
          text: |-
            Ah, I know how easily I believe what I hope for. To someone like you, these words must mean nothing.
        - id: ch01-b10
          speaker: narrator
          text: Father Felician smiled as he answered her.
        - id: ch01-b11
          speaker: father_felician
          text: |-
            Daughter, your words are not foolish, and they do mean something to me. Our deepest feelings lie quiet within us. The words that rise to the surface are like a buoy tossing on the water. They show us where the anchor is hidden below.

            So trust your heart, and trust what the world calls illusions. Gabriel truly is near you. Not far south of here, along the banks of the Têche, stand the towns of Saint Maur and Saint Martin. There, the bride who has wandered so long will find her bridegroom again. There, the pastor who has been absent so long will find his flock and his fold.

            It is a beautiful country, filled with prairies and orchards. Flowers make a garden beneath your feet, and the bluest heaven bends overhead until its dome seems to rest upon the forest walls. The people who live there call it the Eden of Louisiana.
          emotion: calm
        - id: ch01-b12
          speaker: narrator
          text: |-
            These words gave them courage. They rose and continued on their journey.

            Evening came softly. From the western horizon, the sun reached across the land like a magician holding out a golden wand. Bright mists rose into the air. At the wand's touch, sky, water, and forest seemed to catch fire, then melt and mingle together.

            The boat floated on still water between two skies, like a silver-edged cloud suspended in the air. Its oars rose and fell, dripping.

            Evangeline's heart filled with a sweetness she could not put into words. The beauty around her seemed to cast a spell. The sacred springs of feeling within her shone with love, just as the sky and water shone around the boat.

            Then a mockingbird began to sing from a thicket nearby. The wild little singer swung high on a willow branch over the water and poured out such a flood of music that the air, the woods, and the waves all seemed to grow silent and listen.

            At first, the notes were sad and pleading. Then they climbed into a frenzy, as if chasing or leading a wild dance. After that came single low notes of sorrow. The bird gathered every sound together and flung them out again in mockery. It was like a sudden gust after a storm, shaking a shower of clear, rattling rain from the treetops onto the branches below.

            With that song before them and their hearts beating with emotion, the travelers slowly entered the Têche, where it runs through the green land of Opelousas. Above the woodland, in the amber evening air, they saw a column of smoke rising from a house nearby. Then they heard the call of a horn and, far away, the lowing of cattle.
