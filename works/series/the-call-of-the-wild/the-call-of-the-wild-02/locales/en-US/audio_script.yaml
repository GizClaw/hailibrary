  chapters:
    - id: ch01
      title: "Chapter II. The Law of Club and Fang"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Buck's first day on the beach at Dyea felt like a nightmare. Every hour brought another shock or surprise. He had been torn out of the very heart of civilization and thrown into a world where everything was raw and primitive. This was nothing like his lazy, sun-warmed life at home, where he could loaf until he grew bored. Here, there was no peace, no rest, and not one moment of safety. Confusion and action surrounded him. At any instant, his body or his life might be in danger, so he had to stay alert. These were not town dogs or town men. They were savages, and they knew only the law of club and fang.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Buck had never seen dogs fight like these wolfish creatures. His first lesson was one he could never forget, though Curly suffered it in his place. If Buck had been the victim, he would not have lived to profit from what he saw. They were camped near the log store. In her friendly way, Curly approached a husky as large as a full-grown wolf, though only half her size. There was no warning. The husky flashed in, snapped his teeth with a hard, metallic click, and sprang away just as quickly. Curly's face was torn open from eye to jaw.
        - id: ch01-b03
          speaker: narrator
          text: >-
            That was the wolf's way of fighting. Strike, then leap clear. But there was more. Thirty or forty huskies hurried over and formed a silent, watchful ring around the two dogs. Buck did not understand their fixed attention or the hungry way they licked their mouths. Curly charged. Her enemy struck and dodged aside. When she rushed again, he met her with his chest in a strange move that knocked her from her feet. She never stood up again. That was what the watching dogs had waited for. They rushed in together, snarling and yelping, until Curly disappeared beneath a mass of bristling bodies. Her screams of pain came from underneath them.
        - id: ch01-b04
          speaker: narrator
          text: >-
            It happened so quickly that Buck could hardly take it in. He saw Spitz slip out his red tongue in his peculiar laughing way. Then François charged into the pack, swinging an axe, while three men beat at the dogs with clubs. Within two minutes of Curly's fall, they had driven off the last attacker. She lay lifeless on the bloody, trampled snow, nearly torn apart, while François stood above her and cursed.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The sight returned again and again to trouble Buck's sleep. So this was how things worked. There was no fair play. Once a dog went down, that was the end. Buck meant never to go down. Spitz laughed once more, and from that moment Buck hated him with a bitter hatred that would not die.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Before Buck recovered from Curly's terrible death, another shock came. François buckled him into a harness like the ones the grooms at home had put on horses. Then Buck was made to work as those horses had worked. He pulled François on a sled to the woods at the valley's edge and hauled a load of firewood back.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Being turned into a draft animal wounded Buck's pride, but he was too wise to rebel. He worked hard and did his best, though everything was strange. François was stern and used his whip to demand instant obedience. Dave, the experienced dog nearest the sled, nipped Buck's hindquarters whenever he made a mistake. Spitz led the team. When he could not reach Buck, he growled a sharp warning or pulled cleverly against the traces to jerk him into place.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Buck learned quickly from all three. Before they returned to camp, he knew to stop at "ho" and move at "mush." He knew to swing wide around bends and stay clear when the loaded sled came sliding downhill behind him.
        - id: ch01-b09
          speaker: francois
          text: >-
            Those are three very good dogs. That Buck can pull like the devil. I'll teach him as fast as any dog.
        - id: ch01-b10
          speaker: narrator
          text: >-
            François said this to Perrault. That afternoon, Perrault came back with two more dogs. He was in a hurry to begin carrying his dispatches. The newcomers were brothers named Billee and Joe, and both were true huskies. Yet they were as different as day and night. Billee was too good-natured for his own good. Joe was sour and withdrawn, always snarling and watching with a hateful eye.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Buck greeted them as comrades, and Dave ignored them. Spitz attacked one and then the other. Billee wagged his tail to make peace. When that failed, he tried to run and cried even while Spitz's teeth cut his side. Joe reacted very differently. Each time Spitz circled, Joe spun to face him. His mane stood up, his ears flattened, and his lips twisted back as his jaws snapped again and again. Fear made him ready to fight.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Joe looked so fierce that Spitz gave up trying to punish him. But Spitz did not want the other dogs to see that Joe had stopped him. To hide his defeat, he went after harmless Billee again and chased the whining dog all the way to the edge of camp.
        - id: ch01-b13
          speaker: narrator
          text: >-
            By evening, Perrault had found one more dog. Sol-leks was an old husky, long, lean, and gaunt, with a face scarred by many fights. He had only one eye. That eye flashed a warning of such strength and experience that every dog respected it. His name meant the Angry One. Like Dave, he asked for nothing, offered nothing, and expected nothing. He walked slowly and deliberately into the group, and even Spitz left him alone.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Sol-leks could not bear anyone coming near his blind side. Buck discovered that by accident. The old dog whirled and cut Buck's shoulder to the bone, leaving a wound three inches long. Buck never approached him from that side again, and they had no more trouble. Sol-leks seemed to want only what Dave wanted: to be left alone. Buck would later discover that both dogs had one other desire, and it mattered even more to them.
        - id: ch01-b15
          speaker: narrator
          text: >-
            That night, Buck had to solve the problem of sleep. A candle made the tent glow warmly in the white emptiness. Buck walked inside as if he belonged there, but Perrault and François drove him out with curses and flying cooking tools. Bewildered, he fled into the cold.
        - id: ch01-b16
          speaker: narrator
          text: >-
            A freezing wind bit him sharply, and it seemed to bite with special cruelty into his wounded shoulder. He tried lying on the snow and going to sleep, but the frost soon drove him, shivering, back to his feet. Cold, lonely, and miserable, he wandered among the many tents. Every place felt just as bitter as the last. Savage dogs rushed him now and then, but Buck raised the hair along his neck and snarled. He was learning fast, and they let him pass without attacking.
        - id: ch01-b17
          speaker: narrator
          text: >-
            At last, Buck decided to see how his teammates were managing. They had vanished. He searched the wide camp, came back, and searched again. They could not be inside the tent, or he would not have been thrown out. So where were they? Shivering, with his tail hanging low, he wandered around the tent.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Suddenly, the snow collapsed under his front paws, and he sank down. Something moved below him. Buck jumped back with his hair raised, snarling at what he could not see or understand. Then a small, friendly yelp calmed him, and he went back to investigate. A breath of warm air rose to his nose. Billee lay there, curled into a snug ball beneath the snow. He whined gently, squirmed and wriggled to show that he meant no harm, and even offered peace by licking Buck's face with his warm, wet tongue.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Here was another lesson. This was how they slept. Buck chose a place and dug his own hole, wasting plenty of effort as he learned. Soon his body warmed the small space, and he fell asleep. The day had been long and hard. He slept deeply and comfortably, though he growled, barked, and struggled with bad dreams.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Buck did not wake until the sounds of the stirring camp reached him. At first, he had no idea where he was. Snow had fallen through the night and buried him completely. Walls of it pressed in from every side, and a wild animal's fear of a trap swept over him. It was a sign that Buck was reaching backward through his own life and into the lives of his ancestors. He was a civilized dog, far too civilized to have met a trap himself. The fear could not have come from his own experience.
        - id: ch01-b21
          speaker: narrator
          text: >-
            His whole body tightened by instinct. The hair rose along his neck and shoulders. With a fierce snarl, he burst straight up into the dazzling day, throwing snow around him in a bright cloud. Before his paws touched the ground, he saw the white camp and remembered everything from his walk with Manuel to the hole he had dug the night before.
        - id: ch01-b22
          speaker: narrator
          text: >-
            François shouted at the sight of him.
        - id: ch01-b23
          speaker: francois
          text: >-
            What did I tell you? That Buck learns faster than anything!
        - id: ch01-b24
          speaker: narrator
          text: >-
            Perrault answered with a serious nod. He carried important dispatches for the Canadian government, so he needed the best dogs he could find. Having Buck pleased him greatly.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Within an hour, three more huskies joined the team, bringing the number to nine. Fifteen minutes later, they were harnessed and moving up the trail toward Dyea Canyon. Buck was glad to leave. The work was hard, but he found that he did not truly hate it. The whole team pulled with an eagerness that soon reached him too.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The change in Dave and Sol-leks surprised him even more. The moment they wore the harness, they seemed like different dogs. All their distant passiveness vanished. They became alert and energetic, deeply concerned that the work should go well. Anything that slowed the team through delay or confusion made them fiercely angry. Pulling in the traces seemed to be the fullest expression of their lives. It was what they lived for and the one thing that gave them joy.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Dave pulled nearest the sled. Buck was in front of him, then came Sol-leks. The other dogs stretched ahead in a single line, with Spitz in the lead. Buck had been placed between Dave and Sol-leks so they could teach him. He learned readily, and they taught him just as well. Their teeth corrected every mistake before it lasted long.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Dave was fair and wise. He never bit Buck without a reason, and he never failed to bite when Buck needed it. François and his whip supported the lesson, so Buck soon saw that changing his ways cost less than fighting back. During one short halt, Buck tangled the traces and delayed the start. Dave and Sol-leks both attacked him, making the tangle even worse. After that, Buck made certain the traces stayed clear.
        - id: ch01-b29
          speaker: narrator
          text: >-
            By the end of the day, Buck knew his work so well that the other dogs had almost stopped correcting him. François used the whip less often. Perrault even honored Buck by lifting each paw and carefully checking his feet.
        - id: ch01-b30
          speaker: narrator
          text: >-
            It was a hard day's journey. They climbed through the canyon, passed Sheep Camp and the Scales, and went beyond the timberline. They crossed glaciers and snowdrifts hundreds of feet deep, then passed over the great Chilcoot Divide. That forbidding ridge stood between salt water and fresh water. It rose like a guard at the entrance to the sad and lonely North.
        - id: ch01-b31
          speaker: narrator
          text: >-
            They made good time down a chain of lakes lying in the craters of dead volcanoes. Late that night, they reached the enormous camp at the head of Lake Bennett. Thousands of gold seekers were building boats there, preparing for the ice to break in spring. Buck dug his hole in the snow and slept the sound, heavy sleep of an exhausted dog who had earned his rest. But morning came far too soon. He was driven out into the cold darkness and harnessed beside his teammates once again.
        - id: ch01-b32
          speaker: narrator
          text: >-
            On a packed trail the next day, they covered forty miles. But on the days that followed, they had to break their own trail. They worked much harder and still traveled less distance. Perrault usually went ahead on webbed snowshoes, pressing down the snow to make the team's work easier. François guided the sled from the gee-pole and traded places with him only now and then. Perrault was in a hurry, and he took pride in his skill at reading ice. That knowledge was essential and could save them. The autumn ice was thin, and wherever the water ran swiftly, there was no ice at all.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Day after day, without any end in sight, Buck pulled in the traces. The team always broke camp in darkness. By the first gray light of dawn, they were already on the trail with fresh miles behind them. They always stopped and made camp after dark. Each dog ate his small piece of fish, then crawled beneath the snow to sleep before another day began.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Buck was always starving. His daily ration was a pound and a half of dried salmon, yet it seemed to fill nothing. The other dogs were smaller and had been born to this life. They received only a pound of fish apiece and stayed in good condition. Buck never had enough.
        - id: ch01-b35
          speaker: narrator
          text: >-
            The fussy habits of his old life quickly disappeared. Buck had always eaten slowly, but now the other dogs finished first and stole whatever he had left. He could not protect his food. While he fought off two or three thieves, the rest swallowed it. So he learned to eat as fast as they did. Hunger soon pushed him to take food that was not his.
        - id: ch01-b36
          speaker: narrator
          text: >-
            He watched and learned. Pike, one of the new dogs, was a clever thief who often pretended to be sick. Buck saw him steal a piece of bacon while Perrault's back was turned. The following day, Buck copied him and escaped with the entire chunk. The theft caused a great uproar, but no one suspected Buck. Dub, a clumsy dog who was forever being caught, received the punishment instead.
        - id: ch01-b37
          speaker: narrator
          text: >-
            That first theft showed that Buck could survive in the hostile North. He could change when the world around him changed. Without that ability, he would have died quickly and terribly. It also showed that his old sense of right and wrong was breaking apart. That old morality had become useless, even dangerous, in a merciless fight for life. In the South, where love and companionship ruled, a dog could respect another's property and feelings. Under the law of club and fang, any creature that still worried about such things was a fool and would not prosper.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Buck did not think any of this through. He was fit to survive, and without knowing it, he adjusted to his new life. In all his earlier days, he had never fled from a fight, no matter how badly the odds stood against him. But the club of the man in the red sweater had beaten a more basic and primitive law into him. When he was civilized, Buck might have died over a question of right and wrong, perhaps while defending Judge Miller's riding whip. Now his old civilization was falling away. He could leave that moral defense behind and save his own skin.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Buck did not steal because he enjoyed it. He stole because his stomach cried out for food. He did not rob anyone openly. Respect for club and fang taught him to move in secret and use his wits. He did these things because doing them had become easier than refusing to do them.
        - id: ch01-b40
          speaker: narrator
          text: >-
            His change came quickly. His muscles hardened like iron, and he grew used to ordinary pain. Inside and out, his body learned to waste nothing. He could eat anything, however foul or difficult to digest. Once he swallowed it, his stomach drew out the very last bit of nourishment. His blood carried that nourishment to the farthest parts of his body and built it into strong, tough flesh.
        - id: ch01-b41
          speaker: narrator
          text: >-
            His eyes and nose grew wonderfully sharp. His hearing became so keen that even in sleep, the faintest noise told him whether peace or danger was coming. When ice formed between his toes, he bit it out. When a thick crust covered the water hole, he reared up and smashed through with stiff front legs.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Most remarkable of all, Buck could smell a coming wind a full night before it arrived. The air might be perfectly still when he dug his bed beside a tree or bank. Yet when the wind rose later, it always found him on the sheltered side, warm beneath the snow.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Experience was not his only teacher. Instincts that had been dead for generations stirred awake. The long line of domesticated dogs seemed to fall away from him. In vague flashes, Buck remembered the youth of his kind, when wild dogs hunted in packs through the ancient forest and killed their prey as they ran it down.
        - id: ch01-b44
          speaker: narrator
          text: >-
            He learned the quick wolf's fight without effort. Cut, slash, and leap away. Forgotten ancestors had fought that way. Their old life woke inside him, and the tricks they had stamped into the blood of the breed became his own. They came without practice or discovery. They seemed to have belonged to him forever.
        - id: ch01-b45
          speaker: narrator
          text: >-
            On still, freezing nights, Buck lifted his nose toward a star and sent out a long, wolflike howl. Through him, ancestors long dead lifted their noses and howled down the centuries. His voice carried their rhythms and their sorrow. It spoke of what the rigid cold and darkness had meant to them.
        - id: ch01-b46
          speaker: narrator
          text: >-
            So the ancient song rose through Buck, and he came into his own again. It happened because men had found yellow metal in the North, and because Manuel was a gardener's helper whose wages could not cover the needs of his wife and many small children.
