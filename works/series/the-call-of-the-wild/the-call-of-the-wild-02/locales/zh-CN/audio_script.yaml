audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 生动沉稳，时刻留意逼近的危险
        timbre: 温暖浑厚，清晰有力
        pace: 从容有度
        pitch: 中音
    francois:
      display_name: 弗朗索瓦
      tts:
        delivery: 镇定能干，惜字如金
        timbre: 深沉平稳
        pace: 从容
        pitch: 低音
  chapters:
    - id: ch01
      title: 戴伊海滩的噩梦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            巴克来到戴伊海滩的第一天，就像掉进了一场醒不过来的噩梦。每过一会儿，又有新的意外让他震惊。他刚刚离开文明世界的中心，转眼就被扔进最原始的生活里。这里没有阳光下的清闲日子，没有安宁，没有休息，连片刻的安全也没有。四周处处混乱，人人都在行动，每一刻都可能伤筋动骨，甚至丢掉性命。
        - id: ch01-b02
          speaker: narrator
          text: >-
            巴克只能时时警醒。因为这里的人和狗都不是城里那些人和狗。他们全是野蛮者，只服从棍棒和獠牙定下的规矩。
        - id: ch01-b03
          speaker: narrator
          text: >-
            巴克从没见过狗像狼一样搏杀，而他第一次见识，就换来一个永远忘不了的教训。幸好，替他受这个教训的是柯莉。要是换成巴克自己，他根本活不到以后。
        - id: ch01-b04
          speaker: narrator
          text: >-
            当时，他们在木材商店附近扎营。柯莉天性友善，主动走近一条爱斯基摩犬。那条狗像成年狼一样高大，体重却不到柯莉的一半。它没有发出任何警告，忽然像闪电一样扑上去。牙齿咔嚓一响，它马上又跳开了。柯莉的脸却已经从眼角裂到了下巴。
        - id: ch01-b05
          speaker: narrator
          text: >-
            这就是狼的打法。扑上去咬，咬完立刻退开。可是，真正可怕的还在后面。三四十条爱斯基摩犬飞奔过来，围成一个安静的圆圈，目不转睛地盯着它们。那些狗急切地舔着嘴，巴克却还不懂它们在等什么。
        - id: ch01-b06
          speaker: narrator
          text: >-
            柯莉再次冲向对手，那条狗又咬一口，马上闪开。柯莉第二次扑来时，它用胸膛迎面一撞，动作十分古怪，却一下把柯莉掀翻在地。她再也没能站起来。围观的狗等的正是这一刻。它们龇着牙，尖叫着涌上去。柯莉痛苦地惨叫，很快就被压在无数毛发倒竖的身体下面。
        - id: ch01-b07
          speaker: narrator
          text: >-
            一切发生得太快，巴克完全呆住了。他看见斯匹茨伸出鲜红的舌头，那是斯匹茨嘲笑别人时的样子。他也看见弗朗索瓦挥起斧头，跳进那团疯狂的狗群。还有三个男人拿着棍棒冲来，帮他把狗赶散。
        - id: ch01-b08
          speaker: narrator
          text: >-
            两分钟后，最后一条袭击柯莉的狗终于被打退。柯莉却一动不动地躺在染血的雪上。雪地已经被踩烂，她也几乎被撕成碎片。弗朗索瓦守在旁边，愤怒地大声咒骂。
        - id: ch01-b09
          speaker: narrator
          text: >-
            后来，巴克常在梦里重新看见这一幕。现在他懂了。在这里，没有谁会跟你公平较量。只要倒下，一切就结束了。他绝不能让自己倒下。
        - id: ch01-b10
          speaker: narrator
          text: >-
            斯匹茨又伸出舌头笑了。从这一刻开始，巴克对他生出一股刻骨的仇恨。这仇恨再也没有熄灭。
    - id: ch02
      title: 挽具下的新生活
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            柯莉惨死带来的震惊还没过去，巴克又遇上了一件从未想过的事。弗朗索瓦把许多皮带和搭扣系到他身上。巴克认得这东西。过去在庄园里，马夫就是这样给马套挽具的。如今，轮到他像马一样干活了。
        - id: ch02-b02
          speaker: narrator
          text: >-
            巴克拉着雪橇，把弗朗索瓦送到山谷边的树林，再拖着一车木柴回来。被人当成挽畜，实在伤他的尊严。可他没有反抗，而是用足力气，尽量把陌生的活儿做好。
        - id: ch02-b03
          speaker: narrator
          text: >-
            弗朗索瓦很严厉。他一声令下，巴克必须马上照办，手里的鞭子也保证命令不会落空。戴夫是经验丰富的后橇狗。巴克只要出错，它就从后面咬他的腿。领队犬斯匹茨够不着巴克时，便厉声低吼着责备他，有时还猛压挽绳，把他扯回正确的方向。
        - id: ch02-b04
          speaker: narrator
          text: >-
            巴克学得很快。两个伙伴教他，弗朗索瓦也教他。还没回到营地，他已经知道什么时候停，什么时候走。转弯要绕开一些，下坡时还得及时避让，不能让满载的雪橇从背后撞上后橇狗。
        - id: ch02-b05
          speaker: francois
          text: 三条狗都顶呱呱。这个巴克，拉起来真有劲！我很快就能把他教会。
        - id: ch02-b06
          speaker: narrator
          text: >-
            弗朗索瓦把这话告诉佩罗。到了下午，佩罗又领回两条爱斯基摩犬。它们是一对兄弟，名叫比利和乔，性情却完全相反。比利好得过了头，乔却总是独来独往，一脸凶相，眼里还带着恶意。
        - id: ch02-b07
          speaker: narrator
          text: >-
            巴克友好地迎接它们，戴夫看都不看。斯匹茨却冲上去，先揍这个，再揍那个。比利摇着尾巴求和，发现没有用，便转身逃跑。斯匹茨的尖牙划破它的腰，它惨叫起来，却还在向对方示好。
        - id: ch02-b08
          speaker: narrator
          text: >-
            乔可不一样。斯匹茨不管绕到哪里，它都立刻转身，始终正面对着敌手。它竖起鬃毛，耳朵压向脑后，嘴里不断咆哮。上下牙飞快碰撞，眼睛闪着凶狠的光。那副模样就是恐惧和好斗混在一起，连斯匹茨也不敢再教训它。为了遮住自己的难堪，斯匹茨只好掉头追赶可怜的比利，把它一直赶到营地边缘。
        - id: ch02-b09
          speaker: narrator
          text: >-
            傍晚，佩罗又带回一条年老的爱斯基摩犬。它又瘦又长，脸上伤痕累累，只剩一只眼睛。那只独眼里的警告，足以让任何对手尊重它。它叫索尔莱克斯，名字的意思是“愤怒者”。
        - id: ch02-b10
          speaker: narrator
          text: >-
            索尔莱克斯像戴夫一样，不向谁索取，也不给谁什么，只求大家别来打扰。它慢慢走进狗群，连斯匹茨也决定让它清静。不过，它不许任何人靠近自己瞎眼的那一侧。巴克无意间犯了这个忌讳，索尔莱克斯猛地回头，在他肩上撕开一道三英寸长、深可见骨的伤口。
        - id: ch02-b11
          speaker: narrator
          text: >-
            从此，巴克总是避开它的盲区，再也没跟它发生冲突。他以为索尔莱克斯和戴夫活着只为独处。后来他才知道，它们心里还有一个更强烈的愿望。
    - id: ch03
      title: 雪下的床与雪上的路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            那天夜里，巴克不得不解决一个大问题。他要在哪里睡觉？白色荒原中央，帐篷透出温暖的烛光。巴克自然地走进去，佩罗和弗朗索瓦却一边咒骂，一边把炊具朝他扔过来。他吓了一跳，只好狼狈地逃回严寒里。
        - id: ch03-b02
          speaker: narrator
          text: >-
            冷风撕咬着巴克，受伤的肩头尤其疼。他卧在雪上，想就这样睡去，可严霜很快又把他冻得浑身发抖。巴克孤苦伶仃地在帐篷之间游荡，哪里都一样冷。偶尔有野狗朝他扑来，他就竖起颈毛，发出低吼。这个办法很管用，对方不再纠缠。
        - id: ch03-b03
          speaker: narrator
          text: >-
            巴克忽然想起自己的伙伴，便回去看看它们如何过夜。奇怪的是，狗全都不见了。他找遍营地，又回到帐篷旁边。它们绝不会在帐篷里，那它们究竟躲到了哪里？他垂着尾巴，冻得不停哆嗦，只能一圈圈乱走。
        - id: ch03-b04
          speaker: narrator
          text: >-
            突然，巴克前脚下的雪塌了，底下还有东西在动。他吃了一惊，跳到一旁，竖着毛大声咆哮。接着，雪下传出一声友善的轻叫。他小心走回去，先闻到一股暖气，然后看见比利正舒舒服服地蜷在雪窝里。
        - id: ch03-b05
          speaker: narrator
          text: >-
            比利低低叫着，扭动身体表示友好，甚至用温热的舌头舔巴克的脸，想让他放心。巴克又学到一课。原来这里的狗是这样睡觉的。
        - id: ch03-b06
          speaker: narrator
          text: >-
            他选好地方，也给自己挖起雪洞。虽然忙得乱七八糟，还白费许多力气，总算挖成了。没过多久，体温便让小小的洞穴暖起来。漫长而艰苦的一天终于结束，巴克沉沉睡去。只是噩梦仍在追赶他，让他不时低吼、吠叫，还在梦中挣扎。
        - id: ch03-b07
          speaker: narrator
          text: >-
            第二天，营地苏醒的声音把他吵醒。夜里下过雪，他已经被完全埋住。四面的雪墙压紧身体，一种野兽掉进陷阱时才有的恐惧猛然攫住了他。巴克从没见过陷阱。这份恐惧不属于他亲身的记忆，而是从祖先的生命深处传来的。
        - id: ch03-b08
          speaker: narrator
          text: >-
            他全身肌肉突然绷紧，颈背上的毛全都竖起。随着一声凶猛的咆哮，巴克笔直向上跃起，冲进刺眼的白昼。积雪在周围炸开，像一片闪亮的云。还没落地，他就看清了白色的营地，也记起从曼纽尔带他离家，到昨晚挖下雪洞为止的全部经历。
        - id: ch03-b09
          speaker: francois
          text: 我说得没错吧？这个巴克，不管什么都学得飞快。
        - id: ch03-b10
          speaker: narrator
          text: >-
            弗朗索瓦大声招呼巴克，又转头对佩罗喊出这句话。佩罗严肃地点点头。他是加拿大政府的信使，身上带着重要公文，一心想找到最出色的狗。巴克归他所有，实在让他高兴。
        - id: ch03-b11
          speaker: narrator
          text: >-
            一个小时内，队里又添了三条狗，总数变成九条。不到一刻钟以后，它们已套好挽具，沿着小道朝戴伊峡谷前进。巴克很高兴离开营地。拉橇虽然辛苦，他却并不怎么讨厌。整支队伍都急切地想往前跑，那股劲头很快也传给了他。
        - id: ch03-b12
          speaker: narrator
          text: >-
            更让巴克惊讶的是戴夫和索尔莱克斯。挽具一套上，它们就完全变了。平日的冷淡消失得干干净净，两条狗都变得警醒而积极，一心要把工作做好。谁拖延了队伍，谁把场面弄乱，它们就会暴躁地发火。拉动挽绳就是它们活着的最高意义，也是它们唯一真正喜欢的事。
        - id: ch03-b13
          speaker: narrator
          text: >-
            戴夫紧挨雪橇，是队里的后橇狗。巴克在它前面，接着是索尔莱克斯。其余的狗一条接一条排向前方，斯匹茨站在最前面领队。巴克被夹在两个老手之间，就是为了随时受它们指点。
        - id: ch03-b14
          speaker: narrator
          text: >-
            巴克学得快，老师也教得严。戴夫不会平白无故咬他，可该咬的时候一次也不放过。弗朗索瓦的鞭子又在后面支持戴夫，所以巴克很快明白，改掉错误总比回头打架省事。
        - id: ch03-b15
          speaker: narrator
          text: >-
            一次短暂休息时，巴克把挽绳缠在一起，耽误了出发。戴夫和索尔莱克斯立刻一齐扑来，结结实实地揍了他一顿。绳子一时缠得更乱，可从那以后，巴克再也不让挽绳打结。那天结束前，他已经熟练到同伴不再挑错。弗朗索瓦很少挥鞭了，佩罗甚至亲手抬起他的四只脚，一只只仔细检查。
        - id: ch03-b16
          speaker: narrator
          text: >-
            那一天的路非常难走。他们穿过戴伊峡谷和绵羊营地，经过磅秤地和林木线，越过冰川与几百英尺深的雪堆，然后翻过奇尔库特分水岭。那道高岭隔开咸水和淡水，冷冷守着凄凉的北方。
        - id: ch03-b17
          speaker: narrator
          text: >-
            狗队沿着一连串湖泊飞快前进，那些湖填在早已熄灭的火山口里。深夜，他们抵达本内特湖源头的大营地。数千名淘金客在那里造船，等春天冰层开裂后使用。巴克钻进自己挖的雪窝，像一个辛苦一天、问心无愧的劳动者那样沉沉睡去。可是天还没亮多久，他又被赶进寒冷的黑暗，和伙伴一起套上挽具。
    - id: ch04
      title: 饥饿教会的事
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            第一天的道路已经踩实，他们走了四十英里。第二天开始，接连许多天，他们都得自己踩出路来。活儿更重，速度反而更慢。大多数时候，佩罗穿着网状雪鞋走在前面，把松雪踏实，让狗队好走一些。弗朗索瓦扶着雪橇的转向杆，偶尔才跟他交换位置。
        - id: ch04-b02
          speaker: narrator
          text: >-
            佩罗急着赶路，也为自己懂得冰层而自豪。这本领关系着每个人的性命。秋天的冰还很薄，水流急的地方，水面上甚至没有冰。
        - id: ch04-b03
          speaker: narrator
          text: >-
            日子一天天过去，仿佛永远没有尽头。巴克一直在挽绳下苦干。队伍摸黑拔营，天边刚泛出灰白，他们已走在路上，把一段段路抛在身后。晚上扎营时，天也早就黑了。狗吃掉分到的一点鱼，便钻进雪里睡觉。
        - id: ch04-b04
          speaker: narrator
          text: >-
            巴克总是饿得厉害。每天一磅半晒干鲑鱼，吃进肚子仿佛什么也没吃。他从来没有饱过，饥饿不停折磨着他。别的狗身量小，又生来习惯这样的生活，每天只吃一磅鱼，身体却仍然很好。
        - id: ch04-b05
          speaker: narrator
          text: >-
            巴克很快不再像过去那样挑剔。以前，他总是慢慢吃。现在，同伴们先把自己的口粮吞完，马上来抢他的。他赶开两三条狗时，剩下的已经把食物吃光。于是，他也学着狼吞虎咽。
        - id: ch04-b06
          speaker: narrator
          text: >-
            饥饿还逼他开始拿不属于自己的东西。巴克仔细观察，也照着学习。新来的派克很会装病，更是个聪明的小偷。佩罗一转身，它便悄悄偷走一片咸肉。第二天，巴克用了同样的办法，直接叼走了整块肉。
        - id: ch04-b07
          speaker: narrator
          text: >-
            营地里顿时闹成一团，却没有谁怀疑巴克。杜布笨手笨脚，做坏事总会被抓住，结果这一次又替巴克受了罚。
        - id: ch04-b08
          speaker: narrator
          text: >-
            这第一次偷窃证明，巴克已经能够在充满敌意的北方活下去。他懂得随着环境改变自己。要是做不到，死亡很快就会找上门来，而且一定十分可怕。
        - id: ch04-b09
          speaker: narrator
          text: >-
            这也说明，巴克过去的道德正在破碎。在无情的生存搏斗里，那些道德帮不了他，反而成了累赘。在南方，人们按照关爱和情谊生活，尊重别人的东西，也顾及别人的感受。可是在北方，棍棒和獠牙才是法律。谁还一心遵守南方的规矩，谁就是傻瓜，也别想过得好。
        - id: ch04-b10
          speaker: narrator
          text: >-
            巴克当然没有真的想过这些道理。他只是天生适合活下去，所以不知不觉改变了自己。过去，不管对手多强，他从来没有逃过。可是红毛衣男人曾用棍棒，把更古老、更根本的规矩打进他的身体。
        - id: ch04-b11
          speaker: narrator
          text: >-
            在文明世界里，巴克或许会为守住米勒法官的马鞭而死。现在，他却能抛开这样的道义，让自己先活下来。文明从他身上剥落得如此彻底，这就是证据。
        - id: ch04-b12
          speaker: narrator
          text: >-
            巴克偷东西，不是因为偷窃好玩，而是因为肚子饿得不停叫。他也不敢公开去抢，只会隐秘而聪明地下手。因为他已经懂得敬畏棍棒，也敬畏獠牙。简单说，他做这些事，只因为做了比不做更容易活下去。
    - id: ch05
      title: 古老的歌
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            巴克的成长很快，要说那是一种退化，也同样没有错。他的肌肉变得像铁一样硬，寻常的疼痛已经不能把他怎样。他也学会节省身体内外的每一分力量。
        - id: ch05-b02
          speaker: narrator
          text: >-
            不管食物多么难吃，多么不好消化，巴克都能吞下去。胃会从里面榨出最后一点养分，血再把养分送到身体的每个角落，让那里长出最强韧的筋肉。他看得更清，闻得更远，耳朵也灵敏得惊人。即使睡着了，他也听得到最微弱的动静，还知道那声音带来的是平安还是危险。
        - id: ch05-b03
          speaker: narrator
          text: >-
            脚趾之间结了冰，他就用牙咬掉。水洞冻上厚冰，他便直起身子，用僵直的前腿把冰砸开。最特别的本领，是他能从空气里闻出风的消息，早在前一夜就猜到风向。不管挖雪窝时四周多么平静，夜里风真的吹来，总会发现巴克已经躺在背风处，睡得隐蔽又暖和。
        - id: ch05-b04
          speaker: narrator
          text: >-
            巴克不只会从亲身经历中学习。那些死去很久的本能，也一个接一个醒来了。一代代驯养留下的痕迹从他身上脱落，他隐约记起这个种族最早的岁月。那时，野狗成群穿过原始森林，一路追上猎物，杀死它们，再用猎物填饱肚子。
        - id: ch05-b05
          speaker: narrator
          text: >-
            所以，巴克毫不费力就懂得该怎样扑上去撕咬，怎样迅速躲开，又怎样像狼一样，用敏捷的牙齿反击。他被遗忘的祖先就是这样战斗的。它们在他身体里唤醒古老的生命，那些刻进整个种族血脉的技巧，也自然变成了巴克自己的技巧。他不必尝试，不必寻找，仿佛从出生起就会这一切。
        - id: ch05-b06
          speaker: narrator
          text: >-
            寒冷而安静的夜里，巴克会抬起鼻子，对准一颗星，像狼那样久久嗥叫。那其实是早已死去、化成尘土的祖先。它们同样仰鼻向星，穿过漫长的世纪，借巴克的喉咙发出声音。
        - id: ch05-b07
          speaker: narrator
          text: >-
            巴克嗥叫的音调，也正是它们的音调。那声音诉说着祖先的悲哀，也唱出僵硬、严寒和黑暗对它们意味着什么。
        - id: ch05-b08
          speaker: narrator
          text: >-
            就这样，那首古老的歌在巴克身体里涌起，仿佛提醒人们，生命不过是一个被线牵动的偶人。巴克重新找回了本来属于自己的一切。
        - id: ch05-b09
          speaker: narrator
          text: >-
            而这一切之所以发生，只因为人们在北方发现了黄色的金属，也因为曼纽尔只是一个园丁帮工。他挣来的钱，养活妻子和那一大群长得像他的小家伙以后，再也剩不下什么。
