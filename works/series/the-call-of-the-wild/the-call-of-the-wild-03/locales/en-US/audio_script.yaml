audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: vivid, steady, and attentive to danger
        timbre: warm and resonant
        pace: measured
        pitch: medium
    perrault:
      display_name: Perrault
      tts:
        delivery: animated, shrewd, and warmly accented
        timbre: lean and lively
        pace: brisk
        pitch: medium-high
    francois:
      display_name: François
      tts:
        delivery: calm, capable, and economical
        timbre: deep and steady
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: "Chapter III. The Dominant Primordial Beast"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The dominant primordial beast was strong deep within Buck, and the fierce life of the trail made it stronger through every hard day and bitter night. Yet the change stayed hidden. His new cunning gave him patience and control. He was still too busy learning this life to feel at ease. He did not look for fights, and whenever he could, he avoided them. He had stopped acting in haste. Even with all the hatred between him and Spitz, he waited and gave his enemy no excuse.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Spitz did the opposite. Perhaps he sensed a dangerous rival in Buck. He showed his teeth whenever he could and went out of his way to bully him, always trying to start the fight that could end only with one of them dead. That fight might have happened early in the journey if a strange accident had not stopped it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One evening they made a miserable camp beside Lake Le Barge. Snow drove through the darkness, and the wind cut like a white-hot knife. They had to feel their way to a camping place, and they could hardly have chosen worse. A sheer wall of rock rose behind them. Perrault and François had to build their fire and spread their sleeping robes on the lake ice. They had left the tent at Dyea to lighten the load. A few pieces of driftwood gave them a fire, but it melted down into the ice, so they ate supper in darkness.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Buck dug a warm, snug nest close beneath the sheltering rock. He hated to leave it when François handed out the fish he had thawed over the fire. But Buck ate his share, and when he came back, another dog was in his nest. A warning growl told him it was Spitz.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Until then, Buck had kept out of trouble with his enemy. This was too much. The beast inside him roared, and he sprang. His fury surprised them both, especially Spitz. Everything Spitz had seen before had made him think Buck was timid and survived only because of his great size and weight.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The dogs burst from the ruined nest in a twisting heap. François saw them and understood at once why they were fighting.
        - id: ch01-b07
          speaker: francois
          text: "Ah! Give it to him, Buck! Give it to that filthy thief!"
        - id: ch01-b08
          speaker: narrator
          text: >-
            Spitz wanted the fight just as badly. He cried with rage and eagerness as he circled, looking for a chance to leap. Buck circled too. He was every bit as eager, but he stayed careful and watched for an opening. Then the unexpected happened. Their struggle for command would have to wait through many more weary miles of work.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Perrault swore. A club struck a bony body, and a sharp yelp broke out. Suddenly the camp was full of lean shapes creeping through the dark. Eighty or ninety starving huskies had followed the smell of food from an Indian village. They had slipped in while Buck and Spitz fought. When the men charged with heavy clubs, the huskies bared their teeth and fought back.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Hunger had driven them mad. Perrault found one with its head deep in the food box and smashed his club against its thin ribs. The box overturned. At once, twenty starving dogs fought over the bread and bacon. Clubs rained down, but nothing stopped them. They howled beneath the blows and kept scrambling until every crumb was gone.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Meanwhile, the startled team dogs came out of their nests and the invaders fell upon them. Buck had never seen dogs like these. Their bones seemed ready to tear through their skin. Loose, dirty hides hung over their skeletons. Their eyes blazed, foam ran from their fangs, and hunger made them terrifying. The team could not hold them back. The first attack swept the sled dogs against the cliff.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Three huskies attacked Buck and slashed his head and shoulders in seconds. The noise was dreadful. Billee cried as always. Dave and Sol-leks stood side by side, bleeding from many wounds but fighting bravely. Joe snapped like a demon. His teeth caught a husky's foreleg and crushed the bone. Pike, who often pretended to be sick or hurt when there was work to do, showed no hesitation now. He jumped on the crippled animal and broke its neck with one bite and a jerk.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Buck caught a foaming enemy by the throat. Blood sprayed him when his teeth reached the great vein. Its warm taste drove him into still greater fury. He threw himself at another dog, and teeth sank into his own throat. Spitz had slipped in and attacked him from the side.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Perrault and François cleared their part of the camp, then hurried to save the team. The hungry wave fell back, and Buck tore himself free. But the men had to return to protect the food, and the huskies attacked again. Terror made Billee brave. He burst through the circle and ran across the ice. Pike and Dub followed, then all the others.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Buck gathered himself to follow. From the corner of his eye, he saw Spitz rushing in to knock him down. If Buck fell beneath that mass of huskies, he had no hope. He braced himself against Spitz's charge, stayed on his feet, and then raced after the team onto the lake.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Later, the nine team dogs found one another and took shelter in the forest. No one had followed them, but every dog had four or five wounds, and some were badly hurt. Dub's hind leg was torn. Dolly, the newest husky on the team, had a deep wound in her throat. Joe had lost an eye. Gentle Billee had one ear chewed to ribbons, and he whimpered all night.
        - id: ch01-b17
          speaker: narrator
          text: >-
            At dawn they limped carefully back to camp. The raiders were gone, and both men were furious. Half the food had vanished. The huskies had chewed through the sled lashings and canvas covers as well. Nothing had escaped them if it seemed even slightly edible. They had swallowed a pair of Perrault's moose-hide moccasins, bitten chunks from the leather traces, and eaten two feet from the end of François's whip. François stood looking sadly at what remained. Then he turned from the ruined gear and examined every wounded dog.
        - id: ch01-b18
          speaker: francois
          text: "Ah, my friends, all those bites might make you go mad. Maybe every one of you will go mad! What do you think, Perrault?"
        - id: ch01-b19
          speaker: narrator
          text: >-
            Perrault shook his head, unsure. Dawson was still four hundred miles away. He could not afford to have madness spread through the team. It took two hours of hard work and angry swearing to repair the harnesses. Then the stiff and wounded dogs started again. They struggled into the hardest trail they had yet faced, and the hardest they would meet before Dawson.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The Thirty Mile River ran wide open. Its wild water fought the cold, and ice formed only in quiet places and along the edges. The thirty miles took six exhausting days. Every step risked the life of a dog or man. A dozen times, Perrault broke through thin bridges of ice while testing the way. Each time, the long pole he carried fell across the hole and saved him. The temperature had dropped to fifty below zero. Whenever he went through, he had to build a fire and dry his clothes to stay alive.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Nothing frightened Perrault away from the task. That courage was exactly why the government had chosen him as a courier. He took every kind of risk without letting it slow him. From dim dawn until dark, he pushed his small, thin face into the frost and struggled onward. Along the grim shore, he led them over a narrow rim of ice. It bent beneath their weight and crackled under their feet, and they did not dare pause there for even a moment.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Once, the sled broke through with Dave and Buck. By the time the men pulled them out, both dogs were half frozen and nearly drowned. A fire had to save them. Ice covered their bodies in a solid coat. Perrault and François kept them running around the flames until they sweated and thawed, passing so close that the fire singed their fur.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Another time, Spitz went through and dragged the entire team after him as far as Buck. Buck leaned backward with all his strength. His front paws clung to the slippery edge while the ice trembled and snapped around him. Dave strained backward behind Buck, and behind the sled François pulled until his tendons felt ready to break.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Then the rim ice broke both ahead and behind them. The cliff was their only escape. Perrault somehow climbed it while François prayed for a miracle. They tied every thong, sled lashing, and spare piece of harness into one long rope. With it they lifted the dogs one by one to the top. The sled and load went next, and François came last. They still had to find a way down. The rope helped them descend, but by nightfall they were back on the river with only a quarter mile gained all day.
        - id: ch01-b25
          speaker: narrator
          text: >-
            By the time they reached the Hootalinqua and solid ice, Buck was exhausted. So were the other dogs. Perrault needed to recover lost time, so he drove them early and late. They made thirty-five miles to the Big Salmon on the first day, another thirty-five to the Little Salmon on the second, and forty miles toward the Five Fingers on the third.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Buck's paws were not as hard and tight as a husky's. Generations of easy life had softened them since his last wild ancestor was tamed by a cave dweller or river man. He limped in pain all day. The moment they camped, he dropped like a dead dog. Even when hungry, he would not rise for his fish, so François brought it to him.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Every night after supper, François rubbed Buck's feet for half an hour. He even cut the tops from his own moccasins and made four little shoes for Buck. They helped greatly. One morning François forgot them, and Buck made even Perrault's thin face twist into a grin. Buck rolled onto his back, waved all four feet in the air, and refused to move until his shoes were put on. In time, his paws grew hard, and they threw the worn-out moccasins away.
        - id: ch01-b28
          speaker: narrator
          text: >-
            One morning at the Pelly, while the men harnessed the team, Dolly suddenly went mad. Until then, no one had paid much attention to her. She announced the change with a long, heartbreaking wolf howl. Every dog bristled in fear. Then she sprang straight at Buck.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Buck had never seen madness and had no reason to know what it was. Still, he knew this was horror, and he fled in panic. Dolly ran one leap behind him, panting and foaming. His terror kept her from gaining, but her madness kept him from escaping. He raced through the woods across the island, flew down to its lower end, crossed a rough channel of ice, reached another island, then a third. He curved back toward the main river and desperately began to cross. He never looked around, but all the while he heard her snarling one leap behind.
        - id: ch01-b30
          speaker: narrator
          text: >-
            François called from a quarter mile away. Buck turned and ran back, still one leap ahead and gasping for breath. He trusted François to save him. The dog driver stood ready with an axe. Buck shot past. The axe crashed down on Dolly's head.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Buck staggered against the sled, helpless and sobbing for air. Spitz seized his chance. He sprang on Buck and twice buried his teeth in the exhausted dog's body, tearing the flesh to the bone. Then François's whip came down. Buck had the satisfaction of seeing Spitz receive the worst beating any dog on the team had yet been given.
        - id: ch01-b32
          speaker: perrault
          text: "That Spitz is a devil. One of these days, he'll kill Buck."
        - id: ch01-b33
          speaker: francois
          text: >-
            Buck is two devils. I watch him all the time, and I know. One day he'll get mad enough to chew Spitz to pieces and spit him out on the snow. I know it for sure.
        - id: ch01-b34
          speaker: narrator
          text: >-
            From then on, Buck and Spitz were at war. Spitz was the lead dog and the accepted master of the team, but Buck threatened his place. Buck was unlike every other Southland dog Spitz had known. Those dogs had been too soft. Work, frost, and hunger killed them. Buck endured. More than that, he grew stronger. He matched a husky's power, fierceness, and cunning.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Buck also wanted command. The man in the red sweater had beaten all blind courage and reckless action out of him, so his ambition was more dangerous now. He no longer threw himself at power without thinking. He watched, learned, and chose his moment. He could wait with a patience as old as the wild. A clash was certain. Buck wanted it because it was part of his nature, and because the nameless pride of the trail and harness had taken hold of him and would not let go.
        - id: ch01-b36
          speaker: narrator
          text: >-
            That strange pride kept dogs pulling until their last breath. They could die happily in harness, yet their hearts broke if they were taken out of it. Dave felt it as the wheel dog. Sol-leks felt it as he pulled with all his might. When camp broke, that pride changed them from sour, gloomy animals into eager workers. It drove them through the day, then released them at night to sink back into restless unhappiness.
        - id: ch01-b37
          speaker: narrator
          text: >-
            The same pride made Spitz punish dogs that stumbled, refused to pull, or hid when it was time for harness. It also made him fear Buck as a future leader. Buck felt that pride too, and he began openly challenging Spitz. Whenever Spitz tried to punish a shirker, Buck stepped between them on purpose.
        - id: ch01-b38
          speaker: narrator
          text: >-
            After a heavy snowfall, Pike hid in his nest beneath a foot of snow. François called and searched, but Pike did not appear. Spitz flew into a rage. He dug through every likely place, sniffing and snarling so fiercely that Pike trembled in hiding.
        - id: ch01-b39
          speaker: narrator
          text: >-
            At last Spitz found him and sprang in to punish him. Buck struck just as quickly. His attack was so sudden and clever that he knocked Spitz backward off his feet. Pike had been shaking with fear, but this open rebellion gave him courage. He jumped on the fallen leader, and Buck joined him. Fair play meant nothing to Buck now.
        - id: ch01-b40
          speaker: narrator
          text: >-
            François laughed at what had happened, but he still enforced the rules. His lash struck Buck with all his strength. Buck would not leave Spitz, so François used the heavy handle. The blow half stunned Buck and knocked him back. The lash fell again and again while Spitz gave Pike the full punishment he had earned many times over.
        - id: ch01-b41
          speaker: narrator
          text: >-
            As Dawson drew nearer, Buck kept stepping between Spitz and dogs that deserved punishment. Now he did it carefully, only when François was not there to catch him. His hidden rebellion spread through the team and encouraged a general refusal to obey. Dave and Sol-leks did not change, but all the others grew steadily worse. Nothing ran smoothly anymore. Dogs argued, snapped, and tangled with one another, and trouble waited everywhere. At the bottom of it all was Buck.
        - id: ch01-b42
          speaker: narrator
          text: >-
            François stayed busy and worried. He knew that sooner or later Buck and Spitz would fight to the death. More than once, noise from the other dogs pulled him from his sleeping robe at night because he feared the great fight had begun. Buck was too clever to be caught again. In harness he worked faithfully, because he loved the labor. But he loved even more to start a fight among his teammates and twist their traces together.
        - id: ch01-b43
          speaker: narrator
          text: >-
            The chance did not come before Dawson. They entered town one gloomy afternoon with the great fight still ahead. Men and dogs crowded the place, and all of them seemed to be working. Long teams moved up and down the main street all day. Their bells still jingled past at night. Dogs hauled cabin logs, firewood, and freight for the mines. They did every kind of work that horses had done in the Santa Clara Valley.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Buck saw a few dogs from the Southland, but most were the wild, wolfish husky breed. Every night at nine, midnight, and three, they lifted their voices in a strange and eerie song. Buck loved to join them.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Sometimes the northern lights burned cold above them. At other times, the stars seemed to leap in the frost while the land lay numb and frozen beneath its heavy covering of snow. The huskies' song might have sounded like life defying that frozen world. But it rose in a minor key, full of long wails and broken half sobs. It sounded less like defiance and more like life pleading to survive. The song was as old as the breed itself, one of the first songs from a younger world, from an age when songs were sad.
        - id: ch01-b46
          speaker: narrator
          text: >-
            The sorrow of countless generations lived in that cry, and it stirred Buck deeply. When he moaned with the others, he felt the ancient pain of living that his wild ancestors had known. He felt their fear of the cold and dark, and their wonder at its mystery. The song reached back through all the ages of fire and shelter to life's raw beginning in a howling world. Buck's answer showed how completely he was returning to that beginning.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Seven days after reaching Dawson, the team went down the steep bank beside the Barracks and returned to the Yukon Trail. They were bound for Dyea and salt water. Perrault carried messages even more urgent than the ones he had delivered. He too had caught the pride of the trail, and he meant to make the fastest journey of the year.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Several things helped him. A week of rest had made the dogs strong again. Other travelers had packed down the trail the team had broken on the way in. The police had stored food for dogs and men at several places, so the sled could travel light. They reached Sixty Mile on the first day, though that run was fifty miles. On the second, they raced up the Yukon toward Pelly.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Their speed cost François endless trouble and frustration. Buck's quiet revolt had destroyed the unity of the team. Once, all the dogs had leaped into the traces and pulled as if they were one animal. That was gone now. The rebels took Buck's support as permission for every small offense they could imagine. Spitz had once been a leader every dog feared, but his old power was slipping away. The awe around him had vanished, and the others had begun to see themselves as his equals. Now they were ready to challenge his authority whenever Buck stood behind them.
        - id: ch01-b50
          speaker: narrator
          text: >-
            One night Pike stole half of Spitz's fish and swallowed it while Buck protected him. Another night Dub and Joe fought Spitz until he gave up trying to punish them. Even gentle Billee became less gentle and no longer begged for peace as he once had. Buck snarled and raised his fur whenever he passed Spitz. He strutted back and forth beneath the leader's nose like a bully.
        - id: ch01-b51
          speaker: narrator
          text: >-
            The broken discipline poisoned the dogs' dealings with one another too. They fought more than ever, until camp sometimes became a howling madhouse. Only Dave and Sol-leks stayed the same, though the constant quarrels made them irritable. François shouted wild curses, stamped the snow, tore his hair, and kept his whip singing over the team. It did little good. The moment he turned away, the fighting began again.
        - id: ch01-b52
          speaker: narrator
          text: >-
            François supported Spitz with his whip, while Buck supported the other dogs. François knew Buck caused the trouble, and Buck knew that he knew. Yet Buck never let himself be caught. He pulled honestly because work had become a joy, but secretly causing fights and tangled traces pleased him even more.
        - id: ch01-b53
          speaker: narrator
          text: >-
            One night after supper, at the mouth of the Tahkeena, Dub found a snowshoe rabbit and missed it. In an instant the whole team gave chase. A hundred yards away, fifty huskies from a Northwest Police camp heard them and joined in. The rabbit raced down the river, turned into a narrow creek, and followed its frozen bed.
        - id: ch01-b54
          speaker: narrator
          text: >-
            The rabbit skimmed over the snow while the dogs had to drive through it with all their strength. Buck led the sixty-dog pack around bend after bend, but he could not close the distance. He ran low, whining with eagerness, his powerful body flashing forward one leap at a time in the pale moonlight. Ahead of him, the snowshoe rabbit flickered like a ghost made of frost.
        - id: ch01-b55
          speaker: narrator
          text: >-
            An old instinct sometimes drives people away from noisy cities and out across forest and plain to hunt. That same hunger for the kill filled Buck, only for him it was closer and more real. He ran at the head of the pack after living meat. He wanted to bring it down with his own teeth and cover his muzzle in warm blood.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Buck reached the highest joy life could give him, the point beyond which life could rise no farther. There was a strange truth in it. He forgot that he was alive because he had never been more fully alive. An artist might lose himself in a blaze of creation, or a soldier in the madness of battle. Buck lost himself as he led the pack and cried the old wolf cry, straining after the living food that fled through the moonlight. He reached into the deepest parts of his nature, deeper than thought and older than memory. A great tide of life surged through every muscle, joint, and cord of his body. Each part of him rejoiced simply because it moved. He was everything that was not death, burning with motion as he flew beneath the stars over the face of the frozen, motionless earth.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Spitz kept his cold judgment even at such a moment. He left the pack and cut across a narrow tongue of land where the creek curved in a long bend. Buck knew nothing of it. When he rounded the bend, the pale rabbit still danced ahead. Then another, larger white shape sprang from the bank directly into its path. It was Spitz.
        - id: ch01-b58
          speaker: narrator
          text: >-
            The rabbit could not turn. Spitz's white teeth broke its back in midair, and it screamed like a wounded man. At that cry, as life fell from its highest point into death, all the dogs behind Buck raised a terrible chorus of delight.
        - id: ch01-b59
          speaker: narrator
          text: >-
            Buck made no sound and never slowed. He drove shoulder first into Spitz so hard that he missed the throat. They rolled through the powdery snow. Spitz came up as if he had never fallen. He slashed Buck's shoulder and sprang away. His teeth snapped twice like the steel jaws of a trap while he backed toward firmer ground, lips raised and snarling.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Buck understood in a flash. The time had come, and this fight would end in death. They circled with ears laid back, snarling and watching for an advantage. The white woods, the earth, the moonlight, and the thrill of battle all seemed familiar to Buck, as if he remembered them.
        - id: ch01-b61
          speaker: narrator
          text: >-
            A ghostly calm settled over the white earth and silent woods. There was not even the faintest whisper of wind. Nothing moved, and not one leaf trembled. The dogs' breath rose slowly and lingered in the frozen air. They had made quick work of the snowshoe rabbit. Now those half-tamed wolves drew together in a waiting circle around the two fighters. They too were perfectly silent. Only their eyes gleamed, and their silver breath drifted upward. To Buck, this ancient scene felt neither new nor strange. It seemed familiar, as if it had always existed and had always been the natural way of life.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Spitz was an experienced fighter. From Spitzbergen through the Arctic, across Canada, and over the empty Barrens, he had faced every kind of dog. Time after time, he had held his own and risen to mastery over them. His rage was fierce, but it was never blind. However strong his desire to tear and destroy, he never forgot that the enemy before him had the same desire. Spitz would not rush until he was prepared to receive a rush in return. He would not launch an attack until he had first guarded himself against the attack already coming toward him.
        - id: ch01-b63
          speaker: narrator
          text: >-
            Buck tried again and again to reach the white dog's neck. Wherever his teeth aimed for soft flesh, Spitz's teeth blocked them. Fangs struck fangs, and both dogs' lips bled, but Buck could not break through. He grew hotter and swept around Spitz in a storm of attacks. Each time he lunged for the white throat where life beat close beneath the skin, Spitz cut him and escaped.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Then Buck pretended to attack the throat, pulled his head back, and swung sideways to drive his shoulder into Spitz's shoulder and knock him down. Each time, Spitz leaped lightly aside and slashed Buck's shoulder.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Spitz remained untouched, while blood ran freely from Buck and he panted harder with every breath. The fight was becoming desperate. All the while, the silent, wolfish circle waited to tear apart whichever dog went down. As Buck grew tired, Spitz changed his attack and began rushing him. Again and again he drove Buck backward and left him fighting to keep his feet. Once Buck did fall, and the whole circle of sixty dogs surged up at once. But Buck twisted and recovered almost in midair. He landed on his feet, and the circle sank down again to wait.
        - id: ch01-b66
          speaker: narrator
          text: >-
            But Buck had imagination. Instinct taught him to fight, and his mind could guide that instinct. He rushed as if he meant to try the shoulder blow again. At the last moment he dropped low and swept inward. His teeth closed on Spitz's left front leg. Bone broke with a crunch, and the white dog faced him on three legs.
        - id: ch01-b67
          speaker: narrator
          text: >-
            Three times Buck tried to knock him down. Then he repeated the trick and broke the right front leg. Pain and helplessness could not stop Spitz from struggling to stay upright. He saw the quiet ring of dogs closing around him, their eyes shining, tongues hanging out, and breath silver in the air. He had watched such circles close around defeated enemies before. This time, he was the defeated one.
        - id: ch01-b68
          speaker: narrator
          text: >-
            There was no hope left for Spitz. Buck would not soften and would show no mercy. Mercy belonged to gentler lands, far from this frozen place. Buck moved carefully into position for the final rush. The ring pressed closer and closer until he could feel the warm breaths of the huskies against both sides of his body. He could see them beyond Spitz and on either side of the beaten dog. They were half crouched, ready to spring the instant one fighter fell, and every shining eye remained fixed on Buck.
        - id: ch01-b69
          speaker: narrator
          text: >-
            A long pause seemed to settle over them. Every animal stood motionless, as if the cold had turned the whole circle to stone. Only Spitz moved. He shook, raised his fur, and staggered back and forth on his broken legs. Still he snarled with horrible menace, as if that sound alone could frighten away the death closing in on him. Buck sprang in, then out again before Spitz could answer. On the next rush, he drove forward, and his shoulder struck Spitz's shoulder squarely at last.
        - id: ch01-b70
          speaker: narrator
          text: >-
            The dark circle became a single spot on the moonlit snow as Spitz vanished beneath it. Buck stood and watched. He was the victorious champion, the dominant primordial beast who had made his kill and found it good.
