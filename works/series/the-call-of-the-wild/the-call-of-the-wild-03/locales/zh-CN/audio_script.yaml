audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 生动沉稳，时刻留意逼近的危险
        timbre: 温暖浑厚，清晰有力
        pace: 从容有度
        pitch: 中音
    francois:
      display_name: 弗朗索瓦
      tts:
        delivery: 镇定能干，惜字如金
        timbre: 深沉平稳
        pace: 从容
        pitch: 低音
    perrault:
      display_name: 佩罗
      tts:
        delivery: 果断务实，语气简短有力
        timbre: 清亮坚实
        pace: 稍快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 雪窝里的挑战
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            巴克体内那股原始的兽性本来就很强。雪道上的生活越凶险，它长得越快，却一直藏在沉着和克制下面。新近长出的机敏，让巴克更能稳住自己。他忙着适应新日子，没有一刻真正轻松，却从不主动惹事，能避开的争斗也尽量避开。哪怕他和斯匹茨恨透了彼此，他仍旧耐心等待，不显得急躁，也不肯轻率出手。
        - id: ch01-b02
          speaker: narrator
          text: >-
            斯匹茨却不同。也许他早已看出巴克会成为危险的对手，因此一有机会就龇牙威吓，还故意欺负巴克，想逼他展开一场只有一方能活下来的恶斗。旅程开始不久，这一战差点就打响了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            那天傍晚，飞雪扑面，寒风像烧得白亮的刀锋一样割人，黑暗又逼得他们四处摸索。他们最后在拉巴奇湖边找到一处宿营地，那里实在糟得不能再糟。背后是一面直立的岩壁，佩罗和弗朗索瓦只能在湖冰上生火铺床。为了轻装赶路，帐篷早在戴伊扔掉了。几根漂来的枯木只燃起一小堆火，热气还把脚下的冰融开，众人最后连晚饭也只能在黑暗里吃。
        - id: ch01-b04
          speaker: narrator
          text: >-
            巴克贴着岩壁刨了一个暖和的雪窝。弗朗索瓦分鱼时，他都舍不得出来。可等他吃完回去，窝里已经多了一声警告的低吼。斯匹茨占了他的地方。
        - id: ch01-b05
          speaker: narrator
          text: >-
            巴克一直忍让，这一次却忍无可忍。他体内的野兽猛然咆哮，整条狗扑向斯匹茨。那股凶狠连他自己都没料到，斯匹茨更是大吃一惊。因为此前每次相处都让斯匹茨认定，巴克格外胆小，只靠高大的身躯和沉重的分量，才勉强守得住自己。眼前的巴克却完全不是他以为的样子。
        - id: ch01-b06
          speaker: narrator
          text: >-
            两条狗缠在一起，从塌掉的雪窝里冲出来。弗朗索瓦也吃了一惊，可他看见被毁的窝，马上就明白了争斗的缘故。他不但没有阻止，反而大声替巴克叫好。
        - id: ch01-b07
          speaker: francois
          text: 揍他，巴克！狠狠揍这个肮脏的小偷！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: >-
            斯匹茨也急着开战。他气得尖声吠叫，一边来回兜圈，一边寻找扑击的机会。巴克同样斗志高涨，却没有因为怒火失去谨慎，也绕着对手寻找有利的位置。就在两条狗准备争夺上风时，另一场意外突然爆发。这次混乱打断了决斗，把他们的最终一战推到了许多英里以外，也推过了许多天疲惫的劳作。
    - id: ch02
      title: 饥饿的野狗
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            佩罗忽然骂了一声。棍棒重重砸中嶙峋的骨头，随即传来一声尖厉的痛号，整个营地顿时乱成一团。直到这时，众人才发现四处都是偷偷摸进来的野狗，足有四五十条。它们饿得发狂，从附近的印第安村落闻到食物气味，趁巴克和斯匹茨打斗时潜了进来，没有谁察觉。
        - id: ch02-b02
          speaker: narrator
          text: >-
            佩罗和弗朗索瓦挥棍冲进狗群，那些野狗竟敢龇牙还击。饥饿已经让它们发疯。一条狗把头埋进食物箱，佩罗一棍砸上它干瘦的肋骨，箱子顿时翻在地上。二十来条野狗立刻扑向面包和熏肉。棍棒像雨点一样落下，它们只顾尖叫哀号，仍然抢个不停，直到最后一点碎屑也进了肚子。
        - id: ch02-b03
          speaker: narrator
          text: >-
            惊慌的雪橇犬从窝里蹿出来，马上又被凶狠的入侵者围住。巴克从没见过这么瘦的狗。骨头仿佛就要穿破皮肤，肮脏的毛皮松垮地挂在骷髅一样的身体上，眼睛发亮，獠牙淌着涎水。它们本来只剩下一副空架子，正是这股饿疯了的劲头，让它们变得可怕，凶得无法抵挡。第一轮冲击就把狗队逼到岩壁下面。
        - id: ch02-b04
          speaker: narrator
          text: >-
            三条野狗扑住巴克，转眼就在他的头和肩膀上撕开伤口。比利照旧哭叫。戴夫和索尔莱克斯浑身流血，带着二十多处伤，还在肩并肩战斗。乔像恶魔一样乱咬，一口嚼碎了一条野狗的前腿骨。派克趁那条狗残废，扑上去咬断了它的脖子。
        - id: ch02-b05
          speaker: narrator
          text: >-
            巴克咬住一个满嘴白沫的对手，牙齿穿透颈侧，热血顿时喷了他一身。嘴里温热的血味刺激着他，让他比刚才更加凶猛。他甩开已经倒下的敌手，立即扑向下一条狗。就在同一瞬间，另一副牙齿扎进了他自己的喉咙。偷袭者不是饥饿的野狗，而是一直等待机会、从侧面扑来的斯匹茨。
        - id: ch02-b06
          speaker: narrator
          text: >-
            佩罗和弗朗索瓦清掉营地另一边的入侵者，立刻赶来搭救狗队。饥饿的兽潮在棍棒前暂时退开，巴克终于挣脱出来。可两个男人还得回头保护剩下的食物，野狗立刻又发动攻击。吓坏的比利反而生出勇气，拼命冲破凶狠的包围，逃上湖冰。派克和杜布紧跟在后，其余狗也全跟了上去。
        - id: ch02-b07
          speaker: narrator
          text: >-
            巴克正要起跳，忽然瞥见斯匹茨冲向自己，想把他撞倒。要是跌进那群野狗中间，他绝不可能活下来。巴克站稳身体，硬接下这一撞，然后才追着同伴逃向湖面。
        - id: ch02-b08
          speaker: narrator
          text: >-
            九条雪橇犬后来在森林里重新聚齐，找地方藏了起来。虽然没有敌人追来，它们的模样仍旧惨不忍睹。每条狗身上都有四五处伤，有些伤得更重。杜布坏了一条后腿，多莉的喉咙裂开，乔丢了一只眼睛，比利的一只耳朵被咬成一缕缕碎片，整夜都在哭泣呜咽。
        - id: ch02-b09
          speaker: narrator
          text: >-
            天亮后，它们小心翼翼地一瘸一拐回到营地。野狗走了，两个男人正在发火。食物足足少了一半，雪橇的皮条和帆布也被咬坏。只要稍微像是能吃的东西，都没逃过它们的嘴。佩罗少了一双驼鹿皮软靴，皮挽带被啃掉几大块，弗朗索瓦的鞭梢也短了两英尺。他伤心地看了一会儿残破的鞭子，才回过神来，检查起狗群的伤势。
        - id: ch02-b10
          speaker: francois
          text: 我的朋友们，你们挨了这么多口，没准都会变成疯狗。真该死！佩罗，你说会不会？
        - id: ch02-b11
          speaker: narrator
          text: >-
            佩罗迟疑地摇了摇头。离道森还有四百英里，他绝不能让狗群在半路发疯。接下来的两个钟头里，两个人一边咒骂，一边使尽力气修补被咬坏的挽具。受伤的狗浑身僵硬，终于再次套上皮带，拉起雪橇。它们忍着疼痛，走进一路以来最艰难的地段，也是抵达道森以前最危险的一段路。
    - id: ch03
      title: 三十英里河
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            三十英里河完全没有封冻。奔腾的河水抵抗着严寒，只有漩涡和水流平缓的地方勉强结冰。短短三十英里，他们足足走了六天，累得精疲力尽。那里每一步都拿人和狗的性命冒险。佩罗走在前面探路，十几次踏破薄薄的冰桥。幸好他总横握一根长杆，身体掉进冰窟窿时，杆子会架在洞口，留住他的性命。
        - id: ch03-b02
          speaker: narrator
          text: >-
            偏偏又赶上零下五十度的寒潮。每次落水，佩罗都得马上生火烘干衣服，否则就会送命。他从来不曾被吓退，也正因为这样，政府才选他当信使。他敢冒各种风险，从昏暗的清晨一直挣扎到天黑，始终用那张瘦小干瘪的脸迎着严寒，不肯停下。
        - id: ch03-b03
          speaker: narrator
          text: >-
            他们沿河岸的一圈薄冰前进。冰面在脚下弯曲，咔嚓作响。有一次，雪橇带着戴夫和巴克穿进水里。两条狗被拖出来时差点淹死，也快冻僵了。它们全身结着硬冰，两个男人便赶着它们绕火奔跑，直到身体冒汗、冰层融化。狗群离火太近，毛也被燎焦了。
        - id: ch03-b04
          speaker: narrator
          text: >-
            另一次，斯匹茨掉进河里，把身后的狗一条条拖了下去，一直拖到巴克这里。巴克用前爪死死抵住滑溜的冰缘，使出全身力气往后撑，整支队伍才停住。四周的冰还在震动，裂缝发出一声声脆响。巴克身后的戴夫也在拼命后挣，弗朗索瓦则站在雪橇后面用力拉扯，浑身的筋仿佛都要断开。
        - id: ch03-b05
          speaker: narrator
          text: >-
            还有一回，前后的岸冰同时断裂，唯一的生路在峭壁顶上。佩罗奇迹般爬了上去，弗朗索瓦就在下面祈祷同样的奇迹。众人把所有皮条、雪橇捆绳和剩下的挽具都接在一起，拼成一根长绳，再把狗一条条吊到崖顶。货物和雪橇上去以后，弗朗索瓦最后攀上去。可他们还要沿路寻找能够下崖的地方，最后仍靠那根长绳才回到河面。天已经黑了，这一天却只走出四分之一英里。
        - id: ch03-b06
          speaker: narrator
          text: >-
            等他们抵达胡塔林夸河，踏上结实的冰，巴克和其他狗都已经筋疲力尽。佩罗却要追回时间，起早贪黑地赶路。三天之内，他们先后走过三十五英里、三十五英里和四十英里，从大鲑鱼河赶到小鲑鱼河，又逼近五指滩。
        - id: ch03-b07
          speaker: narrator
          text: >-
            爱斯基摩犬的脚掌紧实坚硬，巴克的脚却经过许多代驯养，早已变软。从最后一个野生祖先被人驯服，到如今已经过去太久。他整天忍着剧痛跛行，一到营地就像死狗一样倒下。再饿也不肯去领鱼，弗朗索瓦只能把食物送过来。每天晚饭后，他还替巴克揉半个钟头的脚，最后割下自己软靴的鞋面，给巴克做了四只小靴子。
        - id: ch03-b08
          speaker: narrator
          text: >-
            小靴子让巴克轻松多了，也让他很快明白了它们的用处。一天早晨，弗朗索瓦忘了替他穿，巴克便仰面躺下，四只脚可怜巴巴地举在空中，说什么也不走。连佩罗那张平常严肃而干瘪的脸，都被他的样子扭出了一丝笑容。后来巴克的脚掌逐渐适应雪道，终于变得坚硬，四只磨烂的小靴子也就扔掉了。
        - id: ch03-b09
          speaker: narrator
          text: >-
            到了佩利河，一天早晨，谁也没留意过的多莉突然疯了。她发出一声撕心裂肺的狼嗥，所有狗都吓得竖起毛发。接着，她朝巴克直扑过来。巴克从没见过疯狗，却立刻知道那是最可怕的东西，转身就逃。
        - id: ch03-b10
          speaker: narrator
          text: >-
            巴克一路笔直飞奔，多莉喘着粗气，口吐白沫，永远只差一步。巴克怕得太厉害，她追不上；多莉疯得太厉害，他也甩不掉。巴克冲过第一座岛上长满树林的高地，飞奔到岛的下游，跨过满是碎冰的支流，又跑过第二座和第三座岛，最后绕回主河，绝望地向对岸冲去。即使不敢回头，他也听得到身后一步之外的低吼。
        - id: ch03-b11
          speaker: narrator
          text: >-
            四分之一英里外，弗朗索瓦大声呼唤。巴克立即掉头，痛苦地喘着气，把全部希望都放在他身上。赶狗人握着斧头等待。巴克从他身边冲过，斧头随即劈在疯多莉的头上。
        - id: ch03-b12
          speaker: narrator
          text: >-
            巴克耗尽了力气，踉跄着靠到雪橇旁，只能呜咽着拼命喘息，再也没有还手的力量。斯匹茨立刻抓住机会扑上去，两次把牙齿扎进毫无抵抗的对手，直把皮肉撕到骨头。弗朗索瓦的鞭子随后落下，而且一下比一下重。巴克终于能站在一旁，看着斯匹茨挨一顿狗队中从未有谁受过的毒打，心里痛快极了。
        - id: ch03-b13
          speaker: perrault
          text: 斯匹茨就是个魔鬼。早晚有一天，他会把巴克杀掉。
        - id: ch03-b14
          speaker: francois
          text: 巴克抵得上两个魔鬼！我一直盯着他，知道得很清楚。总有一天，他也会发疯似的扑上去，把斯匹茨嚼烂，再吐到雪地上。肯定会，我知道。
    - id: ch04
      title: 领队之争
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            从此以后，巴克和斯匹茨之间只剩下战争。斯匹茨是领队犬，也是公认的霸主，这条陌生的南方狗却让他感到地位不稳。过去那些南方狗都太娇弱，往往死在劳苦、严寒和饥饿里。只有巴克撑了下来，而且越来越强。他的力气、凶狠和机敏都赶上了爱斯基摩犬。
        - id: ch04-b02
          speaker: narrator
          text: >-
            巴克天生渴望掌控一切，可红毛衣男人早已用棍棒打掉他盲目的勇猛和莽撞。现在，他不但有力量、凶狠和机敏，还懂得隐藏意图，等到最合适的时机再动手。他的耐心来自最古老的本能。这正是他最危险的地方。
        - id: ch04-b03
          speaker: narrator
          text: >-
            争夺领队地位的一战无法避免，巴克自己也渴望它。雪道和挽绳带来的骄傲牢牢抓住了他。那股骄傲让狗一直劳作到最后一口气，让它们甘愿死在挽具里；要是把它们撤下来，反而会让它们心碎。
        - id: ch04-b04
          speaker: narrator
          text: >-
            戴夫身为后橇狗，怀着这样的骄傲。索尔莱克斯全力拉橇时也是一样。每天拔营，它抓住两条狗，把阴沉暴躁的野兽变得急切而有雄心，整日催它们向前。夜里一扎营，那股力量又把它们抛下，只留下烦躁和不满。斯匹茨也靠它坚持下来，痛打那些在挽绳下出错、偷懒，或早晨套挽具时躲起来的狗。也因为这股骄傲，他害怕巴克会夺走领队的位置。巴克心里燃烧的，正是同一种东西。
        - id: ch04-b05
          speaker: narrator
          text: >-
            巴克开始公开挑战斯匹茨。只要斯匹茨惩罚偷懒的狗，他就故意插到中间。一个下过大雪的早晨，派克躲在一英尺厚的积雪下面，不肯出来。弗朗索瓦怎么喊也找不到。斯匹茨气得在营地里嗅闻挖刨，吼声把藏起来的派克吓得直抖。
        - id: ch04-b06
          speaker: narrator
          text: >-
            派克终于被挖了出来。斯匹茨刚要扑上去，巴克便抓准时机，把他撞得向后翻倒。派克见有人公开反叛，也壮起胆子扑向领队。巴克早把公平较量的规矩忘了，跟着一起进攻。
        - id: ch04-b07
          speaker: narrator
          text: >-
            弗朗索瓦虽然看得发笑，却照样执行规矩。他使足力气抽打巴克，鞭子赶不开，就掉转鞭柄狠砸。巴克被打得半昏，终于退开，鞭梢还接连落在身上。斯匹茨则抓住机会，把派克狠狠惩罚了一顿。
        - id: ch04-b08
          speaker: narrator
          text: >-
            接下来的日子里，道森一天比一天近。巴克继续保护犯错的狗，只是变得更聪明，专挑弗朗索瓦不在的时候下手。反叛在狗队里越传越广，越来越多的狗开始抗命。戴夫和索尔莱克斯不受影响，其他狗却越来越不服管。该做的事不再顺利，争吵没完没了，麻烦处处发生，根源全在巴克身上。
        - id: ch04-b09
          speaker: narrator
          text: >-
            弗朗索瓦知道两条狗迟早要拼个你死我活，所以整天提防，不敢有片刻松懈。好多个夜里，只要其他狗传来争吵和搏斗的声音，他便从铺盖里跳出来，担心巴克和斯匹茨已经开战。然而真正的机会始终没有出现。一个阴沉的下午，狗队终于驶进道森，那场不可避免的大战仍在未来等待。
        - id: ch04-b10
          speaker: narrator
          text: >-
            道森到处是人，也到处是工作的狗。巴克看着这一切，仿佛狗生来就该劳动。白天，长长的狗队沿大街来回穿梭；到了夜里，清脆的铃声还不断从街上经过。它们拖着建造木屋的原木，运送柴火和矿区的货物，干着圣克拉拉谷地里由马匹承担的各种活。巴克偶尔遇到南方狗，不过大多数都是像野狼的爱斯基摩犬。
        - id: ch04-b11
          speaker: narrator
          text: >-
            每晚九点、十二点和三点，它们都会准时唱起幽深诡异的夜歌，巴克也喜欢加入。头顶有时燃着冰冷的北极光，有时群星在严寒中跃动。大地披着积雪，如同盖着一层尸衣，麻木地封冻在下面。狗群的歌声便从这片寒冷的世界里升起来。
        - id: ch04-b12
          speaker: narrator
          text: >-
            那首歌仿佛在向生命挑战，调子里却满是悠长的悲号和断续的啜泣，所以更像生命的哀求，是生灵把生存的痛苦唱出了声音。它和这个种族一样古老，来自世界还年轻、歌声总是悲凉的年代，带着无数代生灵的哀愁。巴克发出呜咽时，也感到了野性祖先的生之苦楚，还有严寒和黑暗留给它们的恐惧与神秘。
        - id: ch04-b13
          speaker: narrator
          text: >-
            这歌声如此深地打动巴克，说明他已经越过火堆和屋顶遮蔽的岁月，一直回到生命粗野的开端，回到那个嗥声遍野的年代。
    - id: ch05
      title: 月下的追猎
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            到达道森七天后，狗队从兵营旁的陡岸下到育空雪道，再次朝戴伊和咸水海岸出发。佩罗带着比来时更加紧急的公文，也被雪道上的骄傲抓住，决心创下当年的行程纪录。几件事正好对他有利。狗群休息一周，已经恢复体力，状态极佳；他们来时开出的路又被后来的旅人踩实，警察还沿途两三处地方为人和狗储备了食物，他们因此能够轻装赶路。
        - id: ch05-b02
          speaker: narrator
          text: >-
            第一天，他们跑过名叫六十英里河、实际只有五十英里的路程。第二天，队伍已经沿育空河飞驰，朝佩利河前进。速度虽然惊人，弗朗索瓦却吃尽苦头。巴克煽动的反叛毁掉了狗队的齐心协力。它们再也不能像一条狗那样同时扑进挽绳。
        - id: ch05-b03
          speaker: narrator
          text: >-
            斯匹茨不再叫群狗敬畏，从前压住它们的威严已经消失。派克抢走他半条鱼，在巴克保护下当场吞进肚里。杜布和乔一同攻击他，逼得他放弃了它们本该挨受的惩罚。就连一向温顺的比利也不再那么好脾气，求饶时不像从前那样殷勤。巴克每次靠近斯匹茨，都会龇牙竖毛，发出威胁的低吼。他甚至在对方鼻子底下趾高气扬地来回走动。
        - id: ch05-b04
          speaker: narrator
          text: >-
            狗群彼此间也越吵越凶，营地常常满是嚎叫，乱成一座疯人院。只有戴夫和索尔莱克斯没有改变，却也被没完没了的争吵弄得十分烦躁。弗朗索瓦气得跺着雪地，扯着头发，骂出古怪而粗野的话。他的鞭子不断在狗群中呼啸，仍然管不住它们。只要他一转身，狗群就重新闹起来。他挥鞭支持斯匹茨，巴克便替其余狗撑腰。
        - id: ch05-b05
          speaker: narrator
          text: >-
            弗朗索瓦明白巴克是一切麻烦的祸根，巴克也清楚他心里明白，却狡猾得从不让他抓个正着。套上挽具以后，巴克仍然忠实卖力，一步也不肯偷懒，因为拉橇本身已经成了他的乐趣。只是趁赶狗人不注意，偷偷挑起同伴之间的争斗，再看着挽绳乱成一团，会让他更加快活。
        - id: ch05-b06
          speaker: narrator
          text: >-
            一天晚饭后，他们在塔基纳河口扎营。杜布惊出一只雪鞋兔，却笨拙地没抓住。整支狗队立刻叫喊着追去。百码外，西北骑警营地里的五十条爱斯基摩犬也加入进来。兔子沿河飞奔，又拐进一条小溪，顺着结冰的河床向上跑。
        - id: ch05-b07
          speaker: narrator
          text: >-
            兔子轻轻掠过积雪表面，狗群却得使出蛮力，在深雪里破路前进。六十条狗里，巴克冲在最前方，带着它们绕过一道又一道河湾，仍然追不上。他把身体伏得很低，兴奋地呜咽，健壮的身躯在惨白的月光里一跃接着一跃，闪动着冲向前方。那只雪鞋兔也一跃接一跃，像一道淡白的霜中幽灵，始终在前面飘飞。
        - id: ch05-b08
          speaker: narrator
          text: >-
            古老的本能有时会把人赶出喧闹的城市，让他们走进森林和平原，用化学力量射出的铅弹猎杀生灵。那份嗜血和杀戮的快意，如今也完全属于巴克，而且离他更加切近。人还要借助武器，巴克却正亲自领着狗群追赶一只野物，追赶一块活生生的肉。他要用自己的牙把猎物咬死，让温热的鲜血从嘴边一直染到眼睛。
        - id: ch05-b09
          speaker: narrator
          text: >-
            生命有一种最高的狂喜。它只在人活得最强烈时到来，却会让人彻底忘记自己活着。艺术家在创作的烈焰里忘掉自身，士兵在战场上杀红了眼、拒绝投降，都会感到它。此刻，巴克领着狗群，发出古老的狼嗥，追逐月光下奔跑的活食，也沉进了同样的狂喜。
        - id: ch05-b10
          speaker: narrator
          text: >-
            他深入自己的天性，甚至触到比自身更深的地方，一直回到时间的子宫。生命像潮水一样控制着他。每块肌肉、每个关节和每条筋腱都因为自己并非死亡而欢欣。巴克浑身灼热，蓬勃有力，在运动中显露生命，飞越星空下静止而死寂的大地。
        - id: ch05-b11
          speaker: narrator
          text: >-
            斯匹茨却始终冷静。他离开狗群，从小溪长长河湾中间的一片窄地横穿过去。巴克转过弯时，那只霜中幽灵仍在前方；忽然，另一道更大的白影从岸上跳下，正好拦住兔子。那正是斯匹茨。
        - id: ch05-b12
          speaker: narrator
          text: >-
            兔子来不及转向。雪白的牙齿在半空咬断它的脊背，它像受伤的人一样尖声惨叫。那是生命从最高处跌进死亡手里发出的声音。紧跟巴克的整群狗听见后，立刻爆发出地狱合唱般的欢呼。
    - id: ch06
      title: 原始兽性的胜利
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            巴克没有叫，也没有减速，径直撞向斯匹茨。他肩膀对着肩膀冲得太狠，反而没能咬住喉咙。两条狗翻滚在松软的雪里。斯匹茨几乎立刻站了起来，在巴克肩上撕开一道伤口，又跳到远处。他一面后退寻找稳固的位置，一面掀起嘴唇咆哮，牙齿像钢制兽夹一样咔嚓合拢。
        - id: ch06-b02
          speaker: narrator
          text: >-
            巴克顿时明白，时机来了。这是一场死战。两条狗低吼着绕圈，耳朵压向脑后，都在等对方露出破绽。可巴克觉得眼前的一切早已见过。白色的森林和大地，月光，还有战斗带来的战栗，都像一段古老的记忆。
        - id: ch06-b03
          speaker: narrator
          text: >-
            幽灵般的寂静盖住洁白的森林。没有一丝风，没有任何东西移动，连一片叶子也没有颤动。狗群呼出的白气慢慢升起，长久停在冰冷的空气里。这些没有完全驯服的狼转眼就吃掉了兔子，如今围成一个期待的圆圈，沉默地等待。它们只有眼睛在发亮，呼吸还在缓缓飘向上空。对巴克来说，这远古的场面一点也不陌生，仿佛它一直存在，世间从来就该这样。
        - id: ch06-b04
          speaker: narrator
          text: >-
            斯匹茨是久经战阵的好手。从斯匹茨卑尔根到北极地区，从加拿大到荒原，他跟各式各样的狗交过锋，不只保住了自己，还成了它们的霸主。他的怒火凶狠，却从不盲目。无论多想撕碎和毁掉敌人，他也不会忘记，敌人同样想把他撕碎。没准备好承受攻击，他绝不冲上去；没有先挡下对方的进攻，他也不会贸然发动攻势。
        - id: ch06-b05
          speaker: narrator
          text: >-
            巴克屡次想把牙扎进大白狗的脖子，每次都有斯匹茨的獠牙迎面拦住。尖牙撞上尖牙，两边的嘴唇都被割破流血，巴克还是攻不进对手的防线。随后他越战越勇，用接连不断的猛扑把斯匹茨裹进一阵旋风。巴克一次次冲向那条雪白的喉咙，生命仿佛就在薄薄的皮肉下面涌动，斯匹茨却总能在他身上划出伤口，再及时跳开。
        - id: ch06-b06
          speaker: narrator
          text: >-
            巴克又假装攻击喉咙，忽然收头绕到侧面，用肩膀撞向斯匹茨，想把他当场撞倒。可斯匹茨每次都轻盈地躲开，还在巴克肩上添一道伤。斯匹茨毫发无损，巴克却鲜血直流，喘得越来越急。
        - id: ch06-b07
          speaker: narrator
          text: >-
            沉默的狗群仍旧守在周围，准备撕碎倒下的一方。战斗越来越凶险。巴克渐渐没了力气，斯匹茨便开始接连猛攻，一次次撞得他站立不稳。有一回，巴克终于失去平衡，眼看就要倒在雪地上。围成圆圈的六十条狗顿时全部起身，准备冲上来。可巴克几乎在半空中就重新站稳，那个圆圈只好再次伏了下去，耐心等候下一次机会。
        - id: ch06-b08
          speaker: narrator
          text: >-
            巴克却有一样能够造就强者的本领，那就是想象力。他不只靠本能战斗，也会观察，会动脑筋。他再次冲去，装得像是还要使出撞肩的旧招。可就在最后一刻，他忽然收住上身，猛然伏低，贴着雪面钻到近前，一口咬住斯匹茨的左前腿。骨头咔嚓碎裂，白狗只能靠三条腿面对他。
        - id: ch06-b09
          speaker: narrator
          text: >-
            巴克连续三次想把他撞倒，随后又使出同一招，咬断了他的右前腿。斯匹茨又痛又无力，仍然疯狂挣扎，拼命想用残废的前腿撑住身体，不肯倒下。他看着周围那个沉默的圆圈越收越紧。狗群的眼睛闪闪发亮，舌头垂在嘴外，银色的呼吸慢慢向上飘去。斯匹茨过去不止一次见过这样的圆圈合拢，把败在自己爪下的对手吞没。那时，他总是站在胜利的一边。只是这一次，被围在中央、再也无法逃走的失败者，已经变成了他自己。
        - id: ch06-b10
          speaker: narrator
          text: >-
            斯匹茨已经没有任何希望。巴克不会留情，仁慈只属于气候温和的地方。他小心移动，准备发动最后一击。包围圈越收越紧，狗群近得让巴克感到一道道呼吸扑在身体两侧。越过斯匹茨望去，后面和左右两边全是半蹲着等待扑出的狗。它们随时都会一跃而起，所有眼睛却仍旧盯着巴克，等他先决定胜负。
        - id: ch06-b11
          speaker: narrator
          text: >-
            四周忽然停了下来，连时间都像是凝固了。每只动物都纹丝不动，仿佛变成了雪地上的石头。只有斯匹茨浑身发抖，毛发倒竖，拖着两条断腿踉跄地来回退却。他仍在发出可怕的威胁，仿佛想用最后的咆哮吓退一步步逼近的死亡。
        - id: ch06-b12
          speaker: narrator
          text: >-
            巴克猛扑进去，又立即跳开。就在贴近对手的一瞬间，他的肩膀终于结结实实撞中了斯匹茨。月光照亮雪地，黑色的包围圈缩成一个黑点，斯匹茨消失在里面。
        - id: ch06-b13
          speaker: narrator
          text: >-
            巴克站在一旁看着。他赢得了这场争斗。占据上风的原始野兽完成了杀戮，并且从中感到了满足。
