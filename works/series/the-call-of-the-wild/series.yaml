cover_prompt: |-
  A wordless cover scene in the Klondike during the late nineteenth-century gold rush shows a powerful sled dog answering a distant wolf call beneath the northern lights. The dog has a broad chest, thick warm coat, brown markings across the head and muzzle, and a white rift down the chest, standing alert on a snowy ridge above a dark spruce valley. Far below, a small log camp and a resting wooden sled suggest the human trail he has left behind, while a lean gray wolf watches from the edge of the trees. The dog's lifted head and forward step toward the wilderness form the focal action, poised between firelit companionship and the open North. Use a wide low-angle composition with believable snow, forest, mountains, and moonlit sky, leaving broad calm room at the top. Keep the animals anatomically convincing, the equipment historically plausible for the 1890s, and the mood adventurous and inviting rather than frightening. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
