audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 生动沉稳，时刻留意逼近的危险
        timbre: 温暖浑厚，清晰有力
        pace: 从容有度
        pitch: 中音
    john_thornton:
      display_name: 约翰·桑顿
      tts:
        delivery: 沉着寡言，动怒时迸发出强烈力量
        timbre: 温厚坚实
        pace: 从容
        pitch: 中低音
    pete:
      display_name: 皮特
      tts:
        delivery: 朴实老练，说话直截了当
        timbre: 粗厚清楚
        pace: 适中
        pitch: 中低音
    hans:
      display_name: 汉斯
      tts:
        delivery: 寡言可靠，带一点明显的外乡口音
        timbre: 低沉结实
        pace: 稍慢
        pitch: 低音
    matthewson:
      display_name: 马修森
      tts:
        delivery: 精明自负，下注时刻意让众人听清
        timbre: 洪亮干脆
        pace: 适中
        pitch: 中音
    jim_obrien:
      display_name: 吉姆·奥布赖恩
      tts:
        delivery: 豪爽坦率，语气里带着谨慎
        timbre: 厚实爽朗
        pace: 适中
        pitch: 中低音
    skookum_king:
      display_name: 斯库库姆台地矿业大王
      tts:
        delivery: 激动热切，说话略有结巴
        timbre: 明亮高亢
        pace: 偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 火边的新生
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            去年十二月，约翰·桑顿冻伤了双脚。伙伴们把他安顿好，让他留下养伤，自己沿河去为道森砍木料、扎木排。桑顿救下巴克时，走路还微微有些跛。天气持续转暖，那点跛也慢慢不见了。漫长的春日里，巴克躺在河边，看水奔流，听鸟儿歌唱，也听着四周草木虫兽的低鸣，身体一点点恢复了力量。
        - id: ch01-b02
          speaker: narrator
          text: >-
            走过三千英里以后，这场休息来得再好不过。伤口愈合了，肌肉重新鼓起来，血肉又盖住骨头，巴克也确实越来越懒。其实，桑顿、巴克、斯基特和尼格都在悠闲度日。他们等着木排来，好顺流去道森。
        - id: ch01-b03
          speaker: narrator
          text: >-
            斯基特是一条小小的爱尔兰塞特犬。巴克还奄奄一息时，她就主动来亲近他。那时巴克连拒绝她的力气也没有。她有些狗天生具备的医者本领，每天早饭后都来舔净巴克的伤口，像母猫替小猫洗身子。这份差事是她自己揽下的，却一天也不耽误。后来，巴克盼她来照料，竟和盼桑顿一样急切。尼格是一条硕大的黑狗，有一半寻血猎犬、一半猎鹿犬的血统。他不那么爱表露亲热，可那双眼睛总像在笑，性情也宽厚得很。
        - id: ch01-b04
          speaker: narrator
          text: >-
            两条狗对巴克毫无妒意，这让他十分惊讶。它们仿佛也有桑顿那份仁厚与豁达。巴克渐渐强壮起来，它们就拉他玩各种傻乎乎的游戏，连桑顿也忍不住加入。巴克就这样同它们扑腾、追逐，一路嬉闹着走过康复期，也走进一种新的生活。他第一次感受到真正炽烈的爱。这感情不是普通的喜欢，而是会发热、会燃烧，能让他崇拜到近乎疯狂的爱。
        - id: ch01-b05
          speaker: narrator
          text: >-
            在圣克拉拉谷的米勒法官家里，他从没这样爱过谁。他陪法官的儿子们打猎远足，那是伙伴间一起做事。他守着法官的孙儿们，像个庄严的监护者。他与法官本人，也只是郑重体面的朋友。能唤醒这份灼热的爱，这份崇拜，甚至这份疯狂的，只有约翰·桑顿。
        - id: ch01-b06
          speaker: narrator
          text: >-
            桑顿救过他的命，单是这一点就已经很重。可桑顿更是他心中最理想的主人。别人照顾狗，是因为有责任，也因为需要狗做事，得让它们保持好状态。桑顿却把自己的狗当作孩子，因为他情不自禁就会这样待它们。他想到的也不只是吃食和伤病。他总有亲切的招呼，从不忘记说一句鼓劲的话，还喜欢坐下来同狗长谈。他管这叫“闲扯”，狗和他都乐在其中。
        - id: ch01-b07
          speaker: narrator
          text: >-
            桑顿常用双手粗鲁地夹住巴克的脑袋，把自己的头抵上去，前后摇晃，还低声骂些难听的话。巴克却知道，那全是爱称。这样的粗野拥抱，会让他快活得像是整颗心都要被摇出胸膛。等桑顿一松手，他便跳起来，嘴在笑，眼睛在说话，喉咙里震着发不出的声音，然后一动不动地站在那里。
        - id: ch01-b08
          speaker: john_thornton
          text: 天哪！你简直就要开口说话了！
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: >-
            巴克也有自己的爱法。他常把桑顿的手含进嘴里，用力合拢牙齿，过后好久还能看见齿痕。巴克把咒骂听成爱语，桑顿也把这假咬当作爱抚。
        - id: ch01-b10
          speaker: narrator
          text: >-
            不过，巴克多数时候只是远远崇拜桑顿。桑顿一摸他、一同他说话，他就欢喜得发狂，却从不主动讨要。他不像斯基特那样把鼻子拱到桑顿手下，一下又一下地顶，非等来抚摸不可，也不像尼格那样庄重地走过去，把大脑袋搁到桑顿膝上。他会警醒地伏在桑顿脚边，一连几小时仰望那张脸，仔细端详，追随着每一道短暂的神情和五官间每一点变化。有时他躺在侧后方，就望着那个人的轮廓，留意身体偶尔一动。
        - id: ch01-b11
          speaker: narrator
          text: >-
            他们常常就这样无声地心意相通。巴克的目光会把桑顿的头牵引过来。桑顿默默回望，心从眼睛里照出来，正像巴克的心也从眼睛里照出来一样。
        - id: ch01-b12
          speaker: narrator
          text: >-
            获救后很长一段日子，巴克都不肯让桑顿离开视线。桑顿一出帐篷，他就紧跟在脚后。主人换得太多，他已经害怕世上没有谁会永远留下。他怕桑顿也像佩罗、弗朗索瓦和苏格兰混血赶狗人那样，从他的生命里消失。连梦里也躲不开这份恐惧。他常在夜间惊醒，冒着寒气走到帐篷门帘前，站在那里，听主人的呼吸。
    - id: ch02
      title: 密林的召唤
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            巴克深爱桑顿，这份感情像是文明温柔的力量。可北方唤醒的原始血性，仍在他身体里鲜活地躁动。炉火与屋顶教给他的忠诚和奉献还在，野性与机警也没有消失。他不是一条被世代文明驯柔、身上处处留着驯化印记的南方家犬。他更像一个原本属于荒野的生灵，从荒野中走来，只因爱着桑顿，才暂时坐到这个人的火边。
        - id: ch02-b02
          speaker: narrator
          text: >-
            因为爱得太深，他绝不偷桑顿的东西。换成任何别的人、任何别的营地，他却连一瞬也不会犹豫。他又偷得极其狡猾，从来不让人抓住。
        - id: ch02-b03
          speaker: narrator
          text: >-
            许多狗的牙齿在他脸上和身上留下了伤痕。他打架仍旧凶狠，却比从前更加精明。斯基特和尼格性情太好，从不争斗，而且它们属于桑顿。可是陌生的狗无论什么品种，多么勇猛，要么马上承认巴克的地位，要么就得和这个可怕的对手拼命，挣扎着保住性命。
        - id: ch02-b04
          speaker: narrator
          text: >-
            巴克从不留情。棍棒与利齿的法则，他早已学得透彻。他从不放过优势，一旦把敌手推上通往死亡的路，也绝不后退。斯皮茨、警队和邮运队里的善战头狗都教过他，这里没有折中的路。不是制服对方，就是被对方制服。原始生命不懂慈悲。慈悲会被当成畏惧，而这种误会足以致命。杀死对方，或被对方杀死。吃掉对方，或被对方吃掉。这道从时间深处传来的命令，他始终服从。
        - id: ch02-b05
          speaker: narrator
          text: >-
            巴克比自己活过的岁月更老，也比自己呼吸过的次数更古老。他把往昔和此刻连在一起，身后无尽的永恒在体内有力地搏动，他也随着那节律起伏，像潮汐，也像四季。
        - id: ch02-b06
          speaker: narrator
          text: >-
            他坐在桑顿的火边，胸膛宽阔，牙齿雪白，长毛丰厚。可他的身后仿佛站着无数幽影，有半狼半犬的祖先，也有真正的野狼。它们催促他，驱策他，同他一起品尝肉的滋味，也为他喝下的水感到干渴。它们同他一起嗅风，一起倾听，还把林中野兽发出的声音告诉他。它们左右他的情绪，引导他的行动。他睡下，它们也睡下。他做梦，它们走进梦里，又越过他的梦境，最后化成了梦本身。
        - id: ch02-b07
          speaker: narrator
          text: >-
            幽影召唤得如此强硬，人类和人类对他的要求便一天比一天远。密林深处总有一个声音在呼唤。那声音神秘、颤动，又充满诱惑。每当听见，巴克就想背转炉火，离开踩硬的土地，一头扎进森林，不停地向前。他不问去哪里，也不问为什么。可是每当脚掌踏上柔软、无人走过的泥土，进入青翠的树荫，对桑顿的爱又会把他拉回火边。
        - id: ch02-b08
          speaker: narrator
          text: >-
            只有桑顿能留住他。其余人类对他什么也不是。偶然路过的旅人夸他、摸他，他表面任由对方亲近，心里始终冷冷淡淡。有人热情过了头，他还会干脆起身走开。汉斯和皮特终于乘着大家久候的木排来到时，巴克起初根本不肯理他们。等他明白两人同桑顿十分亲近，才肯消极地容忍下来。他接受两人的好意时，那神气倒像不是别人给了他什么，而是自己肯接受，赏了他们脸面。
        - id: ch02-b09
          speaker: narrator
          text: >-
            汉斯和皮特与桑顿是同一类人。他们贴近土地生活，想得简单，看得明白。木排还没进入道森锯木厂旁的大回水湾，他们就懂了巴克的脾气，不再强求他像斯基特和尼格那样亲昵。
        - id: ch02-b10
          speaker: narrator
          text: >-
            巴克对桑顿的爱却仍在增长。夏天赶路，所有人当中只有桑顿能把驮包放到他背上。只要桑顿开口，再难的事他也肯做。有一天，三个男人卖掉木排，用所得的钱备足粮食，离开道森，朝塔纳纳河源头进发。途中，人和狗坐在一座悬崖顶上。崖壁从他们脚下笔直落下三百英尺，最下面就是一片裸露的岩床。
        - id: ch02-b11
          speaker: narrator
          text: >-
            桑顿坐在崖边，巴克守在肩旁。桑顿忽然冒出一个不假思索的念头。他先让汉斯和皮特看着，随后把手臂朝深渊一挥。
        - id: ch02-b12
          speaker: john_thornton
          text: 跳下去，巴克！
        - id: ch02-b13
          speaker: narrator
          text: >-
            巴克当即扑向崖外。桑顿在最边缘死死抱住他，汉斯和皮特再抓住他们两个，拼命拖回安全的地方。事情过去，大家终于喘过气来。
        - id: ch02-b14
          speaker: pete
          text: 这也太邪门了。
          emotion: surprised
        - id: ch02-b15
          speaker: john_thornton
          text: 不，这是了不起。可也很可怕。你知道吗？有时候连我都害怕。
        - id: ch02-b16
          speaker: pete
          text: 有他守着你，我可不想做那个敢碰你一根指头的人。
        - id: ch02-b17
          speaker: hans
          text: 天老爷！我也不想。
    - id: ch03
      title: 巴克的守护
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            还没到年末，皮特的担心就在环形城成了真。“黑脸”伯顿恶毒又暴躁，正在酒吧里找一个新手的麻烦。桑顿好心上前劝解。巴克照旧伏在角落，头枕前爪，看着主人的每个动作。伯顿突然抡出一拳。桑顿被打得旋转着跌开，只靠抓住吧台栏杆才没倒下。
        - id: ch03-b02
          speaker: narrator
          text: >-
            旁观的人听见一声怒吼。那不是狗吠，也不是哀叫。巴克从地面腾空而起，直扑伯顿的喉咙。伯顿本能地抬起手臂，才保住了命，却被巴克压着仰面摔倒。巴克松开咬住手臂的牙齿，再次咬向喉头。这回伯顿只挡住一部分，喉咙还是被撕开了。
        - id: ch03-b03
          speaker: narrator
          text: >-
            人群一拥而上，终于赶开巴克。外科医生俯身为伯顿止血时，巴克还在附近来回徘徊，狂怒地低吼。他一次次试图冲回去，又一次次被一排带着敌意的棍棒逼退。人们当场召开矿工大会，查清事情经过后，认定巴克受到了足够的挑衅，判这条狗无罪。伯顿活了下来，巴克的威名也就此立下。从那天起，他的名字传遍阿拉斯加每一处营地。
        - id: ch03-b04
          speaker: narrator
          text: >-
            那年秋天稍晚些时候，巴克又用另一种方式救了桑顿。三个伙伴正控制一条狭长的撑篙船，让它沿四十英里溪的险恶急流向下。汉斯和皮特走在岸边，把细马尼拉麻绳从一棵树换系到另一棵树上，牵制船速。桑顿留在船里，用长篙帮着掌控方向，还高声向岸上发出指示。巴克焦急地跟船并行，眼睛一刻也不离开主人。
        - id: ch03-b05
          speaker: narrator
          text: >-
            前方一道几乎淹没的岩脊伸进河中。汉斯解开绳子，桑顿撑船驶向河心。汉斯握着绳头沿岸奔跑，等船绕过岩脊再拉绳减速。船绕过去了，却被磨坊水道般的急流卷走。汉斯把绳子收得太猛，船身一甩，底朝天翻向岸边。桑顿被整个抛进水里，冲向最险恶的急滩。那片水域里，再好的游泳手也活不了。
        - id: ch03-b06
          speaker: narrator
          text: >-
            巴克立刻跃入激流，在疯狂旋转的水里追出三百码，终于赶上桑顿。感觉桑顿抓住自己的尾巴，他便转向岸边，用尽雄健身体里的全部力量。可他们靠近岸边很慢，冲向下游却快得惊人。前方传来致命的轰鸣。那里的激流更加狂野，一排岩石像巨梳的利齿伸出，把水撕成碎浪和水雾。最后一段陡落开始吞吸河水，力量骇人。
        - id: ch03-b07
          speaker: narrator
          text: >-
            桑顿知道岸边已经去不了。他先擦过一块岩石，又撞上第二块，接着狠狠撞向第三块。他双手抓住湿滑的石顶，放开巴克，在翻腾的水声上大喊。
        - id: ch03-b08
          speaker: john_thornton
          text: 走，巴克！快走！
        - id: ch03-b09
          speaker: narrator
          text: >-
            巴克敌不过激流，被卷向下游。他拼命挣扎，却游不回去。桑顿再次命令，他便把半个身子探出水面，高高昂头，像是要看最后一眼，随后服从地转向岸边。皮特和汉斯把他拖上岸。再往下一点，游泳便再无可能，只剩毁灭。
        - id: ch03-b10
          speaker: narrator
          text: >-
            他们知道，桑顿只能在湿滑的岩石上坚持几分钟。两人沿岸向上游狂奔，把控制船的绳索缚在巴克颈项和双肩上，既不勒住他，也不妨碍游水，然后把他送进河里。巴克勇猛地游出去，却没有斜着深入河心。等他明白过来，桑顿已和他横向齐平，只隔六次划水的距离，而他正无可挽回地漂过去。
        - id: ch03-b11
          speaker: narrator
          text: >-
            汉斯像牵制船只那样猛然收绳。绳子在激流里一紧，巴克便被拽进水底。他始终沉在水下，直到身体撞上河岸，才终于被拉出来。他已经半溺死了。汉斯和皮特一起扑在他身上，用力拍打挤压，把气送回肺里，也把水挤出来。他摇摇晃晃地站起，随即又倒了下去。
        - id: ch03-b12
          speaker: narrator
          text: >-
            远处传来桑顿微弱的声音。两人听不清他喊什么，却知道他已到了最危险的时刻。那声音像电流击中巴克。他一跃而起，冲在两人前面，跑回刚才下水的地方。
        - id: ch03-b13
          speaker: narrator
          text: >-
            绳子再次系好，巴克再次入水。这回他笔直斜向河心。错过一次，他绝不犯第二次。汉斯一点点放出绳子，不许它有丝毫松弛。皮特在旁边把每个绳圈理开，不让它缠住。巴克一直游到桑顿正上游的一条直线上，随即掉头，像特快列车一样冲下来。
        - id: ch03-b14
          speaker: narrator
          text: >-
            激流推着巴克，像攻城槌一样把他撞向桑顿。桑顿双臂一合，紧抱住那毛茸茸的脖子。汉斯把绳子绕上树干，骤然收紧，两人一狗都被拉进水下。他们时而一个在上，时而另一个在上，呛水，窒息，被拖过尖利的河床，撞上岩石和沉木，最后终于转向岸边。
        - id: ch03-b15
          speaker: narrator
          text: >-
            桑顿醒来时，正脸朝下伏在一根漂木上。汉斯和皮特用力把他前后推动，让他吐出河水、重新呼吸。他恢复知觉后的第一眼就寻找巴克。巴克软绵绵地躺着，一动不动，看起来像是已经死了。尼格守在旁边扬起头长声哀号，斯基特则不停舔着他湿透的脸，还有那双紧闭的眼睛。
        - id: ch03-b16
          speaker: narrator
          text: >-
            桑顿自己也遍体是伤。巴克醒来以后，他立刻摸遍巴克全身，发现断了三根肋骨。
        - id: ch03-b17
          speaker: john_thornton
          text: 就这么定了。我们就在这里扎营。
        - id: ch03-b18
          speaker: narrator
          text: >-
            他们果然留在原地，直到巴克的肋骨长好，能够继续赶路。
    - id: ch04
      title: 一千磅的赌约
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            那年冬天，巴克在道森又做成了一件大事。这一次也许不算英勇，却让他的名声在阿拉斯加声望的图腾柱上又高了许多。三个伙伴尤其高兴，因为这件事替他们赢来了所需的装备，让他们终于能够动身，深入东方那片还没有淘金者踏足的处女地。他们盼望这趟旅程已经很久了。
        - id: ch04-b02
          speaker: narrator
          text: >-
            一切起于埃尔多拉多酒馆。男人们都在吹嘘自己的狗。巴克名声太响，成了众人攻击的目标，桑顿只得竭力为他辩护。半小时后，一个人说自己的狗能拉动五百磅，第二个人说能拉六百磅，第三个人则夸口七百磅。
        - id: ch04-b03
          speaker: john_thornton
          text: 哈！巴克能拉动一千磅。
        - id: ch04-b04
          speaker: matthewson
          text: 他能把雪橇从冻雪里挣开，再拖着走一百码？
        - id: ch04-b05
          speaker: narrator
          text: >-
            问话的是马修森，富矿区的一位矿业大王。刚才夸下七百磅海口的正是他。
        - id: ch04-b06
          speaker: john_thornton
          text: 能挣开，也能走一百码。
        - id: ch04-b07
          speaker: matthewson
          text: 好。我拿一千美元赌他办不到。钱就在这儿。
        - id: ch04-b08
          speaker: narrator
          text: >-
            马修森故意一字一句，让所有人都听清，接着把一袋大红肠那么粗的金沙砰地拍上吧台。酒馆里没人说话。桑顿的虚张声势，如果那真是虚张声势，已经被人当面将住。他感到热血涌上脸颊。是舌头骗了他，他根本不知道巴克能不能拉动一千磅。
        - id: ch04-b09
          speaker: narrator
          text: >-
            半吨！光是想到这个重量就令他心惊。他一直相信巴克的力量，也不止一次想过，巴克也许能拉动这么重的雪橇。可那终究只是一个想法。现在，十来双眼睛都盯着他，四周安静得人人都在等他的回答，他才第一次真正面对巴克到底能不能做到。更糟的是，他手里根本没有一千美元，汉斯和皮特也拿不出这笔钱。
        - id: ch04-b10
          speaker: matthewson
          text: 外面正好停着一架雪橇，上面有二十袋面粉，每袋五十磅。所以你别拿这个当借口。
        - id: ch04-b11
          speaker: narrator
          text: >-
            桑顿答不上来。他茫然地望过一张张脸，像是脑子忽然停住，正寻找什么东西让它重新转起来。这时，他看见老伙伴吉姆·奥布赖恩。奥布赖恩是乳齿象区的矿业大王。那张熟悉的脸仿佛一个提示，催他去做平时做梦都想不到的事。
        - id: ch04-b12
          speaker: john_thornton
          text: 能借我一千美元吗？
        - id: ch04-b13
          speaker: narrator
          text: >-
            桑顿的声音低得几乎像耳语。
        - id: ch04-b14
          speaker: jim_obrien
          text: 当然。不过约翰，说实话，我可不大信这头牲口真办得到。
        - id: ch04-b15
          speaker: narrator
          text: >-
            奥布赖恩把一个鼓鼓的钱袋拍在马修森的钱袋旁。随后，整个酒馆的人都涌到街上看试验。桌边空了，连发牌人和赌场看守也跑出来看结果，顺便下注。几百个裹着毛皮、戴着手套的男人围住雪橇，站在不妨碍试验的距离外，中间留出一圈空地。
        - id: ch04-b16
          speaker: narrator
          text: >-
            那架雪橇载着一千磅面粉，已经停了两个钟头。天气是零下六十度，橇板牢牢冻在踩实的雪上。有人开出二赔一，赌巴克挪不动雪橇。大家又争论起“挣开”到底是什么意思。奥布赖恩说，桑顿有权先敲松冻住的橇板，再让巴克面对完全静止的雪橇，凭自己的力量把它拉动。马修森却坚持，这个词本来就包括挣脱冻雪的钳制，巴克必须连这一步也独自完成。见证赌约的大多数人支持马修森，巴克失败的赔率升到三赔一。
        - id: ch04-b17
          speaker: narrator
          text: >-
            还是没人押巴克赢。桑顿本就满心疑虑，如今亲眼看见雪橇，也看见原本拉它的十条狗蜷在前方，更觉得不可能。马修森越发得意。
        - id: ch04-b18
          speaker: matthewson
          text: 三赔一！桑顿，我再拿一千美元按这个赔率跟你赌。怎么样？
        - id: ch04-b19
          speaker: narrator
          text: >-
            桑顿脸上的疑虑清清楚楚，心里的好斗之气却被激了起来。这股精神一旦升起，便压过一切胜算，不承认世上有不可能，也听不见战斗以外的声音。他叫来汉斯和皮特。两人的钱袋都很瘪，加上桑顿自己的，三个伙伴掏空所有钱，也只有两百美元。他们正处在最穷困的时候，这笔钱已经是全部家底，可他们毫不犹豫地押了出去，对赌马修森的六百美元。
    - id: ch05
      title: 巴克应战
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            人们解下原来拉橇的十条狗，给巴克套上自己的挽具，让他独自站到雪橇前。周围的兴奋也传给了巴克。他感到自己必须为约翰·桑顿做成一件了不起的事。
        - id: ch05-b02
          speaker: narrator
          text: >-
            人群望着他的雄伟身姿，发出赞叹。他正处在最完美的状态，身上没有一盎司赘肉。一百五十磅体重，每一磅都是坚韧和力量。皮毛像丝绸一样闪亮。颈项和肩头的鬃毛虽还平伏着，却有一半竖立起来，仿佛充盈全身的精力让每根毛都活了。
        - id: ch05-b03
          speaker: narrator
          text: >-
            宽阔的胸膛和粗壮的前腿，同身体恰好相称。皮肤下面，肌肉一团团紧紧隆起。男人们伸手摸过，都说硬得像铁。赔率于是又降回二赔一。
        - id: ch05-b04
          speaker: skookum_king
          text: 老天，先生！试验以前我就出八百美元买他！就照他现在这样，八百美元！
          emotion: surprised
        - id: ch05-b05
          speaker: narrator
          text: >-
            说话的是一位刚发迹的斯库库姆台地矿业大王。桑顿摇摇头，走到巴克身旁。
        - id: ch05-b06
          speaker: matthewson
          text: 你得离他远点儿。让他自由施展，也把地方留够。
        - id: ch05-b07
          speaker: narrator
          text: >-
            人群静下来，只剩赌徒还在徒劳地叫喊二赔一。谁都承认巴克威风凛凛，可那二十袋面粉看上去实在太沉，沉得没人肯解开钱袋。
        - id: ch05-b08
          speaker: narrator
          text: >-
            桑顿跪在巴克身旁，双手捧住他的头，把脸颊贴在他脸上。这一次，他没有像往常那样摇晃巴克，也没有低声说那些温柔的咒骂。他只凑近巴克耳边，轻轻说了一句话。
        - id: ch05-b09
          speaker: john_thornton
          text: 巴克，看在你爱我的份上。看在你爱我的份上。
        - id: ch05-b10
          speaker: narrator
          text: >-
            巴克呜咽一声，强压着满心急切。人群好奇地看着，觉得这件事越来越神秘，简直像一场施法。桑顿起身时，巴克把他戴着手套的手含进嘴里，牙齿慢慢用力，又恋恋不舍地松开。这不是用话语，而是用爱作出的回答。桑顿远远退开。
        - id: ch05-b11
          speaker: john_thornton
          text: 来吧，巴克。
        - id: ch05-b12
          speaker: narrator
          text: >-
            巴克先绷紧挽索，又让它松开几英寸。这是他学会的起步办法。
        - id: ch05-b13
          speaker: john_thornton
          text: 右转！
        - id: ch05-b14
          speaker: narrator
          text: >-
            桑顿的声音清脆地划破寂静。巴克猛地向右一摆，最后一扑，收尽松弛的挽索。一百五十磅的身体骤然停住，重重一震。雪橇颤动起来，橇板下传出清亮的碎裂声。
        - id: ch05-b15
          speaker: john_thornton
          text: 左转！
        - id: ch05-b16
          speaker: narrator
          text: >-
            巴克向左做了一遍。碎裂声变成断响，雪橇转过一点，橇板横着摩擦，挪出了几英寸。雪橇挣脱了冻雪。男人们全都屏住呼吸，紧张得自己也不知道。
        - id: ch05-b17
          speaker: john_thornton
          text: 现在，走！
        - id: ch05-b18
          speaker: narrator
          text: >-
            命令像枪声一样炸响。巴克纵身向前，猛冲一下，挽索震得笔直。他整个身体紧密地聚成一股惊人的力量。丝绸般的皮毛下面，肌肉一团团扭动、绞紧，仿佛活物。宽阔的胸膛压得贴近地面，头向前、向下俯着，四只脚疯狂飞动，爪子在踩实的硬雪上划出一道道平行沟槽。
        - id: ch05-b19
          speaker: narrator
          text: >-
            雪橇摇晃、颤抖，刚刚开始前进。巴克有一只脚突然打滑，人群里立刻有人呻吟出声。紧接着，雪橇又向前一冲。它看上去像是一顿一顿地挪动，其实从那一刻起，再也没有完全停下。先是半英寸，接着一英寸，再接着两英寸。一下又一下的顿挫越来越小。雪橇渐渐有了冲势，巴克便追上它的节奏，把每一次向前的力量接在一起，终于拖着一千磅面粉稳稳走了起来。
    - id: ch06
      title: 为了爱
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            男人们猛吸一口气，这才重新呼吸。谁也没有发现，自己刚才一度连气都忘了喘。桑顿跟在巴克身后奔跑，用简短快活的话不停鼓励他。
        - id: ch06-b02
          speaker: narrator
          text: >-
            一百码早已量好，终点由一堆木柴标出。桑顿在巴克后面跑着，他们越来越接近木柴，欢呼声也越来越响。巴克越过终点，听从命令停下时，那渐强的欢呼猛然爆发，变成一片震耳的咆哮。
        - id: ch06-b03
          speaker: narrator
          text: >-
            每个人都失去了控制，连输掉赌局的马修森也一样。帽子和手套纷纷飞上半空。男人们碰见谁就同谁握手，根本不管那人是谁。欢呼、叫喊和笑声混成一片，人人都兴奋得语无伦次，只顾把满心的激动一股脑喊出来。
        - id: ch06-b04
          speaker: narrator
          text: >-
            桑顿却跪在巴克身边，头抵着头，把他前后摇晃。赶来的人听见桑顿一直咒骂巴克。那些话说得热烈、低柔，又满怀深情。
        - id: ch06-b05
          speaker: skookum_king
          text: 老天，先生！我出一千美元买他！一千美元——不，一千二百美元！
          emotion: surprised
        - id: ch06-b06
          speaker: narrator
          text: >-
            桑顿站起来。他眼睛湿了，泪水毫不遮掩地淌过脸颊。
        - id: ch06-b07
          speaker: john_thornton
          text: 先生，不卖。您下地狱去吧。这是我能给您的最好答复。
        - id: ch06-b08
          speaker: narrator
          text: >-
            巴克一口含住桑顿的手，桑顿又前后摇晃着他。旁观的人像是同时明白了什么，一齐怀着敬意退开。从此再也没有谁不识趣地上前，打扰他们之间的爱。
