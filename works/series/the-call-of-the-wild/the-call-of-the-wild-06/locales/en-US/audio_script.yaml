  chapters:
    - id: ch01
      title: "Chapter VI. For the Love of a Man"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            John Thornton had frozen his feet the previous December. His partners made him comfortable, then went upriver to cut saw logs for a raft to Dawson. He still limped a little when he rescued Buck, but the warm weather soon took even that away. Through the long spring days, Buck lay beside him on the riverbank. He watched the running water, listened to the birds and the low hum of the living world, and slowly gathered his strength again.
        - id: ch01-b02
          speaker: narrator
          text: >-
            After three thousand miles of travel, rest felt very good. As Buck's wounds closed, his muscles filled out and flesh covered his bones, he grew lazy. So did Thornton, Skeet, and Nig. They were all waiting for the raft that would carry them down to Dawson. Skeet was a small Irish setter who had befriended Buck while he was too near death to object. She had the healing instinct some dogs possess. Each morning after breakfast, she washed and cleaned his wounds as carefully as a mother cat washing her kittens. Before long, Buck expected her care almost as much as Thornton's. Nig was just as friendly, though quieter about it. He was a huge black dog, half bloodhound and half deerhound, with laughing eyes and endless good nature.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Neither dog showed any jealousy. They seemed to carry the same generous kindness as John Thornton. As Buck recovered, they coaxed him into absurd games, and Thornton could never resist joining them. Buck romped out of sickness and into a new life. For the first time, he knew real, passionate love. He had never felt it at Judge Miller's home in the sunny Santa Clara Valley. Hunting with the Judge's sons had been a working partnership. Guarding the grandsons had been a proud duty, and his bond with the Judge had been a dignified friendship. But only John Thornton awakened this burning devotion in him.
            This was more than friendship or duty. It was adoration, fierce enough to feel like madness.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Thornton had saved his life, but that was only part of it. Other men cared for their dogs because duty or business required it. Thornton cared for his as if they were his own children, simply because that was his nature. He always had a friendly word for them. He loved sitting down for what he called a good long gas with them, and they loved it too. He would catch Buck's head between his hands, press his own head against it, and shake Buck back and forth while murmuring insults that Buck understood as love names. Nothing delighted Buck more. Every shake seemed ready to toss his heart out of his body. When Thornton let go, Buck would leap up with laughter in his mouth, meaning in his eyes, and a sound trembling in his throat that he could never quite release. Then he would stand perfectly still.
            Thornton never treated care as a task to finish. A greeting, a word of encouragement, or time spent talking with the dogs mattered to him as much as food and shelter did.
        - id: ch01-b05
          speaker: john_thornton
          text: "God! You can almost speak!"
          emotion: surprised
        - id: ch01-b06
          speaker: narrator
          text: >-
            Buck answered love in a way that looked almost painful. He often took Thornton's hand between his teeth and bit down so hard that the marks remained in the flesh. Buck knew the man's curses were loving words, and Thornton knew this make-believe bite was a caress.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Most often, though, Buck showed his love through worship. He went wild with joy whenever Thornton touched or spoke to him, yet he never begged for attention. Skeet would push her nose under Thornton's hand until he petted her. Nig would walk over and lay his great head on Thornton's knee. Buck was content to love from a distance. For hours he lay alert at Thornton's feet, staring into his face and following every passing expression. Sometimes he lay off to one side or behind him, studying the shape of the man and each small movement of his body. Their bond ran so deep that Buck's steady gaze would often make Thornton turn. The two would look at one another without a word, and each one's heart seemed to shine from his eyes.
            Buck missed nothing. A shift of Thornton's features, a turn of his head, or the smallest movement held Buck's full attention.
        - id: ch01-b08
          speaker: narrator
          text: >-
            For a long while after the rescue, Buck hated to lose sight of him. If Thornton left the tent, Buck followed at his heels until he returned. Too many masters had passed through Buck's life in the Northland. Now he feared that no master could remain. Perhaps Thornton would disappear as Perrault, François, and the Scotch half-breed had done. That fear followed him into his dreams. He would wake at night, creep through the cold to the tent flap, and stand there listening until he heard Thornton breathe.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Yet all this love did not tame the wild strain the Northland had awakened in Buck. He possessed the loyalty born beside fires and beneath roofs, but he kept his wildness and cunning too. He was a creature of the wild who had come in to sit beside Thornton's fire, not a soft Southland dog shaped by generations of civilized life. He loved Thornton too much to steal from him. In any other camp, from any other man, he stole without hesitation, and he was clever enough not to be caught.
            The two sides of him lived together. The fire taught devotion, while the wilderness taught him to survive by watchfulness and trickery. Loving one man did not erase what the trail had made him.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Teeth had scarred Buck's face and body many times. He still fought fiercely, but now he fought with greater skill. Skeet and Nig were too good-natured to quarrel, and they belonged to Thornton. Any strange dog, however brave or powerful, quickly accepted Buck's rule or found itself fighting for life. Buck gave no mercy. He had learned the law of club and fang. From Spitz and the strongest police and mail dogs, he had learned there was no middle ground. He must master or be mastered. In that ancient life, mercy could look like fear, and such a mistake could bring death. Kill or be killed, eat or be eaten. That was the command rising from the depths of time, and Buck obeyed it.
            Once he entered a fight, he never surrendered an advantage or backed away from an enemy already driven toward death. Breed and courage made no difference. A strange dog either yielded quickly or discovered what Buck had learned through every brutal lesson in the North.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Buck was older than the days he had lived or the breaths he had taken. The past joined the present inside him, beating with a rhythm as mighty as the tides and seasons. A broad-chested, white-fanged, long-haired dog sat beside Thornton's fire. Behind him moved the shadows of countless dogs, half-wolves, and wild wolves. They tasted his meat and thirsted for his water. They raised their noses with his into the wind and listened beside him to the forest. They shaped his moods and guided his actions. When he slept, they lay down with him, dreamed with him, and became the substance of his dreams.
            Their lives reached through him from an age beyond memory. What stirred in Buck was not one animal's experience alone, but an ancient rhythm that had always moved with changing seasons and returning tides.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Those shadows called so strongly that each day mankind's hold slipped farther away. Deep in the forest, another call sounded. It thrilled and tempted him. Again and again, it urged him to leave the fire and the trampled ground and plunge beneath the trees, running onward without knowing where or why. He never stopped to ask. But each time his paws reached the soft, untouched earth and green shade, his love for John Thornton drew him back to the fire.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Thornton alone could hold him. The rest of humanity meant nothing. Travellers might praise or pet him, but Buck remained cold. If a man became too affectionate, Buck simply rose and walked away. When Thornton's partners, Hans and Pete, finally arrived on the raft, Buck ignored them until he understood how close they were to Thornton. Then he tolerated them and accepted their kindness as though he were doing them a favor. They were much like Thornton, men who lived close to the earth, thought simply, and saw clearly. By the time they guided the raft into the great eddy beside Dawson's sawmill, they understood Buck. They never demanded the closeness he shared with Skeet and Nig.
            Their friendship with Thornton was the only reason Buck first allowed them near. Even afterward, he received their favors with grave reserve, never offering the easy affection that the other dogs gave them.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Buck's love for Thornton kept growing. Thornton was the only man who could place a pack on his back during summer travel. If Thornton commanded it, no task seemed too great. After selling the raft, the three men bought supplies and left Dawson for the headwaters of the Tanana. One day, the men and dogs rested on top of a cliff. Bare rock lay three hundred feet below. Thornton sat near the edge with Buck beside him. A reckless idea came to him, and he made Hans and Pete watch.
        - id: ch01-b15
          speaker: john_thornton
          text: "Jump, Buck!"
        - id: ch01-b16
          speaker: narrator
          text: >-
            Thornton swept his arm out over the drop. In the next instant he was clutching Buck at the very edge, while Hans and Pete hauled both of them back to safety. When it was over, the men had to catch their breath.
        - id: ch01-b17
          speaker: pete
          text: "There's something unnatural about that."
          emotion: surprised
        - id: ch01-b18
          speaker: narrator
          text: "Thornton shook his head."
        - id: ch01-b19
          speaker: john_thornton
          text: >-
            No. It's magnificent, and it's terrible too. Sometimes it frightens me.
        - id: ch01-b20
          speaker: pete
          text: >-
            I wouldn't want to be the man who touched you with Buck nearby.
        - id: ch01-b21
          speaker: hans
          text: "By Jingo! Neither would I."
        - id: ch01-b22
          speaker: narrator
          text: >-
            Before the year ended, Pete's warning came true at Circle City. A vicious man called Black Burton was trying to start a fight with a newcomer at the bar. Thornton stepped between them in a friendly attempt to stop it. Buck lay in a corner with his head on his paws, watching every move Thornton made. Without warning, Burton drove a fist straight from his shoulder. The blow sent Thornton spinning, and only a grip on the bar rail kept him from falling.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The witnesses heard something that was neither bark nor yelp, but a roar. Buck rose through the air from the floor and flew at Burton's throat. Burton saved his life by throwing up an arm, though Buck's weight hurled him backward. Buck released the torn arm and struck again for the throat. Burton only partly blocked him this time, and Buck ripped the man's throat open. The crowd swarmed Buck and beat him away. While a surgeon stopped the bleeding, Buck paced and growled with fury, repeatedly trying to charge. A wall of clubs forced him back.
            He never forgot that Burton had struck Thornton without warning. Even after the man lay wounded and the room filled with people, Buck kept searching for a way through the clubs to reach him again.
        - id: ch01-b24
          speaker: narrator
          text: >-
            The miners held a meeting on the spot. They ruled that Buck had been provoked and let him go. From that day forward, his name travelled through every camp in Alaska.
        - id: ch01-b25
          speaker: narrator
          text: >-
            That fall, Buck saved Thornton's life in a very different way. The three partners were guiding a long, narrow boat down dangerous rapids on Forty-Mile Creek. Hans and Pete walked the bank, looping a thin Manila rope from tree to tree to control the boat. Thornton stayed aboard with a pole and called instructions to shore. Buck followed along the bank, tense and worried, never taking his eyes from his master.
        - id: ch01-b26
          speaker: narrator
          text: >-
            At one especially dangerous place, a shelf of nearly submerged rocks reached into the river. Hans freed the rope. As Thornton poled the boat into the stream, Hans ran down the bank with the rope end, ready to check it after it cleared the rocks. The boat made it past and shot downstream in a current as fast as a millrace. Hans stopped it too sharply. The boat flipped and struck the bank upside down. Thornton was thrown clear and swept toward the worst stretch of rapids, wild water where no swimmer could survive.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Buck jumped at once. After three hundred yards through the mad, swirling water, he caught up. Thornton seized his tail, and Buck turned toward shore with all his strength. They crept sideways very slowly while the river carried them downward with terrifying speed. Ahead came a fatal roar. The current shattered into foam against rocks that rose like the teeth of a giant comb. As the water dragged them toward the final steep drop, Thornton knew they could not reach shore. He scraped across one rock, struck another, then crashed hard against a third. He caught its slippery top with both hands and let Buck go.
            Water sucked at them as the river tilted into that last pitch. Thornton was bruised by the second rock and nearly crushed against the third, but somehow his hands found a hold where the racing current could not tear him away at once.
        - id: ch01-b28
          speaker: john_thornton
          text: "Go, Buck! Go!"
          emotion: fearful
        - id: ch01-b29
          speaker: narrator
          text: >-
            Buck could not hold his place. The river swept him onward no matter how desperately he fought. Thornton shouted the command again. Buck lifted partway out of the water and raised his head as if taking one last look. Then he obeyed and turned for shore. He swam powerfully. Pete and Hans dragged him out at the final point where any swimmer could escape alive.
        - id: ch01-b30
          speaker: narrator
          text: >-
            A man could cling to that slick rock against the driving water for only a few minutes. Hans and Pete raced upstream to a place well above Thornton. They fastened the boat rope around Buck's neck and shoulders, careful not to choke him or hinder his stroke, and launched him again. Buck went bravely, but he did not angle far enough into the current. He realized too late. When Thornton came level with him, they were only six strokes apart, and Buck was being helplessly carried past.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Hans checked the rope as if Buck were the boat. It snapped tight in the current and jerked Buck below the surface. He stayed under until his body struck the bank and the men hauled him out. Half drowned, Buck lay while Hans and Pete pounded air into him and water out. He staggered upright, then collapsed. From the river came the faint sound of Thornton's voice. The words were lost, but the men knew his strength was failing. That voice struck Buck like electricity. He sprang up and ran ahead of them to the launch point.
        - id: ch01-b32
          speaker: narrator
          text: >-
            They tied the rope on once more and sent him out. This time Buck drove straight into the stream. He had made one mistake and would not repeat it. Hans fed out the rope without allowing slack, while Pete kept it free of tangles. Buck fought forward until he reached a line directly above Thornton. Then he turned and raced down on him like an express train. Thornton saw him coming. Buck struck with the whole river behind him, and Thornton locked both arms around his shaggy neck.
            Every part of the second attempt depended on the first one's lesson. Buck held his angle against the current, Hans kept steady control of the line, and Pete made sure no coil could catch when Thornton's life depended on it.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Hans wrapped the rope around a tree. Buck and Thornton were ripped beneath the water. Choking and gasping, first one on top and then the other, they scraped across the jagged bottom and smashed into rocks and snags as the rope swung them toward shore.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Thornton woke facedown across a drift log while Hans and Pete rolled him violently back and forth. He looked first for Buck. Nig howled over Buck's limp body while Skeet licked his wet face and closed eyes. Thornton was battered himself, but as soon as Buck revived, he carefully examined him and found three broken ribs.
        - id: ch01-b35
          speaker: john_thornton
          text: "That settles it. We camp here."
        - id: ch01-b36
          speaker: narrator
          text: >-
            And they stayed until Buck's ribs had joined and he could travel again.
        - id: ch01-b37
          speaker: narrator
          text: >-
            That winter in Dawson, Buck performed another feat. It was less heroic, perhaps, but it lifted his name even higher in Alaska. It also pleased the three partners because the winnings supplied what they needed for a long-planned journey into the untouched East, where no miners had gone. It began in the Eldorado Saloon, where men were boasting about their dogs. Buck's reputation made him a target, and Thornton defended him stubbornly. One man claimed his dog could start a five-hundred-pound sled and pull it away. Another claimed six hundred, and a third boasted of seven hundred.
            For half an hour, every new claim pushed the talk higher. Each man measured his favorite dog against Buck, and each boast forced Thornton to answer until pride carried him beyond anything he had proved.
        - id: ch01-b38
          speaker: john_thornton
          text: "Pooh! Buck can start a thousand pounds."
        - id: ch01-b39
          speaker: matthewson
          text: >-
            Can he break it free and pull it a hundred yards?
        - id: ch01-b40
          speaker: john_thornton
          text: >-
            He can break it free and pull it a hundred yards.
        - id: ch01-b41
          speaker: matthewson
          text: >-
            Then I've got a thousand dollars that says he can't. There it is.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Matthewson spoke slowly so everyone could hear, then slammed a thick sack of gold dust onto the bar. No one answered. Thornton's boast had been challenged. Heat rose into his face. His own tongue had trapped him. He did not know whether Buck could start a thousand pounds. Half a ton seemed enormous. He trusted Buck's strength and had often imagined him moving such a load, but now the test was real and a dozen silent men were watching. Worse still, neither Thornton nor Hans nor Pete had a thousand dollars.
        - id: ch01-b43
          speaker: matthewson
          text: >-
            There's a sled outside with twenty fifty-pound sacks of flour. The load is ready, so that won't stop you.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Thornton had no reply. He stared from face to face, unable to think, searching for something that might start his mind again. Then he saw Jim O'Brien, an old friend, and the sight pushed him toward something he would never otherwise have attempted.
            When he finally spoke, his voice was almost a whisper.
        - id: ch01-b45
          speaker: john_thornton
          text: "Could you lend me a thousand?"
        - id: ch01-b46
          speaker: narrator
          text: >-
            O'Brien lifted his heavy sack of gold and brought it down beside Matthewson's.
        - id: ch01-b47
          speaker: jim_obrien
          text: >-
            Sure. Though I don't have much faith that the beast can manage it, John.
        - id: ch01-b48
          speaker: narrator
          text: >-
            The Eldorado emptied into the street. Dealers left their tables, and gamekeepers came out to watch the wager and place bets. Several hundred men in fur and mittens formed a ring around the sled. Matthewson's thousand-pound load had stood for hours in cold sixty degrees below zero. Its runners were frozen solid to the packed snow. Men offered two to one against Buck. Then an argument started over what it meant to break the sled out. O'Brien said Thornton should be allowed to knock the runners loose, leaving Buck to start from a standstill. Matthewson said Buck must tear the runners from the frozen snow himself. Most men who had heard the wager sided with Matthewson, and the odds against Buck rose to three to one.
            The ruling made the test far harder. Buck would not merely have to drag half a ton. Before the sled could move forward at all, he would have to wrench both runners out of the icy grip that had held them for hours.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Nobody took the bet. Not one man believed Buck could do it. Thornton had rushed into the wager despite his doubts. Now the loaded sled stood before him, with its usual team of ten dogs curled in the snow nearby, and the task looked even more impossible. Matthewson was delighted.
        - id: ch01-b50
          speaker: matthewson
          text: >-
            Three to one! I'll put up another thousand at those odds, Thornton. What do you say?
        - id: ch01-b51
          speaker: narrator
          text: >-
            Doubt showed plainly on Thornton's face, but his fighting spirit had awakened. It cared nothing for odds or impossibility. It heard only the call to battle. Thornton brought Hans and Pete close. Their gold sacks were thin. Together, all three men could gather only two hundred dollars, everything they had left. Without hesitation, they put it against Matthewson's six hundred.
            It was the lowest point in their fortunes, and losing would leave them with nothing. Even so, neither partner held back a dollar once Thornton chose to meet the challenge.
        - id: ch01-b52
          speaker: narrator
          text: >-
            The ten-dog team was unhitched, and Buck was fastened to the sled in his own harness. The excitement had reached him. Somehow, he understood that he must do something great for John Thornton. Admiring voices rose around him. Buck was in perfect condition. Not one extra ounce burdened his hundred and fifty pounds of courage and strength. His coat shone like silk. The mane across his neck and shoulders half lifted with every movement, as if the life inside him stirred every hair. His chest and heavy forelegs matched the rest of his powerful body. Tight muscles rolled under the skin. Men felt them, called them hard as iron, and lowered the odds to two to one.
            The closer the crowd looked, the more impressive he became. His weight was all working strength. His broad chest, heavy legs, powerful shoulders, and hard muscle belonged together in perfect proportion. Still, the great stack of flour behind him looked larger than any single dog could move.
        - id: ch01-b53
          speaker: skookum_king
          text: >-
            Gad, sir! I'll give you eight hundred for him right now, before the test. Eight hundred as he stands!
          emotion: surprised
        - id: ch01-b54
          speaker: narrator
          text: "Thornton shook his head and moved to Buck's side."
        - id: ch01-b55
          speaker: matthewson
          text: >-
            Stand away from him. Give him room and let him do it alone.
        - id: ch01-b56
          speaker: narrator
          text: >-
            The crowd fell silent except for gamblers calling useless offers of two to one. Everyone admired Buck, but those twenty sacks of flour looked too massive for anyone to risk money on him. Thornton knelt beside Buck, held his head in both hands, and pressed cheek to cheek. This time there was no playful shaking and no softly muttered curse. He whispered into Buck's ear.
        - id: ch01-b57
          speaker: john_thornton
          text: "As you love me, Buck. As you love me."
        - id: ch01-b58
          speaker: narrator
          text: >-
            Buck whined with eagerness held tightly inside. The crowd watched, puzzled by this strange, solemn moment. Thornton rose. Buck caught the mittened hand between his jaws, pressed down, and slowly let it go, almost unwillingly. It was his answer, spoken not in words but in love. Thornton stepped well back.
        - id: ch01-b59
          speaker: john_thornton
          text: "Now, Buck."
        - id: ch01-b60
          speaker: narrator
          text: >-
            Buck drew the traces tight, then loosened them by several inches. That was the method he had learned.
            He was not wasting motion. The small amount of slack would let him strike the harness with force instead of leaning helplessly against the frozen load.
        - id: ch01-b61
          speaker: john_thornton
          text: "Gee!"
        - id: ch01-b62
          speaker: narrator
          text: >-
            The command cut sharply through the silence. Buck swung right, then plunged forward to take up the slack. His hundred and fifty pounds stopped with a jerk. The load trembled, and a crisp crackle came from beneath the runners.
        - id: ch01-b63
          speaker: john_thornton
          text: "Haw!"
        - id: ch01-b64
          speaker: narrator
          text: >-
            Buck repeated the movement to the left. The crackling became a snap. The sled turned slightly, and the runners slipped and scraped several inches sideways. He had broken it free. All around him, men held their breath without knowing it.
        - id: ch01-b65
          speaker: john_thornton
          text: "Now, mush!"
        - id: ch01-b66
          speaker: narrator
          text: >-
            Thornton's command cracked like a pistol. Buck hurled himself forward and tightened the traces with a jarring leap. His whole body gathered into the effort. Muscles twisted and knotted beneath the shining fur. His great chest sank low, his head stretched forward and down, and his feet flew, claws cutting parallel tracks into the hard snow. The sled rocked and shivered, almost moving. One foot slipped, and a man groaned. Then the sled lurched ahead in a rapid series of jerks. It never stopped completely again. Half an inch became an inch, then two. The jerks grew smaller as the sled gathered speed, until Buck had it moving steadily.
        - id: ch01-b67
          speaker: narrator
          text: >-
            The men gasped and began breathing again. Thornton ran behind Buck, calling short, cheerful encouragement. The hundred yards had been measured. As Buck neared the firewood pile that marked the end, a cheer began to rise. It grew into a roar when he passed the pile and stopped at Thornton's command. Every man burst loose, even Matthewson. Hats and mittens flew into the air. Men grabbed any hands they could find and shouted over one another in a wild confusion of joy.
            Until that cheer began, the crowd had been so fixed on Buck that no one noticed the held breath or the silence. Now all the strain broke at once. The same men who had refused every wager celebrated as though each of them had won.
        - id: ch01-b68
          speaker: narrator
          text: >-
            Thornton dropped to his knees beside Buck. Their heads pressed together, and he shook Buck back and forth. Those who hurried near heard him cursing Buck at length, fiercely, softly, and lovingly.
            It was the same rough language Buck had always understood as affection, but now relief, pride, and gratitude poured through every word.
        - id: ch01-b69
          speaker: skookum_king
          text: >-
            Gad, sir! I'll give you a thousand for him. Twelve hundred, sir!
          emotion: surprised
        - id: ch01-b70
          speaker: narrator
          text: >-
            Thornton stood with wet eyes and tears running openly down his cheeks.
        - id: ch01-b71
          speaker: john_thornton
          text: >-
            No, sir. You can go to hell, sir. That's the best answer I can give you.
        - id: ch01-b72
          speaker: narrator
          text: >-
            Buck took Thornton's hand in his teeth, and Thornton shook him back and forth. As if moved by one shared thought, the onlookers stepped away and left them a respectful space. No one dared interrupt them again.
