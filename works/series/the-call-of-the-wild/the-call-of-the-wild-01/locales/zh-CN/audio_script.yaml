        pitch: 低音
  chapters:
    - id: ch01
      title: 第一章　荒野初唤
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            游荡的古老渴望又一次跃动起来。它在习俗的锁链下挣扎。沉睡了一整个严冬的兽性血脉，醒了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            巴克从不看报纸。要是看了，他就会知道，一场祸事正在逼近。遭殃的不只是他，还有从普吉特湾到圣迭戈一带所有胸肌结实、身躯沉重、长毛厚暖的滨海大狗。人们在北极的黑暗里摸索，找到了黄金。轮船公司和运输商趁着这股热潮，把消息传得越来越远，成千上万的人立刻涌向北方。他们需要有力气拉重物、能长久干活的狗，也要狗身上有浓密长毛，可以挡住那里的冰霜。
        - id: ch01-b03
          speaker: narrator
          text: >-
            巴克却住在阳光充足的圣克拉拉谷地，住在米勒法官的大庄园里。宅子远离大路，半藏在树木后面。透过枝叶，能望见一圈宽阔阴凉的游廊，从房屋四面环绕过去。几条铺着碎石的车道弯弯曲曲，穿过大片草坪，也穿过高大白杨交叠的树荫，一直通到屋前。
        - id: ch01-b04
          speaker: narrator
          text: >-
            屋后比前院还要开阔。大马厩里住着十来个马夫和杂役，佣人的小屋一排排披着藤蔓，各式附属房舍多得看不到尽头，却收拾得井井有条。再往外，是长长的葡萄架、绿牧场、果园和浆果地。自流井旁有抽水设备，还有一座大水泥池。法官的儿子们清早跳进去游泳，热得难受的午后也来这里凉快。
        - id: ch01-b05
          speaker: narrator
          text: >-
            这整片领地都归巴克统治。他生在这里，四年来也一直住在这里。庄园这么大，当然还有别的狗，可在巴克眼里，它们根本不算什么。有些狗来了又走，有些挤在住客众多的狗舍里。有些躲在屋子深处，像日本哈巴狗图茨和墨西哥无毛犬伊莎贝尔。这两个模样古怪的家伙几乎从不把鼻子探出门，更别提让脚掌碰到土地。
        - id: ch01-b06
          speaker: narrator
          text: >-
            还有至少二十条猎狐梗，隔着窗户朝图茨和伊莎贝尔大声叫嚷，恨不得把威胁全喊出来。可那两条小狗一点也不怕。它们身后有一大群女佣，手里还拿着扫帚和拖把。
        - id: ch01-b07
          speaker: narrator
          text: >-
            巴克不属于屋里，也不属于狗舍。整个王国都是他的。他跳进水池畅游，跟法官的儿子们打猎。清晨和黄昏，他陪莫莉、爱丽丝两位小姐远远散步。冬天的夜晚，他就卧在法官脚边，守着书房里熊熊的炉火。
        - id: ch01-b08
          speaker: narrator
          text: >-
            法官的孙子们骑在巴克背上，跟他一起滚过草地。他们一路探险，走到马厩院里的喷泉，再闯进更远的围场和浆果地，巴克始终守着他们。他昂首走过猎狐梗中间，看都不看图茨和伊莎贝尔。在米勒法官的庄园，他就是王。地上爬的、空中飞的，甚至连人，都算他的臣民。
        - id: ch01-b09
          speaker: narrator
          text: >-
            巴克的父亲埃尔莫是条巨大的圣伯纳犬，曾经与法官形影不离。巴克眼看也要接过父亲的位置。他没有父亲那么大，因为母亲谢普是苏格兰牧羊犬，但他仍有一百四十磅重。这副健壮的身体，再加上优裕生活和周围所有人的敬重，让他举手投足都带着十足的王者尊严。
        - id: ch01-b10
          speaker: narrator
          text: >-
            从幼犬时代起，巴克就像一位事事称心的贵族。他很骄傲，还有一点自负，就像那些一辈子只住在乡间一隅、便把自己看得太高的乡绅。可是，他没有变成只会享福的宠物。打猎和其他户外乐趣不让身上长出赘肉，还把肌肉练得坚硬。他又喜欢冷水。游水像一剂强身药，让他精神饱满，也让身体一直健康。
        - id: ch01-b11
          speaker: narrator
          text: >-
            一八九七年秋天，克朗代克发现金矿，无数人从世界各地奔向冰封的北方。那时的巴克正是这样一条狗。他不看报纸，不知道外面的消息，也不知道园丁的帮工曼纽尔不能信任。曼纽尔戒不掉中国彩票，更糟的是，他还认定自己有一套必胜的下注章法。照章法不停下注就得有本钱，可他的工钱刚够养活妻子和一大群孩子，哪里还能剩下钱来。
        - id: ch01-b12
          speaker: narrator
          text: >-
            曼纽尔背叛巴克的那一夜，法官去参加葡萄干种植者协会的会议，儿子们正忙着筹备体育俱乐部。没人看见曼纽尔带巴克离开，又一路穿过果园。巴克还跟在他身边，只当这是一次普通的散步。到了名叫学院公园的小站，也只有一个陌生男人看见他们。曼纽尔和那人低声说了几句，紧接着，两人之间便响起钱币相碰的叮当声。
        - id: ch01-b13
          speaker: kidnapper
          text: 交货之前，先把这家伙捆好。
        - id: ch01-b14
          speaker: narrator
          text: >-
            曼纽尔拿出一根粗绳，对折以后，绕在巴克的颈圈下面。
        - id: ch01-b15
          speaker: manuel
          text: 绳子一拧，就能把它勒得死死的。
        - id: ch01-b16
          speaker: narrator
          text: >-
            陌生人哼了一声。巴克庄严地站着，让曼纽尔套上绳子。这件事虽然古怪，他却信任自己认识的人，总觉得人类知道的事情比他多。
        - id: ch01-b17
          speaker: narrator
          text: >-
            可曼纽尔刚把绳头交给陌生人，巴克就发出了警告的低吼。他以为只要让对方听见自己的不满，就等于下了命令。没想到绳索猛地收紧，立刻截断了呼吸。
        - id: ch01-b18
          speaker: narrator
          text: >-
            巴克暴怒着扑去。陌生人迎上来，一把卡紧他的喉咙，手腕灵巧一扭，便将他仰面摔倒。绳子越勒越紧，没有半点松动。巴克发狂似的挣扎，舌头垂在嘴外，宽阔的胸膛急促起伏，却怎么也吸不到气。他从没受过这样卑劣的对待，也从没如此愤怒。
        - id: ch01-b19
          speaker: narrator
          text: >-
            可力气一点点离开了身体，他的眼睛也蒙上白翳。列车停下时，曼纽尔和陌生人把他扔进行李车厢。那一刻，他早已失去知觉。
        - id: ch01-b20
          speaker: narrator
          text: >-
            巴克再次醒来，只觉得舌头剧痛，身子被什么车辆颠得东摇西晃。火车头驶近道口，发出嘶哑的长鸣。他立刻明白了。以前常随法官出门，他太熟悉行李车厢的动静了。
        - id: ch01-b21
          speaker: narrator
          text: >-
            他一睁眼，被绑架的王者那不受约束的怒火就燃了起来。那人扑向他的喉咙，巴克却抢先咬住了他的手。绳子再一次勒得巴克昏死过去，他的牙关才终于松开。
        - id: ch01-b22
          speaker: kidnapper
          text: 这狗会犯病。我替老板把它送到旧金山，那边有个厉害的兽医，说能治好它。
        - id: ch01-b23
          speaker: narrator
          text: >-
            打斗声引来了行李员。绑架者一边说谎，一边把被咬烂的手藏起来。那天夜里的旅程有多难熬，后来全由他自己说了出来。那是在旧金山滨水区一家酒馆后面的小棚里。他滔滔不绝地大倒苦水，那只手裹着染血的手帕，右边裤腿也从膝盖一直裂到脚踝。
        - id: ch01-b24
          speaker: kidnapper
          text: 我这一趟才拿五十块。就是给我一千块现钱，我也不再干了。
        - id: ch01-b25
          speaker: saloon_keeper
          text: 另外那个家伙拿了多少？
        - id: ch01-b26
          speaker: kidnapper
          text: 一百块。他赌咒说，少一个子儿也不收。
        - id: ch01-b27
          speaker: saloon_keeper
          text: 加起来就是一百五十。这狗准值这个价，要不我就是个蠢货。
        - id: ch01-b28
          speaker: narrator
          text: >-
            绑架者扯下染血的包布，看了看手上深深的伤口。
        - id: ch01-b29
          speaker: kidnapper
          text: 我可不想让这畜生害得自己患上狂犬病。
          emotion: fearful
        - id: ch01-b30
          speaker: saloon_keeper
          text: 那你没得病，也只是因为命里注定要上绞架。别废话了，走之前先来搭把手。
        - id: ch01-b31
          speaker: narrator
          text: >-
            巴克昏昏沉沉，喉咙和舌头疼得难以忍受，几乎被勒去半条命，却仍想和这些折磨他的人拼一场。他们一次次把他按倒，一次次收紧绳索，终于锉断了沉重的黄铜颈圈。随后，绳子被取走，巴克被扔进一只笼子似的板条箱。
        - id: ch01-b32
          speaker: narrator
          text: >-
            漫长疲惫的后半夜，他一直躺在那里，守着满腔怒火和受伤的尊严。这些陌生人到底想要什么？为什么把他关在这么窄的箱子里？巴克想不明白，却隐隐觉得，一场灾难就要来了。
        - id: ch01-b33
          speaker: narrator
          text: >-
            棚门几次嘎吱打开，他每次都猛然站起，盼着法官出现，或者至少来的是法官的儿子。可牛油蜡烛惨淡的微光里，每次探进来的都是酒馆老板那张肥胀的脸。巴克喉间刚刚涌起的欢快吠声，转眼就扭成凶狠的低吼。
        - id: ch01-b34
          speaker: narrator
          text: >-
            酒馆老板没有再碰他。早晨，四个衣衫褴褛、不修边幅的男人进来抬箱子。巴克看他们个个面目凶恶，认定这也是一伙折磨自己的家伙，于是隔着木条又吼又撞。他们只顾发笑，还拿棍子捅他。巴克每次都立刻扑咬，后来才明白，他们正等着看他发狂。他不再上当，阴沉地卧下，任由箱子被抬上马车。
        - id: ch01-b35
          speaker: narrator
          text: >-
            从此，巴克和这只箱子在许多人手中辗转。快运公司的职员先接收他，一辆马车又载着他到处走。随后，他和大大小小的箱包一起被货车运上渡船，再从渡船送到一座大车站。最后，他进了快运车厢。
        - id: ch01-b36
          speaker: narrator
          text: >-
            这节快运车厢挂在尖声呼啸的火车头末尾，一跑就是两天两夜。整整两天两夜，巴克没有吃过东西，也没有喝过一滴水。起初，快运员走近时，他总用怒吼回敬，于是那些人便报复他，存心拿他取乐。他扑向栏杆，浑身发颤，嘴里冒着白沫。他们却哈哈大笑，还不停地挑衅。
        - id: ch01-b37
          speaker: narrator
          text: >-
            那些人一会儿学讨厌的恶狗狂吠，一会儿学猫叫，又扇着胳膊学公鸡打鸣。巴克知道这一切蠢透了。可正因为这些把戏又蠢又可笑，才让他觉得尊严受了更大的侮辱。他越来越愤怒。饥饿倒还能忍，干渴却让他痛苦万分，把怒火烧得滚烫。他本来就敏感，神经又容易激动，这番虐待使他发起高烧，干裂肿胀的喉咙和舌头又让病情一再加重。
        - id: ch01-b38
          speaker: narrator
          text: >-
            只有一件事值得庆幸，绳子已经不在脖子上了。靠着那根绳子，人占尽便宜。现在没了绳子，巴克决心让他们看看自己的厉害。谁也别想给他套上第二次。
        - id: ch01-b39
          speaker: narrator
          text: >-
            两天两夜没有食物和水，又受尽折磨，巴克心里的怒火越积越多。这股怒火正等着爆发，不管谁先招惹他，都会倒大霉。他双眼充血，整条狗简直变成一头暴怒的恶魔。他的模样变得那么厉害，就连米勒法官亲眼见了，也未必认得出他。到了西雅图，快运员把他连箱子一起匆匆卸下火车，全都如释重负。
        - id: ch01-b40
          speaker: narrator
          text: >-
            四个男人小心抬起板条箱，从马车上把它搬进一座高墙围住的小院。一个粗壮的男人走了出来。他穿着红毛衣，松垮的领口一直垂在脖子下。他接过车夫的簿子，在上面签了字。巴克马上认定，这就是下一个折磨他的人，于是凶猛地撞向木条。男人只是冷冷一笑，转身拿来一把斧头和一根棍棒。
        - id: ch01-b41
          speaker: driver
          text: 你不会现在就要放它出来吧？
        - id: ch01-b42
          speaker: man_in_red_sweater
          text: 当然现在放。
        - id: ch01-b43
          speaker: narrator
          text: >-
            红毛衣男人把斧头砍进箱子，用力撬开木板。抬箱子的四个人一下子跑散，爬上墙头，坐在安全的地方等着看戏。
        - id: ch01-b44
          speaker: narrator
          text: >-
            巴克扑向碎裂的木板，咬住它，扯住它，拼尽全身力气跟它搏斗。斧头在外面劈到哪里，他就在里面迎到哪里，嘴里不停地咆哮。他发了疯似的想出去，红毛衣男人却稳稳地站着，只管把出口撬开。
        - id: ch01-b45
          speaker: man_in_red_sweater
          text: 来吧，你这红眼睛的魔鬼。
        - id: ch01-b46
          speaker: narrator
          text: >-
            洞口已经大得足以让巴克冲出来。那人丢下斧子，把棍棒交到右手。巴克也的确成了红眼睛的魔鬼。他缩紧身体，做好扑击的准备，浑身毛发倒竖，嘴里满是白沫，充血的眼睛闪着疯狂的光。两天两夜压在心里的愤怒，全都装进一百四十磅的身躯，朝那人直射过去。
        - id: ch01-b47
          speaker: narrator
          text: >-
            巴克还在半空，牙齿就要碰到对方，忽然挨了一记重击。身体停住了，牙齿痛得撞在一起。他翻过身，背和肋侧重重砸在地面。巴克从没挨过棍子，根本不知道发生了什么。他发出介于吠叫和惨号之间的吼声，翻身站起，又扑了过去。
        - id: ch01-b48
          speaker: narrator
          text: >-
            第二棒又把他砸回地上。这回，他知道是棍棒在打他，疯狂却不容他后退。他连续冲了十几次，每次都被棍棒截住，再被狠狠击倒。
        - id: ch01-b49
          speaker: narrator
          text: >-
            一记格外凶狠的重击过后，巴克勉强爬起，脑子昏沉，再也冲不动。他四肢发软，摇摇晃晃地挪着步子。鼻子、嘴和耳朵都在流血，原本漂亮的皮毛上，也溅满了带血的唾沫。红毛衣男人这才走近，存心朝他鼻子又打了一棒。这股剧痛尖锐地钻进骨头，先前忍受过的苦跟它比起来，几乎全都算不了什么。
        - id: ch01-b50
          speaker: narrator
          text: >-
            巴克发出近似狮吼的声音，再次扑向对方。男人把棍棒换到左手，右手托住他的下巴，用力向下、向后一扭。巴克在空中翻过一整圈，又翻了半圈，最后头和胸口一起撞向地面。
        - id: ch01-b51
          speaker: narrator
          text: >-
            巴克发起最后一次冲锋。红毛衣男人使出一直留到现在的那一击。巴克顿时瘫软下去，倒在地上，彻底失去了知觉。
        - id: ch01-b52
          speaker: man_on_wall
          text: 要我说，这个人训狗可真有本事！
        - id: ch01-b53
          speaker: driver
          text: 换成我，宁愿天天去驯野马，礼拜天还多驯一回。
        - id: ch01-b54
          speaker: narrator
          text: >-
            车夫说完，爬上马车，赶着马走了。巴克慢慢恢复知觉，力气却没有回来。他仍躺在原地，望着红毛衣男人。
        - id: ch01-b55
          speaker: man_in_red_sweater
          text: >-
            信上说，你的名字叫巴克。好啦，巴克，小伙子，咱俩刚打过这一架，就让事情到这里吧。你知道了自己的位置，我也明白我的位置。你听话，日子就会很好过。你要是不听，我就把你打个稀烂。懂了吗？
        - id: ch01-b56
          speaker: narrator
          text: >-
            他说得很亲切，还毫不畏惧地拍了拍那颗刚被自己狠打过的脑袋。手一碰过来，巴克的毛本能地竖起，可他忍着没动。男人给他端来水，他贪婪地喝了个够。过了一会儿，他又从那人手中一块块吞下一大份生肉。
        - id: ch01-b57
          speaker: narrator
          text: >-
            巴克知道自己被打败了，但他没有被打垮。他已经彻底看清，面对手持棍棒的人，自己没有一点胜算。这个教训，他余生再也没有忘记。那根棍棒让他幡然醒悟，也带着他第一次走进原始法则的统治。巴克没有畏缩，迎面接受了这场引见。生活露出更加凶猛的模样，他依旧毫不害怕，天性中一直潜藏的机警却全部醒了过来。
        - id: ch01-b58
          speaker: narrator
          text: >-
            后来的日子里，更多狗被送来。有的关在板条箱里，有的被绳子拴着。有的温顺地来，有的像当初的巴克一样怒吼挣扎。红毛衣男人一次次用残酷的手段让它们屈服，巴克也一次次看清同一个道理。手握棍棒的人就是立法者，是必须服从的主人。可服从归服从，并不等于还要上前讨好他。
        - id: ch01-b59
          speaker: narrator
          text: >-
            巴克从没有摇着尾巴去舔那人的手，尽管他见过别的狗挨打后这样乞怜。他还见过一条狗既不讨好，也不服从，最后在争夺支配权时被活活打死。
        - id: ch01-b60
          speaker: narrator
          text: >-
            隔些时候，就有陌生人来找红毛衣男人。他们有的说得很激动，有的好言好语地哄劝，还有的换着各种口气说话。只要钱从一只手交到另一只手，陌生人就会领走一条或几条狗。那些狗从此再也没有回来。巴克不知道它们去了哪里，对未来的恐惧却一直沉甸甸地压着他。每次来人没有挑中自己，他都暗暗庆幸，又松一口气。
        - id: ch01-b61
          speaker: narrator
          text: >-
            可他的时刻终究来了。来人又矮又瘦，像只鼬鼠。他说着断断续续的英语，嘴里还冒出许多古怪粗野的感叹。巴克一句也听不明白。
        - id: ch01-b62
          speaker: perrault
          text: 圣母在上！这条狗可真厉害！它要多少钱？
          emotion: surprised
        - id: ch01-b63
          speaker: man_in_red_sweater
          text: 三百块，这跟白送一样。反正花的是政府的钱，佩罗，你也没什么可抱怨的。
        - id: ch01-b64
          speaker: narrator
          text: >-
            佩罗咧嘴一笑。如今北方突然需要那么多狗，价格早被推上了天，这么好的牲口卖三百块并不离谱。加拿大政府不会吃亏，政府公文也不会因为买了巴克而送得更慢。佩罗十分懂狗。他只看巴克一眼，就知道这是一千条里也挑不出一条的好狗。转念一想，他在心里改了口。不对，该是一万条里挑一条。
        - id: ch01-b65
          speaker: narrator
          text: >-
            巴克亲眼看见钱交了过去。接着，那个鼬鼠般的小个子把他和一条性情温和的纽芬兰犬一起牵走。那条狗叫柯莉。巴克对此一点也不惊讶。这是他最后一次看见红毛衣男人。后来，他和柯莉站在“独角鲸号”的甲板上，看着西雅图一点点远去。那也是他最后一次望见温暖的南方。
        - id: ch01-b66
          speaker: narrator
          text: >-
            佩罗把巴克和柯莉领到下层甲板，交给一个名叫弗朗索瓦的黝黑大汉。佩罗是法裔加拿大人，肤色已经很深。弗朗索瓦则是法裔加拿大混血儿，肤色比佩罗还要深上一倍。这是巴克从未见过的一类人，以后他还会遇见许多。他没有喜欢上他们，却真心敬重他们。两个人都公道，处理事情冷静，不偏不倚，又十分懂狗，任何狗都休想骗过他们。
        - id: ch01-b67
          speaker: narrator
          text: >-
            “独角鲸号”的中层甲板还住着两条狗。其中一条身材高大，浑身雪白，来自斯匹次卑尔根。一位捕鲸船长把他带离那里，后来他又跟随地质调查队去过北方荒原。他看起来很友善，其实十分奸诈。脸上还在冲别人微笑，心里已经悄悄想好了暗算别人的办法。
        - id: ch01-b68
          speaker: narrator
          text: >-
            第一顿饭，他就偷了巴克的食物。巴克刚要惩罚他，弗朗索瓦的鞭子已经呼啸而过，抢先抽中了偷食物的狗。巴克只要捡回那块骨头就够了。他觉得这件事处置得公平，对弗朗索瓦也更加看重。
        - id: ch01-b69
          speaker: narrator
          text: >-
            另一条狗叫戴夫。他不主动亲近谁，也不接受谁的亲近，更不会偷新同伴的东西。他阴沉孤僻，清清楚楚地告诉柯莉，自己只想独处。谁不肯让他清静，谁就会惹上麻烦。戴夫除了吃就是睡，两件事之间也只是打打哈欠，别的什么都不能引起他的兴趣。
        - id: ch01-b70
          speaker: narrator
          text: >-
            “独角鲸号”穿过夏洛特皇后湾，船身像中了邪一样摇摆颠簸。巴克和柯莉吓得发狂，戴夫却只抬起头，仿佛嫌他们吵。他淡淡看了一眼，打个哈欠，又睡着了。
        - id: ch01-b71
          speaker: narrator
          text: >-
            螺旋桨昼夜不停地转动，船也随着它一阵阵震颤，像身体里装着一颗永不疲倦的心脏。日子看起来都差不多，巴克却清楚地感到，天气一天比一天冷。终于有个早晨，螺旋桨忽然安静下来。“独角鲸号”上到处都是兴奋的气息。巴克感觉到了，其他狗也一样。它们知道，变化马上就要发生。
        - id: ch01-b72
          speaker: narrator
          text: >-
            弗朗索瓦给狗一一系上牵绳，把它们带到甲板上。巴克第一脚踩上冰冷的地面，四只脚掌竟陷进一种白色的软东西，摸起来很像泥。他喷着鼻息，猛地向后跳开。更多这样的白东西还在空中往下飘。他使劲抖掉落在身上的一层，新的却马上又落了下来。
        - id: ch01-b73
          speaker: narrator
          text: >-
            巴克好奇地闻了闻，再舔上一点。那东西像火一样咬了舌头，转眼又消失了。他没弄明白，又试一次，还是同样的结果。旁边的人全都放声大笑。巴克觉得难为情，却不知道自己为什么难为情。这是他一生中见到的第一场雪。
