  chapters:
    - id: ch01
      title: "Chapter I. Into the Primitive"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Old wandering desires leap again. They strain against the chains of custom. After their winter sleep, the wild instincts wake.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Buck never read the newspapers. If he had, he would have known that trouble was coming. It threatened him and every other strong, heavy dog with a long, warm coat, all the way from Puget Sound to San Diego. Men searching through the Arctic darkness had found gold. Steamship and transportation companies spread the news, and thousands rushed north. Those men needed powerful dogs to work, with thick fur to shield them from the frost.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Buck lived far from all that, at Judge Miller's great house in the sunny Santa Clara Valley. People called it Judge Miller's place. It stood well back from the road, half hidden by trees. Through them, a visitor caught glimpses of the broad, cool veranda that wrapped around all four sides. Gravel drives curved across wide lawns and beneath tall poplars whose branches met overhead.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Behind the house, everything spread out on an even greater scale. It was spacious and orderly. There were large stables where a dozen grooms and stable boys worked, servants' cottages covered in vines, and row after orderly row of outbuildings. Long grape arbors stood beside green pastures, orchards, and berry patches. An artesian well fed a great cement tank where the Judge's sons plunged in each morning and cooled themselves on hot afternoons.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Buck ruled over all of it. He had been born there and had spent every one of his four years there. Other dogs lived on the estate, of course, but in Buck's eyes they hardly mattered. Some came and went from the crowded kennels. Others stayed hidden in the house, like Toots, the Japanese pug, and Ysabel, the Mexican hairless. They were strange little creatures who rarely put their noses outside or their feet on the ground.
        - id: ch01-b06
          speaker: narrator
          text: >-
            At least twenty fox terriers also lived there. They yelped fierce threats at Toots and Ysabel through the windows. The two little house dogs stayed safe behind an army of maids armed with brooms and mops.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Buck was neither a house dog nor a kennel dog. The whole kingdom belonged to him. He dove into the swimming tank and hunted with the Judge's sons. He went with the Judge's daughters, Mollie and Alice, on long walks at dawn and twilight. On winter nights, he lay at the Judge's feet before the roaring library fire.
        - id: ch01-b08
          speaker: narrator
          text: >-
            He carried the Judge's grandsons on his back, tumbled with them on the grass, and watched over them on their daring journeys to the stable-yard fountain and beyond, as far as the paddocks and berry patches. He strode proudly among the terriers and ignored Toots and Ysabel. Buck was king over every creeping, crawling, and flying thing on Judge Miller's land. He even ruled the humans, or so he believed.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Buck's father, Elmo, had been a huge Saint Bernard and the Judge's constant companion. Buck seemed likely to follow him. His mother, Shep, was a Scotch shepherd dog, so Buck was smaller than his father. Still, he weighed one hundred and forty pounds. Good living and the respect of everyone around him gave him the bearing of a king.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Since puppyhood, Buck had lived like a rich gentleman with every wish satisfied. He was proud of himself and even a little vain, the way a country gentleman can become when his own small world seems like the whole world. Still, Buck had never turned into a soft, spoiled house dog. Hunting and other outdoor pleasures kept the fat off and made his muscles hard. His love of cold water kept him strong and healthy too.
        - id: ch01-b11
          speaker: narrator
          text: >-
            That was the Buck who entered the fall of 1897, when the Klondike gold strike pulled men from every part of the world into the frozen North. But Buck knew nothing of the news. He also did not know that Manuel, one of the gardener's helpers, was a dangerous man for him to trust.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Manuel could not stop playing the Chinese lottery. Worse, he believed he had a system that would help him win. A system required money, and his wages were already needed by his wife and many children.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The night Manuel betrayed Buck, the Judge was away at a meeting of the Raisin Growers' Association. The Judge's sons were busy starting an athletic club. No one saw Manuel lead Buck through the orchard. Buck thought they were only going for a walk.
        - id: ch01-b14
          speaker: narrator
          text: >-
            They reached the little flag station at College Park. Only one man saw them arrive. He spoke with Manuel, and coins clinked as they changed hands.
        - id: ch01-b15
          speaker: kidnapper
          text: "You'd better tie up the goods before you hand him over."
        - id: ch01-b16
          speaker: narrator
          text: >-
            Manuel folded a thick rope twice around Buck's neck, beneath his collar.
        - id: ch01-b17
          speaker: manuel
          text: "Give that rope a twist, and you'll choke him plenty."
        - id: ch01-b18
          speaker: narrator
          text: >-
            The stranger grunted to show he understood. Buck had allowed Manuel to put on the rope with quiet dignity. It was unusual, but he trusted the men he knew. He assumed they understood things beyond his own knowledge.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Then Manuel handed the rope to the stranger. Buck gave a threatening growl. He believed that showing his displeasure was the same as giving an order. To his astonishment, the rope tightened and cut off his breath.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Buck sprang at the man in a flash of rage. The stranger met him halfway, caught him tightly by the throat, and twisted him onto his back. The rope drew tighter without mercy. Buck fought wildly, his tongue hanging out and his great chest struggling for air. No one had ever treated him so cruelly. He had never known such anger.
        - id: ch01-b21
          speaker: narrator
          text: >-
            His strength drained away. His eyes became glassy. He knew nothing more when the train stopped and the two men threw him into the baggage car.
        - id: ch01-b22
          speaker: narrator
          text: >-
            When Buck became aware again, his tongue hurt and some kind of vehicle was jolting beneath him. A locomotive gave a hoarse scream as it neared a crossing, and he understood where he was. He had traveled with the Judge often enough to recognize a baggage car.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Buck opened his eyes. They blazed with the uncontrolled fury of a kidnapped king. The man reached for his throat, but Buck moved first. His jaws closed on the man's hand and held fast until the rope choked him unconscious again.
        - id: ch01-b24
          speaker: kidnapper
          text: >-
            Yeah, he has fits. I'm taking him to my boss in San Francisco. There's a first-rate dog doctor there who thinks he can cure him.
        - id: ch01-b25
          speaker: narrator
          text: >-
            He hid his torn hand from the baggage man, who had come to see what caused the struggle. Later that night, in a small shed behind a saloon on the San Francisco waterfront, the kidnapper gave his own angry account of the ride. His hand was wrapped in a blood-soaked cloth, and his right trouser leg was ripped from knee to ankle.
        - id: ch01-b26
          speaker: kidnapper
          text: "I'm only getting fifty dollars for this, and I wouldn't do it again for a thousand in cash."
        - id: ch01-b27
          speaker: saloon_keeper
          text: "What did the other fellow get?"
        - id: ch01-b28
          speaker: kidnapper
          text: "A hundred. He swore he wouldn't take one cent less."
        - id: ch01-b29
          speaker: saloon_keeper
          text: "That's a hundred and fifty altogether. That dog must be worth it, unless I'm a fool."
        - id: ch01-b30
          speaker: narrator
          text: >-
            The kidnapper pulled off the bloody cloth and examined the deep wounds in his hand.
        - id: ch01-b31
          speaker: kidnapper
          text: "I just hope that beast doesn't give me rabies."
        - id: ch01-b32
          speaker: saloon_keeper
          text: >-
            Then it'll only be because you were born to hang. Now help me here before you clear out.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Buck was dazed. His throat and tongue were in terrible pain, and he had nearly been strangled to death. Even so, he tried to face his tormentors. They threw him down and choked him again and again until they managed to file the heavy brass collar from his neck. At last they removed the rope and flung him into a crate like a cage.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Buck lay there through the rest of that weary night, tending his anger and his wounded pride. He could not understand any of it. What did these strange men want? Why had they shut him inside this narrow box? He did not know, but he felt disaster drawing near.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Several times the shed door rattled open, and Buck leaped up. Each time he expected the Judge, or at least one of the Judge's sons. Each time, only the saloon keeper's swollen face appeared in the weak light of a candle. A joyful bark would rise in Buck's throat, then twist into a savage growl.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The saloon keeper left him alone. In the morning, four ragged, dirty men came in and lifted the crate. Buck decided they were more tormentors. He stormed at them through the bars. They laughed and jabbed sticks at him, and he snapped at the sticks until he understood that his fury was exactly what they wanted.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Buck lay down in sullen silence and let them load the crate onto a wagon. From there, he passed through hand after hand. Express-office clerks took him. Another wagon carried him away. A truck moved him among boxes and parcels onto a ferry, then off again at a great railway station. In the end, they put him aboard an express car.
        - id: ch01-b38
          speaker: narrator
          text: >-
            For two days and two nights, roaring locomotives dragged that car along behind them. Buck had no food and no water. When the express messengers first approached, he answered them with growls. They paid him back by tormenting him.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Buck hurled himself against the bars, shaking and foaming. The men laughed and mocked him. They growled and barked like hateful dogs. They meowed, flapped their arms, and crowed like roosters. Buck knew it was foolish, but that made the insult to his dignity even worse. His anger kept rising.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Hunger did not trouble him as much as thirst. With no water, his suffering grew severe and his rage burned like fever. Buck was sensitive and high-strung. The cruel treatment had already made him feverish, and the swelling in his dry throat and tongue made it worse.
        - id: ch01-b41
          speaker: narrator
          text: >-
            One thing pleased him. The rope was gone. It had given the men an unfair advantage, and Buck vowed that no one would ever put another rope around his neck. Now he would show them what he could do.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Through those two days and nights without food or water, he stored up a great reserve of fury. It promised trouble for whoever crossed him next. His eyes became bloodshot. He changed into a raging creature the Judge himself would not have recognized. The express messengers were relieved when they finally bundled him off the train in Seattle.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Four men carried the crate carefully from a wagon into a small yard with high walls. A broad man came out wearing a red sweater that hung loose around his neck. He signed the driver's book. Buck knew at once that this must be his next tormentor, and he threw himself savagely against the bars.
        - id: ch01-b44
          speaker: narrator
          text: >-
            The man smiled without kindness. Then he brought out a hatchet and a club.
        - id: ch01-b45
          speaker: driver
          text: "You're not going to let him out now, are you?"
        - id: ch01-b46
          speaker: man_in_red_sweater
          text: "Of course I am."
        - id: ch01-b47
          speaker: narrator
          text: >-
            He drove the hatchet into the crate and used it to pry the boards apart. The four carriers scattered at once. They climbed to safe places on top of the wall and settled down to watch.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Buck attacked the breaking wood. He sank his teeth into it, pulled at it, and fought it with his whole body. Wherever the hatchet struck outside, Buck met it from within, snarling and growling. He was frantic to escape. The man in the red sweater was just as determined to free him, but perfectly calm.
        - id: ch01-b49
          speaker: man_in_red_sweater
          text: "Come on, then, you red-eyed devil."
        - id: ch01-b50
          speaker: narrator
          text: >-
            The opening was now large enough for Buck to pass through. The man dropped the hatchet and moved the club into his right hand.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Buck truly looked like a red-eyed devil. His hair stood on end. Foam covered his mouth, and madness glittered in his bloodshot eyes. He gathered himself and sprang straight at the man, all one hundred and forty pounds of him, carrying the rage of two days and nights.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Just before Buck's teeth reached their target, a terrible shock stopped him in midair and snapped his jaws together. He spun around and crashed onto his back and side. No one had ever hit him with a club before. He could not understand what had happened.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Buck gave a cry that was partly a bark and mostly a scream. Then he leaped again. The shock came again and slammed him to the ground. This time he knew the club had struck him, but his rage left no room for caution. Twelve times he charged. Twelve times the club stopped him and smashed him down.
        - id: ch01-b54
          speaker: narrator
          text: >-
            One blow left him struggling to rise. He was too dazed to attack. He swayed weakly on his feet. Blood ran from his nose, mouth, and ears, while bloody foam spotted his beautiful coat.
        - id: ch01-b55
          speaker: narrator
          text: >-
            The man stepped forward and struck Buck squarely on the nose. That sharp agony was worse than all the pain that had come before. Buck roared with the fury of a lion and launched himself once more.
        - id: ch01-b56
          speaker: narrator
          text: >-
            The man calmly shifted the club to his left hand. With his right, he caught Buck beneath the jaw and wrenched downward and back. Buck turned one full circle through the air and half of another, then struck the earth on his head and chest.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Buck rushed one last time. The man used the blow he had held back until then. Buck folded and fell, completely unconscious.
        - id: ch01-b58
          speaker: man_on_wall
          text: "That fellow certainly knows how to break a dog!"
        - id: ch01-b59
          speaker: driver
          text: "I'd sooner break horses any day of the week, and twice on Sunday."
        - id: ch01-b60
          speaker: narrator
          text: >-
            The driver climbed onto his wagon and started the horses. Buck's senses slowly returned, but his strength did not. He stayed where he had fallen and watched the man in the red sweater.
        - id: ch01-b61
          speaker: man_in_red_sweater
          text: "It says here he answers to the name of Buck."
        - id: ch01-b62
          speaker: narrator
          text: >-
            He was reading from the saloon keeper's letter, which had announced that the crate was coming.
        - id: ch01-b63
          speaker: man_in_red_sweater
          text: >-
            Well, Buck, my boy, we've had our fight. We might as well leave it there. You know your place now, and I know mine. Behave yourself, and things will go well. Cause trouble, and I'll beat the stuffing out of you. Do you understand?
        - id: ch01-b64
          speaker: narrator
          text: >-
            The man spoke in a friendly voice and fearlessly patted the head he had beaten so brutally. Buck's hair rose under his hand without Buck willing it, but Buck accepted the touch without protest. When the man brought water, Buck drank eagerly. Later, he swallowed a large meal of raw meat, one piece after another, straight from the man's hand.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Buck had been beaten. He knew that. But he had not been broken. He understood once and forever that he had no chance against a man with a club. He learned that lesson and never forgot it for the rest of his life.
        - id: ch01-b66
          speaker: narrator
          text: >-
            The club revealed a new world to him. It was his first meeting with the rule of primitive law, and Buck met that world halfway. The facts of life had taken on a fiercer shape. He still faced them without fear, but now every bit of cunning hidden in his nature was awake.
        - id: ch01-b67
          speaker: narrator
          text: >-
            More dogs arrived as the days passed, some in crates and some tied with ropes. A few came quietly. Others raged and roared just as Buck had. He watched every one fall under the power of the man in the red sweater.
        - id: ch01-b68
          speaker: narrator
          text: >-
            Each brutal beating drove the lesson deeper. A man with a club made the law. He was a master who had to be obeyed, though Buck saw no need to win his favor. Buck watched other beaten dogs crawl close to the man. They wagged their tails and licked his hand. Buck never did. He also saw one dog refuse both friendship and obedience. That dog kept fighting for control until it was killed.
        - id: ch01-b69
          speaker: narrator
          text: >-
            From time to time, strangers came and spoke to the man in every manner they could. Some were eager, and some coaxed him. Whenever money changed hands, they took one or more dogs away. Those dogs never returned. Buck wondered where they went. He feared what waited ahead, and each time no one chose him, he was relieved.
        - id: ch01-b70
          speaker: narrator
          text: >-
            In the end, Buck's turn came. A small, thin man arrived, speaking broken English and strange exclamations Buck could not understand.
        - id: ch01-b71
          speaker: perrault
          text: "Sacredam! Now that's one fine dog! How much do you want for him?"
        - id: ch01-b72
          speaker: man_in_red_sweater
          text: >-
            Three hundred dollars, and that's a gift. Since you're spending government money, you can't complain, can you, Perrault?
        - id: ch01-b73
          speaker: narrator
          text: >-
            Perrault grinned. The sudden demand for sled dogs had driven their prices sky-high, so the amount was fair for such a fine animal. The Canadian Government would not lose money on Buck, and its dispatches would move no slower with him on the team. Perrault knew dogs. One look told him Buck was one in a thousand.
        - id: ch01-b74
          speaker: narrator
          text: "In his own mind, Perrault corrected that thought. Buck was one in ten thousand."
        - id: ch01-b75
          speaker: narrator
          text: >-
            Buck watched money pass between the men. He was not surprised when Perrault led him away with Curly, a friendly Newfoundland. Buck never saw the man in the red sweater again.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Soon Buck and Curly stood on the deck of the Narwhal and watched Seattle shrink behind them. It was Buck's final sight of the warm South. Perrault took both dogs below and gave them into the care of a dark-faced giant named François.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Perrault was a dark-skinned French Canadian. François, a French Canadian of mixed ancestry, was darker still. Buck had never met men like them, though many more such men lay in his future. He felt no affection for either one, but he quickly came to respect them. They were fair men. When discipline was needed, they gave it calmly and without favoritism. They also understood the ways of dogs far too well for any dog to fool them.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Below the Narwhal's decks, Buck and Curly met two more dogs. One was a large, snow-white dog from Spitzbergen. A whaling captain had brought him away, and later he had traveled into the northern Barrens with a Geological Survey.
        - id: ch01-b79
          speaker: narrator
          text: >-
            The white dog seemed friendly, but there was treachery in his friendliness. He could smile in another dog's face while planning a trick. At their first meal, he stole some of Buck's food. Buck sprang to punish him, but François's whip sang through the air and found the thief first. Buck had only to take back his bone. He decided that François had acted fairly, and his respect for the man began to grow.
        - id: ch01-b80
          speaker: narrator
          text: >-
            The other dog neither offered friendship nor accepted it. He stole nothing from the newcomers. He was gloomy and unfriendly, and he made his wishes clear to Curly. He wanted to be left alone, and anyone who bothered him would find trouble. His name was Dave.
        - id: ch01-b81
          speaker: narrator
          text: >-
            Dave ate and slept. Between meals and sleep, he yawned. Nothing interested him. Even when the Narwhal crossed Queen Charlotte Sound and rolled, pitched, and bucked as if possessed, Dave did not care. Buck and Curly became excited and almost wild with fear. Dave only raised his head as if the whole commotion annoyed him. He gave them one empty, incurious glance, yawned, and went back to sleep.
        - id: ch01-b82
          speaker: narrator
          text: >-
            Day and night, the ship pulsed with the endless beat of its propeller. The days seemed much the same, but Buck could tell that the air was steadily becoming colder.
        - id: ch01-b83
          speaker: narrator
          text: >-
            Then one morning, the propeller fell silent. Excitement filled the Narwhal. Buck felt it, and so did the other dogs. They all knew that something was about to change. François fastened leashes to them and led them onto the deck.
        - id: ch01-b84
          speaker: narrator
          text: >-
            Buck took one step onto the cold surface, and his feet sank into something white and soft that felt almost like mud. He jumped backward with a snort. More of the white stuff drifted down through the air. He shook it from his coat, but still more landed on him.
        - id: ch01-b85
          speaker: narrator
          text: >-
            Buck sniffed it carefully. Then he touched some with his tongue. It stung like fire, and an instant later it vanished. He was puzzled. He tried again, and the same thing happened.
        - id: ch01-b86
          speaker: narrator
          text: >-
            The people watching him burst into laughter. Buck felt ashamed, though he had no idea why.
        - id: ch01-b87
          speaker: narrator
          text: "It was the first snow he had ever seen."
