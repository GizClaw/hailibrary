audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 生动沉稳，时刻留意逼近的危险
        timbre: 温暖浑厚，清晰有力
        pace: 从容有度
        pitch: 中音
    john_thornton:
      display_name: 约翰·桑顿
      tts:
        delivery: 沉着寡言，动怒时迸发出强烈力量
        timbre: 温厚坚实
        pace: 从容
        pitch: 中低音
    pete:
      display_name: 皮特
      tts:
        delivery: 朴实老练，说话直截了当
        timbre: 粗厚清楚
        pace: 适中
        pitch: 中低音
    hans:
      display_name: 汉斯
      tts:
        delivery: 寡言可靠，带一点明显的外乡口音
        timbre: 低沉结实
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 向东方去
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            巴克用五分钟替约翰·桑顿赢来一千六百美元。桑顿还清了几笔债，也终于能和伙伴们向东方进发，去找传说中那座失落的金矿。关于它的故事，和这片土地一样古老。找过它的人很多，真正找到的少得可怜，还有许多人从此再没回来。没有人知道最早发现它的是谁。最古老的传说追到半路，也找不到那个人，只说从一开始，那里就有间破败的小屋。临死的人赌咒说自己见过小屋，也见过小屋标出的金矿。他们还拿出过几块天然金块，北方再没有同样品级的金子。
        - id: ch01-b02
          speaker: narrator
          text: >-
            可是，活人从没带走那座宝库，死人也不会再开口。于是桑顿、皮特和汉斯带着巴克和另外六条狗，沿一条无人知晓的路迎着东方而去。许多同他们一样出色的人和狗都失败过，他们偏要试一试。他们沿育空河上行七十英里，再转入斯图尔特河，经过梅奥河和麦奎斯琴河，直到宽阔的斯图尔特河缩成一道细流，在大陆脊梁般高耸的群峰间穿行。
        - id: ch01-b03
          speaker: narrator
          text: >-
            桑顿向人和自然索取的都很少，也从来不怕荒野。带上一把盐和一支步枪，他便敢走进无人之地，想去哪里就去哪里，想待多久就待多久。他不赶时间，只管边走边猎取当天的食物。若是什么也没打到，他便继续赶路，因为他知道，早晚总会碰上猎物。这趟东方之旅，他们只吃肉，雪橇上主要装弹药和工具。至于哪天走到目的地，他们把答案留给无边无际的未来。
        - id: ch01-b04
          speaker: narrator
          text: >-
            巴克却快活极了。他们在陌生的地方打猎、捕鱼，没有期限地四处游荡。有时一走就是几星期，有时又在一处扎营好几个星期。狗们闲着，男人们在火边烧穿冻土和砂砾，一盘接一盘地淘洗泥沙。猎物少，他们便挨饿。运气好，他们便痛痛快快地大吃。夏天到来后，人和狗都背起行李，扎木筏渡过湛蓝的高山湖，又用现砍现锯的木料做成窄船，沿无名的河流上行或下行。
        - id: ch01-b05
          speaker: narrator
          text: >-
            几个月过去，他们还在没有地图的荒野里来回穿行。那里眼下无人居住，可如果“失落的小屋”真有其事，从前便有人到过。他们在夏日暴风雪里翻越分水岭，在林木线与终年积雪之间光秃秃的山上迎着午夜太阳发抖，也走进蚋虫和苍蝇成群飞舞的温暖山谷。他们曾在冰川阴影里摘到成熟的草莓和盛开的鲜花。那果实与花朵又新鲜又美丽，和南方最好的出产相比也毫不逊色。
        - id: ch01-b06
          speaker: narrator
          text: >-
            秋天，他们深入一片古怪的湖区。那里悲凉、安静，曾有过野禽，如今却连一点生命的踪迹都没有。寒风不停吹，背风处慢慢结冰，孤单的岸边只响着忧郁的细浪。又过了一个冬天，他们沿前人早已消失的足迹继续寻找。一次，他们发现林中一条留有古老路标的小径，仿佛失落的小屋近在眼前。可小径没有起点，也没有终点。它和开路的人一样神秘。那人是谁，为什么开出这条路，没有谁知道。
        - id: ch01-b07
          speaker: narrator
          text: >-
            还有一次，他们找到一座被岁月毁坏的狩猎小屋。桑顿在烂毯子的碎片里翻出一支长枪管燧发枪。他认得，这是哈德逊湾公司的老枪，来自西北地区还很年轻的年代。那时，一支这样的枪，能换来与枪身同高的一摞海狸皮。除此以外，再没有任何线索。早年搭起小屋的人是谁，又为什么把枪留在那里，他们依旧无从知道。
        - id: ch01-b08
          speaker: narrator
          text: >-
            春天再次到来。走过那么多地方，他们没有找到失落的小屋，却在一座宽阔山谷里发现了浅浅的砂金矿。洗矿盘底，金子像黄油一样闪亮。他们不再寻找了。每天挖出的纯净金沙和天然金块都价值几千美元，他们便一天接一天地干下去。黄金装进驼鹿皮袋，每袋五十磅，像木柴一样堆在云杉枝小屋外。三个男人如同巨人般劳作。日子紧追着日子，像梦一样一闪而过，财宝却越堆越高。
    - id: ch02
      title: 森林的声音
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            狗们没有多少活计，偶尔只要拖回桑顿打到的肉。巴克常在火边一坐就是几个钟头。事情一少，那个腿短、浑身长毛的人的幻影便更常出现。巴克眯着眼望向火光，又跟着他走进记忆里的另一个世界。
        - id: ch02-b02
          speaker: narrator
          text: >-
            那个世界里，最鲜明的感觉就是恐惧。毛人睡在火边，把头埋在膝间，双手罩在脑袋上。他总睡不安稳，一次次惊醒，害怕地望向黑暗，再往火里添柴。他在海滩上边走边捡贝类，捡到便吃，眼睛却不停寻找暗处的危险，双腿也随时准备奔逃。巴克跟在他脚后，一人一狗无声地穿过森林。他们耳朵转动，鼻孔翕张，同样警觉。毛人的听觉与嗅觉，竟和巴克一样灵敏。
        - id: ch02-b03
          speaker: narrator
          text: >-
            毛人还能跃上树，用双臂从一根树枝荡到另一根。两根树枝就算相隔十二英尺，他也敢松手扑过去，从不跌落，也从不抓空。他在树上和在地面一样自在。巴克记得有些夜晚，他守在树下，毛人就在枝头过夜，连睡着时也紧紧攀着树干。
        - id: ch02-b04
          speaker: narrator
          text: >-
            与毛人的幻影一同出现的，还有森林深处那道召唤。它使巴克烦躁，也勾起陌生的欲望。它带来一种说不清的甜美欢喜，搅动他的野性，可他不知道自己究竟在渴望什么。有时，他追着召唤走进森林，像是在寻找一件摸得着的东西。他会随心情低低吠叫，也会忽然变得强硬，朝树林挑衅地叫出声。他把鼻子伸进清凉的苔藓，也伸进长草下的黑土，闻见肥沃泥土的浓厚气息，便快活地喷着鼻息。
        - id: ch02-b05
          speaker: narrator
          text: >-
            有时，巴克会藏到长满菌类的倒木后，一伏就是几个钟头。他睁大眼，竖起耳朵，留意周围所有声音和动静，像是想出其不意地抓住那道召唤。可他并不知道自己为什么要这样做。那股力量推着他，他便照做，从不追问理由。
        - id: ch02-b06
          speaker: narrator
          text: >-
            无法抵抗的冲动常会突然抓住他。刚才他还在营地里晒着暖阳打盹，下一刻便抬起脑袋，竖直双耳，仔细倾听。随后，他跳起来冲进森林，一跑就是几个钟头，穿过林间长廊，也越过长满草墩的空地。他爱沿干河道奔跑，也爱悄悄靠近林鸟。他能在灌木丛里趴上一整天，看松鸡振翅如擂鼓，看它们昂着头走来走去。
        - id: ch02-b07
          speaker: narrator
          text: >-
            他最爱的，还是夏日午夜那一片昏暗的暮色。那时，他在森林里奔跑，听四周低低响着困倦的呢喃。他像人读书一样读懂声音和痕迹，一直寻找那神秘的东西。无论清醒还是睡着，那东西都在呼唤他，要他过去。
        - id: ch02-b08
          speaker: narrator
          text: >-
            一天夜里，巴克猛然惊醒。他睁大眼睛，鼻孔颤动，颈毛一阵阵竖起。森林里传来一道从未如此清楚的声音。那只是召唤的一个音符，因为召唤有无数声调。这是一声长长的嗥叫，像爱斯基摩犬，又不完全像。巴克却认得它。那古老而熟悉的感觉告诉他，自己从前听过。
        - id: ch02-b09
          speaker: narrator
          text: >-
            他无声地冲过沉睡的营地，飞奔进树林。离叫声越近，他越谨慎，脚步也越慢。最后，他来到一片林间空地，看见一头瘦长的森林狼蹲坐在那里，鼻尖指着天空，正在长嗥。
        - id: ch02-b10
          speaker: narrator
          text: >-
            巴克一点声音也没发出，那头狼却停下嗥叫，开始嗅察他的存在。巴克半伏着走进空地，身子紧紧收拢，尾巴又直又硬，落脚比平时格外小心。每个动作都带着威胁，也带着友好的试探。捕食的野兽初次相遇，便会达成这种危险的休战。可是狼一见他便逃。巴克疯狂地跳跃追赶，直到把它逼进溪床上一条无路可走的岔道。前方堵满木头，狼猛地转过身来，像乔，也像所有被逼到绝境的爱斯基摩犬。它龇牙低吼，毛发倒竖，牙齿飞快地咔咔咬合。
        - id: ch02-b11
          speaker: narrator
          text: >-
            巴克没有进攻，只围着它转圈，一次次友好地靠近。狼既怀疑又害怕。巴克的体重足有它三倍，它的头顶也只到巴克肩头。狼找准机会逃走，追逐便再次开始。巴克一次次追上它，它又一次次转身迎战，随即抓住机会再逃。那头狼太虚弱了，不然巴克也不会这么容易赶上它。
        - id: ch02-b12
          speaker: narrator
          text: >-
            巴克始终没有放弃。狼终于明白他没有恶意，便凑过来碰了碰鼻尖。很快，他们亲近起来，用凶猛野兽特有的方式玩耍，紧张里带着一点羞怯，像是连它们自己也不肯承认本性有多凶。过了一阵，狼迈着轻松的小跑离开，清楚地表示自己要去一个地方，也示意巴克跟上。于是，他们肩并肩跑进幽暗暮色，沿溪床向上，穿过峡谷，再越过荒凉的分水岭。
        - id: ch02-b13
          speaker: narrator
          text: >-
            分水岭另一边是一片平坦土地，大片森林连着一条条溪流。他们在其中不停奔跑。太阳越升越高，天气越来越热，巴克却欣喜若狂。他终于回应了召唤，正跟着森林里的兄弟，奔向召唤传来的地方。古老的记忆不断涌上来。他从前做过这件事，就在那个依稀记得的幽暗世界里。现在，他又一次自由地跑过旷野，脚踩无人踏过的土地，头顶是辽阔的天空。
    - id: ch03
      title: 荒野兄弟
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            他们在一条奔流的溪边停下喝水。巴克刚停住，便想起约翰·桑顿。他坐了下来。狼继续朝召唤传来的地方走，又回到巴克身边，碰他的鼻尖，用动作催他同行。巴克却转过身，慢慢往回走。将近一个钟头，狼一直跟在旁边低声呜咽。后来，它坐下来，对着天空发出一声悲凉的长嗥。巴克没有回头。那声音越来越轻，越来越远，最后消失了。
        - id: ch03-b02
          speaker: narrator
          text: >-
            桑顿正在吃饭，巴克猛地冲进营地，发狂似的扑向他。他把桑顿撞翻，爬到他身上，又舔脸，又咬手。桑顿说巴克活像个胡闹的大将军，一边骂着亲热的话，一边前后摇晃他的脑袋。
        - id: ch03-b03
          speaker: narrator
          text: >-
            两天两夜，巴克一步也不离开营地，更不让桑顿走出视线。桑顿干活，他跟着。桑顿吃饭，他看着。夜里，他看桑顿钻进毯子，清晨又看桑顿出来。可两天以后，森林里的呼唤变得比从前更强硬。巴克又开始焦躁，荒野兄弟、分水岭那边欢欣的土地，还有他们并肩穿过森林的奔跑，全回到了心里。
        - id: ch03-b04
          speaker: narrator
          text: >-
            他再次独自进林游荡。荒野兄弟没有回来，那声悲凉的长嗥也没再响起。后来，巴克开始在外面过夜，一走就是好几天。有一次，他越过溪源的分水岭，进入森林与河流纵横的土地，在那里找了整整一星期，却没有发现荒野兄弟的新鲜踪迹。他边走边捕食，用永不疲倦般的舒缓长步一直向前。
        - id: ch03-b05
          speaker: narrator
          text: >-
            巴克在一条宽河中捕捉鲑鱼。那条河不知流向哪一片海。他还在河边杀死一头大黑熊。黑熊也在捕鱼，却被蚊群叮瞎了眼，只能在森林里无助地横冲直撞。它虽然看不见，狂怒中依旧可怕。这一战十分艰苦，也把巴克心底最后一点潜藏的凶性唤醒。两天后，他回到猎物旁，发现十几只狼獾在抢夺尸体。他把它们像糠秕一样赶散。狼獾逃跑时，留下两个再也不会争吵的同伴。
        - id: ch03-b06
          speaker: narrator
          text: >-
            巴克对鲜血的渴望更加强烈。他成了真正的杀戮者和猎食者，靠活物养活自己，不要任何帮助，只凭自己的力量与本领，在充满敌意、只有强者才能生存的天地里胜利地活下去。他为自己感到骄傲，而这份骄傲像传染一样进入了身体。每个动作，每块肌肉的收放，还有他昂然的姿态，都在明明白白地说出这份骄傲。就连那身华美的皮毛，也显得更加灿烂。
        - id: ch03-b07
          speaker: narrator
          text: >-
            除了口鼻和眼睛上方的几处棕毛，还有胸膛中央的一道白毛，巴克完全像一头巨狼，比最大的狼还要大。他从圣伯纳犬父亲那里得到了体形与重量，牧羊犬母亲则给了他这副身体的轮廓。他有狼的长口鼻，只是比任何狼都大。他的头也像狼，却更加宽阔雄伟。
        - id: ch03-b08
          speaker: narrator
          text: >-
            巴克有狼与荒野的机诈，也有牧羊犬和圣伯纳犬的智慧。再加上世间最严酷的学校教给他的经验，他成了荒野中最可怕的生灵之一。此刻，他只吃肉，生命正在最旺盛的峰顶绽放，精力和雄性力量充盈得几乎要溢出来。桑顿的手掌顺着他背脊抚过，手到之处便噼啪轻响，每根毛都像在接触时释放积存的磁力。
        - id: ch03-b09
          speaker: narrator
          text: >-
            巴克的头脑和身体，每根神经、每缕纤维，都已调到最敏锐的状态，彼此又配合得恰到好处。一旦有什么景象、声音或事情需要他行动，他的反应便快如闪电。寻常爱斯基摩犬跃起自卫或攻击已经够快，他却还能快上一倍。别的狗刚看见动作或听见声音，他已经察觉、判断并作出反应。这三步其实仍有先后，只是中间的间隔短到几乎不存在，看起来才像同时发生。
        - id: ch03-b10
          speaker: narrator
          text: >-
            他的肌肉饱含生命力，像钢制弹簧一样猛然弹开。生命在体内化作辉煌的洪流，欢欣而恣意地奔涌，仿佛那份狂喜随时会撑开他的身体，慷慨地洒向整个世界。
        - id: ch03-b11
          speaker: john_thornton
          text: 世上哪有第二条这样的狗。
        - id: ch03-b12
          speaker: narrator
          text: >-
            一天，桑顿看着巴克昂然走出营地，说出了这句话。
        - id: ch03-b13
          speaker: pete
          text: 造他的模子呀，用一次就碎了。
        - id: ch03-b14
          speaker: hans
          text: 老天爷！俺寻思也是。
        - id: ch03-b15
          speaker: narrator
          text: >-
            三个人只看见巴克昂然离开，却没看见他进入森林后那场突然的变化。他立刻收起步态，变成荒野中的生灵。他像猫一样无声潜行，是一道在阴影中出现又消失的影子。他知道怎样借每一处树干、灌木和地势藏住身体，会贴着肚皮像蛇那样爬，也会像蛇一样突然跃起，一击咬住猎物。他能从窝里叼走雷鸟，杀死睡梦中的野兔，也能腾空咬住那些晚一瞬才逃向树木的花栗鼠。
        - id: ch03-b16
          speaker: narrator
          text: >-
            明池里的鱼逃不过他，修水坝的海狸也躲不过他。他只为吃东西而杀，不会无缘无故取乐，可他更爱吃自己捕获的食物。他的捕猎里还藏着顽皮的幽默。巴克喜欢悄悄逼近松鼠，眼看就要咬住，却突然放它们逃走，再听它们吓得尖叫，一路窜上树梢。
    - id: ch04
      title: 大公鹿
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            秋天越来越深，驼鹿也越来越多。它们缓缓迁往低处、没那么寒冷的山谷过冬。巴克已经拖倒过一头掉队的半大幼鹿，却渴望更大、更难对付的猎物。一天，他在溪源的分水岭遇见一群二十头驼鹿。走在最前方的是一头巨大的公鹿。它肩高超过六英尺，脾气凶暴，是巴克能盼到的最可怕的对手。
        - id: ch04-b02
          speaker: narrator
          text: >-
            公鹿来回甩动宽阔如掌的巨角。角上分出十四个枝杈，两端相距足有七英尺。那双小眼睛燃着凶狠怨毒的光，它一看见巴克便愤怒咆哮。公鹿一侧、后腿前方露着带羽毛的箭尾。那支箭带来的伤痛，正是它这样狂暴的缘故。
        - id: ch04-b03
          speaker: narrator
          text: >-
            太古狩猎年代传下来的本能告诉巴克，他得把公鹿赶出鹿群。这绝不容易。巴克在公鹿面前吠叫、跳跃，始终躲开巨角，也不让那双一脚就能踩死他的分趾蹄碰到。公鹿不敢背对长着利齿的危险继续走，很快便气得发狂。它朝巴克冲来，巴克就故意装作逃不掉，边退边把它引向远处。可刚一分开，两三头年轻公鹿又会冲回来，让受伤的首领重新加入鹿群。
        - id: ch04-b04
          speaker: narrator
          text: >-
            荒野有自己的耐心。蜘蛛能在网上一动不动地等待，蛇能盘起身子久久静伏，美洲狮也能藏在埋伏处一守再守。这种耐心顽强、不知疲倦，像生命本身一样长久。对捕猎活物的生灵来说，它更是生存的本领。巴克正是靠着这份耐心，死死贴在鹿群侧面。
        - id: ch04-b05
          speaker: narrator
          text: >-
            他拖慢整个鹿群，激怒年轻公鹿，惊扰带着半大幼鹿的母鹿，也让受伤的公鹿因甩不掉他而发狂。整整半天，他从四面八方进攻，仿佛一个巴克变成了许多个，把鹿群卷进威胁的旋风。猎物一回到伙伴身边，他便立刻再把它分离出来。巴克一刻也不停，慢慢耗尽鹿群的忍耐。被捕猎者也有耐心，可终究比不过捕猎者。
        - id: ch04-b06
          speaker: narrator
          text: >-
            太阳渐渐落向西北方。黑暗已经回来，秋夜足有六个钟头。年轻公鹿越来越不肯回头帮助首领。冬天催着它们去往低地，这头永不疲倦的野兽却还拖在身后，怎么也甩不掉。何况巴克索要的并非整个鹿群的性命，也不是它们自己的命。他只要一头同伴。到最后，年轻公鹿甘愿付出这份代价。
        - id: ch04-b07
          speaker: narrator
          text: >-
            暮色降临，老公鹿垂着头站住，看伙伴们在渐暗的天光里拖着沉重脚步匆匆离开。那里有它熟悉的母鹿，有它繁衍的幼鹿，也有它曾经压服的公鹿。可它跟不上去。就在鼻尖前，一头长满利齿、毫不留情的野兽不断跳跃，绝不放它离开。大公鹿重达一千三百多磅。它强壮地活过漫长岁月，一生都是战斗与挣扎。如今，它要面对的死亡，却来自一头脑袋还够不到它粗大膝节的生灵。
        - id: ch04-b08
          speaker: narrator
          text: >-
            从此，巴克不分昼夜地守住猎物，不给它片刻休息，也不让它吃树叶或白桦、柳树的嫩枝。经过一道道涓涓细流时，他连一口水也不许它喝，任由灼人的干渴折磨公鹿。公鹿绝望地长途奔逃，巴克并不拦它，只轻松跟在后面，对狩猎的进展十分满意。公鹿停住，他就卧倒。公鹿一想吃草或喝水，他便凶猛扑上去。
        - id: ch04-b09
          speaker: narrator
          text: >-
            那棵巨角之树压得公鹿的头越来越低，它蹒跚的小跑也越来越无力。它开始长久站着，鼻子垂到地面，耳朵沮丧地耷拉下来。巴克因此有了更多时间喝水和休息。他伸着红舌喘气，眼睛盯住大公鹿，却感觉眼前的天地正在变化。
        - id: ch04-b10
          speaker: narrator
          text: >-
            一种新的骚动出现在这片土地上。驼鹿正在到来，别的生命也在到来。森林、河流和空气仿佛都因它们而颤动。这个消息不是由景象、声音或气味传来的。巴克什么也没看见，什么也没听见，却用一种更加微妙的感觉知道，一切已经不同。有陌生的东西在四处行动、游荡。他决定，等眼前的事结束，便去看个明白。
        - id: ch04-b11
          speaker: narrator
          text: >-
            第四天将尽时，巴克终于拖倒大公鹿。接下来一昼夜，他守在尸体旁，吃一阵，睡一阵。等他休息够了，精神与力量全都恢复，便转身奔向营地，奔向约翰·桑顿。他迈开舒缓的长步，一小时又一小时地前进。陌生的道路再复杂，他也从不迷失，只管笔直回家。他辨认方向的本领，就连人和手中的磁针也比不上。
    - id: ch05
      title: 营地的灾祸
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            越往前，巴克越清楚地感到大地上的异动。这里出现了整个夏天都不曾有过的生命。这一次，不需要那种神秘的感觉。鸟儿在谈论，松鼠在诉说，连微风也在耳语。巴克几次停住，大口嗅闻清晨的空气，从中读到消息，随后跑得更快。一场灾祸像重物一样压着他。就算不是正在发生，也一定已经发生了。他越过最后一道分水岭，朝营地所在的山谷下去，脚步也更加小心。
        - id: ch05-b02
          speaker: narrator
          text: >-
            离营地还有三英里，他发现一道新鲜足迹，颈毛立刻一阵阵竖起。足迹直通营地，也直通约翰·桑顿。巴克迅速而安静地追去，每根神经都绷得发紧。他留心所有细节。那些细节正在讲述一件事情，只藏起了最后的结局。他的鼻子从一路变化的气息里，辨认出前方那些生命经过时留下的故事。他也听见森林那意味深长的寂静。鸟儿已经飞走，松鼠全躲起来了。唯一能看见的，是一只紧贴灰色枯枝的灰松鼠。它皮毛光滑，身体一动不动，像是长进了木头，变成枝上的木瘤。
        - id: ch05-b03
          speaker: narrator
          text: >-
            巴克像暗影一样向前滑去，鼻子忽然被一股力量扯向旁边。他循着新气味走进灌木丛，找到了尼格。尼格侧身躺着，死在挣扎爬到的地方。一支箭贯穿他的身体，箭头与箭羽从两边露出。
        - id: ch05-b04
          speaker: narrator
          text: >-
            再走一百码，巴克看见桑顿在道森买来的一条雪橇犬。那条狗就在路上垂死挣扎。巴克绕过它，没有停。营地方向传来许多人的声音，远远地随着单调的吟唱一起起伏。他伏低身体，贴着肚皮爬到空地边缘，看见汉斯脸朝下倒在那里，身上插满羽箭，像一只豪猪。
        - id: ch05-b05
          speaker: narrator
          text: >-
            就在那一刻，巴克越过云杉枝小屋的遗址向外看去。眼前的景象让他颈肩上的毛根根直立。一阵无法压制的狂怒席卷全身。他没有意识到自己正在低吼，却发出可怕而凶猛的声音。这是他一生中最后一次让感情压倒机诈与理智。因为深爱约翰·桑顿，他彻底失去了控制。
        - id: ch05-b06
          speaker: narrator
          text: >-
            伊哈特人围着小屋的残骸跳舞。听见那声咆哮时，他们看见一头从未见过的野兽猛冲而来。那是巴克，是一阵活生生的愤怒飓风。他发狂般扑进人群，只想毁灭。他先跃向最前面的酋长，一口撕开喉咙，破裂的颈静脉喷出鲜血。巴克没有停下，只在掠过时再咬一口，下一跃又扯开第二个人的喉咙。
        - id: ch05-b07
          speaker: narrator
          text: >-
            没有人挡得住他。巴克冲到人群正中，不停扑咬、撕裂、毁灭。他始终在迅猛移动，快得让射来的箭全都落空。印第安人挤在一起，互相纠缠阻挡，慌乱中反而用箭射中了自己人。一名年轻猎人朝半空中的巴克投出长矛，却刺穿另一个猎人的胸膛。力量如此之大，矛尖从那人的后背穿破皮肉，直露到外面。伊哈特人终于陷入恐慌，惊叫着逃进森林，边跑边高喊邪灵降临。
        - id: ch05-b08
          speaker: narrator
          text: >-
            那一刻，巴克的确像一个恶魔。他追进林中，把那些人像鹿一样拖倒。这一天给伊哈特人带来了一场灾难。他们逃得到处都是，直到一星期后，最后一批幸存者才在下游山谷相聚，清点损失。
        - id: ch05-b09
          speaker: narrator
          text: >-
            巴克追累了，便回到毁坏殆尽的营地。他在毯子里找到了皮特。袭击来得突然，皮特在最初的惊变中就被杀死。地面上还清楚写着桑顿拼命搏斗的经过。巴克低头追踪，嗅出了每一个细节，一直来到一口深潭边。斯基特躺在那里，头和两只前爪都浸在水中。直到最后一刻，她仍忠心地守着主人。
        - id: ch05-b10
          speaker: narrator
          text: >-
            淘金槽排出的泥水搅浑了深潭，把水下的一切都藏了起来。约翰·桑顿就在里面。巴克顺着他的踪迹走入水中，却再也找不到一道离开潭水的踪迹。
        - id: ch05-b11
          speaker: narrator
          text: >-
            整整一天，巴克守在潭边沉思，又不安地在营地里走来走去。他知道死亡是什么。死亡就是动作停止，一个生命从所有活着的生命中退去，离开，再也不回来。此刻他也清楚知道，约翰·桑顿已经死了。
        - id: ch05-b12
          speaker: narrator
          text: >-
            巴克的身体里留下一个巨大的空洞。它有点像饥饿，却一直疼，一直疼，吃多少东西也填不满。有时，他望着伊哈特人的尸体，暂时忘了疼痛，便感觉到一种从未有过的强烈骄傲。他杀死了人，杀死了最高贵的猎物，而且是在棍棒与利齿的法则面前完成的。
        - id: ch05-b13
          speaker: narrator
          text: >-
            他好奇地嗅着尸体。杀死人原来这么容易，甚至比杀死一条爱斯基摩犬还容易。如果手里没有弓箭、长矛和棍棒，他们根本不是他的对手。从今以后，除非人握着那些武器，巴克再也不会怕他们。
    - id: ch06
      title: 最后的牵绊
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            夜幕落下，一轮满月越过树梢，升到高空。整片大地都沐浴在月光里，亮得如同幽灵出没的白昼。巴克仍在潭边沉思，也仍在为桑顿哀悼，却渐渐感觉到森林里有新的生命在活动。这一次，不是伊哈特人带来的动静。他站起来，一边仔细倾听，一边迎风嗅闻。远处先飘来一声微弱而尖厉的短嗥，接着响起一片同样的声音。时间一点点过去，短嗥越来越近，也越来越响。
        - id: ch06-b02
          speaker: narrator
          text: >-
            巴克又认出了它们。那些声音来自记忆中从未消失的另一个世界。他走到空地中央，静静听着。这正是召唤，是那道拥有无数声调的召唤。它从来没有这么诱人，也从来没有这样不可抗拒。巴克也终于愿意服从了。约翰·桑顿已经死去，最后的牵绊已经断开。人和人的要求，再也不能留住他。
        - id: ch06-b03
          speaker: narrator
          text: >-
            狼群一直追着迁徙的驼鹿猎取鲜肉，就像伊哈特人所做的那样。如今，它们终于从河流与森林的土地越过分水岭，进入巴克的山谷。狼群涌进月光照亮的空地，像一道银色洪流。巴克一动不动地站在中央，如同雕像，等着它们。
        - id: ch06-b04
          speaker: narrator
          text: >-
            他太高大，也太安静，狼群不由得害怕，停住片刻。最大胆的一头狼突然直扑过来。巴克快如闪电，一口咬断它的脖子。随后，他又站回原处，一动不动。受伤的狼在背后痛苦翻滚。又有三头狼接连冲来，也一个个流着血退走，喉咙或肩膀已经被撕裂。
        - id: ch06-b05
          speaker: narrator
          text: >-
            整个狼群被激怒了。它们一拥而上，争先恐后地想要拖倒巴克，却因为太过急切而挤成一团，彼此阻挡，乱作一片。巴克惊人的速度和敏捷救了他。他以后腿为轴不断旋转，利齿不停咬下，也一次次撕开扑来的身体，仿佛处处都有他的身影。他转身太快，从一边守到另一边，左右来回防卫，正面始终没有一道破绽。
        - id: ch06-b06
          speaker: narrator
          text: >-
            为了不让狼绕到背后，巴克只能一步步退。他经过深潭，退入溪床，直到背靠高高的砂砾岸。他沿岸壁移到男人们采矿时挖出的直角凹口。三面都有遮挡，他只需要守住正前方。
        - id: ch06-b07
          speaker: narrator
          text: >-
            巴克就这样守住正面。半个钟头以后，狼群终于受挫后退。每头狼都把舌头长长伸在嘴外，不停喘息。月光下，它们的白色獠牙显得格外惨白，也格外凶狠。有些趴在地上，抬着头，双耳朝前竖起。有些仍站着盯住巴克。还有一些走到潭边，低头舔水喝。
        - id: ch06-b08
          speaker: narrator
          text: >-
            一头瘦长的灰狼友好而谨慎地走过来。巴克认出，这就是曾同他共度一夜一天的荒野兄弟。狼低声呜咽，巴克也用呜咽回应。它们碰了碰鼻尖。
        - id: ch06-b09
          speaker: narrator
          text: >-
            接着，一头瘦削而满身战痕的老狼走上前。巴克掀起嘴唇，差点发出低吼，最后却也和它鼻尖相碰。老狼坐下来，抬头对着月亮，发出悠长的狼嗥。其余的狼也坐下，一起仰头长嗥。
        - id: ch06-b10
          speaker: narrator
          text: >-
            这一回，召唤的意思清清楚楚。巴克也坐下来，跟着狼群嗥叫。等声音停下，他走出凹口。狼群立刻围过来，半是友好、半是凶野地嗅着他。首领们发出启程的短嗥，跃进树林。群狼跟在后面，齐声叫着。巴克也奔入狼群，与荒野兄弟肩并肩，一边跑，一边长嗥。
    - id: ch07
      title: 幽灵犬的传说
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            巴克的故事讲到这里，本来已经可以结束。可没过几年，伊哈特人发现森林狼的血统变了。有些狼的头顶和口鼻带着棕色斑块，胸膛中央也裂开一道白毛。更奇怪的是，他们说起一条跑在狼群最前面的幽灵犬。
        - id: ch07-b02
          speaker: narrator
          text: >-
            伊哈特人害怕它，因为它比他们更狡猾。最冷的冬天里，它会偷偷进入营地，劫掠他们设下的陷阱，杀死他们的狗，还敢正面挑战最勇猛的猎人。故事后来变得更加可怕。有的猎人出发后，再也没能回到营地。还有一些人被族人找到时，喉咙已经残酷地撕开，四周雪地上全是狼的脚印。其中一双，比任何狼的脚印都大。
        - id: ch07-b03
          speaker: narrator
          text: >-
            每年秋天，伊哈特人追随迁徙的驼鹿，总有一座山谷是他们绝不会进去的。每当火边传开消息，说邪灵选了那座山谷居住，女人们便会难过起来。
        - id: ch07-b04
          speaker: narrator
          text: >-
            可是在夏天，总有一位伊哈特人不知道的访客来到那里。那是一头巨大而美丽的狼，身上的长毛灿烂华美。它很像别的狼，却又完全不同。它独自离开那片欢欣的森林与溪流，走进树林中的空地。腐烂的驼鹿皮袋里流出黄色细流，慢慢渗进泥土。长长的青草从金沙中长出来，腐殖土也越盖越厚，把那片黄色彻底藏在阳光之下。
        - id: ch07-b05
          speaker: narrator
          text: >-
            它会在这里默默停留一阵，久久沉思。离开以前，它总要发出一声悠长而悲凉的嗥叫。
        - id: ch07-b06
          speaker: narrator
          text: >-
            但它并不总是独自出现。漫长的冬夜来临后，狼群会追着赖以为生的猎物进入低处的山谷。人们也许会看见它跑在狼群最前方，穿过惨淡的月光，穿过微微闪烁的北极光。它庞大的身躯高高跃过同伴，巨大的喉咙放声轰鸣。它唱的是一首属于更年轻世界的歌。那就是狼群之歌。
