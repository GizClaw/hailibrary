  chapters:
    - id: ch01
      title: "Chapter VII. The Sounding of the Call"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Buck had earned sixteen hundred dollars for John Thornton in five minutes. That money cleared Thornton's debts and let him and his partners head east in search of a legendary lost mine. The tale of it was as old as the country. Many men had gone looking. Few had found it, and more than a few had never come back. Tragedy and mystery covered the mine. No one even knew who had first discovered it. The oldest stories began with an ancient, broken-down cabin. Dying men swore the cabin was real and marked the mine's location. As proof, they showed nuggets unlike any other gold known in the Northland.
        - id: ch01-b02
          speaker: narrator
          text: >-
            No living man had carried off that treasure, and the dead could tell no more. So Thornton, Pete, and Hans set out with Buck and half a dozen other dogs. They turned east onto an unknown trail, meaning to succeed where men and dogs just as good had failed. They sledded seventy miles up the Yukon, turned into the Stewart River, and passed both the Mayo and the McQuestion. Still they kept going. At last the Stewart itself narrowed to a stream that threaded among the high, standing peaks along the continent's backbone.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Thornton asked little from people or from nature, and the wild did not frighten him. Give him a rifle and a handful of salt, and he could plunge into the wilderness, travel wherever he wished, and stay as long as he wished. He never hurried. Like the Native hunters of that country, he looked for dinner while the party moved. If he found nothing that day, he simply kept traveling, certain that sooner or later food would come. On this great eastern journey, they ate meat alone. Their sled carried mostly ammunition and tools. No fixed date hurried them onward. Their schedule reached out into a future without limits.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Buck found endless delight in every part of it: the hunting, the fishing, and the wandering with no known end through strange country. Sometimes they traveled steadily for weeks, moving forward day after day. Then they might camp here or there for weeks more. The dogs loafed while the men used fire to burn holes down through frozen mud and gravel. By the heat of those fires, the men washed countless pans of dirt. When game was scarce, the whole party went hungry. When hunting was fortunate, they feasted wildly. Summer came at last. Men and dogs carried packs on their backs, crossed blue mountain lakes on rafts, and went up and down unknown rivers in narrow boats they had sawed from trees in the standing forest.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The months came and went while they twisted back and forth through a vast country no map had ever marked. No one lived there now, though people must once have passed that way if the story of the Lost Cabin was true. The travelers crossed high divides while summer blizzards beat around them. On bare mountains beneath the midnight sun, they shivered in the strip of land between the last trees and the everlasting snow. Then they dropped into warm summer valleys where clouds of gnats and flies swarmed around them. In the shadows of glaciers, they picked ripe strawberries and flowers as fresh and beautiful as anything the Southland could offer.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Autumn brought them into a strange country of lakes. It was silent and sorrowful. Birds had once lived there, but now there was no life and no trace of life. Cold winds blew. Ice formed in sheltered corners. Along the empty beaches, the waves made a lonely, mournful sound.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Through another winter, they followed trails that earlier travelers had almost erased. Once they found an old path cut through the forest, and the Lost Cabin seemed close at last. Yet the path began nowhere and ended nowhere. Who had made it, and why, remained a mystery. Another time they found the ruined remains of a hunting lodge. Among scraps of rotten blankets, Thornton discovered a long-barreled flintlock. It was an old Hudson Bay Company gun from the early Northwest, when a gun like that was traded for a stack of beaver skins as tall as the weapon itself. But that was all they learned. Nothing told them who had built the lodge or left the gun behind.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Spring returned once more. At the end of all that wandering, they found no Lost Cabin. Instead, in a broad valley they discovered a shallow placer where gold spread across the bottom of the washing pan like yellow butter. They looked no farther. Every single day of work brought them thousands of dollars in clean gold dust and nuggets, and every single day they worked. They packed the gold into moose-hide sacks, fifty pounds to each one. Outside their lodge of spruce boughs, the heavy bags rose in piles like so much firewood. The three men labored like giants. One day flashed after another as quickly as dreams while the treasure heap grew.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The dogs had little to do except haul in an animal Thornton killed from time to time. Buck spent long hours beside the fire. With no work to occupy him, he saw the short-legged, hairy man more often. As Buck blinked into the flames, he seemed to wander beside that man through another world he somehow remembered.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Fear was the strongest thing in that other world. When Buck watched the hairy man sleep by the fire, the man's head was tucked between his knees and his hands were clasped above it. Even then he could not rest. He started awake again and again. Each time, he peered fearfully into the darkness and quickly threw more wood onto the flames. When the two of them walked beside a sea, the man gathered shellfish and ate them as fast as he picked them up. All the while, his eyes moved everywhere in search of hidden danger. At the first sign of it, his legs were ready to carry him away like the wind.
        - id: ch01-b11
          speaker: narrator
          text: >-
            In the forest, Buck followed close at the hairy man's heels. Both crept ahead without a sound, alert and watchful together. Their ears shifted at every noise, and their nostrils trembled as they tested the air, for the man could hear and smell almost as sharply as Buck. When danger threatened, the man could spring into the trees. He traveled through the branches as quickly as he moved on the ground, swinging by his arms from one limb to the next. Some branches were twelve feet apart. He let go, flew across the empty space, and always caught the next one without falling or missing his grip. He seemed as comfortable among the trees as he was on the earth. Buck remembered long nights of watch below while the man slept high in a tree, holding tightly to a branch even in his sleep.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Closely tied to those visions was the call that still sounded from deep in the forest. It filled Buck with great restlessness and desires so strange that he could not name them. At the same time, it brought a dim and sweet gladness. Wild longings moved inside him, though he did not know what he longed for. At times he chased the call among the trees as if it were a solid thing he could find. Depending on his mood, he barked softly or threw out a bold challenge. He pushed his nose deep into cool woodland moss, then into the black soil where long grass grew. The rich, heavy smells of earth made him snort with joy. For hours he crouched as if hidden behind fallen trunks covered in fungus. His eyes opened wide, his ears caught every sound, and he waited for anything that moved. Perhaps he hoped to catch the mysterious call by surprise. Buck himself did not know. The need came over him, and he obeyed it without stopping to reason.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Irresistible urges seized Buck without warning. He might be dozing lazily in camp during the heat of the day when his head suddenly rose and his ears stood forward, listening with complete attention. An instant later, he sprang to his feet and dashed away. For hours he raced down the long aisles of the forest and across open places where rough clumps of grass rose from the ground. He loved following dry streambeds. He also loved creeping through the woods to spy on the birds. Sometimes he spent a whole day hidden in the underbrush, watching partridges drum and strut back and forth. Most of all, he loved running through the dim twilight of summer midnight. He listened to the forest's soft, sleepy murmur and read every sign and sound as a person reads a book. Always he searched for the mysterious something that called him to come, whether he was awake or sleeping.
        - id: ch01-b14
          speaker: narrator
          text: >-
            One night Buck woke with a start. His eyes shone, his nostrils trembled, and waves of raised hair ran along his neck. A long howl came from the forest. It was one clear note of the many-noted call, like the cry of a husky and yet not like it. Buck knew it as something heard long ago. He slipped through the sleeping camp and flew silently between the trees. Near the sound, he slowed and placed every foot with care. At last he looked into an open space and saw a long, lean timber wolf sitting upright, its nose raised toward the sky.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Buck had made no sound, yet the wolf stopped howling and tried to sense where he was. Buck crept into view with his body half crouched and gathered tightly. His tail stood straight and stiff, and each foot came down with unusual care. Every part of him carried two messages at once: a threat and an offer of friendship. It was the dangerous truce that begins when two wild hunters meet. The wolf saw him and fled. Buck bounded after it in a frenzy, desperate to overtake it. He drove the wolf into a dead end in a creek bed, where a jam of timber blocked the way. The wolf spun on its hind legs like Joe or any other cornered husky. It snarled and bristled, snapping its teeth together in one rapid, unbroken series.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Buck did not attack. He circled and pressed closer with friendly gestures. The wolf remained frightened and suspicious. Buck weighed three times as much, and the wolf's head barely reached his shoulder. The wolf found an opening and dashed away. The chase began again. Buck cornered it time after time. The wolf was thin and weak, or Buck could never have caught it so easily. Whenever Buck's head reached its flank, it turned to defend itself, then fled as soon as another chance appeared.
        - id: ch01-b17
          speaker: narrator
          text: >-
            At last Buck's stubborn patience won its reward. The wolf understood that Buck meant no harm, and the two sniffed noses. Soon they were playing. Both were nervous and almost shy, and their half-cautious game hid the fierceness within them. After a while, the wolf set off at an easy lope. The way he moved made it plain that he was going somewhere and wanted Buck to come. Side by side, they ran through the dark twilight. They followed the creek bed straight into the gorge from which it flowed, then climbed across the bare divide where the stream began.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Beyond the watershed lay level country filled with forests and streams. They ran through it for hours as the sun climbed and the day grew warm. Buck was wildly happy. At last he was answering the call, racing beside his wood brother toward the place it came from. Old memories crowded into him. Somewhere in that dim other world, he had done this before. Now he was doing it again, free beneath the open sky with bare earth under his feet.
        - id: ch01-b19
          speaker: narrator
          text: >-
            They stopped beside a running stream to drink. That pause brought John Thornton back into Buck's mind, and he sat down. The wolf continued toward the place where the call surely came from. Then he returned, sniffed noses with Buck, and moved as if trying to encourage him onward. Buck would not go. He turned around and slowly started back along the trail they had run. For most of an hour, the wild brother stayed beside him and whined softly. At last the wolf sat down, pointed his nose toward the sky, and released a mournful howl. Buck held steadily to his homeward way. Behind him, the howl grew fainter and fainter until distance swallowed it completely.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Thornton was eating dinner when Buck burst into camp. Buck threw himself upon him with such love that he knocked him over. He climbed across Thornton, licked his face, and playfully bit his hand. Thornton shook him back and forth, cursed him with affection, and called the whole display general foolishness.
        - id: ch01-b21
          speaker: narrator
          text: >-
            For two days and nights, Buck stayed in camp and never let Thornton leave his sight. He followed him at work, watched him eat, saw him into his blankets at night, and waited for him to rise each morning. Then the forest called more strongly than ever. Buck grew restless again. He remembered his wild brother, the bright land beyond the divide, and their run through the wide forest. He began wandering again, but the wolf did not return. Buck listened through long watches and never heard that mournful howl.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Buck began sleeping out at night and sometimes stayed away from camp for days. Once he crossed the divide at the head of the creek and entered the country of forests and streams. He wandered there for a week, searching without success for a fresh sign of his wild brother. Buck killed his own food while he traveled and covered the ground with a long, easy lope that never seemed to tire him. In a broad stream that flowed somewhere toward the sea, he caught salmon. Beside that stream, he met a huge black bear that was fishing too. Mosquitoes had blinded the animal, and it raged helplessly and terribly through the woods. Even with that advantage, Buck faced a hard fight before he killed it. The battle awakened the last hidden remains of his ferocity.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Two days later, Buck returned to the bear and found twelve wolverines fighting over it. He scattered them like dry husks before the wind. The ones that escaped left two dead behind them.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Buck's hunger for blood grew stronger than it had ever been. He was a killer now, a creature that hunted other living things. Alone and without help, he lived on what he killed through his own strength and skill. He survived triumphantly in a hostile world where only the strong survived. All of this filled him with enormous pride, and the feeling spread through his body. It showed in every movement and in the play of every muscle. The way he carried himself announced it as clearly as speech. Even his glorious coat seemed more glorious. Except for the brown on his muzzle and above his eyes, and the splash of white running down the middle of his chest, he could have been mistaken for a gigantic wolf, larger than any true wolf.
        - id: ch01-b25
          speaker: narrator
          text: >-
            His Saint Bernard father had given him size and weight. From his shepherd mother came the shape of that great body. Buck's muzzle had the long form of a wolf's, only it was larger than the muzzle of any wolf. His head was somewhat broader, like a wolf's head built on a massive scale. He carried the cunning of wolves and of the wild itself. His intelligence came from both shepherd and Saint Bernard. All of that joined with experience gained in the fiercest of schools, making him as dangerous as any creature that traveled the wilderness.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Living on meat kept Buck in full flower, at the highest point of his life. Strength and energy overflowed from him. When Thornton stroked his back, every hair snapped and crackled beneath the moving hand, releasing the force stored inside it. Buck's mind, muscles, nerves, and every fiber of his body were drawn to the finest pitch. Every part worked in perfect balance with all the others. The moment a sight, sound, or event demanded action, he answered with astonishing speed. A husky could leap quickly to attack or defend, but Buck could leap twice as fast. Another dog might still be taking in a movement or noise when Buck had already acted. He seemed to see, decide, and move in one instant. Those actions truly came one after another, but the spaces between were too small to notice. Life rushed through him so powerfully and joyfully that it seemed ready to burst him apart and pour over the world.
        - id: ch01-b27
          speaker: john_thornton
          text: >-
            There has never been another dog like him.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Thornton and his partners watched Buck walk out of camp one day.
        - id: ch01-b29
          speaker: pete
          text: >-
            They broke the mold after they made that one.
        - id: ch01-b30
          speaker: hans
          text: >-
            By jingo, I t'ink so too.
        - id: ch01-b31
          speaker: narrator
          text: >-
            They saw Buck walk away, but they could not see the instant and terrible change once the forest hid him. He no longer marched. At once he became a creature of the wild. Soft-footed as a cat, he passed through the shadows like another shadow, appearing and disappearing among them. He knew how to use every patch of cover. He could crawl flat on his belly like a snake, then leap and strike with a snake's sudden speed. He snatched ptarmigan from their nests, caught rabbits while they slept, and took little chipmunks in midair when they started for the trees one moment too late. Fish swimming through open pools were not quick enough for him. Beavers repairing their dams were watchful, but they were not watchful enough.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Buck killed for food, never merely for the pleasure of killing, and he preferred meat he had hunted himself. Yet a hidden humor ran through his actions. He loved creeping close to squirrels, almost catching them, and then letting them flee to the treetops in terrified chatter.
        - id: ch01-b33
          speaker: narrator
          text: >-
            As autumn approached, moose appeared in greater numbers. They moved slowly down toward the lower valleys, where winter would be less severe. Buck had already caught and pulled down a stray calf that was not yet fully grown, but he wanted a larger and more dangerous animal. One day, on the divide above the creek, he found it. A band of twenty moose had crossed over from the country of streams and forests. Their leader was an enormous bull in a savage temper. He stood more than six feet from the ground and was as dangerous an opponent as Buck could have wished for. The bull swung his great palm-shaped antlers back and forth. They carried fourteen points and spread seven feet between their tips. His small eyes burned with a bitter, vicious light, and at the sight of Buck he roared with fury.
        - id: ch01-b34
          speaker: narrator
          text: >-
            A feathered arrow end stuck from the bull's side, just ahead of his flank. The wound explained his fury. Ancient hunting instinct told Buck to separate him from the herd. Buck barked and danced before him, always just beyond the reach of the antlers and the wide hooves that could stamp out his life. The bull could not turn away from those teeth, and rage drove him to charge. Buck pretended he could barely escape and drew him farther from the others. But each time, two or three younger bulls rushed back at Buck and helped their wounded leader return to the herd.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Buck answered with the patience that belongs to wild hunters. It was dogged, tireless, and stubborn as life itself, the same patience that holds a spider still in its web, a coiled snake waiting, or a panther hidden for hours. For half a day, Buck clung to the herd's side. He slowed their march, irritated the young bulls, worried the cows with their half-grown calves, and drove their wounded leader helpless with rage. Buck seemed to multiply himself. He attacked from every direction and wrapped the herd in a whirlwind of danger. Each time the old bull rejoined the others, Buck cut him away again. The hunted animals began to lose their patience, which could not last as long as the patience of the animal hunting them.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The day wore on, and the sun dropped toward its bed in the northwest. Darkness had returned to the land now, and the autumn nights lasted six hours. Each time Buck separated their leader, the younger bulls turned back more reluctantly to help him. The coming winter drove the herd toward the lower country. Still, this tireless creature kept delaying them, and they seemed unable to shake him off. Their own lives were not in danger. Buck did not threaten the whole herd or even the younger bulls. He demanded the life of only one member. That life mattered less to them than their own, and in the end they were willing to pay the price and leave the wounded bull behind.
        - id: ch01-b37
          speaker: narrator
          text: >-
            In the fading light, the old bull stood with his head lowered and watched his herd hurry away. The cows he knew, the calves he had fathered, and the bulls he had mastered all left him behind. He could not follow while Buck leaped before his nose and held him there. The bull weighed more than half a ton. He had lived a long, powerful life full of battle. Now he faced death from a creature whose head did not reach his great knees.
        - id: ch01-b38
          speaker: narrator
          text: >-
            From then on, Buck stayed with his prey night and day. He gave the bull no rest and would not let him eat birch shoots or willow leaves. When they crossed narrow streams, Buck kept him from drinking. Sometimes the desperate bull ran for a long distance. Buck did not try to stop him. He followed easily, lay down whenever the moose stood still, and attacked the moment the bull tried to eat or drink.
        - id: ch01-b39
          speaker: narrator
          text: >-
            The great head sank lower beneath its tree of antlers, and the bull's stumbling trot grew weaker and weaker. He began standing for long periods with his nose near the earth and his dejected ears hanging loosely. That gave Buck more time to find water and rest. He lay panting with his red tongue hanging out, but his eyes never left the bull. During those pauses, Buck sensed a change coming over the whole face of the land. The moose were arriving, but other kinds of life were coming too. Forest, streams, and air all seemed to beat with their presence. No sight, sound, or smell carried the news. Some finer sense told Buck that the land had changed and that strange beings were moving through it. He decided to investigate as soon as the hunt before him was finished.
        - id: ch01-b40
          speaker: narrator
          text: >-
            At the end of the fourth day, Buck pulled the great moose down. He stayed beside the kill for a day and a night, taking turns eating and sleeping. Then, rested and strong again, he headed toward camp and John Thornton. Hour after hour, he kept his easy pace. Though he crossed country he had never seen, his sense of direction led him home more surely than any compass.
        - id: ch01-b41
          speaker: narrator
          text: >-
            As Buck traveled, the new stir became clearer. The birds spoke of it. Squirrels chattered about it, and the breeze seemed to whisper it. Again and again, he stopped to draw in the morning air. The message he found there sent him forward faster. He felt that some disaster was happening, or had already happened. When he crossed the last watershed and entered the valley of the camp, he moved with greater care.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Three miles from camp, Buck found a fresh trail. At once the hair along his neck rippled and rose. The trail went straight toward camp and John Thornton. Buck hurried after it, moving both quickly and silently. Every nerve was tight, and his attention took in the countless small details around him. Together they told a story, all except the ending. His nose gave him one piece after another about the people whose trail he followed. He noticed the heavy, meaningful silence of the forest. The birds had flown away, and the squirrels were hiding. He saw only one, a sleek gray animal pressed so flat against a dead gray branch that it looked like a growth in the wood itself.
        - id: ch01-b43
          speaker: narrator
          text: >-
            As Buck glided onward, a new scent pulled him sharply aside. In a thicket he found Nig lying dead where he had dragged himself. An arrow had passed through his body, with its head on one side and feathers on the other. A hundred yards farther on, one of Thornton's Dawson sled dogs was dying in the trail. Buck went around him without stopping.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Many voices rose and fell in a faint chant ahead. Buck crawled to the edge of the clearing. There lay Hans, face down and covered with arrows like a porcupine. Then Buck looked toward the place where the spruce-bough lodge had stood. What he saw drove the hair straight up across his neck and shoulders. Rage swept through him so completely that he growled without knowing it. For the last time, passion overcame his cunning and judgment. His great love for John Thornton made him lose his head.
        - id: ch01-b45
          speaker: narrator
          text: >-
            The Yeehats were dancing among the wreckage of the spruce-bough lodge when they heard a terrible roar. An animal unlike anything they had ever seen rushed upon them. It was Buck, a living hurricane of fury, hurling himself into their midst to destroy. He struck the chief first and tore his throat wide open. Blood leaped from the wound, but Buck never stopped over the fallen man. He ripped as he passed, and with his next bound he tore open the throat of another. Nothing could stand against him. He plunged through the crowd in constant, terrifying motion, tearing and striking so quickly that the arrows they fired could not find him.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Buck moved with such impossible speed, and the Yeehats were tangled so closely together, that their arrows struck one another. One young hunter threw a spear at Buck while he was in the air. Instead, the weapon drove through another hunter's chest with such force that its point broke through the skin of his back. Panic seized the Yeehats. They fled in terror into the forest, crying out as they ran that the Evil Spirit had come among them. And Buck truly seemed like a demon made flesh. He raged at their heels and pulled them down like deer as they raced between the trees. It was a terrible day for the Yeehats. The survivors scattered far and wide across the country. A full week passed before the last of them met again in a lower valley and counted those they had lost.
        - id: ch01-b47
          speaker: narrator
          text: >-
            When Buck tired of the chase, he returned to the ruined camp. Pete lay dead in his blankets, killed in the first surprise. The earth held the marks of Thornton's desperate fight, and Buck followed every scent to a deep pool. Skeet lay at its edge with her head and front paws in the water, faithful to the end. Mud from the sluice boxes darkened the pool and hid what was below. Buck traced Thornton into that water. No trail came out.
        - id: ch01-b48
          speaker: narrator
          text: >-
            All day, Buck mourned beside the pool or wandered restlessly through the ruined camp. He understood death as the end of movement, as someone passing out of the lives of all who remained. He knew Thornton was dead. That knowledge opened a great emptiness inside him. It felt something like hunger, but it ached without end, and no food could fill it. At times Buck stopped beside the dead Yeehats. Looking at them made him forget the pain for a little while. Then he became aware of a pride greater than any he had known. He had killed people, the greatest game of all, and he had done it in spite of the law of club and fang. He sniffed the bodies with curiosity. They had died so easily. Killing a husky was harder. Without arrows, spears, and clubs in their hands, people were no match for him at all. From then on, those weapons were the only reason he would fear them.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Night fell. A full moon climbed above the trees and washed the land in a pale, ghostly day. As Buck mourned by the pool, he noticed another life stirring in the forest, something apart from the Yeehats. He stood and listened. Far away came one sharp yelp, then a chorus of yelps. They drew nearer and louder. Once again, Buck recognized sounds from that remembered world.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Buck walked into the center of the clearing. It was the call, the many-noted call, more powerful and inviting than ever. For the first time, he was ready to obey it. John Thornton was dead. The last tie had broken, and no person held any claim on him now.
        - id: ch01-b51
          speaker: narrator
          text: >-
            The wolves hunted living meat just as the Yeehats did. Following the migrating moose, the pack had finally crossed from the country of streams and forests into Buck's valley. They poured into the clearing where moonlight streamed down, flowing over the ground like silver water. Buck waited in the center, still as a statue. His great size and complete stillness awed them, and for a moment the pack paused. Then the boldest wolf leaped straight at him. Buck struck like a flash and broke its neck. Once more he stood without movement while the injured wolf rolled in agony behind him. Three others attacked in quick succession. One after another, they drew back with blood streaming from slashed throats or shoulders.
        - id: ch01-b52
          speaker: narrator
          text: >-
            That was enough to throw the entire pack forward at once. The wolves rushed in wildly, crowded together and blocking one another in their eagerness to pull Buck down. His astonishing speed and agility saved him. He spun on his hind legs, snapping and cutting, first to one side and then the other. He moved so fast that he seemed to be everywhere at once and to show the pack an unbroken wall of teeth. Yet he could not let them get behind him. Fighting all the way, he backed down past the pool and into the creek bed until a tall gravel bank stopped him. Along that bank, the miners had cut a sharp corner while digging. Buck worked his way into it. Earth protected him on three sides, leaving nothing to do but face the wolves in front.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Buck faced the pack so well that, after half an hour, the wolves finally withdrew in defeat. Every tongue hung out. Their cruel white teeth showed even whiter in the moonlight. Some wolves lay on the ground but kept their heads raised and ears pointed toward him. Others remained on their feet and watched. Still others went to the pool and lapped the water. Then one wolf came forward with care and showed that he meant friendship. He was long, lean, and gray. Buck recognized the wild brother with whom he had once run for a night and a day. The wolf whined softly. Buck answered with a whine of his own, and they touched noses.
        - id: ch01-b54
          speaker: narrator
          text: >-
            An old wolf came next, thin and scarred from battle. Buck began to curl his lips, then touched noses with him too. The old wolf sat, pointed his muzzle toward the moon, and released the long wolf howl. The others sat and joined him. Now Buck heard the call in words he could not mistake. He sat down and howled with them.
        - id: ch01-b55
          speaker: narrator
          text: >-
            When the howling ended, Buck left his corner. The pack crowded close, sniffing him with a manner half friendly and half savage. Their leaders cried out and sprang into the woods. The wolves followed in a chorus of yelps. Buck ran among them, side by side with his wild brother, and yelped as he ran.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Buck's story may end there. Before many years had passed, the Yeehats saw that the timber wolves were changing. Some carried brown markings on their heads and muzzles, with white splitting the fur down their chests. Stranger still were the stories of a Ghost Dog that ran at the head of the pack. The Yeehats feared him. He was more cunning than they were. In hard winters he stole from their camps, robbed their traps, killed their dogs, and stood against their bravest hunters.
        - id: ch01-b57
          speaker: narrator
          text: >-
            The stories grew darker. Some hunters never returned. Others were found with their throats torn open and tracks around them larger than any wolf's. Every autumn, when the Yeehats followed the moose, they refused to enter one particular valley. Around their fires, word passed that the Evil Spirit had chosen that place for his home, and the women grew sad when they heard it.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Yet one visitor came to that valley every summer without the Yeehats ever knowing. He was a huge wolf with a glorious coat, like every other wolf and unlike them all. Alone, he crossed from the bright and smiling country of forests and came down into a clearing among the trees. There, gold had spilled from rotting moose-hide sacks and flowed like a yellow stream into the earth. Long grasses grew through it. Dark plant mold crept across it and slowly hid the yellow from the sun. The great wolf stayed in that place for a time, lost in thought. Before he departed, he raised his muzzle and gave one long, mournful howl.
        - id: ch01-b59
          speaker: narrator
          text: >-
            He did not always run alone. On long winter nights, when the wolves followed their prey into the lower valleys, he led the pack through pale moonlight or beneath the glow of the northern sky. He leaped high above the others, and from his great throat came the song of the younger world, the song of the pack.
