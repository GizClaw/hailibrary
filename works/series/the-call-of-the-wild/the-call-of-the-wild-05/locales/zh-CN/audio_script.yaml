audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 生动沉稳，时刻留意逼近的危险
        timbre: 温暖浑厚，清晰有力
        pace: 从容有度
        pitch: 中音
    scotch_half_breed:
      display_name: 苏格兰混血赶狗人
      tts:
        delivery: 寡言坚忍，待狗公道而克制
        timbre: 粗粝低沉
        pace: 稍慢
        pitch: 低音
    hal:
      display_name: 哈尔
      tts:
        delivery: 自负急躁，逞强而缺少耐性
        timbre: 年轻干硬
        pace: 偏快
        pitch: 中高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 软弱迟钝，疲惫时带着怨气
        timbre: 松散沙哑
        pace: 稍慢
        pitch: 中音
    mercedes:
      display_name: 梅赛德斯
      tts:
        delivery: 娇弱任性，情绪起伏强烈
        timbre: 柔细明亮
        pace: 快慢多变
        pitch: 中高音
    onlooker_1:
      display_name: 旁观者甲
      tts:
        delivery: 直率老练，话里带着克制的讥讽
        timbre: 粗犷清楚
        pace: 适中
        pitch: 中低音
    onlooker_2:
      display_name: 旁观者乙
      tts:
        delivery: 随口调侃，明白雪道上的规矩
        timbre: 明朗结实
        pace: 适中
        pitch: 中音
    john_thornton:
      display_name: 约翰·桑顿
      tts:
        delivery: 沉着寡言，动怒时迸发出强烈力量
        timbre: 温厚坚实
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 精疲力竭的狗队
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            离开道森整整三十天，海岸邮运队终于到了斯卡圭，巴克和伙伴们仍拉在最前面。可它们全被漫长的路程拖垮了。巴克从一百四十磅瘦到一百一十五磅，其他狗按体重算，瘦得比它更厉害。总爱假装腿伤的派克这回真瘸了，索尔莱克斯也一瘸一拐，杜布还扭伤了一侧肩胛骨。
        - id: ch01-b02
          speaker: narrator
          text: >-
            每条狗的脚掌都疼得要命，走起路来再没有一点弹力。爪子沉沉落在雪道上，每一步都震动全身，让一天的劳累变得更重。它们没有别的病，就是累到了极处。这不是猛干一阵、休息几小时就能恢复的疲倦，而是几个月的苦役一点点榨尽了所有力气。它们再也恢复不过来，也没有余力可用。肌肉、筋骨，身上每一个细小的部分都累得像死去一样。
        - id: ch01-b03
          speaker: narrator
          text: >-
            不到五个月，它们已经走了两千五百英里。最后一千八百英里的路上，总共只休息过五天。所有可以调用的余力，哪怕最后一点，也早已用光。进城时，它们几乎连挽绳都拉不直。遇到下坡，也只能勉强躲开身后的雪橇，不让它从自己身上碾过去。
        - id: ch01-b04
          speaker: scotch_half_breed
          text: 走吧，可怜的小痛脚。就剩这一段了。走完咱们好好歇一回，舒舒服服歇上很久。
          emotion: calm
        - id: ch01-b05
          speaker: narrator
          text: >-
            赶狗人自己只休息了两天，便走完一千二百英里。他们相信这一次怎么也该停下来好好歇歇。可涌进克朗代克的男人太多，留在外面的恋人、妻子和亲眷也太多，积压的邮件堆得像山。上头又下了命令，要用新送来的哈得孙湾狗替下已经跑不动的狗。淘汰的狗得卖掉，因为在金钱面前，狗命根本算不了什么。
        - id: ch01-b06
          speaker: narrator
          text: >-
            三天以后，巴克和伙伴们才真正感觉到自己有多虚弱。第四天早晨，两个从美国本土来的人用很少的钱买下了整支狗队，连挽具也一并买走。年长的叫查尔斯，脸色浅淡，眼睛软弱无神，总是水汪汪的。他的嘴唇无力地下垂，上面的胡子却凶猛地翘着，恰好拆穿了主人那副强硬模样。
        - id: ch01-b07
          speaker: narrator
          text: >-
            另一个叫哈尔，只有十九二十岁。他的腰带上挂着一把大号柯尔特左轮手枪和一柄猎刀，四周还插满子弹。他身上最显眼的就是这条腰带，因为它把主人的幼稚张扬得清清楚楚。两个人一看就不属于北方。这样的人为什么偏要闯到这里，实在叫人想不明白。
        - id: ch01-b08
          speaker: narrator
          text: >-
            巴克听着他们讨价还价，看见钱交到政府官员手里，便明白苏格兰混血赶狗人和邮运队也要离开自己的生命了，正像佩罗和弗朗索瓦那些人一样。新主人的营地乱得不像样。帐篷只搭起一半，碟子没有洗，东西到处乱放。营地里还有一个女人，名叫梅赛德斯。她是查尔斯的妻子，也是哈尔的姐姐。这三个人，倒真是完整的一家。
        - id: ch01-b09
          speaker: narrator
          text: >-
            他们拆帐篷、装雪橇时，巴克在一旁不安地看着。三个人忙得很卖力，却没有一点章法。帐篷卷成一个笨重的大包，足足比该有的体积大三倍。白铁皮餐具没洗就塞进了行李。梅赛德斯又不停在两个男人身边穿来穿去，边抱怨，边指挥，嘴一刻也没有停，结果越帮越忙。
        - id: ch01-b10
          speaker: mercedes
          text: 衣袋别放在前面，应该搁到后头去。
        - id: ch01-b11
          speaker: narrator
          text: >-
            两个男人照办了，又在衣袋上压了几个包。梅赛德斯忽然发现几件遗漏的东西，偏偏只能放进那个袋子。于是他们只好把刚装好的行李再次卸下来。附近帐篷里走出三个男人，站在一边看热闹，彼此挤眉弄眼地笑。
        - id: ch01-b12
          speaker: onlooker_1
          text: 你们装的东西已经够多了。按说我不该教你们做事，不过我要是你们，就不会带上那顶帐篷。
        - id: ch01-b13
          speaker: mercedes
          text: 绝对不行！没有帐篷，这一路叫我怎么过？
          emotion: surprised
        - id: ch01-b14
          speaker: onlooker_1
          text: 春天到了，往后不会再有冷天气。
        - id: ch01-b15
          speaker: narrator
          text: >-
            梅赛德斯坚决摇头。查尔斯和哈尔只得继续把零碎堆到小山一样的行李顶上。
        - id: ch01-b16
          speaker: onlooker_1
          text: 这么装，雪橇真能走稳吗？
        - id: ch01-b17
          speaker: charles
          text: 有什么走不稳的？
        - id: ch01-b18
          speaker: onlooker_1
          text: 没事，没事。我就是随口一问。只觉得上头好像太重了一点。
        - id: ch01-b19
          speaker: narrator
          text: >-
            查尔斯转过身，尽力去收紧绳索，可他捆得一点也不牢。另一个旁观者看着那堆行李，也开了口。
        - id: ch01-b20
          speaker: onlooker_2
          text: 狗拖着这么一大堆东西，当然还能走上一整天。
        - id: ch01-b21
          speaker: hal
          text: 那当然。走！都给我走起来！
        - id: ch01-b22
          speaker: narrator
          text: >-
            哈尔一手抓住转向杆，一手挥起鞭子。狗群猛地扑进胸带，拼命挣扎一阵，又全都松懈下来。雪橇根本没有动。
        - id: ch01-b23
          speaker: hal
          text: 一群懒畜生！看我怎么收拾你们。
          emotion: angry
        - id: ch01-b24
          speaker: mercedes
          text: 哈尔，不许打！把鞭子给我。它们多可怜啊。你得答应我，一路上都不许再凶狠地对待它们，不然我一步也不走。
        - id: ch01-b25
          speaker: hal
          text: 你根本不懂狗，别来烦我。它们就是懒，不挨鞭子便什么也不肯做。狗都是这样，不信你去问那几个男人。
        - id: ch01-b26
          speaker: narrator
          text: >-
            梅赛德斯哀求似的望向旁观者。她那张漂亮的脸上满是对痛苦的不忍。
        - id: ch01-b27
          speaker: onlooker_1
          text: 真想知道，我就告诉你。它们已经累得一点力气也没有了，应该休息。
        - id: ch01-b28
          speaker: hal
          text: 休息个鬼。
        - id: ch01-b29
          speaker: mercedes
          text: 哎呀，这话太难听了！
          emotion: disgusted
        - id: ch01-b30
          speaker: narrator
          text: >-
            梅赛德斯听见粗话，先是又伤心又难受，紧接着却马上护起自己的弟弟。
        - id: ch01-b31
          speaker: mercedes
          text: 别听那个人的。这些狗归你赶，你觉得该怎么办，就怎么办。
        - id: ch01-b32
          speaker: narrator
          text: >-
            哈尔的鞭子再次落下。狗群把爪子深深抠进踩实的雪地，压低身体，用尽最后一点力气。雪橇却像下了锚，牢牢钉在原地。试过两次，它们终于站住不动，只顾喘息。鞭梢还在凶狠呼啸，梅赛德斯又冲了出来。她跪到巴克面前，眼里含着泪，双臂抱住它的脖子。
        - id: ch01-b33
          speaker: mercedes
          text: 可怜的小宝贝，你们为什么不使劲拉呢？只要好好拉，不就不用挨打了吗？
          emotion: sad
        - id: ch01-b34
          speaker: narrator
          text: >-
            巴克不喜欢她，可它难受得连反抗的力气都没有，只把这个拥抱当成苦日子里的另一桩苦差。一个旁观者一直咬着牙，强忍住火气，这时终于说话了。
        - id: ch01-b35
          speaker: onlooker_1
          text: 你们会落到什么下场，我根本不在乎。不过为了这些狗，我还是告诉你一句。橇板冻在雪里了，先抓住转向杆左右用力，把雪橇撬松，能替它们省很多力气。
    - id: ch02
      title: 一场狼狈的出发
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第三次尝试时，哈尔总算听从劝告，先把冻住的橇板撬松。超载的雪橇终于向前冲去。鞭打像雨点一样落下，巴克和伙伴们拼命挣扎。前方一百码处，雪道突然转弯，又陡直地向下通往大街。只有经验丰富的人才能稳住这架头重脚轻的雪橇，哈尔却根本不懂该怎么做。
        - id: ch02-b02
          speaker: narrator
          text: >-
            雪橇一拐弯便翻了，松散的绳索里滚出一半行李。狗群没有停步。轻下来的雪橇侧躺着，在它们身后一路蹦跳。它们挨够了打，也受够了不公平的重担。巴克怒火冲天，撒腿便跑，整支狗队跟着它冲了起来。
        - id: ch02-b03
          speaker: hal
          text: 停！快停下！
          emotion: fearful
        - id: ch02-b04
          speaker: narrator
          text: >-
            狗群理也不理。哈尔绊倒在地，被一路拖行，翻倒的雪橇又从他身上碾过。狗群沿大街狂奔，把余下的行装全抛撒在斯卡圭最热闹的街道上，也把全城人逗得哈哈大笑。
        - id: ch02-b05
          speaker: narrator
          text: >-
            好心的市民们拦住狗群，收拾起散落的东西，又告诉这家人，若想抵达道森，行李必须减掉一半，狗还得增加一倍。哈尔、梅赛德斯和查尔斯不情不愿地听着，重新支起帐篷，清点行装。那些没用的罐头引来一阵哄笑。在漫长的雪道上还想天天吃罐头，简直是在做梦。
        - id: ch02-b06
          speaker: onlooker_2
          text: 这些毯子都够开旅馆了，留一半还嫌多。帐篷也扔了，那些餐具也别带。反正谁会洗？老天，你们以为自己坐的是豪华列车吗？
        - id: ch02-b07
          speaker: narrator
          text: >-
            多余的东西就这样一件件被淘汰。衣袋倒在地上，物品逐件扔出来。梅赛德斯为每一样东西哭，也为所有东西一起哭。她抱着膝盖前后摇晃，伤心得像整个世界都在眼前破碎。她说，就算来十二个查尔斯，她也绝不肯再走一英寸。她向每个人求情，也仿佛向每一样东西求情。最后，她却忽然擦掉眼泪，把真正少不了的衣服也扔了出去。
        - id: ch02-b08
          speaker: narrator
          text: >-
            处理完自己的行李，她又像一阵旋风，扑向两个男人的东西。等这通折腾结束，行装虽减去一半，仍旧大得吓人。傍晚，查尔斯和哈尔又买来六条南方狗。加上原队剩下的六条，以及在那次破纪录的旅程中于林克急流加入的提克和库纳，整支狗队一下有了十四条狗。
        - id: ch02-b09
          speaker: narrator
          text: >-
            新来的六条狗却没什么用。三条是短毛猎犬，一条是纽芬兰犬，还有两条看不出血统的杂种狗。它们仿佛什么都不懂。巴克和伙伴们嫌恶地看着它们。巴克很快教会它们站在哪里，也教会它们不该做什么，却始终没法教会它们究竟该怎样拉橇。
        - id: ch02-b10
          speaker: narrator
          text: >-
            它们不喜欢挽绳，也适应不了雪道。除了两条杂种狗，其他四条都被陌生凶险的环境和一路遭受的虐待吓破了胆。那两条杂种狗更是连胆量也无从失去，全身只剩骨头还经得起折断。新狗无望，旧狗又被两千五百英里连绵的雪道拖垮，这趟旅程怎么看都不会顺利。
        - id: ch02-b11
          speaker: narrator
          text: >-
            两个男人却十分高兴，还为这十四条狗得意。他们见过许多雪橇翻过山口驶向道森，也见过雪橇从那里回来，却从没见过谁用十四条狗拉一架雪橇。北方人不会这样做，道理很简单，一架雪橇装不下十四条狗的口粮。查尔斯和哈尔却拿铅笔算得明明白白。一条狗吃多少，十四条狗走几天，数字一乘，一切便算完了。梅赛德斯从肩后看着，还连连点头，仿佛再没有比这更简单的事。
        - id: ch02-b12
          speaker: narrator
          text: >-
            第二天很晚，巴克才带着这支长长的队伍走上大街。没有一条狗还有精神。它们还没出发，便已经累得要死。巴克在海岸与道森之间往返过四趟。想到自己拖着疲惫的身体，又要踏上同一条路，它心里只剩苦涩。所有狗都不想干活。南方狗又怕又慌，本地狗则根本不信任这几个主人。
        - id: ch02-b13
          speaker: narrator
          text: >-
            巴克隐约知道，这两个男人和那个女人都靠不住。他们什么也不会，日子久了更看得出，他们也永远学不会。三个人做事懒散，没有秩序，也没有规矩。支起乱七八糟的营地要花掉半夜，拆营和装车又耗去半个早晨。行李还总是装不好，余下一天里只得停了又停，把歪掉的包重新挪动，再把松开的绳子重新捆紧。
        - id: ch02-b14
          speaker: narrator
          text: >-
            有时他们一天走不到十英里，有时根本走不了。两个男人曾按照狗粮数量算出每天该走多远，可他们从没完成过一半。狗粮迟早会吃完，他们还故意让那一天来得更早。南方狗没受过长期饥饿，不能靠一点食物维持身体，胃口大得惊人。哈尔又见爱斯基摩犬拉得无力，便认定正常口粮太少，干脆加了一倍。
        - id: ch02-b15
          speaker: narrator
          text: >-
            梅赛德斯流着泪哄哈尔，想让他再多喂些。见他不答应，她竟从鱼袋里偷鱼，偷偷塞给狗吃。可巴克和爱斯基摩犬最需要的不是更多食物，而是休息。它们走得虽慢，沉重的雪橇仍在迅速榨干体力。
        - id: ch02-b16
          speaker: narrator
          text: >-
            挨饿的日子果然来了。哈尔突然发现，狗粮已经少了一半，路却只走完四分之一。再多的钱也买不到新的狗粮。他只好把正常口粮削减下来，同时逼狗群每天多走一些。姐姐和姐夫也赞成。可行装太重，他们自己又太无能，这办法根本行不通。
        - id: ch02-b17
          speaker: narrator
          text: >-
            少给狗吃些很容易，要狗走快却不可能。他们每天早晨也没法早早出发，自然不能多走几个小时。这三个人不只不会使唤狗，连自己也不会使唤。
    - id: ch03
      title: 饥饿与争吵
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            最先倒下的是杜布。这个笨拙的小偷总在偷东西，也总被抓住受罚，可它一直忠心干活。扭伤的肩胛骨没有医治，也得不到休息，只能一天比一天严重。最后，哈尔用那把大号柯尔特左轮手枪打死了它。
        - id: ch03-b02
          speaker: narrator
          text: >-
            北方有句话说，南方狗若只吃爱斯基摩犬的口粮，非饿死不可。巴克手下那六条南方狗如今只吃得到爱斯基摩犬一半的口粮，当然只能一条条死去。它们本来就不懂怎样在北方保存体力，也没学会在饥饿中活下去。纽芬兰犬先死，接着是三条短毛猎犬。两条杂种狗更顽强地熬了一阵，最后也没能活下来。
        - id: ch03-b03
          speaker: narrator
          text: >-
            这时，三个南方人早已丢掉所有温和礼数。北极旅行不再浪漫，也不再迷人，只剩下他们承受不了的严酷。梅赛德斯不再为狗哭，因为她正忙着为自己哭，还要和丈夫、弟弟争吵。无论累成什么样，三个人总有力气吵架。
        - id: ch03-b04
          speaker: narrator
          text: >-
            苦难让他们烦躁，苦难越深，烦躁便越厉害，最后竟超过了苦难本身。在雪道上真正吃过苦的人，往往会生出一种奇妙的耐心。他们哪怕筋疲力尽，受尽折磨，依旧能好好说话，善待别人。这两男一女却一点也没有这样的耐心，甚至根本不知道世上还有这种耐心。他们肌肉疼，骨头疼，心也疼，于是从早到晚，一开口就是伤人的话。早晨醒来先说狠话，晚上闭眼前也还是狠话。
        - id: ch03-b05
          speaker: narrator
          text: >-
            只要梅赛德斯给一点机会，查尔斯和哈尔便会争起来。两个人都认定自己干得最多，而且逢人便说。梅赛德斯有时帮丈夫，有时帮弟弟，一家人的争吵就永远没有尽头。
        - id: ch03-b06
          speaker: narrator
          text: >-
            起初，他们或许只在争几根烧火的木柴该由谁来劈。没说几句，父亲、母亲、叔伯、表亲便全被拖进来，连住在几千英里外的人和已经死去的人也不放过。哈尔对艺术的看法，他舅舅写的社交喜剧属于哪一类，都能跟劈柴扯上关系。再不然，他们便吵起查尔斯的政治偏见。
        - id: ch03-b07
          speaker: narrator
          text: >-
            查尔斯那爱搬弄是非的姐姐同在育空河边生火有什么关系，只有梅赛德斯自己知道。她说完这个，又顺手把丈夫一家人的其他毛病全数落一遍。他们只顾争吵，火一直没有生起来，营地只搭好一半，狗也始终饿着。
        - id: ch03-b08
          speaker: narrator
          text: >-
            梅赛德斯还有一桩特别的委屈。她长得漂亮，身体娇弱，从小到大都有人殷勤照料。现在，丈夫和弟弟待她却一点也不殷勤。她早已习惯什么都做不了，两人偏偏因此抱怨。她觉得他们责怪的正是女人最重要的权利，于是也把两个人的日子折腾得无法忍受。
        - id: ch03-b09
          speaker: narrator
          text: >-
            她再也不管狗有多苦。自己又疼又累，便坚持坐在雪橇上。她看起来漂亮又柔弱，体重却有一百二十磅。虚弱挨饿的狗群已经拖着过重的行李，再加上她，真的像最后一根沉重的稻草。她一连坐了几天，直到狗群倒在挽绳里，雪橇再也不动。
        - id: ch03-b10
          speaker: narrator
          text: >-
            查尔斯和哈尔求她下来走路，央告她，恳求她。她只顾流泪，对着上天一遍遍诉说两个人有多残忍。有一次，他们使出蛮力把她抬下雪橇。可梅赛德斯立刻像受宠坏的孩子那样放软两条腿，坐在雪道上不肯动。
        - id: ch03-b11
          speaker: narrator
          text: >-
            两个男人继续赶路，她还是留在原地。走出三英里，他们只好卸下雪橇，再原路回来找她，用蛮力把她抬回雪橇。从那以后，他们再也没有试过第二次。
        - id: ch03-b12
          speaker: narrator
          text: >-
            三个人困在自己的痛苦里，对牲口的苦难也变得麻木。哈尔有一套道理，还总拿别人来试。他说，人必须把自己变得强硬。最初，他把这话讲给姐姐和姐夫听。见两人不肯听，他便改用棍棒把这套道理硬敲进狗的身体。
        - id: ch03-b13
          speaker: narrator
          text: >-
            到了五指滩，狗粮彻底吃完。一个没有牙齿的印第安老妇拿出几磅冻马皮，提出换走哈尔腰间那把柯尔特左轮手枪。那把枪原本总和大猎刀一起挂在他身边，如今终于被饥饿换走。这些皮是六个月前从畜牧人的饿马身上剥下来的，根本不能算食物。冻硬时，它们像一条条镀锌铁皮。狗费尽力气吞进肚里，它们又化成没有营养的细皮条和一团团又短又扎人、完全不能消化的马毛。
        - id: ch03-b14
          speaker: narrator
          text: >-
            巴克经历着这一切，仍在队伍最前方，像陷进噩梦一样踉跄前进。拉得动时，它便拉。实在拉不动了，它会倒在地上，直到鞭子或棍棒把它逼得再次站起。
        - id: ch03-b15
          speaker: narrator
          text: >-
            那身美丽的皮毛已经失去光泽，软塌塌、脏兮兮地垂下来。被棍棒打破的伤口流过血，毛便被干血粘成一团。它的肌肉瘦成打结的细绳，厚实的肉垫全消失了。松皮皱成一层层空荡的褶子，每根肋骨、每块骨头都从下面清楚地突出来。这副样子叫人心碎，可巴克的心碎不了。穿红毛衣的男人早就证明过这一点。
        - id: ch03-b16
          speaker: narrator
          text: >-
            巴克的伙伴也一样。连它在内，狗队只剩七具会走路的骨架。苦难太深，它们连鞭子咬进肉里、棍棒砸在身上都感觉不到了。疼痛十分昏沉，仿佛离得很远。眼睛看见的东西、耳朵听见的声音，也同样遥远。
        - id: ch03-b17
          speaker: narrator
          text: >-
            它们谈不上还活着一半，甚至连四分之一也没有，只是一袋袋骨头，里面微弱地扑闪着生命的火星。队伍一停，它们便像死狗一样倒在挽绳里。那点火星会暗下去，眼看就要熄灭。鞭子或棍棒一落下，它才又微微跳动。狗群摇晃着起身，继续向前。
        - id: ch03-b18
          speaker: narrator
          text: >-
            终于，温顺的比利倒下，再也站不起来。左轮手枪已经换了马皮，哈尔便拿起斧头，朝仍躺在挽绳里的比利头上砸去。接着，他割断挽具，把尸体拖到路旁。巴克和伙伴们全看见了。它们明白，这样的结局很快便会轮到自己。
        - id: ch03-b19
          speaker: narrator
          text: >-
            第二天，库纳也死了。队里只剩五条狗。乔虚弱得再也凶不起来。派克瘸着腿，神志半昏半醒，连装病偷懒的清醒劲儿也没有了。独眼的索尔莱克斯仍然忠于挽绳和雪道，只为自己剩不下多少力气而悲哀。提克这个冬天走的路比它们少，体力看上去还好一些。哈尔便认定它还可以多出力，结果它挨的打反而比谁都多。
        - id: ch03-b20
          speaker: narrator
          text: >-
            巴克还走在最前方，却再也不去管束同伴。它有一半时候都因虚弱而眼前发黑，只能看着雪道模糊的轮廓，凭脚掌隐约的感觉，一步步摸索着走下去。
    - id: ch04
      title: 春天里的死亡之路
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            春天的天气美极了，人和狗却谁也没有察觉。太阳每天升得更早，落得更晚。凌晨三点，天空便开始发亮。直到晚上九点，暮色仍留在那里。漫长的白昼始终铺满耀眼的阳光。
        - id: ch04-b02
          speaker: narrator
          text: >-
            冬日幽灵般的寂静退去了，万物苏醒的巨大低语在天地间回荡。那声音从整片大地上升起，满是活下去的喜悦。许多生命在严寒的漫长岁月里仿佛已经死去，再没有动过一下，如今却都醒了，重新活动，重新发出声音。
        - id: ch04-b03
          speaker: narrator
          text: >-
            松树的汁液开始流动，柳树和白杨绽开嫩芽，灌木与藤蔓披上新绿。蟋蟀在夜里鸣唱，白天则有各种小虫窸窸窣窣爬进阳光。松鸡低鸣，啄木鸟敲打树干，松鼠吱吱叫，鸟儿放声歌唱。野禽从南方飞来，在高空排成灵巧的楔形，一边鸣叫，一边劈开长空。
        - id: ch04-b04
          speaker: narrator
          text: >-
            每一道山坡都有流水淙淙而下，像看不见的泉眼奏出的乐声。万物都在融化、弯曲、迸裂。育空河拼命挣扎，要挣开压住它的冰层。河水从下面一点点掏空，太阳从上面不断啃噬。冰上出现一个个气孔，裂缝陡然张开，再迅速向远处伸展。冰层较薄的地方，甚至会整片坠进河里。
        - id: ch04-b05
          speaker: narrator
          text: >-
            到处都是生命苏醒时的破裂声、撕扯声和搏动声。可就在灿烂的阳光下，在柔风轻轻的叹息里，两个男人、一个女人和几条爱斯基摩犬，却像一群走向死亡的旅人，摇摇晃晃地向前。
        - id: ch04-b06
          speaker: narrator
          text: >-
            狗不停倒下，梅赛德斯一面哭一面坐在雪橇上。哈尔徒劳地咒骂，查尔斯那双水汪汪的眼睛满是哀愁。他们就这样闯进白河河口约翰·桑顿的营地。队伍一停，狗群便同时倒下，仿佛全被一击打死。
        - id: ch04-b07
          speaker: narrator
          text: >-
            梅赛德斯擦掉眼泪，望向桑顿。查尔斯慢慢坐到一根圆木上休息。他全身僵硬，每个动作都十分吃力。开口说话的是哈尔。桑顿正拿一段桦木削斧柄，做最后一点修整。他边削边听，只用一两个字回答。别人问起，他才给几句简短的建议。他在北方见过这种人，知道他们会把每句警告都当成胆怯，也知道他们一定不会听劝。
        - id: ch04-b08
          speaker: hal
          text: 上游那些人也说，雪道的底快塌了，最好留下来等。他们还说我们到不了白河，可我们现在不是已经到了吗？
        - id: ch04-b09
          speaker: narrator
          text: >-
            哈尔最后那句话里带着讥讽，听上去得意极了。
        - id: ch04-b10
          speaker: john_thornton
          text: 他们没有说错。冰面随时会塌。只有傻瓜靠着傻瓜才有的瞎运气，才走得到这里。我把话说明白，就算拿阿拉斯加所有的金子来换，我也不会把命押在那片冰上。
        - id: ch04-b11
          speaker: hal
          text: 我看，那是因为你不是傻瓜吧。不管怎样，我们要去道森。起来，巴克！喂，起来！给我走！
        - id: ch04-b12
          speaker: narrator
          text: >-
            哈尔解开鞭子，桑顿却继续削着斧柄。他知道，一个傻瓜执意去做蠢事，别人怎么拦也没有用。世上多两三个傻瓜，或少两三个傻瓜，也不会改变什么。
        - id: ch04-b13
          speaker: narrator
          text: >-
            狗群听见命令，根本没有起身。它们早已到了非得挨打才能唤醒的地步。鞭子闪来闪去，毫不留情地落在这条狗身上，又落到那条狗身上。桑顿紧紧抿住嘴唇。
        - id: ch04-b14
          speaker: narrator
          text: >-
            索尔莱克斯第一个爬起来，提克紧随其后。乔也站了起来，嘴里疼得尖叫。派克拼命挣扎，两次刚撑起一半便摔倒，第三次总算站住。巴克没有尝试。它静静躺在倒下的地方。鞭梢一次次咬进身体，它不呜咽，也不挣扎。
        - id: ch04-b15
          speaker: narrator
          text: >-
            桑顿好几次像要开口，却又忍住。他的眼睛渐渐湿了。鞭打没有停止，他终于站起来，犹豫不定地走来走去。
        - id: ch04-b16
          speaker: narrator
          text: >-
            这是巴克第一次不肯服从。单凭这一点，哈尔便气得发狂。他扔下鞭子，换上平常使用的棍棒。更重的打击像雨点般落下，巴克还是不动。它和伙伴一样，已经没有多少力气站起来。可它与它们不同，它已经决定，自己绝不站起来。
        - id: ch04-b17
          speaker: narrator
          text: >-
            巴克隐约感觉，一场灾祸正在逼近。刚拉到岸边时，这感觉便压在心头，此刻仍没有离去。一路上，它都能从脚下感觉到冰面越来越薄，也越来越腐朽。灾难仿佛就在前方，正在哈尔硬要它踏上的冰面上等待。巴克不肯再向那里迈出一步。
        - id: ch04-b18
          speaker: narrator
          text: >-
            它受过太多折磨，也虚弱到了极点，棍棒落下时已经不怎么疼。可打击仍在继续。巴克体内那点生命的火星一闪一闪，不断下沉，眼看就要熄灭。它只觉得浑身异样地麻木，仿佛隔着很远的距离，知道有人正在打自己。
        - id: ch04-b19
          speaker: narrator
          text: >-
            最后一丝疼痛也离开了它。巴克什么都感觉不到，只能极其模糊地听见棍子砸在身体上的闷响。可那似乎已经不是它的身体了，因为一切都离它那么遥远。
    - id: ch05
      title: 雪道的底塌了
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            就在这时，没有半点预兆，约翰·桑顿突然发出一声含混的吼叫。那声音不像人的喊声，倒像一头野兽。他猛扑向挥舞棍棒的哈尔，把他撞得向后飞出去，仿佛哈尔迎面挨了一棵倒下的大树。
        - id: ch05-b02
          speaker: narrator
          text: >-
            梅赛德斯尖声大叫。查尔斯哀愁地看着，擦了擦水汪汪的眼睛。他全身太僵硬，连站也没有站起来。桑顿挡在巴克身前，拼命控制自己。他气得浑身颤抖，一句话都说不出来。
        - id: ch05-b03
          speaker: john_thornton
          text: 你再敢打这条狗一下，我就杀了你。
          emotion: angry
        - id: ch05-b04
          speaker: hal
          text: 它是我的狗。给我滚开，不然我连你也收拾。我还要去道森。
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: >-
            哈尔擦掉嘴上的血，又走了回来。桑顿仍挡在他和巴克之间，没有半点让路的意思。哈尔拔出长猎刀。梅赛德斯一会儿尖叫，一会儿哭，一会儿又笑，完全陷进了歇斯底里的混乱。
        - id: ch05-b06
          speaker: narrator
          text: >-
            桑顿举起斧柄，敲中哈尔的指关节，猎刀立刻掉到地上。哈尔伸手去捡，他又朝那只手敲了一下。接着，桑顿亲自俯身捡起猎刀，只挥两下便割断巴克的挽绳。
        - id: ch05-b07
          speaker: narrator
          text: >-
            哈尔已经不想再打了。何况他还得腾出双臂去照料姐姐，巴克也已经离死不远，不能再替他拉雪橇。几分钟后，他们从岸边出发，沿河向下游走去。巴克听见声音，抬起头来。
        - id: ch05-b08
          speaker: narrator
          text: >-
            派克在前面领队，索尔莱克斯守在雪橇旁，乔和提克拉在中间。四条狗都一瘸一拐，走得摇摇晃晃。梅赛德斯坐在装满行李的雪橇上。哈尔扶着转向杆，查尔斯踉踉跄跄地跟在最后。
        - id: ch05-b09
          speaker: narrator
          text: >-
            巴克望着他们离开。桑顿跪到它身边，用一双粗糙却温柔的手摸遍它的身体，仔细寻找断骨。他最后查明，巴克虽然遍体瘀伤，饿得不成样子，却没有更多伤处。这时，那架雪橇已经走到四分之一英里外。
        - id: ch05-b10
          speaker: narrator
          text: >-
            一人一狗一起看着雪橇在冰面上缓慢爬行。忽然，雪橇的后端向下一沉，就像掉进一道深沟。哈尔紧抓着转向杆，连人带杆猛地翘到空中。远处传来了梅赛德斯的尖叫。
        - id: ch05-b11
          speaker: narrator
          text: >-
            查尔斯转过身，刚向回迈出一步，整片冰面便轰然塌陷。狗和人同时消失了。河面上只剩一个张开巨口般的冰洞。雪道的底，终于塌了。
        - id: ch05-b12
          speaker: narrator
          text: 约翰·桑顿和巴克彼此望着对方。
        - id: ch05-b13
          speaker: john_thornton
          text: 你这可怜的家伙。
          emotion: sad
        - id: ch05-b14
          speaker: narrator
          text: 巴克舔了舔他的手。
