  chapters:
    - id: ch01
      title: "Chapter V. The Toil of Trace and Trail"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Thirty days after leaving Dawson, the Salt Water Mail reached Skaguay with Buck and his teammates in front. The dogs were worn down to a wretched state. Buck had once weighed one hundred and forty pounds. Now he weighed only one hundred and fifteen. His teammates were lighter dogs to begin with, but each had lost an even greater share of his weight. Pike had spent his life deceiving people and had often escaped work by pretending to have an injured leg. This time his limp was real. Sol-leks limped too, and Dub suffered from a badly wrenched shoulder blade.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Every dog had terribly sore feet. Their steps had lost all spring. Each paw struck the trail heavily, shaking the tired body above it and making every mile harder. They were not exhausted from one great effort that a few hours of rest could mend. Months of labor had slowly drained them. Nothing remained in reserve. Muscle, fiber, and every living part of them was dead tired.
        - id: ch01-b03
          speaker: narrator
          text: >-
            They had traveled twenty-five hundred miles in less than five months. Through the last eighteen hundred miles, they had rested for only five days. By Skaguay, they seemed ready to collapse. They could hardly hold the traces tight, and on downhill stretches they could barely keep ahead of the sled.
        - id: ch01-b04
          speaker: driver
          text: >-
            Come on, you poor sore feet. This is the last of it. Then you'll get a long rest. Yes? A good long rest for sure.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The drivers truly expected a long stop. They themselves had covered twelve hundred miles with only two days of rest, and simple fairness said they had earned time to do nothing. But crowds of men had rushed into the Klondike while sweethearts, wives, and families stayed behind. All those people sent letters, and the waiting mail had piled up like mountains. Official orders had arrived as well. Fresh teams of Hudson Bay dogs would replace every animal judged useless for the trail. The worn-out dogs would be disposed of. When dogs were weighed against dollars, dogs counted for little, so Buck and his mates would be sold.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Three days passed, and Buck and the others discovered just how weak they had become. On the fourth morning, two men from the States bought the whole team, harnesses included, for almost nothing. They called each other Hal and Charles. Charles was middle-aged and pale, with watery eyes. His fierce, upturned mustache looked strangely false above a weak, drooping lip.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Hal was nineteen or twenty. He wore a large Colt revolver and a hunting knife on a belt crowded with cartridges. That belt drew the eye before anything else about him, and it announced exactly how young and foolish he was. Both men plainly belonged somewhere else. Why men like these ever ventured into the North was beyond understanding.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Buck heard the bargaining and saw money pass to the government agent. He understood that the Scotch half-breed and the mail drivers were leaving his life, just as Perrault, François, and the others had left before them. At his new owners' camp, he found a careless mess. The tent sagged half raised, dirty dishes lay about, and nothing was in order. There was also a woman. The men called her Mercedes. She was Charles's wife and Hal's sister.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Buck watched nervously while they took down the tent and loaded the sled. Every movement looked full of effort, yet nothing was done in a businesslike way. The rolled tent was three times as bulky as it should have been, and they packed the tin dishes without washing them. Mercedes kept stepping in the men's way while offering an endless stream of objections and advice. When they placed a clothes bag at the front of the sled, she insisted it belonged at the back. They moved it there and covered it with two more bundles. Then she discovered several forgotten articles. Nothing would do but to put them in that very clothes bag, so once again the load came apart.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Three men came out of a nearby tent to watch. They grinned and winked at one another.
        - id: ch01-b11
          speaker: onlooker_1
          text: >-
            That's already quite a load. It's not my place to run your business, but I wouldn't haul that tent if I were you.
        - id: ch01-b12
          speaker: mercedes
          text: >-
            Absolutely not! How could I possibly manage without a tent?
          emotion: surprised
        - id: ch01-b13
          speaker: onlooker_1
          text: >-
            Spring is here. You won't have any more cold weather.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Mercedes firmly shook her head. Charles and Hal piled the last loose articles on top of the mountain.
        - id: ch01-b15
          speaker: onlooker_1
          text: >-
            Do you think that load will stay up?
        - id: ch01-b16
          speaker: charles
          text: >-
            Why wouldn't it?
        - id: ch01-b17
          speaker: onlooker_1
          text: >-
            No reason. I was only wondering. It looks a little top-heavy, that's all.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Charles turned away and pulled the ropes as tight as he could, which was not tight at all.
        - id: ch01-b19
          speaker: onlooker_2
          text: >-
            And naturally those dogs can march all day with that thing dragging behind them.
        - id: ch01-b20
          speaker: narrator
          text: >-
            With icy politeness, Hal gripped the sled's guiding pole in one hand and swung his whip with the other.
        - id: ch01-b21
          speaker: hal
          text: >-
            Certainly. Mush! Get moving!
        - id: ch01-b22
          speaker: narrator
          text: >-
            The dogs lunged into their harnesses and strained with all they had. After a few moments they gave up. The sled had not moved.
        - id: ch01-b23
          speaker: hal
          text: >-
            Lazy beasts. I'll teach them.
          emotion: angry
        - id: ch01-b24
          speaker: narrator
          text: >-
            Hal raised the whip, but Mercedes snatched it from him.
        - id: ch01-b25
          speaker: mercedes
          text: >-
            Oh, Hal, don't! The poor sweet things! Promise me you won't be cruel to them again on this whole trip, or I won't take another step.
          emotion: fearful
        - id: ch01-b26
          speaker: hal
          text: >-
            You don't know the first thing about dogs. Leave me alone. They're lazy, and a whipping is the only way to get work from them. Ask anybody. Ask those men.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Mercedes turned an imploring face toward the onlookers. The very sight of pain filled her with disgust.
        - id: ch01-b28
          speaker: onlooker_3
          text: >-
            If you want the truth, they're weak as water. They're completely worn out. What they need is rest.
        - id: ch01-b29
          speaker: hal
          text: >-
            To hell with rest.
        - id: ch01-b30
          speaker: mercedes
          text: >-
            Oh, that was a terrible thing to say!
          emotion: sad
        - id: ch01-b31
          speaker: narrator
          text: >-
            The curse pained her, yet she immediately rushed to defend her brother.
        - id: ch01-b32
          speaker: mercedes
          text: >-
            Don't listen to that man. These are our dogs. Drive them however you think you should.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Hal whipped them again. The dogs dug their paws into the packed snow, dropped low, and threw every scrap of strength against the breastbands. The sled stayed fixed like an anchor. After two attempts they stood panting, while the whip began to sing through the air once more. Mercedes knelt in front of Buck with tears in her eyes and wrapped her arms around his neck.
        - id: ch01-b34
          speaker: mercedes
          text: >-
            You poor, poor sweet things. Why don't you pull hard? Then he wouldn't whip you.
          emotion: sad
        - id: ch01-b35
          speaker: narrator
          text: >-
            Buck disliked her, but he felt too miserable to resist. He accepted her embrace as one more part of the day's misery. One onlooker had been clenching his teeth to hold back his anger. Now he spoke.
        - id: ch01-b36
          speaker: onlooker_3
          text: >-
            I don't care what happens to you, but I care about those dogs. You could help them by breaking the sled loose. The runners are frozen fast. Push the guiding pole from side to side until they come free.
          emotion: angry
        - id: ch01-b37
          speaker: narrator
          text: >-
            They tried a third time. Following the man's advice, Hal threw his weight against the guiding pole, first one way and then the other, until the frozen runners broke free of the snow. The clumsy, overloaded sled moved forward. Buck and the team fought wildly to pull it while Hal's blows rained down on them. A hundred yards farther on, the path curved and dropped steeply into the main street. Only an experienced driver could have kept such a top-heavy sled upright through that turn. Hal was not experienced.
        - id: ch01-b38
          speaker: narrator
          text: >-
            The sled overturned on the bend, and half the load spilled through the loose ropes. The dogs did not stop. The lighter sled bounced along on its side behind them. The cruel treatment and unfair burden had made them furious. Buck broke into a run, and the whole team followed.
        - id: ch01-b39
          speaker: hal
          text: >-
            Whoa! Stop!
          emotion: fearful
        - id: ch01-b40
          speaker: narrator
          text: >-
            They ignored him. Hal tripped and was pulled down. The overturned sled rolled across him, and the dogs raced up the street. Skaguay laughed as the rest of the outfit scattered all along its main road.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Kind people caught the dogs, gathered the scattered belongings, and offered advice. If the travelers hoped to reach Dawson, they needed half the load and twice the dogs. Hal, Charles, and Mercedes listened with little grace. They raised the tent again and began sorting the outfit. Men laughed when they saw all the canned food. No one carried such things on the Long Trail.
        - id: ch01-b42
          speaker: onlooker_2
          text: >-
            You've packed enough blankets for a hotel. Half that many would still be too much. Lose the tent and all those dishes too. Who do you think will wash them? Good Lord, this isn't a Pullman train.
        - id: ch01-b43
          speaker: narrator
          text: >-
            The useless things had to go, one after another, with no escape from the decision. Mercedes cried when her clothing bags were dumped onto the ground and each article was thrown aside. First she mourned the whole loss. Then she mourned every single possession as it disappeared. She clasped her hands around her knees, rocked back and forth in heartbreak, and declared that not even twelve men like Charles could make her travel one more inch. She appealed to every person nearby and to everything around her. At last she wiped her eyes and joined the work with sudden zeal. She began throwing away even clothes she truly needed. Once she had finished with her own things, she swept through the men's belongings like a tornado.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Even after half the outfit was gone, a huge load remained. That evening Charles and Hal bought six dogs from the Outside. Three were short-haired pointers, one a Newfoundland, and two were mongrels of no clear breed. Added to the six original dogs and to Teek and Koona, the huskies picked up at Rink Rapids, they made a team of fourteen.
        - id: ch01-b45
          speaker: narrator
          text: >-
            The new dogs had received some training since they landed, but it had done little good. They knew almost nothing. Buck and his old companions regarded them with disgust. He quickly showed the newcomers where they belonged and what they must not do, but he could not teach them what they needed to do. They hated both harness and trail. Except for the two mongrels, the strange, savage North and the abuse they had suffered left them confused and broken in spirit. The mongrels had no spirit left to break. Only their bones remained breakable.
        - id: ch01-b46
          speaker: narrator
          text: >-
            The new dogs were hopeless, and the old dogs had twenty-five hundred miles of exhaustion behind them. Still, the two men were cheerful and proud. They believed they were traveling in grand style with fourteen dogs. They had watched other sleds go over the Pass toward Dawson and return from Dawson, but they had never seen one team with so many animals.
        - id: ch01-b47
          speaker: narrator
          text: >-
            There was a sound reason for that. In Arctic travel, one sled could not carry enough food to keep fourteen dogs alive for the journey. Hal and Charles did not know it. They had worked out the entire trip with a pencil. They set down so much food for one dog, multiplied it by so many dogs and so many days, and considered the answer proven. Mercedes looked over their shoulders and nodded as though she understood it all. On paper, everything appeared wonderfully simple.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Late the next morning, Buck led the long team out of town. No life or quickness remained in him or his old companions. They began the journey already dead weary. Buck had traveled between salt water and Dawson four times. Now, worn out, he faced that same trail again, and bitterness filled him. None of the dogs put its heart into the work. The Outside dogs were frightened, while the dogs of the North had no faith in their masters.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Buck sensed that the two men and the woman could not be trusted. They knew how to do nothing, and each day showed that they could not learn. They had no order and no discipline. Raising their careless camp took half the night. Breaking it and loading the sled took half the morning. The load was so badly arranged that they spent the rest of the day stopping to fix it. Some days they covered fewer than ten miles. Some days they never started. They never once traveled even half the distance used in their food calculations.
        - id: ch01-b50
          speaker: narrator
          text: >-
            They were certain to run short of dog food, but first they made the shortage come faster by feeding too much. The Outside dogs had never endured the long hunger that had taught huskies to draw everything possible from a little food. Their appetites were enormous. When the exhausted huskies pulled weakly, Hal decided the accepted trail ration must be too small, so he doubled it. Mercedes begged him with tears in her eyes and a tremble in her voice to give them still more. When she could not persuade him, she stole from the fish sacks and secretly fed the dogs herself. Yet food was not what Buck and the huskies needed most. Their bodies needed rest. They received none. Though the party made poor time, the heavy sled kept draining what little strength remained.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Then came hunger. Hal finally realized that half the food was gone while they had covered only a quarter of the distance. No amount of love or money could buy more. He cut the dogs below the normal ration and tried to make them travel farther each day. His sister and brother-in-law agreed with him, but their enormous outfit and their own incompetence defeated the plan. Giving less food was easy. Making the dogs move faster was impossible. Since the people could not start earlier, they could not travel longer either. They did not know how to work dogs, and they did not know how to work themselves.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Dub was the first to die. He had been a clumsy thief, forever getting caught and punished for whatever he tried to steal. For all his blundering, he had always been a faithful worker in the traces. His injured shoulder received no treatment and no rest. Each day of pulling made it worse. At last the damage had gone too far, and Hal shot him with the large Colt revolver.
        - id: ch01-b53
          speaker: narrator
          text: >-
            People in the North said that a dog from the Outside would starve on a husky's ration. These six Outside dogs were given only half a husky's ration, so they could only die. The Newfoundland went first. The three pointers followed. The two mongrels clung to life more stubbornly, but they too died in the end.
        - id: ch01-b54
          speaker: narrator
          text: >-
            By then, every gentle habit of the South had fallen away from the three people. Arctic travel had lost its glow and romance. Its reality was harsher than they could bear. Mercedes stopped crying for the dogs because she was busy crying for herself and fighting with her husband and brother. No matter how tired they became, they always had strength enough to quarrel.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Misery made them irritable. Their irritation grew with the misery, doubled it, and soon raced ahead of it. Some people work hard and suffer deeply on the trail yet find a wonderful patience. They remain gentle in speech and kind to one another. That patience never came to Hal, Charles, or Mercedes. Their bodies had stiffened with pain. Their muscles ached, their bones ached, and even their hearts seemed to ache. Sharp words came more easily than kind ones. Hard words were the first things on their lips each morning and the last things there every night.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Charles and Hal argued whenever Mercedes allowed them a moment to do it. Each man believed he did more than his share and said so whenever he could. Mercedes sometimes supported her husband and sometimes her brother. The result was one endless family battle.
        - id: ch01-b57
          speaker: narrator
          text: >-
            An argument about which man should cut a few sticks for the fire soon pulled in fathers, mothers, uncles, cousins, and relatives thousands of miles away, including some who were dead. Hal's opinions about art and the plays written by his mother's brother somehow entered the dispute. So did Charles's political ideas. Mercedes explained at length why Charles's sister carried tales and what else was wrong with her husband's family. Meanwhile, no one built the fire. The camp stayed half raised, and the dogs went without food.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Mercedes felt she had one special grievance because she was a woman. She was pretty and soft, and everyone had treated her with great courtesy all her life. Helplessness was her habit. Now her husband and brother complained about it instead of protecting her. To Mercedes, that complaint attacked one of her most important rights, so she made their lives unbearable.
        - id: ch01-b59
          speaker: narrator
          text: >-
            She no longer thought about the dogs. Sore and tired, she insisted on riding the sled. Her soft body weighed one hundred and twenty pounds, one last heavy burden for the starving animals. For days she rode until the dogs collapsed in their traces and the sled stopped. Charles and Hal begged and pleaded with her to walk. She only wept and called on Heaven to witness their cruelty.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Once, the men pulled her off the sled by force. They never tried it again. She made her legs limp like a spoiled child and sat in the trail while they went on. After three miles, they stopped, unloaded the sled, walked back, lifted her by force, and carried her to the sled again.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Their own suffering made them hard toward the animals' suffering. Hal believed everyone had to be hardened. He had begun by preaching this to Mercedes and Charles. When he failed to harden them, he beat the lesson into the dogs with a club.
        - id: ch01-b62
          speaker: narrator
          text: >-
            At Five Fingers, all the dog food ran out. An old toothless Native woman offered them a few pounds of frozen horsehide in exchange for Hal's Colt revolver, the weapon that had hung beside his hunting knife. The hide had been stripped six months earlier from the starved horses of cattle drivers. It was a miserable substitute for food. While frozen, each strip was more like a piece of galvanized iron. A dog had to wrestle it into his stomach. Once inside, it thawed into thin, tough strings of leather and a mass of short hair. The hair irritated the stomach, the leather resisted digestion, and neither gave the starving body much nourishment.
        - id: ch01-b63
          speaker: narrator
          text: >-
            Through everything, Buck staggered at the head of the team as if trapped in a nightmare. He pulled while he could. When he could pull no more, he fell and stayed down until the whip or club forced him up. His beautiful coat had lost its shine and firmness. The fur hung loose and dirty, with dried blood matting the places Hal's club had bruised.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Buck's muscles had wasted into knotted cords. The padding of flesh was gone, and every rib and bone showed through loose skin that folded over his emptiness. The sight could have broken a heart, but Buck's heart would not break. The man in the red sweater had proved that long before.
        - id: ch01-b65
          speaker: narrator
          text: >-
            The other dogs were no better. Only seven remained, Buck included, and all were walking skeletons. Their misery had grown so great that whip and club seemed far away. Everything they saw and heard was distant and dull. They were not half alive, or even a quarter alive. They were bags of bones with faint sparks of life inside them.
        - id: ch01-b66
          speaker: narrator
          text: >-
            At every halt they dropped in the traces like dead dogs. The sparks dimmed until they seemed ready to vanish. Then a blow fell, and those sparks fluttered weakly. The dogs struggled upright and stumbled on.
        - id: ch01-b67
          speaker: narrator
          text: >-
            Then came a day when gentle, good-natured Billee fell in the traces and could not rise again. Hal had traded away his revolver, so he took the axe and struck Billee on the head as the dog lay helpless in his harness. Afterward, Hal cut the body free and dragged it to one side of the trail. Buck saw everything, and so did the remaining dogs. None of them could mistake what it meant. The same end had drawn very close to every one of them.
        - id: ch01-b68
          speaker: narrator
          text: >-
            Koona died the next day, leaving only five dogs. Joe was too far gone to show his old bitter temper. Pike limped along crippled and only half conscious. He was no longer awake enough to pretend he was sick, as he once had. One-eyed Sol-leks remained faithful to the work of harness and trail. His sorrow came from having so little strength left for the pulling he still wished to do. Teek had not traveled as far that winter and was fresher than the others. Because he had more life in him, Hal beat him more often.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Buck still led the team, but he no longer tried to keep order. Weakness blinded him much of the time. He followed the trail by its faint shape and by the dim feeling beneath his paws.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Spring had become beautiful, though neither dogs nor people noticed. The sun rose earlier and set later each day. Dawn came by three in the morning, and twilight remained until nine at night. Sunshine blazed through all those long hours. Winter's ghostly silence had given way to the great murmur of life awakening across the land. Living things that had lain still through the frozen months moved again, filled with the joy of being alive.
        - id: ch01-b71
          speaker: narrator
          text: >-
            Sap rose in the pine trees. Young buds opened on willow and aspen, while shrubs and vines dressed themselves in fresh green. Crickets sang through the nights. By day, every kind of creeping and crawling creature rustled into the warmth of the sun. Partridges boomed in the woods, and woodpeckers knocked against the trees. Squirrels chattered, birds sang, and high overhead wild fowl returned from the south. Their clever wedges split the air as they flew north.
        - id: ch01-b72
          speaker: narrator
          text: >-
            Water trickled down every hillside, and hidden springs made music across the land. Everything frozen was thawing, bending, and snapping apart once more. Beneath its cover, the Yukon strained to break free. The river ate the ice from below while the sun ate it from above. Open holes appeared. Cracks sprang out and widened. Thin sheets of ice dropped whole into the moving water.
        - id: ch01-b73
          speaker: narrator
          text: >-
            All around them, life burst and throbbed beneath the bright sun and soft breeze. Through the middle of it, two men, one woman, and their huskies staggered like travelers walking toward death.
        - id: ch01-b74
          speaker: narrator
          text: >-
            Dogs were falling. Mercedes wept and rode. Hal cursed without effect, and Charles's watery eyes stared sadly ahead. In this condition they reached John Thornton's camp at the mouth of the White River. The moment they stopped, the dogs dropped as if a single blow had killed them all.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Mercedes dried her eyes and looked at Thornton. Charles lowered himself onto a log with painful care because his body was so stiff. Hal did the talking for the party. Thornton was putting the final touches on an axe handle he had shaped from a stick of birch. He kept carving while Hal spoke. His replies were only a word or two, and when they asked his opinion, his advice was short and direct. Thornton knew the kind of people before him. He offered the warning, but he was certain they would ignore it.
        - id: ch01-b76
          speaker: hal
          text: >-
            People back up the trail said the ice was breaking apart and we ought to wait. They said we'd never even reach White River, but here we are.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Triumph and mockery rang in Hal's last words. Thornton had warned them not to risk the rotting river ice.
        - id: ch01-b78
          speaker: john_thornton
          text: >-
            They gave you the truth. That trail could fall away at any moment. Only fools with a fool's luck could have come this far. I wouldn't put my body on that ice for all the gold in Alaska.
        - id: ch01-b79
          speaker: hal
          text: >-
            I suppose that's because you're no fool. It doesn't matter. We're going on to Dawson.
        - id: ch01-b80
          speaker: narrator
          text: >-
            Hal unwound his whip.
        - id: ch01-b81
          speaker: hal
          text: >-
            Get up, Buck! Up! Mush!
        - id: ch01-b82
          speaker: narrator
          text: >-
            Thornton continued carving. He knew there was no use stepping between a fool and his foolishness. A few more fools in the world would change nothing.
        - id: ch01-b83
          speaker: narrator
          text: >-
            The dogs did not rise. They had long ago passed the point when an order could move them. Only blows could bring them to their feet. The whip flashed back and forth on its merciless work, striking one body and then another. Thornton pressed his lips tightly together as he watched. Sol-leks was the first to crawl upright. Teek struggled after him. Joe came next, crying out with pain as he rose. Pike made one painful attempt and fell when he was halfway up. He tried again and fell again. On the third attempt, he finally managed to stand.
        - id: ch01-b84
          speaker: narrator
          text: >-
            Buck did not try. He lay quietly where he had fallen. Again and again, the lash cut into him, but he neither cried nor struggled. Thornton moved as if he might speak, then held himself back. Moisture gathered in his eyes. As the whipping continued, he rose and paced uncertainly.
        - id: ch01-b85
          speaker: narrator
          text: >-
            Buck had never failed before, and that alone drove Hal into a rage. Hal put aside the whip and took up his usual club. The heavier blows rained down, but Buck would not move. Like the other dogs, he could barely have stood. Unlike them, he had decided he would not stand.
        - id: ch01-b86
          speaker: narrator
          text: >-
            Buck felt danger waiting ahead. The feeling had come strongly when they reached the riverbank, and it had stayed with him. All day his paws had sensed the thin, rotten ice. Somewhere out there, along the very path Hal meant to take, disaster seemed close. Buck refused to stir.
        - id: ch01-b87
          speaker: narrator
          text: >-
            He had suffered so much and fallen so near death that the blows hardly hurt. As they continued, the spark of life inside him flickered lower. It was almost gone. Numbness spread through him. From a great distance, he knew someone was beating him. Then even the last pain disappeared. He could faintly hear the club hitting a body, but that body no longer seemed to belong to him.
        - id: ch01-b88
          speaker: narrator
          text: >-
            Without warning, John Thornton gave a wild, wordless cry and sprang at the man with the club. Hal flew backward as if a falling tree had struck him. Mercedes screamed. Charles only watched sadly and wiped his wet eyes. He was too stiff to stand.
        - id: ch01-b89
          speaker: narrator
          text: >-
            Thornton stood above Buck, shaking with such fury that he could not speak. At last, the words came out in a choking voice.
        - id: ch01-b90
          speaker: john_thornton
          text: >-
            Hit that dog once more, and I'll kill you.
          emotion: angry
        - id: ch01-b91
          speaker: narrator
          text: >-
            Hal got up and wiped blood from his mouth.
        - id: ch01-b92
          speaker: hal
          text: >-
            He's my dog. Move aside, or I'll deal with you. I'm going to Dawson.
          emotion: angry
        - id: ch01-b93
          speaker: narrator
          text: >-
            Thornton stayed between Hal and Buck and plainly had no intention of moving aside. Hal drew the long hunting knife from his belt. Mercedes lost herself completely. She screamed, cried, and laughed in the same wild burst of hysteria. Thornton struck Hal across the knuckles with the wooden axe handle, knocking the knife to the ground. Hal tried to pick it up. Thornton struck his knuckles a second time. Then he bent down, took the knife himself, and cut through Buck's traces with two quick strokes.
        - id: ch01-b94
          speaker: narrator
          text: >-
            Hal had no fight left. His arms were occupied with his sister, and Buck was too close to death to be useful at the sled. A few minutes later, the others pulled away from the bank and headed down the river. Buck heard them leave and raised his head.
        - id: ch01-b95
          speaker: narrator
          text: >-
            Pike led the team, and Sol-leks pulled nearest the sled. Joe and Teek stumbled between them. Every dog limped and staggered. Mercedes rode on top of the loaded sled. Hal held the guiding pole while Charles stumbled behind.
        - id: ch01-b96
          speaker: narrator
          text: >-
            As Buck watched, Thornton knelt beside him. Rough but gentle hands searched his body for broken bones. There were none, only many bruises and terrible starvation. By the time Thornton finished, the sled was a quarter mile away. Man and dog watched it crawl over the ice.
        - id: ch01-b97
          speaker: narrator
          text: >-
            Suddenly, the back of the sled dropped as if it had fallen into a deep rut. The front pitched upward, and the guiding pole jerked into the air with Hal still clinging to it. Mercedes's scream carried all the way back to the riverbank. Charles turned around and managed one step as if to run back. Then an entire section of ice broke away beneath the travelers. The dogs and all three people disappeared into the river together. Where the team and sled had been, nothing remained but a wide, yawning hole. The bottom had fallen out of the trail.
        - id: ch01-b98
          speaker: narrator
          text: >-
            John Thornton and Buck looked at each other.
        - id: ch01-b99
          speaker: john_thornton
          text: >-
            You poor devil.
          emotion: sad
        - id: ch01-b100
          speaker: narrator
          text: >-
            Buck licked his hand.
