audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 生动沉稳，时刻留意逼近的危险
        timbre: 温暖浑厚，清晰有力
        pace: 从容有度
        pitch: 中音
    francois:
      display_name: 弗朗索瓦
      tts:
        delivery: 镇定能干，惜字如金
        timbre: 深沉平稳
        pace: 从容
        pitch: 低音
    perrault:
      display_name: 佩罗
      tts:
        delivery: 果断务实，语气简短有力
        timbre: 清亮坚实
        pace: 稍快
        pitch: 中低音
    scotch_half_breed:
      display_name: 苏格兰混血赶狗人
      tts:
        delivery: 寡言坚忍，待狗公道而克制
        timbre: 粗粝低沉
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 巴克要领队
      blocks:
        - id: ch01-b01
          speaker: francois
          text: 怎么样？我早说过，巴克抵得上两个魔鬼。瞧他这一身伤，昨晚准是他赢了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            第二天早晨，弗朗索瓦发现斯匹茨不见了，巴克却满身伤口。他把巴克带到火边，借着亮光，一处处指给佩罗看。
        - id: ch01-b03
          speaker: perrault
          text: 斯匹茨下口可真狠，简直像个魔鬼。
        - id: ch01-b04
          speaker: francois
          text: 可巴克打起来像两个魔鬼！这下能赶快些了。斯匹茨没了，麻烦也没了。
        - id: ch01-b05
          speaker: narrator
          text: >-
            佩罗收拾行装，把东西装上雪橇，弗朗索瓦则给狗群套挽具。巴克径直跑到斯匹茨原来领队的位置。弗朗索瓦没理他，却把索尔莱克斯牵到前面。在他看来，剩下的狗里，索尔莱克斯最适合领队。巴克一下扑过去，把老狗赶开，自己占住了位置。索尔莱克斯明明很怕巴克，也根本不想留在那里。
        - id: ch01-b06
          speaker: francois
          text: 哈！瞧瞧巴克！他杀了斯匹茨，就以为这个差事归他了。走开，你这蠢货！
        - id: ch01-b07
          speaker: narrator
          text: >-
            巴克一步也不动。弗朗索瓦揪住他的后颈，顶着威胁的低吼，把他拖开，再将索尔莱克斯放回去。可他刚一转身，巴克又把老狗赶走。弗朗索瓦气得握起一根粗棍，发誓非收拾巴克不可。
        - id: ch01-b08
          speaker: narrator
          text: >-
            巴克想起了穿红毛衣的男人，慢慢退出棍棒够得着的范围。他不再冲撞索尔莱克斯，只绕着营地低吼。那声音里满是怨恨和怒火，眼睛却一直盯紧棍子，随时准备在弗朗索瓦扔出它时闪开。巴克早就懂得该怎样对付棍棒。弗朗索瓦干完手里的活，招呼他回到戴夫前面的老位置。巴克便退后几步。赶狗人追上去，他又退。两边这样耗了许久，弗朗索瓦以为巴克只是怕挨打，索性扔下棍子。
        - id: ch01-b09
          speaker: narrator
          text: >-
            可巴克不是在躲避棍棒。他要领队，而且只肯领队。这个位置是他凭本事赢来的，少了它，他绝不罢休。佩罗也来帮忙。两个人追着巴克绕了大半个钟头，向他扔棍子，还把他从祖先到后代、从每根毛到每滴血都骂了个遍。巴克一边躲，一边用低吼回敬。他不曾逃远，只绕着营地打转，清楚地表明，只要得到想要的位置，他马上就会回来听话。
        - id: ch01-b10
          speaker: narrator
          text: >-
            弗朗索瓦终于坐下，一遍遍抓着脑袋。佩罗看看表，忍不住骂了起来。时间飞快过去，他们早该上路，已经耽搁整整一个钟头。弗朗索瓦再次摇头，难为情地冲佩罗笑笑。佩罗耸了耸肩，表示他们认输了。于是弗朗索瓦解开索尔莱克斯的挽带，把他放回老位置。整支狗队已经套好挽具，在雪橇前排成不间断的一列，只剩最前方还空着。弗朗索瓦又叫巴克，巴克却站在远处，露出狗那样的笑。
        - id: ch01-b11
          speaker: perrault
          text: 把棍子扔掉。
        - id: ch01-b12
          speaker: narrator
          text: >-
            弗朗索瓦把棍子扔下，巴克这才得意地跑过来，转身站到狗队最前面。挽带一扣好，雪橇一撬松，两个人便跟着飞奔起来。狗队猛然冲出，踏上河面的雪道。
    - id: ch02
      title: 新领队的纪录
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            弗朗索瓦原本已经很看重巴克，可这一天才刚开始，他便知道自己仍旧低估了他。巴克一下子就担起领队的职责。遇到事情需要判断，需要马上想出办法、立刻行动时，他甚至比斯匹茨更出色。在弗朗索瓦眼里，从前可没有任何狗比得上斯匹茨。
        - id: ch02-b02
          speaker: narrator
          text: >-
            巴克真正胜过斯匹茨的地方，是他能立下规矩，也能逼着同伴遵守。戴夫和索尔莱克斯不在乎谁领队。它们只在乎拼命拉橇，只要没人妨碍工作，就算由好脾气的比利带队也无所谓。其他狗却在斯匹茨最后那些日子里变得无法无天。如今巴克动手整顿，它们全都吃了一惊。
        - id: ch02-b03
          speaker: narrator
          text: >-
            派克跟在巴克脚后，胸前抵着拉橇的皮带。除非逼不得已，他绝不肯多出一分力气。巴克发现他偷懒，立刻一次又一次狠狠收拾这个懒鬼。第一天还没结束，派克拉橇时使出的力气，就已经超过了平生任何时候。到了第一个宿营的夜晚，性情乖戾的乔也挨了狠罚。连斯匹茨都没能彻底制住他，巴克却凭更重的身躯死死压住他，又咬得他遍体是伤，直到乔不再乱咬，只剩下求饶的哀叫。
        - id: ch02-b04
          speaker: narrator
          text: >-
            狗队立刻振作起来，再次齐心协力，像一条狗那样同时扑进挽绳。到了林克急流，两条当地的爱斯基摩犬加入进来，一条叫提克，一条叫库纳。巴克眨眼间就把它们教会了规矩，快得让弗朗索瓦几乎喘不过气来。
        - id: ch02-b05
          speaker: francois
          text: 再没有哪条狗比得上巴克！绝对没有！老天在上，他值一千块钱。佩罗，你说是不是？
        - id: ch02-b06
          speaker: narrator
          text: >-
            佩罗点点头。他们已经超过纪录，而且每天还在把纪录往前推。雪道的状况好极了，积雪踩得又紧又硬，没有一层新雪需要狗群重新破开。天气也不算太冷，气温降到零下五十度以后，一路没再变化。两个男人轮流乘橇和奔跑，狗群则始终全速疾驰，只有极少数时候才会停下。
        - id: ch02-b07
          speaker: narrator
          text: >-
            三十英里河大体封冻了。来时走了十天的路，出去时一天便已走完。从拉巴奇湖下端到白马急流，它们一口气冲过六十英里。接着，狗队飞越马什湖、塔吉什湖和贝内特湖，七十英里湖面迅速落在身后。轮到在地面奔跑的人，只得抓住雪橇后面的绳子，被一路拖着走。第二周最后一夜，他们翻过白隘口，冲下临海山坡，斯卡圭和港口船只的灯火已经铺在脚下。
        - id: ch02-b08
          speaker: narrator
          text: >-
            他们创下了纪录。整整十四天，平均每天都赶四十英里。此后三天，佩罗和弗朗索瓦昂首走在斯卡圭的大街上，到处有人请他们喝酒，邀请多得仿佛要把两人淹没。狗队也始终是众人瞩目的中心，被赶狗人和驯狗人怀着敬意围得水泄不通。没多久，三四个西部恶汉想在城里逞凶，结果被子弹打成筛子，人们这才把兴趣转向新的偶像。
        - id: ch02-b09
          speaker: narrator
          text: >-
            接着，官方命令送到了。弗朗索瓦把巴克叫来，紧紧抱住他，流着眼泪同他告别。巴克再也没有见过弗朗索瓦和佩罗。他们也像其他人一样，从他的生命里永远消失了。
    - id: ch03
      title: 邮运队与远古之梦
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            一个苏格兰混血儿接管了巴克和他的同伴。它们与另外十来支狗队一起，沿疲惫的雪道返回道森。如今不再是轻装赶路，也不再追逐纪录。它们每天都拖着沉重的载荷，干着沉重的活。这是邮运队，要把外面世界的消息送到那些在北极阴影下寻找黄金的人手里。
        - id: ch03-b02
          speaker: narrator
          text: >-
            巴克不喜欢这种生活，却把工作担得很好。他像戴夫和索尔莱克斯一样以拉橇为荣，也盯紧每个同伴，要它们各自出足该出的那份力，不管它们是否以此为荣。日子单调得像机器，每一天都和前一天一样。每天到了固定时刻，厨子们便摸黑起身，生火准备早饭。有人收拾营地，有人给狗套挽具。等到预告黎明的那片黑暗降临，他们已经上路一个钟头了。
        - id: ch03-b03
          speaker: narrator
          text: >-
            夜里一扎营，有人支起外篷，有人砍柴、割松枝铺床，还有人替厨子取水或凿冰。狗群也会得到食物。对它们来说，这才是一天中最重要的事。吃完鱼以后，能同另外一百来条狗闲逛一个钟头，也算难得的自在。那些狗里有不少凶狠的斗士，可巴克接连打过三场恶战，战胜了最凶猛的对手，稳稳占住霸主地位。以后只要他竖起毛、露出牙齿，别的狗便会主动让开。
        - id: ch03-b04
          speaker: narrator
          text: >-
            巴克最喜欢的，还是卧在火边。他把后腿蜷在身下，前腿向前伸直，脑袋高高抬着，一双眼睛半闭，迷迷蒙蒙地望着火焰。有时，他会想起洒满阳光的圣克拉拉谷地，想起米勒法官的大宅、混凝土游泳池、墨西哥无毛犬伊莎贝尔，还有日本哈巴狗图茨。可他更常想起穿红毛衣的男人、柯莉的死、与斯匹茨的恶战，还有曾经吃过和很想吃到的美味。
        - id: ch03-b05
          speaker: narrator
          text: >-
            他不思念故乡。阳光之乡已经太黯淡，也太遥远，那些记忆再也牵不动他。真正有力量的，是血脉里传下来的记忆。它们让巴克面对从没见过的事，也会觉得熟悉。所谓本能，不过是祖先的记忆变成了习惯。它们沉睡了许多岁月，如今又在巴克体内醒来，活了起来。
        - id: ch03-b06
          speaker: narrator
          text: >-
            有时，巴克伏在火边出神，眼前的火焰会变成另一堆火。守在火旁的也不是混血厨子，而是另一个人。那个人双腿短，手臂很长，肌肉并不饱满，却像一束束绳索那样纠结成团。乱蓬蓬的长发底下，额头从眼睛上方向后倾斜。他嘴里发出怪声，总在不停窥视四周的黑暗，看起来怕得厉害。一只手垂在膝盖与脚掌之间，紧紧握着一根木棒，棒头还牢牢绑着沉重的石块。
        - id: ch03-b07
          speaker: narrator
          text: >-
            那个人几乎没穿衣服，背后只垂着一块烧焦的破兽皮，身上却长满毛。胸膛、肩头、手臂和大腿外侧，有些地方的毛厚得像皮。双膝一直弯着，身子从髋部向前俯，根本无法站直。可他动作轻捷，像猫一样充满弹性，也永远保持警觉，仿佛时时都在躲避看得见和看不见的危险。
        - id: ch03-b08
          speaker: narrator
          text: >-
            有时，这个毛人会蹲在火边睡觉。他把脑袋埋进两腿，双肘支着膝盖，双手扣在头顶，仿佛要用毛茸茸的手臂挡住落下的雨。火光外面环绕的黑暗里，总有许多亮点两个一组、两个一组地闪着。巴克知道，那是巨大猛兽的眼睛。他听得到它们的身体撞过灌木丛，也听得到它们在黑夜里发出的种种声响。
        - id: ch03-b09
          speaker: narrator
          text: >-
            巴克明明卧在育空河岸边，懒洋洋地眯眼看火，另一个世界的声响和景象却会让他浑身的毛竖起来，从背脊爬过肩膀，一直立到颈上。他压着嗓子呜咽，或低低咆哮。混血厨子听见了，便会把他叫醒。
        - id: ch03-b10
          speaker: scotch_half_breed
          text: 喂，巴克，醒醒！
        - id: ch03-b11
          speaker: narrator
          text: >-
            于是另一个世界消失了，真实的世界重新回到巴克眼中。他站起身，打个哈欠，再伸展四肢，仿佛刚刚真的睡着了。
    - id: ch04
      title: 戴夫不肯离开挽绳
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            邮件压在身后，这一程十分艰苦，沉重的劳作一点点耗垮了狗群。它们回到道森时已经消瘦不堪，至少该休息七天，最好休息十天。可仅仅两天以后，它们又装上寄往外界的信件，从兵营旁的育空河岸出发。狗累得厉害，赶狗人也满腹牢骚。偏偏每天还在下雪。雪道变软，橇底的阻力更大，狗群拉起来也更吃力。好在赶狗人对它们一直公道，尽力照顾每一条狗。
        - id: ch04-b02
          speaker: narrator
          text: >-
            每到夜里，最先得到照料的总是狗群。它们在赶狗人吃饭以前便能吃饱。赶狗人还会逐一检查脚掌，确认自己赶的狗都安顿好了，才肯钻进睡袋。可是狗群的力气仍在衰退。入冬以来，它们已经拖着雪橇走过一千八百英里。再强韧的生命，也经不起这么漫长的苦途。巴克仍在维持纪律，督促同伴干活，可他自己同样筋疲力尽。比利每夜都在梦中呜咽，乔的性情比从前更乖戾，索尔莱克斯无论哪一侧都不许谁靠近。
        - id: ch04-b03
          speaker: narrator
          text: >-
            戴夫受的苦最重。他的身体里面出了问题，性情越来越阴郁暴躁。一到营地，他马上刨窝趴下，由赶狗人把食物送来。挽具解下以后，直到第二天再次套挽具，他都不肯站起。拉橇时，雪橇突然停下扯动挽带，或是起步用力过猛，都会让他疼得叫出声。
        - id: ch04-b04
          speaker: narrator
          text: >-
            赶狗人仔细检查，却看不出毛病。所有赶狗人都关心起戴夫，吃饭时谈他，睡前抽最后一斗烟时也谈他。一天夜里，他们索性围在一起会诊，把戴夫从雪窝带到火边，浑身上下又按又戳，疼得他一次次叫喊。谁都知道，他身体里面一定有地方坏了。可众人找不到一根断骨，也始终弄不懂那究竟是什么病。
        - id: ch04-b05
          speaker: narrator
          text: >-
            到了卡西亚沙洲，戴夫已经虚弱得一次次倒在挽绳里。苏格兰混血儿叫停队伍，把他撤下，再把前面的索尔莱克斯直接拴到雪橇上。他想让戴夫休息，叫他轻松地跟在后面。戴夫却又哼又吼，不肯离开。看见索尔莱克斯站在自己长久坚守的位置上，他更伤心得呜咽。那份属于雪道和挽绳的骄傲，也在戴夫心里。即使病得快死了，他还是无法忍受别人接替自己的工作。
        - id: ch04-b06
          speaker: narrator
          text: >-
            雪橇一动，戴夫便扑进雪道旁松软的深雪，艰难地跟着。他用牙咬索尔莱克斯，又用身体撞他，想把他推到另一边的软雪里。他还不断往挽带中间跳，拼命想挤进索尔莱克斯和雪橇之间。悲伤和疼痛让他一路呜咽尖叫。混血儿用鞭子赶他，戴夫根本不理会。赶狗人又不忍心下重手。
        - id: ch04-b07
          speaker: narrator
          text: >-
            戴夫不肯走雪橇后面那条已经踩实、十分轻松的硬路，仍在路旁最难走的深雪中挣扎。最后，他耗尽力气，倒在原地，悲凉地长声哀号。长长的雪橇队从身旁驶过，一架架雪橇的底部翻搅着积雪。他还是用最后一点力量站起来，摇摇晃晃地跟在后面。等队伍再次停下，他又从一架架雪橇旁艰难赶过去，回到属于自己的雪橇边，与索尔莱克斯并肩站着。
        - id: ch04-b08
          speaker: narrator
          text: >-
            赶狗人停在后面，向同伴借火点烟。等他回来吆喝狗群，大家几乎没费什么力气便扑向前方，可一架雪橇也没有移动。狗群不安地回头，赶狗人也惊讶地叫来同伴。戴夫已经咬断索尔莱克斯的两条挽带，正站在雪橇正前方，守着自己本该站的位置。
        - id: ch04-b09
          speaker: narrator
          text: >-
            戴夫用眼睛哀求赶狗人让他留下。赶狗人不知道怎么办。同伴们说，一条狗若是不准再做那份足以累死它的工作，当真会因此心碎。他们也见过年老或受伤的狗被撤出挽绳以后，就这样郁郁而死。反正戴夫已经活不长，让他套在挽绳里安心满足地死去，反倒是一种仁慈。
        - id: ch04-b10
          speaker: narrator
          text: >-
            于是戴夫重新套上挽具，又像从前那样骄傲地拉起来。身体里的伤痛咬住他时，他会不由自主地失声叫喊。他几次倒下，被挽带拖着前进。有一回，雪橇甚至从他身上碾过，从此他的一条后腿也瘸了。可戴夫仍旧不肯停下，一直撑到营地。赶狗人在火边替他腾出一个地方，让他在那里休息。
    - id: ch05
      title: 树林背后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            第二天早晨，戴夫已经虚弱得走不了路。狗群套挽具时，他拼命想爬到赶狗人那里。他浑身抽搐着站起来，才摇晃几步，又跌倒在地。接着，他向同伴们一点点蠕动。先伸出前腿，再猛地拖动身体。然后又伸出前腿，再往前挪几英寸。
        - id: ch05-b02
          speaker: narrator
          text: >-
            他的力气终于全部耗尽。同伴们最后一次看见他时，戴夫趴在雪地里急促喘息，眼睛仍满怀渴望地朝它们望去。雪橇队渐渐远去，直到绕过河边一片树林，再也看不见他的身影，大家仍能听见他悲哀的长号从后面一声声传来。
        - id: ch05-b03
          speaker: narrator
          text: >-
            队伍停住了。苏格兰混血儿慢慢沿原路走回刚刚离开的营地。所有人都不再说话。
        - id: ch05-b04
          speaker: narrator
          text: >-
            一声左轮手枪的枪响划破寂静。赶狗人匆匆回来。鞭子再次炸响，铃铛欢快地叮当作响，雪橇翻搅着积雪继续前行。然而巴克知道。每一条狗也都知道。河边那片树林背后发生了什么，它们全都明白。
