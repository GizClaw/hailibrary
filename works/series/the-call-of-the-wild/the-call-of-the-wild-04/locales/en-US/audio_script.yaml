  chapters:
    - id: ch01
      title: "Chapter IV. Who Has Won to Mastership"
      blocks:
        - id: ch01-b01
          speaker: francois
          text: >-
            Eh? What did I tell you? I spoke true when I said Buck was two devils.
        - id: ch01-b02
          speaker: narrator
          text: >-
            François said this the next morning. Spitz was gone, and Buck was covered in wounds. François drew Buck close to the fire and pointed out the injuries in its light.
        - id: ch01-b03
          speaker: perrault
          text: "That Spitz fought like hell."
        - id: ch01-b04
          speaker: narrator
          text: >-
            Perrault looked over the open cuts and deep tears.
        - id: ch01-b05
          speaker: francois
          text: >-
            And Buck fought like two hells. Now we make good time. No more Spitz, no more trouble. That's sure.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Perrault packed the camp gear and loaded the sled while François harnessed the dogs. Buck trotted straight to the lead position where Spitz had stood. François did not notice him. He brought Sol-leks forward instead, believing the old dog was the best leader left. Buck flew at Sol-leks in a rage, drove him back, and claimed the place.
        - id: ch01-b07
          speaker: francois
          text: >-
            Eh? Eh? Look at Buck! He kills Spitz, and now he thinks he'll take the job. Go away, you fool!
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: >-
            Buck would not move. François seized the fur at his neck and dragged him aside, though Buck growled a warning. Then François put Sol-leks back. Sol-leks clearly disliked the arrangement and feared Buck. As soon as François turned away, Buck forced him out again, and Sol-leks went willingly.
        - id: ch01-b09
          speaker: francois
          text: "Now, by heaven, I'll fix you!"
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: >-
            François came back with a heavy club. Buck remembered the man in the red sweater and slowly gave ground. He did not rush Sol-leks when François brought him forward again. Instead, Buck circled just beyond the club's reach, snarling with rage and watching closely enough to dodge if François threw it. Buck understood clubs now.
        - id: ch01-b11
          speaker: narrator
          text: >-
            When François was ready to harness him in his old place ahead of Dave, he called Buck over. Buck backed away. François followed, and Buck backed away again. At last François dropped the club, thinking Buck was afraid of a beating. But Buck was not trying to escape the club. He was openly refusing to work anywhere but in the lead. He had won that place, and nothing less would satisfy him.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Perrault joined the struggle. For nearly an hour the two men chased Buck around camp and threw clubs at him. Buck dodged every one. They cursed Buck, all his ancestors and descendants, every hair on his body, and every drop of blood in him. Buck answered with snarls and stayed beyond their reach. He never tried to flee. He kept circling camp, making his meaning plain. Give him what he wanted, and he would come in and behave.
        - id: ch01-b13
          speaker: narrator
          text: >-
            François sat down and scratched his head. Perrault checked his watch and swore. They should have started an hour ago. François scratched his head once more, then shook it and gave Perrault a sheepish grin. Perrault shrugged. Buck had beaten them.
        - id: ch01-b14
          speaker: narrator
          text: >-
            François went to Sol-leks and called Buck. Buck gave a dog's laugh but kept his distance. François unfastened Sol-leks and returned him to his old place. Now the whole team stood in one harnessed line, ready for the trail, with only the lead position empty. François called again. Buck laughed again and stayed away.
        - id: ch01-b15
          speaker: perrault
          text: "Throw down the club."
        - id: ch01-b16
          speaker: narrator
          text: >-
            François obeyed. Buck trotted in with a triumphant laugh and swung into place at the head of the team. They fastened his traces and broke the sled free. With both men running, the team raced onto the river trail.
        - id: ch01-b17
          speaker: narrator
          text: >-
            François already thought highly of Buck and his two devils. Before that day was far along, he knew he had not thought highly enough. Buck took command at once. Whenever the trail demanded judgment, fast thought, or quick action, he proved better even than Spitz, whom François had believed no dog could equal.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Buck was best of all at laying down the law and making every dog obey it. Dave and Sol-leks did not care who led. Their concern was pulling hard in the traces. As long as no one interfered with that work, nothing else mattered. Even gentle Billee could have led for all they cared, if he had kept order. But the other dogs had become unruly during Spitz's last days. They were startled when Buck quickly brought them back under control.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Pike ran just behind Buck and always put as little weight as possible against his breast-band. Buck caught him loafing and shook him hard, again and again. Before the first day ended, Pike was pulling harder than he ever had. That night, Buck dealt severely with bitter Joe, something Spitz had never managed. Buck used his greater weight to smother Joe and slashed him until his snapping became a whine for mercy.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The whole spirit of the team changed at once. Its old unity returned, and the dogs leaped together as if they were one animal. At Rink Rapids, two native huskies named Teek and Koona joined them. Buck trained them so swiftly that François could hardly believe it.
        - id: ch01-b21
          speaker: francois
          text: >-
            Never was there a dog like Buck! No, never! He's worth one thousand dollars, by heaven! Eh, what do you say, Perrault?
          emotion: surprised
        - id: ch01-b22
          speaker: narrator
          text: >-
            Perrault nodded. He was already ahead of the record, and each day he gained more time. The trail was hard, smooth, and well packed. No fresh snow slowed them down. The cold held at fifty below zero for the whole journey, but it was not too cold for travel. The men took turns riding and running, and the dogs rushed on with few stops.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Ice covered most of the Thirty Mile River. On the outward journey, they crossed in one day what had taken ten days before. In a single run, they dashed sixty miles from the foot of Lake Le Barge to White Horse Rapids. Then they flew across the seventy miles of lakes called Marsh, Tagish, and Bennett. They moved so fast that the man running had to hold a rope and be towed behind the sled.
        - id: ch01-b24
          speaker: narrator
          text: >-
            On the last night of the second week, they climbed to the top of White Pass. Then they dropped down the slope toward the sea. Far below their feet shone the lights of Skaguay and the ships in its harbor.
        - id: ch01-b25
          speaker: narrator
          text: >-
            They had made a record run, averaging forty miles a day for fourteen days. For three days, Perrault and François strutted proudly along Skaguay's main street while people invited them everywhere for drinks. Crowds of dog drivers and sled men gathered around the team in admiration.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Then three or four dangerous men from the West tried to take over the town and were shot full of holes. The crowd found new heroes to talk about. After that came official orders. François called Buck close, wrapped both arms around him, and wept. That was the last Buck ever saw of François and Perrault. Like other men before them, they passed out of his life forever.
        - id: ch01-b27
          speaker: narrator
          text: >-
            A Scotch half-breed took charge of Buck and his teammates. Alongside a dozen other dog teams, they started back over the long trail to Dawson. There would be no easy running and no record pace now. Each day brought hard labor with a heavy load behind them. This was the mail train, carrying news from the outside world to men hunting gold beneath the shadow of the Pole.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Buck did not enjoy the work, but he endured it well. Like Dave and Sol-leks, he took pride in doing his job. He made certain that every teammate did a fair share, whether that dog felt pride or not. Life became dull and regular, with one day almost exactly like the next.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Each morning at the same time, the cooks rose, fires were lit, and everyone ate breakfast. Some men broke camp while others harnessed the dogs. The teams set out an hour or so before the darkness began to fade and give warning of dawn. At night, they made camp again. Some men raised the tents. Others cut firewood and pine branches for beds, while the rest carried water or ice to the cooks.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Then the dogs were fed. That was the great moment of their day. After eating their fish, they could spend an hour resting among more than a hundred other dogs. Some were fierce fighters, but Buck defeated the three most dangerous. From then on, he needed only to raise his fur and show his teeth. The others moved aside.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Perhaps Buck loved the fire most of all. He would crouch with his hind legs folded under him, stretch his front legs forward, hold his head high, and blink dreamily into the flames. Sometimes he remembered Judge Miller's large house in the sunny Santa Clara Valley. He saw the cement swimming pool, Ysabel the Mexican hairless, and Toots the Japanese pug.
        - id: ch01-b32
          speaker: narrator
          text: >-
            More often, he remembered the man in the red sweater, Curly's death, his great fight with Spitz, and food he had eaten or hoped to eat. He did not long for home. The warm Southland seemed faint and far away, and those memories had little hold on him. Something older was much stronger. Memories inherited from his ancestors made things he had never seen feel familiar. They had become instincts and habits long ago. Those ancient ways had faded in later generations, but now they were waking and coming alive in Buck.
        - id: ch01-b33
          speaker: narrator
          text: >-
            At times, as he watched the flames, they seemed to belong to a different fire. Beside that other fire crouched a man unlike the half-breed cook. His legs were shorter, his arms were longer, and his muscles were tight and knotted instead of round. Long, tangled hair covered his head, which sloped backward above the eyes. He made strange sounds and kept staring fearfully into the darkness.
        - id: ch01-b34
          speaker: narrator
          text: >-
            One hand hung halfway between the man's knee and foot, gripping a stick with a heavy stone tied to it. He was almost naked. A torn, fire-scorched skin hung partway down his back. Much of his body was hairy, and across his chest and shoulders and down the outer sides of his arms and thighs, that hair grew almost as thick as fur. He never stood fully straight. His body leaned forward from the hips above bent knees. Every movement had a strange spring to it. He was almost catlike in his quickness, always alert to dangers he could see and dangers he could not.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Sometimes the hairy man slept by the fire with his head between his legs. He rested his elbows on his knees and clasped his hands above his head, as though his hairy arms could turn away the rain. Beyond the fire, in the circling dark, Buck saw pairs of glowing coals. Always two by two. He knew they were the eyes of great hunting beasts. He heard bodies crashing through the brush and heard their cries in the night.
        - id: ch01-b36
          speaker: narrator
          text: >-
            As Buck dreamed beside the Yukon, those sights and sounds from another world made the hair rise across his back, shoulders, and neck. He gave a low whimper or a soft growl.
        - id: ch01-b37
          speaker: scotch_half_breed
          text: "Hey, Buck! Wake up!"
        - id: ch01-b38
          speaker: narrator
          text: >-
            The vanished world disappeared. The real world returned to Buck's eyes, and he stood, yawned, and stretched as though waking from sleep.
        - id: ch01-b39
          speaker: narrator
          text: >-
            The mail journey was hard, and the heavy labor wore the dogs down. When they reached Dawson, they were thin and in poor condition. They needed at least a week of rest, perhaps ten days. Instead, only two days later they left the Barracks and went down the Yukon bank again, carrying letters to the outside world. The dogs were exhausted, the drivers complained, and fresh snow fell every day. The new snow kept the trail soft. It created more friction beneath the sled runners and made every load harder for the dogs to pull.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Still, the drivers treated the dogs fairly and did everything they could for them. At night, the dogs always came first. They ate before the men ate. No driver climbed into his sleeping robe until he had cared for every foot on his team.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Even with that care, the dogs grew weaker. Since winter began, they had traveled eighteen hundred miles with sleds behind them. Eighteen hundred weary miles could wear down even the toughest life. Buck held on. Though he too was very tired, he kept the others working and maintained order. Billee whimpered and cried in his sleep every night. Joe became more bitter than ever. Sol-leks wanted no one near him, whether on his blind side or his good one.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Dave suffered most. Something inside him had gone wrong. He became darker in temper and easily angered. The instant camp was ready, he made his nest, and his driver fed him there. Once the harness came off and Dave lay down, he did not rise again until it was time to harness up the next morning.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Sometimes a sudden stop jerked his traces, or the team strained to start the sled, and Dave cried out in pain. His driver examined him but found nothing. All the drivers became concerned. They discussed him over meals and during their final pipes at night. One evening, they brought Dave from his nest to the fire and held a consultation. They pressed and felt his body until he cried out again and again. Something was wrong inside him, but there were no broken bones, and no one could discover the cause.
        - id: ch01-b44
          speaker: narrator
          text: >-
            By Cassiar Bar, Dave was so weak that he kept falling in the traces. The Scotch half-breed stopped the train and removed him from the team. He fastened Sol-leks directly to the sled and meant to let Dave rest by running free behind it.
        - id: ch01-b45
          speaker: narrator
          text: >-
            But sick as Dave was, he hated being taken out. He grunted and growled as the man unfastened his traces. When he saw Sol-leks standing in the place where he had served for so long, he whimpered as if his heart were breaking. The pride of the harness and the trail was Dave's whole pride. Though he was sick unto death, he could not bear to watch another dog do his work.
        - id: ch01-b46
          speaker: narrator
          text: >-
            The sled started. Dave plunged through the soft snow beside the packed trail. He snapped at Sol-leks, rushed against him, and tried to push him into the deep snow on the other side. Dave struggled to leap between Sol-leks and the sled and get inside the traces, crying all the while from grief and pain.
        - id: ch01-b47
          speaker: narrator
          text: >-
            The half-breed drove at him with the whip. Dave ignored its sting, and the man did not have the heart to strike harder. Dave could have followed easily on the firm trail behind the sled, but he refused. He kept fighting through the difficult snow beside it until he had no strength left. Then he fell where he was and howled mournfully while the long line of sleds ground past.
        - id: ch01-b48
          speaker: narrator
          text: >-
            With his last strength, Dave staggered after them. When the train stopped again, he struggled past sled after sled until he reached his own. There he stood beside Sol-leks. His driver paused to light his pipe from the man behind. Then he returned and ordered his dogs forward.
        - id: ch01-b49
          speaker: narrator
          text: >-
            The team stepped onto the trail with almost no effort. Then the dogs turned their heads uneasily and stopped in surprise. The driver was surprised too. The sled had not moved. He called the other men to look. Dave had bitten through both of Sol-leks's traces. Now he stood directly before the sled, back in his rightful place.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Dave pleaded with his eyes to stay there. His driver did not know what to do. The other men remembered dogs whose hearts had broken when age or injury forced them out of the traces. They said that because Dave was dying anyway, the merciful thing was to let him die at his work, content and at peace.
        - id: ch01-b51
          speaker: narrator
          text: >-
            So they harnessed Dave again. Proudly, he pulled as he had before, though the pain inside him sometimes forced out a cry. He fell several times and was dragged by the traces. Once, the sled ran over him, and afterward he limped on one hind leg.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Dave lasted until they reached camp. His driver prepared a place for him beside the fire. By morning, he was too weak to travel. When harnessing began, Dave tried to crawl toward his driver. With terrible effort, he rose, staggered, and fell. Then he dragged himself slowly toward the place where his teammates were being harnessed.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Dave reached forward with his front legs and pulled his body after them. Then he reached forward again and dragged himself a few more inches. At last his strength failed. His teammates saw him lying in the snow, gasping and yearning toward them. As they traveled away, they heard his mournful howl until a belt of trees beside the river hid the camp from view.
        - id: ch01-b54
          speaker: narrator
          text: >-
            The train stopped. The Scotch half-breed slowly walked back toward the camp they had left. Every man fell silent. A revolver shot rang out. The half-breed returned quickly. Whips cracked, bells gave their cheerful jingle, and the sleds ground on along the trail.
        - id: ch01-b55
          speaker: narrator
          text: >-
            But Buck knew, and every dog knew, what had happened behind the belt of river trees.
