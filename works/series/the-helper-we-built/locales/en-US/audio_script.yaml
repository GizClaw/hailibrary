    "chapters": [
      {
        "id": "ch01",
        "title": "The First Sort",
        "blocks": [
          {
            "id": "ch01-b01",
            "speaker": "narrator",
            "text": "Helper made its first correct sort at 7:43 on a Saturday morning. Its claw closed around an empty yogurt cup, rotated, and dropped the cup into the blue recycling bin. The plastic struck the rim with a neat pop. Sparrows lifted from the fence.\n\nDev jumped and banged his head on the workshop’s solar awning. "
          },
          {
            "id": "ch01-b02",
            "speaker": "maker-a",
            "text": "Yes!",
            "emotion": "happy"
          },
          {
            "id": "ch01-b03",
            "speaker": "narrator",
            "text": "Nora stayed crouched beside the wheels. She checked that no cable had snagged, then pressed the emergency stop. Helper lowered its claw and went dark."
          },
          {
            "id": "ch01-b04",
            "speaker": "maker-a",
            "text": "Every time it works, you turn it off,"
          },
          {
            "id": "ch01-b05",
            "speaker": "narrator",
            "text": " Dev said."
          },
          {
            "id": "ch01-b06",
            "speaker": "maker-b",
            "text": "Turning off has to work too."
          },
          {
            "id": "ch01-b07",
            "speaker": "narrator",
            "text": "They had spent most of summer building the waist-high robot from a retired delivery cart, a camera, and the jointed arm of an old desk lamp. Helper could not talk or understand speech. Its camera compared shape, material, and stains with images the two friends had labeled. If an object resembled recyclables, compost, or trash, it carried the object toward the matching bin. If it was uncertain, it was supposed to stop, flash amber, and wait.\n\nMr. Lewis, who maintained their apartment courtyard, inspected the cup. Each morning he had to reopen bags and correct careless sorting by hand."
          },
          {
            "id": "ch01-b08",
            "speaker": "caretaker",
            "text": "What if the cup isn’t empty?"
          },
          {
            "id": "ch01-b09",
            "speaker": "narrator",
            "text": " he asked.\n\nDev offered half a cup of juice. Helper lifted it, blinked twice, and turned amber."
          },
          {
            "id": "ch01-b10",
            "speaker": "maker-b",
            "text": "It asks a person,"
          },
          {
            "id": "ch01-b11",
            "speaker": "narrator",
            "text": " Nora said."
          },
          {
            "id": "ch01-b12",
            "speaker": "caretaker",
            "text": "Quietly,"
          },
          {
            "id": "ch01-b13",
            "speaker": "narrator",
            "text": " Mr. Lewis observed."
          },
          {
            "id": "ch01-b14",
            "speaker": "maker-b",
            "text": "It waits for a person,"
          },
          {
            "id": "ch01-b15",
            "speaker": "narrator",
            "text": " she corrected.\n\nMr. Lewis pointed to a dented cookie tin beside the workshop door. Clear tape crossed its peeling lid. "
          },
          {
            "id": "ch01-b16",
            "speaker": "caretaker",
            "text": "What about that?"
          },
          {
            "id": "ch01-b17",
            "speaker": "maker-a",
            "text": "Metal,"
          },
          {
            "id": "ch01-b18",
            "speaker": "narrator",
            "text": " Dev said."
          },
          {
            "id": "ch01-b19",
            "speaker": "maker-b",
            "text": "Not until we know what is inside,"
          },
          {
            "id": "ch01-b20",
            "speaker": "narrator",
            "text": " Nora said at the same time.\n\nMr. Lewis lifted the lid. Screws, washers, and hooks stood in slots he had cut into cardboard. "
          },
          {
            "id": "ch01-b21",
            "speaker": "caretaker",
            "text": "You can teach the machine which bin an object belongs in. Who teaches it whether the object belongs to the bin at all?"
          },
          {
            "id": "ch01-b22",
            "speaker": "narrator",
            "text": "Dev thought the answer was obvious. Helper would patrol only near the sorting station. Nobody would leave anything important there. Before he could say so, his phone chimed with Monday’s showcase schedule: efficiency, reliability, community value. He showed Nora. Mr. Lewis closed his tin, and the question remained unanswered."
          }
        ]
      },
      {
        "id": "ch02",
        "title": "Twenty Seconds",
        "blocks": [
          {
            "id": "ch02-b01",
            "speaker": "narrator",
            "text": "On its first public trial, Helper crawled along a painted line near the bins. It gathered bottles and cans. It rescued a newspaper from a puddle. Then it met a greasy takeout box and waited for two full minutes.\n\nNeighbors applauded when Mr. Lewis finally removed the box. Dev only saw the robot standing still. The invitation for Monday’s youth design showcase was open on his phone: EFFICIENCY. RELIABILITY. COMMUNITY VALUE. Two minutes felt enormous.\n\nThat afternoon he shortened the waiting time to twenty seconds and lowered the confidence setting.\n\nNora saw the numbers. "
          },
          {
            "id": "ch02-b02",
            "speaker": "maker-b",
            "text": "What did you change?"
          },
          {
            "id": "ch02-b03",
            "speaker": "maker-a",
            "text": "It won’t freeze over every dirty piece of paper."
          },
          {
            "id": "ch02-b04",
            "speaker": "maker-b",
            "text": "What happens when it isn’t sure?"
          },
          {
            "id": "ch02-b05",
            "speaker": "maker-a",
            "text": "It uses the closest match. People guess too."
          },
          {
            "id": "ch02-b06",
            "speaker": "maker-b",
            "text": "Put it back. Tomorrow we can test—"
          },
          {
            "id": "ch02-b07",
            "speaker": "maker-a",
            "text": "The showcase is Monday."
          },
          {
            "id": "ch02-b08",
            "speaker": "narrator",
            "text": " He shut the laptop. "
          },
          {
            "id": "ch02-b09",
            "speaker": "maker-a",
            "text": "I’ll watch it."
          },
          {
            "id": "ch02-b10",
            "speaker": "narrator",
            "text": "Nora kept one hand on the screen. Restoring the old setting would take two clicks. The robot also held her soldered wires, tuned camera, and most of her summer. When Dev said showcase, it sounded like a door they had both waited months to open."
          },
          {
            "id": "ch02-b11",
            "speaker": "maker-b",
            "text": "The remote stays in your pocket,"
          },
          {
            "id": "ch02-b12",
            "speaker": "narrator",
            "text": " she said. "
          },
          {
            "id": "ch02-b13",
            "speaker": "maker-b",
            "text": "It stops below half a battery. It stops when the courtyard gets crowded."
          },
          {
            "id": "ch02-b14",
            "speaker": "maker-a",
            "text": "Agreed."
          },
          {
            "id": "ch02-b15",
            "speaker": "narrator",
            "text": " Dev held up his palm.\n\nNora did not high-five him. She wrote TWENTY SECONDS in their notebook and pressed hard enough to puncture the page.\n\nOn Sunday, Helper moved quickly. It pulled a crushed can from beneath a bench and steered around two children playing tag. Near the garden it picked up a broken umbrella.\n\nMrs. Patel hurried from her repair table and grabbed the handle. "
          },
          {
            "id": "ch02-b16",
            "speaker": "repairer",
            "text": "Let go!",
            "emotion": "angry"
          },
          {
            "id": "ch02-b17",
            "speaker": "narrator",
            "text": "The motor kept turning. Nora hit the stop button. The claw opened.\n\nMrs. Patel hugged the muddy umbrella to her chest. "
          },
          {
            "id": "ch02-b18",
            "speaker": "repairer",
            "text": "I’m saving the ribs. Who told your machine I was finished with it?"
          },
          {
            "id": "ch02-b19",
            "speaker": "maker-a",
            "text": "It looked—"
          },
          {
            "id": "ch02-b20",
            "speaker": "narrator",
            "text": " Dev began."
          },
          {
            "id": "ch02-b21",
            "speaker": "repairer",
            "text": "It looked to whom?"
          },
          {
            "id": "ch02-b22",
            "speaker": "narrator",
            "text": "The umbrella fabric was going to become tails for kites at the children’s club. Dev apologized and carried it back. Then he added a rule: pick up only objects lying on the ground.\n\nNora tapped the screen. "
          },
          {
            "id": "ch02-b23",
            "speaker": "maker-b",
            "text": "The umbrella was on the ground."
          },
          {
            "id": "ch02-b24",
            "speaker": "maker-a",
            "text": "Then objects more than six feet from a person."
          },
          {
            "id": "ch02-b25",
            "speaker": "maker-b",
            "text": "If I stand six feet from my backpack, is it trash?"
          },
          {
            "id": "ch02-b26",
            "speaker": "maker-a",
            "text": "There has to be a number."
          },
          {
            "id": "ch02-b27",
            "speaker": "narrator",
            "text": " Dev glanced at the clock. "
          },
          {
            "id": "ch02-b28",
            "speaker": "maker-a",
            "text": "I’ll have the remote. One mistake, and I stop it."
          },
          {
            "id": "ch02-b29",
            "speaker": "narrator",
            "text": "Nora looked at her fingerprint on the stop button. Helper was not the only thing that should have stopped."
          }
        ]
      },
      {
        "id": "ch03",
        "title": "Wind Behind the Screen",
        "blocks": [
          {
            "id": "ch03-b01",
            "speaker": "narrator",
            "text": "That evening, neighbors set up chairs for a courtyard movie. Before the screen came on, wind skated between the buildings. A picture of ringed planets flew from a little boy’s lap and tumbled across the pavement. Helper pursued it. The sheet slid seven feet from the nearest chair.\n\nThe claw closed."
          },
          {
            "id": "ch03-b02",
            "speaker": "child",
            "text": "Mine!",
            "emotion": "fearful"
          },
          {
            "id": "ch03-b03",
            "speaker": "narrator",
            "text": " the boy shouted.\n\nDev saw the flash of yellow paper through the crowd. He reached for the remote. His pocket was empty. He had left it charging in the workshop.\n\nHelper dropped the picture into the paper bin. The boy leaned over the rim but could not reach it. A gust snatched a small embroidered blanket from another chair. Helper turned toward it, green light blinking."
          },
          {
            "id": "ch03-b04",
            "speaker": "maker-b",
            "text": "Emergency cutoff!",
            "emotion": "fearful"
          },
          {
            "id": "ch03-b05",
            "speaker": "narrator",
            "text": " Nora shouted.\n\nShe ran from the far side of the screen. Dev climbed over two rows of chairs and crushed somebody’s popcorn. Helper caught one corner of the blanket and dragged. Its owner held the other end. The motor whined.\n\nDev reached the robot, opened the rear emergency flap, and pulled the insulated cutoff handle built for that purpose. The wheels stopped, but the claw remained locked. He and Nora loosened the joint with a wrench while the movie audience stood in a silent half circle.\n\nThey recovered the planet picture. Spilled lemonade had soaked one corner, turning blue Saturn into a cloud. The boy took it without looking at them. The blanket carried a black wheel mark. From the bins they also retrieved a case containing someone’s dentures, cat food Mrs. Patel had set down, and Mr. Lewis’s box of screws.\n\nDev held the oily box. "
          },
          {
            "id": "ch03-b06",
            "speaker": "maker-a",
            "text": "I’ll replace everything."
          },
          {
            "id": "ch03-b07",
            "speaker": "caretaker",
            "text": "Return what can be returned first,"
          },
          {
            "id": "ch03-b08",
            "speaker": "narrator",
            "text": " Mr. Lewis said.\n\nNora pulled the test notebook from Helper. Wind opened it to the punctured page. "
          },
          {
            "id": "ch03-b09",
            "speaker": "maker-b",
            "text": "Dev changed the setting,"
          },
          {
            "id": "ch03-b10",
            "speaker": "narrator",
            "text": " she said. "
          },
          {
            "id": "ch03-b11",
            "speaker": "maker-b",
            "text": "But I saw it. I didn’t restore it, and I didn’t end the trial. Half of this belongs to me."
          },
          {
            "id": "ch03-b12",
            "speaker": "narrator",
            "text": "Dev had prepared an explanation about the wind, the missing remote, and a rule that had worked all morning. None of it answered what had happened. He deleted the showcase invitation.\n\nThe movie never started. Neighbors separated belongings from waste while Dev and Nora pushed the powerless robot home. Popcorn stuck to one wheel. Each turn made a soft tap."
          }
        ]
      },
      {
        "id": "ch04",
        "title": "What Could Not Be Returned",
        "blocks": [
          {
            "id": "ch04-b01",
            "speaker": "narrator",
            "text": "They canceled Monday’s showcase. Dev knocked on doors, apologized, washed the blanket, and bought new screws and cat food. The planet picture could not be restored. He sat on the little boy’s floor with fresh paper and paints. The boy painted the new Saturn himself. He allowed Dev to operate a hair dryer on its lowest setting."
          },
          {
            "id": "ch04-b02",
            "speaker": "child",
            "text": "That isn’t the same blue,"
          },
          {
            "id": "ch04-b03",
            "speaker": "narrator",
            "text": " the boy, Milo, said when Dev reached for a brush."
          },
          {
            "id": "ch04-b04",
            "speaker": "maker-a",
            "text": "Show me how to mix it."
          },
          {
            "id": "ch04-b05",
            "speaker": "narrator",
            "text": "Milo pulled the paper away. "
          },
          {
            "id": "ch04-b06",
            "speaker": "child",
            "text": "Don’t touch.",
            "emotion": "angry"
          },
          {
            "id": "ch04-b07",
            "speaker": "narrator",
            "text": "Dev folded his hands between his knees. Milo mixed two blues and water. The new rings were less even than the old ones, and a four-leaf planet appeared near the edge. Dev held the dryer high so its air would not push the paint. His arm began to ache."
          },
          {
            "id": "ch04-b08",
            "speaker": "maker-a",
            "text": "What about the ruined one?"
          },
          {
            "id": "ch04-b09",
            "speaker": "narrator",
            "text": " he asked."
          },
          {
            "id": "ch04-b10",
            "speaker": "child",
            "text": "I’m keeping it."
          },
          {
            "id": "ch04-b11",
            "speaker": "narrator",
            "text": "A replacement could repay the price without returning what had been lost. For the first time, Dev understood that repairing harm was not the same as producing a newer, more impressive version.\n\nMeanwhile, Nora printed every decision in Helper’s log. The camera had not malfunctioned. The robot had followed their rule exactly: if an object lay far from a person, resembled waste, and received no human answer in twenty seconds, remove it. But lying on the ground was not the same as being thrown away. Neither were dirty, broken, or old.\n\nWhen Dev returned, Nora had written one question across the whiteboard: WHO DECIDES?"
          },
          {
            "id": "ch04-b12",
            "speaker": "maker-a",
            "text": "A person,"
          },
          {
            "id": "ch04-b13",
            "speaker": "narrator",
            "text": " Dev said."
          },
          {
            "id": "ch04-b14",
            "speaker": "maker-b",
            "text": "Which person?"
          },
          {
            "id": "ch04-b15",
            "speaker": "narrator",
            "text": "He looked through the open workshop door. Residents crossed the courtyard carrying groceries, laundry, toys, tools. They should not have to label everything they owned for the benefit of his robot. They should not have to prove that a battered object mattered."
          },
          {
            "id": "ch04-b16",
            "speaker": "maker-a",
            "text": "The owner,"
          },
          {
            "id": "ch04-b17",
            "speaker": "narrator",
            "text": " Dev said. "
          },
          {
            "id": "ch04-b18",
            "speaker": "maker-a",
            "text": "If Helper doesn’t know who the owner is, it doesn’t get to move the object."
          },
          {
            "id": "ch04-b19",
            "speaker": "narrator",
            "text": "Nora erased the old flowchart but left the question. "
          },
          {
            "id": "ch04-b20",
            "speaker": "maker-b",
            "text": "Then what can it help with?"
          },
          {
            "id": "ch04-b21",
            "speaker": "narrator",
            "text": "This time Dev did not answer at once. They watched Mr. Lewis at the sorting station. Residents brought objects they had already chosen to discard. He checked whether containers were empty, pointed toward bins, and lifted the heavy lids again and again. Searching the courtyard was not the exhausting part. Bending, identifying, and opening were.\n\nDev slid an empty bottle toward Helper. "
          },
          {
            "id": "ch04-b22",
            "speaker": "maker-a",
            "text": "It can suggest. It can’t throw anything away."
          }
        ]
      },
      {
        "id": "ch05",
        "title": "Learning to Stop",
        "blocks": [
          {
            "id": "ch05-b01",
            "speaker": "narrator",
            "text": "They removed autonomous collection completely. Helper would remain inside the sorting station. A resident had to place an item on a tray and press a button. The robot could suggest a bin, but it could not drop anything. An uncertain result stayed amber. Even a confident green result waited for human hands. Mr. Lewis received a physical key that cut power to the motors.\n\nNora wired the key on a separate circuit, so it worked even if the computer failed. Dev disconnected the computer and tested it twelve times. Mrs. Patel watched as they used a padded test block to resist the tray, making sure the motor released instead of pushing harder.\n\nRebuilding took three weeks. Each time Dev tried to make Helper smarter, the test table defeated him: a muddy toy truck, an empty lunch container going home, headphones with a broken wire waiting to be repaired. Every object looked disposable. Every object had an owner ready to take it back.\n\nNora’s checklist now began with: HAS THE OWNER OFFERED THIS OBJECT? If the answer was no, the test did not begin. One afternoon Dev reached over to skip the box.\n\nNora closed the notebook. "
          },
          {
            "id": "ch05-b02",
            "speaker": "maker-b",
            "text": "Explain why a rule should change. Don’t change it while I’m buying connectors."
          },
          {
            "id": "ch05-b03",
            "speaker": "narrator",
            "text": "His ears warmed. "
          },
          {
            "id": "ch05-b04",
            "speaker": "maker-a",
            "text": "I know."
          },
          {
            "id": "ch05-b05",
            "speaker": "maker-b",
            "text": "And I can’t notice trouble and only write it down."
          },
          {
            "id": "ch05-b06",
            "speaker": "narrator",
            "text": " She pushed the stop button between them. "
          },
          {
            "id": "ch05-b07",
            "speaker": "maker-b",
            "text": "Either of us can stop a test."
          },
          {
            "id": "ch05-b08",
            "speaker": "narrator",
            "text": "They did not enter another showcase. Before reopening, they invited neighbors to test the station. Milo brought a paint box. Mrs. Patel brought an umbrella frame. Mr. Lewis brought a clean yogurt cup. Each person offered an object first and made the final choice.\n\nThere was no applause on the first day. Someone complained about pressing an extra button. Helper suggested trash for a clear lunch container. Nora saved the error instead of changing the settings merely to make more green lights appear.\n\nOn the third day, Mr. Lewis counted forty-two bin lids he had not lifted. He removed his gloves and flexed his fingers. "
          },
          {
            "id": "ch05-b09",
            "speaker": "caretaker",
            "text": "Now that is help."
          },
          {
            "id": "ch05-b10",
            "speaker": "narrator",
            "text": "Later that day, Mrs. Patel arrived with a bag of empty bottles. She placed them on the tray one at a time. Helper gave six green lights. Her seventh item was the frame of an umbrella.\n\nThe camera blinked. Amber."
          },
          {
            "id": "ch05-b11",
            "speaker": "repairer",
            "text": "Finally learned to hesitate,"
          },
          {
            "id": "ch05-b12",
            "speaker": "narrator",
            "text": " she said.\n\nDev almost said, We’re the ones who learned. It sounded too prepared, so he handed her the umbrella frame instead."
          }
        ]
      },
      {
        "id": "ch06",
        "title": "Blue Saturn",
        "blocks": [
          {
            "id": "ch06-b01",
            "speaker": "narrator",
            "text": "Near sunset, wind moved through the courtyard again. A drawing of a blue Saturn slipped from a bench and landed beside Helper’s wheel. The robot did nothing.\n\nThe boy ran over and picked up his picture. He checked the corners. Then he placed an empty paint box on the sorting tray and pressed the button.\n\nHelper turned amber.\n\nAfter thinking, the boy snapped off the lid and tucked it into his pocket. He pushed the box into recycling himself. Helper’s claw hung still while its amber light shone in the evening air."
          }
        ]
      }
    ]
  }
}
