    "chapters": [
      {
        "id": "ch01",
        "title": "七点四十三分",
        "blocks": [
          {
            "id": "ch01-b01",
            "speaker": "narrator",
            "text": "周六早上七点四十三分，小丁第一次伸出了夹爪。它夹住一只空酸奶杯，转过半圈，稳稳投进蓝色回收箱。杯底磕在箱沿上，啪！院子里的几只麻雀一下全飞上了晾衣绳。\n\n周屿高兴得跳起来，后脑勺却撞上了工作棚的太阳能板。"
          },
          {
            "id": "ch01-b02",
            "speaker": "maker-a",
            "text": "成了！",
            "emotion": "happy"
          },
          {
            "id": "ch01-b03",
            "speaker": "narrator",
            "text": "许安没有跳。她蹲下来检查轮子，又把红色急停按钮按了一遍。小丁立刻垂下夹爪，胸前的绿灯灭了。"
          },
          {
            "id": "ch01-b04",
            "speaker": "maker-a",
            "text": "怎么每次一成功，你就先把它关掉？"
          },
          {
            "id": "ch01-b05",
            "speaker": "narrator",
            "text": "周屿揉着脑袋。"
          },
          {
            "id": "ch01-b06",
            "speaker": "maker-b",
            "text": "因为关掉它，也得每次都成功。"
          },
          {
            "id": "ch01-b07",
            "speaker": "narrator",
            "text": "为了造小丁，两个人忙了整整一个暑假。底盘是坏掉的送货车，夹爪是旧台灯支架改的。摄像头、重量传感器和停止程序，都是许安负责。\n\n小丁不会说话，也听不懂人话。它只能用摄像头看形状、表面和脏不脏，再用重量传感器判断杯子里还有没有东西。然后，它拿这些信息去对照两个人标过的照片，算一算眼前的东西更像可回收物、厨余，还是其他垃圾。要是拿不准，它本来应该停下来，亮起黄灯，等人处理。\n\n社区广场的分类箱经常被塞错。物业的梁叔每天都得戴上厚手套，再翻一遍。周屿想让小丁接下这件又脏又累的活。他也想让星期一来参观的社区评审看看，十四岁的孩子可不只会拼模型。\n\n这时，梁叔指了指门口那只掉漆的铁皮饼干盒。"
          },
          {
            "id": "ch01-b08",
            "speaker": "caretaker",
            "text": "那个算什么？"
          },
          {
            "id": "ch01-b09",
            "speaker": "narrator",
            "text": "盒盖凹了一角，表面粘着透明胶。周屿说当然算金属，许安说没洗干净之前哪一类都不算。梁叔打开盒盖，里面一排螺丝按长短插在纸板上。"
          },
          {
            "id": "ch01-b10",
            "speaker": "caretaker",
            "text": "东西该进哪个箱子，你们能教它。"
          },
          {
            "id": "ch01-b11",
            "speaker": "narrator",
            "text": "他合上盒盖，"
          },
          {
            "id": "ch01-b12",
            "speaker": "caretaker",
            "text": "可这东西到底还要不要，谁来教它？"
          },
          {
            "id": "ch01-b13",
            "speaker": "narrator",
            "text": "周屿觉得，这有什么难的？小丁只捡分类箱附近、掉在地上的东西。谁会把要紧的东西扔在那儿呢？\n\n他正想回答，手机响了。评审流程下面列着三个词：效率、可靠性、公共价值。周屿赶紧把屏幕转给许安看。梁叔刚才的问题，就这么被留在了嗡嗡转动的散热扇旁边。"
          }
        ]
      },
      {
        "id": "ch02",
        "title": "二十秒",
        "blocks": [
          {
            "id": "ch02-b01",
            "speaker": "narrator",
            "text": "试运行第一天，小丁沿着广场边的白线慢慢往前走。塑料瓶、饮料罐，还有被风吹散的广告纸，它都捡了。可碰上一只沾着酱汁的纸盒，它足足停了两分钟。几个孩子都开始学它，站在那儿一动不动。最后梁叔拿走纸盒，人群笑着鼓起了掌。\n\n可周屿只看见一件事：小丁停住了。短短两分钟，他看了六次手机。评审表上的“效率”，在他眼里就像一道被红笔圈出来的错题。\n\n下午，许安去买备用插头。周屿把等待时间从两分钟改成二十秒，又把“不确定就停止”，改成了“不确定就选最接近的一类”。他对自己说，人也会猜，小丁只是猜得快一点。再说，他会拿着遥控器，一直跟在旁边。\n\n许安一回来，就看见了那个新数字。"
          },
          {
            "id": "ch02-b02",
            "speaker": "maker-b",
            "text": "你改了什么？"
          },
          {
            "id": "ch02-b03",
            "speaker": "maker-a",
            "text": "让它别遇见一张脏纸就发呆。"
          },
          {
            "id": "ch02-b04",
            "speaker": "maker-b",
            "text": "拿不准怎么办？"
          },
          {
            "id": "ch02-b05",
            "speaker": "maker-a",
            "text": "放到最接近的箱子。二十秒够我看见了。"
          },
          {
            "id": "ch02-b06",
            "speaker": "maker-b",
            "text": "先恢复。我们明天拿各种东西测。"
          },
          {
            "id": "ch02-b07",
            "speaker": "narrator",
            "text": "周屿扣下屏幕。"
          },
          {
            "id": "ch02-b08",
            "speaker": "maker-a",
            "text": "来不及了，后天评审就来。我会一直盯着它。"
          },
          {
            "id": "ch02-b09",
            "speaker": "narrator",
            "text": "许安的手还按在电脑边上。旧设置点两下就能恢复。可这台机器人里，有她亲手焊的线路，也有她熬夜调好的摄像头。周屿一说“评审”，听起来就像那扇等了一整个暑假的门，终于要响了。"
          },
          {
            "id": "ch02-b10",
            "speaker": "maker-b",
            "text": "遥控器必须在你身上，"
          },
          {
            "id": "ch02-b11",
            "speaker": "narrator",
            "text": "她终于说，"
          },
          {
            "id": "ch02-b12",
            "speaker": "maker-b",
            "text": "电量低于一半就停，人多也停。"
          },
          {
            "id": "ch02-b13",
            "speaker": "maker-a",
            "text": "成交。"
          },
          {
            "id": "ch02-b14",
            "speaker": "narrator",
            "text": "周屿伸出手，等着击掌。\n\n许安却没抬手。她只在测试本上写下“二十秒”，笔尖用力得把纸戳出一个小洞。\n\n第二天，小丁果然快多了。它绕开奔跑的孩子，又从长椅底下拖出易拉罐。周屿举着手机拍视频，镜头里，绿灯亮了一次又一次。\n\n花坛边躺着一把断伞。小丁把摄像头转向沾满泥的伞面。绿灯亮了，夹爪一下扣住伞柄。\n\n修伞的赵奶奶从小摊后面追出来，一把抓住伞的另一头。"
          },
          {
            "id": "ch02-b15",
            "speaker": "repairer",
            "text": "放手！",
            "emotion": "angry"
          },
          {
            "id": "ch02-b16",
            "speaker": "narrator",
            "text": "电机仍在转。许安冲过去拍下急停，夹爪松开。\n\n赵奶奶把断伞抱在怀里。"
          },
          {
            "id": "ch02-b17",
            "speaker": "repairer",
            "text": "伞骨还能拆呢。楼上的孩子要做风筝，正缺尾巴。谁说我不要这把伞了？",
            "emotion": "angry"
          },
          {
            "id": "ch02-b18",
            "speaker": "maker-a",
            "text": "它以为——"
          },
          {
            "id": "ch02-b19",
            "speaker": "narrator",
            "text": "周屿指着伞面的泥。"
          },
          {
            "id": "ch02-b20",
            "speaker": "repairer",
            "text": "到底是它以为，还是你以为？",
            "emotion": "angry"
          },
          {
            "id": "ch02-b21",
            "speaker": "narrator",
            "text": "周屿把伞送回摊子，又给程序加上：只捡掉在地上的东西。"
          },
          {
            "id": "ch02-b22",
            "speaker": "maker-b",
            "text": "刚才的伞就在地上。"
          },
          {
            "id": "ch02-b23",
            "speaker": "narrator",
            "text": "许安说。"
          },
          {
            "id": "ch02-b24",
            "speaker": "maker-a",
            "text": "那就离人两米以上。"
          },
          {
            "id": "ch02-b25",
            "speaker": "maker-b",
            "text": "东西只要离人两米，就自动变成不要的了？"
          },
          {
            "id": "ch02-b26",
            "speaker": "maker-a",
            "text": "规则总得有个数吧。我就在旁边，再出错，我马上让它停。"
          },
          {
            "id": "ch02-b27",
            "speaker": "narrator",
            "text": "许安看着急停按钮上自己的指印。她知道真正该停的不只是小丁。"
          }
        ]
      },
      {
        "id": "ch03",
        "title": "风从银幕背后起来",
        "blocks": [
          {
            "id": "ch03-b01",
            "speaker": "narrator",
            "text": "傍晚，广场开始放露天电影。人们搬来折叠椅和坐垫。周屿只让小丁在外围巡行。许安检查主电池，又摸了摸周屿外套口袋，遥控器的方角隔着布顶住手指。"
          },
          {
            "id": "ch03-b02",
            "speaker": "maker-b",
            "text": "最后半小时。"
          },
          {
            "id": "ch03-b03",
            "speaker": "narrator",
            "text": "她说。\n\n银幕还没亮，风先从两栋楼之间钻进来。一张画满行星的纸从林豆膝上飞走，贴地滚出三米。小丁追了上去。"
          },
          {
            "id": "ch03-b04",
            "speaker": "child",
            "text": "我的！"
          },
          {
            "id": "ch03-b05",
            "speaker": "narrator",
            "text": "林豆也追上去。\n\n周屿隔着人群看见黄纸一闪。他把手伸进口袋，摸到的却只有备用电池。刚才补电时，他嫌遥控器硌手，把它放在工作棚的充电座上了。\n\n小丁把画投进蓝箱。林豆趴在箱口，手够不到。风又卷走一条绣着名字的薄毯。小丁转向，绿灯闪了一下。"
          },
          {
            "id": "ch03-b06",
            "speaker": "maker-b",
            "text": "拉紧急断电柄！",
            "emotion": "fearful"
          },
          {
            "id": "ch03-b07",
            "speaker": "narrator",
            "text": "许安喊。\n\n周屿翻过两排椅子，踩扁一盒爆米花。小丁夹住薄毯往箱子拖，毯子的主人死死拉住另一头。电机发出吃力的嗡鸣。周屿扑到小丁背后，打开紧急盖板，拉下专门用来断电的绝缘手柄。轮子停了，夹爪却因为断电卡住。\n\n许安托住机械臂，周屿用扳手一点点卸开连接轴。广场上的人围成半圈，没有人鼓掌。\n\n他们从箱里找回林豆的画。纸角被漏水的饮料杯浸湿，蓝色的土星晕成一团。薄毯边缘多了一道油印。箱里还有装着假牙的塑料盒、赵奶奶留给流浪猫的干粮，以及梁叔那只铁皮饼干盒。几颗短螺丝已经滚进箱底的菜汤里。\n\n周屿蹲下去捡，手心全是油。"
          },
          {
            "id": "ch03-b08",
            "speaker": "maker-a",
            "text": "我会赔。我把盒子也换新的。"
          },
          {
            "id": "ch03-b09",
            "speaker": "caretaker",
            "text": "盒子不用换。"
          },
          {
            "id": "ch03-b10",
            "speaker": "narrator",
            "text": "梁叔说，"
          },
          {
            "id": "ch03-b11",
            "speaker": "caretaker",
            "text": "里面那些口子，是我照着自己顺手的位置割的。先把还能还的东西还回去。"
          },
          {
            "id": "ch03-b12",
            "speaker": "narrator",
            "text": "许安拔下测试本。"
          },
          {
            "id": "ch03-b13",
            "speaker": "maker-b",
            "text": "设置是他改的，可我看见了。我没把它改回去，也没让小丁停下来。所以这个后果，也有我的一半。"
          },
          {
            "id": "ch03-b14",
            "speaker": "narrator",
            "text": "周屿原本想好了一堆解释。这一刻，却一句都说不出来了。他删掉了评审邀请。电影最后也没放成。\n\n两个人把断了电的小丁推回棚里。一个轮子上粘着爆米花，每转一圈，就轻轻响一下。"
          }
        ]
      },
      {
        "id": "ch04",
        "title": "还不回去的东西",
        "blocks": [
          {
            "id": "ch04-b01",
            "speaker": "narrator",
            "text": "星期一，他们挨家敲门，道歉，清洗薄毯，重新买了螺丝和猫粮。假牙盒的主人接过消毒好的盒子，只问了一句："
          },
          {
            "id": "ch04-b02",
            "speaker": "owner",
            "text": "下一次，它还会替我做决定吗？"
          },
          {
            "id": "ch04-b03",
            "speaker": "narrator",
            "text": "没有责骂。可这个问题，比责骂还难回答。\n\n林豆的画再也恢复不了了。周屿买来水彩纸和颜料，坐在林豆家的地板上。他刚想照着旧画重画一个土星，林豆就把纸抽走了。"
          },
          {
            "id": "ch04-b04",
            "speaker": "child",
            "text": "不是那样的蓝。"
          },
          {
            "id": "ch04-b05",
            "speaker": "maker-a",
            "text": "那你告诉我怎么调。"
          },
          {
            "id": "ch04-b06",
            "speaker": "child",
            "text": "你别碰。",
            "emotion": "angry"
          },
          {
            "id": "ch04-b07",
            "speaker": "narrator",
            "text": "周屿把手缩回膝盖。林豆自己蘸了两种蓝，又加一点水。新画的光环没有旧画那么圆，右边还多了一颗长着四片叶子的星球。周屿只被允许用吹风机最小档吹干水彩。热风太大会推开颜料，他便举得很远，胳膊酸了也不敢靠近。"
          },
          {
            "id": "ch04-b08",
            "speaker": "maker-a",
            "text": "旧的那张呢？"
          },
          {
            "id": "ch04-b09",
            "speaker": "narrator",
            "text": "他问。"
          },
          {
            "id": "ch04-b10",
            "speaker": "child",
            "text": "留着。"
          },
          {
            "id": "ch04-b11",
            "speaker": "narrator",
            "text": "有些东西，赔一件新的不难。难的是，旧的那一件再也变不回原样。周屿这才第一次明白，承担后果，不只是把价钱补上，也不是赶紧做出一个更厉害的新版本。\n\n许安把小丁做过的每一次判断都打印了出来。摄像头没坏，程序也没有自己乱改。小丁只是老老实实执行了他们定的办法：东西离人超过两米，看起来像废物，二十秒内又没人确认，那就收走。\n\n就是这些条件，把断伞、画、薄毯和螺丝盒，全都变成了“垃圾”。可东西放在地上，不等于被人丢掉。东西脏了、破了、旧了，也不等于它没有主人。\n\n周屿回来时，看见许安在白板上写了四个字：谁能决定？"
          },
          {
            "id": "ch04-b12",
            "speaker": "maker-a",
            "text": "人。"
          },
          {
            "id": "ch04-b13",
            "speaker": "narrator",
            "text": "他说。"
          },
          {
            "id": "ch04-b14",
            "speaker": "maker-b",
            "text": "哪个人？"
          },
          {
            "id": "ch04-b15",
            "speaker": "narrator",
            "text": "周屿望向敞开的棚门。住户们拎着菜、床单、玩具和工具经过。大家不会为了一个机器人，给每件东西贴上还要或不要；也不该向机器证明一只破盒子为什么重要。"
          },
          {
            "id": "ch04-b16",
            "speaker": "maker-a",
            "text": "东西的主人。要是不知道主人是谁，小丁就不能碰。"
          },
          {
            "id": "ch04-b17",
            "speaker": "narrator",
            "text": "他们到分类站看梁叔工作。住户把确定不要的物品拿来，梁叔先看里面是否有剩余物，再指向正确的箱子。最费力的不是寻找垃圾，而是弯腰、辨认和反复打开沉重的箱盖。\n\n周屿把空瓶推到小丁面前。"
          },
          {
            "id": "ch04-b18",
            "speaker": "maker-a",
            "text": "它可以建议，不可以替人扔。"
          }
        ]
      },
      {
        "id": "ch05",
        "title": "学会停下的人",
        "blocks": [
          {
            "id": "ch05-b01",
            "speaker": "narrator",
            "text": "他们先把自动巡行和拾取程序全拆了。以后，小丁只能待在分类站。居民得自己把东西放进托盘，再按一下那个带凸起圆点的按钮。小丁可以判断，也可以把托盘推到它建议的箱子前。拿不准，就亮黄灯。可不管绿灯有多亮，小丁都不能自己把东西扔进去。最后一步，必须由人来做。\n\n许安又接了一条独立的断电线路。梁叔手里有一把真正的钥匙，一转就能切断电机。周屿拔掉控制电脑，亲手试了十二次断电。赵奶奶也守在旁边，看他们用包着软垫的测试块挡住托盘。电机一遇到阻力，必须松开，不能继续使劲。\n\n这一改，就是三周。周屿好几次想让小丁重新“聪明”一点，可测试桌上的东西总能拦住他：沾泥的玩具车，已经空了、却还要带回家的饭盒，断了线、等着修的耳机，还有装着纽扣的旧药盒。每一样看着都像是要扔的，可每一样，也都有人伸手拿回去。\n\n有一天，周屿想跳过一项测试。许安啪地合上了本子。"
          },
          {
            "id": "ch05-b02",
            "speaker": "maker-b",
            "text": "你可以先说清楚为什么要改。可你不能又趁我去买插头，自己偷偷改。"
          },
          {
            "id": "ch05-b03",
            "speaker": "narrator",
            "text": "周屿的耳朵红了。"
          },
          {
            "id": "ch05-b04",
            "speaker": "maker-a",
            "text": "知道了。"
          },
          {
            "id": "ch05-b05",
            "speaker": "maker-b",
            "text": "我也一样。不能明明看见不对，还只是写在纸上。"
          },
          {
            "id": "ch05-b06",
            "speaker": "narrator",
            "text": "她把急停按钮推到两个人中间，"
          },
          {
            "id": "ch05-b07",
            "speaker": "maker-b",
            "text": "以后，不管是谁觉得不对，谁都可以马上叫停。"
          },
          {
            "id": "ch05-b08",
            "speaker": "narrator",
            "text": "重新开放前，他们没有再报名评审。林豆带来颜料盒，赵奶奶带来伞骨，梁叔带来洗净的酸奶杯。每个人都先把东西放进托盘，再决定要不要接受小丁的建议。\n\n第一天没有掌声。有人嫌多按一次按钮麻烦，小丁也把透明餐盒认成其他垃圾。许安留下记录，没有连夜调高绿灯的次数。\n\n第三天，梁叔发现自己少开了四十多次箱盖。他摘下手套，活动手指。"
          },
          {
            "id": "ch05-b09",
            "speaker": "caretaker",
            "text": "这才叫帮忙。"
          },
          {
            "id": "ch05-b10",
            "speaker": "narrator",
            "text": "赵奶奶把六个空水瓶逐个放进托盘，小丁一连亮了六次绿灯。第七件是伞骨。摄像头闪烁，黄灯亮起。"
          },
          {
            "id": "ch05-b11",
            "speaker": "repairer",
            "text": "总算学会犹豫了。"
          },
          {
            "id": "ch05-b12",
            "speaker": "narrator",
            "text": "赵奶奶说。"
          },
          {
            "id": "ch05-b13",
            "speaker": "maker-a",
            "text": "是我们——"
          },
          {
            "id": "ch05-b14",
            "speaker": "narrator",
            "text": "周屿开了口，又觉得后半句太像评审台上的发言。他没有说完，只把伞骨递还给她。"
          }
        ]
      },
      {
        "id": "ch06",
        "title": "蓝色土星",
        "blocks": [
          {
            "id": "ch06-b01",
            "speaker": "narrator",
            "text": "入秋以后，广场又放起了电影。小丁待在分类站的遮棚下面。四个轮子都锁住了，夹爪安安静静地垂着。\n\n林豆把新画夹在硬纸册里，那张湿掉的旧画也在。忽然一阵风掀起旧画。画上的蓝色土星贴着地面，一路滚到小丁轮边。\n\n摄像头转过去，对准了画。可黄灯没亮，绿灯也没亮。因为没人把画放进托盘，也没人按下按钮。小丁一动不动。\n\n林豆跑过来，捡起画，仔细看了看那个晕开的纸角。走过分类站时，他把一只空颜料盒放进托盘，按下圆点按钮。\n\n这一次，小丁亮起黄灯。\n\n林豆想了想，掰下盒盖。盖子上还粘着一小块干透的蓝颜料。他把盒盖留进口袋，只把盒身推进蓝箱。\n\n周屿就站在几步外，没有替他做决定。许安也没有去改那盏不够漂亮的黄灯。晚风吹过分类站，小丁的夹爪还是一动不动。"
          }
        ]
      }
    ]
  }
}
