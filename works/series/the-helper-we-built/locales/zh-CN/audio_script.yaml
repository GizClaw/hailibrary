    "chapters": [
      {
        "id": "ch01",
        "title": "七点四十三分",
        "blocks": [
          {
            "id": "ch01-b01",
            "speaker": "narrator",
            "text": "小丁第一次伸出夹爪，是在周六早上七点四十三分。它夹住一只空酸奶杯，转了半圈，把杯子准确投进蓝色回收箱。杯底磕在箱沿上，啪的一声，院子里几只麻雀同时飞上晾衣绳。\n\n周屿跳起来，后脑勺撞到工作棚的太阳能板。"
          },
          {
            "id": "ch01-b02",
            "speaker": "maker-a",
            "text": "成了！"
          },
          {
            "id": "ch01-b03",
            "speaker": "narrator",
            "text": "许安没有跳。她蹲下来检查轮子，又把红色急停按钮按了一遍。小丁立刻垂下夹爪，胸前的绿灯灭了。"
          },
          {
            "id": "ch01-b04",
            "speaker": "maker-a",
            "text": "你每次成功都先把它关掉。"
          },
          {
            "id": "ch01-b05",
            "speaker": "narrator",
            "text": "周屿揉着脑袋。"
          },
          {
            "id": "ch01-b06",
            "speaker": "maker-b",
            "text": "因为它每次关掉也得成功。"
          },
          {
            "id": "ch01-b07",
            "speaker": "narrator",
            "text": "两个人花了一个暑假造小丁。底盘来自坏掉的送货车，夹爪是周屿用旧台灯支架改的。许安负责摄像头、重量传感器和停止程序。机器人不会说话，也听不懂人话；摄像头只会比较物体的形状、表面和脏污程度，传感器则帮它判断杯里是否还装着东西。它再根据两个人标过的照片，算出物品更像可回收物厨余还是其他垃圾。遇到拿不准的东西，它本该停住，亮起黄灯，等人处理。\n\n社区广场的分类箱常被塞错。物业的梁叔每天要戴着厚手套重新翻一遍。周屿想让小丁替他做这件又脏又累的活，也想让星期一来参观的社区评审看见：十四岁的孩子不只会拼模型。\n\n梁叔指向门口一只掉漆的铁皮饼干盒。"
          },
          {
            "id": "ch01-b08",
            "speaker": "caretaker",
            "text": "那个算什么？"
          },
          {
            "id": "ch01-b09",
            "speaker": "narrator",
            "text": "盒盖凹了一角，表面粘着透明胶。周屿说当然算金属，许安说没洗干净之前哪一类都不算。梁叔打开盒盖，里面一排螺丝按长短插在纸板上。"
          },
          {
            "id": "ch01-b10",
            "speaker": "caretaker",
            "text": "东西属于哪一箱，你们能教它。"
          },
          {
            "id": "ch01-b11",
            "speaker": "narrator",
            "text": "他合上盒盖，"
          },
          {
            "id": "ch01-b12",
            "speaker": "caretaker",
            "text": "东西是不是不要了，谁教？"
          },
          {
            "id": "ch01-b13",
            "speaker": "narrator",
            "text": "周屿觉得这不难。小丁只捡分类箱附近地上的东西，谁会把要紧的东西扔在那里？他正要回答，手机响了。评审流程的标题下面列着三个词：效率、可靠性、公共价值。周屿把屏幕转给许安看，梁叔的问题便留在了嗡嗡转动的散热扇旁。"
          }
        ]
      },
      {
        "id": "ch02",
        "title": "二十秒",
        "blocks": [
          {
            "id": "ch02-b01",
            "speaker": "narrator",
            "text": "试运行第一天，小丁沿广场边的白线缓慢前进。它捡了塑料瓶、饮料罐和被风吹散的广告纸，在一只沾着酱汁的纸盒前停了足足两分钟。几个小孩开始学它一动不动的样子。梁叔把纸盒拿走时，人群笑着鼓了掌。\n\n周屿却只看见小丁停住。两分钟里，他看了六次手机。评审表上的效率像一道红笔圈出的错题。\n\n午后，许安去买备用插头。周屿把等待时间从两分钟改成二十秒，又把不确定就停止改成不确定就选最接近的一类。他告诉自己，人也会猜，小丁不过是猜得快一点；何况他会拿着遥控器，一直跟在旁边。\n\n许安回来时看见新数字。"
          },
          {
            "id": "ch02-b02",
            "speaker": "maker-b",
            "text": "你改了什么？"
          },
          {
            "id": "ch02-b03",
            "speaker": "maker-a",
            "text": "让它别遇见一张脏纸就发呆。"
          },
          {
            "id": "ch02-b04",
            "speaker": "maker-b",
            "text": "拿不准怎么办？"
          },
          {
            "id": "ch02-b05",
            "speaker": "maker-a",
            "text": "放到最接近的箱子。二十秒够我看见了。"
          },
          {
            "id": "ch02-b06",
            "speaker": "maker-b",
            "text": "先恢复。我们明天拿各种东西测。"
          },
          {
            "id": "ch02-b07",
            "speaker": "narrator",
            "text": "周屿扣下屏幕。"
          },
          {
            "id": "ch02-b08",
            "speaker": "maker-a",
            "text": "明天来不及。后天评审就来。我盯着它。"
          },
          {
            "id": "ch02-b09",
            "speaker": "narrator",
            "text": "许安的手还按在电脑边缘。恢复旧设置只需点两下。可这台机器人有她焊的线路、她熬夜调好的摄像头。周屿说评审时，仿佛说的是他们等了一整个暑假的门铃。"
          },
          {
            "id": "ch02-b10",
            "speaker": "maker-b",
            "text": "遥控器必须在你身上，"
          },
          {
            "id": "ch02-b11",
            "speaker": "narrator",
            "text": "她终于说，"
          },
          {
            "id": "ch02-b12",
            "speaker": "maker-b",
            "text": "电量低于一半就停，人多也停。"
          },
          {
            "id": "ch02-b13",
            "speaker": "maker-a",
            "text": "成交。"
          },
          {
            "id": "ch02-b14",
            "speaker": "narrator",
            "text": "周屿伸出手。\n\n许安没有同他击掌。她在测试本上写下二十秒，笔尖把纸戳出一个小洞。\n\n第二天，小丁快多了。它绕开奔跑的孩子，从长椅下拖出易拉罐。周屿举着手机拍视频，镜头里绿灯一次次亮起。\n\n花坛边躺着一把断伞。小丁的摄像头对准泥污的伞面，绿灯亮了，夹爪扣住伞柄。\n\n修伞的赵奶奶从小摊后追来，一把抓住另一头。"
          },
          {
            "id": "ch02-b15",
            "speaker": "repairer",
            "text": "放手！"
          },
          {
            "id": "ch02-b16",
            "speaker": "narrator",
            "text": "电机仍在转。许安冲过去拍下急停，夹爪松开。\n\n赵奶奶把断伞抱在怀里。"
          },
          {
            "id": "ch02-b17",
            "speaker": "repairer",
            "text": "伞骨还能拆。楼上孩子做风筝，正缺尾巴。谁说我不要？"
          },
          {
            "id": "ch02-b18",
            "speaker": "maker-a",
            "text": "它以为——"
          },
          {
            "id": "ch02-b19",
            "speaker": "narrator",
            "text": "周屿指着伞面的泥。"
          },
          {
            "id": "ch02-b20",
            "speaker": "repairer",
            "text": "它以为，还是你以为？"
          },
          {
            "id": "ch02-b21",
            "speaker": "narrator",
            "text": "周屿把伞送回摊子，又给程序加上：只捡掉在地上的东西。"
          },
          {
            "id": "ch02-b22",
            "speaker": "maker-b",
            "text": "刚才的伞就在地上。"
          },
          {
            "id": "ch02-b23",
            "speaker": "narrator",
            "text": "许安说。"
          },
          {
            "id": "ch02-b24",
            "speaker": "maker-a",
            "text": "那就离人两米以上。"
          },
          {
            "id": "ch02-b25",
            "speaker": "maker-b",
            "text": "东西离开人两米，就自动不要了？"
          },
          {
            "id": "ch02-b26",
            "speaker": "maker-a",
            "text": "总得有个数。我就在旁边，再出错我会停。"
          },
          {
            "id": "ch02-b27",
            "speaker": "narrator",
            "text": "许安看着急停按钮上自己的指印。她知道真正该停的不只是小丁。"
          }
        ]
      },
      {
        "id": "ch03",
        "title": "风从银幕背后起来",
        "blocks": [
          {
            "id": "ch03-b01",
            "speaker": "narrator",
            "text": "傍晚，广场开始放露天电影。人们搬来折叠椅和坐垫。周屿只让小丁在外围巡行。许安检查主电池，又摸了摸周屿外套口袋，遥控器的方角隔着布顶住手指。"
          },
          {
            "id": "ch03-b02",
            "speaker": "maker-b",
            "text": "最后半小时。"
          },
          {
            "id": "ch03-b03",
            "speaker": "narrator",
            "text": "她说。\n\n银幕还没亮，风先从两栋楼之间钻进来。一张画满行星的纸从林豆膝上飞走，贴地滚出三米。小丁追了上去。"
          },
          {
            "id": "ch03-b04",
            "speaker": "child",
            "text": "我的！"
          },
          {
            "id": "ch03-b05",
            "speaker": "narrator",
            "text": "林豆也追上去。\n\n周屿隔着人群看见黄纸一闪。他把手伸进口袋，摸到的却只有备用电池。刚才补电时，他嫌遥控器硌手，把它放在工作棚的充电座上了。\n\n小丁把画投进蓝箱。林豆趴在箱口，手够不到。风又卷走一条绣着名字的薄毯。小丁转向，绿灯闪了一下。"
          },
          {
            "id": "ch03-b06",
            "speaker": "maker-b",
            "text": "拉紧急断电柄！"
          },
          {
            "id": "ch03-b07",
            "speaker": "narrator",
            "text": "许安喊。\n\n周屿翻过两排椅子，踩扁一盒爆米花。小丁夹住薄毯往箱子拖，毯子的主人死死拉住另一头。电机发出吃力的嗡鸣。周屿扑到小丁背后，打开紧急盖板，拉下专门用来断电的绝缘手柄。轮子停了，夹爪却因为断电卡住。\n\n许安托住机械臂，周屿用扳手一点点卸开连接轴。广场上的人围成半圈，没有人鼓掌。\n\n他们从箱里找回林豆的画。纸角被漏水的饮料杯浸湿，蓝色的土星晕成一团。薄毯边缘多了一道油印。箱里还有装着假牙的塑料盒、赵奶奶留给流浪猫的干粮，以及梁叔那只铁皮饼干盒。几颗短螺丝已经滚进箱底的菜汤里。\n\n周屿蹲下去捡，手心全是油。"
          },
          {
            "id": "ch03-b08",
            "speaker": "maker-a",
            "text": "我会赔。我把盒子也换新的。"
          },
          {
            "id": "ch03-b09",
            "speaker": "caretaker",
            "text": "盒子不用换，"
          },
          {
            "id": "ch03-b10",
            "speaker": "narrator",
            "text": "梁叔说，"
          },
          {
            "id": "ch03-b11",
            "speaker": "caretaker",
            "text": "里面的口子是我按顺手的位置割的。先把该还的还了。"
          },
          {
            "id": "ch03-b12",
            "speaker": "narrator",
            "text": "许安拔下测试本。"
          },
          {
            "id": "ch03-b13",
            "speaker": "maker-b",
            "text": "设置是他改的，但是我看见了。我没有恢复，也没有让它停。这个后果有我的一半。"
          },
          {
            "id": "ch03-b14",
            "speaker": "narrator",
            "text": "周屿原本准备好的解释忽然都没了。他删掉评审邀请。电影最后没有放。两个人把断电的小丁推回棚里，一个轮子粘着爆米花，转一圈，发出一次轻响。"
          }
        ]
      },
      {
        "id": "ch04",
        "title": "还不回去的东西",
        "blocks": [
          {
            "id": "ch04-b01",
            "speaker": "narrator",
            "text": "星期一，他们挨家敲门，道歉，清洗薄毯，重新买了螺丝和猫粮。假牙盒的主人接过消毒好的盒子，只问了一句："
          },
          {
            "id": "ch04-b02",
            "speaker": "owner",
            "text": "下次它还会替我决定吗？"
          },
          {
            "id": "ch04-b03",
            "speaker": "narrator",
            "text": "那句话比责骂更难回答。\n\n林豆的画没法恢复。周屿买来水彩纸和颜料，坐在林豆家的地板上。他想照着旧画重画一个土星，林豆把纸抽走。"
          },
          {
            "id": "ch04-b04",
            "speaker": "child",
            "text": "不是那样的蓝。"
          },
          {
            "id": "ch04-b05",
            "speaker": "maker-a",
            "text": "那你告诉我怎么调。"
          },
          {
            "id": "ch04-b06",
            "speaker": "child",
            "text": "你别碰。"
          },
          {
            "id": "ch04-b07",
            "speaker": "narrator",
            "text": "周屿把手缩回膝盖。林豆自己蘸了两种蓝，又加一点水。新画的光环没有旧画那么圆，右边还多了一颗长着四片叶子的星球。周屿只被允许用吹风机最小档吹干水彩。热风太大会推开颜料，他便举得很远，胳膊酸了也不敢靠近。"
          },
          {
            "id": "ch04-b08",
            "speaker": "maker-a",
            "text": "旧的那张呢？"
          },
          {
            "id": "ch04-b09",
            "speaker": "narrator",
            "text": "他问。"
          },
          {
            "id": "ch04-b10",
            "speaker": "child",
            "text": "留着。"
          },
          {
            "id": "ch04-b11",
            "speaker": "narrator",
            "text": "有些东西能够赔一件新的，却不能把旧的那件变回原样。周屿第一次明白，承担后果不是把价钱补齐，也不是尽快做出更厉害的版本。\n\n许安把小丁的每一次判断打印出来。摄像头没有坏，程序也没有自己改变。小丁准确执行了他们的办法：物品离人超过两米、外表像废物、二十秒内得不到确认，就收走。\n\n这些条件把断伞、画、薄毯和螺丝盒都变成了垃圾。可放在地上和被丢掉根本不是一回事；脏、破、旧，也不等于没有主人。\n\n周屿回来时，许安在白板上写了四个字：谁能决定？"
          },
          {
            "id": "ch04-b12",
            "speaker": "maker-a",
            "text": "人。"
          },
          {
            "id": "ch04-b13",
            "speaker": "narrator",
            "text": "他说。"
          },
          {
            "id": "ch04-b14",
            "speaker": "maker-b",
            "text": "哪个人？"
          },
          {
            "id": "ch04-b15",
            "speaker": "narrator",
            "text": "周屿望向敞开的棚门。住户们拎着菜、床单、玩具和工具经过。大家不会为了一个机器人，给每件东西贴上还要或不要；也不该向机器证明一只破盒子为什么重要。"
          },
          {
            "id": "ch04-b16",
            "speaker": "maker-a",
            "text": "物品的主人。如果不知道主人是谁，小丁就不能动。"
          },
          {
            "id": "ch04-b17",
            "speaker": "narrator",
            "text": "他们到分类站看梁叔工作。住户把确定不要的物品拿来，梁叔先看里面是否有剩余物，再指向正确的箱子。最费力的不是寻找垃圾，而是弯腰、辨认和反复打开沉重的箱盖。\n\n周屿把空瓶推到小丁面前。"
          },
          {
            "id": "ch04-b18",
            "speaker": "maker-a",
            "text": "它可以建议，不可以替人扔。"
          }
        ]
      },
      {
        "id": "ch05",
        "title": "学会停下的人",
        "blocks": [
          {
            "id": "ch05-b01",
            "speaker": "narrator",
            "text": "他们拆掉自动巡行和拾取程序。小丁只留在分类站。居民要主动把物品放进托盘，按一下只有凸起圆点的按钮。小丁可以判断，再把托盘推到建议的箱子前；拿不准就亮黄灯。无论绿灯多亮，它都不能把物品投入箱中，最后一步必须由人完成。\n\n许安重接了一条独立断电线路。梁叔有一把实体钥匙，转一下就能切断电机。周屿先拔掉控制电脑，亲手试了十二次断电。赵奶奶在旁边看着他们用包着软垫的测试块挡住托盘，确认电机受阻时会松开，不会继续用力。\n\n改造用了三周。周屿几次想让小丁重新聪明一点，都被测试桌上的物品拦住：沾泥的玩具车、空了却要带回家的饭盒、断线但准备修的耳机、装着纽扣的旧药盒。每一件看上去都可能被丢掉，也都有人伸手拿回去。\n\n有天周屿想跳过一项测试，许安把本子合上。"
          },
          {
            "id": "ch05-b02",
            "speaker": "maker-b",
            "text": "你可以说明为什么要改，不能趁我去买插头。"
          },
          {
            "id": "ch05-b03",
            "speaker": "narrator",
            "text": "周屿的耳朵红了。"
          },
          {
            "id": "ch05-b04",
            "speaker": "maker-a",
            "text": "知道了。"
          },
          {
            "id": "ch05-b05",
            "speaker": "maker-b",
            "text": "我也不能看见了还只写在纸上。"
          },
          {
            "id": "ch05-b06",
            "speaker": "narrator",
            "text": "她把急停按钮推到两个人中间，"
          },
          {
            "id": "ch05-b07",
            "speaker": "maker-b",
            "text": "谁觉得不对，谁就能停。"
          },
          {
            "id": "ch05-b08",
            "speaker": "narrator",
            "text": "重新开放前，他们没有再报名评审。林豆带来颜料盒，赵奶奶带来伞骨，梁叔带来洗净的酸奶杯。每个人都先把东西放进托盘，再决定要不要接受小丁的建议。\n\n第一天没有掌声。有人嫌多按一次按钮麻烦，小丁也把透明餐盒认成其他垃圾。许安留下记录，没有连夜调高绿灯的次数。\n\n第三天，梁叔发现自己少开了四十多次箱盖。他摘下手套，活动手指。"
          },
          {
            "id": "ch05-b09",
            "speaker": "caretaker",
            "text": "这才叫帮忙。"
          },
          {
            "id": "ch05-b10",
            "speaker": "narrator",
            "text": "赵奶奶把六个空水瓶逐个放进托盘，小丁一连亮了六次绿灯。第七件是伞骨。摄像头闪烁，黄灯亮起。"
          },
          {
            "id": "ch05-b11",
            "speaker": "repairer",
            "text": "总算学会犹豫了。"
          },
          {
            "id": "ch05-b12",
            "speaker": "narrator",
            "text": "赵奶奶说。"
          },
          {
            "id": "ch05-b13",
            "speaker": "maker-a",
            "text": "是我们——"
          },
          {
            "id": "ch05-b14",
            "speaker": "narrator",
            "text": "周屿开了口，又觉得后半句太像评审台上的发言。他没有说完，只把伞骨递还给她。"
          }
        ]
      },
      {
        "id": "ch06",
        "title": "蓝色土星",
        "blocks": [
          {
            "id": "ch06-b01",
            "speaker": "narrator",
            "text": "入秋后，广场又放电影。小丁待在分类站的遮棚下，四个轮子锁住，夹爪安静地垂着。\n\n林豆的新画夹在硬纸册里，湿掉的旧画也在。风忽然掀起旧画，蓝色土星贴着地面滚到小丁轮边。\n\n摄像头转向纸面。黄灯没有亮，绿灯也没有亮。没有人把画放进托盘，没有人按下按钮。小丁没有动。\n\n林豆跑来捡起画，检查那个晕开的纸角。他经过分类站时，把一只空颜料盒放进托盘，按下圆点按钮。\n\n小丁亮起黄灯。\n\n林豆想了想，把盒盖掰下来。盖子上沾着一小块干透的蓝颜料，他把它留进口袋，只把盒身推进蓝箱。\n\n周屿站在几步外，没有替他决定。许安也没有去改那盏不够漂亮的黄灯。晚风吹过分类站，小丁的夹爪一动不动。"
          }
        ]
      }
    ]
  }
}
