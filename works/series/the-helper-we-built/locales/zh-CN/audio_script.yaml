audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 清晰克制，带近未来生活感
        timbre: 温和中性
        pace: 自然适中
        pitch: 中音
    maker-a:
      display_name: 周屿
      tts:
        delivery: 热情急切，犯错后逐渐沉稳
        timbre: 清亮少年声线
        pace: 前快后稳
        pitch: 中高音
    maker-b:
      display_name: 许安
      tts:
        delivery: 谨慎理性，坚定但不说教
        timbre: 清澈年轻
        pace: 从容
        pitch: 中音
    liang:
      display_name: 梁叔
      tts:
        delivery: 务实平和，话少而有分量
        timbre: 成熟厚实
        pace: 稍慢
        pitch: 中低音
    zhao:
      display_name: 赵奶奶
      tts:
        delivery: 爽利直接，带生活幽默
        timbre: 明亮有力
        pace: 利落
        pitch: 中音
    boy:
      display_name: 小男孩
      tts:
        delivery: 真切直接，受委屈时短促
        timbre: 稚嫩清亮
        pace: 自然偏快
        pitch: 高音
  chapters:
    - id: ch01
      title: 第一次成功
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            小丁第一次伸出夹爪，是在周六早上七点四十三分。它夹住一只空酸奶杯，转了半圈，把杯子准确投进蓝色回收箱。杯底磕在箱沿上，啪的一声，院子里几只麻雀同时飞上晾衣绳。
            周屿跳起来，后脑勺撞到工作棚的太阳能板。
        - id: ch01-b02
          speaker: maker-a
          text: 成了！
        - id: ch01-b03
          speaker: narrator
          text: 许安没有跳。她蹲下来，看轮子有没有压到地上的电线，又把急停按钮按了一遍。小丁立刻垂下夹爪，胸前的绿灯灭了。
        - id: ch01-b04
          speaker: maker-a
          text: 你每次成功都先把它关掉。
        - id: ch01-b05
          speaker: narrator
          text: 周屿揉着脑袋。
        - id: ch01-b06
          speaker: maker-b
          text: 因为它每次关掉也得成功。
        - id: ch01-b07
          speaker: narrator
          text: |-
            两个人花了一个暑假造小丁。底盘来自坏掉的送货车，夹爪是周屿用旧台灯支架改的。许安负责传感器和停止程序。机器人不会说话，也听不懂人话；摄像头只会比较物体的形状、材质和脏污程度，再根据他们标过的照片，判断它更像可回收物厨余还是其他垃圾。遇到拿不准的东西，它本该停在原地，亮起黄灯，等人处理。
            社区广场的分类箱常被塞错。物业的梁叔每天要戴着厚手套重新翻一遍。周屿想让小丁替他做这件又脏又累的活，也想让星期一来参观的社区评审看见：十四岁的孩子不只会拼模型。
            梁叔看了酸奶杯，又看了小丁。
        - id: ch01-b08
          speaker: liang
          text: 它要是碰见没喝完的呢？
        - id: ch01-b09
          speaker: narrator
          text: 周屿拿来半杯豆浆。小丁夹起杯子，摄像头闪了两下，黄灯亮起。
        - id: ch01-b10
          speaker: maker-b
          text: 会叫人。
        - id: ch01-b11
          speaker: narrator
          text: 许安说。
        - id: ch01-b12
          speaker: liang
          text: 它也没叫。
        - id: ch01-b13
          speaker: narrator
          text: 梁叔说。
        - id: ch01-b14
          speaker: maker-b
          text: 会等人。
        - id: ch01-b15
          speaker: narrator
          text: 她改口。
    - id: ch02
      title: 被缩短的等待
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            试运行第一天，小丁沿广场边的白线缓慢前进。它捡了塑料瓶、饮料罐和被风吹散的广告纸，在一只沾着酱汁的纸盒前停了足足两分钟。梁叔把纸盒拿走时，围观的人鼓了掌。
            周屿却只看见小丁停住。他的手机里，评审通知写着效率、可靠性、公共价值。两分钟像一道难看的裂缝。
            午后，他把等待时间从两分钟改成二十秒，又调低了判断门槛。
            许安看见新数字：
        - id: ch02-b02
          speaker: maker-b
          text: 你改了什么？
        - id: ch02-b03
          speaker: maker-a
          text: 让它别遇见一张脏纸就发呆。
        - id: ch02-b04
          speaker: maker-b
          text: 拿不准怎么办？
        - id: ch02-b05
          speaker: maker-a
          text: 放进最接近的箱子。人本来也会猜。
        - id: ch02-b06
          speaker: maker-b
          text: 你先恢复。我们明天拿各种东西测。
        - id: ch02-b07
          speaker: narrator
          text: 周屿把屏幕扣上。
        - id: ch02-b08
          speaker: maker-a
          text: 明天来不及。我盯着它。
    - id: ch03
      title: 断伞不是垃圾
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天，小丁快多了。它绕开奔跑的孩子，把一只压扁的易拉罐从长椅下拖出来，又从花坛边夹起一把断伞。夹爪转到蓝箱上方时，修伞的赵奶奶追来，一把抓住伞柄。
        - id: ch03-b02
          speaker: zhao
          text: 放手！
        - id: ch03-b03
          speaker: narrator
          text: 小丁的电机仍在转。许安拍下急停，夹爪松开。赵奶奶把断伞抱在怀里，气喘吁吁：
        - id: ch03-b04
          speaker: zhao
          text: 伞骨还能拆。谁说我不要？
        - id: ch03-b05
          speaker: narrator
          text: 周屿指着伞面上的泥：
        - id: ch03-b06
          speaker: maker-a
          text: 它以为——
        - id: ch03-b07
          speaker: zhao
          text: 它以为，还是你以为？
        - id: ch03-b08
          speaker: narrator
          text: |-
            赵奶奶问。
            那把伞是她替楼上的小孩留的，伞布要剪成风筝尾巴。周屿道了歉，把伞送回她的小摊。回来时，他给程序加了一条规则：只捡掉在地上的东西。
            许安盯着那行字。
        - id: ch03-b09
          speaker: maker-b
          text: 刚才的伞就在地上。
        - id: ch03-b10
          speaker: maker-a
          text: 那就离人两米以上。
        - id: ch03-b11
          speaker: maker-b
          text: 东西离开人两米，就自动不要了？
        - id: ch03-b12
          speaker: maker-a
          text: 总得有个数。
        - id: ch03-b13
          speaker: narrator
          text: 周屿说，
        - id: ch03-b14
          speaker: maker-a
          text: 我就在旁边。再出错我会停。
    - id: ch04
      title: 失控的分类
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            傍晚，广场开始放露天电影。人们搬来折叠椅和坐垫，小丁在外围巡行。银幕还没亮，风先起来了。一张画满星球的纸从一个小男孩膝上飞走，贴地滚出三米。小丁追上去，夹起纸。
            男孩也追上去：
        - id: ch04-b02
          speaker: boy
          text: 我的！
        - id: ch04-b03
          speaker: narrator
          text: |-
            周屿隔着人群看见黄纸一闪。他往急停遥控器摸，口袋却是空的。刚才充电时，他把遥控器放在工作棚了。
            小丁把画投进装废纸的蓝箱。男孩趴在箱口，够不到。风又卷走一条绣着名字的薄毯。小丁转向，绿灯闪了一下。
        - id: ch04-b04
          speaker: maker-b
          text: 拔主电池！
        - id: ch04-b05
          speaker: narrator
          text: |-
            许安喊。
            她从另一边冲过去。周屿翻过两排椅子，踩扁了一盒爆米花。小丁夹住薄毯的一角往箱子拖，毯子的主人死死拉住另一头。电机发出吃力的嗡鸣。
            周屿扑到小丁背后，掀开护盖，拔下红色插头。轮子停了，夹爪却卡在毯子上。他和许安用扳手一点点卸开连接轴。广场上的人围成半圈，没有人鼓掌。
            他们从箱里找回那幅画。纸角被饮料浸湿，蓝色的土星晕成一团。男孩抱着画，不肯看他们。薄毯边缘多了一道油印。还有一只装着假牙的塑料盒、一包赵奶奶留给流浪猫的干粮，也被小丁收走了。
            梁叔把箱底最后一只螺丝盒递给周屿。
        - id: ch04-b06
          speaker: liang
          text: 这是我的。下午修椅子时落下的。
        - id: ch04-b07
          speaker: narrator
          text: 周屿接过来，手心全是油。
        - id: ch04-b08
          speaker: maker-a
          text: 我会赔。
        - id: ch04-b09
          speaker: liang
          text: 先把该还的还了。
        - id: ch04-b10
          speaker: narrator
          text: 梁叔说。
    - id: ch05
      title: 谁决定
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            星期一的评审被他们取消。周屿挨家敲门，道歉，清洗薄毯，重新买了螺丝和猫粮。那幅画没法恢复，他坐在小男孩家的地板上，按男孩的指示重新铺纸、调颜色。男孩自己画新的土星，不许周屿碰，只让他用吹风机最小档吹干水彩。
            许安把小丁推回棚里，打印出所有错误记录。摄像头并没有坏。它准确执行了他们给的办法：离人较远、像废物、二十秒内得不到确认，就收走。可放在地上和被丢掉根本不是一回事；脏、破、旧，也不等于没有主人。
            周屿回来时，她在白板上写了三个大字：谁决定？
        - id: ch05-b02
          speaker: maker-b
          text: 人。
        - id: ch05-b03
          speaker: narrator
          text: 他说。
        - id: ch05-b04
          speaker: maker-b
          text: 哪个人？
        - id: ch05-b05
          speaker: narrator
          text: |-
            他看着院子里来来往往的住户。大家不会为了一个机器人随身给物品贴标签，也不该被迫证明手里的东西有用。
            两个人拆掉自动拾取程序。小丁不再在广场自由巡行，只停在分类站里。居民主动把物品放进托盘，按一下请判断；小丁可以把明确的瓶罐推到建议箱前，拿不准就亮黄灯。无论多确定，它都不再直接把东西投入箱中，最后一步由人完成。梁叔还有一把实体钥匙，转一下就能切断电机。
            改造用了三周。周屿几次想让小丁重新聪明一点，都被测试桌上的物品拦住：沾泥的玩具车、空了却要带回家的饭盒、断线但准备修的耳机。每一件看上去都像垃圾，也都有人伸手拿回去。
    - id: ch06
      title: 学会犹豫
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 重新开放那天，没有评审，也没有掌声。赵奶奶拎来一袋喝空的水瓶。她把瓶子逐个放进托盘，小丁一连亮了六次绿灯。第七件是一把伞骨，摄像头闪烁，黄灯亮起。
        - id: ch06-b02
          speaker: zhao
          text: 总算学会犹豫了。
        - id: ch06-b03
          speaker: narrator
          text: 赵奶奶说。
        - id: ch06-b04
          speaker: maker-a
          text: 是我们学会了。
        - id: ch06-b05
          speaker: narrator
          text: |-
            周屿说完觉得太像演讲，便把后半句话咽回去。他只把伞骨递还给她。
            傍晚，梁叔来锁分类站。广场上又起了风，一张画着蓝色土星的纸从长椅上滑下来，停在小丁轮边。小丁没有动。
            远处的小男孩跑来，捡起画，检查纸角。他经过分类站时，把一只空颜料盒放进托盘，按下按钮。
            小丁亮起黄灯。
            男孩想了想，把盒盖掰下来留进口袋，只把盒身推进蓝箱。小丁的夹爪安静地垂着，绿灯在晚风里亮了一会儿。
