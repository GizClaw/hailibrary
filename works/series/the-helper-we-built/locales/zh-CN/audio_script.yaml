audio_script:
  language: zh-CN
  cast:
    narrator: {display_name: 旁白, tts: {delivery: 清晰克制，带近未来生活感, timbre: 温和中性, pace: 自然适中, pitch: 中音}}
    maker-a: {display_name: 周屿, tts: {delivery: 热情急切，犯错后逐渐沉稳, timbre: 清亮少年声线, pace: 前快后稳, pitch: 中高音}}
    maker-b: {display_name: 许安, tts: {delivery: 谨慎坚定，承认责任时坦率, timbre: 清澈年轻声线, pace: 从容, pitch: 中音}}
    caretaker: {display_name: 梁叔, tts: {delivery: 务实平和，话少而有分量, timbre: 成熟厚实, pace: 稍慢, pitch: 中低音}}
    repairer: {display_name: 赵奶奶, tts: {delivery: 爽利直接，带生活幽默, timbre: 明亮有力, pace: 利落, pitch: 中音}}
    child: {display_name: 林豆, tts: {delivery: 真切直接，受委屈时短促, timbre: 稚嫩清亮, pace: 自然偏快, pitch: 高音}}
    owner: {display_name: 盒子的主人, tts: {delivery: 平静而直接, timbre: 成熟清晰, pace: 适中, pitch: 中音}}
  chapters:
    - id: ch01
      title: 七点四十三分
      blocks:
        - {id: ch01-b01, speaker: narrator, text: "周六早上七点四十三分，小丁头一回伸出了夹爪。它夹起一个空酸奶杯，转过半圈，正好把杯子送进蓝色回收箱。杯底在箱沿上磕出啪的一声，院里的麻雀全飞上了晾衣绳。\n\n周屿猛地跳起来，后脑勺正撞上工作棚的太阳能板。"}
        - {id: ch01-b02, speaker: maker-a, text: 成了！, emotion: happy}
        - {id: ch01-b03, speaker: narrator, text: 许安可没跟着跳。她先蹲下看轮子，又按了一次红色急停。小丁的夹爪马上垂下来，胸口的绿灯也灭了。周屿揉着后脑勺看她。}
        - {id: ch01-b04, speaker: maker-a, text: 怎么一成功，你就先关掉它？}
        - {id: ch01-b05, speaker: maker-b, text: 因为关掉它，也得回回都成功。}
        - {id: ch01-b06, speaker: narrator, text: "两个人造小丁，忙了整整一个暑假。底盘来自一辆坏送货车，夹爪是周屿用旧台灯支架改的。许安负责摄像头、重量传感器和停止程序。\n\n小丁不会说话，也听不懂人话。摄像头能比形状、表面和脏污，传感器能测杯里还有没有东西。它再对照两人标好的照片，算算更像可回收物、厨余，还是其他垃圾。算不准时，它应该停住，亮黄灯，等人处理。\n\n广场上的分类箱总有人投错。梁叔每天都得戴着厚手套重新翻一遍。周屿想替他省下这件脏活、累活，也想让星期一来的评审看看，十四岁的孩子不只会拼模型。\n\n梁叔指了指门边一个掉漆的铁皮饼干盒。"}
        - {id: ch01-b07, speaker: caretaker, text: 这个呢，算哪一类？}
        - {id: ch01-b08, speaker: narrator, text: 盒盖有个角瘪了，外面还粘着透明胶。周屿说，金属当然能回收。许安说，它还没洗干净，暂时哪类都不是。梁叔掀开盖子。盒里有块纸板，一排螺丝按长短插在上面。}
        - {id: ch01-b09, speaker: caretaker, text: 该放进哪个箱，你们能教会它。}
        - {id: ch01-b10, speaker: narrator, text: 梁叔把盖子扣好，又问了一句。}
        - {id: ch01-b11, speaker: caretaker, text: 可东西还要不要，这事谁教它？}
        - {id: ch01-b12, speaker: narrator, text: "周屿没觉得这是个难题。小丁只会捡分类箱旁边、落在地上的东西。真是要紧的东西，谁会扔在那儿？\n\n他刚要开口，手机响了。评审流程的标题下面写着效率、可靠性、公共价值。周屿立刻把屏幕转给许安。梁叔那个问题，就留在了嗡嗡作响的散热扇旁边。"}
    - id: ch02
      title: 二十秒
      blocks:
        - {id: ch02-b01, speaker: narrator, text: "第一天试跑，小丁沿着广场边的白线走。它捡起塑料瓶、饮料罐和吹散的广告纸，却在一个沾酱汁的纸盒前停了两分钟。孩子们学它站着不动。梁叔拿走纸盒时，人群笑着鼓掌。\n\n周屿只看见那两分钟。他看了六次手机。评审表上的效率，像一道红笔圈出的错题。\n\n午后，许安去买备用插头。周屿把两分钟改成二十秒，把算不准就停改成挑最接近的一类。他告诉自己，人也会猜，小丁只是猜得快些。反正遥控器会在他手里。\n\n许安回来，一眼看见了新数字。"}
        - {id: ch02-b02, speaker: maker-b, text: 你动了哪些设置？}
        - {id: ch02-b03, speaker: maker-a, text: 我不想让它碰到一张脏纸，就站着不动。}
        - {id: ch02-b04, speaker: maker-b, text: 那它分不清的时候呢？}
        - {id: ch02-b05, speaker: maker-a, text: 就放进最像的那一箱。二十秒，足够我发现了。}
        - {id: ch02-b06, speaker: maker-b, text: 先改回去。明天我们找些不一样的东西来测。}
        - {id: ch02-b07, speaker: narrator, text: 周屿啪地合上屏幕。}
        - {id: ch02-b08, speaker: maker-a, text: 等到明天就晚了。评审后天来，我会一直看着它。}
        - {id: ch02-b09, speaker: narrator, text: 许安的手还搭在电脑边上。旧设置点两下就能回来。可小丁里面有她焊的线，还有她熬夜调出来的摄像头。周屿一提评审，她听着就像等了整整一个暑假的门铃，终于要响了。过了一会儿，她才开口。}
        - {id: ch02-b10, speaker: maker-b, text: 遥控器不能离开你。电量一到一半就停，人一多也停。}
        - {id: ch02-b11, speaker: maker-a, text: 好，就这么定。}
        - {id: ch02-b12, speaker: narrator, text: "周屿把手伸出去，想跟她击掌。许安没抬手。她只把二十秒写进测试本，笔尖用力过了头，在纸上戳出一个洞。\n\n第二天，小丁果然利索多了。它躲开跑动的孩子，还从长椅下面拖出一个易拉罐。周屿举着手机录像，画面里的绿灯亮个不停。\n\n花坛旁有一把断伞，伞面全是泥。小丁转过摄像头，绿灯一亮，夹爪就扣住了伞柄。修伞的赵奶奶从摊子后面追出来，抓紧伞的另一头。"}
        - {id: ch02-b13, speaker: repairer, text: 松开！, emotion: angry}
        - {id: ch02-b14, speaker: narrator, text: 电机还在使劲。许安冲过去按下急停，夹爪这才松了。赵奶奶把断伞抱回怀里。}
        - {id: ch02-b15, speaker: repairer, text: 伞骨拆下来还能用。楼上的孩子正要拿它做风筝尾巴。你凭什么说这伞我不要了？, emotion: angry}
        - {id: ch02-b16, speaker: maker-a, text: 小丁是看见伞上有泥，才以为……}
        - {id: ch02-b17, speaker: repairer, text: 是机器这么想，还是你这么想？, emotion: angry}
        - {id: ch02-b18, speaker: narrator, text: 周屿把伞送回小摊，又加了一条规则，只捡落在地上的东西。}
        - {id: ch02-b19, speaker: maker-b, text: 那把伞本来就在地上。}
        - {id: ch02-b20, speaker: maker-a, text: 那就再加一条，离人超过两米才能捡。}
        - {id: ch02-b21, speaker: maker-b, text: 离主人两米，东西就成了没人要的吗？}
        - {id: ch02-b22, speaker: maker-a, text: 规则总得有个数字。我会待在旁边，下次一出问题，我马上停掉它。}
        - {id: ch02-b23, speaker: narrator, text: 许安望着急停按钮上自己留下的指印。她已经明白了，真正该停下来的，不只是小丁。}
    - id: ch03
      title: 风从银幕背后起来
      blocks:
        - {id: ch03-b01, speaker: narrator, text: 傍晚，广场要放露天电影。大家陆续搬来折叠椅和坐垫。周屿只准小丁在外圈走。许安查过主电池，又隔着周屿的外套摸了摸。口袋里，遥控器的方角顶着她的手指。}
        - {id: ch03-b02, speaker: maker-b, text: 只跑最后半个小时。}
        - {id: ch03-b03, speaker: narrator, text: 银幕还黑着，风先从两栋楼之间钻了过来。林豆膝上有张画，画满了行星。纸被风一掀，贴着地滚出三米远。小丁马上追过去。}
        - {id: ch03-b04, speaker: child, text: 那是我的！, emotion: fearful}
        - {id: ch03-b05, speaker: narrator, text: "林豆也追了过去。隔着人群，周屿只看见一张黄纸闪了一下。他伸手去摸遥控器，口袋里却只有备用电池。刚才给小丁补电时，他嫌遥控器硌着难受，随手放回了工作棚的充电座。\n\n小丁已经把画扔进蓝箱。林豆趴在箱口，怎么也够不着。风接着卷走一条薄毯，上面还绣着名字。小丁转过身，绿灯闪了一下。"}
        - {id: ch03-b06, speaker: maker-b, text: 快拉紧急断电柄！, emotion: fearful}
        - {id: ch03-b07, speaker: narrator, text: "周屿翻过两排椅子，一脚踩瘪了爆米花盒。小丁已经夹住薄毯，正往箱子那边拖。毯子的主人拽着另一头，不肯松手。电机吃力地嗡嗡响。\n\n周屿扑到小丁身后，掀开紧急盖板，拉下绝缘手柄。轮子停住了，夹爪却断电卡死，还咬着毯子。许安托住机械臂，周屿拿扳手慢慢卸开连接轴。周围的人站成半圈。这回，一个鼓掌的人也没有。\n\n他们从箱里捞回林豆的画。漏水的饮料杯泡湿了纸角，蓝色土星已经晕开。薄毯的边上蹭出一道油印。箱里还躺着一个装假牙的塑料盒、赵奶奶留给流浪猫的干粮，还有梁叔的铁皮饼干盒。几颗短螺丝滚到了箱底，全泡在菜汤里。\n\n周屿蹲下来，一颗颗捡螺丝，手心沾满了油。"}
        - {id: ch03-b08, speaker: maker-a, text: 这些我都赔。梁叔，我也给你换一个新盒子。}
        - {id: ch03-b09, speaker: caretaker, text: 盒子不用换。里面那些口子，是我照着自己顺手的位置割的。先把该还的东西还回去。}
        - {id: ch03-b10, speaker: narrator, text: 许安从测试本上拔下笔。}
        - {id: ch03-b11, speaker: maker-b, text: 设置是周屿改的，可我明明看见了。我没改回来，也没叫它停。这个后果，我也要负一半。}
        - {id: ch03-b12, speaker: narrator, text: "周屿准备过的那些解释，一下全说不出口了。他把评审邀请删掉。那天的电影也没能放成。\n\n两个人把断了电的小丁推回棚里。一个轮子粘着爆米花，每转一圈，就轻轻响一下。"}
    - id: ch04
      title: 还不回去的东西
      blocks:
        - {id: ch04-b01, speaker: narrator, text: 星期一，两个人一户户敲门道歉。他们洗了薄毯，又买来新的螺丝和猫粮。假牙盒也消过毒，主人接到手里，只问了他们一句。}
        - {id: ch04-b02, speaker: owner, text: 下一次，小丁还会替我做决定吗？}
        - {id: ch04-b03, speaker: narrator, text: "这句话不带责骂，却更难回答。\n\n林豆那张画已经修不好了。周屿买了水彩纸和颜料，坐到林豆家地板上，想照旧画再画一个土星。林豆一伸手，把纸抽走了。"}
        - {id: ch04-b04, speaker: child, text: 那个蓝不对。}
        - {id: ch04-b05, speaker: maker-a, text: 那你教我怎么调，好不好？}
        - {id: ch04-b06, speaker: child, text: 不要，你别动。}
        - {id: ch04-b07, speaker: narrator, text: "周屿只好把手收回膝盖上。林豆自己蘸了两种蓝，又兑了一点水。新画里的光环没有原来那么圆，右边还多出一颗星球，上面长着四片叶子。\n\n林豆只肯让周屿用吹风机的最小档吹干颜料。风大一点，颜色就会被吹开。所以周屿把吹风机举得远远的，胳膊发酸也没往前挪。"}
        - {id: ch04-b08, speaker: maker-a, text: 那张旧画怎么办？}
        - {id: ch04-b09, speaker: child, text: 我要留着。}
        - {id: ch04-b10, speaker: narrator, text: "有的东西能赔一件新的，原来的那件却再也回不到从前。周屿这才懂，承担后果不只是补钱，也不是赶紧造出更厉害的小丁。\n\n许安打印出小丁做过的每次判断。摄像头没坏，程序也没自己变。小丁只是照他们定的办法做。东西离人超过两米，看着像废物，二十秒没人确认，就收走。\n\n这样一来，断伞、画、薄毯和螺丝盒全成了垃圾。但东西放在地上，不等于被扔掉。脏、破、旧，也不等于没有主人。\n\n周屿回到棚里，看见许安在白板上写了四个字，谁能决定？"}
        - {id: ch04-b11, speaker: maker-a, text: 应该让人决定。}
        - {id: ch04-b12, speaker: maker-b, text: 让哪个人决定？}
        - {id: ch04-b13, speaker: narrator, text: 棚门敞着。住户从门外经过，手里拎着菜、床单、玩具和工具。他们不会为了迁就一个机器人，给每件东西都贴上还要或不要。他们也不该向机器解释，一个破盒子为什么重要。}
        - {id: ch04-b14, speaker: maker-a, text: 东西的主人来决定。不知道主人是谁，小丁就不能碰。}
        - {id: ch04-b15, speaker: narrator, text: "接着，两人去分类站看梁叔怎么干活。住户把确定不要的东西送过来，梁叔先看里面有没有剩下的东西，再告诉对方该投哪个箱。他最费力的地方，不是四处找垃圾，而是一次次弯腰、分辨，再掀开沉重的箱盖。\n\n周屿把一个空瓶放到小丁面前。"}
        - {id: ch04-b16, speaker: maker-a, text: 小丁可以给建议，但不能替人扔东西。}
    - id: ch05
      title: 学会停下的人
      blocks:
        - {id: ch05-b01, speaker: narrator, text: "他们拆掉自动巡行和拾取程序，让小丁只待在分类站。居民把东西放上托盘，按下带凸点的按钮。小丁判断后，把托盘推到建议的箱子前。拿不准就亮黄灯。绿灯再亮，它也不能投箱，最后一步必须由人完成。\n\n许安另接了一条断电线路。梁叔的实体钥匙一转，电机就会断电。周屿拔掉控制电脑，亲手试了十二遍。赵奶奶看着他们用软垫测试块挡住托盘，确认电机受阻就松开，不再硬推。\n\n改造用了三周。每当周屿想让小丁再聪明些，测试桌上的东西就拦住他。沾泥的玩具车、要带回家的空饭盒、准备修的断线耳机，还有装纽扣的旧药盒。它们看着都可能被扔掉，也都有人伸手拿回。\n\n有一天，周屿又想少测一项。许安合上测试本。"}
        - {id: ch05-b02, speaker: maker-b, text: 你想改什么，可以先讲清楚。可你不能再趁我出去买插头，自己偷偷改。}
        - {id: ch05-b03, speaker: narrator, text: 周屿的耳朵一下红了。}
        - {id: ch05-b04, speaker: maker-a, text: 我知道了。}
        - {id: ch05-b05, speaker: maker-b, text: 我也一样。不能明明发现不对，只记在本子上。}
        - {id: ch05-b06, speaker: narrator, text: 她把急停按钮推到两个人中间。}
        - {id: ch05-b07, speaker: maker-b, text: 谁觉得有问题，谁就有权让它停。}
        - {id: ch05-b08, speaker: narrator, text: "再次开放前，他们没去报名评审。林豆带着颜料盒，赵奶奶拿来伞骨，梁叔拿来洗净的酸奶杯。每个人都先把自己的东西放上托盘，再由自己决定，要不要听小丁的建议。\n\n第一天，没有人为他们鼓掌。有人嫌多按一次按钮太麻烦，小丁还把透明餐盒认成了其他垃圾。许安只把问题记下来，没有为了多亮几次绿灯，连夜去改程序。\n\n到了第三天，梁叔算了算，自己少掀了四十多次箱盖。他摘掉手套，活动着手指。"}
        - {id: ch05-b09, speaker: caretaker, text: 这回才真的帮上忙了。}
        - {id: ch05-b10, speaker: narrator, text: 赵奶奶一个个放上六只空水瓶，小丁连续亮了六次绿灯。第七件东西是伞骨。摄像头闪了几下，这次亮起来的是黄灯。}
        - {id: ch05-b11, speaker: repairer, text: 可算知道先犹豫一下了。}
        - {id: ch05-b12, speaker: maker-a, text: 其实，是我们……}
        - {id: ch05-b13, speaker: narrator, text: 周屿才说了半句，就觉得后面的话听着太像评审台上的发言。他没再说，只把伞骨递还给赵奶奶。}
    - id: ch06
      title: 蓝色土星
      blocks:
        - {id: ch06-b01, speaker: narrator, text: "入秋以后，广场又放起了电影。小丁留在分类站的遮棚下面，四个轮子都锁着，夹爪静静垂下。\n\n林豆把新画收在硬纸册里，那张湿过的旧画也在。风忽然掀起旧画，蓝色土星贴着地面，一直滚到小丁轮边。\n\n摄像头转过去，对着纸看。可黄灯没亮，绿灯也没亮。因为没人把画放上托盘，也没人按那个按钮。小丁一下都没有动。\n\n林豆跑来捡起旧画，看看那个晕开的纸角。走过分类站时，他把一只空颜料盒放进托盘，按下圆点按钮。\n\n小丁亮起黄灯。\n\n林豆想了一会儿，把盒盖掰下来。盖上粘着一小块已经干透的蓝颜料。他把盒盖装进口袋，只把盒身推进蓝色回收箱。\n\n周屿站在几步外，没有替林豆决定。许安也没有去改那盏不够漂亮的黄灯。\n\n晚风吹过分类站。小丁的夹爪一动不动。"}
