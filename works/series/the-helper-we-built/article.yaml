schema_version: 1
id: the-helper-we-built
category: fiction
genre: science-fiction
style: luminous-future-technology
labels: {topics: [technology, everyday-life], themes: [responsibility, empathy, problem-solving], moods: [hopeful, reflective]}
research: none
premise: >
  不远的未来，两个孩子为社区做了一个会分拣垃圾的小机器人。它越做越“能干”，
  却开始把别人还想留着的东西也当垃圾收走，惹出一连串麻烦。
  孩子们必须弄清楚问题出在自己的设计上，并为后果负责、修好它。
  技术设定要可信，不写万能机器人。
characters:
  - {id: maker-a, description: 周屿，十四岁，动手能力强、急于证明自己，不善于承认害怕}
  - {id: maker-b, description: 许安，十四岁，负责感强且善于追问，但需学会在反对时真正按下停止键}
  - {id: robot, description: 小丁，他们做的齐腰高分拣机器人，只能感知、分类和执行预设规则，不会说话}
  - {id: caretaker, description: 梁叔，社区物业维修员，务实寡言，知道物品在生活中的去处}
  - {id: repairer, description: 赵奶奶，社区修理摊主，爽利、惜物，擅长看见破东西的第二种用法}
  - {id: child, description: 林豆，喜欢画行星的小男孩，他被损坏的画迫使周屿面对无法完全赔偿的后果}
locales:
  zh-CN: {writer: 星火, working_title: 我们造的小帮手, length: 3000-4500 字}
  en-US: {writer: kind-spark, working_title: The Helper We Built, length: 2000-3000 words}
picture_books:
  - {level: j, volumes: 2}
  - {level: n, volumes: 2}
cover_prompt: |-
  A wordless cover scene in a bright near-future apartment courtyard at late afternoon. In the foreground, two fourteen-year-old East Asian children kneel beside a waist-high homemade sorting robot: Zhou Yu is a slim boy with short tousled black hair, a coral-red hooded jacket over a warm-white shirt, graphite work pants, and teal sneakers; Xu An is a slim girl with a straight black bob, a cyan utility overshirt over a pale yellow shirt, dark navy pants, and white sneakers. The robot has a rounded warm-white recycled delivery-cart body, four small graphite wheels, one jointed lamp-arm claw, one rectangular camera eye, a large red emergency-stop button on top, and three simple circular status lights in green, amber, and off-white with no symbols. A blue recycling bin stands nearby. Wind has carried a child's blue-ringed-planet drawing beside the robot's wheel, and the robot deliberately remains still while the child runs toward it. Neighbors and a small repair table appear softly in the background. Keep the children, robot construction, courtyard modules, and interface colors physically coherent and realistic. Use a low three-quarter view with the still claw and rescued drawing as the visual focus, leaving calm open sky above for cover breathing room. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
