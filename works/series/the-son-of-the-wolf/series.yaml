cover_prompt: |-
  A wordless cover scene in the Yukon at the turn of the twentieth century shows a small dog-sled party crossing a vast snow-covered river beneath dark spruce ridges. A weathered frontier traveler in a fur cap and heavy wool coat leans into the sled's guiding pole, while an Indigenous woman in a practical fur-trimmed parka and moccasins steadies a second team behind him. The harnessed huskies surge together through fresh powder, making their determined forward motion the focal action. A low child-height camera looks along the curving trail toward distant blue mountains, with the travelers grouped in the lower half of the composition. Pale winter sunlight catches the dogs' breath and the frost on the trees, while broad calm room remains in the sky at the top. Keep the clothing, sleds, harnesses, landscape, and human proportions faithful to the Yukon around 1900, with a resilient, child-friendly mood. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
