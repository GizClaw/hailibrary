audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静克制，带着北国故事的冷峻与悲悯
        timbre: 温厚清晰，略带风霜感
        pace: 舒缓而有张力
        pitch: 中低
    malamute_kid:
      display_name: 玛拉缪特小子
      tts:
        delivery: 豪爽老练，讲故事时从容，关键处坚定而含蓄
        timbre: 温暖粗粝，带风霜感
        pace: 从容
        pitch: 中低
    jim_belden:
      display_name: 吉姆·贝尔登
      tts:
        delivery: 粗犷朴实，带边地人的直爽和乡音
        timbre: 洪亮厚实
        pace: 中等
        pitch: 低
    stanley_prince:
      display_name: 斯坦利·普林斯
      tts:
        delivery: 文雅坦率，感慨时克制真诚
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中
    louis_savoy:
      display_name: 路易·萨瓦
      tts:
        delivery: 热情外露，带法裔加拿大人的活泼感叹
        timbre: 明亮浑厚
        pace: 明快
        pitch: 中
    father_roubeau:
      display_name: 鲁博神父
      tts:
        delivery: 慈爱诚实，言语简洁庄重
        timbre: 柔和低沉
        pace: 舒缓
        pitch: 低
    bettles:
      display_name: 贝特尔斯
      tts:
        delivery: 喧闹豪放，唱歌和起哄时痛快有力
        timbre: 粗哑响亮
        pace: 明快
        pitch: 中低
    meyers:
      display_name: 迈耶斯
      tts:
        delivery: 热烈爽直，举杯时郑重
        timbre: 厚实清晰
        pace: 中等
        pitch: 中低
    westondale:
      display_name: 杰克·韦斯顿代尔
      tts:
        delivery: 和气坦荡，疲惫中仍坚决克制
        timbre: 清朗有力，略带倦意
        pace: 中等偏慢
        pitch: 中低
    mountie:
      display_name: 年轻骑警
      tts:
        delivery: 严肃执着，极度疲惫时仍维持命令口吻
        timbre: 清晰紧绷
        pace: 中等
        pitch: 中
    driver_older:
      display_name: 年长赶狗人
      tts:
        delivery: 粗硬暴烈，争执时毫不退让
        timbre: 低沉沙哑
        pace: 急促
        pitch: 低
    driver_younger:
      display_name: 年轻赶狗人
      tts:
        delivery: 疲惫直率，反对时急切
        timbre: 粗粝
        pace: 中等偏快
        pitch: 中低
    reveler_1:
      display_name: 酒客甲
      tts:
        delivery: 粗犷热烈，应和时响亮
        timbre: 洪亮
        pace: 明快
        pitch: 中低
    reveler_2:
      display_name: 酒客乙
      tts:
        delivery: 直率豪放，起哄时有力
        timbre: 粗厚
        pace: 明快
        pitch: 低
    reveler_3:
      display_name: 酒客丙
      tts:
        delivery: 热烈爽快，合唱时有穿透力
        timbre: 明亮粗粝
        pace: 明快
        pitch: 中
  chapters:
    - id: ch01
      title: 圣诞夜的潘趣酒
      blocks:
        - id: ch01-b01
          speaker: malamute_kid
          text: "倒进去！"
        - id: ch01-b02
          speaker: jim_belden
          text: "真要全倒进去？小子，这也太狠了吧。威士忌、酒精、白兰地、辣椒酱，还要再加——"
        - id: ch01-b03
          speaker: malamute_kid
          text: "倒。调这碗潘趣酒的人到底是谁？孩子，等你在这儿熬得跟我一样久，靠兔子脚印和鲑鱼肚皮填过肚子，你就明白了。圣诞节一年只有一回。圣诞节没有潘趣酒，就像矿井挖到了基岩，连一层含金砂也没碰着。"
        - id: ch01-b04
          speaker: jim_belden
          text: "这话我拿一张大牌跟你押。咱们在塔纳纳酿的那锅烈酒，你还记得吧？"
        - id: ch01-b05
          speaker: malamute_kid
          text: "怎么会忘！整整一个部落喝醉以后打成一团，靠的就是糖和酸面团发出来的劲儿。普林斯，那还是你来以前。那时北方没有白人女人，梅森却想娶露丝。她父亲是塔纳纳人的酋长，全族都不答应。可真够难办的。我把最后一磅糖全用上了，那是我这辈子干得最漂亮的一回。你该看看我们顺河逃走，又穿过陆路转运道时，他们追得有多紧。"
        - id: ch01-b06
          speaker: louis_savoy
          text: "后来那个印第安姑娘怎么样了？"
        - id: ch01-b07
          speaker: narrator
          text: "玛拉缪特小子天生会讲故事，于是把这位北国洛钦瓦尔的传奇，从头到尾讲给大家听。屋里不止一个在北方闯荡惯了的粗汉，听着听着，心弦也被牵紧了。他们朦胧地向往起南方阳光照着的牧场。那里的生活，似乎不只有跟严寒和死亡徒劳搏斗这一条路。"
        - id: ch01-b08
          speaker: malamute_kid
          text: "第一拨流冰刚过去，我们就到了育空河。他们只落后十五分钟，可救我们的正是这十五分钟。第二拨流冰冲垮上游的冰塞，把他们拦在对岸。等他们赶到努克卢基耶托，商站里的人早就列好阵势了。至于两个人怎么成的亲，你们问鲁博神父吧。婚礼就是他主持的。"
        - id: ch01-b09
          speaker: narrator
          text: "神父把烟斗从嘴边拿开，只用族长般慈爱的微笑作答。新教徒和天主教徒一起鼓起掌来。"
        - id: ch01-b10
          speaker: louis_savoy
          text: "老天爷！那个姑娘，还有勇敢的梅森！老天爷！"
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: "第一轮潘趣酒装进白铁杯，沿桌传开。贝特尔斯猛地跳起来，唱起最爱的酒歌。"
        - id: ch01-b12
          speaker: bettles
          text: "亨利·沃德·比彻，还有主日学校的老师，个个都喝黄樟树根熬的浆。可你尽管打赌，真要叫出它的名堂，那就是禁果里淌出的汁浆！"
        - id: ch01-b13
          speakers: [bettles, reveler_1, reveler_2, reveler_3]
          ensemble: chorus
          text: "啊，禁果里淌出的汁浆！你尽管打赌，真要叫出它的名堂，那就是禁果里淌出的汁浆！"
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: "那碗可怕的酒很快显出威力。营地和雪道上的汉子被暖融融的酒意包住，心也打开了。笑话、歌声，还有从前历险的故事，绕着桌子传了一圈又一圈。来自十几个国家的异乡人，开始轮流为大家举杯。"
        - id: ch01-b15
          speaker: stanley_prince
          text: "我敬山姆大叔，新世界那个早熟的婴儿。"
        - id: ch01-b16
          speaker: bettles
          text: "我敬女王陛下，愿上帝保佑她！"
        - id: ch01-b17
          speakers: [louis_savoy, meyers]
          ensemble: duo
          text: "敬阿尔萨斯和洛林！"
        - id: ch01-b18
          speaker: narrator
          text: "接着，玛拉缪特小子端着杯站了起来。他朝糊着油纸的窗户看了一眼，窗上的霜足足有三英寸厚。"
        - id: ch01-b19
          speaker: malamute_kid
          text: "这一杯，敬今晚还在雪道上赶路的人。愿他的口粮撑得到头，愿他的狗不倒下，愿他的火柴每一根都点得着。"
    - id: ch02
      title: 寒霜中的来客
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "啪的一声，屋外响起熟悉的狗鞭。鞭声又来一下，接着是玛拉缪特犬呜咽似的长嚎，还有雪橇压着积雪，咯吱咯吱停在门前。屋里的声音慢慢低下去，人人都等着看是谁来了。"
        - id: ch02-b02
          speaker: malamute_kid
          text: "是个老手。你听，他先照料狗，最后才管自己。"
        - id: ch02-b03
          speaker: narrator
          text: "外面传来狗牙相碰的咔咔声，狼一样的咆哮中，还夹着痛苦的尖叫。凭这些声音，他们已经听出来了。陌生人一边喂自己的狗，一边赶开屋主人的狗。很快，门上响起干脆而自信的敲击声，他走了进来。"
        - id: ch02-b04
          speaker: narrator
          text: "灯光刺得他睁不开眼。他在门口停了一会儿，屋里的人正好把他看了个清楚。他穿着羊毛和毛皮做的北极衣服，模样醒目得像一幅画。身高足有六英尺二三英寸，肩膀宽阔，胸膛厚实，跟那副高大身材十分相称。刮得光净的脸冻成了发亮的粉红色，长睫毛和眉毛都结成雪白。大狼皮帽的护耳和护颈松松掀着。他像寒霜之王，刚从黑夜里跨进屋。"
        - id: ch02-b05
          speaker: narrator
          text: "麦基诺厚呢外套外束着缀珠腰带，上面挂了两把大号柯尔特手枪和一柄猎刀。他带着赶路少不了的狗鞭，还背着一支最新式的大口径无烟火药步枪。他向前走时，脚步依旧坚实而轻捷，可谁都看得出，疲倦正沉沉压在他身上。"
        - id: ch02-b06
          speaker: westondale
          text: "弟兄们，都好吗？"
        - id: ch02-b07
          speaker: narrator
          text: "这一声招呼响亮又随和，屋里的尴尬立刻散了。转眼间，他已经紧紧握住玛拉缪特小子的手。两人从没见过，却都听过对方的名字，一眼就认了出来。大伙儿七嘴八舌地介绍完，又硬塞给他一大杯潘趣酒，这才让他说来意。"
        - id: ch02-b08
          speaker: westondale
          text: "那架篮式雪橇带着三个人、八条狗，离开这儿多久了？"
        - id: ch02-b09
          speaker: malamute_kid
          text: "足足领先你两天。你在追他们？"
        - id: ch02-b10
          speaker: westondale
          text: "对。那群混蛋当着我的面赶走了我的狗队。我已经抢回两天路程，下一段就能追上。"
        - id: ch02-b11
          speaker: jim_belden
          text: "你觉得他们会动手反抗吗？"
        - id: ch02-b12
          speaker: narrator
          text: "贝尔登只是想让谈话继续。玛拉缪特小子已经架起咖啡壶，又忙着煎咸肉和驼鹿肉。陌生人没有回答，只意味深长地拍了拍左轮手枪。"
        - id: ch02-b13
          speaker: jim_belden
          text: "你什么时候离开道森的？"
        - id: ch02-b14
          speaker: westondale
          text: "十二点。"
        - id: ch02-b15
          speaker: jim_belden
          text: "昨晚十二点？"
        - id: ch02-b16
          speaker: westondale
          text: "今天中午。"
        - id: ch02-b17
          speakers: [jim_belden, stanley_prince, louis_savoy]
          ensemble: chorus
          text: "什么？"
          emotion: surprised
        - id: ch02-b18
          speaker: narrator
          text: "这声低呼并不奇怪。现在正是午夜，他只花十二个小时，就跑完七十五英里崎岖难行的河上雪道。这样的本事，谁也不敢小看。"
        - id: ch02-b19
          speaker: narrator
          text: "不久，大家不再只问陌生人的事，话头转向各自童年走过的路。他吃着这顿简单的饭，玛拉缪特小子一直细看他的脸。小子很快认定，那是一张清白、诚实又坦荡的脸，叫人一见便喜欢。他还年轻，劳苦和艰难却已经在脸上刻下了深深的线条。"
        - id: ch02-b20
          speaker: narrator
          text: "他说话和气，安静时性情温和，那双蓝眼睛却叫人想到钢铁般的寒光。到了非行动不可的时候，尤其是寡不敌众时，那寒光就会亮起来。宽大的下颌和方正的下巴，显出坚韧不拔、绝不屈服的性情。他有狮子般的气质，却也不缺一缕柔情，甚至还带着一点近似女性的温软。他有一颗很容易动情的心。"
        - id: ch02-b21
          speaker: jim_belden
          text: "俺跟俺家老婆就是这么成的亲。她回去对她爹说，‘爹，俺们回来啦。’她爹先骂她，‘你就该死！’接着又冲我吼，‘吉姆，把那身漂亮衣裳脱了！吃午饭以前，给我把四十英亩地犁出一大片来。’说完，他吸吸鼻子，亲了她一下。我正快活呢，他一眼看见我，又吼，‘你，吉姆！’俺哪还敢等，撒腿就往谷仓跑。"
        - id: ch02-b22
          speaker: westondale
          text: "你在美国老家，有孩子等你吗？"
        - id: ch02-b23
          speaker: jim_belden
          text: "没有。孩子还没来得及有，萨尔就死了。所以俺才来了这儿。你呢，陌生人，成家没有？"
        - id: ch02-b24
          speaker: narrator
          text: "贝尔登心不在焉地想点烟斗，其实火根本没灭。陌生人没有开口。他掀开怀表，把表从当作表链的皮绳上解下，递给贝尔登。贝尔登举起油脂灯，细看表盖里面，低低骂了一声，满是赞叹。表又传到萨瓦手里。萨瓦连说了好几声老天爷，才交给普林斯。普林斯的手在发抖，眼里泛起异样的温柔。"
        - id: ch02-b25
          speaker: narrator
          text: "这件宝贝从一双长满硬茧的手传到另一双手。表盖里贴着一个女人的照片，她依人地抱着吃奶的婴儿，正是这些汉子喜欢的模样。还没轮到的人满心好奇，已经看过的人却安静下来，想起了自己的往事。他们熬得住饥饿的煎熬和坏血病的折磨，也敢在荒野和洪水中迎向突然降临的死亡。可一个素不相识的女人和孩子的影像，却让他们人人都变成了女人和孩子。"
        - id: ch02-b26
          speaker: westondale
          text: "我还没见过小家伙。她来信说，是个男孩，已经两岁了。"
          emotion: sad
        - id: ch02-b27
          speaker: narrator
          text: "他接回怀表，看了照片很久，才啪地扣上表盖，转过身去。可他还是慢了一点，没能藏住那股强压着的泪意。玛拉缪特小子把他领到铺位前，让他睡一会儿。"
        - id: ch02-b28
          speaker: westondale
          text: "四点整叫我。千万别耽误。"
        - id: ch02-b29
          speaker: narrator
          text: "没过多久，他就睡熟了，极度疲惫的呼吸又沉又重。"
    - id: ch03
      title: 再上雪道
      blocks:
        - id: ch03-b01
          speaker: stanley_prince
          text: "天哪，真是条硬汉。带着狗跑了七十五英里，只睡三个小时，又要赶路。他是谁，小子？"
        - id: ch03-b02
          speaker: malamute_kid
          text: "杰克·韦斯顿代尔。他来这儿快满三年了，除了干活像匹马，名下就只记着数不清的坏运气。我没见过他，不过锡特卡·查利跟我说起过。"
        - id: ch03-b03
          speaker: stanley_prince
          text: "一个人有那么温柔年轻的妻子，却把年华耗在这个上帝都抛弃的鬼地方，想想实在难受。在这里过一年，抵得上外面过两年。"
        - id: ch03-b04
          speaker: malamute_kid
          text: "他的毛病就在于太有骨气，也太倔。他两回淘到足以起家的金子，又两回全都丢了。"
        - id: ch03-b05
          speaker: narrator
          text: "贝特尔斯忽然闹腾起来。酒劲正在退，没多久，粗野的笑声又让大家忘了那些只有单调食物和麻木苦役的凄凉年月。可玛拉缪特小子始终放不下刚才看见的一切。他不安地一次次看表。有一次，他戴上手套和海狸皮帽，走出木屋，在高脚贮藏室里翻找起来。"
        - id: ch03-b06
          speaker: narrator
          text: "他甚至没等到客人说的时刻，提前十五分钟就把人叫醒了。年轻巨人的身体已经僵得厉害。众人使劲替他揉了好一阵，他才勉强站起来。他忍着疼，脚步踉跄地走出木屋。外面，狗已经套好挽具，一切都准备妥当。大家祝他交上好运，早些追上目标。鲁博神父匆匆为他祝福，又带着众人争先恐后跑回屋里。零下七十四度的严寒，可不是光着耳朵和双手就能面对的。"
        - id: ch03-b07
          speaker: narrator
          text: "玛拉缪特小子独自把他送到主雪道。到了那里，小子紧紧握住他的手，又叮嘱起来。"
        - id: ch03-b08
          speaker: malamute_kid
          text: "雪橇上装了一百磅鲑鱼卵。狗吃这些能跑的路，抵得上一百五十磅鱼。你大概指望在佩利补狗粮，可那儿一口也没有。到五指急流以前，人和狗都找不到一盎司吃的，足足两百英里。三十英里河有活水，千万当心。到了勒巴尔杰上游，一定走那条大的近道。"
        - id: ch03-b09
          speaker: westondale
          text: "你怎么会知道？消息不可能跑到我前头。"
          emotion: surprised
        - id: ch03-b10
          speaker: malamute_kid
          text: "我不知道，也不想知道。不过，你追的那支狗队从来不是你的。去年春天，锡特卡·查利把狗卖给了那几个人。可他跟我说过，你是个正派人。我信查利，也看过你的脸，我喜欢这张脸。我还看过——去你的吧。挑最高的雪脊跑，一直奔咸水海岸去，奔你的妻子去，还有——"
        - id: ch03-b11
          speaker: narrator
          text: "小子说到一半，脱下一只手套，猛地掏出钱袋。"
        - id: ch03-b12
          speaker: westondale
          text: "不，我不需要。"
          emotion: sad
        - id: ch03-b13
          speaker: narrator
          text: "泪水冻在韦斯顿代尔脸颊上。他痉挛似的紧握住玛拉缪特小子的手。"
        - id: ch03-b14
          speaker: malamute_kid
          text: "那就别舍不得狗。哪一条倒下，马上割断挽绳，把它留下，再买新的。就算一磅十美元，也算便宜。五指急流、小鲑鱼河和胡塔林夸都能买到。还有，别把脚弄湿。气温在零下二十五度以内，就一直赶路。再低，就生火换袜子。"
        - id: ch03-b15
          speaker: narrator
          text: "这就是小子最后的叮嘱。韦斯顿代尔赶着雪橇，消失在主雪道上。"
    - id: ch04
      title: 女王的骑警
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "才过十五分钟，铃铛声又宣告有人来了。门一开，一名西北地区骑警走进木屋，身后跟着两个混血赶狗人。三个人和韦斯顿代尔一样全副武装，也一样满脸倦色。两个赶狗人生在雪道上，长途跋涉对他们算不了什么。年轻骑警却已经累得很重。可他身上那股顽固不屈的劲，仍逼着他守住自己定下的速度，还会一直逼下去，直到他倒死在雪道上。"
        - id: ch04-b02
          speaker: mountie
          text: "韦斯顿代尔什么时候走的？他在这里停过，是不是？"
        - id: ch04-b03
          speaker: narrator
          text: "其实这句话根本不用问。雪地上的痕迹已经把经过说得清清楚楚。玛拉缪特小子和贝尔登交换了一眼。贝尔登明白了他的意思。"
        - id: ch04-b04
          speaker: jim_belden
          text: "他走了有一阵了。"
        - id: ch04-b05
          speaker: mountie
          text: "伙计，把时间说清楚。"
        - id: ch04-b06
          speaker: jim_belden
          text: "你这么非抓住他不可，他在道森闹了什么事？"
        - id: ch04-b07
          speaker: mountie
          text: "他从哈里·麦克法兰那里抢了四万美元，又在太平洋商业公司把钱换成一张西雅图兑付的支票。要是我们追不上，还有谁能拦住他取钱？现在告诉我，他到底什么时候走的？"
        - id: ch04-b08
          speaker: narrator
          text: "屋里每个人都压住心里的激动。玛拉缪特小子已经递过暗示，所以年轻警官看向哪里，哪里就只有一张毫无表情的脸。他大步走到普林斯面前，把那个问题又问了一遍。普林斯望着这位英国同胞坦率而认真的脸，心里很不好受，却没有正面回答，只顾谈起雪道上的路况。"
        - id: ch04-b09
          speaker: narrator
          text: "接着，骑警看见了不会撒谎的鲁博神父。"
        - id: ch04-b10
          speaker: father_roubeau
          text: "他在十五分钟前走的。不过，他本人和狗都休息了四个小时。"
        - id: ch04-b11
          speaker: mountie
          text: "只领先十五分钟，精神还养足了！上帝啊！"
          emotion: sad
        - id: ch04-b12
          speaker: narrator
          text: "年轻人踉跄着退了一步，疲惫和失望几乎让他昏倒。他嘴里喃喃说着，自己从道森赶来只用了十个小时，可狗已经全跑垮了。玛拉缪特小子硬塞给他一杯潘趣酒。他喝完转身就往门口走，命令两个赶狗人立刻跟上。"
        - id: ch04-b13
          speaker: narrator
          text: "可是木屋里的暖意和休息实在太诱人，两人立刻激烈反对。小子听得懂他们说的法语土话，焦急地听着。"
        - id: ch04-b14
          speaker: driver_younger
          text: "狗全完了！还没跑完第一英里，西沃什和巴贝特就得挨枪子。其他几条也撑不了多久。大家最好先歇一歇。"
        - id: ch04-b15
          speaker: mountie
          text: "借我五条狗。"
        - id: ch04-b16
          speaker: narrator
          text: "玛拉缪特小子摇了摇头。"
        - id: ch04-b17
          speaker: mountie
          text: "我可以给你一张五千元支票，由康斯坦丁上尉兑付。这是我的证件，我有权自己决定支取。"
        - id: ch04-b18
          speaker: narrator
          text: "小子还是无声地拒绝。"
        - id: ch04-b19
          speaker: mountie
          text: "那么，我以女王的名义征用这些狗。"
        - id: ch04-b20
          speaker: narrator
          text: "玛拉缪特小子像听见了难以相信的话，笑了笑，又看了一眼自己备得很足的武器。骑警知道自己无能为力，转身向门口走。两个赶狗人仍在反对。他猛地回身扑向他们，骂他们是女人，是孬种。年长的混血人黝黑的脸一下涨红了。他挺直身子，毫不客气地顶了回去。"
        - id: ch04-b21
          speaker: driver_older
          text: "那就赶！我会一直赶，赶到你的两条腿都断掉。等你倒下，我很乐意把你栽进雪里。"
          emotion: angry
        - id: ch04-b22
          speaker: narrator
          text: "年轻骑警全凭整个意志撑着，才步履平稳地走到门口，装出根本不存在的充沛精神。众人都看懂了，也敬重他这番骄傲的努力。可是，他脸上一阵阵掠过痛苦的抽搐，怎么也遮不住。"
        - id: ch04-b23
          speaker: narrator
          text: "狗浑身结霜，蜷在雪地里，几乎怎么赶也起不来。两个赶狗人又气又狠，皮鞭火辣辣地落下，那些可怜的畜生不停哀叫。直到领头的巴贝特被割断挽绳，留在雪地上，雪橇才终于挣出雪窝，再次上路。"
    - id: ch05
      title: 再敬雪道上的人
      blocks:
        - id: ch05-b01
          speaker: reveler_1
          text: "又卑鄙，又会撒谎的混蛋！"
          emotion: angry
        - id: ch05-b02
          speaker: louis_savoy
          text: "老天爷！他根本不是好东西！"
          emotion: angry
        - id: ch05-b03
          speaker: reveler_2
          text: "贼！比印第安人还坏！"
          emotion: angry
        - id: ch05-b04
          speaker: narrator
          text: "很明显，人人都动了怒。一来，他们气自己受了欺骗。二来，北方的道德准则受了冒犯。在这里，诚实高过一切，是一个男人最珍贵的品格。"
        - id: ch05-b05
          speaker: jim_belden
          text: "明知道那混蛋干了什么，俺们还帮他！"
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: "所有责怪的目光一齐落到玛拉缪特小子身上。他原本蹲在角落里照料被留下的巴贝特，这时站起身，一句话也没说。他先把大碗里剩下的潘趣酒倒净，准备最后再斟一轮。"
        - id: ch05-b07
          speaker: malamute_kid
          text: "今晚很冷，弟兄们，冷得厉害。你们都走过雪道，知道这句话有多重。狗倒下以后，就别再扑上去咬它。你们只听了一面之词。杰克·韦斯顿代尔比谁都清白正派。他配跟你我在一只锅里吃饭，也配跟你我盖一条毯子。"
        - id: ch05-b08
          speaker: malamute_kid
          text: "去年秋天，他把淘金挣来的一切，整整四万美元，都交给乔·卡斯特雷尔，请他拿去入股多米宁矿区。放到今天，他已经该是百万富翁了。可杰克留在环城，照料一个得坏血病的伙伴。卡斯特雷尔呢？他走进麦克法兰的赌局，越押越大，把整袋金子输了个精光。第二天，人们发现他死在雪地里。"
        - id: ch05-b09
          speaker: malamute_kid
          text: "可怜的杰克，本来正打算今年冬天离开北方，回到妻子和那个从没见过的儿子身边。你们也看出来了。他拿走的钱一分不多，一分不少，正是伙伴输掉的四万美元。现在他已经走了。你们又打算拿他怎么办？"
        - id: ch05-b10
          speaker: narrator
          text: "小子环顾这圈刚刚审判过韦斯顿代尔的人。那一张张脸慢慢软了下来。他举高杯子。"
        - id: ch05-b11
          speaker: malamute_kid
          text: "敬今晚还在雪道上赶路的人。愿他的口粮撑得到头，愿他的狗不倒下，愿他的火柴每一根都点得着。愿上帝帮助他，愿好运跟着他，还有——"
        - id: ch05-b12
          speaker: bettles
          text: "愿骑警队倒霉！"
          emotion: happy
        - id: ch05-b13
          speaker: narrator
          text: "空杯轰然碰在了一起。"
