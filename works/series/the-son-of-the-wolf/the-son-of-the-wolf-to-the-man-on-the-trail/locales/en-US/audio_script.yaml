  chapters:
    - id: ch01
      title: To the Man on the Trail
      blocks:
        - id: ch01-b01
          speaker: malemute_kid
          text: "Pour it all in."
        - id: ch01-b02
          speaker: stanley_prince
          text: "But Kid, isn't that a bit much? Whisky and alcohol are bad enough. Now you're adding brandy and pepper sauce too?"
        - id: ch01-b03
          speaker: malemute_kid
          text: "I said pour it in. Who's making this punch, anyway? Stay in this country as long as I have, my son, and live on rabbit tracks and salmon belly. Then you'll understand that Christmas comes only once a year. Christmas without punch is like digging all the way to bedrock and finding no gold."
        - id: ch01-b04
          speaker: narrator
          text: Malemute Kid smiled peacefully through the rising steam.
        - id: ch01-b05
          speaker: big_jim_belden
          text: "You can count on that as a winning card. Remember the hooch we made on the Tanana?"
        - id: ch01-b06
          speaker: narrator
          text: Big Jim Belden had come down from his Mazy May claim for Christmas. Everyone knew he had eaten nothing but moose meat for two months.
        - id: ch01-b07
          speaker: malemute_kid
          text: "Do I remember? Boys, you should've seen that whole tribe fighting drunk, all because we fermented sugar and sourdough. That was before your time, Prince. There weren't any white women here then, and Mason wanted to marry. Ruth's father was chief of the Tananas, and he and the whole tribe said no. So I used my last pound of sugar. It was the finest job I ever did. You should've seen that chase down the river and over the portage."
        - id: ch01-b08
          speaker: louis_savoy
          text: "But what happened to the young woman?"
        - id: ch01-b09
          speaker: narrator
          text: Louis Savoy leaned in. He had heard about the wild deed at Forty Mile the winter before. Malemute Kid was a born storyteller, and now he gave them the plain tale of that northern rescue. More than one rough adventurer felt his heart pull toward the warmer South, where life held something besides cold, struggle, and death.
        - id: ch01-b10
          speaker: malemute_kid
          text: "We reached the Yukon just after the first ice run. The tribe was only fifteen minutes behind us, but the second run broke the jam upriver and blocked them. By the time they reached Nuklukyeto, the whole post was waiting. And if you want to know how the meeting ended, ask Father Roubeau. He married them."
        - id: ch01-b11
          speaker: narrator
          text: The Jesuit priest took the pipe from his mouth. He answered only with a fatherly smile while Protestants and Catholics applauded together.
        - id: ch01-b12
          speaker: louis_savoy
          text: "By gar! Little Ruth and brave Mason. By gar!"
        - id: ch01-b13
          speaker: narrator
          text: The first tin cups of punch went around. Bettles the Unquenchable jumped up and began his favorite drinking song.
        - id: ch01-b14
          speaker: bettles
          text: "There's Henry Ward Beecher and the Sunday-school teachers, all drinking sassafras root. But if you called it by its proper name, it's juice from the forbidden fruit!"
        - id: ch01-b15
          speakers: [bettles, big_jim_belden, louis_savoy, meyers]
          ensemble: chorus
          text: "Oh, the juice of the forbidden fruit! Yes, call it by its proper name. It's the juice of the forbidden fruit!"
        - id: ch01-b16
          speaker: narrator
          text: The Kid's dreadful mixture soon did its work. Men from camps and trails relaxed in its warm glow, and jokes, songs, and old adventures traveled around the table. These men were strangers from a dozen countries, but that night they toasted every homeland among them. Prince, the Englishman, raised his cup to Uncle Sam, that early-ripening child of the New World. Bettles, the Yankee, drank to the Queen and asked God to bless her. Savoy and Meyers, the German trader, struck their cups together for Alsace and Lorraine.
        - id: ch01-b17
          speaker: malemute_kid
          text: "Here's to the man on the trail tonight. May his food last. May his dogs stay on their feet. May his matches always light."
        - id: ch01-b18
          speaker: narrator
          text: Crack! Crack! A dog whip sang outside. Malemutes whined and howled, and a sled crunched to a stop beside the cabin. The talk died while everyone waited.
        - id: ch01-b19
          speaker: malemute_kid
          text: "He's an old-timer. He feeds his dogs before he feeds himself."
        - id: ch01-b20
          speaker: narrator
          text: The Kid whispered this to Prince as they heard snapping jaws, savage snarls, and yelps of pain. Their practiced ears knew the stranger was beating the cabin dogs away while his own team ate. Then came a sharp, confident knock, and the stranger stepped inside.
        - id: ch01-b21
          speaker: narrator
          text: The light dazzled him, and he paused in the doorway long enough for everyone to look. He was a splendid, striking figure in his Arctic clothes of wool and fur, more than six feet tall, with shoulders and chest built in proportion to his height. Cold had turned his clean-shaven face bright pink. Ice whitened his long lashes and brows, and the ear and neck flaps of his great wolfskin cap hung open. He looked like the Frost King himself, fresh from the night.
        - id: ch01-b22
          speaker: narrator
          text: A beaded belt closed over the outside of his Mackinaw jacket. It held two large Colt revolvers and a hunting knife. Along with the dog whip no traveler could do without, he carried a new, heavy, large-bore rifle. His stride was firm and springy, but the men could see how badly the trail had tired him.
        - id: ch01-b23
          speaker: jack_westondale
          text: "Good cheer, lads!"
        - id: ch01-b24
          speaker: narrator
          text: His warm greeting broke the awkward silence. A moment later, he and Malemute Kid were shaking hands. They had never met, but each knew the other's name. The men introduced themselves and pressed a mug of punch on him before he could say why he had come.
        - id: ch01-b25
          speaker: jack_westondale
          text: "When did a basket sled with three men and eight dogs pass through?"
        - id: ch01-b26
          speaker: malemute_kid
          text: "They're exactly two days ahead. Are you chasing them?"
        - id: ch01-b27
          speaker: jack_westondale
          text: "I am. That's my team. The devils ran it off right under my nose. I've already made up two days, and I'll catch them on the next stretch."
        - id: ch01-b28
          speaker: big_jim_belden
          text: "Think they'll put up a fight?"
        - id: ch01-b29
          speaker: narrator
          text: Belden was only keeping the talk alive. Malemute Kid had already put on the coffee and was frying bacon and moose meat. The stranger tapped his revolvers and said nothing.
        - id: ch01-b30
          speaker: big_jim_belden
          text: "When did you leave Dawson?"
        - id: ch01-b31
          speaker: jack_westondale
          text: "At twelve o'clock."
        - id: ch01-b32
          speaker: big_jim_belden
          text: "Last night, of course?"
        - id: ch01-b33
          speaker: jack_westondale
          text: "No. Today."
        - id: ch01-b34
          speaker: narrator
          text: Surprise ran around the room. It was midnight now, and he had covered seventy-five miles of rough river trail in twelve hours.
        - id: ch01-b35
          speaker: narrator
          text: Soon the talk stopped being about the chase and wandered back to the trails of childhood. As the young stranger ate the rough meal, Malemute Kid studied him carefully and soon decided he liked what he saw. The face was honest and open, and still young, though hard work and hardship had already cut firm lines into it. His talk was friendly, and when he rested, he looked mild. But his blue eyes promised they could turn to hard steel when action came, especially when the odds were against him. His heavy jaw and square chin spoke of a man who would not give in. He had something of the lion in him. Yet there was softness there too, almost a touch of womanliness, the mark of a deeply emotional nature.
        - id: ch01-b36
          speaker: big_jim_belden
          text: "And that's how me and the old woman got married. She says, ‘Here we are, Dad.’ He tells her, ‘And may you be damned.’ Then he turns on me. ‘Jim, get out of those fine clothes. I want a good piece of that forty acres plowed before dinner.’ After that, he sniffles a little and kisses her. I was so happy I just stood there. Then he sees me and roars, ‘Jim!’ You can bet I flew to the barn."
        - id: ch01-b37
          speaker: jack_westondale
          text: "Do you have children waiting for you back in the States?"
        - id: ch01-b38
          speaker: big_jim_belden
          text: "No. Sal died before we had any. That's why I'm here. What about you, stranger? Are you married?"
        - id: ch01-b39
          speaker: narrator
          text: Belden started to light his pipe, though it was still burning. The stranger answered by opening his watch, slipping it from its thong, and passing it over. Belden lifted the slush lamp and studied the picture inside. He swore softly in admiration, then handed it to Louis Savoy. After many quiet words of wonder, Savoy passed it to Prince. His hands trembled, and his eyes grew tender.
        - id: ch01-b40
          speaker: narrator
          text: The watch traveled from one hard, work-worn hand to another. Inside was the pasted photograph of a loving, clinging woman with a baby at her breast, the kind of picture such men treasured. Those still waiting to see it leaned forward with sharp curiosity. Those who had seen it fell silent and looked back into their own lives. They could face the bite of famine, the grip of scurvy, or sudden death on land and water. But the image of an unknown wife and child made women and children of them all.
        - id: ch01-b41
          speaker: jack_westondale
          text: "I've never seen the little one. She says he's a boy, and he's two years old."
        - id: ch01-b42
          speaker: narrator
          text: He looked at the treasure for one last moment, snapped the watch shut, and turned away. He was not quick enough to hide the tears rising in his eyes. Malemute Kid led him to a bunk and told him to sleep.
        - id: ch01-b43
          speaker: jack_westondale
          text: "Wake me at four exactly. Don't let me sleep past it."
        - id: ch01-b44
          speaker: narrator
          text: A moment later, exhaustion had pulled him into heavy sleep.
        - id: ch01-b45
          speaker: stanley_prince
          text: "By Jove, he's a brave fellow. Seventy-five miles behind the dogs, only three hours of sleep, and then he's back on the trail. Who is he, Kid?"
        - id: ch01-b46
          speaker: malemute_kid
          text: "Jack Westondale. He's been here nearly three years. All he's earned is a name for working like a horse and having endless bad luck. I've never met him before, but Sitka Charley told me about him."
        - id: ch01-b47
          speaker: stanley_prince
          text: "It's hard to see a man with a lovely young wife spend his years in this forsaken place. Every year here ages a man twice as fast as a year Outside."
        - id: ch01-b48
          speaker: malemute_kid
          text: "His trouble is honest grit and stubbornness. Twice he made enough to leave, and twice he lost it all."
        - id: ch01-b49
          speaker: narrator
          text: An uproar from Bettles cut them off as the punch began to lose its force. Soon the cabin filled again with rough laughter. For a while, the men forgot the bleak years, the same dull food day after day, and the work that numbed body and mind. Only Malemute Kid could not lose himself in the fun. He kept looking anxiously at his watch. Once he pulled on his mittens and beaver cap, left the cabin, and rummaged through the supplies in the cache.
        - id: ch01-b50
          speaker: narrator
          text: He could not wait until four. Fifteen minutes early, he woke his guest. The young giant had stiffened so badly that the Kid had to rub him hard before he could stand. Westondale staggered outside and found his dogs harnessed, his sled packed, and everything ready. The company wished him luck and a short chase. Father Roubeau hurried through a blessing and led the rush back indoors. At seventy-four degrees below zero, bare ears and hands were dangerous.
        - id: ch01-b51
          speaker: narrator
          text: Malemute Kid went with Westondale as far as the main trail. There he gripped the man's hand and gave him advice.
        - id: ch01-b52
          speaker: malemute_kid
          text: "There's a hundred pounds of salmon eggs on your sled. They'll carry the dogs as far as a hundred and fifty pounds of fish. You were probably counting on dog food at Pelly, but there isn't any."
        - id: ch01-b53
          speaker: narrator
          text: Westondale started, and his eyes flashed, but he let the Kid finish.
        - id: ch01-b54
          speaker: malemute_kid
          text: "You won't find an ounce of food for the dogs or yourself until Five Fingers, and that's two hundred hard miles away. Watch for open water on the Thirty Mile River. Above Le Barge, take the big cutoff."
        - id: ch01-b55
          speaker: jack_westondale
          text: "How did you find out? The news couldn't have reached you before me."
        - id: ch01-b56
          speaker: malemute_kid
          text: "I didn't find out, and I don't want to. But that team was never yours. Sitka Charley sold it to those men last spring. He once told me you were honest, and I trust his judgment. Now I've seen your face, and I like it. I've also seen—oh, damn you, race for the salt water and that wife of yours, and—"
        - id: ch01-b57
          speaker: narrator
          text: The Kid pulled off a mitten and reached for his money sack.
        - id: ch01-b58
          speaker: jack_westondale
          text: "No. I don't need it."
        - id: ch01-b59
          speaker: narrator
          text: Tears froze on Westondale's cheeks as he crushed the Kid's hand in his own.
        - id: ch01-b60
          speaker: malemute_kid
          text: "Then don't save the dogs. Cut each one loose as soon as it drops. Buy more, even if they cost ten dollars a pound. You'll find them at Five Fingers, Little Salmon, and Hootalinqua. Keep your feet dry. Travel until it's twenty-five below. If it gets colder, stop, make a fire, and change your socks."
        - id: ch01-b61
          speaker: narrator
          text: Barely fifteen minutes later, bells jingled outside to announce more travelers. A mounted policeman from the Northwest Territory entered, followed by two dog drivers of mixed ancestry. Like Westondale, all three carried heavy weapons and showed the strain of the trail. The drivers had been born to this life and still carried themselves easily. The young policeman was nearly spent. Even so, the stubborn pride of his race held him to the pace he had chosen and would keep holding him there until he dropped in his tracks.
        - id: ch01-b62
          speaker: mounted_policeman
          text: "When did Westondale leave? He stopped here, didn't he?"
        - id: ch01-b63
          speaker: narrator
          text: The tracks outside had already answered that question. Malemute Kid caught Belden's eye, and Belden understood.
        - id: ch01-b64
          speaker: big_jim_belden
          text: "He left a good long while ago."
        - id: ch01-b65
          speaker: mounted_policeman
          text: "Come now, man. Give me a straight answer."
        - id: ch01-b66
          speaker: big_jim_belden
          text: "You seem mighty eager to catch him. Has he been causing trouble down Dawson way?"
        - id: ch01-b67
          speaker: mounted_policeman
          text: "He held up Harry McFarland's for forty thousand dollars. He exchanged the money at the P.C. store for a check on Seattle. If we don't catch him, nothing can stop him from cashing it. Now, when did he leave?"
        - id: ch01-b68
          speaker: narrator
          text: Every man hid his excitement. Malemute Kid had given them their signal, and the officer met blank faces wherever he looked. He crossed to Prince and demanded an answer. It hurt Prince to look into the open, earnest face of another Englishman and mislead him, but he answered with remarks about the trail instead.
        - id: ch01-b69
          speaker: narrator
          text: Then the officer saw Father Roubeau, who could not tell a lie.
        - id: ch01-b70
          speaker: father_roubeau
          text: "He left fifteen minutes ago. But he and his dogs had four hours of rest."
        - id: ch01-b71
          speaker: mounted_policeman
          text: "Fifteen minutes ahead, and rested! My God!"
          emotion: surprised
        - id: ch01-b72
          speaker: narrator
          text: Exhaustion and disappointment nearly made him faint. He staggered back, murmuring that he had come from Dawson in ten hours and his dogs were finished. Malemute Kid made him drink a mug of punch. Then the officer turned toward the door and ordered his drivers after him.
        - id: ch01-b73
          speaker: narrator
          text: The warmth of the cabin and the promise of rest were too tempting. The drivers protested fiercely instead of following. Malemute Kid knew their French dialect and listened closely. They swore the dogs were completely used up. Siwash and Babette would have to be shot before the first mile was over, and the rest were nearly as bad. Better for the men and the animals, they said, if everyone rested first.
        - id: ch01-b74
          speaker: mounted_policeman
          text: "Will you lend me five dogs?"
        - id: ch01-b75
          speaker: narrator
          text: He turned to Malemute Kid, but the Kid shook his head.
        - id: ch01-b76
          speaker: mounted_policeman
          text: "I'll sign a five-thousand-dollar check on Captain Constantine. Here are my papers. I have authority to spend whatever I judge necessary."
        - id: ch01-b77
          speaker: narrator
          text: Again the Kid refused without a word.
        - id: ch01-b78
          speaker: mounted_policeman
          text: "Then, in the Queen's name, I order you to give me those dogs."
        - id: ch01-b79
          speaker: narrator
          text: The Kid smiled as though he could not believe it and glanced at the weapons stacked around the cabin. The Englishman saw that he had no power there and turned toward the door. His drivers still would not move, so he spun on them and called them women and curs.
        - id: ch01-b80
          speaker: dog_driver_1
          text: "I'll travel your leader until he drops. Then I'll gladly plant you in the snow beside him."
          emotion: angry
        - id: ch01-b81
          speaker: narrator
          text: The older driver's dark face flushed as he straightened to his full height. The young officer used every scrap of will to walk steadily to the door and pretend he was fresh. Everyone saw and respected the effort. He could not hide the pain twisting across his face.
        - id: ch01-b82
          speaker: narrator
          text: Outside, frost-covered dogs lay curled in the snow. The men could hardly force them up. The poor animals whimpered beneath the stinging lash because the drivers were angry and cruel. Only after Babette, the lead dog, was cut from the traces could the sled break free and start.
        - id: ch01-b83
          speaker: big_jim_belden
          text: "That lying, dirty scoundrel!"
          emotion: angry
        - id: ch01-b84
          speaker: louis_savoy
          text: "By gar! He is no good!"
          emotion: angry
        - id: ch01-b85
          speaker: meyers
          text: "A thief!"
          emotion: angry
        - id: ch01-b86
          speaker: bettles
          text: "He's worse than an Indian!"
          emotion: angry
        - id: ch01-b87
          speaker: narrator
          text: They were angry first because Westondale had fooled them, and then because he had broken the northern code. In that country, honesty was the finest thing a man could possess.
        - id: ch01-b88
          speaker: big_jim_belden
          text: "And we helped the devil after we knew what he'd done."
        - id: ch01-b89
          speaker: narrator
          text: Accusing eyes turned to Malemute Kid. He rose from the corner, where he had been making Babette comfortable, and silently emptied the punch bowl for one final round.
        - id: ch01-b90
          speaker: malemute_kid
          text: "It's cold tonight, boys. Bitter cold. Every one of you has traveled a trail, so you know what that means. Don't jump on a dog when he's down. You've heard only one side. No better man than Jack Westondale ever shared food or blankets with you or me."
        - id: ch01-b91
          speaker: malemute_kid
          text: "Last fall, Jack gave his whole season's earnings, forty thousand dollars, to Joe Castrell. Joe was supposed to buy a share in Dominion. That share would be worth a million today. But Jack stayed in Circle City to nurse his partner through scurvy. And what did Castrell do? He went into McFarland's, bet past the limit, and lost every dollar. They found him dead in the snow the next day."
        - id: ch01-b92
          speaker: malemute_kid
          text: "All that time, poor Jack was planning to go Outside this winter, back to his wife and the boy he's never seen. Notice what he took. Exactly what his partner lost. Forty thousand dollars. Well, he's on his way out now. What are you going to do about it?"
        - id: ch01-b93
          speaker: narrator
          text: The Kid looked around at his judges and saw their faces soften. Then he lifted his mug.
        - id: ch01-b94
          speaker: malemute_kid
          text: "So here's to the man on the trail tonight. May his food last. May his dogs stay on their feet. May his matches always light. May God help him, may good luck travel with him, and—"
        - id: ch01-b95
          speaker: bettles
          text: "Confusion to the Mounted Police!"
          emotion: happy
        - id: ch01-b96
          speaker: narrator
          text: The empty cups crashed together.
