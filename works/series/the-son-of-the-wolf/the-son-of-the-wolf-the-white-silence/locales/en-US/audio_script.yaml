audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and observant, with the steady weight of a northern tale
        timbre: warm, clear, and weathered
        pace: measured
        pitch: medium-low
    mason:
      display_name: Mason
      tts:
        delivery: rough, lively, and plainspoken, softening under pain
        timbre: sturdy and slightly rasping
        pace: medium
        pitch: medium-low
    malemute_kid:
      display_name: Malemute Kid
      tts:
        delivery: restrained, practical, and deeply compassionate
        timbre: low and resonant
        pace: unhurried
        pitch: low
    ruth:
      display_name: Ruth
      tts:
        delivery: quiet, direct, and inwardly strong
        timbre: soft and clear
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: The Midday Halt
      blocks:
        - id: ch01-b01
          speaker: mason
          text: "Carmen won't last another two days."
        - id: ch01-b02
          speaker: narrator
          text: Mason spat out a piece of ice and looked sadly at the poor dog. Then he lifted her paw to his mouth and bit away the ice packed painfully between her toes.
        - id: ch01-b03
          speaker: mason
          text: "I've never known a dog with a fancy name to be worth a thing. The name weighs on them, and they fade away and die. But give a dog a sensible name like Cassiar, Siwash, or Husky, and nothing goes wrong. Now look at Shookum. He's got—"
        - id: ch01-b04
          speaker: narrator
          text: Shookum sprang without warning. His white teeth snapped just short of Mason's throat.
        - id: ch01-b05
          speaker: mason
          text: "So that's what you want, is it?"
        - id: ch01-b06
          speaker: narrator
          text: Mason struck him sharply behind the ear with the butt of the dog whip. The lean brute dropped into the snow, trembling, with yellow foam dripping from his fangs.
        - id: ch01-b07
          speaker: mason
          text: "As I was saying, look at Shookum. That dog has spirit. I'll wager he eats Carmen before the week is out."
        - id: ch01-b08
          speaker: malemute_kid
          text: "I'll wager on something else. Before this journey ends, we'll eat Shookum. What do you say, Ruth?"
        - id: ch01-b09
          speaker: narrator
          text: Malemute Kid turned the frozen bread he had set by the fire to thaw. Ruth dropped a piece of ice into the coffee to settle it, then looked from the Kid to her husband and on toward the dogs. She did not answer. The truth was too plain to need saying. Two hundred miles of untouched trail lay ahead. They had barely six days of food for themselves and nothing for the dogs.
        - id: ch01-b10
          speaker: narrator
          text: The two men and the woman gathered around the fire for their meager meal. Since this was only a midday halt, the dogs stayed in harness and watched every mouthful with hungry eyes.
        - id: ch01-b11
          speaker: malemute_kid
          text: "This is our last midday meal. And watch those dogs closely. Hunger is making them vicious. Give them one chance, and they'll pull a man down."
        - id: ch01-b12
          speaker: mason
          text: "And to think I was once president of an Epworth League and taught Sunday school."
        - id: ch01-b13
          speaker: narrator
          text: With that strange remark, Mason fell into a dream as he stared at his steaming moccasins. Ruth brought him back by filling his cup.
        - id: ch01-b14
          speaker: mason
          text: "Thank God we've got plenty of tea! I saw tea growing once, down in Tennessee. What I wouldn't give for hot corn bread right now! Never mind, Ruth. You won't be hungry much longer, and you won't have to wear moccasins either."
        - id: ch01-b15
          speaker: narrator
          text: Ruth's gloom lifted. Love filled her eyes as she looked at her white husband. He was the first white man she had ever seen. More than that, he was the first man she had known who treated a woman as something better than an animal or a beast made to carry loads.
        - id: ch01-b16
          speaker: mason
          text: "Yes, Ruth. Wait until we strike it rich and head Outside. We'll take the White Man's canoe across the Salt Water. It's rough, bad water, with great mountains rolling up and down. And it goes on so far. Ten sleeps, twenty sleeps, forty sleeps, and still nothing but water. Then you reach a great village, with as many people as mosquitoes in summer. The houses stand as high as ten pines, twenty pines!"
        - id: ch01-b17
          speaker: narrator
          text: Mason counted the days on his fingers. When he could not explain the height of the buildings, he looked helplessly at Malemute Kid and then stacked twenty imaginary pines on top of one another with his hands. The Kid smiled at the grand promises. Ruth stared in wonder and delight. She half thought Mason was teasing her, and even that pleased her.
        - id: ch01-b18
          speaker: mason
          text: "So much power! Then you step into a box and, poof, up you go!"
        - id: ch01-b19
          speaker: narrator
          text: He tossed his empty cup into the air, caught it neatly, and went on.
        - id: ch01-b20
          speaker: mason
          text: "And bang, down you come! Those are great medicine men. Say you stay at Fort Yukon and I go to Arctic City, twenty-five sleeps away. There's one long wire all the way. I take hold and say, ‘Hello, Ruth! How are you?’ You answer, ‘Is that my good husband?’ I say yes, and you tell me there's no soda left for bread. So I tell you, ‘Look in the cache, under the flour. Good-bye.’ You look, and there's plenty of soda. You're still at Fort Yukon and I'm still in Arctic City. Now that's powerful medicine!"
        - id: ch01-b21
          speaker: narrator
          text: Ruth smiled at the fairy tale with such open delight that both men burst out laughing. Then the dogs began fighting, and the wonders of the Outside were forgotten. By the time the snarling animals had been pulled apart, Ruth had tied down the sled loads and made everything ready.
        - id: ch01-b22
          speaker: mason
          text: "Mush, Baldy! Come on! Mush!"
        - id: ch01-b23
          speaker: narrator
          text: Mason cracked the whip and worked the first sled loose with the steering pole while the dogs whined in their traces. Ruth followed with the second team. Malemute Kid helped her start, then took the rear. He was strong enough to knock down an ox, but he could hardly bear to strike the suffering animals. He coaxed them with a kindness rarely shown by a dog driver, and almost wept with them in their misery.
        - id: ch01-b24
          speaker: malemute_kid
          text: "Come on, now. Mush on, you poor dogs with your aching feet."
        - id: ch01-b25
          speaker: narrator
          text: Several times the load refused to move. At last his patience won. The dogs hurried after the others, whimpering with every painful step.
    - id: ch02
      title: The White Silence
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After that, no one talked. The labor of the trail left no strength for words. Of all the numbing work in the Northland, traveling a trail is the worst, even when others have already broken it. Breaking a new trail is worse still.
        - id: ch02-b02
          speaker: narrator
          text: At every step, a broad snowshoe sinks until the snow reaches the knee. It must come straight up. The smallest turn can cross the shoes and bring a man full length into the treacherous snow. Once the first shoe clears the surface, it goes forward and down. Then the other foot has to rise straight through half a yard of snow. A beginner who somehow keeps his shoes apart may still collapse after a hundred yards. A man who stays ahead of the dogs for a whole day earns the pride he feels when he finally crawls into his sleeping bag. And anyone who survives twenty sleeps on the Long Trail is a man the gods might envy.
        - id: ch02-b03
          speaker: narrator
          text: The afternoon wore away. The travelers said nothing as they bent to their work, held in awe by the White Silence. Nature has many ways to show a man how small he is. The tides flow without end. Storms rage, earthquakes strike, and thunder rolls for miles across the sky. Those forces stun a man with their power. Yet none is so overwhelming as the White Silence when it does nothing at all and simply lies still.
        - id: ch02-b04
          speaker: narrator
          text: Every movement stops. The sky clears and the heavens harden like brass. Even the smallest whisper feels like a wrong thing in that place, and a man grows timid at the sound of his own voice. He sees himself as the only speck of life traveling across the ghostly emptiness of a dead world. He trembles at the boldness of being there at all, and understands that his life is no greater than a maggot's.
        - id: ch02-b05
          speaker: narrator
          text: Strange thoughts rise without being called. The mystery behind everything seems ready to speak. A man feels the fear of death, of God, and of the whole universe. He hopes for resurrection and life. He longs to live forever, while something trapped inside him struggles to be free. If ever a man walks alone with God, it is then.
        - id: ch02-b06
          speaker: narrator
          text: So the day passed. The river curved widely, and Mason led his team toward a shortcut across a narrow strip of land. The dogs refused the high bank. Again and again they climbed while Ruth and Malemute Kid pushed the sled, and again they slipped back.
        - id: ch02-b07
          speaker: narrator
          text: At last they all strained together. The starving dogs spent their final strength. Up they went, until the sled balanced on the top. Then the lead dog swung the team to the right and tangled Mason's snowshoes. Mason flew off his feet. One dog fell in the traces. The sled tipped backward and dragged everything to the bottom.
        - id: ch02-b08
          speaker: narrator
          text: Mason's whip slashed furiously among the dogs, falling hardest on the one that had fallen.
        - id: ch02-b09
          speaker: malemute_kid
          text: "Don't, Mason. That poor dog can barely stand. Wait, and we'll hitch my team to yours."
        - id: ch02-b10
          speaker: narrator
          text: Mason held the whip still until the Kid finished. Then the long lash flashed out and curled around the helpless animal.
        - id: ch02-b11
          speaker: narrator
          text: It was Carmen. She shrank into the snow and cried pitifully, then rolled onto her side. A dying dog lay between two angry friends. Ruth looked anxiously from one man to the other.
        - id: ch02-b12
          speaker: narrator
          text: Malemute Kid mastered himself, though his eyes were full of reproach. He bent down and cut Carmen free. Nobody spoke. They joined the two teams, conquered the bank, and started again. Behind them, the dying dog dragged herself along. A dog that can still travel is not shot. It is allowed one last chance to reach camp, where the hunters might find a moose.
        - id: ch02-b13
          speaker: narrator
          text: Mason soon regretted the blow, but he was too stubborn to apologize. He led the little procession into thick timber along the sheltered low ground, never dreaming that danger hung above him. Fifty feet from the trail stood a towering pine. It had waited there for generations, as if all that time had led to this one moment.
        - id: ch02-b14
          speaker: narrator
          text: Mason bent to tighten a loose thong on his moccasin. The sleds stopped, and the dogs sank silently into the snow. No wind stirred the frost-covered forest. The cold and stillness seemed to freeze nature's heart. A sigh moved through the air. They felt it more than heard it, the first warning of motion in a motionless world.
        - id: ch02-b15
          speaker: narrator
          text: Burdened with snow and years, the great tree began to fall. Mason heard the crack and tried to leap up. He was almost standing when the trunk struck him squarely on the shoulder.
        - id: ch02-b16
          speaker: narrator
          text: Malemute Kid had faced sudden danger and quick death many times. The pine needles were still trembling when he began giving orders and sprang to work. Ruth neither fainted nor wasted breath crying out. At his command, she threw all her weight onto a rough lever they had made in haste. It eased the pressure while she listened to her husband's groans. The Kid attacked the frozen trunk with his ax. Steel rang brightly against the wood, and every blow came with the forced, audible breath of the woodsman.
        - id: ch02-b17
          speaker: narrator
          text: At last the Kid cut through the trunk, and together they lifted what remained of Mason into the snow. Worse than his comrade's pain was the silent anguish on Ruth's face. Her expression asked what would happen, somehow hopeful and hopeless at once. They said little. People in the North learn early that words may be useless and deeds beyond price.
        - id: ch02-b18
          speaker: narrator
          text: At sixty-five degrees below zero, a man cannot lie long in the snow and live. They cut the sled lashings, wrapped Mason in furs, and set him on a bed of branches. A fire roared before him, fed by the tree that had crushed him. Behind him they stretched a piece of canvas to catch the heat and throw it back over his body.
        - id: ch02-b19
          speaker: narrator
          text: Men who have slept beside death know when it calls. Mason was crushed beyond hope. His right arm, his leg, and his back were broken. Below the hips, he could not move, and he was likely hurt inside. Now and then, a moan was the only sign that he lived.
        - id: ch02-b20
          speaker: narrator
          text: Nothing could be done. The pitiless night crawled past. Ruth endured with the despairing stillness of her people, while new lines settled into Malemute Kid's bronze face.
        - id: ch02-b21
          speaker: narrator
          text: Mason suffered least, because his mind had gone home to eastern Tennessee and the Great Smoky Mountains. He lived his childhood again. In his forgotten Southern speech, he wandered through swimming holes, raccoon hunts, and raids on watermelon patches. Ruth understood none of it. The Kid understood every word, and felt it as only a man can who has been shut away from civilization for years.
    - id: ch03
      title: Mason's Last Wishes
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Morning brought Mason back to himself. Malemute Kid knelt at his side and leaned close to catch the dying man's whispers.
        - id: ch03-b02
          speaker: mason
          text: "Remember when we met on the Tanana, four years before the next ice run? I didn't care so much for Ruth then. I thought she was pretty, and I liked the excitement of it. But I've grown to love her dearly. She's been a good wife. Whenever things were hard, she stood right beside me. And no one can match her at trading. Remember when she ran Moosehorn Rapids to get us off that rock, with bullets striking the water like hail? Remember the famine at Nuklukyeto, when she raced the moving ice to bring us the news?"
        - id: ch03-b03
          speaker: mason
          text: "She's been a better wife than the other one. You never knew I'd married before, did you? I tried marriage once down in the States. We had grown up together. I came away so she could divorce me, and she did."
        - id: ch03-b04
          speaker: mason
          text: "But this is about Ruth. I meant for us to strike it rich next year and go Outside, but now it's too late. Don't send her back to her people, Kid. Going back would be terribly hard. She's lived nearly four years on our bacon, beans, flour, and dried fruit. She knows our ways now and thinks they're better. How could she return to fish and caribou?"
        - id: ch03-b05
          speaker: mason
          text: "Take care of her yourself—no, you always kept away from women, and you never told me why you came North. Just be good to her. Send her to the States as soon as you can, but arrange it so she can return. She may grow homesick."
        - id: ch03-b06
          speaker: mason
          text: "And the baby has brought us closer. I pray it's a boy. My own flesh and blood, Kid. He must not stay in this country. If it's a girl, she mustn't stay either. Sell my furs. They'll bring at least five thousand, and the company holds another five thousand for me. Manage my claims along with yours. I think that bench claim will pay. Give the child a good education. Most of all, never let the child come back. This country was not made for white men."
        - id: ch03-b07
          speaker: mason
          text: "I'm dying, Kid. I may have three or four sleeps, no more. You have to leave. You must go on. Ruth is my wife, and the child is my boy—God, I hope it's a boy! You can't stay here with me. A dying man is ordering you to go."
        - id: ch03-b08
          speaker: malemute_kid
          text: "Give me three days. You might improve. Something could happen."
        - id: ch03-b09
          speaker: mason
          text: "No."
        - id: ch03-b10
          speaker: malemute_kid
          text: "Only three days."
        - id: ch03-b11
          speaker: mason
          text: "You must keep going."
        - id: ch03-b12
          speaker: malemute_kid
          text: "Then two days."
        - id: ch03-b13
          speaker: mason
          text: "This is my wife and my child, Kid. Don't ask me to risk them."
        - id: ch03-b14
          speaker: malemute_kid
          text: "One day."
        - id: ch03-b15
          speaker: mason
          text: "No. I order you—"
        - id: ch03-b16
          speaker: malemute_kid
          text: "Just one day. We can stretch the food that far, and I may bring down a moose."
        - id: ch03-b17
          speaker: mason
          text: "No—very well. One day, but not one minute more. And Kid, don't leave me to face the end alone. One shot. One pull of the trigger. You understand. My own flesh and blood, and I'll never see the child!"
          emotion: sad
        - id: ch03-b18
          speaker: mason
          text: "Send Ruth to me. I need to say good-bye. I must tell her to think of the child and leave before I die, or she may refuse to go with you. Good-bye, old friend. Good-bye."
          emotion: sad
        - id: ch03-b19
          speaker: mason
          text: "Kid, one more thing. Sink a hole above the pup, beside the slide. I found forty cents to the shovel there."
        - id: ch03-b20
          speaker: narrator
          text: The Kid bent lower to hear Mason's last faint words. At last, the dying man surrendered his pride.
        - id: ch03-b21
          speaker: mason
          text: "And Kid... I'm sorry about Carmen."
          emotion: sad
        - id: ch03-b22
          speaker: narrator
          text: Ruth stayed beside her husband, crying softly. Malemute Kid pulled on his parka and snowshoes, tucked his rifle under one arm, and slipped into the forest.
        - id: ch03-b23
          speaker: narrator
          text: He was no beginner in the stern grief of the North, yet he had never faced a choice this hard. From a distance, the answer was simple, almost like a sum worked out on paper. Three lives might be saved, while one was already doomed. But this was Mason. For five years they had stood shoulder to shoulder on rivers and trails, in camps and mines. Together they had faced death in the open country, on the water, and through famine. Those years had tied their friendship tight. The Kid had sometimes felt a shadow of jealousy from the first time Ruth came between them. Now that bond had to be cut, and his own hand must do it.
    - id: ch04
      title: Hunger at the Fire
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Kid prayed for one moose, only one. But every living creature seemed to have abandoned the land. Night found him crawling back to camp exhausted, with empty hands and a heavy heart. Then the dogs roared and Ruth's sharp cries drove him forward.
        - id: ch04-b02
          speaker: narrator
          text: He burst into camp and found Ruth surrounded by the snarling pack, swinging an ax. The dogs had broken the iron rule of their masters and rushed the food.
        - id: ch04-b03
          speaker: narrator
          text: The Kid turned his rifle around and joined the fight. In that ancient struggle, nature chose without mercy. Rifle and ax rose and fell again and again. Sometimes they struck, sometimes they missed. Lean bodies flashed past, their eyes wild and their fangs wet, while people and animals fought for mastery to the bitter end.
        - id: ch04-b04
          speaker: narrator
          text: At last the beaten dogs crept beyond the firelight. They licked their wounds and sent their misery up toward the stars. All the dried salmon was gone. Perhaps five pounds of flour remained for two hundred miles of wilderness.
        - id: ch04-b05
          speaker: narrator
          text: Ruth went back to Mason. Malemute Kid cut up the still-warm body of a dog whose skull the ax had crushed. He saved every useful piece. Only the hide and waste went to the same animals that had fought beside it moments before.
        - id: ch04-b06
          speaker: narrator
          text: Morning brought another trouble. The dogs had begun attacking one another. Carmen still held to her thin thread of life, but the pack dragged her down. The whip struck them and they shrank and cried beneath it, yet they would not scatter. They stayed until the last miserable trace was gone—bones, hide, hair, everything.
        - id: ch04-b07
          speaker: narrator
          text: Malemute Kid worked while Mason wandered through Tennessee again, speaking broken sermons and wild appeals to the church brothers of his youth.
        - id: ch04-b08
          speaker: narrator
          text: Ruth watched as the Kid used two small pines nearby. One after the other, he bent their tops toward each other until they nearly touched the ground, then bound them with moosehide thongs. He was making a cache like those hunters sometimes used to keep their meat away from wolverines and dogs.
        - id: ch04-b09
          speaker: narrator
          text: Next he beat the dogs into obedience and harnessed them to two sleds. He loaded everything except the furs around Mason. Those he wrapped tightly around his friend and lashed at both ends to the bent trees. One cut of his hunting knife would free the pines and lift the body high into the air.
    - id: ch05
      title: Across the Snow
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Ruth had heard her husband's final wishes, and she did not resist. All her life she had obeyed and watched other women obey the men who ruled them. Resistance did not seem possible to her.
        - id: ch05-b02
          speaker: narrator
          text: The Kid allowed her one great outburst of grief. She kissed her husband, though her own people had no such custom. Then the Kid led her to the first sled and helped her into her snowshoes. Blindly, almost by instinct, she took the steering pole and whip. At his direction, she called to the dogs and drove them out onto the trail.
        - id: ch05-b03
          speaker: narrator
          text: Malemute Kid returned to Mason, who had fallen into a coma. Long after Ruth vanished from sight, he crouched beside the fire. He waited, hoped, and prayed that his friend would die.
        - id: ch05-b04
          speaker: narrator
          text: It is a terrible thing to sit alone with painful thoughts in the White Silence. Ordinary darkness can be merciful. It wraps around a man like shelter and seems to breathe a thousand unseen sympathies. But the bright White Silence beneath its steel-colored sky is cold, clear, and without pity.
        - id: ch05-b05
          speaker: narrator
          text: One hour passed, and then another. Mason would not die. At noon, the sun never lifted its rim above the southern horizon. It only cast a hint of fire across the sky, then quickly pulled it away.
        - id: ch05-b06
          speaker: narrator
          text: Malemute Kid stirred at last and dragged himself over to Mason's side. Before he acted, he cast one look around the empty camp and the frozen land beyond it. The White Silence seemed to sneer at him, and a great fear swept over him.
        - id: ch05-b07
          speaker: narrator
          text: A rifle cracked. Mason swung upward into his grave in the air. Then Malemute Kid lashed the dogs into a wild gallop and fled across the snow.
