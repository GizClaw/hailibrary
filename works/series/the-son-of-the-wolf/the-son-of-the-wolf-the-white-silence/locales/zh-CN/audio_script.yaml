audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静克制，带着北国故事的冷峻与悲悯
        timbre: 温厚清晰，略带风霜感
        pace: 舒缓而有张力
        pitch: 中低
    mason:
      display_name: 梅森
      tts:
        delivery: 粗直爽快，重伤后虚弱而恳切
        timbre: 粗粝结实，带南方乡音的暖意
        pace: 平时明快，弥留时缓慢断续
        pitch: 中低
    malemute_kid:
      display_name: 马拉缪特小子
      tts:
        delivery: 寡言沉着，温和中有坚忍
        timbre: 深厚清朗
        pace: 从容稳健
        pitch: 低
  chapters:
    - id: ch01
      title: 饥饿的雪路
      blocks:
        - id: ch01-b01
          speaker: mason
          text: “卡门最多还能撑两天。”
        - id: ch01-b02
          speaker: narrator
          text: 梅森吐掉嘴里的冰，心疼地看着那只狗。他把卡门的脚塞进嘴里，一点点咬掉趾缝间冻得死紧的冰块。
        - id: ch01-b03
          speaker: mason
          text: “狗只要起个装腔作势的名字，就准没用。它们担不起那名字，慢慢便垮了。你见过叫卡西亚、锡沃什或哈士奇的狗出岔子吗？没有！再瞧斯库库姆，它可——”
        - id: ch01-b04
          speaker: narrator
          text: 话没说完，瘦狗猛地蹿起，雪白的牙齿擦过梅森的喉咙。
        - id: ch01-b05
          speaker: mason
          text: “你还真敢咬，是不是？”
        - id: ch01-b06
          speaker: narrator
          text: 梅森抡起狗鞭的柄，照着它耳后一敲。狗倒在雪里轻轻抽搐，黄色的涎沫从獠牙间滴下来。
        - id: ch01-b07
          speaker: mason
          text: “我刚才说，斯库库姆有股狠劲儿。我敢赌，不到一个星期，它就会吃掉卡门。”
        - id: ch01-b08
          speaker: malemute_kid
          text: “那我赌另一件事。这趟路没走完，咱们就得吃斯库库姆。露丝，你说呢？”
        - id: ch01-b09
          speaker: narrator
          text: 马拉缪特小子说着，把放在火前解冻的硬面包翻了个面。露丝扔一块冰进咖啡，好让渣滓沉下去。她先看看小子，再看看丈夫，最后望向那群狗，没有回答。也用不着回答。前方是两百英里没人踩过的雪路，三个人的口粮只勉强够六天，狗却一点食物也没有。除了吃掉狗，还能有什么结局？三个人围着火，开始吃那顿少得可怜的午饭。这里只是中途歇脚，狗仍套在挽具里，没法离开，只能眼巴巴看着他们送进嘴里的每一口食物。
        - id: ch01-b10
          speaker: malemute_kid
          text: “从明天起，中午不吃了。狗也得看牢，它们越来越凶。只要找到机会，扑倒一个人也不会犹豫。”
        - id: ch01-b11
          speaker: mason
          text: “我从前还当过埃普沃思协会的会长，也教过主日学校呢。”
        - id: ch01-b12
          speaker: narrator
          text: 这话来得没头没脑。梅森望着冒热气的鹿皮靴出了神，露丝给他斟满杯子，他才抬起头。
        - id: ch01-b13
          speaker: mason
          text: “幸好茶叶还多得很！我在田纳西亲眼见过茶树。这会儿要有一块热玉米饼，拿什么换我都愿意。别发愁，露丝，你很快就不用挨饿，也不用再穿鹿皮靴了。”
        - id: ch01-b14
          speaker: narrator
          text: 露丝脸上的阴霾散了，眼中涌起深深的爱。梅森是她见过的第一个白人，也是第一个不把女人只当牲口和驮畜的男人。
        - id: ch01-b15
          speaker: mason
          text: “等咱们淘够金，就去外面的世界。我们坐白人的大船，驶到咸水上。那水很坏，浪像大山，整天起起落落。水大得很，路也远，得走十觉、二十觉、四十觉。一路都是坏水。后来会到一座大村子，人多得像明年夏天的蚊子。那里的帐篷有十棵、二十棵松树那么高。嗨哟，真厉害！”
        - id: ch01-b16
          speaker: narrator
          text: 他们只能用各族语言混在一起的土话交谈。梅森说不清高楼有多高，先停下来求助似的看了小子一眼，随后只好费劲地打手势，把二十棵松树一棵接一棵摞到天上。小子带着快活的嘲意看他，露丝却又惊又喜地睁大眼。她半信丈夫是在逗她，可丈夫肯俯下身来，用她听得懂的办法讲这个故事，她已经很快乐。
        - id: ch01-b17
          speaker: mason
          text: “你再走进一个匣子，噗，人就升上去，砰，又落下来。多大的巫术！你人在育空堡，我人在二十五觉以外的北极城。中间有一条长线。我抓起线问：‘露丝，你好吗？’你问：‘是我的好丈夫吗？’我说是。你又说苏打粉没了，面包烤不好。我便告诉你，去储藏窖的面粉下面找。你一找，果然有好多苏打粉。你还在育空堡，我也还在北极城。嗨哟，好厉害的巫师！”
        - id: ch01-b18
          speaker: narrator
          text: 露丝听着这个神话般的故事，笑得天真极了，两个男人也一同放声大笑。狗群忽然打起来，把外面世界的奇迹截断了。他们赶去分开那些龇牙撕咬的狗。等混乱平息，露丝已经捆好雪橇，一切都能上路了。梅森利落地挥鞭，吆喝鲍尔迪向前，又用转向杆猛力一撬，把雪橇从雪窝里带出来。露丝赶着第二队跟上。小子先帮她起步，随后留在最后压队。他是个粗野的壮汉，一拳能打倒一头牛，却偏偏不忍心鞭打这些脚掌溃烂的狗。别的赶狗人绝不会像他这样耐心地哄它们。他看着狗受苦，自己几乎也要掉泪。试了几次，雪橇仍旧不动，他只是低声央求。
        - id: ch01-b19
          speaker: malemute_kid
          text: “走吧，可怜的家伙们。再往前走一走。”
        - id: ch01-b20
          speaker: narrator
          text: 狗群疼得呜咽，却终于拉动雪橇，追上前面的队伍。此后再没有人说话。赶路的苦役，容不得这种奢侈。
    - id: ch02
      title: 白色寂静
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 北国雪路上的活，最能消磨人的生气。即使走的是别人踩实的路，一个人若只用整天沉默的代价就能熬过一天，也已经算幸运。自己在深雪里开路，那才真正叫人心碎。宽大的雪鞋每走一步都会下陷，一直没到膝盖。接着，人得把脚笔直向上提，哪怕歪上一点，也准会失去平衡。等整只雪鞋离开雪面，才能向前踏下去。然后换另一只脚，同样笔直地抬上半码。初次尝试的人，只要没让两只雪鞋危险地绊在一起，也没在靠不住的雪面上摔个四脚朝天，就该庆幸了。可就算这样，走出一百码也会耗尽力气。谁能整整一天避开狗队，不挡它们的路，晚上就大可问心无愧地爬进睡袋，还会生出一种说不明白的骄傲。至于能在漫长雪路上连续走过二十觉的人，就连众神也会羡慕。
        - id: ch02-b02
          speaker: narrator
          text: 下午一点点过去。白色寂静压在四周，让人从心底生出敬畏。三个旅人弯着腰，只顾干活，谁也不再开口。大自然有许多办法，能叫人承认自己的渺小。潮水永不停息，暴风带着狂怒，地震猛然冲击大地，雷声像天上的炮火一样滚过长空。可这一切都比不上白色寂静静止不动的面孔。所有动静都停了，天空变得澄澈，穹顶像黄铜一样冰冷坚硬。在这里，哪怕最轻的一声耳语，都像是对天地的亵渎。人也会胆怯起来，连自己的嗓音都叫他害怕。他走过死去世界那片幽灵般的荒原，是唯一一个活动的生命斑点。他为这份胆大妄为而发抖，终于看清，自己的命不过像蛆虫一样微不足道。
        - id: ch02-b03
          speaker: narrator
          text: 陌生的念头不请自来，万物的秘密仿佛挣扎着要开口。人开始惧怕死亡、上帝和宇宙，又盼望复活与永生。囚在肉身里的灵魂徒劳地冲撞。若人真会独自与上帝同行，那就是在这样的时刻。
        - id: ch02-b04
          speaker: narrator
          text: 河道转了一个大弯，梅森把狗队领向横穿陆颈的近路。高高的河岸挡住了狗。露丝和小子在后面推，它们一遍遍往上冲，又一遍遍滑下来。最后，人和狗同时使出全力。饿得虚弱的狗榨尽最后一点力气，雪橇终于摇摇晃晃地到了岸顶。可领头狗忽然往右转，整队狗荡到梅森背后，缠住他的雪鞋。梅森被拽倒，一条狗也摔了，雪橇翻回岸下，把一切又拖了下去。
        - id: ch02-b05
          speaker: narrator
          text: 鞭子唰地抽进狗群，最狠的一下落在那条摔倒的狗身上。
        - id: ch02-b06
          speaker: malemute_kid
          text: “别打了，梅森。它只剩最后一点力气。等一等，把我的狗队也套上。”
        - id: ch02-b07
          speaker: narrator
          text: 梅森偏偏把鞭子压住，一直等小子说完最后一个字，才猛地甩出长鞭。鞭梢在空中一闪，整个绕住了那只闯祸的狗。那正是卡门。它缩在雪里，凄惨地叫了一声，然后侧身倒下。一条狗正在死去，两个相依为命的伙伴却彼此动怒。这只是雪路上一件小事，却也是一幕叫人难过的惨剧。露丝担忧地从一个男人看到另一个男人。小子忍住了怒气，眼里却有说不尽的责备。他俯下身，割断卡门的挽索。谁也没有再说话。他们把两队狗合套在一起，终于越过河岸，雪橇重新上路。卡门只能拖着身体，远远跟在队尾。北国有一条规矩，只要一只牲口还能走，人们便不会开枪打死它，总会给它最后一次机会。它若能爬回营地，也许猎人正好打到一头驼鹿，它就还有救。
        - id: ch02-b08
          speaker: narrator
          text: 梅森已经后悔，却倔强得不肯道歉。他走在队伍最前面，没想到危险正悬在空中。洼地背风，松树挤得很密。他们穿行其间，路外五十英尺处，一棵高松直指天空。它在那里站了多少代，命运似乎也等了多少代，只等今天这个结局。也许梅森的结局同样早已写定。
        - id: ch02-b09
          speaker: narrator
          text: 梅森弯腰去系松开的靴带。雪橇停住，狗群无声地卧进雪里。四周静得怪异，没有一丝风碰动结霜的树林。外太空般的寒冷与寂静冻透了大自然的心，也击中了它发抖的嘴唇。空气里荡过一声叹息。三个人没有真正听见，只觉得凝固的虚空中，有什么东西就要动了。那棵被岁月和积雪压弯的大树，开始演生命悲剧的最后一幕。梅森听见树干断裂，想要跃起。身子刚直起来，重击便正落在肩上。
    - id: ch03
      title: 倒下的松树
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 突来的危险和近在眼前的死亡，小子见过太多。松针还在颤，他已经发出命令，扑上前去。露丝没有昏倒，也没有作无用的哭喊。她照他说的，把全身重量压上临时做成的撬杆，一面减轻树干的压力，一面听丈夫呻吟。小子抡斧砍树。钢刃咬进冻木，发出清脆的响声。每砍一下，他都逼出一声沉重的喘息。
        - id: ch03-b02
          speaker: narrator
          text: 小子终于把那团曾经是一个人的可怜躯体移到雪地上。梅森的痛已经够重了，可露丝脸上那份无声的悲痛更叫人难受。她望着小子，像是在问丈夫还有没有希望。那目光里有希望，却又明明已经绝望。他们没说多少话。北国的人很早便学会，言语救不了人，真正值钱的是立刻动手。此时气温低到零下六十五度，一个人直接躺在雪里，活不过几分钟。他们割开捆雪橇的绳，用厚毛皮裹住梅森，再把他安置在松枝铺成的床上。面前很快燃起熊熊火焰，烧的正是砸伤他的那棵树。身后和头顶又斜撑起一幅简陋帆布。帆布接住火焰放出的热量，再把暖意送回梅森身上。这种物理的诀窍，不是从书本得来，而是北国的人从自然源头学会的。
        - id: ch03-b03
          speaker: narrator
          text: 与死亡同床睡过的人，听得出召唤何时来临。梅森伤得太重，一眼便看得明白。右臂、右腿和脊背都断了，腰部以下瘫痪，内脏多半也受了伤。偶尔一声呻吟，是他活着的唯一迹象。没有希望，也没有别的事可做。冷酷的长夜慢慢爬过。露丝用她族人绝望而坚忍的沉默熬着，小子古铜色的脸上又多了几道深纹。
        - id: ch03-b04
          speaker: narrator
          text: 三人中，反倒是梅森受的苦最少。他的心神回到了田纳西东部的大烟山，重新过起童年的日子。他又说起早已忘掉的南方乡音，念着游泳的水潭、猎浣熊的夜晚和偷西瓜的恶作剧。露丝一个字也听不懂，小子却全懂。一个人离开文明世界多年，才会懂得那些话有多叫人心痛。
        - id: ch03-b05
          speaker: narrator
          text: 早晨，梅森醒了。小子俯下身，去听他微弱的声音。
        - id: ch03-b06
          speaker: mason
          text: “还记得吗？咱们四年前在塔纳纳碰到一起，再过一次河冰开裂，就整整四年。那时我不太在意露丝，只觉得她漂亮，这件事又挺刺激。可这些年，我越来越舍不得她。她是个好妻子。每回遇上难处，她总守在我身边。做买卖更没有人比得过她。她闯过穆斯霍恩急流救咱们时，子弹像冰雹一样打着水面。努克卢基耶托闹饥荒，也是她赶在河冰开裂前跑回来报信。”
        - id: ch03-b07
          speaker: mason
          text: “她比我从前那个妻子好多了。你不知道我结过婚吧？我一直没说。我在美国本土成过一次家，我们还是一起长大的。后来我离开，让她有机会离婚。她也真的离了。”
        - id: ch03-b08
          speaker: mason
          text: “那件事和露丝无关。我本想明年淘够金，就带她去外面的世界，可已经来不及了。别把她送回族人那里。她跟着我们吃了快四年的熏肉、豆子、面粉和干果，再叫她回去只吃鱼和驯鹿肉，她受不了。她见过我们的生活，知道它更好。你照顾她吧，小子——不，你总是躲着她们，也从没告诉我为什么来这里。那就好好待她，尽早送她去美国本土。还得给她留条回来的路，她也许会想家。”
        - id: ch03-b09
          speaker: mason
          text: “还有孩子。这孩子让我们更亲近了。我只盼是男孩。小子，那是我的亲骨肉。他不能留在北国。若是女孩，就更不能留。把我的毛皮卖掉，至少值五千块，公司里还有差不多五千。我的产业和你的放在一起管。河阶地那块矿权，我看会有收获。让孩子好好上学，最要紧的是，绝不能让他回来。这个地方不是给白人活的。”
        - id: ch03-b10
          speaker: mason
          text: “我快死了，最多还有三四觉。你得继续走，非走不可！那是我的妻子，我的儿子。上帝啊，我只求他是个男孩！你不能留下陪我。我是个快死的人，我命令你上路。”
          emotion: fearful
        - id: ch03-b11
          speaker: malemute_kid
          text: “给我三天。也许你会好起来，也许会有转机。”
        - id: ch03-b12
          speaker: mason
          text: “不行。”
        - id: ch03-b13
          speaker: malemute_kid
          text: “只要三天。”
        - id: ch03-b14
          speaker: mason
          text: “你必须走。”
        - id: ch03-b15
          speaker: malemute_kid
          text: “两天。”
        - id: ch03-b16
          speaker: mason
          text: “那是我的妻子和儿子。你不该这样求。”
        - id: ch03-b17
          speaker: malemute_kid
          text: “一天。”
        - id: ch03-b18
          speaker: mason
          text: “不，不！我命令你——”
        - id: ch03-b19
          speaker: malemute_kid
          text: “就一天。我们省着吃，口粮还能撑到头。我也许会打到一头驼鹿。”
        - id: ch03-b20
          speaker: mason
          text: “好吧，一天，一分钟也不能多。还有，别留我独自面对死亡。只要一枪，扳一下扳机，你明白。那是我的亲骨肉啊，我却活不到看他一眼！”
          emotion: fearful
        - id: ch03-b21
          speaker: mason
          text: “叫露丝过来。我要和她道别，告诉她想着孩子，别等我死了才走。不由我亲口说，她也许不肯跟你走。再见，老伙计。再见。”
          emotion: sad
        - id: ch03-b22
          speaker: mason
          text: “还有一件事。在小矿脉上方、滑坡旁边挖个坑。我在那里一铲淘出过四十美分。”
        - id: ch03-b23
          speaker: mason
          text: “小子……卡门那件事，我很抱歉。”
          emotion: sad
    - id: ch04
      title: 最后一天
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 为听清最后那句，小子把身子俯得更低。梅森临死前终于放下了骄傲。随后，露丝守着丈夫低声哭泣，小子穿上皮大衣，套好雪鞋，把步枪夹在腋下，悄悄走进森林。他见惯北国严酷的悲剧，却从没碰过这样难解的题。若只按数字算，三个可能活下去的人，当然胜过一个注定要死的人。可他仍然犹豫。五年来，他们在河上、雪路、营地和矿场中肩并着肩，一起面对荒野、洪水与饥饿中的死亡。同伴的情谊越拧越紧。露丝第一次来到他们中间时，小子甚至隐约嫉妒过她。现在，这条纽带却要由他亲手割断。
        - id: ch04-b02
          speaker: narrator
          text: 他一遍遍祈求，只要遇见一头驼鹿就好。可野兽像是全从这片土地上消失了。夜色降临，小子精疲力竭地爬回营地，两手空空，心也沉重。狗群在咆哮，露丝尖声呼喊，他连忙冲过去。
        - id: ch04-b03
          speaker: narrator
          text: 露丝被龇牙怒吼的狗围在中间，只能抡着斧头四下劈打。狗群已经破坏主人定下的铁律，冲向了最后的食物。小子倒转步枪，也冲进战团。自然选择那场古老的游戏，就这样在原始荒野里毫不留情地上演。枪托和斧头一次次举起，又一次次落下。有时正正击中，有时擦身落空，节奏单调得叫人心寒。矫健的狗身在两人眼前来回闪动，眼里全是疯狂，獠牙上滴着涎水。人与兽为了谁能主宰这一小片营地，一直拼杀到最苦涩的结局。终于，落败的狗群退了。它们爬到火光照不到的边缘，低头舔着各自的伤口，又仰头朝星空哀号，把痛苦一声声送进寒夜。
        - id: ch04-b04
          speaker: narrator
          text: 干鲑鱼全被吃光了。只剩约五磅面粉，却还有两百英里荒野。露丝回到丈夫身边。小子剁开一条刚被斧头砸碎脑袋、身体尚暖的狗，把每块肉仔细收好。只有狗皮和内脏，扔给了片刻前还与它并肩的同伴。
        - id: ch04-b05
          speaker: narrator
          text: 早晨又有麻烦。狗开始互相残杀。卡门还攀着最后一点生命，却被狗群扑倒。鞭子不停落下，它们挨打时缩起身子哀叫，却死也不散。直到卡门的骨头、皮和毛全被吞掉，什么也不剩。
        - id: ch04-b06
          speaker: narrator
          text: 小子继续做自己的事，耳边是梅森的呓语。梅森又回到了田纳西，正对昔日教会里的弟兄说着杂乱的演辞，发出狂热的劝诫。
        - id: ch04-b07
          speaker: narrator
          text: 小子借着附近的松树，飞快搭起一座高架储藏台。猎人有时就用这种架子保存肉食，免得狼獾和狗偷走。他先把一棵小松树的树梢拉向另一棵，再拉下第二棵。两个树梢互相靠近，一直被压到几乎贴住地面。他用驼鹿皮绳把它们牢牢绑紧。接着，他挥鞭把狗群打服，给它们重新套上两架雪橇，把能带走的东西全部装好，只留下裹住梅森的毛皮。那些毛皮被他重新包紧，结结实实捆在梅森身上，两端分别系住弯下来的松树。等他们离开，只需用猎刀划断绳索，松树就会猛然弹起，把梅森的身体高高送到空中，免受野兽啃食。
        - id: ch04-b08
          speaker: narrator
          text: 露丝已经听过丈夫最后的嘱咐，所以没有反抗。这个可怜姑娘从小就学会了服从。她自己向男人低头，也看着身边所有女人向那些造物的主宰低头。女人竟会反抗男人，在她看来根本不合世上的道理。小子只准她尽情哭了一回。她俯身吻别丈夫，而她自己的族人原本没有亲吻这个习俗。随后，小子把她领到最前面的雪橇旁，帮她穿好雪鞋。露丝眼前一片茫然，只凭本能握住转向杆和鞭子，吆喝狗群踏上雪路。小子又走回梅森身边。梅森已经陷入昏迷。露丝的身影早就消失在远方，小子仍蹲在火旁。他等着，盼着，也祈求朋友能在他动手之前，自己咽下最后一口气。
    - id: ch05
      title: 半空中的坟墓
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 在白色寂静中独自守着痛苦的念头，实在难熬。幽暗里的寂静还有仁慈。它会像一层帷幕，把人严严实实地保护起来。它无声地呼吸，仿佛四面八方都有看不见的同情陪着人。可是这片白色寂静不同。钢铁般的天空下，一切明亮、清澈而寒冷，没有藏身的暗处，也没有一点怜悯。
        - id: ch05-b02
          speaker: narrator
          text: 一个小时过去了。两个小时也过去了。梅森就是不肯死。小子仍守在旁边，时间在没有声音的雪地上一点点挪动。到了正午，太阳的边缘始终没能越过南方地平线。它只把一抹像火却又不是火的微光横投在天空，停留了短短片刻，很快又把那点光收了回去。
        - id: ch05-b03
          speaker: narrator
          text: 小子像从梦中醒来，拖着疲惫沉重的身体，一步步走到朋友身边。他停在那里，朝四周望了一眼。白色寂静像是在冷笑，一阵巨大的恐惧猛然抓住了他。
        - id: ch05-b04
          speaker: narrator
          text: 一声枪响骤然划破寂静。梅森荡上了半空中的坟墓。马拉缪特小子狠抽狗群，让它们发疯似的飞奔，自己也逃过无边雪原。
