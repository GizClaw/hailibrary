  chapters:
    - id: ch01
      title: Into the North
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A man who travels into a far country must be ready to unlearn much of what he knows. He has to take up the customs that keep people alive in the new land. Old ideals and old gods may have to be abandoned, and the rules that once guided him may have to be turned upside down. A man who can adapt may even enjoy the strangeness of the change. A man fixed in his old ways will fight rules he does not understand, in body and in spirit. That struggle works on him and on everyone around him. It breeds one trouble after another. If he cannot fit himself to the new life, he had better go home. If he waits too long, he will die.
        - id: ch01-b02
          speaker: narrator
          text: A man leaving an old civilization for the young and simple North soon learns that physical comforts matter least. Rough food can replace fine meals. Soft, shapeless moccasins can replace stiff leather shoes, and snow can replace a feather bed. Those changes are easy enough. The painful change must happen in his mind, especially in the way he treats his companions. Ordinary courtesy is not enough there. He needs patience, tolerance, and an unselfish heart. Only then can he earn true comradeship, which is worth more than any comfort. A man does not merely say thank you. He means it without speaking and proves it by answering one good deed with another. In the North, the deed must replace the word, and the spirit matters more than the rule.
        - id: ch01-b03
          speaker: narrator
          text: When news of Arctic gold rang through the world, Carter Weatherbee left his comfortable clerk's job. He gave half his savings to his wife and spent the rest on an outfit. Romance had been ground out of him by years of business. He was simply tired of the endless routine and willing to risk much for a large return. He ignored the trails that northern pioneers had used for twenty years. Instead, he hurried to Edmonton in the spring and joined a party of men.
        - id: ch01-b04
          speaker: narrator
          text: The party itself was ordinary. Its plan was not. Like everyone else, they meant to reach the Klondike, but their chosen route shocked even people born to the hardships of the Northwest. It surprised Jacques Baptiste too. His mother was Chippewa and his father a runaway voyageur. He had been born in a deerskin lodge far north of the sixty-fifth parallel and fed on raw tallow as a baby. He hired on and promised to go as far as the ice that never opened, but whenever they asked his advice, he shook his head.
        - id: ch01-b05
          speaker: narrator
          text: Percy Cuthfert joined them as well, under an unlucky star. He was an ordinary man, but his bank account was as deep as his education, and both were considerable. Unlike Weatherbee, he did not even have weariness or the hope of profit to explain his choice. He had no sensible reason to go. He was unusually sentimental and mistook that feeling for the true spirit of romance and adventure. Many others had made the same mistake, and some had paid for it with their lives.
        - id: ch01-b06
          speaker: narrator
          text: At the first spring thaw, the party followed the running ice down Elk River. Their great fleet carried a large outfit, along with a rough company of voyageurs, women, and children. Every day they fought canoes and heavy boats, mosquitoes and other pests. At each portage they sweated, strained, and cursed. Hard labor strips a man down to the roots of his nature. Before Lake Athabasca had disappeared behind them, every man had shown his true colors.
        - id: ch01-b07
          speaker: narrator
          text: Weatherbee and Cuthfert proved to be the shirkers and constant grumblers. Each complained more than the entire party together. Neither volunteered for the countless small camp duties. Whenever water had to be carried, wood chopped, dishes washed, or some needed object dug out of the outfit, the two men suddenly found a sprain or blister that demanded attention.
        - id: ch01-b08
          speaker: narrator
          text: At night they went to bed first while work remained. In the morning they rose last, though camp should have been ready before breakfast. They were first to eat and last to cook. They reached first for every rare treat and somehow failed to notice when they took another man's share. At the oars, they let the moving boat carry their blades instead of pulling their weight. They believed no one saw. Their companions muttered and came to hate them. Jacques Baptiste cursed them openly from morning to night, but Jacques Baptiste was no gentleman.
        - id: ch01-b09
          speaker: narrator
          text: At Great Slave Lake they bought Hudson Bay dogs. Dried fish and pemmican loaded the boats down to their sides. The swift Mackenzie current carried canoes and heavy boats into the Great Barren Ground. They searched every promising stream that fed the river, but the pay dirt always danced farther north. By Great Bear Lake, the common fear of the Unknown Lands had begun to empty the party. The voyageurs deserted one by one. At Fort Good Hope, the last and bravest of them bent into the towlines. Now they fought their way against the same current that had carried them so easily before.
        - id: ch01-b10
          speaker: narrator
          text: Only Jacques Baptiste stayed. Had he not sworn to travel to the never-opening ice? Now the men constantly studied their lying maps, which had mostly been drawn from hearsay.
        - id: ch01-b11
          speaker: narrator
          text: They had to hurry. The summer sun had passed its farthest point north and was already leading winter south again. They followed the shores of the bay where the Mackenzie empties into the Arctic Ocean, then found the mouth of the Little Peel River. There the cruel upstream labor began. They hauled on towlines, pushed with poles, and fought with paddles. They carried loads over one portage after another, using straps across their foreheads. Rapids stopped them, and rough ground punished them. The two Incapables suffered more than ever. Weatherbee lost his taste for great risks. Cuthfert learned in pain what the romance of adventure truly cost.
        - id: ch01-b12
          speaker: narrator
          text: One day they refused to work. Jacques cursed them savagely, and at last they turned on him. He beat them both and sent them back to their tasks, bruised and bleeding. Neither man had ever been handled that way before.
        - id: ch01-b13
          speaker: narrator
          text: At the headwaters of the Little Peel, the party left its river boats behind. They spent the whole remainder of summer making the great portage across the Mackenzie watershed to the West Rat. The name belonged to a little stream, but it gave them a path onward. It flowed into the Porcupine, and the Porcupine in turn joined the Yukon where that mighty northern highway bends back toward the Arctic Circle.
        - id: ch01-b14
          speaker: narrator
          text: Winter won the race. One day the men found thick ice forming in an eddy. They tied their rafts beside it and rushed every piece of their outfit ashore while they still could. Through the night, the river froze, jammed, and broke open several times. By morning it had gone to sleep for the season, locked solid beneath them. Travel by water was over. The party gathered in council to decide what came next. Weatherbee and Cuthfert whined while Sloper spread out the map and measured its uncertain scale with his thumbnails.
        - id: ch01-b15
          speaker: sloper
          text: "We can't be more than four hundred miles from the Yukon."
        - id: ch01-b16
          speaker: jacques_baptiste
          text: "Hudson Bay post was there long ago. No good now."
        - id: ch01-b17
          speaker: narrator
          text: Jacques's father had traveled that way for the Fur Company in the old days and had left two frozen toes somewhere along the trail.
        - id: ch01-b18
          speaker: party_member
          text: "Good grief! There aren't any white men there?"
        - id: ch01-b19
          speaker: sloper
          text: "Not one. But Dawson is only another five hundred miles up the Yukon. Call it a rough thousand miles from here."
        - id: ch01-b20
          speaker: narrator
          text: Weatherbee and Cuthfert groaned together.
        - id: ch01-b21
          speaker: party_member
          text: "How long will it take us, Baptiste?"
        - id: ch01-b22
          speaker: narrator
          text: The guide thought for a moment.
        - id: ch01-b23
          speaker: jacques_baptiste
          text: "Everybody work hard and nobody give out, maybe ten, twenty, forty, fifty days. Those babies come too? Then nobody knows. Maybe when hell freezes. Maybe not even then."
        - id: ch01-b24
          speaker: narrator
          text: He pointed to the two Incapables. Work on snowshoes and moccasins stopped. Someone called a missing man out of an ancient cabin beside the fire. The cabin was one of the North's many mysteries. No one knew who had built it or when. Two stone-covered graves stood outside. Perhaps they held the answer, though no one knew whose hands had piled the stones.
        - id: ch01-b25
          speaker: narrator
          text: The deciding moment had come. Jacques stopped fitting a harness and held a struggling dog down in the snow. The cook silently objected to the delay, threw bacon into a bubbling pot of beans, and came over. Then Sloper stood. He looked almost absurd beside the two healthy Incapables. He was yellow and weak, still fleeing north from a South American fever without ever stopping to recover. He weighed perhaps ninety pounds with his heavy hunting knife, and his grizzled hair showed that his best years were past. Either young man had ten times his muscle. Still, Sloper could walk either one into the ground in a day. His body was held prisoner by a restless spirit, old stubbornness, and the quick judgment that made him act at once. All that day, this frail man had driven stronger companions toward a thousand miles of almost unimaginable hardship.
        - id: ch01-b26
          speaker: sloper
          text: "Everyone who wants to start with the dogs as soon as the ice sets, say aye."
        - id: ch01-b27
          speakers: [jacques_baptiste, westerner, party_member, cook]
          ensemble: chorus
          text: "Aye!"
        - id: ch01-b28
          speaker: narrator
          text: Eight voices answered, voices that would leave a long trail of curses across hundreds of painful miles.
        - id: ch01-b29
          speaker: sloper
          text: "Anyone against it?"
        - id: ch01-b30
          speakers: [carter_weatherbee, percy_cuthfert]
          ensemble: duo
          text: "No!"
        - id: ch01-b31
          speaker: narrator
          text: For the first time, the Incapables agreed without protecting separate interests.
        - id: ch01-b32
          speaker: carter_weatherbee
          text: "And what do you plan to do about that?"
        - id: ch01-b33
          speakers: [jacques_baptiste, westerner, party_member, cook]
          ensemble: chorus
          text: "The majority decides!"
        - id: ch01-b34
          speaker: sloper
          text: "I know the whole expedition may collapse without you. Still, if we try very hard, I believe we can manage. What do you fellows think?"
        - id: ch01-b35
          speaker: narrator
          text: The others cheered him loudly.
        - id: ch01-b36
          speaker: percy_cuthfert
          text: "But look here. What is a man like me supposed to do?"
        - id: ch01-b37
          speaker: westerner
          text: "Aren't you coming with us?"
        - id: ch01-b38
          speaker: percy_cuthfert
          text: "No..."
        - id: ch01-b39
          speaker: westerner
          text: "Then do whatever you please. It isn't our concern. You might settle things with that dear partner of yours."
        - id: ch01-b40
          speaker: narrator
          text: He pointed at Weatherbee.
        - id: ch01-b41
          speaker: westerner
          text: "He'll want to know what you mean to do when it's time to cook or gather wood."
        - id: ch01-b42
          speaker: sloper
          text: "Then it's settled. We leave tomorrow, even if we only go five miles. That will put everything in order and help us remember anything we've forgotten."
        - id: ch01-b43
          speaker: narrator
          text: The next day the sleds groaned away on steel runners. The dogs leaned low into harnesses they had been born to die in. Jacques stopped beside Sloper for a final look. Smoke curled sadly from the cabin's Yukon stovepipe, while the two Incapables watched from the doorway. Sloper put a hand on Jacques's shoulder.
        - id: ch01-b44
          speaker: sloper
          text: "Jacques Baptiste, have you ever heard of the Kilkenny cats?"
        - id: ch01-b45
          speaker: narrator
          text: Jacques shook his head.
        - id: ch01-b46
          speaker: sloper
          text: "They fought until there was no hide, no hair, and no howl left. Nothing at all. You understand? Good. Those two hate work. They'll be alone in that cabin for a long, dark winter. Kilkenny cats. Well?"
        - id: ch01-b47
          speaker: narrator
          text: The Frenchman in Jacques shrugged. The Indian in him said nothing. Yet that shrug answered clearly and foretold what was coming.
    - id: ch02
      title: The Cabin
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At first, life in the little cabin went well. Their companions' rough teasing had made Weatherbee and Cuthfert understand that each was now responsible for the other. Besides, two healthy men did not have much work to do. With Jacques and his cruel, driving hand gone, both felt wonderfully free. They threw themselves into the new life almost joyfully. Each tried to outdo the other in every small chore and performed simple tasks with surprising enthusiasm. The friends who were wearing out their bodies and souls on the Long Trail would hardly have believed it.
        - id: ch02-b02
          speaker: narrator
          text: They had no reason to worry. Forest crowded the cabin on three sides, giving them all the wood they could use. The Porcupine River slept a few yards from the door. A hole in its winter coat offered bubbling water, clear as crystal and painfully cold. Soon even that annoyed them. The hole kept freezing, and they spent miserable hours chopping it open.
        - id: ch02-b03
          speaker: narrator
          text: The unknown builders had extended the cabin's side logs to support a raised storehouse at the back. Most of the party's provisions waited inside, safely lifted above the ground. There was food without limit for the two men, enough for three times the number who would live on it. They faced no danger of ordinary hunger. The trouble was that most of the food had been chosen for strength and survival. It could build muscle and toughen the body, but it offered little pleasure to the tongue.
        - id: ch02-b04
          speaker: narrator
          text: They had plenty of sugar for two ordinary men, but these two behaved like children. They learned how good hot water tasted when it held as much sugar as it could take. They used sugar freely, drowning pancakes in rich white syrup and soaking their bread crusts. Coffee and tea consumed more, and dried fruit consumed most of all. Their first angry words were spoken over the sugar. That was no small beginning. When two men depend entirely on each other for company through a northern winter, the first quarrel is a serious thing.
        - id: ch02-b05
          speaker: narrator
          text: Weatherbee liked to talk loudly and at great length about politics. Cuthfert had always collected the income from his investments and let the country manage as well as it could without his help. He either ignored the subject or answered with some sharp little saying that reduced a whole argument to a phrase. Weatherbee was too dull to understand those clever phrases. He never gave the response Cuthfert expected. Cuthfert hated wasting his best wit on such an audience. He was used to dazzling people with his brilliance, and the loss of that audience felt like a personal injury. Without quite knowing it, he blamed his thickheaded companion for taking the pleasure away.
        - id: ch02-b06
          speaker: narrator
          text: Except for being alive, they shared nothing. Weatherbee had spent his life as a clerk. Cuthfert held a master's degree, painted a little, and had written a good deal. Weatherbee came from a lower social class but thought himself a gentleman. Cuthfert was a gentleman and knew it. Yet a man can be a gentleman without having the first instinct for comradeship.
        - id: ch02-b07
          speaker: narrator
          text: Weatherbee cared for physical pleasures while Cuthfert cared for beauty. The clerk told long stories about love affairs, most of them invented. To the sensitive Cuthfert, they smelled like sewer air. He called Weatherbee a filthy, ignorant brute fit to live with pigs. Weatherbee answered that Cuthfert was a weakling and a cad. He could not have explained what cad meant, but the word did its work.
        - id: ch02-b08
          speaker: narrator
          text: Weatherbee sang for hours, missing every third note in songs like “The Boston Burglar” and “The Handsome Cabin Boy.” Cuthfert wept with rage until he could bear no more and fled into the cold. There was no escape outside. The terrible frost could only be endured for a short time before it drove him back. Inside, the beds, stove, and table all stood in a space only ten feet by twelve. The cabin pressed them together every hour of every day. Each man's mere presence became a personal insult to the other.
        - id: ch02-b09
          speaker: narrator
          text: They fell into bitter silences that grew longer and stronger. A sharp glance or a curled lip sometimes broke through, though each tried to pretend the other was not there. Both began to wonder how God had ever come to create the other man.
        - id: ch02-b10
          speaker: narrator
          text: With little to do, time became unbearable. That made them lazier still. Their bodies sank into a dull heaviness, and the smallest chore felt like an outrage. One morning, when it was Weatherbee's turn to make their breakfast, he rolled from his blankets while Cuthfert snored. He lit the grease lamp and the fire. The kettles were frozen, and no water was ready for washing. While the ice thawed, he sliced bacon and began the hateful work of making bread. Cuthfert watched secretly through half-closed eyes.
        - id: ch02-b11
          speaker: narrator
          text: A quarrel followed. They cursed each other warmly and agreed that each man would cook for himself from then on. A week later, Cuthfert skipped his morning wash and calmly ate the meal he had made. Weatherbee grinned. After that, they both gave up the foolish habit of washing.
        - id: ch02-b12
          speaker: narrator
          text: As the sugar and other small luxuries disappeared, each man feared he was not getting his share. To keep the other from stealing it, both began stuffing themselves. The treats suffered, and so did the men.
        - id: ch02-b13
          speaker: narrator
          text: They had no fresh vegetables and took no exercise. Their blood weakened, and a foul purple rash crept across their bodies. Still they ignored the warning. Then their muscles and joints began to swell. Their flesh blackened, while their mouths, gums, and lips turned a rich cream color. Scurvy was taking its steady course. Misery might have drawn other companions together, but not these two. Each watched the disease advance in the other man and took secret pleasure in every new symptom.
        - id: ch02-b14
          speaker: narrator
          text: They stopped caring how they looked or how they lived. The cabin became a pigsty. They never made the beds or laid fresh pine branches beneath them. They wished they could stay under their blankets, but the frost showed no mercy and the fire demanded endless fuel. Their hair and beards grew long and wild. Their clothes would have disgusted a ragpicker. They were sick, movement hurt, and no one was there to see them. So they did not care.
    - id: ch03
      title: The Fear of the North
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Then another trouble came. It was the Fear of the North, born from the Great Cold and the Great Silence in December's darkness, when the sun dropped below the horizon and stayed there. The fear found a different shape in each man.
        - id: ch03-b02
          speaker: narrator
          text: Weatherbee turned to superstition. In his mind, he woke the spirits sleeping in the forgotten graves. They fascinated him. In dreams, the dead men came from the cold and crept under his blankets. They told him about the labor and suffering they had known before death. He pulled away from their damp touch as frozen arms wrapped around him. When they whispered what was still to come, his terrified screams filled the cabin.
        - id: ch03-b03
          speaker: narrator
          text: Cuthfert did not understand. By then the men no longer spoke. Whenever the screams woke him, he grabbed his revolver and sat shivering in bed, aiming at the dreaming man. He believed Weatherbee was going mad, and he began to fear for his own life.
        - id: ch03-b04
          speaker: narrator
          text: Cuthfert's sickness had no such solid shape. The unknown builder had fixed a weather vane to the roof. Cuthfert saw that it always pointed south. Annoyed by its stubbornness, he turned it east one day and watched. Not a breath of wind disturbed it. Then he pointed it north and swore he would not touch it again until the wind blew.
        - id: ch03-b05
          speaker: narrator
          text: The unnatural calm frightened him. He often rose in the middle of the night to see whether the vane had shifted. Ten degrees would have satisfied him. It never moved. It hung above him, as fixed as fate.
        - id: ch03-b06
          speaker: narrator
          text: His imagination took command until the weather vane became something sacred and terrible. He followed its pointing line across the gloomy land and let the Fear fill him. He thought about everything unseen and unknown until eternity seemed to press down on his body. All of the North had that crushing weight. Nothing lived or moved. Darkness covered the endless, brooding country. The silence was so complete that the echo of his own heartbeat felt like an offense. The solemn forest seemed to guard something awful that no word or thought could hold.
        - id: ch03-b07
          speaker: narrator
          text: The world he had left seemed impossibly distant. Now and then he remembered busy nations and great enterprises, markets, galleries, and crowded streets. He recalled evening clothes, formal gatherings, good men, and dear women he had known. But those were dim memories of a life lived centuries before, on another planet. This frozen vision was the reality. Beneath the weather vane, staring into the polar sky, he could not make himself believe the Southland existed or that it roared with life and movement at that very moment.
        - id: ch03-b08
          speaker: narrator
          text: There was no Southland. No children were born. No one married. Beyond the bleak horizon lay empty country, and beyond it, more emptiness. Sunny lands heavy with flowers were old dreams of paradise. Western sunshine, eastern spices, every happy and blessed island were lies. His own laughter split the emptiness and shocked him. There was no sun.
        - id: ch03-b09
          speaker: narrator
          text: This dead, cold, dark place was the whole universe, and Cuthfert was its only citizen. Weatherbee did not count in such moments. He was only a monstrous shadow chained to Cuthfert through endless ages as punishment for a forgotten crime.
        - id: ch03-b10
          speaker: narrator
          text: Cuthfert lived with Death among the dead. His own smallness weakened him, while the sleeping ages seemed to crush him beneath their weight. Everything was vast and complete except himself. The wind and every living motion had perfectly stopped. Around him stretched the immense snow-covered wilderness. Above him rose the enormous sky, and below it waited the depth of the silence. If only the weather vane would move. If lightning would strike or the forest burst into flame. Let the whole sky roll up like a scroll and let Judgment crash across the land. Anything would be better than this. But nothing moved. The Silence pressed closer, and the Fear of the North laid cold fingers on his heart.
        - id: ch03-b11
          speaker: narrator
          text: Once, beside the river, he found a track on the thin crust of snow. It was the faint mark of a snowshoe rabbit, and it struck him like a revelation. Something was alive in the North. He would follow it, see it, and feast his eyes on it.
        - id: ch03-b12
          speaker: narrator
          text: He forgot his swollen muscles and plunged through deep snow, wild with expectation. The forest swallowed him. The short midday twilight vanished, but he kept searching until his body failed and left him helpless in the snow.
        - id: ch03-b13
          speaker: narrator
          text: He groaned there, cursed his foolishness, and understood that his mind had invented the track. Late that night he crawled back to the cabin on hands and knees. His cheeks were frozen and his feet felt strangely numb. Weatherbee gave him a cruel grin but no help. Cuthfert pushed needles into his toes and thawed them by the stove. A week later, the flesh began to die.
        - id: ch03-b14
          speaker: narrator
          text: The clerk had troubles of his own. The men from the graves came more often and seldom left him, awake or asleep. He dreaded them before they arrived and could not pass the two stone heaps without shuddering. One night they came in a dream and led him outside to perform a task. He woke between the graves, too frightened to speak, and fled back to the cabin. He had lain in the cold for some time. His cheeks and feet were frozen too.
        - id: ch03-b15
          speaker: narrator
          text: Sometimes the spirits' presence drove him into a frenzy. He danced around the cabin, slashed at empty air with an ax, and smashed everything he could reach. During those attacks, Cuthfert hid in his blankets and tracked the madman with a cocked revolver. He was ready to shoot if Weatherbee came too close.
        - id: ch03-b16
          speaker: narrator
          text: After one spell, Weatherbee recovered and saw the gun pointing at him. Suspicion woke in him. From then on, he also feared for his life. The men watched each other closely and spun around in terror whenever one passed behind the other's back. Their fear became a madness that ruled even their sleep.
        - id: ch03-b17
          speaker: narrator
          text: Without discussing it, they kept the grease lamp burning all night and filled it well before bed. The smallest movement woke them. Through many silent watches, they stared at each other from their blankets, shaking, with fingers resting on their triggers.
        - id: ch03-b18
          speaker: narrator
          text: The Fear, the strain of watching each other, and the disease stripped away every sign of humanity. They looked like desperate wild animals that had been hunted too long. Their frozen cheeks and noses had turned black. Their toes began falling away at the first and second joints. Every movement brought pain, but the hungry firebox demanded fuel day after day and never accepted an excuse. It took a pound of flesh from them in payment. Unable to stand for long, they dragged themselves into the forest on their knees and chopped wood from that position.
        - id: ch03-b19
          speaker: narrator
          text: Once, each crawled into the same thicket from a different side, searching for dry sticks without knowing the other was near. Without warning, two ruined, deathlike faces peered through the branches and confronted each other. Suffering had changed them so completely that neither recognized the man he had lived beside for months. They forced themselves upright, screamed in terror, and ran on their mangled feet. At the cabin door they fell together. They clawed and scratched like demons desperate to get inside, until at last they recognized each other and understood their mistake.
        - id: ch03-b20
          speaker: narrator
          text: At times they became almost sane. During one such interval, they divided the last sugar equally. Only a few cupfuls remained. Each guarded his own sack in the storehouse, because neither trusted the other.
        - id: ch03-b21
          speaker: narrator
          text: Then Cuthfert made a mistake. He could barely move. Pain sickened him, his head spun, and he could hardly see. He crawled into the storehouse with the sugar canister and filled it from Weatherbee's sack, believing it was his own.
    - id: ch04
      title: The Sun Returns
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: January was only a few days old. The sun had passed its lowest point in the south, and at noon it now threw bold yellow streaks into the northern sky. The day after his mistake with the sugar, Cuthfert felt better in both body and spirit. As midday came and the darkness brightened, he dragged himself outside to watch the brief glow. It seemed to promise that the sun meant to return.
        - id: ch04-b02
          speaker: narrator
          text: Weatherbee also felt stronger and crawled out beside him. They propped themselves in the snow beneath the motionless weather vane and waited. The stillness of death lay around them. In other lands, when nature grows this quiet, the air seems to wait for one small voice to begin the world's broken song again. Not in the North. The two men felt they had lived for ages in this ghostly peace. They could remember no song from the past and imagine none in the future. This unnatural calm seemed to have existed forever. It felt like the silence of eternity.
        - id: ch04-b03
          speaker: narrator
          text: They stared north. Behind their backs, beyond the towering southern mountains, the hidden sun climbed toward the height of another sky. The two men were the only watchers before that enormous canvas. Slowly, the false dawn grew. A weak flame began to smolder along the horizon. Its colors deepened and changed from reddish yellow to purple and saffron. The glow became so bright that Cuthfert thought the sun itself must be hiding behind it. For one impossible moment, he believed he was seeing a miracle. Could the sun be rising in the north?
        - id: ch04-b04
          speaker: narrator
          text: Without warning and without fading, the color vanished. The sky was blank, and the day's light had gone out. Both men caught their breath like a sob. Then they saw frost glittering in the air. To the north, the weather vane cast a faint shape across the snow.
        - id: ch04-b05
          speakers: [carter_weatherbee, percy_cuthfert]
          ensemble: duo
          text: "A shadow! A shadow!"
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: It was exactly noon. They jerked their heads south. A golden rim looked over the snowy shoulder of the mountain, smiled at them for an instant, then slipped away.
        - id: ch04-b07
          speaker: narrator
          text: Tears filled their eyes as they looked at each other, and something hard inside both men suddenly softened. They felt pulled toward each other after all those months of hatred and fear. The sun was returning. It would visit tomorrow, then the next day, and the day after that. Each time it would stay a little longer. At last it would travel through their sky all day and all night without once falling below the horizon.
        - id: ch04-b08
          speaker: narrator
          text: There would be no night. Winter's ice would break. Winds would rise, and the forests would answer. Blessed sunlight would cover the land, and life would begin again. Hand in hand, they would leave this terrible dream and travel back to the Southland. They stumbled blindly toward each other. Their poor damaged hands met, swollen and twisted inside their mittens.
        - id: ch04-b09
          speaker: narrator
          text: But that promise would never be fulfilled. The Northland follows its own rules. Men who have never journeyed into far countries cannot understand the strange ways in which it tests their souls.
    - id: ch05
      title: The Kilkenny Cats
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: An hour later, Cuthfert put a pan of bread in the oven. He wondered what surgeons might do for his feet when he returned. Home no longer seemed very far away. Weatherbee was searching through the storehouse. Suddenly, he burst into a storm of curses, then stopped with frightening speed. The other man had robbed his sugar sack.
        - id: ch05-b02
          speaker: narrator
          text: Things might still have ended differently if the two dead men had not risen from beneath their stones and silenced Weatherbee's angry words. They led him gently out of the storehouse, and he forgot to close it. The moment they had foretold in his dreams had come. They guided him to the woodpile and placed the ax in his hands.
        - id: ch05-b03
          speaker: narrator
          text: Then they helped him push open the cabin door. He was sure they shut it behind him. He heard the door slam and the latch fall into place. They waited just outside for him to complete his task.
        - id: ch05-b04
          speaker: percy_cuthfert
          text: "Carter! Carter, listen to me!"
          emotion: fearful
        - id: ch05-b05
          speaker: narrator
          text: The look on the clerk's face frightened Cuthfert. He hurried to put the table between them. Weatherbee came after him without haste or excitement. No pity or anger showed in his face. He looked patient and dull, like a man with a job to finish carefully.
        - id: ch05-b06
          speaker: percy_cuthfert
          text: "What is wrong with you?"
          emotion: fearful
        - id: ch05-b07
          speaker: narrator
          text: Weatherbee stepped sideways and blocked the way to the door. He said nothing.
        - id: ch05-b08
          speaker: percy_cuthfert
          text: "Carter, please. We can talk about this. Be reasonable."
          emotion: fearful
        - id: ch05-b09
          speaker: narrator
          text: Cuthfert's thoughts raced as he planned a careful move toward the bed where his Smith and Wesson lay. He kept his eyes on the madman, rolled backward onto the bunk, and grabbed the pistol.
        - id: ch05-b10
          speaker: percy_cuthfert
          text: "Carter!"
          emotion: fearful
        - id: ch05-b11
          speaker: narrator
          text: Powder flashed into Weatherbee's face, but he swung the ax and leaped. The blade struck deep at the base of Cuthfert's spine. All feeling left the lower half of his body. Then Weatherbee fell heavily on top of him and closed weak fingers around his throat.
        - id: ch05-b12
          speaker: narrator
          text: The ax blow made Cuthfert drop the pistol. While his lungs struggled for air, his hand searched blindly through the blankets. Then he remembered Weatherbee's sheath knife. He slid a hand up the clerk's belt, found it, and the two men pulled close in their final struggle.
        - id: ch05-b13
          speaker: narrator
          text: Cuthfert felt his strength draining away. His lower body was useless. Weatherbee's unmoving weight crushed him and pinned him like a bear beneath a trap. A familiar smell filled the cabin, and he knew the bread was burning. What did that matter now? He would never need it. Six whole cups of sugar remained in the open storehouse. If he had seen this ending coming, he would not have guarded his share or eaten so carefully during the past few days.
        - id: ch05-b14
          speaker: narrator
          text: Would the weather vane ever move? Why not? Had he not seen the sun that day? He would go outside and look. No, he could not move. He had never thought the clerk was so heavy.
        - id: ch05-b15
          speaker: narrator
          text: The cabin cooled quickly. The fire must have gone out, and the cold was pushing in through every crack. It must already be below zero. Ice would be climbing the inside of the door. Cuthfert could not turn his head to see it, but long experience had taught him how fast it grew at each temperature. He measured its progress by the chill spreading through the room. By now the lower hinge must be white, and soon the frost would climb higher.
        - id: ch05-b16
          speaker: narrator
          text: Would anyone in the world ever hear this story? How would his friends receive the news? They would read about him over their coffee, most likely, and discuss his fate afterward at their clubs. He could see them very plainly, gathered in the old familiar rooms and saying poor old Cuthfert had not been such a bad fellow after all. He smiled as he listened to their praise, then left them and went looking for a Turkish bath.
        - id: ch05-b17
          speaker: narrator
          text: The familiar crowd moved along the streets. Strangely, no one noticed his moose-hide moccasins or torn German socks. He would take a cab. After the bath, he could use a shave. No, food should come first.
        - id: ch05-b18
          speaker: narrator
          text: Steak, potatoes, and green vegetables appeared before him, all wonderfully fresh. Then came squares of honey flowing like liquid amber. Why had they brought so much? He could never eat it all.
        - id: ch05-b19
          speaker: narrator
          text: A bootblack offered him a shine. Of course. Cuthfert put his foot on the box. The man looked up at him strangely. Cuthfert remembered his moose-hide moccasins and hurried away.
        - id: ch05-b20
          speaker: narrator
          text: Listen. The weather vane must be spinning at last. No, it was only a singing in his ears.
        - id: ch05-b21
          speaker: narrator
          text: Only that singing. The ice must have climbed beyond the latch by now. Perhaps it already covered the upper hinge. Tiny points of frost appeared between the moss-lined roof poles. They grew slowly. No, not slowly. One appeared, then another. Two, three, four. They came too quickly to count. Two joined, and a third joined them.
        - id: ch05-b22
          speaker: narrator
          text: Soon there were no separate spots. They had run together into one white sheet.
        - id: ch05-b23
          speaker: narrator
          text: At least he would have company. If Gabriel ever shattered the silence of the North, the two men would stand together, hand in hand, before the great White Throne. God would judge them. God would judge them.
        - id: ch05-b24
          speaker: narrator
          text: Then Percy Cuthfert closed his eyes and went to sleep.
