audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静克制，带着北国故事的冷峻与悲悯
        timbre: 温厚清晰，略带风霜感
        pace: 舒缓而有张力
        pitch: 中低
    weatherbee:
      display_name: 卡特·韦瑟比
      tts:
        delivery: 粗俗自负，抱怨时尖刻，病中逐渐恍惚阴沉
        timbre: 浑浊粗哑
        pace: 中等，失常时忽快忽慢
        pitch: 中低
    cuthfert:
      display_name: 珀西·卡思弗特
      tts:
        delivery: 矜持敏感，讥讽而自命不凡，恐惧时气息发紧
        timbre: 清冷单薄
        pace: 中等偏慢
        pitch: 中
    jacques_baptiste:
      display_name: 雅克·巴蒂斯特
      tts:
        delivery: 简短粗硬，带北地口音和不耐烦的嘲弄
        timbre: 低沉沙哑
        pace: 利落
        pitch: 低
    sloper:
      display_name: 斯洛珀
      tts:
        delivery: 坚韧果断，讥讽时温和得近乎残酷
        timbre: 干瘦而有力
        pace: 稳健
        pitch: 中低
    party_man:
      display_name: 队中汉子
      tts:
        delivery: 粗犷直率，惊讶时响亮
        timbre: 厚实洪亮
        pace: 明快
        pitch: 中
    western_man:
      display_name: 达科他西部人
      tts:
        delivery: 慢吞吞，带朴拙而辛辣的边地口吻
        timbre: 粗厚低哑
        pace: 偏慢
        pitch: 低
    traveler_1:
      display_name: 旅队汉子甲
      tts:
        delivery: 疲惫但坚决，回答短促
        timbre: 粗粝
        pace: 利落
        pitch: 中低
    traveler_2:
      display_name: 旅队汉子乙
      tts:
        delivery: 直率坚定，带着赶路人的急切
        timbre: 明亮结实
        pace: 明快
        pitch: 中
    traveler_3:
      display_name: 旅队汉子丙
      tts:
        delivery: 冷硬果断，不耐拖延
        timbre: 低沉有力
        pace: 中等
        pitch: 低
    traveler_4:
      display_name: 旅队汉子丁
      tts:
        delivery: 爽直强悍，应和时有穿透力
        timbre: 沙哑响亮
        pace: 明快
        pitch: 中低
    cuthfert_friend_1:
      display_name: 卡思弗特的朋友甲
      tts:
        delivery: 遥远而惋惜，像在俱乐部里低声追忆故人
        timbre: 温和清晰
        pace: 舒缓
        pitch: 中
    cuthfert_friend_2:
      display_name: 卡思弗特的朋友乙
      tts:
        delivery: 克制感慨，带着社交场合的矜持
        timbre: 沉静柔和
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 北行的队伍
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "一个人走进遥远的异乡，就得准备丢掉许多从前学会的东西，还得学会那片新土地上的生存规矩。旧日的理想和神祇，也许都要放下。就连一直指引他做人的准则，常常也得整个翻转过来。善于适应的人，会觉得这种变化新鲜有趣。可一个人若早已被故乡的生活磨出深深的车辙，新的环境便会把他的身心一起磨痛。他不明白那些新的约束，只会不停挣扎，最后招来种种祸患。无法适应的人，最好早些回乡。拖得太久，必死无疑。"
        - id: ch01-b02
          speaker: narrator
          text: "离开古老文明的舒适生活，去面对年轻、粗野而又简朴得像太初世界的北方，一个人身上改不掉的习惯越多，他成功的希望就越小。真正合适的人很快会懂，物质上的变化并不难。精致饭菜换成粗食，硬皮鞋换成软塌塌的鹿皮鞋，羽毛床换成雪地里的铺位，都算不了什么。最难的是改变自己看待万事、尤其是看待同伴的心。普通生活里的客套，在那里得换成无私、忍让和宽容。只有这样，人才会得到真正的伙伴情谊。嘴上不必说谢谢，心里得真懂得感激，再用行动还给别人。那里看的是行动，不是言辞，是内里的精神，不是表面的字句。"
        - id: ch01-b03
          speaker: narrator
          text: "北极发现黄金的消息传遍世界，北方的诱惑牵动无数人的心。卡特·韦瑟比辞掉安稳的文员差事，把一半积蓄留给妻子，用另一半买齐行装。他并不浪漫。商场里长久的劳役，早把浪漫从他身上磨光了。他只是受够了日复一日的苦熬，想冒一场大险，换一笔同样大的回报。和许多傻瓜一样，他看不起先驱们走了二十年的旧路。那年春天，他匆忙赶到埃德蒙顿，偏偏加入了一支队伍，从此断送了自己。"
        - id: ch01-b04
          speaker: narrator
          text: "这支队伍本身并不特别，特别的是他们的计划。目的地仍是克朗代克，可他们画出的路线，连生在西北荒野的硬汉看了也会倒抽冷气。雅克·巴蒂斯特都吃了一惊。他的母亲是奇佩瓦人，父亲是个背弃同伴的法裔舟夫。他出生在北纬六十五度以北的鹿皮帐篷里，刚哭几声，就让几口生牛油哄住了。他收钱替队伍领路，也答应一直走到永不开裂的冰原。可只要有人问他的意见，他就不祥地摇头。"
        - id: ch01-b05
          speaker: narrator
          text: "珀西·卡思弗特的灾星想必也升到了头顶，因为他也加入了这群淘金客。他是个普通人，银行存款和学问都相当丰厚。他没有任何理由来冒这种险，唯一的缘故，只是那份多愁善感长得太旺。他把它误当成浪漫和冒险精神。许多人都犯过这样的错，也都付出了致命的代价。"
        - id: ch01-b06
          speaker: narrator
          text: "初春第一次解冻时，队伍正沿麋鹿河追着流冰前进。行装很多，平底船和独木舟排成颇有声势的船队，后面还跟着一群名声不好的混血舟夫，连女人孩子也带上了。一天又一天，他们同船只较劲，同蚊虫作战，又在每一段陆路搬运中流汗咒骂。严酷的劳作会把一个人的灵魂剥得赤裸。还没等阿萨巴斯卡湖消失在南边，每个人就已经露出了本相。"
        - id: ch01-b07
          speaker: narrator
          text: "韦瑟比和卡思弗特最会偷懒，也最爱抱怨。全队人的腰酸腿痛加在一起，都没有他俩任何一个说得多。营地里总有杂活，提水、劈柴、洗碗，或者从行装里找出忽然要用的东西。两人从不主动伸手。每逢需要干活，他们便恰好发现自己扭伤了哪儿，或是磨出的水疱必须马上照料。"
        - id: ch01-b08
          speaker: narrator
          text: "晚上还有一大堆事情没做完，他俩最先睡觉。早晨本该在早餐前准备好出发，他俩最后才起。开饭时，他们最先伸手。做饭时，他们最后才帮忙。有一点难得的好吃食，他们抢得最快，却总要等到吃完自己那份又占了别人一份，才肯发现拿多了。即使划桨，他俩也会悄悄让桨刃斜着划水，再借船前冲的力气把桨带起来。他们以为没人看见。伙伴们却暗暗咒骂，越来越恨他们。雅克·巴蒂斯特更是从早骂到晚，当面讥笑。不过，巴蒂斯特原本就不是绅士。"
        - id: ch01-b09
          speaker: narrator
          text: "到了大奴湖，他们买来哈得孙湾狗，又装上干鱼和干肉饼，船舷沉得快要贴住水面。随后，船队顺麦肯齐河的急流而下，一头扎进大荒原。他们探查每条看似有希望的支流，富矿砂却总在更北边引诱他们。到了大熊湖，未知之地的恐惧压倒舟夫，众人开始逃走。抵达好望堡时，就连最后那批最勇敢的舟夫，也只肯弓身拉一阵纤，逆着先前轻易滑下来的水流向前，随后离开。"
        - id: ch01-b10
          speaker: narrator
          text: "只有雅克·巴蒂斯特留下。他毕竟发过誓，要走到永不开裂的冰原。众人只好一遍遍摊开那些根据传闻绘成、处处骗人的地图。太阳已经越过北方的夏至点，带着冬天再次南下，他们知道不能耽搁。队伍绕过麦肯齐河注入北冰洋的海湾，进入小皮尔河口。从这里起，每一步都是逆流的苦役，那两个无能之辈吃的苦更多。纤绳、长篙、船桨、额带、急滩和陆路搬运，终于让一个厌透了所谓的大冒险，也让另一个看清了冒险究竟有多浪漫。"
        - id: ch01-b11
          speaker: narrator
          text: "一天，他俩公然反抗。巴蒂斯特恶狠狠地咒骂，他们也像被踩急的虫子一样回头顶撞。混血人却把两人打得鼻青脸肿、鲜血淋漓，又赶回去干活。这是他们一生中头一次挨人痛打。到了小皮尔河源头，队伍丢下船只，用余下的整个夏天翻过麦肯齐河分水岭，把行装运到西拉特河。那条小河汇入波丘派恩河，后者再流进育空河，正好赶上这条北方大动脉折回北极圈。"
        - id: ch01-b12
          speaker: narrator
          text: "可他们还是输给了冬天。一天，众人把木筏系在回水湾的厚冰上，急忙卸货。夜里，河面几次堵住又裂开。第二天早晨，大河彻底睡去。大家围在一起商议，那两个无能之辈不停哼哼唧唧。斯洛珀用拇指指甲在地图比例尺上反复量过。"
        - id: ch01-b13
          speaker: sloper
          text: "咱们离育空河不会超过四百英里。"
        - id: ch01-b14
          speaker: jacques_baptiste
          text: "从前有过哈得孙湾公司的站子。现在早没用了。"
        - id: ch01-b15
          speaker: narrator
          text: "巴蒂斯特的父亲早年替皮货公司走过这条路，还用两根冻掉的脚趾给沿途作了标记。"
        - id: ch01-b16
          speaker: party_man
          text: "我的老天！那里一个白人也没有吗？"
        - id: ch01-b17
          speaker: sloper
          text: "一个也没有。不过沿育空河再走五百英里就是道森。从这儿算，还有一千英里难路。"
        - id: ch01-b18
          speaker: narrator
          text: "韦瑟比和卡思弗特同时呻吟起来。有人问巴蒂斯特要走多久，他盘算了片刻。"
        - id: ch01-b19
          speaker: jacques_baptiste
          text: "人人拼命干，没人倒下，十、二十、四十、五十天。要是这两个娃娃也来，那可说不准。也许等地狱冻上，也许冻上了还到不了。"
        - id: ch01-b20
          speaker: narrator
          text: "所有人都停下手里的雪鞋和鹿皮鞋。有人喊来一个缺席的伙伴，那人从篝火边一座古旧木屋里走出来。木屋是北方腹地众多谜团中的一个，没人知道它建于何时，又出自谁手。旷野里还有两座堆满石头的坟，也许埋着早年来客的秘密。可那些石头又是谁堆的？决定去留的时刻到了。巴蒂斯特停下手中的挽具，把挣扎的狗按进雪里。厨子把一把咸肉扔进咕嘟作响的豆锅，也站来听。"
        - id: ch01-b21
          speaker: narrator
          text: "斯洛珀站起来。他面黄肌瘦，为逃离南美洲一个滋生热病的鬼地方，一路跨越不同气候带，从没停步。他把沉重的猎刀也算进去，或许才有九十磅，灰白的头发也说明壮年早过。韦瑟比或卡思弗特的年轻肌肉，都能发出他十倍的力气。可真走上一天，他能把两人远远甩下。这一天，也是他逼着更强壮的伙伴去闯那一千英里最严酷的路。他身上有自己种族永不安定的精神，也有条顿人的顽强，再混着美国佬敏锐的领悟和果断的行动。精神就这样牢牢驾驭着他的肉体。"
        - id: ch01-b22
          speaker: sloper
          text: "赞成等冰冻牢以后，带着狗继续赶路的，说赞成。"
        - id: ch01-b23
          speakers: [traveler_1, traveler_2, traveler_3, traveler_4]
          ensemble: chorus
          text: "赞成！"
        - id: ch01-b24
          speaker: narrator
          text: "八个声音一起响应。它们注定要在几百英里的苦路上，串起一道漫长的咒骂。"
        - id: ch01-b25
          speaker: sloper
          text: "反对的呢？"
        - id: ch01-b26
          speakers: [weatherbee, cuthfert]
          ensemble: duo
          text: "反对！"
        - id: ch01-b27
          speaker: narrator
          text: "两个无能之辈生平第一次完全站在一起，没有拿自己的利益讨价还价。"
        - id: ch01-b28
          speaker: weatherbee
          text: "我们不走，你们又能拿我们怎么样？"
        - id: ch01-b29
          speakers: [traveler_1, traveler_2, traveler_3, traveler_4]
          ensemble: chorus
          text: "少数服从多数！"
        - id: ch01-b30
          speaker: sloper
          text: "我知道，少了你们，远征队恐怕就得垮掉。不过，只要我们再卖力一点，大概还能勉强走下去。大伙儿说，是不是？"
        - id: ch01-b31
          speaker: narrator
          text: "欢呼声震得四下回响。"
        - id: ch01-b32
          speaker: cuthfert
          text: "可是，像我这样的人，又该怎么办？"
        - id: ch01-b33
          speaker: sloper
          text: "你不跟我们走？"
        - id: ch01-b34
          speaker: cuthfert
          text: "不——走。"
        - id: ch01-b35
          speaker: sloper
          text: "那就随你的便，我们没什么可说的。"
        - id: ch01-b36
          speaker: western_man
          text: "俺看哪，你可以跟那位亲亲热热的伙伴商量。等到做饭、拾柴的时候，他准会问你打算怎么办。"
        - id: ch01-b37
          speaker: sloper
          text: "好，那就全安排妥了。明天动身，哪怕走五英里就扎营也行。咱们先把一切料理顺手，也看看有没有忘掉什么。"
        - id: ch01-b38
          speaker: narrator
          text: "第二天，钢边滑板发着呻吟，雪橇从木屋旁一架架过去。狗把身子压得很低，在那副生来便要一直拖到死的挽具里奋力前拉。巴蒂斯特站到斯洛珀身边，最后回头望向木屋。烟从育空式烟囱里凄凉地升起。那两个无能之辈站在门口，目送众人远去。"
        - id: ch01-b39
          speaker: narrator
          text: "斯洛珀把手搭上巴蒂斯特的肩。"
        - id: ch01-b40
          speaker: sloper
          text: "雅克·巴蒂斯特，你听说过基尔肯尼的猫吗？"
        - id: ch01-b41
          speaker: narrator
          text: "巴蒂斯特摇摇头。"
        - id: ch01-b42
          speaker: sloper
          text: "那两只猫一直打，最后皮也没剩，毛也没剩，连一声猫叫都没剩。明白吗？什么都没有了。这两个人不爱干活，却要独自在木屋里过完整个冬天。那冬天又长又黑。基尔肯尼的猫，明白了吧？"
        - id: ch01-b43
          speaker: narrator
          text: "巴蒂斯特身上那个法国人耸了耸肩，那个印第安人却保持沉默。这一下耸肩已经说得够多，里面装满了预言。"
    - id: ch02
      title: 木屋里的冬天
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "起初，两人在小木屋里过得还不错。伙伴临走前的粗野玩笑，使他们懂得如今只能共同负责。何况两个健康男人要做的活，本来就不算多。那条残酷的鞭子，也就是横行霸道的混血领路人，终于不在身边，两人都痛快地松了口气。开头，他们还争着比对方勤快，做起小事来格外热心。倘若那些正在漫漫长路上耗尽身体和灵魂的伙伴看见，准会不敢相信自己的眼睛。"
        - id: ch02-b02
          speaker: narrator
          text: "眼前似乎再没什么可担忧。森林从三面挤到屋前，是一座永远用不完的柴场。门外几码远，波丘派恩河沉沉睡着。只要凿穿它那层冬衣，便有清澈得像水晶、也冷得钻心的泉水冒出来。可没过多久，他们连这也开始嫌弃。冰窟窿总会重新封住，害他们花上许多难熬的钟头去凿冰。木屋的无名建造者还把两侧原木向后伸长，托起一座高脚贮藏室。队伍的大部分食物都留在那里。"
        - id: ch02-b03
          speaker: narrator
          text: "给养足够三倍的人吃，可大多只能长筋肉、添力气，不能讨舌头喜欢。糖倒很多，两个普通男人怎么也吃不完。问题是，这两个人差不多还是孩子。他们很快发现，把热水泡得甜甜的，滋味实在不错，于是让烙饼浸在浓白的糖浆里，又把硬面包皮泡得透透的。咖啡、茶，特别是干果，也不停消耗着糖。两人第一次争吵，就是为了这件事。两个男人只有彼此能够作伴，完全离不开对方，一旦开始吵架，事情便严重了。"
        - id: ch02-b04
          speaker: narrator
          text: "韦瑟比最爱高声议论政治。卡思弗特过去只管剪下债券息票，国家爱怎么走便怎么走，所以要么不理他，要么抛出几句自以为惊人的警语。可文员迟钝得听不懂那些巧妙思想。卡思弗特觉得自己的才华白白浪费，很是恼怒。他向来能用聪明才智把听众晃得眼花，如今却没了观众。他觉得自己受了委屈，不知不觉便把责任推给那个木头脑袋的伙伴。"
        - id: ch02-b05
          speaker: narrator
          text: "除了同样活着，两人没有一处相同。韦瑟比做了一辈子文员，只懂文员的营生。卡思弗特是文学硕士，画过油画，也写过不少东西。一个是自认高贵的下等人，一个是确信自己高贵的绅士。由此看来，一个人没有半点伙伴情谊，也照样能算绅士。文员贪恋肉欲，另一个却事事讲究审美。韦瑟比把自己那些多半编出来的风流事说得又长又细，卡思弗特听着，只觉得像一股股下水道臭气扑来。"
        - id: ch02-b06
          speaker: cuthfert
          text: "你是头肮脏、没教养的畜生。你就该跟猪一起滚在泥里。"
        - id: ch02-b07
          speaker: weatherbee
          text: "你才是淡得像牛奶兑水的娘娘腔，还是个下流胚！"
        - id: ch02-b08
          speaker: narrator
          text: "韦瑟比到死也说不清下流胚究竟是什么意思，不过这句话达到了目的，而人生中最要紧的似乎也就是这一点。他每唱到第三个音便走调，却能把《波士顿窃贼》和《英俊的船舱小伙》一唱几个钟头。卡思弗特气得流泪，实在忍不住了，只好逃到屋外。可酷寒叫他待不了多久，他终究还得回来。"
        - id: ch02-b09
          speaker: narrator
          text: "木屋只有十英尺乘十二英尺，床、炉子、桌子和两个人全挤在里面。一个人的存在本身，都成了对另一个的冒犯。两人渐渐不再说话。日子越久，那沉默便越长，也越沉。有时，一道眼神或嘴角的一撇仍会露出敌意，尽管他们都努力装作对方根本不存在。两人心里也都冒出同一个巨大的疑问。上帝当初究竟为什么要造出另一个？"
        - id: ch02-b10
          speaker: narrator
          text: "无事可做，时间压得人无法忍受，他们也因此越来越懒。身体陷入麻木，哪怕最小的杂活也叫人厌恶。一天早晨，轮到韦瑟比做早餐。他从毯子里滚出来，听着伙伴的鼾声，先点油脂灯，再生炉火。水壶冻得硬邦邦的，屋里也没有洗脸水，他一点不在意。他等着冰化开，一边切咸肉，一边硬着头皮和面。卡思弗特眯起眼睛，偷偷看着他忙。"
        - id: ch02-b11
          speaker: narrator
          text: "紧接着，两人大吵一场，把最热烈的咒骂送给彼此，最后决定从此各做各的饭。一星期后，卡思弗特早晨没洗脸，却照样满意地吃下自己做的饭。韦瑟比咧嘴看他。从那以后，洗脸这种愚蠢习惯便彻底离开了他们。"
        - id: ch02-b12
          speaker: narrator
          text: "糖和其他好东西越来越少，两人都怕自己没分到应得的那份。为了不吃亏，他们开始拼命往肚里塞。那点奢侈品在贪吃竞赛中遭了殃，两个人也跟着遭殃。没有新鲜蔬菜，也不肯活动，他们的血慢慢坏了。恶心的紫色皮疹爬上身体，他们仍不理会警告。接着，肌肉和关节肿起来，皮肉变黑，嘴里、牙龈和嘴唇却变成浓奶油的颜色。坏血病一天天加重。共同的痛苦没有让他们靠近，两人反倒各自盯着对方的症状幸灾乐祸。"
        - id: ch02-b13
          speaker: narrator
          text: "他们不再在意模样，也不要起码的体面。木屋成了猪圈。床从来不铺，床下也不换新鲜松枝。他们倒想一直躲在毯子里，可霜冻不答应，炉膛又不停吞吃木柴。头发和胡须越长越乱，身上的衣服连捡破烂的人看了也会嫌恶。他们不在乎。病成这样，又没人来看，何况一动就疼。"
        - id: ch02-b14
          speaker: narrator
          text: "这时，又一场灾难来到木屋，那就是北方的恐惧。它是大寒和大寂静共同生下的孩子，诞生在十二月的黑暗里。太阳沉入地平线，从此不再出现。这份恐惧摸准两人的不同天性，用不同的方法折磨他们。"
        - id: ch02-b15
          speaker: narrator
          text: "韦瑟比陷入最粗陋的迷信，一心要唤醒那两座被人遗忘的坟墓里沉睡的幽灵。梦中，死者从寒冷中走来，钻进他的毯子，紧紧贴住他，告诉他临死前受过的苦。他们越靠越近，把冰冻的手脚缠上他的身体。他躲着那种湿冷的触碰。等他们凑到耳边，低声预告将来的事，韦瑟比便惊叫起来，声音响遍木屋。"
        - id: ch02-b16
          speaker: narrator
          text: "卡思弗特不知道发生了什么，因为两人已经不说话。每逢被尖叫惊醒，他总会抓起左轮手枪，坐在床上发抖，把枪口对准那个仍在梦里的男人。他认定韦瑟比正在发疯，也开始害怕自己会死在对方手里。"
        - id: ch02-b17
          speaker: narrator
          text: "卡思弗特的病没有那么具体。神秘的工匠盖木屋时，在屋脊钉了一只风向标。卡思弗特发现，它永远指着南方。一天，他被那份固执惹恼，把风向标转向东面，眼巴巴看着。可一丝风也没有。后来，他又把它转向北方，发誓风不吹来，自己就再也不碰它。可空气静得不像人间，叫他害怕。他常在半夜起床，只想看看风向标有没有偏过一点。哪怕只动十度，他也会满足。可是没有。它高悬在上面，和命运一样不肯改变。"
        - id: ch02-b18
          speaker: narrator
          text: "想象在他心里四处乱跑，风向标渐渐成了神物。有时，他沿着它所指的方向望进凄凉的疆域，任北方的恐惧浸透心灵。他反复想着看不见、也不知道的事物，直到永恒的重量仿佛压上身体。北国的一切都在压他。这里没有生命，没有运动，只有黑暗和沉思大地无边的安宁。寂静阴森得很，每一下心跳的回声都像一种冒犯。庄严的森林守着某件可怕的东西，那东西说不出，也想不到。"
        - id: ch02-b19
          speaker: narrator
          text: "他刚刚离开的世界变得无比遥远。忙碌的国家、宏大的事业，还有商场、画廊和拥挤的大街，偶尔会闯进记忆。晚礼服、社交宴会，认识过的好男人和亲爱的女人，也会跟着出现。可那都是几个世纪以前，在另一个星球上活过的一生。眼前的幻境才是真实。他站在风向标下望着极地天空，怎么也不能相信南方真的存在，更不能相信那一刻的南方正满是生命的喧响。"
        - id: ch02-b20
          speaker: narrator
          text: "没有南方。没有女人生下男人，也没有人结婚。荒凉的天际线以外，只是广阔的无人之境。再往外，仍是更大的无人之境。没有阳光灿烂、花香浓郁的土地。那些只是在梦里出现过的天堂。西方的阳光之国，东方的香料之乡，含笑的阿卡迪亚，幸福的福人岛，全是假的。"
        - id: ch02-b21
          speaker: narrator
          text: "哈！哈！他忽然笑了起来。根本没有太阳。"
        - id: ch02-b22
          speaker: narrator
          text: "笑声劈开虚空。卡思弗特从没听过这样的声音，连自己也吓了一跳。这里就是整个宇宙，死寂、寒冷而黑暗，他是唯一的居民。至于韦瑟比，这种时候根本算不得人。那只是个卡利班，一具畸形的幽影，像对某桩早已忘掉的罪的惩罚，同他锁在一起，不知要熬过多少年代。"
        - id: ch02-b23
          speaker: narrator
          text: "他同死神一起住在死者中间。自己的渺小夺去了他的力量，沉睡了万古的无声威权把他压倒。除他以外，一切都庞大到了极点。风和运动完全停止，覆雪的荒野没有尽头，天空高不可攀，寂静深不见底。他只盼那只风向标动一下。哪怕落下一道雷，哪怕整片森林忽然起火，也好。"
        - id: ch02-b24
          speaker: narrator
          text: "哪怕苍穹卷起来，末日轰然砸下。什么都好，只要有一点东西发生。可是没有。没有任何东西移动。寂静越挤越近，北方的恐惧把冰冷的手指按在他心上。"
    - id: ch03
      title: 恐惧的俘虏
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "有一次，卡思弗特像另一个鲁滨孙，在河边发现了足迹。薄薄的雪壳上，淡淡印着一只雪鞋兔的脚印。这简直是天启。北国还有生命。他要追上去，亲眼看见它，再好好看个够。他忘了肿痛的肌肉，怀着狂喜的期待扑进深雪。森林吞掉他的身影，正午短暂的暮光也消失了。他仍不停追寻，直到精疲力竭，身体终于把他按倒在雪地里。"
        - id: ch03-b02
          speaker: narrator
          text: "他躺在那里呻吟，咒骂自己的愚蠢，也明白那串脚印只是头脑变出的幻象。深夜，他靠手和膝盖爬回木屋。脸颊冻伤了，两只脚也有一种奇怪的麻木。韦瑟比恶毒地咧嘴，却不肯伸手。他只好把针扎进脚趾，挨着炉火一点点解冻。一星期后，坏疽出现了。"
        - id: ch03-b03
          speaker: narrator
          text: "文员也有自己的苦难。死人越来越常从坟里走出来，不管他醒着还是睡着，都很少离开。他一面等他们，一面害怕他们到来。每次经过那两座石冢，他都会发抖。一晚，死者又走进梦里，领他出去完成一件早已约定的差事。他惊恐得发不出声音，醒来时发现自己正躺在两堆石头之间。韦瑟比疯了一样逃回木屋。可他已经在外面躺了很久，脸和脚也冻伤了。"
        - id: ch03-b04
          speaker: narrator
          text: "有时，那些幽灵纠缠得太紧，他便在屋里发狂乱跳，抡起斧头劈砍空荡荡的空气，把能碰到的东西全部砸烂。卡思弗特每次都缩在毯子里，举着上了膛的左轮手枪，让枪口追随疯子的身影。只要韦瑟比靠得太近，他就准备开枪。"
        - id: ch03-b05
          speaker: narrator
          text: "一次发作过后，文员忽然看见，那支枪正对着自己。他也起了疑心。从此，两个人都怕死在对方手里。他们紧盯彼此。只要一个从另一个背后走过，另一个便会吓得立刻转身。这种戒备成了疯病，就连睡梦也由它支配。两人心照不宣，让油脂灯整夜亮着。每晚睡前，他们都备足咸肉油。任何一方稍微动一下，另一方就会惊醒。许多个寂静长夜里，两人缩在毯子下发抖，手指扣住扳机护圈，用目光隔空顶住对方。"
        - id: ch03-b06
          speaker: narrator
          text: "北方的恐惧、精神上的折磨和疾病的摧残合到一处，把他们最后一点人样也夺走了。他们看起来像被猎人逼到绝路的野兽。冻伤后的脸颊和鼻子已经变黑，脚趾也从第一或第二个关节处脱落。每动一下都疼，可炉膛永远吃不饱，天天逼他们用痛苦换来木柴。那真是一磅血肉换一把火。两个人只能爬进森林，跪在雪里劈柴。"
        - id: ch03-b07
          speaker: narrator
          text: "一次，他们各自爬着寻找干树枝，谁也不知道对方就在附近，竟从两边钻进同一片灌木。没有任何预兆，两颗窥探的骷髅头突然迎面相对。苦难把他们变得太厉害，谁也没认出谁。两人尖叫着站起，用残破的脚桩拼命逃跑。到了木屋门口，他们一起跌倒，像恶魔一样又抓又挠。过了一阵，才发现这是一场误会。"
        - id: ch03-b08
          speaker: narrator
          text: "偶尔，他们也能清醒一会儿。就在这样的一段时候，两人把最大的争端，也就是糖，平均分掉。他们各自把袋子放进高脚贮藏室，用妒忌的目光守着。毕竟只剩几杯了，而谁也不肯相信谁。"
        - id: ch03-b09
          speaker: narrator
          text: "可是有一天，卡思弗特犯了错。他病得几乎不能动，浑身疼，脑袋发晕，眼前模糊。他拿着糖罐爬进贮藏室，把韦瑟比的糖袋错当成了自己的。这时，一月刚刚过去几天。太阳早已越过南方最低的位置，如今到了正午，会朝北天洒下几道耀眼的黄光。"
    - id: ch04
      title: 太阳的许诺
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "拿错糖袋的第二天，卡思弗特觉得身体和精神都好了一点。正午渐近，天色慢慢发亮。他拖着身体爬出门，要好好看那转瞬即逝的光。在他眼里，这是太阳留下的保证，是太阳在告诉他以后还会回来。韦瑟比也觉得稍有好转，便爬出来坐到他旁边。两个人靠在静止的风向标下，用雪支住身体，一起等待。"
        - id: ch04-b02
          speaker: narrator
          text: "死亡般的寂静围住他们。在别的地方，大自然安静到这种地步，空气里总有一点低低的期待，像是在等一个细小的声音接起断掉的曲子。北方不是这样。这两个男人仿佛已经在幽灵般的安宁中活了无数世代。他们记不起过去的歌，也想不出未来的歌。这份不属于人间的平静仿佛从来都在。那是永恒安宁的寂静。"
        - id: ch04-b03
          speaker: narrator
          text: "他们直望着北方。在看不见的身后，在南方高山的背面，太阳正朝另一片天空的中央升起。两人是宏大画布前唯一的观众。他们看着虚假的黎明慢慢长大。一点微弱的火光亮起来，暗暗燃烧，颜色越来越深。红黄、紫色和藏红花色轮番出现。光亮得惊人，卡思弗特确信太阳就在后面。难道太阳会从北方升起来？这是奇迹。"
        - id: ch04-b04
          speaker: narrator
          text: "突然之间，没有预兆，也没有渐渐暗下去，那幅画被一下擦得干干净净。天空失去颜色，白昼的光熄灭了。两个人倒抽一口气，那声音几乎像呜咽。可是空气里亮起无数细小的霜晶。就在北面，风向标在雪上投出一道模糊的轮廓。"
        - id: ch04-b05
          speaker: cuthfert
          text: "影子！那是影子！"
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: "正好是正午。两人猛然转头望向南方。一圈金边从山峰积雪的肩头探出来，对他们微笑片刻，又沉了下去。他们眼里含着泪，彼此相望。一种陌生的温柔浸进两人的心。他们无法抗拒，只想向对方靠近。太阳正在回来。明天它会出现，后天还会出现，再下一天也一样。"
        - id: ch04-b07
          speaker: narrator
          text: "每次到来，太阳都会停得更久。总有一天，它会在他们的天空里日夜巡行，一次也不落到天际线下。黑夜会消失，封冻的冬天会破开。风会吹起，森林会回应。大地会浸在神圣的阳光里，生命重新醒来。他们会手拉着手，走出这场可怕的梦，一同返回南方。"
        - id: ch04-b08
          speaker: narrator
          text: "两人踉跄着，盲目向前伸手。那两只可怜的手终于碰到一起。它们藏在连指手套里，已经肿胀、扭曲。可是太阳许下的希望注定不能实现。北国终究是北国。人在那里依照奇异的法则熬炼自己的灵魂，没有远赴异乡的人，永远不会懂得那些法则。"
    - id: ch05
      title: 北方的审判
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "一个钟头以后，卡思弗特把一盘面包放进烤炉。他开始想着，等回家以后，外科医生会怎样处置他的双脚。家如今好像没有那么远了。韦瑟比正在高脚贮藏室里翻找。忽然，一阵旋风般的亵渎咒骂从里面爆发，又一下断掉。他发现，另一个人动过自己的糖袋。"
        - id: ch05-b02
          speaker: narrator
          text: "事情本来或许会有不同的结局。可那两个死人偏偏从石堆下走了出来，把韦瑟比喉咙里的怒骂压了回去。他们温柔地领他离开贮藏室。他连门也忘了关。最终的时刻已经来到。他们曾在梦里低声告诉他的那件事，就要发生。他们很轻、很轻地带他来到柴堆旁，把斧头放进他的手。"
        - id: ch05-b03
          speaker: narrator
          text: "死者又帮他推开木屋的门。他确信，自己进去以后，是他们替他关上了门。至少，他听见门砰地合拢，门闩清脆地落进槽里。他也知道，那两个人还在门外等着，等他把差事做完。"
        - id: ch05-b04
          speaker: cuthfert
          text: "卡特！我说，卡特！"
          emotion: fearful
        - id: ch05-b05
          speaker: narrator
          text: "卡思弗特被文员脸上的表情吓坏了，急忙把桌子隔到两人中间。韦瑟比慢慢跟上来，不着急，也不激动。他脸上没有怜悯，也没有怒火，只有耐心而麻木的神情。仿佛他只是接到一件非做不可的差事，现在要一步一步做完。"
        - id: ch05-b06
          speaker: cuthfert
          text: "你到底怎么了？"
          emotion: fearful
        - id: ch05-b07
          speaker: narrator
          text: "文员向后一闪，截住了逃往门口的路，嘴里始终没有声音。"
        - id: ch05-b08
          speaker: cuthfert
          text: "卡特，听我说，咱们谈一谈。做个好人，先听我说。"
          emotion: fearful
        - id: ch05-b09
          speaker: narrator
          text: "文学硕士的脑筋飞快转动。他想绕到侧面，靠近床上的史密斯—韦森手枪。他双眼盯住疯子，身体向后滚上床铺，同时抓起枪。"
        - id: ch05-b10
          speaker: cuthfert
          text: "卡特！"
          emotion: fearful
        - id: ch05-b11
          speaker: narrator
          text: "火药的闪光迎面炸在韦瑟比脸上，可他已经挥起斧头，纵身扑来。斧刃深深砍进脊柱根部，卡思弗特立刻失去下半身的一切知觉。文员沉重地倒在他身上，用无力的手指掐住他的喉咙。剧痛使卡思弗特丢掉了手枪。他的肺拼命挣扎，想吸进空气，而他的手在毯子间胡乱摸索。接着，他想起来了。那只手沿着文员的腰带摸到刀鞘，握住里面的短刀。最后的扭抱中，两个人贴得极近。"
        - id: ch05-b12
          speaker: narrator
          text: "卡思弗特感觉力气正在消失。下半身已经毫无用处。韦瑟比沉重的身体把他压住，像捕兽夹把一头熊钉在地上。木屋里出现一股熟悉的气味，面包烤焦了。可那有什么关系？他再也不需要吃东西。贮藏室里还有整整六杯糖。早知道会这样，过去几天何必省着？"
        - id: ch05-b13
          speaker: narrator
          text: "风向标会不会转动？它为什么不动？今天不是已经看见太阳了吗？他想出去看看。不行，他动不了。他从没想到那个文员会这么重。木屋凉得真快。炉火一定熄灭了，寒冷正从外面挤进来。"
        - id: ch05-b14
          speaker: narrator
          text: "屋里一定已经降到冰点以下。白冰正在门板内侧慢慢上爬。他看不见，可凭过去的经验，只要感觉屋里的温度，就能猜出冰到了哪里。下面那只铰链大概已经白了。这个故事会不会传回人间？朋友们听见以后会怎么想？他们多半会在咖啡桌边读到消息，再到俱乐部里谈论。"
        - id: ch05-b15
          speakers: [cuthfert_friend_1, cuthfert_friend_2]
          ensemble: duo
          text: "可怜的老卡思弗特，说到底，他也不算太坏。"
        - id: ch05-b16
          speaker: narrator
          text: "他想到这些赞美，微笑起来，随后便去找一家土耳其浴室。街上还是从前那些人。奇怪，怎么没人注意他脚上的驼鹿皮鞋和破烂的德国袜？他得叫一辆马车。洗过澡，再刮刮脸也很好。不，还是先吃饭。"
        - id: ch05-b17
          speaker: narrator
          text: "牛排、土豆，还有青菜，一切都新鲜得很。那是什么？一块块蜂巢，流着液态的琥珀。可他们为什么端来这么多？哈！哈！他哪里吃得完。有人要替他擦鞋。那当然好。他把脚搁上鞋箱，擦鞋匠却奇怪地抬头看他。他这才想起自己的驼鹿皮鞋，连忙走开。"
        - id: ch05-b18
          speaker: narrator
          text: "听，风向标一定正在飞转。不，那只是耳中的嗡鸣。仅此而已，只是一阵嗡鸣。冰现在大概已经爬过门闩，也许连上面的铰链也盖住了。屋顶的原木缝里塞着苔藓，一点点白霜正从缝间冒出来。长得真慢。不，并不慢。这里又有一点，那里还有一点。两点、三点、四点。来得太快，已经数不清了。两片正在长到一起，第三片也接了上去。"
        - id: ch05-b19
          speaker: narrator
          text: "斑斑点点都消失了。白霜已经连成完整的一片。也好，他会有个伴。如果加百列有一天真能打破北方的寂静，他们就会手拉着手，一起站在白色大宝座前。上帝会审判他们。上帝会审判他们。"
        - id: ch05-b20
          speaker: narrator
          text: "随后，珀西·卡思弗特闭上眼睛，沉入睡眠。"
