audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静克制，带着北国故事的冷峻与悲悯
        timbre: 温厚清晰，略带风霜感
        pace: 舒缓而有张力
        pitch: 中低
    malemute_kid:
      display_name: 马拉穆特小子
      tts:
        delivery: 从容果断，冷静中含着不动声色的幽默
        timbre: 温厚坚定
        pace: 稳健
        pitch: 中低
    stanley_prince:
      display_name: 斯坦利·普林斯
      tts:
        delivery: 文雅活泼，指导时耐心而利落
        timbre: 清晰沉稳
        pace: 中等偏快
        pitch: 中
    meyers:
      display_name: 迈耶斯
      tts:
        delivery: 粗豪爽快，赶路时干脆有力
        timbre: 结实响亮
        pace: 明快
        pitch: 中低
    bettles:
      display_name: 贝特尔斯
      tts:
        delivery: 豪迈随性，带着老雪道客的爽朗
        timbre: 粗哑洪亮
        pace: 明快
        pitch: 中低
    constable:
      display_name: 骑警
      tts:
        delivery: 镇定利落，训练有素
        timbre: 清晰坚实
        pace: 中等
        pitch: 中
    otter_skinner:
      display_name: 水獭皮客
      tts:
        delivery: 寡言警觉，重伤后虚弱断续，讲述往事时古朴深沉
        timbre: 低沉干涩，略带异乡口音
        pace: 缓慢
        pitch: 低
    axel_gunderson:
      display_name: 阿克塞尔·冈德森
      tts:
        delivery: 豪迈强悍，充满压倒一切的生命力
        timbre: 洪亮宽厚
        pace: 中等偏快
        pitch: 低
    unga:
      display_name: 昂加
      tts:
        delivery: 聪慧从容，绝望与仇恨中仍有坚定力量
        timbre: 深润清晰
        pace: 平稳
        pitch: 中
  chapters:
    - id: ch01
      title: 第一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "雪橇在新雪里艰难前行。挽具吱嘎，头犬的铃铛叮当作响，像一首没完没了的哀歌。人和狗早已累得不出声。他们已经走出很远，厚厚的新雪还在不断压沉道路。橇板上驮着大块驼鹿肉，冻得像燧石一样坚硬，又死死黏住没有踩实的雪面。那堆肉仿佛也有人的顽固脾气，一路向后拖拽，不肯让雪橇向前。天渐渐黑了，这一夜却没有营地可扎。雪从凝滞的空气里静静落下，落下来的不是片片雪花，而是纹样精巧的细小冰晶。天气只有零下十度，在北国算得上暖和，男人们毫不在意。迈耶斯和贝特尔斯掀起护耳，马拉穆特小子连手套也脱了。"
        - id: ch01-b02
          speaker: narrator
          text: "狗群在下午早些时候就已经累垮，这时却一点点有了精神。聪明些的狗先躁动起来。它们急促又迟疑地挣着挽索，鼻头四处嗅闻，耳朵高高竖起。迟钝的同伴还不明白，它们便恼火地偷偷咬那些狗的后腿，一口又一口，催它们快走。挨咬的狗也兴奋起来，躁动很快传遍整支狗队。第一架雪橇的头犬终于发出满意的尖鸣，身体贴低雪面，猛力扑向颈套。其余的狗纷纷跟上，一排排脊背同时收紧，所有挽索绷成直线。雪橇猛冲出去，男人们抓紧转向杆，连忙抬高双脚，免得被卷进橇板下面。一天的疲倦像是突然消失了。他们高声吆喝，为狗群鼓劲。狗也欢快地吠叫回应，一队雪橇就在越来越深的暮色里轰隆隆地飞驰。"
        - id: ch01-b03
          speakers: [meyers, bettles, malemute_kid]
          ensemble: chorus
          text: "往右！往右转！"
        - id: ch01-b04
          speaker: narrator
          text: "雪橇一架接一架猛然冲出大道，只靠一边橇板斜斜立着，像迎风侧倾的帆船。接下来的一百码，他们全力冲刺，直奔那扇亮着灯的羊皮纸窗。那片暖光不用开口，就已经在诉说屋里的炉火、轰鸣的育空炉和冒着热气的茶壶。可木屋已经有人占了。六十条爱斯基摩犬同时怒吼，同样多的毛茸茸身影扑向第一支狗队。门猛地打开，一名穿猩红色西北骑警制服的男人踏进狂怒的狗群。他的膝盖深深陷入雪里，动作却始终镇定。手里的狗鞭柄不偏不倚地落下，用一顿带惩戒意味的安抚平息了混战。众人这才走近握手。马拉穆特小子回到自己的木屋，反倒由一个陌生人欢迎他。"
        - id: ch01-b05
          speaker: narrator
          text: "斯坦利·普林斯本该出来迎接小子，可他正忙着招待客人。窗里透出的炉火、轰鸣的育空炉和热茶，也全是他的功劳。屋里挤着约十二个人。这是女王陛下手下那些执行法律、运送邮件的人当中，血统最混杂的一群。有人是骑警，有人是邮差，各自的祖先来自不同地方。共同的北国生活却把他们磨成了同一种人。他们个个清瘦结实，肌肉饱受雪道锤炼，面孔被风和日光晒成棕色。清澈沉稳的眼睛坦然望着世界，里面装着一颗无忧无虑的心。他们赶女王的狗队，在漫长雪道上运送女王的信件，也叫女王的敌人害怕。他们只吃女王发下的微薄口粮，却仍过得心满意足。他们真正见识过人生，做过足以惊动世人的事，也经历过传奇般的爱情。只不过，他们自己从来不知道那些经历有多么了不起。"
        - id: ch01-b06
          speaker: narrator
          text: "这些人住得自在极了。两个客人四仰八叉躺在小子的铺位上，唱着祖辈刚进西北、同当地印第安女子结合时唱过的法国小调。三四个强壮船夫占了贝特尔斯的床，把脚趾埋进毯子里，听同伴讲自己怎样跟沃尔斯利的船队一路打到喀土穆。讲故事的人累了，又有个牛仔说起水牛比尔巡游欧洲时见过的宫廷、国王、贵族老爷和贵妇。角落里，两个混血人边补挽具，边回忆他们共同打过的那场败仗。那时西北地区叛乱正烈，路易·里尔在那里称王。粗野的打趣和更粗野的笑话满屋乱飞。雪道与河流上的危险，在他们嘴里不过是家常事。除非带点笑料，或者出了荒唐岔子，他们甚至懒得提。"
        - id: ch01-b07
          speaker: narrator
          text: "普林斯听得入迷。这些没有王冠的英雄亲眼看过历史诞生，却把伟大与传奇只当作日常生活里偶然碰见的小事。他们讲得平淡，好像那一切根本不值得夸耀。普林斯毫不吝惜，把珍贵的烟草大方分给众人。烟雾一起，一串串锈住的记忆也慢慢松开。一段段早被忘掉的奥德赛从旧日里重新醒来，专门讲给他一个人听。后来谈话渐渐停了。赶路人把最后一斗烟装满，又把卷得紧紧的睡皮捆好，准备再次踏上雪道。普林斯这才靠近同伴，低声问小子，这群来去匆匆的人究竟是什么来历。"
        - id: ch01-b08
          speaker: malemute_kid
          text: "那个牛仔，一眼就看得出来。他铺位上的伙伴有英国血统，也不难认。其余的都是林中行者的后代，谁知道又混进了多少种血。门边那两个是典型的混血人，也就是人们说的火木人。围毛线腰巾的小伙子，你看他的眉毛和下巴，就知道从前有个苏格兰人在他母亲烟熏火燎的帐篷里哭过。拿连帽大衣垫头的俊小子是法裔混血，你也听过他说话。他不喜欢睡在旁边的两个印第安人。里尔起事时，纯血印第安人没有跟随，从那以后，两边一直不大对付。"
        - id: ch01-b09
          speaker: stanley_prince
          text: "炉边那个阴沉的人呢？他是谁？我敢说他不会讲英语，整晚一句话也没说。"
        - id: ch01-b10
          speaker: malemute_kid
          text: "你猜错了。他的英语够用。别人说话时，你注意过他的眼睛吗？我注意过。他和这些人没有亲缘，他们说那种混杂土话时，他显然也听不懂。我同样在琢磨他的来历。去问问吧。"
        - id: ch01-b11
          speaker: malemute_kid
          text: "给炉子添两根柴。"
        - id: ch01-b12
          speaker: narrator
          text: "小子抬高声音，直望着那个男人。对方立刻照做。"
        - id: ch01-b13
          speaker: stanley_prince
          text: "这人不知在哪里受过很严的管教。"
        - id: ch01-b14
          speaker: narrator
          text: "小子点点头，脱下袜子，跨过一地横卧的人，把潮湿的鞋袜挂到炉边二十来双鞋袜中间。他试探着问陌生人什么时候能到道森。那人打量他一会儿才回答。"
        - id: ch01-b15
          speaker: otter_skinner
          text: "他们说还有七十五英里。对吗？也许要两天。"
        - id: ch01-b16
          speaker: narrator
          text: "他的口音极轻，说话却毫不迟疑。小子问他来没来过这里，他说没有。问他来没来过西北，他说来过。问他是否生在西北，他仍说不是。"
        - id: ch01-b17
          speaker: malemute_kid
          text: "那你到底生在哪里？你不是他们一伙的人。你从哪儿来？我以前见过你这样一张脸，却想不起是在什么地方。"
        - id: ch01-b18
          speaker: otter_skinner
          text: "我知道你。"
        - id: ch01-b19
          speaker: malemute_kid
          text: "在哪儿？你见过我？"
        - id: ch01-b20
          speaker: otter_skinner
          text: "没有。很久以前，在帕斯蒂利克，你那个牧师朋友问我有没有见过马拉穆特小子。他给了我食物。我没待多久。他跟你说起过我吗？"
        - id: ch01-b21
          speaker: malemute_kid
          text: "原来你就是拿水獭皮换狗的人。"
        - id: ch01-b22
          speaker: narrator
          text: "那人点头，磕净烟斗，裹进毛皮里，摆明不想再说。小子吹灭油灯，钻进毯子，睡到普林斯身边。普林斯还想知道那人是谁，小子却说，自己也不知道，话题被对方岔开后，那张嘴就闭得像蛤蜊。"
        - id: ch01-b23
          speaker: malemute_kid
          text: "不过，他确实叫人好奇。八年前，整个海岸都在猜他的来历。隆冬时，他从北方下来，沿白令海走了几千英里，像是有魔鬼在后面追。没人知道他从哪儿来，只知道路远得可怕。他到戈洛文湾向瑞典传教士讨食物、问南路时，已经被折磨得不成人样。后来他横穿诺顿湾。那时暴雪狂风不断，换上一千个人都会死，他却活着过去了。他错过圣迈克尔，在帕斯蒂利克上岸时只剩两条狗，自己也快饿死了。"
        - id: ch01-b24
          speaker: malemute_kid
          text: "他急着继续走，鲁博神父给他准备了食物，却分不出狗。没有牲口就走不了，他急得转了好几天。他的雪橇上有一捆鞣得极好的海獭皮，价值比黄金还高。当地有个像夏洛克一样吝啬的俄国老商人，手里偏偏有许多狗。两人没谈多久，陌生人就用那些海獭皮换到一支精神十足的狗队。我们算过，每条狗至少值五百。他不是不懂皮子的价钱。他是某个部族的印第安人，从偶尔说出的话也听得出，他曾在白人中生活。"
        - id: ch01-b25
          speaker: malemute_kid
          text: "海冰融化后，努尼瓦克岛传来消息，说他去那里补过食物。此后他整整消失八年，直到今晚才又出现。他从哪里来，去了什么地方，为什么离开，谁也不知道。他去过没人知道的地方，还受过严格训练，这在印第安人里很少见。普林斯，北国又给你送来一个谜。"
        - id: ch01-b26
          speaker: stanley_prince
          text: "谢谢，可我手里的谜已经够多了。"
        - id: ch01-b27
          speaker: narrator
          text: "小子很快发出沉重的呼吸。年轻的采矿工程师却在黑暗里望着屋顶，等血液里那股奇异的兴奋平静。睡着以后，他的脑子仍没停。他在梦里游荡于白色的未知世界，在无尽雪道上同狗群挣扎，看见男人怎样像男人一样活着、劳作，又怎样死去。第二天还没天亮，赶狗人和骑警便去了道森。那些照料女王利益、掌管她卑微臣民命运的大人物，没给邮差多少休息。一星期后，他们又回到斯图尔特河，驮运大批送往海边的信件。只是狗已经换成了新狗。说到底，狗终究只是狗。"
        - id: ch01-b28
          speaker: narrator
          text: "男人们原以为能歇一歇，也想看看那座金沙如流水、舞厅整夜喧闹的黄金城。结果他们仍只来得及烘干袜子，舒服地抽完晚烟。有一两个胆大的甚至盘算开小差，越过东面无人探过的落基山，再沿麦肯齐河谷回奇佩维安老家。两三个人已经决定，服役期一满就走这条路。他们盼着这趟险途，就像城里人盼进树林玩一天。"
        - id: ch01-b29
          speaker: narrator
          text: "水獭皮客却越来越不安，对这些计划毫无兴趣。他把小子拉到一旁，低声谈了很久。两人戴好帽子手套，去了屋外。回来以后，小子取出金秤，称了约六十盎司金沙，倒进陌生人的口袋。赶狗人的头领也来同他们办妥交易。第二天，大队继续沿河上行，水獭皮客却带着几磅食物，转身回了道森。"
        - id: ch01-b30
          speaker: malemute_kid
          text: "我也没弄明白。这个可怜人拼命想摆脱差事，理由对他一定极要紧，可他不肯说。他签了两年约，和军队一样，想自由就只能花钱赎身。他不能开小差以后还留在这里，却又非留下不可。他说自己到了道森才下定决心。那里没人认识他，他也没钱，我是唯一跟他说过几句话的人。他便同副总督谈好，只要能从我这里借到钱，就把自己赎出来，一年内还清。要是我愿意，他还可以带我去一个富得流油的地方。他没亲眼见过，却认定那里有矿。"
        - id: ch01-b31
          speaker: malemute_kid
          text: "你没看见他怎样求我。到了屋外，他简直快哭了，又哀告，又跪进雪里，我只得把他拽起来。他说话颠三倒四，像疯了。他发誓自己熬了多年就是为了这一刻，现在绝不能失手。我问是为了什么，他还是不说。他怕那些人把他留在雪道另一头，两年回不了道森，那时一切就晚了。我从没见过谁这样失魂落魄。答应借钱后，我还得再把他从雪里扶起来。"
        - id: ch01-b32
          speaker: malemute_kid
          text: "我让他把钱当入伙的本钱，他坚决不肯，反倒发誓会把找到的一切全给我，让我富得超过最贪心的梦。一个人拿命和时间换本钱，通常分出一半都舍不得，所以这背后一定有原因。只要他留在这里，我们迟早会听到消息。"
        - id: ch01-b33
          speaker: stanley_prince
          text: "要是他没留下呢？"
        - id: ch01-b34
          speaker: malemute_kid
          text: "那我的好心就要挨一次打，还得赔掉六十多盎司金沙。"
        - id: ch01-b35
          speaker: narrator
          text: "漫长黑夜带来了严寒。太阳重新在南方雪线上玩起古老的捉迷藏。直到一月初一个凄冷清晨，小子才第一次等到那笔投资的回音。一列载得沉甸甸的狗橇来到他在斯图尔特河下游的木屋。水獭皮客就在队伍里，同行的还有阿克塞尔·冈德森，一个仿佛连诸神也快忘记怎样塑造的男人。北国的营火旁，无论谈起运气、胆量，还是一盘能淘出五百美元金沙的富矿土，总会有人提到冈德森。任何关于勇气、力量与冒险的故事，也少不了他的身影。若围着火的人渐渐没话可说，只要有人提起那个与他同甘共苦的女人，沉下去的谈兴就会回来，连火焰也仿佛重新蹿高。"
        - id: ch01-b36
          speaker: narrator
          text: "诸神塑造冈德森时，像是还记得远古的手艺，把他铸成了世界初开时那种男人。他穿着黄金乡王者一般的奇装，身高足有七英尺。胸膛、脖颈和四肢都属于巨人。为了托住三百磅骨肉，他脚下的雪鞋比旁人的长出整整一码。粗犷的脸上横着突出的额骨和宽阔下颌。浅蓝得近乎无色的眼睛从不退缩，像是只承认强者的法则。他那成熟玉米须般的金发结着白霜，仿佛白昼扫过黑夜，一直披进熊皮外衣深处。他走在狗队前面，沿窄雪道大步而来，浑身带着遥远而古老的海上传说。他用狗鞭柄猛敲小子的门，像南下劫掠的北欧海盗站在城堡门前，雷鸣般索要入内。"
        - id: ch01-b37
          speaker: narrator
          text: "普林斯正挽起一双近乎女子般光洁的手臂揉酸面包，一面不停打量三位客人。一个人一辈子也未必能让这样的三个人同时走进屋檐。水獭皮客仍令他着迷，可他的目光更多在冈德森夫妇之间来回。女人被一天行程累着了。自从丈夫从冻硬的矿脉里征服财富以后，她在舒适木屋里住了许久，身体已经娇软。她倚着丈夫宽阔的胸膛，像一朵纤细的花靠着高墙，懒懒接住小子善意的取笑。那双深黑眼睛偶尔一扫，就叫普林斯的血液莫名躁动。毕竟他是个健康的男人，又已经好几个月没见过多少女人。"
        - id: ch01-b38
          speaker: narrator
          text: "她年长于普林斯，又是印第安人，却与他见过的土著妻子都不同。她到过远方，也到过他的国家。她懂得白人女子懂的大多数事，还懂得许多她们永远不会懂的事。她能拿晒鱼当一顿饭，也能直接睡在雪地里。可她又会故意细说一道接一道的大餐，用诱人的做法折磨众人。几个早已忘掉的菜名刚出口，每个人的肚子便暗自翻腾。她熟悉驼鹿、熊、小蓝狐和北方海域里各种动物的习性，也通晓森林与河流。人、鸟、野兽留在薄薄雪壳上的故事，对她就像一本摊开的书。可她翻看贝特尔斯那本以直白笑话出名的《营地守则》时，眼里也闪着会意的笑。女士来前，普林斯总把书翻过去对墙。谁会料到这个土著妻子也看得懂？如今后悔已经迟了。"
        - id: ch01-b39
          speaker: narrator
          text: "这便是阿克塞尔·冈德森的妻子。她的名字和声望同丈夫并肩而行，早已传遍整个北国。许多从未见过她的人，也早已从营火边的故事里听过她。这份名声并不是虚传。饭桌上，小子凭老朋友的熟稔逗她，普林斯也放下初见的羞怯，加入这场交锋。她一个人应付两个男人，丝毫不落下风。她的回答来得又快又准，常叫两个对手还来不及招架，桌边便先响起笑声。反应稍慢的丈夫除了喝彩，什么也不敢尝试。他为妻子深深自豪，一举一动和每一道目光都在说明，这个女人在他生命里占着何等广阔的位置。他从不掩饰这份骄傲，也没有谁会误解。她只要开口，他便专心听着。她的目光转向哪里，他也会跟着望过去。水獭皮客始终默默吃饭，在这片欢乐中被人忘掉。其他人还没吃完，他已经先离开桌子，走到屋外去照料一路拉橇的狗群。没过多久，他的两个旅伴也戴上手套，穿好风雪衣，跟了出去。"
        - id: ch01-b40
          speaker: narrator
          text: "许多天没有下雪，育空河上的道路早被来往队伍压得结实。雪橇沿着那条硬雪道滑行，轻快得仿佛正走在光滑冰面上。三架雪橇排成一列向前。水獭皮客领着第一架雪橇，独自在最前面开路。普林斯和冈德森的妻子跟着第二架。小子与那个黄发巨人押在第三架后面，一面赶路，一面谈起他们将要寻找的地方。"
        - id: ch01-b41
          speaker: axel_gunderson
          text: "这只是个预感，小子，可我相信是真的。他没去过那里，故事却说得可信，还有一张地图。我多年前在库特内就听过这张图。我很想让你同行，可他性子古怪，发誓只要再多一个人入伙，他就退出。等我回来，一定先告诉你，让你在我旁边圈地，再送你一半城址股份。"
        - id: ch01-b42
          speaker: axel_gunderson
          text: "别推辞。这件事我说了算。事情办完以前，我还需要另一副头脑。要是真的，那就是第二个克里普尔溪。你听清了，是第二个克里普尔溪！那是石英矿，不是砂矿。经营得当，整个地方都能落进我们手里。几百万，再几百万！我们会建起一座城，有成千上万的工人，有水道和轮船，有开到河源的浅水汽船。也许还会修铁路，建锯木厂、发电站、银行、商业公司和辛迪加。喂，我回来以前，你只管闭紧嘴。"
        - id: ch01-b43
          speaker: narrator
          text: "雪橇停在雪道横过斯图尔特河口的地方。无边无际的冰霜之海从这里铺向未知的东方。众人从雪橇绑带下面抽出雪鞋。冈德森同他们一一握手告别，随后走到队伍最前。他巨大的网状雪鞋每迈一步，都会陷进轻雪足有半码。于是他用自己的重量把雪面踏实，好叫后面的狗群不必在深雪中一路挣扎。妻子走在最后一架雪橇后，笨重的雪鞋在她脚下却运用自如，一看便知早已熟练。欢快的告别声打破寂静，狗儿低声哀鸣，水獭皮客挥动鞭子，训斥一条不肯听话的橇尾狗。一个小时以后，那支狗队已经变成一截黑色铅笔，在一张巨大白纸上沿长长的直线缓缓爬行。"
    - id: ch02
      title: 第二章
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "许多星期后的一天夜里，小子和普林斯对着一页从旧杂志上撕下来的棋局苦苦琢磨。小子刚从富矿溪的产业回来，正在养精神，准备出远门猎驼鹿。普林斯也在矿溪与雪道上奔波了几乎整个冬天，只盼在木屋里舒舒服服住一星期。"
        - id: ch02-b02
          speaker: malemute_kid
          text: "把黑马垫进去，将他的王。等等，这样不行。你看下一步。"
        - id: ch02-b03
          speaker: stanley_prince
          text: "这个兵为什么走两格？他肯定会吃过路兵。象一让开……"
        - id: ch02-b04
          speaker: malemute_kid
          text: "慢着，那边不是有空当吗？"
        - id: ch02-b05
          speaker: stanley_prince
          text: "没有，有棋子护着。走吧，你马上就会看出这招管用。"
        - id: ch02-b06
          speaker: narrator
          text: "棋局实在有趣，门外的人第二次敲响木门，小子才应声让他进来。门一开，一个东西踉跄着闯进屋。普林斯看清以后猛地站起。小子从他眼中看见恐惧，连忙回头，纵然见惯惨事也吃了一惊。那东西像是什么都看不见，摇摇晃晃朝他们过来。普林斯缓缓退向挂着手枪的墙边。"
        - id: ch02-b07
          speaker: stanley_prince
          text: "我的上帝，这是什么？"
          emotion: fearful
        - id: ch02-b08
          speaker: malemute_kid
          text: "不知道。像是冻坏了，也饿坏了。小心，这东西说不定疯了。"
        - id: ch02-b09
          speaker: narrator
          text: "小子绕到另一边，又回身关好门。那东西挪到桌前，油灯的火映进眼睛。他忽然觉得好笑，喉咙里滚出一串阴森的咯咯声。原来那是个男人。他猛地仰起身，一手提了提皮裤，唱起水手推绞盘时的号子。"
        - id: ch02-b10
          speaker: otter_skinner
          text: "美国船儿下河来，拉呀，好汉们，拉呀！想不想知道谁把船儿开？拉呀，好汉们，拉呀！南卡罗来纳的乔纳森·琼斯，拉呀，我的好……"
        - id: ch02-b11
          speaker: narrator
          text: "歌声突然断了。他像饿狼一样咆哮，扑向肉架。两人还没拦住，他已经从一大块生咸肉上撕下一口。小子同他扭打起来。那股疯狂的力气来得快，去得也快。他软下来，松开抢来的肉。两人把他扶上凳子，他半边身子都瘫在桌上。少量威士忌让他恢复一点力气，他伸勺去舀糖。饥火略微平息以后，普林斯忍着战栗，递给他一杯淡牛肉汤。"
        - id: ch02-b12
          speaker: narrator
          text: "那人眼里烧着阴郁的狂火，每吞下一口，火光便忽明忽暗。他脸上几乎不剩皮肉，整个面孔深深陷下去，枯槁得看不出活人的模样。严霜不只咬过他一次。每一回都在尚未长好的旧伤上重新结起硬痂。那片干硬表面呈现血污一样的黑色，又裂开一道道可怕的口子，露出里面鲜红的生肉。他的皮衣又脏又破，一侧毛皮烧得焦黑脱落，说明他曾经失去知觉，倒进自己的火堆。小子指给普林斯看，鞣黄的皮革上有一条条被刀割去的痕迹。那是人在没有东西可吃时割下皮子充饥，也是饥荒留在他身上的可怕签名。"
        - id: ch02-b13
          speaker: malemute_kid
          text: "你是谁？从哪里来？"
        - id: ch02-b14
          speaker: otter_skinner
          text: "美国船儿下……河……来。"
        - id: ch02-b15
          speaker: malemute_kid
          text: "至少能确定，这个可怜人是从河上游下来的。"
        - id: ch02-b16
          speaker: narrator
          text: "小子摇了摇他，想逼出清楚的话。男人立刻尖叫，显然痛得厉害。他按住肋侧，撑着桌子慢慢起身。"
        - id: ch02-b17
          speaker: otter_skinner
          text: "她嘲笑我。就是那样，眼里全是恨。她不肯来。"
        - id: ch02-b18
          speaker: narrator
          text: "他的声音低了下去，身体又开始瘫软。小子抓紧他的手腕，追问是谁不肯来。"
        - id: ch02-b19
          speaker: otter_skinner
          text: "她，昂加。她笑，还打我，一下，又一下。后来……后来他躺在雪里，很久很久，一动不动。现在还在那里。"
        - id: ch02-b20
          speaker: malemute_kid
          text: "谁还躺在雪里？"
        - id: ch02-b21
          speaker: otter_skinner
          text: "她，昂加。她眼里全是恨。后来她拿起刀，一下，两下。她没力气。我走得很慢。那里有黄金，很多很多黄金。"
        - id: ch02-b22
          speaker: narrator
          text: "小子以为昂加也许就在一英里外垂死，便凶狠地摇他，一再追问她在哪里，又是什么人。"
        - id: ch02-b23
          speaker: otter_skinner
          text: "她在雪里。我本来也会留在雪里，可我欠着一笔债，非还不可。那债很重。我欠一笔债……"
        - id: ch02-b24
          speaker: narrator
          text: "断续的声音停了。男人摸索腰袋，掏出一只鹿皮袋。"
        - id: ch02-b25
          speaker: otter_skinner
          text: "这笔债要还。五磅黄金，是入伙的钱。马拉穆特小子，我……"
        - id: ch02-b26
          speaker: narrator
          text: "他的头垂到桌上。小子再也叫不醒他。"
        - id: ch02-b27
          speaker: malemute_kid
          text: "是尤利西斯。阿克塞尔·冈德森和那个女人恐怕都完了。来，把他放进毯子。他是印第安人，能熬过去。再说，他身上还有一个故事。"
        - id: ch02-b28
          speaker: narrator
          text: "两人剪开他的衣服，看见右胸附近有两处没愈合的刀伤，伤口边缘已经发硬。"
    - id: ch03
      title: 第三章
      blocks:
        - id: ch03-b01
          speaker: otter_skinner
          text: "我会照自己的说法讲，你们会听明白。我要从最早的地方说起，先讲我和那个女人，再讲那个男人。"
        - id: ch03-b02
          speaker: narrator
          text: "水獭皮客挪到炉边，像是很久没见过火，生怕这份恩赐随时消失。小子举起油灯，让光照着他的脸。普林斯也从铺位边滑下来，坐到近处。"
        - id: ch03-b03
          speaker: otter_skinner
          text: "我是纳斯，是酋长，也是酋长的儿子。我出生在日落与日出之间，出生在黑暗海面上父亲的乌米亚克大皮船里。男人整夜划桨，女人不停把扑进船里的海水舀出去。我们同风暴拼命。咸浪在母亲胸前结成冰，潮水退去时，她也没了气息。可我迎着风暴哭喊，活了下来。我们住在阿卡坦。"
        - id: ch03-b04
          speaker: malemute_kid
          text: "阿卡坦在哪里？"
        - id: ch03-b05
          speaker: otter_skinner
          text: "在阿留申群岛。要越过奇格尼克、卡达拉克，再越过乌尼马克。阿卡坦浮在海中，像是在世界边缘。我们从咸海里捕获鱼、海豹和水獭。森林边缘到黄色海滩之间有一片岩地，屋子就肩挨着肩挤在那里。人不多，世界也小。东方只有一些陌生陆地，也像阿卡坦一样是岛，所以我们以为整个世界都是岛。"
        - id: ch03-b06
          speaker: otter_skinner
          text: "我同族人不一样。海滩沙地上散着弯曲木梁和被浪打歪的船板，那种船不是族人造的。岛端还立着一棵光滑、笔直、高大的松树，三面都望得见海，可岛上从不长松树。老人说，很久以前有两个白人在那里守望了许多天，看太阳一次次升起落下。他们随一条破船从海上来，最初无法适应我们的日子，虚弱得像海豹远去、猎人空手回家时挨饿的孩子。后来他们靠鱼和油养壮，性情也变得凶猛。两人各自盖屋，挑走族里最好的女人，生下孩子。我父亲的祖父的父亲，就是这样出生的。"
        - id: ch03-b07
          speaker: otter_skinner
          text: "所以我身体里流着海上白人的强健血液。他们来前，我们有自己的律法。他们好斗又凶狠，一直打到再没人敢反抗，便做了酋长，废掉旧法。他们规定，男人从此是父亲的儿子，不再归属母亲。长子继承父亲的一切，弟妹各自谋生。他们也教会族人新的捕鱼办法，教我们猎熊，在饥荒前储存更多食物。这些都是好事。"
        - id: ch03-b08
          speaker: otter_skinner
          text: "可两人当上酋长以后，反倒彼此争斗。我的祖先把猎海豹的长矛刺进另一个人身体，深得足有一臂。接着是儿女相斗，孙辈相斗。两家积下深仇，做过许多黑暗的事，一直传到我这一代。最后，我家只剩我继承血脉，另一家只剩一个姑娘，就是同母亲生活的昂加。有一夜，她父亲和我父亲出海后再没回来。后来大潮把两人冲上海滩，他们还死死抱在一起。"
        - id: ch03-b09
          speaker: otter_skinner
          text: "族人说，将来我和昂加都有孩子，争斗还会延续。我从小听他们反复这样讲，也就把昂加当成敌人，认定她的后代会同我的后代交战。长成少年以后，我终于问，为什么活人一定要替死人打仗。他们只说，祖先一直如此。我看不出道理，可所有人都说非这样不可，而我还年轻。"
        - id: ch03-b10
          speaker: otter_skinner
          text: "他们催我早点成婚，好叫我的孩子先出生，抢在她的孩子前面长大。这对我不难。我是头领，族人敬重祖先的功业、律法和我的财富，任何姑娘都愿跟我。可我谁也看不上。老人和姑娘们的母亲急得不停催促，因为猎人已经竞相向昂加的母亲出价。若她的孩子先长大，我的孩子就会死。"
        - id: ch03-b11
          speaker: otter_skinner
          text: "一次捕鱼归来的傍晚，我才找到想娶的人。太阳贴着海面，光芒刺眼。风毫无拘束，皮艇在白浪之间竞驰。昂加的皮艇忽然从我身旁飞过去。她只望了我一眼，黑发像夜云在风里飘，脸颊沾满浪花。我只是个少年，却在那一刻看得清清楚楚。我知道，这是同类在呼唤同类。"
        - id: ch03-b12
          speaker: otter_skinner
          text: "她冲到前面，才划两桨又回头看我。世上只有昂加会那样看人。我再次听见同类的呼唤。我们越过慢吞吞的乌米亚克船，把它们甩在后面，族人在远处呐喊。她划得太快，我的心又像一张鼓满风的帆，怎么也追不上。风越来越强，海面全白了。我们像海豹一样跃过浪脊，再轰然冲进太阳铺下的金色航道。"
        - id: ch03-b13
          speaker: narrator
          text: "纳斯半蹲着离开凳面，摆出挥桨的姿势。炉火另一边，他仿佛又看见昂加的皮艇起伏，看见她飞扬的长发。他耳边重新响起风，鼻孔里也像灌进新鲜咸味。"
        - id: ch03-b14
          speaker: otter_skinner
          text: "她先上岸，笑着跑过沙滩，进了母亲的屋。那晚我想到一个伟大的主意，配得上阿卡坦头领。月亮升起后，我来到她母亲门前，看见亚什—努什的财物堆在那里。他是强壮猎人，想做昂加孩子的父亲。先前也有别的青年送来东西，后来都取走了，而每个人的聘礼都比上一个更多。"
        - id: ch03-b15
          speaker: otter_skinner
          text: "我对月亮和星星大笑，回到储藏财富的屋里，一趟趟搬运，直到我的东西比他的多出五件。那里有晒鱼、熏鱼，四十张普通海豹皮，二十张装满油的毛皮海豹皮，还有我亲手猎来的十张熊皮。又有珠子、毯子和鲜红布匹，都是从东方人手里换来的。我是阿卡坦的头领，财富超过所有青年，祖先也立过功、定过律法。可天亮以后，我的聘礼一件不少。"
        - id: ch03-b16
          speaker: otter_skinner
          text: "女人们互相微笑，说着挖苦话。我不明白，从没人出过这样高的价。第二夜我又添许多东西，还放上一条从未下海的精制皮艇。白天来了，东西仍在那里，任全族嘲笑。昂加的母亲太狡猾，我在族人面前受辱，怒火也升起来。第三夜，我终于堆出一座财富的小山，最后还拖来价值二十条皮艇的乌米亚克大船。第二天早晨，东西全都不见了。"
        - id: ch03-b17
          speaker: otter_skinner
          text: "我开始筹备婚礼，连更东方的人也来赴宴领礼。照我们的算法，昂加比我大四个太阳。我还年轻，可我是酋长，又是酋长的儿子，这便不算什么。谁知海面上出现一张船帆，越靠近就显得越大。清水从排水孔涌出，船员忙着抽水。船头站着一个巨人，一边测水深，一边用雷鸣般的嗓音发号施令。他眼睛淡蓝，像深海。头发像海狮鬃毛，金黄得像南方收割后的麦秆，也像水手编成的绳纱。"
        - id: ch03-b18
          speaker: otter_skinner
          text: "近年我们远远见过船，这却是第一条停上阿卡坦海滩的。宴席中断，女人孩子躲进屋，男人拉弓持矛等着。船一碰岸，陌生人根本没理我们，只顾自己的事。退潮时，他们把双桅船扳向一侧，修补船底的大洞。女人便悄悄回来，婚宴继续。涨潮后，他们用锚把船拖回深水，才带礼物走来。我请他们坐下，也给他们和别的客人一样多的回礼，因为那是我的婚礼，而我是阿卡坦的头领。"
        - id: ch03-b19
          speaker: otter_skinner
          text: "海狮鬃毛的男人也来了。他高大得每走一步都像能震动土地。他抱着双臂，长久望着昂加，从太阳还挂着，一直看到太阳沉下、星星升起，这才独自回船。我牵起昂加的手，把她领进自己的屋。歌声和笑声在四面响起，女人照这种时候的规矩说着促狭话，我们却毫不在乎。后来族人把我们单独留下，各自回家。等最后一点人声还没散尽，海上人的头领便推门进来。他带着黑瓶，我们喝了里面的酒，很快便兴高采烈。你们要记住，我还只是个少年，一辈子住在世界边缘，什么都不懂。那酒把我的血烧成火，也让心轻得像浪花撞上峭壁时飞起的泡沫。"
        - id: ch03-b20
          speaker: otter_skinner
          text: "昂加沉默地坐在角落毛皮间，睁大眼睛，像是害怕。男人久久看她。随后手下搬进一捆捆货物，堆出的财富比整个阿卡坦还多。有长枪、短枪、火药、弹丸、炮弹、亮斧、钢刀、精巧工具，还有我从没见过的怪东西。他打手势说，这些全给我。我以为他慷慨得像个伟人。可接着他又比画，昂加得随他坐船离开。"
        - id: ch03-b21
          speaker: otter_skinner
          text: "你们明白吗？他要带昂加走。祖先的血在我身体里烧起来，我抓起长矛刺他，可黑瓶里的精灵偷走了手臂的力气。他掐住我的脖子，把头往墙上撞。我立刻软得像新生婴儿，双腿再也撑不住。昂加尖叫，死死抓住房里的东西。他拖她去门口，东西不断倒在周围。后来他用巨臂把她抱起。昂加撕扯他的黄发，他却笑得像一头发情的大公海豹。"
        - id: ch03-b22
          speaker: otter_skinner
          text: "我爬到海滩呼喊族人，可他们全都害怕。只有亚什—努什像个男人。他们用桨打他的头，直到他脸朝下倒在沙里，再也不动。海上人唱着歌升帆，乘风离开。族人反而说这是好事，两家血脉从此不会再争斗。我一句话没说。等满月升起，我把鱼和油装进皮艇，向东方出发。"
        - id: ch03-b23
          speaker: otter_skinner
          text: "我看见许多岛，也遇见许多人，这才知道世界原来那样辽阔。我用手势同他们交谈，问那条双桅船，问昂加，也问长着海狮鬃毛的男人。可谁也没见过他们，只会一味指向东方。我睡过奇怪地方，吃过陌生食物，也见过从未见过的面孔。许多人笑我，以为我的脑子出了毛病。可有时，老人会把我的脸转向亮处，仔细看过以后为我祝福。年轻女人听到那条船、昂加和海上来客时，眼神也会变得温柔。我穿过危险的海和狂暴的风，先到乌纳拉斯卡。那里停着两条双桅船，却都不是我要找的。于是我继续向东，世界在眼前越来越大。乌尼马克没有消息，卡迪亚克没有，阿托格纳克也没有。"
        - id: ch03-b24
          speaker: otter_skinner
          text: "后来我到了一片岩石嶙峋的土地，人们正在山里挖洞，再把石头装上双桅船。我觉得这很孩子气，整个世界不都是石头吗？可他们给我食物，也叫我工作。船装满后，船长给我钱，让我下船。我问他去哪儿，他指着南方。我打手势说也要去。他先笑，后来因为缺人手，便让我留下。我学会他们的语言，学会拉绳索，在狂风突起时收硬帆，也轮班掌舵。这不奇怪，我祖先的血本就来自海上。"
        - id: ch03-b25
          speaker: otter_skinner
          text: "我以为到了那男人的族人中间，就很容易找到他。我们的船穿过一道海上门户，进了一座港口。我原以为那里能有十条双桅船，谁知船只沿码头排了几英里，密得像鱼群。我询问长着海狮鬃毛的人，大家只用许多语言笑我。我走进城里，想看清每张男人的脸，可人多得像浅滩上的鳕鱼。喧响叫我什么也听不见，眼前的一切不停移动，搅得我头昏。"
        - id: ch03-b26
          speaker: otter_skinner
          text: "我继续往前，穿过一片片在暖阳下歌唱的土地。平原铺满丰饶收成，大城挤满男人。他们过得像女人，嘴里全是假话，心被黄金的贪欲染黑。可远方的阿卡坦族人还在捕鱼狩猎。他们以为世界很小，日子过得快活自在。昂加捕鱼归来时的眼神却始终跟着我。我知道，等时机来到，我一定能找到她。黄昏时，她走过幽静小路。清晨时，她又领着我穿过沾满露水的茂密田野。无论走到哪里，她都在前面。她眼里一直藏着一种许诺，那是世上只有昂加才能给出的许诺。"
        - id: ch03-b27
          speaker: otter_skinner
          text: "我就这样走过一千座城市。有些人待我温和，给我食物。有些人嘲笑我，还有些人咒骂我。我始终咬紧牙关，走陌生的路，看陌生的景物。有时候，我这个酋长、酋长的儿子，也只能替别人做最苦的工。那些人说话粗暴，心硬得像铁，从同胞的血汗和苦难里榨取黄金。我却一直得不到所寻之人的消息。最后，我像归巢的海豹回到繁殖地一样，再度回到海边。只是那已经是北方另一个国家的港口。我在那里隐约听到一些黄发海上人的传闻，知道他是猎海豹的，当时仍在大海上游荡。他的船没有固定航路，我只能再去没有道路的海上寻找。"
        - id: ch03-b28
          speaker: otter_skinner
          text: "我随一群懒散的西沃什人登上猎海豹的双桅船，沿着他不留痕迹的航路向北。那里的捕猎正进行得热火朝天。我们在海上熬了几个月，问过许多船。人人都讲他的狂野事迹，我们却从没看见他。我们一直走到普里比洛夫群岛，在海滩成群杀海豹，再把还带体温的尸体运上船。排水孔很快淌满油脂和鲜血，甲板滑得谁也站不住。后来一条慢吞吞的汽船追赶我们，还用大炮开火。我们把风帆鼓到最满，任海水一次次冲过甲板，把油和血洗得干净。随后船一头钻进浓雾，终于摆脱追兵。"
        - id: ch03-b29
          speaker: otter_skinner
          text: "听说我们逃亡时，他正驶进普里比洛夫群岛，闯到公司的工厂。他叫一部分手下看住雇员，其余人从盐仓搬走一万张生皮。我没亲眼看见，可我相信是真的。我沿海航行多年，一直遇不到他，可三个在北方拥有土地的国家都派船追捕他。我也听见昂加的消息。船长们赞美她，说她总同他在一起，已经学会他族人的生活，过得幸福。但我知道，她的心一定仍望着阿卡坦的黄色海滩。"
        - id: ch03-b30
          speaker: otter_skinner
          text: "很久以后，我回到海上门户旁的港口，得知他已横跨大洋，去俄罗斯海域南伸的暖地以东猎海豹。那时我已成了水手，便登上他同族人的船，跟着他们去猎海豹。那片新陆地附近船只不多，我们贴着海豹群边缘，整个春天一路袭扰，把兽群向北赶。母海豹怀着幼崽。越过俄罗斯界线后，船员开始抱怨，也害怕起来。那里浓雾很重，每天都有人连小艇一起失踪。他们终于不肯再干，船长只得调头。可我知道，那个黄发男人不会怕。他会紧跟海豹群，一直追到少有人敢去的俄罗斯岛屿。于是一个漆黑的夜里，趁船头守望人打盹，我放下一条小艇，独自去了南方的江户湾。那里的姑娘身材娇小，明亮得像钢，也很好看。可我不能停留，因为昂加正在北方繁殖地附近那摇晃的甲板上颠簸。"
        - id: ch03-b31
          speaker: otter_skinner
          text: "江户湾的男人来自世界尽头，没有神，也没有家园，打着日本旗航行。我随他们去铜岛富饶的海滩，把盐腌毛皮堆得越来越高。那片海寂静得看不见别人。直到即将离开时，浓雾忽然从劲风边缘散开，一条双桅船朝我们压来，后面紧追着俄罗斯军舰冒烟的烟囱。我们借横风逃，那条船却越追越近。我们走两英尺，它能蹿出三英尺。船每次跃起，舵叶都会泛着绿光露出海面。海狮鬃毛的男人站在船尾高台，把帆张得几乎压弯栏杆，还凭着旺盛的生命放声大笑。昂加也在那里，我一眼便认出。海上炮声一响，他就把她赶进船舱。"
        - id: ch03-b32
          speaker: otter_skinner
          text: "船每次从浪上跃起，舵叶都带着绿光露出海面。我紧抓舵轮破口大骂，背后尽是俄罗斯人的炮弹。我们都知道，他想抢到前头，把我们留给军舰，自己好趁机逃掉。炮弹终于打断我们的桅杆。船像受伤的海鸥，拖着断翅滑进逆风。他却从前面冲过去，越过天际边缘消失了，仍同昂加在一起。我们还能怎样？船舱里那些刚剥下来的毛皮就是证据。俄国人把我们押进港口，又送往一片荒凉土地，逼我们下矿挖盐。有人很快死了。而有些人，没有死。"
        - id: ch03-b33
          speaker: narrator
          text: "纳斯猛地掀开肩上的毯子。纠结扭曲的皮肉上，鞭痕一道接一道。普林斯不忍再看，连忙替他盖好。"
        - id: ch03-b34
          speaker: otter_skinner
          text: "我们在那里熬了很久。偶尔有人向南逃，总会被抓回来。后来，江户湾来的囚徒在夜里起事，抢了守卫的枪，一起往北逃。那片土地广得没有尽头。有泡在水里的平原，也有遮天的森林。严寒降临以后，大雪盖住地面，谁也不知道道路在哪儿。我们在无边森林里走了好几个月。如今过去多久，我也记不清。食物少得可怜，我们常常直接躺下等死。最后终于走到冰冷大海时，活着看见它的只剩三个人。其中一个从江户起就是船长。他脑中装着大地的形状，也知道有个地方，人能踩着冰从一片大陆走到另一片。"
        - id: ch03-b35
          speaker: otter_skinner
          text: "他领着我们走了太久，最后只剩两人。到了那里，我们遇见五个有狗和毛皮的异族人，自己却什么都没有。我们在雪里厮杀，五个人全死了，船长也死了，狗和毛皮归我。我踏上裂开的海冰。有一次浮冰把我带走，直到西风又把我送回岸。再后来，就是戈洛文湾、帕斯蒂利克和那个牧师。之后我一路往南，回到最初流浪过的温暖地方。"
        - id: ch03-b36
          speaker: otter_skinner
          text: "可是大海已经不再丰饶。出海猎海豹的人只能赚到一点钱，却要冒极大的险。船队散了，船长和水手也不知道我要找的人去了哪里。我只得离开永远不肯安静的海洋，回到陆地。在陆地上，树木、房屋和山峦永远坐在同一个地方，不会随风浪移动。我走了很远，也学会很多东西，甚至学会从书本上读写。这些都是我应该学的，因为我忽然想到，昂加一定已经懂得这些。总有一天，等时机来到，我们……你们明白，等时机来到，我就得站在她面前。"
        - id: ch03-b37
          speaker: otter_skinner
          text: "我到处漂流，像那种扬起小帆却不能掌舵的鱼，但眼睛和耳朵始终张着。我专同去过许多地方的人来往，因为我知道，任何人只要见过那两个人，就一定不会忘记。终于，一个刚从山里出来的男人带来几块岩石，里面裸露的金子足有豌豆大。他听过他们，也见过他们，还知道他们住在哪里。他说，他们已经很富，住在一处从地下挖金的地方。那地方是一片遥远的荒野，可我花去再多时间也要到达。"
        - id: ch03-b38
          speaker: otter_skinner
          text: "那营地藏在遥远群山间，人们见不到阳光，昼夜不停做工。我走了很久才终于到达，时机却还没来。他们两人已经走了，据说去了英国，要召集许多有钱人组成公司。我看见他们住过的屋，简直像旧大陆的宫殿。夜里我从窗户爬进去，一间接一间地察看，想知道那个男人究竟怎样对她。所有东西都美好得像国王王后的生活。人人说他把她当王后。许多人猜不透她到底属于哪个部族，因为她血管里还流着另一种血，同阿卡坦女子不同，也没人认得她从前是谁。是的，她是王后。可我是酋长，是酋长的儿子，曾用数不清的毛皮、船和珠子把她换来。"
        - id: ch03-b39
          speaker: otter_skinner
          text: "何必把每一步都说出来呢？我是水手，熟悉船只在海上来去的道路。我追去英国，随后又追到别的国家。有时从别人嘴里听见他们的消息，有时从报纸上读到，却从没有真正赶上。他们手里有很多钱，走得极快，我却是个穷人，只能靠双脚和零碎工钱追赶。后来灾祸突然落在他们头上。一天之内，财富像一缕烟一样散尽。当时每份报纸都在写这件事，可从那以后，两人便再无消息。我知道，他们已经回到能从地下挖出更多黄金的地方。像他们那样的人，失去黄金，只会再去找黄金。"
        - id: ch03-b40
          speaker: otter_skinner
          text: "他们穷了，也从世上消失了。我从一个营地走到另一个，甚至一路北上库特内，终于嗅到已经冷掉的踪迹。有人说他们来过又走了，有人指这边，有人指那边，还有人说他们去了育空。我就在各个方向之间来回奔走，不停从一地赶往另一地。辽阔世界几乎把我拖垮。库特内有个西北混血人同我踏上一条险恶又漫长的雪道。他曾沿无人知道的路翻过群山，去过育空。饥荒逼近时，他偏偏死了。知道自己活不久以后，他把一张地图交给我，还说出一个地方的秘密。他指着自己的神发誓，那里有很多黄金。"
        - id: ch03-b41
          speaker: otter_skinner
          text: "后来全世界都涌向北方。我穷得只能卖身赶狗。后面的事你们已经知道。我在道森见到他和她。她没认出我。当年我还是少年，她已经经历过整个广阔世界，怎么会记得那个为她付过无数代价的人？你替我赎清服役期，我便回去照自己的办法安排。我等得太久，终于把他握在手里，反而一点也不急。"
        - id: ch03-b42
          speaker: otter_skinner
          text: "我原本就打算照自己的办法做。我已经等了太多年。等我终于把他攥在手里，反倒不着急了。我回望自己这一生，看见走过的海洋和陆地，也看见经历和忍受过的一切。我又想起俄罗斯海边那片无尽森林，想起那里的严寒与饥饿。你们知道，我领着他向东走，也领着昂加同行。我们离开有人居住的河流，进入那片许多人走进去、却很少有人回来的东方。我把他们带向一个地方，那里黄金遍地，人却没有办法真正占有。死人留下的白骨和诅咒，也同黄金躺在一起，等待后来的人。我知道那条路会消耗食物，也知道严寒会一点点拿走人的力气。他们却以为，我只是照地图带路，带他们去取得一笔无人想象得到的财富。"
        - id: ch03-b43
          speaker: otter_skinner
          text: "路很远，雪道又从没人踩过。狗多，吃得也多，雪橇上的食物撑不到开春。我们必须赶在河冰解冻前回来，所以一路把食物藏在不同地方。这样既能减轻雪橇，也能保证返程不挨饿。麦克奎斯琴河附近有三个男人，我们在他们旁边藏了一批。梅奥河旁有十二个从南面翻过分水岭的佩利猎人，我们又建一处藏食点。再往东就见不到人，只有沉睡的河、纹丝不动的森林和北国的白色寂静。那条路漫长又没有脚印，有时苦干整天也只能走八英里或十英里。晚上睡下去，身体就像死了一样。他们做梦也不知道，我就是阿卡坦的纳斯，是远道前来讨还旧债的人。"
        - id: ch03-b44
          speaker: otter_skinner
          text: "往后的藏食点在不知不觉间变得越来越小。夜里沿着白天刚踩出的雪道折回，把藏食点弄成另一副样子，让人以为食物被狼獾偷走，这并不困难。河上还有一些落差很大的地方。水流在那里十分凶猛，上面的冰不停生成，下面却不断被流水掏空，只剩一层随时会破的壳。在这样一个地方，我赶的雪橇和整队狗全掉进了冰窟。对他和昂加来说，这不过是一场突然降下的厄运，没有别的意义。可那架雪橇上装着许多食物，那队狗也是全部狗里最强壮的。失去它们以后，余下的路立刻变得更重。"
        - id: ch03-b45
          speaker: otter_skinner
          text: "他面对这场损失仍放声大笑，身上的生命力强得惊人。他先把余下狗群的口粮一点点削减。狗越来越瘦，也越来越弱，直到我们只能把它们一条条从挽索上解下来。每当一条狗再也走不动，我们就杀掉它，用它的肉喂给还能赶路的同伴。狗群便一天少过一天。他说，返程时大家可以轻装上路，从一个藏食点吃到下一个，所以不再需要狗，也不再需要雪橇。他说得没有错，因为手里的食物已经越来越少。等我们终于抵达那处埋着黄金、白骨和诅咒的地方，最后一条狗恰好在前一晚死在挽索上。它一直拉到再也拉不动为止。"
        - id: ch03-b46
          speaker: otter_skinner
          text: "地图一点也没错。为了走进群山腹地，我们在分水岭的陡壁上凿出一级级冰阶。本以为翻过去会见到山谷，可另一边根本没有山谷。积雪一直平铺向远方，辽阔得像一片丰收平原。四面巨山围住它，把白色头颅高高伸进群星。就在这片本该是山谷的奇异平原中央，大地和积雪忽然一同塌陷，垂直坠向世界的心脏。若我们不是水手，看到这一幕，脑袋一定会晕得转起来。我们站在叫人目眩的边缘，寻找下去的道路。只有一面坑壁崩塌成斜坡，像顶帆风里倾斜的甲板。我不知道它为何如此，可它确实就在那里。"
        - id: ch03-b47
          speaker: axel_gunderson
          text: "这是地狱的入口。下去吧。"
        - id: ch03-b48
          speaker: otter_skinner
          text: "我们下到坑底，看见一间用圆木搭的老木屋。不同年代的人曾独自死在那里，临终的话和诅咒刻在白桦皮上。有人死于坏血病，有人被同伴抢走最后的食物和火药，有人被白脸灰熊撕伤，还有人外出找猎物后饿死。一个又一个，都舍不得离开黄金，最后用各自的方式死在旁边。毫无用处的金沙铺黄了木屋地面，像梦一样。"
        - id: ch03-b49
          speaker: axel_gunderson
          text: "我们已经没食物了。只看一看黄金，查清矿脉在哪儿、有多少，然后马上离开，别让它钻进眼睛，偷走判断。这样下次才能带更多食物回来，把这里全部占住。"
        - id: ch03-b50
          speaker: otter_skinner
          text: "他的意志很硬，头脑也清醒。我们找到切进坑壁的巨大矿脉。它确实像真正的矿脉那样深入岩壁。我们测量宽窄，从上方和下方追查走向，打下矿权界桩，又在树干上削出记号，说明这里已经归我们所有。做完这些，我们的双膝已经饿得发抖，腹中一阵阵恶心，心脏也一直撞到喉咙口。三个人最后一次爬上那面巨壁，转身走上归途。最后一段路，我们只能把昂加拖在两人中间。三个人一次次跌倒，又一次次爬起，终于到达藏食点。那里一口吃的都没有。手脚做得很像，他认定食物是狼獾偷走的，便把狼獾和自己的神放在一起咒骂。"
        - id: ch03-b51
          speaker: narrator
          text: "昂加很勇敢。她微笑着，把手放进丈夫掌中。纳斯只能转过脸，才忍住自己的感情。"
        - id: ch03-b52
          speaker: unga
          text: "今晚守着火歇下吧。我们嚼鹿皮鞋，多少能添一点力气。"
          emotion: calm
        - id: ch03-b53
          speaker: otter_skinner
          text: "我们割下鹿皮鞋帮，把硬皮切成一条条细丝，在锅里煮了半夜，才软到可以勉强嚼碎咽下。第二天早晨，我们坐在火边，一同估算活命的机会。下一个藏食点还有整整五天路程，以现在的力气无论如何也走不到。就算把剩下的鹿皮鞋全部吃光，也撑不了那么久。我们只剩一个办法，必须在附近找到猎物。"
        - id: ch03-b54
          speaker: axel_gunderson
          text: "我们出去打猎。"
        - id: ch03-b55
          speaker: otter_skinner
          text: "好，我们去打猎。"
        - id: ch03-b56
          speaker: otter_skinner
          text: "他让昂加留在火边保存体力。然后他去找驼鹿，我去被自己挪动的食物那里，只吃一点，免得他们看出我还有力气。夜里他回来时摔倒许多次。我也装得极虚弱，被雪鞋绊得东倒西歪，像每一步都是最后一步。我们继续靠鹿皮鞋活命。"
        - id: ch03-b57
          speaker: otter_skinner
          text: "他是个伟大的人，直到最后，灵魂仍死死撑着身体。除了担心昂加，他从不为自己叫苦。第二天我跟在后面，不肯错过结局。他每走一阵便要躺下休息，呼吸很久才能再次站起。到那天晚上，他已经接近死亡。可第二天早晨，他仍虚弱地咒骂着命运，又独自走进森林。他像醉汉一样摇晃，步子有时向左，有时向右。我一次次以为他会倒下认输。可他有强者的力量，也有巨人的灵魂，竟拖着身体熬过疲惫的一整天。他终于打到两只松鸡，却一口也没吃。他甚至不必生火，那两只鸟本身就是生命。只要咬下一口，力量就可能回来一点。可他心里只有等在营地的昂加，立刻转身往回走，要把全部食物带给她。"
        - id: ch03-b58
          speaker: otter_skinner
          text: "他已经完全不能走，只能用手和膝盖在雪里爬。我来到他身旁，从他的眼里看见死亡。即使到了这时候，只要吃掉一只松鸡也还不算太迟。他却扔下步枪，腾出双手爬行，又像狗一样把两只鸟衔在嘴里。我直立着走在旁边。他每次停下来休息，都会抬眼望我，诧异我为什么还剩这么多力气。我看得出他在想什么。可他的嘴唇偶尔动一下，已经发不出任何声音。"
        - id: ch03-b59
          speaker: otter_skinner
          text: "他确实伟大，我的心也劝我放过他。可我又看见自己的一生，看见俄罗斯海边无边森林里的严寒和饥饿。昂加原本是我的，我付过无数毛皮、船和珠子。我们穿过白色森林，寂静像湿海雾压在身上。往昔的幽灵围着我。我看见阿卡坦的黄沙滩、竞驰的皮艇和森林边的屋子，也看见制定律法的祖先。亚什—努什也跟着我，湿沙还粘在头发里，手里仍握着倒下时折断的战矛。我知道，时机已经来了。我又在昂加眼里看见那份许诺。"
        - id: ch03-b60
          speaker: otter_skinner
          text: "闻到营火烟味以后，我弯腰从他齿间夺走松鸡。他侧身躺着，眼里的惊讶越来越深。一只手慢慢摸向腰间的刀，我先夺过来，凑到他脸前微笑。他还是不懂。我便比画黑瓶里的酒，又在雪上堆起高高的货物，把新婚夜重演给他看。我没说一个字，他却明白了。他仍不怕，嘴角带着讥笑，眼里全是冰冷怒火。真相反而给了他新的力量。营地已经不远，可雪很深，他爬得极慢。"
        - id: ch03-b61
          speaker: otter_skinner
          text: "有一次他躺下以后，很久都没有再动。我把他翻过来，俯身望进他的眼睛。有时从里面望出来的还是他自己，有时却已经换成死亡。我一松开手，他又挣扎着翻回去，继续向前爬。我们就这样一点点来到火边。昂加一看见他，立刻扑到身旁。他的嘴唇无声地动了几下，随后抬手指向我，好让昂加明白是谁做了这一切。再后来，他就一动不动地躺在雪里，躺了很久很久。直到现在，他仍在那里，埋在雪中。"
        - id: ch03-b62
          speaker: otter_skinner
          text: "煮好松鸡以前，我一句话没说。随后，我用她多年没听见的故乡话开口。她猛地坐直，惊讶地问我是谁，从哪里学来这种话。"
        - id: ch03-b63
          speaker: otter_skinner
          text: "我是纳斯。"
        - id: ch03-b64
          speaker: unga
          text: "你？真的是你？"
          emotion: surprised
        - id: ch03-b65
          speaker: narrator
          text: "她爬近一些，要看清他的脸。"
        - id: ch03-b66
          speaker: otter_skinner
          text: "是我。我是纳斯，阿卡坦的头领，是那支血脉最后的人。你也一样，是你那一支最后的人。"
        - id: ch03-b67
          speaker: narrator
          text: "她笑了。纳斯愿拿见过和做过的一切起誓，但愿再也不要听到那样的笑。白色寂静里，他同死亡和这个发笑的女人孤零零坐着，笑声冷透了他的灵魂。"
        - id: ch03-b68
          speaker: otter_skinner
          text: "来，先吃东西。我们该走了，回阿卡坦还有很长的路。"
        - id: ch03-b69
          speaker: narrator
          text: "昂加把脸埋进丈夫的金发里，笑得仿佛天空会在耳边坍塌。纳斯以为她疯了，抓住她的手，催她赶快上路。"
        - id: ch03-b70
          speaker: unga
          text: "去哪里？"
        - id: ch03-b71
          speaker: otter_skinner
          text: "回阿卡坦。"
        - id: ch03-b72
          speaker: narrator
          text: "纳斯等着她的脸因这个名字亮起来，可她变得同死去的男人一样，嘴边是讥笑，眼里只有冰冷怒意。"
        - id: ch03-b73
          speaker: unga
          text: "好啊，我们回去。你和我手牵手，一起回阿卡坦。住进肮脏窝棚，吃鱼和油，再生下一窝值得骄傲的崽子。我们把整个世界忘掉，过得幸福，幸福极了。真好，简直再好不过。来呀，快走，我们回阿卡坦。"
          emotion: angry
        - id: ch03-b74
          speaker: narrator
          text: "她一边说，一边用手梳弄丈夫的黄发，脸上的笑叫人发冷。她眼里已经没有那份许诺。纳斯默默坐着，惊异于女人这样难懂。他回想冈德森从身边拖走她的那一夜。那时她尖叫着撕扯这个男人的头发，如今却爱抚同样的头发，死也不肯离开。接着，他又想起自己付出的所有代价，还有漫长等待的年月。他便像当年的冈德森一样，紧紧抓住昂加，把她从死人身边拖开。她拼命往后挣扎，同新婚夜一模一样，像一只保护幼崽的母猫那样抓挠厮打。等篝火终于隔在她和丈夫之间，纳斯才松开手，让她坐下听自己说。"
        - id: ch03-b75
          speaker: otter_skinner
          text: "我把我们分离以后的一切都告诉她。我讲自己在陌生海洋上经历的事，也讲在陌生土地上做过的事。我讲那场叫人疲倦的追寻，讲一年又一年的饥饿，也讲从最初就属于我的那份许诺。是的，我全都说了。当天我和那个男人之间发生的事，更早以前发生的事，我一样也没有隐瞒。说着说着，我看见那份许诺重新在她眼中生长，越来越饱满，越来越明亮，像破晓时渐渐展开的天光。我从那里读到怜悯，读到女人的温柔，也读到昂加的爱、她的心和整个灵魂。"
        - id: ch03-b76
          speaker: otter_skinner
          text: "我又成了少年。她的目光正像当年那次皮艇竞赛以后，她笑着跑过海滩、回到母亲屋里时一样。那些严酷的焦躁消失了，饥渴与疲倦的等待也全都消失。时机终于来到。我感到她的胸膛在呼唤，仿佛只要把头枕在那里，就能忘记自己走过的一切。她向我张开双臂，我便靠了过去。可就在那一刻，她眼里忽然燃起仇恨，手也摸到我腰间。一下，又一下，她握着我的刀刺进来。"
        - id: ch03-b77
          speaker: unga
          text: "狗！猪！"
          emotion: angry
        - id: ch03-b78
          speaker: narrator
          text: "她冷笑着把他推倒在雪里，随后放声大笑，笑得连寂静都像裂开了。她回到死去的男人身旁。"
        - id: ch03-b79
          speaker: otter_skinner
          text: "她刺了一刀，又刺一刀。可饥饿使她太虚弱，命运也不准我死。我原想留在那里，同那些与我生命交错、又领我走上未知道路的人一起闭眼，沉进最后的长眠。可身上还压着那笔债，它不许我休息。回来的路太长，严寒刺骨，食物又少。佩利人没有打到驼鹿，于是抢走我的藏粮。麦克奎斯琴河那三个白人也做了同样的事，可我经过他们的木屋时，他们已经饿得只剩一层皮，死在里面。此后的事我全不记得，直到来到这里，找到食物和火。好多的火。"
        - id: ch03-b80
          speaker: narrator
          text: "他说完，把身体伏得更低，几乎带着妒意贴向炉子。很长一段时间，油灯投在墙上的影子无声演着一幕幕悲剧。"
        - id: ch03-b81
          speaker: stanley_prince
          text: "可是昂加呢？"
          emotion: surprised
        - id: ch03-b82
          speaker: otter_skinner
          text: "昂加不肯吃那两只松鸡。她用双臂抱住他的脖子，把脸深深埋进他的黄发里。我怕严霜冻着她，就把火移得更近。可火一靠近，她便爬到尸体另一边。我只好又在那里生起一堆火。仍然没有多少用处，因为她始终不肯吃任何东西，也不肯离开他。他们就这样，一直躺在上面的雪里。"
        - id: ch03-b83
          speaker: malemute_kid
          text: "那你往后怎么办？"
        - id: ch03-b84
          speaker: otter_skinner
          text: "我不知道。阿卡坦太小，我不大愿回世界边缘生活。活着好像也没什么用。我可以去找康斯坦丁，他会给我戴上镣铐。总有一天，他们会在我这里套一段绳子，我就能好好睡了。可是……不，我不知道。"
        - id: ch03-b85
          speaker: stanley_prince
          text: "可是，小子，这是谋杀！"
        - id: ch03-b86
          speaker: malemute_kid
          text: "安静。有些事高过我们的智慧，也在我们的法律之外。这里的是非，我们说不清，也轮不到我们审判。"
        - id: ch03-b87
          speaker: narrator
          text: "纳斯挨得离炉火更近。屋里一片沉寂。每个男人的眼中，都有许多画面来来去去。"
