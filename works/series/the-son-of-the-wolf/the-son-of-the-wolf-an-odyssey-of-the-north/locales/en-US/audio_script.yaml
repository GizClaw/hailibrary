  chapters:
    - id: ch01
      title: The Man of the Otter Skins
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The sleds sang their old sad song beneath the creak of harness and the small bells of the leaders. Men and dogs had traveled far, and both were too tired to answer. Fresh snow made the trail heavy. The runners carried quarters of frozen moose, hard as flint, and dragged stubbornly through the loose surface.
        - id: ch01-b02
          speaker: narrator
          text: Darkness was settling in, but there would be no camp that night. Fine crystals of frost drifted through the still air. At only ten below zero, the evening felt warm to these travelers. Meyers and Bettles had lifted their ear flaps, and Malemute Kid had even pulled off his mittens.
        - id: ch01-b03
          speaker: narrator
          text: The dogs had been worn out since early afternoon. Now the clever ones grew restless. Their noses worked, their ears rose, and they tugged impatiently at the traces. They nipped the slower dogs from behind until the excitement spread through every team. At last the first leader gave a sharp, satisfied whine, crouched low, and threw his weight into the collar. Every dog followed.
        - id: ch01-b04
          speaker: narrator
          text: Backs bent and traces snapped tight. The sleds jumped ahead. The men clung to the steering poles and lifted their feet fast to keep them clear of the runners. All the day's weariness seemed to fall away. Men shouted, dogs yelped, and the teams raced through the gathering dark.
        - id: ch01-b05
          speakers: [malemute_kid, bettles, meyers]
          ensemble: chorus
          text: "Gee! Gee!"
        - id: ch01-b06
          speaker: narrator
          text: One after another, the sleds swung off the main trail and tipped onto a single runner. A hundred yards ahead, a parchment window glowed. That light promised their own cabin, a roaring Yukon stove, and pots of hot tea. But strangers had reached the cabin first. Sixty huskies roared a challenge, then hurled themselves at the first team.
        - id: ch01-b07
          speaker: narrator
          text: The door flew open. A man in the scarlet coat of the Northwest Police pushed knee-deep into the fighting dogs. He used the butt of his whip calmly and without favor until peace returned. Then hands were shaken. So Malemute Kid was welcomed home to his own cabin by a stranger.
        - id: ch01-b08
          speaker: narrator
          text: Stanley Prince should have greeted him, and Prince had indeed kept the stove hot and the tea ready. But he was busy with a dozen guests. They were a mixed company of policemen and mail drivers, drawn from many peoples. The trail had shaped them into one kind of man, lean and tough, brown from weather, steady in the eye, and easy in the soul. They drove the Queen's dogs, carried her mail, frightened her enemies, ate her poor rations, and stayed cheerful. They had lived through adventures without ever thinking of themselves as heroes.
        - id: ch01-b09
          speaker: narrator
          text: They had made themselves thoroughly at home. Two lay across the Kid's bunk singing old French songs. Three or four more had invaded Bettles's blankets while they listened to a veteran of Wolseley's boat brigade tell how he had fought his way toward Khartoum. When he finished, a cowboy took over. He had traveled through Europe with Buffalo Bill and had seen kings, courts, lords, and ladies. In one corner, two old comrades mended harness and remembered the uprising when Louis Riel had ruled the Northwest.
        - id: ch01-b10
          speaker: narrator
          text: Jokes traveled around the room, each rougher than the last. Dangers on river and trail were treated as ordinary things, remembered only when something funny had happened. Prince listened, spellbound. These men had watched history being made, but to them its greatness and romance were merely part of a day's work. He passed around his precious tobacco, and the gift loosened old memories. Forgotten journeys came alive for him until the talk faded, the last pipes were filled, and bedrolls were tied for the night.
        - id: ch01-b11
          speaker: stanley_prince
          text: "All right, Kid. Who are these fellows?"
        - id: ch01-b12
          speaker: malemute_kid
          text: "You know the cowboy, and you can hear the English blood in the man sharing his bed. The rest come from the old forest runners, mixed with more peoples than anyone could name. Those two bedding down by the door are Boisbrules. Look at the young fellow with the knitted sash. His brows and jaw say there was a Scot somewhere in his mother's family. The handsome man using his coat for a pillow is French and Native. You heard his voice. He doesn't care for the two full-blooded men beside him. Their people chose opposite sides in the Riel rising, and they haven't forgotten it."
        - id: ch01-b13
          speaker: stanley_prince
          text: "What about that gloomy fellow by the stove? I don't believe he speaks English. He hasn't said one word all evening."
        - id: ch01-b14
          speaker: malemute_kid
          text: "He understands it. I watched his eyes while the others talked. But he isn't related to any of them, and their own dialect means nothing to him. I've been wondering about him too. Let's see what we can learn. Put two more sticks in the stove!"
        - id: ch01-b15
          speaker: narrator
          text: The silent man obeyed at once.
        - id: ch01-b16
          speaker: stanley_prince
          text: "Someone has drilled obedience into him."
        - id: ch01-b17
          speaker: narrator
          text: Malemute Kid nodded. He removed his socks, stepped between the sleeping men, and hung the damp wool near the stove among twenty other pairs.
        - id: ch01-b18
          speaker: malemute_kid
          text: "How soon do you expect to reach Dawson?"
        - id: ch01-b19
          speaker: narrator
          text: The stranger studied him before he answered. His accent was slight, and he never had to search for a word.
        - id: ch01-b20
          speaker: naass
          text: "They tell me it is seventy-five miles. Perhaps two days."
        - id: ch01-b21
          speaker: malemute_kid
          text: "Have you been in this country before?"
        - id: ch01-b22
          speaker: naass
          text: "No."
        - id: ch01-b23
          speaker: malemute_kid
          text: "The Northwest Territory?"
        - id: ch01-b24
          speaker: naass
          text: "Yes."
        - id: ch01-b25
          speaker: malemute_kid
          text: "Were you born there?"
        - id: ch01-b26
          speaker: naass
          text: "No."
        - id: ch01-b27
          speaker: malemute_kid
          text: "Then where were you born? You aren't one of these people. I've seen faces like yours, but I can't place them. Where did you come from?"
        - id: ch01-b28
          speaker: naass
          text: "I know who you are."
        - id: ch01-b29
          speaker: malemute_kid
          text: "From where? Have we met?"
        - id: ch01-b30
          speaker: naass
          text: "No. Long ago at Pastilik, your partner, the priest, asked whether I had seen Malemute Kid. He gave me food. I did not stay. Did he tell you of me?"
        - id: ch01-b31
          speaker: malemute_kid
          text: "Ah. You're the man who traded the sea-otter skins for dogs."
        - id: ch01-b32
          speaker: narrator
          text: The man nodded, emptied his pipe, rolled himself in his furs, and ended the conversation. The Kid blew out the lamp and climbed under the blankets beside Prince.
        - id: ch01-b33
          speaker: stanley_prince
          text: "Well? What is he?"
        - id: ch01-b34
          speaker: malemute_kid
          text: "I don't know. He turned my questions aside and closed up tight. But I've heard about him. Eight years ago, the whole coast wondered who he was. In the dead of winter he came down from the far North, thousands of miles from here, following the Bering Sea as if the devil chased him. Nobody learned where he started. He reached a Swedish missionary on Golovin Bay nearly starved and worn through, took food, and asked the way south. Then he left the coast and crossed Norton Sound. He survived storms and winds that would have killed almost anyone. He missed St. Michaels, reached Pastilik with only two dogs, and was close to death."
        - id: ch01-b35
          speaker: malemute_kid
          text: "Father Roubeau gave him supplies, but he couldn't spare dogs because he was waiting for me. Our Ulysses knew better than to leave without a team, so he worried around for days. His sled held a bundle of beautifully cured sea-otter skins, worth their weight in gold. An old Russian trader at Pastilik had dogs to sell, and the bargain was made quickly. The stranger drove south behind a fine new team, and the Russian kept the skins. I saw them myself. By our reckoning, each dog cost at least five hundred dollars. And the stranger knew exactly what sea otter was worth. He was Native, of some kind, but he had lived among white men."
        - id: ch01-b36
          speaker: malemute_kid
          text: "After the sea ice broke, word came that he had stopped at Nunivak Island for food. Then he vanished. This is the first anyone has heard of him in eight years. Where did he come from? What took him so far north? Why did he leave? He has been in places no one can name, and somebody taught him discipline, which is unusual out here. There's another northern mystery for you, Prince."
        - id: ch01-b37
          speaker: stanley_prince
          text: "No, thank you. I have more mysteries than I can manage already."
        - id: ch01-b38
          speaker: narrator
          text: Malemute Kid was soon breathing deeply. Prince lay awake in the darkness until the strange excitement in his blood had quieted. Even in sleep his mind kept traveling. He crossed the white unknown, fought with dogs along endless trails, and watched men live, labor, and die as men.
        - id: ch01-b39
          speaker: narrator
          text: Long before daylight, the policemen and mail drivers left for Dawson. The Queen's service gave them little rest. One week later they returned to Stuart River, loaded with letters bound for Salt Water. They had fresh dogs by then. The men themselves had not been replaced.
        - id: ch01-b40
          speaker: narrator
          text: They had expected time in Dawson to rest and see the new gold city, where dust flowed like water and dance halls never seemed to close. Instead, they dried their socks and smoked their evening pipes with the same good humor as before. One or two talked boldly of deserting and crossing the unknown Rockies, then following the Mackenzie Valley home to the Chippewyan country. Two or three decided they truly would take that dangerous route when their service ended. They planned it as lightly as a city man plans a holiday in the woods.
        - id: ch01-b41
          speaker: narrator
          text: The man with the otter skins was restless, though the talk of escape did not interest him. At last he drew Malemute Kid aside and spoke softly for a long while. Prince watched. His curiosity deepened when they put on caps and mittens and went outdoors. When they came back, the Kid set his scales on the table, weighed roughly sixty ounces of gold, and poured it into the stranger's sack. Then the chief dog driver joined them, and another agreement was made.
        - id: ch01-b42
          speaker: narrator
          text: The next day the mail party continued upriver. The stranger took several pounds of food and turned back toward Dawson.
        - id: ch01-b43
          speaker: malemute_kid
          text: "I still don't know what to make of it. The poor man had to get out of the service for some reason. Whatever it was, it mattered desperately to him, but he wouldn't tell me. He signed for two years, just like a soldier. He couldn't desert and remain in the country, so he had to buy his freedom. He decided in Dawson, but no one there knew him, he had no money, and I was the only person he'd spoken with. The lieutenant-governor agreed to release him if he found the gold, so he came to me for a loan. He promised to repay me within a year. He also offered to lead me to something rich, though he has never seen the place himself."
        - id: ch01-b44
          speaker: malemute_kid
          text: "Once we were outside, he nearly cried. He begged, dropped to his knees in the snow, and made me drag him up. He said he had worked toward this one end for years and could not bear to lose it now. He refused to say what the end was. If the service sent him back over the western trail, he might not reach Dawson for two years, and then it would be too late. When I agreed to lend him the gold, I had to pull him out of the snow again. I called it a grubstake. He wouldn't hear of that. He swore he would give me everything he found and make me richer than I could dream. Most men who trade their labor for a grubstake hate to surrender even half. There is something behind this, Prince. Remember that. If he stays in the country, we'll hear of him."
        - id: ch01-b45
          speaker: stanley_prince
          text: "And if he leaves?"
        - id: ch01-b46
          speaker: malemute_kid
          text: "Then my faith in human nature costs me a little more than sixty ounces."
        - id: ch01-b47
          speaker: narrator
          text: Deep cold came with the long nights. For months there was no word of the gold the Kid had loaned and no sign of the man who borrowed it. At last the sun began its old game of peeping over the southern snowline, appearing briefly and slipping away again. One bleak January morning, a heavily loaded dog train reached the Kid's cabin below Stuart River. The man of the otter skins was with it, but he did not come alone. Beside him walked Axel Gunderson, a man so magnificent that the gods seemed to have forgotten how to make another like him. Throughout the northern camps, men could not talk about luck and courage, ground worth five hundred dollars to the pan, or astonishing feats of nerve and strength without calling up Axel's name. Whenever a campfire conversation began to die, someone needed only mention the woman who shared his fortunes, and every voice came alive again.
        - id: ch01-b48
          speaker: narrator
          text: Axel stood a full seven feet tall, dressed like a king from the richest camp in the Klondike. His chest, neck, and limbs belonged to a giant. He carried three hundred pounds of bone and muscle, so his snowshoes stretched a full yard longer than those of ordinary men. His face looked rough-hewn. A rugged brow rose above eyes of the palest blue, and a massive jaw told anyone who saw him that he trusted the law of strength and never expected to yield. Frost covered hair as yellow as ripe corn silk. It swept down across his bearskin coat like daylight breaking into darkness. Something of the sea clung to the way he moved, though he walked a narrow trail far inland. He strode ahead of the dogs and swung the butt of his whip against the Kid's door. The blow sounded like an old Norse raider returning from a southern voyage and thundering for entrance at a castle gate.
        - id: ch01-b49
          speaker: narrator
          text: Prince stood with bare arms, kneading sourdough and stealing looks at three guests unlike any others who might ever share one roof. Ulysses, as the Kid had named the silent stranger, still fascinated him. The man's face remained closed, and nothing in his manner explained why he had brought these travelers to Stuart River. Yet Prince's eyes returned most often to Axel and Axel's wife. The day's journey had tired her. During the years since her husband mastered the frozen streaks of gold, comfortable cabins had softened a body once trained for the trail. She rested against Axel's enormous chest like a slender flower growing against a stone wall. She answered Malemute Kid's friendly teasing without effort, and now and then her deep dark eyes swept across Prince. He felt each glance. He was young, healthy, and had passed many months in a country where women were rarely seen.
        - id: ch01-b50
          speaker: narrator
          text: She was older than Prince and Native, yet unlike any Native wife he knew. Her conversation showed that she had traveled in England and among people of his own world. She knew most things the women of his race knew, and much more that their protected lives could never have taught them. If needed, she could make a meal from sun-dried fish or shape a bed in open snow. Then she could torment hungry cabin men by describing course after course from elegant dinners until forgotten dishes seemed to rise before them and their stomachs protested. She knew the habits of moose, bears, little blue foxes, and the wild creatures of the northern seas. Forest and stream had taught her their lore. The faint marks that a human foot, a bird, or an animal wrote on delicate snow were as easy for her to understand as a printed page. Prince caught an appreciative light in her eyes when she turned to the Rules of the Camp. Bettles had written those rules when his spirits ran high, and their humor was short, plain, and far from polite. Prince always turned them toward the wall before a lady arrived. Who could have guessed that Axel's Native wife would read every word? The discovery came too late.
        - id: ch01-b51
          speaker: narrator
          text: This, then, was the famous wife of Axel Gunderson. Her name and reputation had traveled hand in hand with his through every part of the North. At supper, Malemute Kid teased her with the confidence of an old friend. Prince soon pushed aside the shyness of a first meeting and joined the contest. Two men set their wits against her one, but she answered every challenge and never seemed hurried. Axel was slower with words. He made no attempt to rescue her and contributed only booming laughter and applause. He was immensely proud. Every look and movement showed the size of the place she held in his life. Across the table, Ulysses ate in silence while the merry battle made everyone forget him. He finished long before the rest, pushed away his plate, and went outside among the dogs. The warm meal seemed far too short. Soon Axel and Unga drew on mittens and parkas and followed their silent guide back into the cold.
        - id: ch01-b52
          speaker: narrator
          text: No snow had fallen for days, and the sleds glided over the packed Yukon trail as if across ice. Ulysses drove the first. Prince traveled with Unga beside the second. Malemute Kid and the yellow-haired giant followed with the third.
        - id: ch01-b53
          speaker: axel_gunderson
          text: "It may be only a guess, Kid, but I believe his story. He hasn't seen the place himself, yet he has a map I heard about years ago in the Kootenay. I wish you could come. He is a strange man, though. He swore he would abandon everything if I brought anyone else. When I return, you get the first news. I'll stake the ground beside mine for you and give you half the town site. No, let me finish. This is my venture now, and if it is real, I'll need your head beside mine before we're done."
        - id: ch01-b54
          speaker: axel_gunderson
          text: "If that map is right, this will be another Cripple Creek. Do you hear me? Another Cripple Creek! It is hard-rock gold, not placer ground. If we handle it properly, we can control the whole field. There will be millions. We'll build a town and bring in thousands of workers. There are good waterways, so we'll run steamships and shallow boats into the upper reaches. Perhaps we'll survey a railroad. We'll have sawmills, electric lights, our own bank, a trading company, and a syndicate. Just keep quiet until I come back!"
        - id: ch01-b55
          speaker: narrator
          text: The sleds stopped where the trail crossed the mouth of Stuart River. Ahead lay an unbroken sea of frost stretching east into the unknown. They untied the snowshoes. Axel shook hands, stepped to the front, and sank half a yard into the soft surface as he packed a path for the dogs. Unga followed the last sled, moving with the practiced ease of long experience. Farewells broke the stillness. Dogs whined. Ulysses used his whip on a stubborn wheeler. One hour later, the train looked like a thin black pencil crawling across a mighty white sheet.
    - id: ch02
      title: The Return
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Many weeks passed. One night Malemute Kid and Prince sat over chess problems torn from an old magazine. The Kid had just returned from his claims on Bonanza and was resting before a long moose hunt. Prince had also spent nearly the whole winter on creeks and trails. A quiet week inside the cabin sounded like paradise to him.
        - id: ch02-b02
          speaker: malemute_kid
          text: "Put the black knight between them and force the king. No, wait. That fails on the next move."
        - id: ch02-b03
          speaker: stanley_prince
          text: "Why move the pawn two squares? It must be taken while it passes, and once the bishop is clear—"
        - id: ch02-b04
          speaker: malemute_kid
          text: "Hold on. That opens a gap."
        - id: ch02-b05
          speaker: stanley_prince
          text: "No, the square is protected. Try it. You'll see."
        - id: ch02-b06
          speaker: narrator
          text: The problem held all their attention. Someone had to knock twice before the Kid called out.
        - id: ch02-b07
          speaker: malemute_kid
          text: "Come in."
        - id: ch02-b08
          speaker: narrator
          text: The door opened, and something staggered through it. For one moment it seemed less like a man than some creature the winter had driven indoors. Prince caught one full look and sprang up. The horror on his face made the Kid spin around. Even he was startled, though years in the North had shown him terrible things. Their visitor did not greet them or appear to know where he was. He tottered blindly toward the table with his weight shifting from side to side. Prince edged backward without taking his eyes from the figure. He stopped only when his hand reached the nail where his Smith and Wesson hung.
        - id: ch02-b09
          speaker: stanley_prince
          text: "My God, Kid. What is it?"
          emotion: fearful
        - id: ch02-b10
          speaker: malemute_kid
          text: "I don't know. Frozen and starved, by the look of him. Be careful. He may be mad."
        - id: ch02-b11
          speaker: narrator
          text: The Kid slid away, shut the door, and came back. The thing reached the table. Lamplight caught its eye, and it seemed amused. A strange cackle came from its throat. Then it rocked backward, hitched up its skin trousers, and began a sailors' hauling song in a broken voice.
        - id: ch02-b12
          speaker: naass
          text: "Yankee ship comes down the river. Pull, my strong boys, pull! Would you know the captain who runs her? Pull, my strong boys, pull! Jonathan Jones of South Carolina. Pull, my strong—"
        - id: ch02-b13
          speaker: narrator
          text: The sailors' chant broke off in the middle of its pull. He tottered toward the meat shelf with a snarl like a wolf. Before either man could block him, he seized a chunk of raw bacon and tore at it with his teeth. Malemute Kid grappled with him while Prince tried to wrench the meat away. Starvation gave the stranger a burst of mad strength, and for a few moments the fight was fierce. Then that unnatural power vanished as quickly as it had come. His hands opened, and he surrendered the bacon without resistance. Between them, the two men guided him to a stool. He could not sit upright. Half his body sprawled across the table while they held him there.
        - id: ch02-b14
          speaker: narrator
          text: "A small dose of whiskey brought him back enough to hold a spoon. The Kid set the sugar tin directly before him, and he dipped into it again and again until the first wild edge of hunger had been dulled. Only then did Prince offer a mug of weak beef tea. He shuddered as he passed it over, but kept feeding the stranger carefully. With every mouthful, a dark frenzy flared in the man's eyes and slowly faded before the next. Almost no flesh remained on his face. Cheeks and temples had fallen inward until the features scarcely looked human. Frost had bitten the skin again and again. Each new injury lay over a scar that had only half healed, building a dry, hard surface of bloody black. Deep cracks cut through it and showed raw red flesh underneath. His skin clothing was filthy and hung in tatters. The fur along one whole side had been scorched away, proof that he had fallen or slept too close to his own fire. Elsewhere, the tanned hide had been sliced away strip by strip and eaten. Those missing strips signed the name of his enemy: famine."
        - id: ch02-b15
          speaker: malemute_kid
          text: "Who are you?"
        - id: ch02-b16
          speaker: narrator
          text: The man did not respond.
        - id: ch02-b17
          speaker: malemute_kid
          text: "Where have you come from?"
        - id: ch02-b18
          speaker: naass
          text: "Yankee ship comes down the river."
        - id: ch02-b19
          speaker: malemute_kid
          text: "I can believe he came downriver. Let's see whether we can bring his mind back."
        - id: ch02-b20
          speaker: narrator
          text: The Kid shook him. The man screamed and pressed one hand to his side. He rose slowly, leaning against the table.
        - id: ch02-b21
          speaker: naass
          text: "She laughed at me. There was hate in her eyes. She would not come."
          emotion: sad
        - id: ch02-b22
          speaker: narrator
          text: His voice faded, and his knees began to fold. The Kid seized his wrist.
        - id: ch02-b23
          speaker: malemute_kid
          text: "Who? Who refused to come?"
        - id: ch02-b24
          speaker: naass
          text: "Unga. She laughed and struck me once, then twice. After that, he lay still in the snow for a long time. He is still there in the snow."
        - id: ch02-b25
          speaker: narrator
          text: The two men looked at each other, unable to understand.
        - id: ch02-b26
          speaker: malemute_kid
          text: "Who is lying in the snow?"
        - id: ch02-b27
          speaker: naass
          text: "Unga. She looked at me with hate, and then—"
        - id: ch02-b28
          speaker: malemute_kid
          text: "Yes. Tell us."
        - id: ch02-b29
          speaker: naass
          text: "Then she took the knife. Once, twice. She was weak. I traveled very slowly. There is gold in that place. So much gold."
        - id: ch02-b30
          speaker: malemute_kid
          text: "Where is Unga?"
        - id: ch02-b31
          speaker: narrator
          text: She might be dying only a mile away. The Kid shook him fiercely and demanded her location again and again.
        - id: ch02-b32
          speaker: naass
          text: "She is in the snow."
        - id: ch02-b33
          speaker: malemute_kid
          text: "Go on."
        - id: ch02-b34
          speaker: narrator
          text: His grip tightened painfully around the man's wrist.
        - id: ch02-b35
          speaker: naass
          text: "I wanted to lie in the snow too, but I owed a debt. It was heavy. I had to pay it. A debt to pay. Five pounds of gold for the grubstake. Malemute Kid, I—"
        - id: ch02-b36
          speaker: narrator
          text: He fumbled in his pouch and pulled out a buckskin sack. Then his head dropped onto the table. The Kid could not wake him.
        - id: ch02-b37
          speaker: malemute_kid
          text: "It's Ulysses. I think Axel Gunderson and the woman are finished. Help me put him between the blankets. He's Native. He may survive this, and if he does, he has a story to tell."
        - id: ch02-b38
          speaker: narrator
          text: The Kid tossed the sack of gold onto the table. As they cut away Ulysses's clothes, they found two open knife wounds near his right breast. The edges had hardened, but neither wound had healed.
    - id: ch03
      title: The Tale of Naass
      blocks:
        - id: ch03-b01
          speaker: naass
          text: "I will tell these things in my own fashion, and you will understand. I must begin at the beginning. First I will tell you about myself and the woman. After that, I will tell you about the man."
        - id: ch03-b02
          speaker: narrator
          text: The man of the otter skins pulled himself close to the stove, like one who had gone without fire so long that he feared it might vanish. Malemute Kid moved the lamp where its light fell across his face. Prince slid to the edge of his bunk and joined them.
        - id: ch03-b03
          speaker: naass
          text: "My name is Naass. I am a chief and the son of a chief. I was born between sunset and sunrise on the dark sea, inside my father's open skin boat. Through the whole night, the men fought the storm with their paddles while the women threw out every wave that broke over us. Salt spray froze on my mother's breast. Her breath left her when the tide turned, but I lifted my voice beside the wind and lived."
        - id: ch03-b04
          speaker: naass
          text: "Our home was Akatan."
        - id: ch03-b05
          speaker: malemute_kid
          text: "Where is that?"
        - id: ch03-b06
          speaker: naass
          text: "Akatan lies among the Aleutian Islands, past Chignik, Kardalak, and Unimak. It stands in the middle of the sea, at the edge of the world. We gathered our living from the salt water. We caught fish, seals, and otters. Our houses crowded together on a narrow rocky strip, with forest behind them and yellow beach below, where the kayaks rested. There were few of us, and our world seemed small. Other islands lay to the east, so we believed the whole world was made of islands. That was enough for us."
        - id: ch03-b07
          speaker: naass
          text: "But I was different from my people. Broken timbers from a foreign boat lay twisted in the beach sand. On the point above the ocean stood a pine trunk, smooth, straight, and tall, though no such tree grew on Akatan. The old people said two white men had come out of the sea in that wreck. Day after day they took turns climbing to the point and watching the horizon. They were weak as children when the seals are gone and the hunters return with nothing. At first they resisted our ways. Fish and oil made them strong again, and then they grew fierce. Each built a house and took one of our best women. Children followed. One of those children became the father of my father's father."
        - id: ch03-b08
          speaker: naass
          text: "Those strangers changed Akatan. Before them, a child belonged to the mother's family. They fought our men until no one dared oppose them, made themselves chiefs, and wrote new laws. From then on, a man was counted as his father's son. The first son inherited everything, while his brothers and sisters had to find their own way. They also taught better ways to catch fish, kill the bears in the woods, and store more food against famine. Those teachings were good."
        - id: ch03-b09
          speaker: naass
          text: "Once there was no one left to challenge them, the two white chiefs turned against each other. My ancestor drove a seal spear an arm's length through the other man's body. Their children continued the quarrel, then their grandchildren. Hatred and dark deeds passed down to my time until only one person remained in each family to carry its blood. I stood alone on my side. On the other side there was only Unga, a girl who lived with her mother. Her father and mine went fishing one night and did not return. Later the great tide brought them back to the beach, locked tightly in each other's arms."
        - id: ch03-b10
          speaker: naass
          text: "The people shook their heads. They said the feud would live again through Unga's children and mine. I heard that so often as a boy that I accepted Unga as my enemy, the future mother of children who would fight my own. But as I grew older, I began to ask why the unborn should carry the battles of the dead."
        - id: ch03-b11
          speaker: naass
          text: "The elders could only tell me that our fathers had done it that way. I saw no justice in their answer, but I was still young. They urged me to marry quickly so my children would be older and stronger than hers. As head man, son of a chief, and owner of much wealth, I could have chosen any young woman. None pleased me. Meanwhile, hunters were offering rich gifts to Unga's mother. The elders warned that if her children came first, mine would surely die."
        - id: ch03-b12
          speaker: naass
          text: "Then one evening I came home from fishing. The sun lay low and bright in our eyes. The wind ran free, and the kayaks raced over white water. Suddenly Unga's kayak shot past mine. She looked at me with spray on her cheek and black hair flying like a cloud at night. The sunlight was blinding and I was only a boy, yet everything became clear. I knew it was the call of kind to kind."
        - id: ch03-b13
          speaker: naass
          text: "Within two paddle strokes, she looked back. Only Unga could look that way. Again, I knew. The people shouted as we tore past their slow skin boats and left them behind. Unga paddled fast. My heart filled like a sail, but I could not catch her. The wind rose, the sea whitened, and we leaped like seals down the golden road of the sun."
        - id: ch03-b14
          speaker: narrator
          text: Naass leaned halfway off his stool, his arms holding the shape of a paddle as he raced again. Beyond the stove he seemed to see Unga's tossing kayak and flying hair. The wind sounded in his ears, and salt spray seemed fresh in his nose.
        - id: ch03-b15
          speaker: naass
          text: "She reached land first and ran laughing across the sand to her mother's house. That night, a great idea came to me, worthy of the chief of Akatan. When the moon rose, I went to her mother's door. Yash-Noosh had stacked his marriage gifts there. He was a strong hunter who wanted to father Unga's children. Other young men had left piles before him and carried them away again. Each new offer had been richer than the last."
        - id: ch03-b16
          speaker: naass
          text: "I laughed up at the moon and stars, then went to the house where my wealth was stored. I made trip after trip until my stack stood five hand-widths taller than his. I brought dried and smoked fish, forty common seal hides, twenty fur-seal skins, each one swollen with oil, and ten bear skins from animals I had killed after they came from their winter sleep. I added beads, blankets, and scarlet cloth traded from island to island out of the distant east. I looked at the smaller pile of Yash-Noosh and laughed. I was head man. No young man in Akatan was richer, and the deeds and laws of my fathers lived in every mouth."
        - id: ch03-b17
          speaker: naass
          text: "At morning I walked down to the beach, watching Unga's mother's house from the corner of my eye. My offer still stood untouched. Women smiled and whispered. Never had anyone offered such a price. That night I added more, including a new kayak of fine cured skins that had never entered the water. Daylight found it all still there for the people to laugh at. Unga's mother was clever, and my public shame made me angry. So I built the pile higher and dragged up my great family boat, worth twenty kayaks. In the morning, every gift was gone."
        - id: ch03-b18
          speaker: naass
          text: "I prepared the wedding. People came even from the islands to the east for the feast and gifts. Unga was four years older than I was, by our way of counting. I was only a youth, but I was chief and the son of a chief, so the difference did not matter."
        - id: ch03-b19
          speaker: naass
          text: "Then sails rose above the edge of the sea. A ship grew larger under the wind, spilling clear water from its sides while men labored at the pumps. At the bow stood a mighty man, calling depths and giving orders in a voice like thunder. His eyes were the pale blue of deep water. Yellow hair covered his head like the mane of a sea lion."
        - id: ch03-b20
          speaker: naass
          text: "We had seen distant ships, but none had ever touched Akatan. The feast stopped. Women and children fled indoors while the men strung bows and waited with spears. The strangers were too busy to notice us. As the tide fell, they leaned the schooner over and repaired a hole in its bottom. The women returned, and our feast began again."
        - id: ch03-b21
          speaker: naass
          text: "When the tide returned, the sailors hauled their ship into deep water and came among us with gifts. They acted as friends, so I welcomed them and gave them the tokens offered to every wedding guest. It was my marriage day, and I was head man of Akatan. The yellow-haired giant came too. He stood so tall and strong that you expected the earth to shake under each step. With his arms folded, he stared at Unga until the sun disappeared and the stars came out. Then he returned to his ship. I took Unga's hand and led her to my house. People sang and laughed. The women teased us in their usual way, and at last everyone left us alone."
        - id: ch03-b22
          speaker: naass
          text: "Before the last voices faded, the captain entered. He carried black bottles. We drank, and soon we were merry. Remember, I was young and had lived my whole life at the edge of the world. The drink set my blood on fire and made my heart light as sea foam blown against a cliff. Unga sat silently among the skins, wide-eyed and afraid. The man watched her without turning away."
        - id: ch03-b23
          speaker: naass
          text: "His sailors brought bundles and piled up more riches than all Akatan owned. There were large guns and small ones, powder, shot, shells, bright axes, steel knives, clever tools, and wonders I had never seen. By signs he told me everything was mine. I thought him wonderfully generous. Then he made the rest clear. Unga must leave with him on his ship."
        - id: ch03-b24
          speaker: naass
          text: "Do you understand? He meant to take Unga away in his ship. The blood of my fathers blazed. I thrust at him with my spear, but the black bottles had stolen the strength from my arm. He caught me by the neck and struck my head against the wall. My legs failed, and I became as helpless as a newborn child."
        - id: ch03-b25
          speaker: naass
          text: "Unga screamed and clung to everything she could reach. The things of the house fell around her while he dragged her to the door. He lifted her in his arms. When she clawed at his yellow hair, he laughed like a great bull seal. I crawled to the beach and called my people, but fear held them back. Only Yash-Noosh acted like a man. The sailors hit him with an oar until he lay facedown in the sand and did not move. They raised sail to their own songs, and the ship carried Unga away on the wind."
        - id: ch03-b26
          speaker: naass
          text: "My people called it good fortune. They said the old blood feud would end. I said nothing. At the full moon I put fish and oil in my kayak and paddled east. Island after island widened the world I had thought so small. I spoke with signs. No one had seen the schooner or the man with the sea-lion mane. Everyone pointed farther east. I slept in strange places, ate strange food, and met unfamiliar faces. Many laughed and thought my mind was broken. Sometimes old men turned my face toward the light and blessed me. Young women listened to the story of Unga and the sea wanderers, and their eyes softened."
        - id: ch03-b27
          speaker: naass
          text: "Rough seas and storms carried me to Unalaska. Two schooners lay there, but neither was his. I kept going. There was no news on Unamok, Kadiak, or Atognak. At last I reached a rocky place where men dug great holes into a mountain. A schooner waited while they loaded it with the rocks they had cut out. That seemed foolish to me because rocks covered the whole earth. The men fed me and gave me work. Once the ship rode low, the captain paid me and dismissed me. I asked where he was going. He pointed south. I begged by signs to go with him. He laughed, but he needed hands and took me aboard."
        - id: ch03-b28
          speaker: naass
          text: "That was how I learned their speech and the work of their ships. I hauled ropes when every man leaned back together. I shortened stiff sails when sudden winds struck, climbed where the masts swung beneath me, and stood my turn at the wheel through darkness and rain. None of it felt strange. The blood of my fathers came from sailors, and the sea had been beneath me since the night I was born. I had imagined that once I lived among the captain's own people, finding one yellow-haired man would be easy. Then our ship raised land and passed through a gateway in the coast. I stood at the rail and watched the port open around us. I expected perhaps ten schooners, as many vessels as I had fingers. Instead, ships stretched along the wharves for miles. Their masts made a forest, and their hulls were packed like little fish in a run. I walked among them asking after a huge sailor with the mane of a sea lion. Men laughed at the poor description. Their answers came in the languages of every part of the earth, and each ship had arrived from a place I had never imagined."
        - id: ch03-b29
          speaker: naass
          text: "I left the harbor and searched the city, looking into the face of every man I passed. But people crowded its streets like cod when the banks are thick with fish. I could not count them, much less study them all. Wheels, feet, voices, bells, and machines struck my ears from every direction. The noise became so great that I could no longer hear any one sound. All the movement made my head turn. Still I went on. I crossed lands that sang beneath warm sunlight, where harvests lay rich over broad plains. I entered great cities swollen with people and watched men live with more comfort than a chief had ever known. Yet many of them used false words and carried hearts black with their hunger for gold. They had everything and still reached for more. All that while, far across the sea, my people on Akatan hunted, fished, stored oil, and slept content because they still believed the world was small."
        - id: ch03-b30
          speaker: naass
          text: "Through it all, I remembered the look in Unga's eyes when we raced home from fishing. That look traveled with me more faithfully than any companion. I knew I would find her when the right time came. In my mind she walked ahead of me along quiet lanes at evening. At other times she led me through thick fields shining with morning dew. Wherever I imagined her, her eyes still held the promise only Unga could give. So I wandered through a thousand cities and asked the same questions in a hundred places. Gentle people gave me a meal and a place to sleep. Others laughed at my story, and still others drove me away with curses. I learned to keep my tongue between my teeth and endure the answer. Sometimes I, Naass, chief and son of a chief, labored for rough men who were hard as iron. They built their fortunes from the sweat and sorrow of the people beneath them. I carried, dug, hauled, and watched, but no word of Unga reached me. My wandering turned back toward the ocean at last, as surely as a seal returns to its breeding ground."
        - id: ch03-b31
          speaker: naass
          text: "This time I reached another port in a different country farther north. There I heard faint stories of the yellow-haired hunter. Men said he hunted seals and was somewhere out upon the ocean. I joined a sealing schooner whose crew came from the coast and followed his trail, though no trail remains behind a ship. For weary months we moved among the fleet. We hailed vessel after vessel and heard many stories of the wild things he had done, yet we never lifted his sails above the horizon. We followed the hunt north to the Pribilof Islands. There we killed seals in herds along the beach. We carried their warm bodies aboard until blood and grease poured through the scuppers and made the deck so slippery that no man could stand without holding fast. Then a slow steamship found us and opened fire with its great guns. We raised every piece of canvas the masts could bear. Our schooner leaned until the sea rushed over the rails, washing the filthy deck clean. Fog closed around us before the steamer could come near, and in that gray wall we escaped."
        - id: ch03-b32
          speaker: naass
          text: "While we fled, the yellow-haired man sailed straight to the Pribilof factory. So the story went, and I believe it. Some of his crew held the workers captive while the others stole ten thousand fresh skins from the salt houses. I never met him on those voyages, yet the northern seas rang with his daring. Three nations sent ships to hunt him. Captains also praised Unga. She always sailed beside him, had learned his people's ways, and was happy, they said. I knew better. I believed her heart still turned toward the yellow beach of Akatan."
        - id: ch03-b33
          speaker: naass
          text: "Much later, I returned to the great port by the gateway. He had crossed the breadth of the ocean to hunt seals east of the long warm country below the Russian seas. By then I was a sailor. I joined men of his race and followed. Few ships hunted that coast. Through the spring we stayed beside the seal herd and drove it north. When the pregnant cows crossed into Russian water, our crew grew afraid. Fog lay thick, and men vanished from the small boats every day. They refused to continue, so our captain turned home. I knew my enemy would not turn. He would follow the herd to the Russian islands where few dared go."
        - id: ch03-b34
          speaker: naass
          text: "One black night, while the lookout slept at the forward end of the ship, I lowered a boat and went alone to the long warm land. From there I traveled south to Yeddo Bay because the sailors there were known to be wild and unafraid. The women of the Yoshiwara were small, bright as polished steel, and beautiful to look upon. I did not remain with them. I knew Unga was still rolling over the northern sea near the seal grounds. The men I found at Yeddo had gathered from every end of earth. They claimed no gods and no homes, and they sailed beneath the flag of Japan. I joined them. Together we went north to the rich beaches of Copper Island, killed seals, stripped their hides, and worked until our piles of salted skins rose high."
        - id: ch03-b35
          speaker: naass
          text: "We saw no one on that silent sea until we were ready to leave. Then fog lifted before a hard wind. A schooner came driving toward us, and close behind it rose the smoky funnels of a Russian warship. We turned and fled across the wind. The schooner gained three feet whenever we gained two. On its stern stood the man with the sea-lion mane, pressing his rails under with canvas and laughing in the fullness of his strength. Unga stood beside him. I knew her instantly. When the cannons spoke, he sent her below."
        - id: ch03-b36
          speaker: naass
          text: "I held our wheel and cursed while Russian shot flew past my back. We knew what he intended. He would cross ahead of us and escape while the warship caught our vessel. Cannon fire tore away our masts, and we dragged into the wind like a wounded gull. His ship passed beyond the edge of the sky with Unga aboard. Our fresh skins proved our guilt. We were taken to a Russian port, then sent into a lonely country to dig salt in the mines. Some men died there. Some did not."
        - id: ch03-b37
          speaker: narrator
          text: Naass threw the blanket from his shoulders. His flesh was knotted and twisted, crossed by the unmistakable stripes of the Russian whip. Prince quickly covered him again. The sight was hard to bear.
        - id: ch03-b38
          speaker: naass
          text: "We remained in the salt country for a long and weary time. The work broke bodies, and the guards' whips marked whatever strength remained. Sometimes a man escaped and turned south, believing warmth and settled country must lie that way. Every one of them came back in chains. At last those of us who had sailed together from Yeddo Bay rose in the night. We took the guns from the guards and ran north because no fugitive had survived the other road. The land opened wider than anything I had known. Wet plains stretched beyond sight, and great forests rose after them. Cold overtook us. Snow covered the ground, and not one man knew the way. We crossed rivers, swamps, and endless trees for weary months. Time lost its shape. Food became so scarce that again and again we lay down believing we would never rise. Men vanished from our number one by one. When the cold sea finally appeared before us, only three were left alive to look upon it."
        - id: ch03-b39
          speaker: naass
          text: "One survivor had once commanded a ship. He carried in his head the shape of the great lands and knew of a place where people could cross from one continent to another on winter ice. He led us along the coast. I cannot say how long we traveled because hunger and cold had swallowed the days. Before we reached the crossing, one more companion died, leaving only the captain and me. There we met five people native to that lonely country. They owned dogs, warm skins, and supplies. We were ragged, starving, and desperate. We fought them in the snow until all five were dead. The captain also died in that fight, so the dogs and skins became mine. Alone, I started across the ice. It was broken and shifting beneath wind and current. Once the piece under my feet tore free and carried me away from land. I drifted until a gale from the west drove the ice back against the shore. After that came Golovin Bay, then Pastilik, the priest, and the food he gave me. From there I turned south once more, toward the warm countries where my wandering had first begun."
        - id: ch03-b40
          speaker: naass
          text: "By then the sea no longer gave up easy wealth. Men who hunted seals took terrible risks for little profit. The fleets had scattered, and the captains and sailors I questioned knew nothing of Axel or Unga. I turned my back on the ocean that never rests. I traveled among inland countries, where trees, houses, and mountains remain in one place instead of rising, falling, and sliding away beneath a sailor's feet. During those years I learned more of the white world's ways. I even learned to read words from paper and write them with my own hand. It seemed right that I should know these things. Unga must know them by then, I reasoned, and someday, when our time came, we would speak together about all that the wide world had taught us."
        - id: ch03-b41
          speaker: naass
          text: "Still I had no direction. I drifted like one of those little fish that lifts a sail into the wind but has no power to steer. My eyes and ears never rested. I sought out sailors, traders, miners, and all people who crossed great distances. Axel and Unga were not easily forgotten. A person who saw that giant and the dark woman beside him would remember them for life. At last a traveler came down from the mountains carrying broken pieces of rock. In every stone, free gold stood out in lumps as large as peas. This man had heard of the two I sought. More than that, he had met them and knew where they lived. They had become rich, he said. Their home stood in a place where men tunneled into the earth and drew gold from the ground."
        - id: ch03-b42
          speaker: naass
          text: "That mining camp lay very far away in a wild country hidden between mountains. Men worked night and day in deep passages where sunlight never reached them. I arrived at last, but the proper time had not yet come. Axel and Unga were gone. People said they had sailed to England to bring rich men together and create great companies. I found the house where they had lived. It looked more like a palace from one of the old countries than a miner's home. One night I climbed through a window because I needed to learn how he treated her. I passed silently from room to room. Everything was so fine that I thought kings and queens must live in just that fashion. The camp agreed that Axel treated his wife like a queen. People wondered about her ancestry. They saw another blood in her face and knew she differed from the women of Akatan, but not one knew who she truly was. Yes, Unga was a queen. Yet I was a chief and the son of a chief. Before all Akatan I had paid for her with an untold price of skins, boats, oil, cloth, and beads."
        - id: ch03-b43
          speaker: naass
          text: "Why burden you with every road? I was a sailor and understood how ships crossed the seas. I followed them to England and from there into other countries. Sometimes I caught a spoken rumor. Sometimes I learned to recognize their names in newspapers. Again and again I arrived soon after they had gone. Their money bought the fastest routes and carried them wherever they wished, while I was poor and had to work for each mile. Then trouble overtook them. Their great fortune disappeared in a single day, like a small curl of smoke vanishing in the wind. For a time, every newspaper spoke of their fall. Soon the stories ended and the world forgot them. I understood what they would do. Without wealth, Axel would return to the frontier and search for another place where gold could be pulled from the ground."
        - id: ch03-b44
          speaker: naass
          text: "Once they were poor, they disappeared from the great world. I wandered from mining camp to mining camp, asking after them wherever restless people gathered. In the Kootenay country, I found a trail that had already gone cold. They had come and left again. One person swore they went east, another sent me west, while others believed they had turned north toward the Yukon. I followed each answer until it failed. I went this way and that, forever crossing from place to place, until the very size of the world seemed enough to wear me out. On one hard Kootenay trail, I traveled with a man of mixed Northwest blood. Famine closed around us, and he decided to die. He had once crossed the mountains to the Yukon by a route unknown to other men. When he knew his final hour was close, he gave me a map and the secret attached to it. By every god he knew, he swore that the place marked there held more gold than men could carry."
        - id: ch03-b45
          speaker: naass
          text: "Then the whole world began pouring north. I had no money, so I sold two years of my life as a dog driver. You know the rest. In Dawson, I found Axel and Unga at last. She did not recognize me. I had been a thin boy when she saw me last, and her life since then had been too vast to leave room for the youth who paid that enormous bride price. You bought me free from my service. I went back to arrange matters in my own way. I had waited many years. Once my hand closed around him, I was no longer in haste."
        - id: ch03-b46
          speaker: naass
          text: "I remembered everything I had endured, especially the cold and hunger in the forest near the Russian seas. Then I led Axel and Unga east, into a country where many have entered and few returned. I promised them the place where men's bones and curses lie beside gold they can never carry away."
        - id: ch03-b47
          speaker: naass
          text: "The trail was long and no traveler had broken it ahead of us. We had many dogs, and every animal ate heavily. Our sleds could not carry enough to keep the whole party fed until spring. We also had to complete the return before the river threw off its ice. So we planned with care. At intervals we built raised stores of food. Each cache made our moving loads lighter and promised protection from famine on the journey home. At the McQuestion River, we met three white men and placed a cache near their cabin. At the Mayo we found a hunting camp of twelve Pelly people who had crossed the divide from the south. We stored more supplies close to them. Axel saw friendly camps and safe food behind us. I saw places that would take the blame when the food was gone."
        - id: ch03-b48
          speaker: naass
          text: "Beyond the Mayo camp, every human trace disappeared. No person crossed our trail or sent smoke above the trees. There was only the sleeping river, the motionless forest, and the White Silence of the North. Snow covered the world ahead, and our own tracks closed the world behind. The way stayed long and unbroken. We took turns forcing a road through it, lifting one snowshoe and then the other while the dogs struggled in our steps. Some days, after labor that seemed endless, we measured only eight miles or ten. When darkness stopped us, we ate, dropped into our robes, and slept with the stillness of dead men. Through all of it, Axel and Unga trusted the quiet driver who held the map. Never once did either suspect that Ulysses was Naass, head man of Akatan, last of his blood, and the man who had crossed the world to set an old wrong right."
        - id: ch03-b49
          speaker: naass
          text: "We made smaller caches as we moved east. During the night, I could walk back over our broken trail and move the food. I left marks that blamed wolverines. At one place, swift water had eaten the underside of the river ice. My sled broke through with its team. Axel and Unga saw only bad luck. That sled had carried much of our food and our strongest dogs."
        - id: ch03-b50
          speaker: naass
          text: "Axel laughed because life was strong in him. He rationed the remaining dogs until one after another fell in the traces and was fed to the others. He said we would return lightly, without dogs or sleds, living from one cache to the next. That was true, because our food was almost gone. The last dog died in harness on the night we reached the gold, the bones, and the curses."
        - id: ch03-b51
          speaker: naass
          text: "The map spoke truly. In the heart of the mountains, we cut steps of ice up the wall of a divide. We expected a valley beyond it. Instead, snow stretched flat as a harvest plain, while great mountains lifted white heads among the stars. In the middle of that level emptiness, earth and snow dropped straight down toward the heart of the world. We were sailors, so the height did not turn our heads. We stood at the edge and searched for a descent. On one side alone, the wall sloped like a ship's deck under heavy wind."
        - id: ch03-b52
          speaker: axel_gunderson
          text: "That is the mouth of hell. Let's go down."
        - id: ch03-b53
          speaker: naass
          text: "And down we went. At the bottom stood an old cabin built from logs thrown over the rim. Men had died there alone at different times. On birch bark they had written their last words and their curses. One died of scurvy. One lost his final food and powder when his partner robbed him. A grizzly tore another apart. Another hunted for game until he starved. All had refused to leave the gold, and each died beside it. The yellow metal they gathered covered the cabin floor like something seen in a dream, worthless to the dead."
        - id: ch03-b54
          speaker: naass
          text: "Axel's mind remained clear. He said we had nothing to eat and must only discover where the gold came from and how much there was. Then we would leave before its glitter entered our eyes and stole our judgment. We could return with more food and take it all. We found the great vein cutting the pit wall, measured it, traced it above and below, planted claim stakes, and marked the trees. Then we climbed the enormous wall for the last time. Hunger shook our knees, sickness twisted our stomachs, and our hearts seemed to beat in our throats. We turned toward home."
        - id: ch03-b55
          speaker: naass
          text: "During the last stretch to the first cache, Axel and I dragged Unga between us. We fell often, but we reached it. There was no food. My work had been well done. Axel cursed the wolverines and his gods together. Unga stayed brave. She smiled and laid her hand in his, and I had to turn away to master myself."
        - id: ch03-b56
          speaker: unga
          text: "We will rest beside the fire until morning. Our moccasins will give us enough strength to go on."
        - id: ch03-b57
          speaker: naass
          text: "We sliced the tops from our moccasins and boiled the leather for half the night before we could chew and swallow it. In the morning we considered our chances. The next cache was five days away. We could not reach it. We had to find game."
        - id: ch03-b58
          speaker: axel_gunderson
          text: "We will go out and hunt."
        - id: ch03-b59
          speaker: naass
          text: "Yes. We will hunt."
        - id: ch03-b60
          speaker: naass
          text: "Axel ordered Unga to remain by the fire and preserve her strength. He went looking for moose. I went to the cache where I had hidden our food. I ate only a little so they would not see too much strength in me. That night Axel fell again and again as he returned. I pretended the same weakness and stumbled over my snowshoes as if every step might be my last. Then all three of us drew what little strength we could from our boiled moccasins."
        - id: ch03-b61
          speaker: naass
          text: "He was a great man. His spirit carried his body beyond its strength. He complained only because he feared for Unga. On the second day I followed him so I would not miss the end. He lay down often. By night he was almost finished, yet next morning he cursed weakly and went out again. He staggered like a drunk. Many times I expected him to surrender, but he had the strength of the truly strong and the soul of a giant. All day he forced his body onward. At last he shot two ptarmigan. He could have eaten them raw and lived, but his thought was for Unga. He turned toward camp."
        - id: ch03-b62
          speaker: naass
          text: "Soon he could no longer walk. He crawled through the snow on his hands and knees. I joined him and saw death in his eyes. It was still not too late for him to eat the birds. Instead, he threw away his rifle, held the ptarmigan in his mouth like a dog, and kept crawling. I walked upright beside him. Whenever he rested, he stared at my strength in wonder. He could no longer speak. His lips moved, but no sound came."
        - id: ch03-b63
          speaker: naass
          text: "My heart almost softened because he was so great. Then I remembered my years of cold and hunger beside the Russian seas. I remembered that Unga was mine and that I had paid an untold price of skins, boats, and beads. We moved through the white forest under a silence heavy as wet sea fog. The ghosts of my past walked everywhere. I saw Akatan's yellow beach, fishing kayaks racing home, and houses along the forest edge. I saw the old chiefs and lawmakers whose blood I carried and whose blood I had joined with Unga's. Yash-Noosh walked beside me with wet sand in his hair and the broken war spear still in his hand. I knew the time had come, and I imagined the old promise in Unga's eyes."
        - id: ch03-b64
          speaker: naass
          text: "At last we smelled smoke from the camp. I bent over Axel and tore the ptarmigan from his teeth. He rolled onto his side. Wonder filled his eyes, and one hand crept toward the knife at his hip. I took it first and smiled close to his face. He still did not understand. Without speaking, I pretended to drink from black bottles. I piled invisible goods high on the snow and acted out everything from my wedding night. Then he understood. He did not become afraid. His mouth twisted with contempt, and cold anger gave him new strength. Camp was near, though the snow was deep, and he dragged himself toward it very slowly."
        - id: ch03-b65
          speaker: naass
          text: "Once he lay still so long that I turned him over and looked into his eyes. At moments Axel looked back. At others, death did. Whenever I released him, he struggled onward. We reached the fire that way. Unga was beside him at once. His lips moved without sound. Then he pointed at me so she would understand. After that, he lay very still in the snow for a long time. He is there even now."
        - id: ch03-b66
          speaker: naass
          text: "I said nothing until I had cooked the birds. Then I spoke to Unga in the language she had not heard for many years. She straightened and stared with wide eyes. She asked who I was and where I had learned the speech of Akatan."
        - id: ch03-b67
          speaker: naass
          text: "I am Naass."
        - id: ch03-b68
          speaker: unga
          text: "You? Can it be you?"
          emotion: surprised
        - id: ch03-b69
          speaker: narrator
          text: She crept nearer to study his face.
        - id: ch03-b70
          speaker: naass
          text: "Yes. I am Naass, head man of Akatan and the last of my blood, just as you are the last of yours."
        - id: ch03-b71
          speaker: naass
          text: "Then she laughed. After all I have seen and done, I pray never to hear such laughter again. It froze my spirit as I sat in the White Silence with death and that laughing woman. I thought her mind had wandered."
        - id: ch03-b72
          speaker: naass
          text: "Come. Eat the food, and we will leave. Akatan is a long journey from here."
        - id: ch03-b73
          speaker: narrator
          text: Unga pressed her face into Axel's yellow hair and laughed until it seemed the sky must fall. Naass had imagined joy at his return and eagerness for their old home. Her laughter was not the answer he understood.
        - id: ch03-b74
          speaker: naass
          text: "Come! The road is long and dark. We must hurry."
        - id: ch03-b75
          speaker: narrator
          text: He seized her hand. She sat upright, and her terrible laughter stopped.
        - id: ch03-b76
          speaker: unga
          text: "Where would we go?"
        - id: ch03-b77
          speaker: naass
          text: "Back to Akatan."
        - id: ch03-b78
          speaker: narrator
          text: He waited for her face to brighten. Instead, her mouth took on Axel's cold, mocking curve.
        - id: ch03-b79
          speaker: unga
          text: "Yes, Naass. We will go hand in hand to Akatan. You and I will live in the filthy huts, eat fish and oil, and have a brood of children that will make us proud forever. We will forget the whole world and be happy. So very happy. It is a wonderful plan. Come, let us hurry home to Akatan."
          emotion: angry
        - id: ch03-b80
          speaker: narrator
          text: She ran her hand through Axel's yellow hair and smiled cruelly. The promise Naass had followed across the world was not in her eyes.
        - id: ch03-b81
          speaker: naass
          text: "I sat without speaking, amazed by the change in her. I remembered Axel dragging her from me while she screamed and tore at the same yellow hair she now stroked and refused to leave. Then I remembered my bride price and all the years I had waited. I gripped her and dragged her away as he once had. She fought me just as fiercely as she had fought him that night. She struggled like a mother cat defending her young. I pulled her beyond the fire, released her, and made her listen."
        - id: ch03-b82
          speaker: naass
          text: "I told her everything that stood between our wedding night and that day. I told of strange seas and distant lands, my long search, the hungry years, and the promise that had guided me. I confessed what I had done to Axel during the journey. As I spoke, a promise seemed to grow in her eyes like dawn. I saw pity, tenderness, love, and the soul of the Unga I had known. I became a youth again because she looked as she had when she ran laughing up the beach to her mother's house. My anger, hunger, and endless waiting fell away."
        - id: ch03-b83
          speaker: naass
          text: "The right moment had come at last. I wanted to lay my head against her and forget everything. She opened her arms. I went to her. Then hatred flashed in her eyes, and her hand found the knife at my belt. She struck once and twice."
        - id: ch03-b84
          speaker: unga
          text: "Dog! Swine!"
          emotion: angry
        - id: ch03-b85
          speaker: narrator
          text: She threw Naass into the snow, laughed until the silence itself seemed to crack, and returned to the dead man.
        - id: ch03-b86
          speaker: naass
          text: "She drove the knife into me twice. Hunger had made her weak, and I was not meant to die there. I wanted to remain, close my eyes, and enter the long sleep beside the people whose lives had crossed mine and drawn my feet along unknown trails. But I still owed a debt, and that debt would not let me rest."
        - id: ch03-b87
          speaker: naass
          text: "The road was long, the cold bitter, and my food almost gone. The Pelly hunters had found no moose, so they robbed my cache. The three white men had robbed it too, but I found them thin and dead in their cabins when I passed. After that, memory leaves me. I know only that I came here and found food and fire. So much fire."
        - id: ch03-b88
          speaker: narrator
          text: His story ended. Naass bent close over the stove, guarding its heat almost jealously. For a long while, shadows from the slush lamp moved across the wall like silent tragedies.
        - id: ch03-b89
          speaker: stanley_prince
          text: "But what happened to Unga?"
        - id: ch03-b90
          speaker: naass
          text: "Unga would not eat either bird. She wrapped her arms around Axel's neck and buried her face in his yellow hair. I moved the fire close so the frost would not reach her, but she crawled to his other side. I built another fire there. It did no good because she still refused food. They are lying together in the snow even now."
        - id: ch03-b91
          speaker: malemute_kid
          text: "And what will you do?"
        - id: ch03-b92
          speaker: naass
          text: "I do not know. Akatan is small, and I no longer wish to live at the edge of the world. There is little use left in life. I could go to Constantine. He would put me in irons, and one day they would tie a rope around me. Then I would sleep well. But no. I do not know."
        - id: ch03-b93
          speaker: stanley_prince
          text: "But Kid, he murdered Axel!"
          emotion: angry
        - id: ch03-b94
          speaker: malemute_kid
          text: "Hush. Some things are larger than our wisdom and beyond our justice. We cannot say what was right or wrong here. It is not ours to judge."
          emotion: calm
        - id: ch03-b95
          speaker: narrator
          text: Naass moved still closer to the fire. A great silence filled the cabin. In each man's eyes, many pictures came and went.
