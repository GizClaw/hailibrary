audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静克制，带着北国故事的冷峻与悲悯
        timbre: 温厚清晰，略带风霜感
        pace: 舒缓而有张力
        pitch: 中低
    scruff_mackenzie:
      display_name: “乱发”麦肯齐
      tts:
        delivery: 粗犷镇定，话语直接，威胁中带冷幽默
        timbre: 结实低沉，饱经风霜
        pace: 稳健利落
        pitch: 中低
    zarinska:
      display_name: 扎林斯卡
      tts:
        delivery: 羞怯而警醒，危急时果断响亮
        timbre: 清亮柔韧
        pace: 轻缓，紧张时急促
        pitch: 中高
    thling_tinneh:
      display_name: 特林廷内
      tts:
        delivery: 庄重迟缓，带着酋长的威严与审慎
        timbre: 苍老浑厚
        pace: 从容
        pitch: 低
    shaman:
      display_name: 萨满
      tts:
        delivery: 煽动而狂热，带仪式般的起伏
        timbre: 沙哑尖厉
        pace: 由缓到急
        pitch: 中高
    fox:
      display_name: 狐狸
      tts:
        delivery: 善辩张扬，受挫后畏缩顺从
        timbre: 尖细灵活
        pace: 偏快
        pitch: 中高
    bear:
      display_name: 熊
      tts:
        delivery: 笨拙寡言，却骄傲勇猛
        timbre: 低沉如轰鸣
        pace: 缓慢有力
        pitch: 低
    tribesman_1:
      display_name: 斯蒂克人甲
      tts:
        delivery: 粗野激动
        timbre: 粗厚
        pace: 明快
        pitch: 中低
    tribesman_2:
      display_name: 斯蒂克人乙
      tts:
        delivery: 粗野激动
        timbre: 清硬
        pace: 明快
        pitch: 中
    tribesman_3:
      display_name: 斯蒂克人丙
      tts:
        delivery: 粗野激动
        timbre: 沙哑
        pace: 明快
        pitch: 中低
  chapters:
    - id: ch01
      title: 空帐篷里的饥渴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 男人往往要等身边的女人不在了，才知道她们有多可贵。平日里，他泡在那股说不清的温柔气息中，根本觉不出它来。气息一消失，生命里便露出一块越来越大的空洞。他隐隐觉得饿，却说不出自己缺什么。伙伴若也没有经验，只会摇摇头，给他灌几剂猛药。可那种饿一天比一天厉害。他对日常生活失去兴致，心思也病了。直到空虚再也忍不下去，他才忽然明白。
        - id: ch01-b02
          speaker: narrator
          text: 在育空，男人一旦明白，若是夏天，就给撑篙船装足口粮。若是冬天，就套上狗队，朝南方走。几个月以后，只要他仍相信北国，他便会带回一个妻子，让她分享这份信念，也顺便分享他的苦难。这足以说明男人天生自私。也正因为这样，旧日才有了“乱发”麦肯齐的麻烦。那时契查夸新手还没像潮水般涌来插桩圈地，克朗代克出名的只有鲑鱼。
        - id: ch01-b03
          speaker: narrator
          text: 麦肯齐在边疆出生，也在边疆长大。二十五年里，他不断同荒野最凶暴的大自然搏斗，那些年月全刻在脸上。最后两年最苦，他一直在北极圈的阴影下摸索黄金。渴望女人的病袭来时，他并不吃惊。他讲实际，也见过别的男人这样发病。他知道自己得了什么病，却半点不露出来，反而把那份难受全用在力气上，干得比从前更狠。
        - id: ch01-b04
          speaker: narrator
          text: 整个夏天，他同蚊虫厮杀，在斯图尔特河那些准有收获的沙洲一遍遍淘洗，终于挣出双份本钱。随后，他把盖屋的原木扎成木筏，顺育空河漂到四十英里，再亲手搭起一间营地里数得着的舒适木屋。屋子还没住人，已经显得温暖可爱，不少男人都想同他搭伙，搬进去过日子。他只用几句又粗又短的话，便打碎了他们的念头，随后到贸易站买下双份口粮。
        - id: ch01-b05
          speaker: narrator
          text: 麦肯齐想要什么，通常总能弄到，而且从不多走冤枉路。若为找妻子，先在冰上走六百英里，再坐船越过两千英里海路，最后还要走上一千英里回到旧日落脚处，他可不愿意。人生太短了。于是他召齐狗群，把一批稀奇货物捆上雪橇，越过分水岭，朝塔纳纳河上游走去。
        - id: ch01-b06
          speaker: narrator
          text: 他身强力壮，手下的狼狗比育空任何狗队都更能干，吃得少，却走得远。三个星期后，他大步走进塔纳纳河上游斯蒂克人的猎营。那些人都惊讶于他的胆量。他们名声很坏，据说为一把锋利的斧头，甚至一支坏步枪，也会杀死白人。
        - id: ch01-b07
          speaker: narrator
          text: 麦肯齐却独自走进人群。他既谦恭又亲昵，既镇定又傲慢，几种相反的态度叫他拿捏得恰到好处。要做到这一点，手腕得高，还得摸透蛮荒之人的心。他早已深得其中门道，知道什么时候安抚，什么时候像朱庇特一样发怒。
        - id: ch01-b08
          speaker: narrator
          text: 他先拜见特林廷内酋长，恭恭敬敬地献上两磅红茶和烟草，立刻换来酋长热诚的好感。接着，他同营地里的男人和姑娘混在一起，当晚办起一场波特拉奇。积雪被踩成一块长方形，足有一百英尺长，二十五英尺宽。中央烧着一条长长的火，两边像铺地毯一样铺满云杉枝。帐篷全空了，全族约一百个人聚在火边，放开嗓子唱起自己的民歌，向这位客人致意。
        - id: ch01-b09
          speaker: narrator
          text: 两年的北国生活，让麦肯齐学会了他们语言中不过几百个的词，也学会了深沉的喉音、近似日语的习语和句式，还有敬语与黏着词尾。他照他们的方式演说，让话语时而飞扬，时而拐进曲折的比喻，用这种粗犷的雄辩喂饱了他们对诗意的喜爱。酋长和萨满也用同样的方式答话。之后，他给男人们分发不值钱却讨喜的小礼物，跟着众人一同唱歌，还在那种用五十二根小棍玩的赌戏中露了一手，显出老练的本事。
        - id: ch01-b10
          speaker: narrator
          text: 族人抽着他的烟，很满意。年轻男人却带着挑衅的气焰，个个争强好胜。掉光牙的老妇说着粗鄙的暗示，姑娘们在旁边窃笑，缘由很容易明白。他们见过的白人很少，也就是所谓狼的儿子，可那几个人已经教给他们一些古怪的事。
        - id: ch01-b11
          speaker: narrator
          text: 麦肯齐看似不在意，其实什么都没漏掉。夜里，他裹着睡觉的毛皮，把白天所见认真想了一遍又一遍。他抽空一斗又一斗烟，终于拟好进攻的办法。只有一个姑娘入了他的眼。她叫扎林斯卡，是酋长的女儿。无论面貌、身段还是站立行走的姿态，她都比族中姐妹更接近白人心里的美人模样，几乎算个异数。麦肯齐决定得到她，娶她为妻，还要给她改个白人名字，叫格特鲁德。主意拿定，他翻身就睡，真像那个无往不胜种族的儿子，像非利士人中的参孙。
    - id: ch02
      title: 扎林斯卡的刀鞘
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 求婚这盘棋很难下，进展也慢。麦肯齐却手腕高明，表面若无其事，叫斯蒂克人猜不透。他先让男人们明白，自己枪法奇准，又是个大猎手。等他从六百码外射倒一头驼鹿，整个营地都响起赞颂。每到夜里，他去酋长那顶驼鹿皮和北美驯鹿皮缝成的帐篷做客，大谈自己的本领，也大把散烟。他同样敬奉萨满，因为巫医在族中势力很大。可萨满傲慢得很，不肯受笼络，麦肯齐便把他记作未来的敌人。
        - id: ch02-b02
          speaker: narrator
          text: 麦肯齐找不到和扎林斯卡独处的机会，只能一次次偷眼看她，把意思透露得清清楚楚。她早已明白，却偏偏卖弄娇态。只要男人不在，麦肯齐有机会接近，她就让一圈女人围住自己。麦肯齐并不着急。他知道她一定会想起他，让她多想几天，只会对自己有利。
        - id: ch02-b03
          speaker: narrator
          text: 终于有一夜，他觉得时机到了，猛然离开酋长烟雾弥漫的住处，赶往邻近的帐篷。扎林斯卡照例同妇女和姑娘们坐在一起，缝鹿皮鞋，做珠绣。大家见他进来，笑成一团，拿他和扎林斯卡大肆打趣。麦肯齐毫不客气，把她们一个个赶到雪地里。她们便跑遍营地，把消息传给所有人。
        - id: ch02-b04
          speaker: narrator
          text: 扎林斯卡不懂麦肯齐的语言，他便用她的话，把自己的心意说得十分动听。两个钟头后，他站起身要走。
        - id: ch02-b05
          speaker: scruff_mackenzie
          text: “这么说，你愿意到白人的帐篷来。很好！我现在去和你父亲谈。他也许不愿意。我会给他许多礼物，可他不能要得太多。就算他说不，也没关系。你还是会到白人的帐篷来。”
        - id: ch02-b06
          speaker: narrator
          text: 他已经掀起皮帘，姑娘一声低呼，又把他叫了回来。她在熊皮垫上跪直，脸上亮着夏娃真正觉醒时的光，羞怯地解开他沉重的腰带。麦肯齐困惑又警惕地望着她，还竖起耳朵，留心帐外的声音。
        - id: ch02-b07
          speaker: narrator
          text: 接着，她从针线袋取出一个驼鹿皮刀鞘。鲜亮的珠绣布满鞘面，花样奇异又漂亮。她拔出那把巨大的猎刀，敬畏地望着锋口，几乎想用拇指试一试，然后把刀插进新鞘，再沿腰带推到胯骨上方惯常的位置。麦肯齐这才放下疑心，高兴地笑了。眼前就像古时候的贵妇，正为她的骑士佩剑。
        - id: ch02-b08
          speaker: narrator
          text: 麦肯齐扶着她站直，用胡髭轻轻拂过她鲜红的嘴唇。对扎林斯卡来说，这是狼族陌生的爱抚。一个来自钢铁时代，一个仍活在石器时代，两个人就在这一刻相遇。可无论隔着怎样的时代，她终究是个女人。脸颊一下变得绯红，眼睛也泛起明亮柔和的光，把没说出口的一切都说了出来。
        - id: ch02-b09
          speaker: narrator
          text: 不久，麦肯齐夹着一个鼓鼓的大包，掀开酋长帐篷的皮帘。营地里处处跳动着兴奋。孩子跑着把干柴拖往宴会场，女人的话声越来越响，年轻男人阴沉着脸聚在一起商议，萨满的帐篷里还传来诡异的念咒声。
        - id: ch02-b10
          speaker: narrator
          text: 酋长只和眼睛昏花的妻子待在里面。麦肯齐一眼便看出，消息已经到了。他立刻谈起正事，还把那只珠绣刀鞘挪到最显眼的地方，明明白白宣告订婚。
        - id: ch02-b11
          speaker: scruff_mackenzie
          text: “特林廷内，斯蒂克人和塔纳纳大地的伟大酋长，鲑鱼、熊、驼鹿和北美驯鹿的统治者！白人带着大事来到你面前。他的帐篷空了许多个圆月，他很孤独。他的心在寂静中啃噬自己，渴望有个女人坐在帐篷里，等他打猎回来，备好暖火和食物。他还听见婴儿鹿皮鞋的轻响，听见孩子说话。”
        - id: ch02-b12
          speaker: scruff_mackenzie
          text: “有一夜，我看见了异象。我见到你的父亲，伟大的乌鸦，所有斯蒂克人的父亲。他叫孤独的白人系好鹿皮鞋，绑上雪鞋，带足许多觉的食物，也带上给你的精美礼物。再朝仲春太阳落下的方向走，来到你的猎场。他说，你的帐篷里有个姑娘，他正是为白人才把生命吹进她的身体。白人要娶她为妻。酋长，乌鸦这样说了，所以我把礼物放在你脚下，也来带走你的女儿！”
        - id: ch02-b13
          speaker: narrator
          text: 老人拢紧毛皮，摆出粗朴的王者威仪，却没有立刻答话。一个少年钻进来，匆匆传话，要他去议事会，随后又跑了。
        - id: ch02-b14
          speaker: thling_tinneh
          text: “白人，我们叫你驼鹿杀手，也叫你狼，叫你狼之子。你来自强大的种族，我们也以你来参加波特拉奇为荣。可是帝王鲑不能同狗鲑交配，乌鸦也不能同狼交配。”
        - id: ch02-b15
          speaker: scruff_mackenzie
          text: “不是这样！我在狼族营地里见过乌鸦的女儿。莫蒂默的女人，特雷吉戈的女人，还有两个冰裂季前来到这里的巴纳比的女人。我还听说过别的，只是没亲眼见过。”
        - id: ch02-b16
          speaker: thling_tinneh
          text: “儿子，你说的是真话，可那样的结合很坏，就像水混进沙子，像雪花碰上太阳。你见过梅森和他的女人吗？没有？他十个冰裂季前来过，是所有狼族中第一个。和他同来的男人挺得像柳条，高大又强壮，像白脸灰熊，心却像盛夏的满月。他叫——”
        - id: ch02-b17
          speaker: scruff_mackenzie
          text: “你说的是马拉缪特小子！”
          emotion: surprised
        - id: ch02-b18
          speaker: thling_tinneh
          text: “正是他。可你见过梅森的女人吗？她是扎林斯卡的亲姐姐。”
        - id: ch02-b19
          speaker: scruff_mackenzie
          text: “没见过，不过我听说了。梅森在很远很远的北方，被一棵饱经岁月的云杉压死。可他的爱很深，黄金也很多。那女人带着黄金和儿子，朝冬日正午太阳的方向走了无数个觉，如今还住在那里。那里没有咬人的严霜，没有雪，也没有夏日午夜的太阳和冬日正午的黑夜。”
        - id: ch02-b20
          speaker: narrator
          text: 第二个传信人闯进来，议事会又用不容推拒的口气催酋长过去。麦肯齐一把把他扔进雪里。他瞥见议事火堆前摇摆的人影，也听见男人低沉而有节奏的合唱，知道萨满正在煽动族人的怒火。时间不多了。他转身逼视酋长。
        - id: ch02-b21
          speaker: scruff_mackenzie
          text: “我要你的女儿。你看，这里有烟草、茶、许多杯糖、温暖的毯子，还有又大又好的手帕。这里还有一支真正的步枪，许多子弹和火药。”
        - id: ch02-b22
          speaker: thling_tinneh
          text: “不行。我的族人已经聚起来，他们不会答应这桩婚事。”
        - id: ch02-b23
          speaker: scruff_mackenzie
          text: “可你是酋长。”
        - id: ch02-b24
          speaker: thling_tinneh
          text: “年轻人正在发怒。狼族带走了姑娘，害他们没有妻子。”
        - id: ch02-b25
          speaker: scruff_mackenzie
          text: “听着！今夜变成白昼以前，狼就要让狗头朝东方群山，返回育空。扎林斯卡会在狗队前面开路。”
        - id: ch02-b26
          speaker: thling_tinneh
          text: “今夜走到一半以前，我的年轻人也许已经把狼的肉扔给狗吃。你的骨头会散在雪里，等春天把它们露出来。”
        - id: ch02-b27
          speaker: narrator
          text: 威胁碰上了反威胁。麦肯齐古铜色的脸涨得发暗，嗓音也提高了。一直面无表情坐着的老妇想从他身边爬往门口。男人的歌声忽然中断，许多嗓音一起喧嚷。麦肯齐粗暴地把老妇拧回皮褥上。
        - id: ch02-b28
          speaker: scruff_mackenzie
          text: “再听我说一遍。狼就是死，也会把牙咬紧，你最强壮的十个人会陪他一起长眠。打猎还没开始，捕鱼也要等许多个圆月，你正需要这些人。我死了，对你又有什么好处？照你们的规矩，我的财富落到你手里的少得可怜。把女儿给我，这些东西全归你。”
        - id: ch02-b29
          speaker: scruff_mackenzie
          text: “我的兄弟还会来。他们人数多，肚子永远填不满。乌鸦的女儿终究会在狼族帐篷里生孩子。我的族人比你的强大。这是命运。答应吧，财富就全是你的。”
        - id: ch02-b30
          speaker: narrator
          text: 帐外的鹿皮鞋把雪踩得咯吱作响。麦肯齐把步枪扳到待击，也松开两只柯尔特手枪的枪套。
        - id: ch02-b31
          speaker: scruff_mackenzie
          text: “答应吧，酋长！”
        - id: ch02-b32
          speaker: thling_tinneh
          text: “我的族人还是会说不。”
        - id: ch02-b33
          speaker: scruff_mackenzie
          text: “你答应，财富便归你。之后我自己去对付他们。”
        - id: ch02-b34
          speaker: thling_tinneh
          text: “狼一定要这样，那就这样吧。我收下礼物，不过我得警告你。”
        - id: ch02-b35
          speaker: narrator
          text: 麦肯齐交出货物，却暗中卡住步枪的退壳器，最后又加上一条色彩斑斓的丝巾，为买卖封口。萨满和六个年轻勇士进了帐篷，他大胆地用肩撞开他们，直接走出去。
    - id: ch03
      title: 火堆旁的预言
      blocks:
        - id: ch03-b01
          speaker: scruff_mackenzie
          text: “收拾东西！”
        - id: ch03-b02
          speaker: narrator
          text: 麦肯齐经过扎林斯卡的帐篷，只丢下这句话，便去套狗。几分钟后，他领着狗队冲进议事场，扎林斯卡就在身边。他站到场地上首的酋长旁边，又让她守在自己左后方一步。那里是她该站的位置，惹事的时候也已经到了，他需要有人护住背后。
        - id: ch03-b03
          speaker: narrator
          text: 男人们沿火堆两边蹲着，唱起来自被遗忘往昔的民歌。曲调古怪，时断时续，又一遍遍萦回。它并不美，说是可怕也还不够。场地末端，十来个女人在萨满眼下跳舞。谁没有彻底陷进仪式的狂喜，就遭到斥责。浓密的黑发散乱垂到腰间，遮住她们一半身体。她们缓缓摇摆，身子随着不断变化的节拍起伏。
        - id: ch03-b04
          speaker: narrator
          text: 这景象诡异极了，像一件落错时代的遗物。遥远的南方，十九世纪最后十年的寥寥岁月正飞快过去。可在这里，原始人仍旧活得旺盛。他们只比史前的穴居人向前走了一小步，是远古世界被遗忘的一块碎片。黄褐色狼狗挤在裹兽皮的主人中间，有的安静坐着，有的为了一个位置互相撕咬。火光从它们通红的眼睛和滴着涎水的獠牙上反射回来。四周的森林披着幽灵般的白衣，沉沉睡着，对火边的一切毫不理会。
        - id: ch03-b05
          speaker: narrator
          text: 白色寂静暂时被火光赶到森林边缘，却仍像一堵无形的墙，不断从四面向内挤压。大寒时节，星星照例在高空大幅跃动，北极精灵也拖着辉煌的长袍横过整个天空。麦肯齐的目光沿两排裹着毛皮的人影慢慢扫去，寻找那些没有出现的面孔，也隐约感觉到眼前这片蛮荒景象的壮美。
        - id: ch03-b06
          speaker: narrator
          text: 他的目光在一个新生婴儿身上停了一刻。孩子正伏在母亲裸露的乳房前吃奶。气温是零下四十华氏度，也就是冰点以下七十多度。他想起自己族中那些娇弱的女人，冷冷一笑。可他自己正是那样一个娇弱女人所生，血里继承着王者的遗产。正是这份遗产，让他的族人统治陆地与海洋，统治野兽，也统治每片气候带上的人。如今，他独自面对一百个人，困在北极冬天，远离自己的同类。血脉催逼着他，让他想要占有，让他爱上这狂野的危险，也让他感到战斗的震颤，渴望征服，或是死去。
        - id: ch03-b07
          speaker: narrator
          text: 歌舞忽然停了，火堆旁只剩萨满粗野而激昂的声音。他在部落庞大神话的曲折小径里穿行，狡猾地拨弄族人的迷信。他把造物的两种力量说成寒鸦和乌鸦，又说狼代表争斗与毁灭。两股力量不只在灵界交战，人也要为各自图腾而战。斯蒂克人是耶尔奇斯的孩子。耶尔奇斯就是乌鸦，是带来火种的神。麦肯齐却是狼的孩子，也就是魔鬼的孩子。
        - id: ch03-b08
          speaker: narrator
          text: 萨满说，若同这场永恒的战争休战，再把自己的女儿嫁给最大的仇敌，就是最严重的叛逆和亵渎。为了把麦肯齐说成偷偷混入部落的恶徒、撒旦派来的使者，再恶毒的话、再污秽的比喻，他也肯说。演说渐渐逼近高潮，听众宽阔的胸腔里滚出压低的野蛮咆哮。
        - id: ch03-b09
          speaker: shaman
          text: “兄弟们，耶尔奇斯无所不能！他从天上带来火，让我们温暖。他把太阳、月亮和星星从洞中拖出来，让我们看得见。他教我们同饥荒与严寒的精灵战斗。可如今，耶尔奇斯对自己的孩子发怒了。他们只剩寥寥一把人，他不肯再帮忙。”
        - id: ch03-b10
          speaker: shaman
          text: “他们忘记了他，做了恶事，走了坏路，还把他的敌人领进帐篷，坐在自家火边。乌鸦为孩子的邪恶悲伤。只要他们站起来，证明自己已经回头，他便会走出黑暗相助。兄弟们，带火者已经把口信告诉萨满，现在你们也要听。”
        - id: ch03-b11
          speaker: shaman
          text: “让年轻男人把年轻女人带进帐篷！让他们扑向狼的喉咙！让仇恨永不止息！这样，女人便会多多生育，族人会繁衍成强大的民族。乌鸦会从北方带来他们父辈和祖辈的庞大部族。他们要把狼族赶退，让狼族像去年的营火一样只剩冷灰。他们会重新统治大地。这就是乌鸦耶尔奇斯的口信！”
        - id: ch03-b12
          speaker: narrator
          text: 这幅弥赛亚降临的预言，让斯蒂克人发出嘶哑狂吼，纷纷跳起。麦肯齐把拇指从连指手套里抽出来，静静等着。人群不停叫嚷，要狐狸说话，直到一个年轻人走上前。
        - id: ch03-b13
          speaker: fox
          text: “兄弟们，萨满说得很对。狼族带走我们的女人，我们的男人没有孩子，族人只剩寥寥一把。狼族拿走温暖的毛皮，给我们的却是住在瓶子里的恶灵，还有草做的衣服。那衣服既不是海狸皮，也不是猞猁皮，一点都不暖。我们的男人还会染怪病死去。”
        - id: ch03-b14
          speaker: fox
          text: “我叫狐狸，从没娶过妻子。为什么？我看中的姑娘，已经有两个去了狼族营地。现在，我还存着海狸、驼鹿和北美驯鹿的皮，想讨特林廷内欢心，娶他的女儿扎林斯卡。可她已经绑好雪鞋，准备走在狼族狗队前面开路。我不只是替自己说话。”
        - id: ch03-b15
          speaker: fox
          text: “熊也一样。他想做扎林斯卡孩子的父亲，为此鞣了许多皮。我替所有没有妻子的年轻人说话。狼族永远饥饿，总从猎物上割走最好的肉，只把残余留给乌鸦。”
        - id: ch03-b16
          speaker: fox
          text: “你们看古格拉！她的腿弯得像白桦皮独木舟的肋骨。她不能捡柴，也背不动猎人的肉。狼族挑中她了吗？”
        - id: ch03-b17
          speakers: [tribesman_1, tribesman_2, tribesman_3]
          ensemble: chorus
          text: “没有！没有！”
        - id: ch03-b18
          speaker: fox
          text: “再看莫伊里。恶灵扭歪了她的眼睛，连婴儿见到她都害怕，白脸灰熊也会让路。她被挑中过吗？”
        - id: ch03-b19
          speaker: narrator
          text: 人群再次发出残酷的喝彩。
        - id: ch03-b20
          speaker: fox
          text: “还有皮谢特。她听不见我的话，从没听过山雀鸣叫、丈夫的嗓音，也没听过孩子咿呀学语。她活在白色寂静里。狼族可曾在意她？没有！好肉都由他们挑，残余才归我们。”
        - id: ch03-b21
          speaker: fox
          text: “兄弟们，不能再这样！狼族休想再混进我们的营火。时候到了！”
        - id: ch03-b22
          speaker: narrator
          text: 一道巨大的北极光横过天顶，从这边地平线架到那边。紫色、绿色和黄色的烈焰奔涌而过。狐狸仰起头，张开双臂，摇摆着把演说推到顶点。
        - id: ch03-b23
          speaker: fox
          text: “看哪！祖先的精灵已经站起，今夜一定有大事发生！”
        - id: ch03-b24
          speaker: narrator
          text: 狐狸退下。另一个年轻人在伙伴推搡下走到前面，显得有些迟疑。他比众人高出一个头，宽阔的胸膛袒露在严霜中。他不自在地来回换脚，话堵在舌头上。那张脸十分可怕，像曾被一次重击撕掉一半。最后，他握拳擂在胸口，敲出鼓一样的响声。嗓音也随即轰鸣起来，像海浪冲出洞穴。
        - id: ch03-b25
          speaker: bear
          text: “我是熊，是银尖灰熊，也是银尖灰熊的儿子！我的声音还像姑娘时，我就杀过猞猁、驼鹿和北美驯鹿。声音还像狼獾在高架储藏台下尖叫时，我已经越过南方群山，杀死三个白河人。等声音变成奇努克风的咆哮，我遇上白脸灰熊，也没有给它让路。”
        - id: ch03-b26
          speaker: narrator
          text: 熊说到这里停下，用手从脸上可怖的伤疤前扫过。
        - id: ch03-b27
          speaker: bear
          text: “我不像狐狸。我的舌头冻得像河水，说不出漂亮的大话。我的话很少。狐狸说今夜有大事。很好！话从他舌头上流出来，像春天的洪水，可轮到动手，他却舍不得了。”
        - id: ch03-b28
          speaker: bear
          text: “今夜我要同狼决斗。我要杀死他，让扎林斯卡坐在我的火边。熊说完了。”
        - id: ch03-b29
          speaker: narrator
          text: 四周顿时乱成一片，麦肯齐却站着不动。他知道近身混战时步枪没有用，便把两只手枪套挪到身前，又把手套往下褪，让双手只剩长腕套遮着。他明白，一百人若一齐扑来，自己绝无生路。可正如先前说的，他已经准备咬紧牙死去。熊却挡住族人，用可怕的拳头把性急的人打退。
        - id: ch03-b30
          speaker: narrator
          text: 喧嚷渐渐平息。麦肯齐朝扎林斯卡瞥去。她踏着雪鞋向前倾，嘴唇微张，鼻翼颤动，像一头要跃起的母虎。乌黑的大眼睛盯着族人，既害怕又反抗。她绷得忘了呼吸，一只手痉挛般按住胸口，另一只紧攥狗鞭，整个人像化成了石头。就在麦肯齐望着她时，她松了口气。肌肉软下来，她沉沉一叹，向后靠去。那目光里已经不只是爱，而是崇拜。
    - id: ch04
      title: 狼族的法律
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 特林廷内想说话，族人却淹没了他的声音。麦肯齐走上前。狐狸张嘴要尖叫，他却凶狠地猛然转身，吓得狐狸缩了回去，声音只在喉咙里咕噜。这副狼狈样引来大笑，也让伙伴们消了些火气，肯安静听话。
        - id: ch04-b02
          speaker: scruff_mackenzie
          text: “兄弟们，你们称作狼的白人，带着好话来到这里。他不像因纽特人，不说谎。他以朋友的身份而来，想做你们的兄弟。可你们的人已经说完，讲软话的时候也过去了。”
        - id: ch04-b03
          speaker: scruff_mackenzie
          text: “先听我告诉你们，萨满的舌头邪恶，他是假先知。他说的口信并非来自带火者。他的耳朵听不见乌鸦，只从自己脑袋里编出花样，把你们变成傻瓜。他没有力量。”
        - id: ch04-b04
          speaker: scruff_mackenzie
          text: “饥荒来时，狗被杀来吃了，你们肚里塞着没鞣过的皮和鹿皮鞋条。老人死了，老妇死了，婴儿伏在母亲干瘪的乳房前死了。大地一片黑，你们像秋天的鲑鱼一样死去。萨满让猎人得到过什么吗？他给你们肚里放过肉吗？没有。他没有力量。所以，我当面唾弃他！”
        - id: ch04-b05
          speaker: narrator
          text: 这番亵渎让众人吃惊，却没有引起骚乱。有些女人害怕起来，男人们却精神一振，像是在等一场神迹。所有眼睛都看着场中的两个人。萨满知道关键时刻到了，也感到权势正在摇晃。他张嘴要咒骂，可麦肯齐举起拳头，眼中闪着光，凶猛逼近。萨满只得往后逃。麦肯齐冷笑着继续说。
        - id: ch04-b06
          speaker: scruff_mackenzie
          text: “我死了吗？闪电烧我了吗？星星从天上掉下来压碎我了吗？呸！这条狗不值得再理。现在听我说自己的族人。他们是最强大的民族，统治每一片土地。起初，我们像我一样独自打猎。后来，我们成群去猎。最后，我们会像迁徙的北美驯鹿大群，扫过整片土地。”
        - id: ch04-b07
          speaker: scruff_mackenzie
          text: “被我们带进帐篷的人会活，不肯来的人就会死。扎林斯卡美丽、丰满又强壮，正适合做狼族的母亲。即使我死了，她还是会做狼族的母亲。我的兄弟很多，他们会循着狗队的气味找来。”
        - id: ch04-b08
          speaker: scruff_mackenzie
          text: “听清狼族的法律。谁取走一头狼的性命，他的族人就要拿十条命来偿。许多地方已经付过代价，往后还有许多地方会付。”
        - id: ch04-b09
          speaker: scruff_mackenzie
          text: “现在轮到狐狸和熊。看来他们也盯上了姑娘。可我已经买下她。特林廷内扶着那支步枪，买她的货物就在火边。不过，我愿意公平待年轻人。狐狸说了许多话，舌头已经干了，我送他五条长烟砖，好润湿他的嘴，让他在议事会上多发响声。”
        - id: ch04-b10
          speaker: scruff_mackenzie
          text: “熊却叫我敬重。我送他两条毯子、二十杯面粉，再给他狐狸双倍的烟。若他跟我越过东方群山，我还送他一支和酋长那支一样的步枪。若他不肯，也好。狼已经厌倦说话。可最后还要再说一次，谁取走一头狼的性命，他的族人就要拿十条命来偿。”
        - id: ch04-b11
          speaker: narrator
          text: 麦肯齐微笑着退回原处，心里却满是忧虑。黑夜还没过去。扎林斯卡走到他身边，低声讲出熊用刀决斗的招数，他仔细听着。
        - id: ch04-b12
          speaker: narrator
          text: 众人决定一战。转眼间，几十双鹿皮鞋在火旁拓宽了踩实的雪地。大家七嘴八舌，议论萨满似乎败了。有人说他只是没有施展力量，也有人细数往事，觉得狼说得对。熊走到决斗场中央，手里握着俄国造的长猎刀。狐狸提醒大家，麦肯齐还有左轮手枪。于是麦肯齐解下腰带，扣在扎林斯卡身上，又把步枪交给她。她摇头说不会开枪。女人很少有机会碰这种珍贵东西。
        - id: ch04-b13
          speaker: scruff_mackenzie
          text: “要是危险从我背后来，你就喊‘我的丈夫’。不，不是那样。要这样喊，‘我的丈夫！’”
        - id: ch04-b14
          speaker: narrator
          text: 扎林斯卡照着说了一遍。他笑着捏捏她的脸，又走进圈子。熊无论臂展还是身高都占优势，猎刀也长出足足两英寸。麦肯齐见过男人眼中的神色，知道面前确实是条汉子。可钢刃寒光一闪，他体内那个统治种族的脉搏也跳得更快。
        - id: ch04-b15
          speaker: narrator
          text: 他一次次被逼到火堆边和深雪前，又一次次用拳击手的步法绕回中央。没有一个声音替他助威，熊身后却不断传来喝彩、指点和警告。两把猎刀一回回撞在一起。麦肯齐只把牙咬得更紧。他很清楚自己的力气，所以每次进刺和躲闪仍旧冷静。起初，他还怜悯眼前的对手。随后，怜悯被求生的原始本能赶走，求生的本能又让位给杀戮的狂热。一万年的文明一层层从他身上剥落，他重新变成穴居人，为自己的女人战斗。
        - id: ch04-b16
          speaker: narrator
          text: 他先后两次刺中熊，每一次都毫发无伤地退开。第三次却被熊死死缠住。为了保命，两人空着的手同时扣住对方持刀的手，身体也重重撞到一起。直到这时，麦肯齐才知道熊的力气究竟有多大。他的肌肉绷成一团团疼痛的硬结，筋腱也像随时会断，那把俄国钢刀却仍然一寸寸逼近。他试着挣开，只让自己更加虚弱。裹毛皮的人圈越收越紧，人人都认定最后一刀就要落下，也急着亲眼看见。
        - id: ch04-b17
          speaker: narrator
          text: 麦肯齐忽然使出摔跤的招数，身子侧转，用头猛撞。熊本能地后仰，重心立刻不稳。麦肯齐同时绊住他，把全身重量向前压去，将他掷过人圈，摔进深雪。熊挣扎出来，又全速冲回。
        - id: ch04-b18
          speaker: zarinska
          text: “我的丈夫！”
          emotion: fearful
        - id: ch04-b19
          speaker: narrator
          text: 扎林斯卡的声音带着危险的震颤。弓弦同时一响，麦肯齐猛地伏低。一支骨镞箭掠过头顶，扎进熊的胸膛。熊冲势未歇，翻过蹲着的对手。下一瞬，麦肯齐已经跃起。熊躺着不动，火堆对面的萨满却在拉第二支箭。
        - id: ch04-b20
          speaker: narrator
          text: 麦肯齐把猎刀抛上短短一截，抓住沉重刀刃的尖端，再猛地掷出。寒光飞过火堆。萨满摇晃着向前栽进通红的余烬，喉咙外只露着刀柄。
        - id: ch04-b21
          speaker: narrator
          text: 咔嗒，咔嗒。狐狸抢到特林廷内的步枪，徒劳地想推一发子弹上膛。麦肯齐一笑，他便扔下了枪。
        - id: ch04-b22
          speaker: scruff_mackenzie
          text: “狐狸还没学会怎么玩这件小东西？看来他还是个女人。来，把枪拿来，我教你。”
        - id: ch04-b23
          speaker: narrator
          text: 狐狸迟疑着不动。
        - id: ch04-b24
          speaker: scruff_mackenzie
          text: “我叫你过来！”
          emotion: angry
        - id: ch04-b25
          speaker: narrator
          text: 狐狸像挨败的狗，垂着头走上前。
        - id: ch04-b26
          speaker: scruff_mackenzie
          text: “这样，再这样。事情就成了。”
        - id: ch04-b27
          speaker: narrator
          text: 一发子弹滑进枪膛。麦肯齐把枪举上肩头，击锤已经扳起。
        - id: ch04-b28
          speaker: scruff_mackenzie
          text: “狐狸说今夜有大事，他说得对。大事确实发生了，可就连其中最小的，也不是狐狸做的。他还想把扎林斯卡带进自己的帐篷吗？还想踏上萨满和熊已经踩出的路吗？不想？很好！”
        - id: ch04-b29
          speaker: narrator
          text: 麦肯齐轻蔑地转身，从萨满喉咙里拔出猎刀。
        - id: ch04-b30
          speaker: scruff_mackenzie
          text: “还有年轻人这样想吗？若有，狼就一次接下两三个，直到一个也不剩。没有？很好！特林廷内，我现在第二次把步枪送给你。以后你若到育空来，狼的火边永远有你的位置，也总有足够的食物。”
        - id: ch04-b31
          speaker: scruff_mackenzie
          text: “黑夜正变成白昼。我要走了，不过也许会回来。最后一次，记住狼族的法律！”
    - id: ch05
      title: 一条短烟砖
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 在斯蒂克人眼里，麦肯齐已经成了超自然的存在。他回到扎林斯卡身边。她走到狗队前头，群狗随即起步。片刻以后，他们便被幽灵般的森林吞没。麦肯齐一直等到这时，才把脚套进雪鞋，准备追上去。
        - id: ch05-b02
          speaker: fox
          text: “狼忘了那五条长烟砖吗？”
        - id: ch05-b03
          speaker: narrator
          text: 麦肯齐愤怒地转向狐狸，随即又觉得这件事实在滑稽。
        - id: ch05-b04
          speaker: scruff_mackenzie
          text: “我给你一条短的。”
        - id: ch05-b05
          speaker: fox
          text: “全凭狼的意思。”
        - id: ch05-b06
          speaker: narrator
          text: 狐狸温顺地伸出了手。
