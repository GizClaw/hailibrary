  chapters:
    - id: ch01
      title: The Son of the Wolf
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A man seldom understands what a woman brings into his life until she is gone. While she is near, he barely notices. Take her away, and an emptiness grows inside him. His friends may give him medicine, but the hunger remains. He loses interest in ordinary things until, one day, he finally understands what he wants.
        - id: ch01-b02
          speaker: narrator
          text: In the Yukon, such a man usually loads a boat in summer or harnesses his dogs in winter and heads south. Months later, if he still believes in the North, he returns with a wife to share that belief and all its hardships. That was the beginning of Scruff Mackenzie's trouble, back before newcomers flooded the Klondike and claimed the land, when the place was known only for salmon.
        - id: ch01-b03
          speaker: narrator
          text: Mackenzie looked like a man born and hardened on the frontier. For twenty-five years he had fought nature at its wildest. The last two had been the hardest, spent searching for gold beneath the Arctic Circle. When the lonely hunger came, he knew what it was. He simply worked harder. All summer he fought mosquitoes and washed the Stuart River bars until he had supplies for two. Then he floated cabin logs down to Forty Mile and built one of the coziest homes in camp. Several men offered to move in. He drove them off with a few rough words and bought food for two instead.
        - id: ch01-b04
          speaker: narrator
          text: He was practical. He usually got what he wanted without traveling any farther than he must. A wife was not worth six hundred miles over ice, two thousand across the ocean, and another thousand back to the Yukon. Life was too short. So he gathered his dogs, tied an unusual load to the sled, and crossed the divide toward the upper Tanana.
        - id: ch01-b05
          speaker: narrator
          text: Mackenzie was a powerful traveler, and his wolf-dogs went farther on less food than any team in the Yukon. Three weeks later, he walked into a hunting camp of the Upper Tanana Sticks. They were astonished. Their people had a dangerous name and had killed white men over things as small as a sharp ax or a broken rifle.
        - id: ch01-b06
          speaker: narrator
          text: Yet Mackenzie entered alone. He mixed respect, easy familiarity, cool nerve, and just enough insult. He knew exactly when to soothe a man and when to threaten him. First he bowed to Chief Thling-Tinneh and gave him black tea and tobacco. Then he visited the men and women, and that night he held a potlach.
        - id: ch01-b07
          speaker: narrator
          text: They packed the snow into a long rectangle, built a fire down the middle, and spread spruce boughs on both sides. Nearly a hundred people left their lodges and sang old songs for their guest. During two years in the country, Mackenzie had learned their few hundred words and mastered the hard sounds and forms of their speech. He addressed them in their own manner, full of rough poetry and twisting images. After the chief and the Shaman answered him, he gave small gifts, sang with the people, and played their fifty-two-stick gambling game like an expert.
        - id: ch01-b08
          speaker: narrator
          text: They smoked his tobacco and were pleased. The young men, though, acted proud and defiant. Toothless old women teased them, and the maidens giggled. The people had met few white men, whom they called Sons of the Wolf, but those few had taught them troubling lessons.
        - id: ch01-b09
          speaker: narrator
          text: Mackenzie noticed. Wrapped in his sleeping furs that night, he smoked pipe after pipe and planned. Only one woman interested him. Zarinska, the chief's daughter, stood apart from the other young women in face, figure, and bearing. He decided she would be his wife, and that he would call her Gertrude. Then he rolled over and slept, certain that his race could conquer anything.
        - id: ch01-b10
          speaker: narrator
          text: His courtship moved slowly. He showed the men that he was a sure shot and a great hunter. When he killed a moose from six hundred yards, the whole camp praised him. At night he sat in Thling-Tinneh's lodge, boasting and handing out tobacco. He also honored the Shaman, whose influence he wanted on his side. But the medicine man stayed proud and distant, so Mackenzie marked him as an enemy.
        - id: ch01-b11
          speaker: narrator
          text: Zarinska never gave him a chance to speak with her alone. Whenever the men left, she kept a circle of women around her. Still, she saw his glances and understood them. Mackenzie could wait. A few days of thinking about him might help his cause.
        - id: ch01-b12
          speaker: narrator
          text: One night, when he judged the moment right, he left the chief's smoky lodge and hurried into the next one. Zarinska sat among women sewing moccasins and beadwork. They laughed when he entered and teased her about him. Mackenzie pushed them out into the snow one by one, and they ran through camp with the news. For two hours he argued his case in Zarinska's language. Then he stood to leave.
        - id: ch01-b13
          speaker: mackenzie
          text: "So you'll come to the White Man's lodge, Zarinska? Good. I'll speak with your father now. He may think differently. I'll give him many gifts, but he must not demand too much. And if he refuses? You'll still come to my lodge."
        - id: ch01-b14
          speaker: narrator
          text: He had lifted the skin flap when Zarinska gave a soft cry. She knelt on the bearskin mat, her face glowing, and shyly unbuckled his heavy belt. Mackenzie watched her with suspicion and listened for any sound outside.
        - id: ch01-b15
          speaker: narrator
          text: Then he understood and smiled. From her sewing bag she took a moosehide knife sheath covered in bright, intricate beadwork. She drew his great hunting knife, admired its keen edge, and slid it into its new home. She moved the sheath along his belt until it rested above his hip. It might have been an old tale of a lady and her knight.
        - id: ch01-b16
          speaker: narrator
          text: Mackenzie raised her to her feet and kissed her with his mustached lips, a strange caress from the Wolf. Stone age met steel. Her cheeks burned red, and her dark eyes softened with light.
        - id: ch01-b17
          speaker: narrator
          text: Excitement filled the camp when Mackenzie entered Thling-Tinneh's tent with a large bundle. Children hauled dry wood toward the potlach fire. Women's voices rose, young men gathered in grim groups, and an eerie chant came from the Shaman's lodge. The chief sat with his bleary-eyed wife. One glance told Mackenzie they already knew. He pushed the new sheath into view and began.
        - id: ch01-b18
          speaker: mackenzie
          text: "Thling-Tinneh, great chief of the Sticks and the Tanana, ruler of salmon, bear, moose, and caribou! The White Man comes with a great purpose. His lodge has stood empty for many moons. His heart is lonely and hungry for a woman who will sit beside his fire, welcome him from the hunt, and fill the lodge with children's voices. Then the Raven, your father and the father of all the Sticks, came in a vision. He told the lonely White Man to bind his moccasins, put on his snowshoes, load his sled with food and fine gifts, and travel toward the setting spring sun. The Raven said Thling-Tinneh would become his father, and that a maiden in the chief's lodge had received life for him. So I place these gifts at your feet. I have come for your daughter."
        - id: ch01-b19
          speaker: narrator
          text: The old chief wrapped his furs around himself with a king's dignity, but before he could answer, a boy slipped in. The council demanded his presence. The messenger vanished.
        - id: ch01-b20
          speaker: thling_tinneh
          text: "White Man, we call you Moose-Killer, the Wolf, and Son of the Wolf. Your race is mighty, and we are proud to receive you as our guest. But king salmon does not mate with dog salmon, and the Raven does not mate with the Wolf."
        - id: ch01-b21
          speaker: mackenzie
          text: "That isn't so. I have met daughters of the Raven in the camps of the Wolf. Mortimer, Tregidgo, and Barnaby all took wives from your people. I have heard of others too."
        - id: ch01-b22
          speaker: thling_tinneh
          text: "Your words are true, Son, but such a joining is wrong, like water with sand or a snowflake with the sun. Did you meet Mason and his wife? He came ten ice-runs ago, the first Wolf of all. With him traveled a tall, strong man, straight as a willow, fierce as a grizzly, with a heart like the full summer moon."
        - id: ch01-b23
          speaker: mackenzie
          text: "Malemute Kid!"
        - id: ch01-b24
          speaker: thling_tinneh
          text: "Yes, that mighty man. But did you see Mason's wife? She was Zarinska's own sister."
        - id: ch01-b25
          speaker: mackenzie
          text: "No, Chief, but I know her story. Far to the north, an ancient spruce crushed Mason to death. He loved her greatly and left much gold. She took that gold and her son toward the winter's midday sun. She lives there still, with no killing frost, no snow, no midnight sun in summer, and no midday darkness in winter."
        - id: ch01-b26
          speaker: narrator
          text: A second messenger brought another urgent summons from the council. Mackenzie threw him out into the snow. Beyond the tent he saw bodies swaying around the council fire and heard the men's deep chant. The Shaman was feeding their anger. Time was short.
        - id: ch01-b27
          speaker: mackenzie
          text: "Come, Chief. I want your daughter. Look here. Tobacco, tea, many cups of sugar, warm blankets, large handkerchiefs, and a true rifle with bullets and powder."
        - id: ch01-b28
          speaker: thling_tinneh
          text: "No. My people are gathering now. They will not accept this marriage."
        - id: ch01-b29
          speaker: mackenzie
          text: "But you are their chief."
        - id: ch01-b30
          speaker: thling_tinneh
          text: "My young men are furious. The Wolves take our maidens, and then our men have no wives."
        - id: ch01-b31
          speaker: mackenzie
          text: "Listen, Thling-Tinneh. Before night turns to day, the Wolf will point his dogs toward the eastern mountains and leave for the Yukon. Zarinska will break trail for his team."
        - id: ch01-b32
          speaker: thling_tinneh
          text: "Before midnight, my young men may feed the Wolf's flesh to their dogs. His bones may lie in the snow until spring uncovers them."
        - id: ch01-b33
          speaker: narrator
          text: Threat met threat. Mackenzie's weathered face darkened. The chief's wife tried to crawl past him, but outside the song broke into a roar of voices. Mackenzie swung the old woman roughly back onto the skins.
        - id: ch01-b34
          speaker: mackenzie
          text: "Hear me again, Thling-Tinneh! The Wolf dies with his teeth locked fast, and ten of your strongest men will die beside him. You need them. Hunting has not begun, and fishing is still moons away. What do you gain if I die? By your custom, little of my wealth becomes yours. Give me your daughter and all of it is yours. My brothers will come after me, and there are many. Your daughters will bear children in the lodges of the Wolf. My people are stronger. That is what will happen. Take the wealth and grant my request."
        - id: ch01-b35
          speaker: narrator
          text: Moccasins crunched just outside. Mackenzie cocked his rifle and loosened both revolvers at his belt.
        - id: ch01-b36
          speaker: mackenzie
          text: "Grant it, Chief."
        - id: ch01-b37
          speaker: thling_tinneh
          text: "My people will still refuse."
        - id: ch01-b38
          speaker: mackenzie
          text: "Grant it, and the wealth is yours. I will answer your people myself."
        - id: ch01-b39
          speaker: thling_tinneh
          text: "The Wolf will have his way. I accept his gifts, but I warn him."
        - id: ch01-b40
          speaker: narrator
          text: Mackenzie handed over the goods. He quietly jammed the rifle's ejector before adding a brilliant silk handkerchief. The Shaman entered with six young warriors. Mackenzie shouldered through them and went out.
        - id: ch01-b41
          speaker: mackenzie
          text: "Pack."
        - id: ch01-b42
          speaker: narrator
          text: He hurried on to harness the dogs. Minutes later, he drove the team into the council with Zarinska beside him. He stood at the upper end of the fire near the chief and placed Zarinska one step behind him on his left. Trouble was near, and he wanted his back guarded.
        - id: ch01-b43
          speaker: narrator
          text: Men crouched along both sides of the fire and sang a broken, haunting song from a forgotten age. Under the Shaman's eye, ten women danced at the lower end. He scolded any who held back. Their heavy black hair hung loose as they swayed through the changing rhythm.
        - id: ch01-b44
          speaker: narrator
          text: The scene belonged to another time. Far south, the nineteenth century neared its end, reeling through the last years of its final decade. Here, an ancient world remained, almost as it had been before history began. Wolf-dogs sat between masters dressed in skins, or fought one another for space. Fire shone back from their red eyes and dripping teeth. Around them, the forest slept without noticing, wrapped in a ghostly covering of snow. For a little while the voices had driven the White Silence to the edge of the trees, but it seemed to press inward all the same. The stars made great leaps in the bitter cold, and the Spirits of the Pole trailed glorious robes across the whole sky.
        - id: ch01-b45
          speaker: narrator
          text: Mackenzie felt the wild greatness of it as he searched the crowd for missing faces. He saw a newborn nursing at its mother's bare breast in weather forty degrees below zero. He thought of the sheltered women of his own race. Yet such a woman had borne him and given him the inheritance he felt now, the will to rule land, sea, animals, and people. Alone against a hundred, deep in the Arctic winter, he felt the urge to possess, the love of danger, the thrill of battle, and the power to conquer or die.
        - id: ch01-b46
          speaker: narrator
          text: The song and dance ended. The Shaman rose and drew upon the people's oldest beliefs. Raven and Crow were creators, he said, while the Wolf stood for battle and destruction. To marry their daughters to that enemy would betray everything sacred. He called Mackenzie a servant of evil, and a low growl rose from the listening men.
        - id: ch01-b47
          speaker: shaman
          text: "Brothers, Jelchs is all-powerful. He brought fire from heaven to warm us. He drew out the sun, moon, and stars so we could see. He taught us to fight famine and frost. But his children have done wrong and brought enemies to their fires, so the Raven has turned away. The Fire-Bringer has spoken to me. Let our young men take our young women. Let them seize the Wolf by the throat and never end their hatred. Then our women will bear many children. The Raven will lead the tribes of our ancestors from the North, drive back the Wolves like ashes from last year's fires, and rule the land again."
        - id: ch01-b48
          speaker: narrator
          text: The promise of a savior brought the people to their feet with a harsh howl. Mackenzie slipped his thumbs free of his mittens and waited. They shouted for the Fox until a young man stepped forward.
        - id: ch01-b49
          speaker: fox
          text: "Brothers, the Shaman speaks wisely. The Wolves take our women and leave our men without children. They trade evil drink and grass-made clothes for our warm furs. Those clothes do not keep out the cold, and our men die from strange sicknesses. I have no wife because twice the women I wanted went to the Wolves. I saved beaver, moose, and caribou skins so Thling-Tinneh would let me marry Zarinska. Now her snowshoes are tied on, ready to break trail for the Wolf. The Bear wanted her too. I speak for every young man without a wife. The Wolves always take the best meat and leave scraps for the Ravens."
        - id: ch01-b50
          speaker: narrator
          text: The Fox cruelly pointed to three women. Gugkla's bent legs kept her from carrying wood or meat. Moyri's crossed eyes frightened even babies. Pischet could not hear a bird, a husband, or a child. She lived in the White Silence. Each time he asked whether the Wolves had chosen one of them, the men shouted their approval.
        - id: ch01-b51
          speaker: fox
          text: "No more. The Wolves will not sneak among our fires again. Their time is over."
        - id: ch01-b52
          speaker: narrator
          text: Purple, green, and yellow northern light streamed from one horizon to the other. The Fox threw back his head and spread his arms.
        - id: ch01-b53
          speaker: fox
          text: "Look! Our fathers' spirits have risen. Great deeds will be done tonight!"
        - id: ch01-b54
          speaker: narrator
          text: The Fox stepped away. His companions pushed another man forward. The Bear stood a head taller than the rest, with his broad chest bare to the frost. Half his face had once been torn away. Words came slowly. At last he struck his chest, and it sounded like a drum.
        - id: ch01-b55
          speaker: bear
          text: "I am the Bear, the Silver-Tip and son of the Silver-Tip. While my voice was still a girl's, I killed lynx, moose, and caribou. When it whistled like a wolverine beneath a cache, I crossed the southern mountains and killed three men of the White River. When it grew as loud as the Chinook wind, I faced the grizzly and did not run."
        - id: ch01-b56
          speaker: narrator
          text: His hand swept across his terrible scars.
        - id: ch01-b57
          speaker: bear
          text: "I am not the Fox. My tongue is frozen like the river, and I do not make long speeches. He says great deeds are near, but he talks more than he acts. Tonight I will fight the Wolf. I will kill him, and Zarinska will sit beside my fire. The Bear has spoken."
        - id: ch01-b58
          speaker: narrator
          text: The camp erupted, but Mackenzie stood firm. A rifle was useless at such close range, so he pushed both revolver holsters around to the front and pulled his mittens back until only the long cuffs covered his hands. He knew that if the whole camp attacked at once there was no hope. Still, he was ready to keep his promise and die with his teeth locked fast. The Bear stopped the rush. He beat the most eager men back with his terrible fist until the noise began to fade. Mackenzie looked toward Zarinska. She made a magnificent sight. She leaned forward on her snowshoes like a tigress ready to spring, lips parted, nostrils trembling. Her great dark eyes stayed fixed on her own people with fear and defiance. The strain was so great that she seemed to have forgotten to breathe. Then she understood that the Bear meant to hold the others back and fight alone. Her muscles loosened. She settled against her snowshoes with a deep breath and looked at Mackenzie with something beyond love, almost worship.
        - id: ch01-b59
          speaker: narrator
          text: Thling-Tinneh tried to speak, but no one heard him. Mackenzie strode forward. The Fox opened his mouth to yell. Mackenzie spun on him so fiercely that the sound died in his throat. Everyone laughed, and the laughter quieted them.
        - id: ch01-b60
          speaker: mackenzie
          text: "Brothers, the White Man you call the Wolf came with honest words. He came as a friend and hoped to become a brother. Your men have spoken. Soft words are finished. First, your Shaman lies. His message did not come from the Fire-Bringer. He cannot hear the Raven. He invents clever tales and makes fools of you. He has no power."
        - id: ch01-b61
          speaker: mackenzie
          text: "Remember the famine. You ate dogs, raw hide, and strips from your moccasins. Old men died, old women died, and babies died at their mothers' empty breasts. Darkness covered the land, and you fell like salmon in autumn. Did the Shaman bring meat to your hunters or put food in your bellies? No. He has no power. So I spit in his face."
        - id: ch01-b62
          speaker: narrator
          text: The people drew back from the insult. Some women looked frightened, while the men waited to see a miracle. The Shaman tried to denounce Mackenzie, but Mackenzie advanced with fist raised and eyes blazing. The priest retreated.
        - id: ch01-b63
          speaker: mackenzie
          text: "Did I fall dead? Did lightning burn me? Did the stars crush me? No. Enough of that dog. My people rule many lands. First we hunt alone, as I do. Then we hunt in packs. At last we sweep over the earth like running caribou. Those who enter our lodges live. Those who refuse die. Zarinska is strong and beautiful, fit to mother Wolves. Even if I die, she will, because my brothers are many and will follow my dogs' trail. Hear the Law of the Wolf. If anyone kills one Wolf, ten of his people pay for that life. The price has been paid in many lands, and it will be paid in many more."
        - id: ch01-b64
          speaker: mackenzie
          text: "Now for the Fox and Bear. They want the woman, but I bought her. Thling-Tinneh has my goods and leans on my rifle. Still, I will be fair. The Fox gets five long plugs of tobacco to wet his dry tongue for more council noise. The Bear has earned my respect. He gets two blankets, twenty cups of flour, and twice the Fox's tobacco. If he crosses the eastern mountains with me, he gets a rifle like the chief's. If not, good. I am tired of talking. Remember the law. One Wolf's life costs ten of yours."
        - id: ch01-b65
          speaker: narrator
          text: Mackenzie smiled as he stepped back, though inwardly he was troubled. The night still had far to go. Zarinska came close and quietly explained the Bear's tricks with a knife.
        - id: ch01-b66
          speaker: narrator
          text: The council chose war. Men widened the beaten snow around the fire. Some said the Shaman had merely held back his power, while others remembered the famine and sided with the Wolf. The Bear entered the open space holding a long Russian hunting knife. When the Fox pointed to Mackenzie's guns, Mackenzie removed his belt and buckled it around Zarinska. He gave her his rifle too. She shook her head. Women were rarely allowed to touch such precious weapons.
        - id: ch01-b67
          speaker: mackenzie
          text: "If danger comes behind me, shout, ‘My husband!’ No, say it this way. ‘My husband!’"
        - id: ch01-b68
          speaker: narrator
          text: He laughed when she repeated it, pinched her cheek, and entered the circle. The Bear was taller, reached farther, and carried a blade two inches longer. Mackenzie knew he faced a true man, and the flash of steel quickened his blood.
        - id: ch01-b69
          speaker: narrator
          text: Again and again, the Bear drove him toward the edge of the long fire or toward the deep snow where his feet would sink. Each time, Mackenzie used a boxer's quick footwork to circle back into the center. Not one voice rose to encourage him. All around the ring, the Bear's friends shouted praise, warnings, and advice. Mackenzie answered none of it. His teeth only closed more tightly. The two knives struck together, flashed apart, and came together again. He thrust when he saw an opening and slipped aside when the longer Russian blade came for him. His coolness came from knowing his own strength. At first, he felt compassion for the man facing him. The old need to live soon drove that feeling away. Then even the need to live gave way to the fierce desire to kill. Ten thousand years of civilization dropped from him. There by the fire, with the watching circle pressed close, he was a cave man battling for his woman.
        - id: ch01-b70
          speaker: narrator
          text: Twice Mackenzie's knife pricked the Bear, and twice Mackenzie sprang away without a wound. On the third attack, he could not escape. His free hand closed around the Bear's knife hand, and the Bear caught his in the same grip. Their bodies crashed together. Only then did Mackenzie understand the tremendous strength against him. His muscles gathered into painful knots. The cords in his arms felt ready to break, but the point of the long Russian blade still crept nearer. He tried to tear himself loose. That only spent his strength. The circle of fur-clad watchers closed around them, certain the last stroke was coming and hungry to see it. Mackenzie called on a wrestler's trick. He swung partly to one side and struck at the Bear with his head. The Bear drew back without meaning to and lost his balance. At that same instant, Mackenzie placed his foot, tripped him, and drove all his weight forward. The Bear flew clear through the circle and landed in the deep snow. He floundered out at once and charged at full speed.
        - id: ch01-b71
          speaker: zarinska
          text: "My husband!"
          emotion: fearful
        - id: ch01-b72
          speaker: narrator
          text: A bowstring sounded. Mackenzie dropped low, and a bone-tipped arrow flew over him into the Bear's chest. The charging man toppled across Mackenzie's back and lay still. Across the fire, the Shaman was drawing another arrow. Mackenzie tossed his heavy knife by the point. Steel flashed over the flames. The hilt stood from the Shaman's throat as he pitched into the embers.
        - id: ch01-b73
          speaker: narrator
          text: Click, click. The Fox had seized Thling-Tinneh's rifle and tried to load it. The jammed ejector would not move. At Mackenzie's laugh, he dropped the weapon.
        - id: ch01-b74
          speaker: mackenzie
          text: "So the Fox has not learned to use the toy. He is still a woman. Bring it here, and I will show you. Come, I said!"
        - id: ch01-b75
          speaker: narrator
          text: The Fox crept forward like a beaten dog. Mackenzie cleared the mechanism, chambered a cartridge, and lifted the cocked rifle to his shoulder.
        - id: ch01-b76
          speaker: mackenzie
          text: "The Fox promised great deeds tonight, and he was right. But his were the smallest. Do you still mean to take Zarinska? Will you follow the Shaman and the Bear down their trail? No? Good."
        - id: ch01-b77
          speaker: narrator
          text: Mackenzie turned away in contempt and pulled his knife from the priest's throat.
        - id: ch01-b78
          speaker: mackenzie
          text: "Do any other young men want her? The Wolf will take you two and three at a time until none remain. No? Good. Thling-Tinneh, I give you this rifle again. If you ever travel to the Yukon, there will be food and a place beside the Wolf's fire. Night is becoming day. I leave now, though I may return. Remember the Law of the Wolf."
        - id: ch01-b79
          speaker: narrator
          text: To them, he seemed more than human. He joined Zarinska, and she took her place at the head of the team. The dogs moved out and disappeared into the ghostly forest. Mackenzie had waited until they were safely gone. Now he put on his snowshoes to follow.
        - id: ch01-b80
          speaker: fox
          text: "Has the Wolf forgotten my five long plugs?"
        - id: ch01-b81
          speaker: narrator
          text: Mackenzie turned on him angrily. Then the humor of it caught him.
        - id: ch01-b82
          speaker: mackenzie
          text: "I will give you one short plug."
        - id: ch01-b83
          speaker: fox
          text: "As the Wolf thinks best."
        - id: ch01-b84
          speaker: narrator
          text: The Fox meekly held out his hand.
