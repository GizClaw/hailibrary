audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and observant, with the steady weight of a northern tale
        timbre: warm, clear, and weathered
        pace: measured
        pitch: medium-low
    sitka_charley:
      display_name: Sitka Charley
      tts:
        delivery: stern, controlled, and commanding
        timbre: lean and weathered
        pace: measured
        pitch: medium-low
    gowhee:
      display_name: Gowhee
      tts:
        delivery: weary, plainspoken, and resolute
        timbre: rough and hollow
        pace: slow
        pitch: medium-low
    kah_chucte:
      display_name: Kah-Chucte
      tts:
        delivery: guarded, bitter, and resolute
        timbre: dry and strained
        pace: slow
        pitch: medium
  chapters:
    - id: ch01
      title: The Law of the Trail
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sitka Charley had done what seemed impossible. Other Indians might know the trail as well as he did, but he alone had learned the white man's wisdom, the honor of the trail, and the law. That understanding had not come in a day. His mind needed many facts, repeated many times, before it could draw the larger truth from them. He had spent his boyhood among white men. When he was grown, he left his own people once and for all and chose their fortunes for his own. He respected the white men's power and nearly worshiped it, but its secret still escaped him. Only after years of watching the same truths prove themselves did he understand honor and law. Because he was an outsider, he knew them more clearly than the white men did. Because he was an Indian, his achievement seemed impossible.
        - id: ch01-b02
          speaker: narrator
          text: That knowledge had bred a certain contempt for his own people. He usually kept it hidden, but now it burst out in a storm of curses against Kah-Chucte and Gowhee, spoken in every language Charley knew. The two men shrank before him like snarling wolf dogs. They were too cowardly to spring and too wolfish to hide their teeth. None of the three was pleasant to see. Hunger had stripped the flesh from their faces. Frost had cracked and frozen the ugly sores along their cheekbones again and again, and desperation burned in their eyes. Men driven beyond honor and law could not be trusted. Charley knew it. Ten days earlier, he had made Kah-Chucte and Gowhee leave their rifles with the abandoned camp gear. Only his rifle and Captain Eppingwell's remained.
        - id: ch01-b03
          speaker: sitka_charley
          text: "Come. Get the fire going."
        - id: ch01-b04
          speaker: narrator
          text: He brought out the precious matches and strips of dry birchbark. The two men sullenly gathered dead branches and brush. They were so weak that they often grew dizzy when they bent down. Their knees shook as they staggered back with the wood. After every trip they stopped to rest, sick and worn nearly to death. At one moment they endured without complaint. At the next, everything in them seemed to cry, “I want to live!”
        - id: ch01-b05
          speaker: narrator
          text: A faint south wind bit every patch of exposed skin and drove the frost through fur and flesh like burning needles. Once the fire had grown strong and melted a damp ring in the snow, Charley made his unwilling companions help pitch a shelter. It was a simple thing. They stretched a blanket beside the fire on the windward side, slanting it about halfway between upright and flat. It blocked the cold wind and threw the fire's heat back and down onto the place where they would huddle. They spread green spruce boughs so their bodies would not touch the snow. Then Kah-Chucte and Gowhee thawed their battered moccasins and socks. Long travel had worn them badly, and sharp ice from the river jams had cut them to rags. When the socks came off, the dead-white ends of their toes, already dying in different degrees, showed what the trail had done.
    - id: ch02
      title: Back Along the Frozen River
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Charley left them with their drying footwear and turned back along the way they had come. He longed to sit by the fire and care for his own aching body, but honor and the law would not allow it. He struggled across the frozen river. Every step was a protest, and every muscle fought him. In several places, open water between the ice jams had only just frozen over. The fragile surface bent and threatened beneath his feet, forcing him into a painful hurry. Death in those places would be quick and easy, but Charley did not want his suffering to end that way.
        - id: ch02-b02
          speaker: narrator
          text: His growing worry vanished when two Indians appeared around a bend. They staggered and gasped like men carrying crushing loads, though each pack weighed only a few pounds. Charley questioned them eagerly, took comfort from their answers, and hurried on. Next came two white men with a woman between them. Weakness made their legs shake, and they moved like drunken men. Yet the woman rested only lightly on their arms. Even then, she chose to carry herself forward with her own strength.
        - id: ch02-b03
          speaker: narrator
          text: Joy crossed Charley's face when he saw Mrs. Eppingwell. He thought very highly of her. He had known many white women, but she was the first to travel the trail with him. When Captain Eppingwell first offered to hire him for this dangerous journey through the unknown Northland, Charley had shaken his head. He knew that such a trail would test every soul to the limit. Once he heard the captain's wife was coming, he refused completely. A woman of his own people would have caused him no concern, but he thought women from the Southland were far too soft and delicate for such work.
        - id: ch02-b04
          speaker: narrator
          text: Then Mrs. Eppingwell came to speak with him. Five minutes earlier, he had never dreamed of taking charge of the expedition. She smiled, used clear and direct words, and made her point without pleading or trying to persuade him. If her eyes had asked for mercy, or if her voice had trembled, Charley would have turned hard as steel. Instead, her steady eyes, ringing voice, frank manner, and quiet claim to equality swept away his objections. He gave in. Within days on the trail, he understood that she was not the kind of woman he had imagined. He began to see why the sons of women like her mastered land and sea while the sons of women from his own people did not prevail against them.
        - id: ch02-b05
          speaker: narrator
          text: Day after day, he watched her push on, her muscles worn out and her whole body exhausted, yet still unconquered. Soft and delicate, he had called her. Those words returned to him over and over as she continued. Her feet belonged to easy roads and sunny lands. They had never known the pain of northern moccasins or the cold kiss of frost, yet they kept moving through each weary day. She always had a smile and a cheering word, even for the lowest packer. When the road grew darker, she seemed to grow harder and find still more strength.
        - id: ch02-b06
          speaker: narrator
          text: Kah-Chucte and Gowhee had boasted that they knew every mark along the way as well as a child knew the hide fastenings of a lodge. When they finally admitted they were lost, Mrs. Eppingwell answered their failure with forgiveness while the men cursed them. That night, she sang to the travelers. As they listened, their weariness seemed to fall away, and they became ready to face the unknown road with new hope. Later, when the food began to fail and every small portion was measured jealously, her husband and Charley quietly planned to give her more. She rebelled against them. In the end, she demanded and received a share no larger and no smaller than anyone else's.
        - id: ch02-b07
          speaker: narrator
          text: Charley was proud to know her. Her presence had made his life richer and wider. Until then, he had been his own teacher. He had shaped himself by his own judgment, turned neither right nor left at another man's command, and cared for no opinion but his own. Now someone outside himself called for the best in him. A grateful glance from her steady eyes, a word of thanks in her clear voice, or the smallest smile carried him proudly for hours. For the first time, his wisdom of the trail gave him conscious pride. Together, he and Mrs. Eppingwell kept the others from losing heart.
        - id: ch02-b08
          speaker: narrator
          text: The two men and the woman brightened when they saw him, for Charley was the staff that held them up. He hid both pain and pleasure behind his usual hard expression. He asked about those behind them, told them how far it was to the fire, and went on.
        - id: ch02-b09
          speaker: narrator
          text: He next met an Indian limping alone without a pack. The man held his lips tight against the pain of a freezing foot in which living flesh was losing its fight with the dead. Everything possible had been done for him, but Charley believed he had few days left. Since the man could not keep pace much longer, Charley gave him rough words of courage and continued back.
        - id: ch02-b10
          speaker: narrator
          text: Then he found two more Indians. He had ordered them to help Joe, the third white man, but they had left Joe behind. Charley saw the readiness to spring in their bodies and knew they had thrown off his rule at last. He was prepared when he ordered them back and their hunting knives flashed from the sheaths. Three starving, weakened men raised their small strength against one another in the enormous wilderness. The two recoiled beneath fierce blows from Charley's rifle and returned like beaten dogs to the leash. Two hours later, Joe reeled between them while Charley guarded the rear. Together they reached the fire and the rest of the expedition crouching beneath the blanket shelter.
    - id: ch03
      title: Charley's Law
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After everyone had eaten a thin ration of unleavened bread, Charley spoke to the Indians in their own language. He had already given the white travelers the meaning of his words.
        - id: ch03-b02
          speaker: sitka_charley
          text: "Listen before we sleep, my comrades. These words may keep you alive. I am giving you the law, and any man who breaks it will answer with his life. We have passed the Hills of Silence and reached the upper Stuart. It may take one sleep or many, but we will finally reach the men of the Yukon, and they have plenty of food. Until then, we must obey the law. Today I ordered Kah-Chucte and Gowhee to break trail. They forgot they were men and ran like frightened children."
        - id: ch03-b03
          speaker: narrator
          text: Charley paused. He said they would forget that failure, but the two men must remember themselves from then on. His hand rested carelessly on his rifle, and the threat was plain.
        - id: ch03-b04
          speaker: sitka_charley
          text: "Tomorrow, Kah-Chucte and Gowhee will carry the flour and keep the white man Joe from lying down beside the trail. Every cup of flour has been counted. If even one ounce is gone at nightfall, you know the price. Others forgot themselves today as well. Moose Head and Three Salmon left Joe in the snow. At daylight, they will go ahead and break trail. You have heard the law. Take care that you do not break it."
        - id: ch03-b05
          speaker: narrator
          text: The next day, even Charley could not keep the travelers close together. From Moose Head and Three Salmon at the front to Kah-Chucte, Gowhee, and Joe at the rear, the line stretched for more than a mile. Each person staggered, fell, or stopped whenever he had to.
        - id: ch03-b06
          speaker: narrator
          text: Their march was a chain of uneven halts. Each traveler used the last of his strength and stumbled on until it was gone. Somehow, another last bit always appeared. Every time a man fell, he was certain he would never rise. Still, he rose, and then rose again. The body gave way while the will conquered, but each victory was a tragedy because it forced the body onward into more pain. The Indian with the frozen foot could no longer stand. He crawled on his hands and knees and seldom rested, because he knew the frost would take its full price if he stopped.
        - id: ch03-b07
          speaker: narrator
          text: At last, even Mrs. Eppingwell wore a smile as hard as stone. Her open eyes no longer seemed to see. Often she stopped, pressed a mitten to her heart, and fought for breath while dizziness swept over her.
        - id: ch03-b08
          speaker: narrator
          text: Joe had gone beyond suffering. He no longer begged to be left alone or prayed for death. Delirium had become a soothing drug and left him peaceful and unaware. Kah-Chucte and Gowhee dragged him roughly, with savage looks and blows whenever he fell. To them, carrying his weakness was the greatest injustice. Their hearts were bitter with hatred and heavy with fear. Why should they spend their strength on his helpless body? Helping him might mean their deaths. Refusing meant Charley's law and Charley's rifle.
    - id: ch04
      title: Flour by the Fire
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: As daylight faded, Joe fell more often. Each time, he was harder to lift, and the three men dropped farther behind. Sometimes all of them collapsed into the snow because Kah-Chucte and Gowhee had grown so weak. Yet on their backs they carried life, strength, and warmth. Everything that could keep a man alive lay inside the flour sacks. They could not stop thinking about that food, and what followed was no wonder.
        - id: ch04-b02
          speaker: narrator
          text: The three fell beside a great jam of timber, where enough dry wood for a thousand fires waited for a match. An open hole showed dark water through the river ice. Kah-Chucte studied the wood and water. Gowhee did the same. Then they looked at each other. Neither man spoke.
        - id: ch04-b03
          speaker: narrator
          text: Gowhee made a fire. Kah-Chucte filled a tin cup with water and warmed it. Joe babbled about another land in words they could not understand. The two men stirred flour into the warm water until it made a thin paste, then drank cup after cup. They gave none to Joe. He noticed nothing, not even when his moccasins began to scorch and smoke among the coals.
        - id: ch04-b04
          speaker: narrator
          text: Fine crystals of snow drifted softly around them, almost like a caress, and wrapped them in clinging robes of white. Their feet might have walked many more trails if fate had not brushed the clouds aside and cleared the air. Ten more minutes beneath that covered sky would have saved them. Instead, far ahead, Sitka Charley looked back, saw the pillar of smoke, and understood. Then he looked at the travelers who had remained faithful, and at Mrs. Eppingwell.
        - id: ch04-b05
          speaker: sitka_charley
          text: "So, my good comrades, you have forgotten again that you are men. Good. Very good. Now there will be fewer stomachs to feed."
        - id: ch04-b06
          speaker: narrator
          text: As he spoke, Charley tied the flour sacks shut and fastened their load on top of his own pack. He kicked Joe until pain broke through the man's delirium and brought him trembling to his feet. Then he pushed Joe onto the trail and sent him ahead. Kah-Chucte and Gowhee tried to slip away.
        - id: ch04-b07
          speaker: sitka_charley
          text: "Stay there, Gowhee. You too, Kah-Chucte. Has the flour made your legs strong enough to outrun a bullet? Do not think you can cheat the law. Be men for the last time, and be satisfied that you will die with full stomachs. Now go back to the timber. Stand shoulder to shoulder. Come."
        - id: ch04-b08
          speaker: narrator
          text: The two men obeyed quietly and without fear. It is the future that weighs on a man, not the present.
    - id: ch05
      title: The Men of the Yukon
      blocks:
        - id: ch05-b01
          speaker: sitka_charley
          text: "Gowhee, you have a wife and children and a deerskin lodge in the Chipewyan. What do you want done for them?"
        - id: ch05-b02
          speaker: gowhee
          text: "Give my wife the goods the captain promised me. Give her the blankets, beads, tobacco, and the box that makes the white man's strange sounds. Tell her I died on the trail, but do not tell her how."
        - id: ch05-b03
          speaker: sitka_charley
          text: "And you, Kah-Chucte? You have no wife or child."
        - id: ch05-b04
          speaker: kah_chucte
          text: "I have a sister. She is married to the factor at Koshim. He beats her, and she is unhappy. Give her the goods the contract promised me. Tell her she should return to her own people. If you meet that man and wish to do it, killing him would be a good deed. He beats her, and she is afraid."
        - id: ch05-b05
          speaker: sitka_charley
          text: "Are both of you willing to die under the law?"
        - id: ch05-b06
          speakers: [gowhee, kah_chucte]
          ensemble: duo
          text: "We are."
        - id: ch05-b07
          speaker: sitka_charley
          text: "Then good-bye, my good comrades. Before this day ends, may you sit in warm lodges beside a well-filled pot."
        - id: ch05-b08
          speaker: narrator
          text: Charley raised his rifle. Its shot broke the silence and returned in many echoes. Before those echoes faded, other rifles answered in the distance. Charley started. He had heard more than one shot, but the expedition carried only one other rifle.
        - id: ch05-b09
          speaker: narrator
          text: He glanced once at the two men lying so quietly. Then he smiled bitterly at the wisdom of the trail and hurried forward to meet the men of the Yukon.
