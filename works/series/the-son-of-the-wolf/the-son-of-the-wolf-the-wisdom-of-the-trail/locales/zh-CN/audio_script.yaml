audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静克制，带着北国故事的冷峻与悲悯
        timbre: 温厚清晰，略带风霜感
        pace: 舒缓而有张力
        pitch: 中低
    sitka_charley:
      display_name: 锡特卡·查利
      tts:
        delivery: 冷峻威严，言语简短，恪守雪道法则
        timbre: 低沉粗粝
        pace: 稳健缓慢
        pitch: 低
    kah_chucte:
      display_name: 卡楚克特
      tts:
        delivery: 饥疲而阴郁，面对死亡时平静坦然
        timbre: 干涩低哑
        pace: 缓慢
        pitch: 中低
    gowhee:
      display_name: 高希
      tts:
        delivery: 虚弱戒备，交代遗愿时朴实克制
        timbre: 沙哑厚重
        pace: 缓慢
        pitch: 低
  chapters:
    - id: ch01
      title: 荣誉与法则
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "锡特卡·查利做到了不可能的事。别的印第安人也许和他一样懂得怎样走雪道，可只有他懂白人的智慧，还懂雪道上的荣誉与法则。这些道理并非一天就能学会。土著的心不善于从一件事推想到另一件事，非得看着许多事实一再重演，才会明白其中的意思。"
        - id: ch01-b02
          speaker: narrator
          text: "查利从小不断跟白人来往，长大后更把命运同他们连在一起，从此离开了自己的族人。他敬畏白人的力量，也一直想弄懂这力量从哪里来，却猜不透真正的秘密。直到多年证据一点点积起来，他才看见，那秘密就是荣誉与法则。他是外族人，所以一旦懂了，反倒比白人自己懂得更透。他又是印第安人，所以这才是一件不可能的事。"
        - id: ch01-b03
          speaker: narrator
          text: "这些领悟让他暗暗轻视自己的族人。平日里，他总把轻蔑藏好，这一天却突然爆发了。他用几种语言轮番咒骂卡楚克特和高希。两人在他面前缩着身子，活像两条龇牙低吼的狼犬，胆小得不敢扑上来，野性又不许他们收起牙齿。"
        - id: ch01-b04
          speaker: narrator
          text: "三个人的模样都很吓人。脸颊没有一点肉，突出的颧骨上结满硬痂。那些痂在酷寒里裂开，冻住，再裂开。眼睛里烧着阴森的光，那是绝望和饥饿点起的火。人到了这种境地，又把荣誉与法则抛在身后，就不能再信。查利很清楚这一点，也一直防着他们。所以早在十天前，他就逼两人把步枪跟其余营具一起丢掉。队里只剩他和埃平韦尔上尉的两支枪。"
        - id: ch01-b05
          speaker: sitka_charley
          text: "来，把火生起来。"
        - id: ch01-b06
          speaker: narrator
          text: "他说着拿出珍贵的火柴盒，还有备好的干桦树皮。两个印第安人不情愿地去捡枯枝。他们太虚弱，弯腰时常常一阵眩晕，只好慌忙撑住自己。抱着柴回来时，两只膝盖抖得像响板。每走一趟，他们都要歇一会儿，仿佛病得很重，累得快死了。有时，眼里只剩下默默忍痛的神情。有时，心底那个‘我’几乎要冲出来，放声喊着，我要活下去。这是所有活物心中最强烈的声音。"
        - id: ch01-b07
          speaker: narrator
          text: "南边吹来一丝微风，咬住他们裸露的皮肤。寒气像火针一样穿过毛皮和血肉，直扎进骨头。火旺起来，融开了周围一圈雪。查利又逼不情愿的同伴帮忙搭挡风篷。他们把一条毯子拉在火堆上风处，与火平行，斜成大约四十五度。这样既能挡住冷风，也能把热气向后、向下反射，正好落在蜷缩于篷下的人身上。地上再铺一层青翠的云杉枝，身体才不至于贴着积雪。"
        - id: ch01-b08
          speaker: narrator
          text: "忙完以后，卡楚克特和高希开始照料双脚。长路磨坏了他们冻硬的鹿皮鞋，河面冰坝的尖冰又把鞋割成碎片。厚袜也是一样。等袜子烘化脱下，脚趾尖一片死白，有的刚刚坏死，有的已经腐烂。那双脚不用开口，就把雪道上的苦全说出来了。"
    - id: ch02
      title: 折返雪道
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "查利留下两人烘鞋袜，自己沿来路折返。他也想坐在火旁，好好照料疼痛不止的身体，可荣誉与法则不准。他在冰封的河面上一点点挪动，每一步都让身体抗议，每一块肌肉都在反抗。冰坝之间有些活水才结薄冰，他只得突然加快脚步，因为冰面正在脚下摇晃，随时会裂开。在那里，死又快又容易，可他还不想停下受苦。"
        - id: ch02-b02
          speaker: narrator
          text: "两个印第安人从河湾后拖着脚出现，他心里的忧虑才散去。他们喘得厉害，仿佛背着千斤重担，其实包袱只有几磅。查利问清后面的情形，马上继续赶路。接下来，两个白人扶着一个女人走来。三个人都像喝醉了一样摇晃，四肢虚弱得发抖。女人却只轻轻借力，仍靠自己往前走。"
        - id: ch02-b03
          speaker: narrator
          text: "看见埃平韦尔太太，喜悦在查利脸上一闪。他很敬重她。他见过不少白人女人，可这是第一个跟他一起走雪道的。当初上尉出钱请他带队，走一条无人熟悉的路，穿过北地阴郁无边的荒野。他知道这趟路会把人的灵魂逼到极限，便郑重地摇头。后来听说上尉太太也要去，他更是一口拒绝。若是本族女人还好，可南方女人太娇嫩，哪里经得住这样的路。"
        - id: ch02-b04
          speaker: narrator
          text: "然而，埃平韦尔太太走到他面前，带着动人的微笑，用清楚纯正的英语直说来意。她不哀求，也不劝诱，更没有拿女人的柔弱来换取怜悯。要是她眼里有一丝求情，嗓音有一点发颤，查利的心一定会硬得像钢。可她的目光清澈锐利，声音清亮，为人坦荡，还自然地把自己放在与他平等的位置。五分钟前，查利还没想过接下远征队，这时却被她弄得失去了判断，立刻答应了。他觉得，自己遇见了一种从未见过的女人。"
        - id: ch02-b05
          speaker: narrator
          text: "同行没过几天，他就懂了，为什么这种女人的儿子能征服陆地和海洋，而自己族中女人的儿子敌不过他们。娇嫩又柔弱！他每天看着她肌肉酸痛，筋疲力尽，却始终不肯屈服，这几个字便一遍遍敲着他的心。她的脚原该只走平坦的路，踏在温暖的阳光下，从没尝过北地鹿皮鞋里的疼，也没被严霜吻过。可那双脚仍在漫长的白昼里不停向前。查利看着，惊叹不已。"
        - id: ch02-b06
          speaker: narrator
          text: "她总带着微笑，也总肯说一句鼓劲的话，哪怕最卑微的背夫也不会漏下。路越黑，她反倒越坚强。卡楚克特和高希曾夸口熟悉沿途每个标志，就像孩子熟悉自家帐篷的皮片。等两人承认迷路，男人们纷纷咒骂，是她宽厚地替他们说话。那一夜，她唱歌给大家听，直到疲倦仿佛离开众人，希望又回来了。粮食告罄后，每一小份都要仔细计算。丈夫和查利想暗中多给她一些，她却不肯，坚持自己的份量既不能多，也不能少。"
        - id: ch02-b07
          speaker: narrator
          text: "查利以认识她为荣。这个女人让他的生命变得更丰厚，天地也更宽了。过去，他只做自己的老师，只听自己的判断，从不按谁的召唤改变方向。他依着自己的意思磨炼自己，也只在意自己是否认可。如今，他头一回听见外界召唤，要他拿出心里最好的东西。她一个赞许的眼神，一句清亮的感谢，或是一点微笑，都能让他接下来几小时像与诸神同行。这股力量让他的男子气概有了新的用处。他第一次真心为自己的雪道智慧骄傲。一路上，他们两人总能把同伴快沉到底的心重新托起。"
        - id: ch02-b08
          speaker: narrator
          text: "两个男人和埃平韦尔太太看见查利，脸上都亮了。他毕竟是众人倚靠的手杖。可查利像往常一样挺得笔直，把快乐和痛苦全藏在铁一般的外表下，对两者一视同仁。他只问了后队的情况，告诉他们火堆还有多远，便接着往回走。"
        - id: ch02-b09
          speaker: narrator
          text: "他先遇见一个独行的印第安人。那人没有背包，拖着冻伤的脚一瘸一拐，嘴唇紧紧抿着，眼睛里全是疼痛。脚上的活肉正在和死肉打一场注定失败的仗。大家已经尽力照料过他，可到了绝境，弱者和不幸的人终究会死。查利知道他活不了多久，也知道他很快就再也跟不上了，只能用几句粗硬的话给他打气。"
        - id: ch02-b10
          speaker: narrator
          text: "再往后，他碰见另外两个印第安人。查利原本派他们扶着队里的第三个白人乔，他们却把乔扔下了。查利看出两人绷紧了身体，藏着随时扑击的架势，明白他们终于甩掉了自己的管束。他命令他们回去找乔，两把猎刀立刻出了鞘。三个虚弱的男人，就这样在无边荒野里举起一点可怜的力气。查利用枪托凶狠地砸下去，两人便退了，像挨打的狗一样重新套上牵绳。两小时后，他们扶着站不稳的乔回到火边，查利跟在最后。其余人正缩在挡风篷下。"
    - id: ch03
      title: 雪道的法则
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "众人吞下少得可怜的一份无酵饼。查利先把要说的话告诉白人，随后改用印第安人的语言，面向自己的族人。"
        - id: ch03-b02
          speaker: sitka_charley
          text: "睡前听我说几句，伙伴们。这是为你们好，也许还能救你们的命。现在我把法则告诉你们，谁违背它，死了只能怪自己。我们已经越过寂静山丘，正在走斯图尔特河上游。也许再睡一觉，也许要睡好几觉，甚至许多觉，可总有一天会走到育空人那里。他们有很多食物。所以，我们得守住法则。今天我让卡楚克特和高希破路，他们忘了自己是男人，像受惊的孩子一样逃了。"
        - id: ch03-b03
          speaker: sitka_charley
          text: "他们忘了，我们就把这一次忘掉。往后，他们可得记住。要是碰巧又忘了……"
        - id: ch03-b04
          speaker: narrator
          text: "他若无其事地碰了碰步枪，脸色却很阴沉。"
        - id: ch03-b05
          speaker: sitka_charley
          text: "明天，他们背面粉，还要看住白人乔，不许他倒在路边。面粉一杯杯全都数过，到了天黑，哪怕少一盎司……你们明白。今天还有人忘了。驼鹿头和三文鱼把乔丢在雪里。不要再忘第二次。天一亮，你们两个到前面破路。法则已经说完了。好好当心，别去违背。"
        - id: ch03-b06
          speaker: narrator
          text: "查利没法让队伍紧紧跟在一起。从最前面破路的驼鹿头和三文鱼，到最后的卡楚克特、高希和乔，队伍拖散了一英里多。每个人都只能照自己的情形走，踉跄几步，跌倒，或停下来喘息。"
        - id: ch03-b07
          speaker: narrator
          text: "整支队伍的行进，就是从一次停顿挪到下一次停顿，没有节奏，也没有章法。人人都榨出最后一点力气，跌跌撞撞地走到那点力气用完。可不知为什么，身体里总能再找到另一个最后一点。每次倒下，他们都相信自己再也起不来，可每次还是起来了，一回又一回。肉体认输了，意志却赢了，只是每次胜利都是一场悲剧。冻伤脚的印第安人再也站不直，只能靠手和膝盖爬。他几乎不停下来，因为知道严寒会向停下的人索取什么代价。"
        - id: ch03-b08
          speaker: narrator
          text: "就连埃平韦尔太太的嘴唇也终于凝成石头般的笑。她睁着眼，却已经看不见。她常停下来，把戴手套的手按在心口，喘不上气，眼前发晕。"
        - id: ch03-b09
          speaker: narrator
          text: "乔已经感觉不到痛苦。他不再求人把自己丢下，也不再求死。神志昏乱像止痛药一样安抚着他，让他安静又满足。卡楚克特和高希粗暴地拖他往前，不时瞪他一眼，或动手打他。在两人看来，这件事再不公平不过。"
        - id: ch03-b10
          speaker: narrator
          text: "他们心里满是苦涩的恨，恐惧又重重压着他们。凭什么要用自己的力气背负乔的软弱？他倒下了，为什么要拖着他们一起死？继续照料他，这条路的尽头就是死亡。可若把他丢下，他们又会想起查利定下的法则，想起那支随时会开火的步枪。"
    - id: ch04
      title: 一袋面粉
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "天色渐暗，乔跌倒得越来越多。他太沉，两人一次比一次难把他扶起，三个人渐渐落在远处。有时，卡楚克特和高希也虚弱得站不住，跟乔一起栽进雪里。可他们背上驮着生命、力量，还有温暖。"
        - id: ch04-b02
          speaker: narrator
          text: "那一袋袋面粉里，装着活下去的一切可能。他们没法不想。后来发生的事，也就不奇怪了。三人在一座巨大的木材冰坝旁倒下。那里堆着上千柯德木柴，只差一根火柴。附近的冰面还有水眼。卡楚克特看看木柴，再看看水。高希也看了。然后，两个人对望了一眼。"
        - id: ch04-b03
          speaker: narrator
          text: "谁也没有开口。高希点起火，卡楚克特舀了一白铁杯水放上去烧。乔含糊地说着另一个国度里的事，用的是他们听不懂的语言。两人把面粉调进温水，搅成稀糊，一杯接一杯地喝。他们没有给乔，可乔毫不在意。他什么都不在意，连鹿皮鞋掉进炭火，烤得冒烟焦黑，也没有反应。"
        - id: ch04-b04
          speaker: narrator
          text: "冰晶般的雪雾轻轻落在他们身边，像在抚摸，又给他们裹上一层甩不掉的白袍。如果命运没有拨开云层，扫净天空，这几双脚本来还能走过很多条雪道。是晴开的天空暴露了火烟。只要云再遮上十分钟，只要他们晚被发现十分钟，他们便能得救。"
        - id: ch04-b05
          speaker: narrator
          text: "查利回头时，看见他们的火堆升起一根笔直烟柱。他立刻猜到了。他看看前方那些忠于法则的人，又看看埃平韦尔太太，这才折回来。"
        - id: ch04-b06
          speaker: sitka_charley
          text: "原来我的好伙伴又忘了自己是男人。很好，好极了。以后少了几张嘴要喂。"
        - id: ch04-b07
          speaker: narrator
          text: "他说着扎紧面粉袋，把它捆到自己背上的包袱上。随后，他踢打乔，直到疼痛刺破那可怜人的幸福迷梦，把他唤醒。乔哆哆嗦嗦地站起来，查利把他推回雪道，催他继续赶路。卡楚克特和高希想悄悄溜走。"
        - id: ch04-b08
          speaker: sitka_charley
          text: "站住，高希！卡楚克特，你也留下！这些面粉真给了你们那么大的力气？你们的腿能跑过飞得那么快的铅弹吗？别想骗过法则。最后再做一次男人吧。你们至少能饱着肚子死，该知足了。"
    - id: ch05
      title: 最后的雪道
      blocks:
        - id: ch05-b01
          speaker: sitka_charley
          text: "来，回到木柴那边。走上前，肩并肩站好。来吧。"
        - id: ch05-b02
          speaker: narrator
          text: "两人默默照做，没有害怕。真正压迫人的，是未来，而不是已经来到眼前的这一刻。"
        - id: ch05-b03
          speaker: sitka_charley
          text: "高希，你在奇佩维安有妻子、有孩子，还有一顶鹿皮帐篷。你有什么遗愿？"
        - id: ch05-b04
          speaker: gowhee
          text: "上尉答应给我的东西，请你都交给她。毯子、珠子、烟草，还有那个会像白人的东西一样发出怪声的盒子。告诉她，我死在雪道上。别告诉她我是怎么死的。"
        - id: ch05-b05
          speaker: sitka_charley
          text: "卡楚克特，你没有妻子，也没有孩子。你要留下什么话？"
        - id: ch05-b06
          speaker: kah_chucte
          text: "我有个妹妹，她嫁给了科希姆的商站主。那个男人打她，她过得不快乐。请把契约里属于我的东西交给她，再告诉她，最好回到自己的族人那里。你要是遇见那个男人，也愿意动手，杀了他会是一件好事。他打她，她很怕。"
        - id: ch05-b07
          speaker: sitka_charley
          text: "你们甘愿依照法则受死吗？"
        - id: ch05-b08
          speakers: [gowhee, kah_chucte]
          ensemble: duo
          text: "我们甘愿。"
        - id: ch05-b09
          speaker: sitka_charley
          text: "那么，再见了，我的好伙伴。愿今天还没有过去，你们就已经坐进温暖的帐篷，守着满满一锅食物。"
        - id: ch05-b10
          speaker: narrator
          text: "他说着举起步枪。枪声响起，许多回声打破了寂静。回声还没消尽，远方也响起了枪声。查利猛地一惊。"
        - id: ch05-b11
          speaker: narrator
          text: "远处响的不止一枪，可整支队伍明明只剩下另一支步枪。"
        - id: ch05-b12
          speaker: narrator
          text: "查利飞快地瞥了一眼静静躺着的两个人，恶狠狠地朝雪道的智慧笑了笑，随后赶向前方，去迎接那些从育空来的人。"
