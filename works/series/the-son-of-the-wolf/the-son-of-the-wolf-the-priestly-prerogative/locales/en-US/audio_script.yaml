  chapters:
    - id: ch01
      title: Waifs on the Yukon Trail
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: This is the story of a man who did not value his wife, and of a woman who honored him far more than he deserved when she gave herself to him. It also concerns a Jesuit priest who had never been known to lie. The priest belonged in the Yukon and was badly needed there. The man and woman had only drifted in by chance. They were two of the many strange waifs who ride at the front of a gold rush or trail along behind it.
        - id: ch01-b02
          speaker: narrator
          text: Edwin and Grace Bentham were among those waifs, and they came well behind the great Klondike rush of 1897. By then, the human tide had swept down the great river and settled in famine-stricken Dawson. The rush itself had passed. Winter closed the Yukon beneath three feet of ice and put the river to sleep. The wandering couple were still at Five Finger Rapids, with the City of Gold many nights of travel to the north.
        - id: ch01-b03
          speaker: narrator
          text: Many cattle had been butchered there in the fall, leaving a great heap of bones, scraps, and hides. The Benthams' three companions stared at it, did some quick arithmetic, saw a fortune, and decided to stay. All winter they filled sacks with bones and frozen hides and sold them to starving dog teams. Their modest price was one dollar a pound, with everything weighed just as it came. Six months later, the sun returned and the Yukon woke. The three men buckled on heavy money belts and went home to the Southland, where they still tell enormous tales about the Klondike they never reached.
        - id: ch01-b04
          speaker: narrator
          text: Edwin was lazy enough to join their dog-food business, if only he had not possessed a wife. Grace appealed to his vanity instead. She praised his strength and told him a man like him could conquer every obstacle and win the Golden Fleece. Edwin set his jaw, traded his share of the bones and hides for a sled and one dog, and turned north. It was Grace who made that decision happen, though Edwin carried himself as if the courage were all his.
        - id: ch01-b05
          speaker: narrator
          text: Grace followed so closely that Edwin's snowshoe tracks never had time to grow cold. Before three hard days had passed, he was trailing at the rear while she broke the path ahead. Whenever another traveler appeared like a ghost on the silent trail, husband and wife quickly changed places. Edwin stepped forward and Grace fell back. In that way, no passing stranger ever guessed what kind of man he was.
        - id: ch01-b06
          speaker: narrator
          text: How those two ever came to marry does not matter here. Such mismatched marriages are common enough, and looking too closely at them can shake a person's faith that couples are somehow meant for one another. Edwin was a boy trapped by accident in a man's body. He could pull a butterfly apart without concern, yet cringe before a lean, determined man half his size. Behind his mustache, his large frame, and a thin polish of manners hid a selfish crybaby. He was a clubman and a society man, charming enough while saying nothing of value. He talked grandly and wept over a toothache. Men like him are hard to recognize in a drawing room. A week of sharing his cooking pot and blanket would show any traveler the truth.
        - id: ch01-b07
          speaker: narrator
          text: Grace looked like a slender, girlish creature. Anyone who truly knew her found a spirit so large that it made his own seem small, though she had lost none of her tenderness. This was the woman who encouraged Edwin through his search for northern gold. She broke trail for him when nobody watched, then wept in secret because her exhausted body could not always match the strength of her will.
        - id: ch01-b08
          speaker: narrator
          text: The strangely matched couple traveled down to old Fort Selkirk, then crossed a hundred miles of bleak country toward the Stuart River. One short day faded before they reached shelter. Edwin lay down in the snow and sobbed. Grace tied him securely to the sled. She bit her lips against the pain in her aching arms and legs, then helped their lone dog drag him all the way to Malemute Kid's cabin.
        - id: ch01-b09
          speaker: narrator
          text: The Kid was away. Meyers, the German trader, cooked thick moose steaks and made them a bed of fresh pine boughs. Nearby, Lake, Langham, and Parker were preparing an elaborate dinner, and all three were greatly excited by the arrival of a woman.
        - id: ch01-b10
          speaker: langham
          text: "Sandy! Can you tell a porterhouse from a round steak? Come help me with this moose!"
        - id: ch01-b11
          speaker: narrator
          text: Langham was in the cache, losing a struggle with several frozen quarters of meat.
        - id: ch01-b12
          speaker: parker
          text: "Stay right there and finish those dishes!"
        - id: ch01-b13
          speaker: lake
          text: "Sandy, be a good fellow and run down to Missouri Camp for some cinnamon. Oh, hurry. Why don't you get moving?"
        - id: ch01-b14
          speaker: narrator
          text: A crash of meat and boxes inside the cache cut Lake short.
        - id: ch01-b15
          speaker: lake
          text: "Come on, Sandy. Missouri Camp is only a minute away."
        - id: ch01-b16
          speaker: parker
          text: "Leave him alone. I can't mix the biscuits until he clears the table."
        - id: ch01-b17
          speaker: narrator
          text: Sandy hesitated until he remembered that Langham was his own master. He dropped the greasy dishcloth with an apology and hurried to the rescue.
        - id: ch01-b18
          speaker: narrator
          text: These three promising sons of rich families had come north seeking glory, with money to spend and one servant apiece. Luckily for their souls, the other two servants were away on the White River hunting a legendary quartz ledge. That left Sandy grinning beneath the burden of three healthy young masters, each with his own peculiar ideas about cooking. Twice that morning their disagreements had nearly torn the camp apart. Only great concessions from one cook or another saved the peace. At last, their combined labor produced a truly fine dinner.
        - id: ch01-b19
          speaker: narrator
          text: A three-handed game of cutthroat settled who would fetch their guest. Parker won. He smoothed his center-parted hair, put on his mittens and bearskin cap, and went to the Kid's cabin. He returned with Grace and Malemute Kid. Grace regretted that Edwin could not join them, since he had gone to inspect the Henderson Creek mines. The Kid was still stiff from breaking trail down the Stuart. Meyers had declined the invitation because he was absorbed in making bread rise with hops.
        - id: ch01-b20
          speaker: narrator
          text: The young men could do without Edwin. But a woman was another matter. They had not seen one all winter, and her presence seemed to open a new age. The three college men were gentlemen who longed for all the civilized pleasures they had missed. Grace must have felt a similar hunger for ease, warmth, and pleasant company. For her, that dinner was the first bright hour after many dark weeks.
    - id: ch02
      title: Grace Makes a King
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Lake's wonderful first course had barely reached the table when a loud knock sounded at the door. Parker went to answer it.
        - id: ch02-b02
          speaker: parker
          text: "Oh! Mr. Bentham, won't you come in?"
        - id: ch02-b03
          speaker: edwin_bentham
          text: "Is my wife here?"
        - id: ch02-b04
          speaker: parker
          text: "Yes. We left word with Mr. Meyers. Please join us. We saved you a place, and you're just in time for the first course."
        - id: ch02-b05
          speaker: grace_bentham
          text: "Do come in, Edwin, dear."
        - id: ch02-b06
          speaker: narrator
          text: Parker naturally stepped aside.
        - id: ch02-b07
          speaker: edwin_bentham
          text: "I want my wife."
        - id: ch02-b08
          speaker: narrator
          text: His hoarse voice made Grace sound like property. Parker nearly struck him, but clumsily held himself back. Everyone rose. Lake almost asked Grace if she truly had to leave. Instead, they all stumbled through their farewells, saying how sorry they were, how she had brightened the evening, and wishing her a pleasant journey to Dawson. Grace thanked them warmly.
        - id: ch02-b09
          speaker: narrator
          text: They helped the lamb into her jacket and sent her to the slaughter. The door slammed. The young men stared sadly at the abandoned table.
        - id: ch02-b10
          speaker: langham
          text: "Damn! Damn!"
        - id: ch02-b11
          speaker: narrator
          text: Langham's upbringing had left his curses weak and dull. He knew something was missing but could find no stronger word.
        - id: ch02-b12
          speaker: narrator
          text: A clever woman may supply an incapable man's missing strength. She can steady him when he wavers, lend him her ambition, and drive him toward things he would never achieve alone. A very clever and tactful woman can do all that without letting anyone see her hand. The man receives every bit of praise and, deep inside, believes the success was his alone. That was what Grace now did for Edwin.
        - id: ch02-b13
          speaker: narrator
          text: They reached Dawson with a little flour and several letters of introduction. Grace immediately began pushing her big baby forward. She softened the hard heart of the man who controlled the P. C. Company and won credit from him. Yet everyone believed the favor had been granted to Edwin.
        - id: ch02-b14
          speaker: narrator
          text: Grace hauled Edwin up and down creeks, over high benches and divides, and through a dozen frantic rushes to new gold strikes. Each time, the country praised Bentham's tremendous energy. She studied maps and questioned miners until she knew the ground. Then she patiently hammered the geography and the locations into his empty head. When Edwin repeated what she had taught him, people marveled at his broad understanding of the country. They did call his wife a brick, but only a wise few understood what she was doing and pitied the brave little woman.
        - id: ch02-b15
          speaker: narrator
          text: She did the work. He took the credit and the reward. A married woman in the Northwest Territory could not stake or record a mining claim. So Edwin went to the Gold Commissioner and filed Bench Claim Twenty-three, second tier, on French Hill. By April, they were washing out a thousand dollars a day, with many more rich days ahead.
        - id: ch02-b16
          speaker: narrator
          text: Eldorado Creek ran below French Hill, and Clyde Wharton's cabin stood on one of its claims. Clyde was not yet washing out a thousand dollars a day. His piles of dirt grew with every shift, though, and soon his sluice boxes would take several hundred thousand dollars from them. Still, when he sat smoking in his cabin, neither those piles nor the half-ton of gold in the company's safe appeared in his dreams.
        - id: ch02-b17
          speaker: narrator
          text: Grace often looked down from her hillside cabin while she washed tin dishes. Her dreams were not of dirt or gold either. The path to one claim crossed the path to the other, so she and Clyde met often. There was plenty to talk about during a northern spring. Even so, neither of them let a glance linger too long or allowed a careless word to reveal what was in the heart.
        - id: ch02-b18
          speaker: narrator
          text: That was how things began. Then one day Edwin treated Grace brutally. Now that he was a king of French Hill, he thought highly of himself and forgot all he owed her. Clyde heard what had happened. He waited for Grace on the trail and poured out his feelings. His words made her deeply happy, but she refused to listen and made him promise never to speak that way again. Her hour had not yet come.
        - id: ch02-b19
          speaker: narrator
          text: The sun moved north. Midnight darkness faded into the steel color of dawn. The snow slipped away, and water raced once more over gravel left by ancient ice. Then the wash-up began. Work continued through both day and night. Yellow clay and bedrock scraped clean by the miners hurried through the swift sluices, where the riffles caught the gold and forced the earth to surrender its treasure to the strong men from the Southland.
        - id: ch02-b20
          speaker: narrator
          text: In the middle of that tumult, Grace Bentham's hour arrived. Edwin was at the Forks saloon, weighing gold dust across the bar. Far too much of his gold went over that pine board. Grace came down the hill and entered Clyde Wharton's cabin. He had not expected her, but that changed nothing.
    - id: ch03
      title: A Pretty Dream
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Much misery and useless waiting might have been avoided if Father Roubeau had not seen Grace enter and turned aside from the main creek trail.
        - id: ch03-b02
          speaker: father_roubeau
          text: "My child, please listen to me."
        - id: ch03-b03
          speaker: clyde_wharton
          text: "Wait, Father Roubeau! I may not share your faith, but I respect you. Still, you won't stand between this woman and me."
        - id: ch03-b04
          speaker: father_roubeau
          text: "Do you understand what you are doing?"
        - id: ch03-b05
          speaker: clyde_wharton
          text: "Understand? Even if you were God Almighty and ready to throw me into eternal fire, I'd set my will against yours over this."
        - id: ch03-b06
          speaker: narrator
          text: Clyde had seated Grace on a stool. Now he stood in front of her, ready for battle.
        - id: ch03-b07
          speaker: clyde_wharton
          text: "Sit in that chair and keep quiet. I'll have my turn first, Father. You can have yours afterward."
        - id: ch03-b08
          speaker: narrator
          text: Father Roubeau bowed politely and sat down. He was easygoing and had learned how to wait. Clyde drew another stool beside Grace and folded her hand inside both of his.
        - id: ch03-b09
          speaker: grace_bentham
          text: "Then you truly care for me? You'll take me away?"
        - id: ch03-b10
          speaker: narrator
          text: Her face reflected Clyde's peace. It seemed she might draw close to him and find shelter there.
        - id: ch03-b11
          speaker: clyde_wharton
          text: "My dear, don't you remember what I told you before? Of course I will."
        - id: ch03-b12
          speaker: grace_bentham
          text: "But how can you leave during the wash-up?"
        - id: ch03-b13
          speaker: clyde_wharton
          text: "That doesn't trouble me. I'll put Father Roubeau in charge. I can trust him to bank the gold safely with the company."
        - id: ch03-b14
          speaker: grace_bentham
          text: "Just think. I'll never see Edwin again."
        - id: ch03-b15
          speaker: clyde_wharton
          text: "That will be a blessing."
        - id: ch03-b16
          speaker: grace_bentham
          text: "And to leave... Oh, Clyde, I can't do it. I can't!"
          emotion: fearful
        - id: ch03-b17
          speaker: clyde_wharton
          text: "Of course you can. Let me arrange everything. Once we gather a little gear, we'll start out."
        - id: ch03-b18
          speaker: grace_bentham
          text: "What if Edwin comes back?"
        - id: ch03-b19
          speaker: clyde_wharton
          text: "I'll break anyone who tries to stop us."
        - id: ch03-b20
          speaker: grace_bentham
          text: "No, Clyde! You mustn't fight him. Promise me."
          emotion: fearful
        - id: ch03-b21
          speaker: clyde_wharton
          text: "All right. I'll have the men put him off the claim. They've seen how he treats you, and they don't care for him."
        - id: ch03-b22
          speaker: grace_bentham
          text: "You can't do that either. You must not hurt him."
        - id: ch03-b23
          speaker: clyde_wharton
          text: "Then what should I do? Let him walk in and take you away while I watch?"
        - id: ch03-b24
          speaker: grace_bentham
          text: "No, I won't let him."
        - id: ch03-b25
          speaker: narrator
          text: She barely whispered the word as she gently stroked his hand.
        - id: ch03-b26
          speaker: clyde_wharton
          text: "Then leave this to me and stop worrying. I won't let anyone hurt him, though he never cared how badly you were hurt. We won't return to Dawson. I'll send word for two of the boys to outfit a boat and pole it up the Yukon. We'll cross the divide, raft down the Indian River, and meet them there. After that, we'll keep going."
        - id: ch03-b27
          speaker: grace_bentham
          text: "And then?"
        - id: ch03-b28
          speaker: narrator
          text: Her head rested on his shoulder. Their voices softened until every word became a caress. The Jesuit shifted nervously.
        - id: ch03-b29
          speaker: grace_bentham
          text: "And then?"
        - id: ch03-b30
          speaker: clyde_wharton
          text: "Then we'll pole upriver and keep going. We'll carry around White Horse Rapids and Box Canyon."
        - id: ch03-b31
          speaker: grace_bentham
          text: "Yes. What comes next?"
        - id: ch03-b32
          speaker: clyde_wharton
          text: "Then comes the Sixty-Mile River, the lakes, Chilkoot, Dyea, and salt water."
        - id: ch03-b33
          speaker: grace_bentham
          text: "But, dear, I can't pole a boat."
        - id: ch03-b34
          speaker: clyde_wharton
          text: "You little goose! I'll hire Sitka Charley. He knows the best water and camps, and he's the finest traveler I've ever met, Indian or not. You can sit in the middle of the boat, sing songs, and play Cleopatra. I was going to say you could fight mosquitoes too, but we're lucky. It's too early for them."
        - id: ch03-b35
          speaker: grace_bentham
          text: "And after that, my Antony?"
        - id: ch03-b36
          speaker: clyde_wharton
          text: "A steamer, San Francisco, and the whole world! We'll never return to this cursed hole. Think of it. We can choose anywhere. I'll sell out. We're rich! The Waldworth Syndicate will pay half a million for the gold still underground, and I have twice that in the dumps and with the company. We can visit the Paris Fair in 1900, or Jerusalem if you wish."
        - id: ch03-b37
          speaker: clyde_wharton
          text: "We'll buy an Italian palace. You may play Cleopatra as much as you like, or be Lucretia, Acte, anyone your heart chooses. I only mean that you must always be above suspicion."
        - id: ch03-b38
          speaker: grace_bentham
          text: "Caesar's wife must be above suspicion."
        - id: ch03-b39
          speaker: clyde_wharton
          text: "Of course. That is what I meant."
        - id: ch03-b40
          speaker: grace_bentham
          text: "But I won't be your wife, will I, dear?"
        - id: ch03-b41
          speaker: clyde_wharton
          text: "That isn't what I meant."
        - id: ch03-b42
          speaker: grace_bentham
          text: "You'll love me just as much, won't you? You'll never begin to think differently of me? Oh, I know how men are. You'll grow tired of me, and then you won't want me anymore."
        - id: ch03-b43
          speaker: clyde_wharton
          text: "How can you say that? I could never grow tired of you."
        - id: ch03-b44
          speaker: grace_bentham
          text: "Promise me."
        - id: ch03-b45
          speaker: clyde_wharton
          text: "Yes. I promise."
        - id: ch03-b46
          speaker: grace_bentham
          text: "You say it so easily. How can either of us be sure? I have so little to offer, but it is everything I have. Oh, Clyde, promise you won't grow tired of me."
        - id: ch03-b47
          speaker: clyde_wharton
          text: "Don't begin doubting me now. Until death parts us, you know."
        - id: ch03-b48
          speaker: grace_bentham
          text: "Think of it. I once said those words to Edwin, and now..."
        - id: ch03-b49
          speaker: clyde_wharton
          text: "And now, sweetheart, you must stop troubling yourself with such thoughts. Of course I will never leave you."
        - id: ch03-b50
          speaker: narrator
          text: For the first time, their trembling lips met. Father Roubeau had been watching the main trail through the window. At last, he could bear the strain no longer. He cleared his throat and turned around.
        - id: ch03-b51
          speaker: clyde_wharton
          text: "Your turn now, Father!"
        - id: ch03-b52
          speaker: narrator
          text: Clyde's face still burned from that first kiss, and triumph rang in his voice as he yielded the floor. He had no doubt about what would happen. Neither did Grace. A smile touched her mouth as she faced the priest.
    - id: ch04
      title: The Priestly Prerogative
      blocks:
        - id: ch04-b01
          speaker: father_roubeau
          text: "My child, my heart aches for you. It is a lovely dream, but you cannot follow it."
          emotion: sad
        - id: ch04-b02
          speaker: grace_bentham
          text: "Why not, Father? I have said yes."
        - id: ch04-b03
          speaker: father_roubeau
          text: "You did not understand what you were doing. You forgot the oath you made before God to the man who is still your husband. I must help you see how sacred that promise is."
        - id: ch04-b04
          speaker: grace_bentham
          text: "What if I understand and still refuse?"
        - id: ch04-b05
          speaker: father_roubeau
          text: "Then you must answer to God."
        - id: ch04-b06
          speaker: grace_bentham
          text: "Which God? My husband has a God I do not wish to worship. There must be many gods like that."
          emotion: angry
        - id: ch04-b07
          speaker: father_roubeau
          text: "Child, take those words back! You cannot mean them. I understand. I have known such moments too."
        - id: ch04-b08
          speaker: narrator
          text: For one instant, he returned in memory to France. A wistful face with sad eyes rose like mist between him and Grace.
        - id: ch04-b09
          speaker: grace_bentham
          text: "Then has my God abandoned me? I am no more wicked than other women. Life with Edwin has brought me terrible misery. Why should I accept more of it? Why shouldn't I reach for happiness? I cannot go back to him. I will not!"
          emotion: angry
        - id: ch04-b10
          speaker: father_roubeau
          text: "It is you who have abandoned God. Go back. Give Him your burden, and the darkness will lift. Oh, my child, let Him carry this pain."
        - id: ch04-b11
          speaker: grace_bentham
          text: "No. This is useless. I have chosen my path, and I will follow it. If God punishes me, somehow I will endure it. You cannot understand. You are not a woman."
        - id: ch04-b12
          speaker: father_roubeau
          text: "My mother was a woman."
        - id: ch04-b13
          speaker: grace_bentham
          text: "But that is not the same."
        - id: ch04-b14
          speaker: father_roubeau
          text: "And Christ was born of a woman."
        - id: ch04-b15
          speaker: narrator
          text: Grace had no answer. Silence filled the cabin. Clyde pulled impatiently at his mustache and watched the trail. Grace leaned on the table with her face firmly set. Her smile was gone. Father Roubeau tried another path.
        - id: ch04-b16
          speaker: father_roubeau
          text: "Do you have children?"
        - id: ch04-b17
          speaker: grace_bentham
          text: "Once I wanted them. But now, no. And I am thankful."
        - id: ch04-b18
          speaker: father_roubeau
          text: "Do you have a mother?"
        - id: ch04-b19
          speaker: grace_bentham
          text: "Yes, my mother loves me."
        - id: ch04-b20
          speaker: father_roubeau
          text: "Does she love you?"
        - id: ch04-b21
          speaker: grace_bentham
          text: "Yes, I have a sister."
        - id: ch04-b22
          speaker: father_roubeau
          text: "And a brother? No, never mind. He is a man. Do you have a sister?"
        - id: ch04-b23
          speaker: narrator
          text: Grace lowered her head and whispered that she did.
        - id: ch04-b24
          speaker: father_roubeau
          text: "Is she much younger than you?"
        - id: ch04-b25
          speaker: grace_bentham
          text: "Seven years."
        - id: ch04-b26
          speaker: father_roubeau
          text: "Have you thought carefully about your mother and sister? Your sister is just entering womanhood. What you do may change much for her. Could you stand before her, look into her young face, hold her hand, or touch your cheek to hers?"
        - id: ch04-b27
          speaker: narrator
          text: His words made the images blaze in Grace's mind. She shrank from them like a wolf-dog from a whip.
        - id: ch04-b28
          speaker: grace_bentham
          text: "Stop! Please stop!"
          emotion: fearful
        - id: ch04-b29
          speaker: father_roubeau
          text: "You must face these things. Better to face them now."
        - id: ch04-b30
          speaker: narrator
          text: She could not see the deep compassion in his eyes. His tight, trembling face showed no sign that he would give way. Grace lifted her head from the table, forced back her tears, and fought for control.
        - id: ch04-b31
          speaker: grace_bentham
          text: "I will go away. My family will never see me, and in time they will forget. To them, I will be dead. And I will go with Clyde today."
        - id: ch04-b32
          speaker: narrator
          text: Her answer sounded final. Clyde stepped toward her, but Father Roubeau waved him back.
        - id: ch04-b33
          speaker: father_roubeau
          text: "You have wanted children?"
        - id: ch04-b34
          speaker: narrator
          text: Grace silently answered yes.
        - id: ch04-b35
          speaker: father_roubeau
          text: "And you prayed for them?"
        - id: ch04-b36
          speaker: grace_bentham
          text: "I have prayed for them often."
        - id: ch04-b37
          speaker: father_roubeau
          text: "Have you considered what would happen if you had a child?"
        - id: ch04-b38
          speaker: narrator
          text: The priest glanced toward Clyde by the window. Hope flashed across Grace's face. Then she understood his meaning and raised one hand in appeal, but he continued.
        - id: ch04-b39
          speaker: father_roubeau
          text: "Can you imagine an innocent baby in your arms? Suppose it were a boy. The world is not as cruel to a girl. Could you look at other children and still feel proud and happy for your son? Even the milk in your breast would turn bitter."
        - id: ch04-b40
          speaker: grace_bentham
          text: "Have pity! Please be quiet!"
          emotion: fearful
        - id: ch04-b41
          speaker: father_roubeau
          text: "He would be made to bear the blame for what you had done."
        - id: ch04-b42
          speaker: grace_bentham
          text: "Don't! I will go back!"
          emotion: fearful
        - id: ch04-b43
          speaker: narrator
          text: She had fallen at his feet.
        - id: ch04-b44
          speaker: father_roubeau
          text: "A child could grow up innocent, until one day the world threw a cruel name in his face. He could look back and curse the mother who gave him life."
        - id: ch04-b45
          speaker: grace_bentham
          text: "Oh, my God! My God!"
          emotion: fearful
        - id: ch04-b46
          speaker: narrator
          text: Grace lay on the floor. Father Roubeau sighed and helped her stand. Clyde came forward, but she motioned him away. Tears streamed down her face, and she made no effort to wipe them.
        - id: ch04-b47
          speaker: grace_bentham
          text: "Don't come near me, Clyde. I am going back."
          emotion: sad
        - id: ch04-b48
          speaker: clyde_wharton
          text: "After all this? You can't go. I won't allow it!"
          emotion: angry
        - id: ch04-b49
          speaker: grace_bentham
          text: "Don't touch me!"
          emotion: fearful
        - id: ch04-b50
          speaker: narrator
          text: She shivered and drew away.
        - id: ch04-b51
          speaker: clyde_wharton
          text: "I will touch you! You're mine! Do you hear me? Mine!"
          emotion: angry
        - id: ch04-b52
          speaker: narrator
          text: Clyde spun toward the priest.
        - id: ch04-b53
          speaker: clyde_wharton
          text: "What a fool I was to let you wag your silly tongue. Thank your God you're a priest, or I would strike you down. So this is your priestly privilege, is it? Well, you've used it. Now leave my cabin before I forget what you are!"
          emotion: angry
        - id: ch04-b54
          speaker: narrator
          text: Father Roubeau bowed, took Grace's hand, and moved toward the door. Clyde blocked them.
        - id: ch04-b55
          speaker: clyde_wharton
          text: "Grace, you said you loved me."
        - id: ch04-b56
          speaker: grace_bentham
          text: "I did."
        - id: ch04-b57
          speaker: clyde_wharton
          text: "Do you love me now?"
        - id: ch04-b58
          speaker: grace_bentham
          text: "I do."
        - id: ch04-b59
          speaker: clyde_wharton
          text: "Say it once more."
        - id: ch04-b60
          speaker: grace_bentham
          text: "I do love you, Clyde. I do."
          emotion: sad
        - id: ch04-b61
          speaker: clyde_wharton
          text: "There, Father! You heard her. With those words still on her lips, you would send her back to live a lie and a hell with that man?"
          emotion: angry
        - id: ch04-b62
          speaker: narrator
          text: Father Roubeau hurried Grace into the inner room and shut the door. Then he took an easy pose on a stool.
        - id: ch04-b63
          speaker: father_roubeau
          text: "Not one word. Remember, for her sake."
        - id: ch04-b64
          speaker: narrator
          text: A rough knock shook the cabin. The latch lifted, and Edwin Bentham entered.
        - id: ch04-b65
          speaker: edwin_bentham
          text: "Have either of you seen my wife?"
        - id: ch04-b66
          speaker: narrator
          text: After the greetings, both men shook their heads.
        - id: ch04-b67
          speaker: edwin_bentham
          text: "I found her tracks coming down from our cabin. They disappeared from the main trail right across from here. I thought she might have turned in here."
        - id: ch04-b68
          speaker: narrator
          text: His listeners looked bored.
        - id: ch04-b69
          speaker: clyde_wharton
          text: "She was here!"
          emotion: angry
        - id: ch04-b70
          speaker: narrator
          text: The priest stopped him with a look.
        - id: ch04-b71
          speaker: father_roubeau
          text: "Did you see her tracks turn toward this cabin, my son?"
        - id: ch04-b72
          speaker: narrator
          text: Father Roubeau had carefully erased those tracks when he came up the same path an hour earlier.
        - id: ch04-b73
          speaker: edwin_bentham
          text: "I didn't stop to look closely."
        - id: ch04-b74
          speaker: narrator
          text: Edwin stared suspiciously at the inner door, then questioned the priest with his eyes. Father Roubeau shook his head, but Edwin's doubt remained. The priest offered a swift, silent prayer and stood.
        - id: ch04-b75
          speaker: father_roubeau
          text: "If you doubt my word, then perhaps you should look inside."
        - id: ch04-b76
          speaker: narrator
          text: He reached as if to open the inner door. Edwin had often heard that a priest could not lie, and he believed it.
        - id: ch04-b77
          speaker: edwin_bentham
          text: "Of course I don't doubt you, Father. I only wondered where Grace went. I suppose she's visiting Mrs. Stanton on French Gulch. Fine weather, isn't it? Have you heard the news? Flour is down to forty dollars a hundred, and they say newcomers are pouring downriver in crowds. But I must go. Good-bye."
        - id: ch04-b78
          speaker: narrator
          text: The door slammed behind him.
    - id: ch05
      title: The Lie and the Penance
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: A few weeks later, just after the June high water, two men drove a canoe into midstream and tied it to a drifting pine. The rope tightened, and the log pulled the light canoe like a towboat.
        - id: ch05-b02
          speaker: narrator
          text: Father Roubeau had been ordered out of the Upper Country and back to his Native flock at Minook. White men had arrived among them, and they were spending too little time fishing and too much time worshiping a certain god that lived briefly in countless black bottles. Malemute Kid had business downriver as well, so the two friends traveled together.
        - id: ch05-b03
          speaker: narrator
          text: Only one person in all the North knew Paul Roubeau simply as a man, and that was Malemute Kid. Before the Kid alone, the priest could lay aside his sacred office and expose his heart. The two men truly knew each other. They had shared their last scrap of fish, their last pinch of tobacco, and the last private thoughts hidden within them. Side by side, they had crossed the empty shores of Bering Sea and wandered the cruel maze of the Great Delta. They had also endured the terrible winter journey from Point Barrow to the Porcupine. After all that, there was little either man could hide from the other.
        - id: ch05-b04
          speaker: narrator
          text: Now Father Roubeau drew heavily on his trail-worn pipe. He watched the red disk of the sun rest darkly at the edge of the northern horizon while the current carried them on. Malemute Kid took out his watch and wound it. The hands showed midnight, though the sun still hung before them.
        - id: ch05-b05
          speaker: malemute_kid
          text: "Cheer up, old friend. God will surely forgive a lie like that. Listen to the words of a man who speaks true. If a woman has trusted you with a word, seal your lips. The man who reveals her secret carries the brand of a dog. If trouble threatens her, and the blackest lie can set her free, then lie as long as your lips can move and one living man can hear."
        - id: ch05-b06
          speaker: narrator
          text: Father Roubeau took the pipe from his mouth and considered the words.
        - id: ch05-b07
          speaker: father_roubeau
          text: "The man speaks truly, but the lie is not what troubles my soul. The lie and its penance are matters between God and me. But..."
        - id: ch05-b08
          speaker: malemute_kid
          text: "Then what is it? Your hands are clean."
        - id: ch05-b09
          speaker: father_roubeau
          text: "No, Kid. I have thought about it again and again, but the truth remains. I knew what waited for her, and I made her go back."
          emotion: sad
        - id: ch05-b10
          speaker: narrator
          text: A robin's clear note rang from the wooded bank. Far away, a partridge beat out its call, and a moose splashed heavily through an eddy. The two men smoked on in silence.
