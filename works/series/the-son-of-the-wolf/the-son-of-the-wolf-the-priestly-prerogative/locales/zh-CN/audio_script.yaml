audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静克制，带着北国故事的冷峻与悲悯
        timbre: 温厚清晰，略带风霜感
        pace: 舒缓而有张力
        pitch: 中低
    langham:
      display_name: 兰厄姆
      tts:
        delivery: 讲究体面，忙乱时急躁，感叹时笨拙直率
        timbre: 明亮厚实
        pace: 中等偏快
        pitch: 中
    parker:
      display_name: 帕克
      tts:
        delivery: 殷勤有礼，遇到粗鲁时压着怒气
        timbre: 清朗稳健
        pace: 中等
        pitch: 中
    lake:
      display_name: 莱克
      tts:
        delivery: 热心活泼，忙起来带着少爷式的急切
        timbre: 年轻清亮
        pace: 明快
        pitch: 中
    sandy:
      display_name: 桑迪
      tts:
        delivery: 忠顺谨慎，夹在几位主人之间略显为难
        timbre: 朴实温和
        pace: 中等
        pitch: 中低
    edwin_bentham:
      display_name: 埃德温·本瑟姆
      tts:
        delivery: 自私傲慢，粗声说话时带着占有欲
        timbre: 浑厚却虚浮
        pace: 中等
        pitch: 中低
    grace_bentham:
      display_name: 格蕾丝·本瑟姆
      tts:
        delivery: 温柔坚韧，动摇时克制而颤抖
        timbre: 清柔细致
        pace: 舒缓，激动时略快
        pitch: 中高
    host_voice_1:
      display_name: 席间青年甲
      tts:
        delivery: 真诚惋惜，礼貌中带着慌乱
        timbre: 年轻清晰
        pace: 明快
        pitch: 中
    host_voice_2:
      display_name: 席间青年乙
      tts:
        delivery: 热情殷勤，告别时恋恋不舍
        timbre: 温和明亮
        pace: 中等
        pitch: 中
    clyde_wharton:
      display_name: 克莱德·沃顿
      tts:
        delivery: 热烈自信，愤怒时强硬急迫
        timbre: 深厚有力
        pace: 中等偏快
        pitch: 中低
    father_roubeau:
      display_name: 鲁博神父
      tts:
        delivery: 慈爱诚实，言语简洁庄重
        timbre: 柔和低沉
        pace: 舒缓
        pitch: 低
    malamute_kid:
      display_name: 玛拉缪特小子
      tts:
        delivery: 寡言沉着，温和中有坚忍
        timbre: 深厚清朗
        pace: 从容稳健
        pitch: 低
  chapters:
    - id: ch01
      title: 漂泊者
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "这个故事里，有个男人从不懂得珍惜妻子，也有个女人把自己给了他，给他的荣耀远超过他配得的。故事还牵涉一位从没被人见过说谎的耶稣会神父。北地少不了神父，而且万万少不得。至于另外两个人，他们的出现纯属偶然，只是淘金潮托在浪头上卷来，又拖在潮尾带来的古怪漂泊者。"
        - id: ch01-b02
          speaker: narrator
          text: "九七年的淘金大潮早已顺育空河涌进饥荒中的道森，埃德温和格蕾丝·本瑟姆却还落在后头。大河盖上三英尺厚的冰，像打烊一般睡去时，夫妻俩才走到五指急流。黄金城仍在北方，隔着许多个露宿之夜。"
        - id: ch01-b03
          speaker: narrator
          text: "那年秋天，当地宰过大批牛，废弃的骨头、内脏和牛皮堆成了山。同行的三个人盯着那堆废料，心里算了几笔，立刻看出一座富矿，决定留下。整个冬天，他们都把骨头和冻硬的牛皮装进袋子，卖给饥饿的狗队。无论骨头还是皮，不作处理，原样称重，一磅都卖一美元，这便是他们所谓的公道价。半年后，太阳回来，大河苏醒，他们束紧沉甸甸的钱带回了南方。直到今天，他们还住在那里，吹嘘自己从未见过的克朗代克。"
        - id: ch01-b04
          speaker: narrator
          text: "埃德温生性懒散，要不是妻子在身边，他一定会欣然留下，跟那三个人合伙做狗粮生意。格蕾丝却看准了他的虚荣，夸他多么高大，多么强壮，说像他这样的男子汉一定能跨过所有障碍，稳稳取得传说中的金羊毛。他这才绷紧下巴，摆出坚定的样子，卖掉自己那份骨头和牛皮，换来一架雪橇和一条狗，踏着雪鞋向北走去。"
        - id: ch01-b05
          speaker: narrator
          text: "格蕾丝的雪鞋从没让丈夫的脚印在前面冷下来。苦路还没走三天，已经变成她在前头破雪，他落在后面。只要远处有人影出现，两人立刻调换位置。寂静雪道上的旅人像幽灵一般来去，在他们眼里，埃德温的男子气概便没受过半点损伤。世上就是有这样的男人。至于这样的男人和这样的女人为什么会结婚，还发誓无论顺境逆境都相守，最好别深究。这类事情见得太多，追问得过细，反倒容易失去对‘天作之合’的美好信念。"
        - id: ch01-b06
          speaker: narrator
          text: "埃德温只是一个误装进成人身体的孩子。他能平静地扯掉蝴蝶的翅膀，也能被一个不到他一半块头的精瘦汉子吓得发抖。他自私爱哭，成年人的身量和胡髭遮着他，外面只薄薄涂了一层教养和礼俗。他是俱乐部里的人，也是社交场上的人物，能为宴会增光，能带着难以形容的魅力和热忱说尽废话。他夸起口来惊天动地，也能为牙痛掉眼泪。这样的男人一旦结婚，足以把妻子的生活变成地狱，甚至比最无耻的浪荡子更狠。我们天天碰见他们，却很少看清真面目。要认清这种人，除了嫁给他，最好的办法便是同锅吃、同毯睡。一个星期足够了，一天也不必多。"
        - id: ch01-b07
          speaker: narrator
          text: "格蕾丝看起来纤细得像个少女，真正认识她，才会发现她的灵魂远比旁人高大，同时又保有女性天性里的一切。她一路鼓励丈夫，没人时替他开路，却会躲起来，为自己柔弱的身体落泪。夫妻俩走过古老的塞尔扣克堡，又穿越一百英里阴沉荒野。短暂的白昼消逝以后，埃德温倒在雪里哭泣。格蕾丝只得把他绑上雪橇，咬住嘴唇忍着四肢的疼，帮那条狗把他一路拖到玛拉缪特小子的木屋。"
        - id: ch01-b08
          speaker: narrator
          text: "玛拉缪特小子那时不在家，德国商人迈耶斯接下了照料客人的事。他给夫妻俩煎了厚厚的大块驼鹿肉，又把新鲜松枝抖松，铺成一张带着林木香气的床。莱克、兰厄姆和帕克听说木屋里来了一个女人，兴奋得再自然不过，立刻为准备晚餐忙得不可开交。"
        - id: ch01-b09
          speaker: langham
          text: "桑迪！你到底分不分得出上腰肉和后腿肉？先别管了，快来贮藏室帮我搬这些冻肉！"
        - id: ch01-b10
          speaker: parker
          text: "桑迪，你不许离开那些盘子。桌子不收干净，我怎么和饼干面？"
        - id: ch01-b11
          speaker: lake
          text: "桑迪，帮个忙，快去密苏里营地借点肉桂。用不了多久。"
        - id: ch01-b12
          speaker: narrator
          text: "贮藏室里忽然传来肉块和箱子落地的巨响，兰厄姆的催促戛然而止。桑迪左右为难，最后想起自己终究是兰厄姆的仆人，只好带着歉意丢下抹布，赶去救主人。"
        - id: ch01-b13
          speaker: narrator
          text: "三位有钱少爷各自带着仆人来北地争取荣誉，另外两个仆人偏偏去了白河，寻找传说中的石英矿。桑迪只得伺候三位各有烹饪高见的主人。那天上午，营地两次险些决裂，好在总有人肯让一步。最后，那顿精致晚餐总算完成。"
        - id: ch01-b14
          speaker: narrator
          text: "三人用一局三人混战的‘割喉牌’消除争端，也决定由谁去执行请客这个重要任务。帕克赢了，便从正中分好头发，戴上手套和熊皮帽，到玛拉缪特小子的木屋请来格蕾丝和小子。格蕾丝很遗憾丈夫不能同来，因为埃德温去了亨德森溪看矿。小子刚沿斯图尔特河破雪回来，身体还有些僵硬。迈耶斯则忙着试验用啤酒花发面，也谢绝了邀请。"
        - id: ch01-b15
          speaker: narrator
          text: "少一个丈夫不算什么。可一个女人，他们整整一个冬天都没见过了。这一位客人的到来，简直预告生活要揭开新的一页。三个年轻人受过大学教育，又都是绅士，早就想念被北地夺走的舒适文明生活。格蕾丝大概也有同样的饥渴。对她来说，这顿晚餐是连续许多星期黑暗之后，第一个真正明亮的时辰。可多才多艺的莱克亲手做出的绝妙头盘才上桌，门便被人重重敲响。"
        - id: ch01-b16
          speaker: parker
          text: "本瑟姆先生？请进。我们给迈耶斯先生留过话，也替你留了位子。你来得正好，第一道菜才刚端上来。"
        - id: ch01-b17
          speaker: edwin_bentham
          text: "我妻子在这里吗？"
        - id: ch01-b18
          speaker: grace_bentham
          text: "在这里呢，埃德温。进来吧。"
        - id: ch01-b19
          speaker: edwin_bentham
          text: "我要带我妻子走。"
        - id: ch01-b20
          speaker: narrator
          text: "他声音沙哑，那口气像在索取自己的财物。帕克差点一拳打上去，好不容易才忍住。众人全站起来，慌乱地开始告别。"
        - id: ch01-b21
          speaker: host_voice_1
          text: "你能来真是太好了，这么快就走，实在叫人遗憾。"
        - id: ch01-b22
          speaker: host_voice_2
          text: "你一来，屋里都亮堂了。祝你们去道森一路顺利。"
        - id: ch01-b23
          speaker: grace_bentham
          text: "太谢谢你们了。"
        - id: ch01-b24
          speaker: narrator
          text: "众人替羔羊穿上外套，眼看她被领去受宰。门一关，他们只能望着空下来的餐桌。"
        - id: ch01-b25
          speaker: langham
          text: "该死！真是该死！"
          emotion: angry
        - id: ch01-b26
          speaker: narrator
          text: "兰厄姆小时候所受的训练有些欠缺，骂人的话既无力又单调。他知道‘该死’这两个字还远远不够，苦苦搜寻，却怎么也找不到一句更有男子气概的骂词。一个聪明而坚韧的女人，能用自己的百折不挠填满无能丈夫身上的缺口，支撑他摇摆不定的性情，把自己的雄心灌进他的灵魂，再推着他成就大事。若她还做得极其隐秘，让丈夫独占所有功劳，并从心底相信一切都靠自己，那就更需要非凡的智慧和手腕。"
        - id: ch01-b27
          speaker: narrator
          text: "格蕾丝到了道森，手里只有几磅面粉和几封介绍信，却立刻开始把自己的大婴儿推到人前。太平洋商业公司那位掌权的蛮汉铁石心肠，是她设法软化了他，又从他手里讨来赊账资格，名义上的好处却给了埃德温。是她拖着丈夫走遍溪谷、阶地和分水岭，追赶十几场疯狂的淘金潮，大家却只夸埃德温精力旺盛。也是她研究地图，逐个询问矿工，再把地理和矿址敲进他的空脑袋，大家又惊叹他眼界广、熟悉当地。人们当然也夸他的妻子了不起，可只有少数聪明人真正看懂格蕾丝，并为这个勇敢的小女人感到难过。"
        - id: ch01-b28
          speaker: narrator
          text: "活由她做，名声和报酬却全归他。西北地区的规矩不准已婚女人圈占或登记溪谷矿、阶地矿和石英矿。于是埃德温走进黄金专员办事处，把法国山第二层阶地的二十三号矿权登记在自己名下。四月到来时，他们每天都能从那片地里洗出一千美元。而眼前的矿藏明明白白告诉他们，这样的日子往后还有许多许多。"
        - id: ch01-b29
          speaker: narrator
          text: "法国山脚下是黄金溪，克莱德·沃顿的木屋就立在溪边的矿权地上。眼下他还不能每天洗出一千美元，可矿砂堆一班一班地长高。总有一天，那些矿砂送进淘洗槽，五六天便能在格条间留下几十万美元。沃顿常坐在木屋里抽烟斗，做着美丽的小梦。梦里没有矿砂堆，也没有公司保险柜中的半吨金沙。格蕾丝在山坡木屋里洗着白铁盘子，常常也朝黄金溪望去，她梦见的同样不是矿砂，也不是金子。"
        - id: ch01-b30
          speaker: narrator
          text: "通往两处矿地的路彼此交叉，两人常常相遇。北地春天有许多话可谈，他们谈了许多，却从没借一道目光或一次失言透露过真心。直到有一天，埃德温粗暴地对待妻子。男孩子都会做出这种事，何况他如今自认是法国山的王，越来越看重自己，早把欠妻子的一切忘在脑后。沃顿听说后半路拦住格蕾丝，激动得说了许多越界的话。她心里很欢喜，却拒绝听下去，还逼他答应以后不再说。属于她的时辰还没有到。"
        - id: ch01-b31
          speaker: narrator
          text: "太阳重新踏上北行的路，午夜的黑变成黎明的钢灰，积雪悄悄退去，流水再次冲过冰川留下的碎石，淘洗季节开始了。黄泥和刮净的河床泥沙日夜冲过飞快的淘洗槽，把赎金一般的金子交给南方来的强壮汉子。就在这片忙乱和喧嚣中，格蕾丝的时辰终于到了。我们每个人都会遇上这样的软弱时刻，除非生性太过麻木。有些人一向品行端正，并不是因为热爱美德，也许只是懒得去作恶。真正尝过软弱滋味的人，自然会明白。"
    - id: ch02
      title: 格蕾丝的时辰
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "埃德温正在岔口酒馆的松木吧台上称金沙，他实在送了太多金子越过那块木板。格蕾丝走下山，悄悄进了沃顿的木屋。沃顿没料到她会来，可事情已经不可挽回。偏偏鲁博神父看见她进门，也从主路拐了过来。"
        - id: ch02-b02
          speaker: father_roubeau
          text: "我的孩子……"
        - id: ch02-b03
          speaker: clyde_wharton
          text: "先等一等，鲁博神父。我不信你的教，可我尊重你。不过，你不能挡在这个女人和我之间。"
        - id: ch02-b04
          speaker: father_roubeau
          text: "你明白自己正在做什么吗？"
        - id: ch02-b05
          speaker: clyde_wharton
          text: "我当然明白。哪怕你是全能的上帝，正准备把我扔进永火，我也会拿自己的意志跟你赌到底。请你坐下，先别说话。现在由我来讲，等我讲完再轮到你。"
        - id: ch02-b06
          speaker: narrator
          text: "沃顿把格蕾丝安置在一张凳子上，自己带着敌意站在她前面，像要挡住世上一切来人。神父却只是彬彬有礼地欠身，依言坐到椅子上。他一向性情随和，也早已在北地学会耐心等待自己的时机。沃顿又把一张凳子拉到格蕾丝身旁坐下，用双手把她的手严严实实裹在掌心。"
        - id: ch02-b07
          speaker: grace_bentham
          text: "这么说，你真的在乎我，也愿意带我离开？"
        - id: ch02-b08
          speaker: narrator
          text: "格蕾丝抬头看着沃顿。她自己的神色原本还在动荡，这时却仿佛映出了这个男人脸上的安宁。她只想靠近他一些，把多年来没有得到的庇护，暂时从他的肩膀上找到。"
        - id: ch02-b09
          speaker: clyde_wharton
          text: "亲爱的，你忘了我以前说过什么吗？我当然愿意。矿砂淘洗算不了什么，我可以把工作交给鲁博神父，请他把金沙存进公司。"
        - id: ch02-b10
          speaker: grace_bentham
          text: "这么一走，我就永远见不到埃德温了。可是，克莱德，我还是害怕。我做不到。万一他回来呢？"
        - id: ch02-b11
          speaker: clyde_wharton
          text: "见不到他才是福气。别害怕，让我来安排。我们只要收拾几件行李，马上就可以动身。他要是回来，我本来真想打断他身上的每一根骨头。既然你不许打架，我就叫伙计们把他赶出矿地。大家都亲眼见过他怎样待你，没有人喜欢他，也不会有人肯替他说话。"
        - id: ch02-b12
          speaker: grace_bentham
          text: "不许打架，也不许伤害他。答应我。"
        - id: ch02-b13
          speaker: clyde_wharton
          text: "好，我保证不伤他。他可从没在乎你会不会受伤。我们也不回道森。我会派两个伙计备好船，从育空河撑上来。咱们翻过分水岭，扎木筏沿印第安河而下，途中和他们会合。"
        - id: ch02-b14
          speaker: grace_bentham
          text: "然后呢？"
        - id: ch02-b15
          speaker: narrator
          text: "格蕾丝靠上他的肩。两人的声音越来越轻，每句话都像爱抚。神父不安地挪了挪身体。"
        - id: ch02-b16
          speaker: clyde_wharton
          text: "然后我们撑着船，一直向上，再向上。到了白马急流和箱形峡谷，就把船搬上岸，从陆路绕过去。接着走六十英里河，穿过一个又一个湖，再翻过奇尔库特，抵达戴伊。走到那里，咸水海岸就在眼前了。"
        - id: ch02-b17
          speaker: grace_bentham
          text: "可我不会撑船呀。"
        - id: ch02-b18
          speaker: clyde_wharton
          text: "小傻瓜，我会找锡特卡·查利。他熟悉每一段好走的水道，也知道最合适的营地。虽说他是个印第安人，却是我见过最好的旅伴。你什么重活也不用做，只要坐在船中央唱歌，扮演克娄巴特拉，再跟蚊子作战。啊，不，那时还太早，蚊子还没有出来，我们连这一仗也省了。"
        - id: ch02-b19
          speaker: grace_bentham
          text: "再然后呢，我的安东尼？"
        - id: ch02-b20
          speaker: clyde_wharton
          text: "然后坐轮船去旧金山，去整个世界，再也不回这个鬼地方。我要卖掉矿权。地下剩的部分能卖五十万，矿砂堆和公司里还存着两倍的钱。我们很富有。咱们去看一九〇〇年的巴黎博览会，你愿意的话，还能去耶路撒冷。"
        - id: ch02-b21
          speaker: clyde_wharton
          text: "我们会买一座意大利宫殿。你想做克娄巴特拉、卢克蕾提娅、阿克特，或者任何人，都随你的心意。只是你千万不能……"
        - id: ch02-b22
          speaker: grace_bentham
          text: "恺撒的妻子不该受人怀疑。可我不会是你的妻子，对吗？你会一直爱我吗？我知道男人会变，你也许会厌倦我……"
        - id: ch02-b23
          speaker: clyde_wharton
          text: "你怎么会这样想？我不会。"
        - id: ch02-b24
          speaker: grace_bentham
          text: "答应我。你答应得那么容易，可你怎么知道？我又怎么知道？我能给你的东西很少，却是我的全部。克莱德，答应我永远不会厌倦。"
        - id: ch02-b25
          speaker: clyde_wharton
          text: "还没走，你怎么就先怀疑起来？我答应你。直到死亡把我们分开。"
        - id: ch02-b26
          speaker: grace_bentham
          text: "我从前也对他许过同样的誓，现在却成了这样。"
        - id: ch02-b27
          speaker: clyde_wharton
          text: "小宝贝，从今以后，你不必再想那些事。我永远不会变。"
        - id: ch02-b28
          speaker: narrator
          text: "他们的嘴唇第一次颤抖着贴在一起。鲁博神父一直从窗边望着主路，终于再也忍不住。他清清嗓子，转过身来。"
        - id: ch02-b29
          speaker: clyde_wharton
          text: "现在轮到你了，神父。"
        - id: ch02-b30
          speaker: narrator
          text: "初吻烧红了沃顿的脸。他让出位置时，声音里满是胜利。沃顿对结果没有怀疑，格蕾丝也没有。她面向神父，嘴边还带着笑。"
    - id: ch03
      title: 神父的特权
      blocks:
        - id: ch03-b01
          speaker: father_roubeau
          text: "我的孩子，我的心在为你流血。这个梦很美，却不能实现。"
          emotion: sad
        - id: ch03-b02
          speaker: grace_bentham
          text: "为什么不能？我已经答应跟他走。"
        - id: ch03-b03
          speaker: father_roubeau
          text: "你答应时并不知道自己做了什么。你曾在上帝面前向丈夫立誓。现在，我必须让你看见那句誓言有多神圣。"
        - id: ch03-b04
          speaker: grace_bentham
          text: "如果我明白以后，还是不肯回去呢？"
        - id: ch03-b05
          speaker: father_roubeau
          text: "那么，上帝会……"
        - id: ch03-b06
          speaker: grace_bentham
          text: "哪一个上帝？我丈夫也有一个上帝，可我不愿敬拜。这样的上帝一定还有很多。"
        - id: ch03-b07
          speaker: father_roubeau
          text: "孩子，收回这句话。你不是真心这样说。我明白，因为我也有过这样的时刻。"
        - id: ch03-b08
          speaker: narrator
          text: "有那么一瞬，他像是回到故乡法国。一张忧伤而满含眷恋的脸从记忆里升起，隔着雾气浮现在他眼前，横在他和格蕾丝之间。原来，这位神父也曾有过自己的软弱时刻。"
        - id: ch03-b09
          speaker: grace_bentham
          text: "神父，难道我的上帝抛弃了我？我并不比别的女人更坏，跟埃德温在一起却已经受了太多苦。为什么还要受更多？我为什么不能抓住幸福？我不会回去，绝不回去。"
          emotion: angry
        - id: ch03-b10
          speaker: father_roubeau
          text: "是你抛弃了上帝。回去吧，把重担交给祂，黑暗便会散去。"
        - id: ch03-b11
          speaker: grace_bentham
          text: "没有用了。我选好了自己的路，就会沿着它走下去。上帝若惩罚我，我也会承受。你不会懂，因为你不是女人。"
        - id: ch03-b12
          speaker: father_roubeau
          text: "我的母亲是女人，基督也由女人所生。"
        - id: ch03-b13
          speaker: narrator
          text: "格蕾丝不再回答，屋里陷入一阵沉默。沃顿焦躁地捻着胡髭，一只眼睛仍戒备地盯着外面的路。格蕾丝把手肘支在桌上，脸上的决心没有动摇，刚才那点幸福的笑却已经完全消失。鲁博神父看在眼里，知道正面劝说没有用，便换了一个方向。"
        - id: ch03-b14
          speaker: father_roubeau
          text: "你有孩子吗？"
        - id: ch03-b15
          speaker: grace_bentham
          text: "从前盼望过，可现在没有。我反而庆幸。"
        - id: ch03-b16
          speaker: father_roubeau
          text: "你的母亲还在吗？她爱你吗？"
        - id: ch03-b17
          speaker: grace_bentham
          text: "还在。她爱我。"
        - id: ch03-b18
          speaker: father_roubeau
          text: "你还有兄弟吗？算了，他是男人。那妹妹呢？"
        - id: ch03-b19
          speaker: grace_bentham
          text: "有一个妹妹。她比我小七岁。"
        - id: ch03-b20
          speaker: father_roubeau
          text: "你认真想过她们吗？想过母亲，也想过那个刚走到女人一生门槛前的妹妹吗？你今天的选择，也许会改变她的一生。以后你还能站到她面前，看着那张年轻的脸，握住她的手，把脸颊贴在她脸上吗？"
        - id: ch03-b21
          speaker: narrator
          text: "神父每说一句，格蕾丝脑中便多出一幅清楚的画面。她看见母亲，也看见年轻的妹妹，看见自己再不能握那只手，再不能把脸颊贴上那张清新的脸。她终于承受不住，像挨鞭子的狼犬一样缩向旁边。"
        - id: ch03-b22
          speaker: grace_bentham
          text: "别说了！求你别再说了！"
          emotion: fearful
        - id: ch03-b23
          speaker: father_roubeau
          text: "可你必须面对这些。现在看清，总比以后再看清好。"
        - id: ch03-b24
          speaker: narrator
          text: "她看不见神父眼里的深切怜悯，只看见一张绷紧而颤抖、毫不退让的脸。神父知道这些话残酷，却也知道她必须面对。格蕾丝把伏在桌上的头抬起来，拼命把眼泪逼回去，一点点夺回对自己的控制。"
        - id: ch03-b25
          speaker: grace_bentham
          text: "我会离开这里，走得远远的，从此不让她们再见到我。时间一久，她们会慢慢把我忘掉，只当我已经死了。这样，我做的一切就伤不到她们。可我的决定不会改变，今天我还是要跟克莱德一起走。"
        - id: ch03-b26
          speaker: narrator
          text: "这句话听起来像最后的决定。沃顿刚要走近，神父便挥手让他退下。"
        - id: ch03-b27
          speaker: father_roubeau
          text: "你曾盼望孩子，也常为孩子祈祷。那么你想过没有，如果以后真的有了孩子呢？"
        - id: ch03-b28
          speaker: narrator
          text: "神父的目光停在窗边的沃顿身上。格蕾丝眼睛一亮，随即完全听懂了。她举手求他停下，神父却继续往下说。"
        - id: ch03-b29
          speaker: father_roubeau
          text: "想象你怀里抱着一个无辜的婴儿，一个男孩。世人对女孩还没有那么严酷。可到那一天，连你的乳汁也会变成苦胆。看着别人的孩子时，你还能为自己的儿子骄傲，还能觉得幸福吗？他会成为替罪羊。"
        - id: ch03-b30
          speaker: grace_bentham
          text: "发发慈悲吧，别说了！我回去，我愿意回去！"
          emotion: fearful
        - id: ch03-b31
          speaker: father_roubeau
          text: "那个孩子原本不懂邪恶，有一天，世人却会把一个温柔的称呼变成骂名，砸在他脸上。最后，他会回过头来诅咒生下自己的母亲。"
        - id: ch03-b32
          speaker: grace_bentham
          text: "我的上帝啊！我的上帝！"
          emotion: fearful
        - id: ch03-b33
          speaker: narrator
          text: "格蕾丝伏倒在地板上，嘴里反复呼喊自己的上帝。神父终于叹了一口气，弯腰把她从地上扶起。沃顿立刻冲过来，想把她拉到自己身边，她却抬手叫他走开。泪水不停淌过她的脸，她任由它们落下，连擦也不擦。"
        - id: ch03-b34
          speaker: grace_bentham
          text: "别靠近我，克莱德。我必须回去。"
          emotion: sad
        - id: ch03-b35
          speaker: clyde_wharton
          text: "我们已经说了这么多，连往后的路都安排好了，你怎么还能回去？你不能这样，我也绝不会让你这样做！"
          emotion: angry
        - id: ch03-b36
          speaker: grace_bentham
          text: "不要碰我！"
          emotion: fearful
        - id: ch03-b37
          speaker: clyde_wharton
          text: "我偏要碰！你是我的，听见没有？你是我的！"
          emotion: angry
        - id: ch03-b38
          speaker: narrator
          text: "沃顿猛地转向神父。"
        - id: ch03-b39
          speaker: clyde_wharton
          text: "我真是个傻瓜，竟让你把话说完！幸好你是神父，不然我早就动手了。这就是神父的特权，对吧？你已经用过了。现在滚出我的屋子，不然我会忘掉你的身份！"
          emotion: angry
        - id: ch03-b40
          speaker: narrator
          text: "鲁博神父没有同他争辩，只是欠身行了一礼，轻轻牵起格蕾丝的手，带她往门边走。两人才迈出几步，沃顿已经冲过去挡在前面，硬生生截住了他们的去路。"
        - id: ch03-b41
          speaker: clyde_wharton
          text: "格蕾丝，你说过爱我。现在还爱吗？再说一次。"
        - id: ch03-b42
          speaker: grace_bentham
          text: "我还爱你，克莱德。我真的爱你。"
          emotion: sad
        - id: ch03-b43
          speaker: clyde_wharton
          text: "听见了吗，神父？她还爱我，你却要送她回到那个男人身边，让她继续活在谎言和地狱里？"
          emotion: angry
        - id: ch03-b44
          speaker: narrator
          text: "神父迅速把格蕾丝送进里屋，关上门，自己装作若无其事地坐回凳子。"
        - id: ch03-b45
          speaker: father_roubeau
          text: "一个字也别说。为了她，千万记住。"
        - id: ch03-b46
          speaker: narrator
          text: "门上随即响起粗暴的敲击。门闩一抬，埃德温走了进来。"
        - id: ch03-b47
          speaker: edwin_bentham
          text: "你们见到我妻子了吗？"
        - id: ch03-b48
          speaker: narrator
          text: "两个人一起摇头。"
        - id: ch03-b49
          speaker: edwin_bentham
          text: "我看见她的脚印从山上木屋下来，可到了门外这段主路，脚印忽然断了。所以我还以为……"
        - id: ch03-b50
          speaker: clyde_wharton
          text: "她刚才就在这里！"
          emotion: angry
        - id: ch03-b51
          speaker: narrator
          text: "神父立刻用一个眼神压住沃顿，不让他再多说一句。狡猾的鲁博神父早已料到也许会有人循迹找来。一个钟头前，他沿同一条路走近木屋时，便弯下身，把格蕾丝留在雪上的脚印一一仔细抹掉，没有让它们通到门前。"
        - id: ch03-b52
          speaker: father_roubeau
          text: "我的孩子，你亲眼看见她的足迹通向这间屋子了吗？"
        - id: ch03-b53
          speaker: edwin_bentham
          text: "我没停下来细看。我只是……"
        - id: ch03-b54
          speaker: narrator
          text: "埃德温怀疑地盯住里屋，又用目光盘问神父。神父摇摇头，那份怀疑却还没有消失。鲁博神父在心里飞快祷告，站起身来。"
        - id: ch03-b55
          speaker: father_roubeau
          text: "如果你怀疑我，那么我就把这扇门打开。"
        - id: ch03-b56
          speaker: narrator
          text: "人们常说，神父不可能说谎。埃德温听过许多次，也从来没有怀疑过。正因为深信这句话，他看着鲁博神父准备开门，心里那点疑虑立刻失去了立足之地。"
        - id: ch03-b57
          speaker: edwin_bentham
          text: "我当然不怀疑你，神父。我只是想知道妻子去了哪里。我猜她在法国溪谷的斯坦顿太太那里。天气不错，对吧？面粉已经降到一百磅四十美元。听说新来的外乡人正一群群顺河而下。我还得去找她，再见。"
        - id: ch03-b58
          speaker: narrator
          text: "门砰地关上。沃顿和神父走到窗边，看着埃德温沿法国溪谷上山，也把藏在里屋的格蕾丝当成自己的客人带走。这一次，她终究还是回到了丈夫身边。"
    - id: ch04
      title: 没有说出口的罪
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "几星期后，六月洪水刚刚退去，鲁博神父和玛拉缪特小子把独木舟划进主流，又把船系上一棵漂流的松树。绳索随即绷紧，那棵树像拖船一样拽着轻巧的小舟前进。神父奉命离开上游，回到米努克那些深色皮肤的孩子们身边。白人闯进他们中间以后，他们花在捕鱼上的时间越来越少，奉献给另一位神明的时间却越来越多。这位神明居无定所，只寄身在数不清的黑瓶子里。"
        - id: ch04-b02
          speaker: narrator
          text: "小子也有事要去下游，于是两人同行。整个北地，只有他真正认识保罗·鲁博。神父也只肯在小子面前脱掉教士的外衣，赤裸裸露出心底真实的自己。他们彼此太熟悉了。在白令海荒凉的海岸，在大三角洲令人心碎的迷宫里，在从巴罗角出发、通往波丘派恩河的可怕冬日旅程中，他们都曾并肩熬过死亡逼近的时刻。他们分过最后一口鱼、最后一撮烟草，也分享过心底最后、最深、绝不会告诉旁人的念头。所以这一次，神父也无需在老朋友面前隐藏。"
        - id: ch04-b03
          speaker: narrator
          text: "鲁博神父一口接一口，沉沉抽着那支饱经旅途的烟斗。他抬眼望去，暗红的太阳正阴郁地停在北方地平线边缘，既不落下，也没有升高。玛拉缪特小子拿出怀表，慢慢给发条上紧。表针告诉他，此刻正是午夜。"
        - id: ch04-b04
          speaker: malamute_kid
          text: "振作一点，老伙计。上帝一定会宽恕这样的谎话。我念几句给你听，这个人说话句句在理。她若对你说过一句话，记住，你的嘴唇便必须永远紧闭。谁把藏在心里的秘密泄露出去，谁的身上便带着狗的烙印。"
        - id: ch04-b05
          speaker: malamute_kid
          text: "倘若祸患就要落到她头上，而最黑的谎言能够救她，那么，只要你的嘴唇还能动，只要世上还有人听得见，就说谎吧。"
        - id: ch04-b06
          speaker: narrator
          text: "鲁博神父从嘴边拿下烟斗，没有立刻回答。他望着河面和北方那轮不落的太阳，默默想了一会儿。小子的话并没有安慰到他，因为压在他心上的罪，并不是旁人以为的那一个。"
        - id: ch04-b07
          speaker: father_roubeau
          text: "那个人说得对，可我的灵魂不是为谎话烦恼。谎言和赎罪，自有上帝裁断。只是……"
        - id: ch04-b08
          speaker: malamute_kid
          text: "只是什么？你的双手是干净的。"
        - id: ch04-b09
          speaker: father_roubeau
          text: "不，小子。我想了很久，那件事却始终横在心里。我明明知道一切，却还是逼她回去了。"
          emotion: sad
        - id: ch04-b10
          speaker: narrator
          text: "木岸上传来知更鸟清亮的叫声，远处的松鸡擂起求偶的鼓点，一头驼鹿哗啦闯进回水湾。北地午夜的各种声响从他们身边掠过，两个男人却谁也不再开口，仍坐在那里，望着暗红的太阳，默默抽着烟。"
