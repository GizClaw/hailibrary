  chapters:
    - id: ch01
      title: I
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In the Northland's early days, civic virtue and social virtue were equally scarce and simple. The men from the South found housework heavy, while lonely hours by the fire became one long protest against the emptiness of camp life. With nothing better at hand, they paid the stated price and took native wives. To the women, it seemed like a first taste of paradise, because the white wanderers often gave them better care than native husbands had given them. The white men liked the bargain, and so did the native men. They traded daughters and sisters for cotton blankets and worn-out rifles. They exchanged warm furs for thin calico and bad whisky. Then, with bitter speed, they died from consumption and other diseases brought by what was called a superior civilization.
        - id: ch01-b02
          speaker: narrator
          text: In those simple days, Cal Galbraith traveled through the country and fell sick on the Lower River. His arrival brought something new into the lives of the good Sisters of the Holy Cross. They gave him shelter, medicine, soft hands, and gentle care. They never guessed how hot that kindness ran through his blood. Strange thoughts began troubling him and demanding his attention. Then he saw Madeline, a girl raised at the Mission, and those thoughts settled upon her. Still, Cal gave no sign. He waited for his time. Spring returned, and his strength returned with it. The sun traveled around the heavens in a golden circle. Life and joy beat through the whole land. Cal gathered his still-weak body and went away.
        - id: ch01-b03
          speaker: narrator
          text: Madeline was an orphan. Her white father had once refused to leave the trail for a bald-faced grizzly, and the bear killed him. Her Indian mother tried to survive until the salmon run with only fifty pounds of flour and half that much bacon. She died too. Their baby, Chook-ra, went to the Sisters and received the name Madeline.
        - id: ch01-b04
          speaker: narrator
          text: Madeline still had family. Her nearest relative was a ruined old uncle who poured enormous amounts of white men's whisky into himself. Each day he tried to walk with the gods, and each day his feet found a shorter road toward the grave. Whenever he was sober, life became exquisite torture. Conscience never troubled him at all. Cal went to this ancient vagabond and opened a long conversation. The two men used many words and smoked much tobacco. Cal made promises too. In the end, the uncle took a few pounds of dried salmon, climbed into his birch-bark canoe, and paddled toward the Mission of the Holy Cross.
        - id: ch01-b05
          speaker: narrator
          text: No one knows what promises he made or what lies he told, because the Sisters never gossip. He returned wearing a brass crucifix, with Madeline in his canoe. That night the village held a great wedding and potlach. No one fished for the next two days.
        - id: ch01-b06
          speaker: narrator
          text: The next morning, Madeline shook the dust of the Lower River from her moccasins. She and her husband took a poling boat upriver to the place known as the Lower Country. In the years that followed, she was a good wife. She cooked his food and shared every hardship that came to him. She kept his feet on straight trails until he learned to save his gold dust instead of throwing it away. She taught him, too, to work with all his strength. At last Cal struck rich ground and built a cabin in Circle City. Happiness filled their little home so completely that men who visited it grew restless at the sight. They left envying what Cal possessed.
        - id: ch01-b07
          speaker: narrator
          text: Then the Northland began to grow up, and social rules arrived. At first the South had sent its sons. Now it sent women who were neither wives nor sisters, but who put new ideas into men's heads and changed the tone of camp life. Native women were no longer welcomed at the dances. They stopped roaring down the center of the Virginia reel or making merry to “Dan Tucker.” Without complaint, they watched white women take command from inside their cabins.
        - id: ch01-b08
          speaker: narrator
          text: Then another wave came over the mountains from the crowded South. These women became powerful in the land. Their word was law, and their law had the hardness of steel. They frowned upon the native wives. The women who had arrived before them suddenly grew mild and walked humbly. Some men proved cowardly. They became ashamed of old promises made to the daughters of the land, and they began to look with distaste at their own dark-skinned children. Other men remained true. They stood proudly by the vows they had made. When it became fashionable to divorce a native wife, Cal kept his manhood and kept Madeline. For that choice, he felt the heavy hand of women who had arrived last, understood the least, and ruled the country.
        - id: ch01-b09
          speaker: narrator
          text: Then word came that the Upper Country, far beyond Circle City, was rich. Dog teams carried the news to the coast. Ships carried the lure across the North Pacific. Wires and cables sang, and the world first heard of the Klondike River and the Yukon Country.
        - id: ch01-b10
          speaker: narrator
          text: Cal had lived quietly through the years. He had been a good husband to Madeline, and she had blessed his life. Yet, somehow, discontent settled upon him. He felt a shapeless longing for people of his own kind and for the life from which he had been shut away. It was the old desire some men feel to break loose and taste life at its fullest. At the same time, wild stories floated downriver. They told of wonderful El Dorado and painted a glowing city made of logs and tents. They laughed over the green newcomers who had rushed in and set the whole country stampeding. Circle City was dead now. The world had moved upriver and turned into a new and marvelous place. Cal sat at the edge of everything, growing more restless. He wanted to see that world with his own eyes.
        - id: ch01-b11
          speaker: narrator
          text: After the wash-up, he weighed two hundred pounds of gold dust on the Company's scales and took a draft on Dawson. He left Tom Dixon in charge of his mines, kissed Madeline goodbye, and promised to return before the first mush ice. Then he boarded an upriver steamer.
        - id: ch01-b12
          speaker: narrator
          text: Madeline waited. She waited through all three months of daylight. Each day she fed the dogs and gave much of her time to Young Cal. She watched the brief summer fade, and she watched the sun begin its long southern journey. Often she prayed in the way the Sisters of the Holy Cross had taught her. Then fall arrived. Mush ice appeared on the Yukon. The kings of Circle City returned for another winter of work at their mines, but Cal did not come with them. Tom Dixon received a letter from him, and Dixon's men hauled Madeline a winter supply of dry pine. The Company received another letter. Its dog teams filled her cache with their finest provisions, and the Company told her that she could draw as much credit as she wished.
        - id: ch01-b13
          speaker: narrator
          text: Men have always been blamed for beginning the sorrows of women. This time, though, the men held their tongues. Among themselves, they cursed one of their own who was far away, but they said nothing to Madeline. The women showed no such restraint. Without much delay, Madeline heard strange stories about Cal's behavior in Dawson. She also heard of a certain Greek dancer who played with men as children played with bubbles. Madeline was an Indian woman, and she had no woman friend who could give her wise advice. She prayed for a while, then planned for a while. She did not take long to decide. That same night she harnessed the dogs, tied Young Cal securely to the sled, and stole away from Circle City.
        - id: ch01-b14
          speaker: narrator
          text: The Yukon still ran free, but ice grew in the eddies, and the open river narrowed each day to a thread of slush. Only someone who had done it could know what she endured over a hundred miles of rim ice, then two hundred miles of packed ice after the river froze. Madeline endured it. One night she knocked at Malemute Kid's door.
        - id: ch01-b15
          speaker: narrator
          text: The Kid fed her starving dogs, put the healthy child to bed, and cared for the exhausted woman. As he listened to her story, he pulled off her icebound moccasins and tested her feet with his knife to learn how deeply they were frozen.
        - id: ch01-b16
          speaker: narrator
          text: Malemute Kid had enormous strength, but something soft and almost womanly lived beside it. That gentleness could win the trust of a snarling wolf-dog or draw a confession from the coldest heart. Yet the Kid never went looking for secrets. Hearts opened to him as naturally as flowers opening to the sun. Even Father Roubeau had been known to confess to him. Men and women from all across the North were forever knocking at his door, and its latchstring was always out. Madeline had known him since she first came among her father's people. In her mind, the Kid could do no wrong and make no mistake. It seemed to her that all the wisdom of the ages had gathered inside him, and that no veil could hang between his eyes and the future.
        - id: ch01-b17
          speaker: narrator
          text: Dawson's new rules were not the rules of the older North, and the land had grown up too quickly and wrongly. The Kid understood that, and he understood Cal. He knew one hasty word could cause great harm. He meant to teach Cal a hard lesson and make him ashamed.
        - id: ch01-b18
          speaker: narrator
          text: The next night he called young mining expert Stanley Prince into council, along with Lucky Jack Harrington and his violin. Bettles owed the Kid a great debt. That same night, he harnessed Cal's dogs, secured Young Cal to the sled, and vanished into the darkness toward Stuart River.
    - id: ch02
      title: II
      blocks:
        - id: ch02-b01
          speaker: stanley_prince
          text: "Now, one, two, three. One, two, three. Reverse! No, no. Start again, Jack. Madeline, watch me do it this way."
        - id: ch02-b02
          speaker: narrator
          text: Prince showed her the turn with the ease of a man who had led formal dances.
        - id: ch02-b03
          speaker: stanley_prince
          text: "One, two, three. One, two, three. Now reverse. That's better. Again, and don't watch your feet. Take shorter steps. You aren't hanging on a sled pole now. There. That's it."
        - id: ch02-b04
          speaker: narrator
          text: Prince and Madeline circled endlessly in a waltz. The table and stools stood against the wall to make space. Malemute Kid watched from the bunk with his chin on his knees, while Harrington sat beside him and played the violin.
        - id: ch02-b05
          speaker: narrator
          text: It was a strange undertaking, these three men remaking one woman for a single meeting. The saddest part was the plain, businesslike way they went about it. No athlete preparing for a contest ever faced stricter discipline. No wolf-dog being trained for harness worked harder. Still, the men had good material. Unlike most women of her people, Madeline had escaped heavy loads and hard trail work during childhood because she had grown up at the Mission. She was clean-limbed and slender, with a willowy strength. A great deal of grace was already there, though no one had brought it into the light. That hidden grace was what the men worked to shape.
        - id: ch02-b06
          speaker: stanley_prince
          text: "She learned to dance the wrong way, Kid. She catches on quickly, but I'd have an easier time if she'd never danced at all. And I can't make sense of this."
        - id: ch02-b07
          speaker: narrator
          text: Prince copied the odd movement of Madeline's shoulders and head when she walked. Then he set his breathless pupil on the table.
        - id: ch02-b08
          speaker: malemute_kid
          text: "The Mission saved her from the worst of it. Other native women carried loads with a head strap from childhood. She didn't do that until after she married, and only at first. She and Cal went through hard times, including the Forty Mile famine."
        - id: ch02-b09
          speaker: stanley_prince
          text: "Can we break the habit?"
        - id: ch02-b10
          speaker: malemute_kid
          text: "I don't know. Long walks with us may smooth it out some. Isn't that right, Madeline?"
        - id: ch02-b11
          speaker: narrator
          text: Madeline nodded. If the Kid said it, then it was true. She came over, eager to begin again. Harrington studied her as men studied a horse and found no disappointment in what he saw.
        - id: ch02-b12
          speaker: lucky_jack_harrington
          text: "What did that worthless uncle get for you, anyway?"
        - id: ch02-b13
          speaker: madeline
          text: "One rifle, one blanket, twenty bottles of whisky. The rifle broke."
        - id: ch02-b14
          speaker: narrator
          text: She spoke the last words with scorn for the low price placed upon her. Her English was good and carried many turns learned from Cal, though an Indian accent remained. Her teachers worked on that too, and with success.
        - id: ch02-b15
          speaker: stanley_prince
          text: "Kid, we've made a mistake. She can't learn this in moccasins. Put her in slippers on a waxed floor, and what then?"
        - id: ch02-b16
          speaker: narrator
          text: Madeline lifted one foot and studied her shapeless house moccasin with doubt. In earlier winters at Circle City and Forty Mile, she had danced through many nights in the same kind of footwear. Nothing had seemed wrong with it then. Now Prince spoke of slippers and a waxed floor as though moccasins changed everything. Madeline did not try to settle the question herself. If there was a problem, Malemute Kid would know it. She trusted his judgment, not her own.
        - id: ch02-b17
          speaker: narrator
          text: He did know, and he knew Mrs. Eppingwell's small foot would match Madeline's. Mrs. Eppingwell was sensible as well as pretty, so he put on his cap and mittens and went down the hill to ask a favor.
        - id: ch02-b18
          speaker: narrator
          text: When he returned, Madeline went into the inner room. She came back wearing tiny white satin slippers, and Prince stared.
        - id: ch02-b19
          speaker: stanley_prince
          text: "Good heavens! Who would have guessed? Why, my sister—"
        - id: ch02-b20
          speaker: malemute_kid
          text: "Your sister is English, with an English foot. Madeline belongs to a small-footed people. Moccasins let her feet broaden naturally, and she didn't twist them out of shape running beside dogs as a child."
        - id: ch02-b21
          speaker: narrator
          text: The explanation did nothing to lessen Prince's admiration. Harrington's mind turned in another direction. He looked at that beautifully shaped foot and ankle while the miserable list ran through his head again. One rifle, one blanket, and twenty bottles of whisky. Madeline was the wife of a king now, and her king's yellow treasure could buy twenty of fashion's painted puppets outright. Yet through her whole life, her feet had never known anything but soft, red-tanned moosehide. No satin, no leather shoe, and no ornament had ever touched them before that night.
        - id: ch02-b22
          speaker: narrator
          text: At first the satin slippers awed her. Then she saw the open admiration in the men's eyes, and pride colored her face. For one moment she was intoxicated by her own beauty.
        - id: ch02-b23
          speaker: madeline
          text: "And the one rifle was broken."
        - id: ch02-b24
          speaker: narrator
          text: Training continued. Every day the Kid took her on long walks to straighten her carriage and shorten her stride. Discovery was unlikely. Cal and the other Old-Timers were lost among Dawson's crowds of newcomers. Besides, southern women hid their faces from the bitter frost behind canvas masks. Inside squirrel-skin parkas, even a mother and daughter might pass each other without knowing.
        - id: ch02-b25
          speaker: narrator
          text: The coaching moved slowly at first. Then, after Madeline tried the white satin slippers and discovered herself, everything began to change at once. Some part of her white father's pride woke in that moment and joined whatever self-respect had already been hers. Until then, she had thought herself a woman from an alien and inferior people. She believed Cal had raised her through his favor, not through any worth of her own. Her husband had seemed like a god who had lifted her to his height. The women of his race seemed like goddesses too. Even after Young Cal was born, she never forgot that she did not belong to Cal's people. She might have set herself against white women in her thoughts, but she had never imagined that she could stand beside them and be measured by the same standard.
        - id: ch02-b26
          speaker: narrator
          text: As the years passed, familiarity may have worn away some of her awe. Madeline had come to understand the wandering white men and to weigh them for herself. She could not have explained the process in careful words, but she possessed a woman's clear sight in such matters. On the night of the slippers, she measured the bold and honest admiration in the eyes of her three friends. For the first time, the idea of comparison entered her mind. It began with only a foot and an ankle, but it could not stop there. She judged herself by the men's own standards until the godhood of her white sisters broke into pieces. After all, they were only women. Why should Madeline not lift herself into their company? As she worked, she discovered every place where she fell short. Knowledge of each weakness gave her new strength. She tried so mightily that her three trainers often sat late into the night, marveling over what they called the eternal mystery of woman.
        - id: ch02-b27
          speaker: narrator
          text: Thanksgiving drew near. Bettles sent news from Stuart River that Young Cal was well and would soon return. Sometimes callers heard the violin and dancing feet. They came in to find Harrington playing while Prince and the Kid argued over a step. Madeline always escaped into the inner room before anyone saw her.
        - id: ch02-b28
          speaker: narrator
          text: On one of those nights, Cal himself came to the cabin. Just before his knock, encouraging news had arrived from Stuart River, and Madeline had surpassed every earlier success. Her walk, carriage, and grace had changed, but there was more. A playful woman's mischief had appeared in her. She met the men's sharp jokes and answered every one brilliantly. Then the strength of the moment and the discovery of her own power swept her onward. She bullied them, mastered them, coaxed them, and treated them with amused superiority. To their own surprise, the three men gave way. They did not bow to beauty, wisdom, or wit. They bowed without thinking to that nameless thing in woman which men have always yielded to and never explained.
        - id: ch02-b29
          speaker: narrator
          text: Delight filled the cabin. Madeline and Prince whirled through the final dance. Harrington tossed flourishes into the music, and the Kid spun wildly with a broom. Then a heavy knock shook the door and the latch rose. Harrington kept playing. Madeline flew into the inner room. The broom shot under the bunk. By the time Cal and Louis Savoy looked inside, Prince and the Kid were dancing madly in each other's arms.
        - id: ch02-b30
          speaker: narrator
          text: Native women did not commonly faint at every shock, but Madeline came as close as she ever had. For a full hour she crouched on the floor behind the inner door. The men's heavy voices rose and fell on the other side like distant thunder. Every note of her husband's voice, every familiar turn and habit in it, came to her like a song from childhood. Each one fluttered her heart and weakened her knees. At last she lay against the door, almost unconscious. When Cal finally took his leave, it was well that Madeline could neither see what passed nor clearly hear it.
        - id: ch02-b31
          speaker: malemute_kid
          text: "When are you going back to Circle City?"
        - id: ch02-b32
          speaker: cal_galbraith
          text: "I haven't thought much about it. Probably not until the ice breaks."
        - id: ch02-b33
          speaker: malemute_kid
          text: "What about Madeline?"
        - id: ch02-b34
          speaker: narrator
          text: Cal flushed and lowered his eyes. The Kid might have despised him if he had understood men less well. Instead, his anger rose against the southern wives and daughters who had taken the native women's places, then taught men to feel shame.
        - id: ch02-b35
          speaker: cal_galbraith
          text: "She's all right, I suppose. Tom Dixon handles my affairs, and he makes sure she gets whatever she needs."
        - id: ch02-b36
          speaker: narrator
          text: Outside, the Kid put a hand on Cal's arm and silenced him. The aurora threw wild colors overhead, and the town slept below. One distant dog howled. Another joined it, then another, until a full chorus rolled through the night.
        - id: ch02-b37
          speaker: narrator
          text: The song tells a newcomer the Northland's first and greatest secret. To an old hand, it tolls for lost effort. It carries the suffering of numberless generations, warning and mourning for those who stray into the North.
        - id: ch02-b38
          speaker: narrator
          text: As the song died in half-caught sobs, Cal shivered. The Kid read his thoughts as openly as if they were written down. Together, in memory, they traveled back through all the weary days of famine and disease. In every picture, patient Madeline stood beside Cal. She shared his pain and peril, never doubting him and never complaining. A score of stern, clear images flashed through his mind. The hand of the past pulled backward with heavy fingers upon his heart. This was the perfect moment. The Kid was half tempted to play the card he had kept in reserve and win the game at once. But the lesson would still be too gentle. He allowed the moment to pass. A breath later, the men gripped hands. Cal's beaded moccasins made the snow complain as he crunched away down the hill.
        - id: ch02-b39
          speaker: narrator
          text: Inside, Madeline had become another person. The mischievous woman from an hour before had filled the room with infectious laughter. Her bright color and flashing eyes had made the men forget their work for a little while. Now Prince and Harrington carried a weak, nerveless woman to a chair and left her sitting where they placed her. The Kid frowned. This would never do. When the time came to meet her husband, Madeline must carry the moment with proud, commanding confidence. She must do it in the manner of the white women, or her victory would mean nothing. The Kid spoke sternly and did not soften his words. He taught her about the weaknesses of his own sex until she understood what simple fools men could be, and why the word of their women became law.
        - id: ch02-b40
          speaker: narrator
          text: A few days before Thanksgiving, the Kid paid another call on Mrs. Eppingwell. She answered at once. First she turned over all her feminine finery. Then she made a long visit to the dry-goods counter at the Company store. At last she returned with the Kid and met Madeline. The cabin entered a period unlike anything it had known. There was cutting and fitting, then basting and stitching, followed by many other operations that seemed wonderful and unknowable to the male conspirators. More often than not, Mrs. Eppingwell banished all three men from the room while the work went on.
        - id: ch02-b41
          speaker: narrator
          text: Banished to the Opera House, the conspirators put their heads together and drank to such curious toasts that the loungers imagined they had found a fabulously rich creek. Several newcomers and one Old-Timer kept trail packs ready behind the bar in case a stampede began.
        - id: ch02-b42
          speaker: narrator
          text: Mrs. Eppingwell knew her work. On Thanksgiving night, she returned Madeline to the men so transformed that they almost feared her. Prince wrapped her in a Hudson Bay blanket with a reverence more real than pretend. Madeline took the Kid's arm, and he struggled to act like her teacher. Harrington dragged along behind them, still thinking over the long list and cost of her new clothes. He never opened his mouth once during the whole walk down into town.
        - id: ch02-b43
          speaker: narrator
          text: At the Opera House's back door, they spread the blanket on the snow. Madeline slipped out of Prince's moccasins and stepped onto it in her new satin shoes. The masquerade was already in full swing. She hesitated. The men opened the door, pushed her inside, and ran around to enter by the front.
    - id: ch03
      title: III
      blocks:
        - id: ch03-b01
          speakers: [old_timer, newcomer]
          ensemble: duo
          text: "Where is Freda? And who is Freda?"
        - id: ch03-b02
          speaker: narrator
          text: Freda's name buzzed around the ballroom. Grizzled Old-Timers, proud of surviving a year in the country, talked down to the neat newcomers and told magnificent lies. If a newcomer did not know Freda, they might instead glare at him in outrage.
        - id: ch03-b03
          speaker: narrator
          text: Perhaps forty mining kings from the Upper and Lower Countries searched the floor. Each believed he was hot on Freda's trail, and each backed his judgment with the yellow gold dust of his little realm. So many sacks came forward that an assistant had to help the man at the scales. Several gamblers knew every rule of chance and every weakness in a hopeful wager. They made up tempting books on the whole field, named their favorites, and invited the crowd to risk more dust.
        - id: ch03-b04
          speaker: narrator
          text: Which woman was Freda? Again and again someone claimed to have found the Greek Dancer. Each discovery threw panic into the betting as men rushed to place new wagers and protect the old ones. The Kid joined the hunt and received a roaring welcome from men who all knew him. He had a fine eye for the trick of a step and a good ear for the music inside a voice. His own choice was a marvelous woman who glittered in the costume of the Aurora Borealis. Yet Freda's disguise was too subtle even for him. Most of the gold hunters fixed their judgment upon the Russian Princess. She was the most graceful woman in the room, and so they reasoned that she could be no one but Freda Moloof.
        - id: ch03-b05
          speaker: narrator
          text: During a quadrille, a great cheer rose. At earlier balls, Freda had always given the “all hands round” figure a step of her own. Now the Russian Princess performed it.
        - id: ch03-b06
          speaker: old_timer
          text: "There! I told you that was Freda!"
        - id: ch03-b07
          speaker: narrator
          text: Then the Aurora Borealis and the Spirit of the Pole used the same step. Two matching Sun-Dogs and a Frost Queen followed them. A second assistant hurried to the overwhelmed man at the scales.
        - id: ch03-b08
          speaker: narrator
          text: Bettles arrived straight from the trail in the middle of the excitement. He came down upon the dancers like a storm of frost. The ice on his eyebrows melted into little streams as he whirled. His mustache was still frozen, and every hair seemed set with diamonds that broke the lamplight into many colors. His flying feet slipped over the lumps of ice falling from his moccasins and heavy German socks. The chunks rattled across the floor while he spun among the dancers.
        - id: ch03-b09
          speaker: narrator
          text: A northern dance was an informal business. Men from creeks and trails had lost whatever careful manners they once possessed, and only the highest government circles bothered much with convention. Rank meant nothing here. Millionaires and poor men, dog drivers and mounted police all joined hands when the caller cried for the ladies in the center. Together they swept around the circle and performed the wildest steps. Their pleasure was primitive, rough, and noisy. Yet there was no true rudeness in it. Beneath the commotion lived a plain northern chivalry, and it was more honest than the finest polished courtesy.
        - id: ch03-b10
          speaker: narrator
          text: While hunting Freda, Cal managed to enter the same dance set as the Russian Princess, the woman most people suspected. He guided her through one dance. By the end, he was ready to wager all his millions on two beliefs. She was not Freda, and his arm had circled that waist before. He could not remember when or where it had happened. The sense of knowing her stayed just beyond his reach, and the puzzle worked upon him until he forgot the dance itself. He turned all his attention toward uncovering the Princess's name.
        - id: ch03-b11
          speaker: narrator
          text: The Kid might have helped. Instead, he danced with the Princess now and then and spoke earnestly in her ear. Harrington gave her the most devoted attention. Once he pulled Cal aside, made wild guesses about her identity, and declared he meant to win her. That stung Cal. He forgot both Madeline and Freda and joined this new pursuit.
        - id: ch03-b12
          speaker: narrator
          text: Word soon ran through the room that the Russian Princess was not Freda Moloof, and interest deepened. They knew Freda well, though they could not find her. Here was a stranger they had already found, yet no one could name her. Even the women failed to place her, and they knew every good dancer in camp. Many decided she belonged to the government circle and had slipped out for a foolish adventure. Quite a few declared that she would disappear before the unmasking. Others were just as certain she was the woman reporter from the Kansas City Star, come north to write about them at ninety dollars for every column. Through every fresh theory, the men at the scales kept weighing dust.
        - id: ch03-b13
          speaker: narrator
          text: At one o'clock, every couple came onto the floor. The unmasking began in laughter and the delight of carefree children. Each lifted mask brought another chorus of surprise. The glittering Aurora Borealis became the powerful Black laundress whose work washing the camp's clothes brought her nearly five hundred dollars a month. The two matching Sun-Dogs uncovered mustaches beneath their masks. The crowd recognized them as brothers, each a king of rich claims on El Dorado.
        - id: ch03-b14
          speaker: narrator
          text: One important set was slow to uncover. Cal stood with the Spirit of the Pole. Across from him were Harrington and the Russian Princess. Everyone else had shown a face, but Freda was still missing. The whole room watched.
        - id: ch03-b15
          speaker: narrator
          text: The crowd called out, and Cal lifted his partner's mask. Freda's marvelous face and shining eyes appeared. A roar burst out, then died as every eye turned toward the hidden Russian Princess.
        - id: ch03-b16
          speaker: narrator
          text: The rest of the set had already shown their faces, but the Russian Princess still hid hers. Harrington pretended to struggle with her while the dancers rose on their toes with expectation. He handled her delicate costume roughly and crushed its folds. Then the mask came away, and the revelers exploded with laughter. The joke had fallen squarely upon them. All night they had admired and danced with a native woman, one of the very women their new rules had pushed beyond the ballroom door.
        - id: ch03-b17
          speaker: narrator
          text: Many people recognized her. Their laughter stopped at once, and silence filled the room.
        - id: ch03-b18
          speaker: narrator
          text: Cal crossed the floor in great angry strides. He addressed Madeline in the mixed Chinook speech used between people who shared no single language. Every eye in the room rested upon her. She appeared not to notice. Without losing her composure, she answered her husband in English. There was no fear in her face and no anger in her voice. The Kid chuckled at the fine, well-bred balance with which she held herself. Cal felt baffled and defeated. The common native wife he believed he had left behind had passed beyond his reach.
        - id: ch03-b19
          speaker: cal_galbraith
          text: "Come with me. We're going home."
          emotion: angry
        - id: ch03-b20
          speaker: madeline
          text: "I'm sorry, but I promised Mr. Harrington I would have supper with him. And my dance card is still full."
        - id: ch03-b21
          speaker: narrator
          text: Harrington offered his arm and turned his back without hesitation. By then, the Kid had moved close. Cal stood stunned. Twice his hand fell toward his belt, and twice the Kid prepared to leap. But Madeline and Harrington passed safely into the supper room, where canned oysters cost five dollars a plate.
        - id: ch03-b22
          speaker: narrator
          text: The crowd released one great breath. Then it broke into couples and followed them into supper. Freda pouted, but she went in on Cal's arm. Beneath everything, Freda had a good heart and a tongue that always found its mark. Before supper ended, she had ruined every one of Cal's oysters for him. Her exact words were not important. Their work showed plainly enough. His face changed from red to white and back again at intervals, while he swore repeatedly and savagely at himself.
        - id: ch03-b23
          speaker: narrator
          text: The supper room roared with voices. Every sound stopped when Cal walked to his wife's table. Since the masks came off, heavy bets in gold dust had been laid on what would happen. Now everyone watched without breathing.
        - id: ch03-b24
          speaker: narrator
          text: Harrington's blue eyes did not move, though a Smith and Wesson rested on his knee beneath the tablecloth. Madeline looked up with mild, almost careless interest.
        - id: ch03-b25
          speaker: cal_galbraith
          text: "May I... may I have the next round dance with you?"
        - id: ch03-b26
          speaker: narrator
          text: The wife of the King looked at her dance card and bowed her head.
