audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静克制，带着北国故事的冷峻与悲悯
        timbre: 温厚清晰，略带风霜感
        pace: 舒缓而有张力
        pitch: 中低
    cal_galbraith:
      display_name: 卡尔·加尔布雷思
      tts:
        delivery: 粗犷自信，心虚时迟疑闪躲
        timbre: 浑厚结实
        pace: 中等
        pitch: 中低
    madeline:
      display_name: 玛德琳
      tts:
        delivery: 质朴坚韧，蜕变后从容机敏
        timbre: 清亮柔韧，略带印第安口音
        pace: 平稳
        pitch: 中
    malemute_kid:
      display_name: 马拉穆特小子
      tts:
        delivery: 从容果断，冷静中含着不动声色的幽默
        timbre: 温厚坚定
        pace: 稳健
        pitch: 中低
    stanley_prince:
      display_name: 斯坦利·普林斯
      tts:
        delivery: 文雅活泼，指导时耐心而利落
        timbre: 清晰沉稳
        pace: 中等偏快
        pitch: 中
    jack_harrington:
      display_name: 幸运杰克·哈林顿
      tts:
        delivery: 爽朗机敏，玩笑里带着可靠的镇定
        timbre: 明亮结实
        pace: 明快
        pitch: 中
    louis_savoy:
      display_name: 路易·萨沃伊
      tts:
        delivery: 热情外露，带法裔加拿大人的活泼气息
        timbre: 明亮浑厚
        pace: 明快
        pitch: 中
    freda:
      display_name: 弗蕾达·莫卢夫
      tts:
        delivery: 伶俐爽快，讥讽时一针见血
        timbre: 明艳清脆
        pace: 中等偏快
        pitch: 中
    old_timer:
      display_name: 老北地人
      tts:
        delivery: 好奇起哄，带着老资格的粗豪
        timbre: 粗哑响亮
        pace: 明快
        pitch: 中低
    newcomer:
      display_name: 新来客
      tts:
        delivery: 好奇急切，对北地掌故一无所知
        timbre: 清晰年轻
        pace: 明快
        pitch: 中
  chapters:
    - id: ch01
      title: 北国的旧日盟约
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "北国还年轻的时候，社会风尚和公民美德都少得可怜，也简单得可怜。南方来的冒险客起初独自过活，后来家务越来越沉，炉边又总是空荡冷清。那份寂寞日日催人抱怨，他们没有更好的选择，便照讲好的价钱娶当地女子为妻。对那些女人来说，这简直像提前尝到天堂。必须承认，白人漂泊者照料她们、对待她们，确实比印第安男人好得多。白人对这笔交易满意，印第安男人也一样满意。他们拿女儿和姐妹换来棉毯和过时的步枪，又拿暖和的毛皮换回单薄印花布和劣酒。随后，这片土地的儿子们便欣然倒下，迅速死于肺痨和其他急病。这些病，也正是优越文明带来的福泽。"
        - id: ch01-b02
          speaker: narrator
          text: "就在这样田园牧歌般淳朴的年月，卡尔·加尔布雷思走遍这一带，来到下游时病倒了。圣十字会的善良修女收留他，给他住处，也给他药物。他的到来让修女们平静的日子有了一点新鲜气息。她们却不知道，那柔软的手轻轻一碰，那温存的照料，给他的血管注进了怎样滚烫的药酒。许多古怪念头在他心里吵嚷着，要他理会，直到他看见教会里的姑娘玛德琳。他依然没有声张，只耐心等候时机。春天到来，他逐渐恢复。太阳在天空画着金色圆环，整片大地都涌动着生命的欢欣与脉搏。他终于撑起仍旧虚弱的身体，离开了那里。"
        - id: ch01-b03
          speaker: narrator
          text: "教会里的姑娘玛德琳是个孤儿。有一天，她的白人父亲没能给一头白脸灰熊让开雪道，很快便送了命。她的印第安母亲从此没了男人为冬天的储藏窖添满食物，却做了一次危险尝试，想靠五十磅面粉和二十五磅熏肉一直熬到鲑鱼汛期。再后来，还是婴儿的楚克拉被送进圣十字会，交给那些善良的修女，从此也换了名字。她还有亲人，最近的是一个放荡的舅舅。他整日拿白人的威士忌糟蹋自己的五脏六腑，天天努力与众神同行，双脚却顺便抄近路奔向坟墓。每逢清醒，他便痛苦万分。至于良心，他根本没有。"
        - id: ch01-b04
          speaker: narrator
          text: "卡尔照规矩去见那老无赖。两个人谈了很久，说掉许多话，也抽掉许多烟，还立下一些约定。最后，舅舅带着几磅鲑鱼干，划桦皮独木舟去了圣十字会。他究竟许了什么愿、撒了什么谎，世人永远不会知道，修女从不说闲话。可他回来时，黝黑的胸前挂着一枚黄铜十字架，船里坐着外甥女玛德琳。当夜，村里大办婚礼和赠礼宴。庆典热闹得接连两天没有一个人出去捕鱼。"
        - id: ch01-b05
          speaker: narrator
          text: "第二天早晨，玛德琳抖掉鹿皮鞋上的下游尘土，跟丈夫坐撑篙船去了上游。他们落脚的地方偏偏叫下游区。往后的岁月里，她一直是个好妻子。丈夫受苦，她陪着受苦。丈夫要吃饭，她为他烧饭。她还让卡尔始终走在正道上，直到他学会积攒金沙，也肯下大力气干活。后来，卡尔终于挖到富矿，在环城盖起木屋。他过得那样幸福，每个踏进他家庭小天地的男人，看见那番光景都会心神不宁，妒意横生。可是北国渐渐成熟，社交礼俗也开始登场。"
        - id: ch01-b06
          speaker: narrator
          text: "从前南方只送来自己的儿子，如今又吐出一批女儿。这些女人不是谁的姐妹，也不是谁的妻子。可她们照样把新念头装进男人脑里，又用自己特有的办法提高当地风气。印第安女人再不能聚到舞会上，不能沿场子中央呼喊着跳那古老欢快的弗吉尼亚轮舞，也不能随着热闹的《丹·塔克》取乐。她们退回木屋，恢复天生的沉默与坚忍，毫无怨言地看着白人姐妹掌权。接着，丰饶的南方又送来一批翻山而至的女人。她们在当地握有大权。她们的话就是法律，那法律冷硬如钢。"
        - id: ch01-b07
          speaker: narrator
          text: "新来的女人皱眉鄙弃印第安妻子，先来的女人便温顺下来，低眉顺眼地走路。有些懦夫以旧日和这片土地女儿订下的婚约为耻，也用新的厌恶目光看待自己深色皮肤的孩子。另一些真正的男人却忠于土著妻子，并以当初的誓约为荣。休掉印第安妻子成为风尚以后，卡尔仍守住男子气概，也因此尝到了那些来得最晚、懂得最少、却统治北国的女人有多厉害。就在这时，远在环城之上的上游区传出富矿消息。狗队把它送到海边，满载黄金诱惑的船只驶过北太平洋，电线和海底电缆一路传唱。全世界第一次听见克朗代克河与育空地区的名字。"
        - id: ch01-b08
          speaker: narrator
          text: "卡尔这些年一直安静过活。他是玛德琳的好丈夫，玛德琳也给了他福气。可不知为何，一股不满忽然落到他心里。他隐约想念自己的同类，也向往那种一直把他隔在门外的生活。男人有时会生出这样的念头，总想冲破眼前的一切，尝一尝盛年生活最浓烈的滋味。何况，河上不断漂来黄金乡的狂热传闻。有人把那座原木与帐篷搭起的城描绘得灿烂夺目，也有人带来种种荒唐笑话，说新来客蜂拥而入，把整个国家闹得人仰马翻。环城已经死了。世界沿河搬去了上游，在那里变成一个崭新而又奇妙无比的世界。卡尔坐在世界边缘，再也安静不下来。他非得亲眼去看一看。"
        - id: ch01-b09
          speaker: narrator
          text: "淘洗季一结束，他称出两百来磅金沙，换成在道森兑付的汇票，把矿场交给汤姆·迪克森。他吻别玛德琳，答应第一批碎冰漂来以前回来，便坐汽船去了上游。玛德琳等过整整三个月的白昼。她喂狗，照料小卡尔，看短夏消逝，看太阳开始漫长的南归，也照修女教的方式祈祷。秋天到了，育空河漂起碎冰，环城的王者都回矿场过冬，卡尔却没有回来。"
        - id: ch01-b10
          speaker: narrator
          text: "汤姆收到卡尔的信，派手下用雪橇送来足够过冬的干松木。公司也收到一封信，叫狗队用他们最好的食物装满玛德琳的储藏窖，还告诉她，她的信用没有限额，想赊多少都行。千百年来，男人总被看作女人受苦的祸首。这一次，男人们却闭紧嘴，只把远方那个同类狠狠咒骂。女人们没能学会这种克制。没有耽搁多久，玛德琳便听见卡尔种种古怪行径，也听说有个希腊舞女拿男人玩耍，就像孩子拿肥皂泡玩。"
        - id: ch01-b11
          speaker: narrator
          text: "她是印第安女人，身边又没有一个女性朋友可以请教。她一会儿祈祷，一会儿盘算。这个女人素来果断，想到便做。当夜，她套好狗队，把小卡尔牢牢绑在雪橇上，悄悄出发。育空河还没封冻，回水湾却日渐结冰，河道一天比一天窄，最后只剩一道冰泥翻涌的细流。她踏着岸边薄冰走了一百英里。等大河彻底封死，又在高低不平的挤压冰上开出两百英里道路。没亲身走过的人，不会明白前一百英里有多危险，也不会懂后两百英里费了多少力气、吃了多少苦。可玛德琳是印第安女人，她做到了。"
        - id: ch01-b12
          speaker: narrator
          text: "一天夜里，她终于敲响马拉穆特小子的门。小子先喂那队饿得皮包骨的狗，把健康结实的孩子安顿上床，才转身照料筋疲力尽的女人。他脱下冻在她脚上的鹿皮鞋，一边听她从头诉说，一边把刀尖刺进她的双脚，查看冻伤究竟有多深。小子虽有一身强悍无比的阳刚气，性情里却有女子般柔软的东西。那东西能让龇牙低吼的狼犬信任他，也能叫最冰封的心吐露秘密。他从不刻意追问，人们的心却会自己向他敞开，就像花朵自然而然迎向太阳。"
        - id: ch01-b13
          speaker: narrator
          text: "连鲁博神父都曾向他忏悔。北国的男人女人也不断来敲他的门，那扇门的门闩绳永远挂在外面。玛德琳从第一次投身父亲族人的生活起，就已经认识小子。在她眼里，这个人不会做错，也不会看错。在她那颗半开化的心里，仿佛历代积下的智慧全聚在他身上，他的目光与未来之间绝不会隔着帷幕。可这片土地正盛行错误的准则。道森的新禁律并不等同于旧日的社会规矩，北国成熟得太快，也因此酿出许多不公。小子明白这一切，更把卡尔这个人看得一清二楚。他知道冲动的一句话会生出许多祸害，因此没有急着开口。除此以外，他还打定主意，要给卡尔上一堂真正的大课，让那个人羞愧。"
        - id: ch01-b14
          speaker: narrator
          text: "第二天夜里，他请来年轻的采矿专家斯坦利·普林斯，也请来幸运杰克·哈林顿和他的小提琴。欠小子一份大人情的贝特尔斯则套上卡尔的狗，把小卡尔绑上雪橇，摸黑去了斯图尔特河。"
    - id: ch02
      title: 白缎舞鞋
      blocks:
        - id: ch02-b01
          speaker: stanley_prince
          text: "对，一——二——三，一——二——三。现在倒转！不对，杰克，从头再拉。玛德琳，看我这样做。"
        - id: ch02-b02
          speaker: narrator
          text: "普林斯做了个标准示范，一看就知道他领过宫廷方舞。"
        - id: ch02-b03
          speaker: stanley_prince
          text: "再来，一——二——三，一——二——三。倒转！啊，好多了。别看脚，步子再小一点。你现在可没扶着雪橇舵杆。重新来。对，就是这样！"
        - id: ch02-b04
          speaker: narrator
          text: "普林斯带着玛德琳一圈圈旋转，华尔兹仿佛永远跳不完。为了多腾出一点地方，桌子和凳子全被推到墙边。小子坐在铺位上，下巴抵着膝盖，看得兴致勃勃。哈林顿坐在旁边拉琴，一面演奏，一面让目光紧紧跟着舞者。三个男人带这个女人做的事，实在是世上少有。而最叫人心酸的，也许正是他们做得那样认真，那样一本正经。从来没有哪个运动员为了即将到来的比赛，接受过更严格的操练，也没有哪条狼犬为了套上挽具，受过这样的训练。好在他们手里的材料很好。玛德琳不像本族大多数女人，童年没有背过沉重的东西，也没有在雪道上长久苦熬。她的四肢干净匀称，身子修长柔韧，天生藏着一份过去从未被人发现的优雅。三个男人要做的，正是把那份优雅引出来，再一点点敲打成形。"
        - id: ch02-b05
          speaker: narrator
          text: "好在玛德琳底子很好。她童年没有像大多数本族女人那样背重物、熬雪道。她四肢匀称，身姿修长，天生有一份从未被发现的优雅。三个男人正设法把它引出来，打磨成形。普林斯让气喘吁吁的学生坐到桌上，朝铺位开口。"
        - id: ch02-b06
          speaker: stanley_prince
          text: "她从前把舞步全学错了。她学得快，可要是一步都没跳过，我反倒更好教。还有，小子，她走路时肩膀和脑袋为什么这样晃？我真看不懂。"
        - id: ch02-b07
          speaker: malemute_kid
          text: "幸好她在教会长大。那是额头背带留下的毛病。别的印第安女人更严重。她婚后才背东西，也只背了最初一阵。她跟丈夫吃过不少苦，两个人一起熬过四十英里镇的饥荒。"
        - id: ch02-b08
          speaker: stanley_prince
          text: "那还能改掉吗？"
        - id: ch02-b09
          speaker: malemute_kid
          text: "不知道。让教练陪她多走些路，也许能挺过这一关。至少会好一点。你说呢，玛德琳？"
        - id: ch02-b10
          speaker: narrator
          text: "玛德琳点头。既然无所不知的小子这样说，那就一定如此。她急着再练，已经走到他们跟前。哈林顿像男人挑马一样端详她的身段，显然很满意。"
        - id: ch02-b11
          speaker: jack_harrington
          text: "你那个穷酸舅舅，到底拿你换了什么？"
        - id: ch02-b12
          speaker: madeline
          text: "一支枪，一条毯子，二十瓶酒。那支枪还是坏的。"
          emotion: disgusted
        - id: ch02-b13
          speaker: narrator
          text: "最后一句满是轻蔑，仿佛嫌自己的姑娘身价被估得太低。她英语说得不错，带着丈夫许多说话习惯，也仍有印第安口音，说陌生喉音时带着族人的迟疑。几位老师连这个也管起来，而且颇有成效。下一次歇息，普林斯又发现一个难题。"
        - id: ch02-b14
          speaker: stanley_prince
          text: "小子，我们全错了。她穿鹿皮鞋根本学不会。让她换上舞鞋，踩到打过蜡的地板上——那才对！"
        - id: ch02-b15
          speaker: narrator
          text: "玛德琳抬起一只脚，疑惑地看着没形没样的室内鹿皮鞋。从前在环城和四十英里镇过冬，她穿这种鞋跳过许多通宵，从没觉得不妥。不过现在，若真有问题，也该由小子明白。小子果然明白，也很会看尺寸。他戴上帽子手套，下山去拜访埃平韦尔太太。她的丈夫克洛夫是当地政府的大人物。小子在总督舞会上留意过她纤秀的脚，也知道她既漂亮又明理，开口借东西并不难。"
        - id: ch02-b16
          speaker: narrator
          text: "小子回来后，玛德琳进了里间。她再次出现，普林斯顿时吓了一跳。"
        - id: ch02-b17
          speaker: stanley_prince
          text: "老天！谁能想得到！这个小妖精！哎呀，我妹妹——"
        - id: ch02-b18
          speaker: malemute_kid
          text: "你妹妹是英国姑娘，长着英国人的脚。玛德琳来自脚小的种族。鹿皮鞋只让她的脚自然宽了些。她小时候没有跟狗队奔跑，脚形也没走样。"
        - id: ch02-b19
          speaker: narrator
          text: "这解释压不住普林斯的赞叹，也触动了哈林顿做买卖的本能。他望着那线条优美的脚与脚踝，脑中又响起那张寒酸的清单：一支枪，一条毯子，二十瓶酒。玛德琳是国王的妻子。她丈夫的黄色财富足以买下二十个时髦傀儡，她这一生却只穿过红鞣鹿皮。起初，她敬畏地望着白缎舞鞋，很快又读懂三个男人眼里的欣赏，脸上泛起骄傲的红晕。她一时沉醉于自己的美，随后低声说道。"
        - id: ch02-b20
          speaker: madeline
          text: "而且，那支枪还是坏的。"
          emotion: disgusted
        - id: ch02-b21
          speaker: narrator
          text: "训练就这样继续。小子每天带她出去走很长的路，专心矫正她的体态，也让她把步幅收小。她的身份几乎没有被发现的可能。卡尔和其他老北地人混在蜂拥而来的无数陌生人中，简直像一群迷路的孩子。何况，北国严霜有一条刻毒的舌头。南方来的娇嫩女人为了保护脸颊，不受它啃咬，常常戴上帆布面罩。脸被遮住，身体又完全埋进松鼠皮风雪衣，即便母亲和女儿在雪道上迎面相逢，也会把彼此当成陌生人擦肩而过。"
        - id: ch02-b22
          speaker: narrator
          text: "训练起初缓慢，后来突然加速。玛德琳穿上白缎舞鞋，也在那一刻找到了自己。她身上原有一份天生自尊，还有一份来自白人父亲的骄傲，此刻才真正醒来。从前，她总当自己是低人一等的异族女子，靠丈夫恩宠才被买进家门。丈夫像神，凭自己的神力把毫无长处的她抬到身边。即使生下小卡尔，她仍记得自己与他不是同类。他是神，他族中的女人自然都是女神。她会把自己与她们对照，却从不敢真正比较。"
        - id: ch02-b23
          speaker: narrator
          text: "也许熟悉真会生出轻慢。不管是什么缘故，她渐渐看懂了那些漂泊的白人男人，也学会掂量他们。她虽不擅长有意识地分析，却有女人在这类事上的清明眼光。舞鞋之夜，她看见三位男性朋友毫不掩饰的热烈欣赏，第一次想到要拿自己与那些白人女人比较。眼前虽然只是一只脚、一段脚踝，可一旦开始比较，照事情本来的道理，就不可能停在这里。她按这些男人的眼光衡量自己，直到白人姐妹身上的神性彻底破碎。说到底，她们也只是女人。既然如此，自己为什么不能抬起头，站到她们中间？在这个过程中，她看清自己还欠缺什么。而知道了弱处，她反而得到了力量。她练得那样拼命，常叫三个教练到了深夜还在惊叹，女人真是个永远解不开的谜。"
        - id: ch02-b24
          speaker: narrator
          text: "感恩节越来越近。贝特尔斯偶尔从斯图尔特河捎来小卡尔安好的消息，归期也快到了。有人听见舞曲和打拍子的脚步，忽然推门，只会看见哈林顿拉琴，另两人跟着打拍子，或为一个舞步吵闹。玛德琳早已逃进里屋。有一晚，卡尔突然来了。那天刚收到令人放心的消息，玛德琳也表现得格外出色。她不只步态优雅，还显出女人的俏皮。她与男人们机敏斗嘴，又趁着兴头连吓带哄，把他们治得服服帖帖。三个男人不由得低头，臣服的不是美貌、智慧或机锋，而是女人身上那种无人说得出名字的力量。"
        - id: ch02-b25
          speaker: narrator
          text: "她与普林斯旋转着跳当晚最后一支舞，满屋都是纯粹的欢乐，几乎叫人眩晕。就在不久前，她还用女性的俏皮同三个男人斗嘴。她先机敏地挡住他们的每一句话，随后又被当时的兴奋和自己的力量灌醉。她时而欺负他们，时而压住他们，时而哄他们，时而摆出高高在上的宠爱口气，每一种手段都用得出奇成功。三个男人也不由自主地低下头。他们臣服的不是她的美貌，不是她的聪明，也不是她的机锋，而是女人身上那种男人无法说出名字、却总会向它让步的东西。此刻，哈林顿在小提琴上拉出难以想象的花腔，小子也彻底放开了，抓起扫帚，独自在一旁疯狂旋转跳跃。就在这个瞬间，大门被‘砰砰’两声重击敲得发颤。他们迅速交换目光，看见门闩正在抬起。不过，几个人早已应付过相似的险情。哈林顿连一个音符也没断。玛德琳闪身穿过等候的门，躲进里屋。那把扫帚也飞进铺位底下。等卡尔和路易·萨沃伊把脑袋探进来时，小子与普林斯已经紧紧搂在一起，沿着整间屋子疯狂地跳肖蒂什舞。"
        - id: ch02-b26
          speaker: narrator
          text: "印第安女人很少受点刺激便晕倒，玛德琳这次却几乎昏厥。她在地板上蜷了整整一小时，听男人们低沉的声音如远雷起伏。丈夫声音里的每一道抑扬、每一种习惯，都像童年歌谣中熟悉的和弦，一阵阵扑来，搅得她心房乱颤、双膝发软。最后她半昏半醒地倒在门边。幸好卡尔离开时，她已经既看不见，也听不见。"
        - id: ch02-b27
          speaker: malemute_kid
          text: "你打算什么时候回环城？"
        - id: ch02-b28
          speaker: cal_galbraith
          text: "我还没认真想过。大概要等到开河以后。"
        - id: ch02-b29
          speaker: malemute_kid
          text: "那玛德琳怎么办？"
        - id: ch02-b30
          speaker: narrator
          text: "卡尔脸上一红，目光忽然垂下。若小子不那么懂男人，也许会鄙视他。可这时，小子只憎恶那些来到北国的白人女人。她们抢走土著女人的位置还不够，又把肮脏念头塞进男人脑里，叫他们为自己的妻子羞耻。"
        - id: ch02-b31
          speaker: cal_galbraith
          text: "我想她过得不错。汤姆·迪克森替我照管产业，也会让她想要什么就有什么。"
        - id: ch02-b32
          speaker: narrator
          text: "小子突然按住他的手。两人已经来到屋外。极光像华美而放荡的女子，在头顶炫耀千变万化的颜色。小镇沉睡在脚下，远处一条孤独的狗扬声长嗥。卡尔又要说话，小子仍叫他安静。那声长嗥越来越响，一条狗接着一条狗加入，直到浑厚合唱摇撼整个夜晚。初次听见这诡异歌声的人，会从中知道北国最大也最古老的秘密。听惯的人，只会听见所有失败努力的庄严丧钟。那是受折磨灵魂的哀诉，载着北国世世代代的遗产与苦难。它既警告世上的迷途者，也为他们唱响安魂曲。"
        - id: ch02-b33
          speaker: narrator
          text: "歌声化作呜咽消散，卡尔微微发抖。小子看透他的心思，也随他回到饥荒和疾病肆虐的旧日。玛德琳一直在那里，陪他承受痛苦危险，从不怀疑，从不抱怨。严酷清晰的往事一幅幅闪过，伸出沉重手指，把他的心向后拉。时机正好。小子几乎想打出暗藏的牌，立刻赢下这一局，可眼下的教训还不够深，他忍住了。两人握手告别，国王穿着珠饰鹿皮鞋下山，积雪在脚下嘎吱抗议。"
        - id: ch02-b34
          speaker: narrator
          text: "此刻瘫坐在椅上的玛德琳，已不是一小时前那个笑声感染众人、双眼闪亮的调皮女人。小子皱眉。这样绝对不行。真正面对丈夫时，她必须拿出高高在上的气势，还得照白人女人的方式来，否则胜了也不算胜。他严厉开导她，毫不替自己的性别遮掩，把男人的弱点一一说破，直到她终于明白，男人说到底不过是一群傻瓜，也终于懂得女人的话为什么能成为法律。"
        - id: ch02-b35
          speaker: narrator
          text: "感恩节前几天，小子又拜访埃平韦尔太太。她马上把自己的女性饰物全翻检一遍，又去太平洋商业公司的布匹百货部逛了很久，然后跟小子回来结识玛德琳。木屋从此陷入前所未见的忙碌。女人们裁剪、试样、疏缝、缝合，还做许多在男人眼里既奇妙又无法理解的活。那几位男同谋动不动就被赶出门，只好穿过歌剧院的两道防风门，到里面消磨时间。他们实在太常凑头密谈，又为各种古怪名目喝得太深，闲汉们便嗅出了一条不为人知、富得无法估量的矿溪。几个新来客和至少一个老北地人，甚至把抢矿用的行囊存在酒吧后面，随时准备踏上雪道。"
        - id: ch02-b36
          speaker: narrator
          text: "埃平韦尔太太十分能干。感恩节之夜，她把玛德琳交还给教练时，玛德琳已经变得叫他们几乎不敢靠近。普林斯故作恭敬地披上哈得孙湾毯，那恭敬其实大半是真的。玛德琳挽住小子的手臂，小子费了好大劲才摆回老师的姿态。哈林顿脑中还滚动着购物清单，拖在最后，一路没开口。到了歌剧院后门，他们把毯子铺在雪上。她脱下借来的鹿皮鞋，穿白缎鞋踏上毯子。化装舞会正到高潮。她有些迟疑，三个男人却拉开门，把她推进去，再绕到正门入场。"
    - id: ch03
      title: 国王的妻子
      blocks:
        - id: ch03-b01
          speaker: old_timer
          text: "弗蕾达到底在哪儿？"
        - id: ch03-b02
          speaker: newcomer
          text: "弗蕾达又是谁？"
        - id: ch03-b03
          speaker: narrator
          text: "舞厅里到处是她的名字。头发斑白的‘酸面团小子’只是矿场工人，却以老资格为荣。他们有时向衣着齐整的新手摆前辈架子，把谎话说得天花乱坠——这种人本来就是拿真话当玩具的——有时又因新手无知而怒目相向。上游区和下游区约有四十位王者在场，人人都自信已经追上猎物，肯拿王国里的金沙为判断下注。称赌金的人忙不过来，又派去一名助手。几个精通概率的赌徒，则为全场候选人与热门人选开出赌盘。"
        - id: ch03-b04
          speaker: narrator
          text: "弗蕾达到底是谁？人们一再以为找到了‘希腊舞女’，每次发现都会震动赌局，想两头下注的人立刻登记新赌注。小子也加入寻找，全场轰然欢迎，因为人人认识他。他会看舞步，也会听嗓音，私下选中那个闪闪发亮的‘北极光’。可希腊舞女太狡猾，连他也看不穿。多数淘金客认定了全场最优雅的‘俄国公主’，觉得除了弗蕾达·莫卢夫不会是别人。"
        - id: ch03-b05
          speaker: narrator
          text: "一支方阵舞开始，众人忽然满意地大吼，说她找到了。过去每逢‘众人围成圆圈’，弗蕾达总有一种独门步法。领舞人刚发出口令，‘俄国公主’便跳出那道特殊节奏。满厅‘我早说过’震得屋梁发颤。谁知‘北极光’和‘极地精灵’也跳得一样好。接着，孪生‘幻日’和‘霜雪女王’都照样跳起来，赌局只好再派一名助手去称金沙。"
        - id: ch03-b06
          speaker: narrator
          text: "这时，贝特尔斯刚从雪道回来，裹着一阵严霜冲进人群。他一旋身，眉毛上的白霜便化成两道瀑布。冻硬的胡须像镶满钻石，把灯光折成五彩。冰块则从鹿皮鞋和德式袜上纷纷滚落，飞动的双脚踩在上面直打滑。北国舞会向来随意。常年奔波在矿溪和雪道上的男人，即使从前讲究过，如今也早把挑剔丢光。只有政府高官的小圈子还守些礼数。这里没有身份之别。百万富翁与穷光蛋、赶狗人与骑警，都拉着‘中央的女士们’围成圆圈，跳出种种叫人瞠目的怪动作。他们的欢乐原始、粗犷又喧闹，却没有无礼，反而有种未经打磨的骑士风度，比最精致的礼貌更真诚。"
        - id: ch03-b07
          speaker: narrator
          text: "卡尔四处寻找希腊舞女，设法与备受怀疑的俄国公主排进同一舞组。可只领她跳完一支舞，他便愿意拿自己的百万家财下注，赌她绝不是弗蕾达。他还敢断定，自己从前一定把手臂搂过她的腰。究竟在什么时候、什么地方，他却怎么也想不起。那股恼人的熟悉感把他搅得心神不宁，他便转而一心要查出公主的身份。小子本来可以帮忙，却只偶尔带公主转上几圈，压低声音认真交谈。真正向俄国公主献殷勤最勤的人是哈林顿。有一回，他把卡尔拉到旁边，胡乱猜她究竟是谁，又明说自己决心追到她。这话深深刺痛环城之王。男人天性并不专一，他顿时把玛德琳和弗蕾达全忘了，又追逐起眼前这个新目标。"
        - id: ch03-b08
          speaker: narrator
          text: "消息很快传遍舞厅，俄国公主并非弗蕾达。人们越发兴奋，眼前又有了崭新的谜。弗蕾达是他们认识却找不到的人，这位公主则是他们已经找到却完全不认识的人。连熟悉营地每位好舞者的女人也认不出她。许多人猜她属于官员的小圈子，只是跑出来做一件傻事。不少人断言，她一定会在揭面前消失。还有人同样坚信，她是《堪萨斯城星报》的女记者，专程来写他们，一栏稿费足有九十美元。各种猜测越传越热，称金沙的人也依旧忙个不停。"
        - id: ch03-b09
          speaker: narrator
          text: "凌晨一点，所有舞伴一起走进舞池。揭面开始了，笑声和欢呼声像一群无忧无虑的孩子。面具一张接一张掀开，‘噢’声和‘啊’声此起彼落，怎么也停不下来。光彩闪耀的‘北极光’原来是个身材壮硕的黑人洗衣妇。她替全城的人洗衣服，每月收入大约五百美元。孪生‘幻日’的上唇露出胡须，大家认出他们是黄金乡一对兄弟‘分数王’。最显眼的一个舞组也是最迟揭面的。卡尔和‘极地精灵’站在一边，哈林顿与‘俄国公主’站在对面。其他人都已经露出真容，‘希腊舞女’却依旧没有踪影。所有目光都落在他们身上，等着最后的谜底。"
        - id: ch03-b10
          speaker: narrator
          text: "众人齐声催促，卡尔掀起舞伴的面具。弗蕾达那张惊艳的脸和明亮双眼一下闪现在所有人面前。欢呼刚刚爆发，又忽然被压了下去，因为新的谜团更加吸引人。俄国公主仍把脸藏在面具后面，哈林顿正在同她拉扯。舞客们踮起脚尖，满怀期待地窃笑。他粗手粗脚地揉皱她的精致服装，然后——然后，全场狂欢的人一下炸开了锅。笑话原来落在他们自己头上。他们竟与一个被社会排斥、谁也不肯接纳的土著女人跳了一整夜。可是，在场认出她的人为数不少。那些人的笑声骤然停住，沉默迅速盖住整个大厅。"
        - id: ch03-b11
          speaker: narrator
          text: "卡尔怒气冲冲地大步走来，用夹杂多种语言的奇努克话对玛德琳开口。她却镇定自若，像没发现所有眼睛都盯着自己，只用英语回答。她既不惊慌，也不生气。小子见她如此从容，暗暗发笑。国王受阻，也落败了。那个被他看作普通西沃什女人的妻子，已经走到他追不上的地方。"
        - id: ch03-b12
          speaker: cal_galbraith
          text: "走，跟我回家。"
          emotion: angry
        - id: ch03-b13
          speaker: madeline
          text: "对不起，我答应了和哈林顿先生一起吃夜宵。再说，后面还有好几支舞等着我呢。"
          emotion: calm
        - id: ch03-b14
          speaker: narrator
          text: "哈林顿伸出手臂，准备领她离开。他丝毫不介意把自己的后背完全留给卡尔，不过这时小子已经悄悄挤到近处。环城之王惊呆了。他两次把手垂向腰带，小子也两次绷紧身体，准备扑上去。可那一对已经穿过餐厅门，里面摆着五美元一盘的牡蛎罐头。围观的人群齐声叹息，随即散开，重新分成一对对舞伴，跟着他们走进餐厅。弗蕾达撅起嘴，也和卡尔一道进去。她心肠不坏，却有一条又厉害又稳准的舌头，硬是让卡尔面前的牡蛎全没了滋味。没人需要知道她到底说了什么，只看见卡尔的脸一阵红、一阵白，一次又一次恶狠狠地咒骂自己。"
        - id: ch03-b15
          speaker: narrator
          text: "餐厅原本人声鼎沸。卡尔走到妻子桌前，所有声音突然停下。揭面以后，许多人已经拿金沙押注最后的结果。大家屏住呼吸。哈林顿的蓝眼睛稳稳不动，垂下的桌布下面，一把史密斯—韦森手枪平放在他膝头。玛德琳只是漫不经心地抬眼。"
        - id: ch03-b16
          speaker: cal_galbraith
          text: "下——下一支圆舞，我可以请你跳吗？"
        - id: ch03-b17
          speaker: narrator
          text: "国王的妻子低头看了看舞会卡，微微点头。"
