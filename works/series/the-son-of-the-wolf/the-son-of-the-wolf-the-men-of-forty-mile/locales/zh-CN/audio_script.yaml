audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静克制，带着北国故事的冷峻与悲悯
        timbre: 温厚清晰，略带风霜感
        pace: 舒缓而有张力
        pitch: 中低
    scruff_mackenzie:
      display_name: “乱发”麦肯齐
      tts:
        delivery: 粗犷镇定，话语直接，威胁中带冷幽默
        timbre: 结实低沉，饱经风霜
        pace: 稳健利落
        pitch: 中低
    lon_mcfane:
      display_name: 朗·麦克费恩
      tts:
        delivery: 爱尔兰口吻鲜明，热烈善辩，发怒时急促有力
        timbre: 明亮粗粝
        pace: 偏快
        pitch: 中
    bettles:
      display_name: 贝特尔斯
      tts:
        delivery: 固执冷硬，讥诮中带着边地人的直率
        timbre: 干涩结实
        pace: 中等偏慢
        pitch: 中低
    sitka_charley:
      display_name: 锡特卡·查理
      tts:
        delivery: 简短警醒，沉着敏锐
        timbre: 清硬稳健
        pace: 利落
        pitch: 中
    malemute_kid:
      display_name: 马拉缪特小子
      tts:
        delivery: 从容果断，冷静中含着不动声色的幽默
        timbre: 温厚坚定
        pace: 稳健
        pitch: 中低
    father_roubeau:
      display_name: 鲁博神父
      tts:
        delivery: 温和郑重，劝诫时耐心而坚定
        timbre: 柔和醇厚
        pace: 舒缓
        pitch: 中低
    camp_man:
      display_name: 营地汉子
      tts:
        delivery: 粗犷警觉，遇险时短促高亢
        timbre: 沙哑有力
        pace: 明快
        pitch: 中
  chapters:
    - id: ch01
      title: 锚冰之争
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "大个子吉姆·贝尔登随口说，碎冰这东西挺古怪。他哪里想得到，这句话会闹出多大的事。朗·麦克费恩马上说，锚冰才更古怪。贝特尔斯却一口咬定，根本没有什么锚冰，那只是吓唬人的鬼话。"
        - id: ch01-b02
          speaker: lon_mcfane
          text: "你在北国混了这么多年，竟然还说这种话！咱们同锅吃饭都不知多少日子了。"
        - id: ch01-b03
          speaker: bettles
          text: "可锚冰不合道理。水总比冰暖和，因为水还没冻住。你倒说，它会先在河底结冰？"
        - id: ch01-b04
          speaker: lon_mcfane
          text: "水是比冰暖和，可一脚踩穿以后，那点差别也救不了谁。只有锚冰会在河底结，大卫。你没顺河漂过吗？水清得像玻璃，忽然像有云遮了太阳，碎冰从水底直往上冒，最后铺满两岸之间，像刚落过一场雪。"
        - id: ch01-b05
          speaker: bettles
          text: "见过不止一回，都是我在舵桨边打盹的时候。不过冰是从最近的岔河口漂出来的，可不是从河底冒出来的。"
        - id: ch01-b06
          speaker: lon_mcfane
          text: "这么说，你掌舵时从不打盹？"
        - id: ch01-b07
          speaker: bettles
          text: "不打盹，你也一样。锚冰不合道理，问谁都一样。"
        - id: ch01-b08
          speaker: narrator
          text: "贝特尔斯望向火炉边的众人，想找人评理。可争执已经牢牢拴在他和朗之间，旁人插不上手。"
        - id: ch01-b09
          speaker: lon_mcfane
          text: "你讲道理也好，不讲也好，我说的都是真事。一年以前的秋天，我和锡特卡·查理从雷利安斯堡下边那道浅滩往下漂，那地方你一定记得。阳光照着金黄的落叶松和颤动的白杨，每道水纹都闪着光。远处，冬天和北方的蓝雾正一道走来。河边已经镶上白边，回水湾里结了厚冰。空气又脆又亮，冷意透过全身的血，每吸一口，整个人都像重新得了一截命。那时候，我的好小子，天地会忽然变小，远游的念头会一把缠住你的脚。"
        - id: ch01-b10
          speaker: narrator
          text: "朗说着说着，自己也知道扯远了，便又回到那天的河上。"
        - id: ch01-b11
          speaker: lon_mcfane
          text: "我们正划着船，除了回水湾边，一点冰也没有。忽然查理抬起桨，大声叫我往下看。"
        - id: ch01-b12
          speaker: sitka_charley
          text: "朗·麦克费恩！看水底！"
        - id: ch01-b13
          speaker: lon_mcfane
          text: "这种事我只听说过，从没想过能亲眼见到。查理也不是生在北国的，同样没见过。我们索性不划了，让船自己漂，一人探向一边，透过亮晶晶的河水往下看。那情形就像我从前跟采珠人看海底的珊瑚园，眼看一座座花园在水下生长。锚冰一团团、一簇簇，附在每块石头上，活像白珊瑚。可最好的还在后头。刚过浅滩尾，河水一下成了奶白色。水面冒起小圆圈，像春天的茴鱼浮上来，又像天上落了雨点。那是锚冰在往上浮，左边右边，一直铺到人眼看不到的地方。"
        - id: ch01-b14
          speaker: lon_mcfane
          text: "它稠得像一锅粥，擦着桦树皮船身流过去，又像胶一样黏住船桨。那道浅滩我前前后后走过许多回，却再也没见过同样的景象。真是一生只有一次的奇观。"
        - id: ch01-b15
          speaker: bettles
          text: "讲得可真像！你以为我会信？依我看，是水光晃坏了你的眼睛，冷空气又闪快了你的舌头。"
        - id: ch01-b16
          speaker: lon_mcfane
          text: "我这双眼睛亲眼看见的。查理若在这儿，也会替我作证。"
        - id: ch01-b17
          speaker: bettles
          text: "事实就是事实，谁也绕不过去。离空气最远的水反倒先冻起来，哪有这种道理？你说是亲眼看见，也改变不了这个道理。别急着发火。"
        - id: ch01-b18
          speaker: narrator
          text: "可朗那股来得飞快的凯尔特怒火，已经升了起来。"
        - id: ch01-b19
          speaker: lon_mcfane
          text: "那么，你是不信我了？"
        - id: ch01-b20
          speaker: bettles
          text: "既然你非逼我说，那我不信。我宁愿信自然，也信事实。"
        - id: ch01-b21
          speaker: lon_mcfane
          text: "你这是说我撒谎？去问问你那个西沃什老婆吧，让她评评我说的是不是真话。"
        - id: ch01-b22
          speaker: narrator
          text: "贝特尔斯顿时发了怒。朗无意中刺中了他的痛处。贝特尔斯的妻子是俄国皮货商的混血女儿，两人在育空河下游大约一千英里外的努拉托希腊教会正式成婚。她的出身和身份，比寻常的西沃什女人，也就是当地土著妻子高得多。这是北国一个极细微的分别，离开那里便显得无关紧要，却只有真正闯荡过北国的人才懂。"
        - id: ch01-b23
          speaker: bettles
          text: "你要把我的话当成骂你撒谎，那就这么当吧。"
        - id: ch01-b24
          speaker: narrator
          text: "下一刻，朗一拳把贝特尔斯打倒在地。炉边的人群立刻散开，五六个汉子抢进两人中间。贝特尔斯站起来，抹去嘴边的血。"
        - id: ch01-b25
          speaker: bettles
          text: "拳头我挨过，也还过。你别以为这笔账就这么算了。"
        - id: ch01-b26
          speaker: lon_mcfane
          text: "我这辈子从没让活人骂过骗子。只要我还活着，你想怎么清账，我都等着奉陪。"
        - id: ch01-b27
          speaker: bettles
          text: "你的三八五五还在吗？你最好换支更像样的枪。我的子弹能在你身上打出核桃大的洞。"
        - id: ch01-b28
          speaker: narrator
          text: "朗点了点头。"
        - id: ch01-b29
          speaker: lon_mcfane
          text: "别担心。我的软头子弹会自己闻着路走，从你背后钻出来时，准摊得像烙饼。什么时候让我等你？冰窟窿边挺合适。"
        - id: ch01-b30
          speaker: bettles
          text: "地方不赖。一小时后到那儿，你不会等我太久。"
        - id: ch01-b31
          speaker: narrator
          text: "两人戴好手套，走出贸易站，伙伴们追着劝，他们却像没听见。事情本来小得不能再小，可脾气暴烈、性情执拗的人一旦把它养大，很快就会开出大祸。那时，人们还不懂用火烧穿冻土、一直烧到基岩去采矿。四十英里的汉子被漫长的北极冬季困住，吃得太饱，又闲得无事可做，便像秋日里挤满蜂蜜的蜂房一样焦躁易怒。"
    - id: ch02
      title: 一条新规矩
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "这片土地没有法律，骑警也还没有到来。每个人都自己衡量别人对他的冒犯有多重，再亲手量出相应的惩罚。众人很少需要联手；四十英里营地那段漫长而阴沉的历史里，也从没人违犯《十诫》第八条，偷走别人的东西。大个子吉姆临时召集会议，推“乱发”麦肯齐做主席，又派人去请鲁博神父出面帮忙。"
        - id: ch02-b02
          speaker: narrator
          text: "大伙儿都明白自己的矛盾。他们有力量，完全可以凭着强力阻止决斗，也确实想这样做，可这又违背了他们信奉的规矩。那套粗陋陈旧的规矩认定，每个人都有权用拳头偿还拳头，自己洗清受过的侮辱。但他们无法眼看贝特尔斯和麦克费恩这两个好伙伴拿性命相搏。他们平日总说，受了挑衅不肯打的是懦夫；真到有人要打时，却又觉得让他去打实在不对。"
        - id: ch02-b03
          speaker: narrator
          text: "门外忽然响起鹿皮鞋的奔跑声和叫喊，最后又是一枪。防风门打开了，马拉缪特小子走进来。手里的柯尔特还冒着烟，眼里却带着笑。"
        - id: ch02-b04
          speaker: malemute_kid
          text: "打中了。乱发，是你的狗。"
        - id: ch02-b05
          speaker: scruff_mackenzie
          text: "黄牙？"
        - id: ch02-b06
          speaker: malemute_kid
          text: "不是，是那条耷拉耳朵的。出来看看。"
        - id: ch02-b07
          speaker: scruff_mackenzie
          text: "见鬼，它本来好端端的。那就没错了，它也染上了。黄牙今早回来，从它身上咬掉一大块肉，还差点让我成了鳏夫。它转头又扑扎林斯卡，她赶紧把裙子甩到它脸上，这才逃掉。裙子没保住，人也结结实实滚进雪里。后来黄牙又钻进林子。真希望它别回来。你损失狗了吗？"
        - id: ch02-b08
          speaker: malemute_kid
          text: "损失了一条，狗队里最好的舒库姆。它今早忽然发狂，不过没跑多远，就一头撞上查理的狗队，被那些狗撕得满街都是。如今查理的狗也有两条挣脱了，疯得厉害。黄牙这一口，祸就这样传开了。再不想办法，等到春天，狗剩不了几条。"
        - id: ch02-b09
          speaker: scruff_mackenzie
          text: "人也剩不了几个。"
        - id: ch02-b10
          speaker: malemute_kid
          text: "怎么了？这次是谁出事？"
        - id: ch02-b11
          speaker: scruff_mackenzie
          text: "贝特尔斯和朗争起来了。几分钟后，他们要去冰窟窿边解决。"
        - id: ch02-b12
          speaker: narrator
          text: "众人把经过讲了一遍。马拉缪特小子向来发号施令，伙伴们也向来听从。他很快想出一个办法，大家答应完全照办。"
        - id: ch02-b13
          speaker: malemute_kid
          text: "我们不是真的夺走他们决斗的权利。不过等他们看懂这个办法有多妙，我想他们就不会打了。人生是赌局，男人是赌徒。哪怕只有一千分之一的机会，他们也会押上全部家当。可要把那一点机会也拿走，他们就不会下注。"
        - id: ch02-b14
          speaker: malemute_kid
          text: "掌柜的，量三英寻最好的半英寸马尼拉麻绳。我们今天立下的规矩，要叫四十英里的人一直守到世界末日。"
        - id: ch02-b15
          speaker: narrator
          text: "他把绳子盘在手臂上，领着众人出门，恰好迎上决斗的两位主角。贝特尔斯正冲着一个劝他的朋友怒吼。"
        - id: ch02-b16
          speaker: bettles
          text: "他有什么资格把我妻子扯进来？这话本来就不该说，不该说！"
        - id: ch02-b17
          speaker: narrator
          text: "贝特尔斯来回踱步，等着朗。另一边，朗脸上发热，语速飞快，竟当着教会的面闹起了反叛。"
        - id: ch02-b18
          speaker: lon_mcfane
          text: "神父，就算将来让我裹着火焰，背朝下躺在煤床上，我心里也舒坦。谁也别想说，朗·麦克费恩被人骂成骗子，却连一根手指都没抬！我也不要祝福。这些年我活得野，可我的心一直没放错地方。"
        - id: ch02-b19
          speaker: father_roubeau
          text: "朗，问题不在你的心。是傲慢催着你去杀自己的同伴。"
        - id: ch02-b20
          speaker: lon_mcfane
          text: "你是法国人。要是我运气不好，你会替我做弥撒吗？"
        - id: ch02-b21
          speaker: narrator
          text: "神父只是笑了笑，穿着鹿皮鞋迈上沉寂河流雪白的胸膛。通往冰窟窿的小路已经踩实，只有十六英寸宽的雪橇那么宽，两旁全是深软的雪。众人只能排成单列，一声不响地往前走。披着黑色圣带的神父走在队伍中间，使这场奇怪的仪式有了葬礼般的肃穆。"
        - id: ch02-b22
          speaker: narrator
          text: "这一天对四十英里来说算暖和，水银柱爬到了少见的零下二十度。沉甸甸的天空却越压越低，这点暖意里没有半点欢快。高处几乎无风，云层纹丝不动，阴沉地预告着一场来得很早的雪。大地对此毫无回应，也不作任何准备，只管安静地睡着自己的冬觉。"
        - id: ch02-b23
          speaker: narrator
          text: "到了冰窟窿边，贝特尔斯显然把争吵重新想了一路，最后又憋出一句，那话本来就不该说。朗阴沉地沉默着，愤怒堵得他说不出话。可只要暂时忘掉自己的委屈，两人都在暗暗奇怪。"
        - id: ch02-b24
          speaker: narrator
          text: "他们本以为伙伴们会坚决拦阻。大伙儿这样默许，反倒伤了他们。那些一向亲近的弟兄，理应为他们再多做一点什么，如今却像赶节庆一样出来，看他们互相开枪，连一句反对的话也没有。两人仿佛忽然不再受营地看重，心里生出一种说不清的委屈，也越来越困惑。"
    - id: ch03
      title: 没有胜算的赌局
      blocks:
        - id: ch03-b01
          speaker: lon_mcfane
          text: "背靠背站好，大卫。每人走五十步，还是一百步？"
        - id: ch03-b02
          speaker: bettles
          text: "五十步。"
        - id: ch03-b03
          speaker: narrator
          text: "这两个字从贝特尔斯喉咙里挤出来，又短又利，满是杀气。可朗一眼看见马拉缪特小子手臂上那卷崭新的麻绳。绳子并没有刻意摆出来，却叫他心里猛然生出疑惧。"
        - id: ch03-b04
          speaker: lon_mcfane
          text: "你拿那根绳子做什么？"
        - id: ch03-b05
          speaker: malemute_kid
          text: "快一点。我屋里还烤着面包，不想让它塌下去。再说，我的脚都快冻僵了。"
        - id: ch03-b06
          speaker: narrator
          text: "其余的人也各用自己的方式表示不耐烦。可朗盯住那卷绳子不放，贝特尔斯也转过身来。鲁博神父这才明白整个办法的妙处，嘴角刚动，便赶紧举起戴手套的手，挡住自己的笑容。"
        - id: ch03-b07
          speaker: lon_mcfane
          text: "可这是一根崭新的绳子啊，小子。你的面包总不会重到要用它吊起来吧？"
        - id: ch03-b08
          speaker: malemute_kid
          text: "不是，朗。这绳子是给人用的。"
        - id: ch03-b09
          speaker: bettles
          text: "给什么人？"
        - id: ch03-b10
          speaker: malemute_kid
          text: "给另外那个人。听好，朗，贝特尔斯，你也听好。我们谈过你们这点小麻烦，已经有了结论。我们无权阻止你们决斗。"
        - id: ch03-b11
          speaker: lon_mcfane
          text: "说得对，好小子！"
        - id: ch03-b12
          speaker: malemute_kid
          text: "我们也不会阻止。不过我们能做一件事，也一定会做。这场决斗必须成为四十英里有史以来唯一的一场，也要给每个沿育空河来去的契查夸新手立个榜样。谁没被枪打死，我们就把谁吊上最近的树。现在，请开始吧。"
        - id: ch03-b13
          speaker: narrator
          text: "朗先是迟疑地笑，接着脸上亮了起来。"
        - id: ch03-b14
          speaker: lon_mcfane
          text: "量步子吧，大卫。五十步，转身开枪，不倒下一个绝不停。他们心软，根本下不了手。你该看得出来，这只是美国佬在虚张声势。"
        - id: ch03-b15
          speaker: narrator
          text: "朗得意地要走，马拉缪特小子却把他叫住。"
        - id: ch03-b16
          speaker: malemute_kid
          text: "朗，你认识我很久了吧？贝特尔斯，你呢？"
        - id: ch03-b17
          speaker: lon_mcfane
          text: "有许多年了。"
        - id: ch03-b18
          speaker: bettles
          text: "明年六月涨水时，就整整五年。"
        - id: ch03-b19
          speaker: malemute_kid
          text: "这些年里，你们见过我哪一次说话不算数吗？听别人讲过我失信吗？"
        - id: ch03-b20
          speaker: narrator
          text: "两人都摇头，还在猜这番话后面究竟藏着什么。"
        - id: ch03-b21
          speaker: malemute_kid
          text: "那么，我许下的诺言有多可靠？"
        - id: ch03-b22
          speaker: bettles
          text: "跟你签字画押一样可靠。"
        - id: ch03-b23
          speaker: lon_mcfane
          text: "把升天堂的指望拴在上面，也尽管放心。"
        - id: ch03-b24
          speaker: malemute_kid
          text: "那就听清楚。我，马拉缪特小子，向你们保证。你们知道这句话有多重。枪响以后，没被打死的那个，十分钟内一定会吊上绳子。"
        - id: ch03-b25
          speaker: narrator
          text: "他说完向后退去，仿佛彼拉多洗过双手，已经撇清了罪责。四十英里的汉子全都停住，四下没有一点声音。天空压得更低，撒下一阵水晶般的霜花。每一片都是完美而精巧的几何图案，落下时像呼吸一样短暂，可一旦落定，却要一直留到归来的太阳走完北方一半路程。"
        - id: ch03-b26
          speaker: narrator
          text: "朗和贝特尔斯都曾带头冲过九死一生的险阵。他们冲锋时，嘴边不是咒骂就是笑话，心底却始终坚信机遇之神会留下一线机会。可眼下这场赌局把那位仁慈的神彻底关在了门外。他们来回审视马拉缪特小子的脸，就像凝望斯芬克斯，什么也看不出来。"
        - id: ch03-b27
          speaker: narrator
          text: "安静的时间一点点过去。周围所有人都等着，朗和贝特尔斯也越来越觉得，这阵沉默必须由他们来打破，非说点什么不可。忽然，一条狼狗从四十英里方向发出长嗥，一下劈开寂静。那古怪的声音带着一颗心碎裂时的全部哀痛，越升越高，最后又低下去，化成一声拖得很长的呜咽。"
        - id: ch03-b28
          speaker: bettles
          text: "我可真见鬼了！"
        - id: ch03-b29
          speaker: narrator
          text: "贝特尔斯竖起麦基诺呢夹克的衣领，束手无策地望望四周。"
        - id: ch03-b30
          speaker: lon_mcfane
          text: "这赌局摆得真漂亮，小子。庄家占尽便宜，下注的人一点胜算都没有。这样的稳赢买卖，连魔鬼都不接，我朗也不干！"
        - id: ch03-b31
          speaker: narrator
          text: "笑声在众人喉咙里咕噜作响，又被强压回去。彼此递出的眼色，也像被睫毛边结着的白霜擦掉了。大伙儿踩着冰岸上凿出的缺口爬上去，穿过街道，重新朝贸易站走去。"
    - id: ch04
      title: 黄牙来了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "刚才那声长嗥越来越近，还多了一股凶险的意味。拐角后面有个女人尖叫起来。"
        - id: ch04-b02
          speaker: camp_man
          text: "它来了！"
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: "一个印第安男孩冲进人群，前面领着六条吓破胆的狗，像在同死神赛跑。黄牙紧追在后，全身的毛根根竖起，奔跑中只剩一道闪过的灰影。人群一下炸开，除了贝特尔斯这个美国佬，所有人都逃了。"
        - id: ch04-b04
          speaker: narrator
          text: "男孩跑到人群中间时绊倒了。贝特尔斯本来已经可以逃开，却停下来，抓住孩子宽松的毛皮衣，把他整个提起来，这才转身奔向一堆劈柴。几个伙伴早已慌忙爬到上面，正从高处看着。黄牙先追着一条逃跑的狗绕出去，随即猛然掉头，又朝贝特尔斯飞扑回来。"
        - id: ch04-b05
          speaker: narrator
          text: "逃命的狗没有狂犬病，却吓得发疯。它猛地撞倒贝特尔斯，沿街一闪而去。马拉缪特小子仓促开枪。子弹把黄牙掀得在空中翻了半圈，仰面落下，却没能阻住它。疯狗接着只一跃，就跨过了它和贝特尔斯之间一半的距离。"
        - id: ch04-b06
          speaker: narrator
          text: "就在那致命的一扑落下前，朗·麦克费恩从柴堆上纵身跳下，在半空迎头撞上黄牙。一人一狗翻滚在雪地里。朗把手臂伸到最直，死死扼住疯狗的喉咙，尽力让獠牙离自己远些。腥臭的唾沫仍喷了他一脸，逼得他不停眨眼。"
        - id: ch04-b07
          speaker: narrator
          text: "贝特尔斯已经拔出左轮手枪，却没有贸然开火。他冷静地等着，直到疯狗挣扎时露出不会误伤朗的机会，才一枪结束了这场搏斗。朗站起来，把钻进两只袖筒里的雪一点点抖掉。"
        - id: ch04-b08
          speaker: lon_mcfane
          text: "这回的赌局很公平，小子。我这个下注的人，也拿到了相当不错的胜算。"
        - id: ch04-b09
          speaker: narrator
          text: "那天夜里，朗离开伙伴，独自朝鲁博神父的木屋走去。他刚从疯狗嘴下捡回一条命，也放下了同贝特尔斯的决斗，现在要去寻找教会宽恕的怀抱。与此同时，贸易站这边还有一个问题没有答案。马拉缪特小子为它说了很久，绕来绕去，还是没能把话讲明白。"
        - id: ch04-b10
          speaker: scruff_mackenzie
          text: "可要是他们真的开了枪，你会不会把活着的人吊死？"
        - id: ch04-b11
          speaker: malemute_kid
          text: "我什么时候说话不算数了？"
        - id: ch04-b12
          speaker: scruff_mackenzie
          text: "你没有失信过，可我问的不是这个。直接回答我，你会不会？"
        - id: ch04-b13
          speaker: narrator
          text: "马拉缪特小子挺直了身子。"
        - id: ch04-b14
          speaker: malemute_kid
          text: "乱发，从那以后，我一直在问自己这个问题。可是……"
        - id: ch04-b15
          speaker: scruff_mackenzie
          text: "可是怎样？"
        - id: ch04-b16
          speaker: malemute_kid
          text: "到现在，我还没找到答案。"
