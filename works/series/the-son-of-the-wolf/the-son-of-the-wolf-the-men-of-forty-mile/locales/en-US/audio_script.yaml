  chapters:
    - id: ch01
      title: Ice Beneath the River
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Big Jim Belden remarked that mush ice was rather peculiar. He had no idea what that harmless thought would start. Lon McFane answered that anchor ice was stranger still. Bettles disagreed at once. He said there was no such thing.
        - id: ch01-b02
          speaker: lon_mcfane
          text: "You can say that after all your years in this country? And after all the days we've eaten from the same pot?"
          emotion: surprised
        - id: ch01-b03
          speaker: bettles
          text: "The whole thing goes against reason. Water is warmer than ice."
        - id: ch01-b04
          speaker: lon_mcfane
          text: "Not by much when you break through it."
        - id: ch01-b05
          speaker: bettles
          text: "It's still warmer because it isn't frozen. And you expect me to believe it freezes at the bottom?"
        - id: ch01-b06
          speaker: lon_mcfane
          text: "Anchor ice does, David. Haven't you ever drifted on water clear as glass, then seen mush ice bubble up until it covered the river from bank to bank like the first snow?"
        - id: ch01-b07
          speaker: bettles
          text: "More than once, when I dozed at the steering oar. But it always came from the nearest side channel. It didn't bubble up."
        - id: ch01-b08
          speaker: lon_mcfane
          text: "And you never once nodded off at the helm?"
        - id: ch01-b09
          speaker: bettles
          text: "No, and neither did you. It makes no sense. Ask any man here."
        - id: ch01-b10
          speaker: narrator
          text: Bettles appealed to the men around the stove, but the quarrel now belonged to him and Lon.
        - id: ch01-b11
          speaker: lon_mcfane
          text: "Reason or no reason, I'm telling you the truth. A year ago last fall, Sitka Charley and I saw it below Fort Reliance, at that riffle you remember. It was ordinary fall weather. Sunlight lay on the golden larches and trembling aspens, and every ripple shone. Beyond us, winter and the blue northern haze were coming down together. Ice made a fringe along the river and thickened in the eddies. The air had such a snap and sparkle that you felt it through your whole body. Every breath gave you new life. On a day like that, my boy, the world feels small, and wanderlust catches you by the heels."
        - id: ch01-b12
          speaker: lon_mcfane
          text: "But there I go wandering again. We were paddling past the riffle, with no sign of ice except along the eddies. Sitka Charley suddenly lifted his paddle and called, ‘Lon McFane, look below!’ I'd heard of such a thing, but never thought I'd see it myself. Neither Sitka Charley nor I was born in this country, so the sight was new to us both. We let the canoe drift and leaned over opposite sides, staring down through the sparkling water. It took me back to my days with the pearl fishers, when I watched coral banks growing like gardens beneath the sea. And there it was. Anchor ice clung to every rock and gathered in clusters, exactly like white coral."
        - id: ch01-b13
          speaker: lon_mcfane
          text: "Then came the finest part. Just beyond the tail of the riffle, the water suddenly turned the color of milk. Little circles covered the surface, like grayling rising in spring or raindrops striking from above. The anchor ice was coming up. It spread to the right and the left as far as any man could see, until the whole water was covered. It slid along the bark of the canoe like porridge and stuck to our paddles like glue. I've run that very riffle many times before and many times since, but I've never caught another glimpse of it. It was the sight of a lifetime."
        - id: ch01-b14
          speaker: bettles
          text: "Is that so? You think I'll swallow a story like that? The glitter got into your eyes and the sharp air loosened your tongue."
        - id: ch01-b15
          speaker: lon_mcfane
          text: "I saw it with my own eyes. Sitka Charley would say the same if he were here."
        - id: ch01-b16
          speaker: bettles
          text: "Facts are facts. Water farthest from the air can't freeze first."
        - id: ch01-b17
          speaker: lon_mcfane
          text: "But I saw it—"
        - id: ch01-b18
          speaker: bettles
          text: "Don't get so heated."
        - id: ch01-b19
          speaker: narrator
          text: Lon's quick Irish temper was already rising.
        - id: ch01-b20
          speaker: lon_mcfane
          text: "So you don't believe me?"
        - id: ch01-b21
          speaker: bettles
          text: "Since you're pushing me for an answer, no. I'll believe nature and facts first."
    - id: ch02
      title: A Quarrel Becomes a Duel
      blocks:
        - id: ch02-b01
          speaker: lon_mcfane
          text: "Are you calling me a liar? Ask that Siwash wife of yours. I'll trust her to tell you I spoke the truth."
          emotion: angry
        - id: ch02-b02
          speaker: narrator
          text: Bettles flared with sudden rage. Lon had struck a wound without knowing it. Bettles's wife was the daughter of a Russian fur trader and a native woman. They had married at the Greek Mission in Nulato, far down the Yukon. In the North, that placed her well above the common native wives, though only a northern adventurer would have understood the difference.
        - id: ch02-b03
          speaker: bettles
          text: "You can take it that way."
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: In the next instant, Lon knocked Bettles flat. The circle around the stove broke apart, and half a dozen men jumped between them.
        - id: ch02-b05
          speaker: bettles
          text: "I've taken blows before and paid them back. Don't think for a moment this won't be settled."
          emotion: angry
        - id: ch02-b06
          speaker: lon_mcfane
          text: "I've never taken the lie from any man alive. Whenever you want help paying your debt, I'll be waiting. Choose any way you please."
          emotion: angry
        - id: ch02-b07
          speaker: bettles
          text: "Still carrying that thirty-eight fifty-five?"
        - id: ch02-b08
          speaker: narrator
          text: Lon nodded.
        - id: ch02-b09
          speaker: bettles
          text: "You'd better find a stronger gun. Mine will tear holes through you as big as walnuts."
        - id: ch02-b10
          speaker: lon_mcfane
          text: "Don't worry. My soft-nosed bullets know the way, and they'll spread wide when they come out the other side. When shall I wait on you? The waterhole would do nicely."
        - id: ch02-b11
          speaker: bettles
          text: "The waterhole it is. Be there in an hour. You won't wait long."
        - id: ch02-b12
          speaker: narrator
          text: Both men pulled on their mittens and left the Post. Their comrades called after them and tried to object, but neither fighter would listen. The cause was such a little thing. With men like these, though, quick tempers and stubborn natures could feed a little thing until it flowered into something enormous.
        - id: ch02-b13
          speaker: narrator
          text: The men of Forty Mile had little work to occupy them. The method of lighting fires to thaw the frozen earth all the way down to bedrock still belonged to the future. So the long Arctic winter shut them in. They ate too much, had too little to do, and grew as irritable as autumn bees when their hive is packed tight with honey.
        - id: ch02-b14
          speaker: narrator
          text: There was no law in the land. The mounted police belonged to the future too. Each man measured an offense by how it touched him, then handed out the punishment himself. Only rarely had the camp needed to act together. And through all its bleak history, no one there had ever broken the eighth commandment by stealing.
        - id: ch02-b15
          speaker: narrator
          text: Big Jim Belden called a meeting on the spot. Scruff Mackenzie became temporary chairman, and a messenger hurried away to ask Father Roubeau for help. The men knew they were caught in a contradiction. By sheer strength, they could step between Lon and Bettles and stop the duel. That was exactly what they wanted to do. Yet it went against their own beliefs. Their rough old code said each man had the right to wipe out a blow with another blow. They would call any man a coward if he refused to fight after being provoked. Now that the test had truly come, it seemed just as wrong for him to fight. Above all, they could not bear to see two good comrades meet in a battle to the death.
    - id: ch03
      title: Malemute Kid's Plan
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Running moccasins, loud shouts, and a pistol shot cut through the meeting. The storm doors swung open. Malemute Kid stepped inside with a smoking Colt in his hand and amusement in his eyes.
        - id: ch03-b02
          speaker: malemute_kid
          text: "I got him. It was your dog, Scruff."
        - id: ch03-b03
          speaker: scruff_mackenzie
          text: "Yellow Fang?"
        - id: ch03-b04
          speaker: malemute_kid
          text: "No, the one with the drooping ears."
        - id: ch03-b05
          speaker: scruff_mackenzie
          text: "The devil! There wasn't anything wrong with him."
          emotion: surprised
        - id: ch03-b06
          speaker: malemute_kid
          text: "Come outside and see."
        - id: ch03-b07
          speaker: scruff_mackenzie
          text: "Then I suppose he caught it too. Yellow Fang came back this morning and bit a piece out of him. He almost left me a widower as well. He rushed Zarinska, but she snapped her skirts in his face. She got away with torn clothes and a roll in the snow. Then he ran into the woods again. I hope he stays there. Have you lost any dogs?"
        - id: ch03-b08
          speaker: malemute_kid
          text: "One, and he was the best in my team. Shookum went mad this morning, though he didn't get far. He ran straight into Sitka Charley's team, and they tore him to pieces all over the street. Now two of those dogs are loose and raging mad, so Shookum did his work before he died. If we don't act, there won't be many dogs left by spring."
        - id: ch03-b09
          speaker: big_jim_belden
          text: "There may not be many men left either."
        - id: ch03-b10
          speaker: malemute_kid
          text: "What happened? Who's in trouble?"
        - id: ch03-b11
          speaker: big_jim_belden
          text: "Bettles and Lon McFane had words. In a few minutes, they'll meet at the waterhole and settle it."
        - id: ch03-b12
          speaker: narrator
          text: The men told the Kid the rest. He was used to being obeyed, and now he took charge. He quickly laid out a plan. Everyone promised to follow his lead exactly.
        - id: ch03-b13
          speaker: malemute_kid
          text: "We won't actually take away their right to fight. But once they see the beauty of this plan, I don't believe they'll fight at all. Life is a game, and men are the gamblers. They'll stake everything they own on one chance in a thousand. Take away that single chance, and they won't play."
        - id: ch03-b14
          speaker: malemute_kid
          text: "Storekeeper, measure out three fathoms of your best half-inch manila rope. Today we'll set a rule that the men of Forty Mile will remember forever."
        - id: ch03-b15
          speaker: narrator
          text: He looped the rope around his arm and led the men outside. They arrived just as the two fighters came up.
        - id: ch03-b16
          speaker: bettles
          text: "What right did he have to bring my wife into it? There was no call for that. None at all."
          emotion: angry
        - id: ch03-b17
          speaker: narrator
          text: Bettles paced back and forth, repeating himself while a friend tried to soothe him. Lon faced Father Roubeau with a hot face and a racing tongue, rebelling against the Church itself.
        - id: ch03-b18
          speaker: lon_mcfane
          text: "Father, I'll go gladly enough into the flames and lie with my back on the coals. But no man will ever say Lon McFane took the lie between his teeth and never raised a hand. Don't give me a blessing. My years have been wild, but my heart was right."
          emotion: angry
        - id: ch03-b19
          speaker: father_roubeau
          text: "It is not your heart sending you out to kill another man, Lon. It is your pride."
        - id: ch03-b20
          speaker: lon_mcfane
          text: "You're French. But will you say a mass for me if luck goes against me?"
        - id: ch03-b21
          speaker: narrator
          text: The priest only smiled, set his moccasined feet forward, and joined the walk onto the silent white river. A packed trail as narrow as a sled led toward the waterhole. Deep soft snow lay on both sides. The men went single file without speaking. Father Roubeau's black stole made the procession look like a funeral.
        - id: ch03-b22
          speaker: narrator
          text: For Forty Mile, it was a warm winter day. The mercury had climbed to the unusual height of twenty below. Yet there was no comfort in that warmth. The heavy sky pressed close to the earth. High above, the air hardly moved. The clouds hung still and sullen, promising that snow would begin early. The earth made no preparation and gave no answer. It was content to sleep through winter.
    - id: ch04
      title: The Rope at the Waterhole
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At the waterhole, Bettles had clearly spent the walk turning the insult over in his mind.
        - id: ch04-b02
          speaker: bettles
          text: "There was no call for it."
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: Lon said nothing. His anger choked off his words. Yet deep down, whenever their own injuries stopped filling their minds, both men wondered about their comrades. They had expected resistance, and this silent agreement hurt them. These were men they had lived beside and trusted. Now the whole company had walked out almost as if to a celebration, ready to watch them shoot each other down without one word of protest. Bettles and Lon began to feel that their worth had somehow fallen in the eyes of the camp. A vague sense of being wronged rose in each of them, and the whole strange business left them puzzled.
        - id: ch04-b04
          speaker: lon_mcfane
          text: "Stand back to back, David. Shall we take fifty paces each, or make it a hundred?"
        - id: ch04-b05
          speaker: bettles
          text: "Fifty."
        - id: ch04-b06
          speaker: narrator
          text: Then Lon's quick eye found the new rope looped casually around Malemute Kid's arm. Suspicion ran through him.
        - id: ch04-b07
          speaker: lon_mcfane
          text: "And what might you be doing with that rope?"
        - id: ch04-b08
          speaker: malemute_kid
          text: "Hurry up. I left bread baking in my cabin, and I don't want it to fall. My feet are getting cold too."
        - id: ch04-b09
          speaker: narrator
          text: The other men found their own ways to show impatience.
        - id: ch04-b10
          speaker: lon_mcfane
          text: "But that rope, Kid. It's brand-new, and surely your bread isn't so heavy that you need a rope to lift it."
        - id: ch04-b11
          speaker: narrator
          text: Bettles turned to face them. Father Roubeau had begun to see the joke, and he hid a smile behind his mitten.
        - id: ch04-b12
          speaker: malemute_kid
          text: "No, Lon. This rope was made for a man."
        - id: ch04-b13
          speaker: bettles
          text: "What man?"
        - id: ch04-b14
          speaker: malemute_kid
          text: "The other man."
        - id: ch04-b15
          speaker: lon_mcfane
          text: "And which man do you mean by that?"
        - id: ch04-b16
          speaker: malemute_kid
          text: "Listen, Lon, and you too, Bettles. We talked over this little trouble and reached one decision. We have no right to stop you from fighting, and we won't. But we can make this the only duel Forty Mile ever sees. It will be an example for every newcomer who travels the Yukon. Whichever man survives the shooting will be hanged from the nearest tree. Now go ahead."
        - id: ch04-b17
          speaker: narrator
          text: Lon smiled uncertainly. Then his face brightened.
        - id: ch04-b18
          speaker: lon_mcfane
          text: "Pace it off, David. Fifty steps, turn, and keep firing until one of us is down for good. Their hearts won't let them hang the winner. You know as well as I do that this is a Yankee bluff."
        - id: ch04-b19
          speaker: narrator
          text: Lon started away with a pleased grin, but Malemute Kid stopped him.
        - id: ch04-b20
          speaker: malemute_kid
          text: "Lon, how long have you known me?"
        - id: ch04-b21
          speaker: lon_mcfane
          text: "Many a day."
        - id: ch04-b22
          speaker: malemute_kid
          text: "And you, Bettles?"
        - id: ch04-b23
          speaker: bettles
          text: "It'll be five years at next June's high water."
        - id: ch04-b24
          speaker: malemute_kid
          text: "In all that time, have either of you known me to break my word? Have you even heard of it happening?"
        - id: ch04-b25
          speaker: narrator
          text: Both men shook their heads and tried to guess what was coming.
        - id: ch04-b26
          speaker: malemute_kid
          text: "Then what do you think of a promise from me?"
        - id: ch04-b27
          speaker: bettles
          text: "It's as good as your bond."
        - id: ch04-b28
          speaker: lon_mcfane
          text: "You could safely hang your hopes of heaven on it."
        - id: ch04-b29
          speaker: malemute_kid
          text: "Then hear me. I, Malemute Kid, give you my word. You know what that means. Ten minutes after the shooting, the man who was not shot will hang from this rope."
        - id: ch04-b30
          speaker: narrator
          text: The Kid stepped back like a judge who had finished with the matter.
    - id: ch05
      title: The Chance No Man Would Take
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: A pause came, and silence settled over the men of Forty Mile. The sky lowered still more and sent down a flight of tiny frost crystals. Each one was a perfect little pattern, delicate and brief as a breath. Yet those crystals would lie there until the returning sun had traveled halfway across the northern sky.
        - id: ch05-b02
          speaker: narrator
          text: Both fighters had led desperate ventures before. They had gone forward with a curse or a joke on their tongues and an unshaken faith in the God of Chance. That faith had carried them when the odds were almost hopeless. But Malemute Kid's promise had shut that merciful god out of the present game. Neither man could find even the smallest chance left to trust. They searched the Kid's face, but it gave away no more than a stone image. The quiet minutes stretched on, and both men began to feel that one of them ought to speak.
        - id: ch05-b03
          speaker: narrator
          text: At last, a wolf-dog howled from the direction of Forty Mile. The strange cry rose with all the sorrow of a breaking heart, then faded into a long sob.
        - id: ch05-b04
          speaker: bettles
          text: "Well, I'll be damned."
        - id: ch05-b05
          speaker: narrator
          text: Bettles pulled up the collar of his heavy jacket and looked around helplessly.
        - id: ch05-b06
          speaker: lon_mcfane
          text: "It's a fine game you're running, Kid. The house gets every advantage, and the man making the bet gets none. The Devil himself wouldn't take such odds, and I'll be damned if I will."
        - id: ch05-b07
          speaker: narrator
          text: Chuckles caught and gurgled in the men's throats. They traded winks, then pretended to brush away the frost that rimmed their eyelashes. Together they climbed the steps cut into the icy bank and started across the street toward the Post.
        - id: ch05-b08
          speaker: narrator
          text: But the long howl came nearer, and now it carried a new threat. A woman screamed around the corner.
        - id: ch05-b09
          speaker: onlooker
          text: "Here he comes!"
          emotion: fearful
        - id: ch05-b10
          speaker: narrator
          text: An Indian boy burst around the corner at the head of half a dozen terrified dogs. Boy and dogs were all racing with death behind them. Yellow Fang followed close, a flash of gray beneath a ridge of bristling hair. The crowd scattered. Everyone ran except Bettles, the Yankee.
        - id: ch05-b11
          speaker: narrator
          text: The Indian boy tripped and fell. Bettles stopped long enough to grab him by the loose fur of his clothes, then headed for a pile of cordwood. Several of the other men had already scrambled on top of it. Yellow Fang doubled after one of the fleeing dogs, then came bounding back. That other dog was free of the madness, but terror had driven it wild. It swept Bettles off his feet and flashed away up the street.
        - id: ch05-b12
          speaker: narrator
          text: Malemute Kid fired at Yellow Fang while the mad dog raced past. The shot whirled the animal halfway through a turn in the air and brought him down hard on his back. He recovered at once. With a single leap, he covered half the distance between himself and Bettles.
        - id: ch05-b13
          speaker: narrator
          text: The deadly spring never landed. Lon McFane threw himself from the woodpile and met Yellow Fang in midair. Man and dog hit the snow and rolled over together. Lon caught the animal by the throat and held it at arm's length. He blinked as foul foam sprayed across his face. Bettles stood with his revolver ready, coolly waiting until there was no chance of striking Lon. The opening came, and Bettles ended the fight.
        - id: ch05-b14
          speaker: lon_mcfane
          text: "That was a fair game, Kid, and this time the man who took the chance had fair odds."
        - id: ch05-b15
          speaker: narrator
          text: Lon rose and shook the snow from his sleeves. That night, he went to Father Roubeau's cabin to make his peace with the Church. Back at the Post, Malemute Kid talked for a long time without satisfying Scruff Mackenzie.
        - id: ch05-b16
          speaker: scruff_mackenzie
          text: "But if they had fought, would you really have done it?"
        - id: ch05-b17
          speaker: malemute_kid
          text: "Have I ever broken my word?"
        - id: ch05-b18
          speaker: scruff_mackenzie
          text: "No, but that isn't the point. Answer me. Would you have hanged the survivor?"
        - id: ch05-b19
          speaker: narrator
          text: Malemute Kid straightened.
        - id: ch05-b20
          speaker: malemute_kid
          text: "Scruff, I've been asking myself that ever since, and—"
        - id: ch05-b21
          speaker: scruff_mackenzie
          text: "Well?"
        - id: ch05-b22
          speaker: malemute_kid
          text: "I still haven't found the answer."
