cover_prompt: |-
  A wordless cover scene in an early-twentieth-century American orchard shows a small red squirrel edging out from an old stone wall toward a farm boy's open hand. The squirrel has a warm red fur coat, alert eyes, and a tail flicked in his saucy way, while the boy wears simple 1910s farm clothes and kneels patiently with a fat hickory nut on his palm. A blue jay watches from an apple-tree branch, and the sunlit Green Forest rises beyond the meadow and weathered farm buildings. The squirrel's brave final dash to take the offered nut is the clear focal action, turning a woodland adventure into a moment of hard-won trust. Use a wide child-height three-quarter view with the figures prominent in the lower middle, a curving orchard path leading toward the forest, and generous calm sky above. Keep the animals anatomically believable, the setting period-appropriate, the mood warm and non-frightening, and every figure independent of film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
