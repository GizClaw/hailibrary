audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    sammy_jay:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 尖刻活泼，谈起消息时格外来劲
        timbre: 清脆响亮
        pace: 明快
        pitch: 偏高
    shadow_the_weasel:
      display_name: 黄鼠狼影子
      tts:
        delivery: 阴沉凶狠，发怒时咬牙切齿
        timbre: 尖细冷硬
        pace: 偏慢
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十七章　冠蓝鸦萨米的锐眼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 谁都知道，冠蓝鸦萨米的眼睛特别锐利。森林里的小居民，很少有谁的眼力比得上他。这是因为，萨米总在不停地用眼睛。
        - id: ch01-b02
          speaker: narrator
          text: 很久以前，他就发现，眼睛越用越敏锐。从那以后，只要醒着，他几乎每时每刻都在设法看出点什么。他老是东瞧西望，所以绿森林和绿草地上出了什么事，他总能知道不少。
        - id: ch01-b03
          speaker: narrator
          text: 红松鼠喋喋不见了，当然会有人发现，尤其瞒不过萨米。萨米没有看到喋喋，自然想知道他去了哪里。
        - id: ch01-b04
          speaker: narrator
          text: 起初，他以为喋喋只是躲了起来。可他在老果园里探头探脑，四处窥看，又接连守了好几天，最后只得猜想，喋喋不是再次搬了家，就是出了什么事。
        - id: ch01-b05
          speaker: sammy_jay
          text: “说不定黄鼠狼影子到底还是抓到他了。”
        - id: ch01-b06
          speaker: narrator
          text: 萨米想到这里，马上飞到绿森林里的一个地方。去那里，也许能找到黄鼠狼影子。影子果然在。可萨米不能直接问他有没有抓到喋喋，这一点，聪明的萨米心里很清楚。
        - id: ch01-b07
          speaker: sammy_jay
          text: “红松鼠喋喋让我替他向你问好。他还祝你抓他抓得开心呢！”
        - id: ch01-b08
          speaker: narrator
          text: 影子抬头盯住萨米，两只红色的小眼睛里顿时冒出了怒火。
        - id: ch01-b09
          speaker: shadow_the_weasel
          text: “你去告诉喋喋，我迟早会逮住他！”
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 萨米的眼睛里闪起淘气的光。他不但惹恼了影子，也问出了自己想知道的事。现在他可以肯定，喋喋没有落到影子手里。
        - id: ch01-b11
          speaker: sammy_jay
          text: “那他究竟去了哪里？我虽然一点儿也不喜欢他，可他不在，我还真觉得少了点什么。我一定得查清楚。对，先生，我一定得查清楚。”
        - id: ch01-b12
          speaker: narrator
          text: 从那以后，只要抽得出一点时间，萨米就用来寻找喋喋。他见到谁都要问问，有没有看到喋喋。他还把想得到的每一个树洞、每一处藏身的地方，全都仔细看了一遍。
        - id: ch01-b13
          speaker: narrator
          text: 可是不管他怎么看、怎么问，喋喋还是连一点踪迹也没有。后来，萨米忽然想起了农夫布朗的玉米仓。喋喋会不会搬到那里去了？还是在那里遭遇了什么可怕的不幸？
        - id: ch01-b14
          speaker: narrator
          text: 第二天一大早，萨米就飞到玉米仓。他用那双锐眼上上下下看了一遍，又侧耳细听，想听听里面有没有喋喋的动静。可是，他什么也没有听见。
        - id: ch01-b15
          speaker: narrator
          text: 接着，萨米想起屋檐边上原来有一个洞。过去，喋喋总从那里进进出出。他赶紧飞过去，只见洞口已经让一块结实的木板横着钉死了。这下萨米明白了，农夫布朗的男孩已经发现了那个洞。
        - id: ch01-b16
          speaker: sammy_jay
          text: “他把喋喋杀了，一定是他干的！”
          emotion: sad
        - id: ch01-b17
          speaker: narrator
          text: 萨米满心难过地飞回老果园。他打算等农夫布朗的男孩出来，就把自己对他的看法全骂给他听。骂完以后，他还要飞遍绿森林和绿草地，把这个坏消息传开。
        - id: ch01-b18
          speaker: narrator
          text: 过了一会儿，农舍的门开了，农夫布朗的男孩走了出来。萨米张开嘴，正要大叫，那双锐眼却突然瞧见一件怪事。
        - id: ch01-b19
          speaker: narrator
          text: 男孩怀里抱着一个模样古怪的箱子，又把它放到一块能晒着太阳的架子上。萨米觉得，箱子里面似乎有什么东西动了一下。
        - id: ch01-b20
          speaker: narrator
          text: 他顿时忘了尖叫，也忘了那些早已想好要骂的话，只等农夫布朗的男孩走进谷仓。
        - id: ch01-b21
          speaker: narrator
          text: 随后，萨米飞到一个能把古怪箱子里面看得清清楚楚的地方。
        - id: ch01-b22
          speaker: narrator
          text: 红松鼠喋喋就在里面！
