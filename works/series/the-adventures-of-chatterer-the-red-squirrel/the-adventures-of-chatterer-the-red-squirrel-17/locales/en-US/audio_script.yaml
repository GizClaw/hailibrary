audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp and inquisitive, with a lively streak of mischief
        timbre: bright and piercing
        pace: brisk
        pitch: medium-high
    shadow:
      display_name: Shadow
      tts:
        delivery: cold and threatening, quick to flare into anger
        timbre: thin and harsh
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Sammy Jay's Sharp Eyes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Everyone knows Sammy Jay has sharp eyes. Very few of the little forest people can see as well as he can. That is because Sammy is always using his eyes. Long ago, he learned that the more he used them, the sharper they became. So when Sammy is awake, hardly a minute goes by without him trying to spot something. He is always looking around. That is why he knows so much about everything happening in the Green Forest and on the Green Meadows.

        - id: ch01-b02
          speaker: narrator
          text: >-
            Of course, Chatterer the Red Squirrel could not disappear without Sammy noticing. And once Sammy missed him, he began wondering where Chatterer had gone. At first he thought Chatterer must be hiding. But Sammy spent several days peeking, peering, and watching around the Old Orchard. At last, he decided that Chatterer had either moved away again or something had happened to him.

        - id: ch01-b03
          speaker: sammy_jay
          text: >-
            Maybe Shadow the Weasel caught him after all.

        - id: ch01-b04
          speaker: narrator
          text: >-
            Sammy flew straight to a certain place in the Green Forest where he might find Shadow. Sure enough, the weasel was there. Sammy knew better than to ask him plainly whether he had caught Chatterer. He would have to find out another way.

        - id: ch01-b05
          speaker: sammy_jay
          text: >-
            Chatterer the Red Squirrel sends his regards. He hopes you're enjoying your hunt for him.

        - id: ch01-b06
          speaker: narrator
          text: >-
            Shadow looked up. Anger blazed in his little red eyes.

        - id: ch01-b07
          speaker: shadow
          text: >-
            You tell Chatterer I'll catch him yet!
          emotion: angry

        - id: ch01-b08
          speaker: narrator
          text: >-
            Mischief sparkled in Sammy's eyes. He had made Shadow angry, and he had learned exactly what he wanted to know. Shadow had not caught Chatterer.

        - id: ch01-b09
          speaker: sammy_jay
          text: >-
            Then where can he be? I'm certainly not fond of him, but I miss him anyway. I have to find out what happened. Yes, sir, I do.

        - id: ch01-b10
          speaker: narrator
          text: >-
            From then on, Sammy used every spare minute to search for Chatterer. He asked everyone he met whether they had seen him. He looked into every hollow and every hiding place he could think of. Yet no matter how much he searched or how many questions he asked, he found no sign of Chatterer.

        - id: ch01-b11
          speaker: narrator
          text: >-
            Then Sammy remembered Farmer Brown's corn crib. Perhaps Chatterer had moved there. Or perhaps something dreadful had happened to him there. Very early the next morning, Sammy flew over to the corn crib. His sharp eyes searched it from end to end, and he listened for Chatterer inside. He heard nothing at all.

        - id: ch01-b12
          speaker: narrator
          text: >-
            Then Sammy remembered the hole beneath the edge of the roof. Chatterer used to slip in and out through that hole. Sammy hurried over to inspect it. A strong board had been nailed across the opening. Right away, Sammy knew that Farmer Brown's boy had discovered it.

        - id: ch01-b13
          speaker: sammy_jay
          text: >-
            He's killed Chatterer! That's what he's done!
          emotion: sad

        - id: ch01-b14
          speaker: narrator
          text: >-
            Full of sad thoughts, Sammy flew to the Old Orchard. He planned to wait for Farmer Brown's boy to come outside and tell him exactly what he thought of him. After that, Sammy would carry the sad news through the Green Forest and across the Green Meadows.

        - id: ch01-b15
          speaker: narrator
          text: >-
            After a while, the farmhouse door opened and Farmer Brown's boy stepped out. Sammy opened his mouth, ready to scream. Then his sharp eyes caught sight of something strange. The boy held an odd-looking box in his arms. He placed it on a shelf where the sun could shine on it. Sammy thought he saw something moving inside.

        - id: ch01-b16
          speaker: narrator
          text: >-
            Sammy forgot all about screaming. He forgot the harsh things he had meant to say. He waited until Farmer Brown's boy went to the barn. Then he flew closer, to a place where he could look straight into that strange box.

        - id: ch01-b17
          speaker: narrator
          text: >-
            There was Chatterer the Red Squirrel!
