audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: practical and alert, with youthful confidence
        timbre: clear and sturdy
        pace: moderate
        pitch: medium
  chapters:
    - id: ch01
      title: Chatterer Grows Careless
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Grow careless, even over something small, and old Mr. Trouble is sure to come calling.

        - id: ch01-b02
          speaker: narrator
          text: >-
            Some people never seem to learn that lesson. After all his trouble and worry, you might think Chatterer the Red Squirrel would have learned it. For a while, it looked as though he had.

        - id: ch01-b03
          speaker: narrator
          text: >-
            Morning after morning, Chatterer visited Farmer Brown's corn-crib before anyone in the farmhouse was awake. He was very careful not to be seen. He made sure he was back home in the Old Orchard before Farmer Brown's boy came out to begin his morning work.

        - id: ch01-b04
          speaker: narrator
          text: >-
            Inside the corn-crib, Chatterer took only corn that he thought no one would miss. When he had eaten an ear clean, he hid the empty cob in the darkest corner, behind the great pile of yellow corn. Those cobs would stay hidden until nearly all the corn was gone. At first, Chatterer was very sly indeed.

        - id: ch01-b05
          speaker: narrator
          text: >-
            But nothing bad happened, and after a while Chatterer stopped being so careful. His first visits to the corn-crib had felt very dangerous. Once he had gone there again and again without being caught, the danger no longer seemed real to him.

        - id: ch01-b06
          speaker: narrator
          text: >-
            As soon as he got inside, he forgot about being careful and gave himself over to fun. He raced across the great pile of beautiful yellow corn and discovered wonderful hiding places among the ears. Down in one dark corner, he built a fine bed from scraps of husk that had not been stripped from some of the ears.

        - id: ch01-b07
          speaker: narrator
          text: >-
            Farmer Brown's corn-crib was the nicest place Chatterer had ever dreamed of. Before long, he began to feel that it belonged to him, not to Farmer Brown.

        - id: ch01-b08
          speaker: narrator
          text: >-
            The stronger that feeling became, the less careful Chatterer was. Now and then, he dropped a kernel of corn. Sometimes he was too lazy to climb down and pick it up. Sometimes he never even thought about it.

        - id: ch01-b09
          speaker: narrator
          text: >-
            Each morning, Farmer Brown's boy came for corn to feed the hens. He noticed the loose kernels, but he thought they must have rubbed off the ears while the corn was being handled.

        - id: ch01-b10
          speaker: narrator
          text: >-
            Then one morning, Chatterer dropped a bare cob. He meant to pick it up and hide it with the others, but he did not feel like doing that just then. Later, he forgot all about it. Yes, sir, the cob did not cross his mind again until he was home in the Old Orchard.

        - id: ch01-b11
          speaker: chatterer
          text: >-
            Oh, it doesn't matter. I'll pick it up and hide it tomorrow morning.

        - id: ch01-b12
          speaker: narrator
          text: >-
            A corn-cob is a very simple thing. Farmer Brown's boy knew exactly where to find a whole pile of them. He added to it every day after shelling enough corn for the hens. Even so, when he saw the cob Chatterer had left behind, his eyes opened wide.

        - id: ch01-b13
          speaker: narrator
          text: >-
            He knew a bare cob had no business lying inside the corn-crib. All at once, those scattered kernels meant something new.

        - id: ch01-b14
          speaker: farmer_browns_boy
          emotion: surprised
          text: >-
            Ha, ha! So a thief has been here after all! I thought the corn was safe from rats and mice. How could they have climbed those stone legs? I truly don't see how they did it.

        - id: ch01-b15
          speaker: farmer_browns_boy
          text: >-
            But something with sharp teeth has certainly been in here. I must have left the door open sometime, and a rat slipped inside. Well, Mr. Rat or Mr. Mouse, I'll have to deal with you. You can't stay in our corn-crib.

        - id: ch01-b16
          speaker: narrator
          text: >-
            Farmer Brown's boy went into the house. Before long, he returned. In one hand he carried a rat-trap. In the other, he carried a mouse-trap.
