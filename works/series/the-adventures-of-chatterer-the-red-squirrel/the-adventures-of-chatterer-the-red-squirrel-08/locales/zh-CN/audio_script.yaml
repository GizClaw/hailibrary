audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    farmer_browns_boy:
      display_name: 农夫布朗的男孩
      tts:
        delivery: 直爽利落，发现问题时认真警觉
        timbre: 清朗结实
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 第八章　喋喋变得粗心大意
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 哪怕只是小事情，一旦粗心不留意，麻烦老先生也准会登门来找你。
        - id: ch01-b02
          speaker: narrator
          text: 有些人似乎怎么也学不会这个道理。喋喋吃过那么多苦头，担过那么多心，照说总该牢牢记住教训了吧。有那么一阵子，看起来他的确是学乖了。
        - id: ch01-b03
          speaker: narrator
          text: 一天又一天，每到大清早，农夫布朗家里的人还没起床，喋喋就溜进玉米仓。他一路处处小心，绝不让人瞧见，还一定赶在农夫布朗的男孩出来做早晨的活儿以前，回到老果园的家。
        - id: ch01-b04
          speaker: narrator
          text: 偷吃玉米时，他也十分谨慎，只挑少一点儿也看不出来的地方下嘴。啃光的穗轴，他全藏在金黄玉米堆后面最暗的角落里。不到仓里的玉米差不多搬空，谁也不会发现。那时候的喋喋，真是又狡猾又会耍心眼儿。
        - id: ch01-b05
          speaker: narrator
          text: 可日子一天天过去，什么也没发生，喋喋就慢慢大意了。原先他觉得去玉米仓危险极了，后来去得多了，竟觉得那里一点儿危险都没有。一进仓，他只管痛痛快快地玩，在漂亮的玉米堆上到处跑，还找到了许多绝妙的藏身处。
        - id: ch01-b06
          speaker: narrator
          text: 有个黑暗的角落里，几穗玉米还留着没剥净的苞叶。喋喋拿那些苞叶铺成一张舒服极了的床。他做梦也想不到会有这么好的地方，渐渐竟觉得这座玉米仓不是农夫布朗的，而是他自己的。
        - id: ch01-b07
          speaker: narrator
          text: 这么一想，他就更不小心了。偶尔掉下一粒玉米，他不是懒得去捡，就是根本没放在心上。农夫布朗的男孩每天早晨来取玉米喂母鸡，看见地上的玉米粒，只当是搬玉米穗时蹭落的。
        - id: ch01-b08
          speaker: narrator
          text: 一天早晨，喋喋掉下了一根啃得精光的玉米穗轴。他本想把它捡回来，像以前那些穗轴一样藏好，可当时偏偏不想动。后来呢，他竟忘了个干净。是的，直到回到老果园的家，他才猛然想起这回事。
        - id: ch01-b09
          speaker: chatterer
          text: “唉，没什么要紧的。明天早晨再去捡起来藏好，不就行了。”
        - id: ch01-b10
          speaker: narrator
          text: 玉米穗轴实在是再普通不过的东西。农夫布朗的男孩知道哪儿堆着一大堆。他每天给母鸡剥够了玉米粒，都会把空穗轴添进去。可这天早晨，他看见喋喋留下的那一根，眼睛一下子睁得老大。
        - id: ch01-b11
          speaker: narrator
          text: 因为他知道，光秃秃的穗轴绝不该留在玉米仓里面。这么一来，先前那些散落的玉米粒，也忽然有了别的意思。
        - id: ch01-b12
          speaker: farmer_browns_boy
          text: “哈，哈！原来到底还是有小偷来过！我还以为这里不会闹耗子呢。可它们到底怎么进来的？我真的看不出，它们怎么爬得上玉米仓的石头柱脚。”
          emotion: surprised
        - id: ch01-b13
          speaker: farmer_browns_boy
          text: “不过，准有个尖牙齿的家伙钻进来过。一定是哪一回我忘了关门，叫一只大耗子溜了进来。”
        - id: ch01-b14
          speaker: farmer_browns_boy
          text: “大耗子先生也好，小耗子先生也好，我非把你揪出来不可。我们家的玉米仓，可不能由着你待下去。”
        - id: ch01-b15
          speaker: narrator
          text: 说完，农夫布朗的男孩走进屋里。没过多久，他又回来了。他的一只手里拿着专门捉大耗子的夹子，另一只手里拿着专门捉小耗子的夹子。
