audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    tommy_tit:
      display_name: 黑顶山雀汤米
      tts:
        delivery: 快活爽朗，说话干脆利落
        timbre: 清脆轻盈
        pace: 轻快
        pitch: 高音
    farmer_browns_boy:
      display_name: 农夫布朗的男孩
      tts:
        delivery: 开朗友善，笑意自然
        timbre: 清亮朴实
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二十二章　汤米说到做到
      blocks:
        - id: ch01-b01
          speaker: tommy_tit
          text: “嘀，嘀，嘀，黑顶山雀叫嘀嘀！看我！看我！”
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: 黑顶山雀汤米一遍遍唱着，从绿森林飞过老果园，一路往农夫布朗家的院子去。那个早晨晴朗又冷得发脆，而他的歌声，是四下里最欢快的声音。
        - id: ch01-b03
          speaker: narrator
          text: 别的声音当然也有，可没有一个听来高兴。冠蓝鸦萨米的叫声又烦躁又不满，乌鸦黑仔的嗓门粗厉刺耳。红松鼠喋喋也在叫，不过他只是习惯性地数落几句，同样不怎么悦耳。
        - id: ch01-b04
          speaker: narrator
          text: 所以，在那个寒冷的冬日早晨，谁听见汤米的歌声，谁都忍不住要笑。真的，先生，就连萨米和黑仔也不例外。
        - id: ch01-b05
          speaker: narrator
          text: 汤米飞到老石墙边。那堵墙隔开了老果园和农夫布朗家的院子。他那双锐利的小眼睛很快就发现，彼得兔、灰松鼠快乐杰克和喋喋都藏在墙里，正从石缝间向外偷看院子里发生的事。
        - id: ch01-b06
          speaker: narrator
          text: 汤米回头一瞧，老果园的树木之间，有一小片蓝蓝的天空在无声地飘动。那是冠蓝鸦萨米。更远处，一棵高枫树顶上还有个黑点。那当然是乌鸦黑仔，他可不敢再靠近了。
        - id: ch01-b07
          speaker: narrator
          text: 汤米一看就明白了，心里的欢喜直往外冒。彼得、快乐杰克、喋喋、萨米和黑仔，全是来看他兑现那个海口的。他说过，自己敢从农夫布朗的男孩手里取东西吃，可他们其实谁也不信。
        - id: ch01-b08
          speaker: narrator
          text: 汤米浑身痒酥酥的，纯粹是因为太高兴了。他蹦来跳去，耍了好些花样。闹够以后，才飞到紧挨着农夫布朗家的那棵枫树上。
        - id: ch01-b09
          speaker: tommy_tit
          text: “嘀，嘀，嘀，黑顶山雀叫嘀嘀！快看我呀！快看我！”
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: 这一回，他唱得比刚才还要欢快。就在这时，屋门打开了。农夫布朗的男孩走出来，抬头望着汤米。那双眼睛温柔又和善，叫人看了心里也舒服。
        - id: ch01-b11
          speaker: narrator
          text: 男孩噘起嘴唇，吹出一声极轻、极甜的口哨。那声音听起来，就像在叫“菲——比”。
        - id: ch01-b12
          speaker: narrator
          text: 彼得兔赶紧掐了自己一下，想知道是不是在做梦。那明明是汤米向心上人唱的歌。要不是亲眼看着农夫布朗的男孩，彼得一定会认定，这声口哨是汤米吹的。
        - id: ch01-b13
          speaker: narrator
          text: 农夫布朗的男孩又吹了一声“菲——比”。汤米也回了一声，同样是在叫“菲——比”。一声接着一声，简直分不清哪一声更轻、更甜。
        - id: ch01-b14
          speaker: narrator
          text: 男孩第三次吹响了“菲——比”，随即伸出一只手。他的掌心里，放着一颗敲开了的山核桃。
        - id: ch01-b15
          speaker: tommy_tit
          text: “嘀，嘀，嘀！这回可要看好我啦！”
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: 汤米叫着，从枫树上轻盈地飞下来，正正落在农夫布朗的男孩手上。他那双明亮的小眼睛快活地闪着光，低头啄了一小块果仁来吃。
        - id: ch01-b17
          speaker: narrator
          text: 彼得兔转头看看快乐杰克，快乐杰克又转头看看喋喋。三个家伙都像是不敢相信自己的眼睛。等他们再望向农夫布朗的男孩时，汤米已经坐在男孩的头顶上了。
        - id: ch01-b18
          speaker: tommy_tit
          text: “嘀，嘀，嘀，黑顶山雀叫嘀嘀！看我！看我！”
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: 汤米的歌声从来没有这么快活过。因为这一回，他夸下的海口，真的兑现了。
