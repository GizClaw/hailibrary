audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    tommy_tit:
      display_name: Tommy Tit
      tts:
        delivery: merry and friendly, with crisp, birdlike energy
        timbre: light and clear
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: Tommy Tit Makes Good His Boast
      blocks:
        - id: ch01-b01
          speaker: tommy_tit
          text: >-
            Dee, dee, dee, chickadee! See me! See me!
          emotion: happy

        - id: ch01-b02
          speaker: narrator
          text: >-
            Tommy Tit the Chickadee called this again and again as he flew out of the Green Forest, through the Old Orchard, on his way toward Farmer Brown's dooryard. His was the merriest, cheeriest voice on that bright, snapping-cold morning. Other voices could be heard, but none of them sounded merry. Sammy Jay was peevish and discontented. Blacky the Crow was harsh and unpleasant. Chatterer the Red Squirrel was scolding simply because scolding had become a habit with him.

        - id: ch01-b03
          speaker: narrator
          text: >-
            Anyone who heard Tommy's cheerful call that winter morning had to smile. Yes, sir, they could not help it. Even Sammy Jay and Blacky the Crow smiled.

        - id: ch01-b04
          speaker: narrator
          text: >-
            When Tommy reached the stone wall between the Old Orchard and Farmer Brown's dooryard, his sharp eyes quickly found Peter Rabbit, Happy Jack the Gray Squirrel, and Chatterer. All three were hiding in the old wall. From there, they could peek out and watch everything that happened in the dooryard.

        - id: ch01-b05
          speaker: narrator
          text: >-
            Tommy looked back through the Old Orchard. Something like a tiny piece of the blue, blue sky was flitting silently from tree to tree. That was Sammy Jay. Far away, at the very top of a tall maple, Tommy saw a black spot. He knew it was Blacky the Crow. Blacky did not dare come any closer.

        - id: ch01-b06
          speaker: narrator
          text: >-
            Joy seemed to bubble right out of Tommy. He understood why everyone had come. Peter, Happy Jack, Chatterer, Sammy, and Blacky all wanted to see whether he could do what he had boasted to Chatterer he would do. Tommy had said he would eat from the hand of Farmer Brown's boy, and not one of them truly believed him.

        - id: ch01-b07
          speaker: narrator
          text: >-
            Tommy could hardly keep still. He darted this way and that, cutting all sorts of capers simply because he felt so glad. At last, he flew to the maple tree that grew close beside Farmer Brown's house.

        - id: ch01-b08
          speaker: tommy_tit
          text: >-
            Dee, dee, dee, chickadee! See me! See me!
          emotion: happy

        - id: ch01-b09
          speaker: narrator
          text: >-
            Tommy's voice sounded brighter and merrier than ever. Then the farmhouse door opened, and Farmer Brown's boy stepped outside. He looked up at Tommy, and there was something gentle and kind in his eyes. The boy pursed his lips and gave the softest, sweetest whistle. “Phoe-be,” it went, sounding just like Tommy's own love note.

        - id: ch01-b10
          speaker: narrator
          text: >-
            Peter Rabbit pinched himself to make sure he was awake. If he had not been staring straight at Farmer Brown's boy, he would have been certain that Tommy himself had whistled. “Phoe-be,” the boy called once more. Tommy answered, “Phoe-be,” and it was hard to tell which whistle was softer or sweeter.

        - id: ch01-b11
          speaker: narrator
          text: >-
            Farmer Brown's boy whistled “Phoe-be” one more time and held out his hand. A cracked hickory nut lay in his palm.

        - id: ch01-b12
          speaker: tommy_tit
          text: >-
            Dee, dee, dee! See me! See me!
          emotion: happy

        - id: ch01-b13
          speaker: narrator
          text: >-
            Tommy fluttered down from the maple and landed right on the boy's hand. His bright little eyes twinkled merrily while he helped himself to a piece of nut meat.

        - id: ch01-b14
          speaker: narrator
          text: >-
            Peter Rabbit looked at Happy Jack. Happy Jack looked at Chatterer. The three of them simply could not believe their eyes. Then they turned back toward Farmer Brown's boy. There sat Tommy Tit, right on top of his head.

        - id: ch01-b15
          speaker: tommy_tit
          text: >-
            Dee, dee, dee, chickadee! See me! See me!
          emotion: happy

        - id: ch01-b16
          speaker: narrator
          text: >-
            Tommy's voice was merrier than ever. He had made good his boast.
