audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 随和热心，思考时稍稍放慢
        timbre: 清爽柔和
        pace: 中等
        pitch: 中高音
    good_voice:
      display_name: 好声音
      tts:
        delivery: 坦率认真，劝告时坚定清楚
        timbre: 清澈柔和
        pace: 中等
        pitch: 中高音
    wrong_voice:
      display_name: 错声音
      tts:
        delivery: 狡黠诱人，说起歪理来理直气壮
        timbre: 轻快圆滑
        pace: 中等偏快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第六章　彼得兔听错了声音
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔这回事办得可不光明磊落。不，先生，一点儿也不。一个人太爱打听别人的事，常常就顾不上公平了。不过彼得并没存心使坏，真的没有。他把喋喋留在农夫布朗老果园边的老石墙上时，本来真想直接回老荆棘丛去。
        - id: ch01-b02
          speaker: narrator
          text: 喋喋没说新家到底在哪儿，彼得确实有点失望。其实这又不要紧，他只是想知道罢了，只是这样而已。可是，他每离老石墙远一步，想知道那个地方的念头就长大一点。最后，他停下来往回看。灌木挡住了喋喋，连影子也瞧不见。彼得一想，既然自己看不见喋喋，喋喋当然也看不见自己。
        - id: ch01-b03
          speaker: narrator
          text: 彼得坐下来揪着胡须。他一拿不定主意，就会这样。现在，他心里有两个小声音吵开了。
        - id: ch01-b04
          speaker: good_voice
          text: “你是个好家伙。听话，回家去，别管人家的闲事。”
        - id: ch01-b05
          speaker: wrong_voice
          text: “偷偷回到老石墙边，盯着喋喋，不就能找到他的新家了吗？他不会知道，也不会有什么害处。”
        - id: ch01-b06
          speaker: narrator
          text: 第二个声音比第一个响，说得还像是很有道理。彼得越听越喜欢，觉得它正合自己的心意。
        - id: ch01-b07
          speaker: peter_rabbit
          text: “嗯，我看就这么办。”
        - id: ch01-b08
          speaker: narrator
          text: 他根本不等第一个声音反对，立刻转身，一步一步，小心又轻巧地溜回老石墙。墙边正好有一丛浓密的小灌木。彼得觉得，这灌木像是专门长在那里给他藏身的。他钻到底下，肚皮贴着地面，身子伏得扁扁的。从那里望出去，老石墙两边的动静都逃不过他的眼睛。
        - id: ch01-b09
          speaker: narrator
          text: 喋喋还坐在原处，望着彼得刚才离开的方向。彼得暗暗笑了起来。
        - id: ch01-b10
          speaker: peter_rabbit
          text: “他一定是在等，确定我走远以后，才肯去新家。这回我准能骗过他。”
        - id: ch01-b11
          speaker: good_voice
          text: “彼得兔，你该害臊！这事根本不归你管。”
        - id: ch01-b12
          speaker: wrong_voice
          text: “你又没害谁。再说，喋喋本来就不该把新家藏着不说。”
        - id: ch01-b13
          speaker: narrator
          text: 可彼得那股要命的好奇心又在作怪。他只觉得这个声音顺耳，便听了它的话。没过多久，第一个声音泄了气，再也不出声了。
        - id: ch01-b14
          speaker: narrator
          text: 喋喋一动不动。在彼得看来，他像是坐了很久很久。终于，喋喋忽然俏皮地把尾巴一甩，顺着石墙跑了一小段。他匆匆朝四周瞧了一眼，钻进一个洞里，不见了。
        - id: ch01-b15
          speaker: narrator
          text: 过了一分钟，喋喋又从洞里探出脑袋，再把四周看上一遍，然后缩回洞里。这样反复了两三次，每次都显得很不放心，甚至有些焦急。
        - id: ch01-b16
          speaker: narrator
          text: 彼得又偷偷笑了。
        - id: ch01-b17
          speaker: peter_rabbit
          text: “原来他的新家就在那儿。现在我知道了，该赶快回老荆棘丛啦。”
        - id: ch01-b18
          speaker: narrator
          text: 彼得正准备离开，喋喋忽然从洞里跳出来，直起身子坐在一块大石头上。他大声说着什么。彼得仔细一听，两只长耳朵立刻火辣辣地烧了起来。
        - id: ch01-b19
          speaker: chatterer
          text: “彼得不是小探子，探头探脑真讨厌，别人的事偏要管，这种做法羞不羞！”
        - id: ch01-b20
          speaker: narrator
          text: 喋喋一闪就不见了，彼得也赶紧从藏身处逃开。他的耳朵还是烧得通红。原先，他以为发现喋喋的秘密会让自己很得意，一定会乐得不得了。可这会儿，他怎么也高兴不起来。
        - id: ch01-b21
          speaker: narrator
          text: 老石墙的洞里，红松鼠喋喋却笑个不停，好像遇上了一个天大的笑话。这里确实有个笑话，而那个笑话正落在彼得兔头上。
        - id: ch01-b22
          speaker: narrator
          text: 你瞧，彼得根本没有找到喋喋的新家。
