audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
    peter:
      display_name: Peter
      tts:
        delivery: curious and impulsive, with openhearted reactions
        timbre: young and clear
        pace: lively
        pitch: medium-high
    better_voice:
      display_name: Better Voice
      tts:
        delivery: firm and quietly cautioning
        timbre: light and clear
        pace: measured
        pitch: medium
    tempting_voice:
      display_name: Tempting Voice
      tts:
        delivery: persuasive and confidently mischievous
        timbre: smooth and bright
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: Peter Rabbit Listens to the Wrong Voice
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit wasn't playing fair. No, sir, he wasn't. When people get too curious about someone else's business, they often forget about fairness. Peter hadn't planned to do anything wrong. Oh, no! He honestly meant to behave like a good fellow and leave Chatterer's affairs alone. When he left Chatterer the Red Squirrel on the old stone wall beside Farmer Brown's Old Orchard, he meant to go straight home to the dear Old Briar-patch.

        - id: ch01-b02
          speaker: narrator
          text: >-
            Peter was a little disappointed that Chatterer hadn't told him exactly where his new house was. It wasn't as though knowing would change anything. Peter simply wanted to know. That was all. But with every hop away from the wall, he wanted to know more and more. At last he stopped and looked behind him. The bushes hid Chatterer from sight. And Peter decided that if he couldn't see Chatterer, then Chatterer couldn't see him either.

        - id: ch01-b03
          speaker: narrator
          text: >-
            Peter sat down and tugged at his whiskers, the way he always did when he had a hard choice to make. Two little voices seemed to be arguing inside him.

        - id: ch01-b04
          speaker: better_voice
          text: >-
            Be a good fellow, Peter. Go home and mind your own business.

        - id: ch01-b05
          speaker: tempting_voice
          text: >-
            Sneak back to the old wall and watch Chatterer. Then you'll find out where his new house is. He'll never know, so what harm could it do?

        - id: ch01-b06
          speaker: narrator
          text: >-
            The tempting voice was louder, and Peter liked what it was saying.

        - id: ch01-b07
          speaker: peter
          text: >-
            Yes, I think I'll do that.

        - id: ch01-b08
          speaker: narrator
          text: >-
            He didn't wait to hear what the better voice might say. He turned around and tiptoed back, very slowly and softly, to the old stone wall. A thick little bush grew close beside it. To Peter, it seemed made for hiding. He crept underneath and pressed himself flat. From there, he could see both ways along the wall.

        - id: ch01-b09
          speaker: narrator
          text: >-
            Chatterer was still sitting where Peter had left him, looking toward the place where Peter had said goodbye. Peter gave a quiet chuckle.

        - id: ch01-b10
          speaker: peter
          text: >-
            He's waiting until he's sure I'm gone before he heads for his new house. This time, I'm going to fool him.

        - id: ch01-b11
          speaker: better_voice
          text: >-
            You should be ashamed, Peter Rabbit. This is none of your business.

        - id: ch01-b12
          speaker: tempting_voice
          text: >-
            You aren't hurting anyone. Besides, Chatterer shouldn't try to keep his new house secret from you.

        - id: ch01-b13
          speaker: narrator
          text: >-
            Peter's terrible curiosity made him choose the tempting voice again. After a while, the better voice gave up and fell silent.

        - id: ch01-b14
          speaker: narrator
          text: >-
            Chatterer stayed on the wall for what seemed like a very long time. Then he gave his tail a quick, funny flick and ran a short way along the stones. He glanced around in a hurry and vanished into a hole. A minute later, his head popped out for another look. Then it disappeared again. He did this two or three times, and each time he seemed anxious to make sure no one was watching.

        - id: ch01-b15
          speaker: narrator
          text: >-
            Peter chuckled to himself once more.

        - id: ch01-b16
          speaker: peter
          text: >-
            So that's his new house! Now I know where it is, and I can hurry home to the dear Old Briar-patch.

        - id: ch01-b17
          speaker: narrator
          text: >-
            Peter was just about to leave when Chatterer came out of the hole and sat upright on a big stone. Chatterer began talking aloud, and Peter listened. As soon as he heard the words, his long ears began to burn.

        - id: ch01-b18
          speaker: chatterer
          text: >-
            I'm glad that Peter isn't a spy. Spies are as hateful as can be. It's dreadful when some people try to peek into other folks' affairs.

        - id: ch01-b19
          speaker: narrator
          text: >-
            Chatterer whisked out of sight, and Peter hurried away. His ears were still burning. Finding Chatterer's secret didn't feel nearly as pleasing as Peter had imagined it would.

        - id: ch01-b20
          speaker: narrator
          text: >-
            Inside the hole in the old stone wall, Chatterer the Red Squirrel was laughing as if someone had played a wonderful joke. Someone had. The joke was on Peter Rabbit. You see, Peter hadn't found Chatterer's new house at all.
