audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
    inner_voice:
      display_name: Inner Voice
      tts:
        delivery: quiet and cautioning
        timbre: small and clear
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: Old Mr. Trouble Gets Chatterer at Last
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Of course, you have guessed what Chatterer had been meddling with. It was a mousetrap, and he had sprung it without getting hurt. He did not know it was a trap. He really should have known, but he did not.

        - id: ch01-b02
          speaker: narrator
          text: >-
            This trap looked nothing like the ones Farmer Brown's boy sometimes set for him in the Green Forest. Chatterer knew all about those, and he never went near them. Now that the mousetrap held no more excitement, he turned to the other strange thing.

        - id: ch01-b03
          speaker: narrator
          text: >-
            Chatterer walked around it and studied every side. It certainly was queer. Yes, sir, it certainly was! It looked a little like a house, except that he could see right through it.

        - id: ch01-b04
          speaker: narrator
          text: >-
            He reached out one paw and touched it. Nothing happened. He touched it again, then jumped on top. Still nothing happened. He tried his sharp teeth on it, but he could not bite it. It was made of stout wire.

        - id: ch01-b05
          speaker: narrator
          text: >-
            Something inside looked good to eat, and it smelled good too. Chatterer wondered how it would taste. The more he wondered, the more he wanted to find out. There had to be a way in. And if he could get inside, surely he could get out again.

        - id: ch01-b06
          speaker: narrator
          text: >-
            He jumped down to the floor and ran around the little wire house. At each end, he found a short wire hallway. Chatterer put his head into one of them. It seemed perfectly safe.

        - id: ch01-b07
          speaker: narrator
          text: >-
            He crept forward a little, then hurried backward. Nothing happened. He tried once more. Again, nothing happened.

        - id: ch01-b08
          speaker: inner_voice
          text: >-
            You had better stay away.

        - id: ch01-b09
          speaker: narrator
          text: >-
            The warning came from a small voice deep inside him.

        - id: ch01-b10
          speaker: chatterer
          text: >-
            Pooh! I'm not afraid. This thing can't hurt me.

        - id: ch01-b11
          speaker: narrator
          text: >-
            Chatterer crept farther in. Just ahead was a small round doorway with a wire door. He nudged it with his nose, and it opened the tiniest bit. He pulled back and watched it carefully.

        - id: ch01-b12
          speaker: narrator
          text: >-
            Then he tried again and pushed the door a little wider. He did that two or three times. At last, his head was well inside. Right below him lay the food he wanted so badly to taste.

        - id: ch01-b13
          speaker: chatterer
          text: >-
            I can jump down, get it, and jump right back up.

        - id: ch01-b14
          speaker: narrator
          text: >-
            That was what Chatterer thought.

        - id: ch01-b15
          speaker: inner_voice
          text: >-
            Don't do it. The corn is good enough. Besides, you should be going back to the Old Orchard.

        - id: ch01-b16
          speaker: chatterer
          text: >-
            It will only take a minute. I simply have to find out what it tastes like.

        - id: ch01-b17
          speaker: narrator
          text: >-
            With that, Chatterer jumped down. Snap! He looked up. The little wire door had closed.

        - id: ch01-b18
          speaker: narrator
          text: >-
            Old Mr. Trouble had caught Chatterer at last. Yes, sir, he certainly had caught him this time. Chatterer could not open the little wire door from the inside.

        - id: ch01-b19
          speaker: narrator
          text: >-
            He was trapped in the wire rat trap set by Farmer Brown's boy.
