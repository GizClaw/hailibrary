audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    inner_voice:
      display_name: 心里的小声音
      tts:
        delivery: 轻声提醒，认真而警觉
        timbre: 细小清晰
        pace: 稍慢
        pitch: 偏高
  chapters:
    - id: ch01
      title: 第十章　老麻烦先生终于捉住喋喋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 你大概已经猜到了，喋喋刚才拨弄的那个小东西，正是一只捕鼠夹。他碰响了机关，却没伤着自己。可他根本不知道那是陷阱。照理说，他该认得出来，偏偏这只捕鼠夹和农夫布朗的男孩从前放在绿森林里的那些陷阱完全不同。老陷阱是什么样，喋喋清楚得很，也从来不往跟前凑。
        - id: ch01-b02
          speaker: narrator
          text: 捕鼠夹不再响以后，喋喋觉得没意思了，便转头研究另一个怪东西。他绕着它走了一整圈，每一面都看了个仔细。那东西真是古怪。是的，先生，古怪得很！它有点儿像一座小房子，可站在外面就能把里面全看穿。
        - id: ch01-b03
          speaker: narrator
          text: 喋喋先伸出一只爪子碰它，没动静。再碰一次，还是没动静。他索性跳到顶上，也照样平安无事。最后，他拿尖牙使劲咬了咬，却一点儿也咬不动，因为这座小房子是粗铁丝做的。
        - id: ch01-b04
          speaker: narrator
          text: 小房子里面放着一样吃的，看着不错，闻起来更香。喋喋开始猜，那会是什么味道？他越猜越想亲口尝尝。他心想，总能找到进去的路吧。只要能进去，自然也能再出来。
        - id: ch01-b05
          speaker: narrator
          text: 他跳到地板上，沿着铁丝小屋四周跑了一遍。小屋两头都有一条铁丝围成的短走廊。喋喋把头伸进一边，怎么看都觉得安全。他小心爬进去一点儿，忽然又飞快地退了出来。什么事也没有。他再来一回，仍旧好端端的。
        - id: ch01-b06
          speaker: inner_voice
          text: “还是离它远一点儿吧。”
        - id: ch01-b07
          speaker: chatterer
          text: “呸！谁怕它呀？这东西根本伤不了我。”
        - id: ch01-b08
          speaker: narrator
          text: 喋喋又朝里爬了一段。面前出现了一个圆圆的小门洞，洞口还有一扇铁丝门。他用鼻尖轻轻一顶，门开了一丁点儿。喋喋马上往后一缩，疑心地盯着它。过了一会儿，他又伸鼻子去顶，这次把门推得更开了一些。
        - id: ch01-b09
          speaker: narrator
          text: 他来来回回试了两三次。最后，喋喋把整个脑袋都伸进了门里。那样叫他馋得不得了的食物，就摆在他下方。
        - id: ch01-b10
          speaker: chatterer
          text: “我跳下去把它拿到手，再立刻跳上来，不就行了吗？”
        - id: ch01-b11
          speaker: inner_voice
          text: “千万别去。玉米已经够好吃了。再说，现在也该回老果园了。”
        - id: ch01-b12
          speaker: chatterer
          text: “一小会儿就好。我非得尝尝那东西到底是什么味儿。”
        - id: ch01-b13
          speaker: narrator
          text: 话音刚落，喋喋就跳了下去。只听“啪”的一声！他抬头一看，那扇铁丝小门已经关上了。
        - id: ch01-b14
          speaker: narrator
          text: 老麻烦先生到底还是抓到了喋喋。是的，先生，这一回，喋喋真的落在了他手里。那扇小门从里面怎么也打不开。喋喋被困在陷阱中了。这正是农夫布朗的男孩设下的铁丝捕鼠笼。
