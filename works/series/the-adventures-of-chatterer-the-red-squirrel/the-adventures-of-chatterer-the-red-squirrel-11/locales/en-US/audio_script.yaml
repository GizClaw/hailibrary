audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: good-natured and teasing, with easy confidence
        timbre: clear and youthful
        pace: moderate
        pitch: medium
    black_pussy:
      display_name: Black Pussy
      tts:
        delivery: intent and expectant, expressed through natural cat sounds
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: What Happened Next to Chatterer
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Have you ever been terribly, terribly frightened? That was how Chatterer felt. He was caught. His sharp teeth could do nothing against the hard wires. He could see between them, but he could not get through them. He was too scared to think. His heart beat against his sides so hard that it hurt.

        - id: ch01-b02
          speaker: narrator
          text: >-
            The strange food he had wanted so badly was sitting right in front of him. Now he forgot all about it. He felt as though he would never want to eat again. What was going to happen when Farmer Brown's boy found him in the trap?

        - id: ch01-b03
          speaker: narrator
          text: >-
            Listen! A footstep sounded just outside the corn-crib door. Farmer Brown's boy was coming. Chatterer dashed around his little wire prison and bit fiercely at the wires. It did no good at all. He only hurt his mouth. Then the corn-crib door opened. Light poured inside, and Farmer Brown's boy came with it.

        - id: ch01-b04
          speaker: farmer_browns_boy
          emotion: surprised
          text: >-
            Hello! So you're the thief who's been taking our corn. I thought it was a rat or a mouse. Well, you little red rascal, didn't you know that stealing always ends badly? You're clever. I never suspected you once. But you weren't quite as clever as you thought. Now, what should we do with you?

        - id: ch01-b05
          speaker: narrator
          text: >-
            Farmer Brown's boy picked up the trap and carried Chatterer into the beautiful outdoors. Across the dooryard, Chatterer could see the Old Orchard and the familiar stone wall where he had scampered so many times. Everything looked as it always had. Yet it looked different now, because the cruel wires stood between Chatterer and all of it.

        - id: ch01-b06
          speaker: narrator
          text: >-
            Farmer Brown's boy set the trap on the ground and began to call.

        - id: ch01-b07
          speaker: farmer_browns_boy
          text: >-
            Puss! Puss! Puss!

        - id: ch01-b08
          speaker: narrator
          text: >-
            Chatterer's pounding heart almost stopped with fright. There was Black Pussy. He had teased her and made fun of her many times. Now a hungry gleam shone in her yellow eyes. She walked around the trap, sniffing again and again. To Chatterer, nothing had ever sounded so terrible as those hungry sniffs beside him. Black Pussy reached a paw toward him, and he saw her great, cruel claws. But her paw would not fit between the wires.

        - id: ch01-b09
          speaker: farmer_browns_boy
          text: >-
            Would you like to have him for breakfast?

        - id: ch01-b10
          speaker: black_pussy
          text: >-
            Meow.

        - id: ch01-b11
          speaker: narrator
          text: >-
            Black Pussy arched her back and rubbed against his legs. Farmer Brown's boy laughed.

        - id: ch01-b12
          speaker: farmer_browns_boy
          text: >-
            I suppose that means you'd like him very much. Do you think you could catch him if I let him out?

        - id: ch01-b13
          speaker: black_pussy
          text: >-
            Meow.

        - id: ch01-b14
          speaker: narrator
          text: >-
            To poor Chatterer, that second meow was the most dreadful sound he had ever heard.

        - id: ch01-b15
          speaker: farmer_browns_boy
          text: >-
            Well, we'll find out after a while. That's the breakfast bell, and I still haven't fed the biddies.
