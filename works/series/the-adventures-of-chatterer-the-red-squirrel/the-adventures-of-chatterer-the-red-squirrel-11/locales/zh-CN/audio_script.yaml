audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    farmer_browns_boy:
      display_name: 农夫布朗的男孩
      tts:
        delivery: 直爽利落，发现问题时认真警觉
        timbre: 清朗结实
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十一章　喋喋后来怎么样了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 你有没有吓得要命的时候？喋喋这回可真吓坏了。他已经落进捕鼠笼，绝对错不了。尖牙咬不动硬铁丝，身子也钻不过那些缝。他只能望着外面，脑子却怕得什么也想不出来。心在胸口怦怦猛撞，撞得他生疼。
        - id: ch01-b02
          speaker: narrator
          text: 刚才那样馋人的怪食物，还好端端摆在眼前，喋喋却早把它忘了。他甚至觉得，自己以后再也不想吃东西了。接下来会发生什么？农夫布朗的男孩要是发现他，会怎么处置他呢？
        - id: ch01-b03
          speaker: narrator
          text: 听，仓门外是什么声音？是脚步声。农夫布朗的男孩来了！喋喋急得在铁丝笼里四处乱窜，又狠狠咬住铁丝。可那有什么用呢？除了把嘴硌得钻心地疼，什么用也没有。
        - id: ch01-b04
          speaker: narrator
          text: 玉米仓的门忽然开了。亮光一下子涌进来，农夫布朗的男孩也跟着走进仓里。他一眼就看见了喋喋。
        - id: ch01-b05
          speaker: farmer_browns_boy
          text: “哈！原来偷我们玉米的是你。我一直以为是大耗子，或者小耗子呢。好哇，你这个红毛小坏蛋，难道不知道做贼不会有好下场吗？”
          emotion: surprised
        - id: ch01-b06
          speaker: farmer_browns_boy
          text: “你还真有点儿机灵，我一次也没怀疑到你头上。可你也没自己想的那么聪明嘛。现在，该拿你怎么办才好呢？”
        - id: ch01-b07
          speaker: narrator
          text: 他提起捕鼠笼，把喋喋带到了外面那片美丽又开阔的天地里。隔着院子，就是老果园，还有那堵熟悉的老石墙。喋喋从前不知在那上面跑过多少回。
        - id: ch01-b08
          speaker: narrator
          text: 老果园和老石墙看起来一点儿也没变。可是，对喋喋来说，它们又不一样了。因为无论他望向哪里，眼前都隔着残酷的铁丝。正是这些铁丝，把他和熟悉的一切分开了。
        - id: ch01-b09
          speaker: narrator
          text: 农夫布朗的男孩把笼子放在地上，开口叫猫。
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: “咪咪，咪咪，咪咪！”
        - id: ch01-b11
          speaker: narrator
          text: 喋喋的心原本跳得飞快，这下几乎吓得停住了。黑猫真的来了。喋喋以前没少捉弄她，还常常拿她寻开心。现在，黑猫绕着捕鼠笼走来走去。她一次又一次凑近了嗅，黄色眼睛里闪着饥饿的光。
        - id: ch01-b12
          speaker: narrator
          text: 那一声声馋嘴的嗅鼻声就在身边，喋喋从没听过这么可怕的动静。黑猫伸出一只爪子，想从铁丝缝里探进去。喋喋眼看着那些又大又狠的利爪靠近，好在铁丝缝太窄，她的爪子伸不进去。
        - id: ch01-b13
          speaker: farmer_browns_boy
          text: “让他给你当早饭，怎么样？”
        - id: ch01-b14
          speaker: narrator
          text: 黑猫弓起背，在男孩的腿上蹭了蹭，嘴里答了一声“喵”。
        - id: ch01-b15
          speaker: farmer_browns_boy
          text: “我猜，你这是说自己很想吃掉他。要是我把他放出来，你捉得到吗？”
        - id: ch01-b16
          speaker: narrator
          text: 农夫布朗的男孩笑了。黑猫又答了一声“喵”。可怜的喋喋听着，只觉得这是他一辈子听过的最可怕的声音。
        - id: ch01-b17
          speaker: farmer_browns_boy
          text: “好吧，过一会儿再瞧。早饭铃已经响了，我还没喂母鸡呢。”
