audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 随和热心，思考时稍稍放慢
        timbre: 清爽柔和
        pace: 中等
        pitch: 中高音
    prickly_porky:
      display_name: 豪猪刺毛波奇
      tts:
        delivery: 直率憨厚，容易着恼，笑起来毫不拘束
        timbre: 粗厚而温暖
        pace: 稍慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十九章　彼得兔设法相助
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔是绿森林和绿草地上心肠最好的小居民之一。他整天快快活活，偏偏又好奇得不得了，所以总会惹上各种麻烦。
        - id: ch01-b02
          speaker: narrator
          text: 也许正因为彼得自己吃过不少苦头，他一听说别人倒了霉，就忍不住替人家难过，还会马上琢磨，该怎样帮上一把。
        - id: ch01-b03
          speaker: narrator
          text: 这一次，他亲眼看见喋喋关在农夫布朗家里，才知道冠蓝鸦萨米说的全是真话。从那一刻起，彼得便想个不停，一心要把喋喋救出来。
        - id: ch01-b04
          speaker: narrator
          text: 可是，彼得根本不知道那座牢笼是什么样子。他忽然记起一件旧事。农夫布朗的男孩曾把土拨鼠约翰尼走失的小宝宝关在箱子里，豪猪刺毛波奇却在箱子上啃出一个大洞，救出了小家伙。
        - id: ch01-b05
          speaker: narrator
          text: 刺毛波奇既然帮过约翰尼，当然也能帮喋喋。彼得这么一想，立刻就要去找他。
        - id: ch01-b06
          speaker: narrator
          text: 彼得的毛病就在这里。他遇事很少前前后后想周全，脑中先冒出什么主意，马上就照着去做。可第一个主意，不一定就是最聪明、最妥当的主意。
        - id: ch01-b07
          speaker: narrator
          text: 彼得撒开长腿，飞快地奔进绿森林。要找刺毛波奇很容易，只要循着一路被剥掉树皮的树走下去就行。
        - id: ch01-b08
          speaker: peter_rabbit
          text: “下午好，刺毛波奇。喋喋的事，你听说了吗？”
        - id: ch01-b09
          speaker: narrator
          text: 彼得一路跑得上气不接下气，这句话也说得飞快。
        - id: ch01-b10
          speaker: prickly_porky
          text: “听说了。他这是自找的。受了这回教训，看他以后还敢不敢乱来。”
        - id: ch01-b11
          speaker: narrator
          text: 彼得听了，心一下子沉下去。
        - id: ch01-b12
          speaker: peter_rabbit
          text: “这还不可怕吗？要是我们救不了他，他以后就再也回不到绿森林，再也不能跑来跑去、痛快玩耍了。”
          emotion: sad
        - id: ch01-b13
          speaker: prickly_porky
          text: “那不是正好吗？他一向惹人讨厌，专给别人找麻烦。我还没见过第二个这么会闯祸的家伙。真的，先生，从来没见过。如今大家终于能清静清静了。他活该。”
        - id: ch01-b14
          speaker: narrator
          text: 刺毛波奇说完，又低头啃起树皮，好像喋喋遇上什么麻烦都跟他没有关系。
        - id: ch01-b15
          speaker: narrator
          text: 彼得的心沉得更低了。他抬起一只长长的后脚，慢慢挠着一只长耳朵。每次用力想事情，他都会这样。
        - id: ch01-b16
          speaker: narrator
          text: 他想得太专心，没看见刺毛波奇那双黯淡的小眼睛里藏着笑意。其实，刺毛波奇并没有嘴上说的那么冷酷。
        - id: ch01-b17
          speaker: narrator
          text: 就这样，一个想啊想，一个吃啊吃，过了好半天，刺毛波奇终于又说话了。
        - id: ch01-b18
          speaker: prickly_porky
          text: “彼得，你到底在琢磨什么呢？”
        - id: ch01-b19
          speaker: peter_rabbit
          text: “我——我在想，要是你肯到农夫布朗家去，在牢笼上替喋喋啃出一条逃路，那就太好了。”
        - id: ch01-b20
          speaker: narrator
          text: 这个主意明明已经想了很久，可彼得说出来时，声音还是怯生生的。
        - id: ch01-b21
          speaker: prickly_porky
          text: “哼！有人嫌我的脑筋转得慢，可连我都知道这主意不行。彼得兔，把思考帽戴好，再想一次吧。”
        - id: ch01-b22
          speaker: peter_rabbit
          text: “为什么不行？你又不怕猎犬鲍泽，也不怕农夫布朗的男孩。除了臭鼬吉米，别人可全都怕他们。”
        - id: ch01-b23
          speaker: narrator
          text: 可彼得仍旧不肯放弃这个主意。
        - id: ch01-b24
          speaker: prickly_porky
          text: “因为要是我能从外面把牢笼啃穿，喋喋自己就能从里面啃出来。他的牙齿那么尖，连他都办不到，我当然也啃不进去。彼得兔，你的常识到哪里去了？”
        - id: ch01-b25
          speaker: peter_rabbit
          text: “你说得对。我刚才没想到这一层。我只好再想个别的办法，帮喋喋出来。”
          emotion: sad
        - id: ch01-b26
          speaker: narrator
          text: 彼得终于听明白了。他放慢声音，心里难过极了。
        - id: ch01-b27
          speaker: prickly_porky
          text: “要是这办法真有用，我很愿意去试。可惜它一点用也没有。”
        - id: ch01-b28
          speaker: narrator
          text: 刺毛波奇补上这句话，是不愿让彼得把他当成一个铁石心肠的家伙。
        - id: ch01-b29
          speaker: narrator
          text: 彼得只好向刺毛波奇告别，回那片亲爱的老荆棘丛去。他打算一路上再想想，还有没有别的办法能救喋喋。
        - id: ch01-b30
          speaker: narrator
          text: 路上，他先后吵醒了负鼠比利大叔和浣熊博比，可他们也帮不上忙。
        - id: ch01-b31
          speaker: peter_rabbit
          text: “看来，我真的一点忙也帮不上了。”
          emotion: sad
        - id: ch01-b32
          speaker: narrator
          text: 彼得叹了口气。而这一次，的确没有任何办法。
