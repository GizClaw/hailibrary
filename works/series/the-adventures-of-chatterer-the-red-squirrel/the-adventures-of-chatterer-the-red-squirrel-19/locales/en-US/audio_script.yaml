audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    peter:
      display_name: Peter Rabbit
      tts:
        delivery: friendly and curious with an earnest, impulsive manner
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
    prickly_porky:
      display_name: Prickly Porky
      tts:
        delivery: blunt and gruff with dry, thoughtful humor
        timbre: rough and deep
        pace: slow
        pitch: low
  chapters:
    - id: ch01
      title: Peter Thinks of a Plan
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit is one of the kindest little people in the Green Forest or on the Green Meadows. He goes through life happily, though his dreadful curiosity is always getting him into trouble. Perhaps that is why he feels so sorry for anyone else who gets into a scrape. The moment Peter hears that someone is in trouble, he starts wondering what he can do to help.

        - id: ch01-b02
          speaker: narrator
          text: >-
            So when Peter learned for himself that Sammy Jay had told the truth, he began to think very hard. Chatterer the Red Squirrel really was being held prisoner at Farmer Brown's house. Somehow, Peter meant to help him.

        - id: ch01-b03
          speaker: narrator
          text: >-
            Of course, Peter had no idea what kind of prison held Chatterer. But he remembered the time Farmer Brown's boy had kept Johnny Chuck's lost baby in a box. Prickly Porky the Porcupine had gnawed a great hole in that box. Why couldn't he do the same thing for Chatterer? Peter decided to ask him right away.

        - id: ch01-b04
          speaker: narrator
          text: >-
            Peter's trouble is that he doesn't stop to look at every side of a question. He is impulsive. That means he acts on the first idea that jumps into his head, without stopping to think the whole thing through. Sometimes that first idea isn't the wisest or best one. This time, he scampered into the Green Forest as fast as his long legs could carry him.

        - id: ch01-b05
          speaker: narrator
          text: >-
            Finding Prickly Porky was easy. Peter only had to follow the trail of trees with their bark stripped away.

    - id: ch02
      title: Prickly Porky Sees the Trouble
      blocks:
        - id: ch02-b01
          speaker: peter
          text: >-
            Good afternoon, Prickly Porky! Have you heard what's happened to Chatterer?

        - id: ch02-b02
          speaker: narrator
          text: >-
            Peter spoke in a rush because the run had left him quite out of breath.

        - id: ch02-b03
          speaker: prickly_porky
          text: >-
            Yes, I've heard. It serves him right. Maybe this will finally teach him a lesson.

        - id: ch02-b04
          speaker: narrator
          text: >-
            Peter's heart sank.

        - id: ch02-b05
          speaker: peter
          text: >-
            But isn't it dreadful? Unless we get him out, he'll never run and play in the Green Forest again.

        - id: ch02-b06
          speaker: prickly_porky
          text: >-
            Good. Chatterer has always been a nuisance. I've never known anyone who caused so much trouble for everybody else. No, sir, I never have. Now the rest of us may get a little peace. It serves him right.

        - id: ch02-b07
          speaker: narrator
          text: >-
            Prickly Porky went right on chewing bark, as though Chatterer's trouble meant nothing to him. Peter's heart sank even lower. He slowly scratched one long ear with a hind foot, the way he always does when he is thinking as hard as he can.

        - id: ch02-b08
          speaker: narrator
          text: >-
            Peter was too deep in thought to notice the twinkle in Prickly Porky's dull little eyes. Prickly Porky wasn't truly as hard-hearted as he sounded. For a long while, Peter thought and thought, while Prickly Porky ate and ate. At last the porcupine spoke again.

        - id: ch02-b09
          speaker: prickly_porky
          text: >-
            What's on your mind, Peter?

        - id: ch02-b10
          speaker: peter
          text: >-
            I... I was thinking how wonderful it would be if you went up there and gnawed an opening in Chatterer's prison so he could get out.

        - id: ch02-b11
          speaker: prickly_porky
          text: >-
            Huh! Some people say I'm slow-witted, but even I know that won't work. You'd better put your thinking cap back on, Peter Rabbit.

        - id: ch02-b12
          speaker: peter
          text: >-
            Why wouldn't it work? You aren't afraid of Bowser the Hound or Farmer Brown's boy. Everyone else is afraid of them, except Jimmy Skunk.

        - id: ch02-b13
          speaker: prickly_porky
          text: >-
            Because if I could gnaw my way into that prison, Chatterer could gnaw his way out. His teeth are sharp. If they can't make an opening, mine certainly can't. Peter Rabbit, where is your common sense?

        - id: ch02-b14
          speaker: peter
          text: >-
            You're right. I never thought of that. I'll have to find another way to help Chatterer.
          emotion: sad

        - id: ch02-b15
          speaker: prickly_porky
          text: >-
            I'd try if it could do any good, Peter. But it couldn't.

        - id: ch02-b16
          speaker: narrator
          text: >-
            Prickly Porky wanted Peter to understand that he wasn't really as hard-hearted as he had seemed at first.

    - id: ch03
      title: No Way to Help
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Peter said good-by to Prickly Porky and started home for the dear Old Briar-patch. He meant to think of some other way to help Chatterer.

        - id: ch03-b02
          speaker: narrator
          text: >-
            Along the way, he woke Unc' Billy Possum and Bobby Coon. Neither one could help him.

        - id: ch03-b03
          speaker: narrator
          text: >-
            At last, Peter could only sigh.

        - id: ch03-b04
          speaker: peter
          text: >-
            It truly seems there isn't any way for me to help.
          emotion: sad

        - id: ch03-b05
          speaker: narrator
          text: >-
            And there truly wasn't.
