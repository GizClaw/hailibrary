audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    inner_voice:
      display_name: 心里的小声音
      tts:
        delivery: 轻声提醒，认真而警觉
        timbre: 细小清晰
        pace: 稍慢
        pitch: 偏高
  chapters:
    - id: ch01
      title: 第九章　喋喋好奇过了头
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 谁都知道彼得兔有多好奇。他老爱把那只颤悠悠的小鼻子伸到不该伸的地方，也就老是惹麻烦。喋喋每回听到彼得又因为好奇闯了祸，总说那是彼得自找的。
        - id: ch01-b02
          speaker: narrator
          text: 喋喋觉得，自己当然不一样。头一回看见什么，他也许会好奇，可他有头脑啊。没把东西彻底弄明白以前，他才不会随便去碰。所以大家都以为他聪明极了，聪明得什么陷阱也捉不住他。至少，普通的陷阱肯定不行。
        - id: ch01-b03
          speaker: narrator
          text: 不过，有些人真正有多聪明是一回事，让邻居觉得他很聪明，又是另一回事。喋喋就是这样。农夫布朗的男孩发现那根被喋喋粗心丢下、泄露了秘密的玉米穗轴以后，第二天一早，要是有邻居朝玉米仓里看一眼，一定会吓一跳。是的，先生，真的会吓一大跳。
        - id: ch01-b04
          speaker: narrator
          text: 因为那个爱吹牛、自以为脑子快的红松鼠喋喋，此刻竟和彼得兔一样，满肚子都是好奇。
        - id: ch01-b05
          speaker: narrator
          text: 这天，喋喋照常来玉米仓取每天要吃的那份玉米，又照常在高高的金黄玉米堆上跑来跑去。忽然，他那双尖眼睛瞧见了一个从来没见过的东西。它就在仓门旁边的地板上，喋喋敢肯定，昨天那里还没有它。那东西模样古怪，实在古怪极了。旁边还有一个怪东西，只是小得多。
        - id: ch01-b06
          speaker: narrator
          text: 这两个东西到底是什么？喋喋满心怀疑地盯着它们。它们看起来倒是没有危险，也一动不动。他往前跑了几步，像平时在外面遇见任何新东西时那样，冲着它们吱吱责骂。可那两个怪东西还是一动不动。
        - id: ch01-b07
          speaker: narrator
          text: 喋喋又绕到一条小窄台上，从那里正好能低头看清它们。这下他肯定了，它们都不是活物。大的那个，从一头能一直看穿到另一头，里面还放着吃的。小的那个又圆又扁，像是木头做的，顶上有几根模样古怪的细铁丝。它的四周还开着小圆洞，可那些洞太小了，连喋喋的脑袋也钻不进去。
        - id: ch01-b08
          speaker: inner_voice
          text: “别碰它们。”
        - id: ch01-b09
          speaker: chatterer
          text: “可我就是想知道它们是什么，还想把它们彻底弄明白。”
        - id: ch01-b10
          speaker: inner_voice
          text: “不知道底细的东西，碰了从来没有好结果。”
        - id: ch01-b11
          speaker: chatterer
          text: “它们只是长得怪，又不是活的，怎么可能伤到我？”
        - id: ch01-b12
          speaker: narrator
          text: 话虽这么说，喋喋还是跑回玉米堆，想吃点东西。可他的胃口不知跑到哪儿去了，眼睛也一直盯着地板上的两个怪东西。
        - id: ch01-b13
          speaker: inner_voice
          text: “你最好离远一点儿。”
        - id: ch01-b14
          speaker: chatterer
          text: “我就凑近看看，这总不会有什么害处。”
        - id: ch01-b15
          speaker: narrator
          text: 于是，喋喋又爬下玉米堆，慢慢挨近它们。越往前走，他越觉得它们没有危险。最后，他探过身子，闻了闻小的那个，马上皱起了鼻子。
        - id: ch01-b16
          speaker: chatterer
          text: “有耗子的味道，就是玉米仓里那些普通耗子的味儿。”
        - id: ch01-b17
          speaker: narrator
          text: 喋喋伸出一只爪子，轻轻碰了碰那个东西。
        - id: ch01-b18
          speaker: chatterer
          text: “呸，这有什么可怕的！”
        - id: ch01-b19
          speaker: narrator
          text: 就在这时，他碰到了一根小铁丝。只听“啪”的一声，喋喋吓得飞快逃开。可他又舍不得走远。那声响多有意思，而且根本没伤到他。要知道，他没把爪子伸进小圆洞里，不然可就未必了。
        - id: ch01-b20
          speaker: narrator
          text: 没多久，喋喋又跑回来，拨弄起顶上的小铁丝。隔一会儿，夹子就“啪”地响一下，他也跟着飞奔开去。这个玩法叫人害怕，却又实在好玩。
        - id: ch01-b21
          speaker: narrator
          text: 后来，小东西再也不响了。喋喋玩腻了这个怪玩具，便开始惦记旁边那个大的。既然第一个没伤到他，他就认定，另一个肯定也伤不了他。
