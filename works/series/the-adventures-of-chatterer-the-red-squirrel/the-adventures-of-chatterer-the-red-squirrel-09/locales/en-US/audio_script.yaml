audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
    inner_voice:
      display_name: Chatterer's Inner Voice
      tts:
        delivery: quiet, cautious, and plainspoken
        timbre: light and clear
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: Chatterer Grows Too Curious
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Everyone knows how curious Peter Rabbit is. He is always poking his wobbly little nose where it does not belong, and that is always getting him into trouble. Whenever Chatterer the Red Squirrel heard about Peter's latest scrape, he said Peter got exactly what he deserved. Chatterer might wonder about something new, but he claimed he had too much sense to meddle before he knew all about it. That was why everyone thought he was very smart, much too smart for an ordinary trap.

        - id: ch01-b02
          speaker: narrator
          text: >-
            But plenty of people manage to make their neighbors believe they are much smarter than they really are, and Chatterer was one of them. Imagine if some of those neighbors had peeked inside Farmer Brown's corn-crib one particular morning. It was the morning after Farmer Brown's boy found the corn-cob Chatterer had carelessly dropped. What they saw would have surprised them. Yes, sir, there was boastful Chatterer, the one with such sharp wits, showing every bit as much curiosity as Peter Rabbit had ever shown.

        - id: ch01-b03
          speaker: narrator
          text: >-
            Chatterer had come to the corn-crib for his daily supply of corn. Just as he always did, he raced around over the great yellow pile. Then his sharp eyes caught something new on the floor near the door. He was certain it had not been there the day before. It looked very queer indeed. Then he spotted another strange thing nearby, only this one was much smaller. What in the world could those two things be?

        - id: ch01-b04
          speaker: narrator
          text: >-
            Chatterer watched them suspiciously, though they seemed harmless enough. Neither one moved. He ran a few steps toward them and scolded, just as he did whenever he found something new outdoors. Still they did not move. Then he ran along a little ledge where he could look straight down at them. Now he felt sure they were not alive. He could see all the way through the bigger one, and there was something to eat inside it. The smaller thing was round and flat, with funny pieces of wire on top. It looked as though it was made of wood. Along its sides were little round holes, but every hole was too small for Chatterer to put his head through.

        - id: ch01-b05
          speaker: inner_voice
          text: >-
            Leave those things alone.

        - id: ch01-b06
          speaker: chatterer
          text: >-
            But I want to know what they are. I want to learn all about them.

        - id: ch01-b07
          speaker: inner_voice
          text: >-
            Meddling with strange things never leads to anything good.

        - id: ch01-b08
          speaker: chatterer
          text: >-
            They only look odd. They aren't alive, so how could they hurt me?

        - id: ch01-b09
          speaker: narrator
          text: >-
            Even so, Chatterer ran back to the corn and tried to eat. His appetite was gone. He could not stop staring at the two queer things below.

        - id: ch01-b10
          speaker: inner_voice
          text: >-
            You had better stay away.

        - id: ch01-b11
          speaker: chatterer
          text: >-
            A closer look can't do any harm.

        - id: ch01-b12
          speaker: narrator
          text: >-
            So Chatterer scrambled down from the pile of corn once more. He moved toward the two strange objects little by little. With every step, they seemed more harmless. At last he was close enough to stretch out and sniff the smaller one. Then he turned up his nose.

        - id: ch01-b13
          speaker: chatterer
          text: >-
            It smells like mice. Just ordinary barn mice.

        - id: ch01-b14
          speaker: narrator
          text: >-
            He reached out one paw and touched it.

        - id: ch01-b15
          speaker: chatterer
          text: >-
            Pooh! There's nothing frightening about this.

        - id: ch01-b16
          speaker: narrator
          text: >-
            Just then, his paw touched one of the little wires. Snap! The sudden sound frightened Chatterer so badly that he scurried away. But he could not make himself stay away for long. That snap had been such a funny thing, and it had done him no harm. You see, he had not put his paw through one of the little holes. If he had, that snap might have harmed him after all.

        - id: ch01-b17
          speaker: narrator
          text: >-
            Before long, Chatterer was back again, meddling with the little wires on top. Every once in a while, there came another snap, and each time he scampered away. The game was very frightening and great fun at the same time. By and by, the little thing would not snap anymore. Chatterer soon grew tired of that queer plaything. His thoughts turned to the other strange object instead. Nothing bad had happened with the first one, so he became certain that nothing bad could happen with the other one either.
