audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: youthful and playful, with openhearted energy
        timbre: clear and light
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Enemies Who Might Be Friends
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            No one is bad through and through. You can find some good in every heart. Even your enemies may become your friends, if you are willing to do your part.

        - id: ch01-b02
          speaker: narrator
          text: >-
            All his life, Chatterer the Red Squirrel had thought of Farmer Brown's boy as an enemy. So had all the other little people of the Green Meadows, the Green Forest, and the Smiling Pool. They were afraid of him, and their fear made them hate him. Whenever he came near, away they ran.

        - id: ch01-b03
          speaker: narrator
          text: >-
            At first, Farmer Brown's boy chased them for only one reason. He wanted to make friends, and he could not imagine how to do that without catching them. But he never could catch them. After a while, he decided they did not want his friendship. Then he began hunting them because trying to outwit them seemed like fun.

        - id: ch01-b04
          speaker: narrator
          text: >-
            Of course, that only made the little people fear and hate him more. They did not know that he truly had one of the kindest hearts in the world. And he did not understand that they hated him simply because they did not know him.

    - id: ch02
      title: A Patient Visitor
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            So when Chatterer was caught in the trap inside Farmer Brown's corn crib, he felt certain Farmer Brown's boy would give him to Black Pussy, or do something just as cruel. Then he found himself kept in a very comfortable prison with plenty of food and water. Still, Chatterer refused to believe anything good about the boy. If anything, he hated him more than ever.

        - id: ch02-b02
          speaker: narrator
          text: >-
            Farmer Brown's boy was patient. Many times each day, he came to Chatterer's prison. He whistled, clucked, and talked to him. He always brought something tasty, and he seemed to be forever thinking up a new treat.

        - id: ch02-b03
          speaker: narrator
          text: >-
            At first, the moment Chatterer saw him coming, he hid inside his hollow stump. He would not even peek out until the boy had gone. Once Chatterer knew the way was clear, he came out again. Each time, delicious fat nuts or some other dainty waited for him.

        - id: ch02-b04
          speaker: narrator
          text: >-
            Before long, the sight of Farmer Brown's boy made Chatterer wonder what good thing he had brought this time. Then Chatterer could hardly bear to wait for him to leave so he could find out.

    - id: ch03
      title: The Longest Day
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Soon Chatterer could not wait at all. He began slyly peeping through his little round doorway to see what the boy had brought him.

        - id: ch03-b02
          speaker: narrator
          text: >-
            Then, one day, Farmer Brown's boy did not come. Chatterer tried to convince himself that he was glad. He told himself how much he hated the boy, and how he hoped never, ever to see him again.

        - id: ch03-b03
          speaker: narrator
          text: >-
            Yet Chatterer knew all the while that none of that was true. It was the longest day he had spent in prison.

        - id: ch03-b04
          speaker: narrator
          text: >-
            Early the next morning, before Chatterer was out of bed, a footstep sounded in the woodshed. Before he even knew what he was doing, he popped out of the hollow stump to see if Farmer Brown's boy had returned.

    - id: ch04
      title: A Pleasant Smile
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            There he was. He had brought three great fat nuts, and he dropped them into Chatterer's cage. Now it seemed to Chatterer that he simply could not wait for the boy to go away.

        - id: ch04-b02
          speaker: narrator
          text: >-
            At last, Chatterer darted forward and grabbed one. He scampered back beneath the shelter of his hollow stump and ate it. As soon as it was gone, he had to have another.

        - id: ch04-b03
          speaker: narrator
          text: >-
            Farmer Brown's boy was still watching, but somehow Chatterer was not quite so frightened now. This time, he sat on one of the stump's little branches and ate the nut where the boy could see him. Farmer Brown's boy smiled. It was a pleasant smile.

        - id: ch04-b04
          speaker: farmer_browns_boy
          text: >-
            I think we may become friends after all.

