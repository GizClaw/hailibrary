audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    farmer_browns_boy:
      display_name: 农夫布朗的男孩
      tts:
        delivery: 坦率友善，带着少年人的耐心
        timbre: 清朗自然
        pace: 从容
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十五章　农夫布朗的男孩想和喋喋交朋友
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 世上没有谁从里到外全是坏的，每颗心里总藏着一点善意。只要你也肯尽一份心，敌人说不定就会变成朋友。
        - id: ch01-b02
          speaker: narrator
          text: 喋喋从小就把农夫布朗的男孩当成敌人。绿草地、绿森林和微笑池里的小居民们也都怕他。大家因为害怕而恨他，所以只要男孩靠近，就会立刻逃走。
        - id: ch01-b03
          speaker: narrator
          text: 最早的时候，男孩追他们，只是想跟他们交朋友。他想不出别的办法，觉得非得先抓住他们才行。可他追了很久，一个也抓不到，便认定这些小居民不愿意做他的朋友。
        - id: ch01-b04
          speaker: narrator
          text: 后来，男孩开始猎捕他们。他觉得，想办法斗智赢过他们很有趣。小居民们哪会知道他的心其实非常仁厚呢？他们只会变得更怕他，也更恨他。男孩同样不明白，他们恨他，正是因为一点儿也不了解他。
        - id: ch01-b05
          speaker: narrator
          text: 所以，喋喋在玉米仓里中了陷阱以后，马上认定男孩会把自己交给黑猫，或者做出同样残忍的事情。后来他发现，自己不过是被关在一座舒服的监牢里，吃喝也从来不缺。可他还是不肯相信男孩有好心，甚至比以前更恨他了。
        - id: ch01-b06
          speaker: narrator
          text: 农夫布朗的男孩却很有耐心。他每天一次又一次地来到笼边，又吹口哨，又咂嘴轻唤，还不停地跟喋喋讲话。每回来，他都会带上一样好吃的，从没有空着手。
        - id: ch01-b07
          speaker: narrator
          text: 男孩似乎总在琢磨，下一回该拿什么新鲜的美味来招待喋喋。可是起初，他刚一露面，喋喋就躲进小木桩的树洞里，连头也不肯探出来。一直等到男孩走远了，喋喋才敢出来。
        - id: ch01-b08
          speaker: narrator
          text: 每次到了这时候，外面总有肥美的坚果，或者别的好东西在等着他。渐渐地，喋喋一看到男孩走来，心里先冒出来的念头变了。这一回，他带来的会是什么呢？喋喋急得只盼男孩赶快离开，好让自己立刻去瞧瞧。
        - id: ch01-b09
          speaker: narrator
          text: 又过了一阵，喋喋连这点时间也等不下去了。男孩还没走，他便从圆圆的小门后面偷偷露出脑袋，看看今天送来的是什么。
        - id: ch01-b10
          speaker: narrator
          text: 可有一天，农夫布朗的男孩一次也没来。喋喋硬说自己很高兴，还一遍遍告诉自己，他讨厌那个男孩，巴不得永远都别再见到他。
        - id: ch01-b11
          speaker: narrator
          text: 但喋喋心里明白，这些话全是假的。自从被关进笼子，那一天从来没有那么漫长过。
        - id: ch01-b12
          speaker: narrator
          text: 第二天一早，喋喋还没起床，就听见柴房里传来脚步声。他根本没顾上想，已经从树洞里冲出来了。他非得看看，来的到底是不是农夫布朗的男孩。
        - id: ch01-b13
          speaker: narrator
          text: 果然是他。男孩带来了三颗又大又饱满的坚果，把它们一颗一颗丢进喋喋的笼子。喋喋盯着坚果，觉得自己再也等不到男孩离开了。
        - id: ch01-b14
          speaker: narrator
          text: 终于，他猛地蹿过去抓起一颗，又飞快躲回树洞里吃掉。可吃完以后，他还想要第二颗。男孩依旧站在那里看着，喋喋却不知不觉没那么害怕了。
        - id: ch01-b15
          speaker: narrator
          text: 这一回，他坐到木桩的一根小树枝上，当着男孩的面吃起坚果。农夫布朗的男孩看着他笑了。那是一个亲切又和善的笑容。
        - id: ch01-b16
          speaker: farmer_browns_boy
          text: “看来，我们最后还是能成为朋友。”
