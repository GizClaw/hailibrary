audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    sammy_jay:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 尖刻活泼，谈起消息时格外来劲
        timbre: 清脆响亮
        pace: 明快
        pitch: 偏高
  chapters:
    - id: ch01
      title: 第三章　喋喋把黄鼠狼影子的消息告诉萨米
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 喋喋匆匆穿过绿森林，连自己要去哪儿都不知道。他脑子里只有一件事，那就是逃得越远越好，千万别再碰见黄鼠狼影子。只要一想起影子，他就会从头到脚打个冷战。
        - id: ch01-b02
          speaker: sammy_jay
          text: “你赶得这么急，是要上哪儿去呀？”
        - id: ch01-b03
          speaker: narrator
          text: 声音是从路旁的一棵松树上传来的。喋喋根本不用抬头。在绿森林里，谁会听不出冠蓝鸦萨米的声音呢？
        - id: ch01-b04
          speaker: sammy_jay
          text: “看你跑成这样，该不会是在躲谁吧？”
        - id: ch01-b05
          speaker: narrator
          text: 萨米分明是在取笑他。若是平常，喋喋早就停下来吵架了，他们每次见面几乎都是这样。可今天不行，他还怕得厉害。
        - id: ch01-b06
          speaker: chatterer
          text: “我……我就是在躲着谁。”
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: 喋喋的声音低得几乎听不见。萨米瞪着他，像是不敢相信自己的耳朵。喋喋那么爱吹牛，从来不肯承认自己害怕。能把他吓成这样，准是真的出了大事。
        - id: ch01-b08
          speaker: sammy_jay
          text: “你说什么？我早知道你胆小，可你亲口承认，这还是头一回。快说，你到底在躲谁？”
        - id: ch01-b09
          speaker: chatterer
          text: “黄鼠狼影子。他回到绿森林了。我刚刚差一点儿就逃不掉！”
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: 喋喋还是压低声音，仿佛怕影子躲在哪里偷听。
        - id: ch01-b11
          speaker: sammy_jay
          text: “嚯，这可是大事！我还当影子在老牧场呢。他既然回来了，就该让大家都知道。影子现在在哪儿？”
        - id: ch01-b12
          speaker: narrator
          text: 喋喋这才停下，把刚才的险情从头讲了一遍。他说，黄鼠狼影子钻进了栗树的树洞，红尾鹰正守在外面，等着影子露头。他又讲到，自己还扯了老红尾的尾羽。萨米一听，眼睛都亮了。
        - id: ch01-b13
          speaker: chatterer
          text: “直到现在，红尾还不知道是谁扯的。他以为是影子干的呢。”
        - id: ch01-b14
          speaker: narrator
          text: 喋喋说着，勉强露出一丝笑容。
        - id: ch01-b15
          speaker: sammy_jay
          text: “嚯，嚯，嚯！哈，哈，哈！我要是在场，能亲眼瞧见那一幕就好啦！”
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: 笑过以后，萨米一下子认真起来。
        - id: ch01-b17
          speaker: sammy_jay
          text: “影子回到绿森林，这消息当然得告诉别人，好让大家提防。谁要是听过警告还被抓住，那就只能怪自己了。我这就去把消息传开。”
        - id: ch01-b18
          speaker: narrator
          text: 萨米平时是有些讨人嫌，可他也有好心的一面，谁不是这样呢？再说，他最爱四处传递重要消息了。
        - id: ch01-b19
          speaker: chatterer
          text: “我……我想请你先去告诉我的表兄，就是灰松鼠快乐杰克。”
        - id: ch01-b20
          speaker: narrator
          text: 喋喋说得吞吞吐吐。萨米探过身，紧盯着他。
        - id: ch01-b21
          speaker: sammy_jay
          text: “奇怪，你跟快乐杰克不是合不来吗？你们两个见面总要吵架。”
        - id: ch01-b22
          speaker: narrator
          text: 喋喋有点儿难为情，可他的嘴一向转得很快，马上就想出了回答。
        - id: ch01-b23
          speaker: chatterer
          text: “正因为这样呀！快乐杰克要是出了事，我不就没人可吵了吗？看他气得发火，多有意思！”
        - id: ch01-b24
          speaker: narrator
          text: 可那不是真正的原因。喋喋心里还在为刚才的念头羞愧。为了让自己脱身，他竟想过把影子引到快乐杰克家去。那念头又可怕又怯懦，他真不敢相信自己会那么想。现在，他只盼着能替快乐杰克做点事，让心里好受一点儿。
        - id: ch01-b25
          speaker: narrator
          text: 萨米答应立刻去警告快乐杰克。接着，他一边飞，一边高声叫喊，说黄鼠狼影子已经回到绿森林了。这样一来，林子里的小居民们都能听见。喋喋站在那里听了几分钟，也重新上路了。
        - id: ch01-b26
          speaker: chatterer
          text: “我该去哪儿呢？我到底该去哪儿呢？绿森林是不能待了。影子现在非抓住我不可，他绝不会罢休的。”
          emotion: fearful
