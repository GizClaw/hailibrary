audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp and teasing, with a love of important news
        timbre: bright and piercing
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Chatterer Tells Sammy Jay About Shadow the Weasel
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Chatterer hurried on through the Green Forest. He did not know where he was going, and just then he did not care. One thought drove him on. He had to put as much distance as possible between himself and Shadow the Weasel. Every time he thought of Shadow, cold shivers ran all over him.

        - id: ch01-b02
          speaker: sammy_jay
          text: >-
            You seem to be in an awful hurry.

        - id: ch01-b03
          speaker: narrator
          text: >-
            The voice came from a pine tree beside Chatterer's path. He did not need to look up. Everyone in the Green Forest knew the voice of Sammy Jay.

        - id: ch01-b04
          speaker: sammy_jay
          text: >-
            Why, it looks as though you're running away from somebody!

        - id: ch01-b05
          speaker: narrator
          text: >-
            Sammy was jeering at him. Usually, Chatterer would have stopped right there and picked a quarrel with Sammy, as he did nearly every time they met. This time, he wanted to stop, but the fear of Shadow still had hold of him.

        - id: ch01-b06
          speaker: chatterer
          emotion: fearful
          text: >-
            I... I am running away.

        - id: ch01-b07
          speaker: narrator
          text: >-
            His voice was very low. Sammy stared as if he could not believe his ears. Chatterer was a great boaster, and Sammy had never known him to admit he was frightened. Whatever had scared him must be serious.

        - id: ch01-b08
          speaker: sammy_jay
          text: >-
            What did you say? I've always known you were a coward, but I've never heard you admit it before. Who are you running from?

        - id: ch01-b09
          speaker: chatterer
          emotion: fearful
          text: >-
            Shadow the Weasel. He's back in the Green Forest, and I only just got away from him!

        - id: ch01-b10
          speaker: narrator
          text: >-
            Chatterer kept his voice down, almost as if Shadow might overhear him.

        - id: ch01-b11
          speaker: sammy_jay
          emotion: surprised
          text: >-
            Ho! That is important. I thought Shadow was up in the Old Pasture. If he's back here, everyone needs to know. Where is he now?

        - id: ch01-b12
          speaker: narrator
          text: >-
            Chatterer stopped and told Sammy the whole story of his narrow escape. He explained that he had left Shadow hiding inside a hollow chestnut tree, with Redtail the Hawk waiting outside for the weasel to come out. Then Chatterer described how he had pulled old Redtail's tail. At that part, Sammy's eyes began to sparkle.

        - id: ch01-b13
          speaker: chatterer
          text: >-
            And Redtail still doesn't know I did it. He thinks Shadow pulled his tail.

        - id: ch01-b14
          speaker: narrator
          text: >-
            A small, weak grin crossed Chatterer's face.

        - id: ch01-b15
          speaker: sammy_jay
          emotion: happy
          text: >-
            Ho, ho, ho! Ha, ha, ha! I wish I'd been there to see that!

        - id: ch01-b16
          speaker: narrator
          text: >-
            Then Sammy suddenly became serious.

        - id: ch01-b17
          speaker: sammy_jay
          text: >-
            Everyone really should hear that Shadow is back, so they can watch out for him. If anyone gets caught after that, it will be their own fault. I'll go spread the news.

        - id: ch01-b18
          speaker: narrator
          text: >-
            Sammy Jay had plenty of mean ways, but there was good in him too, just as there is in everyone. Besides, he dearly loved carrying important news.

        - id: ch01-b19
          speaker: chatterer
          text: >-
            I... I wish you'd tell my cousin Happy Jack the Gray Squirrel first.

        - id: ch01-b20
          speaker: narrator
          text: >-
            Chatterer spoke hesitantly. Sammy leaned down and gave him a sharp look.

        - id: ch01-b21
          speaker: sammy_jay
          text: >-
            I thought you and Happy Jack weren't friends. You two always seem to be quarreling.

        - id: ch01-b22
          speaker: narrator
          text: >-
            Chatterer looked a little confused. But he was quick with his tongue, and his answer came at once.

        - id: ch01-b23
          speaker: chatterer
          text: >-
            That's exactly why! If anything happened to Happy Jack, I wouldn't have anyone to quarrel with. It's such fun to make him mad!

        - id: ch01-b24
          speaker: narrator
          text: >-
            Of course, that was not the real reason. Deep down, Chatterer felt ashamed. While fleeing from Shadow, he had thought of leading the weasel to Happy Jack's house so that he himself could escape. It had been a dreadful, cowardly thought. Chatterer was truly ashamed that such a thought had ever entered his mind. Now he hoped that doing something for Happy Jack would make him feel better about it.

        - id: ch01-b25
          speaker: narrator
          text: >-
            Sammy promised to fly straight to Happy Jack and warn him that Shadow was back in the Green Forest. Then he took off, screaming the news as he flew so that all the little forest people would hear it. Chatterer listened for a few minutes before setting off again.

        - id: ch01-b26
          speaker: chatterer
          emotion: fearful
          text: >-
            Where can I go? Where can I go? I don't dare stay in the Green Forest. Now Shadow won't rest until he catches me.
