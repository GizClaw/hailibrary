audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
  chapters:
    - id: ch01
      title: 第一章　红松鼠喋喋逃命
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 红松鼠喋喋刚才还嫌日子太安静，没什么热闹。他为了找点刺激，故意吵醒了博比浣熊，把博比气得扬言要活吞了他。喋喋呢，绕着博比又蹦又跳，给他起难听的外号，还不停地取笑他，觉得好玩极了。反正他一直知道，就算博比真来抓，也抓不到自己。可现在不一样了。喋喋想要多少刺激，如今全有了，甚至多得叫他受不了。因为这一回，他真的在逃命，他自己也知道。
        - id: ch01-b02
          speaker: narrator
          text: 为了活命拼命逃跑，实在可怕，真是可怕极了。彼得兔最懂这种滋味。他常常被追，有时追他的是红狐雷迪，有时是猎犬鲍泽，还有一两次是老郊狼。每到这时候，彼得都知道，自己的命全靠那双长腿了，心里也不止一次被深深的恐惧占满。不过，他还知道，只要能抢先跑到老石墙，或者钻进他最爱的老荆棘丛，他就安全了。而他每一次都成功赶到。所以彼得带着那份恐惧奔跑时，心里也始终还有希望。
        - id: ch01-b03
          speaker: narrator
          text: 喋喋却一点希望也没有。是的，他心里只剩下可怕的恐惧，因为他根本不知道还能逃到哪里。平常躲进空心树，或者老石墙的洞里，谁也伤不到他，就连布朗老农的儿子也拿他没办法。可这次，那些地方都不安全。追他的家伙眼睛气得发红，里面还透着饥饿。喋喋能去的地方，他全都能去。只要洞口够大，喋喋挤得进去，他也能跟进去。哪怕有些窄缝喋喋自己都过不去，他照样能来去自如。这个可怕的追赶者，就是身子细长的黄鼠狼影子。
        - id: ch01-b04
          speaker: narrator
          text: 喋喋很清楚这一点。既然逃去平常那些安全的藏身处也没有用，他只好反过来，朝另一个方向跑。他不知道前面通向哪里，脑子里只有一个念头，就是不停地跑，能跑多久就跑多久。真到了跑不动的时候，他就拼命反抗。虽然他心里明白，那恐怕也没有用。
        - id: ch01-b05
          speaker: narrator
          text: 他冲上树枝，又纵身跳向旁边那棵树，嘴里忍不住呜咽起来。
        - id: ch01-b06
          speaker: chatterer
          text: “哎呀，哎呀！我当初就该管好自己的事，也该闭紧嘴巴！要不是影子听见我的声音，他怎么会知道我在哪儿？哎呀呀，我该怎么办？到底该怎么办？”
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: 喋喋吓得一路猛跑猛跳，渐渐累坏了。很快，他遇上了一大片空当，必须跳得非常远，才能够到下一棵树。这样的距离，他以前常常一跃而过，根本不会放在心上。可现在力气快用完了，那段空当看起来足足远了一倍。他不敢停下来爬下树，再从地面跑过去，只能深吸一口气，沿着树枝飞奔几步，然后用力一跃。
        - id: ch01-b08
          speaker: narrator
          text: 他的两只前爪刚好碰到对面最近的枝梢。他使出全身力气想抓住，却还是没能抓牢。于是，喋喋向下坠去，越坠越低，一直落向地面。他尽量把身子摊平，这多少救了他一点，可这一跤还是摔得厉害。他落地以后，有那么一会儿，觉得身体里的气全没了。幸好，还没有真的断气。又过了一会儿，他便手脚并用地爬上了树。
