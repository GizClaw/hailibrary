audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
  chapters:
    - id: ch01
      title: Chatterer the Red Squirrel Runs for His Life
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Chatterer the Red Squirrel had complained that nothing exciting ever happened. Then he had stirred up some excitement himself. He woke Bobby Coon and made him so furious that Bobby threatened to eat him alive. Chatterer danced around, called him names, and laughed at him. That had seemed like wonderful fun. Chatterer knew Bobby could never catch him, no matter how hard he tried.

        - id: ch01-b02
          speaker: narrator
          text: >-
            But things were very different now. Chatterer had found all the excitement he could stand, and much more besides. He was running for his life. He knew it, too.

        - id: ch01-b03
          speaker: narrator
          text: >-
            Having to run for your life is a terrible thing. Peter Rabbit knows that very well. He has often raced away with Reddy Fox behind him. Other times it was Bowser the Hound, or even Old Man Coyote. Peter knew everything depended on his long legs, and more than once his heart filled with fear. Still, he always had hope. If he reached the old stone wall first, or made it to his dear Old Briar-patch, he would be safe. And he had always reached one of them in time.

        - id: ch01-b04
          speaker: narrator
          text: >-
            Chatterer had no such hope. His heart held nothing but terrible fear, because he had nowhere safe to go. A hollow tree would not help him now. Neither would the holes in the old stone wall, though they could protect him from almost anyone else, even Farmer Brown's boy. The creature following Chatterer could go wherever he went. Hunger shone in his anger-red eyes, and any hole Chatterer could squeeze into was open to him as well.

        - id: ch01-b05
          speaker: narrator
          text: >-
            That creature was Shadow the Weasel. Shadow was so slim that he could slip through places too narrow even for Chatterer.

        - id: ch01-b06
          speaker: narrator
          text: >-
            Chatterer understood all of this. Since his usual hiding places were useless, he ran the other way. He had no idea where he was going. Only one thought remained. He would keep running for as long as his strength held out. After that, he would try to fight, even though he knew he had no chance.

        - id: ch01-b07
          speaker: narrator
          text: >-
            Chatterer sobbed as he raced out along a branch and sprang across to the next tree.

        - id: ch01-b08
          speaker: chatterer
          emotion: fearful
          text: >-
            Oh, dear! Oh, dear! Why didn't I mind my own business? Why couldn't I keep quiet? Shadow would never have found me if he hadn't heard my voice. Oh, dear me! What am I going to do? What can I do?

        - id: ch01-b09
          speaker: narrator
          text: >-
            He had run and jumped so hard in his fright that he was growing terribly tired. Before long, he came to a gap that called for a very long leap. He had crossed gaps just as wide many times without a second thought. Now exhaustion made this one look twice its real size.

        - id: ch01-b10
          speaker: narrator
          text: >-
            He did not dare pause, climb down the trunk, and scamper over the ground. So he drew one deep breath. Then he dashed along the branch and jumped.

        - id: ch01-b11
          speaker: narrator
          text: >-
            His hands barely reached the tip of the nearest branch. He held on with all his strength, but it was no use. Down he went, falling through the air. He stretched his body as flat as he could, and that slowed him a little. Even so, he struck the ground hard. For a moment, it felt as though every bit of breath had been knocked out of him.

        - id: ch01-b12
          speaker: narrator
          text: >-
            But Chatterer still had a little breath left. A moment later, he was scrambling up the tree again.
