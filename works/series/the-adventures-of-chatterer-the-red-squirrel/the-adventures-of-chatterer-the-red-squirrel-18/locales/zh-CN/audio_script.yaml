audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    sammy_jay:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 尖刻活泼，谈起消息时格外来劲
        timbre: 清脆响亮
        pace: 明快
        pitch: 偏高
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 随和热心，思考时稍稍放慢
        timbre: 清爽柔和
        pace: 中等
        pitch: 中高音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 狡猾油滑，取笑别人时故意拖长语调
        timbre: 圆润而略带尖细
        pace: 中等
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十八章　喋喋成了笑柄
      blocks:
        - id: ch01-b01
          speaker: sammy_jay
          text: “哈，哈，哈！嚯，嚯，嚯！你这个聪明鬼，总算让人逮住啦！”
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: 萨米站在苹果树顶上，低头瞧着笼里的喋喋，乐得尖声大叫。这个笼子，正是农夫布朗的男孩给喋喋做的。
        - id: ch01-b03
          speaker: narrator
          text: 看到喋喋还活着，萨米心里总算松了口气。可他一想到，那个总觉得自己聪明极了的喋喋，居然也会被捉住，就忍不住要逗弄他。萨米又笑又说刻薄话，直到喋喋发起脾气，像从前那样狠狠回嘴。
        - id: ch01-b04
          speaker: narrator
          text: 这下，萨米更开心了。这口气听起来，和那个在绿森林里自由淘气的小坏蛋一模一样。他这才放心，喋喋好得很，什么毛病也没有。
        - id: ch01-b05
          speaker: narrator
          text: 不过，萨米没法留下来嘲笑可怜的喋喋太久。农夫布朗的男孩已经从谷仓门里探出头，想看看外面怎么这样吵。
        - id: ch01-b06
          speaker: narrator
          text: 再说，萨米浑身都憋得难受，急着把这个消息传遍绿森林和绿草地。谁叫他最爱四处传闲话呢？更何况，这回的消息实在少见。
        - id: ch01-b07
          speaker: narrator
          text: 萨米早就知道，大家一定不会相信。那个聪明的喋喋先生真的被人抓住了？谁能信呢？果然，谁也不信。
        - id: ch01-b08
          speaker: sammy_jay
          text: “好吧，你们爱信不信，我才不在乎。自己到农夫布朗家去看看吧。喋喋就关在那里，我可是亲眼见过的。”
        - id: ch01-b09
          speaker: narrator
          text: 那天下午晚些时候，农家庭院四周安静下来。喋喋忽然发现，老果园边上的旧石墙后面，有个熟悉的东西冒了一下，又缩了回去。过了一会儿，它又冒出来，转眼再次不见了。
        - id: ch01-b10
          speaker: chatterer
          text: “看样子，躲在那里的准是兔子彼得。他这会儿一定紧张得很。”
        - id: ch01-b11
          speaker: narrator
          text: 喋喋说完，像从前在绿森林里自由生活时那样，尖声叫了一下。彼得的脑袋立刻弹出墙头，活像玩具匣里蹦出的小人。这一回，他没有缩下去。
        - id: ch01-b12
          speaker: narrator
          text: 彼得望着远处囚禁喋喋的笼子，惊讶得两只眼睛瞪得溜圆。
        - id: ch01-b13
          speaker: peter_rabbit
          text: “啊，竟然是真的！”
          emotion: surprised
        - id: ch01-b14
          speaker: narrator
          text: 要彼得相信自己的眼睛，似乎跟要他相信萨米说的话一样难。
        - id: ch01-b15
          speaker: peter_rabbit
          text: “我得马上回去想办法，看看怎样才能救喋喋出来。”
        - id: ch01-b16
          speaker: narrator
          text: 外面还是大白天，彼得实在不敢再停留。他向喋喋挥挥手，拔腿就跑。两条长腿跑得飞快，直奔绿森林去了。
        - id: ch01-b17
          speaker: narrator
          text: 没过多久，石墙后面又探出一张脸。来的竟是狐狸雷迪。看起来，他的胆子可真不小，其实根本不是那么回事。
        - id: ch01-b18
          speaker: narrator
          text: 雷迪知道，农夫布朗的男孩和猎犬鲍泽都去了老牧场，自己没什么可怕的。他冲喋喋咧嘴坏笑，那样子实在气人。喋喋只看一眼，就火冒三丈。
        - id: ch01-b19
          speaker: reddy_fox
          text: “聪明，聪明，聪明的先生，看你气色不错，我真喜欢！你瞧今天天气多么晴朗，要不要跟我一同去逛逛？”
        - id: ch01-b20
          speaker: narrator
          text: 雷迪明明知道，喋喋根本不能跟任何人去散步，还偏要这么说。起初，喋喋气得破口大骂，把能想出来的难听话全都送给了雷迪。
        - id: ch01-b21
          speaker: narrator
          text: 可过了一会儿，他忽然不怎么想骂了。雷迪那些刻薄话，他其实连一半都没听进去。
        - id: ch01-b22
          speaker: narrator
          text: 因为喋喋越来越明白，不管什么都代替不了自由。他有舒服的住处，有吃不完的食物，也不会受到伤害。可是，他仍旧是个囚犯。
        - id: ch01-b23
          speaker: narrator
          text: 这些访客一来，这件事就变得比从前更清楚了。泪水渐渐涌上喋喋的眼眶。他爬进那截空心树桩，再也看不见外面，外面也看不见他了。
