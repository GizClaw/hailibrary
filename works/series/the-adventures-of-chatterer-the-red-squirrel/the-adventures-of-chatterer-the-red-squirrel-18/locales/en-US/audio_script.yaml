  chapters:
    - id: ch01
      title: Chatterer Is Made Fun Of
      blocks:
        - id: ch01-b01
          speaker: sammy_jay
          text: >-
            Ha, ha, ha! Ho, ho, ho! So Mr. Smarty has been caught at last!
          emotion: happy

        - id: ch01-b02
          speaker: narrator
          text: >-
            Sammy Jay shrieked with delight as he looked down from the top of an apple tree. Below him sat Chatterer, inside the cage Farmer Brown's boy had made. Sammy was relieved to know that Chatterer was alive. But the sight of clever Chatterer caught in a cage tickled him so much that he had to laugh and say mean things.

        - id: ch01-b03
          speaker: narrator
          text: >-
            Sammy kept tormenting him until Chatterer lost his temper and snapped back in his old familiar way. That pleased Sammy even more. Chatterer sounded exactly as he had when he was a free little mischief-maker in the Green Forest. Now Sammy felt certain there was nothing wrong with him.

        - id: ch01-b04
          speaker: narrator
          text: >-
            Still, Sammy could not stay long. Farmer Brown's boy had poked his head out of the barn door to find out what all the noise was about. Besides, Sammy could hardly wait to spread the news through the Green Forest and across the Green Meadows. He was a great gossip, and this news was far too unusual to keep to himself.

        - id: ch01-b05
          speaker: narrator
          text: >-
            Sammy knew nobody would believe that clever Mr. Chatterer had truly been caught. He was right. Nobody believed him.

        - id: ch01-b06
          speaker: sammy_jay
          text: >-
            Fine. I don't care whether you believe me or not. Go up to Farmer Brown's house and see Chatterer locked in the cage, just as I did.

        - id: ch01-b07
          speaker: narrator
          text: >-
            Late that afternoon, the farmyard grew quiet. Chatterer noticed something familiar behind the old stone wall at the edge of the Old Orchard. It popped up, then dropped out of sight. A moment later it appeared again, only to vanish just as quickly.

        - id: ch01-b08
          speaker: chatterer
          text: >-
            That looks very much like Peter Rabbit over there. And he looks very nervous.

        - id: ch01-b09
          speaker: narrator
          text: >-
            Chatterer gave the same sharp call he used to make when he was free in the Green Forest. At once, Peter's head sprang up like a jack-in-the-box. This time it stayed there. His eyes grew round as he stared across the farmyard at Chatterer's prison.

        - id: ch01-b10
          speaker: peter_rabbit
          text: >-
            Oh! Then it really is true! I must hurry away and find out what we can do to get Chatterer out of this trouble.
          emotion: surprised

        - id: ch01-b11
          speaker: narrator
          text: >-
            Peter could hardly believe his own eyes, just as he had hardly believed Sammy Jay. But it was broad daylight, and he did not dare remain there another minute. He waved goodbye to Chatterer, then raced toward the Green Forest as fast as his long legs could carry him.

        - id: ch01-b12
          speaker: narrator
          text: >-
            A little later, Reddy Fox appeared, peeking over the stone wall. He seemed very bold, but he was not being as daring as he looked. Reddy knew that Farmer Brown's boy and Bowser the Hound were both over in the Old Pasture. There was nothing nearby for him to fear.

        - id: ch01-b13
          speaker: narrator
          text: >-
            Reddy gave Chatterer the most provoking grin he could manage. The mere sight of it made Chatterer angry.

        - id: ch01-b14
          speaker: reddy_fox
          text: >-
            Smarty, Smarty, Mr. Smarty, glad to see you looking hearty! The weather's fine, as you can see. Won't you take a walk with me?

        - id: ch01-b15
          speaker: narrator
          text: >-
            Reddy knew perfectly well that Chatterer could not go walking with anyone. At first, Chatterer scolded him and called him every bad name he could think of. After a while, though, he no longer felt much like scolding. He barely listened to the cruel things Reddy went on saying.

        - id: ch01-b16
          speaker: narrator
          text: >-
            More and more, Chatterer understood that nothing could take the place of freedom. His home was comfortable. He had plenty to eat, and no harm could reach him there. But he was still a prisoner. Seeing these visitors made him feel that more deeply than ever.

        - id: ch01-b17
          speaker: narrator
          text: >-
            Something very much like tears filled his eyes. Chatterer crept into his hollow stump, where he could neither see nor be seen.
