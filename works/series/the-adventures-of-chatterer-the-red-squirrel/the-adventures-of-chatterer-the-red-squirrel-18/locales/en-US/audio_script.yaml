    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: loud and gleefully teasing with a love of gossip
        timbre: sharp and bright
        pace: quick
        pitch: high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: earnest and alert with quick nervous turns
        timbre: light and clear
        pace: quick
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: smooth and provoking with playful mockery
