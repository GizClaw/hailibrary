audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    chatterers_stomach:
      display_name: 喋喋的肚子
      tts:
        delivery: 小声催促，直白而执拗
        timbre: 低沉浑圆
        pace: 稍慢
        pitch: 偏低
  chapters:
    - id: ch01
      title: 第十四章　喋喋决定活下去
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 起先，喋喋觉得，就算监牢再舒服，自己也宁可死在里面，绝不肯住下去。这个主意傻得很，可他已经拿定了主意，一口东西也不吃。农夫布朗的男孩放进来的黄玉米那么饱满，他偏偏碰都不碰。他要让自己活活饿死。没错，就是活活饿死。
        - id: ch01-b02
          speaker: narrator
          text: 眼看哪里都逃不出去，喋喋钻进那截小木桩的树洞，蜷在谁也瞧不见的地方。他打算一直躲到死。要是往后的日子全得关在监牢里，那还活着干什么？他连舒服一点儿都不肯。旁边有刨花和碎布，明明能铺出一张暖和的床，他却动也不动，存心让自己难受。
        - id: ch01-b03
          speaker: narrator
          text: 这一天长得像是没有尽头。喋喋始终躲着，连鼻子尖也没从圆圆的小门里露出来。农夫布朗的男孩来看过好多次，对着他吹口哨，又轻声叫他，可里面一点儿动静也没有。
        - id: ch01-b04
          speaker: narrator
          text: 夜里终于来了。柴房一点点暗下去，四周也静了下来。偏偏就在这时候，喋喋的肚子闹起了意见。他想装作没感觉，可肚子非要他注意不可。里面空空的，还一个劲儿提醒他呢。
        - id: ch01-b05
          speaker: chatterer
          text: “我要饿死自己。对，我就是要饿死自己。”
        - id: ch01-b06
          speaker: chatterers_stomach
          text: “我这里都空啦，旁边明明有那么多吃的。只要你别再犯傻，就能把我填得饱饱的。”
        - id: ch01-b07
          speaker: narrator
          text: 喋喋越想把吃东西的滋味赶出脑袋，那滋味就越往脑袋里钻。他心里发慌，怎么躺也不安稳，只好扭来扭去，翻来覆去。到最后，他决定再出去找一遍，也许还能找到逃走的路。
        - id: ch01-b08
          speaker: narrator
          text: 他从小圆门里伸出脑袋。外面漆黑一片，静悄悄的。他仔细听了听，一点儿声音也没有，这才轻手轻脚地爬出去，赶忙又把监牢检查了一遍。可还是不行。每个地方都有东西挡着，尖牙根本咬不到一处能开路的地方。
        - id: ch01-b09
          speaker: chatterers_stomach
          text: “你瞧，那边还有一小堆玉米，就等着你去吃呢。”
        - id: ch01-b10
          speaker: chatterer
          text: “我就是死，也绝不碰它！”
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: 话音刚落，他的脚碰到一样东西，那东西骨碌碌滚开了。喋喋拿起来一看，是颗胖鼓鼓的山核桃。他把它放下，又捡起来，再放下。这样反复了两三回。可每一回，他都比上次更舍不得松手。
        - id: ch01-b12
          speaker: chatterer
          text: “我……我就在饿死以前，再尝最后一颗核桃吧。”
        - id: ch01-b13
          speaker: narrator
          text: 喋喋嘴里还在咕哝，不知不觉已经啃起了坚硬的核桃壳。一颗吃完，他找到了第二颗。第二颗没了，又找到第三颗。接着，他实在忍不住，还尝了一粒玉米。
        - id: ch01-b14
          speaker: narrator
          text: 等喋喋明白过来，核桃和玉米竟然全没了，他的肚子倒变得饱饱的。说来也怪，他一下子舒服了许多，这会儿可不想再饿死自己了。
        - id: ch01-b15
          speaker: chatterer
          text: “我……我看，还是先等等，瞧瞧以后会怎么样。既然要等，我也该让自己舒服一点儿。”
        - id: ch01-b16
          speaker: narrator
          text: 于是，喋喋把刨花和碎布一样样搬进树洞。没过多久，他就铺好了一张舒服极了的床，和从前睡过的任何一张相比都不差。喋喋已经决定，要活下去了。
