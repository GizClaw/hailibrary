audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
    stomach:
      display_name: Chatterer's Stomach
      tts:
        delivery: persistent and matter-of-fact with a gently teasing edge
        timbre: soft and hollow
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Chatterer Decides to Live
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            At first, Chatterer decided he would rather die than live in a prison, however nice it might be. It was a very foolish decision, but his mind was made up. He would not eat the yellow corn Farmer Brown's boy had left for him. He meant to starve himself to death. Yes, sir, that was exactly what he meant to do.

        - id: ch01-b02
          speaker: narrator
          text: >-
            Once he knew there was no way out, Chatterer curled up inside the little hollow stump where no one could see him. He planned to stay there until he died. If he had to spend the rest of his days in prison, he thought life was not worth living. He would not even make himself comfortable. A fine little heap of shavings and scraps of cloth was waiting for him, but he left it alone. No, sir. Chatterer was trying his very best to be miserable.

        - id: ch01-b03
          speaker: narrator
          text: >-
            All through that long day, not even the tip of his nose appeared at the little round doorway. Farmer Brown's boy came back again and again. He whistled and called softly, but Chatterer made no sound. At last night fell. The woodshed grew darker and darker, and everything became very still.

        - id: ch01-b04
          speaker: narrator
          text: >-
            About then, Chatterer began to notice his stomach. He tried to ignore it, but his stomach would not be ignored. It was empty, and it kept reminding him.

        - id: ch01-b05
          speaker: chatterer
          text: >-
            I'm going to starve to death.

        - id: ch01-b06
          speaker: stomach
          text: >-
            I'm empty, and there's plenty of food right here. I could be full if you'd only stop being so foolish.

        - id: ch01-b07
          speaker: narrator
          text: >-
            Chatterer tried not to imagine how good a bite of food would taste. The harder he tried, the more he thought about it. Food sounded better with every passing moment. Soon he was restless and uneasy, twisting and squirming and turning this way and that. At last he decided to search once more for a way out.

        - id: ch01-b08
          speaker: narrator
          text: >-
            He poked his head through the round doorway. Everything was dark and still. He listened. There was not a sound. Then he crept out quietly and hurried around the inside of the prison, examining every part again. It was no use. He could not find a single place where his sharp teeth would help him escape.

        - id: ch01-b09
          speaker: stomach
          text: >-
            That little pile of corn is still waiting for me.

        - id: ch01-b10
          speaker: chatterer
          text: >-
            I'll never touch it!
          emotion: angry

        - id: ch01-b11
          speaker: narrator
          text: >-
            Just then, his foot struck something and sent it rolling. Chatterer picked it up, then set it down. It was a plump hickory nut. He lifted it and put it back two or three times. Each time, letting go became a little harder.

        - id: ch01-b12
          speaker: chatterer
          text: >-
            I... I think I'd like one last taste of a nut before I starve to death.

        - id: ch01-b13
          speaker: narrator
          text: >-
            Almost before he knew what he was doing, Chatterer began gnawing through the hard shell. When that nut was gone, he found another, and then another. After those, he simply had to try one grain of corn. Before he realized it, every nut and every grain of corn had disappeared. His stomach was full, and somehow he felt much better. Starving to death no longer seemed like such a good idea.

        - id: ch01-b14
          speaker: chatterer
          text: >-
            I... I believe I'll wait awhile and see what happens. And while I'm waiting, I might as well be comfortable.

        - id: ch01-b15
          speaker: narrator
          text: >-
            So Chatterer carried the shavings and scraps of cloth into the hollow stump. Before long, he had made a bed as comfortable as any he had ever slept on.

        - id: ch01-b16
          speaker: narrator
          text: >-
            Chatterer had decided to live.
