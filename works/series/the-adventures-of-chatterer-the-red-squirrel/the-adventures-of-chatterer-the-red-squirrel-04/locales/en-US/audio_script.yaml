audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: friendly and practical with an easygoing confidence
        timbre: youthful and clear
        pace: medium
        pitch: medium-high
  chapters:
    - id: ch01
      title: Chatterer Leaves the Green Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Chatterer was in a peck of trouble. Yes, sir, there was no doubt about that. He hurried through the Green Forest, saying the same thing to himself again and again.

        - id: ch01-b02
          speaker: chatterer
          emotion: fearful
          text: >-
            Oh, dear! Oh, dear! If only I'd kept my tongue still! If only I'd kept my tongue still!

        - id: ch01-b03
          speaker: narrator
          text: >-
            Chatterer was finally learning how much trouble an unruly tongue could cause. Winter was almost here, and he no longer dared to stay in the forest that had always been his home. His storehouses were packed with nuts, seeds, and corn. There was more than enough to keep him comfortable all winter. Now he had to leave it behind and go somewhere he didn't even know, all because of his mean temper and sharp tongue.

        - id: ch01-b04
          speaker: narrator
          text: >-
            If he had not shouted names at Bobby Coon that morning, Shadow the Weasel might never have found him. But Shadow had a long memory. He would not forget the trick Chatterer had used to escape. Chatterer knew he could have no peace until he left the Green Forest, and stayed away for as long as Shadow remained there.

        - id: ch01-b05
          speaker: narrator
          text: >-
            Inside his warm red coat, Chatterer shivered. A long, cold winter lay ahead, and finding enough food would be hard. Had anyone ever been in such a dreadful fix?

        - id: ch01-b06
          speaker: narrator
          text: >-
            At last he reached the edge of the Green Forest. He climbed to the top of a tree and sat down to rest. From there he could look across the Green Meadows. Far away stood the Purple Hills, where jolly, round, red Mr. Sun went to bed each night. Chatterer could see the old stone wall between the meadows and Farmer Brown's cornfield. Beyond it were Farmer Brown's house and barn, and close by was the Old Orchard. Johnny Chuck had spent the summer there with Polly Chuck and their baby Chucks.

        - id: ch01-b07
          speaker: narrator
          text: >-
            Chatterer knew every corner of that old stone wall, and he had visited the Old Orchard many times. That was where he had stolen Drummer the Woodpecker's eggs. He grinned when he remembered getting them. Then he shivered at the rest of the memory. Drummer and Mrs. Drummer had caught him in the end, and their bills were very sharp.

        - id: ch01-b08
          speaker: narrator
          text: >-
            Still, that was over now. Thinking about it would not solve his present trouble. He needed to do something at once. Maybe he could live in the old stone wall. There might even be enough loose corn scattered across the field for him to store away, if he worked very hard and very fast. It was worth a look.

        - id: ch01-b09
          speaker: narrator
          text: >-
            Down the tree he hurried, and out along the old wall. He peered into every opening and leaped from stone to stone. Before long, he began to feel hopeful. It really did seem as if a snug home might be waiting for him somewhere among those stones.

        - id: ch01-b10
          speaker: narrator
          text: >-
            Then he remembered something, and his heart sank again. More than once, he had seen Shadow the Weasel exploring this very wall. Shadow might easily come back, especially with the wall so close to the Green Forest. No, Chatterer could not stay there.

        - id: ch01-b11
          speaker: narrator
          text: >-
            Just then, Peter Rabbit came along. One look told Peter that something was wrong, so he asked Chatterer what had happened. Chatterer told him the whole story. He felt he simply had to tell someone.

        - id: ch01-b12
          speaker: narrator
          text: >-
            Peter stopped to think. With his long right hind foot, he scratched his long left ear.

        - id: ch01-b13
          speaker: peter_rabbit
          text: >-
            There's another old stone wall beside the Old Orchard, you know. It's quite close to Farmer Brown's house, and Black Pussy hunts there often. But you ought to be quick enough to stay out of her claws.

        - id: ch01-b14
          speaker: narrator
          text: >-
            Chatterer answered with a scornful little burst.

        - id: ch01-b15
          speaker: chatterer
          text: >-
            I should certainly hope so! I've never met a cat I was afraid of. I think I'll go take a look at that wall, Peter Rabbit.

        - id: ch01-b16
          speaker: peter_rabbit
          text: >-
            Then I'll come with you.

        - id: ch01-b17
          speaker: narrator
          text: >-
            And off they went together.
