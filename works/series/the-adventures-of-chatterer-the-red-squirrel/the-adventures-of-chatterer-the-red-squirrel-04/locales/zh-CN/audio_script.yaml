audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 随和热心，思考时稍稍放慢
        timbre: 清爽柔和
        pace: 中等
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第四章　喋喋离开绿森林
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 喋喋这回惹上的麻烦可大了。是的，先生，麻烦大得不得了，准没错。他匆匆穿过绿森林，一路反复责怪自己，终于明白，不听管束的舌头真会给主人闯下大祸。冬天就要来了，他却不敢再住在自己一直生活的绿森林里。储藏室里的坚果、种子和玉米，本来足够让他舒舒服服地过冬，如今却只能转身离开，把它们全丢在身后。接下来要去哪里，他连一点儿主意也没有。说到底，这全怪他的坏脾气和那张刻薄的嘴。
        - id: ch01-b02
          speaker: chatterer
          text: “哎呀！我要是管住了自己的舌头该多好！我要是早早闭上嘴，该多好啊！”
          emotion: fearful
        - id: ch01-b03
          speaker: narrator
          text: 那天早晨，喋喋要是没有扯开嗓子骂博比浣熊，黄鼠狼影子也许就找不到他了。可影子的记性好得很，一定不会忘记喋喋使了什么花招才逃掉。只要影子还留在绿森林里，喋喋就别想安生。想起漫长寒冷的冬天，再想想以后找食物会有多难，他躲在温暖的红皮袄里，还是忍不住发抖。还有谁遇到过这么糟糕的处境呢？
        - id: ch01-b04
          speaker: narrator
          text: 走着走着，喋喋来到绿森林边上。他爬到一棵树顶歇脚，眼前就是辽阔的绿草地。远处的紫山依稀可见，快活、滚圆、红彤彤的太阳公公每天晚上都到那后面睡觉。他也看见了老石墙。墙的一边是绿草地，另一边是布朗老农的玉米地。再远一些，是布朗老农的屋子和谷仓，附近还有老果园。土拨鼠约翰尼和波莉带着小土拨鼠们，在那里住了一整个夏天。
        - id: ch01-b05
          speaker: narrator
          text: 老石墙的每个角落、每道缝隙，喋喋都熟悉得很，老果园也去过好多次。他还在那里偷过啄木鸟鼓手的蛋呢。一想起自己是怎么把蛋弄到手的，他便咧开嘴笑了。可他马上又想起，自己后来还是被抓住了，鼓手和鼓手太太的尖嘴啄起来有多厉害。他不由得又打了个冷战。
        - id: ch01-b06
          speaker: narrator
          text: 不过，过去的事再想也没用。眼下，他得赶快找到住处。老石墙里也许有合适的洞，玉米地上也许还散着一些玉米粒。只要手脚快，又肯卖力气，说不定就能攒够过冬的粮食。无论如何，先去看看吧。
        - id: ch01-b07
          speaker: narrator
          text: 喋喋赶紧下了树，沿着老石墙一路寻找。他探头看过每一个洞，又从一块石头跳到另一块石头，心里渐渐有了盼头。这里好像真能找到一个暖和又安稳的家。可他忽然记起来，自己曾不止一次看见黄鼠狼影子在这堵墙里搜寻。石墙离绿森林太近，影子很可能再来。喋喋的心一下又沉了下去。这里不行。
        - id: ch01-b08
          speaker: narrator
          text: 正在这时，彼得兔来了。他一眼就看出喋喋有心事，马上追问究竟出了什么事。喋喋实在憋不住了，把经过全告诉了他。彼得认真想了一会儿，还用长长的右后腿，挠了挠长长的左耳朵。
        - id: ch01-b09
          speaker: peter_rabbit
          text: “老果园那边不是还有一堵老石墙吗？那堵墙离布朗老农的屋子很近，黑猫常去那里捕猎。不过，你这么机灵，应该不会落进她的爪子。”
        - id: ch01-b10
          speaker: narrator
          text: 喋喋听了，很不以为然。
        - id: ch01-b11
          speaker: chatterer
          text: “我当然躲得开！我可从没见过哪只猫能把我吓住。彼得兔，我现在就去瞧瞧那堵老墙。”
        - id: ch01-b12
          speaker: peter_rabbit
          text: “我陪你去。”
        - id: ch01-b13
          speaker: narrator
          text: 于是，喋喋和彼得兔一起出发了。
