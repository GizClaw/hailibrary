audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
  chapters:
    - id: ch01
      title: 第二十章　喋喋又大吃一惊
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 自从掉进农夫布朗玉米仓里的陷阱，喋喋碰上的意外，比他一辈子遇到的还多。奇怪的是，这些意外竟然都是好事。
        - id: ch01-b02
          speaker: narrator
          text: 他原以为自己一定会被交给黑猫，结果并没有。后来他又发现，农夫布朗的男孩比自己想的好得多，这更叫他吃惊。
        - id: ch01-b03
          speaker: narrator
          text: 再后来，笼子里多了一只铁丝转轮。喋喋想跑多久，就能跑多久。这个又突然又称心的惊喜，让他彻底改变了对男孩的看法。
        - id: ch01-b04
          speaker: narrator
          text: 可是有一件事始终压在他心里。喋喋是个囚徒。真的，先生，他是个囚徒。只要醒着，他就一刻也忘不了。
        - id: ch01-b05
          speaker: narrator
          text: 他常常望着农夫布朗的男孩，拼命想告诉对方，关在牢笼里有多可怕。任凭他怎么说，男孩还是听不懂，甚至以为他过得很开心。
        - id: ch01-b06
          speaker: narrator
          text: 男孩不明白，就算把世上所有好东西都送来，也补偿不了失去的自由。喋喋宁可自由自在地挨饿受冻，也不愿舒舒服服地坐牢。
        - id: ch01-b07
          speaker: narrator
          text: 起初，喋喋还挺能忍，也尽量让日子好过一些。可冠蓝鸦萨米发现了他，狐狸雷迪嘲笑了他，彼得兔又从老石墙后面偷偷来看他。
        - id: ch01-b08
          speaker: narrator
          text: 伙伴们想去哪里就去哪里，想什么时候走就什么时候走。喋喋看在眼里，再也忍不住了。他满心惦记着绿森林和老果园，别的什么都想不了。
        - id: ch01-b09
          speaker: narrator
          text: 他缩在笼子一角，心里有多难过，看起来就有多可怜。他连胃口都没了。男孩送来最肥的坚果，还有各样好吃的东西，他一口也吃不下。
        - id: ch01-b10
          speaker: narrator
          text: 喋喋对自由的渴望越涨越满，胸口都快撑破了。起初那么喜欢的铁丝转轮，他也不想再跑。他太想家了，想得难受极了，可一点办法也没有。
        - id: ch01-b11
          speaker: narrator
          text: 农夫布朗的男孩发现了这些变化，神情也严肃起来。他会趁喋喋没有察觉，站在一旁静静观察。
        - id: ch01-b12
          speaker: narrator
          text: 男孩虽然听不懂喋喋的话，却看得懂他的举动。他知道喋喋不快乐，也猜到了这是为什么。
        - id: ch01-b13
          speaker: narrator
          text: 一天早晨，笼子照例放到了农舍门外的搁板上。喋喋却没有像平常那样走出空心树桩。他实在没心情，只蜷在窝里，难过得一动也不想动。
        - id: ch01-b14
          speaker: narrator
          text: 过了好久，喋喋才慢慢爬起来，从圆圆的小门口往外一瞧。他轻轻抽了口气，又揉了揉眼睛。难道自己在做梦？
        - id: ch01-b15
          speaker: narrator
          text: 他急忙蹿出去，隔着笼子的铁丝往外看。接着，他又揉了一遍眼睛，还冲到笼子另一边，非要再看清楚不可。
        - id: ch01-b16
          speaker: narrator
          text: 笼子根本不在平常那块搁板上。它竟然放在老果园边缘的石墙上，墙顶盖满了白雪。
        - id: ch01-b17
          speaker: narrator
          text: 喋喋兴奋得不知道该做什么才好。他先绕着笼子飞奔，随后跳进铁丝转轮，转了一圈又一圈，快得从来没有过。
        - id: ch01-b18
          speaker: narrator
          text: 直到再也跑不动，他才从转轮里跳出来。就在这时，他忽然发现了一件先前没留意的事。
        - id: ch01-b19
          speaker: narrator
          text: 笼子顶上的小门开着。一定是农夫布朗的男孩放进早餐时，忘了把门关好。
        - id: ch01-b20
          speaker: narrator
          text: 喋喋马上忘了疲倦。他像一道红色的小闪电，蹿出笼子，沿着积雪的石墙飞奔起来，直冲老果园里的家。他一路跑，一路高声叫喊。
        - id: ch01-b21
          speaker: chatterer
          text: “吱咔哩！吱咔哩！吱咔哩！”
          emotion: happy
