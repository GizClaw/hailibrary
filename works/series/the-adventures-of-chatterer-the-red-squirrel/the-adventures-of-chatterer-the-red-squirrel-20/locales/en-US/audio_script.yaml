audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
  chapters:
    - id: ch01
      title: Chatterer Has Another Great Surprise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Chatterer had never known so many good surprises in all his life. They had begun on the day he was caught in a trap in Farmer Brown's corn-crib. He had expected to be given to Black Pussy, but that had not happened. Then he discovered that Farmer Brown's boy was much nicer than he had imagined. Later, the boy put a wire wheel in the cage, and Chatterer could run as much as he pleased. That wonderful surprise changed the way he felt about the boy.

        - id: ch01-b02
          speaker: narrator
          text: >-
            Chatterer might have been truly happy except for one thing. He was still a prisoner. Yes, sir, and during every waking minute, he knew it. He would watch Farmer Brown's boy and try with all his might to explain how dreadful prison felt. But no matter how hard Chatterer tried, the boy could not understand his words. The boy seemed to think Chatterer was happy. He did not know that all the comforts in the world could never replace freedom. Chatterer would rather be free and face hunger and cold than have everything he wanted inside a prison.

        - id: ch01-b03
          speaker: narrator
          text: >-
            For a while, Chatterer had made the best of his situation. Then Sammy Jay found him, Reddy Fox made fun of him, and Peter Rabbit peeked at him from behind the old stone wall. They could go wherever they pleased, whenever they pleased. Watching them was more than Chatterer could bear. He longed so badly for the Green Forest and the Old Orchard that he could think of nothing else.

        - id: ch01-b04
          speaker: narrator
          text: >-
            Chatterer sat in a corner of the cage, looking every bit as miserable as he felt. He lost his appetite. Farmer Brown's boy brought him the fattest nuts and all sorts of treats, but it was no use. He could not eat a bite. Chatterer's heart was so full of longing for freedom that it felt ready to burst. Even the wire wheel that had once delighted him no longer mattered. He was homesick, terribly homesick, and he could not help it.

        - id: ch01-b05
          speaker: narrator
          text: >-
            Farmer Brown's boy noticed the change, and his face became serious and thoughtful. He watched when Chatterer did not know he was nearby. The boy might not understand Chatterer's talk, but he could understand what Chatterer did. He knew the little squirrel was unhappy, and he guessed the reason.

        - id: ch01-b06
          speaker: narrator
          text: >-
            One morning, Chatterer's cage was placed outside the farmhouse door as usual. But he did not come out of his hollow stump the way he usually did. He simply did not feel like it. For a long, long time, he stayed curled up in bed, too sad and miserable to move. At last he crawled to the little round doorway and peeked out.

        - id: ch01-b07
          speaker: narrator
          text: >-
            Chatterer gasped and rubbed his eyes. Could he be dreaming? He scrambled outside, peered through the cage wires, and rubbed his eyes once more. Then he rushed across the cage to look again. The cage was not on its usual shelf beside the farmhouse door. It stood on the snow-covered stone wall at the edge of the Old Orchard!

        - id: ch01-b08
          speaker: narrator
          text: >-
            Chatterer was so excited that he had no idea what to do. First he raced around the cage. Then he leaped into the wire wheel and sent it spinning faster than ever before. He ran until he was too tired to keep going, and then he jumped out.

        - id: ch01-b09
          speaker: narrator
          text: >-
            That was when he noticed something he had missed. The little door in the top of the cage was open! Farmer Brown's boy must have forgotten to shut it after putting in breakfast. Chatterer forgot all about being tired. Like a little red flash, he darted outside and whisked along the snowy stone wall, straight toward his home in the Old Orchard.

        - id: ch01-b10
          speaker: chatterer
          text: >-
            Chickaree! Chickaree! Chickaree!
          emotion: happy
