audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 随和热心，思考时稍稍放慢
        timbre: 清爽柔和
        pace: 中等
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第五章　喋喋找到新家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 计划落空，乱成一团，也别慌。只要拿定主意，总能找到出路。
        - id: ch01-b02
          speaker: narrator
          text: 彼得兔直奔老果园边上的老石墙，一路蹦得飞快，没一会儿就到了。喋喋却不一样。他在地上走的时候，身边要是没有东西可爬，心里就不踏实。所以，他绕了一个大圈，沿着木栅栏赶路。他平时最喜欢在栅栏横木上跑，可这天早晨急得很，只觉得这条路怎么也走不完。当然，他最后还是赶到了。
        - id: ch01-b03
          speaker: narrator
          text: 喋喋跑得气喘吁吁。到了老石墙一看，彼得正坐在土拨鼠约翰尼家的门阶上，朝那条长长的过道里张望。
        - id: ch01-b04
          speaker: peter_rabbit
          text: “他们睡着啦。我跺了又跺，跺了又跺，一点儿用都没有。他们要一直睡到春姑娘来了才肯醒。我怎么也想不通。不，先生，这么棒的冷天气，怎么会有人舍得错过呢？”
        - id: ch01-b05
          speaker: narrator
          text: 彼得困惑地摇摇头，还是盯着空荡荡的过道。他说的是土拨鼠约翰尼和波莉。他们已经开始冬眠了。睡掉整个冬天这件事，彼得一直弄不明白。在他看来，那简直是在白白浪费光阴。
        - id: ch01-b06
          speaker: narrator
          text: 可喋喋满脑子都是自己的难题，顾不上琢磨别人为什么能睡一冬。他自己睡不了，又因为害怕黄鼠狼影子，连绿森林里的家也丢了。眼下，一分钟都不能耽搁。他得先找到新家，再用白天所有的时间重新储存食物，好熬过大雪盖住一切的日子。
        - id: ch01-b07
          speaker: narrator
          text: 喋喋沿着石墙跑过来，又跑过去，四处寻找安家的地方，却没有一处合心意。你知道，他最喜欢住在树上，可不像花栗鼠条纹那样住在地下。可怜的喋喋怎么想，也想不出该怎样在老石墙里生活。
        - id: ch01-b08
          speaker: narrator
          text: 他坐到一块大石头顶上，一边歇气，一边发愁。喋喋泄气透了。这一刻，他甚至觉得活着都没什么意思，一颗心好像沉到了脚趾头。偏偏就在这时，他看见了一样东西。那颗心一下子蹦回胸口，回到了它该在的地方。也就在这时，彼得兔蹦蹦跳跳地过来了。
        - id: ch01-b09
          speaker: peter_rabbit
          text: “怎么样，你找到新家了吗？”
        - id: ch01-b10
          speaker: chatterer
          text: “找到了。我想，我已经找到了。”
        - id: ch01-b11
          speaker: peter_rabbit
          text: “太好了！我就知道你能在这边找到。新家在哪儿？”
        - id: ch01-b12
          speaker: narrator
          text: 喋喋张嘴就要回答，却忽然啪地把嘴闭上了。他及时想起来，彼得最不会保守秘密。要是告诉他，他很可能一不留神又说给别人听。这样传来传去，黄鼠狼影子说不定也会听见。
        - id: ch01-b13
          speaker: chatterer
          text: “彼得兔，我现在还不能告诉你。我还没确定那个地方到底合不合适，所以暂时不想让别人知道。不过，有一件事可以告诉你。”
        - id: ch01-b14
          speaker: narrator
          text: 喋喋瞧见彼得满脸失望，又接着说了下去。
        - id: ch01-b15
          speaker: chatterer
          text: “我就要住在这里了。”
        - id: ch01-b16
          speaker: narrator
          text: 彼得一下子高兴起来。他以为喋喋一定在老石墙里找到了一个洞，还认定只要自己留心观察，早晚能找着。
        - id: ch01-b17
          speaker: peter_rabbit
          text: “这可真好，我以后常来看你。不过要提防黑猫，她的爪子尖得很。现在嘛，我想我该回老荆棘丛了。”
        - id: ch01-b18
          speaker: chatterer
          text: “千万别告诉别人我在哪儿！”
