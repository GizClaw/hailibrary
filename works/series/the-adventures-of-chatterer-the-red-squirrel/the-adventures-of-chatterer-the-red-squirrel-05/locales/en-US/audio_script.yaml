audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
    peter:
      display_name: Peter Rabbit
      tts:
        delivery: friendly and curious with an earnest, impulsive manner
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Chatterer Finds a Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            When all your plans are suddenly scattered, make up your mind to find another way.

        - id: ch01-b02
          speaker: narrator
          text: >-
            Peter Rabbit went straight to the old stone wall at the edge of the Old Orchard. He hurried along, lipperty-lipperty-lip, so fast that the trip took hardly any time at all. Chatterer the Red Squirrel went the long way around by following the rail fence. He never felt truly safe on the ground unless there was something close by for him to climb.

        - id: ch01-b03
          speaker: narrator
          text: >-
            Usually Chatterer loved running along a rail fence. This morning, though, he was in such a hurry that the trip seemed endless. Still, he got there at last.

        - id: ch01-b04
          speaker: narrator
          text: >-
            Peter was sitting on Johnny Chuck's doorstep, peering down Johnny's long hallway. Chatterer came up, completely out of breath.

        - id: ch01-b05
          speaker: peter
          text: >-
            They're asleep. I've thumped and thumped, but nothing wakes them. They'll sleep until Mistress Spring comes. I just don't understand it. No, sir! Why would anyone want to miss this wonderful cold weather?

        - id: ch01-b06
          speaker: narrator
          text: >-
            Peter shook his head and kept staring down the empty hall. He meant Johnny and Polly Chuck, who had gone to sleep for the winter. Sleeping all winter puzzled Peter. To him, it seemed like a terrible waste of time.

        - id: ch01-b07
          speaker: narrator
          text: >-
            Chatterer had too much on his mind to wonder how anyone could sleep the whole winter away. He couldn't do that himself. And fear of Shadow the Weasel had driven him from his own home in the Green Forest. He couldn't waste another minute. First he had to find a new home. Then he would need every minute of daylight to gather a fresh store of food for the days when snow covered everything.

        - id: ch01-b08
          speaker: narrator
          text: >-
            Chatterer scampered up and down the whole length of the stone wall, searching for a place to make his home. Nothing he saw seemed right. A home in a tree was what he liked best. Chatterer wasn't like Striped Chipmunk, who made his home in the ground. Poor Chatterer simply couldn't see how he could live in the old stone wall.

        - id: ch01-b09
          speaker: narrator
          text: >-
            Poor Chatterer climbed onto a large stone to rest and think. He felt terribly discouraged. Just then, life hardly seemed worth living. His heart felt as if it had dropped all the way down to his toes.

        - id: ch01-b10
          speaker: narrator
          text: >-
            Then he spotted something. At once, his heart leaped right back where it belonged. Just at that moment, Peter Rabbit came hopping toward him.

        - id: ch01-b11
          speaker: peter
          text: >-
            Did you find a new home?

        - id: ch01-b12
          speaker: chatterer
          text: >-
            Yes. At least, I think I did.

        - id: ch01-b13
          speaker: peter
          text: >-
            That's wonderful! I knew you'd find a place over here. So, where is it?

        - id: ch01-b14
          speaker: narrator
          text: >-
            Chatterer opened his mouth to answer, then snapped it shut. He remembered just in time that Peter found it very hard to keep a secret. Peter might tell someone without meaning to, and before long Shadow the Weasel might hear about it.

        - id: ch01-b15
          speaker: chatterer
          text: >-
            I'm not telling you yet, Peter Rabbit. I don't want anyone to know where it is until I'm sure the place will work.

        - id: ch01-b16
          speaker: narrator
          text: >-
            Peter looked so disappointed that Chatterer told him one small part of the secret.

        - id: ch01-b17
          speaker: chatterer
          text: >-
            But I can tell you this much. I'm going to live right here.

        - id: ch01-b18
          speaker: narrator
          text: >-
            Peter cheered up at once. He naturally thought Chatterer had found a hole in the old stone wall, and he felt sure he could discover it if he watched carefully.

        - id: ch01-b19
          speaker: peter
          text: >-
            That's good! I'll visit you often. Just be careful of Black Pussy. Her claws are very sharp. Well, I think I'll head back to the Old Briar-patch now.

        - id: ch01-b20
          speaker: chatterer
          text: >-
            Don't tell anyone where I am!
