audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: practical and good-natured with a playful firmness
        timbre: youthful and clear
        pace: medium
        pitch: medium
  chapters:
    - id: ch01
      title: The Price of a Wrong Deed
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Anyone who does something wrong will find that the day comes when the deed must be paid for. That day had come for Chatterer. He had no business stealing corn from Farmer Brown's corn-crib, even though he believed he had as much right to it as Farmer Brown did.

        - id: ch01-b02
          speaker: narrator
          text: >-
            The little people of the Green Meadows and the Green Forest think that anything growing there belongs to whoever wants it and can reach it first. But this corn was different. Farmer Brown had harvested it and stored it away. It belonged to him.

        - id: ch01-b03
          speaker: narrator
          text: >-
            Deep in his heart, Chatterer knew that. Otherwise, he would not have been so sneaky when he took the corn. All along, he knew he was stealing, but he kept telling himself it was all right. He stole again and again, until a trap caught him. Now he had to pay for what he had done.

    - id: ch02
      title: A Frightening Wait
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Chatterer was miserable and terribly frightened. He could only huddle into a little shivering ball. He felt certain this was his last day. Farmer Brown's boy would surely give him to cruel Black Pussy for her breakfast.

        - id: ch02-b02
          speaker: narrator
          text: >-
            Farmer Brown's boy had left Chatterer inside the house and gone out. From the woodshed came the sound of pounding, and as the boy worked, he whistled. Chatterer could not understand it. How could anyone sound so happy while planning something as dreadful as feeding him to Black Pussy?

        - id: ch02-b03
          speaker: narrator
          text: >-
            Chatterer waited and waited. It seemed like ages before Farmer Brown's boy returned, carrying a strange-looking box.

        - id: ch02-b04
          speaker: farmer_browns_boy
          text: >-
            Well, you little red rascal, here's your new home. I think this will keep you out of trouble for a while.

    - id: ch03
      title: Into the Strange Box
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The boy slid open a small door in the top of the box. Then he pulled on a thick glove and opened the little door of the trap. His big hand reached inside and closed around Chatterer.

        - id: ch03-b02
          speaker: narrator
          text: >-
            Poor Chatterer was sure the end had come. Black Pussy stood nearby, watching with hungry yellow eyes, and he thought the boy was about to hand him over to her. He twisted and fought and tried his hardest to bite. But his sharp little teeth could not get through that heavy glove.

        - id: ch03-b03
          speaker: narrator
          text: >-
            Even through his terror, Chatterer noticed something. The hand holding him tried to be gentle. It squeezed no harder than it had to.

        - id: ch03-b04
          speaker: narrator
          text: >-
            The boy lifted him from the trap and lowered him through the door in the top of the strange box. Then the door was fastened shut. After all his fear, nothing terrible had happened.

    - id: ch04
      title: Chatterer's Prison
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            At first, Chatterer stayed in one corner and sulked. He still believed something awful was going to happen. Farmer Brown's boy carried the box into the shed and set it in the sunshine. He watched for a while, but Chatterer went right on sulking.

        - id: ch04-b02
          speaker: narrator
          text: >-
            After a time, the boy went away and took Black Pussy with him. Chatterer was alone. Once he felt sure no one was nearby, he began to inspect the place. What sort of box was this? Could he possibly escape?

        - id: ch04-b03
          speaker: narrator
          text: >-
            The top and one side were made of strong, fine wire, so he could see through them. The other sides and the floor were wood covered with wire. His sharp teeth would never gnaw a way out.

        - id: ch04-b04
          speaker: narrator
          text: >-
            In one corner stood a sturdy piece of apple tree with two short branches where he could sit. Halfway up the wood was a small round hole. Chatterer crept over and peeped cautiously inside. It opened into a splendid hollow.

        - id: ch04-b05
          speaker: narrator
          text: >-
            On the floor lay a little heap of wood shavings and scraps of cloth. There was also a small pile of yellow corn. Chatterer hated the very sight of it. In his mind, that corn was what had brought him all this trouble.

        - id: ch04-b06
          speaker: narrator
          text: >-
            When he had examined every part of the box, Chatterer knew there was no way out.

        - id: ch04-b07
          speaker: narrator
          text: >-
            Chatterer was in a prison, though Farmer Brown's boy had another name for it. He called it a cage.
