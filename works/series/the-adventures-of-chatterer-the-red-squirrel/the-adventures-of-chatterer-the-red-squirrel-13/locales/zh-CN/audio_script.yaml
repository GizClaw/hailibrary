audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    farmer_browns_boy:
      display_name: 农夫布朗的男孩
      tts:
        delivery: 直爽利落，发现问题时认真警觉
        timbre: 清朗结实
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十三章　喋喋被关进监牢
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 谁要做了不该做的事，总有一天会明白，自己淘气惹下的祸，终究得由自己来偿还。
        - id: ch01-b02
          speaker: narrator
          text: 喋喋这回正是这样。他本来就不该去偷农夫布朗玉米仓里的玉米。可他觉得，那些玉米不光农夫布朗有权吃，自己也有份。绿草地和绿森林里的小居民们常常这么想。地里长出来的东西，只要自己想要，又能抢在别人前面拿到手，那就是自己的。
        - id: ch01-b03
          speaker: narrator
          text: 喋喋偏偏就在这里想错了。玉米是农夫布朗亲手收回来，再存进玉米仓的，别人自然不该去拿。其实，喋喋心里清楚得很。要不然，他偷拿玉米时何必躲躲藏藏呢？他明知道自己在偷，还一个劲儿哄自己，说这样做没什么不对。结果，他偷了一回又一回，最后落进捕鼠笼，只能为自己的错事付出代价。
        - id: ch01-b04
          speaker: narrator
          text: 喋喋又难受又害怕，缩成一个不停发抖的小毛团，什么也做不了。他确信今天就是自己的末日，男孩一定会把他交给残忍的黑猫，让黑猫拿他当早饭。
        - id: ch01-b05
          speaker: narrator
          text: 农夫布朗的男孩把捕鼠笼留在屋里，自己走了出去。过了好长时间，喋喋一直听见柴房里叮叮咚咚地响。男孩一边敲打东西，一边还快活地吹着口哨。喋喋怎么也想不通。这个人明明要把自己送给黑猫，做那么可怕的事，怎么还吹得出口哨？
        - id: ch01-b06
          speaker: narrator
          text: 喋喋等啊等，觉得简直过了好几个世纪，男孩才终于回来。他手上多了一只模样古怪的箱子。
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: “行啦，你这红毛小坏蛋，这儿就是你的新家！住进这里，你总能安分一阵，不再惹祸了吧。”
        - id: ch01-b08
          speaker: narrator
          text: 男孩拉开箱子顶上的小门，戴好一只厚手套，又打开捕鼠笼的小门。他把大手伸进去，一把握住了喋喋。
        - id: ch01-b09
          speaker: narrator
          text: 可怜的小喋喋以为自己这下真的完了，马上就会被送给黑猫。黑猫正在旁边盯着他，两只黄眼睛馋得发亮。喋喋拼命挣扎，使劲去咬，可手套实在太厚，他那尖尖的小牙根本咬不伤抓住自己的手。
        - id: ch01-b10
          speaker: narrator
          text: 怕成这样的时候，喋喋还是察觉到，那只大手一直尽量轻轻握着他。除了不让他逃掉，一点儿也没多用力。接着，男孩把他提出来，从怪箱子顶上的小门放了进去，然后关紧了门。说到底，喋喋担心的可怕事情一样也没发生。
        - id: ch01-b11
          speaker: narrator
          text: 刚进去时，喋喋只顾气鼓鼓地缩在角落。他还是相信，接下来准会有可怕的事。男孩把箱子搬进棚屋，摆到阳光照得进去的地方，又站在一旁看了他一会儿。可喋喋闷着气，始终不肯理会。后来，男孩带着黑猫走了，棚屋里只剩下喋喋。
        - id: ch01-b12
          speaker: narrator
          text: 等到确定四周没人，喋喋才打量起自己待的地方，想找找有没有出口。箱子的一面和顶上蒙着又细又结实的铁丝，他能从那里看见外面。剩下几面和底部虽然是木头的，却也盖着铁丝。他那一口尖牙完全无处下嘴，怎么也咬不出路来。
        - id: ch01-b13
          speaker: narrator
          text: 箱子一角立着一截粗实的苹果树枝，上面伸出两根短杈，可以让他坐着歇脚。树枝半腰还有个小圆洞。喋喋小心地凑过去，探头往里一看，里面竟有一个很不错的树洞。
        - id: ch01-b14
          speaker: narrator
          text: 箱底放着一小堆刨花和碎布，旁边还有一小堆黄玉米。喋喋看见那些玉米，心里别提多恨了！在他看来，就是玉米害自己惹上了这一切麻烦。
        - id: ch01-b15
          speaker: narrator
          text: 每个角落都查过以后，喋喋终于明白，这里根本没有路能逃出去。他已经被关进一座监牢了。当然，农夫布朗的男孩不管它叫监牢。他说，这是一只笼子。
