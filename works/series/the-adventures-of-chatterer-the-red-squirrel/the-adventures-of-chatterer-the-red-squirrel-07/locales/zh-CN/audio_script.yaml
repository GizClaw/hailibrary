audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 随和热心，思考时稍稍放慢
        timbre: 清爽柔和
        pace: 中等
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第七章　喋喋怎样骗过了彼得兔
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 红松鼠喋喋自己就是个淘气鬼，谁也信不过他。绿森林和绿草原上的居民都知道这一点。自己靠不住的人，往往也不肯相信别人，喋喋正是这样，总觉得谁都可疑。
        - id: ch01-b02
          speaker: narrator
          text: 彼得兔告别以后，并不知道喋喋的新家在哪儿，就朝亲爱的老荆棘丛走了。可喋喋马上认定，彼得绝不会甘心。就算不能真正找到，他也一定要觉得自己找到了才肯罢休。彼得那股要命的好奇心，喋喋太了解了。
        - id: ch01-b03
          speaker: narrator
          text: 喋喋一直看着彼得，等他走得没影儿了，才钻进老石墙的石缝，把自己也藏起来。他在心里盘算着。
        - id: ch01-b04
          speaker: chatterer
          text: “我知道彼得会怎么做。他会偷偷回来，躲在附近盯着我，好找出我的新家。我就在这里多等一会儿，让他先藏好，再来骗骗他。”
        - id: ch01-b05
          speaker: narrator
          text: 喋喋为什么这么有把握？因为换成他自己，也会这样做。他等了一阵，又回到彼得离开时的地方坐下，装作望着彼得回家的方向，像是要确认彼得真的走远了。可他一直用眼角偷偷查看附近的藏身处。
        - id: ch01-b06
          speaker: narrator
          text: 喋喋没有看见彼得，不过他一点儿也不怀疑。彼得一定就在周围。
        - id: ch01-b07
          speaker: narrator
          text: 过了一会儿，喋喋跑到老石墙的一处石洞前，装得忙忙碌碌，好像真把那里当成了新家。他钻进去，又跳出来，还一次次回头张望，仿佛很怕被人看见。他甚至找来几片枯叶，衔进洞里，像是要给自己铺床。
        - id: ch01-b08
          speaker: narrator
          text: 他始终没有瞧见彼得的影子，却始终认定彼得正在偷看。装了这么久，喋喋也累了。忽然，他那颗机灵的小脑袋又想出一个主意。他跳出石洞，直起身子坐在墙头，大声念起那首让彼得双耳发烫的小诗。
        - id: ch01-b09
          speaker: narrator
          text: 喋喋原本就是存心要让彼得难为情，可他故意念得像是当真相信彼得没有偷看，还为彼得这么诚实而高兴。念完以后，他尾巴一闪，再次躲了起来，好让彼得有机会离开。
        - id: ch01-b10
          speaker: narrator
          text: 这回，轮到喋喋监视彼得了。他藏在彼得看不见的地方，自己却能看清老石墙的两边。果然，彼得从那丛小灌木底下爬出来，偷偷朝老荆棘丛溜去。喋喋这才知道，彼得真的走了。
        - id: ch01-b11
          speaker: narrator
          text: 一想到自己骗过了彼得兔，喋喋笑了又笑。他觉得自己聪明极了，简直恨不得拍拍自己的后背。他根本没想到，彼得躲起来监视别人，是一件不诚实又不厚道的事。因为换成喋喋，他也会做得一模一样。
        - id: ch01-b12
          speaker: chatterer
          text: “如今想守住一个秘密，脑筋可得磨得尖尖的才行。”
        - id: ch01-b13
          speaker: narrator
          text: 喋喋说着，又得意地咯咯笑起来。
        - id: ch01-b14
          speaker: narrator
          text: 可那天下午，老荆棘丛里的彼得兔却静静坐着，想了很久，越想越惭愧。他以为发现喋喋的新家会让自己很快乐，现在却一点儿也高兴不起来。他的耳朵还在发烫。因为在彼得看来，喋喋以为他很诚实，可他做的事一点儿也不诚实。
        - id: ch01-b15
          speaker: peter_rabbit
          text: “我想，明天还是去找喋喋吧。我要把事情全都告诉他，也告诉他，我做得有多不厚道。”
        - id: ch01-b16
          speaker: narrator
          text: 彼得终于拿定了主意，心里顿时舒服多了。
        - id: ch01-b17
          speaker: narrator
          text: 可是，彼得从头到尾都没有找到喋喋的新家。喋喋真正选中的住处，其实是老苹果树上啄木鸟鼓手从前的家。
