audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
    peter:
      display_name: Peter Rabbit
      tts:
        delivery: curious and earnest, softening when ashamed
        timbre: youthful and clear
        pace: medium
        pitch: medium-high
  chapters:
    - id: ch01
      title: Chatterer Makes a Plan
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Chatterer the Red Squirrel was a scamp, and nobody in the Green Forest or on the Green Meadows trusted him. People who cannot be trusted themselves often suspect everyone else, and Chatterer was no exception at all. He trusted nobody. So when Peter Rabbit said good-by and headed for his dear Old Briar-patch without learning where Chatterer's new house was, Chatterer guessed exactly what would happen. Peter's dreadful curiosity would never let him rest until he knew, or thought he knew, where that house was.

        - id: ch01-b02
          speaker: narrator
          text: >-
            Chatterer watched until Peter was out of sight. Then he slipped down between the stones of the old wall and hid.

        - id: ch01-b03
          speaker: chatterer
          text: >-
            I know what Peter is going to do. He'll sneak back and hide somewhere so he can watch me. Then he'll think he's found my new house. I'll wait here long enough for him to hide, and after that I'll fool him.

        - id: ch01-b04
          speaker: narrator
          text: >-
            Chatterer was sure because that was exactly what he would have done in Peter's place. He waited a little while, then returned to the spot where Peter had left him. He sat there looking down the way Peter had gone, pretending to make certain Peter was really going home. All the while, his eyes kept watch at the sides for a nearby hiding place.

        - id: ch01-b05
          speaker: narrator
          text: >-
            He saw no sign of Peter. Still, he felt certain Peter was somewhere close by.

    - id: ch02
      title: The Make-Believe House
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            After a while, Chatterer ran to a hole between the stones of the old wall. He acted very busy, as though this really was his new house. He popped in and out, glancing around as if he feared someone might be watching. He even carried in dry leaves to make what looked like a bed.

        - id: ch02-b02
          speaker: narrator
          text: >-
            Chatterer still had not seen Peter, but he never doubted that Peter was watching. At last he grew tired, and a new idea came into his shrewd little head. He popped out of the hole and sat upright on the wall.

        - id: ch02-b03
          speaker: narrator
          text: >-
            Then Chatterer said aloud the verse that had made Peter's ears burn. That was exactly what he meant it to do. He spoke as though he truly believed Peter had not been spying and was glad of it.

        - id: ch02-b04
          speaker: narrator
          text: >-
            When the verse was over, Chatterer whisked out of sight to give Peter a chance to leave. This time, though, Chatterer did some peeking of his own. He hid where Peter could not see him, but where he could look both ways along the old stone wall.

        - id: ch02-b05
          speaker: narrator
          text: >-
            Soon Peter crawled out from beneath the little bush where he had been hiding. He sneaked away toward the Old Briar-patch. Now Chatterer knew Peter was truly gone.

        - id: ch02-b06
          speaker: narrator
          text: >-
            Chatterer laughed and laughed over the way he had fooled Peter Rabbit. He was so pleased with his own cleverness that he wished he could pat himself on the back. It never occurred to him to think how mean and dishonest Peter had been to spy, because Chatterer would have done the very same thing.

        - id: ch02-b07
          speaker: chatterer
          emotion: happy
          text: >-
            These days, you have to keep your wits very sharp if you want to keep a secret.

    - id: ch03
      title: Peter Decides to Tell the Truth
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            That afternoon, over in the Old Briar-patch, Peter Rabbit sat thinking. He felt deeply ashamed. Believing he had discovered Chatterer's new house brought him none of the pleasure he had expected. His ears still burned. He thought Chatterer believed he was honest, when Peter knew he had not been.

        - id: ch03-b02
          speaker: peter
          emotion: sad
          text: >-
            Tomorrow I'll go and tell Chatterer everything. I'll tell him how mean I've been.

        - id: ch03-b03
          speaker: narrator
          text: >-
            Once Peter made up his mind to do that, he felt better.

        - id: ch03-b04
          speaker: narrator
          text: >-
            Yet all that time, Peter had not found Chatterer's new house at all.

        - id: ch03-b05
          speaker: narrator
          text: >-
            Chatterer had chosen a home somewhere else. It was Drummer the Woodpecker's old home, high in an old apple tree.
