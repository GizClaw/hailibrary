audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
  chapters:
    - id: ch01
      title: 第二章　喋喋最后的机会
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 喋喋还在为活命拼命奔逃，心里连一点希望都没有。可就在这时候，他忽然看见了最后一线生机。说是生机，其实也只是一样可能救他的东西。到底管不管用，非试过才知道。就算真有用，他也可能才逃出一场大难，又撞进同样可怕的危险。
        - id: ch01-b02
          speaker: narrator
          text: 在一棵高高的栗树上，快到树顶的地方，有一大团褐色的东西。喋喋一看见，就使出全力朝那棵树奔去。那团东西是什么呢？原来是红尾鹰。他把脑袋缩在两肩之间，正蹲在那里打盹做梦。
        - id: ch01-b03
          speaker: narrator
          text: 老红尾也是喋喋最要命的天敌之一。他和黄鼠狼影子一样，很爱吃红松鼠。只是别的食物容易抓得多，他才很少来捉红松鼠。喋喋从前不止一次差点儿落进他的爪子，心里怕他怕得很。可这一回，喋喋偏偏爬上了老红尾栖身的那棵树。
        - id: ch01-b04
          speaker: narrator
          text: 因为一个大胆得出奇的计策，已经钻进了喋喋的脑袋。他一眼就看出来，红尾正在打盹，根本没发现自己。红尾要是拿黄鼠狼影子当晚餐，肯定也会跟拿他当晚餐一样乐意。
        - id: ch01-b05
          speaker: chatterer
          text: “落到红尾手里，反正也不比落到影子手里更糟。可要是我的计策成了，他们谁也抓不住我。不管了，这是我最后的机会！”
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: 喋喋蹭蹭蹭地往树上爬，黄鼠狼影子紧跟在后面。影子一心只顾着抓喋喋，完全没有注意老红尾。这正是喋喋所盼的。他一路爬高，直从老红尾身边窜了过去。经过的时候，他猛地扯了一下红尾长长的尾羽，接着继续奔向树顶。
        - id: ch01-b07
          speaker: narrator
          text: 到了树顶，喋喋用尽最后一点力气，纵身跳上旁边的一棵云杉。他藏进浓密的枝叶里，停下来喘口气，也等着看看接下来会怎样。
        - id: ch01-b08
          speaker: narrator
          text: 老红尾觉得尾巴叫人扯了一下，立刻惊醒了。他赶紧低头，要看看到底是谁这么大胆。黄鼠狼影子就在下面，而影子也直到这一刻才发现，树上坐着的是谁。老红尾发出一声尖厉的嘶叫，头顶的羽毛全竖了起来。他发怒时就是这个样子。现在，他真的气坏了。
        - id: ch01-b09
          speaker: narrator
          text: 黄鼠狼影子一下子停住，随即飞快地躲到树干另一边。他早把喋喋忘了。转眼间，一切都变了。刚才影子还是猎手，现在他却成了猎物。
        - id: ch01-b10
          speaker: narrator
          text: 老红尾在树顶上方绕圈盘旋。只要瞧见影子，他就张开凶狠的大爪，猛扑下去。影子只好绕着树干躲闪。他其实生气多过害怕。因为他那双尖眼睛已经看见，栗树的一根树枝上有个小树洞。只要钻进去，他就什么都不怕了。
        - id: ch01-b11
          speaker: narrator
          text: 几分钟前，影子还认定那顿晚餐已经到手。如今却有人把晚餐抢走了，他越想越恼火，气得浑身难受。他冲老红尾愤怒地尖叫一声，一面躲闪，一面等机会。终于，他飞奔到树洞口，一闪身钻了进去。再迟一点儿，他可就逃不掉了。
        - id: ch01-b12
          speaker: narrator
          text: 喋喋躲在云杉里，把这一切看得清清楚楚，这才长长地松了一口气。红尾鹰落在一棵高树的树顶，守住了影子藏身的树洞。喋喋明白，接下来很长一段时间，影子连鼻尖都不敢探到洞外。
        - id: ch01-b13
          speaker: narrator
          text: 等力气恢复以后，喋喋才从树梢间悄悄离开。他走得轻极了，直到确定红尾再也看不见自己，才赶紧加快脚步。此刻他只想做一件事，那就是离黄鼠狼影子越远越好。
