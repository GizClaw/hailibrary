audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
  chapters:
    - id: ch01
      title: Chatterer's Last Chance
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Chatterer was still running for his life, without the smallest bit of hope, when he suddenly saw one last chance to escape Shadow the Weasel. At least, he saw something that might give him a chance. He could not know until he tried. And even if it saved him from one danger, it might carry him straight into another just as great.

        - id: ch01-b02
          speaker: narrator
          text: >-
            Near the top of a tall chestnut tree was a large brown shape. Chatterer raced toward it as fast as he could go. That brown shape was Redtail the Hawk. Redtail sat there dozing, his head tucked between his shoulders as he dreamed.

        - id: ch01-b03
          speaker: narrator
          text: >-
            Now, old Redtail was one of Chatterer's deadliest enemies. He liked a meal of Red Squirrel every bit as much as Shadow did. He simply did not hunt squirrels often, because other food was easier to catch. Chatterer had narrowly escaped him more than once, and he was terribly afraid of him. Yet Chatterer was racing up the very tree where Redtail sat.

        - id: ch01-b04
          speaker: narrator
          text: >-
            A daring plan had come to Chatterer. He could see that Redtail was asleep and had not noticed him. He also knew the hawk would be just as glad to have Shadow for dinner. So Chatterer decided to risk everything on one bold idea.

        - id: ch01-b05
          speaker: chatterer
          emotion: fearful
          text: >-
            Redtail might catch me, or Shadow might catch me. But if this plan works, neither one will get me. Anyway, this is my very last chance.

        - id: ch01-b06
          speaker: narrator
          text: >-
            Chatterer scrambled up the chestnut tree, and Shadow came right after him. Shadow was thinking so hard about catching Chatterer that he never noticed old Redtail. That was exactly what Chatterer had hoped for.

        - id: ch01-b07
          speaker: narrator
          text: >-
            Higher and higher Chatterer climbed. He went straight past Redtail and gave one of the hawk's long tail feathers a sharp pull as he passed. Then he hurried to the very top of the tree. With the last of his strength, he leaped into a spruce nearby. Its thick branches hid him as he stopped to rest and watch what happened next.

        - id: ch01-b08
          speaker: narrator
          text: >-
            The pull on his tail woke Redtail in an instant. He looked down to see who had dared to do such a thing. Just below him stood Shadow the Weasel, who had only that moment discovered the hawk above him. Redtail gave a sharp hiss. The feathers on his head rose straight up, as they always did when he was angry. And he was very angry indeed.

        - id: ch01-b09
          speaker: narrator
          text: >-
            Shadow stopped at once. Then he darted around to the far side of the trunk. He had forgotten all about Chatterer. In a single moment, everything had changed. Shadow was no longer the hunter. Now he was the one being hunted.

        - id: ch01-b10
          speaker: narrator
          text: >-
            Redtail circled just above the tree. Whenever he spotted Shadow, he swept down with his great cruel claws spread wide to seize him. Shadow kept dodging around the trunk. He was angrier than he was frightened, because his sharp eyes had found a small hollow in one of the chestnut's branches. Once he got inside, he knew he would be safe.

        - id: ch01-b11
          speaker: narrator
          text: >-
            Still, Shadow was furious. Only a few minutes earlier, he had been certain Chatterer would be his dinner. Now that meal had been snatched away. He screeched angrily at Redtail. Then he waited for his chance, dashed toward the hollow, and slipped inside just in time.

        - id: ch01-b12
          speaker: narrator
          text: >-
            From the spruce tree, Chatterer had watched it all. At last, he let out a great sigh of relief. Redtail settled on top of a tall tree where he could watch the hollow that had swallowed Shadow. Chatterer knew the weasel would not dare to poke even his nose outside for a long while.

        - id: ch01-b13
          speaker: narrator
          text: >-
            As soon as Chatterer had rested, he crept away through the treetops, softly, oh, so softly. He kept going until he was sure Redtail could no longer see him.

        - id: ch01-b14
          speaker: narrator
          text: >-
            Then Chatterer hurried. He wanted to put as much distance as he could between himself and Shadow the Weasel.
