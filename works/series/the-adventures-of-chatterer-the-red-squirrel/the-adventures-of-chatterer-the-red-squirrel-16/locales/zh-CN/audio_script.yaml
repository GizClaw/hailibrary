audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    farmer_browns_boy:
      display_name: 农夫布朗的男孩
      tts:
        delivery: 坦率友善，带着少年人的耐心
        timbre: 清朗自然
        pace: 从容
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十六章　喋喋喜出望外
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 绿森林里那个爱淘气的红松鼠喋喋，这一辈子还从没过得这么舒服。北风老哥可以吼过绿草地，也可以呼啸着穿过绿森林，把雪堆成高高的雪丘。可不管他怎么折腾，也休想让喋喋那身红色小皮袄里钻进一丝寒意。
        - id: ch01-b02
          speaker: narrator
          text: 喋喋手边总有吃的。玉米、坚果，还有种种他爱吃的美味，想吃多少就有多少。可是，他并不真正快活。因为他住在监牢里，而一座监牢再舒适，住在里面也不可能真的快活。
        - id: ch01-b03
          speaker: narrator
          text: 做了囚徒以后，喋喋对农夫布朗的男孩完全改了看法。他们已经成了很要好的朋友。男孩待他一直很温柔，每次来，还会给他带些好吃的。
        - id: ch01-b04
          speaker: chatterer
          text: “他根本不像我以前想的那样。要是我能重获自由，我一点儿也不会怕他。我……我真想把他的事讲给绿森林里的其他小居民听。只要我能……”
        - id: ch01-b05
          speaker: narrator
          text: 喋喋说不下去了，喉咙里像是堵着一个大疙瘩。他想起绿森林，想起老果园，也想起自己从前怎样飞奔过树梢，又怎样沿着石墙疾跑。
        - id: ch01-b06
          speaker: narrator
          text: 奔跑和跳跃，曾占去他生活中一半的乐趣。如今，这座小监牢却窄得连腿也伸展不开。他想，哪怕偶尔只有一次，能让自己使出全身力气尽情地跑，监牢里的日子也不会这么难熬。
        - id: ch01-b07
          speaker: narrator
          text: 就在那天下午，喋喋正躺在树洞木桩的小床上睡觉，忽然有什么东西蒙住了那扇圆圆的小门。他惊恐地醒来，发现自己竟然被关在了树洞里。
        - id: ch01-b08
          speaker: narrator
          text: 喋喋一点办法也没有，只能躺在床上吓得直发抖。他不知道接下来会发生什么可怕的事，只听见农夫布朗的男孩正在笼子里忙个不停。
        - id: ch01-b09
          speaker: narrator
          text: 过了好久好久，圆圆的小门终于又透进亮光。门打开了，喋喋却不敢出去。这时，他听见一声轻轻的口哨。男孩每次带来格外好吃的东西，都会这样唤他。
        - id: ch01-b10
          speaker: narrator
          text: 喋喋终于探头望出去。笼子的地板上摆着几颗再好不过的坚果，他立刻跑了出来。接着，那双锐利的眼睛又发现，笼子一头多了一个铁丝做成的古怪玩意儿。
        - id: ch01-b11
          speaker: narrator
          text: 喋喋疑心重重地盯着它。难道这是一种新式陷阱？可他都已经是个囚徒了，为什么还要在这里摆陷阱呢？
        - id: ch01-b12
          speaker: narrator
          text: 他一边吃光坚果，一边始终留意那个古怪玩意儿。看起来，它好像不会伤人。喋喋慢慢靠近，最后一下跳了进去。谁知那东西竟然动了！
        - id: ch01-b13
          speaker: narrator
          text: 喋喋吓坏了，连忙往上跑，可他一点儿也没升高。真的，半点儿也没有。原来他正站在一只铁丝轮子里。他一跑，轮子就跟着转。
        - id: ch01-b14
          speaker: narrator
          text: 喋喋害怕极了。他越是拼命快跑，轮子就转得越快。最后，他累得气喘吁吁，再也跑不动一步，只好停下来。他一停，轮子也停住了。
        - id: ch01-b15
          speaker: narrator
          text: 渐渐地，喋喋明白了。农夫布朗的男孩做了这只轮子，就是要让他想跑多久就跑多久，想什么时候跑就什么时候跑。
        - id: ch01-b16
          speaker: narrator
          text: 明白以后，虽然还在监牢里，喋喋却已经快活到了这里能有的极点。这份惊喜真叫他喜出望外！他在轮子里跑呀，跑呀，一直跑到非停下来喘气不可。
        - id: ch01-b17
          speaker: narrator
          text: 农夫布朗的男孩站在一旁看着。他见自己让喋喋快活了这么多，也忍不住笑了起来。
