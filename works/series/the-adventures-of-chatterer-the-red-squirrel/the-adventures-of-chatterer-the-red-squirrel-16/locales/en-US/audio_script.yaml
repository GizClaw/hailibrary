audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
  chapters:
    - id: ch01
      title: Chatterer Has a Pleasant Surprise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Chatterer the Red Squirrel, the mischief maker of the Green Forest, had never been so comfortable. Brother North Wind could roar over the Green Meadows and through the forest, piling the snow into great drifts, but he could not make Chatterer's little red coat shiver even once.

        - id: ch01-b02
          speaker: narrator
          text: >-
            There was always plenty to eat close by, too. Chatterer had corn, nuts, and all the other good things he loved. Still, he was not truly happy. He was a prisoner, and even the nicest prison is still a prison.

        - id: ch01-b03
          speaker: narrator
          text: >-
            During his time in the cage, Chatterer had begun to think very differently about Farmer Brown's boy. The boy was always gentle with him and always brought him something tasty. Before long, the two of them had become very good friends.

        - id: ch01-b04
          speaker: chatterer
          text: >-
            He isn't anything like I thought he was. If I were free, I wouldn't be scared of him at all. I—I wish I could tell some of the other little people in the Green Forest about him. If only—
          emotion: sad

        - id: ch01-b05
          speaker: narrator
          text: >-
            Chatterer could not finish. A great lump rose in his throat. He was thinking of the Green Forest and the Old Orchard, and of the days when he raced through the treetops and along the stone wall.

        - id: ch01-b06
          speaker: narrator
          text: >-
            Running and jumping had been half the fun of being alive. Now his little prison did not even give him room to stretch his legs. If he could only run as hard as he knew how once in a while, he felt the cage might be a little easier to bear.

        - id: ch01-b07
          speaker: narrator
          text: >-
            That very afternoon, Chatterer was napping in his bed inside the hollow stump when something slid over the little round doorway. He woke in a terrible fright and found himself trapped inside the stump.

        - id: ch01-b08
          speaker: narrator
          text: >-
            There was nothing he could do. He lay in his bed, trembling and wondering what dreadful thing would happen next. Outside, he could hear Farmer Brown's boy working busily at something in the cage.

        - id: ch01-b09
          speaker: narrator
          text: >-
            A long, long time passed. Then light shone through Chatterer's little doorway again. It was open, but at first he did not dare come out.

        - id: ch01-b10
          speaker: narrator
          text: >-
            Then he heard the boy's soft little whistle. That was the call the boy always used when he had an especially good treat. At last Chatterer peeped out. Some of the finest nuts he had ever seen were waiting on the cage floor, and he came out at once.

        - id: ch01-b11
          speaker: narrator
          text: >-
            But his sharp eyes soon noticed something else. At one end of the cage stood a strange thing made of wire. Chatterer watched it suspiciously. Was it some new sort of trap? Then again, why would anyone put a trap there when he was already a prisoner?

        - id: ch01-b12
          speaker: narrator
          text: >-
            Chatterer ate every nut, watching the strange wire thing all the while. It seemed harmless enough, so he crept closer. At last, he hopped inside. The thing moved beneath him.

        - id: ch01-b13
          speaker: narrator
          text: >-
            That frightened him, and he tried to race upward. But he did not go up. No, sir, he stayed right where he was. Chatterer was inside a wire wheel, and whenever he ran, the wheel spun around him.

        - id: ch01-b14
          speaker: narrator
          text: >-
            Chatterer was terrified. The faster he ran, the faster the wheel turned. At last he was out of breath and too tired to take one more step, so he stopped. The wheel stopped, too.

        - id: ch01-b15
          speaker: narrator
          text: >-
            Little by little, Chatterer understood. Farmer Brown's boy had built the wheel so Chatterer could run as much as he liked, whenever he liked. Once he realized that, Chatterer was as nearly happy as any prisoner could be.

        - id: ch01-b16
          speaker: narrator
          text: >-
            What a pleasant surprise it was! Chatterer raced and raced until he had to stop and catch his breath. Farmer Brown's boy watched and laughed, delighted to see how much happier he had made Chatterer.
