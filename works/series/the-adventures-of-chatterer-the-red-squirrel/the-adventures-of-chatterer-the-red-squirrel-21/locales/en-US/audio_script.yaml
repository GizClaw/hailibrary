audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and saucy, with confidence that can soften into honesty
        timbre: bright and lively
        pace: brisk
        pitch: medium-high
    tommy_tit:
      display_name: Tommy Tit
      tts:
        delivery: merry and friendly, with crisp, birdlike energy
        timbre: light and clear
        pace: brisk
        pitch: high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: warm and good-natured, with openhearted amusement
        timbre: youthful and clear
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Chatterer Hears the Small Voice
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The first of the little meadow and forest people to see Chatterer safely back in the Old Orchard was Tommy Tit the Chickadee. Tommy happened to be busy in the very apple tree where Drummer the Woodpecker's old home was. You may remember that Chatterer had moved into Drummer's old home for the winter. He had been there only a little while when Farmer Brown's boy caught him in the corn crib.

        - id: ch01-b02
          speaker: narrator
          text: >-
            Yes, sir, Tommy was very busy indeed. Even his sharp little eyes missed Chatterer racing along the snow-covered stone wall. He did not notice him until he heard Chatterer's claws scratching up the apple tree. Then Tommy was so startled that he lost his balance. He nearly turned a somersault in the air before catching another twig. Tommy already knew all about Chatterer and how Farmer Brown's boy had been keeping him prisoner.

        - id: ch01-b03
          speaker: tommy_tit
          text: >-
            Why, Chatterer! Is that really you? How in the world did you escape? Oh, I'm so glad you got away!
          emotion: surprised

        - id: ch01-b04
          speaker: narrator
          text: >-
            Chatterer gave his tail a saucy flip, and his eyes twinkled. What a perfect chance to boast and brag! He could tell Tommy how clever he had been, clever enough to escape from Farmer Brown's boy. Tommy would spread the story among the other little people. Soon everyone would think Chatterer was as smart as Unc' Billy Possum. Unc' Billy really had been smart enough to escape after Farmer Brown's boy caught him.

        - id: ch01-b05
          speaker: narrator
          text: >-
            Everyone already knew that Chatterer had been a prisoner. Now that he was free, they would believe any tale he told about his escape. His friends and neighbors would all be saying what a smart fellow he was. Could there ever be a better chance?

        - id: ch01-b06
          speaker: chatterer
          text: >-
            I... I...

        - id: ch01-b07
          speaker: narrator
          text: >-
            Chatterer stopped and tried once more.

        - id: ch01-b08
          speaker: chatterer
          text: >-
            Well, this is how it happened. I... I...

        - id: ch01-b09
          speaker: narrator
          text: >-
            Somehow, he could not say what he had planned. Tommy's bright, merry eyes seemed to look straight into Chatterer's head and heart, as if they could see every thought there. Of course, they could not. The truth was that the small voice inside Chatterer was speaking again. He had often refused to hear it when he felt tempted to do wrong.

        - id: ch01-b10
          speaker: narrator
          text: >-
            Now that small voice told him, “For shame, Chatterer! For shame! Tell the truth. Tell the truth.” That was why Chatterer hesitated and fell silent.

        - id: ch01-b11
          speaker: tommy_tit
          text: >-
            You aren't saying you outsmarted Farmer Brown's boy and escaped from that strong little prison, are you?

        - id: ch01-b12
          speaker: chatterer
          text: >-
            No. No, I didn't. The truth is, Tommy, he left the door open on purpose. He set me free. Farmer Brown's boy isn't nearly as bad as some people think.

        - id: ch01-b13
          speaker: narrator
          text: >-
            The answer came out almost before Chatterer had time to think. Tommy laughed his chickadee laugh.

        - id: ch01-b14
          speaker: tommy_tit
          text: >-
            Dee, dee, dee! I've been telling all you fellows that for ages, but you never believed me. I suppose you know better now. Why, I'm not afraid of Farmer Brown's boy at all. If the little people of the forest and meadow trusted him instead of running away, he would be the best friend we have.
          emotion: happy

        - id: ch01-b15
          speaker: chatterer
          text: >-
            Maybe he would. He treated me very well while I was his prisoner, and... well, I'm not nearly so afraid of him now. But I still won't let him catch me again.

        - id: ch01-b16
          speaker: tommy_tit
          text: >-
            Pooh! I would eat right out of his hand.

        - id: ch01-b17
          speaker: chatterer
          text: >-
            That's easy for you to say while you're flying around free. I don't believe you'd dare go to his house and prove it.

        - id: ch01-b18
          speaker: tommy_tit
          text: >-
            I can't do it now. I have too much work to do for him. But someday I'll show you. Dee, dee, dee, chickadee! Here I am talking when there's so much work waiting. I'm clearing insect eggs from his apple trees.

        - id: ch01-b19
          speaker: farmer_browns_boy
          text: >-
            Ha, ha, ha! Run along, you little red rascal!
          emotion: happy

        - id: ch01-b20
          speaker: narrator
          text: >-
            The voice came from behind Chatterer. At once, he understood. Farmer Brown's boy had not left the little door open by accident. He had truly given Chatterer his freedom. Right then, Chatterer knew that the two of them were going to be the best of friends.
