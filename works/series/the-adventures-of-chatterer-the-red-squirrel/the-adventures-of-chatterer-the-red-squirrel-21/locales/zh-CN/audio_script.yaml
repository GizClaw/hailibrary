audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    tommy_tit:
      display_name: 黑顶山雀汤米
      tts:
        delivery: 快活爽朗，说话干脆利落
        timbre: 清脆轻盈
        pace: 轻快
        pitch: 高音
    farmer_browns_boy:
      display_name: 农夫布朗的男孩
      tts:
        delivery: 开朗友善，笑意自然
        timbre: 清亮朴实
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二十一章　喋喋听见内心的小声音
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 喋喋平安回到老果园后，第一个看见他的，是黑顶山雀汤米。那时，汤米正好在一棵苹果树上忙着，而那棵树里，就是啄木鸟鼓手从前的家。
        - id: ch01-b02
          speaker: narrator
          text: 喋喋被农夫布朗的男孩逮进玉米仓以前，才刚搬进那个树洞，打算在那里过冬。
        - id: ch01-b03
          speaker: narrator
          text: 真的，先生，汤米实在太忙了。他的小眼睛一向又亮又尖，可他竟没看见喋喋正沿着积雪的老石墙飞奔。
        - id: ch01-b04
          speaker: narrator
          text: 直到喋喋的爪子抓上苹果树干，汤米听见动静，才发现他。汤米吃了一大惊，脚下一滑，差点在半空翻个跟头，好不容易才抓住另一根细枝。
        - id: ch01-b05
          speaker: narrator
          text: 汤米早就知道喋喋被农夫布朗的男孩关了起来。现在他突然看到喋喋，怎么会不惊讶呢？
        - id: ch01-b06
          speaker: tommy_tit
          text: “咦！咦——！喋喋，真的是你？你到底怎么逃出来的？你自由了，我太高兴了，真的太高兴了！”
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: 喋喋神气地甩了甩尾巴，眼睛直发亮。这可是吹牛的绝好机会。他正想说，自己聪明得很，连农夫布朗的男孩也休想困住他。
        - id: ch01-b08
          speaker: narrator
          text: 汤米一定会把这件事告诉大家。到那时，所有小居民都会觉得，喋喋和负鼠比利大叔一样机灵。比利大叔被抓以后，可是真的凭聪明逃出来了。
        - id: ch01-b09
          speaker: narrator
          text: 大家都知道喋喋当过囚徒，也都看见他现在自由了。不管他说自己怎样逃走，别人准会相信。朋友和邻居们还会夸他，真是个聪明的家伙。
        - id: ch01-b10
          speaker: narrator
          text: 喋喋张开嘴，只结结巴巴地挤出两个“我”字，就停住了。他歇了一会儿，又想从“事情是这样的”讲起，可还是说不下去。
        - id: ch01-b11
          speaker: narrator
          text: 那些原本想好的话，怎么也出不了口。汤米快活明亮的眼睛，好像能一直看到他的脑袋和心里，把每个念头都瞧得清清楚楚。当然，汤米不可能真有这种本事。
        - id: ch01-b12
          speaker: narrator
          text: 真正开口的，是喋喋心里那个微小的声音。以前每当他想做坏事，总是不肯听它。现在，那个声音又响了起来。
        - id: ch01-b13
          speaker: narrator
          text: 那个声音说：“真丢脸，喋喋！真丢脸！说实话。快说实话。”
        - id: ch01-b14
          speaker: narrator
          text: 就是这个小声音，让喋喋迟疑起来，再也吹不了牛。
        - id: ch01-b15
          speaker: tommy_tit
          text: “难道你真有那么聪明，骗过农夫布朗的男孩，从他造的结实小牢笼里溜出来了？”
        - id: ch01-b16
          speaker: narrator
          text: 喋喋几乎没有多想，答案就冲出了嘴。
        - id: ch01-b17
          speaker: chatterer
          text: “没有，我可没骗过他。实话告诉你吧，汤米，是他故意开着门，放我走的。农夫布朗的男孩根本不像有些人说的那么坏。”
        - id: ch01-b18
          speaker: tommy_tit
          text: “嘀，嘀，嘀！我早就对你们说过，可谁都不肯信。现在你总该明白了吧？我一点也不怕农夫布朗的男孩，连一丁点儿也不怕。”
          emotion: happy
        - id: ch01-b19
          speaker: tommy_tit
          text: “森林和草地上的小居民要是肯信任他，别再一看见他就逃，他准会成为我们最好的朋友。”
        - id: ch01-b20
          speaker: chatterer
          text: “也许吧。他把我关起来的时候，对我倒是很好。而且——而且我现在也没有那么怕他了。可我还是不会再让他抓住我。”
        - id: ch01-b21
          speaker: tommy_tit
          text: “呸！就算要从他手里啄东西吃，我也敢。”
        - id: ch01-b22
          speaker: chatterer
          text: “你能自由自在地飞，当然说得轻巧。我才不信你敢飞到他家，当面证明给我看。”
        - id: ch01-b23
          speaker: tommy_tit
          text: “今天可不行，我正忙着替他干活呢。不过总有一天，我会让你亲眼看看。嘀，嘀，嘀，黑顶山雀叫嘀嘀！”
        - id: ch01-b24
          speaker: tommy_tit
          text: “活儿还多着呢，我却在这里说个不停。我得赶紧替他清掉苹果树上的虫卵。”
        - id: ch01-b25
          speaker: farmer_browns_boy
          text: “哈，哈，哈！跑吧，你这个红毛小淘气！”
          emotion: happy
        - id: ch01-b26
          speaker: narrator
          text: 声音从喋喋身后传来。这一下，他终于明白了。农夫布朗的男孩并没有忘记关上小门，那扇门是他故意敞开的。他把自由还给了喋喋。
        - id: ch01-b27
          speaker: narrator
          text: 就在那一刻，喋喋知道，自己和农夫布朗的男孩一定会成为最好的朋友。
