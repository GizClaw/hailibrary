audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    tommy_tit:
      display_name: 黑顶山雀汤米
      tts:
        delivery: 快活爽朗，说话干脆利落
        timbre: 清脆轻盈
        pace: 轻快
        pitch: 高音
    sammy_jay:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 尖刻自负，嘲弄时故意拖长语气
        timbre: 响亮尖锐
        pace: 偏快
        pitch: 偏高
  chapters:
    - id: ch01
      title: 第二十三章　喋喋变得胆大包天
      blocks:
        - id: ch01-b01
          speaker: chatterer
          text: “我不怕。我害怕。我不怕。我害怕。我不怕。”
          emotion: fearful
        - id: ch01-b02
          speaker: narrator
          text: 喋喋把这两句话颠来倒去，不知道念了多少回。他其实怕得很，只是在拼命哄自己，想相信自己一点也不怕。他觉得，把“不怕”说得足够多，也许就真的信了。可是每说一回，心底那个细小又诚实的声音就会冒出来，明明白白地告诉他，他害怕。
        - id: ch01-b03
          speaker: narrator
          text: 可怜的喋喋！承认自己的胆量还不如小小的黑顶山雀汤米，实在太伤自尊了。可他仔细想想，又觉得自己根本没理由比汤米胆小。汤米天天从农夫布朗的男孩手里取东西吃。喋喋、快乐杰克、彼得兔、萨米和黑仔都亲眼见过。他们从没见过这么勇敢的事，心里越发敬佩汤米。
        - id: ch01-b04
          speaker: narrator
          text: 汤米自己却不觉得这有什么勇敢。不，先生，他可明白得很。别看他戴着一顶小小的黑帽子，帽子底下装的聪明见识可不少。
        - id: ch01-b05
          speaker: tommy_tit
          text: “头一回去，也许真需要一点胆量。可我现在知道，农夫布朗的男孩不会伤害我，再去就不算勇敢了。喋喋和森林、草原上的其他小居民也可以这样。只要他们肯想一想，再给那个男孩一次机会，就会知道他没什么可怕的。”
        - id: ch01-b06
          speaker: narrator
          text: 喋喋努力说服自己不要怕时，心里也渐渐有了同样的想法。这时，农夫布朗家的门砰地关上了。他从老石墙里探出头，看见男孩站在那里，手上托着一颗又大又饱满的山核桃，馋得人真想马上拿走。
        - id: ch01-b07
          speaker: narrator
          text: 男孩还吹着一声轻柔的小口哨。喋喋记得，他被关起来的时候，男孩送好吃的来，也吹过这个调子。他当然知道，口哨是在叫自己，那颗山核桃也是特意留给自己的。
        - id: ch01-b08
          speaker: narrator
          text: 喋喋几乎没来得及想，就离开石墙，朝男孩跑去。路已经走了一半，他却猛地停住。心底那个小声音简直是在他耳边大喊。
        - id: ch01-b09
          speaker: chatterer
          text: “我害怕！”
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: 没错，他就是害怕。喋喋正要掉头逃回老石墙，又听见了另一个声音。这次不是心里的声音。不，绝对不是！它从老果园一棵苹果树的树梢上传下来。
        - id: ch01-b11
          speaker: sammy_jay
          text: “胆小鬼！胆小鬼！胆小鬼！”
        - id: ch01-b12
          speaker: narrator
          text: 是冠蓝鸦萨米在叫。自己承认害怕是一回事，让别人当面说自己害怕，那可完全是另一回事。
        - id: ch01-b13
          speaker: chatterer
          text: “胡说！胡说！我才不怕呢！”
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: 喋喋气冲冲地反驳完，立刻就要证明给萨米看。他猛然冲上前，从农夫布朗的男孩手里夺过那颗山核桃，眨眼又跑回老石墙。喋喋、男孩和萨米全都愣住了，要说谁最吃惊，还真分不出来。
        - id: ch01-b15
          speaker: chatterer
          text: “我拿到了！我真的拿到了！我做到了！”
        - id: ch01-b16
          speaker: sammy_jay
          text: “哼，可你绝对不敢再去一次！”
        - id: ch01-b17
          speaker: chatterer
          text: “谁说我不敢？我偏敢！”
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 喋喋还真的又跑了过去。他从男孩手里拿走第二颗饱满的山核桃时，心里最后那一点恐惧也不见了。再看着农夫布朗的男孩，他已经一点也不害怕了。汤米一直说，那个男孩没什么可怕。直到这时候，喋喋才知道汤米从来都没说错。
        - id: ch01-b19
          speaker: chatterer
          text: “哎呀，我要是早肯让他亲近，他早就是我的朋友啦！”
        - id: ch01-b20
          speaker: narrator
          text: 喋喋想得一点不错。好啦，红松鼠喋喋的故事暂时就讲到这里。冠蓝鸦萨米坚持说，下面该轮到他了。所以下一本书里，我们要听的就是萨米的历险故事。
