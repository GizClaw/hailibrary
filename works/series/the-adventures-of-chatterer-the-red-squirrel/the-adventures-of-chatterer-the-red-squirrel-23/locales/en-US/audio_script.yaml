audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, with pride close to the surface
        timbre: bright and slightly raspy
        pace: brisk
        pitch: medium-high
    tommy_tit:
      display_name: Tommy Tit
      tts:
        delivery: sensible and friendly, with simple confidence
        timbre: light and clear
        pace: easy
        pitch: high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp and inquisitive, with a lively streak of mischief
        timbre: bright and piercing
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Chatterer Grows Very, Very Bold
      blocks:
        - id: ch01-b01
          speaker: chatterer
          text: >-
            I'm not afraid. I am afraid. I'm not afraid. I am afraid. I'm not afraid.

        - id: ch01-b02
          speaker: narrator
          text: >-
            Chatterer said the two things to himself over and over again. The truth was, he really was afraid, and he was trying hard to convince himself that he wasn't. Perhaps, he thought, if he said it enough times, he might truly believe it. But that was the trouble. Each time Chatterer declared that he wasn't afraid, a small, honest voice deep inside him spoke right up and told him the truth. He was afraid.

        - id: ch01-b03
          speaker: narrator
          text: >-
            Poor Chatterer! It hurt his pride to admit that he wasn't as brave as little Tommy Tit the Chickadee. Yet his common sense told him there was no reason in the world why he shouldn't be just as brave. Every day, Tommy went to Farmer Brown's boy and took food right from his hand. Chatterer, Happy Jack the Gray Squirrel, Peter Rabbit, Sammy Jay, and Blacky the Crow had all watched him do it. To every one of them, it seemed like the bravest thing they had ever seen. Their respect for little Tommy grew and grew.

        - id: ch01-b04
          speaker: narrator
          text: >-
            But Tommy himself did not think it was brave at all. No, sir. Tommy knew better. There was a great deal of common sense beneath the little black cap he wore.

        - id: ch01-b05
          speaker: tommy_tit
          text: >-
            Maybe I was brave the first time. But I'm not being brave now, because I know Farmer Brown's boy won't hurt me. Chatterer and all the other little forest and meadow people might feel the same way if they thought about it and gave him half a chance.

        - id: ch01-b06
          speaker: narrator
          text: >-
            As Chatterer tried to convince himself he wasn't afraid, he was beginning to have thoughts much like Tommy's. Then he heard the farmhouse door slam and peeked out from the old stone wall. There stood Farmer Brown's boy, holding out a big, fat hickory nut in the most tempting way. The boy was giving the same gentle little whistle he had used when Chatterer was his prisoner and he came with good things for Chatterer to eat.

        - id: ch01-b07
          speaker: narrator
          text: >-
            Of course, Chatterer knew perfectly well that the whistle was calling him and that the big hickory nut was meant for him. Almost before he could think, he left the old wall and ran halfway to Farmer Brown's boy. Then he stopped cold. This time, the little voice inside him seemed to shout right into his ears.

        - id: ch01-b08
          speaker: chatterer
          text: >-
            I am afraid.
          emotion: fearful

        - id: ch01-b09
          speaker: narrator
          text: >-
            It was true. Chatterer was afraid. He was right on the point of turning around and racing back to the old stone wall when he heard another voice. This one did not come from inside him. Oh, no! It came from the top of one of the apple trees in the Old Orchard.

        - id: ch01-b10
          speaker: sammy_jay
          text: >-
            Coward! Coward! Coward!

        - id: ch01-b11
          speaker: narrator
          text: >-
            It was Sammy Jay. Now, telling yourself that you're afraid is one thing. Hearing someone else say it is quite another.

        - id: ch01-b12
          speaker: chatterer
          text: >-
            That's not true! I'm not afraid!
          emotion: angry

        - id: ch01-b13
          speaker: narrator
          text: >-
            Chatterer scolded Sammy, then suddenly dashed forward to prove his words. He snatched the fat hickory nut right from the boy's hand and raced back into the old stone wall. Chatterer, Farmer Brown's boy, and Sammy Jay were all so surprised that it was hard to say which one was the most astonished.

        - id: ch01-b14
          speaker: chatterer
          text: >-
            I did it! I did it! I did it!
          emotion: happy

        - id: ch01-b15
          speaker: narrator
          text: >-
            Chatterer boasted about what he had done, but Sammy answered in the most annoying way he could.

        - id: ch01-b16
          speaker: sammy_jay
          text: >-
            I bet you wouldn't dare do it again!

        - id: ch01-b17
          speaker: chatterer
          text: >-
            I would too!
          emotion: angry

        - id: ch01-b18
          speaker: narrator
          text: >-
            Chatterer snapped back, and then he really did it. He ran out and took a second fat nut from Farmer Brown's boy. With that, the very last bit of Chatterer's fear disappeared. At last, he knew that Tommy Tit the Chickadee had been right all along when he insisted there was nothing to fear from Farmer Brown's boy.

        - id: ch01-b19
          speaker: chatterer
          text: >-
            Why, if I'd only let him, he could have been my friend long ago!

        - id: ch01-b20
          speaker: narrator
          text: >-
            And he could have been.

        - id: ch01-b21
          speaker: narrator
          text: >-
            That is all about Chatterer the Red Squirrel for now. Sammy Jay insists that his turn has come, so the next book will tell about his adventures.
