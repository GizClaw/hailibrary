audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带一点温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有起伏
        pitch: 中音
    chatterer:
      display_name: 喋喋
      tts:
        delivery: 伶俐急促，紧张时带着哭腔
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 偏高
    farmer_browns_boy:
      display_name: 农夫布朗的男孩
      tts:
        delivery: 直爽利落，发现问题时认真警觉
        timbre: 清朗结实
        pace: 中等
        pitch: 中音
    farmer_brown:
      display_name: 农夫布朗
      tts:
        delivery: 爽朗厚道，说话直接而稳重
        timbre: 洪亮浑厚
        pace: 中等偏缓
        pitch: 偏低
    mrs_brown:
      display_name: 布朗太太
      tts:
        delivery: 温柔坚定，怜爱中带着不容含糊
        timbre: 柔和清润
        pace: 从容
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十二章　喋喋认定今天是自己的末日
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 农夫布朗的男孩提起铁丝捕鼠笼，朝屋里走去。黑猫就跟在他脚后，抬起一双又馋又狠的眼睛，直盯着笼里的喋喋。喋喋心里连最微弱、最渺小的一线希望也没有了。
        - id: ch01-b02
          speaker: narrator
          text: 他最后看了一眼老果园，又越过果园，望向远处的绿森林。他原本住在那里，却因为害怕黄鼠狼影子逃了出来。农舍的门随即关上，把外面的一切都挡住了。哪怕他还存着一线希望，这扇门也足以把它关灭。可他早就绝望了。他认定，自己就要被送给黑猫当早饭。
        - id: ch01-b03
          speaker: narrator
          text: 男孩把捕鼠笼放到桌上。农夫布朗正在吃早饭，他洪亮的声音响了起来。
        - id: ch01-b04
          speaker: farmer_brown
          text: “你拿来的是什么？”
        - id: ch01-b05
          speaker: farmer_browns_boy
          text: “我把偷玉米仓里玉米的贼捉住了。你猜猜是谁？”
        - id: ch01-b06
          speaker: farmer_brown
          text: “肯定是那些讨厌的耗子。恐怕你哪次忘了关门，它们才溜进仓里。”
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: “才不是耗子呢，我看仓里根本没有耗子。是那只红毛小坏蛋。最近，我们不是常看见他沿着老果园边上的石墙飞跑吗？真不知道他怎么钻进仓里的。不过，我发现他时，他就在那儿。现在，他到这儿来了。”
        - id: ch01-b08
          speaker: narrator
          text: 农夫布朗走到桌边，低头看了看喋喋。
        - id: ch01-b09
          speaker: farmer_brown
          text: “那你想怎么处置他？”
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: “我还没想好。要不就给黑猫当早饭吧？从我找到他起，黑猫就一直缠着我要呢。”
        - id: ch01-b11
          speaker: narrator
          text: 说着，男孩朝桌子另一边望去，眼睛里闪着淘气的笑。
        - id: ch01-b12
          speaker: mrs_brown
          text: “不行，你可不能那么做！那也太残忍了。你得把他带到绿森林里放掉。”
        - id: ch01-b13
          speaker: narrator
          text: 一张温和的脸俯在捕鼠笼上方。那双眼睛望着喋喋，满是怜惜。
        - id: ch01-b14
          speaker: mrs_brown
          text: “看看这个可怜的小东西，他都吓成什么样了！吃完早饭，你马上把他送到绿森林去。”
        - id: ch01-b15
          speaker: farmer_browns_boy
          text: “妈妈就是这个样子！哪怕笼里关的是世上最丑、最老的一只耗子，她也一定会想出个理由，把它放走。”
        - id: ch01-b16
          speaker: mrs_brown
          text: “这些披着毛皮的小生灵，全都是上帝创造的。在他的宏大安排里，它们一定都有自己的位置。”
        - id: ch01-b17
          speaker: narrator
          text: 农夫布朗听了，发出一阵爽朗的大笑。
        - id: ch01-b18
          speaker: farmer_brown
          text: “妈妈说得对！麻烦就在这儿，它们有时会跑错地方。这个小坏蛋该待在绿森林，不该跑到我们的玉米仓里。”
          emotion: happy
        - id: ch01-b19
          speaker: mrs_brown
          text: “那就把他送回该待的地方！”
        - id: ch01-b20
          speaker: narrator
          text: 布朗太太立刻回了这一句，大家都笑了。
        - id: ch01-b21
          speaker: narrator
          text: 可他们说话的时候，可怜的喋喋一直以为，今天就是自己的末日。他知道自己偷过东西，也知道男孩已经抓住了这个贼。他缩成小小的一团，难受得什么也做不了。每当有人靠近，他就浑身发抖。
        - id: ch01-b22
          speaker: narrator
          text: 喋喋认定，自己再也见不到绿森林和绿草地了。他也再看不见快活的太阳公公，看不见那些自己深爱的美好事物了。一想到这一切，他绝望得心都快要裂开。
