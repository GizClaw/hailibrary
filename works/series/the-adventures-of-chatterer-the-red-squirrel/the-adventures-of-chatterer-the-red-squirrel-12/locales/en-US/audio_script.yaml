audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively woodland storytelling with clear dramatic turns
        timbre: warm and bright
        pace: measured
        pitch: medium
    chatterer:
      display_name: Chatterer
      tts:
        delivery: quick and spirited, turning breathless under pressure
        timbre: small and lively
        pace: fast
        pitch: high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: youthful and playful, with openhearted energy
        timbre: clear and light
        pace: brisk
        pitch: medium-high
    farmer_brown:
      display_name: Farmer Brown
      tts:
        delivery: hearty and plainspoken, with an easy authority
        timbre: full and resonant
        pace: steady
        pitch: low
    mrs_brown:
      display_name: Mrs. Brown
      tts:
        delivery: gentle and compassionate, becoming firm when kindness matters
        timbre: soft and warm
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: No Hope at All
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Chatterer had no hope left. Not even the tiniest ray of it remained in his heart. Farmer Brown's boy picked up the wire rat trap and started toward the house. Black Pussy followed close at his heels, staring up at Chatterer with cruel, hungry eyes.

        - id: ch01-b02
          speaker: narrator
          text: >-
            Chatterer took one last look at the Old Orchard. Beyond it stood the Green Forest, where fear of Shadow the Weasel had driven him away. Then the farmhouse door closed, and the whole outdoor world disappeared.

        - id: ch01-b03
          speaker: narrator
          text: >-
            If Chatterer had carried even one small hope inside, that closing door would have shut it out. But he had none. He was certain Farmer Brown's boy meant to give him to Black Pussy for breakfast.

    - id: ch02
      title: What Will Become of Chatterer?
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Farmer Brown's boy set the trap on a table. From across the room came a great voice. Farmer Brown was eating his breakfast.

        - id: ch02-b02
          speaker: farmer_brown
          text: >-
            What have you got there?

        - id: ch02-b03
          speaker: farmer_browns_boy
          text: >-
            I caught the thief who's been stealing our corn from the crib. Can you guess who it is?

        - id: ch02-b04
          speaker: farmer_brown
          text: >-
            One of those troublesome rats, I suppose. You must have left the door open sometime, and the rats got in that way.

        - id: ch02-b05
          speaker: farmer_browns_boy
          text: >-
            It isn't a rat, and I don't think there are any rats in there. It's that rascal of a red squirrel we've seen racing along the wall by the Old Orchard. I don't know how he got into the corn crib, but I found him there, and now I've got him here.

        - id: ch02-b06
          speaker: narrator
          text: >-
            Farmer Brown came over and looked down at Chatterer.

        - id: ch02-b07
          speaker: farmer_brown
          text: >-
            So what are you going to do with him?

        - id: ch02-b08
          speaker: farmer_browns_boy
          text: >-
            I haven't decided. Maybe I'll give him to Black Puss for breakfast. She's been begging me for him ever since I found him.

        - id: ch02-b09
          speaker: narrator
          text: >-
            As he spoke, Farmer Brown's boy glanced toward the other side of the table. His eyes twinkled with mischief.

        - id: ch02-b10
          speaker: mrs_brown
          text: >-
            Oh, you must not do that! It would be cruel! Take him down to the Green Forest and set him free.

        - id: ch02-b11
          speaker: narrator
          text: >-
            The soft voice belonged to Mrs. Brown. She bent her gentle face over the trap, and her eyes were full of pity.

        - id: ch02-b12
          speaker: mrs_brown
          text: >-
            Look how frightened the poor little creature is. As soon as breakfast is over, you must take him straight to the Green Forest.

        - id: ch02-b13
          speaker: farmer_browns_boy
          text: >-
            That's just like Mother! She'd do the same thing for the ugliest old rat that ever lived. She'd find some reason to let it go.

        - id: ch02-b14
          speaker: mrs_brown
          text: >-
            God made all the little people who wear fur. Every one of them must have a place in his great plan.

        - id: ch02-b15
          speaker: narrator
          text: >-
            Farmer Brown let out a great, hearty laugh.

        - id: ch02-b16
          speaker: farmer_brown
          text: >-
            That's true enough, Mother! The trouble comes when they wander into the wrong place. This little rascal belongs down in the Green Forest, not up in our corn crib.

        - id: ch02-b17
          speaker: mrs_brown
          text: >-
            Then put him back where he belongs!

        - id: ch02-b18
          speaker: narrator
          text: >-
            At that, all three of them laughed.

    - id: ch03
      title: Chatterer's Last Day
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Through all of this, poor Chatterer remained sure that his last day had come. He knew he had stolen the corn. He also knew that Farmer Brown's boy had caught him at it.

        - id: ch03-b02
          speaker: narrator
          text: >-
            Chatterer crouched into a tiny ball. He was too miserable to do anything else, and whenever anyone came close, he trembled.

        - id: ch03-b03
          speaker: narrator
          text: >-
            He believed he would never again see the Green Forest or the Green Meadows. He would never see jolly Mr. Sun or any of the other beautiful things he loved so dearly. Chatterer's despair was so great that it felt as though his heart might burst.
