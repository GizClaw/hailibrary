audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我和海狼·拉森似乎越来越亲近了。不过，这种亲近只是主人和仆役之间的亲近，或者说，是国王和弄臣之间的亲近。我在他眼里不过是一件玩具，价值也就和孩子手里的玩具差不多。只要我还能逗他有趣，日子便过得下去。可他一觉得无聊，或者那股阴沉脾气又发作，我马上就会从大舱餐桌边被赶回厨房。至于还能不能保住性命，能不能四肢完整，那得算我的运气。
        - id: ch01-b02
          speaker: narrator
          text: >-
            我也慢慢懂得了，他其实孤独得可怕。船上每个人不是恨他，就是怕他。他也同样鄙视船上的每一个人。他体内有一股惊人的力量，却从来没有在真正的事业里施展出来。那力量找不到出口，反过来烧灼着他。他就像高傲的路西法，被流放到一群没有灵魂的幽灵中间。
        - id: ch01-b03
          speaker: narrator
          text: >-
            光是孤独已经够糟了，他还背负着整个种族最古老的忧郁。认识他以后，我再看斯堪的纳维亚的古老神话，忽然明白了许多。那些创造出可怕众神的白皮肤、金头发的野蛮人，和拉森有着同样的质地。爱笑的拉丁民族那份轻松快活，他一点也没有。他偶尔发笑，笑里的幽默也总是凶狠的。可他很少笑，更多时候都在忧郁。那忧郁扎进了种族的根，是一代代传下来的遗产。正是它，让这个种族严肃克制、生活清正，对道德近乎狂热。到了英国人那里，这份道德狂热便有了宗教改革后的国教，也有了处处管束人的格兰迪太太。
        - id: ch01-b04
          speaker: narrator
          text: >-
            这种原始忧郁，过去常从最痛苦的宗教信仰里寻找出口。可宗教能给人的慰藉，拉森偏偏得不到。他那粗暴的唯物主义不许他相信。所以阴郁一来，他除了变成恶魔，再没有别的路。要不是他实在太可怕，有些时候，我几乎会同情他。
        - id: ch01-b05
          speaker: narrator
          text: >-
            三天前的早晨，我去他的舱房灌水瓶，无意间看见他双手抱着头，肩膀剧烈抽动，像是在哭。他没有发现我。某种巨大的悲痛仿佛正把他撕开。我悄悄往外退，听见他从喉咙深处呻吟。
        - id: ch01-b06
          speaker: wolf_larsen
          text: >-
            上帝！上帝！上帝！
        - id: ch01-b07
          speaker: narrator
          text: >-
            他不是在向上帝祈求，只是拿这个词咒叹。可那声音确实来自他的灵魂。午饭时，他向猎手们问起治头痛的办法。到了晚上，这个一向强壮的男人已经看不清东西，只能在大舱里摇摇晃晃地走。我扶着他回舱房。
        - id: ch01-b08
          speaker: wolf_larsen
          text: >-
            汉普，我一辈子从没生过病。头也只痛过一次。那回绞盘横木把我的脑袋豁开了六英寸，伤口愈合时才痛过。
        - id: ch01-b09
          speaker: narrator
          text: >-
            这场几乎让他失明的头痛整整持续了三天。他像受伤的野兽那样忍着。在这条船上，人似乎都得这样受苦，不出声，没有谁同情，永远独自承受。
        - id: ch01-b10
          speaker: narrator
          text: >-
            可今天早晨，我进舱替他铺床时，他已经完全好了，还在专心工作。桌上和床铺上堆满图样和计算稿。他一手拿圆规，一手拿角尺，正往一张透明的大纸上誊画某种刻度。
        - id: ch01-b11
          speaker: wolf_larsen
          text: >-
            你好啊，汉普。最后几笔马上就画完了。想看看这东西怎么用吗？
        - id: ch01-b12
          speaker: humphrey
          text: >-
            可它究竟是什么？
        - id: ch01-b13
          speaker: wolf_larsen
          text: >-
            这是给航海人省力的东西。它能把航海术变成幼儿园的功课。从今天起，小孩子也能驾船。再不用做那些没完没了的计算。就算夜里天气坏透，只要天上看得见一颗星，你马上就能知道船在哪里。
        - id: ch01-b14
          speaker: wolf_larsen
          text: >-
            你看，我把透明刻度盘放到星图上，让它绕着北极点转。盘上的等高度圈和方位线，我都已经算好。只要把它对准一颗星，再转到和底下星图的数字重合。变！船只的准确位置就有了！
        - id: ch01-b15
          speaker: narrator
          text: >-
            他的话里满是胜利的喜悦。那双眼睛今天像海一样清澈湛蓝，亮得发光。
        - id: ch01-b16
          speaker: humphrey
          text: >-
            你的数学一定学得很好。你从前在哪所学校念书？
        - id: ch01-b17
          speaker: wolf_larsen
          text: >-
            倒霉就倒霉在，我连学校里面都没见过。所有东西，都是我自己一点点钻研出来的。
        - id: ch01-b18
          speaker: narrator
          text: >-
            他忽然转过来逼问我。
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            你以为我为什么造它？想在时间的沙滩上留下脚印？
        - id: ch01-b20
          speaker: narrator
          text: >-
            他又发出那种可怕的嘲笑。
        - id: ch01-b21
          speaker: wolf_larsen
          text: >-
            才不是。我要给它申请专利，拿它赚钱。以后让别人替我干活，我自己整天过猪一样的舒服日子。这就是我的目的。不过，把它琢磨出来，我也确实很享受。
        - id: ch01-b22
          speaker: humphrey
          text: >-
            那是创造的喜悦。
        - id: ch01-b23
          speaker: wolf_larsen
          text: >-
            大概就该这么叫吧。其实，它还是生命因为自己活着而感到的快乐。运动赢了物质，活物赢了死物。酵母知道自己是酵母，还能蠕动，于是便为自己骄傲。
        - id: ch01-b24
          speaker: narrator
          text: >-
            他的唯物主义实在顽固，我只能无奈地举起双手，转身铺床。他又低下头，继续往透明刻度盘上画线、写数字。这活儿精细得容不得半点误差。看着他把那一身可怕的力量收束起来，服从手下如此细微的动作，我不能不佩服。
        - id: ch01-b25
          speaker: narrator
          text: >-
            铺完床，我才发现自己正入迷地打量他。拉森的确英俊，那是一种彻底属于男人的美。更叫我惊异的是，他脸上找不到凶邪、恶毒或罪孽留下的痕迹。那张脸仿佛属于一个从不作恶的人。
        - id: ch01-b26
          speaker: narrator
          text: >-
            当然，我并不是说他真的没有作恶。我的意思是，他要么从不违背自己良心的命令，要么压根没有良心。我相信是后一种。他像一个雄伟的返祖，是最纯粹的原始人，仿佛出生在人类还没有长出道德天性的时候。他不是不道德，而是根本不知道什么叫道德。
        - id: ch01-b27
          speaker: narrator
          text: >-
            他脸上没有胡须，每一道轮廓都清晰锐利，像刻在浮雕宝石上。海风和日光把他天生白皙的皮肤晒成深古铜色，那颜色带着搏斗和征战的痕迹，让他既更野蛮，也更英俊。他的嘴唇丰满，却像薄唇一样坚定，甚至冷酷。嘴角、下巴和颌骨也同样坚硬，带着雄性的凶猛和不屈。
        - id: ch01-b28
          speaker: narrator
          text: >-
            就连他的鼻子也是如此，那是天生要征服和发号施令的鼻子，略略有一点鹰喙的形状。说它像希腊人的鼻子吧，它稍微厚重了些。说它像罗马人的鼻子吧，它又稍微秀挺了些。整张脸就是凶猛和力量的化身。可折磨他的原始忧郁，又仿佛把嘴角、眼睛和额头的线条都撑开了，让这张脸多了一份原本不会有的宏阔与完整。
        - id: ch01-b29
          speaker: narrator
          text: >-
            我站在那里，久久看着他。这个人已经深深抓住了我的好奇心。他是谁？他到底是怎样一个人？又为什么会变成今天这样？他仿佛拥有所有力量，也拥有所有可能。可为什么到头来，他只是捕海豹纵帆船上一个默默无闻的船长，只在捕海豹的人中留下了残暴可怕的名声？这些疑问一下全涌了出来。
        - id: ch01-b30
          speaker: humphrey
          text: >-
            你有这样的力量，为什么没有在世上成就一番大事业？无论多高的位置，你都能爬上去。你没有良心，也不受道德本能约束，甚至可以征服世界，把它捏成你想要的样子。可你如今就在这里。你的人生已经到了顶峰，接下来只有衰退和死亡。你默默无闻地过着卑污日子，捕杀海兽，只为满足女人爱装饰的虚荣心。你还过着自己所谓的猪猡生活。这一切怎么也称不上壮丽。
        - id: ch01-b31
          speaker: humphrey
          text: >-
            你有那么惊人的力量，为什么什么也没做成？没有东西能拦住你，也根本不可能有人拦住你。到底哪里出了问题？是没有野心，还是你向什么诱惑低了头？究竟怎么回事？究竟怎么回事？
        - id: ch01-b32
          speaker: narrator
          text: >-
            我一开口，他便抬眼望着我，神情始终安然自若。直到我气喘吁吁地说完，惊惶地站在他面前，他才停了一会儿，像是在想该从哪里讲起。
        - id: ch01-b33
          speaker: wolf_larsen
          text: >-
            汉普，你知道撒种人的比喻吗？有些种子落在石头地上，那里的土很浅。它们很快就发了芽，可太阳一出来，幼苗便被晒焦了。因为扎不下根，它们很快枯死。还有些种子落进荆棘里。荆棘长起来，把它们挤住了。
        - id: ch01-b34
          speaker: humphrey
          text: >-
            后来呢？
        - id: ch01-b35
          speaker: wolf_larsen
          text: >-
            后来？哪有什么好后来。我就是那些种子中的一粒。
        - id: ch01-b36
          speaker: narrator
          text: >-
            他的语气带着几分不耐烦。说完又低下头，在刻度盘上继续誊画。我做完了活儿，门都已经拉开，他却再次叫住我。
        - id: ch01-b37
          speaker: wolf_larsen
          text: >-
            汉普，你去看挪威西海岸的地图，会找到一个叫罗姆斯达尔峡湾的凹口。我出生的地方，离那片水域不到一百英里。不过，我不是挪威人，而是丹麦人。我的父母也都是丹麦人。他们为什么会跑到西海岸那个荒寒海湾，我不知道，也从没听谁说过。
        - id: ch01-b38
          speaker: wolf_larsen
          text: >-
            除了这一点，我的身世没有什么神秘。他们很穷，也不识字。往上数一代又一代，都是贫穷而不识字的人。他们是在海上耕作的农民。从有时间以来，他们就照着老习惯，把自己的儿子一粒粒撒进海浪。再没有别的可讲了。
        - id: ch01-b39
          speaker: humphrey
          text: >-
            不，还有。我还是不明白。
        - id: ch01-b40
          speaker: narrator
          text: >-
            他身上那股凶猛又冒了出来。
        - id: ch01-b41
          speaker: wolf_larsen
          text: >-
            你还想听什么？听一个孩子的日子有多贫乏？听我们天天吃鱼，日子过得多粗陋？我刚会爬，就得跟船出海。我的兄弟一个接一个去深海里耕作，从此再也没有回来。至于我，十岁便老成得在本国沿海船上当舱童，却连字也不会读写。
        - id: ch01-b42
          speaker: wolf_larsen
          text: >-
            船上吃得差，挨的打骂更厉害。拳头和脚就是每天的早饭，也是晚上的铺盖。那里的人不用说话，只会动手。我的灵魂只认识恐惧、仇恨和疼痛。我不愿想起那些日子。就算现在回想，一股疯狂也会冲进我的脑子。
        - id: ch01-b43
          speaker: wolf_larsen
          text: >-
            等我长出男人的力气，本来想回去杀掉几个从前的沿海船长，可那时我的命运已经驶向了别处。不久前，我真的回去过。可惜他们全死了，只剩一个。从前他还是大副，等我找到他时已经当了船长。我离开以后，他成了残废，这辈子再也走不了路。
        - id: ch01-b44
          speaker: humphrey
          text: >-
            可你读斯宾塞，也读达尔文，又一天学校都没上过。你究竟怎样学会读写的？
        - id: ch01-b45
          speaker: wolf_larsen
          text: >-
            在英国商船队里学的。十二岁当舱童，十四岁做船上杂役，十六岁成了见习水手，十七岁又当上合格水手。后来，我成了水手舱里的霸王。我有无穷的野心，也有无穷的孤独。没有人帮我，也没人同情我。我只能自己学，航海、数学、科学、文学，什么都学。
        - id: ch01-b46
          speaker: wolf_larsen
          text: >-
            可这些有什么用？照你的话说，我已经到了人生顶峰，却只是一条船的船长兼船主。现在，我就要开始衰退，开始死去。很渺小，是不是？太阳升起来，我被晒焦了。因为没有根，我便枯萎了。
        - id: ch01-b47
          speaker: humphrey
          text: >-
            可历史上也有奴隶登上皇位。
        - id: ch01-b48
          speaker: wolf_larsen
          text: >-
            历史也告诉你，那些奴隶遇到了机会，才登上皇位。人不能创造机会。所谓伟人，不过是在机会来到时认出了它。那个科西嘉人认出来了。我也做过和他一样伟大的梦。机会要是来到面前，我同样认得出来。可它从来没有来过。荆棘长起来，把我挤住了。
        - id: ch01-b49
          speaker: wolf_larsen
          text: >-
            汉普，如今还活在世上的人，除了我的亲兄弟，你比谁都更了解我。
        - id: ch01-b50
          speaker: humphrey
          text: >-
            你兄弟是做什么的？他在哪里？
        - id: ch01-b51
          speaker: wolf_larsen
          text: >-
            他是“马其顿号”蒸汽船的船长，也是捕海豹的。我们多半会在日本沿海碰见他。大家叫他“死神”拉森。
        - id: ch01-b52
          speaker: humphrey
          text: >-
            “死神”拉森！他和你一样吗？
        - id: ch01-b53
          speaker: wolf_larsen
          text: >-
            差得远。他只是一团没脑子的兽肉。他有我全部的……我的……
        - id: ch01-b54
          speaker: humphrey
          text: >-
            你说的是自己的兽性。
        - id: ch01-b55
          speaker: wolf_larsen
          text: >-
            对，多谢你给我这个词。我的兽性，他全都有。可他几乎不会读，也不会写。
        - id: ch01-b56
          speaker: humphrey
          text: >-
            而且，他从不思索人生。
        - id: ch01-b57
          speaker: narrator
          text: >-
            拉森的脸上掠过一种说不清的悲哀。
        - id: ch01-b58
          speaker: wolf_larsen
          text: >-
            不。他不去碰人生，反倒比我快活得多。他只顾着活，根本忙得没工夫去想。我的错误，就是当初竟然打开了那些书。
