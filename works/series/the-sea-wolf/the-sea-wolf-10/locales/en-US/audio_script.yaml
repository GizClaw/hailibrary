audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER X
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Wolf Larsen and I were becoming more intimate, if that word can describe the bond between a master and his man, or better, a king and his jester. To him, I was only a toy, valued as a child values a toy. My purpose was to amuse him. As long as I did, all went well. But if he grew bored, or one of his black moods came over him, he sent me straight from the cabin table back to the galley. Then I was lucky if I escaped alive and unhurt.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Little by little, I began to understand how lonely he was. Every man aboard either hated him or feared him, and he despised every one of them. A tremendous power seemed to burn inside him, but he had never found work large enough to give that power its full expression. He reminded me of Lucifer, proud and fallen, condemned to live among ghosts without souls.
        - id: ch01-b03
          speaker: narrator
          text: >-
            His loneliness was bad enough, but beneath it lay an older sadness shared by his race. Knowing him helped me understand the old Scandinavian myths. The fair-haired northern warriors who imagined those terrible gods must have been made of the same substance as Wolf Larsen. He had none of the easy laughter of the Latin peoples. When he did laugh, his humor was savage. And he rarely laughed, because sadness so often possessed him. It seemed rooted deep in his race. That inheritance had made northern people serious, disciplined, and fiercely moral. Among the English, it had reached its height in the Reformed Church and the severe social judgment represented by Mrs. Grundy.
        - id: ch01-b04
          speaker: narrator
          text: >-
            In fact, religion in its most painful forms had been the chief outlet for that ancient sadness. Whatever its torments, it also offered comfort. Wolf Larsen could receive none of it. His brutal belief in nothing beyond matter would not allow that. So when the darkness settled on him, he had nothing left but cruelty. If he had not been so terrible, I might sometimes have pitied him.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Three mornings earlier, I had entered his stateroom to fill his water bottle and found him unaware of me. His head was buried in his hands. His shoulders shook as though he were sobbing, and some enormous grief seemed to tear at him. I slipped quietly away. Behind me, I heard him groan, “God! God! God!” He was not praying. The word was only an exclamation, but it came from the depths of him.
        - id: ch01-b06
          speaker: narrator
          text: >-
            At dinner, he asked the hunters if they knew a cure for a headache. By evening, powerful as he was, he could barely see and staggered through the cabin. I guided him toward his room.
        - id: ch01-b07
          speaker: wolf_larsen
          text: >-
            Hump, I've never been ill in my life. I've never even had a headache, except when a capstan bar split my head open for six inches and the wound was healing.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The blinding pain lasted three days. He endured it as a wild animal would, making no complaint and asking for no kindness. That seemed to be how everyone suffered aboard the schooner. A man bore his pain without sympathy from anyone else, entirely alone.
        - id: ch01-b09
          speaker: narrator
          text: >-
            But when I entered his stateroom this morning to make the bed and straighten the room, I found him healthy again and deep in work. Drawings and calculations covered both table and bunk. He held a compass and square over a large transparent sheet, carefully copying what looked like some kind of scale.
        - id: ch01-b10
          speaker: wolf_larsen
          text: >-
            Hello, Hump. I'm putting on the very last touches. Would you like to see it work?
        - id: ch01-b11
          speaker: narrator
          text: >-
            What is it?
        - id: ch01-b12
          speaker: wolf_larsen
          text: >-
            It's a device that saves sailors work. I've made navigation simple enough for a child. No more endless calculations. On the dirtiest night, one visible star will tell you exactly where you are. Watch. I lay this clear scale over the star map and turn it around the North Pole. I've drawn the altitude circles and bearing lines onto the scale. I set it on a star, turn it to match the figures beneath it, and there you have it. The ship's exact position.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Triumph rang in his voice. His eyes were as clear blue as the sea that morning, and they shone with excitement.
        - id: ch01-b14
          speaker: narrator
          text: >-
            You must know a great deal of mathematics. Where did you attend school?
        - id: ch01-b15
          speaker: wolf_larsen
          text: >-
            I never once saw the inside of a school, more's the pity. I had to learn it all by myself.
        - id: ch01-b16
          speaker: wolf_larsen
          text: >-
            And why do you suppose I made this? So I can leave my footprints on the sands of time?
        - id: ch01-b17
          speaker: narrator
          text: >-
            He broke into one of his dreadful, mocking laughs.
        - id: ch01-b18
          speaker: wolf_larsen
          text: >-
            Nothing of the kind. I want to patent it, make money from it, and spend my nights wallowing in comfort while other men work. That's the reason. Though I did enjoy solving it.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The joy of creating something.
        - id: ch01-b20
          speaker: wolf_larsen
          text: >-
            I suppose that's the name for it. It's another form of life's joy in being alive. Movement defeats matter. The living defeats the dead. The yeast is proud because it is yeast, and because it crawls.
        - id: ch01-b21
          speaker: narrator
          text: >-
            I raised my hands, helpless before his stubborn materialism, and went on making the bed. He returned to the transparent scale, copying more figures and lines. The work demanded perfect care and precision. I could not help admiring the way he controlled his enormous strength for something so fine and delicate.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Once the bed was finished, I found myself standing still and watching him. He was unquestionably handsome, in a powerful, masculine way. Yet what always astonished me was that his face showed no trace of vice, wickedness, or sin. It looked like the face of a man who did no wrong.
        - id: ch01-b23
          speaker: narrator
          text: >-
            I do not mean that he was innocent. Either he never acted against his conscience, or he had no conscience at all. I believed the second answer. He was a magnificent return to some primitive age, a man born from the time before human beings developed a moral sense. He was not immoral. Morality simply had no place in him.
        - id: ch01-b24
          speaker: narrator
          text: >-
            His clean-shaven face was sharply cut, every line as clear as a carved stone portrait. Sea and sun had darkened his naturally fair skin to bronze. That color spoke of struggle and battle, and made him look both wilder and more beautiful. His lips were full but firm, almost hard. The same hardness showed in his mouth, chin, and jaw, and in the fierce strength of his nose. It was the nose of a man born to conquer and command, with just a hint of an eagle's beak. It was too powerful to be purely Greek and too delicate to be purely Roman.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Fierceness and strength filled the whole face. Yet his ancient sadness deepened the lines around his mouth, eyes, and brow. It gave his face a greatness and completeness it might otherwise have lacked.
        - id: ch01-b26
          speaker: narrator
          text: >-
            So I stood there studying him. I could hardly express how much he interested me. Who was he? What had made him this way? He seemed to possess every power and every possibility. Then why was he nothing more than the unknown master of a seal-hunting schooner, famous only among seal hunters for his horrifying brutality?
        - id: ch01-b27
          speaker: narrator
          text: >-
            At last, my curiosity poured out all at once.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Why haven't you done something great in the world? With your power, you could have risen as high as any man. You have no conscience or moral instinct to hold you back. You might have mastered the world and bent it to your will. Instead, here you are at the height of your life, just as decline and death begin. You live an obscure, ugly existence, killing sea animals to satisfy women's vanity and taste for decoration. You wallow in the very comfort you called piggish, and there is nothing splendid in it.
        - id: ch01-b29
          speaker: narrator
          text: >-
            With all your extraordinary strength, why have you done nothing? Nothing stood in your way. Nothing could have stopped you. Did you have no ambition? Did some temptation defeat you? What went wrong? What was it?
        - id: ch01-b30
          speaker: narrator
          text: >-
            He had looked up as soon as I began. He listened calmly until my breathless outburst ended and I stood before him, almost shocked at myself. He paused, seeming to search for a place to begin.
        - id: ch01-b31
          speaker: wolf_larsen
          text: >-
            Hump, do you know the parable about the man who went out to sow? Some seeds fell on stony ground where there was very little soil. They sprang up quickly because the earth was shallow. But when the sun rose, it scorched them. They had no roots, so they withered. Other seeds fell among thorns, and the thorns grew up and choked them.
        - id: ch01-b32
          speaker: narrator
          text: >-
            And then?
        - id: ch01-b33
          speaker: wolf_larsen
          text: >-
            Then? There was no good ending. I was one of those seeds.
        - id: ch01-b34
          speaker: narrator
          text: >-
            He bent over the scale again and resumed his copying. I finished my work and had opened the door to go when he spoke once more.
        - id: ch01-b35
          speaker: wolf_larsen
          text: >-
            Hump, look at the west coast of Norway on a map. You'll find an inlet there called Romsdal Fiord. I was born within a hundred miles of it. But I wasn't Norwegian. I am Danish. Both my parents were Danes. I don't know how they came to that bleak little curve of land on the western coast. They never told me.
        - id: ch01-b36
          speaker: wolf_larsen
          text: >-
            Beyond that, there is no mystery. They were poor and uneducated, descended from generations of poor, uneducated people. They were peasants of the sea. For as long as anyone could remember, families like ours had scattered their sons across the waves. There is nothing else to tell.
        - id: ch01-b37
          speaker: narrator
          text: >-
            There must be more. I still don't understand.
        - id: ch01-b38
          speaker: narrator
          text: >-
            His old fierceness returned.
        - id: ch01-b39
          speaker: wolf_larsen
          emotion: angry
          text: >-
            What am I supposed to tell you? How little there was in a child's life? We ate fish and lived roughly. I went out in the boats as soon as I could crawl. One by one, my brothers left to farm the deep sea, and none came home. I couldn't read or write. At the ripe old age of ten, I was a cabin boy on ships that worked the old country's coast.
        - id: ch01-b40
          speaker: wolf_larsen
          emotion: angry
          text: >-
            The food was rough, and the treatment was rougher. Kicks and blows were my bed and breakfast. They took the place of words. Fear, hatred, and pain were the only things my soul ever knew. I don't want to remember it. Even now, thinking about it brings madness into my head.
        - id: ch01-b41
          speaker: wolf_larsen
          emotion: angry
          text: >-
            When I grew strong, there were coastal captains I would have gone back and killed. But by then, my life had carried me elsewhere. I did return not long ago. Unfortunately, the captains were all dead except one. He had been a mate in the old days and was a captain when I found him. When I left him, he was a cripple who would never walk again.
        - id: ch01-b42
          speaker: narrator
          text: >-
            But you read Spencer and Darwin, and you never entered a school. How did you learn to read and write?
        - id: ch01-b43
          speaker: wolf_larsen
          text: >-
            In the English merchant service. I was a cabin boy at twelve, a ship's boy at fourteen, an ordinary seaman at sixteen, and an able seaman at seventeen. Then I became the strongest man in the forecastle. I had endless ambition and endless loneliness. No one helped me. No one cared. I taught myself everything, navigation, mathematics, science, literature, and the rest.
        - id: ch01-b44
          speaker: wolf_larsen
          text: >-
            And what good did it do me? Now I'm master and owner of a ship, at the top of my life, as you put it, just when I have begun to decline and die. A poor result, isn't it? The sun rose and scorched me. I had no roots, so I withered.
        - id: ch01-b45
          speaker: narrator
          text: >-
            History is full of slaves who rose to wear the imperial purple.
        - id: ch01-b46
          speaker: wolf_larsen
          text: >-
            And history tells us those slaves were given opportunities. No man creates an opportunity. Great men simply recognize one when it comes. The Corsican recognized his. I dreamed as greatly as Napoleon ever did, and I would have recognized my chance too. But it never came. The thorns grew up and choked me.
        - id: ch01-b47
          speaker: wolf_larsen
          text: >-
            Hump, you now know more about me than any living man except my own brother.
        - id: ch01-b48
          speaker: narrator
          text: >-
            What does your brother do? Where is he?
        - id: ch01-b49
          speaker: wolf_larsen
          text: >-
            He captains the steamship Macedonia and hunts seals. We'll probably meet him off the coast of Japan. Men call him “Death” Larsen.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Death Larsen! Is he anything like you?
        - id: ch01-b51
          speaker: wolf_larsen
          text: >-
            Not much. He's a great lump of an animal with no mind. He has all my... my...
        - id: ch01-b52
          speaker: narrator
          text: >-
            Your brutishness?
        - id: ch01-b53
          speaker: wolf_larsen
          text: >-
            Yes. Thank you, that's the word. He has all my brutishness, but he can barely read or write.
        - id: ch01-b54
          speaker: narrator
          text: >-
            And he has never tried to reason out the meaning of life.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Wolf Larsen answered with a sadness I could not describe.
        - id: ch01-b56
          speaker: wolf_larsen
          emotion: sad
          text: >-
            No. And he's happier because he leaves life alone. He's too busy living to stop and think about it. My mistake was opening the books at all.
