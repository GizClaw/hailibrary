audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
  chapters:
    - id: ch01
      title: CHAPTER XXXI
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            It will smell, I told Maud, but it will keep the warmth in and the rain and snow outside. We stood together, looking over the finished sealskin roof.
        - id: ch01-b02
          speaker: narrator
          text: >-
            It may look clumsy, but it will do its job. That's what matters.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I was longing to hear her praise it. Maud clapped her hands and said she was delighted.
        - id: ch01-b04
          speaker: maud_brewster
          text: >-
            It is awfully dark in here, though.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Her shoulders drew in with a small, sudden shiver.
        - id: ch01-b06
          speaker: narrator
          text: >-
            You could have mentioned a window while I was putting up the walls. I built the place for you. You should have noticed that it needed one.
        - id: ch01-b07
          speaker: maud_brewster
          text: >-
            But you know I never notice the obvious. Besides, you can always knock a hole through the wall.
        - id: ch01-b08
          speaker: narrator
          text: >-
            She laughed as she said it.
        - id: ch01-b09
          speaker: narrator
          text: >-
            True enough. That never occurred to me. But did you remember to order the glass? Just telephone the company. I think the number is Red, four-four-five-one. Tell them the size and kind you want.
        - id: ch01-b10
          speaker: maud_brewster
          text: >-
            So that means...
        - id: ch01-b11
          speaker: narrator
          text: >-
            No window.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The hut was dark and ugly. In the civilized world, it would not have been fit for anything better than pigs. But we remembered the misery of the open boat, and to us it felt snug. We warmed it with a seal-oil lamp whose wick was made from cotton caulking.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Then we turned to the two jobs still ahead of us. We had to hunt enough meat for the winter, and we had to build a second hut. Hunting had become simple. We could leave in the morning and come back by noon with a boatload of seals. While I worked on the new hut, Maud melted oil from the blubber and kept a low fire burning beneath the racks of meat. I had heard of beef being dried on the plains. We sliced our seal meat into thin strips, hung it in the smoke, and it cured very well.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The second hut went up more easily. I built it against the first one, so it needed only three walls. Even so, every part of the work was hard. Maud and I labored from dawn until dark and pushed ourselves as far as our strength would carry us. At night we crawled stiffly into bed and slept with the deep, mindless sleep of exhausted animals.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Yet Maud said she had never felt healthier or stronger. I could say the same for myself, but her strength seemed as delicate as a lily, and I was afraid it would fail her. Again and again, when she had used up her last reserve, I saw her lie flat on her back in the sand. That was how she rested and gathered herself. Then she would rise and work as hard as before. I could not understand where all that strength came from.
        - id: ch01-b16
          speaker: maud_brewster
          text: >-
            Just think how long we'll be resting this winter. Why, we'll be begging for something to do.
        - id: ch01-b17
          speaker: narrator
          text: >-
            That was how she answered whenever I protested that she was working too hard.
        - id: ch01-b18
          speaker: narrator
          text: >-
            On the night I finished roofing my hut, we held another housewarming. A fierce storm had been raging for three days. It had swept around from southeast to northwest and was now blowing straight at us. The surf thundered on the beaches of the outer cove. Even our sheltered inner cove had waves breaking across it.
        - id: ch01-b19
          speaker: narrator
          text: >-
            There was no high ridge on the island to shield us. The wind whistled and roared around the hut until I sometimes feared the walls would give way. I had stretched the skin roof as tight as a drumhead, or so I thought. With every gust, it sagged and swelled. The wind also found countless little gaps in the walls where the moss had not been packed as tightly as Maud believed. Still, the seal-oil lamp burned brightly, and inside we were warm and comfortable.
        - id: ch01-b20
          speaker: narrator
          text: >-
            It was a truly pleasant evening. We agreed that Endeavour Island had never seen a finer social occasion. More important, our minds were easy. We had accepted that a bitter winter was coming, and we were ready for it. The seals could begin their mysterious journey south whenever they pleased. The storms no longer frightened us.
        - id: ch01-b21
          speaker: narrator
          text: >-
            We knew we would be dry and warm, with shelter from the wind. We even had wonderfully soft mattresses made of moss. The mattresses were Maud's idea, and she had guarded the task of gathering every bit of moss herself. This would be my first night sleeping on mine. I knew I would sleep more sweetly because she had made it.
        - id: ch01-b22
          speaker: narrator
          text: >-
            When Maud rose to leave, she turned to me with that whimsical look of hers.
        - id: ch01-b23
          speaker: maud_brewster
          text: >-
            Something is going to happen. In fact, I think it is happening already. I can feel it. Something is coming here, straight toward us. I don't know what it is, but it is coming.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Will it be something good or something bad?
        - id: ch01-b25
          speaker: narrator
          text: >-
            She shook her head.
        - id: ch01-b26
          speaker: maud_brewster
          text: >-
            I don't know. But it is out there somewhere.
        - id: ch01-b27
          speaker: narrator
          text: >-
            She pointed toward the sea and the wind.
        - id: ch01-b28
          speaker: narrator
          text: >-
            I laughed and reminded her that ours was the dangerous shore the wind was blowing toward. On a night like this, I would much rather be safely here than trying to arrive.
        - id: ch01-b29
          speaker: narrator
          text: >-
            You're not frightened, are you?
        - id: ch01-b30
          speaker: narrator
          text: >-
            Her eyes met mine bravely.
        - id: ch01-b31
          speaker: narrator
          text: >-
            And you feel well? Completely well?
        - id: ch01-b32
          speaker: maud_brewster
          text: >-
            I've never felt better.
        - id: ch01-b33
          speaker: narrator
          text: >-
            We talked a little longer before she left.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Good night, Maud.
        - id: ch01-b35
          speaker: maud_brewster
          text: >-
            Good night, Humphrey.
        - id: ch01-b36
          speaker: narrator
          text: >-
            We had begun using each other's given names without planning it. It had happened as naturally as anything could. At that moment, I could have put my arms around her and drawn her close. In the world we had come from, I certainly would have done it. But here, things could go no further, and that was the only possible ending to the moment.
        - id: ch01-b37
          speaker: narrator
          text: >-
            I was left alone in my little hut, glowing through and through with a warm happiness. I knew that an unspoken bond had grown between us, one that had not been there before.
