audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十一章
      blocks:
        - id: ch01-b01
          speaker: humphrey
          text: 海豹皮会有些味道，不过它能保住屋里的热气，也能挡雨挡雪。
        - id: ch01-b02
          speaker: narrator
          text: 我们站在那里，一起端详刚铺好的海豹皮屋顶。我盼着莫德夸我几句，便又开了口。
        - id: ch01-b03
          speaker: humphrey
          text: 样子是笨了点，可它管用。最要紧的就是这个。
        - id: ch01-b04
          speaker: narrator
          text: 莫德拍起手来，说她简直满意极了。可刚过片刻，她便不由得缩了缩肩膀，轻轻打了个寒战。
        - id: ch01-b05
          speaker: maud_brewster
          text: 只是这里面太暗了。
        - id: ch01-b06
          speaker: humphrey
          text: 当初砌墙，你就该提醒我留扇窗。这屋子是给你住的，你应该想到呀。
        - id: ch01-b07
          speaker: maud_brewster
          text: 你知道的，明摆着的事情，我偏偏总看不见。再说了，哪天想开窗，在墙上凿个洞不就行了？
        - id: ch01-b08
          speaker: narrator
          text: 她笑着说完，我故作高明地点了点头。
        - id: ch01-b09
          speaker: humphrey
          text: 说得对，我怎么没想到。不过窗玻璃你订了吗？快给商行打电话吧，号码好像是“红字4451”。你要多大、哪一种，告诉他们就行。
        - id: ch01-b10
          speaker: maud_brewster
          text: 你的意思是，我们根本没有玻璃，是吗——
        - id: ch01-b11
          speaker: humphrey
          text: 没有窗子。
        - id: ch01-b12
          speaker: narrator
          text: >-
            那间小屋又黑又难看。要是在文明世界，除了养猪，只怕没有别的用处。可我们在敞篷小艇里吃尽了苦头，如今看它，却觉得是个安稳暖和的小家。我们用海豹油生火，又拿棉絮一样的填缝料做灯芯，就算是庆祝过乔迁了。接下来，该预备过冬的肉，也该搭第二间小屋。
        - id: ch01-b13
          speaker: narrator
          text: >-
            这时出去打猎已经很容易。早晨动身，中午就能带回满满一船海豹。我盖屋子，莫德从海豹脂肪里炼油，还在挂肉的架子下面守着小火。平原上的人能风干牛肉，我们也把海豹肉切成薄条，挂到烟里去熏，腌出来的肉好极了。
        - id: ch01-b14
          speaker: narrator
          text: >-
            第二间屋子靠着第一间搭，只需要三面墙，盖起来轻松了一些。可再怎么说，那也全是苦活。我们每天从天亮干到天黑，一直干到力气耗尽。夜里，两个浑身僵硬的人爬上床，像累坏的动物一样沉沉睡去。莫德却说，她这辈子从没这样健康，也从没这样强壮过。
        - id: ch01-b15
          speaker: narrator
          text: >-
            我自己也有同样的感觉，但莫德的力气就像百合那样纤弱，我总担心她会倒下。她常常把最后一点力气也用光，仰面躺平在沙地上。那是她休息和恢复精神的办法。歇过以后，她又会站起来，照旧拼命干活。她到底从哪里找来这么多力量，我怎么也想不明白。
        - id: ch01-b16
          speaker: maud_brewster
          text: 想想吧，整个冬天都能好好休息。到那时候，我们准会嚷着没事可做呢。
        - id: ch01-b17
          speaker: narrator
          text: >-
            每当我劝她别累坏自己，她总这样回答。后来，我的小屋也铺好了屋顶，我们就在里面庆祝乔迁。那晚，一场猛暴的风雪已经刮到第三天。风向从东南一路转到西北，正对着我们扑过来。外湾的浪轰击着海滩，连四面受陆地保护的内湾，也翻起了像样的波涛。
        - id: ch01-b18
          speaker: narrator
          text: >-
            岛上没有高高的山脊替我们挡风。狂风绕着小屋又吹又吼，有几次，我真怕墙壁撑不住。海豹皮屋顶明明已经绷得像鼓面，每阵风打来，它还是一会儿陷下去，一会儿鼓起来。墙上到处透风，莫德塞进去的苔藓，原来没有她以为的那么严密。不过，海豹油灯烧得明亮，屋里又暖又舒服。
        - id: ch01-b19
          speaker: narrator
          text: >-
            那真是个愉快的晚上。我们一致同意，奋进岛上举办过的社交盛会，没有哪一场比得上它。我们的心终于安稳了。我们不只接受了要在这里过严冬的命运，也已经做好了准备。海豹要去南方作它们神秘的旅行，随时都可以走。我们不在乎。风暴也不再可怕。
        - id: ch01-b20
          speaker: narrator
          text: >-
            我们有地方遮风，能住得温暖干燥，还睡得上最柔软、最舒服的苔藓床垫。这是莫德想出来的，苔藓也全由她亲手收集，不肯让我插手。那一晚，我头一回要睡上这张床垫。我知道，那是她为我做的，所以这一觉一定会格外香甜。
        - id: ch01-b21
          speaker: narrator
          text: 莫德站起身，准备回自己的小屋。她转过来，脸上又露出了那种俏皮的神情。
        - id: ch01-b22
          speaker: maud_brewster
          text: >-
            有什么事快要发生了。不，也许它正在发生。我能感觉到。有个东西正朝这里来，朝我们来。它已经在路上了。我不知道那是什么，可它正在靠近。
        - id: ch01-b23
          speaker: humphrey
          text: 是好事，还是坏事？
        - id: ch01-b24
          speaker: narrator
          text: 莫德摇摇头。
        - id: ch01-b25
          speaker: maud_brewster
          text: 我不知道。可它就在那边，就在某个地方。
        - id: ch01-b26
          speaker: narrator
          text: 她抬手指向海面，指向风吹来的地方。我笑了。
        - id: ch01-b27
          speaker: humphrey
          text: 这里是下风岸。碰上这样的夜晚，我宁可已经待在岸上，也不想正往这里赶。
        - id: ch01-b28
          speaker: narrator
          text: 我走到门边替她开门，又有些放心不下。
        - id: ch01-b29
          speaker: humphrey
          text: 你没有害怕吧？身体呢？真的一点儿也不难受？
        - id: ch01-b30
          speaker: narrator
          text: 她勇敢地直视着我。
        - id: ch01-b31
          speaker: maud_brewster
          text: 我从没这样好过。
        - id: ch01-b32
          speaker: narrator
          text: 她没有立刻离开，我们又谈了一会儿。终于，该道别了。
        - id: ch01-b33
          speaker: humphrey
          text: 晚安，莫德。
        - id: ch01-b34
          speaker: maud_brewster
          text: 晚安，汉弗莱。
        - id: ch01-b35
          speaker: narrator
          text: >-
            我们竟然就这样叫起了彼此的名字。谁也没有刻意安排，一切都来得那么自然。就在那一刻，我本可以伸手抱住她，把她拉进怀里。要是在我们原来所属的世界，我一定已经那样做了。可在这里，事情只能停住，也只能用这样的方式停住。
        - id: ch01-b36
          speaker: narrator
          text: >-
            莫德走了，我独自留在小屋里。那份甜美的满足从心里透出来，让我全身都暖了。我知道，我们之间已经多了一道从前没有的牵系。又或者，那是一份谁也没有说出口，彼此却都明白的情意。
