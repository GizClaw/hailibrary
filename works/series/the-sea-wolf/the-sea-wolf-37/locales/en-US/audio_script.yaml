audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding and sardonic, with cold intellectual precision
        timbre: deep, powerful, and rough-edged
        pace: deliberate with sudden force
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER XXXVII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            We moved aboard the Ghost at once. We slept in our old state-rooms and cooked in the galley. Wolf Larsen's imprisonment had come just in time. The last mild spell of the season was gone, and cold, drizzling storms had begun. We were comfortable on the schooner, and even our undersized shears looked purposeful with the foremast hanging from them. They seemed to promise that we would leave the island.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Yet once Wolf Larsen was in irons, we hardly needed them. His second attack, like the first, had left him badly disabled. That afternoon Maud tried to feed him. He showed signs of consciousness but did not answer her. He lay on his left side in obvious pain. Then he shifted his head and freed his left ear from the pillow. At once he heard her and replied. Maud came straight to me.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I pressed the pillow over his left ear and asked whether he could hear me. He gave no response. When I took the pillow away and asked again, he answered immediately.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Do you know you've gone deaf in your right ear?
        - id: ch01-b05
          speaker: wolf_larsen
          text: >-
            Yes. And it's worse than that. My whole right side feels asleep. I can't move my arm or my leg.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Are you pretending again?
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: >-
            He shook his head. His hard mouth formed the strangest crooked smile. Only the left side moved. The muscles on the right did nothing.
        - id: ch01-b08
          speaker: wolf_larsen
          text: >-
            That was the Wolf's last play. I'm paralyzed. I'll never walk again. Well, the left side still works.
        - id: ch01-b09
          speaker: narrator
          text: >-
            He had noticed my suspicious glance at his left leg just as its knee rose beneath the blankets.
        - id: ch01-b10
          speaker: wolf_larsen
          text: >-
            It's a shame. I wanted to finish you first, Hump. I thought I still had enough left in me for that.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Why?
        - id: ch01-b12
          speaker: narrator
          text: >-
            Horror and curiosity pulled the question out of me. His mouth made that twisted smile again.
        - id: ch01-b13
          speaker: wolf_larsen
          text: >-
            Just to be alive. To keep living and doing. To remain the biggest piece of the ferment right to the end, and to eat you. But instead I have to die this way.
        - id: ch01-b14
          speaker: narrator
          text: >-
            He tried to shrug, but only his left shoulder rose. The shrug was as crooked as his smile.
        - id: ch01-b15
          speaker: narrator
          text: >-
            What do you think caused it? Where is the trouble?
        - id: ch01-b16
          speaker: wolf_larsen
          text: >-
            In my brain. Those cursed headaches brought this on.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The headaches were symptoms, not the cause.
        - id: ch01-b18
          speaker: narrator
          text: >-
            He nodded.
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            There's no way to explain it. I was never ill in my life. Something has gone wrong in my brain. A cancer, a tumor, something like that. It eats and destroys. From the pain, I'd say it's attacking my nerve centers, bit by bit, cell by cell.
        - id: ch01-b20
          speaker: narrator
          text: >-
            And the parts that control movement too, it seems.
        - id: ch01-b21
          speaker: wolf_larsen
          text: >-
            It does. And the curse is that I must lie here with my mind untouched. I know the lines are going down one after another, cutting my connection with the world. I can't see. My hearing and feeling are leaving me. Soon I may lose speech. Yet I'll still be here, alive and active inside, but powerless.
        - id: ch01-b22
          speaker: narrator
          text: >-
            When you say that you are still here, it sounds as though a soul may exist after all.
        - id: ch01-b23
          speaker: wolf_larsen
          text: >-
            Nonsense! It only means the attack hasn't reached the higher parts of my brain. I can remember. I can think and reason. When those go, I go. Then I am nothing. A soul?
        - id: ch01-b24
          speaker: narrator
          text: >-
            He burst into mocking laughter. Then he turned his left ear into the pillow to show that the conversation was over.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Maud and I returned to our work under the weight of his terrible fate. Even then, we did not understand how much worse it would become. There was something awful in the way punishment had overtaken him. It seemed that all his violent strength had brought him to this end. Our thoughts grew deep and grave, and when we spoke, we scarcely rose above a whisper.
        - id: ch01-b26
          speaker: narrator
          text: >-
            That night we stood beside him, discussing what to do.
        - id: ch01-b27
          speaker: wolf_larsen
          text: >-
            You can take off the handcuffs. It's perfectly safe. I'm a paralytic now. Bedsores are the next thing you'll need to watch for.
        - id: ch01-b28
          speaker: narrator
          text: >-
            His crooked smile returned. Maud stared in horror and had to turn her head away.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Do you know your smile is crooked?
        - id: ch01-b30
          speaker: narrator
          text: >-
            Maud would have to care for him, and I wanted to spare her that sight whenever I could.
        - id: ch01-b31
          speaker: wolf_larsen
          text: >-
            Then I won't smile anymore. I knew something was wrong. My right cheek has been numb all day. And I've had warnings for three days. At times my right side would fall asleep. Sometimes it was my arm or hand, sometimes my leg or foot.
          emotion: calm
        - id: ch01-b32
          speaker: wolf_larsen
          text: >-
            So the smile is crooked? From now on, imagine that I smile inside, with my soul, if you like. My soul. Imagine I'm smiling now.
        - id: ch01-b33
          speaker: narrator
          text: >-
            For several minutes he lay quietly, amusing himself with that grotesque thought.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The man inside had not changed. This was still the old, unconquered and terrible Wolf Larsen. But now he was imprisoned in the flesh that had once been so powerful and magnificent. His body had become a senseless set of chains. It walled him into darkness and silence, cutting him off from a world that had always been a riot of action. He could no longer live through every form of the verb “to do.” Only “to be” remained. To be, as he had once defined death, without movement. He could will but never carry out his will. He could think and reason and remain as fiercely alive in spirit as ever, while his body lay quite dead.
        - id: ch01-b35
          speaker: narrator
          text: >-
            I removed the handcuffs, but we still could not make ourselves accept his helplessness. Our minds rebelled against it. To us, he remained full of dangerous possibility. We never knew what to expect next, or what terrible act his will might somehow force from his ruined body. We had seen too much of what he could do to dismiss that fear. So even while he lay unable to move, we went about our work with anxiety always beside us.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Meanwhile, I had found an answer to the problem of our short shears. Using a new watch-tackle, I hauled the bottom of the foremast over the rail and lowered it onto the deck. Then the shears lifted the forty-foot main boom aboard. That boom would give me enough height to swing the mast properly.
        - id: ch01-b37
          speaker: narrator
          text: >-
            A second tackle attached to the shears raised the boom until it stood almost upright. I lowered its base to the deck and spiked heavy cleats all around it so it could not slip. Then I fastened the single block from my original shears-tackle to the boom's upper end. By leading that tackle to the windlass, I could raise or lower the end whenever I wished while the base stayed fixed. Guy ropes let me swing the boom from side to side. I rigged one more hoisting tackle at the end. When the whole arrangement was finished, the power it gave me, and the wide area it could reach, startled me.
        - id: ch01-b38
          speaker: narrator
          text: >-
            That part of the work took two days. On the third morning I lifted the foremast from the deck and began shaping its base to fit the step. I was clumsy with the job. I sawed, chopped, and chiseled the weathered wood until it looked as if a giant mouse had gnawed it. Still, it fitted.
        - id: ch01-b39
          speaker: narrator
          text: >-
            It will work. I know it will!
          emotion: happy
        - id: ch01-b40
          speaker: maud_brewster
          text: >-
            Do you know Dr. Jordan's final test for whether something is true?
        - id: ch01-b41
          speaker: narrator
          text: >-
            I shook my head. I had stopped trying to pull the wood shavings from inside my clothes.
        - id: ch01-b42
          speaker: maud_brewster
          text: >-
            The test is whether we can make it work and trust our lives to it.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Dr. Jordan is one of your favorites.
        - id: ch01-b44
          speaker: maud_brewster
          text: >-
            When I cleared out my old hall of heroes and threw away Napoleon, Caesar, and the rest, I built a new one. Dr. Jordan was the first person I put in it.
        - id: ch01-b45
          speaker: narrator
          text: >-
            A modern hero.
        - id: ch01-b46
          speaker: maud_brewster
          text: >-
            And greater because he is modern. How can the heroes of the old world compare with ours?
        - id: ch01-b47
          speaker: narrator
          text: >-
            I shook my head. We saw too many things alike to argue about them.
        - id: ch01-b48
          speaker: narrator
          text: >-
            For two critics, we agree remarkably well.
          emotion: happy
        - id: ch01-b49
          speaker: maud_brewster
          text: >-
            And we make a good shipwright and assistant too.
          emotion: happy
        - id: ch01-b50
          speaker: narrator
          text: >-
            She laughed with me, but there was little laughter in those days. The work was hard, and Wolf Larsen's living death hung over us.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Another stroke came. Wolf Larsen's voice began to fail. He still had it from time to time, but never steadily. As he put it, the wires behaved like the stock market. Sometimes they were up, and he could speak as well as ever, though his words came slowly and heavily. Then the wires went down. His voice might desert him halfway through a sentence. For hours afterward, we would wait for the connection to return.
        - id: ch01-b52
          speaker: narrator
          text: >-
            His head hurt terribly. During that time he prepared a way to answer us after speech left him for good. One squeeze of the hand meant yes, and two meant no. By evening, his voice was gone. From then on he answered questions with those pressures. When he had more to say, he wrote it clearly with his left hand.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Winter came down on us in full force. One gale followed another, carrying snow, sleet, and rain. The seals began their great journey south, and soon the rookery was almost deserted. I worked feverishly. The weather was miserable, and the wind made every task harder. Still, from the first daylight until darkness, I stayed on deck. In spite of everything, the work moved steadily forward.
        - id: ch01-b54
          speaker: narrator
          text: >-
            I had learned from raising the shears first and then climbing them to attach the guy ropes. This time, while the foremast hung conveniently above the deck, I fixed its rigging to the top. I attached the stays and the halyards for the throat and peak. Again I had guessed too little work. That part alone took two long days, and the sails still had to be almost completely remade.
        - id: ch01-b55
          speaker: narrator
          text: >-
            While I rigged the mast, Maud worked on the sails. The canvas was heavy and stiff, and she drove the three-sided sail needle through it with a proper sailor's palm. She was always ready to drop everything and help whenever a job needed more than my two hands. Before long her hands were badly blistered, but she struggled bravely on. Besides all that sewing, she cooked for us and cared for the sick man below.
        - id: ch01-b56
          speaker: narrator
          text: >-
            On Friday morning, I dismissed the old superstition about the day.
        - id: ch01-b57
          speaker: narrator
          text: >-
            That mast is going in today.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Everything was ready. I carried the boom-tackle to the windlass and hoisted the mast until it was almost clear of the deck. After securing that tackle, I brought the shears-tackle to the windlass. A few turns lifted the mast upright and free.
        - id: ch01-b59
          speaker: narrator
          text: >-
            The moment Maud no longer had to hold the turn, she clapped her hands.
        - id: ch01-b60
          speaker: maud_brewster
          text: >-
            It works! It really works! We can trust our lives to it!
          emotion: happy
        - id: ch01-b61
          speaker: narrator
          text: >-
            Then her face fell.
        - id: ch01-b62
          speaker: maud_brewster
          text: >-
            But it isn't over the hole. Do we have to start again?
        - id: ch01-b63
          speaker: narrator
          text: >-
            I gave her a knowing smile. I loosened one of the boom's guy ropes and tightened the other. The mast swung perfectly into the center of the deck, but it still was not above the hole. Maud's worried look returned, and once more I smiled as if I understood everything. I eased out some line on the boom-tackle and hauled in the same amount on the shears-tackle. The bottom of the mast moved into position directly over the opening in the deck.
        - id: ch01-b64
          speaker: narrator
          text: >-
            I carefully explained to Maud how to lower it. Then I climbed into the hold and went to the step at the schooner's bottom. At my call, the mast descended smoothly and accurately. Its square base came toward the square opening, but slowly twisted as it fell. The two squares would not line up.
        - id: ch01-b65
          speaker: narrator
          text: >-
            I told Maud to stop lowering and hurried back on deck. There I fastened the watch-tackle to the mast with a rolling hitch. I left Maud pulling on it while I returned to the hold. By the lantern's light, I watched the square base turn slowly around. At last its sides lined up with the sides of the step. Maud secured the tackle and returned to the windlass.
        - id: ch01-b66
          speaker: narrator
          text: >-
            The mast came down through the last few inches and began to twist again. Once more Maud corrected it with the watch-tackle. Once more she lowered from the windlass. This time square entered square. The mast was stepped.
        - id: ch01-b67
          speaker: narrator
          text: >-
            I shouted in triumph, and Maud ran down to see. In the yellow lantern light we bent close and stared at what we had accomplished. Then we looked at each other. Our hands felt their way through the dimness until they met and clasped. I think there were tears in both our eyes. We had worked so long toward this moment, and now the mast truly stood where it belonged.
        - id: ch01-b68
          speaker: narrator
          text: >-
            After all that, the final part was easy. All the real work was in getting ready.
        - id: ch01-b69
          speaker: maud_brewster
          text: >-
            And all the wonder is in seeing it finished. I can hardly believe that great mast is truly standing in its place. You lifted it from the water, swung it through the air, and set it exactly where it belongs. It was a task for a Titan.
        - id: ch01-b70
          speaker: narrator
          text: >-
            And they made themselves many inventions—
        - id: ch01-b71
          speaker: narrator
          text: >-
            I broke off and sniffed the air. The lantern was not smoking, but the smell remained.
        - id: ch01-b72
          speaker: maud_brewster
          text: >-
            Something is burning.
          emotion: surprised
        - id: ch01-b73
          speaker: narrator
          text: >-
            We rushed for the ladder together. I passed her and reached the deck first. Thick smoke poured from the steerage companionway.
        - id: ch01-b74
          speaker: narrator
          text: >-
            The Wolf isn't dead yet.
        - id: ch01-b75
          speaker: narrator
          text: >-
            I muttered it to myself and plunged into the smoke. The air in that narrow space was so thick that I had to feel my way. Wolf Larsen's hold on my imagination was still so strong that I fully expected the helpless giant to seize my neck and crush it. I hesitated there in the darkness and smoke. The urge to turn, race up the steps, and escape to the deck nearly overpowered me.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Then I remembered Maud as I had last seen her in the lantern light below, her brown eyes warm and wet with happiness. The picture flashed before me, and I knew I could not turn back. By the time I reached Wolf Larsen's bunk, I was choking and gasping. I reached through the smoke until I found his hand. He lay motionless, though he shifted slightly at my touch. I searched over the blankets and underneath them. I found no warmth and no trace of fire.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Yet the blinding smoke had to come from somewhere. For a moment I panicked and rushed around the steerage. I struck the table hard enough to knock the breath from me, and the shock cleared my head. A helpless man could only have started a fire close to his bed.
        - id: ch01-b78
          speaker: narrator
          text: >-
            I went back and found Maud there. I had no idea how long she had been breathing that smoke.
        - id: ch01-b79
          speaker: narrator
          text: >-
            Go up on deck!
          emotion: fearful
        - id: ch01-b80
          speaker: maud_brewster
          text: >-
            But, Humphrey—
        - id: ch01-b81
          speaker: narrator
          text: >-
            Please! Please!
          emotion: fearful
        - id: ch01-b82
          speaker: narrator
          text: >-
            I shouted so harshly that she obeyed. Then a new fear struck me. What if she could not find the steps? I followed and stopped at the bottom of the companionway, unsure whether she had gone up. Her faint cry came through the smoke.
        - id: ch01-b83
          speaker: maud_brewster
          text: >-
            Oh, Humphrey, I'm lost.
          emotion: fearful
        - id: ch01-b84
          speaker: narrator
          text: >-
            I found her feeling along the rear wall. Half leading and half carrying her, I got her up the companionway. The clean air tasted wonderful. Maud was only faint and dizzy. I left her lying on deck and went below again.
        - id: ch01-b85
          speaker: narrator
          text: >-
            This time I went straight to Wolf Larsen's bunk. The fire had to be very close to him. As I felt among the blankets, something hot fell onto the back of my hand. It burned me, and I jerked away. Then I understood. Through the cracks in the bottom of the upper bunk, he had set fire to its mattress. He still had enough use of his left arm to manage it. The damp straw had been burning from below, starved of air, and smoldering all that time.
        - id: ch01-b86
          speaker: narrator
          text: >-
            I dragged the mattress out of the bunk. It seemed to break apart in midair, and at that same instant it burst into flames. I beat out the burning scraps of straw that remained in the bunk, then dashed to the deck for fresh air. A few buckets of water were enough to put out the blazing mattress in the middle of the steerage floor. Ten minutes later, the smoke had cleared enough for me to allow Maud below again.
        - id: ch01-b87
          speaker: narrator
          text: >-
            Wolf Larsen was unconscious, but fresh air revived him within minutes. As we worked over him, he signaled for paper and pencil.
        - id: ch01-b88
          speaker: wolf_larsen
          text: >-
            Please don't interrupt me. I'm smiling.
        - id: ch01-b89
          speaker: narrator
          text: >-
            He wrote again a little later.
        - id: ch01-b90
          speaker: wolf_larsen
          text: >-
            You see, I'm still a piece of the ferment.
        - id: ch01-b91
          speaker: narrator
          text: >-
            I'm glad the piece has become so small.
        - id: ch01-b92
          speaker: wolf_larsen
          text: >-
            Thank you. But think how much smaller it will become before I die.
        - id: ch01-b93
          speaker: narrator
          text: >-
            With one last flourish, he wrote again.
        - id: ch01-b94
          speaker: wolf_larsen
          text: >-
            And yet I'm all here, Hump. My thoughts are clearer than they've ever been. Nothing can disturb me now. My concentration is perfect. I'm all here, and more than here.
        - id: ch01-b95
          speaker: narrator
          text: >-
            It felt like a message sent from the darkness of the grave. This man's body had become his own tomb. Inside that strange burial place, his spirit still fluttered and lived. It would continue to flutter and live until the last line connecting it to the world was broken. And after that final break, who could say how much longer it might remain alive inside?
