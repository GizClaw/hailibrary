audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 被困在肉体里的狼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我们马上搬回“幽灵号”，住进原来的舱房，在厨房里做饭。高纬度海域短暂的小阳春已经过去，外面风雨绵绵，船上倒很舒服。前桅吊在人字架上，虽说架子矮了些，甲板却终于显出忙碌而正经的开工气象，也让人觉得离航有望。偏偏就在海狼·拉森戴上镣铐以后，我们才发现，他已经几乎用不着镣铐了。他的第二次发作和第一次一样，给身体留下了严重残疾。下午，莫德想喂他吃些东西，见他明明有了苏醒的迹象，跟他说话却得不到回答。他左侧卧着，显然十分痛苦。直到他不安地转过头，让压在枕头上的左耳露出来，才立刻听见她说话，也答了她。莫德马上来找我。
        - id: ch01-b02
          speaker: narrator
          text: 我把枕头压住他的左耳，问他听不听得见。他毫无反应。枕头一拿开，再问一遍，他马上答了话。
        - id: ch01-b03
          speaker: humphrey
          text: 你知道自己的右耳已经聋了吗？
        - id: ch01-b04
          speaker: wolf_larsen
          text: >-
            知道。还不只这样。右半边身子全出了问题，像睡着了一样，胳膊和腿都动不了。
        - id: ch01-b05
          speaker: humphrey
          text: 你又在装病？
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: >-
            他摇摇头，严峻的嘴唇扭出一个怪笑。只有左边脸在笑，右边的肌肉一动不动，那笑容真的歪了。
        - id: ch01-b07
          speaker: wolf_larsen
          text: >-
            这是狼最后的一招了。我已经瘫痪，再也走不了路。只有另一边还能动。
        - id: ch01-b08
          speaker: narrator
          text: >-
            他仿佛知道我正怀疑地盯着他的左腿。那条腿刚好屈起膝盖，顶高了毯子。
        - id: ch01-b09
          speaker: wolf_larsen
          text: 真遗憾。我本来想先收拾掉你，亨普。我还以为自己剩下的力气足够呢。
        - id: ch01-b10
          speaker: humphrey
          text: 可你为什么非要这么做？
        - id: ch01-b11
          speaker: narrator
          text: 我又害怕，又忍不住想知道答案。他再次扭起嘴角。
        - id: ch01-b12
          speaker: wolf_larsen
          text: >-
            为了活着。只要还能生活、还能行动，我就要一直做那团酵素里最大的一块，把你吞掉。可现在，我竟要这样死。
        - id: ch01-b13
          speaker: narrator
          text: >-
            他想耸肩，结果只有左肩动了动，连这个动作也是歪的。我问他病根在哪里，他立刻说在脑子，是那些该死的头痛引起的。我提醒他，头痛只是症状。他点了点头。
        - id: ch01-b14
          speaker: wolf_larsen
          text: >-
            我一辈子都没生过病，谁能解释这是怎么回事？脑子里一定有东西坏了，也许是癌，也许是瘤。那东西会吞噬，会破坏，正在一点点吃掉我的神经中枢，一个细胞接着一个细胞。疼痛已经说明了一切。
        - id: ch01-b15
          speaker: humphrey
          text: 看来运动中枢也受到了侵袭。
        - id: ch01-b16
          speaker: wolf_larsen
          text: >-
            是啊。最可恶的是，我只能躺在这里，意识清楚，心智也没有损伤，却知道那些线路正一条条断掉，我同世界的联系正一点点消失。我已经看不见了，听觉和知觉也在离开。照这样下去，很快连话都说不了。可我仍会留在这里，活着，头脑仍在活动，却毫无力量。
        - id: ch01-b17
          speaker: humphrey
          text: 既然你说“你”还留在这里，那么灵魂也许真的存在。
        - id: ch01-b18
          speaker: wolf_larsen
          text: >-
            胡扯！这只说明我的高级精神中枢还没受损。我能记忆，能思考，也能推理。等这些能力没有了，我也就没有了，不复存在。灵魂？
        - id: ch01-b19
          speaker: narrator
          text: >-
            他嘲弄地大笑起来，又把左耳压向枕头，不肯再谈。莫德和我继续做事，心头却压着他的可怕命运。那命运究竟有多可怕，我们还没有完全明白，只觉得其中带着报应般的森严和恐怖。我们都陷进深沉而肃穆的思绪，彼此说话时，也几乎不敢高过低低的耳语。
        - id: ch01-b20
          speaker: wolf_larsen
          text: >-
            手铐可以摘了。不会有危险，我现在是个瘫子。接下来，你们只要当心别让我生褥疮。
        - id: ch01-b21
          speaker: narrator
          text: >-
            那天夜里，他对着守在铺边的我们又露出歪斜的笑。莫德惊恐地睁大眼睛，只得把头转开。我知道她还要照料他，便想让她少受一点折磨。
        - id: ch01-b22
          speaker: humphrey
          text: 你知道自己的笑容已经歪了吗？
        - id: ch01-b23
          speaker: wolf_larsen
          text: >-
            那我以后不笑了。我就觉得哪里不对，右边脸颊已经麻了一整天。其实过去三天都有过警告。右半边身子时不时像睡着，有时是胳膊和手，有时是腿和脚。
        - id: ch01-b24
          speaker: narrator
          text: 过了一会儿，他又开口了。
        - id: ch01-b25
          speaker: wolf_larsen
          text: >-
            我的笑真的歪了？那么从今以后，就当我在心里笑，用我的灵魂笑。对，就是你们说的灵魂。现在也当我正在笑吧。
        - id: ch01-b26
          speaker: narrator
          text: >-
            他安静地躺了几分钟，独自玩味这个荒诞的念头。他骨子里丝毫未变，仍是那个不屈、可怕的海狼·拉森，只是被囚禁在某个深处，困在一度强悍壮美、仿佛不可战胜的肉体里。如今这肉体成了没有知觉的镣铐，把他的灵魂围进黑暗和寂静，也把他隔绝在那个行动如狂欢的世界之外。他再也不能让“行动”拥有各种语气和时态。留下的只有“存在”：一动不动地存在，正像他给死亡下过的定义。有意志却不能实行，能思考推理，精神依旧活跃，肉体却已经彻底死去。
        - id: ch01-b27
          speaker: narrator
          text: >-
            我甚至取下了手铐，可我们仍无法适应他现在的处境，也无法相信他真的失去了威胁。我们的头脑本能地抗拒这个事实。在我们眼里，他依然有无穷的可能，谁也猜不到他下一步会怎样，会不会挣脱肉体的束缚，突然爆发出什么骇人的举动。过去的经历足以让我们这样提防。此后干活，焦虑始终压在我们身上。
    - id: ch02
      title: 竖起前桅
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            我已经想出办法弥补人字架太矮的问题。先用新做的移船滑车，把前桅根拖过栏杆，再慢慢放到甲板上。接着借助人字架，把四十英尺长的主斜桁吊上船。它的长度足以提供吊转桅杆所需的高度。我在人字架上另装一副滑车，把斜桁吊得近乎直立，再将根部放上甲板，在四周钉上几块巨大的系缆木，免得它打滑。原来那副起重滑车的单轮滑车则接到斜桁顶端。这样，只要把滑车引到绞盘，斜桁根部始终不动，我便能随意升降它的顶端。拉动两边牵索，还能让整根斜桁左右摆动。我又在斜桁顶端装了一副专门吊重物的滑车。整套装置完成时，连我都吃惊于它能发出的力量，还有它能覆盖的范围。
        - id: ch02-b02
          speaker: narrator
          text: >-
            单是完成这部分工程，就花了整整两天。直到第三天早晨，我才把前桅从甲板上吊起来，动手把桅根削成方形，好让它嵌进桅座。我干这项活格外笨拙，对着风吹雨打过的硬木又锯又砍又凿，最后把它弄得像被一只巨鼠乱啃过。不过外表再难看，它确实能嵌进去。
        - id: ch02-b03
          speaker: humphrey
          text: 能成！我知道它一定能成！
          emotion: happy
        - id: ch02-b04
          speaker: maud_brewster
          text: 你知道乔丹博士检验真理的最后标准吗？
        - id: ch02-b05
          speaker: narrator
          text: 我摇摇头，停下手，正想把落进脖子里的木屑抖出来。
        - id: ch02-b06
          speaker: maud_brewster
          text: 能不能让它真正发挥作用？能不能把我们的性命托付给它？这就是检验标准。
        - id: ch02-b07
          speaker: humphrey
          text: 他是你最敬仰的人之一。
        - id: ch02-b08
          speaker: maud_brewster
          text: >-
            我拆掉从前那座先贤祠，把拿破仑、恺撒和他们那一班人全赶走，马上又建了一座新的。第一位被我请进去的，就是乔丹博士。
        - id: ch02-b09
          speaker: humphrey
          text: 一位现代英雄。
        - id: ch02-b10
          speaker: maud_brewster
          text: 正因为他是现代人，才更加伟大。旧世界的英雄怎么能同我们的英雄相比？
        - id: ch02-b11
          speaker: narrator
          text: >-
            我摇了摇头。我们在太多事情上看法相近，根本争不起来，至少人生的立场和眼光几乎一样。
        - id: ch02-b12
          speaker: humphrey
          text: 我们这两个批评家，意见倒出奇地一致。
        - id: ch02-b13
          speaker: maud_brewster
          text: 做船匠和得力助手，我们也配合得出奇地好。
        - id: ch02-b14
          speaker: narrator
          text: >-
            我们相视而笑，可那段日子没有多少时间欢笑。工作太重，海狼·拉森那活着的死亡也叫人不寒而栗。他又遭了一次打击，声音正在离去，只能时有时无。用他的话说，那些线路像股票行情一样，忽涨忽跌。线路上涨时，他还能同从前一样说话，只是缓慢沉重。有时一句话刚说到一半，声音突然中断，接下来几小时，我们只能等联系重新接通。他的头也痛得厉害。趁声音还在，他定下一套办法，预备着彻底失声的那一天：握一下手表示“是”，握两下表示“不”。这个安排来得正好。到了傍晚，他便再也发不出声音。此后只能靠握手回答问题，自己想说什么，就用左手写在纸上，字迹还相当清楚。
        - id: ch02-b15
          speaker: narrator
          text: >-
            凶猛的冬天已经来到。狂风一场接一场，又是雪，又是冻雨和冷雨。海豹也开始规模浩大的南迁，原来喧闹的栖息地几乎完全空了。我发疯似的干活。天气再坏，风再碍事，也从天亮一直守在甲板上，直到天黑才停手。付出这些力气以后，工程总算有了看得见的进展。
        - id: ch02-b16
          speaker: narrator
          text: >-
            上次竖好人字架后，我才发现还得爬到顶上接牵索，这次便吸取了教训。前桅刚刚吊离甲板，桅顶停在最方便伸手的位置，我立刻把索具和支索接好，喉部升降索、帆顶升降索也一一装上。这部分活的分量又被我看轻了，整整忙过两个漫长的白昼才完成。可前面仍有许多工作等着我们，光是那些船帆，就几乎全得拆开重做。
        - id: ch02-b17
          speaker: narrator
          text: >-
            我给前桅安装索具时，莫德在一旁缝帆布。只要有哪项活需要两双以上的手，她随时都会放下针线赶来帮忙。帆布又厚又硬，她用水手惯用的掌垫顶着三棱帆针，一针一针往前缝。她的双手很快磨满了叫人心疼的水疱，却仍勇敢地坚持。除此以外，每天做饭和照顾病人，也都落在她身上。
        - id: ch02-b18
          speaker: humphrey
          text: 管它什么迷信，今天是星期五，我也非把这根桅杆装好不可。
        - id: ch02-b19
          speaker: narrator
          text: >-
            一切已经备好。我把斜桁上的滑车引到绞盘，将桅杆吊得几乎离开甲板，系牢以后，再把接在斜桁顶端的人字架滑车引到绞盘。只转几圈，桅杆便笔直悬在空中。莫德终于不用再按着绳圈，立刻拍起手来。
        - id: ch02-b20
          speaker: maud_brewster
          text: 成功了！真的成功了！我们的性命可以托付给它！
          emotion: happy
        - id: ch02-b21
          speaker: narrator
          text: 她随即又满脸懊丧。
        - id: ch02-b22
          speaker: maud_brewster
          text: 可它没有对准洞口。难道全部都得重来？
        - id: ch02-b23
          speaker: narrator
          text: >-
            我高深莫测地一笑，放松一侧牵索，收紧另一侧，把桅杆摆到甲板中央。它还是没有对准洞口。莫德又露出懊丧的神情，我也又笑了一次。接着，我一面放松斜桁滑车，一面收紧同样长度的人字架滑车，桅根终于来到洞口正上方。我仔细告诉莫德该怎样下放，自己则钻到底舱，守在船底的桅座旁。
        - id: ch02-b24
          speaker: narrator
          text: >-
            听到我的喊声，莫德开始动作。方形桅根轻巧而准确地落向桅座方孔，却在下降时慢慢转偏，方形再也对不进方形。我一点也没有迟疑，叫她停止下放，自己回到甲板，用滚结把移船滑车牢牢系在桅杆上。我让莫德拉住滑车，随即重新下舱。提灯光下，桅根缓缓扭正，四边终于同桅座的四边对齐。莫德系牢滑车，又回到绞盘旁。桅根下降了相隔的几英寸，却再次略微转偏。她便照刚才的办法，用移船滑车把它扭正，再从绞盘上继续下放。方形终于严丝合缝地嵌进方形，前桅立住了。
        - id: ch02-b25
          speaker: narrator
          text: >-
            我忍不住放声欢呼，莫德听见后立刻跑下来察看。我们站在提灯昏黄的光里，久久端详着亲手完成的工程，又抬头望向彼此。两只手在半明半暗中摸索着伸到一起，终于紧紧相握。我想，那一刻我们两个人都因为成功的喜悦而湿润了眼睛。
        - id: ch02-b26
          speaker: humphrey
          text: 真做起来，结果竟这样容易。原来所有力气都花在准备上了。
        - id: ch02-b27
          speaker: maud_brewster
          text: >-
            所有惊奇却都在完成的一刻。我还是不敢相信，这么大的桅杆真的已经竖起来，装进了船里。你把它从水中捞起，吊过半空，再放回该在的位置。这是提坦巨神才能完成的工作。
    - id: ch03
      title: 浓烟中的火
      blocks:
        - id: ch03-b01
          speaker: humphrey
          text: 他们又为自己发明了许多巧妙的办法——
        - id: ch03-b02
          speaker: narrator
          text: >-
            我正兴高采烈地念着，忽然闻了闻空气。提灯并没有冒烟。莫德也察觉了。
        - id: ch03-b03
          speaker: maud_brewster
          text: 有东西烧起来了。
        - id: ch03-b04
          speaker: narrator
          text: >-
            我们同时扑向梯子。我抢先冲上甲板，只见浓烟正从统舱升降口往外翻滚。
        - id: ch03-b05
          speaker: humphrey
          text: 这头狼还没有死。
        - id: ch03-b06
          speaker: narrator
          text: >-
            我低声说完，便穿过烟雾跳了下去。狭窄舱室里的烟浓得伸手不见五指，我只能一路摸索。海狼·拉森给我留下的恐惧太深，我甚至已经准备好，等着那个不能动的巨人突然伸手，以扼喉的力量抓住我的脖子。我停了下来，逃回梯边、冲上甲板的念头几乎压倒一切。这时，莫德的样子闪到眼前。刚才在纵帆船底舱的灯光里，她褐色的眼睛温暖湿润，满是成功的喜悦。我知道自己绝不能退。
        - id: ch03-b07
          speaker: narrator
          text: >-
            摸到海狼·拉森的铺位时，我已经又呛又憋，几乎透不过气。我伸手去找他的手。他一动不动地躺着，被碰到才略微动了一下。我又从毯子上面摸到下面，没有热气，也找不到着火的痕迹。可这股刺得我眼睛发痛、逼得我不停咳嗽喘气的浓烟，总得有个来处。我一时失去理智，在统舱里发疯似的四处乱撞。身体猛地撞上桌子，肺里的气几乎被撞出去，我的脑子反倒清醒了。一个不能动的人要放火，火源只能在他躺着的地方附近。
        - id: ch03-b08
          speaker: narrator
          text: 我回到铺位边，竟碰见了莫德。她不知已经在浓烟里待了多久。
        - id: ch03-b09
          speaker: humphrey
          text: 马上到甲板上去！
        - id: ch03-b10
          speaker: maud_brewster
          text: 可是，汉弗莱——
        - id: ch03-b11
          speaker: humphrey
          text: 求你了！快去！
        - id: ch03-b12
          speaker: narrator
          text: >-
            我粗暴地喊了出来，她顺从地退开。我却立刻想到，她要是找不到梯子怎么办？我追到升降口底下，又不确定她是否已经上去。正在迟疑时，她从烟里轻声喊我。
        - id: ch03-b13
          speaker: maud_brewster
          text: 汉弗莱，我迷路了。
          emotion: fearful
        - id: ch03-b14
          speaker: narrator
          text: >-
            她正在艉部舱壁上慌乱地摸索。我找到她，半扶半抱地带她走到升降口，再一起爬上梯子。重新吸进清洁的空气，简直像喝到琼浆一样甘美。莫德只是有些昏沉眩晕，并没有失去知觉。我让她留在甲板上躺着，自己转身第二次钻进下面的浓烟。
        - id: ch03-b15
          speaker: narrator
          text: >-
            我认定烟源就在海狼·拉森身边，直奔他的铺位。手在毯子间摸索时，一件滚烫的东西落到手背上。我被烫得猛一缩手，终于明白了。他隔着上铺底板的缝隙点燃了床垫，原来左臂还能做这件事。床垫里的稻草潮湿，又从下面点燃，接触不到空气，所以始终只在阴燃。
        - id: ch03-b16
          speaker: narrator
          text: >-
            我把床垫从铺位里往外拖。它仿佛在半空中散了架，同时一下蹿起火焰。我先拍灭仍留在铺位里的燃烧稻草，再一口气冲回甲板呼吸。几桶水便浇熄了统舱地板中央的床垫。十分钟后，烟雾真正散开，我才允许莫德下来。海狼·拉森已经昏迷，可新鲜空气只用几分钟便让他苏醒。我们还围在旁边照料他，他便抬手示意，要我们拿来纸和铅笔。
        - id: ch03-b17
          speaker: wolf_larsen
          text: 请不要打扰我。我正在微笑。
        - id: ch03-b18
          speaker: narrator
          text: 过了一会儿，他又写下一句话。
        - id: ch03-b19
          speaker: wolf_larsen
          text: 你瞧，我仍是那团酵素里的一小块。
        - id: ch03-b20
          speaker: humphrey
          text: 我很高兴你只剩下这么小的一块。
        - id: ch03-b21
          speaker: wolf_larsen
          text: 谢谢。不过想想看，等我死去以前，还会变得多么微小。
        - id: ch03-b22
          speaker: narrator
          text: 他最后挥笔写道：
        - id: ch03-b23
          speaker: wolf_larsen
          text: >-
            可我还完完整整地留在这里，亨普。我一生从没像现在这样想得清楚。没有任何东西来打扰我，精神可以完全集中。我全都在这里，甚至比完整还要更多。
        - id: ch03-b24
          speaker: narrator
          text: >-
            这像是一道从坟墓黑夜中传来的讯息。这个人的肉体，已经成为埋葬他自己的陵墓，他的精神却还在这座奇异的坟茔里振翅，活着。身体一寸寸失去作用，外面的世界一层层远去，那精神仍不肯停止。它会一直振翅，一直活下去，直到最后一条联系终于断裂。可就算到了那时，谁又能说得准，在再也无法向外传递消息的黑暗里，它还会继续振翅活上多久？
