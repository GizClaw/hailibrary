audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    red_faced_man:
      display_name: Red-Faced Sailor
      tts:
        delivery: blunt, weathered, and forceful
        timbre: rough and resonant
        pace: brisk with emphatic bursts
        pitch: low
    pilot:
      display_name: Martinez Pilot
      tts:
        delivery: sharp and commanding
        timbre: firm and clear
        pace: quick
        pitch: medium
    stout_gentleman:
      display_name: Stout Gentleman
      tts:
        delivery: anxious and repetitive
        timbre: full and slightly breathless
        pace: measured
        pitch: medium
    rescuer:
      display_name: Rescuer
      tts:
        delivery: impatient and direct
        timbre: rugged and carrying
        pace: brisk
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER I
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I hardly know where to start, though I sometimes joke that Charley Furuseth caused everything. He owned a summer cottage in Mill Valley, beneath Mount Tamalpais. Oddly enough, he used it only in winter, when he loafed and rested his brain by reading Nietzsche and Schopenhauer. In summer he chose the hot, dusty city and worked without stopping. I usually visited him every Saturday and stayed until Monday morning. Without that habit, I would not have been out on San Francisco Bay on this particular Monday in January.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The vessel itself seemed safe enough. The Martinez was a new ferry steamer, only four or five trips into its run between Sausalito and San Francisco. The danger was the thick fog spread across the bay, and I knew too little about the sea to fear it. I stood on the forward upper deck beneath the pilot house and let the mystery of the fog fill my thoughts. A fresh breeze blew through the damp grayness. I seemed alone, though I could dimly sense the pilot and someone I took for the captain inside the glass room above me.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I was thinking how comfortable this division of labor made life. I did not need to study fog, wind, tides, and navigation just to cross an arm of the sea and visit a friend. It was good, I thought, that people could become specialists. The pilot and captain knew enough to serve thousands of passengers who knew no more about sailing than I did. Instead of spending my energy learning a little about countless things, I could master a few subjects of my own. Mine included the place of Edgar Allan Poe in American literature. In fact, the current Atlantic carried an essay of mine on that very subject. On my way through the cabin, I had greedily noticed a stout gentleman reading the magazine, open to my essay. The whole arrangement seemed beautifully complete. With their special knowledge, the crew carried him safely from Sausalito to San Francisco. Meanwhile, he read what my special knowledge had produced about Poe.
        - id: ch01-b04
          speaker: narrator
          text: >-
            A red-faced man slammed the cabin door and stumped onto the deck, breaking into my thoughts. I still made a mental note to use the idea in an essay I planned to call “The Necessity for Freedom: A Plea for the Artist.” The man glanced toward the pilot house, looked around at the fog, and paced across the deck and back. His legs were plainly artificial. Then he stopped beside me, planted his feet wide, and gazed about with keen enjoyment. I felt sure he had spent his life at sea.
        - id: ch01-b05
          speaker: red_faced_man
          text: >-
            Weather like this turns a man gray before his time.
        - id: ch01-b06
          speaker: narrator
          text: >-
            I told him I had never imagined the work involved much strain. It looked as simple as the alphabet to me. The compass gave the direction. They knew the distance and the speed. Surely it was almost a mathematical certainty.
        - id: ch01-b07
          speaker: red_faced_man
          emotion: angry
          text: >-
            No strain? Simple as the alphabet? A mathematical certainty?
        - id: ch01-b08
          speaker: narrator
          text: >-
            He braced himself as if leaning back against the air and stared at me.
        - id: ch01-b09
          speaker: red_faced_man
          text: >-
            Then what about the tide rushing out through the Golden Gate? How fast is it ebbing? How far will it push us off course? Listen! That's a bell buoy, and we're nearly on top of it. See? They're changing course now!
        - id: ch01-b10
          speaker: narrator
          text: >-
            A mournful bell tolled somewhere in the fog. Above us, the pilot spun the wheel quickly. The bell had sounded straight ahead, but now it came from our side. Our whistle gave a hoarse blast. Other whistles answered now and then from somewhere inside the fog.
        - id: ch01-b11
          speaker: red_faced_man
          text: >-
            That whistle on the right belongs to some kind of ferry. And hear that horn? A man is blowing it by mouth. Probably a scow schooner. Watch yourself, schooner man. Ah, there it is. Somebody's in real trouble now!
        - id: ch01-b12
          speaker: narrator
          text: >-
            The hidden ferry blasted its whistle again and again. The hand-blown horn answered in terrified little bursts.
        - id: ch01-b13
          speaker: red_faced_man
          text: >-
            Now they're warning each other and trying to get apart.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The frantic signals stopped. The man's face shone and his eyes flashed as he turned the horns and sirens into words for me.
        - id: ch01-b15
          speaker: red_faced_man
          text: >-
            There's a steam siren sounding over on the left. And hear that hoarse fellow? I'd say that's a steam schooner coming in from the Heads against the tide.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Then a small, shrill whistle piped wildly from very close ahead. Gongs rang aboard the Martinez. Our paddle wheels stopped, and their steady beat died. Then they started again. The little whistle darted off to the side and quickly faded, like a cricket chirping among great beasts. I looked at my companion for an explanation.
        - id: ch01-b17
          speaker: red_faced_man
          emotion: angry
          text: >-
            One of those reckless launches. I almost wish we'd sunk the little pest! They cause more trouble than they're worth. Any fool climbs aboard, races everywhere, and blows his whistle as hard as he can. He expects the whole world to watch out because he can't watch out for himself. Right of way? Common decency? He doesn't know what either one means!
        - id: ch01-b18
          speaker: narrator
          text: >-
            His anger seemed so unreasonable that it amused me. While he stumped indignantly up and down, I went back to dreaming about the romance of the fog. And it truly did feel romantic to me then. The fog seemed like the gray shadow of an endless mystery hanging over our spinning speck of earth. Human beings were only tiny sparks of light, cursed with a wild hunger for work. They rode their vessels of wood and steel straight into the heart of that mystery. Blindly, they felt their way through a world they could not see. All the while, horns clamored and bells rang out as if the crews were speaking with perfect confidence. Yet beneath all that noise, uncertainty and fear lay heavy on their hearts.
        - id: ch01-b19
          speaker: narrator
          text: >-
            My companion's voice pulled me out of that dream, and I laughed at myself. I too had been feeling my way blindly while imagining I saw everything clearly.
        - id: ch01-b20
          speaker: red_faced_man
          text: >-
            Hello, something's coming our way. Hear that? It's moving fast, too. It doesn't seem to hear us yet. The wind is carrying our sound the wrong way.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The fresh breeze blew straight toward us. I could hear the whistle clearly, a little ahead and off to one side. I asked if it was another ferry.
        - id: ch01-b22
          speaker: red_faced_man
          text: >-
            Must be, or it wouldn't be moving at that speed. They're getting worried up in the pilot house.
        - id: ch01-b23
          speaker: narrator
          text: >-
            He gave a short chuckle. I looked up and saw the captain leaning his head and shoulders out of the pilot house. He stared into the fog as if determination alone could pierce it. Anxiety showed on his face. It showed on my companion's face too. The red-faced man had gone to the rail and was peering toward the danger we still could not see.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Then everything happened with unbelievable speed. The fog split open as if cut by a wedge, and the bow of a steamboat burst through. Streamers of fog dragged along both sides like seaweed on the snout of a great sea monster. I saw its pilot house and a white-bearded man leaning partly out on his elbows. His blue uniform was neat, and everything about him looked perfectly quiet. In that moment, his calm was terrible. He seemed to have accepted his fate and chosen to walk straight beside it. Now he was coolly measuring the coming blow. His eyes passed over our ferry as if he were calculating the exact spot where the ships would meet. Even when our furious pilot shouted at him, he showed no sign of noticing.
        - id: ch01-b25
          speaker: pilot
          emotion: angry
          text: >-
            Now you've done it!
        - id: ch01-b26
          speaker: narrator
          text: >-
            The white-bearded man did not respond. Looking back, I can see that our pilot's words were too obvious to need an answer.
        - id: ch01-b27
          speaker: red_faced_man
          emotion: calm
          text: >-
            Grab something and hold tight. And listen. The women will start screaming.
        - id: ch01-b28
          speaker: narrator
          text: >-
            All his bluster had vanished. He spoke with an unnatural calm, and almost with bitterness, as if he had lived through this before. The ships struck before I could do what he said. The other steamer must have hit us squarely amidships, because it had already passed beyond my view. The Martinez tipped hard to one side. Timber crashed and tore apart. I fell flat on the wet deck. Before I could stand, I heard the women scream.
        - id: ch01-b29
          speaker: narrator
          text: >-
            That sound, more dreadful than I can describe, sent me into a panic. I remembered the life preservers in the cabin, but a wild rush of men and women met me at the door and swept me backward. The next few minutes are mostly gone from my memory. What I do remember is pulling life preservers down from the racks while the red-faced man fastened them around a frantic group of women.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The scene remains as sharp as any picture I have ever seen. Gray fog swirled and curled through the jagged hole torn in the cabin wall. The padded seats stood empty now, but every sign of the passengers' sudden flight lay around them. There were packages, hand satchels, umbrellas, and wraps everywhere. In the middle of it all stood the stout gentleman who had been reading my essay. He was wrapped in cork and canvas, yet the Atlantic was still in his hand. He fixed on me and asked the same question with dull, steady insistence.
        - id: ch01-b31
          speaker: stout_gentleman
          text: >-
            Do you think we're in danger? Do you think there is any danger?
        - id: ch01-b32
          speaker: narrator
          text: >-
            The red-faced man moved bravely through the cabin on his artificial legs, buckling life preservers onto everyone he could reach. Around him, the women filled the place with screams.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Their screaming tried my nerves more than anything else. It must have tried his too, because another picture has never left me. The stout gentleman pushed the magazine into his overcoat and watched with curiosity. The women were tangled together, their faces white and drawn, their mouths open as they shrieked like a chorus of lost souls. The red-faced man's face turned purple with fury. He lifted both arms as if he meant to throw thunderbolts.
        - id: ch01-b34
          speaker: red_faced_man
          emotion: angry
          text: >-
            Stop screaming! Oh, stop it!
        - id: ch01-b35
          speaker: narrator
          text: >-
            The sight made me laugh suddenly. A moment later I understood that I was becoming hysterical myself. These women were people of my own kind, women like my mother and sisters. The fear of death had seized them, and they did not want to die. Yet the sounds they made reminded me horribly and vividly of pigs squealing beneath a butcher's knife. The comparison itself filled me with horror. These women were capable of the highest emotions and the tenderest sympathy. Now they stood with their mouths open, doing nothing but screaming. They wanted to live, but they were helpless. They were trapped like rats, and they screamed.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The horror drove me back outside. Sick and faint, I sat on a bench and dimly watched men run and shout as they struggled to lower the boats. It looked exactly like the shipwreck scenes I had read about in books. The ropes and pulleys jammed. Nothing seemed to work when it was needed. One boat was lowered with its plugs missing. First women and children filled it. Then water filled it, and the whole boat capsized. Another boat had been lowered at only one end. The other end still hung from its tackle, and the useless boat was left there. The steamer that had struck us had vanished completely. I could not see any part of it, though I heard men saying it would surely send boats back to help us.
        - id: ch01-b37
          speaker: narrator
          text: >-
            I went down to the lower deck. The Martinez was sinking quickly, and the water had risen close. Many passengers jumped overboard. Those already in the bay cried to be taken back onto the ferry, but no one listened. Then someone shouted that we were going down. Panic seized the crowd, and a mass of bodies carried me over the side.
        - id: ch01-b38
          speaker: narrator
          text: >-
            I do not know how I entered the water. I understood at once why the people in it wanted to return. The cold hurt like fire. It cut straight to the marrow and closed around me like death's grip. I gasped from the pain and shock, drawing breath just before the life preserver pushed me back to the surface. Salt filled my mouth. Its bitter sting caught in my throat and lungs, and I choked.
        - id: ch01-b39
          speaker: narrator
          text: >-
            The cold was worst of all. I felt certain I could survive only a few minutes. People struggled and thrashed in the water around me, calling out to one another. I also heard the beat of oars. The other steamer had apparently lowered its boats after all. Time went by, and I began to wonder how I could possibly still be alive. I could no longer feel anything in my lower body. A cold numbness wrapped itself around my heart and slowly seemed to creep inside it. Small waves kept coming at me. Their foaming crests broke spitefully over my face and poured into my mouth, sending me into one choking fit after another.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The noises became faint. Far away, I heard one last hopeless chorus of screams, and I knew the Martinez had sunk. I do not know how much later it was when fear shocked me back to awareness. I was alone. No one called or cried now. There was only the sound of the waves, made hollow and strange by the fog.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Panic in a crowd has at least the comfort of being shared. Everyone is trapped in the same danger. Panic alone is far worse, and that was the kind that took hold of me then. Where was I drifting? The red-faced man had said the tide was running out through the Golden Gate. Was that same tide carrying me out to sea? Could I even trust the life preserver holding me up? Might it fall apart at any moment? I had heard stories of cheap ones made from paper and hollow reeds. They would soak through quickly and lose all their power to float. If that happened, I had no hope of saving myself. I could not swim a single stroke.
        - id: ch01-b42
          speaker: narrator
          text: >-
            I was alone, floating in what seemed an ancient, endless world of gray. Madness seized me. I screamed aloud just as the women had screamed, and I struck the water again and again with my numb hands.
        - id: ch01-b43
          speaker: narrator
          text: >-
            I cannot tell how long that lasted. A blank came over me, something like a troubled and painful sleep. When I woke, it felt as if centuries had passed. The bow of a vessel was coming out of the fog almost above me. Three triangular sails overlapped one another, each one closely crossing the next, and all of them were full of wind. Water foamed and gurgled where the bow cut through it, and I seemed to be directly in its path.
        - id: ch01-b44
          speaker: narrator
          text: >-
            I tried to shout, but I was too weak. The bow plunged down and barely missed me, throwing a sheet of water over my head. Then the vessel's long black side slid past, close enough to touch. I tried to reach it. In my desperation, I imagined clawing my fingernails into the wood, but my arms felt heavy and dead. Once more I tried to call out. No sound came.
        - id: ch01-b45
          speaker: narrator
          text: >-
            As the stern rushed by, it dropped into the hollow between two waves. For an instant, I glimpsed one man standing at the wheel. Beside him was another man who seemed to be doing nothing at all except smoking a cigar. I could see smoke coming from his lips as he slowly turned his head and glanced over the water in my direction. Nothing appeared to have drawn his attention. It was a careless, unplanned look, the sort a man gives when nothing in particular needs doing. He acts only because he is alive and must do something.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Yet life and death were held in that glance. The vessel was already disappearing into the fog. I saw the helmsman's back, and I watched the other man's head keep turning. His gaze touched the water and drifted toward me. His face looked absent, lost in thought. I was terrified that even if his eyes fell on me, he might not truly see me.
        - id: ch01-b47
          speaker: narrator
          text: >-
            His eyes met mine. He saw me. At once he sprang to the wheel, pushed the other man aside, and spun it hand over hand while shouting orders I could not understand. The vessel turned sharply away from its old course and vanished into the fog almost at once.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Unconsciousness began to pull me down again. I fought with all my will against the smothering darkness rising around me. A little later, I heard oars striking the water. The sound drew nearer and nearer. A man was calling out. When he came close, I heard his irritated shout.
        - id: ch01-b49
          speaker: rescuer
          emotion: angry
          text: >-
            Why in hell don't you call out?
        - id: ch01-b50
          speaker: narrator
          text: >-
            He meant me, I thought. Then the darkness rose over me.
