audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，随险情逐渐紧迫
        timbre: 清朗温厚
        pace: 舒缓起步，随后自然加快
        pitch: 中低
    red_faced_man:
      display_name: 红脸汉子
      tts:
        delivery: 粗直老练，情绪来得快而强
        timbre: 粗粝洪亮
        pace: 明快有力
        pitch: 中低
    helmsman:
      display_name: 舵手
      tts:
        delivery: 紧绷急促
        timbre: 清晰刚硬
        pace: 快
        pitch: 中
    fat_gentleman:
      display_name: 胖绅士
      tts:
        delivery: 茫然执拗
        timbre: 浑厚柔软
        pace: 偏慢
        pitch: 中低
    passenger_1:
      display_name: 乘客甲
      tts:
        delivery: 匆忙而带着希望
        timbre: 普通清亮
        pace: 快
        pitch: 中
    passenger_2:
      display_name: 乘客乙
      tts:
        delivery: 惊慌高喊
        timbre: 尖亮紧张
        pace: 很快
        pitch: 偏高
    rescuer:
      display_name: 救援水手
      tts:
        delivery: 粗暴急躁
        timbre: 低沉沙哑
        pace: 快
        pitch: 低
  chapters:
    - id: ch01
      title: 第一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我几乎不知道该从哪里讲起。有时开玩笑，我会把后来的一切都算在查利·弗鲁塞思头上。他在塔玛尔派斯山脚的米尔谷有间避暑小屋，可他偏偏只在冬天闲着的时候去住，读读尼采和叔本华，让脑子歇一歇。到了夏天，他反而留在又热又满是尘土的城里，没日没夜地干活。我每个星期六下午都会去看他，住到星期一早晨。要不是这个习惯，那年一月的那个星期一，我也就不会漂在旧金山湾上了。
        - id: ch01-b02
          speaker: narrator
          text: 我搭的船其实很安全。“马丁内斯号”是艘新渡轮，往返索萨利托和旧金山，那不过是它第四或第五次航行。真正危险的是罩住海湾的浓雾，可我这个不懂水性的人根本没把它当回事。那天，我心情轻松，甚至有些兴奋，就站在上层前甲板上，正好在驾驶室下方。我任由那片神秘的雾抓住想象。一阵清劲的风吹来，我独自在潮湿的昏暗里站了好一会儿。当然，也不算完全独自一人。我隐约知道，头顶的玻璃房里有舵手，还有一个我以为是船长的人。
        - id: ch01-b03
          speaker: narrator
          text: 我还在想，这样分工真让人省心。我只是去看海湾对岸的朋友，根本不用亲自研究雾、风、潮水和航海。每个人各有专长，多好啊。舵手和船长懂这些，就能替成千上万像我一样不懂海的人做事。我呢，也不用什么都学，只管钻研自己熟悉的几样，比如分析爱伦·坡在美国文学中的地位。说来也巧，我写的那篇文章正登在这一期《大西洋月刊》上。刚才穿过客舱时，我一眼看见一位胖绅士在读那本杂志，恰好翻到了我的文章。你看，这又是分工。船长和舵手靠本事把他平安送到旧金山，他在路上读的，则是我靠自己的本事写出来的坡氏研究。
        - id: ch01-b04
          speaker: narrator
          text: 一个红脸汉子猛地甩上客舱门，笃笃地走上甲板，把我的思绪打断了。我还是记下了刚才那个念头，准备放进一篇早已构思好的文章，题目叫《自由之必要：为艺术家一辩》。红脸汉子先抬头看看驾驶室，又看看四周的雾，然后从甲板一头走到另一头，再折回来。那笃笃声说明他装着一条假腿。后来他在我身边站住，叉开双腿，兴致勃勃地望着四周。我猜他一辈子都在海上讨生活，果然没猜错。
        - id: ch01-b05
          speaker: red_faced_man
          text: 碰上这种鬼天气，人还没老，头发就得先白了。
        - id: ch01-b06
          speaker: narrator
          text: 他说着，朝驾驶室点了点头。
        - id: ch01-b07
          speaker: narrator
          text: 我可没想到这事有多难。在我看来，认准罗盘，再算好距离和速度，不就像一、二、三那么简单吗？全是确定的数学。
        - id: ch01-b08
          speaker: red_faced_man
          text: 难？一、二、三那么简单？还确定的数学？
        - id: ch01-b09
          speaker: narrator
          text: 他瞪着我，身子绷得紧紧的，像是往后靠在空气上。
        - id: ch01-b10
          speaker: red_faced_man
          text: 那股从金门海峡往外冲的潮水呢？退得有多快？会把船推偏多少？啊？听见没有，那是钟浮标！咱们都快骑到它头上了。看，他们正在改航向！
        - id: ch01-b11
          speaker: narrator
          text: 雾里传来凄凉的钟声，一下一下地敲着。我看见舵手飞快转动舵轮。刚才还像在正前方的钟声，这会儿已经挪到了侧面。我们的汽笛沙哑地鸣叫，雾里也时不时飘来别的笛声。
        - id: ch01-b12
          speaker: red_faced_man
          text: 右边那声是渡轮。还有那边，听到了吧？那是用嘴吹的号角，多半是条平底帆船。帆船老兄，你可得小心。哈，我就知道！这下不知哪个倒霉鬼要发疯了。
        - id: ch01-b13
          speaker: narrator
          text: 那艘看不见的渡轮接连拉响汽笛，嘴吹的号角也慌乱地嘟嘟叫个不停。过了一会儿，急促的声音停了。
        - id: ch01-b14
          speaker: red_faced_man
          text: 它们刚才是在打招呼，也是在想办法互相躲开。
        - id: ch01-b15
          speaker: narrator
          text: 他把号角和汽笛的话一句句翻给我听，脸上发亮，眼睛兴奋得闪着光。
        - id: ch01-b16
          speaker: red_faced_man
          text: 左边那声是蒸汽警报笛。再听那个，嗓子里像堵着一只青蛙。我看是条蒸汽帆船，正顶着潮水，从海角那边慢慢爬进来。
        - id: ch01-b17
          speaker: narrator
          text: 正前方很近的地方，突然响起一声尖细的小汽笛，叫得像发了疯。“马丁内斯号”立刻钟声大作。明轮停了，原先那种像脉搏一样的拍水声也断了，随后又重新响起来。尖汽笛像巨兽吼声里的一只蟋蟀，从雾中飞快挪到侧面，渐渐弱下去。我转头看着身边的人，等他说明白。
        - id: ch01-b18
          speaker: red_faced_man
          text: 是那种不要命的小汽艇。刚才真该把那个小混蛋撞沉！麻烦就数它们最多。什么蠢货都能跳上一条，从地狱一直乱闯到天亮，还把汽笛吹得震天响，要全世界给他让路。他来了，自己却不会躲，所以别人非躲不可！什么航行优先权，什么起码的规矩，他们根本不懂！
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: 他这场没来由的火气让我很想笑。他气冲冲地来回走，假腿在甲板上笃笃直响。我又沉进了雾的浪漫里。那片雾确实浪漫，像无穷奥秘投下的一层灰影，低低罩住旋转大地上的一粒微尘。人只是几颗发亮的微粒，却像中了必须苦干的诅咒，骑着木头和钢铁做成的坐骑，闯进奥秘深处。他们在看不见的世界里盲目摸索，心里压着怀疑和恐惧，嘴上却用喧闹的汽笛和铿锵的钟声，满怀自信地互相呼喊。
        - id: ch01-b20
          speaker: narrator
          text: 同伴的声音把我拉回现实。我忍不住笑了。刚才我也在盲目摸索，跌跌撞撞，却还以为自己看得清楚，正从奥秘里从容穿过。
        - id: ch01-b21
          speaker: red_faced_man
          text: 喂，有个家伙正朝咱们冲过来。听见那声了吗？速度真快，马力全开。它准是还没听见我们，风向不对。
        - id: ch01-b22
          speaker: narrator
          text: 清劲的风迎面吹来，我清清楚楚听见汽笛声从侧前方逼近。
        - id: ch01-b23
          speaker: narrator
          text: 是渡轮吗？
        - id: ch01-b24
          speaker: red_faced_man
          text: 要不然，哪能开这么快。
        - id: ch01-b25
          speaker: narrator
          text: 他点点头，又短促地笑了一声。
        - id: ch01-b26
          speaker: red_faced_man
          text: 上面那些人开始着急了。
        - id: ch01-b27
          speaker: narrator
          text: 我抬头一看，船长把头和肩膀探出驾驶室，死死盯着浓雾，好像光凭意志就能把雾看穿。他脸上全是焦虑。我的同伴也一样。他已经笃笃走到栏杆边，盯住那看不见的危险逼来的方向。
        - id: ch01-b28
          speaker: narrator
          text: 接下来的一切快得让人来不及想。浓雾像被楔子劈开，一艘汽船的船头猛然钻了出来，两侧拖着一缕缕雾气，就像缠在利维坦巨兽鼻端的海草。我看见驾驶室里有个白胡子男人。他两肘撑着，半个身子探在外面，身穿整洁的蓝制服。那样危急的时刻，他却安静得叫人害怕。他坦然接住命运送来的打击，冷静地估量这一击会落在哪里。他就那么靠着，用沉着的目光扫过我们，像是在判断两条船究竟会撞在哪一点。
        - id: ch01-b29
          speaker: helmsman
          text: 这下你可闯大祸了！
          emotion: angry
        - id: ch01-b30
          speaker: narrator
          text: 我们的舵手气得脸色煞白，可那白胡子男人根本不理他。现在回头想想，那句话本来就明摆着，确实不需要回答。
        - id: ch01-b31
          speaker: red_faced_man
          text: 快抓住一样东西，抓牢了，别松手。
          emotion: calm
        - id: ch01-b32
          speaker: narrator
          text: 他先前那股虚张声势已经不见了，身上也有了那种不同寻常的镇静。
        - id: ch01-b33
          speaker: red_faced_man
          text: 再听听那些女人怎么叫吧。
        - id: ch01-b34
          speaker: narrator
          text: 他的声音阴沉，几乎有些苦涩，让我觉得这种场面他以前就经历过。
        - id: ch01-b35
          speaker: narrator
          text: 我还没来得及照做，两条船已经撞上了。对方大概正正撞在我们的船腰，因为那艘陌生汽船一下越出我的视野，我什么也看不见。“马丁内斯号”猛地向一边倾斜，紧接着响起木料断裂撕开的巨响。我被掀翻在湿漉漉的甲板上，还没爬起来，就听到了女人们的尖叫。那种声音无法形容，听得人毛骨悚然，我一下就慌了。
        - id: ch01-b36
          speaker: narrator
          text: 我想起客舱里放着救生衣，便往那边冲。刚到门口，一群惊慌逃命的男女迎面撞来，又把我卷了回去。接下来几分钟的事，我记不清了。只记得自己从头顶的架子上扯下救生衣，红脸汉子则忙着把救生衣系到一群歇斯底里的女人身上。
        - id: ch01-b37
          speaker: narrator
          text: 那段记忆像一幅画，到现在还清清楚楚。客舱侧面被撞开了一个大洞，边缘参差不齐，灰雾打着旋往里涌。包裹、手提袋、雨伞和披肩扔得到处都是，那是人们逃命时留下的。软垫座椅全空了。读我文章的胖绅士裹在软木和帆布里，手中居然还拿着那本杂志，只会单调又固执地一遍遍问我。
        - id: ch01-b38
          speaker: fat_gentleman
          text: 真的有危险吗？到底是不是真的有危险？
        - id: ch01-b39
          speaker: narrator
          text: 红脸汉子踩着假腿，英勇地笃笃奔走，碰见谁就替谁扣好救生衣。最后，整间客舱成了混乱的地狱，女人们一直尖叫。
        - id: ch01-b40
          speaker: narrator
          text: 最折磨我神经的就是那些尖叫。红脸汉子大概也忍不下去了，所以我脑海里又留下了另一幅永远不会褪色的画面。胖绅士正把杂志塞进大衣口袋，好奇地站在旁边看。一群女人互相纠缠在一起，脸色惨白，嘴巴大张，像失落的灵魂一同哀号。红脸汉子气得满脸发紫，两只手高高举过头顶，像是马上要掷下雷霆。
        - id: ch01-b41
          speaker: red_faced_man
          text: 闭嘴！啊，你们全都给我闭嘴！
          emotion: angry
        - id: ch01-b42
          speaker: narrator
          text: 这一幕突然把我逗笑了。下一刻，我才发现自己也快歇斯底里了。这些女人和我一样，都是活生生的人，就像我的母亲和姐妹。她们被死亡的恐惧抓住了，她们不愿意死。那些声音让我想到屠刀下猪的尖叫。这个比喻太鲜明，连我自己都吓了一跳。她们本来能感受最高贵的情感，也有最温柔的同情心，可此刻只能张嘴尖叫。她们想活下去，却什么也做不了，像困在捕鼠器里的老鼠，只能不停叫喊。
        - id: ch01-b43
          speaker: narrator
          text: 这份恐怖把我赶回了甲板。我恶心得浑身发虚，只好在一张长凳上坐下。恍惚间，我看着男人们跑来跑去，听见他们边喊边设法放下救生艇。一切都和我从书里读到的海难场面一样。滑车卡住了，没有一样东西肯听使唤。一条小艇还没塞上排水孔就放进海里，先装满女人和孩子，接着灌满海水，翻了。另一条只放下一头，另一头还挂在滑车索具上，却已经没人管它。撞我们的汽船消失得无影无踪，不过我听见一个乘客说。
        - id: ch01-b44
          speaker: passenger_1
          text: 那条船一定会放小艇来救我们。
        - id: ch01-b45
          speaker: narrator
          text: 我下到下层甲板。“马丁内斯号”沉得飞快，海面已经近在眼前。许多乘客接连跳进水里，另一些早就在海中，一边挣扎，一边大声求船上的人拉他们回去。可是没人理会。
        - id: ch01-b46
          speaker: passenger_2
          text: 船要沉了！快啊，船马上就沉了！
          emotion: fearful
        - id: ch01-b47
          speaker: narrator
          text: 这声喊引起的恐慌一下抓住了我。我裹在涌下去的人群里，翻过了船舷。我不知道自己究竟怎么掉进海中，却立刻明白，水里的人为什么拼命想爬回船上。海水冷得扎人。我一头栽进去时，那疼痛来得又快又尖，像火烧一样咬进骨髓，仿佛死神一把攥住了我。剧痛和冲击逼得我猛吸一口气。救生衣把我弹回水面时，肺里已经装满了气。嘴里的咸味又浓又苦，辛辣的海水呛进喉咙和肺里，我几乎透不过气。
        - id: ch01-b48
          speaker: narrator
          text: 可最难熬的还是寒冷。我觉得自己只能再活几分钟。四周的人都在水里扑腾挣扎，彼此呼喊。我还听见了船桨拍水的声音。看来，那艘陌生汽船已经放下救生艇。时间一点点过去，我惊讶自己竟然还活着。两条腿已经彻底没了知觉，刺骨的麻木裹住心脏，一点点往里钻。小浪不停劈头盖脸地打来，浪尖冒着恶意的白沫，海水一次次灌进嘴里，呛得我剧烈咳嗽。
        - id: ch01-b49
          speaker: narrator
          text: 周围的声音慢慢模糊了。可我还是听见远处最后爆发出一片绝望的尖叫，于是知道，“马丁内斯号”已经沉了。后来过了多久，我完全不知道。我忽然从恐惧中清醒过来，发现身边只剩下我一个人。呼叫和哭喊都消失了，只剩海浪的声音，被浓雾荡成诡异又空洞的回响。
        - id: ch01-b50
          speaker: narrator
          text: 和人群一起慌乱时，至少大家还在共同承受。可孤身一人的恐慌，远比那可怕。我现在尝到的正是这种滋味。我会被水带到哪里？红脸汉子说过，潮水正穿过金门海峡向外退。难道我也在被它拖向大海？身上的救生衣又能撑多久？它会不会突然散开？我听说有些救生衣用纸和空心灯芯草做成，一浸透就再也浮不起来。偏偏我完全不会游泳。
        - id: ch01-b51
          speaker: narrator
          text: 我孤零零漂着，像是落进了一片灰色的洪荒。我承认，我疯了。我也像那些女人一样放声尖叫，用已经麻木的双手不停拍水。
        - id: ch01-b52
          speaker: narrator
          text: 我不知道这样过了多久。中间有一段彻底的空白，像一场痛苦又不安的昏睡，醒来以后什么都不记得。等我再次醒来，仿佛已经过去了好几个世纪。一艘船的船头几乎就在头顶，正从雾里现出来。三面三角帆被风鼓得满满的，一面巧妙地压着另一面。船头劈开海水，卷起大片泡沫，发出汩汩声，而我好像正挡在它的航线上。
        - id: ch01-b53
          speaker: narrator
          text: 我想喊，却已经一点力气也没有。船头向下俯冲，从我身边擦过去，激起的浪兜头浇下。接着，长长的黑色船身贴着我滑过，近得似乎伸手就能碰到。我拼命想抓住它，恨不得把指甲抠进木头，可两条胳膊又重又僵。我再次用尽力气呼救，嘴里却发不出一点声音。
        - id: ch01-b54
          speaker: narrator
          text: 船尾飞快掠过，又落进两道波浪之间的凹谷。我瞥见一个男人站在舵轮旁，还有一个男人好像什么事也没有，只顾抽雪茄。我看见烟从他嘴边吐出来。他慢慢转头，随意扫了一眼我所在的水面。那动作漫不经心，也没有什么目的，就像人无事可做时偶然动一下，只因为还活着，总得动一动。
        - id: ch01-b55
          speaker: narrator
          text: 可那一眼上系着我的生死。我望着船一点点被浓雾吞进去，看见掌舵男人的背影，也看见另一个人的头还在慢慢转。他的目光落在海面上，随随便便扫过来，离我越来越近。他脸上带着恍恍惚惚、像在想事的神情。我突然害怕了。就算他的眼睛落到我身上，他也未必真的能看见我。
        - id: ch01-b56
          speaker: narrator
          text: 终于，他的视线和我的目光撞在一起，直直望进我眼中。他真的看见我了。他猛扑到舵轮旁，把掌舵的人推开，两只手交替着，一圈又一圈飞转舵轮，同时高声下了几句命令。船突然偏离原来的航向，斜着冲开，转眼跃进浓雾，消失了。
        - id: ch01-b57
          speaker: narrator
          text: 我感觉自己正往昏迷里滑。只能用尽全部意志，勉强浮在那片从四周升起、叫人窒息的空白和黑暗上。过了一会儿，我听见船桨拍水的声音越来越近，还有一个男人在呼喊。等他靠得很近，我终于听清了。
        - id: ch01-b58
          speaker: rescuer
          text: 你他妈为什么不出声？
          emotion: angry
        - id: ch01-b59
          speaker: narrator
          text: 我想，这句话是在冲我喊。随后，空白和黑暗漫过头顶，把我吞没了。
