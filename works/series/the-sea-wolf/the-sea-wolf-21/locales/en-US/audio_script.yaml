audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
    mugridge:
      display_name: Thomas Mugridge
      tts:
        delivery: sneering, officious, and quick to bully
        timbre: nasal and wiry
        pace: brisk with sharp bursts
        pitch: medium-high
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: gentle, thoughtful, and composed even when uncertain
        timbre: soft and clear
        pace: measured and natural
        pitch: medium
    oofty_oofty:
      display_name: Oofty-Oofty
      tts:
        delivery: watchful, forceful, and ready to act
        timbre: strong and clear
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER XXI
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Wolf Larsen had been annoyed when Maud Brewster and I left him out of our talk at the table. That annoyance had to break over someone, and Thomas Mugridge became his victim. The cook had cleaned up neither his habits nor his shirt, though he claimed he had changed the shirt. Its dirt told another story. So did the thick grease on his stove, pots, and pans.
        - id: ch01-b02
          speaker: wolf_larsen
          text: >-
            Cooky, I warned you. Now you'll have to take what's coming.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Beneath the soot, Mugridge's face went white. Wolf Larsen called for a rope and two men, and the miserable Cockney bolted from the galley. He ducked and dodged across the deck while the grinning crew chased him. They would have enjoyed nothing more than towing him over the side, because he had been serving the forecastle one vile mess after another.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The day suited their plan. The Ghost was gliding along at no more than three miles an hour, and the sea was fairly calm. But Mugridge wanted no part of that icy water. Perhaps he had watched men being towed before and knew what it meant. And even at the best of times, his body was far from strong.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The off-duty watch and the hunters came out as usual whenever trouble promised entertainment. Fear of the water made Mugridge faster and more nimble than any of us had thought possible. Trapped between the poop and the galley, he sprang onto the cabin roof and raced aft. His pursuers cut him off, so he doubled back over the cabin, crossed the galley, and dropped to the deck through the steerage hatch.
        - id: ch01-b06
          speaker: narrator
          text: >-
            He flew forward with the boat-puller Harrison close behind and gaining. Suddenly Mugridge leaped and caught the jib-boom lift. Hanging by his arms, he folded himself in half and kicked out with both feet. Harrison took the blow square in the stomach. He groaned, doubled over, and fell backward onto the deck.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The hunters clapped and roared with laughter. Mugridge slipped past half the men near the foremast, then charged through the rest like a football runner. He sped all the way to the stern. As he rounded the cabin, his feet slid out from under him. He crashed into Nilson, who stood at the wheel, and both men went down.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Only Mugridge got up. By some strange twist of pressure, his slight body had snapped the strong man's leg as cleanly as a pipe stem.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Parsons took the wheel, and the chase went on. Around the decks they ran, with Mugridge sick from fear, the sailors yelling directions, and the hunters shouting and laughing. Three men brought him down on the forward hatch. Still, he wriggled from beneath them like an eel. His mouth was bleeding and his filthy shirt hung in rags, but he sprang into the main rigging and climbed above the ratlines to the very top of the mast.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Half a dozen sailors swarmed up to the crosstrees and waited there. Two kept climbing. One was Oofty-Oofty. The other was Black, Latimer's boat-steerer. Hand over hand, they pulled themselves higher along the thin steel stays.
        - id: ch01-b11
          speaker: narrator
          text: >-
            They were more than a hundred feet above the deck. They had to hold on with their hands, which left them almost no way to guard against Mugridge's feet. He kicked at them savagely. Oofty-Oofty hung by one hand and caught one of the cook's feet with the other. A moment later, Black copied him and seized the other foot. The three men twisted together in a swaying knot. They struggled and slid downward until they fell into the arms of the sailors waiting on the crosstrees.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The battle in the air was over. Mugridge came down whining and babbling, with bloody foam around his mouth. Wolf Larsen tied a bowline in a rope and slipped the loop beneath the cook's shoulders. The men carried him aft and threw him into the sea.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Forty feet of rope ran out, then fifty, then sixty.
        - id: ch01-b14
          speaker: wolf_larsen
          text: >-
            Belay that line!
        - id: ch01-b15
          speaker: narrator
          text: >-
            Oofty-Oofty wrapped the rope around a bitt. It snapped tight, and the Ghost's forward plunge jerked Mugridge back to the surface.
        - id: ch01-b16
          speaker: narrator
          text: >-
            It was pitiful to watch. Mugridge seemed almost impossible to kill, and the rope kept him from drowning, but he suffered every agony of a man who nearly drowns again and again. The schooner moved slowly. Whenever her stern rose on a wave and she slipped ahead, Mugridge came to the surface and caught one breath. Then the stern dropped, the bow lazily climbed the next wave, and the slack rope let him sink beneath the water once more.
        - id: ch01-b17
          speaker: narrator
          text: >-
            I had forgotten Maud Brewster was aboard until she stepped lightly to my side. This was her first time on deck since her rescue. At once, everyone fell silent.
        - id: ch01-b18
          speaker: maud_brewster
          text: >-
            What was everyone laughing about?
        - id: ch01-b19
          speaker: narrator
          text: >-
            Ask Captain Larsen.
        - id: ch01-b20
          speaker: narrator
          text: >-
            I kept my voice cold and controlled, though my blood boiled at the thought of her seeing such cruelty. She turned to follow my advice, but then she noticed Oofty-Oofty just ahead of her. Every part of him was alert and graceful as he held the rope.
        - id: ch01-b21
          speaker: maud_brewster
          text: >-
            Are you catching a fish?
        - id: ch01-b22
          speaker: narrator
          text: >-
            He did not answer. His eyes stayed fixed on the water behind us. Suddenly, they flashed.
        - id: ch01-b23
          speaker: oofty_oofty
          emotion: surprised
          text: >-
            Shark astern, sir!
        - id: ch01-b24
          speaker: wolf_larsen
          text: >-
            Haul him in! Move! Everyone on the rope!
        - id: ch01-b25
          speaker: narrator
          text: >-
            Wolf Larsen sprang for the line and reached it ahead of the fastest man. Mugridge had heard the warning, and now he screamed wildly. A black fin sliced through the water toward him, moving faster than we could pull him in. The race could have gone either way, and only a few moments remained before the shark reached him.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Just as Mugridge came directly below us, the stern slid down the slope of a wave. That gave the shark its chance. The fin vanished, and a white belly flashed upward. Wolf Larsen moved almost as quickly. Almost. He put all his power into one enormous pull.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Mugridge's body flew out of the sea, and part of the shark rose with him. The cook pulled up his legs. The man-eater seemed barely to brush one foot before it splashed back into the water, but Mugridge cried out at that instant. Then he came flying over the rail like a freshly caught fish on a line. He cleared it easily, struck the deck on his hands and knees, collapsed in a heap, and rolled over.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Blood spurted in a fountain. His right foot was gone, cut off cleanly at the ankle.
        - id: ch01-b29
          speaker: narrator
          text: >-
            I looked straight at Maud. Her face had gone white, and horror widened her eyes. Yet she was not staring at Mugridge. She was staring at Wolf Larsen. He knew it and answered her look with one of his short laughs.
        - id: ch01-b30
          speaker: wolf_larsen
          text: >-
            Just men at play, Miss Brewster. It's rougher play than you're used to, I'll admit, but that's all it was. The shark wasn't part of our plan. It—
        - id: ch01-b31
          speaker: narrator
          text: >-
            Mugridge lifted his head and saw what he had lost. He flung himself across the deck and buried his teeth in Wolf Larsen's leg. Wolf Larsen bent down without alarm. He pressed his thumb and finger behind the cook's jaw and below his ears until the teeth slowly released him. Then he stepped free.
        - id: ch01-b32
          speaker: wolf_larsen
          text: >-
            As I was saying, the shark wasn't part of our plan. Perhaps we should call it Providence.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Maud gave no sign that she had heard. Only her eyes changed, filling with a disgust too deep for words. She had barely started to turn away when she swayed and reached weakly for my hand. I caught her before she fell and helped her sit on the cabin roof. For a moment, I thought she would faint completely, but she forced herself to remain conscious.
        - id: ch01-b34
          speaker: wolf_larsen
          text: >-
            Mr. Van Weyden, get a tourniquet.
        - id: ch01-b35
          speaker: narrator
          text: >-
            I hesitated. Maud's lips moved, but at first no sound came. Her eyes gave me a command as clearly as words could have done. I was to help that unfortunate man.
        - id: ch01-b36
          speaker: maud_brewster
          emotion: fearful
          text: >-
            Please, go help him.
        - id: ch01-b37
          speaker: narrator
          text: >-
            I could only obey. By then I had learned enough surgery that Wolf Larsen gave me a little advice, left me with two sailors, and let me work. He had chosen another task for himself. He meant to take revenge on the shark.
        - id: ch01-b38
          speaker: narrator
          text: >-
            A heavy swivel hook baited with fat salt pork went over the side. By the time I had clamped Mugridge's severed veins and arteries, the sailors were singing together as they hauled the monster in. I never saw it myself. My two assistants supplied the details. First one and then the other abandoned me for a few moments to run amidships and see what was happening.
        - id: ch01-b39
          speaker: narrator
          text: >-
            They told me the shark was sixteen feet long. The men hoisted it against the main rigging and forced its jaws as wide apart as they would go. Then they sharpened both ends of a stout stake and wedged it between the jaws. They took away the tools they had used to pry the mouth open, leaving the jaws fixed around the stake. The shark could no longer close them.
        - id: ch01-b40
          speaker: narrator
          text: >-
            At last, they cut out the hook and dropped the shark back into the sea. It still had all its strength, but it was helpless and condemned to starve slowly. Such a living death would have suited the man who invented the punishment better than the creature that suffered it.
