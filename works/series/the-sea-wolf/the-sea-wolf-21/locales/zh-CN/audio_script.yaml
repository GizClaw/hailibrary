audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
    oofty_oofty:
      display_name: 乌夫蒂—乌夫蒂
      tts:
        delivery: 警觉利落，危急时果断高喊
        timbre: 明亮结实的成年男声
        pace: 简洁迅速
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二十一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            餐桌上，莫德·布鲁斯特和我只顾彼此交谈，把海狼·拉森冷落在一边。他受不了这份难堪，总要找个人发泄，托马斯·马格里奇便倒了霉。厨子没改掉那些坏毛病，也没补衬衫。他硬说身上这件已经换过，可衣服的模样并不替他作证。炉灶和大小锅子上积满油垢，也看不出他有半点爱干净的意思。
        - id: ch01-b02
          speaker: wolf_larsen
          text: 厨房佬，我早就警告过你。现在，该你吃药了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            马格里奇那张烟灰蒙面的脸一下白了。拉森叫人拿绳子，再叫两个水手过来，他便冲出厨房，发疯似的在甲板上躲闪。船员们咧嘴笑着追在后面。大家早就受够了他送进水手舱的肮脏饭菜，那些乱七八糟的东西简直没法下咽。眼下能把他拖到舷外泡一回，正合所有人的心意。条件也很合适。“幽灵号”每小时只走三英里，海面相当平静。可马格里奇一点也不想下水。他大概见过别人受这种刑罚，知道会是什么滋味。何况海水冷得吓人，他的身体又十分虚弱。
        - id: ch01-b04
          speaker: narrator
          text: >-
            休班的水手和猎手都跑来看热闹。马格里奇怕水怕得发狂，竟跑得又快又灵活，完全出乎众人意料。他被堵在艉楼和厨房夹成的角落里，便像猫一样跳上舱顶，朝船尾飞奔。前路有人抢先拦截，他立刻折回来，冲过舱顶，越过厨房，再从中舱升降口跳回甲板，一路直奔船头。划艇手哈里森紧追不舍，距离越来越近。眼看就要抓到人，马格里奇忽然跃起，抓住艏三角帆斜桁的吊索。整个动作只在眨眼间。他双臂吊住身体，腰一折，两脚猛踹出去，正中哈里森的心窝。哈里森闷哼一声，弯下身子，向后倒在甲板上。
        - id: ch01-b05
          speaker: narrator
          text: >-
            猎手们拍手狂笑。马格里奇在前桅旁甩开一半追兵，又像球场上的跑锋那样穿过其余的人，一口气冲上艉楼，沿着艉楼奔向船尾。他绕过舱房一角时跑得太快，脚下一滑，撞上了掌舵的尼尔森。两个人同时倒地，只有马格里奇爬了起来。也不知两股力道怎么凑到一起，他这副单薄身板，竟把壮汉的腿撞得像烟斗杆一样断了。
        - id: ch01-b06
          speaker: narrator
          text: >-
            帕森斯接过舵轮，其他人继续追赶。马格里奇吓得要命，在甲板上一圈又一圈地逃。水手们互相吆喝，大声告诉同伴该往哪边堵。猎手们则粗着嗓子，又是助威，又是大笑。三个人终于在前舱口把他压倒，他却像鳗鱼一样从人堆里钻了出来。此时他嘴里流着血，那件惹祸的衬衫也已经撕成碎片。可他仍没停下，转身扑向主桅索具，一路往上爬，越过绳梯，直逃到桅顶。
        - id: ch01-b07
          speaker: narrator
          text: >-
            五六个水手追上桅楼，挤在那里等着。乌夫蒂—乌夫蒂和拉蒂默艇上的舵手布莱克却继续往上，只凭双臂攀着细钢索，一点点逼近他。这实在危险。他们离甲板一百多英尺，双手还要抓牢钢索，根本没有合适的姿势躲开马格里奇乱踢的脚。马格里奇一脚接一脚，踢得又狠又急。乌夫蒂单手吊住身体，终于腾出另一只手，抓住他一只脚。布莱克随即抓住另一只。三个人在摇荡的高空绞成一团，一边扭动挣扎，一边向下滑，最后一起跌进桅楼上同伴们的怀里。
        - id: ch01-b08
          speaker: narrator
          text: >-
            高空中的争斗总算结束。马格里奇被押回甲板时，还在呜咽乱叫，嘴边全是带血的泡沫。拉森在一段绳子上打好单套结，套到他腋下。众人随即把他抬到船尾，直接扔进海里。绳子飞快放出四十英尺，五十英尺，又到了六十英尺，拉森才下令系住。乌夫蒂把绳子在系缆桩上绕了一圈。绳索猛然绷紧，向前冲去的“幽灵号”一下把厨子扯回水面。
        - id: ch01-b09
          speaker: narrator
          text: >-
            那场面实在可怜。他被绳子拴着，不会真正淹死，命也硬得像有九条，却一直在受半淹死的全部折磨。“幽灵号”走得很慢。每次船尾随浪抬起、向前滑动，他才会被拖上水面，得到短短一口喘息。两道浪之间，船尾又落下去，船头则懒洋洋地爬上下一道浪。绳子一松，他就重新沉进冰冷的海水里。
        - id: ch01-b10
          speaker: narrator
          text: >-
            我早忘了莫德还在船上。直到她轻轻走到我身边，我才猛然想起她来。这是她登上“幽灵号”以后第一次来到甲板。她一出现，刚才还在叫喊大笑的四周，立刻静得没有一点声音。
        - id: ch01-b11
          speaker: maud_brewster
          text: 大家为什么这样高兴？
        - id: ch01-b12
          speaker: humphrey
          text: 去问拉森船长吧。
        - id: ch01-b13
          speaker: narrator
          text: >-
            我说得平静而冷淡，心里的血却在沸腾。这样的暴行，竟要让她亲眼看见。她听了我的话，正准备去问拉森，忽然看见身旁的乌夫蒂。他握着绕在系缆桩上的绳索，全身警觉，动作轻捷。
        - id: ch01-b14
          speaker: maud_brewster
          text: 你是在钓鱼吗？
        - id: ch01-b15
          speaker: narrator
          text: 乌夫蒂没有回答。他死死盯住船尾的海面，眼睛忽然一亮。
        - id: ch01-b16
          speaker: oofty_oofty
          text: 鲨鱼！船长！
          emotion: surprised
        - id: ch01-b17
          speaker: wolf_larsen
          text: 拉回来！快！所有人一起上！
        - id: ch01-b18
          speaker: narrator
          text: >-
            拉森喊着扑向绳索，比动作最快的人还快。马格里奇也听见了警告，顿时疯狂尖叫。我看见一片黑鳍劈开海水，直朝他游去，速度比我们往回拉他更快。鲨鱼和我们谁能先抢到他，机会几乎各占一半，只剩短短几秒。等马格里奇来到船尾正下方，船艉恰好顺着一道经过的浪往下沉，鲨鱼便占了上风。黑鳍突然消失，雪白的肚腹向上一闪。拉森的动作几乎同样快，可还是差了一点。他把全身力气都压上去，猛拉绳索。马格里奇离开水面，鲨鱼也跟着冲出一截。他赶紧缩起双腿，那条食人鲨仿佛只擦到一只脚，便哗啦一声落回水里。可就在碰上的一刻，马格里奇惨叫起来。他像刚钓到的鱼一样被拖上来，高高越过舷栏，手脚着地摔成一团，又滚倒在甲板上。
        - id: ch01-b19
          speaker: narrator
          text: >-
            鲜血像喷泉一样涌出来。他的右脚没了，从脚踝处断得整整齐齐。我马上去看莫德。她脸色惨白，双眼惊恐地睁大。她看的不是马格里奇，而是拉森。拉森也知道她在看自己，短短笑了一声。
        - id: ch01-b20
          speaker: wolf_larsen
          text: >-
            这是男人们的游戏，布鲁斯特小姐。比你见惯的粗野一些，不过还是男人们的游戏。鲨鱼本来可不在盘算里。它——
        - id: ch01-b21
          speaker: narrator
          text: >-
            马格里奇偏在这时抬起头，看清自己究竟失去了什么。他在甲板上挣扎着翻过身，一口咬住拉森的腿。拉森却毫不慌乱。他镇定地弯下腰，用拇指和食指按住马格里奇耳朵下方、下颌后面。那两排牙齿很不情愿地松开，拉森抽回腿，接着原来的话说了下去，仿佛刚才什么也没发生。
        - id: ch01-b22
          speaker: wolf_larsen
          text: 我刚才说，鲨鱼不在盘算里。那是……嗯……就说是天意吧？
        - id: ch01-b23
          speaker: narrator
          text: >-
            莫德没有任何表示，像是根本没听见，眼里的神情却变成了说不出的厌恶。她刚想转身，身体便摇晃起来，踉跄着站不稳，只能无力地朝我伸手。我及时接住她，没让她倒下，又扶她坐到舱顶。我以为她会就这样彻底昏过去，可她还是控制住了自己。
        - id: ch01-b24
          speaker: wolf_larsen
          text: 范韦登先生，去拿一条止血带来，好吗？
        - id: ch01-b25
          speaker: narrator
          text: >-
            我迟疑了。莫德动了动嘴唇，没有发出声音，只用眼神清清楚楚地催我去救那个不幸的人。
        - id: ch01-b26
          speaker: maud_brewster
          text: 求你……
        - id: ch01-b27
          speaker: narrator
          text: >-
            我只能照办。那时，我处理外伤已经相当熟练。拉森只交代几句，就让两个水手留下来协助我，自己挑了一件新差事，那就是找鲨鱼复仇。他们把一大块肥咸猪肉挂在沉重的旋转钩上，再把钩子放到舷外。等我压住马格里奇断处的动脉和静脉，水手们已经唱起号子，正合力把那头闯祸的怪物往上拖。
        - id: ch01-b28
          speaker: narrator
          text: >-
            我没有亲眼看见后面的事，可两个助手先后扔下我一小会儿，跑到船中部观看，再回来把经过告诉我。那条鲨鱼足有十六英尺长，被吊在主桅索具旁。人们把它的上下颌撬到最大，再拿一根两头削尖的粗木桩撑进嘴里。撬具撤掉以后，那张大嘴便死死咬住木桩。接着，他们割下鱼钩，把鲨鱼扔回海里。它仍有全部力气，却再也无法捕食，只能在无助中慢慢饿死。这样的活地狱，与其给鲨鱼，倒更适合那个想出这刑罚的人。
