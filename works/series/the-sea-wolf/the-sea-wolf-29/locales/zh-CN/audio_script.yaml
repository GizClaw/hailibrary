audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十九章
      blocks:
        - id: ch01-b01
          speaker: humphrey
          text: 我真是个蠢货！
          emotion: angry
        - id: ch01-b02
          speaker: narrator
          text: >-
            我懊恼得骂出了声。小艇已经卸空，东西也全搬到了海滩高处。我正忙着扎营。滩上的浮木不多，可一看见从“幽灵号”食品储藏室带来的咖啡罐，我就想生一堆火。
        - id: ch01-b03
          speaker: humphrey
          text: 我真是个十足的白痴！
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 莫德轻轻“啧”了一声，叫我别这样责骂自己，又问我到底做错了什么。
        - id: ch01-b05
          speaker: humphrey
          text: >-
            我没带火柴，一根也没有。热咖啡喝不成了，热汤、热茶也全都没有了！
        - id: ch01-b06
          speaker: maud_brewster
          text: 鲁滨孙……不是拿两根木棍摩擦生火的吗？
        - id: ch01-b07
          speaker: humphrey
          text: >-
            可我看过二十来个海难幸存者的亲身记述。他们都试过，没有一个成功。我还认识报人温特斯。他跑过阿拉斯加和西伯利亚，很有名气。有一回在“珍本集”，他讲起自己拿两根木棍生火的经过，把大家逗得不行，可那终究是一次失败。他最后黑眼睛一闪，说：“诸位，南海岛民也许做得到，马来人也许做得到。不过相信我，白人绝对没有这个本事。”
        - id: ch01-b08
          speaker: maud_brewster
          text: 没有火，我们不是也撑到这里了吗？往后照样能撑下去。
        - id: ch01-b09
          speaker: humphrey
          text: 可那咖啡怎么办？那是上好的咖啡，是我从拉森自己的储藏里拿来的。你再看看这些好木柴！
        - id: ch01-b10
          speaker: narrator
          text: >-
            我确实馋极了咖啡，后来才知道，莫德也有这个小小的嗜好。我们吃冷食已经太久，不只是身体外面冷，连肚子里也像冻得发木。不管是什么，只要热乎乎的，都会叫人舒服得不得了。不过我没再抱怨，转身拿船帆替莫德搭帐篷。
        - id: ch01-b11
          speaker: narrator
          text: >-
            我本以为这很容易。船桨、桅杆、帆桁、斜桁，还有许多绳索，什么都不缺。可我一点经验也没有，每个细节都得从头试验，每成功一个细节，都像是我刚刚发明出来的。直到天快黑，给她遮风避雨的地方才算搭好。那夜偏又下雨，帐篷里面灌满了水，莫德只好被逼回小艇。
        - id: ch01-b12
          speaker: narrator
          text: >-
            第二天早上，我在帐篷四周挖了一道浅沟。才过一个钟头，疾风从背后的岩壁上卷下来，整顶帐篷被掀上半空，摔在三十码外。莫德瞧着我那副泄气的样子，忍不住笑了。
        - id: ch01-b13
          speaker: humphrey
          text: >-
            等风停了，我要划船把岛探一遍。岛上一定有驻站，也一定有人，船还得定期来。这里这么多海豹，总会有政府派人保护。不过走以前，我得先让你住得舒服些。
        - id: ch01-b14
          speaker: maud_brewster
          text: 我想跟你一起去。
        - id: ch01-b15
          speaker: humphrey
          text: >-
            你留下比较好。你吃了这么多苦，能活到现在已经是奇迹。雨天坐在小艇里又划又驶，一点也不舒服。你需要的是休息。我希望你留下，睡一觉，好好歇着，什么都别做。
        - id: ch01-b16
          speaker: narrator
          text: 她美丽的眼睛泛起水光。她垂下眼，把脸稍稍转开。
        - id: ch01-b17
          speaker: maud_brewster
          text: 我还是想跟你去。也许我能帮你一……一点忙。要是你出了什么事，只留下我一个人在这里，我该怎么办？
          emotion: sad
        - id: ch01-b18
          speaker: humphrey
          text: >-
            我会很小心，也不会走太远，天黑前一定回来。怎么想，都是你留下更好。你只管睡觉、休息，别的什么都不用做。
        - id: ch01-b19
          speaker: narrator
          text: 她转回来望着我的眼睛。目光坚定，却又柔和。
        - id: ch01-b20
          speaker: maud_brewster
          text: 求你了，求你。
        - id: ch01-b21
          speaker: narrator
          text: >-
            我硬起心肠摇了摇头，她却仍旧望着我，静静地等。我刚想说出拒绝的话，心就软了。她眼里一下亮起喜悦的光，我知道自己已经输了。那样看着她，我根本说不出“不”字。
        - id: ch01-b22
          speaker: narrator
          text: >-
            下午，风停了，我们准备第二天一早出发。从自己的小湾根本走不进岛内。岩壁紧贴着沙滩直立而起，小湾两边更是从深水里拔上去的。次日破晓，天色阴沉，却很平静。我早早醒来，收拾好了小艇。
        - id: ch01-b23
          speaker: humphrey
          text: 我真是个蠢货、笨蛋、野人！
          emotion: happy
        - id: ch01-b24
          speaker: narrator
          text: >-
            我觉得该叫醒莫德了，便故意装出绝望的样子，光着头在海滩上又喊又跳。这次可不是懊恼，我高兴得很。她的脑袋从船帆帘口底下探了出来。
        - id: ch01-b25
          speaker: maud_brewster
          text: 又怎么了？
        - id: ch01-b26
          speaker: narrator
          text: 她还没睡醒，语气里却已经有了好奇。
        - id: ch01-b27
          speaker: humphrey
          text: 咖啡！想不想来一杯？热咖啡，滚烫滚烫的咖啡！
          emotion: happy
        - id: ch01-b28
          speaker: maud_brewster
          text: >-
            哎呀，你吓了我一跳。你可真狠心。我好不容易才打点好精神，准备再也不喝咖啡了，你又拿这种办不到的事来逗我。
        - id: ch01-b29
          speaker: humphrey
          text: 你看着就是。
        - id: ch01-b30
          speaker: narrator
          text: >-
            我从岩缝下面找到几根干枝和木片，削出刨花，再劈出引火的小柴。我从笔记本撕下一页纸，又从弹药箱拿出一发霰弹。先用小刀挑出弹塞，把火药倒在平石上，再撬下弹壳底部的底火帽，放进火药中央。莫德一直从帐篷里看着。
        - id: ch01-b31
          speaker: narrator
          text: >-
            我左手拿纸，右手握住石块，猛地砸向底火帽。白烟一冒，火光一闪，纸张毛糙的边缘燃烧起来。莫德欢喜得拍起手。
        - id: ch01-b32
          speaker: maud_brewster
          text: 你真是普罗米修斯！
          emotion: happy
        - id: ch01-b33
          speaker: narrator
          text: >-
            我忙着照料火苗，顾不上回应她。那点火要活下去，就得小心呵护。我一片刨花、一丝木屑地喂，直到它抓住细枝和小木片，噼噼啪啪地烧起来。我们没料到会流落荒岛，连水壶和炊具都没有，只能拿舀船水的铁皮罐凑合。后来罐头吃得越来越多，空罐子也慢慢凑成了一套像模像样的炊具。
        - id: ch01-b34
          speaker: narrator
          text: >-
            我烧水，莫德煮咖啡。那滋味真是好极了。我拿罐头牛肉拌上捏碎的船用硬饼和水，放在火上煎。这顿早饭十分成功。我们围着火坐了很久，早把探险家的进取心抛到一边，只顾喝着滚热的黑咖啡，商量自己的处境。
        - id: ch01-b35
          speaker: narrator
          text: >-
            我相信，某处海湾里一定有驻站。白令海的海豹繁殖场向来有人这样守卫。莫德却猜，也许我们发现的是一处从未有人知道的繁殖场。我想，她是怕希望落空，所以先叫我有个准备。不过她兴致很好，甚至笑着接受了我们处境十分严重这件事。
        - id: ch01-b36
          speaker: humphrey
          text: >-
            要是你猜对了，我们就得留在岛上过冬。食物撑不了那么久，不过这里有海豹。它们秋天会离开，我得赶紧储存肉食。我们还要搭屋子、捡浮木、熬海豹油照明。岛上要是真没人，等着我们的活可多了。可我知道，一定不会这样。
        - id: ch01-b37
          speaker: narrator
          text: >-
            结果还是莫德说对了。我们借侧风沿着海岸航行，用望远镜查看每一处海湾，有时也把船靠岸，亲自登上去搜索，却连一点人迹也没找到。不过，在与我们相隔两个海湾的那片沙滩高处，我们发现了一艘破碎的小艇。这证明，在我们以前，还有人登上过奋进岛。
        - id: ch01-b38
          speaker: narrator
          text: >-
            那是捕海豹船的小艇。桨架缠着编绳，船头右舷装着枪架，艇身还隐约看得出白字：“羚羊号”二号艇。它在那里躺了很久，已经被沙子埋了一半，碎木也被风雨侵蚀得厉害。我从艇尾座板间找到一支生锈的十号霰弹枪，还有一把拦腰折断的水手鞘刀。刀也锈得快认不出了。
        - id: ch01-b39
          speaker: humphrey
          text: 他们一定逃出去了。
        - id: ch01-b40
          speaker: narrator
          text: >-
            我故意说得很轻快，心却沉了下去。我仿佛已经感觉到，这片沙滩的某个地方，正散落着晒白的人骨。
        - id: ch01-b41
          speaker: narrator
          text: >-
            我不想让这番发现坏了莫德的心情，便把船驶回海上，沿岸绕过岛的东北端。南岸一处沙滩也没有。下午刚开始不久，我们绕过黑色海岬，也绕完了整座岛。我估计岛屿周长二十五英里，宽度从两英里到五英里不等。就算用最保守的算法，各处海滩上也有二十万只海豹。
        - id: ch01-b42
          speaker: narrator
          text: >-
            全岛最高的是最西南端。海岬和贯穿岛屿的山脊从那里一路降低，到了东北部，只高出海面几英尺。除了我们的小湾，其余沙滩都缓缓向内升高，延伸约半英里，像是一片片岩石草场，上面零星长着苔藓和冻原草。海豹就在这里上岸。年老的公海豹各自守着妻妾成群的地盘，年轻的公海豹则独自聚在另一处。
        - id: ch01-b43
          speaker: narrator
          text: >-
            奋进岛值得一说的，也就只有这些。没有尖石和岩地的地方，便是湿透的泥泞。风暴不断捶打着这座岛，海浪不停抽打着海岸。二十万只两栖兽终日吼叫，连空气都一直发颤。这里阴郁又凄凉，实在是一处悲惨的栖身之地。
        - id: ch01-b44
          speaker: narrator
          text: >-
            莫德本来是怕我失望，才先提出最坏的猜想。这一天，她也始终轻快活泼。可回到自己的小湾，一踏上岸，她就撑不住了。她竭力不让我看见。我点燃另一堆火时，却知道她正躲在船帆帐篷下面，把脸埋进毯子，拼命忍住哭声。
        - id: ch01-b45
          speaker: narrator
          text: >-
            现在该由我打起精神了。我使出浑身解数，总算让她亲爱的眼睛重新有了笑意，嘴唇也重新有了歌声。她很早便去睡了，睡前还唱歌给我听。这是我第一次听她唱歌。我躺在火边，听得出了神。她无论做什么，都是个真正的艺术家。她的嗓音并不洪亮，却甜美极了，感情也那样丰富。
        - id: ch01-b46
          speaker: narrator
          text: >-
            我依旧睡在小艇里。那天夜里，我久久没有合眼，抬头望着多日来第一次看见的星辰，一遍遍思量我们的处境。像这样的责任，我从来没有担过。海狼拉森说得一点不错，我过去一直靠父亲的两条腿站着。钱财有律师和代理人替我照管，我自己从来不用对任何事负责。
        - id: ch01-b47
          speaker: narrator
          text: >-
            到了“幽灵号”上，我才学会为自己负责。可现在，我生平第一次还要为另一个人负责，而我必须担起的，偏偏又是最沉重的责任。因为她是世上唯一的女人，是我心里深爱着的那个小小的女人。
