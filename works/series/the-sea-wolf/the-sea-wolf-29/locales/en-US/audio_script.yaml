audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
  chapters:
    - id: ch01
      title: CHAPTER XXIX
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Fool! I cried out in vexation. I had unloaded the boat and carried everything well up the beach, where I had begun making camp. There was a little driftwood nearby, and a coffee tin from the Ghost's pantry had put the thought of a fire into my head. Blithering idiot! I went on.
        - id: ch01-b02
          speaker: maud_brewster
          text: >-
            Tut, tut. And why are you a blithering idiot?
        - id: ch01-b03
          speaker: narrator
          emotion: sad
          text: >-
            I didn't bring any matches. Not one. So there'll be no hot coffee, no soup, no tea. Nothing hot at all!
        - id: ch01-b04
          speaker: maud_brewster
          text: >-
            Wasn't it, well, Crusoe who made fire by rubbing sticks together?
        - id: ch01-b05
          speaker: narrator
          text: >-
            I've read the accounts of twenty shipwrecked men who tried that and failed. I once met Winters at the Bibelot, the newspaperman who knew Alaska and Siberia. He told us how he tried to start a fire with two sticks. The way he told it was wonderfully funny, but the attempt itself was a failure. I can still see his black eyes flashing when he reached his conclusion. He said, “Gentlemen, the South Sea Islander may do it, and the Malay may do it, but take my word for it. The white man cannot.”
        - id: ch01-b06
          speaker: maud_brewster
          emotion: happy
          text: >-
            Well, we've done without a fire until now. I see no reason we can't keep doing without one.
        - id: ch01-b07
          speaker: narrator
          text: >-
            But think of the coffee! It's good coffee, too. I took it from Larsen's private stores. And just look at all that good wood.
        - id: ch01-b08
          speaker: narrator
          text: >-
            I badly wanted that coffee. Not long afterward, I learned that Maud had the same small weakness. We had eaten cold food for so long that we felt chilled through and through, and anything warm would have been a blessing. Still, I stopped complaining and began making a tent for her out of the sail.
        - id: ch01-b09
          speaker: narrator
          text: >-
            I had expected the job to be easy. We had oars, a mast, a boom, a sprit, and plenty of line. But I had no experience. Every detail was an experiment, and every success felt like a new invention. Most of the day was gone before her shelter finally stood. Then it rained that night. Water flooded the tent and drove her back into the boat.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The next morning, I dug a shallow ditch around the tent. An hour later, a sudden gust whipped over the rocky wall behind us. It lifted the whole shelter and smashed it onto the sand thirty yards away.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Maud laughed when she saw my fallen face. I told her that as soon as the wind eased, I meant to take the boat and explore the island. There had to be a station somewhere, with men living there. Ships must come to it, and some government must be protecting all those seals. But before I left, I wanted to make her comfortable.
        - id: ch01-b12
          speaker: maud_brewster
          text: >-
            I would like to come with you.
        - id: ch01-b13
          speaker: narrator
          text: >-
            I thought it would be better for her to stay. She had already suffered more than enough, and it was a miracle that she had survived. Rowing and sailing in the rain would be miserable. What she needed was sleep and rest, and I wanted her to remain behind and have both.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Her beautiful eyes grew suspiciously moist. Then she lowered them and turned her head partly away.
        - id: ch01-b15
          speaker: maud_brewster
          emotion: sad
          text: >-
            I would rather go with you. I might be able to help you a little. And if something happened to you, think of me here all alone.
        - id: ch01-b16
          speaker: narrator
          text: >-
            I promised to be very careful. I would not go any farther than I could travel and still return before dark. Even after considering everything, I said, it seemed far better for her to stay, sleep, rest, and do nothing.
        - id: ch01-b17
          speaker: narrator
          text: >-
            She turned and met my eyes. Her look was steady but soft.
        - id: ch01-b18
          speaker: maud_brewster
          emotion: sad
          text: >-
            Please. Please.
        - id: ch01-b19
          speaker: narrator
          text: >-
            I braced myself to refuse and shook my head. She kept waiting, her eyes still on mine. I tried to shape the words, but my resolve gave way. A glad light sprang into her eyes, and I knew I had lost. After that, saying no was impossible.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The wind fell during the afternoon, and we made ready to leave the next morning. We could not cross the island from our cove. The walls rose straight from the beach behind us and straight from deep water on either side.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Morning came dull and gray, though the air was calm. I woke early and prepared the boat. When the time came to wake Maud, I danced bareheaded around the beach in mock despair, shouting, “Fool! Imbecile! Yahoo!” This time, I was laughing.
        - id: ch01-b22
          speaker: maud_brewster
          text: >-
            What is it now?
        - id: ch01-b23
          speaker: narrator
          text: >-
            Her head appeared beneath the flap of the sail. She was sleepy, but curious.
        - id: ch01-b24
          speaker: narrator
          emotion: happy
          text: >-
            Coffee! How would you like a cup of coffee? Hot coffee, piping hot?
        - id: ch01-b25
          speaker: maud_brewster
          text: >-
            My, you startled me. And how cruel you are! I've just been teaching my soul to live without coffee, and now you torment me with promises that can't come true.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Just watch me.
        - id: ch01-b27
          speaker: narrator
          text: >-
            I searched the cracks beneath the rocks and gathered a few dry sticks and chips. Some I shaved thin with my knife, and some I split for kindling. Then I tore a page from my notebook and took a shotgun shell from the ammunition box. I pulled out the wads, poured the powder onto a flat rock, and pried the primer from the shell. I set the primer in the middle of the powder. Everything was ready, and Maud watched from the tent.
        - id: ch01-b28
          speaker: narrator
          text: >-
            I held the paper in my left hand. With my right, I brought a rock down hard on the primer. White smoke puffed up, flame burst out, and the rough edge of the paper caught fire.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Maud clapped her hands in delight.
        - id: ch01-b30
          speaker: maud_brewster
          emotion: happy
          text: >-
            Prometheus!
        - id: ch01-b31
          speaker: narrator
          text: >-
            I was too busy to answer. That weak little flame had to be nursed with care if it was going to live. I gave it one shaving at a time, then one sliver at a time. At last, it seized the smaller chips and sticks and began to snap and crackle.
        - id: ch01-b32
          speaker: narrator
          text: >-
            I had never planned on being cast away, so we had no kettle or proper cooking tools. I managed with the tin we used to bail the boat. Later, as we emptied our cans of food, we built up quite an impressive collection of pots and pans.
        - id: ch01-b33
          speaker: narrator
          text: >-
            I boiled the water, but Maud made the coffee. How good it tasted! I fried canned beef with crumbled sea biscuit and water. Breakfast was a great success. We sat beside the fire far longer than serious explorers should have, sipping the hot black coffee and talking about our situation.
        - id: ch01-b34
          speaker: narrator
          text: >-
            I felt certain we would find a station in one of the coves, because I knew the seal rookeries of the Bering Sea were guarded that way. Maud offered another possibility. I believe she wanted to prepare me in case we were disappointed. Perhaps, she suggested, we had discovered a rookery no one knew about. Even so, she was in excellent spirits and made merry over how grave our trouble might be.
        - id: ch01-b35
          speaker: narrator
          text: >-
            If you're right, then we'll have to prepare for winter here. Our food won't last, but we have the seals. They'll leave in the fall, so I must soon start storing meat. We'll need to build huts, gather driftwood, and melt seal fat for lamps. If the island is empty, we'll have more than enough work. But it won't be empty. I know that.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Maud was right. With the wind blowing across our side, we sailed along the shore. We studied each cove through the glasses and sometimes went ashore, but we found no trace of people.
        - id: ch01-b37
          speaker: narrator
          text: >-
            We did learn that someone had landed on Endeavour Island before us. In the second cove beyond our own, high on the beach, we found the broken remains of a boat. It had belonged to seal hunters. The rowlocks were wrapped in braided cord, and a gun rack stood on the starboard side of the bow. Faded white letters still read, “Gazelle Number Two.”
        - id: ch01-b38
          speaker: narrator
          text: >-
            The wreck had been there for a long time. Sand half filled it, and long exposure had worn the splintered wood gray. In the stern, I found a rusty ten-gauge shotgun and a sailor's sheath knife. The knife had broken short across the blade, and the rust had nearly eaten away its shape.
        - id: ch01-b39
          speaker: narrator
          text: >-
            They got away.
        - id: ch01-b40
          speaker: narrator
          text: >-
            I tried to sound cheerful, though my heart sank. I could almost feel that somewhere on that beach, bleached bones were waiting to be found.
        - id: ch01-b41
          speaker: narrator
          text: >-
            I did not want the discovery to darken Maud's spirits, so I took the boat back out to sea and followed the shore around the island's northeastern point. The southern side had no beaches. By early afternoon, we rounded the black headland and completed our journey all the way around.
        - id: ch01-b42
          speaker: narrator
          text: >-
            I judged the island to be about twenty-five miles around and between two and five miles wide. Even my lowest estimate put two hundred thousand seals on its shores. The land rose highest at the far southwestern point. From there, the headlands and the island's rocky spine sank steadily until the northeastern end stood only a few feet above the sea.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Our small cove was the exception. Everywhere else, the beaches climbed gently for half a mile into rocky meadows, with scattered patches of moss and tundra grass. The seals came ashore there. Old bulls guarded their harems, while the young bulls gathered apart from them.
        - id: ch01-b44
          speaker: narrator
          text: >-
            What else can I say about Endeavour Island? Where it was not jagged and rocky, it was damp and sodden. Storm winds battered it, and the sea beat against it. The bellowing of two hundred thousand seals kept the air trembling without pause. It was a bleak and miserable place to live.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Maud had tried to prepare me for disappointment. She had also stayed bright and lively throughout the day. But when we landed in our own little cove, her courage gave way. She tried bravely to hide it. While I started another fire, though, I knew she was under the blankets in the sail tent, holding back her sobs.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Now it was my turn to be cheerful. I played the part as well as I could, and somehow I succeeded. Laughter returned to her dear eyes, and a song came to her lips. Before going early to bed, she sang to me.
        - id: ch01-b47
          speaker: narrator
          text: >-
            I had never heard her sing before. I lay beside the fire, listening in wonder. She was an artist in everything she did. Her voice was not strong, but it was wonderfully sweet and full of feeling.
        - id: ch01-b48
          speaker: narrator
          text: >-
            I still slept in the boat. That night, I stayed awake for a long time, looking up at the first stars I had seen in many nights and thinking over our position.
        - id: ch01-b49
          speaker: narrator
          text: >-
            This kind of responsibility was new to me. Wolf Larsen had been right. Until then, I had stood on my father's legs. Lawyers and agents had looked after my money, and I had carried no real responsibility at all. Aboard the Ghost, I had finally learned to answer for myself.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Now, for the first time, another person depended on me. And the responsibility could not have been more serious. She was the one woman in all the world, the one small woman, as I loved to think of her.
