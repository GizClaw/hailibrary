cover_prompt: |-
  A wordless cover scene on the North Pacific in the early twentieth century shows a sealing schooner driving through a broad blue-gray swell beneath a clearing storm. At the wheel stands a powerful captain of about thirty-five, with a massive build, broad shoulders, deep chest, bronzed face, and steady gray eyes touched with golden flecks, dressed in practical dark seafaring clothes. Near the mast, a slender thirty-five-year-old former literary gentleman braces his newly strengthened body against the deck while hauling a wet rope with both hands. The schooner heels as its canvas fills and sea spray arcs across the bow, making the struggle to guide the vessel the clear focal action. Use a wide view from slightly above deck level, with rigging forming strong diagonals and generous calm sky at the top for title placement. Keep the ship, clothing, tools, and figures faithful to Pacific sealing life around 1904, with energetic but non-frightening weather and no reference to any screen adaptation. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
