audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十六章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            接连两天，莫德和我在海上来回寻找，也把海滩一带带搜过去，却始终不见那些桅杆。第三天，我们终于找到了全部圆材，连人字架也找到了。可它们偏偏困在西南海岬下面，那里阴森险恶，拍岸浪一下接一下地砸下来，偏是最危险的去处。我们拼命干活。第一天一直忙到天色完全暗下去，才拖着主桅回到小海湾。一路没有一丝风，我们精疲力尽，几乎每一英寸路程都是自己划回来的。
        - id: ch01-b02
          speaker: narrator
          text: >-
            又苦干了危险而叫人心碎的一天，两根上桅也总算回到了营地。再下一天，我已经急得不顾一切，把前桅、前后帆桁和两根斜桁扎成一只木筏。原想趁顺风张帆拖回去，谁知风向先是处处跟我们作对，接着完全停住。我们只得摇桨，小艇却慢得像蜗牛。每一次把全部力气和体重压在船桨上，船身才要向前一蹿，就被后面那堆沉重木料拽住。这种活儿一点也振奋不了人，只会叫人越划越灰心。
        - id: ch01-b03
          speaker: narrator
          text: >-
            天黑下来，事情又变得更糟，迎面忽然起了风。小艇不但完全停住，还渐渐倒退，向外海漂去。我一直同船桨搏斗，直到全身脱力。莫德也把仅有的力气全用尽了。她从来不肯少做一点，这时只能虚弱地靠在船尾。我再也划不动。双手又肿又伤，已经握不拢桨柄，手腕和臂膀疼得无法忍受。中午明明吃得很饱，此刻却因为干得太狠，又饿得眼前发昏。我收起船桨，俯身去解拖木筏的绳子，莫德猛地伸手按住我。
        - id: ch01-b04
          speaker: maud_brewster
          text: 你要干什么？
        - id: ch01-b05
          speaker: humphrey
          text: 把这些木料放掉。
        - id: ch01-b06
          speaker: narrator
          text: 我已经松开一圈绳，莫德却把我的手抓得更紧。
        - id: ch01-b07
          speaker: maud_brewster
          text: 求你了，别放。
        - id: ch01-b08
          speaker: humphrey
          text: 再拖下去也没用。天黑了，风还在把我们往外海吹。
        - id: ch01-b09
          speaker: maud_brewster
          text: >-
            汉弗莱，你想想。要是不能乘“幽灵号”离开，我们也许会被困在岛上许多年，甚至困上一辈子。这里这么久都没人发现，以后也可能永远没人发现。
        - id: ch01-b10
          speaker: humphrey
          text: 海滩上不是还有一只小艇吗？
        - id: ch01-b11
          speaker: maud_brewster
          text: >-
            那是猎海豹人的船。那些人要是真逃出去了，早该回来靠海豹栖息地发财了。你明明知道，他们没能逃出去。
        - id: ch01-b12
          speaker: narrator
          text: 我没有回答，心里仍在犹豫。
        - id: ch01-b13
          speaker: maud_brewster
          text: 而且，这是你想出的办法。我想看着你把它做成。
        - id: ch01-b14
          speaker: narrator
          text: >-
            她说得迟疑，又把这件事变成了对我的赞许。我反而硬起心肠，不能因为这份赞许就让她冒险。
        - id: ch01-b15
          speaker: humphrey
          text: >-
            宁可在岛上住很多年，也不能今晚或者这几天死在海上。我们没有食物，没有水，也没有毯子，根本没法坐这只小艇渡海。没有毯子，你连今晚都撑不过去。别说自己还好，你已经在发抖了。
        - id: ch01-b16
          speaker: maud_brewster
          text: 我只是紧张。我怕你还是会把桅杆放掉，不肯听我劝。
        - id: ch01-b17
          speaker: maud_brewster
          text: 求求你，汉弗莱，真的别放！
          emotion: fearful
        - id: ch01-b18
          speaker: narrator
          text: >-
            她知道我无法抗拒这样的请求。我们只好守住木筏，在寒风里凄惨地发抖整整一夜。我偶尔迷迷糊糊睡去，很快又被寒冷刺痛着唤醒。莫德怎么能撑住，我完全想不明白。自己累得连挥动胳膊取暖都做不到，却还是一次次挤出力气，替她搓手揉脚，好让血重新流动。她始终求我别放掉那些桅杆。凌晨三点左右，她冷得抽起筋来。我替她揉开以后，她反而浑身麻木，几乎没有知觉。我真的害怕了，只能取出船桨，逼她开始划船。她已经虚弱得不成样子，每划一下，我都以为她会当场昏过去。
        - id: ch01-b19
          speaker: narrator
          text: >-
            天终于亮了。我们在渐明的晨光里找了很久，小岛才像一个黑点出现在地平线上，足足有十五英里远。我举起望远镜，发现西南方的海面上有一道暗线，而且越变越宽。
        - id: ch01-b20
          speaker: humphrey
          text: 顺风！
          emotion: happy
        - id: ch01-b21
          speaker: narrator
          text: >-
            我的嗓音哑得连自己都认不出来。莫德想回答，却已经说不出话。她嘴唇发青，眼窝深陷，可那双褐色眼睛依旧勇敢地望着我，勇敢得叫人心疼。我又替她揉手，抬动她的胳膊，直到她能自己挥动。然后我逼她站起来，扶着她在船尾那几步地方来回走，最后还让她一下下跳动。她脸上总算有了血色。
        - id: ch01-b22
          speaker: humphrey
          text: 你真勇敢。你知道自己有这么勇敢吗？
        - id: ch01-b23
          speaker: maud_brewster
          text: 我从前并不勇敢。认识你以后，我才变成这样。是你给了我勇气。
        - id: ch01-b24
          speaker: humphrey
          text: 我也一样。认识你以前，我也没有这样的勇气。
        - id: ch01-b25
          speaker: narrator
          text: >-
            她飞快看了我一眼。那双眼睛里，又闪过跳动而颤抖的光，还藏着更多说不清的东西。只一瞬，她便笑了。
        - id: ch01-b26
          speaker: maud_brewster
          text: 大概都是处境逼出来的吧。
        - id: ch01-b27
          speaker: narrator
          text: >-
            我知道不是这样，却猜不透她是否也明白。顺风很快吹来，又清劲又新鲜，小艇在沉重的海浪间辛苦前进，朝小岛驶去。下午三点半，我们才绕过西南海岬。这时不仅饿得难受，干渴也开始折磨我们。嘴唇又干又裂，连舌头都润湿不了。偏偏风慢慢弱下去，天黑后彻底停了。我只得再次摇桨，可手臂已经没有多少力气，每一下都划得虚弱不堪。凌晨两点，船头终于碰上我们内湾的海滩。我踉跄着下船，把艏缆牢牢系住。莫德站不起来，我也没有力气抱她。我们一起倒在沙地上。歇过一阵，我只能把两只手伸到她肩下，一点点沿海滩拖着她，最后将她拖进小屋。
        - id: ch01-b28
          speaker: narrator
          text: >-
            第二天，我们一点活也没有干。我们一直睡到下午三点，至少我是这样。我睁开眼睛时，莫德已经起身做晚饭了。她恢复体力的本领实在惊人。那身体看着像百合一样纤弱，似乎一碰就会折断，里面却有一股格外坚韧的生命力，牢牢抓住生命，怎么也不肯放手。这种顽强同她表面的柔弱放在一起，简直叫人难以相信。
        - id: ch01-b29
          speaker: maud_brewster
          text: >-
            你知道吗，我原本是去日本养病的。我的身体一直不太好，医生叫我坐船旅行，我就挑了最长的一段航程。
        - id: ch01-b30
          speaker: humphrey
          text: 你那时哪里知道，自己究竟挑中了什么。
        - id: ch01-b31
          speaker: maud_brewster
          text: >-
            可经历了这些，我会变成另一个女人，也会更强壮。我希望自己还能变得更好。至少，我会比以前更懂人生。
        - id: ch01-b32
          speaker: narrator
          text: >-
            白昼渐渐过去，我们说起海狼·拉森的失明。这件事谁也解释不了。他曾说，要留在奋斗岛等死。他那么强壮，又那么贪恋生命，如今却接受了死亡，可见问题绝不只是眼睛看不见。再想到那些可怕的头痛，我们都觉得，他的脑子出了某种毛病。每次发作，他承受的痛苦一定远远超出我们的想象。
        - id: ch01-b33
          speaker: narrator
          text: >-
            我们越谈，莫德对他的同情就越深。那不是软弱的滥情，而是温柔又清醒的怜悯，带着她身上最美好的女性气质，我也因此更爱她。她并没有让感情蒙住判断，仍旧赞同，为了逃出去，我们必须对他采取最严厉的手段。可是我说，也许有一天，为了保住自己的命，我不得不杀他，她还是本能地退缩了。随后，她又轻轻改正我的说法，不是保住我自己，而是保住我们两个人的性命。
        - id: ch01-b34
          speaker: narrator
          text: >-
            第二天一早，我们吃过早餐，天刚亮就干起来。我在存放这类用具的前货舱里找到一只轻便的移船锚，费尽力气才把它搬上甲板，放进小艇。艏部盘好一根长长的活动缆绳，我划到海湾外较远的地方，把锚沉下去。没有风，正值高潮，“幽灵号”已经浮了起来。我解开岸缆。绞盘坏了，只能凭蛮力拉动锚缆，一点点把船移出去，直到船身差不多对正小锚。那只锚经不起任何风浪，我又放下右舷的大锚，多留出一段松链。到了下午，我便开始修绞盘。
        - id: ch01-b35
          speaker: narrator
          text: >-
            这一修就是三天。我最不会做的偏偏是机械活，普通机械师几小时就能完成的事，我足足做了三天。一开始，每样工具都得现学。那些机械师随手就能运用的简单道理，我也得一条条自己摸索。最后，那架绞盘总算能用了。它转起来又笨又涩，远不如原先那架，根本谈不上叫人满意，可它毕竟真的能够工作，也让后面的工程有了可能。
        - id: ch01-b36
          speaker: narrator
          text: >-
            半天工夫，两根上桅又上了船，人字架也照原样重新搭好，前后左右全拉上了支索。那一夜，我守着心爱的工程，就睡在甲板上。莫德不肯独自留在岸上，便睡进水手舱。修绞盘那几天，海狼·拉森一直坐在附近，听着我的一举一动，有时也跟我们谈几句无关紧要的事。谁都不提他毁掉人字架的事，他也不再命令我别碰他的船。可他虽然双目失明，行动不便，我还是怕他。他始终在听，仿佛永远都在听。我干活时，从不让那双强壮的手臂进入能够抓到我的距离。
        - id: ch01-b37
          speaker: narrator
          text: >-
            那一夜星光明亮。我睡在心爱的人字架下面，忽然被甲板上的脚步声惊醒。我隐约看见海狼·拉森庞大的身影正在移动，便从毯子里滚出来，只穿着袜子，无声地跟在后面。他已经从工具柜里拿出一把双柄刮刀，正要割断我重新装在人字架上的喉部升降索。他先用双手摸索，发现绳子没有系牢，刀落下去没有着力之处。于是他抓住活动端，把绳索拉紧，再牢牢系住，随后举起刀，准备一点点锯断它。
        - id: ch01-b38
          speaker: humphrey
          text: 如果我是你，就不会割下去。
        - id: ch01-b39
          speaker: narrator
          text: 他听见我扣动手枪的咔嗒声，反倒笑了。
        - id: ch01-b40
          speaker: wolf_larsen
          text: 你好啊，亨普。我早知道你一直在这儿。你的动作骗不过我的耳朵。
        - id: ch01-b41
          speaker: humphrey
          text: >-
            你在撒谎，海狼·拉森。不过我正想找个机会杀你。来吧，把绳子割断。
        - id: ch01-b42
          speaker: wolf_larsen
          text: 机会不是一直都在吗？
        - id: ch01-b43
          speaker: humphrey
          text: 动手，割下去。
          emotion: angry
        - id: ch01-b44
          speaker: wolf_larsen
          text: 我还是让你失望吧。
        - id: ch01-b45
          speaker: narrator
          text: 他笑着转身，径直走向船尾。
        - id: ch01-b46
          speaker: maud_brewster
          text: >-
            汉弗莱，必须想办法管住他。只要他还能自由走动，就可能做出任何事。他会不会凿沉船，或者一把火烧掉？谁也说不准。我们得把他关起来。
        - id: ch01-b47
          speaker: humphrey
          text: >-
            可怎么做？我不敢靠近他的双臂。他也清楚，只要自己不主动反抗，我就下不了手开枪。
        - id: ch01-b48
          speaker: maud_brewster
          text: 总能找到办法。让我好好想一想。
        - id: ch01-b49
          speaker: humphrey
          text: 我倒知道一个办法。
        - id: ch01-b50
          speaker: narrator
          text: 我拿起一根打海豹的棍棒。
        - id: ch01-b51
          speaker: humphrey
          text: 这一下不会打死他。等他醒过来以前，我早把他牢牢捆住了。
        - id: ch01-b52
          speaker: maud_brewster
          text: 不，别这样。一定有不那么残酷的办法。我们先等等。
        - id: ch01-b53
          speaker: narrator
          text: >-
            其实没等多久，难题便自己有了答案。早晨，我试了好几次，终于找准前桅的平衡点，把起重滑车装在上方几英尺处。莫德压住绞盘上的绳圈，负责收好松绳，我则拼命转动。绞盘要是完好，事情不会这么难。可如今每走一英寸，我都得压上全部体重和力气，只能干一会儿，歇更久。有时我怎么也推不动，莫德便一手守住绳圈，另一只手帮我推，把她纤细身体的重量也用上。
        - id: ch01-b54
          speaker: narrator
          text: >-
            一个钟头后，单轮和双轮滑车已经在架顶碰到一起，再也升不上去。桅杆却还没有完全摆进船内。桅根抵住左舷栏杆外侧，桅顶越过右舷栏杆，远远伸在水面上。我的人字架太矮，先前所有活似乎全白干了。可是这一次，我没有像过去那样陷入绝望。我已经更相信自己，也更相信绞盘、人字架和起重滑车能做到的事。一定有办法把桅杆弄上船，眼下只等我把那个办法找出来。
        - id: ch01-b55
          speaker: narrator
          text: >-
            我正思量这个难题，海狼·拉森走上甲板。我们马上看出他不对劲。他的动作比从前更迟疑，也更无力，沿船舱左侧走来时，脚步竟然摇摇晃晃。到了艉楼边缘，他一个踉跄，又抬起一只手，在眼前做出那个熟悉的挥拂动作。随后他顺着台阶跌向主甲板，虽然还勉强站着，却一路东倒西歪，双手不停伸出去寻找支撑。到了统舱升降口旁，他总算稳住身体，晕眩地站了一会儿，忽然整个人瘫软下去。双腿在身下弯折，他倒在了甲板上。
        - id: ch01-b56
          speaker: humphrey
          text: 又是一次发作。
        - id: ch01-b57
          speaker: narrator
          text: >-
            莫德点点头，眼里立刻有了同情的暖意。我们走过去。海狼·拉森像是失去知觉，呼吸一阵紧过一阵。莫德接手照料，托高他的头，不让血往头部涌，又打发我去船舱拿枕头。我连几条毯子也一起带来了，我们把他安顿得尽量舒服。随后我摸了摸他的脉搏，竟然稳定有力，完全正常。这实在让人费解，我心里的怀疑也越来越重。
        - id: ch01-b58
          speaker: humphrey
          text: 他会不会是在装病？
        - id: ch01-b59
          speaker: narrator
          text: >-
            莫德摇头，眼神里还带着责怪。就在这时，他的手腕突然从我掌中弹开，那只手像钢铁捕兽夹一样扣住我的手腕。我在极度恐惧中叫出声来，那是一声疯狂而含混的喊叫。我只来得及瞥见他的脸，上面满是恶毒和胜利的得意。紧接着，另一条手臂已经圈住我的身体，把我一把拖下去，箍进那副可怕的怀抱。
        - id: ch01-b60
          speaker: narrator
          text: >-
            他松开我的手腕，却用另一条胳膊从背后绕过来，锁死我的双臂，让我一下也动不了。空出的手随即掐住喉咙。我尝到了死亡最苦的滋味，而且这预兆全是自己的愚蠢换来的。我怎么会相信自己可以走进那双可怕手臂的范围？接着，我感觉还有两只手来到喉头。那是莫德的手，她正拼命去掰海狼·拉森的手指，可她根本掰不动。她终于放弃，发出一声撕心裂肺的尖叫。那是一个女人在恐惧和心碎的绝望中发出的声音。过去“马丁内斯号”沉没时，我听过同样的叫声。
        - id: ch01-b61
          speaker: narrator
          text: >-
            我的脸贴着他的胸膛，什么都看不见，只听到莫德转身跑远。一切快得惊人，可在她跑回来以前，每一刻都像没有尽头。我忽然感到身下的身体塌了下去。他肺里的气息正在漏走，胸膛被我的重量压瘪。我不知道那声低沉呻吟，是因为呼出了气，还是因为他发觉力量正在消失。扼住喉咙的手放松了，我终于吸进一口气。那只手颤了颤，又想收紧。可这一次，再强的意志也挡不住身体的崩溃。他正在昏厥。
        - id: ch01-b62
          speaker: narrator
          text: >-
            莫德的脚步已经来到近前。他的手最后颤了一下，终于松开。我从他身上滚落，仰躺在甲板上喘息，在阳光下不停眨眼。莫德脸色苍白，却勉强保持着镇定。她又惊恐又如释重负地望着我，手里紧握一根沉重的海豹棍棒。我盯住那根棍棒，她也顺着我的视线低头一看，立刻让它从手中落下，仿佛那东西忽然蜇了她。我的心却被狂喜充满。她真是我的伴侣。她能和我并肩战斗，也能为了我战斗，就像远古时代的伴侣那样。她忘了自己一向的教养，温柔外表下那份原始而坚硬的力量，已经完全苏醒。
        - id: ch01-b63
          speaker: humphrey
          text: 亲爱的女人！
          emotion: happy
        - id: ch01-b64
          speaker: narrator
          text: >-
            我挣扎着站起来。下一刻，她已经扑进我的怀里，伏在肩头控制不住地抽泣。我紧紧抱住她，低头望着她那一头灿烂的褐发。阳光在发间闪耀，像一颗颗宝石。对我来说，这些光彩远比帝王宝箱里的珠宝更加珍贵。我轻轻俯下头，吻了吻她的头发，动作轻得她毫无察觉。
        - id: ch01-b65
          speaker: narrator
          text: >-
            很快，我又恢复了清醒。说到底，她只是个刚刚脱险的女人。危险已经过去，她在保护自己的人怀里，或者在那个刚才险些送命的人怀里，哭出如释重负的泪水。就算我是她的父亲或者兄长，眼前的情形也不会有什么不同。何况时间和地点都不合适。我还想先赢得更充分的资格，再向她说明爱情。当她慢慢退出我的怀抱时，我又一次悄悄吻了吻她的头发。
        - id: ch01-b66
          speaker: humphrey
          text: >-
            这次是真的发病了，和让他失明的那次一样，又是一次脑部冲击。他本来只想装病，结果反而真的引发了病症。
        - id: ch01-b67
          speaker: narrator
          text: 莫德已经俯身去整理他的枕头，我叫住了她。
        - id: ch01-b68
          speaker: humphrey
          text: >-
            先别动他。既然他现在已经动弹不得，那就让他一直这样。从今天起，我们住进船舱，海狼·拉森住到统舱去。
        - id: ch01-b69
          speaker: narrator
          text: >-
            我从腋下抓住他的肩膀，把他拖到升降口。莫德按我的话拿来绳子。我们把绳子垫在他肩下，让他的身体横在门槛上，再沿台阶慢慢放到舱板。我一个人抬不动他，只好和莫德先抬肩膀与头，再抬身体，让他架在铺位边缘，最后滚进下铺。
        - id: ch01-b70
          speaker: narrator
          text: >-
            这还不够。我想起他的舱房里有一副手铐。他一向宁愿拿它铐水手，也不爱用船上那套古老又笨重的镣铐。等我们离开统舱时，他的双手双脚都已被手铐牢牢铐住。许多天来，我第一次能够毫无顾忌地放松呼吸。重新走上甲板时，整个人轻得出奇，仿佛肩头一直压着的重担终于卸掉。我还觉得，自己和莫德也比从前靠得更近了。我们并肩走过甲板，走向那根仍卡在人字架上的前桅。我不禁猜想，她是不是也有相同的感觉。
