audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding and sardonic, with cold intellectual precision
        timbre: deep, powerful, and rough-edged
        pace: deliberate with sudden force
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER XXXVI
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            For two days, Maud and I searched the sea and every beach for the missing masts. We found nothing until the third day. Then we discovered all of them, including the shears, caught in the pounding surf below the grim headland to the southwest. It was the most dangerous place they could have reached.
        - id: ch01-b02
          speaker: narrator
          text: >-
            How we worked once we found them! We fought the surf for the rest of that first day. By the time darkness stopped us, we had managed to free the mainmast and fasten it behind the boat. We returned to our little cove completely spent, towing that great spar through the water. There had been no wind to help us. We had rowed practically every inch of the way home.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The next day brought more heartbreaking and dangerous labor in the pounding water. We kept at it until both topmasts were safely in camp. On the following day, desperation drove me to attempt all the remaining heavy pieces at once. I lashed the foremast, the fore and main booms, and the fore and main gaffs into one long raft. The wind looked favorable when we started, so I planned to raise sail and tow everything home. Instead, it kept shifting and confusing us. Then it died completely. We took up the oars, but the burden behind us held the boat to a snail's pace.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The effort crushed the spirit. I would throw my whole strength and weight onto the oars. For an instant, the boat would answer and leap ahead. Then the great weight of wood behind us would catch it and stop the forward rush. Again and again, I spent everything I had for that tiny gain. As night began to fall, matters grew worse. A wind sprang up from directly ahead. First it stopped us altogether. Then it pushed boat and tow backward, away from the island and farther out to sea.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Still I fought the oars, and I did not stop until there was nothing left in me. Maud always worked to the very edge of her strength, no matter how hard I tried to hold her back. Now even she could do no more. She lay weakly against the stern seats while I made the last useless strokes. At last I had to admit that I could not row again. My hands were bruised and swollen, and my fingers could no longer close around the handles. Every part of my wrists and arms ached beyond endurance. I had eaten a hearty meal at noon, but I had burned through it all. Hunger made me faint as I sat there.
        - id: ch01-b06
          speaker: narrator
          text: >-
            I brought in the oars and reached for the rope that held our tow. Maud's hand shot out and stopped mine.
        - id: ch01-b07
          speaker: maud_brewster
          text: >-
            What are you going to do?
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: >-
            I'm cutting the tow loose.
        - id: ch01-b09
          speaker: narrator
          text: >-
            I began to slip the rope free, but her fingers closed over mine.
        - id: ch01-b10
          speaker: maud_brewster
          text: >-
            Please don't.
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: >-
            There's no use keeping it. Night is here, and the wind is carrying us away from land.
        - id: ch01-b12
          speaker: maud_brewster
          text: >-
            But think, Humphrey. If we can't sail away in the Ghost, we may be trapped on this island for years. We may stay here for the rest of our lives. No one has discovered it yet. Perhaps no one ever will.
        - id: ch01-b13
          speaker: narrator
          text: >-
            You're forgetting the boat we found on the beach.
        - id: ch01-b14
          speaker: maud_brewster
          text: >-
            That was a sealing boat. If those men had escaped, you know they would have returned for the fortune in this rookery. They never escaped.
        - id: ch01-b15
          speaker: narrator
          text: >-
            I said nothing. I could not decide.
        - id: ch01-b16
          speaker: maud_brewster
          text: >-
            And besides... this was your idea. I want to see you succeed.
        - id: ch01-b17
          speaker: narrator
          text: >-
            That made my heart harden. Once she appealed to my pride, I had to refuse for her sake.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Years on the island would be better than dying tonight, tomorrow, or the next day in an open boat. We aren't ready for the sea. We have no food, no water, no blankets. You couldn't live through this night without a blanket. I know how strong you are, and you're shivering already.
        - id: ch01-b19
          speaker: maud_brewster
          text: >-
            I'm only shaking because I'm nervous. I'm afraid you'll throw the masts away in spite of me.
          emotion: fearful
        - id: ch01-b20
          speaker: maud_brewster
          text: >-
            Oh, please, Humphrey. Please don't!
          emotion: fearful
        - id: ch01-b21
          speaker: narrator
          text: >-
            That ended the argument. She had used the plea that always overcame me, and I kept the tow.
        - id: ch01-b22
          speaker: narrator
          text: >-
            We shivered miserably through the long night with no blankets or shelter. Now and then I fell into a restless sleep, but the pain of the cold always woke me. How Maud could endure it was more than I could understand. I was so exhausted that I could not even beat my arms against my body to warm myself. Yet whenever her hands and feet grew colder, I somehow found enough strength to take them in mine and rub them until the blood began to move again. Even in that misery, she kept pleading with me not to sacrifice the masts.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Around three in the morning, the cold twisted her body into a cramp. I rubbed her until the cramped muscles released, but that did not end the danger. Afterward, she began to lose all feeling. Her growing numbness frightened me more than the pain had. I knew she had to move. I pulled out the oars, put them into her hands, and made her row. She was so weak that I watched every stroke expecting her to collapse, yet I kept her at it because the effort was the only warmth we could give her.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Dawn came, and we searched the growing light for the island. At last we saw it, a small black shape on the horizon, a full fifteen miles away. I raised the glasses and studied the water. Far to the southwest lay a dark line that grew while I watched.
        - id: ch01-b25
          speaker: narrator
          text: >-
            A fair wind!
          emotion: happy
        - id: ch01-b26
          speaker: narrator
          text: >-
            The cry came from a husky voice I hardly knew as my own. Maud tried to answer, but no sound came. Her lips were blue, and her eyes looked hollow. Yet those brown eyes met mine with such brave determination that the sight of them hurt me.
        - id: ch01-b27
          speaker: narrator
          text: >-
            I rubbed her hands again and moved her arms back and forth until she could swing them herself. Then I made her stand. She would have fallen without my support, but I forced her to walk the few steps between the seat and the stern, over and over. At last I made her jump up and down. Slowly, life returned to her face.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Oh, you brave woman. Did you know how brave you are?
        - id: ch01-b29
          speaker: maud_brewster
          text: >-
            I never used to be. I wasn't brave until I knew you. You are the one who made me brave.
        - id: ch01-b30
          speaker: narrator
          text: >-
            And I wasn't brave until I knew you.
        - id: ch01-b31
          speaker: narrator
          text: >-
            She looked at me quickly. Once more, that dancing, trembling light appeared in her eyes, along with something beyond it. A moment later it was gone, and she smiled.
        - id: ch01-b32
          speaker: maud_brewster
          text: >-
            It must be everything we've been through.
        - id: ch01-b33
          speaker: narrator
          text: >-
            I knew she was wrong, and I wondered whether she knew it too.
        - id: ch01-b34
          speaker: narrator
          text: >-
            At last the dark line reached us. The wind came fair and fresh, just as I had hoped. We raised sail, and the boat began fighting its way toward the island through a sea that grew heavy beneath us. We still had the timber raft in tow, so every mile cost us time. It was half past three in the afternoon before we finally passed the southwestern headland. By then, hunger was only part of our suffering. We had gone so long without water that thirst had dried and split our lips. We tried to wet them with our tongues, but even that little moisture was gone.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Then, with the headland behind us and safety still hours away, the wind began to fade. It weakened little by little until night came and the air was perfectly still. Once more, I had to take up the oars. I pulled weakly now, more weakly than I could have imagined, but the cove slowly drew nearer. At two in the morning, the bow finally touched the beach inside our own harbor. I staggered over the side and made the painter fast so the boat could not drift away. Maud tried to rise, but she could not stand. I bent to lift her and found I had no strength to carry her. Instead, I fell down in the sand beside her. I lay there until I recovered enough to move. Then I put my hands beneath her shoulders and slowly dragged her away from the water, up the beach, and all the way to the hut.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Neither of us attempted any work the next day. We surrendered ourselves to sleep. I did not wake until three in the afternoon, and even then it was the sight of Maud already cooking dinner that surprised me fully awake. After what she had suffered, her ability to recover seemed wonderful. Her body had the delicate look of a lily and appeared too frail for such hardship. Yet beneath that visible weakness was a stubborn hold on life, something strong and tenacious that her appearance never revealed.
        - id: ch01-b37
          speaker: maud_brewster
          text: >-
            You know, I was on my way to Japan because of my health. I was never very strong. The doctors advised a sea voyage, so I chose the longest one I could.
        - id: ch01-b38
          speaker: narrator
          text: >-
            You had no idea what you were choosing.
          emotion: happy
        - id: ch01-b39
          speaker: narrator
          text: >-
            I laughed as I said it. We were sitting by the fire after dinner, enjoying the simple pleasure of not moving.
        - id: ch01-b40
          speaker: maud_brewster
          text: >-
            This experience will make me a different woman, and a stronger one. I hope it makes me better too. At least I will understand much more about life.
        - id: ch01-b41
          speaker: narrator
          text: >-
            The short day began to fade while we sat there, and our talk turned to Wolf Larsen's blindness. Neither of us could explain what had caused it. I reminded Maud of his own statement that he intended to remain on Endeavour Island until he died. That decision showed how grave his condition must be. Wolf Larsen was a powerful man who loved life fiercely. If even he had accepted that death was coming, then simple blindness could not be the whole of his trouble. We thought back to the terrible headaches that had struck him before he lost his sight. The only answer we could find was that something in his brain was breaking down. Whatever happened during those attacks, the pain must have gone beyond anything either of us could understand.
        - id: ch01-b42
          speaker: narrator
          text: >-
            As we talked through his condition, I watched Maud's sympathy for him deepen. The man had threatened and tormented us, but his suffering still moved her. I could not help loving her for that gentle compassion. There was no foolish softness in it. She understood our danger and agreed that we had to use the strictest measures against him if we were ever to escape. Yet one possibility made her recoil. I might someday be forced to take his life in order to save my own. Even as she said it, she changed the words. It would be done to save our lives.
        - id: ch01-b43
          speaker: narrator
          text: >-
            We ate breakfast the next morning and went to work at daylight. In the forward hold, I found a light kedge anchor. After a great struggle, I got it onto the deck and into the boat. I coiled a long running line in the bow, rowed well out into the cove, and dropped the anchor.
        - id: ch01-b44
          speaker: narrator
          text: >-
            There was no wind in the cove, the tide stood high, and the Ghost was floating free of the bottom. I cast off every line that held her to the shore. Then I used the rope from the kedge anchor to haul the schooner outward. The broken windlass could give me no help, so every foot came by the strength of my own body. I kept hauling until the vessel rode almost straight above the little anchor. It was far too small to hold her if any breeze arose. To secure her, I lowered the great starboard anchor as well and paid out plenty of chain. Only then could I turn to the broken machinery. By that afternoon, I was at work on the windlass.
        - id: ch01-b45
          speaker: narrator
          text: >-
            The repair consumed three full days. Of all the things I might have called myself, a mechanic was the last. An ordinary machinist could have done in three hours what took me three days. Before I could repair anything, I had to teach myself the tools one by one. Each simple principle that a trained worker would have ready at his fingertips was something I had to discover through trial, failure, and thought. At the end of those three days, I had built a windlass that turned and held, though it did both clumsily. It never gave me the smooth, certain service of the old machine. Still, it worked. Without it, the labor ahead would have been impossible.
        - id: ch01-b46
          speaker: narrator
          text: >-
            In half a day, I brought both topmasts aboard and rigged and steadied the shears as before. That night, I slept on deck beside my work. Maud refused to remain alone on shore, so she slept in the forecastle.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Throughout the repairs, Wolf Larsen sat nearby and listened to every sound of my work. At times, he talked with Maud and me, but only about ordinary, unimportant things. He never mentioned the shears he had destroyed. Maud and I kept silent about them too. Nor did he refer again to my warning that he must leave the ship alone. The silence did not make me trust him. Blind and apparently helpless, he frightened me still. He sat there listening, always listening, and I felt his attention on every movement I made. I knew what those arms could do if they closed around me. While I worked, I measured the distance between us and never once allowed him to come within reach.
        - id: ch01-b48
          speaker: narrator
          text: >-
            That night, I lay down on deck directly beneath the shears I had worked so hard to restore. Their shape above me had become precious. Sometime during the starlit darkness, footsteps crossing the deck woke me. I opened my eyes and saw the dim bulk of Wolf Larsen moving nearby. I rolled quietly out of my blankets. Without putting on my shoes, I crept after him in my stocking feet so that the deck would carry no warning of my steps.
        - id: ch01-b49
          speaker: narrator
          text: >-
            He had armed himself with a drawknife from the tool locker. I watched him approach the throat halyards I had rigged once more to support the shears. He intended to cut them and bring my work down again. Because he could not see, he searched for the ropes with his hands. His fingers told him that I had left them free rather than fastening them down. That would not serve his purpose. A drawknife needed a tight line to bite against. He found the running part, hauled on it until the halyards were taut, and made it fast. Then he set the blade across the stretched rope and prepared to saw.
        - id: ch01-b50
          speaker: narrator
          text: >-
            I wouldn't do that if I were you.
        - id: ch01-b51
          speaker: narrator
          text: >-
            I spoke quietly, and he heard the click of my pistol.
        - id: ch01-b52
          speaker: wolf_larsen
          text: >-
            Hello, Hump. I knew you were here the whole time. You can't fool my ears.
        - id: ch01-b53
          speaker: narrator
          text: >-
            That's a lie, Wolf Larsen. Still, I've been longing for a chance to kill you. Go on. Cut the rope.
        - id: ch01-b54
          speaker: wolf_larsen
          text: >-
            You always have the chance.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Go ahead, then. Cut it.
          emotion: angry
        - id: ch01-b56
          speaker: wolf_larsen
          text: >-
            I'd rather disappoint you.
        - id: ch01-b57
          speaker: narrator
          text: >-
            He laughed, turned away, and went aft.
        - id: ch01-b58
          speaker: narrator
          text: >-
            The next morning, I told Maud what had happened during the night.
        - id: ch01-b59
          speaker: maud_brewster
          text: >-
            We have to do something, Humphrey. As long as he's free, he could do anything. He might sink the ship or burn it. We can't know what he'll try next. We must make him a prisoner.
        - id: ch01-b60
          speaker: narrator
          text: >-
            But how can we imprison him? I don't dare come within reach of his arms. He knows I can't shoot him while he only resists without attacking me.
        - id: ch01-b61
          speaker: maud_brewster
          text: >-
            There has to be some way. Let me think.
        - id: ch01-b62
          speaker: narrator
          text: >-
            There is one way.
        - id: ch01-b63
          speaker: narrator
          text: >-
            I spoke grimly. She waited while I picked up a club used for killing seals.
        - id: ch01-b64
          speaker: narrator
          text: >-
            It wouldn't kill him. Before he came around, I could tie him so tightly that he couldn't move.
        - id: ch01-b65
          speaker: narrator
          text: >-
            She shuddered and shook her head.
        - id: ch01-b66
          speaker: maud_brewster
          text: >-
            No, not that. There must be a way that isn't so brutal. Let's wait.
        - id: ch01-b67
          speaker: narrator
          text: >-
            We did not have to wait long. The problem soon solved itself.
        - id: ch01-b68
          speaker: narrator
          text: >-
            The next morning, the foremast was ready to test both my repaired windlass and my new confidence. It took several trials before I found the exact point where the long spar would balance. I attached the hoisting tackle a few feet above that point so the mast would swing the right way as it rose. Maud stood at the windlass. She held the turn of rope securely and coiled the line as it came in, while I did the heaving. If the windlass had been in proper order, the lift would still have been hard, but it would not have fought us at every movement. My repair was rough. To gain each single inch, I had to lean in and force the bar around with all my weight and every bit of strength I possessed.
        - id: ch01-b69
          speaker: narrator
          text: >-
            I could keep up that effort for only a short spell. Again and again, I had to stop and recover before trying the next few inches. The pauses grew so long that I spent more time resting than heaving. There were moments when I pushed with everything in me and the windlass did not move at all. Even then, Maud found a way to help. She kept the rope from slipping with one hand. With the other, she reached toward me and threw the weight of her slender body into the struggle. Together we would force the machine past the stubborn place, and the mast would rise a little farther.
        - id: ch01-b70
          speaker: narrator
          text: >-
            At the end of an hour, the single block and the double block came together at the very top of the shears. Once they touched, the tackle could shorten no farther. I had reached the absolute limit of the lift, yet the mast had not swung completely inboard. Its heavy butt rested against the outside of the port rail. From there, the mast crossed above the deck, but its top still hung far out over the water beyond the starboard rail. I saw the fault at once. The shears I had rebuilt were too short to raise the mast high enough. The machinery had worked, Maud and I had spent all that strength, and still the mast could not come aboard. For the moment, every hour of our labor had produced nothing.
        - id: ch01-b71
          speaker: narrator
          text: >-
            Yet the failure did not crush me in the old way. Once, such a result would have left me helpless and despairing. Now the work itself had changed me. I was beginning to trust my own ability to learn and solve what I did not understand. I had also learned to trust the possibilities hidden in the windlass, the shears, and the hoisting tackle. Their first arrangement had failed, but that did not mean the task was impossible. Somewhere among those ropes, spars, and blocks was another arrangement that would succeed. There was a way to bring the foremast aboard. It remained for me to find that way.
