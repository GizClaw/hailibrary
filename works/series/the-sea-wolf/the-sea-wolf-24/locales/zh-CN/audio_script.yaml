audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
    smoke:
      display_name: 斯莫克
      tts:
        delivery: 谨慎沉着，反抗时带着不露声色的讥诮
        timbre: 瘦硬而饱经风霜的成年男声
        pace: 平稳，不疾不徐
        pitch: 中低音
    latimer:
      display_name: 拉蒂默
      tts:
        delivery: 直率粗犷，玩笑里带着明白人的揶揄
        timbre: 粗粝浑厚的成年男声
        pace: 从容
        pitch: 中低音
    helmsman:
      display_name: 舵手
      tts:
        delivery: 警醒利落，保持船员报告时的干脆
        timbre: 经风历浪而清亮的成年男声
        pace: 明快
        pitch: 中音
    louis:
      display_name: 路易斯
      tts:
        delivery: 快活而亲近，挖苦人时透着老水手的机灵
        timbre: 圆润而饱经风霜的成年男声
        pace: 活泼，语调有起伏
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十四章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我一生最清晰的记忆里，有四十个小时属于“幽灵号”。它们紧接在我发现自己爱上莫德之后。我在安静的地方生活了三十五年，才突然踏进一段连自己都想象不到的荒唐冒险。可就算在那些冒险里，也没有哪四十个小时挤进过这么多变故和刺激。每当想起它们，心里总有个小小的声音，颇为得意地说，种种情形都算上，我当时做得还不赖。
        - id: ch01-b02
          speaker: narrator
          text: >-
            事情从当天的午餐开始。海狼·拉森宣布，从此以后，猎手们都去统舱吃饭。捕海豹的纵帆船上，猎手照例拥有近似船上官员的地位，所以这样的安排从未有过。他没解释原因，可大家都明白。霍纳和斯莫克近来总对莫德大献殷勤，样子虽然可笑，对她却没有恶意。拉森显然看不顺眼。
        - id: ch01-b03
          speaker: narrator
          text: >-
            这道命令落下来，四周一片阴沉的寂静。另外四个猎手意味深长地看看霍纳和斯莫克，怪他们连累了大家。霍纳照旧安静，什么也没表示。斯莫克的额头却涨成暗红色，嘴刚张开一半，像是要说话。拉森盯着他，眼里闪着钢铁般的冷光，只等他开口。可斯莫克又把嘴闭上了。
        - id: ch01-b04
          speaker: wolf_larsen
          text: 有话想说？
        - id: ch01-b05
          speaker: narrator
          text: >-
            这是明摆着的挑衅，斯莫克却不接招。
        - id: ch01-b06
          speaker: smoke
          text: 说什么？
        - id: ch01-b07
          speaker: narrator
          text: >-
            他问得一脸无辜，拉森反而愣住了，旁边的人都忍不住发笑。
        - id: ch01-b08
          speaker: wolf_larsen
          text: 哦，没什么。我还以为你想抱怨两句。
        - id: ch01-b09
          speaker: smoke
          text: 抱怨什么？
        - id: ch01-b10
          speaker: narrator
          text: >-
            斯莫克的同伴全都咧嘴笑了。拉森恨不得杀了他。要不是莫德在场，我毫不怀疑这里会见血。斯莫克敢这么做，靠的正是她的存在。他那样谨慎的人，若船长的怒火可以化成比言语更重的东西，绝不会轻易去招惹。我正怕两人当场打起来，舵手忽然从敞开的升降口喊下来，让这场面有了自行收住的机会。
        - id: ch01-b11
          speaker: helmsman
          text: 后面发现烟柱！
        - id: ch01-b12
          speaker: wolf_larsen
          text: 什么方位？
        - id: ch01-b13
          speaker: helmsman
          text: 正后方，船长。
        - id: ch01-b14
          speaker: latimer
          text: 没准是俄国船。
        - id: ch01-b15
          speaker: narrator
          text: >-
            这句话一出口，猎手们顿时面露忧色。俄国船只会意味着一件事，那就是巡洋舰。他们虽然只大致知道“幽灵号”的位置，也晓得这里已靠近禁海边界。拉森偷猎的恶名更是人人皆知。所有人的目光都集中到了他身上。
        - id: ch01-b16
          speaker: wolf_larsen
          text: >-
            放心吧，安全得很。这回不用去盐矿服苦役了，斯莫克。不过我敢跟你们赌五赔一，来的就是“马其顿号”。
        - id: ch01-b17
          speaker: narrator
          text: >-
            没人肯接这个赌。他又加了一注。
        - id: ch01-b18
          speaker: wolf_larsen
          text: 要真是它，我再赌十赔一，麻烦也正跟着风一块儿来。
        - id: ch01-b19
          speaker: latimer
          text: >-
            免了。我不怕输钱，好歹也得有点赢面。你和你兄弟只要碰头，就没有不出事的时候。这一注，我倒敢赌二十赔一。
        - id: ch01-b20
          speaker: narrator
          text: >-
            大家都笑了，拉森自己也笑，午餐总算没有闹出乱子。这还得归功于我，因为代价全落在我头上。剩下的时间里，他对我恶劣极了，一会儿挖苦，一会儿摆出高高在上的姿态。我气得浑身发抖，却知道为了莫德，必须忍住。后来，她的目光和我的相遇了短短一瞬。那双眼睛说得和她亲口开腔一样清楚。
        - id: ch01-b21
          speaker: narrator
          text: 她的眼睛在说，勇敢些，勇敢些。
        - id: ch01-b22
          speaker: narrator
          text: >-
            饭后，我们都上了甲板。在这片载着我们漂流的海上，日子十分单调，任何一艘汽船都能给生活添点变化。更何况大家认定，那是死神·拉森的“马其顿号”，心里自然更兴奋。昨天下午兴起的强风和大浪，一整个上午都在减弱。现在天气终于允许我们放下小艇，出海捕猎半天。收获看来会很丰厚。我们从天亮起一直驶过没有海豹的水面，此刻才刚刚进入兽群。
        - id: ch01-b23
          speaker: narrator
          text: >-
            放艇时，烟柱还在后方几英里外，却追得很快。小艇在海面上散开，一起朝北驶去。我们不时看见一张帆落下，听到猎枪接连响起，又看着那张帆重新升起。海豹密密麻麻，风越来越弱，一切都对我们有利，处处预示着一场大丰收。“幽灵号”继续前驶，要占住最后一条下风小艇的下风位置。
        - id: ch01-b24
          speaker: narrator
          text: >-
            等我们驶到最后一条下风小艇的下风处，四周的海面简直铺满了睡着的海豹。我从没见过这么多。它们到处都是，有的两三只聚在一起，有的一群群挨着，伸长了整个身体浮在水上，睡得就像一群懒洋洋的小狗。
        - id: ch01-b25
          speaker: narrator
          text: >-
            越来越近的烟柱下，汽船的船身和上层建筑也越变越大。来的果然是“马其顿号”。它从右舷不到一英里处经过，我用望远镜清楚认出了船名。拉森恶狠狠地盯着那艘船，莫德却满怀好奇。
        - id: ch01-b26
          speaker: maud_brewster
          text: 拉森船长，你不是说麻烦正乘风而来吗？它在哪儿呢？
        - id: ch01-b27
          speaker: narrator
          text: >-
            他看了她一眼，脸上掠过一丝兴味，神情也柔和了片刻。
        - id: ch01-b28
          speaker: wolf_larsen
          text: 你原来盼着什么？他们登上船，割断我们的喉咙？
        - id: ch01-b29
          speaker: maud_brewster
          text: >-
            差不多吧。捕海豹的人和事对我都太陌生了，不管发生什么，我大概都不会觉得奇怪。
        - id: ch01-b30
          speaker: wolf_larsen
          text: 这倒没错。你错在没有先想到最坏的情形。
        - id: ch01-b31
          speaker: maud_brewster
          text: 可还有什么比割断我们的喉咙更坏呢？
          emotion: surprised
        - id: ch01-b32
          speaker: wolf_larsen
          text: >-
            割破我们的钱袋。如今一个人能怎样活着，全由他口袋里有多少钱决定。
        - id: ch01-b33
          speaker: maud_brewster
          text: “偷走我钱袋的人，偷走的不过是废物。”
        - id: ch01-b34
          speaker: wolf_larsen
          text: >-
            偷走我钱袋的人，偷走的是我活下去的权利。老话怎么说都没用。他拿走我的面包、肉和床，也就威胁了我的性命。世上的施粥处和领面包的队伍，可容不下所有人。钱袋一空，人通常就会死，而且死得很惨。除非他能赶快把钱袋重新装满。
        - id: ch01-b35
          speaker: maud_brewster
          text: 可我还是看不出，那艘汽船怎么会打你钱袋的主意。
        - id: ch01-b36
          speaker: wolf_larsen
          text: 等着吧，你马上就会看见。
        - id: ch01-b37
          speaker: narrator
          text: >-
            果然没等多久。“马其顿号”驶过我们的小艇队好几英里，便开始放下自己的小艇。我们知道，它足足有十四条，我们只有五条。温赖特逃走时带走一条，所以我们比原来又少了一条。它先在我们最后一条艇的远远下风处放艇，接着横过我们的航向，一条接一条放下去，最后一条又远远落在最前面那条上风艇的上风处。我们的捕猎就这样毁了。身后已经没有海豹，前方那十四条艇却像一把巨大的扫帚，把整个兽群从我们面前扫走。
        - id: ch01-b38
          speaker: narrator
          text: >-
            我们的小艇只在中间两三英里的海面上捕猎，到了“马其顿号”放艇的地方，就只好调头回船。风弱得只剩一丝气息，海面越来越平静，又有这么庞大的兽群，本来正是十全十美的捕猎日。哪怕整个季节运气极好，也不过能遇上两三天。猎手、划手和掌舵手全都怒气冲冲地爬上船舷。每个人都觉得自己的收获被人硬生生抢走了。众人一边咒骂，一边把小艇吊上来。要是诅咒真有力量，死神·拉森早就死透了，还会遭到永世惩罚。
        - id: ch01-b39
          speaker: louis
          text: 死了还得下地狱，足足受他十二辈子的罪。
        - id: ch01-b40
          speaker: narrator
          text: >-
            路易斯停下拉紧小艇系索的活儿，眼睛闪闪发亮地望着我。拉森也听见了满船的咒骂。
        - id: ch01-b41
          speaker: wolf_larsen
          text: >-
            听听他们的话。要找出他们灵魂里最重要的东西，难吗？是信仰？爱情？崇高的理想？还是善、美和真？
        - id: ch01-b42
          speaker: maud_brewster
          text: 是他们天生的是非感受到了侵犯。
        - id: ch01-b43
          speaker: narrator
          text: >-
            莫德站在十二英尺外，一手搭着主桅侧支索，身体随船身轻轻摇摆。她没有提高嗓音，那清澈如钟声的音色却让我心头一震。啊，听在我耳中，实在太甜美了。那一刻，我几乎不敢看她，怕自己的心意泄露出来。
        - id: ch01-b44
          speaker: narrator
          text: >-
            她斜戴着一顶男孩式的帽子。浅褐色的头发蓬松地挽着，接住阳光，在秀美的鹅蛋脸周围仿佛围出一圈光轮。她实在迷人极了，又那么甜美灵秀，即使说不上圣洁，也相差不远。看着这个光辉的生命化身，我从前对生命的惊叹全回来了。再想起拉森那套关于生命及其意义的冷冰冰解释，只觉得荒唐可笑。
        - id: ch01-b45
          speaker: wolf_larsen
          text: >-
            又是个多愁善感的人，和范韦登先生一样。那些人咒骂，不过是因为欲望受了侵犯，仅此而已。什么欲望？领一大笔报酬，上岸后吃得好，睡得软。再去找女人，喝酒，撑饱肚子，干尽禽兽勾当。这些才真正代表他们，也代表他们身上最好的东西、最高的追求。你要叫它理想，也可以。他们发泄感情的样子虽然不动人，却能让人看出他们被触动得多深。他们的钱袋伤得有多深。因为把手伸进他们的钱袋，就等于把手伸进他们的灵魂。
        - id: ch01-b46
          speaker: maud_brewster
          text: 可你看上去，一点也不像钱袋受了伤。
        - id: ch01-b47
          speaker: wolf_larsen
          text: >-
            那是因为我的表现不同。我的钱袋和灵魂都受了伤。照伦敦市场现在的海豹皮价格，再估一估今天下午本来该有的收获，“马其顿号”这一独吞，就让“幽灵号”损失了大约一千五百美元的皮子。
        - id: ch01-b48
          speaker: maud_brewster
          text: 可你说得这样平静……
        - id: ch01-b49
          speaker: wolf_larsen
          text: >-
            我心里一点也不平静。我恨不得杀了那个抢我的人。是，是，我知道，那人是我的亲兄弟。又是感情！呸！
          emotion: angry
        - id: ch01-b50
          speaker: narrator
          text: >-
            他的脸色突然变了。再次开口时，声音没那么严厉，而且完全出自真心。
        - id: ch01-b51
          speaker: wolf_larsen
          text: >-
            你们这些多愁善感的人，一定活得很快乐。真的，一定非常快乐。你们做梦，把事情看成美好的。只要发现有些东西美好，自己也会觉得很好。现在告诉我，你们两个觉得我是好人吗？
        - id: ch01-b52
          speaker: humphrey
          text: 从某个角度说，你看上去倒是不错。
        - id: ch01-b53
          speaker: maud_brewster
          text: 你身上有一切向善的力量。
        - id: ch01-b54
          speaker: wolf_larsen
          text: >-
            瞧，又来了！这些话对我来说空洞得很。你表达的东西不清楚，不锐利，也不确切。你不能用两只手把它捧起来，好好看个明白。事实上，那根本不是什么思想，只是一种感受，一种情绪。它建立在幻觉上，跟理智没有关系。
          emotion: angry
        - id: ch01-b55
          speaker: narrator
          text: >-
            说着说着，他的声音又软了下来，仿佛在向我们倾吐心事。
        - id: ch01-b56
          speaker: wolf_larsen
          text: >-
            你知道吗？有时我发现，自己也希望看不见生命的事实，只知道那些幻想和幻觉。当然，它们全都错了，完全不合道理。可面对它们，我的理性偏偏告诉我，虽然这念头错得不能再错，做梦、活在幻觉里，反而能让人得到更多快乐。说到底，快乐就是活着的报酬。没有快乐，活着这件事也就毫无价值。一个人辛辛苦苦地活，却拿不到任何报酬，那还不如死掉。谁得到的快乐最多，谁才活得最多。你们那些梦和不真实的东西，比我的事实更少折磨你们，也能给你们更多满足。
        - id: ch01-b57
          speaker: narrator
          text: >-
            他慢慢摇着头，想了又想。
        - id: ch01-b58
          speaker: wolf_larsen
          text: >-
            我常常怀疑，常常怀疑理性到底值不值得。梦一定更实在，也更让人满足。感情给人的快乐，比理智的快乐更充实，也留得更久。而且你每享受一刻理智的快乐，随后总要付出陷入忧郁的代价。感情的快乐过去以后，最多只会让感官疲倦一阵，而感官很快就能恢复。我羡慕你们。真的，我羡慕你们。
        - id: ch01-b59
          speaker: narrator
          text: >-
            他猛地停下来，嘴角又浮出那种古怪而探询的微笑。
        - id: ch01-b60
          speaker: wolf_larsen
          text: >-
            不过你们要听清楚，我是用脑子羡慕，不是用心。是理性命令我羡慕你们，所以这种羡慕也是理智的产物。我就像一个清醒的人，看着一群醉汉。自己已经累得不行，也盼着能和他们一样醉过去。
        - id: ch01-b61
          speaker: humphrey
          text: 也像一个聪明人看着一群傻瓜，希望自己也能变成傻瓜。
        - id: ch01-b62
          speaker: narrator
          text: >-
            我笑出了声。拉森立刻赞同。
        - id: ch01-b63
          speaker: wolf_larsen
          text: >-
            正是这样。你们是一对有福气的穷光蛋傻瓜，钱袋里连一点事实也没有。
        - id: ch01-b64
          speaker: maud_brewster
          text: 可我们花起来和你一样大方。
        - id: ch01-b65
          speaker: wolf_larsen
          text: 比我还大方，因为你们一分钱也不用付。
        - id: ch01-b66
          speaker: maud_brewster
          text: 因为我们可以向永恒支取。
        - id: ch01-b67
          speaker: wolf_larsen
          text: >-
            无论你们真能支取，还是自己以为能，结果都一样。你们花掉根本没有的东西，换来的价值却比我花掉自己拥有的东西更多。可我拥有的一切，全是流汗挣来的。
        - id: ch01-b68
          speaker: maud_brewster
          text: 那你为什么不换一种货币做本位呢？
        - id: ch01-b69
          speaker: narrator
          text: >-
            她是在打趣。拉森很快看了她一眼，像是忽然生出了一半希望，接着又满怀遗憾地回答。
        - id: ch01-b70
          speaker: wolf_larsen
          text: >-
            太迟了。也许我想换，可我做不到。我的钱袋早让旧货币塞满了，而且它顽固得很。我怎么也没法承认，还有别的东西也算真正的货币。
          emotion: sad
        - id: ch01-b71
          speaker: narrator
          text: >-
            他不再说话。目光茫然地越过莫德，最后迷失在平静的海面上。那种古老而原始的忧郁又强烈地笼罩住他，令他在冲击下微微颤动。他靠这一番推理，把自己送进了忧郁的迷雾。再过几个小时，我们大概就会看到他心里的魔鬼醒来，开始四处作祟。我想起查理·弗鲁赛斯，也终于明白了拉森这份悲哀。那正是一个物质主义者永远要为自己的物质主义付出的代价。
