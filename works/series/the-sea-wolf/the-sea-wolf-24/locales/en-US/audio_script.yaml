audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
    louis:
      display_name: Louis
      tts:
        delivery: jovial and confidential, rushing into ominous excitement
        timbre: round, weathered, and resonant
        pace: lively with rolling rhythms
        pitch: medium-low
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
    smoke:
      display_name: Smoke
      tts:
        delivery: cautious, dry, and quietly defiant
        timbre: lean and weathered
        pace: steady
        pitch: medium-low
    latimer:
      display_name: Latimer
      tts:
        delivery: blunt and wryly amused
        timbre: rough and resonant
        pace: measured
        pitch: medium-low
    helmsman:
      display_name: Helmsman
      tts:
        delivery: alert and businesslike
        timbre: weathered and clear
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER XXIV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Some of the clearest memories of my life come from the forty hours after I discovered my love for Maud Brewster. Until I was thirty-five, I had lived quietly and in quiet places. Then, all at once, I found myself following a course of adventure more unreasonable and wild than anything I could have imagined. Never before had so many events and so much excitement been crowded into forty hours of my life. And even now, I cannot quite silence a small voice of pride that tells me, considering everything, I did rather well.
        - id: ch01-b02
          speaker: narrator
          text: >-
            It began at dinner that day. Wolf Larsen told the hunters that from then on they would eat in the steerage. Hunters on a sealing schooner usually ranked almost as officers, so this was unheard of. He offered no explanation, but his reason was plain. Horner and Smoke had been paying court to Maud. Their gallantry was harmless to her and rather ridiculous, but Wolf Larsen clearly disliked it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The news met with a dark silence. The other four hunters looked meaningfully at the two men who had caused their banishment. Jock Horner stayed quiet and showed nothing. Blood rushed into Smoke's forehead, and his mouth started to open. Wolf Larsen watched him with a hard shine in his eyes, waiting. But Smoke thought better of it and shut his mouth without speaking.
        - id: ch01-b04
          speaker: wolf_larsen
          text: >-
            Have you got something to say?
        - id: ch01-b05
          speaker: narrator
          text: >-
            It was a challenge, but Smoke would not take it.
        - id: ch01-b06
          speaker: smoke
          text: >-
            About what?
        - id: ch01-b07
          speaker: narrator
          text: >-
            He sounded so innocent that Wolf Larsen was thrown off balance, while the others smiled.
        - id: ch01-b08
          speaker: wolf_larsen
          text: >-
            Oh, nothing. I only thought you might want to complain.
        - id: ch01-b09
          speaker: smoke
          text: >-
            Complain about what?
        - id: ch01-b10
          speaker: narrator
          text: >-
            Now Smoke's mates were grinning openly. Wolf Larsen could have killed him. I have no doubt there would have been blood if Maud had not been there. Her presence was what made Smoke brave enough to play this game. He was far too discreet and cautious to provoke the captain at any other time, when Wolf's anger might be expressed through something stronger than words. I feared a struggle would break out right there at the table. But just then the helmsman called down through the open companionway, giving the dangerous moment a way to end.
        - id: ch01-b11
          speaker: helmsman
          text: >-
            Smoke astern!
        - id: ch01-b12
          speaker: wolf_larsen
          text: >-
            What direction?
        - id: ch01-b13
          speaker: helmsman
          text: >-
            Straight astern, sir.
        - id: ch01-b14
          speaker: latimer
          text: >-
            Could be a Russian ship.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The other hunters looked anxious. A Russian ship could mean only one thing: a cruiser. They knew roughly where the Ghost was, and that we were close to the forbidden sea. They also knew Wolf Larsen's famous record as a poacher. Every face turned toward him.
        - id: ch01-b16
          speaker: wolf_larsen
          emotion: happy
          text: >-
            We're perfectly safe. No salt mines for you this time, Smoke. But I'll give you five to one that it's the Macedonia.
        - id: ch01-b17
          speaker: narrator
          text: >-
            No one took the bet.
        - id: ch01-b18
          speaker: wolf_larsen
          text: >-
            And if it is the Macedonia, I'll give you ten to one that trouble is coming with her.
        - id: ch01-b19
          speaker: latimer
          text: >-
            No, thanks. I don't mind losing money, but I want some chance for it. You and your brother have never met without trouble. I'll put twenty to one on that.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Everyone smiled, Wolf Larsen included, and dinner continued without a fight. I paid the price for it. For the rest of the meal, Wolf treated me shamefully. He sneered and talked down to me until I trembled with anger. But for Maud's sake, I knew I had to master myself. My reward came when her eyes met mine for a moment. They spoke as clearly as words: Be brave. Be brave.
        - id: ch01-b21
          speaker: narrator
          text: >-
            After dinner, we went on deck. Any steamer was a welcome break in the sameness of the sea. The thought that this one was Death Larsen's Macedonia made it more exciting still. The hard breeze and heavy water from the afternoon before had eased all morning. At last, the weather was mild enough to lower the boats for an afternoon hunt. It promised to be a profitable one. Since daylight we had sailed across empty water, but now we were entering the seal herd.
        - id: ch01-b22
          speaker: narrator
          text: >-
            The smoke was still miles behind us and gaining fast when we lowered our boats. They spread out and headed north across the ocean. Every so often, we saw a sail drop, heard the shotguns, and watched the sail rise again. Seals were everywhere, the wind was fading, and all signs pointed to a great catch.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The Ghost sailed on to take her place downwind of the last boat. Around us, the ocean seemed carpeted with sleeping seals. I had never seen so many. They floated in pairs, in threes, and in clusters, lying full length on the water like lazy young dogs.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Beneath the approaching smoke, a steamer's hull and upper decks grew larger. It was the Macedonia. I read the name through the glasses when she passed less than a mile to starboard. Wolf Larsen stared at her savagely, while Maud watched with curiosity.
        - id: ch01-b25
          speaker: maud_brewster
          emotion: happy
          text: >-
            Captain Larsen, where is all that trouble you were certain was coming?
        - id: ch01-b26
          speaker: narrator
          text: >-
            A trace of amusement softened his face as he looked at her.
        - id: ch01-b27
          speaker: wolf_larsen
          text: >-
            What were you expecting? Did you think they'd board us and cut our throats?
        - id: ch01-b28
          speaker: maud_brewster
          text: >-
            Something of that kind. Seal hunters are so strange and new to me that I'm ready for almost anything.
        - id: ch01-b29
          speaker: wolf_larsen
          text: >-
            That's sensible. Your mistake was not expecting the worst.
        - id: ch01-b30
          speaker: maud_brewster
          emotion: surprised
          text: >-
            But what could be worse than having our throats cut?
        - id: ch01-b31
          speaker: wolf_larsen
          text: >-
            Having our purses cut. These days, the amount of money a man owns decides how well he can live.
        - id: ch01-b32
          speaker: maud_brewster
          text: >-
            Who steals my purse steals trash.
        - id: ch01-b33
          speaker: wolf_larsen
          text: >-
            The man who steals my purse steals my right to live, whatever the old saying claims. He takes my food and my bed, and that puts my life in danger. There aren't enough soup kitchens and breadlines for everyone. When a man's purse is empty, he usually dies miserably, unless he can fill it again in a hurry.
        - id: ch01-b34
          speaker: maud_brewster
          text: >-
            I still don't see how that steamer means to take anything from your purse.
        - id: ch01-b35
          speaker: wolf_larsen
          text: >-
            Wait. You'll see.
        - id: ch01-b36
          speaker: narrator
          text: >-
            We did not wait long. After passing several miles beyond our line of boats, the Macedonia began lowering her own. She carried fourteen boats to our five, because Wainwright's desertion had left us one short. First she dropped boats far downwind of our last one. Then she kept dropping them straight across the course our hunters were following. Her final boats landed far upwind of our first one. Our hunt was ruined. There were no seals left behind us. Ahead, the Macedonia's line of fourteen boats moved through the herd like one huge broom, sweeping the seals away before it.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Our men hunted across the two or three miles between their old positions and the places where the Macedonia's boats had entered the water. Once they reached that line, there was nothing to do but turn for home. By now, the wind was barely a whisper and the ocean was growing smoother by the minute. With the great herd all around, it was a perfect hunting day, one of only two or three that even a lucky ship might find in an entire season. And that perfect day now belonged to the Macedonia.
        - id: ch01-b38
          speaker: narrator
          text: >-
            The hunters, boat-pullers, and steerers came swarming angrily over our side. Every man felt robbed. They cursed as the boats were hoisted. If curses could kill, Death Larsen would have been finished for all eternity.
        - id: ch01-b39
          speaker: louis
          emotion: happy
          text: >-
            Dead and damned for a dozen eternities.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Louis's eyes twinkled up at me as he paused after pulling his boat's lashings tight.
        - id: ch01-b41
          speaker: wolf_larsen
          text: >-
            Listen to those men. Is it difficult to hear what matters most in their souls? Is it faith, love, or some high ideal? Is it goodness, beauty, or truth?
        - id: ch01-b42
          speaker: maud_brewster
          text: >-
            Their natural sense of right has been offended.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Maud had joined us from a dozen feet away. One hand rested on the main shrouds, and her body moved gently with the slight roll of the Ghost. She had not spoken loudly, yet her voice reached us, clear as a bell. It sounded wonderfully sweet to me. I hardly dared look at her for fear she would see what I felt.
        - id: ch01-b44
          speaker: narrator
          text: >-
            A boy's cap sat on her head. Sunlight caught her soft, loosely arranged brown hair until it seemed to glow around her delicate face. She was utterly enchanting, and there was something spiritual, almost saintly, about her. At the sight of her, all my old wonder at life came back. Beside her, Wolf Larsen's cold account of life and its meaning seemed truly absurd.
        - id: ch01-b45
          speaker: wolf_larsen
          text: >-
            Spoken like a sentimentalist, just like Mr. Van Weyden. Those men are cursing because their desires have been denied. That's all. And what do they desire? A large payday, so they can buy rich food and soft beds ashore. So they can have women and drink, stuff themselves, and behave like beasts. That is what expresses them most truly. Those are the best things in them, their finest hopes and their highest ideals, if you want to call them that. Watching them carry on isn't touching. Still, it shows how deeply they've been hurt. Their purses have been hurt, and when you lay a hand on their purses, you lay a hand on their souls.
        - id: ch01-b46
          speaker: maud_brewster
          emotion: happy
          text: >-
            You hardly look like someone whose purse has been hurt.
        - id: ch01-b47
          speaker: wolf_larsen
          text: >-
            Then I happen to be showing it differently, because both my purse and my soul have been hurt. Take the current price of skins in the London market. Then make a fair estimate of the catch we would have brought in this afternoon if the Macedonia hadn't grabbed it for herself. The Ghost has lost about fifteen hundred dollars' worth of skins.
        - id: ch01-b48
          speaker: maud_brewster
          text: >-
            Yet you sound so calm...
        - id: ch01-b49
          speaker: wolf_larsen
          emotion: angry
          text: >-
            I don't feel calm. I could kill the man who robbed me. Yes, I know. That man is my brother, and now you'll bring sentiment into it again. Bah!
        - id: ch01-b50
          speaker: narrator
          text: >-
            Then his face suddenly changed. The harshness left his voice, and what he said next was entirely sincere.
        - id: ch01-b51
          speaker: wolf_larsen
          text: >-
            You sentimentalists must truly be happy. You dream, you see goodness in things, and because you see goodness, you feel good yourselves. So tell me, both of you. Do you see any goodness in me?
        - id: ch01-b52
          speaker: narrator
          text: >-
            In one way, you are good to look at.
        - id: ch01-b53
          speaker: maud_brewster
          text: >-
            You have every power you need to do good.
        - id: ch01-b54
          speaker: wolf_larsen
          emotion: angry
          text: >-
            There it is! Those words mean nothing to me. Your thought has no clear, sharp shape. You can't hold it in your hands and examine it. In fact, it isn't a thought at all. It's a feeling, something built on illusion instead of reason.
        - id: ch01-b55
          speaker: narrator
          text: >-
            As he continued, his voice softened again. He began to speak as if he were sharing a private thought.
        - id: ch01-b56
          speaker: wolf_larsen
          text: >-
            Sometimes I catch myself wishing I could be blind to the facts of life too, and know only its dreams and illusions. Of course those things are wrong, completely wrong. They go against reason. Yet when I look at them, reason itself tells me something that reason ought to deny. It tells me that dreaming and living by illusions brings more pleasure, even if every dream is false.
        - id: ch01-b57
          speaker: wolf_larsen
          text: >-
            After all, pleasure is the pay we get for living. Without pleasure, life is a worthless act. To labor at living and receive no wages is worse than death. The person who feels the most pleasure is the person who lives the most. Your dreams and unreal things may not be facts, but they disturb you less and satisfy you more than all my facts satisfy me.
        - id: ch01-b58
          speaker: narrator
          text: >-
            He slowly shook his head and thought for a moment.
        - id: ch01-b59
          speaker: wolf_larsen
          text: >-
            I often wonder whether reason is worth having at all. Dreams must feel more solid and satisfying. Emotional pleasure fills you more deeply and stays with you longer than intellectual pleasure. And every moment of intellectual pleasure has to be paid for afterward with a spell of sadness. Emotional pleasure asks no such price. It only leaves the senses tired, and they soon recover. I envy you. I truly envy you.
        - id: ch01-b60
          speaker: narrator
          text: >-
            He stopped at once. Then one of his strange, questioning smiles appeared.
        - id: ch01-b61
          speaker: wolf_larsen
          text: >-
            Mind you, that envy comes from my brain, not my heart. My reason tells me to envy you. I'm like a sober man watching drunken men. He's exhausted, and he wishes he could be drunk too.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Or like a wise man watching fools and wishing he were a fool too.
        - id: ch01-b63
          speaker: wolf_larsen
          text: >-
            Exactly. You two are blessed fools with bankrupt pocketbooks. You haven't got a single fact in them.
        - id: ch01-b64
          speaker: maud_brewster
          text: >-
            But we spend just as freely as you do.
        - id: ch01-b65
          speaker: wolf_larsen
          text: >-
            More freely, because it doesn't cost you anything.
        - id: ch01-b66
          speaker: maud_brewster
          text: >-
            That's because we draw our money from eternity.
        - id: ch01-b67
          speaker: wolf_larsen
          text: >-
            It makes no difference whether you truly draw on eternity or only believe you do. You spend money you haven't got. Yet that imaginary money buys you more than I get from spending the real money in my pocket, the money I sweated to earn.
        - id: ch01-b68
          speaker: maud_brewster
          text: >-
            Then why not start using our kind of money?
        - id: ch01-b69
          speaker: narrator
          text: >-
            She teased him, and he looked at her quickly, almost with hope. But when he answered, his voice was full of regret.
        - id: ch01-b70
          speaker: wolf_larsen
          emotion: sad
          text: >-
            It's too late. Perhaps I'd like to change, but I can't. My pocketbook is stuffed with the old kind of money, and it's stubborn. I can never make myself accept anything else as real.
        - id: ch01-b71
          speaker: narrator
          text: >-
            He fell silent. His eyes drifted past Maud and became lost in the peaceful sea. His old, deep sadness had taken hold of him, and his whole body trembled with it. By following his own reasoning, he had brought this spell of gloom upon himself. I knew what would follow. Within a few hours, the devil inside him would be awake and stirring.
        - id: ch01-b72
          speaker: narrator
          text: >-
            I remembered Charley Furuseth. Wolf Larsen's sorrow was the price a materialist must always pay for his materialism.
