audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    thomas_mugridge:
      display_name: 托马斯·马格里奇
      tts:
        delivery: 油滑做作，得意时夸张卖弄，醉后含混黏滞
        timbre: 尖细而浑浊的成年男声
        pace: 平时急促，醉后拖沓不稳
        pitch: 中高音
    louis:
      display_name: 路易
      tts:
        delivery: 老练谨慎，说话带着水手的直率和善意
        timbre: 粗粝而沉稳的成年男声
        pace: 不紧不慢，警告时格外郑重
        pitch: 中低音
    george_leach:
      display_name: 乔治·利奇
      tts:
        delivery: 强硬粗豪，受伤后仍冷静得令人发寒
        timbre: 年轻结实、带有沙砾感的男声
        pace: 短促有力
        pitch: 中音
    jock_horner:
      display_name: 乔克·霍纳
      tts:
        delivery: 安静温和，即使说狠话也不动声色
        timbre: 柔和内敛的成年男声
        pace: 从容缓慢
        pitch: 中低音
    smoke:
      display_name: 斯莫克
      tts:
        delivery: 干脆世故，像在点评一场早已看透的较量
        timbre: 略显沙哑的成年男声
        pace: 简短利落
        pitch: 中音
  chapters:
    - id: ch01
      title: 第九章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我在海狼·拉森身边歇了整整三天。那三天简直像上天赐给我的福气。我坐在大舱的餐桌旁吃饭，手里的活儿一概不用管，只顾着和他谈人生、文学，还有宇宙。托马斯·马格里奇却气得直冒火，一个人干完自己的差事，还得替我干活。
        - id: ch01-b02
          speaker: narrator
          text: >-
            有半个钟头，甲板上难得清闲。拉森正忙着平息猎手们的一场争吵，路易趁机提醒我。
        - id: ch01-b03
          speaker: louis
          text: >-
            我只能劝你一句，小心暴风。
        - id: ch01-b04
          speaker: narrator
          text: >-
            我追问他，到底会出什么事。
        - id: ch01-b05
          speaker: louis
          text: >-
            谁说得准呢？那个人说变就变，跟天上的气流、海里的水流一个样。你永远猜不透他。你刚以为摸清了他的脾气，正顺着他驶得好好的，他忽然就会掉头，迎面吼着冲过来，把你那些好天气里用的帆撕个粉碎。
        - id: ch01-b06
          speaker: narrator
          text: >-
            所以，路易说的暴风真落到我头上时，我并不十分意外。那天，我和拉森又为人生争得很凶。我胆子越来越大，对他和他的生活毫不留情地批判起来。说到底，我是在活活解剖他，像他一向解剖别人那样，把构成他灵魂的材料翻开，一层一层地细看。我说话本来就尖刻，这也许正是我的弱点。可那一次，我把所有克制都抛到风里，只管一刀一刀地往下割，终于逼得他整个人都像野兽一样咆哮。他晒得深褐的脸因愤怒而发黑，双眼冒火，里面没有半分清醒或理智，只剩疯子的骇人狂怒。那一刻，我看见了他体内的狼，一头真正发疯的狼。
        - id: ch01-b07
          speaker: narrator
          text: >-
            他低吼着扑上来，一把抓住我的胳膊。我明明在心里发抖，还是硬撑着不肯退让。可他的力量太可怕了。那只手攥住我的上臂，五指一收，我立刻瘫了下去，疼得放声惨叫。双脚根本撑不住身体，肌肉也不再听使唤。我只能感觉到，上臂正被他一点点捏成肉泥。
        - id: ch01-b08
          speaker: narrator
          text: >-
            忽然，他眼里闪过一丝清明，手也松了。他短短地笑了一声，听起来更像野兽低吼。我浑身发虚，倒在地上。他坐回去，点起一支雪茄，像猫看老鼠那样看我。我疼得来回扭动，又在他的目光里看见了熟悉的东西。那是好奇，是惊异和困惑，也是永远得不到答案的追问。他又在问，这一切到底算什么。
        - id: ch01-b09
          speaker: narrator
          text: >-
            我总算爬起来，登上舷梯。那几天的好日子已经完了，我只能回厨房。左臂麻木得像瘫了一样，几天后才勉强能动，过了几个星期，最后一点僵硬和疼痛才退去。可他既没扭，也没拧，不过把手放到我的胳膊上，慢慢收紧五指。直到第二天，我才知道他真使出力气会是什么样子。那天，他把头探进厨房，摆出重修旧好的样子，问我的胳膊怎么样。
        - id: ch01-b10
          speaker: wolf_larsen
          text: >-
            你该庆幸，事情本来还能更糟。
        - id: ch01-b11
          speaker: narrator
          text: >-
            他笑着说完，从我削土豆的盆里拿起一只结实的生土豆。手掌一合，土豆泥立刻从他的指缝间一股股挤出来。他把剩下的烂泥扔回盆里，转身走了。我突然清楚地看见，倘若那个怪物对我用了全力，我会变成什么模样。
        - id: ch01-b12
          speaker: narrator
          text: >-
            不管怎样，那三天休息救了我的膝盖。肿消下去不少，膝盖骨也像是慢慢回到了原位。可我早就料到，马格里奇会逼我为这三天付账。他不停咒骂我，恶狠狠地使唤我，还把自己的活儿全压过来。有一次，他甚至举起拳头要打我。我也快变成野兽了，竟对着他的脸龇牙低吼，吼得他退了回去。
        - id: ch01-b13
          speaker: narrator
          text: >-
            我不愿回想那时的自己。汉弗莱·范·魏登蹲在污秽的厨房角落，埋头做苦工，又抬起脸盯着那个准备打他的畜生。他翻起嘴唇，像狗一样露出牙齿。那双眼睛里有恐惧，有无助，也有被恐惧和无助逼出来的勇气。这景象太像一只落进陷阱的老鼠，我实在不喜欢，也根本不愿再去想。不过，那一声低吼到底有用。马格里奇的拳头没有落下。
        - id: ch01-b14
          speaker: narrator
          text: >-
            他退了几步，用同样恶毒的目光瞪我。我们像两头关在一起、互相龇牙的野兽。他是个懦夫，看我没有先被吓垮，就不敢真打，便换了一个法子威胁我。厨房里有一把真正好用的刀，年头久了，刀身磨得又长又窄，样子格外凶狠。我起初每次拿它都要打个寒战。马格里奇向约翰逊借来磨刀石，故意当着我的面大张旗鼓地磨，还不时意味深长地瞟我一眼。
        - id: ch01-b15
          speaker: narrator
          text: >-
            他整天磨个不停，一有空就把刀和石头拿出来。刀口已经锋利得像剃刀，他仍用拇指肚试，又拿刀锋在指甲上刮，还削掉手背上的汗毛。随后，他像拿着显微镜似的眯眼细看刀刃，每回总能找出某处还有一点不平，或者假装找出一点不平。于是，刀又回到石头上，磨呀，磨呀，磨呀。那副做派实在太滑稽，我差点放声笑出来。
        - id: ch01-b16
          speaker: narrator
          text: >-
            可笑归可笑，危险却是真的。我看得出，他确实敢用那把刀。在他满身的怯懦底下，也藏着一种懦夫的勇气，和我的一样。这种勇气会逼着人去做一件事，哪怕他的整个天性都在抗拒，哪怕他怕得要命。水手们开始小声议论，说厨房佬正磨刀准备对付汉普，还拿这话逗他。马格里奇听了并不生气，反倒很受用，甚至颇为得意。他只管点头，故意装出一副预知凶兆、神秘莫测的样子。直到从前的舱房侍者乔治·利奇也粗声粗气地开了个玩笑。
        - id: ch01-b17
          speaker: narrator
          text: >-
            上次马格里奇陪船长打牌，利奇正是奉命拿海水浇他的水手之一，而且一定浇得非常彻底。马格里奇一直记着这笔账。两个人先互相辱骂，连祖宗都骂了进去。马格里奇用那把为我磨的刀威胁利奇。利奇只管笑，又把电报山码头上的脏话全骂了出来。谁也没来得及看清，刀光已经一闪。利奇的右臂从手肘到手腕整个被划开，鲜血像喷泉一样涌上甲板。
        - id: ch01-b18
          speaker: narrator
          text: >-
            马格里奇往后退，脸上带着恶魔般的神色，横刀防备。利奇却异常镇定。
        - id: ch01-b19
          speaker: george_leach
          text: >-
            厨房佬，我迟早会来找你，而且一定狠狠收拾你。我不急。等我来的时候，你手里不会有这把刀。
        - id: ch01-b20
          speaker: narrator
          text: >-
            利奇说完，转身静静地向船头走去。马格里奇的脸吓得毫无血色。他怕自己刚做下的事，更怕被他刺伤的人迟早来算账。可面对我，他反而比以前还凶。他虽然害怕将来要还这笔债，却也明白那一刀给我上了一课，于是越发跋扈，越发得意。看见自己放出的血以后，一股近乎疯狂的嗜欲也在他身上醒了。无论看向哪里，他眼前都像蒙着一层血红。他的心思纠结得可悲，我却看得明明白白，就像读一本摊开的书。
        - id: ch01-b21
          speaker: narrator
          text: >-
            几天过去，“幽灵号”仍在信风里劈着白浪前进。我敢肯定，疯狂正在马格里奇眼里一天天长大。我怕了，怕得厉害。磨呀，磨呀，磨呀，那个声音整天响着。他一面试刀锋，一面盯着我，目光像要吃肉的野兽。我不敢把后背交给他。每次离开厨房，我都只能倒退着出去。水手和猎手觉得有趣，常常专门凑成一群，看我怎样出门。
        - id: ch01-b22
          speaker: narrator
          text: >-
            那种折磨太难忍受了。有时我觉得自己的心智也快崩溃了。在这条满是疯子和畜生的船上，那倒十分合适。我活着的每一小时、每一分钟都有危险。我明明是个身陷苦难的人，可船头船尾没有一个灵魂肯给我足够的同情，伸手帮我。我偶尔想去求拉森发慈悲，脑中却立刻浮出他眼里那个嘲弄生命、质问生命的魔鬼，只好作罢。有时，我甚至认真想过自杀，只能拿出那套乐观哲学的全部力量，才没有在黑夜里翻过船舷，投入大海。
        - id: ch01-b23
          speaker: narrator
          text: >-
            拉森几次引我同他争论，我都只回几句短话，设法躲开。最后，他命令我暂时回餐桌边坐着，把活儿留给厨房佬。我索性全说了，告诉他，因为他偏爱我三天，马格里奇如今怎样折磨我。他笑眯眯地看着我。
        - id: ch01-b24
          speaker: wolf_larsen
          text: >-
            原来你怕了，是吗？
        - id: ch01-b25
          speaker: humphrey
          text: >-
            对，我就是害怕。
        - id: ch01-b26
          speaker: narrator
          text: >-
            我说得坦白，也说得挑衅。他的声音里带上了怒意。
        - id: ch01-b27
          speaker: wolf_larsen
          text: >-
            你们这种人真有意思。嘴上总爱感叹什么灵魂不朽，自己却怕死。一把快刀，一个胆小的伦敦佬，就叫生命对生命的贪恋压倒了你们所有漂亮的傻话。我的朋友，你不是相信自己永远活着吗？你是神，神怎么会被杀死？厨房佬伤不了你。你既然肯定自己会复活，还怕什么？
        - id: ch01-b28
          speaker: wolf_larsen
          text: >-
            前面等着你的是永生。说到不朽，你就是百万富翁，而且这份财产永远不会损失。它比星辰还难毁灭，和空间、时间一样长久。你的本金一分也少不了。不朽没有开头，也没有结尾。永恒就是永恒。就算你现在死在这里，以后也会在别处继续活。甩掉肉体，让关在里面的灵魂飞出去，多美啊。厨房佬伤不了你。他只是把你往那条永远走不完的路上推一把。
        - id: ch01-b29
          speaker: wolf_larsen
          text: >-
            当然，要是你现在还不想让人推，为什么不先推厨房佬一把？照你的说法，他也是个拥有不朽财富的百万富翁。你不可能让他破产，他的票据永远值足面额。杀掉他，也不会缩短他的生命，因为他无始无终，总会在某个地方用某种方式活下去。那就拿刀捅进去，放他的灵魂出来。它现在关在一座肮脏的监狱里，你砸开牢门，反倒是在帮他。谁知道呢，也许会有一个美丽的灵魂，从那副丑陋的躯壳里飞进蓝天。送他上路吧，我会提拔你接他的差事。他一个月能拿四十五美元。
        - id: ch01-b30
          speaker: narrator
          text: >-
            我彻底明白，拉森不会给我半点援助或怜悯。事情只能由我自己解决。恐惧逼出了勇气，我决定拿马格里奇自己的武器对付他。我向约翰逊借了磨刀石。领桨手路易早先求过我，想要炼乳和糖，那些好东西就藏在大舱地板下的储藏舱里。我瞅准机会偷了五罐炼乳。那天夜里轮到路易值班，我拿它们换来一把匕首。刀身又瘦又长，和马格里奇的菜刀一样凶狠，只是生了锈，刀口也钝。我转动砂轮，路易替我开刃。那一晚，我睡得比平常踏实。
        - id: ch01-b31
          speaker: narrator
          text: >-
            第二天吃过早饭，马格里奇又磨起刀来。我正跪着掏炉灰，警惕地看了他一眼。等我把灰倒到舷外再回来，他正对哈里森大讲往事。那个老实的乡下人听得入迷，脸上全是惊奇。
        - id: ch01-b32
          speaker: thomas_mugridge
          text: >-
            可不是吗，那位大老爷还能怎么判？把俺送进雷丁监狱关两年呗。可俺他妈根本不在乎。另一个蠢货才叫俺收拾惨了，你真该看看。俺用的刀就跟这把一样，一刀捅进去，像戳进软黄油。他那声惨叫，比两便士戏园里的戏还好听。
        - id: ch01-b33
          speaker: narrator
          text: >-
            他瞟了我一眼，看看这番话有没有传进我耳朵，又说下去。
        - id: ch01-b34
          speaker: thomas_mugridge
          text: >-
            他哭着求俺，说：“汤米，俺不是有意的，上帝作证，俺真不是有意的！”俺就告诉他：“俺这回非把你好好修理一顿！”说完，俺追着他不放，把他割成了一条条的。他一直惨叫。有一回，他用手攥住刀刃，想把刀按住。俺一抽刀，直接割到了骨头。哈，那模样真该让你看看。
        - id: ch01-b35
          speaker: narrator
          text: >-
            大副一声呼唤，打断了这段血淋淋的故事。哈里森往船尾去了。马格里奇坐在厨房高起的门槛上，接着磨刀。我放好铲子，平静地坐到他对面的煤箱上。他凶狠地瞪我，我也不慌不忙。虽然心脏跳得飞快，我还是抽出路易的匕首，放在石头上磨了起来。
        - id: ch01-b36
          speaker: narrator
          text: >-
            我以为这个伦敦佬准会爆发，没想到他像是根本没有看见，继续磨自己的刀。我也磨我的。我们面对面坐了两个钟头，磨呀，磨呀，磨呀。消息很快传开，差不多一半船员都挤到厨房门口看热闹。
        - id: ch01-b37
          speaker: narrator
          text: >-
            每个人都热心地鼓励我，还七嘴八舌地出主意。乔克·霍纳一向安静和气，看起来连老鼠都不会伤害，这时却认真教我。
        - id: ch01-b38
          speaker: jock_horner
          text: >-
            别去碰肋骨。从下面往腹部朝上刺，刀进去以后，再来一下“西班牙式”转腕。
        - id: ch01-b39
          speaker: narrator
          text: >-
            利奇故意把缠着绷带的胳膊摆在显眼处，求我无论如何给他剩下一点厨房佬的残骸。拉森也有一两次停在艉楼前端，好奇地朝我们望来。对他来说，眼前这番足以叫旁人激动的景象，大概只是那团叫作生命的酵母又在骚动、蠕爬。
        - id: ch01-b40
          speaker: narrator
          text: >-
            我得承认，那一阵子，我眼里的生命也变得一样卑污。这里没有美，也没有神性。只有两个胆小的活物坐着，用石头磨钢刀，旁边还有一群活物围观，有的怯懦，有的不怯懦。我敢说，其中一半人都想看我们彼此放血。对他们来说，那会是一场好戏。就算我俩真扑到一起拼命，我也不认为会有人上前阻拦。
        - id: ch01-b41
          speaker: narrator
          text: >-
            可换个角度看，整件事又幼稚得可笑。磨呀，磨呀，磨呀。汉弗莱·范·魏登竟然坐在船上的厨房里磨刀，还用拇指试刀锋！还有比这更难想象的事吗？和我属于同一个阶层的人，绝不会相信它可能发生。我一辈子被叫作“娘娘腔”范·魏登，自然有原因。如今，这个“娘娘腔”居然做得出这样的事，连汉弗莱·范·魏登自己也大吃一惊，不知道该得意，还是该羞愧。
        - id: ch01-b42
          speaker: narrator
          text: >-
            到头来，什么也没有发生。两个钟头一到，马格里奇收起刀和石头，向我伸出一只手。
        - id: ch01-b43
          speaker: thomas_mugridge
          text: >-
            咱俩干吗给这帮蠢货演他妈一场圣人戏？他们根本不喜欢咱们。要是能看见咱俩割开对方的喉咙，他们不知道会有多高兴。汉普，你还真不赖！照你们美国佬的说法，你有种。俺多少有点喜欢你。来，握手吧。
        - id: ch01-b44
          speaker: narrator
          text: >-
            我也许是个懦夫，却没有他那样怯懦。我已经明明白白地赢了一场，不肯去握那只可憎的手，把胜利让回去一分。
        - id: ch01-b45
          speaker: thomas_mugridge
          text: >-
            成吧，随你握不握。俺照样喜欢你。
        - id: ch01-b46
          speaker: narrator
          text: >-
            为了保住面子，他立刻凶狠地转向围观的人。
        - id: ch01-b47
          speaker: thomas_mugridge
          text: >-
            都他妈滚出俺厨房门口，你们这帮混账水手！
          emotion: angry
        - id: ch01-b48
          speaker: narrator
          text: >-
            他又举起一壶冒着蒸汽的热水，替自己的命令壮威。水手们一见，赶忙四散躲开。这也算马格里奇赢了一回，让他能更体面地接受我给他的失败。当然，他还算谨慎，只敢对水手们逞威风，根本不敢试着把那些猎手也从门口赶走。
        - id: ch01-b49
          speaker: smoke
          text: >-
            我看，厨房佬这回完了。
        - id: ch01-b50
          speaker: jock_horner
          text: >-
            那还用说。从现在起，厨房归汉普管，厨房佬只能把犄角收回去了。
        - id: ch01-b51
          speaker: narrator
          text: >-
            马格里奇听见了，飞快地瞟我一眼。我却像是根本没听到。我原本没想到这场胜利会这样彻底，不过，已经得到的东西，我决定一分也不放手。后来的日子证明，斯莫克说对了。这个伦敦佬在我面前越来越卑躬屈膝，甚至比面对拉森时还要奴颜婢膝。我不再叫他“先生”或“阁下”，不再刷那些油腻的锅，也不再削土豆。我只做自己的活儿，什么时候做、怎么做，也都由我决定。
        - id: ch01-b52
          speaker: narrator
          text: >-
            我还像个水手一样，把匕首连鞘挂在腰间。从此面对托马斯·马格里奇，我始终只有一种态度。那里面，一份是盛气凌人，一份是侮辱，另一份是轻蔑。
