  chapters:
    - id: ch01
      title: CHAPTER IX
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I spent three blessed days resting with Wolf Larsen. I ate at the cabin table and did nothing but talk with him about life, literature, and the universe. All the while, Thomas Mugridge raged in the galley and did my work as well as his own.
        - id: ch01-b02
          speaker: narrator
          text: >-
            During a spare half-hour on deck, while Wolf Larsen settled a quarrel among the hunters, Louis gave me a warning.
        - id: ch01-b03
          speaker: louis
          text: >-
            All I can tell you is, watch out for squalls.
        - id: ch01-b04
          speaker: narrator
          text: >-
            I asked him to be more definite.
        - id: ch01-b05
          speaker: louis
          text: >-
            There's no telling what he'll do. The man's as contrary as wind and water. Just when you think you know his course and have found a good way to sail alongside him, he'll whirl about, come roaring straight at you, and tear every fair-weather sail you've got to rags.
        - id: ch01-b06
          speaker: narrator
          text: >-
            So when Louis's squall struck me, I was not entirely surprised. Wolf Larsen and I were arguing fiercely about life. I had grown too bold. I judged both the man and the way he lived, turning over the deepest parts of him as sharply and thoroughly as he so often examined other people. My speech can be cutting, and this time I threw away all restraint. I cut at him with words until every part of him seemed to snarl. His dark, sun-browned face blackened with fury, and his eyes blazed. There was no clear thought or sanity in them, only the terrible rage of a madman. I saw the wolf in him then, and it was a mad wolf.
        - id: ch01-b07
          speaker: narrator
          text: >-
            With half a roar, he sprang at me and seized my upper arm. I meant to face him down, though I was trembling inside. Then his fingers tightened. His strength swept away all my courage. I screamed, my legs gave way, and I could no longer stand against the pain. It felt as if my arm were being crushed to pulp.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Then a clear gleam returned to his eyes. He let go and gave a short laugh that sounded more like a growl. I dropped to the floor, faint and twisting with pain. He sat down, lit a cigar, and watched me like a cat watching a mouse. Even as I writhed there, I could see the familiar curiosity in his face. He looked puzzled and searching, as if the same endless question had returned once more. What was life, and what did any of it mean?
        - id: ch01-b09
          speaker: narrator
          text: >-
            At last I crawled to my feet and climbed the companion stairs. My fair weather was over. There was nothing left for me but a return to the galley. My left arm felt paralyzed. Days passed before I could use it again, and weeks went by before the last stiffness and pain disappeared. Yet Wolf Larsen had not twisted or jerked it at all. He had simply placed his hand around my arm and closed his fingers with steady pressure.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The next day, he put his head into the galley and asked how my arm was doing, as if the question were a friendly gesture.
        - id: ch01-b11
          speaker: wolf_larsen
          text: >-
            It could have been worse.
        - id: ch01-b12
          speaker: narrator
          text: >-
            He smiled while I went on peeling potatoes. Then he picked up a firm, fair-sized potato that had not yet been peeled. He closed his hand around it and squeezed. The potato shot between his fingers in soft streams. He dropped the pulpy remains into the pan and walked away. In that instant, I saw exactly what might have happened if that monster had used his real strength on my arm.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Still, those three days of rest had helped my injured knee. The swelling was much smaller, and the kneecap seemed to be settling into place. But the rest also brought the trouble I had expected. Mugridge meant to make me pay for every hour of favor I had received. He cursed me, treated me viciously, and piled his work on top of mine.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Once he even raised his fist to strike me. By then, I too was becoming like an animal. I crouched over my task in a corner of the filthy galley and lifted my face toward his. My lips pulled back, and I snarled so fiercely that he drew away without striking. I hate to remember myself that way. My eyes must have shone with fear and helplessness, but also with the strange courage that fear and helplessness can bring. I looked like a rat caught in a trap. I do not enjoy the picture, and I would rather not think of it. Yet it worked. His fist never came down.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Mugridge backed off, glaring at me with the same hatred I showed him. We were two beasts shut in together, each baring his teeth. He was too cowardly to hit me when I would not shrink before the blow, so he found another way to frighten me.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The galley had only one knife worth using. Years of service had worn it down to a long, narrow blade. It looked so cruel that, when I first began using it, I shuddered every time I picked it up. Mugridge borrowed a stone from Johansen and began sharpening the knife for show. All day, whenever he had a spare moment, he drew the blade up and down the stone and looked meaningfully at me. Soon the steel had a razor edge. He tested it on the ball of his thumb and across his nail. He shaved hairs from the back of his hand. Then he studied the blade with great care and always seemed to discover one more tiny flaw. Back it went to the stone. Whet, whet, whet. The performance became so absurd that I could almost have laughed aloud.
        - id: ch01-b17
          speaker: narrator
          text: >-
            But it was serious too. I learned that Mugridge was capable of using the knife. Beneath his cowardice lay the desperate courage of a coward, the kind that might drive him to do the very thing he feared. Sailors began whispering that Cooky was sharpening his knife for Hump. Some teased him about it, and he enjoyed their notice, nodding as though he knew something dreadful that no one else did.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Then George Leach, the former cabin boy, made a rough joke about it. Leach had been one of the sailors ordered to drench Mugridge after the cook's card game with the captain, and he had done the job thoroughly. Mugridge had never forgiven him. Angry words followed, then vicious insults about each other's families. Mugridge threatened him with the knife he had been sharpening for me. Leach only laughed and answered with more abuse from the streets of Telegraph Hill.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Before either Leach or I understood what was happening, Mugridge slashed the knife across Leach's right arm from elbow to wrist. The cook jumped back with a fiendish look, holding the blade ready to defend himself. Blood spurted onto the deck, but Leach remained remarkably calm.
        - id: ch01-b20
          speaker: leach
          text: >-
            I'll get you, Cooky, and when I do, I'll get you hard. I'm in no hurry. I'll wait until you haven't got that knife.
        - id: ch01-b21
          speaker: narrator
          text: >-
            With that, Leach turned and walked quietly forward. Mugridge's face went pale with fear. He understood what he had done, and he knew that sooner or later Leach would demand payment for it. Yet his manner toward me became more savage than ever. Even while fearing the punishment ahead, he could see that the stabbing had served as a lesson for me. That made him proud, domineering, and almost joyful. The blood he had drawn awakened a wild hunger in him. Wherever he looked, he seemed to see red. His mind was tangled, but I could read its workings as plainly as a printed page.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Several days passed as the Ghost foamed onward through the trade winds. I could have sworn that madness was growing in Mugridge's eyes, and I became deeply afraid. Whet, whet, whet went the knife all day. He would feel its sharp edge and stare at me with the hungry look of a flesh-eating animal. I dared not turn my back on him. Whenever I left the galley, I walked out backward. This delighted the sailors and hunters, who made a point of gathering in groups to watch my careful retreat.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The strain nearly broke me. At times I thought my mind would fail, which would have been fitting on that ship of madmen and brutes. Every hour and every minute, I believed my life was in danger. I was a human soul in distress, yet not one soul aboard, forward or aft, showed enough sympathy to help. Sometimes I considered throwing myself on Wolf Larsen's mercy. Then I remembered the mocking devil in his eyes, always questioning life and sneering at it, and I held back. At other times I seriously thought of suicide. It took all the strength of my hopeful philosophy to keep me from going over the side in the darkness of night.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Wolf Larsen tried several times to draw me into another discussion, but I answered briefly and escaped. At last he ordered me back to the cabin table and told me to leave my work to the cook. I spoke openly then. I told him what Mugridge was putting me through because of those three favored days. Wolf Larsen watched me with smiling eyes.
        - id: ch01-b25
          speaker: wolf_larsen
          text: >-
            So you're afraid, are you?
        - id: ch01-b26
          speaker: narrator
          text: >-
            I answered him honestly and with defiance.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Yes. I am afraid.
        - id: ch01-b28
          speaker: wolf_larsen
          emotion: angry
          text: >-
            That's always the way with men like you. You talk sentimentally about your immortal souls, but you're afraid to die. The moment you see one sharp knife and one cowardly Cockney, your grip on life becomes stronger than all that foolish belief. But my dear fellow, you're going to live forever, aren't you? You're a god, and God can't be killed. Cooky can't truly harm you. Your resurrection is certain. So tell me, what is there to fear?
        - id: ch01-b29
          speaker: wolf_larsen
          text: >-
            Eternal life lies ahead of you. You're a millionaire in immortality, and your fortune can never be lost. It will last longer than the stars, as long as space and time. You can't reduce your riches by a single coin. Immortality has no beginning or end. Eternity is eternity. Even if you die here and now, you'll simply go on living somewhere else afterward. Isn't it all very beautiful? You shake off the flesh, and the imprisoned spirit rises free. Cooky can't hurt you. He can only give you a helpful push along the road you must travel forever.
        - id: ch01-b30
          speaker: wolf_larsen
          text: >-
            Or if you don't want that push just yet, why not give Cooky one? By your own ideas, he is an immortal millionaire too. You can't bankrupt him, and you can't shorten his life by killing him. He is bound to continue somewhere, somehow. So put a knife into him and free his spirit from that nasty prison. You'd only be doing him a kindness by breaking down the door. Who knows? A beautiful spirit may soar into the blue from that ugly body. Help him on his way, and I'll promote you to his job. It pays forty-five dollars a month.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Plainly, Wolf Larsen would give me neither help nor mercy. I had to protect myself. Out of the courage that fear had given me, I decided to fight Mugridge with his own weapon.
        - id: ch01-b32
          speaker: narrator
          text: >-
            I borrowed a whetstone from Johansen. Louis, the boat-steerer, had already asked me for condensed milk and sugar. Those treats were kept in the lazarette beneath the cabin floor. I watched for an opportunity, stole five cans of milk, and waited until Louis had the night watch on deck. Then I traded the cans for a dirk as long, narrow, and cruel-looking as the cook's vegetable knife. The blade was rusty and dull, so I turned the grindstone while Louis gave it a sharp edge. For the first time in days, I slept more soundly that night.
        - id: ch01-b33
          speaker: narrator
          text: >-
            After breakfast the next morning, Mugridge began again. Whet, whet, whet. I watched him carefully while I knelt to clear ashes from the stove. When I came back from throwing them overboard, he was telling Harrison a story. Harrison's honest country face was full of wonder.
        - id: ch01-b34
          speaker: mugridge
          text: >-
            Yes, and what did His Worship do? Sent me to Reading for two years. Not that I cared. I fixed the other fellow properly. You should've seen him. I had a knife just like this one. It went into him like soft butter, and he squealed better than any cheap theater show.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Mugridge glanced toward me to make sure I was listening, then continued.
        - id: ch01-b36
          speaker: mugridge
          text: >-
            He started sniveling that he hadn't meant it, swearing to God. I told him I'd fix him, and I kept after him till I'd cut him to ribbons. He squealed the whole time. Once he grabbed the blade and tried to hold it. Wrapped his fingers right around it. I pulled it through and cut clear to the bone. Oh, he was a sight.
        - id: ch01-b37
          speaker: narrator
          text: >-
            The mate called, and Harrison went aft before the bloody tale was finished. Mugridge sat on the raised galley threshold and kept sharpening. I put away the ash shovel, then calmly sat on the coal box facing him. He gave me a vicious stare. My heart was pounding, but I drew Louis's dirk and began passing it over my own stone.
        - id: ch01-b38
          speaker: narrator
          text: >-
            I had expected almost any kind of explosion from Mugridge. To my surprise, he acted as though he had not noticed what I was doing. He sharpened his knife, and I sharpened mine. Neither of us stopped. For two hours we sat face to face, each drawing steel across stone. Whet, whet, whet. The news traveled through the ship, until half the company crowded around the galley doors to watch the sight.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Advice and encouragement came freely. Jock Horner was a quiet hunter who looked too gentle to hurt a mouse, but even he offered me instructions.
        - id: ch01-b40
          speaker: horner
          text: >-
            Don't bother with the ribs. Thrust upward into the belly, then give the blade what they call the Spanish twist.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Leach stood there with his bandaged arm held where everyone could see it.
        - id: ch01-b42
          speaker: leach
          text: >-
            Just be sure you leave a few pieces of Cooky for me.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Wolf Larsen paused once or twice at the break of the poop deck and looked on with curiosity. To him, we must have seemed like bits of that yeasty thing he called life, stirring and crawling before his eyes. Our fear and fury were no more than another experiment for him to observe.
        - id: ch01-b44
          speaker: narrator
          text: >-
            For the moment, life had taken on the same ugly value for me. There was nothing beautiful or divine in what I saw. There were only two cowardly, moving creatures grinding steel against stone, surrounded by other creatures who watched, some cowardly and some not. I felt sure that half of them hoped to see us spill each other's blood. To them, it would have been entertainment. If Mugridge and I had closed in a fight to the death, I did not believe a single man would have stepped between us.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Yet the whole scene was laughable and childish too. Whet, whet, whet. There sat Humphrey Van Weyden in a ship's galley, sharpening a knife and testing the edge with his thumb. Of all the strange situations I had known, this was the hardest to imagine. People from my old life would never have believed it possible. They had called me Sissy Van Weyden all my days, and not without reason. Now the sight of that same Sissy Van Weyden preparing for a knife fight was a revelation even to me. I did not know whether to feel proud or ashamed.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Nothing happened. After two hours, Mugridge put away his knife and stone. Then he held out his hand.
        - id: ch01-b47
          speaker: mugridge
          text: >-
            What's the use of making a grand show of ourselves for these fools? They don't care about us. They'd be delighted to watch us cut each other's throats. You're not half bad, Hump. You've got spunk, as you Yanks say, and I like you in a way. Come on, then. Shake hands.
        - id: ch01-b48
          speaker: narrator
          text: >-
            I might have been a coward, but I was less of one than he was. I had won a clear victory, and I would not give up any part of it by touching his hateful hand. I refused.
        - id: ch01-b49
          speaker: mugridge
          text: >-
            All right. Take it or leave it. I won't like you any less for it.
        - id: ch01-b50
          speaker: narrator
          text: >-
            To save his pride, he wheeled on the men watching from the doorway.
        - id: ch01-b51
          speaker: mugridge
          emotion: angry
          text: >-
            Get away from my galley doors, you blasted swabs!
        - id: ch01-b52
          speaker: narrator
          text: >-
            He lifted a steaming kettle to strengthen the order. The moment the sailors saw it, they scrambled out of reach. Chasing them away gave Mugridge a small victory of his own, and that helped him accept more gracefully the defeat I had given him. Of course, he was too cautious to try driving the hunters away as well.
        - id: ch01-b53
          speaker: smoke
          text: >-
            That's the end of Cooky.
        - id: ch01-b54
          speaker: horner
          text: >-
            You can bet on it. Hump runs the galley now, and Cooky will keep his head down.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Mugridge heard them and shot a quick look at me, but I gave no sign that their words had reached me. Until that moment, I had not understood that my victory could reach so far or be so complete. Once I saw it, I resolved not to surrender a single thing I had gained.
        - id: ch01-b56
          speaker: narrator
          text: >-
            As the days passed, Smoke's prediction came true. Mugridge became more humble and obedient toward me than he was toward Wolf Larsen. I stopped calling him mister or sir. I no longer washed greasy pots or peeled potatoes. I did my own work and nothing more, doing it when I chose and in the way I chose. I also wore the dirk in a sheath at my hip, as a sailor would. From then on, I met Thomas Mugridge with a steady mixture of command, insult, and contempt.
