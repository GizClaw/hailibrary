audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
  chapters:
    - id: ch01
      title: CHAPTER XXX
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            There was good reason we called the place Endeavour Island. For two weeks, we labored over our hut. Maud would not be kept from the work. Her hands grew bruised and bloody, and the sight nearly made me weep. Yet I was proud of her too. She had been raised in comfort, and now she bore our terrible hardship with something heroic in her. With her little store of strength, she took on the work of a peasant woman.
        - id: ch01-b02
          speaker: narrator
          text: >-
            She gathered many of the stones that I set into the walls. Whenever I begged her to stop, she refused to listen. At last she made a compromise. She left the heaviest work to me and took charge of cooking, collecting driftwood, and gathering moss for our winter supply.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The walls went up easily enough. Then I reached the roof and found myself stopped. Four walls were useless without one, but what could I make it from? We had spare oars for roof beams, certainly. The covering was the trouble. Moss would not serve, and tundra grass would not work. We still needed the sail for the boat, while the tarpaulin had already begun to leak.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Winters covered his hut with walrus skins.
        - id: ch01-b05
          speaker: maud_brewster
          text: >-
            What about the seals?
        - id: ch01-b06
          speaker: narrator
          text: >-
            The next day, I began to hunt. I had never learned to shoot, so I had to teach myself. Thirty shells brought me only three seals. At that rate, our ammunition would be gone before I knew what I was doing. I had already wasted eight shells lighting fires before I discovered that wet moss would keep the embers alive. No more than a hundred remained in the box.
        - id: ch01-b07
          speaker: narrator
          text: >-
            I finally admitted that my shooting was hopeless.
        - id: ch01-b08
          speaker: narrator
          text: >-
            We'll have to club the seals. I've heard the sealers talk about doing it.
        - id: ch01-b09
          speaker: maud_brewster
          text: >-
            But they're so beautiful. I can't bear the thought of it. Clubbing them feels so openly brutal. Shooting them seems different somehow.
        - id: ch01-b10
          speaker: narrator
          text: >-
            That roof has to be finished. Winter is nearly here, and this is our lives against theirs. I wish we had more ammunition. Still, a club may cause less suffering than a body full of shot. Besides, I'll be the one who does it.
        - id: ch01-b11
          speaker: maud_brewster
          text: >-
            That's exactly the trouble.
        - id: ch01-b12
          speaker: narrator
          text: >-
            She began eagerly, then stopped in sudden confusion.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Of course, you can do it yourself if you'd rather.
        - id: ch01-b14
          speaker: maud_brewster
          text: >-
            Then what am I supposed to do?
        - id: ch01-b15
          speaker: narrator
          text: >-
            Her voice was soft, but I knew that softness. It meant she had made up her mind.
        - id: ch01-b16
          speaker: narrator
          text: >-
            You can gather firewood and cook our dinner.
        - id: ch01-b17
          speaker: narrator
          text: >-
            I tried to make the answer sound light. She shook her head.
        - id: ch01-b18
          speaker: maud_brewster
          text: >-
            It's too dangerous for you to try alone. Yes, I know what you'll say. I'm only a weak woman. But even my small amount of help might keep things from going badly.
        - id: ch01-b19
          speaker: narrator
          text: >-
            And what about the clubbing?
        - id: ch01-b20
          speaker: maud_brewster
          text: >-
            You'll do that part, of course. I shall probably scream. And when you... when it happens, I'll look away.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Now that sounds terribly dangerous.
        - id: ch01-b22
          speaker: narrator
          text: >-
            I laughed, but she answered with great dignity.
        - id: ch01-b23
          speaker: maud_brewster
          text: >-
            I shall decide for myself when to look and when not to.
        - id: ch01-b24
          speaker: narrator
          text: >-
            And so she came with me the following morning. I rowed into the neighboring cove and brought the boat close to the beach. Seals surrounded us in the water. Thousands more bellowed from the shore, and the roar was so great that we had to shout to hear one another.
        - id: ch01-b25
          speaker: narrator
          text: >-
            I know men club seals. The question is, how do they manage it?
        - id: ch01-b26
          speaker: narrator
          text: >-
            I was trying to give myself courage as I stared at a huge bull less than thirty feet away. He had risen on his front flippers and was watching me closely.
        - id: ch01-b27
          speaker: maud_brewster
          text: >-
            We could gather tundra grass and use that for the roof.
        - id: ch01-b28
          speaker: narrator
          text: >-
            She feared the attempt as much as I did, and no wonder. At that distance, the seals' shining teeth and doglike mouths looked dangerous.
        - id: ch01-b29
          speaker: narrator
          text: >-
            I always believed seals were afraid of people.
        - id: ch01-b30
          speaker: narrator
          text: >-
            I rowed a few strokes farther along the shore. Then another possibility came to me.
        - id: ch01-b31
          speaker: narrator
          text: >-
            How can I tell that they aren't afraid? Maybe the moment I step boldly onto the beach, they'll rush away so fast that I won't catch a single one.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Even as I said it, I remained in the boat.
        - id: ch01-b33
          speaker: maud_brewster
          text: >-
            I once heard about a man who walked into the nesting grounds of wild geese. They killed him.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The geese killed him?
        - id: ch01-b35
          speaker: maud_brewster
          text: >-
            Yes, the geese. My brother told me the story when I was little.
        - id: ch01-b36
          speaker: narrator
          text: >-
            But men do club seals. That much I know.
        - id: ch01-b37
          speaker: maud_brewster
          text: >-
            Tundra grass might make a perfectly good roof.
        - id: ch01-b38
          speaker: narrator
          text: >-
            She meant to hold me back, but her words had the opposite effect. I could not look like a coward in front of her.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Here I go.
        - id: ch01-b40
          speaker: narrator
          text: >-
            I backed the water with one oar and ran the bow onto the beach. Then I climbed out and marched bravely toward a long-maned bull surrounded by his cows. My weapon was the ordinary club the boat-pullers used on wounded seals after the hunters brought them aboard. It measured only a foot and a half. In my magnificent ignorance, I had no idea that the clubs used on shore were four or five feet long.
        - id: ch01-b41
          speaker: narrator
          text: >-
            The cows heaved themselves out of my path. Step by step, I closed the distance between the bull and me. He pushed himself higher on his flippers with an angry movement. At twelve feet, I kept coming, certain he would turn and flee at any moment.
        - id: ch01-b42
          speaker: narrator
          text: >-
            At six feet, a frightened question shot through me. What if he did not run? Then I would club him, I told myself. Fear had made me forget that killing him was the whole reason I had come ashore.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Just then, the bull snorted, snarled, and charged. His eyes blazed. His mouth opened wide, and his teeth flashed cruelly white. I admit without shame that I was the one who ran. His stride looked clumsy, but he was fast. I tumbled into the boat with the bull only two steps behind me. As I pushed away with an oar, his jaws closed on the blade and crushed the solid wood like an eggshell.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Maud and I stared in astonishment. A moment later, he dived beneath us, caught the keel between his teeth, and shook the whole boat violently.
        - id: ch01-b45
          speaker: maud_brewster
          emotion: surprised
          text: >-
            My goodness! Let's go back.
        - id: ch01-b46
          speaker: narrator
          text: >-
            I shook my head.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Other men have done this, so I can do it too. I know seals have been clubbed before. But next time, I think I'll stay away from the bulls.
        - id: ch01-b48
          speaker: maud_brewster
          text: >-
            I wish you would stop.
        - id: ch01-b49
          speaker: narrator
          emotion: angry
          text: >-
            And please don't start begging me.
        - id: ch01-b50
          speaker: narrator
          text: >-
            I believe I spoke half angrily. Maud said nothing, and I knew I had hurt her.
        - id: ch01-b51
          speaker: narrator
          text: >-
            I'm sorry. If you tell me to turn around, I will. But to be honest, I'd rather keep trying.
        - id: ch01-b52
          speaker: narrator
          text: >-
            I had to shout the apology above the thunder of the rookery.
        - id: ch01-b53
          speaker: maud_brewster
          text: >-
            And don't tell me this is what happens when you bring a woman with you.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Her smile was teasing and glorious. It told me at once that I was forgiven.
        - id: ch01-b55
          speaker: narrator
          text: >-
            I rowed two hundred feet down the beach until my courage returned, then went ashore once more.
        - id: ch01-b56
          speaker: maud_brewster
          emotion: fearful
          text: >-
            Please be careful!
        - id: ch01-b57
          speaker: narrator
          text: >-
            I nodded and approached the nearest harem from the side. Everything went well until I swung at the head of a cow on the edge of the group and missed. She snorted and struggled to get away. I rushed closer and struck again, but the club hit her shoulder instead of her head.
        - id: ch01-b58
          speaker: maud_brewster
          emotion: fearful
          text: >-
            Look out!
        - id: ch01-b59
          speaker: narrator
          text: >-
            In my excitement, I had forgotten to watch anything else. I looked up and saw the master of the harem charging straight at me. Once again, I ran for the boat with a bull close behind. This time, Maud did not ask me to go home.
        - id: ch01-b60
          speaker: maud_brewster
          text: >-
            Perhaps you should leave the harems alone and look for seals that are by themselves and seem less dangerous. I think I've read about them in a book by Dr. Jordan. They're young bulls, too young to have harems of their own. He called them holluschickie, or something close to that. We might manage it if we could find where they come ashore.
        - id: ch01-b61
          speaker: narrator
          text: >-
            It sounds as if your fighting spirit has finally awakened.
        - id: ch01-b62
          speaker: narrator
          text: >-
            I laughed. She flushed quickly.
        - id: ch01-b63
          speaker: maud_brewster
          text: >-
            I admit I dislike losing as much as you do. But I still dislike killing such beautiful, harmless creatures.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Beautiful? I saw nothing especially beautiful in those beasts chasing me with foam around their mouths.
        - id: ch01-b65
          speaker: maud_brewster
          emotion: happy
          text: >-
            That's because of where you were standing. You had no perspective. If you didn't have to get quite so close, you might see them differently.
        - id: ch01-b66
          speaker: narrator
          text: >-
            That's the answer! I need a longer club, and the broken oar is right here.
        - id: ch01-b67
          speaker: maud_brewster
          text: >-
            I've just remembered something Captain Larsen told me. When the men raid a rookery, they drive the seals inland in small groups before killing them.
        - id: ch01-b68
          speaker: narrator
          text: >-
            I don't intend to herd one of those harems.
        - id: ch01-b69
          speaker: maud_brewster
          text: >-
            But the holluschickie stay together, away from the harems. Dr. Jordan said there are paths between the harems. As long as the young bulls keep to those paths, the older bulls leave them alone.
        - id: ch01-b70
          speaker: narrator
          text: >-
            There's a young one in the water now. Let's watch him. If he comes ashore, we'll follow.
        - id: ch01-b71
          speaker: narrator
          text: >-
            The seal swam directly toward the beach and climbed out through a narrow opening between two harems. Their masters made warning sounds but did not attack. The young bull moved slowly inland, winding among the harems along what had to be a path.
        - id: ch01-b72
          speaker: narrator
          text: >-
            Here goes.
        - id: ch01-b73
          speaker: narrator
          text: >-
            I stepped out, though the thought of walking into the heart of that enormous herd left my heart in my mouth.
        - id: ch01-b74
          speaker: maud_brewster
          text: >-
            You should tie the boat securely first.
        - id: ch01-b75
          speaker: narrator
          text: >-
            She had climbed out beside me. I looked at her in amazement. Her determined nod answered me before she spoke.
        - id: ch01-b76
          speaker: maud_brewster
          text: >-
            Yes, I'm coming with you. You may as well fasten the boat and give me a club.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Then let's go home. Perhaps tundra grass will work after all.
        - id: ch01-b78
          speaker: narrator
          text: >-
            The words came out miserably.
        - id: ch01-b79
          speaker: maud_brewster
          text: >-
            You know it won't. Would you like me to go first?
        - id: ch01-b80
          speaker: narrator
          text: >-
            I could only shrug. My heart was full of admiration and pride for her. I gave Maud the broken oar and took another one for myself.
        - id: ch01-b81
          speaker: narrator
          text: >-
            We covered the first few yards in nervous fear. Once, a curious cow pushed her nose toward Maud's foot, and Maud screamed. Several times, I hurried my own steps for the same reason. Yet the seals did no more than cough warnings from either side. Hunters had never raided this rookery. The animals were not afraid of us, but they were mild-tempered too.
        - id: ch01-b82
          speaker: narrator
          text: >-
            In the very center of the herd, the noise was tremendous. It almost made us dizzy. My balance returned before Maud's did, and I paused to give her an encouraging smile. She was still badly frightened. She moved close to me and shouted over the din.
        - id: ch01-b83
          speaker: maud_brewster
          emotion: fearful
          text: >-
            I'm terribly afraid!
        - id: ch01-b84
          speaker: narrator
          text: >-
            By then, I was not. The strangeness had not worn away, but the seals' peaceful behavior had settled my fear. Maud was trembling.
        - id: ch01-b85
          speaker: maud_brewster
          emotion: fearful
          text: >-
            I'm afraid, but at the same time, I'm not. It's only this wretched body of mine that's frightened. I'm not.
        - id: ch01-b86
          speaker: narrator
          emotion: calm
          text: >-
            You're all right. You're all right.
        - id: ch01-b87
          speaker: narrator
          text: >-
            Without thinking, I put an arm around her to protect her. I will never forget how suddenly aware I became of being a man. Something primitive stirred in the deepest part of me. I was the male who fought, the protector of the weak. More wonderful than anything, I was protecting the woman I loved.
        - id: ch01-b88
          speaker: narrator
          text: >-
            She leaned against me, light and fragile as a lily. As her trembling slowly faded, an immense strength seemed to rise in me. I felt equal to the fiercest bull in the herd. If one had charged us then, I knew I would have faced it without flinching. I would have met it calmly, and I would have killed it.
        - id: ch01-b89
          speaker: maud_brewster
          emotion: calm
          text: >-
            I'm all right now. Let's keep going.
        - id: ch01-b90
          speaker: narrator
          text: >-
            She looked up at me gratefully. Knowing that my strength had quieted her and restored her courage filled me with triumphant joy. Though I was a man made soft by civilization, the youth of the human race seemed to grow inside me. For a moment, I lived the ancient days of hunting and the forest nights of ancestors long forgotten. As we followed the path between the pushing harems, I thought that I had much to thank Wolf Larsen for.
        - id: ch01-b91
          speaker: narrator
          text: >-
            A quarter of a mile inland, we found the holluschickie. These were sleek young bulls, living alone as bachelors while they gathered strength for the day they would fight their way into the company of the older, mated bulls.
        - id: ch01-b92
          speaker: narrator
          text: >-
            From then on, everything went smoothly. Somehow, I seemed to understand exactly what to do. I shouted, waved my club, and prodded the lazy animals. Before long, I had separated twenty young bulls from the rest. Whenever one tried to turn back toward the sea, I moved in front of it and drove it inland again.
        - id: ch01-b93
          speaker: narrator
          text: >-
            Maud worked actively beside me. Her cries and the swinging broken oar were a great help. Still, I noticed that whenever a tired seal fell behind, she allowed it to escape. I noticed something else too. If a seal showed fight and tried to force its way past her, her eyes flashed brightly, and she struck it sharply with her club.
        - id: ch01-b94
          speaker: maud_brewster
          emotion: happy
          text: >-
            My, this is exciting! I think I need to sit down.
        - id: ch01-b95
          speaker: narrator
          text: >-
            Weakness had made her stop. I drove our little herd another hundred yards. Only twelve were left now, because of the ones she had let escape. By the time she caught up with me, the killing was over, and I had begun to skin the bodies.
        - id: ch01-b96
          speaker: narrator
          text: >-
            An hour later, we walked proudly back down the path between the harems. Twice more, we came that way carrying skins. Then I decided we had enough to cover the hut. I raised the sail, crossed out of that cove on one tack, and came into our own little inner cove on the other.
        - id: ch01-b97
          speaker: maud_brewster
          text: >-
            It feels just like coming home.
        - id: ch01-b98
          speaker: narrator
          text: >-
            Her words stirred an answering thrill in me as I ran the boat onto the beach. Everything about that moment felt dear, intimate, and natural.
        - id: ch01-b99
          speaker: narrator
          text: >-
            It feels as if this has always been my life. The world of books and the people who live among them seem faint now, almost like something I dreamed. Surely I've spent every day of my life hunting, raiding, and fighting. And you seem to belong to this life too.
        - id: ch01-b100
          speaker: narrator
          text: >-
            I nearly said, “my woman, my mate.” Instead, I smoothly changed the ending.
        - id: ch01-b101
          speaker: narrator
          text: >-
            You're bearing the hardship very well.
        - id: ch01-b102
          speaker: narrator
          text: >-
            But Maud heard the break in my sentence. She knew I had started toward one thought and stopped halfway. She looked at me quickly.
        - id: ch01-b103
          speaker: maud_brewster
          text: >-
            That wasn't what you meant. What were you going to say?
        - id: ch01-b104
          speaker: narrator
          text: >-
            I meant that the American Mrs. Meynell was living like a savage and doing remarkably well at it.
        - id: ch01-b105
          speaker: maud_brewster
          text: >-
            Oh.
        - id: ch01-b106
          speaker: narrator
          text: >-
            That was all she said, yet I could have sworn I heard disappointment in her voice.
        - id: ch01-b107
          speaker: narrator
          text: >-
            The words “my woman, my mate” stayed in my mind through the rest of that day and for many days afterward. They were loudest that night. I watched Maud pull back the moss blanket from the coals, breathe the fire awake, and prepare our evening meal.
        - id: ch01-b108
          speaker: narrator
          text: >-
            Some old savagery must have been sleeping inside me. Those ancient words reached down to the roots of the human race, and they held me there. They thrilled me so deeply that when I finally fell asleep, I was still murmuring them to myself, again and again.
