audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我们把这里叫作奋进岛，实在再合适不过。为了搭起一间木屋，我们足足苦干了两个星期。莫德一定要帮忙。她的双手又青又肿，还磨出了血，我看着几乎要掉泪，却也忍不住为她骄傲。这样一位从小受人呵护的女子，竟凭着那一点力气，忍受可怕的困苦，弯下腰去做农妇的粗活，实在称得上英勇。屋墙里的许多石头，都是她亲手捡来的。我一次又一次求她停下，她却像没听见似的。最后，她只肯退让一点，改做轻些的活儿，负责烧饭，还收集浮木和苔藓，为漫长的冬天储备燃料。
        - id: ch01-b02
          speaker: narrator
          text: >-
            四面墙砌起来并不费力，所有事情也一直很顺利，可屋顶却难住了我。没有屋顶，墙砌得再好又有什么用？备用船桨倒是现成的，可以拿来当椽子，可椽子上面又能铺什么呢？苔藓经不住风雨，冻原草也派不上用场。船帆还得留给小艇，唯一的防水油布又已经开始漏水了。
        - id: ch01-b03
          speaker: humphrey
          text: 温特斯当初搭屋子，盖的是海象皮。
        - id: ch01-b04
          speaker: maud_brewster
          text: 我们眼前不是就有海豹吗？
        - id: ch01-b05
          speaker: narrator
          text: >-
            第二天，我们便动手打猎。我根本不会开枪，只能一边打，一边学。结果为了打中三只海豹，竟用掉了三十发霰弹。照这个速度，恐怕我还没学会必要的本领，就得眼看着全部弹药见底。先前为了点火，我又白白浪费了八发。幸好后来想出办法，用湿苔藓把余烬埋住，不必每回重新生火。可如今箱子里无论如何也只剩下不到一百发了。
        - id: ch01-b06
          speaker: humphrey
          text: >-
            看来我们只能拿棍子打。我听那些捕海豹的人讲过，他们就是这样干的。
        - id: ch01-b07
          speaker: maud_brewster
          text: >-
            可它们那么漂亮，我一想到这件事就受不了。拿棍子打死它们，实在太直接，也太残忍了，跟开枪完全不是一回事。
        - id: ch01-b08
          speaker: humphrey
          text: >-
            屋顶总得盖上，冬天马上就来。这不是它们活，就是我们活。弹药不够，实在没有办法。而且我觉得，一棍打死总比一身都是枪伤少受些苦。动手的也是我。
        - id: ch01-b09
          speaker: maud_brewster
          text: 问题就在这儿……
        - id: ch01-b10
          speaker: narrator
          text: 她说得急切，却突然窘住了，没有再往下说。
        - id: ch01-b11
          speaker: humphrey
          text: 当然，你要是宁愿——
        - id: ch01-b12
          speaker: maud_brewster
          text: 那我要做什么？
        - id: ch01-b13
          speaker: narrator
          text: 她的声音很轻柔，可我太懂了，那里面是不会退让的坚持。
        - id: ch01-b14
          speaker: humphrey
          text: 你可以捡柴，再把午饭做好。
        - id: ch01-b15
          speaker: maud_brewster
          text: >-
            不行，你一个人去太危险。我知道自己只是个弱女子，可就算只能帮上一点点，说不定也能让你避开大祸。
        - id: ch01-b16
          speaker: humphrey
          text: 那打海豹的时候呢？
        - id: ch01-b17
          speaker: maud_brewster
          text: >-
            当然由你来打。我也许会尖叫。等你动手，我会把脸转开——
        - id: ch01-b18
          speaker: humphrey
          text: 这下可真是危险极了。
        - id: ch01-b19
          speaker: narrator
          text: 我笑了起来。
        - id: ch01-b20
          speaker: maud_brewster
          text: 该看的时候看，不该看的时候不看，我自己会拿主意。
        - id: ch01-b21
          speaker: narrator
          text: >-
            她说得郑重其事。事情就这样定了。第二天一早，她还是跟我一起去了。我把小艇划进旁边的海湾，一直靠到沙滩边缘。水里四处都有海豹游动，岸上成千上万只一齐吼叫。那声音压住了一切，我们近在咫尺，也只能扯着嗓子交谈。
        - id: ch01-b22
          speaker: humphrey
          text: >-
            我知道他们会用棍子打海豹。可他们到底是怎么打的？
        - id: ch01-b23
          speaker: narrator
          text: >-
            我这么说，倒像是在给自己打气。三十英尺外，一头大公海豹正用前鳍撑起身子，死死盯着我，我看得心里发虚。
        - id: ch01-b24
          speaker: maud_brewster
          text: 我们还是割冻原草盖屋顶吧。
        - id: ch01-b25
          speaker: narrator
          text: >-
            莫德跟我一样害怕。那些狗一样的嘴巴就在眼前，里面露着闪亮的尖牙，谁看了都不能不怕。
        - id: ch01-b26
          speaker: humphrey
          text: 我一直以为海豹怕人。可谁说它们不怕呢？也许我只要大胆上岸，它们就全逃了，我连追都追不上。
        - id: ch01-b27
          speaker: narrator
          text: 我又沿岸划了几桨，嘴上这样说，却还是迟迟不敢下船。
        - id: ch01-b28
          speaker: maud_brewster
          text: >-
            我听说从前有个人闯进野鹅筑巢的地方，最后被它们杀死了。
        - id: ch01-b29
          speaker: humphrey
          text: 被野鹅杀死了？
        - id: ch01-b30
          speaker: maud_brewster
          text: 对，就是野鹅。我小时候，哥哥告诉我的。
        - id: ch01-b31
          speaker: humphrey
          text: 但我知道，确实有人拿棍子打海豹。
        - id: ch01-b32
          speaker: maud_brewster
          text: 冻原草拿来盖屋顶，我看也一样好。
        - id: ch01-b33
          speaker: narrator
          text: >-
            她不是有意激我，可这句话偏偏把我逼了上去。我不能让她看见我胆怯。我说了一声“去就去”，便用一支桨向后划水，把船头送上了岸。
        - id: ch01-b34
          speaker: narrator
          text: >-
            我跨下船，朝一头长鬃毛的公海豹勇敢地走过去。它正守在自己的妻妾中间。我拿的只是一根普通短棍。猎手把受伤的海豹用钩子拖上船，划艇手就用这种棍子补上一击。它只有一英尺半长。我当时无知得可笑，根本不知道猎人在岸上袭击繁殖场时，用的棍子足有四五英尺。母海豹拖着笨重的身子给我让开。我越走越近，那头公海豹突然带着怒气，用鳍撑起身体。相隔只剩十二英尺，我还在一步一步向前，只等它随时转身逃跑。
        - id: ch01-b35
          speaker: narrator
          text: >-
            距离缩到六英尺，我脑中猛地闪过一个可怕的念头。它要是不逃呢？那就用棍子打它。答案明明如此，我却因为害怕，忘了自己本来就是来捉它的，并不是来逼它逃跑的。就在这时，公海豹喷着鼻息，低吼一声，直扑过来。它两眼冒火，嘴巴完全张开，里面的牙齿闪着凶狠的白光。
        - id: ch01-b36
          speaker: narrator
          text: >-
            我老实承认，转身逃走的是我。它跑起来虽笨，速度却快得很。我跌进小艇时，它只落后两步。我赶紧拿船桨撑着离岸，它却一口咬住桨叶，坚硬厚实的木头顿时像蛋壳一样碎了。我和莫德望着断桨，全都吓呆了。可事情还没完。紧接着，它钻到船底，用嘴咬住龙骨，拼命摇晃，把整条小艇弄得东倒西歪。
        - id: ch01-b37
          speaker: maud_brewster
          text: 天哪，我们回去吧。
          emotion: fearful
        - id: ch01-b38
          speaker: humphrey
          text: >-
            别人能做到，我也能做到。别人确实用棍子打过海豹。不过下一次，我不会再碰那些大公海豹了。
        - id: ch01-b39
          speaker: maud_brewster
          text: 我真希望你不要再试。
        - id: ch01-b40
          speaker: humphrey
          text: 可别又对我说“求你了，求你”。
          emotion: angry
        - id: ch01-b41
          speaker: narrator
          text: >-
            我几乎是在发火。她不再开口，我马上知道自己的语气伤了她。海豹的吼声铺天盖地，我只得大声向她道歉。
        - id: ch01-b42
          speaker: humphrey
          text: >-
            对不起。你只要说一声，我马上掉头回去。不过老实讲，我还是更想留下。
        - id: ch01-b43
          speaker: maud_brewster
          text: 现在你可别说，这就是带女人同行的下场。
        - id: ch01-b44
          speaker: narrator
          text: >-
            她的笑容顽皮又明亮。我一看就明白，她已经不怪我了。我沿着沙滩又划出两百来英尺，等自己恢复镇定，才再次登岸。
        - id: ch01-b45
          speaker: maud_brewster
          text: 一定要小心！
        - id: ch01-b46
          speaker: narrator
          text: >-
            我点点头，从侧面接近最近的一群海豹。一开始都很顺利。我举棍去打外围一头母海豹的脑袋，却没够着。它喷着鼻息想要爬开，我赶紧追上，又挥了一棍，这次只打中了肩膀。
        - id: ch01-b47
          speaker: maud_brewster
          text: 当心！
          emotion: fearful
        - id: ch01-b48
          speaker: narrator
          text: >-
            我只顾着眼前，什么也没留意。听到她尖叫，抬头才看见这群海豹的主人已经冲了过来。我又一次逃回小艇，它紧紧追在后面。可这回，莫德没有再劝我回去。
        - id: ch01-b49
          speaker: maud_brewster
          text: >-
            我想，你最好别再招惹这些有妻妾的公海豹，还是去找那些落单、看起来不伤人的。我好像在乔丹博士的书里读过。它们是年轻的公海豹，还没有自己的妻妾，博士称它们为“霍鲁希基”，或者差不多的名字。只要我们找到它们上岸的地方——
        - id: ch01-b50
          speaker: humphrey
          text: 看来你的好胜心也被激起来了。
        - id: ch01-b51
          speaker: narrator
          text: 莫德的脸一下红了。
        - id: ch01-b52
          speaker: maud_brewster
          text: >-
            我承认，我和你一样不喜欢认输。可我也确实不愿意杀这些漂亮又无害的动物。
        - id: ch01-b53
          speaker: humphrey
          text: >-
            漂亮？刚才那几头畜生满嘴白沫，追着我跑。我可一点也没看出它们漂亮。
        - id: ch01-b54
          speaker: maud_brewster
          text: >-
            那是你看它们的角度不对。你离得那么近，当然看不见全貌。要是你不用凑到跟前——
        - id: ch01-b55
          speaker: humphrey
          text: >-
            对了，我需要一根更长的棍子。那支断掉的船桨正好能用！
        - id: ch01-b56
          speaker: maud_brewster
          text: >-
            我才想起来，拉森船长讲过他们怎样袭击繁殖场。他们会把海豹分成一小群，往内陆赶一段路，再把它们杀掉。
        - id: ch01-b57
          speaker: humphrey
          text: 要我赶这样一群妻妾，我可不干。
        - id: ch01-b58
          speaker: maud_brewster
          text: >-
            还有霍鲁希基呀。它们会单独成群上岸。乔丹博士说，各群妻妾之间留着通道。只要年轻公海豹沿着通道走，那些主人就不会碰它们。
        - id: ch01-b59
          speaker: humphrey
          text: 水里正好有一头。我们看着它，它要是上岸，就跟在后面。
        - id: ch01-b60
          speaker: narrator
          text: >-
            那头年轻公海豹径直游到岸边，爬进两群妻妾之间的一小块空地。两边的主人都发出警告，却没有扑上去。它慢慢向岛内走，在一群群海豹之间绕来绕去，脚下显然就是那条通道。
        - id: ch01-b61
          speaker: humphrey
          text: 好，我去了。
        - id: ch01-b62
          speaker: narrator
          text: >-
            我走下船，一想到要穿过这片庞大的兽群，心就提到了嗓子眼。
        - id: ch01-b63
          speaker: maud_brewster
          text: 最好先把小艇系牢。
        - id: ch01-b64
          speaker: narrator
          text: 她已经站到我的身旁，我惊讶地望着她。
        - id: ch01-b65
          speaker: maud_brewster
          text: >-
            没错，我跟你一起去。你把船系好，再给我一根棍子。
        - id: ch01-b66
          speaker: humphrey
          text: 算了，我们回去吧。冻原草应该也能用。
        - id: ch01-b67
          speaker: maud_brewster
          text: 你明明知道不行。要我走在前面吗？
        - id: ch01-b68
          speaker: narrator
          text: >-
            我耸耸肩，心里却满是对她的钦佩和骄傲。我把断桨交给她，自己又拿了一支。最初几十码，我们走得提心吊胆。一头母海豹好奇地把鼻子伸向莫德的脚，吓得她尖叫了一声。我也有好几次遇到同样的情形，不由得加快了脚步。可两边除了警告似的咳声，并没有真正攻击我们。这处繁殖场从没被猎人侵扰过，所以海豹既温和，也不怕人。
        - id: ch01-b69
          speaker: narrator
          text: >-
            兽群中心的吼声震得人头晕。我停下来，朝莫德安慰地笑了笑。我已经先镇定下来，她却仍怕得厉害。她靠到我身旁，放声喊了出来。
        - id: ch01-b70
          speaker: maud_brewster
          text: 我怕得要命！
          emotion: fearful
        - id: ch01-b71
          speaker: narrator
          text: >-
            我倒不怕了。眼前的一切虽然还很陌生，海豹安静平和的举动却让我放下了心。莫德仍在发抖，连牙关都在打颤。
        - id: ch01-b72
          speaker: maud_brewster
          text: >-
            我害怕，可我又不害怕。是我这副不中用的身体在怕，不是我在怕。
          emotion: fearful
        - id: ch01-b73
          speaker: humphrey
          text: 没事了，没事了。
          emotion: calm
        - id: ch01-b74
          speaker: narrator
          text: >-
            我一边安慰她，一边本能地伸手搂住她，把她护在怀里。那一刻，我忽然真切地感觉到自己是个男人。天性深处原始的力量动了起来。我是强壮的男子，是弱者的保护人，是随时准备战斗的雄性。更重要的是，我正在保护自己心爱的女人。
        - id: ch01-b75
          speaker: narrator
          text: >-
            她轻轻靠着我，像百合一般纤细。她渐渐不再颤抖，我却像是突然有了无穷的力量。我觉得自己能够对付兽群里最凶猛的公海豹。就算真有一头朝我冲来，我也一定会冷静地站住，毫不退缩。我知道自己会杀死它。
        - id: ch01-b76
          speaker: maud_brewster
          text: 我已经没事了，我们接着走吧。
          emotion: calm
        - id: ch01-b77
          speaker: narrator
          text: >-
            她感激地抬头看着我。我的力量让她安定下来，也给了她信心。这件事让我满心欢喜。我这个被文明养得过了头的人，身体里仿佛重新长出了人类年轻时代的生命。我亲自回到了遥远祖先那些早已被遗忘的日子，白天在野外狩猎，夜晚睡在森林里。我们沿着狭窄的通道，穿行在一群群互相推挤的海豹妻妾之间。我心里甚至想，自己实在有许多事应当感谢海狼拉森。
        - id: ch01-b78
          speaker: narrator
          text: >-
            往岛内走了四分之一英里，我们终于看见霍鲁希基。那些皮毛油亮的年轻公海豹孤零零地过着单身生活，一面积攒力气，一面等待将来靠搏斗挤进有妻室的行列。
        - id: ch01-b79
          speaker: narrator
          text: >-
            接下来便顺利多了，我好像一下知道该做什么，也知道该怎么做。我挥着棍子，大声吆喝，做出吓唬它们的动作，碰到懒得走的还会用棍子戳一下，很快从同伴中分出了二十来头年轻公海豹。哪一头想掉头逃回海边，我就抢到前面拦住。莫德也积极加入进来，一边叫喊，一边挥舞断桨，帮了很大的忙。不过，遇到疲倦落后的，她总会悄悄放它过去。碰上哪一头摆出要打架的样子，想从她身边硬闯，她的眼睛便闪闪发亮，手里的棍子也敲得又快又准。
        - id: ch01-b80
          speaker: maud_brewster
          text: 真刺激！可我实在没力气了，得坐下来歇一歇。
        - id: ch01-b81
          speaker: narrator
          text: >-
            我又把小兽群赶出一百码。莫德放走了不少，剩下的正好十二头。等她赶来，我已经把它们全杀了，正动手剥皮。一个钟头后，我们各自背着海豹皮，得意地沿原路穿过一群群妻妾。后来又往返两次，每一次都背着沉重的皮子，直到我认为已经足够铺满屋顶。回程时，我升起船帆，先借着一面风驶出海湾，再掉转船头，借另一面风回到我们自己的小小内湾。
        - id: ch01-b82
          speaker: maud_brewster
          text: 这样回来，真像是回家了。
        - id: ch01-b83
          speaker: narrator
          text: >-
            我让小艇冲上岸。听见她的话，我心头也跟着颤了一下。一切都那么亲密，那么自然。
        - id: ch01-b84
          speaker: humphrey
          text: >-
            我好像一直都过着这种生活。书本和那些读书人的世界，已经模糊得像一场梦。我倒像是一辈子都在狩猎、劫掠、战斗。你也一样，你本来就是这种生活的一部分。你是——你很能吃苦。
        - id: ch01-b85
          speaker: narrator
          text: >-
            我真正想说的是“我的女人，我的伴侣”，话到嘴边，却匆匆改了口。莫德立刻听出了破绽。她知道那句话飞到半途，忽然折断了，便飞快地看了我一眼。
        - id: ch01-b86
          speaker: maud_brewster
          text: 不是这句。你刚才本来要说什么？
        - id: ch01-b87
          speaker: humphrey
          text: >-
            我是说，从美国来的梅内尔夫人正在过野蛮人的生活，而且过得相当不错。
        - id: ch01-b88
          speaker: maud_brewster
          text: 哦。
        - id: ch01-b89
          speaker: narrator
          text: >-
            她只说了这一个字，可我敢发誓，里面藏着一点失望。当天余下的时间，乃至后来许多天，“我的女人，我的伴侣”始终在我脑中回响。
        - id: ch01-b90
          speaker: narrator
          text: >-
            那天夜里，它们响得尤其清楚。我看着莫德掀开盖住余烬的苔藓，把火重新吹旺，再动手做晚饭。那些古老的话和人类最深的根须紧紧缠在一起，牢牢抓住我，叫我战栗。大概真是潜伏已久的野性正在身体里苏醒。它们带来的震动久久不散。直到渐渐沉入睡梦，我仍一次又一次地低声念着：“我的女人，我的伴侣。”
