audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    mugridge:
      display_name: 托马斯·马格里奇
      tts:
        delivery: 油滑谄媚，粗俗话里带着讨好
        timbre: 尖细黏腻的成年男声
        pace: 轻快而连珠炮般
        pitch: 中高音
    johnson:
      display_name: 约翰逊
      tts:
        delivery: 腼腆坦率，措辞谨慎而有条理
        timbre: 厚实温和的成年男声
        pace: 缓慢审慎
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我仿佛随着一股雄浑的节拍，在无边的星空里荡来荡去。闪亮的光点从身旁迸射而过。我知道，那是群星，是燃烧的彗星。我穿梭在一个个太阳之间，它们一路陪着我。每荡到尽头，正要反向飞驰，一面巨锣就轰然敲响。不知过了多少岁月，我沉浸在平静时光的微澜里，享受这场浩瀚的飞行，也默默想着它的意义。
        - id: ch01-b02
          speaker: narrator
          text: >-
            可梦境忽然变了模样。我对自己说，这一定是梦。摆荡越来越短，我刚荡过去，又被猛地拽回来，急得连气都喘不上。锣声一次比一次密，一次比一次凶。我开始害怕它再次响起，却说不出到底怕什么。接着，我像被拖过太阳晒白的沙地。滚烫的粗沙磨着我，转眼又成了烈火灼烧皮肤的剧痛。巨锣铿锵长鸣，群星无穷无尽地飞过，仿佛整个星空都正坠进虚无。我痛苦地吸进一口气，睁开眼睛。
        - id: ch01-b03
          speaker: narrator
          text: >-
            两个男人跪在身旁，正在救治我。原来，那股雄浑的节拍，是船身随海浪升起，再向前俯冲。那面可怕的巨锣，是墙上的一只煎锅，船每颠一下，它就哐啷乱响。那片灼热的粗沙，则是一双硬手，正用力摩擦我赤裸的胸膛。我疼得扭动，勉强抬起头。胸口已经又红又烂，破损发炎的皮肤上渗出了细小的血珠。
        - id: ch01-b04
          speaker: mugridge
          text: >-
            够啦，永森！你他妈还没瞧见？这位先生的皮都快叫你搓光啦！
        - id: ch01-b05
          speaker: narrator
          text: >-
            被叫作永森的粗壮男人停了手，笨拙地站起来。他一看就是斯堪的纳维亚人。开口制止他的男人来自伦敦东区，脸庞清秀，漂亮得有些柔弱，甚至带着女人气。他头戴一顶湿塌塌的细布帽，瘦腰上围着肮脏的麻袋片。不用问，他就是厨子，而我醒来的地方，正是船上这间油污不堪的厨房。
        - id: ch01-b06
          speaker: mugridge
          text: >-
            先生，您这会儿觉着怎么样啦？
        - id: ch01-b07
          speaker: narrator
          text: >-
            他满脸谄笑，那副卑躬屈膝的神情，仿佛是祖祖辈辈盼赏钱盼出来的。我没回答，只虚弱地撑起身子，在永森搀扶下站稳。煎锅还在哐啷作响，刺得我神经生疼，脑子也怎么都清醒不了。我抓住厨房的木框。上面那层油腻，让我牙根发酸。我探身越过滚烫的炉灶，摘下煎锅，把它牢牢塞进煤箱。
        - id: ch01-b08
          speaker: narrator
          text: >-
            厨子见我这副神经质的样子，咧嘴笑了，又把一只热气腾腾的杯子塞到我手里。
        - id: ch01-b09
          speaker: mugridge
          text: >-
            来，喝了这个，准能好受点。
        - id: ch01-b10
          speaker: narrator
          text: >-
            杯里是船上的咖啡，一摊令人作呕的浑汤。可它毕竟是热的，喝下去真让我恢复了些精神。我一口口咽着那滚烫的东西，低头看看胸口的破皮和血珠，转向那个斯堪的纳维亚人。
        - id: ch01-b11
          speaker: humphrey
          text: >-
            谢谢你，永森先生。不过你不觉得，这救人的法子也太猛烈了吗？
        - id: ch01-b12
          speaker: narrator
          text: >-
            他听懂的与其说是我的话，不如说是我方才的举动。他抬起一只手让我看，掌上全是厚得惊人的老茧。我伸手摸过那些硬邦邦的凸块，那可怕的粗糙触感又叫我一阵牙酸。
        - id: ch01-b13
          speaker: johnson
          text: >-
            我叫约翰逊，不叫永森。
        - id: ch01-b14
          speaker: narrator
          text: >-
            他的英语很好，只是说得慢，口音淡得几乎听不出来。那双浅蓝色眼睛里带着温和的抗议，也透着腼腆的坦率和男子气概。我立刻对他有了好感。
        - id: ch01-b15
          speaker: humphrey
          text: >-
            那么，谢谢你，约翰逊先生。
        - id: ch01-b16
          speaker: narrator
          text: >-
            我改过称呼，向他伸出手。他犹豫片刻，局促地把重心从一条腿换到另一条腿，才笨手笨脚地握住我的手，用力摇了摇。
        - id: ch01-b17
          speaker: humphrey
          text: >-
            你有没有干衣服，能借我穿一穿？
        - id: ch01-b18
          speaker: mugridge
          text: >-
            有，先生。只要您不嫌弃我的衣裳，我这就下去翻翻家当。
        - id: ch01-b19
          speaker: narrator
          text: >-
            他一头出了厨房门。不，与其说是钻出去，不如说是滑出去的。那步子又快又顺，不像猫，倒更像一滴油。后来我才知道，这种油滑，或者说油腻，正是他身上最鲜明的东西。
        - id: ch01-b20
          speaker: humphrey
          text: >-
            约翰逊，我这是在哪儿？这是什么船？要开到哪里去？
        - id: ch01-b21
          speaker: narrator
          text: >-
            我已经猜出他是水手，事实也没有猜错。他慢吞吞地组织着最妥帖的英语，严格照我的提问顺序回答。
        - id: ch01-b22
          speaker: johnson
          text: >-
            我们在法拉隆群岛外海，航向差不多是西南偏南。这艘双桅帆船叫“幽灵号”，正要去日本捕海豹。
        - id: ch01-b23
          speaker: humphrey
          text: >-
            船长是谁？我一穿好衣服，就得去见他。
        - id: ch01-b24
          speaker: narrator
          text: >-
            约翰逊露出困惑又为难的样子。他犹豫着寻找词句，好把话说完整。
        - id: ch01-b25
          speaker: johnson
          text: >-
            船长叫海狼·拉森，大家都这样叫他。他还有没有别的名字，我从没听说。不过你跟他说话最好轻一点。他今天早晨正在发火。大副——
        - id: ch01-b26
          speaker: narrator
          text: >-
            他没能说完。厨子已经滑了进来。
        - id: ch01-b27
          speaker: mugridge
          text: >-
            永森，你最好赶紧滚出去。老头子正等你上甲板呢。今儿可不是招惹他的好日子。
        - id: ch01-b28
          speaker: narrator
          text: >-
            约翰逊听话地往门口走，又越过厨子的肩膀，意味深长地朝我眨眼。那神情郑重得惊人，分明是在加重刚才没说完的警告，要我对船长千万轻声说话。厨子臂弯里搭着一堆松垮皱巴的衣服，难看极了，还散发着酸臭味。
        - id: ch01-b29
          speaker: mugridge
          text: >-
            这些衣裳是湿着收起来的，先生。不过在我把您的衣服放到火边烘干以前，您只能先拿它们凑合啦。
        - id: ch01-b30
          speaker: narrator
          text: >-
            我抓着木框，随船身晃得东倒西歪，在厨子的帮助下，好容易套上一件粗羊毛汗衫。衣料一贴身，浑身的皮肉就像有虫子在爬。厨子瞧见我抽搐着龇牙咧嘴，又露出那副假笑。
        - id: ch01-b31
          speaker: mugridge
          text: >-
            我只盼您这辈子永远别落到非穿惯这种衣服不可的地步。您的皮可真他妈嫩，比我见过的哪个娘儿们都嫩。我第一眼看见您，就他妈敢说您准是位绅士。
        - id: ch01-b32
          speaker: narrator
          text: >-
            我一开始就不喜欢他。他帮我穿衣时，这份厌恶更深了。他的碰触里有种叫人作呕的东西，我躲着他的手，浑身都在抗拒。炉火上的几口锅还咕嘟翻滚，冒出各种气味。我只想赶紧出去，呼吸一口新鲜空气。何况我还得见船长，问清楚怎样才能把我送上岸。
        - id: ch01-b33
          speaker: narrator
          text: >-
            他一面连声赔不是，一面替我套上廉价棉衬衫。领口磨破了，胸前还有一块块污渍，我猜是陈年的血迹。脚上是一双工人的粗皮鞋，裤子则是洗得发白的浅蓝工装裤，一条裤腿足足比另一条短了十英寸。那截残缺的裤腿，就像魔鬼曾伸手抓这个伦敦佬的灵魂，却把实体错当成影子，抓了个空。最后，我头戴男孩的小帽，身穿肮脏的条纹短褂。衣摆只到腰窝，袖口也刚过手肘。
        - id: ch01-b34
          speaker: humphrey
          text: >-
            这一番好意，我该感谢哪一位？
        - id: ch01-b35
          speaker: narrator
          text: >-
            厨子装出谦卑又自得的模样，挺起身子，满脸都是自谦的笑。我乘大西洋邮轮时，每到航程结束，总见侍者摆出这副等赏钱的姿态。凭这番经验，我敢肯定，他也在等我的赏钱。后来我更了解这个人，才知道这姿态根本是无意识的。一定是祖上传下来的奴性在作怪。
        - id: ch01-b36
          speaker: mugridge
          text: >-
            马格里奇，先生。托马斯·马格里奇，听候您的吩咐。
        - id: ch01-b37
          speaker: humphrey
          text: >-
            好吧，托马斯。我不会忘记你的。等我的衣服干了以后。
        - id: ch01-b38
          speaker: narrator
          text: >-
            他脸上泛起柔光，眼睛也亮了。仿佛在他生命深处，祖先们忽然苏醒，依稀想起前世收到的赏钱，纷纷骚动起来。
        - id: ch01-b39
          speaker: mugridge
          text: >-
            谢谢您，先生。真是太谢谢您了。
        - id: ch01-b40
          speaker: narrator
          text: >-
            门向后滑开，厨子也顺势滑到一旁，我迈步上了甲板。在水里泡了那么久，我仍旧十分虚弱，体力远没有恢复，全身发软。一阵风扑来，我踉跄着穿过起伏的甲板，扑到舱房一角，紧紧抓住那里。双桅帆船大幅倾斜，随着太平洋悠长的涌浪上下起伏，船头不断俯冲。照约翰逊说的航向推算，风几乎是从正南方吹来的。
        - id: ch01-b41
          speaker: narrator
          text: >-
            浓雾散了，阳光清亮地闪耀在海面。我转向东方，知道加利福尼亚就在那边，却只能看见低伏的雾堤。毫无疑问，正是那片雾酿成“马丁内斯号”的灾难，也把我送到了这里。北面不远处，几块光秃秃的礁石刺出海面，其中一块上立着灯塔。西南方几乎正对我们的航路，还有一艘船。它的帆影隐约耸成金字塔形。
        - id: ch01-b42
          speaker: narrator
          text: >-
            看完地平线，我转而打量近处。我首先想到，一个刚从撞船事故中逃生、与死神擦肩而过的人，怎么也该得到更多关照。可除了舵轮旁一个水手越过舱顶好奇地看我，根本没人注意我的存在。所有人的心思，都在船舯发生的事上。
        - id: ch01-b43
          speaker: narrator
          text: >-
            一个大块头男人仰面躺在舱口盖上。他还穿着衣服，只有衬衫从胸前撕开。可他的胸膛仍旧看不见，因为上面盖满浓密的黑毛，活像一层狗皮。夹着灰白的黑胡子遮住了脸和脖子。要不是湿透以后软塌塌地垂着，还不停滴水，那把胡子原本该是又硬又蓬的。他双眼紧闭，显然失去了知觉，嘴巴却张得老大。胸口一起一伏，像是快要窒息，呼哧呼哧地拼命喘气。
        - id: ch01-b44
          speaker: narrator
          text: >-
            一个水手每隔一会儿，就照例把系着绳子的帆布桶扔进海里。他两手交替，一把接一把地拉上桶，再把整桶海水浇在那男人身上。整个过程有条不紊，仿佛他只是在做一件习以为常的日常差事。舱口之间，还有一个男人正来回踱步，恶狠狠地咬着雪茄烟头。就是他无意中朝海面看了一眼，才把我救了起来。
        - id: ch01-b45
          speaker: narrator
          text: >-
            他大约有五英尺十英寸，或者再高半英寸。可我对他的第一感觉不是高矮，而是力量。他肩宽胸厚，体格魁梧，那力量却不显得沉重，反倒筋肉虬结，本该属于精瘦结实的人。只是装进这副庞大身躯里，就更像放大了的猩猩之力。并不是说他的模样像猩猩。我想说的是那股力量本身。它仿佛脱离了外形，独自活着。
        - id: ch01-b46
          speaker: narrator
          text: >-
            那股力量让人想到最原始的东西，想到野兽，也想到我们想象中栖居树上的先祖。它野蛮，凶猛，本身便有生命。它是生命的精髓，因为其中藏着运动的能力，也是塑成万千生命的原初质料。蛇头已经斩落，蛇也死了，身体里却仍有东西在扭动。又或者，一团不成形的龟肉里还留着什么，手指一戳，肉便会缩紧颤抖。他身上的力量就是这样。
        - id: ch01-b47
          speaker: narrator
          text: >-
            他双腿扎得很稳，每一步都平正而笃定地落在甲板上。从肩头起伏，到嘴唇咬紧雪茄，每一块肌肉的动作都干脆果决，像是发自一股过于强大、足以压倒一切的力量。可这些动作，还只是一个预告。他体内潜伏着更大的力量，平日沉睡着，偶尔才翻动一下，却随时会猛然苏醒，变得可怕而无法抗拒，就像雄狮暴怒，又像风暴发威。
        - id: ch01-b48
          speaker: narrator
          text: >-
            厨子从门里探出头，咧嘴鼓励我，又拿拇指指向舱口边来回踱步的男人。我这才明白，他就是船长，也是厨子嘴里的“老头子”。我要找的人正是他，还得劳烦他想办法送我上岸。我刚迈出半步，准备尽快熬过这场注定风暴四起的谈话，仰躺的可怜人忽然陷入更猛烈的窒息。他剧烈抽搐，来回扭动。背部肌肉绷紧，胸膛高高鼓起。他本能地拼命想多吸进一口气，湿漉漉的黑胡子连同下巴越扬越高。我知道，胡须底下的皮肤已经在变紫。
        - id: ch01-b49
          speaker: narrator
          text: >-
            船长，也就是海狼·拉森，停下脚步，低头看着将死的人。他最后的挣扎越来越猛烈。连水手都停住泼水的动作，好奇地盯着他。帆布桶半倾在手里，海水滴滴答答淌到甲板上。垂死的人两只脚后跟在舱口盖上急促敲打，接着伸直双腿，全身用力绷紧，脑袋左右滚动。忽然，肌肉松弛下来，头也不动了。一声如释重负的叹息从唇间飘出。他下巴垂落，上唇翘起，露出两排被烟草熏黄的牙齿。那张脸就这样冻成了魔鬼般的狞笑，冲着那个被他抛下、又被他骗过的世界龇牙咧嘴。
        - id: ch01-b50
          speaker: narrator
          text: >-
            接着发生的事，实在出人意料。船长像一道霹雳，忽然对着死人爆发了。咒骂从他嘴里滚滚而出，连成一片。那不是软绵绵的诅咒，也不只是几句粗鄙的脏话。他说出的每个词都在亵渎神明，而且滔滔不绝，像电火花一样噼啪炸响。我从没听过这样的语言，也没想过世上竟能有这种骂法。
        - id: ch01-b51
          speaker: narrator
          text: >-
            我自己爱好文学表达，也偏爱强劲的比喻和辞句。因此我敢说，没有哪个听众能像我一样，领会他那些比喻独有的鲜活、力量，还有彻头彻尾的亵渎。依我勉强听出的意思，死人原来是大副。他离开旧金山以前纵酒胡闹了一场，又偏偏不识趣，航程才刚开始就死了，害得海狼·拉森手下少了人。
        - id: ch01-b52
          speaker: narrator
          text: >-
            至少对我的朋友来说，大概不用解释我有多么震惊。咒骂和一切污言秽语，向来都使我厌恶。我只觉得整个人都萎顿下去，心直往下沉。坦白说，我甚至一阵眩晕。在我心中，死亡始终披着庄严与尊贵。我所知道的死亡，降临时总是安宁的，送别死者的仪式也总是神圣的。直到此刻，我才第一次遇见死亡更加污秽、更加可怕的一面。
        - id: ch01-b53
          speaker: narrator
          text: >-
            海狼·拉森嘴里那场可怕的痛骂，力量之强，叫我不能不叹服，却也使我震骇得无以言表。那股灼热的洪流，足以把死人的脸烤得枯萎。就算那把湿淋淋的黑胡子忽然焦卷，冒起烟火，我也不会奇怪。死人却毫不在意。他依旧讥诮地笑着，笑容里全是冷嘲、戏弄和蔑视。此刻真正掌控局面的，反倒是他。
