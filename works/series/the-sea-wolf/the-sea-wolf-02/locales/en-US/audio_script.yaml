audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    johnson:
      display_name: Johnson
      tts:
        delivery: thoughtful, timid, and sincere
        timbre: sturdy and clear with a slight Scandinavian accent
        pace: slow and careful
        pitch: low
    thomas_mugridge:
      display_name: Thomas Mugridge
      tts:
        delivery: ingratiating, sly, and brisk
        timbre: light and oily with a Cockney accent
        pace: quick and smooth
        pitch: medium-high
  chapters:
    - id: ch01
      title: CHAPTER II
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I seemed to be swinging through the vastness of space in a mighty rhythm. Points of light sparkled, sputtered, and shot past me. I knew they were stars and blazing comets, filling my flight among the suns. Each time I reached the far end of my swing and prepared to rush back, a great gong struck and thundered. Time seemed beyond measuring. Wrapped in the gentle movement of peaceful centuries, I enjoyed that tremendous flight and wondered at it.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Then the dream began to change, for I kept telling myself it had to be a dream. The swings grew shorter and shorter. I was jerked back and forth with such maddening speed that I could hardly catch my breath. The gong sounded faster and more violently, and I began to wait for each blow with a fear I could not name. Next I felt myself dragged across rough white sand burning in the sun. That feeling gave way to unbearable pain, as though my skin were scorching in a fire. The gong clanged on while an endless stream of stars flashed past me, as if the whole sky were falling into emptiness.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I gasped, dragged in a painful breath, and opened my eyes. Two men knelt beside me, working over my body. The strange pieces of the dream suddenly became real. My great swinging flight was only the rise and forward plunge of a ship at sea. The terrible gong was a frying pan hanging on the galley wall, rattling and clattering whenever the ship leaped. And the rough, burning sand was one man's hard hands rubbing my bare chest. I twisted beneath the pain and managed to lift my head halfway. My chest was red and raw, with tiny beads of blood pushing through the torn and swollen skin.
        - id: ch01-b04
          speaker: thomas_mugridge
          text: >-
            That's enough, Yonson. Can't you see you've rubbed all the gentleman's skin off?
        - id: ch01-b05
          speaker: narrator
          text: >-
            The man he called Yonson stopped rubbing and rose awkwardly to his feet. He had the heavy build and appearance of a Scandinavian. The other man was clearly a London Cockney. His face had clean lines and a weak prettiness that was almost feminine. A bedraggled cloth cap covered his head, and a dirty piece of sacking hung around his narrow hips. Those clothes announced that he was the cook of the very dirty ship's galley where I had awakened.
        - id: ch01-b06
          speaker: thomas_mugridge
          text: >-
            And how are you feeling now, sir?
        - id: ch01-b07
          speaker: narrator
          text: >-
            He asked with a humble little smirk, the sort that seemed to come from generations of men who had lived on tips. I answered by struggling weakly into a sitting position, and Yonson helped me to my feet. The frying pan's rattle and bang scraped horribly at my nerves, and I could not gather my thoughts. I held on to the galley's woodwork, though the layer of grease on it set my teeth on edge. Then I reached across the hot stove, pulled down the offending pan, and wedged it firmly into the coal box.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The cook grinned at my nervousness and pushed a steaming mug into my hand.
        - id: ch01-b09
          speaker: thomas_mugridge
          text: >-
            Here you are. This will make you feel better.
        - id: ch01-b10
          speaker: narrator
          text: >-
            It was ship's coffee, a sickening mixture, but its heat brought some life back into me. Between swallows, I looked at my bleeding chest and turned to the Scandinavian.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Thank you, Mr. Yonson. But wasn't that treatment a little severe?
        - id: ch01-b12
          speaker: narrator
          text: >-
            He understood the complaint in my action better than the polite complaint in my words. In answer, he held up his palm for me to examine. It was covered in remarkable calluses. I passed my hand over the hard, hornlike ridges, and the horrible scraping feeling set my teeth on edge all over again.
        - id: ch01-b13
          speaker: johnson
          text: >-
            My name is Johnson, not Yonson.
        - id: ch01-b14
          speaker: narrator
          text: >-
            His English was slow but very good, with only a trace of an accent. There was a mild protest in his pale blue eyes. At the same time, I saw a shy openness and honest manliness in him that won me over at once.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Thank you, Mr. Johnson.
        - id: ch01-b16
          speaker: narrator
          text: >-
            I offered him my hand. He hesitated, shifted bashfully from foot to foot, and then caught it in a hearty, clumsy handshake.
        - id: ch01-b17
          speaker: narrator
          text: >-
            I asked the cook if he had any dry clothes I could wear.
        - id: ch01-b18
          speaker: thomas_mugridge
          text: >-
            Yes, sir. I'll go below and look through my things, if you don't mind wearing them.
        - id: ch01-b19
          speaker: narrator
          text: >-
            He darted through the galley door, though it was really more of a glide. His movement was swift and smooth, but it did not remind me so much of a cat as of something oily. I later learned that this oiliness, this sense of greasiness, was probably the clearest mark of his whole nature.
        - id: ch01-b20
          speaker: narrator
          text: >-
            I turned to Johnson, whom I correctly took for a sailor, and asked where we were, what ship this was, and where she was going.
        - id: ch01-b21
          speaker: johnson
          text: >-
            We are off the Farallones, heading about southwest. This is the schooner Ghost, bound for Japan to hunt seals.
        - id: ch01-b22
          speaker: narrator
          text: >-
            He answered slowly and carefully, finding his best English and taking my questions in their exact order. I asked who the captain was and said I must see him as soon as I was dressed.
        - id: ch01-b23
          speaker: johnson
          text: >-
            The captain is Wolf Larsen, or that is what the men call him. I never heard another name. But you should speak softly to him. He is angry this morning. The mate...
        - id: ch01-b24
          speaker: narrator
          text: >-
            Johnson stopped when the cook slid back into the galley.
        - id: ch01-b25
          speaker: thomas_mugridge
          text: >-
            You'd better clear out of here, Yonson. The old man will want you on deck, and today's no day to cross him.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Johnson turned obediently toward the door. As he went, he looked over the cook's shoulder and gave me an amazingly solemn, meaningful wink. It underlined both his unfinished warning and the need to speak softly to the captain.
        - id: ch01-b27
          speaker: narrator
          text: >-
            A loose heap of crumpled, sour-smelling clothes hung over the cook's arm.
        - id: ch01-b28
          speaker: thomas_mugridge
          text: >-
            They were put away wet, sir. They'll have to do until I dry your clothes by the fire.
        - id: ch01-b29
          speaker: narrator
          text: >-
            With the cook's help, I clung to the woodwork and staggered with the roll of the ship while pulling on a rough woolen undershirt. The instant it touched me, the harsh cloth made my tender flesh creep and crawl. The cook noticed every unwilling twitch and grimace, and his smirk returned.
        - id: ch01-b30
          speaker: thomas_mugridge
          text: >-
            I hope you never have to get used to clothes like that. You've got such soft skin, more like a lady's than any I've seen. I knew you were a gentleman the moment I laid eyes on you.
        - id: ch01-b31
          speaker: narrator
          text: >-
            I had disliked him from the first, and the feeling grew stronger as he helped dress me. There was something about his touch that repelled me. I shrank whenever his hand came near, as if my flesh itself rejected him. That feeling mixed with the smells from the pots boiling and bubbling on the galley fire. I was in a hurry to escape into the fresh air. Besides, I needed to see the captain and learn what arrangements could be made to put me ashore.
        - id: ch01-b32
          speaker: narrator
          text: >-
            The cook kept up a stream of apologetic remarks while he added a cheap cotton shirt. Its collar was frayed, and the front was stained with what I took to be old blood. Heavy work shoes went on my feet. For trousers, I received a pair of pale blue overalls washed almost colorless. One leg was nearly ten inches shorter than the other. It looked as if the devil had once grabbed for the cook's soul and caught the cloth instead of its shadow.
        - id: ch01-b33
          speaker: narrator
          text: >-
            At last I stood fully dressed, though the result was a strange sight. A little boy's cap sat on my head. My coat was a dirty striped cotton jacket that ended at the small of my back, and its sleeves reached only a little below my elbows. Once I was completely dressed, I asked whom I should thank for this kindness.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The cook drew himself up with a smug show of humility, wearing a smirk that tried to apologize for itself. From my experience with stewards on Atlantic liners, I could have sworn he was waiting for his tip at the end of a voyage. I later came to understand that the posture was unconscious. It seemed to be an inherited obedience, passed down through generations of servants.
        - id: ch01-b35
          speaker: thomas_mugridge
          text: >-
            Mugridge, sir. Thomas Mugridge, at your service.
        - id: ch01-b36
          speaker: narrator
          text: >-
            All right, Thomas. I won't forget you when my clothes are dry.
        - id: ch01-b37
          speaker: narrator
          text: >-
            A soft light spread across his face, and his eyes began to shine. It was as though his ancestors had stirred somewhere deep inside him, carrying dim memories of tips received in earlier lives.
        - id: ch01-b38
          speaker: thomas_mugridge
          text: >-
            Thank you, sir. Thank you very much.
        - id: ch01-b39
          speaker: narrator
          text: >-
            He slid aside in exactly the same smooth way that the door slid back, and I stepped onto the deck. I was still weak from being so long in the water. A gust caught me at once. I staggered across the moving deck until I reached a corner of the cabin and clung there for support. The schooner leaned far from upright as she bowed and plunged through the long Pacific swell.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Johnson had said we were sailing southwest, so I judged the wind to be blowing nearly from the south. The fog had disappeared, and crisp sunlight flashed across the surface of the water. I turned east, toward the place where I knew California must be, but I saw nothing except low banks of fog. It was surely the same fog that had caused the Martinez disaster and put me in this strange situation. Not far to the north, a cluster of bare rocks pushed above the sea, with a lighthouse standing on one of them. Ahead to the southwest, almost in our course, the sails of another vessel rose in the shape of a distant pyramid.
        - id: ch01-b41
          speaker: narrator
          text: >-
            After finishing my search of the horizon, I examined the ship around me. My first thought was that a man who had survived a collision and brushed so close against death deserved more attention than I was receiving. Yet I attracted no notice at all. Only the sailor at the wheel stared at me curiously over the top of the cabin. Everyone else seemed absorbed by something happening amidships.
        - id: ch01-b42
          speaker: narrator
          text: >-
            A large man lay flat on his back upon a hatch. He was fully dressed, though his shirt had been torn open in front. Almost none of his chest could be seen beneath a mass of black hair like the furry coat of a dog. A black beard streaked with gray hid his face and neck. It might once have been stiff and bushy, but now it hung limp, bedraggled, and dripping with water. His eyes were closed, and he appeared unconscious. Still, his mouth gaped open and his chest heaved as he struggled noisily for breath. From time to time, a sailor calmly lowered a canvas bucket into the sea on a rope. He hauled it back hand over hand and poured the water over the suffering man as if carrying out an ordinary piece of work.
        - id: ch01-b43
          speaker: narrator
          text: >-
            The man whose chance glance had saved me from the sea paced back and forth beside the hatches, savagely chewing the end of a cigar. He stood about five feet ten, so his height was not the thing that struck me. Strength was the first thing I felt in him. His shoulders were broad and his chest deep, yet this was not merely the heavy strength of a large man. It seemed sinewy and knotted, the sort of power usually found in someone lean and wiry. In his large body, it felt almost primitive, fierce, and alive on its own. It made me think of the force that shapes wild creatures, of a snake's body still twisting after its head is gone, or a shapeless piece of turtle meat shrinking from the touch of a finger.
        - id: ch01-b44
          speaker: narrator
          text: >-
            That was the impression I gathered as he paced. His legs looked firmly planted beneath him, and his feet landed squarely and surely with every step. Each movement of a muscle, from the lift of his shoulders to the tightening of his lips around the cigar, was firm and decisive. Everything he did came from a supply of strength that seemed excessive and overwhelming. Still, all that visible power felt like only an announcement of something greater sleeping inside him. It barely stirred from time to time, but it might wake at any moment, terrible and commanding, like a lion's rage or a storm breaking loose.
        - id: ch01-b45
          speaker: narrator
          text: >-
            The cook poked his head through the galley door, gave me an encouraging grin, and jerked his thumb toward the pacing man. I understood. This was the captain, the Old Man, and the person I would have to trouble with arranging my return to shore. I had taken half a step toward him, eager to get through what I expected would be five stormy minutes, when the man on the hatch was seized by a far more violent fit of choking.
        - id: ch01-b46
          speaker: narrator
          text: >-
            The suffering man twisted and jerked in convulsions. His damp, bearded chin pointed higher into the air. The muscles of his back went rigid, and his chest swelled in a blind, unconscious effort to draw more air. Though his whiskers hid it, I knew his skin must be turning purple. Wolf Larsen stopped pacing and gazed down at the dying man. The struggle had become so fierce that even the sailor with the bucket paused to stare. He held it partly tipped while water dripped onto the deck.
        - id: ch01-b47
          speaker: narrator
          text: >-
            The dying man's heels beat a rapid tattoo upon the hatch. His legs straightened, and his whole body stiffened in one great, tense effort. His head rolled from side to side. Then, all at once, his muscles loosened and his head became still. A sigh of deep relief floated up from his lips. His jaw dropped, and his upper lip lifted to show two rows of tobacco-stained teeth. His features seemed to freeze into a wicked grin at the world he had left behind, a world he appeared to have escaped, mocked, and defeated.
        - id: ch01-b48
          speaker: narrator
          text: >-
            What happened next astonished me. Wolf Larsen exploded at the dead man like a thunderclap. A continuous stream of oaths poured from him. They were not feeble curses or ordinary dirty words. Every word was a blasphemy, and there seemed to be no end to them. They snapped and crackled like electric sparks. I had never heard anything like them in my life, and I had not imagined such language was possible. Because I had a literary turn of mind and cared about forceful images and phrases, I may have understood their peculiar power better than anyone else listening. Horrified as I was, I could not miss the absolute blasphemy and terrible vividness of his words.
        - id: ch01-b49
          speaker: narrator
          text: >-
            As nearly as I could understand through the cursing, the dead man had been the mate. He had gone on a drinking spree before the Ghost sailed, then chosen the beginning of the voyage to die and leave Wolf Larsen short-handed. That was the cause of the captain's fury.
        - id: ch01-b50
          speaker: narrator
          text: >-
            I was deeply shocked. My friends would have expected nothing else. Oaths and filthy language of every kind had always repelled me, and now I felt myself wilt. My heart sank, and my head grew dizzy. Death, as I knew it, had always carried dignity and solemn peace. It had come quietly, and the ceremonies around it had been sacred. Until that moment, I had never met death in this ugly, sordid, and terrible form.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Even while Wolf Larsen's fierce attack horrified me beyond words, I could feel its power. The scorching torrent seemed strong enough to shrivel the corpse's face. I would hardly have been surprised to see the wet black beard frizzle, curl, and burst into smoke and flame. But the dead man was beyond concern. He went on grinning with dark humor, mocking and defying the captain. Wolf Larsen could pour out all his fury, but the mate could no longer be moved. In the end, the dead man was master of the situation.
