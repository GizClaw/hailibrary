audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    leach:
      display_name: 利奇
      tts:
        delivery: 倔强激烈，愤怒时近乎不顾一切
        timbre: 紧绷而略带沙哑的年轻男声
        pace: 明快，激动时急促爆发
        pitch: 中高音
    smoke:
      display_name: 斯莫克
      tts:
        delivery: 漫不经心而冷酷，炫耀本领时透着自得
        timbre: 干冷清晰的成年男声
        pace: 从容平稳
        pitch: 中音
    unidentified_crewman:
      display_name: 一名船员
      tts:
        delivery: 直率警觉，发现异状时脱口而出
        timbre: 粗实的成年男声
        pace: 明快
        pitch: 中音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 温雅聪慧，疲惫中仍保持从容与礼貌
        timbre: 柔和清澈的成年女声
        pace: 舒缓，虚弱时略有停顿
        pitch: 中高音
    rescued_sailor:
      display_name: 获救水手
      tts:
        delivery: 粗直急躁，话里带着海上生活的火气
        timbre: 粗哑的成年男声
        pace: 偏快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十八章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            第二天，风暴慢慢耗尽了力气。拉森和我临时抱起解剖学和外科学的书，总算替马格里奇接好了三根断肋。等风浪平息，拉森便驾着“幽灵号”，在出事的那片海域来回搜索，还一路搜向更西边。船上同时忙着修补小艇、缝制新帆，再把帆一面面装好。我们接连追上一艘又一艘捕海豹的纵帆船，登船打听消息。它们大多在找失踪的小艇，自己船上也往往载着从海里救起的外船人马。风暴来时，船队主力正在我们的西面。小艇被吹得四散，为了活命，全都逃向最近的避难处。
        - id: ch01-b02
          speaker: narrator
          text: >-
            我们从“西斯科号”上领回两条艇，所有人都安然无恙。又从“圣迭戈号”找回斯莫克、尼尔森和利奇。拉森为此大喜，我却满心难过。五天过去，只剩亨德森、霍利奥克、威廉斯和凯利四个人没有回来。随后，我们又回到海豹群边缘，继续捕猎。
        - id: ch01-b03
          speaker: narrator
          text: >-
            海豹群一路向北，我们也跟着闯进人人害怕的海雾。每天，小艇才放到海面，几乎转眼就被浓雾吞掉。船上按时拉响雾号，每隔十五分钟还要放一响信号炮。小艇不断走失，又不断被别的船找到。海上的规矩是，谁捞到一条艇，艇上的人就暂时替谁按份额打猎，直到本船前来领人。可拉森正少一条艇。他扣住遇见的第一条失散小艇，逼那三个人为“幽灵号”干活。后来，我们与他们自己的船擦身而过，两船近得一块饼干都能扔过去。对方船长高声询问消息，拉森却端着步枪，顶住猎手和两个水手的胸口，把三个人全逼到舱下，不许他们露面。
        - id: ch01-b04
          speaker: narrator
          text: >-
            托马斯·马格里奇的命硬得出奇。没过多久，他又能拖着伤腿四处走动，同时干起厨子和舱房侍者的活。约翰逊和利奇照旧挨骂挨打。他们相信，捕猎季一结束，自己的命也会跟着结束。其余船员活得像狗，也被那个无情的主人当狗一样使唤。拉森和我倒还算相安无事，可有个念头始终赶不走。我觉得自己真正该做的，是杀掉他。他让我着迷，也让我怕得厉害。偏偏我又想象不出他倒地死去的样子。他身体里仿佛藏着永不衰老的力量，不允许人看见那幅画面。我能想象的拉森总是活着，总在统治、争斗和毁灭，而他自己永远留到最后。
        - id: ch01-b05
          speaker: narrator
          text: >-
            海面太险、别人不敢放艇时，拉森却有一种特别的消遣。他带上两名桨手和一名舵手，亲自乘艇出猎。他枪法很好，在猎手们认定绝不可能打猎的风浪里，也能带回不少毛皮。把性命放在掌心，再顶着压倒一切的凶险去拼，对他来说似乎和呼吸一样自然。
        - id: ch01-b06
          speaker: narrator
          text: >-
            我的航海本领也一天比一天强。有个难得的晴天，拉森头痛发作，我终于独自驾驶“幽灵号”，从早到晚守着舵轮。最后一条艇远在下风，我驾船越过海面追上它，再顶风停船，先后接回它和另外五条艇。整个过程没有拉森一声命令，也没用他半句指点。那一天，我很为自己满意。
        - id: ch01-b07
          speaker: narrator
          text: >-
            这一带又冷又多风，大风隔些日子便来一次。到了六月中旬，我们遇上一场台风。那场风暴改变了我的未来，我一生也忘不了。船大概几乎被卷进风圈中心。拉森驾船向南逃，先靠缩了两道的艏三角帆支撑，最后连这面帆也收掉，只剩下光秃秃的桅杆。我从未想过，海能掀起那么大的浪。从前见过的浪与它相比，只算水上的细纹。两座浪峰之间足有半英里，浪头升起来，肯定高过我们的桅顶。就连拉森也不敢顶风停船，只能任船向南漂得越来越远，离开海豹群。
        - id: ch01-b08
          speaker: narrator
          text: >-
            台风缓和以后，我们已经到了横渡太平洋的轮船航线上。猎手们惊讶地发现，这里居然还有一群海豹。他们说，这可能是另一支海豹群，也可能是大群落在后面的尾队，实在少见。可没人多想。转眼就是一声“放艇”，接着枪声砰砰响了一整天，凄惨的屠杀又开始了。
        - id: ch01-b09
          speaker: narrator
          text: >-
            就在这时候，利奇悄悄来找我。最后一条艇已经上船，我刚把毛皮清点完，他便摸到黑暗里我的身旁，压低了声音。
        - id: ch01-b10
          speaker: leach
          text: 范韦登先生，您能不能告诉我，咱们离海岸还有多远？横滨在哪个方向？
        - id: ch01-b11
          speaker: narrator
          text: >-
            我的心高兴得猛跳了一下。我立刻猜到他想干什么，便告诉他，横滨在西北偏西，离这里五百英里。
        - id: ch01-b12
          speaker: leach
          text: 谢谢您，先生。
        - id: ch01-b13
          speaker: narrator
          text: >-
            他只说了这一句，就重新隐进黑暗。第二天早晨，三号艇、约翰逊和利奇一起消失了。别的小艇上用来装水的木桶、装食物的箱子，也全被拿走。两人的铺盖和海员袋同样没了。拉森气得发狂，立刻扬帆驶向西北偏西。两名猎手轮流守在桅顶，不停用望远镜扫视海面。他自己像一头发怒的狮子，在甲板上来回走。拉森太清楚我同情逃走的人，所以没让我上去瞭望。
        - id: ch01-b14
          speaker: narrator
          text: >-
            风向有利，风力却一阵强一阵弱。要从无边的蓝色海面上找出那条小艇，跟大海捞针没有两样。拉森还是逼“幽灵号”跑出最快的速度，抢到逃亡者和陆地之间。随后，他沿着自己判断的航线来回巡弋，等他们闯进来。
        - id: ch01-b15
          speaker: narrator
          text: >-
            第三天早晨，八点钟刚过不久，桅顶的斯莫克突然喊下来，说看见了小艇。全船的人都挤到舷边。西风清劲，后面似乎还压着更大的风。朝下风望去，旭日搅动的银光里，一个黑点忽隐忽现。
        - id: ch01-b16
          speaker: narrator
          text: >-
            我们转成顺风，直向黑点追去。我的心沉得像一块铅，想到马上会发生什么，胃里一阵阵翻腾。拉森眼中亮着胜利的光。我盯着他，眼前那道身影竟开始摇晃。我几乎控制不住自己，想扑上去把他打倒。只要想到利奇和约翰逊被捉后会遭到怎样的毒打，我的神经便完全垮了，连理智也像是消失了。我恍恍惚惚地下到统舱，拿起一支上膛的猎枪。正要带枪回甲板，上面忽然传来一声惊叫。
        - id: ch01-b17
          speaker: unidentified_crewman
          text: 那条艇里有五个人！
          emotion: surprised
        - id: ch01-b18
          speaker: narrator
          text: >-
            我浑身发软，只能扶着升降口站住，听船员们一声声证实那个发现。双膝忽然撑不住了，我瘫坐下去，神志总算恢复。想到自己刚才差点做出的事，我惊得全身没有一点力气，又由衷地庆幸。我把枪放回去，悄悄溜上甲板，没有人注意到我曾离开。
        - id: ch01-b19
          speaker: narrator
          text: >-
            那条艇已经靠得很近。我们看出它比捕海豹的小艇更大，形状也不同。双方继续接近，艇上的人收起帆，卸下桅杆，又架好船桨，等“幽灵号”顶风停下，把他们接上船。
        - id: ch01-b20
          speaker: narrator
          text: >-
            斯莫克已经从桅顶下来，站在我旁边意味深长地偷笑。我不明白，便看了他一眼。
        - id: ch01-b21
          speaker: smoke
          text: 这下可有一场热闹了！
        - id: ch01-b22
          speaker: humphrey
          text: 到底怎么了？
        - id: ch01-b23
          speaker: smoke
          text: >-
            你还没瞧见？船尾座板那儿，坐在艇底的那个！我要是看错，就叫我以后再也打不中海豹。那是个女人！
        - id: ch01-b24
          speaker: narrator
          text: >-
            我仔细看去，一时还不敢确定。直到四周同时响起惊呼，才看清艇里确实有四个男人和一个女人。所有人都兴奋起来，只有拉森没有。他显然非常失望，因为那不是自己的三号艇，艇里也没有那两个供他报复的人。
        - id: ch01-b25
          speaker: narrator
          text: >-
            我们降下外艏三角帆，把艏三角帆脚索拉到上风一侧，再收紧主帆脚索，让船迎风停住。那边几支桨同时落水，划了几下，小艇便靠到船旁。我终于看清了那个女人。清晨很冷，她裹着长大衣，只露出一张脸。水手帽下，一大团浅褐色头发散了出来。她有一双又大又亮的褐色眼睛，嘴唇温柔而敏感，面孔纤秀，是好看的椭圆形。只是太阳与咸涩的海风把她整张脸晒得通红。
        - id: ch01-b26
          speaker: narrator
          text: >-
            她在我眼里像是从另一个世界来的。我心里生出一阵饥渴，直向她伸过去，好像饿极的人看见了面包。我实在太久没有见过女人，竟陷在惊奇里，几乎失去知觉。原来，这就是女人吗？我忘记自己还是大副，也忘了该帮忙接人上船。一个水手把她抱起来，交进拉森伸下去的双臂。她抬头望着周围一张张好奇的脸，觉得有趣似的温柔笑了。那样的微笑只有女人才有。我太久没有见过，已经忘记世上还存在这种笑容。
        - id: ch01-b27
          speaker: wolf_larsen
          text: 范韦登先生！
        - id: ch01-b28
          speaker: narrator
          text: 拉森的声音一下把我叫醒。
        - id: ch01-b29
          speaker: wolf_larsen
          text: >-
            你带这位女士下去，让她过得舒服些。把左舷那间空舱收拾好，叫厨子也去干活。再看看能不能照料她的脸，晒伤得很重。
        - id: ch01-b30
          speaker: narrator
          text: >-
            他猛地转过身，开始盘问新来的四个男人。那条艇被解开，任它自己漂走。一个水手忍不住骂了起来。
        - id: ch01-b31
          speaker: rescued_sailor
          text: 横滨都这么近了，还扔掉这条艇，真他妈可惜！
          emotion: angry
        - id: ch01-b32
          speaker: narrator
          text: >-
            我陪那个女人走向船尾，心里竟有些怕她，动作也变得笨拙。我好像第一次真正明白，女人原来是这么纤细脆弱的生灵。扶她走下升降梯时，我握住她的胳膊，那条胳膊又细又柔软，叫我吃了一惊。即使在女人当中，她也算得上纤瘦。可在久未见过女人的我眼里，她简直轻盈得不像肉身，我甚至怕那条胳膊会碎在手里。这就是长期与女人隔绝，尤其长期不见莫德·布鲁斯特以后，她留给我的第一印象。
        - id: ch01-b33
          speaker: narrator
          text: >-
            我匆忙从拉森舱里拖出他的扶手椅，请她坐下。她却觉得我们太费事了。
        - id: ch01-b34
          speaker: maud_brewster
          text: >-
            真的不用这样为我忙。今天早晨，那几个人还说随时都可能看见陆地。到了晚上，这条船总该进港了吧？您觉得呢？
        - id: ch01-b35
          speaker: narrator
          text: >-
            她对眼前的未来信得那么单纯，我反而愣住了。我花了好几个月，才弄懂自己落进了怎样的处境，也才看清那个像命运一样在海上来回行走的怪人。这样复杂的一切，我怎么可能立刻向她解释？我只能老实回答。
        - id: ch01-b36
          speaker: humphrey
          text: >-
            如果船长换成任何别人，我都会说，您明天就能在横滨上岸。可我们的船长很不寻常。我只求您先做好准备，不管发生什么，都别太意外。您明白吗？真的是什么都有可能。
        - id: ch01-b37
          speaker: maud_brewster
          text: >-
            我……我得承认，还是不太明白。难道是我一直想错了？海上遇难的人，不是都会得到周到照顾吗？这件事其实很小，您知道的，我们离陆地已经很近了。
        - id: ch01-b38
          speaker: narrator
          text: >-
            她迟疑着，眼里有不安，却没有害怕。我尽量放缓声音，想让她安心。
        - id: ch01-b39
          speaker: humphrey
          text: >-
            老实说，我也不知道会怎样。我只是想让您先有个准备，万一最坏的事真的来了，不至于措手不及。我们的船长是头野兽，是个魔鬼。谁也猜不出他下一刻会做出什么荒唐事。
        - id: ch01-b40
          speaker: narrator
          text: >-
            我越说越激动。她轻轻打断了我，声音十分疲惫。
        - id: ch01-b41
          speaker: maud_brewster
          text: 啊，我明白了。
        - id: ch01-b42
          speaker: narrator
          text: >-
            可她显然连思考都很吃力，身体已经到了快要垮掉的边缘。她没再问，我也不再说，只顾照拉森的吩咐，让她舒服一点。我像个操持家务的女人那样忙来忙去，找来药水替她缓解晒伤，又从拉森的私藏里翻出一瓶波特酒，还指挥马格里奇收拾那间空舱。
        - id: ch01-b43
          speaker: narrator
          text: >-
            风越刮越大，“幽灵号”倾斜得越来越厉害。等舱房收拾好，船已经在水上飞跑。我竟把利奇和约翰逊忘得干干净净。忽然，一声大喊像雷一样穿过敞开的升降口。是桅顶的斯莫克。
        - id: ch01-b44
          speaker: smoke
          text: 发现小艇！
          emotion: surprised
        - id: ch01-b45
          speaker: narrator
          text: >-
            我立刻望向那个女人。她靠在扶手椅里，闭着眼，已经疲惫到了极点。我怀疑她根本没有听见，便暗自决定，绝不能让她看见那两个逃亡者被捉后必然发生的暴行。她需要休息。很好，就让她睡吧。
        - id: ch01-b46
          speaker: narrator
          text: >-
            甲板上接连响起急促的命令。脚步重重踏过，缩帆索也噼啪抽打起来。“幽灵号”猛然迎风转向，换了另一舷受风。船帆重新鼓起，船身向旁边一倒，扶手椅开始沿着舱房地板滑动。我连忙扑上去，总算没让她从椅子里摔出来。
        - id: ch01-b47
          speaker: narrator
          text: >-
            她的眼皮沉得睁不开。抬头望我时，目光里只有一点被睡意淹没的惊讶和迷惑。我领她走向舱房，她半是绊倒，半是踉跄。马格里奇迎面冲我露出一个不怀好意的笑。我把他推出去，叫他回厨房干活。他马上用自己的办法报复，在猎手中间到处夸我，说我做起“贴身女仆”来，实在好得不得了。
        - id: ch01-b48
          speaker: narrator
          text: >-
            她沉沉靠在我身上。从扶手椅到舱房只有短短一段路，可我相信她走到半途又睡着了。纵帆船突然一晃，她险些栽进铺位，我这才察觉。她醒过来一瞬，困倦地笑了笑，随即又沉入睡梦。我给她盖上两条厚重的水手毯，头下垫着从拉森铺位上拿来的枕头。然后，我留下她安睡在那里。
