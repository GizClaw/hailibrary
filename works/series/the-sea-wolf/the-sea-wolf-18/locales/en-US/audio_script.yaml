audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
    mugridge:
      display_name: Thomas Mugridge
      tts:
        delivery: sneering, officious, and quick to bully
        timbre: nasal and wiry
        pace: brisk with sharp bursts
        pitch: medium-high
    leach:
      display_name: George Leach
      tts:
        delivery: tough, blunt, and quietly defiant
        timbre: rough and youthful
        pace: measured with hard emphasis
        pitch: medium
    smoke:
      display_name: Smoke
      tts:
        delivery: dry, knowing, and easily amused
        timbre: lean and clear
        pace: relaxed with quick comic turns
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: gentle, thoughtful, and composed even when uncertain
        timbre: soft and clear
        pace: measured and natural
        pitch: medium
    lookout:
      display_name: Lookout
      tts:
        delivery: alert and carrying across the deck
        timbre: clear and weathered
        pace: brisk
        pitch: medium-high
    rescued_sailor:
      display_name: Rescued Sailor
      tts:
        delivery: blunt, tired, and indignant
        timbre: rough and salt-worn
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: CHAPTER XVIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The next day, as the storm wore itself out, Wolf Larsen and I studied anatomy and surgery as fast as we could. Then we set Mugridge's broken ribs. Once the weather cleared, Wolf Larsen searched the waters where the storm had caught us, working farther west while the boats were repaired and new sails were made and bent on.
        - id: ch01-b02
          speaker: narrator
          text: >-
            We sighted and boarded one sealing schooner after another. Most were hunting for their missing boats, and most had already picked up boats and crews belonging to other ships. The heart of the fleet had been west of us when the storm struck, and the scattered boats had fled wildly toward whatever shelter lay nearest.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The Cisco returned two of our boats with every man safe. From the San Diego, Wolf Larsen reclaimed Smoke, Nilson, and Leach. Their return delighted him and grieved me. After five days, only four of our men were still missing: Henderson, Holyoak, Williams, and Kelly. Then the Ghost went back to hunting along the edges of the seal herd.
        - id: ch01-b04
          speaker: narrator
          text: >-
            As we followed the herd north, the dreaded sea fogs closed around us. Each day, the boats were lowered and vanished almost before they touched the water. Those of us aboard sounded the horn at regular intervals and fired the bomb gun every fifteen minutes.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Boats were always being lost and found. A stray crew would hunt for whichever schooner rescued it, earning its usual share, until its own ship found it again. But the Ghost was one boat short, and Wolf Larsen seized the first stray boat he came upon. He forced its men to hunt for him and would not release them when their own schooner appeared.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Their captain passed so close that a biscuit could have been tossed between the ships, and he hailed us for news. Wolf Larsen answered by pointing a rifle at the hunter and his two boatmen and driving all three below.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Thomas Mugridge still clung stubbornly to life. Before long he was limping about again, doing the work of both cook and cabin-boy. Johnson and Leach were bullied and beaten just as before. They expected the hunting season to end with their deaths. The rest of the crew lived like dogs and worked like dogs beneath their merciless master.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Wolf Larsen and I managed fairly well together, though I could never quite escape the thought that killing him might be the right thing for me to do. He fascinated me beyond measure, and I feared him just as much. Yet I could not picture him lying dead. He seemed to possess the endless strength of youth. In my mind, he could only go on living, ruling, fighting, and destroying while he alone survived.
        - id: ch01-b09
          speaker: narrator
          text: >-
            When we were deep among the seals and the sea was too rough for the hunters to launch, Wolf Larsen found his own amusement. He would lower a boat with two pullers and a steerer and go hunting himself. He was an excellent shot. In conditions the hunters called impossible, he still brought back many skins. Risking his life and battling terrible odds seemed as necessary to him as breathing.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Meanwhile, I was learning more seamanship every day. Clear weather had become rare, but on one clear day I had the pleasure of handling the Ghost and collecting the boats myself. One of Wolf Larsen's headaches had struck him down. From morning until evening, I stood at the wheel. I sailed out after the last boat far to leeward, then brought that boat and the other five aboard without one command or suggestion from him.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Gales came upon us from time to time in that raw, stormy region. Then, in the middle of June, a typhoon struck. I would never forget it, for the changes it brought shaped my whole future.
        - id: ch01-b12
          speaker: narrator
          text: >-
            We must have been caught close to the center of the circling storm. Wolf Larsen drove south to escape it, first with only a double-reefed jib set, and at last with no sail at all. I had never imagined a sea so vast. Every sea I had known before seemed like a ripple beside those waves. They stretched half a mile from crest to crest, and I am certain they towered above our masthead. Even Wolf Larsen dared not stop the schooner and face them, though they carried us far south and away from the seal herd.
        - id: ch01-b13
          speaker: narrator
          text: >-
            By the time the typhoon eased, we must have reached the route used by steamships crossing the Pacific. To the hunters' astonishment, seals surrounded us there. They called it a second herd, or perhaps a rear guard, and said such a thing was most unusual. Still, the order was given to lower the boats. Guns boomed all through the long day, and the slaughter was pitiful.
        - id: ch01-b14
          speaker: narrator
          text: >-
            That evening, I had just finished counting the skins from the last boat when Leach came beside me in the darkness. He kept his voice low.
        - id: ch01-b15
          speaker: leach
          text: >-
            Mr. Van Weyden, can you tell me how far we are from the coast? And which way is Yokohama from here?
        - id: ch01-b16
          speaker: narrator
          text: >-
            My heart jumped with gladness, because I understood his plan. I told him Yokohama lay five hundred miles away, to the west-northwest.
        - id: ch01-b17
          speaker: leach
          text: >-
            Thank you, sir.
        - id: ch01-b18
          speaker: narrator
          text: >-
            He slipped back into the dark. By the next morning, Number Three boat was gone, and Johnson and Leach were gone with it. Every other boat had lost its water breaker and food box. The two men's bedding and sea bags had disappeared too.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Wolf Larsen flew into a rage. He set the Ghost on a west-northwest course. Two hunters stayed at the mastheads, searching the sea through their glasses, while he paced the deck like an angry lion. He knew I wanted the runaways to escape, so he would not send me aloft to watch for them.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The wind favored us, though it came and went. Finding one tiny boat in that blue emptiness was like finding a needle in a haystack. Wolf Larsen drove the Ghost as hard as she could go until he had placed her between the deserters and the land. Then he sailed back and forth across the course he knew they must follow.
        - id: ch01-b21
          speaker: narrator
          text: >-
            On the third morning, not long after eight bells, Smoke called down from the masthead. He had seen a boat. Everyone crowded along the rail. A lively breeze blew out of the west, with signs of stronger wind behind it. Far to leeward, in the restless silver light of sunrise, a black speck appeared, vanished, and appeared again.
        - id: ch01-b22
          speaker: narrator
          text: >-
            We turned and ran toward it. My heart felt heavy as lead, and sickness rose in me while I waited for what would come. Triumph shone in Wolf Larsen's eyes. His figure seemed to swim before me, and I could barely resist throwing myself upon him.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The thought of the violence waiting for Leach and Johnson had shaken away my reason. In a daze, I went down into the steerage. I loaded a shotgun and had just started back toward the deck with it when a startled voice rang out.
        - id: ch01-b24
          speaker: lookout
          emotion: surprised
          text: >-
            There are five men in that boat!
        - id: ch01-b25
          speaker: narrator
          text: >-
            Weak and trembling, I braced myself in the companionway as the other men confirmed it. Then my knees failed, and I sank down. My senses had returned, but the knowledge of what I had almost done overwhelmed me. I put the gun away with deep relief and went back on deck.
        - id: ch01-b26
          speaker: narrator
          text: >-
            No one had noticed me leave. By then, the boat was close enough for us to see that it was larger than a sealing boat and built in a different way. As we drew nearer, its crew lowered the sail and took down the mast. Then they set out their oars and waited for us to stop and bring them aboard.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Smoke had come down from the masthead and stood beside me. He began to chuckle as if he knew something I did not. I gave him a questioning look.
        - id: ch01-b28
          speaker: smoke
          emotion: happy
          text: >-
            Now there's a fine mess!
        - id: ch01-b29
          speaker: narrator
          text: >-
            What's the matter?
        - id: ch01-b30
          speaker: narrator
          text: >-
            Smoke chuckled again.
        - id: ch01-b31
          speaker: smoke
          emotion: surprised
          text: >-
            Can't you see the person sitting down in the stern? I'll never shoot another seal if that isn't a woman!
        - id: ch01-b32
          speaker: narrator
          text: >-
            I stared, but I could not be certain until surprised cries rose all around us. There were four men in the boat, and the fifth person was indeed a woman. Excitement swept over everyone except Wolf Larsen. His disappointment was plain. This was not his missing boat, and Leach and Johnson were not there for him to punish.
        - id: ch01-b33
          speaker: narrator
          text: >-
            We lowered the flying jib, pulled the jib sheets to windward, hauled the mainsheet tight, and turned the Ghost into the wind. The oars dipped into the water. A few strokes brought the boat alongside.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Now I had my first clear look at the woman. The morning was raw, and a long ulster wrapped her body. All I could see was her face and a mass of light brown hair escaping beneath a sailor's cap. Her large brown eyes shone. Her mouth looked sweet and sensitive, and her face was a delicate oval, though sun and salty wind had burned it scarlet.
        - id: ch01-b35
          speaker: narrator
          text: >-
            To me, she seemed to come from another world. Something in me reached toward her with the hunger of a starving man reaching for bread. I had not seen a woman in a very long time. Wonder held me almost senseless. So this was a woman. I forgot myself and my duties as mate, and I did nothing to help the newcomers aboard.
        - id: ch01-b36
          speaker: narrator
          text: >-
            A sailor lifted her into Wolf Larsen's waiting arms. She looked up at all our curious faces and gave us a sweet, amused smile. No one had smiled that way in so long that I had forgotten such a smile existed.
        - id: ch01-b37
          speaker: wolf_larsen
          text: >-
            Mr. Van Weyden!
        - id: ch01-b38
          speaker: narrator
          text: >-
            His voice snapped me back to myself.
        - id: ch01-b39
          speaker: wolf_larsen
          text: >-
            Take the lady below and make her comfortable. Prepare the spare cabin on the port side, and put Cooky to work on it. See what you can do for her face too. That burn is bad.
        - id: ch01-b40
          speaker: narrator
          text: >-
            He turned away abruptly and began questioning the rescued men. Their boat was cut loose and left behind, though one of them protested that it was shameful when Yokohama lay so near.
        - id: ch01-b41
          speaker: rescued_sailor
          emotion: angry
          text: >-
            It's a bloody shame to cast her loose this close to Yokohama!
        - id: ch01-b42
          speaker: narrator
          text: >-
            As I escorted the woman aft, I found myself strangely afraid of her. I was awkward too. For the first time, I seemed to understand how delicate and fragile a woman could be. I took her arm to help her down the companion stairs, and its smallness and softness startled me.
        - id: ch01-b43
          speaker: narrator
          text: >-
            She was slender and delicate even among women. But after so long without any woman near me, she seemed so light and fine that I half expected her arm to crumble in my hand. That was my first impression of Maud Brewster.
        - id: ch01-b44
          speaker: narrator
          text: >-
            I hurriedly brought Wolf Larsen's armchair out of his cabin and seated her in it.
        - id: ch01-b45
          speaker: maud_brewster
          text: >-
            Please don't go to too much trouble for me. The men expected to see land at any moment this morning. Surely the ship will reach port by tonight, don't you think?
        - id: ch01-b46
          speaker: narrator
          text: >-
            Her simple trust in what would happen next caught me by surprise. How could I explain our true position? How could I describe the strange man who moved across the sea like Destiny, or teach her in a moment what had taken me months to learn? Still, I answered honestly.
        - id: ch01-b47
          speaker: narrator
          text: >-
            With any captain but ours, I would tell you that you'll be ashore in Yokohama tomorrow. But our captain is a strange man. Please be ready for anything. I mean anything at all.
        - id: ch01-b48
          speaker: maud_brewster
          text: >-
            I... I'm afraid I don't quite understand. Perhaps I'm mistaken, but aren't shipwrecked people always treated with every kindness? And this is such a small matter. We're so close to land.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Her eyes were troubled, though not frightened.
        - id: ch01-b50
          speaker: narrator
          text: >-
            To be honest, I don't know what will happen. I only want you ready in case the worst comes. Our captain is a brute. He's a demon, and no one can ever guess what wild thing he may do next.
        - id: ch01-b51
          speaker: narrator
          text: >-
            My excitement was rising, but she stopped me. Her voice sounded tired.
        - id: ch01-b52
          speaker: maud_brewster
          text: >-
            Oh. I see.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Even thinking had become an effort for her. She was plainly close to collapsing. She asked nothing else, and I said no more. Instead, I gave all my attention to making her comfortable, as Wolf Larsen had ordered.
        - id: ch01-b54
          speaker: narrator
          text: >-
            I busied myself like a housekeeper. I found soothing lotion for her sunburn, took a bottle of port from Wolf Larsen's private stores, and directed Thomas Mugridge while he prepared the spare stateroom.
        - id: ch01-b55
          speaker: narrator
          text: >-
            The wind strengthened quickly. The Ghost leaned farther over, and by the time the room was ready, she was racing through the water. I had completely forgotten Leach and Johnson when a cry burst down the open companionway like thunder. It was Smoke's voice from the masthead.
        - id: ch01-b56
          speaker: smoke
          emotion: surprised
          text: >-
            Boat ho!
        - id: ch01-b57
          speaker: narrator
          text: >-
            I glanced sharply at Maud. She lay back in the chair with her eyes closed, utterly exhausted. I did not think she had heard. I decided she must not witness the brutality that would follow if the deserters were caught. She was tired, and I would make sure she slept.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Quick orders rang out overhead. Feet stamped across the deck, and reef points slapped as the Ghost rushed into the wind and turned onto the other tack. The schooner filled her sails and heeled over. Wolf Larsen's chair began sliding across the cabin floor. I sprang forward just in time to keep Maud from being thrown out.
        - id: ch01-b59
          speaker: narrator
          text: >-
            She looked up at me, but her heavy eyes showed only a trace of sleepy confusion. She half walked and half stumbled as I led her to the cabin. Mugridge gave me a sly grin. I pushed him out and ordered him back to the galley. He took his revenge by telling the hunters bright tales of what a fine lady's maid I had become.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Maud leaned heavily against me. I believe she fell asleep again somewhere between the armchair and the stateroom. I realized it when a sudden roll of the schooner nearly pitched her into the bunk. She woke for a moment, smiled drowsily, and slipped back to sleep. I left her there beneath a heavy pair of sailors' blankets, with her head on a pillow I had taken from Wolf Larsen's bunk.
