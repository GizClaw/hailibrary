audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
    johansen:
      display_name: Johansen
      tts:
        delivery: blunt and forceful
        timbre: heavy and rough
        pace: deliberate
        pitch: low
    johnson:
      display_name: Johnson
      tts:
        delivery: slow, respectful, and quietly resolute
        timbre: weathered and firm
        pace: unhurried
        pitch: low
    george_leach:
      display_name: George Leach
      tts:
        delivery: fierce, direct, and quick to flare
        timbre: young and hard-edged
        pace: rapid
        pitch: medium
    thomas_mugridge:
      display_name: Thomas Mugridge
      tts:
        delivery: ingratiating and theatrical, breaking into panic under threat
        timbre: thin and nasal
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: CHAPTER XII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The last twenty-four hours had been a carnival of brutality. Violence seemed to spread like a sickness from the cabin at the stern to the sailors' quarters in the forecastle. It had broken out everywhere aboard the ship, among officers, hunters, and sailors. I hardly knew where to begin. Wolf Larsen was really the cause of it all. Feuds, quarrels, and old grudges had strained every relationship among the men. Nothing was stable. Then their worst passions caught fire like dry prairie grass.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Thomas Mugridge was a sneak, a spy, and an informer. He had been carrying tales about the sailors, hoping to win back Wolf Larsen's favor. I knew he had reported some angry words from Johnson. Johnson had bought oilskins from the ship's little store and found them terribly poor, and he had said so freely. Every sealing schooner carried such a store, stocked with the clothing and gear sailors needed. A sailor paid for his purchases from what he later earned during the hunt. The hunters, boat pullers, and steerers received no wages. Each received a “lay,” a set payment for every skin taken by his particular boat.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I knew nothing about Johnson's complaints, so what followed shocked me without warning. I had just finished sweeping the cabin, and Wolf Larsen had tempted me into a discussion of Hamlet, his favorite Shakespeare character. Then Johansen came down the companion stairs with Johnson behind him. Johnson removed his cap, as sailors were expected to do below deck. He stood respectfully in the middle of the cabin, his heavy body shifting uneasily with every roll of the schooner, and faced the captain.
        - id: ch01-b04
          speaker: wolf_larsen
          text: >-
            Shut the doors, Hump, and pull the slide closed.
        - id: ch01-b05
          speaker: narrator
          text: >-
            I obeyed. There was anxiety in Johnson's eyes, but I mistook it for his usual shyness and embarrassment. I had no idea what was coming. He knew from the start, and he waited bravely. In that moment, he disproved everything Wolf Larsen believed about life. Johnson was guided by ideas and principles, by truth and sincerity. He knew he was right, and he was not afraid. If necessary, he would die for what was right rather than betray himself or his own soul. To me, that was the spirit winning a victory over the flesh. It was the greatness of a soul that could rise beyond time, space, and matter because it trusted in eternity and immortality.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Johansen stood several feet to Johnson's side. Wolf Larsen sat nine feet in front of him in a turning cabin chair. Once I had shut us in, silence held for a full minute. Then Wolf Larsen spoke.
        - id: ch01-b07
          speaker: wolf_larsen
          text: >-
            Yonson.
        - id: ch01-b08
          speaker: johnson
          text: >-
            My name is Johnson, sir.
        - id: ch01-b09
          speaker: wolf_larsen
          text: >-
            Johnson, then, damn you. Do you know why I sent for you?
        - id: ch01-b10
          speaker: johnson
          text: >-
            Yes and no, sir. I do my work well. The mate knows it, and so do you. You cannot complain about my work.
        - id: ch01-b11
          speaker: wolf_larsen
          text: >-
            Is that everything?
        - id: ch01-b12
          speaker: narrator
          text: >-
            His voice was soft, low, almost a purr.
        - id: ch01-b13
          speaker: johnson
          text: >-
            I know you have a grudge against me, sir. You do not like me. You... you...
        - id: ch01-b14
          speaker: wolf_larsen
          text: >-
            Keep going. You won't hurt my feelings.
        - id: ch01-b15
          speaker: johnson
          emotion: angry
          text: >-
            I am not afraid. I speak slowly because I have not been away from the old country as long as you. You dislike me because I am too much of a man. That is the reason, sir.
        - id: ch01-b16
          speaker: wolf_larsen
          text: >-
            Too much of a man for discipline aboard ship, you mean. That is, if you understand me.
        - id: ch01-b17
          speaker: johnson
          emotion: angry
          text: >-
            I understand English, sir, and I understand you.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The insult made his sunburned face flush more deeply. Wolf Larsen brushed the whole exchange aside and came to his purpose.
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            I hear those oilskins did not satisfy you.
        - id: ch01-b20
          speaker: johnson
          text: >-
            No, sir. They are no good.
        - id: ch01-b21
          speaker: wolf_larsen
          text: >-
            And you've been telling everyone what you think of them.
        - id: ch01-b22
          speaker: johnson
          text: >-
            I say what I think, sir.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Johnson spoke courageously, though he still gave the captain the formal “sir” required at sea after every answer. I glanced at Johansen. His great fists opened and closed, and his face looked almost fiendish as he stared at Johnson with hatred. A fading black mark remained beneath his eye from the beating Johnson had given him a few nights earlier. For the first time, I understood that something terrible was about to happen. Even then, I could not imagine what it would be.
        - id: ch01-b24
          speaker: wolf_larsen
          text: >-
            Do you know what happens to a man who talks that way about me and my ship's store?
        - id: ch01-b25
          speaker: johnson
          text: >-
            I know, sir.
        - id: ch01-b26
          speaker: wolf_larsen
          emotion: angry
          text: >-
            What happens?
        - id: ch01-b27
          speaker: johnson
          text: >-
            Whatever you and the mate mean to do to me, sir.
        - id: ch01-b28
          speaker: wolf_larsen
          text: >-
            Look at him, Hump. Here is a little piece of living dust. It moves, breathes, defies me, and believes there is something good inside it. It believes in human inventions like honesty and right conduct, and it will obey them through every threat and pain. What do you make of him, Hump?
        - id: ch01-b29
          speaker: narrator
          text: >-
            I wanted to draw some of the coming fury onto myself.
        - id: ch01-b30
          speaker: narrator
          text: >-
            I think he is a better man than you. Those human inventions, as you call them, give him honor and manhood. You have no dreams and no ideals. You are poor in everything that matters.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Wolf Larsen nodded with savage pleasure.
        - id: ch01-b32
          speaker: wolf_larsen
          text: >-
            True enough, Hump. I have none of those inventions that produce honor and manhood. I agree with the Preacher that a living dog is better than a dead lion. My only rule is to do whatever helps me survive. When this bit of ferment called Johnson is no longer ferment, when he has become nothing but dust and ashes, his remains will have no more nobility than any other dust and ashes. I will still be alive and roaring.
        - id: ch01-b33
          speaker: wolf_larsen
          text: >-
            Do you know what I'm going to do now?
        - id: ch01-b34
          speaker: narrator
          text: >-
            I shook my head.
        - id: ch01-b35
          speaker: wolf_larsen
          text: >-
            I am going to use my right to roar and show you what becomes of nobility. Watch.
        - id: ch01-b36
          speaker: narrator
          text: >-
            He was sitting nine feet from Johnson. Without standing first, he launched his whole seated body out of the chair. He crossed the distance like a tiger. The attack came down like an avalanche, and Johnson tried helplessly to guard himself. He held one arm low over his stomach and the other high over his head. Wolf Larsen's fist drove between them and struck him squarely in the chest. The blow landed with a crushing sound. Johnson's breath burst from his mouth, then stopped short, like the hard grunt of a man swinging an axe. He nearly fell backward. He swayed from side to side, fighting to recover his balance.
        - id: ch01-b37
          speaker: narrator
          text: >-
            I cannot describe everything in the horrible scene that followed. It was too revolting, and the memory still sickens me. Johnson fought bravely, but he was no match for Wolf Larsen, much less for Wolf Larsen and Johansen together. I had never imagined a human being could suffer so much, remain alive, and keep struggling. Johnson did keep struggling. There was not the slightest hope for him, and he knew it as clearly as I did. Yet the manhood in him would not let him stop fighting to preserve that manhood.
        - id: ch01-b38
          speaker: narrator
          text: >-
            I could bear no more of the sight. I felt that I would lose my mind if I stayed. I ran up the companion stairs, trying to open the doors and escape onto the deck. Wolf Larsen left his victim for a moment. With one of his tremendous leaps, he reached me and flung me into the far corner of the cabin.
        - id: ch01-b39
          speaker: wolf_larsen
          text: >-
            These are the facts of life, Hump. Stay and observe them. You might collect some evidence about the immortal soul. We cannot injure Johnson's soul, you know. We can only destroy the body that will soon pass away.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The beating seemed to last for centuries, though it may have been only ten minutes. Wolf Larsen and Johansen were always around the poor man. They struck Johnson with their fists and kicked him with heavy shoes. They knocked him down, dragged him upright, and knocked him down again. His swollen eyes were blinded so he could no longer see. Blood ran from his ears, nose, and mouth until the cabin looked like a slaughterhouse. Even after he could no longer rise, they went on beating and kicking him where he lay.
        - id: ch01-b41
          speaker: wolf_larsen
          text: >-
            Easy, Johansen. Easy now.
        - id: ch01-b42
          speaker: narrator
          text: >-
            But the beast in Johansen had risen and taken control. Wolf Larsen had to sweep him aside with the back of one hand. The motion looked almost gentle, yet it threw the mate away like a cork and smashed his head against the wall. Johansen dropped to the floor, half stunned for the moment, breathing hard and blinking in a dull, confused way.
        - id: ch01-b43
          speaker: wolf_larsen
          text: >-
            Pull those doors open, Hump.
        - id: ch01-b44
          speaker: narrator
          text: >-
            I obeyed. The two brutes lifted the unconscious Johnson as if he were a sack of rubbish. They heaved him up the companion stairs, forced him through the narrow doorway, and threw him onto the deck. Blood poured from his nose in a scarlet stream across the feet of Louis, his boatmate, who happened to be at the wheel. Louis moved one hand to another spoke without any visible reaction and kept staring into the compass box.
        - id: ch01-b45
          speaker: narrator
          text: >-
            George Leach acted very differently. Nothing from one end of the ship to the other could have surprised us more. Without orders, the former cabin boy came onto the raised deck and dragged Johnson forward. He did what he could to dress the wounds and make him comfortable. Only a few minutes had passed since the beating began, but Johnson could no longer be recognized as Johnson. His face was so swollen and discolored that its separate features could not be recognized as human features at all.
        - id: ch01-b46
          speaker: narrator
          text: >-
            By the time I had finished cleaning the blood from the cabin, Leach had cared for Johnson. I went on deck for fresh air and tried to settle my badly shaken nerves. Wolf Larsen stood smoking a cigar and inspecting the mechanical log the Ghost usually towed behind her. For some reason, it had been hauled aboard. Then Leach's voice reached me. It was hoarse and tight with overpowering rage. I turned and saw him below the break of the raised deck, on the port side of the galley. His face was twisted and white, his eyes flashed, and both clenched fists were raised over his head.
        - id: ch01-b47
          speaker: george_leach
          emotion: angry
          text: >-
            May God damn your soul to hell, Wolf Larsen! No, hell is too good for you. You coward! You murderer! You pig!
        - id: ch01-b48
          speaker: narrator
          text: >-
            I was stunned. I looked for Wolf Larsen to destroy him on the spot. But the captain had no wish to do it then. He strolled slowly forward to the edge of the raised deck, rested one elbow on the corner of the cabin, and looked down at the furious boy with thoughtful, quiet curiosity.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Leach condemned Wolf Larsen as no one ever had. The sailors gathered in a frightened group outside the forecastle opening, watching and listening. The hunters rushed up from their quarters in a heap. As Leach went on, I saw no amusement in their faces. They were terrified, not by his awful words, but by his awful daring. It seemed impossible that any living person could challenge Wolf Larsen to his face. I was shocked into admiring the boy. In him, as in Johnson, I saw the immortal spirit rise above the body and all the body's fears, like one of the old prophets standing up to condemn wrongdoing.
        - id: ch01-b50
          speaker: narrator
          text: >-
            And what a denunciation it was. Leach stripped Wolf Larsen's soul bare and held it up to the scorn of the men. He poured down curses from God and heaven. His fierce words had the burning force of some old church excommunication. He passed through every kind of condemnation. His anger rose until it sounded grand, almost godlike, then exhaustion dragged it down into the lowest and most indecent abuse. Rage drove him nearly mad. Soapy foam flecked his lips. Sometimes he choked and gurgled until he could make no words at all.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Through it all, Wolf Larsen remained calm and motionless, leaning on his elbow and staring down with great curiosity. This wild stirring of life, this fierce revolt by a little piece of moving matter, both puzzled and fascinated him. Every moment, all of us expected him to leap on Leach and destroy him. But he chose not to. His cigar went out, and still he watched in curious silence.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Leach's helpless fury reached its height.
        - id: ch01-b53
          speaker: george_leach
          emotion: angry
          text: >-
            Pig! Pig! Pig! Why don't you come down here and kill me, murderer? You can do it. I'm not afraid! No one will stop you. Better to be dead and beyond your reach than alive in your hands. Come on, coward! Kill me! Kill me! Kill me!
        - id: ch01-b54
          speaker: narrator
          text: >-
            At that point, Thomas Mugridge's restless nature brought him into the scene. He had been listening from the galley doorway. Now he stepped outside, pretending that he only meant to throw some scraps overboard. Plainly, he wanted a better view of the killing he felt certain would happen. He smirked greasily up at Wolf Larsen, who seemed not to see him. That did not discourage the cook. Though he was behaving like a madman, he turned boldly to Leach.
        - id: ch01-b55
          speaker: thomas_mugridge
          text: >-
            What dreadful language! Shocking!
        - id: ch01-b56
          speaker: narrator
          text: >-
            At last, Leach's rage had found someone within reach. For the first time since the stabbing, Mugridge had left the galley without his knife. Leach knocked him down before the words were fully out. Three times Mugridge struggled up and tried to reach the galley. Three times Leach knocked him down again.
        - id: ch01-b57
          speaker: thomas_mugridge
          emotion: fearful
          text: >-
            Oh, Lord! Help! Help! Take him away! Can't somebody take him away?
        - id: ch01-b58
          speaker: narrator
          text: >-
            The hunters laughed from pure relief. The tragedy had shrunk into a farce. Now the sailors crowded boldly aft, grinning and shuffling as they watched the hated cook take his beating. Even I felt a great rush of joy. I admit that I delighted in what Leach did to Thomas Mugridge, though it was nearly as terrible as the beating Mugridge had caused Johnson to suffer.
        - id: ch01-b59
          speaker: narrator
          text: >-
            Wolf Larsen's expression never changed. He did not even shift his position. He kept leaning there and watching with that same deep curiosity. For all his practical certainty about life, he seemed to study its movement as if hoping to discover something more. Perhaps, in its wildest twisting and struggling, life would reveal what had escaped him until now. Perhaps he would find the key to its mystery and everything would become clear and plain.
        - id: ch01-b60
          speaker: narrator
          text: >-
            The beating looked much like the one in the cabin. Mugridge tried helplessly to protect himself from the furious boy. He tried just as helplessly to reach the safety of the galley. He rolled toward it, crawled toward it, and fell toward it whenever another blow knocked him down. The blows came with bewildering speed, tossing him about like a shuttlecock. At last, he lay helpless while Leach beat and kicked him. No one interfered. Leach could have killed him, but his need for revenge was finally satisfied. He stepped away from his fallen enemy and walked forward, leaving Mugridge on the deck, whimpering and wailing like a puppy.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Those two beatings only opened the day's program. That afternoon, the hunters Smoke and Henderson quarreled and turned on each other. A burst of gunshots sounded from their quarters. The other four hunters came stampeding onto the deck. A column of thick, bitter smoke rose through the open companionway, the kind of smoke black powder always made. Wolf Larsen leaped down through it. From below, we heard the sounds of blows and bodies struggling.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Both men had been shot. Wolf Larsen thrashed them for disobeying his orders and disabling themselves before the hunting season had even begun. Their wounds were serious. After beating them, he became their rough surgeon and dressed the injuries himself. I served as his assistant while he probed and cleaned the channels the bullets had torn through them. Smoke and Henderson endured his crude surgery without any anesthetic. All they had to support them was a strong glass of whisky apiece.
        - id: ch01-b63
          speaker: narrator
          text: >-
            During the first evening watch, all the trouble in the forecastle finally came to a head. It had grown from the same petty gossip and tale-bearing that caused Johnson's punishment. We heard enough noise from the fight, though we did not see it. Then, when the bruised and battered men appeared the next day, the result was obvious. Half the forecastle had given the other half a sound beating.
        - id: ch01-b64
          speaker: narrator
          text: >-
            The second evening watch ended the day with one more fight. Johansen faced Latimer, the lean hunter who looked like a Yankee. Latimer had made remarks about the sounds the mate made in his sleep. Johansen lost the fight. Then he slept happily while everyone in the hunters' quarters stayed awake for the rest of the night, listening to him fight the whole battle again and again in his dreams.
        - id: ch01-b65
          speaker: narrator
          text: >-
            As for me, I lay oppressed by nightmares. The day itself had felt like some horrible dream. One act of brutality had followed another without relief. Burning passions and cold, deliberate cruelty drove men to seek one another's lives, to hurt, cripple, and destroy. My nerves were shocked, and my mind itself was shocked. Until then, I had passed all my days knowing almost nothing of the animal violence in human beings. Nearly all my experience of life had belonged to its intellectual side.
        - id: ch01-b66
          speaker: narrator
          text: >-
            I had met brutality, of course, but only the brutality of the intellect. There had been Charley Furuseth's cutting sarcasm, the cruel little sayings and occasional hard jokes of the men at the Bibelot, and the nasty remarks of certain professors when I was a student. That was all. The idea that men could release their anger on one another by bruising flesh and spilling blood was strange and terrifying to me.
        - id: ch01-b67
          speaker: narrator
          text: >-
            Tossing restlessly in my bunk from one nightmare to another, I thought there had been good reason for people to call me “Sissy” Van Weyden. My innocence about the harsh realities of life had been complete indeed. I laughed bitterly to myself at what I had been. Wolf Larsen's grim and forbidding philosophy now seemed to offer a better explanation of life than anything I could find in my own beliefs.
        - id: ch01-b68
          speaker: narrator
          text: >-
            Then I became fully aware of where my thoughts were going, and I was frightened. The constant violence around me was changing me for the worse. It threatened to destroy, in my eyes, everything best and brightest in life. Reason told me that the beating Thomas Mugridge received was evil. Yet for the life of me, I could not keep my soul from rejoicing in it. Even while the enormity of that sin weighed on me, because I knew it was a sin, I chuckled with insane delight.
        - id: ch01-b69
          speaker: narrator
          text: >-
            I was no longer Humphrey Van Weyden, the man I had been before this voyage, protected from such realities. I was Hump, cabin boy aboard the schooner Ghost. Wolf Larsen was my captain. Thomas Mugridge and all the others were now my companions. Day after day, their world pressed itself upon me. I was receiving repeated impressions from the same hard die that had already stamped its shape upon every one of them. I could feel it stamping that shape into me.
