audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    johnson:
      display_name: 约翰逊
      tts:
        delivery: 迟缓沉着，坦率而不肯屈服
        timbre: 粗粝厚实的成年男声
        pace: 缓慢，每句话都说得清楚郑重
        pitch: 中低音
    johansen:
      display_name: 约翰森
      tts:
        delivery: 粗暴阴沉，带着积怨和凶狠
        timbre: 浑浊有力的成年男声
        pace: 短促沉重
        pitch: 低音
    leach:
      display_name: 利奇
      tts:
        delivery: 倔强激烈，愤怒时近乎不顾一切
        timbre: 紧绷而略带沙哑的年轻男声
        pace: 明快，激动时急促爆发
        pitch: 中高音
    mugridge:
      display_name: 托马斯·马格里奇
      tts:
        delivery: 油滑怯懦，带着夸张的伦敦口音感
        timbre: 尖细而发黏的成年男声
        pace: 偏快，慌乱时语不成调
        pitch: 高音
  chapters:
    - id: ch01
      title: 第十二章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            过去二十四小时，简直是一场野蛮暴行的狂欢。“幽灵号”从船尾舱房一直到船头水手舱，到处都出了乱子。那股戾气像瘟疫一样传遍全船，一件暴行还没停，另一件已经冒了出来，我几乎不知道该从哪里讲起。真正的祸根是海狼·拉森。船员们本来就积怨已久，争吵不断，彼此关系绷到了极点，只靠一种摇摇欲坠的平衡维持着。邪恶的激情一冒出来，便像草原野草遇火，转眼烧成一片。
        - id: ch01-b02
          speaker: narrator
          text: >-
            马格里奇是个鬼祟小人，是奸细，也是告密者。他一心想讨好船长，重新换回拉森的欢心，于是不断把船头那些人的话搬到船尾。约翰逊几句冲动的话，就是他传过去的。事情起于一套油布衣。约翰逊从船上杂货柜买来以后，发现质地差得很，便毫不客气地四处声张。捕海豹纵帆船都有这种小百货铺，里面装着水手需要的衣物和用品。水手先拿走东西，价钱日后从捕猎所得里扣除。猎手、划艇手和掌舵手都不领固定薪水。他们拿的是“份子”，自己那条艇每捕到一张海豹皮，便照规定分到一笔钱。
        - id: ch01-b03
          speaker: narrator
          text: >-
            可我还不知道约翰逊抱怨油布衣的事，所以亲眼见到后面的场面时，那阵惊讶来得毫无预兆。那天我刚刚扫完舱房，海狼·拉森又把我拉进一场谈话，谈的是他最喜欢的莎士比亚人物哈姆雷特。就在我们说话时，约翰森走下舱梯，约翰逊跟在后面。依照海上的规矩，约翰逊一进来便摘掉帽子，恭恭敬敬地站在舱房中央。纵帆船随着海浪起伏，他高大的身子也沉重而不安地左右摇晃，脸却始终正对着船长。
        - id: ch01-b04
          speaker: wolf_larsen
          text: 把门关上，舱口盖也拉好。
        - id: ch01-b05
          speaker: narrator
          text: >-
            我照做时，看见约翰逊眼里闪过一丝忧虑，却没明白那是为什么。直到事情真的发生，我都不曾料到接下来会怎样。后来我才明白，他从进门起就清楚什么在等着自己，只是在勇敢地等候。他相信思想，相信原则、真理和诚实。他认定自己是对的，也知道自己站得住脚，所以毫不畏惧。哪怕正义要他付出生命，他也肯去死。他要忠于自己，诚实地面对自己的灵魂。海狼·拉森说精神不过是物质，可约翰逊已经用行动让精神胜过了肉体，也让他的唯物主义站不住脚。
        - id: ch01-b06
          speaker: narrator
          text: >-
            当时，我只把他的忧虑当成天生的羞怯。大副站在他侧旁，海狼·拉森坐在正前方三码外的一把转椅上。门一关好，舱里足足沉默了一分钟。
        - id: ch01-b07
          speaker: wolf_larsen
          text: 约恩森，我在叫你。
        - id: ch01-b08
          speaker: johnson
          text: 我叫约翰逊，先生。
        - id: ch01-b09
          speaker: wolf_larsen
          text: 好，那就约翰逊，该死的！你猜得出我为什么叫你来吗？
        - id: ch01-b10
          speaker: johnson
          text: 我猜得到，也猜不到，先生。我的活干得很好，大副知道，您也知道。所以，不会有人为干活的事责怪我。
        - id: ch01-b11
          speaker: wolf_larsen
          text: 只有这些吗？
        - id: ch01-b12
          speaker: narrator
          text: 他的声音又低又柔，听着像一只猫在呼噜。
        - id: ch01-b13
          speaker: johnson
          text: 我知道您想找我的麻烦。您不喜欢我。您……您……
        - id: ch01-b14
          speaker: wolf_larsen
          text: 说吧，别怕伤了我的感情。
        - id: ch01-b15
          speaker: johnson
          text: >-
            我不怕。我说得慢，只因为我离开老家没有您那么久。您不喜欢我，是因为我太像个男子汉。就是这个缘故，先生。
          emotion: angry
        - id: ch01-b16
          speaker: wolf_larsen
          text: 如果你是这个意思，也听得懂我的话，那你这个男子汉当得太过了，已经不服船上的管束。
        - id: ch01-b17
          speaker: johnson
          text: 我懂英语，也懂您的意思，先生。
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 那句讥讽让约翰逊脸上的怒色更深。海狼·拉森却把先前的话一笔带过，终于转到正题。
        - id: ch01-b19
          speaker: wolf_larsen
          text: 听说你对那套油布衣不太满意？
        - id: ch01-b20
          speaker: johnson
          text: 对，我不满意。那东西一点也不好，先生。
        - id: ch01-b21
          speaker: wolf_larsen
          text: 你还到处嚷嚷，是吗？
        - id: ch01-b22
          speaker: johnson
          text: 我怎么想，就怎么说，先生。
        - id: ch01-b23
          speaker: narrator
          text: >-
            约翰逊说得勇敢，却仍守着船上的礼数，每一句都称一声“先生”。就在这时，我偶然望向约翰森。只见他那双大拳头一遍遍攥紧又松开，盯着约翰逊的神情恶毒得像个魔鬼。他眼睛下面还有一块淡淡的乌青，没有完全褪去，那正是几夜前被约翰逊痛打留下的痕迹。我想起两人的旧怨，也看见大副已经按捺不住。直到这一刻，我才隐约知道，一件可怕的事就要在眼前发生了，可究竟会有多可怕，我仍想象不出。
        - id: ch01-b24
          speaker: wolf_larsen
          text: 你这样诋毁我和我的杂货柜，会落得什么下场，你知道吗？
        - id: ch01-b25
          speaker: johnson
          text: 我知道，先生。
        - id: ch01-b26
          speaker: wolf_larsen
          text: 什么下场？
        - id: ch01-b27
          speaker: johnson
          text: 就是您和那边的大副正准备给我的下场，先生。
        - id: ch01-b28
          speaker: wolf_larsen
          text: >-
            汉普，看看他。这样一小撮活着的尘土，会动，会呼吸，竟敢反抗我。他深信自己身上有善良，还被正义、诚实这些人类编出的幻象迷住了。不管会吃多少苦，冒多大的险，他都要照着那些幻象活。汉普，你说，他算什么？
        - id: ch01-b29
          speaker: humphrey
          text: >-
            我说，他比你高尚。你所谓的那些幻象，能使人高贵，使人成为真正的男子汉。你没有幻象，没有梦想，也没有理想。你才是真正一无所有的人。
        - id: ch01-b30
          speaker: narrator
          text: 我想替约翰逊分担一点即将落下的怒火。海狼·拉森却残忍而愉快地点了点头。
        - id: ch01-b31
          speaker: wolf_larsen
          text: >-
            说得对，汉普。我没有那些叫人高贵、叫人成为男子汉的幻象。我只同《传道书》的作者相信一件事，活狗胜过死狮。我唯一信奉的道理，就是怎样做最有用，而这个道理能让我活下去。我们称作“约翰逊”的这一小团酵母，等到不再发酵，只剩下尘土和灰烬，便不会比任何尘土灰烬多半分高贵。可到了那时，我依旧活着，依旧能够咆哮。你知道我现在要做什么吗？
        - id: ch01-b32
          speaker: narrator
          text: 我摇了摇头。
        - id: ch01-b33
          speaker: wolf_larsen
          text: 我要行使咆哮的特权，让你看看高贵会有什么下场。看着吧。
        - id: ch01-b34
          speaker: narrator
          text: >-
            他还坐在椅子上，离约翰逊足有三码，也就是整整九英尺。可他没有先站起来，就保持着坐姿从椅子上整个飞扑出去。他像野兽，像一头突然跃起的猛虎，一下越过两人之间的距离。那股狂怒仿佛雪崩迎面压来，约翰逊根本挡不住。他一只胳膊向下护住肚子，另一只抬起护住脑袋。拉森的拳头却正从两臂之间穿过，重重砸在胸口，发出沉闷的撞击声。空气从约翰逊嘴里猛地挤出，又骤然断掉，像挥斧的人发力时被迫吐出一口气。他险些向后摔倒，只能左右摇晃，拼命找回平衡。
        - id: ch01-b35
          speaker: narrator
          text: >-
            后面的惨状，我实在无法细说。那场面太叫人作呕，直到今天，只要一想起来，我仍会恶心得发慌。约翰逊抵抗得足够勇敢，可他一个人敌不过海狼·拉森，更敌不过拉森加上大副。眼前的一切实在骇人。我从未想到，一个人遭受了这么多以后，竟然还能活着，还能继续挣扎。约翰逊也知道自己毫无希望，连最微小的一点希望都没有。可他身上那股男子汉的尊严，不许他停手。他明知会被打倒，还是只能为了这份尊严战斗下去。
        - id: ch01-b36
          speaker: narrator
          text: >-
            我看得快要发疯，转身冲上舱梯，想开门逃到甲板上。拉森暂时丢下约翰逊，一跃追到我身边，把我扔进舱房远处的墙角。
        - id: ch01-b37
          speaker: wolf_larsen
          text: >-
            汉普，这就是生命的现象。留下来看着，说不定能搜集一点灵魂不朽的资料。放心，我们伤不到约翰逊的灵魂，顶多毁掉它这副转瞬即逝的身体。
        - id: ch01-b38
          speaker: narrator
          text: >-
            那场毒打仿佛持续了几个世纪，其实也许还不到十分钟。拉森和约翰森围着那个可怜人，不停地挥拳，又用沉重的鞋子踢他。他们把约翰逊打倒，再拖到脚上，接着重新打倒。他的双眼肿得什么也看不见，鲜血从耳朵、鼻子和嘴里一起流出来，整个舱房都变成了屠宰场。后来，他已经没有力气站起，只能倒在地上。可那两个人仍不住手，照样对着地上的身体殴打踢踹。
        - id: ch01-b39
          speaker: wolf_larsen
          text: 轻点，约翰森。稳住，轻一点。
        - id: ch01-b40
          speaker: narrator
          text: >-
            大副心里的野兽已经彻底发了狂。拉森只得反手一扫，看起来没使多少力，却把约翰森像软木塞一样掀出去。他的脑袋砰地撞上墙，人跌到地上，半昏半醒地喘着粗气。
        - id: ch01-b41
          speaker: wolf_larsen
          text: 汉普，把门拉开。
        - id: ch01-b42
          speaker: narrator
          text: >-
            我照办了。那两个畜生把昏迷的约翰逊当成一袋垃圾，抬起来扔上舱梯，又抛出门外。他鼻子里的血流过舵手双脚。掌舵的是同艇的路易，可他只顾交接舵轮辐，眼睛平静地盯着罗经柜。
        - id: ch01-b43
          speaker: narrator
          text: >-
            从前的舱房侍役利奇却做出了完全不同的选择。全船上下，没有谁会想到他竟敢主动走上艉楼。他没有等候命令，直接把约翰逊拖回船头，尽力替他包扎伤口，让他躺得舒服一些。殴打开始到身体被拖走，不过短短几分钟，可那张脸已经彻底变色，肿得不成样子。不只认不出这是约翰逊，甚至认不出那些还是人的五官。等我终于把舱房里的血污清洗干净，利奇也已经把他照料好了。
        - id: ch01-b44
          speaker: narrator
          text: >-
            我上甲板透一口新鲜空气，也想让绷得过紧的神经稍稍安静。拉森叼着一支雪茄，正在查看“幽灵号”平日拖在船尾的专利计程仪。不知为了什么，那仪器已经被收了上来。忽然，利奇的声音钻进我耳朵。压倒一切的狂怒让那声音绷得发紧，又嘶哑难听。我转过头，看见他站在厨房左舷一侧，正处在艉楼前端下方。他的脸扭曲成一团，白得吓人，双眼闪着火光，两只攥紧的拳头高高举过头顶。
        - id: ch01-b45
          speaker: leach
          text: 愿上帝把你的灵魂咒进地狱，海狼·拉森！不，地狱给你都嫌太好！你这个懦夫、杀人凶手、猪猡！
          emotion: angry
        - id: ch01-b46
          speaker: narrator
          text: >-
            我惊得呆住了，以为利奇马上就会被消灭。拉森却偏偏没有动手。他慢慢走到艉楼前端，把一只胳膊肘支在舱房的角上，若有所思，又满怀好奇地俯视着这个年轻人。水手们战战兢兢地聚在水手舱口外，一边看，一边听。猎手们也争先恐后地从统舱涌出来。可利奇越骂下去，他们的脸色越凝重，没有一个人发笑。他们不是怕那些可怕的话，而是被说话人的胆量吓住了。大家仿佛不敢相信，世上竟有一个活人，敢这样当面挑战海狼·拉森！
        - id: ch01-b47
          speaker: narrator
          text: >-
            我震惊之余，竟对利奇肃然起敬。我在他身上又看见了那种不朽的力量。它越过肉体，也越过肉体带来的恐惧，像古代先知的精神一样挺身斥责不义。他把拉森的灵魂赤裸裸地揪到众人面前，让所有人鄙弃。他召来上帝与至高天国的一切诅咒，像暴雨一样倾泻下去，又用滚烫的辱骂灼烧那灵魂，仿佛中世纪的教会正在宣布绝罚。他把能想到的斥责全都说遍了。怒火越升越高，庄严得几乎神圣，等到精疲力尽，又猛地跌落，变成最污秽、最不堪入耳的辱骂。
        - id: ch01-b48
          speaker: narrator
          text: >-
            利奇愤怒得发了狂，嘴唇边溅起肥皂泡似的白沫。有时喉咙噎住，只能发出咕噜声，连话也说不清。拉森却始终支着胳膊肘，镇定而毫无表情地看着。他似乎完全沉进了一种巨大的好奇。眼前这团发酵的生命正在疯狂翻腾，这块会动的物质竟发起如此猛烈的反抗和挑战。它叫他困惑，也叫他入迷。每过一刻，我都等着他扑下去毁掉利奇，别人也一样。可是他偏偏没有这个兴致。雪茄都熄灭了，他还是一动不动，只管默默看着。
        - id: ch01-b49
          speaker: leach
          text: >-
            猪！猪！猪！你怎么不下来杀我？你这个杀人凶手！你做得到，我也不怕，反正没人会拦你！我宁可死掉逃出你的手，也不要活着落在你爪子里！来呀，懦夫！杀了我！杀了我！杀了我！
          emotion: angry
        - id: ch01-b50
          speaker: narrator
          text: >-
            这时，马格里奇从厨房门口钻了出来。他假装要把残羹扔下船，其实只想看拉森杀死利奇。他仰头朝拉森油腻地赔笑，却没得到半点理会，便转向利奇。
        - id: ch01-b51
          speaker: mugridge
          text: 瞧瞧你说的这些话！真吓人！
        - id: ch01-b52
          speaker: narrator
          text: >-
            利奇终于有了可以够到的发泄对象。马格里奇自从持刀伤人后，第一次没带刀就走出厨房，话音刚落便被一拳打倒。他三次爬起来想逃回去，也三次被重新打翻。
        - id: ch01-b53
          speaker: mugridge
          text: 主啊！救命！救命！快拉开他呀！你们不能把他拉开吗？
          emotion: fearful
        - id: ch01-b54
          speaker: narrator
          text: >-
            猎手们如释重负地笑了。刚才的悲剧一下缩成了闹剧。水手们也不再畏缩，纷纷挤到船尾。他们咧着嘴，拖着脚步，争着来看这个人人憎恨的伦敦佬挨揍。甚至连我心里都涌起一阵强烈的快意。我必须承认，我喜欢看利奇痛打托马斯·马格里奇。尽管这场殴打也很可怕，几乎赶得上马格里奇害约翰逊遭受的那一场，我仍然为他挨打而高兴。
        - id: ch01-b55
          speaker: narrator
          text: >-
            拉森的神情没有变化，连姿势也没变，只带着极大的好奇继续观看。他一向坚信实用的道理，此刻却像是希望从生命的活动与变化里再发现些什么。他盯着生命最疯狂的扭动，仿佛那里藏着一把钥匙，只要找到它，生命的谜便会彻底解开。甲板上，马格里奇徒劳地遮挡，又一次次想逃回舱房。他朝那里滚，朝那里爬，每次被打倒，身体还朝那个方向扑去。可拳脚来得又快又密，他像一只羽毛球般被打得四处飞跌。最后，他已经无力地躺在甲板上，仍旧遭到踢打，也没有一个人干涉。利奇原本可以杀死他，却在报够仇后收了手，转身走向船头，只留下马格里奇趴在那里，像小狗一样呜咽哀号。
        - id: ch01-b56
          speaker: narrator
          text: >-
            可这两场冲突还只是当天节目的开头。到了下午，斯莫克和亨德森也翻了脸。统舱里忽然传出一连串枪声，另外四名猎手紧接着争先恐后地逃上甲板。一股浓重、刺鼻的烟柱从敞开的舱口升起来，那正是黑火药开枪后会冒出的烟。海狼·拉森没有迟疑，迎着烟直接跳了下去。我们站在上面，很快便听见拳头落下的闷响和几个人扭打挣扎的动静。
        - id: ch01-b57
          speaker: narrator
          text: >-
            斯莫克和亨德森都中了枪，而且伤势很重。拉森先把两个人全都痛打一顿，因为他们违抗命令，还没到捕猎季便先开枪伤了自己，损失了干活的人手。打完以后，他的角色又从施暴者变成了粗野的外科医生，开始替他们动手术，包扎伤口。我在一旁做助手，看着他用器械探查子弹穿过的孔道，再把伤口一点点洗净。船上没有麻醉剂，能支撑两人的不过是一满杯烈威士忌。可他们只能咬紧牙关，把这场粗暴的手术忍到底。
        - id: ch01-b58
          speaker: narrator
          text: >-
            到第一班暮更，水手舱里的麻烦也终于彻底爆发。起因仍是那些闲言碎语和搬弄是非的告密，约翰逊正是为同一件事挨了毒打。我们只听见里面传出的声响，没有看到经过，可第二天那些人个个鼻青脸肿，已经把结果说得明明白白，水手舱里的一半人结结实实地揍了另一半。第二班暮更，大副约翰森又同瘦削的猎手拉蒂默打起来。拉蒂默长着一副美国佬的模样，只因取笑大副睡觉时发出的声音，便惹来这场架。他最后打赢了约翰森，可约翰森睡着后又在梦里不停重打那一仗，自己睡得香甜，拳脚和叫声却搅得整个统舱一夜不宁。
        - id: ch01-b59
          speaker: narrator
          text: >-
            至于我，却被噩梦压得喘不过气。这一天本身就像一场可怕的梦。暴行接着暴行，炽烈燃烧的愤怒和冷静清醒的残忍一起驱使人们相互索命。他们一心要伤害对方，叫对方残废，甚至把对方毁灭。我的神经受到强烈震动，连心智也像挨了一记重击。过去的岁月里，我几乎不知道人身上还有这样兽性的一面。我所认识的生命，只在思想和智识的世界里。我当然也领受过残酷，却只是智识上的残酷，比如查利·弗鲁塞斯尖利的讽刺，毕伯洛俱乐部那些人的冷酷警句和刻薄俏皮话，还有大学时代某些教授偶尔抛来的恶毒评论。
        - id: ch01-b60
          speaker: narrator
          text: >-
            除此以外，我什么也不知道。我从没见过人把怒火发泄在别人的肉体上，故意把皮肉打得青肿，叫鲜血流出来。对我来说，这种事陌生得不可思议，也恐怖得不可思议。一个噩梦接着一个，我躺在狭窄的铺位上翻来覆去，始终无法安睡。我想，别人叫我“娘娘腔”范韦登，原来并不是毫无缘故。直到今天，我对真实的人生竟一直无知到了这种地步。我在黑暗中苦笑起来，甚至开始觉得，海狼·拉森那套阴森而叫人畏惧的哲学，反而比我自己的信念更能解释人生。
        - id: ch01-b61
          speaker: narrator
          text: >-
            等我察觉自己的念头正滑向哪里，立刻害怕起来。周围接连不断的暴行正在改变我，使我一点点堕落。照这样下去，我心中关于生命的一切美好与光明，恐怕都会被它毁掉。我的理智说得很清楚，托马斯·马格里奇挨的那顿毒打是一桩恶事。可就算拼上性命，我也阻止不了自己的灵魂，它偏偏为此欢喜。我知道这种欢喜有多可怕。那是罪恶，的的确确是罪恶。我一面被它沉重的分量压得喘不过气，一面又控制不住自己，仍带着一种疯狂的快意，在黑暗中暗暗发笑。
        - id: ch01-b62
          speaker: narrator
          text: >-
            我已经不再是从前那个汉弗莱·范韦登。我变成了汉普，“幽灵号”上一个干杂活的舱房侍役。海狼·拉森成了我的船长，托马斯·马格里奇和其余那些野蛮的人，也成了朝夕相处的同伴。他们仿佛都由同一枚印模铸成，而如今，我也被放到了那枚印模下面。周围每发生一次暴行，那印模便朝我身上重重压下一次，把他们身上的痕迹，也一点点压进我的心里。
