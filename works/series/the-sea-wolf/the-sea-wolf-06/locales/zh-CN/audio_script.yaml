audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    mugridge:
      display_name: 托马斯·马格里奇
      tts:
        delivery: 油滑谄媚，粗俗话里带着讨好
        timbre: 尖细黏腻的成年男声
        pace: 轻快而连珠炮般
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    louis:
      display_name: 路易斯
      tts:
        delivery: 热情健谈，神秘兮兮的警告里带着爱尔兰式夸张
        timbre: 浑厚圆润的中年男声
        pace: 明快连贯，兴奋时滔滔不绝
        pitch: 中音
    johnson:
      display_name: 约翰逊
      tts:
        delivery: 正直克制，措辞郑重而坚定
        timbre: 清晰坚实的成年男声
        pace: 缓慢审慎
        pitch: 中低音
    johansen:
      display_name: 约翰森
      tts:
        delivery: 粗声粗气，服从船长时立刻收敛
        timbre: 粗哑厚重的成年男声
        pace: 急促直接
        pitch: 低音
    standish:
      display_name: 斯坦迪什
      tts:
        delivery: 强硬急躁，顾及自身利益时寸步不让
        timbre: 干涩有力的成年男声
        pace: 偏快
        pitch: 中音
    helmsman:
      display_name: 舵手
      tts:
        delivery: 谨慎简短，带着水手服从命令的习惯
        timbre: 朴实沉稳的成年男声
        pace: 平稳
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第六章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            到第二天早晨，风暴已经完全过去了。海面风平浪静，“幽灵号”只在水上轻轻摇摆。偶尔有一丝微风吹来，拉森便不停地在艉楼上巡视，两眼始终搜寻东北方的海面。他等的那股强劲信风，正该从那个方向吹来。
        - id: ch01-b02
          speaker: narrator
          text: >-
            全船的人都上了甲板，忙着整备本季捕猎要用的小艇。船上一共七条艇，一条归船长，另外六条归猎手。每条猎艇要配一名猎手、一名划艇手和一名掌舵手。回到帆船上，划艇手和掌舵手又是普通船员。猎手照规矩还要带领各班值守，不过谁都得听拉森的命令。
        - id: ch01-b03
          speaker: narrator
          text: >-
            这些事，我都一点点弄清楚了。“幽灵号”原本是私人游艇，造出来就是为了追求速度。旧金山和维多利亚两支船队都公认它跑得最快。它的船身线条和装备有多好，连我这个外行也看得出来。昨天第二短班值守时，约翰逊曾和我聊起这条船。他说得兴致勃勃，那种爱惜就像有人爱一匹骏马。可一说到这次航程，他便满心厌恶。原来拉森在捕海豹船长中名声极坏。约翰逊当初是受了“幽灵号”的吸引才签约，如今已经后悔了。
        - id: ch01-b04
          speaker: narrator
          text: >-
            约翰逊告诉我，这是一艘八十吨的双桅纵帆船，船型格外漂亮。它宽二十三英尺，长九十多英尺。船底有一条重得惊人、却没人知道确切重量的铅龙骨，所以船身很稳，又能挂起大得惊人的一片船帆。主桅从甲板到顶桅桅冠超过一百英尺，前桅连着顶桅也只矮上八到十英尺。我说出这些尺寸，是想让人明白二十二个人住的地方究竟有多小。这个漂在海上的世界，不过是一粒微尘，一点细屑。我实在想不通，人怎么敢乘着这样小、这样脆弱的东西驶进大海。
        - id: ch01-b05
          speaker: narrator
          text: >-
            拉森还出了名地敢加帆。我听猎手亨德森和来自加利福尼亚的斯坦迪什说过，两年前“幽灵号”在白令海遇上大风，拉森不肯少挂帆，结果折断了桅杆。后来换上的桅杆更粗、更重。他装好新桅杆时甚至说，自己宁可让船翻过去，也不愿再把这些木头折断。
        - id: ch01-b06
          speaker: narrator
          text: >-
            除了升任大副以后有些得意忘形的约翰森，船上每个人似乎都要解释自己怎么会上“幽灵号”。船头住舱里有一半是远洋水手，他们说自己事先不了解这条船和船长。那些了解内情的人则悄悄告诉我，船上的猎手虽然都是神枪手，却出了名地爱吵架，品行也恶劣得很，根本没有一艘正经的帆船肯收他们。
        - id: ch01-b07
          speaker: narrator
          text: >-
            我还认识了一名叫路易斯的船员。他来自新斯科舍，带爱尔兰血统，长得圆滚滚的，脸上总带着喜气。他极好交际，只要找到听众，就能一直说下去。那天下午，厨子到下面睡觉，我还在削没完没了的土豆，路易斯便进厨房来找我闲聊。他说自己签约时醉得不省人事，还一遍又一遍地保证，只要头脑清醒，做梦也不会干这种事。他每一季都出海捕海豹，已经连续干了十二年，也是旧金山和维多利亚两支船队里数一数二的掌舵手。
        - id: ch01-b08
          speaker: louis
          text: >-
            唉，小伙子，你选中了世上最坏的一条船，偏偏又不像我一样是醉着选的。捕海豹本来是水手的天堂，只要别上这条船。大副不过是头一个死人。你记着，等航程结束，还会死更多人。嘘，这话只有你、我，还有这根柱子知道。海狼·拉森是个真魔鬼。“幽灵号”落进他手里以后，一直就是一条地狱船。
        - id: ch01-b09
          speaker: louis
          text: >-
            我会不清楚吗？两年前他在函馆闹起来，开枪打了四个手下。当时我就在三百码外的“艾玛·L号”上。那一年，他还一拳打死过一个人。活活打死！那脑袋准像蛋壳一样碎了。还有库拉岛的长官和警察局长。他们都是日本绅士，带着太太来船上做客。两位小太太娇小漂亮，就像扇面上的人。可船起航时，两位丈夫却被留在了后面的舢板上，好像只是出了意外。
        - id: ch01-b10
          speaker: louis
          text: >-
            一星期以后，那两位可怜的太太才在岛的另一边下船。她们只能穿着走不了一英里就会散掉的小草鞋，翻过山走回家。你说我会不知道吗？拉森就是头野兽，是《启示录》里那头大野兽。他不会有好下场。不过，我什么都没对你说，一个字也没有。就算你们最后一个都去喂鱼，老胖子路易斯也得活到航程结束。
        - id: ch01-b11
          speaker: narrator
          text: >-
            过了一会儿，他又从鼻子里哼了一声。
        - id: ch01-b12
          speaker: louis
          text: >-
            海狼·拉森！你听听这名字。狼，他就是狼。别的人也许心黑，他却根本没有心。他只是一头狼。这个名字不是再合适不过了吗？
        - id: ch01-b13
          speaker: humphrey
          text: >-
            可大家既然都知道他的为人，他怎么还招得到船员？
        - id: ch01-b14
          speaker: louis
          text: >-
            天上地下，还有海上，什么事找不到人干？我若不是签约时醉得像头猪，怎么会站在这里？有些人没资格跟好人一起做事，比如那些猎手。还有些人根本不知情，就是船头那群可怜的远洋水手。他们迟早会弄明白，还会后悔自己为什么生下来。我要不是还得替老胖子路易斯操心，真想为他们哭一场。可别忘了，我半个字也没说过。
        - id: ch01-b15
          speaker: louis
          text: >-
            那些猎手才是真正的恶棍。你等着他们开始胡闹，到处打架吧，拉森自会收拾他们。他能让那几颗腐烂的黑心知道什么叫害怕上帝。瞧我的猎手霍纳吧。人家叫他“杰克”霍纳。他安静随和，说起话来轻声细气，简直像个姑娘，仿佛黄油放进嘴里也不会化。可他去年不是杀了自己的掌舵手吗？外头说那是不幸的意外，可我在横滨见过那名划艇手，他把实情告诉了我。
        - id: ch01-b16
          speaker: louis
          text: >-
            再说斯莫克，那个黑心的小魔鬼。他到俄国的铜岛偷猎，被抓进西伯利亚盐矿三年，和同伴手脚都锁在一起。后来两人吵了起来，还是动了手。结果呢，斯莫克用吊桶把同伴送到了矿井顶上，一回送一块。今天送一条腿，明天送一只胳膊，后天再送脑袋，就这么送完了。
        - id: ch01-b17
          speaker: humphrey
          text: >-
            这不可能是真的！
          emotion: surprised
        - id: ch01-b18
          speaker: louis
          text: >-
            什么不可能？我什么也没讲。我又聋又哑。看在你母亲的分上，你也该又聋又哑。我的嘴只会说他们和拉森的好话。愿上帝诅咒拉森的灵魂，让他在炼狱里烂上一万年，再掉进最末、最深的那层地狱！
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: >-
            约翰逊就是我刚上船时替我擦洗身体、把皮肤搓破的那个人。无论船头还是船尾，这么多人里，他的性情最清楚明白，没有一点含糊。他直率，有男子气概，又十分谦逊，所以有时会被错当成胆怯。可他一点也不胆怯。他有勇气守住自己的信念，也有身为男子汉的笃定。正因如此，我们刚认识时，拉森把他的姓叫成“永森”，他马上提出了纠正。路易斯说到他，又作出了一番断语和预言。
        - id: ch01-b20
          speaker: louis
          text: >-
            船头那个北欧佬约翰逊是个好汉，也是那里最棒的水手。他还是我的划艇手。可他迟早会和拉森起冲突，就像火星总要往上飞。老路易斯看得出来。这场风暴已经在天上聚起来了。我把他当亲兄弟一样劝，可他不懂得藏起真心，做点假样子。事情不合意，他就当面抱怨。总会有人跑去向海狼告密。
        - id: ch01-b21
          speaker: louis
          text: >-
            海狼有力量，而狼最恨别人的力量。他会看见约翰逊不肯低头。那个人挨了骂、挨了打，也绝不会回一句“是，先生，多谢您，先生”。事情就要来了！到时候上帝才知道，我去哪里另找一个划艇手。老头子叫他“永森”，他竟回答：“先生，我姓约翰逊。”还把名字一个字母一个字母拼出来。你真该看看老头子的脸。我以为他当场就会挥拳。他那次忍住了，迟早还会动手。最后不是他打碎约翰逊的心，就是我这些年在海船上白看了人。
        - id: ch01-b22
          speaker: narrator
          text: >-
            马格里奇也变得越来越难忍。我对他说话，句句都得称先生，还得用敬语。拉森似乎很喜欢他。船长和厨子这样亲近，我从没听说过。拉森有两三次探头进厨房，和和气气地拿他取笑。那天下午，他还站在艉楼前沿，足足跟马格里奇聊了一刻钟。马格里奇回来以后满脸油光，一边干活，一边用尖细的假嗓哼唱街头小贩的歌。那声音既跑调又刺耳。
        - id: ch01-b23
          speaker: mugridge
          text: >-
            我跟当官的从来都处得好。我知道怎么叫他们看得起我。上一任船长就是这样。我没事就去他的住舱，陪他聊两句，再亲亲热热喝一杯。他跟我说：“马格里奇，你入错行了。”我问他怎么回事。他说：“你天生就该做绅士，不该为了吃饭干活。”汉普，上帝要是没听见这话，就让我死掉！我那时就坐在他的住舱里，舒舒服服地抽他的雪茄，喝他的朗姆酒。
        - id: ch01-b24
          speaker: narrator
          text: >-
            他这些话快把我逼疯了。我从没如此痛恨过一个人的声音。那油滑又带着暗示的腔调、油腻的笑容和骇人的自负，一点点磨着我的神经，有时叫我浑身发抖。他无疑是我见过最恶心、最可憎的人。他做饭时究竟有多脏，简直无从形容。可全船吃的每一样东西都要过他的手。我只能万分小心，从那些乱七八糟的菜里挑出相对不那么脏的东西吃。
        - id: ch01-b25
          speaker: narrator
          text: >-
            我的双手也一直受罪。它们从没干过活，指甲很快变色发黑，皮肤纹理里塞满污垢，连板刷也刷不掉。水疱一个接一个冒出来，仿佛排着永远走不完的队，每一个都疼得厉害。前臂还有一大片严重的烫伤。那是船身摇晃时，我脚下失去平衡，一头撞上厨房炉灶留下的。膝盖也没有一点好转。肿还没消，膝盖骨依旧翘在一边。从早到晚拖着这条腿四处奔忙，它又怎么会好？我真正需要的是休息。
        - id: ch01-b26
          speaker: narrator
          text: >-
            休息！我活到那时，才明白这个词是什么意思。原来我休息了一辈子，自己却不知道。如今只要能安安静静坐上半个钟头，什么也不做，连想也不想，便是世上最舒服的事。可这番经历也像一道忽然照进来的光，让我第一次懂得劳动者怎样生活。从今往后，我会真正体谅他们。过去我根本想不到，干活竟会这样可怕。
        - id: ch01-b27
          speaker: narrator
          text: >-
            每天从早晨五点半到夜里十点，我都是所有人的奴隶。只有第二短班快结束时，偶尔能偷到一点属于自己的时间。哪怕只停一分钟，看看阳光照亮的海面，或看看水手爬上去照料斜桁顶帆，再不然看他沿着船首斜桅出去，马格里奇那个可恨的声音也一定会追来。
        - id: ch01-b28
          speaker: mugridge
          text: >-
            喂，汉普，别想偷懒。我一直盯着你呢。
        - id: ch01-b29
          speaker: narrator
          text: >-
            猎手统舱里的坏脾气也像火一样蹿了起来。大家都在传，斯莫克和亨德森打了一架。亨德森是猎手里最好相处的一个，性子慢，很难被激怒。可斯莫克一只眼睛青肿发黑，晚饭时脸色格外凶狠，看来亨德森终究还是被他惹火了。
        - id: ch01-b30
          speaker: narrator
          text: >-
            晚饭前不久，又发生了一件残酷的事。船员中有个名叫哈里森的新手。他是个动作笨拙的乡下小伙子，大概为了冒险才第一次出海。那天微风忽左忽右，“幽灵号”不断抢风换舷。每次船帆从一边转到另一边，都要派人爬上去移动前桅斜桁顶帆。哈里森在上面时，帆脚索卡进了斜桁末端的滑轮。
        - id: ch01-b31
          speaker: narrator
          text: >-
            要解开绳索，本来有两种办法。可以降下前帆，这样容易，也没有危险。还可以沿帆峰升降索爬到斜桁最外端，这就极其凶险。约翰森偏偏命令哈里森走第二条路。人人都看得出小伙子害怕，他也完全有理由害怕。甲板在八十英尺下方，他只能把身体交给那些细细的、不断抽动的绳索。如果有一股稳定的风，危险还小一点。可“幽灵号”正空荡荡地随着长涌来回摇摆。每摇一下，船帆便拍打着轰响，升降索时而松垂，时而猛然绷紧，随时能像鞭梢弹飞苍蝇一样把人甩出去。
        - id: ch01-b32
          speaker: narrator
          text: >-
            哈里森听懂了命令，却迟迟不动。这大概是他第一次爬到船的高处。约翰森已经染上了拉森那股专横劲儿，立刻朝他大骂起来。
        - id: ch01-b33
          speaker: wolf_larsen
          text: >-
            行了，约翰森。这条船上，骂人的事归我。需要你帮忙时，我会叫你。
        - id: ch01-b34
          speaker: johansen
          text: >-
            是，先生。
        - id: ch01-b35
          speaker: narrator
          text: >-
            哈里森终于开始沿着升降索向外爬。我站在厨房门口，看见他全身颤抖，像发了疟疾。他每次只挪一英寸，慢得出奇，也小心得出奇。蓝天映着他的轮廓，他就像一只巨大的蜘蛛，在蛛网细细的纹路上爬行。
        - id: ch01-b36
          speaker: narrator
          text: >-
            前帆的斜桁高高翘着，这一路还得稍稍向上。升降索穿过斜桁和桅杆上的好几个滑轮，他的手脚都有不同的地方攀附。真正的麻烦是风太弱，又不稳定，不能始终把帆吹满。他爬到半途，“幽灵号”先慢慢倒向迎风面，又荡回两道海浪之间的低谷。哈里森不敢再走，只能拼命抓紧。从八十英尺下方，我仍看得见他的肌肉痛苦地绷着。他抓住的不只是绳索，而是自己的性命。
        - id: ch01-b37
          speaker: narrator
          text: >-
            帆瘪了，斜桁荡向船身中央，升降索也松垂下去，在哈里森的重量下弯成弧形。紧接着，斜桁猛然甩向一侧。巨帆像大炮一样轰响，三排缩帆索打在帆布上，仿佛一排枪同时开火。哈里森紧抓绳索，在半空飞快荡过一段弧线，又骤然停住。升降索一下绷紧，像鞭子狠狠抽了一记。
        - id: ch01-b38
          speaker: narrator
          text: >-
            他的一只手被扯开，另一只手多撑了一瞬，也松掉了。身体头朝下栽去，好在双腿不知怎么勾住了绳索。他就这样倒挂着。慌忙挣扎一番，他终于又用双手够到了升降索，可过了许久才重新摆正身体。可怜的哈里森只能悬在那里。
        - id: ch01-b39
          speaker: wolf_larsen
          text: >-
            我敢打赌，他这会儿已经没胃口吃晚饭了。约翰森，别站在下面！看好了，他就要掉下来了！
        - id: ch01-b40
          speaker: narrator
          text: >-
            哈里森真的像晕船一样吐了。很长一段时间，他只敢抱住那个随时会要命的落脚处，一动也不动。约翰森还在不停催他完成差事。
        - id: ch01-b41
          speaker: johnson
          text: >-
            这太可耻了。那个小伙子肯干。只要给他机会，他会学会。可现在这简直是……谋杀。
          emotion: angry
        - id: ch01-b42
          speaker: narrator
          text: >-
            约翰逊站在我附近的主桅索具旁，用他那缓慢又准确的英语低声咆哮。
        - id: ch01-b43
          speaker: louis
          text: >-
            嘘！看在你母亲的分上，把嘴闭紧！
          emotion: fearful
        - id: ch01-b44
          speaker: narrator
          text: >-
            可约翰逊仍盯着高处，嘴里抱怨个不停。猎手斯坦迪什也找上了拉森。
        - id: ch01-b45
          speaker: standish
          text: >-
            那是我的划艇手，我可不想把他丢了。
        - id: ch01-b46
          speaker: wolf_larsen
          text: >-
            他上了你的小艇，才是你的划艇手。他在我的大船上，就是我的水手。我爱把他怎么样，就他妈怎么样。
        - id: ch01-b47
          speaker: standish
          text: >-
            可这也不能算理由——
        - id: ch01-b48
          speaker: wolf_larsen
          text: >-
            够了，船照旧走。我已经把规矩说清楚，这件事就到这里。那个人归我。我若愿意，把他煮成汤喝了也行。
        - id: ch01-b49
          speaker: narrator
          text: >-
            斯坦迪什眼里闪过怒光，却还是转身走进统舱升降口，站在那里向上看。此刻全船的人都在甲板上，所有眼睛都盯着高处。那里有一条人命正在和死亡扭打。这些人凭着劳作中的组织等级掌控别人的生死，冷酷得让我震惊。我远离尘世纷扰太久，从不知道世上的工作竟是这样完成的。生命在我心中一向有一种特别的神圣，可在这里，它什么也不算，不过是商业算术里的一个零。
        - id: ch01-b50
          speaker: narrator
          text: >-
            普通水手倒还有同情心，约翰逊就是证明。漠不关心的是那些主子，是猎手和船长。就连斯坦迪什出声，也只是怕失去自己的划艇手。若上面吊着的是别人的划艇手，他大概也会和其他人一样，只把这场面当成消遣。
        - id: ch01-b51
          speaker: narrator
          text: >-
            约翰森又骂又催，足足花了十分钟，才逼得哈里森继续前进。他总算爬到斜桁末端，跨坐在木杆上，手脚都有了更稳的依靠。他解开帆脚索，回去时还可以沿升降索稍稍向下爬。可他已经吓破了胆。眼下的地方并不安全，他却宁可留在那里，也不敢再上更加危险的绳索。
        - id: ch01-b52
          speaker: narrator
          text: >-
            他先看看那条横在半空、非走不可的归路，又低头看看下面的甲板。双眼瞪得又大又直，全身剧烈颤抖。我从没在人脸上见过这么鲜明的恐惧。约翰森一次次叫他下来，可全是白费力气。他随时可能被斜桁弹出去，却已经怕得无法动弹。拉森只顾和斯莫克一边谈话，一边来回踱步，根本不再看他，倒忽然冲舵手喝了一声。
        - id: ch01-b53
          speaker: wolf_larsen
          text: >-
            伙计，你偏离航向了！给我小心点，除非你想自找麻烦！
          emotion: angry
        - id: ch01-b54
          speaker: helmsman
          text: >-
            是，先生。
        - id: ch01-b55
          speaker: narrator
          text: >-
            舵手把舵轮转回两根轮辐。刚才他故意让船偏离几个罗经点，好让仅有的一点风把前帆吹满，替哈里森稳住斜桁。他宁可冒险惹怒拉森，也想帮帮那个不幸的小伙子。
        - id: ch01-b56
          speaker: narrator
          text: >-
            时间一点点过去，我被那场悬在空中的危险折磨得几乎受不了。马格里奇却觉得十分可笑，不停从厨房探出头，说些自以为有趣的话。我对他的恨越来越大，最后简直像独眼巨人一样庞大。平生第一次，我想杀死一个人。作家把这种感觉叫作“杀红了眼”。一般说来，生命对我仍是神圣的，可马格里奇这条具体的性命，在我心里已经一点也不神圣了。
        - id: ch01-b57
          speaker: narrator
          text: >-
            意识到自己真的杀红了眼，我又害怕起来。难道身边的野蛮也正在污染我吗？哪怕面对最骇人的罪行，我也一直认为死刑既不公正，也不正义。
        - id: ch01-b58
          speaker: narrator
          text: >-
            半小时过去，约翰逊似乎和路易斯争执起来。他甩开路易斯拉住他的手，穿过甲板，跃上前桅索具，开始向上爬。拉森一眼就发现了他。
        - id: ch01-b59
          speaker: wolf_larsen
          text: >-
            喂，你想干什么？
        - id: ch01-b60
          speaker: narrator
          text: >-
            约翰逊停下来，直视着船长，慢慢开了口。
        - id: ch01-b61
          speaker: johnson
          text: >-
            我要把那个小伙子救下来。
        - id: ch01-b62
          speaker: wolf_larsen
          text: >-
            你给我从索具上下来，动作他妈快点！听见没有？下来！
          emotion: angry
        - id: ch01-b63
          speaker: narrator
          text: >-
            约翰逊迟疑了。可他服从船长已有许多年，那股习惯最终压倒了他。他阴沉着脸回到甲板，朝船头走去。
        - id: ch01-b64
          speaker: narrator
          text: >-
            五点半，我下到住舱摆餐桌，根本不知道自己在做什么。我的眼前和脑中只有哈里森惨白发抖的模样。他紧紧抱着乱甩的斜桁，看上去又可怕，又像一只虫子那样滑稽。六点，我伺候大家吃晚饭，去甲板上的厨房取食物时，他仍在原处。餐桌上却谈着别的事情，仿佛谁也不在意那条被无端推入险境的生命。过一会儿，我再次去厨房，却欣喜地看见哈里森已经从索具旁下来，正虚弱地踉跄着走向船头住舱的舱口。他终于鼓起勇气爬了下来。
        - id: ch01-b65
          speaker: narrator
          text: >-
            这件事还没完全结束。我洗餐具时，拉森在住舱里找我说话。
        - id: ch01-b66
          speaker: wolf_larsen
          text: >-
            你下午看起来很不舒服。出了什么事？
        - id: ch01-b67
          speaker: narrator
          text: >-
            他明明知道我为什么难受到几乎和哈里森一样，只是故意要我说出来。
        - id: ch01-b68
          speaker: humphrey
          text: >-
            因为你们那样残酷地折磨他。
        - id: ch01-b69
          speaker: narrator
          text: >-
            拉森短促地笑了。
        - id: ch01-b70
          speaker: wolf_larsen
          text: >-
            大概就像晕船吧。有些人会犯，有些人不会。
        - id: ch01-b71
          speaker: humphrey
          text: >-
            根本不是一回事。
        - id: ch01-b72
          speaker: wolf_larsen
          text: >-
            就是一回事。大地上到处都是残暴，就像海面一直在波动。有人看见残暴会恶心，有人遇到波浪会恶心。区别只有这一点。
        - id: ch01-b73
          speaker: humphrey
          text: >-
            可你拿人的性命取乐。难道在你眼里，生命一点价值也没有？
        - id: ch01-b74
          speaker: wolf_larsen
          text: >-
            价值？哪一种价值？你拿什么衡量？又由谁来评价？
        - id: ch01-b75
          speaker: narrator
          text: >-
            他目光稳定，一动不动，眼中却像藏着一丝冷笑。
        - id: ch01-b76
          speaker: humphrey
          text: >-
            我来评价。
        - id: ch01-b77
          speaker: wolf_larsen
          text: >-
            那么，别人的一条命对你值多少？来，告诉我，它到底值多少？
        - id: ch01-b78
          speaker: narrator
          text: >-
            生命的价值？我怎么给它标出一个实在的价钱？我一向很会表达，可一面对拉森，话便不够用了。后来我明白，一部分原因在于他本人强大的性格，更大的原因则是他的眼光与我完全不同。我遇见过其他唯物主义者，和他们总有一点共同之处，可以从那里谈起。和拉森却没有任何共同之处，所以连第一句话都找不到落脚的地方。
        - id: ch01-b79
          speaker: narrator
          text: >-
            也许，他思想中那种原始的简单明了同样叫人难以招架。他每次都直插问题的中心，剥掉所有多余枝节，语气又像已经作出最终判决。我在他面前仿佛落进深水，脚下没有一点依靠。生命的价值？面对他突然提出的问题，我怎么答得出来？我一直把生命的神圣当作不需要证明的公理，也从未怀疑生命本身具有价值这个尽人皆知的真理。可他一旦向这条真理发问，我便答不上来。
        - id: ch01-b80
          speaker: wolf_larsen
          text: >-
            昨天我们已经谈过。生命是一团发酵物，是一种像酵母的东西。它为了活着，就去吞吃别的生命。所谓活着，只是猪一样的贪欲赢了。要是供求的道理有用，生命便是世上最便宜的东西。水、土地和空气都有尽头，急着出生的生命却无穷无尽。大自然挥霍起来从不手软。看看鱼产下的几百万颗卵。再看看你我。我们身体里都藏着产生几百万条生命的可能。
        - id: ch01-b81
          speaker: wolf_larsen
          text: >-
            只要有足够的时间和机会，把体内每一点尚未出生的生命都利用起来，我们便能成为无数国民的父亲，让整个大陆住满人。生命？呸！它没有价值。天下所有便宜东西里，它最便宜，到处求别人收留。只容得下一条命的地方，大自然偏偏撒下一千条。生命吃掉生命，最后只留下最强壮、也最贪婪的那一条。
        - id: ch01-b82
          speaker: humphrey
          text: >-
            你读过达尔文，可你把他的意思弄错了。生存斗争并没有准许你随意毁掉生命。
        - id: ch01-b83
          speaker: narrator
          text: >-
            他耸了耸肩。
        - id: ch01-b84
          speaker: wolf_larsen
          text: >-
            你说的其实只是人命。走兽、飞禽和鱼类，你毁掉的并不比我或别人少。人的生命也没有任何不同。你只是感觉它不同，又以为自己已经想出了理由。这种生命既便宜又没有价值，我为什么还要吝惜？海上的船不够所有水手去驾驶，工厂和机器也不够所有工人去做工。
        - id: ch01-b85
          speaker: wolf_larsen
          text: >-
            你住在陆地上，应该清楚。你们把穷人塞进城市的贫民窟，让饥荒和瘟疫吞掉他们。即使这样，还是有数不清的穷人因为得不到一块面包、一口肉而死。肉本身也是毁掉的生命。穷人多得让你们不知道怎么办。你见过伦敦码头工人为了抢一份工作，像野兽一样厮打吗？
        - id: ch01-b86
          speaker: narrator
          text: >-
            他朝升降梯走去，又回过头，留下最后一番话。
        - id: ch01-b87
          speaker: wolf_larsen
          text: >-
            生命唯一的价值，是它自己给自己定的。这个价格当然估得太高，因为生命不得不偏袒自己。就拿我派到高处的哈里森来说。他拼命抓着，好像自己是比钻石和红宝石还贵重的宝贝。对你来说，他是这样的宝贝吗？不是。对我来说呢？更不是。只有他自己这样想。可我不接受他的估价。他把自己看得高得可笑。世上还有无数生命排着队，等着出生呢。
        - id: ch01-b88
          speaker: wolf_larsen
          text: >-
            他若从高处掉下来，脑浆像蜂巢里的蜜一样滴在甲板上，整个世界也没有任何损失。他对世界一文不值，因为生命的供应实在太多了。只有他自己觉得自己有价值。可等他死掉，他不会知道自己已经失去自己。所以连这份看似珍贵的价值也是假的。
        - id: ch01-b89
          speaker: wolf_larsen
          text: >-
            只有哈里森自己把自己看得比钻石和红宝石更贵重。等那些钻石和红宝石摊在甲板上，被一桶海水冲走，他却连它们不见了都不知道。他什么也没有失去，因为失去自己以后，他也失去了知道损失的能力。你还不明白吗？现在，你还有什么可说？
        - id: ch01-b90
          speaker: humphrey
          text: >-
            我只能说，你至少从头到尾没有自相矛盾。
        - id: ch01-b91
          speaker: narrator
          text: >-
            说完，我继续洗起餐具。
