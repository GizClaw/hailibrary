  chapters:
    - id: ch01
      title: CHAPTER VI
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            By the next morning, the storm had blown itself out. The Ghost rolled gently on a calm sea, with hardly a breath of wind. Now and then a faint breeze passed over us. Wolf Larsen kept pacing the poop deck, always searching the water to the northeast. The great trade wind had to come from there.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Every man was on deck, getting the boats ready for the hunting season. We carried seven boats altogether. One was the captain's dinghy, and the hunters would use the other six. Each hunting boat took three men: a hunter, a boat-puller, and a boat-steerer. Aboard the schooner, the pullers and steerers served as the crew. The hunters were supposed to command the watches too, though every one of them answered to Wolf Larsen.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I had learned all that, and much more besides. The Ghost was said to be the fastest schooner in both the San Francisco and Victoria fleets. She had once been a private yacht, built especially for speed. I knew almost nothing about ships, but her clean shape and fine fittings spoke for themselves. Johnson had told me about her during a short talk in the second dogwatch the day before. He spoke with real enthusiasm and with the same love some men have for a fine horse.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Yet Johnson hated the prospect before us. Wolf Larsen had an ugly name among the sealing captains, and Johnson was already sorry he had signed on. It was the Ghost herself that had tempted him. She was an eighty-ton schooner, beautifully made, twenty-three feet across and a little more than ninety feet long. No one seemed to know the exact weight of her immense lead keel. It steadied her beneath the water, while her masts carried a vast spread of canvas above. The maintopmast rose more than a hundred feet above the deck. The foremast, with its topmast, stood only eight or ten feet shorter.
        - id: ch01-b05
          speaker: narrator
          text: >-
            I give you those measurements so you can imagine the size of the little floating world that held twenty-two men. It truly was a very little world, no more than a mote or a speck upon the sea. I could only wonder that men dared to leave the land and cross the ocean in anything so small and fragile.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Wolf Larsen was famous for carrying too much sail. I overheard Henderson discussing it with Standish, a hunter from California. Two years earlier, Wolf had stripped the Ghost of her masts in a gale on the Bering Sea. The new ones were stronger and heavier in every way. When they were fitted, he was said to have declared that he would rather turn the schooner over than lose her sticks again.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Almost every man aboard had an excuse for being there. Only Johansen seemed pleased, and his promotion had gone to his head. Half the sailors forward had worked on deep-water ships and claimed they knew nothing about either the Ghost or her captain before they signed. Men who did know whispered that the hunters were excellent shots. But they were also known as such quarrelsome rascals that no decent schooner would take them.
        - id: ch01-b08
          speaker: narrator
          text: >-
            I had also met Louis, one of the crew. He was a round, cheerful-faced Irishman from Nova Scotia, friendly and ready to talk as long as anyone would listen. That afternoon, while Mugridge slept below and I peeled the endless potatoes, Louis came into the galley for a yarn. His excuse for signing on was simple. He had been drunk. Sober, he assured me again and again, he would never have dreamed of it. Louis had hunted seals every season for twelve years. In all the San Francisco and Victoria fleets, only two or three boat-steerers were thought to be his equal.
        - id: ch01-b09
          speaker: louis
          text: >-
            Ah, my boy, ye couldn't have picked a worse schooner, and ye weren't even drunk like I was. Sealing can be a sailor's paradise, but not on this ship. The mate was only the first. Mark me, there'll be more dead men before this voyage is through.
        - id: ch01-b10
          speaker: louis
          text: >-
            Hush now. This is between you, me, and that stanchion. Wolf Larsen is a proper devil, and the Ghost will be the hell-ship she's always been since he took her. Don't I know it? Two years ago in Hakodate, he quarreled with his men and shot four of them. I was lying aboard the Emma L., less than three hundred yards away.
        - id: ch01-b11
          speaker: louis
          text: >-
            That same year he killed another man with one blow of his fist. Killed him dead. His head must have broken like an eggshell. Then there were the governor of Kura Island and the chief of police. Japanese gentlemen they were, and they came aboard the Ghost with their wives as Wolf's guests. The women were wee, pretty little things, like the figures painted on fans.
        - id: ch01-b12
          speaker: louis
          text: >-
            When Wolf got under way, somehow the fond husbands were left behind in their sampan, as if it had happened by accident. A week later, their poor wives were put ashore on the far side of the island. They had nothing ahead of them but a walk home across the mountains in tiny straw sandals that wouldn't hold together for a mile. Don't I know the beast? He's the great beast from Revelation, and he'll never come to a good end.
        - id: ch01-b13
          speaker: louis
          text: >-
            But I've told ye nothing, mind. Not one whispered word. Old fat Louis means to live through this voyage, even if every last mother's son of ye goes to the fishes.
        - id: ch01-b14
          speaker: narrator
          text: >-
            A moment later, he snorted at the captain's name.
        - id: ch01-b15
          speaker: louis
          text: >-
            Wolf Larsen! Listen to that name. Wolf is exactly what he is. Some men are black-hearted, but he has no heart at all. He's only wolf. Could any man be better named?
        - id: ch01-b16
          speaker: narrator
          text: >-
            I asked how a man so well known for cruelty could still find sailors willing to join him.
        - id: ch01-b17
          speaker: louis
          text: >-
            And how do ye get men to do anything on God's earth or sea? Look at me. I'm here because I was drunk as a pig when I signed my name. Some can't sail with better men, like those hunters. Others don't know any better, like the poor deep-water sailors forward. They'll learn, and they'll curse the day they were born.
        - id: ch01-b18
          speaker: louis
          text: >-
            I could weep for the poor creatures, if I weren't thinking of old fat Louis and the troubles waiting for him. But remember, I haven't whispered a thing to ye. Not a whisper.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Louis had far too many words in him to stop there. He burst out again about the hunters.
        - id: ch01-b20
          speaker: louis
          text: >-
            Those hunters are wicked boys. Wait till they start their tricks and fighting. Wolf's the man who'll settle them. He'll put the fear of God into their rotten hearts. Take my hunter, Horner. They call him Jock. He's so quiet and soft-spoken ye'd think butter wouldn't melt in his mouth. But didn't he kill his boat-steerer last year? They called it an accident. I met the boat-puller in Yokohama, though, and he told me the truth.
        - id: ch01-b21
          speaker: louis
          text: >-
            Then there's Smoke, that little black devil. The Russians kept him three years in the Siberian salt mines for poaching on Copper Island, one of their preserves. He was chained hand and foot to his mate. They quarreled somehow, and Smoke sent the other fellow up the mine in buckets, one piece at a time. A leg one day, an arm the next, then the head, and so on.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Horror overcame me, and I cried out that he could not mean it.
        - id: ch01-b23
          speaker: louis
          emotion: angry
          text: >-
            Mean what? I've said nothing at all. I'm deaf and dumb, and ye should be too, for your mother's sake. I've never opened my lips except to praise them and him. God curse Wolf Larsen's soul. May he rot in purgatory ten thousand years, then sink to the last and deepest hell of all!
        - id: ch01-b24
          speaker: narrator
          text: >-
            Johnson, the sailor who had rubbed my skin raw when I first came aboard, was the most straightforward man on the ship. His manliness was softened by a modest manner that might look like shyness, but he was not timid. He had the courage to stand by what he believed. That was why, when Wolf Larsen called him Yonson, he insisted on his proper name. Louis now gave me both his judgment of Johnson and his prophecy.
        - id: ch01-b25
          speaker: louis
          text: >-
            Johnson's a fine fellow, even if he is a squarehead. He's the best sailor in the forecastle and he's my boat-puller. But he'll run into trouble with Wolf as surely as sparks fly upward. I know it. I can see the storm gathering in the sky already. I've talked to him like a brother, but he doesn't understand the wisdom of hiding his light or flying false colors.
        - id: ch01-b26
          speaker: louis
          text: >-
            When something's wrong, Johnson says so. Some telltale will always carry his words aft. Wolf is strong, and a wolf hates strength in another man. That's what he'll see in Johnson. The lad won't bend his knee and thank the captain kindly for a curse or a blow. Oh, the trouble's coming, and God knows where I'll find another boat-puller!
        - id: ch01-b27
          speaker: louis
          text: >-
            When the old man called him Yonson, what did the fool say? “My name is Johnson, sir.” Then he spelled every letter. Ye should have seen Wolf's face. I thought he'd strike him there and then. He didn't, but he will. He'll break that squarehead's heart, or I know nothing about men on ships.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Thomas Mugridge was growing unbearable. I had to call him Mister and Sir every time I spoke. Wolf Larsen seemed to have taken a liking to him, which was a strange thing for any captain to show a cook. Two or three times Wolf put his head into the galley and joked with him. That afternoon, they even talked beside the poop for fifteen minutes. Mugridge returned to his work shining with greasy pride, humming street songs in a shrill, tuneless voice.
        - id: ch01-b29
          speaker: mugridge
          text: >-
            I always get on with officers. I know how to make myself appreciated. My last skipper used to have me down to his cabin for a friendly chat and a glass. “Mugridge,” he told me, “you missed your calling.” So I asked him what he meant. “You ought to have been born a gentleman,” he said, “and never worked for your living.” Strike me dead, Hump, those were his very words. There I sat in his own cabin, comfortable as could be, smoking his cigars and drinking his rum.
        - id: ch01-b30
          speaker: narrator
          text: >-
            His chatter drove me nearly mad. No voice had ever filled me with such hatred. The oily tone, the greasy smile, and his enormous vanity grated on me until I sometimes trembled. He was the most disgusting and hateful man I had ever met. His cooking was filthy beyond description. Since everyone aboard had to eat whatever he made, I studied each meal and chose carefully among the least dirty of his dishes.
        - id: ch01-b31
          speaker: narrator
          text: >-
            My hands suffered too because they had never been used to work. The nails had turned dark and black, and dirt lay in deep lines through the skin where even a scrubbing brush could not reach it. One painful blister followed another without end. I had also burned my forearm badly when a roll of the ship cost me my balance and threw me against the galley stove. My knee was no better. It remained swollen, with the kneecap still turned on edge, and limping on it from morning until night gave it no chance to heal.
        - id: ch01-b32
          speaker: narrator
          text: >-
            I needed rest. Until then, I had never understood the word. I had rested all my life without knowing it. Now, half an hour of sitting still, doing nothing and thinking of nothing, would have been perfect happiness. It was also a revelation. For the first time, I began to understand the lives of working people. I had never dreamed that labor could be so terrible. From half past five in the morning until ten at night, I served everyone, with no time of my own except a moment I might steal near the end of the second dogwatch.
        - id: ch01-b33
          speaker: narrator
          text: >-
            If I paused to watch sunlight sparkle on the water, or looked at a sailor climbing toward the topsails or running out along the bowsprit, Mugridge's hateful voice found me at once.
        - id: ch01-b34
          speaker: mugridge
          emotion: angry
          text: >-
            Here, Hump! No idling. I've got my eye on you.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Bad tempers were rising in the steerage. The story went around that Smoke and Henderson had fought. Henderson seemed the best of the hunters, slow-moving and hard to provoke. Yet something had provoked him. Smoke came to supper with one eye bruised and dark, and he looked especially vicious.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Just before supper, I witnessed something cruel that showed how hard these men had become. Harrison was the only green hand among the crew, a clumsy-looking country boy on his first voyage. I imagined that the hope of adventure had mastered him and brought him to sea. In the faint and shifting wind, the schooner had to tack again and again. Each time, the sails passed from one side of the ship to the other. Then a man had to climb aloft and shift the fore-gaff-topsail across as well.
        - id: ch01-b37
          speaker: narrator
          text: >-
            While Harrison was above, the sheet caught in the block it ran through at the outer end of the gaff. There were two ways to free it. They could lower the foresail, which was fairly easy and put no man in danger. Or a man could crawl out along the peak halyards all the way to the end of the gaff itself. That was an extremely dangerous thing to attempt.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Johansen ordered Harrison onto the halyards. Everyone could see that the boy was afraid, and no wonder. He was eighty feet above the deck, being told to trust himself to thin, jerking ropes. In a steady breeze, the climb would have been less dangerous because the full sail would have held the ropes firm. But the Ghost rolled emptily in a long sea. At every roll, the canvas flapped and boomed. The halyards sagged, then jerked tight again. They could flick a man away as easily as a fly from a whip.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Harrison heard the order and understood it, but he hesitated. It may have been his first time aloft. Johansen had caught Wolf Larsen's habit of command, and he poured curses and abuse upon the boy.
        - id: ch01-b40
          speaker: wolf_larsen
          text: >-
            That's enough, Johansen. I do the swearing on this ship. If I want your help, I'll ask for it.
        - id: ch01-b41
          speaker: johansen
          text: >-
            Yes, sir.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Johansen submitted at once. Meanwhile, Harrison had begun crawling outward. From the galley door, I watched every limb shake as if he had a fever. He moved one cautious inch at a time. Against the clear blue sky, he looked like a huge spider creeping over the threads of its web.
        - id: ch01-b43
          speaker: narrator
          text: >-
            The climb sloped slightly upward because the foresail stood high. The halyards ran through several blocks on the mast and gaff, giving him separate holds for his hands and feet. The danger came from the weak, uncertain wind, which could not keep the sail filled. Halfway out, Harrison stopped when the Ghost rolled far to windward, then rolled back into the hollow between two swells. He gripped the ropes for his life, and even from eighty feet below I could see the terrible strain in his muscles.
        - id: ch01-b44
          speaker: narrator
          text: >-
            The sail emptied. The gaff swung toward the middle of the ship, and the halyards sagged beneath Harrison's weight. It all happened in an instant. The gaff whipped sideways with terrible speed. The great sail went off like a cannon, while three rows of reef points rattled against the canvas like a volley of rifles. Still clinging on, Harrison flew dizzily through the air. His flight stopped just as suddenly when the ropes snapped tight. It was like the crack of a whip. The shock tore one hand loose. The other held for one desperate moment, then slipped too.
        - id: ch01-b45
          speaker: narrator
          text: >-
            His body dropped, but somehow his legs caught the ropes. He hung upside down. With one quick effort, he reached the halyards again. It took him a long time to pull himself back into place, and there he remained, a pitiful figure high above us.
        - id: ch01-b46
          speaker: wolf_larsen
          text: >-
            I'll wager he won't want any supper. Get out from under him, Johansen. Look sharp. Here he comes!
        - id: ch01-b47
          speaker: narrator
          text: >-
            Harrison was violently sick, just as a seasick man would be. For a long while he clung to that uncertain perch and made no effort to move. Johansen kept driving him brutally toward the end of the gaff.
        - id: ch01-b48
          speaker: johnson
          emotion: angry
          text: >-
            It is shameful. The boy is willing. Give him a chance and he will learn. But this is... murder.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Johnson spoke slowly, searching for the exact English word before he reached his judgment. He stood near me beside the main rigging. Louis hurried to warn him.
        - id: ch01-b50
          speaker: louis
          emotion: fearful
          text: >-
            Hush, will ye! For your mother's sake, keep your mouth shut!
        - id: ch01-b51
          speaker: narrator
          text: >-
            Johnson continued to grumble as he watched. Then Standish confronted Wolf Larsen.
        - id: ch01-b52
          speaker: standish
          emotion: angry
          text: >-
            Listen, Larsen. That boy is my boat-puller, and I don't intend to lose him.
        - id: ch01-b53
          speaker: wolf_larsen
          text: >-
            He's yours when he's in your boat, Standish. Aboard this ship, he's my sailor, and I'll do whatever I please with him.
        - id: ch01-b54
          speaker: standish
          emotion: angry
          text: >-
            That doesn't give you any reason to—
        - id: ch01-b55
          speaker: wolf_larsen
          text: >-
            Enough. Easy as she goes. I've told you how it is, so leave it there. The man's mine. If I want to boil him into soup and eat him, I will.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Anger flashed in Standish's eyes, but he turned away and entered the steerage companionway. From there, he kept watching the boy overhead. Everyone was on deck now, every face raised toward a human being locked in a struggle with death.
        - id: ch01-b57
          speaker: narrator
          text: >-
            The men's coldness appalled me. Their place in the ship's working order gave them control over other men's lives, yet they seemed to care nothing for those lives. I had lived apart from the rough movement of the world, and I had never imagined its work was done this way. Life had always seemed especially sacred to me. Here, it counted as nothing, a mere zero in the figures of trade.
        - id: ch01-b58
          speaker: narrator
          text: >-
            I must be fair about one thing. The sailors themselves did feel for Harrison, as Johnson had shown. It was the masters, the captain and hunters, who were heartlessly indifferent. Even Standish had protested only because he did not want to lose his own boat-puller. If Harrison had belonged to another hunter, Standish would have been as amused as the rest of them.
        - id: ch01-b59
          speaker: narrator
          text: >-
            Johansen needed ten full minutes of insults before he forced Harrison to move again. At last, the boy reached the end of the gaff. There he could sit astride the spar itself, which gave him a better chance to hold on. He freed the jammed sheet. Now he only had to return along the halyards, and the path sloped slightly downhill toward the mast. But his courage was gone. Dangerous as the gaff was, he could not make himself leave it for the worse danger of the ropes.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Harrison looked along the airy path he had to cross, then down at the deck far below. His eyes were wide and fixed, and his whole body shook violently. I had never seen fear written so clearly on a human face. Johansen called again and again, but Harrison could not make himself come down. He was helpless with terror, though at any moment the thrashing gaff might have snapped him loose.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Wolf Larsen paid him no attention. He walked the deck talking with Smoke. Only once did he break off, when he noticed the man at the wheel.
        - id: ch01-b62
          speaker: wolf_larsen
          emotion: angry
          text: >-
            You're off course. Mind what you're doing, unless you want trouble.
        - id: ch01-b63
          speaker: helmsman
          text: >-
            Aye, aye, sir.
        - id: ch01-b64
          speaker: narrator
          text: >-
            The helmsman turned the wheel back by a couple of spokes. He had deliberately let the Ghost fall several points away from her proper course. That way, the little wind we had would enter the foresail and hold both sail and ropes steady. He had tried to help the unfortunate Harrison, even though doing so risked Wolf Larsen's anger.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Time dragged on, and the waiting was terrible for me. Mugridge found the whole affair funny. Again and again, his head popped out of the galley door so he could make another joke. How I hated him. During that dreadful wait, my hatred grew to an enormous size. For the first time in my life, I wanted to kill a man. The writers call it seeing red, and now I understood them.
        - id: ch01-b66
          speaker: narrator
          text: >-
            Life in general might still have been sacred to me, but the life of Thomas Mugridge had become anything but sacred. The discovery frightened me. Was the brutality around me beginning to poison me too? Until then, even when judging the worst crimes, I had denied that taking a life could ever be just.
        - id: ch01-b67
          speaker: narrator
          text: >-
            Half an hour passed. Then I saw Louis arguing with Johnson and trying to hold him back. Johnson threw off his arm, crossed the deck, sprang into the forward rigging, and began to climb. Wolf Larsen's quick eye caught him.
        - id: ch01-b68
          speaker: wolf_larsen
          emotion: angry
          text: >-
            You there! What do you think you're doing?
        - id: ch01-b69
          speaker: narrator
          text: >-
            Johnson stopped climbing. He looked straight into his captain's eyes and answered with care.
        - id: ch01-b70
          speaker: johnson
          text: >-
            I am going up to bring the boy down.
        - id: ch01-b71
          speaker: wolf_larsen
          emotion: angry
          text: >-
            You'll come down from that rigging, and you'll do it now. Do you hear me? Get down!
        - id: ch01-b72
          speaker: narrator
          text: >-
            Johnson hesitated. He wanted to keep climbing, but long years of obedience to the masters of ships were stronger than his will. He came sullenly down to the deck, then walked forward again.
        - id: ch01-b73
          speaker: narrator
          text: >-
            At half past five, I went below to lay the cabin table. I hardly knew what my hands were doing. My eyes and mind were filled with the white, shaking figure clinging to the thrashing gaff, looking strangely like a bug. At six, when I carried supper from the galley, Harrison was still in the same place. The men at the table talked about other matters. None of them appeared interested in the life they had so needlessly put at risk.
        - id: ch01-b74
          speaker: narrator
          text: >-
            A little later, I made an extra trip to the galley. To my relief, I saw Harrison stagger weakly away from the rigging toward the forecastle hatch. At last, he had found the courage to climb down.
        - id: ch01-b75
          speaker: narrator
          text: >-
            That evening, while I washed dishes in the cabin, Wolf Larsen returned to what had happened.
        - id: ch01-b76
          speaker: wolf_larsen
          text: >-
            You looked rather sick this afternoon. What was wrong with you?
        - id: ch01-b77
          speaker: narrator
          text: >-
            He already knew what had sickened me almost as much as Harrison. He wanted to draw me into an argument, and I told him it was the brutal way the boy had been treated. Wolf gave a short laugh.
        - id: ch01-b78
          speaker: wolf_larsen
          text: >-
            Like seasickness, I suppose. Some men suffer from it, and some don't.
        - id: ch01-b79
          speaker: narrator
          text: >-
            I told him that was not the same at all.
        - id: ch01-b80
          speaker: wolf_larsen
          text: >-
            It is exactly the same. The earth is as full of brutality as the sea is full of motion. One makes certain men sick, and the other makes different men sick. That's the whole explanation.
        - id: ch01-b81
          speaker: narrator
          text: >-
            I demanded to know whether a man who mocked human life placed any value on it at all.
        - id: ch01-b82
          speaker: wolf_larsen
          text: >-
            Value? What value do you mean? How would you measure it? And who is doing the valuing?
        - id: ch01-b83
          speaker: narrator
          text: >-
            His gaze never moved, though a cynical smile seemed to lie behind his eyes. I said that I valued life.
        - id: ch01-b84
          speaker: wolf_larsen
          text: >-
            Then tell me what another man's life is worth to you. Come now. What is it worth?
        - id: ch01-b85
          speaker: narrator
          text: >-
            I could not turn the value of life into a number or a thing. Words usually came easily to me, yet they failed whenever I faced Wolf Larsen. Part of the difficulty lay in the force of his personality. More of it came from his utterly different view of the world. Other materialists and I had always shared some common ground from which to begin. Wolf and I shared none at all.
        - id: ch01-b86
          speaker: narrator
          text: >-
            His mind also had an elemental simplicity that left me helpless. He stripped every question of its smaller details and drove straight into its heart. He spoke with such final certainty that I felt as if I were struggling in deep water with nothing beneath my feet. What was the value of life? How could I answer at once? I had always accepted the sacredness of life without question. Its value had seemed self-evident, a truth no one needed to prove. The moment he challenged that belief, I had no answer ready.
        - id: ch01-b87
          speaker: wolf_larsen
          text: >-
            We spoke about this yesterday. I told you life was a ferment, a yeasty thing that eats other life so it can live. Living is only successful piggishness. And if supply and demand mean anything, life must be the cheapest thing in the world.
        - id: ch01-b88
          speaker: wolf_larsen
          text: >-
            There is only so much water, so much earth, and so much air. But there is no end to the life waiting to be born. Nature spends it as if it costs nothing. Think of fish and the millions of eggs they cast out. Think of you and me. Each of us carries the possibility of millions of lives. If we had enough time and every opportunity, we could use every bit of that unborn life. We could father whole nations and fill continents.
        - id: ch01-b89
          speaker: wolf_larsen
          text: >-
            Life has no value. Nothing is cheaper. It begs for a place everywhere, while nature pours it out by the handful. Where there is room for one creature, she sows a thousand. Then life eats life until the strongest and greediest one remains.
        - id: ch01-b90
          speaker: narrator
          text: >-
            I told him he had read Darwin, but had misunderstood him. The struggle for existence did not give Wolf the right to destroy life for no reason.
        - id: ch01-b91
          speaker: narrator
          text: >-
            Wolf shrugged.
        - id: ch01-b92
          speaker: wolf_larsen
          text: >-
            You only mean human life. You destroy the flesh of animals, birds, and fish just as I do. Human life is no different. You feel that it is, then imagine you've reasoned your way to the feeling. Why should I be careful with something so cheap and worthless?
        - id: ch01-b93
          speaker: wolf_larsen
          text: >-
            There are more sailors than ships to carry them, and more laborers than factories or machines to employ them. You people ashore crowd the poor into city slums, then turn famine and disease loose among them. After all that, you still have more poor people than you know what to do with. They die for the want of a crust of bread and a scrap of meat, and that meat is another life destroyed. Have you ever watched the London dock workers fight like wild animals for a chance to work?
        - id: ch01-b94
          speaker: narrator
          text: >-
            He started up the companion stairs, then looked back to leave me with one last argument.
        - id: ch01-b95
          speaker: wolf_larsen
          text: >-
            The only value life has is the value it puts upon itself. Of course it values itself too highly, because it cannot judge without favoring itself. Look at the man I sent aloft. He clung on as though he were a treasure more precious than diamonds or rubies. Was he precious to you? No. Was he precious to me? Not at all. Only to himself, and I don't accept his estimate.
        - id: ch01-b96
          speaker: wolf_larsen
          text: >-
            He rates himself far too high. There is always more life demanding to be born. If he had fallen and spilled his brains across the deck like honey dripping from a comb, the world would have lost nothing at all. He was worth nothing to the world because the supply of life is already too great.
        - id: ch01-b97
          speaker: wolf_larsen
          text: >-
            He had value only to himself. Yet if he died, even that value would prove false, because he would no longer know he had lost anything. The diamonds and rubies would be scattered across the deck, like brains dripping from a honeycomb, and washed away with a bucket of seawater. He would never know they were gone. Once he lost himself, he would lose all knowledge of the loss. Do you see? What can you say to that?
        - id: ch01-b98
          speaker: narrator
          text: >-
            All I could say was that he was at least consistent. Then I went on washing the dishes.
