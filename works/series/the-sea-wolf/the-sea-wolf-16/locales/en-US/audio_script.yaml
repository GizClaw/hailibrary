  chapters:
    - id: ch01
      title: CHAPTER XVI
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Being mate brought me only one clear pleasure: I no longer had to wash dishes. I knew almost nothing about a mate's simplest duties. I had to learn about ropes, rigging, setting sails, and trimming them. Fortunately, the sailors felt for me and patiently showed me what to do. Louis was an especially good teacher, and the men under me caused little trouble.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The hunters were another matter. They knew the sea well enough to see me as a joke. I could laugh myself at the thought of a complete landsman serving as mate, but I did not enjoy having them laugh at me. I never complained. Wolf Larsen took care of it himself. After quarrels, threats, and plenty of grumbling, he forced them to give me more formal respect than Johansen had ever received. Everywhere aboard, I became “Mr. Van Weyden.” Only in private did Wolf Larsen still call me Hump.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The arrangement could be funny. The wind might shift while we were eating dinner. As I left the table, Wolf Larsen would give me an order.
        - id: ch01-b04
          speaker: wolf_larsen
          text: >-
            Mr. Van Weyden, kindly bring her around onto the port tack.
        - id: ch01-b05
          speaker: narrator
          text: >-
            I would go on deck, quietly call Louis over, and ask him what had to be done. Once I understood the maneuver, I would turn around and give the orders myself. Early on, Wolf Larsen came up just as I started one of these performances. He smoked his cigar and watched without a word until the work was finished. Then he walked aft beside me along the weather side of the poop.
        - id: ch01-b06
          speaker: wolf_larsen
          text: >-
            Hump. Pardon me, Mr. Van Weyden. I congratulate you. You have found your own legs at last, so you can send your father's back to his grave. Learn some rope work and sail making, add a little experience in storms, and by the voyage's end you could sign on with any coastal schooner.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Those days between Johansen's death and our arrival at the sealing grounds held my happiest hours aboard the Ghost. Wolf Larsen treated me with consideration. The sailors helped me. Best of all, I no longer had to endure Thomas Mugridge at close quarters. As the days passed, I began to feel a private pride. The situation was absurd. I was a landsman serving as second in command, but I was carrying it off. For that brief time, I even came to love the Ghost's heave and roll beneath my feet as she wallowed north and west across the tropical sea toward the island where we would fill our water casks.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Yet my happiness was only relative. It was a patch of lesser misery between the terrible days behind me and the terrible days still ahead. For the sailors, the Ghost was a hell-ship. They never had a moment of peace. Wolf Larsen had not forgiven their attempt on his life or the beating he had taken in the forecastle. Morning, noon, night, and through the night, he worked to make their lives unbearable.
        - id: ch01-b09
          speaker: narrator
          text: >-
            He understood how tiny torments could drive men toward madness. Once, Harrison was dragged from his bunk because a paintbrush had been put away incorrectly. Both sleeping watches were hauled out too, exhausted as they were, simply to watch him return it to its proper place. One paintbrush sounds like nothing. But Wolf Larsen had a thousand such tricks, and together they kept the forecastle ready to break.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The men grumbled constantly, and angry bursts came one after another. Blows were common. There were always two or three sailors nursing injuries given to them by the human beast who commanded them. Yet they could not act together against him. The steerage and cabin held a heavy store of weapons, and those weapons remained beyond their reach. Leach and Johnson suffered most from Wolf Larsen's terrible temper. A deep sadness had settled into Johnson's face and eyes, and the sight made my heart ache.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Leach had no room left for sadness. Fury filled him. His lips seemed fixed in a snarl, and whenever he saw Wolf Larsen, that snarl became a low, threatening sound, almost without Leach knowing it. He followed Wolf Larsen with his eyes the way a caged animal watches its keeper, growling deep in his throat.
        - id: ch01-b12
          speaker: narrator
          text: >-
            One bright day on deck, I touched his shoulder before giving him an order. His back was turned. The instant he felt my hand, he sprang straight up and away, twisting around with a snarl. For one moment, he had thought I was the man he hated.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Leach and Johnson would both have killed Wolf Larsen if they had found the smallest opening. But he was too watchful, and they had no proper weapons. Their fists could never defeat him. Again and again, he fought Leach. Leach always fought back like a wildcat, using teeth, nails, and fists until he lay exhausted or senseless on the deck. Still, he never avoided the next fight. The devil in him challenged the devil in Wolf Larsen. Sometimes the two men only had to meet on deck before the curses, snarls, and blows began. I even saw Leach hurl himself at Wolf Larsen when there had been no warning and no fresh cause.
        - id: ch01-b14
          speaker: narrator
          text: >-
            I saw Leach leap at him without warning. Once, Leach threw his heavy sheath knife and missed Wolf Larsen's throat by an inch. Another time, from the mizzen crosstree, he dropped a steel marlinspike toward him. It was a hard throw from that height on a rolling ship. The point whistled seventy-five feet through the air, barely missed Wolf Larsen's head as he came out of the companionway, and buried itself more than two inches into the deck. On another occasion, Leach stole into the steerage, seized a loaded shotgun, and rushed toward the deck. Kerfoot caught and disarmed him.
        - id: ch01-b15
          speaker: narrator
          text: >-
            I often wondered why Wolf Larsen did not simply kill Leach and end the struggle. Instead, he laughed and seemed to take pleasure in it, like a man who keeps a savage animal as a pet because danger makes the game more exciting.
        - id: ch01-b16
          speaker: wolf_larsen
          text: >-
            Life has more thrill when you carry it in your own hand. Every man is a gambler, and his life is the highest stake he can put down. The worse the odds, the greater the excitement. Why should I deny myself the pleasure of driving Leach's soul to its highest fever? I am doing him a kindness too. We share the sensation.
        - id: ch01-b17
          speaker: wolf_larsen
          text: >-
            He lives more fully than any man forward, though he does not know it. He has something they lack. He has a purpose that consumes him. He wants to kill me, and he still hopes he may succeed. Really, Hump, he is living deep and high. I doubt he has ever lived with such speed and sharpness. Sometimes, when I see him at the very peak of rage and feeling, I honestly envy him.
        - id: ch01-b18
          speaker: narrator
          text: >-
            But it is cowardly! You hold every advantage.
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            Which one of us is the greater coward, you or I? You dislike what is happening, yet you silence your conscience and help it continue. If you were truly brave and true to yourself, you would join Leach and Johnson. But you are afraid. You want to live. The life inside you demands survival at any price.
        - id: ch01-b20
          speaker: wolf_larsen
          text: >-
            So you go on living shamefully. You betray the best things you dream about and break every rule in your pitiful little code. If hell existed, you would be sending your own soul straight toward it. I take the braver part. I do not sin, because I obey the life inside me. At least I am honest with my own soul. You are not.
        - id: ch01-b21
          speaker: narrator
          text: >-
            His words stung. Perhaps I really was acting like a coward. The longer I thought, the more it seemed my duty was exactly what he had suggested. I should join Johnson and Leach and work toward his death. The severe conscience of my Puritan ancestors seemed to rise in me. It pushed me toward deeds I would once have found horrifying, and it even approved murder as the right course. I kept returning to the thought. Ridding the world of such a monster could be a moral act. Humanity would be happier without him, and life would become fairer and sweeter.
        - id: ch01-b22
          speaker: narrator
          text: >-
            I lay awake for long hours in my bunk, reviewing the facts again and again. During night watches, when Wolf Larsen was below, I spoke with Johnson and Leach. Both had lost hope. Johnson's gloomy nature had overcome him. Leach had spent all his strength in a useless fight and was worn out. One night, though, he seized my hand with fierce feeling.
        - id: ch01-b23
          speaker: leach
          text: >-
            I believe you're square, Mr. Van Weyden. But stay where you are and keep your mouth shut. Don't say anything. Just mind your own work. We're dead men, and I know it. Even so, you may get a chance to help us someday, when we need it terribly.
        - id: ch01-b24
          speaker: narrator
          text: >-
            The very next day, Wainwright Island rose to windward, close beside us. Wolf Larsen attacked Johnson. Leach attacked Wolf Larsen in return, and Wolf had just finished beating them both when he made a prophecy.
        - id: ch01-b25
          speaker: wolf_larsen
          text: >-
            Leach, you know that sooner or later I am going to kill you, don't you?
        - id: ch01-b26
          speaker: narrator
          text: >-
            Leach answered with a snarl.
        - id: ch01-b27
          speaker: wolf_larsen
          text: >-
            And Johnson, before I am finished with you, life will become so tiresome that you will throw yourself over the side. Wait and see.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Then he turned aside to me.
        - id: ch01-b29
          speaker: wolf_larsen
          text: >-
            There is a useful suggestion. I will wager a month's pay that he follows it.
        - id: ch01-b30
          speaker: narrator
          text: >-
            I had hoped his victims might escape while we filled the water barrels. Wolf Larsen had chosen the place too carefully. The Ghost anchored half a mile beyond the surf of a lonely beach. A deep gorge opened onto the sand, and steep volcanic walls rose on either side. No man could climb them. Wolf Larsen went ashore himself and kept the work under his direct eye. Leach and Johnson filled the small casks and rolled them down the gorge to the beach. They never had a chance to break away and seize one of the boats.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Harrison and Kelly did try. They belonged to one boat crew and carried a single cask between ship and shore on each trip. Just before dinner, they started toward the beach with an empty barrel. Then they turned left and pulled for the point of land that stood between them and freedom. Beyond its foaming foot were the pretty villages of Japanese settlers and pleasant valleys reaching far inland. If the men could enter that rough country, they believed they could defy Wolf Larsen.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Henderson and Smoke had been lingering around the deck all morning. Now I understood why. They fetched their rifles and began firing at the deserters without any hurry. It became a cold display of marksmanship. At first, bullets skipped harmlessly across the water on either side of the boat. As Harrison and Kelly kept pulling with all their strength, the shots crept closer.
        - id: ch01-b33
          speaker: smoke
          text: >-
            Watch this. I will take Kelly's right oar.
        - id: ch01-b34
          speaker: narrator
          text: >-
            I watched through the glasses. Smoke fired, and Kelly's oar blade burst apart. Henderson then chose Harrison's right oar and broke it with another shot. The boat swung helplessly around. Soon the two remaining oars were shattered as well. Harrison and Kelly tried to row with the broken pieces, but more shots knocked them from their hands. Kelly tore up a board from the bottom of the boat and began paddling with it. Sharp splinters drove into his hands, and he dropped the board with a cry of pain.
        - id: ch01-b35
          speaker: narrator
          text: >-
            At last they gave up and let the boat drift. Wolf Larsen sent another boat from shore. It took them in tow and brought them back aboard.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Late that afternoon, we raised anchor and sailed away from the island. Nothing lay ahead but three or four months of hunting on the sealing grounds. The future looked black, and I went about my work with a heavy heart. A funeral gloom seemed to cover the Ghost. One of Wolf Larsen's strange, splitting headaches had driven him to his bunk. Harrison stood without energy at the wheel, half leaning on it as though even his own body had become too heavy. The other men were silent and bitter.
        - id: ch01-b37
          speaker: narrator
          text: >-
            I found Kelly crouched on the sheltered side of the forecastle hatch. His head rested on his knees, and his arms were wrapped over it. His whole body showed a despair too deep for words.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Johnson lay stretched out on the forecastle head, staring into the troubled water churned up at the bow. I remembered Wolf Larsen's horrible suggestion. It seemed ready to bear fruit. I called Johnson away, trying to break the grip of those dark thoughts. He only gave me a sad smile and refused to move.
        - id: ch01-b39
          speaker: narrator
          text: >-
            As I walked aft again, Leach came toward me.
        - id: ch01-b40
          speaker: leach
          text: >-
            I want to ask you a favor, Mr. Van Weyden. If you ever make it back to San Francisco, will you find Matt McCarthy? He is my father. He has a cobbler's shop on the Hill, behind the Mayfair bakery. Everyone knows the place, so he will be easy to find.
        - id: ch01-b41
          speaker: leach
          emotion: sad
          text: >-
            Tell him I lived long enough to regret the trouble I caused him and all the things I did. And just tell him, “God bless him,” for me.
        - id: ch01-b42
          speaker: narrator
          text: >-
            I nodded, but I could not accept his farewell.
        - id: ch01-b43
          speaker: narrator
          text: >-
            We will all get back to San Francisco, Leach. You will be beside me when I visit Matt McCarthy.
        - id: ch01-b44
          speaker: leach
          emotion: sad
          text: >-
            I wish I could believe that.
        - id: ch01-b45
          speaker: narrator
          text: >-
            He shook my hand.
        - id: ch01-b46
          speaker: leach
          emotion: sad
          text: >-
            But I cannot. Wolf Larsen will finish me. I know it. All I can hope is that he does it quickly.
        - id: ch01-b47
          speaker: narrator
          text: >-
            As Leach left me, I knew the same wish was in my own heart. Since it seemed certain to happen, I wanted it done quickly. The gloom of the whole ship had closed around me and gathered me into it. The worst now seemed unavoidable. Hour after hour, I paced the deck and found Wolf Larsen's hateful ideas infecting me.
        - id: ch01-b48
          speaker: narrator
          text: >-
            What did any of it mean? How could life possess grandeur and still allow human souls to be destroyed so carelessly? Perhaps life was cheap and sordid after all, and the sooner it ended, the better. Let it be over and done.
        - id: ch01-b49
          speaker: narrator
          text: >-
            I too leaned over the rail and gazed longingly into the sea. Sooner or later, I felt certain, I would sink down and down through the cool green depths, into oblivion.
