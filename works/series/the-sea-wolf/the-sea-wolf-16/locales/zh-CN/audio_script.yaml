audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    leach:
      display_name: 利奇
      tts:
        delivery: 倔强激烈，愤怒时近乎不顾一切
        timbre: 紧绷而略带沙哑的年轻男声
        pace: 明快，激动时急促爆发
        pitch: 中高音
    smoke:
      display_name: 斯莫克
      tts:
        delivery: 漫不经心而冷酷，炫耀本领时透着自得
        timbre: 干冷清晰的成年男声
        pace: 从容平稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十六章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            当上大副以后，真正让我高兴的，大概只有一件事，那就是不用再洗盘子。大副最基本的职责，我一样也不懂。若不是水手们同情我，肯耐心教我认识绳索和帆具，教我怎样调整、升起和落下风帆，我一定会过得很狼狈。路易尤其会教人。有了他们帮忙，我指挥手下时倒没有遇到多少麻烦。
        - id: ch01-b02
          speaker: narrator
          text: >-
            猎手们就不同了。他们多少懂些海上的事，自然把我看成笑话。我自己也明白，一个十足的旱鸭子做大副，确实荒唐。可笑自己是一回事，被别人嘲笑又是另一回事。我没有开口抱怨，海狼·拉森却替我立下规矩。他硬要猎手们对我恪守海上的礼数，甚至比从前对约翰森还周到。为这件事，他发过火，也威胁过人。猎手们发了一通牢骚，最后还是服了。从船头到船尾，人人都得叫我范韦登先生。只有私下里，拉森偶尔还会叫我汉普。
        - id: ch01-b03
          speaker: narrator
          text: >-
            有时我们正在吃饭，风向偏了几分。我一离开餐桌，他就会一本正经地吩咐我。
        - id: ch01-b04
          speaker: wolf_larsen
          text: 范韦登先生，劳驾把船转成左舷抢风。
        - id: ch01-b05
          speaker: narrator
          text: >-
            我只好走上甲板，把路易招到身边，先悄悄问清楚该怎么做。等我把他的指点想明白，也弄懂整套操帆动作，才转身向众人发令。早先有一回，我刚开始下命令，拉森就来到甲板上。他抽着雪茄，一声不响地看我把船转好，然后陪我沿着上风一侧的艉楼往船尾走。
        - id: ch01-b06
          speaker: wolf_larsen
          text: >-
            汉普……请原谅，该叫范韦登先生。恭喜你。现在，你可以把令尊那两条腿送回坟墓了。你已经找到了自己的腿，也知道该怎么站稳。再学点绳索活和制帆手艺，再碰上几场风暴，等这趟航程结束，任何沿海航行的纵帆船都会肯用你。
        - id: ch01-b07
          speaker: narrator
          text: >-
            从约翰森死后到抵达猎海豹的海域，是我在“幽灵号”上最愉快的一段日子。拉森对我颇为体谅，水手们也肯相助，我又不必再跟托马斯·马格里奇朝夕相处。日子久了，我甚至暗暗为自己感到骄傲。一个旱鸭子成了全船的二把手，这情形再离奇，我到底还是撑住了，而且办得有模有样。那段短短的时光里，我逐渐喜欢上脚下船身的起伏摇荡。“幽灵号”在热带海面上蹒跚前行，一路向北又向西，驶向那座让我们补充淡水的小岛。
        - id: ch01-b08
          speaker: narrator
          text: >-
            但我的快乐并不完整。它不过是两场巨大苦难之间，一小段痛苦较轻的日子。对水手们来说，“幽灵号”仍是最可怕的地狱船。他们一刻也得不到安宁。拉森忘不了众人企图杀他，更忘不了自己在水手舱挨的那顿痛打。从早晨到中午，从白天到夜里，甚至一整夜，他都在想办法叫他们没法活下去。
        - id: ch01-b09
          speaker: narrator
          text: >-
            他很懂得，小事最能折磨人，便用一件又一件小事，把全体水手逼到发疯的边缘。有一回，哈里森被人从铺位里叫醒，只因为一把油漆刷放错了地方。两班已经休息的水手也全被拖出梦乡，陪他去收拾那把刷子，还得站在那里看他放好。单看只是一桩小事，可拉森这样的心思能想出上千种花样。把它们全加起来，水手舱里的人如何难熬，也就可以想见了。
        - id: ch01-b10
          speaker: narrator
          text: >-
            怨声一直没有停过，小小的反抗也不断爆发。拳头一次次落下，船上总有两三个人在养伤，那些伤全是他们那位人形野兽般的主人留下的。可中舱和舱房里存着大批武器，水手们根本无法合力抵抗。利奇和约翰逊尤其成了他发泄恶毒脾气的对象。约翰逊脸上和眼睛里那份深重的哀伤，看得我心里流血。
        - id: ch01-b11
          speaker: narrator
          text: >-
            利奇却没有工夫悲伤。他身上那股好斗的兽性太强，一阵永不满足的怒火时时刻刻烧着他。他的嘴唇已经扭成永远龇牙的模样。每次看见拉森，他喉咙深处便会不由自主地滚出低吼，声音穿过齿缝，又凶险又骇人。他总用眼睛追着拉森，活像一头野兽盯住饲养自己的人。
        - id: ch01-b12
          speaker: narrator
          text: >-
            有一次，我要给利奇下令，便从背后碰了碰他的肩。那时阳光正亮，他却在手掌落下的一刻直蹿起来，朝远处跳开，人在半空已经回头冲我咆哮。就在那一瞬间，他以为碰他的是自己最痛恨的人。
        - id: ch01-b13
          speaker: narrator
          text: >-
            只要出现一丝机会，利奇和约翰逊都会杀了拉森。可拉森太精明，他们又没有合用的武器，那机会始终没有来。只凭拳头，两个人毫无胜算。拉森一次次跟利奇打起来，利奇也次次拼命还手。他像野猫一样又咬又抓又打，直到筋疲力尽，甚至失去知觉，倒在甲板上。可下一回，他仍然毫不退缩。他体内的魔性不断挑战拉森的魔性。只要两个人同时走上甲板，咒骂、咆哮和拳头转眼就会一齐爆发。利奇甚至会毫无预兆地扑上去。
        - id: ch01-b14
          speaker: narrator
          text: >-
            一次，他把沉重的鞘刀掷出去，离拉森的喉咙只有一英寸。另一次，他从后桅横桁上扔下一根钢制穿绳锥。船身还在摇晃，要投准极难，可那根尖锥从七十五英尺高处呼啸而下。拉森刚从舱房升降口出来，锥尖擦过他的头，深深扎入甲板，足足没进去两英寸多。还有一次，利奇溜进中舱，拿到一支装好弹药的猎枪。他正要持枪冲上甲板，却被克尔富特撞见，武器也被夺走了。
        - id: ch01-b15
          speaker: narrator
          text: >-
            我常常奇怪，拉森为什么不索性杀掉利奇。他却总是大笑，好像很享受这一切。在他看来，这里面有一种刺激，就跟那些喜欢豢养猛兽的人一样。
        - id: ch01-b16
          speaker: wolf_larsen
          text: >-
            把命捏在自己手里，生活才刺激。人天生爱赌，生命就是他能押上的最大赌注。胜算越小，刺激越强。我为什么不能享受一下，把利奇的灵魂撩拨到狂热的顶点？其实我是在帮他，我们感受到的刺激同样强烈。他活得比前甲板任何人都更像个王者，只是自己还不明白。
        - id: ch01-b17
          speaker: wolf_larsen
          text: >-
            他有别人没有的东西，那就是目的。他有非做不可的事，有一个能吞没一切的目标。他想杀我，也盼望自己真能杀掉我。汉普，他现在活得又深沉又高亢。我看着他在激情和感觉的最高处发狂，有时甚至羡慕他。我不信他以前有哪一刻，活得这样迅猛，这样敏锐。
        - id: ch01-b18
          speaker: humphrey
          text: 可这太怯懦了！所有优势都在你手里。
          emotion: angry
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            我们两个，到底谁更怯懦？你明明厌恶眼前的局面，却还参与其中，拿自己的良心妥协。你要真有那么高尚，真能忠于自己，就该去跟利奇和约翰逊联手。可你害怕。你想活下去。你体内的生命喊着，不管付出什么代价都得活。所以你才忍辱偷生，背叛自己最美好的理想，也违背那一整套可怜的小准则。假如真有地狱，你的灵魂正直奔那里。
        - id: ch01-b20
          speaker: wolf_larsen
          text: >-
            呸！我扮演的角色反而更勇敢。我没有犯罪，因为我听从体内生命的驱使。至少，我没有欺骗自己的灵魂。可你欺骗了它。
        - id: ch01-b21
          speaker: narrator
          text: >-
            他说得很严肃，那些话也刺痛了我。或许我确实扮演着一个懦夫。我越想越觉得，要对自己尽责，就该听从他的建议，同约翰逊和利奇联手，设法让他死去。也许正是在此刻，清教徒祖先那严酷的良知在我心里醒了。它把我推向血腥的行动，甚至准许我把杀人当成正义。我反复想着，如果世上少了这样的怪物，那会是最合乎道德的行为。人类会更美好、更幸福，生命也会更公正、更甜美。
        - id: ch01-b22
          speaker: narrator
          text: >-
            我夜夜躺在铺位里无法入睡，眼前的种种事实排成无尽的队伍，一遍又一遍走过。夜间值班时，只要拉森待在下面，我便去跟约翰逊和利奇交谈。两个人都已经绝望。约翰逊生性忧郁，利奇则在徒劳的抗争里耗尽了力气。有一晚，利奇猛地攥住我的手，情绪十分激动。
        - id: ch01-b23
          speaker: leach
          text: >-
            范韦登先生，我知道你是个正直人。可你别离开自己的位置，嘴也要闭紧。少说话，只管干活。我们两个死定了，这我清楚。不过，将来真到了急需帮忙的时候，也许你还能替我们做点事。
        - id: ch01-b24
          speaker: narrator
          text: >-
            第二天，韦恩赖特岛从上风方向出现，就在船舷的正横面。拉森刚找过约翰逊的麻烦，利奇便扑上去帮忙。等他把两个人都痛打一顿，忽然说起了他们的未来。
        - id: ch01-b25
          speaker: wolf_larsen
          text: 利奇，你知道我总有一天会杀掉你，是不是？
        - id: ch01-b26
          speaker: narrator
          text: 利奇只从喉咙里发出一声凶狠的咆哮。
        - id: ch01-b27
          speaker: wolf_larsen
          text: 还有你，约翰逊。等我收拾够了，你会厌倦活着，自己跳进海里。等着瞧吧。
        - id: ch01-b28
          speaker: narrator
          text: 拉森又转向我，压低声音补了一句。
        - id: ch01-b29
          speaker: wolf_larsen
          text: 这算是给他一个暗示。我拿一个月工钱跟你赌，他会照着做。
        - id: ch01-b30
          speaker: narrator
          text: >-
            我原本还盼望，他们装淡水时能找到逃走的机会。可拉森选的地点毫无破绽。“幽灵号”停在一片荒凉海滩外，越过浪线还有半英里。一条深谷从这里通向大海，两边都是无法攀爬的陡峭火山岩壁。拉森亲自上岸监视，让利奇和约翰逊装满一只只小桶，再滚到海滩。他们连抢一条小艇逃走的机会都没有。
        - id: ch01-b31
          speaker: narrator
          text: >-
            哈里森和凯利却试了一次。他们同在一条小艇上，负责往返纵帆船与海岸，每趟只运送一桶水。午饭前，两个人带着空桶划向海滩，半途忽然改变方向，朝左边驶去。他们想绕过伸进海里的岬角。那座岬角挡在自由面前，越过浪花飞溅的山脚，就是日本移民漂亮的村庄，还有一条条带着笑意、深入内陆的山谷。只要逃进那片险峻深山，他们相信自己就能摆脱拉森，再也不必怕他。
        - id: ch01-b32
          speaker: narrator
          text: >-
            亨德森和斯莫克整个上午都在甲板上闲逛，我这才明白原因。两人拿来步枪，不紧不慢地朝逃跑的水手射击。这完全是一场冷血的枪法表演。起先，子弹只在小艇两侧的水面嗖嗖掠过，没有伤人。哈里森和凯利仍拼命划桨，子弹便一发比一发靠近。
        - id: ch01-b33
          speaker: smoke
          text: 看着吧，这一枪打凯利的右桨。
        - id: ch01-b34
          speaker: narrator
          text: >-
            我举着望远镜，清楚看见枪响之后，桨叶碎成了片。亨德森也照着做，打断了哈里森的右桨。小艇立刻横了过来。另外两支桨很快也被击断。两人用残桨继续划，子弹又把断桨从他们手里打飞。凯利撬起一块船底板，想拿它划水，木刺却扎进双手。他痛叫一声，扔掉木板。两个人终于放弃，任小艇随水漂流。拉森从岸边派出另一条艇，把他们连人带船拖回了“幽灵号”。
        - id: ch01-b35
          speaker: narrator
          text: >-
            那天下午很晚，我们起锚出发。前方只剩下猎海豹场上三四个月的捕猎，未来黑暗得叫人看不见希望。我怀着沉重的心情做事，送葬般的阴影仿佛笼罩了整条船。拉森又犯了那种古怪的剧烈头痛，躺回铺位。哈里森无精打采地守着舵轮，身体倚在上面，好像连自己肉身的重量都让他不堪承受。其余水手全都脸色阴沉，沉默不语。凯利蜷缩在水手舱升降口的下风一侧，脑袋埋在膝间，两臂抱住头，那姿势里只有说不尽的绝望。
        - id: ch01-b36
          speaker: narrator
          text: >-
            约翰逊趴在艏楼甲板上，整个身子贴着甲板，双眼盯住船首下翻腾的水沫。我惊恐地想起拉森给过他的暗示。那颗恶毒的种子仿佛真要结果了。我叫约翰逊离开那里，想截断他病态的念头。他只是凄凉地对我笑了笑，不肯服从。
        - id: ch01-b37
          speaker: narrator
          text: 我转身往船尾走，利奇迎了过来。
        - id: ch01-b38
          speaker: leach
          text: >-
            范韦登先生，我想求你一件事。要是你运气好，真能回到旧金山，请去找马特·麦卡锡。他是我父亲，住在山上，就在梅费尔面包房后面。他开了一家修鞋铺，那里人人都知道，你很容易找到。请告诉他，我活着的时候就后悔了。我后悔给他惹过麻烦，也后悔做过那些事。还有……请替我告诉他，愿上帝保佑他。
          emotion: sad
        - id: ch01-b39
          speaker: narrator
          text: 我点了点头，却不肯接受他话里的结局。
        - id: ch01-b40
          speaker: humphrey
          text: 我们都会回到旧金山的，利奇。等我去见马特·麦卡锡，你会跟我一起去。
        - id: ch01-b41
          speaker: leach
          text: >-
            我真想相信你，可我做不到。海狼·拉森会要我的命，我知道。我现在只希望他下手快一点。
          emotion: sad
        - id: ch01-b42
          speaker: narrator
          text: >-
            他离开后，我发觉自己也有同样的愿望。既然那件事一定要发生，就让它快些发生吧。全船的阴郁已经把我裹了进去，最坏的结局似乎再也躲不开。我一小时又一小时地在甲板上踱步，竟也染上拉森那些令人厌恶的念头。
        - id: ch01-b43
          speaker: narrator
          text: >-
            这一切究竟有什么意义？生命若能容许人的灵魂被这样任意毁掉，它又哪里称得上伟大？到头来，生命只是一件廉价而肮脏的东西，越早结束越好。结束了，就全完了。我也伏在舷栏上，长久而渴望地望着大海。我确信，自己早晚会往下沉，一直沉下去，穿过清凉碧绿的海水，坠入那片让一切都被遗忘的深处。
