audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    mugridge:
      display_name: 托马斯·马格里奇
      tts:
        delivery: 油滑谄媚，粗俗话里带着讨好
        timbre: 尖细黏腻的成年男声
        pace: 轻快而连珠炮般
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    johansen:
      display_name: 约翰森
      tts:
        delivery: 服从直率，带着水手的利落
        timbre: 粗厚结实的成年男声
        pace: 平稳简短
        pitch: 中低音
    leach:
      display_name: 乔治·利奇
      tts:
        delivery: 倔强阴沉，受压时压着愤怒
        timbre: 粗哑紧绷的青年男声
        pace: 短促克制
        pitch: 中音
    pilot_boatman:
      display_name: 引航船船员
      tts:
        delivery: 隔海呼喊，随意而粗豪
        timbre: 洪亮开阔的成年男声
        pace: 明快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第三章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            海狼·拉森的咒骂说停就停。他重新点起雪茄，四下一望，恰好看见厨子还在探头探脑。他开口时客气得很，声音却冷硬得像淬过火的钢。
        - id: ch01-b02
          speaker: wolf_larsen
          text: >-
            怎么，厨子？
        - id: ch01-b03
          speaker: mugridge
          text: >-
            是，先生。
        - id: ch01-b04
          speaker: narrator
          text: >-
            厨子赶紧应声，又讨好，又像在赔罪。
        - id: ch01-b05
          speaker: wolf_larsen
          text: >-
            你那脖子伸得还不够长吗？这样可不利于健康。大副已经没了，我不能连你也失去。你一定得好好保重身体，厨子。听明白了吗？
        - id: ch01-b06
          speaker: narrator
          text: >-
            最后几个字突然炸响，像鞭梢抽过来。厨子吓得一缩。
        - id: ch01-b07
          speaker: mugridge
          text: >-
            是，先生。
        - id: ch01-b08
          speaker: narrator
          text: >-
            那颗惹祸的脑袋立刻缩回厨房。这番斥责虽由厨子引起，却是说给所有人听的。船员们马上散开，各找各的活。只有升降口旁几个不像水手的男人还在低声说话。后来我才知道，那六个人是捕杀海豹的猎手，地位远比普通水手高。
        - id: ch01-b09
          speaker: wolf_larsen
          text: >-
            约翰森！拿上掌套和针，把那混蛋缝起来。帆具舱里有旧帆布，拿来凑合。
        - id: ch01-b10
          speaker: narrator
          text: >-
            一个水手顺从地上前，照规矩答应下来。
        - id: ch01-b11
          speaker: johansen
          text: >-
            是，先生。他脚上压点什么？
        - id: ch01-b12
          speaker: wolf_larsen
          text: >-
            这事我们来办。厨子！
        - id: ch01-b13
          speaker: narrator
          text: >-
            托马斯·马格里奇像盒子里的弹簧人一样蹦了出来。
        - id: ch01-b14
          speaker: wolf_larsen
          text: >-
            下去装一袋煤来。你们谁有《圣经》或者《公祷书》？
        - id: ch01-b15
          speaker: narrator
          text: >-
            猎手们全都摇头。有人说了句我没听清的笑话，大家顿时哄笑起来。拉森又向水手们问了一遍。《圣经》和《公祷书》在这条船上似乎都是稀罕东西。不过，有个水手自告奋勇，到休班船员中替他寻找。过了一分钟，那人回来禀报，船上一本也没有。船长听了，只耸了耸肩。
        - id: ch01-b16
          speaker: wolf_larsen
          text: >-
            那就别念什么仪式，直接把他扔下海。除非我们这位牧师模样的落难客，会背海葬礼文。你是牧师，对吧？
        - id: ch01-b17
          speaker: narrator
          text: >-
            他已经彻底转过身，正对着我。六名猎手也一个不落地看过来。我痛苦地清楚，自己活像个稻草人，他们见了我的模样，果然放声大笑。甲板上明明躺着一具龇牙狞笑的尸体，那笑声却没有减弱，也没有柔和半分。它粗野、刺耳、毫无遮掩，像大海本身一样坦白，发自粗鄙的情感和麻木的心灵。这些人的天性里不懂礼貌，也不懂温情。
        - id: ch01-b18
          speaker: narrator
          text: >-
            拉森没有笑，那双灰眼睛里只闪过一点兴味。我已经走到他近前，也就在那一刻，第一次看见了肉体和方才那场咒骂背后的拉森。他五官宽大，线条刚劲，轮廓方正而饱满，初看十分厚重。可正如他的身躯一样，那种厚重很快就从感觉中消失了。我越来越确信，在这一切后面，在他生命深处，沉睡着一股惊人而且过于充沛的精神力量。他的下颌、下巴，还有高高隆起在眼睛上方的额头，本身已强健得异乎寻常，却仿佛只是在透露一股隐在后面、超出形体、看不见的巨大活力。这样的灵魂探不到底，也量不出边界，无法划定疆域，更不可能同相似的人一起整整齐齐塞进某个格子。
        - id: ch01-b19
          speaker: narrator
          text: >-
            命运注定我日后会无比熟悉他的眼睛。那双眼睛又大又好看，间距很宽，像真正艺术家的眼睛。它们藏在沉重的额骨下，上方拱着浓黑的眉毛。那灰色变幻不定，从来不会两次相同，像阳光下织入异色丝线的绸缎，在深浅浓淡之间流转。有时灰暗，有时明亮，有时泛出绿灰，有时又像深海一样澄澈蔚蓝。它们用千般面貌遮住灵魂。只有极少数时刻，它们才会忽然敞开，让灵魂奔涌而上，仿佛正要赤裸裸闯进世间，投身一场奇异冒险。它们会像铅灰天空般沉思，带着无望的阴郁，也会像旋舞的剑一样劈啪迸出火星。它们能冷得如同北极荒原，也能重新温暖柔和，让强烈而阳刚的爱意在其中舞动。那目光既诱惑又逼迫女人，使她们着迷，也支配着她们，直到她们带着喜悦、解脱和牺牲的欢欣交出自己。
        - id: ch01-b20
          speaker: narrator
          text: >-
            我把话题拉回眼前，告诉他，我不是牧师，恐怕帮不上这场葬礼。他立刻追问。
        - id: ch01-b21
          speaker: wolf_larsen
          text: >-
            你靠什么谋生？
        - id: ch01-b22
          speaker: narrator
          text: >-
            从来没人这样问过我，我自己也从没想过。我一下愣住，还没回过神，就结结巴巴说了句傻话。
        - id: ch01-b23
          speaker: humphrey
          text: >-
            我……我是个绅士。
        - id: ch01-b24
          speaker: narrator
          text: >-
            他的嘴角迅速一撇。我急忙辩白，仿佛他是审判我的法官，明知同他讨论这件事愚蠢透顶，却还是忍不住。
        - id: ch01-b25
          speaker: humphrey
          text: >-
            我工作过，现在也在工作！
        - id: ch01-b26
          speaker: wolf_larsen
          text: >-
            靠工作养活自己吗？
        - id: ch01-b27
          speaker: narrator
          text: >-
            他那不容违抗的威势搅得我失了方寸。用弗鲁塞斯的话说，我已经慌了神，就像严厉教师面前发抖的孩子。
        - id: ch01-b28
          speaker: wolf_larsen
          text: >-
            谁养活你？
        - id: ch01-b29
          speaker: humphrey
          text: >-
            我有一笔收入。不过请容我说一句，这同我要找你谈的事毫无关系。
        - id: ch01-b30
          speaker: narrator
          text: >-
            话一出口，我就恨不得咬掉舌头。拉森更没有理会我的抗议。
        - id: ch01-b31
          speaker: wolf_larsen
          text: >-
            那笔钱是谁挣来的？嗯？我就知道，是你父亲。你靠死人的腿站着，自己从没长过腿。让你独自过两天，为三顿饭去弄肉吃，你连路都不会走。把手给我看看。
        - id: ch01-b32
          speaker: narrator
          text: >-
            他体内沉睡的巨力一定是突然动了，而且又快又准。要不然，就是我恍惚了一瞬。等我反应过来，他已经跨前两步，抓住我的右手，举起来端详。我想抽回去，他的手指却不露声色地越收越紧，几乎要把我的指头捏碎。在这种情形下，一个人很难保持尊严。我不能像小学生那样扭动挣扎，也不能攻击这样的怪物，因为他只需把我的胳膊一拧，就能折断它。我没有别的办法，只能站着不动，忍受这番羞辱。
        - id: ch01-b33
          speaker: narrator
          text: >-
            趁这工夫，我看见死人的口袋已经被掏空，里面的东西全摊在甲板上。尸身连同那副狞笑都裹进帆布，再也看不见了。约翰森手上套着一件皮制工具，正用粗白麻线缝合帆布的折边，靠掌心把针一针针推过厚布。拉森看够以后，轻蔑地一甩，丢开了我的手。
        - id: ch01-b34
          speaker: wolf_larsen
          text: >-
            死人把这只手养得真软。除了洗盘子、打下手，恐怕干不了别的。
        - id: ch01-b35
          speaker: humphrey
          text: >-
            我要你送我上岸。耽搁你多少时间，添了多少麻烦，你觉得值多少钱，我就付多少。
        - id: ch01-b36
          speaker: narrator
          text: >-
            我总算恢复镇定，语气也很坚定。他好奇地望着我，眼里全是嘲弄。
        - id: ch01-b37
          speaker: wolf_larsen
          text: >-
            我倒有个相反的提议，还是为了救你的灵魂。大副没了，船上得有一批人升职。一个水手来接大副，舱童去顶水手，你就接替舱童。签下这趟航程的契约，每月二十美元，包吃住。怎么样？记住，这都是为了你的灵魂。它能造就你。过些时候，你或许能用自己的腿站稳，甚至蹒跚着走几步。
        - id: ch01-b38
          speaker: narrator
          text: >-
            我没理他，只望向西南方驶近的船。它的帆影越来越大，越来越清楚。同“幽灵号”一样，那也是双桅帆船，不过我看得出，它的船身更小。它迎着我们纵跃飞驰，姿态漂亮极了，显然会从很近的地方交错而过。风一刻不停地增强。太阳愤怒地闪过几次，随后便不见了。海面转成暗淡的铅灰色，也变得更加粗暴，一道道带着白沫的浪头被抛向天空。“幽灵号”越驶越快，船身也斜得更厉害。有一阵狂风压来，船舷没进海里，那一侧的甲板顿时漫过一层水，两个猎手慌忙抬起双脚。
        - id: ch01-b39
          speaker: humphrey
          text: >-
            那艘船马上就要经过我们了。它往相反方向走，很可能是去旧金山。
        - id: ch01-b40
          speaker: wolf_larsen
          text: >-
            很可能。厨子！喂，厨子！
        - id: ch01-b41
          speaker: narrator
          text: >-
            那个伦敦佬从厨房里蹦出来。
        - id: ch01-b42
          speaker: wolf_larsen
          text: >-
            那小子在哪儿？告诉他，我要见他。
        - id: ch01-b43
          speaker: mugridge
          text: >-
            是，先生。
        - id: ch01-b44
          speaker: narrator
          text: >-
            马格里奇飞快跑向船尾，从舵轮旁的升降口钻下去。没多久，他又上来了，身后跟着一个十八九岁的年轻人。那小伙体格敦实，脸色阴沉凶狠。
        - id: ch01-b45
          speaker: mugridge
          text: >-
            他来啦，先生。
        - id: ch01-b46
          speaker: narrator
          text: >-
            拉森没理厨子，直接转向舱童。
        - id: ch01-b47
          speaker: wolf_larsen
          text: >-
            小子，你叫什么？
        - id: ch01-b48
          speaker: leach
          text: >-
            乔治·利奇，先生。
        - id: ch01-b49
          speaker: narrator
          text: >-
            回答声闷闷不乐。看他的神情，显然早就猜到自己为什么会被叫来。
        - id: ch01-b50
          speaker: wolf_larsen
          text: >-
            这可不是爱尔兰姓。看你这副尊容，姓奥图尔或麦卡锡才他妈合适。除非你妈家的柴堆里藏过一个爱尔兰人。
        - id: ch01-b51
          speaker: narrator
          text: >-
            年轻人受了侮辱，双手握成拳，脖子上慢慢涨起猩红的血色。拉森接着说下去。
        - id: ch01-b52
          speaker: wolf_larsen
          text: >-
            不过这事先放下。你忘掉自己的姓名，或许有很好的理由。只要肯守规矩，我不会因此少喜欢你。电报山就是你登船前混迹的地方，一看那张脸就知道。那里出来的硬汉，个个凶悍加倍，我熟悉这类人。不过在这条船上，我会把你的野性拔干净。明白吗？是谁替你签的船？
        - id: ch01-b53
          speaker: leach
          text: >-
            麦克里迪和斯旺森。
        - id: ch01-b54
          speaker: wolf_larsen
          text: >-
            先生！
          emotion: angry
        - id: ch01-b55
          speaker: leach
          text: >-
            麦克里迪和斯旺森，先生。
        - id: ch01-b56
          speaker: wolf_larsen
          text: >-
            预支的工钱让谁拿了？
        - id: ch01-b57
          speaker: leach
          text: >-
            他们，先生。
        - id: ch01-b58
          speaker: wolf_larsen
          text: >-
            我就知道。你还巴不得让他们拿走。大概有几位你听说过的先生正在找你，所以你恨不得马上消失。
        - id: ch01-b59
          speaker: narrator
          text: >-
            男孩瞬间变成一头野兽。他全身绷紧，像要扑出去，脸也像暴怒的牲畜。
        - id: ch01-b60
          speaker: leach
          text: >-
            这是胡说！
          emotion: angry
        - id: ch01-b61
          speaker: wolf_larsen
          text: >-
            你说什么是胡说？
        - id: ch01-b62
          speaker: narrator
          text: >-
            拉森的声音异常轻柔，仿佛非听见那个没说出口的词不可。男孩迟疑片刻，终于压下怒火。
        - id: ch01-b63
          speaker: leach
          text: >-
            没什么，先生。我收回。
        - id: ch01-b64
          speaker: wolf_larsen
          text: >-
            你已经证明我说对了。你多大？
        - id: ch01-b65
          speaker: narrator
          text: >-
            他满意地笑了。
        - id: ch01-b66
          speaker: leach
          text: >-
            刚满十六，先生。
        - id: ch01-b67
          speaker: wolf_larsen
          text: >-
            撒谎。你这辈子再也见不到十八岁生日了。不过照你说的年纪，块头真不小，肌肉也壮得像马。收拾铺盖，到前甲板的水手舱去。你现在是划艇手，升职了。听懂了吗？
        - id: ch01-b68
          speaker: narrator
          text: >-
            他不等男孩答应，就转向刚把尸体缝好的水手。
        - id: ch01-b69
          speaker: wolf_larsen
          text: >-
            约翰森，你懂航海术吗？
        - id: ch01-b70
          speaker: johansen
          text: >-
            不懂，先生。
        - id: ch01-b71
          speaker: wolf_larsen
          text: >-
            没关系，你照样当大副。把东西搬到船尾的大副舱。
        - id: ch01-b72
          speaker: johansen
          text: >-
            是，先生。
        - id: ch01-b73
          speaker: narrator
          text: >-
            约翰森高高兴兴地朝船头走，原来的舱童却站着没动。
        - id: ch01-b74
          speaker: wolf_larsen
          text: >-
            你还在等什么？
        - id: ch01-b75
          speaker: leach
          text: >-
            我签的是舱童，不是划艇手，先生。我不想干划艇的活。
        - id: ch01-b76
          speaker: wolf_larsen
          text: >-
            收拾东西，到前甲板去。
        - id: ch01-b77
          speaker: narrator
          text: >-
            这次的命令震得人心头发颤，半点也不容违抗。男孩阴沉地瞪着他，还是不肯动。紧接着，拉森身上那股巨力又动了一次。事情来得毫无预兆，从开始到结束，竟只隔着钟表的两声滴答。他一跃跨过足足六英尺的甲板，一拳捣进男孩腹部。同一瞬间，我仿佛也挨了那一拳，胃底泛起一阵叫人恶心的震颤。我特意说起这种感受，是想让人明白，当时我的神经就是这样敏感，也从来没有见惯这样的暴行。
        - id: ch01-b78
          speaker: narrator
          text: >-
            舱童至少有一百六十五磅，却一下蜷起身子，软软裹住那只拳头，像湿布裹在木棍上。紧接着，他整个人被打得腾空，划过一道短短的弧线，头和肩膀重重撞上尸体旁的甲板。他倒在那里，再也爬不起来，只能痛苦地来回扭动。
        - id: ch01-b79
          speaker: wolf_larsen
          text: >-
            怎么样？想好了吗？
        - id: ch01-b80
          speaker: narrator
          text: >-
            我一直不时留意那艘驶近的双桅船。这时它几乎已经同我们并肩，相隔不过两百码。这条小船收拾得整洁利落，船身轻巧，样子十分漂亮。我清楚看见其中一面帆上印着硕大的黑色号码，也想起自己从前见过引航船的图片。
        - id: ch01-b81
          speaker: humphrey
          text: >-
            那是什么船？
        - id: ch01-b82
          speaker: wolf_larsen
          text: >-
            引航船“我的女士号”。引航员都下船了，它正回旧金山。照这风势，五六个钟头就能到。
        - id: ch01-b83
          speaker: humphrey
          text: >-
            那么请你向它发信号，让它送我上岸。
        - id: ch01-b84
          speaker: wolf_larsen
          text: >-
            真遗憾，我把信号簿掉进海里了。
        - id: ch01-b85
          speaker: narrator
          text: >-
            猎手们全咧嘴笑了。我直视拉森的眼睛，心里反复权衡。我刚刚亲眼看见舱童遭受怎样的暴打，也知道自己若是反抗，多半会挨上一顿，甚至遭到更可怕的对待。我就这样同自己争辩了片刻，最后还是做出了自认一生中最勇敢的举动。我冲到船舷边，一面挥舞双臂，一面大声呼喊。
        - id: ch01-b86
          speaker: humphrey
          text: >-
            “我的女士号”！带我上岸！只要带我上岸，我给你们一千美元！
        - id: ch01-b87
          speaker: narrator
          text: >-
            我望着舵轮边的两个人。一个掌舵，另一个把传声筒举到嘴边。我不敢回头，只等身后那头披着人皮的野兽给我致命一击。仿佛过了几个世纪，我终于受不了这份煎熬，转头看去。拉森根本没动。他还站在那里，随着船身轻松摇摆，正点一支新雪茄。
        - id: ch01-b88
          speaker: pilot_boatman
          text: >-
            出什么事了？有麻烦吗？
        - id: ch01-b89
          speaker: humphrey
          text: >-
            有！生死攸关！带我上岸，我给你们一千美元！
        - id: ch01-b90
          speaker: wolf_larsen
          text: >-
            旧金山的烈酒喝太多，对我船员的身体可不好！这个家伙眼下正看见海蛇和猴子呢！
        - id: ch01-b91
          speaker: narrator
          text: >-
            拉森用拇指指着我。引航船上的男人对着传声筒笑了起来，那条船从我们身边破浪驶过。
        - id: ch01-b92
          speaker: pilot_boatman
          text: >-
            替我狠狠收拾他！
        - id: ch01-b93
          speaker: narrator
          text: >-
            两人挥着胳膊告别。我绝望地伏在船舷上，看那条漂亮的小双桅船飞快远去。它不断拉开我们之间那片荒凉的海面。再过五六个钟头，它或许就到旧金山了！我的脑袋像要炸开，喉咙一阵疼，仿佛心脏已经顶到那里。一个卷曲的浪头撞上船侧，咸涩的水沫溅到我的嘴唇。强风阵阵袭来，“幽灵号”深深倾斜，下风一侧的船舷埋进海里。我听得见海水冲上甲板，再沿着甲板奔流而下。
        - id: ch01-b94
          speaker: narrator
          text: >-
            我转回身，看见舱童摇摇晃晃站起来。他面无人色，强忍疼痛，脸颊不停抽动，像病得很重。
        - id: ch01-b95
          speaker: wolf_larsen
          text: >-
            利奇，你去不去前甲板？
        - id: ch01-b96
          speaker: leach
          text: >-
            去，先生。
        - id: ch01-b97
          speaker: narrator
          text: >-
            他的精神已经被压服。拉森又转向我。
        - id: ch01-b98
          speaker: wolf_larsen
          text: >-
            你呢？
        - id: ch01-b99
          speaker: humphrey
          text: >-
            我可以给你一千美元。
        - id: ch01-b100
          speaker: wolf_larsen
          text: >-
            少来这套！你到底当不当舱童？还是非得让我亲手管教你？
        - id: ch01-b101
          speaker: narrator
          text: >-
            我还能怎么办？让他残暴地打一顿，甚至被他打死，也不会让处境有半点好转。我定定地望进那双残酷的灰眼睛。那里面没有一丝人类灵魂的光，也没有一点温暖，简直就是两块花岗岩。有些人的眼睛里，能看见灵魂正在活动。他的眼睛却像大海本身一样荒凉、冰冷、灰暗。
        - id: ch01-b102
          speaker: wolf_larsen
          text: >-
            怎么样？
        - id: ch01-b103
          speaker: humphrey
          text: >-
            去。
        - id: ch01-b104
          speaker: wolf_larsen
          text: >-
            要说“去，先生”。
        - id: ch01-b105
          speaker: humphrey
          text: >-
            去，先生。
        - id: ch01-b106
          speaker: wolf_larsen
          text: >-
            你叫什么名字？
        - id: ch01-b107
          speaker: humphrey
          text: >-
            范·韦登，先生。
        - id: ch01-b108
          speaker: wolf_larsen
          text: >-
            名字呢？
        - id: ch01-b109
          speaker: humphrey
          text: >-
            汉弗莱，先生。汉弗莱·范·韦登。
        - id: ch01-b110
          speaker: wolf_larsen
          text: >-
            多大？
        - id: ch01-b111
          speaker: humphrey
          text: >-
            三十五岁，先生。
        - id: ch01-b112
          speaker: wolf_larsen
          text: >-
            行了。去找厨子，让他教你该干什么。
        - id: ch01-b113
          speaker: narrator
          text: >-
            就这样，我成了海狼·拉森的非自愿奴仆。原因只有一个，他比我强。事情就是这么简单。可在当时，这一切虚幻得叫人难以相信。就算如今再回头去看，它仍然同样不真实。对我来说，这永远是一桩骇人而不可思议的怪事，一场恐怖的噩梦。
        - id: ch01-b114
          speaker: wolf_larsen
          text: >-
            等等，先别走。
        - id: ch01-b115
          speaker: narrator
          text: >-
            我正往厨房走，听见命令便停下。
        - id: ch01-b116
          speaker: wolf_larsen
          text: >-
            约翰森，把所有人叫上来。既然都收拾好了，我们就办葬礼，把甲板上这件没用的废物清走。
        - id: ch01-b117
          speaker: narrator
          text: >-
            约翰森去叫休班船员。两个水手照船长的吩咐，把帆布裹住的尸体放到一块舱口盖上。甲板两侧靠近船舷的地方，各绑着几条底朝天的小艇。几个男人抬起舱口盖和上面那件可怕的货物，搬到下风一侧，架在小艇上。死者的双脚朝向舷外，厨子取来的那袋煤就系在他的脚上。
        - id: ch01-b118
          speaker: narrator
          text: >-
            我一直以为海葬庄严肃穆，令人敬畏，眼前这场葬礼却立刻打破了想象。猎手里有个黑眼睛的小个子，同伴叫他“烟鬼”。他正讲着夹满咒骂和秽语的故事。差不多每隔一分钟，猎手们就爆发出一阵笑声。在我听来，那声音像狼群合嗥，也像地狱猎犬狂吠。水手们吵吵嚷嚷地来到船尾，有些休班船员还揉着惺忪的睡眼。他们凑在一起低声交谈，脸上带着不祥又忧虑的神色。航程以如此凶险的方式开始，船长又是这样的人，他们显然不喜欢眼前的前景。他们不时偷眼看向拉森，我看得出，人人都怕他。
        - id: ch01-b119
          speaker: narrator
          text: >-
            拉森走到舱口盖前，所有人都摘下帽子。我逐一看过去，一共二十人，加上舵轮旁的水手和我，便是二十二个。命运似乎要把我关在这个漂浮的小小世界里，同他们共度不知多少个星期，也可能是几个月。我这样仔细看清每一张脸，自然情有可原。水手大多来自英国和斯堪的纳维亚，面孔厚重木讷，看上去沉默而迟钝。猎手们的脸更刚硬，也更各不相同，上面刻着粗犷的线条，还有任由激情恣意活动留下的痕迹。
        - id: ch01-b120
          speaker: narrator
          text: >-
            奇怪的是，我立刻注意到，拉森脸上没有那种邪恶印记。他的五官看不出凶残。脸上固然也有纹路，却只是果断与坚定留下的线条。那张脸反而显得坦率开朗，光洁无须又让它更显坦荡。在接下来的事情发生以前，我几乎不敢相信，这就是刚才那样残酷对待舱童的人。
        - id: ch01-b121
          speaker: narrator
          text: >-
            他正要开口，一阵接一阵的狂风就撞上双桅船，把一侧船身压进海里。风穿过索具，尖声唱起一支狂野的歌。几个猎手不安地仰头望向高处。死者所在的下风船舷已经没入海中。船身升起回正时，海水横扫甲板，没过我们的鞋面。一阵急雨迎面打下来，每颗雨滴都像冰雹一样扎痛皮肤。雨阵过去，拉森终于说话。那些光着头的男人随着甲板的起伏和俯冲，整齐地来回摇摆。
        - id: ch01-b122
          speaker: wolf_larsen
          text: >-
            葬礼文我只记得一句，“遗体将被投入大海”。那就扔下去吧。
        - id: ch01-b123
          speaker: narrator
          text: >-
            他闭上嘴。抬舱口盖的人面面相觑，大概没想到仪式这样短。拉森忽然暴跳如雷。
        - id: ch01-b124
          speaker: wolf_larsen
          text: >-
            把那头抬起来，你们这群混蛋！到底他妈怎么回事？
          emotion: angry
        - id: ch01-b125
          speaker: narrator
          text: >-
            那几个人可怜巴巴地慌忙抬高舱口盖的一端。死人双脚朝前，从盖板上滑进海里，活像一条被人随手扔出船舷的狗。系在他脚上的煤袋立刻拖着他向下沉。他不见了。
        - id: ch01-b126
          speaker: wolf_larsen
          text: >-
            约翰森，既然人都上来了，就让他们留在甲板上。把中桅帆和艏帆收好，给我干利落些。东南大风要来了。艏帆和主帆也缩帆，一并办妥。
        - id: ch01-b127
          speaker: narrator
          text: >-
            顷刻间，甲板忙成一团。约翰森大声发布命令，众人有的拉紧、有的松开各式各样的绳索。对我这样的旱鸭子来说，这些动作各有什么用处，自然全都叫人眼花缭乱。可真正震动我的，是他们的无情。死人已经成了过去的一幕，一件从此丢开的意外。他装进帆布，脚上系着一袋煤，就这样被抛下。船仍在向前飞驰，船上的活计照常进行，仿佛什么也没发生。谁都不曾停下来，也没有一个人因为他的死亡受到一点触动。
        - id: ch01-b128
          speaker: narrator
          text: >-
            猎手们又在为烟鬼讲的新故事发笑。水手们有的推，有的拉，还有两个正往桅杆上爬。拉森只顾抬头研究上风方向那片阴云密布的天空。那个死去的人，以那样污秽的方式死去，又以那样卑劣的方式下葬，此刻正在海水里不断下沉，下沉……
        - id: ch01-b129
          speaker: narrator
          text: >-
            就在这时，大海的残酷、无情和可怕一齐涌来，猛然压上我的心头。生命仿佛突然变得廉价又肮脏，只剩下一团兽性的、无法言说的东西，仿佛淤泥和黏液里没有灵魂的一阵蠕动。我紧抓上风一侧的船舷，站在支索旁，越过那片荒凉、翻着白沫的浪涛，望向低低伏在远处的雾堤。旧金山和加利福尼亚海岸就藏在那里。阵雨一道道横穿其间，我几乎连雾堤也看不清了。
        - id: ch01-b130
          speaker: narrator
          text: >-
            这条陌生的船载着一群可怕的人，被风和海压得低伏，却又一次次向上跃起，从海浪里挣脱。它始终朝西南方驶去，离岸越来越远，驶进浩瀚而孤独的太平洋深处。
