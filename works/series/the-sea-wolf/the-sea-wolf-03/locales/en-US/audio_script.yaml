audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: controlled and commanding, with sudden cutting force
        timbre: deep, powerful, and cold
        pace: deliberate with abrupt bursts
        pitch: low
    thomas_mugridge:
      display_name: Thomas Mugridge
      tts:
        delivery: eager, servile, and nervous
        timbre: thin and nasal
        pace: quick
        pitch: medium-high
    johansen:
      display_name: Johansen
      tts:
        delivery: obedient, practical, and plainspoken
        timbre: sturdy and resonant
        pace: measured
        pitch: low
    george_leach:
      display_name: George Leach
      tts:
        delivery: sullen and defiant, strained under pressure
        timbre: young, rough, and strong
        pace: clipped
        pitch: medium-low
    lady_mine_man:
      display_name: Lady Mine Sailor
      tts:
        delivery: distant, hearty, and mocking
        timbre: rugged and carrying
        pace: brisk
        pitch: medium-low
  chapters:
    - id: ch01
      title: CHAPTER III
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Wolf Larsen stopped swearing as suddenly as he had started. He lit his cigar again, looked around, and caught sight of the cook.
        - id: ch01-b02
          speaker: wolf_larsen
          text: >-
            Well, Cooky?
        - id: ch01-b03
          speaker: narrator
          text: >-
            His voice was smooth, but cold and hard as steel.
        - id: ch01-b04
          speaker: thomas_mugridge
          text: >-
            Yes, sir?
        - id: ch01-b05
          speaker: narrator
          text: >-
            The cook answered at once, eager to please and already apologizing with his manner.
        - id: ch01-b06
          speaker: wolf_larsen
          text: >-
            Haven't you stuck your neck out far enough? That isn't healthy. I've lost my mate, and I can't afford to lose my cook as well. Take very good care of yourself, Cooky. Do you understand?
        - id: ch01-b07
          speaker: narrator
          text: >-
            The final question cracked like a whip. The cook shrank from it.
        - id: ch01-b08
          speaker: thomas_mugridge
          text: >-
            Yes, sir.
        - id: ch01-b09
          speaker: narrator
          text: >-
            His head vanished into the galley. The warning had been meant for everyone, and the rest of the crew suddenly found work to do. A few men still lounged by a companionway between the galley and the hatch, talking quietly. I learned later that these were the seal hunters. They considered themselves far above ordinary sailors.
        - id: ch01-b10
          speaker: wolf_larsen
          text: >-
            Johansen! Get your palm and needle. Find some old canvas in the sail locker and sew the poor devil up in it.
        - id: ch01-b11
          speaker: narrator
          text: >-
            A sailor stepped forward at once.
        - id: ch01-b12
          speaker: johansen
          text: >-
            Aye, aye, sir. What should I put at his feet?
        - id: ch01-b13
          speaker: wolf_larsen
          text: >-
            We'll take care of that. Cooky!
        - id: ch01-b14
          speaker: narrator
          text: >-
            Thomas Mugridge sprang out of the galley like a toy from a box.
        - id: ch01-b15
          speaker: wolf_larsen
          text: >-
            Go below and fill a sack with coal.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Then Wolf Larsen asked the hunters if any of them had a Bible or prayer book. They shook their heads. One made a joke I could not hear, and they all laughed. He asked the sailors next. One man searched among the watch below, but returned to say there was nothing.
        - id: ch01-b17
          speaker: wolf_larsen
          text: >-
            Then he goes over the side without a service, unless our castaway here knows the burial service by heart. You look like a preacher. Are you one?
        - id: ch01-b18
          speaker: narrator
          text: >-
            He had turned fully around to face me. All six hunters turned as one and looked my way too. I became painfully aware of my ragged clothes and wild appearance. I must have looked like a scarecrow. The sight made them burst into laughter. The dead man still lay stretched on the deck in front of us, his teeth showing in that dreadful grin, but his presence did nothing to soften them. Their laughter was as rough, harsh, and open as the sea itself. It rose from coarse feelings worn dull by hard living. These were men whose natures seemed to know neither courtesy nor gentleness.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Wolf Larsen did not join them, though amusement flickered in his gray eyes. I had stepped close to him, and for the first time I began to see the man apart from his great body and apart from the flood of curses I had heard. At first, his face looked as massive as his frame. It was broad and square, with large features and strong lines. His jaw and chin were powerful. His brow rose high and swelled heavily over his eyes. But as I looked, that first sense of physical mass faded. Behind it, I felt an even greater force, a force of mind or spirit sleeping deep within him. His features seemed to be only the outer signs of that hidden strength. I could not sound its depths, measure its limits, or fit him into any familiar kind of man.
        - id: ch01-b20
          speaker: narrator
          text: >-
            His eyes, which I was destined to know well, were large and handsome. They sat wide apart beneath a heavy brow and thick black eyebrows. Their gray never seemed the same twice. Sometimes it was dark, sometimes pale, sometimes touched with green, and sometimes as clear and blue as deep water. Sunlight changes the colors in woven silk, and his eyes changed just as strangely. They hid his soul behind a thousand different faces. Yet at rare moments, they seemed ready to open and let that soul rush naked into the world on some extraordinary adventure. Those eyes could brood with the hopeless darkness of a leaden sky. They could throw sparks like a sword whirling in the light. They could become as cold as an Arctic waste. Then, at another moment, they could soften and grow warm. A bright, powerful tenderness would dance in them, drawing women toward him even while it mastered them.
        - id: ch01-b21
          speaker: narrator
          text: >-
            I told him I was not a preacher and could not help with the service.
        - id: ch01-b22
          speaker: wolf_larsen
          text: >-
            Then how do you earn your living?
        - id: ch01-b23
          speaker: narrator
          text: >-
            No one had ever asked me that before, and I had never seriously asked myself. The question caught me helplessly off guard.
        - id: ch01-b24
          speaker: narrator
          text: >-
            I told him, with an embarrassing stammer, that I was a gentleman. His lip curled.
        - id: ch01-b25
          speaker: narrator
          text: >-
            I protested that I had worked and still did work. I spoke as if he were my judge and I had to defend myself, though I knew how foolish the whole exchange was.
        - id: ch01-b26
          speaker: wolf_larsen
          text: >-
            Do you work for the money that keeps you alive?
        - id: ch01-b27
          speaker: narrator
          text: >-
            His authority rattled me like a child facing a stern schoolmaster.
        - id: ch01-b28
          speaker: wolf_larsen
          text: >-
            Who feeds you?
        - id: ch01-b29
          speaker: narrator
          text: >-
            I answered that I had an income, then instantly wished I had held my tongue. I added that my income had nothing to do with what I needed to discuss with him. He ignored that.
        - id: ch01-b30
          speaker: wolf_larsen
          text: >-
            Who earned that income? Your father, of course. You stand on dead men's legs because you have none of your own. Left alone for two days, you couldn't earn three meals. Show me your hand.
        - id: ch01-b31
          speaker: narrator
          text: >-
            His sleeping strength must have moved with incredible speed, or else I lost a moment without knowing it. Before I could react, he had crossed two paces of deck and seized my right hand. He held it up to inspect it. I tried to pull free. His fingers tightened without visible effort until I thought my own would be crushed. It was nearly impossible to keep any dignity. I could not twist and struggle like a schoolboy. I could not attack a creature who needed only to turn my arm in order to break it. There was nothing left but to stand still and accept the insult. As he held me there, I had time to look around. The dead man's pockets had been emptied onto the deck. His body and its grin had disappeared inside old canvas. Johansen was sewing the folds together with coarse white cord. A leather tool covered his palm, and he used it to force the thick needle through.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Wolf Larsen tossed my hand aside with contempt.
        - id: ch01-b33
          speaker: wolf_larsen
          text: >-
            Dead men earned the money that kept this hand soft. It may be useful for washing dishes, but not much else.
        - id: ch01-b34
          speaker: narrator
          text: >-
            I had regained control of myself. I firmly told him to put me ashore and offered to pay whatever the delay and trouble were worth. He studied me with mockery in his eyes.
        - id: ch01-b35
          speaker: wolf_larsen
          text: >-
            I have a better offer, and it may save your soul. My mate is gone, so everyone moves up. A sailor becomes mate. The cabin boy becomes a sailor. You become cabin boy and sign on for the voyage at twenty dollars a month, with food included. What do you say? This might teach you to stand on your own legs. Perhaps you'll even learn to walk a little.
        - id: ch01-b36
          speaker: narrator
          text: >-
            I did not answer him. Instead, I watched the sails I had seen to the southwest. They had grown larger and clearer. The approaching vessel carried the same schooner rig as the Ghost, though her hull was smaller. She was a beautiful sight, leaping and flying toward us, and it was clear that she would pass very close. All the while, the wind kept rising. The sun gave a few angry flashes and then vanished. The sea turned a dull leaden gray. It grew rougher and tossed foaming whitecaps toward the sky. We gathered speed and leaned farther beneath the wind. During one gust, the rail went under. Seawater washed across the low side of the deck, and two of the hunters hurriedly lifted their feet out of it.
        - id: ch01-b37
          speaker: narrator
          text: >-
            I pointed out that the ship would soon pass us. Since she was going the other way, I said, she was probably bound for San Francisco.
        - id: ch01-b38
          speaker: wolf_larsen
          text: >-
            Probably. Cooky! Come out here!
        - id: ch01-b39
          speaker: narrator
          text: >-
            The cook appeared at once.
        - id: ch01-b40
          speaker: wolf_larsen
          text: >-
            Where is that boy? Bring him to me.
        - id: ch01-b41
          speaker: thomas_mugridge
          text: >-
            Yes, sir.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Mugridge hurried aft and went below near the wheel. He returned with a heavy young man at his heels. The fellow looked eighteen or nineteen and wore a dark, angry expression.
        - id: ch01-b43
          speaker: thomas_mugridge
          text: >-
            Here he is, sir.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Wolf Larsen ignored the cook and addressed the cabin boy.
        - id: ch01-b45
          speaker: wolf_larsen
          text: >-
            What's your name, boy?
        - id: ch01-b46
          speaker: george_leach
          text: >-
            George Leach, sir.
        - id: ch01-b47
          speaker: narrator
          text: >-
            His answer was sullen. He already knew why he had been called.
        - id: ch01-b48
          speaker: wolf_larsen
          text: >-
            Leach isn't Irish. O'Toole or McCarthy would fit that face much better. Perhaps there was an Irishman somewhere in your mother's family.
        - id: ch01-b49
          speaker: narrator
          text: >-
            The insult made the boy clench his hands. Red crept up his neck.
        - id: ch01-b50
          speaker: wolf_larsen
          text: >-
            Never mind that. Maybe you had good reason to forget your real name. I won't hold it against you if you obey orders. You came aboard from Telegraph Hill. I can see it all over you. You're as tough and vicious as they come, but we'll beat that out of you here. Understand? Who signed you on?
        - id: ch01-b51
          speaker: george_leach
          text: >-
            McCready and Swanson.
        - id: ch01-b52
          speaker: wolf_larsen
          emotion: angry
          text: >-
            Sir!
        - id: ch01-b53
          speaker: george_leach
          text: >-
            McCready and Swanson, sir.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Bitter anger burned in the boy's eyes.
        - id: ch01-b55
          speaker: wolf_larsen
          text: >-
            Who kept your advance money?
        - id: ch01-b56
          speaker: george_leach
          text: >-
            They did, sir.
        - id: ch01-b57
          speaker: wolf_larsen
          text: >-
            Of course they did, and you were glad to give it up. You needed to disappear quickly, with certain gentlemen looking for you.
        - id: ch01-b58
          speaker: narrator
          text: >-
            In an instant, the boy turned savage. His body gathered itself to spring, and his face twisted with fury.
        - id: ch01-b59
          speaker: george_leach
          emotion: angry
          text: >-
            I have a word for that.
        - id: ch01-b60
          speaker: wolf_larsen
          text: >-
            What word?
        - id: ch01-b61
          speaker: narrator
          text: >-
            Wolf Larsen's voice became strangely gentle, as if he truly longed to hear the missing word. The boy paused and forced down his temper.
        - id: ch01-b62
          speaker: george_leach
          text: >-
            Nothing, sir. I take it back.
        - id: ch01-b63
          speaker: wolf_larsen
          text: >-
            And that proves I was right. How old are you?
        - id: ch01-b64
          speaker: george_leach
          text: >-
            I just turned sixteen, sir.
        - id: ch01-b65
          speaker: wolf_larsen
          text: >-
            You're lying. You'll never see eighteen again, though you're big enough for it and muscled like a horse. Pack your things and move forward to the sailors' quarters. You're a boat-puller now. Consider yourself promoted.
        - id: ch01-b66
          speaker: narrator
          text: >-
            Without waiting for an answer, Wolf Larsen turned to Johansen, who had finished sewing the body into its canvas.
        - id: ch01-b67
          speaker: wolf_larsen
          text: >-
            Johansen, do you know how to navigate?
        - id: ch01-b68
          speaker: johansen
          text: >-
            No, sir.
        - id: ch01-b69
          speaker: wolf_larsen
          text: >-
            It doesn't matter. You're mate anyway. Move your things aft into the mate's berth.
        - id: ch01-b70
          speaker: johansen
          text: >-
            Aye, aye, sir.
        - id: ch01-b71
          speaker: narrator
          text: >-
            Johansen started forward cheerfully, but the former cabin boy had not moved.
        - id: ch01-b72
          speaker: wolf_larsen
          text: >-
            What are you waiting for?
        - id: ch01-b73
          speaker: george_leach
          text: >-
            I signed on as cabin boy, sir. I didn't sign on to pull a boat, and I don't want the job.
        - id: ch01-b74
          speaker: wolf_larsen
          text: >-
            Pack your things and go forward.
        - id: ch01-b75
          speaker: narrator
          text: >-
            This time, the command carried a force that made me shiver. The boy glared back in stubborn silence and refused to move. Then Wolf Larsen's hidden strength burst out again. Nothing warned us. It began and ended between two ticks of a clock. He sprang a full six feet across the deck and drove his fist into the boy's stomach. Though I stood untouched, a sickening shock struck the pit of my own stomach. At that time, my nerves were painfully sensitive. I had lived so far from physical violence that the sight of such brutality made my body suffer with its victim.
        - id: ch01-b76
          speaker: narrator
          text: >-
            The cabin boy must have weighed at least one hundred and sixty-five pounds, yet he folded around that fist like a wet cloth around a stick. The blow lifted him through the air. He landed on his head and shoulders beside the corpse and lay twisting in pain.
        - id: ch01-b77
          speaker: wolf_larsen
          text: >-
            Well? Have you decided?
        - id: ch01-b78
          speaker: narrator
          text: >-
            I looked again at the oncoming schooner. She was nearly beside us now, no more than two hundred yards away. She was trim and neat, with a large black number on one sail. From pictures I had seen, I recognized the kind of vessel.
        - id: ch01-b79
          speaker: narrator
          text: >-
            I asked what ship she was.
        - id: ch01-b80
          speaker: wolf_larsen
          text: >-
            The pilot boat Lady Mine. Her pilots are gone, and she's heading into San Francisco. With this wind, she'll arrive in five or six hours.
        - id: ch01-b81
          speaker: narrator
          text: >-
            I asked him to signal her so I could be taken ashore.
        - id: ch01-b82
          speaker: wolf_larsen
          text: >-
            I'm sorry. My signal book fell overboard.
        - id: ch01-b83
          speaker: narrator
          text: >-
            The hunters grinned at his excuse. For a moment, I looked Wolf Larsen squarely in the eyes and argued with myself. I had just seen his frightful treatment of the cabin boy. If I defied him, I knew I would probably receive the same treatment, or something worse. Still, I reached my decision. What I did next remains, in my own mind, the bravest act of my life. I ran to the side, flung my arms into the air, and shouted toward the passing boat.
        - id: ch01-b84
          speaker: narrator
          text: >-
            Lady Mine, ahoy! Take me ashore! I'll pay a thousand dollars!
        - id: ch01-b85
          speaker: narrator
          text: >-
            Two men stood by her wheel, one steering while the other raised a megaphone. I kept my eyes on them. Each moment, I expected a deadly blow from behind. The strain became unbearable, and at last I looked back. Wolf Larsen had not moved. He swayed easily with the ship and lit another cigar.
        - id: ch01-b86
          speaker: lady_mine_man
          text: >-
            What's the trouble? Is something wrong?
        - id: ch01-b87
          speaker: narrator
          text: >-
            I shouted with all the strength in my lungs.
        - id: ch01-b88
          speaker: narrator
          text: >-
            Yes! It's life or death! A thousand dollars if you take me ashore!
        - id: ch01-b89
          speaker: wolf_larsen
          text: >-
            Too much San Francisco liquor for the good of my crew! This fellow thinks he's seeing sea serpents and monkeys!
        - id: ch01-b90
          speaker: narrator
          text: >-
            The man on the Lady Mine laughed through his megaphone as the pilot boat rushed past.
        - id: ch01-b91
          speaker: lady_mine_man
          text: >-
            Give him hell for me!
        - id: ch01-b92
          speaker: narrator
          text: >-
            The two men waved their arms in farewell. I bent over the rail in despair and watched the neat little schooner race away. Every moment widened the bleak stretch of ocean between us. In five or six hours, she would probably be safe in San Francisco. The thought made my head feel ready to burst, and an ache filled my throat as if my heart had risen into it. A curling wave struck the Ghost and sprayed salt across my lips. The wind came in a strong puff. Our schooner leaned far over, burying her low rail, and I heard the water pour across the deck.
        - id: ch01-b93
          speaker: narrator
          text: >-
            When I turned back, the cabin boy was struggling to his feet. His face was deathly white and twitching as he tried to hide his pain. He looked sick.
        - id: ch01-b94
          speaker: wolf_larsen
          text: >-
            Well, Leach? Are you going forward?
        - id: ch01-b95
          speaker: george_leach
          text: >-
            Yes, sir.
        - id: ch01-b96
          speaker: narrator
          text: >-
            His spirit had been crushed. Wolf Larsen turned to me.
        - id: ch01-b97
          speaker: wolf_larsen
          text: >-
            And what about you?
        - id: ch01-b98
          speaker: narrator
          text: >-
            I started to offer him a thousand dollars again, but he cut me off.
        - id: ch01-b99
          speaker: wolf_larsen
          text: >-
            Enough of that. Will you do the cabin boy's work, or must I deal with you myself?
        - id: ch01-b100
          speaker: narrator
          text: >-
            What choice did I have? If he beat me brutally, or perhaps even killed me, that would not improve my position. I looked steadily into his cruel gray eyes. In some men, the eyes reveal the movement of the soul behind them. His revealed nothing. They might have been made of granite. No light or warmth from a human spirit reached their surface. They were bleak, cold, and gray, exactly like the sea around us.
        - id: ch01-b101
          speaker: wolf_larsen
          text: >-
            What is your answer?
        - id: ch01-b102
          speaker: narrator
          text: >-
            I told him yes.
        - id: ch01-b103
          speaker: wolf_larsen
          text: >-
            Say, “Yes, sir.”
        - id: ch01-b104
          speaker: narrator
          text: >-
            I corrected myself.
        - id: ch01-b105
          speaker: narrator
          text: >-
            Yes, sir.
        - id: ch01-b106
          speaker: wolf_larsen
          text: >-
            What's your name?
        - id: ch01-b107
          speaker: narrator
          text: >-
            Van Weyden, sir.
        - id: ch01-b108
          speaker: wolf_larsen
          text: >-
            Your first name?
        - id: ch01-b109
          speaker: narrator
          text: >-
            Humphrey, sir. Humphrey Van Weyden.
        - id: ch01-b110
          speaker: wolf_larsen
          text: >-
            How old are you?
        - id: ch01-b111
          speaker: narrator
          text: >-
            Thirty-five, sir.
        - id: ch01-b112
          speaker: wolf_larsen
          text: >-
            That's enough. Go to the cook and learn your work.
        - id: ch01-b113
          speaker: narrator
          text: >-
            That was how I entered unwilling service under Wolf Larsen. I had not chosen it, agreed to it freely, or done anything to deserve it. He was stronger than I was. That was the whole reason, and it was enough. At the time, the change in my life felt completely unreal. Even now, when I look back and know that it truly happened, it seems no more possible. It remains a monstrous thing to remember, something the mind can hardly accept, like a horrible nightmare that should never have existed outside sleep.
        - id: ch01-b114
          speaker: wolf_larsen
          text: >-
            Wait. Don't go yet. Johansen, call everyone on deck. Now that the mess is cleared away, we'll hold the funeral and get this useless weight off the ship.
        - id: ch01-b115
          speaker: narrator
          text: >-
            While Johansen summoned the watch below, two sailors followed Wolf Larsen's directions and laid the canvas-wrapped body on a hatch cover. Several small boats were secured along both sides of the deck. They rested upside down against the rails. A group of men lifted the hatch cover with its terrible burden and carried it to the low side of the ship. They set it across the upturned boats so that the dead man's feet pointed out over the water. The sack of coal that Mugridge had fetched was fastened securely to those feet, ready to drag the body beneath the surface.
        - id: ch01-b116
          speaker: narrator
          text: >-
            I had always imagined a burial at sea as a solemn and awe-inspiring event. This burial quickly destroyed that idea. One hunter was a small man with dark eyes whom his companions called Smoke. He told stories freely mixed with curses and obscenities. Every minute or two, the other hunters broke into laughter. To me, they sounded like a chorus of wolves or the barking of hellhounds. The sailors came noisily toward the stern. Some of the watch below were still rubbing sleep from their eyes. They gathered in little knots and spoke in low voices. Their faces looked troubled and afraid. A voyage beginning this badly offered little hope, especially under such a captain. Again and again, they stole uneasy glances at Wolf Larsen.
        - id: ch01-b117
          speaker: narrator
          text: >-
            Wolf Larsen stepped beside the hatch cover, and every man removed his cap. I let my eyes travel over the company. There were twenty men in front of me, or twenty-two when I counted the helmsman and myself. I studied them with good reason. Fate had shut me inside this tiny floating world with these men, and I did not know whether we would share it for weeks or for months. Most of the sailors were English or Scandinavian. Their faces looked heavy and slow to change. The hunters were different. Their features were stronger and more varied, and the free play of their passions had cut hard lines into them.
        - id: ch01-b118
          speaker: narrator
          text: >-
            Strangely, Wolf Larsen's face was different from theirs. I saw no obvious mark of evil on it. There were lines, certainly, but they spoke of decision and firmness instead of vice. His face seemed frank and open, an impression made stronger by his smooth-shaven skin. Looking at him, I could scarcely believe that this was the face of the man who had behaved so brutally toward the cabin boy. I could scarcely believe it, that is, until the next thing happened.
        - id: ch01-b119
          speaker: narrator
          text: >-
            Just as Wolf Larsen opened his mouth, one gust after another struck the schooner and pressed her side toward the water. The wind shrieked a wild song through the rigging. Several hunters glanced anxiously upward. The low rail, beside the place where the corpse lay, sank beneath the sea. Then the Ghost lifted and righted herself. Water swept across the deck and rose above our shoes. A shower drove down on us, with every raindrop stinging like a stone of hail. It passed quickly. Wolf Larsen began to speak while the bareheaded men swayed together with every heave and plunge of the deck.
        - id: ch01-b120
          speaker: wolf_larsen
          text: >-
            I remember only one line from the service. “And the body shall be cast into the sea.” So cast it in.
        - id: ch01-b121
          speaker: narrator
          text: >-
            He stopped. The men holding the hatch cover stared in confusion. The ceremony had ended before they understood it.
        - id: ch01-b122
          speaker: wolf_larsen
          emotion: angry
          text: >-
            Lift that end, damn you! What is wrong with you?
        - id: ch01-b123
          speaker: narrator
          text: >-
            The men obeyed in frightened haste and raised their end of the hatch cover. The dead man began to slide. He went feet first, with no honor or tenderness, like a dead dog flung over the side. The sea took him at once. The heavy sack of coal pulled at his feet and dragged the canvas bundle beneath the surface. There was no pause and nothing more to see. He was simply gone.
        - id: ch01-b124
          speaker: wolf_larsen
          text: >-
            Johansen, keep everyone on deck. Take in the topsails and jibs, and do it properly. A southeast gale is coming. Reef the jib and mainsail while you're at it.
        - id: ch01-b125
          speaker: narrator
          text: >-
            In a moment, the whole deck filled with motion. Johansen bellowed his orders. The men pulled some ropes and let others run, and every part of the work confused me because I knew nothing of ships. Yet their heartlessness disturbed me far more than my confusion. The dead man had become an event already finished and forgotten. They had dropped him into the sea inside old canvas, with a sack of coal tied to his feet. The ship kept racing forward, and its work went on without a pause.
        - id: ch01-b126
          speaker: narrator
          text: >-
            His death had affected no one. The hunters were already laughing at a new story from Smoke. Sailors pulled and hauled, and two of them climbed high into the rigging. Wolf Larsen watched the sky darkening on the windward side. The dead man had died in an ugly way and received a miserable burial. Now, beneath all their laughter and labor, he kept sinking down and down.
        - id: ch01-b127
          speaker: narrator
          text: >-
            Then the cruelty of the sea came over me all at once. I felt its relentless and terrible power. In that moment, life itself seemed cheap, shabby, and brutish. It seemed like a creature without thought or speech, stirring blindly in ooze and slime. I held tightly to the high rail beside the shrouds and stared across the desolate, foaming waves. Low banks of fog hid San Francisco and the coast of California. Squalls of rain drove between us and the fog, until I could barely see even that last screen hiding the land.
        - id: ch01-b128
          speaker: narrator
          text: >-
            This strange vessel carried terrible men. Wind and sea pressed her down, but each time she leaped up and out again. She never turned back toward the land I could no longer see. Rain swept past, the waves foamed around us, and still she drove onward. All the while, she headed farther toward the southwest. With every plunge and rise, the distance behind us grew. She was carrying me away from the fog-hidden coast of California and out into the great, lonely emptiness of the Pacific.
