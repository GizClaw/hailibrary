audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    mugridge:
      display_name: Thomas Mugridge
      tts:
        delivery: sneering, officious, and quick to bully
        timbre: nasal and wiry
        pace: brisk with sharp bursts
        pitch: medium-high
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER VIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Sometimes I believe Wolf Larsen is half-mad because his moods are so strange. At other times, he seems like a great man whose genius has never found its way. But most often, I see him as a primitive man born a thousand years or generations too late. He does not belong in this modern age. He is fiercely individual, and terribly lonely.
        - id: ch01-b02
          speaker: narrator
          text: >-
            No one aboard the Ghost is truly his companion. His immense strength of body and mind shuts him away from the others. Even the hunters seem like children beside him. Sometimes he comes down to their level and plays with them like puppies. At other times, he studies them with the cruel hand of someone cutting into a living creature. He reaches into their thoughts and examines their souls to learn what a soul is made of.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Many times at the table, I have watched him insult a hunter. His eyes stay cool and steady while he studies every answer and small burst of temper. To someone who understands him, his curiosity is almost funny. Even his own rages do not seem real to me. Some are experiments. Most are part of the manner he has chosen to use with other men.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Except, perhaps, when the mate died, I do not think I have ever seen him truly angry. I have no wish to see it. If a genuine rage ever called all his power into action, the sight would be terrible.
        - id: ch01-b05
          speaker: narrator
          text: >-
            One of his strange whims fell upon Thomas Mugridge in the cabin. Noon dinner was over, and I had just put the cabin in order when Wolf Larsen and the cook came down the stairs. Mugridge had a tiny stateroom opening off the cabin, but he never dared linger there. Once or twice a day, he slipped through like a frightened ghost.
        - id: ch01-b06
          speaker: wolf_larsen
          text: >-
            So you know how to play Nap. I should have expected that from an Englishman. I learned the game myself aboard English ships.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Wolf Larsen sounded pleased, and Mugridge nearly burst with joy at being treated like the captain's companion. He put on airs and tried to carry himself like a man born to a high place. It was too ridiculous to be sickening. He ignored me, probably because he was too delighted to see me. His pale eyes drifted like lazy summer seas. I could not imagine what glorious visions they held.
        - id: ch01-b08
          speaker: wolf_larsen
          text: >-
            Get the cards, Hump. Bring the cigars too, and the whisky in my berth.
        - id: ch01-b09
          speaker: narrator
          text: >-
            They sat at the table while I fetched everything. When I returned, Mugridge was hinting that some mystery lay behind his life. Perhaps, he suggested, he was a gentleman's son who had gone wrong. Or perhaps his family paid him to stay away from England.
        - id: ch01-b10
          speaker: mugridge
          text: >-
            Paid very well, sir. Paid very well to clear out and keep clear.
        - id: ch01-b11
          speaker: narrator
          text: >-
            I had brought the usual small glasses. Wolf Larsen frowned, shook his head, and motioned for tumblers instead. He filled each one two-thirds full of straight whisky.
        - id: ch01-b12
          speaker: mugridge
          text: >-
            Now that's a gentleman's drink, isn't it?
        - id: ch01-b13
          speaker: narrator
          text: >-
            They touched glasses to the glorious game of Nap, lit cigars, and began to deal. They played for money, and the bets rose. They drank whisky without water while I brought more. I could not tell whether Wolf Larsen cheated, though he was capable of it. He kept winning.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Mugridge went to his bunk again and again for money. Each time he swaggered more, yet returned with only a few dollars. The drink made him foolish and familiar. Soon he could barely see the cards or sit upright. Before another trip, he caught Wolf Larsen's buttonhole with one greasy finger and repeated himself.
        - id: ch01-b15
          speaker: mugridge
          text: >-
            I've got money. I'm telling you, I've got money, and I'm a gentleman's son.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Wolf Larsen drank just as much, and perhaps more, because his glasses seemed fuller. The whisky did nothing to him. He did not change, and Mugridge's performance did not even appear to amuse him.
        - id: ch01-b17
          speaker: narrator
          text: >-
            At last, Mugridge declared he could lose like a gentleman. He staked his final money and lost it. Then he dropped his head into his hands and wept. Wolf Larsen studied him as if he might cut into the cook's mind, then seemed to decide there was nothing worth examining.
        - id: ch01-b18
          speaker: wolf_larsen
          text: >-
            Hump, would you kindly take Mr. Mugridge by the arm and help him onto the deck? He doesn't seem to be feeling well.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Then he lowered his voice so only I could hear.
        - id: ch01-b20
          speaker: wolf_larsen
          text: >-
            Tell Johnson to throw a few buckets of salt water over him.
        - id: ch01-b21
          speaker: narrator
          text: >-
            I left Mugridge with two grinning sailors on deck. Half asleep, he still sputtered that he was a gentleman's son. As I went below to clear the table, he shrieked when the first bucket struck him.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Wolf Larsen was counting the money he had won.
        - id: ch01-b23
          speaker: wolf_larsen
          text: >-
            Exactly one hundred and eighty-five dollars. Just what I expected. The beggar came aboard without a penny.
        - id: ch01-b24
          speaker: narrator
          text: >-
            I spoke more boldly than usual.
        - id: ch01-b25
          speaker: narrator
          text: >-
            And the money you've won belongs to me, sir.
        - id: ch01-b26
          speaker: narrator
          text: >-
            He gave me a questioning smile.
        - id: ch01-b27
          speaker: wolf_larsen
          text: >-
            Hump, I've studied a little grammar, and I think you've mixed up your tenses. You should say it belonged to you, not that it belongs to you now.
        - id: ch01-b28
          speaker: narrator
          text: >-
            This isn't about grammar. It's about ethics.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Nearly a minute passed before he answered. When he did, his voice was slow and serious, with a sadness in it that I could not quite explain.
        - id: ch01-b30
          speaker: wolf_larsen
          emotion: sad
          text: >-
            Do you know, Hump, that's the first time I've ever heard a man speak the word “ethics”? You and I are the only two men on this ship who even know what it means.
        - id: ch01-b31
          speaker: wolf_larsen
          emotion: sad
          text: >-
            There was a time when I dreamed I might lift myself out of the life I was born into. I thought that one day I might meet men who spoke that kind of language, sit with them, and talk about things like ethics. Yet this is the first time I've heard a man say the word. Still, that has nothing to do with the matter. You're wrong. This isn't a question of grammar or ethics. It's a question of fact.
        - id: ch01-b32
          speaker: narrator
          text: >-
            I see. The fact is that you have the money.
        - id: ch01-b33
          speaker: narrator
          text: >-
            His face brightened. He seemed pleased that I understood him, but I continued.
        - id: ch01-b34
          speaker: narrator
          text: >-
            That still avoids the true question. The true question is what is right.
        - id: ch01-b35
          speaker: narrator
          text: >-
            His mouth twisted into a dry little smile.
        - id: ch01-b36
          speaker: wolf_larsen
          text: >-
            Ah. So you still believe there are such things as right and wrong.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Don't you believe in them at all?
        - id: ch01-b38
          speaker: wolf_larsen
          text: >-
            Not in the least. Might is right. That's all there is. Weakness is wrong. Or, to say it more clearly, strength is good for the person who has it because strength brings rewards. Weakness is bad because weakness brings pain. Having this money gives me pleasure, so possessing it is good for me. I have the power to keep it. If I gave it to you and surrendered that pleasure, I would wrong myself and the life inside me.
        - id: ch01-b39
          speaker: narrator
          text: >-
            But by keeping it, you wrong me.
        - id: ch01-b40
          speaker: wolf_larsen
          text: >-
            No. One man can't wrong another. He can only wrong himself. Whenever I put another person's interests before my own, I do wrong. Can't you see it? Imagine two tiny bits of yeast trying to devour each other. Neither one can wrong the other by trying to eat and by fighting not to be eaten. That struggle is born in them. If they turn away from it, then they sin.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Then you don't believe in altruism?
        - id: ch01-b42
          speaker: narrator
          text: >-
            The word seemed familiar to him, but he had to think about it.
        - id: ch01-b43
          speaker: wolf_larsen
          text: >-
            Let me remember. It has something to do with cooperation, doesn't it?
        - id: ch01-b44
          speaker: narrator
          text: >-
            In a way, the ideas have become connected. An altruistic act is something you do for another person's welfare. It's unselfish, while an act done for yourself is selfish.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Gaps in his vocabulary no longer surprised me. He had taught himself everything he knew, without anyone to guide his studies. He had thought deeply but rarely, if ever, spoken about those thoughts.
        - id: ch01-b46
          speaker: wolf_larsen
          text: >-
            Oh, yes. I remember now. I found that word in Spencer.
        - id: ch01-b47
          speaker: narrator
          emotion: surprised
          text: >-
            Spencer? You've read him?
        - id: ch01-b48
          speaker: wolf_larsen
          text: >-
            Not very much. I understood a fair amount of First Principles. But Biology took all the wind out of my sails, and Psychology left me drifting helplessly for days. I truly couldn't understand what he meant. At first, I blamed some weakness in my own mind. Later, I decided I simply had no proper foundation for the work. Only Spencer and I know how hard I hammered at it. Still, I did get something from his Data of Ethics. That's where I met the word “altruism,” and now I remember how he used it.
        - id: ch01-b49
          speaker: narrator
          text: >-
            I wondered what a man like Wolf Larsen could have taken from Spencer. I remembered enough of the philosopher to know that altruism was necessary to his idea of the highest kind of conduct. Wolf Larsen had plainly sifted those teachings, accepting what suited his wants and throwing the rest away.
        - id: ch01-b50
          speaker: narrator
          text: >-
            What else did you find in him?
        - id: ch01-b51
          speaker: narrator
          text: >-
            His brows drew together as he put unspoken thoughts into words. I felt a thrill. Wolf Larsen often reached into other men's souls. Now I was reaching into his. A strange, unexplored country was opening before me.
        - id: ch01-b52
          speaker: wolf_larsen
          text: >-
            Put as briefly as I can, Spencer says this. First, a man must act for his own good, and doing that is moral. Next, he should act for the good of his children. Third, he should act for the good of his race.
        - id: ch01-b53
          speaker: narrator
          text: >-
            And the finest and most truly right act is one that helps the man, his children, and his race all at the same time.
        - id: ch01-b54
          speaker: wolf_larsen
          text: >-
            I wouldn't accept that. I saw no need or sense in it, so I cut out the children and the race. I would sacrifice nothing for them. It's all empty feeling, and surely you can see that if a man doesn't believe in eternal life. If I were immortal, altruism might be a profitable bargain. I could raise my soul higher and higher and collect the reward later.
        - id: ch01-b55
          speaker: wolf_larsen
          text: >-
            But there is nothing eternal ahead of me except death. Life gives me only this short time to crawl and squirm like yeast. In that case, any sacrifice would be immoral. If a sacrifice costs me even one movement in that brief ferment, it is foolish. More than foolish, it is a wrong against myself. To get everything I can from life, I must not give up a single crawl or squirm. And when the endless stillness comes, nothing I sacrificed or kept for myself while I was alive will make that stillness easier or harder.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Then you're an individualist and a materialist. By the same logic, you're also a hedonist.
        - id: ch01-b57
          speaker: wolf_larsen
          text: >-
            Those are large words. What is a hedonist?
        - id: ch01-b58
          speaker: narrator
          text: >-
            I explained the word, and he nodded in agreement. Then I went on.
        - id: ch01-b59
          speaker: narrator
          text: >-
            So no one could trust you, even in the smallest matter, if your own interests might get in the way.
        - id: ch01-b60
          speaker: wolf_larsen
          text: >-
            Now you're beginning to understand me.
        - id: ch01-b61
          speaker: narrator
          text: >-
            You have none of what the world calls morals.
        - id: ch01-b62
          speaker: wolf_larsen
          text: >-
            That's right.
        - id: ch01-b63
          speaker: narrator
          text: >-
            Then a person should always be afraid of you.
        - id: ch01-b64
          speaker: wolf_larsen
          text: >-
            That's the way to say it.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Afraid as he would be of a snake, a tiger, or a shark?
        - id: ch01-b66
          speaker: wolf_larsen
          text: >-
            Now you know me. And you know me as other men know me. They call me Wolf.
        - id: ch01-b67
          speaker: narrator
          text: >-
            I dared to press him further. You are a kind of monster, a Caliban who has thought about Setebos. Then, in idle moments, you act on whatever whim takes you.
        - id: ch01-b68
          speaker: narrator
          text: >-
            His brow darkened. The reference meant nothing to him, and I soon discovered that he did not know Browning's poem.
        - id: ch01-b69
          speaker: wolf_larsen
          text: >-
            I've only just begun reading Browning, and it's hard going. I haven't gone far, but I've already nearly lost my way.
        - id: ch01-b70
          speaker: narrator
          text: >-
            I fetched the book and read “Caliban” aloud. He was delighted. He completely understood its primitive way of seeing the world and interrupted again and again with comments. At the end, he asked me to read it a second time, then a third.
        - id: ch01-b71
          speaker: narrator
          text: >-
            After that, we talked about philosophy, science, evolution, and religion. His ideas showed the mistakes of a self-taught man, but his primitive mind also had certainty and directness. Simplicity made his reasoning strong. His materialism struck harder than my friend Charley Furuseth's more complicated ideas.
        - id: ch01-b72
          speaker: narrator
          text: >-
            I was a confirmed idealist, or a temperamental idealist, as Charley called me. Wolf Larsen did not persuade me. Even so, he attacked the last strongholds of my faith with such force that I had to respect the attack, though I did not accept his conclusions.
        - id: ch01-b73
          speaker: narrator
          text: >-
            The hours passed. Supper was near, and the table had not been laid. I grew restless and worried. Then Thomas Mugridge appeared at the companionway and glared down at us. He looked sick and angry. I was about to rise and begin my duties when Wolf Larsen called to him.
        - id: ch01-b74
          speaker: wolf_larsen
          text: >-
            Cooky, you'll have to work quickly tonight. I'm busy talking with Hump, so you'll have to manage as well as you can without him.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Once again, Wolf Larsen made the impossible happen. That night, I sat at the table with the captain and the hunters. Thomas Mugridge served us, then washed the dishes afterward. It was another whim, one of Wolf Larsen's Caliban moods, and I knew it would bring trouble upon me.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Meanwhile, Wolf Larsen and I went on talking. The hunters listened with disgust, unable to understand a word of it.
