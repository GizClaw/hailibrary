audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    thomas_mugridge:
      display_name: 托马斯·马格里奇
      tts:
        delivery: 油滑做作，得意时夸张卖弄，醉后含混黏滞
        timbre: 尖细而浑浊的成年男声
        pace: 平时急促，醉后拖沓不稳
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第八章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            有时，我觉得海狼·拉森疯了，至少也疯了一半。他的心情和念头实在古怪无常。可有时，我又觉得他是个没能成就自己的伟人，是个从未找到出路的天才。到最后，我认定他就是原始人的完美典型，只是晚生了一千年，也许是一千代，才会落在这个文明登峰造极的世纪里，显得那样不合时宜。他是个最彻底的个人主义者，也孤独得厉害。船上没有谁能同他意气相投。他旺盛得惊人的生命力和强大的心智像一堵墙，把所有人挡在外面。连那些猎手们在他眼里也只是孩子。他不得不降到他们的层次，像大人逗小狗一样陪他们玩。要不然，他便像残酷的活体解剖者，伸手探进他们的心思，检视他们的灵魂，想看看灵魂究竟是什么材料做的。
        - id: ch01-b02
          speaker: narrator
          text: >-
            我看过不下二十次这样的事。饭桌上，他用冷静而平直的目光盯着某个猎手，开口羞辱对方，还带着几分兴味，琢磨那人的举动、回答和小小的怒火。我站在旁边看明白了，甚至觉得他的好奇有些可笑。至于他自己的暴怒，我相信多半不是真的。有时，那是一场试验。更多时候，那是他有意拿来面对旁人的姿态，摆得久了，后来便成了习惯。除了大副死去那一次也许是真的，我从没见他真正动怒。我也绝不想看到他勃然大怒，把全身力量都使出来。
        - id: ch01-b03
          speaker: narrator
          text: >-
            说到他的怪念头，就该讲讲托马斯·马格里奇在舱里遇到的事，也把我先前一两次提过的那桩事情说完。一天中午，十二点的饭已经吃完，我刚收拾好大舱，拉森和马格里奇便走下舷梯。厨房佬虽有一间鸽笼似的小住舱，门就开在大舱里，却从来不敢停留，更不敢让人看见。每天只有一两次，他会像个胆怯的幽灵，匆匆飘进来，又匆匆飘出去。
        - id: ch01-b04
          speaker: wolf_larsen
          text: >-
            原来你会玩“拿破仑”牌。我早该想到，英国人当然会玩。我也是在英国船上学的。
        - id: ch01-b05
          speaker: narrator
          text: >-
            能这样和船长亲近，马格里奇乐昏了头，成了一个语无伦次的傻瓜。他硬要摆出几分派头，拼命模仿生来体面的人的从容举止。那副样子要不是太滑稽，简直会叫人恶心。他完全没理我。我倒相信，他只是高兴得根本看不见我。那双苍白浑浊的眼睛像懒洋洋的夏日海面一样荡漾着。至于他看见了什么幸福幻景，我可猜不出来。
        - id: ch01-b06
          speaker: wolf_larsen
          text: >-
            汉普，把牌拿来。再去我的住舱，把雪茄和威士忌取来。
        - id: ch01-b07
          speaker: narrator
          text: >-
            我拿东西回来时，正听见那个伦敦佬吹嘘自己的身世。他暗示自己也许是哪位绅士误入歧途的儿子，还说家里定期给他钱，只要他别回英国。
        - id: ch01-b08
          speaker: thomas_mugridge
          text: >-
            他们给俺大把大把的钱呢，先生。就为了让俺滚蛋，还得一直滚下去。
        - id: ch01-b09
          speaker: narrator
          text: >-
            我拿来的是平常喝烈酒的小杯。拉森皱眉摇头，示意我换成大玻璃杯。他往两只杯里倒了三分之二的纯威士忌。
        - id: ch01-b10
          speaker: thomas_mugridge
          text: >-
            这才是绅士喝的酒，对吧？
        - id: ch01-b11
          speaker: narrator
          text: >-
            两人为光荣的“拿破仑”牌戏碰杯，点上雪茄，开始洗牌发牌。他们拿钱下注，而且越赌越大。纯威士忌一杯接一杯，我只好再去拿酒。拉森有没有作弊，我不知道，不过这种事他绝对做得出来。他一直在赢。厨房佬一次次回自己的铺位拿钱，每去一次，走路的架势都更神气，可每回只拿几美元。他越喝越醉，既伤感又放肆，几乎看不清手里的牌，身子也坐不直。又一次准备回去拿钱时，他用油腻的食指勾住拉森的纽扣眼，目光空洞地反复嚷着。
        - id: ch01-b12
          speaker: thomas_mugridge
          text: >-
            俺有钱。俺有钱，告诉你。俺可是绅士的儿子。
        - id: ch01-b13
          speaker: narrator
          text: >-
            拉森陪他一杯不少地喝，杯里的酒甚至更多，却一点也没受影响。他没有任何变化，连对方那副丑态也不觉得有趣。最后，厨房佬大声抗议，说自己连输钱也能输得像个绅士。他把仅剩的钱全押上去，又输得精光。随后，他两手托着脑袋，哭了起来。拉森好奇地打量他，仿佛又想探查、解剖一番。可他随即作罢，大概已经断定，那里面根本没有什么值得探查。
        - id: ch01-b14
          speaker: wolf_larsen
          text: >-
            汉普，劳驾你扶着马格里奇先生，把他送上甲板。他身体不太舒服。
        - id: ch01-b15
          speaker: narrator
          text: >-
            接着，他压低声音，只让我听见。
        - id: ch01-b16
          speaker: wolf_larsen
          text: >-
            再告诉约翰逊，拿几桶海水把他浇透。
        - id: ch01-b17
          speaker: narrator
          text: >-
            我把马格里奇留在甲板上，交给两个奉命等在那里的水手。他们咧着嘴直笑。马格里奇昏昏沉沉，还在含混地说自己是绅士的儿子。我下舷梯去收拾桌子，刚走到下面，就听见他尖叫起来。第一桶海水已经泼到了身上。拉森却在数赢来的钱。
        - id: ch01-b18
          speaker: wolf_larsen
          text: >-
            整整一百八十五美元。果然和我想的一样，那混蛋上船时一个子儿也没有。
        - id: ch01-b19
          speaker: humphrey
          text: >-
            可您赢来的钱是我的，先生。
        - id: ch01-b20
          speaker: narrator
          text: >-
            我鼓起胆子说完，他送给我一个戏谑的微笑。
        - id: ch01-b21
          speaker: wolf_larsen
          text: >-
            汉普，我也学过几年语法。你把时态弄乱了。该说那些钱“本来是我的”，不能说“是我的”。
        - id: ch01-b22
          speaker: humphrey
          text: >-
            这不是语法问题，是伦理问题。
        - id: ch01-b23
          speaker: narrator
          text: >-
            大约过了一分钟，他才开口。语气缓慢而严肃，还隐约带着一缕难以言说的悲哀。
        - id: ch01-b24
          speaker: wolf_larsen
          text: >-
            汉普，你知道吗？这是我第一次从一个男人嘴里听到“伦理”这个词。这条船上，只有你和我明白它的意思。
        - id: ch01-b25
          speaker: narrator
          text: >-
            他又停了一会儿，才继续往下说。
        - id: ch01-b26
          speaker: wolf_larsen
          text: >-
            我这一生，也曾梦想有一天能同说这种话的人交谈。我想摆脱自己出生的那个位置，同那些会谈伦理的人来往。可直到今天，我才第一次听见有人说出这个词。不过，这都离题了。你说错了。这不是语法问题，也不是伦理问题，只是事实问题。
        - id: ch01-b27
          speaker: humphrey
          text: >-
            我懂了。事实就是钱在你手里。
        - id: ch01-b28
          speaker: narrator
          text: >-
            他的脸亮了，似乎很欣赏我这么快就明白。
        - id: ch01-b29
          speaker: humphrey
          text: >-
            可这样还是躲开了真正的问题。真正的问题，是道义。
        - id: ch01-b30
          speaker: narrator
          text: >-
            他不以为然地撇了撇嘴。
        - id: ch01-b31
          speaker: wolf_larsen
          text: >-
            原来你还相信什么对呀错呀。
        - id: ch01-b32
          speaker: humphrey
          text: >-
            难道你不信？一点都不信？
        - id: ch01-b33
          speaker: wolf_larsen
          text: >-
            一点都不信。强权就是公理，事情只有这么简单。弱小就是错误。换个说法，一个人强大，对自己就是善。一个人软弱，对自己就是恶。再说得贴切些，强大会带来好处，所以令人愉快。软弱会招来惩罚，所以令人痛苦。眼下，这些钱归我，让我很愉快。拥有它们，对我有好处。既然我有本事占有它们，要是把钱交给你，放弃这种快乐，我就是辜负自己，也辜负身体里的生命。
        - id: ch01-b34
          speaker: humphrey
          text: >-
            可你扣着钱不给，就亏待了我。
        - id: ch01-b35
          speaker: wolf_larsen
          text: >-
            根本不是。一个人不可能亏待另一个人，只可能亏待自己。照我看，只要顾及别人的利益，我就在亏待自己。还不明白吗？两粒酵母都想吞掉对方，谁又亏待了谁？努力去吞食，也努力不被吞食，本来就是它们与生俱来的本分。背离这一本分，它们才算犯了罪。
        - id: ch01-b36
          speaker: humphrey
          text: >-
            那么，你不相信利他主义？
        - id: ch01-b37
          speaker: narrator
          text: >-
            这个词听起来似乎有点熟，他却认真想了一会儿。
        - id: ch01-b38
          speaker: wolf_larsen
          text: >-
            让我想想。是不是同合作一类的东西有关？
        - id: ch01-b39
          speaker: humphrey
          text: >-
            嗯，后来这两个意思多少有了些联系。利他的行为，就是为别人谋福祉。它是无私的，同只为自己而做的自私行为相反。
        - id: ch01-b40
          speaker: narrator
          text: >-
            他词汇里有这样的空缺，我已经不觉得奇怪。他的词汇和知识全靠自己读书得来。没有人指点他该学什么。他想得很多，说得很少，甚至根本不说。听完解释，他点了点头。
        - id: ch01-b41
          speaker: wolf_larsen
          text: >-
            哦，对，我想起来了。我在斯宾塞的书里见过。
        - id: ch01-b42
          speaker: humphrey
          text: >-
            斯宾塞！你读过他的书？
        - id: ch01-b43
          speaker: wolf_larsen
          text: >-
            读得不多。《第一原理》我懂了不少，可《生物学》一下把我的风帆打瘪了。《心理学》更让我在无风带里乱撞，好些天都找不到出路。老实说，我根本不懂他要讲什么。我起先以为是自己脑子不行，后来才明白，是我没有预先打好根基。我缺少应有的基础。我下过多大的死功夫，只有斯宾塞和我知道。不过，我确实从《伦理学原理》里得到了一些东西。“利他主义”就是在那里遇见的。现在我也想起他怎样用这个词了。
        - id: ch01-b44
          speaker: narrator
          text: >-
            我不禁想，他能从那样的一部著作里得到什么。我对斯宾塞还记得足够多，知道在他的最高行为理想中，利他主义不可缺少。很显然，拉森把这位大哲学家的教导筛了一遍，只按自己的需要和欲望取舍。合意的留下，不合意的丢掉。
        - id: ch01-b45
          speaker: humphrey
          text: >-
            你还从书里看到了什么？
        - id: ch01-b46
          speaker: narrator
          text: >-
            他微微皱眉，费力地替那些从没说出口的想法找到合适的字句。我心里忽然兴奋起来。他总喜欢探查别人的灵魂，现在我也在摸索他的灵魂材料。这是一片没人踏足过的地方。一片陌生得可怕的天地，正在我眼前一点点展开。
        - id: ch01-b47
          speaker: wolf_larsen
          text: >-
            尽量简单地说，斯宾塞的意思大概是这样。第一，人必须为自己的利益做事，这样才合乎道德，才是善。第二，他必须为子女的利益做事。第三，他必须为自己种族的利益做事。
        - id: ch01-b48
          speaker: humphrey
          text: >-
            而最高尚、最完美、最正确的行为，就是同时让本人、他的子女和他的种族都得到好处。
        - id: ch01-b49
          speaker: wolf_larsen
          text: >-
            这一点我不接受。我看不出有什么必要，也看不出有什么道理。我把种族和子女都删了。我不会为他们牺牲任何东西。那都是黏糊糊的废话和感情用事。至少对一个不相信永生的人来说，你也该看得出来。要是前面真有永生，利他主义倒是一笔划算的买卖。我尽可以把灵魂提升到各种高度。可我面前除了死亡，没有别的永恒。我只有短短一段叫作生命的时间，让酵母在里面爬动、蠕动。所以，任何牺牲对我来说都不道德。只要一次牺牲让我少爬一下，少蠕动一下，那就是愚蠢。不只愚蠢，还是对不起自己，是邪恶的事。我要从这场发酵里得到最多，就一下也不能少爬，一下也不能少蠕动。等永恒的静止降临，我在爬动的日子里牺牲也好，自私也好，都不会让那静止变得更轻松或更难熬。
        - id: ch01-b50
          speaker: humphrey
          text: >-
            那么，你是个人主义者，是唯物主义者。照逻辑来说，你还是享乐主义者。
        - id: ch01-b51
          speaker: wolf_larsen
          text: >-
            好大的名词。可什么叫享乐主义者？
        - id: ch01-b52
          speaker: narrator
          text: >-
            我解释给他听，他点头表示同意。接着，我继续追问。
        - id: ch01-b53
          speaker: humphrey
          text: >-
            只要一件事可能牵涉你的私利，哪怕事情再小，也绝不能信任你，对吗？
        - id: ch01-b54
          speaker: wolf_larsen
          text: >-
            现在你开始懂了。
        - id: ch01-b55
          speaker: humphrey
          text: >-
            世人所谓的道德，你身上一点都没有？
        - id: ch01-b56
          speaker: wolf_larsen
          text: >-
            正是。
        - id: ch01-b57
          speaker: humphrey
          text: >-
            你是一个必须时时提防的人？
        - id: ch01-b58
          speaker: wolf_larsen
          text: >-
            这样说就对了。
        - id: ch01-b59
          speaker: humphrey
          text: >-
            要像提防蛇、老虎或鲨鱼一样提防你？
        - id: ch01-b60
          speaker: wolf_larsen
          text: >-
            现在你认识我了。你认识的也正是大家眼里的我。别人都叫我“狼”。
        - id: ch01-b61
          speaker: humphrey
          text: >-
            你简直是一种怪物。就像那个思索过塞提波斯的卡利班，闲来无事便随着一时兴致，做出你这样的事。
        - id: ch01-b62
          speaker: narrator
          text: >-
            听到这个典故，他沉下脸来。他没听懂。我很快发现，他根本不知道那首诗。
        - id: ch01-b63
          speaker: wolf_larsen
          text: >-
            我刚开始读勃朗宁，可真够难的。我没读多少，就已经差不多找不着方向了。
        - id: ch01-b64
          speaker: narrator
          text: >-
            我不想把这件事讲得太长。简单说，我从他的住舱取来书，高声读了《卡利班》。他非常喜欢。诗里那种原始的推理方式，还有那种看待世间事物的眼光，他全都明白。他一次次打断我，提出自己的评论和批评。我读完以后，他又要我读第二遍、第三遍。后来，我们谈起哲学、科学、进化和宗教。他露出了自学者难免的错误，不过也有原始心灵特有的坚定和直截了当。他的推理极其简单，力量也恰恰来自这种简单。他的唯物主义，比查利·弗鲁塞斯那套精巧复杂的唯物主义更能打动人。我当然没有被他说服。我本来就是一个坚定的理想主义者，用弗鲁塞斯的话说，这是天性使然。可是拉森用惊人的力量猛攻我信念的最后堡垒。那股力量虽没叫我信服，仍赢得了我的敬意。
        - id: ch01-b65
          speaker: narrator
          text: >-
            时间不知不觉过去。晚饭已经迫在眉睫，桌子却还没摆。我越来越坐立不安。马格里奇脸色又病又怒，从舷梯口朝下瞪着我。我正准备起身去做自己的差事，拉森却冲他喊起来。
        - id: ch01-b66
          speaker: wolf_larsen
          text: >-
            厨房佬，今晚你得麻利点。我正忙着和汉普谈话。没有他帮忙，你自己尽力干吧。
        - id: ch01-b67
          speaker: narrator
          text: >-
            于是，又一件从未有过的破天荒之事发生了。那天晚上，我竟和船长、猎手们一起坐在桌边吃饭。马格里奇在一旁伺候我们，等大家吃完以后，还得独自收拾并洗净那些盘子。这只是拉森一时的怪念头，是他那种卡利班式心境又发作了。我已经料到，这件事会给我惹来麻烦。可当时，我们只顾谈个不停。猎手们一个字也听不懂，厌烦极了。
