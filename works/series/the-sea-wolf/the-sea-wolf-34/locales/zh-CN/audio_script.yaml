audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十四章
      blocks:
        - id: ch01-b01
          speaker: maud_brewster
          text: >-
            真可惜，“幽灵号”的桅杆全没了。要是桅杆还在，我们不就能驾船离开吗？汉弗莱，你说呢？
        - id: ch01-b02
          speaker: narrator
          text: 我一下子兴奋起来，猛地站起身，在屋里来回踱步。
        - id: ch01-b03
          speaker: humphrey
          text: 说不定……说不定真能办到。
        - id: ch01-b04
          speaker: narrator
          text: >-
            莫德望着我，眼里满是期待。她竟这样相信我。那份信任落到身上，立刻变成了新的力量。我想起米什莱说过，女人之于男人，就像大地之于她那传说中的儿子。男人只要倒下去，亲吻大地的胸膛，就会重新强壮起来。直到这一刻，我才真正懂得这句话。莫德就是我永不枯竭的力量和勇气。我只要看她一眼，哪怕只在心里想起她，也会再次变得强大。
        - id: ch01-b05
          speaker: humphrey
          text: >-
            能办到，一定能办到。别人做过的事，我当然也能做。就算从来没有人做过，我还是能做成。
        - id: ch01-b06
          speaker: maud_brewster
          text: 你到底在说什么呀？快行行好，别再卖关子了。你究竟能做成什么？
        - id: ch01-b07
          speaker: humphrey
          text: 不是我，是我们。我们要把桅杆重新竖到“幽灵号”上，然后驾着它离开这里。
        - id: ch01-b08
          speaker: maud_brewster
          text: 汉弗莱！
          emotion: surprised
        - id: ch01-b09
          speaker: narrator
          text: 我为这个念头骄傲极了，仿佛桅杆已经竖好，我们也已经脱了险。
        - id: ch01-b10
          speaker: maud_brewster
          text: 可是，这件事怎么可能做得到？
        - id: ch01-b11
          speaker: humphrey
          text: 我还不知道该怎么做。我只知道，如今无论遇到什么，我都有本事把它做成。
        - id: ch01-b12
          speaker: narrator
          text: 我得意地朝她一笑，得意得有些过了头。莫德垂下眼睛，一时没再说话。
        - id: ch01-b13
          speaker: maud_brewster
          text: 可船上还有拉森船长。
        - id: ch01-b14
          speaker: humphrey
          text: 他已经瞎了，又孤立无援，不足为虑。
        - id: ch01-b15
          speaker: maud_brewster
          text: >-
            可他还有那双可怕的手！你没有忘吧，他一下就从储藏室的活门上跃了过去。
          emotion: fearful
        - id: ch01-b16
          speaker: humphrey
          text: 你也没有忘吧，我照样能悄悄避开他。
        - id: ch01-b17
          speaker: maud_brewster
          text: 可你把鞋丢了。
        - id: ch01-b18
          speaker: humphrey
          text: 我的脚又不在鞋里，你总不能指望它们自己躲开海狼·拉森。
        - id: ch01-b19
          speaker: narrator
          text: >-
            我们都笑了，接着认真盘算起竖桅杆的办法。只要能让“幽灵号”重新扬帆，我们就能回到人类世界。我还模糊记得学生时代学过的物理，这几个月亲手干活，也让我懂得怎样用滑轮装置省力。可等我们走到船边，仔细察看眼前的工程，再亲眼看见那两根巨大的桅杆躺在水里，我几乎泄了气。连一根立着的桅杆都没有，找不到高处来系滑轮和滑车。这就像揪着自己的靴带，要把自己提起来一样。我懂杠杆，却找不到支点。
        - id: ch01-b20
          speaker: narrator
          text: >-
            主桅还剩六十五英尺，底端直径十五英寸，至少有三千磅重。前桅更粗，肯定足有三千五百磅。莫德默默站在旁边，我苦苦想着该从哪里下手，终于构想出水手所说的“人字架”。水手们早就知道这种装置，可我当时身在奋进岛，没人可以请教，只能算是自己重新发明了它。把两根圆材的一端交叉绑住，再竖成倒过来的“V”字，甲板上方就有地方固定起重滑车。要是第一组不够，还可以再接一组。而且，船上还有绞盘。
        - id: ch01-b21
          speaker: narrator
          text: 莫德看出我找到了办法，眼神也跟着暖了起来，里面带着理解，也带着由衷的赞许。
        - id: ch01-b22
          speaker: maud_brewster
          text: 那你准备先做什么？
        - id: ch01-b23
          speaker: humphrey
          text: 先把舷外那堆乱索清理干净。
        - id: ch01-b24
          speaker: narrator
          text: >-
            我指着船边纠缠成团的残骸，听见自己说出“清理乱索”这几个字，心里痛快极了。那语气听上去多么果断，几个字也说得多么有力量。几个月前的汉弗莱·范韦登，嘴里哪会冒出这么地道的水手行话！
        - id: ch01-b25
          speaker: narrator
          text: >-
            我的姿态和语气一定有点像在演戏，因为莫德笑了。她最善于看穿荒唐可笑的东西。无论哪里掺了一点虚假、过分渲染或故作深沉，她都不会错过。正因为有这份敏锐，她的作品才那样沉稳而透彻，也才会受到世人的重视。一个严肃的批评家若兼有幽默感，又善于表达，世人自然会听她说话。莫德正是这样的人。她的幽默感，其实就是艺术家把握分寸的本能。
        - id: ch01-b26
          speaker: maud_brewster
          text: 这句话我肯定在哪里听过。让我想想，大概是在书里吧。
          emotion: happy
        - id: ch01-b27
          speaker: narrator
          text: >-
            我自己也懂得分寸，马上就泄了气。刚才还摆出一副主宰万物的强者姿态，转眼就跌了下来，只剩一身窘迫和惭愧。那滋味别提多难受了。
        - id: ch01-b28
          speaker: narrator
          text: 她立刻伸出手，握住了我的手。
        - id: ch01-b29
          speaker: maud_brewster
          text: 对不起，我不该笑你。
        - id: ch01-b30
          speaker: humphrey
          text: >-
            不用道歉。这对我有好处，我身上的学生气确实太重了。不过先别说这些。我们现在真得把那堆乱索清开。你陪我坐小艇过去，我们马上动手，把它们一根根理顺。
        - id: ch01-b31
          speaker: maud_brewster
          text: 我记得书上是这样写的：“桅楼水手把折刀咬在齿间，清理那堆乱索。”
        - id: ch01-b32
          speaker: narrator
          text: >-
            那天下午，我们一边干活，一边拿这句话说笑。莫德负责稳住小艇，我负责解开那团真正的乱麻。升降索、帆脚索、支索、下拉索、侧支索和前后支索，全让海水来回冲洗，彼此穿插，缠成了死结。我舍不得随意破坏船具，只割断非割不可的绳索。长绳得从帆桁和桅杆下面一次次穿过，升降索和帆脚索也要从滑轮里抽出来。绳子刚在小艇里盘好，碰上下一个绳弯里的结，又得全部放开，重新穿过去。很快，我就从头到脚湿透了。
        - id: ch01-b33
          speaker: narrator
          text: >-
            有些船帆也非剪开不可。帆布浸满了水，沉得惊人，严重考验着我的力气。好在天黑以前，我总算把它们全摊到了海滩上晾晒。等我们停手去吃晚饭时，两个人都累坏了。若只拿眼睛看，一下午的成果似乎微不足道，可我们心里清楚，这一天确实干了一场好活。
        - id: ch01-b34
          speaker: narrator
          text: >-
            第二天一早，我带着莫德这个得力助手钻进“幽灵号”的货舱，清理安放桅杆底端的桅座。我们的工作才刚刚开始，敲打和锤击的声音就把海狼·拉森引来了。
        - id: ch01-b35
          speaker: wolf_larsen
          text: 下面有人吗？
        - id: ch01-b36
          speaker: narrator
          text: >-
            一听见他的声音，莫德马上靠到我身边，像是要从我这里得到保护。我们隔着敞开的舱口说话时，她一直把手搭在我的胳膊上。
        - id: ch01-b37
          speaker: humphrey
          text: 甲板上有人吗？早上好啊。
        - id: ch01-b38
          speaker: wolf_larsen
          text: 你们躲在下面干什么？想替我把船凿沉吗？
        - id: ch01-b39
          speaker: humphrey
          text: 正好相反，我在修你的船。
        - id: ch01-b40
          speaker: wolf_larsen
          text: 可你究竟在修什么鬼东西？
        - id: ch01-b41
          speaker: narrator
          text: 他显然猜不透我在做什么。
        - id: ch01-b42
          speaker: humphrey
          text: 我在做准备，好把桅杆重新竖起来。这事没有多复杂。
        - id: ch01-b43
          speaker: wolf_larsen
          text: 看来你终于学会靠自己的双腿站着了，亨普。
        - id: ch01-b44
          speaker: narrator
          text: 他说完以后，沉默了好一阵，接着又朝舱里喊话。
        - id: ch01-b45
          speaker: wolf_larsen
          text: 不过我得提醒你，亨普，你做不成这件事。
        - id: ch01-b46
          speaker: humphrey
          text: 我当然做得成。你听，我现在不就在做吗？
        - id: ch01-b47
          speaker: wolf_larsen
          text: 可这条船属于我，是我自己的财产。要是我不许你碰呢？
        - id: ch01-b48
          speaker: humphrey
          text: >-
            你忘了，现在你已经不是酵母里最大的一块了。从前你比我强，照你的说法，你可以吃掉我。如今你缩小了，轮到我能吃掉你。你的酵母已经发不起来了。
        - id: ch01-b49
          speaker: narrator
          text: 海狼·拉森发出一声短促、刺耳的冷笑。
        - id: ch01-b50
          speaker: wolf_larsen
          text: >-
            你把我的那套哲学拿来对付我，看来用得很彻底。不过，千万别低估我。为了你自己好，我先警告你。
        - id: ch01-b51
          speaker: humphrey
          text: >-
            你什么时候变成慈善家了？为了我好才来警告我，这可不像你一贯的作风。你敢承认吗？
        - id: ch01-b52
          speaker: narrator
          text: 他根本不理会我的讥讽。
        - id: ch01-b53
          speaker: wolf_larsen
          text: >-
            假如我现在把舱盖扣上呢？上次你在储藏室里骗过了我，这次可别想再来一遍。
        - id: ch01-b54
          speaker: humphrey
          text: >-
            海狼·拉森，我没法朝一个无助又不反抗的人开枪。这一点，你已经证明得让你我都心服口服。不过现在也听清我的警告。你只要做出任何敌对的举动，我马上开枪。这番话与其说是为了你好，不如说是为了保护我自己。此刻我站在这里就能打中你。你要是真打定主意扣上舱盖，那就只管动手试试看。
        - id: ch01-b55
          speaker: wolf_larsen
          text: 我还是不许你碰我的船。我说得很清楚，你不准动它。
        - id: ch01-b56
          speaker: humphrey
          text: >-
            可这是怎么回事？你说船是你的，仿佛所有权是什么神圣的道德权利。你对付别人时，从来没有理会过道德权利。轮到我对付你，难道你还指望我替你维护它吗？
        - id: ch01-b57
          speaker: narrator
          text: >-
            为了看见他的反应，我走到敞开的舱口正下方，抬头望着他。他脸上没有一丝表情，和前些天我躲在暗处观察他时判若两人。那时他还会露出绝望和挣扎，如今什么也看不见了。那双眼睛一眨不眨，只管直直瞪着，让整张脸显得更加僵硬。望着这张脸，实在叫人不舒服。
        - id: ch01-b58
          speaker: wolf_larsen
          text: 如今连最卑微的人都不肯敬重我了，连亨普也一样。
        - id: ch01-b59
          speaker: narrator
          text: 讥讽全藏在他的声音里，那张脸仍旧毫无表情。
        - id: ch01-b60
          speaker: wolf_larsen
          text: 布鲁斯特小姐，你好。
        - id: ch01-b61
          speaker: narrator
          text: >-
            他沉默片刻，忽然说出了这句话。我吃了一惊。莫德一点声音都没有发出，甚至没有动过。难道他的眼睛还看得见一线微光？还是说，他的视力正在恢复？
        - id: ch01-b62
          speaker: maud_brewster
          text: 你好，拉森船长。不过，你怎么知道我在这里？
        - id: ch01-b63
          speaker: wolf_larsen
          text: 当然是听见了你的呼吸。你说，亨普是不是长进了不少？
        - id: ch01-b64
          speaker: maud_brewster
          text: 我可不知道。我认识他的时候，他一直就是现在这个样子。
        - id: ch01-b65
          speaker: narrator
          text: 她说着，微笑着看了我一眼。
        - id: ch01-b66
          speaker: wolf_larsen
          text: 那你真该看看他从前是什么样子。
        - id: ch01-b67
          speaker: humphrey
          text: 大剂量服用海狼·拉森，服用前后，判若两人。
        - id: ch01-b68
          speaker: wolf_larsen
          text: 我再说一次，亨普。你最好别再碰那些东西。
          emotion: angry
        - id: ch01-b69
          speaker: humphrey
          text: 难道你不想跟我们一起逃出去吗？
          emotion: surprised
        - id: ch01-b70
          speaker: wolf_larsen
          text: 不想。我准备死在这里。
        - id: ch01-b71
          speaker: humphrey
          text: 可我们不准备死在这里。
        - id: ch01-b72
          speaker: narrator
          text: 我挑衅地说完，便不再理他，重新挥起工具敲打起来。
