audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER XXXIV
      blocks:
        - id: ch01-b01
          speaker: maud_brewster
          text: >-
            It's a shame the Ghost has lost her masts. If she still had them, we could sail away in her. Don't you think we could, Humphrey?
        - id: ch01-b02
          speaker: narrator
          text: >-
            I jumped to my feet, too excited to sit still. I began pacing back and forth.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I wonder. I wonder.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Maud watched me, and her eyes shone with hope. She had such faith in me, and that faith gave me more strength. I remembered something Michelet had written. To a man, a woman could be what the earth had been to her legendary son. He had only to fall and kiss her breast, and he would be strong again. For the first time, I understood the truth in those words because I was living it. Maud was my constant source of strength and courage. I had only to look at her, or even think of her, and my strength returned.
        - id: ch01-b05
          speaker: narrator
          text: >-
            It can be done. It can be done. Anything other men have done, I can do. And even if no one has ever done this, I can still do it.
        - id: ch01-b06
          speaker: maud_brewster
          text: >-
            What can you do? For goodness' sake, Humphrey, have mercy and tell me.
        - id: ch01-b07
          speaker: narrator
          text: >-
            We can do it. We can put the masts back into the Ghost and sail away.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Maud cried out my name in surprise.
        - id: ch01-b09
          speaker: narrator
          text: >-
            I felt as proud of the idea as if I had already carried it out.
        - id: ch01-b10
          speaker: maud_brewster
          text: >-
            But how could we possibly do that?
        - id: ch01-b11
          speaker: narrator
          text: >-
            I don't know yet. I only know that these days I feel capable of anything.
        - id: ch01-b12
          speaker: narrator
          text: >-
            I gave her a proud smile, too proud a smile. She lowered her eyes and said nothing for a moment.
        - id: ch01-b13
          speaker: maud_brewster
          text: >-
            But Captain Larsen is still here.
        - id: ch01-b14
          speaker: narrator
          text: >-
            He's blind and helpless.
        - id: ch01-b15
          speaker: narrator
          text: >-
            I waved the danger away as though it were no more than a straw.
        - id: ch01-b16
          speaker: maud_brewster
          text: >-
            What about those terrible hands of his? You saw him leap across the lazarette opening.
        - id: ch01-b17
          speaker: narrator
          text: >-
            And you saw me crawl around him without letting him catch me.
        - id: ch01-b18
          speaker: maud_brewster
          text: >-
            You lost your shoes.
        - id: ch01-b19
          speaker: narrator
          text: >-
            You could hardly expect the shoes to escape Wolf Larsen when my feet weren't inside them.
        - id: ch01-b20
          speaker: narrator
          text: >-
            We both laughed.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Then we became serious and began planning how to step the Ghost's masts and return to the world. I dimly remembered the physics I had learned at school. The past few months had also taught me something about ropes and machines that multiply a person's strength.
        - id: ch01-b22
          speaker: narrator
          text: >-
            But when we went down to the Ghost and looked closely at the job, the sight nearly took the courage out of me. The great masts lay in the water. Where could we even begin? If one mast had still been standing, we could have fastened blocks and tackle high on it. Now there was nothing. It was like trying to lift yourself by your own bootstraps. I understood how levers worked, but I had nowhere to brace one.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The mainmast was still sixty-five feet long. Its thick end measured fifteen inches across, and I guessed that it weighed at least three thousand pounds. The foremast was thicker and must have weighed thirty-five hundred. I asked myself again where I could begin. Maud waited silently beside me while I worked out a device that sailors call shears.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Sailors already knew the device, but there on Endeavour Island, I invented it for myself. I could cross two spars, lash their ends together, and raise them like an upside-down V. That would give me a high point above the deck where I could fasten the hoisting tackle. If I needed more lifting power, I could attach a second tackle to the first. And we still had the windlass.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Maud saw that I had found an answer, and warmth came into her eyes.
        - id: ch01-b26
          speaker: maud_brewster
          text: >-
            What are you going to do first?
        - id: ch01-b27
          speaker: narrator
          text: >-
            Clear that raffle.
        - id: ch01-b28
          speaker: narrator
          text: >-
            I pointed to the wreckage tangled over the side. The firm sound of those words pleased me. Clear that raffle! Imagine such a sailor's phrase coming from the Humphrey Van Weyden of a few months before.
        - id: ch01-b29
          speaker: narrator
          text: >-
            I must have looked and sounded rather theatrical, because Maud smiled. She had a sharp eye for anything ridiculous. Whenever something false or overdone appeared, she felt it at once. That gift had brought balance and insight to her writing and made her work valuable. A serious critic who had humor and knew how to express it was bound to win the world's attention, and Maud had done so. Her humor was really an artist's sense of proportion.
        - id: ch01-b30
          speaker: maud_brewster
          text: >-
            I'm sure I've come across that phrase somewhere before. In a book, perhaps.
          emotion: happy
        - id: ch01-b31
          speaker: narrator
          text: >-
            I had some sense of proportion myself. My grand pose collapsed at once, and the proud master of matter became a miserably embarrassed schoolboy.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Maud reached for my hand immediately.
        - id: ch01-b33
          speaker: maud_brewster
          text: >-
            Oh, I'm so sorry.
          emotion: sad
        - id: ch01-b34
          speaker: narrator
          text: >-
            You don't need to be. It's good for me. There's still far too much of the schoolboy in me. But none of that matters now. We truly do have to clear that raffle. Come out in the boat with me, and we'll start straightening the wreckage.
        - id: ch01-b35
          speaker: maud_brewster
          text: >-
            When the topmen clear the raffle with their clasp-knives in their teeth.
        - id: ch01-b36
          speaker: narrator
          text: >-
            She quoted the line back at me, and for the rest of the afternoon we laughed while we worked.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Maud kept the boat in place while I attacked the tangle. And what a tangle it was. Halyards, sheets, guys, downhauls, shrouds, and stays had all been washed back and forth by the sea. They ran over and under one another, twisting into knots around the booms and masts. I cut only what I had to. The rest had to be worked free. I passed the long ropes beneath and around the spars and pulled halyards and sheets out of their fittings. I coiled each line in the boat, only to uncoil it when another loop had to pass through a knot. Before long, I was soaked through.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Some of the sails did have to be cut. The canvas was heavy with water and tested my strength badly. Still, before night came, I got all of it spread along the beach to dry. When we stopped for supper, Maud and I were exhausted. We had done good work, though anyone looking at the wreckage might have thought we had achieved very little.
        - id: ch01-b39
          speaker: narrator
          text: >-
            The next morning, Maud came with me into the Ghost's hold. With her helping, I began clearing the sockets where the bottoms of the masts had stood. We had barely started when my hammering brought Wolf Larsen to the hatch.
        - id: ch01-b40
          speaker: wolf_larsen
          text: >-
            Hello down there!
        - id: ch01-b41
          speaker: narrator
          text: >-
            At the sound of his voice, Maud quickly moved closer for protection and laid one hand on my arm. Then we began calling back and forth.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Hello on deck. Good morning.
        - id: ch01-b43
          speaker: wolf_larsen
          text: >-
            What are you doing below? Are you trying to sink my ship for me?
        - id: ch01-b44
          speaker: narrator
          text: >-
            Just the opposite. I'm repairing her.
        - id: ch01-b45
          speaker: wolf_larsen
          text: >-
            What in thunder are you repairing?
        - id: ch01-b46
          speaker: narrator
          text: >-
            The puzzlement was plain in his voice.
        - id: ch01-b47
          speaker: narrator
          text: >-
            I'm getting everything ready to step the masts again.
        - id: ch01-b48
          speaker: narrator
          text: >-
            I said it lightly, as if nothing could have been simpler.
        - id: ch01-b49
          speaker: wolf_larsen
          text: >-
            It sounds as though you're finally standing on your own legs, Hump.
        - id: ch01-b50
          speaker: narrator
          text: >-
            He fell silent for a while. Then his voice came down to us again.
        - id: ch01-b51
          speaker: wolf_larsen
          text: >-
            But listen, Hump. You can't do it.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Yes, I can. In fact, I've already begun.
        - id: ch01-b53
          speaker: wolf_larsen
          text: >-
            This is my vessel. It belongs to me. What will you do if I forbid it?
        - id: ch01-b54
          speaker: narrator
          text: >-
            You've forgotten something. You aren't the biggest piece of the ferment anymore. Once, you could eat me, as you liked to put it. But you've grown smaller, and now I can eat you. The yeast has gone stale.
        - id: ch01-b55
          speaker: narrator
          text: >-
            He gave a short, unpleasant laugh.
        - id: ch01-b56
          speaker: wolf_larsen
          text: >-
            So you're turning my own philosophy against me for all it's worth. Just don't make the mistake of thinking too little of me. I'm warning you for your own good.
        - id: ch01-b57
          speaker: narrator
          text: >-
            When did you become a friend to mankind? If this warning is really for my own good, you must admit you're behaving very strangely for a man with your beliefs.
        - id: ch01-b58
          speaker: wolf_larsen
          text: >-
            What if I shut the hatch on you right now? You won't trick me again the way you did in the lazarette.
        - id: ch01-b59
          speaker: narrator
          text: >-
            For the first time, I addressed him sternly by the name everyone knew best.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Wolf Larsen, I cannot shoot a helpless man who isn't resisting me. You and I have both seen the proof of that. But now I'm warning you, more for my good than yours. The instant you make a hostile move, I will shoot. I can shoot you from where I stand. If you want to close that hatch, go ahead and try.
        - id: ch01-b61
          speaker: wolf_larsen
          text: >-
            Even so, I forbid this. I absolutely forbid you to interfere with my ship.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Man, you speak of owning this ship as if ownership gave you some moral right. You never cared about moral rights when you dealt with anyone else. Surely you don't imagine I'll honor them now when I deal with you.
        - id: ch01-b63
          speaker: narrator
          text: >-
            I stepped beneath the open hatch so I could see him. His face showed nothing. Without expression, those fixed and staring eyes made it even worse to look at than it had been when I secretly watched him before.
        - id: ch01-b64
          speaker: wolf_larsen
          text: >-
            And now no one is low enough, not even Hump, to show him any respect.
        - id: ch01-b65
          speaker: narrator
          text: >-
            The sneer came entirely through his voice. His face did not change at all.
        - id: ch01-b66
          speaker: wolf_larsen
          text: >-
            How do you do, Miss Brewster?
        - id: ch01-b67
          speaker: narrator
          text: >-
            His sudden greeting startled me. Maud had made no sound. She had not even moved. Did some small trace of sight remain to him? Or was his vision returning?
        - id: ch01-b68
          speaker: maud_brewster
          text: >-
            How do you do, Captain Larsen? Please tell me, how did you know I was here?
        - id: ch01-b69
          speaker: wolf_larsen
          text: >-
            I heard you breathing, of course. Hump is improving, don't you think?
        - id: ch01-b70
          speaker: narrator
          text: >-
            Maud smiled at me before she answered.
        - id: ch01-b71
          speaker: maud_brewster
          text: >-
            I don't know. I've never known him to be any different.
        - id: ch01-b72
          speaker: wolf_larsen
          text: >-
            Then you should have seen him before.
        - id: ch01-b73
          speaker: narrator
          text: >-
            That's what taking Wolf Larsen in large doses will do. You can see the difference before and after.
        - id: ch01-b74
          speaker: wolf_larsen
          text: >-
            I'm telling you once more, Hump. You had better leave everything alone.
          emotion: angry
        - id: ch01-b75
          speaker: narrator
          text: >-
            But don't you want to escape too?
        - id: ch01-b76
          speaker: narrator
          text: >-
            I could hardly believe that he did not.
        - id: ch01-b77
          speaker: wolf_larsen
          text: >-
            No. I mean to die here.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Well, we don't.
        - id: ch01-b79
          speaker: narrator
          text: >-
            I answered him defiantly, then began hammering again.
