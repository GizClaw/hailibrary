audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十二章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            莫德朝我走来时，我已经知道她为何而来。我看了她整整十分钟，她一直在认真地和轮机长交谈。等她来到身边，我先示意她别出声，再领她走到掌舵人听不见的地方。她脸色苍白，嘴唇紧抿，神情坚定。那双本来就很大的眼睛，因为心里有了明确的目的，此刻显得更大了，仿佛一直看进我的内心。我不由得胆怯，也有些惶恐。她是来审视汉弗莱·范韦登的灵魂，可自从上了“幽灵号”，这个人的所作所为实在没什么值得自豪。
        - id: ch01-b02
          speaker: narrator
          text: >-
            我们一路走到艉楼前沿，她在那里停下，转过身来正对着我。我又朝四周仔细看了一遍，确定附近没有任何人能听见我们的谈话。
        - id: ch01-b03
          speaker: humphrey
          text: 出什么事了？
        - id: ch01-b04
          speaker: narrator
          text: 我尽量轻声地问她，可她那苍白而紧绷的脸上，坚定的神色丝毫没有松动。
        - id: ch01-b05
          speaker: maud_brewster
          text: >-
            今天早晨的事，我明白，那多半只是意外。可是我刚和哈斯金斯先生谈过。他说，我们获救的那天，就在我还待在舱里的时候，有两个人被人故意淹死了。那是谋杀。
        - id: ch01-b06
          speaker: narrator
          text: >-
            她的语气里有一个没有直接说出口的问题，眼神却已经在责问我，仿佛我就是做下这件事的凶手，至少也是参与其中的同谋。
        - id: ch01-b07
          speaker: humphrey
          text: 他说得没错。那两个人确实是被谋杀的。
        - id: ch01-b08
          speaker: maud_brewster
          text: 可你就任由他们被杀？
          emotion: surprised
        - id: ch01-b09
          speaker: humphrey
          text: 准确地说，是我根本阻止不了。
        - id: ch01-b10
          speaker: narrator
          text: 我的语气依旧温和。她却把“试过”两个字咬得很重，声音里还带着恳求。
        - id: ch01-b11
          speaker: maud_brewster
          text: 可你总试过阻止他，对不对？……不，你没有。我知道了。可你为什么连试都不试？
        - id: ch01-b12
          speaker: narrator
          text: 我耸了耸肩。
        - id: ch01-b13
          speaker: humphrey
          text: >-
            布鲁斯特小姐，你才刚来到这个小世界，还不明白这里究竟按什么规矩运转。你从外面带来了许多美好的观念，什么人性、男子汉的品格、人的行为准则，还有诸如此类的东西。可到了这里，你会发现自己原先想的全都不对。至少，我已经亲身体会到了。
        - id: ch01-b14
          speaker: narrator
          text: 我不由得叹了口气。她仍不肯相信，只是摇头。
        - id: ch01-b15
          speaker: humphrey
          text: 那你说，我该怎么办？拿刀、拿枪，或者拿斧头去杀了他？
        - id: ch01-b16
          speaker: narrator
          text: 她吃了一惊，身子微微向后一缩。
        - id: ch01-b17
          speaker: maud_brewster
          text: 不！我不是这个意思！
          emotion: surprised
        - id: ch01-b18
          speaker: humphrey
          text: 那我该怎么办？杀了我自己？
        - id: ch01-b19
          speaker: maud_brewster
          text: 你说的全是物质上的办法。人还有道德勇气，而道德勇气绝不会不起作用。
        - id: ch01-b20
          speaker: humphrey
          text: >-
            原来你是劝我别杀他，也别杀自己，只要等着他来杀我。可道德勇气在这个漂浮的小世界里一文不值。被杀的两个人当中，利奇有非同寻常的道德勇气，约翰逊也一样。那份勇气不但没在危急时帮到他们，反而毁了他们。我要是拿出自己仅有的那一点勇气，也会落到同样的下场。
        - id: ch01-b21
          speaker: narrator
          text: 她想开口，我抬手拦住了她。
        - id: ch01-b22
          speaker: humphrey
          text: >-
            布鲁斯特小姐，你一定要看清楚，这个人是个魔鬼。他没有良心。在他眼里，没有什么是神圣的，也没有哪件事可怕到让他不敢去做。当初他一时兴起，把我扣在船上。现在我还活着，也只因为他一时兴起。我什么都没做，也什么都做不了，因为我是这个魔鬼的奴隶，你现在也一样。因为我想活下去，你也会想活下去。因为我既斗不过他，也战胜不了他，你同样做不到。
        - id: ch01-b23
          speaker: narrator
          text: 莫德没有打断，只等着我说下去。
        - id: ch01-b24
          speaker: humphrey
          text: >-
            我还能怎么办？我扮演的只能是弱者。弱者只能沉默，忍受羞辱，你也只能这样。如果我们想活命，这已经是最好的选择。战斗并不永远由强者取胜，可我们没有力量和他正面交锋，只能藏起真心，想办法用计谋取胜，只要还有机会赢。你若肯听我的，就这么做吧。我可以坦白告诉你，我的处境已经很危险，你的处境还要危险得多。我们必须站在一起，又不能让人看出我们站在一起，只能暗中结盟。我不能公开帮你。不管我受到什么羞辱，你也要保持沉默。不要和他起冲突，不要违逆他的意思。无论心里多厌恶，都得面带笑容，装出友好的样子。
        - id: ch01-b25
          speaker: narrator
          text: 她困惑地抬手擦过额头。
        - id: ch01-b26
          speaker: maud_brewster
          text: 我还是不明白。
        - id: ch01-b27
          speaker: narrator
          text: >-
            船中部，拉森正和拉蒂默来回踱步。他的目光已经朝我们飘来，我只得用不容争辩的口气打断莫德。
        - id: ch01-b28
          speaker: humphrey
          text: 你必须照我说的做。过不了多久，你就会知道我是对的。
        - id: ch01-b29
          speaker: narrator
          text: >-
            莫德发现我不安地瞥了我们正在谈论的那个人一眼。容我自夸一句，大概我说话时那份急切和认真终于打动了她，让她相信这绝不是无关紧要的劝告。
        - id: ch01-b30
          speaker: maud_brewster
          text: 那么，我究竟该怎么做？
        - id: ch01-b31
          speaker: humphrey
          text: >-
            能少拿出一点道德勇气，就少拿出一点。别唤起他的敌意。对他友好些，和他聊天，和他谈文学，谈艺术。他喜欢这些。你会发现他很有兴趣听，而且绝不是傻瓜。为了你自己，也要尽量避开船上那些残暴的事，能不亲眼看见就别看。这样你演起自己的角色，会容易得多。
        - id: ch01-b32
          speaker: maud_brewster
          text: 也就是说，我要撒谎。嘴里说谎，行动也在说谎。
        - id: ch01-b33
          speaker: narrator
          text: 她的声音平稳，却满是反抗。拉森离开拉蒂默，朝我们走来。我急得几乎绝望，只能压低声音，匆匆再劝她。
        - id: ch01-b34
          speaker: humphrey
          text: >-
            求你了，你一定要明白。你过去对人和世事的一切经验，在这里都不管用。你必须从头开始。我知道，我也看得出来，在你种种待人的办法里，你一向习惯用眼睛驾驭别人，让道德勇气从眼神里说话。你已经用眼睛驾驭过我，也用它们命令过我。可千万别用这一套对付拉森。控制一头狮子都比控制他容易，而他只会拿你取笑。他会——
        - id: ch01-b35
          speaker: narrator
          text: >-
            就在我说到一半时，拉森已经踏上艉楼，来到我们身边。我只得把没说完的话生生截断，立刻换了一个话题。
        - id: ch01-b36
          speaker: humphrey
          text: >-
            我一直很骄傲，因为是我发现了他。编辑怕他，出版商也不肯要他的作品，可我知道他的才华。后来，那首了不起的《熔炉》一举轰动。他的天才得到了证明，也证明我的判断没错。
        - id: ch01-b37
          speaker: maud_brewster
          text: 而那首诗是登在报纸上的。
        - id: ch01-b38
          speaker: narrator
          text: 她接得十分机敏。
        - id: ch01-b39
          speaker: humphrey
          text: 它的确碰巧在报纸上见了天日，可不是因为杂志编辑们没机会读到它。我们刚才在谈哈里斯。
        - id: ch01-b40
          speaker: wolf_larsen
          text: >-
            哦，对。我记得《熔炉》。满篇都是漂亮的情怀，还对人类那些幻想抱着无所不能的信念。对了，范韦登先生，你最好去看看厨房佬。他一直说难受，躺着也不安稳。
        - id: ch01-b41
          speaker: narrator
          text: >-
            拉森就这样毫不客气地把我赶下艉楼。我去看马格里奇，才发现我给他的那剂吗啡已经让他睡得很沉。我没有急着回甲板。等我终于上去时，莫德正兴致勃勃地和拉森交谈。看到这一幕，我的确很欣慰。她在照我的劝告行事。可我心里又轻轻一震，隐隐有些受伤。我苦苦求她去做这件事，她明明表现得那样厌恶，却还是能够真的做到。
