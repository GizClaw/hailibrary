audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful and self-possessed, with quiet moral conviction
        timbre: clear, warm, and refined
        pace: measured
        pitch: medium-high
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER XXII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I knew why she was coming toward me. For ten minutes, I had watched her speaking earnestly with the engineer. Now I motioned for silence and led her beyond the helmsman's hearing. Her face was pale and firm. Purpose made her large eyes seem larger still as they searched mine. I felt timid and uneasy. She had come to look into Humphrey Van Weyden's soul, and since arriving on the Ghost, he had little reason to be proud of what she would find there.
        - id: ch01-b02
          speaker: narrator
          text: >-
            We went to the forward edge of the poop. She turned to face me, and I looked around to be certain no one could hear us.
        - id: ch01-b03
          speaker: narrator
          text: >-
            What is it?
        - id: ch01-b04
          speaker: narrator
          text: >-
            I spoke gently, but the determination in her face did not soften.
        - id: ch01-b05
          speaker: maud_brewster
          text: >-
            I can understand that what happened this morning was mostly an accident. But I've been talking to Mr. Haskins. He says that on the day we were rescued, while I was still in the cabin, two men were deliberately drowned. They were murdered.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Her voice turned the statement into a question. She faced me as if I had committed the murder myself, or at least helped in it.
        - id: ch01-b07
          speaker: narrator
          text: >-
            What he told you is true. The two men were murdered.
        - id: ch01-b08
          speaker: maud_brewster
          emotion: angry
          text: >-
            And you allowed it to happen!
        - id: ch01-b09
          speaker: narrator
          text: >-
            It would be fairer to say that I couldn't stop it.
        - id: ch01-b10
          speaker: narrator
          text: >-
            I still kept my voice gentle.
        - id: ch01-b11
          speaker: maud_brewster
          text: >-
            But did you try to stop it?
        - id: ch01-b12
          speaker: narrator
          text: >-
            She stressed the word try, and now I heard a small pleading note in her voice.
        - id: ch01-b13
          speaker: maud_brewster
          text: >-
            No. You didn't. I can see that already. But why didn't you try?
        - id: ch01-b14
          speaker: narrator
          text: >-
            I shrugged.
        - id: ch01-b15
          speaker: narrator
          text: >-
            You must remember, Miss Brewster, that you've only just entered this little world. You don't understand the laws that rule it yet. You came here with fine ideas about humanity, courage, and decent conduct. On this ship, those ideas don't fit the world around us. I've learned that myself.
        - id: ch01-b16
          speaker: narrator
          text: >-
            A sigh escaped me. She shook her head, unable to believe what I was saying.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Then tell me what I should do. Should I take a knife, a gun, or an axe and kill him?
        - id: ch01-b18
          speaker: narrator
          text: >-
            She drew back a little.
        - id: ch01-b19
          speaker: maud_brewster
          text: >-
            No. Of course not that.
        - id: ch01-b20
          speaker: narrator
          text: >-
            What should I do, then? Kill myself?
        - id: ch01-b21
          speaker: maud_brewster
          text: >-
            You're speaking only in terms of physical force. Moral courage exists too, and it always has an effect.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Ah, I see. I mustn't kill him or myself. I should simply let him kill me.
        - id: ch01-b23
          speaker: narrator
          text: >-
            I smiled and raised a hand before she could answer.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Moral courage is worthless in this little floating world. Leach, one of the murdered men, had more than most. So did Johnson. Their courage did not save them. It destroyed them. If I used what little moral courage I have, it would destroy me too.
        - id: ch01-b25
          speaker: narrator
          text: >-
            You need to understand this clearly, Miss Brewster. That man is a monster. He has no conscience. Nothing is sacred to him, and there is nothing too terrible for him to do. A whim made him keep me aboard in the first place. Another whim is the only reason I am still alive. I do nothing because I can do nothing. I am his slave now, just as you are. I want to live, as you will want to live. I cannot fight him and overcome him, and neither can you.
        - id: ch01-b26
          speaker: narrator
          text: >-
            She waited in silence for me to continue.
        - id: ch01-b27
          speaker: narrator
          text: >-
            So what is left? I must play the weak man's part. I keep quiet and endure the shame, and you must do the same. If we want to live, that is the best we can do. Strength doesn't win every battle. We don't have the strength to fight him. We must hide what we feel and try to defeat him through cunning, if we can defeat him at all.
        - id: ch01-b28
          speaker: narrator
          text: >-
            If you will take my advice, we must stand together without seeming to. Our alliance has to remain secret. My own position is dangerous, and I must tell you plainly that yours is even worse. I cannot openly take your side. Whatever humiliation I suffer, you must stay silent too. We cannot make scenes with him, and we cannot cross his will. However much it disgusts us, we must keep smiling and behave as his friends.
        - id: ch01-b29
          speaker: narrator
          text: >-
            She passed a hand across her forehead, looking puzzled.
        - id: ch01-b30
          speaker: maud_brewster
          text: >-
            I still don't understand.
        - id: ch01-b31
          speaker: narrator
          text: >-
            You must do what I tell you.
        - id: ch01-b32
          speaker: narrator
          text: >-
            I cut her off with sudden authority. Wolf Larsen was pacing amidships with Latimer, and I had seen his gaze drift toward us.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Follow my advice. Before long, you'll see that I was right.
        - id: ch01-b34
          speaker: maud_brewster
          text: >-
            Then what exactly am I supposed to do?
        - id: ch01-b35
          speaker: narrator
          text: >-
            She had noticed my anxious glance toward Wolf Larsen. I like to think the earnestness in my voice had impressed her too.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Put aside as much moral courage as you can. Don't make him your enemy. Be friendly. Talk to him about literature and art, because he enjoys those things. He listens closely, and he is no fool. For your own sake, avoid seeing as much of this ship's brutality as you can. That will make your part easier to play.
        - id: ch01-b37
          speaker: maud_brewster
          text: >-
            So I am to lie. I must lie in what I say and in everything I do.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Her voice was steady and rebellious. Wolf Larsen had left Latimer and was coming toward us. I grew desperate.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Please, please, you have to understand me. Everything your life has taught you about people and the world is useless here. You must begin again. I can see one way you've managed people before. You let your moral courage speak through your eyes. You've already managed me with those eyes. You've commanded me with them. But never try that with Wolf Larsen. You might as well try to control a lion. Wolf Larsen would only make a mock of you.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Wolf Larsen stepped onto the poop and joined us. I turned the conversation at once.
        - id: ch01-b41
          speaker: narrator
          text: >-
            I've always been proud that I discovered him. The editors were afraid of him, and the publishers wanted nothing to do with him. But I knew his worth. When his Forge became such a magnificent success, his genius proved that my judgment had been right.
        - id: ch01-b42
          speaker: maud_brewster
          text: >-
            And yet that poem first appeared in a newspaper.
        - id: ch01-b43
          speaker: narrator
          text: >-
            It did appear in a newspaper, but only after the magazine editors had been given their chance to see it.
        - id: ch01-b44
          speaker: narrator
          text: >-
            We were discussing Harris.
        - id: ch01-b45
          speaker: narrator
          text: >-
            I offered Wolf Larsen the explanation as if nothing else had passed between us.
        - id: ch01-b46
          speaker: wolf_larsen
          text: >-
            Oh, yes. I remember the Forge. Pretty sentiments from beginning to end, and a mighty faith in all the illusions people cling to. By the way, Mr. Van Weyden, you should go and look at Cooky. He's restless and complaining.
        - id: ch01-b47
          speaker: narrator
          text: >-
            With that, he dismissed me from the poop. I found Mugridge sleeping soundly under the morphine I had given him, so I did not hurry back on deck.
        - id: ch01-b48
          speaker: narrator
          text: >-
            When I returned, Miss Brewster was deep in lively conversation with Wolf Larsen. The sight pleased me. She was following my advice. Even so, I felt a small shock, almost a hurt, because she could do the very thing I had begged of her, though she had so plainly hated the thought of doing it.
