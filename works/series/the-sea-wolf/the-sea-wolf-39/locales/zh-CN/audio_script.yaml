audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十九章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            启程的日子终于来了。奋进岛上已经没有什么值得我们留下。“幽灵号”竖起了粗短的桅杆，也挂好了那些破旧的船帆。我亲手做出的东西，没有一样好看，却样样结实管用。望着这一切，我第一次觉得，自己成了一个有力量的人。我真想放声喊出来：这是我做成的，全是我亲手做成的！
        - id: ch01-b02
          speaker: narrator
          text: >-
            可我和莫德常常会同时想到一件事。我们正准备升起主帆，她先把我心里的话说了出来。
        - id: ch01-b03
          speaker: maud_brewster
          text: 汉弗莱，你想想，这一切真的是你亲手做成的呀！
        - id: ch01-b04
          speaker: humphrey
          text: 还有另外两只手呢，两只小小的手。你可别告诉我，这句话也是你父亲说过的。
        - id: ch01-b05
          speaker: narrator
          text: 莫德笑着摇头，举起双手，仔细端详起来。
        - id: ch01-b06
          speaker: maud_brewster
          text: 这双手再也洗不干净了。风吹日晒留下的粗糙，恐怕也永远变不回柔软了。
          emotion: sad
        - id: ch01-b07
          speaker: humphrey
          text: 那么，这些泥污和粗糙，就是你的荣誉勋章。
        - id: ch01-b08
          speaker: narrator
          text: >-
            我说着，把她的双手握进掌心。虽然早就下定决心要克制自己，可要不是她一下子把手抽走，我一定已经吻上那双亲爱的、辛苦劳作过的手。
        - id: ch01-b09
          speaker: narrator
          text: >-
            我们之间的友谊正在变得微妙，甚至有些颤抖。很久以来，我一直死死压住自己的爱情，如今它却反过来制伏了我。它先逼我的眼睛说出了秘密，现在又来夺走我的舌头，连嘴唇也不肯放过。我的心里仿佛响起了号角，催着我奔向她。一阵无法抵挡的风吹过来，我的身体也跟着摇晃，不知不觉向她倾去。
        - id: ch01-b10
          speaker: narrator
          text: >-
            她知道。要不然，她不会那么快地抽回双手。可在低下头、转开目光以前，她还是忍不住看了我一眼。那一眼很快，却像在寻找答案。
        - id: ch01-b11
          speaker: narrator
          text: >-
            我用甲板滑车把升帆索接到前面的起锚机上，同时吊起主帆的帆顶和帆喉。办法虽然笨，却很快见了成效。没过多久，前帆也升了起来，在风里扑簌簌地抖着。
        - id: ch01-b12
          speaker: humphrey
          text: >-
            锚一离开海底，在这么窄的地方，我们根本来不及把它收上船。还没收完，船就会撞上礁石。
        - id: ch01-b13
          speaker: maud_brewster
          text: 那我们怎么办？
        - id: ch01-b14
          speaker: humphrey
          text: >-
            把锚丢下。我一动手，你就得第一次操作起锚机。我会马上跑去掌舵，你同时把船首三角帆升起来。
        - id: ch01-b15
          speaker: narrator
          text: >-
            这套动作，我已经在脑子里反复演练过二十遍。船首三角帆的升帆索已经接在起锚机上，我知道莫德有能力升起这面要紧的帆。劲风正灌进小湾。海面虽然平静，我们却必须快得不能再快，才有机会安全驶出去。
        - id: ch01-b16
          speaker: narrator
          text: >-
            我敲松卸扣的销钉，锚链立刻咆哮着穿过锚链孔，冲进海里。我飞奔到船尾，转动舵轮。“幽灵号”的船帆第一次兜住了风，船身猛地一倾，就像突然醒了过来。船首三角帆不断升高，刚一吃住风，船头便摆了出去。我赶紧反向转过几根舵轮辐条，这才把船稳住。
        - id: ch01-b17
          speaker: narrator
          text: >-
            我给船首三角帆设计了自行换舷的帆脚索，所以莫德不用分心照管。可我把舵轮猛打到底时，她还在升帆。“幽灵号”笔直扑向海滩，而海滩只有一箭之遥。那一刻，真叫人揪心。
        - id: ch01-b18
          speaker: narrator
          text: >-
            好在船很听话。它以船尾为轴，迎着风转了过去。船帆和缩帆索顿时噼啪乱响，猛烈翻飞。这声音落在我耳朵里，却好听极了。紧接着，船帆从另一舷兜住风，“幽灵号”又向前驶去。
        - id: ch01-b19
          speaker: narrator
          text: >-
            莫德完成任务，来到船尾，站在我身旁。小帽歪戴在她被风吹乱的头发上，双颊因为用力泛着红，眼睛因激动睁得又大又亮。清新而咸涩的海风扑在她脸上，她的鼻翼轻轻翕动。那双棕色眼睛像受惊的鹿眼，露出我从未见过的敏锐和狂野。
        - id: ch01-b20
          speaker: narrator
          text: >-
            她微微张着嘴，屏住呼吸。眼前的“幽灵号”正猛冲向内湾入口的岩壁，随后迎风转向，终于扬帆驶进安全水域。
        - id: ch01-b21
          speaker: narrator
          text: >-
            我在海豹猎场做大副的经历，这时全派上了用场。我把船驶出内湾，沿外湾海岸走了一次长长的抢风航程。再次换舷后，“幽灵号”终于朝开阔的大海驶去。
        - id: ch01-b22
          speaker: narrator
          text: >-
            海洋的胸膛一起一伏，“幽灵号”接住了那节奏，也像在跟着呼吸。它平稳地爬上一道道宽阔如脊背的波浪，再从上面滑下去。这一天原本乌云密布，阴沉沉的，可太阳忽然穿过云层，像是给了我们一个吉祥的征兆。
        - id: ch01-b23
          speaker: narrator
          text: >-
            阳光落在弯曲的海滩上。我们曾在那里和妻妾群的主人搏斗，杀死霍鲁希基。整座奋进岛都亮了起来。就连西南方那座阴森的岬角，也不再那么可怕。被海水飞沫打湿的地方，这里一道，那里一道，全在阳光下闪闪发亮。
        - id: ch01-b24
          speaker: humphrey
          text: 想起这座岛，我永远都会觉得骄傲。
        - id: ch01-b25
          speaker: narrator
          text: 莫德像女王一样昂起了头。
        - id: ch01-b26
          speaker: maud_brewster
          text: 亲爱的，亲爱的奋进岛！我永远都会爱它。
        - id: ch01-b27
          speaker: humphrey
          text: 我也一样。
        - id: ch01-b28
          speaker: narrator
          text: >-
            我们的目光仿佛非得相遇，只有那一眼，才能把一切都告诉对方。可两双眼睛依依不舍地挣开了，终究没有碰在一起。沉默随之落下来，尴尬得几乎让人受不了。最后，还是我先开了口。
        - id: ch01-b29
          speaker: humphrey
          text: 看看上风方向那些黑云。还记得吗？我昨晚就说过，气压计正在往下降。
        - id: ch01-b30
          speaker: maud_brewster
          text: 太阳也看不见了。
        - id: ch01-b31
          speaker: narrator
          text: >-
            她的眼睛仍旧望着我们的岛。我们在那里证明，人可以征服物质。也正是在那里，我们得到了男女之间所能拥有的、最真挚的情谊。
        - id: ch01-b32
          speaker: humphrey
          text: 那就松开帆脚索，直奔日本吧！顺风满帆，你知道的，那句话大概就是这么说的。
          emotion: happy
        - id: ch01-b33
          speaker: narrator
          text: >-
            我把舵轮固定好，跑到前面，放松前帆和主帆的帆脚索，再收紧帆桁滑车，把所有东西都调到适合船尾斜来风的位置。风很强，实在强得厉害。可只要还值得冒险，我就决心一直跑下去。
        - id: ch01-b34
          speaker: narrator
          text: >-
            可惜，顺风疾驶时没法固定舵轮，我必须彻夜掌舵。莫德坚持要来替我，但海浪一汹涌，她的力气就不足以控制舵轮。即使她有那样的力气，也不可能这么快学会掌舵的诀窍。
        - id: ch01-b35
          speaker: narrator
          text: >-
            发现自己帮不上忙，她似乎伤透了心。不过，她很快又振作起来。她把一副副滑车、一根根升帆索，还有所有散乱的绳子全都盘好。她还要去厨房做饭，铺床，照料海狼·拉森。一天快结束时，她又把船舱和统舱彻底打扫了一遍。
        - id: ch01-b36
          speaker: narrator
          text: >-
            整整一夜，只有我一个人守着舵轮。风一直在增强，不急，却一刻不停。海浪也越抬越高。清晨五点，莫德送来热咖啡和她烤的饼干。七点，她又端来一顿丰盛滚烫的早餐，让我重新有了力气。
        - id: ch01-b37
          speaker: narrator
          text: >-
            到了白天，风还是那样缓慢而稳定地加强。它阴沉又固执，像是下定决心，要一直吹下去，越吹越猛，永远也不停。“幽灵号”劈开白沫，飞快地把一英里又一英里抛在身后。我敢肯定，船速至少有十一节。
        - id: ch01-b38
          speaker: narrator
          text: >-
            这么好的势头，我实在舍不得放弃。可到了黄昏，我已经筋疲力尽。我的身体虽然处在极好的状态，连续掌舵三十六小时也到了极限。莫德一再恳求我把船顶风停住。我也明白，要是夜里风浪照这样增强，很快我们就连停船也办不到了。
        - id: ch01-b39
          speaker: narrator
          text: >-
            暮色越来越深，我终于让“幽灵号”调转船头，迎向风。那一刻，我一面如释重负，一面又舍不得刚才那段飞驰的航程。
        - id: ch01-b40
          speaker: narrator
          text: >-
            我没有想到，只靠一个人的力量给三面帆缩帆，会艰难到这个地步。先前顺着风逃跑，我还没有真正感觉到它的威力。如今船不再顺风疾驰，我才明白风有多凶猛。那份明白让人悲哀，几乎让人绝望。
        - id: ch01-b41
          speaker: narrator
          text: >-
            风一次次挫败我，从手里硬生生夺走帆布。我拼命搏斗十分钟才取得的一点进展，转眼就被毁得干干净净。到了晚上八点，我只来得及把前帆缩到第二道缩帆索。十一点时，事情还是没有多少进展。
        - id: ch01-b42
          speaker: narrator
          text: >-
            我的每一根手指尖都在流血，指甲也从根部折断。黑暗里，疼痛和极度的疲惫终于压垮了我。我偷偷哭了起来，没让莫德知道。
        - id: ch01-b43
          speaker: narrator
          text: >-
            最后，我绝望地放弃给主帆缩帆，决定试试看，只靠缩到最小的前帆让船顶风停住。又过了三个小时，我才把主帆和船首三角帆收拢、扎牢。
        - id: ch01-b44
          speaker: narrator
          text: >-
            凌晨两点，我几乎累死了。风浪和苦工像要把生命从身体里一点点挤出去，只给我留下勉强够用的一点意识。可我知道，办法成功了。那面缩到最小的前帆果然管用。“幽灵号”紧紧迎着风，没有一点要横过船身、跌进波谷的迹象。
        - id: ch01-b45
          speaker: narrator
          text: >-
            我饿得发慌，莫德却怎么劝也不能让我吃下东西。食物刚送到嘴边，我就睡着了。痛苦地惊醒时，才发现这个动作竟然还没有做完。我困得全身瘫软，纵帆船又颠簸得厉害。莫德只能扶住椅子上的我，免得我被甩到地板上。
        - id: ch01-b46
          speaker: narrator
          text: >-
            从厨房到船舱的那段路，我一点也不记得。莫德搀扶着、带领着的，不过是一个梦游的人。等我重新有了知觉，自己已经躺在铺位里，靴子也脱掉了。究竟过去了多久，我完全猜不出来。
        - id: ch01-b47
          speaker: narrator
          text: >-
            四周一片漆黑。我的身体又僵又痛，床单只要碰到那些可怜的手指尖，我就疼得喊出声。显然还没到早晨，我闭上眼睛，又睡了过去。那时我根本不知道，自己已经睡过了整整一圈时钟，而外面又到了夜晚。
        - id: ch01-b48
          speaker: narrator
          text: >-
            我再次醒来，心里还埋怨这一觉睡得太糟。划亮火柴一看，表上是午夜十二点。可我明明到三点才离开甲板！我很快想到了答案。难怪睡得断断续续，原来我已经睡了二十一小时。
        - id: ch01-b49
          speaker: narrator
          text: >-
            我静静听了一阵“幽灵号”的动静。海浪不断撞击船身，甲板上方传来风的低吼。听完这些，我侧过身，又安安稳稳地睡到早晨。
        - id: ch01-b50
          speaker: narrator
          text: >-
            七点钟起床时，我没有看见莫德，以为她正在厨房准备早餐。到了甲板上，我发现“幽灵号”只靠那一小片帆，航行得好极了。厨房里的炉火烧得正旺，水也开了，可莫德并不在那里。
        - id: ch01-b51
          speaker: narrator
          text: >-
            我在统舱找到了她。她站在海狼·拉森的铺位旁。我望向他。这个男人曾经站在生命的最高峰，如今却被猛地摔下来，活埋在自己的身体里。他的处境比死亡更悲惨。可那张毫无表情的脸上，似乎有了一种从未见过的松弛。莫德抬起眼睛看我，我立刻明白了。
        - id: ch01-b52
          speaker: humphrey
          text: 他的生命在风暴里熄灭了。
        - id: ch01-b53
          speaker: maud_brewster
          text: 可他仍然活着。
        - id: ch01-b54
          speaker: narrator
          text: 她的声音里满是坚定的信念。
        - id: ch01-b55
          speaker: humphrey
          text: 他的生命力太强大了。
        - id: ch01-b56
          speaker: maud_brewster
          text: 是的。可现在，那股力量再也不能束缚他了。他已经成了一个自由的灵魂。
        - id: ch01-b57
          speaker: humphrey
          text: 他的灵魂的确自由了。
        - id: ch01-b58
          speaker: narrator
          text: 我牵起莫德的手，带她走上甲板。
        - id: ch01-b59
          speaker: narrator
          text: >-
            那天夜里，风暴终于过去了。它和来时一样，慢慢减弱。第二天吃过早餐，我把海狼·拉森的遗体吊上甲板，准备让他海葬。风依旧很猛，浪也仍然很高。海水不停越过船舷，又从排水孔涌进来，甲板始终泡在水里。
        - id: ch01-b60
          speaker: narrator
          text: >-
            一阵狂风猛击纵帆船，船身一直倾斜到下风那侧的船舷没入海里。索具间的呼啸声陡然拔高，变成了尖叫。我和莫德站在齐膝深的水中。我脱下帽子，准备送海狼·拉森最后一程。
        - id: ch01-b61
          speaker: humphrey
          text: 葬礼祷文，我只记得一句。那就是，“遗体将被投入大海。”
        - id: ch01-b62
          speaker: narrator
          text: >-
            莫德看着我，又惊讶，又震骇。可一种似曾相识的精神猛地抓住了我。海狼·拉森曾经怎样为另一个人举行葬礼，我也要怎样送他离开。
        - id: ch01-b63
          speaker: narrator
          text: >-
            我抬起舱口盖的一端。裹在帆布里的遗体脚朝前，滑进了海中。绑在上面的铁块把它拖向深处，转眼就不见了。
        - id: ch01-b64
          speaker: maud_brewster
          text: 再见，路西法，骄傲的灵魂。
          emotion: sad
        - id: ch01-b65
          speaker: narrator
          text: >-
            她说得太轻，声音完全被狂风的喊叫盖住了。可我看见她的嘴唇在动，也知道她说了什么。
        - id: ch01-b66
          speaker: narrator
          text: >-
            我们攀住下风一侧的船舷，一点点向船尾挪去。我无意间朝下风方向望了一眼。恰好这时，“幽灵号”被一道海浪高高托起。我看得清清楚楚，两三英里以外，有一艘小汽船正朝我们驶来。它一面横摇纵颠，一面用船头迎着海浪。
        - id: ch01-b67
          speaker: narrator
          text: >-
            那艘船全身漆成黑色。猎人们讲过偷猎时的经历，从他们的话里，我认出那是一艘美国缉私船。我赶紧指给莫德看，随后带她躲到船尾高甲板上，避开风浪。
        - id: ch01-b68
          speaker: narrator
          text: >-
            我正要冲下去打开存放旗帜的柜子，忽然想起一件事。给“幽灵号”重新安装索具时，我居然忘了预备升旗索。
        - id: ch01-b69
          speaker: maud_brewster
          text: 我们不需要求救信号。他们只要看见我们，就够了。
        - id: ch01-b70
          speaker: humphrey
          text: 我们得救了。
        - id: ch01-b71
          speaker: narrator
          text: 我说得庄重又严肃，可紧接着，喜悦便奔涌出来。
        - id: ch01-b72
          speaker: humphrey
          text: 我简直不知道，自己该不该高兴。
          emotion: happy
        - id: ch01-b73
          speaker: narrator
          text: >-
            我望着莫德。这一次，我们的目光再也没有躲开。我们向彼此靠近。还没等我明白过来，双臂已经把她紧紧拥进怀里。
        - id: ch01-b74
          speaker: humphrey
          text: 还需要我亲口说出来吗？
        - id: ch01-b75
          speaker: maud_brewster
          text: 不需要。不过，你要是说出来，一定会很甜，很甜。
          emotion: happy
        - id: ch01-b76
          speaker: narrator
          text: >-
            她的双唇迎向我的亲吻。也不知道想象施了什么奇异的魔法，“幽灵号”船舱里的那一幕忽然回到眼前。那时，她把一根手指轻轻按在我的嘴唇上，叫我别说话。
        - id: ch01-b77
          speaker: humphrey
          text: 我的女人，我唯一的小小的女人。
          emotion: happy
        - id: ch01-b78
          speaker: narrator
          text: >-
            我一边说，一边用空着的那只手轻抚她的肩头。天下所有相爱的人都懂得怎样这样爱抚，可从来没有一个人，是在学校里学会的。
        - id: ch01-b79
          speaker: maud_brewster
          text: 我的男人。
          emotion: happy
        - id: ch01-b80
          speaker: narrator
          text: >-
            她抬眼望了我一瞬。她的眼睑因激动微微颤抖，随即垂下来，遮住双眼。她把头靠在我的胸前，幸福地轻叹一声。
        - id: ch01-b81
          speaker: narrator
          text: 我朝缉私船看去。它已经离得很近，一艘小艇正被放到水里。
        - id: ch01-b82
          speaker: humphrey
          text: 亲爱的，吻我一下。在他们赶来以前，再吻我一下。
          emotion: happy
        - id: ch01-b83
          speaker: maud_brewster
          text: 然后，让他们把我们从彼此手里救走。
          emotion: happy
        - id: ch01-b84
          speaker: narrator
          text: >-
            她接过我的话，露出一个可爱得不能再可爱的微笑。我从没见她笑得这样俏皮。因为这一次，那份俏皮里全是爱情。
