audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER XXXIX
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            At last, the day came for us to leave. Nothing held us on Endeavour Island anymore. The Ghost's short masts stood in place, and her patched-up sails were bent to them. My work was strong, though none of it was pretty. I looked over it all and knew it would serve. For the first time, I felt the power of what my own hands could do.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Inside, I wanted to shout, "I did it! I did it with my own hands!"
        - id: ch01-b03
          speaker: narrator
          text: >-
            Maud and I often spoke each other's thoughts. As we got ready to hoist the mainsail, she spoke this one for me.
        - id: ch01-b04
          speaker: maud_brewster
          text: >-
            Humphrey, just think. You did all of this with your own hands.
        - id: ch01-b05
          speaker: narrator
          text: >-
            I had two more hands helping me. Two small ones. And don't tell me that was another phrase your father used.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Maud laughed and shook her head. Then she held up her hands for us to inspect.
        - id: ch01-b07
          speaker: maud_brewster
          text: >-
            I'll never get them clean again. And they'll never be soft after all this weather.
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: >-
            Then the dirt and the rough skin will be your badges of honor.
        - id: ch01-b09
          speaker: narrator
          text: >-
            I held her hands in mine. In spite of every promise I had made to myself, I would have kissed them if she had not pulled them away so quickly.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The feeling between us had begun to tremble with something more than friendship. I had controlled my love for a long time, but now it was taking control of me. It had already made my eyes speak. Now it was reaching for my tongue and my lips. Those faithful little hands had worked so hard beside me, and I ached to kiss them. My whole being called me toward her like a blast of bugles. I leaned closer without even knowing I had moved.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Maud knew. She had to know. She pulled her hands away, but not before giving me one quick, searching look. Then she turned her eyes aside.
        - id: ch01-b12
          speaker: narrator
          text: >-
            I had rigged deck tackles so the halyards ran forward to the windlass. With that arrangement, I raised both ends of the mainsail at once. It was clumsy but quick. Soon the foresail was up too, snapping in the wind.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Once we pull the anchor free in this narrow cove, we'll never get it aboard in time. We'll be on the rocks first.
        - id: ch01-b14
          speaker: maud_brewster
          text: >-
            Then how will we get away?
        - id: ch01-b15
          speaker: narrator
          text: >-
            We'll let the anchor go. The moment I release it, you must work the windlass for the first time. You raise the jib while I run straight to the wheel.
        - id: ch01-b16
          speaker: narrator
          text: >-
            I had gone over this maneuver in my mind twenty times. The jib halyard was fastened to the windlass, and I knew Maud could raise that vital sail. A brisk wind blew into the cove. The water was calm, but once we began, every movement had to be fast.
        - id: ch01-b17
          speaker: narrator
          text: >-
            I knocked the bolt from the shackle. The chain thundered through the hawse-hole and vanished into the sea. I raced aft and turned the wheel. Wind struck the sails, the Ghost leaned over, and the schooner seemed to wake from the dead. The jib climbed. When it filled, her bow swung away, and I eased the wheel back a few spokes to steady her.
        - id: ch01-b18
          speaker: narrator
          text: >-
            I had arranged the jib sheet to carry the sail across by itself, so Maud did not need to tend it. She was still cranking the jib upward when I spun the wheel hard down. For one frightening moment, the Ghost charged straight at the beach, no more than a stone's throw away.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Then she answered the helm. Her bow swung into the wind. Canvas and reef points cracked and flapped above us, and I had never heard a more welcome sound. The sails filled on the other tack, and the Ghost turned away from the beach.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Her job finished, Maud came aft and stood beside me. A small cap sat on her windblown hair. Work had flushed her cheeks, and excitement shone in her wide brown eyes. She drew in the sharp salt air and held her breath as the Ghost rushed toward the wall of rock at the cove's entrance. At the last moment, the schooner swept into the wind, turned, and sailed into safe water.
        - id: ch01-b21
          speaker: narrator
          text: >-
            My time as first mate on the sealing grounds served me well. I cleared the inner cove, made a long tack beside the outer shore, then came about once more. The Ghost pointed toward the open sea.
        - id: ch01-b22
          speaker: narrator
          text: >-
            She met the broad breathing of the ocean and seemed to breathe with it. Smoothly, she rose over each wide-backed wave and slipped down the other side. The day had been gray, but now the sun broke through. Its light fell on the curving beach where Maud and I had faced the rulers of the seal herd and killed the young bachelor seals. The whole island brightened. Even the dark southwestern headland looked less severe, and wet places on its face flashed in the sun.
        - id: ch01-b23
          speaker: narrator
          text: >-
            I'll always remember that island with pride.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Maud lifted her head like a queen before she answered.
        - id: ch01-b25
          speaker: maud_brewster
          text: >-
            Dear, dear Endeavour Island. I will always love it.
        - id: ch01-b26
          speaker: narrator
          text: >-
            And so will I.
        - id: ch01-b27
          speaker: narrator
          text: >-
            I answered too quickly. Our eyes almost met in full understanding, but both of us looked away. An awkward silence followed.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Look at those black clouds upwind. Remember what I told you last night? The barometer was falling.
        - id: ch01-b29
          speaker: maud_brewster
          text: >-
            And now the sun has disappeared.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Her eyes still rested on the island. There we had learned how much our hands could master, and there we had become the truest kind of comrades a man and woman could be.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Then it's loose sheets and away for Japan! A fair wind and a flowing sheet, as the sailors say. Or something like that.
          emotion: happy
        - id: ch01-b32
          speaker: narrator
          text: >-
            I tied the wheel in place and ran forward. I slackened the fore and main sheets, hauled on the boom tackles, and trimmed the sails for a wind coming over our quarter. The breeze was already strong, but I decided to run before it as long as I dared.
        - id: ch01-b33
          speaker: narrator
          text: >-
            With the wind behind us, though, the wheel could not be left tied. I would have to steer through the night. Maud insisted on taking a turn, but the heavy sea was too strong for her, and steering it took more experience than she could gain in a few minutes. The discovery crushed her at first. Then she set herself to other work. She coiled the tackles, halyards, and loose ropes. She cooked our meals, made the beds, cared for Wolf Larsen, and ended the day by cleaning the cabin and steerage from end to end.
        - id: ch01-b34
          speaker: narrator
          text: >-
            I stayed at the wheel all night without relief. The wind rose slowly and steadily, and the waves rose with it. At five in the morning, Maud brought me hot coffee and biscuits she had baked. At seven, she gave me a large, steaming breakfast that put life back into me.
        - id: ch01-b35
          speaker: narrator
          text: >-
            All through the day, the wind kept building with the same steady purpose. It seemed determined to blow harder, and then harder still. The Ghost raced on through the foam, eating up the miles. I was sure we were making at least eleven knots. The speed was too precious to waste.
        - id: ch01-b36
          speaker: narrator
          text: >-
            By nightfall, I could go no farther. I was in excellent condition, but thirty-six hours at the wheel had brought me to the end of my strength. Maud begged me to stop the schooner and ride out the weather. I also knew that if wind and sea kept growing through the night, we would soon lose our chance to do it. So, as twilight darkened, I turned the Ghost toward the wind. I was glad to do it, and sorry to give up our speed.
        - id: ch01-b37
          speaker: narrator
          text: >-
            I had not understood what it would cost one man to shorten three sails. Running with the gale had hidden its full strength. The instant we stopped running, I felt how savagely it blew. Every attempt I made was beaten back. The wind tore the canvas from my hands and destroyed in a second what ten minutes of brutal work had gained.
        - id: ch01-b38
          speaker: narrator
          text: >-
            By eight o'clock, I had managed only to put a second reef in the foresail. At eleven, I had made no more progress. Blood ran from the ends of all my fingers, and my nails were broken down to the tender flesh. Pain and exhaustion made me weep there in the darkness, but I hid the tears so Maud would not know.
        - id: ch01-b39
          speaker: narrator
          text: >-
            At last, in desperation, I gave up trying to reef the mainsail. I would test whether the Ghost could ride the storm under the close-reefed foresail alone. It took me three more hours to bind down the mainsail and jib. At two in the morning, I was almost dead on my feet, with the life nearly beaten and worked out of me. I had just enough sense left to understand that the experiment had succeeded.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The small patch of foresail held us close to the wind. The Ghost stayed there and showed no wish to swing broadside into the valleys between the waves.
        - id: ch01-b41
          speaker: narrator
          text: >-
            I was starving, but Maud could not make me eat. I fell asleep with food in my mouth. I would lift another bite, sleep before it reached me, then wake in misery and find my hand still hanging there. The schooner pitched so violently that Maud had to hold me in the chair to keep me from being thrown onto the floor.
        - id: ch01-b42
          speaker: narrator
          text: >-
            I remembered nothing of the trip from the galley to the cabin. Maud guided and supported a man who was already walking in his sleep. When awareness returned, I was in my bunk with my boots off. The cabin was dark. Every part of me felt stiff and bruised, and I cried out when the blankets touched my torn fingertips.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Morning had not come, or so I thought. I shut my eyes and went back to sleep. I did not know that I had already slept all the way around the clock, and that it was night again.
        - id: ch01-b44
          speaker: narrator
          text: >-
            I woke once more, bothered that I could not sleep properly. I lit a match and checked my watch. It said midnight, though I had not left the deck until three. The mystery lasted only a moment. I had slept for twenty-one hours. No wonder my rest felt broken.
        - id: ch01-b45
          speaker: narrator
          text: >-
            For a while, I listened to the Ghost. Seas pounded her hull, and the wind gave a muffled roar above me. Then I rolled onto my side and slept peacefully until morning.
        - id: ch01-b46
          speaker: narrator
          text: >-
            I got up at seven. There was no sign of Maud, so I supposed she was making breakfast in the galley. On deck, I found the Ghost riding beautifully under her scrap of sail. A fire burned in the galley, and the water was boiling, but Maud was not there.
        - id: ch01-b47
          speaker: narrator
          text: >-
            I found her in the steerage beside Wolf Larsen's bunk. I looked down at the man who had fallen from the very height of life. He had been buried alive inside his helpless body, in a state worse than death. Now there was a new softness in his blank face. Maud looked at me, and I understood.
        - id: ch01-b48
          speaker: narrator
          text: >-
            His life went out during the storm.
        - id: ch01-b49
          speaker: maud_brewster
          text: >-
            But he is still alive.
          emotion: calm
        - id: ch01-b50
          speaker: narrator
          text: >-
            Her voice held a faith without limit.
        - id: ch01-b51
          speaker: narrator
          text: >-
            He had too much strength.
        - id: ch01-b52
          speaker: maud_brewster
          text: >-
            Yes, but that strength cannot hold him prisoner now. His spirit is free.
          emotion: calm
        - id: ch01-b53
          speaker: narrator
          text: >-
            Yes. His spirit is free now.
        - id: ch01-b54
          speaker: narrator
          text: >-
            I took her hand and led her up on deck.
        - id: ch01-b55
          speaker: narrator
          text: >-
            The storm ended that night. It faded as slowly as it had risen. After breakfast the next morning, I brought Wolf Larsen's body onto the deck for burial. The wind was still strong, and great seas rolled past us. Water poured over the rail and surged back through the scuppers, washing the deck again and again.
        - id: ch01-b56
          speaker: narrator
          text: >-
            A sudden gust struck the schooner. She leaned until her lower rail went under, and the roar in the rigging climbed to a scream. Maud and I stood knee-deep in water as I uncovered my head.
        - id: ch01-b57
          speaker: narrator
          text: >-
            I remember only one line from the burial service. It says, "And the body shall be cast into the sea."
        - id: ch01-b58
          speaker: narrator
          text: >-
            Maud stared at me, startled and shocked. But a memory of something I had once witnessed took hold of me. I felt driven to bury Wolf Larsen in the same manner he had used for another man.
        - id: ch01-b59
          speaker: narrator
          text: >-
            I raised one end of the hatch cover. The body, wrapped in canvas, slid feet first into the sea. Iron weights pulled it under. Wolf Larsen was gone.
        - id: ch01-b60
          speaker: maud_brewster
          text: >-
            Good-bye, Lucifer. Proud spirit.
          emotion: sad
        - id: ch01-b61
          speaker: narrator
          text: >-
            Her whisper vanished beneath the shouting wind. I could not hear it, but I saw her lips move and knew what she had said.
        - id: ch01-b62
          speaker: narrator
          text: >-
            We gripped the lower rail and worked our way toward the stern. I happened to look downwind just as the Ghost rose on top of a wave. For a moment, my view was clear. Two or three miles away, a small steamship rolled and pitched as it drove straight into the sea toward us.
        - id: ch01-b63
          speaker: narrator
          text: >-
            The ship was painted black. I remembered the hunters' stories about their illegal sealing trips and recognized her as a United States revenue cutter. I showed her to Maud, then quickly helped Maud aft to the safety of the raised deck.
        - id: ch01-b64
          speaker: narrator
          text: >-
            I started below for the flags. Then I remembered my mistake. When I rigged the Ghost, I had forgotten to provide a line for raising a signal flag.
        - id: ch01-b65
          speaker: maud_brewster
          text: >-
            We don't need a distress flag. They only need to spot us.
        - id: ch01-b66
          speaker: narrator
          text: >-
            We are saved.
          emotion: happy
        - id: ch01-b67
          speaker: narrator
          text: >-
            I spoke the words quietly and solemnly. Then joy rushed through me.
        - id: ch01-b68
          speaker: narrator
          text: >-
            I hardly know if I want to be glad.
          emotion: happy
        - id: ch01-b69
          speaker: narrator
          text: >-
            I looked at Maud. This time our eyes did not try to escape. We leaned toward each other, and before I knew it, my arms were around her.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Must I say it?
        - id: ch01-b71
          speaker: maud_brewster
          text: >-
            You don't have to. But it would be sweet to hear you say it. So sweet.
          emotion: happy
        - id: ch01-b72
          speaker: narrator
          text: >-
            Her lips met mine. In that moment, a scene from the Ghost's cabin flashed through my mind. Once, she had laid her fingers gently against my lips and said, "Hush, hush."
        - id: ch01-b73
          speaker: narrator
          text: >-
            My woman. My one small woman.
          emotion: happy
        - id: ch01-b74
          speaker: narrator
          text: >-
            With my free hand, I stroked her shoulder in the way lovers know without ever being taught.
        - id: ch01-b75
          speaker: maud_brewster
          text: >-
            My man.
          emotion: happy
        - id: ch01-b76
          speaker: narrator
          text: >-
            She looked at me for one trembling instant. Then her eyelids fluttered down, hiding her eyes, and she nestled her head against my chest with a small, happy sigh.
        - id: ch01-b77
          speaker: narrator
          text: >-
            I looked back toward the cutter. It was very close now, and a boat was being lowered from its side.
        - id: ch01-b78
          speaker: narrator
          text: >-
            One kiss, my love. One more before they reach us.
          emotion: happy
        - id: ch01-b79
          speaker: maud_brewster
          text: >-
            And rescue us from ourselves.
          emotion: happy
        - id: ch01-b80
          speaker: narrator
          text: >-
            She finished my thought with the most lovely smile I had ever seen on her. It was playful in a new way, because it was playful with love.
