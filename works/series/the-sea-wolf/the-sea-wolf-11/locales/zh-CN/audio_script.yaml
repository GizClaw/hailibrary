audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    louis:
      display_name: 路易
      tts:
        delivery: 爽朗而善谈，说到凶险时带着老水手的警觉
        timbre: 浑厚而饱经风霜的成年男声
        pace: 明快，句尾带着自然的起伏
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            “幽灵号”已经驶到太平洋航线的最南端，开始慢慢转向西北。听说，我们要先去一座孤岛装满淡水，再赶往日本沿海捕猎。猎手们反复试过步枪和霰弹枪，直到满意才停手。划艇手和掌舵手做好斜桁帆，还用皮革和编绳裹住桨与桨架。这样，小艇接近海豹时便不会出声。用利奇的说法，所有东西都“齐整得像苹果派”。
        - id: ch01-b02
          speaker: narrator
          text: >-
            利奇的胳膊已经长好，不过伤疤会留一辈子。托马斯·马格里奇怕他怕得要命，天一黑就不敢上甲板。水手舱里还有两三桩争端一直悬着。路易告诉我，水手们的闲话总会一路传到船尾。两个把这些话传过去的告密者，已经让自己的同伴狠狠揍了一顿。
        - id: ch01-b03
          speaker: narrator
          text: >-
            一说到约翰逊的前景，路易便满腹疑虑地摇头。约翰逊在他那条艇上划桨，说话向来太直，还为自己名字的读音跟海狼·拉森冲突过好几次。前几夜，他在船中部痛打了大副约翰森。打那以后，大副终于肯把他的名字念对了。当然，约翰逊绝不可能也这样痛打海狼·拉森。
        - id: ch01-b04
          speaker: narrator
          text: >-
            路易又告诉我许多有关死神拉森的事，和船长先前说的完全相合。到了日本沿海，我们大概会遇见他。
        - id: ch01-b05
          speaker: louis
          text: >-
            真碰上了，可得提防狂风暴雨。那两兄弟恨起彼此来，就像两只狼崽子。
        - id: ch01-b06
          speaker: narrator
          text: >-
            死神拉森指挥“马其顿号”，那是船队里唯一的捕海豹蒸汽船。别的纵帆船只有六条小艇，它却有十四条。传闻说船上甚至装着大炮，还说它四处突袭，干的尽是离奇勾当。有人说它把鸦片偷运进美国，把武器偷运进中国，还诱掠岛民做苦工，甚至公然当海盗。这些话实在叫人难信。可我又不能不信，因为路易从不对我撒谎。捕海豹的门道，还有各支船队里的人，他几乎无所不知。
        - id: ch01-b07
          speaker: narrator
          text: >-
            从船头、厨房到统舱、船尾，整条船都一样。这的确是一艘地狱之舟，人人都在凶狠争斗，拿性命相搏。斯莫克和亨德森的旧怨未解，猎手们料定他们随时会拔枪。海狼·拉森却说，只要真打起来，他便杀掉活下来的那个。
        - id: ch01-b08
          speaker: narrator
          text: >-
            他坦白说，这种处置跟道德毫无关系。猎手们要互相杀了吃掉，他也不在乎，只是捕猎季里还需要他们活着。他们只要等到这一季结束，他便答应送大家一场盛大狂欢。那时尽管清算所有旧账，活下来的人把死掉的人扔进海里，再编个故事，说失踪的那些人是在海上遇难的。连那些作恶多端的猎手，也被他的冷酷吓住了。他们显然都十分怕他。
        - id: ch01-b09
          speaker: narrator
          text: >-
            马格里奇如今像挨过打的狗一样服从我，我却一直暗暗怕他。他的勇气来自恐惧，这种怪异的勇气，我自己也懂。说不定哪一刻，它就会压倒恐惧，逼他来杀我。
        - id: ch01-b10
          speaker: narrator
          text: >-
            我的膝盖好多了，只是常常一痛就是很久。被拉森捏过的胳膊也在慢慢恢复，不再那么僵硬。除此之外，我身体好极了，自己也能清楚感觉到。肌肉越来越结实，也越来越粗壮。可那双手实在惨不忍睹，像被开水烫过，还长满倒刺。指甲断裂变色，甲缘的嫩肉上仿佛冒出了菌状赘物。身上也生了疖子，大概是船上的吃食造成的。我从前从没有过这种毛病。
        - id: ch01-b11
          speaker: narrator
          text: >-
            前两天晚上，我竟看见海狼·拉森在读《圣经》。开航时遍寻不到的一本书，后来从死去的大副箱子里翻了出来。我正想知道他会从中读出什么，他便念起了《传道书》。那低沉悲凉的声音在狭小舱房里回荡，仿佛说的正是他自己的心思，我听得动也不能动。
        - id: ch01-b12
          speaker: narrator
          text: >-
            他没有受过教育，却真正懂得怎样把文字的深意念出来。那声音，我至今还听得见，也知道自己永远不会忘记。人类最原始的忧郁，就在他的声音里颤动。
        - id: ch01-b13
          speaker: wolf_larsen
          text: >-
            我为自己积蓄金银，收藏列王与各省的珍宝。我得了男女歌唱者，也享尽世人喜爱的各样乐器。
        - id: ch01-b14
          speaker: wolf_larsen
          text: >-
            我日渐昌盛，胜过从前在耶路撒冷的众人。我的智慧仍与我同在。
        - id: ch01-b15
          speaker: wolf_larsen
          text: >-
            后来，我察看双手所做的一切，还有劳碌成就的事业。谁知全是虚空，全是捕风，在日光之下没有半点益处。
        - id: ch01-b16
          speaker: wolf_larsen
          text: >-
            所有人遭遇的都一样。义人和恶人，好人与洁净的人，还有不洁净的人，献祭与不献祭的人，最后并没有分别。好人和罪人一样，起誓的和怕起誓的也一样。
        - id: ch01-b17
          speaker: wolf_larsen
          text: >-
            日光之下有一件祸患，就是众人都走向同一个结局。人活着，心里充满邪恶与狂妄。随后，他们便归入死人之中。
        - id: ch01-b18
          speaker: wolf_larsen
          text: >-
            只要还和活人相连，就还有指望。因为活狗胜过死狮。
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            活人知道自己会死，死人却什么也不知道。他们得不到赏赐，连名字也会被忘掉。
        - id: ch01-b20
          speaker: wolf_larsen
          text: >-
            他们的爱、恨与嫉妒早已消灭。日光之下的一切事，他们永远不再有份。
        - id: ch01-b21
          speaker: narrator
          text: >-
            他把一根手指夹在书页间，合上书，抬头看我。
        - id: ch01-b22
          speaker: wolf_larsen
          text: >-
            汉普，你都听见了。那位在耶路撒冷做过以色列王的传道者，想的和我一样。你说我是悲观主义者，可还有比这更黑暗的悲观吗？一切都是虚空，都是捕风。日光之下毫无益处。愚人、智者，洁净的、不洁净的，罪人、圣徒，所有人只有一个结局，那就是死。而他说，死是一件祸患。
        - id: ch01-b23
          speaker: wolf_larsen
          text: >-
            传道者爱生命，他不想死。所以他说，活狗胜过死狮。比起坟墓里一动不动的寂静，他宁可要虚空和捕风。我也一样。匍匐蠕动确实卑贱得像猪，可若连动也不能，只能变成土块和石头，光是想一想都叫人恶心。我体内那股活生生的生命也憎恶它。生命的本质就是运动，是拥有运动的力量，也清楚知道自己拥有这股力量。活着本身不能满足人，可一想到前面等着的是死亡，就更不能满足了。
        - id: ch01-b24
          speaker: humphrey
          text: >-
            你比欧玛尔还要糟。他至少熬过青年时的苦闷，找到了满足，还把自己的唯物主义变成了一件快乐的事。
        - id: ch01-b25
          speaker: wolf_larsen
          text: >-
            欧玛尔是谁？
        - id: ch01-b26
          speaker: narrator
          text: >-
            于是，那一天、第二天、第三天，我都没再干活。拉森读过的书很杂，却从没碰见《鲁拜集》。对他来说，这简直像发现了一座宝藏。那些四行诗，我大概记得三分之二，剩下的也很容易拼凑出来。我们会为一节诗谈上几个钟头。
        - id: ch01-b27
          speaker: narrator
          text: >-
            他从每一节诗中读出悔恨的哀号和反抗的激情，我却无论如何也找不到这些东西。也许是因为我吟诵时，自有一种欢快的音调。他的记性极好，一首四行诗听到第二遍，常常甚至第一遍，就能完全记住。可同样的句子由他念出，竟充满不安和激烈的反叛，几乎能叫人相信他的解释才是真的。
        - id: ch01-b28
          speaker: narrator
          text: >-
            我很好奇他会最爱哪一首。结果并不意外，他偏偏挑中一首因诗人一时烦躁而生的诗。它和那位波斯诗人知足温厚的生活哲学完全不同。
        - id: ch01-b29
          speaker: humphrey
          text: >-
            未经我问，何处匆匆催我来？未经我问，又向何方催我去！唉，多少杯这禁饮的美酒，方能淹没那无礼的记忆！
        - id: ch01-b30
          speaker: wolf_larsen
          text: >-
            妙极！妙极！这才是要旨。无礼！再也找不到更贴切的词了。
          emotion: happy
        - id: ch01-b31
          speaker: narrator
          text: >-
            我怎么反驳、怎么否认都没有用。他的论点像洪水一样涌来，把我彻底淹没。
        - id: ch01-b32
          speaker: wolf_larsen
          text: >-
            生命的本性就是这样。它一旦知道自己终有一天不能再活，必定会反抗，根本控制不了自己。传道者说，生命和生命所做的一切都是虚空和捕风，是祸患。可是死亡让人连虚空、连捕风都不能了。在他眼里，这才是更大的祸患。一章接一章，那个降临所有人的相同结局，一直折磨着他。
        - id: ch01-b33
          speaker: wolf_larsen
          text: >-
            欧玛尔如此，我如此，你也如此。厨子磨刀要对付你时，你也反抗死亡。你怕死。构成你的那股生命比你自己更强，它不肯死。你说有永生的本能，我说有求生的本能。它只想活下去。死亡一旦靠近，变得巨大又清楚，它就会压倒你所谓的永生本能。
        - id: ch01-b34
          speaker: wolf_larsen
          text: >-
            在你身上，它已经压倒过一次，你无法否认。只因为一个发疯的伦敦佬厨子磨起了刀。
        - id: ch01-b35
          speaker: wolf_larsen
          text: >-
            你现在怕他，也怕我，这同样无法否认。假如我像这样掐住你的喉咙，再像这样，一点点挤出你的生命……
        - id: ch01-b36
          speaker: narrator
          text: >-
            他的手忽然扼住我的脖子，我立刻透不过气。
        - id: ch01-b37
          speaker: wolf_larsen
          text: >-
            你的永生本能已经不见了。那股渴望活着的本能却挣动起来，逼你拼命救自己。怎么样？我看见你眼里的死亡恐惧了。你的胳膊在空中乱抓，使出那点可怜的力气，只想活下去。你的手抓着我的胳膊，可我只觉得像一只蝴蝶停在那里。
        - id: ch01-b38
          speaker: wolf_larsen
          text: >-
            你的胸膛一起一伏，舌头伸了出来，皮肤越来越暗，眼前也开始发花。你在喊，活下去！活下去！活下去！你要此时此地活着，不是等到来世。你怀疑自己能不能永生了，是不是？哈！哈！你根本不确定，也不敢拿它冒险。你只敢相信这一世是真的。
        - id: ch01-b39
          speaker: wolf_larsen
          text: >-
            啊，越来越黑了。死亡的黑暗正在围住你。你将不复存在，不能感觉，也不能运动。黑暗从头顶压下来，又从脚下漫上来。你的目光定住了，眼睛蒙上一层白翳。我的声音听来又轻又远，你已经看不见我的脸。
        - id: ch01-b40
          speaker: wolf_larsen
          text: >-
            可你还在我手里挣扎。你的腿在踢，身体像蛇一样蜷成一团，胸膛还在起伏，还在拼命撑动。活下去！活下去！活下去——
        - id: ch01-b41
          speaker: narrator
          text: >-
            后面的话，我再也听不见了。他刚刚描绘得那么真切的黑暗，终于把我的意识完全抹去。等我醒来时，自己正躺在地板上。他坐在一旁抽着雪茄，若有所思地看我，眼里又闪着那种熟悉的好奇之光。
        - id: ch01-b42
          speaker: wolf_larsen
          text: >-
            怎么样，我说服你了吗？来，喝一口这个。我还有几个问题要问你。
        - id: ch01-b43
          speaker: narrator
          text: >-
            我躺在地上摇了摇头。喉咙痛得厉害，我费了很大力气才挤出一句话。
        - id: ch01-b44
          speaker: humphrey
          text: >-
            你的论证太……呃……太有力了。
        - id: ch01-b45
          speaker: wolf_larsen
          text: >-
            半个钟头以后你就没事了。我答应你，不再来这种亲身示范。现在起来吧，你可以坐到椅子上。
        - id: ch01-b46
          speaker: narrator
          text: >-
            我终究只是这头怪物手里的一件玩具。就这样，我们又谈起了欧玛尔和传道者，一直谈到深更半夜才停下来。
