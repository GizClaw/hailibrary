audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
    louis:
      display_name: Louis
      tts:
        delivery: jovial and confidential, rushing into ominous excitement
        timbre: round, weathered, and resonant
        pace: lively with rolling rhythms
        pitch: medium-low
  chapters:
    - id: ch01
      title: CHAPTER XI
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Ghost had reached the southernmost point of her great curve across the Pacific. Now she was beginning to turn west and north. The rumor was that we would stop at some lonely island to fill the water casks, then sail on to hunt seals along the coast of Japan.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The hunters had practiced with rifles and shotguns until they were satisfied. The boat-pullers and steerers had made their spritsails. They wrapped the oars and rowlocks in leather and braided cord, so the boats could creep up on seals without a sound. As Leach put it, everything was in apple-pie order.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Leach's arm had healed well, though he would carry the scar for life. Thomas Mugridge was terrified of him and would not go on deck after dark. Two or three quarrels were always simmering in the forecastle. Louis told me that sailors' gossip kept reaching the after part of the ship, and two informers had already taken severe beatings from their shipmates.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Louis was especially doubtful about Johnson, the boat-puller in his own boat. Johnson spoke his mind too freely. He had clashed with Wolf Larsen several times over the way the captain pronounced his name. A few nights before, Johnson had beaten Johansen on the middle deck. Since then, the mate had called him by his proper name. Johnson could never beat Wolf Larsen, of course.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Louis also told me more about Death Larsen, and it agreed with the little Wolf had said. We could expect to meet his brother near Japan.
        - id: ch01-b06
          speaker: louis
          text: >-
            And watch out for storms when we do. Those two hate each other like the wolf pups they are.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Death Larsen commanded the Macedonia, the only steam-powered sealing ship in the fleet. She carried fourteen boats, while the schooners carried only six. Wild stories said she had cannon aboard. They also said she made strange raids and voyages, smuggling opium into the United States, carrying weapons into China, kidnapping islanders, and even turning pirate.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The tales were hard to believe. Yet Louis had never lied to me, and he knew nearly everything about sealing and the men in the fleets.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The same savage struggle ruled every part of our true hell-ship, from forecastle and galley to steerage and cabin. Men fought fiercely, sometimes for one another's lives. The hunters expected Smoke and Henderson's old quarrel to end in gunfire at any moment. Wolf Larsen said plainly that if it did, he would kill whichever man survived.
        - id: ch01-b10
          speaker: narrator
          text: >-
            He did not pretend this was a moral judgment. As far as he cared, the hunters could kill and eat one another. He simply needed them alive for the sealing season. If they could wait until the hunt was over, he promised them a grand carnival. Then they might settle every grudge, throw the dead men overboard, and invent a story about how the missing sailors had been lost at sea.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Even the hunters seemed horrified by such cold-blooded talk. Wicked as they were, they were certainly afraid of him.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Thomas Mugridge now submitted to me like a beaten dog, while I secretly dreaded him. His courage came from fear. I knew that strange kind of courage in myself. At any moment, it might grow stronger than his fear and drive him to kill me.
        - id: ch01-b13
          speaker: narrator
          text: >-
            My knee was much better, though it often ached for hours. The arm Wolf Larsen had squeezed was slowly losing its stiffness. Apart from that, I felt wonderfully fit. My muscles were growing larger and harder.
        - id: ch01-b14
          speaker: narrator
          text: >-
            My hands were another matter. They looked half-boiled. Hangnails tormented them, the nails were broken and discolored, and strange growths seemed to be forming along their tender edges. Boils troubled me too, probably because of the food. I had never suffered from them before.
        - id: ch01-b15
          speaker: narrator
          text: >-
            A couple of evenings earlier, I had been amused to find Wolf Larsen reading the Bible. We had searched for one at the beginning of the voyage and failed, but then a copy turned up in the dead mate's sea chest. I wondered what Wolf could possibly find in it. He began reading Ecclesiastes aloud to me.
        - id: ch01-b16
          speaker: narrator
          text: >-
            It was as if he were speaking his own thoughts. His deep, mournful voice echoed through the cramped cabin and held me still. He might have had no schooling, but he knew how to bring out the meaning of written words. I can hear him now, and I know I always will. A deep and ancient sadness trembled in his voice.
        - id: ch01-b17
          speaker: wolf_larsen
          text: >-
            I gathered silver and gold, treasures fit for kings and provinces. I gathered men and women to sing for me, and every kind of musical delight known to man.
        - id: ch01-b18
          speaker: wolf_larsen
          text: >-
            I became greater than all who came before me in Jerusalem, and still I kept my wisdom.
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            Then I looked at everything my hands had made and all the labor it had cost me. It was all vanity and vexation of spirit. Nothing brought any profit under the sun.
        - id: ch01-b20
          speaker: wolf_larsen
          text: >-
            The same thing comes to everyone. It comes to the righteous and the wicked, the good and the clean and the unclean, the one who offers sacrifice and the one who does not. The good man and the sinner meet the same end. So do the man who swears an oath and the man who fears to swear one.
        - id: ch01-b21
          speaker: wolf_larsen
          text: >-
            This is the evil beneath the sun. One event awaits us all. While men live, their hearts are full of evil and madness. After that, they go to the dead.
        - id: ch01-b22
          speaker: wolf_larsen
          text: >-
            Yet anyone still joined to the living has hope, for a living dog is better than a dead lion.
        - id: ch01-b23
          speaker: wolf_larsen
          text: >-
            The living know they will die, but the dead know nothing. No reward remains for them, and even their memory is forgotten.
        - id: ch01-b24
          speaker: wolf_larsen
          text: >-
            Their love, their hatred, and their envy have all perished. Never again will they share in anything done under the sun.
        - id: ch01-b25
          speaker: narrator
          text: >-
            He closed the book over one finger and looked up at me.
        - id: ch01-b26
          speaker: wolf_larsen
          text: >-
            There it is, Hump. The Preacher was king over Israel in Jerusalem, and he thought exactly as I do. You call me a pessimist. Could anything be darker than this? Everything is vanity and vexation. Nothing profits us under the sun. One end waits for fool and wise man, clean and unclean, sinner and saint. That end is death, and the Preacher calls it evil.
        - id: ch01-b27
          speaker: wolf_larsen
          text: >-
            He loved life. He did not want to die. Why else say that a living dog is better than a dead lion? He chose life's vanity and trouble over the grave, where nothing moves and nothing speaks. I choose the same. Crawling like a pig is bad, but becoming as still as dirt and stone is worse. The life in me hates the very thought. Life means movement, the power to move, and knowing you have that power. Living never satisfies us, but the thought of death satisfies us even less.
        - id: ch01-b28
          speaker: narrator
          text: >-
            You are even worse off than Omar. He suffered through the usual agony of youth, but at least he found contentment and turned his materialism into joy.
        - id: ch01-b29
          speaker: wolf_larsen
          text: >-
            Who was Omar?
        - id: ch01-b30
          speaker: narrator
          text: >-
            That question ended my work for the rest of the day, and for the next day, and the day after that.
        - id: ch01-b31
          speaker: narrator
          text: >-
            In all his wandering through books, Wolf Larsen had never found the Rubáiyát. To him, it was buried treasure. I could remember perhaps two-thirds of the verses. I recited those from memory, then worked out the missing parts as well as I could. For three days, my ordinary duties gave way to Omar. We spent hours discussing the thought inside a single stanza before moving to the next.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Wolf heard a cry of regret and rebellion in the poem that I could not find there at all. Perhaps my own reciting had too much joy in it. His memory was excellent. After hearing a verse once or twice, he could repeat it. Yet in his voice, those same lines were filled with unrest and passionate revolt, and he almost made me believe his reading.
        - id: ch01-b33
          speaker: narrator
          text: >-
            I wondered which verse he would love best. His choice did not surprise me. It had been born from a flash of irritation and did not fit the Persian poet's usual contentment and warm enjoyment of life.
        - id: ch01-b34
          speaker: narrator
          text: >-
            What force rushed me here without asking where I came from? What force will hurry me away without asking where I go? Many cups of forbidden wine must drown the memory of that insolence.
        - id: ch01-b35
          speaker: wolf_larsen
          text: >-
            Great! That's the keynote. Insolence! He could not have chosen a better word.
        - id: ch01-b36
          speaker: narrator
          text: >-
            I objected and denied it, but he drowned every protest beneath a flood of argument.
        - id: ch01-b37
          speaker: wolf_larsen
          text: >-
            Life cannot behave any other way. The moment life understands that it must end, it rebels. It has no choice. The Preacher called life and all its works vanity, trouble, and evil. But he thought death was worse, because death ends even our power to feel vanity or trouble. Chapter after chapter, he cannot stop thinking about the one end that comes to everyone.
        - id: ch01-b38
          speaker: wolf_larsen
          text: >-
            Omar felt it. I feel it. You feel it too. You fought against death when Cooky sharpened his knife for you. You were afraid. The life inside you, the life that makes you what you are and is greater than you, refused to die.
        - id: ch01-b39
          speaker: wolf_larsen
          text: >-
            You talk about an instinct for immortality. I talk about the instinct of life. Its purpose is to keep living. When death comes close enough, that instinct overpowers your so-called belief in immortality. It overpowered yours when a mad Cockney cook sharpened a knife, and you cannot deny it.
        - id: ch01-b40
          speaker: wolf_larsen
          text: >-
            You fear him now, and you fear me. Suppose I take you by the throat like this and start squeezing the life out of you. Your belief in immortality begins to fade. Your instinct for life rises up, desperate to live, and you struggle to save yourself.
        - id: ch01-b41
          speaker: narrator
          text: >-
            His hand closed around my throat. My breath stopped.
        - id: ch01-b42
          speaker: wolf_larsen
          text: >-
            There. I can see the fear of death in your eyes. Your arms beat at the air. You use every bit of your weak strength because you want to live. Your hand grips my arm, but it feels no heavier than a butterfly. Your chest is heaving. Your tongue pushes out. Your skin is darkening, and your eyes are swimming.
        - id: ch01-b43
          speaker: wolf_larsen
          text: >-
            To live! To live! To live! That's what you are crying for. You want life here and now, not some life afterward. You doubt your immortality, don't you? You are not sure enough to risk it. This life is the only one you know is real.
        - id: ch01-b44
          speaker: wolf_larsen
          text: >-
            Now it is turning dark. Darker still. Death is the end of being, feeling, and moving, and its darkness is closing around you. Your eyes are fixing and glazing over. My voice seems faint and far away. You cannot see my face. Still you fight my grip. You kick. Your body knots itself like a snake. Your chest heaves and strains. To live! To live! To live—
        - id: ch01-b45
          speaker: narrator
          text: >-
            I heard nothing more. The darkness he had described wiped out my consciousness.
        - id: ch01-b46
          speaker: narrator
          text: >-
            When I came back to myself, I was lying on the floor. Wolf Larsen sat smoking a cigar and studying me with that familiar curiosity in his eyes.
        - id: ch01-b47
          speaker: wolf_larsen
          text: >-
            Well, have I convinced you? Here, drink this. I want to ask you a few questions.
        - id: ch01-b48
          speaker: narrator
          text: >-
            I rolled my head from side to side against the floor. My throat ached terribly, and every word cost me pain.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Your arguments are too... forceful.
        - id: ch01-b50
          speaker: wolf_larsen
          text: >-
            You'll feel better in half an hour. I promise there will be no more physical demonstrations. Now get up. You can sit in a chair.
        - id: ch01-b51
          speaker: narrator
          text: >-
            I was only a toy to this monster. Even so, we returned to our debate about Omar and the Preacher, and we sat over it for half the night.
