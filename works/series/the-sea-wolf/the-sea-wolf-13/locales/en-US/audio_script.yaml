audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
    mugridge:
      display_name: Thomas Mugridge
      tts:
        delivery: sneering, officious, and quick to bully
        timbre: nasal and wiry
        pace: brisk with sharp bursts
        pitch: medium-high
    harrison:
      display_name: Harrison
      tts:
        delivery: open, earnest, and easily impressed
        timbre: clear and rustic
        pace: relaxed
        pitch: medium
    leach:
      display_name: George Leach
      tts:
        delivery: tough, blunt, and quietly defiant
        timbre: rough and youthful
        pace: measured with hard emphasis
        pitch: medium
    johansen:
      display_name: Johansen
      tts:
        delivery: rough and overbearing until checked by authority
        timbre: coarse and heavy
        pace: forceful
        pitch: low
    louis:
      display_name: Louis
      tts:
        delivery: jovial and confidential, rushing into ominous excitement
        timbre: round, weathered, and resonant
        pace: lively with rolling rhythms
        pitch: medium-low
  chapters:
    - id: ch01
      title: CHAPTER XIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            For three days, I did my own work and Thomas Mugridge's as well. I thought I did his work properly, and Wolf Larsen seemed to agree. During my brief rule in the galley, the sailors looked thoroughly pleased.
        - id: ch01-b02
          speaker: harrison
          text: >-
            That's the first decent bite I've had since I came aboard. Tommy's food always tastes like old grease. And I'll wager he hasn't changed his shirt since we left San Francisco.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I know he hasn't.
        - id: ch01-b04
          speaker: harrison
          text: >-
            I bet he sleeps in it too.
        - id: ch01-b05
          speaker: narrator
          text: >-
            You'd win that bet. He hasn't taken that shirt off once.
        - id: ch01-b06
          speaker: narrator
          text: >-
            But Wolf Larsen gave Mugridge only three days to recover from his beating. On the fourth, he dragged the cook out of his bunk by the back of the neck and put him back to work. Mugridge was lame and sore, and his swollen eyes were almost shut. He sniffled and cried, but Wolf Larsen showed no mercy.
        - id: ch01-b07
          speaker: wolf_larsen
          text: >-
            And don't serve us any more slop. No more grease and filth. Put on a clean shirt now and then, or I'll have you towed over the side. Do you understand?
        - id: ch01-b08
          speaker: narrator
          text: >-
            Mugridge crawled weakly across the galley. The Ghost gave a short roll, and he staggered. He reached for the iron rail that kept the pots from sliding off the stove, but missed it. His full weight drove his hand onto the hot iron. Flesh sizzled, the smell of burning rose, and he cried out sharply.
        - id: ch01-b09
          speaker: mugridge
          emotion: sad
          text: >-
            Oh, God! God! What have I done to deserve this? Why does everything happen to me? It makes me sick. I try so hard to go through life without hurting anybody.
        - id: ch01-b10
          speaker: narrator
          text: >-
            He dropped into the coal box and rocked back and forth, cradling his burned hand. Tears ran over his bruised, swollen cheeks, and pain twisted his face. Then a savage look flashed across it.
        - id: ch01-b11
          speaker: mugridge
          emotion: angry
          text: >-
            Oh, how I hate him! How I hate him!
        - id: ch01-b12
          speaker: narrator
          text: >-
            Who do you mean?
        - id: ch01-b13
          speaker: narrator
          text: >-
            He only wept again over all his troubles. It was easier to guess whom he hated than whom he did not. I had begun to see something vicious in him that turned his hatred against the whole world. At times, I thought he even hated himself. Life had shaped him so cruelly and strangely that pity rose in me, and I felt ashamed that I had ever enjoyed his humiliation or pain. Life had cheated him when it made him what he was, and it had gone on cheating him ever since. What chance had he ever had to become anything else? As if he had heard the thought, he began to wail.
        - id: ch01-b14
          speaker: mugridge
          emotion: sad
          text: >-
            I never had a chance. Not even half a chance! Who sent me to school? Who put food in my empty belly or wiped my bloody nose when I was little? Who ever did a thing for me? Who?
        - id: ch01-b15
          speaker: narrator
          text: >-
            I rested a gentle hand on his shoulder.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Never mind, Tommy. Try to cheer up. You have years ahead of you. You can still make yourself into whatever you choose.
        - id: ch01-b17
          speaker: mugridge
          emotion: angry
          text: >-
            That's a lie! A bloody lie, and you know it! I'm already made, and I was made out of scraps. It's easy for you, Hump. You were born a gentleman. You never went hungry. You never cried yourself to sleep while your empty belly gnawed at you like a rat inside. Nothing can make that right. Suppose I became President of the United States tomorrow. Would that fill my belly on even one of those nights when I was a child?
        - id: ch01-b18
          speaker: mugridge
          emotion: angry
          text: >-
            How could it? I was born for pain and sorrow. I've suffered more than ten ordinary men. I've spent half my life in hospitals. I had fever in Aspinwall, Havana, and New Orleans. Scurvy nearly killed me in Barbados, and I was rotten with it for six months. Then smallpox in Honolulu, two broken legs in Shanghai, pneumonia in Unalaska, and three broken ribs with my insides twisted in San Francisco.
        - id: ch01-b19
          speaker: mugridge
          emotion: angry
          text: >-
            And now look at me! My ribs have been kicked loose from my back again. I'll be coughing blood before eight bells. Tell me how anyone can make that up to me. Who's going to do it? God? God must have hated me when he signed me on for this voyage through his cursed world!
        - id: ch01-b20
          speaker: narrator
          text: >-
            He raged against his fate for more than an hour. Then he forced himself back to work, limping and groaning, with hatred for everything alive burning in his eyes. His grim prediction proved correct. At times, sickness seized him. He vomited blood and suffered terrible pain. Yet, as he had said, God seemed to hate him too much to let him die. In the end, he recovered and became more spiteful than ever.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Several more days passed before Johnson dragged himself back on deck and began working without much heart. He was still a sick man. More than once, I saw him climb painfully toward a topsail or sag with weariness as he stood at the wheel. Worse than that, his spirit seemed broken. He was utterly humble before Wolf Larsen and almost crawled before Johansen.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Leach was entirely different. He prowled the deck like a young tiger and showed Wolf Larsen and Johansen his hatred openly. One night, I heard him speak to the mate in the darkness.
        - id: ch01-b23
          speaker: leach
          emotion: angry
          text: >-
            I'll get you yet, you clumsy Swede.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Johansen cursed him. A moment later, something struck the galley with a hard crack. More curses followed, then a mocking laugh. When the deck grew quiet, I slipped outside. A heavy knife was buried more than an inch deep in the solid wood.
        - id: ch01-b25
          speaker: narrator
          text: >-
            A few minutes later, Johansen came feeling around for it. I kept it hidden and returned it privately to Leach the next day. He grinned when I handed it back. That grin held more honest thanks than all the elaborate speeches people of my own class usually made.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Unlike anyone else aboard, I now had no quarrels and stood well with nearly everyone. The hunters may only have tolerated me, but none of them disliked me. Smoke and Henderson were slowly recovering beneath an awning on deck, swinging in their hammocks by day and night. They told me I was better than any hospital nurse. They promised they would not forget me when the voyage ended and they collected their pay. The thought amused me. I hardly needed their money. I could have bought both men, all their belongings, and the Ghost with her equipment twenty times over. Still, the work of tending their wounds and pulling them through had fallen to me, and I did my best for them.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Wolf Larsen suffered another terrible headache, and this attack lasted two days. The pain must have been severe. He called me in, and for once that commanding man followed every instruction I gave him like a sick child. Yet nothing I tried seemed to bring him any relief. At my suggestion, he did give up smoking and drinking. Why such a magnificent animal should suffer headaches at all remained a mystery to me.
        - id: ch01-b28
          speaker: louis
          text: >-
            It's the hand of God, I'm telling you. He's being punished for his black-hearted deeds, and there's more coming after this. Unless...
        - id: ch01-b29
          speaker: narrator
          text: >-
            Unless what?
        - id: ch01-b30
          speaker: louis
          text: >-
            Unless God is nodding off and neglecting his duty. Though I suppose I'm the last man who ought to say so.
        - id: ch01-b31
          speaker: narrator
          text: >-
            I had been wrong to think everyone liked me. Thomas Mugridge still hated me, and now he had found a fresh reason. It took me some time to understand. He hated me because I had been born more fortunate than he had. In his words, I was “gentleman born.”
        - id: ch01-b32
          speaker: narrator
          text: >-
            Later, Smoke and Henderson came on deck together for their first exercise. They walked side by side, talking like friends, and I teased Louis.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Still no dead men, Louis.
        - id: ch01-b34
          speaker: narrator
          text: >-
            He studied me with his sharp gray eyes and shook his head gravely.
        - id: ch01-b35
          speaker: louis
          text: >-
            It's coming, I tell you. When it starts to howl, every hand will be standing by at the sheets and halyards. I've felt it for a long while. I feel it now as plainly as I feel the rigging on a dark night. It's close. It's very close.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Who will go first?
        - id: ch01-b37
          speaker: louis
          text: >-
            Not fat old Louis, I promise you.
        - id: ch01-b38
          speaker: narrator
          text: >-
            He laughed, but he trusted the feeling in his bones.
        - id: ch01-b39
          speaker: louis
          text: >-
            This time next year, I'll be looking into my old mother's eyes. She's worn herself weary watching the sea for the five sons she gave to it.
        - id: ch01-b40
          speaker: narrator
          text: >-
            A moment later, Mugridge demanded to know what Louis had said.
        - id: ch01-b41
          speaker: mugridge
          text: >-
            What was he saying to you?
        - id: ch01-b42
          speaker: narrator
          text: >-
            I answered carefully.
        - id: ch01-b43
          speaker: narrator
          text: >-
            He says he'll go home one day and see his mother.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Mugridge stared into my eyes. His own looked dull and hopeless.
        - id: ch01-b45
          speaker: mugridge
          emotion: sad
          text: >-
            I never had one.
