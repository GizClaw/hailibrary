audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    mugridge:
      display_name: 托马斯·马格里奇
      tts:
        delivery: 油滑怯懦，带着夸张的伦敦口音感
        timbre: 尖细而发黏的成年男声
        pace: 偏快，慌乱时语不成调
        pitch: 高音
    harrison:
      display_name: 哈里森
      tts:
        delivery: 直率随和，带着水手朴实的爽快
        timbre: 清亮粗朴的年轻男声
        pace: 放松自然
        pitch: 中音
    leach:
      display_name: 利奇
      tts:
        delivery: 倔强激烈，愤怒时近乎不顾一切
        timbre: 紧绷而略带沙哑的年轻男声
        pace: 明快，激动时急促爆发
        pitch: 中高音
    louis:
      display_name: 路易
      tts:
        delivery: 爽朗健谈，谈到预兆时透出郑重与神秘
        timbre: 浑厚而饱经风霜的成年男声
        pace: 起伏鲜明，兴奋时语流加快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十三章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            一连三天，我把自己和托马斯·马格里奇的活全包了。我自认厨房管得不错，海狼·拉森也显然满意。至少在我短暂掌勺的时候，水手们个个吃得眉开眼笑。一天，哈里森把水手舱用过的锅碗送回来，站在厨房门口夸起了我的饭菜。
        - id: ch01-b02
          speaker: harrison
          text: >-
            这是我上船以后，头一回吃到这么干净的东西。汤米做的饭总有股陈年老油味。我敢说，他从离开旧金山起，就没换过衬衫。
        - id: ch01-b03
          speaker: humphrey
          text: 他确实没换过。
        - id: ch01-b04
          speaker: harrison
          text: 我敢打赌，他睡觉也穿着那件衬衫。
        - id: ch01-b05
          speaker: humphrey
          text: 这场赌你准赢。这么久以来，他一次也没脱过它。
        - id: ch01-b06
          speaker: narrator
          text: >-
            可是，海狼·拉森只许马格里奇休养三天。到了第四天，他还是一瘸一拐，浑身疼痛，两只眼睛也肿得几乎睁不开，就被揪着后颈拖下铺位，赶回厨房。他抽着鼻子直哭，拉森却半点也不心软。
        - id: ch01-b07
          speaker: wolf_larsen
          text: >-
            听好，别再拿泔水一样的东西给人吃。不许有油污，也不许有脏东西。偶尔换件干净衬衫，否则我就把你拖在船外泡一泡。明白了吗？
        - id: ch01-b08
          speaker: narrator
          text: >-
            马格里奇有气无力地爬过厨房地板。“幽灵号”轻轻一晃，他站不稳了，连忙伸手去抓炉边的铁栏杆。那道栏杆原是用来挡住锅子的，可他偏偏抓了个空，整个人的重量都压到手上，手掌结结实实按在滚烫的炉面。只听“嗞”的一声，焦肉味冒了出来，他随即发出一声尖叫。
        - id: ch01-b09
          speaker: mugridge
          text: >-
            上帝啊，上帝啊，我到底造了什么孽？为什么倒霉事全落在我头上？真叫我恶心得活不下去。我已经这么努力了，一辈子安安分分，从来没伤害过别人。
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: >-
            他一屁股坐进煤箱，抱着烫伤的手，身子来回摇晃。眼泪顺着浮肿青紫的面颊往下淌，疼痛把他的脸扭得变了形。忽然，那张脸上闪过一丝凶狠。
        - id: ch01-b11
          speaker: mugridge
          text: 我恨他！我恨死他了！
          emotion: angry
        - id: ch01-b12
          speaker: humphrey
          text: 你恨谁？
        - id: ch01-b13
          speaker: narrator
          text: >-
            他没有回答，只顾为自己的不幸哭泣。其实，比起他恨谁，更难猜的是他不恨谁。我渐渐看清，他心里仿佛住着一个恶毒的魔鬼，驱使他仇恨整个世界。有时候，我甚至觉得他连自己也恨。生活待他太荒唐，也太残忍。想到这里，我不由得同情他，也为自己曾经拿他的狼狈和痛苦取乐感到羞愧。生活从一开始就不曾公平待他。它把他塑造成今天这个模样，往后又一次次卑劣地捉弄他。他哪里有机会变成另一个人呢？仿佛听见了我心里的话，他又哀号起来。
        - id: ch01-b14
          speaker: mugridge
          text: >-
            我从来没得到过机会，连半点都没有！小时候，有谁送我去上学？有谁给我饿瘪的肚子塞口吃的？有谁替我擦过该死的鼻涕？谁为我做过一件事？谁？你倒说啊！
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: 我把手轻轻放在他肩上，想让他平静下来。
        - id: ch01-b16
          speaker: humphrey
          text: >-
            别难过，汤米。振作一点，到头来一切都会好起来。你往后的日子还长，想把自己变成什么样的人都来得及。
        - id: ch01-b17
          speaker: narrator
          text: 他猛地甩开我的手，冲着我的脸大吼。
        - id: ch01-b18
          speaker: mugridge
          text: >-
            撒谎！全他妈是撒谎！你自己也知道。我的样子早就定了，是拿别人吃剩的残羹碎屑拼出来的。你当然能说这种话，汉普。你生来就是绅士，从没挨过饿。你根本不知道，小肚子里像有只耗子一口一口啃着，自己却只能哭着睡着，是什么滋味。事情好不起来。就算我明天当上美国总统，难道就能填饱我小时候某一次空着的肚子吗？
          emotion: angry
        - id: ch01-b19
          speaker: mugridge
          text: >-
            你说，怎么填？我生下来就是受苦受罪的。我吃过的苦，比十个人加起来都多。我这该死的一辈子，倒有一半在医院里过。在阿斯平沃尔、哈瓦那和新奥尔良，我都得过热病。在巴巴多斯，我发了六个月坏血病，浑身烂得差点送命。在檀香山出过天花，在上海摔断过两条腿，在乌纳拉斯卡得过肺炎。到了旧金山，我又断了三根肋骨，连肚子里的东西都扭到了一块。可现在呢？看看我！你看看我！我的肋骨又叫人从后背踢松了。不到八响钟，我准会咳出血来。这些苦要怎么补？谁来补？上帝吗？上帝把我签上他这艘该死的人世航船时，该有多么恨我啊！
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: >-
            他这样咒骂命运，足足骂了一个多小时，才跛着脚、呻吟着勉强干起活来。他眼里装满了对世间一切造物的仇恨。不过，他判断自己的伤势倒很准确。后来他不时发病，呕出鲜血，疼得厉害。可正如他自己说的，上帝似乎恨他恨得太深，连死也不肯让他死。他终于慢慢好了起来，也变得比从前更加恶毒。
        - id: ch01-b21
          speaker: narrator
          text: >-
            又过了几天，约翰逊才爬上甲板，有气无力地重新干活。他的身体还没复原。我不止一次看见他忍痛爬到高处收放上桅帆，也看见他站在舵轮前，疲惫得垂下身子。可更糟的是，他的精神似乎已经垮了。他在海狼·拉森面前卑躬屈膝，对约翰森也几乎低声下气。利奇却完全不同。他像头幼虎一样在甲板上走动，毫不掩饰地瞪着拉森和约翰森。
        - id: ch01-b22
          speaker: leach
          text: 总有一天我要收拾你，你这个扁脚板的瑞典佬。
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: >-
            一天夜里，我听见利奇这样威胁约翰森。大副在黑暗中骂了一声。紧接着，不知什么东西“啪”地重重击中厨房。黑暗里又传来一串咒骂和一声嘲笑。等四周安静下来，我偷偷走出去，看见一把沉重的刀钉进坚实的木板，足有一英寸多深。几分钟后，大副摸黑过来找刀。我没有声张，第二天暗中把刀还给了利奇。他接过去，咧嘴一笑。那笑容里的真诚谢意，胜过我所属阶层惯用的千万句客套话。
        - id: ch01-b24
          speaker: narrator
          text: >-
            这时，我竟成了全船唯一不与人争吵、又受到大家善待的人。猎手们也许只是容忍我，但没有谁讨厌我。斯莫克和亨德森正在养伤，吊床日夜挂在甲板的帆布篷下。他们说我比任何医院护士都强，还保证航程结束领到钱以后，绝不会忘记我。说得仿佛我稀罕他们的钱似的！凭我的财力，把他们连人带行李买下来，再把这艘纵帆船和全部装备一并买下，买上二十遍也绰绰有余。不过，照料伤口、帮他们熬过危险的担子确实落到了我身上，我也一直尽力照顾他们。
        - id: ch01-b25
          speaker: narrator
          text: >-
            海狼·拉森的头痛又猛烈发作了一次，足足持续了两天。他一定痛苦极了，因为他把我叫去以后，竟像个生病的孩子一样听从我的吩咐。可我什么办法都试了，还是不能让他好受一点。听了我的劝，他倒是戒了烟，也不再喝酒。只是我始终想不通，像他这样强健雄伟的动物，怎么也会头痛。
        - id: ch01-b26
          speaker: louis
          text: >-
            我跟你说，这是上帝的手在惩罚他。他心肠歹毒，作恶多端，这是天谴。后头还有呢，要不然……
        - id: ch01-b27
          speaker: humphrey
          text: 要不然怎样？
        - id: ch01-b28
          speaker: louis
          text: 要不然，就是上帝打起瞌睡，没尽自己的本分。不过这种话原不该由我来说。
        - id: ch01-b29
          speaker: narrator
          text: >-
            其实，我说自己受到所有人善待，并不准确。托马斯·马格里奇还在恨我，而且又找到了一个恨我的理由。我琢磨了很久才明白，原来只因为我的出身比他幸运。用他的话说，我是个“天生的绅士”。
        - id: ch01-b30
          speaker: narrator
          text: >-
            又过了一阵，斯莫克和亨德森终于能下吊床了。两个人并肩走上甲板，一边亲热地交谈，一边做康复后的头一次活动。我看到这一幕，便拿路易先前的预言打趣。
        - id: ch01-b31
          speaker: humphrey
          text: 瞧，还是一个死人也没有。
        - id: ch01-b32
          speaker: narrator
          text: 路易用那双精明的灰眼睛打量着我，煞有介事地摇了摇头。
        - id: ch01-b33
          speaker: louis
          text: >-
            它就要来了，我告诉你。等它真正咆哮起来，全船的人都得守在帆脚索和升降索旁听候使唤。我早就有这种感觉了，现在更是清楚，就像漆黑的夜里摸到帆索一样清楚。它近了，已经很近了。
        - id: ch01-b34
          speaker: humphrey
          text: 谁会第一个死？
        - id: ch01-b35
          speaker: louis
          text: >-
            反正不会是胖老路易，我向你保证。我骨头里明明白白地知道，明年这个时候，我会望着老母亲的眼睛。她把五个儿子交给大海，日夜望着海面，眼睛都等倦了。
        - id: ch01-b36
          speaker: narrator
          text: 过了一会儿，马格里奇逼问我。
        - id: ch01-b37
          speaker: mugridge
          text: 他刚才跟你说什么？
        - id: ch01-b38
          speaker: humphrey
          text: 总有一天，他要回家去看母亲。
        - id: ch01-b39
          speaker: narrator
          text: 我答得很圆滑。马格里奇却用一双黯淡而绝望的眼睛望着我。
        - id: ch01-b40
          speaker: mugridge
          text: 我从来就没有母亲。
          emotion: sad
