audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful and gentle, with quiet courage beneath her reserve
        timbre: light, clear, and refined
        pace: measured and natural
        pitch: medium-high
  chapters:
    - id: ch01
      title: CHAPTER XXIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Fair, strong winds drove the Ghost quickly north into the seal herd. We reached it well above the forty-fourth parallel, in a raw and stormy sea. The wind chased banks of fog endlessly across the water. For days, the sun never appeared, so we could not take an observation. Then the wind would suddenly sweep the ocean clear. The waves would flash in the light, and at last we could discover our position. The clear weather might hold for one day, or three or four. Then the fog would close around us again, thicker than before.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Hunting in those waters was dangerous. Still, the boats went down day after day. The grey fog swallowed them, and we saw nothing more of them until night. Often they returned much later, creeping out of the mist one at a time like ghosts from the sea.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Wainwright, the hunter Wolf Larsen had stolen along with his boat and men, used that hidden sea to escape. One morning, he and his two men vanished into the fog surrounding us. We never saw them again. A few days later, we learned that they had gone from schooner to schooner until they finally reached their own ship.
        - id: ch01-b04
          speaker: narrator
          text: >-
            I had made up my mind to do the same thing, but I never got the chance. A mate was not supposed to go out in the hunting boats. I tried every clever turn I could think of, but Wolf Larsen would not allow it. If he had, I would somehow have taken Miss Brewster away with me.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Meanwhile, our situation was moving toward something I was afraid even to imagine. I tried to push the thought aside, but it kept rising in my mind like a spectre that would not leave me.
        - id: ch01-b06
          speaker: narrator
          text: >-
            I had read sea stories before, and they often placed one woman alone among a whole shipload of men. Until now, I had never understood what that situation truly meant, though writers had made so much of it. Now it stood before me, and I had to face it. Nothing could have made it more real than the fact that the woman was Maud Brewster. Her writing had charmed me for years. Now the woman herself charmed me too.
        - id: ch01-b07
          speaker: narrator
          text: >-
            No one could have seemed more out of place aboard the Ghost. Maud was delicate and almost unearthly, slender as a willow and graceful in every movement. She hardly seemed to walk as ordinary people did. She moved so lightly that I thought of soft down floating through the air, or a bird passing on silent wings.
        - id: ch01-b08
          speaker: narrator
          text: >-
            She reminded me of a fine piece of Dresden china. I was always aware of how fragile she seemed. When I had caught her arm while helping her below, I had felt ready for her to crumble at any rough touch. Her body and spirit seemed perfectly matched. The critics called her poetry delicate and spiritual, and those same words described her. It was as though her body shared the qualities of her soul and was tied to life by the slenderest chain. She stepped lightly upon the earth. There was very little of its heavy clay in her.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Beside Wolf Larsen, the contrast was startling. Neither possessed anything the other had. One morning, I watched them walking the deck together. They seemed to stand at opposite ends of human development. He was the height of savagery, while she was the finished result of the finest civilization could produce. Looking from one to the other made the distance between them seem almost beyond measure.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Wolf Larsen had an extraordinary mind, but he used it only to serve his savage nature, and that made him more dangerous. He was a large, powerfully muscled man. He walked with the certainty of someone who trusted his body completely, yet there was no heaviness in his step. Every lift and fall of his feet suggested the jungle and the wilderness. He moved like a cat, smooth and strong, always strong. To me, he was a great tiger, built to hunt and take its prey. At times, a sharp light flashed in his eyes. I had seen that same light in the eyes of caged leopards and other wild hunters.
        - id: ch01-b11
          speaker: narrator
          text: >-
            As I watched them that morning, Maud was the one who ended their walk. They stopped beside me at the entrance to the companionway. She showed nothing openly, but I somehow knew she was deeply troubled. She made an idle remark to me and gave a light laugh. Then her eyes were drawn back to Wolf Larsen's. She lowered them, but not soon enough. I saw terror rush into them.
        - id: ch01-b12
          speaker: narrator
          text: >-
            His eyes told me what had frightened her. They were usually grey, cold, and hard. Now they had turned warm and soft and golden. Tiny lights danced in them, fading and swelling until his whole gaze seemed flooded with a glowing brightness. Perhaps that glow created the golden color. Whatever caused it, his eyes were both inviting and masterful. They tried to lure and command her at once. They spoke of a demand in his blood that no woman could mistake, least of all Maud Brewster.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Her terror became mine. In that instant, under the most terrible fear a man can feel, I understood how dear she was to me. I knew that I loved her. Fear and love seized my heart together. My blood seemed to freeze and leap wildly at the same time. Some power outside me drew my gaze toward Wolf Larsen, and against my will, I found myself staring into his eyes.
        - id: ch01-b14
          speaker: narrator
          text: >-
            But he had mastered himself again. The gold and the dancing lights were gone. His eyes were cold, grey, and glittering once more. He gave us a short bow and turned away.
        - id: ch01-b15
          speaker: maud_brewster
          emotion: fearful
          text: >-
            I'm afraid. I'm terribly afraid.
        - id: ch01-b16
          speaker: narrator
          text: >-
            She whispered the words with a shiver. I was afraid too, and the discovery of my love had thrown my thoughts into confusion. Even so, I managed to answer steadily.
        - id: ch01-b17
          speaker: narrator
          emotion: calm
          text: >-
            It will be all right, Miss Brewster. Trust me. Somehow, it will be all right.
        - id: ch01-b18
          speaker: narrator
          text: >-
            She gave me a small, grateful smile that set my heart pounding. Then she started down the companion stairs.
        - id: ch01-b19
          speaker: narrator
          text: >-
            I stayed where she had left me for a long time. Everything had changed, and I needed to understand what that change meant. Love had come at last, when I least expected it and in the most threatening circumstances. In theory, I had always accepted that love would call sooner or later. But I had spent so many quiet years among books that the call found me unprepared.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Yet it had come, and it was Maud Brewster. I remembered the first slim volume of her poetry lying on my desk. Then I saw, as clearly as if I stood before my own shelves, the whole row of her little books in my library. How eagerly I had welcomed each new one. Every year another appeared, and for me, its arrival had marked the year. Her books spoke with a mind and spirit like my own. I had received them as companions of the mind. Now they belonged in my heart.
        - id: ch01-b21
          speaker: narrator
          text: >-
            My heart? The thought suddenly startled me. It was as though I had stepped outside myself and was staring back in disbelief. Maud Brewster and Humphrey Van Weyden? Humphrey, whom Charley Furuseth had named the cold-blooded fish, the emotionless monster, the demon who analyzed everything? Humphrey Van Weyden was in love?
        - id: ch01-b22
          speaker: narrator
          text: >-
            Then my doubtful mind jumped, for no sensible reason, to a short note in the red-bound Who's Who. I repeated its facts to myself. She had been born in Cambridge. She was twenty-seven years old. Twenty-seven, I thought, and still free of any attachment? But how could I know that she was free? A new pang of jealousy ended all my disbelief. I was jealous. Therefore, I loved her. And the woman I loved was Maud Brewster.
        - id: ch01-b23
          speaker: narrator
          text: >-
            I, Humphrey Van Weyden, was in love. Again, doubt came over me. I was not afraid of love, and I did not want to escape it. I was an idealist through and through. My whole philosophy had honored love as the greatest thing in the world. It was life's aim and summit, and the highest point of joy and happiness a person could reach. Of all things, this was the one to welcome and take into the heart.
        - id: ch01-b24
          speaker: narrator
          text: >-
            But now that love had truly come, I could hardly believe it. Surely I could not be so fortunate. It seemed far too good to be true. Lines by Symons returned to me. I had wandered for years through a world of women, seeking one woman. Then, at some point, I had stopped seeking.
        - id: ch01-b25
          speaker: narrator
          text: >-
            I had decided that the greatest thing in the world was not meant for me. Perhaps Furuseth had been right. Perhaps I really was abnormal, an emotionless, bookish creature who could feel pleasure only through his mind. Women had surrounded me all my life, but my appreciation of them had never gone beyond beauty. Sometimes I had imagined myself shut outside the common world of human feeling. I was like a monk who could watch both lasting love and passing passion in others, and understand them well, but could never know either one himself.
        - id: ch01-b26
          speaker: narrator
          text: >-
            And now love had come. I had never dreamed of it or seen it approaching, but here it was. In a kind of ecstasy, I finally left my place at the companionway and began walking along the deck. I murmured Mrs. Browning's lines to myself. For years, I had lived with visions instead of people. They had been gentle companions, and I had never expected to hear any music sweeter than theirs.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Now that sweeter music filled my ears. I could see and think of nothing around me until Wolf Larsen's sharp voice brought me back.
        - id: ch01-b28
          speaker: wolf_larsen
          text: >-
            What the hell are you doing?
        - id: ch01-b29
          speaker: narrator
          text: >-
            Without noticing, I had wandered forward to where the sailors were painting. I came to my senses with one foot about to knock over a pot of paint.
        - id: ch01-b30
          speaker: wolf_larsen
          text: >-
            Walking in your sleep? Too much sun? What is it?
        - id: ch01-b31
          speaker: narrator
          text: >-
            No. Indigestion.
        - id: ch01-b32
          speaker: narrator
          text: >-
            I kept walking as though nothing unusual had happened.
