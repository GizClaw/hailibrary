audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十三章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            强劲的顺风推着“幽灵号”一路向北，很快驶进了海豹群。直到远远越过北纬四十四度，我们才碰上它们。海面阴冷，风暴不停，狂风追赶着一团团雾，在海上永无休止地奔逃。我们常常一连几天看不见太阳，也无法测定船位。偶尔一阵风把海面扫净，波浪闪起粼粼的光，我们才知道船到了哪里。这样的晴朗有时只留一天，有时能留三四天。随后，大雾又压了下来，看上去比先前更浓。
        - id: ch01-b02
          speaker: narrator
          text: >-
            捕猎很危险，可小艇还是每天放下海去，一转眼就让灰雾吞没。它们要到天黑才回来，常常过了很久，才一条接一条从灰色里悄然钻出，像海上的幽灵。温赖特就是拉森连人带艇抢来的那个猎手。他利用雾海的遮掩逃掉了。一天早晨，他和两个手下一起消失在四周的浓雾里，我们再也没见过他们。没过几天，消息传来，他们从一艘纵帆船搭到另一艘，最后回到了自己的船上。
        - id: ch01-b03
          speaker: narrator
          text: >-
            我也早就打定主意，要用同样的办法逃走，可始终没有机会。大副本来就不该跟小艇出海。无论我怎样设法，拉森都不肯破例。只要他答应，我总能想办法把布鲁斯特小姐也带走。可眼下，局面正在逼近一个我不敢细想的关头。我本能地躲着那个念头，它却像阴魂一样，一次又一次回到脑海里。
        - id: ch01-b04
          speaker: narrator
          text: >-
            从前我读过不少海上传奇。那些书里，满船男人中间总会有一个孤零零的女人。作家们抓住这种处境反复铺写，可直到现在我才明白，它真正意味着什么。如今这一切就在我眼前，我不得不面对。要让它变得再真切不过，只需让那个女人恰好是莫德·布鲁斯特。多年来，她的作品一直让我心醉。现在她本人就在船上，也同样让我着迷。
        - id: ch01-b05
          speaker: narrator
          text: >-
            再没有谁比她更不适合这里了。她那么纤柔，身姿修长，动作轻盈。我总觉得她不是在走路，至少不像普通人那样走。她柔韧得出奇，举止间有一种说不出的轻灵。她向人走来，像一片绒羽悠悠飘近，又像一只鸟儿振着无声的翅膀飞来。
        - id: ch01-b06
          speaker: narrator
          text: >-
            她像一件德累斯顿瓷器，总让我想到她有多么脆弱。我扶她下舱，抓住她手臂的那一次，就有过这样的感觉。从那以后，我总觉得只要有一点猛烈的冲击，或是有人粗暴地碰她，她就会在眼前碎掉。我从没见过哪个人的身体与精神这样和谐。评论家说她的诗超凡脱俗，充满灵性。用这几个字来形容她的身体，也一样合适。那身体仿佛带着她灵魂的本质，只由一根最细的链条系在生命上。她踩在大地上的脚步几乎没有重量，身体里也没有多少属于尘土的粗厚与坚实。
        - id: ch01-b07
          speaker: narrator
          text: >-
            她和海狼·拉森恰好相反。她所没有的，他全都有。他所没有的，她也全都有。一天早晨，我看着两人并肩在甲板上散步，觉得他们正站在人类进化阶梯的两个尽头。一端是野蛮的顶峰，另一端是最精美的文明结出的成果。
        - id: ch01-b08
          speaker: narrator
          text: >-
            拉森确实有过人的头脑，可他的智慧只用来施展野蛮的本能，所以他反而成了更可怕的野人。他肌肉强健，身躯魁梧。走路时，他带着强壮之人的笃定，脚步却一点也不重。每一次抬脚落脚，都藏着丛林和荒野的气息。他像猫一样落足无声，灵活，强悍，永远强悍。我常把他想成一头巨虎，一头善于搏杀、专门捕猎的猛兽。他眼里偶尔迸出的锐利寒光，也和我在笼中豹子与其他食肉兽眼里见过的一模一样。
        - id: ch01-b09
          speaker: narrator
          text: >-
            那一天，我望着他们来回走动，发现是莫德先结束了散步。他们来到我站着的升降口旁。她表面上没有显出任何异样，我却能感觉到她心里非常不安。她望着我，随口说了句无关紧要的话，还轻轻笑了一声。可她的目光不由自主地又回到拉森的眼睛上，像被吸住了。接着她垂下眼帘，却还是迟了一瞬。我已经看见恐惧猛然涌进她的眼睛。
        - id: ch01-b10
          speaker: narrator
          text: >-
            她为什么害怕，我也从拉森眼里看见了。那双眼睛平日灰暗、冰冷、严厉，此刻却变得温暖柔和，还泛起金色。无数细小的光点在里面跳动，有时暗下去，有时又大片涌出，直到整双眼睛都灼灼发亮。也许正是这些光把眼睛染成了金色。那目光既诱人又专横，一面引诱，一面逼迫，毫不掩饰地诉说着血肉的欲望。没有哪个女人会误解这种眼神，莫德就更不会。
        - id: ch01-b11
          speaker: narrator
          text: >-
            她的恐惧也一下子抓住了我。就在一个男人所能承受的最可怕的恐惧中，我终于明白，她已经成了我至爱的人。我爱她。这个领悟和恐惧一起袭来，紧紧扼住我的心。我的血一面变冷，一面又狂乱地奔涌。仿佛有一股来自身外的力量拉着我，我无法控制自己的目光，只能再次望进拉森的眼睛。
        - id: ch01-b12
          speaker: narrator
          text: >-
            可他已经恢复了平常的样子。金色消失了，跳动的光点也不见了。他的眼睛重新变得灰暗、冰冷，闪着寒光。他生硬地欠了欠身，转身离开。
        - id: ch01-b13
          speaker: maud_brewster
          text: 我害怕。我真的太害怕了。
          emotion: fearful
        - id: ch01-b14
          speaker: narrator
          text: >-
            她低声说着，身子还打了个寒战。我也害怕。再加上刚刚发现她对我有多重要，我的心里早已乱成一团。可我还是设法让声音听起来十分平静。
        - id: ch01-b15
          speaker: humphrey
          text: 一切都会好起来的，布鲁斯特小姐。请相信我，事情一定会好起来。
          emotion: calm
        - id: ch01-b16
          speaker: narrator
          text: >-
            她感激地朝我微微一笑，我的心立刻怦怦直跳。随后，她转身走下了升降梯。
        - id: ch01-b17
          speaker: narrator
          text: >-
            她走后，我还在原地站了很久。眼前的一切已经完全变了。我得重新安顿自己的心，也得想清楚这种变化意味着什么。爱情终于来了，在我最想不到的时候，在最险恶的环境里来了。我一向承认，爱的召唤迟早会出现。可我安静地和书本过了那么多年，早已变得迟钝，对它毫无准备。
        - id: ch01-b18
          speaker: narrator
          text: >-
            可现在，它真的来了。莫德·布鲁斯特！我忽然想起书桌上那本最早的薄薄诗集，又像亲眼看见了书房架上那一排小书。每一本问世，我都那样欢喜。每年都有一本新作出版，对我来说，那才像新的一年真正到来。书里有一个与我相通的心灵，也有与我相通的才智。我曾把它们当作精神上的朋友迎进自己的世界。如今，它们已经从我的思想里走进了我的心。
        - id: ch01-b19
          speaker: narrator
          text: >-
            我的心？这个念头让我猛地一惊。我仿佛走到身体外面，站在旁边，难以置信地看着自己。莫德·布鲁斯特！汉弗莱·范韦登，这个被查理·弗鲁赛斯叫作“冷血的鱼”“没有感情的怪物”“分析成性的恶魔”的人，竟然恋爱了。
        - id: ch01-b20
          speaker: narrator
          text: >-
            接着，我的心又毫无来由地起了疑。我忽然想起红皮《名人录》里那段简短的传记，对自己说，她出生在剑桥，今年二十七岁。然后我又问，二十七岁了，她仍然无牵无挂，心里也没有爱人吗？可我怎么知道她没有爱人？刚刚生出的嫉妒猛地刺痛了我，把所有怀疑都赶走了。我会嫉妒，就说明我爱她。而我爱的女人，正是莫德·布鲁斯特。
        - id: ch01-b21
          speaker: narrator
          text: >-
            我，汉弗莱·范韦登，恋爱了。疑惑又一次袭来。不过我并不害怕，也不想躲开爱情。恰恰相反，我是一个再彻底不过的理想主义者。我始终尊崇爱情，认为它是世间最伟大的事物，是生命追求的目标和顶峰，也是人生所能抵达的最精妙的欢欣与幸福。若有什么最值得欢呼、最该迎进心里，那就是爱情。
        - id: ch01-b22
          speaker: narrator
          text: >-
            可它真的来临时，我反倒不敢相信。这样的幸运怎么会属于我？它太美好了，美好得不像真的。西蒙斯的诗句就在这时浮上我的心头。诗里说，这些年来，我一直在女人的世界里四处漂泊，只为寻找你。
        - id: ch01-b23
          speaker: narrator
          text: >-
            可后来，我已经停止寻找。我早认定，世间最伟大的这件事不会属于我。弗鲁赛斯说得没错，我是一个异于常人的“没有感情的怪物”，一个古怪的书呆子，只会在思想的感受中得到快乐。我一生都生活在女人中间，却只懂得欣赏她们的美，从没有生出其他情意。
        - id: ch01-b24
          speaker: narrator
          text: >-
            有时，我甚至真觉得自己被挡在了情感世界之外。我像个出家人，永远不会拥有那些恒久或短暂的激情，尽管我在别人身上看得那么清楚，也了解得那么透彻。然而现在，爱情来了。没有梦想过，也没有任何预兆，它就这样来了。
        - id: ch01-b25
          speaker: narrator
          text: >-
            我怀着只能称为狂喜的心情，离开升降口顶端的岗位，沿着甲板往前走，嘴里轻声念起勃朗宁夫人的诗。许多年前，我与幻影相伴，而不是世间的男男女女。我发现它们也是温柔的伴侣，从未想过还有比它们奏出的乐声更甜美的旋律。
        - id: ch01-b26
          speaker: narrator
          text: >-
            可此刻，那更甜美的旋律就在我耳边回响。我再也看不见周围，也察觉不到周围的一切。直到海狼·拉森尖厉的声音响起，我才猛然惊醒。
        - id: ch01-b27
          speaker: wolf_larsen
          text: 你到底在搞什么鬼？
          emotion: angry
        - id: ch01-b28
          speaker: narrator
          text: >-
            我不知不觉走到了船头，水手们正在那里刷油漆。等我回过神，才发现自己抬起的脚就要踢翻一罐油漆。
        - id: ch01-b29
          speaker: wolf_larsen
          text: 你这是梦游，还是中了暑？到底怎么回事？
          emotion: angry
        - id: ch01-b30
          speaker: humphrey
          text: 都不是，只是消化不良。
        - id: ch01-b31
          speaker: narrator
          text: 我顶了他一句，随后若无其事地继续往前走。
