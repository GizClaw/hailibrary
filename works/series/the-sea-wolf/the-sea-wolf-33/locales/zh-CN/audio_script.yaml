audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十三章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我们等了一整天，始终不见海狼·拉森上岸。那份焦灼简直叫人无法忍受。我和莫德一次次望向“幽灵号”，可甲板上连他的影子都没有。
        - id: ch01-b02
          speaker: humphrey
          text: >-
            也许他的头又痛了。我走的时候，他还躺在艉楼甲板上，说不定会在那里过夜。我还是去看一眼吧。
        - id: ch01-b03
          speaker: narrator
          text: 莫德望着我，眼里全是恳求。
        - id: ch01-b04
          speaker: humphrey
          text: 别担心，我会带上左轮手枪。船上的武器全被我收走了，你知道的。
        - id: ch01-b05
          speaker: maud_brewster
          text: >-
            可他还有胳膊，还有那双手！那双手太可怕了。汉弗莱，我真的怕他。别去，求你了，别去！
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: >-
            她把手轻轻搭在我手上，我的脉搏立刻乱了。那一刻，我的心意一定全露在眼里。这个珍贵的女人依恋着我，向我求助，就像阳光和露水，让我身为男人的力量扎得更深，又生出新的勇气。我几乎伸手搂住她，就像我们身处海豹群中那次。可我想了想，还是忍住了。
        - id: ch01-b07
          speaker: humphrey
          text: 我不会冒险，只从船头探一眼就回来。
        - id: ch01-b08
          speaker: narrator
          text: >-
            她郑重地握了一下我的手，这才让我走。我上船以后，发现他先前躺着的那块甲板已经空了，他显然回到了舱里。那天夜里，我和莫德轮流守望，一个睡觉，一个值守。谁也不知道海狼·拉森会做什么，而他确实什么事都做得出来。
        - id: ch01-b09
          speaker: narrator
          text: 第二天，他没有动静。第三天，依旧如此。到了第四天下午，莫德终于开口了。
        - id: ch01-b10
          speaker: maud_brewster
          text: >-
            他总是头痛，还会突然发作。也许这一次病得很重。说不定，他已经死了。
        - id: ch01-b11
          speaker: narrator
          text: 她等了很久，我仍没有接话。
        - id: ch01-b12
          speaker: maud_brewster
          text: 或者，他正在死去。
        - id: ch01-b13
          speaker: humphrey
          text: 那样反而更好。
        - id: ch01-b14
          speaker: maud_brewster
          text: 可他也是一个人啊，汉弗莱。他也许正在生命最后一刻，身边却谁都没有。
        - id: ch01-b15
          speaker: humphrey
          text: 也许吧。
        - id: ch01-b16
          speaker: maud_brewster
          text: >-
            是的，就算只是也许，我们也不能不管。我们不知道他到底怎么样了。假如他真在那里孤零零地死去，我永远都不会原谅自己。我们得做点什么。
        - id: ch01-b17
          speaker: humphrey
          text: 也许吧。
        - id: ch01-b18
          speaker: narrator
          text: >-
            我故意不再开口，心里却有些好笑。莫德毕竟是莫德，就连海狼·拉森那样的人也能得到她的关切。可她对我的关切又在哪里呢？我刚才只想上船看一眼，她还怕得不肯让我去。她心思太细，很快听出了我的沉默，也像往常一样直截了当。
        - id: ch01-b19
          speaker: maud_brewster
          text: >-
            汉弗莱，你必须上船弄清楚。要是你想笑我，那就笑吧。我准许你笑，也不会怪你。
        - id: ch01-b20
          speaker: narrator
          text: 我听话地起身，沿海滩往船边走去。
        - id: ch01-b21
          speaker: maud_brewster
          text: 一定要小心！
        - id: ch01-b22
          speaker: narrator
          text: >-
            我站在艏楼甲板上朝她挥手，然后跳上船，走到船尾梯道口，只向下面喊了一声。海狼·拉森回应了。他登梯时，我扳起手枪击锤，谈话时也一直明晃晃地让他看见枪。可他根本没有理会。外表看去，他和上次一样，只是阴沉得很，几乎一句话也不说。我们勉强交换的那几句话，实在称不上一次交谈。
        - id: ch01-b23
          speaker: narrator
          text: >-
            我没有问他为什么不上岸，他也没问我为何一直不来。他只告诉我，头已经不痛了。我听过便走，没有多谈。莫德听完我的报告，见我平安回来，明显松了口气。后来厨房升起炊烟，她才真正轻快了些。
        - id: ch01-b24
          speaker: narrator
          text: >-
            接下来两天，厨房里一直有烟，偶尔还能看见他站在艉楼甲板上。除此之外，再没有别的动静。他从不上岸。我们仍旧彻夜轮流守望，所以很清楚这一点。我们等着他出手，等他亮出底牌，他却始终按兵不动。这份沉默让我们猜不透，也比任何行动更叫人不安。
        - id: ch01-b25
          speaker: narrator
          text: >-
            一个星期就这样过去了。除了海狼·拉森，我们再也无心顾及任何事情。他的存在像一块沉重的阴影，压得我们惶惶不安，原先打算做的那些零碎工作也全都搁下了。
        - id: ch01-b26
          speaker: narrator
          text: >-
            周末时，厨房不再冒烟，艉楼甲板上也看不到他了。我看得出莫德的忧虑一天天增长，可她胆怯地忍着，也许还带着一点骄傲，不肯再次向我提出那个请求。谁又能责怪她呢？她有近乎神圣的无私，又终究是个女人。
        - id: ch01-b27
          speaker: narrator
          text: >-
            其实，连我也无法忍受那个念头。一个曾被我试图杀死的人，可能就在离同类这么近的地方独自死去。海狼·拉森说得对，我所属群体的道德准则比我更强。他有手，有脚，有一副大致和我相似的身体。这副同类的形体本身，就向我提出了一份无法拒绝的要求。我不能对他的死活置之不理。
        - id: ch01-b28
          speaker: narrator
          text: >-
            这次不用莫德开口。我说炼乳和橘子果酱快没了，准备上船取些。她明显犹豫起来，甚至低声说这两样东西并不是必需品，为它们冒险恐怕不值得。她先前听得懂我的沉默，现在也听懂了这番借口。她知道，我不是为了食物上船。我是为了她，也为了她自以为藏住、其实早被我看见的忧虑。
        - id: ch01-b29
          speaker: narrator
          text: >-
            登上艏楼甲板，我便脱掉鞋，只穿袜子悄无声息地走向船尾。这回我没有站在梯道口喊人，而是谨慎地下去。统舱里空荡荡的，海狼·拉森的舱门紧闭着。我本想敲门，又记起自己说过要来取食物，便先轻轻掀开地板活门，放到一旁。下面的储藏室里既有食物，也有船上的衣物用品，我趁机取了一批内衣。
        - id: ch01-b30
          speaker: narrator
          text: >-
            刚从储藏室爬出来，我就听见他的舱里有动静。我立刻蹲下细听。门把手响了。我偷偷缩到桌后，完全出于本能地拔枪，扳起击锤。门一开，他走了出来。那个战士，那个强者，那个从不屈服的海狼·拉森，脸上竟满是我从未见过的绝望。
        - id: ch01-b31
          speaker: narrator
          text: >-
            他像一个绝望得绞着双手的人那样举起紧握的拳头，痛苦地呻吟。一只拳头忽然松开，摊开的手掌从眼前扫过，仿佛要把遮在眼前的蛛网拂掉。
        - id: ch01-b32
          speaker: wolf_larsen
          text: 上帝！上帝！
        - id: ch01-b33
          speaker: narrator
          text: >-
            他的双拳再次举起，喉咙里全是无边的绝望。我看得浑身发抖，寒意顺着脊背来回蹿，额头也冒出冷汗。世上恐怕没有多少景象，比一个强者彻底软弱、彻底崩溃时更可怕。
        - id: ch01-b34
          speaker: narrator
          text: >-
            可他凭那股惊人的意志，硬是把自己重新控制住。那绝不是轻易做到的。他全身都在这场搏斗中颤抖，像是马上要抽搐起来。他想让脸恢复平静，五官却因用力而扭曲，最后再次崩溃。他举起双拳，又呻吟起来，猛吸了几口气，还像哭泣一样发出了呜咽。
        - id: ch01-b35
          speaker: narrator
          text: >-
            最后，他终于成功了。乍看之下，从前那个海狼·拉森又回来了，可动作里仍隐约藏着一点虚弱和迟疑。他朝梯道走来，像我熟悉的那个他一样迈步，但那一点反常并没有消失，就连他的步态里也看得出来。
        - id: ch01-b36
          speaker: narrator
          text: >-
            这时我才想到自己的危险。敞开的活门正横在他的路上，只要他发现那个洞口，马上也会发现蹲在地上的我。我恨自己竟让自己落进这样怯懦的处境。好在还来得及，我飞快站起来，不知不觉摆出了迎战的姿势。可他没有看我，也没有看见活门，竟一脚踏进洞口。
        - id: ch01-b37
          speaker: narrator
          text: >-
            一只脚正在落下，另一只才要抬起。踩空的瞬间，他那一身老虎般的肌肉猛然发力。正在坠落的身体一下弹过洞口，胸腹着地，伸开的双臂也重重落在对面。他立刻收起双腿，翻滚到一旁，却滚进了我的果酱和内衣堆，又撞上活门板。
        - id: ch01-b38
          speaker: narrator
          text: >-
            他脸上露出彻底明白过来的神情。我还没猜出他明白了什么，他已经把活门盖回原位，封住了储藏室。原来他以为我仍被困在下面。直到此刻我才知道，海狼·拉森瞎了，瞎得像蝙蝠一样，什么也看不见。
        - id: ch01-b39
          speaker: narrator
          text: >-
            我小心控制着呼吸，生怕被他听见。他快步走向自己的舱门，手在离门把一英寸的地方抓了个空，随即飞快摸索，终于找到了。机会来了。我踮脚穿过统舱，退到梯道顶端。他拖来一只沉重的船用箱压住活门，又搬来第二只叠在上面，这才放心。接着，他拾起果酱和内衣放到桌上，开始登梯。我悄悄退开，翻身滚到舱顶。
        - id: ch01-b40
          speaker: narrator
          text: >-
            他把舱盖推开一半，双臂搭在上面，身子还留在梯道里。他仿佛在纵目望向整条纵帆船的船头，可那双眼睛其实只是在直直瞪着，一动不动，连眨也不眨。我离他不过五英尺，正站在他本该看见的地方。可对他来说，我根本不存在。那感觉诡异极了，我仿佛真的成了幽灵。
        - id: ch01-b41
          speaker: narrator
          text: >-
            我在他面前来回挥手，当然没有作用。可手影扫过他的脸时，他立刻警觉起来，神情也绷紧了。他知道外界有什么东西触动了自己的感官，知道身边出现了变化，却怎么也猜不出那是什么。我停住手，让阴影固定。他慢慢来回移动脑袋，又把脸转向两边，一会儿迎着太阳，一会儿落进阴影，像是在用皮肤感觉那片暗处，试着从感觉里辨认它。
        - id: ch01-b42
          speaker: narrator
          text: >-
            我也忙着思索，他怎么会察觉影子这样无形的东西？若只是眼球受损，或者视神经还没有完全坏死，那很容易解释。否则，我能想到的唯一答案，就是他敏锐的皮肤感觉到了阳光和阴影之间的温差。又或许，真有什么传说中的第六感，让他知道近处有东西，感觉到它模糊的形体和存在。
        - id: ch01-b43
          speaker: narrator
          text: >-
            他终于放弃了辨认阴影，走上甲板，快速而自信地朝船头走去。他竟然还能走得这样快、这样稳，实在令我吃惊。可仔细看去，他步子里仍带着盲人才有的那一点虚弱。如今，我终于知道先前那种异样是什么了。
        - id: ch01-b44
          speaker: narrator
          text: >-
            叫我又好笑又懊恼的是，他找到了我落在艏楼甲板上的鞋，还把它们拿回厨房。我躲在一旁，看着他生起火，动手给自己做饭。等他忙起来，我才偷偷溜回统舱，取走放在桌上的果酱和内衣。随后，我又悄无声息地经过厨房，爬下船回到海滩，赤着脚把船上发生的一切告诉莫德。
