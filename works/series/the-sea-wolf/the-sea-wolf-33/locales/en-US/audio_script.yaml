audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: forceful and controlled, with a hard edge even in weakness
        timbre: deep, rough, and resonant
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER XXXIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            All day, we waited for Wolf Larsen to come ashore. The strain was almost unbearable. Again and again, one of us looked toward the Ghost, expecting to see him. But he never came. He did not even show himself on deck.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Perhaps his headache has returned. I left him lying on the poop, and he may stay there all night. I think I'll go and look.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Maud looked at me as if she were begging me not to go.
        - id: ch01-b04
          speaker: narrator
          text: >-
            It will be all right. I'll take the revolvers. You know I gathered up every weapon aboard.
        - id: ch01-b05
          speaker: maud_brewster
          text: >-
            But he still has his arms and his hands. Those terrible, terrible hands! Oh, Humphrey, I'm afraid of him. Please don't go!
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: >-
            She laid her hand on mine, pleading with me, and my pulse leaped. For a moment, everything I felt for this dear and lovely woman must have shown in my eyes. Her need for me seemed to call up a new strength in me. I nearly put my arm around her, as I had among the seals. Then I thought better of it and held back.
        - id: ch01-b07
          speaker: narrator
          text: >-
            I won't take any chances. I'll only look over the bow and see whether he's there.
        - id: ch01-b08
          speaker: narrator
          text: >-
            She pressed my hand, then let me leave. When I looked aboard, the place where I had left Wolf Larsen was empty. He had plainly gone below. That night, Maud and I took turns keeping watch while the other slept. There was no telling what he might do. He was capable of anything.
        - id: ch01-b09
          speaker: narrator
          text: >-
            We waited through the next day, and through the day after that. Still, he gave us no sign.
        - id: ch01-b10
          speaker: maud_brewster
          text: >-
            These headaches and attacks of his... Perhaps he is ill, terribly ill. He may even be dead.
        - id: ch01-b11
          speaker: narrator
          text: >-
            I said nothing. After waiting a while, she spoke again.
        - id: ch01-b12
          speaker: maud_brewster
          text: >-
            Or he may be dying.
        - id: ch01-b13
          speaker: narrator
          text: >-
            That would be better.
        - id: ch01-b14
          speaker: maud_brewster
          text: >-
            But think of him, Humphrey. He is another human being, and he may be facing his final hour alone.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Perhaps he is.
        - id: ch01-b16
          speaker: maud_brewster
          text: >-
            Yes, perhaps. We don't really know. But if he were dying, and we did nothing, it would be terrible. I could never forgive myself. We have to do something.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Perhaps we do.
        - id: ch01-b18
          speaker: narrator
          text: >-
            I waited, secretly amused that her generous nature made her worry even about Wolf Larsen. And what about me? Only days before, she had been afraid to let me so much as look aboard.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Maud was too perceptive to miss what my silence meant. She answered me directly.
        - id: ch01-b20
          speaker: maud_brewster
          text: >-
            You must go aboard and find out, Humphrey. And if you want to laugh at me, you may. I forgive you already.
        - id: ch01-b21
          speaker: narrator
          text: >-
            I obeyed and started down the beach.
        - id: ch01-b22
          speaker: maud_brewster
          text: >-
            Please be careful!
        - id: ch01-b23
          speaker: narrator
          text: >-
            I waved to her from the forecastle head, then dropped to the deck. I went aft to the cabin stairs but stopped at the top and called down. Wolf Larsen answered. As he began climbing toward me, I cocked my revolver.
        - id: ch01-b24
          speaker: narrator
          text: >-
            I kept the weapon where he could see it while we spoke, though he paid it no attention. His body looked the same as before, but he was silent and gloomy. We exchanged so few words that it hardly counted as a conversation. I did not ask why he had stayed aboard, and he did not ask why I had kept away.
        - id: ch01-b25
          speaker: wolf_larsen
          text: >-
            My head is all right again.
        - id: ch01-b26
          speaker: narrator
          text: >-
            With that, I left him. Maud was plainly relieved by my report. Later, smoke rose from the galley, and the sight cheered her further.
        - id: ch01-b27
          speaker: narrator
          text: >-
            The galley smoke appeared the next day and the day after that. Now and then, we caught sight of Wolf Larsen on the poop. But he never tried to come ashore. We knew because we still took turns watching at night. We kept expecting him to act, to reveal what he meant to do. Instead, his silence and stillness worried and confused us.
        - id: ch01-b28
          speaker: narrator
          text: >-
            A week passed that way. We could think of nothing but Wolf Larsen. The fear of his presence hung over us so heavily that we could not begin any of the small tasks we had planned.
        - id: ch01-b29
          speaker: narrator
          text: >-
            At the week's end, smoke stopped rising from the galley, and Wolf Larsen disappeared from the poop. I saw Maud's concern return. Yet she was too timid, and perhaps too proud, to ask me again. How could I blame her? Her kindness reached everyone. Besides, I also felt the pain of imagining this man, whom I had once tried to kill, dying alone while two other people were so near.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Wolf Larsen had been right about me. The code of my own people was stronger than I was. He had hands, feet, and a body shaped like mine. That alone gave him a claim on me which I could not ignore.
        - id: ch01-b31
          speaker: narrator
          text: >-
            This time, I did not wait for Maud to send me. I announced that we needed condensed milk and marmalade, and that I was going aboard for them. She hesitated. She even murmured that we could do without those things, and that the trip might be unwise.
        - id: ch01-b32
          speaker: narrator
          text: >-
            But just as she had understood my silence before, she understood my excuse now. She knew I was not going for milk and marmalade. I was going for her, and for the worry she had tried and failed to hide.
        - id: ch01-b33
          speaker: narrator
          text: >-
            When I reached the forecastle head, I removed my shoes. In my stocking feet, I crept quietly aft. This time, I did not call from the companionway. I went down with care and found the cabin empty. The door of Wolf Larsen's stateroom was shut.
        - id: ch01-b34
          speaker: narrator
          text: >-
            At first, I meant to knock. Then I remembered the reason I had given for coming aboard and decided to carry out my errand. Without making a sound, I raised the trapdoor in the cabin floor and set it aside. The lazarette below held both the provisions and the ship's store of clothing, so I took the chance to gather some underwear as well.
        - id: ch01-b35
          speaker: narrator
          text: >-
            As I climbed out of the lazarette, I heard movement inside Wolf Larsen's room. I crouched and listened. The doorknob rattled. Without thinking, I slipped behind the table, drew my revolver, and cocked it.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The door opened, and Wolf Larsen came out. I had never seen such deep despair on any face, least of all the face of this fighter, this powerful man who had always seemed impossible to defeat. Yet there he stood before my eyes. He lifted his clenched fists as though wringing his hands, and a groan came from him. One fist opened, and his palm swept across his eyes as if he were brushing away cobwebs.
        - id: ch01-b37
          speaker: wolf_larsen
          text: >-
            God! God!
          emotion: sad
        - id: ch01-b38
          speaker: narrator
          text: >-
            He raised his fists again, and his voice shook with endless despair. The sight was horrible. My whole body trembled. Shivers ran along my spine, and sweat broke out on my forehead. There can be few things in this world more awful than seeing a strong man at the moment when he is completely weak and broken.
        - id: ch01-b39
          speaker: narrator
          text: >-
            By sheer force of will, Wolf Larsen fought himself back under control. It took everything he had. His body shook with the struggle, like a man on the edge of a fit. He tried to make his face calm, but it twisted with the effort until he broke down once more. Again, his clenched fists rose. Again, he groaned. He caught his breath, and once or twice he sobbed.
        - id: ch01-b40
          speaker: narrator
          text: >-
            At last, he succeeded. He could almost have been the old Wolf Larsen again. Yet there was something uncertain and weak in the way he moved. He started toward the companionway with what looked like his old stride, but even in his walk, that uncertainty remained.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Now I began to fear for myself. The open trapdoor lay straight in his path. If he found it, he would find me at once. I was furious with myself for being caught in such a cowardly position, crouched on the floor. There was still time to move. I sprang to my feet and, without meaning to, stood as if I were ready to defy him.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Wolf Larsen paid no attention to me. He did not notice the open trap either. Before I could understand what was happening, he stepped directly into it. One foot dropped into the opening while the other was just beginning to rise.
        - id: ch01-b43
          speaker: narrator
          text: >-
            The moment his foot met empty air instead of solid floor, the old Wolf Larsen returned. His muscles reacted like a tiger's. Even as his body fell, he threw himself across the hole. He struck the floor on the other side with his chest and stomach, his arms stretched out before him. In an instant, he pulled up his legs and rolled clear. He rolled into my marmalade and underwear and came to rest against the trapdoor.
        - id: ch01-b44
          speaker: narrator
          text: >-
            His face showed complete understanding. Before I could guess what he thought he knew, he dropped the trapdoor back into place and sealed the lazarette. Then the truth came to me. He believed I was trapped below. And he was blind. Blind as a bat.
        - id: ch01-b45
          speaker: narrator
          text: >-
            I watched him and kept my breathing quiet so he would not hear me. He hurried to his stateroom. His hand reached an inch to one side of the doorknob. Then he felt around, found it, and went inside. This was my chance. I crossed the cabin on tiptoe and reached the top of the stairs.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Wolf Larsen returned, dragging a heavy sea chest. He set it on the trapdoor. That was not enough for him. He brought a second chest and stacked it on the first. Then he picked up the marmalade and clothing and placed them on the table.
        - id: ch01-b47
          speaker: narrator
          text: >-
            When he started up the companionway, I slipped back and silently rolled onto the cabin roof. He pushed the slide partway open and rested his arms upon it while the rest of his body remained in the companionway. He seemed to be staring along the length of the schooner. His eyes were fixed and never blinked.
        - id: ch01-b48
          speaker: narrator
          text: >-
            I was only five feet away, directly in the place where he appeared to be looking. It felt strange and eerie. I might have been a ghost, invisible to him. I moved my hand back and forth before his face. Of course, he did not see it. But when its shadow crossed him, I knew at once that he felt something.
        - id: ch01-b49
          speaker: narrator
          text: >-
            His face tightened with expectation. He tried to understand the change. Something outside him had touched his senses, but he could not tell what it was. I stopped moving my hand and held the shadow still. Slowly, he shifted his head from side to side beneath it, passing from sunlight into shade and back again. It was as though he could feel the shadow and was testing it against his skin.
        - id: ch01-b50
          speaker: narrator
          text: >-
            I tried to understand it too. Perhaps his eyes could still sense a little light, or perhaps the nerve behind them was not entirely destroyed. If not, then maybe the skin of his face could feel the difference between warm sunlight and cool shade. Or could it have been that mysterious sixth sense which warns a person when something is close? I could not know.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Wolf Larsen gave up trying to identify the shadow. He stepped onto the deck and moved forward with a speed and confidence that surprised me. Still, there was a faint weakness in his walk. Now I knew what it was. It was the uncertainty of a blind man.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Then, to my amused annoyance, he found the shoes I had left on the forecastle head. He carried them back to the galley. I watched him make a fire and begin cooking his meal.
        - id: ch01-b53
          speaker: narrator
          text: >-
            While he was busy, I slipped into the cabin, took my marmalade and underwear, and crept past the galley. Then I climbed down to the beach and delivered my report in bare feet.
