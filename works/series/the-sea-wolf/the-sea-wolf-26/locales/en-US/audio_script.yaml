        pitch: medium-low
  chapters:
    - id: ch01
      title: CHAPTER XXVI
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Wolf Larsen took the whisky out of my hands and saw to its distribution himself. Meanwhile, I went on caring for a fresh group of wounded men in the forecastle. I had watched men at clubs sip whisky mixed with soda, but I had never seen anyone drink as these sailors did. They poured it into mugs and tin cups or lifted the bottles straight to their mouths. Every cup brimmed over, and every swallow seemed large enough to make a man drunk by itself. Still, no one stopped after one or two. The bottles kept moving forward, and the men kept drinking.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Everyone joined in. The wounded drank, and so did Oofty-Oofty while he helped me with them. Louis alone remained careful. He let the liquor wet his lips and no more. Even so, he entered into the wild celebration with as much abandon as nearly anyone there.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The forecastle became a drunken feast without limits. In voices loud enough to fill the cramped room, the men relived the day's fighting. They quarreled over how each blow had fallen and who had done what. A little later, the same men grew affectionate and made friends with those they had fought. Prisoners and captors sagged against one another's shoulders. Between hiccups, they swore enormous oaths of respect and friendship. They wept over all the misery behind them. Then they wept over what still waited for them beneath Wolf Larsen's iron rule. They cursed him together, and one terrible account of his cruelty followed another.
        - id: ch01-b04
          speaker: narrator
          text: >-
            It made a strange and frightening spectacle. Bunks lined the narrow space. As the ship rolled, the floor and walls seemed to leap and lurch around us. The light was dim, and every moving body cast a swaying shadow that stretched to monstrous size and then suddenly shortened. The air was thick with smoke. The smells of crowded bodies and iodoform hung heavily in it. Through that haze I saw the men's hot, inflamed faces. I could hardly call them whole men anymore. They seemed like half-men.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Oofty-Oofty held one end of a bandage and looked across the room. His dark, velvety eyes shone in the light like the eyes of a deer. Yet I knew what lived behind them. A savage devil hid inside him and made a lie of the softness and tenderness of his face and form, which were almost womanly. Then I noticed Harrison. His boyish face had once been a good face. Now passion twisted it until it looked like a demon's. He told the newcomers what sort of hell-ship had captured them, and he screamed curse after curse at Wolf Larsen.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Always the shouting came back to Wolf Larsen. He was their enslaver and their tormentor. I thought of Circe turning men into swine, except that this Circe was male and these were his suffering beasts. They crawled before him while they were sober. Only in drunkenness, and only in secret, did they dare rise against him. Then the question turned upon me. Had he made one of his swine of me too? And what of Maud Brewster?
        - id: ch01-b07
          speaker: narrator
          text: >-
            No! I ground my teeth with such anger and determination that the man I was treating flinched beneath my hand. Oofty-Oofty looked at me curiously. All at once, a new strength seemed to fill me. With my newly discovered love inside me, I felt like a giant. Nothing frightened me. Somehow I would force my will through every obstacle, in spite of Wolf Larsen and in spite of my own thirty-five bookish years. Everything would be well. I would make it well.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Filled with that sense of strength, I turned away from the howling room and climbed on deck. Fog drifted like a ghost through the night. The air there was sweet, clean, and still.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Two wounded hunters lay in the steerage, so I went there next to care for them. What I found was another version of the forecastle. The same bottles were passing, the same loud drunken companionship filled the cramped space, and wounded men drank along with the rest. There was one important difference. In the steerage, no one cursed Wolf Larsen. Even so, the room oppressed me. It was a great relief to escape it, breathe the night air again, and make my way aft. When I entered the cabin, supper stood ready. Wolf Larsen and Maud had waited for me before beginning.
        - id: ch01-b10
          speaker: narrator
          text: >-
            All around him, his ship was getting drunk as quickly as it could. Wolf Larsen, however, stayed completely sober. Not one drop passed his lips. In those circumstances, he did not dare drink. Louis and I were the only men left whom he could depend upon, and Louis was already at the wheel. The Ghost kept sailing through the fog without a lookout and without showing any lights.
        - id: ch01-b11
          speaker: narrator
          text: >-
            I could not understand at first why Wolf Larsen had released so much liquor among men who had only just fought one another. It seemed a dangerous choice when so few sober hands remained to work the ship. But he knew the minds of these men better than I did. Bloodshed had brought the old crew and the captured hunters together as enemies. Now shared bottles, boasts, tears, and curses were turning that violent beginning into rough friendship. He had chosen the quickest means of making their new good feeling firm.
        - id: ch01-b12
          speaker: narrator
          text: >-
            His victory over Death Larsen seemed to have worked a remarkable change in him. The evening before, his own reasoning had carried him down into the depths of gloom. I had spent the night expecting one of his familiar violent outbursts at any moment, yet nothing had happened. Now he was in splendid condition. Perhaps the success of capturing so many hunters and boats had prevented the reaction that usually followed his dark moods. At any rate, the gloom had vanished, and his blue devils had not appeared. That was what I thought at the time. I knew far too little of him. Even then, perhaps, he was considering an outbreak more terrible than any I had witnessed.
        - id: ch01-b13
          speaker: narrator
          text: >-
            When I entered the cabin, every part of him showed that splendid condition. He had gone for weeks without one of his headaches. His eyes were as clear and blue as the open sky. Perfect health gave beauty to his bronzed skin, and life seemed to run through his veins in one full and magnificent flood. He had not spent the wait in silence. He and Maud were already deep in animated discussion. Their subject was temptation. From the words I heard, I understood Wolf's position. A temptation became a real temptation, he argued, only if it seduced a man and made him fall.
        - id: ch01-b14
          speaker: wolf_larsen
          text: >-
            Look at it this way. A man acts because he wants something. He may want to escape pain or find pleasure, but whatever he does, he does because he desires it.
        - id: ch01-b15
          speaker: maud_brewster
          text: >-
            But what if he wants two opposite things and cannot have one without giving up the other?
        - id: ch01-b16
          speaker: wolf_larsen
          text: >-
            That's exactly where I was going.
        - id: ch01-b17
          speaker: maud_brewster
          text: >-
            And that choice is where a man's soul reveals itself. A good soul wants the good act and performs it. A bad soul chooses the opposite. The soul makes the decision.
        - id: ch01-b18
          speaker: wolf_larsen
          emotion: angry
          text: >-
            Nonsense! Desire makes the decision. Take a man who wants to get drunk. At the same time, he does not want to get drunk. So what does he do, and how does he choose? He is a puppet. His desires control him, and out of the two he obeys the stronger. That is all there is to it. His soul has no part in the matter. If he stays sober, the desire for sobriety has simply proved stronger.
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            How can drink tempt him if he refuses it? Temptation means nothing unless... unless he was tempted to stay sober!
        - id: ch01-b20
          speaker: narrator
          text: >-
            He laughed at the new thought.
        - id: ch01-b21
          speaker: wolf_larsen
          emotion: happy
          text: >-
            Ha! What do you make of that, Mr. Van Weyden?
        - id: ch01-b22
          speaker: narrator
          text: >-
            I think both of you are splitting hairs. The man's soul is his desires. Or put it another way. Add all of his desires together, and the result is what you call his soul. That is why both arguments miss the point. Wolf, you speak as though desire exists apart from the soul. Miss Brewster speaks as though the soul exists apart from desire. But you cannot separate them that way. In the actual man, soul and desire are one and the same thing.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Still, Miss Brewster is right about one thing. Temptation remains temptation whether the man gives in or overcomes it. Think of desire as a fire. Wind fans a fire until the flames leap fiercely upward. Desire behaves in the same way. The man sees the thing he wants. Or someone gives him a new and alluring description of it, a new way of understanding what it could offer him. That sight or idea is the wind. It fans his desire until the desire rises and tries to master him. That is where temptation lies. The wind may not blow hard enough to make the desire overpowering. Yet however little it feeds the flame, it tempts him by that much. And as you said, the wind can tempt a man toward good just as easily as toward evil.
        - id: ch01-b24
          speaker: narrator
          text: >-
            We sat down at the table, and I felt proud. My answer had settled the matter, or at least ended the argument.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Wolf Larsen was more talkative than I had ever known him. He seemed filled to bursting with stored-up energy, and somehow it had to find a way out. Almost as soon as the first argument ended, he launched into another discussion, this time about love. As usual, he took the purely physical side of the question. Maud answered him from the idealistic side. I stayed mostly outside their contest. Now and then I offered a word of suggestion or corrected some small point, but I took no real part.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Wolf was brilliant, but Maud was brilliant too. Before long, I lost the thread of what they were saying. Instead of following the argument, I studied her face as she spoke. Usually, very little color showed there. That night her cheeks were flushed and her whole face was alive. Her wit flashed keenly. She took as much pleasure in crossing ideas with Wolf as he took in answering her, and he enjoyed their contest enormously.
        - id: ch01-b27
          speaker: narrator
          text: >-
            At some point, Wolf reached for a quotation from Iseult at Tintagel. I never knew exactly why it served his argument, because by then I had lost that argument completely. One loose brown lock of Maud's hair had caught my attention. I watched it while the discussion flowed past me, and Wolf's reasoning vanished from my mind. Only when he began to recite the lines did his voice draw me back.
        - id: ch01-b28
          speaker: wolf_larsen
          text: >-
            Blessed am I beyond women even herein, that beyond all born women is my sin, and perfect my transgression.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Earlier, Wolf had read his own pessimism into Omar. Now he drew something different from Swinburne's lines. He made them ring with triumph, but not with any gentle victory. It was a triumph that stung, proud and exultant in its sin. This time his interpretation was true to the words. He understood them, and his powerful voice gave them their full meaning. The last sound had scarcely died away when Louis put his head into the companionway. He kept his warning to a whisper so it would not travel through the ship.
        - id: ch01-b30
          speaker: louis
          text: >-
            Take care, will you? The fog has lifted, and a steamer's port light is crossing our bow this very minute.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Wolf Larsen moved the instant he heard. He sprang up the companionway and onto the deck. Maud and I followed as quickly as we could, but his speed was astonishing. Before we reached him, he had pulled the steerage slide across its opening and shut the drunken clamor below. He was already racing forward to close the forecastle hatch as well. Any shout or song escaping from either place might carry across the water and betray us.
        - id: ch01-b32
          speaker: narrator
          text: >-
            The fog had lifted, but it had not disappeared. It hung high overhead, where it hid the stars and made the night utterly black. Straight ahead of the Ghost, I could see a bright red light with a white light beside it. From the darkness came the steady pulsing of a steamer's engines. The lights and that sound told us all we needed to know. There could be no doubt that the ship crossing our bow was the Macedonia.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Wolf returned to the poop. We stood together without a word and watched the lights move quickly across our bow.
        - id: ch01-b34
          speaker: wolf_larsen
          text: >-
            I'm lucky he doesn't carry a searchlight.
        - id: ch01-b35
          speaker: narrator
          text: >-
            What would happen if I shouted?
        - id: ch01-b36
          speaker: narrator
          text: >-
            I kept my voice to a whisper.
        - id: ch01-b37
          speaker: wolf_larsen
          text: >-
            That would finish everything. But have you considered what would happen at once?
        - id: ch01-b38
          speaker: narrator
          text: >-
            I had no time even to say that I wanted to know. His hand closed around my throat in that gorilla grip of his. Then the muscles gave the faintest quiver. It was hardly more than a hint, but I understood it perfectly. One small twist would break my neck. In the next moment, he released me as suddenly as he had seized me. Once more, we stood gazing at the Macedonia's lights as if nothing had passed between us.
        - id: ch01-b39
          speaker: maud_brewster
          text: >-
            And what if I shouted?
        - id: ch01-b40
          speaker: wolf_larsen
          text: >-
            I like you too much to hurt you.
        - id: ch01-b41
          speaker: narrator
          text: >-
            He spoke softly, with a tender caress in his voice that made me wince.
        - id: ch01-b42
          speaker: wolf_larsen
          text: >-
            But don't try it. I would break Mr. Van Weyden's neck immediately.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Then she has my permission to call out.
        - id: ch01-b44
          speaker: narrator
          text: >-
            I spoke in defiance.
        - id: ch01-b45
          speaker: wolf_larsen
          text: >-
            I doubt you'll be willing to sacrifice the second Dean of American Letters.
        - id: ch01-b46
          speaker: narrator
          text: >-
            After that, none of us spoke. By then we had grown too familiar with one another for silence itself to be uncomfortable. We simply watched while the red light and the white light moved away through the darkness. At last both disappeared. The danger of discovery had passed, and we returned to the cabin to finish the supper that Louis's warning had interrupted.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Soon Wolf and Maud were quoting poetry again. Maud chose Dowson's Impenitentia Ultima and recited it beautifully. Yet my eyes were not on her. I watched Wolf Larsen. The fascination on his face fascinated me in turn. He seemed to have gone completely outside himself. His lips moved without his knowing it. As fast as Maud spoke each word, his mouth silently formed the same word after her. When she reached two particular lines, he could no longer remain silent and broke in.
        - id: ch01-b48
          speaker: maud_brewster
          text: >-
            And her eyes should be my light while the sun went out behind me, and the viols in her voice be the last sound in my ear.
        - id: ch01-b49
          speaker: wolf_larsen
          text: >-
            There are viols in your voice.
        - id: ch01-b50
          speaker: narrator
          text: >-
            The words came from him bluntly, and his eyes flashed with their golden light. I could have shouted aloud with joy at Maud's control. She did not falter. She finished the concluding stanza as though his interruption had not shaken her at all. Afterward, she did not wrench the conversation away or reveal her alarm. Slowly and skillfully, she guided it into subjects that held less danger.
        - id: ch01-b51
          speaker: narrator
          text: >-
            All the while, I sat there in a kind of half-daze. Through the wall came the drunken riot from the steerage. Before me, the man I feared and the woman I loved went on talking and talking. The strange night seemed to have suspended the ship's ordinary life. The supper table was never cleared. The man who had taken Mugridge's place should have done it, but he had plainly abandoned his work to join his comrades in the forecastle.
        - id: ch01-b52
          speaker: narrator
          text: >-
            If Wolf Larsen ever reached the summit of living, he reached it then. The long table remained cluttered, the hidden crew roared behind the walls, and still his mind climbed higher. For stretches of time, my own thoughts held me and I scarcely heard what passed. Then some phrase or sudden force in his voice would bring me back. I would follow the swift movement of his reasoning and listen in amazement. His intellect was so remarkable that, for the moment, it mastered even my fear and hatred of him. His passion laid its spell upon me too. All that force drove him toward one subject, the passion of revolt. He did not merely examine rebellion as an idea. He preached it as the proper expression of a spirit strong enough to refuse obedience.
        - id: ch01-b53
          speaker: narrator
          text: >-
            It was inevitable that he would bring forward Milton's Lucifer as his great example. Wolf examined the character with astonishing sharpness, then pictured him so powerfully that I seemed to see the fallen angel before me. That analysis revealed the genius stifled inside this brutal man. It reminded me of Taine and his dangerous brilliance. Yet I knew Wolf had never even heard of that thinker. What I heard came from Wolf himself.
        - id: ch01-b54
          speaker: wolf_larsen
          text: >-
            Lucifer led a cause that was lost, yet he was not afraid of God's thunderbolts. Heaven hurled him down into hell, but even there he was not beaten. Before his fall, he had persuaded a third of God's angels to follow him. Afterward, he immediately turned to man and urged mankind to rebel against God. Think what he gained. For himself and for hell, he won the greater part of every generation of men.
        - id: ch01-b55
          speaker: wolf_larsen
          text: >-
            So why was Lucifer beaten out of heaven? Was he less brave than God? Was he less proud or less ambitious? No! A thousand times, no! He lost for one reason alone. God had greater power. Lucifer himself said it. Thunder was what made God greater.
        - id: ch01-b56
          speaker: wolf_larsen
          text: >-
            But Lucifer remained a free spirit. To serve was to suffocate. He would rather suffer and remain free than possess all the happiness that came with comfortable slavery. He had no wish to serve God. He had no wish to serve anything at all. He was not a figurehead, propped up to represent someone else's will. He stood upon his own legs. He answered for himself. He was an individual.
        - id: ch01-b57
          speaker: maud_brewster
          emotion: happy
          text: >-
            The first anarchist.
        - id: ch01-b58
          speaker: narrator
          text: >-
            She laughed as she rose to go to her stateroom.
        - id: ch01-b59
          speaker: wolf_larsen
          text: >-
            Then it is good to be an anarchist!
        - id: ch01-b60
          speaker: narrator
          text: >-
            Wolf stood too. He faced her where she had paused at her door and went on with Milton's defiant words.
        - id: ch01-b61
          speaker: wolf_larsen
          text: >-
            Here at least we shall be free. The Almighty has not built this place so He may envy us, and He will not drive us from it. Here we may reign secure. In my choice, to reign is worth ambition, even though the kingdom is hell. Better to reign in hell than serve in heaven.
        - id: ch01-b62
          speaker: narrator
          text: >-
            The words rang out as the defiant cry of a mighty spirit. Even after he stopped speaking, his voice seemed to fill the cabin. He stood there swaying with the motion of the ship. His bronzed face shone, his head was lifted, and his whole body carried the force of command. His golden eyes flashed toward Maud where she waited at her door. They were intensely, powerfully masculine, and at the same time they pressed upon her with an unmistakable softness.
        - id: ch01-b63
          speaker: narrator
          text: >-
            Maud looked back at him from the doorway. Once again, I saw in her eyes that terror which I could neither name nor mistake. His argument, his voice, and the man himself had become one thing before her.
        - id: ch01-b64
          speaker: maud_brewster
          emotion: fearful
          text: >-
            You are Lucifer.
