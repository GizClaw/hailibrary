audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
    louis:
      display_name: 路易斯
      tts:
        delivery: 老练机警，带着爱尔兰水手的爽直口气
        timbre: 粗粝而清楚的成年男声
        pace: 明快，提醒危险时压低放缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十六章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            海狼·拉森从我手里接过分发威士忌的差事。我在前舱照料新添的那批伤员，一瓶瓶酒也跟着送了进来。我见过人喝威士忌，比如俱乐部里的绅士喝掺苏打水的威士忌，却从没见过这样的喝法。水手用小铁锅、用杯子，甚至直接对着酒瓶。每一口都满得几乎溢出来，单独这一口便足以叫人烂醉。他们仍不肯停在一两口上。酒瓶不断往前传，人人喝了又喝。
        - id: ch01-b02
          speaker: narrator
          text: >-
            伤员喝，帮我的奥夫蒂-奥夫蒂也喝。只有路易斯很谨慎，只让酒沾了沾嘴唇，可他闹起来并不比别人收敛。整条船像在举行一场酒神的狂欢。他们大声重说白天的战斗，为谁做了什么、事情究竟怎样发生争吵，转眼又亲热起来，搂住刚交过手的人称兄道弟。俘虏和俘获他们的人彼此靠着肩膀打酒嗝，赌下惊人的重誓，说自己多么敬重、多么看得起对方。他们哭过去的苦难，也哭以后还要在拉森铁腕下受的苦，接着一起咒骂他，争讲他的残暴有多么骇人。
        - id: ch01-b03
          speaker: narrator
          text: >-
            那场面又怪异又可怕。狭窄的舱里排满铺位，地板和舱壁随着船身腾跃摇晃。昏暗灯光下，摇摆的影子怪异地忽而拉长，忽而缩短。烟雾、人的体味和碘仿的气味混在一起，压得空气浑浊。那些涨红的脸，只能算半个人的脸。奥夫蒂-奥夫蒂捏着绷带的一端看着这一切，天鹅绒般柔润明亮的眼睛在灯下像鹿眼一样闪光。可我知道，那张近乎女性般温柔的脸和身形下面，藏着一个野蛮的恶魔。哈里森那张原本端正的少年面孔，此刻也像恶魔一样因狂热而抽搐。他向新人讲述他们落进了一艘怎样的地狱船，又尖声把诅咒全泼向海狼·拉森。
        - id: ch01-b04
          speaker: narrator
          text: >-
            永远都是海狼·拉森。这个奴役人、折磨人的男性喀耳刻，把他们都变成了猪。他们是受苦的畜生，平日匍匐在他脚下，只有喝醉、躲在人后，才敢反抗。那么，我也是他的一头猪吗？莫德·布鲁斯特呢？不！我带着愤怒和决心咬紧牙关，连手下的伤员都疼得缩了一下。奥夫蒂-奥夫蒂好奇地望着我。一股从未有过的力量突然涌进身体。有了这份刚刚发现的爱情，我便是巨人。我什么也不怕。哪怕对手是海狼·拉森，哪怕我过去三十五年只懂书本，我也要凭自己的意志闯过这一切。一切都会好起来，我要亲手让它好起来。
        - id: ch01-b05
          speaker: narrator
          text: >-
            我被这股信念托着，转身离开号叫的地狱，登上甲板。夜雾像幽灵般飘荡，空气清甜、纯净而安静。统舱里还有两个受伤的猎手，我进去查看了一遍，那里又是前舱景象的重演，唯一的区别，是没人咒骂海狼·拉森。我再次回到甲板时如释重负，随即走向船艉主舱。晚餐已经摆好，拉森和莫德都在等我。
        - id: ch01-b06
          speaker: narrator
          text: >-
            全船的人拼命把自己灌醉，拉森却始终清醒，滴酒不沾。在这种情形下，他不敢喝。此刻能依靠的只有路易斯和我，而路易斯还掌着舵。“幽灵号”没点灯，也没有瞭望，就这样穿行在浓雾里。我很意外，拉森竟把酒全放给了水手。可他显然懂得这些人的心思，也知道最有效的办法，是用酒后的亲热和和气气，把一场始于流血的冲突牢牢粘合起来。
        - id: ch01-b07
          speaker: narrator
          text: >-
            战胜死神·拉森以后，他整个人都变了。前一晚，他还凭着一番推论，把自己一步步推入阴郁。我时时等着他像往常那样突然发作，结果什么也没发生。此刻他的状态反而好得出奇。或许，夺来这么多猎手和小艇，正好抵消了胜利后的低潮。至少当时我以为，他的阴郁已经消散，随之而来的疯狂也不会出现。唉，我根本不了解他。也许就在这时，他已经在酝酿一场比从前任何一次都可怕的爆发。
        - id: ch01-b08
          speaker: narrator
          text: >-
            我走进主舱时，他的精神好得惊人。他已经几个星期没犯头痛，双眼像天空一样澄澈湛蓝，古铜色的脸泛着健康的光，旺盛的生命仿佛涨满了血管。等我的时候，他正和莫德热烈争论诱惑。他说，只有一个人受到引诱并且屈服，诱惑才算诱惑。
        - id: ch01-b09
          speaker: wolf_larsen
          text: >-
            你看，人做任何事，都是因为他想做。欲望有很多种。他可能想躲开痛苦，也可能想得到快乐。可不管最后做了什么，原因都是他有那个欲望。
        - id: ch01-b10
          speaker: maud_brewster
          text: >-
            那么，要是他同时想做两件完全相反的事，而选了这一件，就不能再选另一件呢？
        - id: ch01-b11
          speaker: wolf_larsen
          text: 我正要说这个。
        - id: ch01-b12
          speaker: maud_brewster
          text: >-
            人的灵魂正是在这两种欲望之间显露出来的。灵魂善良，就会向往善的事，也会选择去做。灵魂邪恶，选择就正好相反。真正作决定的是灵魂。
        - id: ch01-b13
          speaker: wolf_larsen
          text: >-
            胡说！决定一切的是欲望。比方说，一个人既想喝醉，又不想喝醉。他怎么选？凭什么选？他只是个木偶，是欲望造出来的东西。两种欲望里，哪个更强，他就听哪个的，仅此而已。灵魂根本插不上手。一个人怎么会受到醉酒的诱惑，却又拒绝喝醉？他保持清醒，只因为清醒的欲望更强。这里根本没有诱惑，除非……除非诱惑他的，正是保持清醒。
        - id: ch01-b14
          speaker: narrator
          text: >-
            他抓住这个刚冒出来的念头，大笑两声，转过来问我怎么看。
        - id: ch01-b15
          speaker: humphrey
          text: >-
            我看你们都在钻牛角尖。人的灵魂就是欲望，或者说，所有欲望加起来就是灵魂。所以你们都错了。你把欲望和灵魂分开，只看欲望。布鲁斯特小姐也把两者分开，只看灵魂。可它们原本就是一回事。
        - id: ch01-b16
          speaker: humphrey
          text: >-
            不过，不论一个人最后屈服还是战胜了它，诱惑依然是诱惑，这一点布鲁斯特小姐说得对。欲望像一团火。看见渴求的东西，或者听见一种新鲜诱人的说法，对它有了新的认识，就像一阵风把火煽旺。那阵风就是诱惑。它未必能把火煽到压倒一切，可只要煽动了一分，就有一分诱惑。而且，诱惑既能把人引向恶，也能引向善。
        - id: ch01-b17
          speaker: narrator
          text: >-
            大家坐到桌边时，我颇为得意。我的话至少结束了这场争论。可拉森从未这样健谈。他像被积蓄的力量撑得快要爆开，非找个出口不可，马上又谈起爱情。他仍旧站在彻底的唯物一边，莫德则坚持理想。我只偶尔插上一两句话。
        - id: ch01-b18
          speaker: narrator
          text: >-
            拉森才思敏捷，莫德也毫不逊色。有一阵子，我只顾看莫德说话时的脸，竟听丢了他们在争什么。她的脸平日很少有血色，今晚却红润而鲜活。她的机锋锐利，显然和拉森一样享受这场交锋，而他更是兴致勃勃。我的心神全落在她一绺散开的棕发上，连他们怎样谈到那里都不知道。回过神时，只听见拉森引用《廷塔杰尔的伊瑟尔特》中女主人公的诗句。
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            仅凭这一点，我便比世间女子更有福。我的罪，超越一切生而为女之人的罪。我的过犯，完满无缺。
        - id: ch01-b20
          speaker: narrator
          text: >-
            他曾从奥马尔的诗里读出悲观，此刻又从斯温伯恩的诗句里读出尖锐的胜利和狂喜。他读得对，也读得极好。声音刚落，路易斯便从升降口探下头，压低嗓子提醒我们。
        - id: ch01-b21
          speaker: louis
          text: >-
            安静点儿，成不成？雾升起来了。这当口正有条汽船从咱们船头横穿过去，我看见它的左舷灯了。
        - id: ch01-b22
          speaker: narrator
          text: >-
            拉森立刻跃上甲板，动作快得惊人。我们跟出去时，他已经拉上统舱舱盖，把醉汉的喧嚷封在下面，又赶到前面关闭前舱舱口。雾并未散去，只是升到高处，遮住了所有星光，夜色一片漆黑。正前方有一盏鲜红的灯和一盏白灯，汽船引擎有节律地震响着。那毫无疑问是“马其顿号”。
        - id: ch01-b23
          speaker: narrator
          text: >-
            拉森很快回到艉楼。我们几个人默默站在一起，谁也没有出声，只看着那盏红灯和那盏白灯在漆黑一片的夜里飞快横过我们的船头。
        - id: ch01-b24
          speaker: wolf_larsen
          text: 幸亏他没装探照灯。
        - id: ch01-b25
          speaker: humphrey
          text: 要是我现在放声呼喊呢？
        - id: ch01-b26
          speaker: wolf_larsen
          text: 那就全完了。不过，你想过下一刻会发生什么吗？
        - id: ch01-b27
          speaker: narrator
          text: >-
            我还没来得及回答，他那大猩猩般的手已经扼住我的喉咙。肌肉只轻轻一动，像是在提醒我，只要他再扭一下，我的脖子必断无疑。下一刻，他放开我，我们继续看着“马其顿号”的灯光。
        - id: ch01-b28
          speaker: maud_brewster
          text: 要是我来喊呢？
        - id: ch01-b29
          speaker: wolf_larsen
          text: >-
            我太喜欢你，不舍得伤你。不过还是别喊。你一出声，我马上扭断范韦登先生的脖子。
        - id: ch01-b30
          speaker: narrator
          text: >-
            他的声音温柔得像在爱抚，听得我心头刺痛。我挑衅地说，她尽管喊，我准许。
        - id: ch01-b31
          speaker: wolf_larsen
          text: 我看，你还舍不得牺牲美国文坛的第二位泰斗吧。
        - id: ch01-b32
          speaker: narrator
          text: >-
            他满脸讥讽。我们都不再说话。不过，我们彼此已经相处得太久，这阵沉默并没有让谁觉得尴尬。我们只是站在那里，看那两盏灯越来越远。等红灯和白灯完全消失，我们才回到主舱，继续吃那顿被打断的晚餐。
        - id: ch01-b33
          speaker: narrator
          text: >-
            他们又谈起诗。莫德吟诵道森的《最后的悔悟》。她念得很美，可我没有看她，只盯着拉森。他望着莫德的入迷神情，竟也让我移不开眼。他完全忘了自己，嘴唇不由自主地翕动。莫德每念一个字，他便无声地跟出一个字。她吟到两行诗时，他忽然打断。
        - id: ch01-b34
          speaker: maud_brewster
          text: >-
            愿夕阳在我身后熄灭时，她的眼睛仍是我的光。愿她声音里的提琴，成为我耳中最后的回响。
        - id: ch01-b35
          speaker: wolf_larsen
          text: 你的声音里有提琴。
        - id: ch01-b36
          speaker: narrator
          text: >-
            他说得直截了当，眼中闪起金光。莫德仍然牢牢控制着自己，我高兴得几乎想喊出来。她没有一丝迟疑，稳稳念完最后一节，又慢慢把谈话引到不那么危险的方向。我一直半恍惚地坐着。统舱里醉醺醺的狂闹穿透舱壁，我惧怕的男人和我深爱的女人却仍在谈个不停。餐桌始终无人收拾。接替马格里奇干活的人显然也抛下差事，跑去前舱和同伴喝酒了。
        - id: ch01-b37
          speaker: narrator
          text: >-
            如果拉森一生真有登上生命巅峰的时刻，就是现在。我不时放下自己的心事去听他说话，每次都满心惊异。一时间，我又被他非凡的才智压倒，也被他炽烈的激情攫住。他宣扬的是反抗的激情，自然谈到了弥尔顿笔下的路西法。拉森剖析、描绘这个人物时敏锐得惊人，让我看见了他被压抑的天才。他使我想起泰纳，可我知道，拉森从没听过这位才华横溢而又危险的思想家。
        - id: ch01-b38
          speaker: wolf_larsen
          text: >-
            路西法为一场注定失败的事业而战，却不怕上帝的雷霆。他被打进地狱，仍然没有屈服。他带走了上帝三分之一的天使，又唆使人类反叛上帝，把世世代代大多数的人都争给了自己和地狱。他为什么被逐出天堂？因为不如上帝勇敢？不如上帝骄傲？不如上帝胸怀大志？不！一千个不！上帝只是力量更强。正如他说的，是雷霆让上帝称雄。
        - id: ch01-b39
          speaker: wolf_larsen
          text: >-
            可路西法是自由的灵魂。服从会让他窒息。他宁愿自由地受苦，也不要在舒服的奴役中享福。他不肯侍奉上帝，也不肯侍奉任何东西。他不是一个空架子。他用自己的双腿站立，是一个独立的人。
        - id: ch01-b40
          speaker: maud_brewster
          text: 第一个无政府主义者。
        - id: ch01-b41
          speaker: narrator
          text: >-
            莫德笑着起身，准备回房。拉森也站起来，面对停在房门口的她，高声说道。
        - id: ch01-b42
          speaker: wolf_larsen
          text: >-
            那么，做无政府主义者就是好事！至少在这里，我们可以自由。全能者并非因妒忌造出此地，也不会把我们赶走。在这里，我们可以安稳称王。我宁愿选择统治，哪怕在地狱也值得向往。宁在地狱为王，不在天堂称臣。
        - id: ch01-b43
          speaker: narrator
          text: >-
            那是一个强大灵魂发出的不屈呐喊。他的声音仍在主舱里回荡。他站在那里，身体微微摇晃，古铜色的脸闪着光，头颅高昂，气势凌人。那双金色的眼睛充满男性的力量，强烈到咄咄逼人，却又执拗地温柔。它们灼灼闪动，全部落在房门边的莫德身上。
        - id: ch01-b44
          speaker: maud_brewster
          text: 你就是路西法。
          emotion: fearful
        - id: ch01-b45
          speaker: narrator
          text: >-
            她眼里又浮现那种说不出名字、却绝不会认错的恐惧，声音轻得近乎耳语。门关上，她离开了。拉森盯着门看了一分钟，才回过神来，看向我。
        - id: ch01-b46
          speaker: wolf_larsen
          text: >-
            我去替路易斯掌舵，午夜再叫你接班。你现在最好躺下，先睡一会儿。
        - id: ch01-b47
          speaker: narrator
          text: >-
            他戴上连指手套和帽子，沿升降梯上去了。我照他说的上床休息。不知什么缘故，一种神秘的直觉催促我不要脱衣，于是我就这样穿戴整齐地躺下。我听了一阵统舱的喧闹，也惊叹着突然来到我生命里的爱情。可我在“幽灵号”上已经养成了十分健康自然的睡眠。没过多久，那些歌声和喊声渐渐远去，我闭上双眼，意识沉入半死一般的睡眠。
        - id: ch01-b48
          speaker: narrator
          text: >-
            我不知道是什么惊醒了我。回过神时，我已经跳下铺位，双脚站在地上，头脑完全清醒。危险的警告震颤着灵魂，像一声骤然响起的号角。我猛地拉开门。主舱的灯还亮着，光线却很昏暗。莫德，我的莫德，正被拉森紧紧箍在双臂中。她把脸抵住他的胸膛，拼命挣扎，整个人徒劳地扑打、颤动着，想从他怀里逃开。我只看了一眼，便扑了上去。
        - id: ch01-b49
          speaker: narrator
          text: >-
            他刚抬头，我的拳头便打中他的脸，可那一拳软弱无力。他发出凶猛的、野兽般的咆哮，抬手推了我一下。那不过是一推，手腕轻轻一甩，力量却大得把我像从投石器里射出的石块一样抛了出去。我撞上马格里奇从前住的房门，身体把门板撞裂、砸碎。我费力从破门的残片里挣脱，重新站起来，根本感觉不到自己有没有受伤，只知道怒火已经压倒一切。我想自己也在吼叫。我拔出腰间的刀，再次冲向他。
        - id: ch01-b50
          speaker: narrator
          text: >-
            可事情突然变了。拉森和莫德摇晃着分开。我已经逼到他面前，刀举在空中，却被眼前的怪事惊得没有刺下去。莫德靠着舱壁，一只手伸出去支撑身体。拉森却踉跄起来，左手按住前额、遮住双眼，右手茫然地向四周摸索。那只手终于碰到舱壁，他的身体顿时显出一种肌肉和肉体上的宽慰。他像是终于辨清方向，知道自己在什么位置，也终于找到可以倚靠的东西。
        - id: ch01-b51
          speaker: narrator
          text: >-
            随后，我眼前又变成一片血红。我受过的所有委屈和屈辱，都在刺眼的强光中闪过。我和别人从他手中受过的苦，还有这个人活在世上本身包含的全部罪恶，也一齐涌上来。我盲目而疯狂地扑向他，把刀刺进他的肩膀。刀刃在肩胛骨上刮过，我立刻知道，这一下只是皮肉伤，于是又举起刀，要刺向真正致命的地方。
        - id: ch01-b52
          speaker: maud_brewster
          text: 不要！求你不要！
          emotion: fearful
        - id: ch01-b53
          speaker: narrator
          text: >-
            我的手臂只垂下了一瞬，便又举起刀。要不是莫德跨到中间，拉森一定会死。她用双臂环住我，头发擦过我的脸。我的脉搏从未这样狂跳，怒火也烧得更高。她勇敢地直视着我。
        - id: ch01-b54
          speaker: maud_brewster
          text: 看在我的分上。
        - id: ch01-b55
          speaker: humphrey
          text: 正是为了你，我才要杀了他！
          emotion: angry
        - id: ch01-b56
          speaker: narrator
          text: >-
            我想抽回手臂，又怕伤到她。她轻轻“嘘”了一声，把手指按在我唇上。哪怕我仍在盛怒中，那触碰也甜蜜得让我想吻她的手指，只是我不敢。
        - id: ch01-b57
          speaker: maud_brewster
          text: 求你了，求你。
        - id: ch01-b58
          speaker: narrator
          text: >-
            这几个字解除了我的武装。后来我才知道，它们永远都能让我缴械。我退开一步，把刀收回鞘里，再看拉森。他依旧用左手遮着眼睛，头低垂着，腰胯往下坠，宽阔的肩膀也软弱地向前耷拉。
        - id: ch01-b59
          speaker: wolf_larsen
          text: 范韦登！啊，范韦登！你在哪里？
          emotion: fearful
        - id: ch01-b60
          speaker: narrator
          text: >-
            他的嗓音嘶哑，里面竟有恐惧。我望向莫德。她没有说话，只点点头。我走到他身边。
        - id: ch01-b61
          speaker: humphrey
          text: 我在这里。出了什么事？
        - id: ch01-b62
          speaker: wolf_larsen
          text: 扶我坐下。
          emotion: fearful
        - id: ch01-b63
          speaker: narrator
          text: >-
            他仍用那种嘶哑惊恐的声音说话。我扶着他来到椅子边。
        - id: ch01-b64
          speaker: wolf_larsen
          text: 我病了，病得很厉害，汉普。
          emotion: fearful
        - id: ch01-b65
          speaker: narrator
          text: >-
            他脱开我的搀扶，跌坐在椅子上。头向前垂到桌面，埋进双手之间，又像疼得厉害一样，不时前后摇动。有一次，他稍稍抬起头，我看见靠近发根的前额上全是大颗汗珠。他又说了一遍自己病得很厉害，过了一会儿，还在重复同一句话。
        - id: ch01-b66
          speaker: humphrey
          text: 到底怎么了？我能替你做什么？
        - id: ch01-b67
          speaker: narrator
          text: >-
            我把手搭上他的肩膀，他却烦躁地甩开。很长一段时间，我只是默默站在旁边。莫德惊骇地看着。我们谁也猜不出他究竟发生了什么。
        - id: ch01-b68
          speaker: wolf_larsen
          text: >-
            汉普，我得回铺位。搭把手。一会儿就会好。我想，是那些该死的头痛。我一直怕它们回来。我有一种感觉……不，我不知道自己在说什么。扶我回去。
          emotion: fearful
        - id: ch01-b69
          speaker: narrator
          text: >-
            我把他扶进铺位。他又把脸埋进双手，紧紧遮住眼睛。我转身离开时，还听见他低声喃喃，说自己病了，病得很厉害。莫德一直等在外面，用询问的目光看着我。我无法解释，只能摇头。
        - id: ch01-b70
          speaker: humphrey
          text: >-
            他身上突然出了什么事，可我不知道是什么。他现在毫无还手之力，而且我想，他这一生头一次害怕了。事情发生在我刺他以前，那一刀只伤了皮肉。你当时应该看见了吧？
        - id: ch01-b71
          speaker: maud_brewster
          text: >-
            我什么也没看见。对我来说也一样莫名其妙。他突然放开我，踉跄着退开了。可我们现在怎么办？我该怎么办？
        - id: ch01-b72
          speaker: humphrey
          text: 请你留在这里，等我回来。
        - id: ch01-b73
          speaker: narrator
          text: >-
            我上了甲板，路易斯正在掌舵。我接过舵轮，让他回前舱睡觉。他马上照办，甲板上只剩下我一个人。我尽可能不发出声音，收拢中桅帆，降下飞行三角帆和支索帆，把艏帆转到反面，再把主帆拉平，让“幽灵号”停下来漂着。随后我回到莫德身边，用手指按住嘴唇，示意她不要出声，又走进拉森的房间。他还是我离开时的姿势，头痛苦地左右摇晃，几乎像在扭动。
        - id: ch01-b74
          speaker: humphrey
          text: 有什么我能做的吗？
        - id: ch01-b75
          speaker: narrator
          text: >-
            起初他没有回答。我又问一遍，他才开口。
        - id: ch01-b76
          speaker: wolf_larsen
          text: 没有，没有。我没事。别管我，等到早晨。
        - id: ch01-b77
          speaker: narrator
          text: >-
            我转身要走时，留意到他的头又开始左右摇动。莫德一直耐心等着我。她高贵从容地昂着头，那双明亮而沉静的眼睛令我心中涌起一阵喜悦。它们安稳、坚定，正像她自己的灵魂。
        - id: ch01-b78
          speaker: humphrey
          text: 你愿意把自己交给我，走一趟大约六百英里的航程吗？
        - id: ch01-b79
          speaker: maud_brewster
          text: 你的意思是……
        - id: ch01-b80
          speaker: narrator
          text: >-
            我知道她已经猜到了。
        - id: ch01-b81
          speaker: humphrey
          text: 对，就是那个意思。我们只剩下敞艇这一条路。
        - id: ch01-b82
          speaker: maud_brewster
          text: 你是说我吧。你留在船上，肯定还和从前一样安全。
        - id: ch01-b83
          speaker: humphrey
          text: >-
            不，我们只剩下敞艇这一条路。请你马上尽量穿暖些，再把想带的东西包成一捆。一定要快。
        - id: ch01-b84
          speaker: narrator
          text: >-
            她转身回房。我打开主舱地板上的舱盖，带着蜡烛跳进下面的储藏舱，翻检船上的存粮。我挑的主要是罐头。等我备齐以后，莫德从上面伸下一双殷勤的手，接走我递出的东西。我们谁也没有说话。我又从衣物柜里取出毯子、连指手套、油布衣、帽子和其他用得上的衣物。我们要把性命交给一条小艇，让它载着我们穿过如此寒冷而多风暴的海洋。这绝不是轻松的冒险，我们必须尽可能严防海水和低温。
        - id: ch01-b85
          speaker: narrator
          text: >-
            我们发疯般把搜集来的物资搬上甲板，堆在船中。莫德本来就没有多少体力，很快便彻底耗尽，只能坐在艉楼断阶处。坐着也无法恢复，她索性仰面躺在坚硬的甲板上，伸开双臂，让全身完全放松。我姐姐以前也这样做，我认得这个办法，知道她很快会缓过来。我还想到，武器绝不会多余，于是又走进拉森的房间，拿走他的步枪和霰弹枪。我叫了他一声，他没有回应。他并没睡着，头仍在左右摇动。
        - id: ch01-b86
          speaker: humphrey
          text: 再见了，路西法。
        - id: ch01-b87
          speaker: narrator
          text: >-
            我在心里轻声说完，悄悄关上房门。接下来要准备的是弹药。弹药不难取得，只是我必须走进统舱的升降口。猎手把平日带上小艇的弹药箱全放在那里。我离他们吵闹的酒宴只有几英尺，却没有惊动任何人，顺利拿走了两箱。
        - id: ch01-b88
          speaker: narrator
          text: >-
            接着要放下一条小艇。这对一个人可不容易。我解开绑索，先拉前吊艇索具，再拉后吊艇索具，直到小艇越过船舷。随后前后交替放下几英尺，让它贴着“幽灵号”外舷，稳稳悬在水面上。我仔细检查了船桨、桨架和船帆，确认一件也没少。淡水同样要紧，我便把船上每条小艇的水桶都拿来。一共九条艇，这样我们既有足够的水，也有了压舱物。只是我带走的其他东西已经十分丰厚，这批水桶再放进去，小艇也可能因此载得过重。
        - id: ch01-b89
          speaker: narrator
          text: >-
            莫德把食物递给我，我蹲在艇里一件件收好。我们从下风舷放艇时，一个水手忽然从前舱上来。他先在另一侧的上风舷站了一会儿，又慢慢走到船中。随后，他迎风停住，背对我们。我尽量伏低身体，清楚听见自己的心跳。莫德也俯下身，贴着甲板，一动不动地藏在舷墙阴影里。那人始终没有转身。他只举起双臂伸了个懒腰，响亮地打过哈欠，便原路走回前舱舱口，消失了。
        - id: ch01-b90
          speaker: narrator
          text: >-
            几分钟后，物资全装好了。我把小艇降到水面，扶莫德翻过船舷。她的身体贴近我，我几乎忍不住要大声喊出，我爱她，我爱她。她的手指紧紧抓着我的手。把她往小艇里放时，我心想，汉弗莱·范韦登终于真正爱上了一个人。我一手抓住船舷，另一只手独自托起她的重量，那一刻也为自己的力量感到骄傲。几个月前，我向查利·福鲁塞斯告别，乘上那艘命运多舛的“马丁内斯号”前往旧金山时，还根本没有这样的力量。
        - id: ch01-b91
          speaker: narrator
          text: >-
            海浪托起小艇。莫德的脚刚碰到艇底，我便松开她的手。我解下前后吊艇索具，随后跟着跳了下去。我这一生从没划过船，仍把桨伸出去，花了很大力气才让小艇离开“幽灵号”。接着，我又摸索着张帆。我曾看掌舵手和猎手支过无数次斜桁帆，自己却从未动手。他们大概两分钟就能做完，我足足用了二十分钟。最后，帆总算支好，也调整妥当。我双手握住舵桨，让小艇迎着风驶去。
        - id: ch01-b92
          speaker: humphrey
          text: 日本就在那边，正前方。
        - id: ch01-b93
          speaker: maud_brewster
          text: 汉弗莱·范韦登，你是个勇敢的人。
        - id: ch01-b94
          speaker: humphrey
          text: 不，你才是勇敢的女人。
        - id: ch01-b95
          speaker: narrator
          text: >-
            一种共同的冲动让我们同时回头，想再看“幽灵号”最后一眼。海浪托起它低矮的船身，船体向上风一侧摇摆。黑夜中，它的船帆显得巨大而模糊。绑住的舵轮吱呀作响，船舵随着海浪一下下踢动。随后，“幽灵号”的影子和声音一起淡去，终于完全消失，只剩我们两个人独自在漆黑的海上。
