audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十七章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            天亮时，四周灰蒙蒙的，寒气逼人。劲风吹着小艇抢风前进。罗盘告诉我，我们正好走在通往日本的航线上。我戴着厚厚的连指手套，手指还是冻得发僵，紧握舵桨也握得阵阵作痛。两只脚被霜冻咬得直刺痛，我真心盼着太阳赶快露面。
        - id: ch01-b02
          speaker: narrator
          text: >-
            莫德躺在我面前的艇底。至少她身上是暖和的，因为身下身上全铺盖着厚毯。我把最上面那条拉过她的脸，替她挡住夜里的寒气。此刻，我只能看见她模糊的身形，还有几缕从毯子下面逃出来的浅棕色头发。湿润的空气在发丝上凝成了晶莹的小水珠。
        - id: ch01-b03
          speaker: narrator
          text: >-
            我久久望着那几缕头发。只有一个男人把它们当成世上最珍贵的东西，才会这样凝望。也许是我的目光太执着，仿佛有了重量，她终于在毯子下动了动。最上面那层毯子被掀开，露出一张含笑的脸，那双眼睛还压着浓浓的睡意。
        - id: ch01-b04
          speaker: maud_brewster
          text: 早上好，范韦登先生。看见陆地了吗？
        - id: ch01-b05
          speaker: humphrey
          text: 还没看见。不过，我们每小时能向陆地靠近六英里。
        - id: ch01-b06
          speaker: narrator
          text: 她失望地撇了一下嘴。我连忙安慰她。
        - id: ch01-b07
          speaker: humphrey
          text: 这样算下来，一整天能走一百四十四英里呢。
        - id: ch01-b08
          speaker: maud_brewster
          text: 那我们还差多远？
        - id: ch01-b09
          speaker: humphrey
          text: 西伯利亚在西边。日本在西南方，大约六百英里。只要风向不变，五天就能到。
        - id: ch01-b10
          speaker: maud_brewster
          text: 要是来一场风暴呢？这条小艇受不住吧？
        - id: ch01-b11
          speaker: narrator
          text: 她直直看进我的眼睛。她每次这样看我，都是非要听见实话不可。
        - id: ch01-b12
          speaker: humphrey
          text: 除非风暴非常厉害，否则还不至于。
        - id: ch01-b13
          speaker: maud_brewster
          text: 要是偏偏非常厉害呢？
        - id: ch01-b14
          speaker: narrator
          text: 我只好点头承认，却又赶紧告诉她，捕海豹的帆船散布在这一带海面上，我们随时都可能被其中一艘发现并救起。
        - id: ch01-b15
          speaker: maud_brewster
          text: 你都冻透了！瞧，你明明在发抖，不许否认。我倒一直躺在这里，暖和得很。
        - id: ch01-b16
          speaker: humphrey
          text: 你要是也坐起来挨冻，对我们可没有一点帮助。
        - id: ch01-b17
          speaker: maud_brewster
          text: 等我学会掌舵，就有帮助了。我一定得学会。
        - id: ch01-b18
          speaker: narrator
          text: >-
            她坐起身，开始简单梳洗，又把头发抖散。棕色的发丝像一团云，遮住她的脸和双肩。那微湿的棕发多么可爱。我想亲吻它，想让它从手指间流过，甚至想把脸埋进去。我只顾出神地看着，连小艇已经偏向迎风处也没察觉。直到船帆啪啪抖响，我才想起自己还在掌舵。
        - id: ch01-b19
          speaker: narrator
          text: >-
            我天性爱分析，可也一直是个理想主义者和浪漫主义者。直到这时，我才懂得爱情也有肉体的一面。从前我只把男女之爱看作两个灵魂之间的纽带，肉体在我的爱情天地里几乎没有位置。现在我才明白，灵魂正是借身体显露自己的。爱人的头发可以看见，可以触摸，它和眼里的光、唇边流出的思想一样，都是灵魂的气息和声音。纯粹的灵魂本就看不见，也无法直接表达自己，只能从有形的东西上去感受、去猜想。人们把耶和华想成人的形象，想成云和火柱，也是因为只有这样，以色列人的心智才能理解他。
        - id: ch01-b20
          speaker: narrator
          text: >-
            我望着莫德浅棕色的头发，爱着它。那一刻，我对爱情的领悟，比所有诗人和歌者用歌谣与十四行诗教给我的都多。她忽然灵巧地一甩头，那团发云全落到背后，含笑的脸便从中露了出来。
        - id: ch01-b21
          speaker: humphrey
          text: 女人为什么不一直披着头发呢？这样不是美得多吗？
        - id: ch01-b22
          speaker: maud_brewster
          text: 要不是它太爱打结，我也愿意。呀，我那根宝贝发夹不见了！
        - id: ch01-b23
          speaker: narrator
          text: >-
            她翻着毯子找发夹，我只顾追着她的每一个动作看，一次又一次让船帆漏掉了风。我惊喜地发现，她有这么多寻常女子的情态。过去，我在心里把她抬得太高，推得太远，仿佛她是一位高不可攀的女神。可她会甩头抛开那团发云，也会因为一根发夹不见了便四处寻找。这些小动作把她从云端带回我的身边。她是女人，和我同类，也和我站在同一片凡人的天地里。我们之间不只有我永远会怀着的敬仰和畏慕，也可能有男人与女人之间那种美妙的亲近。
        - id: ch01-b24
          speaker: narrator
          text: >-
            她终于找到发夹，发出一声可爱的小小欢呼。我也收回心神，把更多注意力放回掌舵。我试着用绳子绑住舵桨，再把它稳稳楔牢。这样一来，不用人扶着，小艇也能大致迎风保持航向。它有时贴风太近，有时又偏得太开，不过每次总能自行转回来，总的说来已经很叫人满意。
        - id: ch01-b25
          speaker: humphrey
          text: 现在可以吃早饭了。不过，你得先穿得更暖和些。
        - id: ch01-b26
          speaker: narrator
          text: >-
            我从船上的衣物箱里拿出一件崭新的厚衬衫。那是毛毯料做的，织得又密又厚，就算淋几个钟头也不容易湿透。莫德从头上套好衬衫，我又把她的男孩帽换成一顶男人的大帽子。帽子足以罩住全部头发，后面的护布放下来，也挡严了脖子和耳朵。她穿成这样，仍旧迷人。她的脸不论怎样打扮都不会难看。精美的椭圆轮廓，近乎古典的线条，纤细得像描画出来的眉毛，还有那双看得透彻、又安详得出奇的棕色大眼睛，什么也遮不住。
        - id: ch01-b27
          speaker: narrator
          text: >-
            一股比平常更强的风忽然扑来。小艇正斜斜越过浪头，猛地被风压向一边，舷缘几乎没进海里，还灌进了足有一桶水。我正在开一罐牛舌，立刻扑向帆脚索，总算及时把它松开。船帆一阵拍打翻飞，小艇也偏离了风向。我忙了几分钟，才让它重新回到航线上，然后继续准备早餐。
        - id: ch01-b28
          speaker: maud_brewster
          text: 我虽不懂航海，可你这套掌舵的办法，看起来相当管用。
        - id: ch01-b29
          speaker: humphrey
          text: 只有逆风航行时才行。风从后面或侧后方吹来，我还是得亲自掌舵。
        - id: ch01-b30
          speaker: maud_brewster
          text: >-
            那些术语我听不懂，结论却听懂了，而且很不喜欢。你不能日夜不停地掌舵。吃过早饭，你就给我上第一堂课。然后你去睡，我们像大船上一样轮班值更。
        - id: ch01-b31
          speaker: humphrey
          text: >-
            可我自己也才开始学，怎么教你？你把自己托付给我时，大概没想到我从没驾驶过小艇吧。这还是我头一回坐进小艇呢。
        - id: ch01-b32
          speaker: maud_brewster
          text: >-
            那就一起学。先生，你比我早学了一夜，先把会的教给我。现在吃早饭吧。这海风一吹，人的胃口可真好！
        - id: ch01-b33
          speaker: humphrey
          text: >-
            可惜没有咖啡。我们登上陆地以前，茶也没有，汤也没有，什么热东西都喝不到。
        - id: ch01-b34
          speaker: narrator
          text: >-
            我们吃了一顿简单的早饭。我把抹了黄油的船用饼干和一片罐头牛舌递给她，最后又各喝了一杯冷水。饭后，莫德开始学掌舵。我一边教她，自己也学到了不少。我把驾驶“幽灵号”时懂得的道理用上，也回想那些掌舵手怎样驾驶小艇。她是个聪明的学生，很快就能把航向稳住。遇到突然增强的风，她知道该让船头稍稍迎风。真有危险时，她也懂得立刻松开帆脚索。
        - id: ch01-b35
          speaker: narrator
          text: >-
            她像是已经累了，也像是对这项工作失去了兴趣，便把舵桨还给我。我先前已经把毯子叠好，她又把它们一条条铺回艇底。等那张床收拾得舒舒服服，她才开口对我下令。
        - id: ch01-b36
          speaker: maud_brewster
          text: 先生，现在上床睡觉。一直睡到午饭。不对，是睡到正餐时候。
        - id: ch01-b37
          speaker: narrator
          text: >-
            我还能怎么办呢？她坚持不肯让步，又一再说“求你了，求你了”，我哪里还能拒绝，只好把舵桨交出去，爬进她亲手铺好的毯子。躺进去时，我真切地感到一种舒服的愉悦。她身上那份安详和自制，仿佛也传进了床铺。我被柔软的梦意和满足包围，眼前只有她椭圆的脸和棕色眼睛。那顶渔夫帽背后，一会儿是灰云，一会儿是灰海，随着小艇不停摇荡。等我回过神，才知道自己已经睡着了。
        - id: ch01-b38
          speaker: narrator
          text: >-
            我看了看表，指针已经走到一点。我竟睡了七个小时，她也竟连续掌舵七个小时！我去接舵桨时，先得把她僵硬蜷曲的手指一根根掰开。她仅有的一点力气已经全耗尽了，甚至不能离开原来的姿势。我只好暂时松开帆脚索，把她扶进毯子铺成的小窝，再替她用力搓揉双手和胳膊。
        - id: ch01-b39
          speaker: maud_brewster
          text: 我实在太累了。
        - id: ch01-b40
          speaker: narrator
          text: 她猛地吸进一口气，又长长叹息一声，疲惫地垂下头。可就在下一刻，她又把头挺直了，还故意摆出挑衅的样子。
        - id: ch01-b41
          speaker: maud_brewster
          text: 不许训我。你可绝对不许训我。
        - id: ch01-b42
          speaker: humphrey
          text: 但愿我的脸没有显得生气。我真的一点也不生气。
        - id: ch01-b43
          speaker: maud_brewster
          text: 没有生气，只是有点责怪我。
        - id: ch01-b44
          speaker: humphrey
          text: >-
            那这张脸倒很诚实。你这样累坏自己，对你不公平，对我也不公平。往后叫我怎么放心相信你？
        - id: ch01-b45
          speaker: maud_brewster
          text: 我会听话的，我保证——
        - id: ch01-b46
          speaker: humphrey
          text: 像水手听从船长那样？
        - id: ch01-b47
          speaker: maud_brewster
          text: 是的。我知道，这次是我做傻了。
        - id: ch01-b48
          speaker: humphrey
          text: 你还要答应一件事。以后少说几次“求你了，求你了”。你一这么说，我这个船长就半点权威也没有了。
        - id: ch01-b49
          speaker: narrator
          text: 她心领神会地笑了。原来她也早就察觉，这两个连在一起的“求你了”有多大力量。我刚开口说那是一句好话，她便抢先把后半句话接了过去。
        - id: ch01-b50
          speaker: maud_brewster
          text: 可我不能总拿它来对付你。
        - id: ch01-b51
          speaker: narrator
          text: >-
            她笑得很虚弱，脑袋又垂了下去。我暂时放开舵桨，给她盖好双脚，又拉过一层毯子挡住脸。她终究不够强健。我望向西南方，想到前面还有六百英里苦路，心里充满不安。要是等待我们的只有吃苦，那已经算幸运。海上随时可能起风暴，把我们彻底毁掉。奇怪的是，我对未来毫无把握，疑虑也很深，心底却没有真正的恐惧。我只是反复告诉自己，一切一定会好起来，一定会好起来。
        - id: ch01-b52
          speaker: narrator
          text: >-
            午后风势更强，海面也掀起更硬的浪，小艇和我都经受着严酷的考验。好在艇上的食物和九桶淡水成了压舱物，船身才能顶住风浪。我一直撑到胆量所能容许的最后一刻，才拆下斜桁，把船帆顶端紧紧拉低。小艇只挂着水手所说的“羊腿帆”，仍在浪间飞快奔驰。
        - id: ch01-b53
          speaker: narrator
          text: >-
            傍晚时分，我看见下风处的天边升起一道汽船烟。那要么是俄国巡洋舰，要么是仍在海上寻找“幽灵号”的“马其顿号”，而后者的可能更大。太阳一整天都没有露面，天气冷得刺进骨头。夜色渐渐落下，云层越来越暗，风也越刮越紧。我们戴着连指手套吃晚饭，我仍得握住舵桨，只能在两阵强风之间匆匆吃上几口。
        - id: ch01-b54
          speaker: narrator
          text: >-
            天黑以后，风浪强得让小艇再也撑不下去。我很不情愿，却只能收起船帆，再照猎手们谈过的办法做一只海锚。这东西并不难。我把船帆卷紧，牢牢绑在桅杆、帆桁、斜桁和两副备用船桨上，然后抛进海中，再用一根绳索连住船头。海锚浮沉在水面以下，几乎吹不到风，所以漂得比小艇慢。这样，它就能牵住小艇，让船头始终迎向风浪。海面翻起白浪时，这是最不容易让艇里灌满水的姿势。等一切办妥，我重新戴上连指手套。
        - id: ch01-b55
          speaker: maud_brewster
          text: 好了，现在怎么样？
        - id: ch01-b56
          speaker: humphrey
          text: 现在我们不往日本走了。我们正在朝东南，或者南偏东漂，每小时至少两英里。
        - id: ch01-b57
          speaker: maud_brewster
          text: 就算大风整夜不停，我们也才漂出去二十四英里呀。
        - id: ch01-b58
          speaker: humphrey
          text: 是啊。要是连续刮上三天三夜，也才一百四十英里。
        - id: ch01-b59
          speaker: maud_brewster
          text: 可它不会一直这样刮下去。风会转过方向，变成送我们去日本的顺风。
        - id: ch01-b60
          speaker: humphrey
          text: 大海最靠不住。
        - id: ch01-b61
          speaker: maud_brewster
          text: 可风不一样！我听过你赞美勇敢的信风，那时你说得多动人呀。
        - id: ch01-b62
          speaker: humphrey
          text: >-
            我要是记得带上拉森的航海钟和六分仪就好了。我们朝一个方向行驶，又朝另一个方向漂，海流还可能把我们带向第三个方向。这三股力量合成的实际航向，单靠推算根本算不出来。用不了多久，我们连自己究竟在哪里都不知道，判断的位置甚至可能错上五百英里。
        - id: ch01-b63
          speaker: narrator
          text: >-
            我向她道了歉，保证不再垂头丧气。她几次请求，我才让她值更到午夜。那时是晚上九点。我先把她严严实实裹进毯子，外面再围上一件油布衣，自己才躺下。我睡得断断续续，每次只能打个短盹。小艇越过浪峰时高高跃起，落下时又重重撞向海面。海水从两旁奔涌过去，飞沫不断泼进船里。
        - id: ch01-b64
          speaker: narrator
          text: >-
            可我躺在那里想，这仍算不上一个坏夜晚。和“幽灵号”上经历过的那些可怕夜晚相比，它算不了什么。和我们将来或许要在这只小小蛋壳里熬过的夜晚相比，恐怕也算不了什么。这条小艇的木板只有四分之三英寸厚。我和莫德同深不可测的海底之间，隔着的木头还不到一英寸。
        - id: ch01-b65
          speaker: narrator
          text: >-
            可我真的不怕，我可以一遍又一遍这样断言。海狼·拉森，甚至托马斯·马格里奇从前让我害怕的死亡，如今吓不倒我了。莫德·布鲁斯特走进我的生命，仿佛把我变成了另一个人。如果爱让生命里有了值得甘愿赴死的东西，那么去爱一个人，或许真的比被爱更美好，也更崇高。我爱着另一个生命，因而忘了自己的性命。可这又是多么矛盾。正当我最不看重自己时，我却比任何时候都渴望活下去。因为我从来没有这么多非活不可的理由。
        - id: ch01-b66
          speaker: narrator
          text: >-
            这就是我朦胧睡去以前最后的念头。此后，我只是一次次想要看穿黑暗，望向漆黑的艇尾。那里什么也看不见，可我知道，莫德正蜷伏在艇尾座板间的低处，警醒地看着泛起泡沫的海面。只要危险出现，她随时准备在一瞬间叫醒我。
