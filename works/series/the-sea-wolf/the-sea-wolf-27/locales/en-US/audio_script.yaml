audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
  chapters:
    - id: ch01
      title: CHAPTER XXVII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Dawn came grey and cold. A fresh breeze drove our boat close to the wind, and the compass showed that we were just holding the course for Japan. Even inside thick mittens, my fingers ached from gripping the steering oar. Frost stung my feet. I longed for the sun to break through.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Maud lay in the bottom of the boat ahead of me. Thick blankets were spread beneath her and tucked over her, so she at least was warm. I had drawn the top blanket across her face during the night. All I could see was her shape beneath it and a lock of light brown hair, damp air shining on it like jewels.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I watched that one visible lock for a long time. To me, it was the most precious thing in the world. At last my steady gaze seemed to wake her. She stirred, pushed back the blanket, and smiled at me through eyes still heavy with sleep.
        - id: ch01-b04
          speaker: maud_brewster
          text: >-
            Good morning, Mr. Van Weyden. Can you see land yet?
        - id: ch01-b05
          speaker: narrator
          text: >-
            Not yet, but we're moving toward it at six miles an hour.
        - id: ch01-b06
          speaker: narrator
          text: >-
            She pursed her lips, disappointed. I tried to make the news sound better.
        - id: ch01-b07
          speaker: narrator
          text: >-
            That does add up to a hundred and forty-four miles in a full day.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Her face brightened at once.
        - id: ch01-b09
          speaker: maud_brewster
          text: >-
            Then how much farther do we have to go?
        - id: ch01-b10
          speaker: narrator
          text: >-
            Siberia is over there to the west. Japan is about six hundred miles southwest of us. If this wind lasts, we should reach it in five days.
        - id: ch01-b11
          speaker: maud_brewster
          text: >-
            What if a storm comes? Would this boat survive it?
        - id: ch01-b12
          speaker: narrator
          text: >-
            She looked straight into my eyes, as she always did when she wanted the truth. I tried to soften my answer.
        - id: ch01-b13
          speaker: narrator
          text: >-
            It would take a very hard storm.
        - id: ch01-b14
          speaker: maud_brewster
          text: >-
            And if the storm was very hard?
        - id: ch01-b15
          speaker: narrator
          text: >-
            I nodded. Then I reminded her that a sealing schooner might find us at any time. There were plenty of them scattered across this part of the ocean.
        - id: ch01-b16
          speaker: maud_brewster
          emotion: surprised
          text: >-
            Why, you're frozen! Look at you. You're shivering, and don't try to deny it. I've been lying here as warm as toast while you've sat out there in the cold.
        - id: ch01-b17
          speaker: narrator
          text: >-
            I laughed and told her that nothing would improve if she sat up and froze too.
        - id: ch01-b18
          speaker: maud_brewster
          text: >-
            It will improve once I learn to steer, and I certainly mean to learn.
        - id: ch01-b19
          speaker: narrator
          text: >-
            She sat up and began the simple work of getting ready for the day. When she shook out her hair, it fell around her in a brown cloud and hid her face and shoulders. I wanted to kiss that dear, damp hair, to run it through my fingers and press my face into it. I stared until the boat turned into the wind. The sail began to flap, warning me that I had forgotten my work.
        - id: ch01-b20
          speaker: narrator
          text: >-
            I had always been a romantic, even with my habit of analyzing everything. Yet until that moment, I had understood little about the physical side of love. I had imagined love between a man and a woman as something lifted above the body, a bond joining one spirit to another. In that idea of love, the body had hardly mattered. Now I was learning the lesson for myself. The spirit lives and speaks through the body. The sight and touch of a loved one's hair can carry her spirit just as surely as the light in her eyes or the thoughts on her lips.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Pure spirit cannot be known directly. We can only sense it, and it cannot show itself except through some form we understand. Even Jehovah had to appear to the Israelites in ways their minds could grasp. They imagined him in their own image, or knew him as a cloud or a pillar of fire. So I watched Maud's light brown hair and loved it. In that moment, it taught me more about love than all the poets and singers had taught me through their songs and sonnets.
        - id: ch01-b22
          speaker: narrator
          text: >-
            With one quick movement, she tossed her hair back. Her smiling face appeared.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Why don't women always wear their hair down? It looks so much more beautiful.
        - id: ch01-b24
          speaker: maud_brewster
          text: >-
            Because it tangles so terribly. Oh! I've lost one of my precious hairpins!
        - id: ch01-b25
          speaker: narrator
          text: >-
            As she searched through the blankets, I kept forgetting the boat. Again and again the sail spilled its wind while I followed every movement she made. Each small, womanly habit gave me a new rush of joy. I had placed her too high in my thoughts, farther and farther away from ordinary human life and from me, until she had become a distant goddess I could never approach. The toss of her head and the hunt for a hairpin brought her back beside me. She was a woman, one of my own kind, living on the same human level. The closeness possible between a man and a woman might be possible for us too, along with the wonder and reverence I knew I would always feel for her.
        - id: ch01-b26
          speaker: narrator
          text: >-
            She found the pin with a small cry of delight, and I finally gave more attention to steering. I lashed and wedged the steering oar until the boat could hold fairly close to the wind without my hands on it. Now and then she turned too far toward the wind or fell too far away, but she corrected herself and generally kept her course.
        - id: ch01-b27
          speaker: narrator
          text: >-
            And now we'll have breakfast. But first, you need warmer clothes.
        - id: ch01-b28
          speaker: narrator
          text: >-
            I brought out a new heavy shirt from the ship's clothing chest. It was made of thick, tightly woven blanket cloth, the kind that could stand hours of rain before it soaked through. Maud pulled it over her head. Then I traded her boy's cap for a man's cap, large enough to hold her hair and cover her neck and ears when its flap was down.
        - id: ch01-b29
          speaker: narrator
          text: >-
            She looked charming in it. Her face would have looked beautiful under anything. No rough clothing could spoil its fine oval, the almost classical lines of her features, her delicately drawn brows, or those large brown eyes. They saw everything clearly, yet remained wonderfully calm.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Just then, a stronger puff of wind hit us as the boat crossed a wave at an angle. The boat tipped sharply. Its side dipped to sea level, and a bucketful of water poured in. I was opening a can of tongue. I sprang for the sheet and let it go just in time. The sail beat loose, and the boat turned away from the wind. Within a few minutes, I had adjusted everything and put us back on course. Then I returned to breakfast.
        - id: ch01-b31
          speaker: maud_brewster
          text: >-
            I don't know much about sailing, but your steering arrangement seems to work quite well.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Only while we're sailing close to the wind. If the wind comes from behind us, from the side, or at an angle behind us, I'll have to steer myself.
        - id: ch01-b33
          speaker: maud_brewster
          text: >-
            I can't follow all those sailing terms, but I understand what they mean, and I don't like it. You can't steer every hour of every day. After breakfast, I expect my first lesson. Then you'll lie down and sleep. We'll take watches, the way sailors do on ships.
        - id: ch01-b34
          speaker: narrator
          text: >-
            How can I teach you when I'm still learning myself? When you trusted me with your life, you had no idea I'd never handled a small boat. This is the first one I've ever been in.
        - id: ch01-b35
          speaker: maud_brewster
          text: >-
            Then we'll learn side by side, sir. You had the whole night to begin, so you can teach me whatever you've discovered. Now let's eat. This cold air certainly makes me hungry!
        - id: ch01-b36
          speaker: narrator
          emotion: sad
          text: >-
            I'm sorry, but there's no coffee. We won't have tea, soup, or anything else hot until we reach land, wherever that may be and however we manage it.
        - id: ch01-b37
          speaker: narrator
          text: >-
            I passed her buttered sea biscuits and a slice of canned tongue. We finished our plain breakfast with a cup of cold water. Then Maud began her steering lesson. Teaching her taught me a good deal too. I was still putting my own scraps of knowledge together, using what I had learned while sailing the Ghost and what I had seen the boat steerers do in their small craft. Maud was a quick pupil. Before long, she could hold the course, turn toward the wind when a puff struck, and release the sheet in an emergency.
        - id: ch01-b38
          speaker: narrator
          text: >-
            At last, she seemed tired of the work and gave the oar back to me. I had folded the blankets, but she spread them over the bottom of the boat again. When she had made a snug bed, she turned to me.
        - id: ch01-b39
          speaker: maud_brewster
          text: >-
            Now, sir, get into bed. You will sleep until luncheon. No, until dinner, as they called it on the Ghost.
        - id: ch01-b40
          speaker: narrator
          text: >-
            What could I do? She insisted. Then she said, "Please, please," and that ended my resistance. I handed her the oar and obeyed.
        - id: ch01-b41
          speaker: narrator
          text: >-
            It was a deep physical pleasure to crawl into the bed she had arranged with her own hands. The fact that her hands had made it seemed to change everything. Her calmness and self-control had somehow passed into the blankets. A soft, dreamlike contentment settled over me. I saw an oval face and brown eyes framed by a fisherman's cap. Sometimes they moved against grey clouds, sometimes against a grey sea. Then I realized I had been asleep.
        - id: ch01-b42
          speaker: narrator
          text: >-
            My watch said one o'clock. I had slept for seven hours, and Maud had steered for all seven. When I took the oar, I had to open her cramped fingers myself. She had used every bit of her small strength and could not even move from where she sat. I had to release the sheet while I helped her into the blankets and rubbed warmth back into her hands and arms.
        - id: ch01-b43
          speaker: maud_brewster
          text: >-
            I'm so tired.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Her breath caught in a quick gasp. She sighed, and her head drooped with weariness. A moment later, she forced herself upright and challenged me in play.
        - id: ch01-b45
          speaker: maud_brewster
          text: >-
            Now, don't scold me. Don't you dare.
        - id: ch01-b46
          speaker: narrator
          text: >-
            I hope I don't look angry. I promise you, I'm not angry at all.
        - id: ch01-b47
          speaker: maud_brewster
          text: >-
            N-no. You only look disappointed in me.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Then my face is telling the truth, because that is how I feel. You weren't fair to yourself or to me. How am I supposed to trust you after this?
        - id: ch01-b49
          speaker: narrator
          text: >-
            She looked sorry, like a naughty child promising to behave.
        - id: ch01-b50
          speaker: maud_brewster
          text: >-
            I'll be good. I promise—
        - id: ch01-b51
          speaker: narrator
          text: >-
            Will you obey the way a sailor obeys the captain?
        - id: ch01-b52
          speaker: maud_brewster
          text: >-
            Yes. I know what I did was foolish.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Then I want one more promise from you.
        - id: ch01-b54
          speaker: maud_brewster
          text: >-
            Of course.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Don't say, "Please, please," too often. Whenever you do, my authority disappears.
        - id: ch01-b56
          speaker: narrator
          text: >-
            She laughed, pleased by the joke. She had noticed the power of those repeated words too.
        - id: ch01-b57
          speaker: narrator
          text: >-
            It is a very useful phrase—
        - id: ch01-b58
          speaker: maud_brewster
          text: >-
            But I shouldn't wear it out.
        - id: ch01-b59
          speaker: narrator
          text: >-
            Her laugh was weak, and her head sank again. I left the oar just long enough to tuck the blankets around her feet and draw one fold over her face. She was not strong. I looked southwest and thought uneasily of the six hundred hard miles ahead. Even that thought assumed hardship would be the worst we met. A storm could rise at any moment on that sea and wipe us out.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Still, I felt no fear. I had no confidence in what lay ahead and every reason to doubt it, but fear was gone. Again and again, I told myself that somehow it must come right.
        - id: ch01-b61
          speaker: narrator
          text: >-
            The wind strengthened that afternoon. It raised a rougher sea and tested both the boat and me. Our supply of food and nine breakers of water weighed the boat down. That weight helped her stand firmly against the wind and waves, so I held our course under the full sail as long as I dared. At last I took down the sprit and pulled the sail's peak tight. Under the small triangular sail that sailors call a leg of mutton, we raced on.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Late in the day, I saw a steamer's smoke on the horizon to leeward. It might have been a Russian cruiser, but I thought it was more likely the Macedonia, still searching for the Ghost. The sun never appeared, and the cold remained bitter. As night approached, the clouds grew darker and the wind blew harder. Maud and I ate supper in our mittens. I never stopped steering and snatched bites between the gusts.
        - id: ch01-b63
          speaker: narrator
          text: >-
            By dark, the wind and sea had grown too powerful for our boat. I gave up our course, took in the sail, and began making a drag, or sea anchor. I had heard the hunters explain the device, and it was simple enough to build. I furled the sail and lashed it tightly around the mast, boom, sprit, and two pairs of spare oars. Then I threw the whole bundle overboard and tied it to the bow with a line.
        - id: ch01-b64
          speaker: narrator
          text: >-
            The bundle floated low, almost out of reach of the wind, so it moved more slowly than the boat. That difference held our bow toward the wind and sea instead of letting us turn broadside to the breaking waves. With whitecaps breaking around us, this was the safest position and gave us our best chance of avoiding a swamping wave.
        - id: ch01-b65
          speaker: narrator
          text: >-
            When the work was finished, I pulled on my mittens. Maud spoke cheerfully.
        - id: ch01-b66
          speaker: maud_brewster
          text: >-
            And what happens now?
        - id: ch01-b67
          speaker: narrator
          text: >-
            Now we've stopped moving toward Japan. We're drifting southeast, or perhaps south-southeast, at no less than two miles an hour.
        - id: ch01-b68
          speaker: maud_brewster
          text: >-
            If the wind stays strong all night, that means only twenty-four miles.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Yes, and if it lasts three days and nights, it means a hundred and forty miles.
        - id: ch01-b70
          speaker: maud_brewster
          text: >-
            It won't last that long. The wind will turn and blow us the right way.
        - id: ch01-b71
          speaker: narrator
          text: >-
            You can't trust the sea.
        - id: ch01-b72
          speaker: maud_brewster
          text: >-
            But what about the wind? I've heard you speak beautifully about the brave trade wind.
        - id: ch01-b73
          speaker: narrator
          emotion: sad
          text: >-
            I wish I'd brought Wolf Larsen's chronometer and sextant. We sail in one direction, drift in another, and the current may carry us in a third. Dead reckoning can never make sense of all three. Before long, we could be five hundred miles wrong about our position.
        - id: ch01-b74
          speaker: narrator
          text: >-
            I apologized and promised not to lose heart again. At Maud's urging, I let her keep watch until midnight. It was nine then. Before lying down, I wrapped her in blankets and covered her with an oilskin.
        - id: ch01-b75
          speaker: narrator
          text: >-
            I slept in brief snatches. The boat climbed the crests and came down pounding. I heard the seas rushing past us, and spray kept flying aboard. Even so, I thought it was not a truly bad night. It was nothing beside the nights I had survived on the Ghost, and perhaps nothing beside the nights still waiting for us in this little shell of a boat. Its planks were only three quarters of an inch thick. Less than an inch of wood stood between us and the ocean floor.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Yet I was unafraid. I say it once, and I say it again. I was unafraid. Wolf Larsen and even Thomas Mugridge had once made me fear death, but I no longer did. Maud Brewster's arrival in my life had changed me.
        - id: ch01-b77
          speaker: narrator
          text: >-
            I understood now that it was better and finer to love than to be loved, if love could give life something worth dying for. Loving another life made me forget my own. That was the strange contradiction. At the very moment when my own life mattered least to me, I had never wanted so badly to keep living.
        - id: ch01-b78
          speaker: narrator
          text: >-
            I had never had so much reason to live.
        - id: ch01-b79
          speaker: narrator
          text: >-
            That was my last thought before I dozed again. Until sleep came, I stared into the darkness toward the place where I knew Maud crouched low in the stern, watching the foaming sea and ready to call me in an instant.
