audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十八章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我们在小艇里熬了许多天，吃过的苦不必一件件说了。海风想把我们送到哪里，我们就只能漂到哪里。强劲的西北风刮了整整一天，停过一阵，夜里又从西南方迎面吹来。我收起海锚，升帆贴风走，航向转成南偏东。我们其实也可以去西偏北，可南风带着暖意，我一心想去更暖的海域，便选了南边。
        - id: ch01-b02
          speaker: narrator
          text: >-
            三个小时后正是午夜。那一夜，海上黑得我从未见过。西南风突然发起狂来，我只好重新放下海锚。
        - id: ch01-b03
          speaker: narrator
          text: >-
            天亮时，我困得两眼发木。海面全被风抽白了，小艇系在海锚后面，颠得船头几乎直立起来。白头浪随时可能淹没我们，飞沫和海水又不断灌进艇里。我只能一刻不停地舀水。毯子全湿透了，别的东西也没有一样是干的。只有莫德穿着油布衣和橡胶靴，戴着防水帽，除了脸、手和一绺散发，身上还保持干燥。
        - id: ch01-b04
          speaker: narrator
          text: >-
            她不时接过舀水的活，勇敢地迎着风暴，一勺一勺把水泼出去。世上的事情总得相对来看。这本来只算一场劲风，可我们坐在这条脆弱的小艇里拼命求生，它对我们就是一场真正的风暴。
        - id: ch01-b05
          speaker: narrator
          text: >-
            一整天，寒风都打在脸上，白浪在身边怒吼，我们就在阴冷里苦苦支撑。夜里谁也没睡。又一个白天来了，风和海还是老样子。到了第二夜，莫德累得不停打瞌睡。我拿油布衣和篷布盖住她。她还算干燥，身体却已经冻麻了。我真怕她熬不过那一夜。可天亮以后，天空仍压着阴云，寒风仍旧扑面，海浪仍旧轰响。
        - id: ch01-b06
          speaker: narrator
          text: >-
            我已经四十八小时没有合眼。衣服湿透，寒气浸进骨头，整个人像是已经死了一多半。劳累和寒冷让身体僵硬，酸痛的肌肉每动一下都痛得要命，可我还必须不停地动。与此同时，小艇一路漂向东北，离日本越来越远，直奔荒寒的白令海。
        - id: ch01-b07
          speaker: narrator
          text: >-
            可我们还活着，小艇也还浮着，风却一点没减弱。第三天快入夜时，风甚至更大了。船头一头扎进浪峰，再冲出来，艇里已经灌了四分之一的水。我拼命向外舀。积水把船身压低，又夺走了浮力。只要再来一道同样的浪，我们就彻底完了。
        - id: ch01-b08
          speaker: narrator
          text: >-
            水总算舀空了。我不得不把盖在莫德身上的篷布拿走，横着绑紧在船头。幸亏有它挡着。从船头往后将近三分之一的艇身都盖住了。接下来的几个小时，船头又有三次扎进海浪，冲下来的水大半都被篷布挡了出去。
        - id: ch01-b09
          speaker: narrator
          text: >-
            莫德缩在艇底，样子叫人心痛。她的嘴唇冻得发青，脸色灰白，脸上明明写满了痛苦。可她望着我的眼睛始终那么勇敢，嘴里说的也一直是鼓励我的话。
        - id: ch01-b10
          speaker: narrator
          text: >-
            那一夜也许是风暴最凶的时候，我却几乎不知道。我终于撑不住，坐在艇尾座板上睡着了。第四天早晨，风低成了轻轻的絮语，海也慢慢平静下来，太阳照到了我们身上。啊，那太阳简直是恩赐。我们让冻坏的身体尽情晒着，像暴风雨后的甲虫和小爬虫一样，重新活了过来。
        - id: ch01-b11
          speaker: narrator
          text: >-
            我们又笑起来，也会说几句逗趣的话，还乐观地谈起眼前的处境。其实，情形比先前更糟。我们离日本比逃出“幽灵号”那夜还远，经纬度也只能粗略猜测。七十多个小时里，若每小时漂两英里，我们至少向东北退了一百五十英里。可谁知道速度对不对？也许每小时漂了四英里。真是那样，我们就又多退了一百五十英里。
        - id: ch01-b12
          speaker: narrator
          text: >-
            我不知道我们究竟在哪里，只觉得很可能还在“幽灵号”附近。四周有海豹，我随时盼着看见捕海豹的帆船。下午，西北风又清劲地吹起来，我们果然望见了一艘。可那艘陌生帆船很快消失在天边，海天之间又只剩下我们两个。
        - id: ch01-b13
          speaker: narrator
          text: >-
            后来有过大雾弥漫的日子，连莫德都打不起精神，再也说不出快活话。也有些日子没有一丝风，我们漂在无边无际的海上。大海的浩瀚压得人喘不过气，可我们又惊叹生命的奇迹。我们那么微小，竟然还活着，还在努力活下去。有时雨夹着雪，狂风带来一阵阵雪飑，不管怎样也暖和不了。有时细雨不停，我们就接住湿船帆滴下的水，装满盛水的小桶。
        - id: ch01-b14
          speaker: narrator
          text: >-
            我一天比一天更爱莫德。她有太多侧面，情绪又那么丰富，我在心里叫她“千变万化的莫德”。可这个称呼，还有别的更亲昵的话，我从来没有说出口。爱的告白上千次涌到舌尖，我都忍住了。我知道，这不是告白的时候。一个男人正在保护一个女人，想方设法救她性命，又怎么能趁这时向她索求爱情？
        - id: ch01-b15
          speaker: narrator
          text: >-
            我很得意，觉得自己把这微妙的处境处理得足够谨慎。不光因为这一层，眼下还有别的微妙之处。我甚至相信，自己从来没有用一个眼神、一个动作泄露心里的爱。我们像两个好伙伴，而且一天比一天更加亲密默契。
        - id: ch01-b16
          speaker: narrator
          text: >-
            莫德还有一点让我惊讶。她一点也不显得胆怯害怕。可怕的大海，脆弱的小艇，接连不断的风暴和苦难，还有这种陌生又孤绝的处境，便是身体强健的女人也会被吓住。可它们似乎都没有影响到她。她从前只过着最受保护、也最远离真实世界的生活。她本人又像火焰、露水和雾气，是纯净的精神，也集中了女人身上一切柔软、温存和依恋。
        - id: ch01-b17
          speaker: narrator
          text: >-
            不，我这样说也不对。她会胆怯，也会害怕，只是她有勇气。血肉之躯免不了有惊惧，可肉体的重担只能压住肉体。莫德首先是精神，也永远是精神。她是生命净化后的精髓，像那双安详的眼睛一样沉静。在宇宙不停变化的秩序里，她确信自己不会消失。
        - id: ch01-b18
          speaker: narrator
          text: >-
            风暴又来了，一连几天几夜都不停。大海翻着咆哮的白浪威胁我们，狂风像巨人的拳头，一下又一下砸向挣扎的小艇。我们继续被抛向东北，越漂越远。最猛烈的那场风暴里，我实在累透了，便朝下风处望了一眼。我并没有找什么，只是不想再看眼前这场天地间的恶斗，几乎在无声地哀求那些愤怒的力量停手，让我们安生一会儿。
        - id: ch01-b19
          speaker: narrator
          text: >-
            第一眼看到那东西，我根本不敢相信。连日失眠又不断担忧，也许已经让我神志不清。我回头看看莫德，仿佛要靠她确认自己仍在真实的世界里。她的面颊被雨打湿，头发迎风飞舞，那双棕色眼睛却依然勇敢。看到她，我才相信自己的眼睛还没有坏。
        - id: ch01-b20
          speaker: narrator
          text: >-
            我重新望向下风处。那里的确伸出一座海岬，又黑又高，光秃秃的。狂涛撞碎在它脚下，又冲上正面，喷泉般直冲高处。阴沉险恶的海岸向东南延伸，边缘缠着一道宽得惊人的白色浪带。
        - id: ch01-b21
          speaker: humphrey
          text: 莫德。莫德。
        - id: ch01-b22
          speaker: narrator
          text: 她转过头，也看见了。
        - id: ch01-b23
          speaker: maud_brewster
          text: 那不可能是阿拉斯加吧！
          emotion: surprised
        - id: ch01-b24
          speaker: humphrey
          text: 唉，不是。你会不会游泳？
        - id: ch01-b25
          speaker: narrator
          text: 莫德摇了摇头。
        - id: ch01-b26
          speaker: humphrey
          text: >-
            我也不会。那我们只能找岩石间的缺口，让小艇冲进去，再爬到岸上。动作得非常快，还绝不能出错。
        - id: ch01-b27
          speaker: narrator
          text: >-
            我说得很有把握，可她知道那只是装出来的。她仍用那双坚定的眼睛看着我。
        - id: ch01-b28
          speaker: maud_brewster
          text: 你为我做了这么多，我一直还没有谢过你，可是……
        - id: ch01-b29
          speaker: narrator
          text: 她停住了，像是不知道该怎样说出这份感激。
        - id: ch01-b30
          speaker: humphrey
          text: 可是什么？
        - id: ch01-b31
          speaker: narrator
          text: 我答得很生硬，因为我不喜欢听她向我道谢。
        - id: ch01-b32
          speaker: maud_brewster
          text: 那你可以帮我想想该怎么说呀。
        - id: ch01-b33
          speaker: narrator
          text: 她说这话时微微一笑。
        - id: ch01-b34
          speaker: humphrey
          text: >-
            帮你在临死以前，把欠我的情分交代清楚吗？想也别想。我们不会死。我们会登上那座岛，今天还没过去，就能找到一个舒服又避风的地方。
        - id: ch01-b35
          speaker: narrator
          text: >-
            我说得斩钉截铁，自己却一个字也不信。我撒谎并不是因为害怕。再过几百码，我们多半会死在岩石间翻滚的浪里，可我不怕自己的死。我们已经不可能升帆离开这段海岸了。风会马上掀翻小艇，艇身一旦横进浪谷，海水也会把它淹没。何况船帆正绑在备用桨上，拖在前方的海里。
        - id: ch01-b36
          speaker: narrator
          text: >-
            真正让我惊骇的，是莫德也必须死。该死的想象力让我看见她被浪摔上岩石，撞得遍体破碎。我实在受不了那个画面，只能逼自己去想，我们一定能平安上岸。所以，我嘴里说的不是自己相信的话，而是自己愿意相信的话。
        - id: ch01-b37
          speaker: narrator
          text: >-
            我不敢再往下想。一瞬间，我甚至想把莫德抱起来，直接跳进海里。可我又决定等到最后，等小艇进入通向死亡的最后一段路。我会把她抱进怀中，告诉她我爱她，再紧紧抱着她拼死挣扎，一同死去。
        - id: ch01-b38
          speaker: narrator
          text: >-
            我们不由自主地在艇底靠得更近。她戴着连指手套的手伸过来，握住我的手。我们一句话也没说，只等着最后一刻。小艇快要漂到海岬西侧那条风线了。我一直看着，盼望海流或涌浪能把我们推过岬角，别让我们撞进拍岸浪。
        - id: ch01-b39
          speaker: humphrey
          text: 我们能绕过去。
        - id: ch01-b40
          speaker: narrator
          text: 我故意说得信心十足，可心里明白，我们谁也没有被这句话骗住。
        - id: ch01-b41
          speaker: humphrey
          text: 上帝作证，我们一定能绕过去！
        - id: ch01-b42
          speaker: narrator
          text: >-
            五分钟后，我激动得喊出了这句誓言。要不是把年轻时说过的“真麻烦”也算成咒骂，这大概是我一辈子第一次发誓。
        - id: ch01-b43
          speaker: humphrey
          text: 请原谅。
        - id: ch01-b44
          speaker: maud_brewster
          text: 这下我相信你是真心的了。现在，我真的知道我们能绕过去。
        - id: ch01-b45
          speaker: narrator
          text: >-
            她脸上带着一点微弱的笑。我刚才已经越过海岬最外缘，看见了远处另一座岬角。现在，两座岬角之间的海岸渐渐展开，露出一个很深的海湾。就在这时，一阵连绵不断的巨响传进耳朵，仿佛远处响着滚滚的雷。声音从下风处直扑过来，甚至压过拍岸浪，顶着风暴传到我们这里。
        - id: ch01-b46
          speaker: narrator
          text: >-
            小艇绕过岬角，整个海湾一下出现在眼前。一弯半月形的白沙滩上，巨浪接连拍下。数也数不清的海豹挤满了海滩，那震天的吼声就是它们发出来的。
        - id: ch01-b47
          speaker: humphrey
          text: >-
            是海豹繁殖场！这次我们真的得救了。一定有人和巡逻舰守在这里，防备捕猎海豹的人。岸上说不定就有驻站。
          emotion: happy
        - id: ch01-b48
          speaker: narrator
          text: 我仔细看着冲上海滩的浪，心里还不敢完全放松。
        - id: ch01-b49
          speaker: humphrey
          text: >-
            还是很危险，不过比刚才好些。现在只要诸神真的肯帮忙，我们就能漂过下一座岬角，找到一片完全避风的海滩。说不定上岸时，连脚都不用弄湿。
        - id: ch01-b50
          speaker: narrator
          text: >-
            诸神真的帮了我们。第一和第二座岬角正好顺着西南风排成一线。绕过第二座时，我们险些靠得太近。接着，第三座岬角也出现了，仍跟风向和前两座排在一条线上。不过，中间的海湾深深伸进陆地，涨潮的海水把我们带进了岬角背后的避风处。
        - id: ch01-b51
          speaker: narrator
          text: >-
            海面平静下来，只剩沉重却平滑的长涌。我收起海锚，开始划桨。海岸从岬角起越弯越向南，后来又转向西方，终于露出海湾里面的一个小湾。那是一座四周被陆地围住的小港，水面平得像池塘。海滩内侧一百英尺处立着一面阴沉的岩壁。只有零星的风和风暴的余息从岩壁上方冲下来，在水面吹出细小的波纹。
        - id: ch01-b52
          speaker: narrator
          text: >-
            这里一只海豹也没有。船尾碰到了坚硬的细石滩。我跳下船，伸手接莫德，她下一刻便站在我身旁。我的手刚松开，她就赶紧抓住我的胳膊。与此同时，我自己也晃了起来，差点倒在沙地上。
        - id: ch01-b53
          speaker: narrator
          text: >-
            船不再摇动，反倒给了我们一次惊人的冲击。我们在起伏颠簸的海上待得太久，以为海滩也会左右抬起，岩壁也会像船舷一样前后摇摆。身体自动绷紧，准备跟着那些预料中的晃动调整。可陆地纹丝不动，我们的平衡一下全乱了。
        - id: ch01-b54
          speaker: maud_brewster
          text: 我真的非坐下来不可了。
        - id: ch01-b55
          speaker: narrator
          text: >-
            莫德紧张地笑了一声，晕乎乎地摆摆手，马上坐到了沙地上。我先把小艇系稳，才走过去陪她。我们就这样登上了后来称作“奋进岛”的地方。在海上漂得太久，踏上陆地以后，我们反倒晕起陆地来。
