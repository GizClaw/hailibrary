audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
  chapters:
    - id: ch01
      title: CHAPTER XXVIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I need not tell every detail of the suffering we endured in that small boat. For many days the ocean drove us wherever it pleased. A hard northwest wind blew for twenty-four hours, then died away. During the night, another wind rose from the southwest, straight against us. I pulled in the sea-anchor and raised sail. The wind allowed me to choose between a south-southeast course and one toward the west-northwest. The choice was even, but the southern air felt warm, and it made me long for warmer seas. So I steered south-southeast.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Three hours later, at midnight, the darkness was as deep as any I had known at sea. The southwest wind suddenly rose with great force, and I had to set the sea-anchor again.
        - id: ch01-b03
          speaker: narrator
          text: >-
            At dawn my eyes were worn and the whole ocean was whipped white. The boat pitched so steeply against its drag that the whitecaps threatened to swamp us. Spray and foam poured aboard, and I bailed without stopping. The blankets were soaked. Everything was wet except Maud. Her oilskins, rubber boots, and sou'wester kept her dry apart from her face, her hands, and one loose strand of hair. From time to time she took my place at the bailing-hole and bravely threw out the water. To a ship, it might have been only a hard blow. To us, fighting for life in that frail boat, it was a true storm.
        - id: ch01-b04
          speaker: narrator
          text: >-
            We struggled through the cold, miserable day with the wind striking our faces and the white seas roaring past. Night came, and neither of us slept. Another day came, but nothing changed. By the second night, Maud was dropping asleep from exhaustion. I covered her with oilskins and a tarpaulin. She stayed fairly dry, but the cold had numbed her. I was terribly afraid she might die before morning. Yet morning came with the same grey sky, the same driving wind, and the same roaring sea.
        - id: ch01-b05
          speaker: narrator
          text: >-
            I had gone forty-eight hours without sleep. I was wet and cold to the bone, and I felt closer to death than life. Effort and cold had stiffened my body. Every movement tortured my aching muscles, and I had to keep moving. All the while, the storm carried us northeast, away from Japan and toward the bleak Bering Sea.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Still, we lived. The boat lived too, and the wind never eased. Near sunset on the third day, it grew even stronger. The bow plunged beneath a crest, and the boat came through one-quarter full of water. I bailed madly. That water weighed us down and stole our buoyancy, making the next wave far more dangerous. Another sea like that would finish us.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Once the boat was empty, I took the tarpaulin away from Maud and lashed it across the bow. It covered the forward third of the boat, and that saved us. Three times in the next few hours, the bow buried itself in the sea. Each time, the tarpaulin threw off most of the water rushing down upon us.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Maud's condition was pitiful. She crouched in the bottom of the boat with blue lips and a grey face that plainly showed her pain. But her brave eyes always met mine, and every word she spoke was brave.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The storm must have been at its worst that night, though I hardly knew it. At last exhaustion defeated me, and I slept where I sat in the stern-sheets. On the fourth morning, I woke to find the wind reduced to a gentle whisper. The sea was settling, and sunlight shone upon us. That blessed sun! After so many hours of cold, we let its delicious warmth soak into our poor bodies. We seemed to come back to life like insects and other tiny crawling creatures after a storm. Before long, we could smile again. We even made jokes and spoke hopefully about our chances.
        - id: ch01-b10
          speaker: narrator
          text: >-
            In truth, our position was worse than before. We were farther from Japan than we had been on the night we left the Ghost, and I could only guess our latitude and longitude. If we had drifted two miles an hour during those seventy-odd hours, the storm had carried us at least one hundred and fifty miles northeast. But perhaps we had moved at four miles an hour. If so, we were another hundred and fifty miles worse off.
        - id: ch01-b11
          speaker: narrator
          text: >-
            I did not know where we were. There was a fair chance that we had drifted back near the Ghost, but I had no way to be certain. Seals surrounded us, and their presence made me expect a sealing schooner at any moment. That afternoon, when a fresh northwest breeze came up, we did see one in the distance. But the strange schooner vanished along the horizon, leaving no ship in sight, and once more we alone occupied the great circle of the sea.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Then came foggy days, when even Maud lost heart and had no cheerful words. There were calm days when we floated on the lonely, endless sea. Its greatness weighed on us, yet we wondered at the miracle of our own tiny lives, because we still lived and still fought to live. There were days of sleet, wind, and sudden snow squalls when nothing we tried could keep us warm. There were also days of drizzling rain. On those days, we collected the drops running from the wet sail and used them to fill our water-breakers.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Through it all, my love for Maud kept growing. She had so many sides and so many moods that, in my thoughts, I called her protean-mooded. I called her other, dearer things there too, but never aloud. A thousand times I nearly told her I loved her. Each time, I knew this was not the moment. While I was protecting a woman and trying to save her, I could not ask that woman to love me. I believed I handled our delicate situation with care and gave her no look or sign that revealed my feelings. We were good comrades, and with every passing day we became better ones.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Her lack of fear amazed me. She had known life only in its most sheltered and artificial form. Yet the terrible sea, our frail boat, the storms, the suffering, and the strangeness of being alone out there seemed unable to master her. All of it would have frightened even a strong woman. Maud herself was so soft and tender that I thought of her as fire, dew, and mist. But I was wrong to say she felt no fear. She was timid and afraid, and still she had courage. Her body suffered all that flesh could suffer, but the pain stopped there. It could not burden her spirit. That spirit came first, always. It was as calm as her eyes, and as sure of its place in a changing universe.
        - id: ch01-b15
          speaker: narrator
          text: >-
            More storms came, through days and nights. The ocean threatened us with its roaring whiteness, and the wind struck our struggling boat with giant blows. Each time, we were thrown farther and farther northeast. During the worst storm we had yet suffered, I finally turned a tired glance downwind. I was not searching for a sail or hoping to find anything. I was simply weary of staring into that endless battle. My look was almost a silent plea to the angry powers around us to stop and leave us in peace.
        - id: ch01-b16
          speaker: narrator
          text: >-
            At first, I could not believe what I saw. Sleeplessness and worry must have confused my mind. I looked back at Maud to make sure I still knew where I was. Her wet cheeks, flying hair, and brave brown eyes told me my sight was sound. I looked downwind again. There stood a headland, black, high, and bare. Wild surf burst around its base and threw fountains high against its face. Beyond it, a dark, forbidding coast ran southeast beneath a huge white border of foam.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Maud. Maud.
        - id: ch01-b18
          speaker: narrator
          text: >-
            She turned and saw the coast.
        - id: ch01-b19
          speaker: maud_brewster
          emotion: surprised
          text: >-
            It can't be Alaska!
        - id: ch01-b20
          speaker: narrator
          text: >-
            No, sadly. Can you swim?
        - id: ch01-b21
          speaker: narrator
          text: >-
            She shook her head.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Neither can I. So we must reach shore without swimming. We need to find an opening among the rocks, drive the boat through it, and climb out. But we must be very quick, very careful, and very sure.
        - id: ch01-b23
          speaker: narrator
          text: >-
            I spoke with a confidence Maud knew I did not possess. She fixed me with her steady gaze.
        - id: ch01-b24
          speaker: maud_brewster
          text: >-
            I haven't thanked you for everything you've done for me, but...
        - id: ch01-b25
          speaker: narrator
          text: >-
            She stopped, uncertain how to express her gratitude. I did not like being thanked, and my answer came out harshly.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Well?
        - id: ch01-b27
          speaker: maud_brewster
          emotion: happy
          text: >-
            You might help me find the words.
        - id: ch01-b28
          speaker: narrator
          text: >-
            So you can settle your debt before you die? I won't help with that. We are not going to die. We will land on that island, and before this day ends, we will be safe and sheltered.
        - id: ch01-b29
          speaker: narrator
          text: >-
            I spoke firmly, though I believed none of it. I was not lying because I feared my own death. The boiling surf among the rocks lay only a few hundred yards downwind, and I felt certain it would kill us. We could not raise sail and fight away from the shore. The wind would overturn the boat at once, and the seas would swamp us as soon as we fell into a trough. Besides, the sail was tied to the spare oars and dragging in the water ahead.
        - id: ch01-b30
          speaker: narrator
          text: >-
            My own death did not frighten me. The thought of Maud dying appalled me. My cruel imagination showed her battered against the rocks, and I could not bear it. I forced myself to think of a safe landing. My words expressed what I wanted to believe, not what I truly believed.
        - id: ch01-b31
          speaker: narrator
          text: >-
            For one moment, I had the wild thought of taking Maud in my arms and jumping overboard. Then I decided to wait. When the final rush began, I would hold her, tell her I loved her, and make one desperate struggle with her in my arms. If we failed, we would die that way.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Without thinking, we moved closer together in the bottom of the boat. Her mittened hand reached for mine. We said nothing as we waited for the end. The boat was close to the line between the wind and the western edge of the headland. I watched and hoped a current or a lift of the sea would carry us past before we struck the surf.
        - id: ch01-b33
          speaker: narrator
          text: >-
            We are going to clear it.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Five minutes later, hope suddenly became certainty.
        - id: ch01-b35
          speaker: narrator
          text: >-
            By God, we will clear it!
        - id: ch01-b36
          speaker: narrator
          text: >-
            In my excitement, an oath had escaped me. I believe it was the first of my life, unless the mild expression from my youth, trouble it, could be called an oath.
        - id: ch01-b37
          speaker: narrator
          text: >-
            I beg your pardon.
        - id: ch01-b38
          speaker: maud_brewster
          emotion: happy
          text: >-
            Now you've convinced me you mean it. I know we'll clear the point.
        - id: ch01-b39
          speaker: narrator
          text: >-
            I had seen another headland beyond the far edge of the first one. As we watched, the coastline between them grew into view, and it became clear that a deep cove cut into the land. At the same time, a vast and unbroken bellowing reached our ears from downwind. It had the depth and power of distant thunder. It rose above the crashing surf and travelled straight toward us, directly against the storm.
        - id: ch01-b40
          speaker: narrator
          text: >-
            We passed the point, and the whole cove opened before us. A half-moon of white sand lay beneath a tremendous surf. Countless seals covered the beach, and their voices made that mighty roar.
        - id: ch01-b41
          speaker: narrator
          text: >-
            A seal rookery! We really are saved now. There must be men and patrol ships here to protect the seals from hunters. There may even be a station on shore.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Then I studied the surf pounding the beach.
        - id: ch01-b43
          speaker: narrator
          text: >-
            It's still dangerous, but not as bad as before. If the gods are truly kind, we'll drift past the next headland and find a perfectly sheltered beach. We may even land without getting our feet wet.
        - id: ch01-b44
          speaker: narrator
          text: >-
            The gods were kind. The first and second headlands stood directly in line with the southwest wind. We passed dangerously close around the second. Once beyond it, we saw a third headland lying in the same line as the other two. The cove between them reached deep into the land, and the incoming tide slowly carried us beneath the shelter of the point. The fierce sea fell away there. Only a heavy but smooth ground-swell remained. I pulled in the sea-anchor and began to row.
        - id: ch01-b45
          speaker: narrator
          text: >-
            The shore curved farther and farther south and west. At last, it revealed another cove inside the first, a small harbour completely enclosed by land. Its water lay level as a pond. Only tiny ripples disturbed it when stray breaths of the storm tumbled over the dark wall of rock behind the beach, a hundred feet inland.
        - id: ch01-b46
          speaker: narrator
          text: >-
            There were no seals anywhere in this inner harbour. At last, the boat's stern touched the hard shingle. I jumped out and held my hand toward Maud, and a moment later she stood beside me on shore. But as my fingers released hers, she quickly grabbed my arm for support. At that very moment, I too swayed as though I were about to fall onto the sand.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Still land had shocked us. We had spent so long on the rolling sea that we expected the beach to rise and fall beneath us and the rock walls to swing like the sides of a ship. Our bodies automatically braced first one way and then another for movements that never came. Each useless correction threw us farther off balance until standing still became almost impossible.
        - id: ch01-b48
          speaker: maud_brewster
          text: >-
            I really have to sit down.
        - id: ch01-b49
          speaker: narrator
          text: >-
            She gave a nervous laugh, made one dizzy gesture, and sat on the sand. I secured the boat and joined her. That was how we landed on the place we came to call Endeavour Island, made land-sick by our long days at sea.
