  chapters:
    - id: ch01
      title: CHAPTER XV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The men at the foot of the ladder cursed and groaned as they struggled upright. Parsons was among them. He was Standish's boat-steerer, a dark, gloomy-looking man. Harrison pulled an oar in the same boat.
        - id: ch01-b02
          speaker: parsons
          text: >-
            Somebody light a lamp. My thumb's been knocked out of joint.
        - id: ch01-b03
          speaker: leach
          text: >-
            You'll probably find it rolling around by the bitts.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Leach sat on the edge of the bunk where I was hiding. Men fumbled in the dark, matches scratched, and the sea-lamp came alive with a weak, smoky flame. In that strange light, bare-legged sailors moved around tending bruises and wounds.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Oofty-Oofty seized Parsons's thumb, pulled it hard, and snapped it into place. His own knuckles were split open to the bone. Grinning wide enough to show his beautiful white teeth, he explained that he had cut them on Wolf Larsen's mouth.
        - id: ch01-b06
          speaker: kelly
          emotion: angry
          text: >-
            So you're the black devil who hit me, are you?
        - id: ch01-b07
          speaker: narrator
          text: >-
            Kelly was an Irish-American longshoreman making his first voyage as a boat-puller for Kerfoot. He spat out blood and teeth, then thrust his quarrelsome face close to Oofty-Oofty. The islander sprang back to his bunk and sprang forward again, waving a long knife.
        - id: ch01-b08
          speaker: leach
          text: >-
            Oh, lie down, Kelly. I'm tired of you. Leave Oofty alone. How was he supposed to know it was you in the dark?
        - id: ch01-b09
          speaker: narrator
          text: >-
            Young and inexperienced as he was, Leach clearly ruled the forecastle. Kelly backed down, muttering, and Oofty-Oofty gave Leach a grateful flash of white teeth. The islander was a beautiful man, almost feminine in the pleasing lines of his figure. His large eyes were soft and dreamy. That gentle look seemed impossible to reconcile with the reputation for fighting and action he had earned.
        - id: ch01-b10
          speaker: johnson
          text: >-
            How did he manage to get away?
        - id: ch01-b11
          speaker: narrator
          text: >-
            Johnson sat on his bunk in complete despair, still breathing hard after the struggle. His shirt had been torn away. Blood ran from a cut in his cheek, down his bare chest, across his white thigh, and onto the floor.
        - id: ch01-b12
          speaker: leach
          emotion: angry
          text: >-
            Because he's the devil. I've told you that before. And not one of you could get hold of a knife!
        - id: ch01-b13
          speaker: narrator
          text: >-
            Leach leaped to his feet. Tears stood in his eyes as he raged at his disappointment and kept grieving that no one had found him a knife. But the other sailors were too frightened of what Wolf Larsen would do next to pay attention.
        - id: ch01-b14
          speaker: kelly
          text: >-
            How can he tell which of us was which, unless somebody talks?
        - id: ch01-b15
          speaker: narrator
          text: >-
            Kelly looked around at the others as if he might murder any man who betrayed them.
        - id: ch01-b16
          speaker: parsons
          text: >-
            He'll know the moment he sees us. One look at you will tell him plenty.
        - id: ch01-b17
          speaker: louis
          text: >-
            Tell him the deck jumped up and knocked the teeth out of your jaw. Just wait till he sees the faces on the lot of you tomorrow.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Louis grinned from his bunk. He alone had stayed out of the fight, and he was delighted to have no bruises that could betray him.
        - id: ch01-b19
          speaker: sailor_one
          text: >-
            We'll tell him we thought we were fighting the mate.
        - id: ch01-b20
          speaker: sailor_two
          text: >-
            I know my story. I heard a fight and jumped out of my bunk. Somebody cracked me on the jaw, so I joined in. It was too dark to see anyone. I just started swinging.
        - id: ch01-b21
          speaker: kelly
          text: >-
            And naturally, I'm the man you hit.
        - id: ch01-b22
          speaker: narrator
          text: >-
            For a moment, Kelly's face brightened. Leach and Johnson stayed out of the planning. Their shipmates looked at them differently from everyone else. To those frightened men, Leach and Johnson were already doomed. The worst could not be avoided, hope was gone, and they were as good as dead. Leach endured the others' fears and reproaches for a while. Then he burst out.
        - id: ch01-b23
          speaker: leach
          emotion: angry
          text: >-
            I'm sick of hearing you. What a fine gang you are! If you'd used your hands instead of your mouths, he'd be finished now. Why couldn't one of you find me a knife when I called for it? Now you're all moaning as if he's going to kill you when he catches you. You know he won't. He can't afford to.
        - id: ch01-b24
          speaker: leach
          text: >-
            There aren't any shipping agents or beachcombers out here, and he needs every man for his work. If he gets rid of you, who will row and steer the boats? Who will sail the ship? Johnson and I are the ones who'll pay for this. Now get into your bunks and keep quiet. I want some sleep.
        - id: ch01-b25
          speaker: parsons
          text: >-
            Maybe he won't kill the rest of us. But remember what I say. From now on, hell will feel warm beside this ship.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Through all of this, I had been worrying about my own danger. What would these battered and frightened men do when they found me hidden among them? If they turned on me, I could never fight my way free as Wolf Larsen had. Just then, Latimer called down through the open hatch.
        - id: ch01-b27
          speaker: latimer
          text: >-
            Hump! The captain wants you!
        - id: ch01-b28
          speaker: parsons
          text: >-
            He isn't down here!
        - id: ch01-b29
          speaker: narrator
          text: >-
            I slid out of the bunk and fought to make my voice sound steady and brave.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Yes, he is.
        - id: ch01-b31
          speaker: narrator
          text: >-
            The sailors stared at me in shock. Their faces were full of fear and the cruelty that fear can bring out in men.
        - id: ch01-b32
          speaker: narrator
          text: >-
            I'm coming, Latimer!
        - id: ch01-b33
          speaker: kelly
          emotion: angry
          text: >-
            No, you're not! You filthy little spy. I'll make sure you never talk!
        - id: ch01-b34
          speaker: narrator
          text: >-
            Kelly stepped between me and the ladder, his right hand curved as if it were ready to close around my throat.
        - id: ch01-b35
          speaker: leach
          text: >-
            Let him pass.
        - id: ch01-b36
          speaker: kelly
          emotion: angry
          text: >-
            Not a chance.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Leach did not move from the edge of the bunk. When he spoke again, his voice was hard as metal.
        - id: ch01-b38
          speaker: leach
          text: >-
            I said, let him pass.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Kelly hesitated. I stepped toward him, and he moved aside. Once I reached the ladder, I turned back. A circle of savage, hateful faces watched me through the half-darkness. They were brutal faces, but a deep rush of sympathy came over me. I remembered the Cockney's way of saying it. How God must have hated these men, to let them be tortured so.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Believe me, I haven't seen or heard anything.
        - id: ch01-b41
          speaker: leach
          text: >-
            I told you he's all right. He hates the captain as much as you and I do.
        - id: ch01-b42
          speaker: narrator
          text: >-
            I heard Leach behind me as I climbed the ladder.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Wolf Larsen was waiting in the cabin, stripped and bloody. He welcomed me with one of his curious smiles.
        - id: ch01-b44
          speaker: wolf_larsen
          text: >-
            Come along, Doctor. It looks as if you'll have a large practice on this voyage. I don't know what the Ghost would do without you. If I were capable of such noble feelings, I'd tell you how grateful her captain is.
        - id: ch01-b45
          speaker: narrator
          text: >-
            By then, I knew my way around the Ghost's simple medicine chest. I heated water on the cabin stove and laid out everything I needed to clean and dress his wounds. Wolf moved around while I worked. He laughed and chatted as if nothing serious had happened, examining each hurt with a cool, calculating eye.
        - id: ch01-b46
          speaker: narrator
          text: >-
            I had never seen him without his clothes, and his body took my breath away. I had never been a worshipper of flesh. Far from it. Yet I had enough of the artist in me to see the wonder of his form. Its perfect lines fascinated me, and its beauty was terrible.
        - id: ch01-b47
          speaker: narrator
          text: >-
            I thought of the men in the forecastle. Some were powerfully muscled, but there was something wrong with every body. One part was too small and another too large. A twist or bend ruined the balance. Legs were too long or too short. On one man, too much bone and sinew showed, and on another, too little. Only Oofty-Oofty had graceful lines, and to my eye their grace seemed feminine.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Wolf Larsen was entirely masculine, almost like a perfect god. When he moved or lifted his arms, huge muscles sprang and shifted beneath his smooth skin. The bronze coloring stopped at his face. Because of his Scandinavian blood, the rest of him was as fair as the fairest woman's body.
        - id: ch01-b49
          speaker: narrator
          text: >-
            He raised a hand to feel the wound on his head, and I watched his biceps move like a living creature under its white covering. That was the muscle that had nearly crushed my life away. It was the same one I had seen deliver so many deadly blows. I could not take my eyes from him. I stood completely still while a roll of antiseptic cotton unwound from my hand and spilled across the floor.
        - id: ch01-b50
          speaker: narrator
          text: >-
            He noticed. Suddenly, I knew how openly I had been watching him.
        - id: ch01-b51
          speaker: narrator
          text: >-
            God made you well.
        - id: ch01-b52
          speaker: wolf_larsen
          text: >-
            Did he? I've often thought the same thing and wondered why.
        - id: ch01-b53
          speaker: narrator
          text: >-
            There must be a purpose—
        - id: ch01-b54
          speaker: wolf_larsen
          text: >-
            Usefulness. That's what this body was made for. These muscles can grip, tear, and destroy any living thing that comes between me and life. But those other creatures have muscles too. Their bodies are also made to grip and tear and destroy. When they stand between me and life, I grip harder, tear harder, and destroy them first. Purpose doesn't explain it. Usefulness does.
        - id: ch01-b55
          speaker: narrator
          text: >-
            That isn't beautiful.
        - id: ch01-b56
          speaker: wolf_larsen
          text: >-
            You mean life isn't beautiful. Yet you just said I was made well. Look at this.
        - id: ch01-b57
          speaker: narrator
          text: >-
            He set his legs wide and gripped the cabin floor with his toes. Knots, ridges, and great mounds of muscle bunched and twisted beneath his skin.
        - id: ch01-b58
          speaker: wolf_larsen
          text: >-
            Feel them.
        - id: ch01-b59
          speaker: narrator
          text: >-
            They were hard as iron. His whole body had tightened without conscious effort, ready and alert. Muscles softly shifted and took shape over his hips, along his back, and across his shoulders. His arms lifted slightly as their muscles contracted. His fingers crooked until both hands looked like talons. Even his eyes had changed. They watched and measured everything, and the light in them was the light of battle.
        - id: ch01-b60
          speaker: wolf_larsen
          text: >-
            Stability. Balance.
        - id: ch01-b61
          speaker: narrator
          text: >-
            In an instant, he relaxed and let his body settle again.
        - id: ch01-b62
          speaker: wolf_larsen
          text: >-
            My feet grip the ground. My legs hold me up and help me resist. With my arms, hands, teeth, and nails, I fight to kill and to keep from being killed. Purpose? Usefulness is the better word.
        - id: ch01-b63
          speaker: narrator
          text: >-
            I did not argue. For one startling moment, I had seen the whole working machinery of a primitive fighting animal. Every part of him had drawn together for the struggle to kill or avoid being killed. The sight impressed me as strongly as if I had watched the engines of a great battleship or an Atlantic liner at work.
        - id: ch01-b64
          speaker: narrator
          text: >-
            After such a savage fight in the forecastle, I was surprised that most of his injuries were not deep. I took pride in how skillfully I dressed them. He did have several serious wounds, but the rest were heavy bruises and lacerations rather than injuries that threatened his life.
        - id: ch01-b65
          speaker: narrator
          text: >-
            The blow he had taken before falling overboard had opened his scalp for several inches. Following his instructions, I shaved the edges, cleaned the wound, and stitched it closed. His calf was badly torn too, as if a bulldog had mangled it.
        - id: ch01-b66
          speaker: narrator
          text: >-
            Wolf told me that at the very start of the fight, a sailor had sunk his teeth into that calf and held on. Wolf had dragged the man with him all the way to the top of the forecastle ladder. The sailor still would not release his bite. Wolf finally had to kick him loose.
        - id: ch01-b67
          speaker: wolf_larsen
          text: >-
            By the way, Hump, you really are a useful man. As you know, we're short of a mate. From now on, you'll stand watches and earn seventy-five dollars a month. Everyone aboard will address you as Mr. Van Weyden.
        - id: ch01-b68
          speaker: narrator
          text: >-
            But I... I don't know how to navigate.
        - id: ch01-b69
          speaker: wolf_larsen
          text: >-
            You won't need to.
        - id: ch01-b70
          speaker: narrator
          text: >-
            I don't care to sit in such a high position. Life is dangerous enough where I am. I have no experience. Being ordinary has its advantages, you know.
        - id: ch01-b71
          speaker: narrator
          text: >-
            He smiled as if the matter had already been decided.
        - id: ch01-b72
          speaker: narrator
          text: >-
            I won't be mate on this hell-ship!
        - id: ch01-b73
          speaker: narrator
          text: >-
            His face hardened, and a merciless light flashed in his eyes. He walked to the door of his room.
        - id: ch01-b74
          speaker: wolf_larsen
          text: >-
            And now, Mr. Van Weyden, good night.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Good night, Mr. Larsen.
        - id: ch01-b76
          speaker: narrator
          text: >-
            My answer came out weakly.
