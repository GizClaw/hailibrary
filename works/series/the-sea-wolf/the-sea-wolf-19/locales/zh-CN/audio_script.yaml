audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    louis:
      display_name: 路易
      tts:
        delivery: 爽朗健谈，谈到预兆时透出郑重与神秘
        timbre: 浑厚而饱经风霜的成年男声
        pace: 起伏鲜明，兴奋时语流加快
        pitch: 中低音
    rescued_engineer:
      display_name: 获救的轮机员
      tts:
        delivery: 受惊而直率，竭力保持体面
        timbre: 疲惫发颤的成年男声
        pace: 偏慢，惊惧时急促
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十九章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我回到甲板时，“幽灵号”正左舷迎风，紧贴风势航行，从上风追向前面那面熟悉的斜桁帆。那条小艇也在拼命抢风。所有人都留在甲板上。他们知道，利奇和约翰逊一旦被拖回来，准会出事。
        - id: ch01-b02
          speaker: narrator
          text: >-
            船钟刚敲了四声，路易便到船尾接舵。空气湿漉漉的，他连油布衣都穿上了。我问他要变什么天气。
        - id: ch01-b03
          speaker: louis
          text: >-
            闻着这口气，是一阵挺有劲的小风暴，先生。还会泼几滴雨，刚够把咱们的鳃打湿，再多也没有了。
        - id: ch01-b04
          speaker: narrator
          text: >-
            一个大浪把船头推偏了一罗经点。小艇猛地越过艏帆，闯进我们的视线。我望着它，只觉得真不该叫我们看见他们。路易拨了一下舵轮，没有立刻把话说死，口气听来有些含糊。
        - id: ch01-b05
          speaker: louis
          text: >-
            依我看，先生，他们本来也到不了陆地。
        - id: ch01-b06
          speaker: humphrey
          text: 你觉得不行？
        - id: ch01-b07
          speaker: louis
          text: >-
            不行，先生。刚才那阵风，您感觉到了吗？再过一个钟头，这海上连蛋壳都漂不住。咱们正好在这里捞他们，算他们走运。
        - id: ch01-b08
          speaker: narrator
          text: >-
            刚才正是一阵风猛地兜住纵帆船，路易才不得不飞快转舵，免得船头抢进风里。海狼·拉森也从船中部大步走来。他刚同获救的人谈完话，脚下那股猫一样的弹力比平时更明显，两眼亮得逼人。
        - id: ch01-b09
          speaker: wolf_larsen
          text: >-
            三个加油工，一个四等轮机员。练一练，都能当水手，至少也能划艇。那位女士呢？
        - id: ch01-b10
          speaker: narrator
          text: >-
            他一提起她，我心里就像挨了刀尖，忽然一痛。我也说不清为什么，只当这是自己可笑的洁癖。可那痛楚偏偏不肯消失，我又不愿让他看出来，只得耸了耸肩。拉森抿起嘴，吹了一声意味深长的长哨，接着追问她叫什么。
        - id: ch01-b11
          speaker: humphrey
          text: >-
            我不知道。她睡着了，实在累得厉害。我还等着听你的消息呢。那是什么船？
        - id: ch01-b12
          speaker: wolf_larsen
          text: >-
            邮轮，“东京城号”，从旧金山开往横滨。台风把它弄坏了。那条老破船上下都裂开了，跟筛子一样。他们漂了四天。可你连她是谁都不知道，是姑娘、太太，还是寡妇？嗯，嗯。
        - id: ch01-b13
          speaker: narrator
          text: >-
            他打趣似的摇着头，眼里全是笑。我本想问，他会不会把这些遇难者送到横滨。那个问题已经到了舌尖，我却忽然停住了。拉森马上追问，我到底想说什么。我没有把原来的话说出口，而是换了个问题。
        - id: ch01-b14
          speaker: humphrey
          text: 你准备怎么处置利奇和约翰逊？
        - id: ch01-b15
          speaker: wolf_larsen
          text: >-
            说真的，亨普，我也不知道。添上刚才那几个人，我要的船员差不多够了。
        - id: ch01-b16
          speaker: humphrey
          text: >-
            他们也已经逃够了。何不换个办法？把他们接回来，待他们宽厚些。不管他们做过什么，都是让人逼到这一步的。
        - id: ch01-b17
          speaker: wolf_larsen
          text: 是我逼的？
        - id: ch01-b18
          speaker: humphrey
          text: >-
            就是你。海狼·拉森，我也警告你。你要是把那两个可怜人折磨得太狠，我也许会连自己的命都不顾，只想杀了你。
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            好极了！亨普，你真给我长脸！你总算结结实实站起来了，也成了个有主见的人。可惜你从前过得太安逸。不过你正在长进，我也因此更喜欢你。
        - id: ch01-b20
          speaker: narrator
          text: >-
            他忽然收起笑意，声音也变了。他一本正经地问我，是否相信诺言，是否把诺言看成神圣的东西。我说当然相信。
        - id: ch01-b21
          speaker: wolf_larsen
          text: >-
            那我们就订个约。我答应不对利奇动手，你也答应不设法杀我。怎么样？这可不是因为我怕你，不是因为我怕你。
        - id: ch01-b22
          speaker: narrator
          text: >-
            我几乎不敢相信自己的耳朵，不明白这个人身上究竟发生了什么。他不耐烦地问我成交不成交，我答应成交。他随即向我伸出手，我们用力相握。我握得诚心诚意，却敢发誓，他眼里那个嘲弄人的魔鬼分明闪了一下。
        - id: ch01-b23
          speaker: narrator
          text: >-
            我们慢慢穿过艉楼，走到下风一侧。小艇已近在眼前，处境险恶。约翰逊掌舵，利奇一刻不停地往外舀水。“幽灵号”每前进两英尺，他们只能走出一英尺。拉森示意路易稍稍转向下风，大船便从小艇上风不到二十英尺处冲过。船身把风严严实实挡住，斜桁帆空荡荡地拍打起来，小艇也恢复了平衡。两个人见状赶紧换位，可小艇已经失去冲力。我们被一道巨浪高高托起，它却歪斜着跌进深深的浪谷。
        - id: ch01-b24
          speaker: narrator
          text: >-
            利奇和约翰逊仰头望向挤在舷边的伙伴，没有一个人向他们招呼。在同伴眼中，他们已经死了。生者与死者之间那道深渊，就横在彼此面前。
        - id: ch01-b25
          speaker: narrator
          text: >-
            下一刻，小艇升到艉楼对面，我们却正往浪谷里落。约翰逊的脸憔悴不堪。他看着我，我便向他挥手。他也抬手回应，可那动作绝望得像是在告别。利奇只盯着拉森，脸上仍是那副永不罢休的仇恨神色。
        - id: ch01-b26
          speaker: narrator
          text: >-
            小艇转眼落到船尾，斜桁帆又猛然鼓满，脆弱的敞口船身一下斜过去，看着准要翻了。一道白浪在它上方涌起，雪白的浪沫轰然砸下，把它整个吞没。过了一会儿，小艇才从白沫里重新露出来，已经进了半船水。利奇拼命往外舀，约翰逊死死抓住舵桨，脸色苍白，神情焦急。
        - id: ch01-b27
          speaker: narrator
          text: >-
            拉森贴着我的耳朵，发出一声短促的狂笑，随即走到艉楼上风一侧。我一直等他下令让“幽灵号”顶风停住，他却毫无表示，船也沿着原来的航向继续飞驰。路易守着舵轮，脸上一点也不动。船头聚成一团的水手们却忧心忡忡，不住回头看我们。直到小艇缩成海面上的一个黑点，拉森才高声下令，让船转成右舷受风。
        - id: ch01-b28
          speaker: narrator
          text: >-
            我们掉头驶回，却在那只苦苦挣扎的蛋壳上风两英里开外降下外艏三角帆，让纵帆船顶风停住。捕海豹的小艇本来就不善于逆风航行。风大时，它们得守住上风位置，才能顺风回到母船。可在这片狂暴无边的海上，利奇和约翰逊除了“幽灵号”无处可去。他们只得横下心，一段一段抢风靠近。这趟路走得非常慢，嘶吼的碎浪随时会把他们压在下面。我们眼看小艇一次又一次迎着巨大的白浪抬头，又一次次失去冲力，像软木塞一样被抛回去。
        - id: ch01-b29
          speaker: narrator
          text: >-
            约翰逊是个出色的水手，对小艇和对大船一样精通。一个半钟头后，他终于快到我们旁边。最后一段向外斜驶的航程里，他从船尾驶过，打算等下一段折回来时，正好靠上“幽灵号”。拉森望着他们，嘴里低声念叨，像是自言自语，又像真以为那两个人听得见。
        - id: ch01-b30
          speaker: wolf_larsen
          text: >-
            改主意了，是不是？想上船了？好啊，那就只管来吧。舵转到下风，转到底！
        - id: ch01-b31
          speaker: narrator
          text: >-
            最后那句是他冲掌舵的卡纳卡人乌夫蒂—乌夫蒂喊的。路易已经把舵轮交给了他。接下来，拉森的命令一道紧跟一道。纵帆船向下风转去，前帆和主帆的帆脚索也都松开，让船帆吃足顺风。“幽灵号”立刻乘风飞奔。约翰逊冒着翻船的危险放松帆脚索，从我们船尾一百英尺外横穿过去。拉森又笑起来，还抬起胳膊，招呼他们继续跟上。他显然存心拿两个人取乐，要用这堂凶险的课代替一顿毒打。可那条脆弱的小艇时时刻刻都可能被海浪吞掉。
        - id: ch01-b32
          speaker: narrator
          text: >-
            约翰逊马上调正船头，从后面追赶。他根本没有别的路可走。四周处处都是死神。那数不清的巨浪里，早晚会有一道砸在小艇上，从它上面翻过去，再头也不回地滚向前方。我走向船头，准备收起外艏三角帆和支索帆。路易这时凑到我耳边。
        - id: ch01-b33
          speaker: louis
          text: 死亡的恐惧已经攥住他们的心了。
        - id: ch01-b34
          speaker: humphrey
          text: >-
            哦，他过一会儿就会停船，把他们接上来的。他不过想教训他们一下。你难道不这样想？
        - id: ch01-b35
          speaker: louis
          text: >-
            如今我什么也不想，只想着保住老命。事情最后会闹成什么样，我倒很想瞧瞧。旧金山的威士忌把我送进一个漂亮的烂摊子，船尾那个女人又把您送进一个更漂亮的烂摊子。依我看，您就是个十足的大傻瓜。
        - id: ch01-b36
          speaker: narrator
          text: >-
            他说完便转身要走。我知道那番话正中了我的心事，便厉声追问他到底是什么意思。
        - id: ch01-b37
          speaker: louis
          text: >-
            我是什么意思？这还要您来问！要紧的不是我的意思，是那头狼会有什么意思。狼，我说的是那头狼！
        - id: ch01-b38
          speaker: humphrey
          text: 真出了事，你肯站在我这边吗？
        - id: ch01-b39
          speaker: louis
          text: >-
            站在您这边？老胖子路易只站在自己这边，光这样就够我受的了。我告诉您，事情才刚开头，连真正的开头都还没到。
        - id: ch01-b40
          speaker: narrator
          text: >-
            我讥讽他，没想到他竟这么胆小。路易轻蔑地瞪了我一眼，指向船尾那片小小的帆。
        - id: ch01-b41
          speaker: louis
          text: >-
            那个可怜的傻瓜，我都没伸手帮过。您倒觉得，我会为了一个今天以前从没见过的女人，巴不得叫人打破脑袋？
        - id: ch01-b42
          speaker: narrator
          text: >-
            我鄙夷地转身走回艉楼。拉森看见我上来，叫我最好把中桅帆收起来。我顿时松了口气，至少在那两个人的事情上，我又看见了一点希望。他这样做，显然是不想把他们甩得太远。我马上发令，必要的话还没说完，水手们便急不可耐地扑向升降索和收帆索，另一些人已经争着爬上桅杆。拉森把他们这份急切看得清清楚楚，只露出一丝阴沉的笑。
        - id: ch01-b43
          speaker: narrator
          text: >-
            我们还在拉开距离。等小艇落到几英里外，“幽灵号”才停下来。全船都盯着它，连拉森也不例外。可只有他若无其事。路易目不转睛，脸上的忧虑怎么也藏不住。
        - id: ch01-b44
          speaker: narrator
          text: >-
            小艇越来越近，像个活物似的冲过翻腾的碧浪。它爬上一座座脊背高耸的巨浪，被托起，被向前推送，又被猛然抛向半空。有时它完全消失在浪后，转眼又冲进视线，直射天空。看上去，它绝不可能继续浮在这样的海上。可每一次令人目眩的起落，它都硬是熬了过去，把不可能变成了可能。一阵雨飑横扫而过，小艇从漫天飞散的雨水里钻出来，几乎已经到了我们面前。
        - id: ch01-b45
          speaker: wolf_larsen
          text: 舵转到下风，转到底！
        - id: ch01-b46
          speaker: narrator
          text: >-
            拉森亲自扑到舵轮旁，一把转过舵轮。“幽灵号”又蹿了出去，乘风飞奔。此后两个钟头，约翰逊和利奇一直在追。我们停下，又逃走。再停下，再逃走。那一小片帆在船尾苦苦挣扎，一会儿被抛上天，一会儿落进奔涌的浪谷。
        - id: ch01-b47
          speaker: narrator
          text: >-
            小艇离我们只剩四分之一英里时，一阵浓密的雨飑把它遮得无影无踪。它再也没有出现。风很快把空气重新吹净，可动荡的海面上再也找不到那片苦苦挣扎的帆。有那么一瞬，我仿佛看见小艇漆黑的底部在一道破碎的浪峰中闪了一下。即使真看见了，也只有这一下。对约翰逊和利奇来说，为了活下去而受的全部苦难，到这里终于结束了。
        - id: ch01-b48
          speaker: narrator
          text: >-
            水手们仍聚在船中部。没人下舱，没人说话，彼此连一个眼神也不交换。每个人都像被刚才的一幕震呆了。他们陷在沉思里，又不敢确信，只能竭力弄明白究竟发生了什么。拉森没给他们多少时间，立刻让“幽灵号”驶回原定航线。船正开往海豹群，不是横滨港。水手们照命令拉扯绳索，却再也没有先前那股急切。他们低声咒骂，声音闷在嘴边，沉重、空洞，仿佛也失去了生命。猎手们却完全不同。谁也压不住的斯莫克讲了个故事，他们便放声大笑着下了统舱。
        - id: ch01-b49
          speaker: narrator
          text: >-
            我从厨房下风一侧经过时，那名获救的轮机员迎了上来。他脸色雪白，嘴唇直抖。
        - id: ch01-b50
          speaker: rescued_engineer
          text: 上帝啊，先生，这到底是条什么船？
          emotion: fearful
        - id: ch01-b51
          speaker: humphrey
          text: 你有眼睛，已经亲眼看见了。
        - id: ch01-b52
          speaker: narrator
          text: >-
            我答得近乎粗暴，因为自己的心也被痛苦和恐惧塞满。走到拉森面前，我只问了一句，他许下的诺言还算不算。
        - id: ch01-b53
          speaker: wolf_larsen
          text: >-
            我答应你的时候，可没准备把他们接上船。再说，你也得承认，我确实没有碰他们一根手指。
        - id: ch01-b54
          speaker: narrator
          text: 过了一会儿，他笑了起来。
        - id: ch01-b55
          speaker: wolf_larsen
          text: 差得远呢，差得远呢。
        - id: ch01-b56
          speaker: narrator
          text: >-
            我没有回答，也根本说不出话来，脑子里乱成一团。我知道，自己需要时间把一切想清楚。那个女人此刻还睡在空舱里。她已经成了落在我肩上的一份责任，我不能不替她仔细打算。混乱中，只有一个念头还在我心里微弱地闪着，也只有它还算理智。若真想给她一点帮助，我就绝不能仓促行事。
