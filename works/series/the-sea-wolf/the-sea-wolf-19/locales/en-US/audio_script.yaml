audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
    louis:
      display_name: Louis
      tts:
        delivery: jovial and confidential, rushing into ominous excitement
        timbre: round, weathered, and resonant
        pace: lively with rolling rhythms
        pitch: medium-low
    oofty_oofty:
      display_name: Oofty-Oofty
      tts:
        delivery: restrained and watchful
        timbre: smooth and full
        pace: measured
        pitch: medium-low
    rescued_engineer:
      display_name: Rescued Engineer
      tts:
        delivery: shaken and bewildered
        timbre: mature and clear
        pace: halting
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER XIX
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            When I came on deck, the Ghost was close-hauled on the port tack. Ahead, a familiar spritsail was fighting the wind on the same course, and we were rapidly cutting in to windward of it. Every man was on deck. They all knew something would happen when Leach and Johnson were brought aboard.
        - id: ch01-b02
          speaker: narrator
          text: >-
            At four bells, Louis came aft to take the wheel. The air felt damp, and he was already wearing his oilskins.
        - id: ch01-b03
          speaker: narrator
          text: >-
            What sort of weather are we in for?
        - id: ch01-b04
          speaker: louis
          text: >-
            A fresh young gale, sir, by the breath of it. There'll be a splash of rain too, just enough to wet our gills.
        - id: ch01-b05
          speaker: narrator
          text: >-
            It's a pity we spotted them.
        - id: ch01-b06
          speaker: narrator
          text: >-
            A heavy sea threw the Ghost's bow off by a point. For a moment, the little boat leaped past the jibs and into sight. Louis turned the wheel a spoke and took his time answering.
        - id: ch01-b07
          speaker: louis
          text: >-
            I don't believe they'd ever have reached land, sir.
        - id: ch01-b08
          speaker: narrator
          text: >-
            You really think they couldn't?
        - id: ch01-b09
          speaker: louis
          text: >-
            No, sir. Did you feel that?
        - id: ch01-b10
          speaker: narrator
          text: >-
            A sudden puff caught the schooner, and Louis had to spin the wheel up quickly to keep her from turning into the wind.
        - id: ch01-b11
          speaker: louis
          text: >-
            In another hour, an eggshell couldn't stay afloat on this sea. They're lucky we came along to pick them up.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Wolf Larsen strode aft from amidships, where he had been questioning the castaways we had rescued. His step had even more of its catlike spring than usual, and his eyes flashed brightly.
        - id: ch01-b13
          speaker: wolf_larsen
          text: >-
            Three oilers and a fourth engineer. We'll turn them into sailors, or at least boat-pullers. Now then, what about the lady?
        - id: ch01-b14
          speaker: narrator
          text: >-
            The mention of her gave me a sudden pain, sharp as a knife. I could not explain it. I told myself it was only my own foolish delicacy, yet the feeling remained. I answered him with a shrug.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Wolf Larsen pursed his lips and let out a long, questioning whistle.
        - id: ch01-b16
          speaker: wolf_larsen
          text: >-
            Then what's her name?
        - id: ch01-b17
          speaker: narrator
          text: >-
            I don't know. She's asleep. She was exhausted. I've been waiting for you to tell me what happened. What ship did they come from?
        - id: ch01-b18
          speaker: wolf_larsen
          text: >-
            A mail steamer called the City of Tokio. She left San Francisco for Yokohama, then that typhoon disabled her. An old tub like that opened from top to bottom, like a sieve. They drifted for four days. And you still don't know who your lady is? A maid, a wife, or a widow? Well, well.
        - id: ch01-b19
          speaker: narrator
          text: >-
            He shook his head as if teasing me, his eyes full of laughter.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Are you going to...
        - id: ch01-b21
          speaker: narrator
          text: >-
            I nearly asked whether he would take the castaways to Yokohama.
        - id: ch01-b22
          speaker: wolf_larsen
          text: >-
            Am I going to what?
        - id: ch01-b23
          speaker: narrator
          text: >-
            What are you planning to do with Leach and Johnson?
        - id: ch01-b24
          speaker: wolf_larsen
          text: >-
            Honestly, Hump, I haven't decided. With these new men, I have about as much crew as I need.
        - id: ch01-b25
          speaker: narrator
          text: >-
            And they've had enough of trying to escape. Why not treat them differently now? Bring them aboard and be gentle with them. Whatever they've done, you drove them to it.
        - id: ch01-b26
          speaker: wolf_larsen
          text: >-
            I drove them to it?
        - id: ch01-b27
          speaker: narrator
          text: >-
            You did. And I'm warning you, Wolf Larsen. If you go too far in tormenting those poor men, I may care less about saving my own life than I do about killing you.
        - id: ch01-b28
          speaker: wolf_larsen
          text: >-
            Bravo! You make me proud, Hump. You've finally found your legs. You're becoming a real individual. Easy living did you no favors, but now you're growing, and I like you better for it.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Then his face and voice turned serious.
        - id: ch01-b30
          speaker: wolf_larsen
          text: >-
            Do you believe a promise is sacred?
        - id: ch01-b31
          speaker: narrator
          text: >-
            Of course I do.
        - id: ch01-b32
          speaker: wolf_larsen
          text: >-
            Then let's make a bargain. I'll promise not to lay my hands on Leach. In return, you promise not to try to kill me. And no, it isn't because I'm afraid of you.
        - id: ch01-b33
          speaker: narrator
          text: >-
            I could scarcely believe what I was hearing. What had come over him?
        - id: ch01-b34
          speaker: wolf_larsen
          text: >-
            Well? Do we have a bargain?
        - id: ch01-b35
          speaker: narrator
          text: >-
            We do.
        - id: ch01-b36
          speaker: narrator
          text: >-
            He held out his hand, and I shook it warmly. Even then, I could have sworn that a mocking devil flashed for one instant in his eyes.
        - id: ch01-b37
          speaker: narrator
          text: >-
            We crossed the poop together and stopped on the lee side. The boat was close now and in desperate trouble. Johnson steered while Leach bailed. For every foot they gained, the Ghost gained two. Wolf motioned for Louis to bear away a little, and we rushed alongside, less than twenty feet to windward.
        - id: ch01-b38
          speaker: narrator
          text: >-
            The Ghost blocked the wind from their sail. It flapped empty, and the boat settled onto an even keel. Leach and Johnson hurried to change places. The boat lost speed, then we rose on a great swell while they tipped down into the trough.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Leach and Johnson looked up at their shipmates lining the rail. No one called a greeting. In those sailors' eyes, the two men were already dead. A gulf lay between them, separating the living from the dead.
        - id: ch01-b40
          speaker: narrator
          text: >-
            An instant later, they came opposite the poop. We were sinking into the trough as they rose on the swell. Johnson looked straight at me. His face was worn and haggard. I waved, and he waved back without hope, as if he were saying goodbye. Leach never looked my way. His eyes stayed on Wolf Larsen, and his old, unyielding hatred still twisted his face.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Then the boat slipped astern. Wind snapped into the spritsail and pushed the frail craft so far over that it seemed sure to capsize. A white-crested sea rose above it and burst across it in a cloud of foam. The boat came out half full of water. Leach threw the water overboard while Johnson clung to the steering oar, pale and anxious.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Wolf Larsen gave a sharp bark of laughter beside my ear, then walked away to the weather side of the poop. I waited for his order to heave to. No order came, and the Ghost sailed on. Louis remained calm at the wheel, but the sailors forward gathered together and kept turning troubled faces toward us.
        - id: ch01-b43
          speaker: narrator
          text: >-
            The Ghost raced ahead until the little boat had shrunk to a speck. At last, Wolf Larsen called his order, and we came about onto the starboard tack.
        - id: ch01-b44
          speaker: narrator
          text: >-
            We sailed back and stopped more than two miles to windward of them. The flying jib came down, and the schooner hove to. Sealing boats are not built to beat against the wind. They survive by staying to windward, ready to run before a rising breeze and return to their schooner. But Leach and Johnson had no shelter anywhere in that wild waste except the Ghost. They turned into the wind and began the long struggle toward us.
        - id: ch01-b45
          speaker: narrator
          text: >-
            The heavy sea made every foot hard won. At any instant, a hissing breaker might bury them. Again and again, beyond counting, we watched their boat turn into a towering whitecap, lose its speed, and fly backward like a cork.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Johnson was an excellent seaman. He understood small boats as well as ships. After an hour and a half, he had worked nearly alongside us. He was passing beyond our stern on his last outward leg, ready to reach us when he came back.
        - id: ch01-b47
          speaker: wolf_larsen
          text: >-
            So you've changed your minds. You want to come aboard now, do you? Then keep coming.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Wolf spoke partly to himself and partly to the men, though they could not hear him.
        - id: ch01-b49
          speaker: wolf_larsen
          text: >-
            Hard up with the helm!
        - id: ch01-b50
          speaker: narrator
          text: >-
            Oofty-Oofty had taken Louis's place at the wheel. One order followed another. As the schooner turned away, the fore and main sheets were let out for a fair wind. We were soon racing before it.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Johnson eased his sheet in terrible danger and cut across our wake only a hundred feet away. Wolf Larsen laughed again and waved for them to follow. He clearly meant to play with them. Perhaps this was to be their lesson instead of a beating. But it was a deadly lesson, for the small boat could be overwhelmed at any moment.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Johnson turned downwind at once and followed us. He had no other choice. Death waited on every side. Sooner or later, one of those giant seas would fall on the boat, roll across it, and keep going.
        - id: ch01-b53
          speaker: louis
          text: >-
            It's the fear of death that's driving them.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Louis murmured in my ear as I went forward to have the flying jib and staysail taken in.
        - id: ch01-b55
          speaker: narrator
          text: >-
            He'll stop soon and take them aboard. He's only teaching them a lesson.
        - id: ch01-b56
          speaker: narrator
          text: >-
            I tried to sound cheerful. Louis studied me with a knowing look.
        - id: ch01-b57
          speaker: louis
          text: >-
            Is that what you think?
        - id: ch01-b58
          speaker: narrator
          text: >-
            Of course. Don't you?
        - id: ch01-b59
          speaker: louis
          text: >-
            These days, I think only of saving my own skin. And I keep wondering how all this will end. That San Francisco whisky landed me in a fine mess, and that woman aft has landed you in a finer one. Ah, I know you for a blithering fool.
        - id: ch01-b60
          speaker: narrator
          text: >-
            What are you talking about?
        - id: ch01-b61
          speaker: narrator
          text: >-
            I demanded an answer, for Louis had delivered his warning and was turning away.
        - id: ch01-b62
          speaker: louis
          text: >-
            You have to ask me? It isn't what I mean that matters. It's what the Wolf will mean. The Wolf, I tell you. The Wolf!
        - id: ch01-b63
          speaker: narrator
          text: >-
            His warning had spoken my own fear, and I answered without thinking.
        - id: ch01-b64
          speaker: narrator
          text: >-
            If trouble comes, will you help me?
        - id: ch01-b65
          speaker: louis
          text: >-
            Help you? Old fat Louis helps himself, and that will be trouble enough. This is only the start of things, I tell you. The very start.
        - id: ch01-b66
          speaker: narrator
          text: >-
            I never thought you were such a coward.
        - id: ch01-b67
          speaker: narrator
          text: >-
            Louis gave me a contemptuous stare.
        - id: ch01-b68
          speaker: louis
          text: >-
            I never lifted a hand for that poor fool back there. Do you think I'm eager to have my head broken over a woman I've never even seen before today?
        - id: ch01-b69
          speaker: narrator
          text: >-
            He pointed astern at the tiny sail. I turned away from him in disgust and went aft.
        - id: ch01-b70
          speaker: wolf_larsen
          text: >-
            You'd better take in those topsails, Mr. Van Weyden.
        - id: ch01-b71
          speaker: narrator
          text: >-
            His order relieved me, at least for Leach and Johnson. It seemed clear that he did not mean to leave them too far behind. Hope returned, and I gave the necessary orders at once.
        - id: ch01-b72
          speaker: narrator
          text: >-
            Before the words had fully left my mouth, eager men sprang for the halyards and downhauls while others raced aloft. Wolf Larsen saw their eagerness and smiled grimly.
        - id: ch01-b73
          speaker: narrator
          text: >-
            Even with less sail, our lead grew. When the boat was several miles astern, we hove to and waited. Every eye watched it approach, including Wolf Larsen's. Only he seemed perfectly at ease. Louis stared hard at the boat, and his face showed a worry he could not quite hide.
        - id: ch01-b74
          speaker: narrator
          text: >-
            Closer and closer it came, hurling through the churning green water like a living thing. It climbed the huge-backed breakers, pitched across their tops, and vanished behind them, only to rush into view and shoot upward again. It seemed impossible for the boat to survive, yet every wild rise and fall proved that it still could.
        - id: ch01-b75
          speaker: narrator
          text: >-
            A squall of rain swept over it. The boat burst from the flying spray almost alongside us.
        - id: ch01-b76
          speaker: wolf_larsen
          text: >-
            Hard up, there!
        - id: ch01-b77
          speaker: narrator
          text: >-
            Wolf Larsen sprang to the wheel himself and spun it around. Once more, the Ghost leaped away and raced before the wind. For two hours, Johnson and Leach chased us. We stopped and fled, stopped and fled. Behind us, their patch of sail kept tossing into the sky and dropping into the racing valleys.
        - id: ch01-b78
          speaker: narrator
          text: >-
            They were a quarter of a mile away when a thick wall of rain hid them. They never came out of it. The wind swept the air clear, but no sail appeared on the broken surface. For one instant, I thought I saw the black bottom of the boat in the crest of a breaking wave. If I saw anything at all, that was all. For Johnson and Leach, the struggle to exist was over.
        - id: ch01-b79
          speaker: narrator
          text: >-
            The sailors stayed together amidships. Not one went below, and not one spoke. They did not even look at one another. Each man seemed stunned, thinking deeply and trying to understand what he had just witnessed.
        - id: ch01-b80
          speaker: narrator
          text: >-
            Wolf Larsen gave them little time. He immediately put the Ghost back on her course, a course for the seal herd, not Yokohama harbor. The men no longer hurried as they hauled the lines. I heard curses among them, but the words died on their lips, heavy and lifeless. The hunters felt nothing of the kind. Smoke, who could never be silenced, told them a story, and they went down into the steerage roaring with laughter.
        - id: ch01-b81
          speaker: narrator
          text: >-
            On my way aft, I passed the lee side of the galley. The engineer we had rescued came up to me. His face was white, and his lips trembled.
        - id: ch01-b82
          speaker: rescued_engineer
          emotion: fearful
          text: >-
            Good God, sir! What kind of ship is this?
        - id: ch01-b83
          speaker: narrator
          text: >-
            You have eyes. You've seen for yourself.
        - id: ch01-b84
          speaker: narrator
          text: >-
            My answer was almost cruel, because my own heart was full of pain and fear.
        - id: ch01-b85
          speaker: narrator
          text: >-
            I turned to Wolf Larsen. What about your promise?
        - id: ch01-b86
          speaker: wolf_larsen
          text: >-
            When I made that promise, I wasn't planning to bring them aboard. Besides, you must admit that I never laid a hand on them.
        - id: ch01-b87
          speaker: wolf_larsen
          text: >-
            Far from it. Very far from it.
        - id: ch01-b88
          speaker: narrator
          text: >-
            He laughed. I could not answer. My thoughts were too tangled for speech, and I knew I needed time to think.
        - id: ch01-b89
          speaker: narrator
          text: >-
            The woman was still asleep in the spare cabin. She was now my responsibility, and I had to consider what that meant. Only one clear thought remained. If I hoped to help her at all, I must do nothing in haste.
