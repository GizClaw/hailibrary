audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    mugridge:
      display_name: Thomas Mugridge
      tts:
        delivery: sneering, officious, and quick to bully
        timbre: nasal and wiry
        pace: brisk with sharp bursts
        pitch: medium-high
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER V
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            My first night in the hunters' steerage was also my last. The next day, Wolf Larsen drove the new mate, Johansen, out of the cabin and sent him to sleep among the hunters. I was given the tiny cabin stateroom that had already held two men on the voyage's first day. The hunters soon learned why and grumbled about it. Each night, Johansen lived through his day again in his sleep. He talked without stopping, shouted, and roared out orders. Wolf Larsen had endured enough, so now the hunters had to endure him instead.
        - id: ch01-b02
          speaker: narrator
          text: >-
            After a night without sleep, I rose weak and in agony and limped into my second day aboard the Ghost. Thomas Mugridge dragged me out at half past five with all the cruelty Bill Sykes might have shown his dog. But someone repaid that cruelty, and generously. Mugridge made a useless racket, though I had been awake all night. A heavy shoe suddenly flew through the half-dark steerage and struck him. He gave a sharp howl, then meekly begged everyone's pardon. Later, in the galley, I saw that his ear was bruised and swollen. It never quite regained its proper shape. The sailors called it a cauliflower ear.
        - id: ch01-b03
          speaker: narrator
          text: >-
            That day brought one misery after another. The night before, I had taken my dry clothes down from the galley. Now I changed out of the cook's things and into my own. Then I looked for my purse. I remembered exactly what it had held: a little change and one hundred eighty-five dollars in gold and paper. I found the purse, but only the small silver remained. Someone had taken everything else.
        - id: ch01-b04
          speaker: narrator
          text: >-
            When I went on deck to begin my galley work, I spoke to the cook. I expected an ugly answer. I did not expect the furious speech he gave me. A cruel light came into his eyes, and he snarled.
        - id: ch01-b05
          speaker: mugridge
          emotion: angry
          text: >-
            Listen here, Hump. Do you want me to smash your nose? If you think I'm a thief, you'd better keep it to yourself, or I'll show you how badly mistaken you are. This is your gratitude, is it? You come here, a poor miserable bit of human rubbish, and I take you into my galley and treat you handsome. And this is what I get! Next time you can go to hell. Maybe I'll give you a beating right now.
        - id: ch01-b06
          speaker: narrator
          text: >-
            He raised his fists and came at me. I am ashamed to say that I shrank from the blow and ran through the galley door. But what else could I do? Nothing ruled that brutal ship except force. Moral persuasion meant nothing there. Picture a man of ordinary height, slender, with weak muscles that had never been developed. I had lived a quiet, peaceful life and knew nothing of violence. Why should such a man stand against these human beasts? It made no more sense than standing before an enraged bull.
        - id: ch01-b07
          speaker: narrator
          text: >-
            That was how I reasoned at the time. I needed to defend myself in my own mind and quiet my conscience. Yet the argument did not satisfy me. Even now, I cannot look back and feel entirely cleared of shame. The situation went beyond any neat rule for how a man should act. It demanded something more than reason's cold answer. By formal logic, I had done nothing shameful. Still, when I remember it, shame rises in me. My pride tells me that my manhood was somehow stained and dishonored.
        - id: ch01-b08
          speaker: narrator
          text: >-
            None of that changed what happened next. Running from the galley sent a terrible pain through my knee, and I collapsed at the break of the poop. The Cockney had not followed me. I could hear him jeering from the galley.
        - id: ch01-b09
          speaker: mugridge
          text: >-
            Look at him run! Look at him go, even with that bad leg! Come back, you poor little mother's darling. I won't hit you. Oh no, I won't.
        - id: ch01-b10
          speaker: narrator
          text: >-
            I returned and went on working. For the moment, that ended the matter, though it would lead to more later. I set the breakfast table in the cabin and served the hunters and officers at seven. The storm had broken during the night, but the sea was still enormous and a hard wind kept blowing. During the early watches, the crew had raised more sail. The Ghost now raced ahead under everything but her two topsails and flying jib, and those three sails were to go up as soon as breakfast ended.
        - id: ch01-b11
          speaker: narrator
          text: >-
            From the men's talk, I learned Wolf Larsen meant to use every bit of the storm. It was driving him southwest, toward the region where he expected to meet the northeast trade winds. He hoped those steady winds would carry the Ghost through most of her run to Japan, curving south into the tropics and then north again near the Asian coast.
        - id: ch01-b12
          speaker: narrator
          text: >-
            After breakfast came another miserable experience. Once the dishes were washed, I cleaned the cabin stove and carried the ashes onto the deck. Wolf Larsen and Henderson stood near the wheel, deep in conversation, while the sailor Johnson steered. As I headed toward the weather side, Johnson jerked his head. I took it for a friendly good morning. He was really warning me to throw the ashes over the lee side.
        - id: ch01-b13
          speaker: narrator
          text: >-
            I had no idea I was making a mistake. I walked past Wolf Larsen and Henderson and emptied the ashes to windward. The wind hurled them straight back. They covered me, Henderson, and Wolf Larsen. In the next instant, Wolf Larsen kicked me as violently as a man might kick a dog. I had never imagined a kick could hurt so much. I staggered away and leaned against the cabin, nearly fainting. The whole deck swam before my eyes, and sickness rose in me. It became too powerful to resist, and I barely managed to crawl to the ship's side in time.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Wolf Larsen did nothing more to me. He brushed the ashes from his clothes and calmly returned to his conversation with Henderson. Johansen had watched the whole affair from the break of the poop. He sent two sailors aft to clean up the mess I had made on deck.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Later that morning, I found something entirely different. The cook sent me into Wolf Larsen's stateroom to put it in order and make the bed. Near the head of the bunk, a rack of books stood against the wall. I looked along the shelves, and the names astonished me. There were Shakespeare, Tennyson, Poe, and De Quincey. Beside them stood works of science by men like Tyndall, Proctor, and Darwin. Astronomy and physics had their place too. I found Bulfinch's Age of Fable, Shaw's History of English and American Literature, and both large volumes of Johnson's Natural History. There were several grammars, including books by Metcalf and by Reed and Kellogg. The sight of The Dean's English even made me smile.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Nothing I had seen in Wolf Larsen matched those books, and I wondered whether he could truly read them. Then, as I made the bed, I found a complete Cambridge edition of Browning between the blankets. It seemed to have fallen there when he went to sleep. The book lay open at In a Balcony, with several passages marked in pencil. When the ship lurched and the volume slipped from my hand, a sheet of paper fell out. Geometrical diagrams and calculations covered it.
        - id: ch01-b17
          speaker: narrator
          text: >-
            This terrible man was plainly no ignorant brute, whatever his cruelty suggested. He became a mystery to me at once. Either side of his nature made perfect sense alone. Put them together, and I could not understand him. I had already noticed how well he spoke, apart from an occasional small mistake. With the sailors and hunters, his speech sometimes bristled with errors because he used their rough everyday language. But in the few words he had spoken to me, his English had been clear and correct.
        - id: ch01-b18
          speaker: narrator
          text: >-
            That glimpse of another Wolf Larsen must have made me bolder. I decided to tell him about my stolen money. A little later, I found him pacing the poop alone.
        - id: ch01-b19
          speaker: narrator
          text: >-
            I've been robbed.
        - id: ch01-b20
          speaker: wolf_larsen
          text: >-
            You forgot to call me sir.
        - id: ch01-b21
          speaker: narrator
          text: >-
            I've been robbed, sir.
        - id: ch01-b22
          speaker: wolf_larsen
          text: >-
            How did that happen?
        - id: ch01-b23
          speaker: narrator
          text: >-
            I explained everything. My clothes had been left to dry in the galley, and later, when I brought up the missing money, the cook had nearly beaten me. Wolf Larsen smiled as he listened.
        - id: ch01-b24
          speaker: wolf_larsen
          text: >-
            Pickings. Cooky's pickings. Isn't your miserable life worth that much? Think of it as a lesson. In time, you may learn to guard your own money. Until now, I suppose your lawyer or business agent has done that for you.
        - id: ch01-b25
          speaker: narrator
          text: >-
            The quiet sneer in his words was unmistakable, but I pressed him.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Then how am I supposed to get it back?
        - id: ch01-b27
          speaker: wolf_larsen
          text: >-
            That's your problem. You have no lawyer or agent now, so you'll have to rely on yourself. The next time you get a dollar, hold on to it. A man who leaves money lying around deserves to lose it. And you've committed a sin. You had no right to tempt another human being. You tempted Cooky, and he fell. Now you've put his immortal soul in danger. Tell me, do you believe in an immortal soul?
        - id: ch01-b28
          speaker: narrator
          text: >-
            His eyelids lifted lazily as he asked. For a moment, I felt as if some great depth had opened before me and I was looking into his soul. But that was an illusion. However deep the glimpse seemed, I am convinced that no one ever truly saw into Wolf Larsen's soul, or saw it at all. I would learn that it was a very lonely soul. It never dropped its mask, though at rare moments it played at doing so.
        - id: ch01-b29
          speaker: narrator
          text: >-
            I can see immortality in your eyes.
        - id: ch01-b30
          speaker: narrator
          text: >-
            This time I left off the word sir. I thought our conversation had become intimate enough to risk it. He did not react.
        - id: ch01-b31
          speaker: wolf_larsen
          text: >-
            Then you see something alive. But being alive does not mean it must live forever.
        - id: ch01-b32
          speaker: narrator
          text: >-
            I see more than that.
        - id: ch01-b33
          speaker: wolf_larsen
          text: >-
            Then you see consciousness. You see life knowing that it is alive. But you still see nothing beyond that, nothing that proves life has no end.
        - id: ch01-b34
          speaker: narrator
          text: >-
            His thought was remarkably clear, and he expressed it just as clearly. He had been studying me with curiosity. Now he turned his head and looked across the dull gray sea to windward. A bleak look entered his eyes, while the lines of his mouth grew severe and hard. He was plainly in a dark, pessimistic mood. Suddenly, he turned back to me and demanded an answer.
        - id: ch01-b35
          speaker: wolf_larsen
          text: >-
            Then what is the purpose? If I am immortal, why am I immortal?
        - id: ch01-b36
          speaker: narrator
          text: >-
            I stopped. How could I explain my idealism to such a man? What I felt was like music heard in sleep. It convinced me, but words could not contain it.
        - id: ch01-b37
          speaker: narrator
          text: >-
            What do you believe, then?
        - id: ch01-b38
          speaker: wolf_larsen
          text: >-
            I believe life is a mess. It is like yeast, a ferment. It moves for a minute, an hour, a year, or a hundred years, and then it stops. The big eat the little so they can keep moving. The strong eat the weak so they can keep their strength. The lucky eat the most and move the longest. That is all. What do you make of those men there?
        - id: ch01-b39
          speaker: narrator
          text: >-
            With an impatient sweep of his arm, he pointed toward several sailors working with ropes amidships.
        - id: ch01-b40
          speaker: wolf_larsen
          text: >-
            They move, and so does a jellyfish. They move so they can eat, and they eat so they can keep moving. There it is. They live for their bellies, and their bellies exist to keep them alive. Around and around it goes, but it leads nowhere. In the end, they stop. They do not move again. They are dead.
        - id: ch01-b41
          speaker: narrator
          text: >-
            But they have dreams. They have bright, shining dreams.
        - id: ch01-b42
          speaker: wolf_larsen
          text: >-
            Dreams of food.
        - id: ch01-b43
          speaker: narrator
          text: >-
            And they dream of more than food.
        - id: ch01-b44
          speaker: wolf_larsen
          text: >-
            Food. They dream of a bigger appetite and better luck in filling it.
        - id: ch01-b45
          speaker: narrator
          text: >-
            His voice was harsh and completely serious.
        - id: ch01-b46
          speaker: wolf_larsen
          text: >-
            Look at them. They dream of lucky voyages that bring more money. They dream of becoming mates of ships or finding fortunes. In the end, it all means getting a better chance to feed upon their fellow men. They want every night to themselves, good meals, and someone else to do the dirty work. You and I are just like them. There is no real difference between us. We have only eaten more, and eaten better.
        - id: ch01-b47
          speaker: wolf_larsen
          text: >-
            I am feeding on them now, and on you too. But before this, you fed better than I did. You slept in soft beds, wore fine clothes, and ate good meals. Who made those beds? Who made the clothes and the meals? You did not. You never made anything through the sweat of your own body. You live on an income your father earned, and other people do the making for you.
        - id: ch01-b48
          speaker: wolf_larsen
          text: >-
            You are like a frigate bird diving upon boobies and stealing the fish they caught. You belong to a group of men who created what they call a government. That group has made itself master over all the other men. You eat the food those men obtain and wish they could eat themselves. You wear the warm clothes they made. They shiver in rags and come asking you for work, or they ask the lawyer or business agent who handles your money.
        - id: ch01-b49
          speaker: narrator
          text: >-
            But that has nothing to do with the question!
        - id: ch01-b50
          speaker: narrator
          text: >-
            I cried out, but his answer came at once. He spoke faster now, and his eyes flashed.
        - id: ch01-b51
          speaker: wolf_larsen
          text: >-
            It has everything to do with it. This is greed, and this is life. What use or sense is there in making greed immortal? Where does it lead? What is it all for? You have produced no food yourself. Yet the food you ate or wasted could have kept twenty starving people alive. Those poor souls helped make the food but never got to eat it. So what immortal purpose did you serve? What purpose did they serve?
        - id: ch01-b52
          speaker: wolf_larsen
          text: >-
            Now consider you and me. What becomes of your precious immortality when your life runs against mine? You want to return to land because that is where your kind of greed does well. I happen to want you aboard this ship, where my kind does well, and I mean to keep you here. I have the power to make you or break you. You might die today, this week, or next month. I could kill you now with one blow of my fist because you are such a miserable weakling.
        - id: ch01-b53
          speaker: wolf_larsen
          text: >-
            If we are immortal, why should any of this happen? A lifetime of greed like yours and mine hardly seems fit for immortal beings. So again, what is it all about? Why have I kept you here? Answer me.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Because you're stronger.
        - id: ch01-b55
          speaker: narrator
          text: >-
            I barely managed to force out the words, but he rushed straight into another question.
        - id: ch01-b56
          speaker: wolf_larsen
          text: >-
            But why am I stronger? Because I am a bigger piece of the ferment than you are? Don't you see it? Don't you see?
        - id: ch01-b57
          speaker: narrator
          text: >-
            But it is so hopeless.
        - id: ch01-b58
          speaker: wolf_larsen
          text: >-
            I agree. Then why move at all, when movement is life? If we did not move, if we were not part of the yeast, there would be no hopelessness. But here is the answer. We want to live and move even when we have no reason to do either. That is simply the nature of life. Life wants to live and move. If it did not have that impulse, life would be dead.
        - id: ch01-b59
          speaker: wolf_larsen
          text: >-
            The life inside you is what makes you dream of immortality. It is alive, and it wants to stay alive forever. Bah! An eternity of greed!
        - id: ch01-b60
          speaker: narrator
          text: >-
            He spun around and strode forward. At the break of the poop, he stopped and called me over.
        - id: ch01-b61
          speaker: wolf_larsen
          text: >-
            By the way, how much did Cooky take from you?
        - id: ch01-b62
          speaker: narrator
          text: >-
            One hundred eighty-five dollars, sir.
        - id: ch01-b63
          speaker: narrator
          text: >-
            He nodded. A moment later, as I started down the companion stairs to set the dinner table, I heard him loudly cursing at some men amidships.
