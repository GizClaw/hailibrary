audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    mugridge:
      display_name: 托马斯·马格里奇
      tts:
        delivery: 油滑谄媚，粗俗话里带着讨好
        timbre: 尖细黏腻的成年男声
        pace: 轻快而连珠炮般
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第五章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我在猎手统舱里只睡了那一夜。第二天，拉森把新任大副约翰森赶出船尾住舱，叫他以后和猎手们一起睡。我则搬进那间小小的单人舱。航程才开始一天，那间舱房竟已经换了两位主人。猎手们很快便听说了缘故，一个个牢骚满腹。原来约翰森睡着以后，每晚都要把白天的事重新经历一遍。他会不停说话、叫喊，还会扯开嗓子发布命令。拉森忍无可忍，索性把这桩麻烦推给了猎手。
        - id: ch01-b02
          speaker: narrator
          text: >-
            我彻夜未眠，第二天起来时浑身虚弱，疼痛难忍，只能拖着瘸腿继续熬。五点半，马格里奇把我轰了起来，活像比尔·赛克斯赶他的狗。不过，他这回的蛮横很快连本带利地还到了自己身上。他闹出的声音吵醒了一名猎手。昏暗中，一只沉重的鞋呼啸着飞来。马格里奇尖叫一声，随即低声下气地向所有人赔罪。后来我看见他的耳朵又青又肿，从此再没有完全恢复原样。水手们管它叫“花椰菜耳朵”。
        - id: ch01-b03
          speaker: narrator
          text: >-
            那一天，苦事接连不断。头天夜里，我已经取回烘干的衣服，起床后便脱掉厨子的衣裳，换回了自己的。我接着去找钱袋。袋里原有一些零钱，还有一百八十五美元的金币和纸钞，这一点我记得很清楚。钱袋还在，里头却只剩几枚小银币，其余的钱全不见了。我上甲板去厨房干活，便向厨子问起。原以为他最多给我几句难听话，没想到他立刻气势汹汹地骂了起来。
        - id: ch01-b04
          speaker: mugridge
          text: >-
            听着，驼背！你是不是想挨一拳，把鼻子揍扁？你觉得我是贼，就给我憋在心里。再敢说出来，我会让你知道自己错得有多离谱！这就是你报答我的法子吗？你这个可怜巴巴的人渣跑来，我让你进厨房，还好好待你，结果就换来这个！下回你只管滚去见鬼。就算现在，我也很想狠狠收拾你一顿！
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: >-
            他举起双拳，朝我逼来。说来羞耻，我怕那拳头落下来，转身便逃出了厨房。可我还能怎么办？在这艘禽兽之船上，管用的只有蛮力，根本没人听得懂道理。想想我这样一个人吧。身材平常，体格瘦弱，肌肉没有力量，也从没锻炼过。我一直过着安静平和的生活，完全不习惯暴力。难道还能站在那里，和这些人形野兽硬拼吗？那就跟站在暴怒的公牛面前一样毫无道理。
        - id: ch01-b06
          speaker: narrator
          text: >-
            当时我就是这样为自己开脱，想让良心安稳下来。可这些理由并不能真正说服我。直到今天，当我以一个男人的尊严回望往事，仍无法认定自己全无过错。那种处境确实超出了理智能规定的行为准则，仅靠冷静判断也不够。照严格的逻辑来说，我没有任何可羞耻的地方。可每次回想起来，羞耻还是会从心里升起。我珍惜自己的男子气概，却总觉得它莫名受了玷污。
        - id: ch01-b07
          speaker: narrator
          text: >-
            不过，这些都不是眼前要紧的事。我逃得太急，膝盖疼得像被撕开一样。跑到艉楼前端，我再也撑不住，瘫倒在那里。那个伦敦佬并没有追来，只在厨房里冲我叫嚷。
        - id: ch01-b08
          speaker: mugridge
          text: >-
            瞧他跑得多快！拖着一条瘸腿还跑得这么快！回来呀，妈妈的小宝贝儿。我不会揍你的，真的不会！
        - id: ch01-b09
          speaker: narrator
          text: >-
            我到底还是回去继续干活。这场风波暂时结束了，不过后来还有下文。我在住舱摆好早餐桌，七点钟伺候猎手和船上的官员。风暴显然已在夜里过去，可海面依旧涌着巨浪，风也刮得很强。夜里值班的船员已经加挂了不少帆。除了两面中桅帆和最前方的三角帆，其余帆全升了起来，“幽灵号”正一路飞驰。我听他们说，吃过早餐就要把剩下三面帆也挂上。
        - id: ch01-b10
          speaker: narrator
          text: >-
            拉森急着借足这场风暴的力量。风把船推向西南方，他料定在那里可以赶上东北信风。他想借这股稳定的风完成驶往日本的大半航程，先朝南绕进热带，等接近亚洲海岸再转向北方。
        - id: ch01-b11
          speaker: narrator
          text: >-
            早餐后，我又吃了一次苦头。餐具洗完，我清理住舱里的炉子，把炉灰端上甲板。拉森和亨德森站在舵轮附近，正谈得专心。掌舵的水手约翰逊忽然朝我偏了偏头。我以为他认出了我，在向我问早安。其实他是要提醒我，炉灰得从下风一侧倒掉。我一点也没明白，径直从拉森和亨德森身边走过，把灰泼向迎风舷。
        - id: ch01-b12
          speaker: narrator
          text: >-
            风立刻把灰卷了回来，撒了我一身，也扑了他们满身。下一刻，拉森像踢野狗一样狠狠踢了我一脚。我从不知道一脚会痛成这样。我踉跄着退开，半昏半醒地靠住住舱外壁。眼前不停旋转，胃里翻江倒海，我只能勉强爬到船舷旁。拉森却没再理我。他掸掉衣服上的灰，又接着和亨德森谈话。约翰森从艉楼前端看见了经过，叫两名水手过来收拾。
        - id: ch01-b13
          speaker: narrator
          text: >-
            上午晚些时候，我却受到了另一种惊动。依照厨子的吩咐，我去收拾拉森的住舱，替他整理床铺。铺位床头靠墙摆着一只书架，里面塞满了书。我扫过那些书脊，吃惊地看见莎士比亚、丁尼生、坡和德·昆西的名字。架上也有科学著作，作者包括廷德尔、普罗克特和达尔文，内容涉及天文学和物理学。我还认出了布尔芬奇的《神话时代》、肖的《英美文学史》，以及两大卷约翰逊的《自然史》。那里甚至有好几本语法书，有梅特卡夫的，也有里德和凯洛格合著的。看到《院长的英语》时，我忍不住笑了。
        - id: ch01-b14
          speaker: narrator
          text: >-
            我怎么也无法把这些书和眼前这个人放在一起，甚至怀疑他到底读不读得懂。可整理床铺时，我在毛毯间发现了一部剑桥版《勃朗宁全集》，大概是他睡着时随手掉下的。书翻在《阳台上》那一篇，好几处文字用铅笔画了线。船身一晃，书从我手里落下，一张纸也从书页间飘出来。那上面潦草地画满几何图形，还写着各式计算。
        - id: ch01-b15
          speaker: narrator
          text: >-
            这就很清楚了。拉森虽然残暴得可怕，却绝不是我原以为的无知莽夫。他顿时成了一个谜。若把他性情里的两面分开来看，哪一面都容易理解，可两面偏偏长在同一个人身上，便叫人摸不透。我早已注意到，他的言辞相当出色，只偶尔犯一点小错。和水手、猎手闲谈时，他的话有时错误百出，那是因为用了他们的土话。可他对我说过的几句话，一直清楚又准确。
        - id: ch01-b16
          speaker: narrator
          text: >-
            窥见了他的另一面，我大概也多了几分胆量，决定向他谈谈丢钱的事。过了一会儿，我看见他独自在艉楼上来回踱步，便走了过去。
        - id: ch01-b17
          speaker: humphrey
          text: >-
            我的钱让人偷了。
        - id: ch01-b18
          speaker: wolf_larsen
          text: >-
            别忘了说“先生”。
        - id: ch01-b19
          speaker: humphrey
          text: >-
            先生，我的钱让人偷了。
        - id: ch01-b20
          speaker: wolf_larsen
          text: >-
            怎么丢的？
        - id: ch01-b21
          speaker: narrator
          text: >-
            我把事情全告诉了他。我的衣服怎样留在厨房烘干，我向厨子提起少了钱以后，又怎样险些挨了一顿打。拉森听着听着，笑了起来。
        - id: ch01-b22
          speaker: wolf_larsen
          text: >-
            那不过是厨子顺手捞的一点好处。难道你那条可怜的命，连这点钱都不值？把它当成一堂课吧。再过些日子，你自然会学会亲自看好钱。过去替你管钱的，大概是律师，或者财务代理人，对不对？
        - id: ch01-b23
          speaker: narrator
          text: >-
            他的讥讽藏得很深，我还是听得清清楚楚。
        - id: ch01-b24
          speaker: humphrey
          text: >-
            那我怎样才能把钱拿回来？
        - id: ch01-b25
          speaker: wolf_larsen
          text: >-
            这是你自己的事。现在你没有律师，也没有财务代理人，只能靠自己。以后弄到一块钱，就给我牢牢抓住。像你这样把钱随处乱放，本来就活该丢掉。况且，你自己也犯了罪。你不该拿诱惑去考验同类。你诱惑了厨子，他没能抵挡。是你把他不朽的灵魂置于危险之中。对了，你相信灵魂不朽吗？
        - id: ch01-b26
          speaker: narrator
          text: >-
            说到这里，他懒洋洋地抬起眼皮。那一瞬间，我仿佛看见一道深渊在眼前敞开，自己正在凝视他的灵魂。可那只是错觉。无论看似望得多深，也从来没有谁真正看进过海狼·拉森的灵魂。我甚至相信，没有人真正见过它。后来我才知道，那颗灵魂孤独至极，从不摘下面具，只在极少的时候装出仿佛要袒露自己的样子。
        - id: ch01-b27
          speaker: humphrey
          text: >-
            我从你的眼睛里看见了不朽。
        - id: ch01-b28
          speaker: narrator
          text: >-
            这一次，我故意没有加上“先生”。我觉得谈话已经亲近到容得下这番试探。拉森似乎毫不在意。
        - id: ch01-b29
          speaker: wolf_larsen
          text: >-
            那么，你看见的只是某种活着的东西。可活着并不表示它一定会永远活下去。
        - id: ch01-b30
          speaker: humphrey
          text: >-
            我看见的不止这些。
        - id: ch01-b31
          speaker: wolf_larsen
          text: >-
            那你看见的就是意识。你看见生命知道自己活着，也仅此而已。你并没有看见它会无穷无尽地延续。
        - id: ch01-b32
          speaker: narrator
          text: >-
            他的思想多么清楚，表达又多么准确。他先是好奇地打量我，接着转过头，望向迎风一侧铅灰色的海面。他眼里浮出一片荒凉，嘴角也变得严峻冷酷。他显然落进了悲观的情绪中。
        - id: ch01-b33
          speaker: wolf_larsen
          text: >-
            可这一切为了什么？如果我是不朽的，为什么要不朽？
        - id: ch01-b34
          speaker: narrator
          text: >-
            我一时语塞。该怎么向这个人解释我的唯心主义？我所感觉到的东西，像睡梦中传来的一缕乐声。它使人确信，却又不是言语能够说清的。我怎么可能把它讲给他听？
        - id: ch01-b35
          speaker: humphrey
          text: >-
            那么，你自己相信什么？
        - id: ch01-b36
          speaker: wolf_larsen
          text: >-
            我相信生命就是一团乱东西。它像酵母，是一团不断发酵、不断活动的东西。它也许动一分钟、一小时、一年，甚至一百年，可最后总会停下来。大的吃掉小的，好让自己继续动。强的吃掉弱的，好让自己保持力量。走运的吃得最多，也就动得最久。事情只有这些。你看那些人，他们又算什么？
        - id: ch01-b37
          speaker: narrator
          text: >-
            他不耐烦地挥了挥手，指向船中部。几个水手正在那里摆弄某种绳索活计。
        - id: ch01-b38
          speaker: wolf_larsen
          text: >-
            他们会动，水母也会动。他们为了吃才动，又为了能继续动才吃。明白了吗？他们为了肚子活着，肚子也为了他们才存在。这个圈永远绕不出去，他们自己也到不了任何地方。到最后，他们停住，不再动了。他们死了。
        - id: ch01-b39
          speaker: humphrey
          text: >-
            他们还有梦想。那些梦想光辉灿烂，闪闪发亮……
        - id: ch01-b40
          speaker: wolf_larsen
          text: >-
            梦想吃食。
        - id: ch01-b41
          speaker: humphrey
          text: >-
            也不只是吃食……
        - id: ch01-b42
          speaker: wolf_larsen
          text: >-
            还是吃食。他们只不过想要更大的胃口，再多一点运气，好把胃口填得更满。你看看，他们梦想交上好运，跑一趟能挣大钱的航程，梦想升成大副，梦想发一笔财。说穿了，他们不过想站到更有利的位置，好掠夺自己的同类。他们想整夜不值班，想吃好饭，还想让别人替自己干脏活。
        - id: ch01-b43
          speaker: narrator
          text: >-
            他的声音又冷又硬，听不出一丝玩笑。
        - id: ch01-b44
          speaker: wolf_larsen
          text: >-
            你我和他们一样。我们只是吃得更多，也吃得更好。现在，我在吃他们，也在吃你。可过去，你吃的比我还多。你睡过软床，穿过好衣服，吃过可口的饭菜。那些床是谁做的？那些衣服和饭菜又是谁做的？反正不是你。你从没流过自己的汗，也没亲手造出过任何东西。你靠父亲挣下的收入生活，就像军舰鸟俯冲下来，抢走鲣鸟刚捕到的鱼。
        - id: ch01-b45
          speaker: wolf_larsen
          text: >-
            你还和一群人合在一起，造出一个他们称为政府的东西。你们统治其余所有人，吃掉他们弄来的食物，而那些食物本来是他们自己想吃的。暖和的衣服穿在你身上。衣服是他们做的，他们自己却裹着破烂，冻得发抖，还得去求你，或是求替你管钱的律师和财务代理人，给他们一份工作。
        - id: ch01-b46
          speaker: humphrey
          text: >-
            可这根本不是我们在谈的事！
        - id: ch01-b47
          speaker: narrator
          text: >-
            拉森越说越快，眼里也亮起了逼人的光。
        - id: ch01-b48
          speaker: wolf_larsen
          text: >-
            当然是同一回事。这就是猪一样的贪欲，这就是生命。让这样的贪欲永远不朽，有什么用？又有什么道理？它最后要到哪里去？这一切到底算什么？你从没生产过一点食物，可你吃掉、糟蹋掉的东西，本来足以救活二十个可怜人。他们造出了食物，自己却吃不到。你成就了什么不朽的目的？他们又成就过什么？
        - id: ch01-b49
          speaker: wolf_larsen
          text: >-
            再看看你和我。你的生命和我的生命迎头撞上时，你夸耀的不朽还能算什么？你想回到陆地，因为那里正适合你那种贪欲生长。可我偏想把你留在这条船上，因为这里才是我的贪欲最兴旺的地方。我会把你留下。我既能成就你，也能毁掉你。你也许今天死，也许这个星期死，也许下个月死。你太弱了，我现在一拳就能要你的命。
        - id: ch01-b50
          speaker: wolf_larsen
          text: >-
            可要是我们真能不朽，这些事又该怎么解释？你我一辈子都像猪一样贪婪，这难道是不朽者该做的事吗？还是那个问题，这一切究竟算什么？我又为什么要把你留在这里？
        - id: ch01-b51
          speaker: humphrey
          text: >-
            因为你比我强。
        - id: ch01-b52
          speaker: narrator
          text: >-
            我费了好大力气才把这句话说出来，可他永远问不完的问题立刻又追了上来。
        - id: ch01-b53
          speaker: wolf_larsen
          text: >-
            那我为什么比你强？因为在这一团发酵物里，我是比你更大的一块吗？你还看不明白？真的看不明白吗？
        - id: ch01-b54
          speaker: humphrey
          text: >-
            可这样一来，未免太绝望了。
        - id: ch01-b55
          speaker: wolf_larsen
          text: >-
            这一点我赞成。既然动就是活着，我们又何必动呢？不动，不去做酵母的一部分，也就不会绝望。可问题偏偏就在这里。我们想活，也想动，明明没有任何理由，还是非活下去、非活动不可。因为生命的本性就是这样。它要活，要动，也要继续活、继续动。若不是这样，生命早就成了死物。
        - id: ch01-b56
          speaker: wolf_larsen
          text: >-
            正是你身体里的生命，让你梦想自己会不朽。它现在活着，便想永远活下去。呸！一份猪一样的贪欲，居然还想延续到永恒！
        - id: ch01-b57
          speaker: narrator
          text: >-
            他猛地转身，朝船头走去。到了艉楼前端，他又停下来，招手叫我过去。
        - id: ch01-b58
          speaker: wolf_larsen
          text: >-
            对了，厨子一共拿走你多少钱？
        - id: ch01-b59
          speaker: humphrey
          text: >-
            一百八十五美元，先生。
        - id: ch01-b60
          speaker: narrator
          text: >-
            他点了点头。过了一会儿，我正沿升降梯下去摆午餐桌，听见他在船中部高声咒骂几个水手。
