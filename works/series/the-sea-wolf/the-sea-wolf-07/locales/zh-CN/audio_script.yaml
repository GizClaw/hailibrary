audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    deep_water_sailor:
      display_name: 远洋水手
      tts:
        delivery: 悠然放声，唱腔里带着远航水手的畅快
        timbre: 醇厚明亮的成年男高音
        pace: 从容而富有歌谣节拍
        pitch: 高音
  chapters:
    - id: ch01
      title: 第七章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            风向反复变了三天，我们总算赶上东北信风。我那条伤腿虽然还糟糕，一夜却睡得很沉。上了甲板，只见清劲的风从船尾送来。“幽灵号”的帆向两边展开，像张开双翼。除了艏三角帆，其余的帆都吃足了风，推着船在白沫中飞驰。信风的力量实在惊人。白天走，夜里走，一天又一天，风始终强劲而稳定地跟在船尾。船简直是在自己航行。水手除了掌舵，不用拉索具，也不用换顶帆。日落后把帆脚索放松，清晨等帆布散掉露水的潮气，再把绳索收紧。全部工作就这么多。
        - id: ch01-b02
          speaker: narrator
          text: >-
            航速时而十节，时而十二节，又降到十一节。东北风不停地吹，每两个黎明之间，就把我们送出二百五十英里。旧金山被飞快抛远，“幽灵号”一路冒着白沫冲向热带。我为这速度高兴，心里却也难过。天气一天比一天暖。到了第二短班，水手们光着身子上甲板，从舷外打来海水，互相泼洒。飞鱼开始落到船上，夜间值守的人便追着它们满甲板跑。早晨，只要给马格里奇一点好处，厨房里就会飘出煎鱼的香味。有时约翰逊站在船首斜桅末端，钓起闪亮的鲯鳅，全船也就都有鱼肉吃了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            约翰逊一有空便待在船首斜桅上，或爬到桅顶横桁，望着“幽灵号”鼓满风帆，劈开海水。他眼里满是热爱，近乎崇拜。整个人像在梦里，痴痴看着一面面饱满的帆，看着泡沫翻滚的航迹，也看着船身在流动的水山之间升起又冲下。海浪庄严地排成队伍，与我们一道前行。
        - id: ch01-b04
          speaker: narrator
          text: >-
            那些白昼与黑夜，到处是奇景，也是狂野的欢欣。苦役留给我的空闲少得可怜，可只要偷到片刻，我就会一次又一次地看，舍不得从眼前无尽的壮丽上移开目光。过去即使在梦里，我也没见过世界有这样的光景。天空洁净得没有一点杂色，蓝得就像大海。船艏下的海水泛着天蓝色缎子的光泽。天边围着淡白的云，像一圈羊毛，永远不动，也永远不变，给无瑕的绿松石色天空镶上一道银边。
        - id: ch01-b05
          speaker: narrator
          text: >-
            有一夜，我本该去睡，却躺在艏楼甲板上往下看。“幽灵号”的船艏推开海水，荡起幽灵般的白色细浪。水声汩汩，像幽静山谷中的小溪淌过青苔石头。那低低的歌声把我带离了周围的一切，也带离了自己。我不再是舱房侍者汉普，不再是那个在书堆里做了三十五年梦的范韦登。就在这时，身后一个声音唤醒了我。那肯定是海狼·拉森。他的语气有一种不可动摇的确信，念起诗来，又多了一份醇厚的欣赏。
        - id: ch01-b06
          speaker: wolf_larsen
          text: >-
            啊，热带的黑夜燃烧如火，航迹是一道光亮的伤痕，把炽热的天空驯服。船艏稳稳打着鼾，碾过洒满星尘的海床，惊惶的鲸尾拍起烈焰。太阳在她的船板上烙下伤疤，亲爱的姑娘，露水又把她的绳索绷紧。我们沿古老的路轰鸣前行，沿自己的路，沿出海的路，一路向南，走上漫漫长路，那条永远崭新的路。
        - id: ch01-b07
          speaker: narrator
          text: >-
            他停了一会儿。诗句和眼前的海夜，都配得上这段沉默。随后，他问我。
        - id: ch01-b08
          speaker: wolf_larsen
          text: >-
            怎么样，汉普？这几句诗听着如何？
        - id: ch01-b09
          speaker: narrator
          text: >-
            我看着他的脸。那张脸和海面一样亮，双眼映着星光，闪闪发亮。
        - id: ch01-b10
          speaker: humphrey
          text: >-
            我至少觉得很稀奇。你居然也会这样激动。
        - id: ch01-b11
          speaker: wolf_larsen
          text: >-
            老兄，这就是活着！这就是生命！
        - id: ch01-b12
          speaker: humphrey
          text: >-
            可你说过，生命廉价，又没有价值。
        - id: ch01-b13
          speaker: narrator
          text: >-
            我把他自己的话扔了回去。他笑起来。这是我第一次听见他的声音里有真正的欢笑。
        - id: ch01-b14
          speaker: wolf_larsen
          text: >-
            唉，你怎么就是不明白？我真想把这个道理敲进你脑袋里，让你知道生命到底是什么。当然，生命除了对自己以外，没有价值。可就在此刻，我的生命对我自己宝贵极了，简直是无价之宝。这个价钱高得荒唐，你肯定也承认。可是没办法，给它定价的，正是我身体里的生命。
        - id: ch01-b15
          speaker: narrator
          text: >-
            他停下来，像是在等那些能够说清心中想法的字。终于，他又开了口。
        - id: ch01-b16
          speaker: wolf_larsen
          text: >-
            你知道吗？我现在有种奇怪的振奋，仿佛所有时间都在我身体里回响，仿佛一切力量都是我的。我知道真理，懂得分辨神圣的善与恶，也分得清是与非。我看得又清楚又遥远，几乎可以相信上帝了。
        - id: ch01-b17
          speaker: narrator
          text: >-
            说到这里，他的声音忽然变了，脸上的光也消失了。
        - id: ch01-b18
          speaker: wolf_larsen
          text: >-
            可我现在这副样子，到底算什么？活着的喜悦？生命的狂欢？还是所谓的灵感？说到底，不过是消化顺畅，胃很舒服，食欲正旺，样样都合意。这是生命为了哄人活下去而付的贿赂，是血液里的香槟，是发酵冒出的泡沫。有人因此想到神圣的事。有人看见了上帝，看不见的，就自己造出一个上帝。事情就是这么简单。
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            这不过是生命喝醉了。酵母在搅动，在蠕动。生命知道自己还活着，便疯疯癫癫地说个不停。呸！等到明天，我也会像醉汉那样付出代价。我会明白自己必定要死，多半死在海上。我自己不再蠕动，却要随着海里的腐败一同蠕动，被别的东西吃掉，变成腐肉。肌肉里的力量和动作也会交出去，变成鱼鳍、鱼鳞和鱼肚里的力量和动作。
        - id: ch01-b20
          speaker: wolf_larsen
          text: >-
            呸！再呸一次！这杯香槟已经跑光了气。光彩没了，泡沫也没了，只剩下寡淡无味的酒。
        - id: ch01-b21
          speaker: narrator
          text: >-
            他来得突然，走得也突然，像一头老虎，沉重却无声地跃下甲板。“幽灵号”继续犁海前进。我这才听出，船艏汩汩的水声确实很像鼾声。拉森刚才还沉浸在崇高的狂喜中，转眼又跌入绝望。那场猛然的变化给我的震动，随着水声渐渐退去。这时，船腰处有个远洋水手用醇美的男高音唱起了《信风之歌》。
        - id: ch01-b22
          speaker: deep_water_sailor
          text: >-
            啊，我是水手深爱的风。我坚定、强劲又忠诚。他们望着高处的云，循我的踪迹航行，越过深不可测的热带碧海。从白昼到黑夜，我追随船影，像猎犬紧咬它的足迹。正午我最强劲，月光之下，也会把船帆的腹部吹得紧绷。
