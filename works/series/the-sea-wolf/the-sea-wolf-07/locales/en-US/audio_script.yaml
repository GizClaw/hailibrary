audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
    sailor:
      display_name: Sailor
      tts:
        delivery: hearty and musical, with the ease of a seasoned seaman
        timbre: rich and resonant
        pace: steady
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER VII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            After three days of shifting winds, we finally caught the north-east trade wind. I came on deck after a good night's rest, despite my injured knee, and found the Ghost racing forward through the foam. She was sailing wing-and-wing, with every sail but the jibs drawing and a fresh breeze directly behind her. What a wonder that great wind was. It carried us all day and all night, then through the next day and the day after that. Day upon day, it blew steadily and strongly from astern.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The schooner almost sailed herself. The crew no longer had to haul at sheets and tackles or shift the topsails. Apart from steering, the sailors had hardly anything to do. At sunset, they eased the sheets. In the morning, when the damp sails relaxed as the dew dried, they pulled them tight again. That was all.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Our speed rose and fell between ten, eleven, and twelve knots. The brave wind never stopped coming out of the north-east, driving us along our course for two hundred and fifty miles from one dawn to the next. The pace filled me with gladness and sadness together. San Francisco was falling farther behind us while we rushed south toward the tropics.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Each day was noticeably warmer. During the second dog-watch, the sailors came on deck stripped and threw buckets of seawater over one another. Flying fish began to appear. At night, the men on watch scrambled after the ones that dropped onto the deck. In the morning, once Thomas Mugridge had been properly bribed, the galley smelled wonderfully of fish frying. We also ate dolphin when Johnson managed to catch one of those flashing beauties from the end of the bowsprit.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Johnson seemed to spend every free moment either out there or high in the crosstrees, watching the Ghost cut through the water under her great spread of sail. His eyes held passion and worship. He wandered about as if in a dream, gazing at the full sails and foaming wake, and at the schooner rising and running over the liquid mountains that moved beside us in stately procession.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The days and nights were all wonder and wild delight. My dreary work left little time to spare, but I stole every moment I could to look at a glory I had never imagined the world possessed. Above us, the sky was a stainless blue. The sea was just as blue, shining like azure satin beneath the bow. Pale, fleecy clouds rested all around the horizon. They never seemed to move or change. They formed a silver setting around the flawless turquoise sky.
        - id: ch01-b07
          speaker: narrator
          text: >-
            There is one night I will never forget. I should have been asleep, but instead I lay on the forecastle head, looking down at the ghostly line of foam that the Ghost pushed away from her bow. It made the sound of a brook bubbling over mossy stones in a quiet hollow. Its low song drew me so far out of myself that I was no longer Hump, the cabin boy. I was no longer Van Weyden either, the man who had spent thirty-five years dreaming among books.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Then a voice sounded behind me and brought me back. It could only be Wolf Larsen. His voice carried his usual unshakable certainty, but it was softened by his pleasure in the words he quoted.
        - id: ch01-b09
          speaker: wolf_larsen
          text: >-
            Oh, the blazing tropic night, when the wake is a welt of light that holds the hot sky tame, and the steady forefoot snores through floors powdered with planets, where the frightened whale strikes flame with its tail. Her plates are scarred by the sun, dear lass, and her ropes are tight with dew. We're booming down on the old trail, our own trail, the trail that leads out. We're sagging south on the Long Trail, the trail that is always new.
        - id: ch01-b10
          speaker: narrator
          text: >-
            He let the words and the night settle into silence before he spoke again.
        - id: ch01-b11
          speaker: wolf_larsen
          text: >-
            Well, Hump? What do you make of that?
        - id: ch01-b12
          speaker: narrator
          text: >-
            I looked into his face. It glowed like the sea, and his eyes flashed in the starlight. I answered him coldly.
        - id: ch01-b13
          speaker: narrator
          text: >-
            What surprises me most is hearing you sound so enthusiastic.
        - id: ch01-b14
          speaker: wolf_larsen
          emotion: happy
          text: >-
            But this is living, man! This is life!
        - id: ch01-b15
          speaker: narrator
          text: >-
            And life is cheap. It has no value.
        - id: ch01-b16
          speaker: narrator
          text: >-
            I threw his own words back at him. He laughed, and for the first time I heard true delight in his voice.
        - id: ch01-b17
          speaker: wolf_larsen
          emotion: happy
          text: >-
            Ah, I still can't make you understand what an extraordinary thing life is. I can't drive it into your head. Of course life has no value except to itself. But I can tell you this. My life feels very valuable to me at this moment. To me, it is beyond price. You'll agree that's an enormous overrating. I can't help it, though. The life inside me is what sets the price.
        - id: ch01-b18
          speaker: narrator
          text: >-
            He paused, searching for words that could hold the thought inside him. At last, he continued.
        - id: ch01-b19
          speaker: wolf_larsen
          emotion: happy
          text: >-
            Do you know, I feel strangely lifted up. It's as if all of time were echoing through me and every power belonged to me. I know what truth is. I can tell divine good from evil and right from wrong. I can see clearly and far ahead. I could almost believe in God.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Then his voice changed, and the light went out of his face.
        - id: ch01-b21
          speaker: wolf_larsen
          text: >-
            But what is this state I'm in? What is this joy in being alive, this triumph of life, this inspiration? I can tell you. It comes when a man's digestion is working, when his stomach is sound, his appetite is sharp, and everything is going well. It's the bribe life gives us. It's the champagne in the blood, the foam rising from the ferment. It makes some men think holy thoughts. It makes others see God, or create him when they can't see him.
        - id: ch01-b22
          speaker: wolf_larsen
          emotion: disgusted
          text: >-
            That's all it is. We're drunk on life. The yeast stirs and crawls, and life babbles because it is mad with the knowledge that it's alive. Bah! Tomorrow I'll pay for this feeling the way any drunkard pays. Then I'll remember that I have to die, probably at sea. I'll stop crawling on my own and lie there while the sea's corruption crawls over me. I'll become food and carrion. All the strength and motion in my muscles will pass into the fins, scales, and guts of fish. Bah, and bah again!
        - id: ch01-b23
          speaker: wolf_larsen
          emotion: disgusted
          text: >-
            The champagne is flat already. Every sparkle and bubble is gone. There's nothing left but a tasteless drink.
        - id: ch01-b24
          speaker: narrator
          text: >-
            He left as suddenly as he had arrived. He sprang down to the deck with the weight and softness of a tiger, while the Ghost kept ploughing onward.
        - id: ch01-b25
          speaker: narrator
          text: >-
            As I listened again, I noticed that the water gurgling at the bow really did sound like a snore. Little by little, the effect of Wolf Larsen's swift plunge from glorious joy into despair faded from me.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Then, from the middle of the ship, one of the deep-water sailors raised a rich tenor voice and began the “Song of the Trade Wind.”
        - id: ch01-b27
          speaker: sailor
          text: >-
            Oh, I am the wind the seamen love. I am steady and strong and true. They follow my path by the clouds above, over the bottomless tropical blue. Through daylight and darkness I follow the ship. Like a hound, I stay on her trail. I'm strongest at noon, but even under the moon, I tighten the belly of her sail.
