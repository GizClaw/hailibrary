audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
    mugridge:
      display_name: Thomas Mugridge
      tts:
        delivery: sneering, officious, and quick to bully
        timbre: nasal and wiry
        pace: brisk with sharp bursts
        pitch: medium-high
    deck_lookout:
      display_name: Deck Lookout
      tts:
        delivery: alert and projecting across the ship
        timbre: rough and clear
        pace: brisk
        pitch: medium
    first_hunter:
      display_name: First Hunter
      tts:
        delivery: wary, imposing, and reluctant
        timbre: deep and rugged
        pace: measured
        pitch: low
    second_hunter:
      display_name: Second Hunter
      tts:
        delivery: tense and controlled under pressure
        timbre: firm and weathered
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: CHAPTER XXV
      blocks:
        - id: ch01-b01
          speaker: wolf_larsen
          text: >-
            You were on deck, Mr. Van Weyden. How do things look this morning?
        - id: ch01-b02
          speaker: narrator
          text: >-
            We were at breakfast, and sunshine poured down the open companionway. I told him the weather was clear, with a fair breeze from the west that should grow stronger if Louis was right.
        - id: ch01-b03
          speaker: wolf_larsen
          text: >-
            Any fog showing?
        - id: ch01-b04
          speaker: narrator
          text: >-
            Thick banks to the north and northwest.
        - id: ch01-b05
          speaker: narrator
          text: >-
            He nodded, plainly pleased.
        - id: ch01-b06
          speaker: wolf_larsen
          text: >-
            And the Macedonia?
        - id: ch01-b07
          speaker: narrator
          text: >-
            We haven't seen her.
        - id: ch01-b08
          speaker: narrator
          text: >-
            His face seemed to fall, though I could not imagine why.
        - id: ch01-b09
          speaker: deck_lookout
          text: >-
            Smoke in sight!
        - id: ch01-b10
          speaker: narrator
          text: >-
            At once, Wolf's face brightened.
        - id: ch01-b11
          speaker: wolf_larsen
          text: >-
            Good!
        - id: ch01-b12
          speaker: narrator
          text: >-
            He left the table and went through to the steerage, where the exiled hunters were eating their first breakfast. Maud and I hardly touched our food. We watched each other in silence and listened to Wolf speaking through the bulkhead. We could not make out his words, but when he finished, the hunters answered with a tremendous cheer and shouts of delight.
        - id: ch01-b13
          speaker: narrator
          text: >-
            From the noise overhead, I knew the sailors had been turned out and were preparing to lower the boats. I brought Maud up, then left her at the break of the poop where she could watch without standing in the middle of the work. The crew must have learned what Wolf planned, because they attacked every task with new energy. The hunters came crowding on deck with shotguns and ammunition boxes. More surprisingly, they all carried rifles. A rifle was rarely useful in a sealing boat. Any seal shot at long range would sink before the boat could reach it. Yet every hunter had a rifle that morning and a heavy supply of cartridges. Whenever they looked toward the Macedonia's smoke, which rose higher as she came in from the west, they grinned with satisfaction.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Our five boats went over the side in a rush. They spread northward like the ribs of a fan, just as they had the afternoon before, and set the course that the Ghost would follow. I watched for some time, but nothing about their conduct looked unusual. They lowered sail, shot seals, hoisted sail again, and continued on their way exactly as I had always seen them do. The Macedonia repeated yesterday's trick. She dropped her line of boats ahead of ours and directly across their course, taking up the best water. Fourteen boats needed a broad stretch of ocean if they were to hunt comfortably. Once her boats had completely overlapped our line, the steamer continued northeast, dropping still more boats as she went.
        - id: ch01-b15
          speaker: narrator
          text: >-
            I finally asked Wolf what he was planning.
        - id: ch01-b16
          speaker: wolf_larsen
          text: >-
            Never mind for now. You'll know soon enough. Just pray we get plenty of wind.
        - id: ch01-b17
          speaker: narrator
          text: >-
            A moment later, he changed his mind.
        - id: ch01-b18
          speaker: wolf_larsen
          text: >-
            Oh, I may as well tell you. My brother is going to taste his own medicine. I'll crowd his hunting grounds for the rest of the season, if luck stays with us.
        - id: ch01-b19
          speaker: narrator
          text: >-
            And if it doesn't?
        - id: ch01-b20
          speaker: wolf_larsen
          text: >-
            We won't consider that. We have to be lucky, or we're finished.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Wolf was at the wheel, so I went forward to my makeshift hospital. Nilson's broken leg was healing well, and he was as cheerful as anyone could expect. Thomas Mugridge was sunk in misery. I felt deeply sorry for him. Years of brutality had battered his thin body into a wreck, yet his desire to live still burned as strongly as ever.
        - id: ch01-b22
          speaker: narrator
          text: >-
            With a good artificial foot, you'll be limping through ships' kitchens for years and years.
        - id: ch01-b23
          speaker: mugridge
          text: >-
            I don't know about that, Mr. Van Weyden. But I know I'll never rest easy till that hellhound is dead. He can't outlive me. He has no right to live. The Good Word says he'll surely die, and I say amen. The sooner, the better.
          emotion: angry
        - id: ch01-b24
          speaker: narrator
          text: >-
            Back on deck, I found Wolf steering mostly with one hand. With the other, he held the marine glasses and studied how the boats were placed, paying special attention to the Macedonia. The only change in our boats was that they had turned close to the wind and were heading several points west of north. I still could not see what that move would gain. The open sea remained blocked by the Macedonia's five windward boats, and they too had hauled close to the wind. As both groups moved, those five boats slowly drew westward and farther away from the rest of their own line. Our boats were not relying on sail alone. Their crews rowed as well, and even the hunters had taken oars. With three pairs working in every boat, they rapidly closed the distance to what I had begun to think of as the enemy.
        - id: ch01-b25
          speaker: narrator
          text: >-
            The Macedonia's smoke had dwindled to a faint stain on the northeastern horizon, and the steamer herself was gone. Until then, the Ghost had drifted lazily. Half the time, her sails shook and spilled the wind, and twice we had stopped altogether for short periods. Now all that changed. The sheets were trimmed, and Wolf began to show what the Ghost could do. We raced past the whole line of our own boats and bore down on the first windward boat in the other line.
        - id: ch01-b26
          speaker: wolf_larsen
          text: >-
            Get that flying jib down, Mr. Van Weyden. Then be ready to back the jibs.
        - id: ch01-b27
          speaker: narrator
          text: >-
            I ran forward, gathered in the downhaul, and made the flying jib fast. By then, we were slipping past the boat with only a hundred feet between us, and it lay to leeward. Its three men stared at the Ghost with suspicion. They knew they had crowded our hunting water, and they knew Wolf Larsen's reputation, if only from the stories told about him. Their hunter was an enormous Scandinavian with a golden beard. His rifle lay ready across his knees when it should have been secured in its rack. When the boat came level with our stern, Wolf greeted the men with a friendly wave.
        - id: ch01-b28
          speaker: wolf_larsen
          text: >-
            Come aboard and have a gam with us!
        - id: ch01-b29
          speaker: narrator
          text: >-
            Among sealing schooners, a gam meant a visit and a long talk, a welcome break in the lonely life at sea. The Ghost turned into the wind. I finished forward, then ran aft to help with the mainsheet.
        - id: ch01-b30
          speaker: wolf_larsen
          text: >-
            Stay on deck, please, Miss Brewster. You too, Mr. Van Weyden.
        - id: ch01-b31
          speaker: narrator
          text: >-
            The other boat dropped its sail and came alongside. The golden-bearded hunter climbed over the rail and dropped to our deck, with his two sailors behind him. He looked like an ancient sea king. He was six feet eight or nine, as I later learned, and weighed two hundred and forty pounds. There was no fat on him. Every pound was bone and muscle. Yet even that enormous body could not hide his uneasiness. Doubt and distrust showed plainly through the shield of his beard. Then he looked from Wolf to me, saw that there were only two of us, and counted his own two men beside him. Relief passed over his open face. He seemed to have little reason for fear. He towered over Wolf like a giant, making even that powerful man look small.
        - id: ch01-b32
          speaker: narrator
          text: >-
            At the companionway, Wolf invited him below. The hunter hesitated, then glanced at his smaller host and decided there was nothing to fear. They went into the cabin together while his sailors went forward to visit the forecastle.
        - id: ch01-b33
          speaker: narrator
          text: >-
            A great choking bellow suddenly burst from the cabin. Then came every sound of a furious struggle, the crashing and thumping of two powerful bodies locked together below us. It sounded like a lion fighting a leopard, but the lion made all the noise. Wolf was the leopard.
        - id: ch01-b34
          speaker: narrator
          text: >-
            So much for the sacred protection of our hospitality.
        - id: ch01-b35
          speaker: narrator
          text: >-
            I spoke bitterly to Maud. She nodded, and I saw the same sick horror that violence had once raised in me.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Would you rather go forward by the steerage companionway until this is over?
        - id: ch01-b37
          speaker: narrator
          text: >-
            She shook her head and looked at me with pity. She was not frightened. She was appalled by the animal savagery of men.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Please understand this. Whatever part I take in what is happening, and whatever comes next, I have no choice if you and I are ever to escape alive. None of this is easy for me.
        - id: ch01-b39
          speaker: maud_brewster
          text: >-
            I understand.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Her voice was weak and distant, but her eyes told me she truly did understand. Soon the sounds below stopped. Wolf returned alone. A faint flush showed beneath his bronze skin, but otherwise the fight had left no mark on him.
        - id: ch01-b41
          speaker: wolf_larsen
          text: >-
            Send those two men aft, Mr. Van Weyden.
        - id: ch01-b42
          speaker: narrator
          text: >-
            I obeyed, and the sailors stood before him a minute later.
        - id: ch01-b43
          speaker: wolf_larsen
          text: >-
            Hoist your boat aboard. Your hunter plans to stay with us for a while, and he doesn't want it pounding against the side.
        - id: ch01-b44
          speaker: narrator
          text: >-
            They hesitated.
        - id: ch01-b45
          speaker: wolf_larsen
          text: >-
            I said, hoist it aboard.
        - id: ch01-b46
          speaker: narrator
          text: >-
            His voice sharpened, then softened into something more threatening still.
        - id: ch01-b47
          speaker: wolf_larsen
          text: >-
            You may be sailing with me for some time, so let's begin with a friendly understanding. Move lively now. You jump faster than that for Death Larsen, and you know it.
        - id: ch01-b48
          speaker: narrator
          text: >-
            The men moved faster. As their boat swung inboard, Wolf sent me forward to free the jibs. Then, with Wolf at the wheel, the Ghost turned after the Macedonia's second windward boat.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Once we were moving again, I had nothing to do for a little while and could study the whole fight. Two of our boats were attacking the Macedonia's third windward boat. Our remaining three had gone after her fourth. Her fifth boat, meanwhile, was taking a hand in the defense of whichever companion lay nearest. The shooting had begun at long range, and rifles cracked steadily across the water. The strengthening wind was kicking up a quick, snappy sea, so no one could aim with much precision from the pitching boats. As the Ghost drew closer, now and then we could actually see a bullet touch the water and go skipping from one wave to the next.
        - id: ch01-b50
          speaker: narrator
          text: >-
            The boat ahead of us had squared away and was running before the wind. Its crew hoped to escape us while moving closer to the other boats so they could help resist our wider attack. I had to keep handling sheets and tacks, and the work left me little time to watch. When I next happened to reach the poop, Wolf ordered the two captured sailors forward and down into the forecastle. They went with sullen faces and slow steps, but they went. Then he turned to Maud.
        - id: ch01-b51
          speaker: wolf_larsen
          text: >-
            Go below, Miss Brewster. There is nothing horrible waiting there. Only an unhurt man tied securely to the ringbolts. Bullets may come aboard, and I don't want you killed.
        - id: ch01-b52
          speaker: narrator
          text: >-
            As he spoke, a bullet struck the brass cap on a spoke of the wheel between his hands and screamed away to windward.
        - id: ch01-b53
          speaker: wolf_larsen
          text: >-
            There, you see. Mr. Van Weyden, take the wheel.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Maud stepped into the companionway, leaving only her head exposed. Wolf took up a rifle and loaded it. I begged her with my eyes to go farther down, but she smiled.
        - id: ch01-b55
          speaker: maud_brewster
          text: >-
            We may be weak creatures from the land, with no proper sea legs, but we can at least show Captain Larsen that we're as brave as he is.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Wolf looked at her with sudden admiration.
        - id: ch01-b57
          speaker: wolf_larsen
          text: >-
            I like you twice as well for saying that. Books, brains, and bravery. You're a complete blue-stocking, fit to marry a pirate chief. But we'll discuss that later.
        - id: ch01-b58
          speaker: narrator
          text: >-
            He smiled as another bullet struck the cabin wall. His eyes flashed gold, and terror rose in hers.
        - id: ch01-b59
          speaker: narrator
          text: >-
            We are braver. I can say for myself that I'm braver than Captain Larsen.
        - id: ch01-b60
          speaker: narrator
          text: >-
            This time Wolf looked sharply at me, wondering if I mocked him. I turned the wheel several spokes to correct the Ghost as she swung toward the wind, then steadied her and pointed to my knees.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Look closely. They're trembling because my body is afraid. My mind is afraid too, because I don't want to die. But my spirit controls both. That makes me courageous. Your body feels no fear, and neither does your mind. Danger costs you nothing. You even enjoy it. You may be fearless, Mr. Larsen, but the bravery belongs to me.
        - id: ch01-b62
          speaker: wolf_larsen
          text: >-
            You're right. I've never thought of it that way. But does the reverse follow? If you're braver than I am, does that make me more cowardly than you?
        - id: ch01-b63
          speaker: narrator
          text: >-
            We both laughed at the absurd thought. Wolf dropped to the deck and rested his rifle across the rail. The bullets that had reached us earlier had traveled nearly a mile, but we had already cut that distance in half. He settled himself and fired three careful shots. I watched each one find its mark more closely than the last. The first struck the sea fifty feet to windward of the boat. The second hit the water alongside it. At the third shot, the boat-steerer released his long steering oar and folded into the bottom of the boat.
        - id: ch01-b64
          speaker: wolf_larsen
          text: >-
            That should settle them. I couldn't shoot the hunter. The boat-puller may not know how to steer, and the hunter can't steer and fire at the same time.
        - id: ch01-b65
          speaker: narrator
          text: >-
            He was right. The boat swung into the wind at once, and the hunter leaped aft to replace the wounded steerer. That boat stopped shooting, though rifles still cracked from the others.
        - id: ch01-b66
          speaker: narrator
          text: >-
            The hunter got his boat before the wind again, but the Ghost ran down on it at twice its speed. When only a hundred yards remained between us, I saw the boat-puller pass a rifle back to the hunter. Wolf walked amidships and lifted the coil of the throat halyards from its pin. Then he leaned over the rail and watched with his own rifle leveled. Twice, the hunter let go of the steering oar with one hand and reached toward the weapon waiting between his knees. Each time he hesitated and returned his hand to the oar. By then, the Ghost was alongside and foaming past him.
        - id: ch01-b67
          speaker: wolf_larsen
          text: >-
            You there! Take this line around something!
        - id: ch01-b68
          speaker: narrator
          text: >-
            Wolf threw the coil. It struck the boat-puller and nearly knocked him down, but he looked to his hunter instead of obeying. The hunter's rifle sat between his knees. If he released the steering oar to use it, his boat would swing into the schooner. Wolf's rifle was already aimed at him, and he knew he would be shot before he could fire.
        - id: ch01-b69
          speaker: second_hunter
          text: >-
            Take the line.
        - id: ch01-b70
          speaker: narrator
          text: >-
            The man wrapped it around the forward thwart and let it pay out as it snapped tight. The boat rushed outward, and the hunter steadied it on a course twenty feet beside the Ghost.
        - id: ch01-b71
          speaker: wolf_larsen
          text: >-
            Get that sail down and bring her alongside!
        - id: ch01-b72
          speaker: narrator
          text: >-
            Wolf kept hold of his rifle even while passing down the tackles with one hand. Once the boat was secured at bow and stern, the two unhurt men prepared to climb aboard. The hunter lifted his rifle as if he meant only to set it somewhere safe.
        - id: ch01-b73
          speaker: wolf_larsen
          text: >-
            Drop it!
        - id: ch01-b74
          speaker: narrator
          text: >-
            The hunter dropped it as if the metal had burned his hands. He and the boat-puller climbed aboard the Ghost. Then, under Wolf's direction, the two new prisoners worked the tackles and hoisted their own boat onto the schooner. After that, they carefully carried the wounded boat-steerer down into the forecastle.
        - id: ch01-b75
          speaker: wolf_larsen
          text: >-
            If our five boats have done as well as we have, we'll soon have a very full crew.
        - id: ch01-b76
          speaker: maud_brewster
          text: >-
            The man you shot... I hope he isn't...?
          emotion: fearful
        - id: ch01-b77
          speaker: wolf_larsen
          text: >-
            It's only his shoulder. Nothing serious. Mr. Van Weyden will have him well again in three or four weeks.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Then Wolf pointed toward the Macedonia's third boat, which was nearly abreast of us.
        - id: ch01-b79
          speaker: wolf_larsen
          text: >-
            But he won't mend those fellows, from the look of them. That's Horner and Smoke's work. I told them we needed living men, not bodies. Once a man learns to shoot, though, the pleasure of hitting his target is hard to resist. Have you ever felt it, Mr. Van Weyden?
        - id: ch01-b80
          speaker: narrator
          text: >-
            I shook my head and looked at what they had done. The attack had been terribly bloody. Horner and Smoke had already drawn away from that boat and joined our other three in the attack on the two that remained. The abandoned craft lay in the trough of the sea. It rolled drunkenly across each rising comber, while its loose spritsail stuck out at a right angle and beat and fluttered in the wind. The hunter and boat-puller both lay awkwardly in the bottom. The boat-steerer had fallen across the gunwale, half in the boat and half out. His arms trailed through the water, and his head rolled from side to side with every movement of the empty craft.
        - id: ch01-b81
          speaker: narrator
          text: >-
            Please don't look, Miss Brewster.
        - id: ch01-b82
          speaker: narrator
          text: >-
            I was grateful that she listened and did not see it.
        - id: ch01-b83
          speaker: wolf_larsen
          text: >-
            Steer straight for that group, Mr. Van Weyden.
        - id: ch01-b84
          speaker: narrator
          text: >-
            We steered toward the clustered boats. As the distance narrowed, the rifles fell silent, and we could see that the fight was over. Our five boats had captured the last two belonging to the enemy. The seven now floated close together, their crews waiting for the Ghost to come and take them aboard.
        - id: ch01-b85
          speaker: narrator
          text: >-
            Look there, to the northeast!
        - id: ch01-b86
          speaker: narrator
          text: >-
            The stain of smoke that marked the Macedonia had appeared again.
        - id: ch01-b87
          speaker: wolf_larsen
          text: >-
            Yes, I've been watching it.
        - id: ch01-b88
          speaker: narrator
          text: >-
            Wolf measured the distance to the fog bank, then paused to feel the wind against his cheek.
        - id: ch01-b89
          speaker: wolf_larsen
          text: >-
            I think we'll make it. My dear brother has discovered our little game, though, and he's driving hard after us. Ah, look at that!
        - id: ch01-b90
          speaker: narrator
          text: >-
            The smoke suddenly grew larger and much blacker.
        - id: ch01-b91
          speaker: wolf_larsen
          text: >-
            I'll beat you there, brother. And I wish you nothing worse than grinding those old engines into scrap while you try to catch me.
        - id: ch01-b92
          speaker: narrator
          text: >-
            When we stopped for the boats, the deck filled with confusion, though everyone knew his work and the hurry remained orderly. The boats came alongside from every direction at once. As quickly as the prisoners climbed over the rail, our hunters gathered them together and marched them forward to the forecastle. At the same time, our sailors hauled the boats aboard in a jumble. They dropped each one wherever there was room on deck and did not pause to lash it down. The Ghost was already gathering way again. Every sail had been set and was drawing, and the crew was easing the sheets for a wind across our beam, while the last boat still hung above the water in its tackles.
        - id: ch01-b93
          speaker: narrator
          text: >-
            We needed every second. The Macedonia charged down from the northeast, pouring the blackest smoke from her funnel. She had left behind all the boats that still belonged to her and changed course to head us off. She was not steering straight at the Ghost. She was aiming for a point ahead of us. Our two paths crossed like the sides of an angle, and the point where they would meet lay at the edge of the fog bank. That was the Macedonia's one chance to catch us. The Ghost's only hope was to pass that point before the steamer reached it.
        - id: ch01-b94
          speaker: narrator
          text: >-
            Wolf steered with eyes that shone and snapped as they moved from one detail of the chase to the next. First he searched the sea to windward for any sign that the breeze would weaken or grow stronger. Then he measured the Macedonia's progress. Again his gaze traveled over every sail aboard the Ghost. He ordered one sheet eased a little and another hauled in a little, drawing the last bit of speed the schooner possessed. Every feud and private grudge seemed forgotten. I was amazed by the eagerness with which men who had endured his brutality for so long sprang to carry out each order. As the Ghost lifted, surged, and heeled along, poor Johnson came into my thoughts. He had loved this ship and delighted in her sailing power. I felt a sudden regret that he was not alive and there with us to see what she could do.
        - id: ch01-b95
          speaker: wolf_larsen
          text: >-
            Hunters, you'd better get your rifles.
        - id: ch01-b96
          speaker: narrator
          text: >-
            The five men took their places along the lee rail with rifles in hand and waited. The Macedonia was only a mile away now. She was pounding through the sea at seventeen knots, moving so violently that the black smoke from her funnel streamed straight out at a right angle. Wolf watched her with open delight. The Ghost was making no more than nine knots, but the sheltering fog bank lay very near.
        - id: ch01-b97
          speaker: wolf_larsen
          text: >-
            She's sky-hooting through the brine.
        - id: ch01-b98
          speaker: narrator
          text: >-
            A puff of smoke broke from the Macedonia's deck. A moment later, we heard the heavy report, and a round hole suddenly appeared in the stretched canvas of our mainsail. The rumors were true. She carried one of the small cannon people said was aboard. Our hunters crowded amidships, waved their hats, and answered with a mocking cheer. Again smoke burst from the steamer, followed by another loud report. This ball struck the water no more than twenty feet behind our stern. It glanced twice from the surface, skipping toward windward, and then disappeared beneath the sea.
        - id: ch01-b99
          speaker: narrator
          text: >-
            No rifle fire came from the steamer. All of her hunters were still out in boats or had become our prisoners. When the ships were only half a mile apart, the cannon fired for a third time and opened another hole in our mainsail. Then the Ghost crossed into the fog. It closed around us like dense, wet gauze, veiling the sea and hiding us completely.
        - id: ch01-b100
          speaker: narrator
          text: >-
            The change was shocking. One instant, we were leaping through sunlight beneath a clear sky. The broken sea rolled away on every side to the horizon, and behind us a ship rushed forward, throwing out smoke, fire, and iron. In the very next instant, the sun vanished. There was no sky, and even our own mastheads were lost from sight. Our horizon shrank to the dim circle a person might see through tear-filled eyes. Gray mist raced past us like rain. Tiny drops jeweled every thread of our woollen clothes and every hair on our heads and faces. Moisture covered the shrouds and dripped from the rigging above. Under the booms, drops gathered into long swaying lines. Each surge of the schooner shook them loose and scattered them across the deck in little showers.
        - id: ch01-b101
          speaker: narrator
          text: >-
            The fog gave me a trapped and stifled feeling. It caught every sound the Ghost made as she drove through the waves and hurled it back at us. My thoughts seemed to meet the same barrier and recoil. I could not truly imagine a world beyond the wet curtain wrapped around the ship. This close gray circle had become the whole world, almost the whole universe. Its walls felt so near that I wanted to stretch out both arms and push them back. It seemed impossible that anything else could exist beyond them. The rest of the world was only a dream, and not even a clear one, but the memory of a dream.
        - id: ch01-b102
          speaker: narrator
          text: >-
            Maud felt it too. Wolf did not. His mind stayed fixed on the present. His hands held the wheel, and I felt that he was measuring time itself, counting the minutes in every forward plunge and sideways roll of the Ghost.
        - id: ch01-b103
          speaker: wolf_larsen
          text: >-
            Go forward quietly and stand by to put the helm down. Clew up the topsails first. Put a man at every sheet. No blocks rattling and no voices. Do you understand? Not a sound.
        - id: ch01-b104
          speaker: narrator
          text: >-
            Men went quietly to the sheets, and the topsails were gathered up first. When everything was ready, the order to put the helm down passed forward to me from man to man, each voice kept low. The Ghost leaned over and turned onto the port tack with almost no sound at all. A few loose reef points slapped against the sails, and a sheave creaked in one block and then another. That was all. Under the hollow, echoing cover of the fog, even those faint noises sounded ghostly.
        - id: ch01-b105
          speaker: narrator
          text: >-
            Almost at once, the mist thinned and we burst back into sunlight. The open sea stretched clear to the horizon. The Macedonia was nowhere in sight, and no smoke stained the sky.
        - id: ch01-b106
          speaker: narrator
          text: >-
            Wolf immediately turned the Ghost down along the edge of the fog bank. His trick was clear now. We had entered the fog on the windward side of the steamer. The Macedonia had kept driving blindly into that gray wall, gambling that she would catch us inside it. But the Ghost had quietly turned onto the other tack and slipped back out of her shelter. Now Wolf was running down the rim of the bank so that he could enter it again on the leeward side. If he managed that, the old saying about finding a needle in a haystack would hardly begin to describe his brother's chance of finding us.
        - id: ch01-b107
          speaker: narrator
          text: >-
            We did not stay outside for long. Wolf swung the fore and main sails across, set the topsails again, and headed back into the bank. As we crossed its edge, I could have sworn that a dim shape was emerging from the fog to windward. I looked quickly at Wolf, but by then our own ship was buried again. He nodded. He too had seen the Macedonia. His brother had guessed the trick, turned after us, and failed by a single moment to get ahead of it. There could be no doubt that the steamer had not seen the Ghost. We had escaped.
        - id: ch01-b108
          speaker: wolf_larsen
          text: >-
            He can't keep chasing us. He'll have to collect the rest of his boats. Send someone to the wheel, Mr. Van Weyden. Hold this course for now, and set the watches. We won't be stopping tonight.
        - id: ch01-b109
          speaker: wolf_larsen
          text: >-
            Still, I'd pay five hundred dollars for five minutes aboard the Macedonia, just to hear my brother curse.
        - id: ch01-b110
          speaker: narrator
          text: >-
            Once another man had relieved him at the wheel, Wolf turned to me again.
        - id: ch01-b111
          speaker: wolf_larsen
          text: >-
            Now we must welcome our new men. Give the hunters plenty of whisky, and make sure a few bottles find their way forward. I'll wager that tomorrow every one of these prisoners will go over the side and hunt for Wolf Larsen as cheerfully as he ever hunted for Death Larsen.
        - id: ch01-b112
          speaker: narrator
          text: >-
            Won't they escape the way Wainwright did?
        - id: ch01-b113
          speaker: wolf_larsen
          text: >-
            Not if our old hunters can prevent it. I'm giving them a dollar for every skin the new men shoot. That money caused at least half of today's excitement. No, the prisoners won't escape if the hunters have a say. Now get back to your hospital. I expect you've got a full ward waiting.
