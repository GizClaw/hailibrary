audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
    smoke:
      display_name: 斯莫克
      tts:
        delivery: 谨慎沉着，反抗时带着不露声色的讥诮
        timbre: 瘦硬而饱经风霜的成年男声
        pace: 平稳，不疾不徐
        pitch: 中低音
    helmsman:
      display_name: 舵手
      tts:
        delivery: 警醒利落，保持船员报告时的干脆
        timbre: 经风历浪而清亮的成年男声
        pace: 明快
        pitch: 中音
    mugridge:
      display_name: 托马斯·马格里奇
      tts:
        delivery: 阴郁尖刻，伦敦口音里带着刻骨怨恨
        timbre: 沙哑单薄的成年男声
        pace: 偏慢，激动时字句紧促
        pitch: 中高音
    giant_hunter:
      display_name: 金胡子猎手
      tts:
        delivery: 戒备而强硬，受制时压住不甘
        timbre: 粗厚低沉的成年男声
        pace: 沉稳简短
        pitch: 低音
    boat_puller:
      display_name: 划手
      tts:
        delivery: 紧张谨慎，习惯听从猎手号令
        timbre: 粗粝的成年男声
        pace: 略快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二十五章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            第二天早晨，大家坐在早餐桌旁。海狼·拉森知道我已经上过甲板，便问外面的情形。我望着从敞开的升降口照进来的阳光，告诉他天很晴，西风也不错。照路易斯的判断，风还会继续加大。他满意地点了点头，又问有没有起雾的迹象。
        - id: ch01-b02
          speaker: humphrey
          text: 北面和西北面都有很厚的雾堤。
        - id: ch01-b03
          speaker: narrator
          text: >-
            他听了更加满意，接着问起“马其顿号”。我说还没看见它。我几乎敢断定，他的脸立刻沉了一下，可我怎么也不明白，他为什么会为这个消息失望。答案很快就来了。甲板上的舵手忽然高声报告。
        - id: ch01-b04
          speaker: helmsman
          text: 发现烟柱！
        - id: ch01-b05
          speaker: narrator
          text: >-
            拉森的脸顿时亮起来。
        - id: ch01-b06
          speaker: wolf_larsen
          text: 好！
        - id: ch01-b07
          speaker: narrator
          text: >-
            他马上离开餐桌，先到甲板上，又进了统舱。被赶出主舱的猎手们正在那里吃第一顿早餐。莫德和我几乎没有动面前的食物，只忧虑地互相看着。隔着舱壁，拉森的声音依然清楚。他讲了很久，最后那番话引起一阵疯狂的欢呼。我们听不清内容，却听得见随后那些兴奋的叫喊，知道猎手们已经被他说动。
        - id: ch01-b08
          speaker: narrator
          text: >-
            甲板上也忙起来。水手全被叫醒，准备放艇。莫德陪我上去，我让她留在艉楼前缘。她在那里既能看见，又不会置身其中。水手显然也知道计划，人人动作利落，干劲十足。猎手们一个接一个走上甲板，带着霰弹枪、弹药箱，还破例背上了步枪。远距离打死的海豹往往等不到小艇靠近就沉下去，所以平时没人愿意把步枪带上艇。可今天，每个猎手都有一支，还有大批子弹。西边驶来的“马其顿号”越来越近，烟柱越升越高。只要向那边看上一眼，猎手们便满意地咧嘴笑。
        - id: ch01-b09
          speaker: narrator
          text: >-
            五条艇迅速下水，像一把展开的扇子朝北散开，仍像前一天下午那样让“幽灵号”跟在后面。我好奇地看了很久，可一切和平日毫无区别。猎手们降帆，开枪打海豹，再把帆升起来继续走。“马其顿号”也照昨天的办法，抢先把自己的艇放到我们的前方，横断我们的航线，再次独吞海面。十四条艇要想从容捕猎，需要铺满一大片海面。它完全包住我方艇队后，仍朝东北开，一边走，一边放下更多小艇。
        - id: ch01-b10
          speaker: humphrey
          text: 到底有什么打算？
        - id: ch01-b11
          speaker: wolf_larsen
          text: >-
            别急着问。你用不了一千年就能看到。眼下先求老天多给我们一点风吧。算了，告诉你也行。我要让我的兄弟尝尝他自己的手段。我也要独占海面，而且要一直占到这个捕猎季结束，只要运气站在我们这边。
        - id: ch01-b12
          speaker: humphrey
          text: 要是运气不站在我们这边呢？
        - id: ch01-b13
          speaker: wolf_larsen
          text: 那就别想了。我们必须走运，否则一切都完了。
        - id: ch01-b14
          speaker: narrator
          text: >-
            拉森掌着舵，我便到前舱的临时病房去。那里躺着两个残伤的人，尼尔森和托马斯·马格里奇。尼尔森的断腿接合得不错，精神也还过得去。那个伦敦佬却陷在绝望里，让我对这不幸的人生出强烈的同情。残酷的岁月早把他瘦小的身体摧折成残骸，他竟然还活着，还紧抓住生命不放。那点生命之火，仍旧烧得很亮。我故意用轻快的口气宽慰他，说如今的假脚做得很好。装上一只，他还能在船上的厨房里跺着脚忙一辈子。
        - id: ch01-b15
          speaker: mugridge
          text: >-
            范韦登先生，您说的那些，我不知道。我只知道，只要那条地狱恶狗还没死透，我就别想快活。他一定活不过我。他不配活着。圣经说得明白，他必定要死。我说阿门，还得让他快点死，真他妈的。
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: >-
            回到甲板，我看见拉森主要用一只手掌舵，另一只手举着航海望远镜。他仔细巡视所有小艇，尤其盯着“马其顿号”的位置。我们的艇已经迎风抢驶，航向偏到正北以西好几个罗经点。我仍不懂这么做有什么用。前方空着的海面还被对方最上风的五条艇挡住，那五条艇也相继迎风抢驶。它们便渐渐向西散开，离自己那一长列艇的其余部分越来越远。我们的艇不但张着帆，还同时动用了三对桨，连猎手也亲自划，很快就追近了这群不妨称为敌人的家伙。
        - id: ch01-b17
          speaker: narrator
          text: >-
            “马其顿号”的烟已经缩成东北天边一小块模糊的污点，汽船本身早已看不见。“幽灵号”原先一直慢吞吞地挪动，船帆有一半时间都在抖着漏风。我们还曾两次短暂停航，任船漂泊。现在再也不能磨蹭了。拉森调整好所有帆脚索，逼“幽灵号”使出全部速度。我们先越过自己的艇队，然后改变方向，直扑敌方第一条上风艇。
        - id: ch01-b18
          speaker: wolf_larsen
          text: 范韦登，把最前面的三角帆降下去。准备把艏帆转到反面。
        - id: ch01-b19
          speaker: narrator
          text: >-
            我赶到船头，拉下三角帆并系牢。我们从小艇上风处一百英尺外掠过，艇上三个人戒备地盯着我们。他们独占了海面，也至少听说过海狼·拉森的名声。坐在艇首的是个巨大的斯堪的纳维亚猎手，步枪横在膝上，随时可以抄起，而不是放在枪架里。小艇来到船艉旁，拉森挥手向他们招呼。
        - id: ch01-b20
          speaker: wolf_larsen
          text: 上船来聊一场吧！
        - id: ch01-b21
          speaker: narrator
          text: >-
            捕海豹的人说“聊一场”，既是登门拜访，也是闲谈叙话。海上生活单调，这正好满足水手爱说话的性情。“幽灵号”迎风转向，我做完船头的活，又赶去船艉帮忙收主帆脚索。拉森走向客人前，特意让莫德和我都留在甲板上。
        - id: ch01-b22
          speaker: narrator
          text: >-
            小艇降下帆，靠了上来。猎手翻过船舷，跳上甲板。一部金色大胡子衬着他的身材，活像海上的国王。不过，他再魁梧，也掩不住脸上的疑心和不安。他满脸都是浓密毛发，心事却一眼就能看穿。他看看拉森，又看看我，见这里只站着我们两人。再回头确认自己的两个水手也已上船，他脸上顿时露出轻松的神色。他确实没什么好怕。站在拉森身边，他像歌利亚一样高高耸立，足有六英尺八九英寸。后来我知道，他重二百四十磅，没有一点肥肉，全是骨头和肌肉。
        - id: ch01-b23
          speaker: narrator
          text: >-
            走到升降口上方，拉森请他下舱，他又迟疑起来。可他低头打量主人，见拉森虽然也是大汉，在自己身旁却显得矮小，便彻底放了心。两人一同走进主舱。两个水手则依照来访船员的习惯，去了前舱，也找人闲谈。忽然，主舱里爆出一声被扼住喉咙似的巨吼，接着传来猛烈搏斗的种种声响。那是一头豹子对一头狮子。狮子发出了全部声响，海狼·拉森才是豹子。
        - id: ch01-b24
          speaker: humphrey
          text: 你看，我们的待客之道多么神圣。
        - id: ch01-b25
          speaker: narrator
          text: >-
            我说得十分苦涩。莫德点点头，表示她听见了。暴力搏斗传到耳中，她脸上显出一阵恶心。我初上“幽灵号”的几个星期里，只要看见或听见这种场面，也曾被同样的感觉狠狠折磨。我劝她先到前面去，从统舱升降口下去，等搏斗结束再回来。她摇摇头，哀伤地看着我。她并不是害怕，而是眼前这赤裸裸的人类兽性让她惊骇。
        - id: ch01-b26
          speaker: humphrey
          text: >-
            不管现在和接下来发生的事，逼得我参与到什么地步，请你一定要明白，我别无选择。要是不这样做，你我就不可能活着逃出这场困境。对我来说，这一点也不光彩。
        - id: ch01-b27
          speaker: maud_brewster
          text: 我明白。
          emotion: sad
        - id: ch01-b28
          speaker: narrator
          text: >-
            她的声音虚弱而遥远，眼睛却让我确信，她真的明白。下面的搏斗声很快消失。拉森独自回到甲板，古铜色的脸皮底下微微泛红，身上再没有别的搏斗痕迹。他让我把两个陌生水手叫到船艉。一两分钟后，两人站到他面前。他说，他们的猎手决定留在船上多住一阵，也不想让小艇在船边颠簸碰撞，因此叫他们把艇吊进来。两人听了，迟疑着没有动。他再次开口时，语气立刻变得更尖锐。
        - id: ch01-b29
          speaker: wolf_larsen
          text: >-
            我说，把你们的小艇吊上来。谁知道呢，你们或许要跟着我航行一段日子。那就从一开始把关系处好。动作快点！死神·拉森一开口，你们可比现在利索得多。你们自己知道。
        - id: ch01-b30
          speaker: narrator
          text: >-
            他后面几句话说得很轻，却藏着柔软而可怕的威胁。两个水手听懂了，动作马上快了。艇刚在船内荡起来，我就被派到船头放开艏帆。拉森守在舵轮旁，驾着“幽灵号”追赶敌方第二条上风艇。此时，第三条艇正被我方两艇围攻，第四条由另外三艇攻击。第五条艇反过来参加防守，帮助离它最近的同伴。双方隔着很远便开了枪，枪声持续不断。风掀起短而急的浪，谁也难以瞄准。我们逐渐靠近时，不时看见子弹从一个浪尖嗖地跳向另一个浪尖。
        - id: ch01-b31
          speaker: narrator
          text: >-
            被我们追的艇已经转到顺风方向，想一边逃走，一边赶去帮助同伴抵挡我方艇队。我忙着照管帆脚索和帆角索，几乎看不到战况。后来恰好站在艉楼，听见拉森命令两个陌生水手到前舱去。他们走得很不情愿，却还是服从了。他又转向莫德，命令她下舱。她眼里猛然涌出恐惧，他看见了，反倒露出微笑。
        - id: ch01-b32
          speaker: wolf_larsen
          text: >-
            下面没什么吓人的，只有一个没受伤的人牢牢绑在铁环上。子弹可能飞到船上来，我可不想让你送命。
        - id: ch01-b33
          speaker: narrator
          text: >-
            他说话的同时，一颗子弹击中他两手之间包着铜头的舵轮辐条，斜弹出去，尖啸着飞向上风一侧。他让莫德看清这危险，便把舵交给我。莫德已经走进升降口，只露出头来。拉森拿起步枪，把子弹推入枪膛。我用眼神求她下去，她却笑了。
        - id: ch01-b34
          speaker: maud_brewster
          text: >-
            我们这些陆地上的软弱生物，也许没有在海上行走的腿，可我们至少能让拉森船长知道，我们和他一样勇敢。
        - id: ch01-b35
          speaker: narrator
          text: >-
            拉森赞赏地瞥了她一眼。
        - id: ch01-b36
          speaker: wolf_larsen
          text: >-
            就凭这句话，我对你的喜欢又多了一倍。你有学问，有头脑，也有胆量，样样都不缺。这样的才女，正配做海盗头子的妻子。咳，我们以后再谈这个。
        - id: ch01-b37
          speaker: narrator
          text: >-
            又一颗子弹结结实实打进舱壁。拉森笑着，眼里闪过金光。莫德眼中的恐惧却越来越深。我连忙插话。
        - id: ch01-b38
          speaker: humphrey
          text: 我们其实比你更勇敢。至少我知道，我比拉森船长更勇敢。
        - id: ch01-b39
          speaker: narrator
          text: >-
            他飞快看向我，猜不透我是不是在讥讽。我转动几根舵轮辐条，抵消“幽灵号”朝上风偏去的势头，再把航向稳住。他仍等着解释，我指向自己的膝盖。
        - id: ch01-b40
          speaker: humphrey
          text: >-
            你看，它们在发抖。我害怕，肉体在怕，心里也怕，因为我不愿意死。可我的精神管住了发抖的肉体，也压住了心里的恐惧。所以我不只是无所畏惧，我拥有真正的勇气。你从身体到心里都不害怕。面对危险，你不必付出任何代价，甚至还能从中得到快乐。拉森先生，你当然不怕，可真正的勇气在我这边。
        - id: ch01-b41
          speaker: wolf_larsen
          text: >-
            你说得对。我从没从这个角度想过。可反过来也说得通吗？既然你比我勇敢，我是不是就比你怯懦？
        - id: ch01-b42
          speaker: narrator
          text: >-
            我们都被这个荒唐结论逗笑了。他蹲下，把步枪架在船舷上。先前射来的子弹飞了近一英里，如今距离已经缩短一半。他仔细射出三枪。第一枪落在艇的上风处五十英尺外，第二枪落在艇边，第三枪击中了掌舵手。那人松开舵桨，蜷缩着倒进艇底。
        - id: ch01-b43
          speaker: wolf_larsen
          text: >-
            这样应该能治住他们。我不能射猎手，划手又可能不会掌舵。若真是这样，猎手就没法同时掌舵和开枪。
        - id: ch01-b44
          speaker: narrator
          text: >-
            他的判断完全正确。小艇马上失去控制，猛冲向上风。猎手只得跳到艇尾，接替受伤的掌舵手。他们没有再射击，其他艇上的枪却仍欢快地响个不停。猎手终于让艇重新转回顺风方向，继续逃跑，可“幽灵号”的速度至少是它的两倍。相距一百码时，我看见划手把一支步枪递给猎手。拉森走到船中，从栓钉上解下一卷喉索，然后端平步枪，从船舷上方瞄住他们。我两次看见猎手腾出一只手去拿枪，又两次看见对方犹豫。转眼间，我们已经来到小艇旁边，卷着白沫从它身边掠过。
        - id: ch01-b45
          speaker: wolf_larsen
          text: 喂，划船的！把绳子绕上去！
        - id: ch01-b46
          speaker: narrator
          text: >-
            拉森同时把绳圈抛过去，正中划手，险些将他砸倒。那人却先看猎手，等他下令。猎手陷入两难。枪在膝间，可他一放开舵桨，小艇就会猛转过来撞上纵帆船。拉森的枪口又稳稳对着他。他明白，自己还没来得及举枪就会中弹。
        - id: ch01-b47
          speaker: giant_hunter
          text: 把绳子绕上。
        - id: ch01-b48
          speaker: narrator
          text: >-
            划手在前面的横座板上绕了一圈绳子，任它猛然绷紧。小艇随即向外斜荡，猎手把它稳在离“幽灵号”二十英尺远的平行航向上。
        - id: ch01-b49
          speaker: wolf_larsen
          text: 把帆降下来，靠到船边！
        - id: ch01-b50
          speaker: narrator
          text: >-
            拉森一直端着步枪，连递下滑车吊索也只用一只手。艇首艇尾都系好后，两个没受伤的人准备登船。猎手拿起枪，装作要把它放稳。
        - id: ch01-b51
          speaker: wolf_larsen
          text: 扔下！
          emotion: angry
        - id: ch01-b52
          speaker: narrator
          text: >-
            猎手马上松手，像是被滚烫的枪身灼伤。两名俘虏登船后，吊起小艇，再照拉森的吩咐把受伤的掌舵手抬进前舱。拉森对我说，要是我方五条艇都像我们这么顺利，船员很快就会多得装不下。莫德颤着声音询问中枪的人，却连一句完整的话也说不出来。
        - id: ch01-b53
          speaker: maud_brewster
          text: 你射中的那个人，他没有……但愿他没有……
          emotion: fearful
        - id: ch01-b54
          speaker: wolf_larsen
          text: >-
            只伤了肩膀，没什么严重的。范韦登三四个星期就能让他完全复原。可那边几个，看样子他就救不回来了。那是霍纳和斯莫克的手笔。我告诉过他们，我们要活人，不要尸体。可学会开枪以后，射中目标的快感实在难以抵抗。范韦登，你体验过吗？
        - id: ch01-b55
          speaker: narrator
          text: >-
            我摇了摇头，望向“马其顿号”的第三条艇。这正是我刚才一直掌舵追赶、如今几乎与我们并行的那条。霍纳和斯莫克已经离开它，加入另外三条艇，去围攻最后两个敌人。他们留下的场面确实血腥。空艇横在浪槽里，醉酒似的滚过一道道浪脊。斜桁帆松脱了，与艇身成直角伸着，在风中翻飞拍打。猎手和划手都以别扭的姿势倒在艇底。掌舵手横搭在船舷上，半身在内，半身在外。两条手臂拖进水里，头随着艇身左右摇晃。我先前求莫德不要看。她听从了我，没有见到这幅景象，我为此十分庆幸。
        - id: ch01-b56
          speaker: wolf_larsen
          text: 范韦登，直朝那群艇开过去。
        - id: ch01-b57
          speaker: narrator
          text: >-
            等我们渐渐靠近，枪声停了下来。战斗已经结束。最后两条艇也被我方五条艇俘获，如今七条艇聚在一起，等着大船过去接走。我忽然看见东北方，忍不住叫出声，还伸手指向那里。代表“马其顿号”位置的烟斑重新出现了。拉森平静地说，他一直在看。他先估算我们离雾堤还有多远，又停了一瞬，让脸颊感受此刻的风有多大。
        - id: ch01-b58
          speaker: wolf_larsen
          text: >-
            我想我们赶得上。不过我那位该死的兄弟肯定已经看穿这场游戏，正在拼命追来。啊，看那里！烟越来越黑了。可我还是会抢在你前面，我的好兄弟。我会赢你，只希望你别把那些老机器逼得太狠，最多把它们折腾成废铁。
        - id: ch01-b59
          speaker: narrator
          text: >-
            我们停船接艇。甲板上仓促忙乱，却没有失去秩序。小艇同时从四面八方靠近。俘虏一翻过船舷，我方猎手便把他们排好，赶往前舱。水手们则匆匆吊起小艇，随处放在甲板上，根本顾不上停下来系牢。最后一条艇才刚离开水面，还在滑车吊索间摇摆，“幽灵号”已经重新开动。全部船帆都升了起来，饱满地吃住风。帆脚索也逐渐放松，让船改借横风疾驶。
        - id: ch01-b60
          speaker: narrator
          text: >-
            我们必须争分夺秒。“马其顿号”从东北冲来，烟囱吐出最浓最黑的烟。它顾不上仍留在海上的其余小艇，已经改变航向，要抢在我们前头。它没有直接追向“幽灵号”，而是扑向我们的前方。两船的航线像一个角的两边，在雾堤边缘交会。“马其顿号”只有在那里才有希望截住我们，错过那里便再无机会。“幽灵号”若要脱身，就必须赶在汽船到达以前，先越过那个交点。
        - id: ch01-b61
          speaker: narrator
          text: >-
            拉森亲自掌舵，眼睛明亮锐利，在追逐的每一个细节间跳动。他一会儿看上风海面，寻找风力减弱或增强的迹象。一会儿盯住“马其顿号”。接着又巡视每一面帆，叫人把这里的帆脚索放一点，把那里的收一点，榨出“幽灵号”拥有的最后一分速度。所有积怨和仇恨都被忘掉了。那些长期忍受拉森暴虐的船员，此刻竟敏捷地扑向每一道命令。船身起伏着冲刺，倾斜着飞奔，我忽然想起可怜的约翰逊，遗憾他不能活着站在这里亲眼看见。他曾那么爱“幽灵号”，也那么欣赏它的航行本领。
        - id: ch01-b62
          speaker: wolf_larsen
          text: 猎手们，把步枪准备好。
        - id: ch01-b63
          speaker: narrator
          text: >-
            五名猎手持枪排在下风舷边。“马其顿号”已不到一英里，烟囱里的黑烟被速度压成直角。它以十七节的速度猛击海面。拉森望着它，念了一句，说它正在咸水里飞也似的狂奔。我们的速度不到九节，可雾堤近在眼前。
        - id: ch01-b64
          speaker: narrator
          text: >-
            “马其顿号”的甲板上突然冒出一团烟，沉重的炮声随即传来。紧绷的主帆上出现一个圆洞。传闻那艘船装着小炮，果然不假。我们的船员聚在船中，朝对方挥动帽子，发出嘲笑的欢呼。又一团烟升起来，第二声巨响传到耳边。这次炮弹没有击中船体，而是落在船艉后二十英尺以内。它又朝上风方向连续跳过两道海面，最后才沉进水里。
        - id: ch01-b65
          speaker: narrator
          text: >-
            对方始终没有用步枪。原来，他们所有的猎手不是仍留在海上的小艇里，就是已经落到我们手里，成了俘虏。等两艘船只相隔半英里，第三颗炮弹又打过来，在主帆上穿出第二个圆洞。紧接着，我们一头驶进浓雾。潮湿而密实的雾像纱幕一样从四周罩下来，把船上的人和整艘“幽灵号”彻底遮蔽起来。
        - id: ch01-b66
          speaker: narrator
          text: >-
            这变化来得令人心惊。刚才，我们还在阳光下跳跃，头上是明净的天空，海浪翻滚破碎，一直铺到遥远的地平线。一艘吐出黑烟、火焰和铁弹的船正疯狂扑来。转瞬间，像是突然纵身一跃，太阳就被抹去了。天空不见了，连桅顶也隐没在雾中。我们的地平线，只剩泪眼所能望见的一小圈模糊边界。灰雾像雨一样从身边掠过。衣服上的每一丝绒毛，还有头发和脸上的每根汗毛，全挂上了晶莹的水珠。支索湿透，头顶的索具不断滴水。帆桁下方，一长排水滴成形了，在那里左右摇摆。船身每次猛地起伏，它们就脱落下来，在甲板上下起一阵短短的小雨。
        - id: ch01-b67
          speaker: narrator
          text: >-
            我觉得自己被关住了，空气也像遭到堵塞，几乎让人透不过气。船身向前冲，劈开波浪，那些声音撞上浓雾，又被抛回我们身边。人的思绪也是一样。心灵才想越过包围我们的湿幕，望向外面的世界，马上又退了回来。雾里的这一点空间仿佛就是世界，就是整个宇宙。它的边界近在眼前，让人忍不住想伸出双臂，把它向外推远。灰墙外面似乎不可能还有任何东西。其余一切都像一场梦，最多只剩一段梦的记忆。
        - id: ch01-b68
          speaker: narrator
          text: >-
            那感觉怪异极了，怪异得难以形容。我看向莫德，知道她也深受影响。再去看海狼·拉森，他的意识里却没有陷进半点主观感受。他全部心思都放在眼前实实在在的局面上，仍旧牢牢握着舵轮。每当“幽灵号”向前冲去，又随着海浪向下风倾斜，我都觉得他正在给时间计时，借船身每一次运动，数着一分钟又一分钟怎样过去。
        - id: ch01-b69
          speaker: wolf_larsen
          text: >-
            到前面去，别发出声音。准备下风满舵。先收起中桅帆，每一根帆脚索都派人守着。滑车不准响，也不准有人开口。听清了吗？一点声音也不能有。
        - id: ch01-b70
          speaker: narrator
          text: >-
            准备好以后，“下风满舵”的命令从一个人传向下一个人，最后来到我这里。“幽灵号”转上左舷抢风航向，几乎没有任何响动。只有几条缩帆索轻拍船帆，一两个滑轮发出吱呀声。在这片空洞、回声四起的雾幕里，那一点声音也显得幽灵般阴森。
        - id: ch01-b71
          speaker: narrator
          text: >-
            船仿佛才刚转稳，雾就忽然变薄。我们重新回到阳光下，辽阔的海面在眼前翻滚，一直铺向天边。可海上空无一物。愤怒的“马其顿号”没有冲出海面，黑烟也没有染污天空。拉森马上让船转到顺风航向，贴着雾堤边缘朝下风飞驶。他的计策已经很清楚。他从汽船上风处进入浓雾，任汽船抱着追上他的希望，盲目闯进去。自己却在掩护里转向，又从雾中驶出，沿着边缘奔向下风，准备从那里再次进去。只要这一招成功，他兄弟找到他的机会，比在草堆里找一根针还要小得多。
        - id: ch01-b72
          speaker: narrator
          text: >-
            他没有沿雾堤边缘走多远，便顺风转过前帆和主帆，再次升起中桅帆，掉头进入浓雾。就在进去的一刻，我敢说自己看见上风处浮出一个模糊的庞然大物。我立刻去看拉森。这时，我们自己已经被雾完全埋没，他却对我点了点头。他也看到了。那正是“马其顿号”。它猜中了拉森的调动，也赶来堵截，却只迟了一瞬，没有抢到前面。毫无疑问，我们已经从它眼前消失，在它看不见的地方成功逃脱。
        - id: ch01-b73
          speaker: wolf_larsen
          text: >-
            他不能一直追，早晚得回去接其余小艇。范韦登，派个人接舵，眼下保持航向，再把各班值更安排好。今晚我们不会停下来磨蹭。可我真愿意花五百美元，到“马其顿号”上待五分钟，听听我那兄弟怎样咒骂。
        - id: ch01-b74
          speaker: narrator
          text: >-
            别人接过舵后，他又对我交代起新俘虏的事。
        - id: ch01-b75
          speaker: wolf_larsen
          text: >-
            现在该欢迎这些新来的人了。给猎手们发足威士忌，再让几瓶酒悄悄送到前舱。我敢保证，明天他们每一个都会下艇，心满意足地替海狼·拉森捕猎，就像从前替死神·拉森捕猎一样。
        - id: ch01-b76
          speaker: humphrey
          text: 可他们不会像温赖特那样逃走吗？
        - id: ch01-b77
          speaker: wolf_larsen
          text: >-
            只要老猎手还有发言的份儿，他们就逃不了。新猎手每打到一张海豹皮，我便从中分给老猎手一美元。今天他们那么热心地打这场仗，至少有一半是为了这笔钱。你尽管放心，只要这件事由他们做主，就不会再有人逃跑。现在你最好到前面去，尽你的医务职责。那里一定有整整一病房的人在等着你。
