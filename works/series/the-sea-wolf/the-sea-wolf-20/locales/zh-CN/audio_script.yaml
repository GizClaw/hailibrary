audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
    kerfoot:
      display_name: 克尔富特
      tts:
        delivery: 粗率拘谨，被点名时局促含混
        timbre: 粗哑厚重的成年男声
        pace: 简短迟钝
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            那一天余下的时间再没出什么事。那阵刚起不久的小风暴打湿了我们的鳃，也就慢慢收住了。四等轮机员和三个加油工同海狼·拉森激烈争了一场，最后还是从船上的衣物箱里领了整套行头。他们被分到各条小艇的猎手手下，又各自排进船上的值勤班次，随后一股脑儿给赶进了船头的水手舱。他们一路都在抗议，声音却不敢放大。拉森已经显露出的性情叫他们害怕，而水手舱里很快传进他们耳中的那段惨事，更把他们仅剩的一点反抗念头也压了下去。
        - id: ch01-b02
          speaker: narrator
          text: >-
            我们从轮机员那里得知，获救的女人姓布鲁斯特。她一直沉睡，晚餐时，我还请猎手们说话轻些，别吵醒她。直到第二天早晨，她才终于出来。我原想让人把饭另送给她，免得她和大家同桌，拉森却一口否决。他质问我，她究竟算什么人，难道真高贵到不能坐在舱里的餐桌前，也不能和舱里这些人相处？
        - id: ch01-b03
          speaker: narrator
          text: >-
            她一入座，场面倒有几分可笑。猎手们忽然全成了闭紧壳的蛤蜊。只有乔克·霍纳和斯莫克还算自在，时不时偷偷看她一眼，也敢加入谈话。其余四个人始终把眼睛牢牢粘在盘子上，一口一口认真咀嚼，仿佛每一口都经过深思熟虑。两颊每动一下，耳朵也跟着摇晃一下，活像一群正在进食的牲口。
        - id: ch01-b04
          speaker: narrator
          text: >-
            拉森起初也不多说，别人问他，他才答。他当然不是难为情，恰恰相反。这个女人属于他从没见过的那一类，和他认识的任何女人都不同，所以他起了好奇心。他的目光很少离开她的脸，偶尔移开，也只是追随着她的双手或肩头。我也在观察她。明明是我在支撑整桌的谈话，自己却有些拘谨，远谈不上从容。拉森则镇定自若，对自己有一种任什么都无法动摇的信心。他面对女人，和面对风暴、争斗时一样毫不畏缩。
        - id: ch01-b05
          speaker: maud_brewster
          text: 我们究竟什么时候能到横滨？
        - id: ch01-b06
          speaker: narrator
          text: >-
            她转向拉森，直直望着他的眼睛。这个问题问得毫不绕弯。桌旁的下巴全都停止咀嚼，刚才还随之摇晃的耳朵也不动了。人人的眼睛依旧牢牢盯着盘子，仿佛谁也没有在听，心思却全都扑在拉森将要给出的回答上。
        - id: ch01-b07
          speaker: wolf_larsen
          text: 四个月吧。要是这一季提早结束，也许只要三个月。
        - id: ch01-b08
          speaker: narrator
          text: >-
            她猛吸了一口气，话也说得断断续续。她原先明明得到过确切的消息，说横滨离这里只剩一天航程。说到一半，她停了下来，看了看桌边那一圈毫无同情的面孔。他们还是只顾用力盯住盘子，没有一个人肯抬起眼睛。
        - id: ch01-b09
          speaker: maud_brewster
          text: 这不对。这根本不合情理。
        - id: ch01-b10
          speaker: wolf_larsen
          text: >-
            那你得去问那边的范韦登先生。他专门懂得权利和公道。至于我，我只是个水手，想法自然不同。留在船上，对你也许是不幸，可对我们却是好运。
        - id: ch01-b11
          speaker: narrator
          text: >-
            拉森笑着看她。她先躲开了他的目光，随即又抬起眼睛，倔强地转向我。她没有说话，我却看得出她在问，这样做究竟对不对。我早已决定保持中立，只好沉默。
        - id: ch01-b12
          speaker: maud_brewster
          text: 那么，你认为呢？
        - id: ch01-b13
          speaker: humphrey
          text: >-
            的确很不幸。未来几个月里，要是你有必须践行的约定，那就尤其麻烦。不过你说去日本是为养病，我可以保证，没有哪里比“幽灵号”更能叫你恢复健康。
        - id: ch01-b14
          speaker: narrator
          text: >-
            她眼里立刻闪出怒光。我低下头，不敢再看她，脸也热了起来。这样做很怯懦，可我实在想不出别的办法。
        - id: ch01-b15
          speaker: wolf_larsen
          text: 范韦登先生说话，果然很有权威的气派。
        - id: ch01-b16
          speaker: narrator
          text: >-
            我点了点头。布鲁斯特小姐重新镇定下来，等着他继续说。
        - id: ch01-b17
          speaker: wolf_larsen
          text: >-
            他现在还不算什么，不过进步大得惊人。你真该看看他刚上船时的模样，又瘦又可怜，简直不像个人。克尔富特，是不是？
        - id: ch01-b18
          speaker: narrator
          text: >-
            克尔富特突然被点到名字，手里的餐刀都吓得掉在地上。
        - id: ch01-b19
          speaker: kerfoot
          text: 是这样。
        - id: ch01-b20
          speaker: wolf_larsen
          text: 削土豆、洗盘子，把身子练出来了。对不对，克尔富特？
        - id: ch01-b21
          speaker: kerfoot
          text: 没错。
        - id: ch01-b22
          speaker: wolf_larsen
          text: >-
            看看他现在。肌肉虽然不算发达，好歹已经有了肌肉，比刚来时强。两条腿也能站稳了。你看他现在，大概想不到，他起先连自己站住都办不到。
        - id: ch01-b23
          speaker: narrator
          text: >-
            猎手们偷偷发笑，布鲁斯特小姐却同情地看了我一眼。那一点温情，足以抵掉拉森的所有刻薄。我太久没得到过别人的同情，心顿时软了。从那一刻起，我心甘情愿地做了她忠实的奴仆。可我也恼火起来。拉森每一句讥讽都在挑战我的男子气概，甚至在挑战这两条据说由他亲手帮我练出来的腿。
        - id: ch01-b24
          speaker: humphrey
          text: 我的确学会了靠自己的两条腿站立，可还没学会用它们踩在别人身上。
        - id: ch01-b25
          speaker: narrator
          text: 拉森傲慢地瞧了我一眼。
        - id: ch01-b26
          speaker: wolf_larsen
          text: 那么，你的教育才完成了一半。
        - id: ch01-b27
          speaker: narrator
          text: 他冷冷说完，又转向布鲁斯特小姐。
        - id: ch01-b28
          speaker: wolf_larsen
          text: >-
            “幽灵号”待客一向热情，范韦登先生已经领教过了。为了让客人像在家里一样自在，我们什么都肯做。是不是，范韦登先生？
        - id: ch01-b29
          speaker: humphrey
          text: >-
            是啊，还让客人削土豆、洗盘子。为了表示亲热，甚至可以把客人的脖子拧断。
        - id: ch01-b30
          speaker: wolf_larsen
          text: >-
            布鲁斯特小姐，请别让范韦登先生害你误会我们。你看，他腰里还插着短刀。船上的高级船员这样打扮，可不寻常。他这个人本来很不错，偶尔却有点好斗，我们才不得不用严厉手段管束他。他平静时很讲理，也很公正。现在他正好没有发作，绝不会否认，就在昨天，他还威胁要杀我。
        - id: ch01-b31
          speaker: narrator
          text: >-
            我气得几乎喘不过气，眼睛里也一定在冒火。拉森偏偏叫她仔细看我。
        - id: ch01-b32
          speaker: wolf_larsen
          text: >-
            瞧，他在你面前已经快管不住自己了。他本来就不习惯和女士相处。以后我再同他一起上甲板，只怕得先带上武器才敢去。太糟了，真是太糟了。
        - id: ch01-b33
          speaker: narrator
          text: >-
            他悲伤似的摇着头，猎手们顿时放声大笑。那些深海汉子的嗓音在狭窄的船舱里滚动、轰鸣，听来有一种说不出的野蛮。四周本来也处处野蛮。看着与这里格格不入的布鲁斯特小姐，我第一次发现，自己早已融进了这一切。我认识这些人，也明白他们脑子里的想法。我吃着捕海豹人的饭，过着捕海豹人的生活，连脑子里转的，也大半是捕海豹的事。粗糙的衣服、粗野的脸孔、狂放的笑声，还有颠簸不定的舱壁和摇来荡去的船灯，全都不再使我觉得陌生。
        - id: ch01-b34
          speaker: narrator
          text: >-
            我正往面包上抹黄油，忽然看见自己的手。所有指关节都擦破了，发炎红肿，手指也肿胀着，指甲边嵌满了黑垢。我能感觉到颈上的胡须厚得像褥垫，也知道外套袖子已经扯破，身上那件蓝衬衫的领口还少了一颗纽扣。拉森刚才提到的短刀，就安稳地插在我胯旁的刀鞘里。它待在那里，本来再自然不过。可我直到借她的眼睛重新看它，才明白这把刀，还有同它连在一起的一切，在她眼里会有多么怪异。
        - id: ch01-b35
          speaker: narrator
          text: >-
            她明白拉森只是在嘲弄我，又递来一个同情的眼神。但她眼里也带着困惑。那些骇人的话若是真的，反而容易明白。偏偏拉森把它们全当成玩笑，这就让眼前的局面更加扑朔迷离。
        - id: ch01-b36
          speaker: maud_brewster
          text: 也许会有哪条过路船，把我接走呢？
        - id: ch01-b37
          speaker: wolf_larsen
          text: 不会有过路船。除了别的捕海豹纵帆船，这里什么船也没有。
        - id: ch01-b38
          speaker: maud_brewster
          text: >-
            可我没有衣服，什么也没带。先生，你似乎还没明白，我不是男人，也从没过过你们这种漂泊而随便的生活。
        - id: ch01-b39
          speaker: wolf_larsen
          text: >-
            那就越早习惯越好。我可以给你布料、针和线。亲手给自己做一两件衣服，总不至于苦得受不了吧。
        - id: ch01-b40
          speaker: narrator
          text: >-
            她撇了撇嘴，特意做了个苦相，像是在公开承认自己根本不会做衣服。我看得很清楚，她既害怕又茫然，却还在勇敢地撑着，拼命不让别人看出来。
        - id: ch01-b41
          speaker: wolf_larsen
          text: >-
            我猜，你和范韦登先生一样，习惯了凡事都由别人替你做。自己动手做几件事，不会让你的关节脱臼。对了，你靠什么谋生？
        - id: ch01-b42
          speaker: narrator
          text: 她毫不掩饰惊讶，只管望着他。
        - id: ch01-b43
          speaker: wolf_larsen
          text: >-
            相信我，我没有冒犯你的意思。人总得吃饭，也就必须设法弄到吃饭的本钱。这些人靠猎海豹活命，我为了同一个缘故驾驶纵帆船。范韦登先生呢，至少眼下，他也靠替我做事，挣到一份带咸味的口粮。现在说说你吧。你到底做什么？
        - id: ch01-b44
          speaker: narrator
          text: 她只耸了耸肩。
        - id: ch01-b45
          speaker: wolf_larsen
          text: 你能自己养活自己，还是一直由别人养你？
        - id: ch01-b46
          speaker: maud_brewster
          text: 恐怕我大半辈子都是由别人养活的。
        - id: ch01-b47
          speaker: narrator
          text: >-
            她笑着接下他的戏弄，想让自己显得勇敢些。但她看着拉森时，眼里的恐惧已经出现，而且越来越深。
        - id: ch01-b48
          speaker: wolf_larsen
          text: 你的床，大概也一直是别人替你铺的吧？
        - id: ch01-b49
          speaker: maud_brewster
          text: 我也亲手铺过床。
        - id: ch01-b50
          speaker: wolf_larsen
          text: 经常吗？
        - id: ch01-b51
          speaker: narrator
          text: 她故意露出一脸委屈，摇了摇头。
        - id: ch01-b52
          speaker: wolf_larsen
          text: >-
            在美国，像你这样不劳动养活自己的可怜男人，你知道他们会有什么下场吗？
        - id: ch01-b53
          speaker: maud_brewster
          text: 这个我真不懂。那些和我一样的可怜男人，会怎么样呢？
        - id: ch01-b54
          speaker: wolf_larsen
          text: >-
            他们会进监狱。男人不劳动谋生，罪名叫流浪罪。要是我像范韦登先生一样，整天讲是非和公道，我就要问，你什么也没做，凭什么有权活着？
        - id: ch01-b55
          speaker: maud_brewster
          text: 可你不是范韦登先生。所以，我不用回答，是不是？
        - id: ch01-b56
          speaker: narrator
          text: >-
            她眼里明明全是恐惧，却仍朝拉森灿然一笑。那笑容里的哀楚直刺我的心。我必须插进来，把话题带到别处。
        - id: ch01-b57
          speaker: wolf_larsen
          text: 你到底有没有靠自己的劳动，挣到过一块钱？
        - id: ch01-b58
          speaker: narrator
          text: >-
            他早就认定她答不上来，声音里满是得意的恶意。
        - id: ch01-b59
          speaker: maud_brewster
          text: >-
            当然挣过。小时候有一次，我整整五分钟没出声，父亲就给了我一块钱。
        - id: ch01-b60
          speaker: narrator
          text: >-
            她答得很慢。拉森脸上那副胜券在握的神气一下垮了，我看着他泄气的模样，差点当场笑出声来。可他很快又换上一副宽容的笑容。
        - id: ch01-b61
          speaker: maud_brewster
          text: >-
            不过，那已经是很久以前的事。你总不能要求一个九岁的小姑娘自己谋生吧。至于现在，我每年大约能挣一千八百块钱。
        - id: ch01-b62
          speaker: narrator
          text: >-
            桌旁所有人的眼睛一起离开盘子，转到了她身上。一个一年能挣一千八百块钱的女人，当然值得一看。就连拉森也毫不掩饰自己的赞赏。
        - id: ch01-b63
          speaker: wolf_larsen
          text: 领薪水，还是按件算钱？
        - id: ch01-b64
          speaker: maud_brewster
          text: 按件算钱。
        - id: ch01-b65
          speaker: wolf_larsen
          text: >-
            一千八百块，那就是每月一百五十块。布鲁斯特小姐，“幽灵号”可不小气。你留在船上的这段日子，我们照样给你算薪水。
        - id: ch01-b66
          speaker: narrator
          text: >-
            她没有作出任何回应，连一点谢意也没有表示。她还不熟悉这个男人突如其来的怪念头，更不知道下一刻又会冒出什么，实在没办法若无其事地接受这份所谓的薪水。
        - id: ch01-b67
          speaker: wolf_larsen
          text: >-
            我还没问你做哪一行。你生产什么东西？又要用什么工具和材料？
        - id: ch01-b68
          speaker: maud_brewster
          text: 纸和墨水。对了，还要一台打字机。
        - id: ch01-b69
          speaker: narrator
          text: 她笑了。我却慢慢说出一个名字，语气肯定得几乎像在指控她。
        - id: ch01-b70
          speaker: humphrey
          text: 你是莫德·布鲁斯特。
        - id: ch01-b71
          speaker: maud_brewster
          text: 你怎么知道？
        - id: ch01-b72
          speaker: humphrey
          text: 难道你不是？
        - id: ch01-b73
          speaker: narrator
          text: >-
            她点头承认了自己的身份。现在轮到拉森困惑了。莫德·布鲁斯特这个名字带着怎样的魔力，对他毫无意义。我却完全明白，而且为此感到自豪。经过这段漫长而疲惫的日子，我第一次清清楚楚地感觉到，自己总算有一点胜过了他。
        - id: ch01-b74
          speaker: humphrey
          text: 我记得，我曾替你一本薄薄的小书写过书评。
        - id: ch01-b75
          speaker: maud_brewster
          text: 原来写那篇书评的人就是你！
          emotion: surprised
        - id: ch01-b76
          speaker: narrator
          text: >-
            她睁大眼睛看着我。我点点头，也承认了自己的身份。
        - id: ch01-b77
          speaker: maud_brewster
          text: 汉弗莱·范韦登。真是太好了。
        - id: ch01-b78
          speaker: narrator
          text: >-
            她如释重负地叹了口气，却没发现，自己说这句话时，曾带着这份安心看了拉森一眼。正是这一眼，让她刚才的话显得有些尴尬。她很快也意识到了，马上匆匆换了话头。
        - id: ch01-b79
          speaker: maud_brewster
          text: 我记得那篇书评。你把我夸得实在太高了。
        - id: ch01-b80
          speaker: humphrey
          text: >-
            一点也不高。你这样说，岂不是怀疑我的判断，还叫我的评论标准一文不值？别的评论家也都赞同我。朗格不是把你的《忍受的吻》，列进英语女诗人最杰出的四首十四行诗了吗？
        - id: ch01-b81
          speaker: maud_brewster
          text: 可你把我叫作美国的梅内尔夫人！
        - id: ch01-b82
          speaker: humphrey
          text: 难道这话不对？
        - id: ch01-b83
          speaker: maud_brewster
          text: 不是对不对的问题。那句话伤了我。
        - id: ch01-b84
          speaker: humphrey
          text: >-
            要认识未知的人，总得拿已经熟悉的人来衡量。身为评论家，我当时非得替你找到一个位置。现在你自己已经成了衡量别人的标尺。我的书架上有你七本薄诗集，还有两本厚些的散文集。请原谅我这样说，那两本散文同你的诗完全一样出色，我都不知道这番比较究竟抬高了哪一边。用不了多久，英国也会出现一个无人认识的新人。到那时，评论家就会称她为英国的莫德·布鲁斯特。
        - id: ch01-b85
          speaker: maud_brewster
          text: 你实在太客气了。
        - id: ch01-b86
          speaker: narrator
          text: >-
            她低声说着最寻常不过的客套话。可是那种语气和措辞，带着我熟悉的旧日生活，一下把地球另一边的世界带回我心里。回忆丰富而甜美，尖锐的思乡之痛也藏在其中。
        - id: ch01-b87
          speaker: humphrey
          text: 而你就是莫德·布鲁斯特。
        - id: ch01-b88
          speaker: maud_brewster
          text: >-
            而你就是汉弗莱·范韦登。真是不可思议，我完全想不明白。不过，你那支严肃的笔，总不会准备写一部狂放浪漫的海上故事吧？
        - id: ch01-b89
          speaker: humphrey
          text: >-
            不会，我不是来搜集素材的。我既不擅长写小说，也没有那份兴致。
        - id: ch01-b90
          speaker: maud_brewster
          text: >-
            那你为什么总把自己埋在加利福尼亚？这样对我们可不厚道。东部的人见到你的机会太少了，实在太少。你毕竟是美国文坛的第二位泰斗呀。
        - id: ch01-b91
          speaker: narrator
          text: 我欠身接受她的恭维，嘴上却连连推辞。
        - id: ch01-b92
          speaker: humphrey
          text: >-
            有一次，我差点在费城见到你。那是个和勃朗宁有关的活动，你原本要去演讲。可惜我的火车晚了四个钟头。
        - id: ch01-b93
          speaker: narrator
          text: >-
            接下来，我们彻底忘了身在何处，只顾滔滔不绝地说着共同熟悉的人和事。猎手们一个个离开餐桌，上了甲板，我们还是谈个不停。只有拉森独自留在桌旁，被隔绝在这场谈话之外。过了许久，我才重新注意到他。他向后靠着椅背，好奇地听着这些对他而言十分陌生的话。我们谈论的是另一个世界，而那个世界，他一无所知。
        - id: ch01-b94
          speaker: narrator
          text: >-
            我的话说到一半，忽然停住。眼前的现实带着所有危险和忧虑，猛地朝我压了回来，撞得我头脑发晕。布鲁斯特小姐也在同一刻惊醒。她望向拉森，眼中一下涌出朦胧而说不清的恐惧。
        - id: ch01-b95
          speaker: narrator
          text: >-
            拉森站起身，笑得很不自在。那笑声没有半点温度，冷硬得像金属互相碰撞。
        - id: ch01-b96
          speaker: wolf_larsen
          text: 别管我。我不算什么。请继续吧，继续谈。
        - id: ch01-b97
          speaker: narrator
          text: >-
            可那扇刚刚敞开的谈话之门，已经彻底关上了。我们再也接不回方才的话题。我和她也从餐桌旁站起身，只能同样不自在地笑了笑。
