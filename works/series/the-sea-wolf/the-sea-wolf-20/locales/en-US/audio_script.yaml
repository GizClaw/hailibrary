audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: gentle, thoughtful, and composed even when uncertain
        timbre: soft and clear
        pace: measured and natural
        pitch: medium
    kerfoot:
      display_name: Kerfoot
      tts:
        delivery: guarded, awkward, and reluctant to draw attention
        timbre: rough and subdued
        pace: measured with hesitant pauses
        pitch: medium-low
  chapters:
    - id: ch01
      title: CHAPTER XX
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The rest of that day passed quietly. The young gale had done little more than soak us, and soon it began to ease. The fourth engineer and the three oilers had a heated meeting with Wolf Larsen. Afterward, they received clothes from the ship's stores. Each man was placed under one of the hunters, given a position in a boat and a watch aboard the vessel, then packed off to the forecastle. They went unwillingly and complained as they went, but they kept their voices low. What they had already seen of Wolf Larsen frightened them. Once the crew told them its own miserable story, the last of their rebellion disappeared.
        - id: ch01-b02
          speaker: narrator
          text: >-
            We had learned from the engineer that our passenger was Miss Brewster. She slept on and on, through the day and the night. At supper, I asked the hunters to lower their voices so they would not disturb her. She did not appear until the next morning. I had planned to serve her meals away from the men, but Wolf Larsen put an end to that idea. He demanded to know who she was that she should be considered too good for the cabin table and the people who ate there.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Her arrival at breakfast had a curious and amusing effect. The hunters went silent as clams. Only Jock Horner and Smoke seemed untroubled. They stole cautious glances at her now and then and even took part in the conversation. The other four kept their eyes fixed on their plates. They chewed steadily, with deep and serious concentration. Their ears moved and wobbled in time with their jaws until they looked like so many feeding animals.
        - id: ch01-b04
          speaker: narrator
          text: >-
            At first Wolf Larsen said very little and only answered when someone spoke to him. He was not shy. Nothing could have been further from the truth. Maud was simply unlike any woman he had ever known, and his curiosity held him. His eyes rarely left her face except to follow a movement of her hands or shoulders. I studied her too. Although I was the one who kept the conversation going, I felt shy and not quite master of myself. Wolf Larsen remained perfectly balanced and utterly sure of himself. A woman could no more make him timid than a storm or a battle could.
        - id: ch01-b05
          speaker: maud_brewster
          text: >-
            When will we reach Yokohama?
        - id: ch01-b06
          speaker: narrator
          text: >-
            She turned and looked him straight in the eyes. Every jaw at the table stopped. No one looked up from his plate, but every man waited hungrily for the answer.
        - id: ch01-b07
          speaker: wolf_larsen
          text: >-
            In four months. Perhaps three, if the season ends early.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Maud caught her breath.
        - id: ch01-b09
          speaker: maud_brewster
          emotion: surprised
          text: >-
            I... I was told Yokohama was only a day's sail away. This...
        - id: ch01-b10
          speaker: narrator
          text: >-
            She looked around the table. Every unsympathetic face remained bent over a plate.
        - id: ch01-b11
          speaker: maud_brewster
          emotion: angry
          text: >-
            This isn't right.
        - id: ch01-b12
          speaker: wolf_larsen
          text: >-
            You must settle that question with Mr. Van Weyden. He's our authority on rights. I'm only a sailor, so I see things differently. Staying with us may be your misfortune, but having you here is certainly our good fortune.
        - id: ch01-b13
          speaker: narrator
          text: >-
            He watched her with a smile. For a moment, his gaze forced her eyes down. Then she lifted them again and turned defiantly to me. The question in her face needed no words. Was any of this right? But I had already decided that the part I must play between her and Wolf Larsen was a neutral one. I refused to answer the question in her eyes.
        - id: ch01-b14
          speaker: maud_brewster
          text: >-
            What do you think?
        - id: ch01-b15
          speaker: narrator
          text: >-
            It's unfortunate, especially if you have obligations in the next few months. But you said you were going to Japan for your health. I can promise it won't improve anywhere more than it will aboard the Ghost.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Anger flashed in her eyes. I looked down, my face growing hot beneath her gaze. It was cowardly, but what else could I do?
        - id: ch01-b17
          speaker: wolf_larsen
          text: >-
            Mr. Van Weyden speaks with authority.
        - id: ch01-b18
          speaker: narrator
          text: >-
            He laughed. I nodded, and Maud mastered herself and waited.
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            Not that he's much to look at now, but he's improved wonderfully. You should have seen him when he first came aboard. He was the scrawniest, most pitiful specimen imaginable. Isn't that right, Kerfoot?
        - id: ch01-b20
          speaker: narrator
          text: >-
            The question startled Kerfoot so badly that his knife fell to the floor.
        - id: ch01-b21
          speaker: kerfoot
          text: >-
            Yes, that's right.
        - id: ch01-b22
          speaker: wolf_larsen
          text: >-
            Peeling potatoes and washing dishes built him up. Right, Kerfoot?
        - id: ch01-b23
          speaker: kerfoot
          text: >-
            Yes, that's right.
        - id: ch01-b24
          speaker: wolf_larsen
          text: >-
            Look at him now. I wouldn't call him muscular, but at least he has muscles. He even has legs to stand on. You'd never guess that when he arrived, he couldn't stand by himself.
        - id: ch01-b25
          speaker: narrator
          text: >-
            The hunters snickered, but Maud looked at me with a sympathy that repaid all of Wolf Larsen's cruelty. It had been so long since anyone had shown me that kind of feeling that her glance softened me completely. From that moment, I gladly became her willing servant. Still, my anger at Wolf Larsen rose. Every insult challenged my manhood. He was even challenging the strength of the very legs he claimed he had helped me gain.
        - id: ch01-b26
          speaker: narrator
          text: >-
            I may have learned to stand on my own legs, but I haven't learned to use them to trample other people.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Wolf Larsen gave me an insolent look.
        - id: ch01-b28
          speaker: wolf_larsen
          text: >-
            Then your education is only half finished. We are wonderfully hospitable on the Ghost. Mr. Van Weyden has learned that for himself. We do everything we can to make our guests feel at home. Don't we, Mr. Van Weyden?
        - id: ch01-b29
          speaker: narrator
          text: >-
            Certainly. We let them peel potatoes and wash dishes. In pure friendship, we may even wring their necks.
        - id: ch01-b30
          speaker: wolf_larsen
          text: >-
            Please don't let Mr. Van Weyden give you the wrong idea about us. You'll notice that he carries a dirk in his belt, which is very unusual for a ship's officer. He's a respectable man, really, but sometimes he becomes rather quarrelsome, and we must take firm measures. When he's calm, he's perfectly fair. Since he's calm now, he won't deny that he threatened my life only yesterday.
        - id: ch01-b31
          speaker: narrator
          text: >-
            I nearly choked. My eyes burned, and Wolf Larsen pointed out my fury to Maud.
        - id: ch01-b32
          speaker: wolf_larsen
          text: >-
            Look at him. He can barely control himself in front of you. He's not used to ladies. I'll have to arm myself before I dare go on deck with him. Too bad. Truly, too bad.
        - id: ch01-b33
          speaker: narrator
          text: >-
            The hunters roared with laughter. Their deep-sea voices rumbled and bellowed through the cramped cabin, and the sound itself seemed wild. Everything around us was wild. For the first time, as I looked at this strange woman and saw how little she belonged there, I understood how completely I had become part of that world. I knew these men and the way their minds worked. I lived the seal hunter's life, ate the seal hunter's food, and had begun to think the seal hunter's thoughts. The rough clothes, coarse faces, wild laughter, swinging sea lamps, and cabin walls that lurched with every wave no longer seemed strange to me.
        - id: ch01-b34
          speaker: narrator
          text: >-
            While I buttered a piece of bread, my eyes happened to rest on my hand. The skin was scraped and inflamed across every knuckle. My fingers were swollen, and black dirt circled each nail. I could feel the thick, mattress-like beard growing over my neck. My coat sleeve was torn, and one button was missing at the throat of my blue shirt. The dirk Wolf Larsen had mentioned rested in its sheath at my hip. It felt perfectly natural there. I had never understood just how natural until I saw it through Maud's eyes and knew how strange the weapon, my appearance, and everything behind them must seem to her.
        - id: ch01-b35
          speaker: narrator
          text: >-
            She knew Wolf Larsen had been mocking me and gave me another sympathetic glance. Yet she looked bewildered too. Knowing it was mockery only made the whole situation harder for her to understand.
        - id: ch01-b36
          speaker: maud_brewster
          text: >-
            Perhaps a passing ship could take me off.
        - id: ch01-b37
          speaker: wolf_larsen
          text: >-
            No ships will pass us except other sealing schooners.
        - id: ch01-b38
          speaker: maud_brewster
          text: >-
            I have no clothes. I have nothing. You don't seem to understand that I'm not a man, or that I'm not used to this wandering, careless life you and your men lead.
        - id: ch01-b39
          speaker: wolf_larsen
          text: >-
            Then the sooner you get used to it, the better. I'll give you cloth, needles, and thread. I hope making a dress or two won't be too terrible a hardship.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Maud twisted her mouth as if admitting she knew nothing about making dresses. She was frightened and confused, but she was fighting bravely to hide it.
        - id: ch01-b41
          speaker: wolf_larsen
          text: >-
            I suppose you're like Mr. Van Weyden. You're used to other people doing everything for you. A little work of your own won't dislocate any joints. By the way, how do you earn your living?
        - id: ch01-b42
          speaker: narrator
          text: >-
            She stared at him in open amazement.
        - id: ch01-b43
          speaker: wolf_larsen
          text: >-
            I mean no offense. Everyone must eat, so everyone must find the means to eat. These men shoot seals for their living. I sail this schooner for mine. For now, Mr. Van Weyden earns his salt food by helping me. What do you do?
        - id: ch01-b44
          speaker: narrator
          text: >-
            She only shrugged.
        - id: ch01-b45
          speaker: wolf_larsen
          text: >-
            Do you feed yourself, or does someone else feed you?
        - id: ch01-b46
          speaker: maud_brewster
          text: >-
            I'm afraid someone else has fed me for most of my life.
        - id: ch01-b47
          speaker: narrator
          text: >-
            She laughed and tried to meet his teasing in the same spirit. But as she watched him, I saw terror growing in her eyes.
        - id: ch01-b48
          speaker: wolf_larsen
          text: >-
            And someone else makes your bed, I suppose?
        - id: ch01-b49
          speaker: maud_brewster
          text: >-
            I have made beds.
        - id: ch01-b50
          speaker: wolf_larsen
          text: >-
            Did you make them often?
        - id: ch01-b51
          speaker: narrator
          text: >-
            She shook her head with a playfully sorrowful look.
        - id: ch01-b52
          speaker: wolf_larsen
          text: >-
            Do you know what happens in the United States to poor men who don't work for their living, just as you don't?
        - id: ch01-b53
          speaker: maud_brewster
          text: >-
            I'm terribly ignorant. What do they do to poor men like me?
        - id: ch01-b54
          speaker: wolf_larsen
          text: >-
            They send them to jail. Their crime is called vagrancy. If I were Mr. Van Weyden, always talking about right and wrong, I'd ask what right you have to live when you've done nothing to deserve it.
        - id: ch01-b55
          speaker: maud_brewster
          text: >-
            But since you aren't Mr. Van Weyden, I don't have to answer, do I?
        - id: ch01-b56
          speaker: narrator
          text: >-
            She smiled brightly at him, though terror still filled her eyes. She was trying to answer his attack in its own playful spirit, and the courage and sadness of that attempt cut me deeply. I could not bear to watch him press her much longer. Somehow, I had to break into the questioning and turn the conversation toward safer ground.
        - id: ch01-b57
          speaker: wolf_larsen
          text: >-
            Have you ever earned even one dollar through your own work?
        - id: ch01-b58
          speaker: narrator
          text: >-
            He demanded an answer, already certain she would say no.
        - id: ch01-b59
          speaker: maud_brewster
          text: >-
            Yes, I have. When I was a little girl, my father once paid me a dollar to stay completely quiet for five minutes.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Wolf Larsen's triumphant look vanished so quickly that I nearly laughed aloud. She had given him the answer he least expected, and for once his certainty had failed him. He recovered and smiled at her as if indulging a child.
        - id: ch01-b61
          speaker: maud_brewster
          text: >-
            But that was long ago, and you can hardly expect a nine-year-old girl to earn her own living. Now, though, I make about eighteen hundred dollars a year.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Every eye lifted from its plate and fixed on her. A woman who earned eighteen hundred dollars a year was suddenly worth seeing. Even Wolf Larsen showed his admiration.
        - id: ch01-b63
          speaker: wolf_larsen
          text: >-
            Is that a salary, or are you paid by the piece?
        - id: ch01-b64
          speaker: maud_brewster
          text: >-
            I'm paid by the piece.
        - id: ch01-b65
          speaker: wolf_larsen
          text: >-
            Eighteen hundred a year makes a hundred and fifty a month. The Ghost does nothing on a small scale, Miss Brewster. While you remain with us, consider yourself on salary.
        - id: ch01-b66
          speaker: narrator
          text: >-
            She made no reply. She did not yet know his whims well enough to accept one without being disturbed.
        - id: ch01-b67
          speaker: wolf_larsen
          text: >-
            I forgot to ask what kind of work you do. What do you produce, and what tools and materials do you need?
        - id: ch01-b68
          speaker: maud_brewster
          text: >-
            Paper and ink. Oh, and a typewriter too.
        - id: ch01-b69
          speaker: narrator
          text: >-
            She laughed, and suddenly I knew.
        - id: ch01-b70
          speaker: narrator
          text: >-
            You're Maud Brewster.
        - id: ch01-b71
          speaker: narrator
          text: >-
            I said it slowly and with such certainty that it almost sounded like an accusation. She looked at me curiously.
        - id: ch01-b72
          speaker: maud_brewster
          text: >-
            How do you know?
        - id: ch01-b73
          speaker: narrator
          text: >-
            Isn't that who you are?
        - id: ch01-b74
          speaker: narrator
          text: >-
            She admitted it with a nod. Now Wolf Larsen was the puzzled one. Her famous name and all the magic attached to it meant nothing to him. I was proud that it meant so much to me. For the first time in many weary months, I felt the full certainty of possessing something he did not. In that one corner of life, I was his superior, and I knew it.
        - id: ch01-b75
          speaker: narrator
          text: >-
            I remember reviewing one of your slim little books...
        - id: ch01-b76
          speaker: maud_brewster
          emotion: surprised
          text: >-
            You wrote that review!
        - id: ch01-b77
          speaker: narrator
          text: >-
            She stared at me in wide-eyed wonder, and I nodded.
        - id: ch01-b78
          speaker: maud_brewster
          emotion: happy
          text: >-
            Humphrey Van Weyden. I'm so glad.
        - id: ch01-b79
          speaker: narrator
          text: >-
            She sighed with relief and, without realizing it, glanced toward Wolf Larsen. Then she noticed how awkward her words might sound and hurried on.
        - id: ch01-b80
          speaker: maud_brewster
          text: >-
            I remember your review. It was far, far too flattering.
        - id: ch01-b81
          speaker: narrator
          text: >-
            Not at all. If you say that, you question my careful judgment and make my standards worthless. Besides, every other critic agreed with me. Didn't Lang name your “Kiss Endured” as one of the four greatest sonnets written by women in the English language?
        - id: ch01-b82
          speaker: maud_brewster
          text: >-
            But you called me the American Mrs. Meynell!
        - id: ch01-b83
          speaker: narrator
          text: >-
            Wasn't that comparison true?
        - id: ch01-b84
          speaker: maud_brewster
          emotion: sad
          text: >-
            No, not that. That hurt me.
        - id: ch01-b85
          speaker: narrator
          text: >-
            We can only measure the unknown by something already known. As a critic, I had to give my readers a way to place you. But now you have become the standard yourself. Seven of your slim volumes stand on my shelves, along with the two thicker books of essays. Forgive me for saying so, but those essays are fully equal to your poetry, and I cannot decide which body of work receives the greater compliment in the comparison. Before long, some unknown woman will appear in England, and the critics will call her the English Maud Brewster.
        - id: ch01-b86
          speaker: maud_brewster
          text: >-
            You are very kind, I'm sure.
        - id: ch01-b87
          speaker: narrator
          text: >-
            Her conventional words and tone belonged to my old life on the other side of the world. They sent a sudden thrill through me, warm with memory and sharp with homesickness.
        - id: ch01-b88
          speaker: narrator
          text: >-
            And you are Maud Brewster.
        - id: ch01-b89
          speaker: narrator
          text: >-
            I looked solemnly across the table at her.
        - id: ch01-b90
          speaker: maud_brewster
          text: >-
            And you are Humphrey Van Weyden. How extraordinary! I don't understand it. Surely your serious pen isn't planning some wildly romantic story of the sea.
        - id: ch01-b91
          speaker: narrator
          text: >-
            I promise I'm not collecting material. I have neither the talent nor the desire to write fiction.
        - id: ch01-b92
          speaker: maud_brewster
          text: >-
            Then tell me why you've always hidden yourself away in California. It hasn't been kind of you. We in the East have seen much too little of the Second Dean of American Letters.
        - id: ch01-b93
          speaker: narrator
          text: >-
            I bowed but rejected the compliment. Once, I almost met you in Philadelphia at some Browning event. You were going to lecture, but my train arrived four hours late.
        - id: ch01-b94
          speaker: narrator
          text: >-
            After that, we forgot where we were. We fell into a flood of literary gossip and left Wolf Larsen silent and stranded in the middle of it. The hunters finished their meal one by one and went on deck, but Maud and I continued talking. Wolf Larsen alone remained. At last I became aware of him again. He was leaning back from the table and listening with curiosity to our talk, which came from a world utterly foreign to him.
        - id: ch01-b95
          speaker: narrator
          text: >-
            I stopped halfway through a sentence. A moment before, my old world had seemed to surround us. Now the real cabin and all the danger and worry of the present came rushing back with stunning force. Maud felt the same blow. As she turned toward Wolf Larsen, a vague and nameless terror entered her eyes.
        - id: ch01-b96
          speaker: narrator
          text: >-
            He stood and gave an awkward laugh. It had a hard, metallic sound.
        - id: ch01-b97
          speaker: wolf_larsen
          text: >-
            Oh, don't mind me. I don't count. Please, go on. Go on.
        - id: ch01-b98
          speaker: narrator
          text: >-
            But our words were gone. Maud and I rose from the table too, and all three of us laughed awkwardly.
