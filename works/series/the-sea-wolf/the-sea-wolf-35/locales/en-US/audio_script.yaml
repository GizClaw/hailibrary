audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: controlled, confident, and quietly menacing
        timbre: deep and powerful
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER XXXV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            By the next day, the places for the masts were clear and everything was ready. We began getting the two topmasts aboard. The main topmast was more than thirty feet long, and the fore topmast was nearly thirty. I meant to lash them together as shears for lifting the other spars, but first I had to solve the puzzle of hauling them out of the water.
        - id: ch01-b02
          speaker: narrator
          text: >-
            I fastened one end of a heavy tackle to the windlass and the other to the butt of the fore topmast. Then I began to turn the crank while Maud held the rope on the windlass and neatly coiled the slack.
        - id: ch01-b03
          speaker: narrator
          text: >-
            To our surprise, the spar rose easily. The improved crank windlass gave us tremendous power. Of course, we paid for that power by hauling a much greater length of rope. As the mast came farther out of the water, the tackle dragged harder over the rail, and every turn of the windlass took more effort.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Then the butt reached the level of the rail, and the whole thing stopped.
        - id: ch01-b05
          speaker: narrator
          text: >-
            I should have expected this. Now we'll have to start all over again.
        - id: ch01-b06
          speaker: maud_brewster
          text: >-
            Couldn't you fasten the tackle farther down the mast?
        - id: ch01-b07
          speaker: narrator
          text: >-
            That's what I should have done in the first place.
        - id: ch01-b08
          speaker: narrator
          text: >-
            I was thoroughly disgusted with myself. I let out a turn, lowered the mast into the water, and moved the tackle to a point one-third of the way down from the butt. The heaving and the pauses to rest took an hour. At last eight feet of the butt stood above the rail, but I still could not bring the spar aboard.
        - id: ch01-b09
          speaker: narrator
          text: >-
            I sat down to think. The answer came quickly, and I jumped to my feet in delight.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Now I've got it! The tackle must be fastened at the balance point. Once we learn how to do this, we'll know how to lift everything else aboard.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Once more I lowered the mast and undid all our work. Then I judged the balance point wrongly. When I heaved again, the top of the mast came up instead of the butt. Maud looked hopeless, but I laughed and told her this end would do just as well.
        - id: ch01-b12
          speaker: narrator
          text: >-
            I showed her how to hold the turn and told her to be ready to let out rope when I called. Then I took the mast in my hands and tried to swing it across the rail. I thought I had found its balance and gave the word. But as Maud let the rope run, the spar swung upright in spite of me and dropped back toward the water.
        - id: ch01-b13
          speaker: narrator
          text: >-
            I hauled it up to the old position, because another idea had come to me. I remembered the watch-tackle, a small arrangement of one double block and one single block, and went to fetch it.
        - id: ch01-b14
          speaker: narrator
          text: >-
            While I rigged it between the top of the spar and the opposite rail, Wolf Larsen appeared. We said no more than good morning. Though he could not see, he sat out of the way on the rail and followed every sound I made.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Again I told Maud to let out rope at the windlass when I gave the word. I pulled on the watch-tackle. Slowly, the mast swung inward until it lay balanced across the rail at a right angle. Then, to my amazement, I found that Maud did not need to let out rope at all. We needed to do the opposite.
        - id: ch01-b16
          speaker: narrator
          text: >-
            I secured the watch-tackle and heaved at the windlass. Inch by inch, the mast came aboard. Its top tipped down to the deck, and finally the entire spar lay before us.
        - id: ch01-b17
          speaker: narrator
          text: >-
            I checked my watch. It was noon. My back ached, and I was exhausted and hungry. A single stick of timber on the deck was all we had to show for a whole morning. For the first time, I understood how enormous our task really was. Still, I was learning. I knew the afternoon's work would go much faster.
        - id: ch01-b18
          speaker: narrator
          text: >-
            And it did. We returned at one o'clock after a hearty dinner had rested and strengthened us. In less than an hour, the main topmast was on deck, and I began building the shears.
        - id: ch01-b19
          speaker: narrator
          text: >-
            I allowed for the different lengths of the two topmasts and lashed them together where they crossed. At that crossing point, I fixed the double block from the main throat halyards. With the single block and the halyards, it became our lifting tackle. I nailed thick wooden cleats to the deck so the bottoms of the masts could not slip.
        - id: ch01-b20
          speaker: narrator
          text: >-
            When all was ready, I tied a line to the top of the shears and led it straight to the windlass. By then I had begun to trust that machine. It gave me more power than I had ever expected. Maud held the turn as usual, I heaved, and the shears rose into the air.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Only then did I discover that I had forgotten the guy ropes. I had to climb the shears twice before I managed to brace them forward, aft, and on both sides. By the time I finished, twilight had come. Wolf Larsen had sat nearby all afternoon, listening without saying a word. Now he went to the galley and began making his supper.
        - id: ch01-b22
          speaker: narrator
          text: >-
            My lower back had grown so stiff that straightening up took effort and hurt. Even so, I looked proudly at what I had built. At last, our work was beginning to show. Like a child with a new toy, I could hardly wait to hoist something with my shears.
        - id: ch01-b23
          speaker: narrator
          text: >-
            I wish it weren't so late. I'd love to find out how well it works.
        - id: ch01-b24
          speaker: maud_brewster
          text: >-
            Don't be greedy, Humphrey. Tomorrow will come soon enough, and right now you're so tired you can barely stand.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Then I suddenly thought of her.
        - id: ch01-b26
          speaker: narrator
          text: >-
            What about you? You must be exhausted. You've worked so bravely and so hard. I'm proud of you, Maud.
        - id: ch01-b27
          speaker: maud_brewster
          text: >-
            Not half as proud as I am of you, and I have much more reason to be.
        - id: ch01-b28
          speaker: narrator
          text: >-
            For one moment, she looked straight into my eyes. There was something new in hers, a dancing, unsteady light that gave me a sudden thrill of happiness, though I did not understand why. She lowered her eyes. When she raised them again, she was laughing.
        - id: ch01-b29
          speaker: maud_brewster
          text: >-
            Imagine if our friends could see us now. Just look at us. Have you stopped even once to think how we look?
        - id: ch01-b30
          speaker: narrator
          text: >-
            I've thought about how you look quite often.
        - id: ch01-b31
          speaker: narrator
          text: >-
            I was still trying to understand what I had seen in her eyes and why she had changed the subject so suddenly.
        - id: ch01-b32
          speaker: maud_brewster
          text: >-
            Good heavens! And what do I look like, then?
          emotion: surprised
        - id: ch01-b33
          speaker: narrator
          text: >-
            Like a scarecrow, I'm afraid. Look at your wet, bedraggled skirts and those three-cornered tears. And that poor waist! Anyone could tell you've been cooking over a campfire and melting seal blubber. Then there's that cap on top of everything. And this is the woman who wrote A Kiss Endured.
        - id: ch01-b34
          speaker: narrator
          text: >-
            She gave me a grand and formal curtsy.
        - id: ch01-b35
          speaker: maud_brewster
          text: >-
            Now, sir, it is your turn.
        - id: ch01-b36
          speaker: narrator
          text: >-
            We teased each other for the next five minutes, but beneath the fun I could still feel something serious. I could only connect it with that strange, brief look in her eyes. Could our eyes be saying what our voices would not? I knew mine had spoken until I caught them doing it and forced them into silence. It had happened more than once. Had Maud seen the feeling in them and understood?
        - id: ch01-b37
          speaker: narrator
          text: >-
            And had her eyes spoken to me in the same way? What else could that trembling, dancing light have meant? There had been something more in it, something words could not describe. Yet I told myself it was impossible. I knew nothing about reading the language of eyes. I was only Humphrey Van Weyden, a bookish man in love. To love her, to wait, and perhaps to win her love one day seemed glorious enough.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Those thoughts stayed with me while we joked about our clothes. Then we reached the shore, and other matters demanded our attention.
        - id: ch01-b39
          speaker: narrator
          text: >-
            After supper, I complained that it was a shame we could not sleep through the night after working so hard all day.
        - id: ch01-b40
          speaker: maud_brewster
          text: >-
            But surely a blind man can't be dangerous now, can he?
        - id: ch01-b41
          speaker: narrator
          text: >-
            I'll never be able to trust him. Now that he's partly helpless, he may become more vicious than ever. But I know what I'll do first thing tomorrow. I'll put out a light anchor and pull the schooner away from the beach. Each night when we row ashore, Mr. Wolf Larsen will remain trapped aboard. This is the last night we'll have to keep watch, and knowing that will make it easier.
        - id: ch01-b42
          speaker: narrator
          text: >-
            We woke early. Daylight was just appearing as we finished breakfast.
        - id: ch01-b43
          speaker: maud_brewster
          text: >-
            Oh, Humphrey!
          emotion: fearful
        - id: ch01-b44
          speaker: narrator
          text: >-
            Her cry stopped sharply. She was staring at the Ghost in dismay. I followed her gaze but saw nothing strange. When I looked back at her, my face asked the question.
        - id: ch01-b45
          speaker: maud_brewster
          text: >-
            The shears.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Her voice trembled. I had forgotten all about them. I looked at the schooner again, but the shears were nowhere to be seen.
        - id: ch01-b47
          speaker: narrator
          text: >-
            He must have destroyed them.
          emotion: angry
        - id: ch01-b48
          speaker: narrator
          text: >-
            The words came out savagely. Maud laid her hand on mine in sympathy.
        - id: ch01-b49
          speaker: maud_brewster
          text: >-
            You'll have to start again.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Believe me, my anger means nothing. I couldn't harm a fly. The worst part is that he knows it. You're right. If he's destroyed the shears, all I can do is start over.
        - id: ch01-b51
          speaker: narrator
          text: >-
            A moment later, my anger burst out again. From now on, I'll keep watch aboard the ship. If he interferes again, I don't know what I'll do.
          emotion: angry
        - id: ch01-b52
          speaker: narrator
          text: >-
            Then I heard Maud speaking and came back to myself.
        - id: ch01-b53
          speaker: maud_brewster
          text: >-
            But I wouldn't dare stay ashore alone all night. If only he would be friendly and help us. Then all three of us could live comfortably aboard.
          emotion: fearful
        - id: ch01-b54
          speaker: narrator
          text: >-
            We will live aboard. You and I will, whether Wolf Larsen is friendly or not.
          emotion: angry
        - id: ch01-b55
          speaker: narrator
          text: >-
            I was still speaking fiercely because the loss of my beloved shears had struck me hard. Later, I laughed at both of us. It was childish of him to destroy things, and childish of me to become so angry over it.
        - id: ch01-b56
          speaker: narrator
          text: >-
            But when we climbed aboard and saw the ruin he had made, my heart sank. The shears were completely gone. The guy ropes had been slashed on every side. He had cut through every part of the throat halyards I had rigged, knowing that I did not know how to splice them.
        - id: ch01-b57
          speaker: narrator
          text: >-
            A new fear struck me, and I ran to the windlass. It would not turn. He had broken it. Maud and I stared at each other in horror. Then I rushed to the rail. The masts, booms, and gaffs I had freed were gone too. He had found the ropes holding them and set them adrift.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Tears filled Maud's eyes, and I truly believe she was crying for me. I could have cried too. How could we remast the Ghost now? Wolf Larsen had done his work thoroughly. I sat on the edge of the hatch with my chin in my hands, lost in despair.
        - id: ch01-b59
          speaker: narrator
          text: >-
            He deserves to die. God forgive me, but I'm not enough of a man to execute him myself.
          emotion: angry
        - id: ch01-b60
          speaker: narrator
          text: >-
            Maud came beside me and gently passed her hand through my hair as if I were a child.
        - id: ch01-b61
          speaker: maud_brewster
          text: >-
            There, there. It will come right in the end. We are in the right, so it must come right.
          emotion: calm
        - id: ch01-b62
          speaker: narrator
          text: >-
            I remembered Michelet and leaned my head against her. My strength truly returned. This blessed woman was an endless source of courage to me. After all, what had happened? It was only a setback and a delay. There had been no wind, and the tide could not have carried the masts far out to sea. We would have to find them and tow them back. That meant more work, nothing more.
        - id: ch01-b63
          speaker: narrator
          text: >-
            It had also taught me what to expect. Wolf Larsen might have waited until we had done much more and then destroyed our work even more completely.
        - id: ch01-b64
          speaker: maud_brewster
          text: >-
            Here he comes.
        - id: ch01-b65
          speaker: narrator
          text: >-
            I looked up. Wolf Larsen was walking at his ease along the port side of the raised afterdeck.
        - id: ch01-b66
          speaker: narrator
          text: >-
            Pretend you haven't noticed him. He's coming to watch our reaction, so don't give him the pleasure. Take off your shoes. Yes, that's it. Carry them in your hand.
        - id: ch01-b67
          speaker: narrator
          text: >-
            Then we began a game of hide-and-seek with the blind man. As he came forward along the port side, we slipped past him on the starboard side. From the afterdeck, we watched him turn and begin following our path toward the stern.
        - id: ch01-b68
          speaker: wolf_larsen
          text: >-
            Good morning.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Somehow, he must have known we were aboard. He spoke with complete confidence and waited for us to return the greeting. We said nothing. He wandered aft while we quietly moved forward.
        - id: ch01-b70
          speaker: wolf_larsen
          text: >-
            Oh, I know you're aboard.
        - id: ch01-b71
          speaker: narrator
          text: >-
            After calling out, he listened with all his attention. He reminded me of a great hoot owl waiting after its booming cry for frightened prey to stir. But we stayed silent and moved only when he moved.
        - id: ch01-b72
          speaker: narrator
          text: >-
            Hand in hand, we dodged around the deck like two children chased by a wicked ogre. At last, Wolf Larsen gave up in disgust and went below to the cabin.
        - id: ch01-b73
          speaker: narrator
          text: >-
            Our eyes shone with delight, and we held back our laughter as we put on our shoes and climbed over the side into the boat.
        - id: ch01-b74
          speaker: narrator
          text: >-
            I looked into Maud's clear brown eyes and forgot the harm Wolf Larsen had done. I knew only that I loved her, and that because of her I had the strength to win our way back to the world.
