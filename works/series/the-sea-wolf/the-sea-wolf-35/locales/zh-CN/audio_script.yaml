audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十五章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            第二天，桅座已经清理好，一切也准备妥当，我们开始把两根上桅弄上船。主上桅有三十多英尺，前上桅也将近三十英尺。我要用它们搭成人字架。这活儿很叫人伤脑筋，第一根圆材就把我难住了。我把沉重滑车的一头系在绞盘上，另一头拴住前上桅根部，自己摇绞盘，让莫德压住绳圈，再把收进来的松绳盘好。
        - id: ch01-b02
          speaker: narrator
          text: >-
            圆材升起来时轻松得出乎意料。改良过的曲柄绞盘给了我们极大的力量，可这份力量不是白来的。它把我的力气放大多少倍，我就得多收多少倍长的绳子。滑车沉重地拖过舷缘，圆材升出水面越多，阻力也越大，我摇得越来越吃力。等上桅根部刚好升到舷缘，一切却突然停住了。
        - id: ch01-b03
          speaker: humphrey
          text: 我早该想到。现在好了，只能全部重来。
        - id: ch01-b04
          speaker: maud_brewster
          text: 要不，把滑车系到桅杆中间靠下一点的地方？
        - id: ch01-b05
          speaker: humphrey
          text: 对，我一开始就该这么做。
        - id: ch01-b06
          speaker: narrator
          text: >-
            我真是厌烦透了自己。我松开一圈绳，把桅杆放回水里，再把滑车系到从根部往上三分之一的地方。折腾了一个钟头，中间摇一阵，歇一阵，终于有八英尺长的桅根越过舷缘。可离整根圆材上船还差得一样远。我坐下来琢磨这个难题。没过多久，我忽然找到了答案，高兴得跳了起来。
        - id: ch01-b07
          speaker: humphrey
          text: >-
            这下明白了！滑车应该系在平衡点上。这次摸清办法，往后再吊别的东西上船，也都能照着做。
        - id: ch01-b08
          speaker: narrator
          text: >-
            我又把桅杆放回水里，前面的力气再次白费。偏偏我还算错了平衡点，绞盘一动，升起来的是桅顶，不是桅根。莫德看上去已经绝望，我却笑着告诉她，这样也能成。
        - id: ch01-b09
          speaker: narrator
          text: >-
            我教莫德怎样压住绳圈，叫她听见口令就准备松绳。自己则用双手抱住桅杆，想让它越过舷缘，向船里倒下并稳住。时机似乎到了，我喊她放绳。可任凭我怎么使劲，圆材还是重新竖起来，往水面落去。我只好再次把它绞回原处。幸好这时又有了主意。我想起一副值班滑车，那是一个双轮滑车配上一个单轮滑车，赶紧去把它取来。
        - id: ch01-b10
          speaker: narrator
          text: >-
            我正把它装在圆材顶端和对面舷缘之间，海狼·拉森来到了甲板上。我们除了互相说一声早安，再没交谈。虽然他什么也看不见，还是坐到了不碍事的舷缘上，靠声音跟随着我做的一切。
        - id: ch01-b11
          speaker: narrator
          text: >-
            我再次嘱咐莫德，等我开口就松绞盘上的绳子，随后拉起值班滑车。桅杆慢慢摆进船内，横过舷缘，稳稳平衡下来。我这才惊讶地发现，莫德不但不必松绳，绞盘反而还得继续收。我系牢值班滑车，一英寸一英寸地把桅杆拉进来。桅顶终于斜落到甲板上，最后，整根桅杆都躺上了甲板。
        - id: ch01-b12
          speaker: narrator
          text: >-
            我看了一眼表，已经十二点。后背疼得厉害，人也又累又饿。整整一个上午，甲板上只有孤零零的一根木头能证明我们的成果。直到这时，我才真正明白，眼前的工程有多么浩大。不过，我确实正在学，一点点摸到了门道。下午一定能做成更多事。
        - id: ch01-b13
          speaker: narrator
          text: >-
            事实正是如此。我们吃了一顿丰盛的午饭，一点钟又回到船上，体力也恢复了。不到一个钟头，主上桅便上了甲板。我顾及两根上桅长短不一，把它们绑成人字架，在交叉处装上主桅喉部升降索的双轮滑车，再配好单轮滑车和喉部升降索。这就有了一套起重装置。为了不让桅根滑动，我还在甲板上钉了厚厚的止滑木。
        - id: ch01-b14
          speaker: narrator
          text: >-
            一切就绪，我从架顶牵出绳子，笔直系到绞盘上。我已经越来越相信那架绞盘，它给我的力量远远超过预料。莫德照旧压住绳圈，我负责摇动，人字架渐渐升上半空。这时我才想起，自己忘了支索。为了把前后左右都拉稳，我不得不爬上人字架，而且前后爬了两次。等到做完，暮色已经降临。
        - id: ch01-b15
          speaker: narrator
          text: >-
            海狼·拉森整个下午都坐在附近听着，一句话也没说。这会儿，他已经自行去了厨房准备晚饭。我的腰背僵硬酸痛，得忍着疼、费一番力气才能挺直身子。可我望着终于显出成果的人字架，心里满是骄傲。我像个刚得到新玩具的孩子，急得几乎发狂，恨不得马上用它吊起什么东西。
        - id: ch01-b16
          speaker: humphrey
          text: 天要是没这么晚就好了。我真想试试它好不好用。
        - id: ch01-b17
          speaker: maud_brewster
          text: 别这么贪心，汉弗莱。还有明天呢。你现在累得都快站不住了。
        - id: ch01-b18
          speaker: humphrey
          text: >-
            那你呢？你肯定也累坏了。今天你干了那么多活，还一直那么勇敢。莫德，我真为你骄傲。
        - id: ch01-b19
          speaker: maud_brewster
          text: 可我更为你骄傲，而且我的理由比你的充分多了。
        - id: ch01-b20
          speaker: narrator
          text: >-
            她直直看进我的眼睛。那一刻，她眼里有一种我从没见过的神情，那道光明亮，又轻轻颤动。我的心突然被喜悦刺了一下，连自己也不知道为什么，因为我根本不懂那目光的意思。她先垂下眼睛，随后又抬起来，这时已经笑了。
        - id: ch01-b21
          speaker: maud_brewster
          text: >-
            要是朋友们能看见我们现在的样子！你好好瞧瞧，难道从来没想过咱们看起来有多狼狈吗？
        - id: ch01-b22
          speaker: humphrey
          text: 想过。我常常看你的模样。
        - id: ch01-b23
          speaker: narrator
          text: 我嘴上回答着，心里还在琢磨她方才的眼神，也不明白她为什么忽然换了话题。
        - id: ch01-b24
          speaker: maud_brewster
          text: 天哪！那我倒要请教，我现在究竟是什么模样？
        - id: ch01-b25
          speaker: humphrey
          text: >-
            恐怕像个稻草人。看看你那湿淋淋的裙子，再看看上面三角形的破口。还有这件上衣！不用请夏洛克·福尔摩斯来，也知道你一直在篝火上做饭，还熬炼过海豹油脂。最后再配上这顶帽子！可站在我面前的，偏偏是写出《忍受的一吻》的那位女士。
        - id: ch01-b26
          speaker: narrator
          text: 莫德一本正经地向我行了一个优雅的屈膝礼。
        - id: ch01-b27
          speaker: maud_brewster
          text: 先生，现在也该说说您的模样了。
        - id: ch01-b28
          speaker: narrator
          text: >-
            接下来五分钟，我们不停拿对方打趣。可那些玩笑底下，又藏着某种认真的东西。我没法不把它同她刚才那一闪即逝的古怪眼神连在一起。那究竟是什么？难道嘴上没有说出口的话，眼睛会越过我们的意志，自己交谈起来？
        - id: ch01-b29
          speaker: narrator
          text: >-
            我知道，我的眼睛就曾经泄露过秘密。这样的事发生过好几次，直到我发现这两个罪犯，才命令它们闭嘴。可她看见了我眼里的喧嚷吗？她听懂了吗？她的眼睛刚才是不是也对我说了什么？不然，那颤动的明亮光彩，还有那种言语也无法形容的意味，又能是什么？
        - id: ch01-b30
          speaker: narrator
          text: >-
            可那不可能。绝不可能。再说，我也不懂眼睛的语言。我只是汉弗莱·范韦登，一个爱上了人的书生。能够爱她，能够等下去，并最终赢得她的爱，这对我来说已经足够美好了。我们一路拿彼此的模样说笑，我也一路想着这些，直到回到岸上，别的事情才占住我的头脑。
        - id: ch01-b31
          speaker: humphrey
          text: 忙了一整天，晚上还不能安稳睡觉，真叫人难受。
        - id: ch01-b32
          speaker: narrator
          text: 吃过晚饭，我忍不住这样抱怨。
        - id: ch01-b33
          speaker: maud_brewster
          text: 可他已经瞎了，现在还能有什么危险？
        - id: ch01-b34
          speaker: humphrey
          text: >-
            我永远不会信任他。他现在瞎了，我反而更不能放心。只是部分失去行动能力，很可能会让他比以前更加凶恶。明天一早，我要做的第一件事，就是抛下一只轻锚，把纵帆船绞离海滩。以后每天晚上，我们划小艇上岸，就把海狼·拉森先生独自留在船上当囚犯。今晚是最后一次需要轮流守夜，知道这一点，也就没那么难熬了。
        - id: ch01-b35
          speaker: narrator
          text: >-
            我们醒得很早。天刚亮，早餐也快吃完了。就在这时，我听见莫德惊慌地叫了一声，声音突然断了。
        - id: ch01-b36
          speaker: maud_brewster
          text: 啊，汉弗莱！
          emotion: surprised
        - id: ch01-b37
          speaker: narrator
          text: >-
            她正盯着“幽灵号”。我顺着她的目光望去，却没看出哪里不对。她回头看我，我也用眼神问她出了什么事。
        - id: ch01-b38
          speaker: maud_brewster
          text: 人字架不见了……
          emotion: fearful
        - id: ch01-b39
          speaker: narrator
          text: 我这才想起它。再往船上看，人字架已经不见了。
        - id: ch01-b40
          speaker: humphrey
          text: 要真是他干的，我绝不会轻易算了。
          emotion: angry
        - id: ch01-b41
          speaker: narrator
          text: 莫德体谅地把手放在我的手上，我朝她苦涩地笑了笑。
        - id: ch01-b42
          speaker: maud_brewster
          text: 你只能再从头做一次了。
          emotion: calm
        - id: ch01-b43
          speaker: humphrey
          text: >-
            你放心，我再生气也没用，连一只苍蝇都伤不了。最糟的是，他也明白这一点。你说得对。如果人字架真让他毁了，我除了重新开始，什么也做不了。
        - id: ch01-b44
          speaker: humphrey
          text: 不过以后我会留在船上守夜。他再敢妨碍我们，我就不会继续容忍。
          emotion: angry
        - id: ch01-b45
          speaker: narrator
          text: 我说到一半，怒火冲昏了头。等我回过神，莫德已经接过了话。
        - id: ch01-b46
          speaker: maud_brewster
          text: >-
            可我不敢整夜一个人留在岸上。要是他能对我们友善一点，再来帮帮忙，该有多好。那样，我们三个都能舒舒服服住在船上。
        - id: ch01-b47
          speaker: humphrey
          text: >-
            我们会搬到船上。至少你和我会。至于海狼·拉森愿不愿意友善，那都无所谓。
          emotion: angry
        - id: ch01-b48
          speaker: narrator
          text: >-
            我钟爱的人字架被毁，这一下正打在我的痛处，实在让我难以平静。后来，我自己也觉得这场怒气有些可笑。
        - id: ch01-b49
          speaker: humphrey
          text: 他做这种事真孩子气。说起来，我为了这种事生气，也一样孩子气。
        - id: ch01-b50
          speaker: narrator
          text: >-
            可等我们登上船，亲眼看见他做了什么，我的心还是沉了下去。人字架彻底消失，支索被横七竖八地割断，自己装好的喉部升降索也处处遭到切割。他知道我不会把断绳接起来。我猛然想到绞盘，立刻跑过去。绞盘一动不动，也被他砸坏了。
        - id: ch01-b51
          speaker: narrator
          text: >-
            我和莫德惊骇地望着彼此。我又奔到舷边。先前费力清理出来的桅杆、帆桁和斜桁全都不见了。海狼·拉森找到了系住它们的绳索，把它们统统割开，任它们漂走。
        - id: ch01-b52
          speaker: narrator
          text: >-
            莫德眼里含着泪，我相信那眼泪是为我流的。我自己也快哭出来了。如今还怎么给“幽灵号”重新竖起桅杆？我们的整个计划怎么办？海狼·拉森这一手做得太彻底。我坐在舱口围板上，双手托住下巴，只剩一片漆黑的绝望。
        - id: ch01-b53
          speaker: humphrey
          text: 他该死！愿上帝宽恕我。可我连亲手处死他的勇气都没有，根本算不上一个男人。
          emotion: angry
        - id: ch01-b54
          speaker: narrator
          text: 莫德来到身边，像安抚孩子一样，轻轻用手梳理我的头发。
        - id: ch01-b55
          speaker: maud_brewster
          text: 好了，好了，一切都会好起来。我们占着正义，事情一定会有好结果。
          emotion: calm
        - id: ch01-b56
          speaker: narrator
          text: >-
            我想起米什莱的话，把头靠在她身上，果然又坚强起来。这个受到祝福的女人，是我永不枯竭的力量源泉。这点挫折算得了什么？不过是耽搁些时日罢了。昨夜没有风，潮水不可能把桅杆带到太远的外海。我们只须多花些力气，找到它们，再一根根拖回来。
        - id: ch01-b57
          speaker: narrator
          text: >-
            何况，这也是一个教训。现在，我已经知道该防备什么。海狼·拉森原本大可以再等等，等我们完成更多工程以后才动手。那样，他会把我们的心血毁得更加彻底。
        - id: ch01-b58
          speaker: maud_brewster
          text: 他这会儿过来了。
        - id: ch01-b59
          speaker: narrator
          text: 我抬头一看，他正在左舷的艉楼上悠闲踱步。
        - id: ch01-b60
          speaker: humphrey
          text: >-
            别理他。他就是来看看我们会有什么反应。别让他知道我们已经发现了，至少别让他得到这份满足。把鞋脱下来。对，就这样，提在手里。
        - id: ch01-b61
          speaker: narrator
          text: >-
            于是，我们跟这个盲人玩起了捉迷藏。他从左舷走来，我们就从右舷悄悄溜过。等到了艉楼，又看着他转身，沿我们刚走过的路线朝船尾追来。
        - id: ch01-b62
          speaker: narrator
          text: >-
            不知为什么，他确信我们就在船上。他很有把握地说了声“早安”，停下来等我们回礼。随后他走向船尾，我们又悄悄溜向船头。
        - id: ch01-b63
          speaker: wolf_larsen
          text: 哦，我知道你们在船上。
        - id: ch01-b64
          speaker: narrator
          text: >-
            他喊完便凝神侧耳，仔细捕捉周围的动静。那样子使我想起一只巨大的鸣角鸮。它发出低沉洪亮的叫声，然后侧耳等待受惊的猎物弄出声响。可我们一点声音也不发，身体纹丝不动，只有等他迈步时，才跟着移动。
        - id: ch01-b65
          speaker: narrator
          text: >-
            我们手牵着手，在甲板上东躲西藏，像两个被邪恶巨怪追赶的孩子。海狼·拉森显然终于厌烦了，离开甲板，走进船舱。我们眼里满是欢喜，嘴里忍着轻笑，穿上鞋，又翻过舷边，进了小艇。
        - id: ch01-b66
          speaker: narrator
          text: >-
            我望进莫德清澈的褐色眼睛，忘掉了海狼·拉森做过的一切恶事。那一刻，我只知道自己爱着她，也知道正是因为有她，我才拥有了力量，能够为我们闯出一条路，重新回到人类世界。
