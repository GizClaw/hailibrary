audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding and sardonic, with cold intellectual precision
        timbre: deep, powerful, and rough-edged
        pace: deliberate with sudden force
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER XXXII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I woke with a strange weight pressing on me. Something around me was missing. Within seconds I knew what it was. The wind had stopped. I had fallen asleep with every nerve braced against its endless noise and force, and I had awakened just as tense, ready to resist a pressure that was no longer there.
        - id: ch01-b02
          speaker: narrator
          text: >-
            For the first time in months, I had spent a night beneath a roof. I stayed under my blankets for several luxurious minutes. They were dry for once, untouched by fog or spray. First I considered how deeply the sudden quiet affected me. Then I enjoyed lying on the mattress Maud had made with her own hands.
        - id: ch01-b03
          speaker: narrator
          text: >-
            After I dressed and opened the door, I heard the waves talking softly along the beach, still telling of the fury of the night. The sky was clear, and the sun shone. I had slept late. I stepped outside in a burst of energy, determined to make up the lost time, as any proper dweller on Endeavour Island should.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Then I stopped dead. I trusted my eyes, yet what they showed me left me stunned. Less than fifty feet away, a black-hulled vessel stood bow-first on the beach, stripped of her masts. Masts and booms lay tangled beside her with ropes, lines, and torn canvas, rubbing gently against the hull.
        - id: ch01-b05
          speaker: narrator
          text: >-
            I could have rubbed my eyes. Yet I knew the homemade galley, the familiar rise of the poop, and the low yacht cabin that barely showed above the rail. Every part of her was familiar. There could be no mistake. It was the Ghost.
        - id: ch01-b06
          speaker: narrator
          text: >-
            What madness of fortune had brought her here, to this one place? I looked at the bleak wall behind me, impossible to cross, and understood how hopeless we were. There was no escape. Maud lay asleep in the hut we had built. Her last words to me rang through my mind, along with my own thought of her as my woman and my mate. Now those words sounded like a funeral bell. Everything before me went black.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Perhaps I lost myself for only a fraction of a second. I could not tell. When my senses returned, the Ghost was still there. Her broken bowsprit reached over the sand, and the tangled spars rubbed against her side as the low waves lifted them. I had to act. I had to do something.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Then I noticed something strange. Nothing moved aboard her. I supposed the whole crew must still be asleep after fighting through the storm and wreck. Perhaps Maud and I could escape after all. If we took our boat and rounded the point before anyone woke, we might get away. I went to call her, and my hand was already raised to knock on her door when I remembered how small the island was.
        - id: ch01-b09
          speaker: narrator
          text: >-
            There was nowhere on the island to hide. Beyond it lay only the wide, cruel ocean. Here we had snug huts and stores of meat, oil, moss, and firewood. Out there, we could not live through the winter seas and the great storms still to come.
        - id: ch01-b10
          speaker: narrator
          text: >-
            I stood outside Maud's door, my knuckles hanging in the air. Escape was impossible. For one wild moment I thought of rushing inside and killing her in her sleep. Then another answer came to me in a flash. The crew was asleep. I knew the way to Wolf Larsen's bunk. Why not creep aboard the Ghost and kill him before he woke?
        - id: ch01-b11
          speaker: narrator
          text: >-
            After that, we would face whatever came. With him dead, at least we would have time and room to prepare. Nothing that followed could possibly be worse than the danger we were in now.
        - id: ch01-b12
          speaker: narrator
          text: >-
            My knife hung at my hip. I went back to my hut for the shotgun, checked that it was loaded, and made my way down to the Ghost. Climbing aboard was difficult, and I was soaked to the waist before I managed it. The forecastle hatch stood open. I stopped and listened for the men breathing below. There was nothing.
        - id: ch01-b13
          speaker: narrator
          text: >-
            A thought nearly made me gasp. What if the Ghost had been abandoned? I listened harder. Still no sound. I climbed carefully down the ladder. The place felt and smelled empty and stale, like a house no one lived in anymore. Ragged clothes, old sea boots, and leaking oilskins lay in thick heaps everywhere. They were the worthless remains of a long voyage.
        - id: ch01-b14
          speaker: narrator
          text: >-
            They had left in a hurry. I returned to the deck, and hope rose in me again. For the first time, I could think clearly and look around more calmly. The boats were gone. The steerage told the same story as the forecastle. The hunters had packed in haste too. The Ghost was deserted. She belonged to Maud and me.
        - id: ch01-b15
          speaker: narrator
          text: >-
            I remembered the ship's stores and the storeroom beneath the cabin. Why not surprise Maud with a fine breakfast? The terror drained away. Better still, I no longer had to commit the dreadful act that had brought me aboard. I felt as eager as a boy. No clear plan filled my mind beyond that sudden joy. I bounded up the steerage steps two at a time, hoping Maud would keep sleeping until breakfast was ready.
        - id: ch01-b16
          speaker: narrator
          text: >-
            As I passed the galley, I took fresh pleasure in all the excellent cooking tools inside. Then I sprang up the rise of the poop and saw Wolf Larsen.
        - id: ch01-b17
          speaker: narrator
          text: >-
            My own speed and the stunning shock of seeing him carried me clattering three or four steps across the deck before I could stop myself. He stood in the companionway with only his head and shoulders above it. His arms rested on the half-open slide. He did not move in the slightest. He only stared straight at me.
        - id: ch01-b18
          speaker: narrator
          text: >-
            I began to shake. The old sickness twisted my stomach, and I gripped the cabin house to steady myself. My lips had gone dry, so I wet them, trying to prepare myself to speak. I never took my eyes from him. Neither of us said a word. His silence and stillness carried a threat. All my old fear returned, made a hundred times stronger by this new fear, and we remained there staring at each other.
        - id: ch01-b19
          speaker: narrator
          text: >-
            I knew someone had to act, but the old helplessness had taken hold of me. I waited for him to begin. As the moments passed, I remembered facing the long-maned bull. I had meant to club that animal, but fear had changed my purpose until all I wanted was to make it run. Now, too, I had forgotten why I was there. Wolf Larsen was not supposed to take the first step. I was.
        - id: ch01-b20
          speaker: narrator
          text: >-
            I cocked both barrels and aimed the shotgun at him. If he had moved or tried to drop below, I know I would have fired. But he stayed exactly as he was. The gun trembled in my hands, and I had time to study his worn, exhausted face. Some heavy strain seemed to have wasted it. His cheeks were hollow, and his forehead looked tired and drawn. Even his eyes seemed physically strange, as if the nerves and muscles behind them had been strained and had twisted them slightly.
        - id: ch01-b21
          speaker: narrator
          text: >-
            My thoughts raced, yet I could not pull the triggers. I lowered the gun and moved to the corner of the cabin. I needed relief from the strain and a chance to begin again. The move also brought me closer. I raised the gun once more. He was almost within reach. I could not miss him now, however poor my aim. I had decided to fire. Still, I fought myself and could not do it.
        - id: ch01-b22
          speaker: wolf_larsen
          text: >-
            Well?
        - id: ch01-b23
          speaker: narrator
          text: >-
            His impatience was plain. I tried to make my fingers close on the triggers. I tried to speak. Neither effort succeeded.
        - id: ch01-b24
          speaker: wolf_larsen
          text: >-
            Why haven't you fired?
        - id: ch01-b25
          speaker: narrator
          text: >-
            I cleared the roughness from my throat, but before I could answer, he spoke slowly.
        - id: ch01-b26
          speaker: wolf_larsen
          text: >-
            You can't do it, Hump. It isn't quite fear. You simply have no power to act. The morality you learned is stronger than you are. You're a slave to the opinions of the people you've known and the people you've read about. Their rules were beaten into your head before you could speak clearly. Your philosophy can't free you, and neither could anything I taught you. Those rules will not let you kill a man who is unarmed and offers no resistance.
        - id: ch01-b27
          speaker: narrator
          text: >-
            I know.
        - id: ch01-b28
          speaker: narrator
          text: >-
            My answer came out hoarse.
        - id: ch01-b29
          speaker: wolf_larsen
          text: >-
            And you know I could kill an unarmed man as easily as I could smoke a cigar. By your measure, you know exactly what I'm worth in this world. You've called me a snake, a tiger, a shark, a monster, and Caliban. Yet you little cloth puppet, you little machine that only echoes others, cannot kill me as you would kill a snake or shark. Why? Because I have hands and feet and a body shaped a little like yours. Bah! I expected better from you, Hump.
        - id: ch01-b30
          speaker: narrator
          text: >-
            He climbed out of the companionway and walked toward me.
        - id: ch01-b31
          speaker: wolf_larsen
          text: >-
            Lower the gun. I need answers. I haven't looked around yet. What is this place? How is the Ghost lying? Why are you wet? And where is Maud? Forgive me, Miss Brewster. Or should I call her Mrs. Van Weyden now?
        - id: ch01-b32
          speaker: narrator
          text: >-
            I backed away, almost crying because I could not shoot him. But I was not foolish enough to lower the gun. I desperately hoped he would attack me, perhaps by striking me or grabbing my throat. Only then, I knew, could I make myself fire.
        - id: ch01-b33
          speaker: narrator
          text: >-
            This is Endeavour Island.
        - id: ch01-b34
          speaker: wolf_larsen
          text: >-
            Never heard of it.
        - id: ch01-b35
          speaker: narrator
          text: >-
            That's only the name we gave it. And the Ghost is bow-first on the beach, as you can see.
        - id: ch01-b36
          speaker: wolf_larsen
          text: >-
            We? Who do you mean by we?
        - id: ch01-b37
          speaker: narrator
          text: >-
            Miss Brewster and me.
        - id: ch01-b38
          speaker: wolf_larsen
          text: >-
            There are seals here. Their barking woke me, or I'd still be asleep. I heard them as I drove in last night. They gave me my first warning that the wind was carrying me onto shore. This is a rookery, the very thing I've hunted for all these years. My brother Death has led me straight to a fortune. The place is a mint. What are its bearings?
        - id: ch01-b39
          speaker: narrator
          text: >-
            I have no idea. But you ought to know nearly where we are. What did your last observations tell you?
        - id: ch01-b40
          speaker: narrator
          text: >-
            He gave me a smile I could not read and said nothing.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Then where is everybody? How did you end up alone?
        - id: ch01-b42
          speaker: narrator
          text: >-
            I expected him to brush aside that question too, but he answered at once.
        - id: ch01-b43
          speaker: wolf_larsen
          text: >-
            My brother caught me within forty-eight hours, and it wasn't because I made a mistake. He boarded at night when only the watch was on deck. The hunters turned against me after he offered them a larger share. I heard him make the offer right in front of me. Naturally, the crew deserted too. Every man went over the side, leaving me stranded on my own ship. It was Death's turn to win. Either way, the victory stays in the family.
        - id: ch01-b44
          speaker: narrator
          text: >-
            But how did the masts come down?
        - id: ch01-b45
          speaker: wolf_larsen
          text: >-
            Go examine those lanyards where the mizzen rigging used to be.
        - id: ch01-b46
          speaker: narrator
          text: >-
            He pointed, and I went over to look.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Someone cut them with a knife!
          emotion: surprised
        - id: ch01-b48
          speaker: wolf_larsen
          text: >-
            Not exactly. The work was cleaner than that. Look once more.
        - id: ch01-b49
          speaker: narrator
          text: >-
            He laughed. I looked again and saw that the lanyards had been cut almost through. Just enough had been left intact to hold the shrouds until a heavy strain came upon them.
        - id: ch01-b50
          speaker: wolf_larsen
          text: >-
            Cooky did it. I never caught him at the work, but I know it was him. I suppose that settled the score a little.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Good for Mugridge!
          emotion: happy
        - id: ch01-b52
          speaker: wolf_larsen
          text: >-
            I thought the same thing when the masts went overboard. But by then I was saying it from the losing side.
        - id: ch01-b53
          speaker: narrator
          text: >-
            What were you doing while this happened?
        - id: ch01-b54
          speaker: wolf_larsen
          text: >-
            My best, of course. Under the circumstances, my best did not amount to much.
        - id: ch01-b55
          speaker: narrator
          text: >-
            I turned back to study Thomas Mugridge's work.
        - id: ch01-b56
          speaker: wolf_larsen
          text: >-
            I think I'll sit down and enjoy the sun.
        - id: ch01-b57
          speaker: narrator
          text: >-
            I heard the faintest weakness in his voice. Such a thing was so unlike the Wolf Larsen I knew that I looked around quickly. His hand moved uneasily across his face, as though he were wiping away cobwebs. I could not understand it.
        - id: ch01-b58
          speaker: narrator
          text: >-
            How are the headaches?
        - id: ch01-b59
          speaker: wolf_larsen
          text: >-
            They still bother me. I believe another one is starting now.
        - id: ch01-b60
          speaker: narrator
          text: >-
            From his seated position, he slid down until he was stretched across the deck. Then he turned onto his side. His head rested on the upper arm beneath him, and his forearm covered his eyes against the sun. I stood watching in wonder.
        - id: ch01-b61
          speaker: wolf_larsen
          text: >-
            This is your chance, Hump.
        - id: ch01-b62
          speaker: narrator
          text: >-
            I don't know what you mean.
        - id: ch01-b63
          speaker: narrator
          text: >-
            It was a lie. I understood him perfectly.
        - id: ch01-b64
          speaker: wolf_larsen
          text: >-
            Oh, it's nothing. You finally have me just where you wanted me.
        - id: ch01-b65
          speaker: narrator
          text: >-
            His voice was soft, almost as if he were falling asleep.
        - id: ch01-b66
          speaker: narrator
          text: >-
            No, I don't. I want you several thousand miles away from here.
        - id: ch01-b67
          speaker: narrator
          text: >-
            He chuckled and said nothing more. He did not move when I passed him and went below into the cabin. I opened the trapdoor in the floor, then stared uncertainly into the dark storeroom beneath it. I was afraid to climb down. What if his collapse was only a trick? He could catch me there like a rat.
        - id: ch01-b68
          speaker: narrator
          text: >-
            I crept back up the companionway and looked at him. He had not changed position. Below again, I dropped the door into the storeroom before following it down. At least he could not close a lid over me. The precaution proved unnecessary. I returned to the cabin with all I could carry, including jam, ship's biscuits, canned meat, and other stores. Then I put the trapdoor back in place.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Another look showed that Wolf Larsen had still not moved. A bright idea came to me. I slipped into his stateroom and took his revolvers. I searched all three of the other rooms thoroughly, but found no more weapons. To be certain, I searched the steerage and forecastle again. In the galley, I collected every sharp knife used for meat or vegetables.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Then I remembered the large yachtsman's knife he always carried. I went to him and called his name, quietly at first and then loudly. He did not stir. I bent over him and drew the knife from his pocket. At last I could breathe more easily. He had no weapon for attacking me at a distance. I was armed, and if he tried to seize me with those terrible gorilla arms, I could act before he reached me.
        - id: ch01-b71
          speaker: narrator
          text: >-
            I filled a coffee pot and a frying pan with some of my prizes, took dishes from the cabin pantry, and left him lying in the sun while I went ashore.
        - id: ch01-b72
          speaker: narrator
          text: >-
            Maud was still asleep. We had not yet built a winter kitchen, so I blew the life back into the embers and cooked breakfast in a fever of excitement. Near the end, I heard her moving inside her hut and getting ready. The coffee was poured and everything was waiting when her door opened and she stepped out.
        - id: ch01-b73
          speaker: maud_brewster
          text: >-
            This isn't fair. You've taken over one of my rights. You agreed that the cooking belonged to me, and now—
        - id: ch01-b74
          speaker: narrator
          text: >-
            Only this one time.
        - id: ch01-b75
          speaker: narrator
          text: >-
            I pleaded with her.
        - id: ch01-b76
          speaker: maud_brewster
          text: >-
            Then promise you won't do it again. Unless you've grown tired of my poor cooking, of course.
        - id: ch01-b77
          speaker: narrator
          text: >-
            She smiled. To my delight, she did not once glance toward the beach. I kept up our playful talk so well that she noticed nothing as she drank coffee from a china cup, ate fried dried potatoes, and spread marmalade on her biscuit.
        - id: ch01-b78
          speaker: narrator
          text: >-
            But the moment could not last. Surprise crossed her face. She had noticed the china plate beneath her food. Her eyes moved over the breakfast, taking in one strange detail after another. Then she looked at me, and slowly turned toward the beach.
        - id: ch01-b79
          speaker: maud_brewster
          text: >-
            Humphrey!
          emotion: surprised
        - id: ch01-b80
          speaker: narrator
          text: >-
            The old, nameless terror rose in her eyes.
        - id: ch01-b81
          speaker: maud_brewster
          text: >-
            Is he there?
          emotion: fearful
        - id: ch01-b82
          speaker: narrator
          text: >-
            I nodded.
