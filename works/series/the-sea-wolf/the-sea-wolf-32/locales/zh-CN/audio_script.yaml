audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十二章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我醒来时，心里莫名发沉，四周仿佛少了什么。清醒几秒，我才认出来，少的是风。我伴着整夜的风声和震动睡去，神经一直绷紧。如今风停了，身体却还在抵抗那股已经消失的力量。
        - id: ch01-b02
          speaker: narrator
          text: >-
            几个月来，这是我头一回睡在屋顶下面。毯子难得没有被雾和浪花打湿，我舒舒服服地躺了一阵。先感受风突然停止后，自己的身体有了什么变化，随后又体会另一份快乐。身下这张床垫，是莫德一双手替我做的。我穿衣开门，沙滩上的浪还在絮絮拍响，像是争着讲述昨夜有多凶险。外面天清日朗，阳光也出来了。我睡晚了，便打起精神走出去，要把奋进岛居民耽误的时间补回来。
        - id: ch01-b03
          speaker: narrator
          text: >-
            可我刚出门就站住了。我相信自己的眼睛，却被它们看到的东西震得发呆。不到五十英尺外，一艘黑壳船船头冲岸，搁在沙滩上。它的桅杆全倒了，帆桁、支索、帆脚索和破帆缠成一团，随着水波轻轻擦着船舷。我真想揉一揉眼睛。那座我们搭过的厨房，那道熟悉的艉楼前沿，还有几乎不高过舷墙的游艇舱，全在那里。眼前的船，正是“幽灵号”。
        - id: ch01-b04
          speaker: narrator
          text: >-
            命运究竟使了什么怪招，怎么会把它偏偏送到这里？天下哪有这样的巧合？我回头看着那堵无法攀越的荒凉峭壁，立刻明白，逃走已经毫无希望。莫德还睡在我们盖起的那间小屋里。她昨晚那声“晚安，汉弗莱”又在耳边响起。“我的女人，我的伴侣”，这句话也在脑中反复回荡，如今却像丧钟一样一下下敲着我。我的眼前顿时一黑。
        - id: ch01-b05
          speaker: narrator
          text: >-
            也许只失神了一瞬，也许过了很久，我不知道。等我恢复知觉，“幽灵号”仍旧船头冲岸，实实在在地躺在那里。断裂的艏斜桅越过船头，伸在沙地上方。海浪低低吟唱，每一次起落，都带着纠缠的桅杆轻擦船身。眼前的事实无法躲避，我必须有所行动，而且必须立刻行动。
        - id: ch01-b06
          speaker: narrator
          text: >-
            船上竟没有一点动静，我忽然觉得很奇怪。我先猜船员同风浪搏斗了一夜，又经历了船难，这会儿全都累得睡着了。接着又想到，只要赶在他们醒来前坐小艇绕过海岬，我和莫德或许还能逃。我得叫醒她，立刻动身。我举手要敲她的门，却想起这岛太小，哪里也藏不住人。离开岛，摆在面前的只有冬日里浩瀚又冷酷的大海。我们有暖和的小屋，有肉、油、苔藓和柴火。要是出海，绝不可能熬过将来的风暴。
        - id: ch01-b07
          speaker: narrator
          text: >-
            我的指节停在门前，迟迟敲不下去。逃走不可能，留在这里也不可能。我竟一度生出一个疯狂念头，想冲进屋里，趁莫德熟睡时杀了她。紧接着，另一个更好的办法像闪电一样照进脑中。船上所有人都在睡觉，而我熟悉海狼·拉森的床铺。何不潜上“幽灵号”，在睡梦里杀死他？至于杀死他以后会怎样，可以到时候再说。只要他死了，我们就有时间和余地安排别的事。无论出现什么新局面，也总不会比现在更坏。
        - id: ch01-b08
          speaker: narrator
          text: >-
            我腰间带着刀，又回屋取了霰弹枪，仔细确认里面装好了子弹。爬上“幽灵号”很费力，我的下半身也湿透了。水手舱口开着。我停下来听里面的人呼吸，却什么也听不到。一个念头叫我差点惊呼出声，难道船上已经没人？我听得更仔细，仍是一片寂静。顺着梯子悄悄下去，迎面只有空屋才有的阴冷感觉和霉味。破衣服、旧海靴和漏水的油布衣厚厚扔了一地，全是一次漫长航程剩下的无用家当。
        - id: ch01-b09
          speaker: narrator
          text: >-
            他们显然走得仓促。我回到甲板，心里又有了希望，也能冷静察看了。船上的小艇全都不见，统舱讲的也是同一个故事。猎手们同样匆匆收拾了自己的东西。“幽灵号”确实遭人遗弃，如今属于莫德和我。想到船上成堆的粮食，又想到船舱下面的储藏室，我突然有了个叫人兴奋的主意。我要找些好东西，给莫德准备一顿特别的早餐。
        - id: ch01-b10
          speaker: narrator
          text: >-
            恐惧一下子退去，我又不必犯下那桩可怕的罪行，整个人顿时像孩子般雀跃。我两级一步冲上统舱梯道，脑中除了喜悦，只剩下一个愿望。要是莫德能一直睡到惊喜早餐备好，那该多好。经过厨房，我想到里面那些好炊具，又添了一层满足。可刚跳上艉楼前沿，我便看见了海狼·拉森。
        - id: ch01-b11
          speaker: narrator
          text: >-
            冲得太快，再加上突如其来的震惊，我收不住脚，在甲板上踉跄三四步才停下。他站在梯道口，只有头和肩露在外面。双臂搭着半开的舱盖，纹丝不动地直视我。我开始发抖，熟悉的恶心攫住胃部，只好扶住舱房边缘站稳。嘴唇突然干透了，我舔了舔，想让自己能够开口，眼睛却片刻也不敢离开他。他也不说话。那片沉默，那副一动不动的样子，越拖越不祥。过去和新生的恐惧叠在一起，放大了百倍，我们就这样互相瞪着。
        - id: ch01-b12
          speaker: narrator
          text: >-
            我知道眼前的局面不容我再等，自己必须行动。可从前那种无能为力的感觉又牢牢抓住了我，我依旧站着，只等他先动。时间一点点过去，我想起自己接近那头长鬃公海豹时的情形。那次我本来举着棍棒，要亲手打死它。可恐惧遮住了原来的意图，最后我只盼它转身逃走。现在也是一样。可我终于逼自己明白，来到这里的人是我。我要做的不是等海狼·拉森先发制人，而是亲自动手。
        - id: ch01-b13
          speaker: narrator
          text: >-
            我扳起两根枪机，举枪瞄准。他只要退进梯道，我一定会开枪，可他半步也不动。我这才看清，他的脸已经憔悴得变了样。双颊深陷，额头疲惫地皱着，像被沉重的忧虑耗空了。那双眼睛不只神情古怪，连外形也像受过重压，眼球微微扭向了不自然的方向。
        - id: ch01-b14
          speaker: narrator
          text: >-
            看着这一切，我的脑子飞快转动，千百个念头一齐掠过，手指却还是扣不下去。我放低枪，走到舱房一角，主要是想让绷紧的神经稍稍松开，再重新来过。同时，我也离他更近了。我再次举枪。他已在伸手可及的地方，根本没有逃生的机会。我已经下定决心。就算枪法再差，这样近也绝不可能打偏。可无论怎样逼迫自己，我还是开不了枪。
        - id: ch01-b15
          speaker: wolf_larsen
          text: 你到底要怎么样？
        - id: ch01-b16
          speaker: narrator
          text: 我逼着手指去扣扳机，又逼着喉咙发出声音，两样都办不到。
        - id: ch01-b17
          speaker: wolf_larsen
          text: 怎么还不开枪？
        - id: ch01-b18
          speaker: narrator
          text: 我的喉咙哑得厉害，只能先清了清嗓子。他慢慢开口，像是早已看透了我。
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            阿颠，你做不到。你不完全是怕，你只是没有这个能力。那套世俗道德比你强。你认识过的人，你从书里读到的人，他们相信的东西早把你变成了奴隶。从你刚会说话起，那套规矩就在你脑子里反复敲。你的哲学也好，我教你的东西也好，都敌不过它。它不准你杀一个没拿武器、也不反抗的人。
        - id: ch01-b20
          speaker: humphrey
          text: 我知道。
        - id: ch01-b21
          speaker: narrator
          text: 我的声音嘶哑。海狼·拉森没有放过我。
        - id: ch01-b22
          speaker: wolf_larsen
          text: >-
            你也明白，我杀一个手无寸铁的人，就跟点支雪茄一样轻松。照你的标准，我是什么东西，在世上值多少，你清楚得很。你叫我蛇、老虎、鲨鱼、怪物，还叫我卡利班。可你这个小布偶，这架只会重复别人声音的小机器，却不能像杀蛇、杀鲨鱼那样杀我。为什么？只因为我有手有脚，身体跟你长得差不多。呸！阿颠，我还以为你能更有出息。
        - id: ch01-b23
          speaker: narrator
          text: 他跨出梯道，走到我面前。
        - id: ch01-b24
          speaker: wolf_larsen
          text: >-
            把枪放下，我有话问你。我还没看过四周。这是什么地方？“幽灵号”搁成什么样了？你为什么浑身湿透？莫德呢？对不起，该叫布鲁斯特小姐。或者，我是不是该叫她范魏登太太？
        - id: ch01-b25
          speaker: narrator
          text: >-
            他逼近时，我一路向后退。想到自己竟然开不了枪，我几乎急得落泪，可我还没蠢到真把武器放下。我绝望地盼着他做出一点敌对的举动，挥拳打来也好，伸手掐住我也好。我很清楚，只有他先攻击，我才会被逼出扣动扳机的勇气。
        - id: ch01-b26
          speaker: humphrey
          text: 这里叫奋进岛。
        - id: ch01-b27
          speaker: wolf_larsen
          text: 我从来没听过这个名字。
        - id: ch01-b28
          speaker: humphrey
          text: 这只是我们替它取的名字。
        - id: ch01-b29
          speaker: wolf_larsen
          text: 你说“我们”？还有谁？
        - id: ch01-b30
          speaker: humphrey
          text: 布鲁斯特小姐和我。“幽灵号”的船头正冲着沙滩，情形你自己看得见。
        - id: ch01-b31
          speaker: wolf_larsen
          text: >-
            岛上有海豹。要不是它们叫个不停，我现在还没醒。昨夜把船驶进来时，我就听见了。那是我撞上了一处下风岸的第一个警告。这里是海豹繁殖地，我找了多少年都没找到。多亏我那位“死神”兄弟，竟把一笔横财送到了我手里。这地方就是座铸币厂。它在哪个方位？
        - id: ch01-b32
          speaker: humphrey
          text: 我一点儿也不知道。不过你应该有个大概。你最后一次观测出的方位呢？
        - id: ch01-b33
          speaker: narrator
          text: 他只露出一个让人猜不透的笑容，没有作答。
        - id: ch01-b34
          speaker: humphrey
          text: 船上其他人到哪儿去了？为什么只剩下你？
        - id: ch01-b35
          speaker: narrator
          text: 我以为他又会避开问题，没想到这次答得很干脆。
        - id: ch01-b36
          speaker: wolf_larsen
          text: >-
            我那兄弟不到四十八小时就赢了我，而且错不在我。他趁夜里只有值班船员在甲板上，登了我的船。猎手们背叛了我，因为他给的分成更高。我听见他开价了，就在我面前。其他船员当然也把我甩了，这并不意外。所有人翻过船舷离开，只留下我困在自己的船上。这回轮到“死神”走运，反正好处总算还在自家人手里。
        - id: ch01-b37
          speaker: humphrey
          text: 那你的桅杆怎么全倒了？
        - id: ch01-b38
          speaker: wolf_larsen
          text: 走过去看看那些收紧索，就是后桅支索原来在的地方。
        - id: ch01-b39
          speaker: humphrey
          text: 这些绳子被刀割过！
          emotion: surprised
        - id: ch01-b40
          speaker: wolf_larsen
          text: 还不只是割过。这个活儿做得更巧，你再看一遍。
        - id: ch01-b41
          speaker: narrator
          text: >-
            我仔细一看，那些收紧索几乎全断了，只留下一点纤维拉住支索。只要遇上猛烈的拉力，它们就会一起崩断。
        - id: ch01-b42
          speaker: wolf_larsen
          text: 是厨子干的。我没当场抓到他，不过我知道。这样一来，我们的旧账也算扯平了一点。
        - id: ch01-b43
          speaker: humphrey
          text: 马格里奇这件事干得漂亮！
        - id: ch01-b44
          speaker: wolf_larsen
          text: 所有东西掉进海里时，我也这么想。只可惜那时候，我说这句话的口气可不是赞赏。
        - id: ch01-b45
          speaker: humphrey
          text: 这些事情发生时，你在做什么？
        - id: ch01-b46
          speaker: wolf_larsen
          text: 我当然尽了全力，可当时的情形不许我做多少事。
        - id: ch01-b47
          speaker: narrator
          text: 我转身重新查看托马斯·马格里奇留下的手笔，身后传来海狼·拉森的声音。
        - id: ch01-b48
          speaker: wolf_larsen
          text: 我还是坐下，晒一会儿太阳吧。
        - id: ch01-b49
          speaker: narrator
          text: >-
            他的声音里带着极轻的一丝虚弱。这太反常，我立刻望过去。他不安地用手在脸前挥动，像在赶走蛛丝。我越看越困惑，因为眼前这个人一点也不像我认识的海狼·拉森。
        - id: ch01-b50
          speaker: humphrey
          text: 你的头痛还会发作吗？
        - id: ch01-b51
          speaker: wolf_larsen
          text: 一直没有好。我想，这一回又要开始了。
        - id: ch01-b52
          speaker: narrator
          text: >-
            他从坐着的姿势慢慢向下滑，最后整个人躺在甲板上。随后又侧过身，把头枕在下面那条胳膊鼓起的肌肉上，用前臂挡住照向眼睛的阳光。我站在一旁，惊疑地望着他，不明白这个一向强悍的人究竟怎么了。
        - id: ch01-b53
          speaker: wolf_larsen
          text: 阿颠，现在正是你的机会。
        - id: ch01-b54
          speaker: humphrey
          text: 我听不懂你在说什么。
        - id: ch01-b55
          speaker: narrator
          text: 我是在撒谎，其实听得再明白不过。他的声音却轻了下去，像快睡着了。
        - id: ch01-b56
          speaker: wolf_larsen
          text: 没什么。只是现在，你总算把我放在了最合心意的位置。
        - id: ch01-b57
          speaker: humphrey
          text: 我可没有。我要的是让你离这里几千英里远。
        - id: ch01-b58
          speaker: narrator
          text: >-
            他低声一笑，从此不再开口。我经过他身边，下到船舱，他连动也没动。地板活门下面的储藏室一片漆黑。我迟迟不敢进去，怕他躺倒只是诱我上当。要是活门一关，我就会像老鼠般困死在下面。
        - id: ch01-b59
          speaker: narrator
          text: >-
            我轻轻爬回梯道，探头确认他还躺在原处，姿势和我离开时一模一样。再次下去时，我先把活门板扔进储藏室。这样就算他突然过来，洞口至少没有盖子，我不会被封死在里面。其实，这份戒备完全没有必要。我抱回了自己能拿动的全部东西，有果酱、船用饼干、肉罐头，还有其他食物，最后仍把活门板安了回去。
        - id: ch01-b60
          speaker: narrator
          text: >-
            我再探头看海狼·拉森，他始终没有动。一个绝妙的主意突然冒了出来，我可以拿走他的武器。我偷偷溜进他的舱室，把几把左轮手枪全拿到手。另外三间舱室也被我翻了个遍，没有找到别的武器。为了确保万无一失，我又把统舱和水手舱重新搜查一遍，再去厨房收走所有锋利的切肉刀和蔬菜刀。最后，我想起他身上还总带着一把硕大的游艇刀。
        - id: ch01-b61
          speaker: narrator
          text: >-
            我走过去叫他，先轻声，后来大声，他毫无反应。我俯身从他口袋里取出刀，终于能松口气了。他手里再没有可以远攻的武器。即使想用那双大猩猩般可怕的手臂来抓我，我有枪，也能抢先阻止他。
        - id: ch01-b62
          speaker: narrator
          text: >-
            我把部分食物装进咖啡壶和煎锅，又从食品间拿了瓷餐具，留下海狼·拉森独自躺在阳光里，自己回到岸上。
        - id: ch01-b63
          speaker: narrator
          text: >-
            莫德仍在睡。我吹旺余烬，急匆匆地做早餐。我们还没有安排好冬季厨房。快做完时，小屋里传来她起身梳洗的动静。食物刚备齐，咖啡刚倒好，她便推门出来。
        - id: ch01-b64
          speaker: maud_brewster
          text: 你这样可不公平。做饭是我的特权，你明明答应过把这件事交给我，而且——
        - id: ch01-b65
          speaker: humphrey
          text: 就让我做这一次吧。
        - id: ch01-b66
          speaker: maud_brewster
          text: 那你得保证没有下次。除非，你已经嫌弃我那点可怜的手艺了。
        - id: ch01-b67
          speaker: narrator
          text: >-
            她笑着说完，一次也没望向海滩。我高兴极了，继续陪她说笑。她毫无察觉地用瓷杯喝着咖啡，吃煎过的脱水土豆，还往船用饼干上抹果酱。可这场隐瞒不可能一直维持。惊讶忽然出现在她脸上，她终于发现自己正在使用一只瓷盘。她一件接一件地打量整顿早餐，随后抬头看我，又一点点把脸转向海滩。
        - id: ch01-b68
          speaker: maud_brewster
          text: 汉弗莱！
          emotion: surprised
        - id: ch01-b69
          speaker: narrator
          text: 那种说不出名字的旧日恐惧，又一次涌进她的眼睛。
        - id: ch01-b70
          speaker: maud_brewster
          text: 他……也在船上吗？
          emotion: fearful
        - id: ch01-b71
          speaker: narrator
          text: 我没有回答，只向她点了点头。
