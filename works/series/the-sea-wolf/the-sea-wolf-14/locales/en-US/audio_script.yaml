  chapters:
    - id: ch01
      title: CHAPTER XIV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Only now have I understood how little I valued women. As far as I knew, I had never been especially romantic. Still, until this voyage, I had never lived outside the atmosphere of women. My mother and sisters were always near me, and I was always trying to escape them. Their concern for my health drove me to distraction. Every so often, they invaded my private room and tidied it. I took pride in the orderly confusion there. Once they finished, it looked neat enough, but the confusion was worse and the order was gone. I could never find a thing.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Now I would have welcomed the very feeling of their presence. I longed even for the rustle and swish of the skirts I had once disliked so heartily. If I ever reached home, I would never lose my temper with them again. They could give me medicine and doctor me morning, noon, and night. They could dust, sweep, and put my room in order every minute of the day. I would simply lean back, watch them, and feel grateful that I had a mother and several sisters.
        - id: ch01-b03
          speaker: narrator
          text: >-
            That thought made me wonder about the mothers of the twenty-odd men aboard the Ghost. It seemed unnatural for men to be cut off from women and travel the world in a herd of their own. Their lives had become coarse and savage. If they had wives, sisters, and daughters near them, perhaps they would still know tenderness, sympathy, and gentleness.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Not one of them was married. For years and years, none had known a good woman or felt the redeeming influence that seemed to shine from her. Their lives had lost their balance. The brutal side of their manhood had grown too powerful, while the other, spiritual side had shriveled away. They were a company of unmarried men rubbing harshly against one another and growing more callous every day.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Sometimes I could hardly believe they had ever had mothers. They seemed like some race apart, half human and half brute, with nothing in their world but men. I could imagine them hatched by the sun like turtle eggs, or brought to life in some other dirty fashion. They seemed to spend every day festering in brutality and cruelty, then die as unlovely as they had lived.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Those thoughts made me curious, so the night before I spoke with Johansen. They were the first words beyond duty that he had given me since the voyage began. He had left Sweden at eighteen. He was thirty-eight now, and through all those twenty years he had never once gone home. Two years earlier, he had met a man from his town in a sailors' boardinghouse in Chile. That chance meeting was how he knew his mother was still alive.
        - id: ch01-b07
          speaker: johansen
          text: >-
            She must be quite an old woman by now.
        - id: ch01-b08
          speaker: narrator
          text: >-
            He gazed into the binnacle as he spoke, then snapped a sharp look at Harrison, who was steering a point away from the proper course. I asked when he had last written to his mother.
        - id: ch01-b09
          speaker: johansen
          text: >-
            Was it eighty-one? No, eighty-two. No... eighty-three. Yes, eighty-three, ten years ago. I wrote from a little port in Madagascar while I was trading.
        - id: ch01-b10
          speaker: johansen
          text: >-
            Every year I meant to go home, so what was the use of writing when it would only be one more year? But every year, something happened and I didn't go. Now I'm mate. When I'm paid off in San Francisco, I may have five hundred dollars. I'll sign onto a big sailing ship bound around Cape Horn for Liverpool and earn more money on the way. From there, I'll pay for my passage home. Then my mother won't have to do any more work.
        - id: ch01-b11
          speaker: narrator
          text: >-
            I asked whether she still worked and how old she was.
        - id: ch01-b12
          speaker: johansen
          text: >-
            She's about seventy. In my country, we work from the day we're born until the day we die. That's why we live so long. I'll live to be a hundred.
        - id: ch01-b13
          speaker: narrator
          text: >-
            I would never forget that conversation. Those were the last words I ever heard Johansen speak. They may have been the last words he spoke at all.
        - id: ch01-b14
          speaker: narrator
          text: >-
            I went down to the cabin to sleep, but it was too stuffy below. The night was calm. We had sailed out of the trade winds, and the Ghost was barely making one knot an hour. I put a blanket and pillow under my arm and returned to the deck.
        - id: ch01-b15
          speaker: narrator
          text: >-
            As I passed Harrison at the wheel, I noticed that he had drifted three full points off course. I thought he had fallen asleep, and I wanted to spare him a scolding or something worse, so I spoke to him. But his eyes were open wide. He looked deeply shaken and could not answer me.
        - id: ch01-b16
          speaker: narrator
          text: >-
            What's wrong? Are you ill?
        - id: ch01-b17
          speaker: narrator
          text: >-
            Harrison shook his head. He drew a deep breath like someone waking from a dream.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Then get the ship back on course.
        - id: ch01-b19
          speaker: narrator
          text: >-
            He turned the wheel a few spokes. I watched the compass card swing slowly to north-northwest, waver, and settle there.
        - id: ch01-b20
          speaker: narrator
          text: >-
            I took a fresh grip on my blanket and pillow and was about to move on when something near the stern rail caught my eye. A strong hand, dripping with water, gripped the rail. Then another hand slowly appeared beside it in the darkness. I stood fascinated, wondering what visitor from the black depths I was about to see. Whatever it was, I knew it had caught the log line and was using it to climb aboard.
        - id: ch01-b21
          speaker: narrator
          text: >-
            A head slowly took shape, its hair hanging wet and straight. Then I recognized the eyes and face of Wolf Larsen. His right cheek was red with blood flowing from a wound somewhere in his head. With one quick effort, he pulled himself over the rail and rose to his feet. As he stood, he shot a swift glance at the man behind the wheel. He seemed to be checking the helmsman's identity and making certain there was nothing to fear from him.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Sea water streamed from him and made small gurgling sounds on the deck. For some reason, those little sounds kept pulling at my attention. When he stepped toward me, I backed away without thinking. There was something in his eyes that plainly promised death.
        - id: ch01-b23
          speaker: wolf_larsen
          text: >-
            It's all right, Hump. Where's the mate?
        - id: ch01-b24
          speaker: narrator
          text: >-
            I shook my head.
        - id: ch01-b25
          speaker: wolf_larsen
          text: >-
            Johansen, answer me! Johansen, where are you?
        - id: ch01-b26
          speaker: wolf_larsen
          text: >-
            Harrison, where is he?
        - id: ch01-b27
          speaker: narrator
          text: >-
            Harrison seemed to have recovered himself, and his answer was steady.
        - id: ch01-b28
          speaker: harrison
          text: >-
            I don't know, sir. I saw him go forward a little while ago.
        - id: ch01-b29
          speaker: wolf_larsen
          text: >-
            I went forward too. You'll notice I didn't return the same way. How do you explain that?
        - id: ch01-b30
          speaker: harrison
          text: >-
            You must have gone overboard, sir.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Should I search for Johansen in the steerage?
        - id: ch01-b32
          speaker: wolf_larsen
          text: >-
            You won't find him there, Hump. But you'll do. Come with me, and leave your bedding where it is.
        - id: ch01-b33
          speaker: narrator
          text: >-
            I followed close behind him. Nothing moved amidships.
        - id: ch01-b34
          speaker: wolf_larsen
          text: >-
            Those cursed hunters are too fat and lazy to stand a four-hour watch.
        - id: ch01-b35
          speaker: narrator
          text: >-
            On the forecastle head, we found three sailors asleep. Wolf Larsen rolled each man over and studied his face. Together they made up the watch on deck. In good weather, the Ghost allowed them to sleep, except for the officer, the helmsman, and the lookout.
        - id: ch01-b36
          speaker: wolf_larsen
          text: >-
            Who's the lookout?
        - id: ch01-b37
          speaker: holyoak
          emotion: fearful
          text: >-
            I am, sir. I only nodded off this very minute. I'm sorry. It won't happen again, sir.
        - id: ch01-b38
          speaker: wolf_larsen
          text: >-
            Did you see or hear anything on deck?
        - id: ch01-b39
          speaker: holyoak
          text: >-
            No, sir. I didn't see or hear anything.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Wolf Larsen turned away with a disgusted sound before Holyoak could finish. The sailor rubbed his eyes, surprised that he had escaped so easily.
        - id: ch01-b41
          speaker: wolf_larsen
          text: >-
            Quietly now.
        - id: ch01-b42
          speaker: narrator
          text: >-
            He bent his body into the forecastle hatch and began to climb down. I followed, my heart trembling. I had no more idea what would happen next than I had of what had already happened. But someone had spilled blood. Wolf Larsen had not gone into the sea on a whim, and his scalp had been split open. Johansen was missing too. Those facts followed me down the ladder.
        - id: ch01-b43
          speaker: narrator
          text: >-
            It was my first time inside the forecastle, and I have never forgotten the impression it made when my feet reached the bottom of the ladder. The room had been built directly into the narrow point of the schooner's bow, so it formed a triangle. Twelve bunks stood in two tiers along its three sides. The whole space was no larger than a small bedroom, yet twelve men were crowded into it to eat, sleep, and perform every ordinary act of life. My own bedroom at home was not large, but it could have held a dozen rooms like this one. If I counted the greater height of its ceiling, it might have held twenty.
        - id: ch01-b44
          speaker: narrator
          text: >-
            The air smelled sour and stale. A dim sea lamp swung overhead. Every available patch of wall was buried under sea boots, oilskins, and clothing of every kind, some clean and some dirty. As the schooner rolled, they brushed back and forth with a sound like tree branches scraping a roof or wall. Somewhere, a boot struck loudly at uneven moments. Though the night at sea was mild, the timbers and walls never stopped creaking, and deep, hollow noises rose from beneath the floor.
        - id: ch01-b45
          speaker: narrator
          text: >-
            None of that troubled the eight sleeping men from the two watches below. Their breathing made the room hot and thick with human odor. Snores, sighs, and half-formed groans filled my ears, all the sounds of the animal side of man at rest. Yet were all of them truly asleep? Had every one of them been asleep a moment earlier? Wolf Larsen had clearly come to find the men who only appeared to sleep, or who had not been sleeping until very recently. His way of searching reminded me of a tale from Boccaccio.
        - id: ch01-b46
          speaker: narrator
          text: >-
            He lifted the sea lamp from its frame and gave it to me. Then he started with the forward bunks on the starboard side. Oofty-Oofty, the Kanaka sailor, lay in the upper one. His shipmates had given him that name. He was a splendid seaman, and now he slept peacefully on his back. One arm rested beneath his head and the other lay across the blankets.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Wolf Larsen placed a thumb and finger on the sleeping man's wrist and counted his pulse. Oofty-Oofty woke in the middle of it, as gently as he had slept. His body did not move. Only his eyes opened, large, black, and fixed on our faces. Wolf Larsen touched a finger to his lips. The eyes closed again.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Louis lay in the lower bunk, very fat, warm, and sweating. There was no doubt that he was asleep, and he worked hard at it. While Wolf Larsen held his wrist, Louis bent his body until only his shoulders and heels touched the bunk. His lips moved, and a strange stream of words came out.
        - id: ch01-b49
          speaker: louis
          text: >-
            A shilling's worth a quarter, but watch out for threepenny bits. The publicans will pass them to you for sixpence.
        - id: ch01-b50
          speaker: narrator
          text: >-
            He rolled heavily onto his side with a sobbing sigh and kept talking in his sleep.
        - id: ch01-b51
          speaker: louis
          text: >-
            A sixpence is a tanner, and a shilling is a bob. But I don't know what a pony is.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Satisfied that Louis and Oofty-Oofty were honestly asleep, Wolf Larsen moved to the next pair of starboard bunks. In the lamplight we saw Leach above and Johnson below. Wolf Larsen bent toward the lower bunk to take Johnson's pulse. I stood upright holding the lamp, and from there I saw Leach raise his head without a sound and peer over the edge of his bunk.
        - id: ch01-b53
          speaker: narrator
          text: >-
            He must have understood Wolf Larsen's trick and known that discovery was certain. In the same instant, the lamp was knocked from my hand and the forecastle went black. Leach must also have leaped straight down onto Wolf Larsen.
        - id: ch01-b54
          speaker: narrator
          text: >-
            The first sounds were like a bull and a wolf locked in combat. Wolf Larsen gave one great, furious roar. Leach answered with a desperate snarl that chilled my blood. Johnson must have joined him at once. His humble, cringing behavior on deck during the past few days had not been submission at all. It had only been a planned deception while the men prepared their attack.
        - id: ch01-b55
          speaker: narrator
          text: >-
            The fight in the dark terrified me so completely that I leaned against the ladder, shaking and unable to climb. The old sickness that the sight of physical violence always brought rose in my stomach, though this time I could see nothing. I heard every blow land with the soft, crushing sound of flesh driven hard against flesh. Bodies crashed together around the narrow room. Men breathed heavily and gave short, quick gasps whenever sudden pain struck them.
        - id: ch01-b56
          speaker: narrator
          text: >-
            More men must have been part of the plot to murder both captain and mate. The growing noise told me that several of their shipmates had quickly come through the darkness to reinforce Leach and Johnson.
        - id: ch01-b57
          speaker: leach
          emotion: angry
          text: >-
            Somebody get a knife!
        - id: ch01-b58
          speaker: johnson
          emotion: angry
          text: >-
            Hit him on the head! Crush his brains!
        - id: ch01-b59
          speaker: narrator
          text: >-
            After that first roar, Wolf Larsen made no sound. He fought grimly and silently for his life. The men pressed him hard. They had kept him from gaining his feet at the start, and in spite of his tremendous strength, I believed there was no hope for him.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Their struggle showed me its force when the mass of bodies knocked me down and bruised me badly. In the confusion, I crawled into an empty lower bunk and got out of their way.
        - id: ch01-b61
          speaker: leach
          text: >-
            All hands! We've caught him! We've got him!
        - id: ch01-b62
          speakers: [sailor_1, sailor_2]
          ensemble: duo
          text: >-
            Who have you got?
        - id: ch01-b63
          speaker: leach
          text: >-
            It's the bloody mate!
        - id: ch01-b64
          speaker: narrator
          text: >-
            Leach forced out the lie through the crush of bodies. The men who had truly been asleep answered with joyful shouts. Then seven strong men piled onto Wolf Larsen. I believe Louis alone stayed out of it. The forecastle became an angry beehive stirred up by an intruder.
        - id: ch01-b65
          speaker: latimer
          text: >-
            What's happening down there?
        - id: ch01-b66
          speaker: narrator
          text: >-
            Latimer called through the hatch but was too cautious to climb into the fury he could hear below.
        - id: ch01-b67
          speaker: leach
          emotion: angry
          text: >-
            Won't somebody bring a knife? Please, get a knife!
        - id: ch01-b68
          speaker: narrator
          text: >-
            He pleaded during the first brief lull. But the number of attackers worked against them. They crowded one another and blocked their own efforts. Wolf Larsen had only one purpose, and he achieved it. He fought his way across the floor toward the ladder.
        - id: ch01-b69
          speaker: narrator
          text: >-
            In the total darkness, I followed him by sound. Once he reached the foot of the ladder, only a giant could have done what he did. The whole pack strained to pull him backward and down. With the power of his arms, he raised himself from the floor little by little until he stood upright. Then, using hands and feet, he began the slow climb.
        - id: ch01-b70
          speaker: narrator
          text: >-
            I saw the final part. Latimer had gone for a lantern, and now he held it over the hatch so its light shone down. Wolf Larsen was almost at the top, though his body was hidden beneath the men clinging to him. They twisted together like one huge spider with many legs, swaying as the schooner rolled. Still the mass climbed, one step at a time, with long pauses between steps.
        - id: ch01-b71
          speaker: narrator
          text: >-
            Once they tipped backward and nearly fell. Then Wolf Larsen recovered his broken hold, and the mass moved upward again.
        - id: ch01-b72
          speaker: latimer
          text: >-
            Who is it?
        - id: ch01-b73
          speaker: narrator
          text: >-
            Latimer's puzzled face looked down through the lantern light.
        - id: ch01-b74
          speaker: sailor_1
          text: >-
            It's Larsen.
        - id: ch01-b75
          speaker: narrator
          text: >-
            The answer came muffled from somewhere inside the struggling mass. Latimer reached down with his free hand, and another hand shot up to grasp it. He pulled. Wolf Larsen rose the next two steps in a rush, then threw his other hand over the edge of the hatch.
        - id: ch01-b76
          speaker: narrator
          text: >-
            The mass swung away from the ladder while the men still clung to their escaping enemy. One after another, they fell off. Some were scraped away by the sharp edge of the hatch, and others were kicked loose by Wolf Larsen's powerful legs. Leach held on longest. At last he dropped from the top and landed head and shoulders across the men sprawled below.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Wolf Larsen and the lantern vanished above us. We were left in darkness.
