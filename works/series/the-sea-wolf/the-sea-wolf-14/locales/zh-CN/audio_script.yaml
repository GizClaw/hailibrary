audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    harrison:
      display_name: 哈里森
      tts:
        delivery: 直率随和，带着水手朴实的爽快
        timbre: 清亮粗朴的年轻男声
        pace: 放松自然
        pitch: 中音
    leach:
      display_name: 利奇
      tts:
        delivery: 倔强激烈，愤怒时近乎不顾一切
        timbre: 紧绷而略带沙哑的年轻男声
        pace: 明快，激动时急促爆发
        pitch: 中高音
    louis:
      display_name: 路易
      tts:
        delivery: 爽朗健谈，谈到预兆时透出郑重与神秘
        timbre: 浑厚而饱经风霜的成年男声
        pace: 起伏鲜明，兴奋时语流加快
        pitch: 中低音
    johansen:
      display_name: 约翰森
      tts:
        delivery: 粗暴阴沉，带着积怨和凶狠
        timbre: 浑浊有力的成年男声
        pace: 短促沉重
        pitch: 低音
    johnson:
      display_name: 约翰逊
      tts:
        delivery: 迟缓沉着，坦率而不肯屈服
        timbre: 粗粝厚实的成年男声
        pace: 缓慢，每句话都说得清楚郑重
        pitch: 中低音
    holyoak:
      display_name: 霍利约克
      tts:
        delivery: 老练谨慎，面对船长时紧张服从
        timbre: 粗朴干涩的成年男声
        pace: 平稳，心虚时略有迟疑
        pitch: 中低音
    sleeper_1:
      display_name: 水手甲
      tts:
        delivery: 睡意未消，惊醒后困惑而警觉
        timbre: 粗厚的成年男声
        pace: 短促迟疑
        pitch: 中低音
    sleeper_2:
      display_name: 水手乙
      tts:
        delivery: 迷迷糊糊，跟随同伴脱口发问
        timbre: 略显沙哑的成年男声
        pace: 短促
        pitch: 中音
    latimer:
      display_name: 拉蒂默
      tts:
        delivery: 谨慎警觉，紧急时干脆有力
        timbre: 明亮结实的成年男声
        pace: 平稳，呼喊时加快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十四章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            到了这时，我才忽然懂得，自己从前根本不知道女人有多可贵。我并不多情，至少我自己从没发觉。可在登上“幽灵号”以前，我从来没有真正离开过女人的气息。母亲和姐妹们总围在身边，我却只想躲开。她们事事惦记我的健康，操心得让我受不了。隔些日子，她们还要闯进书房大扫除。那里的东西本来乱得很有章法，我也颇为得意。经她们一收拾，眼睛看着整齐了，实际却更乱、更没有章法。等她们离开，我什么也找不到。
        - id: ch01-b02
          speaker: narrator
          text: >-
            可现在，我多么想再听听她们裙子窸窣摆动的声音。那曾是我最讨厌的声音，如今想来却亲切极了。要是能回家，我绝不会再对她们不耐烦。她们要我从早到晚吃药也好，一天到晚收拾书房也好，我都会靠在椅子上看着，庆幸自己还有母亲，还有好几个姐妹。
        - id: ch01-b03
          speaker: narrator
          text: >-
            接着，我想到了“幽灵号”上这二十来个男人。他们的母亲都去了哪里？一群男人彻底离开女人，只跟彼此挤在一起闯荡，这既不自然，也不健康。这样活下去，粗野和残暴一定会冒出来。假如他们有妻子、姐妹和女儿，也许还会懂得温柔、怜惜和同情。可他们没有一个人结婚。多少年来，也没有一个人接触过善良的女人，没有感受过那种不由自主从她身上散发出来的感化和救赎。他们的生活完全失去了平衡。男人天性里本就有兽性的一面，如今越长越大。精神上的另一面却一点点萎缩，几乎枯死了。
        - id: ch01-b04
          speaker: narrator
          text: >-
            这些独身汉天天粗暴地彼此冲撞，心也在碰撞里磨得越来越硬。有时我甚至不相信他们曾有过母亲。他们像一群半人半兽的异类，是独立于人类之外的一个种族，根本没有男女之分。他们仿佛海龟蛋被太阳晒一晒，就从沙里孵了出来，又或者是用某种同样卑贱的办法得到了生命。此后，他们一辈子泡在野蛮和邪恶里腐烂，死去时也像活着时那样丑陋。
        - id: ch01-b05
          speaker: narrator
          text: >-
            这些念头让我好奇起来。昨晚，我第一次和约翰森说了几句工作之外的话。他十八岁离开瑞典，如今三十八岁，二十年来一次也没回过家。两年前，他在智利的一家水手寄宿店遇见同乡，这才知道母亲仍然活着。他望着罗经柜出神，随后猛地看了哈里森一眼。哈里森掌着舵，航向已经偏了一个罗经点。
        - id: ch01-b06
          speaker: johansen
          text: 她现在准是个很老的老太太了。
        - id: ch01-b07
          speaker: humphrey
          text: 你上次给她写信，是哪一年？
        - id: ch01-b08
          speaker: johansen
          text: >-
            八一年……不，是八二年？也不对。八三年，对，就是八三年。十年前，我在马达加斯加的一个小港口做买卖。
        - id: ch01-b09
          speaker: johansen
          text: >-
            我每年都打算回去，只差一年，又何必写信呢？可每一年都会出事，最后都没回成。现在我已经是大副了。等到了旧金山结清工钱，我也许能拿到五百美元。然后我去大帆船上找个差事，绕过合恩角到利物浦，再挣一笔。从那里买票回家以后，我就不让她继续干活了。
        - id: ch01-b10
          speaker: humphrey
          text: 她现在还在干活吗？她多大了？
        - id: ch01-b11
          speaker: johansen
          text: >-
            七十岁上下吧。在我们国家，人从生下来一直干到死。正因为这样，我们才活得长。我能活到一百岁。
        - id: ch01-b12
          speaker: narrator
          text: >-
            这场谈话，我永远忘不了。那是我最后一次听见约翰森开口。也许，这就是他一生最后说出的几句话。谈完后，我下到舱房准备睡觉，可下面闷得让人透不过气，我临时改变了主意。那晚海面平静，我们已经离开信风带，“幽灵号”几乎不动，每小时勉强才走一海里。我把一条毯子和一个枕头夹在胳膊下面，重新回到甲板上。
        - id: ch01-b13
          speaker: narrator
          text: >-
            经过哈里森和舱顶的罗经柜之间时，我发现他这次足足偏了三个罗经点。我还以为他睡着了，怕他挨训，甚至遭到更坏的惩罚，就叫了他一声。可他醒着。两眼睁得很大，直直望着前面，神色慌乱，连话也说不出来。
        - id: ch01-b14
          speaker: humphrey
          text: 你怎么了？是不是病了？
        - id: ch01-b15
          speaker: narrator
          text: 他摇摇头，又像刚从梦里惊醒似的长叹一声，这才喘过气来。
        - id: ch01-b16
          speaker: humphrey
          text: 那就赶快把航向摆正。
        - id: ch01-b17
          speaker: narrator
          text: >-
            他拨过几根舵轮辐条。罗盘卡慢慢转向北偏西，轻轻摆了几下，稳住了。我重新抱紧铺盖，正准备往前走，眼角却看见船尾栏杆边有什么东西动了一下。
        - id: ch01-b18
          speaker: narrator
          text: >-
            一只筋骨分明的手抓着栏杆，水还在往下滴。紧接着，黑暗里又伸出一只手。我盯得无法移开目光。到底是什么东西正从深海的黑暗中来访？不管那是什么，我看得出，它正沿着计程仪的拖绳往船上爬。先是湿头发紧贴着的脑袋，然后是眼睛和脸。那是海狼·拉森。他右边脸颊上都是血，血从头上的伤口流下来。
        - id: ch01-b19
          speaker: narrator
          text: >-
            他猛一使劲翻进船里，站起来，立刻扫了掌舵人一眼，像是在确认那是谁，会不会威胁自己。海水从他身上直往下淌，咕噜咕噜的细响搅得我心神不宁。他向我走来，我本能地退了一步。因为他的眼睛里，分明写着死亡。
        - id: ch01-b20
          speaker: wolf_larsen
          text: 没事了，汉普。大副在哪儿？
        - id: ch01-b21
          speaker: narrator
          text: 我摇了摇头。
        - id: ch01-b22
          speaker: wolf_larsen
          text: 约翰森！约翰森，你在哪里？
        - id: ch01-b23
          speaker: wolf_larsen
          text: 他在哪里？
        - id: ch01-b24
          speaker: harrison
          text: 我不知道，船长。刚才我看见他往前甲板去了。
        - id: ch01-b25
          speaker: wolf_larsen
          text: >-
            我也去了前甲板。可你看清楚，我回来走的不是原路。你能说说这是怎么回事吗？
        - id: ch01-b26
          speaker: harrison
          text: 您一定是掉进海里了，船长。
        - id: ch01-b27
          speaker: humphrey
          text: 要我去统舱找找他吗，船长？
        - id: ch01-b28
          speaker: wolf_larsen
          text: >-
            你在那里找不到他，汉普。不过你能帮上忙。跟我走，铺盖别拿了，就扔在这儿。
        - id: ch01-b29
          speaker: narrator
          text: >-
            我踩着他的脚步紧跟在后面。船中部没有人影，也听不见一点动静。
        - id: ch01-b30
          speaker: wolf_larsen
          text: 那些该死的猎手，一个个又肥又懒，连四个小时的班都不肯值。
        - id: ch01-b31
          speaker: narrator
          text: >-
            到了艏楼甲板，我们找到三个睡着的水手。拉森把他们逐个翻过来，看清每一张脸。他们属于甲板当值的那一班。天气好的时候，船上会让当班水手睡觉，只留下值班驾驶员、舵手和瞭望员醒着。
        - id: ch01-b32
          speaker: wolf_larsen
          text: 谁负责瞭望？
        - id: ch01-b33
          speaker: holyoak
          text: >-
            是我，船长。我就是刚才才打了个盹。对不起，船长，以后绝不会再有了。
        - id: ch01-b34
          speaker: wolf_larsen
          text: 甲板上有什么动静？你看见或者听见什么了吗？
        - id: ch01-b35
          speaker: holyoak
          text: 没有，船长。
        - id: ch01-b36
          speaker: narrator
          text: >-
            拉森厌恶地哼了一声，转身就走。霍利约克没想到自己这么容易便逃过惩罚，还在惊讶地揉眼睛。拉森弓起身子钻进水手舱口，临下去前，压低声音提醒我。
        - id: ch01-b37
          speaker: wolf_larsen
          text: 现在别出声。
        - id: ch01-b38
          speaker: narrator
          text: >-
            我提心吊胆地跟下去。我不知道刚才发生了什么，也猜不到接下来会怎样。可拉森头皮豁开，还被弄到船外，绝不会是他自己一时兴起。更何况，约翰森已经不见了。
        - id: ch01-b39
          speaker: narrator
          text: >-
            我第一次进入水手舱。双脚落到梯子底下时，那景象一下刻进了脑子里，恐怕很久也忘不了。水手舱造在纵帆船最尖的船头，是个三角形。三面舱壁边都排着上下两层铺位，一共十二张。地方还没有格拉布街的一间门厅式小卧室大，却塞了十二个人。他们在这里吃饭、睡觉，连生活中所有事情都挤在这里完成。我家那间卧室并不算大，却放得下十二个这样的水手舱。要是连屋顶的高度也算进去，恐怕二十个都装得下。
        - id: ch01-b40
          speaker: narrator
          text: >-
            一股酸馊的霉味扑面而来。摇摆的船灯光线很暗，每一寸能用的舱壁都挂满了东西。那里有海靴、油布衣，还有各式各样的衣物，有干净的，也有肮脏的，一层叠着一层。船身每摇一下，它们就前后摆动，彼此擦出沙沙的声音，像树枝刮过屋顶和墙。不知哪个角落里，一只靴子还会冷不防砰地撞上舱壁，响一声，停一阵，再响一声。海上明明风平浪静，船板和隔舱还是咯吱响个不停，地板下面更有深不可测的怪声，一刻也不停。
        - id: ch01-b41
          speaker: narrator
          text: >-
            睡着的人对此毫不在意。舱里共有八个，两班休息的水手全睡在这里。呼吸带来的热气和气味塞满空气，耳朵里也灌满鼾声、叹息和半声呻吟。这些动静清清楚楚地告诉人，眼前是一群正在休息的兽人。可他们真的全都睡着了吗？之前也一直睡着吗？拉森来这里，显然就是要找那些看似睡着、其实醒着的人，或者不久之前还没睡的人。他的查法，让我想起了薄伽丘故事里的手段。
        - id: ch01-b42
          speaker: narrator
          text: >-
            拉森从摇架上摘下船灯交给我，从右舷最前面的铺位查起。上铺是乌夫蒂—乌夫蒂，一个卡纳卡人，也是出色的水手。那是同伴给他起的名字。他仰面睡着，一只胳膊垫着头，一只放在毯子上，呼吸安静得像个女人。拉森用两根手指按住他的手腕数脉搏。乌夫蒂—乌夫蒂醒了，可身体纹丝不动，只有那双又大又黑的眼睛忽然张开，一眨不眨地看着我们。拉森把手指放在唇上，他便又闭上眼睛。
        - id: ch01-b43
          speaker: narrator
          text: >-
            下铺是路易。他又胖又热，满身是汗，睡得绝不作假，只是每一口气都很吃力。拉森握着他的手腕时，他不安地弓起身体，一时只靠肩膀和脚跟撑着铺板。嘴唇动了动，冒出一句谁也听不懂的梦话。
        - id: ch01-b44
          speaker: louis
          text: >-
            一先令值一个二十五分硬币。可得留神三便士银币，不然酒馆老板会把它当六便士塞给你。
        - id: ch01-b45
          speaker: narrator
          text: 他翻到一边，发出一声沉重的呜咽似的叹息。
        - id: ch01-b46
          speaker: louis
          text: 六便士叫“皮匠”，一先令叫“鲍勃”。可“小马”是多少钱，我就不知道了。
        - id: ch01-b47
          speaker: narrator
          text: >-
            拉森确认路易和那个卡纳卡人是真的睡着，便走向右舷接下来的两个铺位。灯光下，上铺躺着利奇，下铺是约翰逊。拉森弯腰去摸约翰逊的脉搏。我直身举着灯，看见利奇悄悄抬起头，从铺沿上窥探。他一定看穿了这套办法，知道再查下去必然露馅。灯猛地从我手中被打掉，舱里一下黑透了。同一刻，他也一定从上铺直扑到拉森身上。
        - id: ch01-b48
          speaker: narrator
          text: >-
            最初的声响，像一头公牛和一匹恶狼打了起来。拉森爆出狂怒的咆哮，利奇则低声嘶吼，绝望得叫人毛骨悚然。约翰逊马上也扑了上去。过去几天里，他在甲板上那副卑躬屈膝的样子，原来全是事先安排好的假象。
        - id: ch01-b49
          speaker: narrator
          text: >-
            黑暗中的搏斗把我吓得浑身发抖。我靠着梯子，连爬上去的力气也没有。每次碰上肉体暴力，我胃里都会泛起熟悉的恶心。这次眼睛看不见，耳朵却听得清楚。拳头砸进身体，发出肉撞肉的闷响。扭成一团的人四处冲撞，粗重喘息之间，又响起突然吃痛的短促抽气。
        - id: ch01-b50
          speaker: narrator
          text: >-
            密谋杀死船长和大副的显然还有别人。听声音就知道，利奇和约翰逊很快得到了几个同伴的帮助。
        - id: ch01-b51
          speaker: leach
          text: 谁去拿把刀来！
          emotion: angry
        - id: ch01-b52
          speaker: johnson
          text: 砸他的头！把脑浆砸出来！
          emotion: angry
        - id: ch01-b53
          speaker: narrator
          text: >-
            除了开头那声咆哮，拉森再没有出声。他咬着牙，一言不发，只顾为活命厮打。他被死死围住，一开打便倒在地上，始终没法站起来。哪怕有那身惊人的力气，我也觉得他没有希望了。他们搏斗得有多凶，我立刻亲身领教。纠缠在一起的身体猛冲过来，把我撞翻在地，撞得浑身青肿。我在地板上躲着那些乱踩乱踢的腿，总算趁着混乱爬进一张空着的下铺，藏到一旁。
        - id: ch01-b54
          speaker: leach
          text: 所有人都来！我们抓住他了！抓住他了！
          emotion: happy
        - id: ch01-b55
          speakers: [sleeper_1, sleeper_2]
          ensemble: duo
          text: 抓住谁了？
        - id: ch01-b56
          speaker: narrator
          text: >-
            那些真正睡着的人惊醒了，还不知道发生了什么。利奇的声音被死死压着，却狡猾地挤出一句回答。
        - id: ch01-b57
          speaker: leach
          text: 那个该死的大副！
        - id: ch01-b58
          speaker: narrator
          text: >-
            欢呼声立刻响起。转眼间，七个壮汉全压在拉森身上，我想只有路易没有参加。水手舱像一只被入侵者惊动的蜂巢，所有愤怒都在黑暗里嗡嗡翻腾。
        - id: ch01-b59
          speaker: latimer
          text: 喂！下面出了什么事？
        - id: ch01-b60
          speaker: narrator
          text: 拉蒂默只在舱口往下喊。他听见下面像地狱一样乱成一团，谨慎得不肯下来。
        - id: ch01-b61
          speaker: leach
          text: 就没人去拿刀吗？啊，快拿把刀来！
          emotion: angry
        - id: ch01-b62
          speaker: narrator
          text: >-
            袭击的人太多，反而乱成一团，彼此的胳膊和身体挡住了自己的力气。拉森却只有一个目标。他要从舱底一路打过去，抵达梯子。四周黑得什么也看不见，可我能循着冲撞和喘息的声音，一点一点追踪他的去向。他终于挪到梯子脚下。接下来，只有巨人才能办到。那一群人压在他身上，拼命往后拖、往下拽。他却只靠两条胳膊的力量，一点一点把身体从地板上拉起来，直到重新站直。然后，他手脚并用，拖着整群人一级一级往上爬。每上一级都要挣扎很久，可他始终没有退回去。
        - id: ch01-b63
          speaker: narrator
          text: >-
            最后一幕，我终于亲眼看见了。拉蒂默总算去取来一盏提灯，举在舱口上方，让灯光直照下去。拉森已经快到顶端，我还是看不见他本人，只看见一大团人紧紧缠在他身上。那东西不停地蠕动扭曲，像一只长着许多条腿的巨蛛，又随着船身有规律地左右摇晃。它还在往上，一步接着一步，每两步之间都隔着很长时间。有一次，整团人摇摇欲坠，眼看就要跌回舱底。可松脱的支撑重新稳住，它仍然继续上升。
        - id: ch01-b64
          speaker: latimer
          text: 是谁？
        - id: ch01-b65
          speaker: wolf_larsen
          text: 是拉森。
        - id: ch01-b66
          speaker: narrator
          text: >-
            那声音从人堆里闷闷地传出来。灯光下，拉蒂默困惑地往下看，随后腾出一只手。一只手猛地伸上去，紧紧抓住了他。拉蒂默用力一拽，拉森一下冲过接下来的两级梯子，另一只手也攀住舱口边缘。
        - id: ch01-b67
          speaker: narrator
          text: >-
            那团人离开梯子悬在半空，可众人仍抓着快要逃脱的对手。接着，他们一个一个掉下去。有的被舱口锋利的边缘刮落，有的让拉森猛踢的双腿踹开。利奇最后才松脱，从舱口顶端直直摔回去，头和肩膀砸在下面横七竖八的同伴身上。随后，海狼·拉森和提灯一起消失，只留下我们困在黑暗里。
