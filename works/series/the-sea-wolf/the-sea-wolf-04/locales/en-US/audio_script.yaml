audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    mugridge:
      display_name: Thomas Mugridge
      tts:
        delivery: sneering, officious, and quick to bully
        timbre: nasal and wiry
        pace: brisk with sharp bursts
        pitch: medium-high
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding, cool, and darkly amused
        timbre: deep and powerful
        pace: measured
        pitch: low
    henderson:
      display_name: Henderson
      tts:
        delivery: casual, blunt, and unconcerned
        timbre: lean and weathered
        pace: easy
        pitch: medium-low
  chapters:
    - id: ch01
      title: CHAPTER IV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            My next days aboard the sealing schooner Ghost brought me humiliation and pain as I tried to find a place in this strange new life. The cook had changed completely. The crew called him the doctor, the hunters called him Tommy, and Wolf Larsen called him Cooky. Before, when he took me for a fine gentleman with soft skin, he had bowed and flattered me. Now I was only a cabin boy in his eyes, and a useless one at that. So he ordered me about and looked for a fight.
        - id: ch01-b02
          speaker: narrator
          text: >-
            He even insisted that I call him Mr. Mugridge. His manner was unbearable as he taught me my duties. I had four little staterooms and the cabin to tend, and I also had to help him in the galley. I knew nothing about peeling potatoes or scrubbing greasy pots. Every mistake gave him another chance to mock me. He cared nothing for the life I had led or the work I was used to. By the end of that day, I hated him more fiercely than I had ever hated anyone.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The weather made that first day harder still. The Ghost was sailing under close reefs, though I did not learn that term until later, and she plunged through what Mugridge called a howling southeaster. At half past five, I followed his orders and set the cabin table. I fitted the rough-weather trays in place, then began carrying down the tea and hot food. That was when I first learned what it meant for a sea to come aboard.
        - id: ch01-b04
          speaker: mugridge
          text: >-
            Keep your eyes open, or you'll get soaked.
        - id: ch01-b05
          speaker: narrator
          text: >-
            I stepped from the galley with a large teapot in one hand and several loaves of fresh bread tucked into my other arm. Henderson, a tall, loose-jointed hunter, was moving aft from the steerage toward the cabin. The hunters jokingly called their sleeping quarters amidships the steerage. Above us, Wolf Larsen stood on the poop deck, smoking his ever-present cigar.
        - id: ch01-b06
          speaker: mugridge
          emotion: fearful
          text: >-
            Here it comes! Get out of the way!
        - id: ch01-b07
          speaker: narrator
          text: >-
            I stopped because I had no idea what he meant. The galley door slammed shut. Henderson suddenly leaped for the main rigging and climbed the inside of it until he was far above my head. Then I saw a huge wave curling over the rail, white with foam. I stood directly beneath it. Everything at sea was still too new for my mind to react quickly. I knew I was in danger, but I simply froze.
        - id: ch01-b08
          speaker: wolf_larsen
          emotion: fearful
          text: >-
            Grab hold of something, you... you Hump!
        - id: ch01-b09
          speaker: narrator
          text: >-
            I sprang toward the rigging, but the wall of water fell before I reached it. After that, everything became a confusion. I was underwater, choking and drowning. My feet flew out from under me. I tumbled over and over while the sea swept me somewhere I could not see. I struck several hard objects, and one blow smashed terribly into my right knee. Then the flood drained away, and at last I could breathe again.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The water had hurled me against the galley, around the steerage companionway, and across the deck into the lee scuppers. The pain in my knee was terrible. I thought I could not stand on that leg and felt sure it was broken. Then Mugridge shouted at me through the galley door on the sheltered side.
        - id: ch01-b11
          speaker: mugridge
          emotion: angry
          text: >-
            You there! Don't take all night! Where's my pot? Did you lose it overboard? It would serve you right if you'd broken your neck!
        - id: ch01-b12
          speaker: narrator
          text: >-
            Somehow I pulled myself upright. The big teapot was still clutched in my hand. I limped back to the galley and gave it to him, but that only seemed to make him more indignant, whether the anger was real or put on.
        - id: ch01-b13
          speaker: mugridge
          emotion: angry
          text: >-
            What a useless mess you are! Tell me, what good are you? You can't even carry a little tea aft without losing it. Now I've got to make another pot.
        - id: ch01-b14
          speaker: mugridge
          emotion: angry
          text: >-
            And why are you making that face? Did poor mother's darling hurt his poor little leg?
        - id: ch01-b15
          speaker: narrator
          text: >-
            I was not whimpering, though pain must have twisted my face. I gathered all the determination I had, clenched my teeth, and hobbled between galley and cabin without another accident. That wave left me with two things. One was a damaged kneecap that received no treatment and hurt me for months. The other was the name Wolf Larsen had shouted from the poop. From then on, everyone aboard called me Hump. In time, the name entered my own thoughts. I began to feel that I was Hump and always had been.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Serving dinner was no easy matter. Wolf Larsen, Johansen, and the six hunters sat around the table in the cramped cabin while the schooner pitched and rolled. I had to keep moving among them, though every violent lurch threatened my balance. Worse than the motion was the complete absence of sympathy. I could feel my knee swelling larger beneath my clothes, and the pain made me faint and sick. Whenever I passed the cabin mirror, I caught sight of my own face, white and ghostly and twisted with pain. Every man at that table must have understood my condition. Not one of them spoke or showed that he noticed.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Later, as I washed the dishes, Wolf Larsen finally spoke to me. I was almost grateful, even for what he said.
        - id: ch01-b18
          speaker: wolf_larsen
          text: >-
            Don't trouble yourself over a little injury like that. You'll grow used to these things. It may leave you partly crippled, but you'll be learning how to walk at the same time.
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            You would call that a paradox, wouldn't you?
        - id: ch01-b20
          speaker: narrator
          text: >-
            I gave him my usual answer, “Yes, sir,” and nodded. He looked pleased.
        - id: ch01-b21
          speaker: wolf_larsen
          text: >-
            You know something about books, I suppose. Good. You and I will talk about them one day.
        - id: ch01-b22
          speaker: narrator
          text: >-
            With that, he dismissed me from his attention, turned his back, and went on deck.
        - id: ch01-b23
          speaker: narrator
          text: >-
            That night, after what seemed an endless amount of work, I was sent to sleep in the steerage. I made up an empty bunk and was thankful to escape Mugridge and get off my feet. To my surprise, my clothes had dried on my body, and I showed no sign of catching cold. That was true even after this soaking and the long one I had endured when the Martinez went down. In any ordinary life, all I had suffered would have put me in bed under the care of a trained nurse.
        - id: ch01-b24
          speaker: narrator
          text: >-
            My knee, however, tormented me. In the middle of the swelling, the kneecap seemed to have turned up on its edge. I sat in my bunk trying to examine it while all six hunters smoked and talked loudly around me. Henderson glanced at the injury as he passed.
        - id: ch01-b25
          speaker: henderson
          text: >-
            That looks bad. Wrap a rag around it. You'll be fine.
        - id: ch01-b26
          speaker: narrator
          text: >-
            That was the full measure of his concern. On land, I would have been flat on my back with a surgeon beside me and strict orders not to move. Yet I must be fair to these men. They treated their own suffering with the same hardness they showed toward mine. Part of it came from long habit. I also believed their nerves were built in a less sensitive way. A finely tuned, high-strung man, I thought, would suffer two or three times as much from the very same wound.
        - id: ch01-b27
          speaker: narrator
          text: >-
            I was exhausted, but the pain would not let me sleep. I could barely stop myself from groaning. At home, I would certainly have cried out. Here, in this raw new world, I felt forced to crush every sound down. The men around me could be as stoic as savages when the trouble was serious, then as childish as boys over something small.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Later in the voyage, I saw one of the hunters, Kerfoot, have a finger smashed to a pulp. He neither complained nor changed his expression. Yet I saw that same man fly into a wild rage many times over some trifle. He was doing exactly that now. He bellowed, waved his arms, and cursed furiously, all because he and another hunter could not agree about whether a newborn seal knew how to swim.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Kerfoot declared that a seal pup could swim the instant it was born. Latimer, a lean, Yankee-looking man with narrow, shrewd eyes, insisted it could not. Why else, he argued, would a pup be born on land? Its mother had to teach it to swim, just as birds had to teach their young to fly.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The other four hunters mostly leaned over the table or lay in their bunks and let those two fight it out. Still, they followed every word. Every so often they chose sides with great excitement. Sometimes all six shouted together, and their voices rolled through the narrow room like little bursts of thunder.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Their reasoning was even more childish than the argument itself. In truth, there was hardly any reasoning. One man would simply assume he was right and state his belief as loudly and fiercely as he could. Then he would attack the other man's judgment, common sense, nationality, or anything foolish he had done before. The answer came back in precisely the same way, with another claim and another personal attack. Neither side offered real proof about the seal pup. I tell this because it shows the minds of the men among whom I had been thrown. They had the bodies of grown men, but they thought like children.
        - id: ch01-b32
          speaker: narrator
          text: >-
            All the while, they smoked without stopping. Their tobacco was cheap, coarse, and foul-smelling, and the air grew dark and thick with it. The Ghost rolled and plunged as she fought the storm. Smoke and motion together might have made me seasick if I had been prone to it. As it was, I felt badly nauseated, though the pain and exhaustion may have caused that.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Lying there, I could think of little but myself and the impossible turn my life had taken. Nothing like it had ever entered my dreams. I was Humphrey Van Weyden, a scholar and a dabbler in art and literature. Yet here I lay on a seal-hunting schooner bound for the Bering Sea, serving as a cabin boy. I had never done hard labor in my life, much less the dirty work of a kitchen servant. Until now, my days had been quiet, comfortable, and uneventful. I had lived on a secure income, surrounded by books, keeping mostly to myself.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Sports and a rough physical life had never attracted me. Mine had always been a quiet, settled life, with most of my hours spent sitting over books. My father and sisters had called me a bookworm since childhood. I had gone camping only once, and I left almost as soon as the trip began so I could return to the comfort and convenience of a roof. Now the future seemed to stretch ahead in one dreary line of setting tables, peeling potatoes, and washing dishes.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Nor was I strong. Doctors had always told me I possessed an excellent constitution, but I had never trained my body. My muscles were small and soft. The doctors had pointed that out often while trying to persuade me to take up the latest exercises. I had always preferred using my mind. Now I faced a brutal life for which my body had no preparation at all.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Those were only some of the thoughts passing through my mind. I admit I dwelt on them partly to defend myself in advance, to explain the weak and helpless part I was destined to play in the life ahead. But I thought of my mother and sisters too, and pictured the grief that must have filled their home. To them, I was listed among the missing dead from the Martinez disaster. No one knew I had survived. They believed my body was somewhere in the water and would never be recovered.
        - id: ch01-b37
          speaker: narrator
          text: >-
            I could picture the newspaper headlines. I saw the men at the University Club and the Bibelot shaking their heads and murmuring, “Poor fellow.” I saw Charley Furuseth as he had been when I left him that morning. He lounged in his dressing gown on the window couch among its many pillows, delivering gloomy little judgments as if each one were a final truth.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Through all these thoughts, the Ghost rolled and plunged onward. She climbed moving mountains of water, dropped into foaming valleys, then wallowed before climbing again. All the while, she fought her way farther and farther into the heart of the Pacific. And I was still aboard her. Above me, the wind reached my ears as a muffled roar. Now and then, I heard feet stamp across the deck overhead. Around me, the creaking never stopped. Every piece of wood and every fitting seemed to groan, squeal, and complain in a different voice.
        - id: ch01-b39
          speaker: narrator
          text: >-
            The hunters went on roaring their arguments like some breed of creature that was only half human and half born of the sea. Their curses and filthy words filled the steerage. In the sick yellow light of the sea lamps, which swung back and forth with the ship, their flushed, angry faces looked even more brutal. Beyond them, the bunks showed dimly through the smoke like animal dens in a traveling menagerie. Oilskins and sea boots hung along the walls. Here and there, rifles and shotguns rested firmly in their racks. The whole place seemed fitted for the pirates of an earlier age.
        - id: ch01-b40
          speaker: narrator
          text: >-
            My imagination ran wild, and still sleep would not come.
        - id: ch01-b41
          speaker: narrator
          text: >-
            It was a long night, a weary and dreary night that seemed it would never end.
