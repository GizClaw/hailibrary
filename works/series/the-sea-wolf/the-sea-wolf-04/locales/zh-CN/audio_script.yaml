audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    mugridge:
      display_name: 托马斯·马格里奇
      tts:
        delivery: 油滑谄媚，粗俗话里带着讨好
        timbre: 尖细黏腻的成年男声
        pace: 轻快而连珠炮般
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    henderson:
      display_name: 亨德森
      tts:
        delivery: 粗率随意，对伤痛习以为常
        timbre: 松散低哑的成年男声
        pace: 不紧不慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第四章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我竭力适应“幽灵号”上的新日子，接下来经历的却只有屈辱和痛苦。船员叫厨子“医生”，猎手叫他“汤米”，拉森只管他叫“厨子”。我的身份一落千丈，他对我的态度也立刻跟着变了。先前那个低头哈腰、百般讨好的马格里奇不见了，眼前只剩一个盛气凌人、处处挑衅的恶霸。因为在他眼里，我不再是皮肤像贵妇一样柔嫩的体面绅士，只是个普普通通、毫无用处的舱童。
        - id: ch01-b02
          speaker: narrator
          text: >-
            他硬要我尊称他“马格里奇先生”，教起活来更是摆出一副叫人受不了的神气。四间小住舱和外面的船舱归我收拾，厨房里我还得给他帮忙。削土豆、刷油锅，我样样不会。他每发现一次，就像见了天大的奇闻，没完没了地挖苦。他根本不肯想想我从前过的是什么生活，也不管我习惯做什么。这正是他有意摆给我的态度。不到一天，我恨他已经胜过了平生所恨的任何人。
        - id: ch01-b03
          speaker: narrator
          text: >-
            那天尤其难熬。“幽灵号”缩紧了帆，迎着马格里奇所说的“鬼哭狼嚎的东南大风”猛冲。那时我还不懂缩帆这些航海说法。五点半，我照吩咐摆好船舱里的餐桌，安上风浪天固定餐具的架子，再去厨房端茶和热饭。也就是那一次，我头一回遇上大浪越过船舷，整个扑上甲板。
        - id: ch01-b04
          speaker: mugridge
          text: >-
            动作快点，不然你准得浇成落汤鸡。
        - id: ch01-b05
          speaker: narrator
          text: >-
            我一手提着大茶壶，另一条胳膊弯里夹着几条新烤的面包，走出了厨房。高瘦的猎手亨德森四肢松松垮垮，正从统舱往船尾的住舱走。那片船中部的睡铺，被猎手们半开玩笑地称作统舱。艉楼上，拉森正站在那里，照旧抽着永不离嘴的雪茄。
        - id: ch01-b06
          speaker: mugridge
          text: >-
            浪来啦！快躲开！
        - id: ch01-b07
          speaker: narrator
          text: >-
            我根本不知道来的是什么，竟停住了。厨房门猛地滑上，砰的一声关紧。亨德森却像疯了一样扑向主桅索具，从内侧飞快往上爬，一口气升到比我头顶高出许多的地方。紧接着，一道卷曲的巨浪翻着白沫，高高悬过船舷，而我正站在它下面。眼前的一切太新、太陌生，我的脑子完全转不过来。我只知道危险来了，却不知道该怎么办，只能胆战心惊地僵在原地。
        - id: ch01-b08
          speaker: wolf_larsen
          text: >-
            抓住点东西，你这个……驼背！
        - id: ch01-b09
          speaker: narrator
          text: >-
            已经迟了。我刚扑向本来可以抓住的索具，一堵塌下来的水墙便迎面砸中我。我被压在水底，透不过气，仿佛真的要溺死。双脚早已离开甲板，身子一圈圈翻滚，也不知道会被冲到哪里。我接连撞上好几样硬东西，其中一下狠狠撞在右膝。忽然，漫过甲板的水退了，我终于又呼吸到空气。原来海浪把我从迎风一侧卷过厨房，绕过统舱的升降口，一直扔进下风一侧的排水沟。
        - id: ch01-b10
          speaker: narrator
          text: >-
            膝盖疼得钻心，我不敢把身体的重量压上去，认定那条腿已经断了。可厨子隔着下风一侧的门，还在催我。
        - id: ch01-b11
          speaker: mugridge
          text: >-
            喂！别磨蹭一整夜！茶壶呢？掉海里啦？你就是摔断脖子，也是活该！
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: >-
            我勉强爬起来，才发现大茶壶居然还在手里。我一瘸一拐地送回厨房，他却气得不行，也不知是真火还是装的。
        - id: ch01-b13
          speaker: mugridge
          text: >-
            老天爷，你可真是个废物！你到底会干什么？连这么点茶都送不到船尾，还全给洒了。害得我又得烧一壶。
          emotion: angry
        - id: ch01-b14
          speaker: mugridge
          text: >-
            你抽什么鼻子？不就是可怜的小腿受伤了吗？妈妈的小宝贝儿，可真叫人心疼！
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: >-
            我根本没有抽鼻子，只是疼痛扯得整张脸都在抽动。我把所有意志都提起来，咬紧牙，一趟趟往返于厨房和住舱，好歹没再出事。那次海浪给我留下两样东西。一是受伤的膝盖骨，从头到尾无人包扎，害我足足痛了好几个月。二是拉森从艉楼上喊出的“驼背”。从那以后，无论船头还是船尾，全船都这样叫我。这个名字慢慢钻进了我的念头，连我自己都觉得，我就是驼背，仿佛从来都是。
        - id: ch01-b16
          speaker: narrator
          text: >-
            伺候晚餐同样艰难。拉森、约翰森和六名猎手挤在本就狭小的船舱里。船身一会儿猛地俯冲，一会儿左右翻滚，我却必须绕着餐桌来回走动。更叫我难受的是，所有人都对我的伤无动于衷。我隔着衣服也能感觉到膝盖越肿越大，疼得恶心发晕。每次从镜子里瞥见自己，都是一张惨白如鬼、因疼痛而扭曲的脸。他们不可能看不见，却没有一个人开口。直到后来我洗餐具时，拉森才说了几句话，那一刻我几乎还要感谢他。
        - id: ch01-b17
          speaker: wolf_larsen
          text: >-
            别让这点小事难住你。以后你会习惯的。它也许会让你有点残废，可你到底也在学着走路。
        - id: ch01-b18
          speaker: wolf_larsen
          text: >-
            这就叫悖论，对吧？
        - id: ch01-b19
          speaker: humphrey
          text: >-
            是，先生。
        - id: ch01-b20
          speaker: narrator
          text: >-
            我照老样子点头回答，他看起来颇为满意。
        - id: ch01-b21
          speaker: wolf_larsen
          text: >-
            你多少懂点文学，是不是？很好。哪天我会找你聊聊。
        - id: ch01-b22
          speaker: narrator
          text: >-
            说完，他便把我抛到脑后，转身上了甲板。
        - id: ch01-b23
          speaker: narrator
          text: >-
            夜里，我终于做完那堆像是永远也做不完的活，被打发到统舱，在一个空铺位上睡觉。能离开可恶的厨子，又能让双脚歇下来，我别提多庆幸了。让我意外的是，衣服不知何时已在身上干透。无论刚才被浪浇透，还是“马丁内斯号”沉没时在水里泡了那么久，我竟都没有着凉的迹象。换作平常，受过这些折腾，我早该躺在床上，还得由训练有素的护士照料了。
        - id: ch01-b24
          speaker: narrator
          text: >-
            膝盖却痛得越来越厉害。据我所能看清的情形，肿胀之中，那块膝盖骨像是翻了起来，侧棱朝上。我坐在铺位里查看伤处，六名猎手就在统舱里抽烟，扯开嗓门说话。亨德森经过时，顺便瞟了一眼。
        - id: ch01-b25
          speaker: henderson
          text: >-
            看着挺糟。找块布缠上，就没事了。
        - id: ch01-b26
          speaker: narrator
          text: >-
            他只说了这么一句。若在陆地上，我会仰面躺好，让外科医生照料，还会接到严令，除了休息什么也不许做。但话说回来，也该公平看待这些人。他们不只对我的痛苦麻木，灾祸落到自己头上时，也同样不把自己的伤痛当回事。我想，一半是因为早已习惯，一半是因为他们天生没有那么敏感。我真相信，换成一个感受敏锐、神经纤细的人，同样的伤会让他多受两三倍的罪。
        - id: ch01-b27
          speaker: narrator
          text: >-
            我已经筋疲力尽，却被膝盖疼得无法入睡，只能拼尽力气，不让呻吟冲出口。在家里，我一定早把痛苦痛痛快快地喊出来了。可到了这个原始的新环境，人仿佛也得用野蛮的办法把痛苦死死压回去。这些人的态度也像野蛮人。面对大事，他们冷硬得吓人，碰上小事却幼稚得像孩子。后来，猎手克富特有根手指被砸成了肉泥。他没有哼一声，连脸色都没变。可同一个人，我也一次次见他为了鸡毛蒜皮的小事暴跳如雷。
        - id: ch01-b28
          speaker: narrator
          text: >-
            眼下他就在扯着嗓子咆哮，挥舞双臂，像恶魔一样破口大骂。争论的不过是海豹幼崽天生会不会游泳。克富特说会，幼崽刚出生就能下水。另一个猎手拉蒂默身材瘦削，活像个精明的美国佬，一双眼睛眯成细缝。他却认定幼崽不会游，还说它们正因为这个缘故才生在陆地上。母海豹必须教它们下水，就像鸟儿必须教雏鸟飞翔。
        - id: ch01-b29
          speaker: narrator
          text: >-
            其余四人不是靠着桌子，就是躺在铺位里，把争论留给两个对头，自己却听得兴致勃勃。隔一会儿，他们便激动地跳出来帮一方说话。有时六个人一齐开口，狭窄的统舱里声浪来回翻涌，像一阵阵缩小的雷声。话题已经够幼稚，也没什么要紧，他们讲起道理来却更幼稚、更不着边际。其实根本没有推理，只有断言、想当然和破口大骂。
        - id: ch01-b30
          speaker: narrator
          text: >-
            要证明幼崽出生时会游，或不会游，他们先气势汹汹地宣布自己的主张，再攻击对方的判断力、常识、国籍，甚至翻出对方从前的事情。另一边反驳时，用的还是同一套办法。我说起这一幕，是想让人知道，命运把我丢进了怎样一群人中间，也想说明他们的心智能力究竟如何。他们的身体是男人，头脑却还是孩子。
        - id: ch01-b31
          speaker: narrator
          text: >-
            他们还一刻不停地抽烟，烟草粗劣、廉价，气味难闻。浓烟越积越厚，把空气熏得昏暗污浊，船又在风暴中不断挣扎，猛烈摇晃。若我有晕船的毛病，这时一定已经吐得不省人事。即便没有，我还是阵阵反胃。不过那股恶心也可能来自腿上的疼痛，还有一身的疲惫。
        - id: ch01-b32
          speaker: narrator
          text: >-
            我躺在那里，想的自然是自己，是眼下这个做梦也想不到的处境。我，汉弗莱·范·韦登，一个学者，如果你愿意，也可以说是一个对文学艺术略有鉴赏力的人，竟然躺在白令海的捕海豹双桅船上，当起了舱童。舱童！我这辈子从没做过粗重的体力活，更没干过厨房杂役。我一直靠稳定优厚的收入，过着平静、安逸、没有波澜的生活，像个学者，也像个隐士。
        - id: ch01-b33
          speaker: narrator
          text: >-
            激烈的生活方式和竞技运动从没吸引过我。从小，父亲和姐姐妹妹就叫我书虫，我也一直乐于埋头书本。我一生只露营过一次，队伍才出发不久，我便独自离开，回到了有屋顶遮蔽、处处舒适便利的地方。可如今，摆餐桌、削土豆、洗盘子的日子已经铺在前面，一眼望不到头。
        - id: ch01-b34
          speaker: narrator
          text: >-
            我也并不强壮。医生总说我的体质好得出奇，可我从未用运动锻炼它，也从没认真练过身体。他们一次次劝我追逐健身的风尚，还总说我的肌肉又小又软，简直像女人一样。我向来宁愿使用头脑，从不愿使用身体。眼前等着我的却是粗野艰苦的生活，而我无论体力还是肌肉，都没有为它做好准备。
        - id: ch01-b35
          speaker: narrator
          text: >-
            当时还有许多这样的念头从脑海里掠过。我把它们说出来，是想预先替自己解释，为什么后来只能扮演一个软弱无助的角色。我也想起了母亲和姐姐妹妹，想象她们会有多么悲伤。在“马丁内斯号”的灾难中，我已经被列入失踪的死者，成了那个一直找不到尸体的人。
        - id: ch01-b36
          speaker: narrator
          text: >-
            我仿佛看见报纸上登出醒目的大标题，也看见大学俱乐部和“珍本社”的朋友们一边摇头，一边叹息说：“可怜的人！”我还看见查理·弗鲁塞斯。那天早上告别时，他穿着睡袍，懒洋洋地躺在堆满软枕的窗边卧榻上，正一本正经地说着那些神谕般悲观的警句。
        - id: ch01-b37
          speaker: narrator
          text: >-
            而在我想着这些的时候，“幽灵号”始终在翻滚、俯冲。它爬上一座座移动的水山，又摔进翻着泡沫的山谷，在里面颠簸挣扎。它一路同风浪搏斗，越闯越深，直入太平洋的腹地。更无法改变的是，我也被它带在船上。
        - id: ch01-b38
          speaker: narrator
          text: >-
            头顶的风声传下来，成了沉闷的怒吼。甲板上不时响起重重踏过的脚步。四周无穷无尽地吱嘎作响，木板和各种装置用千百种调子呻吟、尖叫、抱怨。猎手们还在争吵，吼声活像某种半人半水兽的族类发出来的。诅咒和污言秽语塞满了空气。
        - id: ch01-b39
          speaker: narrator
          text: >-
            航海灯随着船身来回摇摆，病恹恹的黄光照着那些涨红而愤怒的脸，把上面的残暴照得更加扭曲、更加醒目。透过昏暗的烟霾，一张张铺位就像兽栏里供野兽睡觉的洞穴。油布衣和航海靴挂在舱壁上，几支步枪和猎枪稳稳躺在架子里。这样的海上巢穴，正配得上旧日的海盗和劫掠者。
        - id: ch01-b40
          speaker: narrator
          text: >-
            四周的一切让我的想象越跑越远，睡意却无论如何也不肯到来。我只能躺在海盗巢穴般的统舱里，听着风声、争吵声和船身的呻吟。那一夜长得没有尽头，既疲惫，又凄凉，漫长得仿佛永远不会过去。
