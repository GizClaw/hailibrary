  chapters:
    - id: ch01
      title: CHAPTER XVII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Strange as it may seem, all our gloomy fears came to nothing for a while. The Ghost sailed north and west until we reached the coast of Japan and found the great herd of seals. No one knew where in the limitless Pacific they had come from. They were making their yearly journey north to the breeding grounds in the Bering Sea, and we traveled north with them. As they went, we killed and destroyed. The bare bodies went overboard to the sharks. The skins were salted and stored so they could one day cover the shoulders of women in distant cities.
        - id: ch01-b02
          speaker: narrator
          text: >-
            It was useless slaughter, done entirely for those skins. No one ate the meat or used the oil. After a successful day, bodies and hides covered the deck. Fat and blood made the boards slippery, red water poured through the drains, and the same red stains marked the masts, ropes, and rails. The men worked like butchers. Their arms and hands were bare and bloody as their knives stripped the skins from the beautiful sea creatures they had killed.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I had to count each skin as the boats brought it aboard. I supervised the skinning, then saw that the decks were washed and the ship put in order again. The work sickened both my mind and my stomach. Yet directing so many men was good for me in one way. It developed what little ability I had to take charge. I could feel myself growing harder, and that could only be healthy for the man Wolf Larsen called “Sissy” Van Weyden.
        - id: ch01-b04
          speaker: narrator
          text: >-
            I knew I could never again be quite the man I had been. Wolf Larsen had not destroyed my hope or my faith in human life, even after all his attacks on them. But he had changed me in smaller ways. He had forced me into the real world, a place I had barely known and had always avoided. Before the Ghost, I had lived almost entirely among thoughts and ideas. Now I looked more closely at life as people actually lived it. I had learned that facts existed in the world whether I welcomed them or not. I was beginning to leave the shelter of the mind and give real weight to the solid, visible parts of existence.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Once we reached the hunting grounds, I spent more time with Wolf Larsen than ever. In fair weather, while we sailed among the herd, nearly everyone went out in the boats. Only Wolf Larsen, Thomas Mugridge, and I remained aboard, and Mugridge scarcely counted. There was no leisure in it. The six boats spread from the schooner like a fan, with ten or even twenty miles between the two outermost boats. They hunted straight across the sea until darkness or bad weather sent them back. Our job was to keep the Ghost well downwind of the last boat, so every crew could run before the wind to reach us if a squall threatened.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Two men had plenty to do when a hard wind rose. We had to steer the Ghost, keep watch for all the scattered boats, and set or take in sail, so I had to learn quickly. Steering came easily. Climbing above the cross-trees was harder. I had to leave the rope ladder, trust my arms with my whole weight, and pull myself higher while the mast moved beneath me. Still, I mastered that too, and I mastered it fast. I had a fierce need to prove myself in Wolf Larsen's eyes, to show that I had a right to live by doing more than thinking. Before long, I even loved the rush up to the masthead. High above the deck, I could grip the mast with my legs and sweep the distant sea with the glasses, searching for the boats.
        - id: ch01-b07
          speaker: narrator
          text: >-
            One beautiful morning, the boats left early. The hunters' shots faded as they scattered across the water, then vanished altogether. A faint west wind carried us downwind of the last boat before it died. From the masthead, I watched all six boats disappear one by one beyond the curve of the earth as they followed the seals west. The Ghost lay almost still on the smooth sea and could not follow. Wolf Larsen was uneasy. The barometer had fallen, and he kept watching the eastern sky.
        - id: ch01-b08
          speaker: wolf_larsen
          text: >-
            If it comes hard and fast from that quarter and drives us upwind of the boats, there may be empty bunks in both the steerage and the forecastle tonight.
        - id: ch01-b09
          speaker: narrator
          text: >-
            By eleven, the sea looked like glass. At noon, though we were far north, the heat made us ill. The air had no freshness in it. It was heavy and stifling, like the weather old Californians call earthquake weather. Nothing we could point to had happened yet, but everything seemed to warn that the worst was coming. Clouds slowly filled the whole eastern sky. They rose over us like a black mountain range from hell. Canyons, cliffs, deep gorges, and the shadows inside them all seemed terribly clear. The shapes looked so solid that I almost expected a white line of surf at their feet, and dark caves roaring as the sea drove into them. Still the Ghost rocked gently on the glassy water. Not a breath of wind came.
        - id: ch01-b10
          speaker: wolf_larsen
          text: >-
            This isn't a squall. Old Mother Nature is about to stand on her hind legs and howl with everything she's got. We'll be lucky to come through with half our boats. Go aloft and loosen the topsails.
        - id: ch01-b11
          speaker: narrator
          text: >-
            But if it's going to howl, how can the two of us manage all that sail?
        - id: ch01-b12
          speaker: wolf_larsen
          text: >-
            We use the first of the wind to run down to the boats before it tears the canvas away. After that, I don't care what happens. The masts will stand it, and so will you and I, though we'll have our hands full.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The calm held. We ate dinner, though mine was a hurried, anxious meal. Eighteen men were out on the sea, hidden beyond the curve of the earth, while that mountain wall of cloud rolled slowly toward us. Wolf Larsen seemed untouched by it. Yet when we returned to the deck, I saw a slight twitch in his nostrils and a new quickness in every movement. His face had turned hard and stern, but his clear blue eyes shone with a strange, sparkling light. The coming fight made him happy in a savage way. He was glad that a struggle was near. He knew that one of life's great moments had arrived, a moment when life itself seemed to rise like a flood, and the knowledge lifted him.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Once, without realizing I could see him, he laughed aloud at the storm. The laugh was mocking and defiant. I can still picture him there, a tiny man facing the enormous shape of some evil genie from the Arabian Nights. He was challenging fate, and he felt no fear.
        - id: ch01-b15
          speaker: wolf_larsen
          text: >-
            Cooky, finish those pots and pans. Then you'll be needed on deck, so be ready when I call.
        - id: ch01-b16
          speaker: narrator
          text: >-
            He noticed me staring at him.
        - id: ch01-b17
          speaker: wolf_larsen
          text: >-
            Hump, this is better than whisky. This is what your Omar never understood. I think he only half lived.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The western sky had turned dark too, and the sun had dimmed until it vanished. Though it was only two in the afternoon, a ghostly twilight settled over us. Wandering purple lights moved through it. In that strange color, Wolf Larsen's face seemed to glow and glow, until my excited mind placed a halo around him. We rested in an unnatural silence, yet everything around us promised that sound and violent motion were coming. The heat became unbearable. Sweat stood across my forehead, then ran slowly down my nose. I felt as though I might faint, and I reached for the rail to hold myself upright.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Then the lightest whisper of air brushed my face. It came from the east and was gone at once. The hanging sails did not move, but I had felt its cool touch.
        - id: ch01-b20
          speaker: wolf_larsen
          text: >-
            Cooky, cast off the foreboom tackle and carry it across. When the ship is ready, release the sheet and haul the tackle tight. Make a mess of it, and it'll be the last mess you ever make. Do you understand?
        - id: ch01-b21
          speaker: narrator
          text: >-
            Mugridge turned toward him with a frightened, miserable face.
        - id: ch01-b22
          speaker: wolf_larsen
          text: >-
            Mr. Van Weyden, be ready to carry the headsails over. Then get to the topsails and spread them as fast as God allows. The quicker you move, the easier it'll be. If Cooky is too slow, hit him between the eyes.
        - id: ch01-b23
          speaker: narrator
          text: >-
            I took the absence of a threat as a compliment, and it pleased me. The Ghost pointed northwest. Wolf Larsen meant to swing every sail across with the first breath of wind.
        - id: ch01-b24
          speaker: wolf_larsen
          text: >-
            That will put the wind behind our quarter. The last shots told us the boats were moving a little south.
        - id: ch01-b25
          speaker: narrator
          text: >-
            He went aft to the wheel, and I took my place by the jibs. Two more whispers of wind passed us. The loose canvas flapped without strength.
        - id: ch01-b26
          speaker: mugridge
          emotion: fearful
          text: >-
            Thank God it isn't hitting us all at once, Mr. Van Weyden.
        - id: ch01-b27
          speaker: narrator
          text: >-
            I was thankful too. By then I knew what a sudden blast would do to us with every sail spread. The whispers became puffs. The canvas filled, and the Ghost began to move. Wolf Larsen threw the wheel hard to port, turning our bow away. The wind came straight over the stern. It muttered, then struck harder and harder, while the headsails pounded in my hands. I could not see what happened elsewhere on deck. I felt the schooner surge and lean as the changing pressure swung the foresail and mainsail across. My own hands were full with the flying jib, jib, and staysail. By the time I had carried them over and made them draw, the Ghost was bounding southwest. The wind drove against her quarter, and every sheet led out to starboard.
        - id: ch01-b28
          speaker: narrator
          text: >-
            I ran for the topsails without stopping, though my heart beat like a hammer. We spread them before the wind grew too strong, then coiled the ropes. When I returned aft, Wolf Larsen nodded and handed me the wheel. The wind strengthened and the sea rose. I steered for an hour, and every minute became harder. I did not yet have the skill to hold her on that slanting course at such speed.
        - id: ch01-b29
          speaker: wolf_larsen
          text: >-
            Take the glasses aloft and find some of the boats. We've covered at least ten miles. Now she's making twelve or thirteen knots. The old girl knows how to move.
        - id: ch01-b30
          speaker: narrator
          text: >-
            I stopped at the fore cross-trees, about seventy feet above the deck. The water ahead was empty. Looking at the heavy seas we were charging through, I understood how little time we had. I doubted any boat could still be afloat. It seemed impossible that such frail craft could survive that wind and water.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Because we ran with the gale, I could not feel its whole force. From high above, though, I seemed to look at the Ghost from outside her and apart from her. Her dark shape stood sharp against the foaming sea as she raced like a living thing. Sometimes she lifted and drove across a great wave. Her starboard rail vanished, and boiling water covered the deck all the way to the hatches. Then she rolled back to windward, and I flew through the air with sickening speed. I clung to the mast like the weight on the end of a huge upside-down pendulum. Between the greatest rolls, I must have swept through an arc of seventy feet or more. Once the terror of that dizzy flight overcame me. For a while I held on with both hands and feet, weak and shaking. I could no longer search for the missing boats. I could not even look away from the sea that roared below and seemed determined to swallow the Ghost.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Then I thought of the men out in that sea. The thought steadied me, and I forgot my own fear as I searched for them. For an hour I saw nothing but bare, lonely water. At last, a stray beam of sunlight struck the waves and turned them into angry silver. In that glare, a tiny black speck rose for an instant and vanished. I waited. It appeared again, a little to port of our bow. Shouting was useless, so I waved my arm to Wolf Larsen. He altered course, and when the speck showed directly ahead, I signaled that he had it.
        - id: ch01-b33
          speaker: narrator
          text: >-
            The speck grew with astonishing speed, and only then did I fully understand how fast we were flying. Wolf Larsen waved for me to come down. I descended from the cross-trees, fought my way to him, and stood beside him at the wheel. There he gave me my part in the dangerous work of turning the Ghost across the gale and holding her near the boat.
        - id: ch01-b34
          speaker: wolf_larsen
          text: >-
            Expect all hell to break loose, but pay no attention to it. Do your own job, and have Cooky ready at the foresheet.
        - id: ch01-b35
          speaker: narrator
          text: >-
            I struggled forward. Both rails seemed to vanish under water just as often, so there was no safe side. I told Mugridge what to do, then climbed a few feet into the fore-rigging. The boat was close enough to see clearly. It faced the wind and sea, dragging its mast and sail overboard as an anchor. Three men bailed desperately. Each mountain of water hid them, and I waited in dread, certain they might never rise again. Then the boat would burst through a foaming crest with its bow pointed at the sky and its whole dark bottom exposed. For one instant I saw the men hurling water out. Then the boat tipped forward into the valley, its stern standing almost above its bow. Every time it returned to view seemed like a miracle.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Suddenly the Ghost turned away. I thought Wolf Larsen had abandoned the rescue, and the shock went through me. Then I understood that he was preparing to stop the schooner. I dropped to the deck. We ran straight before the gale, with the boat far off beside us. For a moment every strain on the Ghost eased as she shot faster, then she swung on her heel toward the wind.
        - id: ch01-b37
          speaker: narrator
          text: >-
            When she came broadside to the sea, the gale struck us with all the force we had been fleeing. I faced it without knowing better. The wind stood against me like a wall and filled my lungs so completely that I could not breathe out. While I choked, the Ghost rolled far toward the wind. A great sea climbed above my head. I turned away, caught one breath, and looked again. The wave towered over the schooner. Sunlight pierced its curling edge, and I saw rushing green water beneath a white smother of foam.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Then it fell. Everything happened at once. A crushing blow struck me everywhere and nowhere. My grip broke, and I went under. I knew I was being swept through the open waist of the ship, the terrible thing sailors called being caught in the trough. The water battered me along and rolled me over and over. When I could hold my breath no longer, salt water burned into my lungs. Through it all, one thought remained. I had to pull the jib across and hold it against the wind. I felt no fear of death and somehow believed I would survive. In my dazed mind, I saw Wolf Larsen at the wheel amid the chaos, setting his will against the storm.
        - id: ch01-b39
          speaker: narrator
          text: >-
            I struck what I thought was the rail and found air again. When I tried to rise, I hit my head and fell back to my hands and knees. The water had swept me under the raised forecastle and into the very bow. I crawled out over Thomas Mugridge, who lay groaning in a heap. There was no time to examine him. I still had to get that jib across.
        - id: ch01-b40
          speaker: narrator
          text: >-
            On deck, it seemed the world was ending. Wood, steel, and canvas tore and crashed on every side as the Ghost was wrenched apart. With no one to haul in the foresheet, the foresail and fore-topsail had emptied and were pounding themselves into ribbons. The heavy boom smashed from rail to rail. Broken wood flew through the air, loose ropes and stays hissed and twisted like snakes, and the foresail gaff crashed down through it all.
        - id: ch01-b41
          speaker: narrator
          text: >-
            The spar missed me by inches, and that drove me into action. Perhaps we were not lost. Wolf Larsen had warned me that all hell would break loose, and here it was. I found him at the mainsheet, hauling it flat with his enormous strength. The stern rose high, and his body stood black against white water sweeping past. I saw and understood that whole world of wreckage in perhaps fifteen seconds.
        - id: ch01-b42
          speaker: narrator
          text: >-
            I did not look for the small boat. I leaped to the jib sheet. The sail began to slap, filling and collapsing with gunshot cracks. I took a turn with the rope and pulled with all my strength each time the canvas went slack. Slowly, I forced the jib against the wind. I know only that I gave it everything I had. The ends of my fingers split open as I hauled, while the flying jib and staysail tore themselves to pieces and thundered away.
        - id: ch01-b43
          speaker: narrator
          text: >-
            I kept pulling. Each time I gained a little rope, I held it with a double turn until the next slap gave me more. At last the sheet moved more freely. Wolf Larsen appeared beside me and hauled alone while I gathered the slack.
        - id: ch01-b44
          speaker: wolf_larsen
          text: >-
            Tie it off! Then follow me!
        - id: ch01-b45
          speaker: narrator
          text: >-
            Even amid the ruin, I could see a rough kind of order. The Ghost had stopped across the wind, and she still answered us. Most of her sails were gone, but the jib held backward against the gale while the mainsail lay hauled flat. Together they kept her bow facing the furious sea.
        - id: ch01-b46
          speaker: narrator
          text: >-
            As Wolf Larsen freed the lifting tackles, I searched for the boat. It rose on a wave less than twenty feet away. He had judged our movement so perfectly that the Ghost drifted straight toward it. All we had to do was hook a tackle to each end and lift it aboard. But doing that was far harder than saying it.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Kerfoot was in the bow, Kelly sat amidships, and Oofty-Oofty was in the stern. As we drew close, their boat climbed a wave while the Ghost sank into a trough. The three men leaned over their side and looked down. For a moment, their heads hung almost directly above me. Then the next movement reversed everything. The Ghost lifted and seemed to soar upward, while the boat and its crew sank far beneath us. With the two vessels rising and falling so close together, it seemed impossible that the next surge would not crush the schooner down on that tiny shell.
        - id: ch01-b48
          speaker: narrator
          text: >-
            At the right instant, I passed my tackle to Oofty-Oofty while Wolf Larsen gave the forward one to Kerfoot. They hooked both in a flash. The three men watched the roll and jumped aboard together. When the Ghost rolled her side clear of the water, the tackles lifted the boat snug against her. Before the return roll could carry it away or smash it loose, we dragged it over the rail and turned it upside down on deck. Blood spurted from Kerfoot's left hand. Somehow his third finger had been crushed to pulp during the rescue, but he gave no sign that he felt the pain. Using only his right hand, he helped us secure the boat in its place.
        - id: ch01-b49
          speaker: wolf_larsen
          text: >-
            Oofty, be ready to let that jib across! Kelly, get aft and ease the mainsheet! Kerfoot, go forward and find out what's happened to Cooky! Mr. Van Weyden, climb aloft again, and cut away every loose piece you pass!
        - id: ch01-b50
          speaker: narrator
          text: >-
            The instant he finished giving orders, Wolf Larsen bounded aft to the wheel with his tiger-like leaps. As I climbed the forward ropes, the Ghost slowly turned away. This time no sails remained to tear when she entered the trough and the sea swept over her. Halfway to the cross-trees, the gale pinned me so tightly to the rigging that I could not have fallen. The schooner lay nearly on her side, with the masts almost level above the water. When I looked toward the deck, there was no deck to see. Wild water buried it. Only the two masts rose above the sea. Then the Ghost turned farther from the pressure, righted herself, and pushed her deck through the surface like the back of a whale.
        - id: ch01-b51
          speaker: narrator
          text: >-
            We raced over the savage sea while I hung in the cross-trees like a fly and searched for the other boats. Half an hour later, I found the second. It had filled with water and turned upside down. Jock Horner, Louis, and Johnson clung desperately to its bottom. I stayed aloft this time, and Wolf Larsen brought the Ghost across the wind without letting the sea sweep her. As before, we stopped and drifted down on the helpless boat. The men caught the lines and tackles we threw them, then scrambled aboard like monkeys. We tried to lift their boat after them. It was crushed and splintered against the schooner's side as it came in, but we still tied the wreck securely to the deck. The broken hull could be patched and made whole again.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Once more the Ghost turned before the storm. This time she sank so deeply under the water that for several seconds I thought she would never rise. Even the wheel, set well above the middle deck, disappeared and was swept again and again. At those moments I felt strangely alone with God, watching the chaos of his anger. Then the wheel would rise out of the foam, followed by Wolf Larsen's broad shoulders. His hands still gripped the spokes, forcing the schooner to follow the course he had chosen. He seemed like an earth-god ruling the storm, throwing its falling waters from his body and riding its power toward his own purpose. What a wonder it was that tiny men could live, breathe, and work there. We were driving a fragile machine of wood and cloth through a battle of wind and sea that seemed large enough to destroy the world.
        - id: ch01-b53
          speaker: narrator
          text: >-
            The Ghost climbed out of the trough again and flew before the gale. It was half past five. Half an hour later, as the last daylight faded into a dim, violent twilight, I spotted a third boat. It floated upside down, with no crew in sight. Wolf Larsen held away, turned upwind, and let us drift toward it. This time he missed. The boat passed forty feet behind our stern.
        - id: ch01-b54
          speaker: oofty_oofty
          text: >-
            Number four boat!
        - id: ch01-b55
          speaker: narrator
          text: >-
            His sharp eyes had caught its number during the single second it rose clear of the foam. It was Henderson's boat. Holyoak and Williams, another deep-water sailor, had been with him. There could be no doubt that all three men were lost. The sea had taken them, but their boat remained. Wolf Larsen decided to make one more reckless attempt to recover it. By then I had come down from the masthead to the deck. Horner and Kerfoot both protested and tried to stop him from risking more lives for an empty hull, but he would not listen.
        - id: ch01-b56
          speaker: wolf_larsen
          emotion: angry
          text: >-
            By God, no storm out of hell is going to steal my boat!
        - id: ch01-b57
          speaker: narrator
          text: >-
            Though four of us pressed our heads together to hear him, his shout sounded faint and impossibly far away.
        - id: ch01-b58
          speaker: wolf_larsen
          emotion: angry
          text: >-
            Mr. Van Weyden, take Johnson and Oofty to the jib! Everyone else, get aft to the mainsheet! Move, or I'll sail the lot of you straight into Kingdom Come! Do you understand?
        - id: ch01-b59
          speaker: narrator
          text: >-
            He threw the wheel hard over, and the Ghost's bow swung away. The hunters had no choice but to obey and make the best of the dangerous chance. I understood how great the risk was when the pounding seas buried me once more. I clung for my life to the pin rail at the foot of the foremast. The water tore my fingers loose, swept me across to the side, and carried me over it into the ocean. I could not swim, but before I could sink, another surge threw me back aboard. A strong hand closed around me and held on. When the Ghost finally rose from the water, I saw that Johnson had saved my life. He was looking anxiously around the deck. Kelly had come forward at the last moment, and now he was missing.
        - id: ch01-b60
          speaker: narrator
          text: >-
            We had missed the boat and no longer lay in the right position for the earlier maneuver. Wolf Larsen had to try something else. He ran before the wind with everything set to starboard, turned the Ghost, and brought her back with the sails pulled tight on the port side.
        - id: ch01-b61
          speaker: johnson
          text: >-
            Grand!
        - id: ch01-b62
          speaker: narrator
          text: >-
            Johnson shouted it into my ear after we survived the flood of water that came with the turn. He meant the Ghost herself, not Wolf Larsen's skill.
        - id: ch01-b63
          speaker: narrator
          text: >-
            It was now so dark that the overturned boat had disappeared completely. Yet Wolf Larsen drove the Ghost back through the frightful turmoil as though an unfailing instinct showed him the way. The sea half buried us again and again, but this time we did not lie in an open trough where the water could sweep us across the deck. Wolf Larsen judged the unseen distance. The Ghost drifted squarely down upon the boat, and we found it in the darkness. The hull was badly smashed as we dragged it aboard, but we recovered it.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Two terrible hours of work followed. Every able hand joined in, two hunters, three sailors, Wolf Larsen, and me. We shortened one sail and then the other, first tying down part of the jib and then part of the mainsail so the gale had less canvas to seize. At last the Ghost lay across the wind under those two small patches of sail. Her decks stayed fairly clear of water, while she bobbed, ducked, and plunged among the breaking waves like a cork.
        - id: ch01-b65
          speaker: narrator
          text: >-
            My fingertips had split open during the first rescue, and every pull on a wet rope tore at them again. Through all two hours of reefing the sails, tears of pain ran down my face. I kept working until the last task was done. Then my strength left me all at once. I dropped onto the deck and rolled there in agony and complete exhaustion.
        - id: ch01-b66
          speaker: narrator
          text: >-
            Meanwhile, the others dragged Thomas Mugridge from beneath the forecastle, where he had hidden like a drowned rat. I watched them pull him aft toward the cabin, then stared in shock at the empty place where the galley had stood. The sea had carried the whole structure away.
        - id: ch01-b67
          speaker: narrator
          text: >-
            Everyone gathered in the cabin, sailors included. While coffee heated on the little stove, we drank whisky and crunched hard biscuits. Never in my life had food been so welcome, and hot coffee had never tasted so good. The Ghost pitched, tossed, and rolled so violently that even the sailors could not move through the cabin without holding on. Several times someone cried that she was taking another sea. A moment later, every one of us went tumbling against the wall of the cabins on the port side, piled there as though that wall had suddenly become the deck beneath our feet.
        - id: ch01-b68
          speaker: wolf_larsen
          text: >-
            To hell with a lookout. No one can do anything on deck. If a ship is going to run us down, we couldn't get out of its way anyway. All hands turn in and get some sleep.
        - id: ch01-b69
          speaker: narrator
          text: >-
            The sailors went forward and set the side lights on their way. The two hunters stayed to sleep in the cabin because we decided it was too dangerous to open the sliding hatch above the passage to the steerage. Wolf Larsen and I turned to Kerfoot. Together we cut away his crushed finger and sewed the stump closed. Through all this, Mugridge had been forced to cook and serve the coffee and keep the little fire alive. He complained constantly of pain inside his chest. Now he swore one or two ribs were broken. We examined him and found that the sea had broken three. His treatment had to wait until morning. The chief reason was simple. I knew nothing about caring for broken ribs, so I would have to read about them before I tried.
        - id: ch01-b70
          speaker: narrator
          text: >-
            I don't think saving that broken boat was worth Kelly's life.
        - id: ch01-b71
          speaker: wolf_larsen
          text: >-
            Kelly wasn't worth much. Good night.
        - id: ch01-b72
          speaker: narrator
          text: >-
            After everything that had happened, with unbearable pain in my fingertips, three boats still missing, and the Ghost leaping wildly beneath us, I would have thought sleep impossible. Yet my eyes must have closed the instant my head touched the pillow. Exhaustion carried me through the whole night while the Ghost, alone and unguided, fought her way through the storm.
