audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    mugridge:
      display_name: 托马斯·马格里奇
      tts:
        delivery: 油滑怯懦，带着夸张的伦敦口音感
        timbre: 尖细而发黏的成年男声
        pace: 偏快，慌乱时语不成调
        pitch: 高音
    johnson:
      display_name: 约翰逊
      tts:
        delivery: 迟缓沉着，坦率而不肯屈服
        timbre: 粗粝厚实的成年男声
        pace: 缓慢，每句话都说得清楚郑重
        pitch: 中低音
    oofty_oofty:
      display_name: 乌夫蒂—乌夫蒂
      tts:
        delivery: 安静敏捷，冲突中冷峻果断
        timbre: 柔和而结实的成年男声
        pace: 简短沉稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十七章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            船上人人都觉得要出事，奇怪的是，“幽灵号”一路平安无事。我们继续向西北航行，直到日本海岸升出海面，也在那里碰上了一眼望不到尽头的海豹群。没人知道它们从太平洋多么遥远的地方游来，只知道每年这个时候，它们都会循着同一条路北上，赶往白令海的繁殖地。我们跟着它们往北走，也一路捕杀。尸体被剥得光秃秃的，随手扔进海里喂鲨鱼。毛皮则一张张用盐腌起来，日后运到城里，装点那些漂亮女人的肩膀。
        - id: ch01-b02
          speaker: narrator
          text: >-
            那完全是一场为女人而起的滥杀。没有一个人会吃海豹肉，也没人要它们身上的油。收获多的时候，甲板上尽是尸体和毛皮，血与脂油混在一起，脚下滑得站不稳，排水孔里不断淌出红水。桅杆、缆绳、舷栏，到处溅着同一种血色。水手们脱光上身，两条胳膊和一双手也染得通红。他们一刻不停地挥动剖割和剥皮的刀，像一群做惯了这门生意的屠夫，把那些刚被杀死的美丽海兽一张张剥掉皮。
        - id: ch01-b03
          speaker: narrator
          text: >-
            每当小艇把皮送回来，我得一张张清点，还要盯着众人完成剥皮。等这番活儿做完，我再带人洗净甲板，把船重新收拾得像一条船。这份差事一点也不愉快，叫我的心和胃一同翻腾。不过，要我指挥和调度这么多人，倒也逼出了我仅有的一点办事能力。我能感觉到自己正在变得坚韧，也正在变硬，学会承受过去会逃开的东西。对那个被人叫作“娇小姐”的范韦登来说，这未必不是一剂好药。
        - id: ch01-b04
          speaker: narrator
          text: >-
            我也越来越明白，自己不可能再变回从前那个人。海狼·拉森那些摧毁一切的议论，还没有夺走我对人生的希望和信念，可他已经从许多较小的地方改变了我。他硬把真实的世界推到我面前。过去，我对那里几乎毫无所知，甚至总在畏缩，总想躲开。现在，我开始正眼看人究竟怎样活着，承认世上不只有头脑里的思想与观念，也有不能回避的事实。我一点点从纯粹的思想天地中走出来，开始衡量那些具体、客观的东西在生活中究竟有多少分量。
        - id: ch01-b05
          speaker: narrator
          text: >-
            到了猎场，我跟拉森相处的时间反而比从前更多。天气一好，六条小艇便载着所有人离船追猎。它们从纵帆船两边呈扇形散开，最上风和最下风的两条能隔开十到二十英里，沿着笔直的方向巡猎，一直走到天黑，或等坏天气把人赶回来。船上只剩拉森和我，托马斯·马格里奇几乎不能算个人手。不过这可不是什么消遣。我们得驾驶“幽灵号”，始终待在最下风那条艇的下风处。这样一旦刮起狂风，或天气突然变脸，每条艇都能借着顺风赶回船边。
        - id: ch01-b06
          speaker: narrator
          text: >-
            两个人要操纵这样一条船，还得掌舵、瞭望、升帆收帆，风一紧便绝不是轻松的事。我只好赶快学。掌舵不难，爬桅杆却不同。我得沿绳梯登上横桁，离开绳梯以后，靠两只胳膊吊起身体，再继续向上。可我很快也学会了。我心里有股野劲，非要让拉森看看，我不只会用脑子，也能靠双手和身体挣得活下去的资格。后来我竟喜欢上桅顶。两条腿夹住桅杆，在那危险的高处拿望远镜搜寻小艇，反而让我觉得痛快。
        - id: ch01-b07
          speaker: narrator
          text: >-
            有一天，天色晴美，小艇一早就离了船。猎手的枪声随着他们在海面上散开，传得越来越远，也越来越淡，最后完全消失。西边原有一缕极轻的风，等我们好不容易驶到最下风那条艇的下方，风也咽下了最后一口气。我站在桅顶，亲眼看着六条艇一一越过海面的弧线，追着海豹消失在西方。海面平静得几乎托着我们不动，船身连摇晃都很轻。“幽灵号”再也没法追上去。拉森开始不安。气压计一直往下落，东面的天色更让他放心不下。他不断观察那片天空，一刻也不肯放松。
        - id: ch01-b08
          speaker: wolf_larsen
          text: 要是风猛地从东边冲来，把咱们推到小艇的上风，那中舱和水手舱里，多半要空出几张床了。
        - id: ch01-b09
          speaker: narrator
          text: >-
            到十一点，海面已经像一整块玻璃。正午时分，我们明明到了北方高纬度，热气却闷得人恶心。空气里没有一丝清爽，不流动，又湿又重，像老加利福尼亚人所说的“地震天气”。四周透着不祥。人说不出理由，也摸不到任何证据，却知道最坏的东西正在逼近。东方渐渐被黑云填满。那片云像地狱里耸起的黑色山脉，一层层高过我们，压到船的上方。里面的峡谷、沟壑和绝壁清清楚楚，连藏在深处的阴影也能看见。望着它，人会下意识地寻找岸边的白色浪线，也会等着海水扑向陆地，听它冲进岩洞的吼声。可“幽灵号”仍只是轻轻摇着，周围一丝风也没有。
        - id: ch01-b10
          speaker: wolf_larsen
          text: >-
            这不是一阵小风。大自然这个老娘们儿就要站起后腿，把嗓子里所有声音全嚎出来了。汉普，要想带回一半小艇，咱们就得拼命忙活。你先上去，把顶帆松开。
        - id: ch01-b11
          speaker: humphrey
          text: 真要刮成那样，船上却只有我们两个人，怎么应付？
        - id: ch01-b12
          speaker: wolf_larsen
          text: >-
            趁风刚起，先借它追上小艇，别等风帆全被扯掉。过了这一阵，爱发生什么就发生什么。桅杆撑得住，你我也得撑住。放心吧，等着咱们的活多得很。
        - id: ch01-b13
          speaker: narrator
          text: >-
            沉寂还在继续。十八个人远在海面弧线的另一边，那座铺满天空的云山又慢慢滚来，我匆忙吃着午饭，心一直悬着。拉森看上去不受影响。可回到甲板时，我看见他的鼻翼轻轻抽动，动作也比平日敏捷。脸上的线条绷得很硬，那双眼睛在这一天却是清澈的湛蓝色，里面闪着异常明亮的光。他似乎在用一种凶猛的方式欢喜着。眼前马上就有一场搏斗，他为此感到高兴。他知道生命的大潮正在汹涌上涨，一个人一生中真正活着的伟大时刻，就这样落在了他面前。这份认识让他浑身振奋，仿佛风暴还没来，已经把他托了起来。
        - id: ch01-b14
          speaker: narrator
          text: >-
            他忽然朝逼近的风暴大笑，笑得又嘲弄又挑衅，自己全没察觉我正在看。那幅景象，我至今都忘不了。他站在庞大的黑云前，像《一千零一夜》里一个矮小的人，抬头面对邪恶的巨灵。他在向命运叫阵，没有一点惧意。随后，他走向厨房，叫马格里奇刷完锅碗就上甲板，随时听候招呼。
        - id: ch01-b15
          speaker: wolf_larsen
          text: 汉普，这滋味比威士忌强多了。你那位欧玛尔缺的就是它。我看啊，他只算活过半辈子。
        - id: ch01-b16
          speaker: narrator
          text: >-
            西面的天也暗了，太阳一点点失去光亮，终于消失。才下午两点，鬼气森森的暮色已经落下来，游移的紫光从中穿过。拉森的脸映着那片紫色，不断发亮。我当时心情激荡，竟觉得他像被一圈光晕包围。我们停在一种不属于人间的寂静里，可放眼四周，每一个迹象都在告诉人，巨大的声响和运动马上就会爆发。热气越来越重，沉闷得叫人无法忍受。我额头上凝满汗珠，能感觉到它们沿着鼻子往下流。身体仿佛就要失去知觉，我只好伸手抓住舷栏，靠它支撑自己，才没有倒下。
        - id: ch01-b17
          speaker: narrator
          text: >-
            就在那一刻，一缕几乎感觉不到的气流从东方掠来。它像一句耳语，才到便走，垂落的帆布甚至没有动。可我的脸碰到了它，也凉了一下。拉森低声叫厨子。马格里奇回过头，那张脸吓得又白又可怜。
        - id: ch01-b18
          speaker: wolf_larsen
          text: >-
            解开前帆桁的滑车索，拉到另一边。等船一肯动，就放开帆脚索，再用滑车把帆桁收紧。你敢弄砸，这辈子也不会再有下一回。听明白没有？
        - id: ch01-b19
          speaker: wolf_larsen
          text: >-
            范韦登先生，你守着船首帆，准备换到另一舷。接着马上爬上去，把顶帆尽快张开。越快动手，反倒越省力。厨子要是不麻利，就照他两眼中间来一下。
        - id: ch01-b20
          speaker: narrator
          text: >-
            他没威胁我，这份区别叫我暗自高兴。船头朝着西北，他打算借第一阵风，把所有帆都转到另一舷。拉森解释说，风会从斜后方来。猎手最后开枪时，小艇正稍稍向南走。他到船尾掌舵，我去船头守住三角帆。一缕风过去，又来一缕，帆布懒懒地拍了几下。
        - id: ch01-b21
          speaker: mugridge
          text: 谢天谢地，风没有一下子全冲过来，范韦登先生。
          emotion: fearful
        - id: ch01-b22
          speaker: narrator
          text: >-
            我也在庆幸。所有帆都张着，狂风要是突然撞上来，后果不堪设想。轻轻的气流慢慢变成一阵阵风，帆鼓了起来，“幽灵号”终于前进。拉森把舵轮猛推向左舷，船开始转向。风从正后方吹来，一声声低吼着增强，几面船首帆也猛烈拍打。前帆和主帆转舷时，风压骤变，船身先是向前猛冲，又重重倾向一侧。我看不见别处，只能拼命对付手边的外艏三角帆、艏三角帆和支索帆。绳索几乎占满了两手。等这三面帆终于全换过去，“幽灵号”已经朝西南飞跑。风从船尾一侧灌进每一面帆，所有帆脚索也都转到了右舷。我累得心跳如同汽锤，却连一口气也不敢停，马上又扑向顶帆。赶在风势过强以前，我们总算把顶帆张好，再把散在甲板上的缆绳一圈圈盘妥。我这才走回船尾听候下一道命令。
        - id: ch01-b23
          speaker: narrator
          text: >-
            拉森点头，把舵交给我。风不断加强，海浪也开始升高。我掌了一个小时，越来越难把稳航向。这种速度下，船又迎着斜后风飞驰，我的经验根本不够。
        - id: ch01-b24
          speaker: wolf_larsen
          text: >-
            带望远镜上去，找找那些小艇。咱们至少跑了十海里，现在已有十二三节。这个老姑娘真跑起来，可快得很。
        - id: ch01-b25
          speaker: narrator
          text: >-
            我爬到离甲板七十英尺高的前桅横桁，望着前方空无一物的海面。这时我才明白，若想救回一个人，我们都必须抓紧每一刻。浪头已经重得吓人，我甚至怀疑还有没有小艇留在水面。那样脆弱的小船，怎么可能抵挡眼前的风浪？我们正在顺风疾驶，感受不到狂风全部的力量。可从高处向下望，“幽灵号”仿佛离开了我，船身的轮廓清清楚楚地刻在白沫翻滚的海面上，像一个活物般向前猛冲。它不时抬起船身，斜着越过巨浪，右侧舷栏整个消失，沸腾的海水从甲板一直淹到舱口。每当船从上风一侧开始摇摆，我就会被飞快甩过半空。我像挂在一座倒悬巨摆的末端，遇上最大的摇晃，那道弧足有七十英尺。有一回，眼前的飞旋终于让我恐惧得失去力气。我手脚发抖，只顾紧紧抱住索具，再也不能寻找失踪的人。眼里只剩下方怒吼的海水，它一次又一次扑向“幽灵号”，非要把船压下去不可。
        - id: ch01-b26
          speaker: narrator
          text: >-
            想到那些人还困在海上，我又稳住了自己。只顾寻找他们，便忘了自身。整整一个小时，眼前除了荒凉赤裸的海，什么也没有。后来一束阳光落在远处，把水面照得像发怒的银子。我看见一个黑点被浪顶向天空，又立刻消失。等了片刻，它再次穿出亮得刺眼的海面，位置在左船首偏开一两个罗经点。我没有喊，只朝拉森挥动手臂。他随即转舵。等黑点来到正前方，我再打手势告诉他方向对了。它越变越大，快得让我第一次真正知道“幽灵号”跑得有多快。拉森叫我下来，等我站到舵旁，便告诉我怎样顶风停船。
        - id: ch01-b27
          speaker: wolf_larsen
          text: >-
            马上整个地狱都会炸开。别理会，只管把自己的活干好，再叫厨子守住前帆脚索。
        - id: ch01-b28
          speaker: narrator
          text: >-
            我艰难地走到船头。上风舷和下风舷几乎一样常被水埋没，走哪边都危险。交代完马格里奇，我爬上几英尺高的前桅索具。小艇已经靠近。它正迎着风浪，桅杆和帆全抛在水里，拖在后面当作海锚，三个人不停把艇里的水舀出去。每座水山都会将他们盖住。我盯着空下来的那片海，在令人窒息的焦虑中等着，总怕他们不会再出现。可下一刻，小艇又会突然刺破黑浪，冲出白沫。船头直指天空，湿黑的艇底从头到尾全露出来，看上去像要竖在浪尖。三个人的身影只闪过一瞬，他们仍在疯了似的往外舀水。接着艇身向前翻倒，一头栽进张开的波谷。船头朝下，内部全部暴露，船尾几乎竖到船头正上方。它每一次从浪后再出现，都像从死亡里逃回来。
        - id: ch01-b29
          speaker: narrator
          text: >-
            “幽灵号”突然向下风转去。我一惊，以为拉森觉得救不了他们，已经打算放弃。随即才看懂，他正为顶风停船做准备。船背风直驶，小艇远远落在侧面。纵帆船先是猛然松快，身上的压力全卸掉，速度却陡然增大。接着，它以船尾为轴，飞快掉头迎风。船身刚横在浪前，我们一路避开的狂风便全部撞了上来。我偏偏迎面站着。风像墙一样堵住胸口，把空气灌进肺里，却不许我吐出去。我正呛得透不过气，“幽灵号”也侧在波谷中，向迎风一面深深倒下。一座巨浪在头顶升起。我喘过一口气，再抬眼时，只见浪峰高过了整条船。阳光照进卷起的水头，绿水半透明地奔涌而来，后面挤着乳白的泡沫。
        - id: ch01-b30
          speaker: narrator
          text: >-
            巨浪落下，一切都在同一刻爆发。我像被整个世界重重打中，说不出究竟伤在何处，因为全身都在震痛。双手脱开，我沉进水里，身体任海浪摆布，一路碰撞，不住翻滚。那一刻我想起从前听人说过的可怕情形。人一旦被扫进海浪的深槽，就会这样遭水拖走。憋到最后，我把刺痛的咸水吸进了肺。可混乱中，我始终只记得一件事。我必须让艏三角帆转到上风舷，从反面兜住风。我不怕死，也不觉得自己会死。昏沉之间，我还看见拉森站在舵轮旁，在疯狂的浪涛中，用自己的意志顶住风暴的意志，毫不退让。我猛撞在一样东西上，以为那是舷栏，总算重新吸到空气。想站起来时，脑袋碰到上方，又被撞回四肢着地的姿势。海水竟把我从甲板上冲过艏楼下方，一直送进船头尖舱。我伏着身爬出去，途中从马格里奇身上越过。他缩成一团，不停呻吟。可我没有时间查看，帆还等着我。
        - id: ch01-b31
          speaker: narrator
          text: >-
            甲板上像到了世界末日。木头、钢铁、帆布，到处都在撕裂撞碎。“幽灵号”仿佛要被硬生生扯成片。前帆和前顶帆在船转向时失了风，马格里奇又没来得及收帆脚索，两面帆正轰响着裂成碎条。沉重的帆桁从这边扫到那边，反复抽打舷栏，撞得木屑飞溅。空中全是飞舞的残骸。断绳和支索像蛇一样嘶叫盘卷，前帆斜桁也从这片混乱中砸了下来。它只差几英寸便会击中我，却也把我彻底惊醒。拉森说过整个地狱会炸开，现在果然如此。既然他早有预料，事情也许还救得回来。我立刻寻找他，看见他正独自收紧主帆脚索，用全身肌肉把它一点点拉进来，把主帆扯得平平的。船尾高高抬起，他的身体映在横扫而过的白浪前。这样一整个崩坏混乱的世界，我也许只用了十五秒便看见、听见，又全部弄懂。
        - id: ch01-b32
          speaker: narrator
          text: >-
            我扑向艏三角帆脚索，没有再看小艇。帆半鼓半瘪，每一下拍击都像枪响。我把绳子绕住系缆柱，趁帆拍下时拼命往回拉。每抢进一点，便再绕一圈守住。我的十根指尖全都裂开，外艏三角帆和支索帆也在旁边炸裂，转眼消失。后来绳子忽然轻了。拉森已经赶来，他一人往里收，我只管把松下的部分盘紧。
        - id: ch01-b33
          speaker: wolf_larsen
          text: 系牢！跟我走！
        - id: ch01-b34
          speaker: narrator
          text: >-
            四周虽已破烂不堪，船却重新有了一点秩序。“幽灵号”顶风停住了，还能工作，也确实仍在工作。别的帆全毁了，只有从反面兜风的艏三角帆和收紧扯平的主帆仍在支撑，让船头对着暴怒的大海。拉森去清理吊艇滑车，我赶忙寻找小艇。它在下风处乘一道大浪升起，离船不到二十英尺。拉森算得分毫不差，“幽灵号”正好向它漂去。乍看之下，剩下的事不过是在艇的前后挂好滑车，再把它吊上来。可浪峰与波谷之间的距离不断变化，大船随时可能把小艇压碎。真正动起手来，远没有说起来那么简单。
        - id: ch01-b35
          speaker: narrator
          text: >-
            克尔富特守在艇首，乌夫蒂在艇尾，凯利居中。小艇乘浪升高时，我们沉进谷底，三个人几乎悬在我头顶，全把脑袋探过艇边，低头看着船上的人。下一刻，“幽灵号”又腾上浪峰，他们则远远落到脚下。我不敢相信下一道浪不会把大船压上这片蛋壳，把人和艇一起碾碎。时机终于到了。我把滑车递给乌夫蒂，拉森也从船头把另一副交给克尔富特。两头转眼便挂牢。三个人看准两条船摇摆的节奏，同时跳了过来。纵帆船滚向一侧，舷边离开水面，小艇便紧贴着船侧抬起。等“幽灵号”反向滚回以前，我们已合力把小艇拖过舷栏，在甲板上翻成底朝天。克尔富特左手喷着血，无名指被压得稀烂。他一声也不叫，只用剩下的右手帮着把艇捆回原位。
        - id: ch01-b36
          speaker: wolf_larsen
          text: >-
            乌夫蒂，准备把艏三角帆放过去！凯利，到后面松主帆脚索！克尔富特，去前头看看厨子死了没有！范韦登先生，再爬上桅杆，路上看见散开的东西就割掉！
        - id: ch01-b37
          speaker: narrator
          text: >-
            拉森像老虎一样跳回舵轮旁。我往前桅索具上爬，“幽灵号”也慢慢转向。船再次落进波谷，被海水横扫，好在已经没有帆可供扯碎。爬到横桁一半时，狂风把我牢牢压在绳网上，想掉也掉不下去。船几乎侧翻，桅杆平行着海面。我不是低头看甲板，而是横着看它本该在的位置。那里只有翻滚的水，两根桅杆从水中伸出，整条船仿佛沉没了。等船头继续转开，侧面的压力减轻，“幽灵号”终于立起身，甲板像鲸背一样破水而出。
        - id: ch01-b38
          speaker: narrator
          text: >-
            我像苍蝇一样挂在横桁上，“幽灵号”则在野海上疯狂奔驰。半小时后，我看见第二条艇。它灌满水，底朝天翻着，乔克·霍纳、胖路易和约翰逊拼命攀在上面。这次拉森顶风停船时没有再被巨浪扫过。我仍留在高处，看着船漂到他们身边。滑车挂好，绳子抛过去，三个人像猴子一样爬上来。小艇撞在船侧，压得碎裂，可残骸仍被绑好，以后还能修补。
        - id: ch01-b39
          speaker: narrator
          text: >-
            “幽灵号”再次掉头，在风暴前奔逃。这回它把自己整个扎进海里，有几秒我真以为它不会再出现。连高过船腰许多的舵轮，也一遍又一遍被海水盖住、冲刷。每逢这时，我便觉得天地间只剩下我和上帝。我孤零零陪着他，看他盛怒中的混沌。接着舵轮又冒出来，拉森宽阔的双肩也露出水面。他两手抓紧轮辐，逼船沿着他的意志前进。他像统治风暴的大地之神，甩开落在身上的海水，把风浪也变成达成目的的工具。这实在是奇迹，是叫人无法相信的奇迹。我们这样渺小的人，还能活着、呼吸、劳作，竟能驾驶一件用木头与帆布造出的脆弱器物，穿过如此巨大的天地之战。随后船再次从波谷里摆脱出来，把甲板从海水下抬起，向着咆哮的风继续猛冲。
        - id: ch01-b40
          speaker: narrator
          text: >-
            五点半以后，天光很快消失。我在狂怒的暮色里找到第三条艇。它也底朝天，却没有一个人。拉森仍先拉开距离，再转向迎风，让船漂过去。这次差了四十英尺，小艇从船尾错过。
        - id: ch01-b41
          speaker: oofty_oofty
          text: 四号艇！
          emotion: surprised
        - id: ch01-b42
          speaker: narrator
          text: >-
            小艇从白沫中抬起不过一秒，而且还是底朝天翻着，乌夫蒂已经看清艇号。那是亨德森的船。霍利奥克和威廉斯也跟他在一起，威廉斯是远洋船出身的另一名水手。三个人一定已经死了，这一点毫无疑问。可他们的船还在，于是拉森竟要再冒一次险，非把它从风暴手里抢回来不可。我已经回到甲板上，亲眼看见霍纳和克尔富特试着劝阻。他们说这样的冒险不值得，可拉森根本不听。
        - id: ch01-b43
          speaker: wolf_larsen
          text: 不管地狱里刮出多大的风，也别想从我手里抢走一条艇！
          emotion: angry
        - id: ch01-b44
          speaker: narrator
          text: >-
            我们四个把头凑在一起，他的吼声听来仍像从极远处传来。风浪把一切声音都撕碎了。
        - id: ch01-b45
          speaker: wolf_larsen
          text: >-
            范韦登先生！你、约翰逊和乌夫蒂守艏三角帆！其他人都到船尾拉主帆脚索！马上动起来，不然我把你们全送进天国！听懂了没有？
          emotion: angry
        - id: ch01-b46
          speaker: narrator
          text: >-
            拉森猛转舵轮，船头随即摆开。猎手们除了照办，只能尽力抓住这次危险的机会。船再次冲进波谷，我埋在砸落的水下，死命攀住前桅脚边的系桩，这才懂得他拿众人的命冒了多大的险。巨浪硬把我的手指一根根扯开，我横着滑过甲板，从舷边翻进海里。我不会游泳，还没来得及往下沉，下一股水又把我抛回船上。一只强壮的手抓住了我。等“幽灵号”重新露出水面，我才知道是约翰逊救了我的命。他正焦急地四处寻找。我跟着看过去，也发现最后一刻才赶到船头的凯利已经不见了。我们再次错过小艇，船身所处的位置又与先前不同，不能再用同样的办法。拉森只得让船背风驶开，帆脚索全留在右侧，再掉转船头，改成左舷迎风，逆着风斜驶回来。
        - id: ch01-b47
          speaker: johnson
          text: 太漂亮了！
          emotion: surprised
        - id: ch01-b48
          speaker: narrator
          text: >-
            又一道洪流扫过，我们却顺利闯了出来。我知道约翰逊赞的不是拉森的航海本领，而是“幽灵号”自身的表现。天已经黑得看不见小艇，拉森仍顶着狂乱向回走，仿佛心里有个从不出错的方向。这回船虽不断有半个身子沉进水里，却没有落入会遭横扫的波谷。我们在风浪里一点点倒退，最后准确漂到翻扣的小艇旁。滑车再次挂上去，众人又一次等着两条船在浪中靠拢。那条艇被吊进船时狠狠撞在“幽灵号”侧面，本来就受损的船壳撞得更加破碎。残骸被海水推挤着，几乎要从绳索间挣脱，可我们终于还是把它拖过舷边，带回了甲板。
        - id: ch01-b49
          speaker: narrator
          text: >-
            接下来两个小时，我们七个人都在做同一场可怕的苦工。两名猎手、三名水手，加上拉森和我，先缩小艏三角帆，再去缩小主帆。每一根绳索都在风里挣扎，每一个动作都得跟船身的摇摆抢时间。最后，“幽灵号”只靠这两面收小的帆顶风停住，甲板终于不再总被水淹。可船仍像一只轻飘飘的软木塞，在一座座白浪之间浮起又扎下。我的指尖早在第一次拉帆脚索时就全裂开了。缩帆时，每一次用力都让我疼得泪流满面。等全部工作做完，身体里最后一点力气也离开了。我像个彻底垮掉的人，倒在甲板上翻滚，连站起来都办不到。
        - id: ch01-b50
          speaker: narrator
          text: >-
            马格里奇则像落水老鼠一样，被人从艏楼甲板下面拖出来。他一直胆怯地躲在那里。众人把他拉向船尾舱房时，我才震惊地发现厨房已经整个不见。原来立着它的位置，只剩一片空荡而干净的甲板。进到舱里，水手和猎手全聚在一处。有人用小炉子煮咖啡，我们喝着威士忌，嚼着硬饼干。我这一生从没觉得食物如此可爱，也从没喝过这样好的热咖啡。船身仍在猛烈俯仰、颠簸、翻滚，连经验最足的水手也得一路扶着东西，才可能在舱里移动。有人刚喊一句“这下要挨浪了”，我们便会一同摔向左舷舱室的墙壁，像甲板上的货物似的堆成一团。
        - id: ch01-b51
          speaker: wolf_larsen
          text: >-
            别管什么瞭望了，甲板上什么也做不了。真有船撞过来，咱们也躲不开。都去睡，能歇多久就歇多久。
        - id: ch01-b52
          speaker: narrator
          text: >-
            水手点好两舷的航行灯，便回到船头。两名猎手留在舱房里睡，因为风浪中打开通往中舱的滑盖并不稳妥。拉森和我一起动手，割掉克尔富特那根已经压烂的手指，再把断处缝合。马格里奇先前一直被逼着煮咖啡、端给众人，还得守住炉火。做这些事时，他始终抱怨身体里面疼，这时更赌咒发誓，说自己断了一两根肋骨。我们替他检查，才知道断的不是一两根，而是三根。不过他的伤只能留到第二天。我对断肋骨该怎样处理一无所知，必须先找书读过，才能想办法替他治。
        - id: ch01-b53
          speaker: humphrey
          text: 我还是觉得不值。为了一条已经撞坏的艇，赔上凯利一条命。
        - id: ch01-b54
          speaker: wolf_larsen
          text: 凯利本来就不算什么。晚安。
        - id: ch01-b55
          speaker: narrator
          text: >-
            那一夜，我的指尖痛得无法忍受，三条小艇仍旧失踪，“幽灵号”也还在风浪里发疯般翻腾。照理说，我绝不可能睡着。可脑袋一碰到枕头，我的眼睛便闭上了。极度的疲惫让我整夜没有醒来。无人掌舵、孤零零的“幽灵号”，就这样独自在风暴中挣扎前行。
