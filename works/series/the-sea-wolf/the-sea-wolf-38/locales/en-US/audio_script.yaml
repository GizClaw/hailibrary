audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Humphrey Van Weyden
      tts:
        delivery: reflective and observant, becoming urgent as danger rises
        timbre: warm, educated, and clear
        pace: measured with natural spoken variation
        pitch: medium
    maud_brewster:
      display_name: Maud Brewster
      tts:
        delivery: thoughtful, poised, and gently spirited
        timbre: clear and bell-like
        pace: measured and natural
        pitch: medium-high
    wolf_larsen:
      display_name: Wolf Larsen
      tts:
        delivery: commanding and sardonic, with cold intellectual precision
        timbre: deep, powerful, and rough-edged
        pace: deliberate with sudden force
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER XXXVIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The morning after Wolf Larsen tried to burn the ship, he wrote that the numbness was spreading through his left side. He could barely move his hand now, and we had to speak much louder. In his words, the last lines were going down.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Are you hurting?
        - id: ch01-b03
          speaker: narrator
          text: >-
            I had to shout the question a second time before he answered.
        - id: ch01-b04
          speaker: wolf_larsen
          text: >-
            Not constantly.
        - id: ch01-b05
          speaker: narrator
          text: >-
            His left hand dragged itself across the paper, slow and painful. The scrawl was so hard to read that it looked like one of those spirit messages sold at a séance for a dollar.
        - id: ch01-b06
          speaker: wolf_larsen
          text: >-
            But I am still here. All of me is here.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Those words came even more slowly. Then the pencil slipped away, and we put it back between his fingers.
        - id: ch01-b08
          speaker: wolf_larsen
          text: >-
            When the pain stops, I have complete peace and quiet. My thoughts have never been clearer. I can sit with life and death like a Hindu sage.
        - id: ch01-b09
          speaker: maud_brewster
          text: >-
            And what about immortality?
        - id: ch01-b10
          speaker: narrator
          text: >-
            Maud called the question into his ear. Three times his hand tried to answer, and three times it failed. The pencil fell again. His fingers could no longer close around it, no matter how we tried to help. At last Maud wrapped her own hand around his fingers and held them to the pencil. Very slowly, with whole minutes passing over each letter, the hand wrote one word in large capitals.
        - id: ch01-b11
          speaker: wolf_larsen
          text: >-
            Immortality is bosh.
        - id: ch01-b12
          speaker: narrator
          text: >-
            That was Wolf Larsen's last word. Even at the end, he remained unconvinced and unbeaten. His arm went loose. His body shifted once, then lay still. When Maud let go, his fingers opened under their own weight, and the pencil rolled away.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Can you still hear me?
        - id: ch01-b14
          speaker: narrator
          text: >-
            I shouted while holding his fingers, waiting for the single squeeze that meant yes. Nothing came. The hand was dead.
        - id: ch01-b15
          speaker: maud_brewster
          text: >-
            I thought I saw his lips move a little.
        - id: ch01-b16
          speaker: narrator
          text: >-
            I asked again. His lips moved. Maud touched them with her fingertips, and I repeated the question once more.
        - id: ch01-b17
          speaker: maud_brewster
          text: >-
            Yes.
        - id: ch01-b18
          speaker: narrator
          text: >-
            We looked at each other, waiting. He could still answer, but what could we possibly say to him now?
        - id: ch01-b19
          speaker: maud_brewster
          text: >-
            Oh, ask him...
        - id: ch01-b20
          speaker: narrator
          text: >-
            She stopped, unable to finish.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Ask something that he can answer no to. Then we'll be certain.
        - id: ch01-b22
          speaker: maud_brewster
          text: >-
            Are you hungry?
        - id: ch01-b23
          speaker: narrator
          text: >-
            His lips moved beneath her fingers.
        - id: ch01-b24
          speaker: maud_brewster
          text: >-
            Yes.
        - id: ch01-b25
          speaker: maud_brewster
          text: >-
            Would you like some beef?
        - id: ch01-b26
          speaker: narrator
          text: >-
            She felt the answer.
        - id: ch01-b27
          speaker: maud_brewster
          text: >-
            No.
        - id: ch01-b28
          speaker: maud_brewster
          text: >-
            What about beef tea?
        - id: ch01-b29
          speaker: narrator
          text: >-
            His lips answered once more.
        - id: ch01-b30
          speaker: maud_brewster
          text: >-
            Yes. He wants some beef tea. As long as he can hear us, we can still communicate with him. But after that...
        - id: ch01-b31
          speaker: narrator
          text: >-
            Maud looked up at me in a strange way. Her lips began to shake, and tears filled her eyes. She swayed toward me, and I caught her.
        - id: ch01-b32
          speaker: maud_brewster
          text: >-
            Oh, Humphrey, when will this ever end? I'm so tired. So very tired.
          emotion: sad
        - id: ch01-b33
          speaker: narrator
          text: >-
            She buried her face against my shoulder and wept so violently that her frail body shook. She felt as light as a feather in my arms, so slender and delicate. At last she had broken down. I wondered what I could do without her help.
        - id: ch01-b34
          speaker: narrator
          text: >-
            I held her and comforted her until she bravely gathered herself again. Her mind recovered as quickly as her body always did.
        - id: ch01-b35
          speaker: maud_brewster
          text: >-
            I should be ashamed of myself. But then, I'm only one small woman.
        - id: ch01-b36
          speaker: narrator
          text: >-
            She gave me the whimsical smile I loved. But those words, one small woman, struck me like an electric shock. They were my own secret words for her, the words of my love.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Where did you hear that phrase?
        - id: ch01-b38
          speaker: narrator
          text: >-
            My sudden demand startled her.
        - id: ch01-b39
          speaker: maud_brewster
          text: >-
            What phrase do you mean?
        - id: ch01-b40
          speaker: narrator
          text: >-
            One small woman.
        - id: ch01-b41
          speaker: maud_brewster
          text: >-
            Does it belong to you?
        - id: ch01-b42
          speaker: narrator
          text: >-
            Yes. It's mine. I made it up.
        - id: ch01-b43
          speaker: maud_brewster
          text: >-
            Then you must have said it while you were asleep.
        - id: ch01-b44
          speaker: narrator
          text: >-
            She smiled, and a trembling, dancing light came into her eyes. I knew my own eyes were saying more than I could make myself speak. Without meaning to, I leaned toward her, the way a tree bends in the wind. For that moment, we were very close.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Then she shook her head as if waking from a dream.
        - id: ch01-b46
          speaker: maud_brewster
          text: >-
            I've known those words all my life. My father used to call my mother that.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Well, they're my words too.
        - id: ch01-b48
          speaker: maud_brewster
          text: >-
            For your mother?
        - id: ch01-b49
          speaker: narrator
          text: >-
            No.
        - id: ch01-b50
          speaker: narrator
          text: >-
            She did not ask anything else, though I could have sworn that teasing look stayed in her eyes for some time.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Once the foremast was standing, the rest of the work moved quickly. Before I quite realized it, I had stepped the mainmast without a serious problem. A derrick boom rigged to the foremast had done the lifting. Several more days put every stay and shroud in place and drew them tight.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Topsails would only be dangerous trouble for a crew of two, so I lowered the topmasts to the deck and tied them down. Then we spent several days finishing the sails and setting them. There were only three: the jib, the foresail, and the mainsail. We had patched, shortened, and twisted them until they looked like a ridiculous, badly fitted suit on a schooner as trim as the Ghost.
        - id: ch01-b53
          speaker: maud_brewster
          text: >-
            But they'll do the job! We'll make them work, and we'll trust our lives to them!
          emotion: happy
        - id: ch01-b54
          speaker: narrator
          text: >-
            Of all the trades I had learned, sail-making was certainly my worst. But I could handle sails better than I could sew them, and I was confident I could bring the schooner into some northern Japanese port. I had studied navigation hard from the books aboard. We also had Wolf Larsen's star-scale, a device so simple that even a child could use it.
        - id: ch01-b55
          speaker: narrator
          text: >-
            For a week, little changed in Wolf Larsen except that his hearing kept fading and his lips moved less and less. On the day we finished fastening the schooner's sails, he heard his final words. His lips made their final answer too. Before they fell still, I had one last question for him.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Are you all there?
        - id: ch01-b57
          speaker: wolf_larsen
          text: >-
            Yes.
        - id: ch01-b58
          speaker: narrator
          text: >-
            The last line was down. Somewhere inside that tomb of flesh, the man's soul still lived. The fierce mind we had known remained behind walls of living clay, but now it burned in silence and darkness. It had no way to know a body, or any world outside itself. It knew only itself, and the vast, deep quiet of the dark.
