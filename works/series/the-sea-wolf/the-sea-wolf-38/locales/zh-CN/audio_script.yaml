audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 克制而敏锐，带着文人的观察与自嘲
        timbre: 温润清晰的成年男声
        pace: 舒缓，在惊险处自然加快
        pitch: 中音
    humphrey:
      display_name: 汉弗莱
      tts:
        delivery: 文雅清醒，虚弱中仍保持礼貌
        timbre: 清朗而略显单薄的成年男声
        pace: 从迟缓逐渐恢复平稳
        pitch: 中高音
    wolf_larsen:
      display_name: 海狼·拉森
      tts:
        delivery: 冷静强横，温和时也藏着钢铁般的威压
        timbre: 深沉有力的成年男声
        pace: 从容果断，暴怒时骤然加快
        pitch: 中低音
    maud_brewster:
      display_name: 莫德·布鲁斯特
      tts:
        delivery: 文雅聪慧，惊惶中努力保持镇定与尊严
        timbre: 清澈柔和的成年女声
        pace: 平稳清楚，迟疑时略有停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 最后几条线路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            纵火未遂后的第二天早晨，海狼·拉森写道，他的左半边也快不行了。麻木还在蔓延，手几乎不能动。我们必须说得更响，因为最后几条线路也正在断掉。
        - id: ch01-b02
          speaker: humphrey
          text: 你现在痛吗？
        - id: ch01-b03
          speaker: narrator
          text: 我大声重复一遍，他才作答。
        - id: ch01-b04
          speaker: wolf_larsen
          text: 不是一直痛。
        - id: ch01-b05
          speaker: narrator
          text: >-
            他的左手在纸上艰难地挪动，慢得像在蹒跚。我们费了好大力气，才辨出那潦草的字迹。它活像招魂会上灵媒传来的亡魂讯息，而参加一场招魂会，只要一美元门票。
        - id: ch01-b06
          speaker: wolf_larsen
          text: 可我还在这里，完完整整地在这里。
        - id: ch01-b07
          speaker: narrator
          text: >-
            这几个字写得比先前更慢，更吃力。铅笔随即落下，我们重新塞进他手里。
        - id: ch01-b08
          speaker: wolf_larsen
          text: >-
            不痛的时候，我心里只有安宁和寂静。我从没有想得这么清楚过。现在，我能像印度圣哲一样沉思生命和死亡。
        - id: ch01-b09
          speaker: maud_brewster
          text: 那永生呢？
        - id: ch01-b10
          speaker: narrator
          text: >-
            莫德凑在他耳边大声问。那只手试了三次，却怎么也写不成。铅笔又掉了。我们想替他放回去，可手指已经不能合拢。最后，莫德用自己的手把他的手指按在铅笔上，替他握住。那只手终于写下两个大字，慢得像每写一笔，都有整整一分钟在滴答流逝。
        - id: ch01-b11
          speaker: wolf_larsen
          text: 胡——扯。
        - id: ch01-b12
          speaker: narrator
          text: >-
            这是海狼·拉森写下的最后一个词。到了终点，他依然怀疑一切，依然不可征服。他的手臂和手松了下来，躯干微微动过一下，随后再无声息。莫德放开他的手，几根手指便在自身重量下稍稍散开，铅笔也滚到一旁。
        - id: ch01-b13
          speaker: humphrey
          text: 你还听得见吗？
        - id: ch01-b14
          speaker: narrator
          text: >-
            我高声喊着，握住他的手指，等那表示“是”的一下轻捏。什么也没有。那只手已经死了。
        - id: ch01-b15
          speaker: maud_brewster
          text: 我刚才好像看见他的嘴唇动了一下。
        - id: ch01-b16
          speaker: narrator
          text: >-
            我又问了一次。嘴唇真的动了。莫德把指尖贴上去，我再重复问题。
        - id: ch01-b17
          speaker: maud_brewster
          text: 是。
        - id: ch01-b18
          speaker: narrator
          text: 我们满怀期待地望着彼此。他还能回答，可如今又能对他说些什么呢？
        - id: ch01-b19
          speaker: maud_brewster
          text: 啊，那就问他……
        - id: ch01-b20
          speaker: narrator
          text: 她说不下去了。
        - id: ch01-b21
          speaker: humphrey
          text: 问一个答案必须是“不”的问题。这样才能确定。
        - id: ch01-b22
          speaker: maud_brewster
          text: 你饿了吗？
        - id: ch01-b23
          speaker: narrator
          text: 他的嘴唇在她指下动了动。
        - id: ch01-b24
          speaker: maud_brewster
          text: 是。那你想吃牛肉吗？
        - id: ch01-b25
          speaker: narrator
          text: 她感觉到了答案。
        - id: ch01-b26
          speaker: maud_brewster
          text: 不。牛肉汤呢？
        - id: ch01-b27
          speaker: narrator
          text: 嘴唇又动了一次。
        - id: ch01-b28
          speaker: maud_brewster
          text: >-
            是，他想喝一点牛肉汤。只要他还能听见，我们就能继续同他交流。可等听觉也没有了……
        - id: ch01-b29
          speaker: narrator
          text: >-
            莫德抬头看我，神色很异样。她的嘴唇开始颤抖，眼里涌满泪水。她向我倒来，我连忙把她抱住。
        - id: ch01-b30
          speaker: maud_brewster
          text: 汉弗莱，这一切到底什么时候才会结束？我太累了，真的太累了。
          emotion: sad
        - id: ch01-b31
          speaker: narrator
          text: >-
            她把头埋在我肩上。一阵暴雨般的哭泣袭来，震得她纤弱的身子不停发抖。她在我怀里轻得像羽毛，那么单薄，那么缥缈。她终于撑不住了。我不由得想，没有她帮忙，我该怎么办？
        - id: ch01-b32
          speaker: narrator
          text: >-
            我抱着她，不住安慰。她终于勇敢地收住眼泪，精神也像身体一向恢复得那样快，很快重新振作起来。
        - id: ch01-b33
          speaker: maud_brewster
          text: 我真该害臊。不过，我终究只是一个小小的女人呀。
        - id: ch01-b34
          speaker: narrator
          text: >-
            她带着我深爱的俏皮笑意说出后半句。“一个小小的女人”却像电流一样击中了我。那是我从未说出口的秘密称呼，是我在心里爱她时才用的话。
    - id: ch02
      title: 一个小小的女人
      blocks:
        - id: ch02-b01
          speaker: humphrey
          text: 你从哪儿听来这句话的？
        - id: ch02-b02
          speaker: narrator
          text: 我问得太突然，反倒吓了她一跳。
        - id: ch02-b03
          speaker: maud_brewster
          text: 你说哪一句？
        - id: ch02-b04
          speaker: humphrey
          text: “一个小小的女人。”
        - id: ch02-b05
          speaker: maud_brewster
          text: 这是你的话吗？
        - id: ch02-b06
          speaker: humphrey
          text: 是。是我的，我自己想出来的。
        - id: ch02-b07
          speaker: maud_brewster
          text: 那你一定在梦里说过。
        - id: ch02-b08
          speaker: narrator
          text: >-
            她笑了，眼里亮起颤巍巍的光，活泼地跳动着。我知道，我自己的眼睛也正在说出嘴唇不敢说的话。我不由自主地向她倾去，就像树被风吹弯。那一刻，我们离得那么近。
        - id: ch02-b09
          speaker: narrator
          text: 可她摇摇头，像要摆脱睡意，又像刚从梦里醒来。
        - id: ch02-b10
          speaker: maud_brewster
          text: 这句话我从小就知道。父亲一直这样称呼母亲。
        - id: ch02-b11
          speaker: humphrey
          text: 可它也是我的话。
        - id: ch02-b12
          speaker: maud_brewster
          text: 也是你称呼母亲的话？
        - id: ch02-b13
          speaker: humphrey
          text: 不是。
        - id: ch02-b14
          speaker: narrator
          text: 她没有再追问，可我敢肯定，此后好一阵子，她眼里都留着一丝揶揄又顽皮的神情。
    - id: ch03
      title: 把性命托付给船帆
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            前桅立好以后，工程快了许多。我几乎还没有回过神，主桅也已经竖起，全程没有遇到真正的麻烦。绑在前桅上的起重斜桁完成了这项工作。又过几天，所有支索和桅侧支索都安放妥当，一根根拉得笔直绷紧。我们只有两个人，顶帆只会碍事，还会带来危险，所以我把上桅吊到甲板上，牢牢捆住。
        - id: ch03-b02
          speaker: narrator
          text: >-
            随后又忙了几天，船帆才全部缝好挂起。它们只有三面，船首三角帆、前帆和主帆。每一面都补丁摞着补丁，又被裁短，形状也走了样。套在“幽灵号”这样线条优美的船上，简直是一身滑稽又极不合体的衣服。
        - id: ch03-b03
          speaker: maud_brewster
          text: 可它们管用！我们一定能让它们管用，也一定能把性命托付给它们！
          emotion: happy
        - id: ch03-b04
          speaker: narrator
          text: >-
            我新学会的许多行当里，做帆显然是最糟的一样。不过，我驾驭船帆的本事远比缝制它们强。我心里很清楚，自己有把握把纵帆船开到日本北部的某个港口，对此没有丝毫怀疑。我已经在船上抱着教科书，拼命补过航海术，手边还有海狼·拉森发明的星辰标尺。那东西简单得连孩子都会用。
        - id: ch03-b05
          speaker: narrator
          text: >-
            至于发明它的人，整整一个星期都没有太大变化，只是耳朵越来越聋，嘴唇的动作也一天比一天微弱。就在我们挂好纵帆船船帆的那天，他听见了这世界上的最后一点声音，嘴唇最后的一丝动作也随之消失。在那以前，我赶紧问了最后一个问题。
        - id: ch03-b06
          speaker: humphrey
          text: 你还完完整整地在那里吗？
        - id: ch03-b07
          speaker: wolf_larsen
          text: 是。
        - id: ch03-b08
          speaker: narrator
          text: >-
            最后一条线路断了。可在那座血肉的坟墓深处，这个人的灵魂依然存在。我们熟悉的那个凶悍心智，被活着的泥土筑墙围住，却还在燃烧，只能在寂静和黑暗中燃烧。它仿佛已经脱离肉体。对这个心智来说，肉体已经不再是可以感知的客观存在。它感觉不到身体，不知道世间万物，连整个世界都不复存在。它只知道自己，只知道那无边无际、深不可测的寂静和黑暗。
