audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温柔克制，哀而不伤，怀着安静的慈爱
        timbre: 清澈柔和的成年女声
        pace: 舒缓从容，沉痛处略慢
        pitch: 中音
    jo:
      display_name: 乔
      tts:
        delivery: 热烈坦率，悲伤时竭力克制
        timbre: 清亮而略低的年轻女声
        pace: 适中，动情时稍急
        pitch: 中音
    mrs_march:
      display_name: 马奇太太
      tts: {delivery: 慈爱爽朗，沉稳中带着鼓励, timbre: 饱满温暖, pace: 从容, pitch: 中低音}
    mr_march:
      display_name: 马奇先生
      tts: {delivery: 慈祥诚恳，带着父亲的欣慰, timbre: 温暖沉稳, pace: 从容, pitch: 中低音}
    hannah:
      display_name: 汉娜
      tts: {delivery: 朴实直爽，带着家常口音, timbre: 粗暖, pace: 适中, pitch: 中低音}
    meg:
      display_name: 梅格
      tts: {delivery: 端庄温和，疲惫时敏感，快活时明朗, timbre: 柔润, pace: 适中, pitch: 中音}
    amy:
      display_name: 艾米
      tts:
        delivery: 讲究而伶俐，成熟中仍带少女的直率
        timbre: 清脆明亮的年轻女声
        pace: 适中，兴奋时轻快
        pitch: 中高音
    laurie:
      display_name: 劳里
      tts:
        delivery: 风趣亲切，表面的懒散下藏着低落
        timbre: 清朗温暖的年轻男声
        pace: 从容，真情流露时稍快
        pitch: 中音
    professor_bhaer:
      display_name: 巴尔教授
      tts: {delivery: 诚恳热烈，带着温和的德国口音, timbre: 洪亮浑厚, pace: 从容, pitch: 中低音}
  chapters:
    - id: ch01
      title: 黑暗里的帮助
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一个人心里全是另一个人，又一直有那温柔的榜样领着，要许下忘我的诺言并不难。可如今，劝慰乔的声音停了，每天的功课也结束了。心爱的人走后，只留下孤独和悲伤，她这才知道，那些诺言有多难守。
        - id: ch01-b02
          speaker: narrator
          text: 她时时想着贝丝，哪里还有力气安慰爸爸妈妈？贝丝像是把家里的光明、暖意和美都带去了新的归宿，她又怎么让大家快活起来？从前照料妹妹，爱本身就是回报。如今还有什么有用又快乐的事，能填上这个空缺？
        - id: ch01-b03
          speaker: narrator
          text: 乔茫然地尽着本分，心里却不肯服气。她觉得命运太不公平。自己的快乐越来越少，担子却越来越重。她越努力向前，日子反而越艰难。有些人总在阳光里，有些人却只分到阴影。她明明比艾米更用心学好，得到的不是奖赏，而是失望、烦恼和苦差。
        - id: ch01-b04
          speaker: narrator
          text: 那些日子，对乔来说一片阴暗。她想到自己也许会一辈子困在这座安静的房子里，天天操心琐事，只有一点点快乐，还得扛着永远不会变轻的责任，几乎绝望了。最初的努力一失败，她就跌进阴郁和痛苦里。坚强的意志不得不向命运低头时，人很容易落到这里。
        - id: ch01-b05
          speaker: jo
          text: 我做不到。我天生就不该过这样的日子。要是没人帮我，我迟早会挣脱出去，做出什么不顾一切的事。
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: 不过，帮助真的来了。那些善良的天使用着乔熟悉的面容，也用着最朴素、最适合凡人的法术，所以她起初没有认出来。
        - id: ch01-b07
          speaker: narrator
          text: 夜里，她常猛然惊醒，以为贝丝在叫她。一看见那张空床，她就不甘心地哭起来。
        - id: ch01-b08
          speaker: jo
          text: 贝丝，回来吧！求你回来吧！
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: 乔伸出双臂，却没有扑空。从前，母亲连贝丝最轻的耳语都听得见。现在，她一听见乔抽泣，也会立刻赶来。她用话安慰女儿，更用耐心的温柔抚慰她。母亲无声的眼泪提醒乔，眼前还有一份比自己的痛更深的悲痛。她断断续续的低语里，既有顺服命运的希望，也有凡人自然的哀伤，比祈祷更能打动乔。
        - id: ch01-b10
          speaker: narrator
          text: 静夜里，两颗心不说话也能彼此听见。苦难渐渐成了赐福，悲伤变得纯净，爱也更坚强。乔肩上的担子似乎轻了一些，本分也不再那么苦。她躲在母亲怀里这处安全的港湾，觉得人生终于没有那么难熬了。
        - id: ch01-b11
          speaker: narrator
          text: 心上的疼痛稍稍安定，纷乱的头脑也需要帮助。一天，乔走进书房，俯身靠近父亲那颗抬起来迎她的灰白脑袋。父亲平静地笑了，乔却很谦卑。
        - id: ch01-b12
          speaker: jo
          text: 爸爸，你从前怎么跟贝丝谈，也跟我谈谈吧。我比她更需要，因为我心里没有一处是对的。
          emotion: sad
        - id: ch01-b13
          speaker: mr_march
          text: 亲爱的，你肯来找我，就是对我最大的安慰。
          emotion: sad
        - id: ch01-b14
          speaker: narrator
          text: 父亲的声音发着颤。他抱住乔，仿佛自己也需要帮助，而且并不怕说出来。乔坐到父亲身边那把贝丝的小椅子上，把一切都告诉了他。她说起失去妹妹后的怨愤和悲伤，说起一次次努力却看不见结果的灰心，也说起信念消失后笼罩人生的黑暗，还有那种名叫绝望的迷惘。
        - id: ch01-b15
          speaker: narrator
          text: 乔毫无保留地信任父亲，父亲也给了她需要的帮助。这次倾诉安慰了他们两个人。他们不只像父女，也像一个男人和一个女人那样交心，彼此体谅，彼此爱护，都愿意为对方出力。
        - id: ch01-b16
          speaker: narrator
          text: 后来，他们在旧书房里度过了许多深沉而幸福的时光。乔把那里叫作“只有一位信徒的教堂”。每次走出来，她都重新有了勇气，也恢复了开朗，更能平静地接受生活。父母曾教一个孩子无所畏惧地面对死亡，如今又教另一个孩子别灰心，别疑惧，要接受生命，并怀着感激和力量，用好生命给她的每一次机会。
    - id: ch02
      title: 平凡日子里的光
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 还有一些不起眼的责任和快乐，也来帮乔。它们对身心都有益，只是她慢慢才学会看见，也学会珍惜。扫帚和抹布不再像从前那样惹她厌烦，因为贝丝曾经管着它们。那把舍不得扔的小拖把和旧刷子周围，仿佛还留着贝丝料理家务时的气息。
        - id: ch02-b02
          speaker: narrator
          text: 乔用起这些东西，常会哼贝丝从前哼过的歌。她照着妹妹井井有条的样子做事，又在这里那里添一点小心思，让屋里一直清新舒适。她还不知道，这正是让一个家幸福起来的第一步。直到汉娜赞许地捏了捏她的手。
        - id: ch02-b03
          speaker: hannah
          text: 你这个有心的小人儿，是不是打定主意，只要自己还能出力，就不让我们觉得少了那只亲爱的小羊羔？我们嘴上不说，心里可都看见了。上帝一定会赐福给你，等着瞧吧。
        - id: ch02-b04
          speaker: narrator
          text: 乔和梅格坐在一起做针线，也发现姐姐变了许多。梅格说起话来很动听，也越来越懂女人心里那些善良的愿望、念头和感情。丈夫和孩子让她很幸福，而全家人都在用心照顾彼此。
        - id: ch02-b05
          speaker: narrator
          text: 一天，乔在乱糟糟的育儿室里给黛米做风筝，一边糊，一边开口。
        - id: ch02-b06
          speaker: jo
          text: 看来结婚毕竟是件很不错的事。要是我也试试看，当然，前提是我真能结成，不知道会不会也像你一样，开出这么好看的花？
        - id: ch02-b07
          speaker: meg
          text: 你正该结婚，好把性情里温柔的那一半带出来。乔，你就像一只栗子蓬，外头全是刺，里头却软得像丝绒，还藏着一颗甜果仁，只看谁能碰到它。总有一天，爱情会让你露出真心，那层刺壳也会脱下来。
        - id: ch02-b08
          speaker: jo
          text: 太太，栗子蓬是让霜冻开的，还得狠狠摇一阵，栗子才会掉下来。男孩子都爱捡栗子，我可不想让他们把我装进口袋。
        - id: ch02-b09
          speaker: narrator
          text: 乔嘴上还击，手里仍糊着风筝。不过，什么风也别想让这只风筝飞起来，因为黛西已经把自己绑在上面，成了风筝尾巴上的坠子。
        - id: ch02-b10
          speaker: narrator
          text: 梅格笑了。她很高兴又看见乔旧日精神的一点亮光，可还是觉得，自己应该拿出全部道理说服妹妹。这些姐妹间的谈心没有白费，尤其梅格最有力的两个理由，也就是两个孩子，乔实在爱得很。
        - id: ch02-b11
          speaker: narrator
          text: 悲伤最能打开某些人的心。乔的心已经差不多可以装进口袋了，只差一点阳光把里面的果仁晒熟。时候一到，伸手来摘的不会是一个男孩急躁的摇晃，而会是一个男人温柔的手。他将从栗子蓬里取出果仁，发现它完整又甜美。
        - id: ch02-b12
          speaker: narrator
          text: 乔要是猜到这些，一定会把自己紧紧闭住，变得比从前更扎手。幸好她完全没想到自己，所以时机到了，她自然会落下来。
        - id: ch02-b13
          speaker: narrator
          text: 要是乔是劝善故事里的女主人公，这时候就该变得圣洁无比。她会抛开尘世，戴一顶苦修似的帽子，口袋里装满宗教小册子，到处去行善。可乔不是那样的女主人公。她只是个努力挣扎的普通姑娘，和千百个姑娘一样。
        - id: ch02-b14
          speaker: narrator
          text: 她顺着天性生活。情绪一来，她会悲伤，会烦躁，会懒散，也会忽然浑身是劲。说一句“我要做个好人”很高尚，可谁也不能一口气做到。有些人要费很久的力气，自己拼命，别人也在旁边帮忙，双脚才勉强站上正确的路。
        - id: ch02-b15
          speaker: narrator
          text: 乔已经走到这一步。她正学着尽本分，哪一件没做好，心里就会难过。至于高高兴兴地去做，那是另一回事。她常说，只要事情足够伟大，再难她也愿意。现在，这个愿望实现了。她要把一生献给爸爸妈妈，让他们在家里幸福，就像他们从前让她幸福一样。还有什么比这更美好？
        - id: ch02-b16
          speaker: narrator
          text: 要是非得艰难才算伟大，那么对一个闲不住又雄心勃勃的姑娘来说，还有什么比放下自己的希望、计划和愿望，甘心为别人生活更难？上天认真听见了乔的话。任务已经摆在眼前，虽然不是她想象的那一种，却更高尚，因为里面没有一点为自己打算的成分。
        - id: ch02-b17
          speaker: narrator
          text: 她能做到吗？乔决定试一试。第一次尝试，她就得到了前面那些帮助。后来，她又得到一份帮助。她没把它当成奖赏，只当作慰藉，就像基督徒攀登艰难山时，在路边的小亭歇脚，吃一点东西，再积攒些力气。
    - id: ch03
      title: 把心写进去
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 有一回，沮丧又笼住了乔。母亲问她。
        - id: ch03-b02
          speaker: mrs_march
          text: 你为什么不写点东西？写作从前总能让你快乐。
        - id: ch03-b03
          speaker: jo
          text: 我现在没心思写。就算写了，也不会有人喜欢。
          emotion: sad
        - id: ch03-b04
          speaker: mrs_march
          text: 我们喜欢。写给我们看，先别管外面的世界。试试吧，亲爱的。我相信你会好受一点，我们也会很高兴。
          emotion: calm
        - id: ch03-b05
          speaker: jo
          text: 我不觉得自己写得出来。
        - id: ch03-b06
          speaker: narrator
          text: 话虽这么说，乔还是拿出了写字匣，翻起那些只写了一半的稿子。一个小时后，母亲探头往屋里看。乔穿着黑围裙，埋头飞快地写，整个人都进了故事。马奇太太微微一笑，悄悄退了出去。自己的主意见效，她很满意。
        - id: ch03-b07
          speaker: narrator
          text: 乔自己也不知道事情怎么发生的，可那个故事里仿佛有一样东西，直接走进了读者的心。家人读得又哭又笑。父亲不顾乔极力反对，把稿子寄给了一家很受欢迎的杂志。
        - id: ch03-b08
          speaker: narrator
          text: 让乔万分惊讶的是，杂志不但付了稿费，还向她约别的作品。小故事发表后，好几位值得尊敬的人写信称赞，报纸也转载了它。陌生人和朋友都很喜欢。对一篇小作品来说，这成功实在不小。乔惊讶得很，甚至超过自己的小说同时受到赞扬和责骂时。
        - id: ch03-b09
          speaker: jo
          text: 我真弄不明白。这么简单的一个小故事，大家到底在夸什么？
          emotion: surprised
        - id: ch03-b10
          speaker: mr_march
          text: 因为里面有真情，乔，这就是秘诀。幽默和悲悯让它活了起来，你终于找到了自己的风格。写它的时候，你没想着名声，也没想着钱，只把心放进去了。我的女儿，苦味你已经尝过，现在甜味来了。尽力写下去吧，也让自己像我们一样，为你的成功越来越快乐。
        - id: ch03-b11
          speaker: narrator
          text: 父亲这番话，比世上所有赞美都更让乔动容。
        - id: ch03-b12
          speaker: jo
          text: 要是我写的东西里真有一点善良或真实，那也不是我的功劳。我全都要感谢您、妈妈，还有贝丝。
        - id: ch03-b13
          speaker: narrator
          text: 就这样，爱和悲伤教着乔。她写出一个又一个小故事，把它们送出去，替自己找朋友，也让它们去找自己的朋友。她发现，世界很愿意善待这些谦卑的小旅人。人们亲切地接纳它们，再让它们带着能叫母亲安心的礼物回家，就像一群孝顺的孩子在外面交了好运。
    - id: ch04
      title: 纸上的二重唱
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 艾米和劳里来信宣布订婚时，马奇太太担心乔很难替他们高兴。不过她很快就放心了。乔起初神情严肃，却平静地接受了消息。信还没有读到第二遍，她已经替“两个孩子”想出一大堆希望和计划。
        - id: ch04-b02
          speaker: narrator
          text: 那封信像一支写在纸上的二重唱。两个人都用恋人的口吻夸着对方。读起来很愉快，想起来也让人安心，因为谁也找不出反对这桩婚事的理由。
        - id: ch04-b03
          speaker: narrator
          text: 她们放下写得密密麻麻的信纸，互相看着。
        - id: ch04-b04
          speaker: jo
          text: 妈妈，您喜欢这件事吗？
        - id: ch04-b05
          speaker: mrs_march
          text: 喜欢。艾米写信说拒绝了弗雷德以后，我就在盼着这个结局。那时候我很确定，有一种比你说的“贪图钱财”更好的感情，已经进了她的心。她后来在信里偶尔露出一点口风，我也猜到，爱情和劳里最后会赢。
        - id: ch04-b06
          speaker: jo
          text: 妈妈，您的眼睛可真尖，嘴也真严！您居然一个字都没告诉我。
          emotion: surprised
        - id: ch04-b07
          speaker: mrs_march
          text: 做母亲的要管教女儿，当然得有一双锐利的眼睛，也得管住自己的嘴。我有一半是怕把这个念头塞进你脑子。万一事情还没定，你就先写信去恭喜他们了呢？
        - id: ch04-b08
          speaker: jo
          text: 我早不是从前那个冒失鬼了。您可以信我。我现在又稳重，又明白事理，不管谁的秘密都能放心告诉我。
        - id: ch04-b09
          speaker: mrs_march
          text: 的确是这样，亲爱的。我本来也该把自己的秘密告诉你。只是我以为，知道你的泰迪爱上了别人，或许会让你伤心。
        - id: ch04-b10
          speaker: jo
          text: 妈妈，您真觉得我会那么傻，那么自私吗？他对我的爱情就算不是最好，也正是最热烈、最新鲜的时候，我都拒绝了呀。
        - id: ch04-b11
          speaker: mrs_march
          text: 我知道你那时是真心的，乔。可最近我常常想，如果他回来再问一次，你也许会换一个答案。原谅我，亲爱的。我看得出你很孤单。有时你眼睛里会露出一种饥渴的神情，我看着心疼。所以我想，要是你的男孩现在再试一次，也许能填上那个空缺。
          emotion: sad
        - id: ch04-b12
          speaker: jo
          text: 不会的，妈妈。现在这样更好，我很高兴艾米学会了爱他。不过有一件事，您说对了。我确实很孤单。泰迪要是再试一次，我也许会答应。不是因为我比从前更爱他，而是因为现在的我，比他离开时更想有人爱我。
          emotion: sad
        - id: ch04-b13
          speaker: mrs_march
          text: 听你这么说，我很高兴，乔，因为这说明你正在长大。爱你的人很多。在最好的爱人来到、给你奖赏以前，先试着满足于爸爸妈妈、姐妹兄弟、朋友和孩子们的爱吧。
          emotion: calm
        - id: ch04-b14
          speaker: jo
          text: 世上最好的爱人就是母亲。不过，我也不怕偷偷告诉妈妈，我真想把各种各样的爱都尝一尝。真奇怪，我越努力让自己满足于家人的爱，就越觉得还想要更多。从前我只要有家人就很知足，现在才知道，一颗心居然装得下这么多。我的心像有弹性似的，怎么也填不满。我真不知道这是怎么回事。
        - id: ch04-b15
          speaker: mrs_march
          text: 我知道。
        - id: ch04-b16
          speaker: narrator
          text: 马奇太太露出了智慧的微笑。乔又翻回信的前面，重读艾米写劳里的那一段。
    - id: ch05
      title: 艾米的幸福
      blocks:
        - id: ch05-b01
          speaker: amy
          text: 能得到劳里这样的爱，实在太美好了。他不多愁善感，也不常把爱挂在嘴边，可他做的每一件事、说的每一句话，都让我看得见，也感觉得到。这份爱让我那么幸福，又让我变得谦卑，好像我已经不是从前那个姑娘了。
          emotion: happy
        - id: ch05-b02
          speaker: amy
          text: 我以前不知道，他原来这样善良、大方又温柔。现在，他让我读自己的心，我才发现里面装满了高尚的愿望、希望和志向。知道这颗心属于我，我真骄傲。
          emotion: happy
        - id: ch05-b03
          speaker: laurie
          text: 现在有你上船做我的大副，还有满舱的爱压舱，我相信自己一定能顺利远航。
        - id: ch05-b04
          speaker: amy
          text: 我祈祷他真的能做到，也会努力成为他心中那样的人。
        - id: ch05-b05
          speaker: amy
          text: 我全心全意，用尽全部力量，爱着我英勇的船长。只要上帝允许我们在一起，我永远不会离开他。妈妈，我从前竟然不知道，两个人相爱，又为彼此生活时，这世界会这么像天堂！
          emotion: happy
        - id: ch05-b06
          speaker: jo
          text: 这居然是我们那个冷静、矜持又世故的艾米！爱情真能创造奇迹。他们一定会非常、非常幸福！
          emotion: happy
        - id: ch05-b07
          speaker: narrator
          text: 乔小心地把沙沙作响的信纸叠起来，像是合上一本优美爱情故事的封面。那个故事一直牢牢吸引着读者。直到结尾来了，她才发现，自己又独自回到了每天劳作的世界。
    - id: ch06
      title: 雨中的旧字条
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 过了一会儿，乔慢慢走上楼。外面正在下雨，她没法出去散步，那股不安分的情绪又抓住了她。旧日的感受重新袭来。它不再像从前那么苦，却仍带着一个悲哀而耐心的问题。为什么一个妹妹得到了想要的一切，另一个却什么都没有？
        - id: ch06-b02
          speaker: narrator
          text: 乔知道事情并不是这样，也努力赶走这个念头。可是人天生渴望被爱，艾米的幸福唤醒了她心中饥饿的向往。她也想有一个人，让自己全心全意去爱。只要上帝允许两个人在一起，她就会紧紧依偎着他。
        - id: ch06-b03
          speaker: narrator
          text: 乔不安地四处走，最后进了阁楼。那里并排放着四只小木箱，每只都写着主人的名字，里面装满童年和少女时代留下的纪念。对四姐妹来说，那两个时代都已经结束了。
        - id: ch06-b04
          speaker: narrator
          text: 乔一只只看过去。到了自己的箱子前，她把下巴搁在箱沿上，心不在焉地望着那堆乱七八糟的收藏。后来，一捆旧练习簿吸引了她。她取出本子，一册一册翻看，又回到了在善良的柯克太太家度过的那个愉快冬天。
        - id: ch06-b05
          speaker: narrator
          text: 起初，她脸上还有笑。慢慢地，她沉思起来，接着就难过了。她看到教授亲笔写的一张短笺，嘴唇开始发颤。本子从膝头滑下去，她坐在那里，只望着那几句友善的话。此刻，那些字有了新的意思，也碰到了她心里一个柔软的地方。
        - id: ch06-b06
          speaker: professor_bhaer
          text: 等我吧，我的朋友。我也许会迟一点，但一定会来。
        - id: ch06-b07
          speaker: jo
          text: 要是他真的肯来，那该多好！我亲爱的老弗里茨，他一直对我那么亲切，那么善良，又那么有耐心。从前他就在我身边，我却连他一半的好处都没看懂。现在我多想见到他。所有人好像都在离我而去，只剩下我一个人。
          emotion: sad
        - id: ch06-b08
          speaker: narrator
          text: 乔紧紧攥住那张小纸片，仿佛它是一份还没有履行的承诺。她把头伏在一个柔软的碎布袋上，哭了起来，像是要和敲打屋顶的雨声一较高下。
        - id: ch06-b09
          speaker: narrator
          text: 这全是因为自怜、孤独和情绪低落吗？还是有一种感情终于醒了，而它一直像唤醒它的那个人一样，耐心等待着时机？
        - id: ch06-b10
          speaker: narrator
          text: 谁说得清呢？
