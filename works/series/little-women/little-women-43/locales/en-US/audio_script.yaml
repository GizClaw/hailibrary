  chapters:
    - id: ch01
      title: The Empty Bed
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It had been easy for Jo to promise she would forget herself while Beth was beside her. Beth's gentle example had made every sacrifice seem possible. But now that dear voice was quiet, the daily lesson had ended, and Beth was gone. Jo was left with grief and loneliness, and keeping her promise became terribly hard.
        - id: ch01-b02
          speaker: narrator
          text: How could she comfort Father and Mother while she never stopped longing for her sister? How could she brighten the house when Beth had seemed to carry away all its light and warmth? And what useful, happy work could ever replace the loving care that had been its own reward? Jo tried blindly to do her duty, but inside she fought against it. Her few joys were gone, her burdens were heavier, and life only grew harder. Some people seemed to live in sunshine and others in shadow. It wasn't fair. She tried harder than Amy to be good, yet all she received was trouble, disappointment, and work.
        - id: ch01-b03
          speaker: narrator
          text: These were dark days for Jo. The thought of spending her whole life in that quiet house nearly drove her to despair. She saw nothing ahead but dull chores, a few small pleasures, and duties that never became easier.
        - id: ch01-b04
          speaker: jo
          text: I can't live this way. I wasn't made for it. If nobody comes to help me, I'll break loose and do something desperate.
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: She said it after her first efforts failed, when her strong will had to give in to what could not be changed. Help did come, though Jo did not recognize her good angels at first. They looked too familiar, and their magic was made of the simplest human kindness.
        - id: ch01-b06
          speaker: narrator
          text: Often Jo woke at night believing Beth had called her. Then she saw the little empty bed and cried with grief that still refused to accept the loss.
        - id: ch01-b07
          speaker: jo
          text: Oh, Beth, come back! Please come back!
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: Her arms did not reach out for nothing. Mrs. March heard Jo's sobs as quickly as Jo had once heard Beth's faintest whisper. She came with more than words. Her patient touch brought comfort. Her tears quietly reminded Jo that a mother's grief was greater than her own, and her broken whispers held both sorrow and hope. In those sacred nighttime moments, one heart spoke to another without words. Grief became gentler, and love grew stronger. Safe in her mother's arms, Jo found her burden easier, her duty sweeter, and life possible again.
        - id: ch01-b09
          speaker: narrator
          text: Once her aching heart had found a little comfort, her troubled mind needed help too. One day she went into the study. She bent over Father's gray head when he looked up to welcome her with a peaceful smile.
        - id: ch01-b10
          speaker: jo
          text: Father, please talk to me the way you talked to Beth. I need it more than she did. Everything inside me is wrong.
          emotion: sad
        - id: ch01-b11
          speaker: father
          text: My dear, nothing could comfort me more than this.
          emotion: sad
        - id: ch01-b12
          speaker: narrator
          text: His voice shook as he put both arms around her. He needed help too, and he was not afraid to ask for it. Jo sat close beside him in Beth's little chair and told him everything. She confessed her angry grief, the useless attempts that discouraged her, the lost faith that made life seem dark, and all the confusion called despair. She trusted him completely. He gave her the help she needed, and speaking together comforted them both.
        - id: ch01-b13
          speaker: narrator
          text: They could talk now as more than father and daughter. They met as a man and a woman, each ready to serve the other with sympathy as well as love. Their thoughtful hours in the old study made Jo happy. She called it the church with one member, and she always left with new courage, returning cheer, and a spirit more willing to accept her life. Her parents had taught one child to face death without fear. Now they tried to teach another to accept life without despair, and to use its beautiful chances with gratitude and strength.
    - id: ch02
      title: Familiar Hands at Work
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Other kinds of help were waiting too. They came through plain duties and small pleasures that insisted on serving Jo until she learned to value them. Brooms and dishcloths could never seem quite so hateful again. Beth had ruled over both, and something of her careful spirit still seemed to cling to the little mop and the old brush that no one could throw away.
        - id: ch02-b02
          speaker: narrator
          text: As Jo worked, she hummed Beth's songs. She copied Beth's orderly habits and added the small touches that made every room fresh and cozy. Without knowing it, she had taken the first step toward making home happy. Hannah noticed and gave her hand an approving squeeze.
        - id: ch02-b03
          speaker: hannah
          text: You thoughtful creature. You're set on keeping us from missing that dear lamb as much as you can. We don't say much, but we see what you're doing. The Lord will bless you for it. You wait and see.
        - id: ch02-b04
          speaker: narrator
          text: While sewing with Meg, Jo discovered how much her older sister had grown. Meg spoke wisely about good impulses, thoughts, and feelings. She was happy with her husband and children, and they were all helping one another.
        - id: ch02-b05
          speaker: jo
          text: Marriage may be a fine thing after all. I wonder if I'd bloom half as well as you have, if I ever tried it. That is, supposing I could.
        - id: ch02-b06
          speaker: narrator
          text: Jo was building a kite for Demi in the upside-down nursery.
        - id: ch02-b07
          speaker: meg
          text: Marriage is exactly what you need to bring out the tender half of you. You're like a chestnut burr, Jo. Prickly outside, silky-soft inside, with a sweet kernel if anyone can reach it. Someday love will make you show your heart, and that rough burr will drop away.
        - id: ch02-b08
          speaker: jo
          text: Frost opens chestnut burrs, ma'am, and they need a hard shake before they fall. Boys go gathering nuts, and I have no wish to be tossed into one of their bags.
        - id: ch02-b09
          speaker: narrator
          text: She kept pasting the kite, though no wind would ever lift it. Daisy had tied herself to it for a tail. Meg laughed at this flash of Jo's old spirit, then went on making her case with every argument she could find. Her strongest arguments were the two babies, whom Jo dearly loved. Those sisterly talks were not wasted. Grief can open some hearts better than anything else, and Jo's heart was nearly ready.
        - id: ch02-b10
          speaker: narrator
          text: A little more sunshine would ripen the nut. Then a man's hand, not a boy's impatient shake, would gently pick it from the burr and find the kernel sweet and sound. If Jo had guessed, she would have closed herself up and grown pricklier than ever. Luckily, she wasn't thinking about herself. So when the time came, down she dropped.
        - id: ch02-b11
          speaker: narrator
          text: If Jo had been the heroine of a moral story, this was when she should have become a saint, given up the world, and walked around doing good in a plain little bonnet with religious pamphlets in her pocket. But Jo was no storybook heroine. She was a struggling human girl like hundreds of others. Depending on the day, she was sad, cross, idle, or energetic.
        - id: ch02-b12
          speaker: narrator
          text: It's easy to promise to be good. Becoming good takes time and a long, hard pull before some of us even get our feet pointed the right way. Jo had come this far. She did her duty and felt unhappy when she neglected it. Doing it cheerfully was another matter.
        - id: ch02-b13
          speaker: narrator
          text: Jo had often wished for something splendid to do, no matter how difficult. Now she had her wish. What could be finer than giving her life to Father and Mother and making their home as happy for them as they had made it for her? And what could be harder for an ambitious, restless girl than setting aside her own hopes and plans so she could live cheerfully for others?
        - id: ch02-b14
          speaker: narrator
          text: Providence had taken Jo at her word. This was the task. It was not the one she expected, but it was better because there was nothing selfish in it. Could she do it? Jo decided to try. Her family and her daily duties were already helping her. One more comfort was on its way, like the little arbor where Christian rested while climbing the hill called Difficulty.
    - id: ch03
      title: A Story from the Heart
      blocks:
        - id: ch03-b01
          speaker: mrs_march
          text: Why don't you write? It always made you happy before.
        - id: ch03-b02
          speaker: narrator
          text: Mrs. March asked the question one day when gloom had settled over Jo again.
        - id: ch03-b03
          speaker: jo
          text: My heart isn't in it. And even if I could write, nobody cares about my stories.
          emotion: sad
        - id: ch03-b04
          speaker: mrs_march
          text: We care. Write something for us and forget about everyone else. Please try, dear. It would do you good, and it would make us very happy.
        - id: ch03-b05
          speaker: jo
          text: I don't think I can.
        - id: ch03-b06
          speaker: narrator
          text: Even so, Jo took out her desk and began sorting through her unfinished manuscripts. An hour later, her mother peeked into the room. There sat Jo in her black pinafore, scratching rapidly across the page, completely lost in her work. Mrs. March smiled and slipped away, pleased that her suggestion had worked.
        - id: ch03-b07
          speaker: narrator
          text: Jo never knew exactly how it happened, but something entered that story and went straight to every reader's heart. Her family laughed and cried over it. Then Father sent it to a popular magazine, though Jo strongly objected. To her amazement, the magazine paid for it and asked for more. Respected people wrote letters praising the little tale. Newspapers copied it. Friends and strangers admired it. It was a great success for such a small story, and Jo was even more astonished than when her novel had been praised and criticized at the same time.
        - id: ch03-b08
          speaker: jo
          text: I don't understand. It's such a simple little story. Why is everyone praising it?
          emotion: surprised
        - id: ch03-b09
          speaker: father
          text: Because it is true, Jo. That's the secret. Your humor and sorrow bring it to life, and at last you've found your own style. You weren't thinking about fame or money. You put your heart into the story, my daughter. You've tasted the bitter, and now the sweet has come. Keep doing your best, and learn to be as happy in your success as we are.
        - id: ch03-b10
          speaker: jo
          text: If there's anything true or good in my writing, it didn't come from me alone. I owe it to you, Mother, and Beth.
        - id: ch03-b11
          speaker: narrator
          text: Her father's words touched Jo more deeply than all the world's praise. Love and sorrow had taught her how to write. She sent her little stories out to find friends for themselves and for her. The world treated those humble travelers kindly and sent them home with useful gifts for their mother, like dutiful children who had met with good fortune.
    - id: ch04
      title: News from Amy and Laurie
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When Amy and Laurie wrote to announce their engagement, Mrs. March worried that Jo might struggle to be glad. She soon stopped worrying. Jo looked serious at first, but she accepted the news quietly. Before she had read the letter twice, she was already full of hopes and plans for the children. Amy and Laurie had written it together, each praising the other in the way lovers do. It was pleasant to read and satisfying to consider. No one had any objection at all.
        - id: ch04-b02
          speaker: jo
          text: You're pleased about it, Mother?
        - id: ch04-b03
          speaker: narrator
          text: They set down the closely covered pages and looked at each other.
        - id: ch04-b04
          speaker: mrs_march
          text: Yes. I've hoped for this ever since Amy wrote that she had turned down Fred. I knew then that something better had replaced what you used to call her mercenary spirit. A few hints in her letters made me think love and Laurie would win in the end.
        - id: ch04-b05
          speaker: jo
          text: Marmee, you noticed all that and never told me! You're very sharp and very quiet.
          emotion: surprised
        - id: ch04-b06
          speaker: mrs_march
          text: A mother needs sharp eyes and a careful tongue when she has daughters to manage. I was afraid that if I put the idea in your head, you'd write to congratulate them before they had settled anything.
        - id: ch04-b07
          speaker: jo
          text: I'm not the scatterbrain I used to be. You can trust me now. I'm sensible and serious enough to hear anyone's secrets.
        - id: ch04-b08
          speaker: mrs_march
          text: You are, dear, and I would have told you. But I thought it might hurt to know that your Teddy loved someone else.
        - id: ch04-b09
          speaker: jo
          text: Mother, did you honestly think I could be that foolish and selfish? I refused him when his love was new, even if it wasn't at its best.
        - id: ch04-b10
          speaker: mrs_march
          text: I knew you meant it then. But lately I've wondered whether you might answer differently if he came home and asked again. Forgive me, dear. You're so lonely, and sometimes I see a hungry look in your eyes that breaks my heart. I imagined your boy might fill that empty place if he tried now.
          emotion: sad
        - id: ch04-b11
          speaker: jo
          text: No, Mother. Things are better this way, and I'm glad Amy has learned to love him. But you are right about one thing. I am lonely. If Teddy had asked again, perhaps I would have said yes. Not because I love him more, but because being loved matters more to me now than it did when he left.
          emotion: sad
        - id: ch04-b12
          speaker: mrs_march
          text: I'm glad, Jo. That shows you're growing. You have many people who love you. For now, try to be content with Father and Mother, sisters and brothers, friends and babies. Someday the best lover of all may come and bring your reward.
        - id: ch04-b13
          speaker: jo
          text: Mothers are the best lovers in the world. Still, I don't mind whispering to Marmee that I'd like to try every kind. It's strange. The more I fill my life with all these natural affections, the more love I seem to want. I never knew a heart could hold so much. Mine has become so stretchy that it never feels full, though my family used to be enough. I can't understand it.
        - id: ch04-b14
          speaker: mrs_march
          text: I can.
        - id: ch04-b15
          speaker: narrator
          text: Mrs. March gave her wise smile as Jo turned back through the pages to read Amy's words about Laurie.
        - id: ch04-b16
          speaker: amy
          text: To be loved the way Laurie loves me is so beautiful. He isn't sentimental, and he doesn't talk about it much, but I can feel it in everything he says and does. It makes me so happy and humble that I hardly seem like the same girl. I never understood how good, generous, and tender he was until now. He lets me see into his heart, and it's full of noble hopes, purposes, and impulses. I'm so proud that his heart is mine. He says he can make a prosperous voyage now, with me as his mate and plenty of love for ballast. I pray he can. I'll try to be everything he believes I am, because I love my brave captain with all my heart, soul, and strength. I will never leave him while God lets us stay together. Oh, Mother, I never knew this world could feel so much like heaven when two people love and live for one another!
          emotion: happy
        - id: ch04-b17
          speaker: jo
          text: And this is our cool, reserved, worldly Amy! Love truly does work miracles. They must be so very happy.
          emotion: happy
        - id: ch04-b18
          speaker: narrator
          text: Jo carefully gathered the rustling sheets. It was like closing a lovely romance that holds you until the last page, then leaves you alone again in the everyday world.
    - id: ch05
      title: The Message in the Garret
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: After a while, Jo wandered upstairs. Rain kept her from taking a walk, and she could not settle anywhere. The old feeling returned, but it had lost its bitterness. Now she wondered with patient sadness why one sister should receive everything she wanted while the other had nothing.
        - id: ch05-b02
          speaker: narrator
          text: Jo knew that wasn't true, and she tried to push the thought away. Still, her longing to be loved was strong. Amy's happiness had awakened a hunger for someone she could love with all her heart and soul, someone she could hold close for as long as God allowed them to be together.
        - id: ch05-b03
          speaker: narrator
          text: Her restless wandering ended in the garret. Four little wooden chests stood there in a row, each marked with its owner's name and filled with keepsakes from the childhood and girlhood that had now ended for them all. Jo looked into each one. At her own chest, she rested her chin on the edge and stared at the jumble inside until she noticed a bundle of old exercise books.
        - id: ch05-b04
          speaker: narrator
          text: She pulled them out and turned through the pages, living again through that pleasant winter with kind Mrs. Kirke. At first she smiled. Then she grew thoughtful, and then sad. At last she found a small message written in the Professor's hand. Her lips began to tremble. The books slipped from her lap as she stared at those friendly words. They had taken on a new meaning and touched a tender place in her heart.
        - id: ch05-b05
          speaker: narrator
          text: The message said, “Wait for me, my friend. I may be a little late, but I shall surely come.”
        - id: ch05-b06
          speaker: jo
          text: Oh, if only he would come! My dear old Fritz was always so kind, so good, and so patient with me. I never valued him enough when he was here. How I would love to see him now. Everyone seems to be leaving me, and I'm all alone.
          emotion: sad
        - id: ch05-b07
          speaker: narrator
          text: Jo held the little paper tightly, as though it were a promise still waiting to be kept. Then she laid her head on a comfortable rag bag and cried while the rain tapped steadily on the roof.
        - id: ch05-b08
          speaker: narrator
          text: Was it only self-pity, loneliness, or sadness? Or had a deeper feeling awakened at last, after waiting as patiently as the man who inspired it? Who can say?
