audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带克制的幽默与细腻观察
        timbre: 清澈柔和的成年女声
        pace: 从容而富有变化
        pitch: 中音
    jo:
      display_name: 乔
      tts:
        delivery: 坦率活泼，热情中带着倔强和自省
        timbre: 明亮有朝气的年轻女声
        pace: 轻快，犹豫时略有停顿
        pitch: 中高音
    dashwood:
      display_name: 达什伍德先生
      tts:
        delivery: 世故懒散，公事公办，偶尔带轻慢
        timbre: 略显沙哑的成年男声
        pace: 不紧不慢
        pitch: 中低音
    bhaer:
      display_name: 巴尔先生
      tts:
        delivery: 真诚厚重，带轻微德国口音，动情时热烈有力
        timbre: 洪亮温厚的成年男声
        pace: 平稳，激动时加快
        pitch: 低音
  chapters:
    - id: ch01
      title: 向《火山周刊》投稿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 乔在寄宿屋里过得很快活，周围有人来往，每天也忙着做工挣钱。亲手赚来的面包，吃起来仿佛更香甜。可她还是会挤出时间写作。这个贫穷又有抱负的姑娘，一心想得到金钱带来的力量。她不是只想让自己过得好。她想让家里什么也不缺，让贝思从冬天的草莓到卧室里的风琴，想要什么就能有什么。她想亲自出国看看，也想永远有余钱，可以尽情享受帮助别人的快乐。这座空中楼阁，她已经珍藏好多年了。
        - id: ch01-b02
          speaker: narrator
          text: 那篇获奖小说，像是替她打开了一条通往梦想的路。长篇小说的失败又让她跌了下来。舆论这个巨人，连爬得更高、胆子更大的杰克也会害怕。可乔身上那股“再爬起来拿一样”的劲儿从没消失。这一回，她换了背阴的一面往上爬，果然拿到了钱，却差点把比钱更宝贵的东西留在上面。
        - id: ch01-b03
          speaker: narrator
          text: 她开始偷偷写惊险故事。在那个年代，连号称十全十美的美国也爱看垃圾。她写好一篇“惊心动魄的故事”，决定亲自送到《火山周刊》。乔没读过那本专讲衣服影响的《衣裳哲学》，可她凭直觉知道，许多人看衣着，比看人的品格和风度更认真。于是她穿上自己最好的衣服，一路安慰自己，既没有激动，也没有紧张。两层楼梯又黑又脏，编辑部里乱糟糟的，满屋都是雪茄烟。三位先生翘着脚坐在那里，脚跟比帽子还高。乔进门，他们连帽子也没摘。她在门口迟疑了一下，紧张得声音都低了。
        - id: ch01-b04
          speaker: jo
          text: 对不起，这里是《火山周刊》的编辑部吗？我想见达什伍德先生。
        - id: ch01-b05
          speaker: narrator
          text: 翘得最高的那双脚总算落了地。烟抽得最凶的先生站起来，把雪茄小心夹在手里，困倦地朝她点点头。乔知道自己非把事情办完不可，赶紧拿出稿子。可她越说脸越红，准备好的话也全碎成了一截一截。
        - id: ch01-b06
          speaker: jo
          text: 是我的一个朋友……她想送来一篇故事试试看。她想听听您的意见。要是这篇合适，她以后还愿意写。
        - id: ch01-b07
          speaker: narrator
          text: 达什伍德先生接过稿子，用不大干净的手指翻着整齐的纸页。他看见页码编好了，每张只写一面，也没用丝带捆起来，便知道作者不是新手。
        - id: ch01-b08
          speaker: dashwood
          text: 我看，这不是她第一次写吧？
        - id: ch01-b09
          speaker: jo
          text: 不是，先生。她以前写过，还凭一篇故事得过《巧言石旗报》的奖。
        - id: ch01-b10
          speaker: dashwood
          text: 哦，是吗？那就把稿子留下吧。我们手头这种东西已经多得不知怎么处理了，不过我会看一遍，下星期给你答复。
        - id: ch01-b11
          speaker: narrator
          text: 达什伍德先生说话时，从乔帽上的蝴蝶结一直打量到靴子上的纽扣。乔一点也不喜欢他，更不愿把稿子留下，可她没有别的办法，只能挺直身子，庄严地走出去。那几位先生交换着会意的眼神，显然早把“我的朋友”识破了。门一关，屋里便响起笑声。乔羞恼极了，回去狠狠干了好一阵针线活。过了一两个钟头，她终于能笑看这场面，又开始盼着下星期快些到来。
        - id: ch01-b12
          speaker: narrator
          text: 第二次去时，达什伍德先生恰好独自一人，乔立刻松了口气。他看起来比上回清醒多了，也没有一头埋进雪茄烟里，终于还记得待客应有的礼貌。这场会面还没开始，乔已经觉得比第一次自在许多。
        - id: ch01-b13
          speaker: dashwood
          text: 这篇我们收了。只要你同意改几处。稿子太长，把我标出的段落删掉，篇幅就正好了。
        - id: ch01-b14
          speaker: narrator
          text: 稿子被揉得皱巴巴的，句子和段落下面到处画着线，乔几乎认不出来。她觉得自己像个爱孩子的母亲，人家为了把婴儿塞进一张新摇篮，竟要她砍掉孩子的腿。再仔细一看，编辑删掉的全是道德议论。那些可是她特地放进去的压舱物，原想用来稳住满船的浪漫情节。她没想到，自己费心安排的悔过和教训，在编辑眼里正是最该扔掉的部分。
        - id: ch01-b15
          speaker: jo
          text: 可是，先生，我以为故事总得有点寓意，所以特意让几个罪人悔过了。
        - id: ch01-b16
          speaker: narrator
          text: 达什伍德先生笑了。乔已经忘记自己是替“朋友”来的，说话的口气明明就是作者本人。
        - id: ch01-b17
          speaker: dashwood
          text: 读者是来找乐子的，不是来听人说教的。如今道德卖不出去。
        - id: ch01-b18
          speaker: jo
          text: 那么照您的改法，这篇就能用了？
        - id: ch01-b19
          speaker: dashwood
          text: 能用。情节挺新鲜，安排得也不错，文字也好，差不多就是这样。
        - id: ch01-b20
          speaker: jo
          text: 那么，您会付……我是说，报酬有多少？
        - id: ch01-b21
          speaker: dashwood
          text: 哦，对。这样的稿子，我们付二十五到三十块。等刊出来再给钱。
        - id: ch01-b22
          speaker: narrator
          text: 据说，编辑的脑子总容易漏掉稿费这种小事。乔从前写一栏才挣一块，二十五块已经显得很可观了。她满意地把稿子递回去。
        - id: ch01-b23
          speaker: jo
          text: 好，稿子归您。要是我的朋友还有一篇，比这一篇更好，我能告诉她您愿意收吗？
        - id: ch01-b24
          speaker: narrator
          text: 成功让乔壮了胆，她完全没发现自己那句话又露了馅。
        - id: ch01-b25
          speaker: dashwood
          text: 可以拿来看看，但不能保证采用。告诉她，故事要短，要刺激，别管什么道德。你的朋友打算署什么名字？
        - id: ch01-b26
          speaker: jo
          text: 什么也不署，劳驾。她不想公开姓名，也没有笔名。
        - id: ch01-b27
          speaker: dashwood
          text: 随她的便。故事下星期就登。稿费是你来拿，还是我寄过去？
        - id: ch01-b28
          speaker: jo
          text: 我自己来。先生，再会。
        - id: ch01-b29
          speaker: narrator
          text: 乔走后，达什伍德先生又把脚翘起来，随口说，这姑娘照例又穷又傲，不过能派上用场。刚才他问稿费该寄到哪里，原也是想探出新作者的身份，可乔坚持亲自来取，一点线索也没留下。
    - id: ch02
      title: 惊险故事与真正的英雄
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 乔听从达什伍德先生的指点，又拿诺思伯里太太当榜样，一头扎进了满是泡沫的惊险文学。幸亏后来有位朋友抛来救生圈，她才重新浮上来，没有被这次落水伤得太重。她和许多刚学写作的年轻人一样，跑到异国寻找人物和风景，让强盗、伯爵、吉卜赛人、修女和公爵夫人在纸上轮番登场。至于这些角色演得是否准确、有神，只能说已经尽了她当时的本事。读者不在乎语法、标点和情理。达什伍德先生也乐意让她用最低的价钱填版面，却没告诉她，自己手下一个写手刚被别人加薪挖走，这才是他如此好客的原因。
        - id: ch02-b02
          speaker: narrator
          text: 乔很快写出了兴致。她那只原本饿瘦的钱包一天天胖起来，为明年夏天带贝思进山而存的小金库，也随着一个个星期过去，缓慢却稳当地增加。只是这份满足总有一处让她不安。她始终瞒着家里，因为总觉得父亲母亲不会赞成。她打算先按自己的意思做，以后再请求原谅。故事没有署名，秘密并不难守。达什伍德先生早就猜到作者是谁，却真的替她守住了，这在他身上也算一件稀奇事。
        - id: ch02-b03
          speaker: narrator
          text: 乔真心相信，自己不会写任何值得羞愧的东西。良心偶尔刺她一下，她便想象将来拿出收入、向家人揭开秘密的快乐。到那时，大家会一起笑她把秘密守得这样严，她也就能证明这一切都是为了贝思和家人。可是达什伍德先生只收刺激的故事。要把读者吓得心惊肉跳，她便得先折腾他们的心魂。于是历史传奇、陆地海洋、科学艺术、警方档案，甚至疯人院，全成了她搜寻材料的地方。
        - id: ch02-b04
          speaker: narrator
          text: 她生活得太纯真，对社会底下那个悲惨世界知道得很少，于是把弥补这项不足当成了正经工作。乔急着寻找素材。哪怕文笔一时还不高明，她也非让情节独创不可。她从报纸里搜事故、奇闻和罪案，借毒药方面的书，让图书管理员起了疑心。她盯着街上一张张脸看，也观察周围各色人的性情，不管是好人、坏人还是普普通通的人。她还从古代的尘埃里挖出老得近乎新鲜的事实和传说。只要有限的生活给她一点机会，她便尽量去接近愚蠢、罪恶和苦难。
        - id: ch02-b05
          speaker: narrator
          text: 乔以为自己进步得很好，却没发现，女性天性中最可贵的一些东西正被她轻慢地伤害。她结交的坏伙伴虽然都是虚构的，影响却并不虚假。她让自己的心和想象吃下危险而空洞的食物，又太早看见人生阴暗的一面。那一面原本迟早会走到每个人眼前，她根本不必主动迎上去。如今，天性里那层纯洁的光泽正渐渐褪去。乔已经感觉到不对，只是还说不清楚。她写别人的激情和感受写得太多，也开始猜测、剖看自己的内心，把这当成一种消遣。健康的年轻心灵本不会主动沉溺在这种病态的游戏里。做错事总会带来惩罚，而惩罚恰在她最需要的时候到来了。
        - id: ch02-b06
          speaker: narrator
          text: 就在乔把天下所有美德都送给虚构英雄时，她也发现了一个有许多缺点的活英雄。巴尔先生曾劝她，作家应该留心观察身边朴素、真实、可爱的人物。乔立刻照办，转过身就研究起教授本人。要是他知道，一定会非常吃惊，因为他对自己一向十分谦逊。
        - id: ch02-b07
          speaker: narrator
          text: 起初，乔不懂为什么人人都喜欢他。他不富裕，不显赫，不年轻，也不英俊，和迷人、气派、才华耀眼这些词全不相干。可他像一炉暖火，大家自然会聚到他身边。他很穷，却总在把东西送人。他身在异乡，却到处都是朋友。他年纪已不轻，心还像男孩一样快乐。相貌平凡，性情也古怪，可许多人觉得他的脸很美，也愿意原谅他的怪处。
        - id: ch02-b08
          speaker: narrator
          text: 乔看了许久，终于明白，是仁厚创造了这种魅力。就算他心里有忧愁，那忧愁也会把头藏到翅膀底下，他只把有阳光的一面朝向世人。时光看他待别人如此温柔，落在他额头上也仿佛格外轻。嘴角的纹路留下了友善的话和快活的笑声。眼睛从不冷硬，那只大手握起来温暖又有力，比话语更会表达感情。
        - id: ch02-b09
          speaker: narrator
          text: 连他的衣服都像主人一样好客。它们穿在身上松松快快，仿佛也喜欢让教授过得舒服。宽大的背心让人想到下面那颗宽广的心，褪色的旧外套带着亲切随和的神气。松垮的口袋则明明白白地证明，孩子的小手常常空着伸进去，装满东西再拿出来。连他的靴子都很和善，衣领也从不会像别人的那样僵硬扎人。
        - id: ch02-b10
          speaker: jo
          text: 原来如此！只要真心善待别人，哪怕是一个吃饭像用铲子、自己补袜子，又偏偏姓巴尔的胖德国教师，也会变得美好又尊贵。
        - id: ch02-b11
          speaker: narrator
          text: 乔珍视善良，也像许多女人一样敬重才智。后来一位同乡来探望巴尔先生，和诺顿小姐谈话时无意间说起，他在柏林曾因学问和操守备受尊敬。巴尔先生自己从不谈这些，所以此前没有人知道。乔从诺顿小姐那里听说后，对他更多了几分敬意。昔日在故乡是受人敬仰的教授，如今在美国只是贫穷的语言教师。乔知道这个秘密后，甚至替他觉得骄傲。这一丝传奇色彩，让他朴素劳碌的生活也显得更美。
        - id: ch02-b12
          speaker: narrator
          text: 这还不是教授让乔惊喜的全部。诺顿小姐能进入许多乔无缘得见的社交场合。她自己独身一人，对这个有志气的姑娘很有好感，也好心地把同样的照顾给了教授，常带他们出去。有一晚，她带两人参加一场为名流举办的精英聚会。乔早已准备好向那些远远崇拜过的伟人低头膜拜。可她很快发现，伟人终究也只是男人和女人。这个发现重重打击了她对天才的敬仰，好一阵子都没恢复过来。
        - id: ch02-b13
          speaker: narrator
          text: 那位诗人的作品让人以为，他是靠灵气、火焰和露珠活着的精灵。乔怀着敬畏偷偷看过去，眼前的诗人却埋头猛吃，吃得热火朝天，连那张才气十足的脸都红了。她仿佛看见一尊偶像当场倒塌，只好把目光移开。可别处的发现也没好多少。大作家在两只酒瓶之间来回摆动，像钟摆一样准。著名神学家公然向一位才女献殷勤。那位才女努力独占高深的哲学家，刚刚胜过另一位对手，现在又对她怒目而视。落败的女人倒和颜悦色地挖苦她。哲学家像约翰逊博士一样大口喝茶，听着滔滔不绝的谈话，连一句也插不进去，几乎像是睡着了。
        - id: ch02-b14
          speaker: narrator
          text: 科学名人们忘了软体动物和冰川期，一边使劲吃牡蛎和冰点，一边闲谈艺术。那位年轻音乐家像第二个俄耳甫斯一样迷倒全城，开口却只聊马。到场的英国贵族，又偏偏是全场最普通的人。一个发现接着一个发现，乔那些浪漫幻想很快全散了。晚会还没过一半，她已经失望得只好躲到角落里定神。巴尔先生也很快坐了过来，看上去同样不属于这种场合。
        - id: ch02-b15
          speaker: narrator
          text: 几位哲学家带着各自最钟爱的论题走来，在附近展开一场思想比武。乔听不懂康德和黑格尔，也弄不清主观和客观。到最后，唯一从她“内在意识里演化出来”的东西，就是一场厉害的头痛。她只渐渐听明白，这些人要把世界拆散，再按照他们认为更高明的新原则拼回去。宗教就要被推理成虚无，才智将成为唯一的神。
        - id: ch02-b16
          speaker: narrator
          text: 乔对哲学和形而上学一窍不通，听着却又快乐又痛苦。那些大胆的新说法让她兴奋，也让她无处着落，仿佛一只放假出游的小气球，挣脱绳索，独自漂进了时间和空间。她转头想看看教授是否喜欢，只见他正盯着自己，神情前所未有地严峻。他摇头，又招手叫她离开。可思辨哲学的自由正迷住乔，她仍坐在那里。她非得听听这些聪明人毁掉所有旧信念后，究竟还能依靠什么。
        - id: ch02-b17
          speaker: narrator
          text: 巴尔先生很羞怯，平时不轻易发表意见。不是因为他没有定见，而是因为他太真诚，太认真，不肯随便谈论信仰。他看看乔，又看看那些被哲学焰火吸引来的年轻人，担心这些容易燃烧的心灵会被火箭引错方向。等焰火散尽，他们手里也许只剩一根空棍，或者一只烧伤的手。
        - id: ch02-b18
          speaker: narrator
          text: 他忍了很久。终于有人问他的意见，他的正直与愤慨立刻燃烧起来。他站出来捍卫宗教，真理让他的辩词有了力量，连不流利的英语都像音乐，平凡的脸也变美了。那些聪明人很会辩论，这一仗并不好打。可巴尔先生不知道何时才算失败，只管像个男子汉那样守住自己的旗帜。
        - id: ch02-b19
          speaker: narrator
          text: 随着他的话，乔眼中的世界又恢复了秩序。刚才仿佛被拆散的一切，重新回到了该在的位置。长久流传的古老信念，似乎比那些耀眼的新学说更好。上帝不是一种盲目的力量，灵魂不朽也不是为了安慰人而编出的好看寓言，而是真正蒙福的事实。乔仿佛不再漂在虚空里，双脚重新站上坚实的土地。教授最后停下来。他的话是说不过别人了，信念却一点没动摇。乔真想拍手喝彩，再当面好好谢他。
        - id: ch02-b20
          speaker: narrator
          text: 乔没有拍手，也没有道谢，却永远记住了这一幕。她知道教授当众开口并不容易。他天性羞怯，又把信仰看得太认真，不愿轻率谈论。这一次，只因良心不准他沉默，他才站出来承受那场艰难的辩论。乔因此从心底里敬重他。从这一天起，她开始明白，人格是比金钱、地位、才智和美貌都珍贵的财富。聚会上的名人曾拥有后面几样，却没有谁像此刻的教授这样打动她。如果伟大真像一位智者说的那样，在于“真诚、敬畏与善意”，那么她的朋友弗里德里希·巴尔不但善良，而且伟大。
    - id: ch03
      title: 一顶纸帽的劝诫
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这个信念一天比一天强。乔越来越珍视教授的赞许，渴望得到他的尊重，也真心想让自己配得上这份友谊。偏偏就在这个愿望最诚恳的时候，她差点把一切都失去。事情的起因竟只是一顶三角帽。一天晚上，巴尔先生来给乔上课，头上还戴着蒂娜替他扣上的纸士兵帽。他一路走下来，却早已忘了把帽子摘掉。
        - id: ch03-b02
          speaker: jo
          text: 他下楼以前，显然从来不照镜子。
        - id: ch03-b03
          speaker: narrator
          text: 乔笑着想。教授说了声晚上好，就一本正经地坐下。他要朗读《华伦斯坦之死》，却不知道头上的纸帽让这题目显得有多滑稽。乔没有提醒他。她最爱听他遇到趣事时放声大笑，便等他自己发现。可德国人朗读席勒太吸引人，她很快也把帽子忘了。
        - id: ch03-b04
          speaker: narrator
          text: 朗读过后，两人开始上课。乔那晚兴致很好，眼睛又总被三角帽逗出笑意。教授始终猜不透她在笑什么，终于停下来，带着温和又可笑的诧异问她。
        - id: ch03-b05
          speaker: bhaer
          text: 马奇小姐，你为什么当着老师的面笑？你一直这样调皮，难道一点也不尊敬我吗？
        - id: ch03-b06
          speaker: jo
          text: 先生，您连帽子都忘了摘，我怎么尊敬得起来？
        - id: ch03-b07
          speaker: narrator
          text: 教授抬手摸到纸帽，郑重地摘下来，看了一会儿，突然仰起头，笑得像一把快乐的低音提琴。
        - id: ch03-b08
          speaker: bhaer
          text: 啊，我明白了！又是蒂娜那个小淘气，用这顶帽子让我出丑。好吧，这没什么。不过你听着，这堂课要是上不好，你也得戴它。
        - id: ch03-b09
          speaker: narrator
          text: 接下来几分钟，课还是没法上。巴尔先生看见帽子上的画，便把纸展开。上面画着疯子、尸体、恶棍和毒蛇。他顿时露出厌恶的神情。
        - id: ch03-b10
          speaker: bhaer
          text: 真希望这种报纸不要送进这座房子。孩子不该看，年轻人也不该读。它不是好东西。制造这种毒害的人，我实在没耐心容忍。
          emotion: disgusted
        - id: ch03-b11
          speaker: narrator
          text: 乔也不喜欢那幅画，可她翻过报纸，不是因为厌恶，而是因为害怕。刚才有一瞬，她以为那是《火山周刊》。幸好不是。就算真是，上面又登着她的故事，也没有姓名会出卖她。可是她的眼神和脸红已经泄露了秘密。
        - id: ch03-b12
          speaker: narrator
          text: 教授虽然常常心不在焉，看到的事却比别人以为的多。他知道乔写作，也不止一次在报馆附近遇见过她。乔从来不提，他也没有追问，尽管他一直很想看看她的作品。此刻他忽然明白，乔也许正在做一件自己羞于承认的事，这让他很不安。他没有像许多人那样告诉自己，这与他无关，也没有说自己无权开口。他只想到，乔年轻又贫穷，一个人远离母亲的疼爱和父亲的照顾。他想帮她。那股冲动来得又快又自然，就像看见婴儿要跌进水坑，谁都会立刻伸手拉住。
        - id: ch03-b13
          speaker: narrator
          text: 这些念头只在一瞬间掠过，他的脸上却没有露出半点痕迹。等乔把报纸翻过去，又把针线穿好，教授已经准备妥当。他没有质问乔，也没有揭穿她，只用十分自然、却又格外严肃的口气开口。
        - id: ch03-b14
          speaker: bhaer
          text: 对，把它丢开是对的。我不觉得好姑娘应该看这种东西。有些人把它写得很诱人，可我宁愿把火药交给孩子们玩，也不愿把这种坏垃圾给他们。
        - id: ch03-b15
          speaker: jo
          text: 也许并不全是坏东西，只是有点愚蠢。既然有人想看，写出来给他们读，我看不出有什么害处。许多很体面的人，都靠惊险故事清清白白地谋生。
        - id: ch03-b16
          speaker: narrator
          text: 乔一边说，一边拿针狠狠划过衣褶，留下一排细小的口子。
        - id: ch03-b17
          speaker: bhaer
          text: 也有人想喝威士忌，可你和我都不会愿意卖酒。那些体面人要是知道自己害了多少人，就不会觉得这碗饭吃得清白。他们无权把毒药藏进糖果，再拿给孩子吃。他们该仔细想一想。哪怕去街上扫泥，也比做这种事强。
          emotion: angry
        - id: ch03-b18
          speaker: narrator
          text: 巴尔先生越说越激动，揉皱报纸，走到炉火旁。乔静静坐着，脸上像是也烧起了火。纸帽化成烟，升进烟囱，她的脸颊却还烫着。
        - id: ch03-b19
          speaker: bhaer
          text: 真想把剩下那些报纸也全送进火里。
        - id: ch03-b20
          speaker: narrator
          text: 教授走回来，像是卸下了重担。乔却想到楼上那一摞报纸，也想到辛苦挣来的钱。那笔钱忽然沉甸甸地压在她的良心上。她安慰自己，那些故事只是愚蠢，并不邪恶，然后摆出用功的模样，拿起了书。
        - id: ch03-b21
          speaker: jo
          text: 先生，我们接着上课吧？这回我一定规规矩矩，认真学习。
        - id: ch03-b22
          speaker: bhaer
          text: 我希望你会这样。
        - id: ch03-b23
          speaker: narrator
          text: 他只说了这一句，意思却比乔明白的更多。他严肃又和善地看着她，让乔觉得《火山周刊》几个大字已经印在自己额头上。
        - id: ch03-b24
          speaker: narrator
          text: 一回房间，乔就把刊着自己作品的报纸全找出来，一篇篇认真重读。巴尔先生有点近视，有时会戴眼镜。乔试戴过一次，看着书上细小的字突然放大，还觉得很好笑。如今她像是戴上了教授心灵和道德上的眼镜。原先被她忽略的毛病一下子全放大了，那些可怜的故事仿佛露出丑陋的面孔，狰狞地瞪着她，让她又惊又怕。
        - id: ch03-b25
          speaker: jo
          text: 全是垃圾。再写下去，只会一篇比一篇糟，一篇比一篇刺激。我为了钱闭着眼写，既伤害自己，也伤害别人。我认真读这些东西时，羞愧得简直受不了。要是家里人看见，或者让巴尔先生拿到，我该怎么办？
          emotion: fearful
        - id: ch03-b26
          speaker: narrator
          text: 光是想一想，乔就浑身发热。她再也忍不住，把整捆故事塞进炉子。三个月来写下的稿纸一起燃烧，火苗猛地蹿起来，差点连烟囱都点着。
        - id: ch03-b27
          speaker: jo
          text: 这种一点就着的胡说八道，最该待的地方就是火里。宁可烧掉房子，也不能让别人拿我的火药把自己炸飞。
        - id: ch03-b28
          speaker: narrator
          text: 她看着《汝拉山的恶魔》缩成一小片黑灰，闪着两点火红的眼睛，倏地飞走了。刚才烧纸时，她还觉得这样做痛快又正确。可等火焰熄下去，三个月的心血只剩一堆灰，稿费却还好好摆在膝头。乔的神色顿时严肃起来。她坐在地板上想了很久，不知道该怎样处置这笔凭那些故事换来的工钱。
        - id: ch03-b29
          speaker: jo
          text: 我想，还没造成太大的伤害。这些钱就留下吧，算是补偿我花掉的时间。可我真希望自己没有良心，它太碍事了。要是我不在乎对错，做错事也不会难受，日子一定好过得多。有时候，我真希望父亲母亲别把这些事看得那么认真。
        - id: ch03-b30
          speaker: narrator
          text: 唉，乔，你不该这样想。你该感谢上帝，父母把这些事看得认真。那些没有人这样守护的孩子，才真正值得怜惜。年轻时，原则仿佛是围住人的监狱高墙。长大以后，人却会发现，正是它们为品格打下了牢固的根基。
        - id: ch03-b31
          speaker: narrator
          text: 乔从此不再写惊险故事。她觉得，挣来的钱不值得自己承受那一场惊吓。可像她这种性情的人一样，她又一下走到另一个极端。她埋头读起舍伍德太太、埃奇沃思小姐和汉娜·莫尔，随后写出一个道德味极浓的故事。它与其说是故事，不如说是论文，甚至是一篇布道。乔从动笔时就怀疑它不会成功。她活泼的想象和少女情怀塞进这种文风，就像穿着上个世纪笨重僵硬的衣服去参加化装舞会，浑身都不自在。她把这颗说教的宝石寄到好几处，没有一家肯买。她不由得开始赞同达什伍德先生，看来，道德似乎真的卖不出去。
        - id: ch03-b32
          speaker: narrator
          text: 她又试着写儿童故事。原本不难卖掉，只可惜她贪图那肮脏的金钱，坚持要收稿费。唯一肯出足够价钱，让她觉得值得尝试儿童文学的，是一位自认肩负使命的先生。他想叫全世界都皈依他那一门信仰。乔喜欢为孩子写作，却不肯把所有淘气男孩都写成被熊吃掉、被疯牛顶飞，只因为他们没去某一家主日学校。她也不肯让所有去过的好孩子享尽奖赏，从镀金姜饼一直到临终时念着圣歌和布道，再由天使一路护送离开人世。这一套实在不是她愿意写的，儿童故事的尝试也就失败了。
        - id: ch03-b33
          speaker: jo
          text: 我什么都不懂。等我真正懂了，再重新开始吧。这段日子里，要是做不了更好的事，我就上街扫泥。至少那是清白的。
        - id: ch03-b34
          speaker: narrator
          text: 乔塞上墨水瓶，难得谦卑起来。第二次从豆茎上跌下来，毕竟让她学到了一点东西。
    - id: ch04
      title: 值得珍惜的朋友
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 乔心里经历着这些翻天覆地的变化，外面的日子却照旧忙碌而平静。她偶尔显得严肃，偶尔有些忧伤，别人全没看出来，只有巴尔教授注意到了。他悄悄观察，看乔会不会接受那番劝诫，又能不能从中获益。乔从不知道这件事，可她经受住了考验，教授也很满意。两人一句也没谈过，他却看见乔右手中指不再沾墨，晚上也开始留在楼下，不再出没于报馆之间。她带着倔强的耐心用功，显然宁可让头脑忙在有益而无趣的事上，也不愿再走回原来的路。
        - id: ch04-b02
          speaker: narrator
          text: 教授用许多方式帮助她，从不张扬，也不要求她承认什么。他用行动证明自己是真正的朋友。乔很快乐。她的笔虽然闲了下来，却学到了德语之外的功课。那些关于诚实、勇气和人格的功课，正悄悄为她自己一生的惊险故事打下根基。那会是一篇比她卖给《火山周刊》的故事更真实，也更值得写的作品。
        - id: ch04-b03
          speaker: narrator
          text: 那个冬天过得愉快，也显得格外漫长。乔一直住到六月，才要离开柯克太太家。分别的日子终于到了，屋里人人都舍不得她。孩子们伤心得怎么哄也哄不好。巴尔先生每逢心烦，总会不管不顾地乱揉自己的头发。这一回，他心里的不安全写在头顶，那些头发东一簇西一簇，全都直竖起来。
        - id: ch04-b04
          speaker: bhaer
          text: 你要回家了？啊，你真幸福，还有一个家可以回去。
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: 告别前的那个晚上，乔身边围着一小群来辞行的人。教授却独自坐在角落里，沉默地揪着胡子。乔第二天很早就走，于是当晚向大家一一道别。轮到巴尔先生时，她说得格外热情。
        - id: ch04-b06
          speaker: jo
          text: 先生，将来要是经过我们那里，您可不能忘了来看我们。您要是不来，我永远也不原谅您。我想让家里每个人都认识我的朋友。
        - id: ch04-b07
          speaker: bhaer
          text: 你真的希望我去？我可以来吗？
        - id: ch04-b08
          speaker: narrator
          text: 他低头望着乔，神情很热切，可乔没有看见。
        - id: ch04-b09
          speaker: jo
          text: 当然可以。下个月来吧。劳里那时毕业，毕业典礼对您来说也很新鲜，您一定会喜欢。
        - id: ch04-b10
          speaker: bhaer
          text: 你说的是那位最好的朋友吗？
        - id: ch04-b11
          speaker: narrator
          text: 他的声音变了。
        - id: ch04-b12
          speaker: jo
          text: 是呀，我的特迪。我为他骄傲极了，也很想让您见见他。
        - id: ch04-b13
          speaker: narrator
          text: 乔这才抬头。她一心只为能让两人认识而高兴，根本没想别的。可教授脸上的某种神情突然提醒她，他也许以为劳里不只是她最好的朋友。她越想显得若无其事，脸反而越红。幸好蒂娜坐在她膝上，又忽然抱住她，她才把脸藏了一会儿。乔希望教授没看见，可他看得清清楚楚。方才的焦虑从他脸上消失，他又恢复了平常的神情。
        - id: ch04-b14
          speaker: bhaer
          text: 恐怕我抽不出时间去。不过我祝那位朋友一切顺利，也祝你们大家幸福。上帝保佑你！
          emotion: sad
        - id: ch04-b15
          speaker: narrator
          text: 他热烈地握了握乔的手，把蒂娜扛到肩上，走了。两个男孩睡下以后，教授却在炉火前坐了很久，脸上满是疲倦。那种德国人称为“海姆韦”的乡愁，沉沉压在他心头。他想起乔膝上坐着孩子的模样，也想起她脸上那种从未见过的温柔，便把头埋进双手，停了好一会儿。随后他又在屋里来回走，像在寻找一件自己怎么也找不到的东西。
        - id: ch04-b16
          speaker: bhaer
          text: 那不是属于我的。我不该再抱希望。
          emotion: sad
        - id: ch04-b17
          speaker: narrator
          text: 他的叹息几乎成了呻吟。随后，他像是在责备自己压不住这份渴望，走过去亲了亲枕上两颗乱蓬蓬的小脑袋，取下很少使用的海泡石烟斗，又打开柏拉图。他已经竭尽所能，也承受得很勇敢。可两个横冲直撞的男孩、一支烟斗，甚至神圣的柏拉图，恐怕都不能真正代替家里的妻子和孩子。
        - id: ch04-b18
          speaker: narrator
          text: 第二天一早，天色还很早，巴尔先生却已经赶到车站给乔送行。教授的出现，让这场孤身远行有了一个温暖的开头。乔就这样独自踏上了回家的旅途。离开寄宿屋时的惆怅并没有跟她太久，因为一路上，她都记得一张熟悉的面孔怎样含笑向她告别，手里还有教授送的一束紫罗兰陪伴。这一路，她心里并不寂寞。比这份记忆和这束花更好的是，她心里一直装着一个快乐的念头。
        - id: ch04-b19
          speaker: jo
          text: 冬天已经过去了。我没有写出一本书，也没有挣到一笔财富，可我交到了一个值得珍惜的朋友。我要努力，一辈子都不失去他。
