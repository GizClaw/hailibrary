audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "warm, observant, and gently playful", timbre: "clear and inviting", pace: measured, pitch: medium}
    jo:
      display_name: Jo
      tts: {delivery: "quick, candid, and spirited", timbre: "bright and slightly husky", pace: lively, pitch: medium-low}
    mr_dashwood:
      display_name: Mr. Dashwood
      tts: {delivery: "brisk, dry, and casually dismissive", timbre: "smoky and flat", pace: measured, pitch: medium-low}
    professor_bhaer:
      display_name: Professor Bhaer
      tts: {delivery: "earnest, warm, and gently accented", timbre: "deep and resonant", pace: unhurried, pitch: low}
  chapters:
    - id: ch01
      title: Friend
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jo was very happy among the people around her. She was also busy with daily work that earned her bread, and the effort made that bread taste sweeter. Still, she always found time for writing. Her new ambition was natural enough for a poor girl with big hopes, though the path she chose was not the best one. Jo saw that money brought power, so she resolved to gain both. She did not want them only for herself. She loved her family more than life. For years, her favorite castle in the air had been a home filled with comforts. Beth would have everything she wanted, from strawberries in winter to an organ in her bedroom. Jo herself would travel abroad. Best of all, there would always be more than enough, so she could enjoy the luxury of helping anyone in need.
        - id: ch01-b02
          speaker: narrator
          text: Winning a prize for a story had seemed to open a road toward that dream. It might be a long road, with plenty of uphill travel, but perhaps it ended at her beautiful imaginary castle. Then the failure of her novel destroyed her courage for a while. Public opinion is a giant that has frightened stronger Jacks on taller beanstalks than Jo's. Like Jack, she rested after her first climb ended in a tumble and a very unpleasant prize. But the spirit that says, get up and try again, was strong in her. Soon she scrambled back up, choosing the shady side of the beanstalk this time. She carried away more money, but she nearly left behind something worth far more than any bag of gold.
        - id: ch01-b03
          speaker: narrator
          text: Jo began writing sensation stories. In those days, even supposedly perfect America enjoyed reading rubbish. She told no one what she was doing. After secretly inventing one thrilling tale, she decided to deliver it herself to Mr. Dashwood, editor of the Weekly Volcano. Jo understood that fine clothes often impressed people more than good character or charming manners, so she dressed in her best. She tried hard to believe that she was neither excited nor nervous. Then she climbed two flights of dark, dirty stairs. At the top she found a disorderly room full of cigar smoke. Three gentlemen sat inside with their heels propped higher than their hats. Not one of them bothered to remove his hat when Jo appeared. That welcome shook her courage. She paused in the doorway and spoke in great embarrassment.
        - id: ch01-b04
          speaker: jo
          text: Excuse me. I was looking for the Weekly Volcano office. I'd like to see Mr. Dashwood.
        - id: ch01-b05
          speaker: narrator
          text: The highest pair of heels came down. The smokiest gentleman rose, keeping his cigar between his fingers, and approached with a sleepy nod. Jo knew she had to finish what she had started. She brought out her manuscript, and every broken phrase made her blush more deeply.
        - id: ch01-b06
          speaker: jo
          text: A friend asked me to bring you a story, just as an experiment. She'd like your opinion, and she'd be glad to write more if this one suits you.
        - id: ch01-b07
          speaker: narrator
          text: Mr. Dashwood turned the neat pages with rather dirty fingers. They were numbered, written on only one side, and not tied with ribbon, so he knew the writer was no beginner.
        - id: ch01-b08
          speaker: mr_dashwood
          text: This isn't her first attempt, I suppose?
        - id: ch01-b09
          speaker: jo
          text: No, sir. She has some experience. She even won a prize for a story in the Blarneystone Banner.
        - id: ch01-b10
          speaker: narrator
          text: He looked Jo over from the bow on her bonnet to the buttons on her boots.
        - id: ch01-b11
          speaker: mr_dashwood
          text: Oh, did she? Leave it if you like. We already have more of this kind than we can use, but I'll look it over and answer next week.
        - id: ch01-b12
          speaker: narrator
          text: Jo did not like Mr. Dashwood at all, and she hated leaving her precious work with him. Under the circumstances, however, there was nothing else to do. She bowed and walked out looking especially tall and dignified, as she always did when embarrassed or annoyed. At that moment she was both. The men traded knowing looks. They had plainly guessed who this imaginary friend was and found the little deception amusing. As Mr. Dashwood closed the door, an unheard remark from him produced a laugh from the others and completed Jo's humiliation. She went home half determined never to return. There she attacked a pile of pinafores, driving her needle through them until the work had carried off her irritation. Within an hour or two, she was calm enough to laugh at the whole scene. Then curiosity took over, and she began longing for next week.
        - id: ch01-b13
          speaker: narrator
          text: When she returned, Mr. Dashwood was alone, awake, and willing to remember his manners. The second meeting began much better.
        - id: ch01-b14
          speaker: mr_dashwood
          text: We'll take the story if your friend accepts a few changes. It's too long. Cut the parts I've marked, and it will fit.
        - id: ch01-b15
          speaker: narrator
          text: The pages had been crumpled, underlined, and marked so heavily that Jo hardly recognized her own manuscript. She felt the tender concern of a parent being asked to cut off her baby's legs so the child would fit inside a new cradle. She studied the passages selected for removal. To her surprise, Mr. Dashwood had crossed out every moral reflection. Jo had carefully added those lessons as ballast to steady all the romance, and now he wanted every one thrown overboard.
        - id: ch01-b16
          speaker: jo
          text: But, sir, I thought a story ought to have some kind of moral. I made sure a few of my sinners repented.
        - id: ch01-b17
          speaker: narrator
          text: Mr. Dashwood smiled. Jo had forgotten her friend and spoken like the author herself.
        - id: ch01-b18
          speaker: mr_dashwood
          text: Readers want amusement, not a sermon. Morals don't sell now.
        - id: ch01-b19
          speaker: jo
          text: Then you think it will work with those changes?
        - id: ch01-b20
          speaker: mr_dashwood
          text: Yes. The plot is new, it's handled well enough, and the language is good.
        - id: ch01-b21
          speaker: jo
          text: And what would you... I mean, how much would you pay?
        - id: ch01-b22
          speaker: mr_dashwood
          text: Oh, yes. We pay twenty-five to thirty dollars for this sort of thing, once it appears.
        - id: ch01-b23
          speaker: narrator
          text: He spoke as if payment had nearly slipped his mind. After earning a dollar a column, even twenty-five dollars sounded splendid to Jo.
        - id: ch01-b24
          speaker: jo
          text: Very well. You may have it. Should I tell my friend you'll consider another story if she writes a better one?
        - id: ch01-b25
          speaker: narrator
          text: Success had made her bold, and she did not notice that she had given herself away again.
        - id: ch01-b26
          speaker: mr_dashwood
          text: We'll look at it, but I promise nothing. Tell her to keep it short and spicy and forget the moral. What name does she want printed on this one?
        - id: ch01-b27
          speaker: jo
          text: No name, please. She doesn't want it known, and she has no pen name.
        - id: ch01-b28
          speaker: mr_dashwood
          text: As she likes. It will appear next week. Will you collect the money, or shall I send it?
        - id: ch01-b29
          speaker: jo
          text: I'll come for it. Good morning, sir.
        - id: ch01-b30
          speaker: narrator
          text: Once she was gone, Mr. Dashwood put his feet up again.
        - id: ch01-b31
          speaker: mr_dashwood
          text: Poor and proud, as usual. But she'll do.
        - id: ch01-b32
          speaker: narrator
          text: Jo followed his directions and used Mrs. Northbury as her model. Into the foamy sea of sensation stories she plunged. Like many young writers, she borrowed her characters and scenery from foreign countries. Bandits, counts, gypsies, nuns, and duchesses crowded her pages and played their parts as accurately and energetically as anyone could expect. Her readers did not trouble much about small matters like grammar, punctuation, or probability. Mr. Dashwood graciously let her fill his columns at the lowest price. He never thought it necessary to explain his generosity. One of his regular writers had been offered better wages and had abandoned him, so he needed someone to fill the empty space.
        - id: ch01-b33
          speaker: narrator
          text: Jo soon grew absorbed in the work. Her thin purse began to grow stout, and week by week the little store of money for taking Beth to the mountains next summer increased, slowly but surely. Only one thing disturbed Jo's satisfaction. She had told no one at home. Somewhere inside, she felt that Father and Mother would not approve. She preferred to have her own way first and ask forgiveness afterward. Keeping the secret was easy because no name appeared on her stories. Mr. Dashwood had naturally discovered it very soon, but he promised to say nothing. For once, rather surprisingly, he kept his word.
        - id: ch01-b34
          speaker: narrator
          text: Jo sincerely meant to write nothing shameful, so she told herself the work could do her no harm. Whenever conscience pricked, she imagined the happy moment when she would show everyone her earnings and they would all laugh over her well-kept secret. But Mr. Dashwood rejected everything except thrilling tales, and thrilling readers meant stirring up their deepest fears. Jo ransacked every possible place for material. She searched history and romance, land and sea, science and art, police reports, and accounts of asylums. She read newspapers for accidents, strange incidents, and crimes. She made public librarians suspicious by asking for books about poison. She studied faces in the street and examined every kind of character around her, good, bad, and ordinary.
        - id: ch01-b35
          speaker: narrator
          text: Jo's own innocent life had shown her very little of the tragedy hidden beneath society. She treated that ignorance like a professional weakness and worked hard to correct it. She wanted original plots, even if she could not yet write them masterfully. Old facts and ancient inventions seemed fresh enough once everyone had forgotten them. Within the narrow limits of her opportunities, she introduced herself to foolishness, sin, and misery. Jo thought she was doing wonderfully. She did not see what this imaginary bad company was doing to her. It fed her heart and imagination on dangerous, empty things and rubbed away some of her innocence by bringing her too early into the darker side of life. That knowledge comes soon enough to everyone. She began to feel the harm before she understood it. Writing so much about other people's passions led her to study and brood over her own, an unhealthy pastime for a healthy young mind. Wrongdoing always brings its own punishment. When Jo most needed hers, it came.
        - id: ch01-b36
          speaker: narrator
          text: Perhaps Shakespeare had taught Jo to read character, or perhaps her own instincts recognized honesty, courage, and strength. At the same time she was inventing perfect heroes, she began to discover a living one who interested her in spite of his ordinary faults. Professor Bhaer had once advised her to observe simple, true, and lovely characters wherever she found them. That would be excellent training for a writer, he said. Jo took him literally. She turned around and quietly made the Professor himself her subject. He would have been astonished if he had known, for he had a very humble opinion of himself.
        - id: ch01-b37
          speaker: narrator
          text: At first, Jo could not understand why everyone liked him. He was not rich, important, young, handsome, brilliant, or impressive. Yet he drew people as naturally as a warm fire gathers a circle around it. Though poor, he was always giving something away. Though a stranger, he made friends everywhere. He was no longer young, but his heart was as happy as a boy's. His plain face became beautiful to those who knew him, and affection made his odd ways easy to forgive.
        - id: ch01-b38
          speaker: narrator
          text: Jo watched until she found the answer. It was his kindness. If he carried sorrow, he hid it and showed the world his sunny side. The lines on his forehead seemed gently made. The curves around his mouth told of friendly words and cheerful laughter. His eyes were never cold, and his large hand gave a warm, strong clasp. Even his clothes looked hospitable. His roomy vest suggested a large heart. His worn coat seemed sociable, and children's hands often went empty into its loose pockets and came out full. Even his boots looked benevolent, and his collars were never stiff and scratchy.
        - id: ch01-b39
          speaker: jo
          text: That's it! Real goodwill can make even a stout German teacher look noble, though he eats fast, mends his own socks, and has to carry the name Bhaer.
        - id: ch01-b40
          speaker: narrator
          text: Jo admired goodness, but she respected intelligence too. A visitor from the Professor's own country once revealed something he had never mentioned himself. During a conversation with Miss Norton, the man explained that Bhaer had been greatly honored in Berlin for both his learning and his integrity. Miss Norton passed the discovery to Jo. Here in America he was only a poor language teacher, but in his native city he had been an esteemed professor. Jo felt proud of him. She liked the news even better because Bhaer himself had never told anyone. That touch of romance brightened his plain, hardworking life for her.
        - id: ch01-b41
          speaker: narrator
          text: Then Jo saw a greater gift than learning. Miss Norton moved in circles Jo could never enter alone, and she kindly took Jo and the Professor to an evening gathering for famous people. Jo arrived ready to worship the great minds she had admired from far away. Before long, she discovered that these great creatures were ordinary men and women after all.
        - id: ch01-b42
          speaker: narrator
          text: The poet's verses made him sound like some heavenly creature who lived on spirit, fire, and dew. Jo stole a timid, admiring glance at him and found him attacking his supper so fiercely that his intellectual face turned red. She turned from that fallen idol only to meet more surprises. The great novelist swung between two decanters as regularly as a pendulum. A famous minister flirted openly with one celebrated lady, who glared at another. That second lady sweetly made fun of her rival after outmaneuvering her for the attention of a deep philosopher. The philosopher drank tea in a grand manner and appeared to fall asleep because the lady beside him made speech impossible. Scientists forgot shells and ancient glaciers, gossiped about art, and devoted themselves to oysters and ice cream. A young musician who enchanted the city like another Orpheus talked about horses. The British nobleman was the most ordinary person there.
        - id: ch01-b43
          speaker: narrator
          text: By the middle of the evening, Jo's romantic picture of genius had fallen to pieces. She retreated to a corner, and Professor Bhaer soon joined her. Then several philosophers gathered nearby for an intellectual contest. Jo understood almost nothing about Kant, Hegel, the Subjective, or the Objective, but she listened eagerly. Her only clear result was a bad headache.
        - id: ch01-b44
          speaker: narrator
          text: The discussion sailed miles over Jo's head, though she still enjoyed trying to follow it. Kant and Hegel were unknown gods to her. The Subjective and the Objective meant nothing at all, and the only thing her inner consciousness produced by the end was a bad headache. Little by little, she understood the larger idea. These men were taking the world apart and rebuilding it on principles they considered infinitely better. Religion was being reasoned almost out of existence, and intellect was to become the only God. Jo knew no philosophy or metaphysics, yet the talk created a strange excitement in her, half pleasant and half painful. Their freedom fascinated her, but it also made her feel cut loose in time and space, like a young balloon drifting away on a holiday.
        - id: ch01-b45
          speaker: narrator
          text: She looked toward the Professor. He wore the grimmest expression she had ever seen. He shook his head and motioned for her to leave, but she stayed. She wanted to know what these wise men would trust after they had destroyed all the old beliefs.
        - id: ch01-b46
          speaker: narrator
          text: Professor Bhaer was shy and slow to offer his opinions. That was not because they were uncertain. He was too sincere and earnest to speak lightly about what mattered most. He looked from Jo to the other young listeners, all drawn toward the glittering display of ideas. His brows drew together. He wanted to speak, because he feared those philosophical fireworks might lead an eager and easily kindled young soul astray. When the rockets had flashed and vanished, that listener might discover there was nothing left but an empty stick or a scorched hand.
        - id: ch01-b47
          speaker: narrator
          text: He endured the talk as long as he could. At last, someone directly asked what he thought, and honest anger set him ablaze. He defended religion with all the eloquence of truth. Feeling made his broken English sound musical and transformed his plain face. It was a hard fight, because the wise men argued skillfully. Professor Bhaer did not know when he was beaten, however, and he stood by his beliefs like a man. As Jo listened, the world settled into place again. The old beliefs that had lasted so long seemed better than the new ones. God was not a blind force. Immortality was not a pretty story but a blessed fact. Solid ground seemed to return beneath her feet. When the Professor finally stopped, outtalked but not persuaded in the least, Jo wanted to applaud and thank him.
        - id: ch01-b48
          speaker: narrator
          text: Jo did neither, but she never forgot the scene. From that night on, she gave the Professor her heartiest respect. She knew how hard it had been for him to speak before them all. He had done it only because conscience would not allow him to stay silent. Jo began to understand that character was a finer possession than money, rank, intelligence, or beauty. A wise man had defined greatness as truth, reverence, and goodwill. By that measure, her friend Friedrich Bhaer was not merely good. He was great.
        - id: ch01-b49
          speaker: narrator
          text: That belief grew stronger each day. Jo valued his good opinion and wanted to deserve his friendship. Just when she wanted it most, she nearly lost it, all because of a paper soldier's hat. One evening the Professor came to give her a lesson with the little hat still on his head. Tina had put it there, and he had forgotten it.
        - id: ch01-b50
          speaker: jo
          text: He certainly doesn't look in the mirror before he comes downstairs.
        - id: ch01-b51
          speaker: narrator
          text: She smiled while he greeted her and sat down solemnly to read The Death of Wallenstein, completely unaware of the ridiculous contrast between his serious subject and the paper hat above it. Jo said nothing at first. She loved the great, hearty laugh he gave whenever something amused him, so she decided to let him discover the joke himself. Before long, she forgot it too. Hearing a German read Schiller was absorbing work. The reading ended and the lesson began. Jo was in a playful mood that evening, and every new glimpse of the cocked hat sent laughter dancing through her eyes. Professor Bhaer could not understand her behavior. At last he stopped and questioned her with such mild surprise that it was almost impossible to resist.
        - id: ch01-b52
          speaker: professor_bhaer
          text: Miss March, why do you laugh in your teacher's face? Have you no respect for me tonight?
        - id: ch01-b53
          speaker: jo
          text: How can I be respectful, sir, when you forgot to take off your hat?
        - id: ch01-b54
          speaker: narrator
          text: He felt his head, removed the tiny hat, studied it for a moment, and laughed like a merry bass viol.
        - id: ch01-b55
          speaker: professor_bhaer
          text: Ah, now I see! That little imp Tina has made me foolish with her cap. Never mind. But if your lesson goes badly, you must wear it next.
        - id: ch01-b56
          speaker: narrator
          text: The lesson stopped anyway. Professor Bhaer noticed a picture on the paper hat and unfolded it with disgust.
        - id: ch01-b57
          speaker: professor_bhaer
          text: I wish these papers did not come into the house. Children should not see them, and young people should not read them. They do harm, and I have no patience with the people who make them.
          emotion: disgusted
        - id: ch01-b58
          speaker: narrator
          text: Jo glanced at the sheet. Its charming picture contained a madman, a corpse, a villain, and a snake. She disliked it, but disgust was not what made her turn it over. Fear did. For one frightened moment, she thought the paper was the Volcano. It was not, and her panic faded. Even if it had been the Volcano and had contained one of her own tales, no printed name could have betrayed her. Yet Jo had betrayed herself already. The quick look and sudden blush told their own story. Absent-minded as Professor Bhaer could be, he noticed far more than people guessed.
        - id: ch01-b59
          speaker: narrator
          text: He knew Jo wrote and had seen her near newspaper offices more than once. Because she never mentioned her work, he had asked no questions, though he very much wanted to read it. Now he feared she was doing something she felt ashamed to admit, and the thought troubled him. Many people would have told themselves that it was none of their business and they had no right to interfere. Professor Bhaer did not. He remembered that Jo was young and poor, living far away from her mother's love and her father's care. The wish to help her came as quickly and naturally as reaching out to keep a baby from stepping into a puddle. All those thoughts passed through his mind in a moment, but none showed on his face. By the time Jo turned the paper over and threaded her needle, he was ready to speak naturally, though very seriously.
        - id: ch01-b60
          speaker: professor_bhaer
          text: Yes, you are right to turn it away. These things may be made attractive, but good young people should not see them. I would sooner give my boys gunpowder to play with than give them this trash.
        - id: ch01-b61
          speaker: narrator
          text: Jo dragged her pin so fiercely through the gathers that it left a row of little slits.
        - id: ch01-b62
          speaker: jo
          text: Perhaps it isn't all bad. Some of it is only silly. If people want such stories, I don't see the harm in writing them. Many respectable people make an honest living from sensation stories.
        - id: ch01-b63
          speaker: professor_bhaer
          text: People want whiskey too, but you and I would not sell it. If respectable writers understood the harm, they would not call that living honest. They have no right to hide poison inside a sugarplum and let children eat it. Better to think, and sweep mud from the street, than do such work.
          emotion: angry
        - id: ch01-b64
          speaker: narrator
          text: He walked to the fire, crushing the paper in his hands. Jo sat as if the flames had reached her cheeks. They were still burning after the hat turned to smoke and vanished up the chimney.
        - id: ch01-b65
          speaker: professor_bhaer
          text: I would gladly send all the other papers after it.
        - id: ch01-b66
          speaker: narrator
          text: Jo pictured the blaze her own pile would make. Her hard-earned money suddenly weighed on her conscience. Then she tried to comfort herself. Her stories were only foolish, not wicked. She picked up her book and put on a studious face.
        - id: ch01-b67
          speaker: jo
          text: Shall we continue, sir? I'll be very good and proper now.
        - id: ch01-b68
          speaker: professor_bhaer
          text: I hope you will.
        - id: ch01-b69
          speaker: narrator
          text: His grave, kind look said more than the words. Jo felt as though Weekly Volcano were printed across her forehead in letters anyone could see.
        - id: ch01-b70
          speaker: narrator
          text: In her room, Jo took out every story and read it carefully. Professor Bhaer sometimes wore eyeglasses, and once Jo had laughed at how they enlarged the print in her book. Now she seemed to be looking through his moral spectacles. Every fault in her stories grew enormous, and she was appalled.
        - id: ch01-b71
          speaker: jo
          text: They're trash, and they'll only get worse. Every story is more sensational than the one before it. I've gone on blindly, hurting myself and other people for money. I know it, because I can't read this seriously without feeling ashamed. What would I do if my family saw these, or if Mr. Bhaer found them?
          emotion: disgusted
        - id: ch01-b72
          speaker: narrator
          text: The thought of either discovery made her hot with shame. There was no more hesitation. She gathered up the whole bundle, pushed every story into the stove, and set them alight. The pages flared so fiercely that she nearly set the chimney on fire with them.
        - id: ch01-b73
          speaker: jo
          text: Yes, that's where such fiery nonsense belongs. Better to burn the house down than let other people blow themselves up with my gunpowder.
        - id: ch01-b74
          speaker: narrator
          text: She watched The Demon of the Jura whirl away as a small black cinder with fiery eyes. Three months of work became a heap of ashes, while the money remained in her lap. Jo sat soberly on the floor and wondered what to do with her wages.
        - id: ch01-b75
          speaker: jo
          text: I don't think I've done much harm yet, so perhaps I can keep this as payment for my time. I almost wish I had no conscience. It's terribly inconvenient. If I didn't care about right and wrong, I could get along beautifully. Sometimes I wish Mother and Father hadn't been so particular about such things.
        - id: ch01-b76
          speaker: narrator
          text: But Jo had reason to be grateful that Father and Mother had been particular. She should pity anyone who grew up without such guardians. The principles built around a young person may feel like prison walls when youth is impatient and eager to escape. In womanhood, those same principles become firm foundations on which a strong character can safely stand.
        - id: ch01-b77
          speaker: narrator
          text: Jo wrote no more sensation stories. She decided the money did not pay for her own share of the sensation. Then, as people of her kind often do, she rushed all the way to the opposite extreme. She took a heavy course of Mrs. Sherwood, Miss Edgeworth, and Hannah More. After that treatment, she produced a tale so fiercely moral that it deserved to be called an essay or a sermon. Jo had doubted it from the beginning. Her lively imagination and girlish romance felt trapped in the new style, as uncomfortable as Jo herself would have been dressed in the stiff, heavy costume of the last century. She sent this instructive jewel from publisher to publisher, but no one would buy it. At last, Jo felt almost ready to agree with Mr. Dashwood that morals did not sell.
        - id: ch01-b78
          speaker: narrator
          text: Next she tried a children's story. She could have found a home for it easily if she had not been greedy enough to expect actual money. The only man who offered enough believed it was his mission to convert the whole world to his own particular beliefs. Jo liked writing for children, but she would not follow his rules. She refused to have every naughty boy eaten by bears or tossed by mad bulls merely because he failed to attend one particular Sunday school. She also refused to reward every good little child who did attend with every kind of delight, from golden gingerbread while alive to an escort of angels after dying with psalms or sermons on lisping lips. So that attempt went nowhere either. Jo corked her ink bottle and accepted a useful dose of humility.
        - id: ch01-b79
          speaker: jo
          text: I don't know enough yet. I'll wait until I do before I try again. Meanwhile, if I can't do anything better, I can sweep mud from the street. At least that's honest.
        - id: ch01-b80
          speaker: narrator
          text: Her second fall from the beanstalk had taught her something. While this great change was taking place inside Jo, her outward life remained as busy and uneventful as usual. She sometimes looked serious or a little sad, but only Professor Bhaer noticed. He watched so gently that she never knew he was waiting to see whether she would accept his warning and learn from it. She passed the test, and he was satisfied, though neither of them said a word about it. Her right forefinger was no longer stained with ink. She spent her evenings downstairs now. He no longer met her near newspaper offices. She studied with a stubborn patience that showed she meant to fill her mind with something useful, even when the work was not pleasant.
        - id: ch01-b81
          speaker: narrator
          text: Professor Bhaer helped her in many quiet ways and proved himself a true friend. Jo was happy again. Her pen lay idle, but those quiet days were not wasted in the least. The change was inward and steady, where no one could measure it yet. Along with German, she was learning other and more important lessons about work, conscience, friendship, and the kind of person she hoped to become. Without knowing it, she was laying a foundation for the greatest sensation story she would ever know, the story of her own life.
        - id: ch01-b82
          speaker: narrator
          text: It was a pleasant winter, and a long one. Jo did not leave Mrs. Kirke until June. When the time finally came, everyone seemed sorry to lose her. The children were impossible to comfort. Professor Bhaer's hair stood straight up all over his head, because he always ran his hands through it wildly whenever his mind was disturbed.
        - id: ch01-b83
          speaker: professor_bhaer
          text: You are going home? Ah, you are fortunate to have a home waiting for you.
          emotion: sad
        - id: ch01-b84
          speaker: narrator
          text: After she told him the news, he sat silently in a corner and pulled at his beard. Around him, Jo held a little farewell gathering on her last evening. Her train would leave early in the morning, so she said goodbye to everyone the night before. At last the Professor's turn came, and Jo spoke to him with real warmth.
        - id: ch01-b85
          speaker: jo
          text: You won't forget to visit us if you ever travel our way, will you? I could never forgive you if you did. I want everyone at home to meet my friend.
        - id: ch01-b86
          speaker: professor_bhaer
          text: Do you? Would you truly like me to come?
        - id: ch01-b87
          speaker: narrator
          text: He looked down at her eagerly, but Jo did not notice.
        - id: ch01-b88
          speaker: jo
          text: Yes. Come next month. Laurie graduates then, and commencement would be something new for you to enjoy.
        - id: ch01-b89
          speaker: professor_bhaer
          text: Is this the best friend you have spoken about?
        - id: ch01-b90
          speaker: narrator
          text: His voice had changed.
        - id: ch01-b91
          speaker: jo
          text: Yes, my Teddy. I'm very proud of him, and I want you to meet him.
        - id: ch01-b92
          speaker: narrator
          text: Jo looked up, thinking only how much she would enjoy bringing her friends together. Then something in Professor Bhaer's face reminded her that he might suppose Laurie was more than a friend. She was especially determined not to look disturbed, so of course she began to blush. The harder she tried to stop, the redder she became. Luckily, Tina was sitting on her lap and chose that moment to hug her. Jo hid her face for an instant and hoped the Professor had seen nothing.
        - id: ch01-b93
          speaker: narrator
          text: He had seen. The brief anxiety in his face disappeared, and his usual expression returned.
        - id: ch01-b94
          speaker: professor_bhaer
          text: I fear I cannot make time for that. But I wish your friend great success, and I wish all of you happiness. God bless you.
          emotion: sad
        - id: ch01-b95
          speaker: narrator
          text: He shook her hand warmly, lifted Tina onto his shoulder, and left. Later, after the boys were in bed, he sat for a long time alone before the fire. His face looked tired. The German word for what weighed on him was heimweh, the deep ache of homesickness. He remembered Jo as she had looked with the little child in her lap and that new softness in her face. For a moment he lowered his head into his hands. Then he rose and wandered around the room as if searching for something he wanted very much but could not find.
        - id: ch01-b96
          speaker: professor_bhaer
          text: It is not meant for me. I must not hope for it now.
          emotion: sad
        - id: ch01-b97
          speaker: narrator
          text: The sigh that followed was almost a groan. Then he seemed to scold himself for a longing he could not suppress. He went to the sleeping boys, bent over them, and kissed the two tousled heads on their pillows. He took down the meerschaum pipe he seldom used and opened his Plato. He did his best and faced the feeling bravely, but it was no use. Two lively boys, a pipe, and even the divine Plato were not very satisfying substitutes for a wife and child in a home of his own.
        - id: ch01-b98
          speaker: narrator
          text: Early as the hour was, Professor Bhaer came to the station the next morning to see Jo off. Her journey home would be a lonely one, but his kindness gave it a warm beginning. As the train carried her away, she had the pleasant memory of a familiar face smiling farewell. She had a bunch of violets to keep her company, and, best of all, she carried one happy thought with her.
        - id: ch01-b99
          speaker: jo
          text: The winter is over. I haven't written a book or earned a fortune, but I've made a friend truly worth having, and I'll try to keep him all my life.
          emotion: happy
