  chapters:
    - id: ch01
      title: 第二十六章　艺术尝试
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 人往往要过很久，才分得清才华和天才，雄心勃勃的年轻人尤其如此。艾米正吃着苦头学这门功课。她把一时的热情当成灵感，仗着年轻胆大，把各样艺术都试了一遍。先是精细的钢笔画。她暂时不做那些“泥饼”了，把全部心思都用在纸上。她画得有品位，也有技巧，作品既悦目，又能赚一点钱。可眼睛累坏以后，她放下纸笔，拿起烧红的火钳做烙画。那阵子，全家人总怕一不留神房子就会烧起来。屋里整天飘着木头烧焦的味道，阁楼和棚屋动不动就冒烟，通红的火钳随处乱放。汉娜每晚睡觉，都要把一桶水和吃饭铃摆在门边，随时准备救火。
        - id: ch01-b02
          speaker: narrator
          text: 擀面板底下出现了笔触豪放的拉斐尔，啤酒桶顶上画着酒神巴克斯。糖桶盖上有个唱圣歌的小天使，画坏的罗密欧和朱丽叶则成了家里好一阵子的引火柴。手指给火烫过，艾米很自然地从火转向了油，兴头一点也没减少。画家朋友把不用的调色板、画笔和颜料送给她，她立刻涂出陆地和海上从没出现过的田园画与海景。那些怪牛去参加农业展览，准能得奖。她的船颠簸得能让最老练的水手晕船，只是船身和帆索全不合规矩，谁第一眼看见都会先笑出声，也就顾不上晕了。
        - id: ch01-b03
          speaker: narrator
          text: 画室角落里，黑黝黝的男孩和黑眼睛的圣母瞪着人，这是穆里罗。油腻的棕色脸孔上，一道惨亮的光偏偏落错地方，这是伦勃朗。丰腴女人和浮肿婴儿代表鲁本斯。透纳呢，就藏在蓝雷、橙色闪电、棕雨和紫云组成的风暴里。画面正中那团番茄红，可以是太阳、浮标、水手的衬衫，也可以是国王的长袍，全看观画的人乐意怎么猜。
        - id: ch01-b04
          speaker: narrator
          text: 油画之后是炭笔肖像。全家人的脸排成一列，又黑又野，像刚从煤箱里叫出来。换成色粉笔以后好多了，模样都很像。大家尤其称赞艾米的头发、乔的鼻子、梅格的嘴和劳里的眼睛，认定这几处“精彩极了”。接着她又摆弄黏土和石膏。熟人们惨白的石膏像占满墙角，像幽灵似的守在那里，有时还会从壁橱架上滚下来砸中谁的脑袋。她哄孩子来做模特，孩子们回家又说不清她究竟干了什么，附近的人便渐渐把艾米小姐想成一只年轻的吃人女妖。
        - id: ch01-b05
          speaker: narrator
          text: 最后，一场意外把这门艺术突然结束了。找不到模特时，艾米决定翻制自己那只漂亮的脚。一天，棚屋里传出可怕的撞击和尖叫。家人冲进去，只见这位艺术迷正用一只脚到处跳，另一只脚牢牢凝在一盆石膏里。大家费了许多力气，冒着风险，才把她挖出来。乔动刀时笑得浑身没劲，一不小心割伤了那只可怜的脚。至少，这次艺术尝试留下了一道长久的纪念。
        - id: ch01-b06
          speaker: narrator
          text: 艾米安静了一阵，又迷上了野外写生。她在河边、田野和树林里到处寻找如画的景物，还常叹息附近连一处可临摹的废墟都没有。她坐在湿草上，画一块石头、一个树桩、一朵蘑菇和一截断掉的毛蕊花梗，管它叫“一处绝妙小景”，自己却一次次着凉。她画的“一片神圣云海”，完成后更像精挑细选的羽毛床展览。盛夏里，她漂在河上研究光影，为此牺牲了自己的好肤色。为了琢磨所谓“视点”，或者那套眯眼拉线的把戏到底叫什么，她连鼻梁上都挤出一道皱纹。
        - id: ch01-b07
          speaker: narrator
          text: 米开朗琪罗说，天才就是永恒的耐心。照这个说法，艾米倒真有一点天才。不管遭遇障碍、失败还是打击，她始终不肯停下，相信自己总有一天会做出配得上“高雅艺术”这个名字的作品。
        - id: ch01-b08
          speaker: narrator
          text: 同时，她也没有放下别的学习、尝试和乐趣。即使做不成大艺术家，她还要做个讨人喜欢、样样拿得出手的女人。这件事，她做得更成功。有些人仿佛生来就受命运偏爱，不费力就能讨人喜欢，到哪里都交得到朋友，日子也过得轻松漂亮。那些没这么幸运的人看在眼里，简直要相信他们真是生在幸运星下。艾米就是这样。人人都喜欢她。她天生懂得分寸，对什么人该说什么话，在什么场合该做什么事，心里总有数，而且从不慌张。
        - id: ch01-b09
          speaker: narrator
          text: 她知道什么话能讨人喜欢，什么举止才合宜。姐姐们常说，就算艾米毫无准备地进宫觐见，她也知道该怎么做。不过，她也有弱点。她想进入“最上等的社交圈”，却还弄不懂什么才是真正的上等。她看重金钱、地位、时髦才艺和优雅举止，爱结交拥有这些的人，因此也会把虚假当真诚，去赞赏并不值得赞赏的东西。她从没忘记，自己生在有教养的人家，便刻意培养贵族情趣，只等机会到来，好回到那个眼下被贫穷挡在门外的位置。
        - id: ch01-b10
          speaker: narrator
          text: 朋友们都叫她“大小姐”。她真心想做一位真正的淑女，而她的心地也的确配得上这个称呼。只是她还得慢慢明白，金钱买不来天性里的雅致，社会地位也未必带来真正的高贵。一个人若有真正的教养，不管外在有多少不利和缺憾，旁人终究会感觉得到。
        - id: ch01-b11
          speaker: amy
          text: 妈妈，我想请您答应一件事。
        - id: ch01-b12
          speaker: mrs_march
          text: 说吧，小姑娘，是什么事？
        - id: ch01-b13
          speaker: narrator
          text: 在母亲眼里，这位仪态庄重的年轻小姐，仍是家中最小的宝宝。
        - id: ch01-b14
          speaker: amy
          text: 绘画班下星期就停课了。大家放暑假分开以前，我想请姑娘们到家里玩一天。她们都想看河，想画断桥，也想照我的画册临摹几样东西。她们家里都富有，也知道我穷，可她们一直待我很好，从没因此看轻我。我很感激。
        - id: ch01-b15
          speaker: mrs_march
          text: 她们为什么该看轻你？
        - id: ch01-b16
          speaker: narrator
          text: 马奇太太问这句话时，摆出了姑娘们所谓“玛丽亚·特蕾莎的气势”。
        - id: ch01-b17
          speaker: amy
          text: 您明明知道，几乎人人都会把穷人另眼相看。所以您的小鸡要是让神气的鸟儿啄了，您可别像护孩子的母鸡一样竖起全身羽毛。别忘了，丑小鸭后来变成了天鹅。
        - id: ch01-b18
          speaker: narrator
          text: 艾米笑得毫无苦意。她性情开朗，心里总抱着希望。马奇太太也笑了，把母亲那份受伤的骄傲按下去。
        - id: ch01-b19
          speaker: mrs_march
          text: 好吧，我的小天鹅。你到底打算怎么办？
        - id: ch01-b20
          speaker: amy
          text: 下星期请她们吃午餐，再坐车去看她们想看的地方，或许还到河上划船。我要为她们办一次小小的艺术游园会。
        - id: ch01-b21
          speaker: mrs_march
          text: 这倒办得到。午餐有蛋糕、三明治、水果和咖啡，应该就够了吧？
        - id: ch01-b22
          speaker: amy
          text: 那怎么够！还要冷牛舌、鸡肉、法式巧克力和冰淇淋。她们吃惯了这些。就算我得靠工作养活自己，也要把午餐办得体面雅致。
        - id: ch01-b23
          speaker: mrs_march
          text: 班里有多少位小姐？
        - id: ch01-b24
          speaker: amy
          text: 十二个或十四个，不过不见得全来。
        - id: ch01-b25
          speaker: mrs_march
          text: 天哪，那你得包一辆公共马车，才装得下她们。
        - id: ch01-b26
          speaker: amy
          text: 妈妈，哪用得着！大概只会来六个或八个。我租一辆海滨游览车，再借劳伦斯先生的“樱桃蹦蹦车”就行。
        - id: ch01-b27
          speaker: narrator
          text: “樱桃蹦蹦车”，是汉娜把法语的敞篷游览车念走了音。
        - id: ch01-b28
          speaker: mrs_march
          text: 这样花费可不少，艾米。
        - id: ch01-b29
          speaker: amy
          text: 不会太多。我都算过了，钱由我自己付。
        - id: ch01-b30
          speaker: mrs_march
          text: 这些姑娘早就见惯了这样的招待。我们再尽力，她们也不会觉得新鲜。若办得简单些，对她们倒是换换口味，也可能更愉快。对我们也更合适，免得去买、去借用不着的东西，硬摆出与自家境况不相称的排场。你不这样想吗？
        - id: ch01-b31
          speaker: amy
          text: 要是不能照我的意思办，我宁可不办。只要您和姐姐们稍微帮忙，我肯定办得好。钱又是我自己出，为什么不行？
        - id: ch01-b32
          speaker: narrator
          text: 艾米本来只是坚决，别人一反对，就容易变成固执。马奇太太知道，经验是位极好的老师。只要情况允许，她便让女儿们独自去领受生活给的教训。她本来很愿意替孩子们把功课变得容易一点，无奈姑娘们拒绝忠告时，就像拒绝喝泻盐和番泻叶一样坚决。
        - id: ch01-b33
          speaker: mrs_march
          text: 好吧。既然你一心想办，也觉得不会耗掉太多钱、时间和脾气，我就不劝了。去同姐姐们商量，不论你们怎样决定，我都会尽力帮忙。
        - id: ch01-b34
          speaker: amy
          text: 谢谢妈妈，您总是这么好。
        - id: ch01-b35
          speaker: narrator
          text: 艾米马上去找姐姐们。梅格一口答应帮忙，连自己的小房子和最好的一套盐匙都愿意拿出来。乔却皱着眉，起初怎么也不肯参与。
        - id: ch01-b36
          speaker: jo
          text: 你为什么非要给一群根本不在乎你的姑娘花钱？还要全家替你操心，把屋子翻个底朝天。我还以为你有自尊、有头脑，不会只因谁穿法国靴、坐双座马车，就对她低声下气呢。
        - id: ch01-b37
          speaker: narrator
          text: 乔正写到小说最悲惨紧张的地方，却被叫来讨论应酬，脾气自然不好。
        - id: ch01-b38
          speaker: amy
          text: 我才没有低声下气！我和你一样讨厌别人摆出施恩的样子。那些姑娘在乎我，我也在乎她们。你说她们满脑子时髦玩意，可她们当中照样有人善良、明理又有才华。你不在乎别人喜不喜欢你，也不想进好的社交圈，更懒得培养举止和品位。我在乎，而且每次机会来了，我都要好好抓住。你尽管伸着胳膊肘，翘着鼻子走遍世界，再管那叫独立。反正我不愿那样。
        - id: ch01-b39
          speaker: narrator
          text: 艾米把舌头磨利，把话说痛快，通常都会占上风。她的道理很少站不住脚，乔对自由的热爱和对一切俗套的厌恶却常常走得太远，所以辩到后来，总是乔先败下阵来。这一次，艾米对乔那种“独立”的形容一下说中了要害，姐妹俩都笑起来，争论也和气了。最后，乔很不情愿地答应牺牲一天给“格兰迪太太”，帮妹妹办完这件在她眼里“荒唐透顶的事”。
        - id: ch01-b40
          speaker: narrator
          text: 请帖发出后，差不多人人都答应来，盛会定在星期一。汉娜的一周活计全被打乱，心里十分不痛快。
        - id: ch01-b41
          speaker: hannah
          text: 洗衣熨衣不按老规矩来，往后啥事都甭想顺当。
        - id: ch01-b42
          speaker: narrator
          text: 家庭机器的主发条一不顺，整套安排自然也跟着出了毛病。不过艾米的格言是“决不灰心”。她既已决定怎么做，就要顶着所有阻碍把事情办成。偏偏汉娜做的菜样样失败。鸡肉太老，牛舌太咸，巧克力怎么也打不起泡。蛋糕、冰淇淋和马车都比预想中贵，别的开销起初看来微不足道，最后加起来也很吓人。贝思着凉卧床，梅格偏偏来了许多客人，被留在自己家中。乔一半心思还在小说里，打碎的东西、闯的祸和犯的错不但格外多，也格外严重，叫人难以忍受。
        - id: ch01-b43
          speaker: narrator
          text: 她们约好，星期一若下雨，客人就改在星期二来。这安排简直把乔和汉娜折磨坏了。星期一的天气偏又拿不定主意，一会儿细雨，一会儿阳光，一会儿刮风，比一直下大雨还让人着急。等老天终于决定，别人已经来不及决定了。艾米天一亮便把大家赶下床，催着吃完早饭，好收拾房子。客厅在她眼里显得破旧得不得了，她却没有停下来叹气，而是把现有的一切用到最好。椅子遮住地毯磨损处，自制雕塑挡住墙上污迹，也让屋子添了几分艺术气息。乔摆下的一瓶瓶鲜花也有同样的功劳。
        - id: ch01-b44
          speaker: narrator
          text: 午餐看着漂亮，艾米只盼味道也好，更盼借来的玻璃、瓷器和银器最后都能平安回到主人家。马车说定了，梅格和妈妈准备待客，贝思的病也好了一点，能躲在厨房帮汉娜。乔答应尽量活泼和气，可她心不在焉，头又疼，还看谁、看什么都不顺眼，能做到哪一步实在难说。艾米疲倦地换着衣服，拿午餐之后的快乐时刻安慰自己。只要这一餐顺利过去，她就会和朋友们坐着“樱桃蹦蹦车”，去看断桥，度过一个充满艺术乐趣的下午。这两样可是她整套安排里最拿得出手的节目。
        - id: ch01-b45
          speaker: narrator
          text: 接下来几个钟头，全家都悬着心。艾米从客厅奔到门廊，又从门廊转回客厅。大家对客人究竟来不来的判断，也像屋顶的风向标一样转来转去。十一点忽然下了一阵急雨，显然浇灭了原定十二点到达的小姐们的兴致，因为十二点过去，谁也没来。到了两点，阳光却灿烂得刺眼。一家人累得精疲力尽，只好坐下来吃掉宴席上不能久放的东西，免得白白糟蹋。
        - id: ch01-b46
          speaker: amy
          text: 今天天气肯定不会变了，她们一定来。大家快点儿，把东西全准备好。
        - id: ch01-b47
          speaker: narrator
          text: 第二天的太阳刚把她叫醒，艾米便说得十分有精神。可在没人听见的心底，她已经后悔提过星期二。一天的折腾过去，她对这场宴会的兴致和桌上的蛋糕一样，都有点不新鲜了。半小时后，马奇先生回到家，脸上带着一种平静而无可奈何的绝望。
        - id: ch01-b48
          speaker: mr_march
          text: 龙虾买不到，今天只好不做沙拉了。
        - id: ch01-b49
          speaker: mrs_march
          text: 那就用鸡肉。拌进沙拉，也吃不出肉老。
        - id: ch01-b50
          speaker: beth
          text: 汉娜只把鸡放在厨房桌上一会儿，小猫就吃了。艾米，真对不起。
        - id: ch01-b51
          speaker: narrator
          text: 贝思仍旧护着所有的猫。
        - id: ch01-b52
          speaker: amy
          text: 那我非弄到龙虾不可。光有牛舌不能算午餐。
        - id: ch01-b53
          speaker: jo
          text: 要不要我冲进城里，逼他们非交出一只龙虾不可？
        - id: ch01-b54
          speaker: narrator
          text: 乔说得像个宽宏大量的殉道者。
        - id: ch01-b55
          speaker: amy
          text: 你准会故意连纸也不包，把龙虾夹在胳膊下面带回来气我。还是我自己去。
        - id: ch01-b56
          speaker: narrator
          text: 艾米的脾气快要撑不住了。她蒙上厚面纱，提着一只文雅的旅行篮出门，觉得坐车吹吹凉风，既能平复烦乱，也能让自己攒足精神，继续应付当天的辛劳。耽搁一番，她终于买到想要的龙虾，又买了一瓶现成沙拉酱，好省下回家的工夫。她很满意自己的周到，再次乘车上路。
        - id: ch01-b57
          speaker: narrator
          text: 公共马车里只有一位昏昏欲睡的老太太。艾米收起面纱，拿出写满顽固数字的卡片，想算清钱究竟花到哪里去了。她看得太专心，连新乘客在车还没停稳时上来都不知道，直到一个男人向她问好。抬头一看，竟是劳里大学朋友里最讲究的都铎。艾米热切地盼着他先下车，索性装作脚边根本没有那个篮子。幸好自己穿着新旅行服，她多少安下心来，便照常温文又机敏地同他交谈。
        - id: ch01-b58
          speaker: narrator
          text: 得知都铎会比自己先下车，艾米最大的忧虑终于消失。她越聊越自在，说话的腔调也格外高雅。这时，老太太踉跄着走向车门，一脚碰翻了篮子。啊，太可怕了！那只龙虾又大又红，毫不文雅地露出全身，就这样暴露在都铎这位高贵子弟眼前。
        - id: ch01-b59
          speaker: tudor
          text: 天哪，那位老太太把晚饭忘了！
          emotion: surprised
        - id: ch01-b60
          speaker: narrator
          text: 他毫不知情，用手杖把鲜红的怪物捅回去，伸手就要把篮子递给老太太。
        - id: ch01-b61
          speaker: amy
          text: 请别拿……那是我的。
        - id: ch01-b62
          speaker: narrator
          text: 艾米的脸红得快赶上龙虾了。
        - id: ch01-b63
          speaker: tudor
          text: 原来是您的，请原谅。这只龙虾长得真肥美，是不是？
        - id: ch01-b64
          speaker: narrator
          text: 都铎马上恢复镇定，还一本正经地关心起龙虾来，仿佛眼前发生的是再平常不过的事，的确没有辜负他的好家教。艾米也只用一口气就找回从容。她不再躲着那只篮子，而是大大方方地把它放到身旁的座位上，笑着开了口。
        - id: ch01-b65
          speaker: amy
          text: 它就要做成沙拉了。您不想尝一点吗？还可以见见那些要吃沙拉的迷人小姐。
        - id: ch01-b66
          speaker: narrator
          text: 这一招很高明。男人心中两样难挡的弱点同时被碰中了。一提美食，龙虾立刻披上一层美好回忆的光，而“迷人小姐们”又勾起都铎的好奇。他的心思就这样离开了方才那场滑稽意外。都铎鞠躬离开时，艾米暗自安慰自己，他准会拿龙虾去同劳里说笑，好在她不必亲眼看见他们笑。
        - id: ch01-b67
          speaker: narrator
          text: 回家后，她一句也没提这次相遇。篮子翻倒时，沙拉酱顺着裙摆流出一道道蜿蜒的痕迹，新旅行服已经毁得很难看。她还是把那些越来越烦人的准备一项项做完。十二点，一切又安排好了。艾米觉得邻居们全在留意她的动静，便一心要用今天的大成功，抹去大家对昨天失败的记忆。于是她叫来“樱桃蹦蹦车”，威风地出门迎接客人，要亲自把她们护送到宴席前。
        - id: ch01-b68
          speaker: mrs_march
          text: 车轮响了，她们来了！我到门廊上去接。这样显得热情些。可怜的孩子忙了这么久，我真希望她最后能快活一天。
        - id: ch01-b69
          speaker: narrator
          text: 马奇太太说着便走出去。可她只看了一眼，便带着一种难以形容的神情退了回来。宽大的马车里只坐着艾米和一位年轻小姐，两个人陷在空荡荡的座位中，小得仿佛快找不着了。
        - id: ch01-b70
          speaker: jo
          text: 贝思，快帮汉娜撤掉一半的菜！客人只有一个，却摆出十二个人的午餐，实在太可笑了。
        - id: ch01-b71
          speaker: narrator
          text: 乔兴奋得连笑也顾不上，匆匆跑进厨房。艾米进门时却镇定依旧，对那位唯一守信的客人亲切得无可挑剔。全家人都很有演戏的天分，各自把角色演得漂亮，只是心里的笑意怎么也压不干净。埃利奥特小姐只觉得这一家人快乐极了。她们欢欢喜喜地吃完重新整理过的午餐，又参观了画室和花园，兴致勃勃地谈论艺术。后来艾米叫来一辆轻便马车，陪朋友安静游览附近。那辆高雅的“樱桃蹦蹦车”自然省下了。直到太阳落山，客人才离去，这场聚会总算正式结束。
        - id: ch01-b72
          speaker: narrator
          text: 艾米走回家时累得厉害，脸上却还和平常一样平静。她四下一看，那场不幸游园会留下的痕迹已经全都消失了，只有乔嘴角那道可疑的皱纹还没有收拾干净。
        - id: ch01-b73
          speaker: mrs_march
          text: 亲爱的，下午天气真好，最适合坐车游玩了。
        - id: ch01-b74
          speaker: narrator
          text: 她说得十分尊重，仿佛十二位客人全都来了。
        - id: ch01-b75
          speaker: beth
          text: 埃利奥特小姐很可爱。我觉得她今天玩得挺高兴。
        - id: ch01-b76
          speaker: meg
          text: 能把蛋糕分给我一点吗？我家里客人多，很需要蛋糕，可我做不出你这么好的。
        - id: ch01-b77
          speaker: amy
          text: 全拿走吧。家里只有我爱吃甜食，等我一个人吃完，它早就发霉了。
        - id: ch01-b78
          speaker: narrator
          text: 艾米想到自己原本为十几位客人备下那么多食物，最后却只有这样的结局，心里不由叹了口气。两天之内，一家人第二次坐下来，对着同样的冰淇淋和沙拉。
        - id: ch01-b79
          speaker: jo
          text: 真可惜劳里不在，不能来帮我们吃这些东西。
        - id: ch01-b80
          speaker: narrator
          text: 母亲立刻投来警告的一眼，乔只好把后面的话咽回去。于是全家人拿出英雄般的勇气，一声不响地继续吃那顿已经吃过一回的宴席，直到马奇先生温和地开口。
        - id: ch01-b81
          speaker: mr_march
          text: 沙拉是古人最喜爱的菜肴之一，伊夫林对此也有记载。
        - id: ch01-b82
          speaker: narrator
          text: 全家再也忍不住，忽然轰然大笑。笑声把后面的话截得干干净净。“沙拉史”才讲了个开头便被打断，博学的马奇先生完全不知道笑声从何而来，惊讶极了。
        - id: ch01-b83
          speaker: amy
          text: 把所有东西塞进篮子，送给胡梅尔一家吧。德国人喜欢这种杂拌。我现在看见它们就难受。我犯了傻，你们可没必要陪我全都撑死。
          emotion: sad
        - id: ch01-b84
          speaker: narrator
          text: 艾米说着擦了擦眼睛。她是真的厌倦了这桌宴席，也承认自己犯了傻。乔却已经笑得浑身无力，连叹气时都还收不住笑。
        - id: ch01-b85
          speaker: jo
          text: 我看见你们两个坐在那辆叫什么来着的车里，一路咯噔乱晃，活像一只大得离谱的果壳里放了两粒小果仁。妈妈还盛装等着迎接浩浩荡荡的客人。我当时真要笑死了。
        - id: ch01-b86
          speaker: mrs_march
          text: 亲爱的，你盼了那么久，最后却这样失望，我真的很难过。不过为了让你满意，我们每个人都已经尽了最大的力。
        - id: ch01-b87
          speaker: amy
          text: 我已经满意了。我答应要做的事，全都照计划做到了。最后没有成功，并不是我的错，我只能拿这一点安慰自己。真的非常谢谢大家帮我。要是你们至少一个月都别再提这场游园会，我会更加感激。
          emotion: sad
        - id: ch01-b88
          speaker: narrator
          text: 接下来的几个月，果真没有人再提起那天的事。可是从那以后，只要谁说出“游园会”三个字，一家人便会不约而同地微笑。劳里也没有让那只龙虾被人遗忘。到了艾米生日，他送来一只小小的珊瑚龙虾，做成坠饰，正好挂在她的表链上。
