  chapters:
    - id: ch01
      title: Amy Tries Every Art
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It can take a long time to learn the difference between talent and genius, especially when you are young and ambitious. Amy learned it through plenty of trouble. She often mistook enthusiasm for inspiration, and she boldly tried one kind of art after another. For a while, she left her clay work alone and made delicate pen-and-ink drawings. She had real taste and skill with them, and the work was both enjoyable and profitable. Then her eyes grew tired, so she put away her pens and took up drawing with a hot poker.
        - id: ch01-b02
          speaker: narrator
          text: During that experiment, the whole family feared the house would catch fire. Burning wood could be smelled at every hour. Smoke kept pouring from the attic and shed, and red-hot pokers turned up everywhere. Hannah went to bed each night with a pail of water and the dinner bell beside her door, ready to sound an alarm. Raphael's face appeared under the molding board, Bacchus decorated the top of a beer barrel, and a singing cherub adorned the sugar bucket. Amy's many attempts at Romeo and Juliet became kindling.
        - id: ch01-b03
          speaker: narrator
          text: Burned fingers led naturally from fire to oil paints. An artist friend gave Amy his old palettes, brushes, and colors, and she painted with all her old energy. Her country scenes and ocean views looked like nothing ever seen on land or sea. Her strange cattle might have won prizes at a farm fair. Her ships pitched so dangerously that they could have made a sailor seasick, if their impossible shapes and rigging had not made him laugh first.
        - id: ch01-b04
          speaker: narrator
          text: From one corner of her studio, dark boys and Madonnas stared out in Amy's version of Murillo. Brown, oily faces with a bright streak in the wrong place stood for Rembrandt. Large ladies and swollen babies represented Rubens. Turner appeared in storms of blue thunder, orange lightning, brown rain, and purple clouds. In the middle sat a tomato-red splash that might be the sun, a buoy, a sailor's shirt, or a king's robe. The viewer could decide.
        - id: ch01-b05
          speaker: narrator
          text: Charcoal portraits came next. The entire family hung in a row, all looking as wild and sooty as if they had just climbed from a coal bin. Crayons worked better. The likenesses were good, and everyone praised Amy's hair, Jo's nose, Meg's mouth, and Laurie's eyes. Then Amy returned to clay and plaster. Pale casts of her friends haunted corners of the house and tumbled from closet shelves onto people's heads. She persuaded children to pose, and their confused stories about her mysterious work made Miss Amy sound like a young ogress.
        - id: ch01-b06
          speaker: narrator
          text: That branch of art ended suddenly. When no other model was available, Amy decided to make a cast of her own pretty foot. Before long, the family heard dreadful thumping and screaming from the shed. They rushed in and found her hopping wildly with one foot trapped in a pan of plaster. It had hardened much faster than she expected. Freeing her was difficult and a little dangerous. Jo laughed so hard while cutting away the plaster that her knife slipped and cut Amy's foot. The scar became a lasting reminder of that artistic attempt.
        - id: ch01-b07
          speaker: narrator
          text: Amy quieted down for a while. Then she became determined to sketch from nature and began roaming beside the river and through fields and woods, always looking for a lovely view and wishing there were picturesque ruins nearby for her to draw. She caught one cold after another by sitting on damp grass to capture a delightful scene made of a stone, a stump, one mushroom, and a broken mullein stalk. On other days, she studied what she called a heavenly mass of clouds. When those clouds appeared on paper, they looked more like a fine display of featherbeds.
        - id: ch01-b08
          speaker: narrator
          text: She spent long hours on the river under the midsummer sun to study light and shadow, ruining her complexion. She even earned a wrinkle over her nose while squinting along a string to find the proper point of view. Michelangelo said that genius is eternal patience. By that measure, Amy had some claim to genius. Through every obstacle, failure, and discouragement, she kept learning and working all the while. She remained certain that one day she would create something worthy of the name high art.
        - id: ch01-b09
          speaker: narrator
          text: Meanwhile, Amy kept learning and enjoying other things. She meant to become an attractive, accomplished woman even if she never became a great artist. Here she did better. She was one of those fortunate people who please others without trying, make friends everywhere, and move through life so gracefully that everyone else thinks they must have been born under a lucky star.
        - id: ch01-b10
          speaker: narrator
          text: People liked Amy because she had tact. She seemed to know what was proper and pleasing. She said the right thing to the right person, acted as the moment required, and stayed perfectly composed. These gifts came so naturally that her less fortunate friends could only wonder at them. Her sisters said that if Amy arrived at court without a single rehearsal, she would somehow know exactly what to do.
        - id: ch01-b11
          speaker: narrator
          text: But Amy longed to enter what she called the best society, though she did not yet understand what truly made it best. Money, rank, fashionable accomplishments, and elegant manners all impressed her. She sought out people who had them and sometimes admired what did not deserve admiration. She remembered that she had been born a gentlewoman, and she carefully trained her refined tastes so she would be ready if poverty ever stopped keeping her from the position she wanted.
        - id: ch01-b12
          speaker: narrator
          text: Her friends called her My Lady. Amy honestly wanted to be a true lady, and in her heart she was one. She still had to learn that money cannot buy a refined nature, rank does not always make a person noble, and real good breeding shows itself in spite of outward disadvantages.
    - id: ch02
      title: Plans for an Artistic Fete
      blocks:
        - id: ch02-b01
          speaker: amy
          text: Mamma, I want to ask you a favor.
        - id: ch02-b02
          speaker: narrator
          text: Amy came in one day looking very important. To her mother, however, this stately young lady was still the baby.
        - id: ch02-b03
          speaker: mrs_march
          text: What is it, little girl?
        - id: ch02-b04
          speaker: amy
          text: Our drawing class ends next week, and before everyone leaves for the summer, I'd like to invite the girls here for a day. They want to see the river, sketch the broken bridge, and copy some things they admire in my book. They've been very kind to me. They're all rich, and they know I'm poor, but they've never treated me differently.
        - id: ch02-b05
          speaker: mrs_march
          text: Why should they treat you differently?
        - id: ch02-b06
          speaker: narrator
          text: Mrs. March asked with the proud, royal air her daughters called her Maria Theresa manner.
        - id: ch02-b07
          speaker: amy
          text: You know money makes a difference to almost everyone. So please don't puff up like a mother hen when smarter birds peck at her chicks. Remember, the ugly duckling became a swan.
        - id: ch02-b08
          speaker: narrator
          text: Amy smiled without bitterness. Her naturally hopeful spirit did not let such things trouble her for long. Mrs. March laughed and put away her motherly pride.
        - id: ch02-b09
          speaker: mrs_march
          text: All right, my swan. What's your plan?
        - id: ch02-b10
          speaker: amy
          text: I'd like the girls to come for lunch next week. Then we'll drive to the places they want to see, perhaps row on the river, and make it a little artistic celebration.
        - id: ch02-b11
          speaker: mrs_march
          text: That sounds possible. For lunch, I suppose cake, sandwiches, fruit, and coffee will be enough.
        - id: ch02-b12
          speaker: amy
          text: Oh, no! We need cold tongue and chicken too, with French chocolate and ice cream. The girls are used to that sort of thing. Even though I work for my living, I want my lunch to be proper and elegant.
        - id: ch02-b13
          speaker: mrs_march
          text: How many young ladies are in the class?
        - id: ch02-b14
          speaker: amy
          text: Twelve or fourteen, but I'm sure they won't all come.
        - id: ch02-b15
          speaker: mrs_march
          text: Goodness, Amy. You'll need an omnibus to take them around.
        - id: ch02-b16
          speaker: amy
          text: Mother, how could you suggest that? Only six or eight will probably come. I'll hire a beach wagon and borrow Mr. Laurence's char-a-banc.
        - id: ch02-b17
          speaker: narrator
          text: Hannah called that elegant carriage a cherry-bounce.
        - id: ch02-b18
          speaker: mrs_march
          text: This is going to cost a great deal.
        - id: ch02-b19
          speaker: amy
          text: Not so very much. I've worked out the cost, and I'll pay for it myself.
        - id: ch02-b20
          speaker: mrs_march
          text: These girls already have elegant meals and drives. What we can offer won't be new to them. Wouldn't something simple be a pleasant change for them and much easier for us? We wouldn't have to buy and borrow things we don't need or pretend to live in a style that doesn't suit our circumstances.
        - id: ch02-b21
          speaker: amy
          text: If I can't do it the way I want, I don't want to do it at all. I know I can manage perfectly well if you and the girls help a little. If I'm willing to pay, I don't see why I shouldn't.
        - id: ch02-b22
          speaker: narrator
          text: Opposition often turned Amy's determination into stubbornness. Mrs. March believed experience was an excellent teacher. Whenever she could, she let her children discover a lesson for themselves. She would gladly have made those lessons easier, but they disliked advice about as much as they disliked medicine.
        - id: ch02-b23
          speaker: mrs_march
          text: Very well. If your heart is set on it, and you can manage without spending too much money, time, or patience, I won't argue. Talk it over with your sisters. Whatever you all decide, I'll do my best to help.
        - id: ch02-b24
          speaker: amy
          text: Thank you, Mother. You're always so kind.
        - id: ch02-b25
          speaker: narrator
          text: Amy hurried away to present the plan to her sisters. Meg agreed at once and offered everything she owned, from her little house to her finest salt spoons. Jo had been pulled away from the tragic climax of her novel, so she frowned at the whole idea and refused to help at first.
        - id: ch02-b26
          speaker: jo
          text: Why spend your money, worry the family, and turn the house upside down for girls who don't care a bit about you? I thought you had too much pride and sense to bow and scrape to anyone just because she wears French boots and rides in a fancy carriage.
        - id: ch02-b27
          speaker: amy
          text: I don't bow and scrape, and I hate being patronized as much as you do! Those girls care about me, and I care about them. They have kindness, good sense, and talent, no matter what you say about fashionable nonsense. You don't want people to like you. You don't care about good society or improving your manners and taste. I do, and I mean to use every opportunity I get. If you want to go through life with your elbows out and your nose in the air and call that independence, go ahead. It isn't my way.
          emotion: angry
        - id: ch02-b28
          speaker: narrator
          text: Once Amy sharpened her tongue and spoke her mind, she usually won. Common sense was often on her side, while Jo carried her love of freedom and dislike of convention much too far. Amy's picture of Jo's independence was so accurate that they both burst out laughing. The argument softened. At last, and very much against her will, Jo agreed to give one day to proper society and help with what she still considered complete nonsense.
    - id: ch03
      title: Two Days of Trouble
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The invitations went out, nearly everyone accepted, and Monday was chosen for the great event. Hannah was cross because it upset her weekly routine.
        - id: ch03-b02
          speaker: hannah
          text: If the washing and ironing aren't done regular, nothing anywhere will go right.
        - id: ch03-b03
          speaker: narrator
          text: When the main spring of the household machinery complained, everything suffered. Still, Amy's motto was never despair. Once she decided on a course, she followed it through every obstacle. The first obstacle was Hannah's cooking. The chicken came out tough, the tongue was too salty, and the chocolate refused to froth. The cake and ice cream cost more than Amy expected. So did the wagon. Other expenses had looked tiny one by one, but together the total became alarming. Beth caught cold and went to bed. Meg had so many callers that she could not leave home. Jo remained torn between duty and disapproval, and her accidents, broken dishes, and mistakes became unusually frequent, serious, and trying.
        - id: ch03-b04
          speaker: narrator
          text: If Monday was rainy, the guests were to come Tuesday instead. That arrangement irritated Jo and Hannah beyond words. Monday morning brought the worst sort of uncertain weather. It drizzled, brightened, blew, and refused to decide what it meant to do until no one else had time to decide either.
        - id: ch03-b05
          speaker: narrator
          text: Amy rose at dawn and hurried everyone out of bed and through breakfast so they could put the house in order. The parlor looked painfully shabby to her. Instead of mourning what she lacked, she cleverly used what she had. Chairs covered worn patches in the carpet. Homemade statues hid stains on the walls and made the room look artistic. Jo filled beautiful vases with flowers and set them around the room.
        - id: ch03-b06
          speaker: narrator
          text: The lunch looked charming. Amy hoped it tasted as good as it looked and that all the borrowed glass, china, and silver would return safely. The carriages were arranged. Meg and Mrs. March stood ready to welcome the guests. Beth had recovered enough to help Hannah behind the scenes. Jo had promised to be as cheerful as she could while distracted, suffering from a headache, and strongly opposed to everyone and everything.
        - id: ch03-b07
          speaker: narrator
          text: As Amy dressed wearily, she pictured the happy moment after lunch when she would drive away with her friends for an afternoon of artistic pleasure. The char-a-banc and the broken bridge were the finest parts of her plan. Then the long hours of waiting began. Amy moved constantly between parlor and porch while everyone's opinion changed with the weather vane. A hard shower came at eleven. It seemed to wash away the enthusiasm of every young lady expected at noon. No one arrived. At two, under brilliant sunshine, the exhausted family sat down together and ate everything perishable so none of the feast would be wasted.
        - id: ch03-b08
          speaker: amy
          text: There's no question about the weather today. They'll certainly come, so we must hurry and be ready.
        - id: ch03-b09
          speaker: narrator
          text: Amy spoke briskly when the sun woke her Tuesday morning. Secretly, she wished she had never offered a second day. Her interest was becoming as stale as her cake. Half an hour later, Mr. March came in wearing an expression of peaceful despair.
        - id: ch03-b10
          speaker: mr_march
          text: I couldn't find any lobsters. You'll have to serve lunch without salad today.
        - id: ch03-b11
          speaker: mrs_march
          text: Use the chicken. Once it's in salad, no one will notice that it's tough.
        - id: ch03-b12
          speaker: beth
          text: Hannah left it on the kitchen table for just a minute, and the kittens got into it. I'm so sorry, Amy.
        - id: ch03-b13
          speaker: narrator
          text: Beth still had a soft spot for cats.
        - id: ch03-b14
          speaker: amy
          text: Then I have to get a lobster. Tongue by itself isn't enough.
        - id: ch03-b15
          speaker: jo
          text: Shall I race into town and demand one for you?
        - id: ch03-b16
          speaker: narrator
          text: Jo offered with the grand generosity of a martyr.
        - id: ch03-b17
          speaker: amy
          text: You'd carry it home under your arm without wrapping it, just to torment me. I'll go myself.
        - id: ch03-b18
          speaker: narrator
          text: Amy's patience was beginning to break. She wrapped herself in a thick veil, took a proper traveling basket, and set out. A cool ride, she hoped, would settle her temper before the day's work. After some delay, she found a lobster and bought bottled dressing to save time. Then she started home, pleased with her planning.
        - id: ch03-b19
          speaker: narrator
          text: Only one other passenger sat in the omnibus, a sleepy old lady. Amy slipped her veil into her pocket and passed the time by trying to discover where all her money had gone. The numbers on her card refused to behave. She was studying them so closely that she failed to notice another passenger climb aboard until a man's voice spoke.
        - id: ch03-b20
          speaker: tudor
          text: Good morning, Miss March.
        - id: ch03-b21
          speaker: narrator
          text: Amy looked up and saw one of Laurie's most elegant college friends. She desperately hoped he would leave before she did. Pretending the basket at her feet did not exist, and thankful for her new traveling dress, she greeted Mr. Tudor with her usual easy charm. They talked very well together. Amy soon learned that he would indeed get off first, and that freed her to speak in an especially lofty manner.
        - id: ch03-b22
          speaker: narrator
          text: Then the old lady rose to leave. She stumbled against the basket, knocked it over, and uncovered the lobster in all its enormous scarlet glory before the aristocratic eyes of a Tudor.
        - id: ch03-b23
          speaker: tudor
          text: By Jove, she forgot her dinner!
          emotion: surprised
        - id: ch03-b24
          speaker: narrator
          text: The unsuspecting young man pushed the lobster back with his cane and prepared to hand the basket after the old lady.
        - id: ch03-b25
          speaker: amy
          text: Please don't. It's mine.
        - id: ch03-b26
          speaker: narrator
          text: Amy's face turned almost as red as the lobster.
        - id: ch03-b27
          speaker: tudor
          text: Oh! I beg your pardon. It is an unusually fine lobster, isn't it?
        - id: ch03-b28
          speaker: narrator
          text: His serious interest showed excellent manners. Amy recovered in an instant. She set the basket boldly on the seat and laughed.
        - id: ch03-b29
          speaker: amy
          text: Don't you wish you could taste the salad he's going to make and meet the charming young ladies who'll eat it?
        - id: ch03-b30
          speaker: narrator
          text: That was Amy's tact at work. The mention of food brought pleasant memories, and the charming young ladies awakened Tudor's curiosity. The ridiculous accident was forgotten. After he bowed and left, Amy comforted herself that he might joke about it with Laurie, but at least she would not be there to hear them.
        - id: ch03-b31
          speaker: narrator
          text: Amy said nothing about the meeting at home. The spilled dressing had run down her skirt and badly stained her new dress, but she continued with preparations that now felt more tiresome than ever. At noon, everything was ready again. She knew the neighbors had noticed yesterday's failure, and she meant to erase that memory with a splendid success. So she ordered the grand char-a-banc and drove away in state to collect her guests.
    - id: ch04
      title: One Faithful Guest
      blocks:
        - id: ch04-b01
          speaker: mrs_march
          text: There's the carriage! They're coming. I'll meet them on the porch. It will look welcoming, and after all this trouble, I want Amy to have a lovely time.
        - id: ch04-b02
          speaker: narrator
          text: Mrs. March went to the porch as she spoke. One look made her quietly retreat with an expression no one could describe. Lost in the enormous carriage sat Amy with one young lady.
        - id: ch04-b03
          speaker: jo
          text: Beth, hurry! Help Hannah take half the food off the table. We can't put lunch for twelve in front of one girl. It would look absurd.
        - id: ch04-b04
          speaker: narrator
          text: Jo rushed toward the kitchen. She was too excited even to stop and laugh. Amy entered with perfect calm and greeted the one guest who had kept her promise with delightful warmth. The rest of the family had a dramatic streak, so each played a part just as well. They welcomed Miss Eliott as though nothing had gone wrong. She thought them the liveliest family she had ever met, though none of them could completely hide the laughter bubbling inside.
        - id: ch04-b05
          speaker: narrator
          text: They ate the smaller lunch cheerfully, toured the studio and garden, and talked eagerly about art. Then Amy gave up the elegant char-a-banc and ordered a simple buggy. She drove Miss Eliott quietly through the neighborhood until sunset. At last, the party went out.
        - id: ch04-b06
          speaker: narrator
          text: Amy walked in looking exhausted but composed. Every sign of the unfortunate celebration had vanished. Only the suspicious tightening at the corners of Jo's mouth remained.
        - id: ch04-b07
          speaker: mrs_march
          text: You had beautiful weather for your drive, dear.
        - id: ch04-b08
          speaker: narrator
          text: Mrs. March spoke as respectfully as if all twelve girls had attended.
        - id: ch04-b09
          speaker: beth
          text: Miss Eliott is very sweet. I thought she truly enjoyed herself.
        - id: ch04-b10
          speaker: narrator
          text: Beth offered this comfort with unusual warmth.
        - id: ch04-b11
          speaker: meg
          text: Could I have some of your cake? I have so many visitors lately, and I could never bake anything as delicious as yours.
        - id: ch04-b12
          speaker: narrator
          text: Meg kept a perfectly serious face.
        - id: ch04-b13
          speaker: amy
          text: Take all of it. I'm the only one here who likes sweets, and it will grow moldy before I can finish it.
        - id: ch04-b14
          speaker: narrator
          text: Amy sighed as she remembered the generous supply she had bought for such a small ending. The family sat down to ice cream and salad for the second time in two days.
        - id: ch04-b15
          speaker: jo
          text: What a shame Laurie isn't here to help us eat it.
        - id: ch04-b16
          speaker: narrator
          text: One warning look from Mrs. March stopped Jo from saying more. Everyone ate with heroic silence until Mr. March gently offered a remark.
        - id: ch04-b17
          speaker: mr_march
          text: Salad was one of the favorite dishes of the ancient people, and Evelyn tells us...
        - id: ch04-b18
          speaker: narrator
          text: A great burst of laughter ended his history of salads and left the scholarly gentleman staring in surprise.
        - id: ch04-b19
          speaker: amy
          text: Put everything in a basket and send it to the Hummels. Germans like mixed-up food. I can't bear to look at any of this again, and you shouldn't all make yourselves sick just because I've been foolish.
          emotion: sad
        - id: ch04-b20
          speaker: narrator
          text: Amy wiped her eyes.
        - id: ch04-b21
          speaker: jo
          text: I nearly died when I saw you two rattling around in that whatever-you-call-it, like two tiny kernels inside one enormous nutshell. And Mother was waiting in state to welcome a crowd!
        - id: ch04-b22
          speaker: narrator
          text: Jo had laughed until she had no strength left.
        - id: ch04-b23
          speaker: mrs_march
          text: I'm very sorry you were disappointed, dear. We all tried our best to give you what you wanted.
          emotion: sad
        - id: ch04-b24
          speaker: amy
          text: I am satisfied. I did everything I set out to do, and the failure wasn't my fault. That comforts me. Thank you, all of you, for helping. I'll be even more grateful if no one mentions this again for at least a month.
          emotion: sad
        - id: ch04-b25
          speaker: narrator
          text: Her voice trembled a little. The family kept its promise for several months. After that, however, the word fete always brought a general smile. For Amy's birthday, Laurie gave her a tiny coral lobster shaped like a charm for her watch chain.
