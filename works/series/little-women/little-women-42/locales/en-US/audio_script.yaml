audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "warm, observant, and gently playful", timbre: "clear and inviting", pace: measured, pitch: medium}
    amy:
      display_name: Amy
      tts: {delivery: "poised, expressive, and lightly dramatic", timbre: "smooth and bright", pace: measured, pitch: medium-high}
    laurie:
      display_name: Laurie
      tts: {delivery: "playful, confident, and warmly teasing", timbre: "youthful and resonant", pace: lively, pitch: medium}
    aunt_carrol:
      display_name: Aunt Carrol
      tts: {delivery: "cultivated, discreet, and gently appraising", timbre: "soft and mature", pace: measured, pitch: medium}
    garcon:
      display_name: The Garcon
      tts: {delivery: "formal, eager, and elaborately courteous", timbre: "light and polished", pace: lively, pitch: medium}
  chapters:
    - id: ch01
      title: Trying to Do Something Splendid
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Amy's lecture did Laurie good, though he did not admit it until much later. Men rarely do when women give the advice. First they persuade themselves that the idea was theirs all along. If it works, they give the woman half the credit. If it fails, they generously give her all of it.
        - id: ch01-b02
          speaker: narrator
          text: Laurie went back to his grandfather and devoted himself to the old gentleman for several weeks. His grandfather declared that Nice must have improved the boy wonderfully and suggested another visit there. Laurie would have liked nothing better. But after Amy's scolding, not even elephants could have dragged him back. His pride would not allow it. Whenever he longed to go, he repeated the two things she had said that struck deepest.
        - id: ch01-b03
          speaker: amy
          text: I despise you. Go do something splendid, something that will make her love you.
        - id: ch01-b04
          speaker: narrator
          text: Laurie thought it over so often that he finally confessed he had been selfish and lazy. Still, a man with a great sorrow ought to be allowed a few strange ways until he has outlived it. His ruined hopes were quite dead now, he decided. He would always mourn them faithfully, but he did not need to parade his grief. Jo would never love him. He could at least earn her respect by proving that one girl's no had not spoiled his life.
        - id: ch01-b05
          speaker: narrator
          text: Of course, he had always meant to do something important. Amy's advice had not been necessary at all. He had only been waiting until his broken heart was properly buried. Now that this was done, he was ready to hide the wound and get to work.
        - id: ch01-b06
          speaker: narrator
          text: Goethe turned joy and grief into songs, so Laurie decided to preserve his lost love in music. He would compose a Requiem that would shake Jo's soul and melt every listener's heart. The next time his grandfather found him restless and moody and ordered him away, Laurie went to Vienna. He had musical friends there, and he meant to make a name for himself.
        - id: ch01-b07
          speaker: narrator
          text: Before long, he discovered that the Requiem was beyond him. Perhaps the sorrow was too large for music, or perhaps music was too airy to carry ordinary human pain. Either way, his mind was not ready to work. His ideas needed clearing. In the middle of a mournful passage, he would catch himself humming a dance tune from the Christmas ball at Nice. Then he would remember the stout Frenchman, and tragedy was impossible for the rest of the day.
        - id: ch01-b08
          speaker: narrator
          text: Next he tried an opera. At the beginning, nothing seemed impossible. Then the difficulties appeared. He wanted Jo for his heroine, so he called up every tender memory and romantic vision he had of her. His memory betrayed him. It behaved just like Jo and showed him only her odd habits, faults, and wild tricks. He saw her beating rugs with a bandanna tied over her hair, hiding behind a sofa pillow, or throwing cold water over his passion. Every picture made him laugh and ruined the sorrowful scene he was trying to compose.
        - id: ch01-b09
          speaker: laurie
          text: Bless that girl! What a torment she is!
        - id: ch01-b10
          speaker: narrator
          text: Laurie clutched his hair like a desperate composer and gave up trying to force Jo into the opera. When he searched for a more cooperative heroine, his memory produced one at once. Her face kept changing, but she always had golden hair. She floated through a bright haze of roses, peacocks, white ponies, and blue ribbons. Laurie gave the agreeable vision no name. He gave her every beauty and virtue instead, and led her safely through trials that would have destroyed any real woman.
        - id: ch01-b11
          speaker: narrator
          text: The new inspiration carried him along for a while. Then the opera lost its charm. He forgot to compose and sat dreaming with the pen in his hand, or wandered through the lively city in search of fresh ideas. He accomplished little that winter, but he thought a great deal. Some change was taking place in him, whether he wished it or not.
        - id: ch01-b12
          speaker: laurie
          text: Maybe it's genius simmering. I'll leave it alone and see what comes of it.
        - id: ch01-b13
          speaker: narrator
          text: Secretly, Laurie suspected that it was something much more ordinary than genius. Whatever it was, the simmering had a purpose. He grew tired of his scattered life and began to want real, serious work that would claim his whole mind and body. At last he reached a sensible conclusion. Loving music did not make every music lover a composer.
        - id: ch01-b14
          speaker: narrator
          text: One evening he returned from a grand Mozart opera at the Royal Theatre. He looked through his own score and played a few of its best passages. Then he sat before the busts of Mendelssohn, Beethoven, and Bach. They seemed to look kindly back at him. Suddenly, he tore up his sheets of music one by one. When the last page fell from his hand, he spoke soberly.
        - id: ch01-b15
          speaker: laurie
          text: She was right. Talent isn't genius, and wanting it won't make it so. That opera has taken the vanity out of me, just as Rome took it out of Amy. I won't pretend any longer. Now, what am I going to do?
        - id: ch01-b16
          speaker: narrator
          text: That question was hard to answer. Laurie began to wish he had to earn his daily bread. He had money, freedom, and nothing useful to fill his hands. It was just the sort of moment when he might have gone badly astray, as he once put it. Temptations came from inside him and from the world around him. Still, he resisted them well. He valued liberty, but he valued trust and honor more. He had made a promise to his grandfather. He also wanted to look honestly into the eyes of the women who loved him and tell them all was well. Those thoughts kept him safe and steady.
        - id: ch01-b17
          speaker: narrator
          text: Some respectable Mrs. Grundy may object that boys will be boys, young men must sow their wild oats, and women should not expect miracles. Perhaps she will not believe Laurie's conduct, but it is true. Women perform many quiet miracles. They can help raise the standard of manhood by refusing to repeat excuses like those. Let boys remain boys as long as they can. If young men insist on sowing wild oats, mothers, sisters, and friends can keep the crop small by showing that they believe loyalty and goodness are possible. Without that faith, much of life's beauty and hope would disappear. We would look sadly at brave, tenderhearted boys who still love their mothers better than themselves and are not ashamed to say so.
    - id: ch02
      title: The Love That Would Not Burn
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Laurie had expected that forgetting Jo would take all his strength for years. To his amazement, it grew easier every day. At first he refused to believe it. He became angry with himself and could not understand what was happening. But hearts are curious, contrary things, and time and nature have their way with us.
        - id: ch02-b02
          speaker: narrator
          text: Laurie's heart simply would not keep aching. The wound healed so quickly that it astonished him. Instead of trying to forget, he found himself trying to remember. He had never expected that. He felt disgusted by his own change and shocked by what seemed like fickleness. At the same time, disappointment and relief were mixed together in him. How could he recover so soon from a blow that had felt enormous?
        - id: ch02-b03
          speaker: narrator
          text: He carefully stirred the embers of his old love, but they would not burst into flame. They gave off only a comfortable warmth now. It did him good without making him feverish. Laurie had to admit that his boyish passion was slowly becoming something quieter. The feeling was still tender, a little sad, and even a little resentful. In time, those pains would pass and leave a brother's affection that could last for the rest of their lives.
        - id: ch02-b04
          speaker: narrator
          text: One day, the word brother made him smile. He glanced at the picture of Mozart in front of him and remembered that Mozart had loved one sister, then married the other and found happiness.
        - id: ch02-b05
          speaker: narrator
          text: Laurie did not say that thought aloud. The next moment, he kissed the little old ring he wore and argued with himself.
        - id: ch02-b06
          speaker: laurie
          text: No. I won't do that. I haven't forgotten her, and I never can. I'll try once more. If it fails, then...
        - id: ch02-b07
          speaker: narrator
          text: He left the sentence unfinished, seized pen and paper, and wrote to Jo. He told her he could settle to nothing while there was even the smallest hope that she might change her mind. Couldn't she reconsider? Wouldn't she let him come home and be happy?
        - id: ch02-b08
          speaker: narrator
          text: While he waited, Laurie did nothing with tremendous energy. He burned with impatience. Jo's answer came at last and settled the matter completely. She could not and would not marry him. Her whole heart was with Beth, and she never wanted to hear the word love again. She begged Laurie to find happiness with someone else, but asked him always to save one small corner of his heart for his loving sister Jo.
        - id: ch02-b09
          speaker: narrator
          text: In a postscript, Jo asked him not to tell Amy that Beth was worse. Amy would come home in the spring, and there was no need to darken the rest of her stay. That would be soon enough, please God. Until then, Laurie must write often and keep Amy from feeling lonely, homesick, or worried.
        - id: ch02-b10
          speaker: laurie
          text: I will. I'll write right now. Poor little Amy. I'm afraid going home will be terribly sad for her.
        - id: ch02-b11
          speaker: narrator
          text: Laurie opened his desk. Writing to Amy seemed like the proper ending to the sentence he had abandoned weeks before. But he did not write that day. While searching for his best paper, he found something that changed his mind.
        - id: ch02-b12
          speaker: narrator
          text: Jo's letters lay among bills, passports, and business papers in one part of the desk. In another compartment, Laurie found three notes from Amy. They were carefully tied with one of her blue ribbons, and little dead roses had been tucked inside. Half sorry and half amused, he gathered Jo's letters together. He smoothed them, folded them, and placed them neatly in a small drawer. For a moment, he turned the ring thoughtfully around his finger. Then he slowly took it off, laid it beside the letters, and locked the drawer.
        - id: ch02-b13
          speaker: narrator
          text: Laurie went out to hear High Mass at Saint Stefan's. It felt as though a funeral had taken place. He was not crushed by grief, but church seemed a more fitting place to spend the rest of that day than at his desk writing to charming young ladies.
    - id: ch03
      title: Letters in the Spring
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The letter to Amy went soon afterward, and she answered promptly. She was homesick and admitted it with such warm trust that their correspondence quickly flourished. All through the early spring, letters flew back and forth with perfect regularity. Laurie sold the busts in his rooms, used his opera to make spills for lighting candles, and returned to Paris. He hoped someone would arrive there before long.
        - id: ch03-b02
          speaker: narrator
          text: He desperately wanted to go to Nice, but he would not go until Amy invited him. Amy would not invite him. Just then, she was having private troubles of her own and preferred not to face the teasing questions in the eyes of the boy they all called theirs.
        - id: ch03-b03
          speaker: narrator
          text: Fred Vaughn had returned and asked the question Amy had once planned to answer with a grateful yes. When the moment came, she answered with a kind but steady no. Her courage to accept him had failed. Money and position were no longer enough for the new longing that filled her with tender hopes and fears.
        - id: ch03-b04
          speaker: narrator
          text: Amy kept remembering Laurie's words. Fred was a good man, Laurie had said, but not the kind of man he had ever imagined her loving. She remembered his face as clearly as she remembered the look she had once given him when she declared she would marry for money. That old ambition troubled her now. She wished she could take it back. It sounded cold and unworthy, and she did not want Laurie to think she was worldly and heartless.
        - id: ch03-b05
          speaker: narrator
          text: Amy cared much less about becoming a queen of society. She wanted to become a lovable woman. She was grateful that Laurie had not hated her for the harsh things she said. He had accepted them beautifully and treated her more kindly than ever. His letters comforted her. News from home arrived irregularly, and those letters were not half as satisfying when they came.
        - id: ch03-b06
          speaker: narrator
          text: Answering Laurie was not only a pleasure, Amy told herself. It was a duty. The poor boy was lonely and needed kindness because Jo insisted on being hardhearted. Really, Jo ought to have tried to love him. It could not be so difficult. Plenty of people would be proud and happy to have such a dear boy love them. But Jo never behaved like other girls. Amy could only be very good to Laurie and treat him like a brother.
        - id: ch03-b07
          speaker: narrator
          text: If every brother received the attention Laurie did that spring, brothers would be a much happier race. Amy no longer lectured him. She asked what he thought about everything, took an interest in all he did, and sent charming little gifts. Twice a week, her letters arrived full of lively gossip, sisterly secrets, and delightful sketches of the beautiful places around her.
        - id: ch03-b08
          speaker: narrator
          text: Few sisters carry a brother's letters in their pockets, read them again and again, cry when they are short, kiss them when they are long, and treasure every one. We will not suggest that Amy did anything so fond and foolish. We can say that she grew pale and thoughtful that spring. Society lost much of its attraction, and she often went sketching alone.
        - id: ch03-b09
          speaker: narrator
          text: Amy seldom brought much work home from those outings. No doubt she was studying nature while she sat for hours on the terrace at Valrosa with folded hands. When she did draw, her pencil wandered wherever her thoughts led. She sketched a strong knight carved on a tomb, a young man asleep in the grass with his hat over his eyes, or a curly-haired girl in splendid clothes walking through a ballroom on the arm of a tall gentleman. Both faces were left blurred. That was safely fashionable in art, though not entirely satisfying.
        - id: ch03-b10
          speaker: narrator
          text: Aunt Carrol believed Amy regretted refusing Fred. Amy could not make her aunt believe her denials, and she could not explain the truth, so she let the older woman think as she pleased. She did make certain Laurie learned that Fred had gone to Egypt. That was all she told him, but Laurie understood. He looked relieved and spoke to himself with the solemn air of a much older man.
        - id: ch03-b11
          speaker: laurie
          text: I knew she'd come to her senses. Poor Fred. I've suffered through it myself, so I know how he feels.
        - id: ch03-b12
          speaker: narrator
          text: Laurie gave a great sigh. Having paid that duty to the past, he put his feet on the sofa and settled down to enjoy Amy's letter.
    - id: ch04
      title: Laurie Comes to Vevay
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: While Laurie and Amy were changing abroad, trouble had come at home. The letter saying that Beth was growing weaker never reached Amy. By the time the next letter found her, green grass covered her sister's grave.
        - id: ch04-b02
          speaker: narrator
          text: The sad news reached Amy at Vevay. The heat had driven the Carrols away from Nice in May, and they had traveled slowly toward Switzerland by way of Genoa and the Italian lakes. Amy bore the blow very well. Her family decided she should not cut her visit short, and she quietly obeyed. It was too late to say goodbye to Beth. They hoped that staying away might soften the first sharpness of her grief.
        - id: ch04-b03
          speaker: narrator
          text: Still, Amy's heart was heavy. She longed to be home. Every day she looked wistfully across the lake and waited for Laurie to come comfort her.
        - id: ch04-b04
          speaker: narrator
          text: He came as quickly as he could. The same mail had carried letters to them both, but Laurie was in Germany, and his letter took several days to reach him. The moment he read it, he packed his knapsack, said goodbye to the friends who had been walking with him, and set out to keep his promise. His heart held joy and sorrow, hope and suspense, all at once.
        - id: ch04-b05
          speaker: narrator
          text: Laurie knew Vevay well. As soon as the boat touched the little quay, he hurried along the shore toward La Tour, where the Carrols were staying. Their garcon was distressed to report that the whole family had gone walking by the lake. Then he remembered that the fair-haired young lady might still be in the chateau garden.
        - id: ch04-b06
          speaker: garcon
          text: If monsieur will kindly sit down, I shall bring mademoiselle to him in a flash.
        - id: ch04-b07
          speaker: narrator
          text: Monsieur could not wait even that long. Before the garcon had finished, Laurie was already on his way to find Amy himself.
        - id: ch04-b08
          speaker: narrator
          text: The old garden stood beside the lovely lake. Chestnut branches rustled overhead, ivy climbed the walls, and the tower cast a long black shadow over the bright water. In one corner of the broad, low wall was a seat where Amy often came to read, work, or let the beauty around her ease her loneliness.
        - id: ch04-b09
          speaker: narrator
          text: She sat there that day with her head resting on one hand. Her eyes were heavy, and her heart ached for home. She was thinking about Beth and wondering why Laurie had not come. Amy did not hear him cross the courtyard. She did not see him stop beneath the arch that opened from the underground passage into the garden.
        - id: ch04-b10
          speaker: narrator
          text: Laurie stood there for a moment and looked at her with new eyes. He saw a tender part of Amy that no one had noticed before. Everything around her spoke silently of love and sorrow. Blotted letters lay in her lap. A black ribbon held back her hair. Pain and patience had made her face look older. Even the little ebony cross at her throat touched him, because he had given it to her and she wore it as her only ornament.
        - id: ch04-b11
          speaker: narrator
          text: If Laurie had wondered how Amy would receive him, all doubt vanished when she looked up. She dropped everything and ran straight to him.
        - id: ch04-b12
          speaker: amy
          text: Oh, Laurie! Laurie, I knew you'd come to me!
          emotion: sad
        - id: ch04-b13
          speaker: narrator
          text: In that moment, everything between them seemed to be said and settled. They stood together in silence, his dark head bent protectively over her fair one. Amy knew that no one else could comfort and support her so well. Laurie knew that Amy was the one woman who could take Jo's place and make him happy. He did not tell her. She did not need him to. They both felt the truth, and they gladly let silence hold it for them.
        - id: ch04-b14
          speaker: narrator
          text: After a moment, Amy returned to her seat and dried her tears. Laurie gathered the papers she had dropped. Among them he saw well-worn letters and revealing sketches, and he took them as hopeful signs. When he sat beside her, Amy suddenly grew shy. Remembering how she had rushed to greet him, she turned bright red.
        - id: ch04-b15
          speaker: amy
          text: I couldn't help it. I was so lonely and unhappy, and seeing you made me so glad. I looked up and there you were, just when I was beginning to fear you wouldn't come. I never expected it.
        - id: ch04-b16
          speaker: laurie
          text: I started the minute I heard. I wish I knew what to say about dear little Beth. I want to comfort you, but all I can do is feel it with you, and...
          emotion: sad
        - id: ch04-b17
          speaker: narrator
          text: Laurie could go no farther. He suddenly became shy too and lost the words he needed. He wanted to put Amy's head on his shoulder and let her cry, but he did not dare. Instead, he took her hand and gave it a gentle, understanding squeeze. That comforted her better than words.
        - id: ch04-b18
          speaker: amy
          text: You don't have to say anything. This is enough. Beth is safe and happy, and I mustn't wish her back. But I dread going home, even though I ache to see everyone. Let's not talk about it now. It makes me cry, and I want to enjoy having you here. You don't have to leave right away, do you?
          emotion: sad
        - id: ch04-b19
          speaker: laurie
          text: Not if you want me to stay, dear.
        - id: ch04-b20
          speaker: amy
          text: I do. I want it so much. Aunt and Flo are very kind, but you feel like family. Having you here for a little while would be such a comfort.
        - id: ch04-b21
          speaker: narrator
          text: Amy looked and sounded like a homesick child with a heart too full for her. Laurie's shyness disappeared. He gave her exactly what she needed, the loving attention she was used to and cheerful talk to draw her thoughts away from sorrow.
        - id: ch04-b22
          speaker: laurie
          text: You poor little thing. You look as though you've grieved yourself half sick. I'm taking care of you now. No more crying. Come walk with me. The wind is too chilly for you to sit here.
        - id: ch04-b23
          speaker: narrator
          text: His voice was half tender and half commanding, just as Amy liked it. He tied on her hat, drew her arm through his, and began walking with her under the new leaves of the chestnut trees. Laurie felt more comfortable once he was moving. Amy was glad to lean on a strong arm, see a familiar face smiling at her, and hear a kind voice talking for her alone.
    - id: ch05
      title: Happy Days by the Lake
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: That old garden had sheltered many pairs of lovers. It seemed made for Laurie and Amy, sunny and hidden away, with only the tower watching them and the broad lake below carrying off the echo of their voices. For an hour they walked and talked. Sometimes they rested on the wall. The place and the hour seemed touched with sweetness. At last, an ordinary dinner bell called them away. By then, Amy felt as if she had left her burden of loneliness and grief behind in the garden.
        - id: ch05-b02
          speaker: narrator
          text: The moment Aunt Carrol saw Amy's changed face, a new idea lit up her mind.
        - id: ch05-b03
          speaker: aunt_carrol
          text: Now I understand! The child has been pining for young Laurence. Good gracious, I never imagined such a thing.
        - id: ch05-b04
          speaker: narrator
          text: Aunt Carrol wisely kept the discovery to herself and gave no sign that she understood. She warmly urged Laurie to stay. She also told Amy to enjoy his company, because it would do her more good than so much time alone. Amy obeyed beautifully. Her aunt was busy with Flo, so Amy was left to entertain her friend, and she did it better than ever before.
        - id: ch05-b05
          speaker: narrator
          text: At Nice, Laurie had lounged while Amy scolded him. At Vevay, he was never idle. He walked, rode, rowed, or studied with tremendous energy. Amy admired everything he did and followed his example as far and as quickly as she could. Laurie claimed the climate had changed him. Amy was happy to use the same excuse for her own returning health and cheerfulness, so she did not disagree.
        - id: ch05-b06
          speaker: narrator
          text: The brisk air helped them both. So did the exercise. Their thoughts grew healthier along with their bodies. Up among those lasting hills, life and duty seemed clearer. Fresh winds carried away gloomy doubts, false dreams, and dark moods. Warm spring sunlight brought hopeful plans and tender thoughts. It seemed as if the lake washed the old troubles away, while the great mountains looked kindly down and told the two young people to love one another.
        - id: ch05-b07
          speaker: narrator
          text: In spite of their new sorrow, those days were very happy. Laurie was so happy that he could not bear to disturb them by speaking openly. It took him time to recover from the surprise of being cured of his first love, the love he had believed would be his last and only one.
        - id: ch05-b08
          speaker: narrator
          text: He eased his conscience by remembering that Amy was Jo's sister and therefore almost part of Jo herself. He was certain he could not have loved any woman but Amy so soon or so deeply. Looking back on his first courtship felt like looking down a long road. It had been stormy, full of pain and passion. He remembered it with both regret and compassion. He was not ashamed. He put it away as one of life's bitter and sweet experiences, something he could be grateful for after the pain had ended.
        - id: ch05-b09
          speaker: narrator
          text: This second courtship, Laurie decided, would be quiet and simple. They needed no dramatic scene. He hardly needed to tell Amy he loved her. She already knew, and she had given him her answer long before. Everything had happened so naturally that no one could object. The whole family would be pleased, even Jo.
        - id: ch05-b10
          speaker: narrator
          text: Still, once a first young love has been crushed, the heart moves carefully when it tries again. Laurie let the days pass. He enjoyed every hour and trusted chance to bring out the one word that would end the earliest and sweetest part of their new romance.
    - id: ch06
      title: Pulling in the Same Boat
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Laurie had imagined that the great moment would come by moonlight in the chateau garden, with perfect grace and dignity. It happened in exactly the opposite way. The matter was settled at noon, out on the lake, in a few plain words.
        - id: ch06-b02
          speaker: narrator
          text: They had spent the morning drifting from shadowy St. Gingolf toward sunny Montreux. The Alps of Savoy rose on one side. Mont St. Bernard and the Dent du Midi stood on the other. Vevay lay prettily in the valley, with Lausanne on the distant hill. Above them was a cloudless blue sky. Below was an even bluer lake, scattered with boats that looked like white-winged gulls.
        - id: ch06-b03
          speaker: narrator
          text: As they passed Chillon, Amy and Laurie talked about Bonnivard. Looking up toward Clarens, they spoke of Rousseau, who had written his Heloise there. Neither of them had read it. They knew only that it was a love story, and each privately wondered whether it could be half as interesting as their own.
        - id: ch06-b04
          speaker: narrator
          text: A little silence fell between them. Amy trailed one hand in the water. When she looked up, Laurie had stopped rowing and was leaning on his oars. There was something in his eyes that made her speak quickly, only because she had to say something.
        - id: ch06-b05
          speaker: amy
          text: You must be tired. Why don't you rest and let me row for a while? It will be good for me. Ever since you came, I've done nothing but be lazy and let you take care of me.
        - id: ch06-b06
          speaker: laurie
          text: I'm not tired. You can take one oar if you want. There's enough room, though I'll have to move toward the middle or the boat won't balance.
        - id: ch06-b07
          speaker: narrator
          text: Laurie sounded as if he rather liked that arrangement. Amy realized that her suggestion had not helped her escape the moment. She took the third of the seat he offered, shook her hair forward to hide her face, and accepted an oar.
        - id: ch06-b08
          speaker: narrator
          text: Amy rowed well, as she did many things. She used both hands while Laurie used only one, but their oars moved in time and sent the boat smoothly over the water.
        - id: ch06-b09
          speaker: amy
          text: We do row well together, don't we?
        - id: ch06-b10
          speaker: narrator
          text: Amy could not bear the silence just then. Laurie answered her very tenderly.
        - id: ch06-b11
          speaker: laurie
          text: So well that I wish we could always be in the same boat. Will you, Amy?
        - id: ch06-b12
          speaker: amy
          text: Yes, Laurie.
          emotion: happy
        - id: ch06-b13
          speaker: narrator
          text: Both of them stopped rowing. Without meaning to, they made a lovely little picture of human love and happiness among all the shifting reflections on the lake.
