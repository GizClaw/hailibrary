audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温柔克制，哀而不伤，怀着安静的慈爱
        timbre: 清澈柔和的成年女声
        pace: 舒缓从容，沉痛处略慢
        pitch: 中音
    amy:
      display_name: 艾米
      tts:
        delivery: 讲究而伶俐，成熟中仍带少女的直率
        timbre: 清脆明亮的年轻女声
        pace: 适中，兴奋时轻快
        pitch: 中高音
    laurie:
      display_name: 劳里
      tts:
        delivery: 风趣亲切，表面的懒散下藏着低落
        timbre: 清朗温暖的年轻男声
        pace: 从容，真情流露时稍快
        pitch: 中音
    mrs_grundy:
      display_name: 格伦迪太太
      tts:
        delivery: 武断世故，带着不以为然的口气
        timbre: 稍显尖利的成年女声
        pace: 适中
        pitch: 中高音
    mrs_carrol:
      display_name: 卡罗尔太太
      tts:
        delivery: 热心爽快，恍然大悟时格外生动
        timbre: 饱满亲切的成年女声
        pace: 适中偏快
        pitch: 中音
  chapters:
    - id: ch01
      title: 才华与天才
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 艾米那一顿训话，确实让劳里得了好处。当然，他过了很久才肯承认。男人常常这样。女人出了主意，这些“万物之主”得先让自己相信，那本来就是他们的打算，才会照着做。做成了，他们分给所谓“柔弱的器皿”一半功劳。做砸了，他们倒很大方，把全部功劳都送给她。
        - id: ch01-b02
          speaker: narrator
          text: 劳里回到祖父身边，连续几个星期尽心陪伴，乖顺极了。老人家惊叹他简直脱胎换骨，认定是尼斯的气候把他调养好了，便劝他再去一次。劳里再乐意不过，可挨过艾米的责骂以后，就算用大象拉，他也不肯回去。自尊心不许。每逢思念太强，他便拿那两句话撑住自己。
        - id: ch01-b03
          speaker: amy
          text: 我瞧不起你。去做一件了不起的事，让她爱上你。
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 劳里反复琢磨，终于勉强承认，自己从前确实自私又懒散。不过他又觉得，一个男人遭逢巨大不幸，总该获准任性胡闹，直到把苦日子熬完。他那段夭折的爱情已经死了。他会永远忠诚地哀悼，却不必逢人便展示丧服。乔不爱他，可他能做出一番事业，让乔尊敬他、钦佩他，也证明一个姑娘说“不”，毁不了他的一生。他一直有心做点事情，从没打算就此沉沦。
        - id: ch01-b05
          speaker: narrator
          text: 至于艾米的忠告，那当然是多余的。他本来就想有所作为，只不过得先等那段爱情体面地下葬。如今葬礼办完了，他也可以藏起受伤的心，继续努力向前。
        - id: ch01-b06
          speaker: narrator
          text: 歌德把欢喜和悲伤写进诗里，劳里便决定把自己的情伤封存在音乐里。他要谱一首《安魂曲》，让乔听得肝肠寸断，也让所有听众为之心碎。祖父下一次见他烦躁忧郁，叫他出去散心，他就去了维也纳。那里有他的音乐朋友，他也决心苦干一场，闯出名声。
        - id: ch01-b07
          speaker: narrator
          text: 可不知是悲伤太大，音乐装不下，还是音乐太空灵，托不起凡人的哀愁，他很快就发现，自己眼下写不了《安魂曲》。他的头脑还没恢复到能工作的状态，思绪也没有理顺。哀婉的曲调写到一半，他常会忽然哼起舞曲，立刻想起尼斯的圣诞舞会，尤其是那个胖法国人。悲剧创作也只好当场停下，至少暂时如此。
        - id: ch01-b08
          speaker: narrator
          text: 接着他又写歌剧。开头的时候，他觉得没什么办不到。他想让乔做女主角，便叫记忆送来一些温柔往事和浪漫幻景。谁知记忆背叛了他，好像也染上乔那股古怪劲儿，只肯搬出她的怪癖、缺点和荒唐模样。乔扎着花头巾拍地毯，用沙发靠垫筑堡垒，还学甘米奇太太，拿冷水浇灭他的热情。劳里每次都忍不住大笑，刚画出的忧郁美景也跟着毁了。
        - id: ch01-b09
          speaker: laurie
          text: 上帝保佑这姑娘吧，她可真会折磨人！
        - id: ch01-b10
          speaker: narrator
          text: 他抓着头发，活像个发狂的作曲家，只好放弃乔，去找一个比较听话的女主角，好用旋律让她永远留在人间。记忆这回殷勤得很，立刻送来一个幻影。她的脸不断变化，却总有金色头发，总裹在轻纱似的云雾中。玫瑰、孔雀、白色小马和蓝缎带围着她，乱得很迷人。劳里没有给她名字，却把她请进歌剧，还渐渐喜欢上她。他把世上一切才华和美德都赐给她，又护送她安然闯过那些足以消灭凡间女子的磨难。
        - id: ch01-b11
          speaker: narrator
          text: 靠着这股灵感，他一度写得很顺。后来作品渐渐失去魅力，他也忘了谱曲，只握笔发呆，或在繁华的城里四处闲逛，寻找新念头，也让纷乱的脑子清醒一下。那年冬天，他的心一直摇摆不定。事情没做多少，念头倒有许多。他也知道，自己正在不由自主地改变，却还说不清那究竟是什么变化。
        - id: ch01-b12
          speaker: laurie
          text: 也许是天才正在慢慢煨着。就让它煨吧，看看最后能熬出什么。
        - id: ch01-b13
          speaker: narrator
          text: 可他心里暗暗怀疑，那并不是天才，而是一种寻常得多的感情。不管是什么，这锅东西总算熬出了结果。劳里越来越厌烦散漫的生活，开始渴望真正而严肃的工作，愿意把身心都投进去。他终于明白，喜欢音乐的人，不一定都能作曲。
        - id: ch01-b14
          speaker: narrator
          text: 一天，他在皇家剧院听完一出精彩的莫扎特歌剧，回家翻看自己的作品，又弹了几段自认为最好的曲子。门德尔松、贝多芬和巴赫的半身像望着他，他也望着他们。几位大师神情慈祥。劳里忽然把乐谱一张张撕碎。最后一张从手里飘落时，他终于认真地承认了真相。
        - id: ch01-b15
          speaker: laurie
          text: 她说得对！才华并不是天才，硬说也没用。这场音乐除掉了我的虚荣，就像罗马除掉了她的虚荣。我不再冒充内行了。可是现在，我该做什么？
    - id: ch02
      title: 余烬不再燃烧
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这个问题很难回答。劳里甚至开始希望，自己也得挣钱糊口。他有钱，又没有事做。若想像从前说的那样“投奔魔鬼”，眼下正是好机会，因为撒旦最爱给富足又闲散的手安排差事。这个可怜的青年，外面的诱惑不少，心里的诱惑也不少，他却抵挡得不错。他看重自由，更看重信义和别人对他的信任。他答应过祖父，也希望自己能坦荡地看着那些爱他的女人，说一声“一切都好”。这些愿望让他稳稳走在正路上。
        - id: ch02-b02
          speaker: mrs_grundy
          text: 我才不信。男孩总归是男孩，年轻人总得撒一回野麦种，女人可不能指望奇迹。
        - id: ch02-b03
          speaker: narrator
          text: 格伦迪太太，我知道您不信，可这仍是真的。女人已经创造了不少奇迹。只要她们不再附和这种话，说不定还能把男子汉的标准提高一些。男孩尽管保留男孩的样子，越久越好。年轻人若一定要撒野麦种，也由他们去。不过母亲、姐妹和朋友若真心相信，他们能够忠于那些在善良女人眼中最有男子气概的美德，就能让野麦少长一些，也能挡住许多稗子，不让它们毁掉收成。
        - id: ch02-b04
          speaker: narrator
          text: 如果这只是女人的幻想，就让我们能享受多久，便享受多久。没有它，人生会失去一半的美与浪漫。忧伤的预感也会使我们的希望全都变苦。我们所盼望的，是那些勇敢、心软的小男孩。他们依然爱母亲胜过自己，也不怕承认这一点。
        - id: ch02-b05
          speaker: narrator
          text: 劳里以为，忘记乔会耗去自己多年的全部力气。没想到这件事一天比一天容易。起初他不肯信，为此生自己的气，又怎么也想不明白。可人的心奇妙又别扭，时间和天性从来不管我们愿不愿意，只照自己的意思办事。
        - id: ch02-b06
          speaker: narrator
          text: 劳里的心偏偏不疼了。伤口固执地愈合，而且快得让他吃惊。他原先拼命想忘记，现在却开始拼命回想。这变化来得突然，他一点准备也没有。他嫌弃自己，又惊讶自己如此薄情。那么沉重的打击，他竟这么快就好了。失望和轻松搅在一起，让他说不出是什么滋味。
        - id: ch02-b07
          speaker: narrator
          text: 他小心拨弄失恋留下的余烬，可它们就是不肯重新燃烧，只发出舒服的微光，温暖他，却不再让他发烧。他不得不承认，少年时代炽烈的痴情正变成一种安宁的感情。那里面仍有温柔，也有一点忧伤和怨意。等这些慢慢过去，最后留下的，会是直到生命尽头也不断绝的手足之情。
        - id: ch02-b08
          speaker: narrator
          text: 一次出神时，“手足”这个词忽然掠过他的心。他笑了，抬头看着面前的莫扎特画像。
        - id: ch02-b09
          speaker: laurie
          text: 他可是个伟人。娶不到姐姐，就娶了妹妹，后来也很幸福。
        - id: ch02-b10
          speaker: narrator
          text: 劳里只在心里想了这句话。下一刻，他亲了亲那枚旧戒指，又立刻反悔。
        - id: ch02-b11
          speaker: laurie
          text: 不，我不这么做！我没有忘记，也永远忘不了。我要再试一次。要是还不成，那就……
        - id: ch02-b12
          speaker: narrator
          text: 他没把话说完，抓过纸笔，给乔写信。只要还存着一丝她会回心转意的希望，他就无法安心做事。她难道不能、难道不肯让他回家，一起过幸福日子吗？等回信时，他什么也不做，却把这件事做得劲头十足，因为他急得发烧。
        - id: ch02-b13
          speaker: narrator
          text: 回信终于到了。至少有一件事彻底定了，乔不能，也不肯。她整颗心都在贝丝身上，再也不想听见“爱情”两个字。她请劳里和别人得到幸福，只要永远在心里留一个小角落，给爱他的乔姐姐。附言里，她叮嘱他别告诉艾米，贝丝的病又重了。艾米春天就会回来，不必让剩下的旅程蒙上阴影。到时再说也不迟，但愿上帝保佑。劳里得常写信，别让艾米孤单、想家或担心。乔的拒绝再明确不过，也把劳里最后一点希望彻底打消了。
        - id: ch02-b14
          speaker: laurie
          text: 我马上就写。可怜的小姑娘，她回家时一定会很伤心。
          emotion: sad
        - id: ch02-b15
          speaker: narrator
          text: 他打开书桌，仿佛给艾米写信，正好能接完几星期前那半句话。可那天，他没有写成。最好的信纸还没找出来，他先看见了别的东西。一个格子里，乔的几封信混在账单、护照和公务文件中。另一个格子里，艾米的三封短信却用她的蓝缎带仔细扎好，让人想起信中夹着的枯萎小玫瑰。
        - id: ch02-b16
          speaker: narrator
          text: 劳里的表情一半歉疚，一半好笑。他把乔的信全部收好，一封封抚平、折齐，放进小抽屉。他转着指上的戒指，站了一会儿，又慢慢摘下它，和信放在一起，锁上抽屉。接着，他去圣斯蒂芬教堂听大弥撒，心里像是刚办过一场葬礼。虽然没有悲痛欲绝，可剩下的半天这样度过，总比给迷人的年轻姑娘写信更合适。
    - id: ch03
      title: 书信往来
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 不过那封信很快还是寄出了，艾米也立刻回了信。她很想家，还用最可爱、最信赖人的口气坦白了。整个初春，两人的书信准时往返，从没有中断，通信兴旺得很。劳里卖掉半身像，把歌剧撕来点火，又回到巴黎，盼着某个人不久也会到那里。他非常想去尼斯，可没受到邀请，就坚决不去。艾米偏偏不请他。那时她也有了自己的小经历，很想避开“我们家男孩”那双爱取笑人的眼睛。
        - id: ch03-b02
          speaker: narrator
          text: 弗雷德·沃恩回来了，又问出那个问题。艾米以前已经想好，要回答“好，谢谢你”。可真正到了这一天，她的勇气却消失了。
        - id: ch03-b03
          speaker: amy
          text: 不，谢谢你。
        - id: ch03-b04
          speaker: narrator
          text: 她说得温和，却很坚定。她终于发现，光有金钱和地位，并不能满足心里那份新渴望。那里如今装满了温柔的希望和忧惧。劳里说过，弗雷德是个好人，却不是他想象中艾米会喜欢的人。那句话，还有劳里说话时的脸，总在她脑中出现。她自己那副表情也跟着回来。即使没说出口，她脸上也清楚写着，自己要为钱结婚。
        - id: ch03-b05
          speaker: narrator
          text: 艾米如今想起这些，十分不安。那想法太无情，她真希望能收回。她不愿劳里把她看成冷酷势利的人。比起当社交界的女王，她现在更想成为一个值得别人爱的人。她说过那么难听的话，劳里没有恨她，反而宽容地接受，还比过去更体贴。想到这里，她很欣慰。
        - id: ch03-b06
          speaker: narrator
          text: 劳里的信也给她莫大的安慰。家信来得不规律，偶尔到了，也没有他的信那么令人满足。给他回信不只是快乐，简直还是责任。可怜的劳里孤零零的，乔又一直铁石心肠，他需要有人疼爱。艾米觉得，乔本该努力一下，试着爱他。这应该不会太难。能被这样可爱的男孩喜欢，多少人都会骄傲又欢喜。可乔从不肯像别的姑娘那样做事，谁也拿她没有办法。艾米也只好对劳里格外亲切，把他当哥哥看待，用姐妹般的关心安慰他。
        - id: ch03-b07
          speaker: narrator
          text: 要是天下的哥哥都能得到劳里那样的待遇，他们一定会幸福得多。艾米不再训他。她什么事都问他的意见，对他做的一切都有兴趣，还给他做小礼物，每星期寄两封信。信里有活泼的闲谈、姐妹间的秘密，也有四周美景的迷人素描。
        - id: ch03-b08
          speaker: narrator
          text: 很少有哥哥能享受这样的荣誉。妹妹把他的信装在衣袋里，带来带去，反复细读。信短了，她就哭。信长了，她就亲一亲。所有的信，她都小心收藏。当然，我们绝不暗示艾米做过这些多情又傻气的事。不过那个春天，她确实有些苍白，也有些安静。她不再热衷社交，常独自出去写生。
        - id: ch03-b09
          speaker: narrator
          text: 她回家时总拿不出多少作品，不过我想，她是在研究自然。她在瓦尔罗萨的露台上一坐就是几小时，双手交叠，心思却不知道去了哪里。偶尔她会漫不经心地画下墓碑上的威武骑士，或是一个年轻人睡在草地上，用帽子盖住眼睛。还有一位卷发姑娘，穿着华丽衣裙，挽着高个子绅士走过舞厅。按照最新的艺术时尚，两张脸都模糊一团。这样画很稳妥，却不能叫人完全满意。
        - id: ch03-b10
          speaker: narrator
          text: 姑妈以为艾米后悔拒绝弗雷德。否认没有用，解释又无从说起，艾米便随她怎么想，只留心让劳里知道，弗雷德去了埃及。消息只有这一句，劳里却明白了。他松了口气，还装出老成持重的样子。
        - id: ch03-b11
          speaker: laurie
          text: 我早知道她会重新想明白。可怜的老兄！这滋味我全尝过，我能体谅他。
        - id: ch03-b12
          speaker: narrator
          text: 劳里深深叹了口气，仿佛已经尽完对往事的责任。接着他把脚搁上沙发，舒舒服服地读起艾米的信。
    - id: ch04
      title: 城堡花园
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 海外发生这些变化时，家里已经遭逢不幸。那封说贝丝日渐衰弱的信，一直没到艾米手里。下一封信找到她时，妹妹坟上的草已经绿了。噩耗传到韦威。五月的暑热把一家人赶出尼斯，他们经过热那亚和意大利湖区，慢慢游历到瑞士。
        - id: ch04-b02
          speaker: narrator
          text: 艾米承受得很好，也安静地服从家人的决定，不提前结束这次旅行。既然已经来不及和贝丝告别，她不如留下，让距离慢慢减轻悲痛。可她的心沉重极了。她无比想家，每天都带着盼望望向湖面，等待劳里来安慰她。家人希望缺席能让伤痛柔和一些，艾米也不愿违背他们的心意。
        - id: ch04-b03
          speaker: narrator
          text: 同一班邮件也把消息送给了劳里。他当时身在德国，过了几天才收到。信一读完，他立刻收拾背包，辞别徒步同行的伙伴，出发履行承诺。一路上，他心里既有欢乐和希望，也有悲伤和忐忑。
        - id: ch04-b04
          speaker: narrator
          text: 劳里很熟悉韦威。船刚靠上小码头，他便沿着湖岸赶往拉图尔，卡罗尔一家就寄宿在那里。男侍者万分懊恼地说，全家都去湖上散步了。不过金发小姐也许还在城堡花园。先生若肯屈尊坐下，只要“一道闪电的工夫”，他就能把小姐请来。可先生连这么一点时间也等不了。男侍者话还没说完，他已经自己去找人了。
        - id: ch04-b05
          speaker: narrator
          text: 那是一座宜人的老花园，就在秀丽的湖边。栗树在头顶沙沙作响，常春藤爬得到处都是，高塔的黑影远远落在明亮的水面上。低矮宽阔的围墙有一角安着座位。艾米常来这里读书、做活，也借四周的美景安慰自己。
        - id: ch04-b06
          speaker: narrator
          text: 那天，她一手托头坐在那里。想家的心很难过，眼睛也沉重疲倦。她想着贝丝，又奇怪劳里为什么还没来。她没有听见他穿过远处的庭院，也没看见他停在连接地下通道和花园的拱门下。
        - id: ch04-b07
          speaker: narrator
          text: 劳里用一双全新的眼睛望了她一会儿。他看见了从来没人见过的东西，那是艾米性情里温柔的一面。她身边的一切都在默默说着爱和悲伤。膝头的信满是泪痕，黑缎带束着头发，脸上有成年女子的痛苦与忍耐。就连颈间的小乌木十字架，也让他觉得心酸。那是他送的，如今成了她唯一的饰物。
        - id: ch04-b08
          speaker: narrator
          text: 如果劳里还怀疑她会怎样迎接自己，那么艾米一抬头，所有疑虑就消失了。她看见他，丢下手里的东西，立刻奔过来。那声音里的爱意和盼望，再清楚不过。
        - id: ch04-b09
          speaker: amy
          text: 啊，劳里，劳里，我就知道你会到我这里来！
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: 我想，所有话都在那一刻说完了，所有事情也定了下来。他们默默站在一起。黑发的头低下来，护着浅色的头发。艾米觉得，世上没人能像劳里这样安慰她、支撑她。劳里也认定，只有艾米能填补乔留下的位置，让他幸福。他没有说出口，艾米却不失望。两个人都明白了，也都满足了。他们愿意把剩下的一切留给沉默。
        - id: ch04-b11
          speaker: narrator
          text: 过了一会儿，艾米回到座位擦眼泪。劳里替她捡起散落的纸张，看见那些读旧的信和意味深长的素描，觉得都是未来的好兆头。他在她旁边坐下。艾米想起刚才冲动地迎接他，又害羞起来，脸也红了。
        - id: ch04-b12
          speaker: amy
          text: 我真的忍不住。我那么孤单，那么难过，看见你来，心里实在太高兴了。我刚开始担心你不会来，一抬头却发现你就在这里，真让我不敢相信。
          emotion: sad
        - id: ch04-b13
          speaker: laurie
          text: 我一听到消息就赶来了。我真想说点什么，安慰你失去亲爱的贝丝。可我只会陪你一起难过，而且……
          emotion: sad
        - id: ch04-b14
          speaker: narrator
          text: 劳里也突然害羞，没法再说下去。他想让艾米把头靠在自己肩上，劝她好好哭一场，却又不敢。最后，他只握住她的手，同情地轻轻捏了一下。这个动作比话更能安慰她。
        - id: ch04-b15
          speaker: amy
          text: 你不必说什么，这样已经是在安慰我了。贝丝现在很好，也很幸福，我不该盼她回来。可我虽然那么想见家里每一个人，心里又实在怕回去。我们现在别说这个吧，一说我就想哭。你在的时候，我只想好好和你待在一起。你不用马上回去，对不对？
          emotion: sad
        - id: ch04-b16
          speaker: laurie
          text: 只要你想让我留下，我就不走，亲爱的。
        - id: ch04-b17
          speaker: amy
          text: 我太想了。姑妈和弗洛对我都很好，可你像家里人一样。你陪我一阵子，我会安心很多。
        - id: ch04-b18
          speaker: narrator
          text: 艾米的语气和神情都像个想家又满腹委屈的孩子。劳里一下忘了害羞，给了她最需要的东西。那是她熟悉的疼爱，也是她此刻缺不了的愉快谈话。
        - id: ch04-b19
          speaker: laurie
          text: 可怜的小家伙，你都快把自己伤心得病倒了！以后由我照顾你。别再哭，起来陪我走走。风这么凉，你不能一直坐着。
        - id: ch04-b20
          speaker: narrator
          text: 他一半宠爱，一半命令，正合艾米心意。劳里替她系好帽子，让她挽住自己的胳膊。两人沿着阳光照亮的小路来回走，头顶是刚长出新叶的栗树。劳里一走动就自在多了。艾米也喜欢有一条有力的手臂可以依靠，有熟悉的脸向她微笑，还有亲切的声音，只说给她一个人听。
        - id: ch04-b21
          speaker: narrator
          text: 这座古雅的花园庇护过许多恋人，仿佛就是为他们建的。园中明亮又安静，只有高塔会俯视他们，只有下方宽阔的湖水会带走他们话语的回声。整整一个钟头，这对新恋人边走边谈，或靠着围墙休息。时间和地点本来就很迷人，两个人相伴以后，一切又添上一层甜美。直到一阵毫不浪漫的晚餐铃催他们离开，艾米才发现，自己已经把孤独与悲伤的重担留在花园里。
        - id: ch04-b22
          speaker: narrator
          text: 卡罗尔太太一看见艾米变了模样，忽然明白了一切。
        - id: ch04-b23
          speaker: mrs_carrol
          text: 原来是这样！这孩子一直在苦苦思念年轻的劳伦斯。天哪，我以前怎么没想到？
          emotion: surprised
        - id: ch04-b24
          speaker: narrator
          text: 这位好心的太太很谨慎，什么也没说，脸上也没露出恍然大悟的样子。她热情地劝劳里留下，又请艾米好好享受他的陪伴。这比长时间独处更能使她恢复。艾米百依百顺。姑妈常忙着照顾弗洛，招待劳里的任务便落在艾米身上，而她完成得比平时还好。卡罗尔太太既没有点破，也没有妨碍，只悄悄给两个年轻人留出相处的时间。
    - id: ch05
      title: 同乘一条船
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 在尼斯，劳里懒散度日，艾米训斥他。到了韦威，劳里再也不闲着。他精神十足地散步、骑马、划船、读书。艾米欣赏他做的每一件事，也尽自己的体力和速度跟着学。他说，变化都归功于当地气候。艾米没有反驳，因为她的健康和精神也恢复了，正好用同一个理由解释。
        - id: ch05-b02
          speaker: narrator
          text: 清新的空气对他们都很好，大量活动不只改善身体，也让心灵发生健康的变化。在亘古的群山之间，两人仿佛把人生和责任看得更清楚。风吹走了沮丧的疑虑、迷惑人的幻想和阴沉的心绪。温暖的春光唤醒向上的念头、温柔的希望与快乐的心思。湖水仿佛洗净了过去的烦恼，雄伟的老山则仁慈地望着他们。
        - id: ch05-b03
          speaker: narrator
          text: 群山像是在说，孩子们，彼此相爱吧。
        - id: ch05-b04
          speaker: narrator
          text: 尽管刚刚遭逢新的悲痛，这仍是一段非常幸福的日子。劳里幸福得舍不得用一句话惊扰它。他曾认定最初的爱情也是最后、唯一的爱情。如今它竟然好了，他过了一阵才从惊讶中恢复。为了安慰自己那一点不忠的感觉，他想，乔的妹妹和乔本人差不多。除了艾米，他不可能这么快、这么深地爱上另一个女人。
        - id: ch05-b05
          speaker: narrator
          text: 第一次求爱像一场暴风雨。现在回头看，中间仿佛隔了很多年。他既怜惜当时的自己，也有些遗憾，却并不羞愧。他把那段往事收进人生里，承认它又苦又甜。等疼痛过去，他甚至会感谢这段经历，因为它也成了他生命的一部分。
        - id: ch05-b06
          speaker: narrator
          text: 第二次求爱，他决定要平静，也要简单。不必演出一场大戏，甚至几乎不必告诉艾米，他爱她。她不听这句话也早已知道，答案也早就给了他。事情来得那么自然，谁都不会抱怨。劳里知道，每个人都会高兴，连乔也会。第一回的激烈风波已经过去，这一回，他只想让感情安安静静地长成。
        - id: ch05-b07
          speaker: narrator
          text: 不过最初那点痴情被压碎以后，人们第二次尝试时，总会更谨慎，也更迟缓。劳里便让日子一天天过去，享受每一个时辰。他把那句将结束新恋情最初、也最甜美阶段的话，留给机会去说。
        - id: ch05-b08
          speaker: narrator
          text: 他原以为，结局会发生在月光下的城堡花园里，而且一定优雅得体。事实却完全相反。事情在正午的湖上，只用几句直白的话就定了下来。
        - id: ch05-b09
          speaker: narrator
          text: 那天上午，他们一直在湖面漂荡。从阴沉的圣然戈尔夫，到阳光明亮的蒙特勒。一边是萨伏依的阿尔卑斯群峰，另一边是大圣伯纳山和米迪峰。秀丽的韦威坐落在谷地，远处山坡上是洛桑。天空湛蓝无云，湖水比天空还蓝。风姿如画的小船散布在水面上，远远望去，像一只只白翅海鸥。四周开阔明净，正午的阳光把一切都照得清清楚楚。
        - id: ch05-b10
          speaker: narrator
          text: 小船滑过西庸城堡时，他们谈起博尼瓦。抬头望见克拉朗，又说到卢梭在那里写的《新爱洛伊丝》。两人都没读过那本书，只知道那是个爱情故事。两个人也都在暗暗猜想，不知道书里的故事，有没有他们自己的故事一半有趣。
        - id: ch05-b11
          speaker: narrator
          text: 他们沉默了一会儿。艾米把手伸进水里拨弄。她抬头时，看见劳里倚着船桨。那双眼睛里的神情让她赶紧开口，只想随便说点什么。
        - id: ch05-b12
          speaker: amy
          text: 你一定累了。歇一会儿，让我来划。划船对我有好处。自从你来了，我简直又懒又贪图舒服。
        - id: ch05-b13
          speaker: laurie
          text: 我不累。不过你要是愿意，可以拿一支桨。地方倒是够，只是我得差不多坐到正中间，不然船可平衡不了。
        - id: ch05-b14
          speaker: narrator
          text: 劳里似乎很喜欢这个安排。艾米觉得，自己并没有让局面好转多少。她只坐了递给她的三分之一个座位，把头发抖落到脸前，接过一支桨。她划船和做别的事情一样熟练。艾米用两只手，劳里只用一只，可两支桨仍合着同一个节拍，小船平稳地穿过水面。
        - id: ch05-b15
          speaker: amy
          text: 我们俩配合得真好，是不是？
        - id: ch05-b16
          speaker: narrator
          text: 那一刻，艾米实在受不了沉默。
        - id: ch05-b17
          speaker: laurie
          text: 好得让我希望，我们永远都能同乘一条船。艾米，你愿意吗？
        - id: ch05-b18
          speaker: amy
          text: 我愿意，劳里。
          emotion: happy
        - id: ch05-b19
          speaker: narrator
          text: 两人同时停下船桨。湖面倒映的景色正在变幻、消融，他们无意间也为那片景色添上了一幅人间爱意与幸福的美丽小画。
