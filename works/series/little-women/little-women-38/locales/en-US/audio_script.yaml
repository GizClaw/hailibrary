audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "warm, observant, and gently playful", timbre: "clear and inviting", pace: measured, pitch: medium}
    amy:
      display_name: Amy
      tts: {delivery: "poised, expressive, and lightly dramatic", timbre: "smooth and bright", pace: measured, pitch: medium-high}
    laurie:
      display_name: Laurie
      tts: {delivery: "playful, confident, and warmly teasing", timbre: "youthful and resonant", pace: lively, pitch: medium}
    aunt_carrol:
      display_name: Aunt Carrol
      tts: {delivery: "cultivated, discreet, and gently appraising", timbre: "soft and mature", pace: measured, pitch: medium}
  chapters:
    - id: ch01
      title: Christmas on the Promenade
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At three in the afternoon, fashionable Nice gathered on the Promenade des Anglais. The broad walk ran between the sea and a grand avenue of hotels and villas. Palms, flowers, and tropical shrubs bordered it, with orange orchards and hills beyond. On a sunny day, it looked as bright as a carnival. Proud English, lively French, sober Germans, handsome Spaniards, ugly Russians, meek Jews, and easygoing Americans drove, sat, and strolled there. Every sort of language and costume mingled in the crowd. People traded news and discussed whichever celebrity had just arrived, whether it was Ristori or Dickens, Victor Emmanuel or the Queen of the Sandwich Islands. Even the carriages drew attention, especially the low little barouches driven by ladies behind lively ponies, with bright nets holding in their enormous skirts and tiny grooms perched behind.
        - id: ch01-b02
          speaker: narrator
          text: On Christmas Day, a tall young man moved slowly along that walk, his hands behind him and his thoughts far away. He looked Italian, dressed English, and carried himself like an independent American. Women watched him with approval. Fashionable young men in black velvet, rose-colored ties, buff gloves, and orange flowers shrugged, then envied his height. Pretty faces were everywhere, but he hardly noticed them. Now and then, though, he glanced at a blonde girl in blue.
        - id: ch01-b03
          speaker: narrator
          text: He left the promenade and paused at a crossing, unsure whether to hear the band in the public garden or walk along the beach toward Castle Hill. Then he heard ponies trotting quickly. A small carriage came down the street with one young lady inside. She was young, blonde, and dressed in blue. He stared. Suddenly his whole face came alive. He waved his hat like a boy and hurried to meet her.
        - id: ch01-b04
          speaker: amy
          text: Oh, Laurie, is it really you? I was beginning to think you'd never come!
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: Amy dropped the reins and held out both hands. A French mother nearby was so shocked by these free English manners that she hurried her daughter away.
        - id: ch01-b06
          speaker: laurie
          text: I was delayed on the way. But I promised you Christmas, and here I am.
        - id: ch01-b07
          speaker: amy
          text: How is your grandfather? When did you arrive? And where are you staying?
        - id: ch01-b08
          speaker: laurie
          text: He's very well. I came last night, and I'm at the Chauvain. I stopped by your hotel, but you were out.
        - id: ch01-b09
          speaker: amy
          text: I have so much to tell you that I can't choose where to start. Get in, and we'll talk comfortably. I was going for a drive and wishing for company. Flo is saving her strength for tonight.
        - id: ch01-b10
          speaker: laurie
          text: What's happening tonight? A ball?
        - id: ch01-b11
          speaker: amy
          text: A Christmas party at our hotel. A lot of Americans are staying there, and they're giving it for the holiday. You'll come with us, of course. Aunt will be delighted.
        - id: ch01-b12
          speaker: laurie
          text: Thank you. Where are we going now?
        - id: ch01-b13
          speaker: narrator
          text: Laurie leaned back and folded his arms. That suited Amy, who preferred to drive. She took great pleasure in her parasol whip, her blue reins, and the white ponies in front of her.
        - id: ch01-b14
          speaker: amy
          text: First to the bankers for letters, then up to Castle Hill. The view is lovely, and I enjoy feeding the peacocks. Have you been there?
        - id: ch01-b15
          speaker: laurie
          text: Often, years ago. But I don't mind seeing it again.
        - id: ch01-b16
          speaker: amy
          text: Now tell me everything about yourself. The last news I had was from your grandfather. He expected you back from Berlin.
        - id: ch01-b17
          speaker: laurie
          text: I stayed there a month, then joined him in Paris. He's settled there for the winter. He has friends and plenty to keep him busy, so I come and go, and we manage very well.
        - id: ch01-b18
          speaker: amy
          text: That sounds like a very sociable arrangement.
        - id: ch01-b19
          speaker: narrator
          text: Something was missing from Laurie's manner, though Amy could not say what it was.
        - id: ch01-b20
          speaker: laurie
          text: He hates traveling, and I hate staying still, so we each do as we like. I spend plenty of time with him. He enjoys hearing about my adventures, and I like knowing someone is glad when I return from wandering. What a dirty old place this is.
        - id: ch01-b21
          speaker: narrator
          text: He looked around in disgust as they drove through the old city toward the Place Napoleon.
        - id: ch01-b22
          speaker: amy
          text: The dirt is picturesque, so it doesn't bother me. I love the river and hills, and those quick views into the narrow side streets. We'll have to wait now. That procession is going to the Church of Saint John.
        - id: ch01-b23
          speaker: narrator
          text: Priests passed beneath their canopies. White-veiled nuns carried lighted candles, and a brotherhood dressed in blue chanted as it walked. Laurie watched without interest. Amy watched Laurie. A new shyness came over her because he had changed. The merry-faced boy she remembered had become a moody-looking man. He was handsomer and more polished than ever, but once the first pleasure of meeting faded, he looked tired and spiritless. He was not ill or exactly unhappy. Still, he seemed older and graver than a year or two of easy living could explain.
        - id: ch01-b24
          speaker: narrator
          text: Amy did not understand, and she did not dare question him. She shook her head and urged on the ponies after the procession crossed the bridge and disappeared into the church.
        - id: ch01-b25
          speaker: amy
          text: Que pensez-vous? What are you thinking?
        - id: ch01-b26
          speaker: laurie
          text: I'm thinking that mademoiselle has used her time well. The result is charming.
        - id: ch01-b27
          speaker: narrator
          text: He bowed with one hand on his heart and gave her an admiring look. Amy blushed, but the compliment did not please her the way his honest praise had at home. Back then, he would circle her at a party, call her altogether jolly, smile warmly, and pat her head. This new tone sounded careless, no matter what his eyes said.
        - id: ch01-b28
          speaker: narrator
          text: Amy wished he had stayed a boy if this was how he meant to grow up. Disappointed and uncomfortable, she tried to remain cheerful.
    - id: ch02
      title: Letters and Castle Hill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At the bank, Amy found the precious letters from home. She handed Laurie the reins and read with delight while the carriage climbed a shady road between green hedges. Tea roses bloomed there as freshly as if it were June.
        - id: ch02-b02
          speaker: amy
          text: Mother says Beth is very poorly. I often feel that I should go home. But everyone tells me to stay, so I do. I'll never have another chance like this.
          emotion: sad
        - id: ch02-b03
          speaker: narrator
          text: She looked solemnly at the page.
        - id: ch02-b04
          speaker: laurie
          text: I think you're doing the right thing. You couldn't help much at home, and it comforts them to know you're healthy, happy, and making the most of this, my dear.
          emotion: calm
        - id: ch02-b05
          speaker: narrator
          text: He moved a little closer and looked more like his old self. The fear that sometimes weighed on Amy grew lighter. His face, his nearness, and that brotherly "my dear" seemed to promise that if trouble came, she would not face it alone in a strange country.
        - id: ch02-b06
          speaker: narrator
          text: Soon she laughed and showed him a little drawing of Jo in her writing clothes. The bow on Jo's cap stood wildly upright, and the words coming from her mouth read, "Genius burns!"
        - id: ch02-b07
          speaker: narrator
          text: Laurie smiled, took the sketch, and slipped it into his vest pocket, claiming he was keeping it from blowing away. Then he listened closely while Amy read the lively letter aloud.
        - id: ch02-b08
          speaker: amy
          text: This is going to be a perfectly merry Christmas. Presents this morning, you and letters this afternoon, and a party tonight.
          emotion: happy
        - id: ch02-b09
          speaker: narrator
          text: They stepped out among the ruins of the old fort. A flock of splendid peacocks hurried toward them, tame and ready to be fed. Amy stood on the bank above Laurie, laughing as she scattered crumbs among the shining birds. Now he studied her as she had studied him, curious about what time and distance had changed.
        - id: ch02-b10
          speaker: narrator
          text: He found nothing troubling and much to admire. A few small affectations had crept into her speech and manner, but she was still lively and graceful. Now she also had that hard-to-name elegance of dress and bearing. Amy had always seemed mature for her age. Travel had given her more confidence in the way she moved and talked, so she looked more worldly than she truly was. Yet her old impatience still appeared now and then. Her strong will remained, and foreign polish had not spoiled her natural honesty.
        - id: ch02-b11
          speaker: narrator
          text: Laurie did not reason through all of that while she fed the peacocks. He simply carried away the lovely image of a bright-faced girl in the warm sunshine. The light brought out the soft color of her dress, the fresh color in her cheeks, and the golden shine of her hair. With the brilliant birds gathering around her, Amy became the brightest figure in the whole pleasant scene.
        - id: ch02-b12
          speaker: narrator
          text: They climbed onto the stone platform at the top of the hill. Amy swept out a hand as if welcoming him to her favorite place.
        - id: ch02-b13
          speaker: amy
          text: Do you remember the cathedral and the Corso? The fishermen pulling their nets through the bay? That lovely road to Villa Franca? Schubert's Tower just below us? And best of all, that speck far out at sea that everyone says is Corsica?
        - id: ch02-b14
          speaker: laurie
          text: I remember. It hasn't changed much.
        - id: ch02-b15
          speaker: narrator
          text: There was no enthusiasm in his answer.
        - id: ch02-b16
          speaker: amy
          text: Just think what Jo would give to see that famous speck!
        - id: ch02-b17
          speaker: narrator
          text: Amy was in high spirits and wanted Laurie to be the same.
        - id: ch02-b18
          speaker: laurie
          text: Yes.
        - id: ch02-b19
          speaker: narrator
          text: That was all. But he turned and stared hard at the distant island. Someone more powerful than Napoleon had made it interesting to him now.
        - id: ch02-b20
          speaker: amy
          text: Look at it properly for Jo. Then come sit down and tell me what you've been doing all this time.
        - id: ch02-b21
          speaker: narrator
          text: Amy settled herself for a long talk, but she did not get one. Laurie sat beside her and answered every question willingly. Even so, she learned only that he had wandered around the Continent and visited Greece. They passed an idle hour, then drove back. Laurie paid his respects to Aunt Carrol and left, promising to return that evening.
    - id: ch03
      title: Amy Dresses for the Ball
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: That night, Amy deliberately made herself as pretty as she could. Time and absence had changed both young people. She no longer saw Laurie only as the boy who belonged to the family. Now she saw a handsome, agreeable man, and she naturally wanted him to admire her. Amy knew her best features and understood how to show them. For a pretty woman without much money, that sort of taste and skill can be a fortune.
        - id: ch03-b02
          speaker: narrator
          text: Tarlatan and tulle cost little in Nice, so Amy wrapped herself in clouds of them for parties. She followed the sensible English custom of dressing young girls simply. Fresh flowers, a few trinkets, and clever little touches gave her charming outfits without much expense. Sometimes the artist in her took command. Then she tried ancient hairstyles, statue-like poses, and classical draperies, arranging herself as carefully as one of her own pictures. At such moments, the woman gave way entirely to the artist. Everyone has a weakness or two, and hers was harmless. It is easy to forgive young vanity when it pleases the eye and makes the heart smile.
        - id: ch03-b03
          speaker: amy
          text: I really want him to think I look nice, and to tell everyone at home.
        - id: ch03-b04
          speaker: narrator
          text: She put on Flo's old white silk ball gown, then covered it with a fresh, misty layer of illusion. Her white shoulders and golden head rose from it to beautiful effect. She wisely left her hair nearly alone, gathering its thick waves and curls into a knot at the back of her head like the young goddess Hebe.
        - id: ch03-b05
          speaker: amy
          text: It may not be fashionable, but it suits me. I can't afford to make myself ugly.
        - id: ch03-b06
          speaker: narrator
          text: That was what Amy always said when someone urged her to frizz, puff, or braid her hair according to the newest style. She owned no jewels grand enough for the evening, so she looped her airy skirts with rosy azaleas and laid delicate green vines around her shoulders. Then she remembered her old painted boots and looked down with girlish delight at her white satin slippers. Alone in the room, she danced a few steps just to admire her aristocratic feet.
        - id: ch03-b07
          speaker: amy
          text: My new fan matches the flowers exactly. These gloves fit beautifully, and the real lace on Aunt's handkerchief makes the whole dress look finer. If only I had a classical nose and mouth, I would be perfectly happy.
        - id: ch03-b08
          speaker: narrator
          text: She held a candle in each hand and inspected herself critically. In spite of that unfortunate nose and mouth, she looked unusually bright and graceful when she went downstairs. Amy almost never ran. She believed it did not suit her. Being tall, she preferred to look stately and Juno-like instead of playful and pert.
        - id: ch03-b09
          speaker: narrator
          text: While she waited for Laurie in the long sitting room, she walked slowly back and forth. Once she placed herself under the chandelier because the light favored her hair. Then she felt ashamed of wanting his first view to be so carefully arranged and moved to the far end of the room. She could not have chosen better. Laurie entered so quietly that she did not hear him. At the distant window, her head half turned and one hand lifting her dress, her slim white figure stood against red curtains like a statue placed by an artist.
        - id: ch03-b10
          speaker: laurie
          text: Good evening, Diana!
        - id: ch03-b11
          speaker: narrator
          text: His eyes held exactly the pleased look Amy had hoped to see.
        - id: ch03-b12
          speaker: amy
          text: Good evening, Apollo!
        - id: ch03-b13
          speaker: narrator
          text: She smiled back. Laurie looked unusually handsome too, and the thought of entering the ballroom on his arm made her deeply pity the four plain Davis sisters.
        - id: ch03-b14
          speaker: laurie
          text: These are for you. I arranged them myself. I remembered that you don't like the sort of thing Hannah calls a "sot-bookay."
        - id: ch03-b15
          speaker: narrator
          text: He handed her a delicate bouquet in a holder she had long admired in Cardiglia's window.
        - id: ch03-b16
          speaker: amy
          text: Laurie, how kind! If I'd known you were coming, I would have prepared something for you today. Though I'm afraid it wouldn't have been this pretty.
          emotion: happy
        - id: ch03-b17
          speaker: laurie
          text: Thank you. The bouquet wasn't quite what it should be, but you've made it better.
        - id: ch03-b18
          speaker: narrator
          text: Amy fastened the silver bracelet of the holder around her wrist.
        - id: ch03-b19
          speaker: amy
          text: Please don't talk like that.
        - id: ch03-b20
          speaker: laurie
          text: I thought you liked compliments of that sort.
        - id: ch03-b21
          speaker: amy
          text: Not from you. It doesn't sound natural. I like your old, honest way better.
        - id: ch03-b22
          speaker: laurie
          text: I'm glad to hear it.
        - id: ch03-b23
          speaker: narrator
          text: Laurie looked relieved. Then he buttoned Amy's gloves and asked whether his tie was straight, just as he used to when they went to parties together at home.
    - id: ch04
      title: New Impressions at the Ball
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: That evening's company filled the hotel's long dining room. It was the kind of mixed gathering one saw only on the Continent. The generous Americans had invited everyone they knew in Nice. Since titles did not frighten them, they had collected a few noble guests to make their Christmas ball shine.
        - id: ch04-b02
          speaker: narrator
          text: A Russian prince sat in a corner for an hour talking to a massive woman in black velvet and pearls, dressed like Hamlet's mother. An eighteen-year-old Polish count devoted himself to the ladies, who declared him fascinating. A serene German nobleman had come alone for supper and wandered about searching for something to eat. Baron Rothschild's private secretary smiled on the world as if his employer's name had placed a golden halo on his head. A stout Frenchman who knew the Emperor came to satisfy his passion for dancing. Lady de Jones brought all eight members of her little family.
        - id: ch04-b03
          speaker: narrator
          text: There were lively American girls with light feet and sharp voices, handsome English girls who looked half asleep, and a few plain but spirited French young ladies. The usual collection of traveling young gentlemen made themselves merry among them. Mothers of every nation lined the walls and watched it all. Whenever a gentleman chose one of their daughters, they smiled on him graciously.
        - id: ch04-b04
          speaker: narrator
          text: Any young girl can imagine how Amy felt when she entered on Laurie's arm. She knew she looked well, and she loved to dance. A ballroom felt like her natural country. She enjoyed that first delightful sense of power a young woman discovers in beauty, youth, and womanhood. Still, she felt sorry for the Davis girls. They were awkward and plain, with no escort except a grim father and three even grimmer aunts. Amy gave them her friendliest bow as she passed. It was kind of her, and it also let them inspect her dress and wonder about her distinguished companion.
        - id: ch04-b05
          speaker: narrator
          text: At the first rush of music, color rose in Amy's cheeks. Her eyes sparkled, and one foot tapped impatiently. She danced beautifully and wanted Laurie to see it. So his next quiet question came as a shock.
        - id: ch04-b06
          speaker: laurie
          text: Would you like to dance?
        - id: ch04-b07
          speaker: amy
          text: People generally do at a ball.
        - id: ch04-b08
          speaker: narrator
          text: Her startled look and quick reply told Laurie that he had blundered. He tried to repair the damage at once.
        - id: ch04-b09
          speaker: laurie
          text: I meant the first dance. May I have it?
        - id: ch04-b10
          speaker: amy
          text: I can give you one if I postpone the Count. He dances divinely, but he'll forgive me because you're an old friend.
        - id: ch04-b11
          speaker: narrator
          text: Amy hoped the Count's name would impress Laurie and warn him not to take her for granted.
        - id: ch04-b12
          speaker: laurie
          text: A nice little fellow, though rather a short Pole to support a daughter of the gods, divinely tall and most divinely fair.
        - id: ch04-b13
          speaker: narrator
          text: That was all the satisfaction she got. Their set was made up of English dancers, so Amy had to walk properly through a cotillion while longing to fling herself into a tarantella. Afterward Laurie handed her over to the nice little Count and went to perform his duty with Flo. He did not even reserve Amy for any later dance.
        - id: ch04-b14
          speaker: narrator
          text: Such careless planning deserved punishment. Amy immediately promised every dance until supper, though she meant to forgive him if he showed proper regret. When he strolled over instead of rushing to claim her for a glorious polka redowa, she displayed her full dance card with quiet satisfaction. His polite regrets did not fool her. As she swept away with the Count, she saw Laurie sit beside Aunt Carrol with an unmistakable look of relief.
        - id: ch04-b15
          speaker: narrator
          text: That was unforgivable. For a long time, Amy paid no attention to him beyond an occasional word when she returned to her chaperone for a pin or a brief rest. Her anger improved her performance. She hid it under a smile and seemed brighter and happier than usual. Laurie watched with pleasure. Amy neither bounced wildly nor dragged herself around. She danced with spirit and grace, making the pastime exactly what it ought to be. Before half the evening had passed, he had decided that little Amy was becoming a very charming woman.
        - id: ch04-b16
          speaker: narrator
          text: Soon the whole room caught the spirit of Christmas. Faces shone, hearts lifted, and heels grew light. The musicians fiddled, blew, and banged as though they were having as much fun as the dancers. Everyone who could dance did. Everyone who could not watched with unusual enthusiasm.
        - id: ch04-b17
          speaker: narrator
          text: Davises seemed to fill the air, while the many Joneses bounded around like young giraffes. The golden secretary shot across the floor like a meteor beside a bold Frenchwoman whose pink satin train swept the carpet. The serene German finally found supper and steadily ate through the menu, alarming the waiters with the destruction he caused.
        - id: ch04-b18
          speaker: narrator
          text: But the Emperor's friend won all the glory. He attempted every dance whether he knew it or not, adding sudden spins whenever the figures confused him. Though stout, he bounced like a rubber ball. He ran, flew, and pranced. His face glowed, his bald head shone, his coat tails waved, and his dancing shoes flashed through the air. Whenever the music stopped, he wiped his forehead and smiled at everyone like a French Mr. Pickwick without spectacles.
        - id: ch04-b19
          speaker: narrator
          text: Amy and her Polish count matched his energy with much more grace. Laurie caught himself keeping time as Amy's white slippers rose and fell, passing again and again as tirelessly as if they had wings. At last, little Vladimir surrendered her, assuring Amy that leaving so early made him desolate. She was ready to rest and discover how her faithless knight had endured his punishment.
        - id: ch04-b20
          speaker: narrator
          text: The cure had worked. At twenty-three, disappointed love can still find comfort in friendly company. Young nerves respond, young blood moves, and healthy spirits rise beneath the spell of beauty, light, music, and motion. Laurie no longer looked tired and distant. His face had awakened. When Amy came over, he rose at once to give her his chair, then hurried away to find supper for her.
        - id: ch04-b21
          speaker: amy
          text: Ah, I knew that would do him good!
          emotion: happy
        - id: ch04-b22
          speaker: narrator
          text: She smiled to herself with satisfaction. Laurie returned and fanned her with one hand while holding her coffee in the other.
        - id: ch04-b23
          speaker: laurie
          text: You look like Balzac's Woman Painted by Herself.
        - id: ch04-b24
          speaker: amy
          text: My rouge won't rub off.
        - id: ch04-b25
          speaker: narrator
          text: Amy rubbed her shining cheek and showed him the spotless glove with such perfect seriousness that he laughed aloud. Then a fold of her dress blew across his knee, and he touched it.
        - id: ch04-b26
          speaker: laurie
          text: What do you call this material?
        - id: ch04-b27
          speaker: amy
          text: Illusion.
        - id: ch04-b28
          speaker: laurie
          text: That's a good name. It's very pretty. Is it new?
        - id: ch04-b29
          speaker: amy
          text: It's ancient. You've seen it on dozens of girls. You simply never noticed it was pretty until tonight, you stupid boy.
        - id: ch04-b30
          speaker: laurie
          text: I'd never seen it on you. That explains my mistake.
        - id: ch04-b31
          speaker: amy
          text: Stop that. Compliments are forbidden. Right now I'd rather have coffee. And please don't lounge. It makes me nervous.
        - id: ch04-b32
          speaker: narrator
          text: Laurie sat perfectly upright and meekly accepted her empty plate. It gave him an odd pleasure to have little Amy ordering him around. Her shyness was gone, and she felt an irresistible desire to trample on him, as girls often do when a lord of creation shows the least sign of surrender.
        - id: ch04-b33
          speaker: laurie
          text: Where did you learn to do all this?
        - id: ch04-b34
          speaker: narrator
          text: He gave her a teasing look.
        - id: ch04-b35
          speaker: amy
          text: '"All this" is rather vague. Would you mind explaining exactly what you mean?'
        - id: ch04-b36
          speaker: narrator
          text: Amy knew perfectly well, but wickedly left him to describe something almost impossible to put into words.
        - id: ch04-b37
          speaker: laurie
          text: Well, the whole effect. Your style and confidence, and the way you carry yourself. The... the... illusion. You know what I mean.
        - id: ch04-b38
          speaker: narrator
          text: He laughed, gave up, and rescued himself with the new word. Amy was pleased but naturally refused to show it.
        - id: ch04-b39
          speaker: amy
          text: Living abroad polishes a person whether she means it to or not. I study as well as enjoy myself. And as for the dress, tulle is inexpensive, flowers cost nothing, and I've learned to make the most of the few things I have.
        - id: ch04-b40
          speaker: narrator
          text: Amy almost wished she had not said that last part. Perhaps it was not in perfect taste. But Laurie liked her better for it. He admired and respected the brave patience that made the most of every opportunity, and the cheerful spirit that covered poverty with flowers.
        - id: ch04-b41
          speaker: narrator
          text: Amy did not know why he looked at her so kindly. She did not know why he filled the rest of her dance card with his own name or devoted himself to her for the rest of the evening. But the impulse behind that pleasant change came from one of the new impressions they were giving each other without yet realizing it.
