audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着克制的幽默
        timbre: 清澈柔和
        pace: 从容舒展
        pitch: 中音
    amy:
      display_name: 艾米
      tts:
        delivery: 讲究而伶俐，成熟中仍带少女的直率
        timbre: 清脆明亮的年轻女声
        pace: 适中，兴奋时轻快
        pitch: 中高音
    laurie:
      display_name: 劳里
      tts:
        delivery: 风趣亲切，表面的懒散下藏着低落
        timbre: 清朗温暖的年轻男声
        pace: 从容，真情流露时稍快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第三十七章　新的印象
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 每天下午三点，尼斯的时髦人物都会来到英国人漫步大道。这地方很迷人。宽阔的步道两旁有棕榈、鲜花和热带灌木，一边紧邻大海，另一边是气派的车道。沿路排着旅馆和别墅，越过它们，远处还能望见橘园和群山。各国游客说着各国语言，穿着各式衣裳。只要天气晴朗，眼前便像狂欢节一样明亮热闹。傲慢的英国人、活泼的法国人、严肃的德国人、英俊的西班牙人、难看的俄国人、温顺的犹太人和随随便便的美国人，都在这里乘车、闲坐或散步。他们一边交谈，一边聊新闻，也议论刚到尼斯的名人。被评头论足的可能是里斯托里或狄更斯，也可能是维克托·埃马纽埃尔或三明治群岛女王。车马和客人一样形形色色，也一样惹眼。尤其是贵妇们亲自驾的小敞篷马车，前头拉着两匹神气的小马，车上张着彩色网兜，拦住蓬大的裙摆，不让它们从小小的车厢里漫出去。车后高座上，还坐着一个小马童。
        - id: ch01-b02
          speaker: narrator
          text: 圣诞节这天，一个高个子青年背着双手，沿大道慢慢走着，神情有些恍惚。他长得像意大利人，穿得像英国人，举止却有美国人的独立气派。这个奇妙的组合惹得姑娘们赞许地回头看他。几个花花公子却先耸耸肩，转头又嫉妒起他的高个子。他们穿着黑丝绒衣，系玫瑰色领带，戴浅黄手套，扣眼里还插着橙花。四周漂亮面孔不少，他几乎不看，只偶尔留意穿蓝衣的金发姑娘。走到岔路口，他停下来，好像不知道该去公共花园听乐队，还是沿海滩走向城堡山。小马的蹄声忽然传来，他抬头一看，一辆小马车正飞快驶近。车里只有一位年轻姑娘，金色头发，蓝色衣裙。他盯着她看了一会儿，整张脸一下亮起来，像个孩子似的挥着帽子迎上前去。
        - id: ch01-b03
          speaker: amy
          text: 劳里，真的是你！我还以为你再也不来了！
          emotion: surprised
        - id: ch01-b04
          speaker: narrator
          text: 艾米丢下缰绳，伸出两只手。一位法国母亲见了大为震惊，赶紧催女儿快走，生怕她看了这些“疯英国人”的放肆举动，也跟着学坏。
        - id: ch01-b05
          speaker: laurie
          text: 路上有事耽误了。不过我说过要来陪你们过圣诞节，这不就到了。
        - id: ch01-b06
          speaker: amy
          text: 你祖父好吗？你哪天来的？现在住在哪儿？
        - id: ch01-b07
          speaker: laurie
          text: 他很好。我昨晚到的，住肖万旅馆。我去旅馆找过你，可你出去了。
        - id: ch01-b08
          speaker: amy
          text: 我有一肚子话，真不知道先说哪一句！快上车，我们慢慢聊。我正要出去兜风，巴不得有人陪。弗洛在为今晚留精神呢。
        - id: ch01-b09
          speaker: laurie
          text: 今晚怎么了？有舞会？
        - id: ch01-b10
          speaker: amy
          text: 旅馆里有圣诞聚会。那里住着不少美国人，特地为过节办的。你当然跟我们去吧？姑妈见到你一定很高兴。
        - id: ch01-b11
          speaker: laurie
          text: 谢谢。我们现在去哪儿？
        - id: ch01-b12
          speaker: narrator
          text: 劳里往后一靠，抱起双臂。艾米正喜欢这样，她本来就爱自己赶车。阳伞式马鞭握在手里，蓝缰绳越过两匹白色小马的背，她别提多得意了。
        - id: ch01-b13
          speaker: amy
          text: 先去银行家那里取信，再上城堡山。那里的景色特别美，我还喜欢喂孔雀。你去过吗？
        - id: ch01-b14
          speaker: laurie
          text: 好些年前常去。再看一回也不错。
        - id: ch01-b15
          speaker: amy
          text: 现在说说你自己的事吧。上次听到消息，是你祖父来信说，他正等你从柏林过去。
        - id: ch01-b16
          speaker: laurie
          text: 我在柏林待了一个月，后来到巴黎找他。他准备在那里过冬，朋友多，也不缺消遣。我想来就来，想走就走，我们俩都很自在。
        - id: ch01-b17
          speaker: amy
          text: 你们这安排可真亲热。
        - id: ch01-b18
          speaker: narrator
          text: 艾米总觉得劳里身上少了点什么，却说不清是什么。
        - id: ch01-b19
          speaker: laurie
          text: 他不爱四处跑，我又闲不住，那就各过各的，谁也不难受。我常去看他。他听我的旅行见闻很开心，我四处游荡回来，也乐意有人盼着见我。这里又老又脏，是不是？
        - id: ch01-b20
          speaker: narrator
          text: 马车沿着大街驶向老城的拿破仑广场，劳里嫌弃地望着四周。
        - id: ch01-b21
          speaker: amy
          text: 脏得很有画意，我才不在乎。河流和山丘真迷人，那些窄窄的横街偶尔露出来，我最喜欢看。前面那支队伍要去圣约翰教堂，我们得等他们过去。
        - id: ch01-b22
          speaker: narrator
          text: 神父们走在华盖下面，蒙白面纱的修女捧着点燃的蜡烛，身穿蓝袍的兄弟会成员边走边唱。劳里没精打采地看游行，艾米却一直看他。她忽然生出一种从未有过的羞涩，因为他变了。身边这个阴郁的男人，再也不像她离开时那个笑脸盈盈的少年。她觉得他比从前更英俊，整个人也出色多了。可重逢时的兴奋一退，他便显得疲惫消沉。他不像生了病，也不能说真不快乐，却过分苍老严肃，绝不像只过了一两年顺遂生活的人。艾米想不通，又不敢问。她只好摇摇头，轻轻挥鞭，催着小马前进。队伍曲曲折折地走过帕廖尼桥的拱顶，最后消失在教堂里。
        - id: ch01-b23
          speaker: amy
          text: 您在想什么？
        - id: ch01-b24
          speaker: narrator
          text: 她故意用法语发问，好在人前卖弄一下。出国以后，她的法语说得多了不少，至于质量有没有同样进步，就很难说了。
        - id: ch01-b25
          speaker: laurie
          text: 我在想，小姐这段日子没有白过。如今的成果十分迷人。
        - id: ch01-b26
          speaker: narrator
          text: 劳里把手按在胸前，欠身行礼，眼里带着赞赏。艾米欢喜得脸红了，可这句恭维偏偏不如他从前的直话中听。以前逢到节日，她打扮好，他会绕着她看一圈，痛痛快快地笑着说她“简直棒极了”，再赞许地拍拍她的头。现在这种口气让她不舒服。虽说还算不上看厌世事，听着却很冷淡，和他的眼神并不相称。
        - id: ch01-b27
          speaker: narrator
          text: 艾米暗想，他要是长大以后就变成这样，还不如永远当个男孩。她又失望，又不自在，脸上却装得轻松快活。
        - id: ch01-b28
          speaker: narrator
          text: 到了阿维格多银行，她取到珍贵的家书，把缰绳交给劳里，舒舒服服地读起来。马车沿着绿篱间的林荫小路盘旋上山，路边的香水月季开得像六月一样鲜艳。
        - id: ch01-b29
          speaker: amy
          text: 妈妈说贝思的身体很不好。我常觉得自己该回家，可大家都叫我留下。我只好留下，因为以后不会再有这样的机会了。
          emotion: sad
        - id: ch01-b30
          speaker: laurie
          text: 你留下是对的。你回家也帮不上忙。知道你健康快活，又见识了这么多，对他们也是很大的安慰，亲爱的。
          emotion: calm
        - id: ch01-b31
          speaker: narrator
          text: 劳里挨近了一点，看起来也更像从前的他。艾米心里的恐惧顿时轻了。那个眼神、那个动作，还有哥哥一般的“亲爱的”，都像在告诉她，就算真的出了事，她也不会独自留在异国。过了一会儿，她笑着拿出一张乔的小速写。画里的乔穿着写作时的衣裳，帽子上的蝴蝶结神气地竖着，嘴边还有一句：“天才在燃烧！”
        - id: ch01-b32
          speaker: narrator
          text: 劳里笑着接过画，收进背心口袋，说是免得风把它刮走。接着，他兴致勃勃地听艾米朗读乔那封活泼的信。
        - id: ch01-b33
          speaker: amy
          text: 这个圣诞节，我可真要快活个够了。早晨有礼物，下午有你和家书，晚上还有聚会。
          emotion: happy
        - id: ch01-b34
          speaker: narrator
          text: 他们在古堡废墟间下了车，一群华美的孔雀排着队围拢过来，温驯地等着喂食。艾米站在劳里头顶那片高坡上，笑着向那些光彩照人的鸟儿撒面包屑。劳里也像刚才她打量他那样，带着自然而然的好奇，细看时间和离别给她带来了什么变化。他没有发现任何叫人困惑或失望的地方，反而有许多地方叫他欣赏和赞许。除了言谈举止偶尔有点小小的做作，她仍旧活泼优雅，衣着和仪态间还多了一种说不出的风雅。艾米本来就比同龄人成熟，如今举止谈吐更从容自信，显得比实际更有阅历。不过，她原先那点急脾气还会露头，意志仍然强硬，天生的坦率也没被异国生活磨掉。
        - id: ch01-b35
          speaker: narrator
          text: 劳里看她喂孔雀时，当然没有在一瞬间把这些全看透，可眼前所见已经足以让他满意，也勾起了他的兴趣。离开时，他在心里带走了一幅好看的小画。阳光下站着一个面容明朗的姑娘。光线映出裙子的柔和颜色、双颊的新鲜红润和头发上的金色光泽。四周景色本来就令人愉快，她却成了其中最醒目的身影。
        - id: ch01-b36
          speaker: amy
          text: 你还记得那座大教堂和科尔索大街吗？记得海湾里拉网的渔夫、通往维拉弗兰卡的那条美丽道路，还有下面的舒伯特塔吗？最妙的是海上那个小点，人家说那就是科西嘉岛。
        - id: ch01-b37
          speaker: laurie
          text: 记得。这里没怎么变。
        - id: ch01-b38
          speaker: amy
          text: 要是能看一眼那个著名的小点，乔不知道肯付出什么呢！
        - id: ch01-b39
          speaker: narrator
          text: 艾米兴致正好，也希望劳里振作起来。
        - id: ch01-b40
          speaker: laurie
          text: 是啊。
        - id: ch01-b41
          speaker: narrator
          text: 他只说了两个字，却转过身，竭力眺望那座岛。此刻让科西嘉对他变得有趣的，是另一位征服者。那个人在他心里的势力，甚至胜过拿破仑。
        - id: ch01-b42
          speaker: amy
          text: 替乔好好看一眼吧。然后过来告诉我，这么长时间，你到底都在做什么。
        - id: ch01-b43
          speaker: narrator
          text: 艾米坐下来，等着好好谈一场，可她没能如愿。劳里坐到她身边，也肯回答每个问题，她最后只问出他在欧洲大陆到处旅行，还去过希腊。两人悠闲地过了一个钟头，便乘车回家。劳里向卡罗尔太太问过安，告辞离开，答应晚上再来。
        - id: ch01-b44
          speaker: narrator
          text: 有件事必须老实记下来。那天晚上，艾米是存心打扮给劳里看的。时光和离别改变了两个年轻人。她如今用新的眼光看这位老朋友，不再觉得他只是“我们家的男孩”，而是一个英俊可亲的男人。她也清楚地察觉到，自己很想得到他的欣赏。这愿望再自然不过。艾米知道自己的长处，也有品位和巧手，懂得把它们全显出来。对于贫穷而漂亮的女人，这本事就是一笔财富。
        - id: ch01-b45
          speaker: narrator
          text: 尼斯的薄纱和绢网很便宜，艾米遇上这种场合，便用它们把自己装点得云雾一般。她遵从英国的明智风尚，让年轻姑娘穿得简洁，再配上鲜花、几件首饰和各种精巧点子。这样搭出的衣裳不但便宜，效果还很好。有时候，她身上的艺术家会盖过女人，叫她迷上古典发式、雕像般的姿态和古希腊式衣褶。不过，亲爱的朋友，谁没有一点小弱点呢？年轻人的美貌让人赏心悦目，天真的虚荣又逗人开心，我们自然很容易原谅他们。
        - id: ch01-b46
          speaker: amy
          text: 我真想让他觉得我好看，回家后也这样告诉大家。
        - id: ch01-b47
          speaker: narrator
          text: 她一边这样想着，一边穿上弗洛的旧白绸舞裙，外面罩了一层云似的新绢网。雪白的肩膀和金色的脑袋从云中露出来，搭配得很有艺术效果。她倒很明智，没有再折腾头发，只把浓密的波浪和卷发收拢起来，在脑后绾成赫柏女神式的发髻。
        - id: ch01-b48
          speaker: amy
          text: 这虽不时兴，可很衬我。我才不能把自己打扮成丑八怪。
        - id: ch01-b49
          speaker: narrator
          text: 每逢有人劝她照新式样烫卷、蓬发或编辫子，她总这样回答。她没有配得上晚会的精美首饰，就用粉红杜鹃花挽住轻柔的裙摆，再让嫩绿藤蔓围住雪白的肩头。想起从前那双涂过颜色的靴子，她满意地端详白缎舞鞋，又跳着沙塞步走过房间，独自欣赏那双很有贵族气派的脚。
        - id: ch01-b50
          speaker: amy
          text: 新扇子正好配花，手套也合适极了，姑妈手帕上的真花边还给整身衣服添了气派。我要是再有一只古典式鼻子和一张古典式嘴，就再没有不满意的了。
        - id: ch01-b51
          speaker: narrator
          text: 艾米两手各拿一支蜡烛，挑剔地端详自己。尽管鼻子和嘴不够理想，她款款走出去时仍格外明艳优雅。她很少跑，觉得那不合自己的风格。她身材高挑，与其活泼俏皮，不如摆出庄重的朱诺女神式风度。等劳里时，她在长客厅里来回走动，一度特意站到枝形吊灯下，因为那里的光把头发照得很好看。后来她又害羞了，走去房间另一头，不愿显得刻意安排好第一眼的模样。偏偏这一走再合适不过。劳里悄悄进来，她一点没听见。她站在远处的窗前，微微转头，一手提着裙摆。红色帷幕衬着苗条的白色身影，正像一尊摆得恰到好处的雕像。
        - id: ch01-b52
          speaker: laurie
          text: 晚上好，狄安娜！
        - id: ch01-b53
          speaker: narrator
          text: 他望着艾米，眼里露出了她最想看见的满意神情。
        - id: ch01-b54
          speaker: amy
          text: 晚上好，阿波罗！
        - id: ch01-b55
          speaker: narrator
          text: 她笑着回答。劳里也格外潇洒。想到自己要挽着这样一位仪表堂堂的男子走进舞厅，艾米从心底同情起戴维斯家那四位相貌平平的小姐。
        - id: ch01-b56
          speaker: laurie
          text: 这是给你的花。我亲手配的，还记得你不喜欢汉娜说的那种“一坨花束”。
        - id: ch01-b57
          speaker: narrator
          text: 他递来一束雅致的小花，装在精巧的花托里。艾米每天路过卡迪利亚的橱窗，都要眼馋那只花托。
        - id: ch01-b58
          speaker: amy
          text: 你真好！早知道你会来，我今天也会替你准备点东西，不过恐怕没有这个漂亮。
          emotion: happy
        - id: ch01-b59
          speaker: laurie
          text: 谢谢。花本来不够好，可戴到你手上就变好了。
        - id: ch01-b60
          speaker: narrator
          text: 艾米把银镯子扣在手腕上，听了这话，立刻制止他。
        - id: ch01-b61
          speaker: amy
          text: 请你别这样说。
        - id: ch01-b62
          speaker: laurie
          text: 我还以为你爱听这一套。
        - id: ch01-b63
          speaker: amy
          text: 别人说也就罢了，从你嘴里出来一点也不像你。我还是喜欢你从前直来直去的样子。
        - id: ch01-b64
          speaker: laurie
          text: 那我就放心了。
        - id: ch01-b65
          speaker: narrator
          text: 他果真松了口气，随后替她扣好手套，又问自己的领带正不正，完全像从前两人在家一同参加聚会时那样。
        - id: ch01-b66
          speaker: narrator
          text: 晚会设在长餐厅里，宾客只有在欧洲大陆才凑得出这样一群。好客的美国人把他们在尼斯认识的人全请来了。他们对头衔也毫无偏见，还邀来几位有爵位的客人，替圣诞舞会增光。一位俄国亲王屈尊坐在角落，同一个魁梧女人聊了整整一小时。那女人穿着黑丝绒，打扮得像哈姆雷特的母亲，下巴下面还系着珍珠笼头。一位十八岁的波兰伯爵围着女士们献殷勤，人人都说他是“迷人的小宝贝”。一位德国的“尊贵的什么大人”独自来吃晚餐，到处游荡着寻找可以吞下肚的东西。罗斯柴尔德男爵的大鼻子秘书穿着紧靴，和气地朝全世界微笑，仿佛主人的姓氏给他头上套了一圈金光。一位认识皇帝的胖法国人专为过舞瘾而来，英国的德·琼斯夫人则带来八个孩子，替场面增光。脚步轻盈、嗓音尖亮的美国姑娘，漂亮却没精神的英国姑娘，还有相貌普通却很俏皮的法国小姐，当然也都到了。照例还有一群旅行中的年轻绅士，在人群中快活地玩乐。各国母亲沿墙坐成一排，只要有人请自己的女儿跳舞，她们就慈祥地微笑。
        - id: ch01-b67
          speaker: narrator
          text: 艾米挽着劳里的手臂“登台”时，那份心情，任何年轻姑娘都懂。她知道自己好看，又爱跳舞，走进舞厅就像双脚踏上了自己的故土。美貌、青春和女性的魅力，让年轻姑娘第一次发现自己生来能统治一个崭新而可爱的王国。艾米正陶醉在这种力量里。她也真心同情戴维斯家的姑娘。她们举止笨拙，相貌平凡，又没有男伴，身旁只有严厉的父亲和三个更严厉的老处女姑妈。艾米走过时，十分友善地向她们行礼。这也算她心地善良，因为这样一来，那几位姑娘既能看清她的衣裳，也能急着猜测她身边那位气度不凡的朋友是谁。乐队奏出第一个强音，艾米双颊泛红，眼睛亮了，双脚焦急地在地板上打着拍子。她很会跳舞，正等着让劳里亲眼知道。不料，劳里用平静得不能再平静的语气开了口。
        - id: ch01-b68
          speaker: laurie
          text: 你想跳舞吗？
        - id: ch01-b69
          speaker: amy
          text: 来参加舞会的人，通常都是想跳的。
        - id: ch01-b70
          speaker: narrator
          text: 她回答得又快，眼神又惊讶，劳里赶忙补救。
        - id: ch01-b71
          speaker: laurie
          text: 我是问第一支舞。能请你赏光吗？
        - id: ch01-b72
          speaker: amy
          text: 要是把伯爵往后推一推，我可以给你一支。他跳得特别好，不过你是老朋友，他会体谅的。
        - id: ch01-b73
          speaker: narrator
          text: 艾米特意搬出伯爵的头衔，想让劳里明白，自己可不能随便怠慢。劳里却只念了几句诗。
        - id: ch01-b74
          speaker: laurie
          text: 小男孩倒很可爱，只可惜这波兰人矮了些，托不起……神的女儿啊，高挑得神圣，美得也神圣。
        - id: ch01-b75
          speaker: narrator
          text: 他们这一组全是英国人，艾米只得规规矩矩走完四对舞，心里却恨不得痛快跳一场塔兰泰拉。劳里把她交还给那个“可爱的小男孩”，自己去尽陪弗洛跳舞的义务，竟没先约她跳后面的舞。这份该受责备的欠考虑很快受到了惩罚。艾米把晚餐前的舞全许给别人，只等他显出悔意，再考虑要不要心软。下一支是精彩的雷多瓦波尔卡。劳里没有急着来请，只是不慌不忙地走过来。艾米故作端庄又心满意足，把写满名字的舞会手册给他看。他客气地表示遗憾，她可没有上当。她和伯爵飞驰而去时，看见劳里在姑妈身边坐下，脸上分明松了一口气。
        - id: ch01-b76
          speaker: narrator
          text: 这下绝不能原谅。此后很久，艾米都不再理他。只有跳舞间隙回到女伴监护人身边取一根必需的别针，或稍微歇口气时，她才偶尔和他说一两个字。不过，生气反倒让她更出色。她把怒意藏在笑脸下，显得格外明艳轻盈。劳里愉快地追随着她的身影。她既不疯闹，也不懒散敷衍，而是跳得热烈又优美，让这件快乐的事有了它本该有的样子。劳里便自然而然地从一个新角度研究起她来。晚会还没过半，他已经认定，小艾米一定会长成一个迷人的女人。
        - id: ch01-b77
          speaker: narrator
          text: 舞厅越来越热闹。社交季的兴奋感染了每个人，圣诞欢乐让人脸上发亮，心里高兴，脚步也轻。乐师又拉又吹又敲，仿佛自己也玩得痛快。会跳舞的人全下了场，不会跳的便热心欣赏别人。戴维斯们多得像乌云一样，许多琼斯像一群小长颈鹿，满场蹦跳。那位头顶金光的秘书陪着神采飞扬的法国女人，流星似的穿过大厅，她的粉红缎子裙摆一路铺在地上。尊贵的日耳曼人找到了餐桌，便照菜单从头吃到尾，惊人的食量吓坏了男侍者。皇帝的朋友却在舞池里赢得了荣光。不管会不会，他每支舞都跳。舞步一乱，他便临时加几个旋转。这个胖男人忘情得像个男孩，尽管身子很重，跳起来却像橡皮球。他奔跑、飞跃、腾跳，脸红得发亮，秃头也闪着光，燕尾服下摆乱飞，舞鞋在半空一闪一闪。音乐停下，他擦去额头的汗，笑眯眯地望着大家，活像一个没戴眼镜的法国匹克威克先生。
        - id: ch01-b78
          speaker: narrator
          text: 艾米和她的波兰伯爵同样热情，舞步却更轻盈优美，因此也大出风头。她的白舞鞋仿佛生了翅膀，一次次飞过。劳里不知不觉跟着那起伏的节奏打起拍子。小弗拉基米尔终于放开艾米，再三说自己“这么早就得离开，真是悲痛欲绝”。艾米正好也要歇一歇，看看她那位变心的骑士受罚以后怎么样了。
        - id: ch01-b79
          speaker: narrator
          text: 这惩罚果然有效。二十三岁的人就算爱情受了伤，也能从友好的陪伴中得到安慰。美貌、灯火、音乐和舞步一同施下魔法，年轻的神经会颤动，年轻的血会起舞，健康的青春意气也会重新昂扬。劳里起身给艾米让座时，神情已经清醒振作。他随即匆匆离开座位，去替她取些晚餐。艾米看着他，终于露出满意的笑容。
        - id: ch01-b80
          speaker: amy
          text: 啊，我早知道这会对他有好处！
          emotion: happy
        - id: ch01-b81
          speaker: laurie
          text: 你看着就像巴尔扎克笔下的《她笔下的彩妆女子》。
        - id: ch01-b82
          speaker: narrator
          text: 劳里一手替她打扇，一手端着她的咖啡杯。
        - id: ch01-b83
          speaker: amy
          text: 我脸上的胭脂可擦不掉。
        - id: ch01-b84
          speaker: narrator
          text: 她揉揉红艳的脸，再把雪白的手套给劳里看。那一本正经的天真模样，逗得他放声大笑。
        - id: ch01-b85
          speaker: laurie
          text: 你这裙子的料子叫什么？
        - id: ch01-b86
          speaker: narrator
          text: 他碰了碰吹落在自己膝上的一褶裙纱。
        - id: ch01-b87
          speaker: amy
          text: 幻影纱。
        - id: ch01-b88
          speaker: laurie
          text: 名字真合适。很好看，是新出的料子吗？
        - id: ch01-b89
          speaker: amy
          text: 早就老掉牙了。你在几十个姑娘身上见过，偏偏今天才发现它漂亮。真笨！
        - id: ch01-b90
          speaker: laurie
          text: 我以前没见你穿过，所以才会弄错啊。
        - id: ch01-b91
          speaker: amy
          text: 这种话不许再说。眼下我宁愿喝咖啡，也不想听恭维。还有，别懒洋洋地靠着，看得我心烦。
        - id: ch01-b92
          speaker: narrator
          text: 劳里立刻坐得笔直，又乖乖接过她的空盘子。小艾米这样指挥他，竟让他感到一种奇怪的快乐。艾米已经不害羞了，反倒忍不住想把他踩在脚下。那些自称万物之灵的男子一露出顺从的样子，姑娘们总有一种可爱的本领，知道怎样好好践踏他们。
        - id: ch01-b93
          speaker: laurie
          text: 你这一整套都是从哪儿学来的？
        - id: ch01-b94
          speaker: amy
          text: “这一整套”也太含糊了。劳驾说清楚一点好吗？
        - id: ch01-b95
          speaker: narrator
          text: 她明明知道他的意思，却故意把这难以形容的东西留给他来解释。
        - id: ch01-b96
          speaker: laurie
          text: 就是……你整个的气派、风格、从容自信，还有……还有……幻影。你知道吧。
        - id: ch01-b97
          speaker: narrator
          text: 劳里笑着卡了壳，只好借刚学来的词替自己解围。艾米心里十分受用，脸上当然不肯显出来。
        - id: ch01-b98
          speaker: amy
          text: 人在国外生活，不知不觉就会圆熟一点。我不只是玩，也认真学习。至于这身衣服嘛，绢网很便宜，鲜花不花钱就能得到。我早就习惯把自己那点可怜的小东西尽量派上用场了。
        - id: ch01-b99
          speaker: narrator
          text: 最后一句刚出口，艾米便有些后悔，怕自己说得不够得体。劳里却因此更喜欢她了。他不只欣赏，也开始敬重那份勇敢的耐心。她懂得充分利用眼前的机会，也能用鲜花遮住贫穷。艾米不知道他为什么忽然那样亲切地望着自己，也不知道他为什么把自己的名字填满她的舞会手册。余下整晚，他都专心陪着她，体贴周到，叫人无比愉快。促成这番可喜变化的，正是他们无意间带给彼此，也从彼此身上得到的新印象。
