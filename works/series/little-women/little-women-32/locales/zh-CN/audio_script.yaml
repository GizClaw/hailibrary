audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，带着克制的幽默, timbre: 清澈柔和, pace: 从容舒展, pitch: 中音}
    amy:
      display_name: 艾米
      tts: {delivery: 讲究而伶俐，偶尔流露稚气, timbre: 清脆, pace: 适中, pitch: 中高音}
    flo:
      display_name: 弗洛
      tts: {delivery: 活泼娇柔，好奇心十足, timbre: 明亮轻盈, pace: 稍快, pitch: 中高音}
    uncle:
      display_name: 舅舅
      tts: {delivery: 冷静诙谐，不动声色, timbre: 浑厚干净, pace: 从容, pitch: 中低音}
    bootblack:
      display_name: 擦鞋童
      tts: {delivery: 机灵爽快，带着顽皮笑意, timbre: 年轻清亮, pace: 稍快, pitch: 中高音}
    cabman:
      display_name: 马车夫
      tts: {delivery: 粗声粗气，简短随意, timbre: 沙哑厚重, pace: 适中, pitch: 低音}
    fred:
      display_name: 弗雷德
      tts: {delivery: 热情自信，认真时坦率深情, timbre: 清朗结实, pace: 适中, pitch: 中音}
  chapters:
    - id: ch01
      title: 伦敦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 艾米从伦敦寄回了第一封长信。她坐在皮卡迪利街巴斯旅馆临街的窗前，把一路画下、记下的见闻讲给家人听。
        - id: ch01-b02
          speaker: amy
          text: 最亲爱的大家，我真的到伦敦了！此刻就坐在皮卡迪利街巴斯旅馆临街的窗前。这家旅馆不算时髦，可舅舅多年前住过，从此便认准了这里，哪里也不肯去。反正不会久住，也没什么要紧。我高兴得不知从哪里讲起，就算开了头也讲不完，只好从笔记本里挑些片段。动身以后，我不是画画，就是随手记上几笔。
        - id: ch01-b03
          speaker: amy
          text: 我从哈利法克斯寄短信时还很难受，往后却顺利极了。我几乎不再晕船，整天待在甲板上，还有许多有趣的人陪我。军官们尤其照顾我。乔，你别笑。船上真少不了男士，站不稳可以扶着他们，有事也能请他们跑腿。他们闲着也是抽烟，能派上用场，反倒救了他们一命。
        - id: ch01-b04
          speaker: amy
          text: 姑妈和弗洛一路不舒服，只想安静待着。我能为她们做的都做完了，就自己去玩。甲板上的散步、落日、清新的空气和翻腾的大浪，全都妙极了。大船威风凛凛地向前冲时，几乎像骑着快马一样刺激。我真希望贝思也来，这趟航程一定能让她的身体好很多。要是乔来了，她准会爬到主桅顶帆，或者不知什么名字的最高处坐着，再去跟轮机师交朋友，拿船长的传声筒乱吹，高兴得发狂。
        - id: ch01-b05
          speaker: amy
          text: 看见爱尔兰海岸时，我还是很惊喜。阳光下到处碧绿，褐色小屋散落其间，山头有废墟，谷里有乡绅的庄园，鹿群就在园中吃草。虽然天还很早，我一点也不后悔爬起来。海湾里满是小船，岸边像一幅画，天空又泛着玫瑰色。我永远也忘不了。
        - id: ch01-b06
          speaker: amy
          text: 到皇后镇时，新认识的伦诺克斯先生下船了。我一提基拉尼湖，他便望着我叹气，还唱起歌来：“你可曾听说凯特·卡尼？她住在基拉尼湖畔。她眼波一转，快逃离危险，凯特·卡尼的一瞥能夺人性命。”是不是傻透了？
        - id: ch01-b07
          speaker: amy
          text: 我们在利物浦只停了几个钟头。那里又脏又吵，我很高兴能赶快离开。舅舅一下船就买了狗皮手套、又厚又丑的鞋和一把雨伞，还把鬓须修成羊排式。他以为自己已经像个地道英国人，可擦鞋童一眼便认出了他。
        - id: ch01-b08
          speaker: bootblack
          text: 好啦，先生。我给您的鞋上了最新式的美国亮光。
        - id: ch01-b09
          speaker: amy
          text: 舅舅听了乐不可支。还有更好玩的。那个荒唐的伦诺克斯托朋友沃德给我订了一束花，沃德后来跟我们一道来了伦敦。我一进自己的房间，第一眼就看见那束漂亮的花，卡片上还写着：“罗伯特·伦诺克斯谨致问候。”姑娘们，你们说好不好玩？旅行真有意思。
        - id: ch01-b10
          speaker: amy
          text: 从利物浦到伦敦，火车像穿过一条长长的画廊。农舍有茅草屋顶，常春藤爬到屋檐，丰满的妇人带着红脸蛋的孩子站在格子窗旁。牛群安静地站在没膝的苜蓿里，母鸡咯咯叫得十分知足，一点不像美国母鸡那么紧张。草绿、天蓝、谷物金黄、树林幽暗，那色彩美得叫人入迷。
        - id: ch01-b11
          speaker: amy
          text: 我和弗洛为了看遍沿途景色，不住从车厢一边蹦到另一边。火车每小时跑六十英里，姑妈累得睡着了，舅舅只顾看指南，坚决不肯对任何东西惊讶。我跳起来说，树丛中那片灰色地方一定是凯尼尔沃思。弗洛也扑到窗边。
        - id: ch01-b12
          speaker: flo
          text: 那里真可爱！爸爸，我们以后去看看吧？
        - id: ch01-b13
          speaker: uncle
          text: 不去，亲爱的。除非你想喝啤酒，那是一座啤酒厂。
        - id: ch01-b14
          speaker: amy
          text: 过了一会儿，弗洛又喊，那边有绞架，还有人正在往上爬。我朝两根高柱和垂下的铁链看去，急忙问在哪里。
        - id: ch01-b15
          speaker: uncle
          text: 那是煤矿。
        - id: ch01-b16
          speaker: amy
          text: 接着我看见一群白东西躺在地上，还以为是可爱的小羊羔。
        - id: ch01-b17
          speaker: flo
          text: 爸爸快看，它们多漂亮呀！
        - id: ch01-b18
          speaker: uncle
          text: 那是鹅，小姐们。
        - id: ch01-b19
          speaker: amy
          text: 这句话终于让我们安静下来。弗洛坐好去读《卡文迪什船长的艳遇》，沿途风景便全归我一个人了。到伦敦时当然下着雨，除了雾和雨伞，什么也看不见。我们先休息，打开行李，又趁一阵阵雨停的空当去买东西。我动身太匆忙，衣物一半都没备齐。玛丽姑妈替我买了配蓝羽毛的白帽子、一条相配的细棉布裙，还有一件你们看了准会喜欢的披风。摄政街买东西实在痛快，样样仿佛都很便宜，漂亮缎带一码才六便士。我买了不少，手套却要留到巴黎再买。听起来是不是又优雅又阔气？
        - id: ch01-b20
          speaker: amy
          text: 舅舅和姑妈外出时，我和弗洛为了好玩，独自叫了辆双轮马车。后来才知道年轻姑娘不该这样坐车。木挡板把我们关在里面，车夫却赶得飞快。弗洛吓坏了，让我叫他停下。可他高高坐在车后，我喊也没用，挥阳伞也没用。车子哐当乱响，飞快地拐过街角，我们一点办法都没有。
        - id: ch01-b21
          speaker: amy
          text: 我正绝望，忽然发现车顶有扇小门。伸手一捅，一只红眼睛露出来，还传来满是酒气的声音。
        - id: ch01-b22
          speaker: cabman
          text: 怎么啦，太太？
        - id: ch01-b23
          speaker: amy
          text: 我尽量严肃地叫他慢些。他答应一声，便让马走得像送葬一样慢。我只好再开门，请他稍微快一点。谁知他立刻又不要命地狂奔，我们只能听天由命。
        - id: ch01-b24
          speaker: amy
          text: 今天天晴，我们去了近旁的海德公园。德文郡公爵住在附近，我常看见他的仆人在后门闲荡。威灵顿公爵的宅邸也不远，所以我们比外表看起来更接近上流社会。公园里的景象比《笨拙》杂志还好玩。肥胖的贵妇坐着红黄马车滚滚而过，前面是扑粉的车夫，后面站着穿丝袜和天鹅绒外套、打扮华丽的仆人。伶俐的保姆领着我见过的最红润的孩子，漂亮姑娘像是半睡半醒。花花公子戴着古怪的英国帽子、套着淡紫色小羊皮手套，懒洋洋地闲逛。高个士兵穿短短的红上衣，歪扣着松饼似的帽子，滑稽得叫我真想把他们全画下来。
        - id: ch01-b25
          speaker: amy
          text: 罗滕街的名字原是“国王之路”，如今倒像骑术学校。马匹漂亮，男人和马夫也骑得好，女人却挺直身子在马背上颠来颠去。她们穿窄骑装、戴高帽，一本正经地小跑，活像玩具诺亚方舟里的女人。我很想让她们见识美国式的飞驰。这里老人、胖太太和孩子都骑马，年轻人还借机调情。我看见一对男女交换玫瑰花苞，因为时兴在纽扣眼里别一朵。这个小花样倒很可爱。
        - id: ch01-b26
          speaker: amy
          text: 下午我们去了威斯敏斯特教堂。可别指望我仔细描写，那种庄严宏伟，我根本找不到合适的话说。晚上我们又去看费希特演戏，正好为我一生中最快乐的一天收尾。
        - id: ch01-b27
          speaker: amy
          text: 信本来该结束了，可昨晚的事非说不可。我们喝茶时，劳里的英国朋友弗雷德和弗兰克·沃恩来了。若不是看见名片，我险些认不出他们。两人都长高了，留着络腮胡子。弗雷德有英国式的英俊。弗兰克更让人高兴，他只稍微有点跛，已经不用拐杖了。
        - id: ch01-b28
          speaker: amy
          text: 他们从劳里那里知道我们的住处，特意来请我们到家里去。舅舅不肯去，我们只好另找机会回访，能见他们时便见。晚上他们陪我们看戏，那一晚真是快活。弗兰克专心照顾弗洛，弗雷德和我从过去的乐事谈到现在，又谈到将来的乐事，亲热得仿佛认识了一辈子。告诉贝思，弗兰克问候了她，听说她身体不好，觉得很难过。弗雷德听我提起乔便笑起来，还托我“向那顶大帽子恭敬致意”。他们谁也没忘记劳伦斯营地，也没忘记我们在那里闹过的乐子。可那段日子想来仿佛已经是几辈子以前了，是不是？
        - id: ch01-b29
          speaker: amy
          text: 姑妈已经第三次敲墙催我，我非停笔不可了。深更半夜还在这里写信，房间里堆满漂亮东西，脑子里乱纷纷挤着公园、戏院、新衣服，还有一群风度翩翩的人。他们总用真正英国贵族的派头说“啊”，一面捻动金黄的胡须。我简直觉得自己成了纵情享乐的伦敦贵妇。我真想见到你们所有人。虽然写了满纸胡话，我仍旧永远爱你们。艾米。
    - id: ch02
      title: 巴黎
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 到巴黎以后，艾米又给姐妹们写信。她先补上了伦敦最后几天的见闻。
        - id: ch02-b02
          speaker: amy
          text: 亲爱的姑娘们，沃恩一家在伦敦待我们亲切极了，还安排了许多愉快的聚会。我最喜欢汉普顿宫和肯辛顿博物馆。在汉普顿宫，我看了拉斐尔的壁毯画稿。博物馆里则一屋又一屋，全是透纳、劳伦斯、雷诺兹、霍加斯和其他大师的作品。
        - id: ch02-b03
          speaker: amy
          text: 里士满公园那一天也很迷人。我们举行了地道的英国野餐，那里有太多壮丽的橡树和成群的鹿，我怎么也画不完。我还第一次听见夜莺啼唱，望着云雀直飞上天空。多亏弗雷德和弗兰克，我们把伦敦尽情游览了一遍，离开时都很舍不得。我觉得英国人虽不容易同你亲近，可一旦下定决心接纳你，谁也比不过他们热情好客。沃恩一家希望明年冬天在罗马跟我们会合。他们若不来，我准会失望透顶，因为格雷丝和我已成了好友，两个男孩子也都很好，尤其是弗雷德。
        - id: ch02-b04
          speaker: amy
          text: 我们才在巴黎住下，弗雷德居然又出现了，说要趁假期去瑞士。姑妈起初很严肃，可他表现得那么自然，她也无话可说。我们现在很庆幸有他。他法语说得像本地人，没有他可真不行。舅舅不会十个法语词，却总用很大的声音说英语，仿佛声音大了别人就能懂。姑妈的发音已经过时。弗洛和我原来自以为懂得不少，到了这里才知道差得远。所以需要跟人说“巴莱乌”时，有弗雷德代劳真好。舅舅就是这样管法语交谈叫的。
        - id: ch02-b05
          speaker: amy
          text: 我们每天从早到晚观光，在热闹的咖啡馆停下来吃精致午餐，路上总会遇到各种好玩的事。下雨天，我便泡在卢浮宫里，尽情沉醉在画作中。乔见到其中一些最好的作品准会顽皮地皱鼻子，因为她没有艺术细胞。我却有，而且正在抓紧每一分钟培养自己的眼光和品位。她大概更喜欢伟人的遗物。我替她看了拿破仑的双角帽和灰外套、他小时候的摇篮和用旧的牙刷，还有玛丽·安托瓦内特的小鞋、圣但尼的戒指、查理曼大帝的宝剑，以及好多有趣的东西。等回家，我能一连讲上几个钟头，现在却没时间一件件写了。
        - id: ch02-b06
          speaker: amy
          text: 皇家宫殿简直像天堂，到处是珠宝和漂亮东西。偏偏我买不起，急得快发疯。弗雷德想送我一些，我当然没答应。布洛涅森林和香榭丽舍大街也壮丽得很。我几次看见皇室一家。皇帝难看，神情冷硬。皇后苍白而美丽，可我觉得她穿得没品位，竟拿紫裙子配绿帽子和黄手套。小拿破仑倒是个漂亮男孩，坐在四匹马拉的敞篷车里同家庭教师聊天，经过时还朝人群飞吻。车前车后各有一名骑马的卫兵，驭手则穿着红缎外套骑在马上。
        - id: ch02-b07
          speaker: amy
          text: 我们常在杜伊勒里花园散步，那里很美，我却更喜欢古雅的卢森堡花园。拉雪兹神父公墓十分奇特。许多坟墓像小屋，从门外能看见桌子、死者的塑像或画像，还有椅子，留给亲友来哭泣时坐。真是法国味十足。
        - id: ch02-b08
          speaker: amy
          text: 我们的房间在里沃利街。坐在阳台上，长长的繁华大街左右尽收眼底。那里实在惬意，白天到处游览，累得不想再出门时，我们晚上便坐在那里谈话。弗雷德很会逗人开心，总的说来，是我认识的最讨人喜欢的年轻人。当然要除去劳里，他的风度更迷人。我只希望弗雷德有一头深色头发，因为我不喜欢金发男人。不过沃恩家很富有，门第又好，我就不挑他们的黄头发了，何况我的头发比他们的更黄。
        - id: ch02-b09
          speaker: amy
          text: 下星期我们要去德国和瑞士。一路赶得快，我只能匆匆写信。我一直记日记，也照爸爸的话，努力准确记住、清楚讲出眼前值得欣赏的一切。这是很好的练习。日记再配上速写簿，会比这些潦草的信更能让你们看见我的旅程。再会，我深情地拥抱你们。你们的朋友。
    - id: ch03
      title: 海德堡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 离开海德堡去伯尔尼以前，艾米有了一个安静钟头。这一次，她写给妈妈，因为有件重要的事非说不可。
        - id: ch03-b02
          speaker: amy
          text: 亲爱的妈妈，沿莱茵河上行的航程美极了。我只是坐着，尽情去看。您把爸爸的旧旅行指南找出来吧，我没有足够美的字眼来形容。到了科布伦茨，弗雷德在船上认识的几名波恩学生为我们唱了一场小夜曲。月光明亮，凌晨一点左右，我和弗洛被窗下的歌声唤醒。我们躲到窗帘后偷看，果然是他们在下面唱歌。河流、浮桥、对岸的大堡垒都浸在月光里，再加上足以融化铁石心肠的乐声，那是我见过最浪漫的景象。
        - id: ch03-b03
          speaker: amy
          text: 他们唱完以后，我们从窗上扔下几朵花。那些人争着去抢，又向躲在窗帘后、根本看不见的女士们飞吻，随后一路笑着离开。我猜他们是去抽烟喝啤酒了。第二天早晨，弗雷德从背心口袋里掏出一朵揉皱的花给我看，神情十分多情。我笑着告诉他，花是弗洛扔的，不是我扔的。他仿佛立刻倒了胃口，把花丢出窗外，又恢复了理智。看样子，这个男孩子要给我惹麻烦了，事情正朝那个方向发展。
        - id: ch03-b04
          speaker: amy
          text: 拿骚和巴登—巴登的温泉浴场都很热闹。弗雷德在那里输了钱，我责备了他。弗兰克不在时，他真需要有人管管。凯特希望他早点结婚，我也觉得那样对他好。法兰克福很有趣。我看了歌德故居、席勒像和丹内克尔的《阿里阿德涅》。雕像很美，可我要是更懂那个故事，一定会更喜欢。我没好意思问，因为人人似乎都知道，或者都装作知道。真希望乔能讲给我听。我本该多读些书，如今发现自己什么都不知道，很难为情。
        - id: ch03-b05
          speaker: amy
          text: 现在说正事。弗雷德刚刚离开。他一直体贴又快活，我们所有人渐渐都很喜欢他。小夜曲以前，我只以为这是旅途中的友谊。打那晚以后我才觉得，那些月下散步、阳台谈话和每天共同经历的小事，对他不只是玩乐。妈妈，我没有卖弄风情，真的。我始终记着您的话，也尽了自己最大的努力。别人喜欢我，我没有办法。我从不故意招惹别人来喜欢我。可自己若不喜欢对方，这件事反而让我烦恼，尽管乔说我根本没有心。
        - id: ch03-b06
          speaker: amy
          text: 我知道您会摇头，姐妹们会骂我是贪财的小坏蛋。可我已经决定了。弗雷德若求婚，我就答应，虽然我没有爱他爱得发狂。我喜欢他，跟他相处也舒服。他年轻英俊，够聪明，又非常富有，比劳伦斯家富得多。我想他的家人不会反对。他们个个善良、有教养又慷慨，也都喜欢我，我在那里一定会很幸福。
        - id: ch03-b07
          speaker: amy
          text: 弗雷德是双胞胎里的哥哥，将来大概会继承产业。那份产业可真气派。城里的宅子坐落在时髦街区，没有我们那些大房子那么炫耀，却舒适一倍，处处是英国人看重的扎实奢华。我喜欢这种真材实料。我亲眼看过家里的银器、祖传珠宝和老仆人，也看过乡间宅邸的图画。那里有大片园林、一座大房子、美丽的庭园，还有好马。我要的就是这些。我宁愿拥有这些真正的好日子，也不要姑娘们急着抢到手、背后却空空如也的头衔。
        - id: ch03-b08
          speaker: amy
          text: 我也许贪财，可我讨厌贫穷，能早一分钟摆脱，就不愿多忍一分钟。我们姐妹总得有一个嫁得好。梅格没有，乔不会，贝思眼下还不能，那就由我来，把大家的日子都安排妥当。我绝不会嫁给自己憎恨或看不起的人，这一点您尽管放心。弗雷德虽不是我心里那种完美的英雄，却已经相当不错。只要他很爱我，也肯让我随自己的心意，时间久了，我也会足够喜欢他。我一直在认真盘算，并不是一时冲动。
        - id: ch03-b09
          speaker: amy
          text: 我想了整整一星期，因为谁都看得出他喜欢我。他从不陪弗洛，总要坐在我身边，散步也挨着我。独处时，他满脸多情。别人来同我讲话，他便皱眉。昨天，一个奥地利军官盯着我们，还对身旁那个浪荡模样的男爵说我是个美极了的金发姑娘。弗雷德凶得像狮子，切肉时险些把肉甩出盘子。他不像一般英国人那样冷淡拘谨，脾气很火爆。毕竟他有苏格兰血统，那双漂亮的蓝眼睛也像在说明这一点。
        - id: ch03-b10
          speaker: amy
          text: 昨晚日落时，我们去了城堡。只有弗雷德没同去，他要先到邮件待领处取信，稍后来会合。我们兴致勃勃地穿过废墟，钻进存放巨型酒桶的地窖，又游览选帝侯多年前为英国妻子修的美丽花园。我最喜欢那座大露台，因为眼前的景色简直如在天上。其他人进屋参观，我独自在外面，试着画墙上的灰石狮头，狮头四周垂着一串串鲜红爬藤。内卡河从山谷中流过，山下传来奥地利乐队的音乐。我坐着等候情人，简直像故事书里的姑娘，仿佛走进了一段传奇。我预感会有事发生，也准备好了。我没有脸红，也没有发抖，心里很镇定，只是有一点激动。
        - id: ch03-b11
          speaker: amy
          text: 过了一会儿，我听见弗雷德的声音。他匆匆穿过高大的拱门来找我，满脸忧虑。我马上把自己的心事全忘了，问他出了什么事。原来他刚收到家里的信，说弗兰克病得很重，催他赶快回去。他必须立刻搭夜车离开，只来得及跟我们道别。我为他难过，也为自己失望。可那份失望只持续了一瞬，因为他一面同我握手，一面用一种绝不会叫人误会的口气问我。
        - id: ch03-b12
          speaker: fred
          text: 我很快就回来。艾米，你不会忘了我吧？
        - id: ch03-b13
          speaker: amy
          text: 我没有承诺，只抬眼看他，他似乎已经满意了。接下来只来得及托付口信、互相道别，因为一个钟头后他便离开了。如今我们大家都很想念他。我知道他原本想开口，可从他过去透露的一点意思看，他大概答应过父亲，眼下暂不求婚。他性子冒失，那位老先生又很怕儿子娶一个外国媳妇。我们很快会在罗马见面。到那时，如果我没改变主意，他问我愿不愿意，我就回答：“好的，谢谢你。”
        - id: ch03-b14
          speaker: amy
          text: 这件事当然绝对保密，可我希望您知道这里正在发生什么。别为我担心，记着我是您那个“谨慎的艾米”。您尽管放心，我不会冒冒失失地做事。也请尽量多给我一些忠告，能听从的，我一定会听从。我多想现在就见到您，坐下来好好谈一谈。妈妈，请爱我，也请相信我。永远爱您的艾米。
