  chapters:
    - id: ch01
      title: London
      blocks:
        - id: ch01-b01
          speaker: amy
          text: Dearest people, here I am at last, sitting by a front window at the Bath Hotel in Piccadilly. It isn't fashionable, but Uncle stayed here years ago and refuses to go anywhere else. We won't be here long, so it hardly matters. I couldn't possibly tell you how much I'm enjoying everything. Instead, I'll give you pieces from my notebook. Ever since we left, I've done almost nothing but sketch and scribble.
        - id: ch01-b02
          speaker: amy
          text: I sent you a few miserable words from Halifax. After that, though, the voyage was delightful. I was hardly seasick at all. I stayed on deck all day and met plenty of pleasant people. Everyone was kind, especially the officers. Don't laugh, Jo. Gentlemen are truly useful at sea. A lady needs someone to hold on to and someone to wait on her. Besides, the officers have so little to do that letting them help is an act of mercy. Otherwise, I fear they'd smoke themselves to death.
        - id: ch01-b03
          speaker: amy
          text: Aunt and Flo felt ill the whole way and preferred to be left alone. Once I'd done all I could for them, I went off to enjoy myself. I walked the deck, watched glorious sunsets, and breathed that splendid air above the waves. When the ship rushed forward, it was nearly as thrilling as riding a fast horse. I wished Beth were there. The sea would have done her so much good. Jo would have climbed onto the maintop jib, or whatever that high place is called. She'd have befriended the engineers and blown the captain's speaking trumpet in pure delight.
        - id: ch01-b04
          speaker: amy
          text: The voyage was heavenly, but I was still glad when Ireland came into sight. The coast looked lovely in the early morning, all green and sunny, with brown cabins scattered about, ruins on the hills, and country houses down in the valleys. Deer grazed in the parks. Little boats filled the bay, the shore looked like a picture, and a rosy sky hung above it all. Getting up early was worth it. I'll never forget that view.
        - id: ch01-b05
          speaker: amy
          text: One of my new acquaintances, Mr. Lennox, left us at Queenstown. I happened to mention the Lakes of Killarney. He sighed, looked straight at me, and sang this.
        - id: ch01-b06
          speaker: robert_lennox
          text: Oh, have you ever heard of Kate Kearney? She lives on the banks of Killarney. Beware of her eye. From its glance you must fly, for the glance of Kate Kearney is fatal.
        - id: ch01-b07
          speaker: amy
          text: Wasn't that nonsense?
        - id: ch01-b08
          speaker: amy
          text: We spent only a few hours in Liverpool. It was dirty and noisy, and I was happy to leave. Uncle immediately bought dogskin gloves, ugly thick shoes, and an umbrella. Then he had his whiskers shaved in the mutton-chop style. He was quite pleased with himself and believed he looked like a true Briton. But the first bootblack who cleaned the mud from his shoes knew better.
        - id: ch01-b09
          speaker: bootblack
          text: There you are, sir. I've given them the newest Yankee shine.
        - id: ch01-b10
          speaker: amy
          text: Uncle thought that was wonderfully funny. And I must tell you what that ridiculous Lennox did. He asked his friend Ward, who traveled on with us, to order flowers for me. The first thing I found in my room was a beautiful bouquet. The card read, “Robert Lennox's compliments.” Wasn't that fun, girls? I like traveling.
        - id: ch01-b11
          speaker: amy
          text: At this rate I'll never reach London, so I must hurry. The train ride felt like passing through a long gallery of beautiful landscapes. I loved the farmhouses most, with their thatched roofs, ivy climbing to the eaves, and little-paned windows. Stout women stood in the doorways with rosy children. Even the cattle seemed calmer than ours as they stood knee-deep in clover. The hens clucked contentedly, as if English hens never suffered from Yankee nerves.
        - id: ch01-b12
          speaker: amy
          text: I'd never seen such perfect color. The grass was so green, the sky so blue, the grain so yellow, and the woods so dark. I was delighted all the way, and so was Flo. We bounced from one side of the train to the other, trying to catch every sight while racing along at sixty miles an hour. Aunt slept because she was tired. Uncle read his guidebook and refused to be impressed by anything. This is how it went.
        - id: ch01-b13
          speaker: amy
          text: Oh, that gray place among the trees must be Kenilworth!
        - id: ch01-b14
          speaker: flo
          text: How lovely! Papa, we must visit it someday. Won't we?
        - id: ch01-b15
          speaker: uncle_carrol
          text: No, my dear. Not unless you'd like some beer. That's a brewery.
        - id: ch01-b16
          speaker: amy
          text: There was a pause. Then Flo spotted something else.
        - id: ch01-b17
          speaker: flo
          text: Goodness! There's a gallows, and a man is climbing it!
          emotion: surprised
        - id: ch01-b18
          speaker: amy
          text: Where? Where?
          emotion: surprised
        - id: ch01-b19
          speaker: amy
          text: I stared at two high posts joined by a beam, with chains hanging down.
        - id: ch01-b20
          speaker: uncle_carrol
          text: It's a coal mine.
        - id: ch01-b21
          speaker: amy
          text: Uncle's eyes twinkled. Soon I saw another charming sight.
        - id: ch01-b22
          speaker: amy
          text: Look at that sweet flock of lambs lying down.
        - id: ch01-b23
          speaker: flo
          text: See, Papa? Aren't they lovely?
        - id: ch01-b24
          speaker: uncle_carrol
          text: Those are geese, young ladies.
        - id: ch01-b25
          speaker: amy
          text: That quieted us. Flo settled down with The Flirtations of Captain Cavendish, and I had the scenery to myself.
        - id: ch01-b26
          speaker: amy
          text: Naturally, it rained when we reached London. Fog and umbrellas were all we could see. We rested, unpacked, and did a little shopping between showers. Aunt Mary bought me several things because I'd left home too quickly to prepare properly. I have a white hat with a blue feather, a matching muslin dress, and the loveliest mantle you ever saw. Shopping on Regent Street is splendid. Everything seems so cheap. Pretty ribbon costs only sixpence a yard, so I bought plenty. I'll wait for Paris to buy gloves. Doesn't that sound wonderfully elegant and rich?
        - id: ch01-b27
          speaker: amy
          text: While Aunt and Uncle were out, Flo and I ordered a hansom cab just for the fun of it. We learned later that young ladies weren't supposed to ride in one alone. Once the wooden apron shut us in, the driver set off so fast that Flo became frightened and begged me to stop him. The trouble was, he sat somewhere above and behind us. I couldn't reach him. He neither heard my calls nor saw me waving my parasol out front. We could do nothing but rattle along, flying around corners at a terrifying speed.
        - id: ch01-b28
          speaker: amy
          text: At last I found a little door in the roof and pushed it open. A red eye appeared, and a beery voice answered.
        - id: ch01-b29
          speaker: cabman
          text: Well then, ma'am?
        - id: ch01-b30
          speaker: amy
          text: I gave him my order as seriously as I could.
        - id: ch01-b31
          speaker: cabman
          text: Aye, aye, ma'am.
        - id: ch01-b32
          speaker: amy
          text: He slammed the door and slowed the horse to a funeral pace. I opened it again.
        - id: ch01-b33
          speaker: amy
          text: A little faster, please.
        - id: ch01-b34
          speaker: amy
          text: At once we were tearing along as wildly as before. There was nothing left to do but accept our fate.
        - id: ch01-b35
          speaker: amy
          text: Today the weather cleared, and we visited Hyde Park, which is close by. We are much more aristocratic than we look. The Duke of Devonshire lives nearby, and I often see his footmen lounging at the back gate. The Duke of Wellington's house isn't far away either. Oh, my dear, what sights I saw! It was as entertaining as Punch.
        - id: ch01-b36
          speaker: amy
          text: Fat dowagers rolled past in red and yellow coaches. Behind them stood magnificent footmen in silk stockings and velvet coats, while powdered coachmen sat in front. There were neat maids with the rosiest children, handsome girls who looked half asleep, dandies lounging about in strange English hats and lavender gloves, and tall soldiers in short red jackets. Their caps sat crooked on their heads like muffins. They looked so funny that I wanted to sketch every one.
        - id: ch01-b37
          speaker: amy
          text: Rotten Row means Route de Roi, the king's way, though now it looks more like a riding school. The horses are splendid. The men ride well, especially the grooms, but the women sit stiffly and bounce, which is not how we do it at home. I longed to show them a proper American gallop. Instead, they trotted solemnly up and down in narrow riding habits and tall hats, like women from a toy Noah's Ark.
        - id: ch01-b38
          speaker: amy
          text: Everyone rides there, from old men and stout ladies to little children. The young people also do plenty of flirting. I saw one pair exchange rosebuds. Wearing a rosebud in your buttonhole is the fashion, and I thought it was a rather charming idea.
        - id: ch01-b39
          speaker: amy
          text: This afternoon we went to Westminster Abbey. Don't ask me to describe it. I can't. I can only say it was sublime. Tonight we're going to see Fechter at the theater, the perfect ending to the happiest day of my life.
        - id: ch01-b40
          speaker: amy
          text: It is very late, but I can't send this letter without adding what happened last night. Guess who arrived while we were having tea. Fred and Frank Vaughn, Laurie's English friends! I was so surprised that I wouldn't have known them without their cards. Both are tall now and have whiskers. Fred is handsome in the English fashion. Frank looks much better. He limps only a little and no longer uses crutches.
        - id: ch01-b41
          speaker: amy
          text: Laurie had told them where to find us. They came to invite us to their house, but Uncle won't go, so we'll return the call and see them when we can. They joined us at the theater, and we had a wonderful time. Frank devoted himself to Flo. Fred and I talked about old fun, present fun, and fun still to come, as if we'd known each other forever.
        - id: ch01-b42
          speaker: amy
          text: Tell Beth that Frank asked about her and was sorry she was ill. Fred laughed when I mentioned Jo and sent his respectful compliments to “the big hat.” Neither brother had forgotten Camp Laurence or the good times we had there. Doesn't it seem ages ago?
        - id: ch01-b43
          speaker: amy
          text: Aunt has tapped on the wall three times, so I must stop. I feel like a fashionable London lady staying out too late. My room is full of pretty things, and my head is all mixed up with parks, theaters, new dresses, and gallant gentlemen who say “Ah!” while twirling their blond mustaches with true English lordliness. For all my nonsense, I long to see you. I am, as always, your loving Amy.
    - id: ch02
      title: Paris
      blocks:
        - id: ch02-b01
          speaker: amy
          text: Dear girls, in my last letter I told you about London, the Vaughns' kindness, and all the pleasant parties they arranged for us. My favorite outings were Hampton Court and the Kensington Museum. At Hampton Court I saw Raphael's cartoons. At the museum there were whole rooms of paintings by Turner, Lawrence, Reynolds, Hogarth, and the other great artists.
        - id: ch02-b02
          speaker: amy
          text: Our day in Richmond Park was charming too. We had a proper English picnic. Everywhere I looked, there were magnificent oak trees and groups of deer, far more than I could ever copy. I heard a nightingale and watched larks rise into the sky. Thanks to Fred and Frank, we saw London to our hearts' content. We hated to leave. English people may take their time welcoming you, but once they decide to do it, no one can be more hospitable. The Vaughns hope to meet us in Rome next winter. I'll be terribly disappointed if they don't. Grace and I have become great friends, and the boys are very nice, especially Fred.
        - id: ch02-b03
          speaker: amy
          text: We had barely settled in Paris when Fred appeared again. He said he was taking a holiday on his way to Switzerland. Aunt looked grave at first, but he behaved as if it were the most natural thing in the world, so she couldn't object. Now we're all getting along beautifully and are very glad he came. His French sounds native, and I don't know what we'd do without him.
        - id: ch02-b04
          speaker: amy
          text: Uncle knows fewer than ten French words. He simply speaks English very loudly, as if that might make everyone understand. Aunt's pronunciation is old-fashioned. Flo and I had imagined we knew quite a lot, but we quickly discovered otherwise. So we're grateful whenever Fred handles the parley-vooing, as Uncle calls it.
        - id: ch02-b05
          speaker: amy
          text: We're having delightful days. We sightsee from morning until night, stop for lovely lunches in cheerful cafes, and stumble into all kinds of funny adventures. When it rains, I spend the day in the Louvre enjoying the pictures. Jo would turn up her naughty nose at some of the finest because she has no feeling for art. I do, and I'm training my eye and taste as fast as possible.
        - id: ch02-b06
          speaker: amy
          text: Jo would care more for the belongings of famous people. I've seen Napoleon's cocked hat and gray coat, his baby's cradle, and even his old toothbrush. I've also seen Marie Antoinette's tiny shoe, the ring of Saint Denis, Charlemagne's sword, and many more interesting things. When I come home, I'll talk about them for hours. I have no time to write it all now.
        - id: ch02-b07
          speaker: amy
          text: The Palais Royal is heavenly, packed with jewelry and beautiful things. It nearly drives me wild because I can't buy them. Fred offered to purchase something for me, but of course I refused. The Bois and the Champs-Élysées are magnificent too.
        - id: ch02-b08
          speaker: amy
          text: I've seen the imperial family several times. The emperor is an ugly, hard-looking man. The empress is pale and pretty, but I thought she showed dreadful taste in a purple dress, green hat, and yellow gloves. Little Nap is a handsome boy. He chats with his tutor and blows kisses to the people while riding in a four-horse carriage. Postilions in red satin jackets ride with him, and mounted guards go before and behind.
        - id: ch02-b09
          speaker: amy
          text: We often walk in the Tuileries Gardens because they're lovely, though I prefer the older Luxembourg Gardens. Père Lachaise is very curious. Many tombs look like little rooms. When you peer inside, you see a table with a picture or figure of the dead person and chairs where mourners can sit when they come to grieve. It is all so thoroughly French.
        - id: ch02-b10
          speaker: amy
          text: Our rooms are on the Rue de Rivoli. From the balcony we can look both ways along the long, brilliant street. It's so pleasant there that when we're too tired to go out after a day of sightseeing, we sit and talk all evening. Fred is wonderfully entertaining. Altogether, he's the most agreeable young man I've ever known, except Laurie, whose manners are more charming.
        - id: ch02-b11
          speaker: amy
          text: I only wish Fred were dark-haired because fair men aren't my taste. Still, the Vaughns are very rich and come from an excellent family. It would be foolish to complain about their yellow hair when mine is even yellower.
        - id: ch02-b12
          speaker: amy
          text: Next week we leave for Germany and Switzerland. We'll travel quickly, so my letters will have to be short. I keep my diary and try to follow Father's advice. He told me to remember accurately and describe clearly everything I see and admire. It is good practice. Between the diary and my sketchbook, you'll understand my journey much better than you could from these hurried notes.
        - id: ch02-b13
          speaker: amy
          text: Farewell. I embrace you tenderly. Your friend, Amy.
    - id: ch03
      title: Heidelberg
      blocks:
        - id: ch03-b01
          speaker: amy
          text: My dear Mamma, I have a quiet hour before we leave for Berne, so I'll tell you what has happened. Some of it is quite important, as you'll soon see.
        - id: ch03-b02
          speaker: amy
          text: Our trip up the Rhine was perfect. I simply sat there and enjoyed it with all my heart. Find Father's old guidebooks and read about the river, because I have no words beautiful enough for it. We had a lovely time at Coblenz. Fred met some students from Bonn on the boat, and they gave us a serenade.
        - id: ch03-b03
          speaker: amy
          text: It was a moonlit night. At about one in the morning, the sweetest music woke Flo and me beneath our windows. We jumped out of bed and hid behind the curtains. Peeking through them, we saw Fred and the students singing below. It was the most romantic sight I'd ever seen. There was the river, the bridge made of boats, the great fortress across the water, moonlight over everything, and music that could have softened a heart of stone.
        - id: ch03-b04
          speaker: amy
          text: When the serenade ended, we tossed down some flowers. The young men scrambled to catch them, kissed their hands toward the ladies they couldn't see, and went off laughing. I suppose they went to smoke and drink beer. The next morning, Fred showed me a crushed flower tucked into his vest pocket. He looked very sentimental.
        - id: ch03-b05
          speaker: amy
          text: I laughed and told him Flo had thrown that flower, not me. He looked disgusted, tossed it out the window, and became sensible again. I'm afraid that boy may give me trouble. Things are beginning to look that way.
        - id: ch03-b06
          speaker: amy
          text: The baths at Nassau were very lively, and so was Baden-Baden. Fred lost money there, and I scolded him. He needs someone to watch over him when Frank isn't nearby. Kate once said she hoped Fred would marry soon. I agree that marriage would be good for him.
        - id: ch03-b07
          speaker: amy
          text: Frankfurt was delightful. I visited Goethe's house, saw Schiller's statue, and admired Dannecker's famous Ariadne. The statue was beautiful, but I would have appreciated it more if I'd known the story. I didn't dare ask because everyone else knew it, or pretended to. I wish Jo would explain it to me. I should have read more. Discovering how little I know is humiliating.
        - id: ch03-b08
          speaker: amy
          text: Now I come to the serious matter. It happened here in Heidelberg, and Fred has just left us. He has been so kind and cheerful that all of us grew very fond of him. Until the night of the serenade, I thought of him only as a traveling friend. Since then, I've begun to see that our moonlit walks, balcony conversations, and daily adventures meant more to him than simple fun.
        - id: ch03-b09
          speaker: amy
          text: Truly, Mother, I haven't flirted. I remembered what you told me and tried my very best. I can't help it when people like me. I never try to make them do it, and when I don't return their feelings, it troubles me. Jo says I have no heart, but that isn't true.
        - id: ch03-b10
          speaker: amy
          text: I know you'll shake your head, and the girls will call me a mercenary little wretch. Even so, I've decided what to do. If Fred asks me to marry him, I'll accept, though I'm not wildly in love. I like him, and we're comfortable together. He's handsome, young, clever enough, and extremely rich, much richer than the Laurences. I don't believe his family would object. They're kind, generous, well-bred people, and they like me, so I think I could be very happy with them.
        - id: ch03-b11
          speaker: amy
          text: Fred is the elder twin, so I suppose he'll inherit the estate. What a splendid estate it is! Their city house stands on a fashionable street. It isn't as showy as our grand American houses, but it is twice as comfortable and filled with the solid luxury English people value. I like that because it feels genuine. I've seen the silver, the family jewels, the old servants, and pictures of the country home with its park, great house, lovely grounds, and fine horses. I could ask for nothing more.
        - id: ch03-b12
          speaker: amy
          text: I'd rather have all that than one of the titles girls rush to marry, only to find there is nothing behind it. Perhaps I am mercenary, but I hate poverty, and I mean to escape it as soon as I honestly can. One of us must marry well. Meg didn't. Jo won't. Beth can't yet. So I will, and then I can help make things right for everyone.
        - id: ch03-b13
          speaker: amy
          text: I would never marry a man I hated or looked down on. You know that. Fred isn't the hero I've always imagined, but he is quite good enough. If he loved me very much and let me live as I pleased, I believe I could grow fond enough of him in time.
        - id: ch03-b14
          speaker: amy
          text: I've spent the past week thinking it over because Fred's feelings have become impossible to miss. He hasn't said anything plainly, but small things give him away. He never walks with Flo when he can walk with me. In the carriage, at the table, and along the promenade, he always finds the place beside mine. When we're alone, he looks sentimental. If another man tries to speak to me, Fred scowls.
        - id: ch03-b15
          speaker: amy
          text: At dinner yesterday, an Austrian officer stared at us. Then he said something to his rakish-looking baron friend about a beautiful little blonde. Fred looked as fierce as a lion. He attacked his meat so violently that it nearly flew off the plate. He isn't one of those cool, stiff Englishmen. He's rather hot-tempered because there is Scottish blood in him. You might guess it from his bonnie blue eyes.
        - id: ch03-b16
          speaker: amy
          text: Last evening, near sunset, we all went up to Heidelberg Castle. Fred stayed behind to collect his letters from the post office and planned to meet us there. We wandered happily through the ruins and the vaults that hold the enormous wine cask. We also explored the beautiful gardens an elector built long ago for his English wife.
        - id: ch03-b17
          speaker: amy
          text: I loved the great terrace best because the view was heavenly. When everyone else went indoors to see the rooms, I remained outside to sketch a gray stone lion's head in the wall, framed by sprays of scarlet woodbine. Sitting there felt like stepping into a romance. The Neckar flowed through the valley below. An Austrian band was playing, and I waited for my lover like a girl in a storybook.
        - id: ch03-b18
          speaker: amy
          text: I felt sure something was about to happen, and I was ready. I wasn't blushing or trembling. I felt quite cool, with just a little excitement.
        - id: ch03-b19
          speaker: amy
          text: After a while, I heard Fred's voice. He hurried through the great arch to find me, but he looked so troubled that I forgot all about myself and asked what was wrong. A letter had just arrived, begging him to return home because Frank was very ill. Fred had to leave on the night train. There was only enough time to say goodbye.
        - id: ch03-b20
          speaker: amy
          text: I was deeply sorry for him and disappointed for myself, though that lasted only a moment. When Fred took my hand, he spoke in a way I couldn't misunderstand.
        - id: ch03-b21
          speaker: fred_vaughn
          text: I'll be back soon. You won't forget me, will you, Amy?
          emotion: sad
        - id: ch03-b22
          speaker: amy
          text: I made no promise. I only looked at him, and that seemed to satisfy him. There wasn't time for anything more than messages and farewells. He left within the hour, and all of us miss him very much.
        - id: ch03-b23
          speaker: amy
          text: I know he meant to say more. Something he once hinted makes me think he promised his father not to do anything of that kind yet. Fred can be rash, and the old gentleman dreads the idea of a foreign daughter-in-law. We'll meet again soon in Rome. If I haven't changed my mind by then, I'll say, “Yes, thank you,” when he asks, “Will you, please?”
        - id: ch03-b24
          speaker: amy
          text: Of course, all of this is very private. I wanted you to know what was happening. Please don't worry about me. Remember that I am your prudent Amy, and trust me not to do anything reckless. Send as much advice as you like. I'll follow it if I can.
        - id: ch03-b25
          speaker: amy
          text: I wish I could sit down with you for a long talk, Marmee. Love me and trust me. Ever your Amy.
