audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，带着克制的幽默, timbre: 清澈柔和, pace: 从容舒展, pitch: 中音}
    jo:
      display_name: 乔
      tts: {delivery: 爽直活泼，情感来得快而真, timbre: 明亮有力, pace: 稍快, pitch: 中音}
    amy:
      display_name: 艾米
      tts: {delivery: 讲究而伶俐，偶尔流露稚气, timbre: 清脆, pace: 适中, pitch: 中高音}
    hannah:
      display_name: 汉娜
      tts: {delivery: 爽快亲切，带着老仆人的直率, timbre: 温厚, pace: 适中, pitch: 中低音}
    chester_lady:
      display_name: 切斯特家的小姐
      tts: {delivery: 矜持挑剔，言语直率, timbre: 清亮, pace: 适中, pitch: 中高音}
    young_gentleman:
      display_name: 年轻先生
      tts: {delivery: 兴致勃勃，随和爱笑, timbre: 清朗, pace: 轻快, pitch: 中音}
    miss_lamb:
      display_name: 兰姆小姐
      tts: {delivery: 热情好奇，容易被逗乐, timbre: 明亮, pace: 适中偏快, pitch: 中高音}
    elder_miss_lamb:
      display_name: 兰姆家大女儿
      tts: {delivery: 客气周到，带着社交场上的亲切, timbre: 柔和, pace: 适中, pitch: 中高音}
    aunt_carrol:
      display_name: 卡罗尔姑妈
      tts: {delivery: 亲切端庄，话里常留分寸, timbre: 温和清晰, pace: 从容, pitch: 中音}
    aunt_march:
      display_name: 马奇姑婆
      tts: {delivery: 粗声直率，挑剔而威严, timbre: 苍老干脆, pace: 偏慢, pitch: 中低音}
    polly:
      display_name: 波莉
      tts: {delivery: 尖锐滑稽，爱学舌, timbre: 嘶哑尖亮, pace: 忽快忽慢, pitch: 高音}
  chapters:
    - id: ch01
      title: 第二十九章　拜访
      blocks:
        - id: ch01-b01
          speaker: amy
          text: 乔，来吧，到时候了。
        - id: ch01-b02
          speaker: jo
          text: 什么到时候了？
        - id: ch01-b03
          speaker: amy
          text: 你真忘了？你答应今天陪我去回访邻居，一共六家。
        - id: ch01-b04
          speaker: jo
          text: 我这辈子是干过不少冒失的傻事，可我还没疯到答应一天拜访六家。去一家，就够我难受一个星期了。
        - id: ch01-b05
          speaker: amy
          text: 你就是答应了。我们说好的，我替你画完贝思的蜡笔肖像，你规规矩矩陪我去拜访。
        - id: ch01-b06
          speaker: jo
          text: 契约上说的是天晴，我当然逐字履行，夏洛克。可东边堆着一大片云，所以天不晴，我也不去。
        - id: ch01-b07
          speaker: amy
          text: 这叫耍赖。天气好得很，根本不像要下雨。你不是最看重守信吗？那就来尽本分。做完这一回，你又能安生半年。
        - id: ch01-b08
          speaker: narrator
          text: 乔正忙着做衣裳。她是全家的裁缝总管，还很得意自己拿针和拿笔一样在行。新衣刚试到一半，却要她在七月的热天穿上最好的一身去应酬，实在扫兴。她最恨正式拜访，若不是艾米拿交易、贿赂或诺言逼她，她绝不会去。这回实在逃不掉了。乔反抗似的把剪刀铿锵一合，还说自己闻到了雷雨味。最后，她收起活计，拿上帽子和手套，摆出舍身赴难的样子，宣布牺牲品已经准备好了。
        - id: ch01-b09
          speaker: amy
          text: 乔·马奇，你别扭得能把圣人气坏！你不会真想穿成这样去拜访吧？
          emotion: surprised
        - id: ch01-b10
          speaker: jo
          text: 为什么不行？我这一身干净、凉快又舒服，最适合大热天走尘土路。谁要是看重我的衣服胜过看重我，我也不想见他。你尽管替我们两个打扮。漂亮衣裳穿在你身上才值得，我穿花边褶饰，只会浑身难受。
        - id: ch01-b11
          speaker: amy
          text: 她又犯拧脾气了！等我把她收拾体面，自己非先疯掉不可。今天出门对我也不是享受，可这笔社交债得由我们两个来还。乔，只要你肯好好打扮，陪我去尽礼数，要我做什么都行。你认真起来，话说得好，穿上好衣裳也很有气派，举止漂亮得叫我骄傲。我不敢一个人去，你就来照看我吧。
        - id: ch01-b12
          speaker: jo
          text: 你这只狡猾的小猫，居然这样奉承哄骗坏脾气的姐姐。说我气派又有教养，还说你不敢独自出门，真不知道哪一样更荒唐。好吧，我非去不可就去，也尽力而为。你来当远征队的统帅，我闭着眼睛服从。这样满意了吗？
        - id: ch01-b13
          speaker: narrator
          text: 乔一下子从满身拧劲儿，变成了温顺的小羊。
        - id: ch01-b14
          speaker: amy
          text: 你真是个小天使！快把最好的东西都穿上。我会告诉你每一家该怎样应对，好让人喜欢你。头发梳得漂亮些，帽子上别那朵粉红玫瑰。你穿素衣裳太严肃了。再戴浅色手套，拿绣花手帕。我们先去梅格家借白阳伞，然后你用我那把鸽灰色的。
        - id: ch01-b15
          speaker: narrator
          text: 艾米一边穿衣，一边发号施令。乔虽然句句抗议，倒也句句照办。套上窸窣作响的新蝉翼纱裙时，她长吁短叹。把帽带系成完美的蝴蝶结时，她对镜子直皱眉。戴领子时，她恶狠狠地和别针搏斗。抖开绣花手帕时，她更挤眉弄眼，因为那绣花叫她鼻子难受，正像今天的差事叫她心里难受。最后，她把双手硬塞进缀着三颗纽扣和一只流苏的紧手套，转过来摆出一张傻脸。
        - id: ch01-b16
          speaker: jo
          text: 我已经痛苦透了。不过你若觉得我还能见人，我就死而无憾。
        - id: ch01-b17
          speaker: amy
          text: 非常令人满意。慢慢转一圈，让我好好看看。好了，这里理一理。对，这样就行。那顶白帽配玫瑰，真迷人。肩膀往后收，手自然放着，手套勒也别管。乔，你披披肩的样子确实好看。我就不行。幸亏马奇姑婆送了你这么漂亮的一条，样子简洁，又很华贵，搭在手臂上的褶子也好看。再看看我，斗篷尖在正中吗？裙子两边提得一样高吗？我喜欢把靴子露出来，因为我的脚漂亮，虽说鼻子不漂亮。
        - id: ch01-b18
          speaker: narrator
          text: 乔像个鉴赏家似的，用手在眼前围出一个框，端详艾米金发上的蓝羽毛。
        - id: ch01-b19
          speaker: jo
          text: 你是美的化身，是永恒的欢欣。请问，太太，我该让最好的裙子拖过尘土，还是把它提起来？
        - id: ch01-b20
          speaker: amy
          text: 走路时提着，进屋就放下。长裙曳地最适合你，你得学会优雅地拖着裙摆走。你有一只袖口还没扣好，马上扣起来。小处不留心，整个人就不会齐整。好看的整体，全靠这些细节凑起来。
        - id: ch01-b21
          speaker: narrator
          text: 乔叹着气去扣袖口，又把手套纽扣崩掉了。两个人总算收拾停当，扬帆似的出了门。汉娜从楼上窗口探出身子，看着她们走远。
        - id: ch01-b22
          speaker: hannah
          text: 真是漂亮得跟画儿一样！
          emotion: happy
        - id: ch01-b23
          speaker: narrator
          text: 她们先到梅格家借了白阳伞，又让一手抱着一个婴儿的梅格检阅了一遍。快到第一户人家时，艾米开始最后叮嘱。
        - id: ch01-b24
          speaker: amy
          text: 亲爱的乔，切斯特一家自认很高雅，你得拿出最好的举止。别突然冒怪话，也别做古怪事。只要沉着、冷静、安静，就最稳妥，也最像淑女。十五分钟而已，你轻易办得到。
        - id: ch01-b25
          speaker: jo
          text: 沉着、冷静、安静。好，我能答应。我在台上演过一本正经的小姐，这回在台下试试。孩子，放心吧，你很快就会看见我的本事。
        - id: ch01-b26
          speaker: narrator
          text: 艾米放下心来，顽皮的乔却故意照字面做足了。她四肢摆得优雅，衣褶垂得规整，沉着如夏日的海，冷静如冬天的雪堆，安静得像斯芬克斯。切斯特太太提到她那本“迷人的小说”，几位切斯特小姐又谈起舞会、野餐、歌剧和时装。无论别人说什么，乔只微笑、点头，再冷冰冰地答一声“是”或“不是”。艾米拼命用眼神叫她说话，设法引她开口，还偷偷用脚踢她。乔却仿佛全没察觉，仍旧仪态万方，恰似诗中莫德的脸，冰冷而匀整，华美却空茫。
        - id: ch01-b27
          speaker: chester_lady
          text: 马奇家那位大姑娘真傲慢，也真没趣！
        - id: ch01-b28
          speaker: narrator
          text: 门刚在客人身后关上，这句不幸说得太响的话就传了出来。乔一路穿过门厅都在无声发笑。艾米却厌恶地看着这场失败。她的教导全被乔用错了，自然把过错全算在姐姐头上。
        - id: ch01-b29
          speaker: amy
          text: 你怎么能把我的话听成那样？我只要你端庄从容，你却成了一块木头、一尊石像。到了兰姆家，你要合群。像别的姑娘那样闲聊，对衣裳、调情，还有随口提到的无聊事都显得有兴趣。他们结交的是上流社会，很值得我们来往。我无论如何都不愿在那里留下坏印象。
        - id: ch01-b30
          speaker: jo
          text: 我一定讨人喜欢。我会闲扯，会傻笑，你要我为哪件小事惊叫或陶醉，我都照办。我开始觉得有趣了。现在我要演一个“迷人姑娘”，就拿梅·切斯特当榜样，而且演得比她更好。你等着瞧吧，兰姆家准会说，乔·马奇真是个活泼可爱的姑娘！
        - id: ch01-b31
          speaker: narrator
          text: 艾米担心得很，因为乔一旦胡闹起来，谁也不知道她会闹到哪里。姐姐轻盈地飘进下一间客厅，热烈地吻遍年轻小姐，又满面春风地向年轻先生们微笑，接着兴致勃勃地加入谈话。艾米脸上的神情可真值得一看。兰姆太太格外喜欢她，把她留在身边，硬要讲卢克丽霞最近一次发病的漫长经过。三个讨人喜欢的年轻先生守在附近，只等谈话稍停就来营救她。艾米脱不开身，也拦不住乔。乔像被淘气鬼附了身，说个不停，周围很快聚起一圈脑袋。零碎的话勾得艾米心痒，接连响起的笑声更让她恨不得去凑热闹。偏偏她只能听见这样的片段。
        - id: ch01-b32
          speaker: young_gentleman
          text: 她骑术真好。是谁教的？
        - id: ch01-b33
          speaker: jo
          text: 没人教。她从前把旧马鞍架在树上，练习上马、拉缰绳，还练着挺直身子。现在她什么马都敢骑，根本不知道害怕。马夫肯便宜租马给她，也是因为她会把马调教得适合小姐骑。她实在太爱骑马，我常说，别的路都走不通时，她还能靠驯马谋生。
        - id: ch01-b34
          speaker: narrator
          text: 艾米费了好大劲才忍住没有发作。乔把她说得像个放荡不羁的姑娘，而这种名声正是她最厌恶的。可她又能怎么办？兰姆太太的故事还讲在半截，她根本走不开。那篇漫长的故事还没收尾，那边的乔早已抖出更多滑稽的秘密，犯下更吓人的错误。
        - id: ch01-b35
          speaker: jo
          text: 那天艾米都绝望了。好马全叫人挑走，只剩三匹。一匹瘸，一匹瞎，最后一匹倔得一步不走，非往嘴里塞把土才肯动。带这样的牲口去游乐骑行，多合适呀，是不是？
        - id: ch01-b36
          speaker: young_gentleman
          text: 那她挑了哪匹？
        - id: ch01-b37
          speaker: jo
          text: 哪匹也没挑。她听说河对岸的农庄有匹小马，从没让小姐骑过，可她看那马漂亮又有精神，就决定试一试。没人肯把马牵来上鞍，她便把马鞍带去找马。亲爱的，她真的划船把马鞍运过河，再顶到头上，一直走进马棚，把那个老农夫看呆了！
        - id: ch01-b38
          speaker: young_gentleman
          text: 她后来骑了吗？
        - id: ch01-b39
          speaker: jo
          text: 当然骑了，还玩得痛快极了。我原以为她会被人七零八落地抬回来，谁知她把马驾驭得服服帖帖，整场游玩也数她最活跃。
        - id: ch01-b40
          speaker: young_gentleman
          text: 这才叫有胆量！
        - id: ch01-b41
          speaker: narrator
          text: 小兰姆先生赞许地望向艾米，还纳闷兰姆太太究竟说了什么，竟让她脸红得这样不自在。片刻以后，话题转到衣着，艾米的脸更红了。一位小姐问乔，野餐那天那顶漂亮的灰褐色帽子是在哪里买的。乔不提两年前买帽子的店，偏偏坦白了实情。
        - id: ch01-b42
          speaker: jo
          text: 哦，是艾米染的。那样柔和的颜色买不到，所以我们想要什么颜色就自己染。有个懂艺术的妹妹，真是方便。
        - id: ch01-b43
          speaker: miss_lamb
          text: 这个主意不是很新奇吗？
          emotion: surprised
        - id: ch01-b44
          speaker: jo
          text: 比起她别的高明本事，这不算什么。没有这孩子不会做的事。去萨莉的舞会时，她想要蓝靴子，就把弄脏的白靴染成最漂亮的天蓝色，穿起来简直像缎子。
        - id: ch01-b45
          speaker: narrator
          text: 乔满脸都是为妹妹的本事骄傲的神气，艾米却越听越恼火，恨不能把手里的名片盒直接朝她扔过去。若真能这么做，她一定会觉得痛快多了。
        - id: ch01-b46
          speaker: elder_miss_lamb
          text: 前些日子我们读了你的一篇小说，觉得很好看。
        - id: ch01-b47
          speaker: narrator
          text: 兰姆家的大女儿只是想恭维这位女作家，尽管乔这会儿实在不大像作家。可别人一提她的作品，乔总要犯毛病。她不是全身僵硬，一脸受了冒犯，就是生硬地把话题岔开。
        - id: ch01-b48
          speaker: jo
          text: 真遗憾，你们竟找不到更好的东西读。那种垃圾有人肯买，普通人也爱看，所以我才写。你们今年冬天去纽约吗？
        - id: ch01-b49
          speaker: narrator
          text: 兰姆小姐刚说喜欢那篇小说，这话当然既不感激，也不客气。乔一出口便知道错了，又怕越描越黑。她忽然想起应该由自己先告辞，便猛地起身，让三个人各有半句话留在嘴里。
        - id: ch01-b50
          speaker: jo
          text: 艾米，我们得走了。再见，亲爱的，一定来看我们。我们盼你来，盼得人都憔悴了。兰姆先生，我可不敢请您。不过您要是真来了，我恐怕也狠不下心赶您走。
        - id: ch01-b51
          speaker: narrator
          text: 乔故意学梅·切斯特那种热情得过了头的腔调，滑稽透顶。艾米赶紧逃出房间，心里又想笑，又想哭。
        - id: ch01-b52
          speaker: jo
          text: 我刚才表现得不错吧？
        - id: ch01-b53
          speaker: amy
          text: 再糟也不可能了。你中了什么邪，非要讲我的马鞍，还有帽子、靴子那些事？
          emotion: angry
        - id: ch01-b54
          speaker: jo
          text: 因为这些事好笑，能逗大家开心呀。他们知道我们穷，何必装作我们养得起马夫，每季能买三四顶帽子，日子也和他们一样轻松阔气？
        - id: ch01-b55
          speaker: amy
          text: 可你不用把我们省钱的小办法全说出来，毫无必要地揭自己的穷底。你一点正当的自尊心也没有，永远学不会什么时候该说，什么时候该闭嘴。
          emotion: angry
        - id: ch01-b56
          speaker: narrator
          text: 可怜的乔终于露出羞愧的神色。她一声不响地拿那块硬邦邦的绣花手帕擦着鼻尖，仿佛这点难受正好可以替自己的种种过错苦修赎罪。快到第三座大宅时，她才开口。
        - id: ch01-b57
          speaker: jo
          text: 这一家，我又该怎样表现？
        - id: ch01-b58
          speaker: amy
          text: 随你的便。我再也不管你了。
        - id: ch01-b59
          speaker: jo
          text: 那我自己找乐子。男孩子们都在家，大家能舒舒服服玩一阵。老天知道，我正需要换换空气，高雅的场面对我的身体可没有好处。
        - id: ch01-b60
          speaker: narrator
          text: 乔因为总也不能让人满意，心里也不好受，话说得很冲。不过三个大男孩和几个漂亮孩子热烈欢迎她，很快抚平了她的情绪。她把招待女主人和都铎先生的任务留给艾米，自己专心陪年轻人。她听大学里的故事听得津津有味，毫无怨言地抚摸猎犬和卷毛狗，还热烈赞同“汤姆·布朗真是条好汉”，全不管这种赞美是否文雅。有个男孩邀她去看乌龟池，她立刻跟着去了。那位母亲慈爱地笑着，扶正一顶被儿子们熊抱得一塌糊涂的帽子。那拥抱虽然笨重，却满是亲情，在她心里，远胜天才法国女发型师梳出的最完美发式。
        - id: ch01-b61
          speaker: narrator
          text: 艾米由着姐姐自行其是，自己也尽情享受起来。都铎先生的叔父娶了一位英国太太，而那位太太是某个在世勋爵的三表亲，所以艾米很敬重全家。她虽生在美国、长在美国，却也有一种许多人都摆脱不了的爵位崇拜。这像是对儿时帝王信仰的一点隐秘忠诚。几年前，一位金发王子到访，竟叫这个世上最民主的国家举国沸腾。年轻的美国依恋古老的英国，也像一个长大的儿子依恋那位专横的小母亲。她曾牢牢管着他，等他反抗离开，又用一顿责骂给他送行。不过，能和英国贵族的远亲说话再让人满足，艾米也没忘记时间。合乎礼数的分钟一到，她便恋恋不舍地离开这群高贵人物，赶紧去找乔，只盼姐姐别做出什么有辱马奇家名声的事。
        - id: ch01-b62
          speaker: narrator
          text: 情形本来还能更糟，可艾米已经觉得够糟了。乔坐在草地上，一群男孩像扎营似的围着她。一只脚上带泥的狗，正躺在她那条隆重的礼服裙摆上。乔给听众讲劳里的恶作剧。一个小孩拿艾米珍爱的阳伞戳乌龟，另一个在乔最好的帽子上方吃姜饼，第三个拿她的手套当球玩。可大家都快活极了。乔收起受损的东西准备离开时，孩子们还一路相送，求她再来，说听劳里的淘气故事实在太有趣。
        - id: ch01-b63
          speaker: jo
          text: 这些男孩真棒，是不是？跟他们玩一会儿，我觉得自己又年轻又精神了。
        - id: ch01-b64
          speaker: narrator
          text: 乔悠闲地走着，把双手背在身后。一半是平日养成的习惯，一半是为了把那把溅满泥点的阳伞藏起来。艾米明智地避开了这个话题，对姐姐那身已经破败不堪的装束一句也没评论。
        - id: ch01-b65
          speaker: amy
          text: 你为什么总躲着都铎先生？
        - id: ch01-b66
          speaker: jo
          text: 我不喜欢他。他爱摆架子，轻慢姐妹，叫父亲烦恼，说起母亲也没半点敬意。劳里说他品行不端，我也觉得他不值得结交，所以不理他。
        - id: ch01-b67
          speaker: amy
          text: 至少也该礼貌待他。你对他只冷冷点了一下头，刚才见到汤米·张伯伦，却笑着行了最周到的礼。汤米的父亲只是开杂货店的。你把点头和鞠躬换一下才对。
        - id: ch01-b68
          speaker: jo
          text: 才不对。哪怕都铎那位祖父的叔父的外甥的侄女，是某位勋爵的三表亲，我还是既不喜欢他，也不尊敬或欣赏他。汤米虽然穷，也腼腆，却善良又聪明。我看重他，也愿意让他知道。哪怕他总带着棕色纸包，他依然是位绅士。
        - id: ch01-b69
          speaker: amy
          text: 跟你讲道理根本没用。
        - id: ch01-b70
          speaker: jo
          text: 一点用也没有，亲爱的。所以我们不如摆出和蔼的脸，在这里留张名片。金家显然没人在家，为此我万分感激。
        - id: ch01-b71
          speaker: narrator
          text: 家里的名片盒尽过职责，姑娘们又往前走。到了第五家，听说小姐们正忙，不能见客，乔再次虔诚地道谢。
        - id: ch01-b72
          speaker: jo
          text: 现在回家吧。今天就别去马奇姑婆那里了，反正随时都能去。我们又累又烦，还穿着最好的衣裳在尘土里拖来拖去，实在可惜。
        - id: ch01-b73
          speaker: amy
          text: 请只说你自己。马奇姑婆喜欢我们郑重穿戴，正式登门。这只是件小事，却能叫她高兴。我不信它会糟蹋你的衣裳，至少不会比脏狗和乱冲乱撞的男孩糟蹋得更厉害。低下头，我替你掸掉帽子上的碎屑。
        - id: ch01-b74
          speaker: jo
          text: 艾米，你真是个好姑娘！要是我也能像你一样，轻轻松松做些小事讨人欢喜就好了。我也想得到，可做起来太费时间，所以总等着机会给人一个大恩惠，却把小事一件件漏掉。可到头来，还是小事最能说明心意吧。
        - id: ch01-b75
          speaker: narrator
          text: 乔愧疚地看看自己残破的衣装，又看看妹妹依旧清新整洁的一身。艾米一笑，气立刻消了，还摆出母亲般的口气。
        - id: ch01-b76
          speaker: amy
          text: 女人应该学会讨人喜欢，穷女人尤其应该，因为她们没有别的法子报答别人给的好意。你若记住这件事，认真练习，一定会比我更受人喜欢，因为你这个人比我更有分量。
        - id: ch01-b77
          speaker: jo
          text: 我是个古怪别扭的老东西，而且永远会这样。不过我承认你说得对。只是对我来说，为一个人拼命，比不想和气时还对他和气容易得多。一个人的爱憎太强烈，真是一大不幸，是不是？
        - id: ch01-b78
          speaker: amy
          text: 不能把爱憎藏好，才是更大的不幸。我和你一样不赞成都铎，可没人要我把这话告诉他，也没人要你说。用不着因为他惹人讨厌，就让自己也惹人讨厌。
        - id: ch01-b79
          speaker: jo
          text: 可是姑娘若不赞成年轻男子的行为，就该表明态度。除了从举止上显出来，还能怎么办？说教不管用。我管教泰迪，早就吃够了这苦头。可我不用开口，也有许多小办法影响他。既然可以，我说我们也该这样影响别人。
        - id: ch01-b80
          speaker: amy
          text: 泰迪是个非同寻常的男孩，不能拿来当别人的样板。假如我们是社交界的名媛，或有钱有地位的女人，也许能起一点作用。可我们只因不赞成一群年轻先生就朝他们皱眉，又因赞成另一群就朝他们微笑，根本不会有半点用处。人家只会觉得我们古怪又迂腐。
        - id: ch01-b81
          speaker: narrator
          text: 艾米说得无比庄严。那个“非同寻常的男孩”若是听见，准会笑得停不下来。
        - id: ch01-b82
          speaker: jo
          text: 原来只因为我们不是名媛和百万富翁，就得纵容自己厌恶的人和事，是吗？这道德可真漂亮。
        - id: ch01-b83
          speaker: amy
          text: 我不会和你争。我只知道世道就是这样，硬要和它对着干的人，白费力气以后还要受人嘲笑。我不喜欢改革者，也希望你永远别去做改革者。
        - id: ch01-b84
          speaker: jo
          text: 我偏喜欢他们。只要能做到，我就要做一个。哪怕遭人嘲笑，这世界若没有改革者，也永远不会进步。这件事上，我们不可能意见一样。你属于旧派，我属于新派。你会过得最顺利，我却会过得最热闹。我想，挨砖头、听嘘声，倒也挺有意思。
        - id: ch01-b85
          speaker: amy
          text: 好了，现在收敛一点。别拿你的新思想去烦姑婆。
        - id: ch01-b86
          speaker: jo
          text: 我会尽量忍住。可一到她面前，我就像中了邪，非得冒出一句格外直率的话，或者一番革命言论。这是我的命，我也没办法。
        - id: ch01-b87
          speaker: narrator
          text: 到了姑婆家，她们发现卡罗尔姑妈正陪着老太太。两人专心谈着一件很有意思的事。姑娘们一进来，她们便带着心虚的神色停住话头，一看就知道，刚才谈的是两个外甥女。乔心情不好，那股拧劲儿又回来了。艾米却觉得自己尽了责任，始终没发脾气，又讨得人人欢喜，此刻心境像天使一样和善。两位姑妈马上感受到了，亲热地一口一个“乖孩子”。她们的眼神也分明在说，艾米一天比一天好了。
        - id: ch01-b88
          speaker: aunt_carrol
          text: 亲爱的，你会去帮忙办义卖会吗？
        - id: ch01-b89
          speaker: narrator
          text: 艾米坐到卡罗尔姑妈身边，神情亲密又信任，正是老人最喜欢年轻人露出的样子。
        - id: ch01-b90
          speaker: amy
          text: 会的，姑妈。切斯特太太问过我，我答应照管一个摊位。我没有别的东西可捐，只有自己的时间。
        - id: ch01-b91
          speaker: jo
          text: 我不去。我讨厌别人摆出施恩的架势。切斯特一家以为肯让我们帮那场有高贵亲友撑腰的义卖会，就是天大的恩惠。艾米，你竟然答应了。他们只是想叫你干活。
        - id: ch01-b92
          speaker: amy
          text: 我愿意干活。义卖不只为了切斯特一家，也为了那些获得自由的黑人。他们肯让我一起做事，也一起享受乐趣，我觉得很厚道。只要人家的好意是真心的，我不介意受点照顾。
        - id: ch01-b93
          speaker: aunt_march
          text: 说得对，也很得体。我喜欢你这份感恩的心，亲爱的。帮助懂得领情的人，是件快乐的事。有些人却不懂，真叫人难受。
        - id: ch01-b94
          speaker: narrator
          text: 马奇姑婆从眼镜上方看了乔一眼。乔独自坐在旁边摇着椅子，神色阴沉。她哪里知道，此刻有一份巨大的幸福正在天平上摇摆。若是知道，她马上就会温顺得像鸽子。可惜我们胸前没有窗子，看不见朋友心里在想什么。通常这样倒好，可偶尔要是能看见，该省下多少烦恼、时间和脾气。乔接下来的一句话，让自己错失了好几年的快乐，也及时学到一课，什么时候该管住舌头。
        - id: ch01-b95
          speaker: jo
          text: 我不喜欢受人恩惠。那会压得我难受，仿佛自己成了奴隶。我宁可什么都靠自己，完完全全独立。
        - id: ch01-b96
          speaker: aunt_carrol
          text: 嗯哼。
        - id: ch01-b97
          speaker: aunt_march
          text: 我早就告诉过你。
        - id: ch01-b98
          speaker: narrator
          text: 卡罗尔姑妈轻轻咳了一声，又看了马奇姑婆一眼。马奇姑婆肯定地点点头。乔幸而不知道自己做了什么，只管翘着鼻子坐在那里，满脸革命者的神气，实在不讨人喜欢。卡罗尔姑妈把手放到艾米手上。
        - id: ch01-b99
          speaker: aunt_carrol
          text: 亲爱的，你会说法语吗？
        - id: ch01-b100
          speaker: amy
          text: 说得还不错。这要多谢马奇姑婆，她肯让埃丝特随时陪我练习。
        - id: ch01-b101
          speaker: narrator
          text: 艾米感激地看着老太太，老太太也和蔼地笑了。
        - id: ch01-b102
          speaker: aunt_carrol
          text: 乔，你的语言学得怎么样？
        - id: ch01-b103
          speaker: jo
          text: 一个字也不会。我一读书就笨得厉害，尤其受不了法语，那种语言又滑溜又傻气。
        - id: ch01-b104
          speaker: narrator
          text: 两位太太又交换了一个眼色。
        - id: ch01-b105
          speaker: aunt_march
          text: 亲爱的艾米，你如今身体很强健了吧？眼睛再没不舒服，是不是？
        - id: ch01-b106
          speaker: amy
          text: 一点也没有，谢谢您。我身体很好，打算明年冬天做出一番大事。这样等那个快乐的日子一到，我随时都能去罗马。
        - id: ch01-b107
          speaker: aunt_march
          text: 好孩子！你配去，我相信总有一天一定会去。
        - id: ch01-b108
          speaker: narrator
          text: 艾米替姑婆捡起毛线球，老太太赞许地拍拍她的头。波莉站在艾米椅背后面的栖木上，忽然弯下身来，认真窥探乔的脸。那副既无礼、又像在追问什么的滑稽样子，叫人无论如何也忍不住发笑。
        - id: ch01-b109
          speaker: polly
          text: 坏脾气，闩上门，守着炉火纺纱勤。
        - id: ch01-b110
          speaker: aunt_march
          text: 真是只明察秋毫的鸟。
        - id: ch01-b111
          speaker: polly
          text: 亲爱的，来散步吧？
        - id: ch01-b112
          speaker: narrator
          text: 波莉一边朝瓷器柜跳，一边望着那边，分明是在讨一块糖。
        - id: ch01-b113
          speaker: jo
          text: 谢谢，我愿意。来吧，艾米。
        - id: ch01-b114
          speaker: narrator
          text: 乔就这样结束了拜访，越发确信应酬确实有损健康。她像男子那样和两位姑妈握手，艾米却分别吻了她们。姑娘们离开时，一个留下阴影般的印象，一个留下阳光般的印象。等她们的身影消失，马奇姑婆才开口。
        - id: ch01-b115
          speaker: aunt_march
          text: 玛丽，你最好就这么办。钱由我来出。
        - id: ch01-b116
          speaker: aunt_carrol
          text: 只要她父母答应，我当然会办。
