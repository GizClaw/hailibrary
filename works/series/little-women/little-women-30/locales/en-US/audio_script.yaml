  chapters:
    - id: ch01
      title: Dressing for Duty
      blocks:
        - id: ch01-b01
          speaker: amy
          text: Come on, Jo. It's time.
        - id: ch01-b02
          speaker: jo
          text: Time for what?
        - id: ch01-b03
          speaker: amy
          text: You haven't forgotten, have you? You promised to make six calls with me today.
        - id: ch01-b04
          speaker: jo
          text: I've done plenty of foolish things, but surely I never agreed to six calls in one day. One call upsets me for a week.
        - id: ch01-b05
          speaker: amy
          text: You did agree. That was our bargain. I would finish the crayon portrait of Beth, and you would dress properly, come with me, and return the neighbors' visits.
        - id: ch01-b06
          speaker: jo
          text: Only if the weather was fair. That was part of the bargain, and I intend to hold you to it, Shylock. Look at those clouds in the east. The weather isn't fair, so I'm staying home.
        - id: ch01-b07
          speaker: amy
          text: That's pure shirking. It's a beautiful day, and there isn't a sign of rain. You pride yourself on keeping promises, so be honorable. Do your duty now, and you can rest easy for another six months.
        - id: ch01-b08
          speaker: narrator
          text: Jo was busy making a dress. She served as the general seamstress for the whole family and took special pride in handling a needle as well as a pen. Just then, she was in the middle of an important first fitting. Being stopped at that exact moment was bad enough. Being ordered into her finest clothes for formal calls on a hot July day was worse. Jo hated stiff visits and never made them until Amy cornered her with a bargain, bribe, or promise. This time the finished portrait of Beth left her no escape. She snapped her scissors in protest and insisted she could smell thunder coming. Then she put away her half-finished work, took up her hat and gloves with the air of someone marching to her fate, and announced that the victim was ready.
        - id: ch01-b09
          speaker: amy
          text: Jo March, you could test the patience of a saint! You aren't planning to make calls dressed like that, are you?
          emotion: surprised
        - id: ch01-b10
          speaker: jo
          text: Why not? I'm neat, cool, and comfortable. That's proper enough for a dusty walk on a hot day. If people care more about my clothes than me, I don't want to visit them. You can be elegant for both of us. Looking fine does you some good. It doesn't do a thing for me, and all those frills only get in my way.
        - id: ch01-b11
          speaker: amy
          text: Oh, dear. Now you're determined to disagree with everything, and you'll drive me out of my mind before I get you ready. I don't want to go today either, but we owe these visits, and nobody else can pay the debt. I'll do anything you ask if you'll only dress nicely and help me be civil. When you try, you talk beautifully, look distinguished in your best clothes, and behave so well that I'm proud of you. I don't want to go alone. Please come take care of me.
        - id: ch01-b12
          speaker: jo
          text: You sly little thing. You know how to flatter and coax your cross old sister. Me, distinguished and well behaved? You, afraid to go anywhere alone? I can't decide which idea is more ridiculous. All right, I'll go and do my best. You command the expedition, and I'll obey without question. Will that do?
        - id: ch01-b13
          speaker: amy
          text: You're an angel! Put on all your best things, and I'll explain how to behave at every house. I want people to like you, and they would if you tried to be agreeable. Fix your hair the pretty way and wear the pink rose on your bonnet. Your plain suit makes you look too serious. Take the light gloves and the embroidered handkerchief. We'll stop at Meg's for her white parasol, and you can carry my dove-colored one.
        - id: ch01-b14
          speaker: narrator
          text: Amy dressed and gave orders while Jo obeyed with a protest at every step. Jo sighed as she rustled into her new organdy dress. She frowned fiercely at her own reflection while tying the bonnet strings in a flawless bow. She wrestled angrily with the pins as she fastened her collar, then pulled a face while shaking out the handkerchief. Its embroidery irritated her nose almost as much as the whole errand irritated her feelings. Last came the tight gloves, each with three buttons and a tassel to complete the elegant effect. Once she had forced her hands inside, she turned to Amy wearing the most foolish expression she could manage.
        - id: ch01-b15
          speaker: jo
          text: I am completely miserable. But if you think I look presentable, I can die happy.
        - id: ch01-b16
          speaker: amy
          text: You look very satisfactory. Turn around slowly so I can inspect you.
        - id: ch01-b17
          speaker: narrator
          text: Jo turned. Amy adjusted one thing, then another, and finally stepped back with her head tilted to one side.
        - id: ch01-b18
          speaker: amy
          text: Yes, you'll do. That white bonnet and rose are perfect on you. Put your shoulders back and hold your hands naturally, even if the gloves pinch. And you really do know how to wear a shawl. I never can. Aunt March's shawl is simple but handsome, and the folds over your arm look lovely. Now, is my mantle centered? Did I loop my skirt evenly? I like my boots to show. My feet are pretty, even if my nose isn't.
        - id: ch01-b19
          speaker: jo
          text: You are a thing of beauty and a joy forever. Now tell me, ma'am, must I drag my best dress through the dust, or may I loop it up?
        - id: ch01-b20
          speaker: amy
          text: Hold it up while you walk and let it down indoors. Long, sweeping skirts suit you, but you must learn to carry them gracefully. And one cuff is only half buttoned. Fix it now. You'll never look finished unless you mind the little details. Together, they make the whole effect.
        - id: ch01-b21
          speaker: narrator
          text: Jo sighed and went to fix the cuff. In the process, she managed to burst the buttons right off her tight glove, one final disaster before the expedition began. At last both sisters were ready. With dresses arranged, bonnets tied, shawls folded, and parasols still to be collected, they sailed away in all their finery. Hannah leaned far out of an upstairs window so she could watch them go.
        - id: ch01-b22
          speaker: hannah
          text: Don't they look pretty as pictures!
    - id: ch02
      title: Too Quiet, Then Too Charming
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They stopped at Meg's, borrowed the white parasol, and let her inspect them with a baby on each arm. As they approached the Chesters' house, Amy gave Jo her final instructions.
        - id: ch02-b02
          speaker: amy
          text: The Chesters think of themselves as very elegant, so please use your best manners. No sudden remarks and nothing odd. Just be calm, cool, and quiet. That's safe and ladylike, and you can manage it for fifteen minutes.
        - id: ch02-b03
          speaker: jo
          text: Calm, cool, and quiet. Yes, I can promise that. I've played a proper young lady onstage. Now I'll play one offstage. You have no idea what I can do, so don't worry, my child.
        - id: ch02-b04
          speaker: narrator
          text: Amy relaxed, but mischievous Jo followed those directions exactly. Through the whole first call, every limb stayed gracefully arranged and every fold of her dress lay just right. She was as calm as a summer sea, as cool as a snowbank, and as silent as the sphinx. Mrs. Chester tried to tempt her by mentioning her charming novel. The Chester girls offered one subject after another, including parties, picnics, the opera, and the newest fashions. Jo met them all with a cold little yes or no, a measured smile, or a proper bow. Amy silently begged her to talk. She asked questions meant to draw Jo in and even gave her secret nudges with one foot. Jo appeared sweetly unaware of every signal. Her manners stayed perfectly arranged, like a beautiful face with no expression behind it.
        - id: ch02-b05
          speaker: chester_lady
          text: That oldest Miss March is so proud and dull!
        - id: ch02-b06
          speaker: narrator
          text: The remark reached them just as the door closed. Jo laughed without making a sound all the way through the hall. Amy was disgusted and blamed her sister for ruining the call.
        - id: ch02-b07
          speaker: amy
          text: How could you misunderstand me so completely? I meant dignified and composed, not frozen into stone. At the Lambs', be sociable. Gossip the way other girls do. Show some interest in clothes and flirting and whatever foolish subject comes up. They know the best people, and I want us to make a good impression there.
        - id: ch02-b08
          speaker: jo
          text: I'll be delightful. I'll gossip and giggle and be shocked or thrilled by every little thing you choose. This is becoming fun. Now I'll imitate a charming girl, with May Chester as my model, only better. Just wait until the Lambs say, “What a lively, pleasant girl Jo March is!”
        - id: ch02-b09
          speaker: narrator
          text: Amy had reason to worry. Once Jo became playful, nobody knew where she would stop. Jo swept into the Lambs' drawing room, kissed every young lady with overflowing affection, shone gracious smiles on the young gentlemen, and threw herself into the conversation with astonishing energy. Mrs. Lamb immediately claimed Amy, who was a favorite of hers, and began a long account of Lucretia's latest attack. Three delightful young men hovered nearby. Each waited for a pause when he might rush in and rescue Amy, but the pause never came. She could only watch while Jo gathered a circle of heads around her and talked as rapidly as Mrs. Lamb. Broken scraps of the conversation reached Amy. Each new burst of laughter made her more desperate to hear the rest.
        - id: ch02-b10
          speaker: lamb_guest_one
          text: She's a wonderful rider. Who taught her?
        - id: ch02-b11
          speaker: jo
          text: Nobody. She learned by climbing onto an old saddle in a tree, taking the reins, and practicing how to sit straight. Now she'll ride any horse because she's afraid of nothing. The stableman gives her cheap horses since she trains them to carry ladies. She loves riding so much that I tell her she can earn her living breaking horses if everything else fails.
        - id: ch02-b12
          speaker: narrator
          text: Amy held herself still with great difficulty. Jo's account made her sound like the sort of daring young lady she particularly did not wish to be. She could not escape or correct the impression because Mrs. Lamb was still firmly in the middle of her story. Long before that tale ended, Jo had raced on to another revelation, making still more dreadful mistakes while her listeners encouraged her.
        - id: ch02-b13
          speaker: jo
          text: Amy was desperate that day. All the good horses were gone. Of the three left, one was lame, one was blind, and the last was so stubborn that someone had to put dirt in his mouth before he would move. Perfect for a pleasure ride, don't you think?
        - id: ch02-b14
          speaker: lamb_guest_two
          text: Which one did she take?
        - id: ch02-b15
          speaker: jo
          text: None of them. She heard about a young horse at a farm across the river. No lady had ever ridden him, but he was handsome and spirited, so she decided to try. Then came the trouble. There was nobody to bring the horse to her saddle, so she carried the saddle to the horse. She rowed it across the river, balanced it on her head, and marched up to the barn while the old farmer stared at her.
        - id: ch02-b16
          speaker: lamb_guest_one
          text: But did she actually ride him?
        - id: ch02-b17
          speaker: jo
          text: Of course. She had a splendid ride. I expected her to come home in pieces, but she handled him beautifully and made the whole outing fun.
        - id: ch02-b18
          speaker: young_mr_lamb
          text: Now that's brave!
        - id: ch02-b19
          speaker: narrator
          text: Young Mr. Lamb turned an admiring look toward Amy. At the same time, he wondered what his mother could possibly be saying to make Amy look so red and uncomfortable. A moment later, the conversation swung to clothes, and Amy grew redder still. One young lady asked Jo where she had bought the pretty gray-brown hat she wore at the picnic. Jo could easily have named the shop where it had been purchased two years before. That answer would have ended the matter. Instead, she offered more honesty than the occasion required.
        - id: ch02-b20
          speaker: jo
          text: Amy painted it. Shops don't sell those soft colors, so we paint our hats any shade we like. Having an artistic sister is very useful.
        - id: ch02-b21
          speaker: miss_lamb
          text: What an original idea!
        - id: ch02-b22
          speaker: jo
          text: Oh, that's nothing beside some of her clever tricks. There isn't much Amy can't do. She wanted blue boots for Sallie's party, so she painted her stained white pair the prettiest sky blue you ever saw. They looked exactly like satin.
        - id: ch02-b23
          speaker: narrator
          text: Jo sounded proud of Amy's talent. Amy felt like throwing her card case across the room.
        - id: ch02-b24
          speaker: elder_miss_lamb
          text: We read one of your stories the other day and enjoyed it very much.
        - id: ch02-b25
          speaker: narrator
          text: Compliments about her writing always made Jo stiffen or change the subject too sharply. This time was no exception.
        - id: ch02-b26
          speaker: jo
          text: I'm sorry you couldn't find anything better. I write that trash because it sells and ordinary people enjoy it. Are you going to New York this winter?
        - id: ch02-b27
          speaker: narrator
          text: Since Miss Lamb had just admitted that she enjoyed the story, Jo's answer was neither grateful nor flattering. Jo recognized the mistake the moment the words escaped. But trying to repair one bad remark might only produce another. Then she remembered that she was supposed to be the first visitor to make a move toward leaving. She did it so abruptly that three people were left with unfinished sentences in their mouths.
        - id: ch02-b28
          speaker: jo
          text: Amy, we have to go. Good-bye, dear. Please visit us soon. We're simply dying to see you. I wouldn't dare invite you, Mr. Lamb, but if you happened to come, I don't believe I could bring myself to turn you away.
        - id: ch02-b29
          speaker: narrator
          text: Jo copied May Chester's overflowing manner so perfectly that Amy rushed out, caught between laughter and tears.
        - id: ch02-b30
          speaker: jo
          text: Didn't I do that well?
        - id: ch02-b31
          speaker: amy
          text: You couldn't have done worse. Why did you tell them about my saddle and the painted hats and boots and all the rest?
        - id: ch02-b32
          speaker: jo
          text: Because those stories are funny. People enjoy them. Everyone knows we're poor. Why pretend we keep grooms, buy four hats a season, and live as grandly as they do?
        - id: ch02-b33
          speaker: amy
          text: Knowing we're poor doesn't mean they need to hear every little trick we use to manage. You exposed us for no reason. You have no proper pride, and you'll never learn when to speak and when to keep quiet.
        - id: ch02-b34
          speaker: narrator
          text: Amy's despair finally reached her. Poor Jo looked ashamed and had no quick joke ready. She walked in silence, rubbing the end of her nose with the stiff embroidered handkerchief. Its scratchy edge made a fitting little punishment for all the social mistakes she had just committed.
    - id: ch03
      title: The Comfortable Call
      blocks:
        - id: ch03-b01
          speaker: jo
          text: How am I supposed to behave at this house?
        - id: ch03-b02
          speaker: amy
          text: However you please. I'm through trying to manage you.
        - id: ch03-b03
          speaker: jo
          text: Then I'll enjoy myself. The boys are home, so at least we can be comfortable. I need a change. Elegance is terrible for my health.
        - id: ch03-b04
          speaker: narrator
          text: Jo spoke roughly because she was bothered by her failure to please Amy. But three big boys and several pretty children greeted her with such enthusiasm that her hurt feelings soon disappeared. Amy remained with their mother and Mr. Tudor, who happened to be making a call too. Jo happily devoted herself to the younger people. She listened to every college story with real interest, petted pointers and poodles without one complaint, and heartily agreed when someone declared that Tom Brown was a brick, no matter how improper the phrase sounded. When one boy proposed an expedition to his turtle tank, Jo sprang up at once. Their mother watched with a smile while setting her cap straight. Her sons' hugs had left it in ruins, but those great, bear-like signs of affection mattered more to her than the most perfect arrangement a French hairdresser could create.
        - id: ch03-b05
          speaker: narrator
          text: Amy left Jo to herself and enjoyed her own conversation completely. Mr. Tudor's uncle had married an Englishwoman who was third cousin to a living lord. That distant connection impressed Amy deeply. In spite of her American birth and upbringing, she had the old respect for titles that lingers in many people. It was the same feeling that could throw the young republic into excitement over a visiting royal boy. America still loved old England rather like a big grown son who remembers the strict little mother who held him as long as she could, then scolded him farewell when he broke free. Yet even the pleasure of talking with someone connected to British nobility did not make Amy forget the clock. When the proper number of minutes had passed, she reluctantly pulled herself away and looked for Jo, hoping her impossible sister had not brought disgrace on the March name.
        - id: ch03-b06
          speaker: narrator
          text: The sight might have been worse, but Amy still considered it very bad. Jo sat on the grass with a whole camp of boys around her, telling one of Laurie's pranks to an admiring audience. A dog with dirty paws rested comfortably across the skirt of her grand visiting dress. One small child poked the turtles with Amy's precious parasol. A second ate gingerbread directly over Jo's best bonnet, while a third used her gloves for a ball. Every member of the group was enjoying the scene. When it was time to leave, Jo collected the property that could still be collected. Her young escort followed after her, begging for another visit.
        - id: ch03-b07
          speakers: [boy_one, boy_two, boy_three]
          ensemble: chorus
          text: Please come again! Laurie's adventures are such fun!
          emotion: happy
        - id: ch03-b08
          speaker: jo
          text: Aren't they splendid boys? I feel young and lively again.
        - id: ch03-b09
          speaker: narrator
          text: As they walked on, Jo kept her hands behind her back. It looked natural, and it also hid the mud-spattered parasol. Amy wisely said nothing about Jo's ruined appearance.
        - id: ch03-b10
          speaker: amy
          text: Why do you always stay away from Mr. Tudor?
        - id: ch03-b11
          speaker: jo
          text: I don't like him. He acts important, treats his sisters badly, bothers his father, and speaks disrespectfully about his mother. Laurie says he lives too fast. I don't want him for a friend, so I leave him alone.
        - id: ch03-b12
          speaker: amy
          text: You could at least be polite. You barely nodded to him, but just now you gave Tommy Chamberlain your nicest smile and bow, even though his father owns a grocery store. You should have given Tudor the bow and Tommy the nod.
        - id: ch03-b13
          speaker: jo
          text: No, I shouldn't. I don't like, respect, or admire Tudor, even if some distant relative of his was third cousin to a lord. Tommy is poor and shy, but he's good and very clever. I respect him, and I want him to know it. Brown paper packages don't keep him from being a gentleman.
        - id: ch03-b14
          speaker: amy
          text: There is no point in arguing with you.
        - id: ch03-b15
          speaker: jo
          text: None at all, dear. Let's put on pleasant faces and leave a card here. The Kings are clearly out, and I am deeply thankful.
        - id: ch03-b16
          speaker: narrator
          text: The family card case performed its duty, and the girls continued. At the fifth house, the young ladies were busy. Jo gave thanks again.
        - id: ch03-b17
          speaker: jo
          text: Now can we go home and skip Aunt March? We can visit her anytime. We're tired and cross, and dragging our best clothes through all this dust seems a terrible waste.
        - id: ch03-b18
          speaker: amy
          text: You may be cross, but don't speak for me. Aunt March enjoys the compliment when we dress well and make a formal call. It takes little effort and gives her pleasure. Besides, I doubt the visit will hurt your clothes as much as muddy dogs and clumsy boys already have. Bend down so I can brush the crumbs off your bonnet.
        - id: ch03-b19
          speaker: jo
          text: You really are good, Amy. Look at you, still neat and spotless, while I'm a wreck. I wish small kindnesses came as easily to me as they do to you. I think of them, but they take so much time that I wait for a chance to do something grand. Then I miss all the little things, though I suppose those matter most in the end.
        - id: ch03-b20
          speaker: narrator
          text: Amy smiled, and her anger vanished. She answered with the air of a mother giving advice.
        - id: ch03-b21
          speaker: amy
          text: Women should learn to be pleasant, especially poor women. It's the only way we can repay many of the kindnesses people show us. If you remembered that and practiced, people would like you even better than me. There's more in you to like.
        - id: ch03-b22
          speaker: jo
          text: I'm a difficult old creature, and I always will be. But you're right. The trouble is, risking my life for someone feels easier than being pleasant when I don't feel pleasant. Strong likes and dislikes are a great misfortune, aren't they?
        - id: ch03-b23
          speaker: amy
          text: Being unable to hide them is worse. I don't approve of Tudor either, but nobody asked me to tell him that. Nobody asked you, either. Making yourself unpleasant won't improve him.
        - id: ch03-b24
          speaker: jo
          text: But girls should show young men when they disapprove of their behavior. What can we use except our own manners? Lecturing doesn't help. I learned that while trying to manage Teddy. But I can influence him in many small ways without saying a word. We ought to do the same with other young men when we can.
        - id: ch03-b25
          speaker: amy
          text: Teddy is an extraordinary boy. You can't use him as an example for everyone else. If we were popular young ladies, or women with money and position, perhaps we could influence people. But if girls like us frown at one group of young men and smile at another, it won't change anything. People will only call us strange and self-righteous.
        - id: ch03-b26
          speaker: jo
          text: So because we aren't rich or fashionable, we must smile on people and behavior we dislike? That's a fine kind of morality.
        - id: ch03-b27
          speaker: amy
          text: I can't debate it. I only know how the world works. People who fight against it get laughed at for their trouble. I don't care for reformers, and I hope you never become one.
        - id: ch03-b28
          speaker: jo
          text: I do care for reformers, and I'll become one if I can. People may laugh, but the world would never move forward without them. You and I won't agree. You belong to the old way, and I belong to the new one. You'll have an easier time, but mine will be more exciting. I believe I'd rather enjoy the jeers and stones.
        - id: ch03-b29
          speaker: amy
          text: Well, settle down now. Don't upset Aunt March with all your new ideas.
        - id: ch03-b30
          speaker: jo
          text: I'll try. But whenever I'm with her, some blunt remark or revolutionary idea is certain to burst out of me. It's my fate. I can't seem to stop it.
    - id: ch04
      title: Shadow and Sunshine
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At Aunt March's house, they found Aunt Carrol with the old lady. The two women were absorbed in a subject that plainly interested them, but dropped it the moment the girls entered. Their self-conscious expressions betrayed that the nieces themselves had been under discussion. Jo was not in a good humor, and the stubborn mood she had shaken off earlier came back. Amy, meanwhile, had done her duty, kept her temper through every trial, and pleased everyone she met. She arrived feeling positively angelic. Both aunts noticed that pleasant spirit at once. They greeted Amy with one affectionate “my dear” after another, and their looks said what they later stated aloud.
        - id: ch04-b02
          speakers: [aunt_march, aunt_carrol]
          ensemble: duo
          text: That child improves every day.
        - id: ch04-b03
          speaker: aunt_carrol
          text: Are you going to help with the fair, dear?
        - id: ch04-b04
          speaker: narrator
          text: Amy sat beside Aunt Carrol with the warm, trusting manner that older people enjoy in the young.
        - id: ch04-b05
          speaker: amy
          text: Yes, Aunt. Mrs. Chester asked me, and I offered to manage a table. My time is the only thing I can give.
        - id: ch04-b06
          speaker: jo
          text: I won't help. I hate being patronized. The Chesters act as if letting us work at their grand fair is a tremendous favor. I can't imagine why you agreed, Amy. They only want your labor.
        - id: ch04-b07
          speaker: amy
          text: I don't mind working. The fair will help the freedmen, not only the Chesters. I think it was kind to let me share both the work and the fun. If patronage is kindly meant, it doesn't bother me.
        - id: ch04-b08
          speaker: aunt_march
          text: Quite right. I admire your grateful spirit, my dear. Helping people is a pleasure when they appreciate what is done for them. Some people do not, and that can be very trying.
        - id: ch04-b09
          speaker: narrator
          text: Aunt March peered over her glasses at Jo, who sat apart in a rocking chair looking gloomy. If Jo had known that years of happiness were being weighed between those two women, she would have turned gentle in an instant. But we have no windows in our chests. We cannot see what friends are thinking. Usually that is for the best, but now and then such a window would save a great deal of time and temper. Jo's very next words cost her those years of pleasure and taught her a timely lesson about holding her tongue.
        - id: ch04-b10
          speaker: jo
          text: I don't like favors. They weigh on me and make me feel owned. I'd rather do everything myself and be completely independent.
        - id: ch04-b11
          speaker: aunt_carrol
          text: Ahem.
        - id: ch04-b12
          speaker: narrator
          text: Aunt Carrol coughed softly and glanced at Aunt March.
        - id: ch04-b13
          speaker: aunt_march
          text: You see? I told you.
        - id: ch04-b14
          speaker: narrator
          text: Jo had no idea what she had done. She sat with her nose in the air, looking every inch a young revolutionary and not at all inviting.
        - id: ch04-b15
          speaker: aunt_carrol
          text: Do you speak French, dear?
        - id: ch04-b16
          speaker: narrator
          text: Aunt Carrol rested a hand on Amy's.
        - id: ch04-b17
          speaker: amy
          text: Fairly well. Aunt March lets me practice with Esther whenever I like, and I'm very grateful for it.
        - id: ch04-b18
          speaker: narrator
          text: Amy gave the old lady a thankful look, and Aunt March smiled pleasantly.
        - id: ch04-b19
          speaker: aunt_carrol
          text: And what about you, Jo? Have you learned any languages?
        - id: ch04-b20
          speaker: jo
          text: Not a word. I'm hopeless at studying anything. And I can't stand French. It sounds so slippery and foolish.
        - id: ch04-b21
          speaker: narrator
          text: The aunts exchanged another look. Then Aunt March turned back to Amy.
        - id: ch04-b22
          speaker: aunt_march
          text: You're strong and healthy now, aren't you, dear? Your eyes don't trouble you anymore?
        - id: ch04-b23
          speaker: amy
          text: Not at all, thank you. I feel very well. Next winter I mean to work hard and be ready for Rome whenever that wonderful chance comes.
        - id: ch04-b24
          speaker: aunt_march
          text: Good girl! You deserve to go, and I feel sure you will someday.
        - id: ch04-b25
          speaker: narrator
          text: Aunt March patted Amy approvingly as Amy picked up her ball of yarn. Then Polly bent down from the back of the chair and peered into Jo's face with such an impudent, questioning look that nobody could help laughing.
        - id: ch04-b26
          speaker: polly
          text: Crosspatch, draw the latch, sit by the fire and spin!
        - id: ch04-b27
          speaker: aunt_march
          text: That bird notices everything.
        - id: ch04-b28
          speaker: polly
          text: Come take a walk, my dear!
        - id: ch04-b29
          speaker: narrator
          text: Polly hopped toward the china closet, plainly hoping for a lump of sugar.
        - id: ch04-b30
          speaker: jo
          text: Thank you, I will. Come on, Amy.
        - id: ch04-b31
          speaker: narrator
          text: Jo ended the visit more certain than ever that formal calls were bad for her health. She shook hands like a gentleman. Amy kissed both aunts. The girls left behind them an impression of shadow and sunshine. As soon as they disappeared, Aunt March spoke.
        - id: ch04-b32
          speaker: aunt_march
          text: You had better do it, Mary. I'll provide the money.
        - id: ch04-b33
          speaker: aunt_carrol
          text: I certainly will, if her father and mother agree.
