audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机智，像在炉边从容讲述旧日家事
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情绪来得快，带一点男孩子气
        timbre: 明亮略带沙哑
        pace: 偏快
        pitch: 中低
    meg:
      display_name: 梅格
      tts:
        delivery: 温柔端庄，常带大姐姐式的认真
        timbre: 柔和圆润
        pace: 适中
        pitch: 中
    beth:
      display_name: 贝丝
      tts:
        delivery: 羞怯安静，话语真诚而体贴
        timbre: 轻柔温暖
        pace: 稍慢
        pitch: 中高
    amy:
      display_name: 艾米
      tts:
        delivery: 一本正经又有些自负，努力显得优雅
        timbre: 清脆稚嫩
        pace: 适中
        pitch: 偏高
    mrs_march:
      display_name: 马奇太太
      tts:
        delivery: 慈爱爽朗，沉稳中带着鼓励
        timbre: 饱满温暖
        pace: 从容
        pitch: 中低
    father:
      display_name: 爸爸
      tts:
        delivery: 诚挚克制，充满思念与父亲的期许
        timbre: 深厚柔和
        pace: 沉稳
        pitch: 低
  chapters:
    - id: ch01
      title: 没有礼物的圣诞节
      blocks:
        - id: ch01-b01
          speaker: jo
          text: “连一件礼物都没有，这还叫什么圣诞节。”
        - id: ch01-b02
          speaker: narrator
          text: 乔趴在地毯上，越想越不痛快。
        - id: ch01-b03
          speaker: meg
          text: “穷日子真是难熬。”
        - id: ch01-b04
          speaker: narrator
          text: 梅格低头瞧着身上的旧裙子，轻轻叹气。
        - id: ch01-b05
          speaker: amy
          text: “有的姑娘什么漂亮东西都有，有的却什么也没有。这怎么公平呢？”
        - id: ch01-b06
          speaker: narrator
          text: 小艾米觉得自己受了天大的委屈，吸了吸鼻子。
        - id: ch01-b07
          speaker: beth
          text: “我们有爸爸妈妈，还有姐妹几个呀。”
        - id: ch01-b08
          speaker: narrator
          text: 贝丝安安静静地坐在自己的角落。她这一句宽心的话，让火光里的四张年轻面孔都亮了。可乔想起另一件事，神色又低落下来。
        - id: ch01-b09
          speaker: jo
          text: “可爸爸不在家，而且很久很久都回不来。”
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: 乔没把“也许再也回不来”说出口。可父亲远在战场，每个人心里都悄悄接上了这句话。四张脸重新暗下来，屋里也静了。过了一会儿，梅格才收起先前抱怨的口气。
        - id: ch01-b11
          speaker: meg
          text: “妈妈提议今年不送礼物，是因为这个冬天大家都不好过。军队里的男人正在受苦，我们不该只顾自己花钱取乐。虽然帮不了多少，至少可以放弃一点想要的东西，而且该心甘情愿才对。只是……我恐怕还做不到。”
        - id: ch01-b12
          speaker: narrator
          text: 她一想到自己盼望的那些漂亮东西，便觉得实在舍不得，遗憾地摇了摇头。
        - id: ch01-b13
          speaker: jo
          text: “可我们一共也没几个钱，送去又有什么用？每人不过一美元，就算全给军队，也帮不上多少。我可以不等妈妈和你们送礼物，但我真想给自己买《翁迪娜与辛特拉姆》。我盼这本书好久了。”
        - id: ch01-b14
          speaker: narrator
          text: 乔是个十足的小书虫。
        - id: ch01-b15
          speaker: beth
          text: “我本来想买几张新乐谱。”
        - id: ch01-b16
          speaker: narrator
          text: 贝丝只是轻轻叹了一口气。姐妹们谁也没听见，只有炉边的壁炉刷和隔热垫听到了。
        - id: ch01-b17
          speaker: amy
          text: “我要买一盒最好的辉柏嘉绘图铅笔。我是真的需要。”
        - id: ch01-b18
          speaker: jo
          text: “妈妈没说不许花我们自己的钱，也不会叫我们什么都不要。大家就买自己想要的，痛快一下吧。我们天天干活，早就该得一点乐子了。”
        - id: ch01-b19
          speaker: narrator
          text: 她一边说，一边像个男人那样扳着鞋跟研究。
        - id: ch01-b20
          speaker: meg
          text: “我干活还不辛苦吗？差不多整天都在教那些讨厌的孩子，可我只想留在家里，好好玩一玩。”
        - id: ch01-b21
          speaker: jo
          text: “你的苦还不到我的一半呢。你来陪那个神经紧张、挑三拣四的老太太试试。她把你支使得团团转，永远不满意，能逼得人想跳窗户，不然就大哭一场。”
        - id: ch01-b22
          speaker: beth
          text: “为干活发牢骚不对，可洗盘子、收拾屋子，真是全世界最糟的差事。它弄得我爱生气，双手也僵了，连琴都练不好。”
        - id: ch01-b23
          speaker: narrator
          text: 贝丝望着自己粗糙的手。这回她的叹气声，大家都听见了。
        - id: ch01-b24
          speaker: amy
          text: “你们谁也没我苦！那些没礼貌的女生，见我不会功课就欺负我，见我衣服不好就嘲笑我。爸爸不富有，她们还给他贴标签。连我的鼻子不好看，她们都要羞辱我。”
        - id: ch01-b25
          speaker: jo
          text: “你想说的是‘诽谤’，那就老老实实说‘诽谤’，别讲什么‘贴标签’，好像爸爸是一只等着贴标签的腌黄瓜瓶子。”
        - id: ch01-b26
          speaker: narrator
          text: 乔忍不住笑了。
        - id: ch01-b27
          speaker: amy
          text: “我知道自己是什么意思。你不用这样讽刺挖人。多说高雅的词，才能提高词汇水瓶。”
        - id: ch01-b28
          speaker: narrator
          text: 艾米答得尊严十足。
        - id: ch01-b29
          speaker: meg
          text: “别再互相啄了。乔，要是爸爸没丢掉我们小时候那笔钱，该多好啊。没有烦恼，我们准会又幸福又善良。”
        - id: ch01-b30
          speaker: narrator
          text: 梅格还记得从前富裕的日子。
        - id: ch01-b31
          speaker: beth
          text: “可你前几天才说，我们比金家的孩子幸福。就算他们有钱，也总是争吵闹脾气。”
        - id: ch01-b32
          speaker: meg
          text: “没错，我想我们确实更幸福。虽然得干活，可我们会拿自己取乐。借乔的话说，咱们一家挺快活。”
        - id: ch01-b33
          speaker: amy
          text: “乔就是爱说这种不文雅的话。”
        - id: ch01-b34
          speaker: narrator
          text: 艾米责备地看着摊在地毯上的乔。乔马上坐起来，把手插进口袋，吹起口哨。
        - id: ch01-b35
          speaker: amy
          text: “别吹了，乔。太像男孩子啦！”
        - id: ch01-b36
          speaker: jo
          text: “我就是要像男孩子才吹的。”
        - id: ch01-b37
          speaker: amy
          text: “我最讨厌粗鲁、没有淑女样的女孩！”
        - id: ch01-b38
          speaker: jo
          text: “我最讨厌装腔作势、娇里娇气的小丫头！”
        - id: ch01-b39
          speaker: beth
          text: “小鸟同巢，和气才好。”
        - id: ch01-b40
          speaker: narrator
          text: 贝丝唱着歌，还做了个怪相。两个尖嗓门立刻变成笑声，这场“互啄”总算停了。
    - id: ch02
      title: 四姐妹与一双旧拖鞋
      blocks:
        - id: ch02-b01
          speaker: meg
          text: “说真的，你们两个都有错。约瑟芬，你已经长大了，该改掉那些男孩子气的动作，表现得规矩一点。小时候这样还不要紧，可现在你长得这么高，头发也盘起来了，就该记住自己已经是位年轻小姐。”
        - id: ch02-b02
          speaker: jo
          text: “我才不是！要是盘头发就叫年轻小姐，我到二十岁还梳两条辫子。我讨厌长大，讨厌当马奇小姐，穿拖地长裙，摆出翠菊花一样规规矩矩的样子。我喜欢男孩子的游戏、活计和做派，却偏偏是个女孩，这已经够让我失望了，我怎么都想不开。现在更糟，我真想去跟爸爸并肩打仗，却只能留在家里织东西，活像个迟钝的老太婆！”
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: 乔扯掉发网，栗色长发像马鬃一样散开。她又抖起那只蓝色军袜，织针咔嗒乱响，毛线球也蹦过了房间。
        - id: ch02-b04
          speaker: beth
          text: “可怜的乔。这确实不公平，但也改变不了。你就用这个男孩子气的名字，给我们几个当兄弟吧。”
        - id: ch02-b05
          speaker: narrator
          text: 贝丝抚摸乔乱蓬蓬的脑袋。洗再多盘子、掸再多灰尘，也磨不掉她手上的温柔。
        - id: ch02-b06
          speaker: meg
          text: “还有你，艾米。你太讲究，也太拘谨。现在摆架子还算好笑，再不留心，长大就成了一只装模作样的小呆鹅。你不故意显得高雅时，举止和说话都很好。可那些荒唐的词，跟乔的俚语一样糟。”
        - id: ch02-b07
          speaker: beth
          text: “乔是假小子，艾米是呆鹅，那我是什么呢？”
        - id: ch02-b08
          speaker: meg
          text: “你是个宝贝，就只是个宝贝。”
          emotion: happy
        - id: ch02-b09
          speaker: narrator
          text: 谁也不反对，因为“小老鼠”贝丝是全家的心头肉。年轻读者总想知道故事里的人长什么样，那就趁现在看看四姐妹吧。十二月的雪在窗外静静飘，屋里的炉火快乐地噼啪响，她们就在暮色里不停地织东西。地毯虽然褪色，家具也很朴素，屋子却舒服极了。墙上挂着一两幅好画，壁龛里装满书，窗前开着菊花和圣诞玫瑰。那种家中才有的安宁气息，充满了整个房间。
        - id: ch02-b10
          speaker: narrator
          text: 大姐玛格丽特十六岁，丰满白皙，生得很美。她有一双大眼睛，柔软的棕发又多又密，嘴形甜美，还有一双叫她很得意的白手。十五岁的乔又高又瘦，皮肤黝黑，像一匹不知该怎么安放长腿的小马驹。她的嘴角很坚决，鼻子有点滑稽，灰眼睛锐利得什么都逃不过。那双眼有时凶，有时淘气，有时又在沉思。她唯一公认的美处是那头浓密长发，却常被胡乱塞进发网，只求不碍事。她肩膀微驼，手脚都大，衣服穿在身上总有点飞扬凌乱。她正飞快地长成一个女人，自己却一点也不情愿，所以浑身都透着不自在。
        - id: ch02-b11
          speaker: narrator
          text: 十三岁的伊丽莎白，人人都叫她贝丝。她面颊红润，头发柔顺，眼睛明亮。她举止羞怯，声音轻轻的，脸上总是一片安宁，很少有什么事能惊扰她。爸爸叫她“恬静小小姐”。这个名字再合适不过，因为她像是住在自己的快乐小世界里，只肯出来见少数几个信任又深爱的人。艾米年纪最小，可在她自己看来，重要得不得了。她有蓝眼睛，淡黄色鬈发垂在肩头，面色白，身材纤细，像个雪姑娘。她时时都挺直身子，记着自己该像位有教养的年轻小姐。她们各自究竟是什么性情，往后自然会知道。
        - id: ch02-b12
          speaker: narrator
          text: 钟敲了六下。贝丝扫净炉边，把一双拖鞋放到火旁烘暖。那双旧鞋不知怎么触动了姑娘们。妈妈快回来了，人人都高兴起来，等着迎接她。梅格不再训话，起身点灯。艾米不用人提醒就让出了安乐椅。乔也忘了自己有多累，坐起来把拖鞋举得离火焰更近。
        - id: ch02-b13
          speaker: jo
          text: “鞋都磨破了，妈妈该有一双新的。”
        - id: ch02-b14
          speaker: beth
          text: “我本来就想用那一美元给她买鞋。”
        - id: ch02-b15
          speaker: amy
          text: “不，该我买！”
        - id: ch02-b16
          speaker: meg
          text: “我是大姐，所以……”
        - id: ch02-b17
          speaker: jo
          text: “爸爸不在，我就是家里的男人，鞋该由我来买。他临走还特别叫我照顾好妈妈。”
        - id: ch02-b18
          speaker: beth
          text: “我有个办法。这个圣诞节，我们每人都送妈妈一样礼物，自己一样也不买。”
        - id: ch02-b19
          speaker: jo
          text: “真像你想出来的好主意！那该买些什么？”
        - id: ch02-b20
          speaker: narrator
          text: 大家认真想了一会儿。梅格看着自己的漂亮双手，先有了答案。
        - id: ch02-b21
          speaker: meg
          text: “我送一双精美的手套。”
        - id: ch02-b22
          speaker: jo
          text: “我送军用鞋，要最好的！”
        - id: ch02-b23
          speaker: beth
          text: “我送几条手帕，把边都缝好。”
        - id: ch02-b24
          speaker: amy
          text: “我送一小瓶古龙水。妈妈喜欢，又不太贵，我还能剩点钱买铅笔。”
        - id: ch02-b25
          speaker: meg
          text: “礼物要怎么送呢？”
        - id: ch02-b26
          speaker: jo
          text: “摆到桌上，再领妈妈进来，看她一个个拆包裹。我们过生日时不就是这样吗？”
        - id: ch02-b27
          speaker: beth
          text: “以前轮到我戴着皇冠坐在椅子上，你们绕着我送礼物，再亲我一下，我总怕得要命。我喜欢礼物，也喜欢亲吻，可你们都盯着我拆包裹，实在太难受啦。”
        - id: ch02-b28
          speaker: narrator
          text: 她说这些时，一边烤着茶点要吃的面包，也一边烤着自己的脸。回想起来，礼物和亲吻都很美好，只有被全家盯着拆包裹这件事，仍旧让她害怕。
        - id: ch02-b29
          speaker: jo
          text: “先让妈妈以为我们在给自己买东西，再突然送给她。梅格，明天下午我们得去采购。圣诞夜那出戏还有好多事呢。”
        - id: ch02-b30
          speaker: narrator
          text: 乔背着手，仰起鼻子，在屋里来回踱步。
    - id: ch03
      title: 炉边的舞台
      blocks:
        - id: ch03-b01
          speaker: meg
          text: “这次以后，我不想再演了。我已经不适合玩这种小孩子的游戏。”
        - id: ch03-b02
          speaker: narrator
          text: 可一说到化装演戏，梅格分明还是个孩子。
        - id: ch03-b03
          speaker: jo
          text: “只要还能穿白长裙、披着头发，再戴上金纸首饰，你就舍不得不演。你是我们最好的演员，少了你，整出戏都完了。今晚得排练。艾米，来演昏倒那一场，你现在僵得像根拨火棍。”
        - id: ch03-b04
          speaker: amy
          text: “我也没办法，因为我从没见过别人怎么昏倒。你总是直挺挺摔下去，弄得浑身青一块紫一块，我可不愿意。要是能轻轻巧巧倒下，我就倒。要是不行，我就优雅地跌进椅子里。哪怕雨果举着手枪冲我过来，我也不会改变主意。”
        - id: ch03-b05
          speaker: narrator
          text: 艾米没有多少表演天分。大家选她演这个角色，只因为她个子够小，戏里的坏蛋可以把她扛出去，而她一路上还得不停尖叫。
        - id: ch03-b06
          speaker: jo
          text: “该这样演。双手握住，踉踉跄跄地走过去，再拼命喊，‘罗德里戈！快救我！救救我！’”
        - id: ch03-b07
          speaker: narrator
          text: 乔亲自示范。她踉跄着冲过房间，那声戏剧腔十足的尖叫真能叫人心惊。艾米也试了一遍，可她双手硬邦邦伸在前面，身子一顿一顿，像一架机器。她喊的那声“哎哟”，听不出恐惧和痛苦，倒像有人拿针扎了她。乔绝望地呻吟，梅格放声大笑，贝丝看得入迷，连面包焦了也没发觉。
        - id: ch03-b08
          speaker: jo
          text: “没办法了！到时候尽力吧，观众笑了可别怪我。梅格，轮到你。”
        - id: ch03-b09
          speaker: narrator
          text: 之后的排练顺利多了。唐·佩德罗一口气念完足足两页豪言壮语，向全世界挑战，一次也没停。女巫夏甲守着一锅慢慢煨煮的癞蛤蟆，唱出可怕的咒语，听起来阴森极了。罗德里戈像个真正的英雄，威武地挣断锁链。雨果受到悔恨和砒霜的双重折磨，在剧痛中狂叫一声“哈！哈！”这才倒地死去。
        - id: ch03-b10
          speaker: meg
          text: “这是我们排得最好的一次。”
        - id: ch03-b11
          speaker: narrator
          text: 那位死去的坏蛋坐起来，揉着两只手肘。
        - id: ch03-b12
          speaker: beth
          text: “乔，你怎么能写出这么精彩的戏，还能演得这样好？你就是个莎士比亚！”
          emotion: surprised
        - id: ch03-b13
          speaker: narrator
          text: 贝丝深信，姐姐们无论做什么都才华非凡。
        - id: ch03-b14
          speaker: jo
          text: “倒没那么厉害。不过《女巫的诅咒：一出歌剧式悲剧》确实挺不错。要是有个活板门能让班柯掉下去，我还想演《麦克白》。我一直想演杀人的那段。‘我眼前看见的，可是一把匕首？’”
        - id: ch03-b15
          speaker: narrator
          text: 乔转着眼睛，伸手抓向空中，学起那位著名悲剧演员。
        - id: ch03-b16
          speaker: meg
          text: “不，那是烤面包叉。只不过叉上挂的是妈妈的鞋，不是面包。贝丝看戏看疯啦！”
        - id: ch03-b17
          speaker: narrator
          text: 乔抓住的当然不是什么匕首，而是烤面包叉。贝丝看戏看得太入迷，竟把妈妈的鞋挂在叉上，忘了原本该烤的面包。所有人都笑了起来，排练就这样收场。门边忽然传来一个爽朗的声音。
        - id: ch03-b18
          speaker: mrs_march
          text: “姑娘们，看见你们这么快活，我真高兴。”
        - id: ch03-b19
          speaker: narrator
          text: 演员和观众一起转过身迎接她。站在门边的女士身材高挑，神情慈爱，脸上仿佛总在问，有什么能帮上忙，看着就叫人喜欢。她衣着并不华贵，却自有一种高贵气度。在姑娘们眼里，那件灰斗篷和不时髦的女帽里，裹着全世界最了不起的母亲。
        - id: ch03-b20
          speaker: mrs_march
          text: “亲爱的，今天过得好吗？明天要送走的箱子还没收拾完，我忙得连午饭也没回家吃。贝丝，今天有人来吗？梅格，感冒好些没有？乔，你看起来累坏了。小宝贝，快来亲亲我。”
        - id: ch03-b21
          speaker: narrator
          text: 马奇太太一面问，一面脱掉淋湿的衣服，穿上暖拖鞋。她坐进安乐椅，把艾米搂在膝上，准备享受忙碌一天里最幸福的一小时。姑娘们也按各自的方式忙起来，只想让妈妈舒服。梅格摆好茶桌。乔添木柴、搬椅子，手碰到什么，什么就掉落、翻倒，叮叮当当响成一片。贝丝安静又勤快，在客厅和厨房之间来回小跑。艾米双手交叠坐着，对每个人发号施令。
        - id: ch03-b22
          speaker: mrs_march
          text: “晚饭以后，有一样好东西给你们。”
        - id: ch03-b23
          speaker: narrator
          text: 一抹明亮的笑容像一道阳光，立刻从每张脸上掠过。贝丝顾不上手里还拿着饼干，马上拍起手来。乔把餐巾高高抛向空中。
        - id: ch03-b24
          speaker: jo
          text: “是信！一定是信！为爸爸欢呼三声！”
        - id: ch03-b25
          speaker: mrs_march
          text: “对，是一封长长的好信。他身体很好，觉得这个寒冬不会像我们担心的那么难熬。他送来许多圣诞祝福，还有几句话，特意说给你们听。”
        - id: ch03-b26
          speaker: narrator
          text: 马奇太太轻轻拍着衣袋，那里像是藏着宝贝。
        - id: ch03-b27
          speaker: jo
          text: “大家快点吃！艾米，别翘着小指头，对着盘子装笑啦。”
        - id: ch03-b28
          speaker: narrator
          text: 乔急着听信，一口茶把自己呛住，面包也掉了，偏偏是抹着黄油的一面落在地毯上。贝丝连一口也吃不下了。她悄悄回到自己那个昏暗的角落，在那里想着马上就能听到爸爸的消息，等其他人吃完。
    - id: ch04
      title: 爸爸的来信
      blocks:
        - id: ch04-b01
          speaker: meg
          text: “爸爸年纪已经不用应征，身体也不能当兵，可他还是去做了随军牧师。这样真了不起。”
        - id: ch04-b02
          speaker: jo
          text: “我真希望自己能去当鼓手，或者那个随军女兵，叫什么来着？当护士也行。只要能陪在爸爸身边，帮他的忙就好。”
        - id: ch04-b03
          speaker: amy
          text: “睡在帐篷里，吃各种难吃的东西，还用锡杯喝水，一定很不好受。”
        - id: ch04-b04
          speaker: beth
          text: “妈妈，他什么时候回来？”
          emotion: sad
        - id: ch04-b05
          speaker: mrs_march
          text: “还要好几个月，亲爱的，除非他病了。他能工作多久，就会尽心工作多久。只要那里还需要他，我们不会要求他早回来一分钟。现在都来听信吧。”
          emotion: calm
        - id: ch04-b06
          speaker: narrator
          text: 大家围到炉边。妈妈坐进大椅子，贝丝靠在她脚旁，梅格和艾米各坐一边扶手。乔倚着椅背，这样信要是感人，就没人看得到她流露情绪。那段艰难岁月里，家书很少有不叫人动容的，父亲寄来的信更是如此。爸爸几乎没写自己忍受过的艰苦、面对过的危险，也没写怎样压下思乡。他只用开朗又充满希望的语气，生动讲起军营生活、行军和战事。到了最后，对家中小女儿们的爱和思念才从笔端涌出来。
        - id: ch04-b07
          speaker: father
          text: “请把我全部的爱和每人一个吻都带给她们。告诉孩子们，我白天想她们，夜里为她们祈祷。不论什么时候，她们的爱都是我最大的安慰。一年以后才能相见，想起来真久。不过等待的时候，大家都可以努力，不让这些艰难的日子白白过去。我相信，她们会记住我说过的一切，会做爱你的好孩子，忠实地尽本分，勇敢地对付心里的敌人，也能好好战胜自己。等我回到她们身边，一定会比以前更疼爱我的小妇人们，也更为她们骄傲。”
        - id: ch04-b08
          speaker: narrator
          text: 听到这里，每个人都抽起鼻子。乔鼻尖挂下一大滴眼泪，也不觉得难为情。艾米顾不上弄乱鬈发，把脸埋到妈妈肩上哭了。
        - id: ch04-b09
          speaker: amy
          text: “我是个自私的女孩！可我真的会努力变好，不让爸爸以后失望。”
          emotion: sad
        - id: ch04-b10
          speaker: meg
          text: “我们都会努力！我太在意长相，又不喜欢干活。只要做得到，我以后不再这样。”
        - id: ch04-b11
          speaker: jo
          text: “我要努力成为爸爸说的‘小妇人’。我不再粗野任性，要留在这里尽本分，不再一心想着别的地方。”
        - id: ch04-b12
          speaker: narrator
          text: 乔心里明白，在家管好自己的脾气，比到南方对付一两个叛军难多了。贝丝一句话也没有说。她拿那只蓝色军袜擦掉眼泪，立刻使出全身力气织起来，一点时间也不肯浪费。她先去做好眼前该做的事，同时在安静的小小心灵里发誓。一年后，爸爸终于高高兴兴回到家时，她一定要成为他盼望见到的模样。
    - id: ch05
      title: 小朝圣者重新上路
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 乔说完以后，屋里安静了一会儿。马奇太太没有让这份沉默继续下去，她又用那爽朗快活的声音开了口。
        - id: ch05-b02
          speaker: mrs_march
          text: “还记得小时候怎么玩《天路历程》吗？那时没有什么比这个更让你们高兴。我把装碎布的袋子绑在你们背上当重担，再发给你们帽子、手杖和一卷纸。你们从‘毁灭城’，也就是地窖出发，穿过整栋房子，一层一层往上爬。最后到了屋顶，那里摆满你们能搜集到的漂亮东西，就成了‘天城’。”
        - id: ch05-b03
          speaker: jo
          text: “真好玩！最好玩的是经过狮子，跟亚玻伦打仗，再走过有妖怪的山谷。”
        - id: ch05-b04
          speaker: meg
          text: “我喜欢重担掉下来，一路滚下楼梯。”
        - id: ch05-b05
          speaker: amy
          text: “我只记得地窖和黑过道很吓人。爬到屋顶以后，有蛋糕和牛奶，我最喜欢那个。要不是已经太大了，我还想再玩一次。”
        - id: ch05-b06
          speaker: narrator
          text: 艾米才十二岁，已经常把不玩小孩子的东西挂在嘴上。
        - id: ch05-b07
          speaker: mrs_march
          text: “亲爱的，这个游戏永远不会玩得太迟，因为我们一直在用这样或那样的方式走这条路。重担就在身边，路就在前面。对善良和幸福的向往，会引着我们走过许多困难和错误，最后到达安宁。那里才是真正的‘天城’。好了，我的小朝圣者们，重新出发吧。这一次不是假装，而是认认真真走一回，看看爸爸回家以前，你们能走多远。”
        - id: ch05-b08
          speaker: amy
          text: “真的，妈妈？可我们的重担在哪里？”
        - id: ch05-b09
          speaker: narrator
          text: 艾米听什么都照字面理解。
        - id: ch05-b10
          speaker: mrs_march
          text: “刚才每个人都说了自己的重担，只有贝丝没有。也许她根本没有呢。”
        - id: ch05-b11
          speaker: beth
          text: “我有。洗盘子、打扫灰尘，羡慕别人家的好钢琴，还有怕见人，这些都是我的重担。”
        - id: ch05-b12
          speaker: narrator
          text: 贝丝的这份重担听来实在有趣。大家一听都想笑，却谁也没有笑出声，因为那样会让她难过极了。
        - id: ch05-b13
          speaker: meg
          text: “那就试试吧。它其实就是换一种说法，叫我们努力变好。这个故事也许能提醒大家。我们虽然想做好，可这件事很难，又总是忘记尽力。”
        - id: ch05-b14
          speaker: jo
          text: “今晚我们掉进了‘灰心沼’，妈妈像书里的‘援助’一样，把大家拉出来。我们还该像‘基督徒’那样，有一卷写着指引的话。这个怎么办？”
        - id: ch05-b15
          speaker: narrator
          text: 一想到能给“尽本分”这件乏味的事添一点传奇色彩，乔就兴奋起来。
        - id: ch05-b16
          speaker: mrs_march
          text: “圣诞节早晨，去枕头下面找。你们会在那里发现指路的书。”
        - id: ch05-b17
          speaker: narrator
          text: 老汉娜收拾餐桌时，她们还在商量新计划。后来，四只针线篮全拿了出来。姑娘们要替马奇姑婆缝床单。针线活本来十分无聊，可今晚谁也没抱怨。她们照乔的办法，把长接缝分成四段，起名叫欧洲、亚洲、非洲和美洲。一边缝过这些“大陆”，一边谈论各地的国家，活儿做得格外顺利。
        - id: ch05-b18
          speaker: narrator
          text: 九点钟，大家收起活计，照例在睡前唱歌。那架旧钢琴，除了贝丝，谁也弹不出多少好听的声音。她轻轻碰着发黄的琴键，给简单的歌配上悦耳的伴奏。梅格的嗓音像长笛，她和妈妈领着这个小小的合唱队。艾米像蟋蟀一样唧唧啾啾。乔呢，完全照自己的意思在曲调里游荡，总会在不对的地方冒出沙哑的低音或颤音，把最哀婉的曲子也弄坏。
        - id: ch05-b19
          speaker: narrator
          text: 从刚会说话、只能含含糊糊唱出“小星，小星，亮晶晶”时起，她们就一直这样唱。后来，这成了家里的习惯。妈妈生来爱唱歌。每天清早，家里最先响起的，是她一边做事、一边像云雀那样唱出的歌声。夜里最后消失的，也是同一个欢快的声音。姑娘们长到多大，都不会嫌那首熟悉的摇篮曲太孩子气。
