  chapters:
    - id: ch01
      title: Christmas Without Presents
      blocks:
        - id: ch01-b01
          speaker: jo
          text: "Christmas won't feel like Christmas if there aren't any presents."
        - id: ch01-b02
          speaker: narrator
          text: Jo grumbled from her place on the rug.
        - id: ch01-b03
          speaker: meg
          text: "Being poor is just awful."
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: Meg looked down at her old dress and sighed.
        - id: ch01-b05
          speaker: amy
          text: "It isn't fair. Some girls have all sorts of pretty things, and other girls have nothing."
        - id: ch01-b06
          speaker: narrator
          text: Little Amy gave an offended sniff.
        - id: ch01-b07
          speaker: beth
          text: "We have Father and Mother. And we have each other."
        - id: ch01-b08
          speaker: narrator
          text: Beth spoke contentedly from her corner. The four young faces in the firelight brightened at her words. Then Jo's face fell again.
        - id: ch01-b09
          speaker: jo
          text: "But we don't have Father here, and we won't for a long time."
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: Jo did not say, "Perhaps never." Still, every sister thought it. Their father was far away, where the fighting was. For a moment, nobody spoke. Then Meg's voice changed.
        - id: ch01-b11
          speaker: meg
          text: "You know why Mother suggested no presents this year. Winter will be hard for everyone. She doesn't think we should spend money on fun while the men in the army are suffering. We can't do much, but we can give up a few little things, and we ought to do it gladly. I'm afraid I don't feel very glad about it, though."
        - id: ch01-b12
          speaker: narrator
          text: Meg shook her head. She was thinking of all the pretty things she wanted.
        - id: ch01-b13
          speaker: jo
          text: "But the little we'd spend wouldn't help the army much. We each have one dollar. I'll agree not to expect presents from Mother or any of you, but I do want to buy Undine and Sintran for myself. I've wanted that book forever."
        - id: ch01-b14
          speaker: narrator
          text: Jo was a great bookworm.
        - id: ch01-b15
          speaker: beth
          text: "I was going to buy some new music with mine."
        - id: ch01-b16
          speaker: narrator
          text: Beth sighed so softly that only the hearth brush and the kettle holder could have heard her.
        - id: ch01-b17
          speaker: amy
          text: "I'm getting a nice box of Faber drawing pencils. I truly need them."
        - id: ch01-b18
          speaker: jo
          text: "Mother never said we couldn't spend our own money. She won't want us to give up every single thing. Let's each buy what we want and have a little fun. We work hard enough to deserve it."
        - id: ch01-b19
          speaker: narrator
          text: Jo inspected the heels of her shoes in a very gentlemanly way.
        - id: ch01-b20
          speaker: meg
          text: "I know I work hard. I teach those tiresome children nearly all day, when I'd much rather be enjoying myself at home."
        - id: ch01-b21
          speaker: jo
          text: "That's not half as bad as my work. Imagine being shut up for hours with a nervous, fussy old lady. She sends you running everywhere, she's never satisfied, and she worries you until you want to jump out the window or burst into tears."
        - id: ch01-b22
          speaker: beth
          text: "I know I shouldn't complain, but washing dishes and keeping everything tidy must be the worst work in the world. It makes me cross, and my hands get so stiff that I can't practice properly."
        - id: ch01-b23
          speaker: narrator
          text: Beth looked at her rough hands. This time, everybody heard her sigh.
        - id: ch01-b24
          speaker: amy
          text: "None of you suffers the way I do. You don't have to go to school with rude girls. They bother you when you don't know a lesson, laugh at your dresses, label your father when he isn't rich, and insult you when your nose isn't pretty."
        - id: ch01-b25
          speaker: jo
          text: "If you mean libel, then say libel. Don't talk about labels as if Papa were a pickle bottle."
        - id: ch01-b26
          speaker: narrator
          text: Jo laughed.
        - id: ch01-b27
          speaker: amy
          text: "I know exactly what I mean, and you don't need to be statirical. A person should use proper words and improve her vocabilary."
        - id: ch01-b28
          speaker: narrator
          text: Amy answered with great dignity.
        - id: ch01-b29
          speaker: meg
          text: "Stop pecking at each other, you two. Jo, don't you wish we still had the money Papa lost when we were little? Oh, we'd be so happy and good if we had nothing to worry about."
        - id: ch01-b30
          speaker: narrator
          text: Meg could remember when the family had been better off.
        - id: ch01-b31
          speaker: beth
          text: "But the other day, you said we were much happier than the King children. They have money, and they still fight and complain all the time."
        - id: ch01-b32
          speaker: meg
          text: "I did say that, didn't I? And I think it's true. We have to work, but we can laugh at ourselves. We're a pretty jolly group, as Jo would put it."
        - id: ch01-b33
          speaker: amy
          text: "Jo uses such dreadful slang."
        - id: ch01-b34
          speaker: narrator
          text: Amy gave the long figure on the rug a disapproving look. Jo sat up at once, pushed her hands into her pockets, and began to whistle.
        - id: ch01-b35
          speaker: amy
          text: "Stop that, Jo. It's so boyish."
        - id: ch01-b36
          speaker: jo
          text: "That's exactly why I'm doing it."
        - id: ch01-b37
          speaker: amy
          text: "I can't stand rude, unladylike girls!"
          emotion: angry
        - id: ch01-b38
          speaker: jo
          text: "And I can't stand affected, fussy little chits!"
          emotion: angry
        - id: ch01-b39
          speaker: beth
          text: "Birds in their little nests agree."
        - id: ch01-b40
          speaker: narrator
          text: Beth sang the words and made such a funny face that both sharp voices softened into laughter. The pecking was over, at least for now.
        - id: ch01-b41
          speaker: meg
          text: "Honestly, you're both at fault. Josephine, you're old enough to stop those boyish tricks and behave better. They didn't matter so much when you were little. But now you're tall and you wear your hair up. You have to remember that you're a young lady."
        - id: ch01-b42
          speaker: jo
          text: "I am not! If putting my hair up makes me a young lady, I'll wear it in two tails until I'm twenty. I hate the idea of growing up and becoming Miss March, with long dresses and a face as prim as a China aster. It's bad enough being a girl when I like boys' games and work and manners. I've never stopped wishing I were a boy. Now it's worse than ever. I want to go fight beside Papa, but all I can do is stay home and knit like a poky old woman!"
          emotion: angry
        - id: ch01-b43
          speaker: narrator
          text: Jo tore off her hair net and shook out a chestnut mane. Then she shook the blue army sock so hard that the needles rattled like castanets and the ball of yarn bounced across the room.
        - id: ch01-b44
          speaker: beth
          text: "Poor Jo. It really is too bad, but we can't change it. You'll have to be content with making your name sound boyish and being a brother to us girls."
        - id: ch01-b45
          speaker: narrator
          text: Beth stroked Jo's rough head. All the dishwashing and dusting in the world could never make that hand ungentle.
        - id: ch01-b46
          speaker: meg
          text: "And Amy, you're far too particular and prim. Your grand little airs are funny now, but if you aren't careful, you'll grow into an affected goose. I like your good manners and your refined way of speaking when you aren't trying to sound elegant. Those ridiculous words are just as bad as Jo's slang."
        - id: ch01-b47
          speaker: beth
          text: "If Jo is a tomboy and Amy is a goose, what am I?"
        - id: ch01-b48
          speaker: narrator
          text: Beth was ready to take her share of the lecture.
        - id: ch01-b49
          speaker: meg
          text: "You're a dear. That's all."
        - id: ch01-b50
          speaker: narrator
          text: Meg answered warmly, and nobody disagreed. The family pet was their quiet little Mouse.
    - id: ch02
      title: The Four Sisters
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The four sisters sat knitting in the twilight. Outside, December snow fell quietly. Inside, the fire crackled. Their room was comfortable, though the carpet had faded and the furniture was plain. A few good pictures hung on the walls. Books filled the little spaces beside the fireplace, and chrysanthemums and Christmas roses bloomed at the windows. Best of all, the room felt peaceful and lived in.
        - id: ch02-b02
          speaker: narrator
          text: Margaret, the oldest, was sixteen and very pretty. She was fair and pleasantly plump, with large eyes, soft brown hair, a sweet mouth, and white hands that made her rather proud.
        - id: ch02-b03
          speaker: narrator
          text: Jo was fifteen, tall, thin, and brown. She was a bit like a colt that had not figured out what to do with its long legs. Her firm mouth, comical nose, and sharp gray eyes could look fierce one moment, funny the next, and thoughtful after that. Her thick, long hair was her one beauty, but she usually bundled it into a net to keep it out of the way. She had round shoulders, big hands and feet, and clothes that always seemed ready to fly apart. She looked like a girl growing rapidly into a woman and not enjoying the process at all.
        - id: ch02-b04
          speaker: narrator
          text: Elizabeth was thirteen, though everyone called her Beth. She had rosy cheeks, smooth hair, bright eyes, a shy manner, and a timid voice. Her peaceful expression almost never changed. Father called her Little Miss Tranquility. The name suited her, because she seemed to live in a happy world of her own and came out only for the few people she trusted and loved.
        - id: ch02-b05
          speaker: narrator
          text: Amy was the youngest, but in her own opinion, she was a very important person. She looked like a snow maiden, pale and slender, with blue eyes and yellow curls resting on her shoulders. She always carried herself like a young lady who remembered her manners. As for the sisters' characters, those would reveal themselves soon enough.
    - id: ch03
      title: A Christmas Surprise for Marmee
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The clock struck six. Beth swept the hearth and set a pair of slippers near the fire to warm. The sight of those old shoes changed the girls' mood. Mother would soon be home, and each of them brightened at the thought. Meg stopped lecturing and lit the lamp. Amy left the easy chair without being asked. Jo forgot her weariness and moved the slippers closer to the blaze.
        - id: ch03-b02
          speaker: jo
          text: "These are completely worn out. Marmee needs a new pair."
        - id: ch03-b03
          speaker: beth
          text: "I thought I'd use my dollar to buy them for her."
        - id: ch03-b04
          speaker: amy
          text: "No, I'll buy them!"
        - id: ch03-b05
          speaker: meg
          text: "But I'm the oldest, so I should—"
        - id: ch03-b06
          speaker: jo
          text: "I'm the man of the family while Papa is away, so I'll provide the slippers. He told me to take special care of Mother until he comes back."
        - id: ch03-b07
          speaker: beth
          text: "I know what we can do. Let's each buy her a Christmas present and get nothing for ourselves."
        - id: ch03-b08
          speaker: jo
          text: "That's just like you, dear! What should we give her?"
        - id: ch03-b09
          speaker: narrator
          text: Everyone thought seriously for a moment. Then Meg looked at her own pretty hands and announced her choice.
        - id: ch03-b10
          speaker: meg
          text: "I'll give her a lovely pair of gloves."
        - id: ch03-b11
          speaker: jo
          text: "I'll get army shoes. The very best pair I can find."
        - id: ch03-b12
          speaker: beth
          text: "I'll give her some handkerchiefs, with every edge hemmed."
        - id: ch03-b13
          speaker: amy
          text: "I'll buy a little bottle of cologne. She likes it, and it won't cost much, so there should still be something left for my pencils."
        - id: ch03-b14
          speaker: meg
          text: "How should we give her everything?"
        - id: ch03-b15
          speaker: jo
          text: "We'll arrange the presents on the table, bring her in, and watch her open each package. Remember how we used to do that on our birthdays?"
        - id: ch03-b16
          speaker: beth
          text: "I was always so scared when I had to sit in the chair wearing the crown. You'd all march around, hand me presents, and kiss me. I liked the presents and the kisses. I just hated having everyone stare while I opened the packages."
        - id: ch03-b17
          speaker: narrator
          text: As Beth spoke, she toasted her face and the bread for tea at the same time.
        - id: ch03-b18
          speaker: jo
          text: "Let's make Marmee think we're shopping for ourselves, and then we'll surprise her. Meg, we have to go tomorrow afternoon. We still have so much to do for the play on Christmas night."
        - id: ch03-b19
          speaker: narrator
          text: Jo marched back and forth with her hands behind her and her nose held high.
        - id: ch03-b20
          speaker: meg
          text: "After this performance, I don't think I'll act anymore. I'm getting too old for it."
        - id: ch03-b21
          speaker: narrator
          text: Yet Meg still loved dressing up as much as any child.
        - id: ch03-b22
          speaker: jo
          text: "You'll never quit while you can sweep around in a white gown, let your hair hang down, and wear jewelry made of gold paper. You're our best actress. If you leave the stage, the whole thing falls apart. We should rehearse tonight. Amy, come practice your fainting scene. You're as stiff as a poker."
        - id: ch03-b23
          speaker: amy
          text: "I can't help that. I've never seen anyone faint, and I refuse to turn myself black and blue by crashing to the floor the way you do. If I can sink down gently, I will. Otherwise, I'll fall gracefully into a chair. I don't care if Hugo is pointing a pistol at me."
        - id: ch03-b24
          speaker: narrator
          text: Amy had little talent for acting. She had been chosen because she was small enough for the villain to carry away while she shrieked.
        - id: ch03-b25
          speaker: jo
          text: "This is how you do it. Clasp your hands, stagger across the room, and cry out wildly, 'Roderigo! Save me! Save me!'"
        - id: ch03-b26
          speaker: narrator
          text: Jo swept away with a truly thrilling scream. Amy tried to follow. She stuck her hands straight out and jerked across the room like a machine. Her cry of "Ow!" sounded less like fear and anguish than like someone sticking pins into her.
        - id: ch03-b27
          speaker: narrator
          text: Jo groaned in despair. Meg burst out laughing, and Beth was so interested that she let the bread burn.
        - id: ch03-b28
          speaker: jo
          text: "It's hopeless! Just do your best during the performance, and if the audience laughs, don't blame me. Meg, you're next."
    - id: ch04
      title: The Christmas Play
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After that, the rehearsal went smoothly. Don Pedro challenged the whole world in a speech two pages long and never paused once. Hagar the witch chanted a dreadful spell over a kettle full of simmering toads. Roderigo tore apart his chains with great strength. Then Hugo died in agony, overcome by remorse and arsenic.
        - id: ch04-b02
          speaker: jo
          text: "Ha! Ha!"
        - id: ch04-b03
          speaker: narrator
          text: The dead villain sat up and rubbed his elbows.
        - id: ch04-b04
          speaker: meg
          text: "That was our best rehearsal yet."
        - id: ch04-b05
          speaker: beth
          text: "Jo, I don't know how you can write such wonderful plays and act them, too. You're a true Shakespeare!"
        - id: ch04-b06
          speaker: narrator
          text: Beth firmly believed her sisters had remarkable genius in everything.
        - id: ch04-b07
          speaker: jo
          text: "Well, not quite Shakespeare. I do think The Witches Curse, an Operatic Tragedy, is rather good. But I'd like to try Macbeth if we had a trapdoor for Banquo. I've always wanted to perform the killing part. Is that a dagger I see in front of me?"
        - id: ch04-b08
          speaker: narrator
          text: Jo muttered the famous line, rolled her eyes, and grabbed at the air, just as she had seen a celebrated actor do.
        - id: ch04-b09
          speaker: meg
          text: "No, it's the toasting fork, and Mother's shoe is on it instead of the bread. Beth has caught the acting fever!"
        - id: ch04-b10
          speaker: narrator
          text: The rehearsal ended in one great burst of laughter.
        - id: ch04-b11
          speaker: marmee
          text: "I'm glad to find my girls having such a merry time."
        - id: ch04-b12
          speaker: narrator
          text: A cheerful voice came from the door. Actors and audience turned to welcome a tall, motherly lady whose face seemed always ready to ask, "Can I help?" She was not dressed elegantly, but she had a noble look. To the girls, the woman under that gray cloak and unfashionable bonnet was the most splendid mother in the world.
        - id: ch04-b13
          speaker: marmee
          text: "Well, dearies, how did everything go today? I had so many boxes to prepare for tomorrow that I couldn't come home for dinner. Beth, did anyone call? Meg, how is your cold? Jo, you look completely worn out. And my baby, come give me a kiss."
        - id: ch04-b14
          speaker: narrator
          text: As Mrs. March asked her questions, she took off her wet things and put on the warm slippers. Then she settled into the easy chair and drew Amy onto her lap, ready for the happiest hour of her busy day.
        - id: ch04-b15
          speaker: narrator
          text: The girls hurried around, each trying in her own way to make things comfortable. Meg set the tea table. Jo brought in wood and arranged chairs, dropping, knocking over, and clattering nearly everything she touched. Beth moved quietly and busily between the parlor and kitchen. Amy stayed on Marmee's lap with folded hands and gave directions to everyone else.
        - id: ch04-b16
          speaker: marmee
          text: "I have a special treat for you after supper."
        - id: ch04-b17
          speaker: narrator
          text: Mrs. March's face looked especially happy. A bright smile flashed around the table like a streak of sunshine. Beth clapped her hands, forgetting the biscuit she held. Jo tossed her napkin into the air.
        - id: ch04-b18
          speaker: jo
          text: "A letter! It's a letter! Three cheers for Father!"
          emotion: happy
        - id: ch04-b19
          speaker: marmee
          text: "Yes, a good long letter. He's well, and he thinks he'll manage the cold season better than we feared. He sends all kinds of loving Christmas wishes, and he has a special message for you girls."
        - id: ch04-b20
          speaker: narrator
          text: Mrs. March patted her pocket as though a treasure lay inside it.
        - id: ch04-b21
          speaker: jo
          text: "Hurry up and finish! Amy, don't curl your little finger and smile over your plate."
        - id: ch04-b22
          speaker: narrator
          text: In her hurry to reach the treat, Jo choked on her tea and dropped her bread butter-side down on the carpet. Beth could eat no more. She slipped away to her shadowy corner and quietly enjoyed thinking about the letter until the others were ready.
        - id: ch04-b23
          speaker: meg
          text: "It was splendid of Father to volunteer as a chaplain. He was too old to be drafted, and he isn't strong enough to serve as a soldier."
        - id: ch04-b24
          speaker: jo
          text: "I wish I could go, too. I could be a drummer, or a vivan—whatever it's called. Or I could be a nurse. Then I could stay near him and help."
        - id: ch04-b25
          speaker: narrator
          text: Jo ended with a groan.
        - id: ch04-b26
          speaker: amy
          text: "Sleeping in a tent must be terribly unpleasant. And they have to eat all kinds of bad-tasting food and drink from tin cups."
        - id: ch04-b27
          speaker: beth
          text: "When will he come home, Marmee?"
          emotion: sad
        - id: ch04-b28
          speaker: narrator
          text: Beth's voice trembled a little.
        - id: ch04-b29
          speaker: marmee
          text: "Not for many months, dear, unless he gets sick. He'll stay and do his work faithfully for as long as he can. We won't ask him to come back one minute before he can be spared. Now, come hear the letter."
          emotion: calm
    - id: ch05
      title: Playing Pilgrims in Earnest
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: They gathered close to the fire. Mother sat in the big chair with Beth at her feet. Meg and Amy perched on the chair's arms. Jo leaned over the back, where nobody could see if the letter moved her. In those hard times, nearly every letter from a father far from home could bring tears.
        - id: ch05-b02
          speaker: narrator
          text: Father wrote very little about the hardships he suffered, the dangers he faced, or the homesickness he overcame. His letter was cheerful and hopeful. He filled it with lively accounts of camp life, marches, and military news. Only near the end did his love and longing for his little girls pour onto the page.
        - id: ch05-b03
          speaker: father
          text: "Give each girl all my love and a kiss. Tell them I think of them during the day and pray for them at night. Their love is always my greatest comfort. A year feels like a very long time to wait before I see them again. But while we wait, we can all keep working, so these difficult days won't be wasted. I know they'll remember what I taught them. They'll be loving daughters to you, do their duty faithfully, fight the faults inside themselves bravely, and learn to master themselves so beautifully that, when I return, I can be even fonder and prouder of my little women."
        - id: ch05-b04
          speaker: narrator
          text: Everyone sniffed at that. Jo did not hide the great tear that fell from the end of her nose. Amy forgot all about her carefully arranged curls. She buried her face against Mother's shoulder and sobbed.
        - id: ch05-b05
          speaker: amy
          text: "I've been so selfish! But I truly will try to be better, so Father won't be disappointed in me when he comes home."
          emotion: sad
        - id: ch05-b06
          speaker: meg
          text: "We all will. I care too much about my appearance, and I hate working. I'll try not to anymore."
        - id: ch05-b07
          speaker: jo
          text: "I'll try to become what Father loves to call me, a little woman. I won't be so rough and wild. I'll do my duty here instead of wishing I were somewhere else."
        - id: ch05-b08
          speaker: narrator
          text: Jo knew that keeping her temper at home might be much harder than facing one or two rebel soldiers down South.
        - id: ch05-b09
          speaker: narrator
          text: Beth said nothing. She wiped her tears on the blue army sock and began knitting as hard as she could. She would not waste a moment before doing the duty nearest to her. In her quiet heart, she promised to become everything Father hoped to find when the year brought him happily home.
        - id: ch05-b10
          speaker: narrator
          text: A silence followed Jo's promise. Mrs. March broke it with her cheerful voice.
        - id: ch05-b11
          speaker: marmee
          text: "Do you remember playing Pilgrim's Progress when you were little? Nothing pleased you more than having me tie my scrap bags on your backs as burdens. I'd give you hats, walking sticks, and rolls of paper. Then you'd travel all through the house. The cellar was the City of Destruction, and you climbed up and up until you reached the roof. There, you gathered every lovely thing you could find to build a Celestial City."
        - id: ch05-b12
          speaker: jo
          text: "That was great fun, especially when we passed the lions, fought Apollyon, and crossed the valley with all the hobgoblins."
        - id: ch05-b13
          speaker: meg
          text: "My favorite part was where our bundles fell off and went tumbling down the stairs."
        - id: ch05-b14
          speaker: amy
          text: "I don't remember very much. I know the cellar and the dark hallway frightened me, and I always liked the cake and milk waiting at the top. If I weren't too old for those games, I might like to play it again."
        - id: ch05-b15
          speaker: narrator
          text: Amy had reached the grand age of twelve and was already talking about leaving childish things behind.
        - id: ch05-b16
          speaker: marmee
          text: "My dear, no one is ever too old for this game. We all play it in one way or another throughout our lives. We carry our burdens, and the road lies ahead of us. Our wish to be good and happy guides us through our troubles and mistakes, until we reach the peace of a true Celestial City. So, my little pilgrims, why don't you begin the journey again? This time, don't make it a game. Try it in earnest, and see how far you can travel before Father comes home."
        - id: ch05-b17
          speaker: amy
          text: "Do you really mean it, Mother? Then where are our bundles?"
        - id: ch05-b18
          speaker: narrator
          text: Amy was a very literal young lady.
        - id: ch05-b19
          speaker: marmee
          text: "Each of you just told us what her burden is, except Beth. I almost think she doesn't have one."
        - id: ch05-b20
          speaker: beth
          text: "Oh, yes, I do. My bundle is dishes and dust cloths, envying girls who have fine pianos, and being afraid of people."
        - id: ch05-b21
          speaker: narrator
          text: Beth's bundle sounded so funny that everybody wanted to laugh. Nobody did, because they knew it would hurt her feelings.
        - id: ch05-b22
          speaker: meg
          text: "Let's do it. It's really another way of saying we'll try to be good, and the story might help us. We do want to be good, but it's hard. We forget, and then we don't try our best."
        - id: ch05-b23
          speaker: jo
          text: "Tonight we were stuck in the Slough of Despond, and Mother pulled us out, just like Help did in the story. We should have a roll of instructions the way Christian did. What can we use for that?"
        - id: ch05-b24
          speaker: narrator
          text: Jo loved this idea. It gave a touch of romance to the very dull business of doing her duty.
        - id: ch05-b25
          speaker: marmee
          text: "Look under your pillows on Christmas morning. You'll find your guidebook there."
        - id: ch05-b26
          speaker: narrator
          text: The girls kept talking about their new plan while old Hannah cleared the table. Then the four little work baskets came out, and the needles flew as the sisters sewed sheets for Aunt March. The sewing itself was dull, but that night nobody complained.
        - id: ch05-b27
          speaker: narrator
          text: Jo suggested dividing each long seam into four parts and naming them Europe, Asia, Africa, and America. The plan worked wonderfully. As they stitched their way across each part, they talked about the different countries.
        - id: ch05-b28
          speaker: narrator
          text: At nine o'clock, they put their work away and sang together, as they always did before bed. Only Beth could coax much music from the old piano. Her soft touch on the yellow keys made a pleasant accompaniment for their simple songs.
        - id: ch05-b29
          speaker: narrator
          text: Meg's voice sounded like a flute, and she led the little choir with Mother. Amy chirped like a cricket. Jo followed the tune wherever she pleased, then arrived at the wrong moment with a croak or a quaver that spoiled even the saddest song.
        - id: ch05-b30
          speaker: narrator
          text: They had sung together ever since they were small enough to lisp, "Crinkle, crinkle, 'ittle 'tar." By now, it was a family custom. Their mother had been born with a song in her. The first sound each morning was her voice as she moved through the house, singing like a lark. At night, that same cheerful voice was the last thing the girls heard. They never grew too old for the familiar lullaby.
