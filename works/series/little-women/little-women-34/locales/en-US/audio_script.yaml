  chapters:
    - id: ch01
      title: November
      blocks:
        - id: ch01-b01
          speaker: jo
          text: "Dear Marmee and Beth, I mean to send you a whole volume, because I have heaps to tell. I may not be a grand young lady touring Europe, but my journey began with plenty to write about. When Father's dear face disappeared from sight, I felt rather blue. I might even have cried a little, but an Irish mother nearby had four small children, and every one of them was wailing. Each time a mouth opened for a roar, I dropped a gingerbread nut over the seat. That kept me busy."
        - id: ch01-b02
          speaker: jo
          text: "Then the sun came out. I took that as a good sign, cheered up with the weather, and enjoyed the rest of the trip with all my heart."
        - id: ch01-b03
          speaker: jo
          text: "Mrs. Kirke welcomed me so warmly that even her enormous house full of strangers soon felt like home. She gave me the only room she had, a funny little room high under the roof. It has a stove and a good table by a sunny window, so I can write whenever I please. The view and the church tower across the way make up for all those stairs. I liked my little den immediately."
        - id: ch01-b04
          speaker: jo
          text: "The nursery, where I am to teach and sew, is a pleasant room beside Mrs. Kirke's private parlor. Her two little girls are pretty and perhaps a bit spoiled, but they decided they liked me after I told them The Seven Bad Pigs. I have no doubt I shall become a model governess. I may eat with the children instead of at the large table, and for now I prefer that. I really am shy, though nobody believes it."
        - id: ch01-b05
          speaker: mrs_kirke
          text: "Make yourself at home, my dear. With this family, I am rushing from morning till night. But it will ease my mind greatly to know the children are safe with you. My rooms are always open, and I'll make yours as comfortable as I can. There are pleasant people here when you want company, and your evenings belong to you. If anything goes wrong, come straight to me. Be as happy as you can. Oh, there's the tea bell. I must run and change my cap."
        - id: ch01-b06
          speaker: jo
          text: "Off she hurried, leaving me to settle into my new nest. Soon afterward, on my way downstairs, I saw something I liked. This tall house has very long flights of stairs. At the top of the third flight, I had to wait while a little servant girl struggled upward with a heavy hod of coal. A gentleman came up behind her, took it from her hands, carried it to a nearby door, and set it down."
        - id: ch01-b07
          speaker: professor_bhaer
          text: "There, that goes better. Such a young back should not carry so heavy a load."
        - id: ch01-b08
          speaker: jo
          text: "Wasn't that good of him? I always notice such things. Father says small acts show a person's character. When I told Mrs. Kirke that evening, she laughed and said it must have been Professor Bhaer, because he was forever doing things like that."
        - id: ch01-b09
          speaker: jo
          text: "She told me he came from Berlin. He is very learned and very good, but as poor as a church mouse. He gives lessons to support himself and two young orphaned nephews. His sister married an American, and he is raising the boys here as she wished. It is not a romantic history, but it interested me. I was pleased to learn that Mrs. Kirke lets him teach some pupils in her parlor. A glass door separates it from the nursery, so I intend to peep at him and report what he looks like. He is nearly forty, Marmee, so there can be no harm in that."
        - id: ch01-b10
          speaker: jo
          text: "After tea and a wild bedtime romp with the girls, I tackled the large sewing basket. I spent a quiet evening talking with my new friend. I shall keep this as a journal-letter and mail it once a week. Good night for now. There will be more tomorrow."
    - id: ch02
      title: Tuesday Evening
      blocks:
        - id: ch02-b01
          speaker: jo
          text: "My little school was lively this morning. The children behaved so much like Sancho that for a while I truly thought I might shake every one of them. Then some good angel put gymnastics into my head. I kept them moving until they were glad to sit quietly. After lunch, the maid took them walking, and I settled down to sew with a willing mind. I was congratulating myself on having learned to make neat buttonholes when the next room's door opened and closed. Someone began humming Kennst Du Das Land in a voice like a giant bumblebee."
        - id: ch02-b02
          speaker: jo
          text: "I knew peeping was terribly improper, but I could not resist. I lifted one corner of the curtain over the glass door. Professor Bhaer was arranging his books, and I finally had a good look at him. He was thoroughly German, rather stout, with brown hair tumbling over his head, a bushy beard, a good nose, and the kindest eyes I had ever seen. His splendid big voice was a relief after the sharp or careless way so many Americans talk."
        - id: ch02-b03
          speaker: jo
          text: "His clothes were worn and his hands were large. Except for beautiful teeth, not one feature was truly handsome. Still, I liked him. He had a fine head, spotless linen, and the look of a gentleman, even with two coat buttons missing and a patch on one shoe. He seemed solemn while he hummed. Then he turned the hyacinth bulbs toward the sunlight and stroked the cat, who welcomed him like an old friend. At that, he smiled. A knock sounded."
        - id: ch02-b04
          speaker: professor_bhaer
          text: "Come in!"
        - id: ch02-b05
          speaker: jo
          text: "I nearly ran away, but a tiny child appeared carrying a huge book, and I stayed to see what she would do."
        - id: ch02-b06
          speaker: tina
          text: "I want my Bhaer."
        - id: ch02-b07
          speaker: jo
          text: "She dropped the book with a bang and ran to him. He laughed, swept her up, and held her so high that she had to bend down to kiss him."
        - id: ch02-b08
          speaker: professor_bhaer
          text: "Then you shall have your Bhaer. Come give me one good hug, my Tina."
        - id: ch02-b09
          speaker: tina
          text: "Now I have to study my lesson."
        - id: ch02-b10
          speaker: jo
          text: "He placed her at the table, opened the great dictionary she had brought, and gave her paper and a pencil. She scribbled solemnly, turning a page now and then and running one plump finger down it as though searching for a word. I almost gave myself away by laughing. Professor Bhaer stood beside her, stroking her pretty hair with such a fatherly look that I wondered if she were his child, though she looked more French than German."
        - id: ch02-b11
          speaker: jo
          text: "Another knock brought two young ladies. I returned virtuously to my sewing and stayed there through all the noise and chatter next door. One girl kept giving affected little laughs."
        - id: ch02-b12
          speaker: young_lady_one
          text: "Oh, Professor, really."
        - id: ch02-b13
          speaker: jo
          text: "The other spoke German with an accent that must have tested his straight face. Between them, they tried his patience badly. More than once I heard him correct them sharply."
        - id: ch02-b14
          speaker: professor_bhaer
          text: "No, no, that is not right. You have not listened to what I tell you."
        - id: ch02-b15
          speaker: jo
          text: "At last came a loud rap, as though his book had struck the table, and then one despairing cry."
        - id: ch02-b16
          speaker: professor_bhaer
          text: "Prut! Everything goes wrong today."
        - id: ch02-b17
          speaker: jo
          text: "I pitied the poor man. When the girls left, I took one last peek to make sure he had survived. He had fallen back in his chair and sat with his eyes closed, completely worn out. At two o'clock he sprang up, tucked his books into his pocket, and looked ready to face another lesson. Then he lifted Tina, who had fallen asleep on the sofa, and carried her quietly away. I suspect he has a hard life."
        - id: ch02-b18
          speaker: jo
          text: "Mrs. Kirke invited me to the five o'clock dinner. I felt a little homesick, so I went to see what sort of people shared this roof. I made myself presentable and tried to hide behind Mrs. Kirke as we entered. Since she is short and I am tall, it did not work. She seated me beside her. Once my face stopped burning, I found the courage to look around."
        - id: ch02-b19
          speaker: jo
          text: "The long table was crowded, and everyone was intent on dinner. The gentlemen especially seemed to be racing the clock. They swallowed their food and vanished the instant they finished. There were self-absorbed young men, young couples absorbed in each other, married women absorbed in their babies, and old gentlemen absorbed in politics. I doubt I shall care much for any of them, except one sweet-faced unmarried lady who looks as though she has something worthwhile in her."
        - id: ch02-b20
          speaker: jo
          text: "At the very foot of the table sat Professor Bhaer. On one side, he shouted answers to an inquisitive old gentleman who was hard of hearing. On the other, he discussed philosophy with a Frenchman. Amy would have turned her back on him forever, because the sad truth is that he has an enormous appetite and shoveled in his dinner in a way that would have horrified her ladyship. I did not mind. As Hannah says, I like to see people eat with a relish. After teaching foolish pupils all day, the poor man must need a great deal of food."
        - id: ch02-b21
          speaker: jo
          text: "After dinner, I went upstairs. Two young men stood at the hall mirror adjusting their hats, and I heard one murmur to the other."
        - id: ch02-b22
          speaker: young_man_one
          text: "Who's the new girl?"
        - id: ch02-b23
          speaker: young_man_two
          text: "Some kind of governess."
        - id: ch02-b24
          speaker: young_man_one
          text: "Then why on earth is she eating at our table?"
        - id: ch02-b25
          speaker: young_man_two
          text: "She's a friend of the old lady."
        - id: ch02-b26
          speaker: young_man_one
          text: "Good-looking head, but she has no style."
        - id: ch02-b27
          speaker: young_man_two
          text: "None at all. Give me a light, and let's go."
        - id: ch02-b28
          speaker: jo
          text: "At first I was angry. Then I decided I did not care. A governess is every bit as good as a clerk. If I lack style, at least I have sense, which is more than those elegant creatures seemed to possess. They clattered off, smoking like bad chimneys. I hate ordinary people!"
    - id: ch03
      title: Thursday and Saturday
      blocks:
        - id: ch03-b01
          speaker: jo
          text: "Yesterday passed quietly. I taught, sewed, and wrote in my cozy little room with its light and fire. I also gathered some news and was formally introduced to the Professor. Tina, it turns out, belongs to the Frenchwoman who does the fine ironing in the laundry. The little creature has given her whole heart to Mr. Bhaer and follows him through the house like a dog whenever he is home. He loves it, because he is very fond of children, though he is a bachelor."
        - id: ch03-b02
          speaker: jo
          text: "Kitty and Minnie Kirke adore him too. They tell endless stories about games he invents, presents he brings, and wonderful tales he tells. The younger men tease him and call him Old Fritz, Lager Beer, and Ursa Major. They make every possible joke from his name. Mrs. Kirke says he enjoys it like a boy and takes it all so cheerfully that everyone likes him, foreign ways and all."
        - id: ch03-b03
          speaker: jo
          text: "The sweet-faced lady is Miss Norton. She is rich, educated, and kind. At dinner today, she spoke to me and invited me to visit her room. Yes, I went to the big table again. Watching people is too amusing to miss. Miss Norton owns beautiful books and pictures, knows interesting people, and seems friendly. I shall make myself pleasant, because I truly want good society, though not the kind Amy wants."
        - id: ch03-b04
          speaker: jo
          text: "Last evening, I was in our parlor when Mr. Bhaer brought Mrs. Kirke some newspapers. Mrs. Kirke was away, so Minnie, who behaves like a tiny old woman, introduced us very properly."
        - id: ch03-b05
          speaker: minnie
          text: "Professor Bhaer, this is Mama's friend, Miss March."
        - id: ch03-b06
          speaker: kitty
          text: "And she's great! We like her very much."
        - id: ch03-b07
          speaker: jo
          text: "Kitty is a terrible child for saying exactly what she thinks. Mr. Bhaer and I bowed, then both laughed at the contrast between Minnie's grand introduction and Kitty's blunt addition."
        - id: ch03-b08
          speaker: professor_bhaer
          text: "Ah, yes. I hear these naughty little ones sometimes trouble you, Miss March. If they do it again, call for me, and I will come."
        - id: ch03-b09
          speaker: jo
          text: "He gave them a threatening frown, which delighted the little wretches. I promised to call him and he went away. I seem destined to see plenty of him, though. Today, as I passed his door on my way out, my umbrella struck it by accident. The door flew open. There stood the Professor in his dressing gown, with a large blue sock pulled over one hand and a darning needle in the other."
        - id: ch03-b10
          speaker: jo
          text: "I explained and hurried on, but he showed no embarrassment. He simply waved the hand wearing the sock and called after me in his loud, cheerful voice."
        - id: ch03-b11
          speaker: professor_bhaer
          text: "It is a fine day for your walk. Bon voyage, mademoiselle!"
        - id: ch03-b12
          speaker: jo
          text: "I laughed all the way downstairs. Still, it was a little sad to think of the poor man mending his own clothes. German gentlemen may embroider, I know, but darning stockings is quite another matter and far less pretty."
        - id: ch03-b13
          speaker: jo
          text: "Saturday brought only one event to report, a visit with Miss Norton. Her room is full of lovely things, and she was charming. She showed me all her treasures, then asked whether I might sometimes escort her to lectures and concerts, if I enjoyed them. She made it sound as though I would be doing her a favor. But I am sure Mrs. Kirke told her about our family, and that she offered from kindness. I am as proud as Lucifer, yet kindness from people like her does not weigh on me. I accepted gratefully."
        - id: ch03-b14
          speaker: jo
          text: "When I returned to the nursery, a tremendous uproar came from the parlor. I looked in. Mr. Bhaer was crawling on his hands and knees with Tina riding on his back. Kitty led him by a jump rope. Minnie fed seedcakes to two small boys, who roared and bounded inside cages made from chairs."
        - id: ch03-b15
          speaker: kitty
          text: "We're playing a menagerie."
        - id: ch03-b16
          speaker: tina
          text: "This is my elephant!"
        - id: ch03-b17
          speaker: jo
          text: "Tina clung to the Professor's hair as she said it."
        - id: ch03-b18
          speaker: minnie
          text: "Mama always lets us do whatever we like on Saturday afternoons when Franz and Emil come. Isn't that right, Mr. Bhaer?"
        - id: ch03-b19
          speaker: jo
          text: "The elephant sat upright and looked as serious as any child there."
        - id: ch03-b20
          speaker: professor_bhaer
          text: "I give you my word, Miss March, it is true. If we grow much too noisy, you must say hush, and then we will play more softly."
        - id: ch03-b21
          speaker: jo
          text: "I promised, but I left the door open and enjoyed the game as much as they did. I had never seen a more glorious romp. They played tag and soldiers, danced, and sang. As darkness came, they all crowded onto the sofa around the Professor. He told them enchanting fairy tales about storks on chimney tops and little kobolds who ride falling snowflakes. I wish Americans were as simple and natural as Germans. Don't you?"
        - id: ch03-b22
          speaker: jo
          text: "I love writing so much that I could go on forever, but postage must stop me. Even on thin paper with tiny writing, this letter will need a frightening number of stamps. Please send Amy's letters when you can spare them. My little news will sound plain beside her splendors, but I know you will enjoy it. Is Teddy studying so hard that he cannot write to his friends? Look after him for me, Beth. Tell me everything about the babies, and give everyone heaps of love. Your faithful Jo."
        - id: ch03-b23
          speaker: jo
          text: "Postscript. Reading this over, I find the letter rather full of Bhaer. But odd people always interest me, and truly, I had nothing else to write about. Bless you!"
    - id: ch04
      title: December
      blocks:
        - id: ch04-b01
          speaker: jo
          text: "My precious Betsey, this will be a scribble-scrabble sort of letter, so I am sending it to you. It may amuse you and show you how I spend my days. My life is quiet, but it is funny too, thank goodness. After what Amy would call heroic labor in cultivating their minds and morals, my young pupils' ideas are finally beginning to sprout, and the little twigs are bending the way I want. They do not interest me as much as Tina and the boys, but I do my duty, and they are fond of me."
        - id: ch04-b02
          speaker: jo
          text: "Franz and Emil are delightful boys, just the sort I like. Their mixture of German and American spirit keeps them bubbling constantly. Saturday afternoons are always riotous, indoors or out. On fine days, the whole group marches off like a little school, with the Professor and me trying to keep order. We have such fun."
        - id: ch04-b03
          speaker: jo
          text: "The Professor and I are very good friends now, and I have started taking lessons. I could hardly help it. It happened in such a funny way that I must tell you from the beginning. One day I passed Mr. Bhaer's room while Mrs. Kirke was searching through it, and she called me inside."
        - id: ch04-b04
          speaker: mrs_kirke
          text: "Did you ever see such a den? Come help me straighten these books. I've turned the room upside down looking for six new handkerchiefs I gave him not long ago. What can he have done with them?"
        - id: ch04-b05
          speaker: jo
          text: "I joined her and looked around while we worked. Den was exactly the word. Books and papers lay everywhere. A broken meerschaum pipe and an old flute rested above the fireplace as though both had been abandoned. A ragged bird without a tail chirped on one window seat, while a box of white mice decorated the other. Half-built boats and scraps of string were mixed among the manuscripts. Dirty little boots dried by the fire. Everywhere you looked, there were signs of the beloved boys for whom he makes himself a slave."
        - id: ch04-b06
          speaker: jo
          text: "After a great search, we found three of the missing handkerchiefs. One covered the birdcage. One was stained with ink. The third had been used as a potholder and burned brown. Mrs. Kirke laughed as she dropped the sad remains into the rag bag."
        - id: ch04-b07
          speaker: mrs_kirke
          text: "What a man! I suppose the others became sails for boats, bandages for cut fingers, or tails for kites. It is dreadful, but I cannot scold him. He is so absentminded and so good-natured that those boys run right over him. I promised to wash and mend his things, but he forgets to send them out, and I forget to inspect them. Sometimes his clothes end up in a sorry state."
        - id: ch04-b08
          speaker: jo
          text: "Let me mend them. I don't mind, and he never needs to know. I would like to do it, because he is so kind about bringing my letters and lending me books."
        - id: ch04-b09
          speaker: jo
          text: "That is how I put his things in order. I even knitted new heels into two pairs of socks, because his strange darning had pulled them completely out of shape. Nobody mentioned it, and I hoped he would never discover me. But last week, he did."
        - id: ch04-b10
          speaker: jo
          text: "Listening to his lessons had made me want to learn German. Tina often ran in and out and left the door open, so I could hear everything. One day I sat near that door, finishing the last sock and trying to follow his lesson with a new pupil who understood about as little as I did. The student left. The next room became so quiet that I thought the Professor had gone too. I rocked back and forth, repeating a verb in a ridiculous way. Then a small crow made me look up."
        - id: ch04-b11
          speaker: jo
          text: "There was Mr. Bhaer, watching me and laughing softly. He was making signs to Tina so she would not give him away. I stopped and stared like a goose."
        - id: ch04-b12
          speaker: professor_bhaer
          text: "So! You peep at me, and now I peep at you. That is fair enough. But I am not joking when I ask this. Do you wish to learn German?"
        - id: ch04-b13
          speaker: jo
          text: "Yes, but you are far too busy, and I am far too stupid to learn."
        - id: ch04-b14
          speaker: jo
          text: "I stumbled over the words and turned as red as a peony."
        - id: ch04-b15
          speaker: professor_bhaer
          text: "Prut! We will find the time, and we will find the sense too. I will gladly give you a small lesson in the evenings, Miss March, because I have a debt to pay."
        - id: ch04-b16
          speaker: jo
          text: "He pointed at the sock in my hands, then pretended to speak for all the kind ladies who had secretly repaired his clothes."
        - id: ch04-b17
          speaker: professor_bhaer
          text: "They say, 'He is a foolish old fellow. He will never see what we have done. He will not notice that his heels no longer poke through holes. He will think his buttons grow back by themselves and loose strings mend themselves.' Ah, but I have eyes, and I see many things. I have a heart too, and I am grateful. Come, we will begin a little lesson now. Otherwise, there can be no more good fairy work for me or my boys."
        - id: ch04-b18
          speaker: jo
          text: "After that, of course I could not refuse. It truly was a splendid opportunity, so we made our bargain and began. I took four lessons before I became hopelessly stuck in the swamp of grammar. The Professor was endlessly patient, though teaching me must have been torture. Now and then, he looked at me with such gentle despair that I could not decide whether to laugh or cry. I tried both."
        - id: ch04-b19
          speaker: jo
          text: "When my humiliation finally came out in a sniff, he threw the grammar book onto the floor and marched from the room. I felt disgraced and deserted forever, though I did not blame him at all. I gathered my papers, ready to rush upstairs and give myself a good shaking. Then he came back, brisk and cheerful, as if I had done something glorious."
        - id: ch04-b20
          speaker: professor_bhaer
          text: "Now we try another way. You and I will read these pleasant little fairy tales together. We will dig no longer in that dry book. Into the corner it goes, because it has caused us enough trouble."
        - id: ch04-b21
          speaker: jo
          text: "His voice was so kind, and he opened Hans Andersen's fairy tales so invitingly, that I felt more ashamed than ever. I attacked the lesson with everything I had. He seemed greatly amused as I forgot my shyness and struggled on, crashing over long words and inventing each pronunciation when I reached it. I did my very best. At last, I finished one page and stopped to breathe. He clapped his hands."
        - id: ch04-b22
          speaker: professor_bhaer
          text: "Das ist gut! Now we are doing well. It is my turn. I will read it in German, and you will lend me your ears."
        - id: ch04-b23
          speaker: jo
          text: "Off he went, rolling the words out in his powerful voice and enjoying every one of them. It was delightful to hear and to watch. Luckily, the story was The Constant Tin Soldier, which is funny even when you know it well. I understood hardly half of his German, but I laughed anyway. He was so earnest, I was so excited, and the entire lesson was so comical that I could not help myself."
        - id: ch04-b24
          speaker: jo
          text: "We did better after that. Now I read my lessons quite well. This way of learning suits me, because the grammar hides inside stories and poems the way medicine can hide in jelly. I enjoy it very much, and the Professor does not seem tired of teaching me yet. That is good of him, isn't it? I want to give him something for Christmas, since I would never dare offer money. Tell me what would be nice, Marmee."
        - id: ch04-b25
          speaker: jo
          text: "I am glad Laurie is happy and busy, that he has stopped smoking, and that he lets his hair grow. You see, Beth, you manage him better than I did. I am not jealous, dear. Do your best with him, but please do not turn him into a saint. I fear I could not like him without a little ordinary mischief left. Read him pieces of my letters. I have no time to write much more, and that will serve just as well. Thank Heaven Beth continues so comfortable."
    - id: ch05
      title: January
      blocks:
        - id: ch05-b01
          speaker: jo
          text: "A happy New Year to my dearest family, and naturally that includes Mr. L. and a certain young man named Teddy. I cannot tell you how much I enjoyed the Christmas bundle, because it did not arrive until evening and I had stopped hoping for it. Your letter came that morning, but you carefully said nothing about a package because you meant to surprise me. I was disappointed. I had felt somehow that you would not forget me."
        - id: ch05-b02
          speaker: jo
          text: "After tea, I sat alone in my room feeling low. Then someone brought in a large bundle, muddy, battered, and beautiful. I hugged it and danced around. It felt so much like home that I sat right down on the floor. I read, looked, ate, laughed, and cried in my usual foolish fashion. Every gift was exactly what I wanted, and each was dearer because you made it instead of buying it."
        - id: ch05-b03
          speaker: jo
          text: "Beth's new ink bib was perfect, and Hannah's box of hard gingerbread will be treasured. Marmee, I promise to wear the warm flannels you sent and study the passages Father marked in the books. Thank you, all of you, heaps and heaps!"
        - id: ch05-b04
          speaker: jo
          text: "Speaking of books, I am becoming rich in them. On New Year's Day, Mr. Bhaer gave me a beautiful Shakespeare. It is a copy he values deeply. I often admired it standing in the place of honor beside his German Bible, Plato, Homer, and Milton. Imagine how I felt when he took it down, uncovered it, and showed me my name written inside with the words, 'from my friend Friedrich Bhaer.'"
        - id: ch05-b05
          speaker: professor_bhaer
          text: "You often say that you wish for a library. Here I give you one. Between these covers, there are many books in one. Read it carefully, and it will help you. Shakespeare studies human character. He can teach you to understand character in the world and then paint it with your pen."
        - id: ch05-b06
          speaker: jo
          text: "I thanked him as well as I could. Now I speak grandly of my library as though I owned a hundred books. I never understood how much Shakespeare held before, but then I never had a Bhaer to explain it. And do not laugh at his dreadful name. It is not pronounced Bear or Beer, no matter what people say. The true sound lies somewhere between them and only a German can make it properly."
        - id: ch05-b07
          speaker: jo
          text: "I am glad you both enjoy my stories about him, and I hope you will meet him someday. Mother would admire his warm heart, and Father would admire his wise head. I admire them both. I feel very rich in my new friend, Friedrich Bhaer."
        - id: ch05-b08
          speaker: jo
          text: "I had little money and no idea what he wanted for Christmas, so I found several small things and hid them around his room for him to discover. Some were useful, some pretty, and some silly. I put a new inkstand on his table and gave him a little vase for the flower or sprig of green he always keeps in water. He says it keeps him fresh. I also made a holder for his stove pipe, so he would stop burning what Amy calls his mouchoirs."
        - id: ch05-b09
          speaker: jo
          text: "I copied one Beth once invented. It was a large butterfly with a plump body, black and yellow wings, yarn feelers, and bead eyes. The Professor liked it so much that he displayed it on his mantel as a work of art. That rather defeated its purpose. Poor as he is, he remembered every servant and child in the house. And everyone, from the French laundress to Miss Norton, remembered him. That pleased me more than I can say."
        - id: ch05-b10
          speaker: jo
          text: "There was a masquerade on New Year's Eve, and everyone had a merry time. I had no costume, so I meant to stay upstairs. At the last minute, Mrs. Kirke remembered some old brocade, and Miss Norton lent me lace and feathers. I dressed as Mrs. Malaprop and swept into the party behind a mask. Nobody knew me because I changed my voice. They never imagined that silent, proud Miss March could dress up, dance, and pour out mixed-up quotations about a nice derangement of epitaphs and an allegory on the banks of the Nile."
        - id: ch05-b11
          speaker: jo
          text: "Most people here believe I am stiff and cold. With foolish young men, I certainly am. But that night I enjoyed myself completely. When the masks came off, their staring faces were wonderful. I overheard one young man tell another that he had known all along I was an actress. In fact, he thought he remembered me from one of the smaller theaters. Meg will appreciate that joke."
        - id: ch05-b12
          speaker: jo
          text: "Mr. Bhaer played Nick Bottom, and Tina was Titania, a perfect little fairy in his arms. Watching them dance was quite a landscape, as Teddy would say."
        - id: ch05-b13
          speaker: jo
          text: "So my New Year was very happy after all. Later, alone in my room, I thought it over and felt that perhaps I was making a little progress, despite all my failures. I am cheerful all the time now. I work willingly, and I care more about other people than I once did. I find that very satisfying. Bless you all. Ever your loving Jo."
