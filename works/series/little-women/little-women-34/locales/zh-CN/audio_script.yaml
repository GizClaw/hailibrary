audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，带着克制的幽默, timbre: 清澈柔和, pace: 从容舒展, pitch: 中音}
    jo:
      display_name: 乔
      tts: {delivery: 爽直活泼，情感来得快而真, timbre: 明亮有力, pace: 稍快, pitch: 中音}
    mrs_kirke:
      display_name: 柯克太太
      tts: {delivery: 热心爽快，忙碌中透着慈爱, timbre: 温厚明亮, pace: 稍快, pitch: 中音}
    professor_bhaer:
      display_name: 巴尔教授
      tts: {delivery: 诚恳热烈，带着温和的德国口音, timbre: 洪亮浑厚, pace: 从容, pitch: 中低音}
    tina:
      display_name: 蒂娜
      tts: {delivery: 天真黏人，吐字带着幼童稚气, timbre: 轻软稚嫩, pace: 稍慢, pitch: 高音}
    kitty:
      display_name: 凯蒂
      tts: {delivery: 直率顽皮，想到什么就说什么, timbre: 清脆活泼, pace: 稍快, pitch: 中高音}
    minnie:
      display_name: 明妮
      tts: {delivery: 一本正经又可爱，像个小大人, timbre: 清亮稚嫩, pace: 适中, pitch: 中高音}
    young_man_1:
      display_name: 年轻男子甲
      tts: {delivery: 随便傲慢，漫不经心, timbre: 清朗偏薄, pace: 稍快, pitch: 中音}
    young_man_2:
      display_name: 年轻男子乙
      tts: {delivery: 轻佻敷衍，语气冷淡, timbre: 平直清晰, pace: 稍快, pitch: 中音}
  chapters:
    - id: ch01
      title: 纽约，十一月
      blocks:
        - id: ch01-b01
          speaker: jo
          text: 亲爱的妈妈和贝思，我这回怕是要写出整整一本书了。可说的事实在太多，虽然我又不是什么周游欧洲大陆的时髦小姐。父亲那张亲爱的老面孔从眼前消失时，我心里一酸，险些掉下几滴咸眼泪。幸亏同车有位爱尔兰太太，带着四个哭个不停的孩子。我每见一张小嘴张开要嚎，就隔着座位扔过去一颗姜饼豆，拿这个给自己解闷。
        - id: ch01-b02
          speaker: jo
          text: 后来太阳出来了。我觉得这是个好兆头，心也跟着亮堂起来，一路快活得不得了。
        - id: ch01-b03
          speaker: jo
          text: 柯克太太待我十分亲切，那栋挤满陌生人的大房子，一下就有了家的感觉。她只能腾给我一间顶楼小屋，可那里有火炉，向阳的窗边还有张舒服的桌子，我想写东西时随时能坐下。窗外景色很好，对面立着教堂尖塔，爬那么多层楼也值了。我一眼就喜欢上这个小窝。儿童室挨着柯克太太的客厅，我要在那里教书、做针线。两个小姑娘很漂亮，我猜也给惯坏了一点。不过听完《七只坏小猪》，她们已经喜欢上我。我看自己准能做个模范家庭教师。
        - id: ch01-b04
          speaker: jo
          text: 要是不想到大餐桌吃饭，我可以跟孩子们一起吃。眼下我正巴不得这样，因为我其实很怕生。你们当然谁也不肯信。
        - id: ch01-b05
          speaker: mrs_kirke
          text: 亲爱的，只管把这里当自己家。我有这么一大家子人，从早忙到晚，你也想得到。只要知道孩子们跟着你很安全，我就少了一桩大心事。我的房门永远向你开着，你自己的屋子，我也会尽力收拾舒服。房客里有几位很讨人喜欢，你想交朋友就去认识他们。晚上全归你自己。出了岔子便来找我，尽量过得开心些。茶铃响了，我得赶快去换帽子。
        - id: ch01-b06
          speaker: narrator
          text: 柯克太太说完便风风火火地走了，把乔留在新窝里安顿自己。没过多久，乔下楼时看见一件很合心意的小事。房子很高，每一段楼梯都很长。她站在第三段楼梯顶上，看一个小女佣吃力地往上爬。这时，一位先生从后面赶来，接过沉重的煤斗，一路提上楼，放到附近一扇门前。他和气地朝小姑娘点点头。
        - id: ch01-b07
          speaker: professor_bhaer
          text: 这样拿就轻松了。你这小小的背，还不该压这么重的东西。
        - id: ch01-b08
          speaker: jo
          text: 他是不是很好？我最喜欢这种小事。父亲总说，细微处最能看出一个人的品性。晚上我说给柯克太太听，她笑着告诉我，那准是巴尔教授，他一向爱做这样的事。
        - id: ch01-b09
          speaker: jo
          text: 原来他从柏林来，学问很大，心也很好，却穷得像教堂里的耗子。他靠教课养活自己，还照姐姐的遗愿，供两个失去父母的小外甥在这里念书。他姐姐嫁过一个美国人。这个故事算不上浪漫，我倒很感兴趣。柯克太太把客厅借给他教学生，客厅和儿童室只隔一道玻璃门。我打算偷偷看看他长什么样，再写给你们。他都快四十岁了，所以这不算什么坏事，对吧，妈妈？
        - id: ch01-b10
          speaker: jo
          text: 喝过茶，我陪两个小姑娘痛痛快快闹了一场，哄她们上床，又向那只大针线篮发起进攻。我一边干活，一边跟新朋友聊天，安安静静地过完了晚上。以后我就把这封信当日记，每星期寄一次。晚安，明天接着写。
        - id: ch01-b11
          speaker: jo
          text: 星期二晚上。今天上午，我那所小学堂热闹得很。两个孩子像桑丘一样胡闹，我有一阵真想把她们挨个儿摇上一遍。幸好有位好天使提醒我试试体操。我带她们练个不停，直到她们巴不得坐下来安静一会儿。午饭后，女佣领她们去散步，我就像小梅布尔那样，怀着甘愿的心做针线。
        - id: ch01-b12
          speaker: jo
          text: 我正庆幸自己学会缝漂亮的扣眼，隔壁的门忽然开了又关，接着有人哼起《你可知道那地方》，那声音像只大黄蜂。我知道偷看很没规矩，可实在忍不住，便掀开玻璃门帘一角。巴尔教授果然在里面。我趁他整理书本，把他仔细看了个够。他十足是个德国人，身材有点胖，棕发乱蓬蓬，胡须浓密，鼻子端正，还有一双我见过的最和善的眼睛。
        - id: ch01-b13
          speaker: jo
          text: 他的嗓音又大又好听。听惯美国人尖利或含混的叽里咕噜，再听他说话，耳朵都舒服了。他衣服很旧，手掌很大，脸上除了洁白漂亮的牙齿，实在没有哪一点算英俊。可我还是喜欢他。他的头长得气派，衬衣干干净净。外套虽掉了两颗纽扣，鞋上还有补丁，看着依旧是个绅士。他一边哼歌，一边板着脸，直到把风信子球茎转向阳光，又摸了摸那只像老朋友一样欢迎他的猫，才终于笑起来。门上响起敲门声，他立刻洪亮地喊了一句请进。
        - id: ch01-b14
          speaker: narrator
          text: 乔正要溜走，却看见一个丁点儿大的孩子抱着一本大书进来，便留下看个究竟。小家伙把书砰地放下，跑过去迎接教授。
        - id: ch01-b15
          speaker: tina
          text: 我要我的巴尔！
          emotion: happy
        - id: ch01-b16
          speaker: professor_bhaer
          text: 你当然能有你的巴尔。来吧，我的蒂娜，让巴尔好好抱抱你。
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: 教授笑着举起蒂娜，把她托得高过头顶。小姑娘非得弯下脸来，才能亲到他。
        - id: ch01-b18
          speaker: tina
          text: 现在我要学功课啦。
        - id: ch01-b19
          speaker: narrator
          text: 教授把她抱到桌边，打开那本大字典，又递给她纸笔。蒂娜一本正经地涂涂写写，不时翻过一页，还用胖胖的小手指顺着纸面往下划，仿佛真在查字。乔差一点笑出声，暴露了自己。巴尔先生站在旁边，慈爱地抚摸那头漂亮的头发。乔见了，还以为蒂娜一定是他的女儿，虽然她更像法国孩子，并不像德国孩子。
        - id: ch01-b20
          speaker: narrator
          text: 又有人敲门，两位年轻小姐走进来。乔赶紧退回去做针线，任凭隔壁怎样吵闹，她都规规矩矩地坐着。一个姑娘总在假笑，还娇滴滴地叫着教授。另一个说德语的口音糟得很，教授听了，大概很难不板起脸。
        - id: ch01-b21
          speaker: professor_bhaer
          text: 不，不，不是这样。你根本没留心我说的话。哎呀，今天什么都不顺！
        - id: ch01-b22
          speaker: narrator
          text: 乔听见一声重响，像是教授拿书拍了桌子。两个姑娘终于走后，她又偷看了一回，想知道这个可怜人还撑不撑得住。他累得靠在椅背上，闭眼坐到钟敲两点，才猛地起身，把书塞进口袋，准备赶下一堂课。蒂娜已经睡在沙发上，他便抱起她，悄悄走了。乔猜想，他的日子一定过得很辛苦。
        - id: ch01-b23
          speaker: jo
          text: 柯克太太问我要不要下楼吃五点钟的正餐。我正有一点想家，就决定去看看同住一个屋檐下的都是些什么人。我把自己收拾体面，想躲在她身后溜进去。偏偏她矮我高，根本藏不住。等脸不再发烫，我才敢抬头四处看。长桌边坐得满满的，人人只顾着吃，尤其是男士们，简直在跟时间赛跑。他们不论哪一层意思都算得上狼吞虎咽，吃完便消失了。
        - id: ch01-b24
          speaker: jo
          text: 桌边照例有只顾自己的年轻男子，只顾彼此的年轻情侣，一心想着孩子的太太，还有满脑子政治的老先生。除了一个面容温柔的单身女士，我大概不想跟谁多来往。她看起来像个心里很有东西的人。巴尔教授却被撇在桌子最末端，一边大声回答身旁那位好奇又耳聋的老先生，一边跟另一边的法国人谈哲学。
        - id: ch01-b25
          speaker: jo
          text: 艾米若在这里，一定从此不理他了。说来遗憾，他胃口大得惊人，吃饭像拿铲子往嘴里送，足以吓坏她那位小姐。我可不介意。汉娜说过，她爱看人吃得香，我也一样。可怜的教授教了一整天笨学生，当然得多吃一点。
        - id: ch01-b26
          speaker: narrator
          text: 饭后，乔上楼时，两个年轻男子正在门厅镜子前摆弄帽子。一个人压低声音问起新来的姑娘。
        - id: ch01-b27
          speaker: young_man_1
          text: 她是什么人？
        - id: ch01-b28
          speaker: young_man_2
          text: 家庭教师吧，或者差不多的身份。
        - id: ch01-b29
          speaker: young_man_1
          text: 见鬼，那她凭什么到咱们桌上吃饭？
        - id: ch01-b30
          speaker: young_man_2
          text: 她是老太太的朋友。脑袋长得漂亮，可一点派头都没有。
        - id: ch01-b31
          speaker: young_man_1
          text: 半点儿也没有。借个火，走吧。
        - id: ch01-b32
          speaker: jo
          text: 我起先很生气，后来又觉得不值得。家庭教师跟店员一样体面。我没有派头，却有头脑。从那两个衣冠楚楚的家伙说的话来看，我有的这一样，他们未必有。他们咔嗒咔嗒地走远了，喷出的烟活像坏烟囱。我讨厌庸俗的人！
    - id: ch02
      title: 星期四与星期六
      blocks:
        - id: ch02-b01
          speaker: jo
          text: 星期四。昨天很平静。我教书、做针线，又在那间有灯有火的小屋里写东西，过得十分舒服。我还听来几件零碎消息，也正式见到了教授。原来蒂娜是洗衣房里那位法国熨衣妇的女儿。小家伙的一颗心全给了巴尔先生。只要他在家，她便像小狗一样跟在后面。他虽是个单身汉，却特别喜欢孩子，见蒂娜这样黏他，高兴得很。
        - id: ch02-b02
          speaker: jo
          text: 凯蒂和明妮也爱戴他，总有说不完的故事，什么他编的游戏、带来的礼物，还有那些精彩的童话。年轻男子们却拿他打趣，叫他老弗里茨、拉格啤酒、大熊星，还用他的姓编出各种笑话。柯克太太说，教授像个男孩子似的跟着乐，脾气又好，所以尽管一身外国做派，人人还是喜欢他。
        - id: ch02-b03
          speaker: jo
          text: 那位单身女士是诺顿小姐。她富有、有教养，又很和善。今天吃饭时，她请我去房里坐坐。对，我又去大桌吃饭了，因为看人实在有趣。她有好书好画，也认识不少有意思的人。我准备好好跟她来往，因为我确实想进上流社会，只是我想要的不是艾米喜欢的那一种。
        - id: ch02-b04
          speaker: narrator
          text: 前一晚，乔待在客厅里，巴尔先生拿着几份报纸来找柯克太太。女主人不在，明妮却像个小老太太一样，很得体地替他们介绍。
        - id: ch02-b05
          speaker: minnie
          text: 这位是妈妈的朋友，马奇小姐。
        - id: ch02-b06
          speaker: kitty
          text: 对，她可好玩啦，我们特别喜欢她！
          emotion: happy
        - id: ch02-b07
          speaker: narrator
          text: 乔和教授先彼此鞠躬，接着一起笑了。一本正经的介绍后面，忽然跟上这么直截了当的一句，实在很滑稽。
        - id: ch02-b08
          speaker: professor_bhaer
          text: 我听说这两个淘气鬼常来烦你，马奇小姐。下次她们再胡闹，只管叫我，我马上就来。
        - id: ch02-b09
          speaker: narrator
          text: 教授故意皱起眉头，装出吓人的模样，两个小坏蛋反倒开心极了。乔答应下来，他便告辞。可乔似乎注定要不断碰见他。第二天，她出门经过教授的房间，雨伞无意间撞上房门，门一下开了。教授穿着晨衣，一只手套着蓝色大袜子，另一只手捏着织补针。他一点也不难为情。乔解释一句，匆忙要走，他却把那只套着袜子的手也挥了起来。
        - id: ch02-b10
          speaker: professor_bhaer
          text: 今天天气很好，最适合散步。祝你一路愉快，小姐。
        - id: ch02-b11
          speaker: jo
          text: 我笑了一路，可想到那个可怜人得亲手缝补衣袜，又有一点心酸。德国绅士会刺绣，这我知道。补袜子却完全是另一回事，也远没有那么好看。
        - id: ch02-b12
          speaker: jo
          text: 星期六。没发生什么值得写的事，只有去诺顿小姐房里拜访了一回。她那里摆满漂亮东西，她也亲切得迷人，把珍藏一样样拿给我看。她还问我，如果喜欢讲座和音乐会，愿不愿意偶尔陪她去，给她作伴。她把这事说得像在请我帮忙，可我敢肯定，柯克太太告诉过她我家的情形，她只是想照顾我。我像路西法一样骄傲，不过这样的人给我的这份好意并不沉重，所以我感激地接受了。
        - id: ch02-b13
          speaker: narrator
          text: 乔回到儿童室，听见客厅里闹得天翻地覆，便探头看了一眼。巴尔先生四肢着地趴在地上，蒂娜骑在他背上，凯蒂拿跳绳牵着他。明妮在给两个小男孩喂籽糕，男孩们关在椅子搭成的笼子里，又吼又蹦。
        - id: ch02-b14
          speaker: kitty
          text: 我们在玩动物园。
        - id: ch02-b15
          speaker: tina
          text: 介是我的大笨象！
          emotion: happy
        - id: ch02-b16
          speaker: minnie
          text: 弗朗茨和埃米尔来的时候，妈妈每个星期六下午都让我们想怎么玩就怎么玩。对不对，巴尔先生？
        - id: ch02-b17
          speaker: narrator
          text: 那头大笨象坐了起来，神情跟孩子们一样认真。
        - id: ch02-b18
          speaker: professor_bhaer
          text: 我向你保证，她说得没错。要是我们闹得太响，你就对我们说一声嘘，我们马上轻一点。
        - id: ch02-b19
          speaker: jo
          text: 我答应了，可没舍得关门。这样的疯玩，我从来没见过，自己也看得津津有味。他们一会儿捉人，一会儿打仗，又唱又跳。天慢慢黑下来，孩子们全挤到教授身边的沙发上，听他讲烟囱顶上的鹳鸟，还有那些骑着雪花飘落的小精灵。美国人要是也能像德国人这么单纯自然，该多好，你们说呢？
        - id: ch02-b20
          speaker: jo
          text: 我太爱写信，要不是还得省钱，真能这样一直写下去。纸已经够薄，字也写得够小了，可一想到长信要贴多少邮票，我还是心惊胆战。艾米的信只要一时用不着，就赶快转给我吧。看过她那些辉煌见闻，我的琐碎消息一定很平淡，可我知道你们会喜欢。特迪是不是用功得连朋友也没时间写信？贝思，替我照看好他，把两个宝宝的事全告诉我，也替我给每个人送上一大堆爱。你们忠实的乔。
        - id: ch02-b21
          speaker: jo
          text: 又及。我把信重读一遍，发现巴尔的分量未免太重了。不过我一向喜欢古怪的人，眼下又实在没有别的可写。愿上帝保佑你们！
    - id: ch03
      title: 十二月
      blocks:
        - id: ch03-b01
          speaker: jo
          text: 我最珍爱的贝茜，这封信注定要写得东拉西扯，所以就寄给你吧。它也许能逗你开心，让你知道我最近怎样过日子。生活虽安静，却颇有趣味，真该欢呼一声。经过艾米所谓赫库兰尼姆式的艰苦努力，也就是把心智和品德的土壤好好耕了一遍，我教的嫩芽总算冒头，那些小树枝也渐渐肯照我的心意弯曲了。
        - id: ch03-b02
          speaker: jo
          text: 两个小姑娘没有蒂娜和男孩们那么叫我着迷，不过我认真教她们，她们也很喜欢我。弗朗茨和埃米尔都是快活的小伙子，跟我特别投缘。德国性情和美国精神混在他们身上，时时刻刻都在冒气泡。星期六下午总要闹翻天。天气好时，我们便排着队出去散步，像一所小学校，由教授和我负责维持秩序。那才叫好玩。
        - id: ch03-b03
          speaker: jo
          text: 我和教授现在成了很好的朋友，也开始跟他上课。这事我实在忍不住，而且来由滑稽得很，非讲给你听不可。一天，我经过教授的房间，柯克太太正在里面翻箱倒柜，便把我叫了进去。
        - id: ch03-b04
          speaker: mrs_kirke
          text: 亲爱的，你见过这么乱的窝吗？快来帮我把书收拾好。我为了找那六条新手帕，已经把这里翻了个底朝天。不久前才给他的，他究竟弄到哪里去了？
        - id: ch03-b05
          speaker: jo
          text: 我进去帮忙，也趁机打量四周。那里的确是个乱窝。书和纸扔得到处都是，壁炉架上摆着摔破的海泡石烟斗，还有一支像是不用了的旧长笛。一只没了尾巴、羽毛破烂的鸟儿在一边窗台啾啾叫，另一边摆着一箱白老鼠。没做完的小船和一截截细绳混在手稿里，几双脏小靴子立在火前烘。教授为了那两个心爱的男孩，简直肯把自己当奴隶使唤，房间里到处都有他们留下的痕迹。
        - id: ch03-b06
          speaker: narrator
          text: 两人彻底翻找一番，总算找回三条手帕。一条盖在鸟笼上，一条染满墨水，第三条被拿来隔热，已经烤成焦褐色。柯克太太笑着把这些残骸扔进破布袋。
        - id: ch03-b07
          speaker: mrs_kirke
          text: 这个人真叫人没办法！其余三条大概已经给撕开，用去装饰小船、包扎划破的手指，或者当了风筝尾巴。实在不像话，可我就是骂不出口。他又糊涂又随和，任由两个孩子骑在头上。我答应替他洗洗补补，可他总忘记把东西拿出来，我也总忘记检查，结果他有时便落得很可怜。
        - id: ch03-b08
          speaker: jo
          text: 让我替他补吧。我不嫌麻烦，也不用告诉他。他总帮我带信，又借书给我，对我那么好，我愿意做。
        - id: ch03-b09
          speaker: jo
          text: 后来我把他的东西一一收拾妥当，还给两双袜子重新织了后跟。他那些古怪的针脚早把袜子补得走了形。谁也没提这件事，我还希望他永远不会发现，偏偏上星期被他撞见了。我听他给别人上课，越听越觉得有意思，也动了学德语的念头。蒂娜老是跑进跑出，把门敞着，我正好能听见。
        - id: ch03-b10
          speaker: jo
          text: 那天我坐在门边，一面缝最后一只袜子，一面努力听懂他给新学生讲的话。那个姑娘跟我一样笨。学生走后，屋里安静下来，我以为教授也出去了，便前后摇晃着，煞有介事地叽里咕噜念一个动词，模样准荒唐透顶。忽然一声轻笑让我抬起头。巴尔先生正在看我笑，还朝蒂娜打手势，不许她泄露他的行踪。
        - id: ch03-b11
          speaker: professor_bhaer
          text: 原来是这样！你偷看我，我也偷看你，这倒公平。不过现在我不开玩笑。你想学德语吗？
        - id: ch03-b12
          speaker: jo
          text: 我当然想学，可您太忙了。我又这么笨，恐怕学不会。
        - id: ch03-b13
          speaker: professor_bhaer
          text: 胡说！时间总能挤出来，聪明也不会找不到。晚上我很乐意给你上一小课。你瞧，马奇小姐，我欠了这份情，必须还。那些好心的女士准会彼此说，那个糊涂老家伙什么也看不见。他发现不了袜跟不再露洞，纽扣掉了还会以为又自己长了出来，带子系好以后，也会相信它们自己打了结。可是我有眼睛，看得见许多事。我也有一颗心，知道该感谢。来吧，现在就上一小课。不然，好仙女们以后不准再替我和孩子们施魔法了。
        - id: ch03-b14
          speaker: jo
          text: 他说到这个份上，我当然再也推辞不了。机会又确实很好，我们便谈妥了。我上过四堂课，随后一头栽进语法泥潭，再也爬不出来。教授耐心得不得了，可教我一定跟受刑一样。他有时望着我，脸上带着温和的绝望，弄得我不知道该哭还是该笑。两样我都试了。等我开始抽鼻子，又羞得恨不能消失，他忽然把语法书扔到地上，大步走了出去。
        - id: ch03-b15
          speaker: jo
          text: 我觉得自己丢尽了脸，也永远被他抛弃了，可我一点不怪他。我胡乱收拾纸张，正准备冲上楼狠狠摇醒自己，他又走进来，脚步轻快，满脸笑容，好像我刚刚立了大功。
        - id: ch03-b16
          speaker: professor_bhaer
          text: 现在换个办法。你和我一起读这些有趣的小童话。我们不再到那本枯燥的书里挖呀挖了，它只会惹麻烦，就该扔到墙角去。
        - id: ch03-b17
          speaker: jo
          text: 他那么和气，又把安徒生童话摊在面前，摆得叫人忍不住想读，我反而更惭愧了。我豁出命似的扑向功课，把他逗得开心极了。难为情也顾不上，我只管拼命苦干。长单词把我绊得东倒西歪，发音全靠当时的灵感，可我的确使出了所有力气。读完第一页，我停下来喘气。
        - id: ch03-b18
          speaker: professor_bhaer
          text: 读得好！这回走对路了！现在轮到我。我用德语读，你把耳朵借给我。
          emotion: happy
        - id: ch03-b19
          speaker: jo
          text: 他用那副雄浑的嗓音一路读下去，每个字都兴味十足，叫人又爱听又爱看。幸好读的是有趣的《坚定的锡兵》，所以我虽然一半也没听懂，仍旧笑个不停。他太认真，我太兴奋，整件事又太滑稽，实在忍不住。
        - id: ch03-b20
          speaker: jo
          text: 从那以后，功课便顺利多了。现在我已经读得不错，因为这种学法很适合我。语法藏进故事和诗歌，就像药丸裹在果冻里，吞下去也不觉得苦。我很喜欢，他似乎也还没厌倦，真是太好了，对不对？圣诞节我想送他一样东西，因为我不敢付学费。妈妈，替我想个好主意吧。
        - id: ch03-b21
          speaker: jo
          text: 听说劳里又快乐又忙，已经不抽烟，也肯把头发留长，我很高兴。贝思，你看，你比我更会管他。我一点也不嫉妒，只管尽力吧。不过别把他变成圣人。他要是少了那么一点属于人的顽皮，我怕自己反倒不喜欢。把我的信挑几段念给他听吧。我没时间再写一封，这样也一样。感谢上帝，贝思一直还算舒服。
    - id: ch04
      title: 一月
      blocks:
        - id: ch04-b01
          speaker: jo
          text: 祝我最亲爱的一家人新年快乐！这里当然包括L先生，还有一位名叫特迪的年轻人。我真说不出收到圣诞包裹时有多开心。包裹直到晚上才送到，那时我已经不抱希望。你们的信早晨便来了，却一个字也没提包裹，原来想给我惊喜。我反而失望得很，因为心里一直有种感觉，觉得你们不会忘记我。
        - id: ch04-b02
          speaker: jo
          text: 喝过茶，我独自坐在楼上，情绪正低落，忽然有人送来一个又大、又沾满泥、又磕得破破烂烂的包裹。我一下抱住它，欢蹦乱跳起来。家里的气息扑面而来，整个人都精神了。我索性坐在地板上，一会儿读，一会儿看，一会儿吃，又笑又哭，还是老样子，荒唐得很。每件东西都正是我想要的，而且全是亲手做的，不是花钱买的，所以更加可爱。
        - id: ch04-b03
          speaker: jo
          text: 贝思的新墨水围兜好极了，汉娜那盒硬姜饼也会被我当成宝贝。妈妈，我一定穿您寄来的漂亮法兰绒衣裳，也会认真读父亲标记过的书。谢谢大家，一千次、一万次地谢谢！
        - id: ch04-b04
          speaker: jo
          text: 说起书，我在这方面也快变成富人了。元旦那天，巴尔先生送我一套精美的莎士比亚全集。他十分珍爱这套书，我也常常羡慕地望着。它原本跟他的德文《圣经》、柏拉图、荷马和弥尔顿一起，摆在最尊贵的位置。他把没有护封的书取下来，翻给我看。里面写着我的名字，下面还有一行字，友人弗里德里希·巴尔赠。你们可以想象我当时有多惊喜。
        - id: ch04-b05
          speaker: professor_bhaer
          text: 你常说希望有一座图书馆。现在我送你一座。两片封皮里面，许多本书合在一起。好好读，它会给你很大帮助。书里研究人的性情，你学会了，便能在世上读懂人，也能用自己的笔把人描画出来。
        - id: ch04-b06
          speaker: jo
          text: 我尽力谢了他。如今我说起我的图书馆，口气仿佛真有一百本书。从前我不知道莎士比亚里面藏着这么多东西，可从前也没有一个巴尔替我讲解。好了，不许笑他那个难听的姓。它既不念熊，也不念啤酒，虽然人们总这样叫。真正的音介于两者之间，只有德国人才发得出来。
        - id: ch04-b07
          speaker: jo
          text: 你们俩都喜欢我讲他的事，我很高兴，也希望有一天你们能认识他。妈妈一定会欣赏他温暖的心，父亲会欣赏他聪明的头脑。两样我都欣赏。有了这位新朋友弗里德里希·巴尔，我觉得自己富有极了。
        - id: ch04-b08
          speaker: jo
          text: 我钱不多，也不知道他喜欢什么，便买了几样小东西，分开放在房间各处，让他自己意外发现。有些实用，有些漂亮，有些好玩。桌上放一套新墨水用具，又准备一只插花的小花瓶。他总要养一朵花，或者在玻璃杯里插一枝绿叶，说这样能让自己保持清新。我还做了一个火钳套，免得他再烧坏艾米所谓的手帕。
        - id: ch04-b09
          speaker: jo
          text: 我照贝思想出的样式，把火钳套做成一只大蝴蝶。身子胖乎乎，翅膀一黑一黄，触须用毛线，眼睛用珠子。他喜欢得不得了，还把它摆上壁炉架，当作一件美德的证明。这样看来，我的礼物终究还是失败了。他虽然穷，却没忘记屋里任何一个佣人或孩子。屋里从那位法国洗衣妇到诺顿小姐，也没有一个人忘记他。这件事真叫我高兴。
        - id: ch04-b10
          speaker: jo
          text: 除夕夜，大家办了一场化装舞会，痛痛快快玩了一晚。我本来没有衣裳，不准备下楼。到了最后一刻，柯克太太忽然想起几件旧锦缎衣服，诺顿小姐又借我花边和羽毛。我便扮成马拉普罗普太太，戴着面具，气派十足地走进去。我故意改变声音，谁也没认出我。
        - id: ch04-b11
          speaker: jo
          text: 大家都以为马奇小姐又沉默又傲慢。他们多半觉得我刻板冷淡，对那些乳臭未干的小子，我也的确如此。所以没人猜到我会跳舞，会乔装，还能忽然来上一段漂亮的墓志铭错乱，像尼罗河岸边的一则寓言。我玩得痛快极了。摘下面具以后，看大家瞪着我，更是好玩。
        - id: ch04-b12
          speaker: young_man_1
          text: 我早知道她演过戏。我还记得在一家小剧院见过她呢。
        - id: ch04-b13
          speaker: jo
          text: 梅格一定会喜欢这个笑话。巴尔先生扮的是尼克·波顿，蒂娜扮作泰坦妮娅，待在他怀里，活脱脱一个小仙女。用特迪的话说，看他们跳舞简直是一幅风景。
        - id: ch04-b14
          speaker: jo
          text: 到头来，我的新年过得非常快乐。回到房里仔细想想，我觉得自己尽管失败过许多次，终究还是有了一点长进。我现在总是很快活，做事也肯下功夫，而且比从前更关心别人。这实在叫人满意。愿上帝保佑大家！永远爱你们的……乔。
