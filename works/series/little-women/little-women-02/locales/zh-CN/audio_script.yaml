audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机智，像在炉边从容讲述旧日家事
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情绪来得快，带一点男孩子气
        timbre: 明亮略带沙哑
        pace: 偏快
        pitch: 中低
    meg:
      display_name: 梅格
      tts:
        delivery: 温柔端庄，常带大姐姐式的认真
        timbre: 柔和圆润
        pace: 适中
        pitch: 中
    beth:
      display_name: 贝丝
      tts:
        delivery: 羞怯安静，话语真诚而体贴
        timbre: 轻柔温暖
        pace: 稍慢
        pitch: 中高
    amy:
      display_name: 艾米
      tts:
        delivery: 一本正经又有些自负，努力显得优雅
        timbre: 清脆稚嫩
        pace: 适中
        pitch: 偏高
    mrs_march:
      display_name: 马奇太太
      tts:
        delivery: 慈爱爽朗，沉稳中带着鼓励
        timbre: 饱满温暖
        pace: 从容
        pitch: 中低
    hannah:
      display_name: 汉娜
      tts:
        delivery: 朴实爽快，带着操持家务多年的亲昵
        timbre: 粗朴温厚
        pace: 适中
        pitch: 中低
    mrs_hummel:
      display_name: 胡默尔太太
      tts:
        delivery: 虚弱而感激，英语带着不熟练的停顿
        timbre: 疲惫柔弱
        pace: 稍慢
        pitch: 中
    girl_guest:
      display_name: 女客人
      tts:
        delivery: 好奇健谈，像聚会中自然接话的少女
        timbre: 清亮
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 枕下的小书
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 圣诞节清早，天还灰蒙蒙的，乔先醒了。壁炉边一只长袜也没有，她心里猛地一沉，好像又回到小时候。那时她的小袜子装满好东西，重得掉了下来。
        - id: ch01-b02
          speaker: narrator
          text: 可她马上想起妈妈答应过的礼物。手伸到枕下，摸出一本深红封皮的小书。这个故事她很熟，它讲的是世间最高尚的一生。乔觉得，朝圣者要走很长的路，这本书正好为他指路。
        - id: ch01-b03
          speaker: jo
          text: “圣诞快乐！梅格，快看看你的枕头下面。”
        - id: ch01-b04
          speaker: narrator
          text: 梅格找到一本绿色封皮的书。里面有同样的图画，还有妈妈亲手写的几句话。礼物虽然只有这一件，姐妹俩却觉得珍贵极了。不一会儿，贝丝和艾米也醒来，在自己的枕头底下摸索。一个找到鸽羽色的书，一个找到蓝色的书。四姐妹捧着各自的小书围坐在一起，一会儿低头翻看，一会儿互相谈论。就在她们说话的时候，东方的天色一点点染成了玫瑰红，新的一天就要来了。
        - id: ch01-b05
          speaker: narrator
          text: 梅格偶尔有些小虚荣，心地却温柔又虔诚。她自己不知道，她总在影响几个妹妹，尤其是乔。乔很爱她，而她劝人从不生硬，所以乔愿意听。
        - id: ch01-b06
          speaker: meg
          text: “姑娘们，妈妈希望我们不只读这些书，还要喜爱它，照着里面的话去做。那就从今天开始吧。以前我们天天读，后来爸爸走了，战争又闹得人心不安，我们把许多该做的事都放下了。你们可以自己决定。我要把书放在桌上，每天醒来先读一点。我知道，它会帮我把这一天过好。”
        - id: ch01-b07
          speaker: narrator
          text: 梅格翻开书。乔搂着她，和她脸贴着脸一起读。那张平时总显得躁动的脸，这会儿安安静静的。
        - id: ch01-b08
          speaker: beth
          text: “梅格真好。艾米，我们也学她们吧。难认的字我帮你，有什么不懂的，再请姐姐们讲给我们听。”
        - id: ch01-b09
          speaker: narrator
          text: 精致的小书和姐姐们的样子，让贝丝很受触动。
        - id: ch01-b10
          speaker: amy
          text: “我的这本是蓝色的，真好。”
        - id: ch01-b11
          speaker: narrator
          text: 房间静了下来，只剩书页翻动的轻响。冬日阳光慢慢爬进屋，照在明亮的头发和认真的脸上，仿佛也在向她们祝贺圣诞。
        - id: ch01-b12
          speaker: meg
          text: “妈妈去哪儿了？”
        - id: ch01-b13
          speaker: narrator
          text: 半个钟头以后，梅格和乔跑下楼，想向妈妈道谢，却没见到她。
        - id: ch01-b14
          speaker: hannah
          text: “谁知道呢。刚才有个穷苦人来讨东西，你们妈妈马上跟着去了，要看看人家到底缺什么。吃的、喝的、衣裳、柴火，只要能送，她什么都舍得。”
        - id: ch01-b15
          speaker: narrator
          text: 汉娜从梅格出生起就在这个家。大家从不把她只当仆人，她更像家里的一位老朋友。
        - id: ch01-b16
          speaker: meg
          text: “妈妈应该很快回来。我们先煎好薄饼，把东西都准备齐。”
        - id: ch01-b17
          speaker: narrator
          text: 礼物已经收在一只篮子里，藏在沙发下面，只等合适的时候端出来。梅格数了数，却少了一样。
        - id: ch01-b18
          speaker: meg
          text: “艾米那瓶古龙水呢？”
        - id: ch01-b19
          speaker: jo
          text: “她刚拿走。也许要给瓶子系缎带，又或者想出了别的花样。”
        - id: ch01-b20
          speaker: narrator
          text: 乔穿着崭新的军用拖鞋满屋跳，想把僵硬的鞋子活动开。
        - id: ch01-b21
          speaker: beth
          text: “我的手帕看起来不错吧？汉娜替我洗好熨好，字都是我亲手绣的。”
        - id: ch01-b22
          speaker: narrator
          text: 贝丝望着那些不大整齐的字母，很是自豪。为了绣它们，她可吃了不少苦头。
        - id: ch01-b23
          speaker: jo
          text: “哎呀，你绣的不是‘M·马奇’，而是‘妈妈’。这可真有意思！”
        - id: ch01-b24
          speaker: beth
          text: “这样不对吗？梅格的姓名开头也是两个M。我只想让妈妈用这些手帕，不想让别人拿错。”
        - id: ch01-b25
          speaker: meg
          text: “当然对，亲爱的。这个心思又可爱又聪明。现在谁也不会认错，妈妈肯定会喜欢。”
        - id: ch01-b26
          speaker: narrator
          text: 梅格先皱眉瞪了乔一眼，再给贝丝一个安慰的笑。就在这时，门砰地关上，走廊里传来脚步。
        - id: ch01-b27
          speaker: jo
          text: “妈妈回来了！快藏好篮子！”
        - id: ch01-b28
          speaker: narrator
          text: 进来的却是艾米。她匆匆忙忙，一见姐姐们都在等，立刻有些不好意思。她戴着兜帽，披着斗篷，显然一早出过门。这对于一向不爱早起的艾米，可不寻常。
        - id: ch01-b29
          speaker: meg
          text: “你上哪儿去了？背后藏的是什么？”
        - id: ch01-b30
          speaker: amy
          text: “乔，你不许笑。我本想等送礼物时再让你们知道。我把小瓶换成了大瓶，把所有的钱都花了。我是真的想改掉自私的毛病。”
        - id: ch01-b31
          speaker: narrator
          text: 她拿出一只漂亮的大瓶子，原来那只便宜的小瓶已经被换掉了。为了少想自己，她认真地作了这点努力，模样又谦逊又诚恳。梅格看了，立刻把她抱进怀里。乔郑重宣布，艾米真够朋友。贝丝也跑到窗边，从自己的花里挑出开得最好的一朵玫瑰，插在那只气派的大瓶子上。
        - id: ch01-b32
          speaker: amy
          text: “早上读了书，又说要变好，我越想越觉得原来的礼物太寒酸。所以刚起床就去街角换了。现在我的礼物最好看，我真高兴。”
    - id: ch02
      title: 天使一样的孩子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 临街的门又响了一声。篮子赶紧回到沙发底下，姑娘们也赶紧围到桌边，盼着开饭。
        - id: ch02-b02
          speaker: jo
          text: “妈妈，圣诞快乐！以后每个圣诞节都要快乐！谢谢您送的书。”
        - id: ch02-b03
          speaker: meg
          text: “我们已经读过一些了，往后每天都会读。”
        - id: ch02-b04
          speaker: narrator
          text: 姐妹们七嘴八舌，一起把话说了出来。
        - id: ch02-b05
          speaker: mrs_march
          text: “圣诞快乐，我的小女儿们。我很高兴你们马上开始读，也希望你们坚持下去。不过开饭前，我要先告诉你们一件事。附近有个穷苦女人，刚生下小宝宝。六个孩子挤在一张床上取暖，家里没有火，也没有吃的。最大的男孩来告诉我，他们又冷又饿。姑娘们，你们愿意把早餐送给他们，作一份圣诞礼物吗？”
        - id: ch02-b06
          speaker: narrator
          text: 她们多等了差不多一个钟头，早就饿坏了。桌边安静了一瞬，也真的只有一瞬。
        - id: ch02-b07
          speaker: jo
          text: “幸好您赶在我们动筷以前回来了！”
          emotion: happy
        - id: ch02-b08
          speaker: beth
          text: “我能一起去吗？我想帮忙把东西拿给那些可怜的小孩子。”
        - id: ch02-b09
          speaker: amy
          text: “我来拿奶油和松饼。”
        - id: ch02-b10
          speaker: narrator
          text: 艾米最爱吃这两样，这一回却勇敢地舍了出去。梅格已经盖好荞麦饼，又把面包高高堆进一个大盘子。
        - id: ch02-b11
          speaker: mrs_march
          text: “我就知道你们会愿意。大家都跟我去，一起帮忙。回来以后，早餐只吃面包、喝牛奶，晚餐再补给你们。”
        - id: ch02-b12
          speaker: narrator
          text: 她们很快准备好，各自抱着盘子、篮子和要用的东西，排成一支队伍出门。天还早，她们特意挑僻静的后街走。一路上，只有很少几个人看见这支古怪的队伍，因此也没人停下来笑话她们。
        - id: ch02-b13
          speaker: narrator
          text: 胡默尔家的屋子又空又穷。破窗漏着冷风，炉子里没有火，床单被褥全是破的。母亲病倒了，小婴儿不停啼哭。六个脸色苍白的孩子缩在一条旧被子底下，紧紧挨着，只想多留住一点暖意。
        - id: ch02-b14
          speaker: narrator
          text: 姑娘们进门时，孩子们睁大眼睛看着她们，冻得发青的嘴唇也笑了。
        - id: ch02-b15
          speaker: mrs_hummel
          text: “啊，我的上帝！是善良的天使来帮助我们了！”
          emotion: happy
        - id: ch02-b16
          speaker: narrator
          text: 那位可怜的母亲高兴得哭起来。
        - id: ch02-b17
          speaker: jo
          text: “这些天使还戴着兜帽和手套呢，样子可真有趣。”
        - id: ch02-b18
          speaker: narrator
          text: 屋里的人全笑了。没过几分钟，这地方真像有善良的精灵忙过一场。汉娜带来木柴，升起炉火，再用旧帽子和自己的斗篷堵住破窗。
        - id: ch02-b19
          speaker: narrator
          text: 马奇太太喂病中的母亲喝热茶和稀粥，答应继续帮她，又替小婴儿穿好衣服，动作轻柔得像在照料自己的孩子。四姐妹摆好桌子，让孩子们坐到火边，一口口喂饱他们，就像在喂一群饥饿的小鸟。她们边说边笑，还努力听懂那些断断续续的英语。
        - id: ch02-b20
          speaker: mrs_hummel
          text: “真好吃！你们都是天使一样的孩子！”
        - id: ch02-b21
          speaker: narrator
          text: 孩子们一边吃，一边把发紫的小手伸向火焰。四姐妹从没被人叫过天使，都觉得这称呼好听极了。乔尤其满意，因为她从小就被人当成一个“桑丘”。
        - id: ch02-b22
          speaker: narrator
          text: 她们一口也没吃，这顿早餐却快活得很。离开时，屋里已经有了火、有了食物，也有了安慰。整座城里，恐怕再找不到四个比她们更高兴的人。她们把早餐送给别人，自己在圣诞早晨只吃面包、喝牛奶，心里却很满足。
    - id: ch03
      title: 给妈妈的圣诞礼物
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 马奇太太上楼为胡默尔一家收拾衣物，姑娘们便把礼物摆出来。
        - id: ch03-b02
          speaker: meg
          text: “这就叫爱邻人胜过爱自己。我很喜欢这样做。”
        - id: ch03-b03
          speaker: narrator
          text: 几只小包裹并不华贵，里面却装着许多爱。桌子中间摆着高花瓶，红玫瑰、白菊花和垂下来的藤叶插在一起，立刻把一切衬得优雅起来。
        - id: ch03-b04
          speaker: jo
          text: “她来了！贝丝，快奏乐！艾米去开门！大家为妈妈欢呼三声！”
        - id: ch03-b05
          speaker: narrator
          text: 乔满屋蹦跳，梅格郑重地把妈妈领到上座。贝丝弹起最欢快的进行曲，艾米猛地拉开门。马奇太太没有料到这一幕，感动得眼里含着泪，仍笑着一件件看礼物，也读完了每张小纸条。
        - id: ch03-b06
          speaker: narrator
          text: 新拖鞋马上穿到脚上。新手帕洒满艾米的古龙水，放进衣袋。贝丝的玫瑰别在胸前，梅格送的手套一戴，大小也正合适。大家围着妈妈，又笑又亲，还抢着解释自己的礼物是怎么准备的。家里的节日并不靠排场。正是这些简单又亲爱的举动，让人当时觉得欢喜，过了很久再想起来，心里还是甜的。
        - id: ch03-b07
          speaker: narrator
          text: 接着，全家忙了起来。早上的善事和送礼花了很多时间，余下的一天都得留给晚上的演出。姑娘们还不能常去剧院，家里也没有钱布置豪华舞台，只好自己想办法做出需要的一切。
        - id: ch03-b08
          speaker: narrator
          text: 她们的手艺很有意思。吉他用硬纸板做，老式牛油船外面包一层银纸，就变成古灯。旧棉布可以缝成华丽长袍，再钉上从腌菜厂找来的闪亮锡片。罐头瓶盖从整张锡板上裁走以后，留下许多菱形的边角料。姑娘们把这些也利用起来，一片片贴到铠甲上。楼上的大房间，就这样成了她们常常作乐的舞台。
        - id: ch03-b09
          speaker: narrator
          text: 男士不许来看，所以乔可以尽情扮演男人。她最爱那双赤褐色皮靴，是一位朋友送的。那位朋友认识一位太太，那位太太又认识一名演员。这双靴子、一柄旧花剑，还有一件画家从前作画用过的开衩紧身上衣，是乔最珍贵的戏服，每次演出都少不了。
        - id: ch03-b10
          speaker: narrator
          text: 演员太少，两位主角每人都要扮好几个角色。她们背三四份台词，不断更换戏服，还得照管舞台，确实下了苦功。演戏锻炼记忆，又不会伤害谁，还填满了许多原本可能在无聊、寂寞或无益交游中溜走的时间。
    - id: ch04
      title: 一出歌剧式悲剧
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 圣诞夜，十来个姑娘挤在一张床上。那就是楼座。她们面对蓝黄相间的布幕，满心期待。幕后不时传出衣料的窸窣声、低低的说话声，还飘出一点灯烟。艾米太兴奋，偶尔会咯咯笑起来。终于铃声一响，幕布拉开，“歌剧式悲剧”开始了。
        - id: ch04-b02
          speaker: narrator
          text: 戏单上说，第一幕是一片阴森树林。几盆灌木就是树，地上的绿台呢就是草，远处还搭着山洞。晾衣架撑起洞顶，五斗橱围成洞壁，里面有个烧得正旺的小炉子。炉上摆着黑锅，老女巫正弯腰守着它。
        - id: ch04-b03
          speaker: narrator
          text: 舞台很暗，炉火照得气氛恰到好处。女巫一揭锅盖，壶里甚至冒出了真正的蒸汽。观众刚从第一阵战栗中缓过来，恶棍雨果便大步登场。他挂着哐啷作响的剑，戴宽边软帽和黑胡子，披神秘斗篷，脚下当然还是乔的宝贝皮靴。
        - id: ch04-b04
          speaker: narrator
          text: 雨果焦躁地走来走去，忽然拍着额头放声歌唱。他唱自己多么恨罗德里戈，多么爱扎拉，又多么愉快地决定杀掉一个、得到另一个。粗哑的嗓音很有威势，感情一上来，他还要大吼。刚停下换气，观众就鼓起掌来。
        - id: ch04-b05
          speaker: jo
          text: “喂，奴仆！快出来，我有事用你！”
        - id: ch04-b06
          speaker: narrator
          text: 扮演雨果的乔像个习惯喝彩的名演员，先欠身谢幕，再溜到山洞前发号施令。梅格扮的夏甲走出来，脸边垂着灰色马鬃毛，穿红黑长袍，手拿木杖，斗篷上尽是神秘符号。
        - id: ch04-b07
          speaker: narrator
          text: 雨果要两种药。一种让扎拉爱上他，一种杀死罗德里戈。夏甲唱着答应下来，接着召唤能带来爱情魔药的精灵。
        - id: ch04-b08
          speaker: meg
          text: “快来，快来，离开你的家。轻盈的精灵，听我召唤！玫瑰生下你，露珠喂养你，你可会调制魔法秘方？借仙灵的速度，把芬芳的药带来。让它香甜、迅捷又有力量。精灵啊，快回应我的歌！”
        - id: ch04-b09
          speaker: narrator
          text: 轻柔的音乐响起。洞后出现一个小精灵，白衣像云雾，翅膀闪着光，金发上戴着玫瑰花环。她挥动魔杖，也唱了起来。
        - id: ch04-b10
          speaker: beth
          text: “我从遥远的银月来，也从轻盈的家园来。拿去这道魔法，好好用它。要是用错，它的力量很快就会消失。”
        - id: ch04-b11
          speaker: narrator
          text: 精灵把镀金小瓶丢在女巫脚边，转眼不见。夏甲再唱一段咒语，这回砰的一声，出现的是丑陋的小黑魔鬼。它嘎声回答，把黑瓶扔给雨果，嘲笑着消失了。
        - id: ch04-b12
          speaker: narrator
          text: 雨果唱着道谢，把两瓶药塞进靴子，离开山洞。夏甲告诉观众，雨果过去杀了她几个朋友。她早已诅咒他，接下来还要破坏他的计划，为朋友报仇。幕布落下，观众趁休息吃糖，热烈议论这出戏。
        - id: ch04-b13
          speaker: narrator
          text: 幕后传来好一阵锤打声，观众等了很久。不过第二次开幕时，大家终于知道为什么，谁也不再抱怨。一座高塔从地面直顶天花板。塔身半腰开着一扇窗，里面点着一盏灯。白色窗帘后面，扎拉穿着漂亮的蓝银长裙，正在等候罗德里戈。
        - id: ch04-b14
          speaker: narrator
          text: 罗德里戈戴羽毛帽，披红斗篷，垂着栗色发卷，抱着吉他，也穿着那双皮靴。他跪在塔下唱小夜曲，扎拉用歌声回应。两人唱过一番对话，她答应跟他私奔。
        - id: ch04-b15
          speaker: narrator
          text: 这时，全戏最厉害的机关上场了。罗德里戈拿出一架只有五级的绳梯，把一头抛上高塔，请扎拉下来。她小心爬出窗口，手搭在他的肩上，正准备优雅地跳下去。偏偏她忘了长长的裙裾，裙子卡在窗上。塔先摇，再倾，最后轰然倒塌，把这对恋人埋在下面。
        - id: ch04-b16
          speaker: narrator
          text: 观众一齐尖叫。废墟里，那双赤褐色皮靴胡乱挥舞，一颗金发脑袋钻出来大喊。
        - id: ch04-b17
          speaker: amy
          text: “我早就说过！我早就说过！”
          emotion: angry
        - id: ch04-b18
          speaker: narrator
          text: 扮作残酷父亲的唐·佩德罗反应极快，冲上台把女儿拖出来，还赶紧在她耳边叮嘱。
        - id: ch04-b19
          speaker: meg
          text: “不许笑！就当一切本来就该这样！”
        - id: ch04-b20
          speaker: narrator
          text: 唐·佩德罗命令罗德里戈起来，再满怀愤怒和鄙夷，把他赶出王国。罗德里戈刚被高塔砸过，仍然大胆反抗，坚决不走。扎拉也受到鼓舞，跟父亲对抗。于是两人都被判进最深的地牢。一个矮墩墩的小侍从拿着锁链，把他们押走。她怕得厉害，还忘光了自己的台词。
        - id: ch04-b21
          speaker: narrator
          text: 第三幕来到城堡大厅。夏甲要救出恋人，也要收拾雨果。听见雨果靠近，她先藏好。雨果把药倒入两杯酒，叫胆小的仆人把酒送给牢里的囚犯，还要告诉他们，他很快就到。
        - id: ch04-b22
          speaker: narrator
          text: 仆人拉着雨果去一旁说话，夏甲立刻换上两杯无害的酒。费迪南多端走以后，她又把原先为罗德里戈准备的毒酒放回桌上。雨果唱了半天，口渴难忍，拿起来就喝。他马上失去神智，又抓又跺，挣扎许久，最后直挺挺倒地死去。夏甲用一首气势十足的歌，把自己的计策全告诉了他。
        - id: ch04-b23
          speaker: narrator
          text: 这一幕十分惊险，只是恶棍临死时，一大蓬红头发忽然掉下来，多少损伤了效果。观众仍把他叫到幕前。雨果很懂规矩，牵着夏甲一起谢幕。大家觉得，夏甲的歌声比整场演出的其他部分加起来还精彩。
        - id: ch04-b24
          speaker: narrator
          text: 第四幕里，罗德里戈听说扎拉抛弃了自己，绝望得要用匕首刺进心口。刀尖刚抵上去，窗外便传来歌声。有人告诉他，扎拉依旧忠贞，只是身陷危险，等他去救。一把钥匙被扔进来，牢门开了。罗德里戈欣喜若狂，扯断锁链，冲出去寻找心爱的姑娘。
        - id: ch04-b25
          speaker: narrator
          text: 第五幕一开场，扎拉和父亲正在争吵。唐·佩德罗要她进修道院，她坚决不答应。她苦苦哀求，眼看就要晕倒，罗德里戈突然冲进来，要她父亲把她嫁给自己。唐·佩德罗嫌他贫穷，断然拒绝。双方一边喊，一边拼命挥手，怎么也谈不拢。
        - id: ch04-b26
          speaker: narrator
          text: 罗德里戈正要抱走累坏的扎拉，胆小的仆人带着夏甲的信和钱袋来了。夏甲已经神秘失踪。信里说，她把无数财富留给年轻恋人。唐·佩德罗若不让他们幸福，就会遭到可怕的厄运。
        - id: ch04-b27
          speaker: narrator
          text: 钱袋一开，几夸脱锡钱洒满舞台，到处闪闪发光。严厉的父亲立刻心软，一句话也没多说便答应婚事。所有人唱起欢快的合唱。幕布落下时，恋人正以最浪漫的姿势跪着，接受唐·佩德罗的祝福。
        - id: ch04-b28
          speaker: narrator
          text: 雷鸣般的掌声刚响起来，忽然又停了。充当楼座的帆布床猛地折起，把所有观众都夹在里面。罗德里戈和唐·佩德罗飞奔去救。姑娘们全被拉出来，一个也没受伤，只是许多人笑得说不出话。
        - id: ch04-b29
          speaker: hannah
          text: “马奇太太向各位小姐问好，请小姐们下楼用晚餐。”
    - id: ch05
      title: 意外的盛宴
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 就连演员们也不知道还有晚餐。她们还带着戏里的胡子、眉毛和兴奋劲儿跑下楼，一看见餐桌，全都惊喜得说不出话，只能望望彼此。妈妈偶尔为她们准备一点小小的款待，这很像她平日的作风。可自从家里失去从前的富足，谁也没见过这么精美、这么丰盛的宴席。
        - id: ch05-b02
          speaker: narrator
          text: 桌上真的有冰激凌，而且有两盘，一盘粉红，一盘雪白。还有蛋糕、水果、叫人眼馋的法国糖果。正中间放着四大束温室鲜花。姑娘们几乎忘了呼吸，先看看桌子，再看看妈妈。马奇太太显然很享受她们惊讶的样子。
        - id: ch05-b03
          speaker: amy
          text: “是仙女送来的吗？”
        - id: ch05-b04
          speaker: beth
          text: “一定是圣诞老人。”
        - id: ch05-b05
          speaker: meg
          text: “是妈妈准备的。”
        - id: ch05-b06
          speaker: narrator
          text: 梅格虽然还挂着灰胡子和白眉毛，仍朝母亲露出了最甜美的笑。
        - id: ch05-b07
          speaker: jo
          text: “我知道了！准是马奇姑婆忽然心情大好，派人送来的晚餐。”
        - id: ch05-b08
          speaker: mrs_march
          text: “全都猜错了。这些东西是老劳伦斯先生送的。”
        - id: ch05-b09
          speaker: meg
          text: “是隔壁那个男孩的祖父？他怎么会想到送这些？我们根本不认识他呀！”
          emotion: surprised
        - id: ch05-b10
          speaker: mrs_march
          text: “汉娜把你们送早餐的事告诉了他家的一个仆人。他虽然是位古怪的老先生，听到这件事却很高兴。他从前认识我的父亲。下午，他写来一封很客气的短信，希望我允许他送几样小东西，借这个节日向我的女儿们表示友好。我没法拒绝。所以你们早上只吃面包和牛奶，晚上就用这顿小宴席补回来。”
        - id: ch05-b11
          speaker: narrator
          text: 姑娘们围着桌子坐下，盘子一个接一个传过去。粉红和雪白的冰激凌在她们的赞叹声里一点点融化，又一勺勺消失。屋里不时响起满足的“啊”和“哦”，人人都吃得高兴极了。
        - id: ch05-b12
          speaker: jo
          text: “我敢说，这一定是那个男孩的主意！他人好极了，我真想认识他。他看起来也愿意和我们说话，只是太害羞。可梅格规矩太多，每次路上遇见，都不许我开口。”
        - id: ch05-b13
          speaker: girl_guest
          text: “你说的是隔壁大房子里的人吧？我妈妈认识老劳伦斯先生。她说那位老先生很骄傲，不喜欢跟邻居来往。孙子不骑马、不跟家庭教师散步的时候，就被关在家里用功。我们请过他参加聚会，他也没来。妈妈说他其实很好，只是从不跟我们这些姑娘讲话。”
        - id: ch05-b14
          speaker: jo
          text: “有一次我家的猫跑丢了，是他送回来的。我们隔着篱笆谈得特别投机，聊板球，也聊别的。后来他一看见梅格走过来，转身就跑。总有一天我要认识他。他需要一点快活，我敢肯定。”
        - id: ch05-b15
          speaker: mrs_march
          text: “他举止很好，看着就是个小绅士。要是有合适的机会，我不反对你结识他。花是他亲自送来的。假如我能确定楼上没有闹出乱子，当时就请他进门了。他走的时候很羡慕，听着屋里的热闹，显然自己没有这样的乐趣。”
        - id: ch05-b16
          speaker: narrator
          text: 乔低头看看自己的皮靴，笑出了声。
        - id: ch05-b17
          speaker: jo
          text: “幸好您没请他进来，妈妈！不过我们以后可以再演一出给他看。也许他还肯帮着演，那才有意思呢。”
        - id: ch05-b18
          speaker: meg
          text: “我从来没有收过这么好的花束。真漂亮！”
          emotion: happy
        - id: ch05-b19
          speaker: narrator
          text: 梅格兴致勃勃地端详鲜花。马奇太太却低下头，闻了闻腰间那朵已经半枯的玫瑰。
        - id: ch05-b20
          speaker: mrs_march
          text: “这些花确实很美，可对我来说，还是贝丝送的玫瑰更香。”
        - id: ch05-b21
          speaker: narrator
          text: 贝丝轻轻偎到妈妈身边。
        - id: ch05-b22
          speaker: beth
          text: “真希望我能把自己的花送给爸爸。我怕他的圣诞节，没有我们过得这样快乐。”
          emotion: sad
