  chapters:
    - id: ch01
      title: Christmas Morning
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jo woke first in the gray light of Christmas morning. There were no stockings by the fireplace. For a moment she felt the old disappointment she had known as a little girl, when her sock was so full of treats that it fell down. Then she remembered Marmee's promise. Under her pillow she found a small book with a crimson cover. Jo knew the beautiful old story inside. To her, it was a true guidebook for anyone beginning a long journey.
        - id: ch01-b02
          speaker: jo
          text: "Merry Christmas, Meg! Look under your pillow."
        - id: ch01-b03
          speaker: narrator
          text: Meg pulled out a green book. It held the same picture and a few words from Marmee, which made their one present precious. Soon Beth and Amy woke and searched under their pillows. Beth's book was dove-colored, and Amy's was blue. The sisters sat together, looking at their books and talking, while the eastern sky turned pink.
        - id: ch01-b04
          speaker: narrator
          text: Meg could be a little vain, but she had a sweet, faithful nature. Without trying, she guided her sisters, especially Jo. Jo loved Meg dearly and listened because Meg always gave advice so gently.
        - id: ch01-b05
          speaker: meg
          text: "Girls, Marmee wants us to read these books, love them, and live by them. We should start now. We used to read faithfully, but after Father left and the war upset everything, we let too many good habits slip away. You may choose for yourselves. I'm keeping my book right here, and I'll read a little every morning when I wake up. I know it will help me through the day."
        - id: ch01-b06
          speaker: narrator
          text: Meg opened her book. Jo put an arm around her, leaned cheek to cheek, and read with her. The usual restlessness left Jo's face.
        - id: ch01-b07
          speaker: beth
          text: "Meg is so good. Come on, Amy, let's follow them. I'll help with the hard words, and they can explain anything we don't understand."
        - id: ch01-b08
          speaker: amy
          text: "I'm glad my book is blue."
        - id: ch01-b09
          speaker: narrator
          text: Then the rooms grew quiet. Pages turned softly, and winter sunlight crept across four bright heads and serious faces like a Christmas greeting.
        - id: ch01-b10
          speaker: narrator
          text: Half an hour later, Meg and Jo hurried downstairs to thank Marmee, but she was gone.
        - id: ch01-b11
          speaker: meg
          text: "Where's Marmee?"
        - id: ch01-b12
          speaker: hannah
          text: "Goodness knows. Some poor creature came begging, and your ma went right off to see what was needed. I've never known anyone so ready to give away food, clothes, and firewood."
        - id: ch01-b13
          speaker: narrator
          text: Hannah had lived with the March family since Meg was born. They thought of her as a friend, not a servant.
        - id: ch01-b14
          speaker: meg
          text: "She'll be home soon, I think. Fry the cakes and get everything ready. Wait, where is Amy's bottle of cologne?"
        - id: ch01-b15
          speaker: narrator
          text: Meg looked through the presents hidden in a basket under the sofa, but the little bottle was missing.
        - id: ch01-b16
          speaker: jo
          text: "She took it a minute ago. I suppose she's adding a ribbon or doing something fancy with it."
        - id: ch01-b17
          speaker: narrator
          text: Jo danced around the room, working the stiffness out of her new army slippers.
        - id: ch01-b18
          speaker: beth
          text: "My handkerchiefs look nice, don't they? Hannah washed and ironed them, and I put all the letters on myself."
        - id: ch01-b19
          speaker: narrator
          text: Beth proudly showed the uneven marks that had taken her so much work.
        - id: ch01-b20
          speaker: jo
          text: "Oh, Beth! You wrote 'Mother' instead of 'M. March.' That's funny!"
        - id: ch01-b21
          speaker: beth
          text: "Isn't it right? Meg's initials are M. M. too, and I don't want anyone except Marmee to use them."
        - id: ch01-b22
          speaker: narrator
          text: Beth looked worried. Meg frowned at Jo, then smiled at Beth.
        - id: ch01-b23
          speaker: meg
          text: "It's perfectly right, dear. It's a sweet idea, and sensible too. No one can mistake them now. Marmee will love it."
        - id: ch01-b24
          speaker: jo
          text: "That's Marmee! Quick, hide the basket!"
        - id: ch01-b25
          speaker: narrator
          text: A door had slammed, and footsteps sounded in the hall. Instead, Amy hurried in. Her hood and cloak showed that she had gone outside very early, and she looked embarrassed to find her sisters waiting.
        - id: ch01-b26
          speaker: meg
          text: "Where did you go? And what are you hiding back there?"
        - id: ch01-b27
          speaker: amy
          text: "Jo, don't laugh at me! I wanted this to stay a surprise. I traded the little bottle for a big one and spent every bit of my money on it. I really am trying not to be selfish anymore."
          emotion: sad
        - id: ch01-b28
          speaker: narrator
          text: Amy held out a handsome flask in place of the cheap one. She looked so humble and sincere in this small effort to forget herself that Meg hugged her at once. Jo called her a champion, and Beth picked her finest rose to decorate the grand bottle.
        - id: ch01-b29
          speaker: amy
          text: "After we read and talked about being good this morning, I felt ashamed of my present. So as soon as I was dressed, I ran around the corner and exchanged it. I'm so glad I did. Now mine is the handsomest one!"
        - id: ch01-b30
          speaker: narrator
          text: The street door banged again. The basket vanished under the sofa, and the hungry girls rushed to the breakfast table.
    - id: ch02
      title: The Hummels' Breakfast
      blocks:
        - id: ch02-b01
          speakers: [meg, jo, beth, amy]
          ensemble: chorus
          text: "Merry Christmas, Marmee! Thank you for our books. We read some already, and we're going to read every day."
        - id: ch02-b02
          speaker: marmee
          text: "Merry Christmas, my little daughters. I'm glad you started right away, and I hope you'll continue. But before we sit down, I have something to ask. A poor woman nearby has a newborn baby. Her six children are all crowded into one bed because they have no fire. There is no food, either. Their oldest boy came to tell me they were cold and hungry. Girls, will you give that family your breakfast for a Christmas present?"
        - id: ch02-b03
          speaker: narrator
          text: The sisters had waited nearly an hour and were very hungry. Nobody answered for one brief moment. Then Jo burst out.
        - id: ch02-b04
          speaker: jo
          text: "I'm so glad you got here before we started eating!"
          emotion: happy
        - id: ch02-b05
          speaker: beth
          text: "Can I come and help carry everything to the little children?"
        - id: ch02-b06
          speaker: amy
          text: "I'll bring the cream and the muffins."
        - id: ch02-b07
          speaker: narrator
          text: Amy bravely gave up the food she liked best. Meg had already covered the buckwheat cakes and piled the bread onto one large plate.
        - id: ch02-b08
          speaker: marmee
          text: "I thought you would say yes. You may all come and help. When we return, we'll have bread and milk, and dinner can make up for it."
        - id: ch02-b09
          speaker: narrator
          text: Soon they were ready. They set out early through the back streets, where few people would see the strange procession or laugh at it.
        - id: ch02-b10
          speaker: narrator
          text: The Hummels' room was bare and miserable. Its windows were broken, and there was no fire. Ragged covers lay over a sick mother, a crying baby, and six pale, hungry children packed beneath one old quilt for warmth. When the Marches entered, the children's large eyes stared, and their blue lips began to smile.
        - id: ch02-b11
          speaker: mrs_hummel
          text: "Ach, mein Gott! The good angels have come to us!"
          emotion: happy
        - id: ch02-b12
          speaker: narrator
          text: Mrs. Hummel wept with joy.
        - id: ch02-b13
          speaker: jo
          text: "We're funny-looking angels in hoods and mittens."
        - id: ch02-b14
          speaker: narrator
          text: That made everyone laugh. Within minutes, it truly seemed as if kind spirits had gone to work. Hannah brought wood, built a fire, and covered the broken windowpanes with old hats and even her own cloak. Marmee gave Mrs. Hummel tea and gruel, promised more help, and comforted her. She dressed the tiny baby as tenderly as her own.
        - id: ch02-b15
          speaker: narrator
          text: Meanwhile, the girls spread the food across the table, gathered the children around the fire, and fed them like a flock of hungry birds. They laughed and talked as they worked, doing their best to understand the children's funny, broken English.
        - id: ch02-b16
          speaker: mrs_hummel
          text: "Das ist gut! Die Engel-kinder!"
          emotion: happy
        - id: ch02-b17
          speaker: narrator
          text: The little ones ate and held their purple hands toward the warm flames. No one had ever called the March sisters angel children before. They liked it very much, especially Jo, who had been considered a rascal since birth.
        - id: ch02-b18
          speaker: narrator
          text: It was a wonderfully happy breakfast, even though the girls ate none of it. They left warmth and comfort behind. And in the whole city, there could hardly have been four merrier people than those hungry sisters, walking home to bread and milk after giving away their Christmas breakfast.
    - id: ch03
      title: Presents for Marmee
      blocks:
        - id: ch03-b01
          speaker: meg
          text: "That really was loving our neighbor more than ourselves. I liked doing it."
        - id: ch03-b02
          speaker: narrator
          text: Marmee went upstairs to gather clothes for the Hummels. The girls arranged their gifts. It was not a grand display, but those few bundles held a great deal of love. In the center, red roses, white chrysanthemums, and trailing vines filled a tall vase and made the table look elegant.
        - id: ch03-b03
          speaker: jo
          text: "She's coming! Beth, play something! Amy, open the door! Three cheers for Marmee!"
        - id: ch03-b04
          speaker: narrator
          text: Jo bounced around while Meg escorted Marmee to the place of honor with great dignity. Beth played her liveliest march, and Amy flung open the door. Marmee was surprised and touched. Her eyes filled as she read the notes and examined each gift. The slippers went straight onto her feet. A new handkerchief, scented with Amy's cologne, slipped into her pocket. Beth's rose was pinned to her dress, and the gloves fit perfectly.
        - id: ch03-b05
          speaker: narrator
          text: Everyone laughed, kissed, and explained. It was the simple, loving kind of family celebration that feels happy while it happens and sweet whenever it is remembered. Then they all got to work.
        - id: ch03-b06
          speaker: narrator
          text: Their morning errands and ceremonies had taken so long that the rest of Christmas Day went into preparing the evening entertainment. The sisters were still too young to visit the theater often, and they had no money for an expensive show of their own. So they used their wits and invented whatever they needed. They made guitars from pasteboard. Old-fashioned butter boats covered in silver paper became antique lamps. Worn cotton turned into magnificent robes, glittering with tin scraps from a pickle factory. Their armor shone with the diamond-shaped pieces left behind after lids were cut for preserve jars.
        - id: ch03-b07
          speaker: narrator
          text: Their large upstairs room had seen many cheerful performances. No gentlemen were allowed, which let Jo play every male role she wanted. Her special treasures were a pair of russet leather boots, an old fencing sword, and a slashed jacket once used as an artist's costume. The boots had come through a friend who knew a woman who knew an actor, and they appeared in every play.
        - id: ch03-b08
          speaker: narrator
          text: With so few performers, the two leading actors each played several roles. They deserved credit for learning three or four parts apiece, dashing in and out of different costumes, and managing the stage as well. It gave their memories excellent practice, filled many hours that might have been lonely or idle, and kept them away from less worthwhile company. Most of all, it gave them harmless fun.
    - id: ch04
      title: The Operatic Tragedy
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On Christmas night, a dozen girls crowded onto the bed that served as the best seats. They faced blue-and-yellow chintz curtains and waited eagerly. Behind the curtain came rustling, whispers, a little lamp smoke, and now and then one of Amy's excited giggles. At last a bell rang. The curtains opened, and the operatic tragedy began.
        - id: ch04-b02
          speaker: narrator
          text: There was only one playbill, and it promised a gloomy forest. A few potted shrubs and green cloth made the woods. Farther back stood a cave with a clothes rack for its roof and bureaus for walls. Inside it, a small furnace glowed under a black pot while an old witch bent over it. When she lifted the lid, real steam rose from the kettle and made the scene wonderfully convincing. The audience had one thrilling moment to take it all in. Then Hugo, the villain, marched onstage.
        - id: ch04-b03
          speaker: narrator
          text: Hugo wore a drooping hat, a black beard, a mysterious cloak, and Jo's beloved boots. His sword clanked while he paced in terrible agitation. Then he struck his forehead and sang wildly about how he hated Roderigo, loved Zara, and meant to kill one and win the other. Jo's rough villain voice, with sudden shouts whenever Hugo's feelings became too much for him, greatly impressed the audience. They applauded as soon as she stopped for breath. Jo bowed like an actor used to praise, crept toward the cave, and called for Hagar.
        - id: ch04-b04
          speaker: jo
          text: "Come out, my servant! I have need of you!"
        - id: ch04-b05
          speaker: narrator
          text: Meg emerged as the witch, with gray horsehair over her face, a red-and-black robe, a staff, and mysterious signs across her cloak. Hugo demanded one potion to make Zara love him and another to destroy Roderigo. Hagar sang that she would provide both. Then she summoned the spirit who carried the love potion.
        - id: ch04-b06
          speaker: meg
          text: "Come from your home, light spirit, come! You were born from roses and fed on dew. Bring me the fragrant potion I need. Make it sweet, quick, and strong, and answer my song!"
        - id: ch04-b07
          speaker: narrator
          text: Soft music played. At the back of the cave, a small figure appeared in cloudy white, with shining wings, golden hair, and a crown of roses. The spirit waved a wand and sang.
        - id: ch04-b08
          speaker: amy
          text: "I've come from my home far away in the silver moon. Take this magic spell and use it well, or its power will soon be gone!"
        - id: ch04-b09
          speaker: narrator
          text: The spirit dropped a little gilded bottle at Hagar's feet and vanished. Hagar began another chant, and this time the visitor was not lovely at all. A hideous black imp burst in with a bang, croaked an answer to the witch, tossed Hugo a dark bottle, and disappeared with a mocking laugh.
        - id: ch04-b10
          speaker: narrator
          text: Hugo sang his thanks, tucked both potions into his boots, and left. Hagar then explained in song that Hugo had killed several of her friends. She had cursed him and meant to ruin his plans and take revenge. The curtain fell. While the actors rebuilt the stage, the audience ate candy and discussed the play.
        - id: ch04-b11
          speaker: narrator
          text: There was a great deal of hammering before the next act, and the audience had to wait. But once the curtain rose and everyone saw what the stage builders had made, no one complained. A magnificent tower reached all the way to the ceiling. Halfway up was a window with a lamp burning inside. Behind its white curtain stood Zara in a lovely blue-and-silver dress, waiting for Roderigo.
        - id: ch04-b12
          speaker: narrator
          text: Roderigo arrived in a feathered cap, red cloak, chestnut curls, and those same russet boots. He knelt beneath the tower with a guitar and sang a tender serenade. Zara sang back. After their musical conversation, she agreed to run away with him.
        - id: ch04-b13
          speaker: narrator
          text: Now came the grand effect. Roderigo brought out a rope ladder with five steps and tossed one end toward Zara. She crept nervously through the window and put a hand on his shoulder, ready to leap down gracefully. But Zara had forgotten her long train. It caught in the window. The tower swayed, tipped forward, and crashed down over both lovers.
        - id: ch04-b14
          speaker: narrator
          text: Every girl shrieked. The russet boots kicked wildly under the wreckage, while a golden head popped out.
        - id: ch04-b15
          speaker: meg
          text: "I told you it would happen! I told you!"
          emotion: surprised
        - id: ch04-b16
          speaker: narrator
          text: Don Pedro, Zara's cruel father, rushed in without losing the thread of the play. He pulled his daughter free and whispered quickly.
        - id: ch04-b17
          speaker: amy
          text: "Don't laugh. Pretend it was supposed to happen!"
        - id: ch04-b18
          speaker: narrator
          text: Don Pedro ordered Roderigo to rise, then banished him from the kingdom with great anger and scorn. Roderigo had been badly shaken when the tower fell on him, but he boldly defied the old man and refused to move. His courage inspired Zara to defy her father too. Don Pedro sentenced them both to the deepest dungeon in the castle. A sturdy little servant entered with chains and led them away. The servant looked very frightened and had plainly forgotten the speech that belonged there.
        - id: ch04-b19
          speaker: narrator
          text: The third act took place in the castle hall. Hagar came to rescue the lovers and finish Hugo. Hearing him approach, she hid and watched him pour his potions into two cups of wine.
        - id: ch04-b20
          speaker: jo
          text: "Take these to the prisoners in their cells. Tell them I'll come later."
        - id: ch04-b21
          speaker: narrator
          text: The nervous servant drew Hugo aside to tell him something. While his back was turned, Hagar exchanged the cups for two harmless ones. The servant carried them off. Then Hagar returned the cup containing the poison meant for Roderigo.
        - id: ch04-b22
          speaker: narrator
          text: After a long song, Hugo grew thirsty and drank it himself. He lost his senses, clutched at the air, stamped around the stage, and finally fell flat and died. Hagar sang with tremendous power and told him exactly what she had done. The scene was truly thrilling, though the villain's long red hair suddenly tumbled down and spoiled the death a little.
        - id: ch04-b23
          speaker: narrator
          text: The audience called Hugo back before the curtain. Jo properly brought Hagar with her, since Meg's singing had been judged the greatest wonder of the whole show.
        - id: ch04-b24
          speaker: narrator
          text: In the fourth act, Roderigo was in despair inside his prison. Someone had told him Zara had abandoned him, and he was about to stab himself. Just as the dagger reached his heart, a beautiful voice sang beneath his window. Zara was still faithful, the song told him, but she was in danger, and he could save her if he acted. A key came flying through the window. It opened the door. In a burst of joy, Roderigo tore off his chains, rushed out of the cell, and went to find his lady love.
        - id: ch04-b25
          speaker: narrator
          text: The fifth act began with Zara and Don Pedro in a furious argument. Her father wanted her to enter a convent. She refused. After one last moving plea, she was nearly fainting when Roderigo dashed in and demanded permission to marry her. Don Pedro said no because Roderigo was poor. They shouted and waved their arms, but neither would give in.
        - id: ch04-b26
          speaker: narrator
          text: Roderigo was just about to carry the exhausted Zara away when the timid servant arrived with a letter and a bag from the missing Hagar. Her letter left endless riches to the young couple and promised Don Pedro a dreadful fate unless he made them happy. They opened the bag. Quarts of tin coins poured over the stage until everything glittered.
        - id: ch04-b27
          speaker: narrator
          text: The treasure softened the stern father at once. He agreed to the marriage without another complaint. Everyone joined in a joyful chorus, and the curtain closed on the lovers kneeling for Don Pedro's blessing in the most romantic poses they could manage.
        - id: ch04-b28
          speaker: narrator
          text: Wild applause followed, then stopped with a shock. The folding bed that held the best seats suddenly snapped shut and swallowed the delighted audience. Roderigo and Don Pedro flew to the rescue. Every girl was pulled out unhurt, though several could hardly speak because they were laughing so hard.
        - id: ch04-b29
          speaker: narrator
          text: The excitement had barely settled when Hannah appeared with a message.
        - id: ch04-b30
          speaker: hannah
          text: "Mrs. March sends her compliments and asks the ladies to come downstairs for supper."
    - id: ch05
      title: A Christmas Feast
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Even the actors had not expected a supper. When they saw the table, they stared at one another in joyful, delighted amazement. A small treat from Marmee would have been natural, but nothing this fine had appeared since the family's prosperous days. There were two whole dishes of ice cream, one pink and one white. There were cake, fruit, wonderful French candies, and, in the middle of it all, four large bouquets of flowers grown in a hothouse.
        - id: ch05-b02
          speaker: narrator
          text: For a moment, the girls could only stare from the feast to Marmee. She looked as if their delight pleased her enormously.
        - id: ch05-b03
          speaker: amy
          text: "Did fairies bring it?"
        - id: ch05-b04
          speaker: beth
          text: "It was Santa Claus."
        - id: ch05-b05
          speaker: meg
          text: "Marmee did it."
        - id: ch05-b06
          speaker: narrator
          text: Meg gave her sweetest smile, though she still wore a gray beard and white eyebrows from the play.
        - id: ch05-b07
          speaker: jo
          text: "Aunt March suddenly felt generous and sent the supper!"
        - id: ch05-b08
          speaker: marmee
          text: "Every guess is wrong. Old Mr. Laurence sent it."
        - id: ch05-b09
          speaker: meg
          text: "The grandfather of that Laurence boy? Why would he do such a thing? We don't even know him!"
          emotion: surprised
        - id: ch05-b10
          speaker: marmee
          text: "Hannah told one of his servants about your breakfast visit. Mr. Laurence is an unusual old gentleman, but your kindness pleased him. He knew my father years ago. This afternoon he sent me a very polite note and asked to show his friendly feelings toward my girls with a few Christmas treats. I couldn't refuse. So tonight you have a feast to make up for your breakfast of bread and milk."
        - id: ch05-b11
          speaker: jo
          text: "I know that boy gave him the idea! He's a splendid fellow, and I wish we could meet him. He looks as if he wants to know us, but he's shy. And Meg is so proper that she won't let me speak when we pass him."
        - id: ch05-b12
          speaker: narrator
          text: The plates traveled around the table. The ice cream quickly disappeared amid satisfied cries.
        - id: ch05-b13
          speaker: guest_girl
          text: "You mean the family in the big house next door, right? My mother knows old Mr. Laurence. She says he's proud and doesn't care to know his neighbors. He keeps his grandson shut in unless the boy is riding or walking with his tutor, and he makes him study terribly hard. We asked the boy to our party, but he didn't come. Mother says he's very nice, though he never talks to us girls."
        - id: ch05-b14
          speaker: jo
          text: "Our cat ran away once, and he brought her home. We started talking over the fence and got along wonderfully, chatting about cricket and things like that. Then he saw Meg coming and left. I'm going to know him someday. I'm sure he needs some fun."
        - id: ch05-b15
          speaker: marmee
          text: "He has good manners and looks like a young gentleman. I don't object to your knowing him if the right chance comes. He delivered the flowers himself. I would have invited him inside if I'd known what was happening upstairs. When he walked away, he looked so wistful. He could hear all the fun, and clearly had none of his own."
        - id: ch05-b16
          speaker: jo
          text: "Thank goodness you didn't bring him up tonight! But we'll put on another play for him someday. Maybe he'll act with us. Wouldn't that be wonderful?"
          emotion: happy
        - id: ch05-b17
          speaker: narrator
          text: Jo laughed and glanced down at the famous boots.
        - id: ch05-b18
          speaker: meg
          text: "I've never had such a beautiful bouquet. Just look at these flowers!"
          emotion: happy
        - id: ch05-b19
          speaker: marmee
          text: "They are beautiful. But Beth's roses are sweeter to me."
        - id: ch05-b20
          speaker: narrator
          text: Marmee breathed in the scent of the drooping little bouquet at her waist. Beth nestled close and whispered.
        - id: ch05-b21
          speaker: beth
          text: "I wish I could send my flowers to Father. I'm afraid his Christmas isn't as merry as ours."
          emotion: sad
