  chapters:
    - id: ch01
      title: The Invitation
      blocks:
        - id: ch01-b01
          speaker: meg
          text: "Jo! Jo! Where are you?"
        - id: ch01-b02
          speaker: jo
          text: "Up here!"
        - id: ch01-b03
          speaker: narrator
          text: Meg ran up to the garret and found Jo in her favorite hideaway by the sunny window. She was curled on the old three-legged sofa under a comforter, eating apples and crying over The Heir of Redclyffe. Jo often escaped there with half a dozen russet apples and a good book. She loved the quiet, and she liked the company of her pet rat, Scrabble, who lived nearby and never bothered her. When Meg arrived, Scrabble darted into his hole. Jo shook the tears from her cheeks and waited for the news.
        - id: ch01-b04
          speaker: meg
          text: "This is wonderful! Look, a real invitation from Mrs. Gardiner for tomorrow night!"
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: Meg waved the precious note, then read it with delight.
        - id: ch01-b06
          speaker: meg
          text: "Mrs. Gardiner invites Miss March and Miss Josephine to a little dance on New Year's Eve. Marmee says we can go. What are we going to wear?"
        - id: ch01-b07
          speaker: jo
          text: "Why ask? We'll wear our poplin dresses. We don't have anything else."
        - id: ch01-b08
          speaker: meg
          text: "If only I had a silk dress. Marmee says maybe when I'm eighteen, but waiting two years feels like forever."
        - id: ch01-b09
          speaker: jo
          text: "Our poplins almost look like silk, and they're good enough for us. Yours is nearly new. Mine has that burn and a tear, though. The burn really shows, and there's no fabric left to let out. What can I do?"
        - id: ch01-b10
          speaker: meg
          text: "Sit still as much as you can and keep your back hidden. The front looks fine. I'm getting a new hair ribbon, and Marmee will lend me her pearl pin. My new slippers are lovely. My gloves will do, even if they're not as nice as I'd like."
        - id: ch01-b11
          speaker: jo
          text: "Mine are stained with lemonade, and I can't replace them. I'll have to go without gloves."
        - id: ch01-b12
          speaker: meg
          text: "You have to wear gloves, or I'm not going. They're more important than anything. You can't dance without them, and I'd be terribly embarrassed."
        - id: ch01-b13
          speaker: jo
          text: "Then I'll sit still. I don't care for proper party dancing anyway. Gliding around is no fun. I like racing about and kicking up my heels."
        - id: ch01-b14
          speaker: meg
          text: "You can't ask Marmee for new gloves. They're expensive, and you're so careless. When you ruined the others, she said she wouldn't buy more this winter. Can't you somehow use them?"
        - id: ch01-b15
          speaker: jo
          text: "I could keep them crumpled in my hand so no one sees the stains. Wait! We can each wear one good glove and carry one bad glove. See?"
        - id: ch01-b16
          speaker: meg
          text: "But your hands are bigger. You'll stretch my glove terribly."
        - id: ch01-b17
          speaker: narrator
          text: Gloves were a tender subject with Meg. Jo picked up her book.
        - id: ch01-b18
          speaker: jo
          text: "Then I'll go without one. I don't care what anyone says!"
          emotion: angry
        - id: ch01-b19
          speaker: meg
          text: "You can have it! Just don't stain it, and please behave. Don't put your hands behind your back, don't stare, and don't shout, 'Christopher Columbus!' Promise?"
        - id: ch01-b20
          speaker: jo
          text: "Don't fuss. I'll act as proper as I can and try to stay out of trouble. Now go accept the invitation and let me finish this marvelous story."
        - id: ch01-b21
          speaker: narrator
          text: Meg went off to send their thanks, inspect her dress, and happily mend her one real lace ruffle. Jo finished the story, ate four apples, and tumbled around with Scrabble.
    - id: ch02
      title: Getting Ready
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: On New Year's Eve, the parlor stood empty. Beth and Amy were acting as maids while Meg and Jo devoted themselves to getting ready. Their outfits were simple, but the house filled with running feet, laughter, chatter, and then a strong smell of burned hair. Meg wanted a few curls around her face, so Jo pressed her paper-wrapped locks with hot tongs.
        - id: ch02-b02
          speaker: beth
          text: "Should they be smoking like that?"
        - id: ch02-b03
          speaker: jo
          text: "That's just the dampness drying out."
        - id: ch02-b04
          speaker: amy
          text: "What a strange smell. It reminds me of burned feathers."
        - id: ch02-b05
          speaker: narrator
          text: Amy smoothed her own pretty curls with a superior air.
        - id: ch02-b06
          speaker: jo
          text: "There. Once the papers come off, you'll have a whole cloud of little curls."
        - id: ch02-b07
          speaker: narrator
          text: Jo removed the papers, but the hair came off with them. Horrified, she laid a row of scorched little bundles on the bureau.
        - id: ch02-b08
          speaker: meg
          text: "Oh! What have you done? I'm ruined! I can't go now. My hair!"
          emotion: sad
        - id: ch02-b09
          speaker: jo
          text: "Of course this happened to me. You shouldn't have trusted me with it. I ruin everything. I'm so sorry. The tongs were too hot, and I've made an awful mess."
          emotion: sad
        - id: ch02-b10
          speaker: amy
          text: "It isn't ruined. Frizzle the rest and tie your ribbon so the ends fall over your forehead. It will look fashionable. I've seen lots of girls wear it that way."
          emotion: calm
        - id: ch02-b11
          speaker: meg
          text: "That's what I get for trying to look fancy. I wish I'd left my hair alone."
          emotion: angry
        - id: ch02-b12
          speaker: beth
          text: "I wish you had too. It was so smooth and pretty. But it will grow back soon."
          emotion: calm
        - id: ch02-b13
          speaker: narrator
          text: Beth came over to kiss and comfort her poor shorn sister. After several smaller disasters, the whole family finally got Meg finished. Together they pinned up Jo's hair and helped her into her dress. In the end, the girls looked very well in their simple clothes. Meg wore silvery gray, with a blue velvet hairnet, lace ruffles, and the pearl pin. Jo wore maroon, with a stiff, gentlemanly linen collar and one or two white chrysanthemums for decoration. Each sister wore one clean pale glove and carried one stained glove. Everyone inspected the effect and agreed that it looked perfectly natural and fine. Meg's new high heels were painfully tight, though she refused to admit it. All nineteen of Jo's hairpins seemed to point straight into her head. That wasn't comfortable either. Never mind. They would be elegant or die.
        - id: ch02-b14
          speaker: marmee
          text: "Have a lovely time, dears. Don't eat too much supper, and leave at eleven when I send Hannah for you."
        - id: ch02-b15
          speaker: narrator
          text: The sisters walked daintily down the path. Just after the gate clicked shut, Marmee called from a window.
        - id: ch02-b16
          speaker: marmee
          text: "Girls! Did you both bring clean handkerchiefs?"
        - id: ch02-b17
          speaker: jo
          text: "Yes! They're especially nice, and Meg put cologne on hers."
        - id: ch02-b18
          speaker: narrator
          text: As they walked on, Jo laughed.
        - id: ch02-b19
          speaker: jo
          text: "Marmee would ask about our handkerchiefs even if we were running away from an earthquake."
        - id: ch02-b20
          speaker: meg
          text: "It's one of her refined tastes, and she's right. You can always tell a real lady by her neat boots, gloves, and handkerchief."
    - id: ch03
      title: Behind the Curtain
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: In Mrs. Gardiner's dressing room, Meg spent a long time at the mirror.
        - id: ch03-b02
          speaker: meg
          text: "Remember to hide the burned part of your skirt. Is my sash straight? Does my hair look awful?"
        - id: ch03-b03
          speaker: jo
          text: "I'm sure I'll forget. If I do something wrong, wink at me, all right?"
        - id: ch03-b04
          speaker: narrator
          text: Jo tugged at her collar and hurriedly brushed her hair.
        - id: ch03-b05
          speaker: meg
          text: "Winking isn't ladylike. I'll raise my eyebrows when something is wrong and nod when you're doing well. Keep your shoulders straight, take little steps, and don't shake hands when you're introduced. That's not proper."
        - id: ch03-b06
          speaker: jo
          text: "How do you remember all these rules? I never can. Oh, isn't that music cheerful?"
        - id: ch03-b07
          speaker: narrator
          text: They went downstairs feeling a little shy. They rarely attended parties, so even this small, informal gathering felt like a great event. Mrs. Gardiner was a stately older lady. She welcomed them kindly, then handed them over to the oldest of her six daughters. Meg knew Sallie and soon felt comfortable. Jo cared little for girls or their gossip. She stood around with her back pressed safely to the wall and felt like a colt in a flower garden. Across the room, half a dozen lively boys were talking about skates. Skating was one of Jo's greatest joys, and she longed to join them. She tried to signal her wish to Meg, but Meg's eyebrows rose so sharply that Jo didn't dare move. No one came to speak with her. One by one, the girls nearby drifted away until Jo was alone. She couldn't roam around and entertain herself without showing the burned panel on the back of her dress, so she watched everyone rather sadly until the dancing began. Meg was asked to dance at once. Her tight slippers moved so briskly around the room, and she kept smiling so sweetly, that no one could have guessed how much they hurt.
        - id: ch03-b08
          speaker: narrator
          text: Then a large red-haired boy headed toward Jo's corner. Afraid he would ask her to dance, she slipped behind a curtain to watch in peace. Someone else had already hidden there. When the curtain fell closed, Jo stood face-to-face with the Laurence boy.
        - id: ch03-b09
          speaker: jo
          text: "Oh! I didn't know anyone was in here."
          emotion: surprised
        - id: ch03-b10
          speaker: narrator
          text: Jo started to back out as quickly as she had entered. The boy looked startled too, but he laughed pleasantly.
        - id: ch03-b11
          speaker: laurie
          text: "You don't have to leave. Stay if you want."
        - id: ch03-b12
          speaker: jo
          text: "Won't I bother you?"
        - id: ch03-b13
          speaker: laurie
          text: "Not at all. I came in here because I hardly know anyone, and everything felt strange at first."
        - id: ch03-b14
          speaker: jo
          text: "That's how I felt too. Please don't go, unless you'd rather."
        - id: ch03-b15
          speaker: narrator
          text: He sat down and studied his dancing shoes. Jo tried to sound easy and polite.
        - id: ch03-b16
          speaker: jo
          text: "I believe we've met before. You live close to us, don't you?"
        - id: ch03-b17
          speaker: laurie
          text: "Right next door."
        - id: ch03-b18
          speaker: narrator
          text: Laurie looked up and laughed. Jo sounded so proper now, and he remembered their easy talk about cricket when he had brought back the cat. Jo laughed too and relaxed.
        - id: ch03-b19
          speaker: jo
          text: "We had such a lovely time with that Christmas feast you sent."
        - id: ch03-b20
          speaker: laurie
          text: "Grandpa sent it."
        - id: ch03-b21
          speaker: jo
          text: "But you gave him the idea, didn't you?"
        - id: ch03-b22
          speaker: laurie
          text: "How is your cat, Miss March?"
        - id: ch03-b23
          speaker: narrator
          text: He tried to look serious, though his dark eyes sparkled.
        - id: ch03-b24
          speaker: jo
          text: "She's doing very well, thank you, Mr. Laurence. But I'm not Miss March. I'm only Jo."
        - id: ch03-b25
          speaker: laurie
          text: "And I'm not Mr. Laurence. I'm only Laurie."
        - id: ch03-b26
          speaker: jo
          text: "Laurie Laurence? That's a funny name."
        - id: ch03-b27
          speaker: laurie
          text: "My name is Theodore, but I hate it. The other boys called me Dora, so I made them use Laurie instead."
        - id: ch03-b28
          speaker: jo
          text: "I hate Josephine too. It sounds so sentimental. I wish everyone would call me Jo. How did you stop those boys from saying Dora?"
        - id: ch03-b29
          speaker: laurie
          text: "I thrashed them."
        - id: ch03-b30
          speaker: jo
          text: "I can't thrash Aunt March, so I suppose I'll have to endure it."
        - id: ch03-b31
          speaker: laurie
          text: "Don't you enjoy dancing, Miss Jo?"
        - id: ch03-b32
          speaker: jo
          text: "I do when there's room and everyone is lively. Here, I'd knock something over, step on someone's toes, or cause some other disaster. It's safer to let Meg glide around while I stay out of trouble. What about you?"
        - id: ch03-b33
          speaker: laurie
          text: "Sometimes. I've spent years abroad, and I haven't gone to enough parties here to understand how people do things."
        - id: ch03-b34
          speaker: jo
          text: "Abroad? Tell me about it! I love hearing about people's travels."
          emotion: happy
        - id: ch03-b35
          speaker: narrator
          text: Laurie wasn't sure where to start, but Jo's eager questions soon got him talking. He had gone to school in Vevey. The boys there never wore hats. They kept a fleet of boats on the lake and spent their holidays walking through Switzerland with their teachers.
        - id: ch03-b36
          speaker: jo
          text: "I wish I'd been there! Did you visit Paris?"
        - id: ch03-b37
          speaker: laurie
          text: "We spent last winter there."
        - id: ch03-b38
          speaker: jo
          text: "Can you speak French?"
        - id: ch03-b39
          speaker: laurie
          text: "At Vevey, we weren't allowed to speak anything else."
        - id: ch03-b40
          speaker: jo
          text: "Say something, please! I can read French, but I can't pronounce it."
        - id: ch03-b41
          speaker: laurie
          text: "Quel nom a cette jeune demoiselle en les pantoufles jolis?"
        - id: ch03-b42
          speaker: jo
          text: "That sounds wonderful! Let me think. You asked, 'Who is the young lady in the pretty slippers?' Didn't you?"
        - id: ch03-b43
          speaker: laurie
          text: "Oui, mademoiselle."
        - id: ch03-b44
          speaker: jo
          text: "That's my sister Margaret, and you knew it. Do you think she's pretty?"
        - id: ch03-b45
          speaker: laurie
          text: "Yes. She reminds me of German girls. She looks fresh and quiet, and she dances like a lady."
        - id: ch03-b46
          speaker: narrator
          text: Jo glowed at his praise and stored away every word to repeat to Meg. She and Laurie peeked through the curtain, commented on the dancers, and kept talking until they felt like old friends. Laurie's shyness soon disappeared. Jo's bold, almost gentlemanly manner amused him and helped him feel at ease. Jo became her merry self again too. She had forgotten the burn on her dress, and no one was lifting warning eyebrows at her. She liked the Laurence boy more than ever and took several good looks at him so she could describe him to her sisters. The March girls had no brothers, very few boy cousins, and hardly knew boys at all.
        - id: ch03-b47
          speaker: jo
          text: "Curly black hair, brown skin, big dark eyes, a handsome nose, fine teeth, small hands and feet. He's taller than I am, very polite for a boy, and altogether delightful. I wonder how old he is."
        - id: ch03-b48
          speaker: narrator
          text: Jo nearly asked him directly. Instead, she tried an unusually tactful approach.
        - id: ch03-b49
          speaker: jo
          text: "You'll be going to college soon, I suppose. I see you working away at your books. I mean, studying hard."
        - id: ch03-b50
          speaker: narrator
          text: Jo blushed over the phrase that had slipped out, but Laurie only smiled and shrugged.
        - id: ch03-b51
          speaker: laurie
          text: "Not for another year or two. I won't go before I'm seventeen."
        - id: ch03-b52
          speaker: jo
          text: "Are you really only fifteen?"
        - id: ch03-b53
          speaker: laurie
          text: "I'll be sixteen next month."
        - id: ch03-b54
          speaker: jo
          text: "I wish I could go to college! You don't seem very excited about it."
        - id: ch03-b55
          speaker: laurie
          text: "I hate it. You either grind away at lessons or fool around, and I don't like how the fellows behave in this country."
          emotion: angry
        - id: ch03-b56
          speaker: jo
          text: "Then what would you like?"
        - id: ch03-b57
          speaker: laurie
          text: "I'd like to live in Italy and enjoy myself in my own way."
        - id: ch03-b58
          speaker: narrator
          text: Jo wanted to ask what that meant, but his dark brows drew together. She changed the subject as her foot tapped with the music.
        - id: ch03-b59
          speaker: jo
          text: "That's a splendid polka. Why don't you dance it?"
        - id: ch03-b60
          speaker: laurie
          text: "I will if you come with me."
        - id: ch03-b61
          speaker: jo
          text: "I can't. I promised Meg I wouldn't, because..."
        - id: ch03-b62
          speaker: narrator
          text: Jo stopped, torn between telling him and laughing.
        - id: ch03-b63
          speaker: laurie
          text: "Because of what?"
        - id: ch03-b64
          speaker: jo
          text: "You won't tell anyone?"
        - id: ch03-b65
          speaker: laurie
          text: "Never."
        - id: ch03-b66
          speaker: jo
          text: "I have a bad habit of standing too close to the fire, so I burn my dresses. This one is scorched. It's neatly mended, but you can still see it, and Meg told me to keep it hidden. You can laugh if you want. It is funny."
        - id: ch03-b67
          speaker: narrator
          text: Laurie didn't laugh. He looked down for a moment, then answered so gently that Jo couldn't quite understand his expression.
        - id: ch03-b68
          speaker: laurie
          text: "That doesn't matter. I know what we can do. There's a long hall outside, and we can dance there without anyone seeing us. Please come."
          emotion: calm
    - id: ch04
      title: A Dance and a Sprained Ankle
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Jo thanked him and happily agreed. When she saw Laurie's fine pearl-colored gloves, she wished she had two neat gloves of her own. The long hall was empty, so no one could see the back of her dress. They had a splendid polka. Laurie danced well and taught her the German step, which was full of the swing and spring Jo loved. When the music ended, they sat on the stairs to catch their breath. Laurie was halfway through a story about a student festival in Heidelberg when Meg came looking for her sister. Jo was sorry to leave, but she followed Meg's signal into a side room. There she found Meg pale on a sofa, holding her foot.
        - id: ch04-b02
          speaker: meg
          text: "I've sprained my ankle. That foolish high heel twisted under me. It hurts so much I can hardly stand, and I don't know how I'll get home."
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: Meg rocked with pain while Jo gently rubbed her ankle.
        - id: ch04-b04
          speaker: jo
          text: "I knew those silly shoes would hurt you. I'm sorry. I suppose you could hire a carriage or stay here all night. I don't see another way."
        - id: ch04-b05
          speaker: meg
          text: "A carriage would cost far too much, if we could even find one. Most people brought their own. The stable is far away, and there's no one to send."
        - id: ch04-b06
          speaker: jo
          text: "I'll go."
        - id: ch04-b07
          speaker: meg
          text: "Absolutely not! It's after nine and terribly dark. I can't stay here either. The house is full because Sallie has guests. I'll rest until Hannah comes, then manage somehow."
        - id: ch04-b08
          speaker: jo
          text: "I'll ask Laurie. He'll go."
        - id: ch04-b09
          speaker: meg
          text: "Please don't! Don't ask him, and don't tell anyone. Bring my rubber boots and put these slippers with our things. I can't dance again. Once supper is over, watch for Hannah and tell me the moment she arrives."
        - id: ch04-b10
          speaker: jo
          text: "They're going to supper now. I'd rather stay with you."
        - id: ch04-b11
          speaker: meg
          text: "No, dear. Go on, and bring me some coffee. I'm too tired to move."
        - id: ch04-b12
          speaker: narrator
          text: Meg rested with her rubber boots carefully hidden. Jo blundered off toward the dining room. First she entered a china closet. Then she opened a door on old Mr. Gardiner, who was enjoying a private refreshment. At last she reached the table and grabbed some coffee, but someone jostled her and the cup spilled down the front of her dress. Now it looked as bad as the back.
        - id: ch04-b13
          speaker: jo
          text: "Oh, what a hopeless blunderer I am!"
        - id: ch04-b14
          speaker: narrator
          text: She scrubbed at the stain with Meg's glove and ruined that too. Then a friendly voice spoke beside her. Laurie held a full cup in one hand and a plate of ice in the other.
        - id: ch04-b15
          speaker: laurie
          text: "Can I do anything to help?"
        - id: ch04-b16
          speaker: jo
          text: "I was getting something for Meg because she's very tired. Someone bumped me, and now look at this mess."
        - id: ch04-b17
          speaker: laurie
          text: "That's too bad. I was hoping to find someone who wanted these. May I carry them to your sister?"
        - id: ch04-b18
          speaker: jo
          text: "Thank you! I'll take you to her. I won't try carrying anything else. I'd only get into more trouble."
        - id: ch04-b19
          speaker: narrator
          text: Jo led him back to Meg. Laurie pulled up a little table and served everything as if he were used to waiting on ladies. Then he brought a second helping of coffee and ice for Jo. He was so thoughtful and obliging that even particular Meg decided he was a nice boy. They laughed together over the candies and the little mottoes wrapped with them. Two or three other young people wandered in, and soon they were all in the middle of a quiet game of Buzz. Then Hannah appeared. At the sight of her, Meg forgot her injured ankle and rose so quickly that pain forced her to catch Jo with a cry.
        - id: ch04-b20
          speaker: meg
          text: "Quiet! Don't tell anyone."
        - id: ch04-b21
          speaker: narrator
          text: Then Meg spoke loudly enough for the others to hear.
        - id: ch04-b22
          speaker: meg
          text: "It's nothing. I only turned my foot a little."
        - id: ch04-b23
          speaker: narrator
          text: Meg limped upstairs to put on her things. Hannah scolded her, Meg cried, and Jo was at her wits' end. At last she decided to take matters into her own hands. She slipped away, ran downstairs, found a servant, and asked whether he could get a carriage. Unfortunately, he was only a hired waiter and knew nothing about the neighborhood. Jo stood looking around for someone else to help. Laurie had overheard her request and came over. His grandfather's carriage had just arrived to collect him, and he offered it to them.
        - id: ch04-b24
          speaker: jo
          text: "But it's so early. You aren't really leaving already, are you?"
        - id: ch04-b25
          speaker: laurie
          text: "I always leave early. Truly. Please let me take you home. It's on my way, and they say it's raining."
        - id: ch04-b26
          speaker: narrator
          text: That decided it. Jo explained Meg's injury, gratefully accepted, and rushed upstairs for everyone. Hannah hated rain as much as a cat did, so she offered no objection. Soon they rolled away in the warm, elegant carriage. Laurie rode outside with the driver so Meg could stretch out her injured foot, and the sisters could discuss the party freely.
    - id: ch05
      title: Home from the Party
      blocks:
        - id: ch05-b01
          speaker: jo
          text: "I had a wonderful time. Did you?"
        - id: ch05-b02
          speaker: narrator
          text: Jo mussed her hair and settled comfortably into her seat.
        - id: ch05-b03
          speaker: meg
          text: "Yes, until I hurt myself. Sallie's friend Annie Moffat liked me and invited me to stay for a week when Sallie visits her. They're going in the spring when the opera comes. It will be splendid, if Marmee allows me to go."
          emotion: happy
        - id: ch05-b04
          speaker: jo
          text: "I saw you dancing with that red-haired fellow I escaped from. Was he nice?"
        - id: ch05-b05
          speaker: meg
          text: "Very nice. His hair is auburn, not red. He was extremely polite, and we danced a delightful redowa."
        - id: ch05-b06
          speaker: jo
          text: "When he tried the new step, he looked like a grasshopper having a fit. Laurie and I couldn't stop laughing. Did you hear us?"
        - id: ch05-b07
          speaker: meg
          text: "No, but that was very rude. What were you doing behind that curtain all evening?"
        - id: ch05-b08
          speaker: narrator
          text: Jo told Meg all about her adventures with Laurie. By the time the story was finished, the carriage had reached home. The girls thanked Laurie many times, said good night, and crept quietly into the house, hoping they could reach their room without disturbing anyone. But the instant their bedroom door creaked, two little nightcaps popped up from the pillows. Beth and Amy were sleepy, but their voices were full of eager curiosity.
        - id: ch05-b09
          speakers: [beth, amy]
          ensemble: duo
          text: "Tell us about the party! Tell us everything!"
          emotion: happy
        - id: ch05-b10
          speaker: narrator
          text: Jo had saved some candy for the younger girls, which Meg called a great display of bad manners. Beth and Amy ate the treats and listened to the most exciting events of the evening. Only after the whole story was told did the two eager girls settle back down.
        - id: ch05-b11
          speaker: meg
          text: "It really feels grand to come home from a party in a carriage, then sit in my dressing gown while a maid takes care of me."
        - id: ch05-b12
          speaker: narrator
          text: Jo wrapped Meg's ankle with arnica and brushed her hair.
        - id: ch05-b13
          speaker: jo
          text: "I don't believe fine young ladies have any more fun than we do. Not even with our burned hair, old dresses, one glove each, and tight slippers that sprain our ankles when we're foolish enough to wear them."
        - id: ch05-b14
          speaker: narrator
          text: And I think Jo was quite right.
