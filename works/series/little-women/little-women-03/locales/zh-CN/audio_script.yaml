audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机智，像在炉边从容讲述旧日家事
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情绪来得快，带一点男孩子气
        timbre: 明亮略带沙哑
        pace: 偏快
        pitch: 中低
    meg:
      display_name: 梅格
      tts:
        delivery: 温柔端庄，常带大姐姐式的认真
        timbre: 柔和圆润
        pace: 适中
        pitch: 中
    beth:
      display_name: 贝丝
      tts:
        delivery: 羞怯安静，话语真诚而体贴
        timbre: 轻柔温暖
        pace: 稍慢
        pitch: 中高
    amy:
      display_name: 艾米
      tts:
        delivery: 一本正经又有些自负，努力显得优雅
        timbre: 清脆稚嫩
        pace: 适中
        pitch: 偏高
    mrs_march:
      display_name: 马奇太太
      tts:
        delivery: 慈爱爽朗，沉稳中带着鼓励
        timbre: 饱满温暖
        pace: 从容
        pitch: 中低
    hannah:
      display_name: 汉娜
      tts:
        delivery: 朴实爽快，带着操持家务多年的亲昵
        timbre: 粗朴温厚
        pace: 适中
        pitch: 中低
    laurie:
      display_name: 劳里
      tts:
        delivery: 彬彬有礼而略显腼腆，熟悉以后轻松风趣
        timbre: 清朗温和
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 一张舞会请帖
      blocks:
        - id: ch01-b01
          speaker: meg
          text: “乔！乔！你跑到哪儿去了？”
        - id: ch01-b02
          speaker: jo
          text: “我在楼上！”
        - id: ch01-b03
          speaker: narrator
          text: 梅格跑上阁楼，看见乔裹着厚披巾，窝在阳光照着的窗边。那张旧沙发只有三条腿，她却坐得舒舒服服，一边啃苹果，一边读《雷德克利夫的继承人》，脸上还挂着泪。乔最爱躲在这里，带半打红褐色苹果和一本好书，安安静静地读。附近住着她的宠物鼠斯克拉布，也从不嫌弃她。梅格一来，小老鼠嗖地钻回洞里。乔抹掉眼泪，等姐姐说话。
        - id: ch01-b04
          speaker: meg
          text: “快看，多有意思！加德纳太太正式写了请帖，请我们明晚去呢！”
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: 梅格挥着那张宝贝似的纸，高高兴兴地念给乔听。
        - id: ch01-b06
          speaker: meg
          text: “加德纳太太请马奇小姐和约瑟芬小姐在除夕参加小型舞会。妈妈已经答应了。咱们穿什么呀？”
        - id: ch01-b07
          speaker: jo
          text: “这还用问？除了那两条府绸裙，咱们根本没有别的衣裳。”
        - id: ch01-b08
          speaker: meg
          text: “我要是有一条丝绸裙就好了！妈妈说，也许十八岁时会给我一条，可还要等整整两年。”
        - id: ch01-b09
          speaker: jo
          text: “咱们的府绸看着就像丝绸，已经够好了。你的还跟新的一样。可我的裙子烧坏了一块，又扯破了一处。焦痕那么显眼，裙边也没法再放长，这可怎么办？”
        - id: ch01-b10
          speaker: meg
          text: “那就尽量坐着，别让人看见裙子后面。前面还好好的。我要换一条新发带，妈妈会借我珍珠胸针，新舞鞋也很漂亮。手套虽不理想，倒还过得去。”
        - id: ch01-b11
          speaker: jo
          text: “我的手套让柠檬水弄坏了，又买不起新的，只能空着手去。”
        - id: ch01-b12
          speaker: meg
          text: “你不戴手套，我就不去了。手套比什么都重要，跳舞绝不能少。你要真不戴，我会难堪死的。”
        - id: ch01-b13
          speaker: jo
          text: “那我就坐着。舞会上那种绕圈子的跳法，我本来也不喜欢。我宁愿痛痛快快地满场蹦。”
        - id: ch01-b14
          speaker: meg
          text: “手套那么贵，你又总不小心，不能再向妈妈要。上次你毁掉一双，她就说这个冬天不再买了。旧的真的不能将就吗？”
        - id: ch01-b15
          speaker: jo
          text: “我可以把它们揉成一团攥着，别人就看不到污迹了。等等，我有主意了！咱们每人戴一只好手套，手里再拿一只脏的。”
        - id: ch01-b16
          speaker: meg
          text: “你的手比我的大，会把我的手套撑坏的。”
        - id: ch01-b17
          speaker: jo
          text: “那我干脆不戴。随别人怎么说，我不在乎！”
          emotion: angry
        - id: ch01-b18
          speaker: meg
          text: “好吧，借给你就是了！可别弄脏，也得规矩一点。不要背着手，不要盯着人看，更不要大喊‘哥伦布啊！’。”
        - id: ch01-b19
          speaker: jo
          text: “别操心。我会尽量装得一本正经，能不惹事就不惹事。快去回信，让我看完这个精彩的故事。”
        - id: ch01-b20
          speaker: narrator
          text: 梅格去回信，说她们欣然接受邀请。接着，她又检查裙子，哼着歌缝补自己唯一的真蕾丝饰边。乔则读完故事，吃完剩下的四个苹果，还跟斯克拉布追逐嬉闹了一场。
    - id: ch02
      title: 要么优雅，要么死
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 除夕那天，客厅里一个人也没有。两个妹妹当起梳妆女仆，两个姐姐一心准备舞会。她们的装扮明明很简单，家里却到处是上下楼的脚步声，还有说不完的笑语声。后来，整栋房子还弥漫着一股头发烧焦的浓烈味道。梅格想在脸旁添几绺卷发，乔便自告奋勇，用烧热的钳子夹那些包在纸里的发卷。
        - id: ch02-b02
          speaker: beth
          text: “头发冒这么多烟，真的没事吗？”
        - id: ch02-b03
          speaker: jo
          text: “那是里面的潮气正在烘干。”
        - id: ch02-b04
          speaker: amy
          text: “味道真奇怪，简直像烧焦的羽毛。”
        - id: ch02-b05
          speaker: jo
          text: “好了，我现在拆掉纸，你们就等着看一大团漂亮的小卷发吧。”
        - id: ch02-b06
          speaker: narrator
          text: 乔放下钳子，把纸一张张拆了下来。她许诺的那团小卷发并没有出现，头发全粘在纸上，一起掉了下来。吓坏了的发型师只好把一排焦黑的小卷摆在五斗橱上，给眼前的受害者看。
        - id: ch02-b07
          speaker: meg
          text: “啊！你做了什么？我全毁了，不能去舞会了！我的头发呀！”
          emotion: sad
        - id: ch02-b08
          speaker: jo
          text: “我就知道自己会倒霉！你本来不该叫我弄，我总把事情做坏。真对不起，钳子太烫了，我才弄成这样。”
          emotion: sad
        - id: ch02-b09
          speaker: narrator
          text: 乔含着懊悔的泪，望着那几块黑乎乎的小薄饼。
        - id: ch02-b10
          speaker: amy
          text: “并没有全毁。把剩下的头发也烫蓬，再让缎带两头垂到额前，就像最新的式样。我见过好些姑娘这样梳。”
          emotion: calm
        - id: ch02-b11
          speaker: meg
          text: “谁叫我非想打扮漂亮，真是活该！早知道就不碰头发了。”
          emotion: angry
        - id: ch02-b12
          speaker: beth
          text: “我也希望没有碰过。原来的头发又光滑又好看，不过很快还会长出来的。”
          emotion: calm
        - id: ch02-b13
          speaker: narrator
          text: 贝丝走过去亲亲这只被剪了毛的羊，好好安慰她。又出了几桩小乱子以后，梅格终于打扮完毕。全家又一齐动手，才替乔盘好头发，穿好裙子。姐妹俩的衣着虽朴素，模样却很不错。梅格穿银灰色衣裙，戴蓝丝绒发网、蕾丝饰边和珍珠胸针。乔穿栗红色衣裙，竖着硬挺而颇有男子气的亚麻领子，只点缀一两朵白菊花。两人各戴一只干净的浅色手套，手里拿一只脏手套，大家都说看起来轻松又漂亮。
        - id: ch02-b14
          speaker: narrator
          text: 梅格的高跟鞋紧得脚疼，她却不肯承认。乔头上的十九枚发夹也像全扎进了脑袋。可那又怎样呢？要么优雅，要么死吧。
        - id: ch02-b15
          speaker: mrs_march
          text: “宝贝们，好好玩！晚餐别吃太多。十一点汉娜去接你们，她一到就回来。”
        - id: ch02-b16
          speaker: narrator
          text: 姐妹俩姿态优雅地走出院门，身后忽然又传来妈妈的声音。
        - id: ch02-b17
          speaker: mrs_march
          text: “姑娘们，你们都带了干净漂亮的手帕吗？”
        - id: ch02-b18
          speaker: jo
          text: “带了，漂亮得不得了！梅格的手帕上还有古龙水呢。我看，就算咱们正逃避地震，妈妈也会追着问这个。”
        - id: ch02-b19
          speaker: meg
          text: “这是妈妈的一种贵族讲究，而且很合规矩。真正的淑女，靴子、手套和手帕总是整整洁洁。”
        - id: ch02-b20
          speaker: narrator
          text: 到了加德纳太太家的更衣室，梅格对着镜子仔仔细细打扮了好久，临走还在担心自己的腰带和头发。乔扯扯领子，又匆匆刷了几下头发，请姐姐看见她做错事时眨眼提醒。
        - id: ch02-b21
          speaker: meg
          text: “别忘了藏住裙子后面烧坏的地方。我要是抬眉毛，就是你做错了。做得好，我会点头。挺直肩膀，步子小一点。别人介绍你认识谁，也别伸手去握，那不合规矩。”
        - id: ch02-b22
          speaker: jo
          text: “这些讲究你怎么全会？我怎么也学不会。你听，音乐多快活！”
    - id: ch03
      title: 帘子后面的男孩
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 姐妹俩走下楼去。她们很少参加聚会，虽说只是个随意的小舞会，心里还是有些胆怯。仪态庄严的加德纳太太亲切地迎接她们，又把她们交给六个女儿中年纪最大的一个。梅格认识萨莉，很快就自在了。乔却不爱姑娘，也不爱姑娘家的闲谈，只能小心地背靠墙站着，像一匹误闯花园的小马驹，怎么待都不合适。
        - id: ch03-b02
          speaker: narrator
          text: 房间另一头，五六个快活的男孩正谈溜冰。溜冰是乔平生一大乐事，她恨不得马上加入他们，便拼命给梅格递眼色。可姐姐的眉毛抬得太吓人，她一步也不敢动。没有人来和她说话，那群男孩又一个接一个走开，最后只剩她孤零零站着。她怕走动时露出裙后的焦痕，不能到处闲逛，只好闷闷地看着大家。
        - id: ch03-b03
          speaker: narrator
          text: 舞会一开始，梅格立刻有人邀舞。那双高跟舞鞋紧得厉害，每一步都让她的脚发疼，可她依旧跳得又轻又快，脸上还带着笑，谁也看不出她正忍着疼。乔看见一个红头发的大个子青年朝自己的角落走来，生怕他要邀舞，赶紧躲进挂着帘子的凹间。她原想藏在那里，从缝隙里偷看别人，安安静静自得其乐。帘子刚在身后落下，她才发现里面已经藏着另一个害羞的人，正是劳伦斯家的男孩。
        - id: ch03-b04
          speaker: jo
          text: “哎呀，我不知道这里有人！我马上出去。”
          emotion: surprised
        - id: ch03-b05
          speaker: laurie
          text: “不用走。别管我，你愿意留在这里就留下吧。”
        - id: ch03-b06
          speaker: jo
          text: “我不会打扰你吗？”
        - id: ch03-b07
          speaker: laurie
          text: “完全不会。我认识的人不多，刚才有点不自在，才躲进来的。”
        - id: ch03-b08
          speaker: jo
          text: “我也是。只要你不嫌弃，就别走。”
        - id: ch03-b09
          speaker: narrator
          text: 男孩重新坐下，只管低头看自己的浅口舞鞋。两个人一时都不知道该说什么。乔想装得客气从容，便摆出郑重的口气，说自己好像有幸见过他，又问他是不是住在附近。
        - id: ch03-b10
          speaker: laurie
          text: “就在你们隔壁。”
        - id: ch03-b11
          speaker: narrator
          text: 他忍不住笑出了声。他还记得送猫回去时，两个人明明热热闹闹谈过板球，乔现在这副郑重其事的模样实在有趣。乔也跟着笑起来，顿时轻松了。
        - id: ch03-b12
          speaker: jo
          text: “你们送的圣诞礼物真好，我们全家开心极了。”
        - id: ch03-b13
          speaker: laurie
          text: “那是我祖父送的。”
        - id: ch03-b14
          speaker: jo
          text: “可主意是你替他想的，对不对？”
        - id: ch03-b15
          speaker: laurie
          text: “你家的猫好吗，马奇小姐？”
        - id: ch03-b16
          speaker: narrator
          text: 劳里努力装得严肃，一双黑眼睛却全是笑意。
        - id: ch03-b17
          speaker: jo
          text: “很好，谢谢你，劳伦斯先生。不过我不是马奇小姐，我只是乔。”
        - id: ch03-b18
          speaker: laurie
          text: “我也不是劳伦斯先生，我只是劳里。”
        - id: ch03-b19
          speaker: jo
          text: “劳里·劳伦斯？真是个怪名字。”
        - id: ch03-b20
          speaker: laurie
          text: “我本来叫西奥多，可男孩子们偏叫我多拉，我不喜欢，只好逼他们改叫劳里。”
        - id: ch03-b21
          speaker: jo
          text: “我也讨厌约瑟芬这个名字，听着多愁善感。你是怎么让他们闭嘴的？”
        - id: ch03-b22
          speaker: laurie
          text: “我把他们揍了一顿。”
        - id: ch03-b23
          speaker: jo
          text: “我可不能揍马奇姑婆，看来只能忍着了。”
        - id: ch03-b24
          speaker: laurie
          text: “乔小姐，你不爱跳舞吗？”
        - id: ch03-b25
          speaker: jo
          text: “地方宽敞，大家又有精神，我就喜欢。这里太挤，我准会撞倒东西、踩到别人，或者闯出大祸。还是让梅格在外面轻轻飘吧。你怎么也不跳？”
        - id: ch03-b26
          speaker: laurie
          text: “偶尔会跳。我在国外住了好多年，回来以后没怎么参加聚会，还不懂这里的规矩。”
        - id: ch03-b27
          speaker: jo
          text: “你去过国外？快说给我听听！我最爱听旅行见闻了。”
          emotion: surprised
        - id: ch03-b28
          speaker: narrator
          text: 劳里起初不知从哪儿讲，乔一个问题接一个问题，很快打开了他的话匣子。他说自己在沃韦上过学，那里的男孩从来不戴帽子，学校在湖上还有一整队小船。到了假日，他们最快乐的消遣，就是跟着老师徒步游览瑞士各地。
        - id: ch03-b29
          speaker: jo
          text: “我要是也去过就好了！巴黎呢，你去过吗？”
        - id: ch03-b30
          speaker: laurie
          text: “去年冬天，我们就住在巴黎。”
        - id: ch03-b31
          speaker: jo
          text: “你会说法语吗？”
        - id: ch03-b32
          speaker: laurie
          text: “在沃韦，学校不许我们说别的语言。”
        - id: ch03-b33
          speaker: jo
          text: “那就说几句吧！我看得懂法文，可不会念。”
        - id: ch03-b34
          speaker: laurie
          text: “Quel nom a cette jeune demoiselle en les pantoufles jolis?”
        - id: ch03-b35
          speaker: jo
          text: “你说得真好听！我猜，你是在问那位穿漂亮舞鞋的姑娘叫什么名字，对吧？”
        - id: ch03-b36
          speaker: laurie
          text: “Oui, mademoiselle.”
        - id: ch03-b37
          speaker: jo
          text: “她是我姐姐玛格丽特，你明明知道！你觉得她漂亮吗？”
        - id: ch03-b38
          speaker: laurie
          text: “很漂亮。她让我想起德国姑娘，看着清新又文静，跳起舞来也像真正的淑女。”
        - id: ch03-b39
          speaker: narrator
          text: 听见男孩子这样称赞姐姐，乔高兴得满脸放光，把每句话都牢牢记住，打算回家讲给梅格听。两个人隔着帘子偷看，评论别人，又聊个不停，很快就像老朋友了。乔那副大方爽朗、颇有男子气的模样让劳里觉得有趣，也让他忘了害羞。乔也忘了自己的旧裙子，身边更没人对她抬眉毛，便恢复了快活的本性。
        - id: ch03-b40
          speaker: narrator
          text: 乔越来越喜欢这个劳伦斯家的男孩，还偷偷仔细打量了他好几回，想把他的模样牢牢记住，回家以后从头到脚讲给妹妹们听。马奇姐妹没有兄弟，男性表兄弟也很少，男孩对她们简直是一种陌生生物。
        - id: ch03-b41
          speaker: jo
          text: “黑色卷发，棕色皮肤，大眼睛，漂亮的鼻子和整齐的牙齿。手脚都小，比我高。以男孩来说，他礼貌得很，也有趣极了。不知道他多大？”
        - id: ch03-b42
          speaker: narrator
          text: 乔差点直接问他几岁，话已经到了嘴边，幸好及时忍住。她难得机灵了一回，决定绕个弯，从他什么时候上大学来打听年纪。
        - id: ch03-b43
          speaker: jo
          text: “你很快要上大学了吧？我常见你对着书本拼命啃……不，我是说，刻苦用功。”
        - id: ch03-b44
          speaker: narrator
          text: 乔原想说自己常看见劳里对着书本拼命啃，话一出口才想起这说法不够文雅，连忙改成刻苦用功，脸也一下红了。劳里只是笑笑，耸了耸肩，看起来一点也没有受惊。
        - id: ch03-b45
          speaker: laurie
          text: “还要一两年。反正十七岁以前，我不会去。”
        - id: ch03-b46
          speaker: jo
          text: “难道你才十五岁？”
        - id: ch03-b47
          speaker: laurie
          text: “下个月十六。”
        - id: ch03-b48
          speaker: jo
          text: “我真希望自己能上大学！可你看起来一点也不期待。”
        - id: ch03-b49
          speaker: laurie
          text: “我讨厌大学。不是死啃书，就是瞎胡闹。而且我也不喜欢这个国家的男孩子那套做法。”
          emotion: angry
        - id: ch03-b50
          speaker: jo
          text: “那你到底喜欢什么？”
        - id: ch03-b51
          speaker: laurie
          text: “住在意大利，照我自己的方式快活。”
        - id: ch03-b52
          speaker: narrator
          text: 乔很想追问，他所谓自己的方式究竟是什么。可劳里皱起黑眉，神色忽然有些阴沉，乔便识趣地忍住了。她用脚尖跟着乐声打起拍子，把话题转到那支热闹的波尔卡上。
        - id: ch03-b53
          speaker: jo
          text: “这支波尔卡真棒，你怎么不去跳？”
        - id: ch03-b54
          speaker: laurie
          text: “只要你跟我一起去。”
        - id: ch03-b55
          speaker: narrator
          text: 劳里潇洒地行了个小礼。乔却说自己答应过梅格不跳，说到原因又犹豫起来。
        - id: ch03-b56
          speaker: laurie
          text: “究竟为什么？我保证不告诉别人。”
        - id: ch03-b57
          speaker: jo
          text: “我总爱站在炉火前，把裙子烧坏。这条也焦了一块，补得再好还是能看出来。梅格叫我别乱动，免得被人瞧见。你想笑就笑吧，这事确实挺可笑。”
        - id: ch03-b58
          speaker: narrator
          text: 劳里并没有像乔准许的那样笑她。他只是低头沉默了一会儿，脸上的神情温和又认真，反倒让乔猜不透他在想什么。
        - id: ch03-b59
          speaker: laurie
          text: “这不算什么。外面有条长走廊，咱们可以在那里痛快地跳，谁也看不见。跟我来吧。”
          emotion: calm
        - id: ch03-b60
          speaker: narrator
          text: 乔道了谢，欢欢喜喜地答应了。看见劳里那双漂亮的珍珠色手套，她只恨自己没有两只干净的。长走廊里一个人也没有，两个人痛痛快快跳了一支波尔卡。劳里舞跳得很好，还教她德国舞步。那舞步又能摆荡，又能腾跃，乔喜欢极了。音乐停下，他们坐在楼梯上喘气。劳里正讲海德堡的一次学生庆典，梅格忽然来找妹妹。她招招手，乔只好恋恋不舍地跟进旁边的小屋。梅格坐在沙发上，捂着脚，脸色发白。
    - id: ch04
      title: 扭伤的脚踝
      blocks:
        - id: ch04-b01
          speaker: meg
          text: “我的脚踝扭了。都怪这只蠢高跟，忽然一歪，把脚狠狠拧了一下。现在疼得几乎站不住，我可怎么回家呀？”
          emotion: sad
        - id: ch04-b02
          speaker: narrator
          text: 梅格痛得前后摇晃。乔轻轻替她揉着脚踝。
        - id: ch04-b03
          speaker: jo
          text: “我早知道这双傻鞋会伤你的脚。真可怜。可除了雇辆马车，或者留在这里过夜，我也想不出办法。”
        - id: ch04-b04
          speaker: meg
          text: “雇车要花好多钱，恐怕还雇不到。大多数客人坐自家的车，马厩又远，也没人可以派去。”
        - id: ch04-b05
          speaker: jo
          text: “我去找。”
        - id: ch04-b06
          speaker: meg
          text: “绝对不行！已经过了九点，外面黑得像埃及。这里也住满了，萨莉还有几个朋友留宿。我等汉娜来，再尽力想办法。”
        - id: ch04-b07
          speaker: jo
          text: “那我请劳里去，他一定肯帮忙。”
        - id: ch04-b08
          speaker: meg
          text: “天哪，千万别告诉任何人！把套鞋拿来，再收好这双舞鞋。我不能跳了。晚餐一结束，你就去留意汉娜，她来了马上告诉我。”
        - id: ch04-b09
          speaker: jo
          text: “他们现在就去吃晚餐。我更愿意留下陪你。”
        - id: ch04-b10
          speaker: meg
          text: “不用，亲爱的。给我拿点咖啡来吧，我累得一点也动不了。”
        - id: ch04-b11
          speaker: narrator
          text: 梅格斜躺下来，把套鞋仔细藏好。乔一路跌跌撞撞地寻找餐厅。她先闯进瓷器间，又推开一扇不该开的门，撞见老加德纳先生正在里面独自享用一点提神的饮品。她慌忙退出来，好不容易才找对地方。一看见餐桌，乔立刻冲过去，成功抢到一杯咖啡，却马上洒了一身。现在裙子前面和后面一样糟了。
        - id: ch04-b12
          speaker: jo
          text: “哎呀，我简直是一门横冲直撞的大炮！”
        - id: ch04-b13
          speaker: narrator
          text: 她拿梅格的手套擦裙子，把那只手套也彻底毁了。这时，一个友善的声音从身旁响起。劳里一手端着满杯咖啡，一手拿着一盘冰。
        - id: ch04-b14
          speaker: laurie
          text: “需要我帮忙吗？”
        - id: ch04-b15
          speaker: jo
          text: “梅格累坏了，我想给她拿点东西。不知谁撞了我一下，你看，我就变成了这副模样。”
        - id: ch04-b16
          speaker: laurie
          text: “真倒霉！我也正想找人把这些送出去。让我拿给你姐姐，好吗？”
        - id: ch04-b17
          speaker: jo
          text: “太谢谢了，我带你去。东西可不能交给我，我准会再闯一次祸。”
        - id: ch04-b18
          speaker: narrator
          text: 乔在前面带路。劳里仿佛早就习惯服侍女士，熟练地拉过一张小桌，把咖啡和冰放到梅格手边，还特意回去替乔又拿来一份。他处处殷勤周到，连一向挑剔的梅格也说他是个好男孩。大家吃着夹有格言纸条的糖果，笑闹了一阵，又跟两三个偶然走进来的年轻人安静地玩起“嗡嗡”游戏。汉娜出现时，梅格一时忘了脚伤，猛地站起来，疼得叫了一声，只好赶紧抓住乔。
        - id: ch04-b19
          speaker: meg
          text: “嘘，别说出去。真的没事，我只是轻轻扭了一下脚。”
        - id: ch04-b20
          speaker: narrator
          text: 梅格一瘸一拐地上楼穿戴。汉娜不停责备她不该穿那双鞋，梅格又疼又着急，忍不住掉起眼泪。乔在旁边急得团团转。眼看谁也拿不出主意，她终于决定自己做主。乔偷偷溜出去，飞快跑下楼，请一名仆人替她雇车。偏偏那是宴会临时请来的侍者，对附近完全不熟。乔正四处张望着找人帮忙，听见她说话的劳里走了过来。
        - id: ch04-b21
          speaker: narrator
          text: 劳里已经听见乔请人雇车。他说祖父的马车刚好来接自己，车就在外面，完全可以送她们回家。
        - id: ch04-b22
          speaker: jo
          text: “现在还这么早，你真的就要走了吗？”
        - id: ch04-b23
          speaker: laurie
          text: “我一向走得早，真的！请让我送你们回去，反正顺路。再说，听说外面还下雨了。”
        - id: ch04-b24
          speaker: narrator
          text: 这句话解决了所有难题。乔把梅格扭伤脚的经过告诉劳里，感激地接受好意，又飞奔上楼，把其他人全带下来。汉娜像猫一样讨厌雨水，当然没有反对。一行人坐进豪华的封闭式马车，听着车轮隆隆向前，觉得自己又气派又优雅。劳里主动坐到车夫身旁，把车里的地方全让出来，好让梅格把伤脚舒舒服服抬起来。几个姑娘终于能无拘无束地谈论今晚的舞会了。
    - id: ch05
      title: 坐马车回家
      blocks:
        - id: ch05-b01
          speaker: jo
          text: “我今晚玩得痛快极了。你呢？”
        - id: ch05-b02
          speaker: narrator
          text: 乔揉乱头发，让自己舒舒服服地坐好。
        - id: ch05-b03
          speaker: meg
          text: “扭伤以前都很好。萨莉的朋友安妮·莫法特很喜欢我，还约我等萨莉去她家时，一起住一个星期。她们打算春天歌剧上演时去。妈妈要是准许，那就太棒了。”
          emotion: happy
        - id: ch05-b04
          speaker: jo
          text: “我看见你跟那个红头发的人跳舞了，就是我躲开的那个。他人怎么样？”
        - id: ch05-b05
          speaker: meg
          text: “好极了！他的头发是赤褐色，不是红色。他很有礼貌，还跟我跳了一支美妙的雷多瓦舞。”
        - id: ch05-b06
          speaker: jo
          text: “他跳新舞步时，活像一只发了疯的蚱蜢。劳里和我笑得停不下来，你没听见吗？”
        - id: ch05-b07
          speaker: meg
          text: “没有，可那样实在没礼貌。你一直躲在帘子后面，到底做了些什么？”
        - id: ch05-b08
          speaker: narrator
          text: 乔把自己遇见劳里、躲在帘子后聊天、又到走廊跳舞的冒险从头讲起。梅格一路认真听着，乔刚好把故事讲完，马车也停在了家门口。姐妹俩连声向劳里道谢，跟他道过晚安，轻手轻脚地溜进屋，生怕惊动任何人。可房门才吱呀一响，两顶小睡帽立刻从床上冒出来，两个困倦又急切的声音一齐催她们讲舞会。
        - id: ch05-b09
          speaker: amy
          text: “快讲讲舞会上发生了什么！”
        - id: ch05-b10
          speaker: beth
          text: “对呀，快讲给我们听！”
        - id: ch05-b11
          speaker: narrator
          text: 乔做了件梅格所谓非常缺乏教养的事。她偷偷给两个妹妹藏了些舞会上的糖果。小姑娘们边吃边听姐姐讲当晚最惊险、最有趣的几件事，困意终于盖过了好奇心，很快便心满意足地安静下来。乔用山金车酊替梅格包扎好受伤的脚踝，又让姐姐穿着晨衣坐好，自己在旁边慢慢替她梳头。
        - id: ch05-b12
          speaker: meg
          text: “我现在真像个体面的年轻小姐。坐着马车从舞会回来，穿着晨衣坐在房里，还有女仆服侍。”
        - id: ch05-b13
          speaker: jo
          text: “我才不信那些体面的年轻小姐会比咱们更快活。咱们烧焦了头发，穿着旧裙子，一人只有一只好手套，还傻乎乎穿紧鞋，扭伤了脚，可今晚照样开心极了。”
        - id: ch05-b14
          speaker: narrator
          text: 我想，乔说得完全正确，她们的确已经快活得不能再快活了。
