audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机智，像在炉边从容讲述旧日家事
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情绪来得快，带一点男孩子气
        timbre: 明亮略带沙哑
        pace: 偏快
        pitch: 中低
    meg:
      display_name: 梅格
      tts:
        delivery: 温柔端庄，常带大姐姐式的认真
        timbre: 柔和圆润
        pace: 适中
        pitch: 中
    beth:
      display_name: 贝丝
      tts:
        delivery: 羞怯安静，话语真诚而体贴
        timbre: 轻柔温暖
        pace: 稍慢
        pitch: 中高
    amy:
      display_name: 艾米
      tts:
        delivery: 一本正经又有些自负，努力显得优雅
        timbre: 清脆稚嫩
        pace: 适中
        pitch: 偏高
    laurie:
      display_name: 劳里
      tts:
        delivery: 彬彬有礼而略显腼腆，熟悉以后轻松风趣
        timbre: 清朗温和
        pace: 适中
        pitch: 中
    hannah:
      display_name: 汉娜
      tts:
        delivery: 爽朗朴实，惊讶时直率而热烈
        timbre: 浑厚温暖
        pace: 适中
        pitch: 中低
    family:
      display_name: 全家人
      tts:
        delivery: 亲密热闹，几个人兴奋地接连发问
        timbre: 明亮而层次丰富
        pace: 偏快
        pitch: 中
    mrs_march:
      display_name: 马奇太太
      tts:
        delivery: 慈爱爽朗，沉稳中带着鼓励
        timbre: 饱满温暖
        pace: 从容
        pitch: 中低
    mr_laurence:
      display_name: 劳伦斯先生
      tts:
        delivery: 严肃直接，善意藏在简短的话里
        timbre: 低沉浑厚
        pace: 从容
        pitch: 低
    brooke:
      display_name: 布鲁克先生
      tts:
        delivery: 温和克制，礼貌中带着真诚关切
        timbre: 沉静清朗
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 第十五章 电报
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一个阴沉的下午，玛格丽特站在窗边，看着外头被霜打坏的花园。她开口抱怨说，十一月是一整年里最讨厌的月份。
        - id: ch01-b02
          speaker: jo
          text: 怪不得我偏偏生在十一月。
        - id: ch01-b03
          speaker: narrator
          text: 乔想得出了神，根本没发觉鼻尖还沾着墨。贝丝却照例往好处想，哪怕面对十一月也一样。
        - id: ch01-b04
          speaker: beth
          text: 要是现在有件特别开心的事发生，咱们一定会觉得这个月挺可爱。
        - id: ch01-b05
          speaker: meg
          text: 也许吧。可咱们家哪有开心的事？每天只知道埋头干活，今天和明天没有一点变化，能找到的乐趣又少得可怜。日子简直像踏车，怎么走也走不出去。
        - id: ch01-b06
          speaker: jo
          text: 天哪，瞧咱们愁成什么样了！可怜的梅格，也难怪你难受。别的姑娘玩得那么快活，你却一年到头干呀干。真希望我能像安排小说女主角那样安排你！你已经又漂亮又善良，我就叫一位从没想到的有钱亲戚，突然留给你一大笔遗产。你马上以继承人的身份风风光光地出门，谁从前怠慢过你，你就不理谁。然后出国游历，再满身荣华、仪态万方地回来，做一位了不起的爵爷夫人。
        - id: ch01-b07
          speaker: meg
          text: 如今哪还有人这样得到遗产。男人得工作，女人得为了钱嫁人。这个世界实在太不公平了。
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 艾米坐在角落里，用黏土捏小鸟、水果和人脸。汉娜管这些小玩意儿叫泥饼。
        - id: ch01-b09
          speaker: amy
          text: 乔和我以后会挣大钱，给你们大家花。再等十年，看我们做不做得到。
        - id: ch01-b10
          speaker: meg
          text: 我可等不了十年。你们有这份好心，我当然很感激，不过你们一个靠墨水，一个靠泥巴，我恐怕哪一样也信不过。
        - id: ch01-b11
          speaker: narrator
          text: 梅格叹口气，又去看那座霜打的花园。乔趴在桌上唉声叹气，艾米仍旧起劲地拍着黏土。坐在另一扇窗前的贝丝忽然笑了。
        - id: ch01-b12
          speaker: beth
          text: 开心的事马上就有两件。妈妈正从街上回来，劳里也大步穿过花园，看样子准有好消息。
        - id: ch01-b13
          speaker: narrator
          text: 两个人果然一起进了门。马奇太太一进来，照旧先问女儿们。
        - id: ch01-b14
          speaker: mrs_march
          text: 姑娘们，收到爸爸的信了吗？
        - id: ch01-b15
          speaker: laurie
          text: 你们谁愿意出去兜兜风？我做数学题做得脑子都打结了，想痛快跑一趟清醒清醒。天虽然阴，空气倒不错。我还要送布鲁克回家，所以外头不热闹，车里也会热闹。乔，贝丝，你们俩来吧？
        - id: ch01-b16
          speaker: jo
          text: 当然去。
        - id: ch01-b17
          speaker: meg
          text: 多谢，可我还有事。
        - id: ch01-b18
          speaker: narrator
          text: 梅格立刻拿出针线篮。她和母亲说好了，至少她自己不能总陪着年轻绅士坐车。
        - id: ch01-b19
          speaker: amy
          text: 我们三个马上就好！
        - id: ch01-b20
          speaker: narrator
          text: 艾米跑去洗手。劳里则亲昵地俯在马奇太太椅背上。
        - id: ch01-b21
          speaker: laurie
          text: 母亲大人，有没有差事交给我？
        - id: ch01-b22
          speaker: mrs_march
          text: 多谢你，亲爱的。若是方便，就替我去邮局问问吧。今天该有信，可邮差一直没来。爸爸写信向来像太阳升起那么准，可能路上耽搁了。
        - id: ch01-b23
          speaker: narrator
          text: 一阵急促的铃声打断了她。没过一会儿，汉娜拿着一封信进来。她只敢小心捏着那张纸，仿佛它随时会炸开。
        - id: ch01-b24
          speaker: hannah
          text: 太太，是那种吓人的电报。
          emotion: fearful
        - id: ch01-b25
          speaker: narrator
          text: 马奇太太一听见“电报”，立刻夺过去。纸上只有两行字。她看完便跌回椅子，脸色白得吓人，好像那张小纸真的射出一颗子弹，打中了她的心。劳里冲下楼去取水，梅格和汉娜扶住母亲，乔用发抖的声音念出了电报。
        - id: ch01-b26
          speaker: jo
          text: 马奇太太，您丈夫病势危急，请即刻赶来。S·黑尔。华盛顿，布兰克医院。
          emotion: fearful
        - id: ch01-b27
          speaker: narrator
          text: 大家屏住呼吸，屋里一下静得可怕。外面的天色也忽然暗了，整个世界仿佛转眼换了模样。姑娘们围住母亲，只觉得生活里全部的幸福和依靠都要被夺走了。
        - id: ch01-b28
          speaker: narrator
          text: 马奇太太很快又镇定下来。她重读一遍电报，朝女儿们伸出双臂。她接下来那句话，姑娘们一辈子也没有忘记。
        - id: ch01-b29
          speaker: mrs_march
          text: 我马上走，可也许已经来不及了。孩子们，孩子们，帮我撑住吧！
          emotion: sad
        - id: ch01-b30
          speaker: narrator
          text: 接连几分钟，屋里只有哭声。大家断断续续地安慰母亲，温柔又恳切地保证一定帮忙，还低声说着满怀希望的话，可这些低语说着说着，还是全消失在泪水里。可怜的汉娜最先振作。她自己没有想到，这正给大家作了榜样。对她来说，干活差不多能治一切苦痛。
        - id: ch01-b31
          speaker: hannah
          text: 愿上帝保佑亲爱的先生！现在不能把工夫都花在哭上。太太，咱们赶紧收拾您的东西。
        - id: ch01-b32
          speaker: narrator
          text: 汉娜用围裙擦干脸，拿粗糙的手紧紧握了握女主人的手，随即忙开了。她一个人干起活来，简直抵得上三个。
        - id: ch01-b33
          speaker: mrs_march
          text: 汉娜说得对。现在没时间哭。姑娘们，先镇定下来，让我想想。
          emotion: calm
        - id: ch01-b34
          speaker: narrator
          text: 可怜的女儿们竭力忍住眼泪。母亲脸色苍白，却坐得很稳。她先把自己的悲痛压到心底，好腾出心思替女儿们盘算。等她理清头绪，也想好最先该办的事，便问起劳里。
        - id: ch01-b35
          speaker: mrs_march
          text: 劳里在哪儿？
        - id: ch01-b36
          speaker: narrator
          text: 少年刚才退到了隔壁。他觉得，她们最初的悲痛太神圣，哪怕朋友也不该留在那里看。此刻一听呼唤，他赶紧跑了进来。
        - id: ch01-b37
          speaker: laurie
          text: 我在这儿，太太。求您让我做点事吧！
        - id: ch01-b38
          speaker: mrs_march
          text: 发电报告诉他们，我马上赶去。下一班火车明早开，我就坐那一班。
        - id: ch01-b39
          speaker: laurie
          text: 还要做什么？马已经备好了。您叫我去哪里、做什么都行。哪怕要跑到天涯海角，我也马上就去。
        - id: ch01-b40
          speaker: mrs_march
          text: 再到马奇姑婆那里留一封信。乔，把纸笔给我。
        - id: ch01-b41
          speaker: narrator
          text: 乔从刚誊清的稿纸上撕下一张空白背面，又把桌子拉过来。她知道，这趟遥远又凄苦的旅程只能借钱。只要能替爸爸多添一分钱，她觉得自己什么都肯做。
        - id: ch01-b42
          speaker: mrs_march
          text: 快去吧，亲爱的。可别拼命赶路，伤了自己，没有那个必要。
        - id: ch01-b43
          speaker: narrator
          text: 这句叮嘱显然白说了。五分钟以后，劳里已经骑着快马从窗前冲过去，活像在逃命。
        - id: ch01-b44
          speaker: mrs_march
          text: 乔，快去金太太家，说我不能来了。路上再照着单子把东西买齐。我得准备好护理病人的用品，医院里的东西未必够好。贝丝，去向劳伦斯先生讨两瓶陈年好酒。为了爸爸，我不怕求人，他该用最好的。艾米，叫汉娜取下黑箱子。梅格，帮我找东西吧，我脑子已经乱了一半。
        - id: ch01-b45
          speaker: narrator
          text: 她得同时写字、思量，还要一件接一件地吩咐，怎么可能不乱？梅格求母亲回到自己房里，安安静静坐上一会儿，把这些杂事都交给女儿们来办。众人像被一阵狂风卷起的树叶，立刻四下散开。一张电报就像一道恶咒，转眼把这个安宁幸福的家吹散了。
        - id: ch01-b46
          speaker: narrator
          text: 劳伦斯先生跟着贝丝匆匆赶来。凡是他能想到、可以让病人舒服些的东西，全都带来了。他还再三诚恳地答应马奇太太，她走后一定照看姑娘们，这让她安心了不少。从自己的睡袍，到亲自陪她上路，老人什么都肯拿出来。马奇太太坚决不许他长途奔波，可听见他愿意同行，脸上仍露出一丝轻松。满心忧虑的人独自远行，实在太难。劳伦斯先生看出她的心思，皱起浓眉，搓搓手，只说马上回来，便忽然大步走了。
        - id: ch01-b47
          speaker: narrator
          text: 谁也没空再想他。梅格一手拿着胶套鞋，一手端着茶，匆匆穿过门厅，忽然碰见布鲁克先生。
        - id: ch01-b48
          speaker: brooke
          text: 马奇小姐，听到这个消息，我很难过。我想陪令堂上路。劳伦斯先生正好托我去华盛顿办事，到了那里，要是能照顾她，我也会非常欣慰。
        - id: ch01-b49
          speaker: narrator
          text: 这温和沉静的声音，让心慌意乱的梅格听着十分安慰。她手里的胶套鞋掉了，茶杯也差点跟着落地。她伸出手，脸上的感激真切得很。布鲁克先生眼下牺牲的不过是一点时间和舒适，可哪怕要他付出更多，看到这副神情，也会觉得已经得到了报答。
        - id: ch01-b50
          speaker: meg
          text: 你们大家真是太好了！妈妈一定会答应。想到路上有人照顾她，我就安心多了。谢谢您，真的太感谢了！
        - id: ch01-b51
          speaker: narrator
          text: 梅格说得太诚恳，一时完全忘了自己。直到布鲁克那双俯视着她的棕色眼睛里，露出一种特别的神情，她才忽然想起手里的茶正在变凉。她赶紧领他进客厅，说自己这就去请母亲。
        - id: ch01-b52
          speaker: narrator
          text: 劳里回来时，各样事情都安排好了。他带回马奇姑婆的短信，信里还夹着他们要借的钱。姑婆在寥寥几句话里又重复了那套老话。她早就告诉过大家，马奇去参军太荒唐，也早就预言不会有好结果，希望他们下一次终于肯听她的劝。马奇太太把信扔进火里，钱收进钱包，紧紧抿住嘴唇，继续收拾行装。乔若在场，一眼就会懂得她的心情。
        - id: ch01-b53
          speaker: narrator
          text: 短短的下午一点点过去。其他差事全办妥了。梅格和母亲缝着路上必须带走的东西，贝丝和艾米准备茶点，汉娜则照她自己的话，“噼啪一顿猛干”，熨完了衣服。只有乔迟迟不回。大家渐渐担心，谁也猜不出她又会冒出什么怪念头，劳里便出去找她，可两个人偏偏错过了。
        - id: ch01-b54
          speaker: narrator
          text: 乔自己走进门时，脸上的神情古怪极了。她像要笑，又像害怕，既有称心如意的得意，又藏着一丝后悔。家里人看不懂她的脸，也同样看不懂她放到母亲面前的那卷钞票。她一开口，声音还有一点发哽。
        - id: ch01-b55
          speaker: jo
          text: 这是我的一份。拿去让爸爸过得舒服些，再把他接回家。
          emotion: sad
        - id: ch01-b56
          speaker: mrs_march
          text: 亲爱的，你从哪里弄来的？二十五美元！乔，你没干什么莽撞事吧？
        - id: ch01-b57
          speaker: jo
          text: 没有，这是我堂堂正正挣的。我没讨，没借，也没偷。卖的是我自己的东西，您不会怪我吧。
        - id: ch01-b58
          speaker: narrator
          text: 乔摘下帽子。大家这才看见，她那一头浓密的长发全没了。
        - id: ch01-b59
          speaker: family
          text: 你的头发！那么漂亮的头发！乔，你怎么舍得？那可是你唯一漂亮的地方呀。好姑娘，根本不用这样。她看着不像从前的乔了，可我更爱她了！
          emotion: surprised
        - id: ch01-b60
          speaker: narrator
          text: 贝丝心疼地搂住她剪短了头发的脑袋。乔故意装得毫不在意，可谁也没被骗过。她把棕色短发揉得更乱，竭力显得十分满意。
        - id: ch01-b61
          speaker: jo
          text: 又不影响国家的命运，贝丝，别哀号啦。正好治治我的虚荣心，我以前太看重这顶假发了。剪掉那堆乱毛，脑子说不定也更好使。现在脑袋又轻又凉，舒服极了。理发师说，很快就会长出一头卷卷的短发，像男孩子，又好看，又容易打理。我对它满意得很。所以，妈妈，请您收下这笔钱，咱们也该吃晚饭了。
        - id: ch01-b62
          speaker: mrs_march
          text: 把事情全告诉我，乔。我不大赞成，可我也不能怪你。我知道你愿意牺牲所谓的虚荣，是因为你爱爸爸。不过，亲爱的，真没必要这样。我怕你以后会后悔。
        - id: ch01-b63
          speaker: jo
          text: 我绝不后悔！
        - id: ch01-b64
          speaker: narrator
          text: 母亲并没有全盘责怪她，乔顿时轻松了许多。艾米却怎么也想不通。要她剪掉漂亮的头发，简直和剪掉脑袋一样可怕。
        - id: ch01-b65
          speaker: amy
          text: 你为什么要这样做？
        - id: ch01-b66
          speaker: narrator
          text: 大家围桌坐下。年轻人身体健康，就算正经历忧患，也照样会饿。
        - id: ch01-b67
          speaker: jo
          text: 我一心想替爸爸做点事。我和妈妈一样不愿借钱。向马奇姑婆讨九便士，她都会哇哇抱怨。梅格把一个季度的薪水全交了房租，我却只给自己买了衣服，越想越惭愧。无论如何我也得弄到钱，哪怕把鼻子割下来卖掉！
        - id: ch01-b68
          speaker: mrs_march
          text: 孩子，别觉得惭愧。你没有过冬的衣服，用自己辛苦挣的钱买的也全是最朴素的东西。
        - id: ch01-b69
          speaker: narrator
          text: 母亲看了她一眼，那目光把乔的心都暖透了。
        - id: ch01-b70
          speaker: jo
          text: 一开始我根本没想过卖头发。我一路琢磨还能做什么，急得恨不得冲进有钱的铺子，拿上东西就跑。后来我看见一家理发店的橱窗，里面挂着好几束头发，都标了价。有一束黑发还没我的浓密，竟然值四十美元。我突然想到，自己身上就有一样东西可以换钱。我马上进去，问他们收不收头发，我这一头值多少。
        - id: ch01-b71
          speaker: beth
          text: 我真不明白，你怎么敢走进去。
          emotion: surprised
        - id: ch01-b72
          speaker: jo
          text: 那是个小个子男人，看着像是一辈子只会给头发抹油。他一开始直盯着我，大概从没见过姑娘冲进店里，要卖自己的头发。他说这个颜色不时兴，所以不大想要。头发本身也不值多少钱，值钱的是后来花在上面的工夫。他还说了好些这样的话。天越来越晚，我怕当时不剪，以后就没勇气了。你们也知道，我一旦打定主意，最讨厌半途放弃。我只好求他收下，又解释了自己为什么这样着急。
        - id: ch01-b73
          speaker: jo
          text: 我说得乱七八糟，也许挺傻，却让他改了主意。他妻子听见了，很和气地劝他：“买下吧，托马斯，帮帮这位姑娘。要是我的头发能卖钱，为了我家吉米，我哪一天也肯剪。”
        - id: ch01-b74
          speaker: amy
          text: 吉米是谁？
        - id: ch01-b75
          speaker: jo
          text: 她的儿子，也在军队里。这样的事真容易让陌生人亲近起来，是不是？那男人剪头发时，她一直和我说话，让我没空多想。
        - id: ch01-b76
          speaker: meg
          text: 第一剪落下去的时候，你心里不难受吗？
        - id: ch01-b77
          speaker: jo
          text: 他准备家什时，我最后看了头发一眼，就算认真告过别了。我可从来不会为了这种小事哭鼻子。不过我承认，后来看到那一头熟悉的长发整整齐齐铺在桌上，再摸摸自己的脑袋，只剩粗短的发茬，心里真有点怪，像少了一条胳膊或一条腿。那位太太看见我一直望着头发，就替我挑出长长的一绺，让我留在身边。妈妈，我把它送给您，留着纪念我过去的光彩吧。短头发太舒服了，我大概再也不会留那头鬃毛啦。
        - id: ch01-b78
          speaker: narrator
          text: 马奇太太把那绺波浪般的栗色长发仔细叠好，收进自己的书桌。那里已经珍藏着另一绺灰白的短发，她把两绺头发放到了一起。
        - id: ch01-b79
          speaker: mrs_march
          text: 谢谢你，亲爱的。
          emotion: sad
        - id: ch01-b80
          speaker: narrator
          text: 母亲脸上的神情叫姑娘们赶紧换了话题。她们尽量说些快活的话，谈布鲁克先生的好心，说明天也许是晴天，又盼着爸爸回家养病以后，一家人能过上幸福的日子。
        - id: ch01-b81
          speaker: narrator
          text: 到了晚上十点，马奇太太放下最后一件缝好的东西，叫姑娘们都过来。谁也不想就这样上床。贝丝坐到钢琴前，弹起父亲最喜欢的赞美诗。大家开头都鼓起勇气，努力把歌唱得坚定，可唱着唱着，声音还是一个接一个哽住。最后只剩贝丝独自唱完，她把整颗心都放进了歌声里。对她来说，音乐永远是温柔的安慰。
        - id: ch01-b82
          speaker: mrs_march
          text: 上床后别再说话。明早要早起，今晚得尽量睡足。晚安，我亲爱的孩子们。
          emotion: calm
        - id: ch01-b83
          speaker: narrator
          text: 没有人愿意再唱一首。姑娘们默默亲过母亲，又轻手轻脚地上楼，安静得仿佛亲爱的爸爸就病在隔壁房间。尽管大家都遇上了这样大的忧患，贝丝和艾米还是很快睡着了。梅格却一直醒着，她短短的一生里从未想过这么沉重的心事。乔一动不动，姐姐以为她也睡熟了，直到听见一声压低的抽泣。梅格伸手一摸，碰到一张湿漉漉的脸。
        - id: ch01-b84
          speaker: meg
          text: 乔，亲爱的，怎么了？你在为爸爸哭吗？
        - id: ch01-b85
          speaker: jo
          text: 我现在不是为爸爸哭。
        - id: ch01-b86
          speaker: meg
          text: 那为什么哭？
        - id: ch01-b87
          speaker: jo
          text: 我的……我的头发！
          emotion: sad
        - id: ch01-b88
          speaker: narrator
          text: 可怜的乔终于忍不住了。她把脸埋进枕头，想压住哭声，却怎么也压不住。梅格一点也不觉得好笑，只温柔地亲她、安慰她。
        - id: ch01-b89
          speaker: jo
          text: 我不后悔。要是还能卖，明天我也愿意再卖一次。只是我心里那点爱漂亮的地方在作怪，才这样傻乎乎地哭。别告诉别人，现在已经好了。我以为你睡着了，所以偷偷为自己唯一漂亮的地方难过一会儿。你怎么还没睡？
          emotion: sad
        - id: ch01-b90
          speaker: meg
          text: 我太担心了，睡不着。
          emotion: sad
        - id: ch01-b91
          speaker: jo
          text: 想点开心的事，很快就能睡着。
        - id: ch01-b92
          speaker: meg
          text: 我试过，结果更清醒了。
        - id: ch01-b93
          speaker: jo
          text: 你想了什么？
        - id: ch01-b94
          speaker: meg
          text: 英俊的脸，尤其是眼睛。
        - id: ch01-b95
          speaker: narrator
          text: 梅格在黑暗里偷偷笑了。
        - id: ch01-b96
          speaker: jo
          text: 你最喜欢什么颜色？
        - id: ch01-b97
          speaker: meg
          text: 棕色吧，我是说，有时候。蓝眼睛也很漂亮。
        - id: ch01-b98
          speaker: narrator
          text: 乔一下笑出了声。梅格立刻严厉地命令她不许再说话，转眼又和和气气地答应，明天会替妹妹把短头发烫成卷。没过多久，梅格终于睡着了，梦见自己住进了那座空中楼阁。
        - id: ch01-b99
          speaker: narrator
          text: 时钟敲响十二点，屋里静极了。一个身影悄悄从一张床走到另一张床，抚平这边的被子，整理那边的枕头。她在每一张毫无知觉的熟睡面孔旁停下，长久又温柔地凝望。她用默默祝福的嘴唇亲吻每一个孩子，又为她们献上只有母亲才会说出的热切祷告。
        - id: ch01-b100
          speaker: narrator
          text: 她掀开窗帘，望向外面凄清的夜。就在这时，月亮从云后露出来，照亮了她。那轮月亮像一张明亮又仁慈的脸，仿佛在寂静中轻声告诉她，安心吧，亲爱的心灵，云层背后，永远有光。
