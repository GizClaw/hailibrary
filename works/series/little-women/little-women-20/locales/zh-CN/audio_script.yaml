audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，含蓄机智, timbre: 清澈柔和, pace: 从容而有变化, pitch: 中音}
    beth:
      display_name: 贝丝
      tts: {delivery: 温柔诚恳，羞怯克制, timbre: 轻柔纯净, pace: 舒缓, pitch: 中高音}
    meg:
      display_name: 梅格
      tts: {delivery: 端庄温和，偶尔显出姐姐的威严, timbre: 柔润明亮, pace: 适中, pitch: 中音}
    jo:
      display_name: 乔
      tts: {delivery: 爽直敏捷，情绪真挚, timbre: 清亮有力, pace: 稍快, pitch: 中低音}
    hannah:
      display_name: 汉娜
      tts: {delivery: 朴实果断，带着家常的关爱, timbre: 厚实温暖, pace: 稳健, pitch: 中低音}
    amy:
      display_name: 艾米
      tts: {delivery: 娇气讲究，孩子气中带着自尊, timbre: 清脆明亮, pace: 适中偏快, pitch: 高音}
    laurie:
      display_name: 劳里
      tts: {delivery: 活泼亲切，善于打趣哄人, timbre: 明朗温暖, pace: 轻快, pitch: 中音}
    aunt_march:
      display_name: 马奇姑婆
      tts: {delivery: 粗声直率，挑剔而威严, timbre: 苍老干脆, pace: 偏慢, pitch: 中低音}
    polly:
      display_name: 波莉
      tts: {delivery: 尖锐滑稽，爱学舌, timbre: 嘶哑尖亮, pace: 忽快忽慢, pitch: 高音}
    mrs_march:
      display_name: 马奇太太
      tts: {delivery: 慈爱爽朗，沉稳中带着鼓励, timbre: 饱满温暖, pace: 从容, pitch: 中低音}
  chapters:
    - id: ch01
      title: 第二十章 私房话
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 母女重逢的时刻太美，真正经历过的人反而很难把它说清楚。只需知道，这一天，马奇家里装满了真真切切的幸福。贝丝从漫长的安睡中醒来，最先映进眼帘的，是床边那朵小玫瑰，还有母亲的脸。她虚弱得顾不上惊讶，只笑了笑，往母亲怀里偎得更紧。盼了那么久的人终于回来了，她心里再也没有空缺。没过多久，她又睡着了。那只瘦弱的小手一直攥着母亲，马奇太太也始终舍不得放开。
        - id: ch01-b02
          speaker: narrator
          text: 汉娜激动得不知如何是好，便给远道归来的太太摆出一顿丰盛得惊人的早餐。梅格和乔一左一右，像两只认真喂食的小鹳，把东西一口口送到母亲嘴边。她们静静听母亲说起父亲的病情，听说布鲁克先生答应留下照料他，也听她讲暴风雪怎样拖慢了归程。一路的劳累、担忧和寒冷几乎耗尽了她的力气。幸好到家时，劳里那张满怀希望的脸迎了上来，给了她说不出的安慰。
        - id: ch01-b03
          speaker: narrator
          text: 那一天，屋里屋外仿佛属于两个世界。外面明亮又欢腾，人人都出来迎接初雪。屋里却静得像安息日。熬夜守候的人终于睡下，汉娜靠在门边，一面打瞌睡，一面守着大家。梅格和乔觉得肩上的重担一下卸了下来，闭上疲惫的眼睛，像两条挨过风浪的小船，终于停进平静的港湾。马奇太太仍守在贝丝身边，只在大椅子里稍稍歇息。她一次次醒来，看一看孩子，摸一摸孩子，像守着一件失而复得的珍宝。
        - id: ch01-b04
          speaker: narrator
          text: 劳里则赶去安慰艾米。他把家里的好消息讲得太动人，马奇姑婆也忍不住抽了抽鼻子，居然一次都没说“我早就告诉过你”。艾米很快擦干眼泪，忍住立刻回家见母亲的冲动，甚至忘了那枚绿松石戒指。她在小礼拜堂里想过的那些好念头，看来真的有了结果。马奇姑婆也赞成劳里的话，夸她真像个顶呱呱的小妇人。就连总爱捣乱的波莉也像是被她打动了，难得用最和气的调子夸奖她。
        - id: ch01-b05
          speaker: polly
          text: 好姑娘！愿上帝保佑你的纽扣。出来散散步吧，亲爱的！
          emotion: happy
        - id: ch01-b06
          speaker: narrator
          text: 艾米本来很想出门，在明亮清新的冬日里走一走，却看出劳里困得快睁不开眼，还在拼命装作精神十足。她劝他在沙发上休息，自己去给母亲写信。那封信写了很久。等她回来，劳里已经两手垫在脑后，伸直身子睡得沉沉的。马奇姑婆拉下窗帘，难得满脸慈祥地坐着，连手里的活儿也停了。
        - id: ch01-b07
          speaker: narrator
          text: 过了好一阵，大家一度以为劳里会睡到天黑。他大概真会这样睡下去，若不是艾米看见母亲时欢喜地叫出了声，把他彻底惊醒。那天城里城外一定还有许多快乐的小姑娘，但依我看，没有谁会比艾米更幸福。她坐在母亲膝上，把这些日子的委屈全说了出来。母亲赞许的笑容和温柔的抚摸，既安慰了她，也补偿了她。母女俩单独坐在小礼拜堂里。听明白它的用途后，马奇太太一点也没有反对。
        - id: ch01-b08
          speaker: mrs_march
          text: 我不但不反对，还很喜欢这里，亲爱的。你看，念珠虽然落了灰，小书已经翻旧，画上的常青枝环倒还这么美。遇到烦恼和伤心的事，能有个安静待一会儿的地方，实在很好。人的一生总有难熬的时候。只要懂得用正确的方法求助，我们就能撑过去。我的小姑娘已经慢慢懂了。
          emotion: calm
        - id: ch01-b09
          speaker: amy
          text: 是的，妈妈。等我回家，也要在大壁橱里留一个角落，放我的书，再放上我照这幅画临摹的那一张。那位妇人的脸太美，我实在画不好，不过小宝宝画得好一些，我特别喜欢。想到祂也曾经是个小孩子，我就觉得自己离祂没有那么远了。这样想，真的能帮到我。
        - id: ch01-b10
          speaker: narrator
          text: 艾米抬手指向圣母膝上微笑的圣婴。母亲看见她手上的戒指，笑了笑，没有问。艾米明白那道目光，停了一会儿，才认真解释起来。
        - id: ch01-b11
          speaker: amy
          text: 我本想跟您说这件事，后来忘了。姑婆今天叫我过去，亲了亲我，还亲手把戒指戴上。她说我让她很有面子，真想一直留我在身边。戒指太大，她又给了我这枚古怪的护戒，把绿松石固定住。妈妈，我想一直戴着它们，可以吗？
        - id: ch01-b12
          speaker: mrs_march
          text: 它们确实很漂亮。不过艾米，你还太小，不大适合戴这样的首饰。
        - id: ch01-b13
          speaker: narrator
          text: 母亲看着她胖乎乎的小手。食指上是一圈天蓝色宝石，旁边的护戒像两只紧握在一起的金色小手。
        - id: ch01-b14
          speaker: amy
          text: 我会努力不爱慕虚荣。我想戴它，并不只是因为它漂亮。我想学故事里那个戴手镯的姑娘，让它时时提醒我一件事。
        - id: ch01-b15
          speaker: mrs_march
          text: 是要提醒自己想起马奇姑婆吗？
          emotion: happy
        - id: ch01-b16
          speaker: amy
          text: 不是。我要提醒自己别再那么自私。
        - id: ch01-b17
          speaker: narrator
          text: 艾米的神情太认真了，母亲便不再笑，郑重听她说下去。
        - id: ch01-b18
          speaker: amy
          text: 最近我一直在想自己那一包坏毛病，其中最大的一样就是自私。我想尽力把它改掉。贝丝从不自私，所以人人都爱她。一想到可能失去她，大家就难过极了。如果换成我生病，别人不会这样伤心，我也不配让他们这样。可是我希望许多朋友都爱我，也希望我不在时，他们会想我。所以，我要尽量学得像贝丝。我总是忘记自己的决心。要是能一直带着一样东西提醒我，也许会做得好一些。妈妈，我们能不能试试？
          emotion: sad
        - id: ch01-b19
          speaker: mrs_march
          text: 可以。不过比起戒指，我更相信大壁橱里的那个角落。你就戴着它，好好努力吧。真心想做一个好人，这场仗便已经赢了一半。我得回贝丝身边了。打起精神，小女儿，我们很快就会接你回家。
          emotion: calm
        - id: ch01-b20
          speaker: narrator
          text: 晚上，梅格写信给父亲，告诉他母亲已经平安到家。乔悄悄溜上楼，走进贝丝的房间。母亲还坐在老地方。乔站了片刻，手指不安地绞着头发，脸上满是犹豫。
        - id: ch01-b21
          speaker: mrs_march
          text: 怎么啦，宝贝？
        - id: ch01-b22
          speaker: narrator
          text: 马奇太太朝她伸出手，温柔的神情让人什么心事都愿意告诉她。
        - id: ch01-b23
          speaker: jo
          text: 妈妈，我有件事非告诉您不可。
        - id: ch01-b24
          speaker: mrs_march
          text: 是梅格的事吧？
        - id: ch01-b25
          speaker: jo
          text: 您怎么立刻就猜中了？对，就是她。事情虽然不大，却一直搅得我不安。
        - id: ch01-b26
          speaker: mrs_march
          text: 贝丝睡着了，你小声些，慢慢讲。莫法特没有来过吧？
        - id: ch01-b27
          speaker: jo
          text: 没有。他敢来，我准当着他的面关门。事情是这样的。去年夏天，梅格把一双手套忘在劳伦斯家，后来只拿回来一只。大家本来早忘了，泰迪却告诉我，布鲁克先生亲口承认他喜欢梅格，只是不敢说，因为她年纪太小，他自己又太穷。您听听，这还不够糟吗？
          emotion: angry
        - id: ch01-b28
          speaker: mrs_march
          text: 那你觉得，梅格也在意他吗？
        - id: ch01-b29
          speaker: jo
          text: 老天，我哪懂爱情那一套胡闹事！小说里的姑娘一动心，就会吓一跳、红了脸、晕过去，还会瘦下来，做事像个傻瓜。梅格什么都没有。她照常吃喝睡觉，明白得很。我提到那个人，她会直盯着我。只有泰迪拿情人打趣，她才红一点脸。我已经不许泰迪说了，可他根本不肯听我的。
        - id: ch01-b30
          speaker: mrs_march
          text: 所以你认为，梅格对约翰并没有那份心？
        - id: ch01-b31
          speaker: jo
          text: 谁？
          emotion: surprised
        - id: ch01-b32
          speaker: mrs_march
          text: 布鲁克先生呀。我现在叫他约翰。我们在医院里不知不觉这样叫惯了，他自己也喜欢。
        - id: ch01-b33
          speaker: jo
          text: 哎呀，我就知道您一定会帮他说话！他对爸爸好过，您自然不会把他赶走。只要梅格愿意，您还会让她嫁给他。这个卑鄙鬼，先哄爸爸开心，再帮您的忙，原来是想骗您喜欢他！
          emotion: angry
        - id: ch01-b34
          speaker: narrator
          text: 乔越说越气，又狠狠揪了一把自己的头发。
        - id: ch01-b35
          speaker: mrs_march
          text: 先别生气，亲爱的，听我把经过说完。约翰是应劳伦斯先生的请求陪我去的。他尽心照料可怜的爸爸，我们怎么可能不喜欢他？谈到梅格时，他也始终坦坦荡荡。他告诉我们，他爱她，但要先挣出一个舒适的家，再向她求婚。他只求我们准许他爱梅格，为她努力，也准许他尽力赢得她的心。这个年轻人确实很好，我们不能连听也不听。不过梅格这么小，我绝不会准她订婚。
        - id: ch01-b36
          speaker: jo
          text: 那当然，订婚简直蠢透了！我早就觉得有人在暗中捣鬼，果然如此，而且比我想的还要糟。我真希望自己能娶梅格，这样就能把她好好留在家里。
        - id: ch01-b37
          speaker: narrator
          text: 这个古怪的主意让马奇太太笑了，但她很快又认真起来。
        - id: ch01-b38
          speaker: mrs_march
          text: 乔，我信得过你，所以你先别把这件事告诉梅格。等约翰回来，我亲眼看看他们相处的样子，才能判断她究竟有没有喜欢上他。
        - id: ch01-b39
          speaker: jo
          text: 她只要看见自己总夸的那双漂亮眼睛，就全完了！她的心那么软，谁含情脉脉地看她一眼，那颗心就会像太阳下的黄油一样化掉。泰迪带回来的简短消息，她翻的次数比您的信还多。我一提，她就掐我。她偏偏喜欢棕色眼睛，也不觉得约翰这个名字难听。接下来她准会爱上他，我们再也别想安安静静、快快活活地聚在一起了。我都看得见！他们会在家里到处谈情说爱，害我们躲来躲去。梅格满脑子只有他，再也不理我。布鲁克不知从哪里弄到一笔钱，把她带走，在咱们家挖出一个大洞。我会伤透心，日子也会变得讨厌极了。唉，我们为什么不全是男孩子？那样就省事了！
          emotion: angry
        - id: ch01-b40
          speaker: narrator
          text: 乔把下巴搁在膝头，沮丧地缩成一团，还冲那个可恶的约翰挥了挥拳头。马奇太太叹了口气。乔听见以后，反倒松快起来。
        - id: ch01-b41
          speaker: jo
          text: 妈妈，原来您也不喜欢这件事？太好了。我们把他打发走，半个字也不告诉梅格，大家还像以前那样快乐地过日子吧。
        - id: ch01-b42
          speaker: mrs_march
          text: 刚才那口气是我不该叹，乔。将来你们各自有自己的家，本来就是自然又正确的事。可我还是想尽量多留我的姑娘们几年，也难过事情来得这么早。梅格才十七岁，约翰还得用几年时间才能给她一个家。你爸爸和我已经说好，她二十岁以前不能许下任何承诺，也不能结婚。要是他们真心相爱，就等得起，还能在等待中考验这份感情。梅格有良心，我不担心她会刻薄地对待约翰。我的漂亮姑娘有一颗那么柔软的心，我只盼她一切都好。
        - id: ch01-b43
          speaker: jo
          text: 您难道不更希望她嫁给一个有钱人吗？
        - id: ch01-b44
          speaker: mrs_march
          text: 钱是好东西，也很有用。我希望你们永远不会被贫穷逼得太苦，也不会被太多钱诱惑。要是约翰能在一门正当事业里稳稳站住，收入足够让他不欠债，也让梅格过得舒服，我当然高兴。但我不替女儿们贪求万贯家财、显赫地位和响亮名声。如果身份和财富同爱情、品德一起来，我会感激地接受，也会为你们的好运高兴。不过我亲身知道，一座简朴的小屋也能装下真正的幸福。人们靠自己挣来每天的面包，偶尔缺少一点东西，那几样不多的快乐反而更甜。让梅格从清贫中起步，我并不难过。若我没有看错，她会拥有一个好男人的心，那比一大笔财产更宝贵。
        - id: ch01-b45
          speaker: jo
          text: 我明白，也赞成。可梅格的事还是让我失望。我本来早就安排好，让她以后嫁给泰迪，一辈子舒舒服服地享福。那不是很好吗？
        - id: ch01-b46
          speaker: mrs_march
          text: 可他比梅格年纪小呀。
        - id: ch01-b47
          speaker: jo
          text: 只小一点点！他比同龄人成熟，又长得高。只要愿意，他的举止完全可以像个大人。他还有钱，慷慨又善良，也爱我们每一个人。我的好计划就这么泡汤了，实在可惜。
        - id: ch01-b48
          speaker: mrs_march
          text: 我怕劳里还不够成熟，不适合梅格。眼下他又太反复无常，谁也不能放心依靠他。别替朋友们安排姻缘，乔，让时间和他们自己的心来配对。我们插手这种事很容易闯祸。你嘴里的那些浪漫废话，也别装进脑袋，免得最后毁掉大家的友谊。
        - id: ch01-b49
          speaker: jo
          text: 好吧，我不再安排了。可我就是受不了事情东绕西缠，乱成一团。明明这里拉一下，那里剪一刀，就能全部理顺。我真希望在脑袋上压块熨斗，就能让我们永远长不大。偏偏花苞总要开成玫瑰，小猫总要变成大猫，真可惜！
        - id: ch01-b50
          speaker: meg
          text: 你们在说什么熨斗和猫？
        - id: ch01-b51
          speaker: narrator
          text: 梅格拿着写好的信，轻轻走进房间。
        - id: ch01-b52
          speaker: jo
          text: 只是我又说了一句蠢话。我要睡觉了。走吧，佩吉。
        - id: ch01-b53
          speaker: narrator
          text: 乔把蜷着的身子舒展开，活像一块忽然动起来的拼图。
        - id: ch01-b54
          speaker: mrs_march
          text: 信写得完全正确，字也漂亮。请再加一句，就说我向约翰致意。
        - id: ch01-b55
          speaker: narrator
          text: 马奇太太看完信，把它交回梅格手里。
        - id: ch01-b56
          speaker: meg
          text: 您现在叫他约翰吗？
        - id: ch01-b57
          speaker: narrator
          text: 梅格笑着垂下那双纯真的眼睛，望进母亲的眼里。
        - id: ch01-b58
          speaker: mrs_march
          text: 是啊。他待我们就像儿子一样，我们都很喜欢他。
        - id: ch01-b59
          speaker: narrator
          text: 母亲也用敏锐的目光回望着她。
        - id: ch01-b60
          speaker: meg
          text: 我真高兴，他实在太孤单了。晚安，亲爱的妈妈。您在这里，真让人舒服得说不出来。
        - id: ch01-b61
          speaker: narrator
          text: 母亲给了她一个格外温柔的吻。梅格走出房间后，马奇太太的声音里既有欣慰，也有一丝遗憾。
        - id: ch01-b62
          speaker: mrs_march
          text: 她现在还没有爱上约翰，不过很快就会学会了。
