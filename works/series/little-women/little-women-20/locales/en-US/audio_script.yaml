audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "warm, observant, and gently playful", timbre: "clear and inviting", pace: measured, pitch: medium}
    meg:
      display_name: Meg
      tts: {delivery: "graceful, earnest, and sisterly", timbre: "soft and polished", pace: measured, pitch: medium}
    jo:
      display_name: Jo
      tts: {delivery: "spirited, blunt, and quick to laugh", timbre: "bright and slightly husky", pace: lively, pitch: medium-low}
    amy:
      display_name: Amy
      tts: {delivery: "proper, dramatic, and confidently young", timbre: "clear and delicate", pace: measured, pitch: high}
    marmee:
      display_name: Marmee
      tts: {delivery: "loving, steady, and encouraging", timbre: "warm and full", pace: unhurried, pitch: medium-low}
    polly:
      display_name: Polly
      tts: {delivery: "mischievous, abrupt, and imitative", timbre: "raspy and birdlike", pace: brisk, pitch: high}
  chapters:
    - id: ch01
      title: Mother Comes Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There are hardly words for the moment when Mother and her daughters were together again. Some hours are wonderful to live through and almost impossible to tell. The house was full of true happiness. And Meg's quiet hope came true. When Beth opened her eyes after her long, healing sleep, the first things she saw were the little rose and Mother's face.
        - id: ch01-b02
          speaker: narrator
          text: Beth was too weak to wonder how it had happened. She only smiled and nestled into the loving arms around her. The ache of wanting Mother was finally gone. Soon she slept again. The girls looked after Mother while she sat beside the bed, because even in sleep, Beth's thin hand held tightly to hers.
        - id: ch01-b03
          speaker: narrator
          text: Hannah had made an astonishing breakfast for the traveler. Cooking was the only way she could manage all her excitement. Meg and Jo fed Mother like two dutiful young storks while she whispered about Father. He was doing better. Mr. Brooke had promised to stay and nurse him. The storm had delayed her journey home. When she finally arrived, tired from worry, cold, and exhaustion, Laurie's hopeful face had been a comfort beyond words.
        - id: ch01-b04
          speaker: narrator
          text: It was a strange and lovely day. Outside, everything shone, and the whole world seemed to be out welcoming the first snow. Inside, the house was peaceful. Everyone slept after so many hours of watching. A Sunday stillness settled over the rooms, and Hannah nodded at her post by the door.
        - id: ch01-b05
          speaker: narrator
          text: At last, Meg and Jo felt the weight lift from their shoulders. They closed their tired eyes and rested like boats that had survived a storm and reached a quiet harbor. Mother would not leave Beth. She slept in the large chair and woke again and again to look at her child, touch her, and watch over her like someone guarding a treasure that had been lost and found.
    - id: ch02
      title: Amy's Happiest Day
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Meanwhile, Laurie hurried away to comfort Amy. He told the story so well that Aunt March actually sniffed and never once said she had warned them. Amy showed real strength. Perhaps all those good thoughts in her little chapel had begun to grow. She wiped her tears, held back her impatience to see Mother, and did not even think about the turquoise ring when Aunt March praised her for behaving like a fine little woman.
        - id: ch02-b02
          speaker: narrator
          text: Even Polly seemed impressed.
        - id: ch02-b03
          speaker: polly
          text: Good girl! Bless your buttons! Come take a walk, dear!
        - id: ch02-b04
          speaker: narrator
          text: Amy would gladly have gone out into the bright winter day. Then she noticed Laurie could barely keep his eyes open, though he was trying bravely to hide it. She persuaded him to lie down on the sofa while she wrote Mother a note. She took a long time. When she came back, Laurie was fast asleep with both arms tucked under his head. Aunt March had lowered the curtains and sat doing nothing, which was very unusual kindness for her.
        - id: ch02-b05
          speaker: narrator
          text: After a while, they began to think Laurie might sleep until night. Perhaps he would have, if Amy's joyful cry at the sight of Mother had not woken him. Many little girls in and around the city must have been happy that day. Still, Amy may have been happiest of all. She sat in Mother's lap and told every one of her troubles. Mother's approving smiles and tender caresses gave her all the comfort and reward she wanted.
    - id: ch03
      title: In the Little Chapel
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Amy and Mother were alone in the little chapel. Once Amy explained why she used it, Mother had no objection at all. She looked at the dusty rosary, the little book worn from use, and the lovely picture framed with evergreen.
        - id: ch03-b02
          speaker: marmee
          text: No, dear. I like this very much. It is a wonderful idea to have a place where you can be quiet when something hurts or troubles you. Life brings us many hard times, but we can bear them if we ask for help in the right way. I believe my little girl is beginning to learn that.
          emotion: calm
        - id: ch03-b03
          speaker: amy
          text: I am, Mother. When I come home, I'm going to make a quiet corner in the big closet. I'll keep my books there, and the copy I'm trying to make of this picture. I can't draw the woman's face properly. It's too beautiful. But the baby came out better, and I love him very much. When I remember that He was once a little child, He doesn't seem so far away. That helps me.
        - id: ch03-b04
          speaker: narrator
          text: Amy pointed to the smiling Christ child on His Mother's knee. Then Mrs. March noticed something on Amy's raised hand, and she smiled. She did not say a word, but Amy understood the look. After a short pause, she spoke very seriously.
        - id: ch03-b05
          speaker: amy
          text: I meant to tell you about this, but I forgot. Aunt March gave me the ring today. She called me over, kissed me, and put it on my finger. She said I was a credit to her and that she wanted to keep me always. The ring is too large, so she gave me this funny guard to hold it on. I'd like to wear them. May I, Mother?
        - id: ch03-b06
          speaker: narrator
          text: Mother studied the plump little hand. A band of sky-blue stones circled Amy's forefinger, held in place by two tiny golden hands clasped together.
        - id: ch03-b07
          speaker: marmee
          text: They are very pretty, but I think you're still a little young for jewelry like this.
        - id: ch03-b08
          speaker: amy
          text: I'll try not to be vain. I don't want to wear it just because it's pretty. I want it to remind me of something, the way the girl in the story used her bracelet.
        - id: ch03-b09
          speaker: marmee
          text: To remind you of Aunt March?
          emotion: happy
        - id: ch03-b10
          speaker: amy
          text: No. To remind me not to be selfish.
        - id: ch03-b11
          speaker: narrator
          text: Amy looked so earnest that Mother stopped laughing and listened respectfully to her plan.
        - id: ch03-b12
          speaker: amy
          text: Lately, I've thought a great deal about my bundle of naughties. Selfishness is the biggest one in it, so I'm going to work hard to cure it if I can. Beth is never selfish. That's why everyone loves her and feels so awful when they think they might lose her. People wouldn't feel that way if I were sick. I don't deserve it. But I want many friends to love me and miss me, so I'm going to be as much like Beth as I can.
        - id: ch03-b13
          speaker: amy
          text: The trouble is, I forget my promises to myself. If I always wore something that reminded me, I think I would do better. Could we try it that way?
        - id: ch03-b14
          speaker: marmee
          text: Yes, though I trust your quiet corner more than the ring. Wear it, dear, and do your best. I think you'll succeed, because truly wanting to be good is half the battle. Now I must go back to Beth. Keep your courage, little daughter. We will have you home again soon.
          emotion: calm
    - id: ch04
      title: Jo's Secret
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: That evening, Meg wrote to Father to tell him Mother had arrived safely. Jo slipped upstairs to Beth's room. Mother was sitting in her usual place. Jo stood there for a moment, twisting her fingers through her hair. She looked worried and could not seem to begin.
        - id: ch04-b02
          speaker: marmee
          text: What is it, dear?
        - id: ch04-b03
          speaker: narrator
          text: Mother held out her hand. Her face made it easy to tell her anything.
        - id: ch04-b04
          speaker: jo
          text: I need to tell you something, Mother.
        - id: ch04-b05
          speaker: marmee
          text: Is it about Meg?
        - id: ch04-b06
          speaker: jo
          text: You guessed so quickly! Yes, it is. It may sound small, but it keeps bothering me.
        - id: ch04-b07
          speaker: marmee
          text: Beth is asleep, so speak softly and tell me everything. Mr. Moffat hasn't come here, has he?
          emotion: angry
        - id: ch04-b08
          speaker: jo
          text: No. If he had, I would've shut the door in his face.
        - id: ch04-b09
          speaker: narrator
          text: Jo settled on the floor at Mother's feet.
        - id: ch04-b10
          speaker: jo
          text: Last summer, Meg left a pair of gloves at the Laurences', and only one came back. We forgot all about it. Then Teddy told me Mr. Brooke admitted he liked Meg. He was afraid to tell her because she's so young and he's so poor. Isn't that a terrible mess?
        - id: ch04-b11
          speaker: marmee
          text: Do you believe Meg cares for him?
        - id: ch04-b12
          speaker: narrator
          text: Mother looked anxious.
        - id: ch04-b13
          speaker: jo
          text: Goodness, I don't know anything about love and all that foolishness! In novels, girls jump and blush, faint, grow thin, and behave like idiots. Meg does none of it. She eats and sleeps like a sensible person. When I mention that man, she looks me straight in the face. She only blushes a little when Teddy teases her about lovers. I tell him to stop, but he never obeys me the way he should.
        - id: ch04-b14
          speaker: marmee
          text: So you think Meg isn't interested in John?
        - id: ch04-b15
          speaker: jo
          text: Who?
          emotion: surprised
        - id: ch04-b16
          speaker: marmee
          text: Mr. Brooke. I call him John now. At the hospital, we simply got used to it, and he likes it.
        - id: ch04-b17
          speaker: jo
          text: Oh, no! I knew you'd take his side. He's been kind to Father, so now you won't send him away. You'll let him marry Meg if she wants to. What a sneaky thing to do, fussing over Papa and helping you so you'd grow fond of him!
          emotion: angry
        - id: ch04-b18
          speaker: narrator
          text: Jo gave her hair an angry pull.
        - id: ch04-b19
          speaker: marmee
          text: My dear, don't be angry. Let me tell you what really happened. John came with me because Mr. Laurence asked him to. He cared for poor Father so faithfully that we could not help becoming fond of him. And he was completely honest about Meg. He told us he loved her, but he means to earn enough for a comfortable home before he asks her to marry him.
        - id: ch04-b20
          speaker: marmee
          text: For now, he only asked our permission to love her, work for her, and try to win her love. He is an excellent young man, so we could not refuse to hear him. But I will not allow Meg to become engaged while she is so young.
        - id: ch04-b21
          speaker: jo
          text: Of course not. That would be ridiculous! I knew trouble was coming. I could feel it, and this is worse than I expected. I wish I could marry Meg myself and keep her safely in the family.
        - id: ch04-b22
          speaker: narrator
          text: That peculiar solution made Mother smile. Then she became serious again.
        - id: ch04-b23
          speaker: marmee
          text: Jo, I'm trusting you with this. Don't say anything to Meg yet. When John comes home, I'll watch them together. Then I can judge how she feels about him.
        - id: ch04-b24
          speaker: jo
          text: She'll look into those handsome eyes she keeps talking about, and that will be the end of her. Her heart is so soft, it will melt like butter in the sun if anyone gives her a loving look. She read his short reports more often than she read your letters. When I pointed that out, she pinched me. She likes brown eyes, and she doesn't even think John is an ugly name.
        - id: ch04-b25
          speaker: jo
          text: She'll fall in love, and there goes all our peace and fun and cozy time together. I can see it now. They'll wander around the house being romantic, and the rest of us will have to dodge them. Meg will think of nothing else and won't care about me anymore. Brooke will scrape up a fortune somehow, carry her away, and leave a hole in the family. I'll break my heart, and everything will be horribly uncomfortable. Why couldn't we all have been boys? Then none of this would happen!
          emotion: sad
        - id: ch04-b26
          speaker: narrator
          text: Jo rested her chin on her knees and shook her fist at the absent and thoroughly blameworthy John. Mother sighed. Jo looked up, relieved.
        - id: ch04-b27
          speaker: jo
          text: You don't like it either, do you? I'm so glad. Let's send him away, never tell Meg, and all stay happy together just as we always have.
    - id: ch05
      title: Buds Will Be Roses
      blocks:
        - id: ch05-b01
          speaker: marmee
          text: I should not have sighed, Jo. In time, it is natural and right for all of you to have homes of your own. Still, I want to keep my girls with me as long as I can. I am sorry this has happened so soon. Meg is only seventeen, and it will take John several years to make a home for her.
        - id: ch05-b02
          speaker: marmee
          text: Your father and I agree that Meg must not promise herself to anyone or marry before she is twenty. If she and John truly love one another, they can wait. Waiting will prove their love. Meg will do what is right, and I know she would never treat him cruelly. My sweet, tenderhearted girl. I hope it all turns out happily for her.
        - id: ch05-b03
          speaker: jo
          text: Wouldn't you rather she married someone rich?
        - id: ch05-b04
          speaker: narrator
          text: Mother's voice had trembled a little at the end.
        - id: ch05-b05
          speaker: marmee
          text: Money is useful and good, Jo. I hope my girls never suffer too much from not having it, and never face the temptations that come with having too much. I would like John to be settled in honest work that pays enough to keep him out of debt and let Meg live comfortably.
        - id: ch05-b06
          speaker: marmee
          text: But I don't dream of grand fortunes, fashionable lives, or famous names for my girls. If position and money came along with love and goodness, I would be grateful and enjoy your good fortune. Yet I know from my own life how much real happiness can fit inside a simple little house. The family earns its daily bread, and having only a few pleasures can make those pleasures sweeter.
        - id: ch05-b07
          speaker: marmee
          text: I would be content to see Meg begin with very little. If I judge John correctly, she would possess a good man's heart, and that is worth more than a fortune.
        - id: ch05-b08
          speaker: jo
          text: I understand, Mother, and I agree. I'm still disappointed, though. I had planned for Meg to marry Teddy someday and live in luxury forever. Wouldn't that have been wonderful?
        - id: ch05-b09
          speaker: narrator
          text: Jo's face brightened as she looked up.
        - id: ch05-b10
          speaker: marmee
          text: You know Laurie is younger than she is.
        - id: ch05-b11
          speaker: jo
          text: Only a little younger! He's old for his age, and he's tall. He can behave like a grown man when he wants to. He's rich and generous and good, and he loves every one of us. I still say it's a shame my plan is ruined.
        - id: ch05-b12
          speaker: marmee
          text: I'm afraid Laurie is not mature enough for Meg. Right now, he changes too quickly for anyone to rely on him. Don't arrange people's futures, Jo. Let time and their own hearts bring your friends together. It isn't safe for us to interfere in such things. And we had better keep what you call romantic rubbish out of our heads, or it may spoil the friendship we already have.
        - id: ch05-b13
          speaker: jo
          text: All right, I won't. But I hate watching everything cross and tangle when one pull here and one snip there would put it straight. I wish wearing flatirons on our heads could keep us from growing up. But buds turn into roses and kittens turn into cats. More's the pity!
        - id: ch05-b14
          speaker: meg
          text: What are you saying about flatirons and cats?
        - id: ch05-b15
          speaker: narrator
          text: Meg crept into the room with the finished letter in her hand.
        - id: ch05-b16
          speaker: jo
          text: Just one of my silly speeches. I'm going to bed. Come on, Peggy.
        - id: ch05-b17
          speaker: narrator
          text: Jo unfolded herself from the floor like a puzzle coming apart. Mother read Meg's letter and handed it back.
        - id: ch05-b18
          speaker: marmee
          text: This is exactly right, and beautifully written. Please add that I send my love to John.
        - id: ch05-b19
          speaker: meg
          text: You call him John?
        - id: ch05-b20
          speaker: narrator
          text: Meg smiled and lowered her innocent eyes toward Mother's face.
        - id: ch05-b21
          speaker: marmee
          text: Yes. He has been like a son to us, and we have grown very fond of him.
        - id: ch05-b22
          speaker: narrator
          text: Mother looked back at Meg very closely.
        - id: ch05-b23
          speaker: meg
          text: I'm glad. He is so lonely. Good night, dearest Mother. It feels better than I can say to have you here.
          emotion: happy
        - id: ch05-b24
          speaker: narrator
          text: Mother kissed her with great tenderness. When Meg had gone, Mrs. March spoke with both satisfaction and regret.
        - id: ch05-b25
          speaker: marmee
          text: She doesn't love John yet, but she soon will.
