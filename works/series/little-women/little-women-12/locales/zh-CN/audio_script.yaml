  chapters:
    - id: ch01
      title: 邮局送来的邀请
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 七月里的一天，马奇家的邮政局长贝丝捧着满满两手邮件走进屋，像个便士邮差似的满屋送信。她最常在家，也最喜欢每天打开小门，把信件和包裹准时送到每个人手里。
        - id: ch01-b02
          speaker: beth
          text: 妈妈，这是您的花。劳里一次也没忘过。
        - id: ch01-b03
          speaker: narrator
          text: 她把花插进“妈妈角”的花瓶，又把一封信和一只灰棉手套交给正在母亲身边缝袖口的梅格。
        - id: ch01-b04
          speaker: beth
          text: 马奇家的梅格小姐，一封信，还有一只手套。
        - id: ch01-b05
          speaker: meg
          text: 怪了，我明明把一双都落在那边，怎么只回来一只？你没掉在花园里吧？
        - id: ch01-b06
          speaker: beth
          text: 没有，我敢肯定。邮局里就这一只。
        - id: ch01-b07
          speaker: meg
          text: 我最烦一只手套落单。算了，也许另一只还会回来。这封信是那首德国歌的译文。字不是劳里的，大概是布鲁克先生写的。
        - id: ch01-b08
          speaker: narrator
          text: 马奇太太望了望大女儿。梅格穿着方格晨衣，额前的小卷发轻轻晃着，显得很漂亮。小工作桌上，卷成筒的白布摆得整整齐齐。她一面飞针走线，一面低声唱歌，已经有了大姑娘的模样，心里却还是少女那些纯真又清新的遐想，就像腰间别着的三色堇。她根本没猜到母亲在想什么，马奇太太看着她，满意地笑了。
        - id: ch01-b09
          speaker: beth
          text: 乔大夫也有邮件。两封信、一本书，还有一顶又旧又滑稽的大帽子，边儿都伸到邮局外面去了。
        - id: ch01-b10
          speaker: narrator
          text: 贝丝笑着进了书房。乔正忙着写作，一眼就认出那顶古董似的宽边帽是谁送的。
        - id: ch01-b11
          speaker: jo
          text: 劳里这个狡猾鬼！我跟他说，要是大帽子正流行就好了，太阳天天晒得我脸疼。他偏说，舒服就行，何必管流不流行。我还说有一顶就敢戴，他这就来考验我了。好，我偏戴给他看！
        - id: ch01-b12
          speaker: narrator
          text: 乔把帽子扣在柏拉图半身像上，先拆开母亲的信。她才读了几行，脸颊就热起来，眼睛里也有了泪光。
        - id: ch01-b13
          speaker: mrs_march
          text: 亲爱的孩子，我只想让你知道，看见你努力管住自己的脾气，我心里有多欣慰。你从不说那些挣扎、失败和成功，大概以为除了每天向他求助的那位朋友，再没有人看见。可你那本磨旧了封皮的指南，让我知道你一直很认真。你的决心已经结出果实了。耐心些，勇敢地坚持下去。永远记住，最爱你的这个人，也最愿意温柔地体谅你。
        - id: ch01-b14
          speaker: jo
          text: 这封信真给了我力量，比一百万钱、十斗夸奖都强。妈妈，我的确一直在努力。有您帮我，我会一直努力下去，绝不厌烦。
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: 乔把脸埋进手臂，几滴欢喜的眼泪落在她写的小故事上。她一直以为，没人看见，也没人珍惜她努力学好的那份心。现在，这份肯定来得这样突然，又偏偏出自她最看重的人，对她自然格外珍贵，也格外能鼓舞她。她觉得自己比从前更有力量，可以重新迎战并制服心里的魔王。她把信别在衣襟内侧，既当盾牌，也当提醒，免得没有防备时再次败下阵来。随后，她打开劳里的信，准备迎接任何好消息或坏消息。
        - id: ch01-b16
          speaker: laurie
          text: 亲爱的乔，好啊！明天有几位英国朋友来看我，我想在长草地搭帐篷，划船过去吃午饭、打槌球，再生火乱做点吃的，痛痛快快玩一天。布鲁克会管住我们几个男孩，凯特·沃恩照应姑娘们。你们一定都来，贝丝也不能缺席，谁都不许烦她。吃的全由我安排。好伙计，只管来吧！忙得要命、永远是你的劳里。
        - id: ch01-b17
          speaker: jo
          text: 这下可太好了！
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: 她飞奔出去，把消息告诉全家。
        - id: ch01-b19
          speaker: jo
          text: 妈妈，我们当然能去吧？我们还能帮劳里做不少事。我会划船，梅格能照管午饭，两个小的也一定有用。
        - id: ch01-b20
          speaker: meg
          text: 只希望沃恩家的人别太讲排场。乔，你了解他们吗？
        - id: ch01-b21
          speaker: jo
          text: 只知道有四个。凯特比你大，双胞胎弗雷德和弗兰克跟我差不多，还有个九岁或十岁的小妹妹格蕾丝。劳里在国外认识他们，很喜欢那两个男孩。不过一提凯特，他的嘴就抿得规规矩矩。我猜他不太喜欢她。
        - id: ch01-b22
          speaker: meg
          text: 幸好我的法国印花裙洗得很干净，正合适，还很衬我。乔，你有能穿的衣服吗？
        - id: ch01-b23
          speaker: jo
          text: 那套红灰划船服就够了。我又要划船，又要四处跑，可不想老惦记裙子平不平整。贝蒂，你去吗？
        - id: ch01-b24
          speaker: beth
          text: 只要你别让那些男孩跟我说话。
        - id: ch01-b25
          speaker: jo
          text: 一个也不让。
        - id: ch01-b26
          speaker: beth
          text: 我愿意让劳里高兴，也不怕布鲁克先生，他很和气。可我不想玩，不唱歌，也不说话。我会好好帮忙，不给人添麻烦。你肯照顾我，我就去。
        - id: ch01-b27
          speaker: jo
          text: 这才是我的好姑娘。你真的在努力克服害羞，所以我更爱你了。我知道，跟自己的坏毛病打仗有多难。有时候一句鼓励，就能把人托起来。妈妈，谢谢您。
        - id: ch01-b28
          speaker: narrator
          text: 乔亲了亲母亲清瘦的脸。对马奇太太来说，这个吻比重新拥有年轻时红润圆满的面容还珍贵。
        - id: ch01-b29
          speaker: amy
          text: 我收到一盒巧克力，还有那幅一直想临摹的画。
        - id: ch01-b30
          speaker: beth
          text: 劳伦斯先生也写了便条，请我今晚点灯以前过去给他弹琴。我会去的。
        - id: ch01-b31
          speaker: narrator
          text: 贝丝和老先生的友情一天比一天深了。乔也收起笔，准备换上扫帚。
        - id: ch01-b32
          speaker: jo
          text: 好啦，大家快转起来。今天做双份的活，明天才能玩得心安理得。
    - id: ch02
      title: 营地与槌球赛
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天一早，太阳照进姑娘们的房间，也照见一幅怪有趣的景象。梅格额前多卷了一排小纸卷，乔在晒伤的脸上厚厚涂了冷霜，贝丝把乔安娜抱上床，好补偿即将同玩偶分开的时间。艾米更了不得，她在鼻子上夹着画画用的衣夹，想把那处不满意的地方抬高一点。乔睁眼一看，笑得把姐妹们全吵醒了。
        - id: ch02-b02
          speaker: narrator
          text: 太阳仿佛也被艾米鼻子上的怪装饰逗乐了，忽然放出灿烂的光。阳光和笑声都是游乐会的好兆头。两家很快忙成一片，最早收拾好的贝丝守在窗口，不时把隔壁的动静当成“电报”报告给大家，让姐姐妹妹们一边梳妆，一边听得更有兴致。
        - id: ch02-b03
          speaker: beth
          text: 搭帐篷的人过去了！巴克太太把午饭装进一只篮箱和一个大篮子。劳伦斯先生在看天气和风向标，真希望他也来。劳里出来了，穿得像个水手，真精神！哎呀，一车客人到了。有个高个子小姐、一个小姑娘，还有两个吓人的男孩。一个腿瘸了，还拄着拐杖，劳里怎么没告诉我们？快点，要迟到啦！咦，那不是内德·莫法特吗？梅格，是不是那次买东西时向你鞠躬的那个人？
        - id: ch02-b04
          speaker: meg
          text: 就是他。他怎么会来？我还以为他在山里。萨莉也来了，幸好赶得及时。乔，你看我这样行吗？
        - id: ch02-b05
          speaker: jo
          text: 简直是一朵雏菊。把裙子提起来，帽子戴正。歪成这样太多愁善感，一阵风就吹跑了。好啦，走吧！
        - id: ch02-b06
          speaker: meg
          text: 乔，你不会真戴那顶丑帽子吧？太荒唐了，别故意把自己弄成怪物呀。
        - id: ch02-b07
          speaker: jo
          text: 我偏要戴。它又轻又大，能遮太阳，还能逗大家开心。只要舒服，当怪物我也不在乎。
        - id: ch02-b08
          speaker: narrator
          text: 乔用红丝带把那顶老式里窝那草帽牢牢系住，大步走在前面，其余三人跟在后面。四姐妹都穿着漂亮的夏装，一张张快活的脸藏在俏皮的帽檐下。劳里跑来迎接，热情地把客人们逐一介绍给她们。问候声、说笑声一下挤满草坪，那里仿佛真的变成了一间露天会客厅。
        - id: ch02-b09
          speaker: narrator
          text: 凯特已经二十岁，衣着却很朴素。梅格看了很满意，觉得美国姑娘真该学一学。内德一再说自己是特意为梅格来的，她听得受宠若惊。乔也终于明白，劳里为什么一提凯特就抿起嘴。这位小姐满身都是“离我远一点，别碰我”的气派，跟其他姑娘轻松自在的样子完全不同。贝丝悄悄观察新来的男孩，看出腿瘸的弗兰克温和又虚弱，便不再觉得他可怕，还决定好好待他。艾米和懂礼又快活的格蕾丝默默打量彼此几分钟，也忽然成了朋友。
        - id: ch02-b10
          speaker: narrator
          text: 帐篷、午饭和槌球用具都先送走了。大家分乘两条船离岸，劳伦斯先生站在岸上挥帽送行。劳里和乔划一条船，布鲁克先生和内德划另一条。淘气的弗雷德独自划着小艇，像只受惊的水黾，绕着他们乱转，还一心想弄翻两条大船。
        - id: ch02-b11
          speaker: narrator
          text: 乔的大帽子一路立了不少功。它先惹得人人发笑，赶走了初见时的拘束，后来又扇出凉风。乔还说，要是下雨，这帽子足够替全体人遮雨。凯特认定她很古怪，却也很聪明，于是隔着一段距离冲她微笑。
        - id: ch02-b12
          speaker: narrator
          text: 梅格坐在另一条船上，位置好得叫她很高兴，正好面对两位划船人。他们一边欣赏风景，一边很有“技巧”地收起船桨。布鲁克先生严肃寡言，有一双漂亮的棕眼睛，声音也悦耳，简直像一本装满实用知识的百科全书。他很少对梅格说话，却常常看她，梅格因此相信，他并不讨厌自己。内德已经上了大学，自然摆足了新生觉得非摆不可的架子。他虽然不算聪明，性情却很随和，倒是野餐的好伙伴。萨莉一心保护白色凸纹布裙，不让它沾上污迹，又不停跟到处乱窜的弗雷德说笑。弗雷德胡闹了一路，吓得贝丝总放不下心。
        - id: ch02-b13
          speaker: narrator
          text: 长草地离得不远，两条船很快便靠了岸。眼前是一片叫人心里舒畅的绿地，三棵枝叶舒展的大橡树立在正中，旁边还有一带平坦草坪，正适合打槌球。帐篷已经搭好，球门也全插好了。年轻的主人站在岸边欢迎大家，客人们带着一片欣喜的赞叹下了船。
        - id: ch02-b14
          speaker: laurie
          text: 欢迎来到劳伦斯营地！布鲁克是总司令，我是军需总管，小伙子们都是参谋，各位女士就是连队。帐篷归你们，那棵橡树是客厅，这边是饭厅，第三棵下面是厨房。趁天气还凉快，我们先打一局，再来准备午饭。
          emotion: happy
        - id: ch02-b15
          speaker: narrator
          text: 弗兰克、贝丝、艾米和格蕾丝坐在一旁观看。布鲁克先生选了梅格、凯特和弗雷德，劳里这边则有萨莉、乔和内德。英国人打得很不错，美国人打得还要好。两队都把每一杆当成大事，一寸草地也不肯让。球槌一起一落，双方追着彩球来回奔走，简直把独立战争的精神也搬到了这片草地上。
        - id: ch02-b16
          speaker: narrator
          text: 乔和弗雷德几次发生小冲突，终于险些吵起来。乔穿过最后一道球门，却没打中木桩，正懊恼得很。排在她前面的弗雷德随后击球，球撞上门框，停在错误的一边，只差一英寸。旁边没人，他偷偷用脚尖一推，又让球在正确的一边停下，还是只差一英寸。
        - id: ch02-b17
          speaker: fred
          text: 我过门了！乔小姐，这回我先收拾掉你，再去撞木桩出局。
        - id: ch02-b18
          speaker: jo
          text: 你刚才用脚推了球，我看得清清楚楚。现在该轮到我。
          emotion: angry
        - id: ch02-b19
          speaker: fred
          text: 我拿人格担保，根本没碰它。也许球自己滚了一点，规则又没说不行。请让开，我要打木桩了。
        - id: ch02-b20
          speaker: jo
          text: 我们美国人不靠作弊赢球。你要喜欢作弊，那就请便吧。
          emotion: angry
        - id: ch02-b21
          speaker: fred
          text: 谁不知道，最会耍花招的就是美国佬。走你的吧！
          emotion: angry
        - id: ch02-b22
          speaker: narrator
          text: 弗雷德一槌把乔的球打到远处。乔张开嘴，粗鲁的话已经到了舌尖，却及时咽了回去。她一直红到额头，足足用一分钟把一道球门使劲往土里砸。弗雷德趁机击中木桩，得意地宣布自己出局。
        - id: ch02-b23
          speaker: narrator
          text: 乔走进灌木丛找那颗被打飞的球，在里面找了很久。等她重新回到场上，脸上的怒气已经收住，神色安静平和。她没有抢，也没有抱怨，只耐心等到自己的轮次。为了回到原来的位置，她接连打了好几杆。这时对方已经差不多要赢了，凯特倒数第二个出局，球正停在木桩旁边，只等最后的机会。
        - id: ch02-b24
          speaker: fred
          text: 天哪，我们完了！再会吧，凯特。乔小姐还欠我一槌，你这下肯定没戏。
        - id: ch02-b25
          speaker: narrator
          text: 大家都围过来看最后一球。乔盯着弗雷德，直到他脸红起来。
        - id: ch02-b26
          speaker: jo
          text: 我们美国佬有个习惯，对敌人向来很慷慨。尤其是已经打败他们的时候。
        - id: ch02-b27
          speaker: narrator
          text: 她没有碰凯特的球，只用漂亮的一击打中木桩，赢下了比赛。劳里把帽子扔上天，欢呼到一半才想起，不能为客人输了而喝彩。他赶紧收住声音，凑到乔旁边。
        - id: ch02-b28
          speaker: laurie
          text: 好样的，乔！他的确作弊了，我也看见了。我们不能当面拆穿，不过我敢说，他不会再来第二次。
        - id: ch02-b29
          speaker: narrator
          text: 梅格假装替乔别好一绺松掉的辫子，把妹妹拉到一旁。
        - id: ch02-b30
          speaker: meg
          text: 他真能把人气坏，可你到底忍住了。乔，我太为你高兴了。
          emotion: happy
        - id: ch02-b31
          speaker: jo
          text: 别夸我，梅格。我现在还想扇他耳光呢。要不是躲进荨麻丛，等怒火压下去一点，能把嘴闭紧，我早爆发了。现在肚子里还在咕嘟咕嘟冒泡，只盼他离我远些。
          emotion: angry
    - id: ch03
      title: 午餐与接龙故事
      blocks:
        - id: ch03-b01
          speaker: mr_brooke
          text: 该吃午饭了。军需总管，你负责生火取水。马奇小姐、萨莉小姐和我来铺桌子。谁能煮一壶好咖啡？
        - id: ch03-b02
          speaker: meg
          text: 乔会煮。
        - id: ch03-b03
          speaker: narrator
          text: 乔很高兴，最近学的厨艺总算有了露脸的机会，立刻接管咖啡壶。孩子们去捡干树枝，男孩们生火，又到附近的泉边取水。凯特坐着画素描，弗兰克同贝丝聊天。贝丝则把灯心草编成小垫子，准备拿来垫盘子。
        - id: ch03-b04
          speaker: narrator
          text: 总司令和副官们很快铺好桌布，把各样诱人的食物和饮料一一摆开，又摘来绿叶点缀，远远看去十分漂亮。乔守着咖啡壶，等香气冒出来，便郑重宣布咖啡已经煮好。人人围着这张临时饭桌坐下，痛痛快快吃起来。年轻人很少为消化不良发愁，何况刚才又运动了半天，胃口早被催了出来，这顿午餐自然格外快活。
        - id: ch03-b05
          speaker: narrator
          text: 一切都新鲜有趣，阵阵笑声惊动了附近那匹上了年纪、正在吃草的马。高低不平的桌面很有野趣，也害得杯盘事故不断。橡子掉进牛奶，小黑蚂蚁不请自来地分享点心，毛茸茸的毛虫从树上荡下来查看动静。三个白头发的孩子隔着篱笆偷看，河对岸还有一条讨厌的狗，扯开嗓子对着他们叫个不停。这样的小麻烦不但没扫兴，反倒让午餐更热闹了。
        - id: ch03-b06
          speaker: laurie
          text: 乔，给你盐。
        - id: ch03-b07
          speaker: narrator
          text: 劳里把一碟浆果递过去。乔却从奶油里捞出两只已经淹死的小蜘蛛。
        - id: ch03-b08
          speaker: jo
          text: 谢谢，我还是更喜欢蜘蛛。你的宴会样样都好，怎么还敢拿盐提醒我那顿可怕的午餐？
        - id: ch03-b09
          speaker: narrator
          text: 瓷盘不够，乔和劳里同吃一盘，两人说着笑着。
        - id: ch03-b10
          speaker: laurie
          text: 那天我玩得特别开心，到现在还觉得有趣呢。今天可不能算我的功劳，我什么也没做，全靠你、梅格和布鲁克安排。真不知道该怎么谢你们。等大家实在吃不下了，接着做什么？
        - id: ch03-b11
          speaker: jo
          text: 玩游戏，等凉快些再活动。我带了“作家牌”，凯特小姐也许还知道新游戏。去问问她吧。她是客人，你该多陪她。
        - id: ch03-b12
          speaker: laurie
          text: 你不也是客人？我本来还觉得凯特和布鲁克很相配，可布鲁克总跟梅格说话，凯特只会隔着那副可笑的夹鼻眼镜盯着他们。好，我去就是了。可别教训我讲规矩，乔，你自己最不会这个。
        - id: ch03-b13
          speaker: narrator
          text: 凯特果然知道几种新花样。姑娘们不肯再吃，男孩们实在吃不下了，大家便移到橡树下的“客厅”，玩起接龙故事。
        - id: ch03-b14
          speaker: kate
          text: 一个人先讲，什么胡话都可以。讲到最要紧的地方就停下，让下一个人接。他也得在精彩处停住。讲得好，悲剧和喜剧会混成一团，保准大家笑个痛快。布鲁克先生，请您开头吧。
        - id: ch03-b15
          speaker: narrator
          text: 凯特的口气像在发命令，梅格听了很惊讶。她尊重这位家庭教师，就像尊重任何一位绅士。布鲁克先生倒很顺从，躺在两位小姐脚边的草地上，望着阳光闪耀的河面，开始讲故事。
        - id: ch03-b16
          speaker: mr_brooke
          text: 从前有个骑士，除了一把剑和一面盾，什么也没有。他在世上闯荡了差不多二十八年，吃过许多苦，终于来到一位善良老国王的宫殿。国王有匹心爱的骏马，一直没人能驯服。骑士答应试试，虽然进展很慢，倒也一天比一天顺利。那匹小马勇敢、任性又顽皮，很快就喜欢上了新主人。骑士每天教它，还骑着它穿过城里，寻找梦中那张美丽的脸。有一天，他在一座破城堡的窗口看见了她。人们说，里面关着几位中了魔法的公主，她们天天纺线挣钱，好赎回自由。骑士很想救她们，可他太穷，只能每天从城堡前经过，盼那张甜美的脸有朝一日能来到阳光下。最后，他决定进城堡问问，自己能帮什么忙。他走上前敲门。大门猛地打开，他看见了……
        - id: ch03-b17
          speaker: kate
          text: 一位美得叫人神魂颠倒的小姐。她欣喜若狂地喊：“终于来了！”古斯塔夫伯爵也叫道：“就是她！”说完便倒在她脚下。小姐伸出洁白的手，请他起来。骑士却发誓，除非她说出解救的办法，他绝不起身。小姐告诉他，只有消灭淡紫色客厅里的暴君，她才能摆脱残酷的命运。骑士高喊：“我这就去，不胜利便战死！”他冲到淡紫色客厅，推开门，刚要进去，忽然挨了……
        - id: ch03-b18
          speaker: ned
          text: 一本希腊语大词典，正好砸在头上，是个穿黑袍的老家伙扔的。那位什么爵士醒过神，一把将暴君扔出窗外，顶着额头上的大包回去找小姐，门却锁了。他扯下窗帘做绳梯，爬到半路，绳子断了，他头朝下栽进六十英尺深的护城河。幸好他水性像鸭子，便游到城堡的小门。门口两个壮汉拦着，他把两颗脑袋撞得像坚果一样咔嚓裂开，又用惊人的力气撞破大门。里面的石阶积着一英尺厚的灰，癞蛤蟆有拳头大，蜘蛛大得能把您吓坏，马奇小姐。他爬到顶上，忽然看见一样东西，顿时喘不过气，浑身的血都凉了……
        - id: ch03-b19
          speaker: meg
          text: 一个高高的白色身影，脸上蒙着白纱，枯瘦的手提着一盏灯。它向骑士招手，悄无声息地在前面飘，领他穿过一条像坟墓一样阴冷的长廊。两旁站着模糊的铠甲人像，四周死寂，只有幽蓝的灯火。白影不时回头，纱后露出一双可怕的亮眼睛。他们来到一扇挂帘的门前，里面传出美妙的音乐。骑士正要冲进去，幽灵一把将他扯回来，还在他眼前吓人地挥着一只……
        - id: ch03-b20
          speaker: jo
          text: 鼻烟盒。骑士很有礼貌地道了谢，捏起一撮鼻烟，一口气打了七个大喷嚏，脑袋竟然掉了。幽灵哈哈大笑，又从钥匙孔看见公主们还在不停纺线。它捡起骑士，把他塞进一只大铁皮盒。盒里已经挤着十一个没脑袋的骑士，像罐头里的沙丁鱼。他们一下全站起来，开始……
        - id: ch03-b21
          speaker: narrator
          text: 乔停下来喘气，弗雷德立刻抢过话头。
        - id: ch03-b22
          speaker: fred
          text: 跳水手舞。他们越跳越欢，那座破城堡忽然变成一艘张满帆的军舰。船长大喊：“升船头帆，收紧上桅帆升降索，满舵下风，炮手就位！”一艘葡萄牙海盗船开进视野，前桅挂着墨黑的旗。船长又命令弟兄们冲上去，于是大战开始。英国人当然赢了，他们每次都赢。
        - id: ch03-b23
          speaker: jo
          text: 才不是呢！
        - id: ch03-b24
          speaker: fred
          text: 英国人抓住海盗船长，又从那艘纵帆船上直接碾过去。甲板上尸体堆成山，鲜血从下风舷的排水孔里流出去，因为先前的命令是拔出弯刀，死战到底。英国船长叫水手长副手拿前支索帆脚索捆住恶棍，不认罪就狠狠抽。葡萄牙人嘴硬得像砖，走上跳板，水手们高声欢呼。谁知那狡猾家伙跳进海里，潜到军舰下面，把船凿了个洞。军舰挂着所有船帆，一路往下沉，沉到海底，海底，海底。在那里……
        - id: ch03-b25
          speaker: sallie
          text: 哎呀，我该说什么？好吧，他们沉到海底，一位漂亮人鱼来欢迎。人鱼看见那盒无头骑士，心里很难过，就好心把他们泡进盐水，想弄明白其中的秘密。她是女人，当然好奇。后来一个潜水员下来了，人鱼答应送他一盒珍珠，请他把铁盒带上去。她想救活那些可怜的骑士，自己又搬不动。潜水员把盒子吊上岸，打开却没看见珍珠，失望地把它扔在一片荒凉的田野上。后来，这盒子被一个……
        - id: ch03-b26
          speaker: narrator
          text: 萨莉再也编不下去，艾米接了过去。
        - id: ch03-b27
          speaker: amy
          text: 一个小牧鹅姑娘发现了。她正在田里放一百只肥鹅。她可怜那些骑士，便请教一位老妇人。老妇人说，鹅什么都知道，让她去问鹅。小姑娘就问，旧脑袋全丢了，该拿什么做新脑袋。一百只鹅张开一百张嘴，一齐叫道……
        - id: ch03-b28
          speaker: laurie
          text: 卷心菜！正合适。小姑娘跑进菜园，摘来十二棵漂亮的卷心菜，安在骑士们的脖子上。他们立刻活过来，道了谢，高高兴兴上路。他们一点也没发现不同，世上这样的脑袋太多，谁也不会觉得稀奇。
        - id: ch03-b29
          speaker: laurie
          text: 我关心的那位骑士又去找美丽的脸，却听说公主们已经靠纺线赎回自由，除了一位，全都出嫁了。他慌忙骑上那匹一直陪他吃苦的小马，飞奔回城堡，想看看留下的是谁。他越过树篱，看见心爱的女王在花园里采花，便向她讨一朵玫瑰。她甜甜地说：“你得自己进来拿。我不能走到你那边，那不合规矩。”骑士想翻过去，树篱就越长越高。他想钻过去，枝叶又越长越密。骑士只好耐心地一根根折断细枝，终于开出一个小洞。他从洞里望着公主，哀求她让自己进去。公主像是没听懂，依旧安静地采玫瑰，让他自己开路。究竟进去了没有，就请弗兰克告诉大家吧。
        - id: ch03-b30
          speaker: frank
          text: 我不会讲。我本来就没参加，也从不玩这种游戏。
        - id: ch03-b31
          speaker: narrator
          text: 弗兰克忽然要替那对荒唐的情侣解围，顿时慌了。贝丝早躲到乔背后，格蕾丝已经睡着了。布鲁克先生仍望着河水，手指轻轻摆弄扣眼里的野玫瑰。
        - id: ch03-b32
          speaker: mr_brooke
          text: 这么说，那个可怜的骑士只能卡在树篱里了？
        - id: ch03-b33
          speaker: laurie
          text: 我猜公主后来送了他一束花，还替他打开了门。
        - id: ch03-b34
          speaker: narrator
          text: 劳里朝家庭教师扔了一颗橡子，自己偷偷笑起来。
    - id: ch04
      title: 真话与德语课
      blocks:
        - id: ch04-b01
          speaker: laurie
          text: 我们刚才编的都是什么胡话！多练几次，也许真能讲出聪明的东西。你们会玩“真话”吗？
        - id: ch04-b02
          speaker: meg
          text: 我希望自己会说真话。
        - id: ch04-b03
          speaker: laurie
          text: 我说的是那个游戏。
        - id: ch04-b04
          speaker: fred
          text: 怎么玩？
        - id: ch04-b05
          speaker: laurie
          text: 大家把手叠在一起，选一个数，再轮流把手抽出来。谁正好数到那个数，就得老老实实回答别人问的任何问题。很好玩的。
        - id: ch04-b06
          speaker: jo
          text: 那就试试。
        - id: ch04-b07
          speaker: narrator
          text: 凯特、布鲁克先生、梅格和内德都不参加。弗雷德、萨莉、乔和劳里把手叠好，第一轮抽中了劳里。
        - id: ch04-b08
          speaker: jo
          text: 你的英雄是谁？
        - id: ch04-b09
          speaker: laurie
          text: 我祖父和拿破仑。
        - id: ch04-b10
          speaker: sallie
          text: 在场的姑娘里，谁最漂亮？
        - id: ch04-b11
          speaker: laurie
          text: 玛格丽特。
        - id: ch04-b12
          speaker: fred
          text: 那你最喜欢谁？
        - id: ch04-b13
          speaker: laurie
          text: 当然是乔。
        - id: ch04-b14
          speaker: jo
          text: 你们问的都是什么傻问题！
        - id: ch04-b15
          speaker: narrator
          text: 劳里答得理所当然，惹得大家发笑。乔不屑地耸了耸肩。
        - id: ch04-b16
          speaker: fred
          text: 再来一轮。“真话”这个游戏还不错。
        - id: ch04-b17
          speaker: jo
          text: 对你尤其有好处。
        - id: ch04-b18
          speaker: narrator
          text: 乔低声回敬了一句。第二轮正好抽中她。
        - id: ch04-b19
          speaker: fred
          text: 你最大的毛病是什么？
        - id: ch04-b20
          speaker: jo
          text: 脾气太急。
        - id: ch04-b21
          speaker: laurie
          text: 你最想得到什么？
        - id: ch04-b22
          speaker: jo
          text: 一副靴带。
        - id: ch04-b23
          speaker: narrator
          text: 乔猜到劳里想问什么，轻轻巧巧挡了回去。
        - id: ch04-b24
          speaker: laurie
          text: 这不算真话。你得说自己真正最想要的东西。
        - id: ch04-b25
          speaker: jo
          text: 天才。你是不是很希望自己能把它送给我，劳里？
        - id: ch04-b26
          speaker: narrator
          text: 她狡黠地一笑，劳里的脸上满是失望。
        - id: ch04-b27
          speaker: sallie
          text: 你最欣赏男人的哪两种品德？
        - id: ch04-b28
          speaker: jo
          text: 勇气和诚实。
        - id: ch04-b29
          speaker: fred
          text: 现在轮到我了。
        - id: ch04-b30
          speaker: laurie
          text: 乔，好好招待他一下。
        - id: ch04-b31
          speaker: narrator
          text: 乔点点头，马上开问。
        - id: ch04-b32
          speaker: jo
          text: 你刚才打槌球时作弊了，是不是？
        - id: ch04-b33
          speaker: fred
          text: 嗯，是的，就一点点。
        - id: ch04-b34
          speaker: jo
          text: 很好！
          emotion: happy
        - id: ch04-b35
          speaker: laurie
          text: 你刚讲的故事，是不是从《海狮》里搬来的？
        - id: ch04-b36
          speaker: fred
          text: 差不多吧。
        - id: ch04-b37
          speaker: sallie
          text: 你是不是觉得英国样样都完美？
        - id: ch04-b38
          speaker: fred
          text: 要是不这么想，我才该觉得羞耻。
        - id: ch04-b39
          speaker: narrator
          text: 乔朝弗雷德点点头，两人就算讲和了。
        - id: ch04-b40
          speaker: laurie
          text: 他真是个地道的英国佬。接下来请萨莉小姐不用抽签，也回答一轮。我先问一个刺痛感情的问题。你不觉得自己有点爱卖弄风情吗？
        - id: ch04-b41
          speaker: sallie
          text: 你这没礼貌的小子！我当然不觉得。
        - id: ch04-b42
          speaker: narrator
          text: 她回答时的神态，偏偏证明了相反的事。
        - id: ch04-b43
          speaker: fred
          text: 你最讨厌什么？
        - id: ch04-b44
          speaker: sallie
          text: 蜘蛛和米布丁。
        - id: ch04-b45
          speaker: jo
          text: 那最喜欢什么？
        - id: ch04-b46
          speaker: sallie
          text: 跳舞和法国手套。
        - id: ch04-b47
          speaker: jo
          text: “真话”真是个傻游戏。还是来一局正经的“作家牌”，让脑子清醒清醒吧。
        - id: ch04-b48
          speaker: narrator
          text: 内德、弗兰克和两个小姑娘也加入牌局，其他人围过去继续热闹。三个年纪较大的人没有参加，另外坐到一旁聊天。凯特重新打开画本，一页页给梅格看，梅格坐在身边认真观看。布鲁克先生手里虽然拿着一本书，也在草地上躺得很安静，却根本没有读进去。
        - id: ch04-b49
          speaker: meg
          text: 您画得真好。我要是也会画就好了。
        - id: ch04-b50
          speaker: kate
          text: 为什么不学？我看你有鉴赏力，也有天分。
        - id: ch04-b51
          speaker: meg
          text: 我没有时间。
        - id: ch04-b52
          speaker: kate
          text: 你母亲大概更看重别的才艺吧？我母亲以前也这样。后来我偷偷上了几节课，让她看出我确实有天分，她便很乐意让我继续学了。你不能也瞒着家庭教师试试吗？
        - id: ch04-b53
          speaker: meg
          text: 我没有家庭教师。
        - id: ch04-b54
          speaker: kate
          text: 我忘了，美国小姐比我们更常去学校。爸爸说，你们的学校很不错。你上的是私立学校吧？
        - id: ch04-b55
          speaker: meg
          text: 我根本不去学校。我自己就是家庭教师。
        - id: ch04-b56
          speaker: kate
          text: 哦，原来是这样。
        - id: ch04-b57
          speaker: narrator
          text: 凯特说得客气，语气却像在说“天哪，多可怕”。她脸上的神情让梅格红了脸，也后悔自己说得太坦白。布鲁克先生立刻抬起头。
        - id: ch04-b58
          speaker: mr_brooke
          text: 美国的年轻小姐和她们的祖先一样热爱独立。她们自己挣钱生活，得到的是别人的赞赏和尊重。
        - id: ch04-b59
          speaker: kate
          text: 当然，这样做很好，也很正当。我们那里也有许多十分体面、品德高尚的年轻女子做同样的工作。贵族很愿意雇用她们，因为她们是绅士的女儿，有教养，又多才多艺。您知道的。
        - id: ch04-b60
          speaker: narrator
          text: 那种恩赐般的口气伤了梅格的自尊。她忽然觉得，自己原本就不喜欢的工作不但讨厌，甚至还低人一等。布鲁克先生打破了沉默。
        - id: ch04-b61
          speaker: mr_brooke
          text: 那首德国歌合您的心意吗，马奇小姐？
        - id: ch04-b62
          speaker: meg
          text: 很合心意，曲子特别美。不管是谁翻译的，我都非常感谢。
        - id: ch04-b63
          speaker: narrator
          text: 梅格低垂的脸一下亮了起来。
        - id: ch04-b64
          speaker: kate
          text: 你不会读德语吗？
        - id: ch04-b65
          speaker: meg
          text: 读得不太好。以前是爸爸教我，现在他不在家，也没人纠正发音。只靠自己学，进步很慢。
        - id: ch04-b66
          speaker: mr_brooke
          text: 那现在试试。这里有席勒的《玛丽·斯图亚特》，旁边还有一位喜欢教书的老师。
        - id: ch04-b67
          speaker: narrator
          text: 布鲁克先生把书放在梅格膝上，鼓励地笑了笑。
        - id: ch04-b68
          speaker: meg
          text: 太难了，我不敢读。
        - id: ch04-b69
          speaker: narrator
          text: 她心里很感激，可凯特这样才艺出众的小姐就坐在旁边，她难免害羞。
        - id: ch04-b70
          speaker: kate
          text: 我先读一点，给你壮壮胆。
        - id: ch04-b71
          speaker: narrator
          text: 凯特挑了其中最优美的一段来读。她的发音完全正确，每个字都无可挑剔，声音里却一点感情也没有。读完以后，她把书交还梅格。布鲁克先生听得很专心，却没有作任何评价。
        - id: ch04-b72
          speaker: meg
          text: 我还以为这是诗呢。
        - id: ch04-b73
          speaker: mr_brooke
          text: 有些地方的确是诗。试试这一段。
        - id: ch04-b74
          speaker: narrator
          text: 他翻到可怜的玛丽发出悲叹的地方，嘴边带着一点奇怪的笑。新老师拿一根长草叶当指针，沿着书页一行行往下移，梅格便顺从地跟着慢慢读。她起初又慢又怯，还被艰涩的词句绊住，可她的声调柔和，很有乐感。不知不觉间，那些难读的话竟都变成了诗。她渐渐沉进那个悲凉的场景，忘了身边还有听众，仿佛只为自己朗读，也替那位不幸的女王添上了一点真正的哀伤。幸好她一直没抬头，否则一看见那双棕色眼睛，这堂课准会立刻结束。
        - id: ch04-b75
          speaker: mr_brooke
          text: 真的读得很好！
          emotion: happy
        - id: ch04-b76
          speaker: narrator
          text: 他一句也没提梅格读错的地方，神情看上去确实很爱教书。凯特举起夹鼻眼镜，把眼前这幅小景仔细看了一遍，合上画本。
        - id: ch04-b77
          speaker: kate
          text: 你的口音不错，以后会读得很好。我劝你继续学，德语对家庭教师很有用。我要去看看格蕾丝，她玩得正高兴呢。
        - id: ch04-b78
          speaker: narrator
          text: 凯特走开了。她一边耸肩，一边暗想，自己可不是来陪家庭教师的，哪怕这个家庭教师年轻又漂亮。她也觉得这些美国人古怪，担心劳里跟他们待久了会被惯坏。
        - id: ch04-b79
          speaker: meg
          text: 我差点忘了，英国人多少有些瞧不起家庭教师，不像我们这样对待她们。
        - id: ch04-b80
          speaker: mr_brooke
          text: 家庭教师在英国的日子确实不好过，我自己很清楚。马奇小姐，对我们这些靠工作生活的人来说，没有比美国更好的地方了。
        - id: ch04-b81
          speaker: narrator
          text: 布鲁克先生说得满足又快活，梅格也不好意思再抱怨自己的命苦。
        - id: ch04-b82
          speaker: meg
          text: 那我很庆幸自己住在这里。我的确不喜欢这份工作，可它也给过我不少满足，我不该再抱怨。只可惜我不像您那么爱教书。
        - id: ch04-b83
          speaker: mr_brooke
          text: 如果你的学生是劳里，也许就会喜欢了。明年要失去他，我会很难过。
        - id: ch04-b84
          speaker: narrator
          text: 布鲁克先生低头用手里的草叶在地上戳洞。
        - id: ch04-b85
          speaker: meg
          text: 他明年要上大学了，是吗？
        - id: ch04-b86
          speaker: narrator
          text: 她嘴上只问了这一句，眼睛却像还在问，劳里走后，布鲁克先生要怎么办。
        - id: ch04-b87
          speaker: mr_brooke
          text: 是的，他早该去了，也已经准备好了。他一走，我就去当兵。那里需要我。
        - id: ch04-b88
          speaker: meg
          text: 我真高兴！我想每个年轻人都会愿意去，只是留在家里的母亲和姐妹一定很难受。
        - id: ch04-b89
          speaker: mr_brooke
          text: 我没有母亲，也没有姐妹，朋友也没几个。大概没什么人会在乎我的死活。
          emotion: sad
        - id: ch04-b90
          speaker: narrator
          text: 他说得有些苦涩，还心不在焉地把那朵枯萎的玫瑰放进刚挖的小洞，盖上泥土，像埋起一座小坟。
        - id: ch04-b91
          speaker: meg
          text: 劳里和他祖父一定很在乎。我们大家也都不愿意看见您受伤。
        - id: ch04-b92
          speaker: mr_brooke
          text: 谢谢。听见您这么说，真让人高兴。
          emotion: happy
        - id: ch04-b93
          speaker: narrator
          text: 布鲁克先生重新快活起来，才刚开口，内德便骑着那匹老马颠了过来。他要在年轻小姐们面前炫耀骑术，这一天也就再没有片刻安静了。
    - id: ch05
      title: 新朋友与归舟
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 众人跟着内德，在草地上绕场赛跑一圈。停下来休息时，格蕾丝问起艾米。
        - id: ch05-b02
          speaker: grace
          text: 你喜欢骑马吗？
        - id: ch05-b03
          speaker: amy
          text: 喜欢得不得了。爸爸以前有钱时，梅格姐姐常常骑马。如今我们不养马了，只有埃伦·特里。
        - id: ch05-b04
          speaker: grace
          text: 埃伦·特里是谁？是一头驴吗？
        - id: ch05-b05
          speaker: amy
          text: 乔迷马迷得发狂，我也一样，可我们只有一副旧女鞍，没有马。花园里的苹果树有根低树枝，乔把鞍子放在上面，又把缰绳系在翘起来的地方。我们只要想骑，随时都能骑上埃伦·特里颠一阵。
        - id: ch05-b06
          speaker: grace
          text: 真有意思！我家有一匹小马，我差不多每天都跟弗雷德、凯特去公园骑。朋友们也去，骑马大道上全是先生和太太，可好玩了。
        - id: ch05-b07
          speaker: amy
          text: 天哪，听着真迷人！我将来也想出国。不过跟骑马大道比起来，我还是更想去罗马。
        - id: ch05-b08
          speaker: narrator
          text: 艾米根本不知道骑马大道是什么，可她无论如何也不肯问。
        - id: ch05-b09
          speaker: narrator
          text: 弗兰克坐在两个小姑娘后面，听见了她们的谈话。他望着那些活泼的男孩做出各种滑稽的体操动作，不耐烦地把拐杖推到一旁。贝丝正收拾散落的“作家牌”，抬起头，羞怯却友好地问他。
        - id: ch05-b10
          speaker: beth
          text: 你大概累了吧。我能替你做点什么吗？
        - id: ch05-b11
          speaker: frank
          text: 跟我说说话吧。一个人坐着很闷。
        - id: ch05-b12
          speaker: narrator
          text: 对贝丝来说，就算弗兰克请她当场讲一篇拉丁文演说，也不会比这个请求更难。可她无处可逃，乔又不在身边，不能躲到姐姐背后。眼前这个可怜的男孩正满怀期待地看着她，贝丝只好鼓起勇气试一试。她摆弄纸牌，想把它们捆好，却失手掉了一半。
        - id: ch05-b13
          speaker: beth
          text: 你喜欢聊些什么？
        - id: ch05-b14
          speaker: frank
          text: 我喜欢听板球、划船和打猎的事。
        - id: ch05-b15
          speaker: narrator
          text: 弗兰克还没学会根据自己的身体状况挑选消遣。贝丝慌了，这些事她一样也不懂。为了让他自己开口，她勉强找到了一个问题。
        - id: ch05-b16
          speaker: beth
          text: 我从来没见过打猎，不过你一定很熟悉吧？
        - id: ch05-b17
          speaker: frank
          text: 从前很熟。可我跨一道该死的五横木栅栏时受了伤，以后再也不能带着马和猎犬去打猎了。
          emotion: sad
        - id: ch05-b18
          speaker: narrator
          text: 弗兰克叹了口气，贝丝立刻后悔自己无意中说错了话。
        - id: ch05-b19
          speaker: beth
          text: 你们那里的鹿，一定比我们这里难看的野牛漂亮多了。
        - id: ch05-b20
          speaker: narrator
          text: 她赶紧向大草原求助，暗自庆幸自己读过一本乔喜欢的男孩子的书。野牛这个话题果然让弗兰克舒服起来。贝丝一心想让他快活，渐渐忘了自己，也没发现姐妹们望着她有多惊喜。这个出门前还求人保护、怕男孩靠近的姑娘，如今竟跟一个“可怕的男孩”说个不停。
        - id: ch05-b21
          speaker: jo
          text: 上帝保佑她！她是同情弗兰克，才对他这么好。
          emotion: happy
        - id: ch05-b22
          speaker: meg
          text: 我早就说过，她是个小圣人。
        - id: ch05-b23
          speaker: grace
          text: 弗兰克好久没笑得这么多了。
        - id: ch05-b24
          speaker: narrator
          text: 格蕾丝和艾米正拿橡子杯当茶具，谈论各自的玩偶。贝丝这么受欢迎，艾米也觉得很得意。
        - id: ch05-b25
          speaker: amy
          text: 我姐姐贝丝只要愿意，可是个特别“挑剔迷人”的姑娘。
        - id: ch05-b26
          speaker: narrator
          text: 艾米本想说“迷人”，却错用了“挑剔”。格蕾丝也不清楚这两个词的准确意思，只觉得那个大词听着漂亮，于是照样留下了好印象。
        - id: ch05-b27
          speaker: narrator
          text: 后来，大家临时凑成一场马戏表演，又玩了“狐狸与鹅”，最后还和和气气地打了一局槌球，给这个下午收了尾。太阳落山时，帐篷拆了，篮子收好，球门一一拔出，船也重新装妥。所有人顺流而下，一路放声唱歌，白天那点争执早被抛在后面。
        - id: ch05-b28
          speaker: narrator
          text: 内德忽然多愁善感起来，唱起一首小夜曲。副歌叹着自己孤零零、可怜又孤零零。唱到“我们都年轻，也都有真心，为什么还冷冷地彼此疏远”时，他摆出一副痴情哀怨的样子望着梅格。梅格扑哧一笑，把他的歌全毁了。
        - id: ch05-b29
          speaker: ned
          text: 你怎么能对我这么残酷？你一整天都跟着那个装腔作势的英国女人，现在还要冷落我。
        - id: ch05-b30
          speaker: meg
          text: 我不是故意的。可你刚才的样子太滑稽，我实在忍不住。
        - id: ch05-b31
          speaker: narrator
          text: 梅格没有理会前半句责怪。她想起莫法特家的宴会和后来那场谈话，今天确实一直躲着内德。内德生了气，转向萨莉寻求安慰。
        - id: ch05-b32
          speaker: ned
          text: 那个姑娘一点也不会卖弄风情，对吧？
        - id: ch05-b33
          speaker: sallie
          text: 一点也不会，不过她是个很可爱的人。
        - id: ch05-b34
          speaker: narrator
          text: 萨莉承认朋友的缺点，却还是替她说话。
        - id: ch05-b35
          speaker: ned
          text: 不管怎么说，她可不是一头中箭的鹿。
        - id: ch05-b36
          speaker: narrator
          text: 内德想说句机灵话，结果和极年轻的绅士们通常的成绩差不多。
        - id: ch05-b37
          speaker: narrator
          text: 船靠岸以后，小小的游伴们又回到早上最初集合的草坪。一天的游戏结束了，大家仍舍不得立刻分开，亲亲热热地互道晚安，临别的话也说得格外亲热，因为沃恩一家很快就要动身去加拿大，这次相聚以后不会很快重来。四姐妹结伴穿过花园回家，快活的身影渐渐走远。凯特一直站在后面目送她们。这一次，她再开口时，语气里已经没有了早先那种居高临下的味道。
        - id: ch05-b38
          speaker: kate
          text: 美国姑娘的举止虽然太直白，熟悉以后倒都十分可爱。
        - id: ch05-b39
          speaker: mr_brooke
          text: 我完全同意。
