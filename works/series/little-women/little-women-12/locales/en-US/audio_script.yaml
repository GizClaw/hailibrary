  chapters:
    - id: ch01
      title: Camp Laurence
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Beth served as the family postmistress because she was home most often and could tend the little mailbox every day. She loved unlocking its door and carrying the mail through the house. One July morning, she came in with both hands full and made her deliveries from room to room.
        - id: ch01-b02
          speaker: beth
          text: Your flowers, Mother! Laurie never forgets them.
        - id: ch01-b03
          speaker: narrator
          text: She set the fresh bouquet in the vase in Marmee's corner, where Laurie's flowers always kept it filled.
        - id: ch01-b04
          speaker: beth
          text: Miss Meg March, here's one letter and one glove.
        - id: ch01-b05
          speaker: narrator
          text: Meg was sewing wristbands beside her mother. She picked up the gray cotton glove and stared at it.
        - id: ch01-b06
          speaker: meg
          text: But I left a pair over there, and this is only one. Beth, could you have dropped the other in the garden?
        - id: ch01-b07
          speaker: beth
          text: I'm certain I didn't. There was only one in the box.
        - id: ch01-b08
          speaker: meg
          text: I can't stand having one odd glove. Oh, well, perhaps the other will turn up. This letter is only the German song I wanted translated. The writing isn't Laurie's, so I think Mr. Brooke did it.
        - id: ch01-b09
          speaker: narrator
          text: Mrs. March looked at Meg and smiled. Meg was pretty in her gingham morning dress, with small curls stirring around her forehead. She looked almost grown up as she sat beside the tidy white rolls on her little worktable. Her fingers flew while she sewed and sang, and her mind wandered among innocent girlish dreams as fresh as the pansies at her waist. She had no idea what her mother was thinking, and Mrs. March was content with what she saw.
        - id: ch01-b10
          speaker: beth
          text: Two letters for Doctor Jo, plus a book and a funny old hat. The hat covered the whole post office and stuck out the door!
        - id: ch01-b11
          speaker: narrator
          text: Laughing, Beth carried the heap into the study, where Jo was writing. Jo recognized Laurie's joke at once.
        - id: ch01-b12
          speaker: jo
          text: What a sly fellow! I told him I wished large hats were fashionable because the sun burns my face every hot day. He said, "Why care about fashion? Wear a big hat and be comfortable." I told him I would if I owned one, so now he's sent this to test me. I'll wear it for the fun of it and prove I don't care what's fashionable.
        - id: ch01-b13
          speaker: narrator
          text: Jo hung the broad old hat on Plato's bust and opened her letters. The first was from her mother. As she read, her cheeks grew warm and her eyes filled.
        - id: ch01-b14
          speaker: mrs_march
          text: My dear, I want you to know how pleased I am to see you working to control your temper. You never tell me about the times you try, fail, or succeed. Perhaps you think no one sees them except the Friend whose help you ask each day, if the worn cover of your guidebook means what I believe it does. But I see them too. Your resolution is sincere, and now it is beginning to bear fruit. Keep going, dear, with patience and courage. Always remember that no one understands and cares for you more tenderly than your loving Mother.
          emotion: calm
        - id: ch01-b15
          speaker: jo
          text: That does me good! It's worth millions of dollars and mountains of praise. Oh, Marmee, I truly am trying. With you helping me, I'll keep at it and never give up.
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: Jo lowered her head onto her arms and dropped a few happy tears on the little story she had been writing. She had believed that no one noticed her struggle to be good. Because the praise came unexpectedly from the person whose approval mattered most, it gave her twice the comfort and courage. She pinned the note inside her dress as a shield and reminder against her old enemy, her temper. Then she opened the second letter, ready for whatever it held. Laurie's large, hurried handwriting filled the page.
        - id: ch01-b17
          speaker: laurie
          text: Dear Jo, what ho! Some English girls and boys are visiting tomorrow, and I want us all to have a splendid time. If the weather holds, I'll pitch my tent at Longmeadow and row everyone up for lunch and croquet. We'll build a fire, make a gypsy-style mess, and have every kind of lark. They're nice people and enjoy that sort of thing. Brooke will keep the boys in order, and Kate Vaughn will make everything proper for the girls. You must all come. I won't excuse Beth for any price, and no one will bother her. Don't worry about food or anything else. I'll arrange it all. Just come, there's a good fellow! In a tearing hurry, yours always, Laurie.
        - id: ch01-b18
          speaker: jo
          text: Now this is a treasure!
        - id: ch01-b19
          speaker: narrator
          text: Jo flew in to share the news with Meg.
        - id: ch01-b20
          speaker: jo
          text: We can go, can't we, Mother? Laurie needs us. I can row, Meg can manage lunch, and the younger girls can make themselves useful somehow.
        - id: ch01-b21
          speaker: meg
          text: I hope the Vaughns aren't terribly grand and grown-up. Do you know anything about them?
        - id: ch01-b22
          speaker: jo
          text: Only that there are four. Kate is older than you. The twins, Fred and Frank, are about my age, and Grace is nine or ten. Laurie knew them overseas and liked the boys. But when he mentioned Kate, his mouth went so stiff and proper that I don't think he admires her much.
        - id: ch01-b23
          speaker: meg
          text: I'm so glad my French-print dress is clean. It looks lovely on me and will be perfect. Jo, do you have anything presentable?
        - id: ch01-b24
          speaker: jo
          text: My red-and-gray boating suit is presentable enough. I'll be rowing and tramping around, so I don't want to worry about starched clothes. You'll come, Betty, won't you?
        - id: ch01-b25
          speaker: beth
          text: Only if you keep the boys from talking to me.
        - id: ch01-b26
          speaker: jo
          text: Not one boy shall do it!
        - id: ch01-b27
          speaker: beth
          text: I want to make Laurie happy, and Mr. Brooke doesn't frighten me because he's so kind. But I don't want to play or sing or have to say anything. I'll work hard and won't trouble anyone. If you'll look after me, Jo, then I'll go.
        - id: ch01-b28
          speaker: jo
          text: That's my good girl. You're really trying to beat your shyness, and I love you for it. I know how hard it is to fight a fault. A cheerful word can lift you up when you're struggling. Thank you, Mother.
        - id: ch01-b29
          speaker: narrator
          text: Jo kissed her mother's thin cheek gratefully. To Mrs. March, that kiss was more precious than the rosy fullness of her younger days could have been.
        - id: ch01-b30
          speaker: amy
          text: My mail brought chocolate drops and the picture I wanted to copy.
        - id: ch01-b31
          speaker: beth
          text: And Mr. Laurence sent me a note. He wants me to play the piano for him tonight before the lamps are lit, and I'm going.
        - id: ch01-b32
          speaker: narrator
          text: Beth's friendship with the old gentleman was growing beautifully.
        - id: ch01-b33
          speaker: jo
          text: Then let's hurry and do twice our usual work today. Tomorrow we can play with clear consciences.
        - id: ch01-b34
          speaker: narrator
          text: Jo traded her pen for a broom. Early the next morning, the sun looked into the sisters' room and found a ridiculous sight. Each girl had made the preparations she thought proper for the outing. Meg wore an extra row of curlpapers across her forehead. Jo had spread cold cream thickly over her poor burned face. Beth had taken her doll Joanna to bed to make up for the separation that was coming. Amy completed the picture by clipping an artist's clothespin onto her nose in hopes of lifting that troublesome feature into a better shape. Since artists used such clips to hold paper on their drawing boards, Amy considered hers entirely suitable. The sight seemed to amuse the sun. It blazed so brightly that Jo woke, saw Amy's ornament, and roused everyone with a hearty laugh.
        - id: ch01-b35
          speaker: narrator
          text: Sunshine and laughter promised a fine party. Soon both houses were bustling. Beth dressed first and stood at the window, sending reports to her sisters as they got ready.
        - id: ch01-b36
          speaker: beth
          text: There goes the man carrying the tent! Mrs. Barker is packing lunch into a hamper and a huge basket. Mr. Laurence is checking the sky and the weather vane. I wish he were coming too. There's Laurie dressed like a sailor. He looks so nice! Oh, my goodness, a carriage just arrived. There's a tall lady, a little girl, and two dreadful boys. One of them is lame, poor boy. He has a crutch, and Laurie never told us. Hurry, girls, we're late! Why, that's Ned Moffat. Meg, isn't he the man who bowed to you when we were shopping?
        - id: ch01-b37
          speaker: meg
          text: It is! How strange. I thought he was in the mountains. And there's Sallie. I'm glad she returned in time. Jo, do I look all right?
        - id: ch01-b38
          speaker: jo
          text: Fresh as a daisy. Lift your skirt, and straighten your hat. It looks sentimental tilted like that, and the first breeze will carry it away. Come on!
        - id: ch01-b39
          speaker: meg
          text: Jo, surely you aren't wearing that awful hat. It's absurd! I won't let you make such a sight of yourself.
        - id: ch01-b40
          speaker: jo
          text: I certainly am. It's wonderful. It's light, shady, and enormous. Everyone can laugh, and I don't mind looking ridiculous if I'm comfortable.
        - id: ch01-b41
          speaker: narrator
          text: Jo tied the old broad-brimmed straw hat under her chin with a red ribbon and marched away. Her sisters followed, a bright little group in summer clothes, with happy faces beneath their jaunty hats.
        - id: ch01-b42
          speaker: narrator
          text: Laurie ran to meet them and introduced his friends with great warmth. For several lively minutes, the lawn became their reception room. Meg was relieved to see that Kate, though twenty, dressed with a simplicity many American girls might have copied. Ned delighted Meg by saying he had come especially to see her. Jo quickly understood Laurie's stiff expression whenever Kate was mentioned. The young lady had a distant air that warned everyone not to come too close, quite unlike the easy manners of the other girls. Beth carefully observed the new boys and decided the one with the crutch was gentle and frail, not dreadful at all. For that reason, she meant to be especially kind to him. Amy found Grace merry and well mannered. The two younger girls stared silently at each other for several minutes, then suddenly became excellent friends.
        - id: ch01-b43
          speaker: narrator
          text: The tent, lunch, and croquet set had all gone ahead of them. Soon the party climbed into two boats and pushed away together, while Mr. Laurence stood on shore and waved his hat after them. Laurie and Jo took the oars in one boat. Mr. Brooke and Ned rowed the other. Fred, the more unruly twin, paddled around them in a small wherry like a frantic water bug and did everything he could to upset both boats.
        - id: ch01-b44
          speaker: narrator
          text: Jo's ridiculous hat proved useful. It made everyone laugh before they had time to feel awkward. As she rowed, its flapping brim stirred a pleasant breeze. Jo declared it could shelter the entire party if rain came. Kate decided Jo was odd but fairly clever, and favored her with a distant smile.
        - id: ch01-b45
          speaker: narrator
          text: Meg had a delightful seat in the other boat, directly across from the rowers. Both young men admired the view before them and handled their oars with unusual skill and care. Mr. Brooke was quiet and serious, with handsome brown eyes and a pleasant voice. Meg liked his calm manners and thought of him as a walking encyclopedia filled with useful knowledge. He rarely said much to her, but he looked at her often. From those looks, she felt quite sure that he did not regard her with dislike.
        - id: ch01-b46
          speaker: narrator
          text: Ned was a college freshman and wore all the grand airs he thought his position required. He was not very wise, but he was good-natured and perfect company for a picnic. Sallie kept watch over her clean white dress while talking with Fred, who seemed to be everywhere and terrified Beth with his tricks.
        - id: ch01-b47
          speaker: narrator
          text: Longmeadow was not far away. By the time the boats arrived, the tent stood ready and the croquet wickets were set. Three great oak trees spread their branches across a green field, with a smooth strip of grass for the game.
        - id: ch01-b48
          speaker: laurie
          text: Welcome to Camp Laurence! Brooke is commander in chief, I'm the supply officer, and the other fellows are staff officers. You ladies are the company. The tent is for you. That oak is your drawing room, this one is the dining room, and the third is our camp kitchen. Let's play before the day gets hot. Then we'll see about dinner.
        - id: ch01-b49
          speaker: narrator
          text: Frank, Beth, Amy, and Grace sat down to watch. Mr. Brooke chose Meg, Kate, and Fred for his team. Laurie took Sallie, Jo, and Ned. The English guests played well, but the Americans played better and fought for every inch as fiercely as if the Revolution had begun again. Jo and Fred clashed several times and nearly came to angry words.
        - id: ch01-b50
          speaker: narrator
          text: Jo had passed the final wicket, but missing her next stroke had put her in a bad mood. Fred came just behind her. His ball struck the wicket and stopped one inch short on the wrong side. No one stood close enough to see clearly. Fred hurried over, examined it, and secretly nudged it across with his toe.
        - id: ch01-b51
          speaker: fred
          text: I'm through! Now I'll send you off, Miss Jo, and reach the stake first.
          emotion: happy
        - id: ch01-b52
          speaker: jo
          text: You kicked your ball. I saw you do it. This is my turn.
          emotion: angry
        - id: ch01-b53
          speaker: fred
          text: I give you my word I never touched it. Perhaps it rolled a little, and that's allowed. Please move aside and let me strike the stake.
        - id: ch01-b54
          speaker: jo
          text: Americans don't cheat. You may, if that's what you choose.
          emotion: angry
        - id: ch01-b55
          speaker: fred
          text: Everyone knows Yankees are the trickiest people alive. There goes your ball!
          emotion: angry
        - id: ch01-b56
          speaker: narrator
          text: Fred struck Jo's ball and sent it far across the field. Jo's mouth opened with a rude answer ready, but she caught herself just in time. Her face turned red all the way to the hairline. For a full minute, she said nothing and drove a wicket into the ground with all her strength. Meanwhile, Fred hit the stake and loudly announced that he was out and had won his part of the game.
        - id: ch01-b57
          speaker: narrator
          text: Jo went to search for her ball in the bushes and took a long time to find it. When she returned, she looked quiet and cool and waited patiently. Several strokes brought her back, but the other team was nearly finished. Kate's ball had only one wicket left and lay close to the stake.
        - id: ch01-b58
          speaker: fred
          text: By George, we've lost! Farewell, Kate. Miss Jo owes me a blow, so you're done for.
        - id: ch01-b59
          speaker: jo
          text: Yankees sometimes show mercy to their enemies, especially after they've beaten them.
        - id: ch01-b60
          speaker: narrator
          text: The look Jo gave Fred made him blush. She left Kate's ball alone and won with one clever stroke. Laurie tossed up his hat, then remembered that a host should not cheer over his guests' defeat. He stopped halfway and leaned toward Jo.
        - id: ch01-b61
          speaker: laurie
          text: Well done, Jo! He cheated. I saw it too. We can't accuse him here, but trust me, he won't try it again.
        - id: ch01-b62
          speaker: narrator
          text: Meg drew Jo aside as if she only meant to pin up a loose braid.
        - id: ch01-b63
          speaker: meg
          text: That was terribly provoking, but you mastered your temper. I'm so glad, Jo.
        - id: ch01-b64
          speaker: jo
          text: Don't praise me. I could still box his ears. If I hadn't stayed in those nettles until I could hold my tongue, I would have boiled over. I'm only simmering now, so he'd better keep away from me.
          emotion: angry
        - id: ch01-b65
          speaker: narrator
          text: Jo bit her lips and glared at Fred from under the vast hat.
        - id: ch01-b66
          speaker: mr_brooke
          text: It's time for lunch. Supply officer, please make the fire and fetch water while Miss March, Miss Sallie, and I lay the table. Who knows how to make good coffee?
        - id: ch01-b67
          speaker: meg
          text: Jo does.
        - id: ch01-b68
          speaker: narrator
          text: Meg was glad to recommend her sister. Jo took command of the coffeepot, proud that her recent cooking lessons could be put to use. The children gathered dry sticks. The boys built the fire and brought water from a nearby spring. Kate sketched, while Frank talked with Beth as she braided rushes into little mats for plates.
        - id: ch01-b69
          speaker: narrator
          text: Mr. Brooke and his helpers soon covered the cloth with a tempting spread of food and drinks, prettily decorated with green leaves. When Jo announced that the coffee was ready, everyone settled down to a hearty meal. Young people are rarely troubled by weak appetites, and all their exercise had made them wonderfully hungry. The lunch was merry because every small thing seemed fresh and funny. Again and again, bursts of laughter startled an old horse grazing peacefully nearby.
        - id: ch01-b70
          speaker: narrator
          text: The uneven ground tipped cups and plates in every direction. Acorns fell into the milk. Tiny black ants helped themselves without an invitation, and fuzzy caterpillars swung down from the tree to inspect the feast. Three fair-haired children watched over a fence, while an unpleasant dog barked at the party from across the river.
        - id: ch01-b71
          speaker: laurie
          text: Here's some salt.
        - id: ch01-b72
          speaker: narrator
          text: Laurie passed Jo a saucer of berries.
        - id: ch01-b73
          speaker: jo
          text: No, thank you. I prefer spiders.
        - id: ch01-b74
          speaker: narrator
          text: Jo fished out two small spiders that had drowned in cream.
        - id: ch01-b75
          speaker: jo
          text: How dare you remind me of that horrible dinner I gave when everything at your picnic is so nice?
        - id: ch01-b76
          speaker: narrator
          text: They laughed and shared one plate because there was not enough china.
        - id: ch01-b77
          speaker: laurie
          text: I had a wonderful time at your dinner, and I'm still enjoying the memory. I deserve no credit for today. I haven't done a thing. You, Meg, and Brooke made it work, and I'm enormously grateful. What will we do when nobody can eat another bite?
        - id: ch01-b78
          speaker: jo
          text: Play games until it cools off. I brought Authors, and Miss Kate probably knows something new. Go ask her. She's your guest, so you ought to spend more time with her.
        - id: ch01-b79
          speaker: laurie
          text: Aren't you my guest too? I thought Kate would suit Brooke, but he keeps talking to Meg while Kate watches them through that absurd little glass. I'm going now, so don't lecture me about proper behavior. You can't manage it, Jo.
        - id: ch01-b80
          speaker: narrator
          text: Kate did know new games. When the girls refused more food and the boys could hold no more, everyone moved to the oak-tree drawing room to play Rigmarole.
        - id: ch01-b81
          speaker: kate
          text: One person begins a story, and it may be any nonsense at all. You keep going as long as you like, but stop at the most exciting moment. Then the next person continues. When people do it well, all the tragic and comic parts get mixed into a very funny jumble. Mr. Brooke, please begin.
        - id: ch01-b82
          speaker: narrator
          text: Kate's commanding manner surprised Meg, who treated the tutor with the same respect she gave any gentleman. Mr. Brooke lay on the grass at the young ladies' feet. Looking steadily toward the sunny river, he began.
        - id: ch01-b83
          speaker: mr_brooke
          text: Once there was a knight who went into the world to seek his fortune with nothing but his sword and shield. He traveled through many hard years, nearly twenty-eight of them, until he reached the palace of a good old king. The king promised a reward to anyone who could train his fine but unbroken colt. The knight accepted. Progress was slow but sure, for the colt was wild and spirited, yet soon learned to love his new master. Each day the knight rode the king's favorite through the city for its lesson. As he rode, he searched for a beautiful face he had often seen in dreams but never in life. Then one day, on a quiet street, he saw that very face at the window of a ruined castle. He asked who lived there and learned that several princesses were trapped by a spell. They had to spin all day and save money to purchase their freedom. The poor knight longed to rescue them, but he had nothing to give. Day after day he rode past, hoping to see that sweet face in the sunlight. At last he decided to enter the castle and ask how he could help. He knocked, the great door flew open, and before him stood...
        - id: ch01-b84
          speaker: kate
          text: A lady of astonishing beauty, who cried, "At last! At last!" Count Gustave fell at her feet. "It is she!" he exclaimed. The lady held out one marble-white hand and begged him to rise. But he swore he would stay on his knees until she told him how to rescue her. She said a cruel fate held her prisoner until her tyrant was destroyed. "Where is this villain?" asked the knight. "In the mauve parlor. Go, brave heart, and save me from despair." Count Gustave vowed to return victorious or die. He rushed away, threw open the mauve door, and was about to enter when he received...
        - id: ch01-b85
          speaker: ned
          text: A crushing blow from a huge Greek dictionary, thrown by an old fellow in a black robe. Sir What's-His-Name jumped up, tossed the tyrant out the window, and turned back to the lady with a lump on his forehead. But her door was locked. He tore down the curtains and made a rope ladder. Halfway down, it snapped, and he plunged headfirst into a moat sixty feet below. He swam like a duck around the castle to a small door guarded by two stout men. He knocked their heads together like nuts, smashed the door with hardly any effort, and climbed stone steps buried under a foot of dust. There were toads as large as your fist and spiders that would send you into hysterics, Miss March. At the top, he suddenly met a sight that stopped his breath and froze his blood...
        - id: ch01-b86
          speaker: meg
          text: A tall figure dressed all in white. A veil covered its face, and one wasted hand held a lamp. It beckoned and glided ahead of him through a corridor as dark and cold as a tomb. Shadowy suits of armor stood on both sides. Nothing made a sound. The lamp burned blue, and now and then the ghost turned, showing terrible shining eyes through the veil. At last they reached a curtained doorway with beautiful music behind it. The knight leaped forward, but the spirit pulled him back and waved a warning object before him. It was a...
        - id: ch01-b87
          speaker: jo
          text: Snuffbox. "Much obliged," said the knight. He took a pinch and sneezed seven times so violently that his head fell off. "Ha, ha!" laughed the ghost. Then she peeped through the keyhole at the princesses, who were spinning as fast as they could. The wicked spirit picked up the knight and packed him into a large tin box. Eleven other headless knights were already pressed inside like sardines. They all stood up and began to...
        - id: ch01-b88
          speaker: narrator
          text: Jo's grave, hollow voice sent the listeners into fits of laughter. When she paused for breath, Fred jumped in.
        - id: ch01-b89
          speaker: fred
          text: Dance a hornpipe! While they danced, the rotten old castle changed into a warship under full sail. "Raise the jib! Reef the topsail ropes! Put the helm hard down and man the guns!" roared the captain. A Portuguese pirate appeared with a flag as black as ink. "Fight and win, my lads!" shouted the captain, and a tremendous battle began. Naturally, the British won. They always do.
        - id: ch01-b90
          speaker: jo
          text: No, they don't!
          emotion: angry
        - id: ch01-b91
          speaker: fred
          text: The British captured the pirate captain and sailed straight over his schooner. Its decks were piled with dead men and blood ran from the drains because the order had been, "Draw your swords and fight to the death!" The British captain told his mate to thrash the prisoner with a rope unless he confessed his sins at once. The Portuguese captain said nothing and walked the plank while the sailors cheered. But the sly rogue dived under the warship and made a hole in her bottom. Down she sank with every sail still raised, to the bottom of the sea, sea, sea, where...
        - id: ch01-b92
          speaker: sallie
          text: Oh, dear, what can I possibly say? Well, at the bottom they met a kind mermaid. She was terribly sorry to discover the box of headless knights, so she pickled them in salt water while she tried to solve their mystery. She was curious, as women are. After a while, a diver came down. The mermaid offered him a box of pearls if he would carry the heavy box up, because she wanted the poor knights restored to life. He hauled it to the surface, opened it, and was very disappointed to find no pearls. He abandoned the box in a great empty field, where it was found by a...
        - id: ch01-b93
          speaker: amy
          text: Little goose girl who watched one hundred fat geese in that field. She felt sorry for the knights and asked an old woman how she could help them. The woman said, "Ask your geese. They know everything." So the girl asked what she should use for new heads, because the old ones were lost. All one hundred geese opened their beaks and cried...
        - id: ch01-b94
          speaker: laurie
          text: >-
