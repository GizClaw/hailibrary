  chapters:
    - id: ch01
      title: A Merry Christmas Surprise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The peaceful weeks that followed felt like sunshine after a storm. Both invalids grew stronger quickly, and Mr. March began talking about coming home early in the new year. Beth could spend all day on the study sofa now. At first, her beloved cats kept her company. Later she took up the dolls' sewing that had fallen far behind. Her once-busy legs were still weak and stiff, so Jo carried her around the house every day in her strong arms. Meg cheerfully burned and blackened her white hands while cooking tempting little dishes for their dear patient. Amy stayed true to her ring and celebrated Beth's recovery by giving away every treasure she could persuade her sisters to take.
        - id: ch01-b02
          speaker: narrator
          text: As Christmas drew near, the usual secrets and surprises filled the house. Jo kept making the family laugh with plans for ceremonies that were either impossible or wonderfully absurd. Laurie was just as unreasonable. If he had gotten his way, there would have been bonfires, skyrockets, and triumphal arches. After plenty of small battles and firm refusals, the ambitious pair seemed defeated. They walked around looking miserable, though their sad faces did not match the bursts of laughter heard whenever they were together.
        - id: ch01-b03
          speaker: narrator
          text: Several unusually mild days led up to a splendid Christmas. Hannah felt in her bones that the day would be a fine one, and she turned out to be right. Everyone and everything seemed determined to make it a success. First came a letter saying Mr. March would soon be home. Then Beth woke feeling remarkably well. They dressed her in Marmee's gift, a soft crimson merino robe, and carried her triumphantly to the window to see what Jo and Laurie had made.
        - id: ch01-b04
          speaker: narrator
          text: The Unquenchables had earned their name. Working at night like elves, they had created a comical surprise in the garden. A grand snow maiden stood there, crowned with holly. One hand held a basket of fruit and flowers, and the other held a large roll of music. A rainbow-colored afghan wrapped her cold shoulders. From her lips streamed a Christmas carol written on pink paper. It blessed Queen Bess and wished her health, peace, and happiness. It offered fruit for the busy bee, flowers to smell, music for her piano, and an afghan for her toes. There was Jo's portrait by Raphael Number Two, a red ribbon for Madam Purrer's tail, and ice cream made by lovely Meg, like Mont Blanc in a pail. The snow maiden's makers had packed their love into her snowy breast. Beth was to accept both the gift and the Alpine maid from Laurie and Jo.
        - id: ch01-b05
          speaker: narrator
          text: Beth laughed and laughed when she saw it. Laurie ran up and down bringing in the gifts, while Jo presented each one with a ridiculous speech. After all that excitement, Jo carried Beth to the study to rest and eat some of the delicious grapes sent by the snow maiden.
        - id: ch01-b06
          speaker: beth
          text: I'm so happy that if Father were here too, I couldn't hold one more drop.
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: Beth gave a deep, contented sigh.
        - id: ch01-b08
          speaker: jo
          text: That's exactly how I feel.
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: Jo patted the pocket that held the book she had wanted for so long, Undine and Sintram.
        - id: ch01-b10
          speaker: amy
          text: And so do I.
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: Amy could hardly look away from the engraved Madonna and Child that Marmee had given her in a pretty frame.
        - id: ch01-b12
          speaker: meg
          text: Of course I'm happy! How could I not be?
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: Meg smoothed the silvery folds of her first silk dress, a gift Mr. Laurence had insisted on giving her. Marmee's eyes moved gratefully from her husband's letter to Beth's smiling face. Her hand rested on the brooch the girls had just pinned to her dress, made from locks of their gray, gold, chestnut, and dark brown hair.
        - id: ch01-b14
          speaker: marmee
          text: How could I be anything but happy?
          emotion: happy
    - id: ch02
      title: One More Drop of Happiness
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Every so often, even in this busy everyday world, something happens exactly as it would in a storybook. Half an hour after everyone said they could hold only one more drop of happiness, that final drop arrived. Laurie opened the parlor door and quietly poked his head inside. He might as well have tumbled through the doorway shouting a war cry. His face could not hide his excitement, and his voice shook with joy. Everyone jumped when he spoke.
        - id: ch02-b02
          speaker: laurie
          text: There's one more Christmas present for the March family.
          emotion: happy
        - id: ch02-b03
          speaker: narrator
          text: Before he had finished, Laurie was swept aside. In his place stood a tall man muffled up to his eyes, leaning on the arm of another tall man who tried to speak but could not. Everyone rushed forward and seemed to lose all sense for several minutes. The strangest things happened, and not one person said a word.
        - id: ch02-b04
          speaker: narrator
          text: Mr. March disappeared inside four pairs of loving arms. Jo nearly fainted and had to be cared for by Laurie in the china closet. Mr. Brooke kissed Meg entirely by mistake, or so he tried to explain without much success. Amy fell over a stool and never bothered to stand up. She simply hugged her father's boots and cried over them.
        - id: ch02-b05
          speaker: narrator
          text: Marmee recovered first. She raised one hand in warning.
        - id: ch02-b06
          speaker: marmee
          text: Hush! Remember Beth.
        - id: ch02-b07
          speaker: narrator
          text: But the warning came too late. The study door flew open, and the little red robe appeared on the threshold. Joy gave strength to Beth's weak legs. She ran straight into her father's arms. What happened next need not be told. Their full hearts overflowed, carrying away the bitterness of the past and leaving only the sweetness of that moment.
        - id: ch02-b08
          speaker: narrator
          text: A hearty laugh finally brought everyone back to themselves. They found Hannah behind the door, sobbing over the fat turkey she had carried from the kitchen and forgotten to put down. When the laughter faded, Marmee began thanking Mr. Brooke for taking such faithful care of her husband. Mr. Brooke suddenly remembered that Mr. March needed rest. He grabbed Laurie, and the two made a quick escape.
        - id: ch02-b09
          speaker: narrator
          text: The two invalids were ordered to rest. They obeyed by squeezing into one large chair together and talking as fast as they could. Mr. March explained how much he had wanted to surprise them. When the fine weather came, his doctor allowed him to travel. He told them how devoted Brooke had been and called him a thoroughly honorable young man. Then he paused, glanced at Meg, who was fiercely poking the fire, and raised his eyebrows at Marmee. Marmee gave a small nod and suddenly asked whether he wanted something to eat.
        - id: ch02-b10
          speaker: narrator
          text: Jo caught the whole exchange and understood it. She marched off to get wine and beef tea, looking grim. As she slammed the door, she muttered to herself.
        - id: ch02-b11
          speaker: jo
          text: I hate honorable young men with brown eyes!
          emotion: angry
    - id: ch03
      title: Christmas Dinner
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: No Christmas dinner could ever have seemed finer than theirs that day. When Hannah sent up the turkey, it was magnificent, stuffed, browned, and decorated. The plum pudding melted in their mouths. Amy delighted in the jellies like a fly in a honey pot. Everything came out just right, which Hannah considered a mercy.
        - id: ch03-b02
          speaker: hannah
          text: My mind was so flustered, ma'am, it's a miracle I didn't roast the pudding and stuff the turkey with raisins, never mind boiling it in a cloth.
        - id: ch03-b03
          speaker: narrator
          text: Mr. Laurence and Laurie ate with the family, and so did Mr. Brooke. Jo glared darkly at him, much to Laurie's amusement. At the head of the table, two easy chairs stood side by side for Beth and her father. They made a modest meal of chicken and a little fruit. Everyone drank to one another's health, told stories, sang songs, and remembered old times. They had a thoroughly good time.
        - id: ch03-b04
          speaker: narrator
          text: A sleigh ride had been planned, but the girls refused to leave their father. The guests went home early. As twilight gathered, the happy family settled together around the fire.
    - id: ch04
      title: Pleasant Meadows
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After a long talk about all sorts of things, the room fell quiet for a moment. Jo broke the silence.
        - id: ch04-b02
          speaker: jo
          text: Do you remember last Christmas? We were all groaning about how miserable we thought it would be.
        - id: ch04-b03
          speaker: meg
          text: On the whole, it has been a rather pleasant year.
        - id: ch04-b04
          speaker: narrator
          text: Meg smiled into the fire, pleased that she had treated Mr. Brooke with dignity.
        - id: ch04-b05
          speaker: amy
          text: I think it has been a pretty hard year.
        - id: ch04-b06
          speaker: narrator
          text: Amy watched the firelight shining on her ring.
        - id: ch04-b07
          speaker: beth
          text: I'm glad it's over, because now we have you back.
          emotion: happy
        - id: ch04-b08
          speaker: narrator
          text: Beth sat on her father's knee and spoke in a whisper.
        - id: ch04-b09
          speaker: mr_march
          text: The road has been rough for my little pilgrims, especially near the end. But you have traveled bravely. I believe your burdens will begin falling away very soon.
        - id: ch04-b10
          speaker: narrator
          text: He looked with fatherly pride at the four young faces around him.
        - id: ch04-b11
          speaker: jo
          text: How can you tell? Did Mother tell you?
        - id: ch04-b12
          speaker: mr_march
          text: Very little. Small signs can tell you which way the wind is blowing, and I made several discoveries today.
        - id: ch04-b13
          speaker: meg
          text: Oh, please tell us what you discovered!
        - id: ch04-b14
          speaker: narrator
          text: Meg sat beside him. Mr. March picked up the hand resting on his chair and pointed out its rough forefinger, the burn on its back, and the few hard places on its palm.
        - id: ch04-b15
          speaker: mr_march
          text: Here is one discovery. I remember when this hand was white and smooth, and keeping it that way was your first concern. It was very pretty then, Meg, but it is far prettier to me now. These marks tell a little story. Vanity has been offered up in that burn. This firm palm has earned something better than blisters. And the sewing done by these pricked fingers will last, because every stitch was made with love. The skill that makes a home happy means more to me than white hands or fashionable accomplishments. I am proud to shake this hardworking little hand. I only hope no one asks me to give it away too soon.
        - id: ch04-b16
          speaker: narrator
          text: If Meg wanted a reward for all her patient work, she found it in her father's warm grasp and approving smile.
        - id: ch04-b17
          speaker: beth
          text: What about Jo? Please say something kind about her. She has tried so hard, and she has been so very, very good to me.
        - id: ch04-b18
          speaker: narrator
          text: Beth whispered in her father's ear. He laughed and looked at the tall girl across from him. Jo's face wore an unusually gentle expression.
        - id: ch04-b19
          speaker: mr_march
          text: Even with that curly crop, I don't see the "son Jo" I left a year ago. I see a young lady who pins her collar straight and laces her boots neatly. She no longer whistles, uses slang, or sprawls on the rug as she once did. Her face is thin and pale from worry and keeping watch, but I like looking at it. It has grown gentler, and her voice has grown softer. She doesn't come bouncing into a room now. She moves quietly and cares for a certain little person like a mother, which delights me. I do miss my wild girl. But if a strong, helpful, tenderhearted woman has taken her place, I will be quite satisfied. I don't know whether cutting her hair tamed our black sheep. I do know that in all of Washington, I could find nothing beautiful enough to buy with the twenty-five dollars my good girl sent me.
        - id: ch04-b20
          speaker: narrator
          text: For a moment, Jo's sharp eyes filled with tears. Her thin face turned rosy in the firelight as she listened. She felt that she truly had earned some of her father's praise.
        - id: ch04-b21
          speaker: amy
          text: Now Beth.
        - id: ch04-b22
          speaker: narrator
          text: Amy was eager for her own turn, but she was willing to wait.
        - id: ch04-b23
          speaker: mr_march
          text: There is so little of Beth that I'm afraid to say much, or she may slip away entirely. Still, she isn't quite as shy as she used to be.
        - id: ch04-b24
          speaker: narrator
          text: He began cheerfully, but then remembered how close he had come to losing her. He held Beth tightly, her cheek against his.
        - id: ch04-b25
          speaker: mr_march
          text: I have you safe, my Beth. God willing, I will keep you safe.
        - id: ch04-b26
          speaker: narrator
          text: The room was silent for a minute. Then he looked down at Amy, sitting on the small footstool by his feet, and stroked her shining hair.
        - id: ch04-b27
          speaker: mr_march
          text: I noticed that Amy chose drumsticks at dinner. She ran errands for her mother all afternoon, gave Meg her place tonight, and waited on everyone with patience and good humor. I also noticed that she hardly complains now or looks in the mirror. She hasn't even mentioned the very pretty ring on her hand. So I believe she has learned to think more about other people and less about herself. She has decided to shape her character as carefully as she shapes her little clay figures. I would be very proud of a graceful statue made by her. But I will be prouder still of a loving daughter who has a gift for making life beautiful for herself and for others.
        - id: ch04-b28
          speaker: narrator
          text: Amy thanked her father and told him the story of her ring. Then Jo turned to Beth.
        - id: ch04-b29
          speaker: jo
          text: What are you thinking about, Beth?
        - id: ch04-b30
          speaker: beth
          text: Today I read in Pilgrim's Progress that after many troubles, Christian and Hopeful reached a pleasant green meadow. Lilies bloomed there all year, and the pilgrims rested happily before continuing to the end of their journey. That's what we're doing now.
        - id: ch04-b31
          speaker: narrator
          text: Beth slipped out of her father's arms and went to the piano.
        - id: ch04-b32
          speaker: beth
          text: It's time to sing, and I want to sit in my old place. I'll try the shepherd boy's song that the pilgrims heard. I made the music for Father because he likes the verses.
        - id: ch04-b33
          speaker: narrator
          text: Beth sat at the dear little piano and touched the keys softly. She sang to her own accompaniment in the sweet voice they had feared they would never hear again. The old-fashioned hymn suited that evening perfectly.
        - id: ch04-b34
          speaker: beth
          text: |-
            He that is down need fear no fall,
            He that is low no pride.
            He that is humble ever shall
            Have God to be his guide.

            I am content with what I have,
            Little be it, or much.
            And, Lord! Contentment still I crave,
            Because Thou savest such.

            Fulness to them a burden is,
            That go on pilgrimage.
            Here little, and hereafter bliss,
            Is best from age to age!
