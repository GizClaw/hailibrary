audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着克制的幽默
        timbre: 清澈柔和
        pace: 从容舒展
        pitch: 中音
    beth:
      display_name: 贝丝
      tts:
        delivery: 温柔真挚，病后略显轻弱
        timbre: 甜美纤细
        pace: 舒缓
        pitch: 中高音
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情感来得快而真
        timbre: 明亮有力
        pace: 稍快
        pitch: 中音
    amy:
      display_name: 艾米
      tts:
        delivery: 讲究而伶俐，偶尔流露稚气
        timbre: 清脆
        pace: 适中
        pitch: 中高音
    meg:
      display_name: 梅格
      tts:
        delivery: 端庄温和，语气稳重
        timbre: 柔润
        pace: 适中
        pitch: 中音
    mrs_march:
      display_name: 马奇太太
      tts:
        delivery: 慈爱沉静，话语令人安心
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低音
    laurie:
      display_name: 劳里
      tts:
        delivery: 机灵热情，笑意藏不住
        timbre: 清朗
        pace: 轻快
        pitch: 中音
    mr_march:
      display_name: 马奇先生
      tts:
        delivery: 慈祥诚恳，带着父亲的欣慰
        timbre: 温暖沉稳
        pace: 从容
        pitch: 中低音
    mr_brooke:
      display_name: 布鲁克先生
      tts:
        delivery: 谦和克制，稍显拘谨
        timbre: 清正温润
        pace: 适中
        pitch: 中低音
    hannah:
      display_name: 汉娜
      tts:
        delivery: 朴实直爽，带着家常口音
        timbre: 粗暖
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 风暴后的阳光
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 风暴过去以后，家里迎来了几个宁静的星期，日子像雨后阳光一样暖。两个病人好得很快，马奇先生也来信说，新年一到便可以回家。贝丝已经能整天躺在书房的沙发上了。起初，心爱的猫儿陪她解闷。后来，她又拿起落下许多的娃娃针线。只是从前那双闲不住的腿依然僵硬无力，乔每天都用结实的手臂抱着她，在屋里四处透气。
        - id: ch01-b02
          speaker: narrator
          text: 梅格为“宝贝”做精细吃食，白净的手熏黑了，也烫伤了，她却心甘情愿。艾米则忠心遵守戒指带来的教训。为了庆祝贝丝康复，只要姐姐们肯收，她就把自己的宝贝一件件送出去。
        - id: ch01-b03
          speaker: narrator
          text: 圣诞节越来越近，家里又处处藏起秘密。乔想出一套又一套根本办不到、华丽得荒唐的庆祝仪式，常常逗得全家笑作一团。劳里也不甘落后，恨不得架起篝火，放飞焰火，再搭一座凯旋门。两个人几经交锋，挨了不少冷落，大家总算以为这对野心勃勃的伙伴已经熄了火。可他们只要凑到一起，阵阵笑声就会拆穿脸上那副沮丧样。
        - id: ch01-b04
          speaker: narrator
          text: 圣诞节前一连暖和了好几天。汉娜说，她从骨头里感觉得到，圣诞日一定格外晴朗。她果然说中了。那天人人事事都仿佛一心要让节日圆满。先是马奇先生来信，说不久就能回来。贝丝早晨也觉得精神格外好。她穿上母亲送的深红色羊毛晨袍，被大家欢欢喜喜地抬到窗前，看乔和劳里准备的献礼。
        - id: ch01-b05
          speaker: narrator
          text: 那两个“扑不灭的人”连夜忙碌，像小精灵一样变出了一份滑稽的惊喜。花园里立着一位庄严的雪姑娘。她戴着冬青花冠，一手托满篮水果鲜花，一手抱一大卷乐谱，冰凉的肩头围着彩虹般的阿富汗毛毯。嘴里还伸出一条粉红纸带，上面写着一首献给贝丝的圣诞颂歌。
        - id: ch01-b06
          speaker: narrator
          text: 歌里先求上帝保佑亲爱的贝丝女王，让健康、安宁和幸福在圣诞这天都归她。水果送给勤劳的小蜜蜂，鲜花让她闻闻芬芳，乐谱放上钢琴，毛毯裹住脚掌。拉斐尔二世辛勤画了一幅乔安娜的肖像，还送来给呼噜夫人尾巴系的红丝带，以及可爱的佩格做的冰激凌，那是一桶白茫茫的勃朗峰。最后，雪姑娘说，造她的人已经把最深的爱藏进她积雪的胸膛，请贝丝把这位阿尔卑斯姑娘连同劳里和乔的心意一起收下。
        - id: ch01-b07
          speaker: narrator
          text: 贝丝看见雪姑娘，笑得多么欢啊。劳里跑上跑下，把礼物一件件搬进来。乔每送上一件，还要发表一通滑稽透顶的演说。热闹过后，她抱着贝丝回书房休息，又拿来“少女峰”送的葡萄。
        - id: ch01-b08
          speaker: beth
          text: 我心里已经装满幸福了。只要父亲也在这儿，我就连一滴也盛不下了。
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: 贝丝满足得轻轻叹了口气。
        - id: ch01-b10
          speaker: jo
          text: 我也一滴都盛不下啦。
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: 乔拍了拍口袋。她盼了许久的《水妖与辛特拉姆》正安稳地躺在里面。
        - id: ch01-b12
          speaker: amy
          text: 我肯定也是。
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: 艾米低头细看母亲送的圣母子版画，那幅画已经装进一只漂亮的镜框。
        - id: ch01-b14
          speaker: meg
          text: 我当然也是！我怎么会不幸福呢？
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: 梅格抚平第一件丝绸衣裙上银光闪闪的褶子。劳伦斯先生坚持要把它送给她。马奇太太的目光从丈夫的信移到贝丝带笑的脸上，手则抚过胸前新别上的别针。灰发、金发、栗色头发和深棕色头发，都编在那枚别针里。
        - id: ch01-b16
          speaker: mrs_march
          text: 我真是满心感激。
          emotion: happy
    - id: ch02
      title: 最后一滴幸福
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 在这个终日操劳的世界里，事情偶尔真会像快乐的故事书中那样发生，实在叫人欣慰。大家刚说过自己幸福得只能再盛一滴，半个小时后，那一滴就来了。劳里推开客厅门，悄悄探进头来。他脸上压着满满的激动，声音又藏不住欢喜。就算他翻个筋斗，再发出一声印第安人的战吼，也不会让大家更加吃惊。
        - id: ch02-b02
          speaker: laurie
          text: 马奇家又收到一份圣诞礼物。
          emotion: happy
        - id: ch02-b03
          speaker: narrator
          text: 他用古怪又气喘吁吁的声音才说完这句话，大家就全站了起来。劳里不知怎么被卷到一旁，原地出现一个高个子男人，衣服一直裹到眼睛，手臂搭在另一个高个子男人身上。后者想说什么，却一句也说不出来。人们一拥而上。接下来的几分钟里，谁都像失去了理智，做出的事一件比一件古怪，却没有一个人开口。
        - id: ch02-b04
          speaker: narrator
          text: 四双充满爱意的手臂抱住马奇先生，使他整个人都看不见了。乔险些昏倒，只好让劳里扶到瓷器间里照料。布鲁克先生吻了梅格，事后还语无伦次地解释说，他完全是弄错了。一向端庄的艾米被脚凳绊倒，连爬起来都顾不上，只管抱住父亲的靴子又亲又哭。马奇太太最先恢复镇定，抬起一只手警告大家。
        - id: ch02-b05
          speaker: mrs_march
          text: 嘘！别忘了贝丝。
        - id: ch02-b06
          speaker: narrator
          text: 可已经晚了。书房的门猛然打开，那件红色小晨袍出现在门口。喜悦给虚弱的双腿添了力量，贝丝径直奔进父亲怀里。紧接着发生的事，就不必细说了。满溢的心终于决堤，把过去的苦涩冲刷干净，只留下此刻的甜蜜。
        - id: ch02-b07
          speaker: narrator
          text: 这场面一点也不浪漫。不过一阵开怀大笑让人人恢复了常态。大家发现汉娜站在门后，正对着一只肥火鸡呜呜哭泣。她从厨房冲上来时，居然忘了把火鸡放下。笑声平息以后，马奇太太感谢布鲁克先生一路忠心照料丈夫。布鲁克先生突然想起马奇先生需要休息，便一把拉走劳里，匆匆告退。随后，两个病人奉命休养。他们倒也听话，只是两个人挤坐在一张大扶手椅里，说个不停。
        - id: ch02-b08
          speaker: narrator
          text: 马奇先生告诉家人，他一直盼着给她们一个惊喜。好天气一来，医生便准许他抓住机会赶路。他又说，布鲁克一路上如何尽心尽力，总之是个最值得敬重、最正直的年轻人。说到这里，他忽然停了一会儿，看看正在使劲拨弄炉火的梅格，又抬起眉毛，询问似的望向妻子。至于这是什么意思，就留给你们自己去猜吧。马奇太太轻轻点头，忽然问丈夫想不想吃点东西。乔看见了，也全明白了。她沉着脸去取葡萄酒和牛肉茶，出门时还重重摔上了门。
        - id: ch02-b09
          speaker: jo
          text: 我讨厌那些长着棕眼睛、值得敬重的年轻人！
          emotion: angry
    - id: ch03
      title: 圣诞晚餐
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 世界上从没有哪一顿圣诞晚餐比得上他们那天吃的。汉娜端上来的肥火鸡塞满馅料，烤得焦黄，还装饰得漂漂亮亮。入口即化的葡萄干布丁也毫不逊色。艾米更是沉醉在果冻里，活像一只掉进蜜罐的苍蝇。样样都做得成功，汉娜说这真是老天保佑。
        - id: ch03-b02
          speaker: hannah
          text: 太太，我当时脑子乱得很，居然没把布丁拿去烤，也没往火鸡肚里塞葡萄干，更没把火鸡包在布里煮掉，那才叫奇迹呢。
        - id: ch03-b03
          speaker: narrator
          text: 劳伦斯先生和孙子也来吃饭，布鲁克先生自然也在。乔阴沉沉地瞪着他，把劳里逗得开心极了。餐桌上首并排摆着两张舒适的扶手椅，贝丝和父亲坐在里面，只略吃一点鸡肉和水果。大家互相祝酒，讲故事，唱歌，还像老人家所说的那样追忆往事，过得痛快极了。原本计划好要乘雪橇出游，可姑娘们不肯离开父亲，客人便早早告辞。暮色渐浓，幸福的一家人围着炉火坐了下来。
        - id: ch03-b04
          speaker: jo
          text: 就在一年前，我们还在为即将到来的凄惨圣诞节唉声叹气。你们记得吗？
        - id: ch03-b05
          speaker: narrator
          text: 大家刚谈过许多事，静了一小会儿。梅格望着炉火微笑，暗暗庆幸自己一直庄重地对待布鲁克先生。
        - id: ch03-b06
          speaker: meg
          text: 总的说来，这一年倒挺愉快。
        - id: ch03-b07
          speaker: narrator
          text: 艾米若有所思地看着戒指上的光。
        - id: ch03-b08
          speaker: amy
          text: 我倒觉得，这一年相当难熬。
        - id: ch03-b09
          speaker: narrator
          text: 贝丝正坐在父亲膝头。
        - id: ch03-b10
          speaker: beth
          text: 我很高兴这一年过去了，因为您回来了。
          emotion: happy
        - id: ch03-b11
          speaker: mr_march
          text: 我的小朝圣者们，这一路可不好走，后半程尤其艰难。不过你们走得很勇敢。我看，那些重担很快就要一个个掉下来了。
        - id: ch03-b12
          speaker: narrator
          text: 他慈爱又满意地望着围在身边的四张年轻脸庞。
        - id: ch03-b13
          speaker: jo
          text: 您怎么知道？是妈妈告诉您的吗？
        - id: ch03-b14
          speaker: mr_march
          text: 她没说多少。不过草梗一动，人就知道风吹向哪里。今天，我已经发现了好几件事。
        - id: ch03-b15
          speaker: meg
          text: 快说说，您发现了什么！
        - id: ch03-b16
          speaker: mr_march
          text: 这只手就是一件。
        - id: ch03-b17
          speaker: narrator
          text: 他拿起梅格搭在椅子扶手上的手，指着粗糙的食指、手背上的一处烫伤，还有掌心两三个小硬茧。
        - id: ch03-b18
          speaker: mr_march
          text: 我记得这只手从前又白又光滑，你最在意的就是让它一直保持那样。它那时很漂亮，可在我看来，如今反倒更漂亮。这些看似不好看的印记，写下了一段小小的历史。你把虚荣放到火上献祭了。掌心的硬茧挣来的可不只是几个水泡。这些被针刺过的手指缝出的东西，也一定能用很久，因为每一针里都带着许多善意。梅格，我的好女儿，能让家庭幸福的持家本领，比白净的手和时髦的才艺都珍贵。我很骄傲能握住这只勤劳的好手，也希望不会太快有人来请我把它交出去。
        - id: ch03-b19
          speaker: narrator
          text: 梅格若曾盼望辛苦劳动能得到奖赏，那么父亲有力地握紧她的手，再送给她一个赞许的微笑，这份奖赏已经足够了。
    - id: ch04
      title: 快乐的草地
      blocks:
        - id: ch04-b01
          speaker: beth
          text: 那乔呢？请说几句好听的吧。她那么努力，对我又那么那么好。
        - id: ch04-b02
          speaker: narrator
          text: 贝丝贴着父亲的耳朵说。马奇先生笑起来，望向坐在对面的高个子姑娘。乔脸上的神情比往常温和得多。
        - id: ch04-b03
          speaker: mr_march
          text: 虽然还留着一头短短的卷发，我却看不见一年前那个“儿子乔”了。我看见的是一位年轻姑娘。她把衣领别得端正，把靴带系得整齐，不吹口哨，不说俚语，也不再像从前那样躺在地毯上。她守夜，又一直担心，最近的脸又瘦又白。可我喜欢看这张脸，因为它温柔了，声音也轻了。她不再横冲直撞，走路安安静静。照料某个小人儿时，她像母亲一样体贴，真让我高兴。我确实有点想念从前那个野姑娘。不过，若能换来一个坚强、能干又心肠温柔的女人，我也就满足了。我不知道是不是剪掉头发，让我们家的黑羊沉稳了下来。但我知道，我走遍整个华盛顿，也找不到一样足够美丽的东西，配得上用我的好姑娘寄来的二十五美元去买。
        - id: ch04-b04
          speaker: narrator
          text: 乔锐利的眼睛蒙上了一会儿水光。父亲赞美她时，她觉得自己的确当得起其中一部分，清瘦的脸庞也在火光里红了起来。
        - id: ch04-b05
          speaker: amy
          text: 现在该说贝丝了。
        - id: ch04-b06
          speaker: narrator
          text: 艾米盼着轮到自己，可她也愿意再等一等。
        - id: ch04-b07
          speaker: mr_march
          text: 她小得好像只剩这么一点儿，我真不敢多说，怕一开口她就完全溜走了。不过，她倒不像从前那么害羞啦。
        - id: ch04-b08
          speaker: narrator
          text: 他原本说得很快活，可一想到自己险些失去贝丝，便把女儿紧紧搂住，让她的脸贴着自己的脸。
        - id: ch04-b09
          speaker: mr_march
          text: 我的贝丝已经平平安安回到我怀里了。上帝若肯保佑，我就会让你永远这样平安。
          emotion: sad
        - id: ch04-b10
          speaker: narrator
          text: 大家沉默了一会儿。父亲低头看着坐在脚边小凳上的艾米，抚摸着她亮闪闪的头发。
        - id: ch04-b11
          speaker: mr_march
          text: 我留意到，艾米吃晚饭时拿了鸡腿，整个下午都替母亲跑腿。今晚，她又把自己的位子让给梅格，还一直耐心和气地照料大家。我也看到，她不大烦恼了，不总去照镜子，甚至一次也没有提起手上那枚漂亮的戒指。看来，她已经学会多替别人着想，少想着自己。她还决定，要像塑造小泥像一样，细心塑造自己的品格。她若能做出一尊优美的雕像，我当然很骄傲。可要是她能成为一个可爱的女儿，用自己的才华让自己和别人的生活都变得美好，我会骄傲无数倍。
        - id: ch04-b12
          speaker: narrator
          text: 艾米谢过父亲，又讲了戒指的故事。乔转头问贝丝。
        - id: ch04-b13
          speaker: jo
          text: 贝丝，你在想什么？
        - id: ch04-b14
          speaker: beth
          text: 今天我读《天路历程》，读到“基督徒”和“盼望”经历许多磨难以后，来到一片快乐的碧绿草地。那里终年开着百合，他们就在草地上幸福地休息，像我们现在一样。歇过以后，他们才继续走向旅程的终点。
        - id: ch04-b15
          speaker: narrator
          text: 贝丝从父亲怀里下来，走向钢琴。
        - id: ch04-b16
          speaker: beth
          text: 现在该唱歌了。我想坐回从前的位置。我要试着唱朝圣者们听见的那首牧童歌。我为父亲谱了曲，因为他喜欢这几节诗。
          emotion: happy
        - id: ch04-b17
          speaker: narrator
          text: 贝丝坐到那架亲爱的小钢琴前，轻轻按下琴键。大家原以为再也听不见她甜美的嗓音了，此刻，她却一边为自己伴奏，一边唱起那首古雅的赞美诗。再没有哪首歌，比它更适合眼前这一刻。
        - id: ch04-b18
          speaker: beth
          text: 身处低谷，不怕再跌落。位卑之人，不会生骄傲。永远谦卑，便有上帝一路引领他的脚。无论所有是多还是少，我都知足，不再烦恼。主啊，求你赐我知足，因你拯救这样的人到老。丰足反成朝圣者的重担，今世少有，来世福泽绵长。从这一代直到下一代，这才是世间最好的景况！
          emotion: calm
