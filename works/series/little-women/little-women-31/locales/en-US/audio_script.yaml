  chapters:
    - id: ch01
      title: Consequences
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Mrs. Chester's fair was so elegant and exclusive that every young lady in the neighborhood thought an invitation to run a table was a great honor. Amy was invited, though Jo was not. That was probably best for everyone. At this point in her life, Jo still met the world elbows first, and only plenty of hard knocks would teach her an easier way through it. No one wanted the proud, uninteresting girl at a table, but Amy's taste and talent earned her charge of the art table. She worked hard to make it beautiful and to gather things worth selling.
        - id: ch01-b02
          speaker: narrator
          text: All went well until the evening before the fair. Then came one of those little battles that can hardly be avoided when twenty-five women, young and old, try to work together while carrying their own grudges and prejudices. May Chester was jealous because Amy was more popular than she was, and several small events sharpened that jealousy. Amy's delicate pen-and-ink work had completely outshone May's painted vases. That was one thorn. At a recent party, the charming Tudor had danced with Amy four times and May only once. That was a second. Worst of all, someone had told May that the March girls had mocked her at the Lambs'. Jo deserved the blame. Her playful imitation had been so accurate that everyone knew whom she meant, and the amused Lambs had allowed the joke to travel. Amy and Jo had no idea it had reached the Chesters.
        - id: ch01-b03
          speaker: narrator
          text: So Amy was astonished when Mrs. Chester approached as she put the last touches on her lovely table. The lady spoke sweetly, but her eyes were cold.
        - id: ch01-b04
          speaker: mrs_chester
          text: My dear, some of the young ladies are unhappy that I gave this table to anyone but my own girls. It is in the best position, and several people consider it the prettiest table here. Since my daughters have done most of the work for the fair, everyone feels they should take it. I am sorry. Still, I know you care too much about our cause to mind one small disappointment. You may have another table if you wish.
        - id: ch01-b05
          speaker: narrator
          text: Mrs. Chester had expected that speech to be easy. With Amy's trusting eyes fixed on her in hurt surprise, it was not easy at all. Amy could tell there was some hidden reason, though she could not guess what it was. She answered quietly, and her pain showed.
        - id: ch01-b06
          speaker: amy
          text: Would you rather I did not take any table?
        - id: ch01-b07
          speaker: mrs_chester
          text: Please don't be offended, dear. It is only the most practical arrangement. My girls naturally ought to lead, and this table belongs with them. You have made it charming, and I truly appreciate all your work. But we must set aside our private wishes. I promise you a good place somewhere else. What about the flower table? The little girls took it on, but they have lost heart. You could make it delightful, and flowers always draw people.
        - id: ch01-b08
          speaker: may
          text: Especially gentlemen.
        - id: ch01-b09
          speaker: narrator
          text: That look and little jab showed Amy one reason for her sudden disgrace. She flushed with anger, but ignored the insult and answered with surprising courtesy.
        - id: ch01-b10
          speaker: amy
          text: Whatever you prefer, Mrs. Chester. I will leave this table now and take care of the flowers.
        - id: ch01-b11
          speaker: may
          text: You can leave your own work here, if you want to.
        - id: ch01-b12
          speaker: narrator
          text: May felt a prick of guilt as she looked at the graceful racks, painted shells, and unusual illuminated pages Amy had made and arranged so carefully. She meant to be kind. Amy heard something quite different.
        - id: ch01-b13
          speaker: amy
          text: Of course. I'll move them if they're in your way.
        - id: ch01-b14
          speaker: narrator
          text: She swept everything into her apron in a jumble and walked away, convinced that both she and her art had been insulted beyond forgiveness.
        - id: ch01-b15
          speaker: may
          text: Now she is angry. Oh, Mama, I wish I had never asked you to tell her.
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: May stared unhappily at the bare spaces Amy's work had left behind.
        - id: ch01-b17
          speaker: mrs_chester
          text: Quarrels between girls never last long.
        - id: ch01-b18
          speaker: narrator
          text: Mrs. Chester herself felt a little ashamed, and she had reason to. The younger girls, however, welcomed Amy and her treasures with delight. Their warmth soothed her, and she set to work, determined that if she could not win with art, she would win with flowers. But the evening fought her at every step. She was tired and it was late. Everyone else was busy. The little girls meant well, but they fluttered and chattered like magpies while making a great mess in the name of perfect order. The evergreen arch wobbled and threatened to fall as soon as the hanging baskets were filled. Water splashed her best tile and left a brown tear down Cupid's cheek. Hammering bruised her hands. A draft chilled her and made her worry about the next day. Any girl who has struggled through such a task will understand poor Amy and wish her luck.
        - id: ch01-b19
          speaker: narrator
          text: Her family was furious when she told them that night. Mrs. March called it shameful, though she assured Amy that Amy herself had acted properly. Beth refused to attend the fair. Jo wanted to know why Amy had not gathered up every pretty thing and left those mean people to manage without her.
        - id: ch01-b20
          speaker: amy
          text: Their meanness does not give me the right to be mean too. I hate this kind of thing, and I do have a right to feel hurt. But I won't show them. That will trouble them more than angry words or sulking, won't it, Mother?
        - id: ch01-b21
          speaker: mrs_march
          text: That is the right way to meet it, dear. Returning a kiss for a blow is always best, even when it is very hard to do.
        - id: ch01-b22
          speaker: narrator
          text: She spoke like someone who knew that giving good advice and following it were two different things. All the next day, Amy resisted the very natural urge to strike back. She meant to defeat her enemy with kindness. That morning, while the little girls filled baskets in the next room, an unexpected reminder helped her begin.
        - id: ch01-b23
          speaker: narrator
          text: Amy picked up her favorite creation. It was a small book with an antique cover her father had found among his treasures. On its vellum pages, Amy had painted beautiful designs around different verses. She turned them with understandable pride. Then one page stopped her. Scarlet, blue, and gold scrollwork framed tiny spirits of goodwill helping each other among thorns and flowers. In the center were the words, "Thou shalt love thy neighbor as thyself."
        - id: ch01-b24
          speaker: amy
          text: I ought to, but I don't.
        - id: ch01-b25
          speaker: narrator
          text: She looked from the shining page to May's unhappy face behind the huge vases. Those vases could not hide the gaps where Amy's pretty work had stood. Amy kept turning the leaves. Each one seemed to offer a gentle rebuke for bitterness and unkind thoughts. Wise sermons reach us every day from people and places that never mean to preach. Even a fair table can become a pulpit when it offers words that help at exactly the right time. Amy listened to what her conscience told her, took it seriously, and acted on it at once.
        - id: ch01-b26
          speaker: narrator
          text: Several girls stood around May's table, admiring the display and discussing the change in saleswomen. They lowered their voices, but Amy knew they were talking about her. They had heard only one side and had already judged her. It hurt. Still, her better feelings held, and soon she had a chance to prove it.
        - id: ch01-b27
          speaker: may
          text: It is such a shame. There is no time to make anything else, and I don't want to fill the spaces with scraps. The table was perfect before. Now it looks ruined.
          emotion: sad
        - id: ch01-b28
          speaker: young_lady_one
          text: I expect Amy would bring her things back if you asked.
        - id: ch01-b29
          speaker: may
          text: How can I ask her after everything that happened?
        - id: ch01-b30
          speaker: narrator
          text: Before May could finish, Amy called pleasantly from across the hall.
        - id: ch01-b31
          speaker: amy
          text: You can have them without asking, and you are very welcome to them. I was about to offer. They belong on your table much more than mine. Here they are, and please forgive me for snatching them away last night.
        - id: ch01-b32
          speaker: narrator
          text: Amy returned everything with a nod and a smile, then hurried off. Doing the kind thing was easier than standing there to be thanked for it.
        - id: ch01-b33
          speaker: young_lady_one
          text: Wasn't that lovely of her?
          emotion: surprised
        - id: ch01-b34
          speaker: narrator
          text: May's reply was too soft to hear. Another young woman had spent too long making lemonade, and her temper had gone sour with it.
        - id: ch01-b35
          speaker: young_lady_two
          text: Very lovely. She knew those things would never sell at her own table.
        - id: ch01-b36
          speaker: narrator
          text: That was cruel. When we make even a small sacrifice, we want someone to value it. For a moment Amy wished she had kept her things. Being good did not seem to bring its own reward. Soon, though, she found that it did. Her spirits began to rise, and under her clever hands the flower table began to bloom. The little girls treated her warmly. That one generous act seemed to clear the unpleasant feeling from the room, even though no one had rewarded Amy or properly understood what the act had cost her.
        - id: ch01-b37
          speaker: narrator
          text: Even so, the day was long and difficult. The little girls soon deserted Amy, and she often sat alone with nothing to do. Few people wanted flowers in summer, and her bouquets began to droop long before evening. Across the room, the art table was the most popular place at the fair. A crowd surrounded it all day. Its saleswomen hurried back and forth with important faces and clattering money boxes, making one sale after another. Amy kept looking over. She longed to be where she belonged, busy and happy among the art she understood, instead of sitting idle in a forgotten corner. That might not sound like suffering to everyone. For a pretty, cheerful young girl who had expected such a different day, it was both dull and painful. Remembering that Laurie and his friends would see her there made it feel like a true martyrdom.
        - id: ch01-b38
          speaker: narrator
          text: Amy stayed until night. When she came home, she looked so pale and quiet that everyone understood how hard the day had been, though she did not complain or mention what she had done for May. Her mother gave her an especially comforting cup of tea. Beth helped her dress and made a lovely wreath for her hair. Jo dressed with unusual care and hinted mysteriously that fortune was about to change sides.
        - id: ch01-b39
          speaker: amy
          text: Please don't be rude, Jo. I will not have a scene. Let the whole thing go, and behave yourself.
        - id: ch01-b40
          speaker: narrator
          text: Amy left early, hoping fresh flowers had arrived to revive her poor table.
        - id: ch01-b41
          speaker: jo
          text: I only plan to be wonderfully charming to everyone I know and keep them in Amy's corner as long as I can. Teddy and his boys will help. We will make the evening fun yet.
        - id: ch01-b42
          speaker: narrator
          text: Jo leaned over the gate to watch for Laurie. Soon she heard his familiar steps in the dusk and ran to meet him.
        - id: ch01-b43
          speaker: jo
          text: Is that my boy?
        - id: ch01-b44
          speaker: laurie
          text: It certainly is, if that is my girl.
        - id: ch01-b45
          speaker: narrator
          text: Laurie tucked her hand through his arm like a man who had everything he wanted.
        - id: ch01-b46
          speaker: jo
          text: Oh, Teddy, you should hear what happened!
        - id: ch01-b47
          speaker: narrator
          text: With all a sister's fierce loyalty, Jo told him how Amy had been wronged.
        - id: ch01-b48
          speaker: laurie
          text: A whole troop of our fellows is driving over later. I'll make every one of them buy Amy's last flower, and then we'll settle down in front of her table for the evening.
        - id: ch01-b49
          speaker: jo
          text: Amy says the flowers are poor, and the fresh ones may not arrive in time. I hate to be suspicious, but I would not be surprised if they never came. Once people do one mean thing, they may easily do another.
          emotion: disgusted
        - id: ch01-b50
          speaker: laurie
          text: Didn't Hayes send the best flowers from our gardens? I told him to give them to you.
        - id: ch01-b51
          speaker: jo
          text: I knew nothing about that. He must have forgotten. Your grandfather has been unwell, so I did not want to bother him by asking, though I badly wanted some.
        - id: ch01-b52
          speaker: laurie
          text: Jo, why would you ever need to ask? Our flowers are as much yours as mine. Don't we divide everything between us?
        - id: ch01-b53
          speaker: narrator
          text: He used the tone that always made Jo bristle.
        - id: ch01-b54
          speaker: jo
          text: Goodness, I hope we don't divide everything. I would not want half of some things you own. But we cannot stand here flirting. I must help Amy. Go make yourself handsome, and please have Hayes send a few good flowers to the hall. Do that, and I will bless you forever.
        - id: ch01-b55
          speaker: laurie
          text: Couldn't you bless me now?
        - id: ch01-b56
          speaker: narrator
          text: His meaning was so plain that Jo slammed the gate in his face and called through the bars.
        - id: ch01-b57
          speaker: jo
          text: Go away, Teddy. I'm busy.
        - id: ch01-b58
          speaker: narrator
          text: That night, the conspirators truly turned the tables. Hayes sent a wilderness of flowers, including a splendid basket for the centerpiece. The entire March family came to the fair. Jo's efforts worked wonderfully. People arrived and stayed, laughing at her nonsense, praising Amy's taste, and having a very good time. Laurie and his friends rushed gallantly into action. They bought every bouquet, camped around the table, and made Amy's corner the liveliest place in the hall. Amy was in her element. Gratitude made her especially bright and gracious, and she decided that perhaps goodness really was its own reward.
        - id: ch01-b59
          speaker: narrator
          text: Jo behaved perfectly while Amy gathered her guard of honor. Then she wandered through the hall collecting bits of gossip. At last she understood why the Chesters had moved Amy. Jo blamed herself for helping to create the bad feeling and resolved to clear Amy's name as soon as she could. She also learned that Amy had returned her artwork that morning. Such generosity made her proud of her sister. When Jo passed the art table, she searched for Amy's pieces and found none.
        - id: ch01-b60
          speaker: narrator
          text: Jo decided they had probably been hidden away. She could forgive an insult to herself, but an insult to her family made her burn.
        - id: ch01-b61
          speaker: may
          text: Good evening, Jo. How is Amy doing?
        - id: ch01-b62
          speaker: narrator
          text: May sounded friendly. She wanted to show that she could be generous too.
        - id: ch01-b63
          speaker: jo
          text: She has sold everything worth selling, and now she is enjoying herself. The flower table always attracts people, you know. Especially gentlemen.
        - id: ch01-b64
          speaker: narrator
          text: Jo could not resist that little slap. May accepted it so meekly that Jo regretted it at once and began admiring the large vases, which still had not sold.
        - id: ch01-b65
          speaker: jo
          text: Is Amy's illuminated book here? I wanted to buy it for Father.
        - id: ch01-b66
          speaker: narrator
          text: What Jo really wanted was to discover what had happened to her sister's work.
        - id: ch01-b67
          speaker: may
          text: All of Amy's pieces sold hours ago. I made sure the right people noticed them, and they earned a fine amount for us.
        - id: ch01-b68
          speaker: narrator
          text: May had fought down several small temptations that day, just as Amy had. Delighted, Jo hurried back with the news. Amy was surprised and deeply touched by both May's words and her manner.
        - id: ch01-b69
          speaker: amy
          text: Gentlemen, I want you to visit the other tables now and spend as generously as you did at mine. Be especially generous at the art table.
        - id: ch01-b70
          speaker: narrator
          text: She sent off Laurie's college friends, whom the girls called Teddy's own.
        - id: ch01-b71
          speaker: jo
          text: Your motto is, "Charge, Chester, charge!" Do your duty like men, and I promise you will get your money's worth of art in every possible sense.
        - id: ch01-b72
          speaker: narrator
          text: The loyal troop prepared to enter the battle.
        - id: ch01-b73
          speaker: parker
          text: We hear and obey. But March is much fairer than May.
        - id: ch01-b74
          speaker: narrator
          text: Little Parker struggled hard to sound witty and romantic at once. Laurie stopped him promptly.
        - id: ch01-b75
          speaker: laurie
          text: Not bad, my son, considering how small you are.
        - id: ch01-b76
          speaker: narrator
          text: He marched Parker away with a fatherly pat on the head.
        - id: ch01-b77
          speaker: amy
          text: Buy the vases.
        - id: ch01-b78
          speaker: narrator
          text: Amy whispered that to Laurie as one final kindness toward her enemy. To May's delight, Laurie bought both vases and spent the rest of the fair strolling about with one under each arm. His friends spent just as recklessly on delicate little objects. Soon they wandered helplessly through the hall, loaded with wax flowers, painted fans, filigree portfolios, and other equally practical purchases.
        - id: ch01-b79
          speaker: narrator
          text: Aunt Carrol was there. She heard the story, looked pleased, and spoke privately to Mrs. March. Whatever she said made Amy's mother glow with satisfaction. She watched Amy with pride mixed with worry, but kept the reason to herself for several days.
        - id: ch01-b80
          speaker: narrator
          text: Everyone declared the fair a success. When May said goodnight, she did not overwhelm Amy with the warm gush she usually used. Instead, she gave Amy one affectionate kiss and a look that said everything she could not quite say aloud. She wanted them both to forgive and forget. Amy understood, and that was enough to satisfy her.
        - id: ch01-b81
          speaker: narrator
          text: At home, the two vases stood proudly on the parlor mantel, each holding a huge bouquet.
        - id: ch01-b82
          speaker: laurie
          text: A reward for the magnificent goodness of Miss March!
        - id: ch01-b83
          speaker: narrator
          text: Laurie announced it with a flourish. Much later, as the sisters brushed their hair, Jo spoke with all her heart.
        - id: ch01-b84
          speaker: jo
          text: Amy, you have far more principle, generosity, and goodness than I ever understood. You behaved beautifully today. I respect you with my whole heart.
        - id: ch01-b85
          speaker: beth
          text: We all do, and we love how quickly you forgave them. It must have been terribly hard after all that work, when you had hoped so much to sell your lovely things. I don't think I could have given them back as kindly as you did.
        - id: ch01-b86
          speaker: narrator
          text: Beth spoke from her pillow.
        - id: ch01-b87
          speaker: amy
          text: Girls, you don't have to praise me. I only treated them the way I would want them to treat me. You laugh when I say I mean to be a lady, but I mean a true gentlewoman in her mind and her manners. I am trying as well as I know how. I cannot explain it perfectly. I want to rise above the petty spite, foolishness, and faults that ruin so many women. I am nowhere near that yet, but I keep trying. Someday I hope to become the kind of woman Mother is.
        - id: ch01-b88
          speaker: narrator
          text: Amy's voice was earnest. Jo gave her a warm hug.
        - id: ch01-b89
          speaker: jo
          text: Now I understand, and I will never tease you about it again. You are making more progress than you know. I should take lessons from you in real courtesy, because I think you have found its secret. Keep trying, dear. Your reward will come someday, and no one will be happier for you than I will.
        - id: ch01-b90
          speaker: narrator
          text: Amy's reward arrived one week later. Poor Jo found being happy for her much harder than she had expected. Aunt Carrol sent a letter. Mrs. March's face shone so brightly as she read it that Jo and Beth demanded to hear the wonderful news.
        - id: ch01-b91
          speaker: mrs_march
          text: Aunt Carrol is going overseas next month, and she wants...
        - id: ch01-b92
          speaker: jo
          text: Me to go with her!
          emotion: happy
        - id: ch01-b93
          speaker: narrator
          text: Jo leaped out of her chair in a burst of joy.
        - id: ch01-b94
          speaker: mrs_march
          text: No, dear. Not you. She wants Amy.
        - id: ch01-b95
          speaker: jo
          text: Oh, Mother! Amy is too young, and it should be my turn first. I have dreamed about this for so long. The trip would do me so much good. It would be glorious. I have to go!
        - id: ch01-b96
          speaker: mrs_march
          text: I am afraid you cannot. Aunt Carrol clearly asks for Amy. When she offers such a gift, we cannot tell her whom to take.
        - id: ch01-b97
          speaker: jo
          text: It always happens this way. Amy gets all the pleasure, and I get all the work. It isn't fair. It simply isn't fair!
          emotion: angry
        - id: ch01-b98
          speaker: mrs_march
          text: Dear, I am afraid some of this is your own doing. When your aunt spoke to me recently, she regretted your blunt manners and your fierce independence. Here she seems to repeat your own words. She says, "At first I intended to invite Jo. But favors burden her, and she hates French, so I will not risk asking. Amy is easier to guide. She will be a pleasant companion for Flo and gratefully accept whatever the journey can teach her."
        - id: ch01-b99
          speaker: jo
          text: Oh, my tongue! My horrible tongue! Why can I never keep it still?
          emotion: sad
        - id: ch01-b100
          speaker: narrator
          text: Jo groaned as she remembered the careless words that had cost her the trip. After she explained when she had said them, Mrs. March answered sadly.
        - id: ch01-b101
          speaker: mrs_march
          text: I wish you could have gone, but there is no hope of changing it now. Try to bear the disappointment well. Do not spoil Amy's happiness with complaints or regrets.
          emotion: sad
        - id: ch01-b102
          speaker: jo
          text: I will try. I will copy Amy and do more than pretend to be glad. I will try to feel glad and never resent a single minute of her happiness. But it will be difficult. This is a dreadful disappointment.
          emotion: sad
        - id: ch01-b103
          speaker: narrator
          text: Jo blinked hard and knelt to gather the basket she had knocked over in her first delight. Several bitter tears fell onto the plump little pincushion in her hand.
        - id: ch01-b104
          speaker: beth
          text: Jo, dear, I know it is selfish, but I could not bear to lose you. I am glad you are not going. Not yet.
        - id: ch01-b105
          speaker: narrator
          text: Beth hugged Jo, basket and all. Her loving face and the way she clung to her comforted Jo, even while regret still stung so sharply that Jo wanted to box her own ears. She would gladly have begged Aunt Carrol to burden her with the favor now, just to prove how gratefully she could bear it.
        - id: ch01-b106
          speaker: narrator
          text: By the time Amy returned, Jo could join the family's celebration. Perhaps she was less joyful than usual, but she did not complain about Amy's good fortune. Amy received the news with solemn delight. That very evening she began sorting her colors and packing her pencils. Clothes, money, and passports could be handled by people whose heads were not full of dreams about art.
        - id: ch01-b107
          speaker: amy
          text: Girls, this is not simply a pleasure trip for me. It will decide my whole career. If I have any genius, I will discover it in Rome, and then I will do something that proves it.
        - id: ch01-b108
          speaker: narrator
          text: She scraped her best palette as she spoke.
        - id: ch01-b109
          speaker: jo
          text: And what if you discover that you have none?
        - id: ch01-b110
          speaker: amy
          text: Then I will come home and earn my living by teaching drawing.
        - id: ch01-b111
          speaker: narrator
          text: Amy offered that answer with philosophical calm, though the thought made her grimace. She scraped the palette even harder, as if she meant to take energetic action before surrendering her hopes.
        - id: ch01-b112
          speaker: jo
          text: No, you won't. You hate hard work. You will marry a rich man, come home, and spend the rest of your life surrounded by luxury.
        - id: ch01-b113
          speaker: amy
          text: Some of your predictions do come true, but I do not believe that one will. Though I admit I would like it. If I cannot be an artist, I would love to have enough money to help other artists.
        - id: ch01-b114
          speaker: narrator
          text: Amy smiled. The role of a generous rich lady plainly suited her better than the role of a poor drawing teacher.
        - id: ch01-b115
          speaker: jo
          text: Hmm. If you want it, you will probably get it. Your wishes always come true. Mine never do.
          emotion: sad
        - id: ch01-b116
          speaker: amy
          text: Would you like to go abroad?
        - id: ch01-b117
          speaker: narrator
          text: Amy thoughtfully tapped her nose with her palette knife.
        - id: ch01-b118
          speaker: jo
          text: Would I ever!
        - id: ch01-b119
          speaker: amy
          text: Then in a year or two, I will send for you. We can dig for old treasures in the Forum and carry out all the plans we have made together.
        - id: ch01-b120
          speaker: jo
          text: Thank you. When that wonderful day comes, if it ever does, I will remind you of this promise.
        - id: ch01-b121
          speaker: narrator
          text: Jo accepted the grand but uncertain offer as gratefully as she could. There was little time to prepare, and the whole house stayed in an uproar until Amy left. Jo held herself together until the last flicker of blue ribbon disappeared. Then she escaped to the garret and cried until she had no tears left.
        - id: ch01-b122
          speaker: narrator
          text: Amy was brave too, right up to the moment her ship sailed. As the gangway was about to be pulled away, she suddenly understood that an entire ocean would soon lie between her and the people she loved most. She clung to Laurie, the last friend beside her.
        - id: ch01-b123
          speaker: amy
          text: Oh, please take care of them for me. And if anything should happen...
          emotion: fearful
        - id: ch01-b124
          speaker: laurie
          text: I will, dear. I promise. And if anything happens to you, I will come and comfort you.
          emotion: calm
        - id: ch01-b125
          speaker: narrator
          text: Laurie whispered the promise without dreaming that one day he would be asked to keep it.
        - id: ch01-b126
          speaker: narrator
          text: So Amy sailed away to discover the Old World, which always looks new and beautiful to young eyes. Her father and her friend watched from shore, hoping with all their hearts that only gentle fortunes would come to the happy girl. Amy waved until they could see nothing but summer sunlight dazzling on the sea.
