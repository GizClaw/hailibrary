audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，带着克制的幽默, timbre: 清澈柔和, pace: 从容舒展, pitch: 中音}
    amy:
      display_name: 艾米
      tts: {delivery: 讲究而伶俐，偶尔流露稚气, timbre: 清脆, pace: 适中, pitch: 中高音}
    mrs_march:
      display_name: 马奇太太
      tts: {delivery: 慈爱爽朗，沉稳中带着鼓励, timbre: 饱满温暖, pace: 从容, pitch: 中低音}
    jo:
      display_name: 乔
      tts: {delivery: 爽直活泼，情感来得快而真, timbre: 明亮有力, pace: 稍快, pitch: 中音}
    beth:
      display_name: 贝思
      tts: {delivery: 温柔诚恳，羞怯克制, timbre: 轻柔纯净, pace: 舒缓, pitch: 中高音}
    laurie:
      display_name: 劳里
      tts: {delivery: 热情风趣，带着亲昵的少年意气, timbre: 清朗温暖, pace: 稍快, pitch: 中音}
    mrs_chester:
      display_name: 切斯特太太
      tts: {delivery: 客气周全，冷淡时仍保持体面, timbre: 圆润端正, pace: 适中, pitch: 中音}
    may:
      display_name: 梅·切斯特
      tts: {delivery: 娇俏自负，心软时略显迟疑, timbre: 明亮纤细, pace: 适中, pitch: 中高音}
    girl:
      display_name: 一位姑娘
      tts: {delivery: 年轻直率，随口插话, timbre: 清亮, pace: 适中, pitch: 中高音}
    sour_young_woman:
      display_name: 年轻姑娘
      tts: {delivery: 尖刻轻慢，笑意冷淡, timbre: 偏薄, pace: 适中, pitch: 中高音}
    parker:
      display_name: 小帕克
      tts: {delivery: 殷勤活泼，努力显得风趣, timbre: 年轻清亮, pace: 稍快, pitch: 中高音}
  chapters:
    - id: ch01
      title: 第三十章 后果
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 切斯特太太办的义卖会高雅又讲究，受邀的人也是精挑细选。附近的姑娘若能照管一个摊位，都觉得很光彩，因此人人都在议论。艾米得到了艺术品摊位，乔却没受邀请。这对大家都好，因为当时的乔还浑身是棱角，手肘仿佛总向外支着，得多碰几次壁才会从容处世。那个“傲慢又没趣的人”就这样无人理会。艾米却凭才艺和品位受到赏识，忙着亲手制作，也四处征集合适而贵重的义卖品。
        - id: ch01-b02
          speaker: narrator
          text: 一切顺顺当当，直到开幕前一天。二十五个不同年纪的女人，各自带着私下的不快和成见一起做事，一场小冲突几乎躲不过去。梅·切斯特本就嫉妒艾米比自己更讨人喜欢，最近几件小事又不断添火。艾米精巧的钢笔画盖过了她的彩绘花瓶，这是第一根刺。所向披靡的都铎在舞会上同艾米跳了四次，却只同她跳了一次，这是第二根刺。最扎心的，还是有个爱搬弄是非的人告诉她，马奇家的姑娘在兰姆家取笑过她。其实这事应该怪乔。她模仿得太像，不可能没人认出来，爱闹的兰姆一家又让笑话传了出去。闯祸的人对此毫不知情。那晚，艾米正在摊位前作最后修饰，切斯特太太因为女儿据说受了嘲弄，也怀着不满走了过来。她表情温和，眼神却是冷的。
        - id: ch01-b03
          speaker: mrs_chester
          text: 亲爱的，有些姑娘觉得，这个摊位不该交给我女儿以外的人。它最显眼，也有人说它最好看。义卖会又主要是她们张罗的，所以还是由她们照管更合适。真对不起。不过你一心为这桩善事出力，想必不会在意个人这一点小小的失望。你若愿意，我另给你一个摊位。
        - id: ch01-b04
          speaker: narrator
          text: 这番话本来不难说。可艾米毫无戒心地望着她，眼里满是惊讶和难过，切斯特太太便说得不那么自然了。艾米听出背后另有缘故，却猜不出是什么。
        - id: ch01-b05
          speaker: amy
          text: 也许您是希望我什么摊位都别管了？
        - id: ch01-b06
          speaker: mrs_chester
          text: 千万别往心里去，亲爱的，这只是权宜之计。我的女儿们自然该领头，大家也觉得这是她们的位置。我很感激你把这里布置得这样漂亮，可我们总得放下个人的愿望。我会在别处给你安排好地方。花摊怎么样？几个小姑娘原本答应照管，现在已经灰心了。你一定能把它布置得很可爱，而且花摊总招人喜欢。
        - id: ch01-b07
          speaker: may
          text: 尤其招男士喜欢。
        - id: ch01-b08
          speaker: narrator
          text: 梅那一眼，让艾米明白自己为什么突然失宠。她气红了脸，却没接这句讥讽。
        - id: ch01-b09
          speaker: amy
          text: 那就照您的意思吧，切斯特太太。我马上让出这里。您若需要，我去照料花摊。
        - id: ch01-b10
          speaker: may
          text: 你也可以把自己做的东西摆到自己的摊位上。
        - id: ch01-b11
          speaker: narrator
          text: 梅看着那些漂亮的架子、彩绘贝壳和古雅的文字画，心里有些过意不去，本是一番好意。艾米却误会了。
        - id: ch01-b12
          speaker: amy
          text: 当然可以，既然它们放在这里碍着你了。
        - id: ch01-b13
          speaker: narrator
          text: 她把所有作品一股脑扫进围裙，乱七八糟兜在一起，转身就走。在当时的艾米看来，切斯特一家不只侮辱了她这个人，连她费尽心思做出的艺术品也一起侮辱了，简直不可饶恕。
        - id: ch01-b14
          speaker: may
          text: 她真生气了。妈妈，我不该请您去说的。
        - id: ch01-b15
          speaker: mrs_chester
          text: 姑娘们吵架，很快就会和好。
        - id: ch01-b16
          speaker: narrator
          text: 切斯特太太自己也有点惭愧，而且她确实应该惭愧。花摊的小姑娘们倒欢天喜地地迎接艾米和她的宝物，这份热诚让她心里舒服了一些。她马上动手，决心艺术上不能成功，至少要让花摊出彩。可每件事都和她作对。天已经晚了，她也累了，人人只顾忙自己的摊位，谁都抽不出手帮忙。小姑娘们不但帮不上忙，还像一群喜鹊那样叽叽喳喳。她们一心想把每件东西都放得无比齐整，结果反而越弄越乱。常青枝拱门搭好后总是站不稳，吊篮一装满，它就摇来晃去，像要倒在艾米头上。水溅湿了她最好的画砖，在丘比特脸颊上留下一道褐色泪痕。锤子敲得她双手青肿，穿堂风又让她受了凉。想到明天，她更担心起来。吃过类似苦头的姑娘，自然会同情可怜的艾米，也会盼她顺利做完。
        - id: ch01-b17
          speaker: narrator
          text: 晚上听完她的遭遇，全家都气愤极了。妈妈说切斯特一家这样做实在可耻，但也告诉艾米，她自己的做法是对的。贝思当场说，自己根本不去义卖会了。乔更不能理解，妹妹为什么不把那些漂亮东西全拿回来，让那些刻薄的人离了她，自己去收拾残局。
        - id: ch01-b18
          speaker: amy
          text: 他们刻薄，不等于我也该刻薄。我当然难过，可我不想让他们看出来。这样比赌气、说气话更叫他们不好受，对吗，妈妈？
        - id: ch01-b19
          speaker: mrs_march
          text: 这份心意就对了。别人打你一下，你回他一个吻，总是更好，只是做起来不容易。
        - id: ch01-b20
          speaker: narrator
          text: 第二天一整天，艾米一次次忍住怨恨和报复的念头，决心用善意战胜敌人。她能有个好开头，是因为一项突然出现、却来得正好的无声提醒。早晨，她在布置花摊，小姑娘们则在前厅往篮子里插花。她拿起自己最心爱的作品。那是一本古旧封面的小书，封面是父亲从收藏里找来的。她在一页页羊皮纸上画了精美的彩饰经文，翻看时还带着完全可以原谅的得意。忽然，一页使她停住了。鲜红、湛蓝和金色的卷草纹里，小精灵在花朵与荆棘间上上下下，彼此扶持，中间写着：“要爱人如己。”
        - id: ch01-b21
          speaker: amy
          text: 我应该这样做，可我并没有。
        - id: ch01-b22
          speaker: narrator
          text: 她看看明亮的书页，又看看大花瓶后面闷闷不乐的梅。那些花瓶再大，也遮不住原先摆着艾米作品的空处。她站了一会儿，手里一页页翻过去，每一页都像在温柔地责备心里的怨恨和不仁。每天都有许多睿智又真诚的道理，由毫不知情的人讲给我们听。这样的传道人可能出现在街头、学校、办事处，也可能就在家里。就连义卖会的摊位，也能成为讲坛，只要它传出的善言能够帮助人，而且永远不会过时。艾米的良心借那句经文讲完一篇小小的道。她做到了许多人不一定总能做到的事，不只听进心里，还立刻照着去做。
        - id: ch01-b23
          speaker: narrator
          text: 几个姑娘围着梅的摊位，一面欣赏漂亮的东西，一面议论为什么换了售货人。她们看见艾米就压低声音，可艾米知道，她们只听了一面之词，正在评判自己。那种滋味当然不好受。不过，她心里已经有了更好的念头，很快也有机会证明自己是真心的。她听见梅难过地抱怨起来。
        - id: ch01-b24
          speaker: may
          text: 现在根本来不及再做东西，我也不想拿零碎杂物凑数。摊位原本刚刚好，现在全毁了。
        - id: ch01-b25
          speaker: girl
          text: 你去问问，她大概愿意把东西放回来。
        - id: ch01-b26
          speaker: may
          text: 都闹成这样了，我怎么开得了口？
        - id: ch01-b27
          speaker: amy
          text: 你不用开口。要是你想要，我很乐意全送回来。我也正觉得，那些东西放在你的摊位上更合适。都在这里，请收下吧。昨晚我匆匆拿走它们，是我太急了，请你原谅。
        - id: ch01-b28
          speaker: narrator
          text: 艾米说完便把义卖品全部送还。她朝梅点点头，又笑了一下，马上快步走开。她忽然发现，做一件友善的事其实还容易，留在原地等着别人道谢，反而更让人难为情。
        - id: ch01-b29
          speaker: girl
          text: 她这样做真好，你们不觉得吗？
        - id: ch01-b30
          speaker: sour_young_woman
          text: 好得很呀。她明知道那些东西留在自己摊位上也卖不掉。
        - id: ch01-b31
          speaker: narrator
          text: 这话实在伤人。人做出一点小小的牺牲，总盼着至少有人珍惜。艾米一时后悔，觉得美德未必真会带来自己的酬报。不过她很快发现，它确实会，而且这份酬报先在自己心里出现。她的心情一点点明亮起来，花摊也在灵巧的双手下开得繁盛。小姑娘们待她很亲热，那一个善意的举动仿佛把沉闷的空气一扫而空。
        - id: ch01-b32
          speaker: narrator
          text: 可那一天实在又长又难熬。小姑娘们很快溜走，艾米常常独自坐在摊位后。夏天没有多少人想买花，天还没黑，花束已经垂下了头。她只能眼看着原本鲜亮的花朵一点点失去精神，连招揽客人的机会也越来越少。艺术品摊位却是全场最好看的地方，始终挤满人。售货的姑娘们摆着要紧的神气，带着叮当作响的钱匣忙来忙去。艾米一次次依恋地望向那边。她多想站在那里，做自己熟悉又喜欢的事，快快活活的，而不是孤零零缩在角落，什么也不能做。有些人觉得这根本不算苦。可对一个漂亮又活泼的年轻姑娘来说，它不只无聊，还十分难堪。再想到劳里和朋友们随时可能出现，简直像受刑。
        - id: ch01-b33
          speaker: narrator
          text: 她一直熬到晚上才回家，脸色苍白，安安静静。谁都看得出这一天不好过，可她一句也没有抱怨，甚至没说自己早晨归还作品的事。妈妈给了她一杯格外暖心的茶。贝思帮她换衣服，还编了一只可爱的花环戴在头上。乔则把全家吓了一跳。她一反常态，仔仔细细地打扮起来，又神秘地暗示，局面马上就要翻转。
        - id: ch01-b34
          speaker: amy
          text: 乔，求你别做没礼貌的事。我不许你闹乱子。让这事过去吧，你规矩一点。
        - id: ch01-b35
          speaker: jo
          text: 我只打算对每个认识的人都迷人得不得了，把他们尽量留在你那个角落。泰迪和伙伴们也会帮忙。今晚还是会很好玩的。
        - id: ch01-b36
          speaker: narrator
          text: 艾米先去找鲜花了。乔靠在门边等劳里。暮色里传来熟悉的脚步，她跑出去迎他。
        - id: ch01-b37
          speaker: jo
          text: 是我的小伙子来了吗？
        - id: ch01-b38
          speaker: laurie
          text: 当然，就像你是我的姑娘一样！
        - id: ch01-b39
          speaker: narrator
          text: 劳里把她的手挽进臂弯，那副神气，仿佛天下每一个心愿都已经满足。乔顾不上多说别的，立刻带着姐姐的满腔义愤，把艾米受到的委屈从头到尾全告诉他。
        - id: ch01-b40
          speaker: jo
          text: 泰迪，事情可多着呢！
        - id: ch01-b41
          speaker: laurie
          text: 我们一帮人过会儿都坐车去。我非让他们买光她所有的花，再守在摊位前不走。做不到，我就该下地狱。
        - id: ch01-b42
          speaker: jo
          text: 艾米说那些花很差，新鲜的又未必能及时送到。我不愿意冤枉人，可它们也许根本不会来。谁做得出第一件刻薄事，常常也做得出第二件。
        - id: ch01-b43
          speaker: laurie
          text: 海斯没把我们花园最好的花送来？我明明吩咐过。
        - id: ch01-b44
          speaker: jo
          text: 我不知道。他大概忘了。你爷爷不舒服，我虽说想要花，也不好拿这事烦他。
        - id: ch01-b45
          speaker: laurie
          text: 乔，这还用你开口吗？那些花是我的，也就是你的。我们什么东西不都是一人一半？
        - id: ch01-b46
          speaker: jo
          text: 天哪，但愿不是。你有些东西给我一半，我可受不了。别站在这里调情啦，我还得帮艾米。你快回去打扮漂亮，再让海斯送几束好花到大厅。我就永远祝福你。
        - id: ch01-b47
          speaker: laurie
          text: 你现在就不能祝福我吗？
        - id: ch01-b48
          speaker: narrator
          text: 乔立刻把门关在他面前。
        - id: ch01-b49
          speaker: jo
          text: 走开，泰迪，我忙着呢！
        - id: ch01-b50
          speaker: narrator
          text: 两个密谋的人果真把局面翻了过来。海斯送来一片花海，中央还摆了一篮用尽本领插好的鲜花。马奇一家全体出动。乔也使出真功夫，把认识的人都引到这个角落。大家听她胡扯说笑，夸艾米有品位，来了就舍不得走。劳里和朋友们勇敢地冲上前线，买光花束，再守在摊位前，把那个冷清的角落变成全场最热闹的地方。艾米又回到了自己最擅长的场面里。哪怕只为感谢大家，她也要表现得格外活泼周到。就在这时候，她终于相信，美德到底会带来酬报。
        - id: ch01-b51
          speaker: narrator
          text: 乔的举止也规矩得堪称榜样。等艾米快活地被那群护卫围住，她便在大厅里四处走动，听来一段段闲话，终于明白切斯特一家为什么临阵换人。原来自己的玩笑也惹出了这份嫌隙，她为此自责，决定尽快替艾米洗清干系。她还知道了艾米早晨归还作品的事，觉得妹妹简直是宽宏大量的典范。可经过艺术品摊位时，她四下寻找，却没看到艾米的作品，便猜它们全被塞到看不见的地方了。乔能原谅别人对自己的冒犯，却受不了家人受一点侮辱。她越看那些空处，越认定妹妹的作品是故意被人藏起来了。
        - id: ch01-b52
          speaker: may
          text: 晚上好，乔小姐。艾米那边怎么样？
        - id: ch01-b53
          speaker: jo
          text: 值得卖的，她全卖完了，现在玩得很开心。花摊一向招人喜欢嘛，尤其招男士喜欢。
        - id: ch01-b54
          speaker: narrator
          text: 梅温顺地受了这一刺，乔马上后悔，便称赞那两只还没卖掉的大花瓶。
        - id: ch01-b55
          speaker: jo
          text: 艾米那本彩饰经句册在这里吗？我想买给爸爸。
        - id: ch01-b56
          speaker: may
          text: 她的东西早就卖光了。我特意让合适的人都看到，卖得一笔很不错的钱。
        - id: ch01-b57
          speaker: narrator
          text: 这一天，梅也像艾米一样，战胜了好几次小小的诱惑。她没有把艾米的东西藏起来，也没有让它们受到冷落，反而特意把真正会欣赏的人带到作品前。乔听完十分满意，立刻跑回花摊报告好消息。艾米听说梅怎样说话，又是怎样的神情，既惊讶，也很感动。她先前送回作品的善意，到底得到了善意的回答。
        - id: ch01-b58
          speaker: amy
          text: 先生们，现在请你们也去照顾别的摊位，像在我这里一样慷慨，尤其别忘了艺术品摊位。
        - id: ch01-b59
          speaker: jo
          text: 到了那里，就喊“冲啊，切斯特，冲啊！”像男子汉一样尽责吧。你们花出去的钱，准能换回十足的艺术，各种意义上的艺术都有。
        - id: ch01-b60
          speaker: parker
          text: 闻命即从。毕竟马奇之美，远胜五月之梅。
        - id: ch01-b61
          speaker: laurie
          text: 说得很好，我的孩子。对一个小男孩来说，已经很好了！
        - id: ch01-b62
          speaker: narrator
          text: 小帕克拼命想说得既风趣又温柔，劳里却马上浇灭了他的得意。说完这句，他还像父亲似的拍拍帕克的头，把这个“小男孩”带走。
        - id: ch01-b63
          speaker: amy
          text: 劳里，把那两只花瓶买下来。
        - id: ch01-b64
          speaker: narrator
          text: 这是艾米最后一次把炭火堆到敌人头上，也就是用善意回报敌意。梅高兴极了。劳里不只买下花瓶，还一边胳膊夹一只，带着它们满场走，叫谁都能看到这笔采购。其他先生也同样不计后果，买下各种脆弱的小玩意。过后，他们抱着蜡花、彩绘扇子、金银丝镶嵌的文件夹，还有许多同样“实用又合宜”的东西，茫然无助地四处游荡。刚才还像一支勇敢方阵的年轻人，这会儿全让战利品压住了手脚。卡罗尔姑妈也在场。她听说全部经过，看起来很满意。她在角落里对马奇太太说了几句，马奇太太立刻满脸欢喜，又带着骄傲和忧虑望向艾米，却等了几天才解释自己为什么高兴。
        - id: ch01-b65
          speaker: narrator
          text: 人人都说义卖会办得很成功。梅同艾米道别时，不再像往常那样故意热情过头。她只是亲昵地吻了艾米一下，没有多说什么。可那眼神清清楚楚地表示，她希望两人彼此原谅，把事情忘掉。艾米得到这份真心的表示，已经完全满足。回到家，她又看见那两只花瓶堂堂正正摆在客厅壁炉台上，每只都插着一大束鲜花。经过这一天，它们已经不再只是梅的作品，也成了两人和解的证明。
        - id: ch01-b66
          speaker: laurie
          text: 这是颁给宽宏大量的马奇小姐的美德奖赏！
        - id: ch01-b67
          speaker: jo
          text: 艾米，你的原则、气量和品格，比我从前想的高贵得多。你今天做得真好，我打心底尊敬你。
        - id: ch01-b68
          speaker: beth
          text: 我们都尊敬你，也因为你肯原谅别人而爱你。你做了那么久，又一心想卖自己的漂亮作品，放弃它们一定很难。我不相信自己能像你这样和气。
        - id: ch01-b69
          speaker: amy
          text: 别这样夸我。我只是照自己希望别人待我的样子去待人。你们笑我想当淑女，可我是想在心地和举止上成为真正高尚的女人。我懂多少，就努力做多少。我不想让狭隘、愚蠢和过错毁掉自己。现在还差得很远，可我会尽力，希望将来能像妈妈一样。
        - id: ch01-b70
          speaker: narrator
          text: 艾米说这番话时十分认真。深夜里，姐妹俩正并肩梳着头发，贝思则躺在枕头上听着。乔终于听懂，艾米说的“淑女”并不是漂亮衣裳和得体姿态，而是她真正想追求的品格，便亲热地抱住她。她也第一次真心承认，妹妹已经学会了自己还不懂的那种礼貌。
        - id: ch01-b71
          speaker: jo
          text: 我现在明白了，以后再也不笑你。你比自己以为的进步更快。我要跟你学真正的礼貌，因为你已经懂得秘诀。继续努力吧，亲爱的。总有一天你会得到奖赏，到时没有人会比我更高兴。
        - id: ch01-b72
          speaker: narrator
          text: 一星期后，艾米果然得了奖赏，可怜的乔却发现，要为妹妹高兴并不容易。卡罗尔姑妈寄来一封信。马奇太太读信时，脸上亮得异乎寻常，简直藏不住欢喜。当时乔和贝思都在她身边，两人一看那副神情，立刻追问究竟是什么喜讯。乔还不知道，自己前几天随口说出的那些话，就要变成一个叫她痛心的后果。
        - id: ch01-b73
          speaker: mrs_march
          text: 卡罗尔姑妈下个月要出国，她想带……
        - id: ch01-b74
          speaker: jo
          text: 带我一起去！
        - id: ch01-b75
          speaker: mrs_march
          text: 不，亲爱的，不是你。她想带艾米。
        - id: ch01-b76
          speaker: jo
          text: 妈妈，她还太小，该先轮到我。我盼了这么久。这趟旅行对我会有那么多好处，也会美妙极了。我一定得去！
        - id: ch01-b77
          speaker: mrs_march
          text: 恐怕不行。姑妈在信里说得很明确，她要艾米。人家给我们这样的恩惠，我们不能替她作主。
        - id: ch01-b78
          speaker: jo
          text: 永远都是这样！艾米享尽乐趣，我却干尽苦活。太不公平了！
          emotion: angry
        - id: ch01-b79
          speaker: mrs_march
          text: 亲爱的，这恐怕有一部分是你自己的过错。姑妈前几天说，很遗憾你讲话太直，性子又太独立。她在信里还引用了你的话。她原来打算请你，可你说恩惠会压得你难受，又说讨厌法语，她便不敢请了。艾米比较温顺，会是弗洛的好伴侣，也会感激这次旅行带给她的帮助。
        - id: ch01-b80
          speaker: jo
          text: 我这张嘴，这张可恶的嘴！为什么我就是学不会让它安静？
          emotion: sad
        - id: ch01-b81
          speaker: mrs_march
          text: 我真希望你能去，可这一次没希望了。尽量高高兴兴地接受吧。别因为责怪和遗憾，扫了艾米的兴。
        - id: ch01-b82
          speaker: jo
          text: 我会尽力。我要学她，不只装出高兴，还要真心替她高兴。她每一分钟的幸福，我都不嫉妒。可这太难了，因为我真的失望透了。
          emotion: sad
        - id: ch01-b83
          speaker: narrator
          text: 乔跪下来，捡起刚才以为自己要去欧洲时，欢喜得一把打翻的针线篮。她用力眨着眼睛，还是有几滴苦涩极了的泪落下来，打湿了手里那个胖乎乎的小针插。
        - id: ch01-b84
          speaker: beth
          text: 亲爱的乔，我很自私，可我舍不得你。我真高兴你还不会马上离开。
          emotion: sad
        - id: ch01-b85
          speaker: narrator
          text: 贝思把乔连同针线篮一起紧紧抱住。那依恋的动作和充满爱意的脸，终于安慰了姐姐。可是尖锐的悔恨还在。乔恨不得扇自己一记耳光，再谦卑地去求卡罗尔姑妈把这项恩惠压到她身上，好让姑妈亲眼看看，她会多么感激地承担。至少在贝思怀里，她不用再独自咽下这份失望。
        - id: ch01-b86
          speaker: narrator
          text: 艾米回来时，乔已经能加入全家的欢庆。她没有平日那么热烈，却没有再抱怨妹妹的好运，也没让一句酸话损伤妹妹的快乐。她正在认真兑现自己的话，不只装出高兴，还尽力让心里真正高兴起来。艾米自己把消息当作天大的喜讯，带着一种庄严的狂喜在屋里走来走去。当天晚上，她便开始整理颜料、收拾画笔，仿佛旅程已经开始。至于衣服、钱和护照这些小事，全留给那些没有像她一样沉浸在艺术幻想中的人操心。在她眼里，罗马的艺术已经比行李更真实了。
        - id: ch01-b87
          speaker: amy
          text: 姑娘们，这对我不只是游玩。它会决定我的前途。要是我真有天才，到了罗马就会知道，也会做出成绩来证明。
        - id: ch01-b88
          speaker: jo
          text: 要是你没有呢？
        - id: ch01-b89
          speaker: amy
          text: 那我就回家教人画画，自己养活自己。
        - id: ch01-b90
          speaker: narrator
          text: 这位渴望成名的姑娘说得像个镇定的哲人，一想到回家教画的前景，却还是忍不住做了个苦脸。她低下头，又使劲刮起调色板，仿佛已经下定决心，在放弃艺术家的希望以前，先要采取最有力的办法，狠狠干上一场，绝不轻易认输。
        - id: ch01-b91
          speaker: jo
          text: 你才不会。你讨厌苦干。你会嫁给有钱人，回家舒舒服服做一辈子阔太太。
        - id: ch01-b92
          speaker: amy
          text: 你的预言有时会成真，可我不信这一个。我倒希望它成真。要是自己做不成艺术家，我也愿意有能力帮助真正的艺术家。
        - id: ch01-b93
          speaker: jo
          text: 只要是你的愿望，总会实现。我的愿望却一个也实现不了。
          emotion: sad
        - id: ch01-b94
          speaker: amy
          text: 你真的很想去吗？
        - id: ch01-b95
          speaker: jo
          text: 想得要命！
        - id: ch01-b96
          speaker: amy
          text: 那么过一两年，我就捎信叫你来。我们一起去古罗马广场挖遗物，把从前说过那么多次的计划全实现。
        - id: ch01-b97
          speaker: jo
          text: 谢谢。等那个快乐的日子来了，要是它真会来，我会提醒你别忘了自己的承诺。
        - id: ch01-b98
          speaker: narrator
          text: 留给全家准备的时间并不多。从消息传来到艾米动身，屋里始终忙得天翻地覆。乔一直支撑得很好，帮着做完该做的事。直到最后一抹飘动的蓝丝带从眼前消失，她才躲进自己的避难所，也就是阁楼，哭到再也流不出眼泪。艾米也一直坚强，直到轮船真正启航。跳板就要撤下时，她忽然真切地想到，很快会有一整片海洋隔在自己和最爱她的人之间。离别一下子不再只是旅行的一部分。她紧紧抓住最后还陪在身边的劳里，哭着开了口。
        - id: ch01-b99
          speaker: amy
          text: 请你替我照顾他们。要是出了什么事……
          emotion: sad
        - id: ch01-b100
          speaker: laurie
          text: 我会的，亲爱的，我一定会。要是出了什么事，我就去安慰你。
          emotion: calm
        - id: ch01-b101
          speaker: narrator
          text: 劳里当时绝没想到，有一天自己真会被要求履行这个诺言。艾米就这样扬帆远去，寻找旧世界。那片世界虽被称作古老，在年轻人的眼里，却总是新鲜而美丽。她的父亲和朋友站在岸边久久望着她，热切祈愿这个满心幸福的姑娘一路只遇温柔的命运，不要让离别的预感成真。艾米也一直朝他们挥手，把岸上的亲人留在视线里，直到再也看不清。最后，他们也看不见她了，只看见夏日阳光落在海面上，耀眼地闪烁。
