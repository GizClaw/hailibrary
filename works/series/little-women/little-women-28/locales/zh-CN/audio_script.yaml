audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，带着克制的幽默, timbre: 清澈柔和, pace: 从容舒展, pitch: 中音}
    jo:
      display_name: 乔
      tts: {delivery: 爽直活泼，情感来得快而真, timbre: 明亮有力, pace: 稍快, pitch: 中音}
    boy:
      display_name: 少年
      tts: {delivery: 直爽热情，带着少年人的兴奋, timbre: 清亮, pace: 稍快, pitch: 中高音}
    family_member:
      display_name: 一位家人
      tts: {delivery: 关切中带着亲昵的玩笑, timbre: 自然温和, pace: 适中, pitch: 中音}
    mr_march:
      display_name: 马奇先生
      tts: {delivery: 慈祥诚恳，带着父亲的欣慰, timbre: 温暖沉稳, pace: 从容, pitch: 中低音}
    amy:
      display_name: 艾米
      tts: {delivery: 讲究而伶俐，偶尔流露稚气, timbre: 清脆, pace: 适中, pitch: 中高音}
    mrs_march:
      display_name: 马奇太太
      tts: {delivery: 慈爱爽朗，沉稳中带着鼓励, timbre: 饱满温暖, pace: 从容, pitch: 中低音}
    meg:
      display_name: 梅格
      tts: {delivery: 端庄温和，语气稳重, timbre: 柔润, pace: 适中, pitch: 中音}
    beth:
      display_name: 贝思
      tts: {delivery: 温柔诚恳，羞怯克制, timbre: 轻柔纯净, pace: 舒缓, pitch: 中高音}
  chapters:
    - id: ch01
      title: 第二十七章　文学课
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 命运忽然朝乔笑了笑，在她脚边丢下一枚幸运的小钱。那当然不是金币，可就算给她五十万，只怕也换不来这笔小钱带给她的快乐。事情是这样开始的。
        - id: ch01-b02
          speaker: narrator
          text: 每隔几星期，乔就把自己关进房间，穿上写作服，一头卷进她所说的“旋涡”。小说不写完，她的心就安定不下来。那套写作服很简单。一件黑羊毛围裙，方便她随手擦笔。一顶同样料子的帽子，缀着鲜红的蝴蝶结。每逢她清空甲板准备开战，头发便全塞进帽子里。
        - id: ch01-b03
          speaker: narrator
          text: 这顶帽子就像一座信号灯塔，家里人远远看一眼，便知道乔写到了什么地步。帽檐低低压住额头，表示艰苦的工作正在进行。写到激动处，帽子会潇洒地斜到一边。要是绝望抓住了作者，她便把帽子整个扯下来，扔在地板上。闯进来的人这时会悄悄退出去，直到红蝴蝶结重新神气地竖在乔头上，大家才敢和她说话。
        - id: ch01-b04
          speaker: family_member
          text: 乔，天才烧起来了吗？
        - id: ch01-b05
          speaker: narrator
          text: 家人偶尔只敢探头这样问一句，有时连问也不问，只看看帽子就走。乔从没真把自己当成天才。可写作的劲头一来，她便毫无保留地扑进去，住进想象的世界。那里的朋友几乎和现实中的亲友一样真实可爱。她坐在那个世界里，安全又快活，也忘了匮乏、烦恼和坏天气。睡意不再来找她，饭菜摆在面前也顾不上吃，白天黑夜全都太短。只有这时候，她才能尝到那份福佑般的快乐。哪怕作品没有别的结果，只为这份快乐，那些日子也没有白过。灵感通常烧上一两个星期。等她从旋涡里出来，人已经又饿又困，不是暴躁，就是沮丧。
        - id: ch01-b06
          speaker: narrator
          text: 这次乔刚缓过来，就有人劝她陪克罗克小姐听讲座。她做了好事，立刻得到一个新念头作回报。那是面向大众的系列讲座，这一天讲的是金字塔。乔很纳闷，为什么给这样的听众选了这样的题目。后来她想，讲清法老的辉煌，想必能纠正某种重大的社会弊病，或满足什么迫切需要。可这些听众天天惦记的是煤价和面粉价，一辈子费力解着的问题，也比斯芬克斯之谜难得多。
        - id: ch01-b07
          speaker: narrator
          text: 她们来得早。克罗克小姐忙着补袜跟，乔便看起同排的听众。左边两位已婚太太一边谈女权，一边编梭结，厚重的女帽和宽阔的额头十分相配。再过去，一对不起眼的恋人毫不做作地牵着手。一个阴沉的老小姐从纸袋里拿薄荷糖吃，一个老先生躲在黄色大手帕后面，先睡起了讲座开始前的一觉。乔右边只坐着一个一脸好学模样、埋头看报的少年。
        - id: ch01-b08
          speaker: narrator
          text: 那是一份画报。离乔最近的插图热闹极了。她懒洋洋地猜着，到底怎样一连串巧合，才会需要这样一幅画。一个全副战斗装束的印第安人正掉下悬崖，狼还咬着他的喉咙。旁边两个怒不可遏的年轻绅士，脚小得不合常理，眼睛却大得惊人，正在互相挥刀猛刺。远处还有一个披头散发的女人，张大嘴巴逃跑。少年停下来翻页，这才看见乔也在瞧。
        - id: ch01-b09
          speaker: boy
          text: 你想看吗？这个故事可棒了。
        - id: ch01-b10
          speaker: narrator
          text: 乔笑着接过一半报纸。她长大以后，还是和从前一样喜欢男孩子。不久，她便走进了爱情、秘密和谋杀照例织成的迷宫。这类轻佻故事会放任种种激情出来胡闹。等作者的想象力用完，就让一场惊天灾难清理舞台，除掉一半人物，再让剩下的一半庆祝他们完蛋。
        - id: ch01-b11
          speaker: boy
          text: 怎么样，够精彩吧？
        - id: ch01-b12
          speaker: jo
          text: 我觉得咱们两个只要肯试，也写得出这样的东西。
        - id: ch01-b13
          speaker: narrator
          text: 乔见少年把这种胡扯当宝贝，觉得很好笑。
        - id: ch01-b14
          speaker: boy
          text: 我要能写出来，那才叫走运呢。听说她就靠这样的故事生活，挣得还很好。
        - id: ch01-b15
          speaker: narrator
          text: 少年指着标题下面的名字，S. L. A. N. 诺思伯里太太。
        - id: ch01-b16
          speaker: jo
          text: 你认识她？
        - id: ch01-b17
          speaker: boy
          text: 不认识，可她写的我每篇都看。我还认识一个在这家报馆做事的人。
        - id: ch01-b18
          speaker: jo
          text: 她写这种故事，真能挣到不少钱？
        - id: ch01-b19
          speaker: narrator
          text: 乔再看报上那群激动的人物和满页的惊叹号，眼神马上多了几分敬意。
        - id: ch01-b20
          speaker: boy
          text: 当然！大家喜欢看什么，她摸得一清二楚。她照着大家的口味写，报馆给的钱也很不错。
        - id: ch01-b21
          speaker: narrator
          text: 讲座开始了。桑兹教授慢吞吞地讲贝尔佐尼、胡夫、圣甲虫和象形文字，乔却一句也没听进去。她悄悄记下报社地址，决心去争那个一百美元的惊险故事奖。等讲座结束、听众醒来，她已在纸上替自己建起一笔辉煌的财富。这当然不是她头一次靠纸建起财富。她还忙着炮制故事，怎么也拿不定主意。决斗到底该在私奔之前，还是谋杀之后？
        - id: ch01-b22
          speaker: narrator
          text: 回家后，乔没有告诉任何人，第二天就开写。母亲一见天才又烧起来，总有些担心。乔以前只给《展翅雄鹰》写过很温和的传奇，这回却要另走一路。过去的经历和东一本西一本的阅读全派上了用场，让她多少明白怎样制造戏剧效果，还替她备好了情节、词句和服装。至于绝望和铤而走险这些让人难受的情绪，她懂得实在有限，也尽量把故事塞得满满的。地点放在里斯本，结尾再来一场地震，既醒目又合适。
        - id: ch01-b23
          speaker: narrator
          text: 稿子由乔悄悄寄走，还附上了一封短信。她谦虚地说，作者几乎不敢指望得奖。如果拿不到奖，不论编辑认为这篇故事值多少钱，她都非常乐意收下。
        - id: ch01-b24
          speaker: narrator
          text: 等六个星期很难，让一个姑娘保守秘密六个星期更难，可乔都办到了。就在她快要死心时，回信来了。信封一打开，一张一百美元的支票掉在膝上。乔像看见蛇似的，盯了整整一分钟，才读起信来，接着便哭了。
        - id: ch01-b25
          speaker: narrator
          text: 写信的好心先生若知道，一封亲切的短信能给另一个人这么强烈的幸福，准会把闲暇都用来做这种好事，只要他真有闲暇。乔看重那封信，甚至胜过钱，因为信给了她鼓励。努力了多年，她终于知道自己学会了一点本领。哪怕只是写惊险故事，能得到这样的肯定，也实在令人快慰。
        - id: ch01-b26
          speaker: narrator
          text: 她好不容易平静下来，一手拿信，一手拿支票，突然出现在全家面前，宣布自己得了奖。这个消息把大家震得目瞪口呆。那一刻，很少有年轻姑娘比她更骄傲。全家自然热热闹闹地庆祝起来。故事刊出后，人人都读，也都称赞。父亲夸它文笔好，爱情写得新鲜而有朝气，悲剧也够惊险。不过，他还是摇了摇头。
        - id: ch01-b27
          speaker: mr_march
          text: 乔，你能写得更好。眼光要放到最高处，不必把钱放在心上。
        - id: ch01-b28
          speaker: amy
          text: 我看钱才是最好的部分。这么大一笔财富，你要拿它做什么？
        - id: ch01-b29
          speaker: jo
          text: 送贝思和妈妈去海边住一两个月。
        - id: ch01-b30
          speaker: narrator
          text: 商量了好一阵，她们真的去了海边。贝思回来时没有大家盼的那么丰满红润，身体却好多了。马奇太太则说自己年轻了十岁。乔觉得这笔奖金花得很值，便兴高采烈地继续写，决心再挣几张那样可爱的支票。她也开始觉得，自己在这个家里成了一股真正有用的力量。
        - id: ch01-b31
          speaker: narrator
          text: 那一年，她真挣到了几张。她的“胡扯”经过笔尖一变，成了全家的舒适生活。《公爵的女儿》付了肉铺账单，《幽灵之手》换来新地毯，《考文垂家的诅咒》则给马奇一家买了食品和衣裳，反倒成了福气。财富当然十分可爱，贫穷也有朝阳照得到的一面。逆境的一项甜美用处，就是让人从诚恳的脑力或手工劳动里，尝到真正的满足。世上一半明智、美好又有益的东西，都该归功于匮乏激发出的灵感。乔也尝到了这份满足。她不再羡慕富家姑娘，因为自己要用什么，已经不必再向别人讨一分钱。
        - id: ch01-b32
          speaker: narrator
          text: 她的故事没引起多少注意，却总能找到买主。这给了乔勇气，她决定向名声和财富迈出更大胆的一步。她把自己的小说誊清了四遍，念给每一位知心朋友听，又怀着恐惧和希望，送到三家出版社去审阅。最后终于有人肯接手，条件是全书删掉三分之一，还得去掉所有她格外欣赏的部分。
        - id: ch01-b33
          speaker: jo
          text: 现在只有三条路。把它塞回铁皮小厨房，让它发霉。自己花钱印。或者照买主的意思砍碎，能拿多少算多少。名声放在家里很好看，现钱却更方便。这样的大事，我想请大家表决。
        - id: ch01-b34
          speaker: narrator
          text: 乔召集了家庭会议。
        - id: ch01-b35
          speaker: mr_march
          text: 别毁掉你的书，孩子。里面的东西比你自己知道的更多，构思也写得很好。先让它等一等，慢慢成熟吧。
        - id: ch01-b36
          speaker: narrator
          text: 马奇先生自己已经耐心等了三十年，让自己的果实慢慢成熟。他劝女儿等待，自己也一直这样做。如今果子即使已经变得香甜醇熟，他仍然一点也不急着采摘。
        - id: ch01-b37
          speaker: mrs_march
          text: 我倒觉得，接受这次考验，比继续等待更能让乔长进。批评会告诉她哪些长处和缺点是她没看见的，也能帮她下次写得更好。我们太偏爱她，外人的赞扬和责备反而有用，就算钱不多也值得。
        - id: ch01-b38
          speaker: jo
          text: 对，我也是这么想。这本书让我摆弄得太久，我已经不知道它到底是好，是坏，还是普普通通。要是冷静又公正的人肯看一遍，告诉我真实想法，那会帮我大忙。
        - id: ch01-b39
          speaker: meg
          text: 换作我，一个字也不删。你一删就会毁了它。这故事有意思的地方主要在人物心里，不在他们做了什么。要是不随时解释，读者会全弄糊涂。
        - id: ch01-b40
          speaker: narrator
          text: 梅格深信，这是世上最出色的小说。
        - id: ch01-b41
          speaker: jo
          text: 可艾伦先生叫我删掉解释，把篇幅写短，情节写得有戏，让人物自己把故事说出来。
        - id: ch01-b42
          speaker: narrator
          text: 乔拿起出版商的信，念给她们听。
        - id: ch01-b43
          speaker: amy
          text: 那就听他的。他知道什么书卖得掉，我们不知道。你先写一本大家爱看的书，尽量多挣些钱。等你有了名气，再随意离开正题，把哲学家和玄学家都塞进小说也不迟。
        - id: ch01-b44
          speaker: narrator
          text: 艾米看这件事，完全讲究实际。
        - id: ch01-b45
          speaker: jo
          text: 要是我的人物真有那么多“哲学和玄学”，那可不能怪我。这些东西我一点也不懂，只偶尔听爸爸讲过。也许我把他的聪明念头混进了爱情故事，那对我倒是好事。贝思，你觉得呢？
        - id: ch01-b46
          speaker: beth
          text: 我真想早一点看见它印出来。
        - id: ch01-b47
          speaker: narrator
          text: 贝思说得不多，还带着微笑。可“早一点”这几个字，不知不觉重了些。她那双始终像孩子一样坦诚的眼睛，也露出依依的神情。乔心里忽然一冷，一阵不祥的恐惧掠过去。她当即决定，早一点开始这场小冒险。
        - id: ch01-b48
          speaker: narrator
          text: 于是，年轻的女作家拿出斯巴达勇士般的刚毅，把自己的头生孩子放在桌上，像吃人的巨怪一样，毫不留情地砍起来。她一心想让每个人都满意，便听取每个人的劝告。结果正像寓言里那个老人和他的驴，她最后谁也没有讨好。
        - id: ch01-b49
          speaker: narrator
          text: 父亲喜欢书中无意混进去的那一缕玄学气息。乔自己虽有疑问，还是把它留下了。母亲嫌描写稍微多了一点，她便删掉描写，也把许多不可缺少的情节纽带一并剪断。梅格爱看悲剧，乔为讨她喜欢，就把痛苦越堆越高。艾米反对书里的诙谐，乔怀着世上最好的心意，又扑灭了那些原本能让阴郁故事喘口气的活泼场面。
        - id: ch01-b50
          speaker: narrator
          text: 最后，她再删掉全书三分之一。那本可怜的小传奇，像只拔光羽毛的知更鸟，被她信任地送进辽阔忙碌的世界，独自去碰运气。
        - id: ch01-b51
          speaker: narrator
          text: 书到底出版了。乔拿到三百美元，也收到许多赞扬和责备。两样都比她预料的多得多，把她一下搅进茫然混乱里，过了好一阵才从中缓过来。
        - id: ch01-b52
          speaker: jo
          text: 妈妈，您说批评能帮我。可这些话全在互相打架，我怎么知道自己是写了本有希望的书，还是把十诫都犯遍了？这个人说，我的书精美极了，充满真实、美和诚意，还说每一页都甜美、纯洁、健康。
        - id: ch01-b53
          speaker: narrator
          text: 可怜的乔翻着一大摞评论。每读一篇，心情就跟着变一次，前一分钟还骄傲欢喜，后一分钟便气愤沮丧，完全不知道该信哪一个人。
        - id: ch01-b54
          speaker: jo
          text: 下一个人却说，这本书主旨有害，满是病态幻想、招魂术思想和不合人性的角色。可我根本没想过什么主旨，也不相信招魂术，人物还是照真人写的。他怎么会说得对？还有人说，这是多年来美国最好的小说之一。那当然不是。紧接着又有人说，它虽然新颖，也写得有力量、有感情，却非常危险。它一点也不危险！
        - id: ch01-b55
          speaker: jo
          text: 有人取笑它，有人把它夸上天。几乎人人都坚持说，我藏了一套深奥理论，可我写书只为了开心，也为了挣钱。我真后悔没有把全文印出来。要不然，干脆一本也别印。我最讨厌别人这样误解我。
          emotion: angry
        - id: ch01-b56
          speaker: narrator
          text: 家人和朋友毫不吝惜地安慰她、称赞她。可乔敏感又心高气傲，明明抱着最好的心意，结果却仿佛把事情做得一团糟，那段日子依旧很难熬。不过，这番经历确实对她有益。那些意见真正有分量的人，给了她最能教育作者的批评，那正是作者最好的功课。
        - id: ch01-b57
          speaker: narrator
          text: 最初那阵刺痛过去以后，乔已经能笑一笑自己那本可怜的小书，却没有因此失去对它的信心。经历了外界这一番毫不客气的拍打，她知道自己变得更聪明，也更坚强了。
        - id: ch01-b58
          speaker: jo
          text: 我不是济慈那样的天才，这点打击要不了我的命。说到底，笑话还在我这边。那些从真人真事里直接拿来的部分，偏让人骂作不可能、太荒唐。我从自己傻脑袋里编出来的场面，他们反倒说，自然得迷人，又温柔，又真实。我就拿这件事安慰自己。等准备好了，我还会再站起来，重新试一次。
