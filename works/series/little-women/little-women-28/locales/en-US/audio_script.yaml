  chapters:
    - id: ch01
      title: Jo's Writing Vortex
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Fortune suddenly smiled on Jo and dropped a lucky penny in her path. It was not a gold penny, but half a million dollars could hardly have made her happier than the small sum that came her way.
        - id: ch01-b02
          speaker: narrator
          text: Every few weeks, Jo shut herself in her room, put on what she called her scribbling suit, and fell into a vortex. She wrote at her novel with all her heart. Until it was finished, she could not rest. Her costume was a black wool pinafore, handy for wiping her pen, and a matching cap with a bright red bow. Into that cap went all her hair whenever she cleared the decks for action.
        - id: ch01-b03
          speaker: narrator
          text: The cap warned the whole family to keep its distance. Now and then, someone would peek through the door and ask whether genius was burning. Often they did not even dare to ask. They simply looked at the cap. Pulled low over Jo's forehead, it meant hard work. Knocked rakishly to one side, it meant an exciting passage. If despair took hold of her, Jo tore it off and threw it on the floor. Any visitor who saw that slipped away without a word. No one spoke to Jo again until the red bow stood cheerfully upright on her gifted brow.
        - id: ch01-b04
          speaker: narrator
          text: Jo did not believe she was a genius. Still, when the writing fit seized her, she surrendered completely. Safe in her imaginary world, she forgot bad weather, worry, and want. The friends she invented felt nearly as dear and real as the people around her. She lost sleep. Meals sat untouched. Days and nights seemed far too short. Nothing else gave her such happiness, and those hours felt worth living even if they produced nothing more.
        - id: ch01-b05
          speaker: narrator
          text: The inspiration usually lasted a week or two. Then Jo stumbled out of her vortex hungry, sleepy, cross, or discouraged.
    - id: ch02
      title: A Story at the Lecture
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Jo was just recovering from one of these attacks when someone persuaded her to escort Miss Crocker to a lecture. Her good deed brought her a new idea. The lecture was part of a People's Course, and its subject was the Pyramids. Jo wondered why that audience had been given such a topic. Perhaps, she thought, hearing about the glory of the Pharaohs was somehow meant to cure a social evil or meet a great need. Meanwhile, the listeners worried about flour and coal, and spent their lives solving riddles harder than the Sphinx's.
        - id: ch02-b02
          speaker: narrator
          text: They arrived early. Miss Crocker repaired the heel of her stocking while Jo studied the people sharing their row. On her left, two grand-looking matrons made tatting and discussed women's rights. Past them, a pair of modest young lovers held hands. A gloomy spinster ate peppermints from a paper bag, and an old gentleman prepared for the lecture with a nap behind his yellow bandanna. Jo's only neighbor on the right was a studious-looking boy buried in a newspaper.
        - id: ch02-b03
          speaker: narrator
          text: It was an illustrated paper, and the picture nearest Jo soon caught her eye. An Indian in full war dress was falling over a cliff with a wolf at his throat. Nearby, two furious young men with huge eyes and tiny feet stabbed each other. Behind them, a woman with flying hair ran away, her mouth wide open. The boy paused to turn the page, noticed Jo looking, and good-naturedly offered her half the paper.
        - id: ch02-b04
          speaker: young_reader
          text: Want to read it? This story's terrific.
        - id: ch02-b05
          speaker: narrator
          text: Jo smiled and accepted. She had always liked boys. Before long, she was lost in the familiar maze of love, mystery, and murder. It was the kind of light fiction where every passion ran wild. Whenever the author's invention gave out, one magnificent disaster swept half the characters off the stage so the survivors could celebrate.
        - id: ch02-b06
          speaker: young_reader
          text: Great, isn't it?
        - id: ch02-b07
          speaker: narrator
          text: He asked just as Jo reached the final paragraph on her half of the page.
        - id: ch02-b08
          speaker: jo
          text: You know, I think you and I could write something just as good if we tried.
        - id: ch02-b09
          speaker: narrator
          text: Jo was amused that he admired such trash.
        - id: ch02-b10
          speaker: young_reader
          text: I'd call myself mighty lucky if I could. They say she earns a good living from stories like these.
        - id: ch02-b11
          speaker: narrator
          text: He pointed to the author's name below the title. It was Mrs. S. L. A. N. G. Northbury.
        - id: ch02-b12
          speaker: jo
          text: Do you know her?
        - id: ch02-b13
          speaker: young_reader
          text: No, but I read everything she writes. And I know a fellow who works at the office that prints this paper.
        - id: ch02-b14
          speaker: jo
          text: Are you sure she makes good money writing stories like this?
        - id: ch02-b15
          speaker: narrator
          text: Jo looked again at the frantic figures and all the exclamation marks. They seemed much more respectable now.
        - id: ch02-b16
          speaker: young_reader
          text: You bet she does! She knows exactly what people want, and they pay her well to write it.
        - id: ch02-b17
          speaker: narrator
          text: The lecture began. Jo heard almost none of it. While Professor Sands droned on about Belzoni, Cheops, scarabs, and hieroglyphics, she quietly copied the newspaper's address. Its columns offered a hundred-dollar prize for a sensational story, and Jo boldly decided to compete. By the time the lecture ended and the audience woke up, she had already built herself a wonderful fortune on paper. In her mind, the new story was well underway. She only had to decide whether the duel belonged before the elopement or after the murder.
        - id: ch02-b18
          speaker: narrator
          text: Jo kept the plan secret at home and started work the next day. This worried her mother, who always looked anxious when genius began to burn. Jo had never tried this sort of writing. Until then, she had been satisfied with very mild romances for The Spread Eagle. Now her experience and her mixed reading helped with the dramatic effects, plots, language, and costumes.
        - id: ch02-b19
          speaker: narrator
          text: She filled the story with as much desperation and despair as her small acquaintance with those uncomfortable feelings allowed. She set it in Lisbon and ended it with an earthquake, which seemed both striking and suitable. Then she secretly mailed the manuscript. Her note modestly said she hardly expected the prize, but if the tale did not win, she would gladly accept whatever payment it was thought to be worth.
        - id: ch02-b20
          speaker: narrator
          text: Six weeks is a long wait, and an even longer time for a girl to keep a secret. Jo managed both. She was beginning to lose hope of ever seeing her manuscript again when a letter arrived. She opened it, and a check for one hundred dollars dropped into her lap. It nearly took her breath away.
        - id: ch02-b21
          speaker: narrator
          text: For a moment, Jo stared at the check as though it were a snake. Then she read the letter and began to cry. The gentleman who wrote that kind note could not have known how much happiness he had given another person. If he had, he might have spent every spare hour doing it again. The note meant even more to Jo than the money. After years of trying, someone had encouraged her. At last, she had learned to do something well, even if that something was only writing a sensational story.
    - id: ch03
      title: The Hundred-Dollar Prize
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Few young women had ever looked prouder than Jo did once she had composed herself. She startled the whole family by walking in with the letter in one hand and the check in the other, then announced that she had won the prize. Everyone celebrated. When the story appeared, they all read it and praised it. Her father said the language was good, the romance was fresh and hearty, and the tragedy was genuinely thrilling. Then he shook his head and gave her his unworldly advice.
        - id: ch03-b02
          speaker: mr_march
          text: You can write something better than this, Jo. Set your sights on the highest work, and don't worry about the money.
        - id: ch03-b03
          speaker: amy
          text: I think the money is the finest part. What are you going to do with such a fortune?
        - id: ch03-b04
          speaker: narrator
          text: Amy gazed respectfully at that magical piece of paper.
        - id: ch03-b05
          speaker: jo
          text: I'm sending Beth and Mother to the seaside for a month or two.
        - id: ch03-b06
          speaker: narrator
          text: After plenty of discussion, they went. Beth did not return as rosy and plump as everyone wished, but she was much better. Mrs. March said she felt ten years younger. Jo was satisfied with the way she had invested her prize and cheerfully set out to earn more of those wonderful checks.
        - id: ch03-b07
          speaker: narrator
          text: She earned several more that year. Her pen seemed to give her real power in the house, because it changed her rubbish into comforts for the family. The Duke's Daughter paid the butcher. A Phantom Hand bought a new carpet. The Curse of the Coventrys turned into a blessing for the Marches by providing groceries and gowns.
        - id: ch03-b08
          speaker: narrator
          text: Wealth is certainly pleasant, but poverty has its bright side. One sweet gift of hard times is the deep satisfaction of honest work, whether it is done with the head or the hands. Need has inspired half the wise, beautiful, useful things in the world. Jo now knew some of that satisfaction. She stopped envying richer girls. It comforted her to know she could provide for herself without asking anyone for a penny.
    - id: ch04
      title: The Family Council
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Jo's stories did not attract much notice, but editors bought them, and that gave her courage. She decided to make one daring attempt at fame and fortune. She had copied her novel four times, read it to every trusted friend, and sent it trembling to three publishers. At last, one agreed to take it, but only if she removed a third of the book and cut every part she especially admired.
        - id: ch04-b02
          speaker: jo
          text: Here are my choices. I can put it back in my tin kitchen and let it get moldy. I can pay to print it myself. Or I can chop it up for the buyers and take whatever they'll give me. Fame is very nice to keep around the house, but money is more useful. So I'm calling a family council. What should I do?
        - id: ch04-b03
          speaker: mr_march
          text: Don't ruin your book, my girl. There is more in it than you realize, and the main idea is worked out well. Put it aside and give it time to ripen.
        - id: ch04-b04
          speaker: narrator
          text: Her father followed that rule himself. He had waited patiently for thirty years while his own fruit ripened, and even now, when it was sweet and mellow, he felt no hurry to gather it.
        - id: ch04-b05
          speaker: mrs_march
          text: I think Jo may learn more by trying this than by waiting. Outside criticism will test the work. It can uncover strengths and weaknesses she doesn't know about, and it can help her do better next time. We love her too much to judge fairly. Other people's praise and blame may be useful, even if she earns very little.
        - id: ch04-b06
          speaker: jo
          text: Yes, that's exactly it. I've worried over this book for so long that I can't tell whether it's good, bad, or somewhere in between. I need cool, fair-minded people to read it and tell me honestly what they think.
        - id: ch04-b07
          speaker: meg
          text: I wouldn't cut a single word. You'll spoil everything. The real interest is in what the characters think, not only in what they do. If you don't explain things as the story goes along, no one will understand it.
        - id: ch04-b08
          speaker: narrator
          text: Meg was firmly convinced that Jo had written the most remarkable novel in the world.
        - id: ch04-b09
          speaker: jo
          text: But Mr. Allen says I should cut the explanations, keep it short and dramatic, and make the characters carry the story themselves.
        - id: ch04-b10
          speaker: narrator
          text: Jo turned to the publisher's note as she spoke.
        - id: ch04-b11
          speaker: amy
          text: Then follow his advice. He knows what people will buy, and we don't. Write a good popular book and earn as much as you can. Once you're famous, you'll be able to wander off the subject and fill your novels with philosophical and metaphysical people.
        - id: ch04-b12
          speaker: narrator
          text: Amy took the strictly practical view.
        - id: ch04-b13
          speaker: jo
          text: If my characters really are philosophical and metaphysical, don't blame me. I know nothing about either one, except for things I sometimes hear Father say. If some of his wise ideas got mixed up in my romance, so much the better for me. Now, Beth, what do you think?
        - id: ch04-b14
          speaker: narrator
          text: Jo laughed as she asked.
        - id: ch04-b15
          speaker: beth
          text: I would dearly love to see it printed soon.
        - id: ch04-b16
          speaker: narrator
          text: That was all Beth said, and she smiled. But without meaning to, she put special weight on the word soon. Her eyes had a wistful look, though they still held their childlike honesty. For one moment, Jo's heart went cold with fear. She decided then to make her little attempt soon.
        - id: ch04-b17
          speaker: narrator
          text: With Spartan courage, the young author laid her firstborn book on the table and hacked at it as mercilessly as an ogre. She tried to please everybody by taking everybody's advice. Like the old man and his donkey in the fable, she ended by pleasing no one.
        - id: ch04-b18
          speaker: narrator
          text: Her father liked the metaphysical thread that had slipped in without her knowing it, so she kept that, though she had doubts. Her mother thought there was a little too much description, so out it came, along with many links the story needed. Meg admired the tragedy, and Jo made it even more painful for her. Amy objected to the humor, so Jo smothered the lively scenes that had brightened the gloomy tale.
        - id: ch04-b19
          speaker: narrator
          text: To finish the damage, Jo cut away one third. Then, full of trust, she sent the poor little romance into the great busy world to meet its fate. It looked like a robin with all its feathers plucked.
    - id: ch05
      title: Praise and Blame
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The book was printed, and Jo received three hundred dollars. She also received plenty of praise and blame. Both came in far greater amounts than she had expected, and for a while they left her completely bewildered.
        - id: ch05-b02
          speaker: jo
          text: Mother, you said criticism would help me. But how can it help when every critic says something different? I can't tell whether I've written a promising book or broken all ten commandments!
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: Poor Jo turned through a heap of reviews. One minute they filled her with pride and delight. The next, they made her furious and miserable.
        - id: ch05-b04
          speaker: jo
          text: Listen to this man. He calls it an exquisite book, full of truth, beauty, and earnest feeling. Then he says every part is sweet, pure, and wholesome.
        - id: ch05-b05
          speaker: narrator
          text: The puzzled author went on to the next review.
        - id: ch05-b06
          speaker: jo
          text: But this one says the whole theory is bad. He finds morbid fantasies, spiritualist ideas, and unnatural characters everywhere. How can he be right? I didn't have any theory at all. I don't believe in Spiritualism, and I copied my characters from real people. Another critic calls it one of the best American novels in years, though I know better than that. Then the very next one says the book is original and powerful and full of feeling, but dangerous. It is not dangerous! Some reviewers laugh at it. Others praise it far too much. Nearly every one of them insists I was trying to explain some deep theory. I only wrote the thing because I enjoyed it and wanted the money. I wish I had printed the whole book or none of it. I hate being misunderstood like this.
          emotion: angry
        - id: ch05-b07
          speaker: narrator
          text: Her family and friends gave her all the comfort and praise they could. Even so, it was a painful time for sensitive, high-spirited Jo. She had meant so well, yet it seemed that she had done badly.
        - id: ch05-b08
          speaker: narrator
          text: In the end, the experience helped her. People whose opinions truly mattered offered the kind of criticism that gives an author the best education. Once the first hurt had faded, Jo could laugh at her poor little book and still believe in it. The rough treatment had left her wiser and stronger.
        - id: ch05-b09
          speaker: jo
          text: Well, I'm no genius like Keats, so this won't kill me. And really, the joke is on my side. The parts I copied straight from life have been called impossible and absurd. The scenes I invented out of my own silly head are supposed to be charmingly natural, tender, and true. I'll take comfort in that. When I'm ready, I'll get up and try again.
