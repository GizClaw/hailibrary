audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "warm, observant, and gently playful", timbre: "clear and inviting", pace: measured, pitch: medium}
    jo:
      display_name: Jo
      tts: {delivery: "quick, candid, and spirited", timbre: "bright and slightly husky", pace: lively, pitch: medium-low}
    beth:
      display_name: Beth
      tts: {delivery: "quiet, tender, and earnest", timbre: "soft and airy", pace: unhurried, pitch: medium-high}
  chapters:
    - id: ch01
      title: A Happy Last Year
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At first, the truth was bitter. Then the family accepted what they could not change. They tried to carry it cheerfully, loving and helping one another more than ever, and each of them did a part in making Beth's last year happy.
        - id: ch01-b02
          speaker: narrator
          text: They gave Beth the pleasantest room in the house and filled it with everything she loved. There were flowers and pictures, her piano and little worktable, and her beloved cats. Father's best books appeared there, along with Mother's easy chair, Jo's desk, and Amy's finest sketches. Every day, Meg brought the babies to visit Aunty Beth, and their company brightened the room.
        - id: ch01-b03
          speaker: narrator
          text: John quietly saved a little money so Beth could always have the fruit she wanted. Hannah never tired of making delicate dishes to tempt her uncertain appetite, though tears fell as she worked. Gifts and cheerful letters came from across the sea, carrying something of the warmth and fragrance of countries where winter never came.
        - id: ch01-b04
          speaker: narrator
          text: Beth sat among them, cherished like a household saint in her shrine. She was as peaceful and busy as ever. Even as she prepared to leave life, she was still trying to make life happier for everyone who would remain. Her weak fingers were rarely still. She made small gifts for the schoolchildren who passed the house each day.
        - id: ch01-b05
          speaker: narrator
          text: A pair of mittens dropped from her window to warm two purple hands. A little mother with many dolls received a needlebook. Young writers laboring through rows of pothooks got penwipers, and children who loved pictures got scrapbooks. Beth made one clever little thing after another, until those reluctant students felt that the hard ladder of learning had been scattered with flowers.
        - id: ch01-b06
          speaker: narrator
          text: They began to think of the gentle giver upstairs as a fairy godmother who somehow knew exactly what each child would like and need. If Beth wanted any reward, she found it in the bright faces turned toward her window, the nods and smiles, and the funny little letters covered with blots and gratitude.
        - id: ch01-b07
          speaker: narrator
          text: Those first months were very happy. The family often gathered in Beth's sunny room. The babies kicked and crowed on the floor. Mother and the girls worked nearby, while Father read aloud from old, wise books. His warm voice made their words of hope and faith feel meant for this very hour. It was like a small chapel, with a loving father helping his family face lessons that everyone must learn. Sometimes his voice faltered, and that made the words touch them even more deeply.
        - id: ch01-b08
          speaker: beth
          text: How lovely all of this is!
    - id: ch02
      title: The Heavy Days
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: That peaceful season prepared them for the sad hours ahead. After a while, Beth said her needle had grown too heavy. She laid it down and never picked it up again. Talking exhausted her. Faces troubled her. Pain took hold of her, and the suffering of her frail body disturbed the quiet of her spirit.
        - id: ch02-b02
          speaker: narrator
          text: The days were heavy, and the nights felt very long. Hearts ached and prayers pleaded for relief. The people who loved Beth best had to watch her reach out her thin hands to them and hear her bitter cry when there was nothing they could do.
        - id: ch02-b03
          speaker: beth
          text: Help me. Oh, please help me!
          emotion: fearful
        - id: ch02-b04
          speaker: narrator
          text: It was a darkening of her peaceful spirit and a sharp struggle between her young life and death. Mercifully, neither lasted long. When her natural rebellion had passed, her old peace returned, lovelier than before. As Beth's frail body failed, her soul grew strong. She said little, but everyone near her knew she was ready. They felt that the first one called on this journey was also the one most prepared to go. So they waited beside her on the shore, trying to see the Shining Ones who would come when she crossed the river.
        - id: ch02-b05
          speaker: narrator
          text: Jo never left Beth for even an hour after Beth told her she felt stronger when Jo was near. Jo slept on a couch in the room. She woke again and again to tend the fire, bring food, lift Beth, or help the patient sister who almost never asked for anything and always tried not to be a burden. Jo stayed there all day too. She was jealous of every other nurse, and being chosen by Beth made her prouder than any honor she ever received later in life.
        - id: ch02-b06
          speaker: narrator
          text: Those hours were precious to Jo, and they changed her. Beth gently taught her patience. Through Beth, Jo learned kindness toward everyone, the grace to forgive and truly forget hurt, the loyalty that makes even the hardest duty easier, and a sincere faith that could face anything without fear.
        - id: ch02-b07
          speaker: narrator
          text: Jo would wake and find Beth reading her worn little book. Sometimes Beth sang softly to pass a sleepless night. Sometimes she rested her face in her hands while slow tears slipped between her thin fingers. Jo watched with thoughts too deep for tears. She knew Beth was slowly loosening her hold on the dear life she had known and preparing herself for the life ahead through comforting words, quiet prayers, and the music she loved.
        - id: ch02-b08
          speaker: narrator
          text: That sight taught Jo more than the wisest sermon, the holiest hymn, or the most earnest prayer. Sorrow had softened her heart and tears had cleared her eyes. At last she understood the beauty of Beth's quiet life. It held no great adventures or ambitions, yet it was full of true goodness, the kind that smells sweet and blossoms even in the dust. Beth forgot herself, and that made her humble life precious. It was a kind of success anyone might reach.
    - id: ch03
      title: My Beth
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: One night, Beth searched the books on her table for something that might help her forget the deadly weariness that was almost as hard to bear as pain. She was turning the pages of her old favorite, Pilgrim's Progress, when she found a small paper covered in Jo's handwriting. Her own name caught her eye. The blurred ink told her that tears had fallen on the page.
        - id: ch03-b02
          speaker: beth
          text: Poor Jo. She's sound asleep, so I won't wake her to ask. She lets me see everything she writes. I don't think she'll mind if I read this.
        - id: ch03-b03
          speaker: narrator
          text: Beth glanced at Jo. Her sister lay asleep on the rug with the fire tongs beside her, ready to wake the moment the burning log broke apart. Then Beth read the poem Jo had called "My Beth."
        - id: ch03-b04
          speaker: jo
          text: You sit so patiently in shadow, waiting for the blessed light, a calm and saintly presence blessing all our troubled home. Earthly joys and hopes and sorrows break like ripples on the shore of that deep and solemn river where your willing feet now stand. Oh, my sister, as you pass beyond our human care and struggle, leave me the virtues that have made your life so beautiful. Give me your sustaining patience and your cheerful spirit, uncomplaining even in the prison of pain. Give me the wise, sweet courage that has made the path of duty green beneath your willing feet. Give me your unselfish heart, so full of charity that it can forgive a wrong for love's sake. Gentle heart, forgive mine. As I learn this hard lesson, our parting loses some of its bitterness, and my great loss becomes my gain. Grief will make my wild nature calmer. It will give my life new hopes and teach me to trust what I cannot see. When you are safely across the river, I will always picture your beloved spirit waiting on the shore. Hope and faith, born from my sorrow, will become my guardian angels. And my sister, who went before me, will take their hands and lead me home.
        - id: ch03-b05
          speaker: narrator
          text: The lines were imperfect, weak in places, and blurred with tears. Still, they brought a comfort to Beth's face that words could not express. Her one regret had been the fear that she had done so little. Jo's poem told her that her life had not been useless and that her death would not leave Jo without hope.
        - id: ch03-b06
          speaker: narrator
          text: Beth sat with the folded paper between her hands. Then the charred log broke apart. Jo sprang awake, brought the fire back to life, and crept to the bedside, hoping that Beth was asleep.
    - id: ch04
      title: Love Cannot Part Us
      blocks:
        - id: ch04-b01
          speaker: beth
          text: I'm awake, dear, and I'm so happy. Look what I found. I read it because I knew you wouldn't mind. Jo, have I truly been all of this to you?
          emotion: happy
        - id: ch04-b02
          speaker: jo
          text: Oh, Beth. You've been so much more. So much more.
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: Jo lowered her head onto the pillow beside her sister.
        - id: ch04-b04
          speaker: beth
          text: Then I don't feel that I've wasted my life. I'm not as good as your poem says, but I have tried to do what was right. It's too late for me to begin again and do better. But knowing that you love me this much, and that you believe I've helped you, is such a comfort.
        - id: ch04-b05
          speaker: jo
          text: You've helped me more than anyone in the world. I used to think I could never let you go. Now I'm beginning to understand that I won't lose you. You'll mean more to me than ever. Death can't really separate us, even if it seems that way.
        - id: ch04-b06
          speaker: beth
          text: I know it can't. I'm not afraid anymore. I'll still be your Beth, and I'll love you and help you more than ever. When I'm gone, you must take my place. Be everything you can to Father and Mother. They'll turn to you, Jo, so don't fail them. If working alone is hard, remember that I won't forget you. Doing that work will make you happier than writing wonderful books or traveling all over the world. Love is the one thing we can carry with us when we go, and love makes the end so easy.
        - id: ch04-b07
          speaker: jo
          text: I'll try, Beth.
        - id: ch04-b08
          speaker: narrator
          text: In that moment, Jo gave up her old ambition and promised herself to a new and better one. Her other desires seemed poor beside it. She found deep comfort in believing that love could never die.
    - id: ch05
      title: The Tide Goes Out
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The spring days came and went. The sky cleared, the earth grew greener, and the flowers came early. The birds returned in time to say goodbye to Beth. Like a tired but trusting child, she held the hands that had guided her all her life. Father and Mother led her gently through the Valley of the Shadow, and gave her up to God.
        - id: ch05-b02
          speaker: narrator
          text: Outside of books, dying people rarely speak memorable last words, see visions, or leave this world with radiant faces. People who have watched many lives end know that death usually comes as naturally and simply as sleep. Just as Beth had hoped, the tide went out easily. In the dark hour before dawn, she rested against the same breast where she had drawn her first breath. There she quietly drew her last, with no farewell except one loving look and one small sigh.
        - id: ch05-b03
          speaker: narrator
          text: With tears, prayers, and tender hands, Mother and the sisters prepared Beth for the long sleep that pain could never disturb again. They watched a beautiful peace settle over her face. It replaced the patient suffering that had hurt them for so long. Even in their grief, they felt a reverent joy. For their darling, death had come as a kindly angel, not as a terrifying ghost.
        - id: ch05-b04
          speaker: narrator
          text: Morning came. For the first time in many months, the fire was out. Jo's place was empty, and the room was very still.
        - id: ch05-b05
          speaker: narrator
          text: But a bird sang brightly on a budding branch nearby. Fresh snowdrops bloomed at the window. Spring sunlight poured into the room like a blessing and rested on the peaceful face upon the pillow. That face was so free from pain that the people who loved Beth best smiled through their tears and thanked God that she was well at last.
