audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温柔克制，哀而不伤，怀着安静的慈爱
        timbre: 清澈柔和的成年女声
        pace: 舒缓从容，沉痛处略慢
        pitch: 中音
    beth:
      display_name: 贝丝
      tts:
        delivery: 温柔真挚，虚弱中带着安宁和坚定
        timbre: 轻柔纯净的年轻女声
        pace: 缓慢，气息轻
        pitch: 中高音
    jo:
      display_name: 乔
      tts:
        delivery: 热烈坦率，悲伤时竭力克制
        timbre: 清亮而略低的年轻女声
        pace: 适中，动情时稍急
        pitch: 中音
  chapters:
    - id: ch01
      title: 最后一年
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 最初那阵苦痛过去以后，一家人终于接受了无可挽回的事实。他们尽力开朗地承受，也比从前更加疼爱、扶持彼此。大家把悲伤藏起来，各自尽一份心，要让贝丝最后这一年过得幸福。
        - id: ch01-b02
          speaker: narrator
          text: 家里最舒服的房间留给了贝丝。鲜花、图画、钢琴、小针线桌，还有她心爱的猫咪，全都陪着她。爸爸拿来最好的书，妈妈搬来安乐椅，乔把书桌放进来，艾米也送来最得意的画。梅格每天带两个孩子来看贝丝姑姑，让屋里热闹明亮。约翰悄悄留下一笔钱，常买她想吃的水果。只要能一直供给病中的贝丝，他自己也觉得快乐。老汉娜从不厌倦，总变着花样做精巧的小菜，想哄她反复无常的胃口多吃几口，自己却一边做一边流泪。海那边还有小礼物和愉快的信寄来，像从没有冬天的地方送来一阵暖风和花香。
        - id: ch01-b03
          speaker: narrator
          text: 贝丝受到全家的珍爱，像安放在圣龛里的家庭圣女。可她还是像从前一样忙，什么也改变不了她温柔无私的天性。即使要离开人世，她也只想着怎样让留下的人快乐。那双无力的手从不闲着。上学的孩子天天从窗下经过，她就给他们做礼物。冻紫的小手得到一双手套，照顾许多玩偶的小妈妈得到针线包，练字的孩子有了擦笔布，爱看图画的眼睛有了剪贴簿。那些不情愿爬求学阶梯的孩子，仿佛看见路上撒满鲜花。他们把楼上的贝丝当作仙女教母，因为她送下来的东西，总是那么合心意。孩子们仰起笑脸朝她点头，还写来墨渍斑斑、满怀感激的小信。这就是她的回报。
        - id: ch01-b04
          speaker: narrator
          text: 最初几个月很幸福。阳光照进贝丝的屋子，两个小宝宝躺在地板上踢腿，咿咿呀呀。妈妈和姐妹们在一旁做活，爸爸用悦耳的声音读那些古老而智慧的书。几百年前写下的良善话语，如今听来仍能安慰人心。
        - id: ch01-b05
          speaker: beth
          text: 这一切多美啊！
          emotion: happy
        - id: ch01-b06
          speaker: narrator
          text: 小屋仿佛成了一座礼拜堂。爸爸像慈爱的牧师，教自己的羊群学习谁也躲不开的艰难功课。他要让他们明白，希望能安慰爱，信仰能帮助人甘心接受。那些教诲很朴素，却直抵人心。因为爸爸把自己的心放进了信仰里，声音还时常颤抖，反而让他读出的话更有力量。
    - id: ch02
      title: 岸边守候
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那段安宁的日子，是命运留给他们的准备，好让大家迎接后来的悲哀。后来有一天，贝丝说针太沉了，从此再没拿起来。说话会使她疲倦，人的面孔也叫她不安。疼痛抓住了她，身体的折磨搅乱了原本平静的心。那些白天沉重得熬不过去，黑夜又长得没有尽头。一颗颗心都在疼，一声声祈祷都在哀求。爱她的人看着她伸出瘦弱的手，听见她痛苦地呼喊，却什么也做不了。
        - id: ch02-b02
          speaker: beth
          text: 帮帮我，帮帮我！
          emotion: fearful
        - id: ch02-b03
          speaker: narrator
          text: 宁静的灵魂一时失去了光，年轻的生命也同死亡激烈搏斗。幸好这两段煎熬都不长。抗争过去，贝丝从前的安详又回来了，而且比过去更美。身体虽然已经摧折，灵魂却越发坚强。她很少说话，家人却知道她准备好了。第一个受到召唤的朝圣者，也最适合先走。于是大家陪她等在岸边，仿佛能望见那些光明者前来，接她渡过河流。
        - id: ch02-b04
          speaker: beth
          text: 乔，你在这里，我就觉得有力气些。
        - id: ch02-b05
          speaker: narrator
          text: 从那以后，乔一小时也不肯离开。她睡在屋里的长榻上，夜里一次次醒来添柴生火，喂贝丝吃东西，扶她起身，随时照料她。贝丝很少开口求人，总怕给别人添麻烦。乔白天也守着她，谁来替换都不情愿。能被贝丝选中照顾她，比乔一生后来得到的任何荣誉都更让她自豪。
        - id: ch02-b06
          speaker: narrator
          text: 这些珍贵的时光，也在教导乔。贝丝那么温柔地教她耐心，她不能不学会。她懂得了宽恕别人的不友善，然后真正忘记。她还看见，只要忠于责任，再难的事也能做下去。真诚的信仰不必害怕，只要坚定地相信。
        - id: ch02-b07
          speaker: narrator
          text: 乔夜里醒来，常看见贝丝读那本翻旧的小书，或是听她轻声唱歌，熬过无眠的长夜。有时，贝丝双手捧着脸，泪珠从她透明般的手指间慢慢落下。乔躺着望她，心里的念头深得已经容不下眼泪。她知道，贝丝正在用神圣的安慰、静默的祈祷和最爱的音乐，一点点告别旧日生活，准备迎接将来的生命。
        - id: ch02-b08
          speaker: narrator
          text: 眼前这一切，比最有智慧的布道、最圣洁的赞美诗和最热烈的祈祷，更能打动乔。泪水洗亮了她的眼睛，悲痛也使她的心柔软下来。她终于看清妹妹这一生的美。贝丝没有惊人的经历，也没有远大的野心，却拥有真正的美德。那些美德即使落进尘土，仍会吐露芬芳，开出花朵。她总是忘记自己。这样的人在世上最卑微，到了天国却最先被记起。这才是人人都能得到的真正成功。
    - id: ch03
      title: 我的贝丝
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天夜里，贝丝翻找桌上的书，想忘掉那种几乎和疼痛一样难熬的倦怠。她打开从前最爱的《天路历程》，发现一张写满乔字迹的小纸。题目吸引了她，模糊的字行也告诉她，乔的眼泪曾落在上面。
        - id: ch03-b02
          speaker: beth
          text: 可怜的乔，她睡得正熟，我就不叫醒她了。她什么东西都给我看，看看这张纸，她一定不会介意。
        - id: ch03-b03
          speaker: narrator
          text: 贝丝望向乔。她就睡在炉边的地毯上，火钳放在身旁，木柴一裂开，立刻便能醒来。贝丝展开那首题为《我的贝丝》的诗，静静读了下去。
        - id: ch03-b04
          speaker: narrator
          text: 静静坐在阴影里，等候神圣光明降临。安详圣洁的身影，抚慰着忧伤的家庭。尘世的欢乐、希望、悲愁，像细浪碎在河岸。她甘愿站在岸边，面对深沉庄严的河川。
        - id: ch03-b05
          speaker: narrator
          text: 啊，我将离去的妹妹，你要离开人世的操劳纷争。请把美化了你一生的品德，当作礼物留给我。把伟大的忍耐留给我吧。是它支撑着你，让你身陷痛苦的牢笼，仍然开朗，从不怨尤。
        - id: ch03-b06
          speaker: narrator
          text: 也请分给我那份智慧而温柔的勇气，我太需要它。是它让责任的道路，在你甘愿的脚下永远青绿。请把无私的天性也给我。它怀着神圣的仁爱，能为爱的缘故宽恕伤害。温顺的心啊，也请宽恕我给你的亏待！
        - id: ch03-b07
          speaker: narrator
          text: 这样，我们每天的离别便少一分苦痛。我学着这艰难的一课，巨大的损失也化成收获。悲伤会抚平我不驯的性情，给生命新的向往，也让我重新信赖看不见的一切。
        - id: ch03-b08
          speaker: narrator
          text: 从今以后，你已安然渡过河流。我会一直看见，亲爱的家中精灵正在彼岸等候。悲伤孕育的希望与信仰，会成为守护我的天使。先我而去的妹妹，终有一天会牵着他们的手，领我归家。
        - id: ch03-b09
          speaker: narrator
          text: 诗句写得还有些生涩无力，字迹被泪水洇得模糊，纸上也留下不少墨点，却给了贝丝说不出的安慰。她一直遗憾自己一生做得太少。现在她终于相信，自己并没有白活，她的离去也不会给亲人留下她所害怕的绝望。贝丝把纸折起，合在两只手的掌心。这时，烧焦的木柴忽然裂开。乔惊醒过来，重新拨旺炉火，又悄悄走到床边，以为妹妹已经睡着了。
        - id: ch03-b10
          speaker: beth
          text: 我没睡，可我觉得好幸福。你看，我找到这首诗，也读过了。我知道你不会介意。乔，我对你来说，真的有诗里那么好吗？
          emotion: happy
        - id: ch03-b11
          speaker: narrator
          text: 贝丝问得那么谦逊，又那么恳切，眼里还带着殷切的期盼。
        - id: ch03-b12
          speaker: jo
          text: 啊，贝丝，你给我的远不止这些，远不止！
          emotion: sad
        - id: ch03-b13
          speaker: narrator
          text: 乔把头伏到枕上，紧紧挨着妹妹。
        - id: ch03-b14
          speaker: beth
          text: 那我就不觉得自己白活了。我其实没有你写得那么好，可我一直努力做对的事。现在就算想重新开始、做得更好，也已经太晚了。不过有人这样爱我，还觉得我帮助过她，知道这些，真让我安心。
        - id: ch03-b15
          speaker: jo
          text: 你给我的帮助，胜过世上任何人。贝丝，我以前觉得自己绝不能让你走。现在我慢慢明白，我不会失去你。你对我会比从前更加重要。死亡看上去能把我们分开，其实它做不到。
        - id: ch03-b16
          speaker: beth
          text: 我知道它做不到，所以我不再害怕了。我相信自己仍会是你的贝丝，会比从前更爱你，也会给你更多帮助。乔，等我走了，你要接替我，为爸爸妈妈担起一切。他们会依靠你，千万别让他们失望。一个人做这些事要是很难，就记住，我没有忘记你。这样活着，会比写出伟大的书、比看遍全世界更让你幸福。因为离开时，我们唯一能带走的就是爱。有了爱，最后一步也会变得很容易。
          emotion: calm
        - id: ch03-b17
          speaker: jo
          text: 我会努力的，贝丝。
          emotion: sad
        - id: ch03-b18
          speaker: narrator
          text: 就在那一刻，乔放下了过去的抱负，立下一个更新、更好的志愿。其他愿望在它面前显得多么贫乏。而相信爱永远不死，也给了乔神圣的安慰。
    - id: ch04
      title: 贝丝终于好了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 春日来了又走。天空一天比一天澄澈，大地越来越青绿，花朵早早开放，鸟儿也及时飞回来向贝丝道别。她像一个疲倦却信赖父母的孩子，紧握住那双引领了她一生的手。爸爸妈妈温柔地带她走过阴影之谷，把她交还给上帝。
        - id: ch04-b02
          speaker: narrator
          text: 只有书中的弥留者，才常会说出难忘的话，看见异象，或带着圣洁的容光离去。送别过许多灵魂的人知道，对大多数人来说，生命结束得就像入睡一样自然简单。贝丝曾盼望潮水轻轻退去，事情也正是这样。黎明前最黑暗的时刻，她躺在妈妈怀里。她当年在这个怀抱中第一次呼吸，如今又静静呼出最后一口气。她没有说再见，只留下充满爱的一眼，还有一声轻轻的叹息。
        - id: ch04-b03
          speaker: narrator
          text: 妈妈和姐妹们含着泪，做着祈祷，用温柔的手为她妥善装束，让她安睡在再也不会受疼痛打扰的长眠里。贝丝长久以来的忍耐让她们心碎，如今，美丽的安详终于取代了那份忍耐。她们感激地凝望，也怀着敬畏的喜悦明白，对她们的宝贝来说，死亡是仁慈的天使，不是可怕的幽灵。
        - id: ch04-b04
          speaker: narrator
          text: 清晨到了。许多个月以来，炉火第一次熄灭，乔的位置空着，屋里没有一点声音。可是近旁抽芽的枝头上，小鸟唱得欢快。窗边的雪滴花开得清新。春日阳光像祝福一样流进屋里，落在枕上那张宁静的脸庞。贝丝脸上只有摆脱疼痛后的安宁。最爱她的人看着她，含着泪露出微笑，感谢上帝。贝丝终于好了。
