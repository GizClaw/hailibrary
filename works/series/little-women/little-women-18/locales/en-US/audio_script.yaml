  chapters:
    - id: ch01
      title: Dark Days
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Beth truly had the fever, and she was far sicker than anyone except Hannah and the doctor understood. The girls knew little about illness, and Mr. Laurence was kept away from the sickroom. So Hannah took charge. Busy Dr. Bangs did what he could, but much of the nursing fell to her. Meg stayed home so she would not carry the fever to the Kings. She kept house anxiously and felt guilty whenever she wrote Mother without mentioning Beth. Hiding it seemed wrong, but Hannah had ordered her to say nothing. To Hannah, there was no sense worrying Mrs. March over such a trifle.
        - id: ch01-b02
          speaker: narrator
          text: Jo cared for Beth day and night. Beth was patient and held back her complaints as long as she could. Then the fever fits grew worse. In a rough, broken voice, she talked without knowing what she said. Her fingers moved over the bedcover as if it were her dear little piano, and she tried to sing, though her swollen throat had no music left. She called familiar people by the wrong names and begged for Mother. Jo became frightened. Meg pleaded to tell the truth, and even Hannah agreed to think about it, though she still said there was no danger yet. Then a letter came from Washington. Mr. March had suffered a relapse and would not be coming home for a long time.
        - id: ch01-b03
          speaker: narrator
          text: The days felt dark, the house lonely, and the sisters' hearts heavy as they worked and waited. Death seemed to cast its shadow over their once-happy home. Meg sat alone sewing, and tears kept falling onto her work. She thought of the comfortable things she had once wished for. Now she understood how rich she had already been in love, protection, peace, and health. Those were the true blessings of life, more precious than any luxury money could buy.
        - id: ch01-b04
          speaker: narrator
          text: In the dim sickroom, Jo watched Beth suffer and heard her pitiful voice. At last she fully saw the beauty and sweetness of her sister's nature. She understood how deeply and tenderly Beth belonged in every heart. Beth's ambition had never been for herself. She wanted to live for others and make home happy through simple virtues that anyone could practice. Jo learned that such goodness deserved more love and honor than talent, wealth, or beauty.
        - id: ch01-b05
          speaker: narrator
          text: Away at Aunt March's, Amy longed to come home and work for Beth. No task would have seemed hard now. She remembered with grief how often Beth's willing hands had done the chores Amy neglected. Laurie drifted through the house like a restless ghost. Mr. Laurence locked the grand piano because it reminded him too painfully of the young neighbor who had brightened his evenings.
        - id: ch01-b06
          speaker: narrator
          text: Everyone missed Beth. The milkman, baker, grocer, and butcher all asked about her. Mrs. Hummel came to beg forgiveness for her carelessness and to ask for a burial cloth for Minna. Neighbors sent comforts and kind wishes. Even Beth's own family had never guessed how many friends their shy little girl had made.
        - id: ch01-b07
          speaker: narrator
          text: Beth lay with old Joanna beside her. Even while her mind wandered, she remembered the battered doll she had always protected. She missed her cats but refused to let them near, afraid they might become sick. Whenever her thoughts cleared, she worried about Jo. She sent loving messages to Amy and asked them to tell Mother she would write soon. Again and again, she begged for paper and pencil, hoping to send Father a word so he would not think she had forgotten him.
        - id: ch01-b08
          speaker: narrator
          text: Soon those clear moments stopped. For hours Beth tossed from side to side, murmuring words no one could understand. Then she would sink into a heavy sleep and wake with none of her strength restored. The sickroom settled into a relentless routine. Dr. Bangs visited twice a day. Hannah stayed awake through the nights. Meg kept a telegram written and ready in her desk, prepared to send it at any moment. Jo never once left Beth's side.
        - id: ch01-b09
          speaker: narrator
          text: December first came with bitter wind and driving snow. It seemed as if the year itself were preparing to die. That morning, Dr. Bangs studied Beth for a long time. He held her burning hand between his, then gently set it down and spoke quietly to Hannah.
        - id: ch01-b10
          speaker: dr_bangs
          text: If Mrs. March can leave her husband, send for her now.
        - id: ch01-b11
          speaker: narrator
          text: Hannah nodded, unable to speak as her lips trembled. Meg collapsed into a chair, all strength gone from her legs. Jo stood pale and still for one moment. Then she seized the waiting telegram, pulled on her things, and ran into the storm.
        - id: ch01-b12
          speaker: narrator
          text: Jo soon returned. As she quietly removed her cloak, Laurie came in carrying a letter. Mr. March was improving again. Jo read the news gratefully, but the weight on her heart did not lift. Her face was so miserable that Laurie spoke at once.
        - id: ch01-b13
          speaker: laurie
          text: What happened? Has Beth gotten worse?
        - id: ch01-b14
          speaker: jo
          text: I sent for Mother.
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: Jo struggled with her rubber boots, her face tragic.
        - id: ch01-b16
          speaker: laurie
          text: Good, Jo. Did you decide to do it yourself?
        - id: ch01-b17
          speaker: narrator
          text: He guided her into the hall chair and pulled off the stubborn boots when he saw her hands shaking.
        - id: ch01-b18
          speaker: jo
          text: No. The doctor said we had to.
        - id: ch01-b19
          speaker: laurie
          text: Oh, Jo. Is it really that serious?
          emotion: fearful
        - id: ch01-b20
          speaker: jo
          text: It is. She doesn't recognize us. She doesn't even mention the flocks of green doves anymore, the vine leaves on the wallpaper. She doesn't look like my Beth. There's no one here to help us bear this. Mother and Father are both away, and God feels so far off that I can't find Him.
          emotion: sad
        - id: ch01-b21
          speaker: narrator
          text: Tears poured down Jo's face. She reached out helplessly, like someone feeling her way through darkness. Laurie took her hand. His throat tightened, but he managed a whisper.
        - id: ch01-b22
          speaker: laurie
          text: I'm right here. Hold on to me, Jo.
          emotion: calm
        - id: ch01-b23
          speaker: narrator
          text: Jo could not answer, but she did hold on. The warm grip of a faithful human hand comforted her aching heart. As she clung to Laurie, she felt a little less lost in the darkness. His hand even seemed to lead her nearer to the divine arm that alone could hold her up through such grief.
        - id: ch01-b24
          speaker: narrator
          text: Laurie wanted to comfort her, but he could find no words. He simply stood there and stroked her bowed head the way her mother did. Nothing he could have said would have helped as much. Jo felt his sympathy in the silence. After a while, she dried the tears that had brought her some relief and looked up gratefully.
        - id: ch01-b25
          speaker: jo
          text: Thank you, Teddy. I'm doing better now. I don't feel so alone, and if the worst comes, I'll try to bear it.
          emotion: calm
        - id: ch01-b26
          speaker: laurie
          text: Keep hoping, Jo. It will help. Your mother will be here soon, and then things will be all right.
          emotion: calm
        - id: ch01-b27
          speaker: jo
          text: I'm so thankful Father is better. Mother won't feel as terrible about leaving him now. But honestly, every trouble seems to have landed at once, and I got the heaviest load.
          emotion: sad
        - id: ch01-b28
          speaker: narrator
          text: Jo spread her soaked handkerchief across her knees to dry. Laurie looked offended for her.
        - id: ch01-b29
          speaker: laurie
          text: Isn't Meg carrying her share?
        - id: ch01-b30
          speaker: jo
          text: Yes, she tries. But she can't love Bethy the way I do, and she won't miss her the way I will. Beth is my conscience. I can't give her up. I can't. I can't!
          emotion: sad
        - id: ch01-b31
          speaker: narrator
          text: Jo buried her face in the wet handkerchief and sobbed. She had stayed brave until then without shedding a tear. Laurie wiped his own eyes. He could not speak until he had mastered the choking in his throat and steadied his lips. Some might have called his tears unmanly, but he could not stop them, and I am glad he could not. When Jo's sobs finally softened, he tried to give her hope.
        - id: ch01-b32
          speaker: laurie
          text: I don't believe she'll die. She's so good, and everyone loves her so much. I can't believe God would take her from us yet.
          emotion: calm
        - id: ch01-b33
          speaker: jo
          text: It's always the good, dear ones who die.
          emotion: sad
        - id: ch01-b34
          speaker: narrator
          text: Even so, Laurie had comforted her, and she stopped crying.
        - id: ch01-b35
          speaker: laurie
          text: You're exhausted, poor Jo. This hopelessness isn't like you. Wait here. I'll cheer you up in no time.
        - id: ch01-b36
          speaker: narrator
          text: Laurie bounded upstairs two steps at a time. Jo lowered her tired head onto Beth's little brown hood, still lying where Beth had left it on the table. The hood seemed to hold some magic. Its gentle owner's patient spirit appeared to pass into Jo. When Laurie hurried back with a glass of wine, she accepted it with a smile.
        - id: ch01-b37
          speaker: jo
          text: Here's to my Beth's health! You're a fine doctor, Teddy, and the best kind of friend. How can I ever repay you?
        - id: ch01-b38
          speaker: narrator
          text: The wine strengthened her body as his kind words had strengthened her troubled mind.
        - id: ch01-b39
          speaker: laurie
          text: I'll send you the bill later. But tonight, I have something that will warm your heart better than gallons of wine.
        - id: ch01-b40
          speaker: narrator
          text: He beamed, barely able to hide his satisfaction.
        - id: ch01-b41
          speaker: jo
          text: What is it?
          emotion: surprised
        - id: ch01-b42
          speaker: laurie
          text: Yesterday I sent your mother a telegram. Brooke answered that she was leaving at once. She'll be here tonight. Everything will be all right. Aren't you glad I did it?
          emotion: happy
        - id: ch01-b43
          speaker: narrator
          text: Laurie rushed the words out, red-faced and excited. He had kept his plan secret in case it disappointed the girls or somehow harmed Beth. Jo went white and sprang up. The instant he finished, she flung her arms around his neck.
        - id: ch01-b44
          speaker: jo
          text: Oh, Laurie! Mother! I'm so happy!
          emotion: happy
        - id: ch01-b45
          speaker: narrator
          text: Jo did not cry again. She laughed wildly, trembling and clinging to him, almost dazed by the sudden news. Laurie was startled but kept his wits. He patted her back until she began to recover, then gave her a shy kiss or two. That brought Jo to herself at once. She held the banister and gently pushed him away.
        - id: ch01-b46
          speaker: jo
          text: Oh, stop! I didn't mean to grab you. It was awful of me, but you were such a dear to go against Hannah and do it. I just couldn't help myself. Tell me everything. And don't give me wine again. It makes me behave terribly.
        - id: ch01-b47
          speaker: narrator
          text: Laurie laughed and straightened his tie.
        - id: ch01-b48
          speaker: laurie
          text: I didn't mind. Grandpa and I both got restless. We thought Hannah was taking her authority too far, and your mother deserved to know. She'd never forgive us if Beth... if something happened. So Grandpa said it was time to act, and yesterday I raced to the telegraph office. The doctor had looked grim, and when I suggested a telegram, Hannah nearly took my head off. I can't stand being ordered around, so that settled it. I sent the message. Your mother is coming, and the late train gets in at two in the morning. I'll meet her. All you have to do is contain your joy and keep Beth quiet until that blessed lady arrives.
        - id: ch01-b49
          speaker: jo
          text: Laurie, you're an angel! How will I ever thank you?
          emotion: happy
        - id: ch01-b50
          speaker: laurie
          text: You could throw yourself at me again. I rather enjoyed it.
          emotion: happy
        - id: ch01-b51
          speaker: narrator
          text: For the first time in two weeks, he looked mischievous.
        - id: ch01-b52
          speaker: jo
          text: No, thank you. I'll let your grandfather do it for me when he comes. Now quit teasing and go rest. You'll be awake half the night. Bless you, Teddy. Bless you!
        - id: ch01-b53
          speaker: narrator
          text: Jo backed into a corner, then darted into the kitchen. She perched on a dresser and informed the assembled cats that she was happy, oh, so happy. Laurie left feeling he had managed the whole thing rather neatly.
        - id: ch01-b54
          speaker: hannah
          text: That boy meddles more than anyone I ever saw. Still, I forgive him, and I surely hope Mrs. March gets here right away.
        - id: ch01-b55
          speaker: narrator
          text: Hannah's relief showed as Jo shared the news.
        - id: ch01-b56
          speaker: narrator
          text: Meg received the news with quiet joy, then pored over the letter. Jo put the sickroom in order, while Hannah hurried to make two pies in case company arrived unexpectedly. Fresh hope moved through the house like a breath of clean air, brighter than sunshine in the hushed rooms. Everything seemed to share the change. Beth's bird began chirping again. On Amy's rosebush by the window, they found a blossom half open. The fires themselves seemed warmer and more cheerful. Whenever the sisters met, their pale faces brightened. They embraced and whispered encouragement to each other.
        - id: ch01-b57
          speakers: [meg, jo]
          ensemble: duo
          text: Mother's coming, dear. Mother's coming!
          emotion: happy
        - id: ch01-b58
          speaker: narrator
          text: Everyone rejoiced except Beth. She remained deep in a stupor, equally unaware of hope and joy, doubt and danger. It was painful to see how illness had changed her. Her once-rosy face was pale and empty now. The hands that had always been busy had grown thin and weak. Her smiling lips were silent, and the pretty hair she used to keep so neat lay rough and tangled across the pillow. Sometimes she stirred just enough to murmur one word through lips so dry they could barely form it.
        - id: ch01-b59
          speaker: beth
          text: Water.
        - id: ch01-b60
          speaker: narrator
          text: All day, Meg and Jo hovered near Beth, watching, waiting, hoping, and placing their trust in God and Mother. Outside, snow poured down and the bitter wind raged. The hours crawled by. At last night came. The sisters stayed on opposite sides of the bed. Each time the clock struck, they looked at one another with brighter eyes. Help was one hour closer. The doctor had said Beth would likely change for better or worse around midnight, and he promised to return then.
        - id: ch01-b61
          speaker: narrator
          text: Completely worn out, Hannah lay on the sofa at the foot of the bed and fell asleep. Mr. Laurence paced the parlor. He felt he would rather face a rebel battery than meet Mrs. March when she arrived. Laurie lay on the rug pretending to rest, but his thoughtful dark eyes stayed fixed on the fire.
        - id: ch01-b62
          speaker: narrator
          text: The girls never forgot that night. They could not sleep as they kept watch, trapped in the terrible helplessness that comes in such hours.
        - id: ch01-b63
          speaker: meg
          text: If God lets Beth live, I will never complain again.
        - id: ch01-b64
          speaker: jo
          text: If God lets her live, I'll try to love and serve Him for the rest of my life.
        - id: ch01-b65
          speaker: meg
          text: I wish I didn't have a heart. It hurts so much.
          emotion: sad
        - id: ch01-b66
          speaker: jo
          text: If life is this hard very often, I don't know how we'll ever make it through.
          emotion: sad
        - id: ch01-b67
          speaker: narrator
          text: The clock struck twelve, and both girls forgot themselves as they searched Beth's pale face for some change. The house was as still as death. Only the wind wailed through the silence. Hannah slept on, and only the sisters saw what looked like a pale shadow fall across the little bed. One hour passed. Nothing happened except that Laurie quietly left for the station. Another hour followed, and no one came. The girls imagined delays in the storm, accidents on the road, or worst of all, some fresh grief in Washington.
        - id: ch01-b68
          speaker: narrator
          text: After two, Jo stood at the window. The world looked bleak beneath its winding sheet of snow. A movement near the bed made her turn. Meg was kneeling before Mother's easy chair with her face hidden. Cold fear swept over Jo.
        - id: ch01-b69
          speaker: jo
          text: Beth is dead, and Meg is afraid to tell me.
          emotion: fearful
        - id: ch01-b70
          speaker: narrator
          text: In an instant, Jo was back beside the bed. Beth had changed. The feverish color and the pain had left her face. She was so pale and peaceful in her complete stillness that Jo did not want to cry out or weep. She bent over the sister she loved most, kissed the damp forehead, and spoke with all her heart.
        - id: ch01-b71
          speaker: jo
          text: Good-bye, my Beth. Good-bye.
          emotion: sad
        - id: ch01-b72
          speaker: narrator
          text: The movement woke Hannah. She hurried to Beth, touched her hands, and listened at her lips. Then Hannah pulled her apron over her head, dropped into a chair, and rocked back and forth as she murmured.
        - id: ch01-b73
          speaker: hannah
          text: The fever has broken. She's sleeping naturally. Her skin is damp, and she's breathing easily. Praise be! Oh, my goodness!
          emotion: happy
        - id: ch01-b74
          speaker: narrator
          text: Before the girls could believe the wonderful truth, Dr. Bangs arrived and confirmed it. He was an ordinary-looking man, but when he smiled at them, his face seemed heavenly.
        - id: ch01-b75
          speaker: dr_bangs
          text: Yes, my dears. I believe the little girl will make it through this time. Keep the house quiet and let her sleep. When she wakes, give her...
          emotion: calm
        - id: ch01-b76
          speaker: narrator
          text: Neither sister heard the rest. They slipped into the dark hall, sat together on the stairs, and held each other close. Their hearts were too full for words. When they returned, faithful Hannah kissed and cuddled them. Beth lay as she used to, her cheek resting on her hand. The awful paleness was gone, and she breathed quietly, as though she had simply fallen asleep.
        - id: ch01-b77
          speaker: jo
          text: If only Mother would come now.
        - id: ch01-b78
          speaker: narrator
          text: The winter night was beginning to fade. Meg came over holding a white rose, only halfway open.
        - id: ch01-b79
          speaker: meg
          text: Look. I didn't think it would be ready tomorrow. I meant to put it in Beth's hand if she... if she left us. But it opened during the night. Now I'll put it in my vase here. When our darling wakes, the first things she'll see will be this little rose and Mother's face.
          emotion: happy
        - id: ch01-b80
          speaker: narrator
          text: The sun had never risen so beautifully, and the world had never seemed so lovely to Meg and Jo. Their eyes were heavy as they looked out on the morning after their long, sorrowful watch.
        - id: ch01-b81
          speaker: meg
          text: It looks like a fairy world.
          emotion: happy
        - id: ch01-b82
          speaker: narrator
          text: Meg smiled behind the curtain as she watched the snow glitter. Suddenly Jo sprang up.
        - id: ch01-b83
          speaker: jo
          text: Listen!
          emotion: surprised
        - id: ch01-b84
          speaker: narrator
          text: Bells sounded at the door below. Hannah cried out, and then Laurie's joyful whisper came up through the house.
        - id: ch01-b85
          speaker: laurie
          text: Girls, she's here! She's here!
          emotion: happy
