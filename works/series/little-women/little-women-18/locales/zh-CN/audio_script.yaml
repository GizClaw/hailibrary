audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，含蓄机智, timbre: 清澈柔和, pace: 从容而有变化, pitch: 中音}
    beth:
      display_name: 贝丝
      tts: {delivery: 温柔诚恳，羞怯克制, timbre: 轻柔纯净, pace: 舒缓, pitch: 中高音}
    meg:
      display_name: 梅格
      tts: {delivery: 端庄温和，偶尔显出姐姐的威严, timbre: 柔润明亮, pace: 适中, pitch: 中音}
    jo:
      display_name: 乔
      tts: {delivery: 爽直敏捷，情绪真挚, timbre: 清亮有力, pace: 稍快, pitch: 中低音}
    hannah:
      display_name: 汉娜
      tts: {delivery: 朴实果断，带着家常的关爱, timbre: 厚实温暖, pace: 稳健, pitch: 中低音}
    amy:
      display_name: 艾米
      tts: {delivery: 娇气讲究，孩子气中带着自尊, timbre: 清脆明亮, pace: 适中偏快, pitch: 高音}
    laurie:
      display_name: 劳里
      tts: {delivery: 活泼亲切，善于打趣哄人, timbre: 明朗温暖, pace: 轻快, pitch: 中音}
    doctor_bangs:
      display_name: 班斯大夫
      tts: {delivery: 专业沉稳，关键时刻直截了当, timbre: 温厚清晰, pace: 从容, pitch: 中低音}
  chapters:
    - id: ch01
      title: 病房里的黑暗日子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 贝丝果然发起高烧，而且病得很重。只有汉娜和班斯大夫明白病情究竟有多凶险。姑娘们不懂疾病，劳伦斯先生又不准她们去探望，于是家里全听汉娜安排。班斯大夫再忙，每天也尽力来医治贝丝，其余的事，大多交给这位能干的看护。梅格怕把病带到金家，便留下料理家务。她给母亲写信时不敢提贝丝，心里很不好受。瞒着母亲明明不对，可大家要她听汉娜的话。
        - id: ch01-b02
          speaker: hannah
          text: 不能拿这点小事去告诉马奇太太，叫她白白操心。
        - id: ch01-b03
          speaker: narrator
          text: 乔日夜陪着贝丝。起初，这并不难。贝丝那么能忍，只要神志还清楚，再痛苦也不出声抱怨。可高烧一来，她便开始说胡话，声音沙哑，断断续续。她的手指还在床罩上来回弹动，仿佛那里摆着她心爱的小钢琴。她想唱歌，肿痛的喉咙却发不出声音。她认不出熟悉的脸，把每个人的名字都叫错，只反复求着要妈妈。乔终于怕了。梅格求大家让她把实情写进信里，连汉娜也松了口，只说可以考虑，眼下还没有危险。偏偏华盛顿又来信说，马奇先生的病有了反复，短时间内回不了家。姐妹们心上又多压了一层忧虑。
        - id: ch01-b04
          speaker: narrator
          text: 那些日子真黑暗，屋里也冷清得叫人难受。姐妹们一边做事，一边等候，只觉得心上压着石头。这个从前满是笑声的家，如今仿佛被死亡的影子罩住了。梅格独自做针线，眼泪一滴滴落在活计上。她这才懂得，自己从前拥有的爱、安宁和健康，才是最珍贵的福分，再多钱也买不来。
        - id: ch01-b05
          speaker: narrator
          text: 乔守在昏暗的病房里，天天看着妹妹受苦，听着她可怜的声音，也终于看清贝丝有多温柔、多美好。这个安静的小姑娘，早已住进了每个人心里最柔软的地方。贝丝只想为别人活着，用谁都做得到的小事让一家人快乐。乔现在明白，这样的心愿比才华、财富和美貌都更值得珍惜。
        - id: ch01-b06
          speaker: narrator
          text: 艾米住在姑婆家，也只盼能回来替贝丝做点事。现在无论什么差事，她都不会嫌烦了。想起自己以前丢下的活儿，最后总由贝丝那双勤快的手补上，她又后悔又伤心。劳里整天在房子附近转来转去，像个不安的幽灵。劳伦斯先生甚至锁上了大钢琴，因为只要看见它，他就会想起那个用琴声点亮黄昏的小邻居，心里实在受不了。
        - id: ch01-b07
          speaker: narrator
          text: 惦记贝丝的人比谁想的都多。送牛奶的、面包师、杂货商和肉贩都来问病情。胡梅尔太太也来了，一边为自己的疏忽道歉，一边替明娜讨一块裹尸布。邻居们送来能让病人舒服些的东西，还捎来祝福。就连最了解贝丝的人也没想到，这个羞怯的小姑娘竟有这么多朋友。
        - id: ch01-b08
          speaker: narrator
          text: 贝丝躺在床上，老乔安娜一直陪着她。即使烧得神志不清，她也没忘掉这个孤零零的小宝贝。她想念那些猫，却不肯让人抱来，怕猫也染病。偶尔清醒一点，她担心的还是乔。她托人给艾米带去亲热的话，又叫大家告诉妈妈，她很快会写信。她一次次要纸笔，想勉强写几个字，免得爸爸以为她忘了他。
        - id: ch01-b09
          speaker: narrator
          text: 后来，这样清醒的片刻也没有了。贝丝一连几个钟头辗转不安，嘴里全是不成句的话。有时她会沉沉睡去，却一点也休息不好。班斯大夫一天来两次，汉娜整夜守着。梅格在书桌里备好一封电报，随时都能发出去。乔则一步也不肯离开贝丝。
    - id: ch02
      title: 风雪里的消息
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 十二月的第一天，冷得像严冬。风刺骨地刮着，大雪漫天飞舞，仿佛这一年也快走到生命的尽头。班斯大夫早晨来到床边，看了贝丝很久。他把那只滚烫的小手握在两手之间，停了一会儿，才轻轻放回去。
        - id: ch02-b02
          speaker: doctor_bangs
          text: 要是马奇太太能暂时离开丈夫，最好请她回来。
        - id: ch02-b03
          speaker: narrator
          text: 汉娜没有说话，只点点头，嘴唇却紧张得直抽动。梅格听见这句话，腿上像忽然没了力气，一下坐进椅子。乔脸色惨白地站了片刻，随即冲进客厅，抓起那封电报，披上外衣，奔进风雪。
        - id: ch02-b04
          speaker: narrator
          text: 她很快回来，正悄悄脱下斗篷，劳里拿着一封信进了门。信上说，马奇先生的病又有了好转。乔满心感激地读完，心里的重担却一点没轻。劳里一看她满脸痛苦，赶紧问了起来。
        - id: ch02-b05
          speaker: laurie
          text: 怎么了？贝丝是不是更坏了？
        - id: ch02-b06
          speaker: jo
          text: 我发了电报，请妈妈回来。
        - id: ch02-b07
          speaker: laurie
          text: 这样做就对了。是你自己拿的主意吗？
        - id: ch02-b08
          speaker: narrator
          text: 劳里看出乔两手发抖，便让她坐在门厅的椅子上，替她脱那双怎么也扯不下来的胶靴。
        - id: ch02-b09
          speaker: jo
          text: 不是，大夫让我们发的。
        - id: ch02-b10
          speaker: laurie
          text: 乔，难道已经这么严重了？
          emotion: surprised
        - id: ch02-b11
          speaker: jo
          text: 是的。她已经认不出我们，连墙上的葡萄叶也不说像一群绿鸽子了。她以前总是那么说。现在躺在那里的根本不像我的贝丝。可没有人帮我们扛住这些。妈妈和爸爸都不在，上帝好像也离得那么远，我怎么都找不到祂。
          emotion: fearful
        - id: ch02-b12
          speaker: narrator
          text: 乔满脸是泪，无助地伸出一只手，像在黑暗里摸索。劳里握紧了它，喉咙也哽住了。
        - id: ch02-b13
          speaker: laurie
          text: 我在这里。抓住我吧，亲爱的乔。
          emotion: calm
        - id: ch02-b14
          speaker: narrator
          text: 乔说不出话，只是紧紧抓住他。朋友温暖的手安慰着她受伤的心，也仿佛领着她靠近了那双神圣的臂膀。在这样的苦难里，只有那双臂膀能真正支撑她。
        - id: ch02-b15
          speaker: narrator
          text: 劳里想说些安慰的话，却找不到一句合适的。他便安静地站着，像乔的母亲从前那样，轻轻抚摸她低下的头。这比再动听的话都有用。乔感受到这份无声的体贴，也在沉默里懂得，深厚的感情能给悲伤带来多么甜的安慰。哭过以后，她心里松快了一些，擦干眼睛，感激地抬起脸。
        - id: ch02-b16
          speaker: jo
          text: 谢谢你，泰迪。我好多了，也不觉得自己孤零零的了。真要发生什么，我会努力承受。
        - id: ch02-b17
          speaker: laurie
          text: 只要盼着最好的结果，你就能撑下去。你母亲很快会回来，到那时一切都会好起来。
        - id: ch02-b18
          speaker: jo
          text: 爸爸好转，我真高兴。这样妈妈离开他时，也不会太难受。可是，所有麻烦怎么都一起来了？最沉的那一份，偏偏全压在我身上。
          emotion: sad
        - id: ch02-b19
          speaker: narrator
          text: 乔叹着气，把湿手帕摊在膝上晾。劳里听完，有些气愤。
        - id: ch02-b20
          speaker: laurie
          text: 梅格就没公平地替你分担一点吗？
        - id: ch02-b21
          speaker: jo
          text: 梅格尽力了。可她不像我这样爱贝丝，也不会像我这样想念她。贝丝就是我的良心，我不能失去她。我不能，绝对不能！
          emotion: sad
        - id: ch02-b22
          speaker: narrator
          text: 乔把脸埋进湿手帕，绝望地哭起来。她直到现在都勇敢撑着，一滴泪也没有掉。劳里也抬手擦眼睛。他喉咙发紧，嘴唇发抖，好半天说不出话。也许有人会觉得这不够像个男子汉，可他实在忍不住，而这正叫人欣慰。等乔的哭声慢慢低下去，他才重新开口。
        - id: ch02-b23
          speaker: laurie
          text: 我觉得贝丝不会死。她那么善良，我们又都那么爱她。我不相信上帝现在就会把她带走。
        - id: ch02-b24
          speaker: jo
          text: 善良又可爱的人，也一样会死。
          emotion: sad
        - id: ch02-b25
          speaker: narrator
          text: 乔虽然还在害怕，也仍旧怀疑，可她不再哭了。朋友的话到底给了她一点安慰。
        - id: ch02-b26
          speaker: laurie
          text: 可怜的姑娘，你已经累坏了。一直这么灰心，可不像你。等着，我马上让你振作起来。
        - id: ch02-b27
          speaker: narrator
          text: 劳里两级一步地跑上楼。乔把疲惫的头靠在贝丝的棕色小风帽上。那顶帽子还放在贝丝离家时搁下的桌上，谁也没想到收走。它仿佛真有魔法，温顺主人的精神一点点进了乔心里。劳里端着一杯葡萄酒跑下来时，她已经能微笑着接过去了。
        - id: ch02-b28
          speaker: jo
          text: 我喝，祝我的贝丝恢复健康！泰迪，你真是个好大夫，也是最会安慰人的朋友。我该怎么报答你？
          emotion: happy
        - id: ch02-b29
          speaker: narrator
          text: 葡萄酒给了她力气，那些亲切的话也安抚了她的心。
        - id: ch02-b30
          speaker: laurie
          text: 账单以后再送。今天晚上，我还要给你一样东西，比几大壶葡萄酒更能暖透你的心。
          emotion: happy
        - id: ch02-b31
          speaker: narrator
          text: 劳里满脸笑容，显然藏着一个得意的秘密。
        - id: ch02-b32
          speaker: jo
          text: 是什么？
          emotion: surprised
        - id: ch02-b33
          speaker: laurie
          text: 我昨天就给你母亲发了电报。布鲁克回信说，她马上动身，今晚便能到家。所有事都会好起来的。你不会怪我吧？
        - id: ch02-b34
          speaker: narrator
          text: 劳里一口气说完，忽然又脸红又激动。他怕姑娘们空欢喜，也怕打扰贝丝，所以一直把计划藏得严严实实。乔的脸一下变得雪白。她猛地跳起来，扑过去搂住劳里的脖子，把他惊得浑身像过了电。
        - id: ch02-b35
          speaker: jo
          text: 劳里！妈妈！我太高兴了！
          emotion: happy
        - id: ch02-b36
          speaker: narrator
          text: 她没有再流泪，却控制不住地笑，浑身发抖，紧紧攀着劳里，像是这个突然降临的好消息也让她神志不清了。劳里虽然吃了一惊，反应倒很快。他安抚地拍拍乔，等她缓过来，又羞怯地吻了她一两下。乔立刻完全清醒，扶住楼梯栏杆，把他轻轻推开。
        - id: ch02-b37
          speaker: jo
          text: 哎呀，别这样！我不是故意扑你的，那样真不像话。可你不听汉娜反对，还是好心发了电报，我实在忍不住。快从头告诉我。还有，别再给我葡萄酒了，它害得我举止失常。
        - id: ch02-b38
          speaker: laurie
          text: 我倒不介意。事情是这样，我坐也不是，站也不是，祖父也一样。我们都觉得汉娜管得太过了，你母亲应该知道真相。万一贝丝真的……你明白。要是出了事，你母亲永远不会原谅我们。我终于说服祖父，让他承认我们早就该做点什么。昨天，大夫的脸色很严重，我便飞奔到电报局。可我一提发电报，汉娜差点拧掉我的脑袋。我最受不了别人命令我。她越拦，我越下定决心，最后还是把电报发了。你母亲一定会回来。夜班火车凌晨两点到，我去接她。你只管把欢喜先装进瓶子，塞紧瓶口，让贝丝安静休息，等那位有福气的太太进门。
        - id: ch02-b39
          speaker: jo
          text: 劳里，你真是个天使！我到底该怎么谢你？
          emotion: happy
        - id: ch02-b40
          speaker: laurie
          text: 再扑我一次吧，我还挺喜欢的。
        - id: ch02-b41
          speaker: narrator
          text: 劳里顽皮起来。这两个星期里，他还是头一回露出这样的神情。
        - id: ch02-b42
          speaker: jo
          text: 不用了，谢谢。我会找个人替我扑，等你祖父来时就办。别再取笑我，快回家休息吧，你还得熬半夜呢。愿上帝保佑你，泰迪，保佑你！
        - id: ch02-b43
          speaker: narrator
          text: 乔一步步退到墙角，说完就飞快躲进厨房，坐到碗橱上，对围在那里的猫儿们说起话来。
        - id: ch02-b44
          speaker: jo
          text: 我好幸福。啊，真幸福！
          emotion: happy
        - id: ch02-b45
          speaker: narrator
          text: 劳里心满意足地走了，觉得这件事办得相当漂亮。
    - id: ch03
      title: 妈妈要回来了
      blocks:
        - id: ch03-b01
          speaker: hannah
          text: 我这辈子没见过这么爱管闲事的小伙子。不过这回我原谅他，也真盼着马奇太太马上到家。
        - id: ch03-b02
          speaker: narrator
          text: 汉娜听完好消息，明显松了口气。梅格安静地欢喜了一阵，随后坐下来，默默想着自己写的那封信。乔去收拾病房，汉娜则忙着赶做两只馅饼，免得客人突然回来，家里却没有东西招待。
        - id: ch03-b03
          speaker: narrator
          text: 屋里像吹进一股清新的风，又像有什么比阳光更明亮的东西，照亮了安静的房间。所有事物都仿佛感觉到希望回来了。贝丝的小鸟重新唱起来，艾米放在窗边的玫瑰枝上，也冒出一朵半开的花苞。炉火比平时烧得更欢。姑娘们每次碰面，苍白的脸上都会露出笑容。她们彼此拥抱，一遍遍低声鼓励对方。
        - id: ch03-b04
          speakers: [meg, jo]
          ensemble: duo
          text: 妈妈要回来了，亲爱的。妈妈要回来了！
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: 只有贝丝没有分享这份欢喜。她还是昏沉沉地躺着，不知道身边有希望、有快乐，也有疑虑和危险。眼前的样子叫人心碎。那张从前红润的脸，如今空洞又陌生。忙个不停的双手，变得又瘦又弱。爱笑的嘴唇没有一点声音，整齐漂亮的头发也蓬乱地散在枕上。
        - id: ch03-b06
          speaker: narrator
          text: 她这样躺了整整一天，偶尔醒来，干裂的嘴唇几乎动不了，只能勉强吐出一个字。
        - id: ch03-b07
          speaker: beth
          text: 水……
        - id: ch03-b08
          speaker: narrator
          text: 乔和梅格一整天守在床边，看着，等着，盼着。她们把信心都交给上帝和母亲。雪下了一整天，风也咆哮了一整天，时间过得慢极了。黑夜终于降临。钟每响一次，姐妹俩就隔着病床互相望一眼。她们眼里比刚才亮了一点，因为每过一个钟头，援手就离她们近一点。班斯大夫来看过，说午夜前后病情也许会有变化，可能转好，也可能变坏。他到时候会再来。
    - id: ch04
      title: 漫长的守夜
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 汉娜已经累得撑不住，在床尾的沙发上躺下，很快睡熟了。劳伦斯先生在客厅来回踱步。他宁愿去面对叛军的一排大炮，也不愿面对马奇太太走进家门时的脸色。劳里躺在地毯上，假装休息，眼睛却一直盯着炉火。沉思让他那双黑眼睛显得格外柔和清亮。
        - id: ch04-b02
          speaker: narrator
          text: 姑娘们一辈子也没有忘记那个夜晚。她们守着贝丝，谁都睡不着。在这样的时刻，人会感到自己一点办法也没有，她们正被这种可怕的无力感紧紧抓住。
        - id: ch04-b03
          speaker: meg
          text: 如果上帝让贝丝活下来，我以后再也不抱怨了。
        - id: ch04-b04
          speaker: jo
          text: 如果上帝让贝丝活下来，我愿意用一辈子爱祂、侍奉祂。
        - id: ch04-b05
          speaker: narrator
          text: 过了一会儿，梅格低低叹了口气。
        - id: ch04-b06
          speaker: meg
          text: 我真希望自己没有心。它疼得太厉害了。
          emotion: sad
        - id: ch04-b07
          speaker: jo
          text: 要是日子总这么难，我不知道我们该怎么熬下去。
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: 钟敲了十二下。姐妹俩立刻忘了自己，只盯着贝丝。那张憔悴的脸上，似乎有什么变了。房间里一片死寂，只有风在外面哀号。疲惫的汉娜还睡着。除去姐妹俩，没有人看见一道苍白的阴影，仿佛落在了那张小床上。
        - id: ch04-b09
          speaker: narrator
          text: 一个钟头过去，什么也没发生，只有劳里悄悄出门去车站。又一个钟头过去，还是没有人来。姑娘们越来越不安。是不是风雪耽误了火车？是不是路上出了事故？又或者，最可怕的是，华盛顿传来了巨大的不幸？这些念头一直在她们心里打转。
        - id: ch04-b10
          speaker: narrator
          text: 两点已经过了。乔站在窗边向外望，觉得整个世界裹在白雪缝成的寿衣里，凄凉极了。忽然，床边传来一点动静。她连忙回头，看见梅格跪在母亲的安乐椅前，脸藏得很深。一阵可怕的寒意穿过乔的心。她想，贝丝死了，梅格不敢告诉她。
        - id: ch04-b11
          speaker: narrator
          text: 乔一眨眼便回到床边。惊恐让她的眼睛变得格外敏锐，贝丝看起来真的完全变了。高烧的红色和痛苦的神情都不见了。妹妹那张亲爱的脸又白又平静，像是终于得到了彻底的安息。乔竟没有哭，也没有哀号。她俯下身，贴近自己最亲爱的妹妹。满心的话都到了嘴边。她吻吻那湿润的额头，轻声开口。
        - id: ch04-b12
          speaker: jo
          text: 再见了，我的贝丝。再见了！
          emotion: sad
        - id: ch04-b13
          speaker: narrator
          text: 汉娜像是被这点动静惊醒，猛地起身赶到床边。她看看贝丝，摸摸她的手，又低头听了听呼吸。接着，她把围裙蒙在头上，坐下来前后摇晃，压着声音叫了起来。
        - id: ch04-b14
          speaker: hannah
          text: 烧退了！她睡得很自然，皮肤也出汗了，呼吸又轻又顺。感谢上帝！我的老天爷啊！
          emotion: happy
        - id: ch04-b15
          speaker: narrator
          text: 姑娘们还来不及相信这个好消息，班斯大夫就赶来证实了它。他相貌平常，可这时他微笑着，像父亲一样慈爱地望着她们，姐妹俩只觉得那张脸简直像天使。
        - id: ch04-b16
          speaker: doctor_bangs
          text: 是的，亲爱的姑娘们，我想这小丫头能熬过这一关。屋里一定要安静，让她睡。等她醒来，再给她……
          emotion: calm
        - id: ch04-b17
          speaker: narrator
          text: 至于贝丝醒来以后该吃什么，她们一个字也没听见。两个人悄悄溜到昏暗的门厅，并肩坐在楼梯上，紧紧抱住彼此。她们心里装满了欢喜，已经一句话也说不出来。回到房里以后，忠实的汉娜又亲又抱。贝丝则像从前那样，把脸颊枕在手上。那种吓人的苍白已经退去，她呼吸平静，仿佛才刚刚睡着。
    - id: ch05
      title: 黎明与归来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 冬夜慢慢退去。乔望着熟睡的贝丝，轻声开口。
        - id: ch05-b02
          speaker: jo
          text: 要是妈妈现在就回来，那该多好！
        - id: ch05-b03
          speaker: meg
          text: 你看。我原来还以为，这朵花到明天也开不了，没法放在贝丝手里，陪她……离开我们。可是它夜里开了。现在我要把它插进花瓶。等小宝贝醒来，第一眼就能看见这朵白玫瑰，还有妈妈的脸。
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: 漫长而悲伤的守候终于结束。清晨，梅格和乔睁着疲倦的眼睛向外看。她们从没见过旭日升得这样美，也从没觉得这个世界这样可爱。
        - id: ch05-b05
          speaker: meg
          text: 外面简直像仙境。
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: 梅格站在窗帘后，望着耀眼的雪景，独自微笑。乔忽然猛地站起来。
        - id: ch05-b07
          speaker: jo
          text: 听！
          emotion: surprised
        - id: ch05-b08
          speaker: narrator
          text: 楼下门边响起了铃铛声，接着传来汉娜的一声呼喊。然后，她们听见劳里欢喜地压低了声音。
        - id: ch05-b09
          speaker: laurie
          text: 姑娘们，她回来了！她回来了！
          emotion: happy
