audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，含蓄机智, timbre: 清澈柔和, pace: 从容而有变化, pitch: 中音}
    meg:
      display_name: 梅格
      tts: {delivery: 端庄温和，偶尔显出姐姐的威严, timbre: 柔润明亮, pace: 适中, pitch: 中音}
    jo:
      display_name: 乔
      tts: {delivery: 爽直敏捷，情绪真挚, timbre: 清亮有力, pace: 稍快, pitch: 中低音}
    laurie:
      display_name: 劳里
      tts: {delivery: 活泼亲切，善于打趣哄人, timbre: 明朗温暖, pace: 轻快, pitch: 中音}
    mrs_march:
      display_name: 马奇太太
      tts: {delivery: 慈爱爽朗，沉稳中带着鼓励, timbre: 饱满温暖, pace: 从容, pitch: 中低音}
    mr_laurence:
      display_name: 劳伦斯先生
      tts:
        delivery: 严肃直接，善意藏在简短的话里
        timbre: 低沉浑厚
        pace: 从容
        pitch: 低
    maid:
      display_name: 女仆
      tts:
        delivery: 恭敬利落，语气克制
        timbre: 清晰朴素
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 藏不住的秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天，乔的神情实在耐人寻味。秘密沉甸甸地压在心头，她又藏不住那副神秘而得意的样子。梅格早摸清了她的脾气，知道越是不问，乔越会自己说出来。可这一回，乔竟然始终闭紧嘴巴，还处处摆出宽容照顾姐姐的架势。梅格被她惹恼了，也端起姐姐的庄重，不再理她，只陪着母亲。
        - id: ch01-b02
          speaker: narrator
          text: 马奇太太接手照料贝丝，让乔结束这段日子的困守，出去活动，也找点乐子。艾米不在家，她能去找的只有劳里。乔喜欢同他作伴，这时却有些怕见他。那家伙最爱逗人，没准会把秘密哄出来。
        - id: ch01-b03
          speaker: narrator
          text: 她一点也没猜错。劳里闻到秘密的气息，马上追查起来。他哄过，收买过，也嘲笑、威胁、责怪过乔。他又装作毫不在意，等她放松戒备，还一会儿说自己全知道，一会儿说根本不稀罕知道。最后，他断定这事和梅格、布鲁克先生有关。家庭教师竟没把他当知己，这叫他很不痛快。他动起脑筋，要给这份冷落配上一场恰到好处的报复。
        - id: ch01-b04
          speaker: narrator
          text: 梅格像是早把这件事忘了，只顾忙着迎接父亲。可一两天后，她忽然变得很不对劲。别人一开口，她就受惊。有人看她，她就脸红。她安静得出奇，坐着做针线时，总带着羞怯又不安的神色。母亲问她，她只说没事。乔想追问，她便求妹妹别来烦她。
        - id: ch01-b05
          speaker: jo
          text: 她准是从空气里闻到爱情了，而且一下就陷进去了。那些症状差不多全有。她心神不定，又爱发脾气，吃不下，睡不着，还一个人缩在角落里发愁。我撞见她唱他送的歌。有一回，她也跟您一样叫了一声“约翰”，接着整张脸红得像罂粟花。妈妈，咱们怎么办？
        - id: ch01-b06
          speaker: mrs_march
          text: 什么也不做，等着就好。让她清静些，对她温柔一点，也多一点耐心。等爸爸回来，这件事自然会有结果。
        - id: ch01-b07
          speaker: narrator
          text: 又过了一天，乔照常分发小邮局里的信。
        - id: ch01-b08
          speaker: jo
          text: 梅格，有你一封信，封得可真严。怪了，泰迪写给我的信从来不封口。
        - id: ch01-b09
          speaker: narrator
          text: 马奇太太和乔各自忙着，忽然听见梅格发出一声怪响。两人抬起头，只见她惊恐地瞪着那封信。
        - id: ch01-b10
          speaker: mrs_march
          text: 孩子，出什么事了？
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: 母亲赶到她身边，乔也伸手去拿那张惹祸的信纸。
        - id: ch01-b12
          speaker: meg
          text: 全错了，根本不是他寄的。乔，你怎么能做这种事？
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: 梅格捂住脸，哭得伤心极了。
        - id: ch01-b14
          speaker: jo
          text: 我？我什么都没做啊！她到底在说什么？
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: 梅格一向温柔的眼睛里冒出了怒火。她从口袋里掏出一张揉皱的便笺，朝乔扔过去。
        - id: ch01-b16
          speaker: meg
          text: 这是你写的，那个坏小子还帮了你。你们怎么能这样没礼貌，这样卑鄙？你们对我们两个人都太残忍了！
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: 乔几乎没听见。她正和母亲一起读那封笔迹古怪的信。信里，那个冒牌的约翰称梅格为“最亲爱的玛格丽特”，说自己再也压不住热情，非要在回来前知道结果。他还说，暂时不敢告诉双方父母，可只要两人彼此有意，他们一定会同意。劳伦斯先生会替他找个好职位，到那时，他盼梅格赐给他幸福。信末又求她暂时瞒住家人，只托劳里送回一个有希望的答复，最后署名“永远忠于你的约翰”。
        - id: ch01-b18
          speaker: jo
          text: 原来是这个小坏蛋！我答应妈妈守住秘密，他竟拿这种事报复我。我要狠狠训他一顿，再把他抓来赔罪！
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: 乔恨不得立刻冲出去主持公道，母亲却拦住她，脸上露出了少见的严厉神情。
        - id: ch01-b20
          speaker: mrs_march
          text: 站住，乔。你先把自己的事说清楚。你闹过那么多恶作剧，连我也担心这次有你的份。
        - id: ch01-b21
          speaker: jo
          text: 妈妈，我发誓没有！我从来没见过这封信，什么都不知道。我说的每个字都是真的！
        - id: ch01-b22
          speaker: narrator
          text: 乔说得十分恳切，母亲和梅格便信了她。
        - id: ch01-b23
          speaker: jo
          text: 我要是参与了，肯定会做得高明得多，也会写出一封像样的信。梅格，你该知道布鲁克先生绝不会写这种胡话。
        - id: ch01-b24
          speaker: narrator
          text: 她轻蔑地把信扔下。
        - id: ch01-b25
          speaker: meg
          text: 可是，这真的很像他的字迹。
        - id: ch01-b26
          speaker: narrator
          text: 梅格结结巴巴地说着，把假信和手里的另一封信放在一起比较。
        - id: ch01-b27
          speaker: mrs_march
          text: 天哪，梅格，你不会回信了吧？
          emotion: surprised
        - id: ch01-b28
          speaker: meg
          text: 我回了！
          emotion: sad
        - id: ch01-b29
          speaker: narrator
          text: 她羞愧得又把脸藏了起来。
        - id: ch01-b30
          speaker: jo
          text: 这下真闯祸了！让我把那个坏小子揪来，把事情解释清楚，也好好挨一顿训。不抓到他，我绝不会安心。
        - id: ch01-b31
          speaker: mrs_march
          text: 别出声。这比我原来想的严重，交给我处理。玛格丽特，你从头到尾讲清楚。
        - id: ch01-b32
          speaker: narrator
          text: 马奇太太在梅格身边坐下，同时牢牢抓住乔，不让她冲出门去。
    - id: ch02
      title: 假信的真相
      blocks:
        - id: ch02-b01
          speaker: meg
          text: 第一封信是劳里送来的，他看起来好像什么都不知道。起先我很担心，本来想告诉您。可我又想到，您很喜欢布鲁克先生，觉得把这个小秘密藏几天，您也不会怪我。我真傻。想到没有人知道，我心里竟还有点喜欢。我琢磨该怎么回答时，简直觉得自己成了书里的姑娘，也有这样的大事要处置了。妈妈，请原谅我吧。我已经因为自己的愚蠢受够了罚，以后再也没脸见他。
          emotion: sad
        - id: ch02-b02
          speaker: mrs_march
          text: 你回了些什么？
        - id: ch02-b03
          speaker: meg
          text: 我只说自己太小，现在不能想这种事。我不愿意瞒着您，他应该去跟爸爸谈。我很感谢他的好意，也愿意做他的朋友，不过很长一段时间里，我们只能做朋友。
        - id: ch02-b04
          speaker: narrator
          text: 马奇太太笑了，看上去很满意。乔也拍起手来。
        - id: ch02-b05
          speaker: jo
          text: 你都快赶上卡罗琳·珀西了，她可是谨慎端庄的模范！然后呢，梅格？他又怎么回你？
          emotion: happy
        - id: ch02-b06
          speaker: meg
          text: 回信的口气完全变了。他说自己从没寄过情书，还说我那个顽皮妹妹乔拿我们的名字开玩笑，他对此非常遗憾。那封信写得又客气又尊重。你们想想，我该有多难堪！
          emotion: sad
        - id: ch02-b07
          speaker: narrator
          text: 梅格靠在母亲身上，满脸绝望。乔则在房里重重地走来走去，一路痛骂劳里。突然，她停下来，拿起两封信细看。
        - id: ch02-b08
          speaker: jo
          text: 我敢说，布鲁克连一封都没见过。两封全是泰迪写的。他把你的回信扣下了，等着拿给我看，好报复我不肯说出秘密。
        - id: ch02-b09
          speaker: meg
          text: 乔，以后别藏秘密了。把事情告诉妈妈，省得给自己惹祸。我本来也该这么做。
        - id: ch02-b10
          speaker: jo
          text: 哎呀，你这个傻姑娘！这个秘密本来就是妈妈告诉我的。
        - id: ch02-b11
          speaker: mrs_march
          text: 好了，乔。我留下来安慰梅格，你去把劳里叫来。我要马上把事情查清楚，让这种恶作剧到此为止。
        - id: ch02-b12
          speaker: narrator
          text: 乔飞奔而去。马奇太太便把布鲁克先生真正的心意温柔地告诉梅格。
        - id: ch02-b13
          speaker: mrs_march
          text: 现在说说你自己吧，亲爱的。你爱他爱到愿意等他安置好一个家吗？还是说，你眼下仍想完全自由地生活？
        - id: ch02-b14
          speaker: meg
          text: 这件事把我吓坏了，也把我折腾够了。很长一段时间里，我都不想再理什么求爱的人，也许永远都不想。要是约翰完全不知道这些荒唐事，就千万别告诉他。乔和劳里也必须闭紧嘴巴。我不要别人骗我、捉弄我，把我当傻瓜。这太不像话了！
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: 温柔的梅格这回真的动了怒，那场恶作剧也狠狠伤了她的自尊。母亲看得很清楚，便答应绝不泄露，以后也会格外谨慎，慢慢安慰她。门厅里刚传来劳里的脚步，梅格就躲进书房，把马奇太太一个人留在客厅。
        - id: ch02-b16
          speaker: narrator
          text: 乔怕劳里不肯来，路上没有告诉他原因。可他一看马奇太太的脸色，马上全明白了。他站在那里，不住地转动帽子，满脸心虚，等于当场给自己定了罪。乔被请到外面，却像个哨兵一样在门厅巡逻，唯恐犯人逃跑。客厅里的声音一阵高，一阵低，足足持续了半小时。至于会谈里究竟说了什么，姑娘们一直没有知道。
        - id: ch02-b17
          speaker: narrator
          text: 她们被叫进去时，劳里正站在母亲身边，后悔全写在脸上。乔立刻就原谅了他，只是觉得不该表现出来。梅格接受了他低声下气的道歉。听他保证布鲁克对恶作剧一无所知，她也大大松了一口气。
        - id: ch02-b18
          speaker: laurie
          text: 我到死都不会告诉他。就算拿野马来拖，也别想从我嘴里拖出一个字。梅格，请你原谅我吧。只要能证明我真的后悔透了，你叫我做什么都可以。
          emotion: sad
        - id: ch02-b19
          speaker: meg
          text: 我会试着原谅你。可你做的事一点也不像个绅士。我真没想到，你会这么诡诈，这么恶毒，劳里。
          emotion: angry
        - id: ch02-b20
          speaker: narrator
          text: 她故意摆出严厉责备的样子，好遮住自己的窘迫。
        - id: ch02-b21
          speaker: laurie
          text: 整件事从头到尾都糟透了。你们一个月不理我也是我活该。可是，你还是会理我的，对不对？
          emotion: sad
        - id: ch02-b22
          speaker: narrator
          text: 劳里把两手合在一起，苦苦央求。他的声音又带上了那种叫人无法拒绝的意味。尽管大家都气愤，谁也没法继续对他板着脸。梅格原谅了他。他立刻宣布，自己要用种种苦行赎罪，还要像条虫子一样，在受害的小姐面前卑躬屈膝。马奇太太拼命保持严肃，脸色到底还是缓和了。
        - id: ch02-b23
          speaker: narrator
          text: 乔始终站得远远的，努力逼自己不要原谅他，结果只绷出一张古板又不赞同的脸。劳里朝她看了一两次，见她一点也不心软，反而觉得自己受了委屈，便转过身去。等别人都说完，他只向乔深深鞠了一躬，一个字也没说就走了。
    - id: ch03
      title: 两个火药罐
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 劳里刚走，乔就后悔自己不够宽容。梅格和母亲上楼以后，她独自待着，越发想念泰迪。她忍了一阵，到底还是顺从心里的冲动，拿上一本要还的书，去了隔壁的大宅。
        - id: ch03-b02
          speaker: jo
          text: 劳伦斯先生在吗？
        - id: ch03-b03
          speaker: narrator
          text: 她问一个正从楼上下来的女仆。
        - id: ch03-b04
          speaker: maid
          text: 在的，小姐。不过眼下恐怕不方便见客。
        - id: ch03-b05
          speaker: jo
          text: 怎么了？他病了吗？
        - id: ch03-b06
          speaker: maid
          text: 哎呀，不是。老先生刚和劳里少爷大吵了一场。少爷不知为什么又发了脾气，把老先生气坏了，我可不敢靠近。
        - id: ch03-b07
          speaker: jo
          text: 劳里在哪儿？
        - id: ch03-b08
          speaker: maid
          text: 他把自己锁在房里。我敲了好半天，他也不答应。晚饭都准备好了，可谁也不肯来吃。我真不知道该怎么办。
        - id: ch03-b09
          speaker: jo
          text: 我去看看出了什么事。他们两个，我谁也不怕。
        - id: ch03-b10
          speaker: narrator
          text: 乔上了楼，砰砰敲响劳里小书房的门。
        - id: ch03-b11
          speaker: laurie
          text: 别敲了！再敲，我开门以后可要你好看！
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: 乔马上又敲了一遍。门猛地打开，劳里还没从惊讶里回过神，她已经跳了进去。乔一眼看出他真在发火，也知道该怎样对付他。她装出满脸悔恨，夸张地跪了下来。
        - id: ch03-b13
          speaker: jo
          text: 请原谅我刚才对你那么凶。我是来讲和的。你不肯原谅，我就不走。
        - id: ch03-b14
          speaker: laurie
          text: 已经没事了。起来吧，乔，别犯傻。
        - id: ch03-b15
          speaker: narrator
          text: 他像个骑士一样接受了她的请求。
        - id: ch03-b16
          speaker: jo
          text: 多谢，我这就起来。现在请问，出了什么事？你这模样可不像心里安宁。
        - id: ch03-b17
          speaker: laurie
          text: 他抓住我使劲摇！我绝不容忍！
          emotion: angry
        - id: ch03-b18
          speaker: jo
          text: 谁摇你？
        - id: ch03-b19
          speaker: laurie
          text: 爷爷。要是换了别人，我早就……
          emotion: angry
        - id: ch03-b20
          speaker: narrator
          text: 这位受了委屈的年轻人狠狠挥了挥右臂，把后半句话补得明明白白。
        - id: ch03-b21
          speaker: jo
          text: 这有什么？我常常摇你，你也不在乎呀。
        - id: ch03-b22
          speaker: laurie
          text: 呸！你是个姑娘，闹着玩当然不要紧。可哪个男人也别想摇我！
          emotion: angry
        - id: ch03-b23
          speaker: jo
          text: 你现在像一大片雷雨云，我看也没人愿意试。可他为什么摇你？
        - id: ch03-b24
          speaker: laurie
          text: 因为我不肯说你母亲为什么叫我过去。我答应了不泄露，那就不能食言。
        - id: ch03-b25
          speaker: jo
          text: 你不能换个办法，让他放心吗？
        - id: ch03-b26
          speaker: laurie
          text: 不能。他非要真相，要完整的真相，别的一个字都不要。要是不牵连梅格，我可以把自己惹出的乱子全告诉他。可我不能，只好闭嘴听他骂。后来老先生一把揪住我，我只好跑开，免得自己控制不住。
        - id: ch03-b27
          speaker: jo
          text: 他这样是不太好。不过我知道，他现在已经后悔了。你下楼去和好吧，我来帮你。
        - id: ch03-b28
          speaker: laurie
          text: 我死也不去！我不过开了个小玩笑，不想让每个人都来训我、揍我。梅格那件事是我错，我也堂堂正正道过歉了。可这回不是我的错，我绝不会再道一次歉。
          emotion: angry
        - id: ch03-b29
          speaker: jo
          text: 可你爷爷不知道原因呀。
        - id: ch03-b30
          speaker: laurie
          text: 他应该信我，不该还把我当小娃娃。没用的，乔。他得明白，我可以照顾自己，不必抓着谁的围裙带子才能站稳。
        - id: ch03-b31
          speaker: jo
          text: 你们两个都是火药罐！那你准备怎么办？
        - id: ch03-b32
          speaker: laurie
          text: 他该向我道歉，也该相信我说的话。我不能告诉他这场风波为什么发生。
        - id: ch03-b33
          speaker: jo
          text: 算了吧，他绝不会道歉。
        - id: ch03-b34
          speaker: laurie
          text: 那他不道歉，我就不下楼。
        - id: ch03-b35
          speaker: jo
          text: 泰迪，讲点道理吧。别再计较了。我会把能说的都解释给他。你又不能永远关在这里，何必摆出戏台上那副悲壮样子？
        - id: ch03-b36
          speaker: laurie
          text: 反正我也不想在这里待太久。我会偷偷跑掉，到别处旅行。等爷爷想我了，很快就会回心转意。
        - id: ch03-b37
          speaker: jo
          text: 也许会。可你不该这样叫他担心。
        - id: ch03-b38
          speaker: laurie
          text: 别教训我。我要去华盛顿找布鲁克。那里热闹得很。受了这么多气，我正该去痛痛快快玩一回。
        - id: ch03-b39
          speaker: jo
          text: 你准会玩得快活极了！真希望我也能逃走。
        - id: ch03-b40
          speaker: narrator
          text: 乔一想到首都的军旅生活，顿时兴奋起来，连自己是来劝人的都忘了。
        - id: ch03-b41
          speaker: laurie
          text: 那就一起去！为什么不呢？你去给父亲一个惊喜，我去逗逗老布鲁克。这玩笑一定精彩透了。就这么办吧，乔。咱们留封信，说自己平安，然后马上出发。我有足够的钱。你正好能见父亲，只有好处，绝不会有坏处。
        - id: ch03-b42
          speaker: narrator
          text: 有那么一会儿，乔看起来真的要答应。这个计划又狂野又合她的性子。长久的忧虑和困守已经让她厌倦，她渴望变化。一想到父亲，再想到军营和医院的新奇、自由、快乐，她越发挡不住诱惑。她望向窗外，眼睛亮了起来。可视线一落到对面的老房子上，她又忧伤而坚定地摇了摇头。
        - id: ch03-b43
          speaker: jo
          text: 我要是个男孩，一定跟你一起逃走，好好玩一场。可惜我是个倒霉姑娘，只能规规矩矩留在家里。别再诱惑我了，泰迪，这计划太疯狂。
        - id: ch03-b44
          speaker: laurie
          text: 正因为疯狂，才有趣。
        - id: ch03-b45
          speaker: narrator
          text: 劳里那股任性劲儿刚冒出来，非要挣脱约束不可，还想接着劝她。
        - id: ch03-b46
          speaker: jo
          text: 闭嘴！“端庄娴静”既然是我的命，我认了还不行吗？我是来给你讲道理的，不是来听这些话，让自己光想一想就兴奋得要跳起来。
        - id: ch03-b47
          speaker: laurie
          text: 我知道梅格准会给这主意泼冷水，可我以为你胆子更大些。
        - id: ch03-b48
          speaker: jo
          text: 坏小子，安静点！坐下来想你自己的过错，别害我再添上几条。要是我能叫你爷爷为了摇你而道歉，你肯放弃逃跑吗？
        - id: ch03-b49
          speaker: laurie
          text: 肯。不过你做不到。
        - id: ch03-b50
          speaker: narrator
          text: 他其实也想和好，只是受伤的自尊非要先得到补偿。
        - id: ch03-b51
          speaker: jo
          text: 小的我能收拾，老的也难不住我。
        - id: ch03-b52
          speaker: narrator
          text: 乔嘟囔着离开了。劳里两手托着脑袋，留在桌边，对着一张铁路地图出神。
    - id: ch04
      title: 乔来讲和
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 乔敲了敲劳伦斯先生的房门，里面传来一声粗厉的“进来”。
        - id: ch04-b02
          speaker: jo
          text: 是我，先生。我来还一本书。
        - id: ch04-b03
          speaker: narrator
          text: 她走进去，语气格外温和。
        - id: ch04-b04
          speaker: mr_laurence
          text: 还想再借一本吗？
        - id: ch04-b05
          speaker: narrator
          text: 老先生神情阴沉，明明很恼火，还竭力不露出来。
        - id: ch04-b06
          speaker: jo
          text: 想借，谢谢您。我很喜欢老萨姆，还想读读第二卷。
        - id: ch04-b07
          speaker: narrator
          text: 劳伦斯先生曾把鲍斯韦尔那本妙趣横生的《约翰逊传》推荐给她。乔希望再来一剂，哄他高兴。他把活动梯推向摆着约翰逊著作的书架时，两道浓眉果然稍稍舒展。乔轻快地爬上去，坐在最高一级，假装找书，心里却盘算着怎样开口谈那件危险的事。
        - id: ch04-b08
          speaker: narrator
          text: 老先生似乎猜到了她的心思。他在房间里快步走了几圈，忽然转身面对她，开口突兀得吓掉了一本《拉塞勒斯》。书啪地一声，脸朝下落在地板上。
        - id: ch04-b09
          speaker: mr_laurence
          text: 那小子又干了什么？别想替他遮掩。我一看他回家时的样子，就知道准是闯祸了。我问不出一个字，刚说要把真话从他身上摇出来，他就跑上楼，把门锁了。
          emotion: angry
        - id: ch04-b10
          speaker: jo
          text: 他确实做错了，可我们已经原谅他，而且大家都答应不告诉别人。
        - id: ch04-b11
          speaker: mr_laurence
          text: 那可不成。他别想躲在你们这些心软姑娘的承诺后头。做了坏事，就得坦白、赔罪、受罚。快告诉我，乔。我不能什么都不知道。
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: 老先生的模样很吓人，口气也严厉。乔若能逃，准会立刻溜掉。可她偏偏坐在高高的梯子顶上，他又像只拦路的狮子守在下面。她只能鼓起勇气应付。
        - id: ch04-b13
          speaker: jo
          text: 先生，我真的不能说。妈妈不许我们透露。劳里承认了错误，也赔过罪，受的惩罚已经够了。我们不说，不是要袒护他，是为了保护另一个人。您要是插手，只会惹出更多麻烦。这件事也有我的一点责任，不过如今全解决了。求您别再管啦。咱们谈谈《漫步者》，或者聊点别的愉快事情吧。
        - id: ch04-b14
          speaker: mr_laurence
          text: 让《漫步者》见鬼去吧！下来。你得向我保证，我家这个莽撞小子没有忘恩负义，也没有对你们无礼。你们待他那么好，他要还敢胡闹，我就亲手抽他一顿。
          emotion: angry
        - id: ch04-b15
          speaker: narrator
          text: 这话听着可怕，乔却不慌。她知道老先生嘴上再凶，也绝不会碰孙子一根手指。她顺从地爬下来，既不出卖梅格，也不歪曲事实，尽量把那场恶作剧说得没那么严重。
        - id: ch04-b16
          speaker: mr_laurence
          text: 嗯……啊……好吧。要是那小子闭嘴是为了守信，不是存心犯倔，我就原谅他。他那脾气太硬，实在难管。
        - id: ch04-b17
          speaker: narrator
          text: 他把头发揉得乱蓬蓬的，活像刚从狂风里回来。知道真相后，他松了一口气，眉间的皱纹也平了。
        - id: ch04-b18
          speaker: jo
          text: 我也是那种脾气。不过一句温和的话就能管住我，哪怕国王带着千军万马来，也休想逼我听话。
        - id: ch04-b19
          speaker: narrator
          text: 乔想替朋友说句好话。他才从一场麻烦里出来，转眼又掉进了另一场。
        - id: ch04-b20
          speaker: mr_laurence
          text: 你的意思是，我待他不够温和？
          emotion: angry
        - id: ch04-b21
          speaker: jo
          text: 啊，不是，先生。有时您对他反而太好了。只是等他把您的耐心耗光，您偶尔会急躁那么一点点。您自己不这样觉得吗？
        - id: ch04-b22
          speaker: narrator
          text: 话已经说到这里，乔决定一口气说完。她努力装得平静，冒失地讲完，心里其实有些发抖。让她又惊又喜的是，老先生只把眼镜啪地扔到桌上，坦率地叫了起来。
        - id: ch04-b23
          speaker: mr_laurence
          text: 你说得对，丫头，我就是这样！我爱这孩子，可他常把我的耐心折腾得一点不剩。我们再这样下去，迟早要闹出结果。
        - id: ch04-b24
          speaker: jo
          text: 我告诉您会有什么结果吧。他会逃走。
        - id: ch04-b25
          speaker: narrator
          text: 话一出口，乔就后悔了。她只是想提醒老人，劳里受不了太多管束，希望他以后宽容些。可劳伦斯先生红润的脸一下变了颜色。他坐下来，不安地望着桌子上方那幅英俊男子的画像。画里是劳里的父亲。他年轻时也曾离家出走，违背这个专横老人的心愿结了婚。乔猜到老先生想起了往事，心里后悔，越发希望自己刚才没有多嘴。
        - id: ch04-b26
          speaker: jo
          text: 除非被逼得太厉害，他不会真的走。他只有念书念烦了，才偶尔拿这话吓人。我也常想逃跑，特别是头发刚剪掉那阵子。所以，哪天您发现我们不见了，就登一则寻人启事，写明寻找两个男孩，再去开往印度的船上看看。
        - id: ch04-b27
          speaker: narrator
          text: 她笑着说完。劳伦斯先生显然把这件事当成玩笑，神色轻松了。
        - id: ch04-b28
          speaker: mr_laurence
          text: 你这个野丫头，怎么敢说这样的话？你对我的敬意呢？平日的教养呢？上帝保佑这些男孩女孩吧！他们真能折磨人，可我们偏偏又离不开。
        - id: ch04-b29
          speaker: narrator
          text: 他好脾气地捏了捏乔的脸颊。
        - id: ch04-b30
          speaker: mr_laurence
          text: 去叫那小子下来吃饭。告诉他，事情过去了，再劝他别在爷爷面前演悲剧人物。我可受不了。
        - id: ch04-b31
          speaker: jo
          text: 他不会来的，先生。您不肯相信他真的不能说，他心里很难受。我想，您刚才摇那一下，深深伤了他的感情。
        - id: ch04-b32
          speaker: narrator
          text: 乔努力摆出一脸哀怜，大概没有成功。劳伦斯先生笑起来，她便知道自己已经赢了。
        - id: ch04-b33
          speaker: mr_laurence
          text: 这件事我很抱歉。照这么说，我还该谢谢他没有反过来摇我。那小子究竟想怎么样？
        - id: ch04-b34
          speaker: jo
          text: 我要是您，就写封信向他道歉。他说收不到道歉就不下楼，还嚷着要去华盛顿，闹得实在荒唐。一封正式道歉信，既会让他看出自己有多傻，也能叫他和和气气下来。试试吧。他喜欢玩笑，这比当面谈更合适。我替您送上去，再教教他该守的本分。
        - id: ch04-b35
          speaker: narrator
          text: 劳伦斯先生锐利地看了她一眼，然后戴上眼镜，慢吞吞地开了口。
        - id: ch04-b36
          speaker: mr_laurence
          text: 你这只狡猾的小猫。不过让你和贝丝管管我，我倒不介意。来，拿张纸。咱们赶紧结束这场胡闹。
    - id: ch05
      title: 翻开新的一页
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 那封信写得一本正经，仿佛一位绅士严重冒犯了另一位绅士，特意郑重道歉。乔亲了亲劳伦斯先生光秃秃的头顶，拿着信跑上楼，从劳里的门缝下塞了进去。她又隔着钥匙孔，劝他谦恭顺从、举止端庄，还列出另外几样同样可喜、也同样不可能的美德。
        - id: ch05-b02
          speaker: narrator
          text: 发现房门还是锁着，乔就让信自己发挥作用，准备悄悄离开。谁知年轻的绅士已经顺着楼梯扶手滑下去，站在底下等她。他摆出最有德行的神情。
        - id: ch05-b03
          speaker: laurie
          text: 乔，你真是个好兄弟！挨训了吗？
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: 说完，他自己先笑了。
        - id: ch05-b05
          speaker: jo
          text: 没有。总的说来，他相当温和。
        - id: ch05-b06
          speaker: laurie
          text: 唉，我倒从四面八方挨了一遍。刚才连你也站到那一边，不肯理我。我那时真想豁出去，什么都不管了。
          emotion: sad
        - id: ch05-b07
          speaker: narrator
          text: 他说得很抱歉。
        - id: ch05-b08
          speaker: jo
          text: 别这样说。翻开新的一页，重新来过吧，我的泰迪乖儿子。
        - id: ch05-b09
          speaker: laurie
          text: 我总在翻新的一页，又总把它们弄脏，就跟小时候弄脏习字本一样。开头已经有那么多，这辈子大概也写不到结尾了。
          emotion: sad
        - id: ch05-b10
          speaker: narrator
          text: 他愁眉苦脸地说。
        - id: ch05-b11
          speaker: jo
          text: 去吃饭吧，吃完你就舒服了。男人一饿，总爱说丧气话。
        - id: ch05-b12
          speaker: narrator
          text: 乔说完，飞快地从前门跑了出去。
        - id: ch05-b13
          speaker: laurie
          text: 你这是给我这个“教派”贴“标签”！
        - id: ch05-b14
          speaker: narrator
          text: 劳里拿艾米说错的话回敬她，随后乖乖去和爷爷吃那顿认错饭。那天余下的时间里，老先生脾气好得像圣人，举止也客气得叫人吃不消。
        - id: ch05-b15
          speaker: narrator
          text: 大家都以为风波结束了，那一小片乌云也吹散了。可是祸根已经种下。别人虽忘了，梅格却一直记着。她从不提起那个人，心里却常常想他。她也比从前更爱做梦了。
        - id: ch05-b16
          speaker: narrator
          text: 有一回，乔在姐姐的书桌里找邮票，无意中发现一张小纸片。纸上反反复复写满了“约翰·布鲁克太太”。乔悲壮地呻吟一声，把纸扔进火里。她只觉得，劳里这场恶作剧，已经催着她最害怕的日子提前来了。
