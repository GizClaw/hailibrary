  chapters:
    - id: ch01
      title: Laurie Makes Mischief, and Jo Makes Peace
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The next day, Jo's face was quite a sight. The secret weighed on her, and she could hardly keep from looking important and mysterious. Meg noticed, but she knew that asking questions was the surest way not to get an answer from Jo. So she waited. Jo said nothing and began treating her sister with a superior air. That annoyed Meg, who answered with dignified silence and stayed close to Mother.
        - id: ch01-b02
          speaker: narrator
          text: Mrs. March had taken over the nursing and ordered Jo to rest, exercise, and enjoy herself after being shut in so long. Amy was still away, which left Laurie as Jo's only refuge. She loved his company, but just then she was nervous around him. He teased without mercy, and she feared he would coax the secret out of her.
        - id: ch01-b03
          speaker: narrator
          text: She was right. The moment Laurie sensed a mystery, he set out to solve it, and he made Jo's life miserable. He tried coaxing her, bribing her, making fun of her, threatening her, and scolding her. Then he acted as if he did not care, hoping the truth would slip out when Jo relaxed. One minute he declared that he already knew everything, and the next he said the whole business meant nothing to him. He kept at it until he was sure the secret concerned Meg and Mr. Brooke. Then he felt insulted that his own tutor had not trusted him, so he began planning what he considered a suitable revenge.
        - id: ch01-b04
          speaker: narrator
          text: Meanwhile, Meg seemed to have forgotten the whole thing. She devoted herself to getting ready for Father's return. Then, quite suddenly, she changed. For a day or two, she was not herself at all. She startled when anyone spoke to her and blushed when anyone looked her way. She grew unusually quiet and spent long stretches bent over her sewing, wearing a shy, troubled expression. When Mother asked what was wrong, Meg insisted that she felt perfectly well. When Jo tried asking questions, Meg stopped her by begging to be left alone.
        - id: ch01-b05
          speaker: jo
          text: It's love. She can feel it in the air, and she's going fast. She has nearly every symptom. She's jumpy and cross, she won't eat, she lies awake, and she hides in corners. I heard her singing the song he gave her. Once she said "John," the way you do, and turned red as a poppy. What are we going to do?
        - id: ch01-b06
          speaker: marmee
          text: We wait. Leave her alone, and be patient and kind. When Father comes home, everything will be settled.
          emotion: calm
        - id: ch01-b07
          speaker: narrator
          text: The next day, Jo handed out the mail from their little post office.
        - id: ch01-b08
          speaker: jo
          text: Here's a sealed note for you, Meg. That's strange. Teddy never seals mine.
        - id: ch01-b09
          speaker: narrator
          text: Mrs. March and Jo went on with what they were doing. Then a sound from Meg made them look up. She was staring at the note in terror.
        - id: ch01-b10
          speaker: marmee
          text: My child, what is it?
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: Mother hurried to her, while Jo reached for the paper that had caused the trouble.
        - id: ch01-b12
          speaker: meg
          text: It was all a mistake. He never sent it. Oh, Jo, how could you?
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: Meg covered her face and cried as if her heart had broken.
        - id: ch01-b14
          speaker: jo
          text: Me? I haven't done anything! What is she talking about?
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: Anger flashed in Meg's gentle eyes. She pulled a crumpled letter from her pocket and threw it at Jo.
        - id: ch01-b16
          speaker: meg
          text: You wrote it, and that awful boy helped you. How could you be so rude and cruel to both of us?
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: Jo barely heard her. She and Mother were already reading the letter, which was written in an odd-looking hand. It began by calling Meg "My dearest Margaret." The writer claimed he could no longer hold back his love and had to know his fate before coming home. He said he did not dare tell her parents yet, though he believed they would agree if they knew how the two adored each other. Mr. Laurence would help him find a good position, and then, he wrote, his sweet girl could make him happy. He begged her to say nothing to her family and to send just one hopeful word through Laurie. It was signed, "Your devoted John."
        - id: ch01-b18
          speaker: jo
          text: That little villain! This is how he paid me back for keeping my promise to Mother. I'll give him the scolding he deserves and drag him over here to apologize.
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: Jo was ready to rush out and deliver justice at once, but Mother stopped her. Her face had a look the girls rarely saw.
        - id: ch01-b20
          speaker: marmee
          text: Wait, Jo. First you must prove you had no part in this. You have played so many tricks that I'm afraid you may have helped.
        - id: ch01-b21
          speaker: jo
          text: I give you my word, Mother, I didn't! I've never seen that note, and I know nothing about it. If I'd helped, I would have done a better job and written something sensible. Meg should know Mr. Brooke would never write such nonsense.
        - id: ch01-b22
          speaker: narrator
          text: Jo spoke so earnestly that they believed her. She tossed the letter down in disgust.
        - id: ch01-b23
          speaker: meg
          text: But it looks like his handwriting.
        - id: ch01-b24
          speaker: marmee
          text: Meg, you didn't answer it, did you?
        - id: ch01-b25
          speaker: meg
          text: I did!
        - id: ch01-b26
          speaker: narrator
          text: Meg hid her face again, overcome with shame.
        - id: ch01-b27
          speaker: jo
          text: What a mess! Please let me fetch that wicked boy so he can explain himself and get a lecture. I won't rest until I catch him.
        - id: ch01-b28
          speaker: marmee
          text: Hush. I will handle this, because it is worse than I thought. Margaret, tell me everything.
        - id: ch01-b29
          speaker: narrator
          text: Mother sat beside Meg and kept hold of Jo so she could not fly out the door.
        - id: ch01-b30
          speaker: meg
          text: Laurie brought the first letter, and he didn't seem to know what was in it. At first I was worried and meant to tell you. Then I remembered that you liked Mr. Brooke, so I thought you wouldn't mind if I kept my little secret for a few days. It was silly, but I liked believing no one knew. While I tried to decide what to say, I felt like one of those girls in books who has an important affair to manage. Please forgive me, Mother. I've been punished for my foolishness. I can never face him again.
        - id: ch01-b31
          speaker: marmee
          text: What did you tell him?
        - id: ch01-b32
          speaker: meg
          text: Only that I was too young to decide anything yet. I said I didn't want secrets from you and that he must speak to Father. I thanked him for his kindness and said I would be his friend, but nothing more for a long time.
        - id: ch01-b33
          speaker: narrator
          text: Mrs. March smiled, clearly pleased. Jo clapped her hands and laughed.
        - id: ch01-b34
          speaker: jo
          text: Why, you're almost as sensible as Caroline Percy, the very model of good judgment! Go on, Meg. What did he say after that?
        - id: ch01-b35
          speaker: meg
          text: This letter sounds completely different. He says he never sent a love letter. He is very sorry that my mischievous sister Jo used our names that way. It's polite and kind, but think how awful this is for me!
          emotion: sad
        - id: ch01-b36
          speaker: narrator
          text: Meg leaned against Mother in despair while Jo marched around the room, calling Laurie every name she could think of. Then Jo stopped. She grabbed both notes and studied them closely.
        - id: ch01-b37
          speaker: jo
          text: I don't believe Brooke saw either letter. Teddy wrote them both. He's keeping your answer so he can triumph over me because I wouldn't tell him my secret.
        - id: ch01-b38
          speaker: meg
          text: Then don't keep secrets, Jo. Tell Mother and stay out of trouble. That's what I should have done.
        - id: ch01-b39
          speaker: jo
          text: Oh, bless you! Mother was the one who told me.
        - id: ch01-b40
          speaker: marmee
          text: That's enough, Jo. Go bring Laurie here while I comfort Meg. I mean to learn exactly what happened and stop these tricks at once.
        - id: ch01-b41
          speaker: narrator
          text: Jo ran off. Mrs. March gently told Meg how Mr. Brooke truly felt.
        - id: ch01-b42
          speaker: marmee
          text: Now, dear, how do you feel? Do you love him enough to wait until he can make a home for you, or would you rather remain completely free?
        - id: ch01-b43
          speaker: meg
          text: I've been frightened and miserable, and I want nothing to do with lovers for a long time. Maybe never. If John knows nothing about this foolishness, don't tell him. Make Jo and Laurie keep quiet too. I won't be tricked and tormented and made to look ridiculous. It's shameful!
          emotion: angry
        - id: ch01-b44
          speaker: narrator
          text: Meg was usually gentle, but now her temper was up and her pride was wounded. Mother soothed her by promising perfect silence and much more care in the future. The moment Laurie's step sounded in the hall, Meg escaped into the study.
        - id: ch01-b45
          speaker: narrator
          text: Mrs. March met the culprit alone. Jo had not told him why he was wanted, because she feared he would refuse to come. But the moment Laurie saw Mother's face, he understood. He stood there twisting his hat, and his guilty look convicted him without a word. Mother dismissed Jo. Instead of going far, Jo marched up and down the hall like a guard on duty, half afraid her prisoner might escape. The voices in the parlor rose and fell for half an hour. Whatever passed between Mrs. March and Laurie during that interview, the girls never found out.
        - id: ch01-b46
          speaker: narrator
          text: When they were called back, Laurie stood beside Mother looking so sorry that Jo forgave him at once, though she thought it best not to show it. Meg accepted his humble apology. She was deeply relieved to hear that Mr. Brooke knew nothing about the joke.
        - id: ch01-b47
          speaker: laurie
          text: I will never tell him, not as long as I live. Wild horses couldn't pull it out of me. Please forgive me, Meg. I'll do anything to prove how completely sorry I am.
        - id: ch01-b48
          speaker: meg
          text: I'll try. But what you did was not gentlemanly at all. I never thought you could be so sneaky and unkind, Laurie.
        - id: ch01-b49
          speaker: laurie
          text: It was horrible, and I don't deserve a word from anyone for a month. But you will speak to me, won't you?
        - id: ch01-b50
          speaker: narrator
          text: Laurie folded his hands in such an imploring way, and used the persuasive voice no one could resist, that it was impossible to keep frowning at him, scandalous as his behavior had been. Meg forgave him. Mrs. March tried to remain serious, but even her face softened when he promised to make up for his sins with every sort of punishment. He would humble himself like a worm, he declared, before the young lady he had wronged.
        - id: ch01-b51
          speaker: narrator
          text: Jo stood apart, trying to harden her heart. All she managed was a stiff expression of complete disapproval. Laurie glanced at her once or twice. When she showed no sign of forgiving him, he felt hurt. He turned his back until the others had finished, bowed low to Jo, and left without a word.
        - id: ch01-b52
          speaker: narrator
          text: The moment he was gone, Jo wished she had been more forgiving. When Meg and Mother went upstairs, the room felt lonely, and she longed for Teddy's company. She resisted for some time, trying not to give in. At last, the impulse won. Jo armed herself with a book that needed returning and crossed over to the big house, using the errand as her excuse.
        - id: ch01-b53
          speaker: jo
          text: Is Mr. Laurence at home?
        - id: ch01-b54
          speaker: housemaid
          text: Yes, miss, but I don't think he's fit to see anyone just now.
        - id: ch01-b55
          speaker: jo
          text: Why? Is he sick?
        - id: ch01-b56
          speaker: housemaid
          text: Oh, no, miss. He and Mr. Laurie had a scene. The young gentleman is in one of his tempers, and that has upset the old gentleman, so I don't dare go near him.
        - id: ch01-b57
          speaker: jo
          text: Where is Laurie?
        - id: ch01-b58
          speaker: housemaid
          text: Locked in his room. He won't answer, though I've knocked and knocked. Dinner is ready, and I don't know what will happen to it when no one will come eat.
        - id: ch01-b59
          speaker: jo
          text: I'll find out what's wrong. Neither of them scares me.
        - id: ch01-b60
          speaker: narrator
          text: Jo went upstairs and knocked sharply on the door of Laurie's small study.
        - id: ch01-b61
          speaker: laurie
          text: Stop that, or I'll open this door and make you stop!
          emotion: angry
        - id: ch01-b62
          speaker: narrator
          text: Jo knocked again at once. The door flew open, and she bounced inside before Laurie recovered from his surprise. He truly was angry, so Jo used the way she knew would manage him best. She put on a sorry face, dropped dramatically to her knees, and spoke very meekly.
        - id: ch01-b63
          speaker: jo
          text: Please forgive me for being so cross. I came to make peace, and I can't leave until I do.
        - id: ch01-b64
          speaker: laurie
          text: Fine. Get up, Jo, and don't be ridiculous.
        - id: ch01-b65
          speaker: jo
          text: Thank you, I will. Now, may I ask what's wrong? You don't look exactly peaceful.
        - id: ch01-b66
          speaker: laurie
          text: He shook me, and I won't stand for it!
          emotion: angry
        - id: ch01-b67
          speaker: jo
          text: Who did?
        - id: ch01-b68
          speaker: laurie
          text: Grandfather. If anyone else had done it, I would have...
          emotion: angry
        - id: ch01-b69
          speaker: narrator
          text: Laurie finished with a fierce swing of his arm.
        - id: ch01-b70
          speaker: jo
          text: That's nothing. I shake you often enough, and you never mind.
        - id: ch01-b71
          speaker: laurie
          text: You're a girl, and that's only fun. No man is going to shake me!
        - id: ch01-b72
          speaker: jo
          text: No one would want to try while you look like that thundercloud. Why did he do it?
        - id: ch01-b73
          speaker: laurie
          text: Because I wouldn't tell him why your mother sent for me. I promised to keep quiet, so of course I couldn't break my word.
        - id: ch01-b74
          speaker: jo
          text: Couldn't you explain some other way?
        - id: ch01-b75
          speaker: laurie
          text: No. He demanded the truth, the whole truth, and nothing else. I could have confessed my own part if I hadn't had to bring Meg into it. Since I couldn't, I kept silent and took his scolding until he grabbed me. Then I ran before I forgot myself.
        - id: ch01-b76
          speaker: jo
          text: He shouldn't have done it, but I'm sure he's sorry. Come downstairs and make up with him. I'll help.
          emotion: calm
        - id: ch01-b77
          speaker: laurie
          text: I'll be hanged if I do! Everyone has lectured and knocked me around over one little joke. I was sorry about Meg, and I apologized properly. But I won't apologize again when I did nothing wrong.
          emotion: angry
        - id: ch01-b78
          speaker: jo
          text: He didn't know that.
        - id: ch01-b79
          speaker: laurie
          text: He should trust me. He shouldn't treat me like a baby. He has to learn that I can take care of myself. I don't need to hang on anyone's apron strings.
        - id: ch01-b80
          speaker: jo
          text: You're both pepper pots. How do you plan to settle this?
        - id: ch01-b81
          speaker: laurie
          text: He should apologize and believe me when I say I can't explain the quarrel.
        - id: ch01-b82
          speaker: jo
          text: He'll never do that.
        - id: ch01-b83
          speaker: laurie
          text: Then I won't go down.
        - id: ch01-b84
          speaker: jo
          text: Teddy, be sensible. Let it go, and I'll explain whatever I can. You can't stay locked up forever, so why act like you're in a tragedy?
        - id: ch01-b85
          speaker: laurie
          text: I don't mean to stay long. I'll sneak away on a trip. Once Grandpa misses me, he'll change his mind quickly enough.
        - id: ch01-b86
          speaker: jo
          text: Maybe, but you shouldn't run off and worry him.
        - id: ch01-b87
          speaker: laurie
          text: Don't preach. I'll go to Washington and visit Brooke. Things are lively there, and after all this trouble, I'll enjoy myself.
        - id: ch01-b88
          speaker: jo
          text: What fun! I wish I could run away too.
        - id: ch01-b89
          speaker: narrator
          text: For a moment, Jo forgot she was supposed to be giving advice. She pictured the busy military life in the capital.
        - id: ch01-b90
          speaker: laurie
          text: Then come with me! Why not? You can surprise your father, and I'll stir up old Brooke. What a glorious joke! We'll leave a note saying we're safe and go right now. I have plenty of money. Seeing your father would do you good, and where's the harm in that?
        - id: ch01-b91
          speaker: narrator
          text: For one moment, Jo looked ready to agree. Wild as it was, the plan suited her perfectly. She was tired of care and of being shut inside. She longed for movement and change. The thought of seeing Father tempted her, and with it came exciting pictures of camps and hospitals, freedom and fun. Her eyes lit up and turned wistfully toward the window. Then they fell on the old house across the way. She remembered where she belonged, and shook her head with a sad but firm decision.
        - id: ch01-b92
          speaker: jo
          text: If I were a boy, we'd run away and have a wonderful time. But I'm only a miserable girl, so I have to behave and stay home. Don't tempt me, Teddy. This plan is crazy.
        - id: ch01-b93
          speaker: laurie
          text: That's what makes it fun.
        - id: ch01-b94
          speaker: narrator
          text: Laurie was feeling stubborn and determined to break free somehow.
        - id: ch01-b95
          speaker: jo
          text: Be quiet!
        - id: ch01-b96
          speaker: narrator
          text: Jo covered her ears.
        - id: ch01-b97
          speaker: jo
          text: '"Prunes and prisms" are my fate, so I might as well accept them. I came here to lecture you, not to hear plans that make me want to jump for joy.'
        - id: ch01-b98
          speaker: laurie
          text: I knew Meg would throw cold water on the idea, but I thought you had more spirit.
        - id: ch01-b99
          speaker: jo
          text: Bad boy, stop it! Sit down and think about your own sins instead of helping me add to mine. If I can get your grandfather to apologize for shaking you, will you promise not to run away?
        - id: ch01-b100
          speaker: laurie
          text: Yes, but you can't do it.
        - id: ch01-b101
          speaker: narrator
          text: Laurie wanted to make peace, but first he wanted his wounded dignity repaired.
        - id: ch01-b102
          speaker: jo
          text: If I can manage the young one, I can manage the old one.
        - id: ch01-b103
          speaker: narrator
          text: Jo left Laurie bent over a railroad map, his head resting on both hands. Then she tapped on Mr. Laurence's door.
        - id: ch01-b104
          speaker: mr_laurence
          text: Come in!
        - id: ch01-b105
          speaker: jo
          text: It's only me, sir. I've come to return a book.
        - id: ch01-b106
          speaker: narrator
          text: The old gentleman looked grim and annoyed, though he tried not to show it.
        - id: ch01-b107
          speaker: mr_laurence
          text: Do you want another one?
        - id: ch01-b108
          speaker: jo
          text: Yes, please. I liked old Sam so much that I think I'll try the second volume.
        - id: ch01-b109
          speaker: narrator
          text: Jo hoped that accepting a second dose of Boswell's Johnson, which Mr. Laurence had recommended as lively reading, would put him in a better mood. His shaggy eyebrows relaxed a little as he rolled the library steps toward the shelf that held the books. Jo skipped up and sat on the top step. She pretended to search, but all the while she was wondering how to introduce the dangerous subject that had brought her there. Mr. Laurence seemed to suspect that something was brewing in her mind. He took several brisk turns around the room. Then he faced her so suddenly and spoke so abruptly that her copy of Rasselas tumbled face down onto the floor.
        - id: ch01-b110
          speaker: mr_laurence
          text: What has that boy done? Don't protect him. I know he got into mischief from the way he behaved when he came home. He won't tell me a word. When I threatened to shake the truth out of him, he ran upstairs and locked his door.
          emotion: angry
        - id: ch01-b111
          speaker: jo
          text: He did something wrong, but we forgave him. We all promised not to tell anyone.
        - id: ch01-b112
          speaker: mr_laurence
          text: That won't do. He cannot hide behind a promise to you softhearted girls. If he misbehaved, he will confess, apologize, and take his punishment. Tell me, Jo. I won't be kept in the dark.
          emotion: angry
        - id: ch01-b113
          speaker: narrator
          text: Mr. Laurence looked so fierce and spoke so sharply that Jo would gladly have escaped. But she was perched high on the steps, and he blocked the way like a lion, so she stayed and faced him.
        - id: ch01-b114
          speaker: jo
          text: I truly can't tell you, sir. Mother forbade it. Laurie confessed, apologized, and has been punished enough. We're not keeping silent to protect him. We're protecting someone else, and you'll only cause more trouble if you interfere. Please don't. Part of it was my fault, but everything is settled now. Let's forget it and talk about the Rambler, or anything pleasant.
        - id: ch01-b115
          speaker: mr_laurence
          text: Hang the Rambler! Come down here and promise me that wild boy hasn't been ungrateful or rude after all your family's kindness. If he has, I'll thrash him myself.
          emotion: angry
        - id: ch01-b116
          speaker: narrator
          text: The threat sounded terrible, but Jo knew the hot-tempered old gentleman would never strike his grandson. She climbed down and made the prank sound as small as she could without betraying Meg or twisting the truth.
        - id: ch01-b117
          speaker: mr_laurence
          text: Hmm. Well. If he kept quiet because he gave his word, and not because he was stubborn, I'll forgive him. He is a stubborn fellow. Hard to manage.
        - id: ch01-b118
          speaker: narrator
          text: Mr. Laurence rubbed his hair until it looked windblown, and relief smoothed the frown from his face.
        - id: ch01-b119
          speaker: jo
          text: So am I. But one kind word can manage me when all the king's horses and all the king's men cannot.
        - id: ch01-b120
          speaker: mr_laurence
          text: You think I'm unkind to him, do you?
        - id: ch01-b121
          speaker: jo
          text: Oh, no, sir. Sometimes you're a little too kind. Then, when he tests your patience, you're just a little too quick. Don't you think so?
        - id: ch01-b122
          speaker: narrator
          text: Jo had decided to say it plainly, though she trembled after such a bold speech. To her relief, Mr. Laurence only tossed his glasses onto the table with a clatter.
        - id: ch01-b123
          speaker: mr_laurence
          text: You're right, girl. I am! I love the boy, but he tries my patience beyond endurance. And I know how this will end if we keep on this way.
        - id: ch01-b124
          speaker: jo
          text: I'll tell you how. He'll run away.
        - id: ch01-b125
          speaker: narrator
          text: Jo regretted the words the instant they were out. She had only meant to warn him that Laurie could not bear too much restraint and that a gentler hand might work better. But Mr. Laurence's ruddy face changed at once. He sat down and looked uneasily at the portrait above his table. It showed Laurie's handsome father, who had run away in his youth and married against the commanding old man's wishes. Jo imagined that Mr. Laurence was remembering the past and regretting it. She wished with all her heart that she had kept quiet.
        - id: ch01-b126
          speaker: jo
          text: He won't do it unless someone worries him terribly. He only threatens sometimes when he's tired of studying. I often think I'd like to run away too, especially since my hair was cut. If we both disappear, advertise for two boys and search the ships sailing for India.
        - id: ch01-b127
          speaker: narrator
          text: Jo laughed, and Mr. Laurence looked relieved. Plainly, he decided she had been joking.
        - id: ch01-b128
          speaker: mr_laurence
          text: You rascal! How dare you talk like that? What happened to your respect for me and your proper upbringing? Bless all these boys and girls. They torment us, but we can't live without them.
        - id: ch01-b129
          speaker: narrator
          text: He pinched her cheeks good-naturedly.
        - id: ch01-b130
          speaker: mr_laurence
          text: Go bring that boy down to dinner. Tell him everything is settled, and advise him not to act out a tragedy for his grandfather. I won't tolerate it.
        - id: ch01-b131
          speaker: jo
          text: He won't come, sir. His feelings are hurt because you didn't believe him when he said he couldn't tell you. I think the shaking hurt him most of all.
        - id: ch01-b132
          speaker: narrator
          text: Jo tried to look pitiful, but Mr. Laurence laughed instead. She knew she had won.
        - id: ch01-b133
          speaker: mr_laurence
          text: I'm sorry for that. I suppose I should thank him for not shaking me in return. What in the world does the fellow expect?
        - id: ch01-b134
          speaker: narrator
          text: The old gentleman looked a little ashamed of his temper.
        - id: ch01-b135
          speaker: jo
          text: If I were you, sir, I'd write him an apology. He says he won't come down without one. He's talking about Washington and carrying on absurdly. A formal apology will show him how foolish he looks and bring him down in a pleasant mood. Try it. He likes a joke, and this will work better than talking. I'll deliver it and teach him his duty.
        - id: ch01-b136
          speaker: narrator
          text: Mr. Laurence studied her sharply, then put on his glasses.
        - id: ch01-b137
          speaker: mr_laurence
          text: You're a sly little creature. Still, I don't mind letting you and Beth manage me. Give me some paper, and let's finish this nonsense.
        - id: ch01-b138
          speaker: narrator
          text: Mr. Laurence wrote the note in the grand, formal language one gentleman might use to another after offering a deep insult. Jo dropped a kiss on the top of his bald head and ran upstairs with it. She slipped the apology under Laurie's door. Through the keyhole, she advised him to be humble and dignified, along with several other agreeable things that were quite impossible for him.
        - id: ch01-b139
          speaker: narrator
          text: The door was locked again, so Jo left the note and started quietly away. Then Laurie slid down the banister and waited for her at the bottom, wearing his most virtuous expression.
        - id: ch01-b140
          speaker: laurie
          text: What a good friend you are, Jo! Did he tear you to pieces?
        - id: ch01-b141
          speaker: narrator
          text: Laurie laughed.
        - id: ch01-b142
          speaker: jo
          text: No. All things considered, he was fairly gentle.
        - id: ch01-b143
          speaker: laurie
          text: Well, everyone tore into me. Even you turned against me over at your house. I felt ready to go straight to the devil.
        - id: ch01-b144
          speaker: jo
          text: Don't talk like that. Turn over a new leaf and start again, Teddy, my boy.
        - id: ch01-b145
          speaker: laurie
          text: I keep turning over new leaves and ruining them, just like my old copybooks. I make so many fresh starts that I'll never reach the end.
          emotion: sad
        - id: ch01-b146
          speaker: jo
          text: Go eat your dinner. You'll feel better afterward. Men always predict disaster when they're hungry.
        - id: ch01-b147
          speaker: narrator
          text: Jo whisked out the front door.
        - id: ch01-b148
          speaker: laurie
          text: That's a "label" on my "sect."
        - id: ch01-b149
          speaker: narrator
          text: Laurie was quoting Amy as he went dutifully to eat humble pie with his grandfather. For the rest of the day, Mr. Laurence behaved like a saint and treated him with overwhelming respect.
        - id: ch01-b150
          speaker: narrator
          text: Everyone believed the trouble was finished and the little cloud had blown away. But the mischief had already done its work. The others soon forgot the whole affair, while Meg remembered. She never once mentioned a certain person. Still, she thought about him a great deal, and she dreamed her private dreams more often than ever.
        - id: ch01-b151
          speaker: narrator
          text: One day, Jo searched Meg's desk for stamps and found a scrap of paper covered with the words "Mrs. John Brooke." She groaned tragically and threw it into the fire. Laurie's prank, she felt, had brought the dreaded day closer.
