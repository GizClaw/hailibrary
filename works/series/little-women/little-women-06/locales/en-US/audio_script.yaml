  chapters:
    - id: ch01
      title: Beth Finds the Palace Beautiful
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The great house really did become a Palace Beautiful, though it took the March girls a while to feel at home there. Beth had the hardest time getting past the lions that seemed to guard it. The largest lion was old Mr. Laurence himself. But after he came to call, found something kind or funny to say to every girl, and talked with Marmee about earlier days, no one feared him much anymore. No one except timid Beth.
        - id: ch01-b02
          speaker: narrator
          text: The other lion was the difference between the two families. The Marches were poor, while Laurie was rich, and the girls felt shy about accepting favors they could never repay. Before long, though, they understood that Laurie thought they were helping him. He was grateful for Marmee's motherly welcome, the girls' cheerful company, and the comfort he found in their modest home. Soon everyone forgot their pride. They traded kindness for kindness without asking who had given more.
        - id: ch01-b03
          speaker: narrator
          text: Pleasant things began happening all the time, because the new friendship grew like grass in spring. Everyone liked Laurie. In private, he told his tutor that the March girls were truly splendid. The girls eagerly drew the lonely boy into their circle and made a great deal of him. Laurie had never known a mother or sisters, and their openhearted companionship charmed him. Their lively, useful days even made him ashamed of his own idle habits.
        - id: ch01-b04
          speaker: narrator
          text: Books had begun to bore him. People seemed much more interesting now, so Mr. Brooke had to give very poor reports. Laurie was forever skipping lessons and running over to the March house. His grandfather wasn't troubled by it.
        - id: ch01-b05
          speaker: mr_laurence
          text: Let the boy have a vacation. He can catch up afterward. The good woman next door believes he studies too hard and needs exercise, amusement, and young company. I expect she's right. I've been fussing over him like an old grandmother. As long as he's happy, let him please himself. He won't find any mischief in that little nunnery, and Mrs. March is doing him more good than we can.
        - id: ch01-b06
          speaker: narrator
          text: And what happy times they had. They put on plays and tableaux. They went for sleigh rides and skated together. Some evenings they gathered in the old March parlor, and now and then the grand house held a bright little party. Meg could wander through the conservatory and enjoy all the flowers she wished. Jo devoured books in the new library and made Mr. Laurence shake with laughter over her opinions. Amy copied pictures and filled her eyes with beautiful things. Laurie played lord of the manor with perfect delight.
        - id: ch01-b07
          speaker: narrator
          text: Only Beth stayed away. She longed to play the grand piano, but she couldn't make herself enter what Meg called the Mansion of Bliss. Once she went there with Jo. Mr. Laurence didn't understand how shy she was. He stared beneath his heavy eyebrows and gave such a loud "Hey!" that Beth's feet shook against the floor. She never told Marmee about it. She simply ran home and said she would never return, not even for the beloved piano.
        - id: ch01-b08
          speaker: narrator
          text: No amount of coaxing or tempting could change her mind. Then somehow Mr. Laurence heard about her fear, and he quietly set out to mend things. During one of his short visits, he turned the talk toward music. He spoke of great singers he had seen and magnificent organs he had heard. His stories were so delightful that Beth couldn't remain in her far corner. Little by little, she crept closer.
        - id: ch01-b09
          speaker: narrator
          text: At last she stopped behind his chair. Her wide eyes shone, and excitement colored her cheeks. Mr. Laurence acted as though she were no more noticeable than a fly. He went on talking about Laurie's music teachers and lessons. Then, as if a new thought had just come to him, he addressed Marmee.
        - id: ch01-b10
          speaker: mr_laurence
          text: The boy hardly touches his music now, and I'm glad of it. He was getting much too wrapped up in it. Still, the piano is suffering from neglect. Perhaps one of your girls would come over now and then and practice. Merely to keep it in tune, you understand.
        - id: ch01-b11
          speaker: narrator
          text: Beth stepped forward. She clasped her hands tightly so she wouldn't clap. The chance to practice on that splendid instrument was almost more than she could bear, and the very thought took away her breath. Before Marmee could answer, Mr. Laurence gave an odd little nod and smile and continued.
        - id: ch01-b12
          speaker: mr_laurence
          text: They wouldn't need to meet or speak to anyone. They could come in whenever they liked. My study is shut away at the far end of the house. Laurie is often out, and after nine in the morning, the servants never go near the drawing room.
        - id: ch01-b13
          speaker: narrator
          text: He stood as if he meant to leave. That final promise made everything perfect, and Beth decided she had to speak.
        - id: ch01-b14
          speaker: mr_laurence
          text: Please give the young ladies my invitation. If they aren't interested, it doesn't matter.
        - id: ch01-b15
          speaker: narrator
          text: A small hand slipped into his. Beth looked up with gratitude filling her face.
        - id: ch01-b16
          speaker: beth
          text: Oh, sir, they are interested. They care very, very much!
        - id: ch01-b17
          speaker: mr_laurence
          text: Are you the one who loves music?
        - id: ch01-b18
          speaker: narrator
          text: This time there was no frightening shout. He looked down at her kindly.
        - id: ch01-b19
          speaker: beth
          text: I'm Beth, and I dearly love music. I'll come if you're certain no one will hear me or be bothered. I wouldn't want to be rude.
        - id: ch01-b20
          speaker: narrator
          text: Her voice trembled at its own boldness.
        - id: ch01-b21
          speaker: mr_laurence
          text: Not one soul will mind, my dear. The house stands empty half the day. Come pound away as much as you please, and I'll be grateful to you.
        - id: ch01-b22
          speaker: beth
          text: Oh, sir, that's so kind of you!
        - id: ch01-b23
          speaker: narrator
          text: Under his friendly gaze, Beth blushed as pink as a rose, but she was no longer frightened. Words couldn't express her thanks for this precious gift, so she squeezed his hand. Mr. Laurence gently brushed the hair away from her forehead. Then he bent and kissed her, speaking in a voice that very few people ever heard.
        - id: ch01-b24
          speaker: mr_laurence
          text: I once had a little girl whose eyes were like yours. God bless you, my dear. Good day, madam.
        - id: ch01-b25
          speaker: narrator
          text: Then he hurried away.
    - id: ch02
      title: Music Behind the Hedge
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Beth poured out her happiness to Marmee. Then she rushed upstairs to share the glorious news with the household of invalid dolls, since her sisters were away. She sang so joyfully that evening that everyone laughed. In the night, she even woke Amy by playing an imaginary piano across her sister's face.
        - id: ch02-b02
          speaker: narrator
          text: The next day, Beth watched until both Mr. Laurence and Laurie had left the house. She started toward the side door, lost her courage, and retreated. She tried again, then backed away once more. After two or three attempts, she finally made it inside. Quiet as a mouse, she found her way to the drawing room where her idol waited.
        - id: ch02-b03
          speaker: narrator
          text: By the purest accident, of course, some easy and lovely music had been left on the piano. Beth's fingers trembled. She kept stopping to listen and glance around. At last she touched the grand instrument. At once, her fear and even her awareness of herself disappeared. Nothing remained but the joy of the music. It spoke to her like the voice of a beloved friend.
        - id: ch02-b04
          speaker: narrator
          text: Beth stayed until Hannah came to fetch her for dinner. She couldn't eat a bite. She only sat smiling at everyone, perfectly happy.
        - id: ch02-b05
          speaker: narrator
          text: After that, a little brown hood slipped through the hedge almost every day. A spirit filled the great drawing room with music, coming and going without being seen. Beth never knew that Mr. Laurence opened his study door to listen to the old-fashioned tunes he loved. She never saw Laurie standing guard in the hall to keep the servants away.
        - id: ch02-b06
          speaker: narrator
          text: Nor did she guess that the exercise books and new songs appearing in the music rack had been placed there especially for her. When Laurie spoke with her about music at home, she simply thought he was kind to tell her so many helpful things. Beth's wish had come true exactly as she had hoped, which doesn't always happen. Maybe her deep gratitude for that blessing helped bring her an even greater one. In any case, she deserved them both.
        - id: ch02-b07
          speaker: beth
          text: Marmee, I want to make Mr. Laurence a pair of slippers. He's been so good to me that I have to thank him, and I can't think of any other way. May I?
        - id: ch02-b08
          speaker: narrator
          text: Several weeks had passed since his important visit. Marmee was especially glad to grant Beth's request, because Beth so rarely asked for anything of her own.
        - id: ch02-b09
          speaker: marmee
          text: Of course, dear. It will please him very much, and it's a lovely way to thank him. Your sisters can help, and I'll pay to have the slippers finished.
        - id: ch02-b10
          speaker: narrator
          text: Beth held several very serious discussions with Meg and Jo. Together they chose the pattern and bought the materials. On a dark purple background, Beth would sew a cluster of pansies that looked solemn but cheerful. Everyone agreed it was both pretty and exactly right.
        - id: ch02-b11
          speaker: narrator
          text: Beth worked early and late. Now and then, someone helped her over a difficult part. She was quick and skillful with a needle, and the slippers were done before anyone could grow tired of them. Beth added a short, simple note. Then Laurie helped her secretly place the gift on Mr. Laurence's study table one morning before the old gentleman woke.
        - id: ch02-b12
          speaker: narrator
          text: Once the excitement of delivering them was over, Beth waited. All that day passed, and part of the next one too, without a word of thanks. She began to worry that her touchy old friend might have taken offense.
    - id: ch03
      title: The Little Piano
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On the second afternoon, Beth went out on an errand. Poor Joanna, her invalid doll, came along for her daily exercise. As Beth returned up the street, she saw three heads appear at the parlor windows. No, there were four. They popped in and out, and the instant they noticed her, hands began waving and several delighted voices called together.
        - id: ch03-b02
          speakers: [meg, jo, amy, hannah]
          ensemble: chorus
          text: There's a letter from the old gentleman! Hurry and read it!
          emotion: happy
        - id: ch03-b03
          speaker: amy
          text: Oh, Beth, he sent you—
          emotion: happy
        - id: ch03-b04
          speaker: narrator
          text: Amy waved so wildly that she looked quite improper, but Jo stopped her by slamming down the window before she could finish.
        - id: ch03-b05
          speaker: narrator
          text: Beth hurried home, trembling with suspense. At the door, her sisters seized her and carried her into the parlor like a hero in a parade. Everyone pointed and spoke at once.
        - id: ch03-b06
          speakers: [meg, jo, amy]
          ensemble: chorus
          text: Look over there! Look!
          emotion: happy
        - id: ch03-b07
          speaker: narrator
          text: Beth looked. Her face went pale with joy and astonishment. A small cabinet piano stood in the room. On its shining lid lay a letter addressed in enormous writing to Miss Elizabeth March.
        - id: ch03-b08
          speaker: beth
          text: Is it really for me?
          emotion: surprised
        - id: ch03-b09
          speaker: narrator
          text: Beth clung to Jo, afraid she might fall. It was all too wonderful to take in.
        - id: ch03-b10
          speaker: jo
          text: Every bit of it is yours, my precious! Wasn't that splendid of him? Isn't he the dearest old gentleman alive? The key is inside the letter. We didn't open it, though we're nearly dying to hear what he wrote.
          emotion: happy
        - id: ch03-b11
          speaker: narrator
          text: Jo hugged Beth and held out the note.
        - id: ch03-b12
          speaker: beth
          text: You read it. I can't. I feel so strange. Oh, it's far too lovely!
          emotion: surprised
        - id: ch03-b13
          speaker: narrator
          text: Completely overcome by the gift, Beth hid her face in Jo's apron. Jo unfolded the paper. The first words made her laugh.
        - id: ch03-b14
          speaker: jo
          text: Miss March. Dear Madam—
        - id: ch03-b15
          speaker: amy
          text: That sounds so elegant! I wish someone would begin a letter to me that way.
        - id: ch03-b16
          speaker: narrator
          text: Amy thought the old-fashioned greeting was very grand. Jo continued reading.
        - id: ch03-b17
          speaker: jo
          text: I've owned many pairs of slippers, but none has ever suited me as well as yours. Heart's-ease is my favorite flower, and these will always make me think of the gentle person who gave them. I prefer to repay what I owe, so I hope you'll permit the old gentleman to send you something that once belonged to the little granddaughter he lost. With warm thanks and every good wish, I remain your grateful friend and humble servant, James Laurence.
        - id: ch03-b18
          speaker: jo
          text: There, Beth! That's an honor you can be proud of. Laurie told me how dearly Mr. Laurence loved the child who died and how carefully he saved all her little belongings. Just imagine. He has given you her piano. That's what comes of having big blue eyes and loving music.
        - id: ch03-b19
          speaker: narrator
          text: Jo tried to settle Beth, who was trembling and more excited than her sisters had ever seen her.
        - id: ch03-b20
          speaker: meg
          text: Look at the sweet little holders for the candles. And here's the green silk, gathered around a gold rose. The music rack and stool are here too. It has everything.
        - id: ch03-b21
          speaker: narrator
          text: Meg opened the instrument and showed off every beautiful part.
        - id: ch03-b22
          speaker: amy
          text: Your humble servant, James Laurence. Imagine him writing that to you! I'm going to tell the girls. They'll say it's magnificent.
        - id: ch03-b23
          speaker: hannah
          text: Go on, honey, play it. Let's hear what that little pianny sounds like.
        - id: ch03-b24
          speaker: narrator
          text: Hannah always shared the family's joys as fully as their sorrows. Beth sat down and tried the piano. Everyone agreed it was the most extraordinary instrument they had ever heard. It had clearly been tuned and put into perfect order. Yet even with all its beauty, its greatest charm was Beth's radiant face bending over it while her fingers lovingly touched the black and white keys and pressed the shining pedals.
        - id: ch03-b25
          speaker: jo
          text: Now you'll have to go thank him.
        - id: ch03-b26
          speaker: narrator
          text: Jo meant it as a joke. She never dreamed Beth would truly go.
        - id: ch03-b27
          speaker: beth
          text: Yes, I will. I'll go this minute, before thinking about it makes me afraid.
        - id: ch03-b28
          speaker: narrator
          text: To the complete amazement of the family, Beth walked straight down the garden, passed through the hedge, and entered the Laurences' door.
        - id: ch03-b29
          speaker: hannah
          text: Well, I declare, that's the strangest sight I ever saw! That pianny has turned her head. She never would've gone over there in her right mind!
          emotion: surprised
        - id: ch03-b30
          speaker: narrator
          text: Hannah stared after her. The girls were too astonished to say a word. And if they had seen what Beth did next, they would have been more amazed still.
        - id: ch03-b31
          speaker: narrator
          text: Believe it or not, Beth went directly to the study and knocked before she had time to lose her nerve. A rough voice called for her to enter. She obeyed and walked right up to Mr. Laurence. He looked thoroughly startled. Beth held out her hand, and though her voice shook just a little, she began her carefully prepared thanks.
        - id: ch03-b32
          speaker: beth
          text: I came to thank you, sir, for—
        - id: ch03-b33
          speaker: narrator
          text: She couldn't finish. Mr. Laurence looked so friendly that her speech vanished from her mind. All she remembered was that he had lost a little girl he loved. Beth threw both arms around his neck and kissed him.
        - id: ch03-b34
          speaker: narrator
          text: The roof could have flown off the house and surprised Mr. Laurence no more. But he liked that kiss. Oh, he liked it enormously. He was so pleased and touched by Beth's trust that every bit of his hard outer manner disappeared. He lifted her onto his knee and rested his wrinkled cheek against her rosy one. For a moment, it felt as though his own little granddaughter had come back to him.
        - id: ch03-b35
          speaker: narrator
          text: From then on, Beth wasn't afraid of him. She sat talking with him as comfortably as if she had known him forever. Love had driven out fear, and gratitude had overcome pride.
        - id: ch03-b36
          speaker: narrator
          text: When Beth went home, Mr. Laurence escorted her all the way to her gate. He shook her hand warmly, touched his hat, and marched back looking tall and dignified. He truly was a handsome, soldierly old gentleman.
        - id: ch03-b37
          speaker: narrator
          text: The girls watched the whole performance. Jo danced a jig to show her delight. Amy nearly toppled through the window in surprise. Meg lifted both hands and cried out.
        - id: ch03-b38
          speaker: meg
          text: Well, now I truly believe the world must be ending!
          emotion: surprised
