audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机智，像在炉边从容讲述旧日家事
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情绪来得快，带一点男孩子气
        timbre: 明亮略带沙哑
        pace: 偏快
        pitch: 中低
    meg:
      display_name: 梅格
      tts:
        delivery: 温柔端庄，常带大姐姐式的认真
        timbre: 柔和圆润
        pace: 适中
        pitch: 中
    beth:
      display_name: 贝丝
      tts:
        delivery: 羞怯安静，话语真诚而体贴
        timbre: 轻柔温暖
        pace: 稍慢
        pitch: 中高
    amy:
      display_name: 艾米
      tts:
        delivery: 一本正经又有些自负，努力显得优雅
        timbre: 清脆稚嫩
        pace: 适中
        pitch: 偏高
    mrs_march:
      display_name: 马奇太太
      tts:
        delivery: 慈爱爽朗，沉稳中带着鼓励
        timbre: 饱满温暖
        pace: 从容
        pitch: 中低
    hannah:
      display_name: 汉娜
      tts:
        delivery: 朴实爽快，带着操持家务多年的亲昵
        timbre: 粗朴温厚
        pace: 适中
        pitch: 中低
    laurie:
      display_name: 劳里
      tts:
        delivery: 彬彬有礼而略显腼腆，熟悉以后轻松风趣
        timbre: 清朗温和
        pace: 适中
        pitch: 中
    mr_laurence:
      display_name: 劳伦斯先生
      tts:
        delivery: 严肃直接，善意藏在简短的话里
        timbre: 低沉浑厚
        pace: 从容
        pitch: 低
  chapters:
    - id: ch01
      title: 美丽宫殿的两头狮子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那座大宅果然成了美丽宫殿，只是姑娘们花了些日子，才一个个走进去。门口仿佛守着两头狮子。第一头是老劳伦斯先生。可他来马奇家做过客，对每个姑娘都说了亲切有趣的话，还同马奇太太谈起往事，大家也就不怎么怕他了，只有贝丝依旧羞怯。第二头狮子，是两家的贫富差别。马奇姐妹怕受了好意却还不起。后来她们才明白，劳里反倒把她们当恩人。他感激马奇太太像母亲一样待他，也喜欢姐妹们的陪伴和这个朴素家庭的温暖。于是大家不再计较谁给得更多，只管彼此关心。
        - id: ch01-b02
          speaker: narrator
          text: 新友谊像春草一样长起来。人人都喜欢劳里，他也私下告诉家庭教师，马奇家的姑娘个个棒极了。姑娘们带着年轻人特有的热情，把这个孤单的男孩拉进自己的小天地，处处关心他，热热闹闹地宠着他。劳里从没尝过母亲和姐妹带来的温情，也觉得这些心地单纯的姑娘有一种动人的可爱，很快就受了她们感染。看着姑娘们整日忙碌，他也为自己从前的懒散脸红。书本忽然没那么有趣了，他总逃课往马奇家跑，害得布鲁克先生交出的学业报告越来越糟。
        - id: ch01-b03
          speaker: mr_laurence
          text: “没关系，让他先放个假，以后再补。隔壁那位好太太说，他用功太狠，该和年轻人作伴，也该玩一玩、动一动。我看她说得对。过去我把这孩子宠得太过，简直像个老祖母。只要他快活，就随他去吧。对面那座小修道院里闯不出祸。马奇太太能为他做的，比我们更多。”
        - id: ch01-b04
          speaker: narrator
          text: 那段日子可真快活。年轻人一起演戏、摆活人画、坐雪橇、滑冰，又在马奇家的老客厅里度过许多愉快的夜晚，偶尔还去大宅办一场热闹的小宴会。梅格随时都能去逛温室，看个够，再抱回一束束鲜花。乔扑进新藏书室，如饥似渴地一本本读下去，还用自己的评论逗得老先生大笑。艾米临摹画作，把身边种种美丽尽情欣赏个够。劳里呢，把庄园主人做得又周到又有趣。
        - id: ch01-b05
          speaker: narrator
          text: 只有贝丝还进不了梅格所说的那座幸福大厦。她那么想弹那架大钢琴，却怕得不敢上门。她跟乔去过一次。老先生不知道她怕生，浓眉下的眼睛直盯着她，还猛地喊了一声“喂！”贝丝吓得两脚直打战，连母亲也没告诉，逃回家以后只说，再喜欢钢琴也绝不去了。谁劝都没用，拿什么诱惑她也不行。后来，劳伦斯先生不知从哪里听说了这件事，便悄悄想了个办法。
        - id: ch01-b06
          speaker: narrator
          text: 他来马奇家小坐时，故意谈起音乐。他说自己见过哪些著名歌唱家，听过哪些优美的管风琴，还讲了不少动人的趣事。贝丝本来缩在远处的墙角，听着听着，竟像着了迷，一点点挪到他的椅背后。她睁大眼睛，脸也兴奋得通红。老先生只当没看见她，仍然说着劳里的音乐课和老师，过了一会儿，才像刚想到似的开口。
        - id: ch01-b07
          speaker: mr_laurence
          text: “劳里现在不肯好好学音乐，我倒很高兴。他以前太入迷了。可是钢琴一直没人弹，也会坏掉。您家的姑娘有没有谁肯偶尔过去练练？就当帮它保住音准吧，太太。”
        - id: ch01-b08
          speaker: narrator
          text: 贝丝往前迈了一步，双手握得紧紧的，才忍住没拍掌。在那架华美的钢琴上练习，这个念头叫她几乎喘不过气。马奇太太还没回答，老先生又笑着补充。
        - id: ch01-b09
          speaker: mr_laurence
          text: “她们不用见人，也不必跟谁说话，想什么时候进去都行。我关在宅子另一头的书房，劳里常常出门。过了九点，仆人也不会到客厅去。”
        - id: ch01-b10
          speaker: narrator
          text: 说完，他站起来准备告辞。这样周到的安排，贝丝再也挑不出一丝可怕的地方。老先生只说，请马奇太太把话带给小姐们，她们不愿意来也没关系。忽然，一只小手滑进了他的手里。
        - id: ch01-b11
          speaker: beth
          text: “先生，她们愿意来的，真的非常、非常愿意！”
          emotion: happy
        - id: ch01-b12
          speaker: mr_laurence
          text: “你就是爱音乐的那个姑娘？”
        - id: ch01-b13
          speaker: narrator
          text: 这一次，他低头看贝丝时十分和善，也没有大声喊“喂”。
        - id: ch01-b14
          speaker: beth
          text: “我是贝丝。我特别喜欢音乐。如果您能确定没有人听见，也不会打扰谁，我就过去。”
        - id: ch01-b15
          speaker: narrator
          text: 贝丝怕自己失礼，说出这么大胆的话时，浑身都在发抖。
        - id: ch01-b16
          speaker: mr_laurence
          text: “一个人也不会听见，亲爱的。这宅子有半天都是空的。你尽管来，爱怎么弹就怎么弹，我还得谢谢你。”
        - id: ch01-b17
          speaker: beth
          text: “先生，您真好！”
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: 贝丝红得像玫瑰，却已经不怕了。她说不出更多感谢的话，只能轻轻握了握他的手。老先生抚开她额前的头发，弯下腰吻了她。他的声音温柔得几乎没有人听过。
        - id: ch01-b19
          speaker: mr_laurence
          text: “我从前也有个小姑娘，眼睛和你的一样。愿上帝保佑你，亲爱的。再会，太太。”
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: 话一说完，他就急匆匆地走了。
    - id: ch02
      title: 会奏乐的小精灵
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 贝丝先同母亲欢喜了一场，又飞奔上楼，把这个天大的好消息告诉那一家子生病的娃娃，因为姐妹们都不在家。那晚她唱得格外轻快。夜里睡着了，她甚至把艾米的脸当成琴键，在上面弹起钢琴，把艾米生生弄醒，惹得全家直笑。
        - id: ch02-b02
          speaker: narrator
          text: 第二天，贝丝亲眼看着老先生和劳里都出了门。她来到大宅门前，退回去两三次，终于鼓足勇气从侧门溜进去，像小老鼠一样悄无声息地摸进客厅。她心爱的钢琴就在那里。说来也真巧，琴上正放着几页优美又简单的乐谱。贝丝伸出发颤的手指，弹几下便停下来听听动静，再不放心地看看四周。可她一旦真正碰到那架大钢琴，立刻忘了恐惧，也忘了自己和周围的一切。世上只剩音乐带来的、说不出来的喜悦，那琴声像挚友的声音一样亲切。
        - id: ch02-b03
          speaker: narrator
          text: 她一直弹到汉娜来叫她回家吃饭。可贝丝哪还有胃口，只会坐在那里，幸福地朝每个人微笑。
        - id: ch02-b04
          speaker: narrator
          text: 此后，那顶棕色小风帽几乎天天穿过树篱。大客厅里像住进一个会奏乐的小精灵，来时没人看见，走时也没人知道。贝丝不知道老先生会悄悄打开书房门，专听那些合他心意的古老曲子。她也没看见劳里守在门厅，替她把仆人远远拦开。谱架上出现的新歌和练习曲，她更想不到都是专门为她放的。劳里到她家谈起音乐，她只觉得他真亲切，肯告诉自己那么多有用的事。
        - id: ch02-b05
          speaker: narrator
          text: 贝丝尽情享受这份快乐。愿望真的实现以后，竟和她盼望的一模一样，这可不是常有的事。也许因为她如此感恩，另一份更大的礼物才来到她面前。无论如何，两份礼物她都配得上。
        - id: ch02-b06
          speaker: beth
          text: “妈妈，我想给劳伦斯先生做一双拖鞋。他对我太好了，我一定得谢谢他，可我想不到别的办法。我能做吗？”
        - id: ch02-b07
          speaker: narrator
          text: 那是老先生来访几个星期后的事。贝丝很少为自己开口求什么，所以母亲答应她的请求时，总会格外开心。
        - id: ch02-b08
          speaker: mrs_march
          text: “当然能，亲爱的。他一定会很高兴，这也是很好的谢礼。姐妹们帮你做，我来付最后缝制的钱。”
        - id: ch02-b09
          speaker: narrator
          text: 贝丝同梅格和乔认真商量了好几回，终于选好图样，买来材料，动手做起拖鞋。她们决定在深紫色的底子上绣一簇三色堇，花朵端庄又明亮，大家都说再合适不过。贝丝针线活儿又快又灵巧，从早到晚不停地做，碰到难处才请姐妹帮一下。没等谁感到厌烦，拖鞋已经完工。她又写了一封简短朴实的信，请劳里帮忙，趁老先生一天早晨还没起床，偷偷把礼物放上书房的桌子。
    - id: ch03
      title: 一架小钢琴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 送出礼物的兴奋过去，贝丝便等着看会有什么回音。整整一天过去了，第二天也过了大半，什么都没有。她渐渐担心，那双拖鞋是不是得罪了脾气古怪的老朋友。那天下午，她出去办事，还带上可怜的病娃娃乔安娜，让它照例做每天的活动。回家时，她刚走到街上，远远看见客厅窗口探出三个脑袋。不对，是四个。大家一看见她，好几只手立刻挥起来，几个快活的声音一齐喊。
        - id: ch03-b02
          speaker: jo
          text: “老先生给你来信了！快回来，快来念！”
          emotion: happy
        - id: ch03-b03
          speaker: amy
          text: “贝丝，他送给你一……”
          emotion: happy
        - id: ch03-b04
          speaker: narrator
          text: 艾米激动得手舞足蹈，可还没说完，乔已经砰地关上窗，把她堵了回去。贝丝心里怦怦直跳，赶紧回家。姐妹们在门口抓住她，像迎接凯旋的人一样把她簇拥进客厅。每个人都指着同一个地方，催她快看。那里立着一架小巧的立式钢琴。光亮的琴盖上放着一封信，收信人的名字写得像招牌那么醒目，伊丽莎白·马奇小姐。贝丝一看，惊喜得脸都白了。
        - id: ch03-b05
          speaker: beth
          text: “这是给我的？”
          emotion: surprised
        - id: ch03-b06
          speaker: narrator
          text: 她抓紧乔，仿佛随时会倒下。眼前这一切，实在叫她承受不住。
        - id: ch03-b07
          speaker: jo
          text: “对，全是给你的，我的宝贝！老先生多么了不起！你不觉得他是世上最可爱的人吗？钥匙就在信里。我们都没拆，可我们快急死了，真想知道他写了什么。”
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: 乔抱住妹妹，把信递给她。
        - id: ch03-b09
          speaker: beth
          text: “你替我念吧！我念不了，心里怪得很。啊，这礼物太美好了！”
          emotion: happy
        - id: ch03-b10
          speaker: narrator
          text: 贝丝把脸藏进乔的围裙，整个人都被这份礼物搅乱了。乔展开信纸，一看开头就笑了。
        - id: ch03-b11
          speaker: jo
          text: “开头是，马奇小姐，尊敬的女士。”
        - id: ch03-b12
          speaker: amy
          text: “听起来真气派！要是也有人这样给我写信就好了。”
        - id: ch03-b13
          speaker: narrator
          text: 艾米觉得这种老派称呼优雅极了。乔接着往下念。
        - id: ch03-b14
          speaker: jo
          text: “我一生穿过许多双拖鞋，却没有一双像您做的这样合心意。三色堇是我最喜爱的花，这双鞋会让我永远想起温柔的赠礼人。我喜欢偿还欠下的人情，所以我相信，您会允许那位老先生送您一件东西。它从前属于我失去的小孙女。谨致衷心谢意和最美好的祝愿。您的感恩之友及谦卑仆人，詹姆斯·劳伦斯。”
        - id: ch03-b15
          speaker: jo
          text: “贝丝，这份荣誉真值得骄傲！劳里告诉过我，老先生从前多疼爱那个去世的孩子，又怎样小心保存她的东西。想想看，他把她的钢琴送给你了。谁叫你有一双蓝色大眼睛，又那么爱音乐呢。”
        - id: ch03-b16
          speaker: narrator
          text: 乔想让贝丝平静下来，可贝丝还在发抖，从来没有这样激动过。梅格掀开琴盖，把这件礼物的美妙之处一样样指给她看。琴上有精巧的烛架，有打着细褶的绿绸，绸子中央还缀着一朵金玫瑰，就连漂亮的谱架和琴凳也样样齐全。
        - id: ch03-b17
          speaker: amy
          text: “您的谦卑仆人，詹姆斯·劳伦斯。想想，他竟这样写给你！我要告诉别的姑娘，她们一定羡慕极了。”
        - id: ch03-b18
          speaker: hannah
          text: “试试吧，宝贝。让我们听听这架小钢琴的声音。”
        - id: ch03-b19
          speaker: narrator
          text: 这个家的欢乐和悲伤，汉娜总有一份。贝丝试着弹起来以后，大家一致认定，这是她们听过最了不起的钢琴。琴显然刚刚调过音，从里到外也收拾得一尘不染，几乎无可挑剔。不过我想，真正迷人的还是贝丝那张幸福得不能再幸福的脸。她俯在琴前，满怀爱意地触着美丽的黑白琴键，踩下闪亮的踏板。
    - id: ch04
      title: 爱驱走了恐惧
      blocks:
        - id: ch04-b01
          speaker: jo
          text: “你可得亲自去谢谢他。”
        - id: ch04-b02
          speaker: narrator
          text: 乔只是想逗逗妹妹，根本没料到贝丝真的会去。
        - id: ch04-b03
          speaker: beth
          text: “对，我正打算去。就现在去吧，免得多想一会儿，我又害怕了。”
        - id: ch04-b04
          speaker: narrator
          text: 聚在屋里的全家人都惊得说不出话。贝丝却没有犹豫，从容地走下花园，径直穿过两家之间的树篱，走进了劳伦斯家的大门。
        - id: ch04-b05
          speaker: hannah
          text: “哎呀，我要不是亲眼看见，死也不信还有这样的怪事！那架小钢琴把她迷昏头了！神志清醒的时候，她绝不会进去。”
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: 姐妹们也被这个奇迹惊得发不出声。要是她们看到贝丝后来做的事，只怕还会更加吃惊。贝丝没给自己留下思前想后的工夫，径直敲响书房的门。里面一个粗声粗气的嗓音叫她进去。她当真走了进去，一直来到老先生面前。老先生也愣住了。贝丝伸出手，嗓音只有一点点发颤。
        - id: ch04-b07
          speaker: beth
          text: “先生，我是来谢谢您送给我的……”
        - id: ch04-b08
          speaker: narrator
          text: 她没能说完。老先生看起来那么亲切，她忘了预先想好的话，只记得他失去了深爱的小姑娘。于是贝丝伸出双臂，搂住他的脖子，吻了他一下。
        - id: ch04-b09
          speaker: narrator
          text: 就算整座房子的屋顶突然飞走，老先生也不会更加吃惊。可他喜欢这个吻。啊，他喜欢得不得了！那个全心信赖的小小亲吻，让他又感动又欢喜，一身又硬又倔的壳一下全没了。他把贝丝抱到膝上，用布满皱纹的脸颊贴着她红润的小脸，心里仿佛觉得，自己失去的小孙女真的又回到了怀里。
        - id: ch04-b10
          speaker: narrator
          text: 从这一刻起，贝丝再也不怕他了。她安心坐在那里，同他亲密地聊着天，好像两人一辈子都认识。爱能驱走恐惧，感激也能战胜骄傲。贝丝回家时，老先生陪她走到门口，同她热情握手，又碰了碰帽檐，才迈着大步回去。他腰杆挺直，仪态庄严，正是一位英俊而有军人气概的老绅士。
        - id: ch04-b11
          speaker: narrator
          text: 姑娘们在窗口看见这一幕，乔满意得跳起吉格舞，艾米惊讶得差点栽出窗外。梅格高高举起双手，终于叫出了声。
        - id: ch04-b12
          speaker: meg
          text: “好吧，我看这个世界真的快要末日了。”
          emotion: surprised
