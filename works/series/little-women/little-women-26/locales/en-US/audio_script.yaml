  chapters:
    - id: ch01
      title: The Wedding Morning
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Early that June morning, the porch roses opened under a cloudless sky. Their red faces swayed in the wind as if they were excited little neighbors whispering all the news. Some peered through the dining room windows at the waiting feast. Some climbed high enough to nod and smile toward the sisters dressing the bride. Others waved a welcome to everyone hurrying on errands through the garden, porch, and hall. From the fullest red rose to the palest new bud, they offered beauty and perfume to the gentle woman who had loved and cared for them so long.
        - id: ch01-b02
          speaker: narrator
          text: Meg looked like a rose herself. Everything kind and sweet in her seemed to bloom in her face, giving her a charm lovelier than mere beauty. She wanted no silk, lace, or orange blossoms.
        - id: ch01-b03
          speaker: meg
          text: I don't want a fashionable wedding. I only want the people I love around me, and I want them to see me just as I always am.
        - id: ch01-b04
          speaker: narrator
          text: She had sewn her own wedding gown, and with every stitch went the tender hopes and innocent dreams of her girlhood. Her sisters braided and arranged her pretty hair. Her only ornaments were lilies of the valley, because John loved those flowers best of all.
        - id: ch01-b05
          speaker: amy
          text: You look exactly like our own dear Meg, only so sweet and lovely that I'd hug you if I weren't afraid of crushing your dress.
          emotion: happy
        - id: ch01-b06
          speaker: meg
          text: Then I'm satisfied. But all of you must hug and kiss me. Never mind the dress. I want it covered with that kind of wrinkle today.
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: Meg opened her arms, and her sisters clung to her for a moment, smiling through tears. The new love had not changed the old.
        - id: ch01-b08
          speaker: meg
          text: Now I'll tie John's cravat. Then I want a few quiet minutes with Father in the study.
        - id: ch01-b09
          speaker: narrator
          text: She ran downstairs for those little ceremonies, then followed her mother wherever she went. Behind Mrs. March's smiles, Meg knew there was hidden sorrow. The first bird was leaving the nest.
        - id: ch01-b10
          speaker: narrator
          text: While the younger sisters finished dressing, you could see what three years had done. Jo's sharp angles had softened, and she carried herself easily, if not gracefully. Her short curls had grown into a thick coil that suited her small head and tall figure. Her cheeks had fresh color, her eyes shone softly, and today even her quick tongue spoke only gentle words.
        - id: ch01-b11
          speaker: narrator
          text: Beth had become slender, pale, and quieter than ever. Her beautiful kind eyes seemed larger now. They held something that made you sad, though it was not sadness itself. Pain had left its shadow and given her young face a patient look. Yet Beth rarely complained and always said she would soon be better.
        - id: ch01-b12
          speaker: narrator
          text: At sixteen, Amy truly was the flower of the family. She had the air of a grown woman. She was not beautiful, but grace showed in the way she stood, moved her hands, wore her dress, and let her hair fall. Amy still wished her nose were Grecian. She disliked her wide mouth and firm chin too, never seeing that they gave her face character. Instead, she took comfort in her fair skin, bright blue eyes, and abundant golden curls.
        - id: ch01-b13
          speaker: narrator
          text: The three girls wore their best summer dresses, all made of thin silver-gray cloth, with pink roses in their hair and at their bodices. Each looked exactly as she was, a fresh-faced, happy-hearted girl. For one moment, they paused in their busy young lives and watched with wistful eyes as the sweetest chapter of a woman's romance began.
    - id: ch02
      title: Under the Green Arch
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: There would be no ceremony beyond what was needed. Everything was meant to feel natural and homelike. Aunt March arrived and was horrified to find the bride running out to welcome her, the bridegroom fastening a fallen garland, and Mr. March solemnly climbing the stairs with a bottle of wine under each arm.
        - id: ch02-b02
          speaker: aunt_march
          text: Well, I never! What a way to run a wedding. Child, no one should see you until the very last moment.
          emotion: surprised
        - id: ch02-b03
          speaker: narrator
          text: She settled into the place of honor, making her lavender silk rustle around her.
        - id: ch02-b04
          speaker: meg
          text: I'm not on display, Aunty. No one is here to stare at me, judge my dress, or calculate what lunch cost. I'm much too happy to care what anyone thinks, and I'll have my little wedding exactly as I want it. John, dear, here's your hammer.
        - id: ch02-b05
          speaker: narrator
          text: Meg hurried off to help John with what Aunt March considered very improper work for a bridegroom. John did not even say thank you for the hammer. When he bent to take that thoroughly unromantic tool, he kissed his little bride behind the folding door. Aunt March caught the look between them. A sudden shine appeared in her sharp old eyes, and she quickly pulled out her pocket handkerchief.
        - id: ch02-b06
          speaker: narrator
          text: Then came a crash, a cry, and Laurie's laugh.
        - id: ch02-b07
          speaker: laurie
          text: Jupiter Ammon! Jo has knocked over the cake again!
          emotion: surprised
        - id: ch02-b08
          speaker: narrator
          text: The momentary commotion had hardly ended when a whole flock of cousins arrived and the rooms began to fill with wedding guests from every side. As Beth used to say when she was small, the party came in.
        - id: ch02-b09
          speaker: aunt_march
          text: Keep that young giant away from me. He bothers me worse than mosquitoes.
        - id: ch02-b10
          speaker: amy
          text: He promised to behave today, and when he chooses, he can have perfect manners.
        - id: ch02-b11
          speaker: narrator
          text: Amy glided off to warn Hercules about the dragon. After that warning, Laurie devoted himself to Aunt March so completely that he nearly drove her wild.
        - id: ch02-b12
          speaker: narrator
          text: There was no bridal procession. The room simply grew quiet when Mr. March and the young couple stood beneath the green arch. Mother and sisters pressed close, reluctant to let Meg go. Her father's voice broke more than once, making the service more solemn and beautiful. John's hand visibly trembled, and his answers were too soft for anyone to hear. Meg looked straight into his eyes.
        - id: ch02-b13
          speaker: meg
          text: I will.
          emotion: happy
        - id: ch02-b14
          speaker: narrator
          text: Her face and voice held such tender trust that her mother's heart rejoiced, while Aunt March gave an audible sniff. Jo did not cry, though she came close once. What saved her was seeing Laurie stare straight at her. His wicked black eyes held a comical mixture of mischief and emotion. Beth kept her face hidden against her mother's shoulder. Amy stood like a graceful statue, with one becoming ray of sunlight touching her white forehead and the flower in her hair.
        - id: ch02-b15
          speaker: meg
          text: Marmee gets the first kiss!
          emotion: happy
        - id: ch02-b16
          speaker: narrator
          text: It may not have been proper, but the moment Meg was truly married, she turned and kissed her mother with all her heart. For the next fifteen minutes she looked more like a rose than ever. Everyone claimed a kiss, from Mr. Laurence to old Hannah. Hannah wore an astonishing headdress and caught Meg in the hall with both a sob and a chuckle.
        - id: ch02-b17
          speaker: hannah
          text: Bless you, dearie, a hundred times over! The cake isn't hurt one bit, and everything looks beautiful.
          emotion: happy
    - id: ch03
      title: A Promise at Lunch
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After that, everyone brightened and either said something clever or made the attempt. It worked equally well, because laughter comes easily when hearts are light. The gifts were already arranged in the little house, so there was no grand display. Nor was there an elaborate wedding breakfast. Instead, they shared a plentiful lunch of cake and fruit, all dressed with flowers.
        - id: ch03-b02
          speaker: narrator
          text: Mr. Laurence and Aunt March exchanged a shrug and a smile when they discovered that water, lemonade, and coffee were the only drinks the three sisters served. No one mentioned it until Laurie insisted on waiting on the bride. He came to Meg carrying a heavily loaded tray and looking puzzled.
        - id: ch03-b03
          speaker: laurie
          text: Did Jo accidentally smash every bottle, or did I only imagine seeing several of them around here this morning?
        - id: ch03-b04
          speaker: meg
          text: No. Your grandfather kindly offered us his best wine, and Aunt March actually sent some too. Father saved a little for Beth and sent the rest to the Soldiers' Home. You know he believes wine should only be used as medicine. Mother says neither she nor her daughters will ever offer it to a young man in her home.
        - id: ch03-b05
          speaker: narrator
          text: Meg spoke seriously and expected Laurie to laugh or frown. He did neither. He glanced at her, then answered with his usual sudden warmth.
        - id: ch03-b06
          speaker: laurie
          text: I admire that. I've seen enough harm from drinking to wish more women felt as you do.
        - id: ch03-b07
          speaker: meg
          text: I hope you didn't have to learn that from your own experience.
          emotion: fearful
        - id: ch03-b08
          speaker: laurie
          text: No, and you have my word. But don't give me too much credit. Wine isn't one of my temptations. I grew up where it was as common as water and seemed almost as harmless, so I don't care about it. Still, when a pretty girl offers you a glass, refusing can feel awkward.
        - id: ch03-b09
          speaker: meg
          text: Then refuse for other people's sake, even if you don't need to for your own. Please promise me, Laurie. Give me one more reason to call this the happiest day of my life.
        - id: ch03-b10
          speaker: narrator
          text: The request was so sudden and serious that Laurie paused for a moment. Giving up the wine itself was easy. Being laughed at for refusing it might be much harder to bear. Meg knew that once Laurie gave a promise, he would keep his word whatever it cost him. Feeling the influence she had at that happy moment, she used it for her friend's good. She said nothing more. She only looked up at him, and her smile seemed to say that no one could deny her anything today.
        - id: ch03-b11
          speaker: narrator
          text: Laurie certainly could not. He smiled back and held out his hand.
        - id: ch03-b12
          speaker: laurie
          text: I promise, Mrs. Brooke!
        - id: ch03-b13
          speaker: meg
          text: Thank you. Thank you so very much.
          emotion: happy
        - id: ch03-b14
          speaker: jo
          text: And I drink to a long life for your good resolution, Teddy!
          emotion: happy
        - id: ch03-b15
          speaker: narrator
          text: Jo waved her glass, beamed her approval at him, and christened him with a splash of lemonade. Everyone drank the toast. The pledge had been made, and Laurie kept it faithfully in spite of many temptations afterward. With instinctive wisdom, the girls had chosen a happy moment to do their friend a lasting service. He thanked them for it all his life.
    - id: ch04
      title: From the Old Home to the New
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After lunch, people wandered in twos and threes through the house and garden, enjoying the sunshine outdoors and the happiness within. Meg and John stood together in the middle of the lawn when Laurie had an idea that gave this unfashionable wedding its perfect ending.
        - id: ch04-b02
          speaker: laurie
          text: All the married people, join hands and dance around the new husband and wife, the way the Germans do! We bachelors and spinsters will pair up and dance around the outside!
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: Laurie swept down the path with Amy, showing everyone what he meant. His skill and high spirits were so catching that the others followed without a word of protest. Mr. and Mrs. March began with Aunt and Uncle Carrol, and more couples quickly joined them. Even Sallie Moffat hesitated only a moment. Then she tossed her long train over her arm and whisked Ned into the ring.
        - id: ch04-b04
          speaker: narrator
          text: The finest joke of all came when stately old Mr. Laurence solemnly danced up to Aunt March. She tucked her cane beneath her arm and hopped briskly away with him to join hands with the rest around the bride and groom. All the while, the young people filled the garden, fluttering here and there like butterflies on a midsummer day.
        - id: ch04-b05
          speaker: narrator
          text: The sudden ball ended when everyone ran out of breath. Then the guests began to leave.
        - id: ch04-b06
          speaker: aunt_march
          text: I truly wish you well, my dear, though I still think you'll regret this. And you, young man, have won a treasure. Make sure you deserve her.
        - id: ch04-b07
          speaker: narrator
          text: She gave this last warning to John as he helped her into the carriage.
        - id: ch04-b08
          speaker: mrs_moffat
          text: Ned, that's the prettiest wedding I've attended in years. I can't imagine why. It didn't have a bit of style.
          emotion: surprised
        - id: ch04-b09
          speaker: narrator
          text: Mrs. Moffat made that discovery as she and her husband drove away. Mr. Laurence settled into his easy chair to recover from the morning's excitement.
        - id: ch04-b10
          speaker: mr_laurence
          text: Laurie, my boy, if you ever decide to do this yourself, ask one of those little girls to help you. Then I'll be entirely satisfied.
        - id: ch04-b11
          speaker: narrator
          text: Laurie carefully unpinned the flowers Jo had put in his buttonhole and gave an unusually dutiful answer.
        - id: ch04-b12
          speaker: laurie
          text: I'll do my best to please you, sir.
        - id: ch04-b13
          speaker: narrator
          text: Meg's new little house was not far away, so her only wedding journey was a quiet walk with John from her old home to the new one. She came downstairs in a dove-gray suit and a straw bonnet tied with white, looking like a pretty young Quaker. Everyone gathered close around her. They said goodbye as tenderly as if she were about to leave them for a grand tour.
        - id: ch04-b14
          speaker: meg
          text: Marmee, dear, don't think I'm leaving you behind, or that loving John so much means I love you any less. I'll come every day, Father, and though I'm married, I expect to keep my old place in all your hearts. Beth will spend a great deal of time with me. Jo and Amy will stop by now and then and laugh at all my housekeeping troubles. Thank you, every one of you, for my happy wedding day. Goodbye. Goodbye!
          emotion: sad
        - id: ch04-b15
          speaker: narrator
          text: For a moment, Meg clung to her mother with tears filling her eyes. Then the family stood watching with love, hope, and tender pride. Her hands were full of flowers as she walked away on her husband's arm. June sunshine brightened her happy face, and so Meg's married life began.
