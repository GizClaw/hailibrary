audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，带着克制的幽默, timbre: 清澈柔和, pace: 从容舒展, pitch: 中音}
    meg:
      display_name: 梅格
      tts: {delivery: 端庄温和，语气稳重, timbre: 柔润, pace: 适中, pitch: 中音}
    amy:
      display_name: 艾米
      tts: {delivery: 讲究而伶俐，偶尔流露稚气, timbre: 清脆, pace: 适中, pitch: 中高音}
    jo:
      display_name: 乔
      tts: {delivery: 爽直活泼，情感来得快而真, timbre: 明亮有力, pace: 稍快, pitch: 中音}
    laurie:
      display_name: 劳里
      tts: {delivery: 机灵热情，笑意藏不住, timbre: 清朗, pace: 轻快, pitch: 中音}
    aunt_march:
      display_name: 马奇姑婆
      tts: {delivery: 粗声直率，挑剔而威严, timbre: 苍老干脆, pace: 偏慢, pitch: 中低音}
    hannah:
      display_name: 汉娜
      tts: {delivery: 朴实直爽，带着家常口音, timbre: 粗暖, pace: 适中, pitch: 中低音}
    mrs_moffat:
      display_name: 莫法特太太
      tts: {delivery: 熟稔世故，话里带着好奇, timbre: 明亮圆润, pace: 适中, pitch: 中音}
    mr_laurence:
      display_name: 劳伦斯先生
      tts: {delivery: 庄重直率，严肃中藏着慈爱, timbre: 低沉浑厚, pace: 从容, pitch: 低音}
  chapters:
    - id: ch01
      title: 第二十五章 第一场婚礼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那天一大早，门廊上的六月蔷薇就醒了。天空没有一丝云，它们迎着阳光，快活得像一群好心的小邻居。花儿兴奋得一张张红脸更红了，在风里摇着，仿佛正悄悄议论刚看见的事。有的探进饭厅窗户，看见宴席已经摆好。有的爬到高处，对着替新娘梳妆的姐妹们点头微笑。还有的向花园、门廊和厅堂里来回奔忙的人招手。从开得最盛的红花，到颜色最淡、刚刚长成的小花苞，它们都拿出自己的美丽和香气，送给那位多年爱护、照料它们的温柔女主人。
        - id: ch01-b02
          speaker: narrator
          text: 梅格也像一朵蔷薇。她心里和灵魂里所有美好甜蜜的东西，这一天仿佛全在脸上绽放出来。那张脸秀美又温柔，还带着一种比美貌本身更动人的神采。至于新娘常穿戴的绸缎、花边和橙花，她一样也不要。
        - id: ch01-b03
          speaker: meg
          text: 我不想办什么时髦婚礼，只想让自己爱的人陪着我。我也希望他们看见的，还是平日里熟悉的那个梅格。
        - id: ch01-b04
          speaker: narrator
          text: 所以，嫁衣是梅格亲手做的。少女心里那些温柔愿望和纯真幻想，也跟着一针一线缝了进去。妹妹们替她盘好头发。她身上只戴了铃兰，因为那是“她的约翰”最喜欢的花。
        - id: ch01-b05
          speaker: amy
          text: 你还是我们自己的梅格，可今天实在太甜、太美了！要不是怕把裙子揉皱，我真想好好抱抱你。
        - id: ch01-b06
          speaker: meg
          text: 那我就放心了。大家都来抱我、亲我吧，别心疼裙子。今天这样的皱褶，我越多越喜欢。
        - id: ch01-b07
          speaker: narrator
          text: 梅格伸开双臂，妹妹们立刻围上去，紧紧依偎着她。她们就这样抱了她一会儿，脸上又是泪，又是笑，像四月里忽晴忽雨的天。姐妹们都感觉得到，新的爱情来了，可从前的亲情一点也没有变。
        - id: ch01-b08
          speaker: meg
          text: 我先去给约翰系领结，再到书房里安静陪爸爸一会儿。
        - id: ch01-b09
          speaker: narrator
          text: 她跑下楼，郑重地做完这两件小事，随后母亲走到哪里，她就跟到哪里。母亲一直带着慈爱的笑，旁人或许看不出什么，可梅格心里清楚，那笑容后面还藏着一份无人知道的伤心。巢里的第一只小鸟就要飞走了。
        - id: ch01-b10
          speaker: narrator
          text: 三个妹妹站在一起，忙着给朴素的衣装做最后整理。三年过去，她们的模样都变了些，而且今天，每个人都显出了自己最好的一面。乔身上的棱角柔和了。她还谈不上优雅，却已经举止从容。原先剪得短短的卷发，如今在小巧的脑后盘成浓密的发髻，倒很衬她高挑的身材。棕色面颊红润起来，眼睛里的光也温柔了，就连那张一向厉害的嘴，今天说出的也全是好话。
        - id: ch01-b11
          speaker: narrator
          text: 贝思清瘦苍白，比从前更安静了。她那双美丽又善良的眼睛显得更大。眼里的神情本身并不悲伤，看见的人却会觉得心酸。那是病痛留下的阴影，也让她年轻的脸上多了一份令人怜惜的忍耐。她很少诉苦，不论什么时候开口，总满怀希望地说自己很快就会好起来。
        - id: ch01-b12
          speaker: narrator
          text: 十六岁的艾米，的确是“全家的花朵”。她已有成年女子的仪态。她不算美人，却有一种说不清的优雅，对许多人来说，这种魅力并不比美貌差。从身段的线条，到双手的形态和动作，从裙裾摆动，到头发垂落，样样都自然和谐。只是她自己完全不知道，反而仍旧不满意。鼻子始终没长成希腊式，嘴又太宽，下巴也太突出。其实正是这些五官让她的脸有了个性，可她看不出来，只好拿白皙的皮肤、敏锐的蓝眼睛，还有越发浓密灿烂的金发安慰自己。
        - id: ch01-b13
          speaker: narrator
          text: 姐妹三人都穿着轻薄的银灰色夏装，那是她们夏天最好的裙子。头发上、胸前，都簪着浅红蔷薇。她们看起来正是原本的自己，面庞清新，心里快乐。在忙碌的人生中，她们暂时停了一会儿，怀着向往，望着女子一生中最甜美的那一章。
        - id: ch01-b14
          speaker: narrator
          text: 这场婚礼没有繁文缛节，一切都要像家里平常过日子那样自然。于是，马奇姑婆刚到就大吃一惊。新娘居然亲自跑出来迎接她，还扶着她进门。新郎正在钉一条掉下来的花环。身为牧师的父亲还一脸严肃地走上楼，两边胳膊底下各夹着一瓶酒。老太太坐到为她预备的上座，把淡紫色波纹绸裙抖得沙沙响。
        - id: ch01-b15
          speaker: aunt_march
          text: 我说，这像什么样子！孩子，你不到最后一刻都不该让人看见。
        - id: ch01-b16
          speaker: meg
          text: 姑婆，我又不是摆给人看的。今天来的也不是一群要盯着我、挑我的裙子、计算午餐花费的人。我高兴得很，不在乎别人说什么。我这场小婚礼，就要照自己喜欢的样子办。亲爱的约翰，你的锤子拿来了。
        - id: ch01-b17
          speaker: narrator
          text: 梅格转身便去帮“那个男人”干这件很不合礼数的活。布鲁克先生俯身去接那把一点也不浪漫的锤子，连谢谢也没说，却隔着折叠门亲了亲小新娘。他望着她的神情，让马奇姑婆猛地抽出手帕。老太太锐利的老眼里，忽然有了泪光。
        - id: ch01-b18
          speaker: narrator
          text: 忽然一声碎响，接着有人惊叫，劳里又笑了起来。
        - id: ch01-b19
          speaker: laurie
          text: 天神朱庇特！乔又把蛋糕弄翻啦！
          emotion: surprised
        - id: ch01-b20
          speaker: narrator
          text: 屋里乱了一阵。还没等大家完全安静，一大群亲戚已经到了。照贝思小时候的说法，这叫“客人进场啦”。人越来越多，劳里的黑脑袋高高露在众人上面。
        - id: ch01-b21
          speaker: aunt_march
          text: 艾米，别让那个年轻巨人靠近我。他烦人比蚊子还厉害。
        - id: ch01-b22
          speaker: amy
          text: 他答应今天好好表现。只要他肯认真，举止可以漂亮得很。
        - id: ch01-b23
          speaker: narrator
          text: 艾米溜过去，警告这位赫拉克勒斯离恶龙远一点。谁知劳里听完，反倒一直围着老太太献殷勤，差点把她烦疯。
        - id: ch01-b24
          speaker: narrator
          text: 没有队伍领着新娘入场。马奇先生和年轻的新人站到绿叶拱门下，满屋忽然静了。母亲和妹妹们挨得紧紧的，像是舍不得把梅格交出去。那道像父亲一样温厚的声音，讲着仪式中的话，却几次哽住，倒让婚礼更美，也更庄严。新郎的手抖得人人看得见，回答却轻得谁也听不清。
        - id: ch01-b25
          speaker: meg
          text: 我愿意。
          emotion: happy
        - id: ch01-b26
          speaker: narrator
          text: 梅格抬头直望着丈夫，脸上和声音里都是温柔的信赖。母亲的心顿时充满欢喜，马奇姑婆也响亮地抽了抽鼻子。乔原本没有哭，可有一回眼泪几乎就要掉下来。就在这时，她发现劳里正目不转睛地看她。那双顽皮的黑眼睛里，欢笑和感动混在一起，她便硬把眼泪忍住了。贝思始终把脸藏在母亲肩上。艾米则像一尊优雅的雕像，一缕很衬她的阳光，正好照着她洁白的额头和发间的花。
        - id: ch01-b27
          speaker: meg
          text: 第一个吻要给妈妈！
          emotion: happy
        - id: ch01-b28
          speaker: narrator
          text: 这恐怕不合规矩，可婚礼才一完成，梅格就转身把满心的爱送进这个吻里。接下来的十五分钟，每个人都来亲吻新娘，她比先前更像一朵红蔷薇。从劳伦斯先生到老汉娜，谁也没有错过。
        - id: ch01-b29
          speaker: hannah
          text: 愿上帝保佑你，亲爱的，保佑你一百遍！蛋糕一点也没坏，什么都漂亮极啦。
          emotion: happy
        - id: ch01-b30
          speaker: narrator
          text: 汉娜戴着一顶做得稀奇古怪、叫人看了又怕又赞叹的帽子，在门厅里一把搂住梅格，又哭又笑。随后，众人脸上的泪意都散了。人人说一句俏皮话，或者至少努力想说一句。反正大家心里轻快，怎么都笑得出来。礼物没有陈列，因为早已送进小房子。早餐也不铺张，只摆了一顿丰盛午餐，有蛋糕、水果，还用鲜花装点。三位像青春女神一样的年轻姑娘端来的饮料，只有水、柠檬水和咖啡。劳伦斯先生和马奇姑婆看见了，相视一笑，耸了耸肩，却什么也没说。直到坚持要服侍新娘的劳里端着满满的托盘，疑惑地来到梅格面前。
        - id: ch01-b31
          speaker: laurie
          text: 是乔一不小心，把所有酒瓶都砸了吗？要不然，难道我早晨看见这里放着酒，只是自己眼花？
        - id: ch01-b32
          speaker: meg
          text: 不是。你祖父送来了最好的酒，马奇姑婆也送了一些。爸爸只留下一点给贝思，其他全送到军人之家了。他觉得酒只有治病时才该喝。妈妈也说，她和女儿们绝不会在家里用酒招待年轻男子。
        - id: ch01-b33
          speaker: narrator
          text: 梅格说得郑重，以为劳里会皱眉，或者拿这件事开玩笑。他却飞快地看了她一眼，认真起来。
        - id: ch01-b34
          speaker: laurie
          text: 这个主意我喜欢！我见过酒把人害成什么样，真希望更多女人也能这样想。
        - id: ch01-b35
          speaker: meg
          text: 你不是自己吃过苦头，才明白这些的吧？
          emotion: fearful
        - id: ch01-b36
          speaker: laurie
          text: 没有，我向你保证。你也别因此把我想得太好，酒并不是我的诱惑。我从小待的地方，酒跟水一样常见，也差不多一样不伤人，所以我不在乎它。可一个漂亮姑娘把酒递过来，人总不大好意思拒绝，对吧？
        - id: ch01-b37
          speaker: meg
          text: 那你就为了别人拒绝，哪怕不是为了自己。劳里，答应我吧。让我再多一个理由，说今天是我一生中最幸福的一天。
        - id: ch01-b38
          speaker: narrator
          text: 这个请求来得又突然，又郑重，劳里迟疑了一会儿。对一个年轻人来说，被人取笑，有时比克制自己还难。梅格了解他，知道他只要开口答应，不论要付出什么代价都会守信。她也明白，此刻自己能够劝动他，便像女子为了朋友的好处可以做的那样，用上了这份力量。她不再说话，只抬头看着劳里。幸福让她的脸格外动人，那微笑好像在说，今天谁也不能拒绝我。
        - id: ch01-b39
          speaker: narrator
          text: 劳里当然拒绝不了。他笑着伸出手。
        - id: ch01-b40
          speaker: laurie
          text: 我答应您，布鲁克太太！
        - id: ch01-b41
          speaker: meg
          text: 谢谢你。真的，太谢谢你了。
        - id: ch01-b42
          speaker: jo
          text: 泰迪，我也举杯祝你一生忠于自己的决心！
          emotion: happy
        - id: ch01-b43
          speaker: narrator
          text: 乔笑得满脸明亮，挥动杯子，把柠檬水泼在劳里身上，算是给他做了洗礼。大家为这件事喝下祝酒，劳里也正式立下承诺。以后虽然遇到过不少诱惑，他仍旧忠实地守住了它。姑娘们凭着天生的聪慧，抓住这个欢乐时刻帮了朋友一把。劳里一生都感激她们。
        - id: ch01-b44
          speaker: narrator
          text: 午餐过后，客人们三三两两，在屋里和花园里散步。大家享受着屋外灿烂的阳光，也享受着每个人心里那份明亮。梅格和约翰恰好并肩站在草坪中央，劳里突然灵机一动，要给这场不合时尚的婚礼添上最后一样节目。他挽着艾米，兴致勃勃又步履娴熟地沿小路走来。
        - id: ch01-b45
          speaker: laurie
          text: 所有结了婚的人都拉起手，照德国人的办法，围着这对新婚夫妻跳舞！我们这些单身汉和老姑娘就在外圈，两人一组地跳！
          emotion: happy
        - id: ch01-b46
          speaker: narrator
          text: 他的兴致和舞步一样有感染力，大家二话不说，都跟着做了。马奇夫妇和卡罗尔夫妇先开始，别人很快加入。莎莉·莫法特只迟疑了一下，就把长裙摆往胳膊上一搭，拉着内德跑进圈里。最好笑的是劳伦斯先生和马奇姑婆。庄重的老先生一本正经地跳着滑步来到她面前，老太太竟把手杖夹在腋下，轻快地跳走了。她赶去同大家拉起手，围着新婚夫妻转圈。年轻人则成双结对，在外圈跳着，像仲夏花园里的蝴蝶，飞遍了整个园子。大家一直跳到喘不过气，这场临时舞会才结束，客人也开始离开。
        - id: ch01-b47
          speaker: aunt_march
          text: 亲爱的，我真心祝你幸福。不过，我觉得你将来一定会后悔。
        - id: ch01-b48
          speaker: narrator
          text: 新郎扶马奇姑婆上马车，她又回头叮嘱他。
        - id: ch01-b49
          speaker: aunt_march
          text: 年轻人，你得到了一个宝贝。可别忘了让自己配得上她。
        - id: ch01-b50
          speaker: mrs_moffat
          text: 内德，这是我多年来参加过最可爱的婚礼。真奇怪，它明明一点排场都没有。
        - id: ch01-b51
          speaker: narrator
          text: 早晨的一番热闹过去，劳伦斯先生回到安乐椅上休息。
        - id: ch01-b52
          speaker: mr_laurence
          text: 劳里，我的孩子。以后你要是想做这种事，就找这几个小姑娘中的一个帮忙。那样我就完全满意了。
        - id: ch01-b53
          speaker: narrator
          text: 劳里小心取下乔别在他扣眼里的花束，难得这么听话地回答。
        - id: ch01-b54
          speaker: laurie
          text: 先生，我一定尽力让您满意。
        - id: ch01-b55
          speaker: narrator
          text: 新家离得不远。梅格唯一的新婚旅行，只是挽着约翰，从旧家安静地走到小房子。她换好衣服下楼，一身鸽子灰套装，戴着系白缎带的草帽，漂亮得像一位贵格会姑娘。大家全围上来道别，郑重又温柔，仿佛她不是搬到近处，而是要动身游遍欧洲。
        - id: ch01-b56
          speaker: meg
          text: 亲爱的妈妈，别觉得我离开了你们。我那么爱约翰，也不会少爱你们一点。爸爸，我每天都会回来。即使结了婚，我还想留在你们每个人心里原来的位置。贝思会常常陪我，另外两个姑娘也会不时来看看，笑我不会操持家务。谢谢你们，让我有了这么幸福的婚礼。再见，再见！
          emotion: sad
        - id: ch01-b57
          speaker: narrator
          text: 梅格依偎着母亲，眼里蓄满泪水。后来，她挽住丈夫的手臂，双手捧满鲜花，慢慢走远。家人仍站在原地，一直望着她。每一张脸上都满是爱、希望，还有温柔的骄傲。六月的阳光照亮了梅格幸福的面庞。她的婚姻生活，就这样开始了。
