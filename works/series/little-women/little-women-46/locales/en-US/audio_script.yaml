  chapters:
    - id: ch01
      title: The Most Important Brookes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: I could hardly call myself a faithful historian of the March family if I left out two of its most precious and important members. Daisy and Demi Brooke were now three or four, which counted as years of discretion in that fast-moving age. Children that old knew their rights, claimed them, and often got them. Many grown people could not say as much.
        - id: ch01-b02
          speaker: narrator
          text: If any twins were in danger of being spoiled by love, it was this talkative pair. Naturally, everyone thought they were the most remarkable children ever born. They had walked at eight months and talked fluently at twelve. By two, they sat at the table and behaved so properly that everyone admired them.
        - id: ch01-b03
          speaker: narrator
          text: At three, Daisy demanded a needler. She made a bag with four whole stitches in it. Then she set up a little home inside the sideboard and managed a tiny cooking stove so skillfully that tears of pride came to Hannah's eyes.
        - id: ch01-b04
          speaker: narrator
          text: Demi learned his letters from Grandpa. Mr. March had invented a new alphabet lesson. He shaped each letter with his arms and legs, so the boy exercised his head and his heels at once.
        - id: ch01-b05
          speaker: narrator
          text: Demi also showed an early gift for machinery. This delighted his father and distracted his mother. He copied every machine he saw, leaving the nursery in chaos. His sewinsheen was a mysterious construction of string, chairs, clothespins, and spools, all meant to make wheels go round and round.
        - id: ch01-b06
          speaker: narrator
          text: Another invention was a basket hanging over the back of a chair. Demi tried in vain to hoist his trusting sister in it. Daisy let her little head get bumped until someone rescued her. The young inventor was indignant.
        - id: ch01-b07
          speaker: demi
          text: But, Mama, that's my elevator! I'm trying to pull her up!
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: The twins were completely different, yet they got along wonderfully. They hardly quarreled more than three times a day. Demi bossed Daisy around, but he bravely defended her from anyone else. Daisy served him as faithfully as a galley slave and believed her brother was the one perfect person in the world.
        - id: ch01-b09
          speaker: narrator
          text: Daisy was rosy, round, and full of sunshine. She found her way into every heart and settled there. She seemed made to be kissed and cuddled, dressed up and adored, then proudly shown to company. Her little virtues were very sweet. A few little naughty ways kept her from being too angelic and made her delightfully human.
        - id: ch01-b10
          speaker: narrator
          text: The weather in Daisy's world was always fair. Every morning, in her nightgown, she scrambled up to the window. Rain or shine, she looked out and cried the same thing.
        - id: ch01-b11
          speaker: daisy
          text: Oh, pretty day! Oh, pretty day!
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: Everyone was Daisy's friend. She offered kisses even to strangers with such perfect trust that stubborn bachelors softened, while people who already loved babies became her faithful worshipers. Once, with a spoon in one hand and her mug in the other, she opened her arms as if she meant to hug and feed the whole world.
        - id: ch01-b13
          speaker: daisy
          text: I love everybody!
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: As Daisy grew, Meg began to hope that the Dovecote had been blessed with another quiet, loving presence like the one that had once made the old house feel like home. The family's recent loss had taught them how long they had lived beside an angel without knowing it, and Meg prayed that Daisy would be spared. Grandpa often called her Beth. Grandma watched over her tirelessly, as if she were making up for an old mistake that no one else could see.
    - id: ch02
      title: Where Demi Keeps His Mind
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Demi had the questioning nature of a true Yankee. He wanted to know everything, and he was often troubled when no one could give a good answer to his endless question, "What for?"
        - id: ch02-b02
          speaker: narrator
          text: He had a thoughtful side, too, which delighted Grandpa. The two of them held long question-and-answer talks. Now and then, the very young student left his teacher stuck for an answer, much to the open satisfaction of the women. One night, after a lively struggle over bedtime, Demi rested and studied his busy legs.
        - id: ch02-b03
          speaker: demi
          text: Grandpa, what makes my legs go?
        - id: ch02-b04
          speaker: narrator
          text: The wise teacher respectfully stroked the boy's yellow head.
        - id: ch02-b05
          speaker: mr_march
          text: Your little mind makes them go, Demi.
        - id: ch02-b06
          speaker: demi
          text: What's a little mind?
        - id: ch02-b07
          speaker: mr_march
          text: It's what makes your body move. Remember my watch? Its spring made the wheels turn. Your mind moves you that way.
        - id: ch02-b08
          speaker: demi
          text: Open me. I want to see it go around.
        - id: ch02-b09
          speaker: mr_march
          text: I can't open you any more than you could open the watch. God winds you up, and you keep going until He stops you.
        - id: ch02-b10
          speaker: narrator
          text: Demi's brown eyes grew large and bright as the new idea settled in.
        - id: ch02-b11
          speaker: demi
          text: He does? Am I wound up like the watch?
          emotion: surprised
        - id: ch02-b12
          speaker: mr_march
          text: Yes, but I can't show you how. It happens when we aren't looking.
        - id: ch02-b13
          speaker: narrator
          text: Demi felt along his back, expecting it to be like the watch. Then he gave his answer with great seriousness.
        - id: ch02-b14
          speaker: demi
          text: I guess God does it when I'm asleep.
        - id: ch02-b15
          speaker: narrator
          text: Grandpa carefully explained more. Demi listened so closely that his anxious grandmother began to worry.
        - id: ch02-b16
          speaker: mrs_march
          text: My dear, is it wise to discuss such things with that baby? His forehead is getting more thoughtful by the minute, and you're teaching him to ask questions no one can answer.
        - id: ch02-b17
          speaker: mr_march
          text: If he's old enough to ask, he's old enough to hear a true answer. I didn't put these thoughts into his head. I'm only helping him open the thoughts already there. Children know more than we do sometimes, and I believe he understood every word. Demi, where do you keep your mind?
        - id: ch02-b18
          speaker: narrator
          text: Grandpa might have expected some grand philosopher's answer. Instead, Demi stood on one leg like a small, thoughtful stork. After a moment, he spoke with calm certainty.
        - id: ch02-b19
          speaker: demi
          text: In my little belly.
          emotion: calm
        - id: ch02-b20
          speaker: narrator
          text: The old gentleman could only laugh with Grandma and end the lesson in philosophy.
        - id: ch02-b21
          speaker: narrator
          text: There might have been reason to worry if Demi had not also proved that he was a perfectly ordinary boy. After one of those deep talks, Hannah sometimes shook her head and predicted that the child was too wise to live long. Then Demi would pull some prank. Dear, dirty, naughty little boys have always known how to worry their parents and delight them at the same time.
    - id: ch03
      title: Raisins and Rivalry
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Meg made many rules about good behavior and honestly tried to keep them. But what mother can always resist the charm, clever excuses, and peaceful boldness of little boys and girls? They learn very early how to slip neatly around a rule.
        - id: ch03-b02
          speaker: narrator
          text: On plum-pudding day, Demi appeared in the kitchen as regularly as ever and offered to help. His true interest was the raisins.
        - id: ch03-b03
          speaker: meg
          text: No more raisins, Demi. You'll make yourself sick.
        - id: ch03-b04
          speaker: demi
          text: I like being sick.
        - id: ch03-b05
          speaker: meg
          text: Well, I don't like having you sick. Run along and help Daisy make her little cakes.
        - id: ch03-b06
          speaker: narrator
          text: Demi went reluctantly. He felt deeply wronged, and he waited for a chance to set things right. Before long, he found one and outsmarted Mama with a clever bargain. Once the pudding was safely bobbing in the pot, Meg led her flour-covered helpers upstairs.
        - id: ch03-b07
          speaker: meg
          text: You've both been good, so I'll play anything you choose.
        - id: ch03-b08
          speaker: narrator
          text: A brilliant idea came into Demi's well-powdered head.
        - id: ch03-b09
          speaker: demi
          text: Do you really mean it, Mama?
        - id: ch03-b10
          speaker: meg
          text: I really do. Whatever you say.
        - id: ch03-b11
          speaker: narrator
          text: The trusting mother prepared to sing "The Three Little Kittens" six times, or take the family out to buy a penny bun no matter what happened to them on the way. Demi calmly trapped her with her own promise.
        - id: ch03-b12
          speaker: demi
          text: Then we'll go eat every one of the raisins.
        - id: ch03-b13
          speaker: narrator
          text: Aunt Dodo was the twins' chief playmate and closest friend. Jo and the children regularly turned the little house upside down together. Aunt Amy was still only a name to them. Aunt Beth had already faded into a sweet but blurry memory. Dodo was real and present, and they enjoyed every bit of her attention. Jo treasured that compliment.
        - id: ch03-b14
          speaker: narrator
          text: Then Mr. Bhaer began to visit, and Jo neglected her playmates. Their little hearts filled with dismay. Daisy loved to travel around selling kisses, but now she lost her best customer and went out of business.
        - id: ch03-b15
          speaker: narrator
          text: Demi quickly understood that Dodo preferred playing with the bear-man to playing with him. The discovery hurt, but he kept his suffering to himself. He could not bear to insult a rival who carried a mine full of chocolate drops in his vest pocket. Better still, the man's watch could be taken from its case and shaken as much as an enthusiastic admirer pleased.
        - id: ch03-b16
          speaker: narrator
          text: Some people might have called those treats and privileges bribes. Demi did not. He continued to favor the bear-man with thoughtful friendliness. By Mr. Bhaer's third visit, Daisy had given him her small heart. His shoulder became her throne, his arm became her shelter, and every gift from him was a priceless treasure.
        - id: ch03-b17
          speaker: narrator
          text: Gentlemen sometimes develop a sudden interest in the young relatives of a lady they admire. When that interest is false, it never sits naturally and fools no one. Mr. Bhaer's affection was genuine, and it worked very well. Honesty helps in love just as it does in law. He was one of those men who felt at home with children. Their little faces looked especially pleasant beside his strong one.
        - id: ch03-b18
          speaker: narrator
          text: Whatever his business was, it kept him nearby day after day. Almost every evening brought him to the March house. He always asked for Mr. March, so naturally Papa believed he was the attraction. The two men enjoyed long talks as kindred spirits. Then one chance remark from a more observant member of the family suddenly gave Grandpa a different idea.
    - id: ch04
      title: A Precocious Chick
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One evening, Mr. Bhaer stopped at the study door, amazed by what he saw. Mr. March lay flat on the floor with his respectable legs in the air. Demi lay beside him and struggled to copy the position with his own short legs in scarlet stockings. Both were so serious about their work that they noticed no one until Mr. Bhaer's deep laugh rang out and Jo cried in horror.
        - id: ch04-b02
          speaker: jo
          text: Father! Father, the Professor is here!
        - id: ch04-b03
          speaker: narrator
          text: The black legs dropped. The gray head rose. The teacher kept all his dignity.
        - id: ch04-b04
          speaker: mr_march
          text: Good evening, Mr. Bhaer. Please give us one moment. We're just finishing the lesson. Now, Demi, make the letter and tell us its name.
        - id: ch04-b05
          speaker: demi
          text: I know this one!
        - id: ch04-b06
          speaker: narrator
          text: After several jerky attempts, Demi spread his red legs into the shape of a compass. Then the clever student shouted his answer in triumph.
        - id: ch04-b07
          speaker: demi
          text: It's a V, Grandpa! It's a V!
          emotion: happy
        - id: ch04-b08
          speaker: jo
          text: He's a born Weller!
          emotion: happy
        - id: ch04-b09
          speaker: narrator
          text: Jo laughed at her own joke. Mr. March got himself upright, while Demi tried to stand on his head. That was the only way he knew to show how pleased he was that school had ended. Mr. Bhaer picked up the little gymnast.
        - id: ch04-b10
          speaker: mr_bhaer
          text: What did you do today, little fellow?
        - id: ch04-b11
          speaker: demi
          text: I went to see little Mary.
        - id: ch04-b12
          speaker: mr_bhaer
          text: And what did you do there?
        - id: ch04-b13
          speaker: demi
          text: I kissed her.
        - id: ch04-b14
          speaker: narrator
          text: Demi confessed with perfect openness.
        - id: ch04-b15
          speaker: mr_bhaer
          text: Oh! You begin early. And what did little Mary say when you kissed her?
        - id: ch04-b16
          speaker: narrator
          text: Demi stood on the Professor's knee and searched the vest pocket as he answered.
        - id: ch04-b17
          speaker: demi
          text: She liked it. Then she kissed me, and I liked it, too. Don't little boys like little girls?
        - id: ch04-b18
          speaker: narrator
          text: His mouth was full, and he looked completely satisfied.
        - id: ch04-b19
          speaker: jo
          text: You early little chick! Who gave you that idea?
          emotion: happy
        - id: ch04-b20
          speaker: demi
          text: It isn't in my head. It's in my mouth.
        - id: ch04-b21
          speaker: narrator
          text: Literal Demi stuck out his tongue. A chocolate drop sat on it. He thought Jo meant the candy, not the idea.
        - id: ch04-b22
          speaker: mr_bhaer
          text: You should keep some for your little friend. Sweets for the sweet, young man.
        - id: ch04-b23
          speaker: narrator
          text: Mr. Bhaer offered Jo some chocolate with a look that made her wonder whether it was the drink of the gods. Demi noticed the smile, too, and it gave him another innocent question.
        - id: ch04-b24
          speaker: demi
          text: Do big boys like big girls, too, Professor?
        - id: ch04-b25
          speaker: narrator
          text: Like young Washington, Mr. Bhaer could not tell a lie. His answer was not very exact, but his tone said more than the words.
        - id: ch04-b26
          speaker: mr_bhaer
          text: I believe they do, sometimes.
        - id: ch04-b27
          speaker: narrator
          text: Mr. March put down his clothesbrush and glanced at Jo's turned-away face. Then he sank into his chair. The precocious chick had planted an idea in Grandpa's mind, and the idea seemed both sweet and sour.
        - id: ch04-b28
          speaker: narrator
          text: Half an hour later, Dodo found Demi in the china closet. Instead of shaking him for being there, she hugged him so tenderly that she nearly squeezed the breath out of him. Then, in another surprising turn, she gave him a large slice of bread and jelly.
        - id: ch04-b29
          speaker: narrator
          text: Why had Dodo behaved in such a strange new way? Demi puzzled over that problem with all his small wits. He never solved it.
