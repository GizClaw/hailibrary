audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带含蓄的机智
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    daisy:
      display_name: 黛西
      tts:
        delivery: 天真甜美，亲热而快活
        timbre: 稚嫩柔软的幼女声
        pace: 轻快自然
        pitch: 高音
    demi:
      display_name: 黛米
      tts:
        delivery: 好奇认真，淘气中带一本正经
        timbre: 清亮稚嫩的幼童男声
        pace: 明快，提问时稍慢
        pitch: 中高音
    meg:
      display_name: 梅格
      tts:
        delivery: 温柔端庄，管教孩子时坚定亲切
        timbre: 柔和温暖的青年女声
        pace: 从容自然
        pitch: 中音偏高
    mr_march:
      display_name: 马奇先生
      tts:
        delivery: 温和儒雅，带安静的喜悦
        timbre: 柔和清朗的成年男声
        pace: 从容不迫
        pitch: 中音偏低
    marmee:
      display_name: 马奇太太
      tts:
        delivery: 慈爱安详，担忧时仍温和克制
        timbre: 温暖沉静的成年女声
        pace: 平稳舒缓
        pitch: 中音偏低
    hannah:
      display_name: 汉娜
      tts:
        delivery: 朴实爽直，关切里带夸张的笃定
        timbre: 粗暖厚实的成年女声
        pace: 稳健自然
        pitch: 中音偏低
    jo:
      display_name: 乔
      tts:
        delivery: 爽朗敏捷，俏皮中带着真情
        timbre: 清脆而略带沙哑的青年女声
        pace: 明快利落
        pitch: 中音
    mr_bhaer:
      display_name: 贝尔先生
      tts:
        delivery: 诚恳浑厚，对孩子温柔而幽默
        timbre: 洪亮温暖的成年男声
        pace: 沉稳自然
        pitch: 低音
  chapters:
    - id: ch01
      title: 第四十五章 黛西和黛米
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我既然自称马奇一家的卑微史官，若不专门留一章给家里最宝贝、最要紧的两个人，便算不上尽了职责。黛西和黛米已经三四岁了。在这个步子飞快的时代，连这么大的娃娃也会声张自己的权利，而且往往真能如愿。许多大人反倒没有这份本事。要说哪对双胞胎最容易被全家宠坏，那一定就是这两个牙牙学语的布鲁克了。
        - id: ch01-b02
          speaker: narrator
          text: 当然，他们也是有史以来最了不起的孩子。你看，他们八个月会走，一岁便说得流利，到了两岁，已经可以规规矩矩坐在饭桌旁，叫所有人赞叹。三岁的黛西要来一根“针针”，缝了一只足有四针的小袋子，还在餐具柜里安了家。她摆弄那只小得不能再小的炉子，熟练得叫汉娜骄傲落泪。黛米则跟外祖父认字母。老人用胳膊和腿摆出字形，让脑袋和手脚一起做体操。
        - id: ch01-b03
          speaker: narrator
          text: 黛米很早就露出了机械方面的天分。父亲看着欢喜，母亲却给折腾得心烦，因为他看到什么机器都想照样造一架。他用绳子、椅子、衣夹和线轴搭出一台“缝纫叽”，让轮子“一圈一圈转”，也把育儿室弄得乱成一团。他又把篮子挂在椅背上，想把信任他的妹妹吊起来。黛西忠心地由他摆布，小脑袋磕来撞去，直到大人赶来救她。
        - id: ch01-b04
          speaker: demi
          text: 怎么啦，妈妈？那是我的升降梯，我正要把她拉上去呢。
        - id: ch01-b05
          speaker: narrator
          text: 姐弟俩性情完全不同，相处起来却出奇和睦，难得一天吵上三次以上。黛米当然爱支使妹妹，把她管得服服帖帖，可只要别人来欺负她，他又会英勇地站出来保护。黛西则心甘情愿替哥哥做苦工，还认定他是世上唯一十全十美的人。
        - id: ch01-b06
          speaker: narrator
          text: 黛西圆胖红润，像一团阳光，总能钻进人心里，再舒舒服服住下来。这样的孩子仿佛生来就是让人亲吻、搂抱，再像小女神一样精心打扮和疼爱。每逢热闹场合，大人还要把她领出来给众人欣赏。她那些小小的美德甜蜜极了，好在偶尔还会淘气，所以没有真变成天使，仍是个可爱的小凡人。她的天地似乎永远风和日丽。每天早晨，她穿着睡衣爬到窗前，不管晴雨，都欢欢喜喜地望出去。
        - id: ch01-b07
          speaker: daisy
          text: 啊，真漂酿！真漂酿的一天！
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: 她把每个人都当朋友，连陌生人也会得到她信任十足的亲吻。最顽固的单身汉都会心软，原本喜欢孩子的人更是彻底成了她的信徒。有一次，她一手拿着勺子，一手举着杯子，还朝大家张开胳膊，像是急着要抱住全世界，也把全世界喂饱。
        - id: ch01-b09
          speaker: daisy
          text: 我爱每一个人。
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: 黛西渐渐长大，梅格觉得，她的宁静和爱会给鸽舍带来祝福，就像贝丝从前使老屋成为真正的家。她也暗暗祈求，不要再经历失去贝丝那样的痛苦。直到那场失去来临，全家才明白，一位天使原来已在他们身边住了那么久。外祖父常把黛西叫作贝丝，外祖母也不知疲倦地守护她，仿佛要补偿一桩只有自己看得见的旧过失。
        - id: ch01-b11
          speaker: narrator
          text: 黛米却像个地道的扬基人，什么都想弄明白。一句没完没了的“为什么”，若得不到满意答案，就能让他十分苦恼。他又天生爱思索，外祖父最喜欢用苏格拉底式的问答同他谈论道理。有时这位早慧的小学生竟会把老师难住，家里的女人们便毫不掩饰自己的得意。
        - id: ch01-b12
          speaker: narrator
          text: 一天晚上，睡前的玩闹刚停，黛米望着自己那双闲不住的腿，认真琢磨起来。
        - id: ch01-b13
          speaker: demi
          text: 外公，是什么让我的腿会动呀？
        - id: ch01-b14
          speaker: mr_march
          text: 是你的小心灵，黛米。
        - id: ch01-b15
          speaker: demi
          text: 小心灵是什么？
        - id: ch01-b16
          speaker: mr_march
          text: 它会叫你的身体活动。还记得我的怀表吗？里面的发条一动，轮子就转起来了。
        - id: ch01-b17
          speaker: demi
          text: 那你把我打开吧，我想看看它怎么转。
        - id: ch01-b18
          speaker: mr_march
          text: 我不能打开你，就像你打不开那只怀表。上帝给你上好发条，你便一直走，直到他叫你停下。
        - id: ch01-b19
          speaker: demi
          text: 我也像怀表一样，上过发条吗？
          emotion: surprised
        - id: ch01-b20
          speaker: mr_march
          text: 是啊。只是那件事发生的时候，我们看不见，所以我没法让你瞧。
        - id: ch01-b21
          speaker: narrator
          text: 黛米摸了摸后背，像是在找怀表背后的机关，随后郑重地得出了答案。
        - id: ch01-b22
          speaker: demi
          text: 我猜，上帝是趁我睡着的时候上的。
        - id: ch01-b23
          speaker: narrator
          text: 外祖父又仔细解释起来。黛米听得太专心，外祖母反倒担忧了。
        - id: ch01-b24
          speaker: marmee
          text: 亲爱的，和这么小的孩子谈这些，真合适吗？他眉毛上面都快鼓出大包了，还尽问些谁也答不出的问题。
        - id: ch01-b25
          speaker: mr_march
          text: 他会问，就已经大到能听真话了。这些念头本来就在他心里，我只是帮他展开。孩子比我们聪明，这男孩一定听懂了。黛米，你把心灵放在哪里？
        - id: ch01-b26
          speaker: narrator
          text: 若黛米像亚尔西巴德回答苏格拉底那样，说自己不知道，外祖父也不会吃惊。可他单腿站了一会儿，像只沉思的小鹳，终于十分确信地开口。
        - id: ch01-b27
          speaker: demi
          text: 在我的小肚肚里。
        - id: ch01-b28
          speaker: narrator
          text: 老先生只好和外祖母一起笑，把这堂玄学课散了。若黛米只会思索，不会淘气，梅格或许真该担心。好在他很快就能证明，自己不只是个初露头角的小哲学家，也是个地地道道的男孩。每次高深谈话过后，汉娜总会不祥地点着头，作出预言。
        - id: ch01-b29
          speaker: hannah
          text: 这孩子呀，在世上待不长。
          emotion: fearful
        - id: ch01-b30
          speaker: narrator
          text: 可转眼间，黛米便闯出一桩淘气事，叫她彻底放心。这些亲爱的、脏兮兮的小坏蛋，总有办法一边折腾父母，一边又叫父母满心欢喜。梅格定了许多行为规矩，也认真照着执行，可小小的男人和女人们早早就成了逃脱大师。他们会讨好，会巧妙地找借口，还会若无其事地大胆胡来。哪个母亲真抵挡得住呢？
        - id: ch01-b31
          speaker: narrator
          text: 做葡萄干布丁那天，黛米照例准时来厨房帮忙。
        - id: ch01-b32
          speaker: meg
          text: 不能再吃葡萄干了，黛米。吃多了会生病。
        - id: ch01-b33
          speaker: demi
          text: 我喜欢生病。
        - id: ch01-b34
          speaker: meg
          text: 我可不喜欢你生病。快去帮黛西做小馅饼吧。
        - id: ch01-b35
          speaker: narrator
          text: 黛米不情愿地走了，却没有忘掉这份委屈。等布丁在锅里稳稳翻腾，梅格领两个小厨师上楼，补偿自己的机会终于来了。
        - id: ch01-b36
          speaker: meg
          text: 你们今天都很乖。现在想玩什么，我就陪你们玩什么。
        - id: ch01-b37
          speaker: demi
          text: 真的，妈妈？
        - id: ch01-b38
          speaker: meg
          text: 真的，你们说什么都行。
        - id: ch01-b39
          speaker: narrator
          text: 这位没有远见的母亲，已经准备把《三只小猫》唱上六遍，或是不管会不会摔伤胳膊腿，带着全家去玩“买一只一便士的小面包”。没想到，满头面粉的黛米早有了一个绝妙主意，只用一句冷静的回答就把她逼到了墙角。
        - id: ch01-b40
          speaker: demi
          text: 那我们去把所有葡萄干都吃光。
        - id: ch01-b41
          speaker: narrator
          text: 多多姨妈原是姐弟俩最要好的玩伴和知心朋友，三个人常把小屋闹个底朝天。艾米姨妈对他们来说还只是一个名字，贝丝姨妈也很快成了朦胧而亲切的回忆。唯有多多是活生生的存在，天天都在眼前，他们当然要尽情缠着她。孩子们这样看重自己，乔心里十分感激，也一直痛痛快快陪着他们玩。
        - id: ch01-b42
          speaker: narrator
          text: 可贝尔先生一来，乔冷落了小玩伴，两颗幼小的心顿时又惊慌又凄凉。黛西平日四处兜售亲吻，如今失去最大的顾客，只好宣告破产。黛米也凭着孩子敏锐的眼光看出，多多如今更爱和“熊先生”玩。他很伤心，却把痛苦藏了起来，不忍得罪这位情敌。贝尔先生的口袋里有一整座巧克力糖矿，怀表还能取出表壳，随便让热心的小崇拜者摇晃。这样的对手，实在难以拒绝。
        - id: ch01-b43
          speaker: narrator
          text: 有人也许会把这些好处叫作贿赂，黛米可不这样想。他仍带着忧郁而和气的神情，恩赐般地亲近“熊先生”，并没有因为多多变心就把他赶走。到第三次来访，黛西也把自己小小的爱意送给了他。往后，她把他的肩膀当成自己的宝座，把他的手臂当作避难所，他送的每一件东西更全是价值无可估量的珍宝。
        - id: ch01-b44
          speaker: narrator
          text: 有些男人为了讨好自己爱慕的女士，会突然夸起她家的孩子。可那种假装出来的爱孩子之心，搁在他们身上很不自在，也骗不过任何人。贝尔先生却是真心喜欢孩子，而且这份真心同样有效。无论恋爱还是法律，诚实总是上策。他本就属于和孩子在一起毫不拘束的那种男人，一张张小脸也衬得他刚毅的脸格外好看。他不知被什么事情留在附近，一天又一天没有离开，几乎每天晚上都会来看望大家。每次他先问马奇先生在不在，可敬的父亲便以为客人果真是为自己而来，兴致勃勃地拉着这位知己长谈。最后，还是观察更敏锐的小外孙随口说了一句，才叫他忽然开了窍。
        - id: ch01-b45
          speaker: narrator
          text: 那天晚上，贝尔先生走到书房门口，刚在门槛上停住，眼前的景象就叫他愣住了。马奇先生整个人趴在地板上，两条向来体面的黑裤腿高高翘在半空。黛米也趴在一旁，努力用自己那双穿鲜红袜子的短腿摆出同样姿势。地上的一老一小都神情严肃，专心得根本没发现观众，直到贝尔先生发出一阵洪亮的笑声，乔也满脸惊骇地叫了起来。
        - id: ch01-b46
          speaker: jo
          text: 爸爸，爸爸，教授来了！
          emotion: surprised
        - id: ch01-b47
          speaker: narrator
          text: 两条黑腿立刻落了下来，花白的脑袋随即抬起。这位刚从地上起身的老师，语气依旧沉着，丝毫没有失去尊严。
        - id: ch01-b48
          speaker: mr_march
          text: 晚上好，贝尔先生。请稍等，我们就要讲完了。黛米，把那个字母摆出来，再告诉我它叫什么。
        - id: ch01-b49
          speaker: demi
          text: 我知道！是个W，外公，是个W！
          emotion: happy
        - id: ch01-b50
          speaker: narrator
          text: 红袜子腿一阵费力地抽动，终于摆成一副圆规，聪明的学生得意极了。
        - id: ch01-b51
          speaker: jo
          text: 这孩子天生就是个韦勒派。
        - id: ch01-b52
          speaker: narrator
          text: 马奇先生收拾着从地上站起来，黛米则试着用头倒立。学校终于放学了，这是他唯一想得出的庆祝办法。
        - id: ch01-b53
          speaker: mr_bhaer
          text: 小家伙，你今天做什么去了？
        - id: ch01-b54
          speaker: demi
          text: 我去看小玛丽了。
        - id: ch01-b55
          speaker: mr_bhaer
          text: 你在那里做了什么？
        - id: ch01-b56
          speaker: demi
          text: 我亲她了。
        - id: ch01-b57
          speaker: mr_bhaer
          text: 啧，这么小就开始啦。那小玛丽怎么说？
        - id: ch01-b58
          speaker: narrator
          text: 贝尔先生把这位小罪人抱在膝头继续审问。黛米站在他的膝盖上，一点也没耽误搜查那个藏着巧克力糖的背心口袋。
        - id: ch01-b59
          speaker: demi
          text: 她喜欢呀。她亲了我，我也喜欢。小男孩不是都喜欢小女孩吗？
        - id: ch01-b60
          speaker: narrator
          text: 黛米嘴里塞得满满的，脸上还是一副温和而满足的神情。乔和教授都被这番毫不掩饰的天真招供逗乐了。
        - id: ch01-b61
          speaker: jo
          text: 你这只早熟的小鸡！是谁把这个念头放进你脑袋里的？
        - id: ch01-b62
          speaker: demi
          text: 不在我的脑袋里，在我的嘴巴里。
        - id: ch01-b63
          speaker: narrator
          text: 黛米伸出舌头，上面放着一颗巧克力糖。他以为乔问的是糖，不是念头。
        - id: ch01-b64
          speaker: mr_bhaer
          text: 你该给小朋友留几颗。甜糖送甜心，小男子汉。
        - id: ch01-b65
          speaker: narrator
          text: 贝尔先生说着，也递给乔几颗巧克力糖。他望着乔的眼神很特别，让她不由得怀疑，今天的巧克力莫非就是众神饮用的琼浆。黛米也看见了那个微笑，而且牢牢记在心里，马上又天真地问了一句。
        - id: ch01-b66
          speaker: demi
          text: 大男孩也喜欢大女孩吗，教授？
        - id: ch01-b67
          speaker: narrator
          text: 贝尔先生像年幼的华盛顿一样不会说谎，只好含含糊糊地说，他相信大男孩有时的确会喜欢大女孩。那语气叫马奇先生放下手里的衣刷，先看看乔悄悄转开的脸，随后又慢慢坐进椅子。那只早熟的小鸡，似乎也往他的脑袋里放进了一个又甜又酸的新念头。
        - id: ch01-b68
          speaker: narrator
          text: 半小时后，多多在餐具室里捉住了黛米。他原本不该溜进那里，可她不但没有像平常那样抓住他摇晃一顿，反而温柔地把他紧紧一抱，差点挤得他喘不过气来。接着，她又破天荒地送给他一大片涂着果酱的面包，算是给这场奇怪的拥抱再添上一份意外。黛米想来想去，怎么也不明白，她为什么突然这样对待自己。这个难题，只好永远留在他的小脑袋里，再也没有答案。
