audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机智，像在炉边从容讲述旧日家事
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情绪来得快，带一点男孩子气
        timbre: 明亮略带沙哑
        pace: 偏快
        pitch: 中低
    meg:
      display_name: 梅格
      tts:
        delivery: 温柔端庄，常带大姐姐式的认真
        timbre: 柔和圆润
        pace: 适中
        pitch: 中
    beth:
      display_name: 贝丝
      tts:
        delivery: 羞怯安静，话语真诚而体贴
        timbre: 轻柔温暖
        pace: 稍慢
        pitch: 中高
    amy:
      display_name: 艾米
      tts:
        delivery: 一本正经又有些自负，努力显得优雅
        timbre: 清脆稚嫩
        pace: 适中
        pitch: 偏高
    laurie:
      display_name: 劳里
      tts:
        delivery: 彬彬有礼而略显腼腆，熟悉以后轻松风趣
        timbre: 清朗温和
        pace: 适中
        pitch: 中
    hannah:
      display_name: 汉娜
      tts:
        delivery: 爽朗朴实，惊讶时直率而热烈
        timbre: 浑厚温暖
        pace: 适中
        pitch: 中低
    family:
      display_name: 全家人
      tts:
        delivery: 亲密热闹，几个人兴奋地接连发问
        timbre: 明亮而层次丰富
        pace: 偏快
        pitch: 中
  chapters:
    - id: ch01
      title: 第十四章 秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 十月渐渐冷了，下午也越来越短。每天只有两三个钟头，阳光会暖暖地照进阁楼的高窗。乔就趁这时候坐在旧沙发上，把稿纸全摊在面前的一只箱子上，埋头写个不停。宠物鼠斯克拉布尔带着大儿子在头顶的房梁间散步。那只年轻的老鼠长得挺漂亮，一把胡须更叫它神气，显然自己也很得意。乔完全沉进了故事，顾不上看它们，只管一路写到最后一页，然后痛快地签下名字，扔开了笔。
        - id: ch01-b02
          speaker: jo
          text: 好了，我能使的劲全使上了！这要是还不行，就等我以后写得更好再说。
        - id: ch01-b03
          speaker: narrator
          text: 乔靠回沙发，从头到尾细读了一遍。这里添一道破折号，那里加一个像小气球似的惊叹号。改完，她用鲜红的丝带扎好稿子，认真看了片刻。她神情庄重，眼里又全是期盼，一看就知道她把这份心血看得多重。她在阁楼里的书桌，其实是一只挂在墙上的旧铁皮小厨房。稿纸和几本书全锁在里面，免得斯克拉布尔碰着。那只老鼠也爱“文学”，总把附近的书页啃下来，办自己的流通图书馆。乔又从铁皮柜里取出一份稿子，把两份一起塞进口袋，悄悄下楼去了，只留下鼠朋友们品尝她的笔和墨水。
        - id: ch01-b04
          speaker: narrator
          text: 她尽量不出声地戴好帽子，穿上外套，来到后门过道的窗前。她先爬出去，落到低矮的门廊顶上，再攀住边缘，把自己荡到下面的草坡。她没有直接往前门走，而是绕了一大圈才来到大路。到了那里，她定定神，叫住一辆经过的公共马车，满脸快活又神秘地摇晃着进城去了。
        - id: ch01-b05
          speaker: narrator
          text: 要是有人一路看着她，一定会觉得她古怪得很。下车以后，她一路快走，好不容易找到热闹街道上的那个门牌。她走进门洞，抬头看看脏兮兮的楼梯，直挺挺站了一分钟，又突然逃回街上。她这样来来回回好几次，把对面窗口里一位黑眼睛的青年逗乐了。第三次回来，乔抖抖身子，把帽檐拉到眼睛上，终于往楼上走。看她那副模样，简直像要去拔掉满口牙。
        - id: ch01-b06
          speaker: narrator
          text: 门口挂着好几块招牌，其中恰好有一块属于牙医。上面的一对假牙床慢慢开合，露出一排好牙，正卖力替牙医招徕客人。黑眼睛的青年盯着它看了一会儿，穿上外衣，拿起帽子，下楼守到对面门口。他一边笑，一边打了个寒战。
        - id: ch01-b07
          speaker: laurie
          text: 一个人来，倒真像她会干的事。可她要是受了罪，总得有人送她回家。
        - id: ch01-b08
          speaker: narrator
          text: 十分钟后，乔满脸通红地跑下楼，像是刚刚熬过一场磨难。她看见劳里，一点儿也不高兴，只点点头便从他身边走过去。劳里立刻跟了上去。
        - id: ch01-b09
          speaker: laurie
          text: 很难受吧？
        - id: ch01-b10
          speaker: jo
          text: 不算太难受。
        - id: ch01-b11
          speaker: laurie
          text: 这么快就弄完了？
        - id: ch01-b12
          speaker: jo
          text: 对呀，谢天谢地！
        - id: ch01-b13
          speaker: laurie
          text: 怎么不叫人陪你？
        - id: ch01-b14
          speaker: jo
          text: 我不想让别人知道。
        - id: ch01-b15
          speaker: laurie
          text: 你真是我见过最怪的家伙。拔了几颗？
        - id: ch01-b16
          speaker: narrator
          text: 乔像是完全听不懂他在说什么，愣愣望了朋友一会儿，接着忽然大笑起来，仿佛有件事把她逗得不得了。
        - id: ch01-b17
          speaker: jo
          text: 我倒真想让两个东西出来，不过得再等一个星期。
        - id: ch01-b18
          speaker: laurie
          text: 你笑什么？乔，你一定又在偷偷捣鬼。
        - id: ch01-b19
          speaker: jo
          text: 你也在捣鬼。先生，刚才您在那家弹子房楼上干什么？
        - id: ch01-b20
          speaker: laurie
          text: 请太太明察，那不是弹子房，是体操馆。我在里面学击剑。
        - id: ch01-b21
          speaker: jo
          text: 那我就放心了。你可以教我。以后我们演《哈姆雷特》，你来扮雷欧提斯，击剑那一场准能演得很精彩。
        - id: ch01-b22
          speaker: narrator
          text: 劳里发出少年人又响又痛快的大笑，几个过路人听见，也不由自主地给逗笑了。
        - id: ch01-b23
          speaker: laurie
          text: 演不演戏，我都教你。击剑好玩极了，还能把你练得挺拔些。不过，你刚才说“放心了”，语气那么认真，应该不只是为了学剑吧？
        - id: ch01-b24
          speaker: jo
          text: 当然不只为了这个。我庆幸你没有去弹子房，因为我真希望你永远别去那种地方。你常去吗？
        - id: ch01-b25
          speaker: laurie
          text: 不常去。那也没什么坏处。家里虽然有弹子台，可没有好手陪着，玩起来没意思。我喜欢打球，所以偶尔去同内德·莫法特他们打一局。
        - id: ch01-b26
          speaker: jo
          text: 唉，那可真叫我难过。你会越来越喜欢，既浪费时间又浪费钱，最后跟那些讨厌的男孩子一个样。我原本还盼着你一直规规矩矩，让朋友们放心呢。
        - id: ch01-b27
          speaker: laurie
          text: 一个人偶尔找点无害的乐子，就不算规矩了吗？
        - id: ch01-b28
          speaker: jo
          text: 那得看在什么地方，又跟谁一起玩。我不喜欢内德那群人，也希望你别跟他们混。内德想来我们家，妈妈都不许。你要是变得跟他一样，她也不会再让我们像现在这样一起玩了。
        - id: ch01-b29
          speaker: laurie
          text: 她真的会不许？
        - id: ch01-b30
          speaker: jo
          text: 当然。妈妈最受不了赶时髦的公子哥儿。她宁肯把我们全塞进帽盒，也不让我们跟那种人来往。
        - id: ch01-b31
          speaker: laurie
          text: 那她还不用找帽盒。我不是那种人物，也不想变成那样。不过偶尔闹点无害的小乱子，我倒很喜欢。你不喜欢吗？
        - id: ch01-b32
          speaker: jo
          text: 喜欢，谁也不会计较。你尽管玩，可别胡来，好不好？不然，我们这些快活日子全得结束。
        - id: ch01-b33
          speaker: laurie
          text: 放心吧，我一定做个加倍提纯的圣人。
        - id: ch01-b34
          speaker: jo
          text: 我最受不了圣人。你只要朴实、诚实、规矩，我们就永远不会丢下你。要是你像金先生的儿子，我真不知道该怎么办。他有那么多钱，却不会好好花，喝醉、赌钱、逃跑，还冒签过父亲的名字吧。总之糟透了。
        - id: ch01-b35
          speaker: laurie
          text: 你觉得我也会干出那些事？真是多谢。
        - id: ch01-b36
          speaker: jo
          text: 不，不，我当然没那么想！可人们总说，钱太容易诱惑人。有时候我甚至希望你是个穷人，那样我就不用担心了。
        - id: ch01-b37
          speaker: laurie
          text: 乔，你会为我担心？
        - id: ch01-b38
          speaker: jo
          text: 有一点儿。你有时闷闷不乐，什么都不满意。你的意志又那么强，万一走错了路，我怕谁也拉不住你。
        - id: ch01-b39
          speaker: narrator
          text: 劳里沉默着走了好几分钟。乔在旁边悄悄看他，真后悔刚才没有及时闭紧嘴巴。劳里的嘴唇还挂着一点笑意，像是在取笑她那些警告，可他的眼睛里分明有了怒意。
        - id: ch01-b40
          speaker: laurie
          text: 你打算一路教训我，直到回家吗？你要讲到底，我就乘车。你要是不讲了，我愿意陪你走，还能告诉你一件特别有意思的事。
        - id: ch01-b41
          speaker: jo
          text: 我不再说教了，而且非常想听你的消息。
        - id: ch01-b42
          speaker: laurie
          text: 那就走吧。这是个秘密。我告诉你以后，你也得把自己的秘密交出来。
        - id: ch01-b43
          speaker: jo
          text: 我没有秘密。
        - id: ch01-b44
          speaker: narrator
          text: 话刚出口，乔忽然想起，自己的确藏着一件事，于是猛地住了嘴。
        - id: ch01-b45
          speaker: laurie
          text: 你明明有。你根本藏不住事，快招吧，不然我也不说。
        - id: ch01-b46
          speaker: jo
          text: 你的秘密是好事吗？
        - id: ch01-b47
          speaker: laurie
          text: 好得不得了！说的全是你认识的人，还有趣极了。我早想告诉你，憋到现在都难受。来，你先说。
        - id: ch01-b48
          speaker: jo
          text: 你不会回家告诉别人吧？私下里也不许拿它笑我。
        - id: ch01-b49
          speaker: laurie
          text: 一个字也不说。我什么时候取笑过人？
        - id: ch01-b50
          speaker: jo
          text: 你明明会。别人心里藏着什么，你想套就能套出来。我不知道你使了什么法子，可你天生就会哄人。
        - id: ch01-b51
          speaker: laurie
          text: 多谢夸奖。快说。
        - id: ch01-b52
          speaker: jo
          text: 我把两个故事交给一个办报的人了。他下星期给我答复。
        - id: ch01-b53
          speaker: narrator
          text: 乔贴着这位知心朋友的耳朵，悄声说出了秘密。
        - id: ch01-b54
          speaker: laurie
          text: 为大名鼎鼎的美国女作家马奇小姐欢呼！
          emotion: happy
        - id: ch01-b55
          speaker: narrator
          text: 劳里把帽子抛上天，又一把接住。他们已经出了城，两只鸭、四只猫、五只母鸡，还有半打爱尔兰孩子，都把这番表演看得开心极了。
        - id: ch01-b56
          speaker: jo
          text: 嘘！多半不会有结果。可我要是不试一试，心里总静不下来。我谁也没告诉，是不想让大家也跟着失望。
        - id: ch01-b57
          speaker: laurie
          text: 才不会失败！每天印出来的故事，有一大半都是废话。你的作品跟它们相比，简直像莎士比亚写的。等故事变成铅字，该多有意思！我们也会为自家的女作家骄傲。
        - id: ch01-b58
          speaker: narrator
          text: 乔的眼睛亮了起来。有人相信自己，总是一件快活的事。朋友的一句赞美，也比报纸上十二段吹捧更甜。
        - id: ch01-b59
          speaker: jo
          text: 你的秘密呢？泰迪，做人得公平。你再不说，我以后可不信你了。
        - id: ch01-b60
          speaker: narrator
          text: 劳里一句鼓励，便让希望在乔心里烧得亮亮的。她却还想把那团火压下去。
        - id: ch01-b61
          speaker: laurie
          text: 说出来也许会给我惹麻烦，不过我没答应过不说。每逢听见什么绝妙的消息，不告诉你，我就浑身不自在。我知道梅格的手套在哪儿。
        - id: ch01-b62
          speaker: jo
          text: 就这个？
        - id: ch01-b63
          speaker: narrator
          text: 劳里点点头，眼里闪着神秘的光。乔却满脸失望。
        - id: ch01-b64
          speaker: laurie
          text: 眼下这个就够了。等你听见地方，自然会同意。
        - id: ch01-b65
          speaker: jo
          text: 那你快说。
        - id: ch01-b66
          speaker: narrator
          text: 劳里俯到她耳边，只说了三个字。乔的脸立刻变了。她停下来盯了他片刻，又惊讶，又不高兴。接着，两人重新往前走。
        - id: ch01-b67
          speaker: jo
          text: 你怎么知道的？
        - id: ch01-b68
          speaker: laurie
          text: 我看见了。
        - id: ch01-b69
          speaker: jo
          text: 在哪儿？
        - id: ch01-b70
          speaker: laurie
          text: 口袋里。
        - id: ch01-b71
          speaker: jo
          text: 一直都在？
        - id: ch01-b72
          speaker: laurie
          text: 对呀。是不是很浪漫？
        - id: ch01-b73
          speaker: jo
          text: 才不浪漫，糟透了。
        - id: ch01-b74
          speaker: laurie
          text: 你不喜欢？
        - id: ch01-b75
          speaker: jo
          text: 当然不喜欢。这简直荒唐，家里不会答应的。真叫人受不了！梅格知道了会怎么说？
        - id: ch01-b76
          speaker: laurie
          text: 你不许告诉任何人。记住了。
        - id: ch01-b77
          speaker: jo
          text: 我又没答应。
        - id: ch01-b78
          speaker: laurie
          text: 这种事本来就不用说。我信你才告诉你的。
        - id: ch01-b79
          speaker: jo
          text: 好吧，眼下我不会说。可是我讨厌这件事，真希望你没有告诉我。
        - id: ch01-b80
          speaker: laurie
          text: 我以为你会高兴呢。
        - id: ch01-b81
          speaker: jo
          text: 有人想把梅格带走，我还会高兴？多谢，我才不会。
        - id: ch01-b82
          speaker: laurie
          text: 等有人来带走你，你就明白了。
        - id: ch01-b83
          speaker: jo
          text: 我倒要看看，谁敢来试！
          emotion: angry
        - id: ch01-b84
          speaker: laurie
          text: 我也很想看看！
        - id: ch01-b85
          speaker: narrator
          text: 劳里想到那副情景，忍不住咯咯直笑。
        - id: ch01-b86
          speaker: jo
          text: 秘密大概跟我犯冲。你一说完，我心里就像被揉皱了。
        - id: ch01-b87
          speaker: laurie
          text: 跟我赛跑冲下山坡，你马上就好了。
        - id: ch01-b88
          speaker: narrator
          text: 路上一个人影也没有，平坦的大道顺着坡势伸向山下，像在招呼他们痛痛快快赛上一场，实在太诱人。乔抵挡不住，立刻飞跑起来，很快把帽子和梳子落在后头，发夹也跑一路撒一路。劳里先到终点。他对自己的疗法十分满意，因为他的阿塔兰忒随后赶来时，长发飞扬，双眼发亮，双颊红扑扑的。虽然还在喘气，脸上却再也找不到半点不快。
        - id: ch01-b89
          speaker: jo
          text: 真希望我是匹马。那样我能在这么好的空气里一口气跑上几英里，还不会喘。刚才真痛快，可你瞧，我成了什么怪样子。好天使，替我把东西捡回来吧。
        - id: ch01-b90
          speaker: narrator
          text: 乔在一棵枫树下坐下来。深红的落叶铺满坡地，仿佛一层漂亮的地毯。劳里慢悠悠地去捡散落的东西，乔赶紧把辫子拢好，只盼自己重新整齐以前不要有人经过。偏偏梅格就在这时候来了。她刚探望亲友回来，穿着最体面的礼服，举止和打扮都显得格外端庄。
        - id: ch01-b91
          speaker: meg
          text: 你到底在这里做什么？
        - id: ch01-b92
          speaker: jo
          text: 我在捡树叶。
        - id: ch01-b93
          speaker: narrator
          text: 乔答得温顺，一边整理怀里那捧红叶。劳里也回来了，把半打发夹丢进她的裙兜。
        - id: ch01-b94
          speaker: laurie
          text: 还在捡发夹。这条路上会长发夹，也会长梳子和棕色草帽呢。
        - id: ch01-b95
          speaker: meg
          text: 乔，你们又赛跑了。怎么能这样？你什么时候才肯收起这套疯闹的脾气？
        - id: ch01-b96
          speaker: narrator
          text: 梅格理了理袖口，又抚平被风吹乱的头发。
        - id: ch01-b97
          speaker: jo
          text: 等我老得浑身僵硬，非拄拐杖不可，我才会收。梅格，别逼我太早长大。你突然变了样，已经够让我难受了。能做多久小姑娘，就让我做多久吧。
          emotion: sad
        - id: ch01-b98
          speaker: narrator
          text: 乔低头去看怀里的树叶，好遮住微微发颤的嘴唇。近来，她总觉得玛格丽特很快就要成为一个真正的女人。劳里的秘密更让她害怕那场迟早会来的分离。过去还很遥远的事情，如今好像已经到了眼前。劳里看见了她脸上的难过，马上把梅格的注意力引开。
        - id: ch01-b99
          speaker: laurie
          text: 穿得这么漂亮，刚才去哪家拜访了？
        - id: ch01-b100
          speaker: meg
          text: 去了加德纳家。萨莉把贝尔·莫法特的婚礼从头到尾讲给我听。婚礼豪华极了，他们已经到巴黎过冬去了。那该多快活呀！
        - id: ch01-b101
          speaker: laurie
          text: 你羡慕她吗，梅格？
        - id: ch01-b102
          speaker: meg
          text: 恐怕有一点。
        - id: ch01-b103
          speaker: jo
          text: 那我倒高兴了！
        - id: ch01-b104
          speaker: meg
          text: 为什么？
        - id: ch01-b105
          speaker: jo
          text: 你要是那么看重财富，就绝不会跑去嫁给一个穷人。
        - id: ch01-b106
          speaker: narrator
          text: 乔狠狠系上帽带，又朝劳里皱眉。劳里正无声地提醒她，千万管住嘴。
        - id: ch01-b107
          speaker: meg
          text: 我绝不会“跑去嫁给”任何人。
        - id: ch01-b108
          speaker: narrator
          text: 梅格说得神气十足，随后昂着头往前走。乔和劳里跟在后面，时而笑，时而说悄悄话，还拿石子打水漂。在梅格看来，他们简直像孩子一样胡闹。不过，她若没穿着最好的裙子，说不定也会忍不住加入。
        - id: ch01-b109
          speaker: narrator
          text: 此后的一两个星期，乔古怪得让姐妹们摸不着头脑。邮差一摇铃，她就冲去开门。每逢遇见布鲁克先生，她总故意不客气。她还会愁眉苦脸地坐着，久久望着梅格，忽然又跳起来，把姐姐摇上一通，再莫名其妙地亲她一口。乔和劳里不停向彼此打暗号，嘴里又总说着“展翅之鹰”，姑娘们都认定这两个人一起疯了。到了第二个星期六，梅格正在窗前做针线，看见劳里追着乔跑遍花园，最后在艾米的凉亭里抓住了她，简直觉得有伤体面。她看不见凉亭里发生了什么，只听见一阵放声大笑，接着是低低的说话声，还有报纸哗啦啦拍动的声音。
        - id: ch01-b110
          speaker: meg
          text: 这个姑娘可怎么办？她一辈子也学不会淑女的样子。
        - id: ch01-b111
          speaker: beth
          text: 我倒希望她永远别学会。乔现在这样，又有趣又可爱。
        - id: ch01-b112
          speaker: narrator
          text: 乔把秘密告诉了别人，贝丝心里其实有一点点受伤，却从没让人看出来。
        - id: ch01-b113
          speaker: amy
          text: 真叫人伤脑筋。我们永远也别想教她学会“上流仪台”。
        - id: ch01-b114
          speaker: narrator
          text: 艾米正给自己做新的荷叶边，鬈发也扎得格外漂亮。这两件称心的事，让她觉得自己分外优雅，俨然已经是位淑女。几分钟后，乔蹦进屋，往沙发上一躺，装模作样地看起报纸。
        - id: ch01-b115
          speaker: meg
          text: 报上有什么有趣的东西吗？
        - id: ch01-b116
          speaker: jo
          text: 不过是个故事。我看也没多大意思。
        - id: ch01-b117
          speaker: narrator
          text: 她小心藏住报纸的名字。
        - id: ch01-b118
          speaker: amy
          text: 那就念给大家听吧。既能让我们解闷，也能叫你安分一会儿。
        - id: ch01-b119
          speaker: beth
          text: 故事叫什么名字？
        - id: ch01-b120
          speaker: narrator
          text: 贝丝不明白，乔为什么一直把脸躲在报纸后面。
        - id: ch01-b121
          speaker: jo
          text: 《两位敌手画家》。
        - id: ch01-b122
          speaker: meg
          text: 听起来不错。念吧。
        - id: ch01-b123
          speaker: narrator
          text: 乔大声清清嗓子，又深吸一口气，然后飞快地读起来。姑娘们越听越有兴致。这个故事既浪漫，又有些凄惨，因为大多数人物到结尾都死了。乔停下来时，艾米先开了口。
        - id: ch01-b124
          speaker: amy
          text: 那幅华美图画的部分，我最喜欢。
        - id: ch01-b125
          speaker: meg
          text: 我更喜欢谈情说爱的部分。维奥拉和安杰洛，正好都是我们喜欢的名字，真巧。可那段爱情太悲惨了。
          emotion: sad
        - id: ch01-b126
          speaker: narrator
          text: 梅格擦着眼泪。贝丝却已经从报纸边上瞥见了乔的脸。
        - id: ch01-b127
          speaker: beth
          text: 这是谁写的？
        - id: ch01-b128
          speaker: narrator
          text: 念报的人忽然坐直，把报纸扔到一旁。藏在报纸后面的脸终于露了出来，涨得通红。乔的神情又郑重、又兴奋，模样实在有点滑稽。
        - id: ch01-b129
          speaker: jo
          text: 是你们的姐姐妹妹写的。
          emotion: happy
        - id: ch01-b130
          speaker: meg
          text: 是你？
          emotion: surprised
        - id: ch01-b131
          speaker: narrator
          text: 梅格惊得连手里的活儿都掉了。
        - id: ch01-b132
          speaker: amy
          text: 写得很不错。
        - id: ch01-b133
          speaker: beth
          text: 我就知道！我就知道！啊，我的乔，我真为你骄傲！
          emotion: happy
        - id: ch01-b134
          speaker: narrator
          text: 贝丝跑过去抱住乔，为这场了不起的成功欢喜不已。其他人也一个比一个高兴。梅格怎么都不肯相信，直到亲眼看见报上当真印着“约瑟芬·马奇小姐”。艾米宽宏大量地评论故事里的艺术，还替续篇出了不少主意。可男女主人公全死了，当然没法再续。贝丝激动得又蹦又唱。汉娜也走了进来，听说这是“那个乔干的”，惊讶得不得了。
        - id: ch01-b135
          speaker: hannah
          text: 老天爷呀，我这辈子还没见过这样的事！
          emotion: surprised
        - id: ch01-b136
          speaker: narrator
          text: 马奇太太知道以后，心里别提多骄傲。乔眼里含着泪，却一直笑个不停，还说自己不如索性变成一只孔雀算了。报纸从这双手传到那双手，人人都舍不得放下。那只“展翅之鹰”也仿佛正在马奇家上空得意扬扬地拍着翅膀。
        - id: ch01-b137
          speaker: family
          text: 快给我们讲讲！报纸什么时候来的？你拿到稿费了吗？爸爸会怎么说？劳里准会笑吧？
          emotion: happy
        - id: ch01-b138
          speaker: narrator
          text: 一家人亲亲热热地围住乔，兴奋得接连发问，谁也等不及听完前一个答案。这群傻乎乎却满怀爱意的人，家里每有一点小小的喜事，都要欢庆得像过节一样。
        - id: ch01-b139
          speaker: jo
          text: 姑娘们，别叽叽喳喳啦，我全都告诉你们。我去听答复时，那个人说两个故事他都喜欢。可他不给刚入门的作者付钱，只让他们在报上发表，也会替故事说几句好话。他说这样正好练笔，等新手写得更好了，自然会有人肯付钱。于是，我把两个故事都留给他。今天这份报纸寄到家里，劳里正好撞见我拿着它，非看不可，我就给他看了。他说故事写得好，还说我应该继续写，下一篇他一定替我争到稿费。我太快活了。慢慢地，我也许能养活自己，还能帮上姐妹们。
          emotion: happy
        - id: ch01-b140
          speaker: narrator
          text: 乔一口气说到这里，终于没了气力。她拿报纸蒙住头，让几滴再自然不过的眼泪落在自己刚刚刊出的那篇小故事上。能够靠自己独立生活，又能得到所爱之人的赞许，正是她心底最珍贵的两个愿望。这一次得来的小小成功，让那个愿望不再只是遥远的梦。它似乎就是通往幸福终点的第一步。
