  chapters:
    - id: ch01
      title: Secrets
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: October had turned chilly, and the afternoons were growing short. That kept Jo very busy up in the garret. For two or three hours each day, warm sunlight poured through the high window. Jo sat on the old sofa, writing hard, with her papers spread across a trunk. Above her, Scrabble the rat strolled along the beams with his oldest son, a handsome young fellow who seemed very proud of his whiskers.
        - id: ch01-b02
          speaker: narrator
          text: Jo was so deep in her work that she kept scribbling until the final page was full. Then she signed her name with a flourish, dropped her pen, and spoke.
        - id: ch01-b03
          speaker: jo
          text: There! I've done the best I can. If this isn't good enough, I'll have to wait until I can do better.
        - id: ch01-b04
          speaker: narrator
          text: She leaned back and read the whole manuscript carefully. Here she struck out a line. There she added an exclamation point, shaped like a tiny balloon. At last she tied the pages with a smart red ribbon. For a moment she sat looking at them, sober and wistful. She had put her whole heart into that work.
        - id: ch01-b05
          speaker: narrator
          text: Jo's garret desk was an old tin kitchen hanging on the wall. It held her papers and a few books where Scrabble could not reach them. He had literary tastes of his own and liked to turn any book left nearby into a circulating library by eating its pages. Jo took a second manuscript from the tin box, slipped both into her pocket, and crept downstairs. Behind her, the rats began nibbling her pens and tasting her ink.
        - id: ch01-b06
          speaker: narrator
          text: Without a sound, Jo put on her hat and jacket. She climbed through the back entry window onto the low porch roof, swung down to the grassy bank, and reached the road by a roundabout path. Once there, she settled herself, waved down an omnibus, and rode toward town looking merry and mysterious.
        - id: ch01-b07
          speaker: narrator
          text: In town, her behavior grew stranger still. She hurried to a certain address on a busy street. After some trouble, she found it, stepped into the doorway, and stared up the dirty stairs. Then she froze. A minute later she dashed back outside and hurried away as fast as she had come. She returned and repeated the whole strange performance several times. Across the street, a black-eyed young gentleman lounging at a window watched her retreats and returns with great amusement.
        - id: ch01-b08
          speaker: narrator
          text: On her third return, Jo gave herself a shake, pulled her hat low over her eyes, and marched upstairs as if she were about to have every tooth pulled.
        - id: ch01-b09
          speaker: narrator
          text: Among the signs at the entrance was one for a dentist. A pair of false jaws slowly opened and closed beneath it, showing off a fine set of teeth. The young gentleman saw them, put on his coat, and crossed over to wait in the opposite doorway.
        - id: ch01-b10
          speaker: laurie
          text: Of course she'd come alone. But if it goes badly, she'll need someone to help her home.
        - id: ch01-b11
          speaker: narrator
          text: Ten minutes later, Jo ran downstairs. Her face was bright red, and she looked as though she had survived a terrible ordeal. The sight of Laurie did not please her. She gave him a short nod and walked past, but he followed with a sympathetic look.
        - id: ch01-b12
          speaker: laurie
          text: Was it awful?
        - id: ch01-b13
          speaker: jo
          text: Not too awful.
        - id: ch01-b14
          speaker: laurie
          text: That was quick.
        - id: ch01-b15
          speaker: jo
          text: Yes, thank goodness.
        - id: ch01-b16
          speaker: laurie
          text: Why did you come by yourself?
        - id: ch01-b17
          speaker: jo
          text: I didn't want anybody to know.
        - id: ch01-b18
          speaker: laurie
          text: You are the strangest fellow I know. How many teeth did he take out?
        - id: ch01-b19
          speaker: narrator
          text: Jo stared at him, puzzled. Then she understood and burst out laughing.
        - id: ch01-b20
          speaker: jo
          text: There are two things I want to have come out, but I have to wait a week.
        - id: ch01-b21
          speaker: laurie
          text: What's so funny? You're hiding some mischief, Jo.
        - id: ch01-b22
          speaker: jo
          text: So are you. What were you doing upstairs in that billiard saloon, sir?
        - id: ch01-b23
          speaker: laurie
          text: Excuse me, ma'am, but that was a gymnasium. I was having a fencing lesson.
        - id: ch01-b24
          speaker: jo
          text: Oh, good. I'm glad.
        - id: ch01-b25
          speaker: laurie
          text: Why?
        - id: ch01-b26
          speaker: jo
          text: You can teach me. Then when we put on Hamlet, you can play Laertes, and our fencing scene will be splendid.
        - id: ch01-b27
          speaker: narrator
          text: Laurie gave such a hearty boyish laugh that several people passing by smiled too.
        - id: ch01-b28
          speaker: laurie
          text: I'll teach you whether we do Hamlet or not. Fencing is great fun, and it'll straighten you up nicely. But that isn't the only reason you were so glad, is it?
        - id: ch01-b29
          speaker: jo
          text: No. I was glad you weren't in the saloon. I hope you never go to places like that. Do you?
        - id: ch01-b30
          speaker: laurie
          text: Not very often.
        - id: ch01-b31
          speaker: jo
          text: I wish you wouldn't go at all.
        - id: ch01-b32
          speaker: laurie
          text: There's no harm in it, Jo. I have a billiard table at home, but playing alone is no fun. I enjoy the game, so sometimes I go there and play with Ned Moffat or some of the other fellows.
        - id: ch01-b33
          speaker: jo
          text: Oh, Laurie, I'm sorry. You'll like it more and more, waste your time and money, and turn into one of those dreadful boys. I hoped you'd stay respectable and make your friends proud.
          emotion: sad
        - id: ch01-b34
          speaker: laurie
          text: Can't a fellow have a little harmless fun now and then without ruining his good name?
          emotion: angry
        - id: ch01-b35
          speaker: jo
          text: It depends on the fun and where he has it. I don't like Ned or his friends, and I wish you'd keep away from them. Mother won't let Ned visit us, though he wants to. If you become like him, she won't let us have our good times together anymore.
        - id: ch01-b36
          speaker: laurie
          text: She wouldn't?
        - id: ch01-b37
          speaker: jo
          text: No. She can't stand fashionable young men. She'd pack all of us into bandboxes before she'd let us spend time with them.
        - id: ch01-b38
          speaker: laurie
          text: She can leave the bandboxes put away. I'm not fashionable, and I don't intend to be. But I do enjoy a harmless lark sometimes. Don't you?
        - id: ch01-b39
          speaker: jo
          text: Of course. Nobody objects to that. Have your larks, but don't go wild, will you? If you do, all our good times will be over.
        - id: ch01-b40
          speaker: laurie
          text: Very well. I'll become a twice-purified saint.
        - id: ch01-b41
          speaker: jo
          text: I can't bear saints. Just be a plain, honest, respectable boy, and we'll never desert you. Think of Mr. King's son. He had plenty of money and no idea how to use it. He drank, gambled, ran away, and even forged his father's name, or so I heard. He was horrid.
        - id: ch01-b42
          speaker: laurie
          text: And you think I'm going to do all that? Thank you very much.
        - id: ch01-b43
          speaker: jo
          text: No! Of course I don't. But people say money can be a terrible temptation. Sometimes I wish you were poor, because then I wouldn't worry.
        - id: ch01-b44
          speaker: laurie
          text: You worry about me, Jo?
        - id: ch01-b45
          speaker: jo
          text: A little. Sometimes you look so moody and dissatisfied. And your will is so strong that if you ever started down the wrong road, I think you'd be very hard to stop.
        - id: ch01-b46
          speaker: narrator
          text: Laurie walked without speaking for several minutes. Jo kept watching him and wished she had held her tongue. His eyes looked angry, even though his lips smiled as if her warnings were nothing. At last, he spoke.
        - id: ch01-b47
          speaker: laurie
          text: Are you planning to lecture me all the way home?
        - id: ch01-b48
          speaker: jo
          text: No, of course not. Why?
        - id: ch01-b49
          speaker: laurie
          text: Because if you are, I'll take the bus. If you're finished, I'd rather walk with you and tell you something very interesting.
        - id: ch01-b50
          speaker: jo
          text: I won't preach anymore, and I desperately want to hear your news.
        - id: ch01-b51
          speaker: laurie
          text: Good. It's a secret. If I tell you mine, you have to tell me yours.
        - id: ch01-b52
          speaker: jo
          text: I don't have any secrets.
        - id: ch01-b53
          speaker: narrator
          text: Jo stopped. Suddenly, she remembered that she did.
        - id: ch01-b54
          speaker: laurie
          text: You know you do. You can't hide a thing. Confess, or I won't tell.
        - id: ch01-b55
          speaker: jo
          text: Is yours a good secret?
        - id: ch01-b56
          speaker: laurie
          text: It's wonderful! It's about people you know, and it's great fun. I've been dying to tell you. Come on, you go first.
        - id: ch01-b57
          speaker: jo
          text: You won't say anything at home, will you?
        - id: ch01-b58
          speaker: laurie
          text: Not one word.
        - id: ch01-b59
          speaker: jo
          text: And you won't tease me when we're alone?
        - id: ch01-b60
          speaker: laurie
          text: I never tease.
        - id: ch01-b61
          speaker: jo
          text: Yes, you do. Somehow you coax everything you want out of people. You were born knowing how to wheedle.
        - id: ch01-b62
          speaker: laurie
          text: Thank you. Now tell me.
        - id: ch01-b63
          speaker: jo
          text: I left two stories with a newspaperman. He'll give me his answer next week.
        - id: ch01-b64
          speaker: laurie
          text: Hurrah for Miss March, the famous American author!
          emotion: happy
        - id: ch01-b65
          speaker: narrator
          text: Laurie tossed his hat into the air and caught it again. They were beyond the city now, and the performance delighted two ducks, four cats, five hens, and half a dozen Irish children.
        - id: ch01-b66
          speaker: jo
          text: Hush! It probably won't lead to anything. But I couldn't rest until I tried. I kept quiet because I didn't want everyone else to be disappointed too.
        - id: ch01-b67
          speaker: laurie
          text: You won't fail. Jo, your stories are Shakespeare compared with half the trash printed every day. Just think of seeing them in print! We'll be so proud of our author.
        - id: ch01-b68
          speaker: narrator
          text: Jo's eyes shone. It is always good to have someone believe in you, and one friend's praise is sweeter than a dozen flattering newspaper notices. Still, she tried to put out the bright hopes his encouragement had kindled.
        - id: ch01-b69
          speaker: jo
          text: Now where's your secret? Be fair, Teddy, or I'll never trust you again.
        - id: ch01-b70
          speaker: laurie
          text: I may get into trouble for telling, but I never promised to keep quiet. And I can't feel easy until I've shared a juicy piece of news with you. I know where Meg's glove is.
        - id: ch01-b71
          speaker: jo
          text: That's all?
        - id: ch01-b72
          speaker: narrator
          text: Jo looked disappointed. Laurie only nodded, his eyes twinkling with mystery.
        - id: ch01-b73
          speaker: laurie
          text: It's enough. You'll agree when I tell you where it is.
        - id: ch01-b74
          speaker: jo
          text: Then tell me.
        - id: ch01-b75
          speaker: narrator
          text: Laurie leaned over and whispered three words in her ear. Jo's face changed comically. She stood staring at him, surprised and displeased. Then she marched on.
        - id: ch01-b76
          speaker: jo
          text: How do you know?
        - id: ch01-b77
          speaker: laurie
          text: I saw it.
        - id: ch01-b78
          speaker: jo
          text: Where?
        - id: ch01-b79
          speaker: laurie
          text: In his pocket.
        - id: ch01-b80
          speaker: jo
          text: He's had it all this time?
        - id: ch01-b81
          speaker: laurie
          text: Yes. Isn't it romantic?
        - id: ch01-b82
          speaker: jo
          text: No, it's horrible.
        - id: ch01-b83
          speaker: laurie
          text: You don't like it?
        - id: ch01-b84
          speaker: jo
          text: Of course not. It's ridiculous, and it won't be allowed. Goodness, what would Meg say?
        - id: ch01-b85
          speaker: laurie
          text: Remember, you can't tell anybody.
        - id: ch01-b86
          speaker: jo
          text: I never promised that.
        - id: ch01-b87
          speaker: laurie
          text: It was understood. I trusted you.
        - id: ch01-b88
          speaker: jo
          text: All right, I won't tell for now. But I hate it, and I wish you hadn't told me.
        - id: ch01-b89
          speaker: laurie
          text: I thought you'd be pleased.
        - id: ch01-b90
          speaker: jo
          text: Pleased that someone might take Meg away? No, thank you.
        - id: ch01-b91
          speaker: laurie
          text: You'll understand better when someone comes to take you away.
        - id: ch01-b92
          speaker: jo
          text: I'd like to see anybody try!
          emotion: angry
        - id: ch01-b93
          speaker: laurie
          text: So would I!
        - id: ch01-b94
          speaker: narrator
          text: Laurie chuckled at the thought.
        - id: ch01-b95
          speaker: jo
          text: Secrets don't agree with me. Ever since you told me, my mind has felt all rumpled up.
        - id: ch01-b96
          speaker: laurie
          text: Race me down the hill. That'll smooth it out.
        - id: ch01-b97
          speaker: narrator
          text: No one was in sight, and the smooth road sloped invitingly ahead. Jo could not resist. She shot away, leaving her hat and comb behind and scattering hairpins as she ran. Laurie reached the bottom first. His cure had worked. Jo came racing after him with flying hair, bright eyes, red cheeks, and no displeasure left in her face.
        - id: ch01-b98
          speaker: jo
          text: I wish I were a horse. Then I could run for miles in this glorious air without losing my breath. That was splendid, but look what it's done to me. Be a cherub and go pick up my things.
        - id: ch01-b99
          speaker: narrator
          text: Jo dropped beneath a maple tree, where crimson leaves carpeted the bank. Laurie strolled away to gather her belongings, while she bundled up her braids and hoped no one would pass before she looked tidy again.
        - id: ch01-b100
          speaker: narrator
          text: But someone did pass. It was Meg, looking especially ladylike in her best visiting dress. She had been making calls.
        - id: ch01-b101
          speaker: meg
          text: What in the world are you doing here?
        - id: ch01-b102
          speaker: jo
          text: Gathering leaves.
        - id: ch01-b103
          speaker: narrator
          text: Jo meekly sorted the rosy handful she had swept up.
        - id: ch01-b104
          speaker: laurie
          text: And hairpins.
        - id: ch01-b105
          speaker: narrator
          text: Laurie tossed half a dozen into Jo's lap.
        - id: ch01-b106
          speaker: laurie
          text: Hairpins grow along this road, Meg. So do combs and brown straw hats.
        - id: ch01-b107
          speaker: meg
          text: You've been running, Jo. How could you? When will you give up these wild games?
        - id: ch01-b108
          speaker: narrator
          text: Meg straightened her cuffs and smoothed the hair the wind had disturbed.
        - id: ch01-b109
          speaker: jo
          text: Never, not until I'm stiff and old and need a crutch. Don't make me grow up before I have to, Meg. It's hard enough that you've changed so suddenly. Let me be a little girl as long as I can.
          emotion: sad
        - id: ch01-b110
          speaker: narrator
          text: Jo bent over the leaves to hide her trembling lips. Lately, Margaret had been turning into a woman so quickly. Laurie's secret made Jo fear the separation that must come someday, and now it seemed very close. Laurie saw her distress and quickly drew Meg's attention away.
        - id: ch01-b111
          speaker: laurie
          text: Where have you been calling in all that finery?
        - id: ch01-b112
          speaker: meg
          text: At the Gardiners'. Sallie told me all about Belle Moffat's wedding. It was magnificent, and they've gone to Paris for the winter. Imagine how lovely that must be!
        - id: ch01-b113
          speaker: laurie
          text: Do you envy her, Meg?
        - id: ch01-b114
          speaker: meg
          text: I'm afraid I do.
        - id: ch01-b115
          speaker: jo
          text: Good!
        - id: ch01-b116
          speaker: narrator
          text: Jo tied on her hat with a sharp tug.
        - id: ch01-b117
          speaker: meg
          text: Why is that good?
        - id: ch01-b118
          speaker: jo
          text: Because if riches matter so much to you, you'll never run off and marry a poor man.
        - id: ch01-b119
          speaker: narrator
          text: Jo frowned at Laurie, who silently warned her to watch what she said.
        - id: ch01-b120
          speaker: meg
          text: I will never run off and marry anybody.
        - id: ch01-b121
          speaker: narrator
          text: Meg walked on with great dignity. Jo and Laurie followed behind, laughing, whispering together, and skipping stones along the road. Meg told herself they were behaving like children. Still, she might have been tempted to join them if she had not been wearing her best dress.
        - id: ch01-b122
          speaker: narrator
          text: For the next week or two, Jo acted so strangely that her sisters could not understand her. Whenever the postman rang, she rushed to the door. She was rude to Mr. Brooke whenever they met. She stared sadly at Meg, then sometimes jumped up to shake her and kiss her for no apparent reason. Jo and Laurie exchanged secret signals and kept talking about Spread Eagles until the other girls declared they had both lost their minds.
        - id: ch01-b123
          speaker: narrator
          text: On the second Saturday after Jo's escape through the window, Meg sat sewing by her own window. She looked out and was scandalized to see Laurie chasing Jo through the garden. He pursued her all around it and finally caught her in Amy's bower. The leaves hid whatever happened next from Meg's view. First she heard shrieks of laughter. Then came a murmur of voices and the great flapping of newspapers.
        - id: ch01-b124
          speaker: meg
          text: What are we going to do with that girl? She will never learn to behave like a young lady.
        - id: ch01-b125
          speaker: beth
          text: I hope she never does. She's so funny and dear just as she is.
        - id: ch01-b126
          speaker: narrator
          text: Beth had never admitted that she felt a little hurt when Jo shared secrets with anyone but her.
        - id: ch01-b127
          speaker: amy
          text: It is very trying. We'll never make her comme il faut.
        - id: ch01-b128
          speaker: narrator
          text: Amy was making new ruffles for herself. Her curls were tied up becomingly, and those two pleasant facts made her feel unusually elegant and grown-up.
        - id: ch01-b129
          speaker: narrator
          text: A few minutes later, Jo bounced into the room, threw herself onto the sofa, and pretended to read.
        - id: ch01-b130
          speaker: meg
          text: Is there anything interesting in that paper?
        - id: ch01-b131
          speaker: jo
          text: Only a story. I don't suppose it's worth much.
        - id: ch01-b132
          speaker: narrator
          text: Jo carefully kept the newspaper's name out of sight.
        - id: ch01-b133
          speaker: amy
          text: You should read it aloud. That will entertain us and keep you out of trouble.
        - id: ch01-b134
          speaker: beth
          text: What's it called?
        - id: ch01-b135
          speaker: narrator
          text: Beth wondered why Jo was hiding behind the paper.
        - id: ch01-b136
          speaker: jo
          text: The Rival Painters.
        - id: ch01-b137
          speaker: meg
          text: That sounds promising. Read it to us.
        - id: ch01-b138
          speaker: narrator
          text: Jo cleared her throat loudly, drew one long breath, and read at top speed. The girls listened with interest. The story was romantic and rather sad, since most of its characters died at the end. When Jo paused, Amy gave her judgment.
        - id: ch01-b139
          speaker: amy
          text: I like the part about the magnificent picture.
        - id: ch01-b140
          speaker: meg
          text: I like the love story best. Viola and Angelo are two of our favorite names. Isn't that strange?
        - id: ch01-b141
          speaker: narrator
          text: Meg wiped her eyes because the lovers' story had ended tragically.
        - id: ch01-b142
          speaker: beth
          text: Who wrote it?
        - id: ch01-b143
          speaker: narrator
          text: Beth had caught a glimpse of Jo's face. Jo suddenly sat upright and threw down the paper. Her cheeks were flushed, and she looked both solemn and excited. Then she announced the answer in a ringing voice.
        - id: ch01-b144
          speaker: jo
          text: Your sister!
          emotion: happy
        - id: ch01-b145
          speaker: meg
          text: You wrote it?
          emotion: surprised
        - id: ch01-b146
          speaker: narrator
          text: Meg dropped her sewing.
        - id: ch01-b147
          speaker: amy
          text: It is very good.
        - id: ch01-b148
          speaker: beth
          text: I knew it! I knew it! Oh, Jo, I'm so proud of you!
          emotion: happy
        - id: ch01-b149
          speaker: narrator
          text: Beth ran to hug her sister and rejoice over the splendid success. What a celebration followed! Meg refused to believe it at first. Then she found the words "Miss Josephine March" actually printed in the newspaper. Amy graciously criticized every artistic passage and offered several helpful ideas for a sequel. Unfortunately, none of them could be used because Jo had killed both the hero and heroine.
        - id: ch01-b150
          speaker: narrator
          text: Beth skipped and sang for joy. Hannah hurried in, astonished by all the noise.
        - id: ch01-b151
          speaker: hannah
          text: Sakes alive! Well, I never! Just look what our Jo has done!
          emotion: surprised
        - id: ch01-b152
          speaker: narrator
          text: Marmee was proud when she heard the news. Jo laughed with tears standing in her eyes. With everyone praising her, she declared that she might as well turn into a peacock and be done with it. The newspaper passed eagerly from hand to hand, like a Spread Eagle flapping its wings in triumph over the March home.
        - id: ch01-b153
          speakers: [meg, beth, amy, marmee]
          ensemble: chorus
          text: Tell us everything! When did it arrive? Did they pay you? What will Father say? Won't Laurie laugh?
        - id: ch01-b154
          speaker: narrator
          text: The family crowded around Jo, all talking at once. These foolish, loving people made a festival out of every small happiness that came to their home.
        - id: ch01-b155
          speaker: jo
          text: Stop chattering, all of you, and I'll explain.
        - id: ch01-b156
          speaker: narrator
          text: Jo wondered whether Miss Burney had felt any grander about Evelina than she felt about The Rival Painters. She told them how she had offered her stories to the newspaper, then explained what happened next.
        - id: ch01-b157
          speaker: jo
          text: When I went back for the answer, the man said he liked both stories. He doesn't pay beginners. He only prints their work and gives it a notice in the paper. He said that was good practice, and once a beginner improves, somebody will pay. So I let him keep both stories. This one arrived today. Laurie caught me with it and insisted on reading it, so I let him. He says it's good, and I'm going to write more. He means to get me paid for the next one. I'm so happy, because someday I may earn enough to support myself and help you girls.
        - id: ch01-b158
          speaker: narrator
          text: Jo ran out of breath. She wrapped the newspaper around her head and sprinkled her little story with a few honest tears. More than anything, she longed to be independent and to earn the praise of the people she loved. This seemed like the first step toward that happy end.
