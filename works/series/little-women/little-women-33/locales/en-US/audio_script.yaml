audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "warm, observant, and gently playful", timbre: "clear and inviting", pace: measured, pitch: medium}
    mrs_march:
      display_name: Mrs. March
      tts: {delivery: "motherly, practical, and quietly wise", timbre: "warm and steady", pace: measured, pitch: medium-low}
    jo:
      display_name: Jo
      tts: {delivery: "quick, candid, and spirited", timbre: "bright and slightly husky", pace: lively, pitch: medium-low}
    beth:
      display_name: Beth
      tts: {delivery: "quiet, tender, and earnest", timbre: "soft and airy", pace: unhurried, pitch: medium-high}
    laurie:
      display_name: Laurie
      tts: {delivery: "playful, confident, and warmly teasing", timbre: "youthful and resonant", pace: lively, pitch: medium}
  chapters:
    - id: ch01
      title: Beth's Secret Trouble
      blocks:
        - id: ch01-b01
          speaker: mrs_march
          text: Jo, I'm worried about Beth.
        - id: ch01-b02
          speaker: jo
          text: Why, Mother? She's seemed stronger than usual since the babies came.
        - id: ch01-b03
          speaker: mrs_march
          text: It isn't her health this time. It's her spirits. Something is troubling her, and I want you to find out what it is.
        - id: ch01-b04
          speaker: jo
          text: What makes you think that?
        - id: ch01-b05
          speaker: mrs_march
          text: She spends so much time alone now, and she doesn't talk with Father the way she used to. The other day, I found her crying over the babies. Every song she sings is sad, and sometimes there's a look on her face that I can't understand. That isn't like Beth. It worries me.
        - id: ch01-b06
          speaker: jo
          text: Have you tried asking her?
        - id: ch01-b07
          speaker: mrs_march
          text: Once or twice. She either slips away from the question or looks so unhappy that I stop. I won't force my children to confide in me. Usually, I don't have to wait long.
        - id: ch01-b08
          speaker: narrator
          text: Mrs. March looked across at Jo as she said this. Jo seemed unaware of any hidden trouble except Beth's. She sewed in silence for a moment before answering.
        - id: ch01-b09
          speaker: jo
          text: Maybe she's simply growing up. Then the dreams begin, along with hopes and fears and restless feelings you can't explain. Beth is eighteen, Mother. We forget that. We still treat her like a child, but she's a woman now.
        - id: ch01-b10
          speaker: mrs_march
          text: So she is. Oh, my dear, you all grow up so quickly.
        - id: ch01-b11
          speaker: jo
          text: You can't prevent it, Marmee. You'll have to let your birds hop out of the nest one at a time and accept all the worries that come with it. If it helps, I promise I won't hop very far.
        - id: ch01-b12
          speaker: mrs_march
          text: It helps a great deal. Since Meg left, I always feel stronger when you're home. Beth is too frail and Amy is still too young for me to lean on. But when hard times come, you're always ready.
        - id: ch01-b13
          speaker: jo
          text: Hard jobs don't bother me. Every family needs one person for the scrubbing. Amy is wonderful at elegant work, and I'm not. But give me all the carpets to pull up or half the family sick at once, and I'm in my element. Amy can make a name for herself abroad. When something goes wrong at home, I'm your man.
        - id: ch01-b14
          speaker: mrs_march
          text: Then I'll leave Beth in your care. She'll open that tender heart to her Jo before anyone else. Be gentle, and don't let her suspect that we've been watching her or talking about her. If only she could become strong and cheerful again, I wouldn't ask for anything else in the world.
        - id: ch01-b15
          speaker: jo
          text: What a fortunate woman! I have piles of wishes.
        - id: ch01-b16
          speaker: mrs_march
          text: What are they, dear?
        - id: ch01-b17
          speaker: jo
          text: First I'll take care of Bethy's trouble. Then I'll tell you mine. They aren't wearing me out, so they can wait.
        - id: ch01-b18
          speaker: narrator
          text: Jo gave a knowing nod and went on stitching. For the moment, at least, her mother felt easier about her.
        - id: ch01-b19
          speaker: narrator
          text: Jo appeared busy with her own affairs, but all the while she watched Beth. Many different explanations came to her. At last, one small event seemed to give her the answer, and Jo's lively imagination and loving heart supplied everything else.
        - id: ch01-b20
          speaker: narrator
          text: One Saturday afternoon, the sisters were alone. Jo pretended to be deep in her writing, though she kept glancing at Beth by the window. Beth's sewing often slipped into her lap. She rested her head on one hand and stared sadly at the dull autumn view outside.
        - id: ch01-b21
          speaker: laurie
          text: Everything all right? I'm coming over tonight!
        - id: ch01-b22
          speaker: narrator
          text: Laurie passed below, whistling like a bird from an opera. Beth started, leaned toward the window, and smiled and nodded. She watched until the sound of his quick steps faded.
        - id: ch01-b23
          speaker: beth
          text: He looks so strong and healthy and happy. Dear Laurie.
        - id: ch01-b24
          speaker: jo
          text: Hmm.
        - id: ch01-b25
          speaker: narrator
          text: Jo kept her eyes on Beth's face. The bright color disappeared almost as soon as it had come. Her smile faded, and before long a tear shone on the window ledge. Beth brushed it away. In her partly turned face, Jo read such tender sorrow that her own eyes filled. Afraid Beth would notice, she muttered that she needed more paper and hurried away.
        - id: ch01-b26
          speaker: jo
          text: Good gracious. Beth is in love with Laurie! I never imagined it. What will Mother say? And what if he doesn't love her back? That would be dreadful. He must love her. I'll make him!
        - id: ch01-b27
          speaker: narrator
          text: In her own room, Jo sat pale with shock and shook a threatening finger at Laurie's picture. The mischievous face seemed to laugh at her from the wall. Then another thought struck her, and she turned scarlet.
        - id: ch01-b28
          speaker: jo
          text: So this is what growing up brings! Meg is married and has babies. Amy is thriving in Paris. Beth is in love. I'm the only one sensible enough to stay out of trouble.
        - id: ch01-b29
          speaker: narrator
          text: She studied the picture, smoothed her wrinkled forehead, and nodded firmly at it.
        - id: ch01-b30
          speaker: jo
          text: No, thank you, sir. You're very charming, but you're no steadier than a weathercock. Those touching notes and meaningful smiles won't help you. I won't have it.
        - id: ch01-b31
          speaker: narrator
          text: Jo sighed and sank into thought. Early twilight finally woke her and sent her downstairs to watch again. What she saw only made her more certain.
    - id: ch02
      title: What Jo Imagined
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Laurie flirted with Amy and traded jokes with Jo, but with Beth he had always been especially gentle. Then again, everyone was gentle with Beth, so no one had imagined that Laurie cared for her more than for the others. Lately, the family had begun to think their boy was growing fonder than ever of Jo. Jo refused to hear it and fiercely scolded anyone who hinted at such a thing.
        - id: ch02-b02
          speaker: narrator
          text: They didn't know how many tender moments Jo had stopped before they could begin. If they had known, they would have enjoyed saying they had warned her. Jo hated romantic nonsense. At the first sign of danger, she always had a joke or a smile ready to cut it short.
        - id: ch02-b03
          speaker: narrator
          text: When Laurie first went to college, he fell in love about once a month. Each bright little flame burned out as quickly as it caught and did no harm. Jo found the whole business delightful. At their weekly talks, he told her every turn from hope to despair and then resignation.
        - id: ch02-b04
          speaker: narrator
          text: In time, Laurie stopped worshiping one girl after another. He began dropping mysterious hints about one great passion and sometimes went about in gloomy, Byronic moods. Then he quit speaking of love at all. He sent Jo philosophical notes, settled down to study, and declared that he meant to work hard and graduate in a blaze of glory.
        - id: ch02-b05
          speaker: narrator
          text: Jo liked this much better than twilight confidences, lingering handclasps, and looks that said too much. Her mind had grown up before her heart. She preferred heroes she invented herself, because she could shut them in the tin kitchen when she grew tired of them. Real heroes were harder to manage.
        - id: ch02-b06
          speaker: narrator
          text: That was how things stood when Jo made her great discovery. That evening, she watched Laurie as she never had before. Without the new idea in her head, she would have seen nothing strange. Beth was quiet, and Laurie was kind to her. But Jo had set her imagination loose. It galloped away, and common sense, weakened by too much romance writing, never caught up.
        - id: ch02-b07
          speaker: narrator
          text: Beth lay on the sofa as usual, with Laurie in a low chair beside her. She counted on his weekly bundle of news, and he never failed her. He told her all about an exciting cricket match. Beth listened closely, though talk of being caught off a tice, stumped off his ground, and hitting three off the leg meant no more to her than Sanskrit.
        - id: ch02-b08
          speaker: narrator
          text: Because Jo expected to see love, she saw it everywhere. Beth's eyes seemed to rest on Laurie's lively dark face with special pleasure. Laurie appeared gentler than usual. He lowered his voice, laughed less, lost his train of thought now and then, and tucked the afghan around Beth's feet with almost tender care.
        - id: ch02-b09
          speaker: jo
          text: Who can say? Stranger things have happened. Beth would turn him into an angel, and he would make her life easy and happy. If they love each other, it would be perfect. I don't see how he could help loving her. Maybe he would, if the rest of us got out of the way.
        - id: ch02-b10
          speaker: narrator
          text: Everyone had gotten out of the way except Jo. At once she felt she ought to remove herself too. But where could she go? Eager to offer herself up for her sister's happiness, she sat down to decide.
        - id: ch02-b11
          speaker: narrator
          text: The old sofa was the patriarch of the room. It was long, broad, low, and comfortably padded, though years of family life had made it rather shabby. As babies, the girls had slept and sprawled there. As children, they had fished over its back, ridden on its arms, and kept whole menageries underneath it. As young women, they rested tired heads there, dreamed dreams, and listened to tender talk. They all loved it. It was the family's refuge, and one corner had always belonged to Jo.
        - id: ch02-b12
          speaker: narrator
          text: Among its many cushions was a hard, round horsehair pillow with a knobby button at each end. This prickly object was Jo's special property. It served as a weapon, a barricade, or a stern guard against sleeping too long.
        - id: ch02-b13
          speaker: narrator
          text: Laurie knew that pillow and hated it. In the old romping days, Jo had beaten him without mercy with it. More recently, it often barred him from the seat he wanted most, beside Jo in her sofa corner. They called it the sausage. If it stood on end, Laurie might come near and rest. If it lay flat across the sofa, no man, woman, or child dared disturb it.
        - id: ch02-b14
          speaker: narrator
          text: That evening, Jo forgot to block her corner. She had been sitting there less than five minutes when Laurie's large figure appeared beside her. He spread both arms along the back of the sofa, stretched his long legs before him, and sighed with satisfaction.
        - id: ch02-b15
          speaker: laurie
          text: Now this is getting your money's worth.
        - id: ch02-b16
          speaker: jo
          text: No slang.
        - id: ch02-b17
          speaker: narrator
          text: Jo slapped down the pillow, but she was too late. There was no room for it. It slid to the floor and vanished in a suspiciously mysterious way.
        - id: ch02-b18
          speaker: laurie
          text: Don't be so prickly, Jo. After studying himself down to a skeleton all week, a fellow deserves a little petting.
        - id: ch02-b19
          speaker: jo
          text: Beth can pet you. I'm busy.
        - id: ch02-b20
          speaker: laurie
          text: I won't bother Beth. You enjoy that sort of thing, unless you've suddenly changed. Have you? Do you hate your boy now? Is that why you're throwing pillows at him?
        - id: ch02-b21
          speaker: narrator
          text: No appeal could have been more coaxing. Jo answered her boy with a severe question.
        - id: ch02-b22
          speaker: jo
          text: How many bouquets did you send Miss Randal this week?
        - id: ch02-b23
          speaker: laurie
          text: Not one, I swear. She's engaged. What do you say to that?
        - id: ch02-b24
          speaker: jo
          text: I'm glad. Sending flowers and presents to girls you don't care about is a foolish waste.
        - id: ch02-b25
          speaker: laurie
          text: The sensible girls I truly care about won't let me send them anything. What else am I supposed to do? My feelings have to escape somehow.
        - id: ch02-b26
          speaker: jo
          text: Mother doesn't approve of flirting, even as a joke. And you flirt shamelessly, Teddy.
        - id: ch02-b27
          speaker: laurie
          text: I'd give anything to say that you do too. Since I can't, I'll only say the game seems harmless when everyone understands it's make-believe.
        - id: ch02-b28
          speaker: jo
          text: It looks pleasant enough, but I can't learn the rules. I've tried because it's awkward in company when everyone else does it. Somehow I always fail.
        - id: ch02-b29
          speaker: narrator
          text: For a moment, Jo forgot that she meant to lecture him.
        - id: ch02-b30
          speaker: laurie
          text: Ask Amy to teach you. She's a natural.
        - id: ch02-b31
          speaker: jo
          text: She does it gracefully, and she never seems to go too far. Some people please everyone without trying. Others always manage to say and do the wrong thing at exactly the wrong moment.
        - id: ch02-b32
          speaker: laurie
          text: I'm glad you can't flirt. A sensible, honest girl who can be cheerful and kind without acting foolish is a wonderful change. Just between us, some girls I know carry on so terribly that I'm embarrassed for them. They mean no harm. But if they heard the way fellows talk about them afterward, I think they'd behave differently.
        - id: ch02-b33
          speaker: jo
          text: The girls talk about you too, and their tongues are sharper, so the fellows come off worse. You're every bit as silly as they are. If you behaved properly, they would too. You encourage their nonsense and then blame them for it.
        - id: ch02-b34
          speaker: laurie
          text: You know very little about it, ma'am. We don't truly admire wild, flirty girls, even if we sometimes act as though we do. Among gentlemen, pretty and modest girls are only spoken of with respect. My innocent Jo, if you could stand in my place for one month, you'd see a few things that would surprise you. When I meet one of those reckless girls, I always want to quote our friend Cock Robin. Out upon you, fie upon you, bold-faced jig!
        - id: ch02-b35
          speaker: narrator
          text: Jo couldn't help laughing. Laurie hated speaking badly of women and fought against it in a comical, chivalrous way. Yet the unfeminine foolishness he saw in fashionable society honestly disgusted him. Jo knew that worldly mothers considered young Laurence an excellent match. Their daughters smiled at him, and women of every age flattered him enough to make him vain. She watched him protectively, afraid they would spoil him, and was more pleased than she admitted that he still admired modest girls.
        - id: ch02-b36
          speaker: jo
          text: If your feelings must escape, Teddy, then choose one of those pretty, modest girls you respect. Stop wasting your time on the foolish ones.
        - id: ch02-b37
          speaker: laurie
          text: You truly think I should?
        - id: ch02-b38
          speaker: narrator
          text: Laurie looked at her with a strange mixture of amusement and anxiety.
        - id: ch02-b39
          speaker: jo
          text: Yes. Though perhaps you should finish college first and spend the time making yourself worthy. You aren't nearly good enough for... well, for whoever this modest girl might be.
        - id: ch02-b40
          speaker: narrator
          text: Jo looked rather strange herself, because she had almost spoken a name.
        - id: ch02-b41
          speaker: laurie
          text: No, I'm not.
        - id: ch02-b42
          speaker: narrator
          text: Laurie agreed with a humility Jo had never seen in him. He lowered his eyes and began winding the tassel of her apron around one finger. Jo thought desperately that this would never do.
        - id: ch02-b43
          speaker: jo
          text: Go sing something for me. I'm longing for music, and I always enjoy yours.
        - id: ch02-b44
          speaker: laurie
          text: I'd rather stay here, thanks.
        - id: ch02-b45
          speaker: jo
          text: You can't. There's no room. Go make yourself useful, since you're much too big to be decorative. I thought you hated being tied to a woman's apron strings.
        - id: ch02-b46
          speaker: laurie
          text: That depends entirely on whose apron it is.
        - id: ch02-b47
          speaker: narrator
          text: Laurie gave the tassel a daring tug.
        - id: ch02-b48
          speaker: jo
          text: Are you going?
        - id: ch02-b49
          speaker: narrator
          text: Jo dived for the pillow, and Laurie fled. As soon as he was safely singing "The Bonnets of Bonnie Dundee," she slipped away. She did not return before he left, deeply offended.
    - id: ch03
      title: A Pain With No Cure
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Jo lay awake for a long time that night. Just as she began to drift off, a muffled sob sent her flying to Beth's bedside.
        - id: ch03-b02
          speaker: jo
          text: What is it, dear?
        - id: ch03-b03
          speaker: beth
          text: I thought you were asleep.
          emotion: sad
        - id: ch03-b04
          speaker: jo
          text: Is it the old pain, sweetheart?
        - id: ch03-b05
          speaker: beth
          text: No. This is a new one, but I can bear it.
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: Beth tried to stop crying.
        - id: ch03-b07
          speaker: jo
          text: Tell me everything. Let me make it better the way I used to.
        - id: ch03-b08
          speaker: beth
          text: You can't. Nothing can cure it.
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: Beth's voice broke. She clung to Jo and cried with such despair that Jo grew frightened.
        - id: ch03-b10
          speaker: jo
          text: Where does it hurt? Should I call Mother?
        - id: ch03-b11
          speaker: beth
          text: No, please don't call her. Don't tell her. I'll feel better soon. Lie here and stroke my head. I'll be quiet and go to sleep. Truly, I will.
        - id: ch03-b12
          speaker: narrator
          text: Jo lay down beside her. Her hand moved gently over Beth's hot forehead and wet eyelids. Jo's heart was full, and she wanted badly to speak. But she had learned, young as she was, that hearts are like flowers. Handle them roughly and they will not open. Though she believed she knew what caused Beth's new pain, she asked only one gentle question.
        - id: ch03-b13
          speaker: jo
          text: Is something troubling you, Bethy?
        - id: ch03-b14
          speaker: narrator
          text: After a long silence, Beth answered.
        - id: ch03-b15
          speaker: beth
          text: Yes, Jo.
        - id: ch03-b16
          speaker: jo
          text: Would it help to tell me what it is?
        - id: ch03-b17
          speaker: beth
          text: Not now. Not yet.
        - id: ch03-b18
          speaker: jo
          text: Then I won't ask again. Just remember that Mother and I always want to listen and help, if we can.
          emotion: calm
        - id: ch03-b19
          speaker: beth
          text: I know. I'll tell you someday.
        - id: ch03-b20
          speaker: jo
          text: Does it hurt less now?
        - id: ch03-b21
          speaker: beth
          text: Oh, yes, much less. You're such a comfort, Jo.
        - id: ch03-b22
          speaker: jo
          text: Go to sleep, dear. I'll stay right here.
          emotion: calm
        - id: ch03-b23
          speaker: narrator
          text: They fell asleep cheek to cheek. The next morning Beth seemed like herself again. At eighteen, heads and hearts do not always ache for long, and a loving word can be medicine for many hurts.
        - id: ch03-b24
          speaker: narrator
          text: Jo, however, had made up her mind. She thought over a plan for several days. Then, when she and her mother were sitting alone, she finally shared it.
    - id: ch04
      title: Jo's Plan
      blocks:
        - id: ch04-b01
          speaker: jo
          text: You asked about my wishes the other day, Marmee. I'll tell you one. I want to go away somewhere this winter. I need a change.
        - id: ch04-b02
          speaker: mrs_march
          text: Why, Jo?
        - id: ch04-b03
          speaker: narrator
          text: Mrs. March looked up quickly, as if she heard two meanings in those words. Jo kept her eyes on her sewing and answered seriously.
        - id: ch04-b04
          speaker: jo
          text: I want something new. I'm restless. I want to see more, do more, and learn more than I can here. I spend too much time brooding over my small troubles. I need to be shaken out of them. Since the family can spare me this winter, I'd like to hop away for a while and try my wings.
        - id: ch04-b05
          speaker: mrs_march
          text: Where would you hop to?
        - id: ch04-b06
          speaker: jo
          text: New York. I had the idea yesterday. Remember how Mrs. Kirke wrote asking for a respectable young woman to teach her children and help with sewing? Finding the right person isn't easy, but I think I could do it if I tried.
        - id: ch04-b07
          speaker: mrs_march
          text: My dear, you would work as a servant in that enormous boardinghouse?
          emotion: surprised
        - id: ch04-b08
          speaker: narrator
          text: Mrs. March was surprised, but she did not look displeased.
        - id: ch04-b09
          speaker: jo
          text: It isn't quite being a servant. Mrs. Kirke is your friend, and no kinder woman ever lived. I know she'd treat me well. Her family lives separately from the boarders, and no one there knows me anyway. Even if they did, I wouldn't care. The work is honest, and I'm not ashamed of it.
        - id: ch04-b10
          speaker: mrs_march
          text: Neither am I. But what about your writing?
        - id: ch04-b11
          speaker: jo
          text: The change will help it. I'll meet new people, hear new things, and find fresh ideas. Even if I have little time to write there, I'll come home with piles of material for my rubbish.
        - id: ch04-b12
          speaker: mrs_march
          text: I'm sure you will. But is that the only reason for this sudden plan?
        - id: ch04-b13
          speaker: jo
          text: No, Mother.
        - id: ch04-b14
          speaker: mrs_march
          text: Will you tell me the others?
        - id: ch04-b15
          speaker: narrator
          text: Jo looked up and then down. Color rushed into her cheeks, and she spoke slowly.
        - id: ch04-b16
          speaker: jo
          text: Maybe it's vain and wrong even to say this, but I'm afraid Laurie is beginning to care too much for me.
        - id: ch04-b17
          speaker: mrs_march
          text: And you don't love him in the way he clearly seems to be starting to love you?
        - id: ch04-b18
          speaker: narrator
          text: Mrs. March looked anxious as she asked.
        - id: ch04-b19
          speaker: jo
          text: Goodness, no! I love that dear boy exactly as I always have, and I'm terribly proud of him. Anything beyond that is impossible.
        - id: ch04-b20
          speaker: mrs_march
          text: I'm glad, Jo.
        - id: ch04-b21
          speaker: jo
          text: Why?
        - id: ch04-b22
          speaker: mrs_march
          text: Because I don't believe you suit each other. Your friendship is happy, and your frequent quarrels pass quickly. But if you were joined for life, I fear you would both rebel. You're too alike. You both love freedom, and you both have strong wills and quick tempers. Marriage needs endless patience and self-control along with love. I don't think the two of you would be happy.
        - id: ch04-b23
          speaker: jo
          text: That's exactly what I feel, though I couldn't put it into words. I'm glad you think he's only beginning to care. I would hate to make him unhappy, but I can't fall in love with the dear fellow just because I'm grateful to him. Can I?
        - id: ch04-b24
          speaker: mrs_march
          text: Are you certain about his feelings?
        - id: ch04-b25
          speaker: narrator
          text: Jo blushed even more. When she answered, her face held the pleasure, pride, and pain that can mingle when a young woman speaks of her first admirer.
        - id: ch04-b26
          speaker: jo
          text: I'm afraid I am. He hasn't said it, but his looks say plenty. I think I should leave before anything happens.
        - id: ch04-b27
          speaker: mrs_march
          text: I agree. If we can arrange it, you may go.
        - id: ch04-b28
          speaker: narrator
          text: Jo looked relieved. After a moment, she smiled.
        - id: ch04-b29
          speaker: jo
          text: Imagine what Mrs. Moffat would say about your poor management. And how pleased she'll be that Annie still has a chance.
        - id: ch04-b30
          speaker: mrs_march
          text: Mothers may manage their children differently, Jo, but we all hope for the same thing. We want them to be happy. Meg is happy, and that is enough for me. You may enjoy your freedom until you grow tired of it. Only then will you discover that something can be sweeter. Amy concerns me most now, though her good sense will guide her. For Beth, I ask for nothing except that she may be well. She has seemed brighter these last few days. Did you speak with her?
        - id: ch04-b31
          speaker: jo
          text: She admitted that something hurts and promised to tell me later. I didn't press her, because I think I know what it is.
        - id: ch04-b32
          speaker: narrator
          text: Jo told her mother what she had seen and what she believed it meant. Mrs. March shook her head. She did not find Jo's explanation nearly as romantic. Still looking serious, she repeated that Jo should leave for Laurie's sake.
        - id: ch04-b33
          speaker: jo
          text: We won't tell him until everything is settled. Then I'll escape before he gathers his thoughts and becomes tragic. Beth must think I'm going because I want to, which is true. I can't discuss Laurie with her. But after I'm gone, she can pet him and comfort him until his romantic idea is cured. He's survived so many little heartbreaks that he must be used to them. He'll soon recover from this attack of lovelornity.
        - id: ch04-b34
          speaker: narrator
          text: Jo tried to sound hopeful. Yet she could not shake the fear that this little trial would hurt Laurie more than the others, and that his lovelornity would not pass so easily this time.
    - id: ch05
      title: Trying Her Wings
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The whole family discussed the plan and approved it. Mrs. Kirke gladly accepted Jo and promised to give her a pleasant home. Teaching would allow Jo to support herself. She could use whatever free time remained for writing, while new places and new company would be both enjoyable and useful.
        - id: ch05-b02
          speaker: narrator
          text: Jo liked everything about the prospect and could hardly wait to leave. The home nest had begun to feel too small for her restless nature and adventurous spirit.
        - id: ch05-b03
          speaker: narrator
          text: Once the arrangements were complete, she told Laurie with fear and trembling. To her surprise, he received the news very quietly. He had been more serious than usual lately, though still pleasant. When Jo teased him about turning over a new leaf, he answered soberly.
        - id: ch05-b04
          speaker: laurie
          text: I have turned it over, and I intend to keep it that way.
        - id: ch05-b05
          speaker: narrator
          text: Jo felt greatly relieved that one of Laurie's virtuous moods had arrived at such a convenient time. She prepared for her journey with a lighter heart. Beth seemed more cheerful too, and Jo hoped she was doing what was best for everyone.
        - id: ch05-b06
          speaker: narrator
          text: On the night before she left, Jo gave Beth one special charge.
        - id: ch05-b07
          speaker: jo
          text: There's one thing I want you to look after especially.
        - id: ch05-b08
          speaker: beth
          text: Your papers?
        - id: ch05-b09
          speaker: jo
          text: No, my boy. You'll be very good to him, won't you?
        - id: ch05-b10
          speaker: beth
          text: Of course. But I can't take your place, and he'll miss you terribly.
        - id: ch05-b11
          speaker: jo
          text: A little missing won't hurt him. Remember, I'm leaving him in your care. Tease him, spoil him, and keep him in order.
        - id: ch05-b12
          speaker: beth
          text: For you, I'll do my best.
        - id: ch05-b13
          speaker: narrator
          text: Beth promised, but she wondered why Jo was looking at her in such an odd way.
        - id: ch05-b14
          speaker: narrator
          text: When the time came for Laurie to say goodbye, he leaned close and spoke with meaning.
        - id: ch05-b15
          speaker: laurie
          text: This won't do any good, Jo. I'll be watching you. Mind what you do, or I'll come to New York and bring you home myself.
