audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，带着克制的幽默, timbre: 清澈柔和, pace: 从容舒展, pitch: 中音}
    mrs_march:
      display_name: 马奇太太
      tts: {delivery: 慈爱爽朗，沉稳中带着鼓励, timbre: 饱满温暖, pace: 从容, pitch: 中低音}
    jo:
      display_name: 乔
      tts: {delivery: 爽直活泼，情感来得快而真, timbre: 明亮有力, pace: 稍快, pitch: 中音}
    beth:
      display_name: 贝思
      tts: {delivery: 温柔诚恳，羞怯克制, timbre: 轻柔纯净, pace: 舒缓, pitch: 中高音}
    laurie:
      display_name: 劳里
      tts: {delivery: 热情风趣，带着亲昵的少年意气, timbre: 清朗温暖, pace: 稍快, pitch: 中音}
  chapters:
    - id: ch01
      title: 第三十二章 柔情的烦恼
      blocks:
        - id: ch01-b01
          speaker: mrs_march
          text: 乔，我很担心贝思。
        - id: ch01-b02
          speaker: jo
          text: 怎么了，妈妈？两个小宝宝出生以后，她的精神明明比平常好多了。
        - id: ch01-b03
          speaker: mrs_march
          text: 我担心的不是她的身体，是她的心情。她一定藏着什么心事，我想请你弄清楚。她近来常常独自坐着，也不像以前那样跟爸爸说话。前几天，她望着两个小宝宝哭了。唱的总是伤心歌，脸上有时还会露出我看不懂的神情。这一点也不像贝思。
        - id: ch01-b04
          speaker: jo
          text: 您问过她没有？
        - id: ch01-b05
          speaker: mrs_march
          text: 试过一两次。可她不是躲开问题，就是难过得叫我问不下去。我从不逼孩子说出心事，通常也不会等太久。
        - id: ch01-b06
          speaker: narrator
          text: 马奇太太说着，看了乔一眼。乔似乎只看得见贝思的烦恼，完全没想到母亲还在试探别的心事。她默默缝了一会儿，才说出自己的猜测。
        - id: ch01-b07
          speaker: jo
          text: 我想贝思只是长大了。人一长大，就会开始做梦，心里冒出说不清的盼望、害怕和烦躁。她都十八岁了，我们却还把她当小孩子，忘了她已经是个女人。
        - id: ch01-b08
          speaker: mrs_march
          text: 是啊。你们长得真快。
        - id: ch01-b09
          speaker: jo
          text: 这可拦不住。妈妈，您只好看着小鸟一只一只跳出窝，再为它们操各种心。不过我答应您，我绝不会跳得太远。
        - id: ch01-b10
          speaker: mrs_march
          text: 这就够安慰我了。梅格走后，只要你在家，我心里便有了依靠。贝思太弱，艾米还小，可一到紧要关头，你总能顶上来。
        - id: ch01-b11
          speaker: jo
          text: 您知道我不怕苦差事。一家人里总得有一个干粗活的。精细事交给艾米。要是家里得掀地毯，或者一下病倒一半人，那才轮到我大显身手。艾米在国外争光，家里若出了事，我就是您的男子汉。
        - id: ch01-b12
          speaker: mrs_march
          text: 那我把贝思交给你。她那颗温柔的心，最容易向她的乔打开。千万体贴些，别让她知道有人盯着她、议论她。只要她重新健壮快活起来，我就再没有别的愿望了。
        - id: ch01-b13
          speaker: jo
          text: 您可真知足，我的愿望多着呢。等我先把贝思的烦恼解决，再告诉您我的。那些事不急，放得住。
        - id: ch01-b14
          speaker: narrator
          text: 乔很有把握地点点头，又缝起东西来。母亲看她仿佛除了贝思的烦恼，再不知道任何秘密的不安，至少暂时放了心。接下来的日子里，乔表面忙自己的事，暗地里一直观察贝思。许多互相冲突的猜测在心里争来争去，最后，一个看似能解释妹妹变化的念头占了上风。一件小事给了她所谓的线索，活跃的想象和疼爱妹妹的心便把剩下的故事补齐了。
        - id: ch01-b15
          speaker: narrator
          text: 一个星期六的下午，姐妹俩独自在家。乔装作埋头写作，笔下不停地沙沙作响，眼睛却始终瞟向窗边。贝思比平常更加安静，手里的活计一次次滑到膝上。她用一只手支着头，神情落寞，望着窗外黯淡萧瑟的秋景。忽然，楼下有人走过，口哨吹得像歌剧里的黑鸟，还朝屋里高声喊话。
        - id: ch01-b16
          speaker: laurie
          text: 一切太平！我今晚再来。
        - id: ch01-b17
          speaker: narrator
          text: 贝思一惊，探身向前，笑着点了点头。她一直望到那阵轻快的脚步声消失，才低低地自言自语。
        - id: ch01-b18
          speaker: beth
          text: 那个亲爱的男孩，看起来多么强健，多么快活啊。
        - id: ch01-b19
          speaker: narrator
          text: 乔轻轻哼了一声，始终没有移开目光。贝思脸上明亮的红晕来得快，退得也快，笑容随即消失了。不一会儿，一滴眼泪在窗台上闪闪发亮，她连忙把它擦掉。那半侧过去的脸上有一种温柔的哀伤，连乔也湿了眼睛。乔怕妹妹发现自己的神情，只含糊地说还需要些纸，便悄悄溜走。
        - id: ch01-b20
          speaker: jo
          text: 我的天，贝思爱上劳里了！我从没想到过。妈妈会怎么说？要是劳里不爱她，那可太可怕了。他非爱她不可，我会让他爱！我们真是全都长大了。梅格结了婚，当了妈妈，艾米在巴黎春风得意，贝思又陷进了爱情。只有我还够清醒，知道躲开麻烦。
        - id: ch01-b21
          speaker: narrator
          text: 乔瞪着墙上那张冲她顽皮发笑的少年画像，忽然又想起另一件事。要是劳里不肯回报贝思的爱，那该多可怕。她先威吓地冲画像摇头，仿佛下令劳里非爱贝思不可，随后又想到自己。她的脸一下涨红了，皱紧的额头慢慢舒展开，最后对画像坚决地点了点头。
        - id: ch01-b22
          speaker: jo
          text: 不，多谢您了，先生。您是很迷人，可您比风向标还没准儿。别再写动人的短笺，也别那样冲我笑。全都没用，我不会答应。
        - id: ch01-b23
          speaker: narrator
          text: 她叹了口气，沉思到天色将晚，才下楼继续观察。新发现的一切都被她拿来证明自己的猜测。劳里跟艾米调情，跟乔打闹，对贝思却总是格外亲切温柔。不过，人人待贝思都这样，谁也没想过他会更爱她。家里近来反倒觉得，这个男孩越来越喜欢乔。乔却连一个字也不肯听，谁敢暗示，她便狠狠数落谁。若是家人知道，有多少柔情刚冒芽就被她掐灭，一定会心满意足地说早就料到了。可乔讨厌谈情说爱，绝不容它近身。一有危险，便用一句笑话或一个笑脸把它挡回去。
        - id: ch01-b24
          speaker: narrator
          text: 劳里刚上大学时，差不多每个月都要恋爱一次。那些小火苗来势热烈，熄灭得也快，既没伤着谁，又把乔逗得很开心。两人每周相聚，他都会把自己的希望、绝望和最后的认命仔细说给她听，乔也一直听得津津有味。后来，他不再到处膜拜女神，只神秘地暗示一段占满整个心灵的爱情，偶尔还发作拜伦式的忧郁。再后来，他闭口不谈感情，改给乔写哲理深奥的短笺，认真读书，声称要埋头苦干，毕业时风风光光。比起黄昏里的倾心密语、温柔的握手和会说话的眼神，乔更喜欢他这样。她的头脑比心成熟得早，也更爱幻想中的英雄。幻想中的英雄叫她厌倦了，可以关进铁皮小厨房，等需要时再拿出来，真人却没那么好摆布。
        - id: ch01-b25
          speaker: narrator
          text: 当晚，乔头一回这样仔细地盯着劳里。若不是那个念头先钻进脑中，她只会看见贝思很安静，劳里待她很好。可想象一旦脱缰，就驮着她飞奔而去。常识早被她写传奇故事写得虚弱，根本赶不上来救她。
        - id: ch01-b26
          speaker: narrator
          text: 贝思照例躺在沙发上，劳里坐在旁边的矮椅里，讲各种闲闻给她解闷。贝思每星期都指望着他来陪自己说一阵，他也从不让她失望。这一晚，乔硬要看出证据，便觉得贝思望着身旁那张生动的深色面孔格外欢喜，甚至听一场激烈板球赛的经过也听得入神。什么短跳球上被接杀，什么离开击球区遭截杀，什么腿侧得了三分，对贝思来说其实跟梵文一样难懂。乔却又认定，劳里不时放低声音，笑得比平常少，还有些心不在焉。他替贝思盖好脚上的毛毯时格外殷勤，简直温柔得不同寻常。
        - id: ch01-b27
          speaker: jo
          text: 谁知道呢，世上还有更离奇的事。贝思会把他变成天使，他也能让贝思过得轻松快活。只要我们其余的人都让开，我相信他一定会爱上她。
        - id: ch01-b28
          speaker: narrator
          text: 当时，屋里其余的人都已经走开，唯一还可能碍事的，恰好只剩乔自己。她越想越觉得，自己也应该尽快消失。满腔姐妹深情烧得正旺，她恨不得立刻把自己献上祭坛，于是坐下来认真思量，该去什么地方，才能把位置让给贝思。
        - id: ch01-b29
          speaker: narrator
          text: 客厅里那张老沙发，简直是沙发家族的一位老祖宗。它又长又宽，垫子厚实，座位低矮，也已经有些破旧。姑娘们还是婴儿时，曾在上面睡觉，摊开手脚。长大些后，她们翻过靠背钓鱼，把扶手当马骑，还在沙发底下开过动物园。成了少女，她们又在这里安放疲倦的头，做梦，倾听温柔的谈话。大家都爱它，因为它是全家的避难所。乔尤其喜欢其中一个角落。沙发上的许多靠垫中，有一只又硬又圆，蒙着扎人的马鬃布，两端还各有一颗凸起的硬纽扣。这件讨厌的东西归乔专用，既能当防身武器，也能筑成路障，还能严厉地阻止她睡得太沉。
        - id: ch01-b30
          speaker: narrator
          text: 劳里太熟悉这只靠垫，也太有理由恨它。从前大家还能胡闹时，他曾被它毫不留情地痛打。如今，它又常常挡住他最想坐的位置，也就是沙发角落里乔的身旁。大家管它叫“香肠”。它若竖着，便表示劳里可以走近休息。它若横在沙发上，任何男人、女人或孩子敢碰它都要倒霉。偏偏那晚乔忘了设防。她坐下不到五分钟，一个高大的身影便出现在身旁。劳里双臂摊在靠背上，两条长腿伸得笔直，满意地叹了口气。
        - id: ch01-b31
          speaker: laurie
          text: 花这个价钱，倒也值了。
        - id: ch01-b32
          speaker: jo
          text: 不许说俚语。
        - id: ch01-b33
          speaker: narrator
          text: 乔把靠垫猛放下来，可沙发已经没有空位。它滑到地上，神秘地不见了。
        - id: ch01-b34
          speaker: laurie
          text: 得了，乔，别浑身是刺。我苦读了整整一星期，都快瘦成骨头架子了，难道不该有人疼一疼？
        - id: ch01-b35
          speaker: jo
          text: 贝思会疼你。我忙着呢。
        - id: ch01-b36
          speaker: laurie
          text: 我才不去烦她。你一向喜欢疼我，除非你忽然变了。你真的讨厌你家的男孩，想拿靠垫砸他？
        - id: ch01-b37
          speaker: narrator
          text: 这番恳求简直软得不能再软，乔却用一个问题把“她家的男孩”堵了回去。
        - id: ch01-b38
          speaker: jo
          text: 这个星期，你给兰德尔小姐送了几束花？
        - id: ch01-b39
          speaker: laurie
          text: 一束也没有，我发誓。她订婚了。现在行了吧？
        - id: ch01-b40
          speaker: jo
          text: 那很好。给你根本不在乎的姑娘送花送东西，正是你最荒唐的一项浪费。
        - id: ch01-b41
          speaker: laurie
          text: 可我真正在乎的聪明姑娘，不准我送她花呀东西呀。那我怎么办？我的感情总得找个出口。
        - id: ch01-b42
          speaker: jo
          text: 妈妈连闹着玩的调情都不赞成，你却调情调得不要命，泰迪。
        - id: ch01-b43
          speaker: laurie
          text: 要是我能回答“你也一样”，让我给什么都行。可惜不能。我只觉得，只要双方都明白那是游戏，这点乐趣并没有什么害处。
        - id: ch01-b44
          speaker: jo
          text: 看着确实挺有趣，可我怎么也学不会。我试过，在社交场合，人人都做的事只有自己不做，实在别扭。但我就是不得要领。
        - id: ch01-b45
          speaker: laurie
          text: 去跟艾米学。她天生就会。
        - id: ch01-b46
          speaker: jo
          text: 是啊，她做起来很漂亮，又从不过火。有些人不用费力就能讨人喜欢，另一些人却总在最不对的地方，说最不对的话，做最不对的事。
        - id: ch01-b47
          speaker: laurie
          text: 我很高兴你不会调情。一个姑娘明理又直爽，可以快活，可以亲切，又不会把自己弄成傻瓜，看着真叫人舒服。私下说，我认识的一些姑娘闹得太过火，连我都替她们害臊。她们也许没有恶意，可要是知道男人们事后怎样谈论她们，多半就肯收敛了。
        - id: ch01-b48
          speaker: jo
          text: 姑娘们也会谈论你们，而且她们的舌头更尖。你们吃的亏更大，因为你们跟她们一样傻。你们若规矩些，她们也会规矩。明明是你们喜欢那些胡闹，她们才闹下去，最后你们倒怪起她们来了。
        - id: ch01-b49
          speaker: laurie
          text: 夫人，您懂得可真多。我们才不喜欢疯丫头和卖弄风情的姑娘，哪怕有时装得像喜欢。绅士之间提起漂亮端庄的姑娘，向来只有敬重。你要是站在我的位置上过一个月，见到的事情准会吓你一跳。我一看见那些轻狂姑娘，就想借知更鸟先生的话骂她们。羞呀羞，呸呀呸，厚脸皮的疯丫头！
        - id: ch01-b50
          speaker: narrator
          text: 劳里有骑士般的风度，不愿说女人的坏话，却又真心厌恶上流社会里那些有失端庄的蠢行。这两份心情在他身上打架，实在滑稽得叫人不能不笑。乔知道，势利的母亲们把小劳伦斯先生看作绝佳女婿，她们的女儿一看见他便满脸笑容，各个年纪的女士又都奉承他。这样的待遇，足以把他宠成一个自负的花花公子。乔带着几分戒备看护他，一直担心他被宠坏。所以发现他仍相信端庄的姑娘，她心里的高兴远比肯承认的更多。接着，她忽然又换回训诫的口气，压低声音劝他。
        - id: ch01-b51
          speaker: jo
          text: 泰迪，你若非给感情找个出口，就去认真对待一位你真正敬重的端庄姑娘。别把时间浪费在傻姑娘身上。
        - id: ch01-b52
          speaker: laurie
          text: 你当真劝我这样做？
        - id: ch01-b53
          speaker: jo
          text: 是啊。不过最好等大学毕业以后再说。现在先努力，让自己配得上人家。你还远远配不上，不管那位端庄姑娘是谁。
        - id: ch01-b54
          speaker: narrator
          text: 一个名字险些从乔嘴里溜出来，她的神情也有些古怪。劳里垂下眼睛，脸上露出从未有过的谦卑，还把她围裙的穗子绕在手指上。
        - id: ch01-b55
          speaker: laurie
          text: 我的确配不上。
        - id: ch01-b56
          speaker: jo
          text: 去给我唱首歌吧。我很想听音乐，也一向喜欢你唱歌。
        - id: ch01-b57
          speaker: laurie
          text: 多谢，我宁愿留在这里。
        - id: ch01-b58
          speaker: jo
          text: 不行，这里没有地方。你个头太大，不能当摆设，就去做点有用的事。我还以为你最恨被拴在女人的围裙带上呢。
        - id: ch01-b59
          speaker: laurie
          text: 那要看围裙穿在谁身上。
        - id: ch01-b60
          speaker: narrator
          text: 劳里大胆地扯了扯穗子。乔喝问他走不走，同时扑过去找靠垫。他立刻逃开。等他好好唱起《戴上美丽邓迪的帽子》，乔也悄悄溜了。那位年轻先生最后气冲冲地离开，她都没有再回来。
        - id: ch01-b61
          speaker: narrator
          text: 那晚，乔很久没有睡着。刚有一点睡意，她忽然听见压低的抽泣声，立刻奔到贝思床前。
        - id: ch01-b62
          speaker: jo
          text: 怎么了，亲爱的？还是从前那种痛吗？
        - id: ch01-b63
          speaker: beth
          text: 我还以为你睡着了。不是原来的痛，是一种新的痛。不过我受得住。
          emotion: sad
        - id: ch01-b64
          speaker: jo
          text: 全都告诉我，让我像以前那样替你治好。
        - id: ch01-b65
          speaker: beth
          text: 你治不好，它没有药可治。
          emotion: sad
        - id: ch01-b66
          speaker: narrator
          text: 贝思说不下去了。她抱紧姐姐，哭得那样绝望，连乔也害怕起来。
        - id: ch01-b67
          speaker: jo
          text: 哪里痛？要我叫妈妈吗？
        - id: ch01-b68
          speaker: beth
          text: 不要叫她，也别告诉她。我很快会好的。你躺在这里，心疼心疼我的脑袋吧。我会安静下来，好好睡觉，真的会。
          emotion: sad
        - id: ch01-b69
          speaker: narrator
          text: 乔依了她，手掌轻轻来回抚过她发烫的额头和湿润的眼皮。乔心中满是怜爱，很想把自己的猜测说出来。可她虽然年轻，却已经懂得，人的心就像花，不能粗暴地用手硬掰，只能等它自然开放。她深信自己知道这份新痛苦的根源，最后却忍住所有急切，只用最温柔的声音问了一句。
        - id: ch01-b70
          speaker: jo
          text: 亲爱的，有什么事让你难过吗？
        - id: ch01-b71
          speaker: beth
          text: 有，乔。
          emotion: sad
        - id: ch01-b72
          speaker: jo
          text: 告诉我是什么，不会让你好受一点吗？
        - id: ch01-b73
          speaker: beth
          text: 现在不行，还不到时候。
        - id: ch01-b74
          speaker: jo
          text: 那我不问了。不过你要记住，只要妈妈和乔帮得上忙，我们永远愿意听你说，也愿意帮助你。
        - id: ch01-b75
          speaker: beth
          text: 我知道。以后我会告诉你的。
        - id: ch01-b76
          speaker: jo
          text: 现在好一点了吗？
        - id: ch01-b77
          speaker: beth
          text: 好多了。乔，有你在真舒服。
        - id: ch01-b78
          speaker: jo
          text: 睡吧，亲爱的。我陪着你。
          emotion: calm
        - id: ch01-b79
          speaker: narrator
          text: 姐妹俩就这样脸贴着脸睡着了。第二天早晨，贝思看起来又完全恢复了平常的模样。因为十八岁的时候，不论脑袋还是心，都不会疼得太久。一句充满爱的话，便能医治大多数痛楚。
        - id: ch01-b80
          speaker: narrator
          text: 乔却已经拿定主意。她把一个计划翻来覆去想了好几天，终于等到母女俩单独相处时，认真地把它告诉了母亲。
        - id: ch01-b81
          speaker: jo
          text: 前几天您问我有什么愿望。现在我告诉您一个吧。这个冬天，我想离开家，到别处换换环境。
        - id: ch01-b82
          speaker: mrs_march
          text: 为什么，乔？
        - id: ch01-b83
          speaker: jo
          text: 我想接触新东西。心里总是躁动，想比现在多看、多做、多学一点。我老想着自己的小事，需要换个地方清醒清醒。今年冬天家里用不着我，我想跳得不太远，试试自己的翅膀。
        - id: ch01-b84
          speaker: mrs_march
          text: 你想跳到哪里？
        - id: ch01-b85
          speaker: jo
          text: 纽约。柯克太太不是写信找一位规矩的年轻人，教她的孩子，再做点针线吗？合适的人很难找，我倒觉得自己可以试试。
        - id: ch01-b86
          speaker: mrs_march
          text: 亲爱的，你要去那座大寄宿公寓里做佣人？
        - id: ch01-b87
          speaker: jo
          text: 也不完全算做佣人。柯克太太是您的朋友，又那么和善，一定会让我过得舒服。她一家跟房客分开住，而且那里没人认识我。就算有人认识，我也不在乎。工作正当，我不觉得丢脸。
        - id: ch01-b88
          speaker: mrs_march
          text: 我也不觉得。可你的写作呢？
        - id: ch01-b89
          speaker: jo
          text: 换环境对写作更好。我会看到、听到新鲜事，也会有新念头。就算没多少时间写，回家时也能带回一大堆材料，留给我那些胡说八道的文章。
        - id: ch01-b90
          speaker: mrs_march
          text: 这一点我相信。可你忽然想走，只有这些理由吗？
        - id: ch01-b91
          speaker: jo
          text: 不，妈妈。
        - id: ch01-b92
          speaker: mrs_march
          text: 其余的能告诉我吗？
        - id: ch01-b93
          speaker: narrator
          text: 乔抬起头，又垂下眼睛，脸颊一下红了。她迟疑了片刻，才慢慢开口。
        - id: ch01-b94
          speaker: jo
          text: 这样说也许自负，也许不对。可是我怕，劳里越来越喜欢我了。
        - id: ch01-b95
          speaker: mrs_march
          text: 他显然已经开始那样喜欢你，你却并不以同样的方式喜欢他，是吗？
        - id: ch01-b96
          speaker: jo
          text: 当然不！我像从前一样爱这个亲爱的男孩，也为他骄傲得不得了。可要说别的，那绝不可能。
        - id: ch01-b97
          speaker: mrs_march
          text: 我很高兴。你们做朋友时十分快活，争吵也很快过去。可你们太相像，又都太爱自由，脾气急，意志也强。若做一辈子的伴侣，我怕你们两个都会反抗。夫妻除了爱，还需要无穷的耐心和包容。
        - id: ch01-b98
          speaker: jo
          text: 我心里也是这样想，只是说不出来。您也觉得他才刚开始喜欢我，这就好。我不愿让他伤心，可我总不能只为报答他，就强迫自己爱上这个亲爱的老伙计。
        - id: ch01-b99
          speaker: mrs_march
          text: 你确定他的心意吗？
        - id: ch01-b100
          speaker: narrator
          text: 乔脸上的红晕更深了。少女第一次谈到爱慕自己的人时，心里往往同时有欢喜、骄傲和痛苦。此刻，这三种感情全都浮在乔的脸上。她既为劳里的心意感到高兴和骄傲，又怕自己无法回报，会让这个从小相伴的亲爱朋友伤心。
        - id: ch01-b101
          speaker: jo
          text: 我怕是真的。他什么也没说，可他的眼睛说了太多。我最好趁事情还没有发展起来，先走开一阵。
        - id: ch01-b102
          speaker: mrs_march
          text: 我同意。只要能安排好，你就去吧。
        - id: ch01-b103
          speaker: jo
          text: 莫法特太太若知道，一定会惊叹您多么不会筹谋。安妮还有希望，她也一定会高兴。
        - id: ch01-b104
          speaker: mrs_march
          text: 母亲们筹谋的方法也许不同，希望却都一样，只想看见自己的孩子幸福。梅格很幸福，她的归宿已经让我满足。你可以继续享受自由，直到自己厌倦。因为只有到了那时，你才会发现世上还有比自由更甜蜜的东西。艾米眼下最让我操心，不过她的明智能帮助她。对贝思，我除了盼她恢复健康，再没有别的奢望。说起来，她这一两天似乎快活些了，你跟她谈过吗？
        - id: ch01-b105
          speaker: jo
          text: 谈过。她承认自己有烦恼，答应以后告诉我。我没有追问，因为我想自己已经猜到了。
        - id: ch01-b106
          speaker: narrator
          text: 乔把自己发现的那件小事，还有由此生出的全部猜测，从头到尾讲给母亲听。马奇太太听完摇了摇头，并没有像女儿那样，把贝思的情形看成一段浪漫的爱情。不过她的神情依旧严肃，并且再次说明，不论贝思的心事究竟是什么，为了劳里，乔都应当暂时离开一阵。
        - id: ch01-b107
          speaker: jo
          text: 计划没定下来以前，先别告诉他。等一切安排好，我就趁他还没回过神、来不及演悲剧时逃走。贝思得以为我是为了自己高兴才去的，因为我不能跟她谈劳里。我走以后，她可以疼他、安慰他，治好他这个浪漫念头。他经历过不少这种小磨难，早就习惯了，很快会从失恋病里恢复。
        - id: ch01-b108
          speaker: narrator
          text: 乔嘴上说得满怀希望，仿佛劳里已经习惯这种打击，很快就能恢复。可她怎么也赶不走心里那份不祥的预感。她隐隐觉得，这一次的“小磨难”会比从前的每一次都更难熬，劳里的“失恋病”恐怕也不会像往常那样轻易痊愈。
        - id: ch01-b109
          speaker: narrator
          text: 全家开会讨论了这个计划，最后一致赞成。柯克太太欣然接受乔，还答应让她在那里拥有一个温馨的家。教书能让乔自食其力，得到的空闲也可以拿来写作，不会白白浪费。新的环境和交往既有用，也令人愉快。乔喜欢这个前景，急着出发。家里的小巢，对她躁动的天性和冒险的精神来说，已经越来越狭窄了。
        - id: ch01-b110
          speaker: narrator
          text: 一切决定以后，乔怀着又怕又慌的心情把消息告诉劳里，没想到他听得十分平静。最近，他一直比平常严肃，却又非常和气。大家打趣他，说他像是翻开了人生的新一页，已经改过自新。劳里没有像往常那样用玩笑躲开，反而认认真真地承认了。
        - id: ch01-b111
          speaker: laurie
          text: 不错。我已经翻开新的一页，而且打算让这一页永远别再翻回去。
        - id: ch01-b112
          speaker: narrator
          text: 劳里这阵高尚的热情来得正是时候，乔大大松了口气。她相信，他这一次真的想把新的一页留住。贝思近来也显得更快活，于是乔卸下心头的重担，轻松地收拾行装。她希望自己正在做的选择对每个人都是最好。临走前一晚，她来到贝思身边，把一件事郑重地托付给妹妹。
        - id: ch01-b113
          speaker: jo
          text: 有一件事，我要特别交给你照看。
        - id: ch01-b114
          speaker: beth
          text: 是你的文稿吗？
        - id: ch01-b115
          speaker: jo
          text: 不，是我家的男孩。你一定要好好待他，好不好？
        - id: ch01-b116
          speaker: beth
          text: 当然。可我代替不了你，他会想你想得很难过。
        - id: ch01-b117
          speaker: jo
          text: 想想也不会伤着他。我把他交给你了，你要逗他、疼他，也要管住他。
        - id: ch01-b118
          speaker: beth
          text: 为了你，我会尽力的。
        - id: ch01-b119
          speaker: narrator
          text: 贝思为了姐姐答应尽力照看劳里，却始终不明白乔为什么用那样古怪的眼神望着自己。到了真正告别的时候，劳里也没有把乔的远行当作一件寻常小事。他贴近乔，意味深长地压低声音，明明白白告诉她，离开家并不能躲过他的眼睛。
        - id: ch01-b120
          speaker: laurie
          text: 这根本没用，乔。我的眼睛会一直盯着你。你可小心自己的举动，不然我就去把你带回家。
