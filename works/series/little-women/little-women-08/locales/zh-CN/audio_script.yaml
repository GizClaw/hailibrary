audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机智，像在炉边从容讲述旧日家事
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情绪来得快，带一点男孩子气
        timbre: 明亮略带沙哑
        pace: 偏快
        pitch: 中低
    meg:
      display_name: 梅格
      tts:
        delivery: 温柔端庄，常带大姐姐式的认真
        timbre: 柔和圆润
        pace: 适中
        pitch: 中
    amy:
      display_name: 艾米
      tts:
        delivery: 一本正经又有些自负，努力显得优雅
        timbre: 清脆稚嫩
        pace: 适中
        pitch: 偏高
    mrs_march:
      display_name: 马奇太太
      tts:
        delivery: 慈爱爽朗，沉稳中带着鼓励
        timbre: 饱满温暖
        pace: 从容
        pitch: 中低
    laurie:
      display_name: 劳里
      tts:
        delivery: 彬彬有礼而略显腼腆，熟悉以后轻松风趣
        timbre: 清朗温和
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 被拒绝的邀请
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一个星期六的下午，艾米走进姐姐们的房间，发现她们正神神秘秘地收拾着要出门。她立刻好奇起来。
        - id: ch01-b02
          speaker: amy
          text: “你们要到哪儿去？”
        - id: ch01-b03
          speaker: jo
          text: “不关你的事。小孩子别什么都问。”
        - id: ch01-b04
          speaker: narrator
          text: 小时候听见这种话，自尊心最受不了。要是人家再哄你一句“乖，走开吧”，那就更气人。艾米受了冒犯，打定主意，哪怕磨上一个钟头，也非问出秘密不可。梅格一向禁不住她久求，她便转向梅格撒娇。
        - id: ch01-b05
          speaker: amy
          text: “告诉我嘛，也带我一起去吧。贝丝只顾弄她的钢琴，我什么事也没有，一个人多孤单呀。”
        - id: ch01-b06
          speaker: meg
          text: “不行，亲爱的，人家没有邀请你。”
        - id: ch01-b07
          speaker: jo
          text: “梅格，别再说了，要不全给她猜出来了。艾米，你不能去。别像小娃娃一样哼哼唧唧。”
        - id: ch01-b08
          speaker: amy
          text: “我知道你们要跟劳里出去。昨晚你们坐在沙发上说说笑笑，我一来就不说了。是不是他约了你们？”
        - id: ch01-b09
          speaker: jo
          text: “没错。现在别再缠着我们。”
        - id: ch01-b10
          speaker: narrator
          text: 艾米不说话了，眼睛却还在观察。她看见梅格把扇子放进衣袋，马上猜到了。
        - id: ch01-b11
          speaker: amy
          text: “你们要去戏院看《七座城堡》！那我也去。妈妈答应过让我看，我还有卖破布的钱。你们不早点告诉我，真小气。”
        - id: ch01-b12
          speaker: meg
          text: “听我说，做个懂事的好孩子。妈妈不想让你这星期去。你的眼睛还没好，受不了仙女戏的灯光。下星期你跟贝丝和汉娜去，一样会玩得开心。”
        - id: ch01-b13
          speaker: amy
          text: “可我更想跟你们和劳里去。我伤风这么久，一直关在家里，简直闷死了。求你带我吧，梅格。我保证乖乖的。”
        - id: ch01-b14
          speaker: meg
          text: “也许可以带上她。只要给她穿暖和一点儿，妈妈大概不会反对。”
        - id: ch01-b15
          speaker: jo
          text: “她去，我就不去。我不去，劳里也会扫兴。他只请了我们，我们却硬把艾米带去，多失礼呀。明知道别人不欢迎，还偏往里挤，她自己也该难为情。”
        - id: ch01-b16
          speaker: narrator
          text: 乔只想痛痛快快玩一回，不愿分神照顾坐不住的妹妹。她那副不耐烦的样子惹火了艾米。艾米一边穿靴子，一边故意说得格外气人。
        - id: ch01-b17
          speaker: amy
          text: “我就要去。梅格已经答应了。我自己买票，劳里也管不着。”
        - id: ch01-b18
          speaker: jo
          text: “座位早订好了，你不能跟我们坐，也不能一个人坐。劳里要么把位子让给你，害大家都玩不好，要么替一个没受邀请的人另买票，那也不合适。你哪儿也不许去，就待在家里。”
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: 乔正忙乱着，又扎了手指，火气更大。艾米只穿好一只靴子，坐在地上哭了。梅格正劝她，楼下传来劳里的喊声。两个姐姐赶紧跑下去，把妹妹留在那里大哭。艾米平时总装得像个大人，偶尔也会变回受宠的孩子。几个人刚要出门，她便隔着楼梯栏杆喊下来。
        - id: ch01-b20
          speaker: amy
          text: “乔·马奇，你一定会后悔的，等着瞧！”
          emotion: angry
        - id: ch01-b21
          speaker: jo
          text: “胡说八道！”
        - id: ch01-b22
          speaker: narrator
          text: 乔重重摔上了门。她们却在戏院里玩得痛快极了。那出《钻石湖的七座城堡》光彩夺目，奇妙得让人挑不出一点遗憾。台上有滑稽的红色小鬼、闪光的精灵，还有穿着华服的王子公主。可这些热闹也没能把乔心里的苦味完全赶走。她一看见仙女王后的金黄卷发，就想起了艾米。幕间休息时，她一直猜着妹妹会用什么法子叫自己后悔。
        - id: ch01-b23
          speaker: narrator
          text: 这对姐妹从小就常常交战。两个人脾气都急，真被激怒了，谁也不肯让谁。艾米爱招惹乔，乔又总能刺激艾米，于是隔些日子就要爆发一场。闹完以后，两个人又都觉得羞愧。乔虽然年长，自制力反而最差。那股火暴性子不断替她招来麻烦，她却很难管住。好在她的怒火来得猛，散得也快。一旦谦卑地认了错，她便真心悔改，还会努力做得更好。姐妹们甚至说，她们有点喜欢看乔发火，因为事后她好得像个天使。可怜的乔拼命想学好，心里的敌人却随时会重新燃起来，把她打败。为了制服它，她还要耐心努力许多年。
        - id: ch01-b24
          speaker: narrator
          text: 姐姐们回家时，艾米坐在客厅里读书。她一副受了委屈的样子，眼睛始终不离书页，也不问她们一个问题。要不是贝丝也在，兴冲冲地打听戏演得怎样，又听姐姐们绘声绘色地讲了一遍，她的好奇心也许早压过了怨气。乔上楼收起自己最好的帽子，第一眼就去查看五斗柜。上次吵架，艾米为了消气，曾把她最上层的抽屉整个翻到地上。可这次东西都在原位，壁橱、袋子和盒子也没有异样。乔匆匆检查一遍，便以为艾米已经原谅她，也忘了这场不快。
    - id: ch02
      title: 烧掉的手稿
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 乔猜错了。第二天傍晚，梅格、贝丝和艾米坐在一起，乔突然冲进房间，喘着气追问有没有人拿走她的书。梅格和贝丝都说没有。艾米只拨弄炉火，一句话也不说。乔看见她脸红，立刻逼了过去。
        - id: ch02-b02
          speaker: jo
          text: “艾米，书在你那里！”
        - id: ch02-b03
          speaker: amy
          text: “书不在我这里。”
        - id: ch02-b04
          speaker: jo
          text: “那你一定知道它在哪儿！”
        - id: ch02-b05
          speaker: amy
          text: “我不知道。”
        - id: ch02-b06
          speaker: jo
          text: “你这句话是在撒谎！”
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: 乔抓住艾米的肩膀，神情凶得连更勇敢的孩子也会害怕。
        - id: ch02-b08
          speaker: amy
          text: “我没撒谎。我没拿，也不知道它现在在哪儿。我根本不在乎。”
        - id: ch02-b09
          speaker: jo
          text: “你肯定知道什么。马上告诉我，不然我会逼你说出来。”
        - id: ch02-b10
          speaker: narrator
          text: 乔轻轻摇了她一下，艾米也激动起来。
        - id: ch02-b11
          speaker: amy
          text: “随你怎么骂，反正你再也见不到那本傻书了。”
          emotion: angry
        - id: ch02-b12
          speaker: jo
          text: “我为什么再也见不到它？”
        - id: ch02-b13
          speaker: amy
          text: “我把它烧掉了。”
        - id: ch02-b14
          speaker: jo
          text: “什么？那是我最心爱的书，我费了那么多功夫，还想在爸爸回来前写完。你真的烧了它？”
          emotion: surprised
        - id: ch02-b15
          speaker: narrator
          text: 乔的脸一下变得惨白，眼里却冒着火，两只手紧紧抓住艾米。
        - id: ch02-b16
          speaker: amy
          text: “对，就是我烧的！我说过，你昨天那么凶，我会叫你付出代价。现在我已经……”
          emotion: angry
        - id: ch02-b17
          speaker: narrator
          text: 她没能说完。乔的暴脾气彻底压倒了她。乔拼命摇着妹妹，摇得艾米牙齿直打战，又悲又怒地喊起来。
        - id: ch02-b18
          speaker: jo
          text: “你太坏了！那本书我再也写不出来。我这一辈子都不会原谅你！”
          emotion: angry
        - id: ch02-b19
          speaker: narrator
          text: 梅格冲来救艾米，贝丝赶来劝乔。可乔已经失去理智，临走还打了妹妹一耳光。她跑上阁楼，扑倒在旧沙发上，一个人继续这场争斗。
        - id: ch02-b20
          speaker: narrator
          text: 马奇太太回家以后，楼下的风暴很快平息。她听完经过，很快让艾米明白自己对姐姐犯了多大的错。那本书是乔心头的骄傲，一家人都觉得它像一株很有希望的文学幼苗。里面虽只有五六篇小童话，乔却耐心写了多年，把整颗心都放了进去，只盼写得足够好，有一天能真的印出来。她刚刚极仔细地誊清了全部故事，又把旧稿毁掉。艾米点起的那一把火，烧光了姐姐几年来满怀热爱写下的全部心血。
        - id: ch02-b21
          speaker: narrator
          text: 别人也许觉得这点损失不算什么，乔却觉得它是一场可怕而又永远无法补偿的灾难。贝丝为那本书哀悼，伤心得仿佛死了一只心爱的小猫。梅格平日那么宠艾米，这次也不肯替她说话。母亲看起来既严肃又悲伤。艾米自己后悔得比谁都厉害，只觉得在为这件事认真道歉以前，家里再也不会有人爱她了。
        - id: ch02-b22
          speaker: narrator
          text: 吃茶铃响时，乔沉着脸走来，冷得让人不敢接近。艾米鼓足勇气才开口。
        - id: ch02-b23
          speaker: amy
          text: “乔，请原谅我。我真的非常难过。”
          emotion: sad
        - id: ch02-b24
          speaker: jo
          text: “我永远不会原谅你。”
          emotion: angry
        - id: ch02-b25
          speaker: narrator
          text: 从那一刻起，乔就当艾米不存在。谁也没有再提这场灾祸，连马奇太太也选择了沉默。过去的经验早让大家明白，乔一旦陷进这种情绪，任何劝说都是白费。最明智的办法只有耐心等待，等一个小小的意外，或她自己那副宽厚的天性，慢慢软化心里的怨恨，把姐妹之间的裂缝重新合上。
        - id: ch02-b26
          speaker: narrator
          text: 那晚谁也不开心。姑娘们照常做针线，母亲照常朗读布雷默、司各特或埃奇沃思的作品，可屋里分明少了什么，家中一向温柔甜美的安宁已经被打乱。唱歌时，这种感觉尤其明显。贝丝只能弹琴，乔像石头一样沉默，艾米唱着唱着便再也唱不下去，只剩梅格和母亲继续。她们努力让歌声像云雀般快活，那两道笛子似的嗓音却怎么也不像平时那样和谐。每个人心里都走了调。
        - id: ch02-b27
          speaker: narrator
          text: 母亲吻乔道晚安时，轻声劝她。
        - id: ch02-b28
          speaker: mrs_march
          text: “亲爱的，别带着怒气看太阳落下去。你们要互相原谅，互相帮助，明天重新开始。”
          emotion: calm
        - id: ch02-b29
          speaker: narrator
          text: 乔很想把头埋进母亲怀里，把悲伤和愤怒全哭掉。可她觉得眼泪不像男子汉，又认定自己受的伤太深，实在不能马上原谅。艾米还在旁边听着，她便使劲忍住泪，粗声回答。
        - id: ch02-b30
          speaker: jo
          text: “她做得太可恶了，根本不配原谅。”
          emotion: angry
        - id: ch02-b31
          speaker: narrator
          text: 乔大步上床去了。那一夜，姐妹间再没有欢快亲密的悄悄话。
    - id: ch03
      title: 冰面上的裂口
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 艾米主动求和却遭到拒绝，也恼怒起来。她开始后悔自己何必低声下气，越想越觉得受了委屈，还为自己比乔更有品德而得意。那副样子尤其气人。乔仍像一片雷雨云，整整一天没有一件事顺心。清早冷得刺骨，她把自己舍不得吃的果馅饼掉进阴沟。马奇姑妈莫名烦躁起来，梅格格外敏感，贝丝等她回家后又总用忧伤又期待的眼神看她。艾米还不断含沙射影，讽刺那些嘴上总说要学好、别人做出好榜样时自己却连试也不肯试的人。
        - id: ch03-b02
          speaker: jo
          text: “人人都讨厌。我去找劳里滑冰。他总是又和气又快活，一定能让我好受些。”
        - id: ch03-b03
          speaker: narrator
          text: 艾米听见冰鞋相碰的响声，朝窗外一看，马上抱怨起来。
        - id: ch03-b04
          speaker: amy
          text: “她答应下次带我去。天气一暖，今年就再也滑不成了。可她现在脾气这么坏，求她也没用。”
        - id: ch03-b05
          speaker: meg
          text: “别这么说。你先前确实很淘气。她失去那么心爱的书，很难马上原谅你。不过只要找对时候，我想她现在愿意和好了。追上他们吧。先等乔跟劳里玩得高兴些，再悄悄亲亲她，或替她做件好事。她一定会真心跟你和好。”
        - id: ch03-b06
          speaker: amy
          text: “我去试试。”
        - id: ch03-b07
          speaker: narrator
          text: 艾米匆忙穿戴好，跑去追那两个刚消失在小山后面的朋友。河边不远，可她赶到时，乔和劳里已经穿好冰鞋。乔看见她，立刻背过身去。前几天天气转暖，后来才骤冷，劳里正在岸边试探冰面是否结实，没有发现艾米。
        - id: ch03-b08
          speaker: laurie
          text: “我先滑到第一个河湾，看看冰面安不安全，然后咱们再比赛。”
        - id: ch03-b09
          speaker: narrator
          text: 劳里飞滑而去。他穿着镶毛的外套，戴着毛皮帽，像个年轻的俄国人。艾米跑得气喘吁吁，一边跺脚、呵手，一边费力穿冰鞋。乔全听见了，却不肯回头。她慢慢在河上来回滑动，从妹妹的狼狈里尝到了一点苦涩的满足。她任怒气留在心里，越长越强，终于被它整个占据。邪恶的念头若不及时赶走，总会如此。
        - id: ch03-b10
          speaker: laurie
          text: “靠近岸边滑！河中央不安全！”
        - id: ch03-b11
          speaker: narrator
          text: 劳里在河湾处回头喊了一声。乔听到了，艾米却正摇摇晃晃地站起来，一个字也没听见。乔回头看了看，心里的那个小魔鬼悄悄对她说，艾米听没听见都无所谓，让她自己照顾自己吧。
        - id: ch03-b12
          speaker: narrator
          text: 劳里消失在河湾后。乔刚到转弯处，远远落在后面的艾米却朝河中央更光滑的冰面滑去。乔停了一会儿，心里掠过一种奇怪的感觉。她仍想往前滑，可仿佛有什么力量拦住她，逼她转过身来。
        - id: ch03-b13
          speaker: narrator
          text: 正在那一刻，艾米猛地扬起双手。腐朽的冰面喀嚓裂开，水花四溅，她整个人掉了下去。妹妹那一声惊叫，让乔的心都停住了。她想喊劳里，喉咙却发不出声音。她想冲过去，双脚又像被抽空了力气。整整一瞬间，她只能一动不动地站着，满脸惊恐，死死盯住黑水上那顶小小的蓝兜帽。忽然有个身影飞快从她身旁掠过，劳里大喊起来。
        - id: ch03-b14
          speaker: laurie
          text: “快拿一根栏杆来！快！”
          emotion: fearful
        - id: ch03-b15
          speaker: narrator
          text: 乔后来根本不记得自己是怎么做到的。接下来的几分钟，她像被什么力量附住一样拼命行动，只知道一声不响地服从劳里。劳里始终十分镇定。他平趴在冰面上，一边用手臂抓紧艾米，一边拿曲棍球杆支撑住她。乔从篱笆上硬拖来一根栏杆，两个人借着它一起把孩子救了出来。艾米惊吓得厉害，身体倒没有受什么伤。
        - id: ch03-b16
          speaker: laurie
          text: “现在得尽快扶她回家。把咱们的东西都裹在她身上。我先脱掉这双该死的冰鞋。”
        - id: ch03-b17
          speaker: narrator
          text: 劳里用自己的外套包住艾米，拼命扯那些从来没有这样难解的冰鞋带子。三个人发着抖，身上滴着水，又一路哭着，终于把艾米送回家。屋里随即经历了一阵紧张的忙乱。最后，她被一层层毯子裹得严严实实，躺在旺火前睡着了。
        - id: ch03-b18
          speaker: narrator
          text: 在这一阵忙乱里，乔几乎没说一句话，只苍白着脸、神情失常地四处奔忙。她身上的东西只脱了一半，裙子也撕破了，双手被冰块、栏杆和那些不听话的鞋扣割伤撞青。等艾米舒舒服服地睡熟，屋里终于静下来，马奇太太坐在床边，把乔叫到自己身旁，开始替她包扎受伤的双手。
        - id: ch03-b19
          speaker: jo
          text: “您确定她真的没事了吗？”
          emotion: fearful
        - id: ch03-b20
          speaker: narrator
          text: 乔悔恨地看着妹妹金发的小脑袋。那片危险的冰差点把艾米永远卷走。
        - id: ch03-b21
          speaker: mrs_march
          text: “完全没事，亲爱的。她没有受伤，我想也不会伤风。你很懂事，马上把她裹暖，又赶快送了回来。”
          emotion: calm
        - id: ch03-b22
          speaker: jo
          text: “都是劳里做的。我只顾把她丢下。妈妈，如果她死了，就是我的错。”
          emotion: sad
        - id: ch03-b23
          speaker: narrator
          text: 乔跪在床边，悔恨得放声痛哭。她说出全部经过，痛骂自己心肠太硬，又哭着庆幸那场可怕的惩罚没有真的降临。
        - id: ch03-b24
          speaker: jo
          text: “都是我这可怕的脾气！我一直想改，以为已经改好了，可它一发作，比以前还坏。妈妈，我怎么办？我到底该怎么办？”
          emotion: sad
    - id: ch04
      title: 藏在胸中的敌人
      blocks:
        - id: ch04-b01
          speaker: mrs_march
          text: “时时留心，时时祈祷，亲爱的。别厌倦努力，也别觉得自己的缺点永远战胜不了。”
          emotion: calm
        - id: ch04-b02
          speaker: narrator
          text: 马奇太太把乔蓬乱的脑袋搂到肩上，温柔地亲吻她泪湿的脸。乔反而哭得更厉害。
        - id: ch04-b03
          speaker: jo
          text: “您不知道它有多坏！我一发火，什么都做得出来。我会变得那么凶，伤害别人还觉得痛快。我怕有一天做出可怕的事，毁掉自己的一生，让所有人都恨我。妈妈，求您帮帮我！”
          emotion: fearful
        - id: ch04-b04
          speaker: mrs_march
          text: “我会帮你，我的孩子。别这样伤心地哭，可一定要记住今天，下决心不让它重来。每个人都有自己的诱惑，有些比你的还要强，战胜它们往往要用一辈子。你觉得自己的脾气最坏，可我从前跟你一模一样。”
          emotion: calm
        - id: ch04-b05
          speaker: jo
          text: “您吗？可您从来不生气呀！”
          emotion: surprised
        - id: ch04-b06
          speaker: mrs_march
          text: “我改了四十年，到现在也只学会了控制它。乔，我差不多每天都会生气，只是已经学会不让别人看出来。我还盼着有一天连心里的怒气也没有，哪怕还要再用四十年。”
        - id: ch04-b07
          speaker: narrator
          text: 乔望着自己深爱的那张脸。母亲脸上的耐心和谦卑，比最聪明的说教、最严厉的责备都更能教导她。母亲愿意理解她，也信任她，乔立刻觉得好受多了。原来母亲也有同样的缺点，也在努力改正。这不但让乔觉得自己的毛病没那么难以承受，也让她更坚定了改过的心。不过对一个十五岁的姑娘来说，四十年的警醒和祈祷，实在久得吓人。
        - id: ch04-b08
          speaker: jo
          text: “马奇姑妈责骂您，或别人惹您烦恼时，您有时会紧紧闭住嘴，走出房间。那时您也在生气吗？”
        - id: ch04-b09
          speaker: mrs_march
          text: “是的。我已经会把冲到嘴边的话拦住。要是它们非要闯出来，我就先走开一会儿，也提醒自己，不该这样软弱，这样不好。”
        - id: ch04-b10
          speaker: narrator
          text: 马奇太太叹息着笑了笑，又把乔散乱的头发理好。
        - id: ch04-b11
          speaker: jo
          text: “您怎么学会忍住不说的？我最难办的就是这个。伤人的话总在我明白以前冲出来。我越说越气，最后竟喜欢刺痛别人，专挑可怕的话说。亲爱的妈妈，告诉我您是怎么做的。”
        - id: ch04-b12
          speaker: mrs_march
          text: “以前，我的好母亲常常帮助我……”
        - id: ch04-b13
          speaker: jo
          text: “就像您帮助我们这样。”
        - id: ch04-b14
          speaker: narrator
          text: 乔感激地亲了母亲一下。马奇太太接着说下去。
        - id: ch04-b15
          speaker: mrs_march
          text: “可我只比你大一点儿时，就失去了母亲。后来许多年，我只能一个人挣扎，因为我太骄傲，不肯对别人承认自己的弱点。那段日子很苦。每次失败，我都会流许多眼泪，不管怎样努力，好像总没有进步。后来你父亲来到我身边。我很幸福，做好人也容易了。再后来，我有了四个小女儿，家里又很穷，老毛病便回来了。我天生没有耐心，看见孩子们缺少东西，更叫我难受。”
        - id: ch04-b16
          speaker: jo
          text: “可怜的妈妈！后来谁帮助了您？”
        - id: ch04-b17
          speaker: mrs_march
          text: “是你父亲。他从不失去耐心，不怀疑，也不抱怨。他总是怀着希望，快活地工作，也快活地等待。站在他身边，谁都会不好意思做得不如他。他一直帮助我，也安慰我。他让我明白，我希望女儿们有怎样的美德，自己就得先在生活里照着做，因为我是你们的榜样。为了你们而努力，比只为了自己容易得多。”
        - id: ch04-b18
          speaker: mrs_march
          text: “我说话一尖刻，你们露出惊讶或害怕的神情，比什么责备都更有效。你们给我的爱、尊敬和信任，就是最甜蜜的奖赏。它们让我努力成为一个值得女儿们学习的母亲。”
        - id: ch04-b19
          speaker: jo
          text: “妈妈，我将来只要有您一半好，就满足了。”
        - id: ch04-b20
          speaker: mrs_march
          text: “我希望你比我好得多。不过，你一定要提防父亲说的那个‘藏在胸中的敌人’。不然，它即使不毁掉你的人生，也会让你一生难过。今天就是一次警告。记住它，趁这副急脾气还没带来更深的悲伤和悔恨，全心全意制服它。”
        - id: ch04-b21
          speaker: jo
          text: “我一定努力。可您要帮助我、提醒我，别让我又发作。我以前见过爸爸把手指放在嘴唇上，很温和又很严肃地看您。您马上闭紧嘴，离开房间。他那时是在提醒您吗？”
        - id: ch04-b22
          speaker: mrs_march
          text: “是的。我请他这样帮我，他一次也没有忘。那一个小手势和一道温和的目光，替我拦住了许多伤人的话。”
        - id: ch04-b23
          speaker: narrator
          text: 母亲说着，眼里涌起泪水，嘴唇也微微发抖。乔怕自己问得太多，赶紧低声解释。
        - id: ch04-b24
          speaker: jo
          text: “我留心看您，还把它说出来，是不是不应该？我不是故意无礼。只是能把心里所有的话都告诉您，让我觉得又安心又幸福。”
        - id: ch04-b25
          speaker: mrs_march
          text: “我的乔，你什么都可以告诉母亲。我的女儿们信任我，也知道我多么爱她们，这就是我最大的幸福和骄傲。”
          emotion: calm
        - id: ch04-b26
          speaker: jo
          text: “我以为自己让您伤心了。”
        - id: ch04-b27
          speaker: mrs_march
          text: “没有，亲爱的。只是提到父亲，我想起自己有多么思念他，欠他多少。我也该忠实地警醒和努力，替他把几个小女儿照顾得平安善良。”
        - id: ch04-b28
          speaker: jo
          text: “可当初是您让爸爸走的。他离开时，您没有哭。现在您也从不抱怨，像是根本不需要帮助。”
        - id: ch04-b29
          speaker: mrs_march
          text: “我把自己最珍爱的人献给了所爱的国家，等他走后才流泪。我们两个人都只是尽了自己的责任，到最后也一定会因此更加幸福，我又为什么要抱怨呢？如果我看起来不需要谁来帮助，那是因为我有一位甚至比你父亲更好的朋友。他一直安慰我，也一直给我力量，让我能够支撑下去。”
        - id: ch04-b30
          speaker: mrs_march
          text: “我的孩子，你一生的烦恼和诱惑才刚开始，以后也许还有很多。只要你能像感受人间父亲的力量和慈爱一样，感受天父的力量和慈爱，就能战胜它们，熬过它们。你越爱他，越信赖他，就会离他越近，也越不依赖凡人的力量和智慧。他的爱与照顾永不疲倦，永不改变，谁也夺不走。它能给你一生的平安、幸福和力量。”
        - id: ch04-b31
          speaker: mrs_march
          text: “真心相信这些吧。把你小小的忧虑、希望、过错和悲伤都带到上帝面前，就像来到母亲这里一样自在，一样信赖。”
          emotion: calm
        - id: ch04-b32
          speaker: narrator
          text: 乔没有回答，只紧紧抱住母亲。随后的一片静默里，她献上了一生中最真诚的祈祷。那祈祷没有一句话，却全是从心底发出的。那个悲伤又幸福的时刻，让她不但尝到了悔恨和绝望的苦，也尝到了克己和自制的甜。母亲牵着她，让她更靠近那位永远欢迎每个孩子的朋友。他的爱比任何父亲的爱更强，比任何母亲的爱更温柔。
        - id: ch04-b33
          speaker: narrator
          text: 艾米在睡梦里动了动，轻轻叹息。乔像是急着立刻改正错误，抬起头来，脸上有了一种从未有过的神情。
        - id: ch04-b34
          speaker: jo
          text: “我真的带着怒气看太阳落下去了。我不肯原谅她。今天如果没有劳里，也许一切都太迟了。我怎么会那么坏？”
          emotion: sad
        - id: ch04-b35
          speaker: narrator
          text: 乔俯下身，轻轻抚摸妹妹散在枕头上的湿发。艾米仿佛在睡梦中听见了。她睁开眼睛，向姐姐伸出双臂，脸上的微笑一下触到乔的心底。姐妹俩谁也没说一句话，只隔着厚厚的毯子紧紧相拥。一个真心实意而又热烈的吻，让一切都得到原谅，也被彻底忘记。
