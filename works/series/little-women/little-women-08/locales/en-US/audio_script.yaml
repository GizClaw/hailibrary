  chapters:
    - id: ch01
      title: The Theater and the Little Book
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One Saturday afternoon, Amy came into the girls' room and found Jo and Meg getting ready to go out. They were being so secretive that she had to know why.
        - id: ch01-b02
          speaker: amy
          text: Where are you two going?
        - id: ch01-b03
          speaker: jo
          text: Never mind. Little girls shouldn't ask so many questions.
        - id: ch01-b04
          speaker: narrator
          text: Nothing makes a young person feel smaller than being told that. Amy drew herself up and decided she would tease out the secret if it took all afternoon. Meg usually gave in to her sooner or later, so Amy turned coaxing.
        - id: ch01-b05
          speaker: amy
          text: Oh, please tell me! You could take me, too. Beth is busy with her piano, and I've got nothing to do. I'm so lonely.
        - id: ch01-b06
          speaker: meg
          text: We can't take you, dear. You weren't invited.
        - id: ch01-b07
          speaker: jo
          text: Meg, hush, or you'll spoil everything. Amy, you can't come, so stop whining like a baby.
        - id: ch01-b08
          speaker: amy
          text: You're going somewhere with Laurie. I know it. You were whispering and laughing on the sofa last night, and you stopped as soon as I came in. Aren't you going with him?
        - id: ch01-b09
          speaker: jo
          text: Yes, we are. Now please be quiet and leave us alone.
        - id: ch01-b10
          speaker: narrator
          text: Amy stopped talking, but she kept watching. When Meg slipped a fan into her pocket, the secret became clear.
        - id: ch01-b11
          speaker: amy
          text: I know! You're going to the theater to see The Seven Castles! Well, I'm coming. Mother said I could see it, I have my rag money, and it was mean of you not to tell me sooner.
        - id: ch01-b12
          speaker: meg
          text: Listen, dear. Mother doesn't want you going this week. Your eyes still aren't strong enough for all the bright lights in the fairy show. You can go next week with Beth and Hannah and enjoy it then.
          emotion: calm
        - id: ch01-b13
          speaker: amy
          text: That won't be half as much fun as going with you and Laurie. Please take me. I've been sick and shut indoors so long that I'm desperate for some fun. I promise I'll be good.
        - id: ch01-b14
          speaker: meg
          text: Maybe we could bundle her up and take her. I don't think Mother would mind.
        - id: ch01-b15
          speaker: jo
          text: Then I won't go. Laurie invited us, not Amy. If I stay home, he'll be disappointed, and if we drag her along, that's rude. I don't know why she'd want to push in where nobody asked for her.
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: Jo had wanted an afternoon of fun, not the trouble of watching a restless child. Her words and manner made Amy furious. Amy began pulling on her boots in the most provoking way she could manage.
        - id: ch01-b17
          speaker: amy
          text: I'm going. Meg said I could, and if I buy my own ticket, Laurie can't object.
        - id: ch01-b18
          speaker: jo
          text: Our seats are reserved. You can't sit alone, so Laurie would have to give you his place and ruin everything. Or he'd have to buy you another seat when you weren't even invited. You're not going one step. Stay right here.
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: Jo had just pricked her finger in her hurry, which made her crosser still. Amy sat on the floor with one boot on and burst into tears. Meg tried to reason with her, but Laurie called from downstairs. Jo and Meg hurried away, leaving Amy wailing behind them. Sometimes Amy forgot her grown-up airs and behaved like a spoiled child. As the others were leaving, she called down over the banister.
        - id: ch01-b20
          speaker: amy
          text: You'll be sorry for this, Jo March. Just wait and see!
          emotion: angry
        - id: ch01-b21
          speaker: jo
          text: Fiddlesticks!
        - id: ch01-b22
          speaker: narrator
          text: Jo slammed the door. The theater was everything they had hoped for. There were funny red imps, glittering elves, and splendid princes and princesses. Still, Jo's pleasure had one bitter drop in it. The fairy queen's yellow curls reminded her of Amy, and between the acts she wondered how her sister meant to make her sorry.
        - id: ch01-b23
          speaker: narrator
          text: Jo and Amy had quarreled many times before. Both had quick tempers, and once they were thoroughly roused, they could become fierce. Amy knew exactly how to tease Jo, and Jo knew how to irritate Amy. Every so often, one of their little battles exploded, leaving both girls ashamed afterward. Jo was older, but she had less control over herself. Her anger passed quickly, and once she admitted she was wrong, she truly repented and tried to do better. Her sisters joked that they almost liked making Jo furious because she became such an angel afterward. Poor Jo fought desperately to be good, but her fiery temper, her bosom enemy, was always ready to flare up and defeat her. It took her years of patient effort to master it.
        - id: ch01-b24
          speaker: narrator
          text: When the girls came home, Amy sat reading in the parlor. She looked deeply injured and never raised her eyes or asked one question about the show. Her curiosity might have defeated her resentment if Beth had not been there to ask questions and hear the whole glowing description. Upstairs, Jo went straight to her bureau. During their last quarrel, Amy had soothed her feelings by dumping Jo's top drawer onto the floor. This time everything was in place. After a quick search through her closets, bags, and boxes, Jo decided Amy had forgiven her and forgotten the insult.
        - id: ch01-b25
          speaker: narrator
          text: She was wrong. Late the next afternoon, Meg, Beth, and Amy were sitting together when Jo rushed into the room, breathless and upset.
        - id: ch01-b26
          speaker: jo
          text: Has anyone taken my book?
        - id: ch01-b27
          speakers: [meg, beth]
          ensemble: duo
          text: No.
        - id: ch01-b28
          speaker: narrator
          text: Meg and Beth looked surprised. Amy stared into the fire and said nothing. Jo saw the color rise in her face and pounced.
        - id: ch01-b29
          speaker: jo
          text: Amy, you have it!
        - id: ch01-b30
          speaker: amy
          text: No, I don't.
        - id: ch01-b31
          speaker: jo
          text: Then you know where it is.
        - id: ch01-b32
          speaker: amy
          text: No, I don't.
        - id: ch01-b33
          speaker: jo
          text: That's a lie!
          emotion: angry
        - id: ch01-b34
          speaker: narrator
          text: Jo seized Amy by the shoulders. Her face was fierce enough to frighten a much braver child.
        - id: ch01-b35
          speaker: amy
          text: It isn't! I don't have it, I don't know where it is now, and I don't care.
        - id: ch01-b36
          speaker: jo
          text: You know something. Tell me now, or I'll make you.
          emotion: angry
        - id: ch01-b37
          speaker: narrator
          text: Jo gave her a small shake, and Amy's temper rose to meet hers.
        - id: ch01-b38
          speaker: amy
          text: Scold all you want. You'll never see your silly old book again.
          emotion: angry
        - id: ch01-b39
          speaker: jo
          text: Why not?
        - id: ch01-b40
          speaker: amy
          text: Because I burned it.
        - id: ch01-b41
          speaker: jo
          text: What? My little book? The one I loved and worked on for so long? I meant to finish it before Father came home. Did you truly burn it?
          emotion: surprised
        - id: ch01-b42
          speaker: narrator
          text: Jo turned white. Her eyes flashed, and her hands tightened on Amy.
        - id: ch01-b43
          speaker: amy
          text: Yes, I did! I warned you I'd make you pay for yesterday, and now I have, so—
          emotion: angry
        - id: ch01-b44
          speaker: narrator
          text: Amy never finished. Jo's temper took command. She shook Amy until her teeth chattered.
        - id: ch01-b45
          speaker: jo
          text: You wicked, wicked girl! I can never write it again, and I'll never forgive you as long as I live!
          emotion: angry
        - id: ch01-b46
          speaker: narrator
          text: Meg rushed to rescue Amy, while Beth tried to calm Jo. Jo was beyond listening. She struck Amy's ear once, ran up to the old sofa in the attic, and fought out the rest of her grief alone.
    - id: ch02
      title: Anger at Home
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Downstairs, the storm soon passed. Marmee came home, heard the story, and made Amy understand how deeply she had wronged Jo. That little book was Jo's pride, and the whole family treated it like the first green shoot of a real writing talent. It held only six little fairy tales, but Jo had worked patiently over every one. She poured her whole heart into them because she hoped to create something good enough to print one day.
        - id: ch02-b02
          speaker: narrator
          text: Jo had carefully copied the stories and destroyed her rough pages. Amy's fire had burned the only copy of all that loving work. Other people might have called it a small loss, but to Jo it was a dreadful disaster that could never be repaired. Beth mourned as though a beloved kitten had died. Meg refused to defend her favorite sister this time, and Marmee looked grave and deeply hurt. Seeing the whole family grieve made Amy understand the size of what she had done. She began to feel that no one could love her again until she asked Jo's pardon for the act she now regretted more than any of them did.
        - id: ch02-b03
          speaker: narrator
          text: When the bell rang for tea, Jo came down looking so grim that Amy had to gather all her courage.
        - id: ch02-b04
          speaker: amy
          text: Please forgive me, Jo. I am so, so sorry.
          emotion: sad
        - id: ch02-b05
          speaker: jo
          text: I will never forgive you.
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: From then on, Jo acted as though Amy were not there. Nobody discussed the trouble, not even Marmee. They had learned that words did no good when Jo was in this mood. It was better to wait until some small accident, or Jo's own generous heart, softened her anger.
        - id: ch02-b07
          speaker: narrator
          text: The evening was miserable. The girls sewed as usual while Marmee read aloud from Bremer, Scott, or Edgeworth, but something essential was missing. The sweet peace of home had been disturbed. They felt the loss most when it was time to sing. Beth could only play the piano. Jo stood as silent as a stone, and Amy's voice broke down. Meg and Marmee sang by themselves, trying to sound as cheerful as larks, but their flute-like voices did not blend as they usually did. Everyone felt out of tune.
        - id: ch02-b08
          speaker: narrator
          text: When Marmee kissed Jo good night, she whispered gently.
        - id: ch02-b09
          speaker: marmee
          text: My dear, don't let the sun go down while you're still angry. Forgive each other, help each other, and begin again tomorrow.
          emotion: calm
        - id: ch02-b10
          speaker: narrator
          text: Jo wanted to rest her head against Marmee and cry away all her grief and rage. But she thought tears were weak, and she still felt too badly hurt to forgive. Because Amy was listening, Jo blinked hard, shook her head, and made her voice rough.
        - id: ch02-b11
          speaker: jo
          text: What she did was horrible. She doesn't deserve forgiveness.
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: Jo marched off to bed. That night there was none of the sisters' usual happy, private talk.
        - id: ch02-b13
          speaker: narrator
          text: Amy was offended that Jo had rejected her attempt at peace. She began to wish she had never lowered herself by apologizing. Soon she felt more injured than ever and acted proudly virtuous, which made everything worse. Jo remained as dark as a thundercloud, and the next day went badly from start to finish. The morning was bitterly cold. Jo dropped her precious turnover in the gutter. Aunt March was unusually fussy. Meg was sensitive, and Beth kept looking sad whenever Jo came home. Worst of all, Amy made pointed remarks about people who talked of being good but refused to follow anyone else's virtuous example.
        - id: ch02-b14
          speaker: jo
          text: Everyone is hateful today. I'll ask Laurie to go skating. He's always kind and cheerful, and he'll make me feel right again.
        - id: ch02-b15
          speaker: narrator
          text: Jo went off to find him. Amy heard the skates clashing together and looked out the window impatiently.
        - id: ch02-b16
          speaker: amy
          text: There she goes! She promised to take me next time, and this may be our last ice of the winter. But there's no point asking someone that cross.
        - id: ch02-b17
          speaker: meg
          text: Don't talk that way. You did something very wrong, and losing that book is hard for Jo to forgive. But I think she can forgive you now if you choose the right moment. Follow them. Wait until Laurie has put Jo in a better mood. Then find a quiet moment, kiss her, or do something kind. I'm sure she'll make peace with her whole heart.
        - id: ch02-b18
          speaker: amy
          text: I'll try.
        - id: ch02-b19
          speaker: narrator
          text: The advice suited Amy. She hurried to get ready, then ran after Jo and Laurie as they disappeared over the hill.
    - id: ch03
      title: The Treacherous Ice
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The river was not far away, but Jo and Laurie had their skates on before Amy reached them. Jo saw her coming and turned her back. Laurie did not notice. A warm spell had come before the new freeze, so he was moving carefully along the shore and testing the ice.
        - id: ch03-b02
          speaker: laurie
          text: I'll check the ice as far as the first bend. If it's sound, we can start our race.
        - id: ch03-b03
          speaker: narrator
          text: Amy heard him before he sped away in his fur-trimmed coat and cap, looking like a young Russian. Jo heard Amy panting from her run. She heard her stamp her feet and blow on her fingers while struggling with her skates. Still, Jo did not turn. She zigzagged slowly down the river and took a bitter, unhappy pleasure in Amy's trouble. Jo had held on to her anger until it had grown strong enough to rule her.
        - id: ch03-b04
          speaker: narrator
          text: Laurie reached the bend and shouted back.
        - id: ch03-b05
          speaker: laurie
          text: Stay close to shore! The middle isn't safe!
        - id: ch03-b06
          speaker: narrator
          text: Jo heard him. Amy was just getting to her feet and missed every word. Jo glanced behind her, and the angry little voice she had been feeding seemed to whisper that it did not matter. Amy could take care of herself.
        - id: ch03-b07
          speaker: narrator
          text: Laurie vanished around the bend. Jo had nearly reached it, while Amy, far behind, skated toward the smoother ice in the middle. Jo stopped for a moment with a strange feeling in her heart. She decided to keep going, but something made her turn around.
        - id: ch03-b08
          speaker: narrator
          text: At that instant, Amy threw up her hands and plunged through the rotten ice. There was a crash, a splash, and one cry that stopped Jo's heart. She tried to call Laurie, but no sound came. She tried to move, but her legs had no strength. For one terrible second, she could only stare at Amy's little blue hood above the black water.
        - id: ch03-b09
          speaker: narrator
          text: Then someone rushed past her. Laurie called out as he went.
        - id: ch03-b10
          speaker: laurie
          text: Get a fence rail! Hurry!
        - id: ch03-b11
          speaker: narrator
          text: Jo never knew how she managed it. For the next few minutes, she obeyed Laurie without thinking. He stayed calm, lay flat on the ice, and held Amy above the water with one arm and his hockey stick. Jo dragged a rail from the fence. Working together, they pulled Amy out. She was more frightened than injured.
        - id: ch03-b12
          speaker: laurie
          text: We have to walk her home as fast as we can. Wrap all our things around her while I get these awful skates off.
        - id: ch03-b13
          speaker: narrator
          text: Laurie put his coat around Amy and tugged at skate straps that had never seemed so complicated before. Amy shivered, dripped, and cried as they hurried her home on foot. The house filled with frightened activity as everyone worked to warm her. At last, Amy fell asleep wrapped in blankets beside a hot fire.
        - id: ch03-b14
          speaker: narrator
          text: Jo had barely spoken during the commotion. She flew from one task to another, pale and wild, her clothes half removed, her dress torn, and her hands cut and bruised by the ice, the rail, and the stubborn buckles. Once Amy was sleeping comfortably and the house was quiet, Marmee called Jo to the bedside and began bandaging her hands.
        - id: ch03-b15
          speaker: jo
          text: Are you certain she's safe?
          emotion: fearful
        - id: ch03-b16
          speaker: narrator
          text: Jo looked at Amy's golden head and thought how easily it might have vanished forever beneath the dangerous ice.
        - id: ch03-b17
          speaker: marmee
          text: She is quite safe, dear. She isn't hurt, and I don't believe she'll even catch cold. You covered her and brought her home so quickly.
          emotion: calm
        - id: ch03-b18
          speaker: jo
          text: Laurie did everything. I was the one who let her go. Mother, if she dies, it will be my fault.
          emotion: fearful
        - id: ch03-b19
          speaker: narrator
          text: Jo dropped beside the bed and sobbed out the whole story. She bitterly blamed her hard heart and wept with gratitude that Amy had been spared.
        - id: ch03-b20
          speaker: jo
          text: It's this dreadful temper of mine! I try to cure it. I think I've finally done it, and then it bursts out worse than before. Mother, what can I do? What can I do?
          emotion: sad
        - id: ch03-b21
          speaker: marmee
          text: Watch yourself and pray, dear. Never stop trying, and never believe that your fault is impossible to conquer.
          emotion: calm
        - id: ch03-b22
          speaker: narrator
          text: Marmee drew Jo's untidy head to her shoulder and kissed her wet cheek so tenderly that Jo cried harder.
        - id: ch03-b23
          speaker: jo
          text: You don't know how bad it is. When I'm furious, I feel as if I could do anything. I become so savage that I could hurt someone and enjoy it. Someday I may do something terrible, ruin my life, and make everyone hate me. Oh, Mother, please help me!
          emotion: fearful
        - id: ch03-b24
          speaker: marmee
          text: I will help you, my child. Don't cry so desperately. Remember this day, and decide with your whole heart that you will never have another like it. We all have temptations, Jo. Some are much greater than yours, and conquering them can take a lifetime. You think your temper is the worst in the world, but mine was once just like it.
          emotion: calm
        - id: ch03-b25
          speaker: jo
          text: Yours? Mother, you are never angry!
          emotion: surprised
        - id: ch03-b26
          speaker: marmee
          text: I have worked on it for forty years, and so far I've only learned to control it. I feel angry nearly every day, Jo, but I have learned not to show it. I still hope to stop feeling it one day, even if that takes forty more years.
        - id: ch03-b27
          speaker: narrator
          text: The patience and humility in the face Jo loved taught her more than the wisest lecture or the sharpest scolding ever could. Her mother's sympathy and trust comforted her at once. Marmee had the same fault, yet she had kept working to mend it. That knowledge made Jo's own burden easier to carry and strengthened her decision to cure it. Still, forty years of watching and praying sounded like a very long time to a girl of fifteen.
    - id: ch04
      title: Marmee's Lesson
      blocks:
        - id: ch04-b01
          speaker: jo
          text: Mother, are you angry on those days when Aunt March scolds or people bother you? Is that why you press your lips together and leave the room?
        - id: ch04-b02
          speaker: narrator
          text: Jo felt closer to her mother than ever before.
        - id: ch04-b03
          speaker: marmee
          text: Yes. I've learned to stop the quick words that rise to my lips. When I feel them trying to escape, I go away for a minute and give myself a little shake for being so weak and wrong.
        - id: ch04-b04
          speaker: narrator
          text: Marmee sighed and smiled as she smoothed Jo's tangled hair and pinned it up.
        - id: ch04-b05
          speaker: jo
          text: How did you learn to stay quiet? That's my worst trouble. The sharp words fly out before I know it. Then every word makes me angrier, until I actually enjoy hurting people and saying dreadful things. Please tell me how you do it, Marmee.
        - id: ch04-b06
          speaker: marmee
          text: My own good mother used to help me—
        - id: ch04-b07
          speaker: jo
          text: The way you help us.
        - id: ch04-b08
          speaker: narrator
          text: Jo interrupted with a grateful kiss.
        - id: ch04-b09
          speaker: marmee
          text: But I lost her when I was only a little older than you. For years I struggled alone because I was too proud to tell anyone else about my weakness. It was very hard, Jo. I cried many bitter tears over my failures, because no matter how much I tried, I never seemed to improve. Then your father came. I was so happy that being good felt easy.
        - id: ch04-b10
          speaker: marmee
          text: Later, when we were poor and I had four little daughters around me, the old trouble returned. Patience does not come naturally to me, and it was very hard to watch my children go without things they needed.
        - id: ch04-b11
          speaker: jo
          text: Poor Mother. What helped you then?
        - id: ch04-b12
          speaker: marmee
          text: Your father helped me. He never loses patience. He doesn't doubt or complain. He keeps hoping, working, and waiting so cheerfully that everyone near him wants to do the same. He comforted me and showed me that I had to practice the virtues I wanted my girls to learn, because I was their example.
        - id: ch04-b13
          speaker: marmee
          text: Trying for your sake was easier than trying for my own. One startled look from any of you after I spoke sharply corrected me better than words could. Your love, respect, and trust became the sweetest reward for all my efforts to be the kind of woman I wanted you to follow.
        - id: ch04-b14
          speaker: jo
          text: Oh, Mother, if I can ever be half as good as you, I'll be satisfied.
        - id: ch04-b15
          speaker: marmee
          text: I hope you'll be much better than I am, dear. But you must watch your bosom enemy, as Father calls it. Your temper may bring sadness into your life, or even spoil it. Today was a warning. Remember it, and work with all your heart to master that temper before it causes greater sorrow than you felt today.
        - id: ch04-b16
          speaker: jo
          text: I will try, Mother. I truly will. But please help me. Remind me and stop me when I'm about to burst out. Sometimes Father used to put one finger to his lips and give you a kind, serious look. Then you would close your lips tightly and go away. Was he reminding you?
        - id: ch04-b17
          speaker: marmee
          text: Yes. I asked him to help me that way, and he never forgot. That small gesture and loving look saved me from many sharp words.
        - id: ch04-b18
          speaker: narrator
          text: Marmee's eyes filled with tears, and her lips trembled. Jo worried that she had said too much.
        - id: ch04-b19
          speaker: jo
          text: Was it wrong of me to notice and mention it? I didn't mean to be rude. It just feels so comforting to tell you everything I think. I feel safe and happy here.
        - id: ch04-b20
          speaker: marmee
          text: My Jo, you can tell your mother anything. Nothing makes me happier or prouder than knowing my girls trust me and understand how much I love them.
        - id: ch04-b21
          speaker: jo
          text: I thought I had made you sad.
        - id: ch04-b22
          speaker: marmee
          text: No, dear. Talking about Father reminded me how much I miss him, how much I owe him, and how carefully I must work to keep his little girls safe and good while he's away.
          emotion: sad
        - id: ch04-b23
          speaker: jo
          text: But you told him to go. You didn't cry when he left, and now you never complain or act as though you need anyone's help.
        - id: ch04-b24
          speaker: marmee
          text: I gave my best to the country I love, and I saved my tears until he was gone. Why complain when we have both only done our duty and will be happier for it in the end? If I seem not to need help, it is because I have an even better friend than Father to comfort and support me.
        - id: ch04-b25
          speaker: marmee
          text: Your life's troubles and temptations are beginning, my child, and there may be many. But you can overcome them if you learn to feel the strength and tenderness of your Heavenly Father as clearly as you feel your earthly father's. The more you love and trust Him, the closer He will seem, and the less you will have to depend on human strength and wisdom.
        - id: ch04-b26
          speaker: marmee
          text: His love and care never grow tired or change, and no one can take them from you. They can give you peace, happiness, and strength throughout your life. Believe that with your whole heart. Bring God every little worry, hope, sin, and sorrow as freely and trustingly as you bring them to your mother.
          emotion: calm
        - id: ch04-b27
          speaker: narrator
          text: Jo answered only by holding Marmee close. In the silence, the most sincere prayer she had ever prayed rose from her heart without words. During that sad and happy hour, she learned the bitterness of remorse and despair, but also the sweetness of self-denial and self-control. With her mother's hand guiding her, Jo felt closer to the Friend who welcomes every child with a love stronger than a father's and more tender than a mother's.
        - id: ch04-b28
          speaker: narrator
          text: Amy stirred and sighed in her sleep. Eager to begin correcting her fault at once, Jo looked up with a new expression on her face.
        - id: ch04-b29
          speaker: jo
          text: I let the sun go down on my anger. I refused to forgive her, and today, without Laurie, it might have been too late. How could I have been so wicked?
          emotion: sad
        - id: ch04-b30
          speaker: narrator
          text: Jo spoke half aloud as she bent over Amy and gently stroked the wet hair spread across the pillow. As if she had heard, Amy opened her eyes. She smiled and held out her arms, and the smile went straight to Jo's heart.
        - id: ch04-b31
          speaker: narrator
          text: Neither sister said a word. They wrapped their arms around each other, blankets and all, and one wholehearted kiss forgave and forgot everything.
