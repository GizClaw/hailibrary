audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    hannah:
      display_name: 汉娜
      tts:
        delivery: 朴实爽直，乡音自然
        timbre: 温厚略粗
        pace: 从容
        pitch: 中低音
    meg:
      display_name: 梅格
      tts:
        delivery: 端庄温和，扮演主席时一本正经
        timbre: 柔润明亮
        pace: 稳健
        pitch: 中音
    jo:
      display_name: 乔
      tts:
        delivery: 热烈爽快，机敏而富有戏剧感
        timbre: 清亮有力
        pace: 明快
        pitch: 中音
    beth:
      display_name: 贝丝
      tts:
        delivery: 羞怯真诚，偶尔迸发勇气
        timbre: 轻柔圆润
        pace: 稍慢
        pitch: 中高音
    amy:
      display_name: 艾米
      tts:
        delivery: 讲究体面，稚气中带着郑重
        timbre: 清脆细致
        pace: 适中
        pitch: 中高音
    mrs_march:
      display_name: 马奇太太
      tts:
        delivery: 慈爱爽朗，沉稳中带着鼓励
        timbre: 饱满温暖
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 三个月的自由
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 六月一日，天气暖洋洋的。梅格一回家就兴奋地宣布，金家第二天要去海边，她终于有整整三个月的假期了。乔反常地累，四仰八叉躺在沙发上。贝丝替她脱掉满是灰尘的靴子，艾米调好一壶柠檬水，给大家解渴。
        - id: ch01-b02
          speaker: meg
          text: 我自由啦！这三个月，我非得痛痛快快过个够不可！
          emotion: happy
        - id: ch01-b03
          speaker: jo
          text: 马奇姑婆今天也走了，谢天谢地！我一路都怕她要我陪着去。她真要开口，我又会觉得自己应该答应。可普拉姆菲尔德闷得像墓地，我才不想去。送她上车时，她每叫我一声，我就吓一跳。我越想早点脱身，偏偏表现得越殷勤，还怕她舍不得放我走。车都开了，她又探出头喊：“乔瑟芬，你愿不愿……”我后面一个字也没听，转身就逃，一直跑过街角才敢喘气。
        - id: ch01-b04
          speaker: beth
          text: 可怜的乔。你冲进门时，真像有头熊在后面追你。
        - id: ch01-b05
          speaker: narrator
          text: 贝丝说着，把姐姐的双脚抱得舒舒服服，活像个照顾孩子的小妈妈。
        - id: ch01-b06
          speaker: amy
          text: 马奇姑婆真是个十足的“海蓬子”，是不是？
        - id: ch01-b07
          speaker: jo
          text: 你想说的是“吸血鬼”，不是海草。不过算啦，天这么热，谁还顾得上词性对不对。
        - id: ch01-b08
          speaker: amy
          text: 那么，假期里你们都想做什么？
        - id: ch01-b09
          speaker: meg
          text: 我要睡懒觉，什么也不干。整个冬天，我天天一早就得起床，还得替别人忙个不停。现在总该让我好好休息，只管享乐了。
        - id: ch01-b10
          speaker: jo
          text: 我可受不了这样昏昏沉沉地过。我已经攒了一大堆书。不出去寻欢……的时候，我就爬上老苹果树的宝座看书，一点儿时间也不浪费。
        - id: ch01-b11
          speaker: amy
          text: 不许说“寻欢作乐”！
        - id: ch01-b12
          speaker: jo
          text: 好吧，那就说跟劳里去“听夜莺”。这说法够端正，也很贴切，谁叫他本来就会唱歌呢。
        - id: ch01-b13
          speaker: amy
          text: 贝丝，我们也停一个假期的课吧？像姐姐们那样，天天玩，天天休息。
        - id: ch01-b14
          speaker: beth
          text: 好呀，只要妈妈答应。我想学几首新歌，还得给我的孩子们换上夏装。她们现在乱糟糟的，简直没衣服穿。
        - id: ch01-b15
          speaker: meg
          text: 妈妈，可以让我们试试吗？
        - id: ch01-b16
          speaker: narrator
          text: 马奇太太正坐在“妈妈角”里缝衣服。
        - id: ch01-b17
          speaker: mrs_march
          text: 可以。先试一个星期，看看你们是不是真喜欢。我猜到了星期六晚上，你们就会发现，只玩不做事，和只做事不玩一样糟。
        - id: ch01-b18
          speaker: meg
          text: 才不会呢！一定会好极了。
        - id: ch01-b19
          speaker: narrator
          text: 柠檬水传到每个人手里，乔举起杯子站了起来。
        - id: ch01-b20
          speaker: jo
          text: 现在，我要借用我的“朋友兼搭档莎里·甘普”的话，提议大家干一杯。愿玩乐永远不散，苦工从此消失！
          emotion: happy
        - id: ch01-b21
          speaker: narrator
          text: 大家高高兴兴喝了这一杯，剩下的半天全拿来闲躺。她们的试验就这样开始了。
    - id: ch02
      title: 只玩不做的一星期
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天，梅格睡到十点才下来。一个人吃早饭没滋没味，屋里也又冷清又凌乱。乔没有换花瓶里的花，贝丝没有掸灰，艾米的书散得到处都是。只有“妈妈角”还是那么整洁舒服。梅格坐进去休息看书，其实一直在打哈欠，心里盘算的全是能用薪水买什么夏装。
        - id: ch02-b02
          speaker: narrator
          text: 乔上午跟劳里去划船，下午爬上苹果树，一边看《茫茫世界》，一边哭得稀里哗啦。贝丝把全家的玩偶都从大橱里翻出来，收拾到一半便累了。她丢下那个乱七八糟的小家，跑去练琴，还暗自庆幸不用洗碗。艾米收拾好凉棚，穿上最好的白裙子，理顺卷发，坐在金银花下画画，盼着有人发现这位年轻画家。结果只有一只长脚蚊来看她的画。她只好出去散步，又遇上阵雨，回家时浑身都在滴水。
        - id: ch02-b03
          speaker: narrator
          text: 到了茶点时间，四姐妹交换了一天的经历。她们都说这一天非常愉快，只是长得出奇。梅格买了一块可爱的蓝色细棉布，剪开后才发现不能下水洗。乔晒脱了鼻尖的皮，又因为看书太久，头疼起来。贝丝放不下那一橱混乱，还同时学了三四首歌，越学越烦。艾米更心疼淋坏的裙子。第二天就是凯蒂·布朗的宴会，她觉得自己也像弗洛拉·麦克弗利姆西一样，没衣服可穿了。
        - id: ch02-b04
          speaker: narrator
          text: 她们把这些都当成小事，再三向母亲保证，试验好得不得了。马奇太太只微笑，并不回答。她和汉娜接过姑娘们丢下的活，照常收拾房间、料理饭食，让家里仍旧舒服，让每天的日子还能照常运转。可休息和享乐竟会把生活弄得这么别扭，实在叫人意外。
        - id: ch02-b05
          speaker: narrator
          text: 日子一天比一天长。天气阴晴不定，姑娘们的脾气也跟着变。人人都静不下心，而闲着的手最容易让撒旦找上门。梅格把一部分针线活送去请人代做，空出来的时间反倒压得她难受。她拿剪刀照莫法特家的样式改衣服，结果把衣裳糟蹋了。乔读到眼睛受不了，自己也看烦了。她烦躁起来，连好脾气的劳里都跟她吵了一场。后来她又沮丧得宁愿当初跟马奇姑婆走。
        - id: ch02-b06
          speaker: narrator
          text: 贝丝过得还算好，因为她常常忘记这星期只许玩，不许做事，悄悄又回到原来的习惯里。不过她也受了影响，有一次竟抓住可怜的乔安娜使劲摇，还骂它难看死了。艾米最难熬。她想不出多少消遣，姐姐们又各玩各的。没过多久，她便发现，自己这个多才多艺又举足轻重的小人物，竟成了自己的沉重负担。玩偶太幼稚，童话也太幼稚，画画不能画上一整天，茶会没意思，野餐不够讲究也没意思。
        - id: ch02-b07
          speaker: amy
          text: 要是能住在漂亮的大房子里，周围全是可爱的姑娘，或者能出去旅行，这个夏天才会美呢。可天天困在家里，对着三个自私的姐姐，还有一个长大的男孩子，就连“波阿斯”也受不了。
        - id: ch02-b08
          speaker: narrator
          text: 没有人肯承认自己已经厌了。可到了星期五晚上，她们个个都在暗暗庆幸，这一星期总算快结束了。马奇太太想把教训留得更深，便决定用最合适的方式结束试验。她给汉娜放了一天假，让姑娘们亲眼看看，一个家里若人人只管玩乐，会变成什么样。
    - id: ch03
      title: 没有早饭的星期六
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 星期六早晨，姐妹们起床一看，厨房里没有火，餐厅里没有早饭，母亲也不见了。
        - id: ch03-b02
          speaker: jo
          text: 天哪！家里出什么事了？
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: 梅格跑上楼，不久又下来了。她像是放了心，却也迷惑，还带着一点惭愧。
        - id: ch03-b04
          speaker: meg
          text: 妈妈没生病，只是累坏了。她说今天要安安静静待在房里，让我们自己想办法。她从来不会这样，真奇怪。不过她说，这一星期她太辛苦了，所以我们不能抱怨，今天得自己照顾自己。
        - id: ch03-b05
          speaker: jo
          text: 这有什么难的？我倒挺喜欢。我浑身发痒，正想找点事做……我是说，找一种新消遣。你们懂的。
        - id: ch03-b06
          speaker: narrator
          text: 其实，一听说终于有活可做，四姐妹全都松了口气。她们兴冲冲动起手来，很快便懂了汉娜常说的那句话。
        - id: ch03-b07
          speaker: hannah
          text: 操持家务可不是闹着玩的。
        - id: ch03-b08
          speaker: narrator
          text: 食品柜里东西不少。贝丝和艾米摆桌，梅格和乔做早饭。她们一边忙，一边奇怪仆人为什么总把这些事说得那么辛苦。梅格坐到茶壶后面主持早餐，很有几分当家主妇的样子。
        - id: ch03-b09
          speaker: meg
          text: 我要给妈妈送一份上去。她虽然说不用管她，自己能照顾自己，可我还是得送。
        - id: ch03-b10
          speaker: narrator
          text: 谁也没先吃。她们装好一只托盘，带着厨娘的问候送到楼上。茶煮得又苦又涩，煎蛋焦了，饼干上满是苏打斑点。马奇太太仍然谢过她们。等乔一走，她才对着这顿早餐痛痛快快笑起来。
        - id: ch03-b11
          speaker: mrs_march
          text: 可怜的小东西们，今天恐怕要吃些苦头了。不过不会真让她们受罪，这个教训对她们有好处。
        - id: ch03-b12
          speaker: narrator
          text: 她拿出早已给自己备好的食物，又悄悄处理掉那份难以下咽的早饭，免得女儿们伤心。这是母亲因为疼爱撒的小谎，姑娘们后来都很感激。楼下却抱怨声不断，做早饭的大厨也为失败懊恼极了。
        - id: ch03-b13
          speaker: jo
          text: 别往心里去。午饭让我来做，我也负责当仆人。你去做女主人，把手养得漂漂亮亮，只管招待客人、发号施令。
        - id: ch03-b14
          speaker: narrator
          text: 可乔懂的烹饪比梅格还少。梅格却高兴地接受了这份殷勤，退进客厅。她匆匆把杂物都扫到沙发底下，又关上百叶窗，这样便不用掸灰。乔对自己信心十足，又真想同劳里和好，马上跑去邮政局投了一张便条，请他来吃午饭。
        - id: ch03-b15
          speaker: meg
          text: 你请客以前，最好先看看家里到底有什么吃的。
        - id: ch03-b16
          speaker: jo
          text: 有腌牛肉，还有一大堆土豆。我去买芦笋和一只龙虾，照汉娜的话，给饭桌添点滋味。家里还有莴苣，可以做沙拉。虽然我不会，可书里有做法。甜点吃牛奶冻和草莓。你要是想讲究些，我还能煮咖啡。
        - id: ch03-b17
          speaker: meg
          text: 乔，别一下子试这么多乱七八糟的菜。除了姜饼和糖蜜糖，你做的东西就没有能吃的。这顿午宴我可不管。劳里是你自己请的，你自己招待。
        - id: ch03-b18
          speaker: jo
          text: 我又没要你做菜。你只要对他客气一点，再帮我分甜点就好。万一我真弄砸了，你总肯给我出个主意吧？
          emotion: sad
        - id: ch03-b19
          speaker: meg
          text: 会。不过我也只会做面包和几样简单东西。你想买什么，最好先问问妈妈。
        - id: ch03-b20
          speaker: jo
          text: 我当然会问。我又不是傻瓜。
          emotion: angry
        - id: ch03-b21
          speaker: narrator
          text: 大家都怀疑她的本事，乔气冲冲地上了楼。
        - id: ch03-b22
          speaker: mrs_march
          text: 喜欢什么就买什么，别来打扰我。今天我要出去吃午饭，没空管家里的事。我从来不喜欢做家务，今天也要给自己放一天假。我要读书、写字、拜访朋友，好好玩一天。
        - id: ch03-b23
          speaker: narrator
          text: 大清早，平日忙个不停的母亲竟舒舒服服坐在摇椅里看书。乔觉得，这景象简直违背了天理。就算日食、地震或火山爆发，也不会比它更奇怪。她一边下楼，一边嘀咕。
        - id: ch03-b24
          speaker: jo
          text: 不知道为什么，今天什么都不对。贝丝在哭，家里准出事了。要是艾米欺负她，我就把艾米摇上一顿。
        - id: ch03-b25
          speaker: narrator
          text: 乔自己也很不痛快。她冲进客厅，看见贝丝正对着金丝雀皮普哭。小鸟死在笼里，两只细小的爪子伸着，像是在讨那份一直没等到的食物。贝丝把它捧在手里，拼命想救活它。
        - id: ch03-b26
          speaker: beth
          text: 都怪我，我把它忘了。笼子里没有一粒种子，连一滴水也没剩。皮普，皮普，我怎么能这样残忍地对你？
          emotion: sad
        - id: ch03-b27
          speaker: narrator
          text: 乔看了看皮普半睁的眼睛，又摸摸它小小的胸口。小鸟早已僵硬冰冷。她摇摇头，拿来自己的多米诺骨牌盒，准备给它做棺材。
        - id: ch03-b28
          speaker: amy
          text: 要不把它放进烤炉里？暖一暖，说不定还能活。
        - id: ch03-b29
          speaker: beth
          text: 它已经饿死了，真的死了，不能再把它烤一遍。我要给它做裹尸布，把它埋在花园里。我以后再也不养鸟了。再也不了，我的皮普！我这么坏，根本不配养鸟。
          emotion: sad
        - id: ch03-b30
          speaker: narrator
          text: 贝丝坐在地板上，把心爱的小鸟拢在手里。乔渐渐觉得，自己揽下的事实在太多了。
        - id: ch03-b31
          speaker: jo
          text: 葬礼放到下午，我们都去。先别哭了，贝丝。皮普死了当然很难过，可这一星期样样都不顺，它是这场试验里遭殃最重的一个。你去缝裹尸布，再把它放进我的盒子。午宴结束以后，我们好好给它办一场小葬礼。
        - id: ch03-b32
          speaker: narrator
          text: 乔把安慰贝丝的事交给别人，自己赶去厨房。那里乱得让人一看就泄气。她系上大围裙，刚把碗碟堆起来准备洗，便发现炉火已经灭了。
        - id: ch03-b33
          speaker: jo
          text: 好啊，这下可有好戏看了！
        - id: ch03-b34
          speaker: narrator
          text: 她砰地拉开炉门，拿火钩在灰里乱捅。火总算重新烧起来。趁着水还在加热，她赶往市场。一路走去，她的精神倒好了些。她跟摊贩买这买那，自以为每笔买卖都很划算。等她拖着脚步回到家，带回来的却是一只嫩过头的龙虾、一把老过头的芦笋，还有两盒酸草莓。
    - id: ch04
      title: 乔的午宴
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 等乔收拾好，已经到了午饭时间，炉子也烧得通红。汉娜临走前留下一盆面团。梅格早晨揉好，把它放到炉边等着再发一次，随后便忘得干干净净。她正在客厅招待萨莉·加德纳，房门忽然猛地打开，一个满身面粉煤灰、脸颊通红、头发蓬乱的怪物闯了进来。
        - id: ch04-b02
          speaker: jo
          text: 面包都从烤盘里漫出来了，这还不算发够了吗？
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: 萨莉笑出了声。梅格把眉毛抬得不能再高，只点了点头。那个怪物立刻消失，把已经发酸的面包塞进烤炉。马奇太太在屋里四处看了一遍，想知道事情进展得怎么样。她看过厨房，又安慰贝丝几句，这才戴好灰帽子出了门。贝丝坐着缝裹尸布，小小的死者庄严地躺在多米诺骨牌盒里。
        - id: ch04-b04
          speaker: narrator
          text: 母亲的灰帽子刚消失在街角，姑娘们便忽然觉得无依无靠。几分钟后，克罗克小姐又来吃午饭，她们顿时绝望了。这位又黄又瘦的老姑娘长着尖鼻子和一双爱打听的眼睛。她什么都能看见，看见什么都要传出去。姐妹们不喜欢她，可大人教过她们，她年老、贫穷，朋友又少，应该好好待她。梅格只得请她坐进安乐椅，尽力陪她说话。她却问个不停，样样都挑毛病，还把认识的人逐个议论了一番。
        - id: ch04-b05
          speaker: narrator
          text: 乔这一上午吃了多少苦，简直说不完。那顿午饭后来更成了家里说不完的笑话。她不敢再问人，只能独自硬撑，也终于明白，光有干劲和好心，当不了厨师。芦笋煮了整整一个钟头，笋尖全掉了，梗却还是那么硬。面包烤成黑炭。沙拉酱把她气得发火，最后仍旧难以下咽。
        - id: ch04-b06
          speaker: narrator
          text: 那只鲜红的龙虾更像一道谜。乔又敲又捅，好不容易剥开壳，只能拿一大丛莴苣遮住那一点点肉。她怕芦笋等凉，赶着去煮土豆，结果端上来时土豆还没熟。牛奶冻结满疙瘩。草莓也不像表面那么红，卖家只是把好看的全摆在了上面。
        - id: ch04-b07
          speaker: narrator
          text: 乔晚了半个钟头才摇铃。她又热又累，垂头丧气地望着满桌食物。劳里吃惯了精美菜肴，克罗克小姐那张爱传闲话的嘴，又一定会把今天的事讲遍四处。
        - id: ch04-b08
          speaker: jo
          text: 他们要是真饿了，还有牛肉、面包和黄油能吃。可我忙了整整一上午，结果什么也没做好，太丢人了。
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: 菜一道道尝过，又一道道放下。艾米忍不住偷笑，梅格窘得抬不起头，克罗克小姐抿紧嘴唇，劳里使出浑身解数说笑，想让这顿盛宴显得快活一点。可怜的乔恨不得钻到桌子下面。她只对水果有把握。草莓撒了厚厚的糖，旁边还有一壶浓奶油。漂亮的玻璃碟传了一圈，一座座玫瑰色小岛浮在奶油海里。看着大家和颜悦色的脸，乔的双颊总算没那么烫了，她也松了一口气。
        - id: ch04-b10
          speaker: narrator
          text: 克罗克小姐先尝了一口，脸立刻皱起来，赶紧喝水。乔没有给自己留，她怕挑过以后剩得太少。她偷看劳里，只见他勇敢地大口吃着，嘴角却紧紧抽了一下，两眼始终盯着盘子。爱吃精细食物的艾米盛了满满一勺。才吃一口，她便噎住了，用餐巾遮住脸，飞快逃离饭桌。
        - id: ch04-b11
          speaker: jo
          text: 啊！到底怎么回事？
          emotion: fearful
        - id: ch04-b12
          speaker: meg
          text: 你撒的是盐，不是糖。奶油也酸了。
        - id: ch04-b13
          speaker: narrator
          text: 乔呻吟一声，瘫回椅子里。她终于想起，上桌前匆忙给草莓再撒一层粉时，随手拿了厨房桌上两个盒子中的一个。牛奶也一直忘在外面。她满脸通红，眼泪马上就要掉下来了。偏偏这时，她撞上劳里的目光。他拼命装出英勇的样子，眼睛里却全是忍不住的笑。
        - id: ch04-b14
          speaker: narrator
          text: 乔忽然看出了整件事有多滑稽，笑得眼泪直流。别人也全笑起来，连姐妹们私下叫“呱噪婆”的克罗克小姐都笑了。这顿倒霉的午宴，最后就在面包、黄油、橄榄和笑声里快活地结束了。大家一离开饭桌，克罗克小姐便准备告辞。她急着赶去另一位朋友家吃下一顿，好把这个新故事讲给别人听。
        - id: ch04-b15
          speaker: jo
          text: 我实在没力气收拾这一摊了。我们还是去办葬礼吧，至少能让大家安静一会儿。
        - id: ch04-b16
          speaker: narrator
          text: 为了贝丝，她们真的安静下来。劳里在小树林的蕨丛下挖了一座小墓。贝丝流了许多眼泪，把皮普放进去，再轻轻盖上苔藓。墓碑上挂着紫罗兰和繁缕编成的花环，还刻着乔跟午饭苦战时写下的墓志铭。
        - id: ch04-b17
          speaker: jo
          text: 马奇家的皮普长眠此地，六月七日离开人间。多少疼爱，多少泪滴，它不会很快被人遗忘。
          emotion: sad
        - id: ch04-b18
          speaker: narrator
          text: 葬礼结束以后，贝丝既伤心，又被龙虾折腾得难受，便回房休息。可床还没铺，根本躺不下。她只好先抖松枕头，把床铺好，又把周围收拾整齐。手上有了这些熟悉的活，她的悲伤倒减轻了许多。梅格帮乔清理午宴留下的残局，锅碗和残羹收拾了大半个下午才算完。两人累得筋疲力尽，一致决定晚饭只吃茶和烤面包。
        - id: ch04-b19
          speaker: narrator
          text: 劳里驾车带艾米出去兜风，也算做了一件善事，因为酸奶油似乎把她的脾气也弄酸了。下午过半，马奇太太回到家，看见三个大些的女儿还在埋头苦干，一个个都没有歇下来的意思。她又朝食品柜里看了一眼，立刻明白这场试验的一部分进行得如何。
        - id: ch04-b20
          speaker: narrator
          text: 女管家们还没来得及休息，几位客人便一个接一个登门，一刻也没让她们清闲。姐妹们手忙脚乱地梳洗换衣，出去见客。随后还要准备茶点、跑腿办事，几样不能不做的针线活也拖到了最后一刻。直到暮色落下，空气变得安静清凉，六月的玫瑰正含苞待放，她们才一个接一个来到门廊。每个人坐下时，都累得或烦得长叹一声。
    - id: ch05
      title: 门廊上的答案
      blocks:
        - id: ch05-b01
          speaker: jo
          text: 今天真是糟透了！
        - id: ch05-b02
          speaker: meg
          text: 倒是比平常短，可实在太不舒服了。
        - id: ch05-b03
          speaker: amy
          text: 家里一点儿也不像家了。
        - id: ch05-b04
          speaker: narrator
          text: 贝丝抬头望着那只空鸟笼，眼里又盈满泪水。
        - id: ch05-b05
          speaker: beth
          text: 妈妈不在，皮普也不在，当然不像家。
          emotion: sad
        - id: ch05-b06
          speaker: mrs_march
          text: 亲爱的，妈妈在这里。你要是愿意，明天我就再给你买一只鸟。
          emotion: calm
        - id: ch05-b07
          speaker: narrator
          text: 马奇太太走过来，坐到女儿们中间。看样子，她这个假日也没有过得多么愉快。贝丝依偎到母亲身边，其他人的脸也亮起来，一起转向她，就像花朵转向太阳。
        - id: ch05-b08
          speaker: mrs_march
          text: 姑娘们，这场试验让你们满意了吗？还想不想再试一个星期？
        - id: ch05-b09
          speaker: jo
          text: 我绝对不想！
        - id: ch05-b10
          speakers: [meg, beth, amy]
          ensemble: chorus
          text: 我们也不想！
        - id: ch05-b11
          speaker: mrs_march
          text: 这么说，你们觉得还是各自担起一点责任，也多少为别人着想，会过得更好，是不是？
        - id: ch05-b12
          speaker: narrator
          text: 乔摇了摇头。
        - id: ch05-b13
          speaker: jo
          text: 整天躺着胡闹，根本一点也不划算。我已经受够了，现在只想马上找件正经事来做。
        - id: ch05-b14
          speaker: mrs_march
          text: 那就学学做家常饭吧。这本领很实用，女人都应该会。
        - id: ch05-b15
          speaker: narrator
          text: 想起乔那顿午宴，马奇太太悄悄笑了。她刚才遇见过克罗克小姐，已经听完了对方的描述。梅格怀疑了整整一天，这时终于忍不住问出来。
        - id: ch05-b16
          speaker: meg
          text: 妈妈，你今天故意走开，把所有事都丢给我们，就是想看看我们会怎么办，对不对？
        - id: ch05-b17
          speaker: mrs_march
          text: 是的。我想让你们明白，要让一个家过得舒服，每个人都得认真做好自己的那一份。汉娜和我替你们做事时，你们日子过得还不错，可我看你们既不快活，脾气也不好。所以我想给你们一个小教训，让你们看看，人人只顾自己会有什么结果。现在，你们是不是也觉得，互相帮忙更快乐？每天先尽到责任，等空闲真的来了，才会觉得格外甜。大家互相分担，也彼此体谅，家才会成为所有人共同的、舒服可爱的地方。对不对？
        - id: ch05-b18
          speakers: [meg, jo, beth, amy]
          ensemble: chorus
          text: 对，妈妈，对！
        - id: ch05-b19
          speaker: mrs_march
          text: 那就听我的话，重新挑起你们各自的小担子。有时它们看起来很重，其实对你们有好处。越会承担，便越觉得轻。劳动对身体和心都有益，而且每个人都有自己的活要做。它让我们远离无聊和淘气，让身体健康，心情愉快。它还会给人力量，也让人能靠自己。这些比金钱和时髦更宝贵。
        - id: ch05-b20
          speaker: jo
          text: 我们要像蜜蜂一样干活，而且一定会喜欢。您等着看吧。这个假期，我要学做家常饭。下次再办午宴，我非成功不可。
        - id: ch05-b21
          speaker: meg
          text: 我要给爸爸做整套衬衫，不再把活留给您。我做得到，也一定会做，虽然我不喜欢缝衣服。总比整天折腾自己的衣裳好。我的衣服本来已经够漂亮了。
        - id: ch05-b22
          speaker: beth
          text: 我以后每天都做功课，不再把那么多时间全给音乐和玩偶。我真傻，应该认真学习，不能只顾着玩。
        - id: ch05-b23
          speaker: amy
          text: 我要学缝扣眼，还要认真留心词性。
        - id: ch05-b24
          speaker: mrs_march
          text: 很好。这样一来，我对这场试验就完全满意了，看来也不用再试。不过别又跑到另一个极端，像奴隶一样苦干。每天把做事和玩耍的时间安排好，让每一天既有用，也有乐趣。好好使用光阴，让自己配得上它。这样，你们年轻时会过得幸福，老了也少有遗憾。哪怕生活贫穷，也能把自己的一生做成一件美好的作品。
        - id: ch05-b25
          speakers: [meg, jo, beth, amy]
          ensemble: chorus
          text: 我们会记住的，妈妈！
        - id: ch05-b26
          speaker: narrator
          text: 她们后来确实记住了。
