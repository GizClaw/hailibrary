  chapters:
    - id: ch01
      title: Experiments
      blocks:
        - id: ch01-b01
          speaker: meg
          text: June first at last! The Kings leave for the seashore tomorrow, and then I'm free. Three whole months of vacation. Oh, how I'll enjoy them!
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: Meg came home on a warm day and found Jo stretched on the sofa, worn out in a most unusual way. Beth was pulling off Jo's dusty boots, while Amy made lemonade for everyone.
        - id: ch01-b03
          speaker: jo
          text: Aunt March left today, so let's all celebrate! I was terrified she'd ask me to go. If she had, I'd have felt I ought to, but Plumfield is about as cheerful as a graveyard. Getting her away was a great commotion. I hurried so much that I became terribly helpful and sweet, and then I was afraid she'd decide she couldn't part with me. I shook until she was safely in the carriage. Even then, she leaned out and called, "Josyphine, won't you...?" I didn't wait to hear the rest. I turned and ran around the corner where she couldn't catch me.
        - id: ch01-b04
          speaker: beth
          text: Poor Jo came in looking as if a pack of bears had chased her.
        - id: ch01-b05
          speaker: narrator
          text: Beth tucked Jo's feet close with a motherly little air.
        - id: ch01-b06
          speaker: amy
          text: Aunt March is a perfect samphire, isn't she?
        - id: ch01-b07
          speaker: narrator
          text: Amy tasted the lemonade with great care.
        - id: ch01-b08
          speaker: jo
          text: You mean vampire, not seaweed. But never mind. It's too hot to worry about parts of speech.
        - id: ch01-b09
          speaker: amy
          text: What are you going to do through your whole vacation?
        - id: ch01-b10
          speaker: meg
          text: Sleep late and do absolutely nothing. All winter I've had to get up early and work for other people. Now I'm going to rest and enjoy myself as much as I please.
        - id: ch01-b11
          speaker: jo
          text: No, that sleepy plan would never do for me. I've collected a mountain of books. I'll spend my best hours reading up in the old apple tree, except when I'm having larks...
        - id: ch01-b12
          speaker: amy
          text: Don't say "larks!"
        - id: ch01-b13
          speaker: narrator
          text: That was Amy's revenge for being corrected about the samphire.
        - id: ch01-b14
          speaker: jo
          text: Fine. I'll have nightingales with Laurie instead. That's proper, since he's such a warbler.
        - id: ch01-b15
          speaker: amy
          text: Beth, let's stop lessons for a while. We can play all day and rest, just like the older girls.
        - id: ch01-b16
          speaker: beth
          text: I will if Mother agrees. I do want to learn some new songs, though. And my children need summer clothes. They're in dreadful condition and have almost nothing to wear.
        - id: ch01-b17
          speaker: meg
          text: May we try it, Mother?
        - id: ch01-b18
          speaker: narrator
          text: Mrs. March sat sewing in the place they called Marmee's corner.
        - id: ch01-b19
          speaker: mrs_march
          text: You may try your experiment for one week. By Saturday night, I think you'll discover that nothing but play is just as bad as nothing but work.
        - id: ch01-b20
          speaker: meg
          text: Oh, no. I'm sure it will be wonderful.
        - id: ch01-b21
          speaker: jo
          text: Then I propose a toast, as my friend and partner Sairy Gamp would say. Here's to fun forever and no drudgery!
        - id: ch01-b22
          speaker: narrator
          text: Jo rose with her glass, and they all drank the toast merrily. Then they began their experiment by lounging through the rest of the day.
        - id: ch01-b23
          speaker: narrator
          text: Meg did not come down until ten the next morning. Breakfast alone tasted dull. The room felt lonely and untidy too. Jo had left the vases empty, Beth had not dusted, and Amy's books were everywhere. Only Marmee's corner looked as pleasant as usual. Meg sat there to rest and read, which mostly meant yawning and dreaming about the pretty summer dresses she could buy with her salary.
        - id: ch01-b24
          speaker: narrator
          text: Jo went boating with Laurie all morning. That afternoon, she climbed the apple tree and read The Wide, Wide World until it made her cry. Beth emptied the big closet where her doll family lived, but grew tired halfway through. She left the whole household upside down and went to practice music, delighted that she had no dishes to wash.
        - id: ch01-b25
          speaker: narrator
          text: Amy fixed up her little bower, put on her best white dress, smoothed her curls, and sat beneath the honeysuckle to draw. She hoped someone would pass by and ask about the young artist. Nobody came except a curious daddy-longlegs, who studied her picture with interest. So Amy took a walk instead, got caught in a shower, and came home soaked.
        - id: ch01-b26
          speaker: narrator
          text: At tea, the sisters compared their adventures. They all called the day delightful, though it had seemed unusually long. Meg had gone shopping and bought a lovely blue muslin. Only after cutting it into dress pieces did she learn it would not wash, and that made her cross. Jo had burned her nose in the boat and earned a terrible headache by reading too long.
        - id: ch01-b27
          speaker: narrator
          text: Beth worried about the wrecked closet and the trouble of learning several songs at once. Amy mourned her ruined white dress. Katy Brown's party was the next day, and now, like Flora McFlimsey, she had nothing to wear. Still, these were only little troubles. The girls assured their mother that the experiment was going beautifully.
        - id: ch01-b28
          speaker: narrator
          text: Mrs. March only smiled. She and Hannah quietly did the neglected chores and kept the household running. Yet resting and reveling soon made the whole place strangely uncomfortable. Each day seemed longer. The weather changed constantly, and so did everyone's temper. With idle hands and uneasy minds, the girls found plenty of ways to make trouble.
        - id: ch01-b29
          speaker: narrator
          text: Meg sent out some of her sewing as a grand luxury. Then time dragged so badly that she began cutting and spoiling her clothes, trying to make them stylish like the Moffats'. Jo read until her eyes failed and books disgusted her. She became so restless that even patient Laurie quarreled with her. Soon she was low enough to wish she'd gone with Aunt March.
        - id: ch01-b30
          speaker: narrator
          text: Beth managed better because she often forgot the rule about all play and slipped back into her usual work. Even she was affected by the strange mood in the house. Once she actually shook poor Joanna and called the doll a fright.
        - id: ch01-b31
          speaker: narrator
          text: Amy did worst. She had fewer ways to amuse herself, and without her sisters, her accomplished and important little self became a heavy burden. Dolls were boring. Fairy tales were childish. No one could draw all day. Tea parties and picnics were hardly worth having unless everything was done properly.
        - id: ch01-b32
          speaker: amy
          text: Summer might be delightful if I could live in a fine house full of nice girls, or go traveling. But staying home with three selfish sisters and one grown-up boy is enough to try the patience of a Boaz.
        - id: ch01-b33
          speaker: narrator
          text: Miss Malaprop made that complaint after several days filled with pleasure, fretting, and boredom. None of the sisters admitted she was tired of the experiment. But by Friday night, each privately felt glad the week was almost over.
        - id: ch01-b34
          speaker: narrator
          text: Mrs. March had a good sense of humor, and she wanted the lesson to sink in. She decided to end the trial in a fitting way. She gave Hannah a holiday and left the girls to experience the play system all by themselves, with no one quietly doing their neglected work behind them.
        - id: ch01-b35
          speaker: narrator
          text: On Saturday morning, the girls woke to a cold kitchen stove, an empty breakfast table, and no mother in sight.
        - id: ch01-b36
          speaker: jo
          text: Good gracious! What's happened?
          emotion: surprised
        - id: ch01-b37
          speaker: narrator
          text: Jo stared around in alarm. Meg hurried upstairs, then returned looking relieved, confused, and a little ashamed.
        - id: ch01-b38
          speaker: meg
          text: Mother isn't ill. She's only very tired, so she's staying quietly in her room today and leaving us to manage. It's so strange. She doesn't seem like herself at all. But she says the week has been hard on her, and we mustn't complain. We'll have to look after ourselves.
        - id: ch01-b39
          speaker: jo
          text: That's easy enough, and I like the idea. I've been longing for something to do. I mean some new kind of amusement, of course.
        - id: ch01-b40
          speaker: narrator
          text: The truth was, a little work came as an enormous relief. They all threw themselves into it eagerly and meant to do everything well. But they soon learned why Hannah always said housekeeping was no joke. The pantry held plenty of food. Beth and Amy set the table, while Meg and Jo made breakfast and wondered why servants ever complained about hard work.
        - id: ch01-b41
          speaker: meg
          text: Mother told us not to worry about her, but I'm taking up some breakfast anyway. She says she can care for herself, but I won't leave her without a tray.
        - id: ch01-b42
          speaker: narrator
          text: Sitting behind the teapot made Meg feel quite grown-up. Before the sisters ate, they arranged a tray and sent it upstairs with the cooks' compliments. The tea had boiled until it was bitter. The omelet was scorched, and white spots of baking soda showed in the biscuits. Mrs. March thanked them warmly. Once Jo had gone, she laughed over the awful meal.
        - id: ch01-b43
          speaker: mrs_march
          text: Poor little things. Today will be hard for them, I'm afraid. They won't truly suffer, though, and the lesson will help them.
        - id: ch01-b44
          speaker: narrator
          text: She brought out the tastier food she had hidden for herself and quietly disposed of the bad breakfast. It was a motherly little trick meant to spare their feelings, and later they were grateful for it.
        - id: ch01-b45
          speaker: narrator
          text: Downstairs, everyone complained, and the chief cook felt deeply ashamed of her failures.
        - id: ch01-b46
          speaker: jo
          text: Never mind. I'll make dinner and act as the servant. You can be the lady of the house. Keep your hands clean, receive visitors, and give me orders.
        - id: ch01-b47
          speaker: narrator
          text: Jo knew even less about cooking than Meg, but Meg gladly accepted. She went to the parlor, swept the mess under the sofa, and closed the blinds so she would not need to dust. Jo wanted to make peace after their quarrel and trusted her own abilities completely. She sent Laurie an invitation to dinner at once.
        - id: ch01-b48
          speaker: meg
          text: Before inviting company, you really should have checked what food we have.
        - id: ch01-b49
          speaker: jo
          text: We have corned beef and lots of potatoes. I'll buy asparagus and a lobster for a relish, as Hannah says. We can make a lettuce salad. I don't know how yet, but the cookbook does. For dessert, we'll have blancmange and strawberries. We can even serve coffee if you want it to be elegant.
        - id: ch01-b50
          speaker: meg
          text: Don't attempt so many dishes. The only things you can make fit to eat are gingerbread and molasses candy. This dinner party is your responsibility, since you invited Laurie. I won't have anything to do with it.
        - id: ch01-b51
          speaker: jo
          text: I only need you to be pleasant to him and serve the pudding. If I get into trouble, you'll still advise me, won't you?
        - id: ch01-b52
          speaker: narrator
          text: Jo sounded hurt.
        - id: ch01-b53
          speaker: meg
          text: Yes, but I know very little beyond bread and a few simple things. And you'd better get Mother's permission before ordering food.
        - id: ch01-b54
          speaker: jo
          text: Naturally I will. I'm not an idiot.
        - id: ch01-b55
          speaker: narrator
          text: Jo marched off, offended that anyone doubted her powers. When she spoke to Mrs. March, her mother gave her an unexpected answer.
        - id: ch01-b56
          speaker: mrs_march
          text: Buy whatever you please, but don't bother me. I'm dining out, and I refuse to worry about the house today. I've never enjoyed housekeeping. For once, I'll take a vacation, read and write, make visits, and entertain myself.
        - id: ch01-b57
          speaker: narrator
          text: Jo could hardly believe the sight of her usually busy mother rocking and reading so early in the day. An eclipse, an earthquake, or a volcano would hardly have seemed more unnatural.
        - id: ch01-b58
          speaker: jo
          text: Somehow, everything is wrong. Beth is crying, and that's a sure sign of trouble in this family. If Amy is teasing her, I'll give Amy a shake.
        - id: ch01-b59
          speaker: narrator
          text: Jo was in a bad mood herself when she rushed into the parlor. There sat Beth, sobbing over her canary. Pip lay dead in his cage, his small claws stretched out as if begging for the food he had needed.
        - id: ch01-b60
          speaker: beth
          text: It's my fault. I forgot him. There's no seed and not one drop of water. Oh, Pip! How could I have been so cruel to you?
          emotion: sad
        - id: ch01-b61
          speaker: narrator
          text: Beth lifted him in her hands and tried desperately to bring him back. Jo looked into his half-open eye and felt for his heartbeat. He was cold and stiff. She shook her head, then offered her domino box for his coffin.
        - id: ch01-b62
          speaker: amy
          text: Maybe the oven would warm him up and bring him back.
        - id: ch01-b63
          speaker: beth
          text: He starved to death. I won't let anyone bake him now. I'll sew him a shroud, and we'll bury him in the garden. I'll never keep another bird. Never. I'm too wicked to have one, my poor Pip.
          emotion: sad
        - id: ch01-b64
          speaker: narrator
          text: Beth sat on the floor, holding her pet against her.
        - id: ch01-b65
          speaker: jo
          text: We'll all attend the funeral this afternoon. Please don't cry, Bethy. It's terribly sad, but nothing has gone right this week, and Pip suffered most from our experiment. Make his shroud and place him in my box. After the dinner party, we'll give him a proper little funeral.
        - id: ch01-b66
          speaker: narrator
          text: Jo was beginning to feel she had taken on far too much. She left the others with Beth and went to the kitchen. It was a hopeless jumble. She tied on a large apron and stacked the dishes for washing. Then she discovered the fire had gone out.
        - id: ch01-b67
          speaker: jo
          text: Well, this is a lovely prospect!
        - id: ch01-b68
          speaker: narrator
          text: She slammed open the stove door and attacked the ashes. Once the fire was burning again, she went to market while the water heated. The walk improved her spirits. Believing she had found excellent bargains, she carried home a very young lobster, very old asparagus, and two boxes of sour strawberries.
        - id: ch01-b69
          speaker: narrator
          text: By the time she had cleaned up, the food arrived and the stove glowed red-hot. Hannah had left bread dough rising. Meg had kneaded it that morning, set it near the fire for a second rise, and forgotten it. Meg was entertaining Sallie Gardiner when the parlor door burst open. Jo stood there covered with flour and soot, red-faced and wild-haired.
        - id: ch01-b70
          speaker: jo
          text: Tell me, hasn't bread risen enough when it spills right over the pans?
        - id: ch01-b71
          speaker: narrator
          text: Sallie laughed. Meg only nodded and raised her eyebrows as far as they would go. Jo vanished and shoved the sour bread into the oven.
        - id: ch01-b72
          speaker: narrator
          text: Mrs. March looked into several rooms before leaving. She also comforted Beth, who was sewing a winding sheet while Pip lay in state inside the domino box. When Mother's gray bonnet disappeared around the corner, the girls suddenly felt helpless. A few minutes later, despair arrived in the shape of Miss Crocker, who announced that she had come to dinner.
        - id: ch01-b73
          speaker: narrator
          text: Miss Crocker was a thin, yellow old maid with a pointed nose and sharp, curious eyes. She noticed everything and repeated everything afterward. The girls disliked her, but they had been taught to treat her kindly because she was poor, old, and lonely. Meg gave her the best chair and tried to make conversation. Miss Crocker asked questions, found fault, and spread stories about everyone she knew.
        - id: ch01-b74
          speaker: narrator
          text: No words could fully describe Jo's worry and labor that morning. The meal she finally served became a family joke for years afterward. Afraid to ask more advice, she struggled on alone and learned that energy and good intentions are not enough to make a cook. She boiled the asparagus for an hour. The tips dissolved, while the stalks stayed tough. The bread burned black. The salad dressing became so troublesome that she could not make it edible at all.
        - id: ch01-b75
          speaker: narrator
          text: The lobster remained a bright red mystery. Jo pounded and poked until the shell came off, then hid the tiny amount of meat in a forest of lettuce. She rushed the potatoes so they would not delay the asparagus, and they came out half raw. The blancmange was full of lumps. The strawberries looked ripe, but the seller had arranged them so the best ones covered the bad.
        - id: ch01-b76
          speaker: jo
          text: If they're hungry, they can eat beef with bread and butter. Still, it's awful to waste an entire morning and have nothing good to show for it.
        - id: ch01-b77
          speaker: narrator
          text: Dinner was half an hour late when Jo finally rang the bell. She stood beside the table, hot, exhausted, and discouraged. Laurie was used to elegant meals, and Miss Crocker's busy tongue would tell the whole neighborhood about this one.
        - id: ch01-b78
          speaker: narrator
          text: Dish after dish was tasted and abandoned. Jo wanted to crawl under the table. Amy giggled. Meg looked miserable. Miss Crocker tightened her lips. Laurie talked and laughed as hard as he could, determined to keep the meal cheerful.
        - id: ch01-b79
          speaker: narrator
          text: Jo believed the fruit would save her. She had covered the berries generously and brought out a pitcher of thick cream. Her face cooled, and she breathed easier as pretty glass dishes went around the table. The little pink islands floated in their white sea, and everyone smiled kindly at them.
        - id: ch01-b80
          speaker: narrator
          text: Miss Crocker tasted hers first. She twisted her face and quickly drank some water. Jo refused a serving because the berries had dwindled after all the bad ones were removed. She watched Laurie instead. He ate bravely, though his mouth puckered and he stared fixedly at his plate. Amy loved fine food. She swallowed a large spoonful, choked, hid behind her napkin, and fled from the table.
        - id: ch01-b81
          speaker: jo
          text: Oh! What is it?
          emotion: fearful
        - id: ch01-b82
          speaker: narrator
          text: Jo began to tremble.
        - id: ch01-b83
          speaker: meg
          text: You used salt instead of sugar, and the cream has gone sour.
        - id: ch01-b84
          speaker: narrator
          text: Meg made a tragic gesture. Jo groaned and dropped back into her chair. She remembered giving the berries one final hurried dusting from one of two boxes on the kitchen table. She had also forgotten to keep the milk cold. Her face turned scarlet, and she nearly cried. Then she caught Laurie's eye. No matter how heroically he tried, his eyes still sparkled with laughter.
        - id: ch01-b85
          speaker: narrator
          text: Suddenly Jo saw how funny the whole disaster was. She laughed until tears ran down her face. Everyone joined her, even old Croaker, as the girls called Miss Crocker. The miserable dinner ended merrily with bread and butter, olives, and laughter.
        - id: ch01-b86
          speaker: jo
          text: I haven't enough courage left to clean this up. Let's make ourselves serious again with a funeral.
        - id: ch01-b87
          speaker: narrator
          text: The guests rose. Miss Crocker prepared to leave, eager to share her new story at someone else's dinner table. For Beth's sake, the others truly did grow serious. Laurie dug a grave beneath the ferns in the grove. Beth laid little Pip inside with many tears. They covered him with moss and hung a wreath of violets and chickweed over his stone.
        - id: ch01-b88
          speaker: narrator
          text: Jo had composed his epitaph while fighting with the dinner. It said, "Here lies Pip March, who died the seventh of June. Loved and deeply mourned, and not forgotten soon."
        - id: ch01-b89
          speaker: narrator
          text: After the ceremony, Beth went to her room, overcome by grief and lobster. But the beds had never been made, so there was nowhere to rest. Beating the pillows and putting the room in order soon eased her sorrow. Meg helped Jo clear away the remains of the feast. It took half the afternoon and left them so tired that they settled for tea and toast at supper.
        - id: ch01-b90
          speaker: narrator
          text: Laurie took Amy out for a drive, which was an act of kindness because the sour cream had made her temper worse. Mrs. March returned in the middle of the afternoon and found her three older daughters hard at work. One glance into the closet told her how that part of the experiment had gone.
        - id: ch01-b91
          speaker: narrator
          text: The housekeepers still could not rest. Several visitors arrived, and everyone scrambled to make herself presentable. Tea had to be prepared, errands had to be run, and necessary sewing waited until the last moment. At twilight, the girls gathered one by one on the porch. Dew lay quietly over the evening, and the June roses were coming into bloom. Each sister groaned or sighed as she sat down, tired or troubled.
        - id: ch01-b92
          speaker: jo
          text: What a terrible day this has been!
        - id: ch01-b93
          speaker: meg
          text: It felt shorter than the other days, but it was so uncomfortable.
        - id: ch01-b94
          speaker: amy
          text: It hasn't felt like home at all.
        - id: ch01-b95
          speaker: beth
          text: Home can't feel right without Marmee and little Pip.
          emotion: sad
        - id: ch01-b96
          speaker: narrator
          text: Beth looked up at the empty cage with tears in her eyes.
        - id: ch01-b97
          speaker: mrs_march
          text: Marmee is here, dear. And if you want one, you may have another bird tomorrow.
        - id: ch01-b98
          speaker: narrator
          text: Mrs. March came onto the porch and sat among them. Her own holiday did not seem to have pleased her much. Beth curled close to her, and the others turned toward her with faces that brightened like flowers turning to the sun.
        - id: ch01-b99
          speaker: mrs_march
          text: Have you had enough of your experiment, girls, or shall we try it for another week?
        - id: ch01-b100
          speaker: jo
          text: Not me!
        - id: ch01-b101
          speakers: [meg, beth, amy]
          ensemble: chorus
          text: Not us either!
        - id: ch01-b102
          speaker: mrs_march
          text: Then you agree it's better to have a few duties and spend some time helping other people?
        - id: ch01-b103
          speaker: jo
          text: Lounging and fooling around don't pay. I'm tired of both. I'll begin some real work at once.
        - id: ch01-b104
          speaker: mrs_march
          text: You could learn simple cooking. Every woman should have such a useful skill.
        - id: ch01-b105
          speaker: narrator
          text: Mrs. March quietly laughed at the memory of Jo's dinner party. She had already met Miss Crocker and heard the full report.
        - id: ch01-b106
          speaker: meg
          text: Mother, did you leave the house alone today just to find out how we'd manage?
        - id: ch01-b107
          speaker: narrator
          text: Meg had suspected it for hours.
        - id: ch01-b108
          speaker: mrs_march
          text: Yes. I wanted you to understand that our comfort depends on everyone doing her share faithfully. You managed while Hannah and I did your work, though none of you seemed very happy or pleasant. So I showed you what happens when each person thinks only of herself. Isn't it nicer to help one another? Daily duties make free time sweeter. When we are patient with each other, we can keep our home comfortable and dear to us all.
        - id: ch01-b109
          speakers: [meg, jo, beth, amy]
          ensemble: chorus
          text: Yes, Mother. It is!
        - id: ch01-b110
          speaker: mrs_march
          text: Then take up your small burdens again. They may feel heavy sometimes, but they're good for us, and they grow lighter as we learn to carry them. Work is healthy, and there's enough for everyone. It keeps away boredom and mischief, strengthens body and spirit, and gives you a sense of ability and independence worth more than money or fashion.
        - id: ch01-b111
          speaker: jo
          text: We'll work like bees, and we'll love it too. Just watch us. I'll learn ordinary cooking during vacation, and my next dinner party will be a success.
        - id: ch01-b112
          speaker: meg
          text: I'll sew Father's shirts instead of leaving them to you, Marmee. I don't enjoy sewing, but I can do it, and I will. That will be better than fussing over my own clothes. They're already nice enough.
        - id: ch01-b113
          speaker: beth
          text: I'll study every day instead of spending so much time on music and dolls. I've been foolish. I ought to learn instead of always playing.
        - id: ch01-b114
          speaker: amy
          text: And I shall learn to sew buttonholes and pay attention to my parts of speech.
        - id: ch01-b115
          speaker: narrator
          text: Amy offered her resolution with great courage.
        - id: ch01-b116
          speaker: mrs_march
          text: Very good. Then I'm satisfied with the experiment, and I doubt we'll need to repeat it. But don't rush to the other extreme and work like slaves. Set regular times for work and play. Make every day both useful and pleasant. Use your time well, and show that you know its value. Then youth can be delightful, old age can hold few regrets, and life can be a beautiful success even in poverty.
        - id: ch01-b117
          speakers: [meg, jo, beth, amy]
          ensemble: chorus
          text: We'll remember, Mother!
        - id: ch01-b118
          speaker: narrator
          text: And they did.
