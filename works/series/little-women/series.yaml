cover_prompt: |-
  A wordless cover scene in a modest New England parlor during the American Civil War gathers the four March sisters around their mother. Meg is a graceful sixteen-year-old with smooth brown hair and a plum dress, Jo a tall angular fifteen-year-old with chestnut hair loosely tied and a dark green dress, Beth a shy thirteen-year-old in soft gray, and Amy a fair-haired twelve-year-old in pale blue. Marmee, a composed middle-aged woman in a simple dark gown, opens her arms as the sisters bring a basket and warm clothing prepared for a poorer family. Their shared act of giving is the focal action, with a piano, sewing basket, books, and small hearth establishing their home. Use an intimate eye-level semicircle, warm window light, and a broad quiet upper wall above the group. Keep all clothing and furnishings faithful to Massachusetts in the 1860s and avoid imagery from any film adaptation. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
