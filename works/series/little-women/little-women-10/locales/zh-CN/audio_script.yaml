  chapters:
    - id: ch01
      title: 第十章　匹克威克社与邮政局
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 春天来了，姑娘们又有了新鲜的消遣。白昼一天天变长，整个午后都可以拿来做活，也可以尽情玩耍。花园该收拾了，姐妹四个各分到一角，想怎么布置都随自己。
        - id: ch01-b02
          speaker: hannah
          text: 就算把这些园子搬到中国去，我一眼也能认出哪块是谁的。
        - id: ch01-b03
          speaker: narrator
          text: 汉娜说得没错。四个园子就像四位姑娘，模样各不相同。梅格种了玫瑰、天芥菜、香桃木，还有一棵小橘树。乔年年换花样，这回要种满向日葵，等结了籽，正好喂冠毛姨妈和那窝小鸡。贝丝喜欢带香气的老式花草。香豌豆、木犀草、飞燕草、石竹、三色堇和青蒿之外，她还替鸟儿种繁缕，替猫咪种猫薄荷。艾米搭了一座小凉棚，地方虽小，又常招蠼螋，看着却很美。金银花和牵牛花沿棚垂下彩色的花朵，像小喇叭和小铃铛。旁边还有白百合、细蕨叶，以及所有肯在那里开花的鲜艳植物。
        - id: ch01-b04
          speaker: narrator
          text: 天晴时，她们种花、散步、到河上划船、四处找野花。下雨时，她们就在屋里玩游戏。有些游戏是旧的，有些是新想出来的，每一种多少都带点她们自己的创意。其中最要紧的一个叫“匹社”。那时秘密社团很时兴，四姐妹又都喜欢狄更斯，于是成立了匹克威克社。除去偶尔中断，这个社已经办了整整一年。每到星期六晚上，她们就在大阁楼开会。
        - id: ch01-b05
          speaker: narrator
          text: 会场布置得十分郑重。桌前排着三把椅子，桌上点一盏灯，还放着四条白绶带，每条都用不同颜色写着大大的“匹社”。那份人人都要投稿的周报叫《匹克威克文集》，最爱舞文弄墨的乔做主编。晚上七点，四位会员登上阁楼，把绶带系在额头上，庄严入座。梅格年纪最长，扮塞缪尔·匹克威克。乔是文学家奥古斯塔斯·斯诺德格拉斯。贝丝圆润红艳，便做特雷西·塔普曼。艾米总想做些自己还做不来的事，自然是纳撒尼尔·温克尔。
        - id: ch01-b06
          speaker: narrator
          text: 主席匹克威克负责读报。报上有她们原创的故事、诗歌、本地新闻、滑稽广告和各种忠告，四姐妹便借这些忠告，好心提醒彼此的毛病和过失。有一次，主席戴上没有镜片的眼镜，敲敲桌子，清清嗓子。她盯住把椅子翘起来坐的斯诺德格拉斯，直到对方端正坐好，才展开报纸。
        - id: ch01-b07
          speaker: meg
          text: 《匹克威克文集》，一八——年五月二十日。诗人之角，周年颂。
        - id: ch01-b08
          speaker: meg
          text: 我们又来同庆贺，佩上绶带行大礼。今宵聚首匹克威克堂，五十二周正佳期。全体安康齐到场，小小队伍无人少。张张熟面又相逢，友爱的手儿又握牢。
        - id: ch01-b09
          speaker: meg
          text: 匹克威克守岗位，我们敬重把他迎。眼镜端端架鼻梁，满纸文章朗声吟。虽说伤风嗓子坏，我们仍爱听他谈。哪怕嘶哑又尖叫，智慧话儿口中传。
        - id: ch01-b10
          speaker: meg
          text: 六尺高的老斯诺德格拉斯，大象一般风度翩翩。棕色脸庞快活又和善，笑容照亮众社员。诗人的火焰燃在眼里，他不肯向命运低头。看，壮志写在眉梢，墨点却落在鼻头。
        - id: ch01-b11
          speaker: meg
          text: 和平的塔普曼随后登场，红润、丰满又甜美。听见双关便笑岔了气，一骨碌跌下座位。端庄的小温克尔也来了，每根头发整整齐齐。堪称规矩端方的榜样，只恨洗脸这桩差事。
        - id: ch01-b12
          speaker: meg
          text: 一年已逝，我们仍相聚，说笑、朗读，兴致不减。沿着文学大道前行，一路通往荣耀之巅。愿我们的报纸长盛不衰，愿社团永远不散。愿来年赐福于有用、欢快的匹克威克社诸君身畔。作者，奥·斯诺德格拉斯。
        - id: ch01-b13
          speaker: meg
          text: 下面是《蒙面婚礼》，威尼斯故事一则。
        - id: ch01-b14
          speaker: narrator
          text: 一艘又一艘贡多拉滑到大理石台阶前，把美丽的宾客送进阿德隆伯爵庄严的厅堂。骑士、贵妇、精灵、侍童、修士和卖花女混在一处跳舞。歌声与乐声充满大厅，化装舞会就在欢笑中继续。一位英俊的游吟诗人挽着仙后，陪她飘然穿过人群。
        - id: ch01-b15
          speaker: troubadour
          text: 殿下，您今晚见到维奥拉小姐了吗？
        - id: ch01-b16
          speaker: fairy_queen
          text: 见到了。她虽然满脸忧伤，不还是美极了吗？衣裳也选得正合适。再过一星期，她就得嫁给自己恨透了的安东尼奥伯爵。
        - id: ch01-b17
          speaker: troubadour
          text: 凭我的信义，我真羡慕他。瞧，他穿得像个新郎，只是脸上还罩着黑面具。等面具摘掉，我们倒要看看，他会怎样对待那位得不到真心的美人。她那严厉的父亲，已经把她的手许给他了。
        - id: ch01-b18
          speaker: fairy_queen
          text: 我听说，她爱的是那个总跟在她身边的年轻英国画家。老伯爵却把他赶走了。
        - id: ch01-b19
          speaker: narrator
          text: 两人说着，踏进了舞列。狂欢正热闹，一位神父忽然出现，把那对年轻人带到挂着紫色天鹅绒的壁龛前，示意他们跪下。满厅宾客立刻安静。寂静里只听见喷泉落水，还有月光下的橘树林发出沙沙声。德·阿德隆伯爵开了口。
        - id: ch01-b20
          speaker: count_adelon
          text: 诸位爵爷、诸位夫人，请原谅我设下这个计策，请各位来见证小女的婚礼。神父，我们等您主持仪式。
        - id: ch01-b21
          speaker: narrator
          text: 所有目光都转向新人。新娘和新郎谁也没有摘面具，人群里响起一阵惊讶的低语。大家满心好奇，却因敬意忍住不问，直到仪式结束，才一起围住伯爵，要他解释。
        - id: ch01-b22
          speaker: count_adelon
          text: 我要是知道，自然愿意解释。我只晓得这是胆怯的维奥拉一时起意，我便依了她。好了，孩子们，戏演完了。摘下面具，来接受我的祝福吧。
        - id: ch01-b23
          speaker: narrator
          text: 可两个人都没有屈膝。年轻的新郎摘下面具，露出的竟是画家费迪南·德弗罗那张高贵的脸。美丽的维奥拉靠在他胸前，满脸喜悦。他胸口闪着一枚英国伯爵的星章。费迪南一开口，所有人都吃了一惊。
        - id: ch01-b24
          speaker: ferdinand
          text: 大人，您曾轻蔑地叫我等到拥有安东尼奥伯爵那样的门第和财富，再来求娶您的女儿。如今我能献上的还不止这些。德弗罗与德·维尔伯爵愿拿古老的姓氏和无尽的财富，换取这位美丽姑娘的手。她现在已经是我的妻子。纵然您雄心再高，也无法拒绝了吧。
        - id: ch01-b25
          speaker: narrator
          text: 伯爵像被施了魔法一样，僵在那里，仿佛真的变成一尊石像。费迪南转向满脸茫然的宾客，露出胜利而快活的笑容。
        - id: ch01-b26
          speaker: ferdinand
          text: 勇敢的朋友们，我只祝各位求爱时都像我这样顺利，也祝你们人人都能凭一场蒙面婚礼，赢得像我妻子这样美丽的新娘。
        - id: ch01-b27
          speaker: meg
          text: 作者，塞·匹克威克。再问一个问题。为什么匹社像巴别塔？因为里面尽是无法无天的成员。
        - id: ch01-b28
          speaker: meg
          text: 下面是《一只南瓜的历史》。从前，有个农夫在园里种下一粒小种子。种子发芽，长成一根藤，结出许多南瓜。十月里，南瓜熟了。农夫摘下一个，带到市场，卖给杂货商。就在那天早晨，一个戴棕帽、穿蓝裙、圆脸塌鼻子的小姑娘替妈妈买下它，又费力地拖回了家。
        - id: ch01-b29
          speaker: meg
          text: 她把南瓜切开，放进大锅煮熟。一部分加盐和黄油捣烂，端上晚餐桌。剩下的，她添了一品脱牛奶、两个鸡蛋、四勺糖、肉豆蔻和几块饼干，装进深盘，烤得焦黄喷香。第二天，一个姓马奇的家庭把它吃掉了。作者，特·塔普曼。
        - id: ch01-b30
          speaker: meg
          text: 匹克威克先生阁下我写信给您是为了谈罪恶这件事我说的罪人是个名叫温克尔的男人他在社团里捣乱老是发笑有时还不肯给这份好报纸写文章我希望您原谅他的恶劣行为允许他交一则法国寓言因为他功课太多又没有脑子实在没法凭空写出来往后我一定设法抓住时间的蹄毛预备一篇完全妥当的作品我写得很急因为快到上学时间了谨致尊敬纳·温克尔。
        - id: ch01-b31
          speaker: meg
          text: 编者按。上文是一份勇敢而体面的检讨，承认了从前的过失。倘若我们年轻的朋友肯学学标点，那就更好了。
        - id: ch01-b32
          speaker: meg
          text: 《一桩悲惨事故》。上星期五，地下室忽然传来巨响，紧接着又有人痛苦呼喊。我们全体冲进地窖，发现敬爱的主席倒在地上。他原本为了操持家务去取木柴，却绊了一跤。现场一片狼藉。匹克威克先生一头一肩扎进水桶，又把整桶软皂扣在雄伟的身躯上，衣服也撕破了。大家把他救出来，发现除了几处瘀伤，并无别的伤害。我们很高兴地报告，他眼下恢复良好。编者。
        - id: ch01-b33
          speaker: meg
          text: 《公众的丧痛》。我们怀着悲痛的心情，记录挚友雪球·肉垫爪太太突然而神秘的失踪。这只美丽可爱的猫儿，深受众多朋友宠爱。她的美貌吸引所有目光，她的风度和美德赢得所有心灵，整个社会都为失去她而悲伤。最后一次有人看见她时，她正坐在门口望着肉贩的车。我们担心，有个恶棍受她魅力诱惑，卑鄙地偷走了她。
        - id: ch01-b34
          speaker: meg
          text: 几个星期过去，仍没有一点踪迹。我们只得放弃希望，在她的篮子上系起黑丝带，收起她的食碟，为她哭泣，仿佛她已永远离开。一位深表同情的朋友寄来以下佳作，《悼雪球·肉垫爪》哀歌。
        - id: ch01-b35
          speaker: meg
          text: 我们哀悼小宠物离去，为她不幸的命运叹息。她再不能坐在炉火旁边，也不能在绿色旧门边嬉戏。她夭折的孩子长眠小小坟茔，就在栗子树下的泥土里。可我们无法到她的墓前哭泣，因为没人知道坟墓在哪里。
        - id: ch01-b36
          speaker: meg
          text: 空荡的床铺，闲置的小球，再也等不到她的身影。客厅门外听不见轻柔的拍打，也听不见她亲昵的呼噜声。另一只脏脸猫来捕捉她留下的老鼠，可她不像我们的宝贝那样会狩猎，也没有她轻盈优美的姿态。
        - id: ch01-b37
          speaker: meg
          text: 她悄悄踏过雪球从前玩耍的走廊，却只会对狗儿嘶叫。我们的宝贝，曾经英勇地把狗赶跑呀。她温顺有用，也已经尽了全力，只是模样实在算不得美。亲爱的，我们不能让她占据你的位置，更不能像崇拜你那样将她赞美。作者，奥·斯。
        - id: ch01-b38
          speaker: meg
          text: 广告。才华横溢、思想刚强的奥兰西·布拉盖奇小姐，将于下星期六晚常规节目结束后，在匹克威克堂发表著名演讲《女人及其地位》。每周集会将在厨房广场举行，教年轻女士烹饪。汉娜·布朗主持，欢迎参加。
        - id: ch01-b39
          speaker: meg
          text: 畚箕协会下星期三集会，并在会所楼上游行。全体会员要穿制服，九点整把扫帚扛上肩。贝丝·邦瑟太太下星期推出新式玩偶女帽。巴黎最新款式已经到货，敬请订制。
        - id: ch01-b40
          speaker: meg
          text: 几星期内，谷仓村剧院将有新戏登台，精彩程度超过美国舞台上前所未见的一切。这部惊心动魄的戏叫《希腊女奴，又名复仇者君士坦丁》！
        - id: ch01-b41
          speaker: meg
          text: 忠告。如果塞·匹不用那么多肥皂洗手，他就不会天天吃早饭迟到。请奥·斯别在街上吹口哨。特·塔，别忘记艾米的餐巾。纳·温不许因为自己的裙子没有九道褶边就发脾气。每周评语。梅格，好。乔，坏。贝丝，很好。艾米，中等。
        - id: ch01-b42
          speaker: narrator
          text: 主席终于读完了报纸。请允许我向各位读者保证，这确实是从前几位真姑娘亲笔写下的真报纸，我只是原样照录。大家报以一阵掌声。掌声落下以后，斯诺德格拉斯先生站起来，要提一项议案。
        - id: ch01-b43
          speaker: jo
          text: 主席先生、诸位先生，我提议接纳一位新会员。他完全配得上这份荣誉，入社后一定感激万分。他还能给社团增添活力，提高报纸的文学价值，带来数不尽的欢喜。我提议吸收西奥多·劳伦斯先生为匹社荣誉会员。来嘛，就答应让他加入吧。
        - id: ch01-b44
          speaker: narrator
          text: 最后一句突然变了口气，姑娘们都笑起来，可又显得不安。乔坐下以后，谁也没说话。
        - id: ch01-b45
          speaker: meg
          text: 现在表决。赞成这项议案的，请高呼“赞成”。
        - id: ch01-b46
          speaker: narrator
          text: 乔响亮地赞成。出乎大家意料，贝丝也怯生生地跟了一声。
        - id: ch01-b47
          speaker: meg
          text: 持反对意见的，请说“反对”。
        - id: ch01-b48
          speaker: narrator
          text: 梅格和艾米都站在反对的一边。温克尔先生，也就是艾米，十分文雅地站了起来，要替反对者陈述理由。
        - id: ch01-b49
          speaker: amy
          text: 我们不想要男孩子。他们只会说笑话，到处蹦来蹦去。这是女士们的社团，我们希望它隐秘又端庄。
        - id: ch01-b50
          speaker: meg
          text: 我怕他会笑话我们的报纸，以后还拿我们寻开心。
        - id: ch01-b51
          speaker: narrator
          text: 梅格拿不定主意，便像往常一样扯着额前的小卷发。乔又站了起来，这次十分认真。
        - id: ch01-b52
          speaker: jo
          text: 阁下，我以绅士的名誉保证，劳里绝不会那么做。他喜欢写文章，能让我们的稿件更有格调，也能拦住大家，免得写得太多愁善感。我们替他做的那么少，他却为我们做了那么多。至少该在这里给他留个位置。只要他愿意来，我们就该欢迎他。
        - id: ch01-b53
          speaker: narrator
          text: 乔巧妙地提到劳里给大家的帮助，贝丝终于下定决心，站了起来。
        - id: ch01-b54
          speaker: beth
          text: 对，我们应该让他加入，就算害怕也该这么做。他可以来。他祖父要是愿意，也可以一起来。
        - id: ch01-b55
          speaker: narrator
          text: 贝丝突然这样勇敢，把全社都震住了。乔走过去同她握手，马上要求重新表决。
        - id: ch01-b56
          speaker: jo
          text: 大家记住，那可是我们的劳里。现在一起说“赞成”！
        - id: ch01-b57
          speakers: [meg, beth, amy]
          ensemble: chorus
          text: 赞成！赞成！赞成！
          emotion: happy
        - id: ch01-b58
          speaker: jo
          text: 太好了，上帝保佑你们！温克尔不是说过“抓住时间的蹄毛”吗？凡事都得及时。现在，请允许我介绍新会员。
        - id: ch01-b59
          speaker: narrator
          text: 乔猛地打开壁橱门。其余三人惊恐地看见，劳里正坐在一袋碎布上。他忍笑忍得满脸通红，两只眼睛亮闪闪的。
        - id: ch01-b60
          speakers: [meg, beth, amy]
          ensemble: chorus
          text: 你这个坏蛋！你这个叛徒！乔，你怎么能这样？
          emotion: surprised
        - id: ch01-b61
          speaker: narrator
          text: 乔得意扬扬地领出朋友，又搬来一把椅子，取出一条绶带，转眼便替他办完了入社仪式。其余三个姑娘还没从震惊里缓过来。
        - id: ch01-b62
          speaker: meg
          text: 你们两个无赖竟然还能这样若无其事，实在叫人震惊。
        - id: ch01-b63
          speaker: narrator
          text: 梅格想皱出可怕的眉头，脸上却只露出亲切的笑。新会员很会应付场面。他站起身，向主席行了一礼。
        - id: ch01-b64
          speaker: laurie
          text: 主席先生、诸位女士——请原谅，诸位先生——容我自我介绍。本人山姆·韦勒，愿做本社最卑微的仆人。
        - id: ch01-b65
          speaker: jo
          text: 好！好！
          emotion: happy
        - id: ch01-b66
          speaker: narrator
          text: 乔拿旧暖床锅的长柄敲打起来。劳里挥了挥手，继续他的演说。
        - id: ch01-b67
          speaker: laurie
          text: 我忠实的朋友、高贵的恩主刚才夸奖了我。今晚这场卑劣诡计，责任不在她。主意是我出的，她经不起我一再央求，才肯答应。
        - id: ch01-b68
          speaker: jo
          text: 行啦，别全揽到自己身上。藏进壁橱明明是我的主意。
        - id: ch01-b69
          speaker: narrator
          text: 乔把这场玩笑享受得痛快极了。劳里学着韦勒的样子，朝主席点点头。
        - id: ch01-b70
          speaker: laurie
          text: 别管她说什么，阁下。这件坏事就是我干的。不过我以名誉保证，绝不再犯。从今往后，我要全心为这个不朽社团效劳。
        - id: ch01-b71
          speaker: jo
          text: 说得好！说得好！
          emotion: happy
        - id: ch01-b72
          speaker: amy
          text: 说下去，说下去！
        - id: ch01-b73
          speaker: beth
          text: 说下去！
        - id: ch01-b74
          speaker: narrator
          text: 乔把暖床锅盖敲得像面铙钹，梅格则慈祥地点了点头。
        - id: ch01-b75
          speaker: laurie
          text: 我还想说几句。为了感谢各位给我的荣誉，也为了促进两个邻国的友好关系，我已经在花园下角的树篱里设了一座邮政局。那是一栋宽敞漂亮的建筑，门上有锁，既给邮件备齐方便，也给女客备齐方便——请容我这样说。
        - id: ch01-b76
          speaker: laurie
          text: 它原是旧燕巢屋。我堵住门，把屋顶改成可以打开，各种东西都能装进去，也不浪费大家的宝贵时间。信、手稿、书和包裹都可以从那里传递。两个国家各有一把钥匙，我想一定妙极了。请主席收下社团的钥匙。再次感谢各位，现在我坐下了。
        - id: ch01-b77
          speaker: narrator
          text: 劳里把一把小钥匙放到桌上，随即坐下。掌声热烈极了，暖床锅又敲又挥，好半天才恢复秩序。接着，大家兴致勃勃地讨论了很久，人人都开了口。每个人都尽了全力，表现得叫人意外。那次集会格外热闹，直到很晚才散。临走前，四个人还尖声欢呼三遍，为新会员喝彩。
        - id: ch01-b78
          speaker: narrator
          text: 后来谁也没有后悔接纳山姆·韦勒。再没有哪位会员比他更忠诚、更守规矩、更快活了。他的确给集会添了“活力”，也让报纸有了“格调”。他的演说总把听众逗得大笑，文章也篇篇精彩。有时爱国，有时谈古典，有时诙谐，有时充满戏剧味，却从来不多愁善感。乔觉得，那些作品足以和培根、弥尔顿或莎士比亚相比。她还认为，自己照着它们修改文章，成效也很不错。
        - id: ch01-b79
          speaker: narrator
          text: 那座邮政局更是一项极好的小事业，很快就兴旺起来。从那里传递的古怪东西，几乎和真正的邮局一样多。悲剧和领巾，诗歌和腌菜，花种和长信，乐谱和姜饼，还有橡胶套鞋、请柬、训斥，甚至小狗。
        - id: ch01-b80
          speaker: narrator
          text: 老劳伦斯先生也喜欢这个游戏，常寄些古怪包裹、神秘口信和滑稽电报来自娱。他的园丁迷上了汉娜，竟然托乔转交一封情书。秘密揭开时，姑娘们笑得多么厉害啊。可那时谁也想不到，在未来的岁月里，这座小小的邮政局还会装进多少封情书。
