  chapters:
    - id: ch01
      title: The P.C. and P.O.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Spring brought longer days and a fresh collection of amusements. There was work in the garden first. Each sister had one quarter of the small plot and could arrange it exactly as she pleased.
        - id: ch01-b02
          speaker: hannah
          text: I could tell which garden belonged to which girl even if I saw them all the way over in China.
        - id: ch01-b03
          speaker: narrator
          text: She probably could. Their gardens differed as much as the girls themselves. Meg grew roses, heliotrope, myrtle, and a little orange tree. Jo changed her bed every season because she loved experiments. This year she planned a field of sunflowers, whose seeds would feed Aunt Cockle-top and her chicks. Beth chose sweet, old-fashioned flowers. She had sweet peas, mignonette, larkspur, pinks, pansies, and southernwood, along with chickweed for the birds and catnip for the cats. Amy's plot held a tiny bower. It had earwigs, but it was lovely to see. Honeysuckle and morning glories hung their bright horns and bells around it, while white lilies, delicate ferns, and every brilliant plant that agreed to bloom filled the ground.
        - id: ch01-b04
          speaker: narrator
          text: On fine days, the girls gardened, walked, rowed on the river, and hunted for flowers. Rainy days brought indoor entertainments, some familiar and some new, all with a March-family twist. One favorite was the P.C. Secret societies were fashionable, and since all four girls admired Dickens, they formed the Pickwick Club. They had already met for nearly a year, with only a few interruptions.
        - id: ch01-b05
          speaker: narrator
          text: Every Saturday evening, they arranged three chairs before a table in the big attic. On the table stood a lamp, four white badges with the letters P.C. painted in different colors, and their weekly newspaper, The Pickwick Portfolio. Everyone contributed to it, and Jo, who delighted in pens and ink, served as editor.
        - id: ch01-b06
          speaker: narrator
          text: At seven, the four members climbed to the clubroom, tied the badges around their heads, and sat down with great ceremony. As the oldest, Meg became Samuel Pickwick. Literary Jo was Augustus Snodgrass. Round, rosy Beth was Tracy Tupman. And Amy, who was forever attempting things she could not do, became Nathaniel Winkle.
        - id: ch01-b07
          speaker: narrator
          text: Pickwick, the president, read the paper aloud. It held original stories, poems, neighborhood news, ridiculous advertisements, and little hints that cheerfully reminded the members of their faults. At one meeting, Mr. Pickwick put on a pair of spectacles with no glass in them. She struck the table, cleared her throat, and stared at Mr. Snodgrass, who was balancing on the back legs of her chair. Only when Snodgrass sat properly did the president begin.
        - id: ch01-b08
          speaker: meg
          text: The Pickwick Portfolio. May twentieth, eighteen blank. Poet's Corner. Anniversary Ode.
        - id: ch01-b09
          speaker: meg
          text: Once again we meet tonight, with badges and our solemn rite. For the fifty-second time, we celebrate in Pickwick Hall.
        - id: ch01-b10
          speaker: meg
          text: Our little band is gathered here. Each well-known face is in good health, and every friendly hand is ready to be clasped.
        - id: ch01-b11
          speaker: meg
          text: Faithful Pickwick takes his post. We greet him with respect as he puts the spectacles on his nose and reads our well-filled weekly sheet. Though a cold may make him croak or squeak, we gladly listen while his words of wisdom fall.
        - id: ch01-b12
          speaker: meg
          text: Six-foot Snodgrass towers above us with the grace of an elephant and smiles down with a cheerful brown face. Poetic fire shines in his eye. Ambition sits upon his brow, and a blot of ink sits on his nose.
        - id: ch01-b13
          speaker: meg
          text: Peaceful Tupman comes next, rosy, round, and sweet. He laughs so hard at every pun that he tumbles from his seat.
        - id: ch01-b14
          speaker: meg
          text: Proper little Winkle is here too, every hair exactly where it belongs. He is a model of good behavior, though he hates to wash his face.
        - id: ch01-b15
          speaker: meg
          text: Another year has passed, and still we meet to joke and laugh and read. Together we walk the path of literature, the path that leads to glory. Long may our paper flourish. Long may our club remain unbroken. And may the coming years pour blessings on the useful and merry P.C. Signed, A. Snodgrass.
        - id: ch01-b16
          speaker: meg
          text: The Masked Marriage. A Tale of Venice.
        - id: ch01-b17
          speaker: narrator
          text: One gondola after another swept up to the marble steps of Count Adelon's palace. Each delivered more splendid guests to the crowded halls. Knights and ladies danced beside elves, pages, monks, and flower girls. Sweet voices rose with rich music, and the masquerade spun happily on. A gallant troubadour led a fairy queen down the hall.
        - id: ch01-b18
          speaker: troubadour
          text: Has Your Highness seen Lady Viola this evening?
        - id: ch01-b19
          speaker: fairy_queen
          text: Yes. Isn't she beautiful? And yet she looks so unhappy. Her costume suits her fate. In one week, she must marry Count Antonio, a man she truly hates.
        - id: ch01-b20
          speaker: troubadour
          text: By my faith, I envy him anyway. Look, there he is, dressed like a bridegroom except for that black mask. Once it comes off, we'll see how he looks at the lovely girl whose hand her stern father gives him, though he can never win her heart.
        - id: ch01-b21
          speaker: fairy_queen
          text: People whisper that she loves the young English artist who follows wherever she goes. The old count wants nothing to do with him.
        - id: ch01-b22
          speaker: narrator
          text: They joined the dance. At the height of the celebration, a priest appeared and led a young couple into an alcove draped in purple velvet. He motioned for them to kneel. The room fell silent. Only fountains splashed, and orange trees rustled in the moonlight. Then Count Adelon addressed his guests.
        - id: ch01-b23
          speaker: count_adelon
          text: My lords and ladies, forgive the trick that brought you here to witness my daughter's marriage. Father, we are ready for the ceremony.
        - id: ch01-b24
          speaker: narrator
          text: Every eye turned toward the couple. A murmur of amazement ran through the guests because neither bride nor groom removed a mask. Everyone wondered, but respect kept them quiet until the holy service ended. Then they crowded around the count and demanded an explanation.
        - id: ch01-b25
          speaker: count_adelon
          text: I would gladly explain if I could. I only know this was my timid Viola's wish, and I allowed it. Now, my children, the game is over. Take off your masks and kneel for my blessing.
        - id: ch01-b26
          speaker: narrator
          text: Neither one knelt. The bridegroom answered in a voice that startled the whole room. His mask dropped, revealing the noble face of Ferdinand Devereux, Viola's artist lover. A star flashed on his chest, marking him as an English earl. Viola leaned against him, shining with joy.
        - id: ch01-b27
          speaker: ferdinand
          text: My lord, you scornfully told me to claim your daughter when my title and fortune equaled Count Antonio's. I can offer even more. Not even your ambition can reject the Earl of Devereux and De Vere when he gives his ancient name and endless wealth for the beloved hand of this lady, who is now my wife.
          emotion: happy
        - id: ch01-b28
          speaker: narrator
          text: The count stood as still as stone. Ferdinand turned to the bewildered company with a triumphant smile.
        - id: ch01-b29
          speaker: ferdinand
          text: My brave friends, I can only hope your courtships succeed as mine has, and that each of you wins a bride as lovely as mine through a masked marriage.
          emotion: happy
        - id: ch01-b30
          speaker: meg
          text: Signed, S. Pickwick. And now a riddle. Why is the P.C. like the Tower of Babel? Because it is full of unruly members.
        - id: ch01-b31
          speaker: meg
          text: The History of a Squash.
        - id: ch01-b32
          speaker: narrator
          text: Once there was a farmer who planted a small seed in his garden. In time, it sprouted, grew into a vine, and produced many squashes. One October day, when they were ripe, he picked one and carried it to market. A grocer bought the squash and displayed it in his shop.
        - id: ch01-b33
          speaker: narrator
          text: That same morning, a little girl came in wearing a brown hat and a blue dress. She had a round face and a snub nose. She bought the squash for her mother, lugged it home, chopped it up, and boiled it in the large pot. She mashed some with salt and butter for dinner. Into the rest went a pint of milk, two eggs, four spoonfuls of sugar, nutmeg, and crackers. She put the mixture in a deep dish and baked it until it was nicely brown. The next day, a family named March ate it. Signed, T. Tupman.
        - id: ch01-b34
          speaker: meg
          text: Mr. Pickwick, sir. I am writing about a sinner. I mean a man named Winkle. He causes trouble in the club by laughing, and sometimes he refuses to write his part of this fine paper. Please forgive his bad behavior and let him submit a French fable. He cannot make up a story himself because he has too many lessons and no brains. In the future, I will try to take time by the fetlock and prepare something that will be all commy la fo. That means all right. I must hurry because it is nearly time for school. Yours respectably, N. Winkle.
        - id: ch01-b35
          speaker: narrator
          text: The editor added a note. This was a manly and handsome confession of past misdeeds. It would also be useful if their young friend studied punctuation.
        - id: ch01-b36
          speaker: meg
          text: A Sad Accident.
        - id: ch01-b37
          speaker: narrator
          text: Last Friday, a violent crash shook the basement, followed by cries for help. The members rushed together to the cellar and found their beloved president flat on the floor. He had tripped while fetching wood for the household.
        - id: ch01-b38
          speaker: narrator
          text: Ruin surrounded him. As he fell, Mr. Pickwick had plunged his head and shoulders into a tub of water, spilled a keg of soft soap all over his noble form, and badly torn his clothes. Once he was rescued from this dangerous position, the club discovered that he had suffered nothing worse than several bruises. They were happy to report that he was recovering nicely. Signed, the editor.
        - id: ch01-b39
          speaker: meg
          text: The Public Bereavement.
        - id: ch01-b40
          speaker: narrator
          text: The paper sadly announced the sudden and mysterious disappearance of Mrs. Snowball Pat Paw. This lovely cat had a wide circle of devoted friends. Her beauty caught every eye, and her sweet nature won every heart. The whole community felt her loss.
        - id: ch01-b41
          speaker: narrator
          text: Snowball had last been seen sitting at the gate and watching the butcher's cart. Her friends feared that some villain, tempted by her charms, had stolen her. Weeks passed without a trace. At last they gave up hope. They tied a black ribbon to her basket, put away her dish, and mourned her as lost forever.
        - id: ch01-b42
          speaker: meg
          text: A sympathetic friend sent this poem. A Lament for S. B. Pat Paw.
        - id: ch01-b43
          speaker: meg
          text: We grieve for our little pet and sigh over her unhappy fate. Never again will she sit by the fire or play beside the old green gate.
        - id: ch01-b44
          speaker: meg
          text: Her kitten lies in a little grave beneath the chestnut tree. But we cannot weep beside Snowball's grave, because we do not know where it could be.
        - id: ch01-b45
          speaker: meg
          text: Her bed is empty. Her ball lies still. Neither will ever see her again. No soft tap and no loving purr comes from the parlor door.
        - id: ch01-b46
          speaker: meg
          text: Another cat now chases her mice. That cat has a dirty face. She does not hunt the way our darling hunted, or play with Snowball's airy grace.
        - id: ch01-b47
          speaker: meg
          text: Her quiet paws cross the same hall where Snowball used to play. But she only spits at the dogs that our brave pet always chased away.
        - id: ch01-b48
          speaker: meg
          text: This cat is useful and gentle and does her best, but she is not beautiful. We cannot give her your place, dear Snowball, or adore her as we adored you. Signed, A. Snodgrass.
        - id: ch01-b49
          speaker: meg
          text: Advertisements. Miss Oranthy Bluggage, the famous strong-minded lecturer, will speak on Woman and Her Position at Pickwick Hall next Saturday evening, after the usual performances.
        - id: ch01-b50
          speaker: meg
          text: A weekly meeting will take place at Kitchen Place to teach young ladies to cook. Hannah Brown will preside, and everyone is welcome.
        - id: ch01-b51
          speaker: meg
          text: The Dustpan Society meets next Wednesday and will parade through the upper floor of the clubhouse. Members must wear their uniforms and shoulder their brooms at exactly nine o'clock.
        - id: ch01-b52
          speaker: meg
          text: Mrs. Beth Bouncer opens her new collection of doll hats next week. The latest Paris styles have arrived, and she respectfully invites your orders.
        - id: ch01-b53
          speaker: meg
          text: A new play will soon open at the Barnville Theatre. It will surpass everything ever presented on the American stage. This thrilling drama is called The Greek Slave, or Constantine the Avenger.
        - id: ch01-b54
          speaker: meg
          text: Hints. If S. P. did not use so much soap on his hands, he would not always arrive late for breakfast. A. S. is asked not to whistle in the street. T. T. must remember Amy's napkin. N. W. must stop fretting because her dress does not have nine tucks.
        - id: ch01-b55
          speaker: meg
          text: Weekly report. Meg, good. Jo, bad. Beth, very good. Amy, middling.
        - id: ch01-b56
          speaker: narrator
          text: When the president finished, the members applauded. And that paper, unbelievable as it may sound, is a true copy of one that real girls wrote long ago. Then Mr. Snodgrass stood to make a proposal.
        - id: ch01-b57
          speaker: jo
          text: Mr. President and gentlemen, I propose we admit a new member. He richly deserves the honor and would be deeply grateful. He would bring tremendous spirit to the club, improve the literary quality of our paper, and be wonderfully good company. I nominate Mr. Theodore Laurence as an honorary member of the P.C. Oh, please, say yes and let him join.
        - id: ch01-b58
          speaker: narrator
          text: Jo's sudden fall from grand parliamentary language made the girls laugh. Still, they looked uneasy, and nobody spoke as Snodgrass sat down.
        - id: ch01-b59
          speaker: meg
          text: We will vote. Everyone in favor of the motion, please say aye.
        - id: ch01-b60
          speaker: jo
          text: Aye!
        - id: ch01-b61
          speaker: beth
          text: Aye.
        - id: ch01-b62
          speaker: narrator
          text: Jo's answer rang out loudly. Beth's followed so softly that it surprised everyone.
        - id: ch01-b63
          speaker: meg
          text: Anyone opposed, say no.
        - id: ch01-b64
          speaker: narrator
          text: Meg and Amy opposed the motion. Mr. Winkle rose and explained their position with great elegance.
        - id: ch01-b65
          speaker: amy
          text: We do not want boys here. They tease and charge around. This is a ladies' club, and we intend to keep it private and proper.
        - id: ch01-b66
          speaker: meg
          text: I'm worried he'll laugh at our paper and tease us about it later.
        - id: ch01-b67
          speaker: narrator
          text: Pickwick tugged the curl on her forehead, as she always did when she could not decide. Snodgrass sprang up, thoroughly serious now.
        - id: ch01-b68
          speaker: jo
          text: Sir, you have my word as a gentleman that Laurie would never do that. He likes writing. He'll make our contributions better and stop us from getting too sentimental. Besides, we can do so little for him when he does so much for us. The least we can do is give him a place and welcome him whenever he comes.
        - id: ch01-b69
          speaker: narrator
          text: That clever reminder of Laurie's kindness brought Tupman to her feet. Beth looked as if her mind was settled.
        - id: ch01-b70
          speaker: beth
          text: Yes, we should invite him, even if we're nervous. I say he may join. His grandfather may come too, if he wants.
        - id: ch01-b71
          speaker: narrator
          text: Such boldness from Beth thrilled the club. Jo left her chair and shook Beth's hand with approval.
        - id: ch01-b72
          speaker: jo
          text: All right, let's vote again. Remember, this is our Laurie. Everybody say aye!
          emotion: happy
        - id: ch01-b73
          speakers: [meg, beth, amy]
          ensemble: chorus
          text: Aye! Aye! Aye!
        - id: ch01-b74
          speaker: jo
          text: Wonderful! Bless you all! As Winkle so memorably says, there's nothing like taking time by the fetlock. Therefore, allow me to present our new member.
        - id: ch01-b75
          speaker: narrator
          text: The rest of the club watched in horror as Jo opened the closet door. There sat Laurie on a bag of rags, red in the face and his eyes sparkling because he had been holding back his laughter.
        - id: ch01-b76
          speakers: [meg, beth, amy]
          ensemble: chorus
          text: You rascal! You traitor! Jo, how could you?
          emotion: surprised
        - id: ch01-b77
          speaker: narrator
          text: Snodgrass proudly led her friend out, produced a chair and a badge, and installed him in moments.
        - id: ch01-b78
          speaker: meg
          text: I cannot believe the nerve of you two villains.
        - id: ch01-b79
          speaker: narrator
          text: Mr. Pickwick tried to summon a dreadful frown but managed only a friendly smile. The new member knew exactly what to do. He rose, bowed gratefully to the president, and spoke with irresistible charm.
        - id: ch01-b80
          speaker: laurie
          text: Mr. President and ladies... Forgive me, gentlemen. Let me introduce myself as Sam Weller, the club's most humble servant.
        - id: ch01-b81
          speaker: jo
          text: Excellent! Excellent!
          emotion: happy
        - id: ch01-b82
          speaker: narrator
          text: Jo pounded the handle of the old warming pan she was using as a staff.
        - id: ch01-b83
          speaker: laurie
          text: My loyal friend and noble patron deserves no blame for tonight's disgraceful trick, no matter how flatteringly she introduced me. The plan was mine. She agreed only after I bothered her again and again.
        - id: ch01-b84
          speaker: jo
          text: Don't take all the blame. You know hiding in the cupboard was my idea.
        - id: ch01-b85
          speaker: narrator
          text: Snodgrass was enjoying the joke far too much to let Laurie protect her.
        - id: ch01-b86
          speaker: laurie
          text: Pay no attention to her, sir. I am the scoundrel responsible. But I give you my word of honor that I will never do it again. From this day forward, I devote myself to the good of this immortal club.
        - id: ch01-b87
          speaker: jo
          text: Hear, hear!
          emotion: happy
        - id: ch01-b88
          speaker: narrator
          text: Jo crashed the warming-pan lid like a cymbal.
        - id: ch01-b89
          speakers: [amy, beth]
          ensemble: duo
          text: Keep going! Keep going!
        - id: ch01-b90
          speaker: narrator
          text: The president gave Laurie a gracious bow.
        - id: ch01-b91
          speaker: laurie
          text: I have only one more thing to say. As a small sign of my gratitude for this honor, and to encourage friendly relations between our neighboring nations, I have built a post office in the hedge at the lower end of the garden.
        - id: ch01-b92
          speaker: laurie
          text: It is a fine, roomy building, with padlocks on the doors and every convenience for the mails, and for the females too, if you'll forgive the joke. It used to be the martin house. I closed its old entrance and made the roof open instead, so it can hold all kinds of things and save us valuable time.
        - id: ch01-b93
          speaker: laurie
          text: We can pass letters, manuscripts, books, and packages through it. Each nation has a key, so I think it will be unusually convenient. Here is the club's key. Thank you again for welcoming me. I will now sit down.
        - id: ch01-b94
          speaker: narrator
          text: The club burst into applause as Mr. Weller placed a small key on the table and dropped into his chair. The warming pan clashed and waved so wildly that restoring order took quite some time.
        - id: ch01-b95
          speaker: narrator
          text: A long discussion followed. Each girl surprised the others because each one tried her best. The meeting was livelier than usual and ran very late. At last, the club adjourned with three piercing cheers for its new member.
        - id: ch01-b96
          speakers: [meg, jo, beth, amy]
          ensemble: chorus
          text: Three cheers for Sam Weller! Hurrah! Hurrah! Hurrah!
          emotion: happy
        - id: ch01-b97
          speaker: narrator
          text: No one ever regretted admitting Sam Weller. No club could have asked for a more devoted, well-behaved, cheerful member. Laurie certainly brought spirit to the meetings and a new tone to the paper. His speeches made everyone helpless with laughter, while his excellent contributions might be patriotic, classical, comic, or dramatic, but never sentimental.
        - id: ch01-b98
          speaker: narrator
          text: Jo considered his work worthy of Bacon, Milton, or Shakespeare. Inspired by it, she revised her own writing, with excellent results, at least in her opinion.
        - id: ch01-b99
          speaker: narrator
          text: The P.O. became a splendid little institution and flourished. Almost as many strange objects traveled through it as through a real post office. There were tragedies and neckties, poems and pickles, garden seeds and long letters, sheet music and gingerbread, rubber shoes, invitations, scoldings, and puppies.
        - id: ch01-b100
          speaker: narrator
          text: Laurie's grandfather joined the fun by sending peculiar parcels, mysterious notes, and amusing telegrams. Even his gardener, who had fallen for Hannah's charms, sent a love letter in Jo's care.
        - id: ch01-b101
          speaker: narrator
          text: How the girls laughed when that secret came out! They never imagined how many love letters their little post office would carry in the years ahead.
