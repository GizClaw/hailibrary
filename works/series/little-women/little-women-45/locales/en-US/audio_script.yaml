  chapters:
    - id: ch01
      title: "CHAPTER FORTY-FOUR MY LORD AND LADY"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The next day, Laurie came in and found Mrs. Laurence curled up in her mother's lap, being the baby of the family again.
        - id: ch01-b02
          speaker: laurie
          text: "Madam Mother, may I borrow my wife for half an hour? Our luggage is here, and I've turned Amy's Paris clothes upside down looking for a few things I need."
        - id: ch01-b03
          speaker: mrs_march
          text: "Of course. Go with him, dear. I keep forgetting you have another home now."
        - id: ch01-b04
          speaker: narrator
          text: Mrs. March pressed the white hand with its wedding ring, as though apologizing for wanting to keep her daughter close.
        - id: ch01-b05
          speaker: laurie
          text: "I wouldn't have interrupted if I could manage without her. But these days, I need my little woman as much as a..."
        - id: ch01-b06
          speaker: jo
          text: "As much as a weather vane needs the wind."
        - id: ch01-b07
          speaker: narrator
          text: Since Teddy had come home, Jo had become her saucy old self again.
        - id: ch01-b08
          speaker: laurie
          text: "That's it. Amy keeps me pointed west almost all the time. Once in a while I swing south, but marriage has spared me every cold wind from the east. I know nothing about the north. I'm healthy and enjoying perfect weather. Isn't that right, my lady?"
        - id: ch01-b09
          speaker: amy
          text: "The weather has been lovely so far. I can't promise it will last, but storms don't frighten me. I'm learning to sail my own ship. Come home, dear, and I'll find your bootjack. That is what you're digging for in my things, isn't it? Mother, men are so helpless."
        - id: ch01-b10
          speaker: narrator
          text: Her grand, married-lady manner delighted Laurie.
        - id: ch01-b11
          speaker: jo
          text: "What will you two do once you're settled?"
        - id: ch01-b12
          speaker: narrator
          text: Jo fastened Amy's cloak, just as she used to fasten her little pinafores.
        - id: ch01-b13
          speaker: laurie
          text: "We have plans, though we're not ready to announce them. We're very new brooms, but we don't mean to sit idle. I'm going into business so earnestly that Grandfather will be delighted. I'll prove I haven't been spoiled. I need work to keep me steady. I've had enough of drifting around, and now I mean to work like a man."
        - id: ch01-b14
          speaker: mrs_march
          text: "And what will Amy do?"
        - id: ch01-b15
          speaker: narrator
          text: Mrs. March was pleased by both his choice and the energy behind it.
        - id: ch01-b16
          speaker: laurie
          text: "First we'll make all the proper visits and show off our finest bonnet. Then we'll amaze you with splendid parties at our mansion, gather brilliant people around us, and improve the whole world. That's the plan, isn't it, Madame Récamier?"
        - id: ch01-b17
          speaker: narrator
          text: He gave Amy a teasing look.
        - id: ch01-b18
          speaker: amy
          text: "We'll see. Come along, you rude creature, and stop calling me names in front of my family."
        - id: ch01-b19
          speaker: narrator
          text: Amy meant to build a real home with a good wife at its heart before she tried to rule a fashionable salon. After the young couple left, Mr. March found Aristotle rather hard to return to.
        - id: ch01-b20
          speaker: mr_march
          text: "Those children look very happy together."
        - id: ch01-b21
          speaker: mrs_march
          text: "Yes. And I believe their happiness will last."
        - id: ch01-b22
          speaker: narrator
          text: She looked as peaceful as a pilot who had brought a ship safely into harbor.
        - id: ch01-b23
          speaker: jo
          text: "I know it will. Lucky Amy!"
        - id: ch01-b24
          speaker: narrator
          text: Jo sighed. Then Professor Bhaer pushed the gate open impatiently, and her face brightened into a smile.
        - id: ch01-b25
          speaker: narrator
          text: That evening, once Laurie had stopped worrying about the missing bootjack, he suddenly addressed his wife.
        - id: ch01-b26
          speaker: laurie
          text: "Mrs. Laurence."
        - id: ch01-b27
          speaker: amy
          text: "My lord!"
        - id: ch01-b28
          speaker: laurie
          text: "That man plans to marry our Jo."
        - id: ch01-b29
          speaker: amy
          text: "I hope he does. Don't you?"
        - id: ch01-b30
          speaker: laurie
          text: "He's a first-rate fellow, as fine as they come. Still, I wish he were a little younger and a great deal richer."
        - id: ch01-b31
          speaker: amy
          text: "Laurie, don't be so particular and worldly. If they love each other, age and money don't matter at all. A woman should never marry for money..."
        - id: ch01-b32
          speaker: narrator
          text: Amy stopped short. The words had slipped out before she remembered her own old plans. She looked at Laurie, and he answered with solemn mischief.
        - id: ch01-b33
          speaker: laurie
          text: "Certainly not. Though sometimes you hear a charming girl announce that she means to do exactly that. If I remember correctly, you once thought it was your duty to marry a rich man. Perhaps that's why you chose a useless fellow like me."
        - id: ch01-b34
          speaker: amy
          text: "Oh, my dearest, don't say that! When I said yes, I forgot all about your money. I would have married you without a penny. Sometimes I even wish you were poor, just so I could prove how much I love you."
        - id: ch01-b35
          speaker: narrator
          text: Amy was dignified before other people and deeply affectionate in private. Now she gave him plenty of proof that she meant every word.
        - id: ch01-b36
          speaker: amy
          text: "You don't truly think I'm as mercenary as I once tried to be, do you? It would break my heart if you didn't believe I'd gladly share your boat, even if you had to earn our living by rowing people across the lake."
        - id: ch01-b37
          speaker: laurie
          text: "Do you take me for an idiot and a brute? I could never think that. You turned down a richer man for me, and even now you won't accept half the things I want to give you, though I have every right to offer them. Poor girls make rich marriages every day because they're taught that money is their only rescue. You were taught better. I worried about you once, but you never disappointed me. You stayed true to your mother's lessons. I told Mamma that yesterday, and she looked as grateful as if I'd handed her a million-dollar check for charity. You're not listening to my moral speech, Mrs. Laurence."
        - id: ch01-b38
          speaker: narrator
          text: He paused. Amy was looking at his face, but her eyes had wandered far away.
        - id: ch01-b39
          speaker: amy
          text: "I am listening. I'm admiring the mole on your chin at the same time. I don't want to make you vain, but I'm prouder of my handsome husband than I am of all his money. Don't laugh. Your nose is a great comfort to me."
        - id: ch01-b40
          speaker: narrator
          text: With an artist's satisfaction, she gently touched his finely shaped nose. Laurie had heard many compliments, but none had pleased him more. He laughed at her unusual taste, while she spoke again, slowly.
        - id: ch01-b41
          speaker: amy
          text: "May I ask you something, dear?"
        - id: ch01-b42
          speaker: laurie
          text: "Of course."
        - id: ch01-b43
          speaker: amy
          text: "Will it trouble you if Jo marries Mr. Bhaer?"
        - id: ch01-b44
          speaker: laurie
          text: "Ah, so that's it. I knew there was something hiding in that dimple of yours. I'm not a jealous dog guarding what he doesn't want, and I'm the happiest man alive. I promise I can dance at Jo's wedding with a heart as light as my feet. Do you doubt me, darling?"
        - id: ch01-b45
          speaker: narrator
          text: Amy looked up at him and knew he meant it. Her small, jealous fear disappeared for good. Love and trust shone in her face as she thanked him.
        - id: ch01-b46
          speaker: laurie
          text: "I wish we could do something for that excellent old Professor. Could we invent a rich relative in Germany who would kindly die and leave him a comfortable fortune?"
        - id: ch01-b47
          speaker: narrator
          text: They began walking arm in arm through the long drawing room, as they often did in memory of the château garden.
        - id: ch01-b48
          speaker: amy
          text: "Jo would discover our trick and ruin everything. She's proud of him exactly as he is. Yesterday she even said poverty was beautiful."
        - id: ch01-b49
          speaker: laurie
          text: "Bless her dear heart. She won't call it beautiful when she has a writer for a husband and a dozen little professors to feed. We won't interfere yet. We'll wait for our chance and help them in spite of themselves. Jo deserves repayment for part of my education, and she believes people should pay honest debts. That's how I'll get around her."
        - id: ch01-b50
          speaker: amy
          text: "Isn't it wonderful to be able to help people? I always dreamed of having enough to give freely. Because of you, that dream has come true."
          emotion: happy
        - id: ch01-b51
          speaker: laurie
          text: "We'll do a great deal of good, won't we? There's one kind of poverty I especially want to help. People look after those who openly beg. But gentle people who have fallen on hard times often suffer, because they won't ask and others are afraid to offer charity. If you understand how to be tactful, there are a thousand ways to help without hurting their pride. I admit I'd rather help a gentleman who's lost his fortune than a flattering beggar. Perhaps that's wrong, and it is harder, but it's true."
        - id: ch01-b52
          speaker: amy
          text: "Because it takes a gentleman to know how."
        - id: ch01-b53
          speaker: narrator
          text: That came from the other member of their little household society for mutual admiration.
        - id: ch01-b54
          speaker: laurie
          text: "Thank you, though I'm afraid I haven't earned such a pretty compliment. But while I was wasting time abroad, I met talented young men who gave up all kinds of comforts and endured real hardship to follow their dreams. Some were splendid fellows. They worked like heroes, alone and poor, with so much courage, patience, and ambition that I felt ashamed of myself. I wanted to give them a real lift. Those are the people it's satisfying to help. If a man has genius, it's an honor to support him and keep his gift from being lost or delayed just because he can't afford food and fuel. If he has no genius, at least you can comfort him and keep him from despair when he discovers it."
        - id: ch01-b55
          speaker: amy
          text: "Yes, and there's another group that can't ask for help, so they suffer quietly. I understand them because I was one of them before you turned me into a princess, like the king and the beggar maid in the old story. Ambitious girls have a hard road, Laurie. They often watch their youth, health, and precious chances slip away because no one gave them a little help at the right moment. People were very kind to me. Whenever I see girls struggling as we once did, I want to reach out and help them the way others helped me."
        - id: ch01-b56
          speaker: laurie
          text: "And you shall, because you're an angel!"
          emotion: happy
        - id: ch01-b57
          speaker: narrator
          text: Laurie glowed with charitable enthusiasm. He was already resolving to establish and support an institution especially for young women with artistic gifts.
        - id: ch01-b58
          speaker: laurie
          text: "Rich people have no right to sit back enjoying themselves while their money piles up for someone else to waste. Leaving fortunes behind when you die isn't half as sensible as using money wisely while you're alive and enjoying the happiness it brings others. We'll enjoy ourselves too, but our pleasure will taste even better when we give other people a generous share. Will you be my little Dorcas, carrying a great basket of comforts around and filling it again with good deeds?"
        - id: ch01-b59
          speaker: amy
          text: "With all my heart, if you'll be brave Saint Martin, riding through the world and stopping to share your cloak with a beggar."
        - id: ch01-b60
          speaker: laurie
          text: "It's a bargain, and we'll be the ones who gain the most!"
        - id: ch01-b61
          speaker: narrator
          text: The young couple shook hands on their promise, then happily walked on together. Their pleasant home felt more truly like home because they hoped to brighten other homes. They believed they would walk more uprightly along the flower-strewn path ahead if they made rough roads smoother for other feet. And their hearts drew closer through a love that could tenderly remember those who had been less fortunate than they were.
