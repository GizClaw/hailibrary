audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带含蓄的机智
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    laurie:
      display_name: 劳里
      tts:
        delivery: 快活风趣，真挚时沉稳坦率
        timbre: 明亮温厚的青年男声
        pace: 轻快自然
        pitch: 中音偏低
    amy:
      display_name: 艾米
      tts:
        delivery: 优雅自持，亲密时柔情活泼
        timbre: 柔美清亮的青年女声
        pace: 从容流畅
        pitch: 中音偏高
    jo:
      display_name: 乔
      tts:
        delivery: 爽朗敏捷，俏皮中带着真情
        timbre: 清脆而略带沙哑的青年女声
        pace: 明快利落
        pitch: 中音
    marmee:
      display_name: 马奇太太
      tts:
        delivery: 慈爱安详，语气自然亲切
        timbre: 温暖沉静的成年女声
        pace: 平稳舒缓
        pitch: 中音偏低
    mr_march:
      display_name: 马奇先生
      tts:
        delivery: 温和儒雅，带安静的喜悦
        timbre: 柔和清朗的成年男声
        pace: 从容不迫
        pitch: 中音偏低
  chapters:
    - id: ch01
      title: 第四十四章 老爷与夫人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天，劳里走进马奇家，看见新婚的劳伦斯太太正坐在母亲膝上，又做回了家里的小宝贝。
        - id: ch01-b02
          speaker: laurie
          text: 母亲大人，能把我太太借给我半小时吗？行李刚送到。我为了找几样东西，已经把她从巴黎带回来的漂亮衣裳翻了个乱七八糟。
        - id: ch01-b03
          speaker: marmee
          text: 当然可以。去吧，亲爱的。我都忘了，你现在还有一个家呢。
        - id: ch01-b04
          speaker: narrator
          text: 马奇太太握了握艾米那只戴着婚戒的白皙小手，像是在为自己舍不得放开女儿道歉。她只顾把女儿留在身边，差点忘了艾米已经有了自己的家。
        - id: ch01-b05
          speaker: laurie
          text: 要不是实在没办法，我也不会来找她。现在少了我的小妇人，我什么都干不成。可我一时想不起该拿什么来比。
        - id: ch01-b06
          speaker: jo
          text: 就像风信鸡没了风。
        - id: ch01-b07
          speaker: narrator
          text: 泰迪一回家，乔也恢复了从前那股爱开玩笑的劲儿。
        - id: ch01-b08
          speaker: laurie
          text: 正是。艾米大多时候让我朝着正西，偶尔才转向南边。结婚以后，我还没碰见过一阵东风，北风是什么更不知道。总之，我这里一直暖洋洋的，气候宜人。对不对，我的夫人？
        - id: ch01-b09
          speaker: amy
          text: 到现在天气是不错。以后能晴多久，我可说不准，不过风浪来了我也不怕，我正在学着掌自己的船呢。回家吧，亲爱的，我替你找脱靴器。你在我的东西里乱翻，准是在找它。妈妈，你看，男人真是没人照顾就不行。
        - id: ch01-b10
          speaker: narrator
          text: 艾米摆出当家太太的口气，劳里看着她这副模样，喜欢得不得了。乔替她扣上斗篷，就像小时候替她扣围裙一样。
        - id: ch01-b11
          speaker: jo
          text: 等你们安顿好了，打算做些什么？
        - id: ch01-b12
          speaker: laurie
          text: 我们已经有了打算，只是暂时不多说。我们这两把扫帚还新着呢，不过肯定不会闲着。我要认真做生意，让爷爷高兴，也证明我没被宠坏。我得找件正经事管住自己。懒散的日子已经过够了，以后我要像个男子汉那样做事。
        - id: ch01-b13
          speaker: narrator
          text: 马奇太太见他这样有决心，十分欣慰。
        - id: ch01-b14
          speaker: marmee
          text: 那艾米准备做什么呢？
        - id: ch01-b15
          speaker: laurie
          text: 先去各处拜访，把礼数做周全，再戴上最漂亮的帽子给大家瞧瞧。以后我们府上会有高雅的宴请，身边会聚起灿烂的名流，还要对整个世界产生有益的影响。差不多就是这样吧，雷卡米埃夫人？
        - id: ch01-b16
          speaker: amy
          text: 以后你们自然会知道。走吧，你这个没规矩的家伙。别当着我家人的面乱叫我，吓着他们。
        - id: ch01-b17
          speaker: narrator
          text: 艾米心里想得很清楚。她要先把家过好，做个好妻子，然后才去开办自己的沙龙，做社交界的女王。小夫妻走后，马奇先生怎么也读不进他的亚里士多德了。
        - id: ch01-b18
          speaker: mr_march
          text: 这两个孩子在一起，多快活啊！
        - id: ch01-b19
          speaker: marmee
          text: 是啊，我想他们会一直这样快活。
        - id: ch01-b20
          speaker: narrator
          text: 她的神情十分安宁，像一位领航人终于把船平安带进了港口。
        - id: ch01-b21
          speaker: jo
          text: 我知道他们会的。艾米真幸福！
        - id: ch01-b22
          speaker: narrator
          text: 乔先叹了口气，随即又笑得明亮起来，因为贝尔教授正急急推开院门。到了晚上，劳里终于找到了脱靴器，心也定了下来。他忽然郑重地叫妻子。
        - id: ch01-b23
          speaker: laurie
          text: 劳伦斯太太。
        - id: ch01-b24
          speaker: amy
          text: 我的大人！
        - id: ch01-b25
          speaker: laurie
          text: 那个人打算娶我们的乔！
        - id: ch01-b26
          speaker: amy
          text: 我正希望他娶呢。亲爱的，你不希望吗？
        - id: ch01-b27
          speaker: laurie
          text: 我承认，他是个十足的好汉。可惜年纪要是再轻一点，钱再多一点，就更好了。
        - id: ch01-b28
          speaker: amy
          text: 劳里，别那么挑剔，也别只想着世俗的条件。只要两个人相爱，年纪和贫穷都算不了什么。女人绝不能为了钱结婚……
        - id: ch01-b29
          speaker: narrator
          text: 艾米突然意识到自己说了什么，立刻住了口。劳里看着她，故意摆出一本正经的样子，眼里却满是促狭。
        - id: ch01-b30
          speaker: laurie
          text: 当然不能。不过，有些迷人的姑娘确实说过，自己就打算那么办。要是我没记错，你以前还觉得嫁个有钱人是你的责任。大概正因为这样，你才选了我这个没用的家伙。
        - id: ch01-b31
          speaker: amy
          text: 我最亲爱的，别这么说！答应你的时候，我早忘了你有钱。哪怕你一分钱也没有，我还是会嫁给你。有时候我真希望你很穷，那我就能让你知道，我到底有多爱你。
          emotion: sad
        - id: ch01-b32
          speaker: narrator
          text: 艾米在人前很端庄，到了丈夫面前却满是柔情。她用行动证明，这番话全是真的。
        - id: ch01-b33
          speaker: amy
          text: 你不会真以为，我还是从前那个想嫁给钱的姑娘吧？哪怕你得靠在湖上替人划船挣钱，我也愿意和你坐在同一条船里，一起划下去。要是你不相信，我的心会碎的。
          emotion: sad
        - id: ch01-b34
          speaker: laurie
          text: 我难道又蠢又没心肝吗？你为了我拒绝过一个更有钱的人。现在我有权把一半给你，你却连我想给的那些都不肯全收，我怎么还会怀疑？可怜的姑娘们每天都有人为了钱结婚，因为大家从小就教她们，那是唯一的出路。你学到的却不是这些。我曾经替你担心过，可你没有让我失望。你没有辜负妈妈教你的道理。昨天我把这话告诉妈妈，她欢喜又感激，简直像收了一张一百万的支票，可以全拿去行善。劳伦斯太太，你没在听我的大道理吧？
        - id: ch01-b35
          speaker: narrator
          text: 艾米明明看着丈夫，眼神却像飘远了。
        - id: ch01-b36
          speaker: amy
          text: 我在听呀。我还在看你下巴上的痣。我不想把你夸得太自负，可比起你的钱，我更为这个英俊的丈夫骄傲。别笑，你的鼻子真让我看着舒心。
        - id: ch01-b37
          speaker: narrator
          text: 她像欣赏一件美丽的艺术品那样，轻轻摸了摸他轮廓漂亮的鼻子。劳里一辈子听过不少恭维，却从没有一句这样合他的心意。他虽然笑妻子的品味古怪，那副受用的样子却明明白白写在脸上。艾米慢慢开了口。
        - id: ch01-b38
          speaker: amy
          text: 亲爱的，我能问你一件事吗？
        - id: ch01-b39
          speaker: laurie
          text: 当然能。
        - id: ch01-b40
          speaker: amy
          text: 要是乔真的嫁给贝尔先生，你会在意吗？
        - id: ch01-b41
          speaker: laurie
          text: 原来你愁的是这个。我早看出你那只小酒窝里藏着点心事。我可不是霸着食槽、不让别人来吃的狗。我是世上最幸福的人。乔结婚那天，我跳起舞来，心一定和脚一样轻。我的宝贝，你还不信吗？
        - id: ch01-b42
          speaker: narrator
          text: 艾米抬眼望着他，终于从他的神情里得到了答案。那一点小小的妒意从此再也没有回来。她的脸上尽是爱与信任，轻轻向他道谢。两个人挽着手，在长长的客厅里来回散步。这是他们喜欢做的事，因为走起来，就会想起从前城堡里的花园。
        - id: ch01-b43
          speaker: laurie
          text: 我真想替那位了不起的老教授做点什么。要不，我们替他编出一个有钱亲戚？让那人识趣地死在德国，留给教授一笔像样的钱。
        - id: ch01-b44
          speaker: amy
          text: 乔一定会发现，把事情全搅黄。教授原来什么样，她就为他什么样而骄傲，教授对她也是一样。她昨天还说，贫穷很美呢。
        - id: ch01-b45
          speaker: laurie
          text: 愿上帝保佑她那颗可爱的心！等她要养一个写书的丈夫，再加上一打男男女女的小教授，她就不会这么说了。现在我们别插手，等机会来了，再不管他们乐不乐意，悄悄帮他们一把。乔也教过我不少东西。她相信欠下的债得好好还清，我就拿这个理由说服她。
        - id: ch01-b46
          speaker: amy
          text: 能帮助别人，真是件快乐的事。拥有可以随意帮助人的力量，一直是我的梦想。多亏了你，现在我终于能做到。
        - id: ch01-b47
          speaker: laurie
          text: 我们会做许多好事的。有一种穷人，我特别愿意帮。真正的乞丐总有人照料，可落难的体面人日子最难。他们不肯开口，别人又不敢随便施舍。其实只要做得周到，不伤他们的自尊，帮助的法子多得很。我宁愿帮一位潦倒的绅士，也不大愿意管满口奉承的乞丐。这想法也许不对，可我就是这样，哪怕前一件事难得多。
        - id: ch01-b48
          speaker: amy
          text: 因为这种事，也得由一位真正的绅士来做。
        - id: ch01-b49
          speaker: narrator
          text: 家庭互相赞美会的另一位会员，又及时替丈夫送上了一句恭维。
        - id: ch01-b50
          speaker: laurie
          text: 谢谢，只怕我配不上这么好听的夸奖。我在国外闲荡的时候，见过不少有才华的年轻人。他们为了实现梦想，什么都肯牺牲，也真的吃了许多苦。有些人穷得没有一个朋友，却还像英雄一样工作，满身都是勇气、耐心和抱负。看着他们，我真替自己惭愧，只想好好推他们一把。要是他们真有天赋，能替他们添一把柴，不让才华因为日子过不下去而埋没，也不让梦想迟迟无法实现，那是我们的荣幸。要是后来发现没有天赋，也可以安慰他们，别让这些可怜人绝望。
        - id: ch01-b51
          speaker: amy
          text: 还有一类人也开不了口，只能默默受苦。我懂那是什么滋味。在你把我变成公主以前，我也曾是其中一个，就像老故事里国王娶了乞丐姑娘。有抱负的女孩很不容易，劳里。有时只差紧要关头的一点帮助，她们的青春、健康和珍贵的机会就全过去了。许多人都帮助过我。以后只要看到别的女孩像我们从前那样苦苦支撑，我也想把手伸给她们。
        - id: ch01-b52
          speaker: narrator
          text: 劳里听得热血沸腾，当即打定主意，要创办一所机构，捐钱供它长久办下去，专门帮助那些有艺术志向的年轻女子。
        - id: ch01-b53
          speaker: laurie
          text: 你当然要这么做，你就是个天使！有钱人没资格只坐着享受，也不该让钱越积越多，最后留给别人糟蹋。死后留下遗产，哪里比得上活着时就把钱用好？既能亲眼看见别人快乐，自己也能享受这份快乐。我们照样好好过日子，再把自己的乐趣大大方方分给别人。你愿意做个小多加吗？提着装满慰藉的篮子到处走，送空了，再用善行把它装满。
        - id: ch01-b54
          speaker: amy
          text: 我全心愿意。只要你也做勇敢的圣马丁，威风地骑马走过世界时，肯停下来，把斗篷分给路边的乞丐。
        - id: ch01-b55
          speaker: laurie
          text: 一言为定。最后占便宜的一定是我们！
          emotion: happy
        - id: ch01-b56
          speaker: narrator
          text: 年轻夫妇握手定下约定，又幸福地并肩走了起来。他们盼着让别人的家亮一些，于是自己的家也显得更像一个温暖的归宿。他们相信，替别人的双脚把坎坷的路铺平，自己便能在前方开满鲜花的路上走得更端正。他们的爱温柔地惦记着那些不如自己幸运的人，也因此把两颗心连得更紧。
