audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带含蓄的机智
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    jo:
      display_name: 乔
      tts:
        delivery: 爽朗敏捷，俏皮中带着真情
        timbre: 清脆而略带沙哑的青年女声
        pace: 明快利落
        pitch: 中音
    marmee:
      display_name: 马奇太太
      tts:
        delivery: 慈爱安详，担忧时仍温和克制
        timbre: 温暖沉静的成年女声
        pace: 平稳舒缓
        pitch: 中音偏低
    mr_bhaer:
      display_name: 贝尔先生
      tts:
        delivery: 诚恳浑厚，对孩子温柔而幽默
        timbre: 洪亮温暖的成年男声
        pace: 沉稳自然
        pitch: 低音
    older_gentleman:
      display_name: 老先生
      tts:
        delivery: 威严拘谨，礼貌中透着不悦
        timbre: 厚实清楚的老年男声
        pace: 稍慢而简短
        pitch: 低音
    shopkeeper:
      display_name: 店员
      tts:
        delivery: 殷勤世故，措辞周到
        timbre: 清晰平和的成年男声
        pace: 从容自然
        pitch: 中音
  chapters:
    - id: ch01
      title: 等待与出门
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 劳里和艾米在铺着天鹅绒地毯的屋里安顿新家，边走边商量未来。贝尔先生和乔也常常散步，只是他们脚下是泥路和湿田野，情形大不一样。
        - id: ch01-b02
          speaker: jo
          text: 我本来就习惯傍晚出去走走。总不能因为恰好碰见教授，我就连这个习惯也改掉吧。
        - id: ch01-b03
          speaker: narrator
          text: 接连巧遇两三次后，乔这样说服自己。去梅格家明明有两条路，可无论她走哪条，去时或回来时总会遇见教授。他起先走得很快，直到离乔很近，才像一双近视眼刚刚认出她。若乔正去梅格家，他必定给孩子们带点东西。若乔正在回家，他就说自己下去看了河，现在也该回去了，除非马奇一家已经嫌他来得太勤。
        - id: ch01-b04
          speaker: narrator
          text: 乔还能怎么办呢？自然只能客客气气地请他进屋。就算她厌烦这些拜访，也一点看不出来。她甚至总记得晚饭要备咖啡，因为弗里德里希，不，是贝尔先生，不喝茶。
        - id: ch01-b05
          speaker: narrator
          text: 到了第二个星期，全家都看懂了，却一齐装作没看见乔的变化。没人问她为什么做事时唱起歌来，为什么一天梳三次头，也没人问她傍晚散步回来，脸色为何这样红润。贝尔教授同父亲谈哲学时，也在教女儿恋爱的功课，这一点，大家更是丝毫没有表示怀疑。
        - id: ch01-b06
          speaker: narrator
          text: 乔连丢掉一颗心也做不到端庄从容。她板起脸想压住感情，偏偏怎么也压不住，日子便过得不大安宁。她从前把独立说得那么响亮，如今真要投降，最怕别人取笑，尤其怕劳里笑她。幸好劳里受新管家调教，规矩得无可挑剔。他不在人前管教授叫“了不起的老伙计”，不说乔变漂亮了，也不为几乎每晚都在马奇家看见那顶帽子露出惊讶。不过他私下得意极了，只盼有一天送乔一件银器，上面刻只熊和一根粗木杖，给她当家徽。
        - id: ch01-b07
          speaker: narrator
          text: 教授像个守时的恋人，连续来了两星期。随后，他整整三天没露面，也没捎来消息。全家都严肃起来。乔先是心事重重，后来顾不上什么浪漫，脾气坏得厉害。
        - id: ch01-b08
          speaker: jo
          text: 他一定是厌烦了，又像来时那样突然回家去了。当然，这跟我没有关系。可他至少也该有点礼貌，来和我们道别呀。
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: 一个阴沉的下午，乔穿戴好准备照常散步，绝望地朝大门望去。
        - id: ch01-b10
          speaker: marmee
          text: 亲爱的，把那把小伞带上吧。看样子快下雨了。
        - id: ch01-b11
          speaker: jo
          text: 好的，妈妈。你要我从城里捎什么吗？我得去买些纸。
        - id: ch01-b12
          speaker: narrator
          text: 乔站在镜前，重新系下巴底下的蝴蝶结，好避开母亲的目光。
        - id: ch01-b13
          speaker: marmee
          text: 买一块斜纹西里西亚布，一包九号针，再带两码窄窄的淡紫色缎带。厚靴子穿了吗？斗篷里面够不够暖？
        - id: ch01-b14
          speaker: jo
          text: 大概都穿了吧。
        - id: ch01-b15
          speaker: marmee
          text: 要是正巧碰见贝尔先生，就请他回家喝茶。我真想见见这个可亲的人。
        - id: ch01-b16
          speaker: narrator
          text: 乔听见了，只亲了亲母亲，什么也没回答，便快步出了门。她心里虽然难受，仍涌起一阵感激。妈妈待她这样好，那些没有母亲陪着渡过难关的姑娘，又该怎么办呢？
        - id: ch01-b17
          speaker: narrator
          text: 布店并不在账房、银行和批发货栈扎堆的街区，那里几乎全是男人来往。可乔一件差事还没办，人已经到了那一带。她慢吞吞地走，像在等什么人，还装出对工程仪器和羊毛样品很有兴趣的样子，一扇扇橱窗看过去。她被木桶绊得踉跄，差点让从楼上放下的大包货物罩住，又被忙碌的男人推来挤去。那些人脸上仿佛都写着一句话：她到底跑到这里来干什么？
        - id: ch01-b18
          speaker: narrator
          text: 一滴雨落在乔脸上，这才把她从落空的希望里叫醒。雨点很快密起来，深红蝴蝶结已经染上黑斑。她的心是救不回来了，帽子也许还能救。可她出门太急，竟把小伞忘在了家里。现在不是借伞，就是淋透。她抬头看看阴沉的天，低头看看蝴蝶结，又望向泥泞的长街，最后回头盯着一家肮脏的货栈。门上写着“霍夫曼、斯沃茨公司”。
        - id: ch01-b19
          speaker: jo
          text: 活该！谁叫你穿上最好的衣裳，跑来这里晃荡，只盼着碰见教授？乔，我真替你害臊。你不许进去借伞，也不许向他的朋友打听他。冒着雨把差事办完吧。就算病倒，就算毁了帽子，也是你应得的。快走！
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: 她冲过街去，差点被一辆货车碾着，又一头撞进一位威严的老先生怀里。
        - id: ch01-b21
          speaker: older_gentleman
          text: 太太，对不起。
        - id: ch01-b22
          speaker: narrator
          text: 老先生嘴上道歉，神色却像受了天大的冒犯。乔的气势顿时矮了几分。她站稳，把手帕盖在注定要牺牲的缎带上，硬是把诱惑留在身后，匆匆往前走。脚踝越来越湿，头顶的雨伞又碰来撞去。忽然，一把旧蓝伞停在她毫无遮蔽的帽子上方。乔抬起头，正看见贝尔先生低头望着她。
    - id: ch02
      title: 雨中重逢
      blocks:
        - id: ch02-b01
          speaker: mr_bhaer
          text: 这位意志坚强的小姐，我好像认识。她敢从那么多马鼻子底下穿过去，还能在泥里走得飞快。我的朋友，你到这里来做什么？
        - id: ch02-b02
          speaker: jo
          text: 买东西。
        - id: ch02-b03
          speaker: narrator
          text: 贝尔先生看看一边的腌菜厂，又看看另一边的皮毛批发行，笑了，却没有拆穿她。
        - id: ch02-b04
          speaker: mr_bhaer
          text: 你没带伞。我陪你去吧，也替你拿包裹，好吗？
        - id: ch02-b05
          speaker: jo
          text: 好，谢谢你。
        - id: ch02-b06
          speaker: narrator
          text: 乔的脸红得和缎带一样。她顾不得教授会怎么想，转眼已经挽住他的手臂。太阳仿佛忽然亮得出奇，世上的事也全都回到了正地方。这一天，有一个幸福极了的女人踩着满街积水往前走。
        - id: ch02-b07
          speaker: jo
          text: 我们还以为你已经走了。
        - id: ch02-b08
          speaker: narrator
          text: 乔知道教授正看着她，赶紧开口。帽檐太小，遮不住她的脸，她怕那份喜悦显得太不矜持。
        - id: ch02-b09
          speaker: mr_bhaer
          text: 你真觉得，我会不向待我这样好的人告别，就这么走掉吗？
        - id: ch02-b10
          speaker: narrator
          text: 那责备的语气让乔觉得自己伤了他，她连忙认真解释。
        - id: ch02-b11
          speaker: jo
          text: 不，我不是这么想的。我知道你有事忙。只是我们都很想你，尤其是爸爸和妈妈。
        - id: ch02-b12
          speaker: mr_bhaer
          text: 那你呢？
        - id: ch02-b13
          speaker: jo
          text: 我见到你总是很高兴，先生。
        - id: ch02-b14
          speaker: narrator
          text: 她太用力地压住声音，听上去反而冷淡。最后那声“先生”更像一阵寒气，把教授的笑容冻没了。
        - id: ch02-b15
          speaker: mr_bhaer
          text: 谢谢你。我离开以前，还会再来看你们一次。
        - id: ch02-b16
          speaker: jo
          text: 这么说，你真的要走？
          emotion: surprised
        - id: ch02-b17
          speaker: mr_bhaer
          text: 我在这里的事都办完了。
        - id: ch02-b18
          speaker: jo
          text: 办得还顺利吗？但愿是顺利的。
        - id: ch02-b19
          speaker: narrator
          text: 乔听出那简短的回答里有股失望的苦味。
        - id: ch02-b20
          speaker: mr_bhaer
          text: 应当算顺利吧。我已经找到一条路，能养活自己，也能多帮帮我的两个小伙子。
        - id: ch02-b21
          speaker: jo
          text: 快告诉我吧！那些……那些孩子的事，我都愿意听。
        - id: ch02-b22
          speaker: mr_bhaer
          text: 你真好。朋友替我在一所学院找到了教职。我可以像在故乡那样教书，收入也够让弗朗茨和埃米尔往后的路好走些。我该感激，不是吗？
        - id: ch02-b23
          speaker: jo
          text: 当然！你可以做喜欢的事，我们也能常见到你，还有那两个孩子。这不是太好了吗？
          emotion: happy
        - id: ch02-b24
          speaker: narrator
          text: 乔紧紧抓住两个孩子当借口，好遮住自己藏不住的欢喜。
        - id: ch02-b25
          speaker: mr_bhaer
          text: 唉，恐怕不能常见。那所学院在西部。
        - id: ch02-b26
          speaker: jo
          text: 那么远！
          emotion: sad
        - id: ch02-b27
          speaker: narrator
          text: 乔再也顾不上裙摆，也顾不上自己会淋成什么样。贝尔先生读得懂好几种文字，却还不懂女人。他以为自己很了解乔，可这半小时里的种种矛盾，叫他完全摸不着头脑。她见到他时满脸意外，却又像本来就是来找他的。她挽上他的手臂时，眼里的神情让他欢喜。可他问她想不想自己，她又答得拘谨冰冷，使他跌进绝望。听到他的好运，她高兴得几乎拍手，难道只是为了两个孩子？等他说要去西部，她那声“那么远”又把他送上希望的顶峰。可下一刻，乔只顾正事的一句话，又把他推了下去。
        - id: ch02-b28
          speaker: jo
          text: 我要买东西的店到了。你愿意进去吗？不会耽搁很久。
    - id: ch03
      title: 采买与误会
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 乔一向为自己会买东西而得意，很想叫同行的人见识她办事多么利落。偏偏今天心神全乱了。她碰翻一盘针，布都裁下来了才想起要买的是斜纹西里西亚布，又找错零钱，还跑到印花棉布柜台去买淡紫缎带，窘得满脸通红。贝尔先生站在旁边，看着她脸红，看着她出错，心里的疑团倒一点点散开。他终于明白，有时女人像梦，真正的意思得倒过来解。
        - id: ch03-b02
          speaker: narrator
          text: 两人走出店门，教授把包裹夹在腋下，神情开朗了许多。他踩着水洼往前走，似乎觉得这场雨总的说来还很不错。走到摆满鲜花和水果的橱窗前，他停了下来。
        - id: ch03-b03
          speaker: mr_bhaer
          text: 我们是不是也该给孩子们买点东西？如果今晚是我最后一次去你们那个可爱的家，就办一场告别宴吧。
        - id: ch03-b04
          speaker: jo
          text: 买什么呢？
        - id: ch03-b05
          speaker: narrator
          text: 乔假装没听见后半句，走进店里，还故意闻着四周混在一起的香气，像是陶醉极了。
        - id: ch03-b06
          speaker: mr_bhaer
          text: 给孩子们买橙子和无花果，可以吗？
        - id: ch03-b07
          speaker: jo
          text: 只要是吃的，他们都吃。
        - id: ch03-b08
          speaker: mr_bhaer
          text: 你喜欢坚果吗？
        - id: ch03-b09
          speaker: jo
          text: 喜欢得像只松鼠。
        - id: ch03-b10
          speaker: mr_bhaer
          text: 再来些汉堡葡萄。对，我们拿它向祖国祝酒，好不好？
        - id: ch03-b11
          speaker: jo
          text: 那何不再买一篓椰枣、一桶葡萄干和一袋杏仁，干脆一次花个痛快？
        - id: ch03-b12
          speaker: narrator
          text: 乔摆出不赞成的脸色。贝尔先生索性没收她的钱袋，自己付钱，买了好几磅葡萄、一盆粉红雏菊和一只漂亮的蜂蜜罐，权当一大坛酒。他把纸包一个个塞进口袋，挤得衣服全变了形，又把花盆交给乔，撑开旧伞，重新上路。
        - id: ch03-b13
          speaker: narrator
          text: 在湿路上走过半个街区，教授终于开了口。
        - id: ch03-b14
          speaker: mr_bhaer
          text: 马奇小姐，我有一件很要紧的事想请你帮忙。
        - id: ch03-b15
          speaker: jo
          text: 什么事，先生？
        - id: ch03-b16
          speaker: narrator
          text: 乔的心猛跳起来，唯恐连他也听得见。
        - id: ch03-b17
          speaker: mr_bhaer
          text: 虽然正在下雨，我也得大胆说了，因为留给我的时间不多。
        - id: ch03-b18
          speaker: jo
          text: 请说吧，先生。
        - id: ch03-b19
          speaker: narrator
          text: 她忽然攥紧花盆，险些把小小的盆捏碎。
        - id: ch03-b20
          speaker: mr_bhaer
          text: 我想给我的蒂娜买条小裙子，可我太笨，自己不会挑。你肯替我拿拿主意吗？
        - id: ch03-b21
          speaker: jo
          text: 好的，先生。
        - id: ch03-b22
          speaker: narrator
          text: 乔一下安静下来，浑身冰凉，像一步踏进了冰柜。
        - id: ch03-b23
          speaker: mr_bhaer
          text: 也许还该给蒂娜的母亲买条披肩。她很穷，病得又重，丈夫还总叫她操心。对，朋友该送这位小母亲一条厚实暖和的披肩。
        - id: ch03-b24
          speaker: jo
          text: 我很愿意帮忙，贝尔先生。
        - id: ch03-b25
          speaker: narrator
          text: 乔心里却在说，自己陷得太快了，这个人每过一分钟都更可爱。她在心里狠狠摇了摇自己，随即振作起来办正事，那股认真劲儿看着实在动人。
        - id: ch03-b26
          speaker: narrator
          text: 教授让乔全权做主。乔给蒂娜挑了条漂亮裙子，又请店员拿出披肩。店员是个已婚男人，便很有兴致地打量这对客人，看他们像在替自家人采买。
        - id: ch03-b27
          speaker: shopkeeper
          text: 您太太也许会喜欢这一条。料子好，颜色也合适，素雅又体面。
        - id: ch03-b28
          speaker: narrator
          text: 店员抖开一条厚实的灰披肩，披到乔肩上。乔赶忙背过身，庆幸终于能藏住脸。
        - id: ch03-b29
          speaker: jo
          text: 这一条合适吗，贝尔先生？
        - id: ch03-b30
          speaker: mr_bhaer
          text: 再合适不过。就买这条。
        - id: ch03-b31
          speaker: narrator
          text: 教授付钱时暗暗微笑。乔却像个改不了的淘便宜货能手，还在柜台上翻找不停。
        - id: ch03-b32
          speaker: mr_bhaer
          text: 现在，我们回家好吗？
        - id: ch03-b33
          speaker: narrator
          text: “回家”这两个字，仿佛叫他说得格外甜。
        - id: ch03-b34
          speaker: jo
          text: 好，天晚了，我也实在累了。
          emotion: sad
        - id: ch03-b35
          speaker: narrator
          text: 乔的声音比她自己知道的更凄楚。刚刚露面的太阳又沉了，世界重新变得泥泞凄惨。她这才发现脚冷，头也疼，可心比脚更冷，比头更痛。教授要走了，他只当她是朋友，一切不过是误会。越早结束越好。她慌忙向驶近的公共马车招手，动作太急，雏菊从盆里飞出去，摔得七零八落。
        - id: ch03-b36
          speaker: mr_bhaer
          text: 这不是我们要坐的车。
        - id: ch03-b37
          speaker: narrator
          text: 教授挥手让挤满乘客的车过去，又弯腰捡起那些可怜的小花。
        - id: ch03-b38
          speaker: jo
          text: 对不起，我没看清车名。不要紧，我能走。我早就走惯泥路了。
          emotion: sad
        - id: ch03-b39
          speaker: narrator
          text: 乔使劲眨眼。她宁可死，也不肯明着擦泪。可她虽转开脸，贝尔先生还是看见了她颊上的水滴。那一幕深深触动了他。他忽然俯下身，声音里满是深意。
    - id: ch04
      title: 伞下求婚
      blocks:
        - id: ch04-b01
          speaker: mr_bhaer
          text: 我心上最亲爱的人，你为什么哭？
        - id: ch04-b02
          speaker: narrator
          text: 若乔有过一次这样的经历，她或许会说自己没哭，只是着凉了，再找个合适的小谎遮过去。可她从不把体面放在心上，偏偏压不住一声呜咽。
        - id: ch04-b03
          speaker: jo
          text: 因为你要走了。
          emotion: sad
        - id: ch04-b04
          speaker: mr_bhaer
          text: 啊，我的上帝，这可太好了！
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: 教授一手撑伞，一手抱着包裹，还是想办法把双手合到了一起。
        - id: ch04-b06
          speaker: mr_bhaer
          text: 乔，我能给你的只有满腔的爱。我这次来，就是想知道你会不会把它当作珍宝。我一直等着，想确定你待我不只是朋友。是这样吗？你的心里，能不能给老弗里茨留一点地方？
        - id: ch04-b07
          speaker: narrator
          text: 这一大串话，他一口气说了出来。
        - id: ch04-b08
          speaker: jo
          text: 啊，能！
          emotion: happy
        - id: ch04-b09
          speaker: narrator
          text: 这个答案已经让他完全满足。乔双手抱住他的手臂，仰起脸望着他。那神情说得明明白白，只要是他撑着这把旧伞，哪怕再没有别的遮蔽，她也愿意同他并肩走过一生。
        - id: ch04-b10
          speaker: narrator
          text: 这场求婚实在困难。满地泥水，教授想跪也跪不下去。他两手都占着，除了打个比方，也没法把自己的手交给乔。大街上又不能尽情说温存的话，虽然他几乎已经说尽了。所以，他只能用眼睛表达狂喜。那目光照亮了他的脸，连胡须上的雨珠里都像闪着一道道小彩虹。
        - id: ch04-b11
          speaker: narrator
          text: 要不是深爱乔，他绝不会这样看她。乔这时实在谈不上漂亮。裙摆糟透了，橡胶靴一直脏到脚踝，帽子也彻底毁了。幸好教授认定她是世上最美的女人。乔也觉得他比任何时候都更像朱庇特，尽管他的帽檐软塌塌的，细水不断流到肩上。他把整把伞都偏向乔，连那双手套也旧得每根手指都该补了。
        - id: ch04-b12
          speaker: narrator
          text: 路人多半以为，他们是一对无害的疯子。他们忘了招呼公共马车，只管慢慢向前，连天色越来越暗、雾越来越浓也没察觉。两个人正享受一生难得一次的幸福，哪里还会在意旁人的眼光？那神奇的一刻，会叫老人年轻，叫平凡的人美丽，叫穷人富足，也让凡人的心先尝到一点天堂的滋味。
        - id: ch04-b13
          speaker: narrator
          text: 教授像刚刚赢得一个王国，再没有别的幸福能给他。乔陪他踩着泥走，只觉得自己的位置原本就在这里，甚至不懂从前为何还选过别的命运。当然，还是乔先开口。她那声“啊，能”之后，还说了许多激动而零乱的话，只是没有办法一一记下。
        - id: ch04-b14
          speaker: jo
          text: 弗里德里希，你为什么不……
        - id: ch04-b15
          speaker: mr_bhaer
          text: 啊，天哪！自从明娜去世，再没有人这样叫过我了！
          emotion: surprised
        - id: ch04-b16
          speaker: narrator
          text: 教授站在一个水洼里不走了，满怀感激与欢喜地看着她。
        - id: ch04-b17
          speaker: jo
          text: 我心里一直这样叫你。我一时忘了……要是你不喜欢，我以后不叫就是了。
        - id: ch04-b18
          speaker: mr_bhaer
          text: 不喜欢？这个名字有多甜，我根本说不出来。以后也要对我用亲密的“你”。那样我就承认，你们的语言差不多和我的一样美。
        - id: ch04-b19
          speaker: jo
          text: 那种亲密的“你”，会不会有点多愁善感？
        - id: ch04-b20
          speaker: narrator
          text: 她嘴上这样问，心里却觉得这个字可爱极了。
        - id: ch04-b21
          speaker: mr_bhaer
          text: 多愁善感？是啊。感谢上帝，我们德国人相信感情，所以永远不会老。你们英语里普通的“你”太冷。用亲密的“你”叫我吧，我心上最亲爱的人。它对我很重要。
        - id: ch04-b22
          speaker: narrator
          text: 这一刻，贝尔先生不再像一位严肃教授，倒像个浪漫的学生。
        - id: ch04-b23
          speaker: jo
          text: 那么，你怎么不早点把这些话告诉我？
        - id: ch04-b24
          speaker: narrator
          text: 乔有些害羞地问。
        - id: ch04-b25
          speaker: mr_bhaer
          text: 现在我得把整颗心都给你看。我很乐意，因为往后它要交给你照管。听我说，我的乔，这个小名字真亲爱，也真有趣！在纽约向你告别的那天，我本想开口，可我以为那位英俊的朋友已经同你订婚，就什么也没说。那时我要是说了，你会答应吗？
        - id: ch04-b26
          speaker: jo
          text: 我不知道。大概不会吧，因为那时候我根本没有心。
        - id: ch04-b27
          speaker: mr_bhaer
          text: 呸，我不信。你的心只是睡着了，等童话里的王子穿过森林去唤醒它。唉，都说初恋最好，可我不该奢望得到它。
        - id: ch04-b28
          speaker: jo
          text: 不错，初恋最好。不过你放心，我从没爱过别人。泰迪那时只是个男孩，很快就走出了那一点迷恋。
        - id: ch04-b29
          speaker: narrator
          text: 乔赶忙把教授的误会解释清楚。
        - id: ch04-b30
          speaker: mr_bhaer
          text: 好！这下我安心了，知道你给我的是全部。我等得太久，已经变得很自私。以后你会发现的，教授夫人。
        - id: ch04-b31
          speaker: jo
          text: 我喜欢这个称呼！现在告诉我，究竟是什么把你带来了？还恰好是在我最需要你的时候。
          emotion: happy
        - id: ch04-b32
          speaker: mr_bhaer
          text: 是这个。
        - id: ch04-b33
          speaker: narrator
          text: 贝尔先生从背心口袋里掏出一张磨旧的小纸片。乔打开一看，顿时窘得厉害。那是她投给报纸的一首诗。那家报纸肯付诗歌稿酬，所以她偶尔也寄一首去碰碰运气。
        - id: ch04-b34
          speaker: jo
          text: 它怎么会把你带来？
        - id: ch04-b35
          speaker: mr_bhaer
          text: 我偶然看见这首诗，从题目和姓名的首字母认出了你。有一节像是在叫我。你把它读一遍，就会明白。我替你看路，免得你踩进水洼。
    - id: ch05
      title: 阁楼上的诗
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 乔一边走，一边读起那首题为《阁楼上》的诗。
        - id: ch05-b02
          speaker: jo
          text: 四只小箱排成一行，蒙着尘土，也留着岁月的印痕。那是孩子们多年前亲手做的，如今孩子已经长大。四把小钥匙挂在一起，系着鲜亮却已褪色的丝带。那是很久以前一个下雨天，孩子们骄傲地亲手系上的。每个箱盖都刻着一个小名，是一个男孩幼时的手笔。箱子下面，藏着伙伴们在阁楼玩耍的旧日时光。他们偶尔停下来，听头顶屋瓦上传来甜美的叠句，随着夏日的雨水一遍遍落下。
        - id: ch05-b03
          speaker: jo
          text: 第一只箱盖平整端正，上面刻着“梅格”。我满怀爱意地朝里面望去。珍藏叠得整整齐齐，记着她安宁的一生。有温柔女孩收到的礼物，有新娘的礼服，有写给妻子的诗，还有一只小鞋和一绺婴儿的卷发。这里已经没有玩具了。那些玩具年纪大了，全被拿走，陪另一个小梅格重新玩耍。幸福的母亲啊，我知道你听见悠长轻柔的摇篮曲，像甜美的叠句低低回荡，伴着夏日雨水不断落下。
        - id: ch05-b04
          speaker: jo
          text: 第二只箱盖刻着“乔”，上面全是刮痕，里面也堆得乱七八糟。有无头的娃娃，有撕破的课本，还有再也不会说话的鸟兽。那些年轻的脚从仙境带回一件件战利品，也带回没有实现的未来之梦，和依然甜美的往日时光。写了一半的诗，狂野的故事，忽冷忽热的四月书信，任性孩子留下的日记，都泄露了一个女人未老先衰的心。她独自守着寂寞的家，听悲凉的叠句传来：“要配得上爱，爱自会到来。”夏日的雨落满窗台。
        - id: ch05-b05
          speaker: jo
          text: 我的贝丝，刻着你名字的箱盖总被擦得干干净净，像流过泪的眼睛来看过，也像有一双细心的手常来抚摸。死亡替我们封存了一位圣徒。她身上的凡俗越来越少，神圣越来越多。我们仍温柔而悲伤地把她留下的东西供在家里的神龛。有那只很少再摇响的银铃，有她最后戴过的小帽，有美丽而死去的凯瑟琳，由天使托着，挂在她门楣上方。她曾困在痛苦的牢狱里，却唱着没有怨言的歌。从此，她的歌永远融进夏日雨水淅淅沥沥的声音。
        - id: ch05-b06
          speaker: jo
          text: 最后一只箱盖光洁如镜。如今，那则传说真的变得又美又好。英勇骑士的盾牌上，用金色和蓝色写着“艾米”。箱里有束过她头发的发网，有再不会跳舞的舞鞋，有仔细收好的枯花，有不再轻轻扇动的扇子，也有热烈如火的漂亮情书。那些小东西都曾陪伴少女的希望、恐惧和羞涩，记下她的心。如今她在学习更美、更真的魔法，也听见银色婚礼钟声一遍遍欢快响起，像夏日雨中的叠句。
        - id: ch05-b07
          speaker: jo
          text: 四只小箱仍排成一行，蒙着尘土，留着岁月的痕迹。四个女人受过悲欢祸福的教导，如今正当盛年，懂得劳作，也懂得爱人。四姐妹暂时分开，没有谁失落，只是有一个先走了。不朽的爱把她们连在一起，使她们永远都是彼此最亲近的人。
        - id: ch05-b08
          speaker: jo
          text: 愿我们藏在心里的珍宝，有一天能在天父面前打开。愿箱中装满黄金般的时光，也装满被光照得更美的善行。愿生命勇敢的乐声长久回荡，像振奋灵魂的旋律。愿我们的灵魂欢然展开翅膀，唱着歌，飞进雨后无尽的阳光。
    - id: ch06
      title: 欢迎回家
      blocks:
        - id: ch06-b01
          speaker: jo
          text: 这首诗写得很坏。可那天我实在太寂寞，趴在一袋碎布上大哭了一场，心里确实就是这样。我怎么也没想到，它会跑到一个能泄露秘密的地方去。
        - id: ch06-b02
          speaker: narrator
          text: 乔说着，把教授珍藏了许久的诗撕成碎片。
        - id: ch06-b03
          speaker: mr_bhaer
          text: 让它去吧，它已经完成了自己的使命。等我把那本棕色册子里的小秘密都读完，还会得到一首新诗。
        - id: ch06-b04
          speaker: narrator
          text: 贝尔先生微笑着看纸片随风飞走，接着认真说下去。
        - id: ch06-b05
          speaker: mr_bhaer
          text: 我读完这首诗，心里就想，她正在悲伤，也很孤独，真正的爱也许能安慰她。我有一颗心，里面的爱全是为她存的。为什么不去告诉她呢？我要说，如果这件礼物比我盼望的回报微薄太多，也请你看在上帝的分上，收下它吧。
        - id: ch06-b06
          speaker: jo
          text: 所以你来了，也发现它一点不微薄。它正是我唯一需要的珍宝。
          emotion: happy
        - id: ch06-b07
          speaker: mr_bhaer
          text: 起初我不敢这样想，虽然你给我的欢迎美好得像从天堂来。可不久，我就有了希望。于是我对自己说，哪怕要为她送命，我也要得到她！我一定会！
        - id: ch06-b08
          speaker: narrator
          text: 教授倔强地点着头，仿佛四周合拢的雾墙就是挡在面前的障碍，等着他跨过去，或勇敢地一头撞倒。乔觉得这话棒极了，也决心做一个配得上自己骑士的人，哪怕这位骑士没有华服，也没有骏马。
        - id: ch06-b09
          speaker: narrator
          text: 过了一会儿，乔又忍不住问。能问彼此最贴心的事，再听到叫人欢喜的回答，滋味实在太甜，她根本没法沉默。
        - id: ch06-b10
          speaker: jo
          text: 是什么让你耽搁了这么久？
        - id: ch06-b11
          speaker: mr_bhaer
          text: 这件事不容易。在我还看不到一个能给你的家以前，我实在不忍心把你从那样幸福的家里带走。也许要等很久，也得下很多苦功。我这个可怜的老家伙，除了少许学问，什么也没有，怎么能请你舍弃那么多？
        - id: ch06-b12
          speaker: jo
          text: 我很高兴你穷。我可受不了一个有钱的丈夫。
        - id: ch06-b13
          speaker: narrator
          text: 乔说得斩钉截铁，接着声音又柔和下来。
        - id: ch06-b14
          speaker: jo
          text: 别怕贫穷。我认识它太久，早就不怕了。我能替自己爱的人工作，也会因为这份工作而幸福。你也别说自己老。四十岁正是好年纪。哪怕你已经七十岁，我也还是忍不住会爱你！
          emotion: happy
        - id: ch06-b15
          speaker: narrator
          text: 教授感动得想掏手帕，可两只手都腾不出来。乔便替他擦了擦眼睛，又笑着接过一两个包裹。
        - id: ch06-b16
          speaker: jo
          text: 我也许是个意志坚强的女人，可现在谁也不能说我做了不合女性本分的事。人们不是总说，替别人擦眼泪、分担重担，正是女人特别的使命吗？我要担起自己那一份，弗里德里希，也要和你一起挣钱养家。你必须答应，不然我绝不跟你走。
        - id: ch06-b17
          speaker: narrator
          text: 教授想把包裹拿回去，乔立刻坚决地补上最后那句话。
        - id: ch06-b18
          speaker: mr_bhaer
          text: 那就走着瞧吧。乔，你能耐心等很久吗？我必须离开，一个人去做我的工作。我还得先照顾那两个孩子，因为就算为了你，我也不能背弃对明娜的承诺。你能原谅我吗？在我们抱着希望等待的时候，你还能幸福吗？
        - id: ch06-b19
          speaker: jo
          text: 能，我知道我能。我们彼此相爱，别的事就都容易承受了。我也有自己的责任和工作。哪怕为了你，若把它们丢下，我也不会快乐。所以不用着急，也不用烦恼。你在西部尽你的责任，我在这里尽我的责任。我们都怀着最好的希望，好好过日子，把将来交给上帝安排。
          emotion: calm
        - id: ch06-b20
          speaker: mr_bhaer
          text: 啊！你给了我这么多希望和勇气，可我能回报你的，只有满满一颗心，还有这双空手。
        - id: ch06-b21
          speaker: narrator
          text: 教授激动得几乎控制不住自己。乔却永远也学不会守规矩。他们已经站在家门前的台阶上。听见这句话，她直接把两只手放进他的手里，温柔地低声回答。
        - id: ch06-b22
          speaker: jo
          text: 现在不空了。
          emotion: happy
        - id: ch06-b23
          speaker: narrator
          text: 随后，她俯下身，在伞下亲吻了她的弗里德里希。这举动可真大胆。可哪怕篱笆上那群湿着尾巴的麻雀全是人，她也照样会这样做。她爱得太深，除了自己的幸福，已经什么都不在乎。
        - id: ch06-b24
          speaker: narrator
          text: 这个时刻来得如此朴素，却是他们一生中最崇高的时刻。他们从黑夜、风雨与孤独中转过身，朝正等待他们的灯火、温暖与安宁走去。
        - id: ch06-b25
          speaker: jo
          text: 欢迎回家。
          emotion: happy
        - id: ch06-b26
          speaker: narrator
          text: 乔欢欢喜喜地领着恋人进了屋，关上了门。
