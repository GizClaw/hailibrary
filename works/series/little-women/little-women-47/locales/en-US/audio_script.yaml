          speaker: jo
          text: It's very bad poetry, but I meant it when I wrote it. I was lonely that day and had a good cry over a bag of rags. I never imagined it would travel off and tell my secrets.
        - id: ch01-b129
          speaker: narrator
          text: Jo tore up the verses Bhaer had kept for so long.
        - id: ch01-b130
          speaker: mr_bhaer
          text: Let it go. It has done its work. I will have a new copy when I read the whole brown book where she keeps her little secrets.
        - id: ch01-b131
          speaker: narrator
          text: He smiled as the scraps flew away in the wind. Then he grew earnest.
        - id: ch01-b132
          speaker: mr_bhaer
          text: I read that poem and thought, "She carries sorrow. She is lonely. True love might comfort her." My heart was full of love for her. So why should I not come and say, "If this is not too poor a gift for all I hope to receive, take it in God's name"?
        - id: ch01-b133
          speaker: jo
          text: So you came to learn that it wasn't poor at all. It was the one precious thing I needed.
          emotion: happy
        - id: ch01-b134
          speaker: mr_bhaer
          text: At first I did not dare believe that, even after your wonderful welcome. But I soon began to hope. Then I told myself, "I will have her if I die for it!" And I will!
        - id: ch01-b135
          speaker: narrator
          text: He gave a defiant nod, as if the walls of mist around them were barriers he meant to climb over or knock down. Jo thought it was splendid. She promised herself she would be worthy of her knight, even if he had not arrived on a splendid horse in shining clothes.
        - id: ch01-b136
          speaker: jo
          text: Why did you stay away for so long?
        - id: ch01-b137
          speaker: narrator
          text: It was so pleasant to ask private questions and receive delightful answers that Jo could not stay quiet.
        - id: ch01-b138
          speaker: mr_bhaer
          text: Staying away was hard. But I could not ask you to leave such a happy home until I had some hope of giving you one, even if it took years and much work. How could I ask you to give up so much for a poor old man whose only fortune is a little learning?
        - id: ch01-b139
          speaker: jo
          text: I'm glad you're poor. I couldn't stand a rich husband. And don't be afraid of poverty. I've known it long enough that it no longer frightens me. I can be happy working for the people I love. Don't call yourself old either. Forty is the best time of life. I couldn't help loving you if you were seventy!
        - id: ch01-b140
          speaker: narrator
          text: The Professor was so touched that he wanted his handkerchief. He could not reach it, so Jo wiped his eyes for him. Laughing, she took a package or two from his arms.
        - id: ch01-b141
          speaker: jo
          text: I may be strong-minded, but nobody can say I'm outside a woman's proper place now. People claim our special work is drying tears and carrying burdens. I'm carrying my share, Friedrich, and I'll help earn our home too. You must accept that, or I won't come at all.
        - id: ch01-b142
          speaker: narrator
          text: She spoke firmly when he tried to take back the packages.
        - id: ch01-b143
          speaker: mr_bhaer
          text: We shall see. Can you wait patiently for a long time, Jo? I must go away and do my work alone. I must help my boys first. Even for you, I cannot break my promise to Minna. Can you forgive that and be happy while we wait and hope?
        - id: ch01-b144
          speaker: jo
          text: Yes, I know I can. We love each other, and that makes everything else easier to bear. I have duties and work too. I couldn't be happy if I neglected them, even for you, so we don't need to hurry or grow impatient. You can do your part out West, and I'll do mine here. We'll both be happy, hope for the best, and leave the future in God's hands.
          emotion: calm
        - id: ch01-b145
          speaker: mr_bhaer
          text: Ah! Thou givest me such hope and courage. I have nothing to offer in return but a full heart and these empty hands.
        - id: ch01-b146
          speaker: narrator
          text: The Professor was overcome. Jo would never learn to behave properly. As they stood on the steps, she placed both hands in his.
        - id: ch01-b147
          speaker: jo
          text: Not empty now.
        - id: ch01-b148
          speaker: narrator
          text: She bent and kissed her Friedrich beneath the umbrella. It was shocking, but she would have done it even if the whole flock of wet, ragged sparrows on the hedge had been human witnesses. Jo was very far gone indeed. She had become too deeply in love to care about anything in that moment except her own happiness.
        - id: ch01-b149
          speaker: narrator
          text: Their happiness had come in a very simple form, but this was the crowning moment of both their lives. Together they turned away from the night, the storm, and the loneliness. Ahead of them waited the household light, warmth, and peace, all ready to receive them with a glad cry of "Welcome home!"
        - id: ch01-b150
          speaker: narrator
          text: With that joyful welcome waiting for them, Jo led her beloved inside and shut the door.
