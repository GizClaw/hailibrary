  chapters:
    - id: ch01
      title: CHAPTER FORTY-SIX UNDER THE UMBRELLA
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: While Laurie and Amy walked over velvet carpets, arranging their home and planning a happy future, Jo and Professor Bhaer took very different walks together. Their paths ran along muddy roads and soaked fields.
        - id: ch01-b02
          speaker: jo
          text: I always walk toward evening. Why should I stop just because I happen to meet the Professor when he goes out?
        - id: ch01-b03
          speaker: narrator
          text: Jo told herself this after two or three such meetings. Two roads led to Meg's house, but whichever one Jo chose, she always met him, either going there or coming back. He was always walking quickly and never seemed to notice her until they were close. Then he would look as if his nearsighted eyes had only that moment recognized the approaching lady. If Jo was going to Meg's, he always happened to have something for the babies. If she was headed home, he explained that he had merely walked down to see the river and was now returning, unless the Marches had grown tired of his frequent visits.
        - id: ch01-b04
          speaker: narrator
          text: Under those circumstances, what could Jo do but greet him politely and invite him inside? If she had grown tired of seeing him, she hid that weariness with perfect skill. She also took special care to have coffee served at supper. Friedrich did not like tea, she explained to herself, hastily correcting the name in her thoughts to Mr. Bhaer.
        - id: ch01-b05
          speaker: narrator
          text: By the second week, everyone understood exactly what was happening. Still, they all tried to look completely blind to the changes in Jo's face. Nobody asked why she sang while she worked, fixed her hair three times a day, or grew so bright and blooming after her evening exercise. And nobody appeared to have the faintest suspicion that while Professor Bhaer discussed philosophy with her father, he was quietly giving the daughter lessons in love.
        - id: ch01-b06
          speaker: narrator
          text: Jo could not even lose her heart in a graceful, proper way. She fought her feelings with all her strength. When she could not put them out, she lived in a state of constant excitement. After all her fierce speeches about independence, she was terrified people would laugh at her for surrendering. Laurie worried her most. But under Amy's new management, he behaved beautifully. In public, he never called Bhaer a fine old fellow. He never mentioned Jo's prettier looks or acted surprised when the Professor's hat appeared on the Marches' table nearly every evening. In private, though, Laurie celebrated. He could hardly wait for the day when he could give Jo a piece of silver decorated with a bear and a ragged staff for her coat of arms.
        - id: ch01-b07
          speaker: narrator
          text: For two weeks the Professor came and went with the regularity of a lover. Then three full days passed without a visit or a message. Everyone grew serious. Jo became thoughtful at first, and then, sadly for romance, very cross.
        - id: ch01-b08
          speaker: jo
          text: I suppose he's disgusted and has gone home as suddenly as he came. It means nothing to me, of course. Still, a gentleman ought to say goodbye.
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: One gloomy afternoon, she stared hopelessly at the gate and dressed for her usual walk.
        - id: ch01-b10
          speaker: mrs_march
          text: Take the little umbrella, dear. I think it's going to rain.
        - id: ch01-b11
          speaker: narrator
          text: Mrs. March noticed Jo's new bonnet but said nothing about it.
        - id: ch01-b12
          speaker: jo
          text: All right, Marmee. Do you need anything in town? I have to buy some paper.
        - id: ch01-b13
          speaker: narrator
          text: Jo loosened the bow beneath her chin while she faced the mirror. It gave her a reason not to look at her mother.
        - id: ch01-b14
          speaker: mrs_march
          text: Yes. I need twilled silesia, a paper of number-nine needles, and two yards of narrow lavender ribbon. Are you wearing your thick boots? And do you have something warm beneath your cloak?
        - id: ch01-b15
          speaker: jo
          text: I think so.
        - id: ch01-b16
          speaker: mrs_march
          text: If you happen to see Mr. Bhaer, bring him home for tea. I miss the dear man.
        - id: ch01-b17
          speaker: narrator
          text: Jo answered only by kissing her mother and hurrying away. Even through her heartache, gratitude warmed her.
        - id: ch01-b18
          speaker: jo
          text: She's so good to me. What do girls do when they don't have mothers to help them through trouble?
        - id: ch01-b19
          speaker: narrator
          text: The dry-goods stores on Jo's list were nowhere near the counting houses, banks, and wholesale warehouses where businessmen gathered. Yet before doing a single errand, she found herself in that very part of town. She wandered slowly as if waiting for somebody. With a most unfeminine show of interest, she studied engineering tools in one window and wool samples in another. She stumbled over barrels, descending bales nearly smothered her, and busy men shoved her aside without ceremony. Their faces seemed to ask how on earth she had found her way there.
        - id: ch01-b20
          speaker: narrator
          text: A raindrop struck her cheek and turned her thoughts from disappointed hopes to a ruined ribbon. More drops followed. Jo was not only a woman in love but also a woman wearing her best bonnet. Her heart might be beyond saving, but perhaps the bonnet was not. Then she remembered the little umbrella she had left behind in her rush to get away. Regret would not help now. She could borrow an umbrella or accept a soaking. Jo looked up at the dark sky, down at the black spots forming on her crimson bow, and ahead along the muddy road. Last, she gave one long, lingering look behind her at the dirty warehouse marked Hoffmann, Swartz, and Company.
        - id: ch01-b21
          speaker: jo
          text: This is exactly what I deserve. Why did I wear all my best things and come wandering down here, hoping to see the Professor? Jo, you ought to be ashamed. You will not ask his friends for an umbrella or try to find out where he is. You'll do your errands in the rain. If you ruin your bonnet and catch your death, it serves you right. Go on, then!
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: With that order to herself, Jo dashed across the street so wildly that a passing truck nearly destroyed her. She escaped it only to rush straight into the arms of a stately old gentleman.
        - id: ch01-b23
          speaker: old_gentleman
          text: I beg your pardon, ma'am.
        - id: ch01-b24
          speaker: narrator
          text: He looked deeply offended. A little shaken, Jo straightened herself and spread her handkerchief over the doomed ribbons. She left temptation behind and hurried on. Her ankles grew wetter, and umbrellas clashed above her. Then she noticed a worn blue umbrella that stayed directly over her bare bonnet. She looked up. Professor Bhaer was looking down at her.
        - id: ch01-b25
          speaker: mr_bhaer
          text: I believe I know this strong-minded lady. She walks bravely under horses' noses and races through the mud. What are you doing down here, my friend?
        - id: ch01-b26
          speaker: jo
          text: I'm shopping.
        - id: ch01-b27
          speaker: narrator
          text: Bhaer smiled. A pickle factory stood on one side of her and a wholesale leather business on the other. But he was too polite to mention that.
        - id: ch01-b28
          speaker: mr_bhaer
          text: You have no umbrella. May I come with you and carry your packages?
        - id: ch01-b29
          speaker: jo
          text: Yes, thank you.
        - id: ch01-b30
          speaker: narrator
          text: Jo's cheeks turned as red as her ribbon. She wondered what he thought, then decided she did not care. A moment later she was walking arm in arm with her Professor. The sun seemed to burst out, the world was right again, and one completely happy woman splashed through the rain.
        - id: ch01-b31
          speaker: jo
          text: We thought you'd gone.
        - id: ch01-b32
          speaker: narrator
          text: She spoke quickly because he was watching her. Her bonnet could not hide her face, and she worried that he might see too much joy there.
        - id: ch01-b33
          speaker: mr_bhaer
          text: Did you truly think I would leave without saying goodbye to people who have been so wonderfully kind to me?
        - id: ch01-b34
          speaker: narrator
          text: His hurt tone made Jo feel she had insulted him.
        - id: ch01-b35
          speaker: jo
          text: No, I didn't. I knew your own affairs kept you busy. We did miss you, though. Father and Mother especially.
        - id: ch01-b36
          speaker: mr_bhaer
          text: And you?
        - id: ch01-b37
          speaker: jo
          text: I'm always glad to see you, sir.
        - id: ch01-b38
          speaker: narrator
          text: Jo tried so hard to sound calm that she sounded cold. That formal little "sir" wiped away his smile.
        - id: ch01-b39
          speaker: mr_bhaer
          text: Thank you. I will visit once more before I leave.
        - id: ch01-b40
          speaker: jo
          text: You are leaving, then?
          emotion: surprised
        - id: ch01-b41
          speaker: mr_bhaer
          text: I have no more business here. It is finished.
        - id: ch01-b42
          speaker: jo
          text: I hope it ended well.
        - id: ch01-b43
          speaker: narrator
          text: She heard disappointment in his short answer.
        - id: ch01-b44
          speaker: mr_bhaer
          text: I should think it did. A way has opened for me to earn my living and give my boys much help.
        - id: ch01-b45
          speaker: jo
          text: Please tell me. I want to hear everything about the—the boys.
        - id: ch01-b46
          speaker: mr_bhaer
          text: That is very kind. My friends have found me a position at a college. I can teach as I did at home and earn enough to make life easier for Franz and Emil. I should be grateful, should I not?
        - id: ch01-b47
          speaker: jo
          text: Of course! How wonderful to do the work you love, and for us to see you often—and the boys too!
          emotion: happy
        - id: ch01-b48
          speaker: narrator
          text: Jo held tight to the thought of the boys so she could explain the happiness she could not hide.
        - id: ch01-b49
          speaker: mr_bhaer
          text: Ah, but I fear we will not meet often. The college is out West.
        - id: ch01-b50
          speaker: jo
          text: So far away!
          emotion: sad
        - id: ch01-b51
          speaker: narrator
          text: Jo let her skirts drag. Her clothes and everything else suddenly seemed unimportant.
        - id: ch01-b52
          speaker: narrator
          text: Professor Bhaer could read several languages, but he could not yet read women. He thought he knew Jo well, so her changing voice, face, and manner amazed him. In half an hour, she passed through half a dozen moods. She had looked surprised to meet him, though he suspected she had come looking for him. She had taken his arm with a look that filled him with delight, then crushed his hopes with her formal answer about missing him. His good news nearly made her clap. Was that joy only for the boys? When she heard he was going West, her miserable cry lifted his hopes high again. Then she dropped them at once.
        - id: ch01-b53
          speaker: jo
          text: Here's the store I need. Will you come inside? I won't be long.
        - id: ch01-b54
          speaker: narrator
          text: Jo took pride in being a capable shopper. She especially wanted to impress her companion with the neatness and speed of her business. But she was so flustered that everything went wrong. She knocked over the tray of needles. She forgot that the silesia must be twilled until the clerk had already cut it. She handed over the wrong change and then completed her embarrassment by asking for lavender ribbon at the calico counter. Bhaer stood quietly by and watched her blush and blunder. As he did, his confusion faded. He was beginning to understand that on certain occasions, women, like dreams, sometimes meant the opposite of what they seemed to say.
        - id: ch01-b55
          speaker: narrator
          text: Outside, he tucked the parcel beneath his arm with a happier expression. He splashed through the puddles as if he rather enjoyed them.
        - id: ch01-b56
          speaker: mr_bhaer
          text: Shall we do some shopping for the babies? We could bring them a farewell feast tonight, when I make my last visit to your pleasant home.
        - id: ch01-b57
          speaker: narrator
          text: He stopped before a window filled with fruit and flowers.
        - id: ch01-b58
          speaker: jo
          text: What should we get?
        - id: ch01-b59
          speaker: narrator
          text: Jo ignored the part about his last visit and pretended great interest in the mingled scents as they entered.
        - id: ch01-b60
          speaker: mr_bhaer
          text: May the little ones have oranges and figs?
        - id: ch01-b61
          speaker: jo
          text: They eat them whenever they can get them.
        - id: ch01-b62
          speaker: mr_bhaer
          text: Do you like nuts?
        - id: ch01-b63
          speaker: jo
          text: As much as a squirrel does.
        - id: ch01-b64
          speaker: mr_bhaer
          text: And Hamburg grapes. Yes, we can toast the Fatherland with those.
        - id: ch01-b65
          speaker: jo
          text: Why stop there? Buy a whole basket of dates, a barrel of raisins, and a sack of almonds too.
        - id: ch01-b66
          speaker: narrator
          text: Jo frowned at such extravagance. Bhaer took away her purse, brought out his own, and finished the shopping. He bought several pounds of grapes, a pot of pink daisies, and a pretty jar of honey that was almost large enough to be called a jug. With lumpy packages stretching his pockets and the flowers in Jo's hands, he opened the old umbrella, and they set off again.
        - id: ch01-b67
          speaker: mr_bhaer
          text: Miss March, I have a great favor to ask you.
        - id: ch01-b68
          speaker: jo
          text: Yes, sir?
        - id: ch01-b69
          speaker: narrator
          text: Jo's heart beat so loudly that she feared he would hear it.
        - id: ch01-b70
          speaker: mr_bhaer
          text: I dare to ask now, even in the rain, because I have so little time left.
        - id: ch01-b71
          speaker: jo
          text: Yes, sir.
        - id: ch01-b72
          speaker: narrator
          text: She squeezed the flowerpot so hard that she nearly broke it.
        - id: ch01-b73
          speaker: mr_bhaer
          text: I want to buy a little dress for my Tina, but I am helpless at such things. Would you choose it with me?
        - id: ch01-b74
          speaker: jo
          text: Yes, sir.
        - id: ch01-b75
          speaker: narrator
          text: In an instant, Jo felt as cool as if she had stepped into an icebox.
        - id: ch01-b76
          speaker: mr_bhaer
          text: Perhaps we should find a shawl for Tina's mother too. She is poor and ill, and her husband brings her so much worry. A thick, warm shawl would be a kind gift for the little mother.
        - id: ch01-b77
          speaker: jo
          text: I'll be glad to help, Mr. Bhaer.
        - id: ch01-b78
          speaker: narrator
          text: To herself, Jo admitted that she was falling fast and that he grew dearer every minute. Then she gave herself a firm mental shake and threw all her energy into the task.
        - id: ch01-b79
          speaker: narrator
          text: Bhaer left every choice to her. Jo picked a pretty dress for Tina, then asked to see the shawls. The clerk was married and took a friendly interest in the pair, who looked as if they were buying things for their own family.
        - id: ch01-b80
          speaker: clerk
          text: Your lady might prefer this one. It's excellent quality, a very becoming color, and quite refined.
        - id: ch01-b81
          speaker: narrator
          text: He shook out a warm gray shawl and laid it over Jo's shoulders.
        - id: ch01-b82
          speaker: jo
          text: Does this one please you, Mr. Bhaer?
        - id: ch01-b83
          speaker: narrator
          text: She turned her back to him, grateful for a chance to hide her face.
        - id: ch01-b84
          speaker: mr_bhaer
          text: It suits perfectly. We will take it.
        - id: ch01-b85
          speaker: narrator
          text: Bhaer smiled to himself as he paid. Jo kept searching the counters like a determined bargain hunter.
        - id: ch01-b86
          speaker: mr_bhaer
          text: Shall we go home now?
        - id: ch01-b87
          speaker: narrator
          text: He seemed to enjoy saying the word home.
        - id: ch01-b88
          speaker: jo
          text: Yes. It's late, and I'm so tired.
          emotion: sad
        - id: ch01-b89
          speaker: narrator
          text: Her voice sounded more sorrowful than she knew. The sunshine seemed to vanish as quickly as it had appeared, and the world turned muddy and miserable again. For the first time that day, she discovered that her feet were cold and her head ached. Her heart felt colder than her feet and held more pain than her head. Bhaer was leaving. He cared for her only as a friend. She had imagined everything, and the sooner the mistake ended, the better. With that thought fixed in her mind, she waved so wildly at an approaching omnibus that the daisies flew from their pot and were badly damaged.
        - id: ch01-b90
          speaker: mr_bhaer
          text: That is not our omnibus.
        - id: ch01-b91
          speaker: narrator
          text: He waved the crowded vehicle on and bent to gather the poor flowers.
        - id: ch01-b92
          speaker: jo
          text: I'm sorry. I couldn't read the sign. It doesn't matter. I can walk. I'm used to trudging through mud.
        - id: ch01-b93
          speaker: narrator
          text: Jo blinked hard. She would rather have died than openly wipe her eyes. But Bhaer saw the drops on her cheeks when she turned away, and the sight moved him deeply. He bent toward her, and his voice held everything he felt.
        - id: ch01-b94
          speaker: mr_bhaer
          text: Heart's dearest, why are you crying?
        - id: ch01-b95
          speaker: narrator
          text: If Jo had known more about such moments, she might have claimed she was not crying, blamed a cold, or offered some other proper little lie. Instead, the undignified creature gave a sob she could not stop.
        - id: ch01-b96
          speaker: jo
          text: Because you're going away.
          emotion: sad
        - id: ch01-b97
          speaker: mr_bhaer
          text: Ach, mein Gott, that is so good! Jo, I have nothing to give you but a great deal of love. I came to learn whether you could care for it. I waited until I knew I might be more than a friend. Am I? Could you make a small place in your heart for old Fritz?
          emotion: surprised
        - id: ch01-b98
          speaker: narrator
          text: Somehow he clasped his hands despite the umbrella and all the packages. The whole confession came in one breath.
        - id: ch01-b99
          speaker: jo
          text: Oh, yes!
          emotion: happy
        - id: ch01-b100
          speaker: narrator
          text: That answer satisfied him. Jo folded both hands over his arm and looked up. Her face plainly promised that she would gladly walk beside him through life, even beneath that battered umbrella, as long as he held it.
        - id: ch01-b101
          speaker: narrator
          text: It was certainly a proposal made under difficult conditions. Even if Bhaer had wished to kneel, the mud made it impossible. Both hands were full, so he could not offer one to Jo except in the usual meaning of the phrase. The open street was hardly the place for tender speeches, though he nearly made them anyway. All he could do was look at her. Joy lit his face so brightly that the drops sparkling in his beard seemed to hold tiny rainbows.
        - id: ch01-b102
          speaker: narrator
          text: He must have loved Jo very much, because she was far from lovely just then. Her skirts were a wreck, mud splashed her rubber boots to the ankles, and her bonnet was ruined. Bhaer thought she was the most beautiful woman alive. Jo thought he looked more like Jove than ever, though water ran from his limp hat brim onto his shoulders. He held the umbrella entirely over her, and every finger of his gloves needed mending.
        - id: ch01-b103
          speaker: narrator
          text: People passing them probably thought they were a pair of harmless lunatics. They forgot all about stopping a bus and wandered slowly on, unaware that dusk and fog were gathering. Neither cared what anyone thought. They were living through that rare, happy hour that may come only once in a life. It brings youth to the old, beauty to the plain, and wealth to the poor. It gives the human heart a first taste of heaven. The Professor looked as if he had conquered a kingdom and the world had no greater happiness left to offer him. Jo trudged beside him feeling that her place had always been there, and wondering how she could ever have chosen another life.
        - id: ch01-b104
          speaker: narrator
          text: Of course Jo was the first to say something understandable. The things she had said after that sudden "Oh, yes" had been too emotional to make much sense.
        - id: ch01-b105
          speaker: jo
          text: Friedrich, why didn't you—
        - id: ch01-b106
          speaker: mr_bhaer
          text: Ah, heaven! She calls me by the name no one has spoken since Minna died!
          emotion: surprised
        - id: ch01-b107
          speaker: narrator
          text: He stopped in a puddle and gazed at her with grateful delight.
        - id: ch01-b108
          speaker: jo
          text: I always call you that in my thoughts. I forgot. I won't say it if you don't like it.
        - id: ch01-b109
          speaker: mr_bhaer
          text: Like it? It is sweeter than I can say. Call me "thou" as well, and I will think your language nearly as beautiful as mine.
          emotion: happy
        - id: ch01-b110
          speaker: jo
          text: Isn't "thou" rather sentimental?
        - id: ch01-b111
          speaker: narrator
          text: Secretly, Jo thought it was a lovely little word.
        - id: ch01-b112
          speaker: mr_bhaer
          text: Sentimental? Yes! Thank God we Germans believe in sentiment. It keeps us young. Your English "you" is so cold. Say "thou," heart's dearest. It means so much to me.
        - id: ch01-b113
          speaker: narrator
          text: The serious professor pleaded like a romantic student.
        - id: ch01-b114
          speaker: jo
          text: Well, then, why didn't thou tell me sooner?
        - id: ch01-b115
          speaker: mr_bhaer
          text: Now I must show thee my whole heart, and I will gladly do it, because thou must care for it from now on. Listen, my Jo. What a dear, funny little name. I wanted to speak when I said goodbye in New York. But I thought your handsome friend was promised to thee, so I kept silent. Wouldst thou have said yes if I had asked then?
        - id: ch01-b116
          speaker: jo
          text: I don't know. I'm afraid I wouldn't have. I had no heart then.
        - id: ch01-b117
          speaker: mr_bhaer
          text: Nonsense! I do not believe that. It was only asleep until the fairy prince came through the woods and woke it. Ah, well. First love is best, though I could not expect it.
        - id: ch01-b118
          speaker: jo
          text: First love is best, and you can be content. I never had another. Teddy was only a boy, and he soon recovered from his little fancy.
        - id: ch01-b119
          speaker: narrator
          text: Jo wanted to correct the Professor's mistake at once.
        - id: ch01-b120
          speaker: mr_bhaer
          text: Good! Then I can be happy and know thou givest me everything. I have waited so long that I have become selfish, as thou wilt discover, Professorin.
        - id: ch01-b121
          speaker: jo
          text: I like that name! Now tell me what finally brought you, just when I needed you.
          emotion: happy
        - id: ch01-b122
          speaker: mr_bhaer
          text: This.
        - id: ch01-b123
          speaker: narrator
          text: Bhaer drew a small, worn paper from his vest pocket. Jo opened it and looked embarrassed. It was one of the poems she sometimes sent to a newspaper that paid for verse.
        - id: ch01-b124
          speaker: jo
          text: How could this bring you here?
        - id: ch01-b125
          speaker: mr_bhaer
          text: I found it by chance. The names and initials told me it was yours. One little verse seemed to call me. Read it and find the verse. I will make sure you do not step in the water.
        - id: ch01-b126
          speaker: narrator
          text: The poem was called "In the Garret."
        - id: ch01-b127
          speaker: jo
          text: |-
            Four little chests all in a row,
            Dim with dust, and worn by time,
            All fashioned and filled, long ago,
            By children now in their prime.
            Four little keys hung side by side,
            With faded ribbons, brave and gay
            When fastened there, with childish pride,
            Long ago, on a rainy day.
            Four little names, one on each lid,
            Carved out by a boyish hand,
            And underneath there lieth hid
            Histories of the happy band
            Once playing here, and pausing oft
            To hear the sweet refrain,
            That came and went on the roof aloft,
            In the falling summer rain.

            “Meg” on the first lid, smooth and fair.
            I look in with loving eyes,
            For folded here, with well-known care,
            A goodly gathering lies,
            The record of a peaceful life—
            Gifts to gentle child and girl,
            A bridal gown, lines to a wife,
            A tiny shoe, a baby curl.
            No toys in this first chest remain,
            For all are carried away,
            In their old age, to join again
            In another small Meg’s play.
            Ah, happy mother! Well I know
            You hear, like a sweet refrain,
            Lullabies ever soft and low
            In the falling summer rain.

            “Jo” on the next lid, scratched and worn,
            And within a motley store
            Of headless dolls, of schoolbooks torn,
            Birds and beasts that speak no more,
            Spoils brought home from the fairy ground
            Only trod by youthful feet,
            Dreams of a future never found,
            Memories of a past still sweet,
            Half-writ poems, stories wild,
            April letters, warm and cold,
            Diaries of a wilful child,
            Hints of a woman early old,
            A woman in a lonely home,
            Hearing, like a sad refrain—
            “Be worthy, love, and love will come,”
            In the falling summer rain.

            My Beth! the dust is always swept
            From the lid that bears your name,
            As if by loving eyes that wept,
            By careful hands that often came.
            Death canonized for us one saint,
            Ever less human than divine,
            And still we lay, with tender plaint,
            Relics in this household shrine—
            The silver bell, so seldom rung,
            The little cap which last she wore,
            The fair, dead Catherine that hung
            By angels borne above her door.
            The songs she sang, without lament,
            In her prison-house of pain,
            Forever are they sweetly blent
            With the falling summer rain.

            Upon the last lid’s polished field—
            Legend now both fair and true
            A gallant knight bears on his shield,
            “Amy” in letters gold and blue.
            Within lie snoods that bound her hair,
            Slippers that have danced their last,
            Faded flowers laid by with care,
            Fans whose airy toils are past,
            Gay valentines, all ardent flames,
            Trifles that have borne their part
            In girlish hopes and fears and shames,
            The record of a maiden heart
            Now learning fairer, truer spells,
            Hearing, like a blithe refrain,
            The silver sound of bridal bells
            In the falling summer rain.

            Four little chests all in a row,
            Dim with dust, and worn by time,
            Four women, taught by weal and woe
            To love and labor in their prime.
            Four sisters, parted for an hour,
            None lost, one only gone before,
            Made by love’s immortal power,
            Nearest and dearest evermore.
            Oh, when these hidden stores of ours
            Lie open to the Father’s sight,
            May they be rich in golden hours,
            Deeds that show fairer for the light,
            Lives whose brave music long shall ring,
            Like a spirit-stirring strain,
            Souls that shall gladly soar and sing
            In the long sunshine after rain.
