audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，带着克制的幽默, timbre: 清澈柔和, pace: 从容舒展, pitch: 中音}
    jo:
      display_name: 乔
      tts: {delivery: 爽直活泼，情感来得快而真, timbre: 明亮有力, pace: 稍快, pitch: 中音}
    beth:
      display_name: 贝思
      tts: {delivery: 温柔诚恳，羞怯克制, timbre: 轻柔纯净, pace: 舒缓, pitch: 中高音}
  chapters:
    - id: ch01
      title: 乔看见的变化
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那年春天，乔回到家，一眼就看出了贝思的变化。家里谁也不提，仿佛谁都没有发觉。变化来得太慢，天天守在贝思身边的人，自然不容易吃惊。可乔离家很久，什么都看得清楚。妹妹的脸没有比秋天更白，也只瘦了一点，却透出一种奇异的透明感。尘世留在她身上的东西，像在一点点褪去。那不朽的灵魂，反倒从脆弱的身体里映出光来，美得叫人心碎。乔的心一下沉了下去，可她当时什么也没说。后来贝思看着很快乐，大家似乎也相信她正在好转，别的忧虑又缠住了乔。最初那阵惊恐，也就暂时淡了。
        - id: ch01-b02
          speaker: narrator
          text: 劳里走后，家里安静下来，乔心底那份不安又冒了出来。她已经承认自己的过错，也得到了原谅。她拿积蓄给贝思看，提议去山里旅行。贝思真心谢过姐姐，却求她不要走那么远，只想再去海边住一阵。妈妈舍不得丢下两个外孙，于是乔独自带贝思去了清静的海滨。她让妹妹尽量待在户外，盼着清新的海风能给那苍白的脸吹出一点血色。
        - id: ch01-b03
          speaker: narrator
          text: 那里不是什么时髦的避暑胜地，来往的人倒都和气。姐妹俩没有结交几个朋友，只愿意守着彼此。贝思怕生，不爱应酬。乔一心扑在妹妹身上，也顾不上别人。两个人就这样成了彼此的整个世界，整天形影不离。她们没留意，周围的人总在怜惜地看着她们。一个姐姐健康强壮，一个妹妹纤弱无力，谁都本能地觉得，一场长久的离别已经不远了。
        - id: ch01-b04
          speaker: narrator
          text: 姐妹俩也有同样的感觉，却都没有说破。最亲的人之间，有时偏偏隔着一层难以跨过的东西。乔觉得自己和贝思之间垂着一道帘子。每当她想伸手揭开，又觉得沉默里藏着某种神圣的东西，只好等贝思先开口。父母似乎没看到她所看到的，这让乔又诧异，又庆幸。那几个安静的星期里，阴影在她眼中一天比一天清楚。她没有写信告诉家里，只想等回去以后，如果贝思还是不见好，真相自然会显露。她更想知道，妹妹是不是也猜到了。那些漫长的日子里，贝思枕着她的膝头，躺在温暖的岩石上，任清风吹过，让海水在脚边奏着乐。她心里到底在想什么呢？
    - id: ch02
      title: 贝思说出秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，贝思终于说了。她一动不动地躺着，乔以为她睡着了，便放下书，忧心地看着妹妹。她想从那一点淡淡的红晕里找出希望，可那张脸太瘦，那双手也太无力，仿佛连她们捡来的玫瑰色小贝壳都托不住。乔怎么也找不到能安慰自己的迹象。她从没像这一刻这样清楚地明白，贝思正在慢慢从自己身边漂走。她不由得收紧双臂，抱住了世上最珍贵的宝贝。泪水一时遮住了她的眼睛。等她重新看清，贝思正无比温柔地仰望着她。其实已经不必再说什么了，贝思还是轻轻开了口。
        - id: ch02-b02
          speaker: beth
          text: 亲爱的乔，你已经知道了，我真高兴。我一直想告诉你，可怎么也开不了口。
          emotion: sad
        - id: ch02-b03
          speaker: narrator
          text: 乔没有回答，只把脸颊贴在妹妹脸上，连眼泪也流不出来。她越是动情，越哭不出来。这时候，反倒是她更软弱。贝思搂住姐姐，在她耳边低声安慰，努力撑住她。
        - id: ch02-b04
          speaker: beth
          text: 亲爱的，我早就知道了。现在我已经习惯，想起这件事也没有那么难受，自己受得住了。你也试着这样想，好吗？别替我难过。这样安排，真的最好。
          emotion: calm
        - id: ch02-b05
          speaker: jo
          text: 贝思，秋天的时候，你那么不快乐，就是因为这件事吗？那时你已经感觉到了，却一个人瞒到现在？
        - id: ch02-b06
          speaker: narrator
          text: 乔不肯承认这是什么最好的安排，更不愿亲口说出那句话。不过，她知道贝思的痛苦和劳里无关，心里还是悄悄松了一口气。
        - id: ch02-b07
          speaker: beth
          text: 是啊。那时我已经不抱希望了，可就是不肯承认。我拼命对自己说，这只是生病以后乱想，不想拿它去烦任何人。可我看着你们一个个身体健康，又都满怀希望地计划将来，再想到自己永远不能像你们那样，我就受不了了，乔。
          emotion: sad
        - id: ch02-b08
          speaker: jo
          text: 哦，贝思！你为什么不告诉我，不让我陪你、帮你呢？你怎么舍得把我挡在外面，一个人熬过这一切？
          emotion: sad
        - id: ch02-b09
          speaker: narrator
          text: 乔的责备很轻，里面全是心疼。她想到贝思独自挣扎了那么久，一点点告别健康、爱情和生命，最后才安静地背起自己的十字架，心里痛得厉害。
        - id: ch02-b10
          speaker: beth
          text: 也许是我做错了，可我只想把事情处理好。那时候我也不能肯定，谁都没对我说过什么，我还盼着自己猜错了。妈妈正为梅格操心，艾米又远在外面。你和劳里那么幸福，至少我当时以为你们很幸福。要是我再把大家吓坏，不是太自私了吗？
    - id: ch03
      title: 退去的潮水
      blocks:
        - id: ch03-b01
          speaker: jo
          text: 我还以为你爱劳里呢，贝思！我就是因为自己不能爱他，才离开家的。
        - id: ch03-b02
          speaker: narrator
          text: 真相终于能全说出来，乔反倒觉得痛快。贝思听见这个念头，吃惊地睁大了眼睛。乔正在难过，也忍不住笑了一下，又放轻了声音。
        - id: ch03-b03
          speaker: jo
          text: 原来不是啊，宝贝？我一直怕真是这么回事，还以为你那阵子可怜巴巴的，是害了相思病。
        - id: ch03-b04
          speaker: beth
          text: 哎呀，乔，他那么喜欢你，我怎么会爱上他呢？我当然很爱他。他对我那么好，我怎么会不爱？可在我心里，他一直只是哥哥。我还盼着有一天，他真的能成为我的哥哥呢。
        - id: ch03-b05
          speaker: jo
          text: 反正不会因为我。还有艾米，他们两个倒很合适。可我现在不想管这些。除了你，我谁也顾不上。贝思，你一定得好起来。
        - id: ch03-b06
          speaker: beth
          text: 我也想好起来啊。哦，我多么想！我一直在努力，可每天还是会失去一点，而且越来越明白，失去的再也回不来了。乔，这就像潮水。潮水一开始退，哪怕退得很慢，也没有谁拦得住。
          emotion: sad
        - id: ch03-b07
          speaker: jo
          text: 一定拦得住！你的潮水不能这么早退下去，你才十九岁呀，贝思。我不能让你走。我要想办法，也要祈祷，我要跟它争。不管付出什么代价，我都得把你留下。一定还有办法，现在绝不会太迟。上帝不能这么残忍，把你从我身边夺走！
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: 可怜的乔拼命反抗。要她像贝思那样虔诚地接受这一切，实在太难了。朴素真诚的人，很少把信仰时时挂在嘴上。他们把信仰活在行动里，那力量胜过一切训诫和漂亮话。正是这份信念给了贝思勇气和耐心，让她能放下生命，静静等候死亡。可她讲不出道理，也不会解释。她像一个全心信赖的孩子，什么都不问，只把自己交给上帝与自然，交给我们共同的父亲与母亲。她相信，只有他们能教导人的心，也能给人力量，让人走过今生，再走向来世。
        - id: ch03-b09
          speaker: narrator
          text: 贝思没有摆出圣徒的样子劝说乔。姐姐爱得这样炽烈，她只会更爱姐姐，也更舍不得人世间这份宝贵的亲情。天父并不要求人割舍这样的爱，反而借着它，把人引得更近。贝思没法说自己很高兴就要离开，因为生命对她太甜美。她只紧紧抱住乔，哭着说出了心里的话。
        - id: ch03-b10
          speaker: beth
          text: 我在努力让自己甘心。
          emotion: sad
        - id: ch03-b11
          speaker: narrator
          text: 巨大的悲痛掀起了第一道苦涩的浪头，就这样一起淹没了姐妹俩。
    - id: ch04
      title: 贝思的托付
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 过了一会儿，贝思平静下来。
        - id: ch04-b02
          speaker: beth
          text: 等我们回家，你会把这件事告诉他们吧？
        - id: ch04-b03
          speaker: jo
          text: 我想不用说，他们自己就会看出来。
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: 乔叹了口气。此刻在她眼里，贝思仿佛每天都在改变。
        - id: ch04-b05
          speaker: beth
          text: 也许他们看不出来。我听说，一个人爱得越深，碰到这种事反而越看不清。要是他们没有发觉，你就替我说吧。我不想再藏秘密了。早一点让他们准备，反倒更仁慈。梅格有约翰和两个孩子安慰她。可是爸爸妈妈身边，要有你陪着。答应我，好不好，乔？
        - id: ch04-b06
          speaker: jo
          text: 只要我做得到。可是贝思，我还不肯放弃。我要把这当作生病后的胡思乱想，也不许你把它当真。
        - id: ch04-b07
          speaker: narrator
          text: 乔拼命装出快活的语气。贝思安静地想了一会儿，开口时依旧那么平和。
        - id: ch04-b08
          speaker: beth
          text: 我不知道该怎么说明白，也不会对别人说这些。只有对着我的乔，我才能把心里的话都讲出来。我总有一种感觉，好像自己生来就不会活很久。我和你们几个不一样。我从没计划过长大要做什么，也不像你们那样想过结婚。我想象不出自己还能变成别的样子，只看得见那个笨笨的小贝思，天天在家里跑来跑去。除了在家，我到了哪里都没有用。我从没想过要离开。现在最难受的，就是要离开你们。我不害怕，可哪怕到了天堂，我想我还是会想家，还是会想你们。
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: 乔一句话也说不出来。好几分钟，耳边只有风在叹息，潮水轻轻拍着岸。一只白翅膀的海鸥从空中飞过，阳光在它银亮的胸脯上一闪。贝思一直望着，直到它消失，眼里满是忧伤。接着，一只穿灰衣的小矶鹬踏着轻快的步子走过沙滩，嘴里低低啾鸣，像是也在享受阳光和大海。它走到贝思附近，友善地瞧了瞧她，又落在温暖的石头上，悠闲地梳理湿漉漉的羽毛，仿佛这里就是它的家。贝思笑了，心里也得了一点安慰。这个小小的生命，像是愿意送她一点微薄的友情，也提醒她，眼前仍是一个值得享受的美好世界。
        - id: ch04-b10
          speaker: beth
          text: 亲爱的小鸟！乔，你看，它一点也不怕人。比起那些海鸥，我更喜欢这些啾啾叫的小鸟。它们没有海鸥那么粗犷漂亮，可它们快活，又信赖人。去年夏天，我总把它们叫作“我的鸟儿”。妈妈说，它们让她想到我，总是忙个不停，穿着贵格会式的素灰衣裳，从不离开岸边，嘴里还一直唱着心满意足的小曲。
        - id: ch04-b11
          speaker: beth
          text: 乔，你就是海鸥。你强健又自由，喜欢暴风和大风，会远远飞到海上，哪怕一个人也很快乐。梅格是斑鸠。艾米呢，就像她信里写的云雀，总想飞进云层，又一次次落回自己的巢。亲爱的小姑娘！她有那么大的志向，心里却又善良又温柔。不管飞得多高，她永远不会忘记家。我真想再见她一面，可她离得那么远。
          emotion: sad
    - id: ch05
      title: 回到家里
      blocks:
        - id: ch05-b01
          speaker: jo
          text: 她春天就会回来。到那时，我一定让你好好的，脸色红润，健健康康地和她团聚。
        - id: ch05-b02
          speaker: narrator
          text: 在贝思所有的变化里，最让乔吃惊的，是妹妹忽然变得健谈了。现在，贝思说话仿佛再也不费力，竟能把心里想的事一件件说出来，完全不像从前那个羞怯的姑娘。
        - id: ch05-b03
          speaker: beth
          text: 亲爱的乔，别再抱希望了。那没有用，我很确定。我们别一直难过，只要趁着等待的时候，好好过相聚的日子。我们还会有许多快乐的时候，因为我并不怎么痛苦。只要你肯帮我，我想这潮水会安安静静地退下去。
          emotion: calm
        - id: ch05-b04
          speaker: narrator
          text: 乔俯下身，吻了吻那张安详的脸。她没有说话，只用这一吻，把自己的灵魂和身体全都交给了贝思。
        - id: ch05-b05
          speaker: narrator
          text: 贝思说得没错。回到家，一句话都不用讲，父亲和母亲已经清清楚楚看见了他们一直祈求不要看见的事。短短一趟旅行，就让贝思累得厉害。她说自己真高兴回家了，随后便上床休息。乔下楼时，知道自己已经不必再亲口说出贝思的秘密。父亲低着头，靠在壁炉台边，听见她进来也没有回身。母亲像是在求她扶住自己，朝她张开双臂。乔一句话也没说，只走过去抱住妈妈，安慰着她。
