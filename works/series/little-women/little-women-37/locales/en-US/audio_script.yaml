audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "warm, observant, and gently playful", timbre: "clear and inviting", pace: measured, pitch: medium}
    jo:
      display_name: Jo
      tts: {delivery: "quick, candid, and spirited", timbre: "bright and slightly husky", pace: lively, pitch: medium-low}
    beth:
      display_name: Beth
      tts: {delivery: "quiet, tender, and earnest", timbre: "soft and airy", pace: unhurried, pitch: medium-high}
  chapters:
    - id: ch01
      title: What Jo Saw
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When Jo came home that spring, the change in Beth struck her at once. No one mentioned it. No one who saw Beth every day seemed to notice, because the change had come so slowly. But Jo had been away, and her eyes saw everything. The sight of her sister made her heart feel heavy.
        - id: ch01-b02
          speaker: narrator
          text: Beth was only a little paler and thinner than she had been in the fall. Still, there was a strange, clear look about her. It seemed as if her mortal life were slowly fading and her immortal spirit were shining through. The beauty of it hurt Jo to see. She understood what it might mean, but she said nothing.
        - id: ch01-b03
          speaker: narrator
          text: Before long, that first terrible feeling weakened. Beth seemed happy, and everyone appeared to believe she was getting better. Other worries filled Jo's mind, and for a while she forgot her fear.
        - id: ch01-b04
          speaker: narrator
          text: Then Laurie went away, the household grew peaceful again, and Jo's uneasy feeling returned. It followed her everywhere. She had confessed her mistakes and been forgiven. She even showed Beth the money she had saved and suggested a trip to the mountains. Beth thanked her warmly, but asked not to travel so far from home. She would rather visit the seashore once more.
        - id: ch01-b05
          speaker: narrator
          text: Grandma could not be persuaded to leave the babies, so Jo took Beth to the quiet seaside place herself. There Beth could spend most of each day outdoors, with the fresh wind trying to bring a little color back to her pale cheeks.
        - id: ch01-b06
          speaker: narrator
          text: The place was not fashionable. There were pleasant people around them, but the sisters made few friends. Beth was too shy for company, and Jo cared only about Beth. They were everything to each other. Wherever they went, they went together, unaware of the tender interest they stirred in those who watched the strong sister beside the frail one. The strangers seemed to sense that a long separation was drawing near.
        - id: ch01-b07
          speaker: narrator
          text: The sisters sensed it too, but neither one spoke. Sometimes a strange reserve rises between us and the people we love most. Jo felt as if a veil had fallen between her heart and Beth's. Whenever she tried to lift it, the silence seemed sacred, so she waited for Beth to begin.
        - id: ch01-b08
          speaker: narrator
          text: Jo wondered why her parents did not see what she saw, and she was grateful that they did not. Through those quiet weeks, as the shadows became clearer to her, she told no one at home. If Beth returned no better, the truth would speak for itself. Most of all, Jo wondered whether Beth knew. What did she think about through the long hours on the warm rocks, her head in Jo's lap, while the wind blew over her and the sea made music at her feet?
    - id: ch02
      title: Beth Tells Her Secret
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, Beth told her. She was lying so still that Jo thought she had fallen asleep. Jo lowered her book and studied that dear face, searching the faint color in Beth's cheeks for some sign of hope. There was not enough. The cheeks were terribly thin, and Beth's hands looked too weak to hold the small pink shells they had gathered.
        - id: ch02-b02
          speaker: narrator
          text: More bitterly than ever, Jo knew that Beth was slowly drifting away. Her arms tightened around the person she loved best. For a moment, tears blurred her sight. When she could see again, Beth was looking up at her so tenderly that she hardly needed to speak.
        - id: ch02-b03
          speaker: beth
          text: Jo, dear, I'm glad you know now. I've tried to tell you, but I never could.
        - id: ch02-b04
          speaker: narrator
          text: Jo gave no answer. She only pressed her cheek to Beth's. She did not even cry, because when her feelings went deepest, no tears came. Jo was the weaker sister then. Beth put her arms around her and whispered words meant to comfort and steady her.
        - id: ch02-b05
          speaker: beth
          text: I've known for a long time, dear. I'm used to knowing now, so it isn't as hard to think about or bear. Please try to look at it that way. Don't be troubled for me. It really is best.
          emotion: calm
        - id: ch02-b06
          speaker: jo
          text: Is that why you were so unhappy last fall, Beth? You didn't know then and hide it from us all this time, did you?
        - id: ch02-b07
          speaker: narrator
          text: Jo would not agree that this was best. Still, she was relieved to learn that Laurie had not caused Beth's sorrow.
        - id: ch02-b08
          speaker: beth
          text: Yes. That was when I stopped hoping, though I couldn't admit it. I tried to tell myself it was only a sick thought, and I wouldn't worry anyone with it. But all of you were healthy and strong, making such happy plans. Knowing I could never be like that made me miserable, Jo.
          emotion: sad
        - id: ch02-b09
          speaker: jo
          text: Oh, Beth! Why didn't you tell me and let me help you? How could you keep me outside and carry it alone?
          emotion: sad
        - id: ch02-b10
          speaker: narrator
          text: Tender reproach filled Jo's voice. Her heart ached as she imagined Beth's lonely struggle. All by herself, Beth had learned to say goodbye to health, to love, and to life, and still carry her burden cheerfully.
        - id: ch02-b11
          speaker: beth
          text: Maybe it was wrong, but I was trying to do what was right. I wasn't certain, and no one said anything. I kept hoping I had mistaken it. Marmee was so worried about Meg, Amy was away, and you seemed so happy with Laurie. At least, I believed you were. It would have been selfish to frighten everyone then.
        - id: ch02-b12
          speaker: jo
          text: And I believed you loved him! I went away because I couldn't love him that way.
        - id: ch02-b13
          speaker: narrator
          text: Jo was glad to let the whole truth out. Beth looked so astonished by the idea that, even through her pain, Jo smiled.
        - id: ch02-b14
          speaker: jo
          text: So you didn't love him that way, dear? I was afraid you did. I pictured your poor little heart suffering from lovesickness all that time.
        - id: ch02-b15
          speaker: beth
          text: Why, Jo, how could I, when he cared so much for you? Of course I love him dearly. He's always so good to me. But he could never be more than a brother to me. I hope someday he truly will be my brother.
          emotion: surprised
        - id: ch02-b16
          speaker: jo
          text: He won't become your brother through me. There's still Amy, and those two would suit each other very well. But I can't care about any of that now. I don't care what happens to anyone but you, Beth. You have to get better.
        - id: ch02-b17
          speaker: beth
          text: I want to. Oh, I want it so much! I do try. But every day I lose a little more, and I'm more certain I can never win it back. It's like the tide, Jo. Once it turns, it moves slowly, but nothing can stop it.
          emotion: sad
        - id: ch02-b18
          speaker: jo
          text: Then we'll stop the tide! It can't turn for you yet. You're only nineteen. I won't let you go. I'll work and pray and fight it. I'll hold on to you no matter what. There must be something we can do. It cannot be too late. God cannot be cruel enough to take you away from me.
          emotion: angry
    - id: ch03
      title: The First Bitter Wave
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Jo's spirit could not submit as Beth's did. Yet people with simple, honest faith rarely say much about it. Their faith appears in what they do, and that speaks more strongly than sermons or solemn promises.
        - id: ch03-b02
          speaker: narrator
          text: Beth could not explain the faith that gave her courage and patience to let go of life and wait peacefully for death. Like a trusting child, she asked no questions. She left everything to God and nature, the Father and Mother of us all. She believed that only they could teach and strengthen the heart and spirit for this life and the next.
        - id: ch03-b03
          speaker: narrator
          text: She did not answer Jo with saintly speeches. She only loved Jo more for that fierce devotion and held more tightly to the dear human love that draws us nearer to God. Beth could not say that she was glad to leave, because life was very sweet to her. Holding fast to Jo, she could only sob.
        - id: ch03-b04
          speaker: beth
          text: I am trying to be willing.
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: And the first bitter wave of their great sorrow broke over the sisters together.
        - id: ch03-b06
          speaker: narrator
          text: After a while, Beth grew peaceful again and spoke.
        - id: ch03-b07
          speaker: beth
          text: You'll tell them when we go home, won't you?
          emotion: calm
        - id: ch03-b08
          speaker: jo
          text: I think they'll see it without anyone saying a word.
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: To Jo, it seemed that Beth changed from one day to the next now.
        - id: ch03-b10
          speaker: beth
          text: Maybe they won't see. I've heard that the people who love us most can be the last to notice something like this. If they don't understand, please tell them for me. I don't want secrets anymore, and it will be kinder if they have time to prepare. Meg has John and the babies to comfort her. But you'll stay close to Father and Mother, won't you, Jo?
          emotion: calm
        - id: ch03-b11
          speaker: jo
          text: If I can. But I haven't given up, Beth. I'm going to call this a sick fancy and refuse to let you believe it's true.
        - id: ch03-b12
          speaker: narrator
          text: Jo tried to make her voice cheerful. Beth thought for a minute, then answered in her quiet way.
        - id: ch03-b13
          speaker: beth
          text: I don't know how to say what I mean. I wouldn't even try with anyone but you, because you're the only person I can truly speak to. I feel as if I was never meant to live a long life. I'm not like the rest of you. I never planned what I would do when I grew up. I never imagined getting married the way all of you did. I could only picture myself as plain little Beth, going about the house and being useful nowhere but at home.
        - id: ch03-b14
          speaker: beth
          text: I never wanted to leave home. That's what hurts now, having to leave all of you. I'm not afraid. But I think I will be homesick for you, even in heaven.
          emotion: sad
        - id: ch03-b15
          speaker: narrator
          text: Jo could not answer. For several minutes, they heard only the wind sighing and the tide washing the shore.
    - id: ch04
      title: The Birds by the Sea
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: A white-winged gull swept past them, and sunlight flashed on its silver breast. Beth followed it with her eyes until it disappeared. Her eyes were full of sadness.
        - id: ch04-b02
          speaker: narrator
          text: Then a small sandpiper in a gray coat hurried along the beach, peeping softly as if it were enjoying the sea and sun. It came near Beth, gave her a friendly look, and settled on a warm stone to smooth its wet feathers. It seemed completely at home there.
        - id: ch04-b03
          speaker: narrator
          text: Beth smiled, and the little bird comforted her. Its tiny friendship seemed to remind her that there was still a pleasant world to enjoy.
        - id: ch04-b04
          speaker: beth
          text: Dear little bird! Look how tame it is, Jo. I like these peeping birds better than gulls. They aren't as wild or handsome, but they're such happy, trusting little creatures. Last summer I called them my birds. Mother said they were like me, always busy in their quiet gray clothes, staying near the shore and chirping their small, contented song.
          emotion: happy
        - id: ch04-b05
          speaker: beth
          text: You're the gull, Jo. You're strong and wild. You love the storm and the wind, and you fly far out over the sea, perfectly happy on your own. Meg is the turtledove. Amy is like that lark she writes about. She keeps trying to rise among the clouds, then she always comes back down to her nest.
        - id: ch04-b06
          speaker: beth
          text: Dear little Amy! She's so ambitious, but her heart is kind and tender. No matter how high she flies, she will never forget home. I hope I see her again. She feels so far away.
          emotion: sad
        - id: ch04-b07
          speaker: jo
          text: She'll be home in the spring, and you will be ready to see her and enjoy every minute. By then, I mean to have you healthy and rosy again.
        - id: ch04-b08
          speaker: narrator
          text: Jo began eagerly, amazed by this new change in Beth. Her shy sister could speak so freely now. The thoughts came aloud without seeming to cost her any effort.
        - id: ch04-b09
          speaker: beth
          text: Jo, dear, please don't hope anymore. Hope won't change this. I know it won't. We don't have to spend our time being miserable. We can enjoy being together while we wait. We can still have happy days. I don't suffer very much, and I think the tide can go out gently if you help me.
          emotion: calm
        - id: ch04-b10
          speaker: narrator
          text: Jo bent down and kissed Beth's peaceful face. With that silent kiss, she gave her whole heart and all her strength to her sister.
    - id: ch05
      title: Home Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Beth had been right. When the sisters came home, no words were needed. Father and Mother could see plainly what they had prayed they would never have to see.
        - id: ch05-b02
          speaker: narrator
          text: The short journey had tired Beth. She went straight to bed, saying how glad she was to be home.
        - id: ch05-b03
          speaker: narrator
          text: When Jo came downstairs, she learned that she would not have to tell Beth's secret. Her father stood with his head against the mantel and did not turn when she entered. Her mother reached out both arms as if she needed help. Without a word, Jo went to comfort her.
