audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带含蓄的机智
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    jo:
      display_name: 乔
      tts:
        delivery: 爽朗敏捷，俏皮中带着真情
        timbre: 清脆而略带沙哑的青年女声
        pace: 明快利落
        pitch: 中音
    laurie:
      display_name: 劳里
      tts:
        delivery: 快活风趣，真挚时沉稳坦率
        timbre: 明亮温厚的青年男声
        pace: 轻快自然
        pitch: 中音偏低
    amy:
      display_name: 艾米
      tts:
        delivery: 优雅自持，亲密时柔情活泼
        timbre: 柔美清亮的青年女声
        pace: 从容流畅
        pitch: 中音偏高
    meg:
      display_name: 梅格
      tts:
        delivery: 温柔端庄，管教孩子时坚定亲切
        timbre: 柔和温暖的青年女声
        pace: 从容自然
        pitch: 中音偏高
    marmee:
      display_name: 马奇太太
      tts:
        delivery: 慈爱安详，担忧时仍温和克制
        timbre: 温暖沉静的成年女声
        pace: 平稳舒缓
        pitch: 中音偏低
    mr_march:
      display_name: 马奇先生
      tts:
        delivery: 温和儒雅，带安静的喜悦
        timbre: 柔和清朗的成年男声
        pace: 从容不迫
        pitch: 中音偏低
    mr_laurence:
      display_name: 劳伦斯先生
      tts:
        delivery: 庄重直率，严肃中藏着慈爱
        timbre: 低沉浑厚
        pace: 从容
        pitch: 低音
    mr_bhaer:
      display_name: 贝尔先生
      tts:
        delivery: 诚恳浑厚，对孩子温柔而幽默
        timbre: 洪亮温暖的成年男声
        pace: 沉稳自然
        pitch: 低音
  chapters:
    - id: ch01
      title: 第四十七章　收获时节
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 整整一年，乔和她的教授一面工作，一面等待。他们怀着希望，也彼此相爱。两人见面的机会不多，信却一封比一封长。劳里打趣说，纸价上涨总算找到了缘故。到了第二年，前景还是没有起色，马奇姑婆又忽然去世了。老太太虽然嘴巴刻薄，大家到底爱她。等最初的伤心慢慢过去，他们才知道，她把普拉姆菲尔德留给了乔。许多藏了很久的好愿望，也就有了实现的机会。
        - id: ch01-b02
          speaker: narrator
          text: 几星期后，全家聚在一起商量这份遗产。
        - id: ch01-b03
          speaker: laurie
          text: 那座老宅子很体面，能卖不少钱。你当然会卖掉它吧？
        - id: ch01-b04
          speaker: jo
          text: 不卖。
        - id: ch01-b05
          speaker: narrator
          text: 乔答得干脆，还摸了摸身边那只胖狮子狗。为了纪念它从前的女主人，她已经把它收养了。
        - id: ch01-b06
          speaker: laurie
          text: 难道你想搬进去住？
        - id: ch01-b07
          speaker: jo
          text: 正是这么想的。
        - id: ch01-b08
          speaker: laurie
          text: 可那房子大得吓人，要好好维持可不便宜。花园和果园就得雇两三个人，种田恐怕也不是贝尔最拿手的事。
        - id: ch01-b09
          speaker: jo
          text: 只要我开口，他会愿意试试的。
        - id: ch01-b10
          speaker: laurie
          text: 你还想靠庄园的收成过日子？说起来像天堂，真做起来可够辛苦。
        - id: ch01-b11
          speaker: jo
          text: 我们要种的东西可有赚头了。
        - id: ch01-b12
          speaker: laurie
          text: 那么请问，贝尔太太，这是什么了不起的庄稼？
        - id: ch01-b13
          speaker: jo
          text: 男孩子。我要给小男孩们办一所学校，让它温暖、快乐，像一个家。我来照顾他们，弗里茨教他们功课。
        - id: ch01-b14
          speaker: laurie
          text: 这可真是只有乔才想得出的计划！你们说，是不是太像她了？
        - id: ch01-b15
          speaker: narrator
          text: 劳里转头看向全家，大家脸上的惊讶一点不比他少。
        - id: ch01-b16
          speaker: marmee
          text: 我喜欢这个主意。
        - id: ch01-b17
          speaker: mr_march
          text: 我也喜欢。
        - id: ch01-b18
          speaker: narrator
          text: 马奇先生一想到终于能把苏格拉底式的教育法用在现代青年身上，立刻欢迎起这个计划。
        - id: ch01-b19
          speaker: meg
          text: 乔以后可有得操心了。
        - id: ch01-b20
          speaker: narrator
          text: 她说着，手还抚在那个占满自己心思的儿子头上。
        - id: ch01-b21
          speaker: mr_laurence
          text: 乔做得到，还会做得很快活。这主意太好了，快把你的打算都说给我们听。
        - id: ch01-b22
          speaker: narrator
          text: 劳伦斯先生早就想帮这对恋人，只是知道他们不肯收下他的帮助。
        - id: ch01-b23
          speaker: jo
          text: 我就知道您会赞成。艾米也赞成，我从她眼睛里看得出来。只是她向来谨慎，总要先在心里想周全。你们可别以为这是我刚冒出来的念头。这个心愿，我已经藏了很久。还没遇见弗里茨的时候，我就常想，等我有了钱，家里也不再需要我，我要租一座大房子，照料那些没娘疼、贫穷又孤单的小男孩。趁一切还来得及，让他们也过些快活日子。我见过太多孩子，只因为最要紧的时候没人拉一把，就走上了歪路。我喜欢为他们做点事。我好像知道他们缺什么，也懂他们受的苦。啊，我真想做他们的母亲！
        - id: ch01-b24
          speaker: narrator
          text: 马奇太太向女儿伸出手。乔握住母亲的手，眼里含着泪，脸上却在笑。她又带着从前那股热烈劲儿说下去，大家已经很久没见她这样了。
        - id: ch01-b25
          speaker: jo
          text: 我从前跟弗里茨说过这个愿望。他说，这也正合他的心意，还答应等我们有钱就试试。祝福他那颗亲爱的心吧。他一辈子都在帮助穷孩子，可不是忙着发财。他永远也富不了，钱在他口袋里根本留不住。现在多亏那位好姑婆，她疼我远远超过我应得的，我总算有钱了，至少我自己觉得很富。只要学校办得顺利，我们住在普拉姆菲尔德完全能过下去。那地方天生就适合男孩子。房子够大，家具结实朴素，住几十个也不挤。外面的场地更好，他们能帮着料理花园和果园。这种活儿对身体有好处，对吧，爸爸？弗里茨可以照自己的方法训练他们、教导他们，爸爸也能帮忙。我呢，就管他们吃饭，照顾他们，疼他们，也管教他们。妈妈是我的靠山。我一直想让身边有许多男孩子，怎么都不嫌多。现在，我能把整座房子装满，好好疼爱那些小家伙了。想想看，这多快活呀。普拉姆菲尔德归我，还有一大片男孩子跟我一起享用它！
        - id: ch01-b26
          speaker: narrator
          text: 乔挥着双手，陶醉地叹了一口气。全家立刻笑成一片。劳伦斯先生笑得尤其厉害，大家几乎担心他要笑出毛病来。等声音终于小下去，乔一本正经地开了口。
        - id: ch01-b27
          speaker: jo
          text: 我可不觉得这有什么好笑。由我的教授开一所学校，我住在自己的庄园里，不是再自然、再合适不过吗？
        - id: ch01-b28
          speaker: laurie
          text: 瞧，她已经摆起庄园主人的架子了。不过我还想请教，你准备拿什么养活这么大一家子？学生要全是小叫花子，你这收成在世人眼里恐怕赚不了钱啊，贝尔太太。
        - id: ch01-b29
          speaker: jo
          text: 得了，泰迪，别只顾着泼冷水。我当然也收有钱人家的孩子，也许开头还只能收这样的。等学校站稳了，再添一两个小叫花子调调味。富人家的孩子也常常缺人照顾、缺人安慰。我见过孩子被丢给仆人，也见过反应慢的孩子被逼着赶进度，受尽折磨。有的孩子是没人管，或被管错了，才渐渐变坏。有的没有母亲。就连最好的孩子，也要熬过那段半大不小、手脚笨拙的年纪。偏偏这时候，他们最需要耐心和善意。大人却取笑他们，把他们推来推去，恨不得眼不见为净，还盼着他们一转眼就从漂亮孩子长成出色青年。他们很少抱怨，因为他们都是勇敢的小家伙，可他们心里明白。我也多少走过那段路，所以我都懂。我就是喜欢这些小熊崽子。我要让他们知道，哪怕胳膊腿不听使唤，脑子乱成一团，我还是看得见他们那颗热乎乎、诚实又想学好的男孩心。再说，我也有经验。难道我没带大过一个男孩，让他成了全家的骄傲吗？
        - id: ch01-b30
          speaker: laurie
          text: 我可以作证，你确实下过不少功夫。
        - id: ch01-b31
          speaker: narrator
          text: 劳里感激地望着她。
        - id: ch01-b32
          speaker: jo
          text: 而且我的成果比预想的还好。你看，你现在是个稳重明理的生意人，用自己的钱做了数不清的好事。你攒下的不是钞票，是穷人的祝福。可你又不只是个生意人。你喜欢一切美好的东西，自己欣赏，也像从前一样让别人跟你一起欣赏。泰迪，我真为你骄傲。你一年比一年好，大家都看得出来，只是你不许人家说。等我有了自己的羊群，我就指着你告诉他们，小伙子们，这就是你们的榜样。
        - id: ch01-b33
          speaker: narrator
          text: 可怜的劳里一下不知道该往哪里看。虽然已经长大，这一通夸奖把所有赞许的目光都引到他身上，他从前那股羞涩又回来了。
        - id: ch01-b34
          speaker: laurie
          text: 乔，你这也夸得太过了。你们为我做的事，我怎么谢也谢不完，只能尽量不叫你们失望。你近来多少把我撇在一边，可我得到的帮助还是世上最好的。所以我真有一点长进，也该谢谢这两位。
        - id: ch01-b35
          speaker: narrator
          text: 他说着，一只手轻轻放在祖父头上，另一只手搭在艾米金色的头发上。这三个人总是亲密地待在一起。
        - id: ch01-b36
          speaker: jo
          text: 家真是世上最美好的东西！等我也有了自己的家，但愿它能像我最熟悉、最珍爱的这三个家一样幸福。要是约翰和我的弗里茨也在，人间就真有一座小天堂了。
        - id: ch01-b37
          speaker: narrator
          text: 最后那句话，乔说得轻了些。那天晚上，一家人满怀幸福，商量、憧憬、筹划了很久。乔回到房间，心里的快乐怎么也平静不下来。她只好跪在那张一直摆在自己床边的空床旁，温柔地怀念贝丝。
        - id: ch01-b38
          speaker: narrator
          text: 接下来这一年，所有事情都来得又快又称心。乔还没弄清是怎么发生的，自己已经结了婚，也在普拉姆菲尔德安了家。没过多久，六七个男孩像蘑菇一样冒了出来，一个个长得出奇兴旺。他们有的穷，有的富。劳伦斯先生一发现哪个贫苦孩子叫人心酸，就来请贝尔夫妇收留，还表示愿意拿钱供养。这个狡猾的老先生用这种办法绕过了乔的骄傲，不断给她送来最合心意的学生。
        - id: ch01-b39
          speaker: narrator
          text: 开头当然很难。乔犯过不少稀奇古怪的错误，好在聪明的教授一直掌着舵，带她避开大风浪。就连最无法无天的小淘气，最后也叫他们收服了。乔实在爱极了那“一大片男孩子”。可怜又亲爱的马奇姑婆若还活着，看见整洁、秩序森严的普拉姆菲尔德被无数汤姆、迪克和哈里占领，不知道要怎样哀号。
        - id: ch01-b40
          speaker: narrator
          text: 说起来，这倒像一种诗意的报应。从前，方圆几英里的男孩都怕那位老太太。如今，这些小小的流亡者可以放开肚子吃以前不许碰的李子。粗野的靴子把碎石踢得到处都是，也没人训他们。他们还能在大草地上打板球。过去，那头脾气暴躁的“弯角母牛”总爱引诱鲁莽的少年靠近，再把他们顶上天。现在，这里成了男孩的天堂。劳里提议，不如把它叫作“贝尔花园”，既向主人致敬，也很配这里的居民。
        - id: ch01-b41
          speaker: narrator
          text: 这所学校从没时髦过，教授也没能发财。不过，它正好成了乔盼望的样子。这里是一个快乐而温暖的家，专门留给那些需要教导、照顾和善意的男孩。大房子里的每个房间很快都住满了，花园里每一小块地也有了主人。孩子们获准养宠物，谷仓和棚屋便成了一座真正的动物园。
        - id: ch01-b42
          speaker: narrator
          text: 每天三顿饭，乔坐在长桌一头，隔着两排快乐的小脸，向另一头的弗里茨微笑。孩子们用亲热的眼神看她，把信赖的话说给她听，心里也满是感激。人人都爱“贝尔妈妈”。乔终于有了足够多的男孩，而且怎么也不厌烦。当然，他们绝不是天使。有几个还让教授和教授夫人费尽了心。
        - id: ch01-b43
          speaker: narrator
          text: 可乔始终相信，再顽皮、再无礼、再磨人的小淘气，心里也藏着一块善良的地方。这份信念给了她耐心，也教她想出办法。时间久了，她真的成功了。凡间的男孩没有谁能抵挡太久。贝尔爸爸像太阳一样仁慈地照着他，贝尔妈妈又肯宽恕他七十个七次。
        - id: ch01-b44
          speaker: narrator
          text: 孩子们的友谊，对乔珍贵极了。他们犯错以后，悔恨地抽着鼻子，小声认错。他们把那些逗人发笑或叫人心软的秘密告诉她，也把热情、希望、打算，甚至麻烦都交给她。这一切只会让乔更疼他们。这里有反应慢的、害羞的、体弱的和爱闹腾的孩子。有的说话含混，有的口吃，有一两个腿脚不便，还有一个有四分之一黑人血统的快活男孩。别处不肯收他，“贝尔花园”却欢迎他，哪怕有人预言，这会毁掉整所学校。
        - id: ch01-b45
          speaker: narrator
          text: 是的，乔在那里过得很幸福。工作虽重，牵挂虽多，四周还永远闹哄哄的，她却全心享受这一切。男孩们的喝彩，比世上任何赞誉都更让她满足，因为如今，她只给这一群满腔热情、信赖她又崇拜她的孩子讲故事。
        - id: ch01-b46
          speaker: narrator
          text: 一年又一年过去，乔又添了两个亲生的小男孩。一个叫罗布，用的是外祖父的名字。另一个叫泰迪，是个无忧无虑的小娃娃。他既有父亲像阳光一样的好脾气，又有母亲那股活泼劲儿。两个孩子卷在这一大群男孩的漩涡里，居然平平安安地长大了。外祖母和姨妈们都觉得不可思议，可他们偏偏像春天的蒲公英一样茁壮。那些粗手粗脚的小保姆个个都疼他们，也把他们照顾得很好。
        - id: ch01-b47
          speaker: narrator
          text: 普拉姆菲尔德一年里有许多节日，最快乐的就是每年摘苹果的那一天。马奇家、劳伦斯家、布鲁克家和贝尔家都会全员出动，好好玩上一整天。乔结婚五年后，又迎来了这样一个果实累累的节日。
        - id: ch01-b48
          speaker: narrator
          text: 那是十月里一个温润的日子。空气清爽，让人精神振奋，连血液都仿佛在脉搏里快活地跳。老果园披上了节日盛装。金菊和紫菀沿着长满青苔的矮墙开了一圈。蚱蜢在枯草间轻轻跳跃，蟋蟀唧唧地叫，像宴席上吹笛的小仙人。松鼠忙着收自己的小庄稼，鸟儿在小路旁的桤木丛中啁啾告别。每棵树都准备好了，只等人一摇，就落下一阵红苹果或黄苹果的雨。
        - id: ch01-b49
          speaker: narrator
          text: 所有人都来了。大家又笑又唱，爬上树，也从树上跌下来。人人都说，从没遇过这么完美的天气，也没见过这么快活的一群人。眼前的欢乐朴素极了，可大家沉浸其中，仿佛世上从来没有忧虑和悲伤。
        - id: ch01-b50
          speaker: narrator
          text: 马奇先生悠闲地四处踱步，一面给劳伦斯先生背诵塔瑟、考利和科卢梅拉的诗文，一面品尝“温柔苹果酿出的醇美汁液”。
        - id: ch01-b51
          speaker: narrator
          text: 教授举着一根长杆当长矛，像个结实的条顿骑士，在一道道绿色长廊里来回冲锋。他领着男孩们组成一队钩梯消防兵，一会儿贴地翻滚，一会儿凌空腾跃，做出种种惊人的动作。
        - id: ch01-b52
          speaker: narrator
          text: 劳里一心照看小孩子。他让年幼的女儿坐在一只蒲式耳大筐里，当作骑马。他又把黛西抱上树看鸟巢，还得及时拦住爱冒险的罗布，免得孩子摔断脖子。马奇太太和梅格坐在苹果堆里，像两位果树女神，忙着分拣源源不断送来的收获。
        - id: ch01-b53
          speaker: narrator
          text: 艾米带着美丽又慈爱的神情，给各组人画速写，同时照看一个脸色苍白的男孩。小男孩把拐杖放在身边，满眼崇拜地望着她。
        - id: ch01-b54
          speaker: narrator
          text: 这一天，乔简直如鱼得水。她把裙摆别了起来，帽子歪得不知跑到脑袋哪一边，腋下还夹着小宝宝。她兴冲冲地到处奔忙，随时准备参加下一场热闹。小泰迪像有神灵护着，什么也伤不着他。这个男孩嗖地把他举上树，那个男孩又背着他飞奔。溺爱他的父亲还拿酸涩的红褐苹果喂他。
        - id: ch01-b55
          speaker: narrator
          text: 教授怀着一种日耳曼人的错觉，总觉得婴儿什么都消化得了，从腌卷心菜、纽扣和钉子，一直到自己的小鞋。乔一点也不担心。她知道小泰迪迟早会重新出现，平安无事，脸蛋红润，浑身肮脏，神情却安安稳稳。每次孩子回到手里，她都会热烈欢迎，因为她实在太爱自己的孩子了。
        - id: ch01-b56
          speaker: narrator
          text: 到了四点，热闹暂时停了。篮子空在一旁，摘苹果的人也坐下来歇息，彼此比较衣服上撕开的口子和身上的淤青。随后，乔和梅格领着一队大男孩，在草地上摆开晚餐。户外茶点永远是这一天最后、也是最叫人期待的乐事。
        - id: ch01-b57
          speaker: narrator
          text: 每逢这时候，这片土地真像流着奶与蜜。男孩们不用端端正正坐在桌边，爱怎么吃就怎么吃。对男孩的心来说，自由是最美味的调料。他们把这份难得的特权用到了极致。有人倒立着喝牛奶，拿自己做有趣的实验。有人一边玩跳背，一边趁每次停下咬一口馅饼。小甜饼像种子一样撒得满地都是，苹果酥则停在树枝上，仿佛一种新奇的鸟。小姑娘们另摆了一桌私人茶会，泰迪随心所欲地在各种吃食之间游荡。
        - id: ch01-b58
          speaker: narrator
          text: 等谁也吃不下了，教授提议举杯。每次这样的聚会，第一句正式的祝酒词总是一样。
        - id: ch01-b59
          speaker: mr_bhaer
          text: 让我们祝福马奇姑婆！
        - id: ch01-b60
          speaker: narrator
          text: 这个善良的人从没忘记自己受过她多少恩惠，所以说得格外真诚。男孩们也受过教导，要一直记着她，于是都安静地喝下这一杯。
        - id: ch01-b61
          speaker: narrator
          text: 接下来，大家为外祖母的六十岁生日祝酒，祝她长寿，还一连欢呼三轮，每轮三声。这一回，所有人都喊得无比卖力。欢呼一旦开始，就很难停下来。于是从学校的特别恩主劳伦斯先生，一直到一只为了寻找小主人、意外跑出地盘的豚鼠，人人的健康都被祝愿了一遍。
        - id: ch01-b62
          speaker: narrator
          text: 接下来，身为大外孙的德米向这一天的女王献上礼物。东西实在太多，得装在独轮车里推到庆祝的地方。几件礼物看起来很滑稽，可旁人眼里的缺点，到了外祖母那里，全成了点缀，因为每一件都是孩子们亲手做的。
        - id: ch01-b63
          speaker: narrator
          text: 黛西耐心地在手帕边缘缝下一针又一针。在马奇太太眼里，这比最精美的刺绣还珍贵。德米做出了一件机械奇迹，虽然它的盖子怎么也合不上。罗布做的脚凳，几条腿高低不平，坐上去摇摇晃晃，外祖母却说，摇起来很舒服。
        - id: ch01-b64
          speaker: narrator
          text: 艾米的孩子送来一本昂贵的书。可书里再漂亮的页面，也比不过其中写着几个歪歪倒倒大写字母的那一页。上面写着：“献给亲爱的外祖母——小贝丝。”
        - id: ch01-b65
          speaker: narrator
          text: 献礼的时候，男孩们神神秘秘地不见了。马奇太太想向孩子们道谢，却激动得说不出话。小泰迪正拿围兜替她擦眼泪，教授忽然唱了起来。紧接着，头顶一个又一个声音加入了歌声。
        - id: ch01-b66
          speaker: narrator
          text: 那支看不见的合唱队藏在树间，歌声从这一棵传向另一棵。男孩们用全部真心唱着那首小歌。歌词是乔写的，劳里谱了曲，教授又把孩子们训练到了最好的状态。这是从未有过的新节目，而且大获成功。
        - id: ch01-b67
          speaker: narrator
          text: 马奇太太怎么也压不住惊喜，坚持要和每一只没有羽毛的鸟儿握手。从高个子的弗朗茨和埃米尔开始，一直握到那个有四分之一黑人血统的小男孩。他的声音，是所有人里最甜美的。
        - id: ch01-b68
          speaker: narrator
          text: 节目结束后，男孩们四散跑开，去做最后一场嬉闹。节庆树下，只留下马奇太太和她的女儿们。
        - id: ch01-b69
          speaker: jo
          text: 我最大的心愿已经这样圆满地实现了。以后，我想我再也不该叫自己“倒霉的乔”了。
        - id: ch01-b70
          speaker: narrator
          text: 贝尔太太说着，把泰迪的小拳头从牛奶壶里拿出来。刚才，他正一心一意地在里面搅个不停。
        - id: ch01-b71
          speaker: amy
          text: 可你现在过的日子，跟很多年前想象的完全不一样。还记得我们那些空中楼阁吗？
        - id: ch01-b72
          speaker: narrator
          text: 艾米微笑着望向远处。劳里和约翰正在陪男孩们打板球。
        - id: ch01-b73
          speaker: jo
          text: 这两个亲爱的家伙！看着他们忘掉生意，痛痛快快玩上一整天，我心里真舒坦。那些空中楼阁，我当然记得。可现在回头看，我从前想要的生活又自私，又孤单，也太冷清了。我还是盼着有一天能写出一本好书，不过我等得起。我也相信，有了眼前这些经历和素材，那本书一定会写得更好。
        - id: ch01-b74
          speaker: narrator
          text: 如今，乔谈起所有男人，都带着母亲般的口吻。她先指了指远处活蹦乱跳的男孩，又指向父亲。马奇先生正扶着教授的手臂，两个人在阳光下来回散步，沉浸在一场彼此都很享受的谈话里。随后，乔又望向母亲。马奇太太像女王一样坐在女儿们中间，腿上和脚边围着她们的孩子。每个人仿佛都能从那张脸上得到帮助和幸福。在他们心中，那张脸永远不会衰老。
        - id: ch01-b75
          speaker: meg
          text: 我的空中楼阁，算是我们几个人里实现得最接近的。我当初的确想要许多了不起的东西，可我心里一直明白，只要有一个小小的家，有约翰，再有几个像这些孩子一样可爱的儿女，我就满足了。如今我全都有了。感谢上帝，我是世上最幸福的女人。
        - id: ch01-b76
          speaker: narrator
          text: 梅格把手放在高个子儿子的头上，脸上满是温柔而虔诚的满足。
        - id: ch01-b77
          speaker: amy
          text: 我的楼阁跟最初想的差别很大，可我一点也不想改。只是我和乔一样，并没有放弃所有艺术理想。我也不想只帮助别人实现他们对美的梦想。我已经开始照着小贝丝塑一尊像。劳里说，这是我做过最好的作品，我自己也这样觉得。我还想把它刻成大理石。这样，不管以后发生什么，我至少能永远留下小天使的模样。
        - id: ch01-b78
          speaker: narrator
          text: 艾米说着，一大滴眼泪落在怀中熟睡孩子的金发上。她唯一的女儿身体很弱，害怕失去孩子的阴影，一直笼罩着她的阳光。这副十字架改变了这对父母。共同的爱和悲伤，把他们紧紧连在一起。艾米变得更温柔、更深厚，也更有慈爱。劳里则一天比一天稳重、坚强而坚定。
        - id: ch01-b79
          speaker: narrator
          text: 他们渐渐明白，美貌、青春、好运，甚至爱情本身，都不能替最受祝福的人挡住操心、痛苦、失去和悲伤。因为每个人的一生都免不了落雨，总会有些日子阴暗、悲伤又凄迷。
        - id: ch01-b80
          speaker: marmee
          text: 亲爱的，我相信她一天比一天好起来了。别灰心，要怀着希望，快快乐乐地过日子。
          emotion: calm
        - id: ch01-b81
          speaker: narrator
          text: 心肠柔软的黛西从外祖母膝边俯下身，把自己红润的脸颊贴在小表妹苍白的脸上。
        - id: ch01-b82
          speaker: amy
          text: 有您鼓励我，又有劳里替我扛走一大半重担，我永远也不该灰心，妈妈。他从不让我看见自己的忧虑，对我却总是那么温柔，那么有耐心。他全心疼爱贝丝，又时时做我的支柱，安慰我。我怎么爱他都爱不够。所以，就算背着这副十字架，我还是能像梅格一样说，感谢上帝，我是个幸福的女人。
        - id: ch01-b83
          speaker: jo
          text: 我就更不用说了。谁都看得出来，我得到的幸福远远超过自己应得的。
        - id: ch01-b84
          speaker: narrator
          text: 乔的目光从善良的丈夫移到胖乎乎的孩子们身上。他们正在她身旁的草地上翻滚。
        - id: ch01-b85
          speaker: jo
          text: 弗里茨已经开始头发花白，身子发福。我呢，瘦得像一道影子，而且都三十岁了。我们永远不会有钱。说不定哪天夜里，普拉姆菲尔德还会烧起来。那个死不悔改的汤米·班斯，总爱躲在被窝里抽香蕨叶卷的雪茄，虽然他已经三次把自己点着了。可除了这些一点也不浪漫的事实，我真没什么可抱怨的。我这辈子从没这样快活过。请原谅我这么说，可我天天和男孩们住在一起，偶尔免不了学他们讲话。
        - id: ch01-b86
          speaker: marmee
          text: 是啊，乔。我想你的收成一定会很好。
        - id: ch01-b87
          speaker: narrator
          text: 马奇太太说着，赶走一只大黑蟋蟀。那家伙一直盯着泰迪，把孩子看得浑身不自在。
        - id: ch01-b88
          speaker: jo
          text: 我的收成还不到您的一半好呢，妈妈。您的收成就在这里。您这么多年耐心地播种、收割，我们永远也谢不尽您。
        - id: ch01-b89
          speaker: narrator
          text: 乔说这话时，那股充满爱意的急切劲儿又回来了。她这一辈子都不会改变。
        - id: ch01-b90
          speaker: amy
          text: 但愿一年又一年，麦子越来越多，稗子越来越少。
        - id: ch01-b91
          speaker: meg
          text: 好大的一捆麦穗。不过我知道，您心里装得下，亲爱的妈妈。
        - id: ch01-b92
          speaker: narrator
          text: 马奇太太感动到了心底。她说不出别的话，只能张开双臂，仿佛要把儿女和孙辈全都拥进怀里。她的脸上，她的声音里，满是一个母亲的爱、感激和谦逊。
        - id: ch01-b93
          speaker: marmee
          text: 啊，我的姑娘们，无论你们活到多大年纪，我都不可能再祝愿你们得到比此刻更大的幸福了！
          emotion: happy
