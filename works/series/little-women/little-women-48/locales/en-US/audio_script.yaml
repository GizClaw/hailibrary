  chapters:
    - id: ch01
      title: Jo's New Crop
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: For a year, Jo and her Professor worked and waited. They kept hoping, kept loving, met when they could, and wrote letters so long that Laurie blamed them for the rising price of paper. The second year opened more soberly. Their future looked no brighter, and Aunt March died without warning. They mourned the sharp-tongued old lady because, in spite of everything, they had loved her. Then they learned that she had left Plumfield to Jo, and grief made room for all kinds of joyful possibilities.
        - id: ch01-b02
          speaker: narrator
          text: A few weeks later, the family gathered to discuss the old estate. Laurie naturally assumed Jo would sell it.
        - id: ch01-b03
          speaker: laurie
          text: It's a grand old place, and it ought to bring you a very good price.
        - id: ch01-b04
          speaker: jo
          text: I'm not selling it.
        - id: ch01-b05
          speaker: narrator
          text: Jo gave her answer while petting Aunt March's fat poodle, which she had adopted for his former mistress's sake.
        - id: ch01-b06
          speaker: laurie
          text: You can't mean to live there.
        - id: ch01-b07
          speaker: jo
          text: That's exactly what I mean.
        - id: ch01-b08
          speaker: laurie
          text: Jo, the house is enormous. Keeping it up will cost a fortune. The orchard and garden alone need several men, and I can't picture Bhaer as a farmer.
        - id: ch01-b09
          speaker: jo
          text: He'll give farming a try if I ask him.
        - id: ch01-b10
          speaker: laurie
          text: And you'll live on what the land produces? It sounds like paradise, but it will be terribly hard work.
        - id: ch01-b11
          speaker: jo
          text: We're planning to grow a very profitable crop.
        - id: ch01-b12
          speaker: narrator
          text: Jo laughed, and Laurie asked what this remarkable crop might be.
        - id: ch01-b13
          speaker: jo
          text: Boys. I want a school for little fellows, a good, happy place that feels like home. I'll care for them, and Fritz will teach them.
        - id: ch01-b14
          speaker: laurie
          text: That is the most Jo-like plan I ever heard! Isn't it just like her?
        - id: ch01-b15
          speaker: narrator
          text: He appealed to the family, who looked every bit as surprised as he did.
        - id: ch01-b16
          speaker: mrs_march
          text: I like the idea.
        - id: ch01-b17
          speaker: mr_march
          text: So do I.
        - id: ch01-b18
          speaker: narrator
          text: Mr. March was already pleased by the thought of trying the Socratic way of teaching on modern boys. Meg, stroking the head of her beloved little son, worried about the burden.
        - id: ch01-b19
          speaker: meg
          text: It will be an enormous responsibility for Jo.
        - id: ch01-b20
          speaker: mr_laurence
          text: She can manage it, and she'll be happy doing it. It's a splendid plan. Come now, Jo, tell us everything.
        - id: ch01-b21
          speaker: narrator
          text: Mr. Laurence had long wanted to help the two lovers, though he knew they would never simply take his money.
        - id: ch01-b22
          speaker: jo
          text: I knew you'd support me, sir. Amy does too. I can see it in her eyes, though she's sensibly thinking it over before she speaks. And all of you must understand, this isn't some sudden whim. I've wanted it for years. Before Fritz came, I used to imagine making my fortune, waiting until no one needed me at home, and then renting a large house. I'd find poor, lonely little boys with no mothers, take care of them, and give them some happiness before it was too late. So many boys go wrong because help doesn't reach them when they need it. I understand their troubles, and I love helping them. Oh, how I'd love to be a mother to them!
        - id: ch01-b23
          speaker: narrator
          text: Mrs. March reached out. Jo took her hand with tears in her eyes, smiling as the old enthusiasm came pouring back. Her family had not seen that bright fire in her for a long while.
        - id: ch01-b24
          speaker: jo
          text: I told Fritz once, and he said he'd love it too. We agreed to try when we got rich. Bless him, he's spent his whole life helping poor boys. Getting rich is another matter. Money never stays in his pocket long enough to save. But now my dear old aunt, who loved me far better than I deserved, has made me rich. At least, I feel rich. With a thriving school, we can live perfectly well at Plumfield. The place was made for boys. The house is huge, the furniture is plain and sturdy, and there's room for dozens inside. Outside, they can work in the garden and orchard. That's healthy work, isn't it, Father? Fritz can teach and guide them his own way, with Father helping him. I can feed them, nurse them, pet them, and scold them, and Mother will stand beside me. I've always wanted crowds of boys. Now I can fill the whole house and love every one of the little dears. Just think of it. Plumfield will be mine, with a whole wilderness of boys to share it!
        - id: ch01-b25
          speaker: narrator
          text: Jo flung out her hands and sighed with delight. The family burst into laughter, and Mr. Laurence laughed so hard that they feared for him. When Jo could finally be heard, she spoke with great dignity.
        - id: ch01-b26
          speaker: jo
          text: I can't see what's funny. Nothing could be more sensible than my Professor opening a school while I choose to live on my own estate.
        - id: ch01-b27
          speaker: laurie
          text: Listen to her putting on airs already. But tell me, Mrs. Bhaer, how will you pay for this fine establishment? If every pupil is a ragged little waif, your crop won't earn much money.
        - id: ch01-b28
          speaker: jo
          text: Don't throw cold water on it, Teddy. Of course I'll have pupils who can pay, perhaps only those at first. Once we're established, I can add a poor boy or two for variety. Rich children need comfort and care too. Some are left entirely to servants. Some are pushed before they're ready, which is cruel. Some behave badly because no one has guided them, and some lose their mothers. Even the best boys must pass through that awkward age when they need the most kindness and patience. People laugh at them, shove them aside, hide them away, and expect them to change overnight from pretty children into fine young men. Brave little souls, they rarely complain, but they feel it. I know because I've lived through some of it myself. I care especially for those young bears. Under the clumsy bodies and confused minds, I can see honest, warm hearts trying to do right. Besides, I have experience. Didn't I raise one boy who became the pride of his family?
        - id: ch01-b29
          speaker: laurie
          text: I'll gladly swear that you tried.
        - id: ch01-b30
          speaker: narrator
          text: His look was full of gratitude.
        - id: ch01-b31
          speaker: jo
          text: And I did better than I ever hoped. Here you are, steady and sensible, using your money to do good and storing up poor people's blessings instead of more dollars. You aren't only a businessman. You still love beautiful things, enjoy them, and share them, just as you always did. I'm proud of you, Teddy. You grow better every year, and everyone sees it, even if you won't let us say so. When I have my boys, I'll point to you and tell them, "There is your example."
        - id: ch01-b32
          speaker: narrator
          text: Laurie had no idea where to look. He was a man now, but the old bashfulness returned when every approving face turned toward him.
        - id: ch01-b33
          speaker: laurie
          text: Jo, that's too much. All of you have done more for me than I can ever repay, except by trying not to disappoint you. You've rather dropped me lately, but I've still had the best help anyone could ask for. If I've made anything of myself, thank these two.
        - id: ch01-b34
          speaker: narrator
          text: He rested one hand on his grandfather's head and the other on Amy's golden hair. Those three were seldom far apart.
        - id: ch01-b35
          speaker: jo
          text: Families are the most beautiful things in the world! When I have one, I hope it will be as happy as the three families I love best. If only John and my Fritz were here, this would be a little heaven on earth.
        - id: ch01-b36
          speaker: narrator
          text: Her voice softened. That night, after hours of family plans and happy hopes, Jo went upstairs with a heart too full to settle. She knelt beside the empty bed that always stood near her own, and found peace in tender thoughts of Beth.
    - id: ch02
      title: The Bhaer-garten
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The year that followed was astonishing. Happy changes came so quickly that Jo hardly knew what was happening. Soon she was married and living at Plumfield. Then six or seven boys appeared almost like mushrooms and began to thrive. Some could pay and some could not. Whenever Mr. Laurence discovered a child in desperate need, he begged the Bhaers to take him and offered a little money for his care. In that sly way, he slipped past Jo's pride and filled the school with exactly the kind of boys she loved most.
        - id: ch02-b02
          speaker: narrator
          text: The beginning was hard, and everything seemed uphill. Jo made some odd mistakes, but the wise Professor guided her through the rough water, and even the wildest little rascal was won over at last. Jo delighted in her wilderness of boys. Aunt March, had she seen it, would have mourned over every inch of her tidy, orderly Plumfield. For miles around, she had once been the terror of young trespassers. Now those same exiles ate the forbidden plums whenever they pleased. They scuffed the gravel with muddy boots and played cricket in the big field, right where the ill-tempered cow with the crooked horn had once dared reckless boys to come near enough to be tossed. No one scolded them. It was poetic justice. Plumfield became a boys' paradise, and Laurie proposed a new name, the Bhaer-garten, to honor its master and suit its lively inhabitants.
        - id: ch02-b03
          speaker: narrator
          text: The school never became fashionable, and Professor Bhaer never made a fortune. It became exactly what Jo had wanted, a happy, homelike place for boys who needed teaching, care, and kindness. Every room filled up. Every garden patch found an owner. Barn and shed turned into a menagerie because pets were welcome. Three times a day, Jo sat at the head of a long table and smiled at Fritz. Rows of happy faces looked back at Mother Bhaer with affection, trust, and grateful hearts.
        - id: ch02-b04
          speaker: narrator
          text: Jo finally had all the boys she wanted, and she never tired of them. They were certainly no angels. Some brought both Professor and Professorin plenty of trouble and worry. Still, Jo believed there was one good place in the heart of even the naughtiest, boldest, most maddening boy. That faith gave her patience. With time, it gave her skill and success too. No ordinary boy could resist Father Bhaer's sunny kindness forever, especially when Mother Bhaer forgave him seventy times seven.
        - id: ch02-b05
          speaker: narrator
          text: The boys' friendship was precious to Jo. She treasured their guilty sniffs and whispered apologies after mischief, their funny or touching secrets, their eager hopes and plans, and even their misfortunes, which only made her love them more. Plumfield welcomed slow boys, shy boys, weak boys, noisy boys, boys who lisped or stuttered, and one or two who were lame. It also welcomed a merry little boy of mixed race whom no other school would accept. Some people predicted he would ruin Plumfield. He belonged there all the same.
        - id: ch02-b06
          speaker: narrator
          text: Jo was deeply happy, despite the labor, the worry, and the endless noise. Her boys' applause pleased her more than the world's praise ever had. Now the only stories she told were for that eager little flock. As the years passed, two sons of her own added to her happiness. Rob was named for Grandpa. Teddy was a cheerful, easygoing baby with his father's sunny nature and his mother's lively spirit. Their grandmother and aunts could not understand how those two survived in the whirl of boys, but they sprang up like dandelions in spring, faithfully loved and cared for by their rough young nurses.
    - id: ch03
      title: Apple-Picking Day
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Plumfield kept many holidays, but the yearly apple-picking was one of the best. The Marches, Laurences, Brookes, and Bhaers all came in full force and gave the whole day to it. Five years after Jo's wedding, they gathered for one of those fruitful festivals on a mellow October morning. The air was so fresh that spirits rose and blood seemed to dance. Goldenrod and asters edged the mossy walls. Grasshoppers leaped briskly through the dry grass, and crickets chirped like tiny musicians at a feast. Squirrels hurried through their own small harvest while birds called farewell from the alders along the lane. Every tree waited to shower down red or yellow apples at the first good shake.
        - id: ch03-b02
          speaker: narrator
          text: Everyone was there. They sang and laughed, climbed up and tumbled down, and agreed that no finer day or merrier company had ever existed. The old orchard had put on its holiday clothes. Everywhere they looked, the season seemed busy with its own harvest. For a few hours, every person there gave in to the simple pleasures of the moment as freely as if care and sorrow had vanished from the world.
        - id: ch03-b03
          speaker: narrator
          text: Mr. March wandered peacefully around, quoting Tusser, Cowley, and Columella to Mr. Laurence while enjoying what one poet called the gentle apple's wine-like juice. Professor Bhaer charged up and down the green rows like a stout German knight, carrying a pole for a lance and leading his troop. Behind him, the boys turned themselves into a hook-and-ladder company. Between the branches and the grass, they performed marvels of tumbling both high and low.
        - id: ch03-b04
          speaker: narrator
          text: Laurie devoted himself to the little children. He rode his small daughter in a bushel basket, lifted Daisy up near the birds' nests, and kept adventurous Rob from breaking his neck. Mrs. March and Meg sat among heaps of apples, sorting every new load. Amy sketched the different groups with a beautiful motherly look on her face. All the while, she watched over a pale little boy who adored her from his seat beside a small crutch.
        - id: ch03-b05
          speaker: narrator
          text: Jo was in her element. Her skirt was pinned up, her hat sat anywhere but on her head, and her baby rode under one arm while she rushed toward every new adventure. Little Teddy seemed to live under a charm. Nothing ever happened to him. One boy swung him into a tree, another galloped away with him on his back, and his indulgent father fed him sour apples. The Professor held the firm German belief that babies could digest anything from pickled cabbage to buttons, nails, and their own shoes. Jo did not worry. In time, Ted always returned safe, rosy, dirty, and peaceful, and she welcomed him warmly because she loved her babies with all her heart.
        - id: ch03-b06
          speaker: narrator
          text: At four o'clock, the baskets stood empty while the pickers examined torn clothes and bruises. Then Jo and Meg, helped by the older boys, spread supper on the grass. Tea outdoors was always the crowning pleasure of the day. Milk and honey seemed to flow everywhere. The boys did not have to sit at a table. They could eat however they pleased, because freedom was their favorite seasoning.
        - id: ch03-b07
          speaker: narrator
          text: They made the most of it. Some drank milk while standing on their heads. Others played leapfrog and ate pie whenever the game paused. Cookies scattered across the field, and apple turnovers perched in the trees like a strange new kind of bird. The little girls held a private tea party while Ted wandered among the food and did exactly as he pleased.
        - id: ch03-b08
          speaker: narrator
          text: When nobody could swallow another bite, the Professor called for the first regular toast, the one they always gave on such a day.
        - id: ch03-b09
          speaker: professor_bhaer
          text: To Aunt March. God bless her!
        - id: ch03-b10
          speaker: narrator
          text: He never forgot how much he owed her. The boys had learned to keep her memory green, and they drank quietly.
        - id: ch03-b11
          speaker: professor_bhaer
          text: And now, Grandma's sixtieth birthday! Long life to her, with three times three!
          emotion: happy
        - id: ch03-b12
          speaker: narrator
          text: They cheered with all their strength. Once they started, they could hardly stop. They toasted everyone from Mr. Laurence, their special patron, down to a startled guinea pig that had wandered off to find its young master.
        - id: ch03-b13
          speaker: narrator
          text: Demi, as the oldest grandchild, presented the day's queen with a mountain of gifts. There were so many that a wheelbarrow had to carry them to the celebration. Some were funny, but what other eyes might call flaws looked like ornaments to Grandma because the children had made every gift themselves. Every stitch Daisy had patiently put into her hemmed handkerchiefs meant more than the finest embroidery. Demi had produced a miracle of mechanical skill, though its cover would not close. Rob's footstool wobbled on uneven legs, which Mrs. March declared very soothing. Amy's child gave her an expensive book, but no beautiful printed page could compare with the one marked in tipsy capital letters, "To dear Grandma, from her little Beth."
        - id: ch03-b14
          speaker: narrator
          text: During the gifts, the boys mysteriously disappeared. Mrs. March tried to thank her children, but her voice failed. Teddy wiped her eyes with his pinafore. Then the Professor began to sing. A second voice joined from above, then another, until music traveled from tree to tree. The hidden boys sang with all their hearts. Jo had written the little song, Laurie had composed the music, and the Professor had trained his pupils to perform it beautifully.
        - id: ch03-b15
          speaker: narrator
          text: The surprise was something entirely new and a complete success. Mrs. March could hardly recover from her delight. She insisted on shaking hands with every one of those featherless birds, from tall Franz and Emil down to the little boy whose sweet voice had shone above the rest. Then the singers scattered for one final romp, leaving Mrs. March and her daughters together beneath the festival tree.
    - id: ch04
      title: Castles in the Air
      blocks:
        - id: ch04-b01
          speaker: jo
          text: I don't believe I should ever call myself unlucky Jo again. My greatest wish has come true more beautifully than I imagined.
        - id: ch04-b02
          speaker: narrator
          text: Mrs. Bhaer spoke while removing Teddy's fist from the milk pitcher, where he had been churning with great delight.
        - id: ch04-b03
          speaker: amy
          text: Your life is very different from the one you pictured years ago. Do you remember our castles in the air?
        - id: ch04-b04
          speaker: narrator
          text: Amy smiled toward Laurie and John, who were playing cricket with the boys.
        - id: ch04-b05
          speaker: jo
          text: Dear fellows! I love seeing them forget business and play for one whole day. Yes, I remember those castles. But the life I wanted then looks cold, lonely, and selfish to me now. I still hope to write a good book someday. I can wait, though. Everything I've lived through, and everything around us here, will make that book better when it comes.
        - id: ch04-b06
          speaker: narrator
          text: Jo pointed first to the lively boys, then to her father walking in the sunshine on the Professor's arm. The two men were deep in one of the talks they both loved. Last, she pointed to her mother, enthroned among her daughters, with children in her lap and around her feet. Every one of them still found comfort and happiness in the face that could never seem old to them.
        - id: ch04-b07
          speaker: meg
          text: My castle came closest to what I dreamed. I asked for grand things, of course, but in my heart I knew a little home, John, and dear children like these would satisfy me. I have them all, thank God. I'm the happiest woman in the world.
        - id: ch04-b08
          speaker: narrator
          text: Meg rested her hand on her tall son's head. Her face held tender, devout contentment.
        - id: ch04-b09
          speaker: amy
          text: My castle looks very different too, but I wouldn't change it. Like Jo, I haven't surrendered all my hopes as an artist, and I don't mean to spend my whole life only helping other people create beautiful things. I've started modeling a figure of my baby. Laurie says it's the best work I've ever done, and I think he's right. I mean to carve it in marble. Whatever happens, I'll be able to keep the image of my little angel.
        - id: ch04-b10
          speaker: narrator
          text: A large tear fell onto the golden hair of the sleeping child in Amy's arms. Her one dearly loved daughter was frail, and the fear of losing her cast a shadow across Amy's happiness. Yet the burden was changing both father and mother. Their shared love and sorrow drew them closer. Amy became sweeter, deeper, and more tender. Laurie grew more serious, strong, and steady. Together they were learning that beauty and youth cannot shut out care, and good fortune cannot prevent pain. Even love itself cannot keep loss and sorrow away from the happiest life. Some rain falls into every life. Some days must be dark, sad, and dreary.
        - id: ch04-b11
          speaker: mrs_march
          text: She is getting stronger. I'm sure of it, dear. Don't lose hope. Keep your courage and be happy.
          emotion: calm
        - id: ch04-b12
          speaker: narrator
          text: Tenderhearted Daisy bent from her grandmother's knee and pressed her rosy cheek against her little cousin's pale one.
        - id: ch04-b13
          speaker: amy
          text: I never should lose hope while I have you to lift me up, Marmee, and Laurie to carry more than half of every burden. He hides his own worry from me. He is patient and loving, devoted to Beth, and always my strength and comfort. I could never love him enough. So even with this one sorrow, I can say what Meg said. Thank God, I am a happy woman.
          emotion: happy
    - id: ch05
      title: The Harvest
      blocks:
        - id: ch05-b01
          speaker: jo
          text: I hardly need to say it. Anyone can see that I'm happier than I deserve.
        - id: ch05-b02
          speaker: narrator
          text: Jo looked from her good husband to her sturdy little boys tumbling over the grass beside her.
        - id: ch05-b03
          speaker: jo
          text: Fritz is turning gray and stout. I'm thirty and getting thin as a shadow. We'll never be rich, and Plumfield may burn down any night because that hopeless Tommy Bangs keeps smoking sweet-fern cigars under the blankets, even after setting himself on fire three times. Those facts aren't romantic, but I have no complaint. I've never been so jolly in my life. Forgive the word. Living with boys has taught me their expressions.
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: A large black cricket was staring Teddy down. Mrs. March frightened it away before answering Jo.
        - id: ch05-b05
          speaker: mrs_march
          text: Yes, Jo. I believe your harvest will be a good one.
        - id: ch05-b06
          speaker: jo
          text: It won't be half as good as yours, Mother. Your harvest is all around you, and we can never thank you enough for all the patient planting and gathering you've done.
        - id: ch05-b07
          speaker: amy
          text: I hope each year brings more wheat and fewer weeds.
        - id: ch05-b08
          speaker: meg
          text: It's a large bundle, Marmee dear, but your heart has room for every bit of it.
        - id: ch05-b09
          speaker: narrator
          text: Mrs. March was touched too deeply to say much. She opened her arms as though she could gather every child and grandchild close. Her face and voice were full of a mother's love, gratitude, and humility.
        - id: ch05-b10
          speaker: mrs_march
          text: Oh, my girls, no matter how long you live, I could never wish you any greater happiness than this!
          emotion: happy
