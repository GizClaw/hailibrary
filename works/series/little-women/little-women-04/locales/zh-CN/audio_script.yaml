audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机智，像在炉边从容讲述旧日家事
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情绪来得快，带一点男孩子气
        timbre: 明亮略带沙哑
        pace: 偏快
        pitch: 中低
    meg:
      display_name: 梅格
      tts:
        delivery: 温柔端庄，常带大姐姐式的认真
        timbre: 柔和圆润
        pace: 适中
        pitch: 中
    beth:
      display_name: 贝丝
      tts:
        delivery: 羞怯安静，话语真诚而体贴
        timbre: 轻柔温暖
        pace: 稍慢
        pitch: 中高
    amy:
      display_name: 艾米
      tts:
        delivery: 一本正经又有些自负，努力显得优雅
        timbre: 清脆稚嫩
        pace: 适中
        pitch: 偏高
    mrs_march:
      display_name: 马奇太太
      tts:
        delivery: 慈爱爽朗，沉稳中带着鼓励
        timbre: 饱满温暖
        pace: 从容
        pitch: 中低
    aunt_march:
      display_name: 马奇姑婆
      tts:
        delivery: 尖刻急躁，命令简短，偶尔流露藏不住的兴味
        timbre: 苍老尖细
        pace: 偏慢而干脆
        pitch: 中高
    mr_laurence:
      display_name: 劳伦斯先生
      tts:
        delivery: 严肃直接，善意藏在简短的话里
        timbre: 低沉浑厚
        pace: 从容
        pitch: 低
    mr_cutter:
      display_name: 卡特先生
      tts:
        delivery: 忙碌急促，答话直截了当
        timbre: 粗哑
        pace: 偏快
        pitch: 中低
    poor_woman:
      display_name: 穷女人
      tts:
        delivery: 疲惫谦卑，获助后满怀惊喜和感激
        timbre: 朴素微哑
        pace: 适中
        pitch: 中
    old_man:
      display_name: 老人
      tts:
        delivery: 质朴坚定，谈及牺牲时平静而坦然
        timbre: 苍老低沉
        pace: 缓慢
        pitch: 低
  chapters:
    - id: ch01
      title: 又要背起包袱
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 舞会后的第二天早晨，假期结束了。玩乐了一星期，再回去做那份不喜欢的差事，梅格怎么也提不起劲。
        - id: ch01-b02
          speaker: meg
          text: “唉，又得背起包袱往前走，真叫人难受。”
          emotion: sad
        - id: ch01-b03
          speaker: jo
          text: “要是天天都是圣诞节或者新年，多有意思！”
        - id: ch01-b04
          speaker: meg
          text: “真要天天过节，反而不会这么快活了。可我就是喜欢小小的晚餐会、鲜花和舞会，喜欢坐马车回家，读书休息，不必干活。别人家的姑娘都能过这种日子，我太羡慕她们了。”
        - id: ch01-b05
          speaker: narrator
          text: 她拿着两件破旧的衣裙比来比去，想挑一件不那么破的。
        - id: ch01-b06
          speaker: jo
          text: “咱们反正过不了那种日子，就别抱怨啦。像妈妈一样，高高兴兴背起包袱赶路吧。马奇姑婆简直是我背上的海上老人。不过等我学会不抱怨地背着她，她不是自己掉下来，就是会轻得让我感觉不到。”
        - id: ch01-b07
          speaker: narrator
          text: 乔被自己的想法逗乐了，梅格却高兴不起来。她的重担是四个娇生惯养的孩子，今天显得格外沉。她连蓝丝带也不想系，头发也懒得好好梳。
        - id: ch01-b08
          speaker: meg
          text: “每天只有那几个讨厌的小矮人看我，谁会在乎我漂不漂亮？我这辈子都得这么劳碌，偶尔才能玩一会儿。只因为家里穷，我不能像别的姑娘一样生活，将来准会变得又老、又丑、又刻薄。太不公平了！”
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: 梅格一脸委屈地下了楼。全家也都不大痛快。贝丝头疼，躺在沙发上搂着母猫和三只小猫。艾米没背会功课，又找不到胶鞋。乔一边吹口哨，一边乒乒乓乓地收拾东西。马奇太太急着写完一封必须赶早班邮递的信，汉娜也因为昨晚睡得太迟而满肚子不高兴。
        - id: ch01-b10
          speaker: narrator
          text: 乔先打翻墨水瓶，再扯断两根鞋带，最后一屁股坐扁了帽子。
        - id: ch01-b11
          speaker: jo
          text: “从没见过这么爱生气的一家人！”
          emotion: angry
        - id: ch01-b12
          speaker: amy
          text: “这里脾气最坏的人就是你！”
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: 艾米算错了题，眼泪落到石板上，把数字冲成一团。另一边，一只小猫爬上梅格的背，像刺果一样钩住衣服，偏偏又在手够不到的地方。
        - id: ch01-b14
          speaker: meg
          text: “贝丝，你再不把这些讨厌的猫关进地窖，我就叫人把它们淹死！”
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: 乔在笑，梅格在骂，贝丝苦苦央求，艾米又因为想不起九乘十二是多少而哭起来。
        - id: ch01-b16
          speaker: mrs_march
          text: “姑娘们，就安静一分钟吧！这封信一定要赶上早班邮递。你们这么闹，我一句话也写不成了。”
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: 屋里总算静了一会儿。汉娜大步走进来，把两只热馅饼放在桌上，又大步走了。这种馅饼早已成了家里的惯例。姑娘们没有别的暖手筒，便把馅饼叫作“手筒”。冬天早晨捧着它们走过又远又冷的路，双手会暖和许多。汉娜不管多忙、心情多坏，也绝不会忘记做。可怜的姑娘们没有别的午饭，而且往往要到两点以后才能回家。
        - id: ch01-b18
          speaker: jo
          text: “贝丝，好好搂着小猫，头就不疼了。再见，妈妈。咱们早晨都是小坏蛋，晚上回来一定变成天使。梅格，走吧！”
        - id: ch01-b19
          speaker: narrator
          text: 乔迈着重重的步子出了门，只觉得这群朝圣者出发时的样子实在不怎么样。走到街角以前，姐妹俩照例回头。母亲也总会站在窗前，对她们点头微笑，挥手告别。若少了这一眼，她们仿佛就熬不过一整天。无论她们出门时心情多坏，最后看见母亲那张慈爱的脸，总像晒到了阳光，心里也跟着亮起来。
        - id: ch01-b20
          speaker: jo
          text: “妈妈真该朝咱们挥拳头，不该送飞吻。世上哪还有比咱们更不知感恩的坏家伙？”
        - id: ch01-b21
          speaker: meg
          text: “别说这种吓人的话。”
        - id: ch01-b22
          speaker: narrator
          text: 梅格把脸藏在面纱深处，活像一位厌倦尘世的修女。乔的帽子却突然蹦下脑袋，眼看要独自飞走，她赶紧伸手抓住。
        - id: ch01-b23
          speaker: jo
          text: “我就爱用又有力、又有意思的词。”
        - id: ch01-b24
          speaker: meg
          text: “你爱怎么骂自己都行。我可不是坏蛋，也不是坏家伙，不许把我算进去。”
        - id: ch01-b25
          speaker: jo
          text: “你只是命运多舛，今天又因为不能一直享受富贵生活而特别别扭。等我发了财，就让你尽情坐马车、吃冰激凌、穿高跟鞋、收鲜花，再找红头发的男孩陪你跳舞。”
        - id: ch01-b26
          speaker: meg
          text: “乔，你真荒唐！”
        - id: ch01-b27
          speaker: narrator
          text: 梅格还是笑了，心里也舒服了些。
        - id: ch01-b28
          speaker: jo
          text: “幸亏我荒唐。要是我也像你一样摆出受尽摧残的样子，咱们可就糟了。我总能找到一点好玩的事，让自己撑下去。别再说丧气话，晚上高高兴兴地回家。”
        - id: ch01-b29
          speaker: narrator
          text: 乔鼓励似的拍了拍姐姐的肩，两人便在路口分手，各自去往不同的方向。她们把热馅饼紧紧抱在怀里，也都努力打起精神，迎着寒风和积雪，走向辛苦的工作，还有那些一时无法满足的青春愿望。
    - id: ch02
      title: 梅格和乔的重担
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 马奇先生为了帮助一个遭遇不幸的朋友，赔掉了自己的家产。两个大女儿便请求父母，至少让她们也做点事情，分担自己的生活费用。父母相信，一个人越早培养干劲、勤劳和独立越好，于是答应了。姐妹俩满怀热忱地开始工作。不管路上有多少阻碍，只要一直保有这样的热忱，最后总会有所成就。
        - id: ch02-b02
          speaker: narrator
          text: 玛格丽特给人做家庭女教师，照看几个孩子。她拿着微薄的薪水，却觉得自己富有极了。梅格最喜欢舒适漂亮的生活，贫穷也最让她难受。她还记得从前的家多么美，生活多么安逸，那时根本不知道缺少东西是什么滋味。
        - id: ch02-b03
          speaker: narrator
          text: 她努力不去嫉妒，也不抱怨。可一个年轻姑娘，自然会向往漂亮的东西、快活的朋友、各种才艺和幸福的生活。在金家，她天天都能看到这些。金家的大女儿刚进入社交界，精美的舞会礼服和花束就在眼前。她们兴致勃勃地谈着剧院、音乐会、雪橇聚会和各种游乐，还随手把钱花在无关紧要的小东西上。这些钱买来的东西，对梅格来说却不知有多珍贵。梅格很少开口抱怨，偶尔却会觉得命运不公，对谁都生出怨气。她还不知道，真正能让人幸福的福分，自己已经拥有很多。
        - id: ch02-b04
          speaker: narrator
          text: 乔的差事是在马奇姑婆身边作伴。姑婆腿脚不便，需要一个手脚麻利的人伺候。马奇家刚遭难时，这位没有孩子的老太太提出收养一个姑娘。马奇夫妇拒绝了，她气得不轻。亲友都说，他们已经断送了从富有的姑婆那里继承财产的机会。
        - id: ch02-b05
          speaker: mrs_march
          text: “就是拿十二份家产来换，我们也不会舍掉女儿。不管贫穷还是富有，一家人都要守在一起，彼此相爱，快快乐乐地生活。”
        - id: ch02-b06
          speaker: narrator
          text: 姑婆有一阵不肯跟他们来往。后来，她在朋友家碰见乔，偏偏喜欢上那张滑稽的脸和直来直去的脾气，便叫乔来陪自己。乔很不情愿，可没有更好的差事，只好答应。没想到，所有人都很惊讶，因为两个人相处得颇为不错。她们偶尔也会掀起一场暴风雨。有一次乔甚至冲回家，说再也受不了了。可姑婆的怒气来得快，去得也快，很快便急着派人叫她回去，催得乔无法拒绝。说到底，乔心里其实颇喜欢这位火辣辣的老太太。
        - id: ch02-b07
          speaker: narrator
          text: 真正吸引乔的，大概是那间大书房。马奇姑父去世后，满屋好书只剩灰尘和蜘蛛作伴。乔还记得那位好心的老先生。他允许乔用大词典搭铁路和桥梁，给她讲拉丁文书里古怪图画的故事，还会在街上买姜饼送她。
        - id: ch02-b08
          speaker: narrator
          text: 那间昏暗的书房积着灰。高书架上的半身像俯视着她，旁边有舒适的椅子和地球仪。最要紧的是，那里有一整片书的荒野，任乔随意漫游。对她来说，这里就是极乐之境。姑婆只要打盹或者忙着会客，乔便溜进去，蜷在安乐椅里，像一条地道的书虫，贪婪地吞食诗歌、传奇、历史、游记和图画。
        - id: ch02-b09
          speaker: narrator
          text: 可快乐总是不长久。每当乔读到故事最要紧的地方、歌里最甜美的诗句，或者旅行家最危险的奇遇，尖厉的呼唤一定会响起来。
        - id: ch02-b10
          speaker: aunt_march
          text: “约瑟——芬！约瑟——芬！”
        - id: ch02-b11
          speaker: narrator
          text: 乔只好离开天堂，去绕毛线、洗狮子狗，或者连续几小时朗读贝尔沙姆的论文。
        - id: ch02-b12
          speaker: narrator
          text: 她一心想做一件非常了不起的事，究竟是什么，还得等以后才知道。眼下最让她难受的，是不能尽情读书、奔跑和骑马。她脾气急、舌头尖、又一刻也闲不住，总会惹出麻烦，日子便忽高忽低，既滑稽又让人心疼。不过，姑婆给她的磨炼正是她所需要的。想到自己正靠劳动养活自己，那个没完没了的呼唤也不能夺走她的快乐。
    - id: ch03
      title: 贝丝和艾米的小世界
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 贝丝太害羞，没法去学校。家里曾经试过，可她实在太痛苦，只好作罢，后来便由父亲在家教她。父亲离家以后，母亲又把才干和精力都投入援助士兵的协会。即便没人陪在身边，贝丝仍旧每天忠实地独自学习，尽自己最大的努力把功课做好。
        - id: ch03-b02
          speaker: narrator
          text: 她很会操持家务，常帮汉娜把屋子收拾得整齐舒适，好让在外工作的人回来休息。她不要别的报答，只盼大家爱她。她的日子又长又安静，却不孤单，也不空闲。那个小小的世界里，住满了她想象出来的朋友，而她自己就像一只忙碌的小蜜蜂。
        - id: ch03-b03
          speaker: narrator
          text: 每天早晨，贝丝还要唤醒六个娃娃，替它们穿衣服。她毕竟还是孩子，仍然爱这些小宝贝。六个娃娃没有一个完整漂亮。姐姐们长大后不要它们，艾米又不肯收旧的、丑的，最后全到了贝丝手里。正因为它们被别人嫌弃，贝丝反而更疼爱它们，还开了一所残疾娃娃医院。
        - id: ch03-b04
          speaker: narrator
          text: 她绝不会把针扎进娃娃棉花做的内脏，也不对它们说一句重话，更不会动手打它们。就连最难看的娃娃，也不会因为受冷落而伤心。她让它们个个有饭吃、有衣穿，生病时细心照料，平日里温柔搂抱，那份疼爱从不间断。
        - id: ch03-b05
          speaker: narrator
          text: 有一块娃娃残躯原先属于乔。它经历过动荡的一生，最后被扔进破布袋，像住进一座凄凉的贫民院。贝丝把它救出来，带进自己的避难所。娃娃没了头顶，她就给它系上一顶整洁的小帽。胳膊和腿也全没了，她便用毯子裹住它，把这些缺陷藏起来，还把自己最好的床让给这个长年卧病的娃娃。她从花束里挑出小花送给它，读书给它听，把它藏在外套下面带出去呼吸新鲜空气，还唱摇篮曲哄它。每天上床以前，她都要亲一亲那张脏兮兮的脸。谁要是知道她花了多少心思，就算一边笑，也一定会感动。
        - id: ch03-b06
          speaker: beth
          text: “我可怜的宝贝，愿你今晚睡个好觉。”
          emotion: calm
        - id: ch03-b07
          speaker: narrator
          text: 贝丝并不是天使，也是个会难过的小女孩。不能上音乐课，不能有一架好钢琴时，她常常会像乔说的那样，“哭上一小哭”。她那么热爱音乐，那么用心学习，又那么耐心地在那架叮当乱响的旧琴上练习，实在应该有人帮帮她。当然，这话并不是有意说给马奇姑婆听的。可是没有人帮忙，也没有人看见她独自擦掉落在黄色琴键上的泪水。那架琴总也调不准音。
        - id: ch03-b08
          speaker: narrator
          text: 贝丝干活时唱得像只小云雀。她再累，也愿意陪着妈妈和姐妹们。每天，她都满怀希望地安慰自己。
        - id: ch03-b09
          speaker: beth
          text: “只要我乖，总有一天会得到我的音乐。”
        - id: ch03-b10
          speaker: narrator
          text: 世上有许多个贝丝。她们安静又害羞，总坐在角落里，等到别人需要才走出来。她们快快乐乐地为别人生活，谁也看不见她们的牺牲。直到有一天，炉边的小蟋蟀不再唱歌，那道像阳光一样甜美明亮的身影消失了，人们才发现，留下来的只有寂静和阴影。
        - id: ch03-b11
          speaker: narrator
          text: 要是有人问艾米，她一生中最大的苦难是什么，她会马上回答。
        - id: ch03-b12
          speaker: amy
          text: “我的鼻子。”
        - id: ch03-b13
          speaker: narrator
          text: 艾米还是婴儿时，乔不小心把她掉进煤斗。艾米认定，那一摔永远毁了自己的鼻子。它既不大也不红，只是稍微有些扁。无论怎么捏，也捏不出贵族式的尖头。别人谁也不在意，那只鼻子也在尽力长大，可艾米还是为自己没有希腊式鼻子而难过，只能画上一整页漂亮鼻子安慰自己。
        - id: ch03-b14
          speaker: narrator
          text: 姐妹们叫她“小拉斐尔”。她确实很会画画，也只有画画时最开心。她喜欢临摹花朵，设计仙女，还会给故事配上稀奇古怪的插图。老师却常常抱怨她不做算术题，只顾在石板上画动物。她还在地图册的空白页临摹地图，各种荒唐得叫人发笑的讽刺画，也会在最不凑巧的时候从她的每一本书里飘出来。
        - id: ch03-b15
          speaker: narrator
          text: 她尽力应付功课，又懂得用无可挑剔的举止躲过老师的责骂。她性情和善，还有一种不用费力就能讨人喜欢的本领，所以很受同学欢迎。大家欣赏她那一套小小的姿态和风度，也佩服她的才艺。除了画画，她会弹十二支曲子，会用钩针编织，还会读法文，每三个词里最多只念错两个。她最爱用哀婉的语气提起家里从前的日子。
        - id: ch03-b16
          speaker: amy
          text: “爸爸从前有钱时，我们总会这样做、那样做。”
        - id: ch03-b17
          speaker: narrator
          text: 同学们听了很感动，还认为艾米嘴里的长词优雅极了。艾米很有被宠坏的希望，人人看护她、宠爱她，她那一点虚荣和自私也长得很好。不过，有件事总能压一压她的虚荣心。她必须穿表姐弗洛伦丝留下的衣服。偏偏弗洛伦丝的妈妈一点品味也没有。艾米想戴蓝帽子，却只能戴红的，还得穿不衬自己的衣裙和花哨又不合身的围裙。衣服都很结实，针脚也好，没穿过几次，可她那双艺术家的眼睛受尽折磨。这个冬天的校服尤其难看，是暗紫色的，上面有黄点，连饰边也没有。
        - id: ch03-b18
          speaker: amy
          text: “我唯一的安慰，就是我淘气时，妈妈不会像玛丽亚·帕克斯的妈妈那样，在裙子上打褶，把裙摆收短。亲爱的，那可太吓人了。有时她坏得太厉害，裙子会一直缩到膝盖，根本不能来上学。一想到这种‘丢人现眼’，我觉得扁鼻子和那条带黄色冲天炮的紫裙子，也不是不能忍了。”
        - id: ch03-b19
          speaker: narrator
          text: 梅格是艾米倾诉秘密的人，也负责教导她。也许正是相反的性情会彼此吸引，乔照管的则是温柔的贝丝。贝丝只肯把心事告诉乔，而她在不知不觉间对这个冒冒失失的大姐姐产生的影响，比家里任何人都大。两个姐姐彼此亲密，也各自把一个妹妹揽进怀里，用自己的方式照顾。她们把这叫作“当妈妈”。小妇人们凭着天生的母性，把妹妹放到了从前那些娃娃所占的位置上。
    - id: ch04
      title: 姑婆、戒指和一条大鱼
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 那天晚上，姑娘们围坐在一起做针线。梅格觉得这一天沉闷极了，很想听点新鲜事。
        - id: ch04-b02
          speaker: meg
          text: “谁有事情可以讲？我都快闷死了，非得找点乐子不可。”
        - id: ch04-b03
          speaker: jo
          text: “我今天跟姑婆有一段有趣的较量，而且是我赢了。听我讲吧。我又在念那个没完没了的贝尔沙姆，故意拖着声音，因为姑婆很快就会睡着。等她一睡，我就换一本好书，拼命读到她醒来。可今天，我先把自己念困了。她还没点头，我倒打了个大哈欠。她问我，嘴张得那么大，是不是想把整本书一口吞下去。”
        - id: ch04-b04
          speaker: jo
          text: “我倒真希望能吞下去，这样就不必再念了。”
        - id: ch04-b05
          speaker: narrator
          text: 乔努力不让自己的口气太放肆，可姑婆还是把她的罪过数落了好一阵，然后命令她坐着反省，自己要稍微“失去知觉”一会儿。
        - id: ch04-b06
          speaker: jo
          text: “她每次都要过好久才找得回知觉。所以那顶帽子刚像头重脚轻的大丽花一样点起来，我就从口袋里飞快抽出《威克菲尔德的牧师》，一只眼看书，一只眼盯着她。我刚读到书里的人全掉进水里，一时忘了防备，竟大声笑了出来。姑婆醒了，睡过一觉以后脾气也好了些。她叫我念一段，让她听听我为什么宁可读这种轻浮作品，也不读高尚又有教益的贝尔沙姆。我使出全部本领念给她听。她明明喜欢，嘴上可不肯承认。”
        - id: ch04-b07
          speaker: aunt_march
          text: “我根本听不懂。回到开头，从头念起，孩子。”
        - id: ch04-b08
          speaker: jo
          text: “我只好回到前面，把普里姆罗斯一家讲得能有多有趣就多有趣。有一回，我故意停在最紧张的地方，还装得特别温顺。”
        - id: ch04-b09
          speaker: jo
          text: “我怕您听累了，太太。现在停下好吗？”
        - id: ch04-b10
          speaker: narrator
          text: 姑婆一把抓起掉下去的针织活，隔着眼镜尖锐地瞪了她一眼。
        - id: ch04-b11
          speaker: aunt_march
          text: “把这一章念完，少耍贫嘴，小姐。”
        - id: ch04-b12
          speaker: meg
          text: “她承认自己喜欢了吗？”
        - id: ch04-b13
          speaker: jo
          text: “当然没有！不过她让老贝尔沙姆歇着了。下午我回去拿手套，看见她正埋头读《牧师》，读得入了迷。我在大厅里笑，还跳了一段吉格舞，庆祝好日子就要来了，她都没听见。只要她自己肯，日子本来可以过得多么有趣。虽然她有钱，我也不怎么羡慕她。说到底，我看富人的烦恼并不比穷人少。”
        - id: ch04-b14
          speaker: meg
          text: “这倒让我想起一件事。没有乔的故事那么好笑，可我回家时一直在想。今天金家乱成一团。一个孩子告诉我，她的大哥做了件可怕的事，父亲已经把他赶走了。我听见金太太在哭，金先生说话的声音也很大。格蕾丝和埃伦从我身边走过时，都转开了哭得又红又肿的眼睛，不让我看见。我当然没有追问，只觉得他们太可怜了。我甚至有些庆幸，自己没有胡作非为的兄弟，不会做坏事，让全家蒙羞。”
        - id: ch04-b15
          speaker: amy
          text: “依我看，在学校当众丢脸，比坏男孩做的任何事都难受。苏茜·珀金斯今天戴了一枚漂亮的红玛瑙戒指。我太喜欢了，一心想变成她。后来她画了戴维斯先生，给他画了一个吓人的大鼻子和驼背，嘴边还有个气球一样的东西，里面写着，‘小姐们，我的眼睛正盯着你们！’我们正在笑，他的眼睛就真的盯住了我们。他命令苏茜把石板拿上去。她吓得‘全身麻木’，还是去了。你们猜他做了什么？他揪着她的耳朵，把她带到背诵台上，罚她举着石板站半小时，让所有人看！”
        - id: ch04-b16
          speaker: jo
          text: “其他姑娘没有笑那幅画吗？”
        - id: ch04-b17
          speaker: amy
          text: “笑？一个都没有！大家安静得像老鼠。苏茜哭掉的眼泪足有好几夸脱，我知道一定有那么多。那时我一点也不羡慕她了。就算给我几百万枚红玛瑙戒指，受过那种罪，我也高兴不起来。我永远、永远也没法从那么‘痛不欲生的羞辱’里恢复过来。”
        - id: ch04-b18
          speaker: narrator
          text: 艾米继续做针线，既为自己的高尚品德骄傲，也为一口气说出两个长词而得意。
        - id: ch04-b19
          speaker: beth
          text: “今天早晨我看见一件很好的事，本想吃饭时讲，可我忘了。我去替汉娜买牡蛎，劳伦斯先生也在鱼店。他没有看见我，我躲在鱼桶后面，他正跟卖鱼的卡特先生说话。这时有个穷女人拿着水桶和拖把走了进来。”
        - id: ch04-b20
          speaker: poor_woman
          text: “卡特先生，能让我替您擦洗一会儿，换一点鱼吗？我的孩子没有饭吃，原先说好的活儿今天也落了空。”
        - id: ch04-b21
          speaker: mr_cutter
          text: “不行。”
        - id: ch04-b22
          speaker: beth
          text: “卡特先生正忙，答得很不耐烦。那个女人又饿又难过，正要离开，劳伦斯先生用手杖弯曲的一头钩起一条大鱼，递给了她。她又惊讶又高兴，直接把鱼搂在怀里，一遍遍地道谢。”
        - id: ch04-b23
          speaker: poor_woman
          text: “谢谢您，先生！谢谢您！”
          emotion: happy
        - id: ch04-b24
          speaker: mr_laurence
          text: “快回去把鱼煮了吧。”
        - id: ch04-b25
          speaker: beth
          text: “她欢欢喜喜地跑了。劳伦斯先生是不是很好？她抱着那条又大又滑的鱼，样子真好笑，还祝他将来在天堂的床铺‘舒舒服服’呢。”
    - id: ch05
      title: 想想得到的恩典
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 大家听完贝丝的故事，笑了一阵，又请母亲也讲一个。马奇太太想了片刻，神情变得严肃。
        - id: ch05-b02
          speaker: mrs_march
          text: “今天我在会所裁剪蓝法兰绒上衣，心里一直担心你们的父亲。我想着，要是他出了什么事，我们会多么孤单、多么无助。这么想并不明智，可我还是越想越忧虑。后来，一位老人拿着领取衣物的单子走进来。他在我附近坐下，看上去贫穷、疲惫，又满面愁容，我便跟他聊了起来。”
        - id: ch05-b03
          speaker: mrs_march
          text: “您的儿子在军队里吗？您带来的单子不是交给我的。”
        - id: ch05-b04
          speaker: old_man
          text: “是的，太太。我原来有四个儿子。两个战死了，一个当了俘虏。现在我要去看最后一个，他病得很重，住在华盛顿的一家医院里。”
        - id: ch05-b05
          speaker: narrator
          text: 老人说得十分平静。马奇太太心里的怜悯变成了敬意。
        - id: ch05-b06
          speaker: mrs_march
          text: “先生，您为国家付出的太多了。”
        - id: ch05-b07
          speaker: old_man
          text: “没有一丁点超过本分，太太。我要是还能派上用场，自己就去了。既然不行，我便把儿子们献出来，而且是心甘情愿地献。”
        - id: ch05-b08
          speaker: mrs_march
          text: “他说得那么开朗，神情又那么真诚。能献出自己的一切，他仿佛只有欢喜。我忽然为自己感到惭愧。我只献出一个男人，就已经觉得太多。老人献出四个，却没有一句怨言。我回到家里，还有你们几个姑娘安慰我。可他最后一个儿子却在几百英里外等着，也许只为跟父亲见最后一面。想到自己还拥有这么多福分，我一下觉得又富足、又幸福。我仔细替老人包好一大包东西，又送了他一些钱，还诚心诚意地感谢他给我上了这一课。”
        - id: ch05-b09
          speaker: narrator
          text: 屋里安静了片刻。乔把母亲的话想了想，才开口。
        - id: ch05-b10
          speaker: jo
          text: “妈妈，再讲一个带点道理的故事吧。只要是真事，又不太爱说教，我喜欢听完以后慢慢想。”
        - id: ch05-b11
          speaker: narrator
          text: 马奇太太笑了。她给这群小听众讲了许多年故事，当然知道怎样才能让她们喜欢。
        - id: ch05-b12
          speaker: mrs_march
          text: “从前有四个姑娘。她们有足够的食物、饮水和衣服，也有不少舒适和乐趣。她们有善良的朋友，还有深爱她们的父母，可她们还是不知足。”
        - id: ch05-b13
          speaker: narrator
          text: 四个听众偷偷互相看了一眼，手里的针线立刻做得格外勤快。
        - id: ch05-b14
          speaker: mrs_march
          text: “这些姑娘想做个好孩子，也立过许多很好的志愿，可总是守不住。她们一天到晚都在说，要是有这个就好了，要是能做那件事就好了。她们完全忘了，自己已经拥有多少东西，又能做多少事情。于是，她们去问一位老妇人，用什么咒语才能得到幸福。老妇人告诉她们，每次觉得不知足，就数一数自己得到的福分，再好好感谢这些福分。”
        - id: ch05-b15
          speaker: narrator
          text: 乔猛地抬起头，像要说话。可她发现故事还没有讲完，便忍住了。
        - id: ch05-b16
          speaker: mrs_march
          text: “姑娘们都很明白事理，决定试试这个办法。没过多久，她们惊讶地发现，自己的境况原来这么好。一个姑娘明白，再多的钱也挡不住羞耻和悲伤走进富人的家。另一个姑娘发现，自己虽然贫穷，却有青春、健康和好心情。跟某位爱发脾气、身体虚弱、拥有舒适生活却不会享用的老太太相比，她要快乐得多。第三个姑娘明白，帮忙准备晚饭虽然讨厌，为了晚饭挨家乞讨却更难熬。第四个姑娘也懂得，再多红玛瑙戒指，也没有端正的品行贵重。”
        - id: ch05-b17
          speaker: mrs_march
          text: “于是，她们约好不再抱怨，要享用眼前的福分，也要努力让自己配得上它们。否则，这些福分不但不会增加，反而可能全被收走。我相信，她们听了老妇人的话，从此没有失望，也没有后悔。”
        - id: ch05-b18
          speaker: meg
          text: “妈妈，你可真狡猾！竟把我们讲的故事拿来对付我们。我们想听传奇，你却送来一篇训诫！”
        - id: ch05-b19
          speaker: beth
          text: “我喜欢这样的训诫。爸爸从前给我们讲的就是这一种。”
        - id: ch05-b20
          speaker: narrator
          text: 贝丝想着母亲的话，把乔针垫上的针一根根插整齐。
        - id: ch05-b21
          speaker: amy
          text: “我可不像她们几个那么爱抱怨。以后我要更加小心。苏茜的堕落已经给了我警告。”
        - id: ch05-b22
          speaker: jo
          text: “这堂课咱们确实需要，也一定不会忘。万一忘了，您就像《汤姆叔叔的小屋》里的老克洛伊那样提醒我们，‘想想你们得到的恩典吧，孩子们！想想你们得到的恩典吧！’”
        - id: ch05-b23
          speaker: narrator
          text: 乔和姐妹们一样，把这篇小小的训诫牢牢记进了心里。可她无论如何，也忍不住要从里面找出一点乐子。
