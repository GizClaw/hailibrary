  chapters:
    - id: ch01
      title: Taking Up Their Burdens
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The morning after the party, the holidays were over. After a week of fun, Meg found it harder than ever to return to the work she had never liked.
        - id: ch01-b02
          speaker: meg
          text: "Oh, dear. Picking up our packs and starting again feels so hard."
          emotion: sad
        - id: ch01-b03
          speaker: jo
          text: "I wish every day could be Christmas or New Year's. Wouldn't that be wonderful?"
        - id: ch01-b04
          speaker: narrator
          text: Jo gave a gloomy yawn.
        - id: ch01-b05
          speaker: meg
          text: "We probably wouldn't enjoy it nearly as much. Still, it's lovely to have little suppers and flowers, go to parties, ride home, read, rest, and never work. Other girls live that way. I always envy them because I do love nice things."
        - id: ch01-b06
          speaker: narrator
          text: Meg held up her two worn dresses and tried to decide which looked less shabby.
        - id: ch01-b07
          speaker: jo
          text: "Well, we can't live that way. Let's stop grumbling, shoulder our bundles, and march on as cheerfully as Marmee does. Aunt March hangs on me like that Old Man of the Sea. Maybe once I learn to carry her without complaining, she'll fall off, or feel so light I won't mind."
        - id: ch01-b08
          speaker: narrator
          text: The picture amused Jo and restored her good humor. It did nothing for Meg. Her own burden was four spoiled children, and that morning it seemed heavier than ever. She did not even have the heart to tie on her blue neck ribbon or arrange her hair becomingly.
        - id: ch01-b09
          speaker: meg
          text: "Why bother looking nice? No one sees me except those cross little creatures, and no one cares whether I'm pretty. I'll work and struggle all my life, with only scraps of fun. Then I'll grow old, ugly, and sour because I'm poor and can't enjoy myself like other girls. It isn't fair!"
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: She slammed the drawer and went downstairs looking deeply wronged. At breakfast, she was not pleasant company. In fact, the entire family seemed ready to complain. Beth lay on the sofa with a headache, trying to take comfort in the cat and three kittens. Amy fretted over unfinished lessons and missing rubber boots. Jo whistled and made a tremendous racket while she got ready. Marmee hurried to finish a letter for the early mail, and Hannah was grumpy because staying up late never agreed with her.
        - id: ch01-b11
          speaker: jo
          text: "There has never been such a cross family!"
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: By then Jo had spilled the ink, snapped both bootlaces, and sat on her hat.
        - id: ch01-b13
          speaker: amy
          text: "You're the crossest one here!"
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: Amy's tears dropped onto her slate and washed through a sum that was wrong anyway. Meanwhile, a kitten climbed Meg's back and clung there like a burr, just beyond her reach.
        - id: ch01-b15
          speaker: meg
          text: "Beth, keep these awful cats in the cellar, or I'll have them drowned!"
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: Jo laughed, Meg scolded, Beth begged for mercy, and Amy wailed because she could not remember nine times twelve.
        - id: ch01-b17
          speaker: marmee
          text: "Girls, please be quiet for one minute! This letter has to catch the early mail, and all this fuss is driving me out of my mind."
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: Marmee crossed out her third ruined sentence. The room fell quiet for a moment. Then Hannah marched in, set two hot turnovers on the table, and marched out. The girls called these pies their muffs because they had no real muffs, and the warmth felt good in their hands on cold mornings. However busy or grouchy Hannah might be, she always made them. Meg and Jo had a long, bitter walk, no other lunch, and rarely returned before two.
        - id: ch01-b19
          speaker: jo
          text: "Snuggle those cats and lose that headache, Bethy. Goodbye, Marmee. We're a pack of rascals this morning, but we'll come home as perfect angels. Come on, Meg!"
        - id: ch01-b20
          speaker: narrator
          text: Jo tramped out, feeling that these pilgrims had begun their journey badly. At the corner, the sisters looked back as they always did. Marmee stood at the window, nodding, smiling, and waving. Whatever mood they were in, that last glimpse of her face warmed them like sunshine and somehow carried them through the day.
        - id: ch01-b21
          speaker: jo
          text: "If Marmee shook her fist instead of blowing us a kiss, we'd deserve it. No one ever saw two more ungrateful wretches."
        - id: ch01-b22
          speaker: narrator
          text: Jo took a guilty sort of pleasure in the snow and biting wind.
        - id: ch01-b23
          speaker: meg
          text: "Don't say such dreadful things."
        - id: ch01-b24
          speaker: narrator
          text: Meg spoke from inside the veil wrapped around her like a nun who was tired of the world.
        - id: ch01-b25
          speaker: jo
          text: "I like good, strong words that mean something."
        - id: ch01-b26
          speaker: narrator
          text: A gust tried to carry off Jo's hat, and she caught it just in time.
        - id: ch01-b27
          speaker: meg
          text: "Call yourself whatever you please. I'm not a rascal or a wretch, and I won't be called one."
        - id: ch01-b28
          speaker: jo
          text: "Then you're a blighted creature, cross because you can't sit in luxury all day. Wait until I make my fortune. I'll give you carriages, ice cream, high heels, flowers, and redheaded boys to dance with."
        - id: ch01-b29
          speaker: meg
          text: "Jo, you're absurd!"
        - id: ch01-b30
          speaker: narrator
          text: Meg laughed in spite of herself, and immediately felt better.
        - id: ch01-b31
          speaker: jo
          text: "You're lucky I am. If I acted crushed and miserable too, we'd be in a fine state. Thank goodness I can always find something funny. No more croaking, dear. Come home cheerful."
        - id: ch01-b32
          speaker: narrator
          text: At the place where their paths divided, Jo gave Meg an encouraging pat. Each sister went her own way, hugging a warm turnover and trying to be cheerful through winter weather, hard work, and all the pleasures they wanted but could not have.
    - id: ch02
      title: Meg and Jo at Work
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When Mr. March lost his money while helping an unfortunate friend, Meg and Jo begged to earn part of their own support. Their parents wanted them to begin learning energy, industry, and independence while they were young, so they agreed. Both girls went to work with a will. That hearty willingness helped them keep going whenever difficulties stood in their way.
        - id: ch02-b02
          speaker: narrator
          text: Meg became a nursery governess and felt rich when she received her small salary. Poverty troubled her more than it did her sisters. She could still remember when their home had been beautiful, every day had held ease and pleasure, and the family had never known what it meant to go without. She honestly tried not to envy anyone or grow discontented. Still, she was a young girl, and she naturally longed for pretty things, lively friends, accomplishments, and pleasure. At the Kings' house, she saw all of it each day. The older daughters were entering society. Meg caught glimpses of delicate ball gowns and bouquets, heard their talk of theaters, concerts, sleigh rides, and parties, and watched money spent carelessly on little things she would have treasured. She seldom complained aloud, but sometimes the unfairness made her bitter toward everyone. She had not yet learned how rich she already was in the blessings that truly make people happy.
        - id: ch02-b03
          speaker: narrator
          text: Jo, meanwhile, suited Aunt March. The old lady was lame and needed someone active to wait on her. When the Marches lost their fortune, childless Aunt March had offered to adopt one of the girls. She was deeply offended when they refused. Friends warned that the family had thrown away any hope of a place in her will. But the Marches answered together.
        - id: ch02-b04
          speakers: [mr_march, marmee]
          ensemble: duo
          text: "We wouldn't give up one of our girls for twelve fortunes. Rich or poor, we'll stay together and find our happiness in one another."
        - id: ch02-b05
          speaker: narrator
          text: Aunt March stopped speaking to them for a while. Then she met Jo at a friend's house. Jo's funny face and blunt manner pleased her, and she offered to hire Jo as a companion. Jo disliked the idea, but no better job appeared, so she accepted. To everyone's surprise, she managed her hot-tempered relative very well. Storms came now and then. Once Jo marched home declaring she would never endure another day. Aunt March's anger soon passed, though, and she sent for Jo so urgently that Jo returned. Underneath it all, she rather liked the peppery old woman.
        - id: ch02-b06
          speaker: narrator
          text: The true attraction may have been Aunt March's library. Since Uncle March died, its fine books had been left to dust and spiders. Jo remembered how kindly he had let her build railroads and bridges from his huge dictionaries. He told her stories about strange pictures in his Latin books and bought her gingerbread cards whenever they met in the street. Now the dim room waited with carved busts staring from the tall bookcases, comfortable chairs, globes, and best of all, a wilderness of books where Jo could wander anywhere she wished.
        - id: ch02-b07
          speaker: narrator
          text: Whenever Aunt March napped or entertained visitors, Jo hurried there. Curled in a soft chair, she swallowed poetry, romances, history, travel, and pictures like a true bookworm. But that happiness never lasted. Just as she reached the heart of a story, the loveliest verse in a poem, or a traveler's most dangerous adventure, a sharp voice rang through the house.
        - id: ch02-b08
          speaker: aunt_march
          text: "Josy-phine! Josy-phine!"
        - id: ch02-b09
          speaker: narrator
          text: Back Jo had to go, to wind yarn, wash the poodle, or read Belsham's Essays aloud for hours.
        - id: ch02-b10
          speaker: narrator
          text: Jo dreamed of doing something splendid, though she had no idea what it would be. Time could settle that. For now, her great sorrow was not being free to read, run, and ride as much as she pleased. Her temper was quick, her tongue sharp, and her restless spirit always landed her in trouble. One day could be funny and the next painful, and sometimes it managed to be both. Yet Aunt March's discipline was exactly the training she needed. It taught her to control some of that restless energy. Knowing she helped support herself made her happy, even through that endless call.
        - id: ch02-b11
          speaker: aunt_march
          text: "Josy-phine!"
    - id: ch03
      title: Beth's Quiet World
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Beth was too shy to attend school. The family had tried it, but she suffered so much that they let her study at home with her father. After he left, and Marmee gave her time and strength to the Soldiers' Aid Societies, Beth faithfully continued alone and did the best she could.
        - id: ch03-b02
          speaker: narrator
          text: She was a small homemaker. She helped Hannah keep the house neat and comfortable for the family members who went out to work, asking for no reward except love. Her quiet days were neither lonely nor empty. Imaginary friends filled her little world, and she was always busy.
        - id: ch03-b03
          speaker: narrator
          text: Every morning, six dolls had to be awakened and dressed. Beth was still a child, and she loved her pets dearly. Not one doll was whole or handsome. Her sisters had passed them down when they outgrew them, and Amy refused anything old or ugly. That only made Beth love the outcasts more. She opened a hospital for sick and injured dolls. No pins pierced their cotton bodies. No harsh word, blow, or neglect hurt even the ugliest patient. All of them were fed, dressed, nursed, and cuddled with unfailing care.
        - id: ch03-b04
          speaker: narrator
          text: The saddest patient had once belonged to Jo. After a rough life, the poor fragment ended up in the rag bag until Beth rescued it. The doll had no top to its head, so Beth tied on a tidy cap. It had lost both arms and legs, so she wrapped it in a blanket and gave it the finest bed as a lifelong invalid. The tenderness she lavished on that dirty little doll could have touched anyone, even while it made them smile. She brought it pieces of bouquets, read to it, carried it under her coat for fresh air, and sang it lullabies. Every night she kissed its face before bed.
        - id: ch03-b05
          speaker: beth
          text: "I hope you have a good night, my poor dear."
        - id: ch03-b06
          speaker: narrator
          text: Beth had troubles too. She was no angel, only a very human little girl, and sometimes, as Jo put it, she wept a little weep. She longed for music lessons and a fine piano. She loved music so dearly, worked so hard to learn, and practiced so patiently on the jangling old instrument that it seemed someone ought to help her. No one did, not even the person everyone might have expected, though no one named Aunt March aloud. When Beth was alone, no one saw her wipe her tears from the yellow keys that refused to stay in tune.
        - id: ch03-b07
          speaker: narrator
          text: Still, she sang like a lark while she worked. She was never too tired to help Marmee or her sisters. Day after day, she told herself the same hopeful thing.
        - id: ch03-b08
          speaker: beth
          text: "Someday I'll have my music, if I keep being good."
        - id: ch03-b09
          speaker: narrator
          text: Many Beths live quietly in the world. They sit in corners until someone needs them and cheerfully live for others. Their sacrifices go unnoticed until the little cricket at the hearth stops chirping. Then the sunny presence is gone, and only silence and shadow remain.
    - id: ch04
      title: Amy's Great Trials
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: If anyone had asked Amy for the greatest trial of her life, her answer would have come at once.
        - id: ch04-b02
          speaker: amy
          text: "My nose."
        - id: ch04-b03
          speaker: narrator
          text: When Amy was a baby, Jo had accidentally dropped her into the coal scuttle. Amy insisted the fall had ruined her nose forever. It was not large or red like poor Petrea's. It was only a little flat. But no amount of pinching could give it the elegant point Amy wanted. No one else cared, and the nose was doing its best to grow. Amy felt the lack of a Grecian nose deeply, though, and comforted herself by drawing page after page of beautiful ones.
        - id: ch04-b04
          speaker: narrator
          text: Her sisters called her Little Raphael, and she truly had talent. Nothing pleased her more than copying flowers, inventing fairies, or illustrating stories with very peculiar art. Her teachers complained that animals covered her slate where the arithmetic should have been. She used every blank page in her atlas to copy maps. Ridiculous caricatures hid among the pages of all her schoolbooks, then fluttered out at exactly the wrong moments.
        - id: ch04-b05
          speaker: narrator
          text: Amy finished her lessons as well as she could and escaped scolding by behaving like a model young lady. Her classmates adored her. She was good-tempered and pleased people without seeming to try. They admired her graceful little manners and her many accomplishments. Besides drawing, she could play twelve tunes, crochet, and read French while mispronouncing no more than two words out of three. She also had a mournful little phrase that touched everyone.
        - id: ch04-b06
          speaker: amy
          text: "When Papa was rich, we used to do that."
          emotion: sad
        - id: ch04-b07
          speaker: narrator
          text: The girls found Amy's long words perfectly elegant. With everyone petting her, she was well on her way to being spoiled, and her small vanities and selfish habits grew nicely. One thing checked her pride. She had to wear her cousin Florence's clothes. Florence's mother did not possess a speck of taste, at least in Amy's opinion. The red bonnet should have been blue. The dresses did not flatter her, and the fussy aprons did not fit. Everything was sturdy, well made, and hardly worn, but none of that comforted Amy's artistic eye. That winter was especially bad. Her school dress was dull purple with yellow dots and not one bit of trimming.
        - id: ch04-b08
          speaker: amy
          text: "My only comfort is that Mother doesn't add a tuck to my dress every time I'm naughty, the way Maria Parks's mother does. It is truly dreadful, Meg. Sometimes Maria behaves so badly that her skirt reaches her knees and she can't come to school. When I think of that deggerredation, I feel I can endure even my flat nose and this purple dress with yellow fireworks."
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: Meg was Amy's adviser and keeper. By the strange pull of opposites, Jo belonged especially to gentle Beth. Beth shared her private thoughts only with Jo, and without knowing it, she influenced her wild older sister more than anyone else did. Meg and Jo were very close, but each had taken one younger sister under her wing. They called it playing mother. The little women had set their sisters in the places where their dolls used to be.
    - id: ch05
      title: Stories by the Fire
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: That evening the sisters sat together sewing.
        - id: ch05-b02
          speaker: meg
          text: "Does anyone have a story? Today was so dreary that I'm desperate for some amusement."
        - id: ch05-b03
          speaker: jo
          text: "I had an odd time with Aunt, and I won in the end, so I'll tell you. I was reading that endless Belsham aloud in my usual dull voice. Aunt generally falls asleep, and then I pull out a good book and race through it until she wakes. But today I made myself sleepy first. Before her head even started nodding, I yawned so wide she asked whether I meant to swallow the whole book at once."
        - id: ch05-b04
          speaker: jo
          text: "I told her, 'I wish I could. Then it would be finished.' I tried not to sound saucy."
        - id: ch05-b05
          speaker: narrator
          text: Aunt March answered with a long lecture about Jo's sins. Then she ordered Jo to sit and think about them while she lost herself for a moment. Aunt March never found herself quickly. As soon as her cap bobbed like a top-heavy flower, Jo whipped The Vicar of Wakefield from her pocket. She read with one eye on the book and the other on her aunt. Then the characters all fell into the water. Jo forgot herself and laughed aloud. Aunt March woke in a better humor after her nap and demanded to hear a little of the foolish book Jo preferred to sensible Belsham. Jo read with all her skill. Aunt March liked it, although she would never admit that plainly.
        - id: ch05-b06
          speaker: aunt_march
          text: "I can't make sense of this. Go back to the beginning, child."
        - id: ch05-b07
          speaker: jo
          text: "So back I went. I made the Primrose family as entertaining as I possibly could. Once, at the most exciting part, I was wicked enough to stop and say very meekly, 'I'm afraid I'm tiring you, ma'am. Should I stop?'"
        - id: ch05-b08
          speaker: narrator
          text: Aunt March snatched up the knitting that had slipped from her hands and peered sharply over her spectacles.
        - id: ch05-b09
          speaker: aunt_march
          text: "Finish the chapter, miss, and don't be impertinent."
        - id: ch05-b10
          speaker: meg
          text: "Did she admit she liked it?"
        - id: ch05-b11
          speaker: jo
          text: "Not for the world! But Belsham got the rest of the day off. When I ran back for my gloves this afternoon, Aunt was buried so deeply in the Vicar that she never heard me laughing and dancing in the hall. Think of all the fun she could have if she chose! Even with her money, I don't envy her much. Rich people seem to have about as many troubles as poor ones."
        - id: ch05-b12
          speaker: meg
          text: "That reminds me of something that happened at the Kings'. It isn't funny, but I thought about it all the way home. Everyone was upset today. One child told me her oldest brother had done something terrible, and their father had sent him away. I heard Mrs. King crying and Mr. King speaking very loudly. Grace and Ellen turned their faces when they passed so I wouldn't see their red, swollen eyes. Of course I didn't ask questions. I felt sorry for them, and rather thankful we have no wild brothers to behave wickedly and disgrace our family."
        - id: ch05-b13
          speaker: amy
          text: "Being disgraced at school is much more trying than anything bad boys can do. Susie Perkins came in today wearing a beautiful red carnelian ring. I wanted it dreadfully. I wished with all my heart that I could be Susie. Then she drew Mr. Davis on her slate with a giant nose and a hump. A little balloon came from his mouth saying, 'Young ladies, I am watching you!' We were laughing when suddenly he really was watching us. He ordered Susie to bring him the slate. She was parrylized with fear, but she went. And what do you think he did? He took her by the ear. By the ear! Can you imagine anything so horrible? Then he led her onto the recitation platform and made her stand there for half an hour, holding up the picture for everyone to see."
        - id: ch05-b14
          speaker: jo
          text: "Didn't the girls laugh at the picture?"
        - id: ch05-b15
          speaker: amy
          text: "Laugh? Not one of them! They sat as quiet as mice, and Susie cried quarts. I'm sure she did. I stopped envying her right then. A million carnelian rings couldn't have made up for it. I never, ever could have survived such an agonizing mortification."
        - id: ch05-b16
          speaker: narrator
          text: Amy returned to her sewing, proud of her virtue and of managing two long words in a single breath.
        - id: ch05-b17
          speaker: beth
          text: "I saw something I liked this morning. I meant to tell you at dinner, but I forgot. Hannah sent me for oysters, and Mr. Laurence was in the fish shop. He didn't see me because I stayed behind a fish barrel while he talked with Mr. Cutter. Then a poor woman came in carrying a pail and a mop. She asked Mr. Cutter if she could scrub the shop in exchange for a little fish. Her children had no dinner, and the work she expected that day had fallen through. Mr. Cutter was busy and gave her a cross no. She turned away looking hungry and miserable. Then Mr. Laurence caught a big fish on the curved end of his cane and held it out to her. She was so surprised and happy that she hugged it in both arms and thanked him again and again. He told her to go home and cook it, and away she hurried. Wasn't that kind? She looked so funny holding that big slippery fish and hoping Mr. Laurence would have an aisy bed in heaven."
        - id: ch05-b18
          speaker: narrator
          text: The family laughed at Beth's story, then asked Marmee to tell one. She thought for a moment before answering seriously.
        - id: ch05-b19
          speaker: marmee
          text: "While I cut blue flannel jackets at the aid rooms today, I became terribly worried about Father. I imagined how lonely and helpless we would be if something happened to him. It wasn't wise, but I kept worrying until an old man arrived with an order for clothes. He looked poor, tired, and anxious, so when he sat near me, I began talking to him."
        - id: ch05-b20
          speaker: marmee
          text: "I asked him, 'Do you have sons in the army?' The note he carried wasn't addressed to me."
        - id: ch05-b21
          speaker: old_man
          text: "Yes, ma'am. I had four sons. Two were killed, and one is a prisoner. I'm on my way to the last one. He's very sick in a hospital in Washington."
        - id: ch05-b22
          speaker: marmee
          text: "Then I respected him instead of pitying him. I said, 'Sir, you've given a great deal to your country.'"
        - id: ch05-b23
          speaker: old_man
          text: "No more than I should, ma'am. I'd go myself if I were any use. Since I'm not, I give my boys, and I give them freely."
        - id: ch05-b24
          speaker: marmee
          text: "He was cheerful and sincere. He seemed glad to give everything he had, and I felt ashamed. I had given one man and thought the sacrifice too great. He had given four without resentment. All my girls waited at home to comfort me. His last son might be waiting miles away only to say goodbye. When I remembered my blessings, I felt rich and happy. I prepared a good bundle for him, added some money, and thanked him from my heart for the lesson."
        - id: ch05-b25
          speaker: narrator
          text: The girls sat silently for a minute.
        - id: ch05-b26
          speaker: jo
          text: "Tell us another, Mother. Give it a moral like that one. I like thinking about those stories afterward, as long as they're true and not too preachy."
        - id: ch05-b27
          speaker: narrator
          text: Marmee smiled. She had told stories to this little audience for years and knew exactly how to please them.
        - id: ch05-b28
          speaker: marmee
          text: "Once there were four girls. They had enough food, drink, and clothing. They had many comforts, plenty of pleasures, good friends, and parents who loved them dearly. Still, they weren't content."
        - id: ch05-b29
          speaker: narrator
          text: Four pairs of eyes slipped sideways. Four sets of hands became very busy with their sewing.
        - id: ch05-b30
          speaker: marmee
          text: "The girls wanted to be good and made many excellent promises, but they didn't keep them very well. They were always wishing for something they didn't have or something they couldn't do. They forgot how much they already possessed and how much they truly could do. So they asked an old woman for a magic spell that would make them happy. She told them, 'Whenever you feel dissatisfied, count your blessings and be grateful.'"
        - id: ch05-b31
          speaker: narrator
          text: Jo looked up quickly, ready to speak, then realized the story was not over and held her tongue.
        - id: ch05-b32
          speaker: marmee
          text: "The girls had some sense, so they tried the old woman's advice. Soon they were amazed by how fortunate they were. The first learned that money cannot keep shame and grief out of a rich home. The second saw that, though she was poor, youth, health, and good spirits made her much happier than a rich old lady who was sickly, fretful, and unable to enjoy her comforts. The third discovered that helping to cook dinner was unpleasant, but begging for dinner was far worse. The fourth found that even a carnelian ring was worth less than good conduct. The girls agreed to stop complaining, enjoy the blessings they had, and try to deserve them. Otherwise, those gifts might disappear instead of increasing. I believe they never regretted following the old woman's advice."
        - id: ch05-b33
          speaker: meg
          text: "Marmee, that was very clever. You turned our own stories against us and gave us a sermon instead of a romance!"
        - id: ch05-b34
          speaker: beth
          text: "I like sermons like that. Father used to tell us that kind."
        - id: ch05-b35
          speaker: narrator
          text: Thoughtfully, Beth straightened the needles on Jo's cushion.
        - id: ch05-b36
          speaker: amy
          text: "I don't complain nearly as much as the rest of you. But I'll be more careful than ever now. Susie's downfall has warned me."
        - id: ch05-b37
          speaker: jo
          text: "We did need the lesson, and we won't forget it. If we do, just tell us what old Chloe said in Uncle Tom's Cabin. 'Think of your mercies, children! Think of your mercies!'"
        - id: ch05-b38
          speaker: narrator
          text: Jo could never resist putting a crumb of fun into a sermon, but she took this one to heart as deeply as any of her sisters did.
