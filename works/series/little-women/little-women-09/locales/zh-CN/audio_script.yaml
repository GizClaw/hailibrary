        timbre: 年轻明亮
        pace: 适中
        pitch: 中
    fisher:
      display_name: 费希尔
      tts:
        delivery: 轻佻爱说笑，带着宴会上的浮夸
        timbre: 清亮偏薄
        pace: 偏快
        pitch: 中
  chapters:
    - id: ch01
      title: 简朴的行装
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 四月的一天，梅格在房里收拾出远门才用的箱子，三个妹妹围在旁边帮忙。莫法特家的孩子们偏偏出了麻疹，这倒给梅格腾出了两星期的邀请。她觉得这运气简直好到家了。
        - id: ch01-b02
          speaker: jo
          text: “安妮还记得她的话，可真够朋友。一连玩两个星期，多痛快啊！”
        - id: ch01-b03
          speaker: narrator
          text: 乔边说边伸着长胳膊叠裙子，活像一架忙碌的风车。
        - id: ch01-b04
          speaker: beth
          text: “天气也这么好，真叫人高兴。”
        - id: ch01-b05
          speaker: narrator
          text: 贝丝把自己最好的盒子借给梅格，正一样样放进领结和发带。
        - id: ch01-b06
          speaker: amy
          text: “我也真想去好好玩一场，还能穿上这些漂亮东西。”
        - id: ch01-b07
          speaker: narrator
          text: 艾米嘴里衔着针，正很讲究地给针垫补上新针。
        - id: ch01-b08
          speaker: meg
          text: “要是你们都能去就好了。我会把遇见的新鲜事全记住，回来再一件件讲给你们。你们又借东西，又帮我收拾，我总该拿这些故事回报你们。”
        - id: ch01-b09
          speaker: narrator
          text: 梅格看着房里那套再朴素不过的行装。在姐妹们眼里，它已经近乎完美。
        - id: ch01-b10
          speaker: amy
          text: “妈妈从珍宝箱里给你拿了什么？”
        - id: ch01-b11
          speaker: narrator
          text: 马奇太太的雪松木箱里，收着从前家里富裕时留下的几件旧物。她总要等到合适的时候，才取出来给女儿。这回开箱时，艾米恰好不在。
        - id: ch01-b12
          speaker: meg
          text: “一双长袜，那把雕花扇子，还有一条很好看的蓝腰带。我本来想带紫色绸衣，可实在来不及改，只能穿那条旧纱裙了。”
        - id: ch01-b13
          speaker: jo
          text: “纱裙套在我那条新细棉布裙上，再系上蓝腰带，一定很好看。可惜我把珊瑚手镯摔坏了，不然也能给你。”
        - id: ch01-b14
          speaker: narrator
          text: 乔最爱送人东西，也最爱往外借。只可惜她自己的家当常常磕磕碰碰，想借时候却派不上用场。
        - id: ch01-b15
          speaker: meg
          text: “箱里还有一套老式珍珠首饰。妈妈说，年轻姑娘戴鲜花最美，劳里也答应我，要多少就送多少。灰色外出服已经带上了。贝丝，帮我把帽子上的羽毛卷一卷。还有礼拜天和小聚会穿的毛葛衣，春天穿会不会太厚？唉，要是紫绸衣能穿就好了。”
        - id: ch01-b16
          speaker: amy
          text: “别发愁。大聚会你还有纱裙呢。你穿白的，总像个天使。”
        - id: ch01-b17
          speaker: meg
          text: “领口不够低，裙摆也不够长，只好将就了。蓝色家常裙翻了面，又加了新花边，看着倒像新的。可绸短外套一点也不时髦，帽子也比不上萨莉的。还有那把伞，我本来想要黑伞配白柄，妈妈却买了绿伞，柄的颜色也不黄不白。伞是很结实，我不该挑剔，可往安妮的金顶绸伞旁边一放，我一定会觉得丢人。”
        - id: ch01-b18
          speaker: narrator
          text: 梅格叹着气，越看那把小绿伞越不顺眼。
        - id: ch01-b19
          speaker: jo
          text: “那就拿去换掉。”
        - id: ch01-b20
          speaker: meg
          text: “妈妈费了那么多心思，我才不会干这种傻事去伤她的心。都是我自己乱想，我不能由着它。再说，我还有新袜子和两双新手套呢。乔，你肯把手套借我，真是个好妹妹。平时再戴洗干净的旧手套，我简直又富有又体面了。”
        - id: ch01-b21
          speaker: narrator
          text: 一看手套盒，梅格果然又振作起来。贝丝捧来汉娜刚浆洗好的雪白内衣，梅格又想起一件事。
        - id: ch01-b22
          speaker: meg
          text: “安妮的睡帽上有蓝色和粉色的蝴蝶结。你们也替我缝几个，好不好？”
        - id: ch01-b23
          speaker: jo
          text: “我才不缝。睡帽打扮得花枝招展，睡袍却朴朴素素，连花边都没有，配在一起多怪。穷人就别乱摆阔气了。”
        - id: ch01-b24
          speaker: meg
          text: “真不知道我什么时候才能有运气，穿上真蕾丝，睡帽上也系着蝴蝶结。”
        - id: ch01-b25
          speaker: beth
          text: “前几天你还说，只要能去安妮家，你就什么都满足了。”
        - id: ch01-b26
          speaker: meg
          text: “我是说过。好吧，我很快活，不再抱怨。可人得到的越多，是不是反而想要更多？箱子的托盘收拾好了，除了舞会裙，其他东西也全放进去了。舞会裙就留给妈妈装吧。”
        - id: ch01-b27
          speaker: narrator
          text: 她的目光落到那条白纱裙上。裙子不知熨过、补过多少回，她还是郑重地叫它“舞会裙”。
        - id: ch01-b28
          speaker: narrator
          text: 第二天天气晴好，梅格体体面面地出发了。马奇太太原本不大愿意，怕女儿从华丽的地方回来，会比以前更不知足。可梅格苦苦央求，萨莉又答应照顾她。辛苦了一整个冬天，能有一点快乐实在太诱人，母亲终于答应了。
        - id: ch01-b29
          speaker: narrator
          text: 莫法特家富丽又时髦，朴素的梅格刚到时有些胆怯。好在一家人都很和气，很快就让她自在起来。她隐隐觉得，这家人说不上多聪明，也不算很有教养，满身金饰也遮不住平庸。可她还说不清这感觉从哪里来。
        - id: ch01-b30
          speaker: narrator
          text: 这里餐餐丰盛，出门有漂亮马车，每天穿最好的衣服，什么都不用做，只管玩。梅格非常喜欢。没多久，她也学着周围的人拿腔拿调，夹几句法语，把头发烫成波纹，收紧衣裳的腰，还努力谈论时髦款式。安妮的漂亮东西看得越多，她越羡慕，越盼着自己也能富有。再想到家，只觉得又空又暗，连干活也比从前更苦。有了新手套和长袜，她还是觉得自己穷得可怜，受尽了委屈。
        - id: ch01-b31
          speaker: narrator
          text: 她没多少时间顾影自怜。三个姑娘白天购物、散步、骑马、拜访，晚上去看戏、听歌剧，或留在家里玩闹。安妮的朋友多，也很会招待人。她的两个姐姐都十分讲究，贝尔还订了婚，梅格觉得又有趣又浪漫。莫法特先生和太太都胖胖的，快活又和气。先生认识梅格的父亲，太太也像女儿们一样喜欢她。大家都宠着这个被称作“黛西”的客人。再这样下去，梅格真要飘飘然了。
    - id: ch02
      title: 鲜花与闲话
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小聚会那晚，梅格才发现毛葛衣根本穿不出去。别的姑娘都换上轻薄华丽的衣裙，她只好取出白纱裙。跟萨莉那条挺括的新裙一比，它从没显得这么旧，这么软塌寒酸。她看见姑娘们先看裙子，又互相使了个眼色，脸上顿时火辣辣的。
        - id: ch02-b02
          speaker: narrator
          text: 没有人说裙子不好。萨莉主动替梅格梳头，安妮帮她系腰带，贝尔还夸她的手臂洁白。可梅格自尊心强，只从这些好意里听出了对穷人的怜悯。别人披着轻纱，像一群蝴蝶似的说笑飞舞，她却独自站在一旁，心里又冷又苦。
        - id: ch02-b03
          speaker: narrator
          text: 正难受时，女仆捧进一盒鲜花。安妮马上揭开盒盖，屋里的人都对那些玫瑰、欧石南和蕨叶惊叹起来。
        - id: ch02-b04
          speaker: anne
          text: “这当然是给贝尔的。乔治常常送花，可这一盒真是迷人！”
          emotion: surprised
        - id: ch02-b05
          speaker: maid
          text: “送花的人说，这是给马奇小姐的。还有一封信。”
        - id: ch02-b06
          speakers: [anne, belle, clara, sallie]
          ensemble: chorus
          text: “这可太有意思了！是谁送的？我们还不知道你有情郎呢。”
        - id: ch02-b07
          speaker: meg
          text: “信是妈妈写的，花是劳里送的。”
        - id: ch02-b08
          speaker: narrator
          text: 她说得平静，心里却因为劳里没忘记她而欢喜。
        - id: ch02-b09
          speaker: anne
          text: “哦，原来是这样！”
        - id: ch02-b10
          speaker: narrator
          text: 安妮的神情古里古怪。梅格把母亲的信收进口袋，像收起一枚护身符，好挡住嫉妒、虚荣和假骄傲。信上那几句亲切的话安慰了她，鲜花也让她重新振作。
        - id: ch02-b11
          speaker: narrator
          text: 梅格给自己留下几枝蕨叶和玫瑰，很快把其余的花扎成一束束小花，别到朋友们的胸前、发间和裙上。她送花的样子可爱极了。
        - id: ch02-b12
          speaker: clara
          text: “你是我见过最甜美的小人儿。”
        - id: ch02-b13
          speaker: narrator
          text: 大家都被这份小小的心意迷住了，梅格的沮丧也彻底消散。别人去给莫法特太太看打扮时，她把蕨叶贴在波浪般的头发旁，又把玫瑰别到突然没那么寒酸的白裙上。镜子里的脸快快活活，两只眼睛亮晶晶的。
        - id: ch02-b14
          speaker: narrator
          text: 那晚她尽情地玩，舞也跳了个够。她得到了三句恭维话。安妮请她唱歌，有人说她的嗓音很不一般。林肯少校打听，那个眼睛漂亮、清新可爱的小姑娘是谁。莫法特先生硬要跟她跳舞，还很优雅地说，她跳起来一点不拖沓，脚下很有弹性。
        - id: ch02-b15
          speaker: narrator
          text: 梅格过得很愉快，直到她坐在花房门口，等舞伴去拿冰点心时，无意中听见了花墙后面的说话声。
        - id: ch02-b16
          speaker: guest_lady
          text: “他多大了？”
        - id: ch02-b17
          speaker: guest_lady_2
          text: “我看十六七岁吧。”
        - id: ch02-b18
          speaker: guest_lady
          text: “她们姐妹里要是真有一个能成，那多妙。萨莉说，他们现在亲近得很，那位老先生又把几个姑娘宠上了天。”
        - id: ch02-b19
          speaker: mrs_moffat
          text: “我看马奇太太早就算计好了。虽然孩子们还小，她也知道该怎么一步步来。这姑娘自己倒好像还没想到。”
        - id: ch02-b20
          speaker: guest_lady_2
          text: “她那个小谎对妈妈说得跟真的一样。花一送到，她脸红得还挺好看。可怜的小东西，要是打扮时髦些，一定很讨喜欢。我们要是借条裙子给她星期四穿，她会不会生气？”
        - id: ch02-b21
          speaker: mrs_moffat
          text: “她是很骄傲，不过应该不会在意。她只有那条土气的白纱裙。没准今晚就会扯破，那正好有借口给她一条像样的。”
        - id: ch02-b22
          speaker: narrator
          text: 舞伴回来时，发现梅格满脸通红，神情很激动。她的骄傲倒在这时帮了忙，让她把羞辱、愤怒和厌恶都藏了起来。梅格虽然天真，却不会听不懂这番话。
        - id: ch02-b23
          speaker: narrator
          text: “马奇太太早就算计好了”，“对妈妈说了小谎”，“土气的白纱裙”，这几句话在她心里转来转去。她真想立刻跑回家，大哭一场，再请家人告诉她该怎么办。既然回不去，她只好拼命装出快活。这一装居然很成功，没人看出她有多吃力。
        - id: ch02-b24
          speaker: narrator
          text: 聚会终于结束。梅格躺在安静的床上，越想越头疼，几滴眼泪滚下来，才让发烫的脸凉了一点。那些话很愚蠢，也没有恶意，却在她面前打开了一个陌生的世界，也搅乱了她原来安宁的世界。
        - id: ch02-b25
          speaker: narrator
          text: 她和劳里本是纯真的朋友，如今却被几句闲话弄脏了。莫法特太太拿自己的心思去猜测她母亲，害得她对母亲的信任也动摇了一点。这些姑娘又把破裙子当成天大的灾难，平白怜悯她，反而削弱了她原先的决心。她本来懂得，穷人的女儿就该知足地穿着合身份的朴素衣裳。
    - id: ch03
      title: 灰姑娘的邀请
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 梅格一夜没睡安稳。起床时，她眼皮沉重，心里也闷闷的。她一半怪朋友，一半又怪自己当时没有坦白出来，把一切说清楚。那天早晨，大家都懒洋洋的。一直到中午，姑娘们才拿起绒线活。
        - id: ch03-b02
          speaker: narrator
          text: 朋友们的态度有些不一样。她们说话更温柔，对梅格更客气，眼神里又藏着好奇。梅格既惊讶，又有点受宠若惊。直到贝尔放下手里的笔，多情地开了口，她才明白。
        - id: ch03-b03
          speaker: belle
          text: “亲爱的黛西，我已经请你的朋友劳伦斯先生星期四来做客了。我们都很想认识他，这也算好好招待你。”
        - id: ch03-b04
          speaker: narrator
          text: 梅格红了脸。她忽然起了个顽皮念头，想逗逗她们，便一本正经地回答。
        - id: ch03-b05
          speaker: meg
          text: “你们真好，不过他恐怕不会来。”
        - id: ch03-b06
          speaker: belle
          text: “亲爱的，他为什么不来？”
        - id: ch03-b07
          speaker: meg
          text: “他年纪太大了。”
        - id: ch03-b08
          speaker: clara
          text: “我的孩子，你这是什么意思？他到底多大年纪？”
          emotion: surprised
        - id: ch03-b09
          speaker: meg
          text: “我想，快七十岁了吧。”
        - id: ch03-b10
          speaker: narrator
          text: 梅格低头数着针脚，免得她们看见自己眼里的笑意。
        - id: ch03-b11
          speaker: belle
          text: “你这个狡猾的小东西！我们说的当然是那位年轻先生。”
          emotion: happy
        - id: ch03-b12
          speaker: meg
          text: “哪有什么年轻先生。劳里还是个小男孩呢。”
          emotion: happy
        - id: ch03-b13
          speaker: narrator
          text: 姑娘们又对了一番古怪眼色。她们心目中的情郎，到梅格嘴里竟成了小男孩，梅格越想越好笑。
        - id: ch03-b14
          speaker: nan
          text: “他跟你差不多大呀。”
        - id: ch03-b15
          speaker: meg
          text: “他的年纪更接近我妹妹乔。我到八月就十七岁了。”
        - id: ch03-b16
          speaker: anne
          text: “他还特意送花给你，可真有心，对不对？”
        - id: ch03-b17
          speaker: meg
          text: “是啊，他经常送花给我们全家。他家里到处都是花，我们又都喜欢。他祖父老劳伦斯先生和我妈妈是朋友，所以我们几个孩子一起玩，再自然不过了。”
        - id: ch03-b18
          speaker: narrator
          text: 她只盼着这个话题赶快结束。
        - id: ch03-b19
          speaker: clara
          text: “看来黛西还没进社交界呢。”
        - id: ch03-b20
          speaker: belle
          text: “可不是，人人都在田园牧歌里过着天真日子。”
        - id: ch03-b21
          speaker: narrator
          text: 这时，莫法特太太一身绸缎蕾丝，像头大象似的踏着沉重步子走进来。
        - id: ch03-b22
          speaker: mrs_moffat
          text: “我要出去给女儿们买几样小东西。小姐们有什么要我带的吗？”
        - id: ch03-b23
          speaker: sallie
          text: “不用了，谢谢您。我已经有星期四穿的新粉红绸裙，什么都不缺。”
        - id: ch03-b24
          speaker: meg
          text: “我也不……”
        - id: ch03-b25
          speaker: narrator
          text: 梅格说到一半就停了。她忽然想起，自己想要的东西明明很多，却一样都得不到。
        - id: ch03-b26
          speaker: sallie
          text: “你准备穿什么？”
        - id: ch03-b27
          speaker: meg
          text: “还是那条旧白裙。只要能补得见人就行，昨晚扯破得很厉害。”
        - id: ch03-b28
          speaker: narrator
          text: 她尽量说得轻松，心里却很难受。
        - id: ch03-b29
          speaker: sallie
          text: “怎么不让家里再送一条来？”
        - id: ch03-b30
          speaker: meg
          text: “我没有别的裙子。”
        - id: ch03-b31
          speaker: narrator
          text: 梅格好不容易才把这句话说出口。萨莉却没察觉，只是又亲切又吃惊。
        - id: ch03-b32
          speaker: sallie
          text: “只有那一条？这可真……”
        - id: ch03-b33
          speaker: belle
          text: “一点也不奇怪。她还没正式进社交界，要那么多裙子干什么？黛西，别让家里送了，就算你有十二条也不用送。我收着一条很美的蓝绸裙，自己已经穿不下。你就穿它，也让我高兴高兴，好吗？”
        - id: ch03-b34
          speaker: meg
          text: “你真好。不过只要你们不在意，我穿旧裙子也没什么。对我这样的小姑娘来说，它已经够好了。”
        - id: ch03-b35
          speaker: belle
          text: “就让我随心所欲一回，把你打扮得漂漂亮亮吧。我最爱做这个。只要这里那里改一点，你保准会变成个十足的小美人。在你打扮好以前，我谁都不让看。全弄好了，我们就像灰姑娘和仙女教母那样，突然出现在舞会上。”
        - id: ch03-b36
          speaker: narrator
          text: 这番好意很难拒绝。梅格也真想知道，自己经过一番修饰，会不会当真变成“小美人”。她答应了，也把先前对莫法特一家的不快全抛到了脑后。
    - id: ch04
      title: 借来羽毛的小美人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 星期四晚上，贝尔把她自己、梅格和女仆关在房里。她和奥尔唐丝一起动手，把梅格变成了一位时髦小姐。她们烫卷梅格的头发，抹上香粉，把脖子和手臂擦得雪白，又用珊瑚色唇膏把嘴唇涂得更红。梅格奋起反抗，奥尔唐丝才没有再加那么一丁点儿胭脂。
        - id: ch04-b02
          speaker: narrator
          text: 她们又把梅格紧紧束进天蓝色裙子里，勒得她几乎喘不过气。领口低得可怜，梅格在镜子里一看自己，立刻红了脸。接着又戴上整套银丝手镯、项链、胸针和耳环。耳环用一小段看不见的粉色绸带系住。胸前别上茶香玫瑰花苞，再加一圈褶边，总算让她不再在意露在外面的白肩膀。
        - id: ch04-b03
          speaker: narrator
          text: 高跟绸靴满足了梅格最后一个愿望。蕾丝手帕、羽毛扇，再加一束插在肩头花托里的鲜花，全套装扮才算完成。贝尔满意地端详着她，像小姑娘看着刚穿戴一新的洋娃娃。
        - id: ch04-b04
          speaker: hortense
          text: “小姐真是迷人，简直漂亮极了，对不对？”
          emotion: happy
        - id: ch04-b05
          speaker: belle
          text: “来，让大家都看看。”
        - id: ch04-b06
          speaker: narrator
          text: 贝尔带头走向众人等候的房间。梅格拖着长长的裙摆，穸穸穣穣地跟在后面。耳环叮当作响，卷发轻轻摇动，她的心也怦怦直跳。镜子明明白白地告诉她，她已经是个“小美人”了。朋友们也热烈地这么叫她。
        - id: ch04-b07
          speaker: narrator
          text: 好几分钟里，梅格心满意足地站在那里，像寓言中披着借来羽毛的寒鸦。其他人则像一群喜鹊，围着她叽叽喳喳。
        - id: ch04-b08
          speaker: belle
          text: “我去换衣服。南，你教教她怎么管好这条长裙和那双法国高跟鞋，免得她绊倒自己。克拉拉，把你的银蝴蝶拿来，别到她左边那缕长发上。你们可谁都不许弄乱我这件迷人的作品。”
        - id: ch04-b09
          speaker: narrator
          text: 贝尔说完就匆匆走了，对自己的成绩显然满意极了。
        - id: ch04-b10
          speaker: sallie
          text: “你看起来一点也不像你，不过确实很漂亮。我站在你身边，简直不值一提。贝尔的品位真好，你现在完全像个法国小姐。花束垂下来一点，别老是护着它。还有，千万别绊倒。”
        - id: ch04-b11
          speaker: narrator
          text: 萨莉努力假装毫不在意梅格比自己漂亮。梅格却牢牢记住她的提醒，平安下了楼，飘然走进客厅。
        - id: ch04-b12
          speaker: narrator
          text: 她很快发现，华美的衣服当真有魔力。它能吸引某些人，还能换来他们的敬重。上次根本不理她的年轻小姐，忽然亲热起来。只会盯着她看的年轻绅士，这晚不但请人介绍，还送上一堆愚蠢却悦耳的恭维话。沙发上那些爱品评宾客的老太太，也好奇地问她是谁。
        - id: ch04-b13
          speaker: mrs_moffat
          text: “这是黛西·马奇。她父亲是陆军上校，家里原先是我们这里数一数二的名门，只是后来家道中落了，你知道的。她家和劳伦斯家是至交。这姑娘可爱极了，我向你保证，我家内德简直为她神魂颠倒。”
        - id: ch04-b14
          speaker: old_lady
          text: “哎呀！”
          emotion: surprised
        - id: ch04-b15
          speaker: narrator
          text: 老太太举起眼镜，又把梅格从头到脚看了一遍。梅格尽力装作没听见，心里却被莫法特太太这些谎话吓了一跳。那股古怪的感觉始终不散。不过她告诉自己，她正在扮演时髦小姐，倒也应付得不错。
        - id: ch04-b16
          speaker: narrator
          text: 只是裙子紧得勒疼了肋下，裙摆又一个劲往脚底钻。她还总担心耳环飞出去，要么丢了，要么摔坏了。她轻轻摇着扇子，听一位硬要装风趣的年轻绅士讲乏味笑话，还得勉强笑个不停。
        - id: ch04-b17
          speaker: narrator
          text: 突然，梅格的笑声停了。劳里就站在对面，毫不遮掩地盯着她。那眼神里不只有惊讶，她还看出了不赞同。劳里虽然鞠躬微笑，那双诚实的眼睛却让她羞红了脸，只恨自己没穿旧裙子。偏偏贝尔又用胳膊碰了碰安妮，两人先看梅格，再看劳里。好在劳里显得格外孩子气，也格外腆腆。
        - id: ch04-b18
          speaker: meg
          text: “这些傻姑娘，非把这种念头塞进我脑子里。我才不在乎，也绝不让它改变我。”
        - id: ch04-b19
          speaker: narrator
          text: 梅格这样想着，便穸穸作响地穿过房间，过去同劳里握手。
        - id: ch04-b20
          speaker: meg
          text: “你能来，我真高兴。我刚才还担心你不来呢。”
        - id: ch04-b21
          speaker: narrator
          text: 她故意摆出最成熟的姿态。
        - id: ch04-b22
          speaker: laurie
          text: “乔叫我过来看看你变成什么样了，再回去讲给她听，所以我就来了。”
        - id: ch04-b23
          speaker: narrator
          text: 劳里的目光没有落到梅格身上，可听见她那副长辈口气，他的嘴角微微笑了。
        - id: ch04-b24
          speaker: meg
          text: “那你准备怎么告诉她？”
        - id: ch04-b25
          speaker: narrator
          text: 梅格急着知道他怎么看自己，却头一回在劳里身边觉得不自在。
        - id: ch04-b26
          speaker: laurie
          text: “我就说，我压根没认出你来。你看着太成熟了，跟平常完全不一样，弄得我都有点怕你。”
        - id: ch04-b27
          speaker: narrator
          text: 他一边说，一边摆弄手套扣子。
        - id: ch04-b28
          speaker: meg
          text: “你可真荒唐！姑娘们只是闹着玩，才替我这样打扮。我自己倒很喜欢。乔要是看见，一定会大吃一惊，对不对？”
        - id: ch04-b29
          speaker: narrator
          text: 梅格非要逼他说出自己到底有没有变漂亮。
        - id: ch04-b30
          speaker: laurie
          text: “我想她会的。”
        - id: ch04-b31
          speaker: meg
          text: “你不喜欢我这个样子吗？”
        - id: ch04-b32
          speaker: laurie
          text: “不喜欢。”
        - id: ch04-b33
          speaker: meg
          text: “为什么？”
        - id: ch04-b34
          speaker: narrator
          text: 梅格的声音里透着不安。劳里看了看她的卷发、裸露的肩膀，还有奇奇怪怪的整套装饰。那神情比回答更让梅格难堪。
        - id: ch04-b35
          speaker: laurie
          text: “我不喜欢这套花里胡哨的排场。”
        - id: ch04-b36
          speaker: narrator
          text: 被一个比自己小的男孩这样数落，梅格觉得实在太过分了。
        - id: ch04-b37
          speaker: meg
          text: “你是我见过最没礼貌的男孩。”
          emotion: angry
        - id: ch04-b38
          speaker: narrator
          text: 梅格气冲冲地走开，躲到一扇僻静的窗边，想让发热的面颊凉下来。紧身裙把她的脸勒出一层难受的红色。林肯少校从旁边走过，一分钟后，她听见他对母亲说话。
        - id: ch04-b39
          speaker: major_lincoln
          text: “她们简直是拿那个小姑娘当傻子摆弄。我本来还想让您见见她，可她们把她彻底糟蹋了。她今晚只不过是个洋娃娃。”
        - id: ch04-b40
          speaker: meg
          text: “唉，我要是聪明一点，穿自己的衣服就好了。那样别人不会讨厌我，我自己也不会又难受又羞愧。”
          emotion: sad
        - id: ch04-b41
          speaker: narrator
          text: 梅格把额头靠在冰凉的玻璃上，半躲在窗帘后面。她最喜欢的华尔兹已经奏起，她都不在意。直到有人轻轻碰她，她回过头，看见劳里一脸歉意，伸出一只手，又漂漂亮亮地鞠了一躬。
        - id: ch04-b42
          speaker: laurie
          text: “原谅我刚才那么没礼貌。跟我跳一支舞吧。”
        - id: ch04-b43
          speaker: meg
          text: “我恐怕这会让你太难受。”
        - id: ch04-b44
          speaker: narrator
          text: 她想装出被得罪的样子，却怎么也装不成。
        - id: ch04-b45
          speaker: laurie
          text: “一点也不会，我简直求之不得。来吧，我会乖乖的。我确实不喜欢这条裙子，可我真觉得你漂亮极了。”
        - id: ch04-b46
          speaker: narrator
          text: 劳里挥动着两只手，好像只靠说话已经不足以表达赞美。梅格笑了，气也就消了。两人等着踏进舞步时，她低声叮咛。
        - id: ch04-b47
          speaker: meg
          text: “小心我的裙子，别让它绊倒你。它简直要了我的命。我穿它真是傻透了。”
        - id: ch04-b48
          speaker: laurie
          text: “把它别在脖子周围，还能派上用场。”
        - id: ch04-b49
          speaker: narrator
          text: 劳里低头看了看那双蓝色小靴，显然很欣赏它们。两人轻快地滑了出去。他们平时在家一起练过，配合得很好。这对快活的年轻人欢欢喜喜地转了一圈又一圈，看着很是悦目。刚才那场小小的争执，反而让他们比以前更亲近了。
    - id: ch05
      title: 不值得的乐子
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 梅格跳得喘不过气，虽然她不肯说究竟是什么害的。劳里站在旁边替她扇风，她忽然开口。
        - id: ch05-b02
          speaker: meg
          text: “劳里，我想请你帮个忙，好不好？”
        - id: ch05-b03
          speaker: laurie
          text: “当然好！”
        - id: ch05-b04
          speaker: meg
          text: “我今晚这身打扮，请你别回家讲给她们听。她们不会明白这个玩笑，妈妈也会担心。”
        - id: ch05-b05
          speaker: narrator
          text: 劳里的眼睛分明在问，那你为什么还要这样打扮？梅格赶紧往下说。
        - id: ch05-b06
          speaker: meg
          text: “我会亲口把所有事都告诉她们，也会向妈妈招认我有多傻。可我想自己说。所以，你不会说出去的，对不对？”
        - id: ch05-b07
          speaker: laurie
          text: “我答应你，一句都不说。不过她们要是问起来，我该怎么答？”
        - id: ch05-b08
          speaker: meg
          text: “就说我看着很漂亮，也玩得很开心。”
        - id: ch05-b09
          speaker: laurie
          text: “第一句我可以真心实意地说。可第二句呢？你看着根本不像开心。你真的开心吗？”
        - id: ch05-b10
          speaker: narrator
          text: 劳里看着她，梅格的声音也低了下去。
        - id: ch05-b11
          speaker: meg
          text: “不，我现在不开心。你别以为我是个讨厌的人。我只是想找点乐子，可我现在明白了，这种乐子不值得。我也已经厌倦了。”
          emotion: sad
        - id: ch05-b12
          speaker: laurie
          text: “内德·莫法特过来了。他想干什么？”
        - id: ch05-b13
          speaker: narrator
          text: 劳里皱起两道黑眉毛，显然一点也不觉得这位年轻主人能让聚会更愉快。
        - id: ch05-b14
          speaker: meg
          text: “他已经在三支舞后面写了自己的名字，我想他是来请我跳舞的。真让人腻烦！”
        - id: ch05-b15
          speaker: narrator
          text: 梅格故意拖着懒洋洋的腔调，把劳里逗得要命。
        - id: ch05-b16
          speaker: narrator
          text: 之后一直到晚餐，劳里都没再和梅格说话。他看见她跟内德和费希尔一起喝香槟。那两人在劳里眼里，活像一对傻瓜。他觉得自己对马奇家的姐妹们负有兄长般的责任，应该照看她们，她们需要保护时，他还得替她们出头。
        - id: ch05-b17
          speaker: narrator
          text: 内德转身要再给梅格斟酒，费希尔俯身替她捡扇子。劳里走到梅格的椅子旁，压低了声音。
        - id: ch05-b18
          speaker: laurie
          text: “这种酒喝多了，你明天会头疼得裂开。梅格，我劝你别再喝了。你知道你妈妈不喜欢你喝酒。”
        - id: ch05-b19
          speaker: meg
          text: “我今晚可不是梅格，我是个‘洋娃娃’，什么疯事都做得出来。等到明天，我就把这套‘花里胡哨的排场’收起来，再变回那个好得不得了的人。”
        - id: ch05-b20
          speaker: narrator
          text: 她装模作样地轻笑了一声。
        - id: ch05-b21
          speaker: laurie
          text: “真希望明天已经到了。”
        - id: ch05-b22
          speaker: narrator
          text: 劳里低声咕哝着走开。他看见梅格变成这副样子，心里很不痛快。
        - id: ch05-b23
          speaker: narrator
          text: 梅格学着别的姑娘，跳舞，调情，闲聊，傻笑。晚餐以后，她又参加了德国舞，磕磕绊绊才勉强跳完，长裙差点把舞伴绊倒。她又笑又闹，劳里看得很不满，心里已经酿好了一番训话。可他始终没找到机会，因为梅格一直躲着他，直到他来告别。
        - id: ch05-b24
          speaker: meg
          text: “记住啊！”
        - id: ch05-b25
          speaker: narrator
          text: 剧烈的头疼已经发作，梅格却还努力微笑。
        - id: ch05-b26
          speaker: laurie
          text: “至死缄口。”
        - id: ch05-b27
          speaker: narrator
          text: 劳里用法语腔庄严地回答，又夸张地挥了挥手，这才走了。这一小段哑谜引起了安妮的好奇，梅格却累得无力闲聊。她上床时，只觉得自己像刚参加了一场化装舞会，可这舞会远没有她想的快活。
        - id: ch05-b28
          speaker: narrator
          text: 第二天，梅格病了一整天。星期六回家时，两星期的快乐已经把她折腾得精疲力尽。她也觉得，自己在“富贵乡里享福”已经享得够久了。
    - id: ch06
      title: 母亲的打算
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 星期天晚上，梅格和母亲、乔坐在一起。她舒舒服服地看了看四周，开口说道。
        - id: ch06-b02
          speaker: meg
          text: “能这样安安静静地待着，不用每时每刻都端着做客的礼数，真舒服。我们家是不富丽，可它真是个好地方。”
        - id: ch06-b03
          speaker: mrs_march
          text: “亲爱的，听你这么说，我很高兴。我原先还怕，你住过那么华美的地方，会觉得自己家又穷又乏味呢。”
        - id: ch06-b04
          speaker: narrator
          text: 这一天，马奇太太已经担心地打量过女儿好几回。母亲的眼睛，总是最容易看出孩子脸上的变化。
        - id: ch06-b05
          speaker: narrator
          text: 梅格兴高采烈地讲着种种新鲜事，一遍又一遍地说自己玩得有多快活。可她心里分明还压着东西。妹妹们上床以后，她只是看着炉火，不大说话，神情也很忧虑。
        - id: ch06-b06
          speaker: narrator
          text: 时钟敲了九下，乔提议去睡。梅格却忽然离开椅子，搬来贝丝的小凳，把两胘支在母亲膝头，鼓起勇气。
        - id: ch06-b07
          speaker: meg
          text: “妈妈，我想招认一件事。”
        - id: ch06-b08
          speaker: mrs_march
          text: “我早就猜到了。什么事，亲爱的？”
        - id: ch06-b09
          speaker: jo
          text: “要不要我躲开？”
        - id: ch06-b10
          speaker: meg
          text: “当然不用。我不是一向什么都告诉你吗？我不好意思当着妹妹们说，可我想让你知道，我在莫法特家干了哪些可怕的事。”
        - id: ch06-b11
          speaker: mrs_march
          text: “好，我们准备好听了。”
        - id: ch06-b12
          speaker: narrator
          text: 马奇太太笑着说，神情却有些担心。
        - id: ch06-b13
          speaker: meg
          text: “我说过她们替我打扮，可我没说，她们还给我扑粉，把我勒得紧紧的，又烫出满头卷发，弄得像时装画里的人。劳里觉得我那样不端庄。我知道他是这么想的，虽然他没有明说。还有个男人叫我‘洋娃娃’。我明知道这样很傻，可她们一个劲夸我是美人，又说了一堆傻话，我就由着她们把我变成了傻瓜。”
        - id: ch06-b14
          speaker: jo
          text: “就这些吗？”
        - id: ch06-b15
          speaker: narrator
          text: 马奇太太没有说话，只看着漂亮女儿低垂的脸。梅格这些小糊涂，她实在不忍心责备。
        - id: ch06-b16
          speaker: meg
          text: “不。我还喝了香槟，跟人胡闹，又想学别人调情。真是糟糕透了。”
          emotion: sad
        - id: ch06-b17
          speaker: mrs_march
          text: “我想，还有别的事。”
        - id: ch06-b18
          speaker: narrator
          text: 马奇太太抚摸着她柔软的脸颊。梅格的脸忽然红了，过了一会儿才回答。
        - id: ch06-b19
          speaker: meg
          text: “是的。这件事很傻，可我还是想说。我讨厌别人那样议论、那样看待我们和劳里。”
        - id: ch06-b20
          speaker: narrator
          text: 接着，梅格把在莫法特家听来的几段闲话，从头到尾讲了一遍。乔看见母亲越听越用力地抿紧嘴唇。有人把这种念头塞进梅格纯真的心里，母亲显然很不高兴。
        - id: ch06-b21
          speaker: jo
          text: “这简直是我听过最荒唐的话！你当时怎么不立刻跳出去，当面说清楚？”
          emotion: angry
        - id: ch06-b22
          speaker: meg
          text: “那会让我太难为情了。一开始我也不是故意偷听，后来又生气又羞愧，就忘了自己应该走开。”
        - id: ch06-b23
          speaker: jo
          text: “你等着吧！等我见到安妮·莫法特，就让你看看这种蠢话该怎么收拾。她们居然说妈妈早有打算，还说我们对劳里好，是因为他有钱，将来也许会娶我们中的一个！等我把那些傻姑娘议论我们穷孩子的话讲给劳里听，看他会不会笑出声来！”
        - id: ch06-b24
          speaker: narrator
          text: 乔说到后来，自己也笑了。她转念一想，这事确实荒唐得可笑。
        - id: ch06-b25
          speaker: meg
          text: “你要是告诉劳里，我一辈子都不原谅你！妈妈，她不能说，对不对？”
        - id: ch06-b26
          speaker: mrs_march
          text: “不能。这些愚蠢的闲话，千万别再往外传。能多快忘掉，就多快忘掉。”
        - id: ch06-b27
          speaker: narrator
          text: 马奇太太说得十分严肃。
        - id: ch06-b28
          speaker: mrs_march
          text: “我对这家人知道得那么少，却让你住到他们中间，实在是我没想周全。他们也许心地不坏，可他们世故，又缺少教养，满脑子都是对年轻人的庸俗猜想。梅格，想到这次拜访可能会伤害你，我真是说不出的难过。”
          emotion: sad
        - id: ch06-b29
          speaker: meg
          text: “别难过，我不会让它伤害我。我会把不好的事全忘掉，只记住好的。我的确得到了很多快乐，也真的很感谢您让我去。妈妈，我不会再多愁善感，也不会不知足了。我知道自己还是个傻姑娘。在学会照顾自己以前，我会留在您身边。不过，受人夸奖，受人欣赏，真的很美好。我得承认，我很喜欢。”
        - id: ch06-b30
          speaker: narrator
          text: 梅格说出这句话时，显得有些羞愧。
        - id: ch06-b31
          speaker: mrs_march
          text: “喜欢这些再自然不过，本身也没有害处。只要它不变成一股强烈的欲望，不去诱使你干傻事，做出有失身份的举动就好。梅格，你要学会分辨什么样的赞美才真的值得，也要珍惜它。你不只要美丽，也要谦逊。这样，真正优秀的人才会欣赏你。”
        - id: ch06-b32
          speaker: narrator
          text: 梅格坐着想了一会儿。乔背着手站在旁边，既感兴趣，又有些困惑。梅格红着脸谈论欣赏、情郎和这些事，这对乔来说还是头一回。她仿佛觉得，只过了两个星期，姐姐就突然长大了，正在从她身边漂向一个她跟不上的世界。
        - id: ch06-b33
          speaker: meg
          text: “妈妈，您真像莫法特太太说的那样，也有‘打算’吗？”
        - id: ch06-b34
          speaker: mrs_march
          text: “是的，亲爱的，我有许多打算。天下所有母亲都有。不过我想，我的打算跟莫法特太太很不一样。我可以告诉你们几样。现在也该说几句话了，好让你这颗爱幻想的小脑袋和小心灵走上正路。”
        - id: ch06-b35
          speaker: mrs_march
          text: “这是一个很严肃的问题。梅格，你的确还年轻，却已经听得懂了。跟你这样的姑娘谈这种事，由母亲亲口说最合适。乔，也许有一天会轮到你，所以你也听听我的‘打算’吧。要是你们觉得它们真的不错，就和我一起让它们成真。”
        - id: ch06-b36
          speaker: narrator
          text: 乔走过来，坐到椅子的一边扶手上。看她的样子，仿佛她们三个就要一起参加一件极其庄严的事。马奇太太一手握住一个女儿，关切地看着两张年轻的脸。她开口时，语气认真，又很快活。
        - id: ch06-b37
          speaker: mrs_march
          text: “我希望我的女儿们美丽，有才华，心地善良。我希望你们受人欣赏，受人爱戴，也受人尊重。我希望你们的青春快快乐乐，将来能聪明地选择婚姻，婚后过得安乐，也过得有意义。我只愿上帝觉得你们必须经受的忧虑和悲伤，能越少越好。”
        - id: ch06-b38
          speaker: mrs_march
          text: “能得到一个好男人的爱，被他选来做妻子，是女人能遇到的最美好、最甜蜜的事。我真心希望你们都能遇到这样的幸福。梅格，你想到这件事很自然，抱着希望去等它也没有错。聪明的做法，是从现在就让自己准备好。等幸福真的来了，你才会觉得自己担得起那份责任，也配得上那份喜悦。”
        - id: ch06-b39
          speaker: mrs_march
          text: “亲爱的女儿们，我的确对你们有期望。可我不是盼着你们到世上去炒作自己，也不是盼你们只因为一个男人有钱，就嫁给他。我更不希望你们住进富丽堂皇却没有爱的房子，那样的地方根本算不上家。”
        - id: ch06-b40
          speaker: mrs_march
          text: “钱很必要，也很宝贵。只要用得好，它还是一种高尚的东西。可我绝不愿意你们把钱看成人生中最重要的奖赏，或者唯一值得争取的奖赏。只要你们幸福，受人疼爱，也懂得知足，我宁愿看你们做穷人的妻子，也不愿看你们坐在王位上，却丢了自尊和安宁。”
        - id: ch06-b41
          speaker: meg
          text: “贝尔说，穷姑娘要是不努力出去露脸，就根本没有机会。”
          emotion: sad
        - id: ch06-b42
          speaker: jo
          text: “那我们就做老姑娘。”
        - id: ch06-b43
          speaker: mrs_march
          text: “说得对，乔。与其做一个不幸福的妻子，或做一个不懂得自爱、四处寻找丈夫的姑娘，还不如快快活活地做个老姑娘。”
        - id: ch06-b44
          speaker: mrs_march
          text: “梅格，别忧虑。贫穷很少能吓退一个真心爱你的人。我认识的一些最优秀、最受尊敬的女人，从前也都是穷姑娘。可她们那么值得人爱，别人根本不让她们当老姑娘。把这些事交给时间吧。先把现在这个家过得快快乐乐。将来要是有了自己的家，你们才有本事照料好它。要是没有，你们也能在这里知足地生活。”
        - id: ch06-b45
          speaker: mrs_march
          text: “女儿们，有一件事一定要记住。母亲永远愿意听你们说心里话，父亲永远愿意做你们的朋友。不管将来结婚还是独身，我们都希望，也相信，自己的女儿会成为我们一生的骄傲和安慰。”
        - id: ch06-b46
          speakers: [meg, jo]
          ensemble: duo
          text: “我们一定会的，妈妈，一定会！”
          emotion: happy
        - id: ch06-b47
          speaker: narrator
          text: 两个女儿都是全心全意地说出这句话。母亲随即向她们道了晚安。
