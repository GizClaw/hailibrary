  chapters:
    - id: ch01
      title: Packing for Vanity Fair
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One April day, Meg packed the family travel trunk while all her sisters gathered around to help. A timely case of measles had left an opening for her to spend two whole weeks with the fashionable Moffats.
        - id: ch01-b02
          speaker: meg
          text: Those children couldn't have caught the measles at a luckier time.
        - id: ch01-b03
          speaker: jo
          text: And Annie remembered her promise! Two full weeks of fun will be glorious.
        - id: ch01-b04
          speaker: beth
          text: The weather is lovely, too. I'm so glad.
        - id: ch01-b05
          speaker: amy
          text: I wish I could go and have a wonderful time in all these pretty things.
        - id: ch01-b06
          speaker: meg
          text: I wish all of you could come. Since you can't, I'll save every adventure and tell you when I get home. You've all been so generous, lending things and helping me pack.
        - id: ch01-b07
          speaker: narrator
          text: Their eyes made Meg's simple little wardrobe look nearly perfect.
        - id: ch01-b08
          speaker: amy
          text: What did Marmee give you from the treasure chest?
        - id: ch01-b09
          speaker: meg
          text: Silk stockings, the carved fan, and a beautiful blue sash. I wanted the violet silk, but there's no time to remake it, so my old white tarlatan will have to do.
        - id: ch01-b10
          speaker: jo
          text: Wear it over my new muslin skirt. The sash will make it lovely. If I hadn't broken my coral bracelet, you could have borrowed that too.
        - id: ch01-b11
          speaker: meg
          text: There's a pearl set in the chest, but Marmee says real flowers are prettier on a young girl. Laurie promised all the flowers I want. Now, my gray walking suit is ready. Beth, please curl the feather on my hat. Then there's my poplin for Sunday and the small party. It looks rather heavy for spring. Oh, that violet silk would have been perfect!
        - id: ch01-b12
          speaker: amy
          text: Never mind. You have the tarlatan for the grand party, and you always look like an angel in white.
        - id: ch01-b13
          speaker: meg
          text: It isn't low at the neck, and the skirt doesn't trail enough, but it must do. My blue house dress looks almost new since we turned and trimmed it. Still, my silk jacket is out of fashion, my bonnet isn't like Sallie's, and that umbrella disappointed me. I asked for black with a white handle. Marmee forgot and bought green with a yellowish handle. It's sturdy and neat, and I shouldn't complain, but beside Annie's silk umbrella with its gold top, I'll be ashamed of it.
        - id: ch01-b14
          speaker: jo
          text: Exchange it.
        - id: ch01-b15
          speaker: meg
          text: No. Marmee worked hard to get everything, and I won't hurt her over such nonsense. Besides, I have silk stockings and two new pairs of gloves. Jo, it was dear of you to lend me yours. With those and my cleaned everyday pair, I feel positively elegant.
        - id: ch01-b16
          speaker: narrator
          text: Meg took another delighted look inside the glove box. Then Beth arrived with fresh white nightclothes from Hannah.
        - id: ch01-b17
          speaker: meg
          text: Annie has blue and pink bows on her nightcaps. Should I add some to mine?
        - id: ch01-b18
          speaker: jo
          text: I wouldn't. Fancy caps would look ridiculous with plain, untrimmed gowns. Poor people shouldn't put on airs.
        - id: ch01-b19
          speaker: meg
          text: Will I ever be lucky enough to own real lace and caps with bows?
        - id: ch01-b20
          speaker: beth
          text: Just the other day, you said going to Annie's would make you perfectly happy.
        - id: ch01-b21
          speaker: meg
          text: I did, and I am happy. I won't fuss anymore. But isn't it strange? The more you get, the more you seem to want. There, everything is packed except my ball dress. Marmee can put that in.
        - id: ch01-b22
          speaker: narrator
          text: She looked from the half-full trunk to the white tarlatan, pressed and mended many times, and called it her ball dress with great importance. The next day was fine, and Meg set off in style. Marmee had agreed reluctantly. She feared Meg might return less contented than she left. Still, Meg had pleaded, Sallie promised to care for her, and after a hard winter, a little pleasure seemed irresistible. So Meg went off for her first taste of fashionable life.
        - id: ch01-b23
          speaker: narrator
          text: At first, the grand Moffat house and its elegant family intimidated her. They lived foolishly, but they were kind and soon made her comfortable. Their glitter could not quite hide how ordinary they were, though Meg barely understood that. Fine meals, carriage rides, best dresses every day, and nothing to do but enjoy herself suited her wonderfully. Soon she copied their graceful airs, scattered French phrases through her talk, crimped her hair, tightened her dresses, and discussed fashion. Each pretty thing Annie owned made Meg envy her more. Home began to seem bare, work seemed harder, and Meg felt terribly deprived despite her new gloves and silk stockings.
        - id: ch01-b24
          speaker: narrator
          text: She had little time to brood. Annie and her friends shopped, walked, rode, and paid calls all day. At night came theaters, operas, or games at home. Annie's older sisters were grand young ladies, and Belle was engaged, which Meg found very romantic. Mr. and Mrs. Moffat were both merry, generous people who took a great liking to her. Everyone petted their guest and called her Daisy. Before long, her head was in real danger of being turned.
    - id: ch02
      title: The First Party
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: For the small party, Meg discovered that her poplin dress would never do. Everyone else chose thin, delicate gowns, so she brought out the tarlatan. Beside Sallie's crisp new dress, it looked limp and old. The girls glanced at it and then at one another. Proud Meg felt her face burn. Sallie arranged her hair, Annie tied her sash, and Belle praised her white arms, but Meg heard pity in every kindness. She stood alone while they fluttered around like gauzy butterflies, and bitterness began to rise in her. Then the maid entered with a flower box.
        - id: ch02-b02
          speaker: annie
          text: Those must be Belle's. George always sends flowers, but these are absolutely gorgeous!
        - id: ch02-b03
          speaker: maid
          text: They're for Miss March, ma'am. There's a note as well.
        - id: ch02-b04
          speakers: [annie, sallie, belle, clara]
          ensemble: chorus
          text: How exciting! Who sent them? We didn't know you had an admirer!
        - id: ch02-b05
          speaker: meg
          text: The note is from Marmee, and Laurie sent the flowers.
        - id: ch02-b06
          speaker: annie
          text: Oh, really?
        - id: ch02-b07
          speaker: narrator
          text: Annie gave her a peculiar look. Meg tucked Marmee's loving note into her pocket, where it guarded her against envy, vanity, and false pride. The roses, heath, and fern lifted her spirits. She kept a few and turned the rest into small bouquets for her friends.
        - id: ch02-b08
          speaker: clara
          text: You are the sweetest little thing I've ever seen.
        - id: ch02-b09
          speaker: narrator
          text: Giving the flowers swept away Meg's gloom. When the others left to show Mrs. Moffat their dresses, Meg looked in the mirror. With fern in her rippling hair and roses on her gown, she saw a bright, happy face. Her dress no longer seemed terribly shabby.
        - id: ch02-b10
          speaker: narrator
          text: That evening she danced as much as she pleased. Someone admired her singing, Major Lincoln asked about the fresh young girl with beautiful eyes, and Mr. Moffat liked dancing with her because she moved with spirit. Meg was having a delightful time until she sat just inside the conservatory, waiting for her partner to bring an ice. Voices came through the wall of flowers.
        - id: ch02-b11
          speaker: guest_1
          text: How old is he?
        - id: ch02-b12
          speaker: guest_2
          text: Sixteen or seventeen, I imagine.
        - id: ch02-b13
          speaker: guest_1
          text: A match like that would be wonderful for one of those girls, wouldn't it? Sallie says they're already very close, and the old gentleman adores them.
        - id: ch02-b14
          speaker: mrs_moffat
          text: Mrs. March has her plans, no doubt. She'll play her cards carefully, though they're young. The girl clearly hasn't thought of it yet.
        - id: ch02-b15
          speaker: guest_2
          text: She pretended the note was from her mother, but she must understand. She blushed so prettily when the flowers arrived. Poor child, she'd be lovely if someone dressed her properly. Would lending her a gown for Thursday offend her?
        - id: ch02-b16
          speaker: mrs_moffat
          text: She's proud, but I think she'd accept. That dowdy tarlatan is her only evening dress. Perhaps it will tear tonight and give us the perfect excuse to offer something decent.
        - id: ch02-b17
          speaker: narrator
          text: Meg's partner returned and found her flushed and shaken. Pride helped her hide the humiliation, anger, and disgust. Innocent as she was, she understood their gossip. She tried to forget, but the cruel phrases kept circling in her mind. She wanted to cry, run home, and ask for advice. Since she could not, she acted cheerful so well that nobody guessed the effort it cost. In bed at last, she thought and fumed until her head hurt, then cooled her hot cheeks with tears.
        - id: ch02-b18
          speaker: narrator
          text: Those foolish but well-meant words opened a troubling new world. They spoiled her innocent friendship with Laurie, shook her trust in Marmee with talk of worldly schemes, and weakened her decision to be satisfied with clothes suited to a poor man's daughter. She slept badly and rose tired, unhappy with her friends and ashamed that she had not spoken honestly.
    - id: ch03
      title: Dressed Like a Doll
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The girls passed a lazy morning over their needlework. They treated Meg with new respect, listened tenderly, and watched her with open curiosity. She felt surprised and flattered until Belle looked up from a letter.
        - id: ch03-b02
          speaker: belle
          text: Daisy, dear, I've invited your friend Mr. Laurence for Thursday. We'd like to meet him, and inviting him is only a proper compliment to you.
        - id: ch03-b03
          speaker: meg
          text: That's very kind, but I doubt he'll come.
        - id: ch03-b04
          speaker: belle
          text: Why wouldn't he, darling?
        - id: ch03-b05
          speaker: meg
          text: He's too old.
        - id: ch03-b06
          speaker: clara
          text: Too old? My dear child, how old is he?
        - id: ch03-b07
          speaker: meg
          text: Nearly seventy, I believe.
        - id: ch03-b08
          speaker: narrator
          text: Meg counted stitches to hide her amusement.
        - id: ch03-b09
          speaker: belle
          text: You sly thing! We mean the young Mr. Laurence.
        - id: ch03-b10
          speaker: meg
          text: There isn't one. Laurie is just a boy.
        - id: ch03-b11
          speaker: narrator
          text: Meg laughed at the sisters' baffled looks.
        - id: ch03-b12
          speaker: sallie
          text: He's about your age.
        - id: ch03-b13
          speaker: meg
          text: He's closer to Jo's age. I'll be seventeen in August.
        - id: ch03-b14
          speaker: annie
          text: Still, it was sweet of him to send flowers.
        - id: ch03-b15
          speaker: meg
          text: He often sends them to all of us. His conservatory is full, and we love flowers. Marmee and old Mr. Laurence are friends, so of course we children spend time together.
        - id: ch03-b16
          speaker: clara
          text: Daisy plainly isn't out in society yet.
        - id: ch03-b17
          speaker: belle
          text: Such innocent country ways, all around.
        - id: ch03-b18
          speaker: narrator
          text: Mrs. Moffat swept in, wrapped in silk and lace, and offered to shop for them. Sallie needed nothing because her new pink silk was ready. Meg began to say the same, then remembered several things she wanted and could not buy.
        - id: ch03-b19
          speaker: sallie
          text: What are you wearing Thursday?
        - id: ch03-b20
          speaker: meg
          text: My old white dress again, if I can mend it. It tore badly last night.
        - id: ch03-b21
          speaker: sallie
          text: Why not send home for another one?
        - id: ch03-b22
          speaker: meg
          text: I don't have another.
        - id: ch03-b23
          speaker: sallie
          text: Only one? How strange...
        - id: ch03-b24
          speaker: belle
          text: Not strange at all. Why own piles of gowns before you're out? Daisy, I have a lovely blue silk I've outgrown. Wear it Thursday, just to please me.
        - id: ch03-b25
          speaker: meg
          text: You're very kind, but my own dress is fine if it doesn't bother you. It's good enough for a girl my age.
        - id: ch03-b26
          speaker: belle
          text: Let me dress you properly for my own pleasure. With a few touches, you'll be a real beauty. Nobody will see you until you're finished. Then we'll burst in like Cinderella and her fairy godmother.
        - id: ch03-b27
          speaker: narrator
          text: The offer was too kindly made to refuse, and Meg longed to discover whether she really could be beautiful. She accepted and forgot her uneasy feelings about the Moffats.
        - id: ch03-b28
          speaker: narrator
          text: On Thursday, Belle and her maid transformed her. They curled and crimped her hair, powdered her neck and arms, and reddened her lips. Meg refused rouge, but they laced her into a sky-blue silk so tight she could barely breathe and so low that she blushed at her reflection. They added silver bracelets, necklace, brooch, and earrings tied on with hidden pink silk. Rosebuds and a ruffle softened the bare shoulders. High-heeled silk boots fulfilled her last wish. A lace handkerchief, feathered fan, and bouquet completed Belle's new doll.
        - id: ch03-b29
          speaker: hortense
          text: Mademoiselle is charming! So very pretty, isn't she?
        - id: ch03-b30
          speaker: belle
          text: Come show everyone.
        - id: ch03-b31
          speaker: narrator
          text: Meg rustled after her, skirts trailing, earrings tinkling, curls bouncing, and heart pounding. The mirror had declared her a beauty. Her friends agreed, and for several minutes she enjoyed her borrowed finery like the jackdaw in the fable wearing other birds' feathers.
        - id: ch03-b32
          speaker: belle
          text: Nan, teach her to manage that train and those French heels while I dress. Clara, fasten her long left curl with your silver butterfly. And nobody ruin my beautiful work.
        - id: ch03-b33
          speaker: sallie
          text: You don't look like yourself at all, but you look wonderful. Belle has marvelous taste, and you're positively French. Let the flowers hang naturally, and please don't trip.
        - id: ch03-b34
          speaker: narrator
          text: Meg reached the drawing room safely. Fine clothes worked a peculiar magic. Young women who had ignored her became affectionate. Young men who had merely stared now requested introductions and offered foolish, pleasing compliments. Older women peered from sofas and asked who she was.
        - id: ch03-b35
          speaker: mrs_moffat
          text: Daisy March. Her father is an army colonel, from one of our finest families, though they've lost their fortune. They're intimate with the Laurences. She's a sweet creature, and my Ned is mad about her.
        - id: ch03-b36
          speaker: old_lady
          text: Dear me!
        - id: ch03-b37
          speaker: narrator
          text: The older lady raised her glass to inspect Meg. Meg pretended not to hear Mrs. Moffat's false claims. She played her new role tolerably well, though the dress hurt her side, the train caught her feet, and she feared losing the borrowed earrings. Then, while she flirted her fan and laughed at a young man's feeble jokes, she saw Laurie staring in surprise. His honest eyes seemed to disapprove. Meg wished she had worn her own dress. Belle nudged Annie, and both looked from Meg to Laurie. Meg refused to let their foolish notions change her and crossed the room.
    - id: ch04
      title: Fuss and Feathers
      blocks:
        - {id: ch04-b01, speaker: meg, text: "I'm glad you came. I was afraid you wouldn't."}
        - {id: ch04-b02, speaker: laurie, text: "Jo asked me to come and report how you looked, so here I am."}
        - {id: ch04-b03, speaker: meg, text: "And what will you report?"}
        - {id: ch04-b04, speaker: laurie, text: "That I hardly recognized you. You look so grown-up and so unlike yourself that you frighten me."}
        - {id: ch04-b05, speaker: meg, text: "Don't be absurd. The girls dressed me this way for fun, and I rather like it. Imagine Jo's face if she saw me!"}
        - {id: ch04-b06, speaker: laurie, text: "Yes. She'd certainly stare."}
        - {id: ch04-b07, speaker: meg, text: "You don't like me this way?"}
        - {id: ch04-b08, speaker: laurie, text: "No, I don't."}
        - {id: ch04-b09, speaker: meg, text: "Why not?"}
        - id: ch04-b10
          speaker: narrator
          text: Laurie looked over the crimped hair, bare shoulders, and overdecorated gown. His expression embarrassed her more than his blunt answer.
        - {id: ch04-b11, speaker: laurie, text: "I don't like all that fuss and feathers."}
        - {id: ch04-b12, speaker: meg, text: "You are the rudest boy I've ever met!", emotion: angry}
        - id: ch04-b13
          speaker: narrator
          text: Meg retreated to a quiet window. Major Lincoln passed, then spoke to his mother nearby.
        - {id: ch04-b14, speaker: major_lincoln, text: "They're making that poor girl ridiculous. I wanted you to see her, but they've ruined her. Tonight she's nothing but a doll."}
        - id: ch04-b15
          speaker: narrator
          text: Meg wished she had worn her own clothes. Then she would not feel ashamed or disgust anyone. She pressed her forehead to the cool glass and ignored her favorite waltz until Laurie returned, penitent, and offered his hand.
        - {id: ch04-b16, speaker: laurie, text: "Please forgive me for being rude. Come dance with me."}
        - {id: ch04-b17, speaker: meg, text: "Wouldn't that be terribly unpleasant for you?"}
        - {id: ch04-b18, speaker: laurie, text: "Not at all. I'm dying to dance. I'll behave. I dislike the gown, but you are splendid."}
        - {id: ch04-b19, speaker: meg, text: "Watch out for my train. It's tormenting me, and I was a goose to wear it."}
        - {id: ch04-b20, speaker: laurie, text: "Pin it around your neck. Then it might be useful."}
        - id: ch04-b21
          speaker: narrator
          text: He approved of the little blue boots. They danced beautifully together after all their practice at home, and the quarrel melted away. When Meg soon ran out of breath, Laurie stood fanning her.
        - {id: ch04-b22, speaker: meg, text: "Laurie, will you do me a favor?"}
        - {id: ch04-b23, speaker: laurie, text: "Of course!"}
        - {id: ch04-b24, speaker: meg, text: "Please don't tell them at home about this dress. They won't understand the joke, and Marmee will worry. I'll confess everything myself. Promise you won't tell?"}
        - {id: ch04-b25, speaker: laurie, text: "I promise. What should I say when they ask?"}
        - {id: ch04-b26, speaker: meg, text: "Say I looked pretty and had a good time."}
        - {id: ch04-b27, speaker: laurie, text: "The first part is easy. But are you enjoying yourself? You don't look happy."}
        - {id: ch04-b28, speaker: meg, text: "Not now. Please don't think I'm awful. I wanted some fun, but this kind isn't worth it. I'm tired of it."}
        - {id: ch04-b29, speaker: laurie, text: "Here comes Ned Moffat. What does he want?"}
        - {id: ch04-b30, speaker: meg, text: "He claimed three dances. What a bore!"}
        - id: ch04-b31
          speaker: narrator
          text: Meg's languid imitation greatly amused Laurie. At supper he found her drinking champagne with Ned and Fisher, who were behaving foolishly. Laurie felt almost like a brother to the March girls and watched over them whenever they needed defending.
        - {id: ch04-b32, speaker: laurie, text: "You'll have a dreadful headache tomorrow if you keep drinking that. I wouldn't. You know Marmee dislikes it."}
        - {id: ch04-b33, speaker: meg, text: "Tonight I'm not Meg. I'm a doll who does absurd things. Tomorrow I'll put away my fuss and feathers and become wonderfully good again."}
        - {id: ch04-b34, speaker: laurie, text: "I wish tomorrow were here."}
        - id: ch04-b35
          speaker: narrator
          text: Meg kept dancing, flirting, chattering, and giggling like the other girls. After supper she attempted the German dance, tangled herself in her train, nearly upset her partner, and romped enough to scandalize Laurie. She avoided his intended lecture until he came to say good night.
        - {id: ch04-b36, speaker: meg, text: "Remember your promise!"}
        - {id: ch04-b37, speaker: laurie, text: "Silent as the grave."}
        - id: ch04-b38
          speaker: narrator
          text: Annie wondered about their secret, but Meg was too exhausted to gossip. She went to bed feeling she had attended a masquerade and enjoyed it far less than expected. She was ill the next day. On Saturday, worn out by two weeks of pleasure, she gladly went home.
    - id: ch05
      title: Marmee's Plans
      blocks:
        - {id: ch05-b01, speaker: meg, text: "Quiet feels wonderful. I'm glad I don't have to use company manners every minute. Home is lovely, even if it isn't grand."}
        - {id: ch05-b02, speaker: marmee, text: "I'm glad, dear. I worried that home might seem poor and dull after such splendid rooms."}
        - id: ch05-b03
          speaker: narrator
          text: On Sunday evening Meg sat with Marmee and Jo. She had described her adventures cheerfully and insisted she had enjoyed herself, yet Marmee's watchful eyes saw a burden. After the younger girls went to bed, Meg stared into the fire. At nine, Jo suggested bed. Meg took Beth's stool, leaned against her mother's knee, and gathered her courage.
        - {id: ch05-b04, speaker: meg, text: "Marmee, I need to confess."}
        - {id: ch05-b05, speaker: marmee, text: "I thought you did. What happened, dear?"}
        - {id: ch05-b06, speaker: jo, text: "Should I leave?"}
        - {id: ch05-b07, speaker: meg, text: "Certainly not. I tell you everything. I couldn't speak in front of the little girls, but you should hear all the dreadful things I did."}
        - {id: ch05-b08, speaker: marmee, text: "We're ready."}
        - {id: ch05-b09, speaker: meg, text: "I said they dressed me up, but not that they powdered me, squeezed me into that gown, and frizzled my hair until I looked like a fashion picture. Laurie thought I looked improper, though he didn't say it. A man called me a doll. I knew it was foolish, but everyone praised my beauty until I let them make a fool of me."}
        - {id: ch05-b10, speaker: jo, text: "Is that everything?"}
        - {id: ch05-b11, speaker: meg, text: "No. I drank champagne, romped, tried to flirt, and behaved horribly."}
        - {id: ch05-b12, speaker: marmee, text: "I think there's more."}
        - {id: ch05-b13, speaker: meg, text: "Yes. It's silly, but I hate people saying such things about us and Laurie."}
        - id: ch05-b14
          speaker: narrator
          text: Meg repeated the gossip she had overheard. Marmee pressed her lips together, unhappy that such ideas had entered her daughter's innocent mind.
        - {id: ch05-b15, speaker: jo, text: "What absolute nonsense! Why didn't you jump out and tell them so?"}
        - {id: ch05-b16, speaker: meg, text: "I was too embarrassed. At first I couldn't help hearing. Then I became so angry and ashamed that I forgot to walk away."}
        - {id: ch05-b17, speaker: jo, text: "Wait until I meet Annie Moffat. I'll show you how to answer such rubbish! Imagine Marmee making plans and treating Laurie kindly because he's rich and might marry one of us someday. Laurie will roar when I tell him what those silly girls said."}
        - {id: ch05-b18, speaker: meg, text: "If you tell him, I'll never forgive you! Marmee, she mustn't."}
        - {id: ch05-b19, speaker: marmee, text: "No. Never repeat that foolish gossip. Forget it quickly. I was unwise to send you among people I knew so little. They may be kind, but they're worldly, badly mannered, and full of vulgar notions about young people. Meg, I am deeply sorry for any harm this visit has done."}
        - {id: ch05-b20, speaker: meg, text: "Please don't be sorry. I won't let it harm me. I'll forget the bad and keep the good, because much of it truly was fun. Thank you for letting me go. I won't grow romantic or dissatisfied. I'm a silly girl, and I'll stay near you until I can look after myself. Still, being praised and admired is lovely. I can't pretend I don't like it."}
        - {id: ch05-b21, speaker: marmee, text: "That feeling is natural and harmless unless it becomes a passion and leads you into foolish or improper behavior. Learn which praise deserves your respect. Win the admiration of good people by being modest as well as pretty."}
        - id: ch05-b22
          speaker: narrator
          text: Meg thought quietly. Jo watched with puzzled interest. In two weeks, Meg seemed to have grown up and drifted toward a world Jo could not enter.
        - {id: ch05-b23, speaker: meg, text: "Marmee, do you really have plans for us?"}
        - {id: ch05-b24, speaker: marmee, text: "Many. Every mother does, though mine differ from Mrs. Moffat's. You're young, Meg, but old enough to understand. A mother's voice is the right one for this. Jo, perhaps your turn will come, so listen and help me carry out my plans if they're good."}
        - id: ch05-b25
          speaker: narrator
          text: Jo perched solemnly on the arm of Marmee's chair. Marmee took one hand from each daughter and looked into their young faces.
        - id: ch05-b26
          speaker: marmee
          text: I want my daughters to be beautiful, accomplished, and good. I want you admired, loved, and respected, with happy youth and useful, pleasant lives. I hope each of you will marry wisely and know as little sorrow as God sees fit to send. Being loved and chosen by a good man can be one of a woman's sweetest joys. It is natural to hope for that, and wise to prepare for its duties. But I don't want you making a show in the world, marrying men only because they're rich, or living in splendid houses without love. Money is necessary, precious, and noble when used well. But it is not life's first or only prize. I would rather see you contented wives of poor men, loved and at peace, than queens without self-respect.
        - {id: ch05-b27, speaker: meg, text: "Belle says poor girls have no chance unless they push themselves forward."}
        - {id: ch05-b28, speaker: jo, text: "Then we'll be old maids."}
        - id: ch05-b29
          speaker: marmee
          text: Exactly, Jo. Better happy old maids than unhappy wives, or girls chasing husbands. Don't worry, Meg. Poverty rarely scares away sincere love. Some of the finest women I know began poor, but they were too worthy of love to remain alone. Leave it to time. Make this home happy. Then you'll be ready for homes of your own if they come, and content here if they do not. Remember this above all. Marmee is always ready for your confidence, Father is always your friend, and whether you marry or remain single, we trust you will be the pride and comfort of our lives.
        - id: ch05-b30
          speakers: [meg, jo]
          ensemble: duo
          text: We will, Marmee. We will!
          emotion: happy
        - id: ch05-b31
          speaker: narrator
          text: They meant it with all their hearts as Marmee kissed them good night.
