        timbre: 清脆
        pace: 适中
        pitch: 中高音
    beth:
      display_name: 贝丝
      tts:
        delivery: 温柔真挚，病后略显轻弱
        timbre: 甜美纤细
        pace: 舒缓
        pitch: 中高音
    mr_march:
      display_name: 马奇先生
      tts:
        delivery: 慈祥诚恳，带着父亲的欣慰
        timbre: 温暖沉稳
        pace: 从容
        pitch: 中低音
    mrs_march:
      display_name: 马奇太太
      tts:
        delivery: 慈爱沉静，话语令人安心
