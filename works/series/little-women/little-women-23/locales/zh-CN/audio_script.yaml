audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着克制的幽默
        timbre: 清澈柔和
        pace: 从容舒展
        pitch: 中音
    meg:
      display_name: 梅格
      tts:
        delivery: 端庄温和，语气稳重
        timbre: 柔润
        pace: 适中
        pitch: 中音
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情感来得快而真
        timbre: 明亮有力
        pace: 稍快
        pitch: 中音
    amy:
      display_name: 艾米
      tts:
