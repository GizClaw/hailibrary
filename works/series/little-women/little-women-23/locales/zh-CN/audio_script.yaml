    hannah:
      display_name: 汉娜
      tts:
        delivery: 朴实直爽，带着家常口音
        timbre: 粗暖
        pace: 适中
        pitch: 中低音
    laurie:
      display_name: 劳里
      tts:
        delivery: 机灵热情，笑意藏不住
        timbre: 清朗
        pace: 轻快
        pitch: 中音
    mr_brooke:
      display_name: 布鲁克先生
      tts:
        delivery: 谦和克制，稍显拘谨
        timbre: 清正温润
        pace: 适中
        pitch: 中低音
    aunt_march:
      display_name: 马奇姑妈
      tts:
        delivery: 强势挑剔，说话斩钉截铁
        timbre: 苍老尖利
        pace: 稍慢
        pitch: 中低音
    mr_laurence:
      display_name: 劳伦斯先生
      tts:
        delivery: 直率威严，对亲近的人藏着慈爱
        timbre: 浑厚
        pace: 从容
        pitch: 低音
  chapters:
    - id: ch01
      title: 屋里的等待
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天，母女几个像一群蜜蜂围着蜂王，把马奇先生守在中间。她们什么也不顾，只想看他，照料他，听他说话。这位新病人眼看就要被她们的好意折腾坏了。他坐在贝丝的沙发旁，三个女儿紧挨着他，汉娜也不时从门口探进头，只为再瞧一眼这位亲爱的人。
        - id: ch01-b02
          speaker: narrator
          text: 这个家的幸福仿佛已经什么都不缺了。可年长的几个人都知道，还有一件事没有定下来，只是谁也不说。马奇夫妇看着梅格，又担心地对望。乔时不时板起脸，有人还看见她对着门厅里布鲁克先生的雨伞挥拳头。梅格却又走神又害羞，话也少了。门铃一响，她就吃一惊。一听到约翰的名字，她马上红了脸。
        - id: ch01-b03
          speaker: amy
          text: 父亲都平安回家了，可大家好像还在等什么，怎么都静不下来。真奇怪。
        - id: ch01-b04
          speaker: narrator
          text: 贝丝心里想的却是，邻居们为什么不像平常那样来串门。
        - id: ch01-b05
          speaker: narrator
          text: 下午，劳里从门前走过，看见梅格站在窗边，突然演起了通俗剧。他扑通跪进雪里，一会儿捶胸，一会儿扯头发，又合起双手苦苦哀求，好像在求一件天大的恩典。梅格叫他规矩些，赶快走开。他便用手帕绞出几滴根本没有的眼泪，装成绝望的样子，跌跌撞撞地拐过街角。
        - id: ch01-b06
          speaker: meg
          text: 这个傻瓜到底是什么意思？
        - id: ch01-b07
          speaker: narrator
          text: 梅格笑着问，还想装成一点也不明白。
        - id: ch01-b08
          speaker: jo
          text: 他是演给你看的。过些时候，你的约翰就会是那副样子。多感人啊，对不对？
        - id: ch01-b09
          speaker: meg
          text: 别说什么“我的约翰”。这话不合适，也不是真的。乔，求你别再烦我了。我早就说过，我没那么在意他，以后也不许再提。我们好好相处，一切还和以前一样。
        - id: ch01-b10
          speaker: narrator
          text: 可她故意把“我的约翰”几个字说得又慢又长，听着分明很受用。
        - id: ch01-b11
          speaker: jo
          text: 怎么可能和以前一样？话都说出口了，劳里那场恶作剧也把你从我身边抢走了。我看得出，母亲也看得出。你一点都不像以前，好像离我特别远。我不是故意烦你，我会像个男子汉那样忍住。可我真盼着这事赶快定下来。我最讨厌等了。你要是真想做，就快点把它了结吧。
          emotion: angry
        - id: ch01-b12
          speaker: meg
          text: 他不开口，我能说什么？何况他不会开口的，因为父亲说我年纪太小。
        - id: ch01-b13
          speaker: narrator
          text: 梅格低头做着针线，嘴角却有一点奇怪的笑意。看来，她不大赞同父亲的话。
        - id: ch01-b14
          speaker: jo
          text: 就算他问了，你也不知道怎么答。你不是哭，就是脸红，再不然就任由他摆布，连一句干脆的“不”都说不出来。
        - id: ch01-b15
          speaker: meg
          text: 我才没你想的那么傻，也没那么软弱。我早就想好该说什么了，所以不会手忙脚乱。谁知道会发生什么？我只是先准备好。
        - id: ch01-b16
          speaker: narrator
          text: 她说得郑重其事，脸上的红晕一阵深，一阵浅，显得格外可爱。乔实在忍不住，笑了出来。
        - id: ch01-b17
          speaker: jo
          text: 那你愿意告诉我，你准备怎么说吗？
        - id: ch01-b18
          speaker: meg
          text: 当然。你都十六岁了，完全可以当我的知心人。将来你自己遇到这种事，说不定我这点经验还能帮你。
        - id: ch01-b19
          speaker: jo
          text: 我才不会遇上呢。看别人谈情说爱倒挺有趣，要是轮到我，我只会觉得自己像个傻瓜。
        - id: ch01-b20
          speaker: narrator
          text: 她只是想了想那个场面，脸上就露出了惊恐的神色。
        - id: ch01-b21
          speaker: meg
          text: 要是你特别喜欢一个人，他也喜欢你，我想你就不会觉得傻了。
        - id: ch01-b22
          speaker: narrator
          text: 梅格轻轻说着，像在自言自语。她望着窗外的小路。夏天的黄昏，她常在那里看见一对对恋人并肩散步。
        - id: ch01-b23
          speaker: jo
          text: 你还没说呢，你到底准备怎么回答他？
        - id: ch01-b24
          speaker: meg
          text: 我会非常平静，也非常坚定地说，“谢谢您，布鲁克先生，您真好。不过，我赞同父亲的话。我还年轻，现在不该订婚。所以请您别再说了，我们还和以前一样做朋友吧。”
        - id: ch01-b25
          speaker: jo
          text: 哦，这话可真够冷，也真够硬。我才不信你说得出口。就算你真说了，他也不会死心。他要是像书里那些被拒绝的情人一样闹起来，你不忍心伤他，一定会让步。
        - id: ch01-b26
          speaker: meg
          text: 我不会。我要告诉他，我已经决定了。然后，我就庄严地走出房间。
        - id: ch01-b27
          speaker: narrator
          text: 梅格说着就站起来，正想排演一下怎样庄严退场，门厅里却传来了脚步声。她马上坐回去，拿起针线拼命缝，好像这条缝能不能按时缝完，就关系到她的性命。乔拼命忍住笑。有人客气地敲了敲门，她便板起脸，做出最不欢迎客人的样子，把门打开。
        - id: ch01-b28
          speaker: mr_brooke
          text: 下午好。我是来取雨伞的。也就是说，我想问问令尊今天感觉怎么样。
        - id: ch01-b29
          speaker: narrator
          text: 他看了看眼前两张藏不住秘密的脸，不免有点慌乱。
        - id: ch01-b30
          speaker: jo
          text: 它很好，正站在雨伞架上。我去把他拿来，再告诉它您来了。
        - id: ch01-b31
          speaker: narrator
          text: 乔把父亲和雨伞说得乱七八糟，接着就溜走了，把机会留给梅格，好让她发表演说，再庄严退场。可乔刚消失，梅格就侧着身子，一点点往门口挪。
        - id: ch01-b32
          speaker: meg
          text: 母亲会很高兴见到您。请坐，我去叫她。
        - id: ch01-b33
          speaker: mr_brooke
          text: 别走。玛格丽特，你怕我吗？
        - id: ch01-b34
          speaker: narrator
          text: 布鲁克先生看起来那么受伤，梅格不由得以为，自己一定做了什么非常失礼的事。她一直红到额前的小卷发根。他从没叫过她玛格丽特，可这个名字从他嘴里说出来，原来这么自然，这么甜蜜。她急着让自己显得友好自在，便信赖地伸出一只手。
        - id: ch01-b35
          speaker: meg
          text: 您对父亲那么好，我怎么会怕您？我只是不知道该怎样感谢您。
        - id: ch01-b36
          speaker: mr_brooke
          text: 要我告诉你，怎样感谢我吗？
        - id: ch01-b37
          speaker: narrator
          text: 布鲁克先生把那只小手紧紧握在自己的两手之间，低头看着梅格。那双棕色眼睛里的爱意太深了。她心里怦怦直跳，既想逃走，又舍不得离开，只想留下来听他说下去。
        - id: ch01-b38
          speaker: meg
          text: 哦，不，请别说。我宁愿不知道。
        - id: ch01-b39
          speaker: narrator
          text: 她想把手抽回来。她嘴上说不怕，神情却明明白白地慌了。
        - id: ch01-b40
          speaker: mr_brooke
          text: 我不会为难你。我只想知道，你心里是不是有一点在意我。梅格，亲爱的，我真的很爱你。
        - id: ch01-b41
          speaker: narrator
          text: 这正是说出那篇平静又得体的演说的好时候。可梅格一句也没说。她早就准备好的话全都忘了，只是低下头，轻轻给了一个傻乎乎的回答。
        - id: ch01-b42
          speaker: meg
          text: 我不知道。
        - id: ch01-b43
          speaker: narrator
          text: 她的声音小得让约翰不得不俯下身才听得清。他似乎觉得这番工夫很值得，暗暗一笑，像是已经十分满意。他又感激地握了握她的手。
        - id: ch01-b44
          speaker: mr_brooke
          text: 那你愿意试着弄明白吗？我太想知道答案了。要是不知道最后能不能得到回报，我做什么都没有精神。
        - id: ch01-b45
          speaker: meg
          text: 我还太小了。
        - id: ch01-b46
          speaker: narrator
          text: 梅格说得吞吞吐吐。她不明白自己为什么如此心慌，却又觉得这种滋味很甜蜜。
        - id: ch01-b47
          speaker: mr_brooke
          text: 我可以等。等待的这段日子，你也可以慢慢学着喜欢我。亲爱的，这门功课很难吗？
        - id: ch01-b48
          speaker: meg
          text: 只要我肯学，就不难。可是……
        - id: ch01-b49
          speaker: mr_brooke
          text: 那就请你肯学吧，梅格。我喜欢教书，这门功课又比德语容易。
        - id: ch01-b50
          speaker: narrator
          text: 约翰打断她，连她的另一只手也握住了。这下，他俯身细看她的脸，她想遮也没法遮了。
    - id: ch02
      title: 马奇姑妈一锤定音
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 约翰的口气是在恳求。可梅格害羞地偷看一眼，发现那双眼睛里不只有温柔，还藏着笑。他脸上那丝自得，分明是在说，他相信自己一定会成功。这下可惹恼了梅格。安妮·莫法特教过她的那些愚蠢的卖弄手段，忽然全冒了出来。再善良的小妇人，心里也睡着一点想支配别人的念头。现在，这念头醒了，一下子占了上风。
        - id: ch02-b02
          speaker: narrator
          text: 梅格心里一阵激动，连自己都觉得陌生。她不知道还能怎样，就由着一个任性的念头，抽回双手，赌气开了口。
        - id: ch02-b03
          speaker: meg
          text: 我不肯学。请您走开，别再来烦我！
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: 可怜的布鲁克先生好像眼看着一座美丽的空中楼阁在头顶塌了下来。他从没见过梅格这个样子，一时完全糊涂了。
        - id: ch02-b05
          speaker: mr_brooke
          text: 你真是这个意思吗？
        - id: ch02-b06
          speaker: narrator
          text: 他忧心地问着，跟在转身走开的梅格后面。
        - id: ch02-b07
          speaker: meg
          text: 是的，我就是这个意思。我不想为这种事烦恼。父亲说我现在还太小，用不着去想，我自己也不愿意。
        - id: ch02-b08
          speaker: mr_brooke
          text: 我就不能盼着你将来改变心意吗？我愿意等。在你有更多时间想清楚以前，我一句都不再说。梅格，别拿我取乐。我从没想过，你会这样对我。
        - id: ch02-b09
          speaker: meg
          text: 那就根本别想我。我宁愿您不想。
        - id: ch02-b10
          speaker: narrator
          text: 梅格故意在考验情人的耐性，想看看自己究竟有多大力量。这竟然给了她一点淘气的满足。这时，约翰脸色苍白，神情严肃，的确更像她崇拜的小说男主人公了。不过，他没有拍打额头，也没在屋里来回踱步。他只是站在那里，又惆怅又温柔地望着她。梅格不由自主地心软了。
        - id: ch02-b11
          speaker: narrator
          text: 接下来会发生什么，谁也说不准。偏偏在这个紧要关头，马奇姑妈拄着手杖，一瘸一拐地走了进来。
        - id: ch02-b12
          speaker: narrator
          text: 老太太实在按捺不住，急着想看看自己的侄儿。她坐车兜风时遇见劳里，听说马奇先生回家了，便直接坐车赶来。家里人都在后面忙，她悖无声息地进了门，原本想给大家一个惊喜。她的确把眼前的两个人吓了一大跳。梅格像是见了鬼，猛地一惊。布鲁克先生则闪身躲进了书房。
        - id: ch02-b13
          speaker: aunt_march
          text: 老天爷，这是怎么回事？
          emotion: surprised
        - id: ch02-b14
          speaker: narrator
          text: 老太太大叫一声，手杖重重顿在地上。她看看脸色苍白的年轻绅士，又看看满脸通红的姑娘。
        - id: ch02-b15
          speaker: meg
          text: 他是父亲的朋友。我真没想到您会来！
        - id: ch02-b16
          speaker: narrator
          text: 梅格说得结结巴巴。她知道，自己这顿训是躲不过了。
        - id: ch02-b17
          speaker: aunt_march
          text: 这我当然看得出来。可你父亲的朋友说了什么，把你的脸说得跟牡丹一样红？这里头有鬼，我非弄明白不可。
        - id: ch02-b18
          speaker: narrator
          text: 她说着，手杖又在地上顿了一下。
        - id: ch02-b19
          speaker: meg
          text: 我们只是说了几句话。布鲁克先生是回来取雨伞的。
        - id: ch02-b20
          speaker: narrator
          text: 梅格心里巴不得约翰和那把雨伞早已经平安离开这座房子。
        - id: ch02-b21
          speaker: aunt_march
          text: 布鲁克？就是那个孩子的家庭教师？啊，这下我全明白了。乔从你父亲的信里看错了一句话，慌慌张张说漏了嘴。是我逼她把事情告诉我的。孩子，你不会已经答应他了吧？
          emotion: surprised
        - id: ch02-b22
          speaker: meg
          text: 嘘，他会听见的。我去叫母亲来，好吗？
        - id: ch02-b23
          speaker: aunt_march
          text: 先别叫。我有话要跟你说，心里这口气现在就得吐出来。你告诉我，你真打算嫁给这个库克吗？你要是嫁他，我的钱一文也不留给你。把这句话记住，做个明白姑娘。
          emotion: angry
        - id: ch02-b24
          speaker: narrator
          text: 马奇姑妈有一种练得炉火纯青的本事。再温顺的人，她也能激起对方的反抗心，而且她很爱这样做。最善良的人心里，也难免有一点拧劲，年轻又恋爱的时候更是如此。假如马奇姑妈请梅格接受约翰，梅格多半会坚决地说，自己绝不能答应。可姑妈现在偏偏横加命令，不许她喜欢约翰，她反而立刻拿定了主意，就要喜欢他。
        - id: ch02-b25
          speaker: narrator
          text: 梅格原有的心意，再加上这股拧劲，让这个决定一点也不难下。她本来就很激动，现在竟然拿出了异常的勇气，开始顶撞老太太。
        - id: ch02-b26
          speaker: meg
          text: 我想嫁给谁，就会嫁给谁，马奇姑妈。您的钱爱留给谁，就留给谁。
        - id: ch02-b27
          speaker: narrator
          text: 梅格说得很坚定，还用力点了点头。
        - id: ch02-b28
          speaker: aunt_march
          text: 哎哟哟！小姐，你就是这样听我劝告的？等你试过茅屋里的爱情，发现那一套根本行不通，自然会后悔。
        - id: ch02-b29
          speaker: meg
          text: 那也不会比有些人住在大房子里过的日子更糟。
        - id: ch02-b30
          speaker: narrator
          text: 马奇姑妈戴上眼镜，仔细打量眼前这个姑娘，简直不认识这个换了性子的梅格。梅格也几乎不认识自己了。她觉得自己如此勇敢，如此独立。她能为约翰辩护，也能说明自己有权爱他，只要她愿意。这一切让她心里无比快活。
        - id: ch02-b31
          speaker: narrator
          text: 马奇姑妈看出自己第一步走错了。她停了一会儿，换了个办法重新进攻，语气也尽可能温和下来。
        - id: ch02-b32
          speaker: aunt_march
          text: 好了，梅格，亲爱的，你讲点道理，听我劝。我是为你好，不愿看你第一步就走错，把一辈子都毁了。你该嫁一户好人家，也能帮帮自己的家人。找一个有钱的丈夫，这是你的本分。早就该有人让你明白了。
        - id: ch02-b33
          speaker: meg
          text: 父亲和母亲不这样想。他们喜欢约翰，尽管他很穷。
        - id: ch02-b34
          speaker: aunt_march
          text: 亲爱的，你父母一点人情世故都不懂，简直像两个婴儿。
        - id: ch02-b35
          speaker: meg
          text: 幸好他们不懂。
        - id: ch02-b36
          speaker: narrator
          text: 梅格勇敢地喊了出来。马奇姑妈干脆不理她，继续教训。
        - id: ch02-b37
          speaker: aunt_march
          text: 这个鲁克很穷，也没有有钱的亲戚，对吧？
        - id: ch02-b38
          speaker: meg
          text: 是的，可他有很多真心朋友。
        - id: ch02-b39
          speaker: aunt_march
          text: 朋友又不能当饭吃。你等着看吧，他们很快就会从热变冷。他连份事业都没有，是不是？
        - id: ch02-b40
          speaker: meg
          text: 现在还没有。劳伦斯先生打算帮助他。
        - id: ch02-b41
          speaker: aunt_march
          text: 那也长久不了。詹姆斯·劳伦斯是个古怪的老头儿，靠不住。这么说，你打算嫁给一个没钱、没地位、没事业的男人，将来比现在还要辛苦地干活？只要你肯听我的，另做一个更好的选择，本来可以舒舒服服过一辈子。我还以为你更懂事呢，梅格。
        - id: ch02-b42
          speaker: meg
          text: 就算要我等上半辈子，我也找不到更好的人！约翰又善良又聪明，还有才干。他愿意做事，将来一定会有出息。他那么勤奋，那么勇敢，每个人都喜欢他，也敬重他。我又穷，又年轻，还很愚蠢，可他居然会在意我。只要想到这一点，我就觉得骄傲。
        - id: ch02-b43
          speaker: narrator
          text: 梅格说得十分认真，也显得比任何时候都美。
        - id: ch02-b44
          speaker: aunt_march
          text: 孩子，他知道你有富有的亲戚。要我看，这才是他喜欢你的秘密。
        - id: ch02-b45
          speaker: meg
          text: 马奇姑妈，您怎么敢这样说？约翰绝不会卑鄙到这个地步。您要是再说这种话，我就一句也不听了。
          emotion: angry
        - id: ch02-b46
          speaker: narrator
          text: 梅格气愤地喊了起来。老太太的猜疑实在太不公平，让她把其他一切都忘了。
        - id: ch02-b47
          speaker: meg
          text: 我的约翰才不会为了钱结婚，我也不会。我们都愿意做事，也愿意等。我不怕穷，因为我一直过得很幸福。只要和他在一起，我知道自己也会幸福，因为他爱我，而我……
          emotion: angry
        - id: ch02-b48
          speaker: narrator
          text: 梅格猛然停住了。她这才想起，自己明明还没拿定主意，刚才还赶“她的约翰”走，而他很可能就在旁边听着这些前后矛盾的话。
        - id: ch02-b49
          speaker: narrator
          text: 马奇姑妈气坏了。她一心想让漂亮的侄孙女嫁进好人家，而梅格年轻快活的脸上有一种神情，让这位孤独的老太太又伤心，又酸楚。
        - id: ch02-b50
          speaker: aunt_march
          text: 好吧，这件事我再也不管了！你就是个任性的孩子。这一回你犯了傻，会失去多少东西，你根本不明白。不，我不留下。我对你失望透顶，现在连看你父亲的兴致都没了。等你结婚时，不要指望从我这里得到什么。让布鲁克先生的那些朋友去照料你吧。从今以后，我再也不管你了。
          emotion: angry
        - id: ch02-b51
          speaker: narrator
          text: 她当着梅格的面砰地摔上门，气冲冲地坐车走了，好像也把梅格的勇气一起带走了。梅格独自站了一会儿，不知道自己该笑，还是该哭。她还没决定，布鲁克先生已经来到她身边。
        - id: ch02-b52
          speaker: mr_brooke
          text: 梅格，我不是故意偷听的。谢谢你为我辩护，也谢谢马奇姑妈替我证明，你的确有一点点在意我。
        - id: ch02-b53
          speaker: meg
          text: 要不是她那样骂你，我还不知道自己有多在意……
        - id: ch02-b54
          speaker: mr_brooke
          text: 那我不用走了，可以留下来，快快活活地留在这里。是不是，亲爱的？
          emotion: happy
        - id: ch02-b55
          speaker: narrator
          text: 这又是说出那篇无情演说，然后庄严退场的绝好机会。可梅格早把这两样东西忘得干干净净。
        - id: ch02-b56
          speaker: meg
          text: 是的，约翰。
          emotion: happy
        - id: ch02-b57
          speaker: narrator
          text: 她温顺地低声回答，然后把脸藏进布鲁克先生的背心里。从这一刻起，她在乔眼里永远丢尽了体面。
    - id: ch03
      title: 乔发现了真相
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 马奇姑妈走后十五分钟，乔轻手轻脚地下了楼。她在客厅门外停了一会儿。里面一点声音都没有。她满意地点点头，又笑了。
        - id: ch03-b02
          speaker: jo
          text: 她按我们的计划把他打发走了，这件事总算结束了。现在我去听听热闹，再好好笑她一场。
        - id: ch03-b03
          speaker: narrator
          text: 可怜的乔根本没能笑出来。门槛那边的景象，把她死死钉在了原地。她的嘴张得跟眼睛一样大。她本想进去向落败的敌人示威，再称赞刚强的姐姐赶走了讨厌的情人。谁知道，那个敌人正舒舒服服地坐在沙发上，而那位刚强的姐姐就坐在他膝头，脸上写满了彻底的顺从。
        - id: ch03-b04
          speaker: narrator
          text: 这一幕太惊人了。乔倒抽一口气，好像忽然被一盆冷水浇在头上。这样的逆转，实在让她喘不过气。两个恋人听见那声怪响，一起回头看见了她。梅格立刻跳起来，既骄傲又害羞。至于乔口中那个“人”，他居然笑了，还非常镇定地亲了亲这位目瞪口呆的新妹妹。
        - id: ch03-b05
          speaker: mr_brooke
          text: 乔妹妹，祝福我们吧！
          emotion: happy
        - id: ch03-b06
          speaker: narrator
          text: 这句话就像往伤口上撒盐，实在太过分了。乔两只手胡乱挥了几下，一句话也没说，转眼就不见了。她冲上楼，闯进房间，戏剧般地大叫起来，把两位病人都吓了一跳。
        - id: ch03-b07
          speaker: jo
          text: 哎呀，快来个人下楼看看吧！约翰·布鲁克干的事糟透了，梅格居然还很喜欢！
          emotion: surprised
        - id: ch03-b08
          speaker: narrator
          text: 马奇夫妇飞快地离开了房间。乔扑倒在床上，一边大哭，一边发火，像一阵暴风骤雨，把这个可怕的消息全说给了贝丝和艾米听。两个妹妹却觉得这件事又美好又有趣。乔从她们那里得不到多少安慰，只好爬上阁楼里的避难所，把满肚子烦恼说给老鼠听。
        - id: ch03-b09
          speaker: narrator
          text: 谁也不知道那天下午客厅里究竟发生了什么，只知道大家说了许多话。平时沉静的布鲁克先生，为了赢得这门婚事，竟然拿出了惊人的口才和魄力。他把自己的计划说得清清楚楚，又说服朋友们，让大家照着他的心愿安排好一切。
        - id: ch03-b10
          speaker: narrator
          text: 他还没说完，自己要努力为梅格挣来怎样一个天堂，茶铃就响了。他骄傲地带着梅格去吃晚餐。两个人的脸都那么幸福，乔也不忍心再嫉妒，再沮丧了。艾米深深佩服约翰的深情和梅格的端庄。贝丝在远处望着他们，脸上带着笑。马奇夫妇看着这对年轻人，眼中全是温柔的满足。这足以证明，马奇姑妈说他们像两个不通世故的婴儿，还真说对了。
        - id: ch03-b11
          speaker: narrator
          text: 这顿饭，谁也没吃多少，可每个人都快活得不得了。这个家里的第一段爱情，就在那座老屋里发了芽。整座屋子也跟着奇妙地明亮起来。
    - id: ch04
      title: 三年之后
      blocks:
        - id: ch04-b01
          speaker: amy
          text: 梅格，现在你总不能再说，从来没有好事发生了吧？
        - id: ch04-b02
          speaker: narrator
          text: 艾米问着，同时还在琢磨，自己准备画的那幅速写里，该让这对恋人摆什么姿势。
        - id: ch04-b03
          speaker: meg
          text: 当然不能再说了。自从我说了那句话，竟然发生了这么多事。现在想起来，那简直像是一年前的事了。
        - id: ch04-b04
          speaker: narrator
          text: 梅格正沉浸在幸福的梦里，整个人飘得高高的，离面包黄油这类俗事远得很。
        - id: ch04-b05
          speaker: mrs_march
          text: 这一回，忧伤刚过，欢乐就跟了上来。我想，变化已经开始了。大多数家庭偶尔都会遇到忙乱多事的一年。我们家今年就是这样，不过到底有了一个好结局。
        - id: ch04-b06
          speaker: jo
          text: 希望明年的结局更好。
        - id: ch04-b07
          speaker: narrator
          text: 乔低声咕哝着。眼看梅格当着她的面，一心只顾着一个外人，她心里实在难受。乔真正深爱的人很少，所以最怕别人夺走他们的爱，或是将那份爱分走一点。
        - id: ch04-b08
          speaker: mr_brooke
          text: 我倒盼着三年后的结局更好。只要我还活着，能把每个计划都做到，那就一定会更好。
          emotion: happy
        - id: ch04-b09
          speaker: narrator
          text: 他望着梅格微笑，好像世上已经没有任何事能难住他。
        - id: ch04-b10
          speaker: amy
          text: 要等那么久，不是很难熬吗？
        - id: ch04-b11
          speaker: narrator
          text: 艾米巴不得婚礼马上就办。
        - id: ch04-b12
          speaker: meg
          text: 我要学的东西还多着呢。等我真正准备好时，三年反倒会显得很短。
        - id: ch04-b13
          speaker: mr_brooke
          text: 你只管等，活儿由我来做。
        - id: ch04-b14
          speaker: narrator
          text: 约翰说着，弯腰捡起梅格的餐巾。他就这样开始了自己的劳动，脸上的神情惹得乔直摇头。正好前门砰地响了一声，乔松了一口气。
        - id: ch04-b15
          speaker: jo
          text: 劳里来了。这下总算能说几句有头脑的话了。
        - id: ch04-b16
          speaker: narrator
          text: 可乔又猜错了。劳里兴高采烈地蹦进来，手里捧着一大束花，俨然是为新娘准备的。他把花献给“约翰·布鲁克太太”，显然以为这整件事都是他高明地一手促成的。
        - id: ch04-b17
          speaker: laurie
          text: 我早就知道，布鲁克一定会称心如意。他总是这样。只要他决定要做成一件事，就算天塌下来，他也照样办得到。
        - id: ch04-b18
          speaker: mr_brooke
          text: 多谢你这番推荐。我把它当成将来的好兆头，现在就请你来参加我的婚礼。
          emotion: happy
        - id: ch04-b19
          speaker: narrator
          text: 布鲁克先生这会儿跟全天下的人都和睦相处，连这个调皮学生也不例外。
        - id: ch04-b20
          speaker: laurie
          text: 哪怕我跑到了天涯海角，也一定会赶回来。单是看乔到时候会是什么脸色，就值得我跑那么远。夫人，您看起来可不太喜庆。怎么了？
        - id: ch04-b21
          speaker: narrator
          text: 劳里跟着乔走到客厅一角。大家正聚到那里，迎接劳伦斯先生。
        - id: ch04-b22
          speaker: jo
          text: 我不赞成这门婚事。不过我已经决定忍下来，一个反对的字都不说。你不知道，要我放弃梅格有多难。
          emotion: sad
        - id: ch04-b23
          speaker: narrator
          text: 乔说到后面，声音微微发颤。
        - id: ch04-b24
          speaker: laurie
          text: 你并没有放弃她。你只是以后得把她的一半分给别人。
        - id: ch04-b25
          speaker: jo
          text: 一切再也不会和以前一样了。我失去了最亲密的朋友。
          emotion: sad
        - id: ch04-b26
          speaker: narrator
          text: 乔叹了口气。
        - id: ch04-b27
          speaker: laurie
          text: 不管怎样，你还有我。我知道自己没多大用处，可我会一直陪着你，乔。我一辈子都会陪着你。我发誓！
        - id: ch04-b28
          speaker: narrator
          text: 劳里这些话说得真心实意。
        - id: ch04-b29
          speaker: jo
          text: 我知道你会的。我真不知道该怎么谢你。特迪，你总能给我很大的安慰。
        - id: ch04-b30
          speaker: narrator
          text: 乔感激地和他握了握手。
        - id: ch04-b31
          speaker: laurie
          text: 好了，别再愁眉苦脸，做个好伙伴吧。你看，事情都好好的。梅格很幸福，布鲁克会马上忙起来，把一切都安顿好，祖父也会照应他。将来去看梅格住在自己的小屋里，一定特别有趣。就算她离了家，我们也会过得很快活。我很快就要读完大学了，到时候咱们可以出国，想去哪里就去哪里，好好游历一番。这还不能安慰你吗？
        - id: ch04-b32
          speaker: jo
          text: 我想能吧。可三年里会发生什么，谁也说不准。
        - id: ch04-b33
          speaker: laurie
          text: 这倒是真的。你难道不想往前看一眼，瞧瞧三年后我们都在哪里吗？我可真想看。
        - id: ch04-b34
          speaker: jo
          text: 我想还是别看了。我说不定会看见伤心事。现在大家都这么幸福，我不相信以后还会有更好的光景。
        - id: ch04-b35
          speaker: narrator
          text: 乔的目光慢慢掠过整间屋子，眼睛越来越亮。因为她眼前的景象，的确让人愉快。
        - id: ch04-b36
          speaker: narrator
          text: 父亲和母亲并肩坐着，悖悖重温属于他们的那段爱情的第一章。那个故事是在大约二十年前开始的。艾米正在画一对恋人。他们坐在一旁，沉浸在自己的美丽世界里。那个世界的光辉温柔地映在两人脸上，小画家怎么也临摹不出那种神采。
        - id: ch04-b37
          speaker: narrator
          text: 贝丝躺在沙发上，快活地和老朋友说着话。劳伦斯先生握着她的小手，好像觉得，这只手能带他走上贝丝所走的那条宁静道路。乔懒洋洋地靠在自己最喜欢的矮椅里，脸上带着最适合她的沉静与庄重。劳里靠着椅背，下巴恰好和她蓬松的卷发头顶一样高。他望着长镜里两个人的影子，露出最友善的笑容，还冲她点了点头。
        - id: ch04-b38
          speaker: narrator
          text: 就这样，帷幕在梅格、乔、贝丝和艾米面前落下。
        - id: ch04-b39
          speaker: narrator
          text: 它会不会再次升起，就要看这出名叫《小妇人》的家庭戏剧，第一幕能得到怎样的欢迎了。
