  chapters:
    - id: ch01
      title: Everyone Is Waiting
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The next day, Marmee and the girls swarmed around Mr. March like bees following their queen. They forgot nearly everything else while they watched him, waited on him, and listened to him. Their kindness almost threatened to finish off the new invalid. He sat propped in a large chair beside Beth's sofa, with the other three girls close by. Every now and then, Hannah poked her head in just to get another look at the dear man. Their happiness seemed complete. Yet the older ones knew that something was missing, though no one said so. Mr. and Mrs. March exchanged anxious looks whenever their eyes followed Meg. Jo would suddenly turn solemn and shake her fist at Mr. Brooke's umbrella in the hall. Meg grew quiet, shy, and distracted. The doorbell startled her, and John's name brought color to her cheeks.
        - id: ch01-b02
          speaker: amy
          text: Everyone seems to be waiting for something. No one can settle down, and that's very strange now that Father is safely home.
        - id: ch01-b03
          speaker: narrator
          text: Beth innocently wondered why their neighbors were not running over to visit as they usually did. She could not see what the others were waiting for.
        - id: ch01-b04
          speaker: narrator
          text: That afternoon, Laurie passed the house and spotted Meg at the window. He dropped to one knee in the snow, beat his chest, tore at his hair, and held out his hands as though begging for his heart's desire. Meg told him to behave and go away. So he squeezed make-believe tears from his handkerchief and staggered around the corner in despair.
        - id: ch01-b05
          speaker: meg
          text: What is that goose trying to say?
        - id: ch01-b06
          speaker: narrator
          text: Meg laughed and tried to look as if she had no idea.
        - id: ch01-b07
          speaker: jo
          text: He's showing you what your John will do soon. Isn't it touching?
        - id: ch01-b08
          speaker: narrator
          text: Jo's voice was full of scorn.
        - id: ch01-b09
          speaker: meg
          text: Don't call him my John. It isn't proper, and it isn't true. Please stop teasing me, Jo. I've told you I don't care very much about him. Nothing is going to be said. We're all supposed to stay friends and go on as before.
        - id: ch01-b10
          speaker: narrator
          text: But Meg lingered over the words "my John" as if she rather liked their sound.
        - id: ch01-b11
          speaker: jo
          text: We can't go on as before. Something has been said, and Laurie's mischief changed you. I can see it, and so can Mother. You're not yourself anymore. You feel miles away from me. I won't tease you. I'll bear it like a man. But I wish this would be settled. I hate waiting. If you're ever going to do it, please hurry up and get it over with.
          emotion: angry
        - id: ch01-b12
          speaker: meg
          text: I can't say anything until he speaks, and he won't. Father told him I'm too young.
        - id: ch01-b13
          speaker: narrator
          text: Meg bent over her sewing with a curious little smile. It suggested that she did not entirely agree with Father.
        - id: ch01-b14
          speaker: jo
          text: If he did speak, you wouldn't know what to say. You'd cry or blush or let him talk you into it instead of giving him one good, firm no.
        - id: ch01-b15
          speaker: meg
          text: I'm not as foolish and weak as you think. I know exactly what I'll say. I've planned the whole thing so he can't catch me by surprise. Anything might happen, and I wanted to be ready.
        - id: ch01-b16
          speaker: narrator
          text: Jo smiled at Meg's important manner. Meg did not know she had assumed it, and it looked very pretty with the changing color in her cheeks.
        - id: ch01-b17
          speaker: jo
          text: Would you tell me what you're going to say?
        - id: ch01-b18
          speaker: meg
          text: Certainly. You're sixteen now, so you're old enough to be trusted. Perhaps my experience will help you someday when you have a matter like this of your own.
        - id: ch01-b19
          speaker: jo
          text: I don't plan to have one. Watching other people flirt is fun, but I'd feel like a fool doing it myself.
        - id: ch01-b20
          speaker: narrator
          text: The very thought alarmed Jo.
        - id: ch01-b21
          speaker: meg
          text: I don't think you would, if you cared very much for someone and he cared for you.
        - id: ch01-b22
          speaker: narrator
          text: Meg seemed to be talking to herself. She looked out toward the lane where she had often watched lovers walking together in the summer twilight.
        - id: ch01-b23
          speaker: jo
          text: I thought you were going to tell me your speech for that man.
        - id: ch01-b24
          speaker: narrator
          text: Jo's blunt words cut Meg's little daydream short.
        - id: ch01-b25
          speaker: meg
          text: I would simply say, very calmly and firmly, "Thank you, Mr. Brooke. You're very kind, but Father and I agree that I'm too young to make any promise yet. So please don't say anything more. Let us stay friends, just as we were."
        - id: ch01-b26
          speaker: jo
          text: Well, that's cold and stiff enough! I don't believe you'll ever say it, and he won't be satisfied if you do. If he acts like the rejected lovers in books, you'll give in just to keep from hurting him.
        - id: ch01-b27
          speaker: meg
          text: No, I won't. I'll tell him my mind is made up. Then I'll walk out of the room with dignity.
    - id: ch02
      title: Meg's Prepared Speech
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Meg stood up to practice her dignified exit. Then she heard a step in the hall. She flew back to her chair and sewed as fast as if her life depended on finishing that seam. Jo swallowed a laugh. At a modest knock, she opened the door with a look that welcomed no one.
        - id: ch02-b02
          speaker: mr_brooke
          text: Good afternoon. I came for my umbrella. That is, I came to ask how your father is today.
        - id: ch02-b03
          speaker: narrator
          text: Mr. Brooke grew a little confused as he looked from one telltale face to the other.
        - id: ch02-b04
          speaker: jo
          text: He's doing very well. The umbrella is in the rack. I'll get Father and tell him you're here.
        - id: ch02-b05
          speaker: narrator
          text: Jo had mixed Father and the umbrella hopelessly together. Then she slipped out, leaving Meg the perfect chance to give her speech and display her dignity. The instant Jo disappeared, Meg edged toward the door.
        - id: ch02-b06
          speaker: meg
          text: Mother will want to see you. Please sit down while I call her.
        - id: ch02-b07
          speaker: mr_brooke
          text: Please don't go. Are you afraid of me, Margaret?
        - id: ch02-b08
          speaker: narrator
          text: He looked so hurt that Meg feared she had been rude. She blushed all the way to the curls on her forehead. He had never called her Margaret before, and she was surprised by how sweet and natural it sounded. Wanting to seem friendly and comfortable, she held out her hand.
        - id: ch02-b09
          speaker: meg
          text: How could I be afraid of you after you've been so kind to Father? I only wish I knew how to thank you.
        - id: ch02-b10
          speaker: mr_brooke
          text: Shall I tell you how?
        - id: ch02-b11
          speaker: narrator
          text: He held her small hand in both of his. There was so much love in his brown eyes that Meg's heart fluttered. She wanted to run away, but she also wanted to stay and listen.
        - id: ch02-b12
          speaker: meg
          text: Oh, no. Please don't. I'd rather you didn't.
          emotion: fearful
        - id: ch02-b13
          speaker: narrator
          text: She tried to pull her hand free, and her frightened look contradicted her earlier denial.
        - id: ch02-b14
          speaker: mr_brooke
          text: I won't upset you. I only want to know whether you care for me, even a little. I love you very much, dear.
        - id: ch02-b15
          speaker: narrator
          text: This was the moment for Meg's calm and proper speech. She forgot every word. Her head dropped.
        - id: ch02-b16
          speaker: meg
          text: I don't know.
        - id: ch02-b17
          speaker: narrator
          text: Her answer was so soft that John had to bend down to hear it. He seemed to think it was worth the trouble. He smiled to himself, pressed her hand gratefully, and spoke in his most persuasive voice.
        - id: ch02-b18
          speaker: mr_brooke
          text: Will you try to find out? I need to know. I can't put my whole heart into my work until I know whether there might be a reward for me in the end.
        - id: ch02-b19
          speaker: meg
          text: I'm too young.
        - id: ch02-b20
          speaker: narrator
          text: Meg faltered. She wondered why she felt so flustered, though she rather enjoyed the feeling.
        - id: ch02-b21
          speaker: mr_brooke
          text: I'll wait. While I wait, perhaps you could learn to like me. Would that lesson be very hard, dear?
        - id: ch02-b22
          speaker: meg
          text: Not if I decided to learn it, but—
        - id: ch02-b23
          speaker: mr_brooke
          text: Then please decide to learn. I love teaching, and this will be easier than German.
        - id: ch02-b24
          speaker: narrator
          text: John captured her other hand, so Meg could no longer hide her face while he bent to look at it. His voice pleaded properly enough, but one shy glance showed her that his eyes were merry as well as tender. He smiled like a man who felt sure of winning. That irritated her. Annie Moffat's foolish lessons in flirting came back to her, and a sudden love of power woke inside this gentle young woman. Excited and unsure what else to do, she pulled her hands away and obeyed a reckless impulse.
        - id: ch02-b25
          speaker: meg
          text: I don't choose to learn! Please go away and leave me alone.
          emotion: angry
        - id: ch02-b26
          speaker: narrator
          text: Poor Mr. Brooke looked as though his beautiful dream had collapsed around him. He had never seen Meg in such a mood, and he did not understand it.
        - id: ch02-b27
          speaker: mr_brooke
          text: Do you truly mean that?
        - id: ch02-b28
          speaker: narrator
          text: He followed as she walked away, his voice anxious.
        - id: ch02-b29
          speaker: meg
          text: Yes, I do. I don't want to be bothered about this. Father says I don't have to think of it yet. It's too soon, and I'd rather not.
        - id: ch02-b30
          speaker: mr_brooke
          text: May I hope you'll change your mind later? I'll wait and say nothing until you've had more time. But don't play with me, Meg. I never thought you would do that.
        - id: ch02-b31
          speaker: meg
          text: Don't think about me at all. I'd rather you didn't.
        - id: ch02-b32
          speaker: narrator
          text: Meg took a naughty pleasure in testing both her power and his patience. John turned grave and pale. Now he looked much more like the heroes in the novels she admired, though he neither struck his forehead nor marched about the room. He only gazed at her so tenderly and sadly that her heart began to soften in spite of herself. No one can say what might have happened next, because Aunt March came hobbling in at that very moment.
    - id: ch03
      title: Aunt March Settles the Question
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The old lady had been unable to resist visiting her nephew. During her afternoon drive, she met Laurie and heard that Mr. March was home, so she came straight to the house. Everyone was busy in the back rooms, and she slipped in quietly, hoping to surprise them. She succeeded. Meg jumped as if she had seen a ghost, while Mr. Brooke vanished into the study.
        - id: ch03-b02
          speaker: aunt_march
          text: Bless me! What is all this?
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: Aunt March struck the floor with her cane and looked from the pale young gentleman to the scarlet young lady.
        - id: ch03-b04
          speaker: meg
          text: He's a friend of Father's. I'm so surprised to see you!
        - id: ch03-b05
          speaker: narrator
          text: Meg stumbled over the words, certain that a lecture was coming.
        - id: ch03-b06
          speaker: aunt_march
          text: Anyone can see that. But what was Father's friend saying to turn you as red as a peony? Something is going on, and I insist on hearing about it.
        - id: ch03-b07
          speaker: narrator
          text: Her cane struck the floor again.
        - id: ch03-b08
          speaker: meg
          text: We were only talking. Mr. Brooke came back for his umbrella.
        - id: ch03-b09
          speaker: narrator
          text: Meg wished both Mr. Brooke and his umbrella were safely outside the house.
        - id: ch03-b10
          speaker: aunt_march
          text: Brooke? That boy's tutor? Ah, now I understand. I know the whole story. Jo mixed up a message in one of your father's letters, and I made her explain. You haven't accepted him, have you, child?
          emotion: surprised
        - id: ch03-b11
          speaker: meg
          text: Hush! He might hear you. Shall I call Mother?
        - id: ch03-b12
          speaker: narrator
          text: Meg was deeply troubled.
        - id: ch03-b13
          speaker: aunt_march
          text: Not yet. I have something to tell you, and I'm going to say it now. Do you mean to marry this Cook? If you do, you will never receive one penny of my money. Remember that, and show some sense.
        - id: ch03-b14
          speaker: narrator
          text: Aunt March had a perfect gift for stirring up resistance in the gentlest person, and she enjoyed using it. Nearly everyone has a stubborn streak, especially when young and in love. If Aunt March had begged Meg to accept John Brooke, Meg might have insisted she could never do it. But the order not to love him settled her mind at once. Her own affection made the decision easy, too. Already excited, she faced the old lady with unusual courage.
        - id: ch03-b15
          speaker: meg
          text: I will marry anyone I please, Aunt March. You may leave your money to anyone you please.
        - id: ch03-b16
          speaker: narrator
          text: Meg gave a determined nod.
        - id: ch03-b17
          speaker: aunt_march
          text: Well! Is that how you answer my advice, miss? You'll regret it after you try love in a cottage and discover it doesn't work.
          emotion: angry
        - id: ch03-b18
          speaker: meg
          text: It can't fail any worse than some marriages in large houses do.
        - id: ch03-b19
          speaker: narrator
          text: Aunt March put on her glasses and studied the girl. She hardly recognized this new Meg. Meg hardly recognized herself. She felt brave and independent, and glad to defend John and claim her right to love him if she wished. Aunt March realized she had started badly. After a pause, she tried again as gently as she could.
        - id: ch03-b20
          speaker: aunt_march
          text: Meg, my dear, please be reasonable and listen to me. I mean to help you. I don't want you to ruin your life with one mistake at the very beginning. You ought to marry well and help your family. Making a rich match is your duty, and someone should make you understand that.
        - id: ch03-b21
          speaker: meg
          text: Father and Mother don't agree. They like John even though he's poor.
        - id: ch03-b22
          speaker: aunt_march
          text: Your parents have as much worldly sense as two babies.
        - id: ch03-b23
          speaker: meg
          text: I'm glad they do!
        - id: ch03-b24
          speaker: narrator
          text: Aunt March ignored the interruption and continued her lecture.
        - id: ch03-b25
          speaker: aunt_march
          text: This Rook is poor, and he has no wealthy relatives, does he?
        - id: ch03-b26
          speaker: meg
          text: No, but he has many dear friends.
        - id: ch03-b27
          speaker: aunt_march
          text: You can't live on friends. Try it and see how quickly they cool toward you. He has no business either, does he?
        - id: ch03-b28
          speaker: meg
          text: Not yet. Mr. Laurence plans to help him.
        - id: ch03-b29
          speaker: aunt_march
          text: That won't last. James Laurence is a fussy old man, and you can't depend on him. So you mean to marry someone with no money, position, or business. You'll work harder than you do now, though you could be comfortable all your life if you listened to me and chose better. Meg, I thought you had more sense.
        - id: ch03-b30
          speaker: meg
          text: I couldn't choose anyone better if I waited half my life! John is good and wise. He has so much ability, and he's ready to work. I know he'll succeed because he's brave and full of energy. Everyone likes and respects him. I'm proud that he cares for me when I'm poor and young and foolish.
        - id: ch03-b31
          speaker: narrator
          text: Meg's earnestness made her look prettier than ever.
        - id: ch03-b32
          speaker: aunt_march
          text: He knows you have rich relatives, child. I suspect that's why he likes you.
        - id: ch03-b33
          speaker: meg
          text: Aunt March, how can you say that? John would never be so mean, and I won't listen if you talk about him that way. My John would no more marry for money than I would. We'll work, and we'll wait. Being poor doesn't frighten me. I've been happy so far, and I know I'll be happy with him because he loves me, and I—
          emotion: angry
        - id: ch03-b34
          speaker: narrator
          text: Meg suddenly stopped. She remembered that she had not actually decided anything. She had told "her John" to go away, and he might be hearing every word of this inconsistent defense.
        - id: ch03-b35
          speaker: narrator
          text: Aunt March was furious. She had counted on her pretty niece making a splendid match. Something in Meg's young, happy face also made the lonely old woman feel sad and bitter.
        - id: ch03-b36
          speaker: aunt_march
          text: Well, I want nothing more to do with this affair! You're a stubborn child, and this foolishness has cost you more than you know. No, I will not stay. I'm too disappointed in you to visit your father now. When you marry, expect nothing from me. Mr. Brooke's friends can support you. I am finished with you forever!
          emotion: angry
        - id: ch03-b37
          speaker: narrator
          text: Aunt March slammed the door in Meg's face and drove away in a rage. Meg's courage seemed to leave with her. Alone, she stood wondering whether to laugh or cry. Before she could decide, Mr. Brooke came and took possession of her.
        - id: ch03-b38
          speaker: mr_brooke
          text: I couldn't help hearing you, Meg. Thank you for defending me. And thank Aunt March for proving that you do care for me a little.
          emotion: happy
        - id: ch03-b39
          speaker: meg
          text: I didn't know how much I cared until she spoke badly of you.
        - id: ch03-b40
          speaker: mr_brooke
          text: Then I don't have to leave? I may stay and be happy, mayn't I, dear?
        - id: ch03-b41
          speaker: narrator
          text: Once again, Meg had a perfect chance to deliver her crushing speech and make her grand exit. Neither occurred to her. In Jo's eyes, she disgraced herself forever by hiding her face against Mr. Brooke's waistcoat and whispering meekly.
        - id: ch03-b42
          speaker: meg
          text: Yes, John.
          emotion: happy
    - id: ch04
      title: Jo Discovers the Engagement
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Fifteen minutes after Aunt March left, Jo crept downstairs. She paused outside the parlor and heard nothing. With a satisfied nod and smile, she spoke to herself.
        - id: ch04-b02
          speaker: jo
          text: She sent him away, just as we planned. That's settled. I'll go hear all about it and have a good laugh.
        - id: ch04-b03
          speaker: narrator
          text: Poor Jo never got her laugh. She stopped in the doorway, staring with her mouth almost as wide open as her eyes. She had come to celebrate the enemy's defeat and praise her strong-minded sister for banishing an unwanted lover. Instead, the enemy sat peacefully on the sofa. The strong-minded sister sat on his knee, looking completely surrendered. This sudden reversal shocked Jo so badly that she could not catch her breath. She gasped as though a cold shower had fallen on her. The lovers turned at the odd sound. Meg jumped up, proud and shy at once, while "that man," as Jo called him, laughed. He kissed the astonished newcomer and spoke with perfect ease.
        - id: ch04-b04
          speaker: mr_brooke
          text: Sister Jo, congratulate us!
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: That added insult to injury. It was too much. Jo waved her hands wildly and disappeared without a word. She raced upstairs and burst into the room, startling the invalids.
        - id: ch04-b06
          speaker: jo
          text: Oh, somebody go downstairs, quick! John Brooke is behaving dreadfully, and Meg likes it!
          emotion: surprised
        - id: ch04-b07
          speaker: narrator
          text: Mr. and Mrs. March hurried away. Jo threw herself on the bed, crying and scolding as she told Beth and Amy the dreadful news. The younger girls thought the engagement was wonderfully exciting. They gave Jo so little comfort that she retreated to her refuge in the attic and told her troubles to the rats.
        - id: ch04-b08
          speaker: narrator
          text: No one ever learned exactly what happened in the parlor that afternoon. There was a great deal of talking. Quiet Mr. Brooke surprised his friends with the spirit and eloquence of his plea. He explained his plans and persuaded them to arrange everything just as he hoped.
        - id: ch04-b09
          speaker: narrator
          text: The tea bell rang before John finished describing the paradise he meant to earn for Meg. He proudly led her in to supper. They looked so happy that Jo could no longer feel jealous or gloomy. Amy admired John's devotion and Meg's dignity. Beth beamed at them from a distance. Mr. and Mrs. March watched the young couple with such tender satisfaction that Aunt March had clearly been right to call them as unworldly as two babies. Hardly anyone ate, but everyone looked happy. As the family's first romance began there, the old room seemed to grow brighter.
        - id: ch04-b10
          speaker: amy
          text: You can't say that nothing pleasant ever happens anymore, can you, Meg?
        - id: ch04-b11
          speaker: narrator
          text: Amy was deciding how to arrange the lovers in a sketch she planned to draw.
        - id: ch04-b12
          speaker: meg
          text: No, I certainly can't. So much has happened since I said that. It feels like a whole year ago.
          emotion: happy
        - id: ch04-b13
          speaker: narrator
          text: Meg floated in such a happy dream that ordinary things like bread and butter seemed far below her.
        - id: ch04-b14
          speaker: marmee
          text: This time, the joys have followed close behind the sorrows. I believe the changes have begun. Every family has a year now and then that is crowded with events. This has been such a year for us, but it has ended well after all.
        - id: ch04-b15
          speaker: jo
          text: I hope the next one ends better.
        - id: ch04-b16
          speaker: narrator
          text: Jo muttered the words. It was hard to watch Meg give so much attention to a stranger. Jo loved only a few people, but she loved them dearly and feared losing any part of their affection.
        - id: ch04-b17
          speaker: mr_brooke
          text: I hope the third year from now ends even better. I mean to make it so, if I live long enough to carry out my plans.
        - id: ch04-b18
          speaker: narrator
          text: John smiled at Meg as if nothing seemed impossible now.
        - id: ch04-b19
          speaker: amy
          text: Doesn't three years seem terribly long to wait?
        - id: ch04-b20
          speaker: narrator
          text: Amy was eager for the wedding.
        - id: ch04-b21
          speaker: meg
          text: I have so much to learn before I'm ready that it seems like a short time to me.
        - id: ch04-b22
          speaker: narrator
          text: A sweet seriousness showed in Meg's face, something her family had never seen there before.
        - id: ch04-b23
          speaker: mr_brooke
          text: You only have to wait. I have to do the work.
        - id: ch04-b24
          speaker: narrator
          text: John began his labor by picking up Meg's napkin. His expression made Jo shake her head. Then the front door slammed, and relief crossed her face.
        - id: ch04-b25
          speaker: jo
          text: That's Laurie. At last we'll have some sensible conversation.
    - id: ch05
      title: The Curtain Falls
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Jo was mistaken. Laurie pranced into the room, overflowing with cheer. He carried a large bouquet fit for a bride and presented it to "Mrs. John Brooke." He plainly believed his own excellent management had brought the entire affair about.
        - id: ch05-b02
          speaker: laurie
          text: I knew Brooke would get exactly what he wanted. He always does. Once he decides to do something, it gets done even if the sky comes down.
        - id: ch05-b03
          speaker: narrator
          text: Laurie delivered his flowers and congratulations.
        - id: ch05-b04
          speaker: mr_brooke
          text: Thank you for that fine recommendation. I'll take it as a good sign for the future, and I invite you to the wedding right now.
        - id: ch05-b05
          speaker: narrator
          text: John felt at peace with the entire world, including his troublesome pupil.
