audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带含蓄的机智
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    jo:
      display_name: 乔
      tts:
        delivery: 爽朗敏捷，俏皮中带着真情
        timbre: 清脆而略带沙哑的青年女声
        pace: 明快利落
        pitch: 中音
    laurie:
      display_name: 劳里
      tts:
        delivery: 快活风趣，真挚时沉稳坦率
        timbre: 明亮温厚的青年男声
        pace: 轻快自然
        pitch: 中音偏低
    amy:
      display_name: 艾米
      tts:
        delivery: 优雅自持，亲密时柔情活泼
        timbre: 柔美清亮的青年女声
        pace: 从容流畅
        pitch: 中音偏高
    marmee:
      display_name: 马奇太太
      tts:
        delivery: 慈爱安详，语气自然亲切
        timbre: 温暖沉静的成年女声
        pace: 平稳舒缓
        pitch: 中音偏低
    mr_march:
      display_name: 马奇先生
      tts:
        delivery: 温和儒雅，带安静的喜悦
        timbre: 柔和清朗的成年男声
        pace: 从容不迫
        pitch: 中音偏低
    mr_laurence:
      display_name: 劳伦斯先生
      tts:
        delivery: 庄重直率，严肃中藏着慈爱
        timbre: 低沉浑厚
        pace: 从容
        pitch: 低音
    bhaer:
      display_name: 贝尔教授
      tts:
        delivery: 真诚厚重，带轻微德国口音，动情时热烈有力
        timbre: 洪亮温厚的成年男声
        pace: 平稳，激动时加快
        pitch: 低音
    hannah:
      display_name: 汉娜
      tts:
        delivery: 朴实直爽，带着家常口音
        timbre: 粗暖
        pace: 适中
        pitch: 中低音
    daisy:
      display_name: 黛西
      tts:
        delivery: 天真甜美，充满好奇
        timbre: 稚嫩明亮的小女孩声
        pace: 轻快
        pitch: 高音
    demi:
      display_name: 黛米
      tts:
        delivery: 一本正经，好奇中带着孩子气
        timbre: 稚嫩清亮的小男孩声
        pace: 适中
        pitch: 高音
  chapters:
    - id: ch01
      title: 黄昏里的惊喜
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 暮色降下来，乔独自躺在旧沙发上看炉火。她喜欢这样安安静静地过黄昏。她枕着贝丝的红色小靠枕，时而构思故事，时而做梦，时而想念那个好像从未离开的妹妹。明天是她的生日，她却显得疲惫又忧伤。快二十五岁了，她觉得自己似乎还一事无成。这想法并不对。她已经有了许多可以骄傲的收获，而且很快就会看见。
        - id: ch01-b02
          speaker: jo
          text: 看来我命里就得做老姑娘了。笔杆子是丈夫，一窝故事是孩子。说不定再过二十年，我才能分到一点名声。那时候又老又孤单，想享受也享受不了。也罢，我不必做尖酸的圣徒，也不必做自私的罪人。老姑娘的日子过惯了，大概也能很自在。只是……
        - id: ch01-b03
          speaker: narrator
          text: 乔叹了口气。眼前的日子，怎么看都不诱人。二十五岁的人总以为，三十岁就是一切的尽头。其实人心里只要还有依靠，一样可以快乐。姑娘们到了二十五岁，嘴上开始说“老姑娘”，心里却悄悄认定，自己绝对不会真的走到那一步。到了三十岁，她们不再把这件事挂在嘴边，只是安静地接受现实。明智的女子会安慰自己，前面还有二十年有用又幸福的时光，足够学会怎样从容地老去。
        - id: ch01-b04
          speaker: narrator
          text: 所以，别嘲笑单身女子。朴素的衣裙下，那颗安静跳动的心里，也许藏着一段温柔而悲凉的爱。她们可能默默牺牲了青春、健康、抱负，甚至爱情本身。那些懔悴的脸，反倒会因这样的牺牲，在上帝眼中显得美丽。哪怕面对忧郁又乖戾的姐妹，也请温和一些。就算没有别的理由，也该记得，她们已经错过了人生最甜美的一段。正值青春的姑娘们看着她们时，应该怀着怜惜，不是轻蔑，因为自己也可能错过花期。青春不会永远盛放，红润的脸颊会褪色，秀美的头发也会变白。到那时，善意和尊重，就会像今日的爱慕和赞美一样珍贵。
        - id: ch01-b05
          speaker: narrator
          text: 男孩们也请记住，无论老姑娘多么贫穷、平凡或拘谨，都要彬彬有礼。真正的骑士精神，最愿意敬重年长者，保护弱者，为女性效劳，不会计较对方的身份、年龄或肤色。想想那些善良的姑妈姨妈。她们不只教训你，为你操心，也照料过你，疼爱过你，却常常得不到一句谢话。她们替你解过许多围，从并不宽裕的私房钱里给过你零用钱，用年老而耐心的手替你缝过许多针，用心甘情愿的双脚为你跑过许多路。女人不管多大年纪，都喜欢一点体贴。请怀着感激，也给这些亲爱的老太太一点关心。眼睛明亮的姑娘们会看见你的好品性，也会因此更喜欢你。若是死亡已经夺走你的母亲，也许某位普里西拉姑妈，早已在孤独的心里，把最温暖的角落留给了“全世界最好的小外甥”。
        - id: ch01-b06
          speaker: narrator
          text: 乔准是睡着了。读者听完这番训话，说不定也要睡着了。因为劳里的“幽灵”忽然站在她面前。这幽灵有血有肉，正俯身望着她，脸上是那种感情汹涌却不肯露出来的神情。乔却不敢相信真是他，只管惊讶地仰望。直到劳里俯身吻了她，她才猛地跳起来。
        - id: ch01-b07
          speaker: jo
          text: 啊，我的泰迪！真的是你！
          emotion: surprised
        - id: ch01-b08
          speaker: laurie
          text: 亲爱的乔，见到我，你真有这么高兴吗？
        - id: ch01-b09
          speaker: jo
          text: 高兴？我简直高兴得说不出话。艾米呢？
          emotion: happy
        - id: ch01-b10
          speaker: laurie
          text: 你妈妈把她留在梅格家了。我们顺路停了一下，她们抓住我太太，怎么也不肯放人。
        - id: ch01-b11
          speaker: jo
          text: 你的什么？
          emotion: surprised
        - id: ch01-b12
          speaker: narrator
          text: “我太太”两个字，劳里说得又骄傲又满足，一开口就露了馅。他满脸心虚，乔已经像闪电一样扑过去。
        - id: ch01-b13
          speaker: jo
          text: 你已经结婚了！
          emotion: surprised
        - id: ch01-b14
          speaker: laurie
          text: 是的，多谢关心。不过我保证，再也不结第二次了。
        - id: ch01-b15
          speaker: narrator
          text: 他跪在乔面前，忏悔似的合起双手，脸上却全是淘气、欢喜和得意。
        - id: ch01-b16
          speaker: jo
          text: 真的结了？
        - id: ch01-b17
          speaker: laurie
          text: 千真万确。
        - id: ch01-b18
          speaker: jo
          text: 天哪，你下一步还打算干什么吓人的事？
        - id: ch01-b19
          speaker: narrator
          text: 乔倒回座位，长长喘了口气。劳里还摆着那副卑躬屈膝的姿势，脸上喜气洋洋。
        - id: ch01-b20
          speaker: laurie
          text: 这道贺很像你，可实在算不上恭维。
        - id: ch01-b21
          speaker: jo
          text: 你像贼一样溜进来，先把我吓得喘不过气，再冷不防扔出这么大的秘密，还想听什么好话？起来吧，你这个荒唐小子。从头到尾说清楚。
        - id: ch01-b22
          speaker: laurie
          text: 除非你让我坐回从前的位置，还答应不再筑壁垒，否则我一个字也不说。
        - id: ch01-b23
          speaker: narrator
          text: 乔笑了起来。她已经很久没这样笑过。她亲热地拍拍沙发，让劳里坐下。
        - id: ch01-b24
          speaker: jo
          text: 那只旧枕头收到阁楼去了，我们如今也用不着它。来吧，泰迪，老实交代。
        - id: ch01-b25
          speaker: laurie
          text: 又听见你叫我“泰迪”，真好。除了你，再没人这么叫我了。
        - id: ch01-b26
          speaker: jo
          text: 艾米叫你什么？
        - id: ch01-b27
          speaker: laurie
          text: 大人。
        - id: ch01-b28
          speaker: jo
          text: 很像她。不过你倒的确像模像样了。
        - id: ch01-b29
          speaker: narrator
          text: 乔眼里写得很明白，自家的男孩比从前更俊了。可枕头虽然不在，两人中间仍横着一道无形的壁垒。岁月、离别和改变的心意，自然而然地筑成了它。他们互相望了一会儿，那片小小的阴影转眼就散了。
        - id: ch01-b30
          speaker: laurie
          text: 我现在看着，难道不像一个结了婚、当了一家之主的男人吗？
        - id: ch01-b31
          speaker: jo
          text: 一点也不像，以后也永远不会像。你高了，也更漂亮了，可还是从前那个淘气鬼。
        - id: ch01-b32
          speaker: laurie
          text: 乔，说真的，你对我该多一点敬意。
        - id: ch01-b33
          speaker: jo
          text: 一想到你已经成家，我就忍不住要笑。怎么可能一本正经地对你？
        - id: ch01-b34
          speaker: narrator
          text: 乔的笑意很快传给了劳里，两人又笑成一团。笑够了，他们像从前一样舒舒服服地坐好，准备痛快谈一场。
    - id: ch02
      title: 劳里的婚事
      blocks:
        - id: ch02-b01
          speaker: laurie
          text: 你不必冒着冷风去接艾米，他们一会儿全都会来。我实在等不了，非得亲口告诉你这个大惊喜，还要像从前抢奶油时那样，先抢到头一层奶皮。
        - id: ch02-b02
          speaker: jo
          text: 我就知道你会这样，还一开口就从结尾讲，把好好的故事都毁了。现在从头说。到底是怎么回事？我都快急死了。
        - id: ch02-b03
          speaker: laurie
          text: 其实嘛，我是为了让艾米高兴，才跟她结婚的。
        - id: ch02-b04
          speaker: jo
          text: 头一句就撒谎。明明是艾米为了让你高兴。继续吧，先生，办得到的话，请说真话。
        - id: ch02-b05
          speaker: laurie
          text: 听听，她又开始教训人了。多亲切的声音，是不是？
        - id: ch02-b06
          speaker: narrator
          text: 劳里这话是对炉火说的。火焰一闪一闪，好像完全同意。
        - id: ch02-b07
          speaker: laurie
          text: 反正都一样。她和我现在是一体了。一个多月前，我们原本打算跟卡罗尔一家回国。他们忽然改了主意，想在巴黎再过一个冬天。爷爷却想回家。他出国本来就是为了陪我，我不能让他一个人回来，又不能丢下艾米。卡罗尔太太守着英国那套监护规矩，不肯让艾米跟我们走。我干脆提议结婚。成了夫妻，我们想怎么办就怎么办。难题一下就解决了。
        - id: ch02-b08
          speaker: jo
          text: 你当然会这么办。你总有本事让事情顺着自己的心意。
        - id: ch02-b09
          speaker: laurie
          text: 也不是每次都能。
        - id: ch02-b10
          speaker: narrator
          text: 他的声音里有一点别的意味。乔赶快把话题转开。
        - id: ch02-b11
          speaker: jo
          text: 那你们怎么说服姑妈的？
        - id: ch02-b12
          speaker: laurie
          text: 费了不少力气。不过我们两个一起劝，理由又都站在我们这边，她总算点头了。时间太急，来不及写信征求你们的许可。反正大家都赞成这门婚事，迟早会答应。用我太太的话说，我们只是揪住了时机的额发。
        - id: ch02-b13
          speaker: jo
          text: 我们是不是很得意“我太太”这两个字，巴不得每句话都说一遍？
        - id: ch02-b14
          speaker: narrator
          text: 乔也转向炉火，心里满是欢喜。上次分别时，劳里的眼睛还阴郁得近乎绝望，如今已经被幸福照亮了。
        - id: ch02-b15
          speaker: laurie
          text: 也许是有那么一点。可她是个那么迷人的小妇人，我怎么能不以她为傲？当时舅舅和舅妈都在，礼数上也有人撑着。我们心里只有彼此，真要分开，两个人都不顶用。结婚又能让大家省事，所以就结了。
        - id: ch02-b16
          speaker: jo
          text: 什么时候？在哪里？怎么办的？
        - id: ch02-b17
          speaker: laurie
          text: 六个星期以前，在巴黎的美国领事馆。婚礼办得很安静。就算在最幸福的时候，我们也没有忘记亲爱的小贝丝。
        - id: ch02-b18
          speaker: narrator
          text: 乔把手放进他手里。劳里轻轻抚摸那只他再熟悉不过的红色小靠枕。两人安静地坐了一会儿。
        - id: ch02-b19
          speaker: jo
          text: 那为什么一直不告诉我们？
        - id: ch02-b20
          speaker: laurie
          text: 我们想给大家一个惊喜。起初还以为马上就能回家，可一结完婚，那位亲爱的老先生忽然发现，至少还要一个月才能动身。他就把我们打发走，让我们自己找地方度蜜月。艾米以前说过，瓦尔罗萨天生就是蜜月之家，我们便去了。人一辈子只有一次的那种幸福，可真甜啊。我的天，玫瑰丛里的爱情！
        - id: ch02-b21
          speaker: narrator
          text: 劳里一时忘了乔。乔却正因为这样而高兴。他能这么自然地说起艾米，已经足以证明，他完全原谅了她，也完全放下了过去。乔想把手抽回来，劳里却猜到了她的心思，紧紧握住她。他的神情忽然变得成熟又庄重。
        - id: ch02-b22
          speaker: laurie
          text: 亲爱的乔，有件事我想说清楚。说完以后，我们就永远把它收起来。我给你写信，说艾米对我那么好的时候，也说过我永远不会停止爱你。那份爱确实没有消失，可它已经变了。我现在明白，这样才是最好的。艾米和你，只是在我心里换了位置。事情本来就该这样。要是我当初肯听你的，耐心等一等，它自然会走到这一步。可我当时还是个任性冲动的男孩，非得吃个大苦头，才能看清自己的错。
        - id: ch02-b23
          speaker: laurie
          text: 你说得对，那的确是个错误。我干了一番傻事，才终于明白。有一阵子，我心里乱得分不清更爱你，还是更爱艾米，甚至想过干脆一模一样地爱你们两个。可我做不到。直到我在瑞士见到艾米，一切突然清楚了。你们都回到了自己应在的位置。旧的爱情消逝以后，新的爱情才真正开始。我可以诚实地把心分给乔姐姐和艾米妻子，深深爱着你们两个。你愿意相信我吗？我们还能回到刚认识时那些快乐的日子吗？
        - id: ch02-b24
          speaker: jo
          text: 我全心全意地相信你。可是泰迪，我们再也不是小男孩和小女孩了。那些快乐的旧日子不会回来，我们也不该盼它回来。如今我们是成年人，有正经的事要做。玩闹的日子过去了。我知道你也感觉到了。你变了，我也变了。我会想念从前那个男孩，也会同样爱现在这个男人，还会更加敬重他。因为他决心成为我一直希望他成为的人。
        - id: ch02-b25
          speaker: jo
          text: 我们不能再做年幼的玩伴，却可以做一辈子的兄妹，彼此相爱，互相扶持。对不对，劳里？
        - id: ch02-b26
          speaker: narrator
          text: 劳里没有回答。他握住乔伸来的手，把脸贴在上面，停了一会儿。他觉得，少年爱情的坟墓里，已经生出了一份美丽又坚固的友谊。这份友谊会给他们两个人带来幸福。
        - id: ch02-b27
          speaker: jo
          text: 我怎么也信不了，你们两个孩子真的结婚了，还要自己过日子。好像就在昨天，我还在替艾米扣围裙扣子，你捣蛋时，我还会揪你的头发。日子过得真快！
        - id: ch02-b28
          speaker: laurie
          text: 两个孩子里，可有一个比你年长。别摆老祖母的架子了。我自信已经是个长成的绅士。等你看到艾米，会发现她是个早熟得很的婴儿。
        - id: ch02-b29
          speaker: jo
          text: 年纪上你也许大一点，可论心境，我比你老得多。女人向来这样，而过去这一年又那么难熬。我觉得自己已经四十岁了。
        - id: ch02-b30
          speaker: laurie
          text: 可怜的乔！我们在外面快活，却把你留下来承受这一切。你确实老了。这里多了一道纹，那里又多一道。你不笑的时候，眼睛里都是忧伤。刚才我还在枕头上摸到了一滴眼泪。你受了这么多苦，还要一个人忍着。我真是头自私的畜生！
          emotion: sad
        - id: ch02-b31
          speaker: narrator
          text: 劳里懊悔地揪着自己的头发。乔把那只泄密的靠枕翻了个面，努力让声音轻快一些。
        - id: ch02-b32
          speaker: jo
          text: 不，我有爸爸妈妈帮我，还有亲爱的孩子们安慰我。想到你和艾米平安幸福，家里的烦恼也比较容易忍受。有时候我的确觉得寂寞，不过这大概对我有好处，而且……
        - id: ch02-b33
          speaker: laurie
          text: 你以后再也不会寂寞了。艾米和我都少不了你。你必须来教“孩子们”怎么操持家务。我们还像从前一样，什么都跟你平分。让我们好好疼你，大家永远快乐又亲密地生活在一起。
        - id: ch02-b34
          speaker: jo
          text: 只要我不碍事，那一定很快活。我已经觉得自己年轻多了。真奇怪，你一回来，我所有的烦恼好像都飞走了。泰迪，你一直都最会安慰我。
        - id: ch02-b35
          speaker: narrator
          text: 乔把头靠在他肩上，就像多年前贝丝病重时，劳里叫她靠着自己坚持下去那样。劳里不知道她是不是也想起了那一刻。乔却独自微笑，仿佛他的归来真把所有忧愁都赶走了。
        - id: ch02-b36
          speaker: laurie
          text: 你还是从前那个乔。刚掉一分钟眼泪，转眼就笑了。你这会儿的样子有点淘气。在想什么，老祖母？
        - id: ch02-b37
          speaker: jo
          text: 我在想，你和艾米相处得怎么样。
        - id: ch02-b38
          speaker: laurie
          text: 像天使一样！
        - id: ch02-b39
          speaker: jo
          text: 那当然。不过你们家谁做主？
        - id: ch02-b40
          speaker: laurie
          text: 目前是她。至少我让她以为是她，这样她会高兴。以后我们轮流做主。我听说，结婚会让人的权利减掉一半，责任却多一倍。
        - id: ch02-b41
          speaker: jo
          text: 你开了这个头，就会一直这样下去。艾米会管你一辈子。
        - id: ch02-b42
          speaker: laurie
          text: 她管得那么不露痕迹，我想自己不会介意。她懂得怎么把家管好，而我还挺喜欢。她用一缕丝线那么柔软好看的办法，把人绕在手指上，还让你觉得，她是在赏你一个人情。
        - id: ch02-b43
          speaker: jo
          text: 我竟然活着看见你变成一个怕老婆、还乐在其中的丈夫！
        - id: ch02-b44
          speaker: laurie
          text: 艾米教养太好，不会做那种事。我也不是任人摆布的男人。我太太和我都有自重，也尊重对方。我们不会压制彼此，更不会争吵。
        - id: ch02-b45
          speaker: narrator
          text: 乔很喜欢这番话。新添的庄重很适合劳里，可眼看那个男孩飞快地变成了男人，她欢喜里也有一点惆怅。
        - id: ch02-b46
          speaker: jo
          text: 这一点我相信。你和艾米不像我们以前那样争吵。寓言里，她是太阳，我是风。太阳对付那个人，比风高明多了。你还记得吧？
        - id: ch02-b47
          speaker: laurie
          text: 她可不只会照太阳，也照样会刮大风。在尼斯，我挨的那顿训可真厉害，比你从前骂我的任何一次都凶。以后再把全部经过说给你听。她永远不会主动说。因为她刚骂完我，说她鄙视我，为我感到羞耻，转眼却把心丢给了这个可鄙的家伙，还嫁给了这个没用的东西。
        - id: ch02-b48
          speaker: jo
          text: 真卑劣！她要是欺负你，就来找我。我给你撑腰。
        - id: ch02-b49
          speaker: laurie
          text: 我看着像是需要人撑腰吗？
        - id: ch02-b50
          speaker: narrator
          text: 劳里站起来，摆出一个威风凛凛的姿势。可楼上一响起艾米的声音，那威严立刻变成了狂喜。
        - id: ch02-b51
          speaker: amy
          text: 她在哪里？我亲爱的老乔在哪里？
          emotion: happy
    - id: ch03
      title: 归家的人们
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 全家人一拥而入，拥抱和亲吻又重来了一遍。几次徒劳的尝试以后，三个远行归来的人终于被按在座位上，好让大家细细看个够，也欢喜个够。劳伦斯先生依旧健壮硬朗，但异国之旅也和改变另外两个人一样，改变了他。他那层暴躁的硬壳几乎全没了，老式的殷勤风度经过旅行的磨亮，显得比从前更加亲切。看他这个样子，实在让人愉快。
        - id: ch03-b02
          speaker: narrator
          text: 他笑容满面地望着那对被他叫作“我的孩子”的年轻夫妻。艾米像女儿一样敬爱他、照料他，已经彻底赢得了老人的心。劳里则围着这两个人打转，仿佛永远看不够这幅温馨的图画。
        - id: ch03-b03
          speaker: narrator
          text: 梅格一见艾米，立刻意识到自己的衣裳一点巴黎风情也没有。年轻的莫法特太太，要被年轻的劳伦斯太太彻底比下去了。这位新夫人已经是一个十足优雅、端庄的女人。乔看着新婚夫妻，却想他们真是天生一对。她当初没有看错。劳里终于找到了那个美丽又有才华的姑娘。艾米会让他的家光彩照人，也会让他骄傲。若是笨手笨脚的老乔站在那个位置，大概只会给他添麻烦。乔想到这里，更觉得一切都走对了。
        - id: ch03-b04
          speaker: narrator
          text: 马奇夫妇带着幸福的笑容向彼此点头。他们看得出，小女儿得到的不只是富足，还有更可贵的爱、信任和幸福。艾米脸上有一层内心安宁才会有的柔光。她的声音比从前温柔，那份冷静拘谨也变成了温婉的端庄。她不再有一丝小小的矫饰，只有热诚与甜美。这比她新添的美貌、从前的优雅更动人。她终于成了自己一直想做的那种真正的淑女。
        - id: ch03-b05
          speaker: marmee
          text: 爱让我们的小姑娘改变了这么多。
        - id: ch03-b06
          speaker: mr_march
          text: 亲爱的，她这一生一直有个好榜样在眼前。
        - id: ch03-b07
          speaker: narrator
          text: 马奇先生深情地望着妻子那张懔悴的脸，和已经灰白的头发。黛西的眼睛怎么也离不开她的“漂酿姨姨”，她像小哈巴狗一样跟着艾米腰间的链子，那上面挂满了诱人的小玩意儿。黛米却先认真研究这层新亲戚关系，不肯轻易用自己换取那套从伯尔尼带回来的木头熊。劳里知道该从哪里下手。
        - id: ch03-b08
          speaker: laurie
          text: 年轻人，我第一次有幸认识你时，你迎面给了我一拳。现在我要讨回一个绅士应得的补偿。
        - id: ch03-b09
          speaker: narrator
          text: 高个子姨夫把小外甥抱起来，又抛又揉。黛米的哲学家尊严受到严重损害，他的男孩天性却得到了大大的满足。
        - id: ch03-b10
          speaker: hannah
          text: 老天，她从头到脚都是绸子！看她坐在那儿，漂亮得像一架新琴。再听人家叫小艾米“劳伦斯太太”，可真舒坦！
        - id: ch03-b11
          speaker: narrator
          text: 汉娜摆桌子摆得东一件西一件，还一次次从传菜窗口探头偷看。屋里的话简直没有尽头。这个刚说完，那个就接上，后来干脆所有人一起说，恨不得半个钟头就把三年的经历讲完。幸好茶点就在手边，可以让大家停下来喘口气，也补充体力。
        - id: ch03-b12
          speaker: narrator
          text: 一行人欢欢喜喜地走进小餐厅。那场面实在快活。马奇先生骄傲地护送劳伦斯太太，马奇太太同样骄傲地挽着“我的儿子”。老先生带着乔，还朝炉边那个空空的角落看了一眼。他们都知道那个位置原本属于谁，也都在欢喜中想着她。乔听见老先生的话，明白他不只是在邀请自己做女儿，也是在请她接住贝丝留下的那份温柔。
        - id: ch03-b13
          speaker: mr_laurence
          text: 现在，你得做我的女儿了。
        - id: ch03-b14
          speaker: jo
          text: 先生，我会努力接替她的位置。
        - id: ch03-b15
          speaker: narrator
          text: 双胞胎在后面蹦蹦跳跳，觉得太平盛世已经来了。大家都忙着招待归来的人，没人管他们。他们偷喝茶，用姜饼填肚子，每人又得到一块热饼干。最后，他们还飞快地各塞了一只小馅饼进口袋。那馅饼在里面黏住、碎开，正好教会他们，人性和酥皮点心同样脆弱。
        - id: ch03-b16
          speaker: narrator
          text: 两个孩子心里压着偷藏馅饼的罪恶感，又怕多多的利眼看穿衣料，找到赃物，便紧跟在没戴眼镜的“外公”身后。艾米像茶点一样在人群里被传来传去，最后挽着劳伦斯先生回到客厅。其他人仍两两结伴，只剩乔落了单。她暂时并不在意，因为她还在后面回答汉娜急不可耐的问题。
        - id: ch03-b17
          speaker: hannah
          text: 艾米小姐会坐她那辆小“鸽笼”马车吗？收着的那些漂亮银餐具，她都会拿来用吗？
        - id: ch03-b18
          speaker: jo
          text: 她就算坐六匹白马拉的车，每天用金盘子吃饭，戴钻石，穿花边，也没什么可奇怪的。泰迪觉得，世上什么好东西都配不上她。
        - id: ch03-b19
          speaker: hannah
          text: 本来就是！那你早饭吃杂烩，还是炸鱼丸？
        - id: ch03-b20
          speaker: jo
          text: 随便。
        - id: ch03-b21
          speaker: narrator
          text: 汉娜总有本事把诗意和日常生活搅在一起。乔觉得，大家这时候谈论杂烩和鱼丸，实在不合她的心境。她关上门，站在那里看了一会儿，望着众人一个个消失在楼上。黛米穿格子裤的小短腿刚费力爬过最后一级台阶，一阵强烈的孤独忽然袭来。乔眼前模糊，四下寻找可以依靠的东西。就连泰迪也离开她了。她并不知道，自己的生日礼物正一分一秒地靠近。若是知道，她就不会以为，这个快乐的夜晚结束后，只有孤单在等她。
        - id: ch03-b22
          speaker: jo
          text: 等上床以后，我要小小地哭一场。现在可不能扫大家的兴。
          emotion: sad
        - id: ch03-b23
          speaker: narrator
          text: 她用手抹了抹眼睛。乔从小就有男孩子气的习惯，永远不知道手帕丢在哪里。她好不容易挤出一个笑容，门廊外恰好响起了敲门声。
    - id: ch04
      title: 门外的第二个幽灵
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 乔热情地赶去开门，接着又吓了一跳。好像又有一个幽灵来送惊喜。黑暗中站着一位蓄胡子的高个儿先生，他朝乔灿烂地笑着，活像一轮午夜里的太阳。
        - id: ch04-b02
          speaker: jo
          text: 啊，贝尔教授，见到您我太高兴了！
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: 乔一把抓住他，仿佛怕黑夜会在她把人请进门以前，就把他吞没。
        - id: ch04-b04
          speaker: bhaer
          text: 我见到马奇小姐也很高兴。不，等等，你们有客人。
        - id: ch04-b05
          speaker: jo
          text: 不是客人，只是家里人。我妹妹和朋友们刚回来，我们大家都高兴极了。快进来，跟我们一起热闹吧。
        - id: ch04-b06
          speaker: narrator
          text: 贝尔教授虽然喜欢跟人交往，本来大概还是会守礼地告辞，改天再来。可乔随手关上他身后的门，又夺走了他的帽子，他还怎么走？更何况乔忘了掩饰重逢的喜悦，坦坦荡荡地全写在脸上。这样的欢迎，超过了这个孤独的人最大胆的期盼。
        - id: ch04-b07
          speaker: bhaer
          text: 只要我不是一位多余的先生，我很愿意认识大家。可是，我的朋友，你生病了吗？
        - id: ch04-b08
          speaker: narrator
          text: 乔替他挂外套时，灯光照亮了她的脸。教授一眼就看出那里的变化。
        - id: ch04-b09
          speaker: jo
          text: 没有生病，只是累，也很伤心。自从上次见面以后，我们家遇到了不幸。
        - id: ch04-b10
          speaker: bhaer
          text: 是的，我知道。听到那个消息，我的心也替你疼。
          emotion: sad
        - id: ch04-b11
          speaker: narrator
          text: 他又握了握乔的手，脸上全是同情。乔觉得，再没有什么安慰，能胜过那双善良眼睛的注视，和那只温暖大手的紧握。
        - id: ch04-b12
          speaker: jo
          text: 爸爸，妈妈，这位是我的朋友贝尔教授。
        - id: ch04-b13
          speaker: narrator
          text: 乔的脸上和声音里，都压不住骄傲和喜悦。倒不如干脆吹响号角，隆重地替他开门。陌生客人心里若还有什么疑虑，也被大家热诚的欢迎一扫而空。起初，大家是为了乔才亲切地招呼他。很快，他们便因为教授本人而喜欢上了他。
        - id: ch04-b14
          speaker: narrator
          text: 他身上像带着一枚可以打开所有心门的护符。这些朴实的人立刻对他热络起来，又因为他穷，反倒觉得更亲近。一个人若能活得高于贫穷，贫穷也会让他的精神富足，更会成为通往真正好客之心的通行证。贝尔教授环顾四周，像个旅人敲开一扇陌生的门，门一打开，却发现自己已经回到家中。
        - id: ch04-b15
          speaker: narrator
          text: 孩子们像蜜蜂奔向蜜罐一样涌到他身边，占据他的两只膝盖，大胆地掏他的口袋，扯他的胡子，研究他的怀表，很快就把他彻底迷住了。女人们用眼神交换赞许。马奇先生认定找到了知己，便拿出最珍贵的思想宝藏招待他。沉默的约翰听得津津有味，连劳伦斯先生都舍不得打盹。
        - id: ch04-b16
          speaker: narrator
          text: 乔若是没有别的心思，一定会觉得劳里的举动很好笑。一丝轻微的刺痛，让这位先生起初站在圈子外面，带着兄长似的小心打量新来的客人。那不是嫉妒，只有一点猜疑。不过这感觉没持续多久。他不由自主地听出了兴致，还没意识到，已经加入谈话。在这样亲切的气氛里，贝尔教授谈吐出众，学问也充分显露出来。他的话让所有人都听得入神，也让这个刚刚团聚的家庭，很快就把他当成了自己人。
        - id: ch04-b17
          speaker: narrator
          text: 教授很少直接同劳里说话，却常常望向他。每次看着这个正值盛年的年轻人，他脸上都会掠过一片阴影，好像在惋惜自己逝去的青春。随后，他的眼睛又会带着渴望转向乔。乔若是看见了，一定会回答那个无声的问题。可她正忙着约束自己的眼睛，只谨慎地盯着手里那只编织中的小袜子，活像一位模范老姑妈。
        - id: ch04-b18
          speaker: narrator
          text: 她偶尔偷看一眼，就像在满是尘土的长路上喝到一口清水，立刻精神起来。贝尔教授那种心不在焉的神情不见了。他全神贯注，显得朝气勃勃，甚至年轻英俊。乔竟忘了把他同劳里比较，也没有再让这个可怜的人相形见绌。
        - id: ch04-b19
          speaker: narrator
          text: 谈话不知不觉转到了古人的丧葬习俗，这题目实在谈不上鼓舞人心。可教授反而显得才华焕发。泰迪在一场辩论里败下阵来，乔得意得脸上发光。看父亲听得入神，她心想，要是每天都有教授这样的人陪爸爸谈话，他会多么快乐。此刻的教授不再是那个心不在焉、带着旅途尘土的客人。他精神奕奕，言谈里满是力量。在乔眼里，连他最平常的动作也都显得可爱。
        - id: ch04-b20
          speaker: narrator
          text: 贝尔教授穿着一套崭新的黑衣，比任何时候都像个绅士。浓密的头发剪短了，也梳得整齐。不过一说到激动处，他又习惯地把它们揉得蓬乱。乔更喜欢它们倔强地竖着，觉得那样可以让教授漂亮的额头有几分朱庇特的气派。可怜的乔安安静静地织着袜子，却把这个相貌平凡的男人美化得厉害。她看见他脸上的每一点光彩，听见他话里的每一分才气，连他白袖口上果真戴了金袖扣，也没逃过她的眼睛。
        - id: ch04-b21
          speaker: jo
          text: 亲爱的老朋友！就算他是要去求婚，也不可能打扮得更用心了。
        - id: ch04-b22
          speaker: narrator
          text: 这念头刚在心里落下，另一个念头就猛地冒了出来。乔涨红了脸，赶紧扔下线团，低头去捡，想藏起自己的脸。这计策没有成功。教授刚说到点燃葬礼柴堆，马上在比喻的意义上扔下火把，扑过去捡那只蓝色小线团。两颗脑袋结结实实撞在一起，眼前同时冒出了星星。他们红着脸，笑着直起身，谁也没捡到线团，只好各自回到座位上。
    - id: ch05
      title: 团聚的歌声
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 没人知道这个夜晚是怎么过去的。汉娜很早就机灵地抱走两个孩子。两颗小脑袋一点一点，像两朵粉红的罂粟花。劳伦斯先生也回家休息了。其他人围着炉火畅谈，完全忘了时间，仿佛这场久别后的团聚永远不会结束。最后，梅格认定黛西已经从床上掉下来，而黛米在研究火柴的构造时点燃了睡衣。母亲的心再也坐不住，她起身要走了。
        - id: ch05-b02
          speaker: jo
          text: 我们一定要像从前那样唱一次歌。大家终于又团聚了。
        - id: ch05-b03
          speaker: narrator
          text: 乔满心欢腾，觉得痛痛快快地唱一场，既安全又畅快，正好让心中的感情涌出来。其实，他们并没有全都在场。可谁也不觉得乔说错了，因为贝丝仿佛仍在他们中间。那是一个安宁的存在，无形无影，却比以前更加亲近。死亡也拆不散由爱紧紧结合的家庭。
        - id: ch05-b04
          speaker: narrator
          text: 贝丝的小椅子还在原来的地方。整齐的针线篮依旧放在惯常的架子上，里面留着她没做完的活儿。那时候，针已经变得太重了。那件心爱的乐器很少再有人触碰，却始终没有挪动。上方挂着贝丝的画像。她还像早年那样，宁静地微笑，俯视着大家，好像在说，高兴起来吧，我就在这里。
        - id: ch05-b05
          speaker: laurie
          text: 弹一点吧，艾米。让大家听听你进步了多少。
        - id: ch05-b06
          speaker: narrator
          text: 劳里为这个前途远大的学生感到理所当然的骄傲。艾米转动那张已经褪色的琴凳，眼中充满泪水。
        - id: ch05-b07
          speaker: amy
          text: 今晚不行，亲爱的。今晚我不能卖弄本领。
          emotion: sad
        - id: ch05-b08
          speaker: narrator
          text: 不过，她展现了一种比华丽技巧更好的东西。她唱起贝丝爱唱的歌。她的声音里含着一种温柔的乐感，再好的老师也教不会。她打动人心的力量，也比其他任何灵感都甜美。她没有用技巧向大家展示旅行中的进步，而是用对妹妹的想念，把每个人的心又聚到了一起。唱到贝丝最喜爱的赞美诗最后一句时，清澈的歌声忽然哽住。屋里一片安静。那句话实在太难唱出口。
        - id: ch05-b09
          speaker: amy
          text: 尘世没有一种悲伤，是天堂不能抚平的。
          emotion: sad
        - id: ch05-b10
          speaker: narrator
          text: 艾米靠在丈夫身上。没有贝丝的亲吻，她的归家之喜终究不算圆满。
        - id: ch05-b11
          speaker: jo
          text: 现在，我们用《米尼翁之歌》收尾吧。贝尔教授会唱这首歌。
        - id: ch05-b12
          speaker: narrator
          text: 乔赶在沉默变得难熬以前开了口。贝尔教授满意地清清嗓子，走到乔站着的角落。
        - id: ch05-b13
          speaker: bhaer
          text: 你愿意和我一起唱吗？我们两个配合得非常好。
        - id: ch05-b14
          speaker: narrator
          text: 顺便说一句，这是个悦耳的假话。乔对音乐的了解，并不比一只蚱蜢多。可即使教授请她同唱整部歌剧，她也会一口答应。她快活地放声唱起来，完全不管节拍和音准。好在教授像个真正的德国人那样，唱得热情又动听。没过多久，乔就把声音降成轻轻的哼唱，好让自己听那淳厚的歌声。它仿佛只唱给她一个人。
        - id: ch05-b15
          speaker: bhaer
          text: 你可知那柠檬花开的地方？到那里，啊，到那里，亲爱的，愿我能与你同去。
        - id: ch05-b16
          speaker: narrator
          text: 从前，教授最爱的是柠檬花开的那一句，因为那个地方对他来说就是德国。如今，他却异样温柔地流连在后面几句上。其中一个听众被这温柔的邀请深深震动。她真想告诉他，她知道那个地方。不管什么时候，只要他愿意，她都会欢欢喜喜地跟他去。
        - id: ch05-b17
          speaker: narrator
          text: 大家都认为这首歌成功极了。歌唱者带着满满的赞誉退了场。几分钟后，教授却完全忘了礼貌，盯着正在戴帽子的艾米出神。乔介绍时只说她是“我的妹妹”，教授进门以后，也没人叫过她的新姓。直到劳里亲切又客气地向他告别。
        - id: ch05-b18
          speaker: laurie
          text: 先生，我太太和我都很高兴认识您。请记住，街对面永远有人欢迎您过去。
        - id: ch05-b19
          speaker: narrator
          text: 教授真诚地道谢，脸上骤然焕发出满足的光彩。劳里觉得，这个老家伙的感情露得这么明白，实在可爱极了。
        - id: ch05-b20
          speaker: bhaer
          text: 我也该告辞了。不过，亲爱的太太，如果您允许，我很愿意再来。城里有一点事，会留我在这里住几天。
        - id: ch05-b21
          speaker: narrator
          text: 他对马奇太太说着话，眼睛却望着乔。母亲口中的允诺，和女儿眼中的回答同样热诚。马奇太太对孩子们的心事，并不像莫法特太太想的那么迟钝。
        - id: ch05-b22
          speaker: narrator
          text: 最后一位客人离开以后，屋里终于安静下来。炉火仍在壁炉里轻轻跳动。马奇先生心满意足又平静地站在炉前的地毯上。
        - id: ch05-b23
          speaker: mr_march
          text: 我看，那是个聪明人。
        - id: ch05-b24
          speaker: marmee
          text: 我知道他是个好人。
        - id: ch05-b25
          speaker: narrator
          text: 马奇太太给钟上着发条，语气肯定，满是赞许。
        - id: ch05-b26
          speaker: jo
          text: 我早就知道你们会喜欢他。
        - id: ch05-b27
          speaker: narrator
          text: 乔只说了这一句，就悄悄上床去了。她猜想究竟是什么事把贝尔教授带到城里。她把各种可能想了一遍，最后断定，他准是在某个地方得到了一项巨大的荣誉，只因为太谦虚才没有说。她没有猜到，教授这次赶来，所关心的根本不是什么荣誉。
        - id: ch05-b28
          speaker: narrator
          text: 倘若乔看见教授安全回到自己的房间，望着一幅年轻姑娘的画像，也许就能得到一点线索。画上的姑娘神情严厉，不苟言笑，长着一头浓密的头发，仿佛正阴沉地凝视未来。尤其是当教授熄灭煤气灯，在黑暗中吻了吻那幅画像的时候。
