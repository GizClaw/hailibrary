  chapters:
    - id: ch01
      title: Surprises
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Twilight found Jo alone on the old sofa, watching the fire and thinking. She loved this quiet hour. No one disturbed her as she rested on Beth's little red pillow, planned stories, dreamed dreams, and felt that her sister was still close. Tonight she looked tired and solemn. Tomorrow was her birthday, and she could only think how quickly the years had passed. She was nearly twenty-five. What had she done with all that time? Jo believed she had nothing to show for it. She was wrong, though she would need a little while to see why.
        - id: ch01-b02
          speaker: jo
          text: So this is it. I'm going to be an old maid with a pen for a husband and a whole family of stories for children. Maybe I'll get a scrap of fame twenty years from now, when I'm too old to enjoy it, too lonely to share it, and too independent to need it. Well, I don't have to turn sour or selfish. I suppose old maids can be comfortable once they're used to it. Still...
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: Jo sighed. The prospect did not look inviting. It seldom does at first, because when you are twenty-five, thirty can seem like the end of everything. It isn't. A woman with strength and purpose inside her can live very happily and keep learning how to grow older with grace. At twenty-five, girls begin talking about becoming old maids while secretly deciding they never will. At thirty, they stop talking about it, quietly accept what life has brought them, and remember that twenty useful, happy years may still lie ahead. So don't laugh at unmarried women, young listeners. Quiet hearts may hide tender, painful love stories beneath sober dresses. Youth, health, ambition, and even love itself may have been given up without a word. Those sacrifices can make a tired, faded face beautiful in the sight of God. Even a sad or sharp old woman deserves kindness, if only because she may have missed life's sweetest happiness. The girls blooming now should remember that they may miss it too. Rosy cheeks do not last forever. Silver threads come into brown hair. One day, kindness and respect may feel as precious as love and admiration do now.
        - id: ch01-b04
          speaker: narrator
          text: Boys should remember that too. Be courteous to an older woman, however poor, plain, or particular she may be. The only chivalry worth having is ready to honor the old, protect the weak, and serve women without asking about age, rank, or color. Think of the good aunts who lecture and fuss, but also nurse and pet you, often without thanks. Remember the scrapes they helped you escape, the coins they slipped you from their little store, the stitches their patient fingers set, and the errands their willing feet ran for you. Repay them with the small attentions women treasure as long as they live. Bright-eyed girls notice that kind of courtesy and will think better of you for it. And if death, almost the only force that can separate a mother and son, ever takes your mother, some lonely Aunt Priscilla may still have the warmest corner of her heart waiting for the best nephew in the world.
        - id: ch01-b05
          speaker: narrator
          text: Somewhere in the middle of that sermon, Jo fell asleep. Suddenly Laurie's ghost seemed to be bending over her, solid and lifelike, with the old look he wore whenever he felt deeply and tried not to show it. Jo stared. She could not believe it was really him. Then he stooped and kissed her, and she sprang up in delight.
        - id: ch01-b06
          speaker: jo
          text: Oh, Teddy! My Teddy!
          emotion: happy
        - id: ch01-b07
          speaker: laurie
          text: Dear Jo, are you really glad to see me?
        - id: ch01-b08
          speaker: jo
          text: Glad? I couldn't begin to tell you how glad! Where's Amy?
        - id: ch01-b09
          speaker: laurie
          text: Your mother took her down to Meg's. We stopped there on the way, and nobody would let my wife leave.
        - id: ch01-b10
          speaker: jo
          text: Your what?
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: Laurie had said those two words with such proud satisfaction that the secret was out. He looked guilty at once, and Jo pounced.
        - id: ch01-b12
          speaker: jo
          text: You went and got married!
          emotion: surprised
        - id: ch01-b13
          speaker: laurie
          text: Yes, if you please. But I promise I won't do it again.
        - id: ch01-b14
          speaker: narrator
          text: He dropped to his knees, clasped his hands like a penitent, and looked full of mischief, laughter, and triumph.
        - id: ch01-b15
          speaker: jo
          text: Actually married?
        - id: ch01-b16
          speaker: laurie
          text: Completely and thoroughly, thank you.
        - id: ch01-b17
          speaker: jo
          text: Good gracious. What terrible thing will you do next?
        - id: ch01-b18
          speaker: narrator
          text: Jo fell back into her seat with a gasp.
        - id: ch01-b19
          speaker: laurie
          text: That sounds like you, but it isn't exactly a flattering congratulations.
        - id: ch01-b20
          speaker: jo
          text: What did you expect? You creep in like a burglar, knock the breath out of me, and spill a secret like that. Get up, you ridiculous boy, and tell me everything.
        - id: ch01-b21
          speaker: laurie
          text: Not one word unless I can sit in my old place and you promise not to put up a barricade.
        - id: ch01-b22
          speaker: narrator
          text: Jo laughed as she had not laughed in a very long time and patted the sofa.
        - id: ch01-b23
          speaker: jo
          text: The old pillow is in the attic, and we don't need it anymore. Come sit down and confess, Teddy.
        - id: ch01-b24
          speaker: laurie
          text: It sounds so good to hear you call me Teddy. No one else does.
        - id: ch01-b25
          speaker: jo
          text: What does Amy call you?
        - id: ch01-b26
          speaker: laurie
          text: My lord.
        - id: ch01-b27
          speaker: jo
          text: That sounds just like her. And I suppose you do look the part.
        - id: ch01-b28
          speaker: narrator
          text: Jo's eyes showed that she thought her boy handsomer than ever. The pillow was gone, but another kind of barrier stood between them, built by time, distance, and changed hearts. They both felt its shadow for a moment. Then Laurie tried to look dignified.
        - id: ch01-b29
          speaker: laurie
          text: Don't I look like a married man and the head of a family?
        - id: ch01-b30
          speaker: jo
          text: Not at all, and you never will. You're bigger and better-looking, but you're still the same rascal.
        - id: ch01-b31
          speaker: laurie
          text: Really, Jo, you ought to show me a little more respect.
        - id: ch01-b32
          speaker: jo
          text: How can I? You, married and settled? The idea is so funny I can't keep a straight face.
        - id: ch01-b33
          speaker: narrator
          text: Her smile was catching. Soon they were laughing together, and then they settled down for a long talk in the comfortable old way.
        - id: ch01-b34
          speaker: laurie
          text: Don't go out in the cold for Amy. Everyone will be here soon. I couldn't wait. I wanted to tell you the great surprise myself and get the first share, the way we used to fight over the cream.
        - id: ch01-b35
          speaker: jo
          text: Of course you did, and naturally you began at the wrong end. Now start properly. How did it happen? I'm dying to know.
        - id: ch01-b36
          speaker: laurie
          text: Well, I did it to please Amy.
        - id: ch01-b37
          speaker: jo
          text: That's lie number one. Amy did it to please you. Go on, sir, and try telling the truth.
        - id: ch01-b38
          speaker: laurie
          text: There she goes, lecturing me already. Isn't it wonderful to hear her?
        - id: ch01-b39
          speaker: narrator
          text: He spoke to the fire, and it glowed and snapped as if it agreed.
        - id: ch01-b40
          speaker: laurie
          text: It comes to the same thing now that she and I are one. More than a month ago, we planned to travel home with the Carrols. Then they decided to spend another winter in Paris. Grandpa wanted to come home. He had gone abroad for me, so I couldn't let him travel alone. I couldn't leave Amy either. Mrs. Carrol had picked up strict English ideas about chaperons and refused to let Amy come with us. So I solved everything. I said, “Let's get married. Then we can do as we please.”
        - id: ch01-b41
          speaker: jo
          text: Naturally. You always arrange things to suit yourself.
        - id: ch01-b42
          speaker: laurie
          text: Not always.
        - id: ch01-b43
          speaker: narrator
          text: Something in his voice made Jo hurry past the old hurt.
        - id: ch01-b44
          speaker: jo
          text: How did you persuade Aunt Carrol?
        - id: ch01-b45
          speaker: laurie
          text: It took work, but together we won her over. We had plenty of good reasons. There wasn't time to write home for permission, but all of you approved of us and would have agreed eventually. We only grabbed time by the forelock, as my wife says.
        - id: ch01-b46
          speaker: jo
          text: We are very proud of those words, aren't we? We do enjoy saying “my wife.”
        - id: ch01-b47
          speaker: narrator
          text: Jo addressed the fire now. She watched the happy light in Laurie's eyes and remembered how dark they had looked when she last saw him.
        - id: ch01-b48
          speaker: laurie
          text: Maybe I'm a little proud. She's such a charming woman that I can't help it. Uncle and Aunt were there to make everything proper. Amy and I were so wrapped up in each other that we were useless apart, and marrying made everything easier for everyone. So we did it.
        - id: ch01-b49
          speaker: jo
          text: When? Where? How?
        - id: ch01-b50
          speaker: laurie
          text: Six weeks ago, at the American consul's in Paris. It was very quiet. Even in our happiness, we didn't forget little Beth.
        - id: ch01-b51
          speaker: narrator
          text: Jo slipped her hand into his. Laurie gently smoothed the little red pillow he remembered so well. They sat still for a moment.
        - id: ch01-b52
          speaker: jo
          text: Why didn't you tell us afterward?
        - id: ch01-b53
          speaker: laurie
          text: We wanted to surprise you. At first we expected to come straight home. But once we were married, Grandpa discovered he needed at least another month. He sent us wherever we liked for our honeymoon. Amy had once called Valrosa a perfect honeymoon place, so we went there. We were as happy as people get to be only once in their lives. Jo, it was love among the roses.
          emotion: happy
        - id: ch01-b54
          speaker: narrator
          text: For a moment Laurie forgot Jo and seemed to see only Valrosa, Amy, and the roses. Jo was glad. The fact that he could tell her all of this so freely and naturally proved that he had forgiven and forgotten the old pain. She began to draw her hand away without quite meaning to. Laurie seemed to understand the thought behind that small movement and held it fast. His face grew serious in a new, manly way she had never seen before.
        - id: ch01-b55
          speaker: laurie
          text: Jo, dear, I need to say one thing. Then we'll put it away forever. I wrote that Amy had been kind to me. I will always love you, but that love has changed, and now I know this is better. You and Amy simply changed places in my heart. Maybe it would have happened naturally if I'd waited the way you asked me to. But I was impatient and brought the heartache on myself. I was a headstrong boy, and I needed a hard lesson to see that I had been wrong. For a while I was so confused I didn't know which of you I loved best. I even tried to love you both in the same way. I couldn't. The moment I saw Amy in Switzerland, everything cleared. You both found your right places in my heart. The old love was truly over before the new one began. I can love sister Jo and wife Amy honestly and dearly. Will you believe that? Can we go back to the happy closeness we had when we first knew each other?
        - id: ch01-b56
          speaker: jo
          text: I believe you with all my heart. But, Teddy, we can never be a boy and girl again. Those old days can't return, and we shouldn't ask them to. We're a man and a woman now, with serious work ahead. Playtime is over. You feel it too. I can see how you've changed, and you'll see it in me. I'll miss my boy, but I'll love the man just as much and admire him more, because he means to become what I always hoped he would be. We can't be little playmates anymore. We can be brother and sister, loving and helping each other all our lives. Can't we, Laurie?
        - id: ch01-b57
          speaker: narrator
          text: Laurie did not answer with words. He took the hand Jo offered and rested his face against it for a moment. He understood that she had not rejected their closeness, only given it a truer name. The boyish passion that had caused them pain was buried now. From its grave had grown a strong, beautiful friendship that could bless both their lives.
        - id: ch01-b58
          speaker: narrator
          text: Jo soon spoke brightly. She would not let his homecoming turn sad.
        - id: ch01-b59
          speaker: jo
          text: I still can't believe you children are married and about to keep house. It feels like yesterday when I buttoned Amy's pinafore and pulled your hair for teasing me. How the years fly!
        - id: ch01-b60
          speaker: laurie
          text: One of those children is older than you, so stop talking like a grandmother. I consider myself a grown gentleman. When you see Amy, you'll find she's quite an advanced little infant herself.
        - id: ch01-b61
          speaker: jo
          text: You may have a few more years, but I'm much older inside. Women always are. This last year was so hard that I feel forty.
        - id: ch01-b62
          speaker: laurie
          text: Poor Jo. We went off enjoying ourselves and left you here to carry it alone. You do look older. There's one line, and another. When you don't smile, your eyes are sad. And when I touched that cushion, I found a tear. You've suffered so much by yourself. I've been a selfish beast.
          emotion: sad
        - id: ch01-b63
          speaker: narrator
          text: Laurie tugged his own hair in remorse. Jo turned the betraying pillow over and tried to sound cheerful.
        - id: ch01-b64
          speaker: jo
          text: I wasn't alone. Father and Mother helped me. The babies comforted me. Knowing you and Amy were safe and happy made our troubles easier. I do feel lonely sometimes, but maybe it's good for me, and...
        - id: ch01-b65
          speaker: laurie
          text: You won't be lonely again. Amy and I can't manage without you. You must come teach the children how to keep house. Share everything with us the way you used to, and let us spoil you. We'll all be happy together.
        - id: ch01-b66
          speaker: narrator
          text: He put an arm around her as if he could keep every trouble away.
        - id: ch01-b67
          speaker: jo
          text: If I wouldn't be in the way, I'd love that. I feel younger already. Somehow my troubles flew off the moment you came. You always were a comfort, Teddy.
        - id: ch01-b68
          speaker: narrator
          text: Jo rested her head on his shoulder, just as she had years earlier when Beth was ill and Laurie told her to hold on to him. He wondered whether she remembered. Jo only smiled to herself, as if his return truly had chased her troubles away.
        - id: ch01-b69
          speaker: laurie
          text: You're still the same Jo. Tears one minute and laughter the next. Now you look mischievous. What are you thinking, Grandma?
        - id: ch01-b70
          speaker: jo
          text: I'm wondering how you and Amy get along.
        - id: ch01-b71
          speaker: laurie
          text: Like angels.
        - id: ch01-b72
          speaker: jo
          text: Naturally. But which angel is in charge?
        - id: ch01-b73
          speaker: laurie
          text: I don't mind admitting that Amy is, for now. I let her think so because it pleases her. Later we'll take turns. They say marriage cuts your rights in half and doubles your duties.
        - id: ch01-b74
          speaker: jo
          text: You'll continue exactly as you began, and Amy will rule you for the rest of your life.
        - id: ch01-b75
          speaker: laurie
          text: She does it so gently that I may not mind. Amy knows how to rule well. She wraps you around her finger as softly as silk and somehow makes you feel she's doing you a favor.
        - id: ch01-b76
          speaker: jo
          text: I never thought I'd live to see you henpecked and enjoying it!
        - id: ch01-b77
          speaker: narrator
          text: Laurie squared his shoulders and smiled with lofty masculine scorn.
        - id: ch01-b78
          speaker: laurie
          text: Amy is far too well bred to henpeck anyone, and I am not a man who would accept it. My wife and I respect ourselves and each other too much to bully or quarrel.
        - id: ch01-b79
          speaker: narrator
          text: Jo liked that answer. The new dignity suited him, though she felt a little regret as the boy changed so quickly into a man.
        - id: ch01-b80
          speaker: jo
          text: I'm sure you won't quarrel. You and Amy never fought the way we did. In the fable, she's the sun and I'm the wind. The sun persuaded the man much better.
        - id: ch01-b81
          speaker: laurie
          text: Oh, she can blow up a storm as well as shine. You should have heard the lecture she gave me in Nice. It was worse than any scolding I ever got from you. I'll tell you someday. She never will, because after saying she despised me and felt ashamed of me, she fell in love with the worthless fellow and married him.
        - id: ch01-b82
          speaker: jo
          text: What wickedness! If she mistreats you, come to me. I'll protect you.
        - id: ch01-b83
          speaker: laurie
          text: Yes, I certainly look as if I need protection.
        - id: ch01-b84
          speaker: narrator
          text: Laurie rose and struck an imposing pose, as if his strong shoulders proved that no wife could ever rule him. In an instant the grand pose changed to pure delight. Amy's voice came through the house, calling for Jo, and Laurie forgot everything except that she had arrived.
        - id: ch01-b85
          speaker: amy
          text: Where is she? Where's my dear old Jo?
          emotion: happy
        - id: ch01-b86
          speaker: narrator
          text: The whole family streamed in. Everyone hugged and kissed all over again, and nobody could settle down. After several failed attempts, the three travelers were finally placed in their chairs so the others could look at them, ask questions, and rejoice over every change. Mr. Laurence was as strong and hearty as ever. Travel had softened nearly all his crustiness. His old-fashioned courtliness had been polished until it felt kinder than before. He beamed whenever he called the young couple his children. Amy gave him the loving attention and respect of a daughter, and that devotion completely won his old heart. Best of all was Laurie, moving around the two of them as if he could never tire of seeing his wife and grandfather happy together.
        - id: ch01-b87
          speaker: narrator
          text: The instant Meg saw Amy, she became aware that her own dress had no Paris style at all. She knew young Mrs. Moffat would be completely outshone by young Mrs. Laurence. Amy had become an elegant, graceful woman. Jo watched the newly married pair and thought how right they looked together. She had judged truly after all. Laurie had found the beautiful, accomplished wife who would make his home lovely. Amy would be a pride to him, not the torment awkward old Jo might have been. Mr. and Mrs. March exchanged smiles and little nods, their faces full of happiness. They saw that their youngest daughter had done well in worldly things, but she had gained a better kind of wealth too. Her riches were love, trust, and happiness.
        - id: ch01-b88
          speaker: narrator
          text: Peace shone softly from Amy's face, and a new tenderness warmed her voice. The cool, proper way she once carried herself had changed into a gentle dignity that was both womanly and winning. None of her little affectations remained. She did not need them now. The open sweetness of her manner charmed the family more than her new beauty or her old grace. It marked her at once as the true gentlewoman she had once hoped and worked to become.
        - id: ch01-b89
          speaker: mrs_march
          text: Love has done a great deal for our little girl.
        - id: ch01-b90
          speaker: mr_march
          text: She has watched a good example all her life, my dear.
        - id: ch01-b91
          speaker: narrator
          text: Mr. March looked lovingly at the worn face and gray head beside him. Daisy could not stop staring at her pretty aunt. She followed Amy like a little dog, fascinated by the delightful trinkets hanging from her chatelaine. Demi considered the new family connection more cautiously. Even a tempting family of wooden bears from Berne could not bribe him into surrender at once. Laurie knew another way to win him.
        - id: ch01-b92
          speaker: laurie
          text: Young man, when we first met, you hit me in the face. Now I demand a gentleman's satisfaction.
        - id: ch01-b93
          speaker: narrator
          text: The tall uncle tossed and tousled his small nephew. Demi's dignity suffered, but the boy inside him was delighted.
        - id: ch01-b94
          speaker: hannah
          text: Well, bless me, she's wearing silk from head to toe. Ain't it a fine sight, seeing little Amy sitting there grand as can be while everybody calls her Mrs. Laurence!
        - id: ch01-b95
          speaker: narrator
          text: Hannah muttered to herself as she set the table in a distracted fashion, stealing frequent peeks through the serving hatch. And how everyone talked! One voice followed another, and then all of them burst out together, trying to fit three years of news into half an hour. Tea finally quieted them before they talked themselves hoarse and faint.
        - id: ch01-b96
          speaker: narrator
          text: They formed a joyful procession into the little dining room. Mr. March proudly escorted Amy, now Mrs. Laurence. Mrs. March leaned just as proudly on Laurie's arm and called him her son. Mr. Laurence chose Jo. Before they moved, he glanced toward the empty corner beside the fire. Jo followed his look and knew he was thinking of Beth.
        - id: ch01-b97
          speaker: mr_laurence
          text: You must be my girl now.
        - id: ch01-b98
          speaker: jo
          text: I'll try to fill her place, sir.
        - id: ch01-b99
          speaker: narrator
          text: The twins danced along behind. With every grown-up occupied by the travelers, they felt a golden age had arrived and made the most of it. They stole sips of tea when no one was looking. They crammed themselves with gingerbread, secured a hot biscuit apiece, and crowned their crimes by slipping tempting little tarts into their pockets. The pastries soon stuck and crumbled in hiding, teaching them that human nature and pastry are both fragile. The stolen tarts weighed on their consciences. Afraid that sharp-eyed Jo would see straight through the thin cloth covering their loot, the little sinners attached themselves to Grandpa, who had fortunately left off his spectacles.
        - id: ch01-b100
          speaker: narrator
          text: Amy was passed from one admiring relative to another as if she were part of the refreshments. At last she returned to the parlor on Mr. Laurence's arm. The others paired off exactly as before and went after her, leaving Jo without a companion. At first she did not mind or even notice. She had lingered behind to answer Hannah's eager questions about the bride's new life.
        - id: ch01-b101
          speaker: hannah
          text: Will Miss Amy ride in her coop and eat from all those lovely silver dishes stored over there?
        - id: ch01-b102
          speaker: jo
          text: I wouldn't be surprised if she drove six white horses, ate from gold plates, and wore diamonds and lace every day. Teddy doesn't think anything is too good for her.
        - id: ch01-b103
          speaker: hannah
          text: And nothing is! Now, do you want hash or fish balls for breakfast?
        - id: ch01-b104
          speaker: jo
          text: I don't care.
        - id: ch01-b105
          speaker: narrator
          text: Food felt painfully ordinary just then. Jo closed the door and watched the happy party disappear upstairs. One pair after another vanished from sight. When Demi's short plaid legs worked their way up the final step, she was truly alone. Loneliness swept over her so strongly that her eyes blurred and she looked around as though she needed something solid to lean on. Everyone seemed to belong with someone else. Even Teddy, who had once been hers in their boy-and-girl way, had left her. If Jo had known what birthday gift was drawing nearer with every minute, she would not have made herself one small promise.
        - id: ch01-b106
          speaker: jo
          text: I'll have a little cry when I go to bed. I mustn't be gloomy now.
          emotion: sad
        - id: ch01-b107
          speaker: narrator
          text: Jo wiped her eyes with her hand, since one of her boyish habits was never knowing where her handkerchief had gone. She had just managed a smile when someone knocked at the porch door.
        - id: ch01-b108
          speaker: narrator
          text: She hurried to open it and started as if another ghost had come to surprise her. A tall, bearded gentleman stood in the darkness, smiling at her like a midnight sun.
        - id: ch01-b109
          speaker: jo
          text: Oh, Mr. Bhaer, I'm so glad to see you!
          emotion: happy
        - id: ch01-b110
          speaker: narrator
          text: Jo caught hold of him as though the night might swallow him before she could pull him safely inside.
        - id: ch01-b111
          speaker: professor_bhaer
          text: And I am glad to see Miss March. But no, you have a party.
        - id: ch01-b112
          speaker: narrator
          text: Voices and dancing feet sounded from upstairs, and the Professor hesitated.
        - id: ch01-b113
          speaker: jo
          text: It isn't a party. It's only the family. My sister and our friends have just come home, and we're all very happy. Come in and join us.
        - id: ch01-b114
          speaker: narrator
          text: Mr. Bhaer was a sociable man, but he might politely have left and returned another day. Jo made that impossible by closing the door behind him and taking away his hat. Her face helped too. She forgot to hide her joy, and the lonely man saw a welcome warmer than anything he had dared to hope for.
        - id: ch01-b115
          speaker: professor_bhaer
          text: If I will not be in the way, I would gladly meet them all. Have you been ill, my friend?
        - id: ch01-b116
          speaker: narrator
          text: The question came suddenly. As Jo hung up his coat, the light touched her face and showed him how she had changed.
        - id: ch01-b117
          speaker: jo
          text: Not ill. Only tired and sad. We've had trouble since I last saw you.
        - id: ch01-b118
          speaker: professor_bhaer
          text: Yes, I know. When I heard, my heart ached for you.
          emotion: sad
        - id: ch01-b119
          speaker: narrator
          text: He took her hand again. There was no clever advice in his answer and no attempt to hurry her grief away. His sympathetic face showed that he understood. The kindness in his eyes and the honest grip of his large, warm hand gave Jo more comfort than any speech could have done.
        - id: ch01-b120
          speaker: jo
          text: Father, Mother, this is my friend, Professor Bhaer.
        - id: ch01-b121
          speaker: narrator
          text: Pride and pleasure rang so clearly in Jo's voice that she might as well have announced him with a trumpet. Any doubts the stranger had about his welcome vanished at once. At first everyone greeted him warmly for Jo's sake. Very soon they liked him for his own. They could not help it. He carried the kind of goodness that opens hearts, and these simple people warmed to him all the more because he was poor.
        - id: ch01-b122
          speaker: narrator
          text: Mr. Bhaer looked around like a traveler who knocks at an unknown door and finds home when it opens. The children swarmed to him like bees to honey. One settled on each knee, then they searched his pockets, pulled his beard, and examined his watch with fearless curiosity. He let them do it all. The women silently signaled their approval to one another. Mr. March felt that he had found a kindred mind and opened the best store of ideas he possessed for his guest. Quiet John listened and enjoyed the talk without saying a word. Mr. Laurence, who often slept through evening conversation, found it impossible to close his eyes.
        - id: ch01-b123
          speaker: narrator
          text: Jo was too busy with her own feelings to be amused by Laurie. At first, a faint twinge of brotherly suspicion made him stand apart and study the newcomer with great care. It was not jealousy, but he clearly meant to decide whether this stranger was good enough to be Jo's friend. The suspicion did not last. The conversation interested him in spite of himself, and before long he had joined the circle. In that friendly room, Mr. Bhaer spoke with warmth and showed himself at his best. He rarely addressed Laurie directly, but often looked at him. Sometimes a shadow crossed the Professor's face as he watched the younger man in his prime and remembered his own vanished youth. Then his eyes turned toward Jo with such a wistful, silent question that she might have answered if she had noticed. Jo had enough trouble managing her own eyes. She kept them safely on the little sock she was knitting and tried to look like a model maiden aunt.
        - id: ch01-b124
          speaker: narrator
          text: A secret glance now and then refreshed her like a sip of cool water after a dusty walk. Each sideways look brought another hopeful sign. The Professor had lost the absentminded expression she remembered. His whole face was alive with interest in the present moment. He looked truly young and handsome to her. For once, Jo forgot her habit of comparing every unfamiliar man with Laurie and finding him wanting. Mr. Bhaer seemed almost inspired, even though the talk had wandered to the burial customs of the ancients, hardly an exciting subject. Jo glowed with triumph when Teddy was defeated in an argument. Then she watched her father's absorbed face and thought how much he would enjoy having a man like her Professor there to talk with every day.
        - id: ch01-b125
          speaker: narrator
          text: Best of all, Mr. Bhaer wore a new black suit that made him look more like a gentleman than ever. His bushy hair had been cut and carefully brushed, though it would not stay smooth for long. Whenever the conversation excited him, he pushed it straight up in the funny old way Jo knew. She liked it wild better than flat because it made his broad forehead look noble, almost like the brow of an ancient god. Poor Jo sat quietly knitting while she glorified every detail of that plain man. Nothing escaped her, not even the astonishing fact that he wore real gold buttons in the spotless cuffs at his wrists.
        - id: ch01-b126
          speaker: jo
          text: Dear old fellow. He couldn't have dressed with more care if he were going courting.
        - id: ch01-b127
          speaker: narrator
          text: The thought made Jo blush so fiercely that she dropped her ball of yarn and bent to hide her face while searching for it. The trick failed. The Professor was in the middle of describing a funeral pyre, but he abandoned the ancient fire and dived after the blue ball. Their heads struck together. Both saw stars. They sat up laughing and red-faced, without the ball, and each wished they had stayed in their chairs.
        - id: ch01-b128
          speaker: narrator
          text: The evening slipped away unnoticed. Hannah carried off the sleepy children early, their heads nodding like two pink poppies. Mr. Laurence went home to rest. Everyone else remained by the fire and talked without watching the clock. At last Meg imagined Daisy tumbling out of bed and Demi setting his nightshirt on fire while studying matches, so she rose to leave.
        - id: ch01-b129
          speaker: jo
          text: We must sing together the old way. We're all together again at last.
        - id: ch01-b130
          speaker: narrator
          text: They were not all there. Yet nobody thought Jo careless or wrong. Beth still seemed among them, invisible and peaceful, more precious than ever. Death could not break a family joined by love. Her little chair remained in its familiar place. The neat workbasket stood on its shelf with the sewing she left unfinished when the needle grew too heavy. Her beloved piano was seldom played now, but no one had moved it. Above it hung Beth's serene, smiling face, just as it had looked in the early days. It seemed to tell them to be happy because she was still there.
        - id: ch01-b131
          speaker: laurie
          text: Play something, Amy. Let everyone hear how much you've improved.
        - id: ch01-b132
          speaker: narrator
          text: Laurie spoke with a teacher's pardonable pride in his promising pupil. Amy slowly turned the faded piano stool. The familiar instrument, Beth's empty place, and the thought of playing for the family brought tears into her eyes.
        - id: ch01-b133
          speaker: amy
          text: Not tonight, dear. I can't perform tonight.
          emotion: sad
        - id: ch01-b134
          speaker: narrator
          text: She gave them something better than a display of skill. Amy sang Beth's songs with a tenderness no music master could have taught her. Love and loss had put a sweetness into her voice that reached every heart more deeply than brilliance ever could. The family listened without speaking. At the final line of Beth's favorite hymn, the room became utterly still and Amy's clear voice suddenly failed. The words were hard to sing because they said that heaven could heal every sorrow on earth. Amy leaned back against Laurie, who stood behind her and shared the same grief. After all the embraces and joy of that evening, her welcome home could not feel entirely complete without Beth's kiss.
        - id: ch01-b135
          speaker: jo
          text: Now we should finish with Mignon's song. Mr. Bhaer sings that one.
        - id: ch01-b136
          speaker: narrator
          text: Jo spoke before the silence became painful. The Professor cleared his throat with a pleased little sound and joined her in the corner.
        - id: ch01-b137
          speaker: professor_bhaer
          text: You will sing with me? Our voices go excellently together.
        - id: ch01-b138
          speaker: narrator
          text: That was a kind invention. Jo understood music about as well as a grasshopper did, and their voices did not truly go well together at all. Still, she would have agreed if he had suggested an entire opera. She warbled along, blissfully ignoring both time and tune. It hardly mattered. Mr. Bhaer sang with a true German's full heart and skill. Soon Jo wisely lowered her voice to a quiet hum so she could listen. The Professor's mellow voice seemed to be singing for her alone.
        - id: ch01-b139
          speaker: narrator
          text: The song asked whether the listener knew the land where the citron bloomed. That line had once been the Professor's favorite because the land meant Germany. Tonight he lingered with special warmth on the invitation to go there together with his beloved. Jo felt the tenderness in it. She longed to tell him that she knew the land and would gladly go whenever he wished.
        - id: ch01-b140
          speaker: narrator
          text: Everyone declared the song a great success, and the singer received plenty of praise. A few minutes later, however, Mr. Bhaer forgot his manners and stared at Amy as she put on her bonnet. Jo had introduced her only as her sister, and no one had used Amy's new name all evening. His surprise deepened when Laurie offered a gracious farewell.
        - id: ch01-b141
          speaker: laurie
          text: My wife and I are very glad to know you, sir. Please remember that you'll always be welcome across the way.
        - id: ch01-b142
          speaker: narrator
          text: The Professor thanked him so warmly, and his face lit with such sudden satisfaction, that Laurie decided this was the most delightfully expressive older gentleman he had ever met.
        - id: ch01-b143
          speaker: professor_bhaer
          text: I too must go. But if you permit it, dear madam, I will gladly return. A little business in the city will keep me here for several days.
        - id: ch01-b144
          speaker: narrator
          text: He spoke to Mrs. March but looked at Jo. The mother's answer was as warm as the daughter's eyes. Mrs. March understood her children's hearts better than some people guessed.
        - id: ch01-b145
          speaker: mr_march
          text: I believe that is a wise man.
        - id: ch01-b146
          speaker: narrator
          text: Mr. March spoke with quiet satisfaction from the hearthrug after the last guest had gone.
        - id: ch01-b147
          speaker: mrs_march
          text: I know he is a good man.
        - id: ch01-b148
          speaker: narrator
          text: Mrs. March gave her firm approval as she wound the clock.
        - id: ch01-b149
          speaker: jo
          text: I thought you would like him.
        - id: ch01-b150
          speaker: narrator
          text: That was all Jo said before slipping away to bed. She wondered what business had brought Mr. Bhaer to the city. At last she decided he must have received some great appointment and was too modest to mention it. If she had seen him alone in his room, she might have guessed differently. He was looking at the picture of a severe young woman with a great deal of hair, staring sternly into the future. Then he turned out the gas and kissed the picture in the dark.
