audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机智，像在炉边从容讲述旧日家事
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情绪来得快，带一点男孩子气
        timbre: 明亮略带沙哑
        pace: 偏快
        pitch: 中低
    meg:
      display_name: 梅格
      tts:
        delivery: 温柔端庄，常带大姐姐式的认真
        timbre: 柔和圆润
        pace: 适中
        pitch: 中
    beth:
      display_name: 贝丝
      tts:
        delivery: 羞怯安静，话语真诚而体贴
        timbre: 轻柔温暖
        pace: 稍慢
        pitch: 中高
    amy:
      display_name: 艾米
      tts:
        delivery: 一本正经又有些自负，努力显得优雅
        timbre: 清脆稚嫩
        pace: 适中
        pitch: 偏高
    mrs_march:
      display_name: 马奇太太
      tts:
        delivery: 慈爱爽朗，沉稳中带着鼓励
        timbre: 饱满温暖
        pace: 从容
        pitch: 中低
    mr_laurence:
      display_name: 劳伦斯先生
      tts:
        delivery: 严肃直接，善意藏在简短的话里
        timbre: 低沉浑厚
        pace: 从容
        pitch: 低
    laurie:
      display_name: 劳里
      tts:
        delivery: 文雅真诚，羞怯时略显迟疑，快活时充满少年朝气
        timbre: 清亮中带一点沙哑
        pace: 适中
        pitch: 中
    maid:
      display_name: 女仆
      tts:
        delivery: 恭敬利落，语气克制
        timbre: 清晰朴素
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 雪地里的邀请
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一个飘雪的下午，乔脚蹬胶靴，披着旧外套，风帽兜住脑袋，一手拿扫帚，一手提铁锹，咚咚地穿过门厅。梅格看见了，叫住她。
        - id: ch01-b02
          speaker: meg
          text: “乔，你又要上哪儿去呀？”
        - id: ch01-b03
          speaker: jo
          text: “出去活动活动。”
        - id: ch01-b04
          speaker: narrator
          text: 她眼里闪着淘气的光。
        - id: ch01-b05
          speaker: meg
          text: “你早上已经走了两趟远路，还不够吗？外头又冷又阴。听我的，像我这样坐在炉边，多暖和，多干爽。”
        - id: ch01-b06
          speaker: narrator
          text: 梅格说着打了个寒战。
        - id: ch01-b07
          speaker: jo
          text: “我可不要听劝！成天一动不动怎么行？我又不是小猫，不爱守着炉火打盹。我喜欢冒险，现在就去找一场。”
        - id: ch01-b08
          speaker: narrator
          text: 梅格回去烤脚，接着读她的《艾凡赫》。乔却兴冲冲地出了门。雪很松，她拿铁锹铲，拿扫帚扫，很快就在花园里开出一圈小路。等太阳出来，贝丝可以来这里散步，那些生病的娃娃也能出来透透气。
        - id: ch01-b09
          speaker: narrator
          text: 马奇家的花园紧挨着劳伦斯家的花园。两幢房子都在城郊，周围有小树林、草坪、宽敞的花园，还有安静的街道，依然带着一点乡野气息。两家的地只隔着一道矮树篱。
        - id: ch01-b10
          speaker: narrator
          text: 树篱这边，是马奇家的棕色老屋。冬天没有藤蔓和鲜花遮掩，它看起来空荡又寒酸。树篱那边，却是一座庄严的石头大宅。宽大的车房、修整整齐的庭园、温室，还有华美窗帘后隐约露出的精致陈设，样样都透着富足和舒适。
        - id: ch01-b11
          speaker: narrator
          text: 可那座漂亮的大宅没有多少生气，也显得寂寞。草坪上从来没有孩子玩耍，窗前也不见一位母亲含笑望出来。平日除了老先生和他的孙子，很少有人进出。
        - id: ch01-b12
          speaker: narrator
          text: 在乔的想象里，那像一座中了魔法的宫殿。里面藏着许多华贵奇妙的东西，却没有人欣赏。她早就想进去探一探，也想认识劳伦斯家的男孩。那孩子明明想交朋友，只是不知道怎么开口。
        - id: ch01-b13
          speaker: narrator
          text: 舞会以后，乔更想和他结识了，还想过不少办法。可她近来一直没见到他，正猜他是不是走了，有一天却看见楼上的窗边露出一张棕色的脸。那张脸枕在瘦削的手掌上，羡慕地望着马奇家的花园。那时，贝丝和艾米正在园里互扔雪球。
        - id: ch01-b14
          speaker: jo
          text: “他没人陪，也没什么可玩的，一定难受极了。他爷爷根本不懂怎样才是为他好，老把他关在家里。他该有一群快活的男孩子陪着，要不，有个年轻活泼的人也行。真想走过去，把这些话都告诉那位老先生！”
        - id: ch01-b15
          speaker: narrator
          text: 这个念头把乔自己逗笑了。她最喜欢大胆的事，那些古怪举动也总能吓梅格一跳。她始终没忘记要“到那边去”。这个雪天，她终于决定试一试。
        - id: ch01-b16
          speaker: narrator
          text: 乔看见劳伦斯先生乘车出了门，便一路铲到树篱边，停下来观察。四周静悄悄的，楼下窗帘都垂着，一个仆人也看不见。只有楼上窗前，那个黑色卷发的脑袋还靠在手掌上。
        - id: ch01-b17
          speaker: jo
          text: “他果然在那里。可怜的孩子，这么阴沉的天，还孤零零病着，太不像话了。我扔个雪球叫他看看，再跟他说句话。”
        - id: ch01-b18
          speaker: narrator
          text: 一团松软的雪飞上楼去。那颗脑袋马上转了过来。男孩脸上的倦意一下消失了，大眼睛亮起来，嘴角也有了笑。乔朝他点头，笑着挥了挥扫帚。
        - id: ch01-b19
          speaker: jo
          text: “你怎么样？生病了吗？”
        - id: ch01-b20
          speaker: narrator
          text: 劳里推开窗，用乌鸦似的沙哑嗓音回答。
        - id: ch01-b21
          speaker: laurie
          text: “好多了，谢谢你。我得了重感冒，在屋里关了整整一星期。”
        - id: ch01-b22
          speaker: jo
          text: “真可怜。那你靠什么打发时间？”
        - id: ch01-b23
          speaker: laurie
          text: “什么也没有。这里闷得跟坟墓一样。”
        - id: ch01-b24
          speaker: jo
          text: “你不读书吗？”
        - id: ch01-b25
          speaker: laurie
          text: “不大读。他们不让我读太久。”
        - id: ch01-b26
          speaker: jo
          text: “没人念给你听？”
        - id: ch01-b27
          speaker: laurie
          text: “爷爷偶尔会念，可他不喜欢我的书。我又不想总去烦布鲁克先生。”
        - id: ch01-b28
          speaker: jo
          text: “那就请个人来看看你。”
        - id: ch01-b29
          speaker: laurie
          text: “没有我想见的人。男孩子太吵，我头还疼呢。”
        - id: ch01-b30
          speaker: jo
          text: “就没有一个好姑娘愿意来念书，陪你解闷吗？女孩子很安静，也喜欢照顾病人。”
        - id: ch01-b31
          speaker: laurie
          text: “我一个姑娘也不认识。”
        - id: ch01-b32
          speaker: jo
          text: “你认识我们呀。”
        - id: ch01-b33
          speaker: narrator
          text: 乔才开了个头，自己先笑了，没有再说下去。
        - id: ch01-b34
          speaker: laurie
          text: “对呀，我认识！请你过来，好吗？”
          emotion: happy
        - id: ch01-b35
          speaker: jo
          text: “我不安静，也不算什么好姑娘。不过妈妈要是准许，我就来。我现在去问她。你乖乖把窗关好，等我回来。”
        - id: ch01-b36
          speaker: narrator
          text: 乔把扫帚往肩上一扛，大步走回家，一路猜着家里人会怎么说。劳里一想到有人要来陪他，兴奋得心里乱跳。他立刻跑去做准备。马奇太太说过，他是个“小绅士”，既然有客人来，自然得好好招待。
        - id: ch01-b37
          speaker: narrator
          text: 他梳好满头卷发，换上干净衣领，又亲手收拾房间。家里明明有半打仆人，那间屋子却实在算不上整洁。没多久，门铃响亮地响了一声。楼下传来一个果断的声音，一开口就问“劳里先生”在不在。一位满脸惊讶的仆人跑上楼，说有位年轻小姐来访。
        - id: ch01-b38
          speaker: laurie
          text: “请她上来吧。是乔小姐。”
    - id: ch02
      title: 病房里的新朋友
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 劳里走到小起居室门口迎接。乔来了，脸颊红扑扑的，神态自在得很。她一手端着盖好的盘子，另一只胳膊抱着贝丝的三只小猫。
        - id: ch02-b02
          speaker: jo
          text: “我连人带行李全来啦。妈妈向你问好，还说她很乐意让我来帮忙。梅格让我带点她做的牛奶冻，她做这个挺拿手。贝丝觉得小猫可以安慰你。我知道你看见它们准会笑，可她那么想为你做点事，我实在不好拒绝。”
        - id: ch02-b03
          speaker: narrator
          text: 贝丝送来的这份滑稽礼物正合适。劳里逗着小猫，笑个不停，很快就忘了害羞，马上变得亲热又健谈。
        - id: ch02-b04
          speaker: narrator
          text: 乔揭开盘盖。里面是一盘牛奶冻，四周围着绿叶，还点缀着猩红的花朵。那些花，是从艾米心爱的天竺葵上摘下来的。
        - id: ch02-b05
          speaker: laurie
          text: “做得这么漂亮，我都舍不得吃了。”
          emotion: happy
        - id: ch02-b06
          speaker: jo
          text: “没什么稀奇的。只是大家都惦记你，想表示一点心意。叫女仆先收起来，喝茶时再吃吧。这个很清淡，你可以吃，也够软，不会弄疼嗓子。你这房间真舒服！”
        - id: ch02-b07
          speaker: laurie
          text: “要是能一直整整齐齐，本来是挺舒服的。可女仆们懒得很，我又不知道怎样才能叫她们听我的。真伤脑筋。”
        - id: ch02-b08
          speaker: jo
          text: “两分钟就能弄好。壁炉前扫一扫，就这样。壁炉架上的东西放正，就这样。书放这儿，药瓶搁那儿。再把沙发转过去，避开亮光，把靠垫拍松。好了，这就妥当了。”
        - id: ch02-b09
          speaker: narrator
          text: 果然妥当了。乔一边说笑，一边麻利地把每样东西放回该在的地方，房间顿时换了模样。劳里一句话也没说，只带着敬意看她忙活。等乔招手叫他回沙发，他坐下来，满意地舒了口气。
        - id: ch02-b10
          speaker: laurie
          text: “你真好！对，就该这么收拾。现在请你坐那把大椅子，也让我想想该怎么招待客人吧。”
        - id: ch02-b11
          speaker: jo
          text: “不用，我是来替你解闷的。要不要我念书？”
        - id: ch02-b12
          speaker: narrator
          text: 她喜爱地看向旁边那几本诱人的书。
        - id: ch02-b13
          speaker: laurie
          text: “谢谢，不过那些我全读过了。你要是不介意，我更想聊聊天。”
        - id: ch02-b14
          speaker: jo
          text: “当然不介意。你只要起个头，我可以一直说到天黑。贝丝总说，我一开口就停不下来。”
        - id: ch02-b15
          speaker: laurie
          text: “贝丝是不是那个脸颊红润、总待在家里，偶尔提着小篮子出门的姑娘？”
        - id: ch02-b16
          speaker: narrator
          text: 劳里问得很有兴趣。
        - id: ch02-b17
          speaker: jo
          text: “对，就是她。她是我的宝贝，是个实实在在的好姑娘。”
        - id: ch02-b18
          speaker: laurie
          text: “长得漂亮的是梅格，卷头发的是艾米，对吧？”
        - id: ch02-b19
          speaker: jo
          text: “你怎么会知道？”
        - id: ch02-b20
          speaker: narrator
          text: 劳里红了脸，不过还是坦白说了。
        - id: ch02-b21
          speaker: laurie
          text: “是这样，我常听见你们互相喊名字。我一个人在楼上，总忍不住往你们家看，因为你们看起来一直那么快活。请原谅我这么没礼貌。有时你们忘了拉花窗那边的窗帘，屋里点着灯，炉火烧着，你们和母亲围坐在桌旁，远远看去就像一幅画。她正好朝着这边，隔着花看过去，她的脸那么温柔，我总想多看一会儿。你知道，我没有母亲。”
          emotion: sad
        - id: ch02-b22
          speaker: narrator
          text: 劳里拨了拨炉火，想把嘴唇那一下控制不住的颤动藏起来。他眼里有一种孤独，也有对亲情的渴望，一下就碰到了乔温暖的心。
        - id: ch02-b23
          speaker: narrator
          text: 乔从小受的教养朴实自然，心里一点也没有装模作样的念头。她十五岁了，依旧像孩子一样天真坦率。劳里病着，又这么孤单。乔想到自己拥有家庭和幸福，是多么富足，真心想分一些给他。她的脸亲切起来，平时尖亮的声音也格外温柔。
        - id: ch02-b24
          speaker: jo
          text: “以后我们再也不拉那扇窗帘了，你想看多久都行。不过，我更希望你别只在这里看，干脆到我们家来。妈妈特别好，她一定能让你好受些。我求求贝丝，她就会唱歌给你听。艾米可以跳舞，梅格和我还能拿那些滑稽的戏服和道具逗你。大家一定会玩得很开心。你爷爷不准你来吗？”
        - id: ch02-b25
          speaker: laurie
          text: “只要你母亲去问，我想他会同意。他其实很和善，就是看着不像。他几乎什么事都依我，只怕我去打扰不认识的人。”
        - id: ch02-b26
          speaker: narrator
          text: 劳里的脸越来越亮了。
        - id: ch02-b27
          speaker: jo
          text: “可我们不是陌生人，是邻居。你也不用怕打扰。我们全都想认识你，我惦记这件事很久了。我们搬来没多久，附近的人差不多都认识了，只有你还没认识。”
        - id: ch02-b28
          speaker: laurie
          text: “爷爷一整天都埋在书堆里，不怎么理外头的事。我的家庭教师布鲁克先生又不住这里。没人陪我到处走，我只能待在家里，自己找事情做。”
        - id: ch02-b29
          speaker: jo
          text: “这可不成。只要有人请，你就该努力去串门。慢慢地，你会交到很多朋友，也会有很多地方可去。别总想着害羞，多出去几次，很快就不怕了。”
        - id: ch02-b30
          speaker: narrator
          text: 劳里又红了脸，却没因为乔说他害羞而生气。乔的话里全是好意，所以不管说得多直，别人也只会照那份好意来听。
        - id: ch02-b31
          speaker: narrator
          text: 两人静了一会儿。劳里望着炉火，乔则满意地朝四周看看。最后，男孩换了个话题。
        - id: ch02-b32
          speaker: laurie
          text: “你喜欢学校吗？”
        - id: ch02-b33
          speaker: jo
          text: “我不上学。我是个干活的男人——我是说，干活的姑娘。我去伺候姑婆。她是个很可爱的坏脾气老太太。”
        - id: ch02-b34
          speaker: narrator
          text: 劳里张开嘴还想问，却及时想起，追问别人家的事不大礼貌。他闭上嘴，看着有点不自在。
        - id: ch02-b35
          speaker: narrator
          text: 乔喜欢他这样有教养，也不介意拿马奇姑婆开玩笑。她便活灵活现地讲起那个焦躁的老太太、她的肥狮子狗、会说西班牙语的鹦鹉，还有那间让乔自在得像鱼回到水里的藏书室。
        - id: ch02-b36
          speaker: narrator
          text: 劳里听得津津有味。乔又说到一位古板的老绅士。有一次，那人来向马奇姑婆求婚。话说到一半，鹦鹉波尔突然扯掉他的假发，把他吓坏了。劳里倒在沙发上，笑得眼泪直流，连女仆都探头进来，看出了什么事。
        - id: ch02-b37
          speaker: laurie
          text: “啊，笑这一场太有用了！再讲一点吧。”
          emotion: happy
        - id: ch02-b38
          speaker: narrator
          text: 他从靠垫里抬起脸，笑得满脸通红，眼睛发亮。乔见自己这么成功，越发得意，果然继续讲下去。她说起姐妹们演的戏和想做的事，说她们怎样盼着父亲回来，又怎样为他担心，也说了不少她们那个小小世界里的趣事。
        - id: ch02-b39
          speaker: narrator
          text: 后来，两个人谈起书。乔惊喜地发现，劳里和她一样爱读书，而且读过的书比她还多。
    - id: ch03
      title: 藏书室里的相遇
      blocks:
        - id: ch03-b01
          speaker: laurie
          text: “你这么喜欢书，就跟我下楼看看我们的藏书吧。爷爷出门了，你不用怕。”
        - id: ch03-b02
          speaker: narrator
          text: 劳里站起身来。乔把头一扬。
        - id: ch03-b03
          speaker: jo
          text: “我什么都不怕。”
        - id: ch03-b04
          speaker: laurie
          text: “我信，你大概真的什么都不怕！”
        - id: ch03-b05
          speaker: narrator
          text: 劳里说得满是佩服，心里却想，要是她碰见老先生心情不好的时候，恐怕多少还是会怕一点。
        - id: ch03-b06
          speaker: narrator
          text: 整座房子暖得像夏天。劳里带着乔穿过一间又一间屋子。凡是吸引她的东西，他都让她停下来仔细看。最后，他们走进了藏书室。
        - id: ch03-b07
          speaker: narrator
          text: 乔一看见里面，立刻拍起手，还高兴得跳了几下。她每次格外快活，总会这样。四面墙排满了书，还有画、雕像和许多叫人眼花缭乱的小柜子，里面装着钱币和奇珍。那儿有深得能把人陷进去的扶手椅，有样子古怪的桌子和青铜器。最妙的是一座敞开的大壁炉，四周镶着别致的花砖。
        - id: ch03-b08
          speaker: jo
          text: “真富有啊！”
        - id: ch03-b09
          speaker: narrator
          text: 乔整个人陷进一把天鹅绒扶手椅里，满足地看遍四周。接着，她郑重起来。
        - id: ch03-b10
          speaker: jo
          text: “西奥多·劳伦斯，你本来该是全世界最幸福的男孩。”
        - id: ch03-b11
          speaker: laurie
          text: “人又不能光靠书活着。”
        - id: ch03-b12
          speaker: narrator
          text: 劳里摇摇头，坐到对面的一张桌子上。他还没来得及往下说，铃声忽然响了。乔一下跳起来。
        - id: ch03-b13
          speaker: jo
          text: “天哪！是你爷爷！”
          emotion: fearful
        - id: ch03-b14
          speaker: laurie
          text: “是他又怎么样？你不是说什么都不怕吗？”
        - id: ch03-b15
          speaker: narrator
          text: 男孩故意逗她。
        - id: ch03-b16
          speaker: jo
          text: “我想，我确实有一点怕他。可我也说不清在怕什么。妈妈准我来，而且你也没有因为我来变得更糟。”
        - id: ch03-b17
          speaker: narrator
          text: 乔装得很镇静，眼睛却一直盯着门。
        - id: ch03-b18
          speaker: laurie
          text: “我好多了，真的太谢谢你了。我只怕让你陪我说这么久，你已经烦了。今天实在太开心，我一点也舍不得停。”
          emotion: happy
        - id: ch03-b19
          speaker: maid
          text: “先生，医生来看您了。”
        - id: ch03-b20
          speaker: narrator
          text: 女仆说着，向劳里招了招手。
        - id: ch03-b21
          speaker: laurie
          text: “我要离开一会儿，你不介意吧？看来我非去见他不可。”
        - id: ch03-b22
          speaker: jo
          text: “不用管我。我待在这里，快活得像只蟋蟀。”
        - id: ch03-b23
          speaker: narrator
          text: 劳里走后，乔自己找到了消遣。她站到老先生一幅精美的肖像前，仔细端详。房门又开了，她没有回头，斩钉截铁地说了起来。
        - id: ch03-b24
          speaker: jo
          text: “这下我敢肯定，我不该怕他。他的眼睛很和善。嘴巴虽然严厉，可一看就有一股谁也拗不过的意志。他没有我外祖父那么英俊，不过我喜欢他。”
        - id: ch03-b25
          speaker: mr_laurence
          text: “多谢您的夸奖，小姐。”
        - id: ch03-b26
          speaker: narrator
          text: 粗哑的声音从身后传来。乔吓得转过身，老劳伦斯先生正站在那里。
        - id: ch03-b27
          speaker: narrator
          text: 可怜的乔一下红透了。想到自己刚说过的话，她的心也不安地猛跳。她有一瞬间真想拔腿逃跑，可那样太胆小，姐妹们也会笑她。于是，她决定留下来，想办法熬过这场难堪。
        - id: ch03-b28
          speaker: narrator
          text: 她再看一眼，发现老先生浓眉下那双有神的眼睛，比画像上的还和善，里面甚至闪着一点狡黠的笑。乔便不那么怕了。那阵可怕的沉默过去后，老先生突然开口，嗓门比刚才更粗。
        - id: ch03-b29
          speaker: mr_laurence
          text: “这么说，你不怕我，嗯？”
        - id: ch03-b30
          speaker: jo
          text: “不大怕，先生。”
        - id: ch03-b31
          speaker: mr_laurence
          text: “你还觉得我没有你外祖父英俊？”
        - id: ch03-b32
          speaker: jo
          text: “是没有他英俊，先生。”
        - id: ch03-b33
          speaker: mr_laurence
          text: “我有一股谁也拗不过的意志，是不是？”
        - id: ch03-b34
          speaker: jo
          text: “我只是说，您看起来像是这样。”
        - id: ch03-b35
          speaker: mr_laurence
          text: “可你不管怎样，还是喜欢我？”
        - id: ch03-b36
          speaker: jo
          text: “是的，先生，我喜欢您。”
        - id: ch03-b37
          speaker: narrator
          text: 这个回答很合老先生的心意。他短促地笑了一声，和乔握了手，又用手指托起她的下巴，严肃地看了她一会儿。然后，他松开手，点点头。
        - id: ch03-b38
          speaker: mr_laurence
          text: “你长得不像你外祖父，性情倒很像。他是个了不起的人，亲爱的。最难得的是，他勇敢又诚实。我能做他的朋友，一直觉得很骄傲。”
        - id: ch03-b39
          speaker: jo
          text: “谢谢您，先生。”
        - id: ch03-b40
          speaker: narrator
          text: 这话正说到乔心里，她立刻自在了。老先生紧接着又厉声问她。
        - id: ch03-b41
          speaker: mr_laurence
          text: “你对我这孩子做了什么，嗯？”
        - id: ch03-b42
          speaker: jo
          text: “我只是想尽一点邻居的情分，先生。”
        - id: ch03-b43
          speaker: narrator
          text: 乔把自己为什么来拜访，从头到尾讲给他听。
        - id: ch03-b44
          speaker: mr_laurence
          text: “你觉得他需要有人替他提提精神，是吗？”
        - id: ch03-b45
          speaker: jo
          text: “是的，先生。他看着有点孤单。也许有年轻人陪陪他，会对他有好处。我们虽然只是几个姑娘，可只要帮得上，都很愿意。您圣诞节送来的丰盛礼物，我们一直记着呢。”
        - id: ch03-b46
          speaker: mr_laurence
          text: “啧，啧，啧！那是这孩子做的。那个可怜的女人现在怎么样？”
        - id: ch03-b47
          speaker: jo
          text: “她过得不错，先生。”
        - id: ch03-b48
          speaker: narrator
          text: 乔马上说起胡梅尔一家。马奇太太已经请了一些比自家富裕的朋友，也来帮助他们。
        - id: ch03-b49
          speaker: mr_laurence
          text: “这很像她父亲行善的作风。等天气好些，我要去看看你母亲，替我转告她。喝茶铃响了。为了这孩子，我们吃得早。下楼吧，接着尽你的邻居情分。”
        - id: ch03-b50
          speaker: jo
          text: “只要您愿意留我，先生。”
        - id: ch03-b51
          speaker: mr_laurence
          text: “不愿意留你，我就不会开口请。”
        - id: ch03-b52
          speaker: narrator
          text: 劳伦斯先生带着老派的礼数，向乔伸出手臂。
        - id: ch03-b53
          speaker: jo
          text: “梅格要是看见这一幕，会说什么呢？”
        - id: ch03-b54
          speaker: narrator
          text: 乔挽着他往外走，一想到回家后该怎样讲这件事，眼睛里就跳起快活的笑意。
    - id: ch04
      title: 茶桌、温室和钢琴
      blocks:
        - id: ch04-b01
          speaker: mr_laurence
          text: “喂！这孩子究竟中了什么邪？”
        - id: ch04-b02
          speaker: narrator
          text: 劳里正飞奔下楼，一抬头，竟看见乔挽着他那位令人敬畏的祖父。他惊得猛然停住了。
        - id: ch04-b03
          speaker: laurie
          text: “我不知道您回来了，先生。”
        - id: ch04-b04
          speaker: narrator
          text: 他刚开口，乔就得意地瞥了他一眼。
        - id: ch04-b05
          speaker: mr_laurence
          text: “听你跑下楼的动静，我就知道你不知道。过来喝茶，先生，规规矩矩做个绅士。”
        - id: ch04-b06
          speaker: narrator
          text: 劳伦斯先生扯了扯男孩的头发，算是爱抚，随后继续往前走。劳里跟在后面，做出一连串滑稽动作，害得乔差一点笑出声。
        - id: ch04-b07
          speaker: narrator
          text: 老先生一连喝了四杯茶，没怎么说话，只管观察两个年轻人。他们很快就像老朋友一样聊起来。孙子身上的变化，一点也没逃过他的眼睛。男孩脸上有了血色，也有了光彩和精神。他举止活泼起来，笑声里全是真正的快乐。
        - id: ch04-b08
          speaker: mr_laurence
          text: “她说得没错，这孩子确实孤单。我要看看，这几个小姑娘能为他做些什么。”
        - id: ch04-b09
          speaker: narrator
          text: 老先生边听边这样想。他很喜欢乔。那古怪又直率的脾气，正对他的胃口。乔还那么懂劳里，简直像她自己也做过男孩子。
        - id: ch04-b10
          speaker: narrator
          text: 要是劳伦斯祖孙真像乔说的那样“古板又乏味”，她一定没法和他们自在相处，因为这种人总会让她害羞又别扭。可她发现祖孙俩都很随和，自己也就放松了，还给他们留下了很好的印象。
        - id: ch04-b11
          speaker: narrator
          text: 大家离开茶桌后，乔说自己该回家了。劳里却说，还有一样东西想给她看。他领她来到温室，那里已经特意为她点亮了灯。
        - id: ch04-b12
          speaker: narrator
          text: 乔沿着小径来回走，两边盛开的花朵像两堵花墙。柔和的灯光照着湿润芬芳的空气，奇异的藤蔓和树木从四周垂下来。这里美得像仙境。
        - id: ch04-b13
          speaker: narrator
          text: 她的新朋友专挑最美的花，直到两只手都拿不下，才把花扎成一束。劳里的脸上带着乔最爱看见的快乐神情。
        - id: ch04-b14
          speaker: laurie
          text: “请把这些花送给你母亲，再告诉她，她送来的药，我很喜欢。”
          emotion: happy
        - id: ch04-b15
          speaker: narrator
          text: 两人回到宽敞的客厅。劳伦斯先生站在炉火前，乔却顾不上看他。她全部的心思，都被一架敞着琴盖的大钢琴吸引了。
        - id: ch04-b16
          speaker: jo
          text: “你会弹琴吗？”
        - id: ch04-b17
          speaker: narrator
          text: 她转向劳里，神情里满是敬意。
        - id: ch04-b18
          speaker: laurie
          text: “偶尔弹一弹。”
        - id: ch04-b19
          speaker: jo
          text: “那现在弹一首吧。我想听听，回家好说给贝丝听。”
        - id: ch04-b20
          speaker: laurie
          text: “你不先弹吗？”
        - id: ch04-b21
          speaker: jo
          text: “我不会。我太笨，学不了，可我特别喜欢音乐。”
        - id: ch04-b22
          speaker: narrator
          text: 于是，劳里弹起来，乔安静地听着，把鼻子惬意地埋在天芥菜和茶香月季里。她对“劳伦斯家的男孩”又添了许多敬重和喜爱，因为他的琴弹得那么好，却一点也不卖弄。
        - id: ch04-b23
          speaker: narrator
          text: 乔多希望贝丝也在这里听，可她没有说，只顾着夸劳里。她夸得他越来越不好意思，直到祖父赶来替他解围。
        - id: ch04-b24
          speaker: mr_laurence
          text: “行了，行了，年轻小姐。糖果吃得太多，对他可没好处。他的音乐还过得去，不过我更希望他在要紧的事情上也能做得这么好。你要走了吗？那好，多谢你来陪他。希望你还会再来。代我问候你母亲。晚安，乔大夫。”
        - id: ch04-b25
          speaker: narrator
          text: 老先生亲切地和乔握手，脸上却像是有什么事不称心。走进门厅后，乔问劳里，自己是不是说错了话。劳里摇摇头。
        - id: ch04-b26
          speaker: laurie
          text: “不是你，是我。他不喜欢听我弹琴。”
        - id: ch04-b27
          speaker: jo
          text: “为什么？”
        - id: ch04-b28
          speaker: laurie
          text: “以后再告诉你。约翰会送你回去，我不能去了。”
        - id: ch04-b29
          speaker: jo
          text: “不用送。我又不是什么年轻小姐，而且只有几步路。你要好好照顾自己，知道吗？”
        - id: ch04-b30
          speaker: laurie
          text: “好。不过你还会来吧？”
        - id: ch04-b31
          speaker: jo
          text: “只要你答应，病好了就去看我们。”
        - id: ch04-b32
          speaker: laurie
          text: “我答应。”
        - id: ch04-b33
          speaker: jo
          text: “晚安，劳里！”
        - id: ch04-b34
          speaker: laurie
          text: “晚安，乔，晚安！”
    - id: ch05
      title: 树篱两边不再陌生
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 乔回家后，把那天下午的冒险从头讲了一遍。全家听完，都恨不得结伴到树篱那边去拜访，因为每个人都在那座大宅里发现了一样特别吸引自己的东西。
        - id: ch05-b02
          speaker: narrator
          text: 马奇太太想和那位仍然记得她父亲的老人谈一谈。梅格盼着在温室里散步。贝丝惦记那架大钢琴。艾米则急着去看那些精美的画和雕像。
        - id: ch05-b03
          speaker: jo
          text: “妈妈，劳伦斯先生为什么不喜欢劳里弹琴？”
        - id: ch05-b04
          speaker: narrator
          text: 乔天生爱追根究底，这个问题怎么也忍不住。
        - id: ch05-b05
          speaker: mrs_march
          text: “我也不敢肯定。不过我想，是因为他的儿子，也就是劳里的父亲，娶了一位意大利女士。她是音乐家，这桩婚事惹恼了那位非常骄傲的老先生。那位女士又善良，又美丽，也很有才华，可他不喜欢她。儿子结婚以后，他也再没有见过儿子。”
        - id: ch05-b06
          speaker: mrs_march
          text: “劳里还小的时候，父母就都去世了，祖父这才把他接回家。我猜，劳里生在意大利，身体又不太强壮，老先生太怕再失去他，所以处处小心。”
        - id: ch05-b07
          speaker: mrs_march
          text: “劳里爱音乐，是生来就有的，因为他像母亲。我敢说，他祖父怕他以后想做音乐家。不管怎样，听见他弹琴，总会让老人想起那个自己不喜欢的女人，所以才会像你说的那样，忽然沉下脸。”
        - id: ch05-b08
          speaker: meg
          text: “哎呀，这多浪漫啊！”
          emotion: surprised
        - id: ch05-b09
          speaker: jo
          text: “这多糊涂啊！他要是想当音乐家，就让他当好了。他明明不想上大学，为什么非逼着他去，把他的日子弄得那么难受？”
        - id: ch05-b10
          speaker: meg
          text: “我猜，他那双漂亮的黑眼睛，还有那么优雅的举止，也是从母亲那里来的。意大利人总是很迷人。”
        - id: ch05-b11
          speaker: narrator
          text: 梅格说得有点多愁善感。乔可一点也不多愁善感，马上嚷了起来。
        - id: ch05-b12
          speaker: jo
          text: “你怎么知道他的眼睛和举止？你几乎没跟他说过话呀。”
        - id: ch05-b13
          speaker: meg
          text: “我在舞会上见过他呀。而且听你刚才讲的事，也知道他很有礼貌。他说你是母亲送去的药，那句话说得真好。”
        - id: ch05-b14
          speaker: jo
          text: “他说的大概是牛奶冻。”
        - id: ch05-b15
          speaker: meg
          text: “你怎么这么迟钝！他说的当然是你。”
        - id: ch05-b16
          speaker: jo
          text: “是吗？”
        - id: ch05-b17
          speaker: narrator
          text: 乔睁大了眼睛，仿佛这个念头以前从没钻进过她的脑袋。
        - id: ch05-b18
          speaker: meg
          text: “我真没见过你这样的姑娘！别人夸你，你居然都听不出来。”
        - id: ch05-b19
          speaker: narrator
          text: 梅格摆出一副很懂这种事的年轻淑女模样。
        - id: ch05-b20
          speaker: jo
          text: “我看恭维全是没用的话。你别犯傻，拿这些废话来败我的兴。劳里是个好男孩，我喜欢他，可你别把事情扯成什么恭维，再编出一套多愁善感的说法。我们都该好好待他，因为他没有母亲。他可以来我们家，对吧，妈妈？”
        - id: ch05-b21
          speaker: mrs_march
          text: “当然可以，乔。你的小朋友什么时候来都欢迎。我也希望梅格记住，只要一个孩子还能做孩子，就该好好做个孩子。”
        - id: ch05-b22
          speaker: amy
          text: “我可没把自己当成孩子，而且我还没到十几岁呢。贝丝，你说是不是？”
        - id: ch05-b23
          speaker: beth
          text: “我正在想我们的《天路历程》呢。”
        - id: ch05-b24
          speaker: narrator
          text: 原来，贝丝刚才一个字也没听进去。
        - id: ch05-b25
          speaker: beth
          text: “我们决定要做好孩子，就走出了绝望潭，又穿过窄门。后来，我们一直努力往前，还爬上了陡峭的山坡。也许对面那座装满美好东西的房子，就是我们以后会到达的华美宫。”
        - id: ch05-b26
          speaker: jo
          text: “那我们得先从狮子身边闯过去。”
        - id: ch05-b27
          speaker: narrator
          text: 听乔的口气，她倒很喜欢这个前景。
