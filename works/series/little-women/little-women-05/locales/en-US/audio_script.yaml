        - id: ch04-b22
          speaker: narrator
          text: At home, Jo told the family every adventure of her afternoon from beginning to end. By the time she finished, they all felt like going over together. Each of them had found something tempting in the great house beyond the hedge. Mrs. March wanted to talk about her father with the old man who still remembered him. Meg longed to walk through the conservatory. Beth sighed for the grand piano, and Amy was eager to see the fine paintings and statues.
        - id: ch04-b23
          speaker: jo
          text: Mother, why does Mr. Laurence dislike Laurie's playing?
