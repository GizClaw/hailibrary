  chapters:
    - id: ch01
      title: An Invitation Across the Hedge
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One snowy afternoon, Jo came stamping through the hall in rubber boots, an old sack, and a hood. She carried a broom in one hand and a shovel in the other.
        - id: ch01-b02
          speaker: meg
          text: Jo, what in the world are you planning now?
        - id: ch01-b03
          speaker: jo
          text: I'm going outside for some exercise.
        - id: ch01-b04
          speaker: narrator
          text: There was a mischievous sparkle in her eyes.
        - id: ch01-b05
          speaker: meg
          text: Weren't two long walks this morning enough? It's cold and gloomy. Stay dry by the fire with me.
        - id: ch01-b06
          speaker: jo
          text: I never take advice. I can't sit still all day, and I'm no cat to doze by the fire. I want an adventure, and I'm going to find one.
        - id: ch01-b07
          speaker: narrator
          text: Meg went back to warming her feet and reading Ivanhoe. Jo attacked the snow. It was light, so she soon swept a path all around the garden. Beth could walk there when the sun returned, and her invalid dolls could get some air.
        - id: ch01-b08
          speaker: narrator
          text: A low hedge divided the March garden from Mr. Laurence's grounds. Both homes stood in a part of the city that still felt like the country, with groves, lawns, broad gardens, and quiet streets. The Marches lived in an old brown house. Without the vines that covered its walls in summer or the flowers that grew around it, the place looked bare and shabby. Beyond the hedge stood a grand stone mansion. Everything about it spoke of comfort and wealth, from the large coach house and carefully kept grounds to the conservatory and the beautiful things showing between rich curtains.
        - id: ch01-b09
          speaker: narrator
          text: But for all its comfort, the grand house felt lonely, lifeless, and still. No children ever ran and played on its lawn. No mother's face smiled from its windows. Almost no one came or went except an old gentleman and his grandson.
        - id: ch01-b10
          speaker: narrator
          text: To Jo, it was an enchanted palace filled with treasures nobody enjoyed. She had wanted for a long time to see inside and to know the Laurence boy. He looked as if he wanted a friend but didn't know how to begin. Since the party, she had dreamed up one plan after another. Then he disappeared, and she wondered if he had gone away.
        - id: ch01-b11
          speaker: narrator
          text: One day she spotted his brown face at an upstairs window. He watched Beth and Amy throwing snowballs in their garden.
        - id: ch01-b12
          speaker: jo
          text: That boy needs company and fun. His grandfather keeps him shut up alone and doesn't know what's good for him. He ought to have some lively young people around. Maybe I'll go tell the old gentleman myself!
        - id: ch01-b13
          speaker: narrator
          text: The thought delighted Jo. She loved daring deeds, especially the strange performances that always shocked Meg. She never forgot her plan to go over. On that snowy afternoon, she decided at last to see what she could do. She watched Mr. Laurence drive away, then set out and dug a path down to the hedge. There she paused to inspect the house. Everything was quiet. The lower curtains were closed, the servants were nowhere in sight, and the only person visible was a curly black head resting on a thin hand at an upstairs window.
        - id: ch01-b14
          speaker: jo
          text: There he is, poor boy. He's sick and alone on such a dreary day. I'll throw a snowball so he looks out, and then I'll say something kind.
        - id: ch01-b15
          speaker: narrator
          text: She tossed up a handful of soft snow. The head turned at once. The tired face came alive, the large eyes brightened, and the mouth smiled. Jo nodded, laughed, waved her broom, and called to him.
        - id: ch01-b16
          speaker: jo
          text: Hello! Are you sick?
        - id: ch01-b17
          speaker: narrator
          text: Laurie opened the window. His voice came out as hoarse as a raven's.
        - id: ch01-b18
          speaker: laurie
          text: I'm better, thanks. I caught a terrible cold, and they've kept me inside for a week.
        - id: ch01-b19
          speaker: jo
          text: I'm sorry. What do you do for fun?
        - id: ch01-b20
          speaker: laurie
          text: Nothing. It's as dull as a tomb up here.
        - id: ch01-b21
          speaker: jo
          text: Don't you read?
        - id: ch01-b22
          speaker: laurie
          text: Not much. They won't allow it.
        - id: ch01-b23
          speaker: jo
          text: Couldn't somebody read to you?
        - id: ch01-b24
          speaker: laurie
          text: Grandpa does sometimes, but he doesn't care for my books. And I hate bothering Mr. Brooke every time.
        - id: ch01-b25
          speaker: jo
          text: Then ask someone to visit.
        - id: ch01-b26
          speaker: laurie
          text: There's no one I want. Boys are so noisy, and my head still hurts.
        - id: ch01-b27
          speaker: jo
          text: Isn't there a nice girl who could read and keep you company? Girls are quiet, and they like nursing people.
        - id: ch01-b28
          speaker: laurie
          text: I don't know any girls.
        - id: ch01-b29
          speaker: jo
          text: You know us—
        - id: ch01-b30
          speaker: narrator
          text: Jo broke off laughing.
        - id: ch01-b31
          speaker: laurie
          text: I do! Would you come over, please?
          emotion: happy
        - id: ch01-b32
          speaker: jo
          text: I'm neither quiet nor especially nice, but I'll come if Mother says yes. I'll ask her now. Be good, close that window, and wait for me.
        - id: ch01-b33
          speaker: narrator
          text: Jo shouldered her broom and marched indoors, wondering what everyone would say. The thought of company put Laurie into a flutter. He flew around his room getting ready. Mrs. March had called him a little gentleman, and he meant to honor his expected guest. He brushed his curly head, put on a fresh collar, and tried to straighten the room. In spite of half a dozen servants, it was anything but neat.
    - id: ch02
      title: Jo Comes Calling
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Soon the bell rang loudly. A firm young voice asked for Mr. Laurie, and a surprised servant hurried upstairs to announce a young lady.
        - id: ch02-b02
          speaker: laurie
          text: That's fine. Please bring her up. It's Miss Jo.
        - id: ch02-b03
          speaker: narrator
          text: Laurie met her at the door of his small parlor. Jo arrived rosy-cheeked and perfectly at ease, carrying a covered dish in one hand and Beth's three kittens in the other.
        - id: ch02-b04
          speaker: jo
          text: Here I am, with all my baggage. Mother sends her love and is glad if I can help. Meg made you some blancmange, and Beth thought her kittens might comfort you. I knew you'd laugh, but she wanted so badly to do something that I had to bring them.
        - id: ch02-b05
          speaker: narrator
          text: Beth's funny gift was exactly right. Laurie laughed over the kittens, forgot to feel shy, and began talking freely.
        - id: ch02-b06
          speaker: laurie
          text: That looks much too pretty to eat.
        - id: ch02-b07
          speaker: narrator
          text: Jo lifted the cover from the dish. The blancmange sat inside a garland of green leaves, with bright scarlet blossoms from Amy's favorite geranium. Laurie smiled with pleasure at the careful decoration.
        - id: ch02-b08
          speaker: jo
          text: It's nothing grand. They all wanted to be kind, that's all. Have the maid save it for tea. It's plain and soft, so it won't hurt your throat. Oh, this room could be so cozy!
        - id: ch02-b09
          speaker: laurie
          text: It could, if anyone kept it properly. The maids are lazy, and I don't know how to make them listen. The mess bothers me.
        - id: ch02-b10
          speaker: jo
          text: Give me two minutes. Sweep the hearth like this, straighten the mantel, put the books here and the bottles there, turn the sofa away from the light, and puff up the pillows. There. Now you're comfortable.
        - id: ch02-b11
          speaker: narrator
          text: He was. While Jo laughed and talked, she whisked every object into its proper place and changed the whole feeling of the room. She brushed the hearth, straightened the mantel, arranged the books and bottles, moved the sofa out of the light, and plumped its pillows. Laurie watched all this in respectful silence. When she finally pointed him toward the sofa, he settled down with a satisfied sigh.
        - id: ch02-b12
          speaker: laurie
          text: That was so kind. Yes, this is just what the room needed. Please take the big chair, and let me entertain my guest now.
        - id: ch02-b13
          speaker: jo
          text: No, I came to entertain you. Want me to read aloud?
        - id: ch02-b14
          speaker: narrator
          text: She glanced fondly at several inviting books.
        - id: ch02-b15
          speaker: laurie
          text: Thanks, but I've read all of those. If you don't mind, I'd rather talk.
        - id: ch02-b16
          speaker: jo
          text: I don't mind at all. Just get me started and I'll talk all day. Beth says I never know when to quit.
        - id: ch02-b17
          speaker: laurie
          text: Is Beth the rosy one? The one who's usually at home, but sometimes carries a little basket outside?
        - id: ch02-b18
          speaker: jo
          text: That's her. Beth's my special girl, and she's truly good.
        - id: ch02-b19
          speaker: laurie
          text: Then Meg is the pretty one, and Amy has the curls. Is that right?
        - id: ch02-b20
          speaker: jo
          text: How did you learn all that?
        - id: ch02-b21
          speaker: narrator
          text: Laurie blushed, but he answered honestly.
        - id: ch02-b22
          speaker: laurie
          text: I hear you calling each other. When I'm alone up here, I can't help looking toward your house. You always seem to have such fun. I'm sorry for spying, but sometimes the curtain by the flowers is open. With the lamps on, I can see the fire and all of you around the table with your mother. Her face looks so sweet behind the flowers that I can't stop watching. I don't have a mother, you know.
          emotion: sad
        - id: ch02-b23
          speaker: narrator
          text: He poked the fire to hide the little tremble in his lips. The lonely hunger in his eyes went straight to Jo's warm heart. She was only fifteen, open and innocent as a child. Laurie was ill and lonely. Jo knew how rich she was in love and home, and she wanted to share that wealth. Her sharp voice grew unusually gentle.
        - id: ch02-b24
          speaker: jo
          text: We'll never close that curtain again. Look whenever you want. Better yet, come visit instead of peeking. Mother is wonderful and would do you a world of good. Beth would sing if I asked, Amy would dance, and Meg and I could make you laugh at our stage things. We'd have a splendid time. Would your grandfather allow it?
        - id: ch02-b25
          speaker: laurie
          text: I think so, if your mother invited me. He's very kind, even if he doesn't look it. He mostly lets me do as I please. He's only worried I'll bother strangers.
        - id: ch02-b26
          speaker: narrator
          text: Laurie looked brighter with every word.
        - id: ch02-b27
          speaker: jo
          text: We're neighbors, not strangers, and you wouldn't bother us. We want to know you. I've been trying to meet you for ages. We haven't lived here long, but you're the only neighbor we still don't know.
        - id: ch02-b28
          speaker: laurie
          text: Grandpa lives among his books and hardly notices what happens outside. Mr. Brooke, my tutor, doesn't live here. I have nobody to go places with, so I stay home and manage as best I can.
        - id: ch02-b29
          speaker: jo
          text: That's no good. You should make yourself visit whenever you're invited. Soon you'll have friends and plenty of pleasant places to go. Don't worry about being shy. The more you go out, the sooner it will pass.
        - id: ch02-b30
          speaker: narrator
          text: Laurie turned red again, but he wasn't offended. Jo's goodwill was so plain that even her bluntest advice felt kindly meant. After a quiet moment, he stared into the fire while Jo looked around, pleased with everything.
        - id: ch02-b31
          speaker: laurie
          text: Do you like your school?
        - id: ch02-b32
          speaker: jo
          text: I don't go to school. I'm a businessma—business girl, I mean. I take care of my great-aunt. She's a dear old soul, but terribly cross.
        - id: ch02-b33
          speaker: narrator
          text: Laurie opened his mouth to ask another question. Just in time, he remembered that a well-mannered person did not make too many inquiries into someone else's affairs. He shut his mouth again and looked uncomfortable. Jo noticed and liked his good manners. She didn't mind laughing about Aunt March, so she gave him a lively picture of the fussy old lady, her fat poodle, the parrot that spoke Spanish, and the library where Jo could happily lose herself among the books.
        - id: ch02-b34
          speaker: narrator
          text: Laurie especially loved the tale of Aunt March's stiff old admirer. Right in the middle of his grand proposal, the parrot Poll had pulled off his wig. Laurie fell back laughing until tears ran down his cheeks, and a maid poked her head into the room to see what had happened.
        - id: ch02-b35
          speaker: laurie
          text: Oh, that makes me feel better than anything! Please, keep going.
          emotion: happy
        - id: ch02-b36
          speaker: narrator
          text: His face came out of the sofa cushion red and shining. Proud of her success, Jo kept right on. She told him about the sisters' plays and plans, their hopes and fears for Father, and all the events that mattered in the small world the four girls shared. At last their talk turned to books. To Jo's delight, Laurie loved books just as much as she did. Better still, he had read even more of them than she had.
        - id: ch02-b37
          speaker: laurie
          text: If you love books that much, come see ours downstairs. Grandpa is out, so there's nothing to be scared of.
        - id: ch02-b38
          speaker: jo
          text: I'm not scared of anything.
        - id: ch02-b39
          speaker: laurie
          text: I believe it!
        - id: ch02-b40
          speaker: narrator
          text: He admired her courage, though privately he thought she might feel differently if she met his grandfather in one of his moods.
    - id: ch03
      title: The Library and the Old Gentleman
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The whole house felt as warm as summer. Laurie led Jo through one room after another, and he let her linger over every object that caught her fancy. At last they reached the library. Jo clapped her hands and danced around, as she always did when she was too delighted to hold still.
        - id: ch03-b02
          speaker: narrator
          text: Books covered the walls from end to end. Paintings and statues stood among them. Fascinating little cabinets held coins and curious objects, and deep Sleepy Hollow chairs waited beside odd tables and bronze figures. Best of all was a huge open fireplace with quaint old tiles all around it. There was so much to see that Jo hardly knew where to look first.
        - id: ch03-b03
          speaker: jo
          text: What riches! Theodore Laurence, you ought to be the happiest boy alive.
        - id: ch03-b04
          speaker: narrator
          text: She sank deep into a velvet chair and gazed around in perfect contentment. Laurie perched on a table across from her and shook his head.
        - id: ch03-b05
          speaker: laurie
          text: A fellow can't live on books.
        - id: ch03-b06
          speaker: narrator
          text: Before he could continue, a bell rang. Jo jumped to her feet.
        - id: ch03-b07
          speaker: jo
          text: Oh, mercy! Your grandfather is home!
          emotion: fearful
        - id: ch03-b08
          speaker: laurie
          text: So what? You're not afraid of anything, remember?
        - id: ch03-b09
          speaker: narrator
          text: A wicked look crossed his face.
        - id: ch03-b10
          speaker: jo
          text: Maybe I'm a little afraid of him, though I don't know why. Marmee gave me permission, and you certainly aren't worse after my visit.
        - id: ch03-b11
          speaker: narrator
          text: Jo tried to look composed, but she kept watching the door.
        - id: ch03-b12
          speaker: laurie
          text: I'm much better, and very grateful. I'm only worried I've worn you out with all this talking. It was so nice that I couldn't make myself stop.
        - id: ch03-b13
          speaker: maid
          text: The doctor is here to see you, sir.
        - id: ch03-b14
          speaker: narrator
          text: The maid motioned to Laurie.
        - id: ch03-b15
          speaker: laurie
          text: Would you mind waiting one minute? I suppose I have to see him.
        - id: ch03-b16
          speaker: jo
          text: Don't worry about me. I'm as happy as a cricket in here.
        - id: ch03-b17
          speaker: narrator
          text: Laurie left. Jo entertained herself by studying a fine portrait of the old gentleman. When the door opened, she spoke without turning around.
        - id: ch03-b18
          speaker: jo
          text: Now I'm sure I wouldn't be afraid of him. His eyes are kind, even if his mouth looks stern. He seems to have a tremendous will. He isn't as handsome as my grandfather, but I like him.
        - id: ch03-b19
          speaker: mr_laurence
          text: Thank you, ma'am.
        - id: ch03-b20
          speaker: narrator
          text: Jo turned and found old Mr. Laurence standing behind her. She blushed until she could turn no redder, and her heart pounded as she remembered every word. For one wild instant she wanted to run. But that would be cowardly, and her sisters would laugh, so she stayed to face the trouble.
        - id: ch03-b21
          speaker: narrator
          text: A second look helped. The living eyes under those bushy brows were even kinder than the painted ones. A sly sparkle in them eased her fear. After a dreadful silence, his gruff voice grew gruffer still.
        - id: ch03-b22
          speaker: mr_laurence
          text: So you aren't afraid of me, eh?
        - id: ch03-b23
          speaker: jo
          text: Not very much, sir.
        - id: ch03-b24
          speaker: mr_laurence
          text: And I'm not quite as handsome as your grandfather?
        - id: ch03-b25
          speaker: jo
          text: No, sir. Not quite.
        - id: ch03-b26
          speaker: mr_laurence
          text: And you say I have a tremendous will?
        - id: ch03-b27
          speaker: jo
          text: I only said it looked that way.
        - id: ch03-b28
          speaker: mr_laurence
          text: Yet you like me anyway?
        - id: ch03-b29
          speaker: jo
          text: Yes, sir, I do.
        - id: ch03-b30
          speaker: narrator
          text: That pleased him. He gave a short laugh and shook her hand. Then he tipped her chin up with one finger, studied her face gravely, and nodded.
        - id: ch03-b31
          speaker: mr_laurence
          text: You have your grandfather's spirit, if not his face. He was a fine man, my dear. Better still, he was brave and honest. I was proud to call him my friend.
        - id: ch03-b32
          speaker: jo
          text: Thank you, sir.
        - id: ch03-b33
          speaker: narrator
          text: After that, Jo felt entirely comfortable. His words suited her perfectly.
        - id: ch03-b34
          speaker: mr_laurence
          text: Now, what have you been doing to my boy?
        - id: ch03-b35
          speaker: jo
          text: I was only trying to be neighborly, sir.
        - id: ch03-b36
          speaker: narrator
          text: Jo explained how the visit had begun.
        - id: ch03-b37
          speaker: mr_laurence
          text: You believe he needs a little cheering up?
        - id: ch03-b38
          speaker: jo
          text: Yes, sir. He seems lonely, and perhaps young people would help. We're only girls, but we'd be glad to try. We haven't forgotten the wonderful Christmas dinner you sent us.
        - id: ch03-b39
          speaker: mr_laurence
          text: Tut, tut! The boy arranged that. How is the poor woman now?
        - id: ch03-b40
          speaker: jo
          text: She's getting along nicely, sir.
        - id: ch03-b41
          speaker: narrator
          text: Jo hurried into the whole story of the Hummels and how her mother had interested wealthier friends in helping them.
        - id: ch03-b42
          speaker: mr_laurence
          text: That's exactly how her father did good. One fine day I'll call on your mother. Tell her I said so. There's the tea bell. Come downstairs and keep being neighborly.
        - id: ch03-b43
          speaker: jo
          text: If you'd really like me to, sir.
        - id: ch03-b44
          speaker: mr_laurence
          text: I wouldn't invite you if I didn't.
        - id: ch03-b45
          speaker: narrator
          text: Mr. Laurence offered his arm with old-fashioned courtesy. Jo wondered what Meg would say when she heard this. Her eyes danced as she imagined telling the story at home.
        - id: ch03-b46
          speaker: mr_laurence
          text: Hey! What in the world has happened to the fellow?
        - id: ch03-b47
          speaker: narrator
          text: Laurie had raced downstairs, then stopped short at the astonishing sight of Jo walking arm in arm with his formidable grandfather.
        - id: ch03-b48
          speaker: laurie
          text: I didn't know you were back, sir.
        - id: ch03-b49
          speaker: narrator
          text: Jo gave him a small, triumphant look.
        - id: ch03-b50
          speaker: mr_laurence
          text: That's clear from the way you thundered down those stairs. Come have tea, sir, and behave like a gentleman.
        - id: ch03-b51
          speaker: narrator
          text: He tugged Laurie's hair by way of a caress and walked on with Jo. Behind their backs, Laurie went through a whole series of ridiculous movements. Jo could see him, but his grandfather could not, and she came very close to exploding with laughter.
        - id: ch03-b52
          speaker: narrator
          text: The old gentleman said little while he drank four cups of tea. Instead, he watched and listened as the young people soon began chatting like longtime friends. The change in his grandson did not escape him. Laurie's face had color, light, and life again. His whole manner was lively, and genuine merriment rang through his laugh.
        - id: ch03-b53
          speaker: mr_laurence
          text: She is right. The boy is lonely. I'll see what these little girls can do for him.
        - id: ch03-b54
          speaker: narrator
          text: Mr. Laurence liked Jo. Her odd, direct manner suited him, and she seemed to understand Laurie almost as well as if she had been a boy herself. Jo could never get along with people she called prim and poky. Around them, she always became shy and awkward. But the Laurences were open and easy with her. That let Jo be her natural self, and she made a good impression.
    - id: ch04
      title: Music, Flowers, and a New Friend
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When tea ended, Jo said she should leave. Laurie insisted on showing her one more thing. He took her into the conservatory, which had been lit especially for her.
        - id: ch04-b02
          speaker: narrator
          text: It seemed like fairyland. Jo walked up and down between blooming walls on either side. She enjoyed the soft light and breathed the warm, damp, sweet air. Wonderful vines and trees hung all around her. Beside her, Laurie cut one fine flower after another until his hands were full. Then he gathered the blossoms together and tied them into a bundle.
        - id: ch04-b03
          speaker: laurie
          text: Please take these to your mother. Tell her I liked the medicine she sent me very much.
          emotion: happy
        - id: ch04-b04
          speaker: narrator
          text: Back in the great drawing room, Mr. Laurence stood before the fire. Jo barely noticed him, because a magnificent open piano had captured all her attention.
        - id: ch04-b05
          speaker: jo
          text: Do you play?
        - id: ch04-b06
          speaker: laurie
          text: Sometimes.
        - id: ch04-b07
          speaker: jo
          text: Please play now. I want to hear you so I can tell Beth.
        - id: ch04-b08
          speaker: laurie
          text: Won't you play first?
        - id: ch04-b09
          speaker: jo
          text: I don't know how. I was too stupid to learn, but I dearly love music.
        - id: ch04-b10
          speaker: narrator
          text: Laurie played while Jo listened with her nose buried happily in heliotrope and tea roses. She liked and respected him more than ever. He played beautifully without showing off. She wished Beth could hear him. Instead, she praised him until he grew embarrassed, and his grandfather stepped in to rescue him.
        - id: ch04-b11
          speaker: mr_laurence
          text: That's enough, young lady. Too many sweets aren't good for him. His music is decent, but I hope he'll do equally well at more important things. Are you leaving? Thank you for coming, and I hope you'll return. Give my respects to your mother. Good night, Doctor Jo.
        - id: ch04-b12
          speaker: narrator
          text: He shook her hand kindly, though something seemed to displease him. In the hall, Jo asked Laurie whether she had said anything wrong. He shook his head.
        - id: ch04-b13
          speaker: laurie
          text: No. It was me. He doesn't like hearing me play.
        - id: ch04-b14
          speaker: jo
          text: Why not?
        - id: ch04-b15
          speaker: laurie
