          speaker: narrator
          text: Jo always wanted an answer to everything.
        - id: ch04-b25
          speaker: marmee
          text: I don't know for certain. Laurie's father married an Italian musician, and I think his proud father disapproved. She was lovely, good, and accomplished, but Mr. Laurence didn't like her. He never saw his son again after the marriage. Both parents died when Laurie was small, and then his grandfather brought him home. Laurie was born in Italy and may not be very strong. His grandfather fears losing him, which may explain why he watches him so closely. Laurie inherited his mother's love of music. Perhaps Mr. Laurence worries he'll want to become a musician. At the very least, the boy's talent reminds him of the woman he disliked. That may be why he glowered, as you put it.
