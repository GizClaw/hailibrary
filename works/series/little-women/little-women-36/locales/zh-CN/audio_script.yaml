audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着克制的幽默
        timbre: 清澈柔和
        pace: 从容舒展
        pitch: 中音
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情感来得快而真
        timbre: 明亮有力
        pace: 稍快
        pitch: 中音
    laurie:
      display_name: 劳里
      tts:
        delivery: 热情风趣，带着亲昵的少年意气
        timbre: 清朗温暖
        pace: 稍快
        pitch: 中音
    mr_laurence:
      display_name: 劳伦斯先生
      tts:
        delivery: 严肃直接，善意藏在简短的话里
        timbre: 低沉浑厚
        pace: 从容
        pitch: 低音
    mrs_march:
      display_name: 马奇太太
      tts:
        delivery: 慈爱爽朗，沉稳中带着鼓励
        timbre: 饱满温暖
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第三十五章　心痛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 不管劳里先前抱着什么心思，这一年他总算真正用功了。他以优异成绩毕业，还发表了拉丁文演说。朋友们都说，他既有菲利普斯的风度，也有狄摩西尼的雄辩。祖父骄傲得不得了，马奇夫妇、约翰、梅格、乔和贝思也全在场，人人都真心为他欢喜。年轻人当时往往不把这种赞赏当回事，可往后无论赢得多少成就，也很难再从世人那里得到同样真挚的赞美。
        - id: ch01-b02
          speaker: narrator
          text: 一天的欢庆结束了。劳里把姐妹们送上马车，临别还惦记着第二天的老习惯。
        - id: ch01-b03
          speaker: laurie
          text: 我还得留下吃那顿讨厌的晚宴，不过明天一早就回去。姑娘们，你们还会照常来接我吧？
        - id: ch01-b04
          speaker: narrator
          text: 他说的是“姑娘们”，心里想的却只有乔，因为只有她一直守着这个习惯。面对眼前这个光彩照人、功成名就的大男孩，乔实在不忍心拒绝。
        - id: ch01-b05
          speaker: jo
          text: 我当然来，泰迪，刮风下雨都拦不住。我还要走在你前头，用口簧琴吹《看，凯旋的英雄归来》。
        - id: ch01-b06
          speaker: narrator
          text: 劳里没有多说，只用眼神谢她。乔一看见那个眼神，心里顿时慌了。她知道他一定会开口，到时候自己可怎么办？晚上静心想过，第二天早晨又忙了一阵，她才稍稍镇定。自己早已给过他足够多的理由，让他知道会得到什么答案。既然这样，若还自负地认定人家一定会来求婚，那也太可笑了。到了约定的时辰，她还是出了门，只求泰迪别做出什么事，逼她伤害他那颗可怜的心。
        - id: ch01-b07
          speaker: narrator
          text: 她先去梅格家坐了坐，又闻闻、亲亲黛西和德米约翰，这才攒够勇气去赴那场两个人的会面。可远远看见一个高大结实的身影，她还是很想转身逃走。
        - id: ch01-b08
          speaker: laurie
          text: 乔，你的口簧琴呢？
        - id: ch01-b09
          speaker: jo
          text: 我忘了。
        - id: ch01-b10
          speaker: narrator
          text: 乔听完反倒松了口气，这句招呼可不像情人说的话。以往见面，她总会挽住劳里的胳膊，这次却没有。劳里也没抱怨，这反而不妙。他一路飞快地谈着不相干的事。两人离开大路，拐上穿林回家的小径，他的脚步渐渐慢了，滔滔不绝的话也忽然断掉。沉默一次次落下来，乔只好赶紧把谈话捞起来。
        - id: ch01-b11
          speaker: jo
          text: 现在你总该好好放一个长假了吧！
        - id: ch01-b12
          speaker: laurie
          text: 我正有这个打算。
        - id: ch01-b13
          speaker: narrator
          text: 那口气坚决得叫乔猛然抬头。劳里正望着她，脸上的神情清清楚楚地告诉她，那个可怕的时刻来了。乔伸出一只手拦他。
        - id: ch01-b14
          speaker: jo
          text: 不，泰迪，求你别说。
        - id: ch01-b15
          speaker: laurie
          text: 我非说不可，你也得听完。躲是没有用的，乔。我们必须把这件事说清楚，越早越好。
        - id: ch01-b16
          speaker: narrator
          text: 他一下涨红了脸，整个人都激动起来。乔知道逃不过，只能拿出近乎绝望的耐心。
        - id: ch01-b17
          speaker: jo
          text: 好吧，你想说什么就说，我听着。
        - id: ch01-b18
          speaker: narrator
          text: 劳里还是个年轻的情人，却爱得十分认真。他已经打定主意，哪怕这场谈话要了他的命，也得把事情彻底说清。他带着一贯的冲劲，一头扎进正题。为了不露怯，他竭力像个男子汉那样稳住声音，可说着说着，喉咙还是不听话地哽住。
        - id: ch01-b19
          speaker: laurie
          text: 乔，从认识你开始，我就一直爱你。你对我那么好，我根本控制不了。我想让你明白，可你从不给我机会。今天你一定得听我说完，也一定得给我答案。我不能再这样熬下去了。
        - id: ch01-b20
          speaker: jo
          text: 我本来不想让你受这份苦。我还以为你早就明白了……
        - id: ch01-b21
          speaker: narrator
          text: 乔这才发现，真正面对劳里时，开口比她料想的难得多，连预备好的话也变得沉重起来。
        - id: ch01-b22
          speaker: laurie
          text: 我知道你是好意，可谁猜得透姑娘们的话？她们明明愿意，偏偏说不，还拿这件事把一个男人逼疯，只因为觉得好玩。
        - id: ch01-b23
          speaker: jo
          text: 我才不会那样。我从没想过要你这么爱我。为了拦住你，只要还有一点希望，我连家都离开了。
        - id: ch01-b24
          speaker: laurie
          text: 我猜到了，这的确是你会做的事，可一点用也没有。我反而更爱你。我拼命用功，只想让你高兴。你讨厌的台球和别的东西，我全戒了。我一直等，也从不抱怨，因为我盼着你有一天会爱我。虽然我连你的半点好都配不上……
        - id: ch01-b25
          speaker: narrator
          text: 这一次，劳里再也压不住哽咽。他一边掐掉毛茛花的脑袋，一边清理自己那副“讨厌的嗓子”。
        - id: ch01-b26
          speaker: jo
          text: 不，你配得上。你比我好得太多。我感激你，为你骄傲，也真心喜欢你。可我就是不能照你希望的那样爱你，连我自己也不知道为什么。我努力试过，感情还是变不了。明明不爱，却告诉你我爱，那就是撒谎。
        - id: ch01-b27
          speaker: laurie
          text: 你说的当真吗，乔？真是这样？
          emotion: sad
        - id: ch01-b28
          speaker: narrator
          text: 他猛地停住，一把握住乔的双手。问这句话时，他看她的眼神，乔很久以后也忘不了。
        - id: ch01-b29
          speaker: jo
          text: 当真，亲爱的，真的是这样。
          emotion: sad
        - id: ch01-b30
          speaker: narrator
          text: 两人已经来到林中的栅栏门边。乔勉强说完最后几个字，劳里放开她的手，转身像是还要往前走。可平生第一次，那道栅栏成了他跨不过去的东西。他把头伏在长满苔藓的木柱上，一动也不动，乔吓坏了。
        - id: ch01-b31
          speaker: jo
          text: 泰迪，对不起，我难过得要命！要是死了能有一点用，我真恨不得杀了自己。求你别这么痛苦，我也没有办法。一个人不爱另一个人，怎么可能逼着自己爱上他呢？
          emotion: sad
        - id: ch01-b32
          speaker: narrator
          text: 乔说得不算漂亮，心里的懊悔却是真的。她轻轻拍着劳里的肩，想起很久以前，他也曾这样安慰她。木柱那边传来含混的声音。
        - id: ch01-b33
          speaker: laurie
          text: 有时候，人是能逼自己的。
        - id: ch01-b34
          speaker: jo
          text: 那不是真正的爱，我也不愿意拿它来试。
        - id: ch01-b35
          speaker: narrator
          text: 两人沉默了很久。河边柳树上，乌鸫还在快活地唱，高草被风吹得沙沙作响，仿佛完全不知道这两个人有多难受。过了一会儿，乔坐到栅栏门的台阶上，神情十分郑重。她说自己有件事要告诉劳里。话音刚落，劳里就像挨了一枪似的浑身一震，猛然抬起头。
        - id: ch01-b36
          speaker: laurie
          text: 别告诉我那件事，乔！我现在受不了！
          emotion: fearful
        - id: ch01-b37
          speaker: jo
          text: 你以为我要说什么？
        - id: ch01-b38
          speaker: laurie
          text: 你爱上了那个老头子。
        - id: ch01-b39
          speaker: jo
          text: 哪个老头子？
        - id: ch01-b40
          speaker: narrator
          text: 乔以为他说的是劳里的祖父。劳里却攥紧拳头，眼里冒着怒火。
        - id: ch01-b41
          speaker: laurie
          text: 就是你信里老提到的那个该死的教授。你要说自己爱他，我一定会做出不要命的事！
          emotion: angry
        - id: ch01-b42
          speaker: jo
          text: 别骂人，泰迪！他不老，也不坏。他善良又仁厚，是我除了你以外最好的朋友。你别发火。我本来想温和地跟你说，可你再诋毁我的教授，我也会生气。我从没想过爱他，也没想过爱上别人。
          emotion: angry
        - id: ch01-b43
          speaker: laurie
          text: 可你以后会爱上别人。那我怎么办？
        - id: ch01-b44
          speaker: jo
          text: 你也会像个懂事的男孩那样爱上别人，然后把今天的烦恼忘掉。
        - id: ch01-b45
          speaker: laurie
          text: 我不可能爱别人，也永远不会忘记你。乔，永远！永远！
          emotion: angry
        - id: ch01-b46
          speaker: narrator
          text: 他重重跺了一脚。乔叹着气，不知道该拿他怎么办。她原想讲的道理，他一句也没听进去。
        - id: ch01-b47
          speaker: jo
          text: 你先坐下来，听我把话说完。我是真想把事情做对，也真想让你幸福。
        - id: ch01-b48
          speaker: narrator
          text: 劳里从这句话里听出一线希望，立刻倒在乔脚边的草地上，把一条胳膊搭上栅栏最下面的台阶，满眼期待地仰望她。这样的姿势叫乔怎么冷静地说话，又怎么清楚地思考？那双眼睛里全是爱和渴望，睫毛上还沾着一两滴苦涩的泪，仿佛都是她那颗硬心肠挤出来的。乔面对自己的男孩，实在不忍心说出无情的话，只好轻轻把他的头转开，抚摸那头特意为她留长的卷发。这个小小的心意真叫人难受。
        - id: ch01-b49
          speaker: jo
          text: 妈妈说得对，我们并不相配。我们的脾气都急，意志也都太强。要是糊涂到真的……
        - id: ch01-b50
          speaker: laurie
          text: 结婚？我们才不会不幸福！只要你爱我，我就能变成十全十美的圣人。你希望我是什么样，我就会变成什么样。
        - id: ch01-b51
          speaker: jo
          text: 不，我做不到。我试过，也失败了。我不能拿我们两个人的幸福去做这么危险的试验。我们合不来，以后也不会合得来。一辈子做好朋友就够了，别去做莽撞的事。
        - id: ch01-b52
          speaker: laurie
          text: 只要有机会，我们偏要做。
        - id: ch01-b53
          speaker: jo
          text: 你就不能讲点道理，好好想想这件事吗？
        - id: ch01-b54
          speaker: laurie
          text: 我不要讲道理，也不要你说的那种好好想想。那根本帮不了我，只会让我更难受。我看你压根没有心。
          emotion: angry
        - id: ch01-b55
          speaker: jo
          text: 我真希望自己没有。
          emotion: sad
        - id: ch01-b56
          speaker: narrator
          text: 乔的声音轻轻一颤。劳里听见了，立刻把这丝颤抖当成好兆头。他马上转过身，把自己最会哄人的本领全使了出来。那甜言蜜语的语气，他从前从没用得这样危险过。
        - id: ch01-b57
          speaker: laurie
          text: 亲爱的，别让我们失望。大家都盼着我们在一起。祖父一心想要这门婚事，你家里人也赞成。我没有你根本过不下去。答应我吧，我们会幸福的。答应吧，求你了！
        - id: ch01-b58
          speaker: narrator
          text: 过了几个月，乔还是不明白，那一刻自己哪来的意志，竟能守住早已做好的决定。她知道自己不爱这个男孩，以后也不可能爱他。坚持下去十分痛苦，可拖延既没有用，也太残忍。
        - id: ch01-b59
          speaker: jo
          text: 我不能真心答应，所以一个“愿意”也不会说。以后你会知道我做得对，还会感谢我……
        - id: ch01-b60
          speaker: laurie
          text: 我要是会感谢你，就让我下地狱！
          emotion: angry
        - id: ch01-b61
          speaker: narrator
          text: 劳里气得从草地上跳了起来。乔还是没有退让。
        - id: ch01-b62
          speaker: jo
          text: 你会感谢我的。等这阵痛苦过去，你会遇见一个可爱又有才华的姑娘。她会崇拜你，也能把你那所漂亮房子照料得很好。我不行。我相貌普通，动作笨拙，性子古怪，年纪也大。你会为我难堪，我们还会不停吵架。你看，现在就已经在吵了。我讨厌上流社会的应酬，你却喜欢。你会恨我总在写东西，可我离不开写作。我们一定会过得不幸，后悔结婚，把所有事情都弄得糟透。
        - id: ch01-b63
          speaker: laurie
          text: 还有别的吗？
        - id: ch01-b64
          speaker: jo
          text: 只有一件。我想自己永远不会结婚。现在这样我很快活，也太珍惜自由，不会急着为了任何男人放弃它。
        - id: ch01-b65
          speaker: laurie
          text: 我比你更清楚。现在你是这么想，可迟早会有一个人让你爱得不得了，你会愿意为他生、为他死。我知道你就是这样的人，而我只能站在旁边看着。
          emotion: sad
        - id: ch01-b66
          speaker: narrator
          text: 绝望的情人把帽子摔到地上。他的动作本来有点滑稽，可那张脸实在太悲惨，叫人一点也笑不出来。乔终于对可怜的泰迪失去了耐心。
        - id: ch01-b67
          speaker: jo
          text: 好啊！要是真有那么一个人，让我不由自主地爱上他，我当然会为他生、为他死。到时候你只能尽力忍受。我已经尽力对你好，可你就是不肯讲道理，一直逼我要我给不了的东西，这太自私了。我会永远喜欢你，非常非常喜欢，但只把你当朋友。我绝不会嫁给你。你越早相信，对我们两个越好！
          emotion: angry
        - id: ch01-b68
          speaker: narrator
          text: 这番话像一把火点着了火药。劳里盯着乔看了一会儿，仿佛不知道该怎么安放自己，随后猛地转开。
        - id: ch01-b69
          speaker: laurie
          text: 总有一天，你会后悔的，乔。
          emotion: sad
        - id: ch01-b70
          speaker: jo
          text: 你要去哪儿？
          emotion: fearful
        - id: ch01-b71
          speaker: laurie
          text: 下地狱！
          emotion: angry
        - id: ch01-b72
          speaker: narrator
          text: 劳里纵身下了河岸。那一瞬间，乔的心几乎停住。可是，一个年轻人得经历许多愚行、罪过或苦难，才会被逼到暴烈地结束生命。劳里也不是那种一次失败就能击垮的软弱之人。他没想戏剧性地投进河里，只是一股盲目的冲动叫他把帽子和外套扔进小船，拼命划走。他逆流而上的速度，比参加任何比赛时都快。乔松开紧握的双手，长长吐出一口气，看着那个可怜人拼命想跑得比心里的痛苦更快。
        - id: ch01-b73
          speaker: jo
          text: 这样对他有好处。回家以后，他会又温柔又后悔，弄得我反而不敢见他。现在得去找劳伦斯先生，请他好好照顾我可怜的男孩。我真希望他会爱上贝思，也许以后能，可我开始觉得自己看错了。天哪，姑娘们怎么会喜欢有人爱慕自己，又狠心拒绝他？这实在太可怕了。
        - id: ch01-b74
          speaker: narrator
          text: 乔慢慢往家走，觉得自己像杀死了一个无辜的小生灵，还把它埋在落叶下面。她认定没人能比自己处理得更好，便直接去见劳伦斯先生，勇敢地把难以启齿的经过从头讲完，接着彻底垮下来。她哭得凄惨，责怪自己怎么会如此无情。善良的老人虽失望透顶，却一句也没责备。世上竟会有姑娘忍心不爱劳里，他实在想不明白，也暗暗希望乔有一天会改变主意。可他比乔更懂得感情不能强求，只能悲伤地摇头。他决定把自己的男孩带离眼前的危险，因为那个冲动的年轻人临走前说的话，比老人肯承认的更叫他担心。
        - id: ch01-b75
          speaker: narrator
          text: 劳里回家时累得精疲力尽，人却已经平静了。祖父迎接他时装作什么都不知道，头一两个钟头还把这场假戏演得很成功。到了黄昏，两人照旧坐在一起。这原是他们从前最喜欢的时刻，如今老人却很难再像往常那样随意闲谈。年轻人更听不下去那些对他一年成绩的夸奖，因为如今看来，这些努力全成了为爱情白费的苦功。他尽力忍耐，直到再也撑不住，才走到钢琴前弹了起来。窗户开着，乔正和贝思在花园散步。这一次，乔比妹妹更懂琴声。劳里弹的是《悲怆奏鸣曲》，而且从来没有弹得这样痛苦。
        - id: ch01-b76
          speaker: mr_laurence
          text: 我想，这曲子弹得很不错，可也太悲伤了，听得人想哭。孩子，换一首快活点的吧。
        - id: ch01-b77
          speaker: narrator
          text: 老人那颗善良的心里满是同情，很想让孙子知道，却又不懂该怎样表示。劳里听了他的话，猛然换上一支轻快曲子，暴风雨似的弹了好几分钟。他原本还能咬紧牙关，勇敢地把这支曲子弹完。偏偏音乐短暂停下时，隔壁传来了马奇太太的声音。
        - id: ch01-b78
          speaker: mrs_march
          text: 乔，亲爱的，进来吧，我找你有事。
        - id: ch01-b79
          speaker: narrator
          text: 这正是劳里最想说的一句话，只是意思完全不同。他听着听着，手指忽然迷了路。琴声断在一个破碎的和弦上，弹琴的人沉默地坐在黑暗里。劳伦斯先生终于忍不下去。他摸索到钢琴旁，两只手轻轻放在那双宽阔的肩上，声音温柔得像一位母亲。
        - id: ch01-b80
          speaker: mr_laurence
          text: 我知道，孩子，我都知道。
          emotion: sad
        - id: ch01-b81
          speaker: narrator
          text: 劳里沉默片刻，突然厉声问是谁告诉了他。
        - id: ch01-b82
          speaker: mr_laurence
          text: 是乔亲口告诉我的。
        - id: ch01-b83
          speaker: laurie
          text: 那就全完了！
          emotion: angry
        - id: ch01-b84
          speaker: narrator
          text: 他不耐烦地甩开祖父的手。他感激老人同情自己，可男子的自尊受不了另一个男人的怜悯。
        - id: ch01-b85
          speaker: mr_laurence
          text: 还没完全结束。我只再说一件事，说完就不提了。你现在大概不愿意待在家里吧？
        - id: ch01-b86
          speaker: laurie
          text: 我不会因为一个姑娘逃走。乔拦不住我见她。只要我愿意，我就留在这里见她。
        - id: ch01-b87
          speaker: mr_laurence
          text: 如果你真是我心目中的绅士，就不会这么做。我也失望，可那姑娘没有办法。你如今只有一个选择，暂时离开。你想去哪儿？
        - id: ch01-b88
          speaker: laurie
          text: 去哪儿都行。我根本不在乎自己会变成什么样。
        - id: ch01-b89
          speaker: narrator
          text: 劳里站起身，放肆地笑了一声，那笑声刺痛了祖父的耳朵。
        - id: ch01-b90
          speaker: mr_laurence
          text: 像个男子汉一样撑过去。看在上帝的分上，千万别做傻事。照原计划出国不好吗？出去走走，把这件事忘掉。
        - id: ch01-b91
          speaker: laurie
          text: 我忘不掉。
        - id: ch01-b92
          speaker: mr_laurence
          text: 可你一直盼着出国，我也答应等你毕业就让你走。
        - id: ch01-b93
          speaker: laurie
          text: 可我原本没想一个人去！
          emotion: sad
        - id: ch01-b94
          speaker: narrator
          text: 劳里急促地在房里来回走。幸好祖父没有看见他脸上的神情。
        - id: ch01-b95
          speaker: mr_laurence
          text: 我也没让你独自去。有个人已经准备好了，不管你走到天涯海角，他都愿意陪着你。
        - id: ch01-b96
          speaker: laurie
          text: 是谁，先生？
        - id: ch01-b97
          speaker: mr_laurence
          text: 陪你去的人是我。
        - id: ch01-b98
          speaker: narrator
          text: 劳里立刻走回来，向祖父伸出手，嗓音已经沙哑。
        - id: ch01-b99
          speaker: laurie
          text: 我真是个自私的畜生。可是……您明白的……祖父……
          emotion: sad
        - id: ch01-b100
          speaker: mr_laurence
          text: 愿上帝帮帮我。是的，我明白。年轻时，我自己经历过一次，后来又陪你父亲经历了一次。好了，亲爱的孩子，安静坐下听听我的计划。一切都安排妥当，马上就能动身。
        - id: ch01-b101
          speaker: narrator
          text: 老人一直握住他的手，仿佛怕他也像当年的父亲一样挣脱出去。劳里坐了下来，脸上和声音里都没有兴趣。
        - id: ch01-b102
          speaker: laurie
          text: 好吧，先生，是什么计划？
        - id: ch01-b103
          speaker: mr_laurence
          text: 伦敦有些事务要处理。本来我想交给你，现在还是亲自去更合适。这里有布鲁克照管，不会出乱子。我的合伙人早已包办了大部分事情，我不过守着产业，等你来接手，所以随时都能走。
        - id: ch01-b104
          speaker: laurie
          text: 可您讨厌旅行。您这个年纪，我不能要求您陪我去。
        - id: ch01-b105
          speaker: narrator
          text: 劳里感激祖父作出的牺牲，可真要走，他还是宁愿独自上路。老人完全明白，也正因为这样，才一定要拦住他。孙子此刻的心境太危险，不能放任他一个人。想到要离开舒适的家，老人自然舍不得，却把遗憾咽了回去。
        - id: ch01-b106
          speaker: mr_laurence
          text: 上帝保佑你，我还没老得不中用。我一想到旅行，倒觉得挺高兴。出门对我有好处，也不会折腾这把老骨头。如今坐车赶路，差不多和坐扶手椅一样舒服。
        - id: ch01-b107
          speaker: narrator
          text: 劳里不安地动了动，也不知是椅子坐得不舒服，还是不喜欢这个计划。老人连忙又解释。
        - id: ch01-b108
          speaker: mr_laurence
          text: 我不是去坏你的兴，也不想当累赘。我跟着去，是觉得你不会因为把我留在家里而更快活。我不会寸步不离地跟着你。你想去哪儿就去哪儿，我自己找乐子。伦敦和巴黎都有老朋友，我正好拜访他们。你可以去意大利、德国或瑞士，看画，听音乐，赏风景，碰上多少冒险都随你高兴。
        - id: ch01-b109
          speaker: narrator
          text: 那时的劳里觉得心已经彻底碎了，整个世界都是一片号哭的荒野。可老人有意放进最后那句话里的几个词，竟让破碎的心意外跳了一下，荒野里也冒出一两块碧绿的绿洲。他叹了口气，仍旧装得有气无力。
        - id: ch01-b110
          speaker: laurie
          text: 随您的便吧，先生。去哪里，做什么，对我都没有区别。
        - id: ch01-b111
          speaker: mr_laurence
          text: 对我有区别，孩子，别忘了。我给你全部自由，也相信你不会滥用它。答应我，劳里。
        - id: ch01-b112
          speaker: laurie
          text: 您要我答应什么都行，先生。
        - id: ch01-b113
          speaker: narrator
          text: 老人听见这句回答，心里总算松了一点。他知道劳里现在什么也不在乎，可总有一天，这个承诺会拦住他，不让他惹出乱子。若连这一点也料错，那他可真是看错了自己的孙子。
        - id: ch01-b114
          speaker: narrator
          text: 劳伦斯先生做事麻利，懂得趁热打铁。那个自认“饱受摧残的人”还没恢复足够的精神来反抗，两人便真的动身了。准备启程的日子里，劳里就像所有遇到这种事的年轻绅士一样，一会儿阴沉，一会儿暴躁，一会儿又独自沉思。他吃不下饭，不再讲究衣着，还把许多时间都花在钢琴上，弹出一场又一场暴风雨。他躲着乔，却又忍不住从窗口悲惨地望她，把这当作一点安慰。那张脸夜里闯进乔的梦，白天又让她背着沉重的愧疚。
        - id: ch01-b115
          speaker: narrator
          text: 有些失意的人逢人便诉说自己的痛苦，劳里却完全不同。他从不谈那份没有回应的爱情，也不准任何人安慰或同情，连马奇太太也不行。从某一方面说，这倒让朋友们少了些为难，可临行前的几个星期仍旧很不好过。人人都庆幸这个可怜的好孩子终于要出门忘掉烦恼，还认定他回来时一定会重新快活。劳里听见这些话，只会阴郁地笑笑，带着一个自认看透一切的人的悲哀和优越，不屑戳破他们的幻想。在他看来，自己的忠贞和爱情一样，永远不会改变。
        - id: ch01-b116
          speaker: narrator
          text: 告别那天，劳里故意装得兴高采烈，好遮住那些很不合时宜、偏要冒出来的感情。谁也没被他骗过，可为了照顾他，大家都努力装作相信。他原本应付得不错，直到马奇太太吻了他，又在耳边低声说了句满含母亲关切的话。他顿时觉得自己快要失控，只得匆匆抱过每一个人，连同样悲伤的汉娜也没漏掉，随后像逃命一样冲下楼梯。
        - id: ch01-b117
          speaker: narrator
          text: 过了一会儿，乔也跟了出来。她不打算再说什么，只想等他回头时挥挥手。劳里真的回头了，而且一看见乔，便立刻走了回来。乔站在比他高一级的台阶上，他伸出双臂抱住她，再抬头望着她。那张脸替他道尽了说不出口的话，让短短一句恳求也充满了哀伤。
        - id: ch01-b118
          speaker: laurie
          text: 乔，你真的不能吗？
          emotion: sad
        - id: ch01-b119
          speaker: jo
          text: 亲爱的泰迪，我真希望自己能够。
          emotion: sad
        - id: ch01-b120
          speaker: narrator
          text: 这就是全部了。两人只停了一小会儿，再没有别的话。劳里随即挺直身体，说没事了，叫乔别放在心上，随后一言不发地走了。可事情根本没有过去，乔也不可能不放在心上。给出那个无情的答案以后，劳里卷发的脑袋曾在她臂弯里靠了片刻。那一刻，她觉得自己亲手拿刀刺伤了最亲爱的朋友。等他终于离开，连一次也没有回头，乔便明白了。此刻从她身边走掉的不只是伤心的朋友，那个曾经陪伴她的男孩劳里，也永远不会再回来了。
