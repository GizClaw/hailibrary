  chapters:
    - id: ch01
      title: Heartache
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Whatever had driven him to it, Laurie had studied hard that year. He graduated with honors and delivered the Latin address with splendid grace and eloquence, or so his friends declared. They were all there to celebrate him. His grandfather could hardly contain his pride. Mr. and Mrs. March, John and Meg, Jo and Beth all rejoiced over him with the wholehearted admiration a boy may shrug off at the time, yet never win again from the world, no matter how great his later triumphs.
        - id: ch01-b02
          speaker: laurie
          text: I have to stay for this wretched supper, but I'll be home early tomorrow. You'll come meet me the way you always do, won't you, girls?
        - id: ch01-b03
          speaker: narrator
          text: Laurie said "girls" as he helped the sisters into their carriage, but he meant Jo. She alone still kept their old custom. After such a splendid day, she couldn't refuse her successful boy anything.
        - id: ch01-b04
          speaker: jo
          text: I'll be there, Teddy, rain or shine. I'll march ahead of you playing "Hail the Conquering Hero" on a Jew's harp.
        - id: ch01-b05
          speaker: narrator
          text: Laurie answered with a look. In a flash, Jo thought, "Oh, dear. He's going to say something. What will I do?" Evening reflection and a morning of work quieted her fears a little. She decided it would be vain to expect a proposal when she had given him every reason to know her answer. At the appointed hour, she set out, hoping Teddy would do nothing that forced her to hurt him.
        - id: ch01-b06
          speaker: narrator
          text: She stopped at Meg's first and took comfort from a sniff and a sip with Daisy and Demi. That strengthened her for the walk alone with Laurie. But when his tall figure appeared in the distance, she nearly turned and ran.
        - id: ch01-b07
          speaker: laurie
          text: Where's the Jew's harp, Jo?
        - id: ch01-b08
          speaker: jo
          text: I forgot it.
        - id: ch01-b09
          speaker: narrator
          text: Jo took courage. That greeting didn't sound much like a lover. On other homecomings she had always taken his arm. This time she didn't, and he never complained. That was a bad sign. Instead, he talked quickly about one distant subject after another until they left the road for the narrow path through the grove. Then his steps slowed. His easy stream of words dried up, and dreadful silences kept opening between them. Jo hurried to fill one.
        - id: ch01-b10
          speaker: jo
          text: Now you can have a good, long vacation.
        - id: ch01-b11
          speaker: laurie
          text: That's exactly what I mean to do.
        - id: ch01-b12
          speaker: narrator
          text: The determination in his voice made Jo look up. The expression on his face told her the moment she dreaded had arrived. She held out a pleading hand.
        - id: ch01-b13
          speaker: jo
          text: No, Teddy. Please don't.
        - id: ch01-b14
          speaker: laurie
          text: I will, and you have to hear me. We can't avoid this anymore, Jo. We need to settle it, and the sooner we do, the better it will be for both of us.
        - id: ch01-b15
          speaker: narrator
          text: His face flushed, and all at once he was trembling with excitement.
        - id: ch01-b16
          speaker: jo
          text: Then say whatever you need to say. I'll listen.
        - id: ch01-b17
          speaker: narrator
          text: Laurie was young, but his love was earnest. He meant to say everything, even if the attempt finished him. He rushed straight in, though now and then his voice caught despite every effort to steady it.
        - id: ch01-b18
          speaker: laurie
          text: I've loved you from the time I first knew you, Jo. I couldn't help it. You've always been so good to me. I tried to show you how I felt, but you wouldn't let me. Now you must listen and give me an answer, because I can't keep living like this.
        - id: ch01-b19
          speaker: jo
          text: I was trying to spare you this. I hoped you understood.
        - id: ch01-b20
          speaker: narrator
          text: Saying it was much harder than Jo had expected.
        - id: ch01-b21
          speaker: laurie
          text: I know what you were doing. But girls are so strange that a fellow can never tell what they mean. They say no when they mean yes and drive him out of his mind just for amusement.
        - id: ch01-b22
          speaker: jo
          text: I don't do that. I never meant to make you care for me this way. I even went away because I hoped it would stop you, if anything could.
        - id: ch01-b23
          speaker: laurie
          text: I thought that was why you went. It was just like you, but it didn't work. I loved you more than ever. I studied hard to please you. I gave up billiards and everything else you disliked. I waited without complaining because I hoped someday you'd love me, though I'm not nearly good enough for you.
        - id: ch01-b24
          speaker: narrator
          text: His voice broke at last. While he mastered his "confounded throat," he knocked the heads off the buttercups beside the path.
        - id: ch01-b25
          speaker: jo
          text: You are good enough. You're far too good for me. I'm grateful to you, and proud of you, and very fond of you. I don't know why I can't love you the way you want, but I can't. I've tried. I can't change what I feel, and saying I loved you when I don't would be a lie.
        - id: ch01-b26
          speaker: laurie
          text: Do you truly mean that, Jo?
        - id: ch01-b27
          speaker: narrator
          text: He stopped and caught both her hands. The look he gave her stayed in her memory for a long time.
        - id: ch01-b28
          speaker: jo
          text: I truly do, dear.
          emotion: sad
        - id: ch01-b29
          speaker: narrator
          text: They had reached the stile in the grove. When Jo reluctantly spoke those last words, Laurie released her hands and turned as if to walk on. But for once in his life, the fence was too much for him. He lowered his head onto the mossy post and stood perfectly still. Jo grew frightened.
        - id: ch01-b30
          speaker: jo
          text: Oh, Teddy, I'm so terribly sorry. I'd do anything if it could help. Please don't take it this hard. I can't change it. People can't force themselves to love someone when they don't.
          emotion: sad
        - id: ch01-b31
          speaker: narrator
          text: She spoke awkwardly but with deep remorse, gently patting his shoulder as she remembered how he had comforted her long ago.
        - id: ch01-b32
          speaker: laurie
          text: Sometimes they can.
          emotion: sad
        - id: ch01-b33
          speaker: jo
          text: Then it isn't the right kind of love. I would rather not try.
        - id: ch01-b34
          speaker: narrator
          text: A long silence followed. A blackbird sang brightly in the willow beside the river, and the tall grass whispered in the wind. At last Jo sat on the stile and spoke very seriously.
        - id: ch01-b35
          speaker: jo
          text: Laurie, there's something I want to tell you.
        - id: ch01-b36
          speaker: narrator
          text: Laurie jerked upright as if he had been shot.
        - id: ch01-b37
          speaker: laurie
          text: Don't tell me that, Jo. I can't bear to hear it now!
          emotion: angry
        - id: ch01-b38
          speaker: jo
          text: Tell you what?
        - id: ch01-b39
          speaker: narrator
          text: His violence startled her. She wondered whether he meant his grandfather.
        - id: ch01-b40
          speaker: laurie
          text: That you're in love with that old man.
        - id: ch01-b41
          speaker: jo
          text: What old man?
        - id: ch01-b42
          speaker: laurie
          text: That awful professor you were always writing about. If you tell me you love him, I'll do something desperate.
          emotion: angry
        - id: ch01-b43
          speaker: narrator
          text: With his fists clenched and anger flashing in his eyes, he looked capable of keeping his word. Jo nearly laughed, but held it back. By now, she was getting excited too.
        - id: ch01-b44
          speaker: jo
          text: Don't swear, Teddy! He isn't old or awful. He's good and kind, and after you, he's the best friend I have. Please stop flying into a rage. I'm trying to be gentle, but if you insult my professor, I'll get angry too. I don't love him, and I don't love anyone else either.
          emotion: angry
        - id: ch01-b45
          speaker: laurie
          text: You will someday. And then what am I supposed to do?
        - id: ch01-b46
          speaker: jo
          text: You'll fall in love with somebody else, like a sensible boy, and forget all this misery.
        - id: ch01-b47
          speaker: laurie
          text: I can't love anyone else. And I'll never forget you, Jo. Never. Never!
          emotion: angry
        - id: ch01-b48
          speaker: narrator
          text: He stamped his foot on the last words. Jo sighed to herself. Feelings were far harder to manage than she had expected.
        - id: ch01-b49
          speaker: jo
          text: You still haven't heard what I wanted to say. Sit down and listen. I truly want to do what's right and help you be happy.
          emotion: calm
        - id: ch01-b50
          speaker: narrator
          text: Jo hoped a little reason would soothe him, which showed how little she understood love. But Laurie heard hope in her words. He dropped onto the grass at her feet, rested one arm on the lower step, and looked up expectantly. That made calm thinking nearly impossible for Jo. How could she say painful things while her boy watched her with love and longing, his lashes still wet with the bitter tears her answer had drawn from him? She gently turned his head aside and smoothed the wavy hair he had grown long for her sake.
        - id: ch01-b51
          speaker: jo
          text: Mother agrees that you and I aren't suited to each other. We both have quick tempers and strong wills. If we were foolish enough to... well, we'd probably make each other miserable.
        - id: ch01-b52
          speaker: laurie
          text: Marry? No, we wouldn't! If you loved me, Jo, I'd become a perfect saint. You could make me anything you wanted.
        - id: ch01-b53
          speaker: jo
          text: No, I couldn't. I've tried, and it didn't work. I won't gamble our happiness on an experiment this serious. We don't agree, and we never will. Let's stay good friends all our lives and not do anything reckless.
        - id: ch01-b54
          speaker: laurie
          text: We will if we ever get the chance.
        - id: ch01-b55
          speaker: narrator
          text: He muttered it rebelliously.
        - id: ch01-b56
          speaker: jo
          text: Please be reasonable and look at this sensibly.
        - id: ch01-b57
          speaker: laurie
          text: I won't be reasonable. I don't want your sensible way of looking at it. It won't help me. It only hurts more. I don't believe you have a heart at all.
          emotion: angry
        - id: ch01-b58
          speaker: jo
          text: I wish I didn't.
          emotion: sad
        - id: ch01-b59
          speaker: narrator
          text: Her voice trembled. Laurie took that as a hopeful sign. He turned toward her and brought all his powers of persuasion into a coaxing tone more dangerous than any he had ever used before.
        - id: ch01-b60
          speaker: laurie
          text: Don't disappoint all of us, dear. Everyone expects this. Grandpa has his heart set on it. Your family wants it too, and I can't manage without you. Say yes, and let us be happy. Please, Jo. Please.
        - id: ch01-b61
          speaker: narrator
          text: Months passed before Jo understood how she had found the strength to keep the decision she made when she knew she did not and never could love him that way. Holding to it was terribly hard. Still, she did, because delay would be useless and cruel.
        - id: ch01-b62
          speaker: jo
          text: I can't honestly say yes, so I won't say it. Someday you'll understand that I'm right, and you'll thank me.
        - id: ch01-b63
          speaker: laurie
          text: I'll be hanged if I do!
          emotion: angry
        - id: ch01-b64
          speaker: narrator
          text: Laurie sprang off the grass, burning with anger at the very thought.
        - id: ch01-b65
          speaker: jo
          text: Yes, you will. In time you'll get over this. You'll find a lovely, accomplished girl who adores you and belongs in your grand house. I don't. I'm plain, awkward, strange, and old for my age. You'd be ashamed of me. We'd quarrel. We're doing it already. I would hate fashionable society, and you'd enjoy it. You'd come to hate my writing, and I can't live without that. We'd both be miserable and wish we'd never married. Everything would be dreadful.
        - id: ch01-b66
          speaker: laurie
          text: Is there anything else?
        - id: ch01-b67
          speaker: narrator
          text: He struggled to sit through her rush of predictions.
        - id: ch01-b68
          speaker: jo
          text: Only that I don't think I'll ever marry. I'm happy as I am, and I love my freedom too much to hurry and give it up for any man alive.
        - id: ch01-b69
          speaker: laurie
          text: I know you better than that. You believe it now, but someday you'll care for someone. You'll love him with everything in you and be ready to live and die for him. That's the way you are. And I'll have to stand there and watch.
        - id: ch01-b70
          speaker: narrator
          text: In despair, Laurie threw his hat to the ground. The gesture might have looked funny if his face had not been so tragic.
        - id: ch01-b71
          speaker: jo
          text: Yes, if a man ever comes along and makes me love him in spite of myself, I'll live and die for him. You'll simply have to bear it. I've done everything I can, but you refuse to listen to reason. It's selfish to keep begging me for something I can't give. I'll always be very fond of you as a friend, but I will never marry you. The sooner you believe that, the better it will be for both of us. There!
          emotion: angry
        - id: ch01-b72
          speaker: narrator
          text: Her words struck like gunpowder. Laurie stared at her for a moment, as though he didn't know what to do with himself. Then he turned sharply away.
        - id: ch01-b73
          speaker: laurie
          text: You'll regret this someday, Jo.
          emotion: sad
        - id: ch01-b74
          speaker: jo
          text: Where are you going?
          emotion: fearful
        - id: ch01-b75
          speaker: narrator
          text: The look on his face frightened her.
        - id: ch01-b76
          speaker: laurie
          text: To the devil!
          emotion: angry
        - id: ch01-b77
          speaker: narrator
          text: Jo's heart stopped for a moment as he swung down the bank toward the river. But it takes a great deal of folly, wrongdoing, or misery to drive a young man to a violent death, and Laurie was not the sort to be defeated by one failure. He had no thought of a dramatic plunge. Some blind instinct made him toss his hat and coat into his boat and row with all his strength. He traveled upriver faster than he ever had in a race. Watching him try to outrun the sorrow inside him, Jo finally breathed again and loosened her clenched hands.
        - id: ch01-b78
          speaker: jo
          text: That will help him. He'll come home gentle and sorry, and then I won't dare face him. Now I must prepare Mr. Laurence to be especially kind to my poor boy. I wish Teddy could love Beth. Maybe he will someday, though I'm beginning to think I was wrong about her. Oh, dear! How can girls enjoy having men love them and then refuse them? I think it's dreadful.
          emotion: sad
        - id: ch01-b79
          speaker: narrator
          text: Jo walked home slowly. She felt as though she had killed some innocent creature and buried it beneath the leaves.
        - id: ch01-b80
          speaker: narrator
          text: Certain that no one else could handle it as well, Jo went directly to Mr. Laurence. She told him the painful story bravely. Then she broke down and wept so bitterly over her own inability to love Laurie that the kind old gentleman, though deeply disappointed, never reproached her. He could hardly understand how any girl could fail to love his grandson, and he still hoped Jo might change her mind. Yet he knew even better than she did that love cannot be forced. Shaking his head sadly, he decided to take his boy away from danger. Laurie's last words to Jo troubled him more than he admitted.
        - id: ch01-b81
          speaker: narrator
          text: Laurie came home exhausted but composed. His grandfather greeted him as if he knew nothing and managed the deception for an hour or two. Later they sat together in the twilight, an hour they had always enjoyed. The old man struggled to chatter as usual, and Laurie struggled even more to hear praise for the past year's success. Now all that work seemed wasted because it had not won Jo. At last he could bear no more. He went to the piano and began to play.
        - id: ch01-b82
          speaker: narrator
          text: The windows stood open. Across the way, Jo was walking in the garden with Beth. For once, Jo understood the music better than her sister did. Laurie played the "Sonata Pathétique," and he played it as he never had before.
        - id: ch01-b83
          speaker: mr_laurence
          text: That's excellent, I'm sure, but it's sad enough to make a man cry. Play us something brighter, lad.
        - id: ch01-b84
          speaker: narrator
          text: Mr. Laurence's kind old heart was full of sympathy. He longed to show it, but didn't know how. Laurie burst into a livelier piece and played it stormily for several minutes. He might have reached the end bravely if a quiet moment had not let Mrs. March's voice carry in through the open window.
        - id: ch01-b85
          speaker: mrs_march
          text: Jo, dear, come inside. I need you.
        - id: ch01-b86
          speaker: narrator
          text: Those were the very words Laurie longed to say, though he meant something different. He lost his place. The music stopped on a broken chord, and he sat silent in the dark.
        - id: ch01-b87
          speaker: mr_laurence
          text: I can't bear this.
          emotion: sad
        - id: ch01-b88
          speaker: narrator
          text: The old gentleman rose, felt his way to the piano, and laid a gentle hand on each of Laurie's broad shoulders.
        - id: ch01-b89
          speaker: mr_laurence
          text: I know, my boy. I know.
          emotion: calm
        - id: ch01-b90
          speaker: narrator
          text: For a moment, Laurie said nothing.
        - id: ch01-b91
          speaker: laurie
          text: Who told you?
          emotion: angry
        - id: ch01-b92
          speaker: mr_laurence
          text: Jo told me herself.
        - id: ch01-b93
          speaker: laurie
          text: Then that's the end of it.
        - id: ch01-b94
          speaker: narrator
          text: He shook off his grandfather's hands. He was grateful for the kindness, but his pride could not endure another man's pity.
        - id: ch01-b95
          speaker: mr_laurence
          text: Not quite. Let me say one thing, and then we'll end it. You may not want to stay at home now.
        - id: ch01-b96
          speaker: laurie
          text: I won't run away because of a girl. Jo can't stop me from seeing her. I'll stay here and see her as long as I choose.
        - id: ch01-b97
          speaker: narrator
          text: He spoke defiantly.
        - id: ch01-b98
          speaker: mr_laurence
          text: Not if you're the gentleman I believe you are. I'm disappointed too, but Jo can't change her feelings. The only decent thing is for you to leave for a while. Where would you go?
        - id: ch01-b99
          speaker: laurie
          text: Anywhere. I don't care what happens to me.
        - id: ch01-b100
          speaker: narrator
          text: Laurie rose with a reckless laugh that grated on his grandfather's ears.
        - id: ch01-b101
          speaker: mr_laurence
          text: Face this like a man, and for God's sake, don't do anything reckless. Why not travel abroad as you planned and try to forget?
        - id: ch01-b102
          speaker: laurie
          text: I can't.
        - id: ch01-b103
          speaker: mr_laurence
          text: You were desperate to go before, and I promised you could when you finished college.
        - id: ch01-b104
          speaker: laurie
          text: Yes, but I never meant to go alone.
          emotion: sad
        - id: ch01-b105
          speaker: narrator
          text: Laurie paced rapidly across the room with an expression his grandfather was glad not to see.
        - id: ch01-b106
          speaker: mr_laurence
          text: I haven't asked you to go alone. Someone is ready and glad to travel anywhere with you.
        - id: ch01-b107
          speaker: laurie
          text: Who, sir?
        - id: ch01-b108
          speaker: narrator
          text: He stopped and listened.
        - id: ch01-b109
          speaker: mr_laurence
          text: I am.
        - id: ch01-b110
          speaker: narrator
          text: Laurie came back as quickly as he had walked away and held out his hand.
        - id: ch01-b111
          speaker: laurie
          text: I'm a selfish brute, but... you understand, Grandfather.
          emotion: sad
        - id: ch01-b112
          speaker: mr_laurence
          text: Lord help me, yes. I do understand. I went through it once when I was young, and again with your father. Now sit quietly, my dear boy, and hear my plan. Everything is settled. We can leave at once.
          emotion: calm
        - id: ch01-b113
          speaker: narrator
          text: Mr. Laurence kept hold of him, almost as if he feared Laurie might break away as his father had before him.
        - id: ch01-b114
          speaker: laurie
          text: Very well, sir. What's the plan?
        - id: ch01-b115
          speaker: narrator
          text: Laurie sat down, but neither his face nor his voice showed any interest.
        - id: ch01-b116
          speaker: mr_laurence
          text: Some business in London needs attention. I meant to send you, but I can manage it better myself. Brooke can oversee things here. My partners already do nearly everything. I'm only holding my place until you're ready to take it, so I can leave whenever I please.
        - id: ch01-b117
          speaker: laurie
          text: But you hate traveling, sir. I can't ask you to do this at your age.
        - id: ch01-b118
          speaker: narrator
          text: Laurie appreciated the sacrifice, though if he went at all, he would much rather go alone. His grandfather knew that and was determined to prevent it. Laurie's present state made it unsafe to leave him to himself. The old man pushed aside his natural regret over all the comforts he would miss at home.
        - id: ch01-b119
          speaker: mr_laurence
          text: Bless your soul, I'm not worn out yet. I like the idea. The trip will do me good, and modern travel is so comfortable that my old bones will hardly know the difference between a train and an armchair.
        - id: ch01-b120
          speaker: narrator
          text: Laurie shifted restlessly. Perhaps his chair was uncomfortable, or perhaps he disliked the plan. Mr. Laurence hurried on.
        - id: ch01-b121
          speaker: mr_laurence
          text: I won't interfere or weigh you down. I'm coming because you'll be happier knowing I'm not left behind. You may go wherever you like while I amuse myself. I have friends to visit in London and Paris. You can wander through Italy, Germany, or Switzerland and have all the paintings, music, scenery, and adventures your heart desires.
        - id: ch01-b122
          speaker: narrator
          text: At that moment, Laurie believed his heart was broken and the whole world had become a howling wilderness. But his grandfather had carefully chosen a few tempting words. At their sound, the broken heart gave an unexpected jump, and one or two green places appeared in the wilderness.
        - id: ch01-b123
          speaker: laurie
          text: Whatever you prefer, sir. Where I go and what I do make no difference to me.
          emotion: sad
        - id: ch01-b124
          speaker: mr_laurence
          text: They make a difference to me. Remember that, my lad. I'll give you complete freedom, but I trust you to use it honorably. Promise me you will.
        - id: ch01-b125
          speaker: laurie
          text: Anything you ask, sir.
        - id: ch01-b126
          speaker: narrator
          text: The old gentleman was satisfied. Laurie cared nothing for the promise now, but Mr. Laurence believed the day would come when it kept him out of trouble.
        - id: ch01-b127
          speaker: narrator
          text: Mr. Laurence was a man of action. He moved quickly while Laurie was still too crushed to resist, and before long they were ready to leave. During the weeks of preparation, Laurie behaved much as young men usually do after such a blow. One moment he brooded, the next he snapped, and then he sank into silence. He lost his appetite, stopped caring about his clothes, and spent hours making storms on the piano. He avoided Jo, but comforted himself by watching her from his window. The tragedy in his face haunted her dreams at night and burdened her with guilt all day.
        - id: ch01-b128
          speaker: narrator
          text: Unlike some disappointed lovers, Laurie never spoke about his unreturned love. He would not let anyone, not even Mrs. March, console him or offer sympathy. In one way, that spared his friends. Even so, the weeks before he left were uncomfortable for everyone. They were all relieved that the poor dear fellow was going away to forget his sorrow and come home happy. Laurie gave a dark smile at their mistake. He passed it by with the sad superiority of someone certain that his loyalty, like his love, could never change.
        - id: ch01-b129
          speaker: narrator
          text: On the day of parting, he acted unusually cheerful to hide feelings that threatened to show themselves. Nobody believed the performance, but for his sake they pretended they did. He managed well until Mrs. March kissed him and whispered a few words of motherly concern. Then his control began to fail. He quickly hugged everyone, including the grieving Hannah, and raced downstairs as if his life depended on it.
        - id: ch01-b130
          speaker: narrator
          text: A minute later, Jo followed so she could wave if he looked back. He did. Then he returned, wrapped his arms around her as she stood one step above him, and looked up. His face made his brief plea more moving than many words could have done.
        - id: ch01-b131
          speaker: laurie
          text: Oh, Jo, can't you?
          emotion: sad
        - id: ch01-b132
          speaker: jo
          text: Teddy, dear, I wish I could.
          emotion: sad
        - id: ch01-b133
          speaker: narrator
          text: That was all. A little silence followed.
        - id: ch01-b134
          speaker: laurie
          text: It's all right. Never mind.
          emotion: sad
        - id: ch01-b135
          speaker: narrator
          text: He straightened and left without another word. But it was not all right, and Jo did mind. When his curly head rested on her arm for one moment after her hard answer, she felt as though she had stabbed her dearest friend. When he walked away without looking back, she knew the boy Laurie would never return.
