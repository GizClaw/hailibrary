audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机智，像在炉边从容讲述旧日家事
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情绪来得快，带一点男孩子气
        timbre: 明亮略带沙哑
        pace: 偏快
        pitch: 中低
    meg:
      display_name: 梅格
      tts:
        delivery: 温柔端庄，常带大姐姐式的认真
        timbre: 柔和圆润
        pace: 适中
        pitch: 中
    beth:
      display_name: 贝丝
      tts:
        delivery: 羞怯安静，话语真诚而体贴
        timbre: 轻柔温暖
        pace: 稍慢
        pitch: 中高
    amy:
      display_name: 艾米
      tts:
        delivery: 一本正经又有些自负，努力显得优雅
        timbre: 清脆稚嫩
        pace: 适中
        pitch: 偏高
    laurie:
      display_name: 劳里
      tts:
        delivery: 彬彬有礼而略显腼腆，熟悉以后轻松风趣
        timbre: 清朗温和
        pace: 适中
        pitch: 中
    hannah:
      display_name: 汉娜
      tts:
        delivery: 爽朗朴实，惊讶时直率而热烈
        timbre: 浑厚温暖
        pace: 适中
        pitch: 中低
    mrs_march:
      display_name: 马奇太太
      tts:
        delivery: 慈爱爽朗，沉稳中带着鼓励
        timbre: 饱满温暖
        pace: 从容
        pitch: 中低
    mr_laurence:
      display_name: 劳伦斯先生
      tts:
        delivery: 严肃直接，善意藏在简短的话里
        timbre: 低沉浑厚
        pace: 从容
        pitch: 低
    brooke:
      display_name: 布鲁克先生
      tts:
        delivery: 温和克制，礼貌中带着真诚关切
        timbre: 沉静清朗
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 第十六章 书信
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 天刚蒙蒙亮，天色灰冷，姐妹们已经点起灯，读完了当天那一章小书。真正的忧患落到家里以后，那些话听来和从前大不一样，句句都能扶住她们，也能安慰她们。姑娘们一边穿衣，一边彼此约定，送母亲走的时候一定要快活，要有希望。谁也不许哭，不许抱怨，免得母亲带着满心忧虑上路，还要替她们难过。
        - id: ch01-b02
          speaker: narrator
          text: 下楼一看，家里处处都显得不对劲。外面又暗又静，屋里却灯火通明，人人忙得团团转。早餐早得出奇，汉娜戴着睡帽在厨房里飞来飞去，连她那张熟悉的脸也像变了样。大皮箱立在门厅，母亲的斗篷和软帽放在沙发上。马奇太太一夜没睡，忧虑又折磨着她。她坐在那里勉强吃着东西，脸色苍白，人也疲惫。姑娘们看着她，刚才下的决心几乎守不住了。梅格眼里一次次涌上泪水，乔只好把脸藏到厨房的滚轴巾后面。贝丝和艾米也神情严肃，忧愁得像是头一回认识悲伤。
        - id: ch01-b03
          speaker: narrator
          text: 没有人说多少话。出发的时刻越来越近，大家坐着等马车。姑娘们围着母亲，一个替她叠好披肩，一个理平软帽的系带，一个帮她套上胶鞋，还有一个替她扣好旅行袋。这时，马奇太太开了口。
        - id: ch01-b04
          speaker: mrs_march
          text: 孩子们，我走以后，汉娜会照料你们，劳伦斯先生也会保护你们。汉娜一直忠心耿耿，好心的邻居也会把你们当自己的孩子照看。我不担心这些。我只怕你们不知道该怎么熬过眼前的忧患。别一味伤心发愁，也别以为停下手里的事，拼命不去想，就能安慰自己。还像平常一样做事吧。工作是上天赐给人的安慰。心里要有希望，手上也别闲着。不管发生什么，你们永远不会失去天父。
          emotion: calm
        - id: ch01-b05
          speakers: [meg, jo, beth, amy]
          ensemble: chorus
          text: 是，妈妈。
        - id: ch01-b06
          speaker: mrs_march
          text: 梅格，亲爱的，你要谨慎，照顾好妹妹们，多跟汉娜商量。真遇到拿不准的事，就去问劳伦斯先生。乔，你要耐心，别泄气，也别莽撞。常常写信给我，做我的勇敢姑娘，随时帮大家一把，也让大家振作起来。贝丝，你可以用音乐安慰自己，家里那些小事，也要一件件认真做好。艾米，你能帮多少就帮多少。要听话，开开心心、平平安安地留在家里。
        - id: ch01-b07
          speakers: [meg, jo, beth, amy]
          ensemble: chorus
          text: 我们一定会的，妈妈！
        - id: ch01-b08
          speaker: narrator
          text: 马车的辚辚声越来越近，大家全都惊了一下，侧耳听着。最难熬的时候到了，可姑娘们撑住了。她们心里沉甸甸的，却没有谁哭，没有谁躲开，也没有一句叹息。她们请母亲把所有的爱都带给父亲，说这些话时，又忍不住想到，也许已经来不及让父亲听见。她们只是安静地吻母亲，依依不舍地抱住她。马车要走时，四个人还努力带着笑挥手。
        - id: ch01-b09
          speaker: narrator
          text: 劳里和祖父也来送行。布鲁克先生看起来坚强、明白事理，又十分亲切。姑娘们当场给他起了一个名字，叫他“侠肝义胆先生”。
        - id: ch01-b10
          speaker: mrs_march
          text: 再见，我的宝贝们。愿上帝赐福我们，也保佑我们每一个人。
          emotion: sad
        - id: ch01-b11
          speaker: narrator
          text: 马奇太太低声说完，挨个亲了亲那几张心爱的小脸，匆匆上了马车。车子驶出去的时候，太阳正好出来。她回头望去，阳光落在门边那一群人身上，像一个好兆头。姑娘们也看见了，于是笑着挥手。直到马车拐过街角，她眼前最后留下的，还是四张明亮的脸。老劳伦斯先生、忠心的汉娜，还有热心的劳里站在她们身后，像一支卫队守着她们。
        - id: ch01-b12
          speaker: mrs_march
          text: 大家对我们实在太好了。
        - id: ch01-b13
          speaker: narrator
          text: 她转回身，又在布鲁克先生脸上看见尊敬和同情，更觉得这话没错。
        - id: ch01-b14
          speaker: brooke
          text: 我想，他们也没法不对你们好。
        - id: ch01-b15
          speaker: narrator
          text: 布鲁克先生笑起来，那笑声很能感染人，连马奇太太也忍不住微笑。就这样，阳光、笑容和快活的话带来了一个又一个好兆头，他们踏上了旅程。
        - id: ch01-b16
          speaker: narrator
          text: 邻居们回家吃早餐去了，让姑娘们独自歇一歇，也缓一缓精神。
        - id: ch01-b17
          speaker: jo
          text: 我怎么觉得，家里像刚让一场地震震过似的。
        - id: ch01-b18
          speaker: meg
          text: 简直像少了半座房子。
          emotion: sad
        - id: ch01-b19
          speaker: narrator
          text: 贝丝张了张嘴，却说不出话，只抬手指向母亲桌上。那里放着一叠补得整整齐齐的长袜。临走前那么忙乱，母亲心里仍旧惦记着她们，还替她们做完了这些活儿。这只是一件小事，却一下碰到了姑娘们心底。刚才那些勇敢的决心全撑不住了。四姐妹一齐崩溃，伤心得放声大哭。
        - id: ch01-b20
          speaker: narrator
          text: 汉娜很懂她们。她先让姑娘们把满肚子的难过哭出来。等这一场泪雨眼看就要停了，她才提着咖啡壶来救人。
        - id: ch01-b21
          speaker: hannah
          text: 好啦，我亲爱的小姐们。记住太太说的话，别再这么伤心了。来，一人喝一杯咖啡，喝完咱们就干活，也让这个家争口气。
          emotion: calm
        - id: ch01-b22
          speaker: narrator
          text: 家里平时很少喝咖啡，那天早上汉娜却特意煮了一壶，真是体贴极了。她不停地点头劝着，壶嘴里又飘出香气，谁还能拒绝？姑娘们围到桌边，用餐巾换下手帕。十分钟以后，四个人都恢复了平常的样子。
        - id: ch01-b23
          speaker: jo
          text: “心里有希望，手上别闲着”，这就是咱们的格言。现在看看谁记得最牢。我要照常去马奇姑婆那里。哎哟，她今天准得狠狠训我一顿！
        - id: ch01-b24
          speaker: narrator
          text: 乔啜着咖啡，精神又回来了。
        - id: ch01-b25
          speaker: meg
          text: 我也照常去金家。可我真想留在家里，把这些事照料好。
        - id: ch01-b26
          speaker: narrator
          text: 梅格只恨自己的眼睛哭得通红。
        - id: ch01-b27
          speaker: amy
          text: 没这个必要。贝丝和我完全能把家管好。
        - id: ch01-b28
          speaker: narrator
          text: 艾米插进来，神气得很。
        - id: ch01-b29
          speaker: beth
          text: 汉娜会告诉我们该做什么。等你们回来，家里一定全都收拾妥当。
        - id: ch01-b30
          speaker: narrator
          text: 贝丝说着，已经把拖把和洗碗盆拿了出来。
        - id: ch01-b31
          speaker: amy
          text: 我觉得，忧虑这种事还挺有意思的。
        - id: ch01-b32
          speaker: narrator
          text: 艾米一边想，一边吃着糖。姐妹们都笑了，心里也轻松不少。只有梅格望着这个能从糖罐里得到安慰的小姑娘，无奈地摇摇头。
        - id: ch01-b33
          speaker: narrator
          text: 乔看见那些苹果馅饼，神色又认真起来。她和梅格出门做每天的工作，走到外头还舍不得离开，回头望向那扇窗。平时母亲的脸总会出现在那里，今天却不见了。不过贝丝记得家里这个小小的仪式。她站在窗前，不住地向两个姐姐点头，那副样子活像一个红脸的中国官老爷。
        - id: ch01-b34
          speaker: jo
          text: 这才是我的贝丝！
          emotion: happy
        - id: ch01-b35
          speaker: narrator
          text: 乔感激地挥了挥帽子。姐妹俩走到该分路的地方，她又向梅格道别。
        - id: ch01-b36
          speaker: jo
          text: 再见，梅格。希望金家的人今天别把你累坏了。亲爱的，别太替爸爸担心。
        - id: ch01-b37
          speaker: meg
          text: 也希望马奇姑婆少对你咕哝几句。你这个发式真衬你，看着又像男孩子，又挺好看的。
        - id: ch01-b38
          speaker: narrator
          text: 梅格努力忍住笑。乔的卷发脑袋架在高高的肩膀上，显得小得滑稽。
        - id: ch01-b39
          speaker: jo
          text: 如今我也就靠这个安慰自己了。
        - id: ch01-b40
          speaker: narrator
          text: 乔学劳里的样子碰了碰帽檐，大步走开。她此刻的感觉，大概很像冬天里一只刚剪过毛的羊。
        - id: ch01-b41
          speaker: narrator
          text: 父亲的消息给了姑娘们很大安慰。他的病仍旧危险，可世上最好、最温柔的护士已经到了身边，他也渐渐有了起色。布鲁克先生每天发来一份病情简报，梅格如今把自己当作一家之长，坚持每次都由她念给大家听。一星期慢慢过去，电报里的消息也越来越让人放心。
        - id: ch01-b42
          speaker: narrator
          text: 刚开始，人人都急着写信。姐妹中总有一个郑重其事地把鼓鼓的信封塞进邮筒。她们如今和华盛顿通起信来，一个个都觉得自己很重要。有一次，邮包里装着全家人各有模样的短信。咱们不妨拦下这趟想象中的邮班，把信拿出来听一听。
        - id: ch01-b43
          speaker: meg
          text: 我最亲爱的妈妈，您上一封信把我们高兴坏了，真不知道该怎么说。消息那么好，我们读着读着，一会儿哭，一会儿又笑。布鲁克先生实在太好了。劳伦斯先生的事务正巧让他在您附近多留这些日子，也真幸运，这样他就能替您和爸爸办许多事。
          emotion: happy
        - id: ch01-b44
          speaker: meg
          text: 妹妹们个个都乖得像金子。乔帮我做针线，还非要把所有重活都揽过去。幸好我知道，她这场“道德热病”不会维持太久，不然我真怕她把自己累坏。贝丝每天做事都像钟表一样准，一点也没忘记您的嘱咐。她一直为爸爸担心，脸上总带着愁容，只有坐到小钢琴前才好一些。
        - id: ch01-b45
          speaker: meg
          text: 艾米很听我的话，我也把她照顾得很好。她已经会自己梳头了，我正在教她锁扣眼、补袜子。她学得很认真。您回来以后看见她的进步，一定会高兴。照乔的说法，劳伦斯先生像只老母鸡，把我们严严实实地护在翅膀底下。劳里也很亲切，很有个好邻居的样子。他和乔常想法子逗我们开心，因为我们有时候实在沮丧。您又在那么远的地方，我们总觉得自己像没了父母的孩子。
        - id: ch01-b46
          speaker: meg
          text: 汉娜简直成了圣人。她一点也不骂我们，还总叫我“玛格丽特小姐”。您知道，这才合规矩。她也很尊重我。我们身体都好，手里也都有事做，只是从早到晚都盼着您回来。请把我最深的爱带给爸爸。也请您相信，我永远是爱您的梅格。
        - id: ch01-b47
          speaker: narrator
          text: 梅格的短信写在带香味的信纸上，字迹娟秀。下一封可完全不是一个样子。那封信用一张薄薄的外国大信纸写成，字迹潦草，到处是墨点、花里胡哨的笔画，还有一串串拖着卷尾巴的字母。
        - id: ch01-b48
          speaker: jo
          text: 我最宝贝的妈妈，先为亲爱的爸爸欢呼三声！他才刚好一点，布鲁克就马上发电报告诉我们，真够朋友。我听见消息，立刻冲上阁楼，想感谢上帝对我们这么好。可我除了哭，什么也不会，只能不停地说：“我太高兴了！我太高兴了！”这样也算规规矩矩的祷告吧？其实我心里说了好多好多祷词。
          emotion: happy
        - id: ch01-b49
          speaker: jo
          text: 家里这些日子挺有意思，现在我也能尝到其中的乐趣了。每个人都好得不得了，简直像住进了一窝斑鸠。您要是看见梅格坐在主位上，拼命装出母亲的样子，准会笑。她一天比一天漂亮，有时候我真是爱她爱得要命。两个小妹妹都是十足的天使。至于我，唉，我还是那个乔，大概永远变不成别的样子。
        - id: ch01-b50
          speaker: jo
          text: 对了，有件事我非告诉您不可。我差点和劳里吵翻。起因不过是一件傻事，我却把心里的话一股脑儿倒出来，他听了就火了。道理虽然在我这边，可我说话的方式不对。他气冲冲地回了家，还说我不道歉，他就再也不来。我也发了脾气，说自己绝不认错。我们就这么僵了整整一天。我心里难受极了，也格外想您。
        - id: ch01-b51
          speaker: jo
          text: 劳里和我都那么骄傲，要先开口真难。我本来还觉得，反正我有理，最后总该是他低头。可他始终没来。天快黑的时候，我忽然想起艾米掉进河里以后，您对我说过的话。我读了自己的小书，心里舒服了一点，也决定不让太阳带着我的怒气落下去。我跑去向劳里认错，没想到才到门口就碰上了他。他原来也是来认错的。我们两个都笑了，互相赔了不是，心里又和和气气，舒舒服服了。
        - id: ch01-b52
          speaker: jo
          text: 昨天我帮汉娜洗衣服，还写了一首“湿”。爸爸喜欢我那些傻乎乎的小玩意儿，我就把诗塞进信里，逗他开心。请替我给他一个天底下最亲最亲的拥抱。至于您，就请代替您那个颠三倒四的乔，亲您十二下吧。
        - id: ch01-b53
          speaker: jo
          text: 这首诗叫《肥皂沫之歌》。我是木盆的女王，快活地放声唱。白泡沫越涨越高，我使劲洗，使劲漂，使劲拧，再把衣裳一件一件晾好。它们在清新自由的风里飘，头上是一片阳光灿烂的晴空。
        - id: ch01-b54
          speaker: jo
          text: 真希望人的心也能洗一洗，把一星期留下的斑痕全洗掉。让水和空气使出神奇的本领，把我们也洗得和衣裳一样干净。到了那一天，大地上才会真的迎来一个光荣的洗衣日。
        - id: ch01-b55
          speaker: jo
          text: 在有用的人生路旁，三色堇会一直开放。忙碌的心没有空闲，去想悲伤、忧虑和愁苦的模样。只要勇敢地挥起扫帚，烦恼也可以一扫而光。
        - id: ch01-b56
          speaker: jo
          text: 我真庆幸自己有事可做，能够一天一天勤恳劳动。劳动给我健康，给我力气，也给我希望，还让我快活地说：“脑袋呀，你想你的。心呀，你尽管感受。可是手啊，你得一直做工！”
        - id: ch01-b57
          speaker: beth
          text: 亲爱的妈妈，纸上只剩一点地方了，我只能送上我的爱，再放进几朵压平的三色堇。这些花是从我一直养在屋里的那一棵上摘的，本来就打算留给爸爸看。我每天早晨都读小书，白天努力做个好孩子，晚上就唱着爸爸的曲子哄自己睡觉。
        - id: ch01-b58
          speaker: beth
          text: 现在我不能再唱《忠诚之乡》了，因为一唱就会哭。每个人对我们都很好。您不在身边，我们只能尽量让日子过得快活。艾米想用剩下的地方，我只好停笔了。隔热垫的套子，我没有忘记缝。每天我也给钟上发条，还会开窗给房间通风。
        - id: ch01-b59
          speaker: beth
          text: 请替我亲亲亲爱的爸爸，就亲在他叫作属于我的那一边脸颊上。啊，请您快点回来吧。爱您的小贝丝。
          emotion: sad
        - id: ch01-b60
          speaker: amy
          text: Ma Chère Mamma，亲爱的妈妈，我们全都很好。我每天都做功课，而且从来不跟姐姐们抵赖。梅格说应该写“顶嘴”，所以我把两个词都写上，您可以挑最正确的那个。
        - id: ch01-b61
          speaker: amy
          text: 梅格给了我很大的舒服。每天喝茶时，她都让我吃果冻。乔说这对我很有好处，因为能让我的脾气变甜。劳里不像他应该的那么尊敬我。我马上就要十几岁了，他却还叫我小鸡仔。我学哈蒂·金说“谢谢”或者“日安”时，他就飞快地说一串法国话，伤害我的感情。
        - id: ch01-b62
          speaker: amy
          text: 我的蓝裙子，两只袖子都磨破了。梅格换上了新袖子，可前襟的褶子装错了，而且袖子比裙身还蓝。我心里很难过，不过没有发脾气。我很会忍耐自己的苦难。可是我真希望汉娜把我的围裙浆得再硬一点，还能每天做荞麦饼。她不可以吗？您看，我这个疑问号写得漂不漂亮？
        - id: ch01-b63
          speaker: amy
          text: 梅格说，我的标点和拼字实在丢脸。我觉得非常羞会，可是天哪，我有那么多事要写，不能停下来了。Adieu，再见。请把一大堆爱送给爸爸。您亲爱的女儿，艾米·柯蒂斯·马奇。
        - id: ch01-b64
          speaker: hannah
          text: 亲爱的马奇太太，俺就写几句，告诉您，俺们个个都好得顶呱呱。姑娘们聪明伶俐，做起事来手脚也快。梅格小姐将来准是个顶好的管家。她自个儿喜欢做这些事，诀窍又学得快，快得真叫人吃惊。
        - id: ch01-b65
          speaker: hannah
          text: 要论往前冲，没人赶得上乔。可她从来不知道先停下来想一想，所以谁也猜不出她最后会冲到哪儿去。星期一，她洗了一大盆衣裳。衣服还没拧水，她就先上了浆，还把一条粉红印花布裙子漂得蓝汪汪的。俺险些活活笑死。
        - id: ch01-b66
          speaker: hannah
          text: 贝丝是最好的小人儿。她做什么都想在前头，又靠得住，真帮了俺大忙。她什么都想学。小小年纪，已经能自己上市场买东西了，还在俺的帮助下记账，记得好极了。到现在，咱们过日子一直很省俭。
        - id: ch01-b67
          speaker: hannah
          text: 照您的吩咐，俺一星期只让姑娘们喝一次咖啡，平常吃的都是清淡实在的饭。艾米也过得不错，不哭不闹，穿最好的衣裳，吃甜东西。劳里先生还和以前一样淘气，常过来把房子闹个底朝天。不过他能让姑娘们提起精神，俺就随他们尽情玩。
        - id: ch01-b68
          speaker: hannah
          text: 老先生送来一大堆东西，实在有点磨人。不过他的心意是好的，俺也没资格多嘴。俺的面包已经发好了，这回真不能再写了。请替俺问候马奇先生。俺盼着他那场肺炎已经走得干干净净。恭敬您的，汉娜·马利特。
        - id: ch01-b69
          speaker: laurie
          text: 第二病房护士长，拉帕汉诺克河畔一切安宁。部队状况良好，军需部门井井有条。特迪上校率领的乡土卫队时刻警戒。总司令劳伦斯将军每天检阅全军，军需官马利特维持营地秩序，雄狮少校夜里负责放哨。
        - id: ch01-b70
          speaker: laurie
          text: 华盛顿的好消息传来以后，我军鸣炮二十四响，还在司令部举行了一场盛装阅兵。总司令送上最好的祝愿，下面署名的人也诚心赞同。特迪上校。
        - id: ch01-b71
          speaker: mr_laurence
          text: 尊敬的太太，小姑娘们一切都好。贝丝和我家孩子每天过来报告。汉娜是个模范帮手，像一条龙似的守着漂亮的梅格。天气一直晴朗，很好。
        - id: ch01-b72
          speaker: mr_laurence
          text: 布鲁克尽管由您使唤。要是花费超过了您的预算，就来找我支取。别让您的丈夫缺少任何东西。感谢上帝，他已经在康复了。您真诚的朋友和仆人，詹姆斯·劳伦斯。
