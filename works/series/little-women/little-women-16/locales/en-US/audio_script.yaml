  chapters:
    - id: ch01
      title: The Cold Gray Dawn
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At cold gray dawn, the sisters lit their lamp and read their little books more earnestly than ever before. Real trouble had come, and now the familiar words seemed full of comfort. As they dressed, the girls agreed that they would send their mother away with hopeful faces, without tears or complaints.
        - id: ch01-b02
          speaker: narrator
          text: Downstairs, everything felt strange. Outside it was dim and silent. Inside, the house was bright and bustling. Breakfast at such an early hour seemed unnatural, and so did Hannah, hurrying around the kitchen in her nightcap. The large trunk waited in the hall. Marmee's cloak and bonnet lay on the sofa. Marmee herself tried to eat, but she looked pale and worn after a sleepless, anxious night. The girls struggled to keep their promise. Meg's eyes filled again and again. Jo hid her face in the kitchen roller. Beth and Amy looked grave, as if sorrow were something new to them.
        - id: ch01-b03
          speaker: narrator
          text: Hardly anyone spoke. As the time for the carriage drew near, the four girls gathered around their mother. One folded her shawl. Another straightened her bonnet strings. A third helped with her overshoes, while the fourth fastened her traveling bag. Then Marmee spoke.
        - id: ch01-b04
          speaker: marmee
          text: Children, I'm leaving you in Hannah's care and under Mr. Laurence's protection. Hannah could not be more faithful, and our good neighbor will watch over you as if you were his own. I'm not afraid for your safety. What worries me is how you'll face this trouble. Once I'm gone, don't sit grieving or try to escape your thoughts by doing nothing. Keep up your usual work. Work can be a blessed comfort. Hope and keep busy. Whatever happens, remember that you can never be fatherless.
          emotion: calm
        - id: ch01-b05
          speakers: [meg, jo, beth, amy]
          ensemble: chorus
          text: Yes, Mother.
        - id: ch01-b06
          speaker: marmee
          text: Meg, dear, be sensible. Look after your sisters, ask Hannah's advice, and go to Mr. Laurence whenever you're uncertain. Jo, be patient. Don't lose heart or rush into anything. Write often, and be my brave girl, ready to help and cheer the others. Beth, let your music comfort you, and be faithful in the small duties at home. Amy, help wherever you can, obey the others, and stay happy and safe here.
        - id: ch01-b07
          speakers: [meg, jo, beth, amy]
          ensemble: chorus
          text: We will, Mother! We promise!
        - id: ch01-b08
          speaker: narrator
          text: Wheels rattled toward the house. Everyone started and listened. This was the hardest minute, but the girls stood firm. No one cried, ran away, or complained. Their hearts were heavy as they sent loving messages to Father, knowing the messages might reach him too late. They kissed their mother quietly, held her close, and tried to wave cheerfully as she left.
    - id: ch02
      title: Sunshine at the Gate
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Laurie and his grandfather had come to see Marmee off. Mr. Brooke looked so strong, sensible, and kind that the girls immediately named him Mr. Greatheart.
        - id: ch02-b02
          speaker: marmee
          text: Goodbye, my darlings. God bless us and keep us all.
          emotion: sad
        - id: ch02-b03
          speaker: narrator
          text: Marmee whispered the words as she kissed each dear face, then hurried into the carriage. As it rolled away, the sun came out. Looking back, she saw it shining on the little group at the gate like a good omen. The girls saw it too. They smiled and waved. At the corner, Marmee's last sight was four bright faces, with old Mr. Laurence, faithful Hannah, and devoted Laurie standing behind them like a bodyguard.
        - id: ch02-b04
          speaker: marmee
          text: Everyone is so kind to us.
        - id: ch02-b05
          speaker: narrator
          text: She turned and found more kindness in Mr. Brooke's respectful, sympathetic face.
        - id: ch02-b06
          speaker: mr_brooke
          text: I don't see how anyone could help being kind to you.
        - id: ch02-b07
          speaker: narrator
          text: He laughed so warmly that Marmee had to smile. And so the journey began with sunshine, smiles, and hopeful words.
    - id: ch03
      title: Hope and Keep Busy
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The neighbors went home to breakfast, leaving the girls to rest and gather themselves.
        - id: ch03-b02
          speaker: jo
          text: I feel as though an earthquake just shook the whole house.
        - id: ch03-b03
          speaker: meg
          text: It feels as if half the house has disappeared.
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: Beth tried to speak, but no words came. She could only point at a pile of neatly mended stockings on Marmee's table. Even in her last hurried moments, their mother had remembered them and worked for them. Such a little thing went straight to their hearts. All their brave promises gave way, and the four girls cried bitterly.
        - id: ch03-b05
          speaker: narrator
          text: Hannah wisely let the storm pass. When their sobs began to ease, she marched in carrying a coffeepot.
        - id: ch03-b06
          speaker: hannah
          text: Now, my dear young ladies, remember what your ma told you. No more fretting. Come have a cup of coffee, every one of you. Then we'll get to work and make the family proud.
        - id: ch03-b07
          speaker: narrator
          text: Coffee was a special treat, and Hannah knew exactly what she was doing. No one could resist her coaxing nods or the wonderful smell rising from the pot. The girls came to the table, traded their handkerchiefs for napkins, and within ten minutes felt steady again.
        - id: ch03-b08
          speaker: jo
          text: Hope and keep busy. That's our motto now. Let's see who remembers it best. I'll go to Aunt March as usual. Oh, what a lecture she'll give me!
        - id: ch03-b09
          speaker: meg
          text: I'll go to the Kings, though I'd much rather stay here and take care of things at home.
        - id: ch03-b10
          speaker: amy
          text: You don't need to. Beth and I are perfectly capable of keeping house.
        - id: ch03-b11
          speaker: beth
          text: Hannah will show us what to do, and we'll make everything nice before you come home.
        - id: ch03-b12
          speaker: narrator
          text: Beth took out her mop and dish tub at once. Amy thoughtfully ate a spoonful of sugar.
        - id: ch03-b13
          speaker: amy
          text: I think being anxious is very interesting.
        - id: ch03-b14
          speaker: narrator
          text: The others had to laugh, and laughter helped, though Meg shook her head at a young lady who found comfort in the sugar bowl.
        - id: ch03-b15
          speaker: narrator
          text: Then Jo saw the turnovers and grew sober again. When she and Meg left for their daily work, they looked sadly toward the window where Marmee always stood to see them off. Marmee was gone. But Beth had remembered their little custom. There she was, nodding to them like a rosy-faced mandarin.
        - id: ch03-b16
          speaker: jo
          text: That's exactly like my Beth! Goodbye, Meggy. I hope the Kings don't work you too hard today. And please don't worry about Father.
        - id: ch03-b17
          speaker: meg
          text: I hope Aunt March doesn't croak at you. Your hair really does suit you. It looks boyish and very nice.
        - id: ch03-b18
          speaker: narrator
          text: Meg tried not to smile at the curly head that looked comically small above Jo's tall shoulders.
        - id: ch03-b19
          speaker: jo
          text: That's my one comfort.
        - id: ch03-b20
          speaker: narrator
          text: Jo tipped her hat like Laurie and strode away, feeling like a shorn sheep on a winter day.
    - id: ch04
      title: Letters to Washington
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: News from Father brought the girls great comfort. He was still dangerously ill, but the care of the best and gentlest nurse had already helped him. Mr. Brooke sent a report every day. Meg, acting as head of the family, insisted on reading each message aloud. As the week passed, the news grew steadily brighter.
        - id: ch04-b02
          speaker: narrator
          text: At first, everyone wanted to write. The sisters stuffed thick envelopes and carefully pushed them into the mailbox, feeling quite important about their correspondence with Washington. One packet held notes that sounded exactly like their writers. Let us imagine opening that mail and listening.
        - id: ch04-b03
          speaker: meg
          text: My dearest Mother, your last letter made us happier than I can say. The news was so good that we laughed and cried at once. Mr. Brooke is wonderfully kind, and it's fortunate that Mr. Laurence's business keeps him near you, since he can do so much for you and Father. The girls are being as good as gold. Jo helps with the sewing and takes every hard job she can find. I might worry that she's doing too much, except that her moral fits never last very long. Beth follows her routine like a clock and remembers everything you told her. She worries about Father and looks serious unless she's at her little piano. Amy obeys me nicely, and I take excellent care of her. She does her own hair now, and I'm teaching her buttonholes and how to mend her stockings. She tries very hard. I know you'll be pleased with her progress when you return.
        - id: ch04-b04
          speaker: meg
          text: Mr. Laurence watches us like a mother hen, as Jo puts it, and Laurie is a very kind neighbor. He and Jo keep us laughing. Sometimes we feel low and almost like orphans with you so far away. Hannah is a perfect saint. She never scolds and always calls me Miss Margaret, which is quite proper, you know. She treats me with real respect. We're all healthy and busy, but we long for you day and night. Give Father my dearest love. I am always your own, Meg.
        - id: ch04-b05
          speaker: narrator
          text: Meg's note was beautifully written on scented paper. The next one looked entirely different. Jo had covered a large sheet of thin foreign paper with blots, flourishes, and letters that curled their tails.
        - id: ch04-b06
          speaker: jo
          text: My precious Marmee, three cheers for dear Father! Brooke was a trump to telegraph the instant Father improved. When the message came, I rushed up to the attic to thank God for being so good to us. All I could do was cry and say, “I'm glad! I'm glad!” Wasn't that as good as a proper prayer? My heart was full of them.
        - id: ch04-b07
          speaker: jo
          text: We have the funniest times, and now I can enjoy them. Everyone is being so terribly good that this house feels like a nest of turtledoves. You would laugh to see Meg at the head of the table, trying to act motherly. She grows prettier every day, and sometimes I fall in love with her. The children are regular archangels. As for me, well, I'm Jo, and I never expect to be anything else.
        - id: ch04-b08
          speaker: jo
          text: I nearly quarreled with Laurie. I spoke my mind about one silly little matter, and he took offense. I was right, but I said it badly. He marched home and declared he would not return until I apologized. I said I never would, and I got furious. It went on all day. I felt miserable and wanted you badly. Laurie and I are both so proud that apologizing is hard. I expected him to give in because I was right, but he stayed away. Near evening, I remembered what you told me after Amy fell through the ice. I read my little book, felt better, and decided not to let the sun go down on my anger. I ran over to tell Laurie I was sorry. At the gate, I met him coming to do exactly the same thing. We laughed, apologized to each other, and felt comfortable and good again.
        - id: ch04-b09
          speaker: jo
          text: Yesterday, while I helped Hannah wash, I made a “pome.” Father likes my silly things, so I'm sending it to amuse him. Give him the most loving hug anyone ever gave, then kiss yourself twelve times for your topsy-turvy Jo.
        - id: ch04-b10
          speaker: narrator
          text: Jo called her poem “A Song from the Suds.”
        - id: ch04-b11
          speaker: jo
          text: Queen of my tub, I sing as I work, while the white foam rises high. I wash and rinse and firmly wring, then fasten the clothes to dry. Out in the fresh, free air they swing beneath the sunny sky.
        - id: ch04-b12
          speaker: jo
          text: I wish we could wash the stains of the week from our hearts and souls, and let water and air work their magic until we were as clean as the clothes. Then the whole earth would share in one glorious washing day.
        - id: ch04-b13
          speaker: jo
          text: Along the road of a useful life, heart's-ease will always bloom. A busy mind has no time to dwell on sorrow, worry, or gloom. Anxious thoughts can be swept away when we bravely wield a broom.
        - id: ch04-b14
          speaker: jo
          text: I'm glad to have a daily task, because work gives me health, strength, and hope. So I cheerfully learn to say, “Head, you may think. Heart, you may feel. But Hand, you shall always work.”
    - id: ch05
      title: Four More Notes from Home
      blocks:
        - id: ch05-b01
          speaker: beth
          text: Dear Mother, there is only enough room for my love and some pressed pansies from the plant I've kept safe indoors for Father to see. I read every morning, try to be good all day, and sing myself to sleep with Father's tune. I cannot sing “Land of the Leal” now because it makes me cry. Everyone is very kind, and we're as happy as we can be without you. Amy wants the rest of the page, so I must stop. I remembered to cover the holders. I wind the clock and air the rooms every day. Kiss dear Father on the cheek he calls mine. Oh, please come home soon to your loving little Beth.
        - id: ch05-b02
          speaker: amy
          text: Ma chère Mamma, we are all well. I always do my lessons and never “corroberate” the girls. Meg says the word is “contradict,” so I wrote both and you may choose the properest one. Meg comforts me greatly and gives me jelly with tea every night. Jo says it's good for me because it keeps my temper sweet. Laurie is not respectful enough now that I'm almost in my teens. He calls me Chick. And whenever I say “merci” or “bonjour,” the way Hattie King does, he hurts my feelings by answering in French much too fast.
        - id: ch05-b03
          speaker: amy
          text: The sleeves of my blue dress wore out, so Meg put in new ones. But the fullness in front went wrong, and the sleeves are bluer than the dress. I felt bad, but I didn't complain. I bear my troubles very well. Still, I wish Hannah would starch my aprons more and serve buckwheat cakes every day. Can't she? Did you notice how nicely I made that interrogation point? Meg says my punctuation and spelling are disgraceful. I am mortified. But dear me, I have so much to do that I can't stop. Adieu. I send heaps of love to Papa. Your affectionate daughter, Amy Curtis March.
        - id: ch05-b04
          speaker: hannah
          text: Dear Miss March, I'm dropping you a line to say we're getting on first-rate. The girls are clever and fly around right smart. Miss Meg will make a proper good housekeeper. She likes the work and learns surprisingly fast. Jo beats everyone for charging ahead, but she doesn't stop to calculate first, and you never know where she'll land. Monday she did a whole tub of washing. But she starched the clothes before she wrung them, then blued a pink calico dress until I thought I'd die laughing.
        - id: ch05-b05
          speaker: hannah
          text: Beth is the best little creature and a great help to me, always prepared and dependable. She tries to learn everything. She even goes to market better than you'd expect for her age, and with my help she keeps the accounts wonderfully. We've been very economical so far. Just as you wished, I give the girls coffee only once a week and feed them plain, wholesome food. Amy is doing well without fretting, as long as she wears her best clothes and eats sweets.
        - id: ch05-b06
          speaker: hannah
          text: Mr. Laurie is as full of tricks as ever and often turns the house upside down. But he cheers the girls, so I let them have their fun. The old gentleman sends heaps of things. He can be rather trying, but he means well, and it isn't my place to say anything. My bread has risen, so I must stop. Give my duty to Mr. March. I hope he's seen the last of his pneumonia. Yours respectfully, Hannah Mullet.
    - id: ch06
      title: Reports from Next Door
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Laurie's note turned the March household into a military camp. He addressed his report to the head nurse of Ward Number Two.
        - id: ch06-b02
          speaker: laurie
          text: All is peaceful on the Rappahannock. The troops are in excellent condition, and the supplies are well managed. The Home Guard, commanded by Colonel Teddy, is always on duty. General Laurence, our commander in chief, reviews the army every day. Quartermaster Mullet keeps order in camp, and Major Lion stands guard at night. When good news arrived from Washington, we fired a salute of twenty-four guns and held a dress parade at headquarters. The commander in chief sends his best wishes, heartily seconded by Colonel Teddy.
        - id: ch06-b03
          speaker: narrator
          text: Last came a short, firm letter from Mr. Laurence himself.
        - id: ch06-b04
          speaker: mr_laurence
          text: Dear Madam, the little girls are all well. Beth and my boy report to me every day. Hannah is a model servant and guards pretty Meg like a dragon. I'm glad the fine weather continues. Please make Brooke useful, and draw on me if your expenses are greater than you expected. Do not let your husband lack anything. Thank God he is recovering. Your sincere friend and servant, James Laurence.
