  chapters:
    - id: ch01
      title: CHAPTER TWENTY-FOUR GOSSIP
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Before we begin again and head to Meg's wedding, let's catch up with the March family. Some older listeners may think there is too much talk of love by now. The younger ones probably won't complain. Mrs. March would only say, "What else can you expect? I have four cheerful girls in the house and a handsome young neighbor across the way."
        - id: ch01-b02
          speaker: narrator
          text: Three years had passed, with few changes in that quiet family. The war was over, and Mr. March was safely home. He spent his days among his books and served a small parish. He was a minister by both nature and faith, a quiet scholar with wisdom deeper than learning. He called every person his brother, and his beliefs had grown into a noble, loving character.
        - id: ch01-b03
          speaker: narrator
          text: Poverty and strict honesty kept him from worldly success, but good people gathered around him as bees gather around sweet herbs. He gave them honey drawn from fifty hard years without a bitter drop in it. Earnest young men found that the gray-haired scholar was young at heart. Worried women trusted him with their doubts and received gentle sympathy and wise advice. People confessed their wrongs to him and left both corrected and helped. Gifted men found a true companion, while ambitious men began to see better things worth striving for. Even worldly people admitted that his beliefs were beautiful and true, though they said those beliefs would never make money.
        - id: ch01-b04
          speaker: narrator
          text: From the outside, it looked as if the five energetic women ruled the house. In many ways, they did. Still, the quiet man among the books remained the head of the family, their conscience, anchor, and comfort. Whenever trouble came, the busy women turned to him. He was, in the deepest meaning of the words, their husband and father.
        - id: ch01-b05
          speaker: narrator
          text: The girls trusted their hearts to their mother and their souls to their father. Both parents had lived and worked faithfully for them. In return, the girls gave them a love that grew as they grew, binding the family together with a tie that blesses life and lasts beyond death.
        - id: ch01-b06
          speaker: narrator
          text: Mrs. March was as brisk and cheerful as ever, though her hair was grayer. Just then, Meg's affairs took up so much of her attention that the wounded soldiers and soldiers' widows she still visited greatly missed her.
        - id: ch01-b07
          speaker: narrator
          text: John Brooke had served bravely for a year. Then he was wounded, sent home, and forbidden to return. He received no military honors, but he deserved them. He had willingly risked everything, at a time when life and love were especially precious to him. He accepted his discharge without complaint and put his energy into recovering, preparing for work, and earning a home for Meg. Mr. Laurence offered him more generous help, but John chose a bookkeeper's position. An honest salary pleased his independent nature far more than borrowed money and its risks.
        - id: ch01-b08
          speaker: narrator
          text: Meg had worked while she waited. She became more mature, learned how to manage a home, and grew prettier than ever. Love can do that. She still had a young woman's hopes, and the humble beginning ahead disappointed her sometimes. Ned Moffat had married Sallie Gardiner, who had a grand house, a carriage, fine presents, and a splendid wedding outfit. Meg could not help wishing for the same things. But then she remembered all the patient love and labor John had put into their little home. When they sat together at twilight and discussed their modest plans, the future looked so bright that Sallie's splendor faded away. Meg felt like the richest and happiest girl in the world.
        - id: ch01-b09
          speaker: narrator
          text: Jo never returned to work for Aunt March. The old lady had taken such a liking to Amy that she offered her lessons with an excellent drawing teacher. Amy would have endured a much harder mistress for that chance. She spent her mornings doing her duty, enjoyed her afternoons, and did very well. Jo devoted herself to writing and to Beth. Beth had remained delicate long after her fever. She was not exactly an invalid, but she never became the rosy, sturdy girl she had once been. Even so, she stayed hopeful, peaceful, and happy. She kept busy with the quiet tasks she loved, befriended everyone, and became the angel of the house long before those who loved her understood it.
        - id: ch01-b10
          speaker: narrator
          text: The Spread Eagle paid Jo a dollar a column for what she called her rubbish, so she felt quite wealthy and steadily spun out little romances. Larger plans were bubbling in her busy mind. Up in the attic, the old tin kitchen held a growing stack of ink-blotted pages. One day, Jo believed, those pages would make the name March famous.
        - id: ch01-b11
          speaker: narrator
          text: Laurie had dutifully gone to college to please his grandfather. Now he was making his way through it as easily as possible to please himself. Money, manners, talent, and a wonderfully kind heart made him popular with everyone. That kind heart often got him into trouble because he was always trying to get somebody else out of it. He might easily have been spoiled. What protected him was the thought of the good old grandfather whose happiness rested on his success, the motherly friend who watched him like a son, and, not least, four innocent girls who loved him, admired him, and believed in him completely.
        - id: ch01-b12
          speaker: narrator
          text: Laurie was only a splendid, ordinary boy. He fooled around, flirted, dressed like a dandy, took up boating, became sentimental, or threw himself into athletics, depending on the latest college fashion. He hazed other students and got hazed himself. He used college slang and came dangerously close to suspension or expulsion more than once. His high spirits and love of fun caused the trouble, so he usually saved himself by confessing honestly, making things right, or talking people around with his remarkable charm. He could be frank about his fault, honorable about repairing it, and nearly impossible to resist when he decided to persuade someone.
        - id: ch01-b13
          speaker: narrator
          text: He was rather proud of those narrow escapes. The girls loved his dramatic stories about defeating angry tutors, solemn professors, and other enemies. They saw the men in his class as heroes and never tired of hearing about "our fellows." Sometimes Laurie brought these grand creatures home. Then the girls could sit in the glow of their attention and listen to college adventures from the heroes themselves.
        - id: ch01-b14
          speaker: narrator
          text: Amy enjoyed that honor most and became quite popular among the young men. She had discovered early that she could be charming, and she knew how to use the gift. Meg cared only for her own particular John. Beth was too shy to do more than peek at the visitors and wonder how Amy dared order them around. Jo felt perfectly at ease with them. In fact, she had trouble keeping herself from copying their poses, phrases, and daring tricks, which seemed more natural to her than the proper behavior expected of young ladies. They all liked Jo enormously, but none fell in love with her. Very few, however, escaped without giving Amy a sentimental sigh or two. And that brings us naturally to the Dovecote.
        - id: ch01-b15
          speaker: narrator
          text: The Dovecote was the little brown house John Brooke had prepared as Meg's first home. Laurie had named it. He said it suited the gentle lovers, who went along like two turtledoves, first with a bill and then with a coo. The house was tiny. A small garden sat behind it, and the front lawn was about the size of a handkerchief. Meg planned a fountain, shrubs, and masses of beautiful flowers. For now, the fountain was a battered old urn that looked like a broken washbowl. The shrubs were a few young larches that had not decided whether to live or die. Sticks planted in rows promised where the future flowers would grow.
        - id: ch01-b16
          speaker: narrator
          text: Inside, though, the place was charming, and the delighted bride found nothing wrong from attic to cellar. The hall was so narrow that it was lucky they had no piano, because a piano could never have entered in one piece. Six people barely fit in the dining room. The kitchen stairs seemed designed to send both servants and dishes tumbling into the coal bin. Once you got used to those little faults, everything felt complete. Good sense and good taste had guided the furnishing. There were no marble tables, tall mirrors, or lace curtains in the parlor. Instead, it held simple furniture, plenty of books, one or two fine pictures, flowers in the bay window, and pretty gifts everywhere. Friendly hands had sent them, and the loving messages made each one lovelier.
        - id: ch01-b17
          speaker: narrator
          text: Laurie's statue of Psyche was no less beautiful because John himself put up its bracket. No professional could have draped the plain muslin curtains more gracefully than Amy did. And no storeroom could have held more good wishes, jokes, and hopes than the one where Jo and her mother unpacked Meg's few boxes, barrels, and bundles. Hannah arranged every pot and pan in the brand-new kitchen at least a dozen times. She wanted it cozy and neat, and she laid the fire so it could be lit the instant Mrs. Brooke came home. Beth supplied so many dusters, pot holders, and scrap bags that they might last until Meg's silver wedding anniversary. For the bridal dishes alone, she invented three different kinds of dishcloths.
        - id: ch01-b18
          speaker: narrator
          text: People who pay others to do all this never know what they miss. Even the plainest work becomes beautiful when loving hands do it. Meg found so many signs of that love that everything in her little nest seemed to speak of home, from the kitchen rolling pin to the silver vase in the parlor.
        - id: ch01-b19
          speaker: narrator
          text: They had wonderful times making plans, went on very serious shopping trips, made ridiculous mistakes, and roared with laughter over Laurie's bargains. Though he was nearly finished with college, Laurie remained as boyish as ever when a joke tempted him. On every weekly visit, he brought the young housekeeper some new object that was supposedly useful and clever. He presented each discovery as if no well-run home could possibly do without it. One week it was a bag of remarkable clothespins. Next came a nutmeg grater that fell apart the first time anyone tried it. He found a knife cleaner that ruined knives and a carpet sweeper that removed the carpet's surface while leaving the dirt behind. His labor-saving soap took the skin off people's hands. His wonderful glue stuck to nothing except the buyer's fingers. He brought tin objects of every kind, from a toy bank for spare pennies to a steam boiler that washed clothes while looking likely to explode in the process.
        - id: ch01-b20
          speaker: narrator
          text: Meg begged him to stop, but it did no good. John laughed, and Jo called him Mr. Toodles. Laurie was determined to support American inventions and make sure his friends owned every proper household convenience. Each week brought another absurd gift.
        - id: ch01-b21
          speaker: narrator
          text: At last, everything was ready. Amy had even arranged soaps in different colors to match the rooms, and Beth had set the table for the first meal. Mrs. March and Meg walked arm in arm through Meg's new kingdom. With the wedding so close, mother and daughter held each other more tenderly than ever.
        - id: ch01-b22
          speaker: mrs_march
          text: Are you satisfied, dear? Does it feel like home? Do you think you'll be happy here?
        - id: ch01-b23
          speaker: narrator
          text: Meg's look answered even better than her words could.
        - id: ch01-b24
          speaker: meg
          text: Yes, Mother. Completely. You've all done so much, and I'm so happy I can hardly talk about it.
          emotion: happy
        - id: ch01-b25
          speaker: narrator
          text: Amy came out of the parlor, where she had been deciding whether a bronze statue of Mercury looked better on the little shelf or the mantel.
        - id: ch01-b26
          speaker: amy
          text: It would all be perfect if she only had one or two servants.
        - id: ch01-b27
          speaker: meg
          text: Mother and I discussed that, and I'm going to try her way first. There won't be much to do. Lotty can run errands and help now and then. That will leave me just enough work to keep me from getting lazy or missing home.
          emotion: calm
        - id: ch01-b28
          speaker: amy
          text: Sallie Moffat has four servants.
        - id: ch01-b29
          speaker: narrator
          text: Jo was polishing the door handles in a huge blue apron, and she cut in at once.
        - id: ch01-b30
          speaker: jo
          text: If Meg had four servants, there'd be no room left for her and John. They'd have to camp in the garden.
        - id: ch01-b31
          speaker: mrs_march
          text: Sallie isn't marrying a poor man. Four maids suit her grand home. Meg and John are starting simply, but I believe this little house will hold just as much happiness as that big one. Young wives make a serious mistake when they leave themselves nothing to do except dress, give orders, and gossip. When I was first married, I actually hoped my new clothes would wear out or tear so I could mend them. I grew thoroughly tired of fancy sewing and taking care of my handkerchief.
        - id: ch01-b32
          speaker: meg
          text: Why didn't you go into the kitchen and make a mess? Sallie says she does that for fun, though nothing turns out right and the servants laugh at her.
        - id: ch01-b33
          speaker: mrs_march
          text: After a while, I did go into the kitchen. Not to make a mess, but to have Hannah teach me how things should be done, so my servants wouldn't laugh at me. It seemed like play then. Later, I was deeply thankful that I had both the wish and the ability to cook good food for my little girls and manage for myself when I couldn't afford help. You're beginning at the opposite end, Meg. Still, what you learn now will help when John earns more. No matter how splendid a house may be, its mistress should understand the work if she expects it to be done well and honestly.
        - id: ch01-b34
          speaker: meg
          text: Yes, Mother. I'm sure you're right. And you know, I think I like this room best in my whole little house.
        - id: ch01-b35
          speaker: narrator
          text: Meg had listened respectfully to the small lecture. Even the best women can go on at length when the all-important subject of housekeeping comes up. A minute later, they went upstairs, and she looked into her well-filled linen closet. Beth was there, laying each snowy pile smoothly on its shelf and taking great delight in the generous supply. All three laughed when Meg called it her favorite room, because the linen closet hid a family joke.
        - id: ch01-b36
          speaker: narrator
          text: Aunt March had declared that if Meg married "that Brooke," she would not give her a cent. After her anger cooled, she regretted the promise, but she never broke her word. At last she found a way around it. She ordered Mrs. Carrol, Florence's mother, to buy a generous supply of household and table linens, have them made and marked, and send them as her own gift. The plan worked, but the secret escaped. The family enjoyed it greatly while Aunt March pretended to know nothing and insisted she could give only the old-fashioned pearls long promised to the first bride.
        - id: ch01-b37
          speaker: mrs_march
          text: I'm glad to see such a practical favorite. I once knew a young woman who began housekeeping with only six sheets. But she owned finger bowls for company, and she thought that made everything fine.
        - id: ch01-b38
          speaker: narrator
          text: Mrs. March stroked the fine damask tablecloths with real appreciation.
        - id: ch01-b39
          speaker: meg
          text: I don't own even one finger bowl. But Hannah says this supply will last all my life.
        - id: ch01-b40
          speaker: narrator
          text: Meg looked perfectly content, and she had good reason to be. The shelves were full of household and table linens, all carefully made and marked for her.
        - id: ch01-b41
          speaker: narrator
          text: Just then, a tall, broad-shouldered young man came striding down the road. His hair was cropped short, his felt hat looked like a bowl, and the tails of his coat flew behind him. Without slowing to open the gate, he stepped over the low fence and marched straight up to Mrs. March with both hands held out.
        - id: ch01-b42
          speaker: laurie
          text: Here I am, Mother! And yes, everything's all right.
        - id: ch01-b43
          speaker: narrator
          text: His last words answered her kind, questioning look. His handsome eyes met hers so openly that their usual little ceremony ended with a motherly kiss. Then Laurie handed Meg a brown paper parcel, tugged Beth's hair ribbon, stared at Jo's enormous apron, and posed before Amy in pretend admiration.
        - id: ch01-b44
          speaker: laurie
          text: For Mrs. John Brooke, with the maker's congratulations and compliments. Beth, bless you, what a lovely sight. Jo, you look refreshing. And Amy, you're becoming much too beautiful to stay single.
        - id: ch01-b45
          speaker: narrator
          text: He shook hands with everyone, and the whole room burst into talk.
        - id: ch01-b46
          speaker: meg
          text: Where's John?
        - id: ch01-b47
          speaker: laurie
          text: He stopped to get tomorrow's marriage license, ma'am.
        - id: ch01-b48
          speaker: jo
          text: Teddy, who won the last match?
        - id: ch01-b49
          speaker: narrator
          text: Even at nineteen, Jo refused to lose her interest in men's sports.
        - id: ch01-b50
          speaker: laurie
          text: We did, of course. I wish you'd been there.
        - id: ch01-b51
          speaker: amy
          text: And how is the lovely Miss Randal?
        - id: ch01-b52
          speaker: narrator
          text: Amy smiled as if the question meant more than it said. Laurie thumped his broad chest and gave a grand, tragic sigh.
        - id: ch01-b53
          speaker: laurie
          text: Crueler than ever. Can't you see me wasting away?
        - id: ch01-b54
          speaker: beth
          text: What's the newest joke? Open the package, Meg, and let's see.
        - id: ch01-b55
          speaker: narrator
          text: Beth watched the lumpy parcel with curiosity. When Meg opened it, a watchman's wooden rattle appeared, and the girls laughed.
        - id: ch01-b56
          speaker: laurie
          text: Every house needs one in case of fire or burglars. Whenever John's away and you get scared, Mrs. Meg, wave this out the front window. You'll wake the whole neighborhood in no time. Isn't it wonderful?
        - id: ch01-b57
          speaker: narrator
          text: Laurie demonstrated its power so loudly that everyone covered her ears.
        - id: ch01-b58
          speaker: laurie
          text: What gratitude! That reminds me, you should thank Hannah for saving your wedding cake. I saw it going into the house, and if she hadn't defended it so bravely, I'd have taken a taste. It looked especially full of raisins.
        - id: ch01-b59
          speaker: meg
          text: Laurie, will you ever grow up?
        - id: ch01-b60
          speaker: narrator
          text: Meg used her most grown-up tone.
        - id: ch01-b61
          speaker: laurie
          text: I'm trying my best, ma'am, but I doubt I'll get much taller. Six feet is about the limit for men these days.
        - id: ch01-b62
          speaker: narrator
          text: His head was almost level with the little chandelier. Before long, he remembered his hunger.
        - id: ch01-b63
          speaker: laurie
          text: Eating in this spotless little paradise would probably be a crime. Since I'm starving, I suggest we move somewhere else.
        - id: ch01-b64
          speaker: meg
          text: Mother and I are waiting for John. We still have a few last things to settle.
        - id: ch01-b65
          speaker: narrator
          text: Meg hurried away to her work.
        - id: ch01-b66
          speaker: amy
          text: Beth and I are going to Kitty Bryant's for more flowers for tomorrow.
        - id: ch01-b67
          speaker: narrator
          text: Amy tied a pretty hat over her curls and enjoyed the effect as much as anyone else did.
        - id: ch01-b68
          speaker: laurie
          text: Come on, Jo. Don't abandon me. I'm so weak from hunger that I can't reach home without help. And please don't take off that apron. It looks especially becoming.
        - id: ch01-b69
          speaker: narrator
          text: Jo stuffed the hated rattle into her large pocket and offered Laurie her arm to support his supposedly failing steps. They set off together.
        - id: ch01-b70
          speaker: jo
          text: Now, Teddy, I need to speak seriously about tomorrow. Promise you'll behave and won't ruin our plans with any tricks.
        - id: ch01-b71
          speaker: laurie
          text: Not one trick.
        - id: ch01-b72
          speaker: jo
          text: And don't make jokes when we're supposed to be solemn.
        - id: ch01-b73
          speaker: laurie
          text: I never do that. You're the one who does.
        - id: ch01-b74
          speaker: jo
          text: And please don't look at me during the ceremony. If you do, I know I'll laugh.
        - id: ch01-b75
          speaker: laurie
          text: You won't even see me. You'll cry so hard that the fog around you will hide everything.
        - id: ch01-b76
          speaker: jo
          text: I only cry over terrible disasters.
        - id: ch01-b77
          speaker: laurie
          text: Like a certain fellow leaving for college?
        - id: ch01-b78
          speaker: narrator
          text: Laurie laughed knowingly.
        - id: ch01-b79
          speaker: jo
          text: Don't be so proud of yourself. I only groaned a little to keep the other girls company.
        - id: ch01-b80
          speaker: laurie
          text: Naturally. So, Jo, how is Grandpa this week? Is he in a good mood?
        - id: ch01-b81
          speaker: jo
          text: Very good. Why? Have you gotten into trouble and want to know how he'll react?
        - id: ch01-b82
          speaker: narrator
          text: Her question came out rather sharply. Laurie stopped walking and looked hurt.
        - id: ch01-b83
          speaker: laurie
          text: Jo, do you honestly think I'd look your mother in the eye and say everything was all right if it wasn't?
        - id: ch01-b84
          speaker: jo
          text: No, I don't.
        - id: ch01-b85
          speaker: laurie
          text: Then don't be suspicious. I just need some money.
        - id: ch01-b86
          speaker: narrator
          text: Satisfied by her sincere answer, Laurie began walking again.
        - id: ch01-b87
          speaker: jo
          text: You spend an awful lot, Teddy.
        - id: ch01-b88
          speaker: laurie
          text: I don't spend it. Somehow it spends itself, and it's gone before I notice.
        - id: ch01-b89
          speaker: jo
          text: You're so generous that you lend money to everyone and can't refuse anybody. We heard about Henshaw and everything you did for him. If all your money went to things like that, no one would blame you.
        - id: ch01-b90
          speaker: laurie
          text: Oh, he made it sound much bigger than it was. I couldn't let such a fine fellow work himself to death when a little help would stop it. He's worth twelve lazy fellows like us.
        - id: ch01-b91
          speaker: jo
          text: Of course you couldn't. But why do you need seventeen vests, piles of neckties, and a new hat every time you come home? I thought your dandy phase had ended, but it keeps breaking out again. Right now, everyone wants to look ugly. You cut your hair like a scrub brush, squeeze into a tight coat, pull on orange gloves, and stomp around in heavy square-toed boots. If ugliness were cheap, I wouldn't mind. But it costs just as much, and I don't even get the pleasure of seeing you look nice.
        - id: ch01-b92
          speaker: narrator
          text: Laurie threw back his head and laughed so hard that his felt hat fell off. Jo stepped on it. That insult only gave him a chance to praise the usefulness of rough clothing while he folded the crushed hat and pushed it into his pocket.
        - id: ch01-b93
          speaker: laurie
          text: Please stop lecturing, there's a good friend. I hear enough lectures all week, and I want to enjoy myself at home. Tomorrow I'll dress beautifully, no matter what it costs, and make all my friends proud.
        - id: ch01-b94
          speaker: jo
          text: I'll stop if you let your hair grow. I'm not a snob, but I do mind being seen with someone who looks like a young prizefighter.
        - id: ch01-b95
          speaker: laurie
          text: This simple hairstyle helps us study. That's why we choose it.
        - id: ch01-b96
          speaker: narrator
          text: Vanity certainly had not caused Laurie to sacrifice his handsome curls for hair only a quarter of an inch long. After a quiet minute, he changed the subject and spoke like a concerned older brother.
        - id: ch01-b97
          speaker: laurie
          text: By the way, Jo, I think little Parker is becoming serious about Amy. He talks about her constantly, writes poetry, and wanders around looking lovesick. We should stop this little romance before it grows, don't you think?
        - id: ch01-b98
          speaker: jo
          text: Of course we should. This family has had enough weddings for years. Goodness, what are those children thinking?
        - id: ch01-b99
          speaker: narrator
          text: Jo looked deeply shocked, though Amy and little Parker were both nearly in their teens.
        - id: ch01-b100
          speaker: laurie
          text: Young people move fast now, ma'am. Who knows where it will end? You're only a baby yourself, but you'll marry next. Then the rest of us will be left to mourn.
        - id: ch01-b101
          speaker: jo
          text: Don't worry. I'm not the charming kind. Nobody will want me, and that's lucky. Every family ought to have one old maid.
        - id: ch01-b102
          speaker: narrator
          text: Laurie glanced sideways at her, and a little more color rose in his sun-browned face.
        - id: ch01-b103
          speaker: laurie
          text: You never give anyone a chance. You hide the gentle part of yourself. If a fellow happens to see it and lets you know he likes it, you throw cold water on him and turn so prickly that he can't come near you.
        - id: ch01-b104
          speaker: jo
          text: I don't like that sort of thing. I'm too busy for romantic nonsense, and I hate how marriage breaks families apart. Don't say anything else about it. Meg's wedding has made us all foolish. We talk about nothing but lovers and other absurd things. I don't want to lose my temper, so let's discuss something else.
        - id: ch01-b105
          speaker: narrator
          text: Jo looked ready to throw cold water at the smallest excuse. Whatever Laurie felt, he released it in one long, low whistle. When they parted at the gate, he left her with a dreadful prediction.
        - id: ch01-b106
          speaker: laurie
          text: Remember what I said, Jo. You'll be next.
