audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着邀请听众继续故事的语气
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
    meg:
      display_name: 梅格
      tts: {delivery: 端庄温和，语气稳重, timbre: 柔润, pace: 适中, pitch: 中音}
    jo:
      display_name: 乔
      tts: {delivery: 爽直活泼，情感来得快而真, timbre: 明亮有力, pace: 稍快, pitch: 中音}
    amy:
      display_name: 艾米
      tts: {delivery: 讲究而伶俐，偶尔流露稚气, timbre: 清脆, pace: 适中, pitch: 中高音}
    beth:
      display_name: 贝丝
      tts: {delivery: 温柔真挚，病后略显轻弱, timbre: 甜美纤细, pace: 舒缓, pitch: 中高音}
    mrs_march:
      display_name: 马奇太太
      tts: {delivery: 慈爱沉静，话语令人安心, timbre: 温厚柔和, pace: 从容, pitch: 中低音}
    laurie:
      display_name: 劳里
      tts: {delivery: 机灵热情，笑意藏不住, timbre: 清朗, pace: 轻快, pitch: 中音}
  chapters:
    - id: ch01
      title: 三年以后
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我们就轻轻松松地重新开篇，去参加梅格的婚礼吧。不过在那以前，得先聊一聊马奇一家。年长的听众要是嫌这故事里谈情说爱太多，年轻人多半不会有这个意见，那我只能借马奇太太的话来回答。
        - id: ch01-b02
          speaker: mrs_march
          text: 家里有四个快活的姑娘，对面又住着一位英俊潇洒的年轻邻居，你还能指望故事里不谈爱情吗？
        - id: ch01-b03
          speaker: narrator
          text: 三年过去了，这个安静的家并没有多少变化。战争已经结束，马奇先生平安回到家里，一面读书，一面照管一个小教区。那里的人很快发现，他天生就有一颗牧者的心。他安静好学，却有比学问更可贵的智慧。他爱世上的人，把每个人都当作兄弟。他的信仰没有停在口头上，而是落进了品格里，让他既庄重，又亲切。
        - id: ch01-b04
          speaker: narrator
          text: 家里依旧贫寒，他那刚正的性情也不肯迎合世俗，所以谈不上飞黄腾达。可他的美德像香草招来蜜蜂，许多值得尊敬的人自然而然来到他身边。他也把自己五十年艰辛阅历酿成的蜜送给他们，而那蜜里竟没有一点苦味。
        - id: ch01-b05
          speaker: narrator
          text: 热心的年轻人看见这位白发学者，原来有一颗和自己同样年轻的心。爱思考的妇人，或是正被烦恼折磨的妇人，总愿意把疑惑带给他，因为她们知道，自己会得到最温柔的理解和最明智的指点。犯过错的人向他坦白，既会受责备，也会得到挽救。有才华的人把他当知己，有野心的人在他身上看见了比个人抱负更高的志向。就连只看实际的人也承认，他信奉的道理又美好又真实，只不过靠那些道理挣不到钱。
        - id: ch01-b06
          speaker: narrator
          text: 外人看起来，这个家由五个精力旺盛的女人当家，许多事情也确实如此。可是，那个安静坐在书堆里的人，仍是全家的主人，是她们的良知、锚和安慰。忙忙碌碌的女人们一遇上风浪，就会转向他，也总能从他身上明白两个神圣称呼真正的分量，那就是丈夫和父亲。
        - id: ch01-b07
          speaker: narrator
          text: 姑娘们把心交给母亲守护，把灵魂托付给父亲。父母忠诚地生活，辛苦地为她们操劳，她们对父母的爱也跟着年岁一起长大。这份最甜美的牵系，把一家人温柔地连在一起。它祝福人的一生，也比死亡更长久。
        - id: ch01-b08
          speaker: narrator
          text: 马奇太太还是从前那样利落开朗，只是头发又白了一些。眼下，她一门心思忙着梅格的婚事。医院里还没痊愈的那些“小伙子”，还有许多士兵的遗孀，都在想念这位像母亲一样照顾人的朋友。
        - id: ch01-b09
          speaker: narrator
          text: 约翰·布鲁克勇敢尽责地服役了一年，后来受了伤，被送回家，再也不能归队。他没得到星章，也没有勋带，可他完全配得上那些荣誉。一个人的生命和爱情正开得最好的时候，是多么珍贵，而他愿意把这一切拿去冒险。
        - id: ch01-b10
          speaker: narrator
          text: 约翰平静地接受了退役的安排。他养好身体，又去学经商，要亲手替梅格挣出一个家。劳伦斯先生提出过更慷慨的帮助，他却只接受了一份账房工作。他一向明智，也有踏实的独立心。他宁愿从诚实挣来的薪水开始，也不愿借钱去冒险。
        - id: ch01-b11
          speaker: narrator
          text: 梅格一边等待，一边勤劳做事。她的性情更成熟了，料理家务也越来越聪明。爱情又给她添了光彩，使她比从前更漂亮。少女时代那些愿望还没有完全消失。想到自己的新生活只能这样简朴地起步，她偶尔还是会失望。
        - id: ch01-b12
          speaker: narrator
          text: 内德·莫法特刚娶了萨莉·加德纳。梅格忍不住把人家的大房子、马车、成堆的礼物和丰厚的嫁妆，同自己的东西一样样相比，也会暗暗希望自己能有那些。可她只要想到，约翰为了那个等着她的小家付出了多少耐心、爱情和辛劳，嫉妒和不满很快就散了。黄昏时，两个人坐在一起，商量一个又一个小计划，未来立刻变得又明亮又美好。萨莉的豪华被她忘在脑后，她觉得自己才是世上最富有、最幸福的姑娘。
    - id: ch02
      title: 姑娘们和劳里
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 乔没有再回马奇姑婆那里。老太太很喜欢艾米，便拿跟一位好老师学画画来吸引她。为了这个机会，就算姑婆再难伺候一些，艾米也乐意去帮忙。她上午尽自己的义务，下午享受画画的乐趣，日子过得很顺心。
        - id: ch02-b02
          speaker: narrator
          text: 乔则把心思全用在文学和贝丝身上。那场高烧已经过去很久，贝丝的身体却始终没能完全恢复。她还算不上病人，可也不再是从前那个脸色红润、身体健康的孩子了。她一直抱着希望，快活而安宁，每天做着自己喜欢的安静小事。她是每个人的朋友，也是这个家里的天使。其实，早在最爱她的人明白这一点以前，她就已经是了。
        - id: ch02-b03
          speaker: narrator
          text: 只要《展翅雄鹰报》还肯按栏付钱，每栏给她一美元，乔就觉得自己是个有收入的女人。她勤勤恳恳，纺出一篇又一篇自己口中的“胡扯”。可她那颗忙碌的脑袋和野心勃勃的心，还藏着更大的计划。阁楼的旧铁皮烤箱里，一页页改得密密麻麻的手稿越堆越高。总有一天，它们要让马奇这个姓氏进入名人之列。
        - id: ch02-b04
          speaker: narrator
          text: 劳里为了让祖父高兴，听话地进了大学。如今，他又为了让自己高兴，能省多少力气就省多少，居然也快毕业了。他有钱，有风度，也有才华，还有一颗世上最善良的心。这颗心总想替别人解围，却常把自己的主人拖进麻烦。因此人人都喜欢他，他也很容易被大家宠坏。
        - id: ch02-b05
          speaker: narrator
          text: 幸好，他一直带着一道护身符。那就是，他始终记得那位老人把自己的幸福寄托在他的成就上，也记得那位像母亲一样照顾他的朋友。还有一点绝不能漏掉。他知道，有四个纯真的姑娘全心爱他、钦佩他，也信任他。
        - id: ch02-b06
          speaker: narrator
          text: 不过，他到底只是一个活蹦乱跳的普通男孩。他会嬉闹，也会调情，还会追着大学里的风尚跑。一阵子讲究穿戴，一阵子热衷划船，过些日子又多愁善感，接着再迷上体操。他捉弄过新生，也被别人捉弄过。他满口俚语，不止一次差点被停学，甚至被开除。
        - id: ch02-b07
          speaker: narrator
          text: 好在那些胡闹都是精力太旺、贪玩惹的祸。每次出了事，他总能坦白认错，再光明正大地补救。实在不行，他还会使出那套熟练又难以抵挡的劝说本领，把自己救回来。他甚至很为这些险些闹成大祸的经历得意，常常绘声绘色地告诉姑娘们，自己怎样胜过发怒的导师、威严的教授和落败的对手，吓得她们心惊肉跳。
        - id: ch02-b08
          speaker: narrator
          text: 姑娘们把“我们班那些伙计”全当成英雄，怎么听也听不够“我们那帮人”的壮举。劳里带同学回家时，她们还有机会亲眼见到这些伟大人物，沐浴在他们的笑容里。
        - id: ch02-b09
          speaker: narrator
          text: 艾米最喜欢这份荣耀，在他们中间也很受欢迎。这位大小姐很早就发现，自己天生懂得怎样吸引人，没多久便学会了怎样使用这种本领。梅格心里只有她那独一无二的约翰，根本顾不上别的年轻男子。贝丝太害羞，只敢偷偷看几眼，还总纳闷艾米怎么敢随意指使他们。
        - id: ch02-b10
          speaker: narrator
          text: 乔跟那些男孩子待在一起倒自在极了。她总要费好大的劲，才能忍住不去学他们的动作、说法和把戏。她觉得，那一套比年轻淑女的规矩自然多了。他们人人喜欢乔，却没有一个爱上她。艾米的魅力倒让他们几乎个个忍不住为她叹上一两口气。既然话说到了多情，我们也该去看看“鸽子窝”了。
    - id: ch03
      title: 鸽子窝
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: “鸽子窝”是布鲁克先生替梅格准备的第一个家。名字是劳里取的。他说，这名字正配那对温柔的恋人，因为他们活像一双斑鸠，先是你啄我一口，转眼又凑在一起咕咕低语。
        - id: ch03-b02
          speaker: narrator
          text: 那是一幢褐色的小房子，小得十分可爱。屋后有一座小花园，前面的草坪只有手帕那么大。梅格打算安一座喷泉，种上灌木，再栽满漂亮的花。眼下呢，喷泉只是一只风吹雨打过的旧瓮，看起来很像破洗脸盆。灌木是几棵小落叶松，还没决定自己究竟要活还是要死。至于将来满园鲜花的景象，只能先看地上一排排小木棍。它们标出了花种埋下的位置。
        - id: ch03-b03
          speaker: narrator
          text: 屋子里却实在迷人。幸福的新娘从阁楼一直看到地窖，哪里都觉得满意。门厅确实窄得可怜。幸好他们没有钢琴，不然一架完整的钢琴绝对搬不进去。饭厅里坐上六个人就挤得难受。厨房楼梯更像是特意设计出来，好让女佣连人带瓷器一起滚进煤窖。
        - id: ch03-b04
          speaker: narrator
          text: 不过，只要习惯了这些小缺点，整幢房子就再周全不过。屋里的布置处处看得出常识和好品位，效果十分舒服。小客厅没有大理石桌面，没有长镜子，也没有蕾丝窗帘。这里有的是朴素的家具、许多书、一两幅好画，还有凸窗里的一架鲜花。精美的礼物散放在屋子各处，每一件都由朋友亲手做成，也带着他们的爱，所以看起来格外美。
        - id: ch03-b05
          speaker: narrator
          text: 劳里送来一尊仿大理石的普绪克雕像，约翰亲手钉好托架，把它放稳。这并没有让雕像少一分美。艾米挂起几幅素净的细棉布窗帘，恐怕哪个装潢工都不会比她做得更雅致。乔和母亲把梅格仅有的几只箱子、木桶和包裹搬进储藏室，也把祝福、笑声和欢快的盼望一同放了进去。世上很难再找出一间这样充实的储藏室。
        - id: ch03-b06
          speaker: narrator
          text: 新厨房所以显得整齐又温暖，全靠汉娜把每只锅和每个平底锅翻来覆去安置了十几遍。她连炉火都准备妥当，只等布鲁克太太回家，便马上点起来。年轻主妇开始新生活时，恐怕也很少有人备下这么多抹布、隔热垫和碎布袋。那些全是贝丝做的，够梅格一直用到银婚纪念日。贝丝还特意替新婚瓷器发明了三种不同的洗碗布。
        - id: ch03-b07
          speaker: narrator
          text: 什么事都雇别人来做的人，不会知道自己错过了什么。再普通的活计，只要由充满爱意的手完成，也会变得美好。梅格在自己的小窝里到处都看得见这样的证明。从厨房里的擀面杖，到客厅桌上的银花瓶，每样东西都在讲述家人的爱，还有他们周到的心意。
        - id: ch03-b08
          speaker: narrator
          text: 大家一起筹划时快活极了。每次出门采买，又总是郑重得不得了。他们犯过不少滑稽的错误，也常被劳里买来的荒唐便宜货逗得大笑。这个快从大学毕业的年轻人，一遇上玩笑还是个十足的孩子。他最近有了一个怪念头。每星期来访，都要给年轻主妇带来一样新奇、实用又精巧的东西。
        - id: ch03-b09
          speaker: narrator
          text: 这星期是一袋古怪的衣夹，下星期是一把神奇的肉豆蔻刨，可它头一回使用就散了架。还有一架擦刀器，把所有刀都毁了。一把扫帚能整齐地扫掉地毯绒毛，却把灰尘原封不动地留下。一种省力肥皂没洗掉污垢，倒洗掉了手上的皮。号称绝对牢靠的胶，除了上当的买主那几根手指，什么都粘不住。
        - id: ch03-b10
          speaker: narrator
          text: 铁皮器具更是五花八门。小到存零钱的玩具罐，大到一只奇妙的蒸汽锅。那只锅声称能靠自己的蒸汽把衣服洗净，实际却随时都像要爆炸。梅格求劳里别再买了，可一点用也没有。约翰只管笑，乔干脆叫他“图德尔斯先生”。劳里像是着了魔，非要支持美国佬的聪明发明，也非要把朋友们装备得样样齐全。于是，每星期都会有一种新的荒唐东西登门。
        - id: ch03-b11
          speaker: narrator
          text: 最后，一切总算安排好了。就连艾米也把不同颜色的肥皂放进颜色相配的房间。贝丝则把第一顿饭的餐桌铺得妥妥当当。
    - id: ch04
      title: 新家的最后准备
      blocks:
        - id: ch04-b01
          speaker: mrs_march
          text: 梅格，你满意吗？这里已经像个家了吗？你觉得自己会在这儿过得幸福吗？
        - id: ch04-b02
          speaker: narrator
          text: 马奇太太挽着女儿的手臂，陪她走遍这片小小的新王国。分别的日子就在眼前，这会儿，母女俩比任何时候都更舍不得对方。
        - id: ch04-b03
          speaker: meg
          text: 满意，妈妈，我样样都满意。你们大家为我做了这么多，我幸福得……我真不知道该怎么说。
          emotion: happy
        - id: ch04-b04
          speaker: narrator
          text: 梅格脸上的神情，已经把千言万语都说尽了。
        - id: ch04-b05
          speaker: amy
          text: 要是再有一两个女佣，那就真的什么都不缺了。
        - id: ch04-b06
          speaker: narrator
          text: 艾米从客厅里走出来。刚才，她一直拿不定主意，那尊青铜墨丘利像究竟该放在古玩架上，还是摆在壁炉台上。
        - id: ch04-b07
          speaker: meg
          text: 这件事我已经跟妈妈商量过了。我想先照她说的试一试。家里没多少活，洛蒂可以替我跑腿，偶尔也能来帮忙。剩下的那些正好由我自己做，免得我闲下来犯懒，或者只顾着想家。
        - id: ch04-b08
          speaker: amy
          text: 可萨莉·莫法特家里有四个女佣呢。
        - id: ch04-b09
          speaker: jo
          text: 梅格要是也雇四个，这屋子可塞不下。老爷和太太只好搬到花园里搭帐篷了。
        - id: ch04-b10
          speaker: narrator
          text: 乔套着一件宽大的蓝围裙，正在给门把手做最后一次擦亮。
        - id: ch04-b11
          speaker: mrs_march
          text: 萨莉嫁的不是穷人。她家要摆出那样的气派，自然得用许多女佣。梅格和约翰虽然从简朴的日子开始，可我相信，这幢小房子里的幸福不会比大宅子少。像梅格这样的年轻姑娘，如果除了打扮、吩咐人和说闲话，再也没有事情可做，那才糟糕呢。
        - id: ch04-b12
          speaker: mrs_march
          text: 我刚结婚的时候，甚至盼着新衣服快点穿破，或者撕开一道口子，好让我享受缝补的乐趣。我整天只能做漂亮针线，再照料那些手绢，实在厌烦透了。
        - id: ch04-b13
          speaker: meg
          text: 那您怎么不去厨房里胡闹一番呢？萨莉说，她常拿这个消遣。虽然她每次都做不好，女佣们还会笑她。
        - id: ch04-b14
          speaker: mrs_march
          text: 后来我确实进了厨房，可不是去胡闹。我跟汉娜学会了每样活该怎么做，这样我的女佣就笑不了我了。起先，我也只是觉得好玩。后来有一段日子，我打心里庆幸自己不但肯做饭，还真的会给小女儿们做健康的食物。等我再也雇不起帮手，仍旧能靠自己把日子过下去。
        - id: ch04-b15
          speaker: mrs_march
          text: 亲爱的，你是从另一头开始。不过你现在学会的本领，就算将来约翰富裕了，还是会派上用场。不管一个家多么体面，女主人想让佣人忠心又妥当地做事，自己就得知道每一件活到底应该怎么做。
        - id: ch04-b16
          speaker: meg
          text: 是的，妈妈，我也真心相信这一点。
        - id: ch04-b17
          speaker: narrator
          text: 梅格恭恭敬敬地听完母亲这一小段训话。再好的女人，一说到最要紧的家务，也难免越说越多。过了一会儿，她们走到楼上。梅格朝塞得满满的布草柜里望去，又开了口。
        - id: ch04-b18
          speaker: meg
          text: 您知道吗？这座娃娃屋里，我最喜欢的就是这间屋子。
        - id: ch04-b19
          speaker: narrator
          text: 贝丝正在柜子里，把一摞摞雪白的布草铺平，再摆上搁板。她看着这片丰厚的储备，心里十分得意。梅格一开口，三个人全笑了。原来，这只布草柜一直是全家的一桩笑谈。
        - id: ch04-b20
          speaker: narrator
          text: 马奇姑婆从前说过，梅格要是嫁给“那个布鲁克”，她一个子儿也不给。后来，时间让她消了气，她又后悔起自己发过的誓，可她绝不肯食言。想来想去，她终于找出一个能让自己心安的办法。
        - id: ch04-b21
          speaker: narrator
          text: 她吩咐弗洛伦斯的母亲卡罗尔太太买下足够多的家用布草和餐桌布草，叫人缝好，再绣上记号，然后当作卡罗尔太太的礼物送来。一切都照办了，秘密却还是漏了出去，惹得全家好一阵开心。马奇姑婆竭力装作毫不知情，还坚持说，除了那串早就答应送给家里第一位新娘的老式珍珠，她什么也不能给。
        - id: ch04-b22
          speaker: mrs_march
          text: 看见你这么会过日子，我很高兴。我年轻时有个朋友，成家时只有六条床单，招待客人用的洗指碗倒是一只不少，可她已经觉得很满足了。
        - id: ch04-b23
          speaker: narrator
          text: 马奇太太轻轻摸着锦缎桌布。她像每个懂得这些东西的女人一样，真心欣赏它们的精美。
        - id: ch04-b24
          speaker: meg
          text: 我一只洗指碗也没有。不过汉娜说，这些布草够我用上一辈子了。
        - id: ch04-b25
          speaker: narrator
          text: 梅格很满足，她也的确有理由满足。
    - id: ch05
      title: 劳里的新礼物
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 这时，一个高大健壮的年轻人沿路大步走来。他的头发剪得短短的，帽子像一只毡盆，外套下摆随着脚步扬起。他连门都懒得开，一步跨过矮篱笆，直奔马奇太太，伸出双手，响亮地叫起来。
        - id: ch05-b02
          speaker: laurie
          text: 妈妈，我回来啦！对，所有事情都好好的。
        - id: ch05-b03
          speaker: narrator
          text: 后半句话是在回答长辈投来的目光。那目光亲切，却也在询问。劳里用坦然的眼睛迎了上去。于是，这套小小的仪式照旧用一个母亲般的吻收尾。
        - id: ch05-b04
          speaker: laurie
          text: 这件礼物送给约翰·布鲁克太太，制作者向您致贺，也向您致敬。上天保佑你，贝丝！乔，你今天这副样子真叫人眼前一亮。艾米，你漂亮得过了头，已经不适合继续当单身小姐啦。
        - id: ch05-b05
          speaker: narrator
          text: 劳里一边说，一边把牛皮纸包递给梅格，又扯了扯贝丝的发带。他盯着乔的大围裙看了一番，再走到艾米面前，摆出欣喜若狂的姿势。随后，他同每个人握手。屋里一下热闹起来，大家全都开了口。
        - id: ch05-b06
          speaker: meg
          text: 约翰呢？他怎么没有跟你一起回来？
        - id: ch05-b07
          speaker: laurie
          text: 他半路停下了，太太。明天结婚要用的许可证，总得先领回来呀。
        - id: ch05-b08
          speaker: jo
          text: 泰迪，上次比赛是谁赢了？
        - id: ch05-b09
          speaker: narrator
          text: 乔已经十九岁，还是固执地关心着那些男子汉的运动。
        - id: ch05-b10
          speaker: laurie
          text: 当然是我们。你要是在场就好了，真该让你亲眼看看。
        - id: ch05-b11
          speaker: amy
          text: 那位迷人的兰德尔小姐呢？她近来对你怎么样？
        - id: ch05-b12
          speaker: narrator
          text: 艾米问得意味深长，嘴角还带着笑。
        - id: ch05-b13
          speaker: laurie
          text: 她比从前更狠心了。你们难道看不出，我都被她折磨得憔悴了吗？
        - id: ch05-b14
          speaker: narrator
          text: 劳里把宽阔的胸膛拍得砰砰响，又夸张地叹了一口气。
        - id: ch05-b15
          speaker: beth
          text: 这回你又带来了什么笑话？梅格，快拆开给我们看看吧。
        - id: ch05-b16
          speaker: narrator
          text: 贝丝好奇地盯着那个凹凸不平的纸包。姑娘们笑成一片，包里露出一只守夜人用的响板。
        - id: ch05-b17
          speaker: laurie
          text: 这可是过日子少不了的实用东西，着火了能报警，来了贼也能报警。
        - id: ch05-b18
          speaker: laurie
          text: 哪回约翰不在家，您又害怕了，梅格太太，就把它伸出前窗这么一摇。用不了一会儿，四邻八舍全会醒过来。是不是好东西？
        - id: ch05-b19
          speaker: narrator
          text: 劳里当场示范响板有多厉害。那声音震得大家全捂住耳朵。
        - id: ch05-b20
          speaker: laurie
          text: 看看你们，多懂得感恩！说到感恩，我还得提醒一句。你们可要谢谢汉娜，她把结婚蛋糕救下来了。我来的路上正好看见蛋糕送进你家。要不是她英勇把守，我一定会挖一块尝尝。那蛋糕看起来塞了多得吓人的果脯。
        - id: ch05-b21
          speaker: meg
          text: 劳里，我真不知道你到什么时候才肯长大。
        - id: ch05-b22
          speaker: narrator
          text: 梅格摆出一副年轻主妇的口吻。
        - id: ch05-b23
          speaker: laurie
          text: 太太，我已经尽力了。可惜我大概长不了多少啦。如今这世道，一个男人长到六英尺也就算到头了。
        - id: ch05-b24
          speaker: narrator
          text: 年轻绅士的脑袋差不多已经碰到那盏小吊灯。过了一会儿，他又开口了。
        - id: ch05-b25
          speaker: laurie
          text: 在这个干净得发亮的小爱巢里吃东西，大概是很不敬的罪过。可我实在饿坏了，所以我提议，咱们换个地方吧。
        - id: ch05-b26
          speaker: meg
          text: 妈妈和我要留下来等约翰，还有几件最后的事情得商量。
        - id: ch05-b27
          speaker: narrator
          text: 梅格说着，忙忙碌碌地走开了。
        - id: ch05-b28
          speaker: amy
          text: 贝丝和我要去基蒂·布赖恩特家，再拿一些明天要用的花。
        - id: ch05-b29
          speaker: narrator
          text: 艾米把一顶别致的帽子系在漂亮的鬈发上。她欣赏那效果的程度，一点也不比旁观的人少。
        - id: ch05-b30
          speaker: laurie
          text: 走吧，乔，可别丢下一个可怜人。我已经饿得连家都走不回去了，非得有人扶着才行。还有，千万别脱围裙。你穿着它特别漂亮。
        - id: ch05-b31
          speaker: narrator
          text: 乔把他最讨厌的响板塞进自己的大衣袋，又伸出手臂，扶着他迈开那虚弱的步子。两个人一起慢慢走远。
        - id: ch05-b32
          speaker: jo
          text: 好了，泰迪，我得认真跟你谈谈明天的事。你必须答应我规规矩矩的，别弄出什么恶作剧，把我们的安排全毁了。
        - id: ch05-b33
          speaker: laurie
          text: 我保证，一个恶作剧也不弄。
        - id: ch05-b34
          speaker: jo
          text: 该庄重的时候，也不许说俏皮话。
        - id: ch05-b35
          speaker: laurie
          text: 我从来不说俏皮话。明明是你爱说。
        - id: ch05-b36
          speaker: jo
          text: 还有，求你行礼的时候别看我。你一看过来，我肯定会笑。
        - id: ch05-b37
          speaker: laurie
          text: 你根本看不见我。到时候你哭得太厉害，眼前全是雾，什么都遮住了。
        - id: ch05-b38
          speaker: jo
          text: 除非碰上天大的苦难，不然我从来不哭。
        - id: ch05-b39
          speaker: laurie
          text: 比方说，有个人要去上大学的时候？
        - id: ch05-b40
          speaker: narrator
          text: 劳里笑得什么都明白似的，插了一句。
        - id: ch05-b41
          speaker: jo
          text: 别像只孔雀一样得意。我不过跟着姑娘们低声叹了几口气，算是陪她们罢了。
        - id: ch05-b42
          speaker: laurie
          text: 对，一点不错。说起来，乔，祖父这个星期怎么样？脾气还好吗？
        - id: ch05-b43
          speaker: jo
          text: 好得很。怎么，你又闯祸了，所以先来打听他会怎么发作？
        - id: ch05-b44
          speaker: narrator
          text: 乔问得相当尖锐。劳里突然停住脚步，显出一副受了委屈的样子。
        - id: ch05-b45
          speaker: laurie
          text: 乔，你想一想。要是真出了什么不对的事，我还能看着你母亲的眼睛，说一切都好吗？
        - id: ch05-b46
          speaker: jo
          text: 不能。我不相信你会那样做。
        - id: ch05-b47
          speaker: laurie
          text: 那就别随便怀疑我。我只是想要一点钱。
        - id: ch05-b48
          speaker: narrator
          text: 听见乔真诚的回答，劳里不生气了，又继续往前走。
        - id: ch05-b49
          speaker: jo
          text: 可你花的钱实在太多了，泰迪。
        - id: ch05-b50
          speaker: laurie
          text: 哎呀，又不是我故意把钱花掉的。不知道怎么回事，它总会自己不见。等我发现，已经一分也没有啦。
        - id: ch05-b51
          speaker: jo
          text: 你就是太大方，心又太软。别人来借钱，你对谁都说不出一个“不”字。亨肖的事情我们已经听说了，也知道你为他做了什么。如果你的钱总是花在这种地方，谁也不会怪你。
        - id: ch05-b52
          speaker: narrator
          text: 乔说得十分热切。
        - id: ch05-b53
          speaker: laurie
          text: 啊，他把针尖那么小的一件事，说成了一座山。那个好小伙子，一个人能抵我们十二个懒汉。他只差那么一点帮助，难道你要我站在旁边，看他把自己累死吗？
        - id: ch05-b54
          speaker: jo
          text: 当然不是。可我想不明白，你为什么需要十七件背心，还有多得数不清的领带。你每次回家，头上还总戴着一顶新帽子。我以为你早过了讲究穿戴的阶段，谁知道它每隔一阵，就会从另一个地方重新冒出来。
        - id: ch05-b55
          speaker: jo
          text: 眼下最时兴的，好像是把自己弄得越丑越好。头发像一把刷锅刷子，身上勒着紧得要命的外套，手上戴橙色手套，脚下再蹬一双又笨又重的方头靴。这种丑样子要是便宜，我一句也不说。可它花的钱跟从前一样多，我看着还一点乐趣都没有。
        - id: ch05-b56
          speaker: narrator
          text: 劳里仰起头，被这一通数落逗得大笑，毡帽也从头上掉了下来。乔一脚踩上去。这份侮辱倒给了他机会。他立刻滔滔不绝，夸起这种粗犷随便的装束有多少好处。一边说，他一边把那顶受尽折磨的帽子折起来，塞进衣袋。
        - id: ch05-b57
          speaker: laurie
          text: 好心人，饶了我吧！我这个星期听到的训话已经够多了，回到家只想痛痛快快玩一场。明天我一定不惜本钱，把自己打扮得漂漂亮亮，好让朋友们看着满意。
        - id: ch05-b58
          speaker: jo
          text: 只要你肯把头发留长，我就放过你。我自己虽然不讲究，可也不愿意让人看见，我竟跟一个活像年轻拳击手的人走在一起。
        - id: ch05-b59
          speaker: narrator
          text: 乔说得很严厉。
        - id: ch05-b60
          speaker: laurie
          text: 我们采用这种朴素又不张扬的发式，是因为它对学习有帮助。
        - id: ch05-b61
          speaker: narrator
          text: 谁也不能指责劳里爱慕虚荣。为了大学里的风尚，他自愿牺牲了满头漂亮的鬈发，只留下四分之一英寸长的短茬。两人安静地走了一会儿，劳里忽然换上一种推心置腹的兄长口吻。
        - id: ch05-b62
          speaker: laurie
          text: 顺便说一句，乔，我觉得小帕克真的迷上艾米了。他张口是她，闭口也是她，又写诗，又整天魂不守舍。怎么看都很可疑。趁这点小痴情才刚刚发芽，最好赶紧掐掉。你说对不对？
        - id: ch05-b63
          speaker: jo
          text: 当然得掐掉。未来好几年，我们家都不需要再办婚礼。天哪，这些孩子脑子里到底在想什么？
          emotion: surprised
        - id: ch05-b64
          speaker: narrator
          text: 乔大吃一惊，说得仿佛艾米和小帕克还不到十三岁。
        - id: ch05-b65
          speaker: laurie
          text: 现在这个时代什么都快，谁知道人心以后会变成什么样，太太。你自己还只是个小婴儿，不过下一个就该轮到你了，乔。到时候，只剩我们在一旁唉声叹气。
        - id: ch05-b66
          speaker: narrator
          text: 劳里摇摇头，装模作样地为世风日下悲叹。
        - id: ch05-b67
          speaker: jo
          text: 你不用担心。我不是那种讨人喜欢的姑娘，谁也不会想要我。这样正好，一家人里面总得留下一个老姑娘。
        - id: ch05-b68
          speaker: narrator
          text: 劳里从旁边看了她一眼。那张晒成褐色的脸，比刚才红了一点。
        - id: ch05-b69
          speaker: laurie
          text: 是你从来不给别人机会。你不肯让人看见自己温柔的那一面。哪个家伙碰巧看见了，又忍不住露出一点喜欢，你马上就学格米吉太太，朝他兜头泼一盆冷水，再把浑身的刺都竖起来。最后，谁也不敢碰你，连看都不敢看你。
        - id: ch05-b70
          speaker: jo
          text: 我就是不喜欢这种事。我忙得很，没空让这些胡闹来烦我。再说，为了这种事把一家人拆散，实在太可怕了。好了，别再说啦。梅格的婚礼已经把大家的脑子都搅昏了，开口闭口不是情人，就是这些荒唐话。我可不想发脾气。我们换个话题吧。
        - id: ch05-b71
          speaker: narrator
          text: 乔那副模样，像是再受一点点挑衅，就真会拿一盆冷水泼过去。不管劳里心里有什么感受，他只吹了一声又长又低的口哨。两人在门口分开时，他又留下一个可怕的预言。
        - id: ch05-b72
          speaker: laurie
          text: 记住我的话，乔，下一个就是你。
