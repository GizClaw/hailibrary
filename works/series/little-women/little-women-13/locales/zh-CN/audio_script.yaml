audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机智，像在炉边从容讲述旧日家事
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情绪来得快，带一点男孩子气
        timbre: 明亮略带沙哑
        pace: 偏快
        pitch: 中低
    meg:
      display_name: 梅格
      tts:
        delivery: 温柔端庄，常带大姐姐式的认真
        timbre: 柔和圆润
        pace: 适中
        pitch: 中
    beth:
      display_name: 贝丝
      tts:
        delivery: 羞怯安静，话语真诚而体贴
        timbre: 轻柔温暖
        pace: 稍慢
        pitch: 中高
    amy:
      display_name: 艾米
      tts:
        delivery: 一本正经又有些自负，努力显得优雅
        timbre: 清脆稚嫩
        pace: 适中
        pitch: 偏高
    laurie:
      display_name: 劳里
      tts:
        delivery: 彬彬有礼而略显腼腆，熟悉以后轻松风趣
        timbre: 清朗温和
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 第十三章 空中楼阁
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 九月里一个暖洋洋的下午，劳里躺在吊床上，舒舒服服地荡来荡去。他猜着邻家的姑娘们在做什么，却懒得过去瞧。这一天，他什么事都没做好，心里正不痛快，真想从头再过一遍。天热得叫人发懒，他逃了功课，把布鲁克先生的耐心磨光了。练了半下午的琴，祖父也不高兴。他还故意吓唬女仆，说家里有条狗快要疯了，害得她们魂都快吓掉。后来，他又认定马夫没有照料好自己的马，同人家吵了一场。吵完，他往吊床里一倒，觉得整个世界都愚蠢透顶。可是四周太安静，也太美，他的气不知不觉消了。他望着七叶树荫里的绿光，做起各种各样的白日梦。刚梦到自己乘船周游世界，在海上颠簸，几个人说话的声音一下把他拉回岸边。他隔着吊床的网眼一瞧，马奇姐妹正走出门，看样子要去远征。
        - id: ch01-b02
          speaker: laurie
          text: 这些姑娘又在搞什么名堂？
        - id: ch01-b03
          speaker: narrator
          text: 劳里睁大了惺忪的眼睛。她们的打扮实在特别，每个人都戴一顶宽大松软的帽子，肩上挂着棕色亚麻布袋，手里拄着长杖。梅格拿垫子，乔带书，贝丝挎篮子，艾米夹着画夹。她们穿过花园，从后门出去，开始爬屋子与河流之间的那座小山。
        - id: ch01-b04
          speaker: laurie
          text: 真够意思，去野餐也不叫我！她们没有钥匙，肯定不是去划船。也许忘记拿了。我给她们送去，顺便看看怎么回事。
        - id: ch01-b05
          speaker: narrator
          text: 劳里明明有半打帽子，却找了半天才找到一顶。接着又到处找钥匙，最后才发觉钥匙就在自己口袋里。等他跳过篱笆追出去，姑娘们早没影了。他抄近路跑到船屋，等了又等，也不见人来，只好爬上山察看。山的一边有片松林。树林深处传来清楚的人声，盖过了松针的轻叹，也盖过了蟋蟀困倦的鸣唱。
        - id: ch01-b06
          speaker: laurie
          text: 好一幅风景画！
        - id: ch01-b07
          speaker: narrator
          text: 他从灌木间望进去，立刻清醒了，神情也开朗起来。姐妹们围坐在浓荫下，阳光和树影在她们身上闪动。带着清香的风吹动头发，也吹凉了她们热红的脸。林中那些小生灵照旧忙碌，好像来的不是生客，全是老朋友。梅格坐在垫子上，白净的双手灵巧地做着针线。粉红衣裙衬着满眼青翠，让她像一朵清新的玫瑰。贝丝在铁杉树下整理铺了满地的球果，预备拿来做漂亮的小玩意儿。艾米画着一丛蕨草，乔边念书边织东西。劳里没受邀请，本该走开，可家里太寂寞，这场安静的林中小聚又太吸引他那颗不安分的心。他站在那里，舍不得离开。一只忙着储粮的松鼠跑下旁边的松树，忽然发现了他，吓得蹿回去，尖声大骂。贝丝抬起头，看见白桦树后那张眼巴巴的脸，便安慰地笑着朝他招手。
        - id: ch01-b08
          speaker: laurie
          text: 我可以进来吗？会不会打扰你们？
        - id: ch01-b09
          speaker: narrator
          text: 他慢慢走近。梅格扬起眉毛，乔却不服气地瞪了她一眼。
        - id: ch01-b10
          speaker: jo
          text: 当然可以。我们本来就该叫你，只是怕这种女孩子的游戏，你看不上。
        - id: ch01-b11
          speaker: laurie
          text: 你们玩的东西我都喜欢。不过，梅格要是不欢迎我，我就走。
        - id: ch01-b12
          speaker: meg
          text: 我不反对。可是你也得干活，这里的规矩是不许闲着。
        - id: ch01-b13
          speaker: laurie
          text: 多谢！只要让我待一会儿，什么活都行。山下简直闷得像撒哈拉沙漠。缝东西、念书、捡球果、画画，还是全都一起做？最难的差事也尽管拿来，我准备好了。
        - id: ch01-b14
          speaker: narrator
          text: 他坐下来，摆出一副百依百顺的模样，那副神情叫人看了实在忍不住发笑。
        - id: ch01-b15
          speaker: jo
          text: 我要收袜跟。你替我把这个故事念完。
        - id: ch01-b16
          speaker: laurie
          text: 遵命，太太。
        - id: ch01-b17
          speaker: narrator
          text: 劳里恭恭敬敬地读起来，努力证明自己多么感激她们准许他加入“忙碌蜜蜂社”。故事不长。念完以后，他认定自己表现良好，理当得到一点奖赏，便壮着胆子问了几个问题。
        - id: ch01-b18
          speaker: laurie
          text: 请问，太太，这个既有教益又迷人的团体，是刚成立的吗？
        - id: ch01-b19
          speaker: meg
          text: 要告诉他吗？
        - id: ch01-b20
          speaker: amy
          text: 他会笑我们的。
        - id: ch01-b21
          speaker: jo
          text: 管他呢。
        - id: ch01-b22
          speaker: beth
          text: 我猜他会喜欢。
        - id: ch01-b23
          speaker: laurie
          text: 我当然喜欢！我保证不笑。乔，快说吧，别怕我。
        - id: ch01-b24
          speaker: jo
          text: 谁怕你呀！我们以前常玩《天路历程》。这个冬天和夏天，我们一直认认真真地照着它做。
        - id: ch01-b25
          speaker: laurie
          text: 嗯，我知道。
        - id: ch01-b26
          speaker: jo
          text: 谁告诉你的？
        - id: ch01-b27
          speaker: laurie
          text: 是精灵告诉我的。
        - id: ch01-b28
          speaker: beth
          text: 不是精灵，是我。有天晚上你们都不在，他心情不好，我就讲给他听，想让他高兴。他真的很喜欢。乔，你别骂我。
        - id: ch01-b29
          speaker: jo
          text: 你就是守不住秘密。算了，眼下倒省事。
        - id: ch01-b30
          speaker: narrator
          text: 乔有点不高兴，低头只顾做活，差点忘了还在给劳里讲这件事。
        - id: ch01-b31
          speaker: laurie
          text: 请接着说呀。
        - id: ch01-b32
          speaker: jo
          text: 贝丝没把新计划告诉你吗？我们不想白白浪费假期，所以每人都领了一项任务，认真去做。假期快结束了，功课也全完成了。我们没有混日子，心里别提多高兴。
        - id: ch01-b33
          speaker: laurie
          text: 那当然值得高兴。
        - id: ch01-b34
          speaker: narrator
          text: 他说着，却想起自己一天天懒散度过的假期，心里很是后悔。
        - id: ch01-b35
          speaker: jo
          text: 妈妈愿意让我们尽可能多待在户外，我们就把各自的活儿带到这里，一边做事，一边享受好时光。为了好玩，东西都装在袋子里，再戴上旧帽子，拄着木杖爬山，像多年前小时候那样扮朝圣者。这座山叫悦人山。站在这里能望见很远的地方，也能看见那片我们盼望有一天住进去的国土。
        - id: ch01-b36
          speaker: narrator
          text: 乔指给他看，劳里立刻坐直了身子。树林间有一道缺口，视线越过宽阔的蓝色河流，越过对岸的草地和大城遥远的边缘，一直来到与天相接的青山。太阳低垂，秋日的落霞把天空染得灿烂。金色和紫色的云铺在山顶，更高处还有银白色的峰尖，耸入红光，像一座天城悬在空中的尖塔，正闪闪发亮。
        - id: ch01-b37
          speaker: laurie
          text: 真美啊！
        - id: ch01-b38
          speaker: narrator
          text: 劳里轻声赞叹。他对各种美都十分敏锐，总能很快看见，也会立刻为之动心。
        - id: ch01-b39
          speaker: amy
          text: 这里常有这样的景色，我们最爱看了。它每回都不一样，却每回都这么灿烂。真希望我能画下来。
        - id: ch01-b40
          speaker: beth
          text: 乔说的国土，是我们以后想住的真正乡野。那里有猪，有鸡，还能晒干草，一定很好。可我更盼着天上那片美丽的地方是真的，也盼着我们有一天能进去。
        - id: ch01-b41
          speaker: meg
          text: 还有一个地方比那里更可爱。等我们将来变得足够好，就会去那儿。
        - id: ch01-b42
          speaker: beth
          text: 可要等好久，要做到也好难。我真想马上像那些燕子一样飞走，从那扇辉煌的大门飞进去。
        - id: ch01-b43
          speaker: jo
          text: 贝丝，你早晚一定能到，用不着担心。真正得一路打拼、干活、攀登、等待的是我。说不定到最后，我还是进不去。
        - id: ch01-b44
          speaker: laurie
          text: 要是有人陪能让你好受一点，那我陪你走。我也得走很远的路，才能看到你的天城。万一我去迟了，你会替我说句好话吧，贝丝？
        - id: ch01-b45
          speaker: narrator
          text: 男孩脸上的神情叫贝丝有些不安。她静静望着变化的云彩，语气却很快活。
        - id: ch01-b46
          speaker: beth
          text: 一个人只要真心想去，也一辈子认真努力，我想他一定进得去。那扇门不会上锁，门口也不会有卫兵。我总觉得那里就像画上一样。基督徒从河里走上来，光明者全都伸出手，欢迎这个可怜的人。
        - id: ch01-b47
          speaker: narrator
          text: 大家静了一会儿。
        - id: ch01-b48
          speaker: jo
          text: 要是我们造的空中楼阁都能成真，让我们住进去，那该多有意思！
        - id: ch01-b49
          speaker: laurie
          text: 我造得太多了，真要选一座，还挺难。
        - id: ch01-b50
          speaker: narrator
          text: 劳里平躺下来，一边琢磨，一边朝那只刚才出卖他的松鼠扔球果。
        - id: ch01-b51
          speaker: meg
          text: 必须选你最喜欢的。它是什么样？
        - id: ch01-b52
          speaker: laurie
          text: 我说了自己的，你们也说吗？
        - id: ch01-b53
          speaker: meg
          text: 妹妹们都答应，我就说。
        - id: ch01-b54
          speaker: jo
          text: 我们答应。劳里，你先来。
        - id: ch01-b55
          speaker: laurie
          text: 等我把世界看够了，我就住到德国去，想听多少音乐就听多少。我会成为著名的音乐家，天下人都抢着来听我演奏。我不用操心钱，也不用管生意，只管做喜欢的事，快快活活地过日子。这就是我最喜欢的城堡。梅格，你的呢？
        - id: ch01-b56
          speaker: narrator
          text: 玛格丽特似乎不大好意思。她拿一枝蕨草在脸前晃，好像在赶走一群根本不存在的小飞虫，然后才慢慢开口。
        - id: ch01-b57
          speaker: meg
          text: 我想要一幢漂亮的房子，里面有可口的食物、好看的衣裳、华美的家具、可亲的人，还有许多钱。我是那里的女主人，什么都照自己的意思安排。仆人多得很，我不用亲手做活。那该多快活！不过，我不会闲着。我会做好事，让所有人都深深爱我。
        - id: ch01-b58
          speaker: laurie
          text: 你的空中楼阁里，不要一位男主人吗？
        - id: ch01-b59
          speaker: narrator
          text: 劳里问得狡猾。梅格低头仔细系鞋带，不让别人看见她的脸。
        - id: ch01-b60
          speaker: meg
          text: 我已经说了，那里会有“可亲的人”。
        - id: ch01-b61
          speaker: jo
          text: 你干吗不直说？你想要一个了不起、聪明又善良的丈夫，再要几个天使一样的小孩子。没有他们，你的城堡可不算完美。
        - id: ch01-b62
          speaker: narrator
          text: 乔说得直截了当。她还没有这些温柔的幻想。书里的浪漫故事她喜欢，现实里的浪漫事，她却不大瞧得上。
        - id: ch01-b63
          speaker: meg
          text: 你的城堡里只会有马、墨水瓶和小说。
        - id: ch01-b64
          speaker: jo
          text: 才不止呢！我要一座养满阿拉伯骏马的马厩，还要一间间堆满书的屋子。我要用有魔力的墨水瓶写作，让我的作品像劳里的音乐一样出名。住进城堡以前，我一定要做成一件了不起的事。它会很英勇，或者很奇妙。就算我死了，人们也不会忘记。究竟是什么，我现在还不知道，可我一直等着机会，总有一天要让你们大吃一惊。我想我会写书，既发财又成名。那最合我的心意，这就是我最喜欢的梦。
        - id: ch01-b65
          speaker: beth
          text: 我只想安安稳稳留在家里，陪着爸爸妈妈，帮忙照顾大家。
        - id: ch01-b66
          speaker: laurie
          text: 你不想要别的吗？
        - id: ch01-b67
          speaker: beth
          text: 有了小钢琴，我已经什么都不缺了。只要大家一直健康，永远在一起，我别的都不要。
        - id: ch01-b68
          speaker: amy
          text: 我的愿望可多了，不过最要紧的是成为艺术家。我会去罗马，画出美丽的画，还要做全世界最出色的艺术家。
        - id: ch01-b69
          speaker: narrator
          text: 她想做全世界最出色的一个，这便是艾米那份十分“谦逊”的愿望。
        - id: ch01-b70
          speaker: laurie
          text: 我们的野心都不小啊。除了贝丝，人人都想有钱、出名，样样都风光。不知道我们当中，有没有谁会实现愿望。
        - id: ch01-b71
          speaker: narrator
          text: 劳里说着，像一头正在沉思的小牛那样嚼草。
        - id: ch01-b72
          speaker: jo
          text: 我已经拿到自己城堡的钥匙了。能不能打开门，还得走着瞧。
        - id: ch01-b73
          speaker: laurie
          text: 我的钥匙也拿到了，可人家不许我试。讨厌的大学！
        - id: ch01-b74
          speaker: amy
          text: 我的钥匙在这儿！
        - id: ch01-b75
          speaker: narrator
          text: 艾米挥了挥铅笔。
        - id: ch01-b76
          speaker: meg
          text: 我可没有钥匙。
        - id: ch01-b77
          speaker: laurie
          text: 你有。
        - id: ch01-b78
          speaker: meg
          text: 在哪儿？
        - id: ch01-b79
          speaker: laurie
          text: 就在你脸上。
        - id: ch01-b80
          speaker: meg
          text: 胡说，那有什么用。
        - id: ch01-b81
          speaker: laurie
          text: 等着瞧吧，看它会不会给你带来值得珍惜的东西。
        - id: ch01-b82
          speaker: narrator
          text: 劳里想到自己猜中的那个甜蜜小秘密，忍不住笑了。梅格躲在蕨草后面红了脸，却没有追问。她望向河对岸，脸上带着期待，恰好像布鲁克先生讲骑士故事时望着她的模样。
        - id: ch01-b83
          speaker: jo
          text: 要是十年以后我们都还活着，就再聚一次。到时候看看谁实现了愿望，谁又比今天更靠近自己的愿望。
        - id: ch01-b84
          speaker: meg
          text: 天哪！那时候我都二十七岁了！
        - id: ch01-b85
          speaker: narrator
          text: 她刚满十七岁，已经觉得自己是个大人。
        - id: ch01-b86
          speaker: jo
          text: 泰迪，你和我二十六岁，贝丝二十四，艾米二十二。好一群德高望重的老人家！
        - id: ch01-b87
          speaker: laurie
          text: 但愿那时候我已经做成了一件值得骄傲的事。可我实在是条懒狗，恐怕只会一直混日子，乔。
        - id: ch01-b88
          speaker: jo
          text: 妈妈说，你缺的是一个目标。找到以后，她相信你一定会干得很出色。
        - id: ch01-b89
          speaker: laurie
          text: 她真这么说？凭朱庇特起誓，只要有机会，我一定好好干！我知道自己该以讨祖父高兴为满足，也确实在努力。可这件事处处违背我的天性，做起来太难了。他想叫我跟他一样，做印度贸易商，我宁肯挨一枪。茶叶、丝绸、香料，还有那些旧船运来的破烂，我全都讨厌。等船归了我，它们越早沉掉越好。我肯花四年上大学，他就该满意，也该放过我，别再逼我经商。可他打定了主意，非叫我照他的老路走，除非我像父亲那样挣脱出去，按自己的心意生活。要是还有别人肯陪着老先生，我明天就走。
        - id: ch01-b90
          speaker: narrator
          text: 劳里越说越激动，仿佛别人只要再刺激他一句，他马上就会照自己说的去做。他长得很快。别看平日懒散，他心里已经有了青年人对束缚的憎恶，也怀着青年人那种不安分的渴望，急切地想亲自闯荡世界。
        - id: ch01-b91
          speaker: jo
          text: 那你就驾着自己的一条船远走高飞吧。等照自己的方式试过一回，再回家。
        - id: ch01-b92
          speaker: narrator
          text: 乔一想到这样大胆的远行，想象力立刻被点燃了。她又想起自己所谓的“泰迪受的委屈”，更是满腔同情。
        - id: ch01-b93
          speaker: meg
          text: 这样说不对，乔。你不该怂恿他，劳里也不能听你的坏主意。你应该照祖父的愿望去做。在大学里尽力，让他看见你真想讨他欢喜。我相信他不会苛待你，也不会对你不公平。再没有别人能留下来陪他、爱他。要是没有得到允许就走了，你一辈子都会责怪自己。别难过，也别烦恼。尽好自己的责任，自然会有回报。善良的布鲁克先生就是这样，所以大家才敬爱他。
        - id: ch01-b94
          speaker: laurie
          text: 你知道布鲁克先生什么事？
        - id: ch01-b95
          speaker: narrator
          text: 劳里感激梅格给的好意见，却不喜欢她那种教训人的口气。这一阵少有的激烈发作过后，他也正想把话题从自己身上移开。
        - id: ch01-b96
          speaker: meg
          text: 都是你祖父告诉我们的。布鲁克先生一直照料母亲，直到她去世。有人请他出国给一个很不错的人当家庭教师，他也不肯，因为不愿离开母亲。现在，他还供养一位服侍过他母亲的老妇人，却从不告诉别人。他真的慷慨、耐心又善良。
        - id: ch01-b97
          speaker: narrator
          text: 梅格越讲越投入，脸颊已经发红，神情却十分认真。
        - id: ch01-b98
          speaker: laurie
          text: 他确实是这样，真是个可爱的老好人！祖父也真有办法。他悄悄把布鲁克的事全打听清楚，不让本人知道，然后再说给别人听，好叫大家喜欢他。布鲁克一直不明白，你妈妈为什么待他那么亲切。她总请他和我一起过去，又那么友善地招待他。他觉得你妈妈十全十美，连着念叨了好多天，也把你们全都夸上了天。哪天我真能实现自己的愿望，你们就等着看我怎么报答布鲁克吧。
        - id: ch01-b99
          speaker: meg
          text: 你现在就能开始，别再把他折磨得要命。
        - id: ch01-b100
          speaker: laurie
          text: 小姐，你怎么知道我折磨他？
        - id: ch01-b101
          speaker: meg
          text: 他每次离开，我看脸就知道。你要是表现好，他神情满意，脚步也轻快。你要是捉弄他，他就满脸严肃，走得很慢，好像恨不得回去把功课重新教一遍。
        - id: ch01-b102
          speaker: laurie
          text: 原来你从布鲁克的脸上给我记好坏分数，是不是？他经过你家窗前，会鞠躬，会微笑。可我不知道，你们还架了一台电报机。
        - id: ch01-b103
          speaker: meg
          text: 我们没有。你别生气，也千万别告诉他我说过这些！我只是想让你知道，我们很在意你有没有进步。再说，这里讲的话都是秘密，你明白的。
          emotion: fearful
        - id: ch01-b104
          speaker: narrator
          text: 梅格十分慌张，生怕自己一时说漏嘴，接下来会惹出什么意想不到的事。
        - id: ch01-b105
          speaker: laurie
          text: 我可不传闲话。不过，布鲁克要是想当温度计，我得小心一点，好叫他天天报告晴朗天气。
        - id: ch01-b106
          speaker: narrator
          text: 劳里摆出一副乔所谓的“高高在上”的神气。他偶尔闹起别扭，就会露出这种表情。
        - id: ch01-b107
          speaker: meg
          text: 请你别生气。我不是要教训你，也不是想传闲话，更不是故意犯傻。我只是觉得，乔在怂恿你顺着一种情绪走下去，将来你会后悔。你对我们这么好，我们早把你当亲兄弟了，才会心里怎么想就怎么说。原谅我吧，我真是一片好心。
          emotion: fearful
        - id: ch01-b108
          speaker: narrator
          text: 梅格伸出手，既亲昵又有点胆怯。劳里为刚才一时赌气感到惭愧，握了握那只善意的小手。
        - id: ch01-b109
          speaker: laurie
          text: 该道歉的是我。我今天一整天都脾气不好，心里也不痛快。我喜欢你指出我的毛病，也喜欢你拿我当弟弟。以后我偶尔发牢骚，你别放在心上。不管怎样，我都要谢谢你。
        - id: ch01-b110
          speaker: narrator
          text: 为了让大家相信他没生气，劳里使出浑身解数，努力讨每个人高兴。他替梅格绕棉线，给乔背诗，帮贝丝摇下球果，又协助艾米画蕨草。这样一来，他完全有资格加入“忙碌蜜蜂社”了。后来，一只性情温和的乌龟从河边慢慢爬来。大家正兴致勃勃地讨论乌龟在家里的生活习惯，远处忽然响起微弱的铃声。汉娜在告诉他们，茶已经泡上了。现在回去，刚好赶得及吃晚饭。
        - id: ch01-b111
          speaker: laurie
          text: 我以后还能来吗？
        - id: ch01-b112
          speaker: meg
          text: 只要你乖乖的，还能像启蒙读本教男孩子的那样爱书本，就可以。
        - id: ch01-b113
          speaker: laurie
          text: 我会努力。
        - id: ch01-b114
          speaker: jo
          text: 那你就来吧。我还会教你像苏格兰人那样织东西。眼下正缺袜子呢。
        - id: ch01-b115
          speaker: narrator
          text: 在门口分别时，乔挥着手里的针织活儿，仿佛挥动一面蓝色粗绒线做的大旗。那天晚上，暮色笼罩了屋子，贝丝弹琴给劳伦斯先生听。劳里站在窗帘的阴影里，听着这位小大卫的琴声。那朴素的音乐一次又一次安抚着他阴郁不定的心。他又望向老人。劳伦斯先生一手托着灰白的头，正在温柔地想着那个死去多年、自己深爱过的孩子。劳里记起下午的谈话，终于决定心甘情愿地作出牺牲。
        - id: ch01-b116
          speaker: laurie
          text: 我要舍掉自己的空中楼阁。只要亲爱的老先生还需要我，我就留下来陪他，因为他只有我了。
