audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "warm, observant, and gently playful", timbre: "clear and inviting", pace: measured, pitch: medium}
    meg:
      display_name: Meg
      tts: {delivery: "graceful, earnest, and sisterly", timbre: "soft and polished", pace: measured, pitch: medium}
    jo:
      display_name: Jo
      tts: {delivery: "spirited, blunt, and quick to laugh", timbre: "bright and slightly husky", pace: lively, pitch: medium-low}
    beth:
      display_name: Beth
      tts: {delivery: "shy, gentle, and quietly sincere", timbre: "light and tender", pace: unhurried, pitch: medium-high}
    amy:
      display_name: Amy
      tts: {delivery: "proper, dramatic, and confidently young", timbre: "clear and delicate", pace: measured, pitch: high}
    laurie:
      display_name: Laurie
      tts: {delivery: "courteous, sensitive, and boyishly playful", timbre: "clear and youthful", pace: measured, pitch: medium}
  chapters:
    - id: ch01
      title: The Busy Bee Society
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One warm September afternoon, Laurie lay swinging lazily in his hammock. He wondered what his neighbors were doing, though he felt too sluggish to find out. The day had gone badly, and he wished he could begin it again. He had avoided his lessons, worn out Mr. Brooke's patience, annoyed his grandfather by practicing music for half the afternoon, and frightened the maids by hinting that one of his dogs might be going mad. Then he had quarreled with the stableman over his horse and gone off to blame the whole foolish world.
        - id: ch01-b02
          speaker: narrator
          text: But the lovely, peaceful day slowly quieted him. He stared into the green shade of the horse-chestnut trees and began imagining a voyage around the world. Then voices brought him back to shore. Through the hammock netting, he saw the March girls leave their house as if they were starting an expedition.
        - id: ch01-b03
          speaker: narrator
          text: Each girl wore a large floppy hat, carried a long staff, and had a brown linen bag over one shoulder. Meg brought a cushion, Jo a book, Beth a basket, and Amy a portfolio. They crossed the garden, slipped through the back gate, and started up the hill between the house and the river.
        - id: ch01-b04
          speaker: laurie
          text: Now what are those girls doing? They're having a picnic without me! They can't be taking the boat because they don't have the key. Maybe they forgot it. I'll bring it along and see what's happening.
        - id: ch01-b05
          speaker: narrator
          text: Laurie owned half a dozen hats, but finding one took time. Then he searched everywhere for the key and finally discovered it in his own pocket. By then the girls had vanished. He jumped the fence, ran to the boathouse by the shortest path, and waited. When no one appeared, he climbed the hill to look around.
        - id: ch01-b06
          speaker: narrator
          text: Pine trees covered one side of the hill. From deep inside that green place came a sound clearer than the pines sighing or the crickets chirping sleepily. Laurie peered through the bushes, and at once he looked wide-awake and cheerful.
        - id: ch01-b07
          speaker: laurie
          text: Well, here's a pretty scene!
        - id: ch01-b08
          speaker: narrator
          text: The four sisters sat close together in a shady nook. Sunlight and shadow moved over them. A fragrant breeze lifted their hair and cooled their warm faces, while the small creatures of the woods went about their work as if the girls were old friends. Meg sat on her cushion, sewing neatly in a pink dress. Beth sorted hemlock cones to use in the pretty things she made. Amy sketched a cluster of ferns, and Jo knitted while reading aloud.
        - id: ch01-b09
          speaker: narrator
          text: As Laurie watched, a shadow crossed his face. He knew he should leave because no one had invited him. Still, home felt lonely, and this quiet little gathering drew his restless heart. He stood so still that a squirrel hurried down a nearby pine. It suddenly noticed him, sprang back, and scolded so loudly that Beth looked up. She spotted Laurie's wistful face behind the birches and beckoned with a comforting smile.
        - id: ch01-b10
          speaker: laurie
          text: Could I join you, please, or would I only get in the way?
        - id: ch01-b11
          speaker: narrator
          text: He came forward slowly. Meg raised her eyebrows, but Jo gave her a defiant look and answered at once.
        - id: ch01-b12
          speaker: jo
          text: Of course you can join us. We would have invited you, but we thought you wouldn't care for a girls' game like this.
        - id: ch01-b13
          speaker: laurie
          text: I always enjoy your games. But if Meg doesn't want me here, I'll leave.
        - id: ch01-b14
          speaker: meg
          text: You may stay if you work. No one is allowed to sit idle here.
        - id: ch01-b15
          speaker: laurie
          text: Thank you kindly. I'll do anything if I can stay awhile. It's as empty as the Sahara down at home. Shall I sew, read, gather cones, draw, or do everything together? Give me your hardest task. I'm ready.
        - id: ch01-b16
          speaker: narrator
          text: Laurie sat down wearing such an obedient expression that it was a pleasure to see.
        - id: ch01-b17
          speaker: jo
          text: Read the rest of this story while I finish the heel of my sock.
        - id: ch01-b18
          speaker: narrator
          text: She passed him the book.
        - id: ch01-b19
          speaker: laurie
          text: Yes, ma'am.
        - id: ch01-b20
          speaker: narrator
          text: He began reading and did his very best to show how grateful he was to be admitted to the Busy Bee Society. The story was short. When he finished, he decided that good work had earned him a few questions.
        - id: ch01-b21
          speaker: laurie
          text: Excuse me, ma'am. Is this charming and highly educational society a new one?
        - id: ch01-b22
          speaker: meg
          text: Shall we tell him?
        - id: ch01-b23
          speaker: narrator
          text: Meg looked at her sisters.
        - id: ch01-b24
          speaker: amy
          text: He'll make fun of us.
        - id: ch01-b25
          speaker: jo
          text: Let him. Who cares?
        - id: ch01-b26
          speaker: beth
          text: I think he'll like it.
        - id: ch01-b27
          speaker: laurie
          text: Of course I will. I promise I won't laugh. Go ahead, Jo. You don't have to be afraid.
        - id: ch01-b28
          speaker: jo
          text: Afraid of you? What an idea! You know how we used to play Pilgrim's Progress. Well, all winter and summer we've been trying to keep the game going in earnest.
        - id: ch01-b29
          speaker: laurie
          text: Yes, I know about that.
        - id: ch01-b30
          speaker: jo
          text: Who told you?
        - id: ch01-b31
          speaker: laurie
          text: The spirits did.
        - id: ch01-b32
          speaker: beth
          text: No, I told him. One night, while all of you were away, he seemed lonely, so I tried to amuse him. He did like it, Jo, so please don't scold.
        - id: ch01-b33
          speaker: jo
          text: You simply cannot keep a secret. Never mind. At least it saves us trouble now.
        - id: ch01-b34
          speaker: laurie
          text: Please keep going.
        - id: ch01-b35
          speaker: narrator
          text: Jo had gone back to her knitting and looked a little displeased.
        - id: ch01-b36
          speaker: jo
          text: Didn't Beth tell you our new plan? We didn't want to waste the holiday, so each of us chose a task and worked hard at it. Vacation is almost over now. We've finished everything we set ourselves, and we're very glad we didn't spend the whole time doing nothing.
        - id: ch01-b37
          speaker: laurie
          text: I can certainly understand that.
        - id: ch01-b38
          speaker: narrator
          text: He thought regretfully of his own wasted days.
        - id: ch01-b39
          speaker: jo
          text: Mother wants us outdoors whenever we can be, so we carry our work up here and enjoy ourselves. We put our things in these bags, wear the old hats, and use staffs to climb the hill, just as we did when we were little. We call it the Delectable Mountain. From here we can see far away toward the country where we hope to live someday.
    - id: ch02
      title: Castles in the Air
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Jo pointed through an opening in the trees, and Laurie sat up to look. Beyond the wide blue river were meadows, the edge of the great city, and green hills rising toward the sky. The sun had dropped low. Gold and purple clouds rested on the hills, while silvery peaks climbed through the red light like the shining towers of a Celestial City.
        - id: ch02-b02
          speaker: laurie
          text: It's beautiful.
        - id: ch02-b03
          speaker: narrator
          text: He spoke softly because beauty of every kind touched him quickly.
        - id: ch02-b04
          speaker: amy
          text: We watch it often. It never looks quite the same, but it's always wonderful.
        - id: ch02-b05
          speaker: narrator
          text: Amy wished she could paint it.
        - id: ch02-b06
          speaker: beth
          text: When Jo talks about the place where we hope to live, she means a real farm with pigs, chickens, and haymaking. That would be pleasant. But I wish the beautiful country above us were real too, and that someday we could go there.
        - id: ch02-b07
          speaker: meg
          text: There is a country lovelier than that one, Beth. We'll go there by and by, when we're good enough.
        - id: ch02-b08
          speaker: beth
          text: Waiting feels so long, and being good is so hard. I want to fly there now, like those swallows, and pass through that splendid gate.
        - id: ch02-b09
          speaker: jo
          text: You'll reach it, Beth. I'm sure you will. I'm the one who'll have to struggle and work and climb and wait. After all that, perhaps I still won't get inside.
        - id: ch02-b10
          speaker: laurie
          text: Then I'll keep you company. I have a long journey ahead before I even see your Celestial City. If I come late, Beth, you'll speak kindly for me, won't you?
        - id: ch02-b11
          speaker: narrator
          text: Something in his face troubled Beth. Still, she answered cheerfully as she watched the clouds change.
        - id: ch02-b12
          speaker: beth
          text: If people truly want to go there and keep trying all their lives, I think they'll be welcomed. I don't believe that door has locks or that gate has guards. I picture it just like the book, with the shining ones reaching out to welcome poor Christian when he comes up from the river.
          emotion: calm
        - id: ch02-b13
          speaker: narrator
          text: They were quiet for a moment. Then Jo turned from the heavenly city to dreams of another kind.
        - id: ch02-b14
          speaker: jo
          text: Wouldn't it be wonderful if all our castles in the air came true and we could live in them?
        - id: ch02-b15
          speaker: laurie
          text: I've built so many that choosing one would be difficult.
        - id: ch02-b16
          speaker: narrator
          text: He stretched out on the ground and tossed cones at the squirrel that had given him away.
        - id: ch02-b17
          speaker: meg
          text: You must choose your favorite. What is it?
        - id: ch02-b18
          speaker: laurie
          text: I'll tell you mine if you'll tell me yours.
        - id: ch02-b19
          speaker: meg
          text: I will, if the girls agree too.
        - id: ch02-b20
          speakers: [jo, beth, amy]
          ensemble: chorus
          text: We agree. Tell us, Laurie.
        - id: ch02-b21
          speaker: laurie
          text: First I'd travel until I'd seen as much of the world as I wanted. Then I'd settle in Germany and fill my life with music. I'd become a famous musician, and everyone would hurry to hear me. Money and business would never bother me. I'd simply enjoy myself and live for what I love. That's my favorite castle. Meg, what's yours?
        - id: ch02-b22
          speaker: narrator
          text: Margaret found her answer harder to give. She waved a fern in front of her face as though she were chasing away invisible gnats.
        - id: ch02-b23
          speaker: meg
          text: I'd like a beautiful house filled with every comfort. There would be delicious food, lovely clothes, handsome furniture, pleasant company, and plenty of money. I'd run the house exactly as I liked, with enough servants that I never had to work. Oh, I would enjoy that! But I wouldn't be lazy. I'd do good things and make everyone love me dearly.
        - id: ch02-b24
          speaker: laurie
          text: Would there be a master in this castle of yours?
        - id: ch02-b25
          speaker: narrator
          text: He asked slyly.
        - id: ch02-b26
          speaker: meg
          text: I did say there would be pleasant company.
        - id: ch02-b27
          speaker: narrator
          text: Meg carefully retied her shoe so no one could see her face.
        - id: ch02-b28
          speaker: jo
          text: Why not admit you want a wonderful, wise, good husband and a few angelic children? You know your castle wouldn't be complete without them.
        - id: ch02-b29
          speaker: narrator
          text: Jo had no romantic dreams of her own yet and could be very blunt about other people's, though she enjoyed romance well enough in books.
        - id: ch02-b30
          speaker: meg
          text: Yours would have nothing in it but horses, inkstands, and novels.
        - id: ch02-b31
          speaker: jo
          text: Oh, wouldn't it? I'd have a stable full of Arabian horses and rooms piled to the ceiling with books. I'd write with a magic inkstand, and my stories would become as famous as Laurie's music. Before I enter my castle, I want to do something splendid. Something brave or marvelous that people will remember after I'm dead. I don't know what it will be, but I'm watching for it. Someday I'll amaze every one of you. I think I'll write books and become rich and famous. Yes, that dream suits me best.
        - id: ch02-b32
          speaker: beth
          text: My wish is to stay safely at home with Father and Mother and help care for the family.
        - id: ch02-b33
          speaker: laurie
          text: Isn't there anything else you want?
        - id: ch02-b34
          speaker: beth
          text: Now that I have my little piano, I'm completely content. I only wish that all of us may stay well and remain together. I don't need anything more.
        - id: ch02-b35
          speaker: amy
          text: I have all kinds of wishes, but my dearest one is to become an artist. I'll go to Rome, paint beautiful pictures, and be the finest artist in the world.
        - id: ch02-b36
          speaker: laurie
          text: We're quite an ambitious group, aren't we? Except for Beth, every one of us wants to be rich, famous, and magnificent. I wonder if any of these wishes will come true.
        - id: ch02-b37
          speaker: narrator
          text: He chewed a blade of grass and looked like a thoughtful young calf.
        - id: ch02-b38
          speaker: jo
          text: I have the key to my castle in the air. Whether it will open the door is another question.
        - id: ch02-b39
          speaker: narrator
          text: She said it mysteriously.
        - id: ch02-b40
          speaker: laurie
          text: I have my key too, but no one will let me try it. Hang college!
        - id: ch02-b41
          speaker: narrator
          text: His sigh was full of impatience.
        - id: ch02-b42
          speaker: amy
          text: Here's my key!
        - id: ch02-b43
          speaker: narrator
          text: Amy waved her pencil.
        - id: ch02-b44
          speaker: meg
          text: I don't have one at all.
        - id: ch02-b45
          speaker: laurie
          text: Yes, you do.
        - id: ch02-b46
          speaker: meg
          text: Where is it?
        - id: ch02-b47
          speaker: laurie
          text: In your face.
        - id: ch02-b48
          speaker: meg
          text: Nonsense. What use is that?
        - id: ch02-b49
          speaker: laurie
          text: Just wait. You'll see whether it brings you something worth having.
        - id: ch02-b50
          speaker: narrator
          text: Laurie laughed, thinking of a charming little secret he believed he knew. Meg blushed behind her fern, but asked no questions. She gazed across the river with the same hopeful look Mr. Brooke had worn while telling the story of the knight.
        - id: ch02-b51
          speaker: jo
          text: If we're all alive ten years from now, let's meet again. Then we'll see how many wishes have come true and how much closer the rest of us are.
        - id: ch02-b52
          speaker: meg
          text: Goodness! I'll be twenty-seven. How old that sounds!
        - id: ch02-b53
          speaker: narrator
          text: Meg had only just turned seventeen and already felt quite grown up.
        - id: ch02-b54
          speaker: jo
          text: Teddy and I will be twenty-six. Beth will be twenty-four, and Amy twenty-two. What a very ancient party we'll make!
        - id: ch02-b55
          speaker: laurie
          text: I hope I'll have done something worth being proud of. But I'm such a lazy fellow, Jo. I'm afraid I'll waste the years.
        - id: ch02-b56
          speaker: jo
          text: Mother says you need a reason to work. Once you find it, she believes you'll do splendidly.
    - id: ch03
      title: Laurie Speaks His Mind
      blocks:
        - id: ch03-b01
          speaker: laurie
          text: Does she really? Then, by Jupiter, I will work, if I ever get the chance!
        - id: ch03-b02
          speaker: narrator
          text: Laurie sat up with sudden energy.
        - id: ch03-b03
          speaker: laurie
          text: I know I should be satisfied with pleasing Grandfather, and I do try. But it goes against everything I want, so it's hard. He expects me to become an India merchant because that's what he was. I'd rather be shot. I hate tea, silk, spices, and every other bit of cargo his old ships carried. Once those ships belong to me, I won't care how soon they sink. College should be enough for him. If I give him four years, he ought to release me from the business afterward. But he has made up his mind that I must follow his exact path. The only way out is to break free and choose for myself, as my father did. If someone else were here to stay with the old gentleman, I'd leave tomorrow.
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: He spoke with such excitement that one more push might have sent him off to carry out the threat. Laurie was growing up quickly. Lazy as he could be, he had a young man's dislike of being controlled and a young man's restless longing to test the world for himself.
        - id: ch03-b05
          speaker: jo
          text: Then sail away on one of your ships. Don't come home until you've had the chance to live your own way.
        - id: ch03-b06
          speaker: narrator
          text: The thought of such a daring adventure fired Jo's imagination. She also felt deeply for what she liked to call Teddy's Wrongs.
        - id: ch03-b07
          speaker: meg
          text: Jo, that's terrible advice. You shouldn't encourage him, and Laurie mustn't listen. My dear boy, you ought to respect your grandfather's wishes. Do your very best at college. When he sees that you're sincerely trying to please him, I'm sure he won't treat you harshly or unfairly. You said yourself that no one else is there to stay with him and love him. If you left without his permission, you'd never forgive yourself. Don't make yourself miserable. Do your duty, and in time you'll earn the same respect and love that good Mr. Brooke has earned.
        - id: ch03-b08
          speaker: laurie
          text: What do you know about Brooke?
        - id: ch03-b09
          speaker: narrator
          text: Laurie appreciated the advice but not the lecture. After revealing so much, he was glad to move the conversation away from himself.
        - id: ch03-b10
          speaker: meg
          text: Only what your grandfather told us. Mr. Brooke cared faithfully for his mother until she died. He once refused a chance to travel abroad as someone's tutor because he wouldn't leave her. Now he supports the old woman who nursed his mother. He never mentions it himself. He's as generous, patient, and good as anyone could be.
        - id: ch03-b11
          speaker: narrator
          text: Meg's face was warm and earnest when she finished.
        - id: ch03-b12
          speaker: laurie
          text: That's Brooke exactly. Dear old fellow! And that's just like Grandfather too. He quietly learns every good thing a person has done and then tells other people so they'll admire him. Brooke couldn't understand why your mother was so kind to him. She invites him over with me and treats him in that wonderfully friendly way of hers. He thought she was perfect. For days he talked about her, and he praised all of you in the grandest style. If my own wish ever comes true, just wait and see what I'll do for Brooke.
          emotion: happy
        - id: ch03-b13
          speaker: meg
          text: You could begin now by not making his life miserable.
          emotion: angry
        - id: ch03-b14
          speaker: laurie
          text: And how would you know whether I do that, miss?
        - id: ch03-b15
          speaker: meg
          text: I can see it in his face when he leaves. If you've behaved well, he looks satisfied and walks away briskly. If you've tormented him, he looks serious and goes slowly, as though he wishes he could turn around and teach the lesson better.
        - id: ch03-b16
          speaker: laurie
          text: Well, that's interesting! You read my good marks and bad marks in Brooke's face, do you? I've noticed him bowing and smiling when he passes your window, but I never knew the two of you had arranged a telegraph.
        - id: ch03-b17
          speaker: meg
          text: We haven't! Please don't be angry, and please don't tell him I said any of this. I only wanted you to know that I care how you're doing. Besides, everything said here is private. You know that.
          emotion: fearful
        - id: ch03-b18
          speaker: narrator
          text: Meg was badly frightened by what might come from her careless words.
        - id: ch03-b19
          speaker: laurie
          text: I don't carry tales. But if Brooke is going to serve as a thermometer, I'll have to give him fair weather to report.
        - id: ch03-b20
          speaker: narrator
          text: He put on the grand, superior expression that Jo called his high-and-mighty look.
        - id: ch03-b21
          speaker: meg
          text: Please don't take offense. I wasn't trying to preach, gossip, or act foolishly. I only thought Jo was encouraging a feeling that might make you sorry later. You're so kind to us that we think of you as our brother. That's why we say exactly what we believe. Please forgive me. I meant to help.
        - id: ch03-b22
          speaker: narrator
          text: Meg held out her hand, both affectionate and timid.
        - id: ch03-b23
          speaker: laurie
          text: I'm the one who needs forgiveness. I've been cross and out of sorts all day. I want you to point out my faults and treat me like a brother, so don't worry when I'm grumpy. Thank you, Meg. I mean it.
        - id: ch03-b24
          speaker: narrator
          text: Ashamed of his brief irritation, Laurie gave her kind little hand a warm squeeze.
    - id: ch04
      title: The Choice at Twilight
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Laurie wanted everyone to see that he was not offended, so he made himself as helpful and pleasant as he could. He wound Meg's cotton, recited poetry for Jo, shook cones down for Beth, and helped Amy with her ferns. Before long, he had proved that he belonged in the Busy Bee Society.
        - id: ch04-b02
          speaker: narrator
          text: A turtle had wandered up from the river, and the five friends were deep in a lively discussion about the home life of turtles when a distant bell rang. Hannah had set the tea to steep. They had only enough time to hurry home for supper.
        - id: ch04-b03
          speaker: laurie
          text: May I come another time?
        - id: ch04-b04
          speaker: meg
          text: You may, if you behave and love your book, the way boys are told to do in their primers.
        - id: ch04-b05
          speaker: narrator
          text: Meg smiled as she said it.
        - id: ch04-b06
          speaker: laurie
          text: I'll do my best.
        - id: ch04-b07
          speaker: jo
          text: Then you may come back, and I'll teach you the Scottish way to knit. People need socks just now.
        - id: ch04-b08
          speaker: narrator
          text: At the gate, Jo waved her knitting like a large blue woolen banner, and they parted.
        - id: ch04-b09
          speaker: narrator
          text: That evening, Beth played the piano for Mr. Laurence in the twilight. Laurie stood in the shadow beside the curtain and listened to the simple music of the little David, which always soothed his troubled spirit. He watched his grandfather sitting with his gray head resting on one hand, thinking tenderly of the child he had loved and lost.
        - id: ch04-b10
          speaker: narrator
          text: Laurie remembered everything they had said on the hill. Then he made up his mind to give up his own dream without bitterness.
        - id: ch04-b11
          speaker: laurie
          text: I'll let my castle go. I'll stay with the dear old gentleman for as long as he needs me, because I'm all he has.
