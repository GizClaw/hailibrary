audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，含蓄机智, timbre: 清澈柔和, pace: 从容而有变化, pitch: 中音}
    beth:
      display_name: 贝丝
      tts: {delivery: 温柔诚恳，羞怯克制, timbre: 轻柔纯净, pace: 舒缓, pitch: 中高音}
    meg:
      display_name: 梅格
      tts: {delivery: 端庄温和，偶尔显出姐姐的威严, timbre: 柔润明亮, pace: 适中, pitch: 中音}
    jo:
      display_name: 乔
      tts: {delivery: 爽直敏捷，情绪真挚, timbre: 清亮有力, pace: 稍快, pitch: 中低音}
    hannah:
      display_name: 汉娜
      tts: {delivery: 朴实果断，带着家常的关爱, timbre: 厚实温暖, pace: 稳健, pitch: 中低音}
    amy:
      display_name: 艾米
      tts: {delivery: 娇气讲究，孩子气中带着自尊, timbre: 清脆明亮, pace: 适中偏快, pitch: 高音}
    laurie:
      display_name: 劳里
      tts: {delivery: 活泼亲切，善于打趣哄人, timbre: 明朗温暖, pace: 轻快, pitch: 中音}
    aunt_march:
      display_name: 马奇姑婆
      tts: {delivery: 粗声直率，挑剔而威严, timbre: 苍老干脆, pace: 偏慢, pitch: 中低音}
    polly:
      display_name: 波莉
      tts: {delivery: 尖锐滑稽，爱学舌, timbre: 嘶哑尖亮, pace: 忽快忽慢, pitch: 高音}
  chapters:
    - id: ch01
      title: 第十七章 忠心的小贝丝
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有一个星期，马奇家里积下的美德，多得简直能分给左邻右舍。那情形的确惊人，人人都像怀着一副圣洁心肠，克制自己也成了最时兴的事。后来，父亲的消息不再像起初那么吓人，姑娘们便不知不觉松了劲，渐渐回到从前的习惯里。她们没有忘记“心怀希望，手里别闲着”这句格言，只是觉得这两件事已经越来越容易。经过先前那一番拼命努力，她们认定，“勤勉”也该好好放个假，于是让它歇了不止一天。
        - id: ch01-b02
          speaker: narrator
          text: 乔没把剪短的头发裹严实，受凉得了重感冒。马奇姑婆听不得人带着浓重鼻音念书，便命令她留在家里，直到病好。乔倒正中下怀。她先精神十足地从阁楼翻到地窖，把屋子搜了个遍，后来才安静下来，躺上沙发，拿砒霜药和一摞书调养感冒。艾米发现家务和艺术实在合不来，于是放下家务，又去捏她的泥饼。梅格照常每天去教学生，在家也做针线，至少她自己以为在做。其实许多时间都花在给母亲写长信上，或者拿着华盛顿的电报，看了一遍又一遍。只有贝丝照旧做事，偶尔才会偷懒一下，或者伤心一阵。
        - id: ch01-b03
          speaker: narrator
          text: 家里每天那些不起眼的小事，贝丝一件不落，认真做完。姐妹们忘掉的活儿，她也常常默默补上。她们近来总是丢三落四，整座房子就像一只钟，偏偏钟摆出门作客去了。想念母亲，或者害怕父亲出事时，贝丝的心也会沉下去。这时她便独自躲进一只熟悉的壁橱，把脸埋在母亲那件亲爱的旧长袍褶子里，轻轻哭一会儿，再低低地祷告。谁也不知道她每次怎样找回了安慰。大家只觉得贝丝温柔又可靠，谁有了小小的烦恼，都渐渐习惯来找她安慰，请她拿主意。
        - id: ch01-b04
          speaker: narrator
          text: 姐妹们谁也没有想到，这段经历其实正在考验她们的品性。最初那阵紧张和激动过去以后，她们觉得自己已经做得很好，当然值得夸奖。她们的确做得好。真正的错误，是做好以后便停了下来，没有继续坚持。这个教训，她们后来是在深深的忧虑和悔恨里学到的。
        - id: ch01-b05
          speaker: beth
          text: 梅格，你去看看胡梅尔一家好吗？妈妈走了十天了，她特意叮嘱过，别忘记他们。
        - id: ch01-b06
          speaker: meg
          text: 我今天下午实在太累，不想去了。
        - id: ch01-b07
          speaker: beth
          text: 那乔能去吗？
        - id: ch01-b08
          speaker: jo
          text: 外头风雨那么大，我还感冒着呢。
        - id: ch01-b09
          speaker: beth
          text: 可我以为你已经快好了。
        - id: ch01-b10
          speaker: jo
          text: 跟劳里出去，我的病算是好了。要去胡梅尔家嘛，还差一点。
        - id: ch01-b11
          speaker: narrator
          text: 乔自己也知道这话说不通，笑过以后，脸上有点惭愧。梅格便问贝丝为什么不自己去。
        - id: ch01-b12
          speaker: beth
          text: 我每天都去。可现在小宝宝病了，胡梅尔太太又要出门做工，只留下洛琴照顾他。他一天比一天病得厉害，我根本不知道该怎样帮他。我想，你或者汉娜真该亲自去看看。
        - id: ch01-b13
          speaker: narrator
          text: 贝丝说得恳切，梅格答应明天去。
        - id: ch01-b14
          speaker: jo
          text: 那你先向汉娜要点好吃的，给他们送去。出去透透气也好。我本来愿意去的，只是想写完手里的东西。
        - id: ch01-b15
          speaker: beth
          text: 我头疼，也累，所以才想请你们去。
        - id: ch01-b16
          speaker: meg
          text: 艾米快回来了，让她替咱们跑一趟。
        - id: ch01-b17
          speaker: narrator
          text: 贝丝只好在沙发上躺下，其他人又各自忙起自己的事，胡梅尔一家很快就被忘了。一个钟头过去，艾米一直没有回来。梅格上楼试新衣，乔埋头写故事，汉娜在厨房炉边睡得正香。最后，贝丝悄悄戴上风帽，把给穷孩子们的零碎东西装满篮子。她头很沉，那双一向忍耐的眼睛里满是忧伤，就这样独自走进冷风里。她回来得很晚，谁也没看见她蹑手蹑脚上楼，把自己关进母亲的房间。半个钟头后，乔去“妈妈的壁橱”找东西，这才看见小贝丝坐在药箱上，神情异常严肃。她眼睛通红，手里还紧紧攥着一瓶樟脑酊。
        - id: ch01-b18
          speaker: jo
          text: 哥伦布啊！出什么事了？
          emotion: surprised
        - id: ch01-b19
          speaker: narrator
          text: 贝丝伸手拦住乔，不让她走近。
        - id: ch01-b20
          speaker: beth
          text: 你以前得过猩红热，是不是？
        - id: ch01-b21
          speaker: jo
          text: 好多年前，和梅格一起得的。你为什么问？
        - id: ch01-b22
          speaker: beth
          text: 那我可以告诉你了。乔，那个小宝宝死了！是胡梅尔太太家的。她还没回来，他就在我怀里死了。
          emotion: sad
        - id: ch01-b23
          speaker: narrator
          text: 贝丝哭出了声。乔满心悔恨，坐进母亲的大椅子，把妹妹紧紧搂住。
        - id: ch01-b24
          speaker: jo
          text: 我可怜的宝贝，这对你太残酷了！该去的人明明是我。
          emotion: sad
        - id: ch01-b25
          speaker: beth
          text: 不是残酷，只是太伤心了。我一看就知道他病得更重。洛琴说妈妈去请大夫，我便抱过宝宝，让洛蒂休息。他像睡着了，忽然轻轻叫了一声，抖了一下，就再也不动。我想暖热他的脚，洛蒂也喂了牛奶，可他一点反应也没有。我就知道，他死了。
          emotion: sad
        - id: ch01-b26
          speaker: jo
          text: 亲爱的，别哭。后来呢？
        - id: ch01-b27
          speaker: beth
          text: 我什么也没做，只是坐在那里，一直轻轻抱着他，等胡梅尔太太带着大夫回来。大夫说宝宝已经死了，又去看嗓子疼的海因里希和明娜。他很生气，说这是猩红热，他们早就该请他。胡梅尔太太告诉他，家里实在太穷，只能先自己想办法给宝宝治病，可如今已经晚了。她只求大夫救救另外几个孩子，诊金也只能指望好心人替她付。大夫听完笑了一下，态度也和气了。可那情形太伤心，我陪他们一起哭。大夫忽然转过身，叫我立刻回家服颠茄，要不然我也会得猩红热。
        - id: ch01-b28
          speaker: jo
          text: 不，你不会病！贝丝，要是你病倒了，我永远也不能原谅自己。现在怎么办？
          emotion: fearful
        - id: ch01-b29
          speaker: beth
          text: 别怕，就算染上，大概也不会重。妈妈的医书说，起初会头疼、嗓子疼，浑身感觉古怪，我正是这样。我已经服了颠茄，现在好些了。
          emotion: calm
        - id: ch01-b30
          speaker: narrator
          text: 贝丝说着，把冰凉的双手贴在自己滚烫的额头上，努力装出精神不错的样子。乔只盼母亲此刻就在家里。她一把抓起那本医书，忽然觉得华盛顿远得像在天边。她先读了一页，又抬头看看贝丝，摸摸她的额头，最后还探头仔细查看妹妹的喉咙。
        - id: ch01-b31
          speaker: jo
          text: 你照料那个宝宝一个多星期，又接触了那些快发病的孩子，恐怕真的染上了。我去叫汉娜，她知道该怎么照顾病人。
        - id: ch01-b32
          speaker: beth
          text: 别让艾米进来。她没得过这种病，我不愿传给她。你和梅格不会再得一次吧？
        - id: ch01-b33
          speaker: jo
          text: 大概不会。真再得一次，我也不在乎。谁叫我这头自私的猪只顾写废话，让你一个人去！这是我活该。
          emotion: angry
        - id: ch01-b34
          speaker: narrator
          text: 乔出去找汉娜商量。这个好心人方才还在厨房炉边沉睡，眨眼间便完全清醒，马上接手安排一切。她向姑娘们保证，根本不必着急，人人都有可能得猩红热，只要从一开始好好医治，谁也不会死。她说得那么肯定，乔把这番安慰全都信了。两人一起上楼去叫梅格时，乔心里已经轻松了许多。
        - id: ch01-b35
          speaker: hannah
          text: 咱们先请班斯大夫来瞧瞧，好从一开始就不出岔子。艾米去马奇姑婆家住些日子，免得染病。你们留一个人在家，陪贝丝一两天。
        - id: ch01-b36
          speaker: meg
          text: 我留下。我年纪最大，当然该是我。
        - id: ch01-b37
          speaker: jo
          text: 不，我留下。她生病是我的错。我答应妈妈替她跑腿，却没有做到。
        - id: ch01-b38
          speaker: hannah
          text: 贝丝，你想要谁陪？一个人就够啦。
        - id: ch01-b39
          speaker: beth
          text: 请让乔陪我。
        - id: ch01-b40
          speaker: narrator
          text: 贝丝把头靠在乔身上，脸上又安心又满足，事情就这样定了。梅格有一点受伤，不过总的说来，也暗暗松了一口气。她不爱护理病人，乔却很喜欢。艾米听说要去姑婆家，当场反抗起来，激动地说，她宁可得猩红热也不愿去。梅格先同她讲道理，又央求她，最后还拿出姐姐的威严命令她，可全都不管用。艾米一口咬定不走，梅格只好绝望地去找汉娜。她还没回来，劳里便走进客厅，看见艾米把脸埋在沙发垫里，哭个不停。
        - id: ch01-b41
          speaker: narrator
          text: 艾米说完委屈，等着安慰。劳里却插着口袋，在屋里吹着口哨来回走。想好办法以后，他坐到她身旁。
        - id: ch01-b42
          speaker: laurie
          text: 做个懂事的小姑娘，照他们说的办。先别哭，听听我的好办法。你住到姑婆家，我每天来，带你坐车、散步，咱们一定玩得很痛快。这不比留在家里发闷好吗？
        - id: ch01-b43
          speaker: amy
          text: 我不想被人打发走，好像我是个累赘。
        - id: ch01-b44
          speaker: laurie
          text: 小傻瓜，他们是怕你生病。你总不想染上吧？
        - id: ch01-b45
          speaker: amy
          text: 我当然不想。可我一直跟贝丝在一起，恐怕已经染上了。
        - id: ch01-b46
          speaker: laurie
          text: 那就更该立刻离开，说不定还躲得过。换个地方，有人照料，就算真病了，也会轻些。小姐，猩红热可不是玩笑。
        - id: ch01-b47
          speaker: amy
          text: 姑婆家闷得要命，她脾气还那么坏。
        - id: ch01-b48
          speaker: laurie
          text: 有我每天来告诉你贝丝的消息，再带你出去到处玩，你就不会闷了。老太太很喜欢我。我会把嘴抹得像蜜一样甜，尽量哄她高兴。这样一来，无论咱们做什么，她都不会像一只坏脾气的鸟那样啄咱们。
        - id: ch01-b49
          speaker: amy
          text: 你会套上帕克拉的小快车带我出去？每天都来？贝丝一好，马上接我回家？还真的带我去看戏？
        - id: ch01-b50
          speaker: laurie
          text: 凭我的绅士名誉起誓。一天也不落，贝丝一好，一分钟也不耽搁。只要大人准许，十二场戏都带你看。
        - id: ch01-b51
          speaker: amy
          text: 那么……我想，我去吧。
        - id: ch01-b52
          speaker: laurie
          text: 好姑娘！叫梅格来，告诉她你肯让步了。
        - id: ch01-b53
          speaker: narrator
          text: 劳里赞许地拍了拍她。艾米觉得这一拍比“让步”两个字还叫人生气。梅格和乔听见消息，飞奔下楼，亲眼来看劳里创造的奇迹。艾米这时觉得自己十分金贵，又为全家作出了了不起的牺牲。她郑重答应，只要大夫说贝丝真的要病，她就去马奇姑婆家。
        - id: ch01-b54
          speaker: laurie
          text: 小宝贝怎么样？
        - id: ch01-b55
          speaker: narrator
          text: 贝丝是劳里格外疼爱的朋友。他心里十分担心，只是不肯全显在脸上，所以问话时还装得若无其事。
        - id: ch01-b56
          speaker: meg
          text: 她躺在妈妈床上，已经好些了。宝宝的死让她很难过，也许只是着凉。汉娜也这么说，可汉娜看起来担心，我就跟着坐立不安。
        - id: ch01-b57
          speaker: jo
          text: 这个世界真会折磨人！刚逃过一桩麻烦，另一桩又砸下来。妈妈不在，什么都靠不住，我像漂在海上，完全没了方向。
          emotion: angry
        - id: ch01-b58
          speaker: laurie
          text: 别把自己揉成豪猪，那可不好看。理理你的假发吧。要不要给你母亲发电报？还有什么事要我办？
        - id: ch01-b59
          speaker: narrator
          text: 劳里说着乔的头发，心里仍然很惋惜。他始终不能接受自己的朋友剪掉长发，因为在他看来，那原本是乔身上唯一称得上美丽的地方。哪怕乔自己并不在意，劳里也一直没有真正想通这件事。
        - id: ch01-b60
          speaker: meg
          text: 我也正愁这个。贝丝真病了，应该告诉妈妈。可汉娜说妈妈不能离开爸爸，告诉他们只会叫两个人着急。她说贝丝很快会好，自己也懂得照料。妈妈又吩咐我们听汉娜的话。我们大概只能照办，可我总觉得不妥。
        - id: ch01-b61
          speaker: laurie
          text: 这个我也说不好。大夫来过以后，问问祖父吧。
        - id: ch01-b62
          speaker: meg
          text: 好。乔，马上去请班斯大夫。大夫不来，咱们什么也定不了。
        - id: ch01-b63
          speaker: laurie
          text: 乔别动，我才是这家专门跑腿的小厮。
        - id: ch01-b64
          speaker: meg
          text: 可你也许正忙。
        - id: ch01-b65
          speaker: laurie
          text: 我今天的功课做完了。
        - id: ch01-b66
          speaker: jo
          text: 放假也要念书？
        - id: ch01-b67
          speaker: laurie
          text: 邻居榜样这么好，我当然得学。
        - id: ch01-b68
          speaker: narrator
          text: 劳里话音一落，便敏捷地纵身出了房间，转眼又飞快翻过篱笆，赶去请大夫。乔站在屋里，目送他一路跑远，还赞许地笑了。
        - id: ch01-b69
          speaker: jo
          text: 我对我家小子很有信心。
        - id: ch01-b70
          speaker: meg
          text: 一个男孩子能这样，算不错了。
        - id: ch01-b71
          speaker: narrator
          text: 班斯大夫很快来了。他说贝丝已经显出猩红热的症状，不过大概不会病得太重。只是听完胡梅尔家的事，他的神情变得很严肃。艾米奉命马上离开，还服了预防染病的药。随后，她摆出十分隆重的气派启程，由乔和劳里一路护送，到了马奇姑婆家。
        - id: ch01-b72
          speaker: narrator
          text: 马奇姑婆还是照她一贯的方式接待他们。她坐在椅子里，从眼镜上方用锐利的目光打量几个人。那只鹦鹉就蹲在她的椅背上。
        - id: ch01-b73
          speaker: aunt_march
          text: 这回又来要什么？
        - id: ch01-b74
          speaker: polly
          text: 走开！这里不许男孩子进来！
        - id: ch01-b75
          speaker: narrator
          text: 听见鹦鹉赶人，劳里便退到窗边站着。乔留在姑婆面前，把贝丝怎样接触病人、艾米为什么必须暂时离家的事，从头到尾讲了一遍。
        - id: ch01-b76
          speaker: aunt_march
          text: 任由你们往穷人堆里钻，我早知道会出事。艾米可以留下。她要是没病，就得帮我干活，不过瞧她这样，准会病。别哭，孩子，我最烦听人抽鼻子。
        - id: ch01-b77
          speaker: narrator
          text: 艾米正要落泪，劳里偷偷扯了鹦鹉的尾巴。波莉惊讶地嘎了一声。
        - id: ch01-b78
          speaker: polly
          text: 我的靴子啊！
          emotion: surprised
        - id: ch01-b79
          speaker: narrator
          text: 波莉喊得实在滑稽，艾米来不及掉下来的眼泪一下收了回去，反而笑出了声。姑婆没有跟着笑，只是粗声粗气地问起她们的母亲有没有消息。
        - id: ch01-b80
          speaker: jo
          text: 爸爸好多了。
        - id: ch01-b81
          speaker: aunt_march
          text: 噢，是吗？我看好不了多久。马奇从来没有强健的体魄。
        - id: ch01-b82
          speaker: polly
          text: 哈，哈！永远别说完啦！闻一撮鼻烟！再见，再见！
        - id: ch01-b83
          speaker: narrator
          text: 波莉一面尖叫，一面在栖木上跳来跳去。劳里又从后面偷偷揪它，气得它伸出爪子，去抓老太太头上的帽子。
        - id: ch01-b84
          speaker: aunt_march
          text: 住嘴，你这只没规矩的老鸟！乔，你也马上回去。这么晚还跟一个没头脑的小子到处乱跑，成什么样子。他就像……
          emotion: angry
        - id: ch01-b85
          speaker: polly
          text: 住嘴，你这只没规矩的老鸟！
        - id: ch01-b86
          speaker: narrator
          text: 波莉砰的一声从椅背上跌下来，接着跑去啄那个“没头脑的小子”。劳里听见它学舌，已经笑得浑身发抖。后来乔和劳里离开了，艾米独自留在姑婆身边。她暗暗想着，自己大概忍受不了这样的日子，不过无论如何，她会努力试一试。
        - id: ch01-b87
          speaker: polly
          text: 走开，你这个丑八怪！
        - id: ch01-b88
          speaker: narrator
          text: 波莉这句粗鲁的告别，成了最后一根稻草。艾米本来决心忍耐，这时到底没有忍住，委屈地抽了一下鼻子。
