  chapters:
    - id: ch01
      title: Little Faithful
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: For one whole week, the old house held enough goodness for the entire neighborhood. Everyone seemed almost heavenly, and giving things up was suddenly fashionable. But once the first fear about Father had eased, the girls slowly relaxed. They still remembered their motto. Hope and work simply felt easier now. After making such heroic efforts, they decided that Endeavor deserved a holiday, and they gave it several.
        - id: ch01-b02
          speaker: narrator
          text: Jo had failed to keep her shorn head warm and caught a bad cold. She was ordered to stay home until it passed, since Aunt March disliked hearing anyone read with a stuffed-up head. Jo was pleased enough. She searched energetically from attic to cellar, then settled on the sofa with arsenicum, a pile of books, and her cold.
        - id: ch01-b03
          speaker: narrator
          text: Amy discovered that art and housework did not mix, so she went back to making mud pies. Meg taught her pupils every day and supposedly sewed at home. In truth, she spent much of her time writing long letters to Mother or reading the news from Washington again and again. Only Beth kept steadily on, with no more than an occasional spell of idleness or grief.
        - id: ch01-b04
          speaker: narrator
          text: Beth finished every small duty each day, along with many that her forgetful sisters left undone. Without her, the household was like a clock whose pendulum had gone visiting. Whenever she longed too much for Mother or grew frightened about Father, she slipped into one particular closet. There she buried her face in the folds of a dear old dress, let out her small sorrow, and said her quiet prayer.
        - id: ch01-b05
          speaker: narrator
          text: No one knew what restored her after those sober moments. They only knew that Beth was sweet and helpful, and soon everyone came to her for comfort or advice about their little troubles. None of the sisters realized that this time was testing their character. Once the excitement passed, they thought they had done very well and earned some praise. They had done well. Their mistake was stopping, and the lesson that followed brought them fear and bitter regret.
        - id: ch01-b06
          speaker: narrator
          text: Ten days after Mrs. March left, Beth spoke to Meg.
        - id: ch01-b07
          speaker: beth
          text: Meg, would you please go see the Hummels? Mother told us not to forget them.
        - id: ch01-b08
          speaker: meg
          text: I'm much too tired this afternoon.
        - id: ch01-b09
          speaker: narrator
          text: Meg rocked comfortably while she sewed. Beth turned to Jo.
        - id: ch01-b10
          speaker: beth
          text: Could you go, Jo?
        - id: ch01-b11
          speaker: jo
          text: Not in this storm, not with my cold.
        - id: ch01-b12
          speaker: beth
          text: I thought your cold was nearly gone.
        - id: ch01-b13
          speaker: jo
          text: It's gone enough for an outing with Laurie, but not enough for a visit to the Hummels.
        - id: ch01-b14
          speaker: narrator
          text: Jo laughed, though she looked a little ashamed of herself.
        - id: ch01-b15
          speaker: meg
          text: Why don't you go, Beth?
        - id: ch01-b16
          speaker: beth
          text: I've gone every day. The baby is sick, and I don't know how to help. Mrs. Hummel has to leave for work, so Lottchen watches the baby. But it keeps getting worse. I really think you or Hannah should go.
        - id: ch01-b17
          speaker: narrator
          text: Beth was so earnest that Meg promised to go the next day.
        - id: ch01-b18
          speaker: jo
          text: Ask Hannah to make them something nice, then carry it over. The fresh air might help you. I'd go myself, only I want to finish my story.
        - id: ch01-b19
          speaker: beth
          text: My head hurts, and I'm tired. That's why I hoped one of you might go.
        - id: ch01-b20
          speaker: meg
          text: Amy will be home soon. She can run over for us.
        - id: ch01-b21
          speaker: narrator
          text: Beth lay on the sofa, her sisters returned to their work, and everyone forgot the Hummels. An hour went by. Amy still had not come. Meg went upstairs to try on a new dress. Jo vanished into her story, and Hannah slept soundly beside the kitchen fire.
        - id: ch01-b22
          speaker: narrator
          text: So Beth quietly put on her hood. She filled a basket with odds and ends for the poor children and stepped into the cold air, her head heavy and her patient eyes hurt. She returned late. No one saw her creep upstairs and shut herself in Mother's room.
        - id: ch01-b23
          speaker: narrator
          text: Half an hour later, Jo went to Mother's closet for something. She found Beth perched on the medicine chest, looking terribly serious. Her eyes were red, and she held a bottle of camphor.
        - id: ch01-b24
          speaker: jo
          text: Christopher Columbus! What's happened?
          emotion: surprised
        - id: ch01-b25
          speaker: narrator
          text: Beth held out one hand to keep Jo back.
        - id: ch01-b26
          speaker: beth
          text: You had scarlet fever once, didn't you?
        - id: ch01-b27
          speaker: jo
          text: Years ago, at the same time Meg did. Why?
        - id: ch01-b28
          speaker: beth
          text: Then I can tell you. Oh, Jo, the baby died!
          emotion: sad
        - id: ch01-b29
          speaker: jo
          text: Which baby?
        - id: ch01-b30
          speaker: beth
          text: Mrs. Hummel's baby. It died in my arms before she came home.
          emotion: sad
        - id: ch01-b31
          speaker: narrator
          text: Beth broke into a sob. Jo sat in Mother's big chair and gathered her sister close. Remorse filled her face.
        - id: ch01-b32
          speaker: jo
          text: Oh, my poor Beth. How awful that must have been. I should have gone with you.
          emotion: sad
        - id: ch01-b33
          speaker: beth
          text: It wasn't awful, Jo. It was only terribly sad. I saw right away that the baby was worse. Lottchen said her mother had gone to find a doctor, so I took the baby and let Lotty rest. It seemed to be sleeping. Then, all at once, it gave one little cry and shook. After that, it was completely still. I tried warming its feet, and Lotty gave it milk, but it never moved. I knew it was dead.
          emotion: sad
        - id: ch01-b34
          speaker: jo
          text: Don't cry, dear. What did you do then?
        - id: ch01-b35
          speaker: beth
          text: I sat there and held it gently until Mrs. Hummel came back with the doctor. He said the baby was dead. Then he looked at Heinrich and Minna because their throats were sore. He told Mrs. Hummel it was scarlet fever and scolded her for waiting so long to call him.
          emotion: sad
        - id: ch01-b36
          speaker: beth
          text: She explained that she was poor and had tried to cure the baby herself. Now it was too late. All she could do was ask him to save the other children and trust that charity would pay him. That softened him, and he became kinder. It was all so sad. I cried with them until the doctor suddenly turned on me and ordered me home. He said I had to take belladonna at once or I might catch the fever.
          emotion: sad
        - id: ch01-b37
          speaker: jo
          text: No, you won't catch it! Oh, Beth, if you get sick, I'll never forgive myself. What are we going to do?
          emotion: fearful
        - id: ch01-b38
          speaker: narrator
          text: Jo hugged her close, looking frightened.
        - id: ch01-b39
          speaker: beth
          text: Please don't be scared. I don't think I'll have it badly. I checked Mother's book. It says the fever starts with a headache, a sore throat, and strange feelings like mine. I took some belladonna, and I do feel better.
          emotion: calm
        - id: ch01-b40
          speaker: narrator
          text: Beth pressed her cold hands against her hot forehead and tried to look healthy. Jo seized the book. With Mother in Washington, the city suddenly seemed impossibly far away. She read a page, studied Beth, felt her forehead, and looked down her throat.
        - id: ch01-b41
          speaker: jo
          text: You've been close to that baby every day for more than a week. You've also been around the other children, and they're probably getting sick too. I'm afraid you really are coming down with it, Beth. I'll get Hannah. She knows what to do.
        - id: ch01-b42
          speaker: beth
          text: Don't let Amy come near me. She's never had it, and I couldn't bear to give it to her. You and Meg can't catch it twice, can you?
          emotion: fearful
        - id: ch01-b43
          speaker: jo
          text: I don't think so, and I don't care if I do. It would serve me right. I was a selfish pig to send you out while I stayed home writing rubbish.
        - id: ch01-b44
          speaker: narrator
          text: Jo hurried off to consult Hannah. In an instant, the good woman was wide awake and firmly in charge. She said there was no reason to panic. Nearly everyone had scarlet fever, she claimed, and no one died when it was treated properly. Jo believed every word and felt much better as they went to wake Meg.
        - id: ch01-b45
          speaker: narrator
          text: Hannah examined Beth and asked her questions. Then she announced her plan.
        - id: ch01-b46
          speaker: hannah
          text: We'll have Dr. Bangs take a look at you, dear, just so we begin the right way. Then Amy will stay with Aunt March for a while, safely out of danger. One of you older girls can remain home and keep Beth company for a day or two.
        - id: ch01-b47
          speaker: meg
          text: Of course I'll stay. I'm the oldest.
        - id: ch01-b48
          speaker: narrator
          text: Meg looked anxious and guilty, but Jo spoke with decision.
        - id: ch01-b49
          speaker: jo
          text: No, I'll stay. It's my fault she's ill. I promised Mother I'd run the errands, and I haven't done it.
        - id: ch01-b50
          speaker: hannah
          text: Which sister do you want, Beth? We only need one.
        - id: ch01-b51
          speaker: beth
          text: Jo, please.
        - id: ch01-b52
          speaker: narrator
          text: Beth rested her head against Jo with such a peaceful look that the question was settled. Meg felt a little hurt, but also rather relieved. She disliked nursing, while Jo liked it.
        - id: ch01-b53
          speaker: meg
          text: I'll go tell Amy.
        - id: ch01-b54
          speaker: narrator
          text: Amy rebelled completely. She passionately declared that she would rather catch the fever than stay with Aunt March. Meg tried reasoning, pleading, and ordering. Nothing worked. Amy insisted she would not go, and Meg finally left in despair to ask Hannah what to do.
        - id: ch01-b55
          speaker: narrator
          text: Before Meg returned, Laurie entered the parlor and found Amy sobbing into the sofa cushions. She told him her troubles and waited for sympathy. Instead, he put his hands in his pockets and paced around, whistling softly while he thought. At last he sat beside her and used his most persuasive voice.
        - id: ch01-b56
          speaker: laurie
          text: Come on, be sensible and do what they ask. No, don't cry. Listen to my splendid plan. You go stay with Aunt March, and I'll visit every day. We'll drive or walk and have a wonderful time. Wouldn't that be better than sitting here feeling miserable?
          emotion: calm
        - id: ch01-b57
          speaker: amy
          text: I don't want everyone sending me away as though I'm only in the way.
          emotion: sad
        - id: ch01-b58
          speaker: laurie
          text: Goodness, Amy, they're trying to keep you healthy. You don't actually want to be sick, do you?
        - id: ch01-b59
          speaker: amy
          text: Of course I don't. But I'll probably catch it anyway. I've been with Beth constantly.
        - id: ch01-b60
          speaker: laurie
          text: That's exactly why you should leave now, while you may still escape it. Fresh air and good care might keep you well. Even if they don't, perhaps you'll only have a mild case. Scarlet fever is serious, miss, so I advise you to go as soon as possible.
        - id: ch01-b61
          speaker: amy
          text: Aunt March's house is so dull, and she's terribly cross.
          emotion: fearful
        - id: ch01-b62
          speaker: laurie
          text: It won't be dull if I appear every day with news of Beth and take you out adventuring. The old lady likes me. I'll charm her so thoroughly that she won't peck at either of us, no matter what we do.
        - id: ch01-b63
          speaker: amy
          text: Will you take me driving with Puck and the trotting wagon?
        - id: ch01-b64
          speaker: laurie
          text: You have my word as a gentleman.
        - id: ch01-b65
          speaker: amy
          text: And you'll come every single day?
        - id: ch01-b66
          speaker: laurie
          text: Just watch me.
        - id: ch01-b67
          speaker: amy
          text: And bring me home the very moment Beth is well?
        - id: ch01-b68
          speaker: laurie
          text: That exact moment.
        - id: ch01-b69
          speaker: amy
          text: Will we truly go to the theater?
        - id: ch01-b70
          speaker: laurie
          text: A dozen theaters, if they'll let us.
        - id: ch01-b71
          speaker: amy
          text: Well... I suppose I'll go.
        - id: ch01-b72
          speaker: laurie
          text: Good girl. Call Meg and tell her you've agreed.
          emotion: happy
        - id: ch01-b73
          speaker: narrator
          text: Laurie gave her an approving pat. The pat annoyed Amy more than having to surrender. Meg and Jo rushed down to witness the miracle. Feeling very important and self-sacrificing, Amy promised to leave if the doctor said Beth was truly ill.
        - id: ch01-b74
          speaker: laurie
          text: How is the little dear?
        - id: ch01-b75
          speaker: narrator
          text: Beth was Laurie's special favorite, and he worried more than he wanted anyone to see.
        - id: ch01-b76
          speaker: meg
          text: She's resting on Mother's bed and says she feels better. The baby's death upset her terribly, but perhaps she only has a cold. Hannah says that's probably all it is. Still, Hannah looks worried, and now I'm nervous too.
        - id: ch01-b77
          speaker: jo
          text: What a difficult world! The instant one trouble ends, another drops on our heads. With Mother gone, there's nothing solid to hold on to. I feel completely lost.
          emotion: sad
        - id: ch01-b78
          speaker: narrator
          text: Jo fretfully pushed her short hair in every direction.
        - id: ch01-b79
          speaker: laurie
          text: Don't turn yourself into a porcupine. It doesn't suit you. Fix your wig, Jo, and tell me whether I should telegraph your mother or do anything else.
        - id: ch01-b80
          speaker: narrator
          text: Laurie had never accepted the loss of his friend's one great beauty.
        - id: ch01-b81
          speaker: meg
          text: That's what I can't decide. If Beth is truly sick, Mother ought to know. Hannah says we must not tell her, because she can't leave Father and the news would only frighten them both. Beth may recover quickly. Hannah knows what to do, and Mother told us to obey her. I suppose we should, but keeping quiet feels wrong.
        - id: ch01-b82
          speaker: laurie
          text: Hmm. I can't decide that for you. Once the doctor has come, why not ask Grandfather?
        - id: ch01-b83
          speaker: meg
          text: We will. Jo, go fetch Dr. Bangs immediately. We can't choose anything until he examines Beth.
        - id: ch01-b84
          speaker: laurie
          text: Stay here, Jo. I'm the official errand boy for this household.
        - id: ch01-b85
          speaker: narrator
          text: Laurie picked up his cap.
        - id: ch01-b86
          speaker: meg
          text: But aren't you busy?
        - id: ch01-b87
          speaker: laurie
          text: No. My lessons are finished for today.
        - id: ch01-b88
          speaker: jo
          text: You study during vacation?
        - id: ch01-b89
          speaker: laurie
          text: I follow the excellent example set by my neighbors.
        - id: ch01-b90
          speaker: narrator
          text: With that, he swung himself out of the room.
        - id: ch01-b91
          speaker: jo
          text: I have great hopes for that boy.
        - id: ch01-b92
          speaker: narrator
          text: Jo watched him fly over the fence and smiled with approval.
        - id: ch01-b93
          speaker: meg
          text: He does reasonably well, considering he's a boy.
        - id: ch01-b94
          speaker: narrator
          text: Meg sounded less generous because Laurie was not the subject that interested her. Dr. Bangs soon arrived. Beth did show signs of scarlet fever, he said, though he expected a mild case. But the account of the Hummel baby made him look grave. He ordered Amy away at once and gave her medicine meant to protect her. Then she departed in great style, escorted by Jo and Laurie.
        - id: ch01-b95
          speaker: narrator
          text: Aunt March welcomed the three visitors in her usual fashion. She peered sharply over her spectacles. Behind her chair sat Polly, the parrot.
        - id: ch01-b96
          speaker: aunt_march
          text: Well? What is it this time?
        - id: ch01-b97
          speaker: polly
          text: Go away! No boys in here!
        - id: ch01-b98
          speaker: narrator
          text: Laurie withdrew to the window while Jo explained everything.
        - id: ch01-b99
          speaker: aunt_march
          text: This is exactly what I expected when you were allowed to poke around among poor people. Amy may stay and be useful, provided she isn't sick already. I don't doubt she will be. She certainly looks sick. Stop crying, child. I cannot stand that sniffling sound.
        - id: ch01-b100
          speaker: narrator
          text: Amy was just about to cry. Then Laurie secretly tugged Polly's tail.
        - id: ch01-b101
          speaker: polly
          text: Bless my boots!
          emotion: surprised
        - id: ch01-b102
          speaker: narrator
          text: The parrot's shocked croak was so funny that Amy laughed instead.
        - id: ch01-b103
          speaker: aunt_march
          text: What news have you had from your mother?
        - id: ch01-b104
          speaker: jo
          text: Father is doing much better.
        - id: ch01-b105
          speaker: narrator
          text: Jo made an effort to keep a straight face.
        - id: ch01-b106
          speaker: aunt_march
          text: Is he? Well, I don't expect that improvement to last. March never had much strength.
        - id: ch01-b107
          speaker: polly
          text: Ha, ha! Never say die! Take some snuff! Goodbye, goodbye!
        - id: ch01-b108
          speaker: narrator
          text: Polly shrieked and danced on his perch, clawing Aunt March's cap while Laurie teased him from behind.
        - id: ch01-b109
          speaker: aunt_march
          text: Be quiet, you rude old bird! Jo, you should leave at once. It isn't proper to wander around so late with a scatterbrained boy like—
          emotion: angry
        - id: ch01-b110
          speaker: polly
          text: Be quiet, you rude old bird!
        - id: ch01-b111
          speaker: narrator
          text: Polly bounced off the chair and ran to peck the scatterbrained boy, who was shaking with laughter over that final remark. Soon Jo and Laurie left, and Amy found herself alone with Aunt March.
        - id: ch01-b112
          speaker: amy
          text: I don't think I can endure this, but I'll try.
          emotion: sad
        - id: ch01-b113
          speaker: narrator
          text: That was what Amy told herself.
        - id: ch01-b114
          speaker: polly
          text: Get along, you fright!
        - id: ch01-b115
          speaker: narrator
          text: At that rude farewell, Amy could no longer hold back a sniff.
