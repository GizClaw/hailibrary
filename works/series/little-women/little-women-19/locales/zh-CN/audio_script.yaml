audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，含蓄机智, timbre: 清澈柔和, pace: 从容而有变化, pitch: 中音}
    amy:
      display_name: 艾米
      tts: {delivery: 娇气讲究，孩子气中带着自尊, timbre: 清脆明亮, pace: 适中偏快, pitch: 高音}
    laurie:
      display_name: 劳里
      tts: {delivery: 活泼亲切，善于打趣哄人, timbre: 明朗温暖, pace: 轻快, pitch: 中音}
    aunt_march:
      display_name: 马奇姑婆
      tts: {delivery: 粗声直率，挑剔而威严, timbre: 苍老干脆, pace: 偏慢, pitch: 中低音}
    polly:
      display_name: 波莉
      tts: {delivery: 尖锐滑稽，爱学舌, timbre: 嘶哑尖亮, pace: 忽快忽慢, pitch: 高音}
    esther:
      display_name: 埃丝特
      tts: {delivery: 虔诚亲切，带一点法国式的郑重, timbre: 柔和醇厚, pace: 舒缓, pitch: 中音}
  chapters:
    - id: ch01
      title: 姑婆家的苦日子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 马奇家经历那些忧心事的时候，艾米在姑婆家也很不好过。离开家以后，她尝到了想家的苦味，也头一回真正明白，自己平日受了多少疼爱，又有多么得宠。马奇姑婆从不娇惯任何人，她根本不赞成那一套。不过她确实喜欢这个举止规矩的小姑娘，也真心疼侄子的几个女儿，只是觉得把疼爱说出口很不成体统。她当真努力想让艾米快活，偏偏总用错办法。有些老人脸上添了皱纹，头发染上霜色，心却还是年轻的。他们懂孩子那些小小的烦恼和快乐，能让孩子在身边无拘无束，也会把聪明的教导藏进有趣的游戏，用最甜美的方式付出友爱，再得到友爱。马奇姑婆没有这份本领。她只有一套规矩、命令、一本正经的做派和没完没了的说教。发现艾米比乔温顺和气，她更认定自己有责任纠正马奇家过分自由、过分纵容带来的坏影响，便牵起艾米的手，拿六十年前自己受教的办法来管她。可怜的艾米像只落进蛛网的苍蝇，面对着一只严厉的老蜘蛛，心里怕得很。
        - id: ch01-b02
          speaker: narrator
          text: 每天一早，艾米先洗杯子，再把老汤匙、圆鼓鼓的银茶壶和玻璃杯一件件擦亮。接着是最磨人的掸灰。姑婆连一粒灰都看得见，屋里的家具却长着兽爪似的腿，处处是雕花，怎么擦也不能让她满意。然后，艾米要喂波莉，给暴躁的哈巴狗梳毛，还得替跛得厉害、很少离开大椅子的姑婆跑上跑下十来趟，不停取东西、传吩咐。忙完这些，她又要温习功课。每天这一套差事，都把她的耐心、温顺和其他美德轮番考验一遍。直到全部做完，她才得到一个钟头，可以活动，也可以玩耍。她把这一个钟头看得比什么都珍贵。
        - id: ch01-b03
          speaker: narrator
          text: 劳里每天都来，软磨硬泡地哄姑婆，直到她准许艾米出去。他们一起散步、骑马，那是一天里最快活的时候。午饭以后，艾米得大声念书。姑婆常常第一页还没听完就睡着了，她却不能走，也不能出声，只能安静坐着，往往一坐就是一小时。然后又该缝拼布或毛巾。她脸上服从，心里反抗，一针针熬到黄昏，才可以随自己的心意消遣一会儿，直到下午茶时间。夜晚最难捱，姑婆讲起年轻时的旧事，总也讲不完，内容又枯燥得没法形容。艾米盼着赶快上床，本想为自己的悲惨命运痛哭一场，可通常才挤出一两滴眼泪，就已经睡着了。
        - id: ch01-b04
          speaker: narrator
          text: 要不是劳里和老女仆埃丝特，她觉得自己绝对撑不过去。光是鹦鹉波莉，就能把人逼疯。它知道艾米不喜欢自己，便专门报复。艾米一靠近，它就扯她的头发。笼子刚收拾干净，它马上打翻面包牛奶。姑婆打瞌睡时，它又去啄小狗莫普，逗得狗乱叫。有客人在，它还会骂艾米。莫普也好不到哪儿去。这个肥胖暴躁的家伙，梳毛时又吼又叫，讨吃的时便四脚朝天地躺倒，摆出一张傻脸。偏偏它一天要吃上十来回。厨娘脾气坏，老车夫耳朵聋，满屋子只有埃丝特肯留心照顾这位小小姐。
    - id: ch02
      title: 首饰柜里的念珠
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 埃丝特是法国人，服侍“太太”已经多年。她总这样称呼马奇姑婆，实际上也颇能管住自己的女主人，因为老太太离不开她。她原名埃丝黛尔，是姑婆命令她改了名字。她答应改名，却先讲好，谁也不许逼她改换宗教。她很喜欢艾米。整理花边时，她会讲法国的奇闻趣事，逗得艾米十分开心。她也准艾米在大宅子里闲逛，翻看衣柜和老箱子里那些漂亮古怪的收藏。
        - id: ch02-b02
          speaker: narrator
          text: 艾米最爱一只印度式样的柜子。柜里有许多奇形怪状的抽屉、小格子和暗层，塞满了年深日久的饰物。有些很贵重，有些不过是稀奇，可每件都带着旧时光。艾米查看这些东西，再把它们整理好，总能得到极大的满足。首饰盒尤其让她着迷。四十年前，那些躺在天鹅绒软垫上的饰品，曾经装点过一位风姿绰约的美人。这里有姑婆初入社交界时戴的石榴石、父亲在她出嫁那天送的珍珠、情人送的钻石，还有煤玉丧戒和别针。小盒坠里藏着亡友画像，垂柳是头发编的。还有姑婆早夭女儿的小手镯、姑丈的大怀表，不知多少孩子的小手玩过表上的红印章。最后是一枚单独收好的结婚戒指。戒指早已套不进姑婆发胖的手指，她却依旧珍藏着，仿佛那才是所有珠宝里最贵重的一件。
        - id: ch02-b03
          speaker: esther
          text: 要是让小小姐自己挑，您最想要哪一样？
        - id: ch02-b04
          speaker: narrator
          text: 每次打开这些贵重物件，埃丝特都坐在旁边看守，最后再逐一锁好。
        - id: ch02-b05
          speaker: amy
          text: 我最喜欢钻石，可这里没有项链，我偏偏最爱项链，戴起来多漂亮呀。真让我选，我要这一串。
        - id: ch02-b06
          speaker: narrator
          text: 她欣赏地望着一串金珠与乌木珠相间的链子，链下垂着同样材质的沉重十字架。
        - id: ch02-b07
          speaker: esther
          text: 我也想要它，可不是当项链。啊，不！对我来说，这是念珠。我会像虔诚的天主教徒一样用它。
        - id: ch02-b08
          speaker: amy
          text: 就跟你镜子上挂的香木珠子一样，是吗？
        - id: ch02-b09
          speaker: esther
          text: 正是，是祈祷用的。拿这么美的念珠祷告，总比把它当成炫耀的小饰品戴着更能取悦圣徒。
        - id: ch02-b10
          speaker: amy
          text: 埃丝特，祈祷一定给了你很多安慰。你每次下楼，看起来都那么安宁，又那么满足。我也真想这样。
        - id: ch02-b11
          speaker: esther
          text: 小小姐若是天主教徒，自然能找到真正的安慰。既然不能，您也可以每天独自坐一会儿，静静想一想，再祈祷。太太以前那位好女主人就有一间小礼拜堂，她在那里放下过许多忧愁。
        - id: ch02-b12
          speaker: amy
          text: 那我也这样做，合适吗？
        - id: ch02-b13
          speaker: narrator
          text: 艾米孤零零的，很需要一点帮助。贝丝不在身边提醒，她也常常忘记自己的小书。
        - id: ch02-b14
          speaker: esther
          text: 再合适不过了。您愿意的话，我来收拾旁边的小更衣室。别告诉太太。等她睡着，您就进去独自坐一坐，想些美好的事，求亲爱的上帝保佑您的姐姐。
        - id: ch02-b15
          speaker: narrator
          text: 埃丝特的劝告出自真心。她虔诚又慈爱，很同情这些为姐姐担忧的姑娘。艾米喜欢这个主意，便请她布置卧室旁那间明亮的小屋。
        - id: ch02-b16
          speaker: amy
          text: 不知道姑婆去世以后，这些好东西会归谁。
        - id: ch02-b17
          speaker: narrator
          text: 她慢慢放回闪亮的念珠，又把首饰盒一个个关上。
        - id: ch02-b18
          speaker: esther
          text: 会归您和您的姐妹。我知道的，太太立遗嘱时，我亲眼见证过，上面就是这么写的。
        - id: ch02-b19
          speaker: amy
          text: 那太好了！可我真希望她现在就给我们。拖着不送，可不讨人喜欢。
        - id: ch02-b20
          speaker: narrator
          text: 说完，她还舍不得似的，又看了钻石一眼。
        - id: ch02-b21
          speaker: esther
          text: 几位小姐现在戴珠宝还太早。太太说，第一个订婚的人可以得到珍珠。我猜您离开时，她会送您那枚小绿松石戒指。她很欣赏您的好品行，也喜欢您举止优雅。
        - id: ch02-b22
          speaker: amy
          text: 你真这么想？啊，只要能拿到那枚可爱的戒指，我一定乖得像小羊！它比基蒂·布赖恩特的漂亮多了。看来我到底还是喜欢姑婆的。
          emotion: happy
        - id: ch02-b23
          speaker: narrator
          text: 艾米欢欢喜喜地试戴那枚蓝色戒指，决心靠好表现把它赢到手。
    - id: ch03
      title: 小礼拜堂与遗嘱
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 从那天起，艾米成了服从的模范，姑婆也很得意，以为全是自己的教导见了成效。埃丝特在更衣室里摆上一张小桌和一只脚凳，又从一间久不开门的屋子借来一幅画。她以为画不值钱，只觉得挂在这里正合适，也料定太太不会发现，更不会在意。其实，那是一幅世界名画的珍贵摹本。
        - id: ch03-b02
          speaker: narrator
          text: 艾米天性爱美，总也看不够画中圣母温柔的脸。看着看着，她心里柔软的思绪便全落在母亲身上。桌上放着她的小本《新约》和赞美诗集，还有一只花瓶，里面总插着劳里送给她的、挑得最好的鲜花。每天，她都来这里“独自坐一会儿”，想些美好的事，求亲爱的上帝保佑姐姐。这间明亮的小屋，渐渐成了她在陌生大宅里最安静的去处。埃丝特送给她一串黑珠念珠，上面带着银十字架。艾米只是把它挂起来，没有使用，因为她拿不准新教徒是否该用念珠祈祷。
        - id: ch03-b03
          speaker: narrator
          text: 她做这些事时，心里是真诚的。离开了安全的家，她急切地需要一只慈爱的手来依靠，便本能地转向那位强大又温柔的朋友。她想念母亲，想念母亲从前怎样教她认识自己、约束自己。既然早有人指给她该去哪里寻找帮助，她便满怀信赖，尽力沿着那条路走下去。
        - id: ch03-b04
          speaker: narrator
          text: 可艾米到底还是个年幼的朝圣者，肩上的担子显得格外沉。她努力少想自己，尽量保持快活，只要做了对的事便满足，哪怕没人看见，也没人夸奖。第一次这样认真地要做个十全十美的好孩子，她忽然决定学姑婆，也写一份遗嘱。万一自己染病死去，所有财物就能分得公平又大方。那些小宝贝在她眼里，和姑婆的珠宝一样珍贵。只要想到要放弃，她心里就很难受。
        - id: ch03-b05
          speaker: narrator
          text: 一天，她趁玩耍的时间尽力写好了这份重要文书，几个法律用语还是埃丝特帮的忙。好心的法国女人签过名，艾米终于松了口气。她收好遗嘱，准备给劳里看，请他做第二个见证人。
    - id: ch04
      title: 女王陛下的严肃文书
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 那天下着雨，艾米便带着波莉上楼，到一间大卧房里找乐子。那里有个衣柜，装满了埃丝特准她拿来玩的旧式衣服。艾米最爱的游戏，就是披上已经褪色的织锦，在长镜子前来回踱步，庄重地屈膝行礼，再拖着长长的裙裾从地板上扫过。那阵沙沙声在她听来美妙极了。这一天，她玩得太入神，既没听见劳里按铃，也没发现自己郑重巡行时，他的脸已经悄悄从门边探了进来。
        - id: ch04-b02
          speaker: narrator
          text: 艾米挥着扇子，昂着脑袋。头上那大团粉红头巾，配着蓝锦缎裙和黄绗缝衬裙，模样古怪极了。她还穿着高跟鞋，只能小心地迈碎步。劳里后来告诉乔，这一幕实在滑稽。波莉侧着身子紧跟在后面，挺胸抬头，拼命模仿艾米，走几步就停下大笑，或是扯着嗓子叫。
        - id: ch04-b03
          speaker: polly
          text: 咱们多漂亮呀！走开，你这个丑八怪！闭嘴！亲亲我，宝贝！哈！哈！
        - id: ch04-b04
          speaker: narrator
          text: 劳里好不容易忍住大笑，免得冒犯女王陛下，这才敲门。艾米开恩接见了他。
        - id: ch04-b05
          speaker: amy
          text: 你先坐下歇会儿，等我把东西收好。我有一件非常严肃的事要跟你商量。那只鸟，简直是我一辈子的磨难。
        - id: ch04-b06
          speaker: narrator
          text: 她展示完华服，把波莉赶到角落，又摘下头上那座粉红色的大山。劳里跨坐在椅子上，听她继续说。
        - id: ch04-b07
          speaker: amy
          text: 昨天姑婆睡着了，我正拼命不出声，波莉却在笼子里尖叫扑腾。我过去放它，才看见一只大蜘蛛。我把蜘蛛拨出去，它钻到了书柜底下。波莉马上追过去，弯腰往里瞧，眼珠还滑稽地转到一边，然后怪声怪气地说，“出来散散步吧，亲爱的。”我一下笑出了声。波莉开始骂人，姑婆也醒了，把我们两个都训了一顿。
        - id: ch04-b08
          speaker: laurie
          text: 那只蜘蛛接受老先生的邀请了吗？
        - id: ch04-b09
          speaker: amy
          text: 接受了。它刚爬出来，波莉反而吓坏了，转身就跑，又手忙脚乱地爬上姑婆的椅子。我追着蜘蛛，它就在那儿不停地叫，“抓住她！抓住她！抓住她！”
        - id: ch04-b10
          speaker: polly
          text: 撒谎！哎哟喂！
        - id: ch04-b11
          speaker: narrator
          text: 波莉一面叫，一面啄劳里的脚趾。劳里冲它挥了挥拳头。
        - id: ch04-b12
          speaker: laurie
          text: 你要是我的鸟，我早把你的脖子拧断了，你这个老祸害。
        - id: ch04-b13
          speaker: narrator
          text: 波莉歪过脑袋，一本正经地嘎声回答。
        - id: ch04-b14
          speaker: polly
          text: 哈利路亚！愿上帝保佑你的纽扣，亲爱的！
        - id: ch04-b15
          speaker: amy
          text: 好了，我准备好了。你读读这个，告诉我合不合法，也妥不妥当。我觉得应该先写下来。人生无常，我可不愿意死后坟墓上还罩着怨气。
        - id: ch04-b16
          speaker: narrator
          text: 艾米关上衣柜，从口袋里拿出一张纸。劳里咬住嘴唇，稍稍转过身，不去看她那张忧郁的小脸。他开始读这份文书。考虑到那些拼写，他居然还能保持严肃，实在很了不起。
        - id: ch04-b17
          speaker: amy
          text: 我的最后遗嘱及证言。本人艾米·柯蒂斯·马奇，心智健全，现把我在人世间的一切财产遗赠如下。也就是，换句话说。
        - id: ch04-b18
          speaker: amy
          text: 给父亲，我最好的图画、素描、地图和所有艺术作品，画框也包括在内。还有我的一百美元，随他使用。给母亲，我所有的衣服，只有那条带口袋的蓝围裙除外。我的肖像和奖章也给她，并送上深深的爱。
        - id: ch04-b19
          speaker: amy
          text: 给亲爱的姐姐玛格丽特，我的绿松石戒指，如果我能得到的话。还有画着鸽子的绿色盒子、一块可以围在她脖子上的真花边，以及我给她画的素描，让她留着纪念自己的妹妹。
        - id: ch04-b20
          speaker: amy
          text: 留给乔，我那枚用封蜡补过的胸针，还有青铜墨水台，虽然盖子被她弄丢了。再把我最珍贵的石膏兔子给她，因为我很后悔烧掉了她的故事。
        - id: ch04-b21
          speaker: amy
          text: 给贝丝，如果她比我活得久，我把玩偶、小五斗橱、扇子、亚麻衣领和新拖鞋都留给她。等她康复，要是脚还很瘦，能穿得下，就全给她。我也把自己的悔意留给她，因为我以前取笑过老乔安娜。
        - id: ch04-b22
          speaker: amy
          text: 给我的朋友兼邻居西奥多·劳伦斯，我的纸浆文件夹，还有我用黏土捏的马，虽说他嫌那匹马没有脖子。为了报答他在我患难时照顾我，我还让他随便挑一件我的艺术作品，最好选《巴黎圣母院》。
        - id: ch04-b23
          speaker: amy
          text: 给我们尊贵的恩人劳伦斯先生，我那只紫色盒子。盒盖里面有镜子，装钢笔正好，也能让他想起这个已经离世的姑娘。她感谢他给她全家的恩惠，尤其感谢他帮助贝丝。
        - id: ch04-b24
          speaker: amy
          text: 我希望最喜欢的玩伴基蒂·布赖恩特得到蓝绸围裙、我的金珠戒指，再加一个吻。给汉娜，她想要的帽盒，还有我做的所有拼布。我把这些留给她，希望她每次看见，都会想起我。
        - id: ch04-b25
          speaker: amy
          text: 现在，我已经处置完最贵重的财产。希望大家都满意，不要责怪死者。我宽恕每一个人，也相信号角响起时，我们还会相见。阿门。公元一八六一年十一月二十日，由艾米·柯蒂斯·马奇签名盖章。见证人，埃丝黛尔·瓦尔诺，西奥多·劳伦斯。
        - id: ch04-b26
          speaker: narrator
          text: 最后一个名字还是铅笔写的。艾米解释说，劳里应该用墨水重新签一遍，再替她封好。
    - id: ch05
      title: 最珍贵的牺牲
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 艾米把一截红带子、封蜡、细蜡烛和墨水台一一摆到劳里面前。劳里神情严肃地问她。
        - id: ch05-b02
          speaker: laurie
          text: 你怎么想到要写遗嘱？有人告诉你，贝丝也把自己的东西分送给大家了吗？
        - id: ch05-b03
          speaker: narrator
          text: 艾米解释了自己的缘由，马上又焦急起来。
        - id: ch05-b04
          speaker: amy
          text: 贝丝怎么了？
          emotion: fearful
        - id: ch05-b05
          speaker: laurie
          text: 真遗憾，我说漏嘴了。既然已经说了，我就告诉你。那天贝丝觉得自己病得很重，便对乔说，她想把钢琴留给梅格，把猫儿们留给你，再把那个可怜的旧玩偶留给乔，因为乔会为了她好好疼爱它。她很难过，觉得能送的东西太少，只好把一绺头发留给我们每个人，把最深的爱留给爷爷。她根本没想到还要立一份遗嘱。
        - id: ch05-b06
          speaker: narrator
          text: 劳里边说边签名，又替遗嘱封印。直到一颗大泪珠落在纸上，他才抬起头。艾米满脸忧伤，却只问了一件事。
        - id: ch05-b07
          speaker: amy
          text: 人们有时候会在遗嘱后面再加一段，是不是？
          emotion: sad
        - id: ch05-b08
          speaker: laurie
          text: 是的，那叫遗嘱附录。
        - id: ch05-b09
          speaker: amy
          text: 那就在我的遗嘱里加上一条。我希望把所有卷发都剪下来，分给朋友们。我刚才忘记写了，可我一定要这样做，就算有损我的容貌也没关系。
          emotion: sad
        - id: ch05-b10
          speaker: narrator
          text: 劳里添上这一条，对艾米最后也是最大的牺牲微微一笑。接下来一个钟头，他想办法逗她开心，又耐心听完她所有的烦恼。可到了要走的时候，艾米拉住他。她嘴唇发颤，声音压得很低。
        - id: ch05-b11
          speaker: amy
          text: 贝丝真的有危险吗？
          emotion: fearful
        - id: ch05-b12
          speaker: laurie
          text: 恐怕是的。不过我们要往好处想，所以别哭，亲爱的。
          emotion: calm
        - id: ch05-b13
          speaker: narrator
          text: 劳里像哥哥一样伸手搂住她，这个动作给了艾米很大的安慰。
        - id: ch05-b14
          speaker: narrator
          text: 劳里走后，艾米进了自己的小礼拜堂。她独自坐在暮色里，眼泪不停地流，心也疼得厉害，只顾为贝丝祈祷。这一刻，她觉得就算有一百万枚绿松石戒指，也不能安慰她失去温柔的小妹妹。
