audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "warm, observant, and gently playful", timbre: "clear and inviting", pace: measured, pitch: medium}
    amy:
      display_name: Amy
      tts: {delivery: "proper, dramatic, and confidently young", timbre: "clear and delicate", pace: measured, pitch: high}
    laurie:
      display_name: Laurie
      tts: {delivery: "courteous, sensitive, and boyishly playful", timbre: "clear and youthful", pace: measured, pitch: medium}
    esther:
      display_name: Esther
      tts: {delivery: "affectionate, devout, and gently conspiratorial", timbre: "warm with a light French color", pace: unhurried, pitch: medium}
    polly:
      display_name: Polly
      tts: {delivery: "mischievous, abrupt, and imitative", timbre: "raspy and birdlike", pace: brisk, pitch: high}
  chapters:
    - id: ch01
      title: Life at Aunt March's
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: While trouble filled the March home, Amy was having a hard time at Aunt March's. Being sent away hurt more than she had expected. For the first time, she understood how much love and petting she received at home. Aunt March never petted anyone. She disapproved of it. Still, she meant to be kind. Amy's good behavior pleased her, and though she would never admit it, she had a tender spot for her nephew's children.
        - id: ch01-b02
          speaker: narrator
          text: Aunt March honestly tried to make Amy happy, but she went about it all wrong. Some older people stay young inside. They understand a child's little worries and pleasures, turn lessons into games, and make friendship easy. Aunt March had none of that gift. Her rules, stiff habits, and long lectures wore Amy down. Since Amy seemed more obedient and pleasant than Jo, the old lady decided she must undo the effects of too much freedom and indulgence at home. She taught Amy exactly as she herself had been taught sixty years earlier. Amy felt like a fly caught in the web of one very strict spider.
        - id: ch01-b03
          speaker: narrator
          text: Every morning Amy washed the cups. She polished the old spoons, the round silver teapot, and the glasses until they gleamed. Then came the dusting, and that was a terrible job. Aunt March saw every speck. All the furniture had carved legs and fancy details that Amy could never clean well enough. Polly needed feeding. The lapdog needed combing. Again and again, Amy had to run upstairs or down to fetch something or carry an order because her aunt was very lame and almost never left her large chair.
        - id: ch01-b04
          speaker: narrator
          text: After all that work came lessons, which tested every bit of goodness Amy possessed. At last she was allowed one hour to play or exercise, and how she loved it. Laurie visited each day. He coaxed Aunt March until she let Amy go out with him, and the two of them had splendid walks and rides.
        - id: ch01-b05
          speaker: narrator
          text: After dinner, Amy read aloud. Aunt March usually fell asleep over the first page, but Amy still had to sit quietly for an hour. Then she sewed patchwork or hemmed towels until dusk, looking meek while rebellion boiled inside her. She could amuse herself until tea. Evenings were worst. Aunt March told endless stories about her youth, all so dull that Amy was eager for bed. She planned to cry over her misery, but usually fell asleep after only a tear or two.
        - id: ch01-b06
          speaker: narrator
          text: Without Laurie and Esther, the maid, Amy believed she could never have survived that dreadful visit. Polly alone could drive her wild. He soon realized that she did not admire him, so he took revenge. He pulled her hair whenever she came near. As soon as she cleaned his cage, he spilled his bread and milk. He pecked at Mop until the dog barked while Aunt March slept. He called Amy names in front of visitors and behaved like a thoroughly wicked old bird.
        - id: ch01-b07
          speaker: narrator
          text: Amy could not stand Mop either. He was fat and cross. He growled and yelped while she groomed him. Whenever he wanted food, which happened about twelve times a day, he rolled onto his back with all four legs in the air and a very foolish look on his face. The cook was ill-tempered, the old coachman could not hear, and Esther was the only person in the house who paid real attention to Amy.
    - id: ch02
      title: The Cabinet and the Little Chapel
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Esther was French and had served Aunt March for many years. She called her mistress Madame and sometimes ordered the old lady around, for Madame could not manage without her. Esther's real name was Estelle. Aunt March had commanded her to change it, and Esther agreed only if no one asked her to change her religion.
        - id: ch02-b02
          speaker: narrator
          text: Esther grew fond of Mademoiselle Amy. While she arranged Madame's lace, she entertained the girl with strange stories about her life in France. She also let Amy wander through the great house and explore the beautiful, curious things stored in huge wardrobes and ancient chests. Aunt March collected objects the way a magpie does.
        - id: ch02-b03
          speaker: narrator
          text: Amy loved an Indian cabinet most of all. It was packed with unusual drawers, tiny pigeonholes, and secret compartments. Inside were ornaments of every kind. Some were valuable, some merely odd, and nearly all were old. Amy took great pleasure in examining and arranging them, especially the jewel cases. Their velvet cushions held the finery of a fashionable young woman from forty years before.
        - id: ch02-b04
          speaker: narrator
          text: There were garnets Aunt March had worn when she entered society, and pearls from her father on her wedding day. There were diamonds from her sweetheart, black mourning rings and pins, and peculiar lockets. Some held pictures of dead friends. Others showed weeping willows made from hair. Amy found the baby bracelets worn by Aunt March's only little daughter, and Uncle March's large watch with its red seal, once played with by many small hands. In a box of its own lay Aunt March's wedding ring. It no longer fit her thick finger, but she had saved it more carefully than any other jewel.
        - id: ch02-b05
          speaker: esther
          text: If Mademoiselle could choose anything she wished, which piece would she take?
        - id: ch02-b06
          speaker: narrator
          text: Esther always sat close by to guard the treasures and lock them up again.
        - id: ch02-b07
          speaker: amy
          text: I like the diamonds best, but there isn't a necklace, and necklaces look so lovely on people. If I were allowed, I'd choose this one.
        - id: ch02-b08
          speaker: narrator
          text: Amy gazed at a strand of gold and ebony beads with a heavy matching cross hanging from it.
        - id: ch02-b09
          speaker: esther
          text: I want that one too, but I would never wear it as a necklace. To me, it is a rosary. I would pray with it, as a good Catholic should.
        - id: ch02-b10
          speaker: amy
          text: Was it made to be used like those sweet-smelling wooden beads you keep by your mirror?
        - id: ch02-b11
          speaker: esther
          text: Yes, truly. It is for prayer. The saints would surely be pleased to see such a fine rosary used properly, instead of worn as a showy trinket.
        - id: ch02-b12
          speaker: amy
          text: Your prayers seem to comfort you so much, Esther. You always come downstairs looking peaceful and content. I wish mine made me feel that way.
        - id: ch02-b13
          speaker: esther
          text: If Mademoiselle were Catholic, she would find true comfort. Since that cannot be, you might still go somewhere alone each day to think and pray. A good mistress I once served did that. She had a tiny chapel where she found comfort in many troubles.
        - id: ch02-b14
          speaker: amy
          text: Would it be right if I did that too?
        - id: ch02-b15
          speaker: narrator
          text: Lonely Amy needed some kind of help. Without Beth there to remind her, she often forgot her little book.
        - id: ch02-b16
          speaker: esther
          text: It would be an excellent thing. If you wish, I will gladly prepare the little dressing room for you. Do not mention it to Madame. While she sleeps, you can sit there alone, think good thoughts, and pray that dear God will protect your sister.
        - id: ch02-b17
          speaker: narrator
          text: Esther meant every word. She was sincerely religious, and her loving heart felt deeply for the anxious sisters. Amy liked the plan and gave her permission to arrange the small closet beside her room, hoping it might help.
        - id: ch02-b18
          speaker: amy
          text: I wonder where all these beautiful things will go when Aunt March dies.
        - id: ch02-b19
          speaker: narrator
          text: She slowly put away the shining rosary and closed each jewel case.
        - id: ch02-b20
          speaker: esther
          text: They will go to you and your sisters. I know because Madame trusts me. I witnessed her will, and that is what it says.
        - id: ch02-b21
          speaker: amy
          text: How nice! I only wish she would give them to us now. Waiting until later isn't very agreeable.
        - id: ch02-b22
          speaker: narrator
          text: Amy gave the diamonds one final look.
        - id: ch02-b23
          speaker: esther
          text: The young ladies are not old enough for such jewelry. Madame says the first sister to become engaged will receive the pearls. And I suspect she will give you the little turquoise ring when you leave. She approves of your fine behavior and charming manners.
        - id: ch02-b24
          speaker: amy
          text: Do you really think so? Oh, I'll behave like a lamb if I can have that lovely ring! It's so much prettier than Kitty Bryant's. I believe I like Aunt March after all.
          emotion: happy
        - id: ch02-b25
          speaker: narrator
          text: Amy tried on the blue ring, delighted, and firmly decided to earn it. From that day on, she obeyed beautifully. Aunt March watched with satisfaction and admired the success of her training.
        - id: ch02-b26
          speaker: narrator
          text: Esther prepared the closet with a small table and a footstool. Above them she hung a picture borrowed from one of the closed rooms. She thought it was not worth much and knew Madame would never notice or care. In fact, it was a valuable copy of one of the world's famous paintings. Amy never tired of the Divine Mother's sweet face. As she looked up, loving thoughts of her own mother filled her heart.
        - id: ch02-b27
          speaker: narrator
          text: On the table, Amy placed her little testament and hymnbook. She kept a vase there, always filled with the finest flowers Laurie brought. Every day she came to sit alone, think kindly, and ask dear God to protect Beth. Esther gave her black prayer beads with a silver cross. Amy hung them up but did not use them, because she was uncertain whether they belonged in Protestant prayers.
    - id: ch03
      title: Amy Makes Her Will
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Amy was completely sincere. Away from the safe nest of home, she longed so badly for a kind hand to hold that she turned naturally to the strong and tender Friend whose fatherly love surrounds every little child. She missed her mother's help in understanding and controlling herself. But her mother had shown her where to look, so Amy did her best to find the path and trust it.
        - id: ch03-b02
          speaker: narrator
          text: She was still a young pilgrim, and her burden felt very heavy. She tried to think less about herself, stay cheerful, and be content with doing right when no one noticed or praised her. During this first attempt at being very, very good, she decided to make a will like Aunt March's. Then, if she became ill and died, her belongings would be divided fairly and generously. Just imagining herself giving up those small treasures caused a pang. To Amy, they were as precious as her aunt's jewels.
        - id: ch03-b03
          speaker: narrator
          text: During one play hour, Amy wrote the important paper as well as she could. Esther helped with a few legal words and signed as a witness. Amy felt much easier afterward. She put it aside to show Laurie, who was to be her second witness.
    - id: ch04
      title: A Grand Lady and a Naughty Bird
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One rainy day, Amy went upstairs to play in a large bedroom and took Polly along for company. A wardrobe there was full of old-fashioned costumes, and Esther let her dress in them. Nothing pleased Amy more than putting on faded brocades and parading before the tall mirror. She made noble curtsies and swept her train around just to hear it rustle.
        - id: ch04-b02
          speaker: narrator
          text: That day she was so busy that she never heard Laurie ring the bell. She did not see him peeking in while she marched solemnly back and forth, flicking her fan and tossing her head. A huge pink turban sat above her blue brocade dress and yellow quilted petticoat. High heels forced her to take tiny, careful steps. Laurie later told Jo it was a wonderfully funny sight. Polly strutted just behind Amy, copying her as well as a parrot could. Every so often he stopped to laugh or shout.
        - id: ch04-b03
          speaker: polly
          text: Aren't we fine? Move along, you fright! Be quiet! Kiss me, dear! Ha! Ha!
        - id: ch04-b04
          speaker: narrator
          text: Laurie struggled not to burst out laughing and offend her majesty. At last he knocked, and Amy graciously let him in.
        - id: ch04-b05
          speaker: amy
          text: Sit down and rest while I put everything away. Then I need your advice about something very serious.
        - id: ch04-b06
          speaker: narrator
          text: She displayed all her splendor first, then chased Polly into a corner.
        - id: ch04-b07
          speaker: amy
          text: That bird makes my life miserable. Yesterday Aunt March was asleep, and I was trying to be as quiet as a mouse. Polly started screeching and beating his wings inside the cage. When I went to let him out, I found a huge spider in there. I pushed it onto the floor, and it ran under the bookcase. Polly followed, bent down, and looked underneath with one eye.
        - id: ch04-b08
          speaker: polly
          text: Come out, my dear. Let's take a walk.
        - id: ch04-b09
          speaker: amy
          text: I couldn't help laughing. Then Polly swore, Aunt March woke up, and she scolded both of us.
        - id: ch04-b10
          speaker: laurie
          text: Did the spider take him up on his invitation?
        - id: ch04-b11
          speaker: narrator
          text: Laurie yawned as he asked.
        - id: ch04-b12
          speaker: amy
          text: Yes. The spider came out, and Polly was terrified. He ran away and scrambled onto Aunt March's chair while I chased it.
        - id: ch04-b13
          speaker: polly
          text: Catch her! Catch her! Catch her!
          emotion: fearful
        - id: ch04-b14
          speaker: narrator
          text: Polly pecked at Laurie's toes.
        - id: ch04-b15
          speaker: polly
          text: That's a lie! Oh, Lord!
        - id: ch04-b16
          speaker: laurie
          text: If you belonged to me, you old nuisance, I'd wring your neck.
        - id: ch04-b17
          speaker: narrator
          text: Laurie shook his fist. Polly tipped his head to one side and croaked solemnly.
        - id: ch04-b18
          speaker: polly
          text: Hallelujah! Bless your buttons, dear!
    - id: ch05
      title: The Witness
      blocks:
        - id: ch05-b01
          speaker: amy
          text: Now I'm ready.
        - id: ch05-b02
          speaker: narrator
          text: Amy closed the wardrobe and took a paper from her pocket.
        - id: ch05-b03
          speaker: amy
          text: Please read this and tell me whether it's legal and proper. I thought I ought to do it because life is uncertain, and I don't want people quarreling over my grave.
        - id: ch05-b04
          speaker: narrator
          text: Laurie bit his lips. He turned slightly away from her solemn face and read with admirable seriousness, even with all the misspelled words. Amy had titled it, My Last Will and Testament. She declared that she was in her sane mind and was giving away all her earthly property.
        - id: ch05-b05
          speaker: laurie
          text: To Father, I leave my best pictures, sketches, maps, and works of art, with their frames. I also leave him my hundred dollars to use however he likes.
        - id: ch05-b06
          speaker: laurie
          text: To Mother, I leave all my clothes except the blue apron with pockets. She may also have my portrait and my medal, with much love.
        - id: ch05-b07
          speaker: laurie
          text: To my dear sister Margaret, I leave my turquoise ring, if I receive it. She is also to have my green box with the doves, my piece of real lace to wear at her neck, and my drawing of her to remember her little girl by.
        - id: ch05-b08
          speaker: laurie
          text: To Jo, I leave the brooch repaired with sealing wax, my bronze inkstand whose cover she lost, and my most precious plaster rabbit. I give her the rabbit because I am sorry I burned her story.
        - id: ch05-b09
          speaker: laurie
          text: To Beth, if she lives longer than I do, I leave my dolls and their little bureau, my fan, my linen collars, and my new slippers, if her feet are thin enough when she recovers. I also leave her my regret for ever making fun of old Joanna.
        - id: ch05-b10
          speaker: laurie
          text: To my friend and neighbor Theodore Laurence, I leave my papier-mâché portfolio and my clay horse, although he said it had no neck. In return for his great kindness during our time of trouble, he may choose any one of my works of art. Notre Dame is the best.
        - id: ch05-b11
          speaker: laurie
          text: To our honored benefactor, Mr. Laurence, I leave my purple box with a mirror in the lid. It will hold his pens and remind him of the departed girl who thanks him for being good to her family, especially Beth.
        - id: ch05-b12
          speaker: laurie
          text: I want my favorite playmate, Kitty Bryant, to have my blue silk apron, my gold-bead ring, and a kiss.
        - id: ch05-b13
          speaker: laurie
          text: To Hannah, I leave the bandbox she wanted and all my patchwork. I hope she will remember me whenever she sees it.
        - id: ch05-b14
          speaker: laurie
          text: Now that I have given away my most valuable possessions, I hope everyone will be satisfied and will not blame the dead. I forgive everyone, and I trust we will all meet when the trumpet sounds. Amen.
        - id: ch05-b15
          speaker: laurie
          text: I sign and seal this will on November twentieth, in the year of our Lord eighteen sixty-one. Amy Curtis March. Witnessed by Estelle Valnor and Theodore Laurence.
        - id: ch05-b16
          speaker: narrator
          text: Laurie's name was still in pencil. Amy explained that he must write it again in ink, then seal the document properly.
        - id: ch05-b17
          speaker: laurie
          text: What made you think of this? Did someone tell you that Beth has been giving her things away?
        - id: ch05-b18
          speaker: narrator
          text: His tone turned serious. Amy had set red tape, sealing wax, a candle, and an inkstand in front of him. She explained why she had written the will, then looked at him anxiously.
        - id: ch05-b19
          speaker: amy
          text: What do you mean about Beth?
          emotion: fearful
        - id: ch05-b20
          speaker: laurie
          text: I'm sorry I mentioned it, but now I should tell you. One day Beth felt so sick that she told Jo to give her piano to Meg, her cats to you, and poor old Joanna to Jo, who would love the doll for Beth's sake. Beth wished she had more to give. She left locks of her hair for the rest of us and sent her very best love to Grandpa. She never thought of making a will.
          emotion: sad
        - id: ch05-b21
          speaker: narrator
          text: Laurie signed and sealed the paper as he spoke. He did not look up until a large tear splashed onto it. Amy's face was troubled, but she said only one thing.
        - id: ch05-b22
          speaker: amy
          text: People sometimes add something at the end of a will, don't they?
        - id: ch05-b23
          speaker: laurie
          text: Yes. It's called a codicil.
        - id: ch05-b24
          speaker: amy
          text: Then add one to mine. Say that I want all my curls cut off and shared among my friends. I forgot about them before. I still want it done, even though it will ruin my looks.
        - id: ch05-b25
          speaker: narrator
          text: Laurie added the codicil, smiling at Amy's final and greatest sacrifice. Then he entertained her for an hour and listened with real interest to all her troubles. When he was about to leave, Amy held him back. Her lips trembled as she whispered.
        - id: ch05-b26
          speaker: amy
          text: Is Beth truly in danger?
          emotion: fearful
        - id: ch05-b27
          speaker: laurie
          text: I'm afraid she is. But we have to hope for the best, so please don't cry, dear.
          emotion: calm
        - id: ch05-b28
          speaker: narrator
          text: Laurie put an arm around her like a brother, and the gesture comforted her greatly.
        - id: ch05-b29
          speaker: narrator
          text: After he left, Amy went to her little chapel. She sat in the twilight and prayed for Beth, her tears streaming and her heart aching. A million turquoise rings could not have comforted her if she lost her gentle little sister.
