  chapters:
    - id: ch01
      title: ON THE SHELF
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            In France, young women were expected to lead dull lives until they married. Then their motto became, “Long live freedom!” In America, girls declared their independence early and enjoyed it eagerly. But once they married and had a first child, they often gave up that freedom and disappeared into a life almost as secluded as a French convent, though certainly not as quiet. Wedding excitement ended, and a young wife was set on the shelf whether she liked it or not. Many might have said exactly what one very pretty woman said one day.
        - id: ch01-b02
          speaker: married_woman
          text: >-
            I’m just as pretty as I ever was, but now that I’m married, nobody notices me.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Meg was neither a famous beauty nor a fashionable lady, so she did not feel this trouble until her babies were a year old. In her small circle, people still followed simpler ways, and she found herself more loved and admired than ever.

            She was naturally motherly, and she gave herself completely to the children. She watched over them day and night with endless love and worry. John was left to the care of their hired help, an Irish woman named Kitty who now ruled the kitchen.

            John loved home and missed all the little attentions Meg used to give him. Still, he adored the babies, so he cheerfully gave up his comforts for a while. In his innocent way, he supposed the household would soon settle down. Three months passed, and it never did. Meg looked tired and anxious. The babies took every minute she had, the house was neglected, and easygoing Kitty kept John on very short rations.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Each morning, John left the house confused by a long list of little errands for the mother who could not get out. Each evening, he came home eager to greet his family, only to be stopped at once.
        - id: ch01-b05
          speaker: meg
          text: >-
            Hush! They’ve fussed all day, and I finally got them to sleep.
        - id: ch01-b06
          speaker: narrator
          text: >-
            If he suggested some fun at home, Meg said it would wake the babies. If he mentioned a lecture or concert, one hurt look came over her face.
        - id: ch01-b07
          speaker: meg
          text: >-
            Leave my children just to go have fun? I never could.
        - id: ch01-b08
          speaker: narrator
          text: >-
            At night, crying babies broke his sleep, while a shadowy figure paced silently back and forth. At meals, the woman serving him would suddenly rush away before his plate was filled because a tiny sound had come from upstairs. In the evening, he tried to read his newspaper, but Demi’s stomachache mixed itself into the shipping news, and Daisy’s tumble changed the price of stocks. Mrs. Brooke cared only for news from the nursery.

            Poor John was miserable. The children seemed to have taken his wife away. His home had become one great nursery, and all the constant hushing made him feel like a rough intruder whenever he entered Babyland. He endured it patiently for six months. When nothing improved, he did what other banished fathers have done and looked elsewhere for a little comfort.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Scott had married and set up housekeeping nearby. John began dropping in for an hour or two at night, when his own parlor was empty and Meg’s lullabies seemed likely to go on forever. Mrs. Scott was pretty and lively, with nothing to do but make company pleasant, and she did that very well. Her parlor was always bright. The chessboard stood ready, the piano was in tune, the gossip was cheerful, and a tempting little supper appeared at just the right time.

            John would rather have sat beside his own fire if it had not felt so lonely. Since it did, he gratefully accepted the next best place and enjoyed visiting his neighbors.
        - id: ch01-b10
          speaker: narrator
          text: >-
            At first, Meg rather liked the arrangement. John was enjoying himself instead of falling asleep in the parlor or walking around and waking the children. Then the babies finished teething and began sleeping at regular hours. Meg had time to rest, but now she missed John. Her sewing basket was poor company without him across the fire in his old dressing gown, comfortably scorching his slippers.

            She would not ask him to stay. She felt hurt that he did not somehow know she wanted him, and she forgot all the evenings he had waited for her. Months of watching and worrying had worn down her nerves. She had hardly any exercise and far too much tea, until she felt like nothing but nerves, without a bit of strength left.
        - id: ch01-b11
          speaker: meg
          emotion: sad
          text: >-
            Yes, I’m growing old and ugly. John doesn’t think I’m interesting anymore. He leaves his faded wife to visit his pretty neighbor, who doesn’t have two babies to weigh her down. Well, you love me, don’t you, my darlings? You don’t care that I’m thin and pale, or that I can’t even curl my hair. You’re my comfort. Someday John will understand everything I’ve gladly given up for you.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Daisy answered with a soft coo, or Demi gave a happy crow. Meg would forget her complaints and delight in the babies, and for a little while she did not feel lonely.

            But the hurt kept growing. Politics began taking more of John’s attention, and he often went to discuss some interesting point with Scott, never guessing that Meg wanted him at home. She said nothing until Mrs. March found her crying one day and demanded to know why. Meg’s low spirits had not escaped her mother.
        - id: ch01-b13
          speaker: meg
          emotion: sad
          text: >-
            I wouldn’t tell anyone but you, Mother. I truly need advice. If John keeps this up, I may as well be a widow.
        - id: ch01-b14
          speaker: mrs_march
          text: >-
            What exactly is he doing, dear?
        - id: ch01-b15
          speaker: meg
          text: >-
            He’s gone all day, and then, just when I want him at night, he’s always off to the Scotts’. It isn’t fair. I do all the hardest work and never get any pleasure. Men are selfish, even the good ones.
        - id: ch01-b16
          speaker: mrs_march
          text: >-
            Women can be selfish too. Before you blame John, look honestly at what you may be doing wrong.
        - id: ch01-b17
          speaker: meg
          text: >-
            But surely he shouldn’t neglect me.
        - id: ch01-b18
          speaker: mrs_march
          text: >-
            Are you neglecting him?
        - id: ch01-b19
          speaker: meg
          emotion: surprised
          text: >-
            Mother! I thought you would take my side.
        - id: ch01-b20
          speaker: mrs_march
          text: >-
            I do sympathize with you. But Meg, I believe this trouble began with you.
        - id: ch01-b21
          speaker: meg
          text: >-
            I don’t understand how.
        - id: ch01-b22
          speaker: mrs_march
          text: >-
            Then let me explain. When you made sure to spend the evening with John, the only free time he had, did he ever neglect you like this?
        - id: ch01-b23
          speaker: meg
          text: >-
            No, but I can’t do that now. I have two babies to care for.
        - id: ch01-b24
          speaker: mrs_march
          text: >-
            I believe you can, dear, and that you should. May I speak plainly? Will you remember that the mother correcting you is also the mother who understands how you feel?
        - id: ch01-b25
          speaker: meg
          text: >-
            Yes, please. Talk to me as if I were little Meg again. Since the babies began depending on me for everything, I often feel that I need teaching more than ever.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Meg pulled her low chair close to her mother’s. Each woman had a baby in her lap. They rocked and talked together with love, feeling that motherhood had drawn them closer than ever.
        - id: ch01-b27
          speaker: mrs_march
          text: >-
            You’ve made a mistake that many young wives make. You loved your children so much that you forgot what you owe your husband. It’s natural, and it can be forgiven, but you should mend it before you and John begin living separate lives. The children ought to bring you closer. They shouldn’t divide you, as though they belonged only to you and John’s only duty was earning money for them. I’ve noticed this for weeks, but I waited because I hoped it would right itself.
        - id: ch01-b28
          speaker: meg
          text: >-
            I’m afraid it won’t. If I ask him to stay, he’ll think I’m jealous, and I would never insult him that way. He can’t see that I need him, and I don’t know how to tell him without saying it.
        - id: ch01-b29
          speaker: mrs_march
          text: >-
            Make home so pleasant that he won’t wish to leave. He misses his little home, Meg. But without you, it doesn’t feel like home, and you’re always upstairs in the nursery.
        - id: ch01-b30
          speaker: meg
          text: >-
            Shouldn’t I be there?
        - id: ch01-b31
          speaker: mrs_march
          text: >-
            Not every moment. Staying shut in makes you nervous, and then you can’t do anything well. You owe something to John as well as the babies. Don’t ignore your husband for your children, and don’t lock him out of the nursery. Show him how to help there. He belongs with them just as much as you do, and they need their father. Give him a real share of the work. He’ll do it gladly and faithfully, and all of you will be better for it.
        - id: ch01-b32
          speaker: meg
          text: >-
            Do you truly think he will?
        - id: ch01-b33
          speaker: mrs_march
          text: >-
            I know he will, because I tried it myself. I rarely give advice unless I’ve tested it. When you and Jo were small, I behaved just as you do now. I thought I wasn’t doing my duty unless I gave you every part of myself. Your poor father turned to his books after I refused every offer of help, and he let me try my experiment alone.

            I managed as well as I could, but Jo was more than I could handle, and I nearly spoiled her by giving in. You were often ill, and I worried until I became sick too. Then Father stepped in. Quietly, he took charge of everything and made himself so useful that I finally saw my mistake. Since then, I’ve never wanted to manage without him.

            That is the secret of our happy home. He never lets work pull him away from the small cares and duties that touch us all. I try not to let household worries destroy my interest in his work. We each handle many things alone, but here at home, we always work together.
        - id: ch01-b34
          speaker: meg
          text: >-
            That’s true, Mother. More than anything, I want to be for John and the children what you’ve been for your family. Tell me how. I’ll do whatever you say.
        - id: ch01-b35
          speaker: mrs_march
          text: >-
            You always were willing to learn. First, let John take a larger part in managing Demi. That little boy needs guidance, and it is not too early to begin. Then accept the help I keep offering. Let Hannah come care for the babies while you spend more time on the house. She is an excellent nurse, and you can trust your precious babies completely to her. Hannah will enjoy the change, the work will give you exercise, and John will find his wife again.

            Go out more. Keep your spirits up while you keep busy. You make the family’s sunshine, and when you grow gloomy, the whole house loses its good weather. Try to care about the things John cares about. Talk with him, let him read to you, share your thoughts, and help each other grow. Being a woman doesn’t mean you should shut yourself inside a tiny box. Learn what is happening in the world and prepare yourself to take part in its work, because all of it touches you and the people you love.
        - id: ch01-b36
          speaker: meg
          text: >-
            John is so sensible. What if he thinks I’m foolish when I ask about politics and things like that?
        - id: ch01-b37
          speaker: mrs_march
          text: >-
            I don’t believe he will. Love forgives a great many faults, and who could you question more freely than your own husband? Try it. I think he’ll enjoy your company much more than Mrs. Scott’s suppers.
        - id: ch01-b38
          speaker: meg
          emotion: sad
          text: >-
            I will. Poor John. I’m afraid I’ve treated him badly. I honestly thought I was doing right, and he never complained.
        - id: ch01-b39
          speaker: mrs_march
          text: >-
            He was trying not to be selfish, but I imagine he has felt lonely. Young married people often begin growing apart at exactly this time, when they most need to stay close. The first tender feelings can fade unless you protect them. And for parents, no years are more precious than the first years of the little lives they’ve been given to guide.

            Don’t let John become a stranger to his children. They will do more than anything else to keep him safe and happy through this difficult world. Through them, you and John will learn to know and love each other as you should. Now goodbye, dear. Think over your mother’s sermon. Follow it if it seems right, and may God bless you all.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Meg did think about it. She decided the advice was good and began to follow it, though her first attempt did not go quite as planned.

            Naturally, the babies had become little rulers. They soon learned that kicking and screaming could bring them whatever they wanted. Meg was the humble servant of every whim, but John was harder to conquer. Now and then, he upset his tender wife by trying some fatherly discipline on their noisy son.

            Demi had inherited a little of his father’s firmness. We need not call it stubbornness. Once the boy decided to have or do something, all the king’s horses and all the king’s men could not change his small, determined mind. Meg thought he was too young to master his dislikes. John believed it was never too early to learn obedience. So Demi soon discovered that when he wrestled with Papa, Papa always won. Still, like an Englishman who respects the man who beats him fairly, the baby respected his conqueror. He loved the father whose serious “No, no” meant more than all of Mamma’s gentle pats.
        - id: ch01-b41
          speaker: narrator
          text: >-
            A few days after talking with her mother, Meg decided to give John a pleasant evening at home. She ordered a special supper, made the parlor neat, dressed herself nicely, and put the children to bed early so nothing could spoil her plan.

            Unfortunately, nothing offended Demi more than bedtime, and that night he chose to rebel. Meg rocked him, sang to him, told him stories, and tried every trick she knew. Nothing worked. Daisy, the round little bundle of good nature, had already drifted off. Demi lay staring at the light with his big eyes discouragingly wide open.

            Then the front door closed softly. John’s familiar step moved on tiptoe into the dining room.
        - id: ch01-b42
          speaker: meg
          text: >-
            Will Demi lie still and be good while Mamma runs down to give poor Papa his tea?
        - id: ch01-b43
          speaker: demi
          text: >-
            Me have tea!
        - id: ch01-b44
          speaker: meg
          text: >-
            No, sweetheart. But if you go to sleep like Daisy, I’ll save you a little cake for breakfast. Will you do that?
        - id: ch01-b45
          speaker: demi
          text: >-
            Yes!
        - id: ch01-b46
          speaker: narrator
          text: >-
            Demi squeezed his eyes shut, as if he could catch sleep quickly and hurry breakfast along. Meg took her chance and slipped away.

            She ran downstairs to meet John with a smile. In her hair was the little blue bow he especially loved. He noticed it at once.
        - id: ch01-b47
          speaker: john
          emotion: surprised
          text: >-
            Why, little mother, look at you tonight! Are we expecting company?
        - id: ch01-b48
          speaker: meg
          text: >-
            Only you, dear.
        - id: ch01-b49
          speaker: john
          text: >-
            Is it a birthday or an anniversary? Have I forgotten something?
        - id: ch01-b50
          speaker: meg
          text: >-
            Nothing like that. I got tired of looking untidy, so I dressed up for a change. You always look nice at the table, even when you’re tired. Why shouldn’t I do the same when I have time?
        - id: ch01-b51
          speaker: john
          text: >-
            I do it to show my respect for you, my dear.
        - id: ch01-b52
          speaker: meg
          emotion: happy
          text: >-
            Then we agree, Mr. Brooke.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Meg laughed and nodded at him over the teapot, looking young and pretty again.
        - id: ch01-b54
          speaker: john
          emotion: happy
          text: >-
            This is wonderful. It feels just like old times, and the tea tastes right again. Here’s to your health, dear.
        - id: ch01-b55
          speaker: narrator
          text: >-
            John drank his tea in peaceful delight, but the peace did not last. As he set down his cup, the door handle rattled in a mysterious way. A small, impatient voice came through the door.
        - id: ch01-b56
          speaker: demi
          text: >-
            Open door! Me coming!
        - id: ch01-b57
          speaker: meg
          text: >-
            That naughty boy! I told him to fall asleep by himself, and now he’s downstairs with bare feet on that cold floor.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Meg opened the door. Demi marched in joyfully, holding up his long nightgown with one arm. His curls bounced as he danced around the table and gazed lovingly at the little cakes.
        - id: ch01-b59
          speaker: demi
          emotion: happy
          text: >-
            Morning now!
        - id: ch01-b60
          speaker: meg
          text: >-
            No, it isn’t morning. You must go back to bed and let poor Mamma rest. Then you may have the little cake with sugar on top.
        - id: ch01-b61
          speaker: demi
          text: >-
            Me love Papa.
        - id: ch01-b62
          speaker: narrator
          text: >-
            The clever little fellow prepared to climb onto John’s knee and enjoy the forbidden treats. John shook his head.
        - id: ch01-b63
          speaker: john
          text: >-
            If you told him to stay upstairs and sleep alone, you must make him do it. Otherwise, he’ll never learn to obey you.
        - id: ch01-b64
          speaker: meg
          text: >-
            Yes, of course. Come along, Demi.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Meg led her son away. She felt a strong urge to spank the little troublemaker, but he hopped beside her, happily believing he would get the promised treat as soon as they reached the nursery.

            He was not disappointed. His shortsighted mother gave him a lump of sugar, tucked him into bed, and ordered him not to take another walk before morning.
        - id: ch01-b66
          speaker: demi
          text: >-
            Yes!
        - id: ch01-b67
          speaker: narrator
          text: >-
            Demi sucked his sugar contentedly and considered his first escape a complete success.

            Meg went back downstairs, and supper moved along pleasantly. Then the little ghost appeared again and boldly revealed what his mother had done.
        - id: ch01-b68
          speaker: demi
          text: >-
            More sugar, Mamma.
        - id: ch01-b69
          speaker: john
          text: >-
            No, this has to stop. We’ll never have any peace until he learns to go to bed properly. You’ve been his servant long enough. Give him one firm lesson, and it will be finished. Put him in bed and leave him there, Meg.
        - id: ch01-b70
          speaker: meg
          text: >-
            He won’t stay. He never does unless I sit beside him.
        - id: ch01-b71
          speaker: john
          text: >-
            I’ll take care of it. Demi, go upstairs and get into bed, just as Mamma told you.
        - id: ch01-b72
          speaker: demi
          text: >-
            Shan’t!
        - id: ch01-b73
          speaker: narrator
          text: >-
            The young rebel calmly helped himself to the cake he wanted and began to eat it.
        - id: ch01-b74
          speaker: john
          text: >-
            You must never speak to Papa that way. Go by yourself, or I will carry you.
        - id: ch01-b75
          speaker: demi
          emotion: angry
          text: >-
            Go away! Me don’t love Papa!
        - id: ch01-b76
          speaker: narrator
          text: >-
            Demi hid in Meg’s skirts for safety, but even that shelter failed him.
        - id: ch01-b77
          speaker: meg
          text: >-
            Be gentle with him, John.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Meg handed him over, and at once Demi knew disaster had come. If Mamma herself gave him up, judgment was near. His cake was taken away, his fun was over, and a strong hand carried him toward that hateful bed. He kicked, screamed, and defied Papa all the way upstairs.

            John put him into bed on one side. Demi rolled out on the other and ran for the door. John caught him by the tail of his little nightgown and put him back. They repeated this lively performance until Demi had no strength left. Then he lay there roaring as loudly as he could.

            That sound usually defeated Meg. John sat as still as a deaf post. There was no coaxing, sugar, lullaby, or story. He even put out the light. Only the red fire lit the great darkness, which interested Demi more than it frightened him. The boy hated this new order. As his anger faded, he remembered his loving servant and began to cry sadly for Mamma.
        - id: ch01-b79
          speaker: narrator
          text: >-
            The angry screams had become pitiful sobs, and Meg could bear no more. She hurried upstairs.
        - id: ch01-b80
          speaker: meg
          emotion: sad
          text: >-
            Please let me stay with him. He’ll be good now, John.
        - id: ch01-b81
          speaker: john
          text: >-
            No, dear. I told him he must do what you said and go to sleep. He must obey, even if I have to sit here all night.
        - id: ch01-b82
          speaker: meg
          emotion: fearful
          text: >-
            But he’ll make himself sick from crying.
        - id: ch01-b83
          speaker: john
          text: >-
            He won’t. He’s exhausted, and he’ll soon fall asleep. Then he’ll understand that he has to mind us. Don’t step in now. Let me handle him.
        - id: ch01-b84
          speaker: meg
          text: >-
            He’s my child. I can’t let you crush his spirit by being too strict.
        - id: ch01-b85
          speaker: john
          text: >-
            He’s my child too, and I won’t let too much indulgence spoil his temper. Go downstairs, dear, and leave him with me.
        - id: ch01-b86
          speaker: narrator
          text: >-
            Whenever John used that firm tone, Meg obeyed him, and she never regretted it.
        - id: ch01-b87
          speaker: meg
          text: >-
            May I kiss him once before I go?
        - id: ch01-b88
          speaker: john
          text: >-
            Of course. Demi, tell Mamma good night and let her go rest. She’s very tired after caring for you all day.
        - id: ch01-b89
          speaker: narrator
          text: >-
            Meg always said afterward that her kiss won the battle. Once she kissed him, Demi sobbed more softly and lay still at the foot of the bed, where he had wriggled during his misery.

            John thought the poor little fellow was worn out from crying and ready for sleep. He crept toward the bed, planning to cover Demi and go reassure Meg.

            But Demi was awake. As soon as his father leaned over him, the boy opened his eyes. His little chin trembled. He lifted both arms and spoke through a sorry hiccup.
        - id: ch01-b90
          speaker: demi
          emotion: sad
          text: >-
            Me good now.
        - id: ch01-b91
          speaker: narrator
          text: >-
            Meg sat outside on the stairs, wondering why the uproar had turned into such a long silence. After imagining every impossible accident, she slipped into the room to make sure all was well.

            Demi was fast asleep. Instead of lying spread out in his usual way, he was curled into a small, humbled bundle inside his father’s arm. One hand held John’s finger, as though the child had learned that justice could be kind and had fallen asleep a sadder, wiser baby. John had waited patiently for the little hand to let go. While he waited, he too fell asleep, more worn out by the struggle with Demi than by his whole day’s work.
        - id: ch01-b92
          speaker: narrator
          text: >-
            Meg stood looking at the two faces on the pillow. She smiled, then quietly slipped away.
        - id: ch01-b93
          speaker: meg
          text: >-
            I never have to worry that John will be too hard on my babies. He does know how to manage them, and he’ll be a great help. Demi is becoming too much for me alone.
        - id: ch01-b94
          speaker: narrator
          text: >-
            When John finally came downstairs, he expected to find a sad or offended wife. Instead, Meg was peacefully trimming a bonnet. She asked him to read something about the election if he was not too tired.

            John saw at once that some kind of revolution was taking place, but he wisely asked no questions. Meg could never hide anything for long, so he knew the answer would soon appear. With great good nature, he read her a long political debate and then explained it as clearly as he could.

            Meg worked hard to seem deeply interested. She asked sensible questions and tried to keep her mind on the condition of the nation instead of the condition of her bonnet. Secretly, she decided politics were as bad as mathematics, and that politicians spent most of their time calling one another names. She kept those opinions to herself. When John paused, she shook her head and offered what she hoped was a wisely mysterious remark.
        - id: ch01-b95
          speaker: meg
          text: >-
            Well, I truly don’t know where all this is leading us.
        - id: ch01-b96
          speaker: narrator
          text: >-
            John laughed and watched her for a moment. Meg held up a pretty little creation of lace and flowers and studied it with more real interest than she had shown in his whole political speech. John understood that she was trying to like politics for his sake. He decided it was only fair to try liking hats for hers.
        - id: ch01-b97
          speaker: john
          text: >-
            That’s very pretty. Is it one of those little breakfast caps?
        - id: ch01-b98
          speaker: meg
          emotion: surprised
          text: >-
            My dear man, it’s a bonnet! My very best bonnet for concerts and the theater.
        - id: ch01-b99
          speaker: john
          text: >-
            Forgive me. It looked so small that I took it for one of those airy little things you sometimes wear. How does it stay on?
        - id: ch01-b100
          speaker: meg
          text: >-
            These lace ends fasten under my chin with a rosebud. Like this.
        - id: ch01-b101
          speaker: narrator
          text: >-
            Meg put on the bonnet and looked at him with such calm satisfaction that John could not resist her.
        - id: ch01-b102
          speaker: john
          emotion: happy
          text: >-
            The bonnet is lovely, but I like the face inside it better. It looks young and happy again.
        - id: ch01-b103
          speaker: narrator
          text: >-
            John kissed the smiling face and nearly ruined the rosebud under her chin.
        - id: ch01-b104
          speaker: meg
          text: >-
            I’m glad you like it, because I want you to take me to one of the new concerts some evening. I need a little music to put me back in tune. Will you take me?
        - id: ch01-b105
          speaker: john
          emotion: happy
          text: >-
            Gladly! I’ll take you there or anywhere else you wish. You’ve been shut indoors much too long. Going out will do you a world of good, and I’ll enjoy it more than anything. What gave you the idea, little mother?
        - id: ch01-b106
          speaker: meg
          text: >-
            I talked with Marmee the other day. I told her how nervous, cross, and miserable I’ve been. She said I needed a change and fewer worries. Hannah is going to help with the children, and I’ll spend more time caring for the house. Once in a while, I’ll have some fun so I don’t turn into a fussy, worn-out old woman before my time.

            It’s only an experiment, John. I want to try it for your sake as much as mine. I’ve neglected you terribly, and I’m going to make our home feel the way it used to, if I can. You don’t mind, do you?
        - id: ch01-b107
          speaker: narrator
          text: >-
            We need not repeat John’s answer or describe how narrowly the little bonnet escaped complete destruction. It is enough to say that he did not seem to mind.

            Slowly, the people and the house began to change. Life was not perfect, but everyone benefited when they shared the work. Under their father’s steady rule, the children grew well and learned order and obedience. With healthy activity, a little pleasure, and many honest talks with her sensible husband, Meg regained her good spirits and calmed her nerves.

            Home felt like home again. John no longer wanted to go out unless Meg went with him. Now the Scotts came to visit the Brookes, and everyone found the small house cheerful, contented, and full of family love.
        - id: ch01-b108
          speaker: narrator
          text: >-
            Even Sallie Moffatt liked spending time there. She would look around with longing, as if she hoped to discover the secret and carry it back to her grand house. That house was full of splendid loneliness. There were no noisy babies with sunny faces, and Ned lived in a world of his own where Sallie had no place.
        - id: ch01-b109
          speaker: sallie
          text: >-
            It’s always so peaceful and pleasant here, Meg. Visiting you does me good.
        - id: ch01-b110
          speaker: narrator
          text: >-
            This happiness did not arrive all at once. But Meg and John had found its key, and every year of married life taught them to use it better. It opened the treasures of true love at home and the habit of helping one another. The poorest family may own those treasures, and the richest person cannot buy them.

            This is a shelf where young wives and mothers may be content to rest. Here they are safe from the restless troubles of the outside world. Their little sons and daughters hold tight to them with loyal love that does not fear sorrow, poverty, or age. Beside them walks a faithful companion through calm days and stormy ones, a true “house-band” in the old meaning of the word.

            And here Meg learned that a woman’s happiest kingdom is her home. Her highest honor is learning to guide it, not as a queen, but as a wise wife and mother.
