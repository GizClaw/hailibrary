audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，带着克制的幽默, timbre: 清澈柔和, pace: 从容舒展, pitch: 中音}
    meg:
      display_name: 梅格
      tts: {delivery: 端庄温和，疲惫时敏感，快活时明朗, timbre: 柔润, pace: 适中, pitch: 中音}
    john:
      display_name: 约翰
      tts: {delivery: 正直稳重，温和中自有坚定, timbre: 温厚清朗, pace: 从容, pitch: 中低音}
    mrs_march:
      display_name: 马奇太太
      tts: {delivery: 慈爱爽朗，沉稳中带着鼓励, timbre: 饱满温暖, pace: 从容, pitch: 中低音}
    demi:
      display_name: 德米
      tts: {delivery: 幼小活泼，任性又天真，吐字带稚气, timbre: 清亮稚嫩, pace: 稍快, pitch: 高音}
    sallie:
      display_name: 萨莉
      tts: {delivery: 亲切温柔，快活背后藏着淡淡寂寞, timbre: 明亮柔和, pace: 适中, pitch: 中高音}
  chapters:
    - id: ch01
      title: 第三十八章 束之高阁
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 法国姑娘婚前的日子很乏味，一结婚，便高喊“自由万岁”。美国姑娘恰好相反。人人都知道，她们早早签下自己的《独立宣言》，带着共和式的热情，痛痛快快享受自由。可一生下第一个王位继承人，年轻太太们往往就自行退了位，过起近似法国修道院的隐居生活。只不过，家里可一点也不清静。不论她们愿不愿意，婚礼的热闹刚散，就被束之高阁。难怪前些天有位十分漂亮的太太抱怨，自己的模样一点没变，却因为结了婚，再没有人留意她。
        - id: ch01-b02
          speaker: narrator
          text: 梅格不是什么社交场上人人追捧的美人，也算不上时髦女士。直到双胞胎满一岁，她才尝到这种苦恼。在她那小小的天地里，人们还保留着古朴的风气。因此做了母亲以后，她并没有立刻受到冷落，反而比从前更受人欣赏，也更惹人疼爱。
        - id: ch01-b03
          speaker: narrator
          text: 梅格原本就是个女人味十足的小女人，做了母亲以后，天性里的母爱更是强烈，整颗心都给了孩子。她日夜守着他们，不知疲倦地疼爱，也一刻不停地操心，别人和别的事全顾不上。约翰则交给女佣照料，厨房如今归一个爱尔兰妇人掌管。约翰是个恋家的男人，很怀念妻子从前给他的种种体贴。不过他也爱极了孩子，便心甘情愿地暂时牺牲自己的舒适。他还凭着男人在这种事上的无知，以为家里很快就会恢复安静。
        - id: ch01-b04
          speaker: narrator
          text: 三个月过去，安宁一点没回来。梅格憔悴又紧张，孩子占去她每一分钟，家务也荒废了。厨娘基蒂什么都不着急，约翰连饭都常吃不饱。早晨出门，他要替困在家里的妈妈办一堆零碎小事，听得晕头转向。晚上兴冲冲回来，满心想抱抱一家人，还没张开手，就先听见一声“嘘”。他若提议在家玩点什么，梅格就说会吵醒孩子。若想去听讲座或音乐会，她又会用责备的眼神看他。
        - id: ch01-b05
          speaker: meg
          text: 小声点！他们闹了一整天，刚刚才睡着。
        - id: ch01-b06
          speaker: narrator
          text: 约翰想在家找点消遣，梅格怕吵着孩子。他提到讲座或音乐会，她便觉得，为了玩乐丢下孩子，绝对不行。婴儿的哭声夜夜惊醒他。深更半夜，眼前还有梅格那道幽灵似的身影，无声地来回走。吃饭也不得安稳。楼上小窝只要传来一声闷闷的啼叫，主持饭桌的女神就会立刻飞走，把只盛了一半的盘子和丈夫一起撇下。约翰晚上看报，德米肚子疼会闯进船运消息，黛西摔一跤也会影响股票行情。布鲁克太太只关心家里的新闻。
        - id: ch01-b07
          speaker: narrator
          text: 可怜的约翰过得很不舒服。孩子像是夺走了他的妻子，家也变成一间育婴室。永不停歇的“嘘”声，让他觉得自己每次走进婴儿国的神圣领地，都像一个粗鲁的闯入者。他耐心忍了整整六个月，情形仍没有好转，只好像别的父亲一样，到别处寻找一点安慰。斯科特刚结婚，在不远的地方安了家。自家客厅空荡荡，妻子又在楼上唱没完没了的摇篮曲时，约翰便去那里坐上一两个钟头。
        - id: ch01-b08
          speaker: narrator
          text: 斯科特太太年轻漂亮，性情活泼，眼下唯一的事情就是讨人喜欢，而她做得非常成功。她家的客厅总是明亮舒适，棋盘随时可以开局，钢琴音色正好。有说不完的有趣闲话，也有一顿摆得很漂亮的夜宵，光看就叫人嘴馋。约翰真正想坐的还是自家的炉边，只要那里不那么孤单。可眼下既然回去也只有自己，他只好感激地接受这个次一等的选择，享受邻居的陪伴。
        - id: ch01-b09
          speaker: narrator
          text: 起初，梅格还颇为赞成这个安排。知道约翰出去过得高兴，总好过他在客厅打瞌睡，或在屋里重重地走来走去，弄醒好不容易睡着的孩子。后来孩子出牙的麻烦过去了，两尊小偶像也能按时入睡，梅格有了休息的工夫，便开始想念约翰。若是对面没有他穿着旧睡袍坐在炉边，舒舒服服地烘着拖鞋，针线篮实在算不上一个有趣的伴侣。
        - id: ch01-b10
          speaker: narrator
          text: 她不肯开口请约翰留下，却觉得受了委屈，怪他不能自己看出她的心思，完全忘了从前有多少个晚上，他也一直等不到她。长期守着孩子，操心过度，她已经疲惫又紧张，正陷在最好的母亲偶尔也会有的糊涂情绪里。她很少活动，快活劲儿也跟着消失了。再加上对茶壶这尊美国女人的偶像太虔诚，她只觉得自己浑身都是神经，一点力气也没有。
        - id: ch01-b11
          speaker: meg
          text: 我越来越老，也越来越难看了。约翰不再觉得我有意思，便丢下憔悴的妻子，去看漂亮又没有牵挂的邻居。好在孩子爱我。他们不在乎我又瘦又白，也不在乎我没工夫烫头发。总有一天，约翰会知道，我心甘情愿为他们牺牲了多少。是不是呀，我的宝贝？
          emotion: sad
        - id: ch01-b12
          speaker: narrator
          text: 听了妈妈这番可怜的诉说，黛西会咿咿呀呀地回应，德米会快活地叫上一声。梅格立刻收起哀怨，抱着孩子尽情亲热一阵，暂时忘了自己的寂寞。可约翰越来越关心政治，总往斯科特家跑，跟朋友讨论那些有意思的问题，压根没发现妻子在想他。梅格仍旧一个字也不说。直到母亲有一天看见她掉眼泪，坚持追问缘故，她才终于开了口。梅格低落的精神，其实早就没逃过母亲的眼睛。
        - id: ch01-b13
          speaker: meg
          text: 除了您，我谁也不告诉，妈妈。可我真的需要您指点。约翰再这样下去，我就跟守寡没两样了。
          emotion: sad
        - id: ch01-b14
          speaker: mrs_march
          text: 他到底怎么了，亲爱的？
        - id: ch01-b15
          speaker: meg
          text: 他白天不在家，晚上我想见他，他又总往斯科特家跑。最累的活全归我，我却一点消遣也没有，这太不公平了。男人都很自私，再好的也一样。
        - id: ch01-b16
          speaker: mrs_march
          text: 女人也一样。先看清自己错在哪里，再怪约翰吧。
        - id: ch01-b17
          speaker: meg
          text: 可他冷落我，总不能算对呀。妈妈，我还以为您会替我说话呢！
        - id: ch01-b18
          speaker: mrs_march
          text: 说到同情，我当然站在你这边。可这一次，我认为错在你。你从前特意陪约翰过晚上，那是他唯一的闲暇。那时候，他冷落过你吗？
        - id: ch01-b19
          speaker: meg
          text: 没有。可现在有两个孩子要照料，我做不到呀。
        - id: ch01-b20
          speaker: mrs_march
          text: 我看你做得到，也应该做。让我把话说得坦白些，好吗？请你记住，责备你的是妈妈，同情你的也是妈妈。
        - id: ch01-b21
          speaker: meg
          text: 您尽管说！就把我当成从前的小梅格吧。孩子样样都靠我以后，我常觉得自己比过去更需要人教导。
        - id: ch01-b22
          speaker: narrator
          text: 梅格把矮椅拉到母亲身边。两人膝上各有一个不时打岔的小家伙。她们一边摇着孩子，一边亲亲热热地谈起来。有了共同的牵挂，也有了共同的辛苦，她们之间又多了一重母亲才懂的联系，仿佛比从前更加亲近了。
        - id: ch01-b23
          speaker: mrs_march
          text: 你只是犯了许多年轻妻子都会犯的错。你太爱孩子，忘了对丈夫的责任。这很自然，也可以原谅，可要在你们各走各路以前改过来。孩子应该让你们更亲近，不该把你们拆开，好像他们只属于你，约翰除了养家就没别的事。我看了好几个星期，只因相信事情会慢慢好起来，才一直没开口。
        - id: ch01-b24
          speaker: meg
          text: 我怕它不会自己好起来。请他留下，他会以为我在吃醋，我不愿用这种猜疑侮辱他。他又看不出我需要他。我不知道怎样才能不开口，就让他明白。
        - id: ch01-b25
          speaker: mrs_march
          text: 那就把家里安排得叫他舍不得走。约翰想念自己的小家，可你整天待在育婴室，没有你，家就不像家。你也不该时时刻刻关在那里。那会让你神经紧张，到头来什么都做不好。
        - id: ch01-b26
          speaker: mrs_march
          text: 除了孩子，你对约翰也有责任。别为孩子冷落丈夫，也别把他挡在育婴室外。教他怎样帮忙吧，那里也是他的地方，孩子也需要他。让他知道自己有事可做，他会高高兴兴、尽心尽力地做，对全家都有好处。
        - id: ch01-b27
          speaker: meg
          text: 您真的这样想吗？
        - id: ch01-b28
          speaker: mrs_march
          text: 我不是想，我是知道，因为我亲自试过。你和乔小时候，我也觉得，除非把自己全给你们，否则就不算尽责。我拒绝你父亲帮忙，可怜的他只好去读书，让我独自试验。我勉强支撑，可乔实在难管，我差点把她宠坏。你身体又弱，我担心得自己也病了。
        - id: ch01-b29
          speaker: mrs_march
          text: 后来你父亲来相救，安安静静料理好一切。我这才看清错误，从此再也离不开他的帮助。这就是我们一家幸福的秘密。他不让外面的事把自己从全家的小责任中带走，我也不让家里的烦恼磨掉自己对他所做之事的兴趣。许多事上，我们各自尽本分，可在家里，我们永远一起做。
        - id: ch01-b30
          speaker: meg
          text: 妈妈，我也想像您一样对待丈夫和孩子。请教我吧，您说什么我都照办。
        - id: ch01-b31
          speaker: mrs_march
          text: 那就让约翰多管管德米。男孩子需要管教，现在开始并不早。也让汉娜来帮忙。她很会照料孩子。你多做些家务，活动活动，汉娜也能换换事情，约翰还会找回自己的妻子。多出去走走，既要勤快，也要快活。你是家里制造阳光的人，你若愁云满面，全家就没有好天气。
        - id: ch01-b32
          speaker: mrs_march
          text: 还要试着关心约翰喜欢的东西。陪他说话，让他念给你听，彼此交换想法。别因为自己是女人，就把自己装进帽盒。看看外面在发生什么，让自己也能参与世上的工作，因为那些事都关系到你和家人。
        - id: ch01-b33
          speaker: meg
          text: 约翰太懂事了。我若问政治之类的问题，他会不会觉得我很笨？
        - id: ch01-b34
          speaker: mrs_march
          text: 我不信。爱能遮盖许多过失。除了丈夫，你还能更放心地请教谁？试一试吧，看他是不是觉得你的陪伴比斯科特太太的夜宵更好。
        - id: ch01-b35
          speaker: meg
          text: 我会试的。可怜的约翰，我怕自己冷落他太久了。可我一直以为这样才对，他也没有说什么。
        - id: ch01-b36
          speaker: mrs_march
          text: 他不愿显得自私，可心里一定很寂寞。年轻夫妻这时候最容易渐渐疏远，也最应该守在一起。最初的柔情若不珍惜，很快就会磨掉。孩子生命最初的几年，对父母再珍贵不过。别让约翰成为孩子眼里的陌生人。世上的考验和诱惑那么多，孩子最能让他平安幸福。你们也会通过他们，真正学会了解彼此、相爱相亲。
        - id: ch01-b37
          speaker: mrs_march
          text: 好了，亲爱的，再见。想想妈妈这番说教，若觉得有道理，就照着做。愿上帝保佑你们全家。
          emotion: calm
        - id: ch01-b38
          speaker: narrator
          text: 梅格认真想过，觉得母亲说得对，也动手去做了。只是第一次尝试，并没完全照她计划的发展。孩子早已发现，只要又踢又叫，妈妈就会给他们想要的一切，于是很快统治起全家。妈妈对他们百依百顺，甘愿做个低声下气的奴隶。爸爸却没那么好征服。他偶尔拿出父亲的规矩管教吵闹的儿子，总会让温柔的妻子在一旁心疼。
        - id: ch01-b39
          speaker: narrator
          text: 德米从父亲那里继承了一点坚定。我们姑且不叫它固执。他的小脑袋一旦决定要得到什么，或非做什么不可，就算国王所有的马和所有的人一齐出动，也改变不了那个顽强的小念头。梅格觉得宝贝还太小，不必这么早学着克服偏见。约翰却认为，服从永远不会学得太早。德米很快发现，自己同“爸比”较量，每一回吃亏的都是他。可这小家伙也像英国人那样敬重征服自己的人。他爱父亲，而爸爸沉声说一句“不行”，比妈妈多少疼爱的轻拍都有用。
        - id: ch01-b40
          speaker: narrator
          text: 几天后，梅格决定同约翰过一个温馨的夜晚。她安排了好吃的晚餐，收拾好客厅，自己也认真打扮，还早早哄孩子上床，不让任何事情打断这场试验。偏偏德米最反对的就是睡觉。那一晚，他决心大闹。梅格抱着他又唱又摇，讲了一个又一个故事，用尽所有催眠法子，那双大眼睛还是不肯合上。圆滚滚、好脾气的黛西早已香甜地睡了，淘气的德米却直瞪着灯光，脸上清醒得叫人泄气。
        - id: ch01-b41
          speaker: meg
          text: 德米乖乖躺好，让妈妈下楼给可怜的爸爸倒茶，好不好？
        - id: ch01-b42
          speaker: demi
          text: 我也喝茶！
        - id: ch01-b43
          speaker: meg
          text: 现在不行。你要是像黛西一样乖乖睡觉，我给你留几块小蛋糕，明早再吃。好吗，宝贝？
        - id: ch01-b44
          speaker: demi
          text: 好，我睡觉！
        - id: ch01-b45
          speaker: narrator
          text: 德米紧紧闭上眼睛，好像这样就能一把抓住睡意，再把心心念念的早晨快点拉过来。梅格抓住这个好机会，轻手轻脚地溜出房间，赶紧跑下楼去。她笑盈盈地迎接丈夫，头发上系着一只小小的蓝蝴蝶结。那是约翰特别喜欢的装饰，她今晚特意把它戴了起来。
        - id: ch01-b46
          speaker: john
          text: 哟，小妈妈，今晚这么精神。你在等客人吗？
          emotion: surprised
        - id: ch01-b47
          speaker: meg
          text: 我只等你，亲爱的。
        - id: ch01-b48
          speaker: john
          text: 今天是谁的生日，还是纪念日？
        - id: ch01-b49
          speaker: meg
          text: 都不是。我厌倦了自己邋里邋遢的样子，想换换打扮。你再累也会收拾整齐再吃饭，我有时间时为什么不能也这样？
        - id: ch01-b50
          speaker: john
          text: 我那是为了尊重你，亲爱的。
        - id: ch01-b51
          speaker: meg
          text: 我也一样，布鲁克先生。
          emotion: happy
        - id: ch01-b52
          speaker: john
          text: 真好，像是回到了从前。茶的味道也对了。亲爱的，我敬你。
          emotion: happy
        - id: ch01-b53
          speaker: narrator
          text: 约翰刚陶醉地喝了一口茶，门把手便咔嗒作响，一个不耐烦的小嗓门从门外传来。
        - id: ch01-b54
          speaker: demi
          text: 开门门，我来啦！
        - id: ch01-b55
          speaker: narrator
          text: 梅格只好去开门，还埋怨这个淘气鬼不肯独自睡觉，光脚踩过冰凉的帆布地毯，准会冻出病来。德米却神气十足。他把长睡袍优雅地挽在手臂上，每走一步，满头卷发就快活地跳一下。他围着饭桌蹦蹦跶跶，两只眼睛含情脉脉地追着那些蛋糕。
        - id: ch01-b56
          speaker: demi
          text: 天亮啦！
          emotion: happy
        - id: ch01-b57
          speaker: meg
          text: 还没到早晨。你得回去睡，别再累着妈妈。睡好了，才能吃那块带糖的小蛋糕。
        - id: ch01-b58
          speaker: demi
          text: 我爱爸比。
        - id: ch01-b59
          speaker: john
          text: 你既然叫他留在楼上，自己睡觉，就得让他照办。不然，他永远学不会听你的话。
        - id: ch01-b60
          speaker: narrator
          text: 梅格领着儿子上楼，心里真想打这个小捣蛋的屁股。德米却蹦蹦跳跳地跟在旁边，一心以为只要走进房间，就能马上拿到那份甜蜜的贿赂。他果然没有失望。目光短浅的妈妈真的给了他一块糖，把他塞回被窝，命令他天亮前不许再出来散步。他幸福地含着糖答应，认定自己的第一次行动大获成功。
        - id: ch01-b61
          speaker: narrator
          text: 晚餐重新愉快地进行。可那个小幽灵很快又来了，还当面揭穿了妈妈。
        - id: ch01-b62
          speaker: demi
          text: 妈咪，我还要糖糖。
        - id: ch01-b63
          speaker: john
          text: 这样可不行。这孩子不学会好好睡觉，我们永远不得安宁。你给他做奴隶已经够久了。认真教他一次，以后就省事了。把他放回床上，然后离开，梅格。
        - id: ch01-b64
          speaker: meg
          text: 我不坐在旁边，他就不会留在床上。
        - id: ch01-b65
          speaker: john
          text: 我来管。德米，上楼去，照妈妈的话躺好。
        - id: ch01-b66
          speaker: demi
          text: 我不要上楼！
        - id: ch01-b67
          speaker: narrator
          text: 小叛徒神色自若地拿起蛋糕，吃了起来。
        - id: ch01-b68
          speaker: john
          text: 不许这样对爸爸说话。你不自己走，我就抱你上去。
        - id: ch01-b69
          speaker: demi
          text: 走开，我不爱爸比。
          emotion: angry
        - id: ch01-b70
          speaker: narrator
          text: 德米躲到母亲裙边，却还是被交给了敌人。妈妈一抛弃他，末日仿佛真的来了。蛋糕被夺走，玩闹也落了空，一只结实的胳膊把他抱向那张可恨的小床。他一路又踢又叫，公然反抗爸爸。刚从床的一边放进去，他就从另一边滚下来，拔腿往门口跑。约翰揪住睡袍尾巴，又把他送回去。这场热闹表演反复上演，德米终于用尽力气，只能扯开嗓门放声大哭。
        - id: ch01-b71
          speaker: narrator
          text: 这番练嗓子通常准能征服梅格，约翰却像传说中那根听不见声音的木桩，坐在那里纹丝不动。没有哄劝，没有糖，没有摇篮曲，也没有故事。灯也熄了，只剩炉火的红光照着德米嘴里的“大黑黑”。他与其说害怕，倒不如说好奇。可他十分厌恶这套新规矩。怒气慢慢散去以后，这个被关起来的小暴君又想起温柔的妈妈。响亮的号啕变成了可怜的呜咽，一声声扎进梅格心里，她终于忍不住跑上楼来。
        - id: ch01-b72
          speaker: meg
          text: 让我陪他吧，约翰。他现在会乖了。
        - id: ch01-b73
          speaker: john
          text: 不行，亲爱的。我告诉过他，既然你叫他睡，他就必须睡。哪怕我守上一夜，也得让他做到。
        - id: ch01-b74
          speaker: meg
          text: 可他会哭出病来的。他是我的孩子，我不能让严厉的办法挫掉他的性子。
          emotion: fearful
        - id: ch01-b75
          speaker: john
          text: 他也是我的孩子，我不能让纵容惯坏他的脾气。他已经累极了，很快会睡着，也会明白自己必须服从。下楼去吧，把孩子交给我。
        - id: ch01-b76
          speaker: narrator
          text: 约翰用不容分说的口气讲话时，梅格总会听从，而且从不后悔。
        - id: ch01-b77
          speaker: meg
          text: 那让我再亲他一下，好吗？
        - id: ch01-b78
          speaker: john
          text: 当然。德米，跟妈妈说晚安，让她去休息。照料你一整天，她已经很累了。
        - id: ch01-b79
          speaker: narrator
          text: 梅格一直相信，是那个吻赢得了胜利。吻过以后，德米哭得轻了，也不再翻滚。他一路扭到床尾，缩成一团。
        - id: ch01-b80
          speaker: narrator
          text: 约翰以为儿子已经睡着，便悄悄走到床边，想替他盖好。谁知德米立刻睁眼，小下巴发抖，伸出了两条胳膊。
        - id: ch01-b81
          speaker: demi
          text: 我乖乖啦。
          emotion: sad
        - id: ch01-b82
          speaker: narrator
          text: 梅格坐在门外的楼梯上。方才还闹得天翻地覆，屋里却忽然久久没有声音。她把种种不可能的意外全想了一遍，终于悄悄进去，好让自己安心。德米已经睡熟，不像往常那样四肢摊开，而是收敛地缩成一小团，紧紧依偎在父亲臂弯里，还握着父亲的一根手指。像是懂得公正里也有慈悲，他成了一个更忧伤、更明白事理的孩子。约翰拿出女人般的耐心，一直等那只小手松开。等着等着，他自己也累得睡着了。跟儿子这场较量，比一整天的工作更耗力气。
        - id: ch01-b83
          speaker: meg
          text: 看来我再也不必担心，约翰会对我的孩子太严厉了。他不光懂得立规矩，也知道什么时候该温柔。他真的会管孩子，以后一定能帮我大忙。德米一天比一天难对付，我自己已经越来越应付不了了。
        - id: ch01-b84
          speaker: narrator
          text: 约翰终于下楼，本以为妻子会闷闷不乐，或满脸责怪，却见梅格安安静静地装饰一顶帽子。她还问他，若是不太累，能不能念点选举的消息给她听。约翰一眼看出，家里正发生某种革命，却聪明地没有追问。他很了解梅格。这个小人儿就像玻璃一样透明，要她保守秘密简直要她的命，所以用不着着急，线索很快就会自己出现。
        - id: ch01-b85
          speaker: narrator
          text: 约翰十分和气地念完一篇长长的辩论，又用最明白的方式解释。梅格努力显得深感兴趣，提出聪明的问题，还竭力不让心思从国家局势溜回自己的帽子。可她心里早已认定，政治和数学一样讨厌，政治家的任务仿佛就是彼此骂人。她把这种女人家的看法藏好。约翰停下时，她郑重地摇了摇头，说了一句自以为十分圆滑、其实意思模糊的话。
        - id: ch01-b86
          speaker: meg
          text: 唉，我真不知道，我们这样下去会变成什么样。
        - id: ch01-b87
          speaker: narrator
          text: 约翰笑了，安静地看了她一会儿。梅格手里托着一个用花朵和蕾丝做成的漂亮小东西，正全神贯注地端详。这样真实热切的兴趣，是他刚才那番政治讲解怎么也没能唤起来的。约翰想，梅格为了自己，正努力学着喜欢政治。那么自己也该为了她，认真学着喜欢女帽。这才算公平。
        - id: ch01-b88
          speaker: john
          text: 真漂亮。这就是你们说的早餐帽吗？
        - id: ch01-b89
          speaker: meg
          text: 我的好先生，这是出门戴的帽子！我最好的一顶，专门戴去听音乐会、看戏。
        - id: ch01-b90
          speaker: john
          text: 请原谅。它太小了，我还以为是你偶尔戴的轻飘飘小玩意儿。你怎么把它留在头上？
        - id: ch01-b91
          speaker: meg
          text: 这几片蕾丝要在下巴下面用玫瑰花苞扣住。你看，就是这样。
        - id: ch01-b92
          speaker: narrator
          text: 梅格把帽子稳稳戴到头上，亲自示范那几片蕾丝怎样扣好。随后，她带着平静而满意的神情望向丈夫，那副可爱模样实在叫人无法抗拒。
        - id: ch01-b93
          speaker: john
          text: 帽子可爱极了。不过我更喜欢里面那张脸，它又显得年轻又快活了。
        - id: ch01-b94
          speaker: narrator
          text: 约翰低头吻了那张含笑的脸。他这一吻热情得很，害得梅格下巴下面那朵用来系住蕾丝的玫瑰花苞，也跟着险些遭殃。
        - id: ch01-b95
          speaker: meg
          text: 你喜欢就好。我想请你哪天晚上带我去听一场新音乐会。我需要一点音乐，替自己调调音。你愿意吗？
        - id: ch01-b96
          speaker: john
          text: 当然愿意，一百个愿意。你想去别的地方，我也陪你去。你在家里关得太久了，出去走走一定大有好处。能和你一起去，我自己也会再高兴不过。小妈妈，是谁把这个好主意放进你脑袋里的？
        - id: ch01-b97
          speaker: meg
          text: 前几天我跟妈妈谈过，告诉她自己又紧张，又爱发脾气，浑身都不对劲。她说我该换换环境，少操点心。汉娜会来帮忙照料孩子，我多管些家务，偶尔也找点乐子，免得没到年纪就变成烦躁衰弱的老太婆。
        - id: ch01-b98
          speaker: meg
          text: 这只是一场试验，约翰。我想认真试一试，既为了自己，也为了你。最近这些日子，我实在把你冷落得不像话。只要我能做到，就一定让这个家重新变回从前温暖快活的样子。希望你不会反对，好吗？
        - id: ch01-b99
          speaker: narrator
          text: 不必管约翰说了什么，也不必问那顶小帽子怎样险些彻底毁掉。后来屋子和屋里的人渐渐发生的变化，已经说明他并不反对。这里当然不是十全十美的乐园，偶尔仍会有麻烦，也不会时时刻刻和和气气。可一家人开始分担事情以后，每个人都比从前过得更好了。
        - id: ch01-b100
          speaker: narrator
          text: 孩子在父亲的管教下茁壮成长。做事准确、性情坚定的约翰给婴儿国带来了秩序，也教会小臣民们服从。梅格多做些有益的活动，享受一点乐趣，又常同明理的丈夫说知心话，便恢复了精神，紧绷的神经也安定下来。家重新有了家的样子。除非能带着梅格，约翰不再想往外跑。斯科特夫妇如今反过来到布鲁克家做客，人人都觉得这座小屋快活又舒服，装满了幸福、知足和一家人的爱。
        - id: ch01-b101
          speaker: narrator
          text: 连萨莉·莫法特也喜欢来。她每次环顾四周，眼里都带着向往，仿佛在努力寻找这座小屋的魔法，好把它带回自家那座宽敞的大宅。可那座房子虽然漂亮，却装满了华丽的孤独。那里没有吵吵闹闹、满脸阳光的孩子，内德也只活在自己的世界里，那个世界没有给妻子留下位置。
        - id: ch01-b102
          speaker: sallie
          text: 梅格，你这个家总是这么安静，又这么舒服。每回来这里坐一坐，我心里都会好受许多。
        - id: ch01-b103
          speaker: narrator
          text: 这份家庭的幸福不是一下子从天上掉下来的，可约翰和梅格已经找到了开启它的钥匙。婚姻生活每过一年，就会教他们把这把钥匙用得更好，打开真正的家庭之爱与彼此帮助的宝库。宝库里的财富，再穷的人也能够拥有，再富的人也休想用钱买来。
        - id: ch01-b104
          speaker: narrator
          text: 年轻的妻子和母亲，大可以心甘情愿登上这样的高阁。那里远离世间叫人烦躁不安的奔波与热病。她们会在依恋自己的小儿小女身上找到最忠贞的小爱人。这份爱不会因为忧伤、贫穷或年老而退缩。无论天气晴朗，还是风雨交加，她们都能与一位忠实的朋友并肩走下去。这个朋友，才真正配得上“丈夫”这个古老词语里“维系家庭之人”的本义。
        - id: ch01-b105
          speaker: narrator
          text: 在这样的日子里，她们也会像梅格一样慢慢明白，女人最幸福的王国是家。她最高的荣耀，不是坐上宝座发号施令，而是懂得怎样把这个王国治理好。她并不以女王的身份统治家人，而是做一个贤明的妻子和母亲，与丈夫彼此扶助，也让孩子在共同的爱里长大。
