  chapters:
    - id: ch01
      title: Amy's Lime Debts
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One day, Laurie came clattering past the March house on horseback. He gave his whip a flourish as he went by, and Amy watched him admiringly.
        - id: ch01-b02
          speaker: amy
          text: That boy makes a perfect Cyclops, doesn't he?
        - id: ch01-b03
          speaker: jo
          text: How can you call him that when he has both eyes? And very handsome eyes, too!
        - id: ch01-b04
          speaker: narrator
          text: Jo could never bear to hear anyone make a slighting remark about her friend.
        - id: ch01-b05
          speaker: amy
          text: I never said a word about his eyes. Why are you getting so upset when I'm praising the way he rides?
        - id: ch01-b06
          speaker: jo
          text: Oh, you little goose! You mean a centaur. You called him a Cyclops!
        - id: ch01-b07
          speaker: narrator
          text: Jo burst out laughing.
        - id: ch01-b08
          speaker: amy
          text: You don't have to be rude. It was only a lapse of lingy, as Mr. Davis says.
        - id: ch01-b09
          speaker: narrator
          text: Amy finished Jo off with that bit of Latin. Then she spoke as if she were talking to herself, though she meant every sister in the room to hear.
        - id: ch01-b10
          speaker: amy
          text: I only wish I had a little of the money Laurie spends on that horse.
        - id: ch01-b11
          speaker: narrator
          text: Jo went off into another fit of laughter, but Meg answered kindly.
        - id: ch01-b12
          speaker: meg
          text: What do you need the money for?
        - id: ch01-b13
          speaker: amy
          text: I need it terribly. I'm deep in debt, and I won't get my turn at the rag money for another month.
        - id: ch01-b14
          speaker: meg
          text: In debt? Amy, what do you mean?
        - id: ch01-b15
          speaker: amy
          text: I owe the girls at least a dozen pickled limes. I can't pay them back until I have money, because Marmee won't let me charge anything at the shop.
        - id: ch01-b16
          speaker: meg
          text: Tell me how all this happened. Are limes the fashion now? I thought everyone was pricking bits of rubber to make balls.
        - id: ch01-b17
          speaker: narrator
          text: Meg tried not to smile. Amy looked so solemn and important.
        - id: ch01-b18
          speaker: amy
          text: All the girls buy them. If you don't, everyone thinks you're mean. Limes are the only thing now. Girls suck them at their desks during lessons, and at recess they trade them for pencils, bead rings, paper dolls, or whatever else they want.
        - id: ch01-b19
          speaker: amy
          text: When one girl likes another, she gives her a lime. When she's angry, she eats one right in front of her and won't offer her even a taste. We all take turns treating. I've accepted ever so many, but I haven't paid anyone back. They're debts of honor, you know.
        - id: ch01-b20
          speaker: meg
          text: How much will settle these debts and make you respectable again?
        - id: ch01-b21
          speaker: narrator
          text: Meg took out her purse.
        - id: ch01-b22
          speaker: amy
          text: A quarter is more than enough. There would even be a few cents left to buy you a treat. Don't you like limes?
        - id: ch01-b23
          speaker: meg
          text: Not very much, so you may have my share. Here's the money. Make it last, Amy. There isn't much to spare.
        - id: ch01-b24
          speaker: amy
          text: Oh, thank you! It must be wonderful to have pocket money. I'll give everyone a splendid feast. I haven't tasted a lime all week. I couldn't accept one when I had no way to return it, and I've truly been suffering without them.
          emotion: happy
    - id: ch02
      title: The Forbidden Treat
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Amy was a little late to school the next morning. Before hiding a damp brown-paper package in the deepest part of her desk, she couldn't resist letting the girls see it. Within minutes, everyone in her circle knew that Amy March had brought twenty-four delicious limes. She had eaten one on the way and meant to treat her friends with the rest.
        - id: ch02-b02
          speaker: narrator
          text: Suddenly, those friends could not do enough for her.
        - id: ch02-b03
          speaker: katy
          text: Amy, you must come to my next party.
        - id: ch02-b04
          speaker: mary
          text: Take my watch until recess. I insist.
        - id: ch02-b05
          speaker: narrator
          text: Even Jenny Snow offered to help with some dreadful arithmetic problems. Jenny was a sharp-tongued girl who had mocked Amy when she had no limes. Amy still remembered her remarks about proud people who could smell other girls' limes well enough, even if their noses were too grand to ask for one.
        - id: ch02-b06
          speaker: amy
          text: You can stop being so polite all of a sudden, Jenny. You aren't getting a lime.
        - id: ch02-b07
          speaker: narrator
          text: That morning, an important visitor came to the school. He praised Amy's beautifully drawn maps. Jenny hated seeing her enemy honored, while Amy began to strut like a proud little peacock. But pride was about to have a fall. As soon as the guest finished his usual compliments and bowed himself out, Jenny pretended to ask Mr. Davis an important question. Instead, she told him that Amy March had pickled limes in her desk.
        - id: ch02-b08
          speaker: narrator
          text: Mr. Davis had forbidden limes and promised to strike the first pupil caught with them. The poor man had already fought a long war against chewing gum. He had burned the novels and newspapers he took away, shut down a secret post office, and forbidden faces, nicknames, and caricatures. He had done everything one man could do to control fifty rebellious girls.
        - id: ch02-b09
          speaker: narrator
          text: Boys can try anyone's patience, but girls were even harder on a nervous gentleman with a tyrant's temper and no gift for teaching. Mr. Davis knew great quantities of Greek, Latin, algebra, and every sort of science, so people called him a fine teacher. No one seemed to care much about his manners, his morals, his feelings, or the example he set.
        - id: ch02-b10
          speaker: narrator
          text: Jenny had chosen the worst possible moment to betray Amy. Mr. Davis had drunk coffee that was too strong. An east wind had stirred up his neuralgia, and the students had not performed as well as he believed they should. In a schoolgirl's words, he was as nervous as a witch and as cross as a bear.
        - id: ch02-b11
          speaker: narrator
          text: The word limes struck him like a spark in gunpowder. His yellow face turned red, and he hit his desk so hard that Jenny hurried back to her seat.
        - id: ch02-b12
          speaker: mr_davis
          text: Young ladies, may I have your attention!
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: The room went silent. Fifty pairs of blue, black, gray, and brown eyes fixed themselves obediently on his terrible face.
        - id: ch02-b14
          speaker: mr_davis
          text: Miss March, come to my desk.
        - id: ch02-b15
          speaker: narrator
          text: Amy stood with a calm face, but fear pressed down on her. The hidden limes weighed on her conscience.
        - id: ch02-b16
          speaker: mr_davis
          text: Bring the limes from your desk with you.
        - id: ch02-b17
          speaker: narrator
          text: The order stopped Amy before she could leave her seat.
        - id: ch02-b18
          speaker: classmate
          text: Don't give him every one.
        - id: ch02-b19
          speaker: narrator
          text: Her neighbor whispered the advice quickly. Amy shook six limes out of the package, then carried the rest to Mr. Davis. Surely any man with a heart would soften when he smelled that delicious pickle. Unfortunately, Mr. Davis hated the odor. Now disgust joined his anger.
        - id: ch02-b20
          speaker: mr_davis
          text: Is this all of them?
        - id: ch02-b21
          speaker: amy
          text: Not exactly.
        - id: ch02-b22
          speaker: narrator
          text: Amy stumbled over the answer.
        - id: ch02-b23
          speaker: mr_davis
          text: Bring me the rest. Now.
          emotion: angry
        - id: ch02-b24
          speaker: narrator
          text: Amy gave her friends a hopeless look and obeyed.
        - id: ch02-b25
          speaker: mr_davis
          text: Are you certain there are no more?
        - id: ch02-b26
          speaker: amy
          text: Sir, I don't lie.
        - id: ch02-b27
          speaker: mr_davis
          text: I see. Take these disgusting things, two at a time, and throw them out the window.
        - id: ch02-b28
          speaker: narrator
          text: Every girl sighed at once, making a small gust through the room. Their last hope vanished. Their longed-for feast had been taken away.
        - id: ch02-b29
          speaker: narrator
          text: Amy's face burned with anger and shame. Six awful times she crossed the room. Each time, she dropped two plump, juicy limes from unwilling hands. Shouts rose from the street below. The little Irish children, sworn enemies of the schoolgirls, were cheering over the unexpected feast. That was almost more than the class could bear. The girls shot angry or pleading looks at Mr. Davis, and one passionate lover of limes began to cry.
    - id: ch03
      title: Amy's Humiliation
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When Amy returned from her final trip to the window, Mr. Davis cleared his throat with dreadful importance.
        - id: ch03-b02
          speaker: mr_davis
          text: Young ladies, you remember the warning I gave you last week. I regret what has happened, but I do not permit anyone to break my rules, and I always keep my word. Miss March, hold out your hand.
        - id: ch03-b03
          speaker: narrator
          text: Amy jumped and hid both hands behind her back. She looked up at him, silently begging as no words could have begged. She was one of old Davis's favorites, and the narrator privately believed he might have gone back on his promise. Then one angry girl let out a faint hiss. The sound irritated him, and Amy's fate was settled.
        - id: ch03-b04
          speaker: mr_davis
          text: Your hand, Miss March!
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: Amy was too proud to cry or plead. She clenched her teeth, lifted her head in defiance, and held out her hand. Several blows left her small palm tingling. They were not many, and they were not hard, but that meant nothing to her. No one had ever struck her before. To Amy, the disgrace felt as deep as if he had knocked her down.
        - id: ch03-b06
          speaker: mr_davis
          text: You will stand on the platform until recess.
        - id: ch03-b07
          speaker: narrator
          text: Now that he had begun, Mr. Davis meant to finish the punishment properly. For Amy, this was the worst part. Returning to her seat would have been bad enough. She would have seen pity on her friends' faces and satisfaction on her enemies'. But standing before the entire school while the shame was still burning seemed impossible.
        - id: ch03-b08
          speaker: narrator
          text: For one moment, Amy thought she might collapse right there and cry until her heart broke. Then the unfairness of it all, and the thought of Jenny Snow, gave her strength. She took her humiliating place. Fixing her eyes on the stove pipe above what looked like a sea of faces, she stood perfectly still and white. The other girls could hardly study with that sorrowful little figure before them.
        - id: ch03-b09
          speaker: narrator
          text: The next fifteen minutes brought Amy a pain and shame she never forgot. Other people might have thought the whole affair silly or unimportant. But it was a hard experience for a proud, sensitive girl of twelve who had always been guided by love. No blow like this had ever touched her.
        - id: ch03-b10
          speaker: narrator
          text: Soon the sting in her hand and the ache in her heart were swallowed by a worse thought. She would have to tell her family, and they would be disappointed in her.
        - id: ch03-b11
          speaker: narrator
          text: Those fifteen minutes felt like an hour, but at last they ended. Amy had never been so glad to hear the word recess.
        - id: ch03-b12
          speaker: mr_davis
          text: Miss March, you are dismissed.
        - id: ch03-b13
          speaker: narrator
          text: Mr. Davis looked as uncomfortable as he felt. He would not soon forget the reproach in Amy's eyes. Without speaking to anyone, she went straight into the anteroom, seized her things, and left the school forever, as she fiercely promised herself.
        - id: ch03-b14
          speaker: narrator
          text: Amy reached home in a miserable state. When her older sisters arrived later, the family held an indignant meeting at once. Marmee said little, but she looked troubled and comforted her youngest daughter with great tenderness. Meg washed the injured hand with glycerin and tears. Beth felt that not even her beloved kittens could soothe a sorrow like this.
        - id: ch03-b15
          speaker: jo
          text: Mr. Davis ought to be arrested this minute!
          emotion: angry
        - id: ch03-b16
          speaker: narrator
          text: Hannah shook her fist at the villain. Then she pounded the dinner potatoes as though Mr. Davis himself were under her pestle.
        - id: ch03-b17
          speaker: narrator
          text: Apart from Amy's friends, no one at school paid much attention to her escape. Still, the sharp-eyed girls noticed that Mr. Davis was unusually gentle that afternoon, and unusually nervous too.
        - id: ch03-b18
          speaker: narrator
          text: Just before school ended, Jo marched in with a grim face. She delivered a letter from Marmee, gathered up Amy's belongings, and left. At the door, she carefully scraped the mud from her boots on the mat, as if she meant to shake the very dust of the school from her feet.
    - id: ch04
      title: A Lesson in Modesty
      blocks:
        - id: ch04-b01
          speaker: marmee
          text: Yes, Amy, you may have a vacation from school. But I want you to study with Beth for a little while every day. I don't approve of striking students, especially girls. I also dislike Mr. Davis's way of teaching, and I don't think your school friends are helping you become a better person. Before I send you anywhere else, I'll ask your father's advice.
        - id: ch04-b02
          speaker: amy
          text: Good! I wish every girl would leave and ruin his old school. And it still makes me furious to think about those beautiful limes.
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: Amy sighed like a martyr.
        - id: ch04-b04
          speaker: marmee
          text: I'm not sorry you lost them. You disobeyed a rule, and that deserved some punishment.
        - id: ch04-b05
          speaker: narrator
          text: This stern answer disappointed Amy. She had expected nothing but sympathy.
        - id: ch04-b06
          speaker: amy
          text: Do you mean you're glad he shamed me in front of the whole school?
        - id: ch04-b07
          speaker: marmee
          text: I would not have corrected you that way. Still, the experience may help you more than a gentler punishment would have. You're becoming rather conceited, my dear, and it's time to work on that fault.
        - id: ch04-b08
          speaker: marmee
          text: You have many little talents and good qualities, but you don't need to parade them. Conceit can spoil even the finest genius. Real talent and goodness usually get noticed before long. Even if they don't, it should be enough to know that you possess them and use them well. Modesty is what makes any gift truly attractive.
        - id: ch04-b09
          speaker: narrator
          text: Laurie was playing chess with Jo in a corner, and he suddenly joined in.
        - id: ch04-b10
          speaker: laurie
          text: That's exactly right! I once knew a girl with a remarkable gift for music. She had no idea she possessed it. She never guessed how sweet the little pieces were that she made up when she was alone, and she wouldn't have believed anyone who told her.
        - id: ch04-b11
          speaker: beth
          text: I wish I knew such a nice girl. Maybe she could help me, because I'm so stupid.
        - id: ch04-b12
          speaker: narrator
          text: Beth stood beside Laurie and listened eagerly.
        - id: ch04-b13
          speaker: laurie
          text: You do know her. And she helps you better than anyone else ever could.
        - id: ch04-b14
          speaker: narrator
          text: A mischievous meaning danced in Laurie's merry black eyes. Beth suddenly turned bright red and hid her face in a sofa cushion. The discovery had completely overcome her.
        - id: ch04-b15
          speaker: narrator
          text: Jo was so pleased by Laurie's praise of her Beth that she let him win the chess game. No one could persuade Beth to play for them after that compliment. So Laurie did his best instead and sang beautifully. He was in an especially lively mood, for he seldom showed the March family the darker side of his nature.
        - id: ch04-b16
          speaker: narrator
          text: After Laurie had gone, Amy sat thinking over a new idea. At last she spoke.
        - id: ch04-b17
          speaker: amy
          text: Is Laurie an accomplished boy?
        - id: ch04-b18
          speaker: marmee
          text: Yes. He has been very well educated, and he has many talents. If too much petting doesn't spoil him, he will grow into a fine man.
        - id: ch04-b19
          speaker: amy
          text: He doesn't think too highly of himself, does he?
        - id: ch04-b20
          speaker: marmee
          text: Not at all. That's what makes him so charming, and why we all like him so much.
        - id: ch04-b21
          speaker: amy
          text: Now I understand. It's good to be talented and elegant, but you shouldn't show off or act important about it.
        - id: ch04-b22
          speaker: marmee
          text: When people use their gifts modestly, you can see and feel those gifts in everything they do and say. They don't need to put them on display.
        - id: ch04-b23
          speaker: jo
          text: No more than you need to wear every bonnet, dress, and ribbon you own at the same time, just to prove you have them.
        - id: ch04-b24
          speaker: narrator
          text: And with that, the lesson ended in laughter.
