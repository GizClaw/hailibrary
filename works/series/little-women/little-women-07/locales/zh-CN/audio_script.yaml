audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机智，像在炉边从容讲述旧日家事
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中
    jo:
      display_name: 乔
      tts:
        delivery: 爽直活泼，情绪来得快，带一点男孩子气
        timbre: 明亮略带沙哑
        pace: 偏快
        pitch: 中低
    meg:
      display_name: 梅格
      tts:
        delivery: 温柔端庄，常带大姐姐式的认真
        timbre: 柔和圆润
        pace: 适中
        pitch: 中
    beth:
      display_name: 贝丝
      tts:
        delivery: 羞怯安静，话语真诚而体贴
        timbre: 轻柔温暖
        pace: 稍慢
        pitch: 中高
    amy:
      display_name: 艾米
      tts:
        delivery: 一本正经又有些自负，努力显得优雅
        timbre: 清脆稚嫩
        pace: 适中
        pitch: 偏高
    mrs_march:
      display_name: 马奇太太
      tts:
        delivery: 慈爱爽朗，沉稳中带着鼓励
        timbre: 饱满温暖
        pace: 从容
        pitch: 中低
    hannah:
      display_name: 汉娜
      tts:
        delivery: 朴实爽快，带着操持家务多年的亲昵
        timbre: 粗朴温厚
        pace: 适中
        pitch: 中低
    laurie:
      display_name: 劳里
      tts:
        delivery: 彬彬有礼而略显腼腆，熟悉以后轻松风趣
        timbre: 清朗温和
        pace: 适中
        pitch: 中
    mr_davis:
      display_name: 戴维斯先生
      tts:
        delivery: 刻板严厉，发号施令时带着压人的威势
        timbre: 干涩紧绷
        pace: 偏慢
        pitch: 中低
    schoolgirl:
      display_name: 女同学
      tts:
        delivery: 年轻机敏，压低声音时仍藏不住急切
        timbre: 清亮稚嫩
        pace: 偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 酸橙的名誉债
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天，劳里骑着马从门前哒哒而过。经过姑娘们身边时，他还潇洒地扬了一下马鞭。艾米看着他的背影，忽然冒出一句话。
        - id: ch01-b02
          speaker: amy
          text: “那男孩真像个独眼巨人，对不对？”
        - id: ch01-b03
          speaker: jo
          text: “你怎么能这么说？他明明有两只眼睛，而且都漂亮极了！”
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 乔最听不得别人说她朋友的坏话。艾米却觉得这阵火气来得毫无道理。
        - id: ch01-b05
          speaker: amy
          text: “我根本没说他的眼睛呀。我是在夸他马骑得好，你急什么？”
        - id: ch01-b06
          speaker: jo
          text: “天哪，你这个小笨鹅！你想说的是半人马，怎么说成独眼巨人了？”
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: 乔笑出了声。艾米马上借来戴维斯先生那句蹩脚的拉丁文反击，说这不过是舌头打了结。她竟用同样的错堵住了乔的嘴，接着像在自言自语，又故意让姐姐们听见。
        - id: ch01-b08
          speaker: amy
          text: “劳里花在那匹马上的钱，要是能分我一点儿就好了。”
        - id: ch01-b09
          speaker: meg
          text: “你为什么想要钱？”
        - id: ch01-b10
          speaker: narrator
          text: 梅格问得很和气。乔却又为艾米的第二个错误笑着跑开了。
        - id: ch01-b11
          speaker: amy
          text: “我现在特别需要钱。我欠了好多债，可再过一个月才轮到我拿卖破布的钱。”
        - id: ch01-b12
          speaker: meg
          text: “你还会欠债？艾米，到底怎么回事？”
        - id: ch01-b13
          speaker: amy
          text: “我欠同学至少十二只腌酸橙。没钱就没法还，妈妈又不许我在店里赊账。”
        - id: ch01-b14
          speaker: meg
          text: “那你从头讲讲。学校里如今流行酸橙吗？以前不是把橡皮碎屑扎成球吗？”
        - id: ch01-b15
          speaker: narrator
          text: 艾米神情严肃，像在谈一件极其重大的事，梅格只好忍住笑。
        - id: ch01-b16
          speaker: amy
          text: “姑娘们总在买酸橙。你要是不买，人家就会觉得你小气。现在大家上课时躲在课桌下面吸酸橙，课间再拿它换铅笔、珠子戒指、纸娃娃，还有别的东西。谁喜欢一个姑娘，就送她一只。谁在生她的气，就当着她的面吃，连一口也不分。大家轮流请客，我吃过好多，却没回请过。这些都是名誉债，当然得还。”
        - id: ch01-b17
          speaker: meg
          text: “要多少钱，才能把你的债还清，让大家重新信得过你？”
        - id: ch01-b18
          speaker: narrator
          text: 梅格说着拿出了钱包。
        - id: ch01-b19
          speaker: amy
          text: “二十五美分肯定够了，还能剩几分钱请你吃一只。你不喜欢酸橙吗？”
        - id: ch01-b20
          speaker: meg
          text: “我不怎么喜欢，我那份也留给你。这些钱拿去吧，尽量多用些日子。咱们家的钱可不多。”
        - id: ch01-b21
          speaker: amy
          text: “谢谢你！能有零用钱真好。我要好好吃一顿，这星期我一只酸橙都没尝。我还不起，当然不好意思再拿别人的，可我真的馋坏了。”
          emotion: happy
        - id: ch01-b22
          speaker: narrator
          text: 第二天，艾米上学迟了一点儿。她带来一个湿漉漉的棕色纸包，藏进课桌最深处以前，还是颇为得意地给人看了看。没过几分钟，她那一群朋友全知道了。艾米·马奇有二十四只鲜美的酸橙，路上还吃了一只，而且准备请客。
        - id: ch01-b23
          speaker: narrator
          text: 朋友们一下殷勤得叫人招架不住。凯蒂·布朗当场请她参加下一次聚会。玛丽·金斯利非要把手表借她戴到课间。最积极的是尖刻的珍妮·斯诺。她前些天还嘲笑艾米没有酸橙，现在立刻表示休战，甚至愿意替她做几道吓人的算术题。
        - id: ch01-b24
          speaker: narrator
          text: 可艾米记得珍妮那些刻薄话。珍妮说过，有些人的鼻子还没扁到闻不见别人的酸橙，还说那些自命不凡的人并没有傲到不好意思开口讨。艾米马上用一句冷话，把她的希望彻底掐灭。
        - id: ch01-b25
          speaker: amy
          text: “你不用忽然对我这么客气，反正我一只也不会给你。”
    - id: ch02
      title: 戒尺与讲台
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那天上午，学校里恰好来了一个有身份的客人。艾米画的地图很漂亮，得到了他的称赞。珍妮看见自己的仇敌出了风头，心里很不好受。艾米呢，已经摆出一副勤奋小孔雀的神气。可骄傲之后，跌跤就来了。客人说完那些照例而又陈旧的恭维话，鞠躬离开。珍妮假装有要紧事要问，转身就向戴维斯先生告发，说艾米的课桌里藏着腌酸橙。
        - id: ch02-b02
          speaker: narrator
          text: 戴维斯先生早把酸橙列为违禁品。他还郑重宣布，第一个触犯禁令的人，要在众人面前挨戒尺。为了管住五十来个不肯安分的姑娘，这位饱经折磨的先生已经做了许多事。他打过一场漫长又激烈的仗，总算赶走了口香糖。他烧掉没收来的小说和报纸，取缔姑娘们私设的邮局，不许人做鬼脸、起绰号、画讽刺画。一个人能做的，他差不多全做了。
        - id: ch02-b03
          speaker: narrator
          text: 天知道，男孩已经够考验耐性，可姑娘还要难缠得多。要是老师神经紧张、脾气专横，教书的本事又不比布林伯博士强，那就更糟。戴维斯先生精通希腊文、拉丁文、代数和各种学问，所以人们都说他是好教师。至于礼貌、品德、感情和以身作则，大家倒不觉得多么重要。
        - id: ch02-b04
          speaker: narrator
          text: 珍妮很清楚，这天正是告发艾米的最好时机。戴维斯先生早上的咖啡显然太浓。外面又刮着东风，他一遇东风就犯神经痛。学生们的表现也没让他得到自认为应得的尊重。借用一个女学生不大文雅却很传神的话，他紧张得像个女巫，暴躁得像头熊。
        - id: ch02-b05
          speaker: narrator
          text: 一听见“酸橙”，他就像火药碰到了火星。那张蜡黄的脸涨得通红，他猛敲讲桌。珍妮吓得一下跳回座位，动作比平时快多了。
        - id: ch02-b06
          speaker: mr_davis
          text: “各位小姐，请安静，注意听！”
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: 教室里的嗡嗡声立刻停了。五十双蓝的、黑的、灰的、棕的眼睛，全都乖乖望着他那张可怕的脸。
        - id: ch02-b08
          speaker: mr_davis
          text: “马奇小姐，到讲桌前面来。”
        - id: ch02-b09
          speaker: narrator
          text: 艾米站起来，表面还算镇定，心里却越来越害怕。那些酸橙正重重压在她的良心上。她还没离开座位，戴维斯先生又下了一道命令。
        - id: ch02-b10
          speaker: mr_davis
          text: “把课桌里的酸橙一起带过来。”
        - id: ch02-b11
          speaker: schoolgirl
          text: “别把所有酸橙都拿过去。”
        - id: ch02-b12
          speaker: narrator
          text: 邻座姑娘压低声音提醒她，临到这时候还真沉得住气。艾米赶紧抖出六只藏下，把其余的放到戴维斯先生面前。她想，任何有心的人闻到那么诱人的香味，都会软下来。偏偏戴维斯先生最讨厌这种时兴腌货的气味，心里的厌恶只让他更加生气。
        - id: ch02-b13
          speaker: mr_davis
          text: “所有酸橙都在这里了吗？”
        - id: ch02-b14
          speaker: amy
          text: “不……还差一点儿。”
          emotion: fearful
        - id: ch02-b15
          speaker: mr_davis
          text: “马上把剩下的拿来。”
        - id: ch02-b16
          speaker: narrator
          text: 艾米绝望地看了一眼自己的朋友们，只得照办。
        - id: ch02-b17
          speaker: mr_davis
          text: “现在确定没有了吗？”
        - id: ch02-b18
          speaker: amy
          text: “先生，我从来不撒谎。”
        - id: ch02-b19
          speaker: mr_davis
          text: “我看得出来。现在两个两个地拿起这些恶心的东西，把它们全扔到窗外。”
          emotion: disgusted
        - id: ch02-b20
          speaker: narrator
          text: 全班同时叹气，竟像吹起了一阵小风。最后一点希望也没了，姑娘们眼看那顿美味从嘴边被夺走。艾米又羞又气，脸红得发烫，只能来来回回走上六趟。每一对酸橙都那么饱满，那么多汁，却从她不情愿的手里落下窗去。
        - id: ch02-b21
          speaker: narrator
          text: 每扔下一对，街上就响起一阵欢呼。那群爱尔兰小孩是女学生们的死对头，如今正为这顿意外的大餐高兴。姑娘们听得痛苦极了。这实在太过分！她们一起向铁石心肠的戴维斯先生投去愤怒或哀求的目光。一个特别爱酸橙的姑娘甚至哭了。
        - id: ch02-b22
          speaker: narrator
          text: 艾米最后一次走回来，戴维斯先生意味深长地哼了一声，用最庄严的口气继续训话。
        - id: ch02-b23
          speaker: mr_davis
          text: “各位小姐，你们都记得我一个星期前说过的话。我不愿看到今天的事，可我的规矩不许任何人违反，我说过的话也绝不会收回。马奇小姐，把手伸出来。”
        - id: ch02-b24
          speaker: narrator
          text: 艾米吃了一惊，立刻把两只手藏到背后。她一句话也说不出来，只能用眼睛苦苦哀求。大家背后都叫他老戴维斯，而艾米原本颇得他的喜欢。我私下相信，他本来可能真的会收回成命。可是，一个忍不住气愤的姑娘轻轻嘘了一声。声音虽然不大，却激怒了这个暴躁的人，也决定了艾米接下来的命运。
        - id: ch02-b25
          speaker: mr_davis
          text: “马奇小姐，把手伸出来！”
          emotion: angry
        - id: ch02-b26
          speaker: narrator
          text: 艾米骄傲得不肯哭，也不肯求饶。她咬紧牙，倔强地仰起头，把小手伸了出去。戒尺在掌心打了几下，火辣辣地疼，她却一下也没躲。打得不多，也不算重，可这并不能减轻她的感受。这是艾米有生以来第一次挨打。在她看来，这份羞辱同被人一拳打倒一样深。
        - id: ch02-b27
          speaker: mr_davis
          text: “你现在站到讲台上去，等到课间休息。”
        - id: ch02-b28
          speaker: narrator
          text: 戴维斯先生既然开了头，就决定把事情做到底。对艾米来说，这比挨戒尺还可怕。回到座位上，看见朋友的同情和几个仇人的得意，已经够难受了。现在羞耻还烫在心头，她却要站在全校面前。有那么一会儿，她只想倒在原地，放声大哭。
        - id: ch02-b29
          speaker: narrator
          text: 可她想到自己受的委屈，又想到珍妮·斯诺，终于撑住了。她站到那个受辱的位置，眼睛死死盯着火炉上方的烟管，不肯低头去看眼前那片人脸。艾米一动不动，脸色白得吓人。姑娘们看着这个可怜的小小身影，连功课也做不下去了。
        - id: ch02-b30
          speaker: narrator
          text: 接下来的十五分钟，骄傲又敏感的艾米受尽了羞耻和痛苦，一辈子都没有忘掉。别人也许觉得这件事滑稽，或者根本不值一提。可艾米十二年来只受过爱的管教，从没挨过这样的打。手掌的疼和心里的酸楚，很快都被另一个更尖锐的念头盖了过去。
        - id: ch02-b31
          speaker: amy
          text: “我回家以后非说不可。他们一定会对我失望透顶！”
          emotion: sad
        - id: ch02-b32
          speaker: narrator
          text: 十五分钟像一个钟头那么长，可终于还是过去了。从没有哪一次，“课间休息”这几个字听来这么叫人欢迎。
        - id: ch02-b33
          speaker: mr_davis
          text: “马奇小姐，你可以走了。”
        - id: ch02-b34
          speaker: narrator
          text: 戴维斯先生自己也不自在，脸上藏不住。艾米临走时看了他一眼，那眼神里的责备让他很久都忘不了。她没跟任何人说话，径直走进前室，抓起自己的东西便离开学校。她在心里发誓，自己永远也不回来了。
    - id: ch03
      title: 一场愤慨大会
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 艾米回家时，已经难过得不成样子。后来姐姐们也到了家，一场愤慨大会马上开始。马奇太太没有说太多，可她神色不安，用最温柔的方式安慰受苦的小女儿。梅格用甘油洗艾米挨打的手，一边洗一边掉泪。贝丝觉得，就连自己最爱的猫咪也治不好这样的伤心。乔气得主张马上逮捕戴维斯先生。汉娜则朝那个恶棍挥着拳头，又把晚饭的土豆捣得砰砰响，像是杵子下面压着的就是他。
        - id: ch03-b02
          speaker: narrator
          text: 学校里除了艾米的同学，没人理会她突然离开。不过那些眼尖的小姐发现，戴维斯先生下午变得格外和气，也比平常更紧张。快放学时，乔阴沉着脸走进教室。她大步来到讲桌前，交上一封马奇太太写的信，收好艾米的东西，转身就走。临出门时，她还故意在门垫上使劲刮掉靴底的泥，像是连学校的一粒灰尘也不肯带走。
        - id: ch03-b03
          speaker: mrs_march
          text: “好吧，你可以先放一阵学假，不过每天要跟贝丝读一点书。我不赞成体罚，尤其不赞成打女孩。我不喜欢戴维斯先生教书的方式，也不觉得那些同学给了你什么好影响。我会先问问你父亲的意见，再决定送你去哪里。”
        - id: ch03-b04
          speaker: amy
          text: “太好了！真希望所有姑娘都离开，让他那所破学校办不下去。可一想到那些可爱的酸橙，我还是气得发疯。”
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: 艾米叹着气，摆出一副受难者的样子。可母亲接下来的话比她盼望的严厉多了。
        - id: ch03-b06
          speaker: mrs_march
          text: “酸橙没了，我并不可惜。你违反了规矩，因为不听话受一点惩罚，也是应该的。”
        - id: ch03-b07
          speaker: narrator
          text: 年轻小姐以为自己只会得到同情，听见这句话，很是失望。
        - id: ch03-b08
          speaker: amy
          text: “您难道觉得，我在全校面前受辱也是好事吗？”
        - id: ch03-b09
          speaker: mrs_march
          text: “如果要改正错误，我不会用那种办法。不过这一次的教训，也许比更严厉的惩罚更对你有用。亲爱的，你最近有些自负，该认真改一改了。你有不少才华，也有许多长处，可用不着拿出来炫耀。再好的天分，也会被自负糟蹋。”
        - id: ch03-b10
          speaker: mrs_march
          text: “真正的才华和美德，不会长久没人看见。就算一时没有人发现，你知道自己拥有这些长处，也好好使用了，就应该满足。任何一种才能，最动人的地方都是谦逊。”
        - id: ch03-b11
          speaker: narrator
          text: 劳里正在角落里同乔下棋，听到这里，马上接过了话。
        - id: ch03-b12
          speaker: laurie
          text: “这话一点不错！我认识一个姑娘，她在音乐上有非常出色的天分，自己却完全不知道。她一个人时会写出很好听的小曲子，可从没想过那有多好。就算有人告诉她，她也不会相信。”
        - id: ch03-b13
          speaker: beth
          text: “真希望我也认识那个好姑娘。也许她愿意帮帮我，我实在太笨了。”
        - id: ch03-b14
          speaker: narrator
          text: 贝丝站在劳里身旁，听得非常认真。
        - id: ch03-b15
          speaker: laurie
          text: “你当然认识她。她给你的帮助，别人谁也比不上。”
        - id: ch03-b16
          speaker: narrator
          text: 劳里快活的黑眼睛里满是淘气的深意。贝丝终于听懂他在说谁，脸一下红透了，只好把头埋进沙发靠垫，完全招架不住这个意外的发现。
    - id: ch04
      title: 谦逊的装扮
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 乔很爱她的贝丝。为了报答劳里这番赞美，她故意让他赢了那盘棋。贝丝刚受过夸奖，无论怎样央求，也不肯再为他们弹琴。劳里只好拿出自己的本领，唱得十分动听。他那晚心情格外快活，因为在马奇一家面前，他很少显出性情阴郁的那一面。
        - id: ch04-b02
          speaker: narrator
          text: 劳里离开以后，艾米忽然开了口。她整晚都在思索，像是刚把一个新问题想明白一点。
        - id: ch04-b03
          speaker: amy
          text: “妈妈，劳里算是一个很有才艺的男孩吗？”
        - id: ch04-b04
          speaker: mrs_march
          text: “是的。他受过很好的教育，也很有才华。只要不被宠坏，将来会成为一个出色的人。”
        - id: ch04-b05
          speaker: amy
          text: “可他一点也不自负，对吧？”
        - id: ch04-b06
          speaker: mrs_march
          text: “一点也不。正因为这样，他才那么讨人喜欢，我们大家也才会这么喜欢他。”
        - id: ch04-b07
          speaker: amy
          text: “我明白了。有才艺、举止优雅都很好，可不能拿来卖弄，也不能因此得意。”
        - id: ch04-b08
          speaker: narrator
          text: 艾米说得若有所思。
        - id: ch04-b09
          speaker: mrs_march
          text: “只要一个人谦逊地使用自己的长处，别人自然能从他的举止和谈吐里看见，也能感受到。没有必要特意摆出来。”
        - id: ch04-b10
          speaker: jo
          text: “就像你不能把所有帽子、裙子和缎带一次全穿在身上，只为叫别人知道你都有！”
          emotion: happy
        - id: ch04-b11
          speaker: narrator
          text: 大家一起笑了起来，这场关于谦逊的教导也就在笑声中结束了。
