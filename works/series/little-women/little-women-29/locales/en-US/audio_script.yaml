  chapters:
    - id: ch01
      title: Learning to Keep House
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Like many young wives, Meg began married life determined to be the perfect housekeeper. John would come home to paradise. His wife would always smile, every dinner would be splendid, and no button would ever go missing. She poured so much love, energy, and good cheer into the plan that she could not entirely fail, though obstacles soon appeared. Her paradise was rarely peaceful. Meg worried over every detail and hurried from task to task, burdened by all the cares she had eagerly taken on. Sometimes she was too tired even to smile. After a long course of delicate dishes upset his stomach, John ungratefully begged for plain food. And those buttons kept vanishing. Meg began to wonder where men managed to lose them. Before long, she was threatening to make John sew them on himself and see whether his work stood up any better under clumsy, impatient fingers.
        - id: ch01-b02
          speaker: narrator
          text: They stayed very happy, even after learning that love alone would not pay the bills or cook dinner. Meg looked just as lovely to John from behind the everyday coffee pot. Their morning good-bye still felt romantic, even when his kiss was followed by a practical question.
        - id: ch01-b03
          speaker: john
          text: Should I have them send veal or mutton for dinner, darling?
        - id: ch01-b04
          speaker: narrator
          text: The little house stopped feeling like a decorated love nest and began to feel like a real home. Both of them liked the change. At first, keeping house seemed like a game. Then John settled seriously into his work, with the responsibilities of a family on his shoulders. Meg put away her delicate wrappers, tied on a large apron, and attacked her work with more energy than good judgment.
        - id: ch01-b05
          speaker: narrator
          text: During her passion for cooking, she worked through Mrs. Cornelius's recipe book like a student solving difficult sums. She followed every problem patiently and carefully. When a dish succeeded too generously, the March family was invited over to help eat the feast. When a whole batch failed, Lotty quietly carried it to the Hummel children, who hid the evidence by eating it. An evening spent balancing accounts with John usually cooled Meg's enthusiasm for a while. Then economy took over. John endured bread pudding, hash, and reheated coffee with admirable patience, though the meals tested him sorely. Meg swung between extravagance and thrift before she found a sensible middle course. Along the way, she acquired something most young couples meet sooner or later. It was a family quarrel, and it began in a jelly jar.
    - id: ch02
      title: The Jelly That Would Not Jell
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Meg wanted shelves full of homemade preserves, so she decided to make currant jelly. She asked John to order about a dozen small jars and plenty of sugar. Their currants were ripe, and she meant to preserve the whole crop at once. John believed his wife could do anything. Proud of her skill, he gladly arranged it. Home came four dozen charming little jars, half a barrel of sugar, and a boy to pick the fruit.
        - id: ch02-b02
          speaker: narrator
          text: Meg tucked her pretty hair into a small cap, rolled her sleeves to the elbow, and tied on a checked apron that somehow looked charming in spite of its bib. She began without a doubt. Hadn't she watched Hannah make jelly hundreds of times? Four dozen jars looked rather alarming at first. Then she remembered how much John loved jelly and imagined all those neat little pots arranged on the top shelf. She decided to fill every one. The work consumed the entire day. Meg picked the currants, boiled them, strained them, and hovered anxiously over every batch. She did everything she knew. She asked Mrs. Cornelius's book for advice and searched her memory for some small step Hannah used that she had forgotten. She boiled the mixture again, added more sugar, and strained it once more. Nothing helped. The dreadful stuff remained as liquid as ever. It simply would not jell.
        - id: ch02-b03
          speaker: narrator
          text: She wanted to run straight to her mother for help, apron and all. But she and John had agreed not to trouble other people with their private worries, experiments, or quarrels. They had laughed at the very idea of quarreling, yet they had kept the agreement. Mrs. March approved, and no one interfered when the young pair could manage alone. Through the hot summer day, Meg struggled on by herself. At five o'clock, she sat in the wreck of her kitchen, wrung her sticky hands, and burst into tears.
        - id: ch02-b04
          speaker: narrator
          text: Early in their marriage, Meg had often made John a generous promise.
        - id: ch02-b05
          speaker: meg
          text: You must always feel free to bring a friend home. I'll be ready whenever you do. The house will be neat, dinner will be good, and your guest will find a cheerful welcome. Please don't stop to ask me first, John. Invite anyone you like.
        - id: ch02-b06
          speaker: narrator
          text: John had glowed with pride in such a remarkable wife and felt blessed to have her. Guests had come from time to time, but never without warning. Meg had not yet been tested. Her chance to prove herself arrived on the one day when it could cause the most trouble. Had John remembered the jelly, bringing someone home then would have been nearly unforgivable. But he had forgotten it completely. He remembered only the handsome dinner ordered that morning. He felt sure it would appear at exactly the right time and imagined the charming effect when his pretty wife ran out to welcome them. Delighted with himself as both host and husband, he led his friend Jack Scott toward the Dovecote.
        - id: ch02-b07
          speaker: narrator
          text: At home, disappointment waited. The front door, usually open, was shut and locked. Yesterday's mud remained on the steps. Curtains covered the parlor windows. No pretty wife sat sewing on the porch, and no smiling hostess appeared. The only person in sight was the currant-stained boy, asleep under the bushes.
        - id: ch02-b08
          speaker: john
          text: Something may be wrong. Wait in the garden, Scott, while I find Mrs. Brooke.
        - id: ch02-b09
          speaker: narrator
          text: Alarmed by the silence, John hurried around the house, following the sharp smell of burned sugar. Scott wandered after him with an odd expression. When John vanished into the kitchen, his friend politely stopped at a distance. He was a bachelor, and the scene promised to be interesting. Though he stayed out of the way, he could still see and hear enough to enjoy what followed.
        - id: ch02-b10
          speaker: narrator
          text: The kitchen was full of confusion. One batch of jelly dripped from pot to pot. Another spread across the floor. A third burned merrily on the stove. Lotty calmly ate bread dipped in the liquid currant mixture. Meg sat with her apron over her head, sobbing.
        - id: ch02-b11
          speaker: john
          text: My dear girl, what's happened?
          emotion: fearful
        - id: ch02-b12
          speaker: narrator
          text: John rushed to her, imagining burns or terrible news, while also remembering the guest outside.
        - id: ch02-b13
          speaker: meg
          text: Oh, John, I'm hot and tired and cross and worried! I've worked until I can't do another thing. Please help me, or I shall die!
          emotion: sad
        - id: ch02-b14
          speaker: narrator
          text: She threw herself against him. Her sticky apron made the welcome sweet in a very literal way.
        - id: ch02-b15
          speaker: john
          text: What is it, dear? Has something dreadful happened?
          emotion: fearful
        - id: ch02-b16
          speaker: meg
          text: Yes.
          emotion: sad
        - id: ch02-b17
          speaker: john
          text: Then tell me. Please don't cry. I can face anything better than that.
        - id: ch02-b18
          speaker: meg
          text: The jelly won't set, and I don't know what to do!
          emotion: sad
        - id: ch02-b19
          speaker: narrator
          text: John laughed as he never dared laugh afterward. In the garden, Scott heard him and smiled before he could stop himself. That hearty burst of laughter completed Meg's misery.
        - id: ch02-b20
          speaker: john
          text: Is that all? Throw it out and forget about it. I'll buy all the jelly you want. But please don't cry like this. I've brought Jack Scott home for dinner, and—
        - id: ch02-b21
          speaker: narrator
          text: He got no further. Meg pushed away from him, clasped her hands, and dropped into a chair in angry dismay.
        - id: ch02-b22
          speaker: meg
          text: A guest for dinner, with the whole house like this? John Brooke, how could you?
          emotion: angry
        - id: ch02-b23
          speaker: john
          text: Quiet, he's in the garden. I forgot about the miserable jelly, but he's here now.
        - id: ch02-b24
          speaker: meg
          text: You should have warned me. You should have told me this morning, and remembered how busy I would be.
          emotion: angry
        - id: ch02-b25
          speaker: john
          text: I didn't know this morning. I met him as I left, and there was no time to send word. You always told me I could invite anyone without asking. This was my first try, and it will certainly be my last!
          emotion: angry
        - id: ch02-b26
          speaker: meg
          text: I hope it is. Take him away. I can't meet him, and there is no dinner.
          emotion: angry
        - id: ch02-b27
          speaker: john
          text: No dinner? What happened to the beef and vegetables I sent home? And the pudding you promised?
          emotion: surprised
        - id: ch02-b28
          speaker: meg
          text: I had no time to cook. I planned to eat at Mother's. I'm sorry, but the jelly took the whole day.
          emotion: sad
        - id: ch02-b29
          speaker: narrator
          text: John was usually mild, but he had worked all day and come home tired, hungry, and hopeful. Instead he found a wrecked house, an empty table, and an angry wife. He held his temper, and the storm might still have passed, except for one unlucky word.
        - id: ch02-b30
          speaker: john
          text: I admit we're in trouble, but if you help, we can still manage. Dry your eyes and make some effort, dear. Scott and I are hungry enough to eat anything. Cold meat, bread, and cheese will do. We won't even ask for jelly.
        - id: ch02-b31
          speaker: narrator
          text: John meant the last line as a friendly joke. Meg heard it as mockery. Her final bit of patience disappeared.
        - id: ch02-b32
          speaker: meg
          text: You can get yourself out of this trouble. I'm too exhausted to make an effort for anyone. And bread and cheese for company? I won't serve such a meal in my house. Take Mr. Scott to Mother's. Tell him I'm away, ill, dead, anything you please. I won't see him. You may both laugh at me and my jelly, because there will be nothing else to eat here!
          emotion: angry
        - id: ch02-b33
          speaker: narrator
          text: Meg flung off her apron and hurried upstairs to be miserable in private. She never learned exactly what the two men did. Scott was not taken to Mrs. March's. When Meg came down after they had gone, the remains of a strange, hurried lunch horrified her.
        - id: ch02-b34
          speaker: lotty
          text: They ate very much and laughed very much. The master said to throw out all the sweet stuff and hide the jars.
        - id: ch02-b35
          speaker: narrator
          text: Meg wanted desperately to tell her mother. Shame over her own behavior stopped her, along with loyalty to John. Even if he had been cruel, no one else should hear it from her. She cleaned the kitchen quickly, dressed with care, and sat down to wait for him to return and be forgiven.
    - id: ch03
      title: Calm, Kind, and Firm
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: John did not come home expecting forgiveness. He had treated the disaster as a joke, defended his wife as well as he could, and played host so warmly that Scott enjoyed the makeshift dinner and promised to return. Underneath, John was angry. He had spent the whole meal silently fuming. Meg had deserted him when he needed her. She had repeatedly told him to bring friends home whenever he pleased. The first time he trusted that promise, she had flared up, blamed him, and left him to be laughed at or pitied. It was not fair, and he meant her to understand that.
        - id: ch03-b02
          speaker: narrator
          text: Once Scott had gone and John was walking home alone, his temper cooled. Poor little Meg had worked hard because she wanted to please him. The day had been hard on her too. She was wrong, he decided, but she was young. He must be patient and teach her gently. He hoped she had not gone home to tell the whole story. John hated gossip and interference in private troubles, and the thought briefly stirred his anger again. Then he pictured Meg crying until she made herself ill, and his heart softened. He quickened his pace. He would be calm and kind, but firm, very firm, and point out exactly how she had failed in her duty as a wife.
        - id: ch03-b03
          speaker: narrator
          text: Meg had chosen the very same plan. She wanted to run to meet him, apologize, and be comforted. Pride kept her in her chair. When John appeared, she rocked and sewed in her best parlor as naturally as she could pretend.
        - id: ch03-b04
          speaker: narrator
          text: John had expected to find her in tears. Disappointed, and sure his dignity required her to apologize first, he stretched out on the sofa and offered a remark that had nothing to do with either of them.
        - id: ch03-b05
          speaker: john
          text: It looks as if we'll have a new moon, my dear.
        - id: ch03-b06
          speaker: meg
          text: I have no objection.
        - id: ch03-b07
          speaker: narrator
          text: John tried a few more harmless subjects. Meg put a chill on every one. He moved to one window and hid behind his newspaper. She sat at the other and stitched decorations for slippers as if the work were urgent. Neither spoke. Both looked calm and firm. Both felt thoroughly wretched.
        - id: ch03-b08
          speaker: narrator
          text: Meg began to understand that marriage truly required endless patience as well as love. The thought of Mother brought back advice she had once heard and answered with unbelieving protests. Mrs. March had told her that John was good but not faultless. Meg must learn to see and bear his faults while remembering her own. John could be decisive, but he would not remain stubborn if she reasoned kindly instead of opposing him impatiently. He cared greatly about accuracy and truth. Meg sometimes called that fussiness, but it was a good quality. If she never deceived him in word or expression, he would give her the confidence she deserved and the support she needed. His anger was not a quick March-family flash that ended at once. It was quiet, white anger, rarely stirred but hard to put out once it caught. Their peace and happiness depended on keeping his respect. Most of all, Mother had warned her to apologize first when both were wrong, and to guard against the small hurts, misunderstandings, and hasty words that could pave the way to lasting sorrow and regret.
        - id: ch03-b09
          speaker: narrator
          text: In the evening light, Meg remembered every word. This was their first serious disagreement. Now her angry speeches sounded childish and unkind. She pictured John coming home to that ruined kitchen, and her heart softened. Tears filled her eyes, though he did not see. She put down her sewing and stood, meaning to ask forgiveness. He gave no sign of hearing her. Pride made the short walk across the room feel very long. Beside him, she nearly lost her courage. Then she told herself this was only the beginning. She would do her part and leave herself nothing to regret. Meg bent down and softly kissed his forehead.
        - id: ch03-b10
          speaker: narrator
          text: That settled everything. The sorry little kiss said more than a speech. In a moment, John had drawn her onto his knee.
        - id: ch03-b11
          speaker: john
          text: I was cruel to laugh at those poor jelly jars. Forgive me, dear. I promise I will never do it again.
          emotion: sad
        - id: ch03-b12
          speaker: narrator
          text: He did laugh about them again, hundreds of times, and so did Meg. They always declared it the sweetest jelly she ever made, because that family jar had preserved the peace between them.
        - id: ch03-b13
          speaker: narrator
          text: Later, Meg invited Mr. Scott to dinner properly. She served a delightful meal, with no exhausted wife as the first course. She was so cheerful and gracious, and everything went so smoothly, that Scott told John he was a lucky man. He went home shaking his head over the hardships of being a bachelor.
    - id: ch04
      title: The Violet Silk
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Autumn brought Meg a different kind of trouble. Sallie Moffat renewed their friendship. She often came to the little house for gossip or invited her poor dear Meg to spend the day in the grand Moffat home. Meg enjoyed the visits. On gloomy days she was lonely. Her family was busy, John stayed away until evening, and she had little to do beyond sewing, reading, and tending the house. Soon she was going out and gossiping with Sallie often.
        - id: ch04-b02
          speaker: narrator
          text: Sallie's lovely possessions made Meg want lovely things too. Worse, they made her pity herself for having so few. Sallie kindly offered her little gifts, but Meg refused because John would dislike it. Then she did something he disliked even more.
        - id: ch04-b03
          speaker: narrator
          text: Meg knew exactly what John earned. She treasured the trust he placed in her, both with his happiness and with something many men seemed to value even more, his money. She knew where it was kept and could take what she needed. He asked only that she record every penny, pay the bills each month, and remember that she was a poor man's wife. Until then, she had managed well. She had been careful and exact. Her little account books were always neat, and every month she showed them to John without fear.
        - id: ch04-b04
          speaker: narrator
          text: But that autumn, temptation entered Meg's little paradise in the form of dresses instead of apples. She hated Sallie's pity and hated being made to feel poor, though she was ashamed to admit it. Now and then she comforted herself by buying something pretty. Then Sallie would not think she always had to save. Each purchase made Meg feel guilty because the charming little objects were rarely things she truly needed. Still, every item seemed to cost so little that worrying about it felt foolish. One small expense followed another without attracting much notice. On their shopping trips, Meg slowly changed from someone who only looked into someone who bought.
        - id: ch04-b05
          speaker: narrator
          text: The small things cost far more than she expected. Her total at the end of the month frightened her. John was too busy to examine the bills that month and away the next. In the third month, he prepared for a full quarterly reckoning. By then, Meg had done something she could not forget.
        - id: ch04-b06
          speaker: narrator
          text: Only a few days before John opened the quarterly accounts, Sallie had been shopping for silk. Meg longed for a new dress of her own, just one handsome, light-colored gown for parties. Her old black silk looked so ordinary beside Sallie's clothes. The thin evening dresses Meg had worn before marriage seemed proper only for girls now. Aunt March usually gave each sister twenty-five dollars at New Year's, and New Year's was only a month away. Here lay beautiful violet silk at a bargain. Meg had access to the money if she dared use it. John often said that everything of his belonged to her too. But would he think it right if she spent not only the expected gift, but another twenty-five dollars from the household fund? Meg knew that was the real question.
        - id: ch04-b07
          speaker: narrator
          text: Sallie urged her to buy it and even offered a loan. With the kindest intentions, she tempted Meg past her strength. The shopman lifted the shining folds.
        - id: ch04-b08
          speaker: shopman
          text: You won't find another price like this, ma'am.
        - id: ch04-b09
          speaker: meg
          text: I'll take it.
        - id: ch04-b10
          speaker: narrator
          text: The shopman cut the silk, and Meg paid for it. Sallie rejoiced over her friend's purchase. Meg laughed with her and acted as if fifty dollars were nothing at all. Yet the moment they drove away, the laughter felt false. Meg could not escape the feeling that she had taken something that was not hers to spend. She sat with the uneasy sense of a thief who expected the police to come racing up behind the carriage.
        - id: ch04-b11
          speaker: narrator
          text: At home, she spread out the silk to quiet her conscience. It had lost some of its silvery beauty. The color did not suit her as well as she had imagined, and every length seemed patterned with the words fifty dollars. She put it away, but it haunted her like the ghost of a foolish choice.
        - id: ch04-b12
          speaker: narrator
          text: That night, John opened his account books, and Meg's heart sank. For the first time, she was afraid of her husband. His kind brown eyes suddenly seemed capable of sternness. Though he was unusually cheerful, she imagined he already knew and was hiding it. The household bills were paid, and all the regular accounts were correct. John praised her and began to open the old wallet they called the bank. Meg knew it was empty, so she caught his hand.
        - id: ch04-b13
          speaker: meg
          text: You haven't looked at my personal expense book.
        - id: ch04-b14
          speaker: narrator
          text: John never demanded to see that private book, but Meg usually insisted. She enjoyed his amazement at the mysterious things women needed. He would make her guess what piping meant, fiercely demand an explanation of a hug-me-tight, or stare at an entry for a bonnet. How, he wondered, could three rosebuds, a scrap of velvet, and two strings possibly become a hat worth six dollars? Tonight he looked ready to tease her figures in the usual way and pretend to be horrified by her spending. He was especially proud of his careful wife, which made the secret waiting in the book even harder to reveal.
        - id: ch04-b15
          speaker: narrator
          text: Meg slowly placed the little book before him. Then she stood behind his chair and pretended to smooth the lines from his tired forehead. Her panic grew as she spoke.
        - id: ch04-b16
          speaker: meg
          text: John, I'm ashamed to show you. I've spent far too much lately. When I go out, I feel as if I need things. Sallie advised me to buy this one, so I did. My New Year's money will cover part of it. I regretted it afterward because I knew you would think it was wrong.
          emotion: fearful
        - id: ch04-b17
          speaker: narrator
          text: John laughed and pulled her around beside him.
        - id: ch04-b18
          speaker: john
          text: Don't hide back there. I won't beat you for buying a pair of dangerous new boots. I'm rather proud of my wife's feet, and I don't mind eight or nine dollars if the boots are good.
        - id: ch04-b19
          speaker: narrator
          text: Boots had been one of her recent little purchases, and his eye had found the entry. Meg shivered, wondering what he would say when he reached the terrible fifty dollars.
        - id: ch04-b20
          speaker: meg
          text: It's much worse than boots. I bought silk for a dress.
        - id: ch04-b21
          speaker: narrator
          text: Desperation made her voice strangely steady. She wanted the worst over.
        - id: ch04-b22
          speaker: john
          text: Well, dear, what is the grand total?
        - id: ch04-b23
          speaker: narrator
          text: His joking tone did not sound natural. Meg knew he was looking up with the open, direct gaze she had always been ready to meet with equal honesty. This time she could not. She turned both the page and her face away, then pointed to the sum. Even without the silk, the total would have been bad enough. With fifty dollars added, the figure appalled her. For a full minute the room was very still. When John finally spoke, Meg could hear the control in his voice. Each calm word seemed to cost him an effort because he was determined not to show displeasure.
        - id: ch04-b24
          speaker: john
          text: I suppose fifty dollars isn't too much for a dress once you add all the trimming and other things it needs.
        - id: ch04-b25
          speaker: meg
          text: It isn't made yet, and there are no trimmings.
          emotion: sad
        - id: ch04-b26
          speaker: narrator
          text: The thought of still more expense nearly overwhelmed her.
        - id: ch04-b27
          speaker: john
          text: Twenty-five yards sounds like a great deal for one small woman. Still, I'm sure my wife will look every bit as fine as Ned Moffat's wife when she wears it.
        - id: ch04-b28
          speaker: narrator
          text: His voice was dry now.
        - id: ch04-b29
          speaker: meg
          text: I know you're angry, John. I never meant to waste your money, and I didn't realize the little expenses would grow so large. But Sallie buys whatever she wants, and then she pities me because I can't. I try to be satisfied. It is hard. I'm tired of being poor.
          emotion: sad
        - id: ch04-b30
          speaker: narrator
          text: Meg said the final words so quietly that she hoped he had missed them. He had not. They hurt him deeply, because he had denied himself many pleasures for her sake. Meg regretted the sentence the instant it left her mouth. She would have taken it back at any cost. John pushed away the books and stood. There was no lecture and no display of temper. Only a slight tremble in his voice showed how badly she had wounded him.
        - id: ch04-b31
          speaker: john
          text: I was afraid this would happen. Meg, I do my best.
          emotion: sad
        - id: ch04-b32
          speaker: narrator
          text: Anger would have hurt less than those few words. Meg ran to him and held him tightly.
        - id: ch04-b33
          speaker: meg
          text: Oh, John, my dear, kind, hardworking boy! I didn't mean it. It was cruel and untrue and ungrateful. How could I say such a thing?
          emotion: sad
    - id: ch05
      title: The Greatcoat
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: John was very kind. He forgave Meg readily and never spoke one word of blame. That almost made the pain worse. She knew neither of them would soon forget what she had done and said, even if he never mentioned it again. She had promised to love him through better and worse. Yet she, his wife, had blamed him for being poor after carelessly spending the money he worked to earn. To Meg, it felt dreadful.
        - id: ch05-b02
          speaker: narrator
          text: Afterward, John behaved quietly, almost as if nothing had happened. That silence made Meg's remorse harder to bear. The only visible difference was that he stayed later in town and worked at night after she had gone away to cry herself to sleep. A whole week of guilt nearly made her ill. Then she discovered that John had canceled the order for the new greatcoat he needed. When she asked in surprise why he had changed his mind, he gave her only one simple answer.
        - id: ch05-b03
          speaker: john
          text: I can't afford it, my dear.
        - id: ch05-b04
          speaker: narrator
          text: Meg asked no more questions. A few minutes later, John found her in the hall with her face buried in his old coat, crying as though her heart would break.
        - id: ch05-b05
          speaker: narrator
          text: They talked for a long time that night. Meg came to love John more because he had known poverty. Struggling against it had helped make him a man. It had given him strength and courage to fight his own way through life. It had also taught him a tender patience. With that patience, he could understand and comfort the natural longings and failures of the people he loved.
        - id: ch05-b06
          speaker: narrator
          text: The next day, Meg swallowed her pride. She went to Sallie, told her the truth, and asked her to buy the violet silk. Kindhearted Sallie agreed. She was thoughtful enough not to turn around and give it back as a present.
        - id: ch05-b07
          speaker: narrator
          text: Then Meg ordered the greatcoat sent home after all. When John arrived, she put it on herself and asked how he liked her new silk gown. His answer was easy to imagine. So was the way he received his gift and the happiness that followed. The painful silence between them was gone. John began coming home early. Meg stopped wandering off with Sallie and no longer filled her empty hours by comparing her life with someone else's. Each morning, a very happy husband put on that greatcoat. Each night, a deeply devoted wife helped him take it off.
        - id: ch05-b08
          speaker: narrator
          text: The year moved on. At midsummer, Meg entered a new experience, the deepest and most tender of her life.
    - id: ch06
      title: Daisy and Demi
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: One Saturday, Laurie slipped into the Dovecote kitchen with excitement all over his face. Hannah greeted him with a crash like cymbals, clapping a saucepan in one hand against its lid in the other.
        - id: ch06-b02
          speaker: laurie
          text: How is the little mother? Where is everybody? Why didn't anyone tell me before I came home?
        - id: ch06-b03
          speaker: narrator
          text: He spoke in a loud whisper.
        - id: ch06-b04
          speaker: hannah
          text: Happy as a queen, bless her! Every one of them is upstairs admiring. We didn't need any hurricanes rushing in. You go wait in the parlor, and I'll send them down.
          emotion: happy
        - id: ch06-b05
          speaker: narrator
          text: Hannah disappeared, chuckling with delight. Soon Jo came in carrying a flannel bundle on a large pillow. Her face was very serious, but her eyes sparkled, and her voice held back some strong feeling.
        - id: ch06-b06
          speaker: jo
          text: Close your eyes and put out your arms.
        - id: ch06-b07
          speaker: narrator
          text: Laurie backed quickly into a corner and hid his hands behind him.
        - id: ch06-b08
          speaker: laurie
          text: No, thank you. I'd rather not. I'll drop it or crush it. I know I will.
        - id: ch06-b09
          speaker: jo
          text: Then you don't get to see your nephew.
        - id: ch06-b10
          speaker: narrator
          text: Jo turned as if she meant to leave.
        - id: ch06-b11
          speaker: laurie
          text: Wait, I will! But if anything happens, you're responsible.
        - id: ch06-b12
          speaker: narrator
          text: Laurie bravely shut his eyes while Jo arranged something in his waiting arms. A sudden burst of laughter came from Jo, Amy, Mrs. March, Hannah, and John. Laurie opened his eyes at once. Instead of the single nephew he expected, he had been entrusted with two babies. Both lay there perfectly unaware of the alarm they had caused him.
        - id: ch06-b13
          speaker: narrator
          text: His expression would have made the most solemn person laugh. Laurie stared wildly from the innocent babies to the delighted family. Jo dropped onto the floor, laughing aloud.
        - id: ch06-b14
          speaker: laurie
          text: Twins! Good heavens! Someone take them, quick. I'm about to laugh, and I'll drop them both.
          emotion: surprised
        - id: ch06-b15
          speaker: narrator
          text: Jo rescued the babies and marched around with one on each arm as if she had cared for twins all her life. Laurie laughed until tears ran down his face.
        - id: ch06-b16
          speaker: jo
          text: Isn't it the best surprise of the year? I refused to tell you because I wanted this moment. I think I managed it rather well.
          emotion: happy
        - id: ch06-b17
          speaker: laurie
          text: I've never been so astonished. But isn't it wonderful? Are they both boys? What will you call them? Let me look again. You'll have to hold me up, Jo. Two babies are one too many for me.
          emotion: surprised
        - id: ch06-b18
          speaker: narrator
          text: He studied them like a large, friendly Newfoundland dog examining two tiny kittens.
        - id: ch06-b19
          speaker: john
          text: One is a boy and one is a girl. Aren't they beautiful?
          emotion: happy
        - id: ch06-b20
          speaker: narrator
          text: The proud father beamed at the small red, wriggling babies. To John, they looked not like ordinary newborns at all, but like two perfect little angels who had not yet grown their wings.
        - id: ch06-b21
          speaker: laurie
          text: The most extraordinary children I've ever seen. Which one is which?
        - id: ch06-b22
          speaker: narrator
          text: Laurie bent low to inspect them.
        - id: ch06-b23
          speaker: jo
          text: Amy tied blue ribbon on the boy and pink on the girl, the French way, so we can always tell. One has blue eyes and the other has brown. Now kiss them, Uncle Teddy.
        - id: ch06-b24
          speaker: laurie
          text: I'm not sure they'd like that.
        - id: ch06-b25
          speaker: jo
          text: Of course they will. They're used to kisses already. Do it this instant, sir!
        - id: ch06-b26
          speaker: narrator
          text: Jo feared he might ask someone else to do it for him. Laurie made a face, then gave each soft cheek a cautious peck. Everyone laughed again, and the babies squealed.
        - id: ch06-b27
          speaker: laurie
          text: There, I knew they wouldn't like it. Look at the boy kick! He can already use those fists properly. Here now, young Brooke, pick a quarrel with someone your own size, will you?
          emotion: happy
        - id: ch06-b28
          speaker: narrator
          text: A tiny wandering fist poked Laurie in the face, to his delight.
        - id: ch06-b29
          speaker: amy
          text: The boy will be John Laurence, and the girl will be Margaret, after Mother and Grandmother. We'll call her Daisy so there won't be two Megs in the family. I suppose the little man will be Jack, unless someone can think of a better name for him.
        - id: ch06-b30
          speaker: laurie
          text: Call him Demijohn, and shorten it to Demi.
        - id: ch06-b31
          speaker: jo
          text: Daisy and Demi! That's exactly right. I knew Teddy would solve it.
          emotion: happy
        - id: ch06-b32
          speaker: narrator
          text: Teddy had solved it. From that moment to the end of the chapter, the babies were Daisy and Demi.
