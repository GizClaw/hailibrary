  chapters:
    - id: ch01
      title: 第二十八章　家庭生活的经验
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 梅格和许多年轻主妇一样，一结婚就立志做个模范管家。她要让约翰觉得家里就是天堂，每天有笑脸，有好饭菜，衣服上永远不缺纽扣。她带着满心的爱、干劲和快乐去做，遇到一些阻碍也不肯认输。只是这个天堂一点也不安静。这个小妇人忙前忙后，急着事事讨丈夫欢喜，整天像《圣经》里为许多事务烦扰的马大那样操心。有时她累得连笑都笑不动。精致菜肴接连吃下来，约翰的胃反倒不舒服，还不领情地只想要家常饭。至于纽扣，梅格很快就开始纳闷，它们到底都跑去了哪里。她一面埋怨男人粗心，一面威胁约翰，要他亲手缝一回，看看那双笨拙急躁的手，能不能让针脚更经得住折腾。
        - id: ch01-b02
          speaker: narrator
          text: 两人发现日子不能只靠爱情来过，依旧十分幸福。隔着那只天天见面的咖啡壶，梅格容光焕发地朝约翰微笑，她的美貌在他眼里一点也没变。每天分别时，他先吻吻妻子，再温柔地问晚饭要送小牛肉还是羊肉，这也没有损掉半点浪漫。小房子不再是那座罩着金光、专供恋人栖息的花亭，却真正成了家。年轻夫妻很快觉得，这样的变化反而更好。起初，他们把操持家务当游戏，像孩子一样玩闹。后来约翰安下心认真工作，感到一家之主的担子已经落上肩头。梅格也收起细薄的家常晨衣，系上大围裙，拿出远胜于经验的劲头干起来。
        - id: ch01-b03
          speaker: narrator
          text: 烹饪热还没退时，梅格把科尼利厄斯太太的《食谱》当成数学练习，一道题一道题耐心演算。成功的菜做得太多，就请娘家人来帮忙吃掉这顿丰盛宴席。失败得不能见人，就让洛蒂偷偷送给小胡梅尔们，用那些孩子方便的肚子藏得无影无踪。晚上和约翰摊开账本，通常能让她的烹饪热暂时降温。紧接着又会刮起一阵节俭风。可怜的约翰只好轮番吃面包布丁、碎肉杂烩和热过的咖啡。这些食物实在考验人的心灵，他却带着值得称赞的坚忍熬了过去。可在梅格找到不奢不俭的分寸以前，这个家先添了一件年轻夫妻很难永远避开的东西，一场夫妻口角。
        - id: ch01-b04
          speaker: narrator
          text: 梅格想在储藏室摆满亲手做的果酱，便决定熬红醋栗果冻。自家的果子熟了，她请约翰订一打小罐，再多买些糖。约翰坚信“我妻子”什么都会，也以她的本事为荣，一心要让她满意。结果送来的不是一打，而是四打小罐，外加半桶糖和一个摘果子的小男孩。梅格把头发塞进小帽子，挽起袖子，系上俏丽的格子围裙，信心十足地开工。汉娜做这个，她看过几百次呢。
        - id: ch01-b05
          speaker: narrator
          text: 那排罐子起初让她有些吃惊。可约翰那么爱吃果冻，漂亮罐子摆满顶层架子又一定好看，她就决心全装满。整整一天，她摘果、煮果、滤汁，围着那批果冻忙个不停。她已经尽了全力，还专门请教科尼利厄斯太太。她绞尽脑汁回想汉娜每一个动作，想找出自己漏掉的步骤。她把果汁又煮一遍，又添一次糖，再过滤一次。可是无论怎么折腾，那批可恶的甜东西就是不肯“凝成冻”。
        - id: ch01-b06
          speaker: narrator
          text: 她真想围兜也不解，直接跑回娘家请母亲帮忙。可她和约翰约好，不拿夫妻间的烦恼、尝试和争执去打扰别人。当初说到“争执”，两个人还笑它绝不可能发生。这个主意原是马奇太太给的，所以只要自己还能应付，他们就不求援，家人也不插手。于是那个炎热的夏日，梅格独自和不听话的果冻斗到五点。最后，她坐在乱成一团的厨房里，绞着满是黏汁的手，放声哭了起来。
        - id: ch01-b07
          speaker: narrator
          text: 新婚之初，梅格常向约翰许下一个动人的保证。
        - id: ch01-b08
          speaker: meg
          text: 你什么时候想带朋友回家，都只管带来。我会一直准备好。屋里不会乱，也不会有人发脾气，客人只会看见整洁的家、快活的妻子和一顿好饭。亲爱的，千万别先来问我。请谁都可以，我一定欢迎。
        - id: ch01-b09
          speaker: narrator
          text: 约翰听得满脸放光，觉得有这么出众的妻子真是福气。家里后来也来过客人，可从没有谁不请自来，所以梅格一直没机会大显身手。直到这一天。人生偏爱这样安排，仿佛有一种逃不掉的命数，人只能惊叹、叹息，再尽力承受。
        - id: ch01-b10
          speaker: narrator
          text: 要是约翰还记得果冻，他偏选这一天临时带人回家，就真该怪他了。可他早把这事忘得干净，只记得早晨订下了一顿丰盛晚餐。他认定饭菜会准时摆好，还一路想象漂亮妻子跑来迎接时，那幅画面会多么迷人。就这样，年轻的主人兼丈夫满心得意，领着朋友走向自己的府邸。
        - id: ch01-b11
          speaker: narrator
          text: 到了鸽舍，约翰才发现这是个充满失望的世界。平日殷勤敞开的前门不但关着，还上了锁，昨天的泥仍装点着台阶。客厅窗户紧闭，窗帘也拉了起来。阳台上没有穿白衣的美丽妻子坐着缝纫，头发上也看不见那只让人心神不宁的小蝴蝶结。门边更没有一位眼睛明亮的女主人含羞微笑，向客人道声欢迎。诸如此类的画面一样也没有。除了红醋栗丛下睡着一个模样像刚干过血腥勾当的小男孩，连个人影也瞧不见。
        - id: ch01-b12
          speaker: john
          text: 恐怕出了事。斯科特，你先到花园里坐坐，我去找布鲁克太太。
        - id: ch01-b13
          speaker: narrator
          text: 一股烧焦砂糖的刺鼻气味领着约翰匆匆绕到屋后。斯科特先生带着古怪的神色，慢悠悠跟在后面。等约翰一头钻进屋里，他便很识趣地停在远处，没有贸然走近。不过里面发生的事，他既看得见，也听得清。这位单身汉对接下来那场热闹兴味十足。
        - id: ch01-b14
          speaker: narrator
          text: 厨房里只剩混乱和绝望。一种做法的果冻正从这个罐子淌进那个罐子，另一种摊在地板上，第三种还在炉上快活地烧焦。洛蒂带着日耳曼人特有的沉着，安安静静坐着吃面包、喝红醋栗汁。果冻毕竟还是稀得没救，当饮料倒很合适。布鲁克太太则用围裙蒙着头，坐在那里哭得凄凄惨惨。
        - id: ch01-b15
          speaker: john
          text: 我最亲爱的姑娘，究竟怎么了？
        - id: ch01-b16
          speaker: narrator
          text: 约翰冲进厨房，脑中闪过烫伤的手和突然的噩耗，又暗暗想到花园里还有客人在等。
        - id: ch01-b17
          speaker: meg
          text: 约翰，我又累又热，又生气又着急！我一直忙到现在，整个人都垮了。快帮帮我，不然我真要死了！
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: 筋疲力尽的梅格扑进丈夫怀里，给了他一个满是甜味的欢迎。她的围兜和地板一样，都让果汁彻底洗过了。
        - id: ch01-b19
          speaker: john
          text: 什么事把你愁成这样？真的出了大事吗？
        - id: ch01-b20
          speaker: narrator
          text: 约翰焦急地吻吻她歪掉的小帽子。
        - id: ch01-b21
          speaker: meg
          text: 是的。
          emotion: sad
        - id: ch01-b22
          speaker: john
          text: 那就快说。别哭了，无论出了什么事，我都受得住，可我受不了你哭。说吧，亲爱的。
        - id: ch01-b23
          speaker: meg
          text: 果……果冻怎么也凝不起来，我不知道该怎么办！
          emotion: sad
        - id: ch01-b24
          speaker: narrator
          text: 约翰·布鲁克顿时放声大笑，笑得比任何时候都痛快，从此以后却再不敢这样笑。斯科特听见了，也忍不住微笑。这最后一下，终于把可怜的梅格彻底压垮。
        - id: ch01-b25
          speaker: john
          text: 就为这个？把它倒出窗外，别再管了。你要多少，我给你买多少夸脱。可看在老天的分上，别哭成这样。我带杰克·斯科特回来吃晚饭，而且……
        - id: ch01-b26
          speaker: narrator
          text: 梅格猛地推开他，双手一合，像悲剧里的女主角那样跌坐进椅子，愤怒、责怪又惊慌地叫起来。
        - id: ch01-b27
          speaker: meg
          text: 你带了一个男人回来吃饭，家里却乱成这样！约翰·布鲁克，你怎么能这么做？
          emotion: angry
        - id: ch01-b28
          speaker: john
          text: 小声点，他就在花园里！我把那该死的果冻忘了，现在也没办法。
        - id: ch01-b29
          speaker: meg
          text: 你应该先送信来，或者早晨就告诉我。你明明该记得我今天有多忙。
          emotion: angry
        - id: ch01-b30
          speaker: narrator
          text: 梅格越说越气。再恩爱的斑鸠，羽毛被惹乱了也会啄人。
        - id: ch01-b31
          speaker: john
          text: 我早晨根本不知道。出门时碰见他，已经来不及送信。你总叫我随意带朋友回来，我哪想到还要先请示？这才头一回照你的话做。该死，我以后要是再做才怪！
          emotion: angry
        - id: ch01-b32
          speaker: meg
          text: 最好永远别再做！马上带他走。我不能见客，家里也没有晚饭。
        - id: ch01-b33
          speaker: john
          text: 这算什么话？我让人送来的牛肉和蔬菜呢？你答应做的布丁呢？
        - id: ch01-b34
          speaker: narrator
          text: 约翰说着冲向食品柜。
        - id: ch01-b35
          speaker: meg
          text: 我没时间做。我本来想去妈妈家吃饭。对不起，可我实在忙不过来。
          emotion: sad
        - id: ch01-b36
          speaker: narrator
          text: 梅格又哭了。约翰脾气温和，可他毕竟也是人。辛苦一天后，他又累又饿，满怀期待地回家，看到的却是乱屋子、空饭桌和生气的妻子。这很难让人保持平静。他已经竭力忍住，这阵小风波原本也快过去了，偏偏一个不走运的词又惹出了事。
        - id: ch01-b37
          speaker: john
          text: 我承认，这下挺难办。可你来帮把手，我们还是能应付。别哭了，亲爱的，打起点精神，随便给我们弄些吃的。我俩饿得像猎人，吃什么都行。冷肉、面包、奶酪就够了。我们不会要果冻。
        - id: ch01-b38
          speaker: narrator
          text: 他原想开个好心的玩笑，可“果冻”两个字断送了自己。梅格觉得他竟拿她伤心的失败说笑，实在残忍，最后一点耐心也没了。
        - id: ch01-b39
          speaker: meg
          text: 这个难处你自己解决吧。我已经累垮了，没法替任何人“打起精神”。男人招待客人，就只想得到一块骨头和粗俗的面包奶酪。我家绝不摆这些。把斯科特带到妈妈家，说我出门了、病了、死了，随你怎么说。我不见他。你们只管笑我和我的果冻，这里反正没有别的东西给你们吃！
          emotion: angry
        - id: ch01-b40
          speaker: narrator
          text: 梅格一口气说完，扯掉围兜，匆匆退出战场，回房里伤心去了。她一直不知道那两个家伙后来究竟做了什么。斯科特没有被送去妈妈家。等他们吃完又出去散步，梅格下楼，看见一顿乱七八糟的午餐留下的痕迹，吓得不轻。
        - id: ch01-b41
          speaker: lotty
          text: 他们吃了好多，也笑了好多。老爷叫我把甜东西全倒掉，再把罐子藏起来。
        - id: ch01-b42
          speaker: narrator
          text: 梅格很想跑回娘家，把一切都告诉母亲。可想到自己的过错，她又觉得羞愧。她也觉得应该忠于约翰。他也许很残忍，但别人绝不能知道。这个念头终于拦住了她。梅格草草收拾完厨房，仔细换上漂亮衣裳，然后坐下来等约翰回来，好让自己宽宏大量地原谅他。
        - id: ch01-b43
          speaker: narrator
          text: 可约翰并没有回来，因为他对这件事的看法完全不同。他当着斯科特的面把意外说成一场好笑的插曲，又尽力替小妻子解释。他这个主人做得十分殷勤，斯科特很喜欢那顿临时拼出的晚餐，还答应以后再来。约翰脸上不露声色，心里却很气。他觉得自己最需要帮助的时候，梅格偏偏丢下了他，让他独自留在那里，等着被人取笑或怜悯。
        - id: ch01-b44
          speaker: john
          text: 明明叫我随时带朋友回家，真等我照做，她却发火责怪，还把我扔在困境里，让人笑话或者可怜。这不公平，老天作证，一点也不公平。梅格必须明白。
        - id: ch01-b45
          speaker: narrator
          text: 吃饭时，约翰一直暗自恼火。送走斯科特，慢慢往家走时，他的心气才软下来。
        - id: ch01-b46
          speaker: john
          text: 可怜的小东西。她那么用心地想让我高兴，今天确实太难为她了。她当然有错，可她还年轻。我得耐心些，好好教她。
        - id: ch01-b47
          speaker: narrator
          text: 他只盼梅格没有回娘家，因为他最讨厌闲话和外人干涉。想到这里，他又恼了一阵。可一怕梅格哭坏身子，心便软了，脚步也快起来。他决定对妻子平静、和善，却必须坚定，十分坚定，好让她看清自己哪里没有尽到责任。
        - id: ch01-b48
          speaker: narrator
          text: 梅格也打定主意，要“平静、和善，却十分坚定”，让约翰认清他的责任。她多想跑出去迎接丈夫，当面请他原谅，再让他亲亲自己、好好安慰自己。她确信只要这样做，自己一定会得到想要的一切。可她当然偏不肯。看见约翰走来，她赶紧坐在最体面的客厅里，一边摇着椅子做针线，一边若无其事地哼起歌来，活像一位穿戴整齐、闲得没有事情可做的贵妇。
        - id: ch01-b49
          speaker: narrator
          text: 约翰原以为会见到一位泪流满面的温柔尼俄伯，没见着，不免失望。可他觉得尊严要求梅格先道歉，于是慢悠悠进来，往沙发上一躺，说了一句和眼前情形格外相干的话。
        - id: ch01-b50
          speaker: john
          text: 亲爱的，快要有新月了。
        - id: ch01-b51
          speaker: meg
          text: 我不反对。
        - id: ch01-b52
          speaker: narrator
          text: 约翰又找了几个人人关心的话题，梅格句句泼冷水，谈话很快没了气息。他走到一边窗前，展开报纸，仿佛把自己裹了进去。梅格走到另一边，拼命缝拖鞋上的花饰，好像那是人生必需。谁也不开口。两个人看着都很平静、很坚定，心里却难受透了。
        - id: ch01-b53
          speaker: meg
          text: 婚姻生活真不容易。妈妈说得对，光有爱情不够，还得有无穷的耐心。
        - id: ch01-b54
          speaker: narrator
          text: 一想到母亲，梅格便记起从前那些自己不肯相信的劝告。
        - id: ch01-b55
          speaker: mrs_march
          text: 约翰是好人，却也有缺点。你要看得见，也要学会包容，同时别忘了自己的缺点。他很有主见，可只要你好好讲道理，不急着顶撞，他不会固执。他认真，又格外看重事实。你叫这“吹毛求疵”，其实是好品性。梅格，别用神情或言语骗他。他会给你应得的信任，也会在你需要时支持你。
        - id: ch01-b56
          speaker: mrs_march
          text: 他也有脾气，却不像我们，猛地一闪就过去。他的怒气安静得发白，平常很少点燃，一旦烧起来却难扑灭。千万当心，别让他把怒火对着你。你们的安宁和幸福，要靠你守住他的尊重。管住自己。两个人都有错时，你先道歉。也要提防小怨气、误会和脱口而出的气话，它们常会一步步通向苦涩的悲伤和悔恨。
        - id: ch01-b57
          speaker: narrator
          text: 落日里，梅格一边缝衣，一边想起母亲的这些话，尤其是最后几句。这是夫妻俩第一次真正闹别扭。如今把自己气头上的话重新想一遍，她只觉得那些话既傻又刻薄，方才那股怒气也像孩子发脾气。再想到可怜的约翰辛苦回家，迎面却撞上那样一幕，她的心彻底软了。梅格眼里含着泪，悄悄看了他一眼，可他没有瞧见。她终于放下针线站起来，心里想，我要先说“原谅我”。可约翰仿佛连她起身的声音也没听见。
        - id: ch01-b58
          speaker: narrator
          text: 骄傲实在很难咽下去。梅格一步一步，极慢地穿过房间，站到丈夫身边。约翰仍旧不肯转过头来。那一刻，她觉得自己真的做不到了。可紧接着，她又提醒自己，这只是个开始。无论约翰怎样，她都要先尽自己的本分，这样才不会留下可责备的地方。于是梅格低下身，轻轻吻了吻丈夫的额头。事情当然立刻解决。这个带着悔意的吻胜过千言万语。一眨眼，约翰已经把她抱到膝上，温柔地开了口。
        - id: ch01-b59
          speaker: john
          text: 我不该笑那些可怜的小果冻罐。原谅我，亲爱的。我保证以后再也不笑了。
        - id: ch01-b60
          speaker: narrator
          text: 可他以后还是笑了。愿上天保佑他，事实正是如此。他足足笑过几百回，梅格自己也一样。后来每次说起这场乱子，两人都坚持说，那是他们亲手做过最甜的果冻。因为那只惹出家庭口角的小小果酱罐，到头来反倒保住了这个小家庭的和睦。
        - id: ch01-b61
          speaker: narrator
          text: 这场风波过后，梅格特地请斯科特先生来吃晚饭。这回她摆出了一桌令人愉快的宴席，头一道菜里也没有一位被烹饪折磨得熟透了的妻子。那天梅格格外快活，待客也亲切周到，样样事情都进行得顺顺当当。斯科特忍不住对约翰说，他真是个有福气的人。等客人踏上回家的路，他还一路摇头，认真感叹单身汉的日子实在太艰苦。
        - id: ch01-b62
          speaker: narrator
          text: 到了秋天，梅格又遇到新的考验，也得到新的经验。萨莉·莫法特重新和她亲密起来，常跑到小房子里，和朋友享用一碟闲话。她也会请“那个可怜的亲爱的”去大宅子消磨一整天。这些来往确实很愉快。天气阴沉时，梅格常感到寂寞。娘家人各有各的事，约翰要到夜里才回来，她除了缝纫、读书，或者在屋里零敲碎打地忙一点，没有多少事情可做。于是，她很自然地养成了和朋友闲逛聊天的习惯。看见萨莉那些漂亮东西，她也渴望拥有，还会因为自己没有而暗暗自怜。
        - id: ch01-b63
          speaker: narrator
          text: 萨莉好心，常要送她那些眼馋的小玩意。梅格知道约翰不喜欢，总会拒绝。可随后，这个糊涂的小妇人却做了件丈夫更不喜欢的事。她知道约翰挣多少钱，也喜欢丈夫把幸福和钱都交给自己掌管。钱放在哪儿，她全知道，想取多少也可以。约翰只要求她记清每一分钱，每月付账，也别忘了自己嫁的是个穷人。
        - id: ch01-b64
          speaker: narrator
          text: 过去她一直做得很好，花钱谨慎，记账准确，小账本也收拾得整整齐齐，每个月都能问心无愧地拿给丈夫看。可那年秋天，蛇钻进了梅格的天堂。它像诱惑许多现代夏娃那样来诱惑她，拿来的不是苹果，而是衣裳。梅格讨厌别人可怜自己，故意让她觉得自己贫穷，可这股恼怒又叫她羞于承认。她偶尔买件漂亮东西安慰自己，也免得萨莉以为她不得不处处省钱。买完以后，她总觉得自己做了坏事，因为那些东西很少真正需要。可每件只花一点，好像不值得担心。不知不觉，小玩意越积越多。再和萨莉去逛商店，她已经不只是站在旁边看了。
        - id: ch01-b65
          speaker: narrator
          text: 这些小东西各自看着不起眼，加起来却比谁想象的都贵。月底一算，总数把梅格吓了一跳。那个月约翰太忙，账单全留给她处理。下个月他又出了门。到了第三个月，他要把整个季度的收支认真结算一遍，梅格一辈子也忘不了那一天。就在几天前，她做了一件自己看来十分可怕的事。从那以后，这件事一直压在良心上，让她片刻也不能轻松。
        - id: ch01-b66
          speaker: narrator
          text: 萨莉在买丝绸，梅格也想添一件漂亮的浅色礼服，参加聚会时穿。黑绸衣太普通，轻薄晚装又只适合姑娘。马奇姑婆每逢新年通常会送姐妹们每人二十五美元，再等一个月就到了。眼前偏有一匹美丽的紫罗兰色丝绸在减价，只要她敢伸手，钱也在那里。约翰总说，他的就是她的。可除了尚未到手的二十五美元，她还得从家用拿出二十五。这能算对吗？
        - id: ch01-b67
          speaker: narrator
          text: 萨莉劝她买，还肯借钱。她的用心很好，却把梅格诱惑得再也撑不住。那一刻，店员举起闪亮的绸幅。
        - id: ch01-b68
          speaker: shopman
          text: 太太，我敢保证，这个价钱再合算不过。
        - id: ch01-b69
          speaker: meg
          text: 我要了。
        - id: ch01-b70
          speaker: narrator
          text: 梅格话一出口，绸子就当场裁了下来，钱也立刻付清。萨莉因为终于劝动了她而十分得意，梅格也陪着笑，装得仿佛这件事无足轻重。可等她们坐车离开商店，那点轻松立刻消失了。梅格觉得自己不像买了一匹美丽丝绸，倒像刚刚偷了什么值钱的东西，警察已经紧紧跟在车后，随时会追上来。
        - id: ch01-b71
          speaker: narrator
          text: 回家后，她摊开丝绸，想用它安慰自己的懊悔。可那颜色忽然不那么银亮了，也不怎么衬她。“五十美元”几个字仿佛变成花纹，印满每一幅料子。她把绸子收起来，它却像一桩愚蠢事情的幽灵，怎么也赶不走。晚上约翰拿出账本，梅格的心一下沉了下去。婚后第一次，她竟有些怕丈夫。那双和善的棕眼睛仿佛也能严厉起来。他明明格外快活，她却疑心自己早已被看穿。
        - id: ch01-b72
          speaker: narrator
          text: 家中账单都付清了，账本也整整齐齐。约翰夸了她，正要打开两人称作“银行”的旧皮夹。梅格知道里面已经空了，连忙紧张地按住他的手。
        - id: ch01-b73
          speaker: meg
          text: 你还没有看我的私人开支账。
        - id: ch01-b74
          speaker: narrator
          text: 约翰从不要求看，梅格却总坚持给他。往常，她很喜欢看丈夫猜女人那些稀奇的用品。他会问滚边是什么，凶巴巴地追问紧身短外套有什么用，还会纳闷三朵玫瑰、一块天鹅绒和两根带子，怎么就成了一顶六美元的帽子。那晚他也准备照例逗她，假装被数字吓坏。毕竟，他一直为妻子的节俭自豪。
        - id: ch01-b75
          speaker: narrator
          text: 小账本慢慢摆到约翰面前。梅格借口替他抚平疲倦的额头，躲到椅背后。她每说一句，心里的恐慌就更深一层。
        - id: ch01-b76
          speaker: meg
          text: 亲爱的，我真不好意思给你看。我最近花钱太多了。常常出门，总得添些东西。萨莉劝我买，我就买了。新年那笔钱能付一部分，可买完我就后悔。我知道你会觉得我做错了。
        - id: ch01-b77
          speaker: john
          text: 别躲在后面。就算你买了一双迷死人不偿命的靴子，我也不会打你。我很喜欢我妻子的脚。只要靴子好，花八九美元也没关系。
        - id: ch01-b78
          speaker: narrator
          text: 那双靴子正是最近添的“小东西”，约翰已经看见了。梅格打了个寒战。等他看到那可怕的五十美元，又会说什么？
        - id: ch01-b79
          speaker: meg
          text: 比靴子还糟。我买的是一件绸衣。
        - id: ch01-b80
          speaker: narrator
          text: 绝望反倒让她镇定，只想赶快熬过最坏的一刻。
        - id: ch01-b81
          speaker: john
          text: 好吧，亲爱的。借曼塔利尼先生的话，那个“该死的总数”是多少？
        - id: ch01-b82
          speaker: narrator
          text: 这不像约翰平常说的话。他抬头看她，目光仍旧坦率。过去梅格总能同样坦率地迎上去，这次却一面翻页，一面转开脸，只指着那个骇人的数字。屋里静了一会儿。约翰费了些力气，才没有显出不快。
        - id: ch01-b83
          speaker: john
          text: 如今一件衣裳还要配花边和各种装饰，五十美元也许不算太多。
        - id: ch01-b84
          speaker: meg
          text: 它还没做成，也没有装饰。
        - id: ch01-b85
          speaker: narrator
          text: 想起后面还要花的钱，梅格几乎招架不住。
        - id: ch01-b86
          speaker: john
          text: 二十五码丝绸，裹这么小的一个女人，好像多了点。不过等我妻子穿上，一定会和内德·莫法特太太一样漂亮。
        - id: ch01-b87
          speaker: meg
          text: 我知道你生气，可我也控制不住。我不是故意浪费你的钱，没想到那些小东西加起来会这么多。萨莉想买什么就买什么，还可怜我什么也没有，我看着就忍不住。我努力想知足，可真的很难。我已经厌倦贫穷了。
          emotion: sad
        - id: ch01-b88
          speaker: narrator
          text: 最后一句轻得几乎听不见，梅格以为约翰没听到。可他听见了，心也深深受了伤。为了她，他已经放弃许多自己的享受。梅格话刚出口，就恨不得咬掉舌头。约翰推开账本站起来，声音微微发颤。
        - id: ch01-b89
          speaker: john
          text: 我一直怕会有这一天。梅格，我已经尽了全力。
          emotion: sad
        - id: ch01-b90
          speaker: narrator
          text: 哪怕他骂她一顿，甚至摇晃她，也不会比这几句话更让她心碎。梅格扑过去，紧紧抱住丈夫。
        - id: ch01-b91
          speaker: meg
          text: 约翰，我亲爱的、善良又辛苦的人！我不是那个意思。这话又坏、又不真实、又忘恩负义。我怎么说得出口？我怎么会这样说！
          emotion: sad
        - id: ch01-b92
          speaker: narrator
          text: 约翰待她非常宽厚，很快就原谅了她，没有说一句责备的话。可梅格知道，自己做过的事和说过的话都不会很快被忘记，即使丈夫以后绝口不提。她曾答应无论日子好坏都爱他。如今她这个做妻子的，先轻率地花掉丈夫辛苦挣来的钱，反过来又拿他的贫穷责怪他。最难受的是，约翰后来一直安安静静，像什么也没发生。只是他留在城里的时间越来越晚，等梅格哭着睡着以后，他还要在夜里继续工作。
        - id: ch01-b93
          speaker: narrator
          text: 整整一星期，悔恨压得梅格几乎病倒。接着她发现，约翰把自己那件新大衣的订单取消了。这下她彻底陷入绝望，那副模样可怜得让人不忍心看。她又惊讶又难过，追问丈夫为什么忽然改变主意。约翰只给了一个再简单不过的回答。
        - id: ch01-b94
          speaker: john
          text: 亲爱的，我买不起。
        - id: ch01-b95
          speaker: narrator
          text: 梅格再也说不出一句话。几分钟后，约翰看见她独自站在门厅，把脸深深埋进那件旧大衣，哭得像是心都要碎了。
        - id: ch01-b96
          speaker: narrator
          text: 那天晚上，夫妻俩谈了很久。梅格不再只是忍受约翰的贫穷，反而因为这份贫穷更加爱他。正是清贫的日子把他磨炼成真正的男子汉，给了他力量和勇气，让他能凭自己的本事闯出一条路。贫穷也教会了他另一种本领。面对所爱之人那些自然而然的欲望和失败，他懂得用温柔的耐心去承受，也懂得怎样安慰。
        - id: ch01-b97
          speaker: narrator
          text: 第二天，梅格把骄傲收起来，去对萨莉说出实情，请她帮忙买下丝绸。好心的莫法特太太爽快答应，又体贴地没有立刻把它当礼物送还。梅格随后重新订了那件大衣。约翰回来时，她把大衣穿在自己身上，问他喜不喜欢她的新绸衣。
        - id: ch01-b98
          speaker: narrator
          text: 他会怎样回答，怎样收下这份礼物，还有随后出现了多么幸福的情景，都不难想象。从那以后，约翰每天早早回家，梅格也不再四处闲逛。每天早晨，一位极快活的丈夫穿上那件大衣。到了夜里，一位无比体贴的小妻子再替他脱下来。日子就这样一天天过去，一年也随之流转。到了仲夏，梅格迎来了一种崭新的体验，也是女人一生中最深、最温柔的体验。
        - id: ch01-b99
          speaker: narrator
          text: 一个星期六，劳里满脸兴奋，蹑手蹑脚走进鸽舍厨房。迎接他的却是一阵铙钹声。原来汉娜一手拿炖锅，一手拿锅盖，欢喜得把两样东西敲在一起。
        - id: ch01-b100
          speaker: laurie
          text: 小妈妈怎么样？大家在哪儿？为什么不早点告诉我，非等我回来？
        - id: ch01-b101
          speaker: narrator
          text: 劳里压着嗓子，声音却还是很响。
        - id: ch01-b102
          speaker: hannah
          text: 亲爱的，她快活得像王后！一个个都在楼上敬拜呢。我们可不想让什么旋风刮进来。你去客厅，我叫他们下来。
          emotion: happy
        - id: ch01-b103
          speaker: narrator
          text: 汉娜这番话不大容易听懂。说完，她带着欣喜若狂的咯咯笑声走了。不一会儿，乔出现了。她骄傲地捧着一个法兰绒包裹，包裹稳稳放在一只大枕头上。乔的脸色十分严肃，眼睛却闪闪发亮。连她说话的声音也有些古怪，仿佛正竭力压住某种快要迸出来的激动。
        - id: ch01-b104
          speaker: jo
          text: 闭上眼睛，把胳膊伸出来。
        - id: ch01-b105
          speaker: narrator
          text: 劳里飞快退到墙角，把双手藏在背后。
        - id: ch01-b106
          speaker: laurie
          text: 不，谢谢，我还是算了。我肯定会把它掉下来，或者直接摔坏。
        - id: ch01-b107
          speaker: jo
          text: 那你就别想看你的外甥了。
        - id: ch01-b108
          speaker: narrator
          text: 乔说得斩钉截铁，转身就要走。
        - id: ch01-b109
          speaker: laurie
          text: 我要看，我要看！可要是摔坏了，得算你的。
        - id: ch01-b110
          speaker: narrator
          text: 劳里英勇地闭上眼睛，任由什么东西放进自己怀里。下一刻，乔、艾米、马奇太太、汉娜和约翰一齐大笑。他睁开眼，才发现怀里不是一个婴儿，而是两个。
        - id: ch01-b111
          speaker: narrator
          text: 难怪大家笑个不停。劳里一会儿瞪着两个什么也不知道的小无辜，一会儿瞪着笑作一团的众人，惊慌的表情滑稽得连贵格会教徒也会笑到抽搐。乔干脆坐到地上尖叫起来。
        - id: ch01-b112
          speaker: laurie
          text: 天哪，是双胞胎！谁快把他们接走！我要笑了，一笑肯定会把他们掉下去。
          emotion: surprised
        - id: ch01-b113
          speaker: narrator
          text: 整整一分钟，劳里只说得出“双胞胎”三个字。接着，他可怜巴巴地向那群女人求救。乔把两个宝宝接过去，一条胳膊抱一个，来回走着，仿佛早已懂得照料婴儿的一切秘密。劳里笑得眼泪直流。
        - id: ch01-b114
          speaker: jo
          text: 这是今年最好玩的笑话，对吧？我故意不告诉你，就想吓你一跳。现在看来，我做得相当成功。
          emotion: happy
        - id: ch01-b115
          speaker: laurie
          text: 我这辈子都没这么吃惊过。真有意思！他们都是男孩吗？要叫什么？再给我看看。乔，扶我一把。一下多出一个，我实在撑不住。
        - id: ch01-b116
          speaker: narrator
          text: 他看着婴儿，就像一条又大又善良的纽芬兰犬，正在端详一对初生小猫。
        - id: ch01-b117
          speaker: john
          text: 一个男孩，一个女孩。漂亮吧？
          emotion: happy
        - id: ch01-b118
          speaker: narrator
          text: 骄傲的父亲望着两个红通通、扭来扭去的小东西，满脸放光，仿佛那是两位羽毛还没长齐的天使。
        - id: ch01-b119
          speaker: laurie
          text: 这是我见过最非同寻常的孩子。可哪个是哪个？
        - id: ch01-b120
          speaker: narrator
          text: 劳里像井边的吊杆一样弯下腰，细看这两个奇迹。
        - id: ch01-b121
          speaker: jo
          text: 艾米照法国人的办法，给男孩系蓝丝带，给女孩系粉丝带，这样永远不会弄错。再说，一个是蓝眼睛，一个是棕眼睛。泰迪舅舅，吻吻他们。
        - id: ch01-b122
          speaker: laurie
          text: 我怕他们不喜欢。
        - id: ch01-b123
          speaker: narrator
          text: 一向大胆的劳里，碰上这件事竟胆怯了。
        - id: ch01-b124
          speaker: jo
          text: 当然喜欢，他们已经习惯了。先生，现在就吻！
        - id: ch01-b125
          speaker: narrator
          text: 乔赶紧下令，免得他找人代劳。劳里皱起整张脸，小心地在两个小脸蛋上各啄一下。大家又笑了，婴儿也尖叫起来。
        - id: ch01-b126
          speaker: laurie
          text: 瞧吧，我就知道他们不喜欢！这个是男孩，他踢得真有劲，拳头也挥得像模像样。来吧，小布鲁克，找个和自己一样大的人打，怎么样？
          emotion: happy
        - id: ch01-b127
          speaker: narrator
          text: 一只乱挥的小拳头正好戳到劳里脸上，叫他高兴极了。
        - id: ch01-b128
          speaker: amy
          text: 男孩叫约翰·劳伦斯，女孩跟妈妈和外祖母一样，叫玛格丽特。家里不能有两个梅格，所以女孩叫黛西。这个小男子汉大概叫杰克，除非我们想到更好的。
        - id: ch01-b129
          speaker: laurie
          text: 那就叫他德米约翰，简称德米。
        - id: ch01-b130
          speaker: jo
          text: 黛西和德米，正合适！我就知道泰迪能想出来。
          emotion: happy
        - id: ch01-b131
          speaker: narrator
          text: 乔高兴得拍起手来。这一回，泰迪的确办成了一件大事。两个亲昵又相配的小名就这样定了下来。从这一天起，一直到本章结束，两个孩子一直叫作“黛西”和“德米”。
