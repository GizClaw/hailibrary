audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖细腻，带着克制的幽默, timbre: 清澈柔和, pace: 从容舒展, pitch: 中音}
    amy:
      display_name: 艾米
      tts:
        delivery: 讲究而伶俐，成熟中仍带少女的直率
        timbre: 清脆明亮的年轻女声
        pace: 适中，兴奋时轻快
        pitch: 中高音
    laurie:
      display_name: 劳里
      tts:
        delivery: 风趣亲切，表面的懒散下藏着低落
        timbre: 清朗温暖的年轻男声
        pace: 从容，真情流露时稍快
        pitch: 中音
  chapters:
    - id: ch01
      title: 尼斯的故人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 劳里去尼斯时，本来只想住一个星期，结果整整待了一个月。他独自在外漂泊得厌倦了。异国的景物再新鲜，只要里面有了艾米熟悉的身影，便像是也有了一点家的温暖。他还真怀念从前在家里受宠的日子。陌生人再会殷勤奉承，也比不上马奇家姐妹那种亲人般的爱慕。
        - id: ch01-b02
          speaker: narrator
          text: 艾米从来不像其他姐妹那样宠劳里，不过这次见到他，她实在很欢喜，几乎处处都依着他。她想家想得厉害，却不肯承认，而劳里仿佛就是她亲爱的一家人派来的代表。两人从彼此的陪伴中得到安慰，常常一起骑马、散步、跳舞，也常常懒洋洋地消磨时间。尼斯到了游乐季，谁都很难认真做事。
        - id: ch01-b03
          speaker: narrator
          text: 他们表面只顾轻松玩乐，心里却在悄悄地重新认识对方。艾米在劳里心中的分量一天比一天重，劳里在她眼中的分量却一天比一天轻。谁也没说破，两人却都隐约知道。艾米有意讨他欢喜，也做到了。劳里给她许多快乐，她便用种种细微又迷人的体贴来回报。
        - id: ch01-b04
          speaker: narrator
          text: 劳里却一点也不肯费心，只想舒舒服服地随波逐流，好忘掉过去。他甚至觉得，一个女人既然冷待了他，别的女人就都该对他说句好话。慷慨对他并不难，只要艾米肯收，他恨不得把尼斯所有的小饰物都送给她。可他也明白，艾米对他的看法正在改变，而他无力阻止。她那双锐利的蓝眼睛带着伤心、轻蔑和惊讶望过来时，他心里甚至有些发怵。
        - id: ch01-b05
          speaker: narrator
          text: 一个晴朗的日子，劳里照旧磨蹭到中午才露面。艾米已经写完了信，正准备出门。
        - id: ch01-b06
          speaker: amy
          text: 其他人都去摩纳哥玩一天了。我宁愿留在家里写信，现在信写完了，我要去瓦尔罗萨画画。你来不来？
        - id: ch01-b07
          speaker: laurie
          text: 好吧。不过天这么热，还要走那么远，不会太累吗？
        - id: ch01-b08
          speaker: narrator
          text: 外面阳光刺眼，背阴的客厅实在舒服，劳里说话也慢吞吞的。
        - id: ch01-b09
          speaker: amy
          text: 我要坐小马车，让巴蒂斯特赶车。你什么也不用做，只要撑好阳伞，别弄脏你的宝贝手套。
        - id: ch01-b10
          speaker: narrator
          text: 艾米说着，讥诮地瞥了一眼他那双洁白的小山羊皮手套。劳里对它们一向宝贝得很。
        - id: ch01-b11
          speaker: laurie
          text: 那我当然乐意去。把画册给我吧。
        - id: ch01-b12
          speaker: amy
          text: 不劳驾了。这点力气我还使得出，你看起来倒未必经得住。
        - id: ch01-b13
          speaker: narrator
          text: 艾米把画册夹在腋下，一溜烟跑下楼。劳里扬起眉毛，慢悠悠跟在后面。不过上了马车，他还是接过缰绳亲自赶车。小巴蒂斯特没事可做，只能抱着胳膊，在座位上打盹。
        - id: ch01-b14
          speaker: narrator
          text: 这两个人从来不吵架。艾米教养太好，不肯失礼，劳里这会儿又懒得争执。没过多久，他便探头往艾米帽檐下面瞧，像是在问她还生不生气。艾米朝他一笑，两人又和和气气地并肩赶路了。
        - id: ch01-b15
          speaker: narrator
          text: 一路上景色美得叫人目不暇接。蜿蜒的道路旁，有古老的修道院，修士庄严的吟唱声从高处飘下来。一个光腿牧人穿着木鞋和粗外套，戴着尖帽，坐在石头上吹笛。山羊有的在岩石间跳跃，有的安静地卧在他脚边。
        - id: ch01-b16
          speaker: narrator
          text: 温顺的灰色小驴驮着两筐新割的青草经过。草堆中间，有时坐着戴宽边软帽的漂亮姑娘，有时坐着拿纺锤一路纺线的老妇人。棕色皮肤、眼睛温柔的孩子从石屋里跑出来，卖一小束一小束的花，还有仍然连在枝上的橙子。
        - id: ch01-b17
          speaker: narrator
          text: 橄榄树虬曲的枝干爬满山坡，暗沉的叶子铺成一片。果园里的果实金灿灿的，路边开着硕大的猩红银莲花。再往远处看，越过青翠山坡和嶙峋高地，滨海阿尔卑斯山的白色尖峰直指意大利湛蓝的天空。
        - id: ch01-b18
          speaker: narrator
          text: 瓦尔罗萨这个名字，意思正是“玫瑰谷”。这里长夏不去，玫瑰也开得到处都是。花枝垂过拱门，从大门的铁栏间探出头，甜甜地迎接过客。夹道的花一路穿过柠檬树和轻柔的棕榈叶，蜿蜒着通向山上的别墅。
        - id: ch01-b19
          speaker: narrator
          text: 每个浓荫下的休息处都淹没在花丛里。清凉的岩洞中，大理石仙女隔着花帘微笑。喷泉里倒映着深红、雪白和淡粉的玫瑰，花朵俯身看水，像在欣赏自己的美貌。玫瑰又爬满墙壁，垂过檐口，绕上圆柱，在宽阔露台的栏杆上任意蔓延。站在露台上，可以望见阳光里的地中海，还有岸边那座白墙之城。
        - id: ch01-b20
          speaker: amy
          text: 这里简直是度蜜月的天堂，对不对？你见过这么多玫瑰吗？
        - id: ch01-b21
          speaker: narrator
          text: 一缕浓郁的花香悠悠飘来。劳里却伸手去够稍远处的一朵红玫瑰，没摘到花，反而扎了手，只好把拇指含进嘴里。
        - id: ch01-b22
          speaker: laurie
          text: 这么多玫瑰，我没见过。这么厉害的刺，我也没挨过。
        - id: ch01-b23
          speaker: amy
          text: 那就往低处找，摘没有刺的花吧。
        - id: ch01-b24
          speaker: narrator
          text: 艾米从身后的墙上摘下三朵小小的乳白玫瑰，插进劳里的纽扣眼，算是同他讲和。劳里低头看着花，神情忽然有些古怪。他有一半意大利人的天性，多少有些迷信。眼下他的心情又半甜半苦，正是年轻人最容易从小事中看出预兆的时候。
        - id: ch01-b25
          speaker: narrator
          text: 他刚才伸手去摘带刺的红玫瑰，心里想的是乔。鲜艳的花最衬乔，她从前也常戴家里温室中的红花。可是艾米送来的浅色玫瑰，在意大利只会放进死者手中，绝不会编进新娘的花冠。劳里一时竟分不清，这个预兆说的是乔，还是他自己。
        - id: ch01-b26
          speaker: narrator
          text: 好在美国人的常识很快压倒了他的多愁善感。劳里突然放声大笑，笑得比来到尼斯以后任何一次都痛快。艾米还以为，是自己的忠告逗乐了他。
        - id: ch01-b27
          speaker: amy
          text: 这可是句好忠告。你最好照着做，也省得再扎手。
        - id: ch01-b28
          speaker: laurie
          text: 多谢，我会照办的。
        - id: ch01-b29
          speaker: narrator
          text: 劳里这会儿只是说笑。几个月以后，他却当真听从了这番忠告。
    - id: ch02
      title: 玫瑰谷里的谈心
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 艾米在一张乡野式的长椅上坐下，问劳里什么时候去看祖父。他只说很快，可同一句话，过去三个星期已经说过十几遍了。
        - id: ch02-b02
          speaker: amy
          text: 你祖父在等你，你真的应该去了。
        - id: ch02-b03
          speaker: laurie
          text: 我知道。回答得短一点，大家都省事。
        - id: ch02-b04
          speaker: amy
          text: 既然知道，你为什么还不走？
        - id: ch02-b05
          speaker: laurie
          text: 大概是我天生顽劣吧。
        - id: ch02-b06
          speaker: amy
          text: 你明明是天生懒散。实在太不像话了！
        - id: ch02-b07
          speaker: laurie
          text: 没有看起来那么糟。我去了也只会烦祖父，不如留下来多烦你几天。你比他经得住，而且我觉得，这对你大有好处。
        - id: ch02-b08
          speaker: narrator
          text: 劳里说完，就在宽阔的露台栏杆上舒舒服服地躺好。艾米认命似的摇摇头，打开画册。她早就打定主意，要训一训“那个男孩”，于是很快又问起来。
        - id: ch02-b09
          speaker: amy
          text: 你眼下究竟在做什么？我是说，你以后打算做什么，又真正想做什么？
        - id: ch02-b10
          speaker: laurie
          text: 眼下我在看蜥蜴。等一会儿，要是你准许，我还想抽支烟。
        - id: ch02-b11
          speaker: amy
          text: 你真会气人！我不赞成抽烟。除非你让我把你画进去，我正好缺个人物。
        - id: ch02-b12
          speaker: laurie
          text: 我非常乐意。你想画全身，还是四分之三身？让我头朝下，还是脚朝下？依我看，最好画我躺着，再把你自己也画进去，题目就叫《无所事事的甜蜜》。
        - id: ch02-b13
          speaker: amy
          text: 你就这样别动，想睡也可以。我可要认真干活了。
        - id: ch02-b14
          speaker: laurie
          text: 这份热忱真叫人高兴！
        - id: ch02-b15
          speaker: narrator
          text: 劳里靠在一只高大的瓮旁，样子十分满足。艾米看着他那副懒散相，越来越不耐烦，便搬出比自己更勤奋的姐姐来激他。
        - id: ch02-b16
          speaker: amy
          text: 乔要是看见你现在这样，会怎么说？
        - id: ch02-b17
          speaker: laurie
          text: 她还会说那句老话，“走开，特迪。我正忙着呢！”
        - id: ch02-b18
          speaker: narrator
          text: 劳里笑了一声，听起来却很不自然，脸上也掠过阴影。乔这个熟悉的名字碰到了还没愈合的伤。艾米见过这种神色，这一次更看得清楚。劳里的脸忽然变得冷硬苦涩，眼里有痛苦、不满和后悔。那神情转眼又消失，他重新懒洋洋地躺在那里。
        - id: ch02-b19
          speaker: narrator
          text: 艾米从画家的眼光看过去，只觉得劳里很像意大利人。他没戴帽子，躺在阳光中，眼里满是南方人的梦意，仿佛已经忘了身边还有人，只顾独自沉思。艾米在深色石壁的衬托下，仔细描着他轮廓分明的侧脸。
        - id: ch02-b20
          speaker: amy
          text: 你现在像一尊年轻骑士的卧像，睡在自己的墓上。
        - id: ch02-b21
          speaker: laurie
          text: 我倒希望自己真是。
        - id: ch02-b22
          speaker: amy
          text: 除非你已经毁了自己的一生，不然这种愿望太傻了。你变了这么多，有时候我真觉得……
        - id: ch02-b23
          speaker: narrator
          text: 艾米没有把话说完。她的神情半是胆怯，半是惆怅，反而比说出口更能表明她的担心。劳里看懂了，也明白她是真心关怀自己。他直望进她的眼睛，像从前回答马奇太太那样认真。
        - id: ch02-b24
          speaker: laurie
          text: 我没干坏事，夫人。
        - id: ch02-b25
          speaker: narrator
          text: 艾米终于放心了。这句话也让她很感动，声音马上亲切起来。
        - id: ch02-b26
          speaker: amy
          text: 那就好！我没真觉得你会变成多坏的男孩。我只是担心，你会在那个邪恶的巴登—巴登乱花钱，会爱上某个已有丈夫的迷人法国女人，或是惹上别的麻烦。年轻男人出国游历，好像非闯几次祸才算完整。别在太阳底下晒了，到草地上躺着吧。我们来“好好亲近亲近”，像以前乔说的那样。那时我们总挤在沙发角落里说秘密。
        - id: ch02-b27
          speaker: narrator
          text: 劳里听话地躺到草地上，又拿起雏菊，一朵朵插进艾米放在旁边的帽带里。他抬眼看她，这一回倒真的有了兴趣。
        - id: ch02-b28
          speaker: laurie
          text: 我准备好了。有什么秘密，你尽管说吧。
        - id: ch02-b29
          speaker: amy
          text: 我没有秘密。你先讲。
        - id: ch02-b30
          speaker: laurie
          text: 我一个秘密也没有，还想向你讨一个呢。我以为家里也许来了什么新消息。
        - id: ch02-b31
          speaker: amy
          text: 最近来的消息，你全都听过了。难道你不常收到信吗？我还以为乔会一写就是好几大篇。
        - id: ch02-b32
          speaker: laurie
          text: 她很忙。我又总在外面乱跑，当然不能按时通信。对了，拉斐尔小姐，你那件伟大的艺术作品什么时候开始？
        - id: ch02-b33
          speaker: narrator
          text: 劳里沉默时，原本还在猜艾米是不是知道他的秘密，想同他谈谈。可他猛地换了话题。
        - id: ch02-b34
          speaker: amy
          text: 我永远不会开始了。罗马已经把我的虚荣心全打掉了。看过那里真正的杰作，我只觉得自己小得不配活着。我灰了心，所有愚蠢的梦想也都放弃了。
          emotion: sad
        - id: ch02-b35
          speaker: laurie
          text: 你有那么多精力，也有才华，为什么要放弃？
        - id: ch02-b36
          speaker: amy
          text: 正因为如此。才华并不是天才，再努力也变不成天才。我要么成为伟大的艺术家，要么什么也不做。我不愿当个平庸的涂抹匠，所以不会再试了。
        - id: ch02-b37
          speaker: laurie
          text: 那么请问，你以后准备拿自己怎么办？
        - id: ch02-b38
          speaker: amy
          text: 我要磨练其他才艺。要是有机会，就去做社交界的一件装饰品。
        - id: ch02-b39
          speaker: narrator
          text: 这话大胆，却很像艾米。年轻人有一点大胆并不难看，何况她的野心有坚实的根基。劳里喜欢她的精神。一个珍藏已久的目标死了，她没有浪费时间哀叹，马上又找到了新的志向。
        - id: ch02-b40
          speaker: laurie
          text: 很好。那么我猜，接下来就该弗雷德·沃恩登场了。
        - id: ch02-b41
          speaker: narrator
          text: 艾米谨慎地不作声，只是低垂的脸已经泄露了心思。劳里立刻坐起来，摆出做哥哥的严肃样子。
        - id: ch02-b42
          speaker: laurie
          text: 现在我要当哥哥，问你几个问题。你愿意回答吗？
        - id: ch02-b43
          speaker: amy
          text: 我可不答应。
        - id: ch02-b44
          speaker: laurie
          text: 嘴不说，脸也会告诉我。亲爱的，你还没老练到能藏住心事。去年我听过你和弗雷德的传闻。依我看，他要不是忽然被叫回家，又耽搁了这么久，你们早就有结果了，对不对？
        - id: ch02-b45
          speaker: amy
          text: 这话不该由我来说。
        - id: ch02-b46
          speaker: narrator
          text: 艾米答得冷淡，嘴角却忍不住笑，眼睛也亮了一下。她知道自己有怎样的魅力，而且很享受这一点。
        - id: ch02-b47
          speaker: laurie
          text: 但愿你还没有订婚。他要是回来，规规矩矩地跪下求婚，你会答应他，是不是？
        - id: ch02-b48
          speaker: amy
          text: 我没有订婚。不过你说的事，很可能会发生。
        - id: ch02-b49
          speaker: laurie
          text: 那么，你喜欢老弗雷德？
        - id: ch02-b50
          speaker: amy
          text: 只要我肯用心，我可以喜欢上他。
        - id: ch02-b51
          speaker: laurie
          text: 可你要等到合适的时候才肯用心。天哪，多么惊人的谨慎！弗雷德人不错，可我以为你不会喜欢这种男人。
        - id: ch02-b52
          speaker: amy
          text: 他有钱，是位绅士，而且风度很好。
        - id: ch02-b53
          speaker: narrator
          text: 艾米努力保持镇定和尊严。她的打算虽然真诚，说出来却还是有点惭愧。
        - id: ch02-b54
          speaker: laurie
          text: 我懂了。社交界的女王不能没有钱，所以你准备找一门好亲事，靠这个起步。按世俗的规矩，这当然正确又妥当。不过这话从马奇太太的女儿嘴里说出来，总有些奇怪。
        - id: ch02-b55
          speaker: amy
          text: 可这就是事实。
        - id: ch02-b56
          speaker: narrator
          text: 只有短短一句话，却说得平静又坚决，同艾米年轻的模样形成奇妙的反差。劳里本能地感到失望，却说不出缘故。他重新躺下，沉默地看着她。那目光，再加上艾米心里本就有的一点自责，叫她烦躁起来。她决定不再耽搁，马上把训话讲完。
    - id: ch03
      title: 懒散的劳伦斯
      blocks:
        - id: ch03-b01
          speaker: amy
          text: 请你振作一点，就当帮我一个忙。
        - id: ch03-b02
          speaker: laurie
          text: 好姑娘，那就请你替我振作吧。
        - id: ch03-b03
          speaker: amy
          text: 只要我肯试，我做得到。
        - id: ch03-b04
          speaker: narrator
          text: 艾米的神情说明，她很愿意用最干脆的办法试一试。劳里太久没逗弄过谁，正觉得这种消遣很有趣。
        - id: ch03-b05
          speaker: laurie
          text: 那你就试吧，我准了。
        - id: ch03-b06
          speaker: amy
          text: 不出五分钟，你就会生气。
        - id: ch03-b07
          speaker: laurie
          text: 我从来不生你的气。两块燧石相碰才会起火，可你像雪一样，又凉又软。
        - id: ch03-b08
          speaker: amy
          text: 你根本不知道我能做什么。雪用对了，也会叫人皮肤发红发痛。你的冷漠一半是装的，只要狠狠搅一搅，自然就看得出来。
        - id: ch03-b09
          speaker: laurie
          text: 那就尽管搅吧。伤不了我，还能让你开心。你把我当丈夫也好，当地毯也好，只管打到累为止，只要这种活动对你有益。
        - id: ch03-b10
          speaker: narrator
          text: 艾米本来就恼火，也实在想把他从这副冷漠的样子里摇醒。于是她削尖铅笔，也削尖了舌头，正式开讲。
        - id: ch03-b11
          speaker: amy
          text: 弗洛和我给你起了一个新名字，叫“懒散的劳伦斯”。你喜欢吗？
        - id: ch03-b12
          speaker: narrator
          text: 艾米原想惹恼他，劳里却把双臂交叠在脑后，神色一点没变。
        - id: ch03-b13
          speaker: laurie
          text: 这个名字不坏。谢谢二位小姐。
        - id: ch03-b14
          speaker: amy
          text: 你想不想听听，我心里到底怎样看你？
        - id: ch03-b15
          speaker: laurie
          text: 我简直盼得要命。
        - id: ch03-b16
          speaker: amy
          text: 那么我告诉你，我瞧不起你。
        - id: ch03-b17
          speaker: narrator
          text: 艾米若是撒娇地说“我恨你”，劳里准会笑起来，甚至还会喜欢。可她这句话说得郑重，听来几乎伤心。劳里立刻睁开眼，急忙追问。
        - id: ch03-b18
          speaker: laurie
          text: 请你告诉我，为什么？
        - id: ch03-b19
          speaker: amy
          text: 因为你明明有一切机会，能做个善良、有用、快乐的人，却偏偏一身毛病，又懒惰，又苦闷。
        - id: ch03-b20
          speaker: laurie
          text: 小姐，你这话可真厉害。
        - id: ch03-b21
          speaker: amy
          text: 你要是爱听，我还能继续。
        - id: ch03-b22
          speaker: laurie
          text: 请你一定继续，我听得很有兴趣。
        - id: ch03-b23
          speaker: amy
          text: 我早知道。自私的人总爱听别人谈论自己。
        - id: ch03-b24
          speaker: laurie
          text: 难道我很自私吗？
          emotion: surprised
        - id: ch03-b25
          speaker: narrator
          text: 这句话自己从劳里嘴里溜了出来。他是真的惊讶，因为他最引以为豪的优点就是慷慨。
        - id: ch03-b26
          speaker: amy
          text: 是的，你非常自私。我们一起游玩时，我一直在观察你，现在我对你很不满意。你出国快半年了，只会浪费时间、挥霍金钱，还让朋友们失望。
        - id: ch03-b27
          speaker: narrator
          text: 艾米的声音平静又冷淡，这时比发火更有力量。
        - id: ch03-b28
          speaker: laurie
          text: 一个人苦读了四年，难道不该享受一点乐趣吗？
        - id: ch03-b29
          speaker: amy
          text: 可你看起来并没享受到多少，至少这些日子没让你变得更好。我们刚重逢时，我还说你进步了。现在我要把那句话全收回。你远不如我离家时那么可爱。
        - id: ch03-b30
          speaker: amy
          text: 你变得懒惰透顶，喜欢听闲话，把时间花在无聊的小事上。你乐意让愚蠢的人宠你、夸你，却不肯去赢得明智之人的爱戴和尊重。你有钱，有才华，有地位，有健康，还有美貌。啊，这个词你爱听吧，你这个爱慕虚荣的家伙！可我说的都是真话。
        - id: ch03-b31
          speaker: amy
          text: 这么多好东西都在你手里，能拿来做事，也能拿来享受。可你除了游手好闲，竟找不到任何事可做。你不去成为自己应当成为的男人，只肯做一个……
        - id: ch03-b32
          speaker: narrator
          text: 艾米说不下去了。她望着劳里，眼神里既有痛心，也有怜惜。
        - id: ch03-b33
          speaker: laurie
          text: 你是说，我只肯做一个躺在烤架上的圣劳伦斯。
        - id: ch03-b34
          speaker: narrator
          text: 劳里温和地替她补完，可这场训话已经起了作用。他的眼睛清醒地亮起来，原先的漠不关心也变成了恼火和受伤。
        - id: ch03-b35
          speaker: amy
          text: 我就知道你会拿它当笑话。你们男人总说我们是天使，还说我们想把你们变成什么样都可以。可我们一认真想帮你们变好，你们马上就笑，也不肯听。可见那些奉承根本不值钱。
        - id: ch03-b36
          speaker: narrator
          text: 艾米尖刻地说完，转过身去，不看脚边这个气人的殉道者。过了一会儿，一只手突然压住纸页，让她画不下去。劳里故意学着悔过的小孩。
        - id: ch03-b37
          speaker: laurie
          text: 我会乖的。哦，我一定会乖的！
        - id: ch03-b38
          speaker: narrator
          text: 艾米没有笑。她是认真的，还用铅笔敲着那只摊开的手。
        - id: ch03-b39
          speaker: amy
          text: 你有这样一只手，不觉得惭愧吗？它又白又软，简直像女人的手，好像只会戴朱万最好的手套，再替女士们摘花。谢天谢地，你还不是花花公子，手上没有钻石，也没有硕大的印章戒指。只有乔很多年前送你的那只旧小戒指。真希望亲爱的乔在这里，能来帮帮我！
        - id: ch03-b40
          speaker: laurie
          text: 我也希望她在这里！
        - id: ch03-b41
          speaker: narrator
          text: 那只手猛地缩了回去。劳里这声回答里忽然有了力量，就连艾米也挑不出懒散的毛病。她心里冒出一个新念头，低头望去。劳里却用帽子盖着半张脸，嘴又藏在小胡子后面。她只看见他的胸膛随着一口长气起伏。那也许是一声叹息。
        - id: ch03-b42
          speaker: narrator
          text: 戴戒指的那只手深深埋进草里，仿佛想藏起一件太珍贵、太柔软，不能说出口的东西。许多零散的小事忽然在艾米心里拼到一起，把乔从没告诉过她的秘密说了出来。劳里从不主动提乔，刚才听见乔的名字时脸色变了，他的性情也变了，而那只并不衬他漂亮双手的旧戒指，他一直没有摘下。
        - id: ch03-b43
          speaker: narrator
          text: 姑娘们很会读懂这种无声的迹象。艾米早就怀疑，一场情伤也许正是劳里变化的根源。现在她终于确定了。眼泪涌进她锐利的眼睛。只要她愿意，她的声音原本就能温柔得动人，此刻她便这样开了口。
        - id: ch03-b44
          speaker: amy
          text: 劳里，我知道自己没有资格这样训你。你要不是世上脾气最好的人，早就该气坏了。可我们全家都那么疼你，也那么以你为傲。想到家里人也会像我一样对你失望，我实在受不了。不过他们也许比我更明白，你为什么会变成这样。
        - id: ch03-b45
          speaker: laurie
          text: 我想，他们会明白。
          emotion: sad
        - id: ch03-b46
          speaker: narrator
          text: 这句话从帽子底下传来，语气冷峻，却像哽咽一样叫人难过。
        - id: ch03-b47
          speaker: amy
          text: 他们本来就该告诉我，不能让我什么也不知道，只顾乱骂你。其实我更应该比往常温柔、更有耐心才对。我从来就不喜欢那个兰德尔小姐，现在更恨她了！
        - id: ch03-b48
          speaker: narrator
          text: 艾米故意搬出兰德尔小姐。这一次，她要先试探清楚，免得又猜错。
        - id: ch03-b49
          speaker: laurie
          text: 让兰德尔小姐见鬼去吧！
          emotion: angry
        - id: ch03-b50
          speaker: narrator
          text: 劳里猛地掀掉脸上的帽子。只看那副神情，便知道他对兰德尔小姐绝无情意。
        - id: ch03-b51
          speaker: amy
          text: 对不起，我还以为……
        - id: ch03-b52
          speaker: laurie
          text: 不，你才没有。你明明知道，除了乔，我从来没爱过别人。
        - id: ch03-b53
          speaker: narrator
          text: 劳里又恢复了从前冲动的口吻，说完便把脸转开。
        - id: ch03-b54
          speaker: amy
          text: 我确实这样猜过。可他们从没说起，你又离开了，我以为自己猜错了。难道乔不肯好好待你吗？我一直以为她非常爱你。
        - id: ch03-b55
          speaker: laurie
          text: 她待我很好，只是不是我需要的那种好。照你说的，我既然这么没出息，她没爱上我倒是她的幸运。不过这件事都怪她，你可以照样告诉她。
        - id: ch03-b56
          speaker: narrator
          text: 劳里脸上那副冷硬苦涩的神情又回来了。艾米看着难受，却想不出该用什么话安慰他。
        - id: ch03-b57
          speaker: amy
          text: 是我错了，我先前并不知道。刚才对你那么凶，我真的很抱歉。可是，亲爱的特迪，我还是希望你能更坚强地撑过去。
        - id: ch03-b58
          speaker: laurie
          text: 别这样叫我，那是她叫我的名字！等你自己尝过这种滋味，再来说吧。
          emotion: angry
        - id: ch03-b59
          speaker: narrator
          text: 艾米那半温柔、半责备的语气，很像乔。劳里急忙抬手制止，又低下声音，一把一把揪着草。
        - id: ch03-b60
          speaker: amy
          text: 要是我，就会像个男子汉那样承受。即使得不到爱，也要赢得尊重。
        - id: ch03-b61
          speaker: narrator
          text: 艾米说得斩钉截铁，因为她对这种痛苦其实一无所知。劳里一直以为自己承受得非常好。他没诉苦，也不求人同情，只把烦恼带到远方，打算一个人慢慢熬过去。
        - id: ch03-b62
          speaker: narrator
          text: 可经艾米这样一说，他第一次看见了事情的另一面。才经历一次失败就灰心，又把自己关进阴郁的冷漠里，原来显得既软弱又自私。他像是忽然从忧郁的梦中被人摇醒，再也睡不回去了。过了一会儿，他坐起身，慢慢问她。
        - id: ch03-b63
          speaker: laurie
          text: 你觉得乔看见我现在这样，也会像你一样瞧不起我吗？
        - id: ch03-b64
          speaker: amy
          text: 会。她最讨厌懒人。你为什么不去做一件了不起的事，让她爱上你？
        - id: ch03-b65
          speaker: laurie
          text: 我已经尽过全力，可没有用。
        - id: ch03-b66
          speaker: amy
          text: 你是说顺利毕业吗？为了你祖父，那本来就是你应该做到的。人人都知道你有能力。花了那么多时间和钱，要是还毕不了业，那才叫丢脸。
        - id: ch03-b67
          speaker: laurie
          text: 不管你怎么说，我就是失败了。因为乔不肯爱我。
          emotion: sad
        - id: ch03-b68
          speaker: narrator
          text: 劳里垂头丧气地用手托住脑袋。艾米却不肯让他把自己说成失败者。
        - id: ch03-b69
          speaker: amy
          text: 你没有失败，最后你自己也会承认。那件事让你变得更好，还证明了只要肯努力，你就做得成事。你只要再找一件事情认真去做，很快会重新成为那个精神十足、快快乐乐的自己，也会忘掉烦恼。
        - id: ch03-b70
          speaker: laurie
          text: 那不可能。
        - id: ch03-b71
          speaker: amy
          text: 先试了再说。别耸肩，也别心想，“这种事她懂什么”。我不敢说自己聪明，可我很会观察。我看到的，比你以为的多得多。我留心别人的经历，也留心他们怎样说一套、做一套。虽然我讲不清其中的道理，却会记住，再拿来帮助自己。
        - id: ch03-b72
          speaker: amy
          text: 你愿意爱乔一辈子，那就爱吧。可别让这份爱毁了你。只因得不到自己最想要的那一样东西，就把其余那么多好天赋全糟蹋掉，这样做很不应该。我不再训你了。我知道，不管那个铁石心肠的姑娘怎样，你都会清醒过来，做个真正的男子汉。
    - id: ch04
      title: 两幅速写
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 两个人沉默了好几分钟。劳里坐在那里，转动手指上的小戒指。艾米一边说话，一边画了一幅匆忙的速写，此刻又添上最后几笔。画完以后，她把纸放到劳里膝上。
        - id: ch04-b02
          speaker: amy
          text: 你觉得这幅画怎么样？
        - id: ch04-b03
          speaker: narrator
          text: 劳里看了一眼，实在忍不住笑。艾米画得很精彩。草地上躺着一个长长的人影，姿势懒洋洋的，神情倦怠，眼睛半闭，手里还夹着烟。一缕细烟升起来，在做梦人的脑袋周围绕成小小的花环。
        - id: ch04-b04
          speaker: laurie
          text: 你画得真好！不错，这就是我。
          emotion: happy
        - id: ch04-b05
          speaker: amy
          text: 这是现在的你。这一幅，才是从前的你。
        - id: ch04-b06
          speaker: narrator
          text: 艾米又放下一幅画。第二幅没有第一幅精细，却充满生气，足以盖过那些缺点。画中的往事太鲜明了，劳里一看，脸上的神色便变了。
        - id: ch04-b07
          speaker: narrator
          text: 那是一幅劳里驯马的粗略速写。他摘了帽子，脱下外套。矫健的身姿、坚毅的脸、发号施令的姿态，每一道线条都有力量。那匹刚被驯服的骏马弓着颈项，缰绳拉得紧紧的。一只蹄子焦躁地刨地，两只耳朵高高竖着，像在等征服它的人再次开口。
        - id: ch04-b08
          speaker: narrator
          text: 马鬃乱蓬蓬的，骑手的头发在风里飞扬，身体挺得笔直。整幅画像把疾驰忽然截停了，里面有力量，有勇气，也有青春蓬勃的朝气。它同《无所事事的甜蜜》里那副慵懒的姿态，恰好形成鲜明的对照。
        - id: ch04-b09
          speaker: narrator
          text: 劳里一句话也没说，只让目光在两幅画之间来回移动。艾米看见他涨红了脸，又紧紧抿住嘴唇，仿佛已经读懂，也接受了她借画送来的小小教训。她很满意，立刻换回活泼的口气。
        - id: ch04-b10
          speaker: amy
          text: 你还记得那一天吗？你学雷里驯服帕克，我们全在旁边看。梅格和贝丝吓坏了，乔却不停拍手，还高兴得蹦来蹦去。我坐在栅栏上画你。前几天我在画夹里找到了这幅画，又添了几笔，特意留给你看。
        - id: ch04-b11
          speaker: laurie
          text: 非常感谢。你的画艺进步了太多，我应该向你道贺。不过，在这个“度蜜月的天堂”，我能不能提醒你一下，你们旅馆五点钟开晚餐？
        - id: ch04-b12
          speaker: narrator
          text: 劳里说着站起来，微笑着鞠了一躬，把两幅画还给艾米，又看看怀表。他像是在提醒她，道德训诫也该有个结束的时候。他努力找回先前那种轻松冷淡的样子，可这一次已经是假装的。艾米对他的唤醒，比他愿意承认的更有效。
        - id: ch04-b13
          speaker: narrator
          text: 艾米听出他的态度里多了一点冷淡，便在心里对自己说，这下真的得罪他了。可她也知道，只要这些话对劳里有好处，她便不后悔。如果因此叫他恨她，她当然会难过。不过她说的都是实话，一个字也不能收回。
        - id: ch04-b14
          speaker: narrator
          text: 回去的一路上，两人仍旧有说有笑。坐在后面的小巴蒂斯特还觉得，先生和小姐的兴致真好。其实他们都不自在。从前那种坦诚友善的相处已经受到扰动，阳光里也落下了一道阴影。表面再欢快，两个人心底还是各自藏着一份不满。
        - id: ch04-b15
          speaker: narrator
          text: 马车到了姑妈门前。两人正要分别，艾米先问劳里，今晚还会不会见面。
        - id: ch04-b16
          speaker: amy
          text: 我的兄长，今晚我们还能见到你吗？
        - id: ch04-b17
          speaker: laurie
          text: 真不巧，我已经有约会了。再会，小姐。
        - id: ch04-b18
          speaker: narrator
          text: 劳里弯下身，像要照外国礼节吻她的手。这个动作由他做出来，比许多男人都自然。可他脸上的某种神情，让艾米急忙热切地开口。
        - id: ch04-b19
          speaker: amy
          text: 别这样。劳里，在我面前还是做你自己吧，也照我们从前的方式道别。我宁愿要一次热诚的英国式握手，也不要法国所有多愁善感的礼节。
        - id: ch04-b20
          speaker: laurie
          text: 再见，亲爱的。
        - id: ch04-b21
          speaker: narrator
          text: 劳里的语气又变回艾米喜欢的样子。他用力握了握她的手，热诚得几乎把她捏痛，随后离开了。
        - id: ch04-b22
          speaker: narrator
          text: 第二天早晨，劳里没有照常登门。艾米却收到他的一封短信。她看见开头时笑了，读到末尾又叹了口气。
        - id: ch04-b23
          speaker: laurie
          text: 亲爱的导师，请代我向你的姑妈辞行，也请你暗自庆贺吧。“懒散的劳伦斯”已经像最听话的孩子一样，到祖父那里去了。祝你度过愉快的冬天。愿诸神赐你在瓦尔罗萨享受幸福的蜜月！依我看，弗雷德也需要有人狠狠唤醒一番。请把这话告诉他，也请代我向他致贺。感激你的忒勒马科斯。
        - id: ch04-b24
          speaker: amy
          text: 好孩子！他走了，我真高兴。
          emotion: happy
        - id: ch04-b25
          speaker: narrator
          text: 可下一刻，艾米看了看空荡荡的房间，脸上的笑意便消失了。她不由自主地叹了一声。
        - id: ch04-b26
          speaker: amy
          text: 是啊，我很高兴。可是，我会多么想念他。
          emotion: sad
