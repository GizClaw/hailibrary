audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "warm, observant, and gently playful", timbre: "clear and inviting", pace: measured, pitch: medium}
    amy:
      display_name: Amy
      tts: {delivery: "poised, expressive, and lightly dramatic", timbre: "smooth and bright", pace: measured, pitch: medium-high}
    laurie:
      display_name: Laurie
      tts: {delivery: "playful, confident, and warmly teasing", timbre: "youthful and resonant", pace: lively, pitch: medium}
  chapters:
    - id: ch01
      title: Lazy Laurence
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Laurie meant to spend one week in Nice. He stayed for a month. He was tired of roaming by himself, and having Amy nearby made every foreign place feel a little more like home. He missed the way the March girls used to fuss over him. Attention from strangers could not compare with their sisterly affection. Amy had never spoiled him as the others did, but now she was so glad to see him that she held close to his company. To her, he stood for the dear family she missed more than she admitted.
        - id: ch01-b02
          speaker: narrator
          text: So they spent a great deal of time together, riding, walking, dancing, and idling through the lively season. Nice made hard work nearly impossible at that gay time of year. Beneath all that easy amusement, each was quietly studying the other. Amy rose higher in Laurie's opinion every day. Laurie sank lower in hers, and both of them knew it before either said a word. Amy tried to please him. She was grateful for all the pleasures he gave her, and repaid him through thoughtful little kindnesses. She gave those small services a charm that was hard to describe. Laurie tried at nothing. He drifted along, comfortable and determined to forget. One woman had been cold to him, so he felt all women owed him some kindness now.
        - id: ch01-b03
          speaker: narrator
          text: Being generous took no effort for Laurie. He would have bought Amy every trinket in Nice if she had accepted them. But he knew he could not buy a better opinion from her. Those sharp blue eyes seemed to watch him with a mixture of sorrow, scorn, and surprise, and he had begun to dread them.
        - id: ch01-b04
          speaker: amy
          text: Everyone else has gone to Monaco for the day. I stayed home to write letters, but I've finished them. I'm going to Valrosa to sketch. Will you come?
        - id: ch01-b05
          speaker: narrator
          text: It was nearly noon when Amy found Laurie lounging in as usual. Outside, the day was lovely but bright and hot. The shaded salon looked much more inviting to him.
        - id: ch01-b06
          speaker: laurie
          text: Well, yes. But isn't that a long walk in this heat?
        - id: ch01-b07
          speaker: amy
          text: I'm taking the little carriage, and Baptiste will drive. All you'll have to do is hold your umbrella and keep those gloves spotless.
        - id: ch01-b08
          speaker: narrator
          text: Amy gave his perfect kid gloves a pointed look. Laurie was rather proud of them.
        - id: ch01-b09
          speaker: laurie
          text: In that case, I'll be delighted to go.
        - id: ch01-b10
          speaker: narrator
          text: He reached for her sketchbook, but Amy tucked it under her arm.
        - id: ch01-b11
          speaker: amy
          text: Don't strain yourself. It weighs nothing to me, and you hardly look strong enough for it.
        - id: ch01-b12
          speaker: narrator
          text: Laurie raised his eyebrows and followed at his own slow pace while Amy ran downstairs. Once they were in the carriage, though, he took the reins. That left little Baptiste free to fold his arms and fall asleep on his perch. Amy and Laurie never quarreled. She was too well mannered, and just then he was too lazy. After a minute, he peered beneath the brim of her hat to see if she was still annoyed. She smiled back, and peace was restored.
        - id: ch01-b13
          speaker: narrator
          text: The road curled through one beautiful scene after another. From an ancient monastery came the solemn chanting of monks. A bare-legged shepherd sat piping on a stone. He wore wooden shoes and a pointed hat, with his rough jacket thrown over one shoulder. His goats leaped among the rocks or rested at his feet. Gentle, mouse-colored donkeys passed with baskets of fresh-cut grass. Sometimes a pretty girl in a broad sunbonnet sat between the green heaps. Sometimes an old woman walked beside them, spinning from her distaff as she went. Brown, soft-eyed children ran from curious stone cottages to offer little bouquets or branches with the oranges still hanging from them.
        - id: ch01-b14
          speaker: narrator
          text: Twisted olive trees spread their dark leaves across the hills. Orchards shone with golden fruit, and scarlet anemones lined the road. Beyond the green slopes and rocky heights, the Maritime Alps stood sharp and white against the blue Italian sky.
        - id: ch01-b15
          speaker: narrator
          text: Valrosa truly deserved its name. In that land of endless summer, roses bloomed everywhere. They hung over the archway and pushed between the bars of the great gate as if sweetly welcoming everyone who passed. They bordered the avenue that wound among lemon trees and feathery palms toward the villa on the hill. Every shady corner offered a seat where a visitor could stop and rest among masses of flowers. In each cool grotto, a marble nymph smiled through a veil of blossoms. Every fountain reflected crimson, white, and pale pink roses bending toward the water as if admiring their own beauty.
        - id: ch01-b16
          speaker: narrator
          text: Roses covered the villa walls, draped its cornices, climbed its pillars, and tumbled over the railing of the broad terrace. From there, Amy and Laurie could look down on the sunny Mediterranean and the white city along its shore.
        - id: ch01-b17
          speaker: amy
          text: This place was made for honeymoons, wasn't it? Have you ever seen so many roses?
        - id: ch01-b18
          speaker: narrator
          text: Amy paused on the terrace, enjoying the view and a rich breath of perfume. Laurie reached for a single scarlet rose beyond the railing. The flower escaped him, but its thorn did not.
        - id: ch01-b19
          speaker: laurie
          text: I've never felt so many thorns.
        - id: ch01-b20
          speaker: narrator
          text: He put his wounded thumb in his mouth.
        - id: ch01-b21
          speaker: amy
          text: Reach lower and choose the ones without thorns.
        - id: ch01-b22
          speaker: narrator
          text: Amy picked three tiny cream-colored roses from the wall behind her and tucked them into his buttonhole as a peace offering. Laurie looked down at them with a strange expression. His Italian nature held a touch of superstition, and lately he found romance and meaning in every little thing. The thorny red rose had made him think of Jo. Bright flowers suited her, and she had often worn roses like that from the greenhouse at home.
        - id: ch01-b23
          speaker: narrator
          text: The pale roses Amy gave him were flowers Italians placed in the hands of the dead, never in a bridal wreath. Laurie's mood was half sweet and half bitter, just the sort that made an imaginative young man turn a trifle into an omen. For one moment he wondered whether the sign pointed to Jo or to himself. Then his American common sense defeated all that gloomy romance, and he laughed more heartily than Amy had heard him laugh since he arrived.
        - id: ch01-b24
          speaker: amy
          text: That's sensible advice. You should follow it and spare your fingers.
        - id: ch01-b25
          speaker: narrator
          text: Amy thought her remark had amused him.
        - id: ch01-b26
          speaker: laurie
          text: Thank you. I will.
        - id: ch01-b27
          speaker: narrator
          text: He meant it as a joke. A few months later, he would follow her advice in earnest.
        - id: ch01-b28
          speaker: amy
          text: Laurie, when are you going to see your grandfather?
        - id: ch01-b29
          speaker: narrator
          text: Amy settled onto a rustic seat.
        - id: ch01-b30
          speaker: laurie
          text: Very soon.
        - id: ch01-b31
          speaker: amy
          text: You've said that twelve times in three weeks.
        - id: ch01-b32
          speaker: laurie
          text: Probably. Short answers are less trouble.
        - id: ch01-b33
          speaker: amy
          text: He's expecting you. You really should go.
        - id: ch01-b34
          speaker: laurie
          text: How welcoming of you. I know I should.
        - id: ch01-b35
          speaker: amy
          text: Then why don't you?
        - id: ch01-b36
          speaker: laurie
          text: Natural wickedness, I suppose.
        - id: ch01-b37
          speaker: amy
          text: Natural laziness, you mean. It's awful!
        - id: ch01-b38
          speaker: laurie
          text: It isn't as bad as it looks. I'd only bother him if I went, so I may as well stay and bother you. You can stand it better. In fact, it seems to be doing you good.
        - id: ch01-b39
          speaker: narrator
          text: Laurie stretched out on the broad stone railing. Amy shook her head and opened her sketchbook as if she had given up. In truth, she had decided to lecture that boy, and she soon began again.
        - id: ch01-b40
          speaker: amy
          text: What are you doing with yourself now?
        - id: ch01-b41
          speaker: laurie
          text: Watching the lizards.
        - id: ch01-b42
          speaker: amy
          text: That isn't what I mean. What do you want to do? What are your plans?
        - id: ch01-b43
          speaker: laurie
          text: I'd like to smoke a cigarette, if you permit it.
        - id: ch01-b44
          speaker: amy
          text: You are impossible! I disapprove of cigars, but I'll allow one if you pose for my sketch. I need a figure.
        - id: ch01-b45
          speaker: laurie
          text: Gladly. Do you want the whole magnificent figure or only three quarters? Shall I stand on my head or my heels? I recommend a reclining pose. Put yourself in the picture too, and call it “Dolce far niente.”
        - id: ch01-b46
          speaker: amy
          text: Stay just as you are. Go to sleep if you want. I mean to work.
        - id: ch01-b47
          speaker: laurie
          text: What inspiring enthusiasm.
        - id: ch01-b48
          speaker: narrator
          text: He leaned against a tall urn, perfectly satisfied with himself.
        - id: ch01-b49
          speaker: amy
          text: What would Jo say if she could see you now?
        - id: ch01-b50
          speaker: narrator
          text: Amy hoped the name of her energetic sister would stir him.
        - id: ch01-b51
          speaker: laurie
          text: The same thing she always said. “Go away, Teddy. I'm busy!”
        - id: ch01-b52
          speaker: narrator
          text: Laurie laughed, but the sound was false. That familiar name had touched a wound that had not healed. A hard, bitter look crossed his face, full of pain, regret, and discontent. It vanished quickly, and his lazy expression returned. Amy had noticed the change. She watched him for a moment with an artist's pleasure. With his bare head in the sun and that dreamy look in his eyes, he seemed thoroughly Italian. He had forgotten her and slipped into a reverie.
        - id: ch01-b53
          speaker: amy
          text: You look like the stone figure of a young knight asleep on his tomb.
        - id: ch01-b54
          speaker: narrator
          text: Her pencil carefully followed his clear profile against the dark stone.
        - id: ch01-b55
          speaker: laurie
          text: I wish I were one.
          emotion: sad
        - id: ch01-b56
          speaker: amy
          text: That's a foolish wish unless you've ruined your life. You've changed so much that sometimes I wonder...
        - id: ch01-b57
          speaker: narrator
          text: Amy stopped. Her look was timid and wistful, and it said more than the unfinished words. Laurie understood the loving worry she was afraid to speak. He looked directly into her eyes, just as he used to look at her mother.
        - id: ch01-b58
          speaker: laurie
          text: It's all right, ma'am.
          emotion: calm
        - id: ch01-b59
          speaker: narrator
          text: That answer quieted the doubts Amy had begun to feel. It touched her too, and her voice grew warm.
        - id: ch01-b60
          speaker: amy
          text: I'm glad! I didn't think you'd become truly wicked. Still, I imagined you might have thrown away money in dreadful Baden-Baden, fallen for some charming married Frenchwoman, or stumbled into one of those scrapes young men treat as part of traveling abroad. Come out of the sun and lie here on the grass. Let's be friendly, the way Jo used to say when we curled up in the sofa corner and shared secrets.
        - id: ch01-b61
          speaker: narrator
          text: Laurie obeyed. He dropped onto the grass and began poking daisies into the ribbons of Amy's hat beside him.
        - id: ch01-b62
          speaker: laurie
          text: I'm ready. Tell me all your secrets.
        - id: ch01-b63
          speaker: narrator
          text: He looked up with real interest now.
        - id: ch01-b64
          speaker: amy
          text: I haven't any. You go first.
        - id: ch01-b65
          speaker: laurie
          text: I don't have one either. I thought you might have news from home.
        - id: ch01-b66
          speaker: amy
          text: You've heard everything that's come lately. Don't they write often? I thought Jo would send you whole volumes.
        - id: ch01-b67
          speaker: laurie
          text: She's very busy. And I move around so much that regular letters are impossible. When do you begin your great masterpiece, Raphaella?
        - id: ch01-b68
          speaker: narrator
          text: He changed the subject abruptly. During the pause, he had wondered whether Amy knew his secret and was trying to make him confess it.
        - id: ch01-b69
          speaker: amy
          text: Never. Rome cured me of my vanity. After I saw all those wonders, I felt too small to matter, and I gave up my foolish hopes.
          emotion: sad
        - id: ch01-b70
          speaker: laurie
          text: Why give up? You have plenty of talent and energy.
        - id: ch01-b71
          speaker: amy
          text: That's exactly the trouble. Talent isn't genius, and hard work can't turn one into the other. I wanted to be great or nothing at all. I refuse to become an ordinary painter, so I'm finished trying.
        - id: ch01-b72
          speaker: laurie
          text: Then what will you do with yourself, if I may ask?
        - id: ch01-b73
          speaker: amy
          text: Improve my other talents and become an ornament to society, if I get the opportunity.
        - id: ch01-b74
          speaker: narrator
          text: It was a bold answer and perfectly like Amy. Boldness suits young people, and her ambition rested on solid ground. Laurie smiled. He admired the spirit that let her choose a new purpose without wasting time mourning the old one.
        - id: ch01-b75
          speaker: laurie
          text: Good! And I suppose this is where Fred Vaughn enters the plan.
        - id: ch01-b76
          speaker: narrator
          text: Amy said nothing, but her lowered face gave her away. Laurie sat up and became serious.
        - id: ch01-b77
          speaker: laurie
          text: I'm going to behave like a brother and ask some questions. May I?
        - id: ch01-b78
          speaker: amy
          text: I won't promise to answer them.
        - id: ch01-b79
          speaker: laurie
          text: Your face will answer if your tongue doesn't. You haven't learned to hide your feelings yet, my dear. I heard talk about you and Fred last year. If he hadn't been called home so suddenly and kept there so long, I think something would have happened. Am I right?
        - id: ch01-b80
          speaker: amy
          text: That isn't for me to say.
        - id: ch01-b81
          speaker: narrator
          text: Amy tried to look grim, but her lips wanted to smile and her eyes sparkled. She knew the power she had over Fred, and she enjoyed knowing it.
        - id: ch01-b82
          speaker: laurie
          text: You aren't engaged, are you?
        - id: ch01-b83
          speaker: narrator
          text: All at once, he looked as grave and protective as an older brother.
        - id: ch01-b84
          speaker: amy
          text: No.
        - id: ch01-b85
          speaker: laurie
          text: But if he comes back, kneels down, and asks properly, you will be?
        - id: ch01-b86
          speaker: amy
          text: Most likely.
        - id: ch01-b87
          speaker: laurie
          text: So you love old Fred?
        - id: ch01-b88
          speaker: amy
          text: I could love him if I tried.
        - id: ch01-b89
          speaker: laurie
          text: And you won't try until the proper moment? Good heavens, what astonishing caution! Fred is a good fellow, Amy, but he isn't the man I expected you to choose.
        - id: ch01-b90
          speaker: amy
          text: He's rich, he's a gentleman, and his manners are delightful.
        - id: ch01-b91
          speaker: narrator
          text: She tried to sound cool and dignified. Her intentions were sincere, but she still felt a little ashamed.
        - id: ch01-b92
          speaker: laurie
          text: I see. A queen of society needs money, so you'll make a fine marriage and begin that way. By the world's rules, it is sensible and proper. It only sounds strange coming from one of your mother's daughters.
        - id: ch01-b93
          speaker: amy
          text: Strange or not, it's true.
        - id: ch01-b94
          speaker: narrator
          text: Her quiet certainty sounded odd in someone so young. Laurie felt it and lay down again, disappointed without knowing why. His silence and expression, along with her own private disapproval of herself, unsettled Amy. She decided it was time to deliver her lecture.
        - id: ch01-b95
          speaker: amy
          text: I wish you would do me one favor and wake yourself up a little.
        - id: ch01-b96
          speaker: laurie
          text: Wake me up yourself. Be a dear.
        - id: ch01-b97
          speaker: amy
          text: I could if I decided to.
        - id: ch01-b98
          speaker: narrator
          text: She looked ready to do it quickly and thoroughly.
        - id: ch01-b99
          speaker: laurie
          text: Then try. You have my permission.
        - id: ch01-b100
          speaker: narrator
          text: After going so long without his favorite amusement, Laurie enjoyed having someone to tease again.
        - id: ch01-b101
          speaker: amy
          text: You'd be angry with me in five minutes.
        - id: ch01-b102
          speaker: laurie
          text: I'm never angry with you. A fire needs two flints, and you're as cool and soft as snow.
        - id: ch01-b103
          speaker: amy
          text: You don't know what snow can do. Rub it on the right way and it burns and tingles. Half your indifference is an act. A proper stirring would prove it.
        - id: ch01-b104
          speaker: laurie
          text: Stir as hard as you like. It can't hurt me, and it may entertain you. Think of me as a husband or a carpet, and beat me until you're tired if the exercise suits you.
        - id: ch01-b105
          speaker: narrator
          text: Amy was thoroughly annoyed now. She longed to shake him free of the apathy that had changed him. She sharpened her pencil and her tongue, then began.
        - id: ch01-b106
          speaker: amy
          text: Flo and I have a new name for you. Lazy Laurence. What do you think of it?
        - id: ch01-b107
          speaker: narrator
          text: She expected the name to sting. Laurie only folded his arms beneath his head.
        - id: ch01-b108
          speaker: laurie
          text: Not bad. Thank you, ladies.
        - id: ch01-b109
          speaker: amy
          text: Would you like to hear what I truly think of you?
        - id: ch01-b110
          speaker: laurie
          text: I'm longing to hear it.
        - id: ch01-b111
          speaker: amy
          text: Then here it is. I despise you.
          emotion: sad
        - id: ch01-b112
          speaker: narrator
          text: If she had said she hated him in a flirty or childish fit, he would have laughed. But her voice was grave and almost sad. Laurie opened his eyes at once.
        - id: ch01-b113
          speaker: laurie
          text: Why, exactly?
          emotion: surprised
        - id: ch01-b114
          speaker: amy
          text: Because you have every chance to be good, useful, and happy, but you choose to be weak, lazy, and miserable.
        - id: ch01-b115
          speaker: laurie
          text: Strong words, mademoiselle.
        - id: ch01-b116
          speaker: amy
          text: If you're enjoying them, I can continue.
        - id: ch01-b117
          speaker: laurie
          text: Please do. This is fascinating.
        - id: ch01-b118
          speaker: amy
          text: I knew you'd think so. Selfish people always enjoy talking about themselves.
        - id: ch01-b119
          speaker: laurie
          text: Am I selfish?
          emotion: surprised
        - id: ch01-b120
          speaker: narrator
          text: The question escaped before he could stop it. He sounded honestly surprised. Generosity was the one virtue he had always claimed with pride.
        - id: ch01-b121
          speaker: amy
          text: Very selfish. I've watched you while we were off having fun, and I'm not pleased with what I saw. You've been abroad for almost six months. All you've done is waste money, waste time, and disappoint the people who care about you.
        - id: ch01-b122
          speaker: laurie
          text: Can't a fellow enjoy himself after working for four years?
        - id: ch01-b123
          speaker: amy
          text: You don't look as though you've enjoyed much. Whatever you've been doing, it hasn't improved you. When we met again, I said you had changed for the better. I take it back. I liked you far more when I left home. Now you're terribly lazy. You gossip, spend your days on foolish things, and let silly people pet and admire you when you ought to earn the love and respect of wise ones.
        - id: ch01-b124
          speaker: amy
          text: You have money, talent, position, health, and good looks. Yes, you like hearing that last one, old Vanity. But it's true. You have all these wonderful gifts to use and enjoy, yet you do nothing but drift. Instead of becoming the man you should be, you're only...
        - id: ch01-b125
          speaker: narrator
          text: Amy stopped. Pain and pity filled her face.
        - id: ch01-b126
          speaker: laurie
          text: Saint Laurence on a gridiron.
        - id: ch01-b127
          speaker: narrator
          text: Laurie supplied the ending as smoothly as ever, but the lecture had begun to work. His eyes were fully awake now. A look both angry and wounded had replaced his lazy indifference.
        - id: ch01-b128
          speaker: amy
          text: I knew you'd laugh. Men call us angels and insist we can make you into anything we please. The moment we honestly try to help, you mock us and refuse to listen. That shows how little all your flattery means.
          emotion: angry
        - id: ch01-b129
          speaker: narrator
          text: Amy turned her back on the maddening martyr at her feet. A moment later, Laurie's hand covered the page so she could not draw. He spoke like a naughty child pretending to repent.
        - id: ch01-b130
          speaker: laurie
          text: I'll be good! Oh, I promise I'll be good!
        - id: ch01-b131
          speaker: narrator
          text: Amy did not laugh. She meant every word. She tapped his open hand with her pencil.
        - id: ch01-b132
          speaker: amy
          text: Aren't you ashamed of a hand like that? It's as soft and white as a woman's. It looks as if it has never done anything except wear the finest gloves and pick flowers for ladies. Thank goodness you aren't a dandy. At least there are no diamonds or enormous seal rings. There's only that little old ring Jo gave you years ago. Dear Jo. I wish she were here to help me.
        - id: ch01-b133
          speaker: laurie
          text: So do I!
          emotion: sad
        - id: ch01-b134
          speaker: narrator
          text: His hand disappeared as quickly as it had come. Even Amy could not ask for more feeling than she heard in that answer. A new thought came to her, and she looked down. Laurie had pulled his hat halfway over his face as if he wanted shade. His mustache hid his mouth. She could only see his chest rise with a long breath that might have been a sigh. The hand wearing Jo's ring had curled into the grass, hiding something too tender to speak aloud.
        - id: ch01-b135
          speaker: narrator
          text: Suddenly, every small hint fell into place. Amy understood what Jo had never told her. Laurie never mentioned Jo unless someone else did. There had been that shadow on his face, the change in his whole nature, and the old little ring that did nothing to decorate his handsome hand. Amy had suspected that disappointed love caused his misery. Now she was certain. Her sharp eyes filled with tears, and when she spoke, her voice was soft and kind.
        - id: ch01-b136
          speaker: amy
          text: I had no right to speak to you that way, Laurie. Anyone with a worse temper would be furious with me. But we all love you, and we're so proud of you. I couldn't bear the thought of everyone at home being as disappointed as I was. Though perhaps they would understand this change better than I did.
          emotion: sad
        - id: ch01-b137
          speaker: laurie
          text: I think they would.
          emotion: sad
        - id: ch01-b138
          speaker: narrator
          text: His voice came from under the hat, grim and more moving than if it had broken.
        - id: ch01-b139
          speaker: amy
          text: They should have told me. They let me blunder around and scold you when I should have been kinder and more patient than ever. I never liked that Miss Randal. Now I hate her!
        - id: ch01-b140
          speaker: narrator
          text: Amy had chosen the wrong young woman on purpose. This time she wanted to be certain.
        - id: ch01-b141
          speaker: laurie
          text: Forget Miss Randal!
          emotion: angry
        - id: ch01-b142
          speaker: narrator
          text: Laurie knocked the hat from his face. His expression left no doubt about Miss Randal.
        - id: ch01-b143
          speaker: amy
          text: I'm sorry. I thought...
        - id: ch01-b144
          speaker: narrator
          text: She stopped with careful innocence.
        - id: ch01-b145
          speaker: laurie
          text: No, you didn't. You knew perfectly well that I never cared for anyone but Jo.
        - id: ch01-b146
          speaker: narrator
          text: His old impulsive spirit flashed through the words. Then he turned his face away.
        - id: ch01-b147
          speaker: amy
          text: I did suspect it. But no one ever told me, and then you left, so I thought I must be wrong. Jo wasn't kind to you? I was certain she loved you dearly.
        - id: ch01-b148
          speaker: laurie
          text: She was kind, just not in the way I needed. If I'm as useless as you say, then it's lucky she didn't love me. Still, this is her fault, and you may tell her I said so.
          emotion: angry
        - id: ch01-b149
          speaker: narrator
          text: That hard, bitter look returned. Amy was troubled. She did not know how to comfort him.
        - id: ch01-b150
          speaker: amy
          text: I was wrong because I didn't know. I'm truly sorry I was so harsh. But I still wish you'd face it more bravely, Teddy, dear.
          emotion: sad
        - id: ch01-b151
          speaker: laurie
          text: Don't call me that. That's her name for me!
          emotion: angry
        - id: ch01-b152
          speaker: narrator
          text: He raised one hand quickly to stop her. Amy had spoken in Jo's half-gentle, half-reproving way.
        - id: ch01-b153
          speaker: laurie
          text: Wait until it happens to you.
          emotion: sad
        - id: ch01-b154
          speaker: narrator
          text: He pulled up the grass by handfuls as he spoke.
        - id: ch01-b155
          speaker: amy
          text: I would bear it like a grown person. If I couldn't be loved, at least I would earn respect.
        - id: ch01-b156
          speaker: narrator
          text: Amy spoke with all the certainty of someone who had never suffered such a loss. Laurie had believed he was bearing his own pain remarkably well. He had not complained, asked for sympathy, or let anyone watch him suffer. Instead, he had taken his trouble far from home and meant to live it down by himself. But Amy's lecture showed him another view. For the first time, losing heart at his first failure and shutting himself inside gloomy indifference looked weak and selfish. He felt as though someone had suddenly shaken him from a heavy, thoughtful dream. Now that he was awake, he found it impossible to drift back to sleep.
        - id: ch01-b157
          speaker: laurie
          text: Do you think Jo would despise me too if she saw me now?
        - id: ch01-b158
          speaker: narrator
          text: He had sat up, and the question came slowly.
        - id: ch01-b159
          speaker: amy
          text: Yes. She hates laziness. Why don't you do something splendid and make her love you?
        - id: ch01-b160
          speaker: laurie
          text: I did my best. It didn't work.
        - id: ch01-b161
          speaker: amy
          text: You mean you graduated with honors? You owed that much to your grandfather. After all the time and money spent on your education, failing would have been shameful when everyone knew you could succeed.
        - id: ch01-b162
          speaker: laurie
          text: Say what you like, I did fail. Jo still wouldn't love me.
          emotion: sad
        - id: ch01-b163
          speaker: narrator
          text: Laurie leaned his head on his hand, discouraged again.
        - id: ch01-b164
          speaker: amy
          text: No, you didn't fail. Someday you'll admit it. The work did you good, and it proved you can accomplish something when you try. Choose another real task. You'll soon become your warm, happy self again, and you'll forget this trouble.
        - id: ch01-b165
          speaker: laurie
          text: I can never forget it.
        - id: ch01-b166
          speaker: amy
          text: Try and see. Don't shrug and think I know nothing about life. I don't claim to be wise, but I pay attention. I see much more than you'd guess. I study other people's experiences and contradictions. Even when I can't explain them, I remember them and learn from them.
        - id: ch01-b167
          speaker: amy
          text: Love Jo forever if you choose, but don't let it ruin you. You have so many good gifts. Throwing them all away because you can't have the one gift you want is wrong. There, my lecture is over. I know you'll wake up and become a man in spite of that hardhearted girl.
        - id: ch01-b168
          speaker: narrator
          text: For several minutes, neither of them spoke. Laurie turned Jo's little ring around his finger. Amy finished the quick sketch she had worked on while they talked. At last, she placed it on his knee.
        - id: ch01-b169
          speaker: amy
          text: What do you think of that?
        - id: ch01-b170
          speaker: narrator
          text: Laurie looked, and he could not help smiling. Amy had captured him perfectly. There lay his long, lazy figure on the grass, his face empty, his eyes half closed, and a cigar in one hand. A little wreath of smoke curled around the dreamer's head.
        - id: ch01-b171
          speaker: laurie
          text: You draw wonderfully well. Yes, that's me.
        - id: ch01-b172
          speaker: narrator
          text: His surprise and praise were genuine, though he gave a small laugh at the likeness.
        - id: ch01-b173
          speaker: amy
          text: That's you as you are. Here is the way you used to be.
        - id: ch01-b174
          speaker: narrator
          text: She set a second sketch beside the first. The drawing was rougher, but it held so much life and spirit that its faults did not matter. The past returned in an instant. It showed Laurie taming Puck. His hat and coat were off. Every line of his active body, determined face, and commanding pose held energy and purpose. The handsome horse had just surrendered. It stood with its neck arched beneath the tight reins, one hoof pawing the ground and its ears raised for the voice that had mastered it.
        - id: ch01-b175
          speaker: narrator
          text: The tossed mane, Laurie's windblown hair, and his straight, strong figure all suggested motion suddenly stopped. The picture was full of strength, courage, and youthful life. Beside it, the graceful idler in the “Dolce far niente” sketch looked lifeless. Laurie did not speak. His eyes moved between the two drawings. Color rose in his face, and he pressed his lips together. Amy could see that he had read her little lesson and accepted it. That was enough for her. She did not wait for an answer.
        - id: ch01-b176
          speaker: amy
          text: Don't you remember the day you played Rarey with Puck while we watched? Meg and Beth were frightened. Jo clapped and danced around, and I sat on the fence drawing you. I found the sketch in my portfolio a few days ago. I touched it up and saved it to show you.
        - id: ch01-b177
          speaker: laurie
          text: Thank you. You've improved enormously, and I congratulate you. Now, may I mention here in our “honeymoon paradise” that your hotel serves dinner at five?
        - id: ch01-b178
          speaker: narrator
          text: Laurie stood, returned both sketches with a smile and bow, and looked at his watch. Even moral lectures needed to end. He tried to put on his former easy, careless manner, but now it was plainly an act. Amy had roused him more than he would admit. She felt the new coolness in his manner and spoke silently to herself.
        - id: ch01-b179
          speaker: amy
          text: Now I've offended him. If it helps him, I'm glad. If it makes him hate me, I'm sorry. But every word was true, and I won't take any of it back.
        - id: ch01-b180
          speaker: narrator
          text: They laughed and talked all the way home. From his seat behind them, little Baptiste thought monsieur and mademoiselle were in wonderful spirits. Both of them were uneasy. Their open friendliness had been disturbed. A shadow lay across the sunshine, and beneath their cheerful manner, each carried a private discontent.
        - id: ch01-b181
          speaker: amy
          text: Will we see you this evening, mon frère?
        - id: ch01-b182
          speaker: narrator
          text: They had reached her aunt's door.
        - id: ch01-b183
          speaker: laurie
          text: Unfortunately, I have an engagement. Au revoir, mademoiselle.
        - id: ch01-b184
          speaker: narrator
          text: Laurie bowed as if he meant to kiss her hand in the French fashion. The gesture suited him better than it suited most men, but something in his face made Amy answer quickly and warmly.
        - id: ch01-b185
          speaker: amy
          text: No, be yourself with me, Laurie. Let's part in our old way. I would rather have one honest English handshake than every sentimental greeting in France.
        - id: ch01-b186
          speaker: laurie
          text: Goodbye, dear.
        - id: ch01-b187
          speaker: narrator
          text: His voice sounded like himself again. They shook hands so heartily that it almost hurt, and Laurie left her.
        - id: ch01-b188
          speaker: narrator
          text: The next morning, Laurie did not make his usual call. Instead, Amy received a note. Its opening made her smile. Its ending made her sigh.
        - id: ch01-b189
          speaker: laurie
          text: My dear Mentor, please say goodbye to your aunt for me. You may celebrate your victory, because Lazy Laurence has gone to his grandfather like the best of boys. I hope you have a pleasant winter, and may the gods give you a blissful honeymoon at Valrosa. I believe Fred could use a good rousing too. Tell him so, and give him my congratulations. Yours gratefully, Telemachus.
        - id: ch01-b190
          speaker: amy
          text: Good boy! I'm glad he went.
          emotion: happy
        - id: ch01-b191
          speaker: narrator
          text: Amy smiled with approval. Then she looked around the empty room, and her face fell.
        - id: ch01-b192
          speaker: amy
          text: Yes, I am glad. But how I will miss him.
          emotion: sad
