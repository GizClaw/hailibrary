audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 克制而敏锐，带一点不动声色的讽意
        timbre: 温暖清晰
        pace: 舒缓中有变化
        pitch: 中音
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts:
        delivery: 任性强硬，话说得短而直接
        timbre: 稚嫩而尖细
        pace: 偏快
        pitch: 偏高
    martha:
      display_name: 玛莎
      tts:
        delivery: 爽朗质朴，带着亲切而浓重的约克郡乡音
        timbre: 年轻明亮而结实
        pace: 稍快
        pitch: 中高音
    ben_weatherstaff:
      display_name: 本·韦瑟斯塔夫
      tts:
        delivery: 粗声直率，约克郡口音浓重，偶尔透出温柔
        timbre: 苍老粗粝
        pace: 偏慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 风雨过后的荒原
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 两天以后，玛丽早晨一睁眼，马上从床上坐了起来，急着叫玛莎。
        - id: ch01-b02
          speaker: mary_lennox
          text: “快看荒原！你快看呀！”
        - id: ch01-b03
          speaker: narrator
          text: 暴风雨停了。夜里的大风把灰雾和乌云全都吹走，天亮时连风也歇了。荒原上空高高地罩着一片明亮的深蓝色。玛丽从来没梦见过这么蓝的天。印度的天空热得发亮，这里的蓝却又深又凉，像一座望不到底的美丽湖泊，还闪着粼粼的光。高高的蓝色穹顶里，这儿一片，那儿一片，漂着几朵雪白羊毛似的小云。一眼远远望不到边的荒原也换了颜色，不再是阴沉的紫黑，也不是难看的灰，而是一片柔和的蓝。
        - id: ch01-b04
          speaker: martha
          text: “可不是嘛，这场风雨暂时过去了。每年到了这个时候，天气都这样。风雨一夜就跑得没影，好像从没来过，以后也不想再来。因为春天正在路上呢。虽说离这儿还远，可它正一点点赶过来。”
          emotion: happy
        - id: ch01-b05
          speaker: mary_lennox
          text: “我原先还以为，英国不是下雨，就是整天阴沉沉的。”
        - id: ch01-b06
          speaker: narrator
          text: 玛莎蹲在一堆黑铅刷子中间，听见这话，一下直起身来。
        - id: ch01-b07
          speaker: martha
          text: “嗐，哪有这回事！”
        - id: ch01-b08
          speaker: mary_lennox
          text: “你说的那句话是什么意思？”
        - id: ch01-b09
          speaker: narrator
          text: 玛丽问得十分认真。印度人也说许多种方言，只有少数人能听懂。所以玛莎偶尔冒出陌生的话，她一点也不觉得奇怪。玛莎像她们初见的那个早晨一样笑了。
        - id: ch01-b10
          speaker: martha
          text: “瞧我，又说约克郡土话了。梅德洛克太太明明不准我说。刚才那句，换成正经话就是‘根本不是那样’，可那样讲起来太费劲。约克郡只要出了太阳，就是天底下阳光最好的地方。我早就说过，过些日子你会喜欢荒原的。”
        - id: ch01-b11
          speaker: martha
          text: “你等着瞧吧。荆豆花开得金灿灿的，金雀花也会开，石南花像一串串紫色的小铃铛。到处都是蝴蝶，蜜蜂嗡嗡地飞，云雀唱着歌直冲上天。等你看见了，准会想在天亮时就跑上荒原，像迪肯那样，一整天都不回来。”
        - id: ch01-b12
          speaker: narrator
          text: 玛丽望着窗外那片遥远的蓝色。荒原那么陌生，那么辽阔，又那么美，蓝得简直像天堂。她很想亲自走进去。
        - id: ch01-b13
          speaker: mary_lennox
          text: “我以后能走到那边去吗？”
        - id: ch01-b14
          speaker: martha
          text: “这我可不知道。依我看，你打出生起就没怎么用过两条腿。五英里的路，你走不动。我们的小屋离这儿正好五英里。”
        - id: ch01-b15
          speaker: mary_lennox
          text: “我想去看看你们的小屋。”
        - id: ch01-b16
          speaker: narrator
          text: 玛莎好奇地瞧了她片刻，才拿起刷子，继续擦壁炉。她觉得这张瘦小平凡的脸不像第一天那么乖戾了，倒有一点像苏珊·安特别想要什么东西时的模样。
        - id: ch01-b17
          speaker: martha
          text: “我回去问问妈妈。她遇到事情，差不多总能找到办法。今天是我的休息日，我要回家啦。嗐，真叫人高兴！梅德洛克太太很看重妈妈，说不定妈妈能跟她谈谈。”
          emotion: happy
        - id: ch01-b18
          speaker: mary_lennox
          text: “我喜欢你妈妈。”
        - id: ch01-b19
          speaker: martha
          text: “那当然了，你怎么会不喜欢她。”
        - id: ch01-b20
          speaker: mary_lennox
          text: “可我从来没见过她。”
        - id: ch01-b21
          speaker: martha
          text: “是啊，你是没见过。”
        - id: ch01-b22
          speaker: narrator
          text: 玛莎又蹲直身子，用手背擦了擦鼻尖。她像是被这个问题难住了，可很快又拿定了主意。
        - id: ch01-b23
          speaker: martha
          text: “这有什么要紧？妈妈明白事理，又勤快，脾气又好，还特别爱干净。一个人不管见没见过她，都不可能不喜欢她。每逢休息日，我一走上荒原，想到马上就能见到妈妈，真恨不得一路跳回家。”
        - id: ch01-b24
          speaker: mary_lennox
          text: “我也喜欢迪肯。可我也没见过他。”
        - id: ch01-b25
          speaker: martha
          text: “那也不奇怪。我告诉过你，鸟儿喜欢他，兔子、野绵羊和小马也喜欢他，就连狐狸都喜欢他。我倒想知道，迪肯见了你，会怎么想？”
        - id: ch01-b26
          speaker: mary_lennox
          text: “他不会喜欢我的。谁都不喜欢我。”
        - id: ch01-b27
          speaker: martha
          text: “那你自己呢？你喜欢自己吗？”
        - id: ch01-b28
          speaker: narrator
          text: 玛莎是真想知道。玛丽迟疑了一会儿，第一次认真想了想这个问题。
        - id: ch01-b29
          speaker: mary_lennox
          text: “不喜欢，一点儿也不喜欢。不过以前我从没想过。”
        - id: ch01-b30
          speaker: narrator
          text: 玛莎笑了一下，像是想起了家里的一桩旧事。
        - id: ch01-b31
          speaker: martha
          text: “妈妈也这样问过我。有一回，她在洗衣盆边忙，我却闹着脾气，不住嘴地说别人坏话。她转过身就说：‘你这个小泼辣货！站在这里，一会儿不喜欢这个，一会儿不喜欢那个。那你喜欢你自己吗？’我当场就笑了，脑子也马上清醒了。”
        - id: ch01-b32
          speaker: narrator
          text: 玛莎送来早饭，很快便兴高采烈地走了。她要穿过五英里的荒原回到小屋，帮妈妈洗衣服，烤好一家人这一星期吃的面包，再痛痛快快地过完这个休息日。
    - id: ch02
      title: 泥土里的春天
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 玛莎一离开宅子，玛丽觉得自己比平时更孤单。她赶紧跑进花园，先绕着喷泉花圃跑了十圈。每一圈她都仔细数着。跑完以后，心情总算好了一点。阳光让整座庄园变了样。深蓝的高空越过荒原，也罩住了米瑟斯韦特。玛丽不断抬头，想象自己躺在一小片白云上，跟着它四处飘，会是什么滋味。
        - id: ch02-b02
          speaker: narrator
          text: 她走进第一座厨房花园，看见本·韦瑟斯塔夫和另外两个园丁正在那里忙着翻土。好天气似乎也让老人精神了些，他竟然主动开口跟她说话。
        - id: ch02-b03
          speaker: ben_weatherstaff
          text: “春天快来了。你闻不出来吗？”
        - id: ch02-b04
          speaker: narrator
          text: 玛丽用力吸了吸鼻子，觉得自己好像真的闻见了。
        - id: ch02-b05
          speaker: mary_lennox
          text: “有一股很好闻的气味，又新鲜，又湿润。”
        - id: ch02-b06
          speaker: ben_weatherstaff
          text: “那是肥沃的好泥土。它心情正好，已经准备着长东西啦。播种的时节一来，泥土就高兴。冬天没活儿干，它也闷得慌。外面的花园里，黑土底下已经有东西醒过来了。太阳正给它们取暖。再等些日子，你会看见绿色的小尖芽从土里冒出来。”
        - id: ch02-b07
          speaker: mary_lennox
          text: “那些尖芽会长成什么？”
        - id: ch02-b08
          speaker: ben_weatherstaff
          text: “番红花、雪花莲，还有黄水仙。你以前没见过？”
        - id: ch02-b09
          speaker: mary_lennox
          text: “没有。印度的雨一下完，到处都又热又湿，绿油油的。我觉得那里的东西一夜就长出来了。”
        - id: ch02-b10
          speaker: ben_weatherstaff
          text: “这里的东西可不会一夜长成，你得耐心等。今天，这边的芽探高一点。明天，那边又顶出一截。它们这一天舒开一片叶子，下一天再舒开一片。你好好瞧着吧。”
        - id: ch02-b11
          speaker: mary_lennox
          text: “我会好好看的。”
    - id: ch03
      title: 知更鸟记得她
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 不一会儿，翅膀掠过的沙沙声又响了。玛丽马上认出，那只知更鸟回来了。它活泼又神气，在她脚边蹦来蹦去，还把头歪到一边，狡黠地打量她。玛丽忍不住问老人。
        - id: ch03-b02
          speaker: mary_lennox
          text: “你说，它还记得我吗？”
        - id: ch03-b03
          speaker: ben_weatherstaff
          text: “记得你？花园里每一截卷心菜根，它都认得，何况是人！它从没在这儿见过小丫头，一心想把你的事查个明白。你什么也别想瞒住它。”
        - id: ch03-b04
          speaker: mary_lennox
          text: “它住的那座花园呢？黑土下面也有东西开始生长了吗？”
        - id: ch03-b05
          speaker: narrator
          text: 老人的脸色又阴了下来，鼻子里哼了一声。
        - id: ch03-b06
          speaker: ben_weatherstaff
          text: “你说的是哪座花园？”
        - id: ch03-b07
          speaker: mary_lennox
          text: “就是长着老玫瑰树的那座。里面的花全死了吗？还是有些到了夏天会再长出来？那儿还会开玫瑰吗？”
        - id: ch03-b08
          speaker: narrator
          text: 玛丽实在太想知道，不可能忍住不问。
        - id: ch03-b09
          speaker: ben_weatherstaff
          text: “你去问它。只有这只鸟知道。十年来，除了它，再没有谁见过花园里面的样子。”
        - id: ch03-b10
          speaker: narrator
          text: 玛丽心想，十年真是好长一段日子。她正好也是十年前出生的。她慢慢走开，一路想着那座花园。现在，她开始喜欢它了。她还喜欢知更鸟、迪肯和玛莎的妈妈，甚至也开始喜欢玛莎。一个从不习惯喜欢别人的人，忽然有了这么多喜欢的伙伴，实在不少。她把知更鸟也算作一个“人”。
        - id: ch03-b11
          speaker: narrator
          text: 玛丽来到爬满常春藤的长墙外散步，从墙顶上方能看到里面的树梢。她才来回走了第二趟，一件最有趣、最叫人激动的事就发生了。而这一切，都是本·韦瑟斯塔夫的知更鸟带来的。
        - id: ch03-b12
          speaker: narrator
          text: 一阵啁啾声传过来。玛丽扭头一看，知更鸟就在左边空荡荡的花圃里。它跳来跳去，故意装成忙着从土里啄东西的样子，像是要让她相信，它才没有一路跟来。可是玛丽知道，它就是跟来了。她惊喜得身子几乎发起抖来。
        - id: ch03-b13
          speaker: mary_lennox
          text: “你真的记得我！你记得！你比世上所有东西都漂亮！”
          emotion: happy
        - id: ch03-b14
          speaker: narrator
          text: 玛丽学着小鸟啾啾叫，不停地说话哄它。知更鸟也一边蹦，一边翘动尾巴，还啁啾着回答，听起来真像在和她交谈。它的红背心亮得像缎子，小小的胸脯挺得高高的。它又神气，又威风，又漂亮，简直是在告诉玛丽，一只知更鸟也能像人一样了不起。
        - id: ch03-b15
          speaker: narrator
          text: 它没有飞走，还让玛丽一点点靠近。玛丽弯下腰，对它说话，又试着发出知更鸟一样的声音。她高兴得连自己从前有多乖戾都忘了。它竟然真的肯让她走得这么近！知更鸟知道，玛丽绝不会伸手抓它，也不会让它受一点惊吓。它当然明白，因为它是一个真正的“人”，只不过比所有人都更可爱。玛丽幸福得几乎不敢呼吸。
    - id: ch04
      title: 土里的旧钥匙
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 花圃里虽然没有花，却不是什么都没有。那些多年生花草已经割去枝叶，正在休息过冬。花圃后面还挤着高高低低的灌木。知更鸟在灌木底下跳动时，越过一小堆刚翻开的土，又停下来找虫子。原来有条狗想挖出鼹鼠，才在这里刨了一个很深的洞。
        - id: ch04-b02
          speaker: narrator
          text: 玛丽望着那个洞，其实不知道它是怎么来的。她看着看着，发现新土里埋着什么，只露出一点点。那东西像是生了锈的铁环，也可能是黄铜环。等知更鸟飞上旁边的树，她就伸手把它捡起来。可这并不是一只环，而是一把旧钥匙，看样子已经埋了很久。
        - id: ch04-b03
          speaker: narrator
          text: 玛丽小姐站起身，让钥匙挂在自己的指头上。她盯着它，脸上几乎露出了害怕的神情。最后，她压低声音说出了心里的猜想。
        - id: ch04-b04
          speaker: mary_lennox
          text: “它也许已经埋在这里十年了。也许，这就是那座花园的钥匙！”
          emotion: fearful
