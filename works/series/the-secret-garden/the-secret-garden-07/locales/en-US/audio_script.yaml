audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    martha:
      display_name: Martha
      tts:
        delivery: good-natured, candid, and broad in Yorkshire character
        timbre: rosy and sturdy
        pace: lively
        pitch: medium-high
    ben_weatherstaff:
      display_name: Ben Weatherstaff
      tts:
        delivery: gruff, plainspoken, and dryly expressive in Yorkshire character
        timbre: rough and earthy
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: The Key of the Garden
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Two days later, Mary opened her eyes, sat straight up in bed, and called to Martha.
        - id: ch01-b02
          speaker: mary
          text: Look at the moor! Just look at it!
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: >-
            The storm was over. During the night, the wind had swept away the gray mist and clouds, then the wind itself had stopped. Now a brilliant deep-blue sky curved high above the moor. Mary had never, ever dreamed a sky could be so blue. The skies in India had been hot and blazing. This blue was deep and cool, sparkling almost like the water of a beautiful lake with no bottom. Here and there, small clouds as white as snowy fleece floated high overhead. The wide world of the moor had changed too. Instead of looking dark purple, black, or horribly gray, it looked soft and blue.
        - id: ch01-b04
          speaker: martha
          text: >-
            Aye, the storm's gone for a while. This happens around this time of year. One night the storm's carrying on, and the next morning you'd think it had never come at all. That's how you know spring is coming. It's still a long way off, but it's on its way.
          emotion: happy
        - id: ch01-b05
          speaker: mary
          text: I thought England might always be rainy and dark.
        - id: ch01-b06
          speaker: narrator
          text: Martha sat back on her heels among the brushes she used to polish the grate.
        - id: ch01-b07
          speaker: martha
          text: Eh, nowt of the sort!
        - id: ch01-b08
          speaker: mary
          text: What does that mean?
        - id: ch01-b09
          speaker: narrator
          text: >-
            Mary asked quite seriously. In India, the native people spoke many different dialects, and only a few people could understand each one. So when Martha used words Mary did not know, there seemed nothing strange about it.
        - id: ch01-b10
          speaker: narrator
          text: Martha laughed, just as she had on that first morning.
        - id: ch01-b11
          speaker: martha
          text: >-
            There I go talking broad Yorkshire again, when Mrs. Medlock told me not to. "Nowt of the sort" means "nothing of the sort." But that takes so long to say! When the sun shines, Yorkshire's the sunniest place on earth. I told thee the moor would grow on thee. Wait till the gorse and broom are covered in gold, and the heather's full of little purple bells. There'll be hundreds of butterflies, bees humming, and skylarks flying up and singing. Tha'll want to be out there at sunrise and stay all day, the way Dickon does.
        - id: ch01-b12
          speaker: mary
          text: Could I ever go all the way out there?
        - id: ch01-b13
          speaker: narrator
          text: >-
            She looked longingly through the window at that faraway blue. It was so new, so vast, and so wonderful.
        - id: ch01-b14
          speaker: martha
          text: >-
            I don't know. Seems to me tha's hardly used thy legs since tha was born. Tha couldn't walk five miles, and it's five miles to our cottage.
        - id: ch01-b15
          speaker: mary
          text: I'd like to see your cottage.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Martha stared at her for a moment before picking up her polishing brush and rubbing the grate again. She was thinking about Mary's small plain face. It did not look nearly as sour as it had on their first morning together. Right now, it looked a little like her sister Susan Ann's face whenever Susan Ann wanted something very badly.
        - id: ch01-b17
          speaker: martha
          text: >-
            I'll ask Mother. She's the sort who can nearly always find a way to do things. Today's my day off, and I'm going home. Eh, I'm glad! Mrs. Medlock thinks highly of Mother. Maybe Mother could talk to her.
          emotion: happy
        - id: ch01-b18
          speaker: mary
          text: I like your mother.
        - id: ch01-b19
          speaker: martha
          text: Course tha does.
        - id: ch01-b20
          speaker: mary
          text: But I've never met her.
        - id: ch01-b21
          speaker: martha
          text: No, tha hasn't.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Martha sat back on her heels again and rubbed the end of her nose with the back of her hand. She looked puzzled for a moment, but then she gave her answer as if she were completely sure of it.
        - id: ch01-b23
          speaker: martha
          text: >-
            Well, she's sensible and hardworking, and she's good-natured and clean. Nobody could help liking her, whether they'd met her or not. When I go home on my day off, I feel like jumping for joy the whole way across the moor.
          emotion: happy
        - id: ch01-b24
          speaker: mary
          text: I like Dickon too, and I've never met him either.
        - id: ch01-b25
          speaker: martha
          text: >-
            Well, I've told thee. The birds like him, and so do the rabbits, wild sheep, ponies, and even the foxes. I wonder what Dickon would make of thee.
        - id: ch01-b26
          speaker: mary
          text: He wouldn't like me. Nobody does.
        - id: ch01-b27
          speaker: narrator
          text: Mary said it in her stiff, cold little way. Martha considered her again.
        - id: ch01-b28
          speaker: martha
          text: Well, how does tha like thysel'?
        - id: ch01-b29
          speaker: narrator
          text: >-
            She sounded honestly curious. Mary stopped to think about it.
        - id: ch01-b30
          speaker: mary
          text: I don't like myself at all, really. But I never thought about it before.
        - id: ch01-b31
          speaker: narrator
          text: Martha grinned, remembering something familiar.
        - id: ch01-b32
          speaker: martha
          text: >-
            Mother said that to me once. She was at the washtub, and I was in a foul temper, saying nasty things about everybody. She turned around and said, "Listen to thee, young vixen! Tha stands there saying tha doesn't like this one and tha doesn't like that one. But how does tha like thysel'?" I started laughing, and it brought me to my senses right away.
        - id: ch01-b33
          speaker: narrator
          text: >-
            As soon as she had served Mary's breakfast, Martha left in high spirits. She was going to walk five miles across the moor to the cottage. Once she got there, she would help her mother with the washing, do all the baking for the week, and enjoy herself thoroughly.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Once Mary knew Martha was no longer in the house, she felt lonelier than ever. She went outside as quickly as she could. The first thing she did was run around and around the fountain flower garden ten times. She counted every lap carefully, and when she had finished, her spirits had lifted.
        - id: ch01-b35
          speaker: narrator
          text: >-
            The sunshine made the whole place look different. The same high, deep-blue sky stretched over Misselthwaite and the moor. Mary kept lifting her face to look into it. She tried to imagine what it would be like to lie down on one of those little snow-white clouds and float around in the blue.
        - id: ch01-b36
          speaker: narrator
          text: >-
            In the first kitchen garden, she found Ben Weatherstaff working beside two other gardeners. The bright weather seemed to have done him good. For once, he spoke before Mary did.
        - id: ch01-b37
          speaker: ben_weatherstaff
          text: Spring's coming. Can't tha smell it?
        - id: ch01-b38
          speaker: narrator
          text: Mary sniffed the air. She thought perhaps she could.
        - id: ch01-b39
          speaker: mary
          text: I smell something fresh and damp. Something nice.
        - id: ch01-b40
          speaker: ben_weatherstaff
          text: >-
            That's the good rich earth. It's in a fine mood, getting ready to grow things. The earth's glad when planting time comes. Winter's dull, with nowt for it to do. Out in the flower gardens, things are waking underneath the dark soil. The sun's warming them. Before long, tha'll see little green points pushing through the black earth.
        - id: ch01-b41
          speaker: mary
          text: What will they turn into?
        - id: ch01-b42
          speaker: ben_weatherstaff
          text: Crocuses, snowdrops, and daffydowndillies. Has tha never seen those?
        - id: ch01-b43
          speaker: mary
          text: >-
            No. In India, everything is hot and wet and green after the rains. I think the plants grow up overnight.
        - id: ch01-b44
          speaker: ben_weatherstaff
          text: >-
            These won't. Tha'll have to wait. One will poke up a little higher. Another will push out a point. A leaf will open one day, then another leaf the next. Keep watching them.
        - id: ch01-b45
          speaker: mary
          text: I will.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Before long, Mary heard the soft, rustling flight of wings and knew at once that the robin had returned. He was lively and bold. He hopped very close to her feet, cocked his head to one side, and looked at her so slyly that she had to ask Ben a question.
        - id: ch01-b47
          speaker: mary
          text: Do you think he remembers me?
        - id: ch01-b48
          speaker: ben_weatherstaff
          text: >-
            Remembers thee? He knows every cabbage stump in these gardens, never mind the people. He's never seen a little wench here before, and he means to learn everything about thee. No use trying to hide anything from him.
        - id: ch01-b49
          speaker: mary
          text: >-
            In the garden where he lives, are things waking under the dark soil too?
        - id: ch01-b50
          speaker: ben_weatherstaff
          text: What garden?
        - id: ch01-b51
          speaker: narrator
          text: Ben had turned surly again.
        - id: ch01-b52
          speaker: mary
          text: >-
            The one with the old rosebushes. Are all its flowers dead, or do some come back in summer? Does it ever have roses?
        - id: ch01-b53
          speaker: narrator
          text: >-
            She could not stop herself. She wanted the answer too badly.
        - id: ch01-b54
          speaker: ben_weatherstaff
          text: >-
            Ask him. He's the only one who knows. Nobody else has looked inside for ten years.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Ten years was a very long time, Mary thought. It was exactly as long as her whole life.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Mary walked away slowly, thinking as she went. She had begun to like the garden, just as she had begun to like the robin, Dickon, and Martha's mother. She was starting to like Martha too. For someone who was not used to liking anybody, that was quite a few people to care about. And in Mary's mind, the robin certainly counted as a person.
        - id: ch01-b57
          speaker: narrator
          text: >-
            She went back to the path outside the long wall covered in ivy, where the treetops showed above it. On her second walk up and down, the most exciting thing happened, and it happened because of Ben Weatherstaff's robin.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Mary heard a chirp and a twitter. There he was in the bare flower bed to her left, hopping around and pretending to peck at the earth as if he had not followed her at all. But Mary knew he had. The surprise delighted her so much that she nearly trembled.
        - id: ch01-b59
          speaker: mary
          text: You do remember me! You do! You're prettier than anything in the whole world!
          emotion: happy
        - id: ch01-b60
          speaker: narrator
          text: >-
            Mary chirped to him. She talked and coaxed, while the robin hopped around, flirted his tail, and twittered back as though he were talking too. His red waistcoat shone like satin. He puffed out his tiny breast and looked so fine, grand, and pretty that he seemed to be showing her just how important and human a robin could be.
        - id: ch01-b61
          speaker: narrator
          text: >-
            The robin let her come closer and closer. Mistress Mary bent down, talked to him, and tried to make little robin sounds. She forgot she had ever been contrary in her life. Just think, he was truly letting her come that near! He knew nothing could make her reach out a hand or startle him in even the smallest way. Of course he knew. He was a real person, only nicer than any other person in the world. Mary was so happy she hardly dared breathe.
        - id: ch01-b62
          speaker: narrator
          text: >-
            The flower bed had no flowers now. Its perennial plants had been cut down for their winter rest. But tall and low shrubs still grew together at the back. The robin hopped beneath them and crossed a little mound of freshly turned earth. He stopped there to hunt for a worm.
        - id: ch01-b63
          speaker: narrator
          text: >-
            A dog had scratched a deep hole while trying to dig up a mole. Mary did not know that. She only noticed something nearly buried in the loose soil. It looked like a ring made of rusty iron or brass.
        - id: ch01-b64
          speaker: narrator
          text: >-
            When the robin flew into a nearby tree, Mary reached down and picked up the ring. But it was more than a ring. It was an old key, and it looked as if it had been underground for a long, long time.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Mistress Mary stood and stared at the key hanging from her finger. Her face was almost frightened.
        - id: ch01-b66
          speaker: mary
          text: >-
            Maybe it's been buried for ten years. Maybe this is the key to the garden!
          emotion: fearful
