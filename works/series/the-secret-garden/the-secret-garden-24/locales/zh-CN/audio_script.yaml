audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
    dickon:
      display_name: 迪肯
      tts: {delivery: 质朴自在，带浓重而亲切的约克郡乡音, timbre: 清亮温厚，带荒原少年的蓬勃气息, pace: 轻快从容, pitch: 中高音}
    mrs_sowerby:
      display_name: 索尔比太太
      tts: {delivery: 慈爱爽朗，说话朴实又有主见, timbre: 温暖丰厚, pace: 从容, pitch: 中音}
    nurse:
      display_name: 护士
      tts: {delivery: 恭谨克制，惊讶时仍尽力保持规矩, timbre: 柔和朴实, pace: 中等, pitch: 中音}
    dr_craven:
      display_name: 克雷文医生
      tts: {delivery: 谨慎而略显焦躁，话里常带犹疑, timbre: 清晰偏薄, pace: 中等, pitch: 中音}
    mrs_medlock:
      display_name: 梅德洛克太太
      tts: {delivery: 严厉能干，慌乱时语速陡然加快, timbre: 结实洪亮, pace: 中等, pitch: 中音}
  chapters:
    - id: ch01
      title: 暮色里的秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 秘密花园并不是迪肯照料的唯一一座花园。荒原小屋四周，有块地围着低矮的粗石墙。每天清早，天色渐暗的黄昏，还有科林和玛丽整天见不到他的那些日子，他都在那里替母亲栽种或照料土豆、卷心菜、芜菁、胡萝卜和香草。那些“动物朋友”陪着他，他能在地里创造出种种奇迹，而且好像永远不知道累。掘土除草时，他不是吹口哨、唱几句约克郡荒原上的歌，就是同煤灰、队长说话。有时，他也同那些被他教会帮忙干活的弟弟妹妹聊个不停。
        - id: ch01-b02
          speaker: mrs_sowerby
          text: “要没有迪肯的菜园，咱家哪能过得这么舒坦。什么到了他手里都肯长。他种的土豆和卷心菜，比别人家的大一倍，滋味也没人比得上。”
        - id: ch01-b03
          speaker: narrator
          text: 索尔比太太一有空就到园里陪他说话。晚饭后，暮色还又长又亮，正好继续干活，那也是她一天里最清静的时候。她坐在矮墙上，一面看儿子劳作，一面听他讲当天的故事。她最爱这样的时光。园里不只种菜。迪肯时不时会花一便士买包花籽，在醋栗和卷心菜中间撒下芬芳鲜亮的花。他沿园边种着木犀草、石竹和三色堇，也种那些能年年留籽的花。还有些花木不用留籽，根留在土里，每到春天便重新开放，过上几年就会蔓生成锦簇的花丛。矮墙上的每道缝里都塞着荒原上的毛地黄、蕨类、岩生水芹和篱边野花，最后只零星露出几块石头，成了约克郡最美的景物之一。
        - id: ch01-b04
          speaker: dickon
          text: “妈，要它们长得好，只消真心跟它们做朋友。它们跟俺那些动物朋友一样，渴了就给水，饿了就喂点吃的。它们也跟咱们一样想活下去。要是它们死了，俺会觉得自个儿是个坏小子，狠心亏待了它们。”
        - id: ch01-b05
          speaker: narrator
          text: 就在这些黄昏里，索尔比太太听说了庄园里发生的事。起初，她只知道科林少爷近来爱和玛丽小姐到外面去，而且身体好多了。不久，两个孩子便答应让迪肯的母亲也知道秘密。他们从没怀疑过，她绝对靠得住。
        - id: ch01-b06
          speaker: narrator
          text: 一个宁静美丽的晚上，迪肯把一切都讲了出来。埋在土里的钥匙、替玛丽引路的知更鸟、笼罩花园的灰雾，还有那片灰色怎样看起来像彻底死去了一样，他一点没漏。玛丽原本打算把这个秘密永远守下去，后来迪肯来了，她又怎样告诉了他。科林听说花园时先是不肯相信，最后却终于进入了那片藏起来的天地。迪肯还讲到本·韦瑟斯塔夫那张怒气冲冲的脸怎样突然冒上墙头，科林少爷又怎样一下子怒火满腔，竟然靠着那股力量站了起来。所有惊心动魄的细节连到一起，听得索尔比太太那张端秀的脸变了好几回颜色。
        - id: ch01-b07
          speaker: mrs_sowerby
          text: “我的老天！那个小姑娘来到庄园，真是件大好事。她自个儿变好了，也把他救了。两只脚站起来啦！咱们以前还都以为，那可怜孩子神志不清，浑身没一根骨头长得直呢。”
        - id: ch01-b08
          speaker: narrator
          text: 她问了许多事，一双蓝眼睛里全是沉思。
        - id: ch01-b09
          speaker: mrs_sowerby
          text: “他现在身体好，心情也好，再不抱怨了，庄园里的人怎么想？”
        - id: ch01-b10
          speaker: dickon
          text: “他们都弄不明白。他的脸一天一个样，慢慢丰满了，也不再尖尖的，那层蜡黄快要退干净啦。不过，他还是得偶尔抱怨几声。”
        - id: ch01-b11
          speaker: mrs_sowerby
          text: “看在老天的分上，他为什么要这么做？”
        - id: ch01-b12
          speaker: narrator
          text: 迪肯笑出了声。
        - id: ch01-b13
          speaker: dickon
          text: “他不想叫人猜到。医生要是知道他能站起来，准会写信给克雷文老爷。科林少爷想亲口告诉父亲。他每天都要在腿上施展魔法，练到父亲回来，再径直走进房里，让父亲瞧瞧，他也能像别的男孩一样站直。可眼下，他和玛丽小姐觉得，最好时不时哼哼几声，发发脾气，把大家的疑心引开。”
        - id: ch01-b14
          speaker: narrator
          text: 话还没说完，索尔比太太已经低声笑起来，笑得又舒畅又温暖。
        - id: ch01-b15
          speaker: mrs_sowerby
          text: “那两个孩子准玩得快活极了！演这场戏，够他们找出好多乐子。孩子最爱演戏。迪肯，乖孩子，快说说他们怎么演。”
        - id: ch01-b16
          speaker: narrator
          text: 迪肯停下除草的手，跪坐在脚后跟上，眼睛里闪着顽皮的光。
        - id: ch01-b17
          speaker: dickon
          text: “科林少爷每回出去，都让人从楼上抱下来，安顿进轮椅。他还冲着男仆约翰发火，骂人家抱得不够小心。他把自个儿装得能有多无力就多无力，没走到屋里人看不见的地方，绝不抬一下头。别人把他往轮椅里放时，他还得哼哼唧唧，烦躁好一阵。如今他和玛丽小姐都演上瘾了。他一呻吟、一抱怨，玛丽小姐就在旁边说：‘可怜的科林，真有那么疼吗？你怎么虚弱成这样啦，可怜的科林？’可他俩有时憋得太辛苦，差点当场笑出声。一进花园，他们就笑啊笑，直笑到再也喘不上气。附近要是有园丁，他俩还得把脸埋进科林少爷的靠垫，免得叫人听见。”
        - id: ch01-b18
          speaker: mrs_sowerby
          text: “笑得越多越好！孩子这样痛快地笑，哪天都比吃药管用。他俩准会长得胖乎乎的。”
        - id: ch01-b19
          speaker: dickon
          text: “已经在长胖啦。他俩饿得厉害，又不知道怎么吃饱才不惹人议论。科林少爷说，要是总叫人多送吃的，谁还信他有病？玛丽小姐愿意把自个儿那份给他，可他说她要是饿瘦了也不成。他俩得一块儿胖起来。”
        - id: ch01-b20
          speaker: narrator
          text: 索尔比太太听了，笑得前仰后合，蓝斗篷也跟着来回摇，迪肯陪她一同大笑。
        - id: ch01-b21
          speaker: mrs_sowerby
          text: “孩子，我有办法了。往后你早晨去见他们时，带上一桶上好的鲜奶。我再烤一只外皮焦脆的家常面包，或是做些你们孩子都爱吃的葡萄干小圆面包。再没有什么比鲜奶和面包更养人。他们先在自己的园子里吃一点，把那阵最难受的饥饿压下去。回到屋里，再用那些精细饭菜把肚子里剩下的角角落落填满。”
        - id: ch01-b22
          speaker: dickon
          text: “妈，你真了不起！什么难题你都有法子。昨天他俩急坏了，肚里空得难受，又想不出怎样才能不多叫吃的。”
        - id: ch01-b23
          speaker: mrs_sowerby
          text: “两个孩子都在飞快长个子，身体也一块儿好起来了。这样的孩子饿起来就像两只小狼，吃下去的东西会变成他们的血和肉。哎呀，他们两个可真会享受这段日子，准错不了。”
    - id: ch02
      title: 一场精彩的戏
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这位叫人安心而又神奇的母亲完全说对了。尤其是她说那场戏会叫两个孩子无比快活时，更是再对不过。科林和玛丽把保护秘密、躲开怀疑这件事，变成了最激动人心的乐趣之一。这个主意并不是他们凭空想出来的。最先无意间提醒他们要提防疑心的，是那位满脸不解的护士，接着又是克雷文医生本人。
        - id: ch02-b02
          speaker: nurse
          text: “科林少爷，您的胃口好得多啦。从前您什么也不吃，好些东西一吃就不舒服。”
        - id: ch02-b03
          speaker: colin_craven
          text: “现在什么都不会让我不舒服了。至少……不常有东西让我不舒服。这都是新鲜空气的功劳。”
        - id: ch02-b04
          speaker: nurse
          text: “也许吧。不过这件事，我得和克雷文医生谈谈。”
        - id: ch02-b05
          speaker: mary_lennox
          text: “她刚才一直盯着你，好像认定里面有名堂可查。”
        - id: ch02-b06
          speaker: colin_craven
          text: “我不许她查出来。现在谁也不能开始察觉。”
        - id: ch02-b07
          speaker: narrator
          text: 那天早晨，克雷文医生来时也一脸疑惑。他问个不停，科林很不耐烦。
        - id: ch02-b08
          speaker: dr_craven
          text: “你常常在花园里待上一整天。你究竟去了哪里？”
        - id: ch02-b09
          speaker: narrator
          text: 科林摆出那副最拿手的威严神气，仿佛压根儿不在乎别人的看法。
        - id: ch02-b10
          speaker: colin_craven
          text: “我不会告诉任何人。我去的是自己喜欢的地方，所有人都接到命令，必须躲开。我不许别人监视我，也不许他们盯着我看。这个你明明知道！”
        - id: ch02-b11
          speaker: dr_craven
          text: “你虽然整天在外面，身体倒没受害，我想没有。护士还说，你吃得比从前多得多。”
        - id: ch02-b12
          speaker: colin_craven
          text: “也许那是一种不正常的胃口。”
        - id: ch02-b13
          speaker: dr_craven
          text: “食物没有让你难受，胃口就不算不正常。你长肉很快，脸色也更好了。”
        - id: ch02-b14
          speaker: colin_craven
          text: “也许我是浮肿，还发着烧。活不久的人，常常会变得……和平时不一样。”
        - id: ch02-b15
          speaker: narrator
          text: 医生摇摇头，握住他的手腕，又推开衣袖摸了摸胳膊。
        - id: ch02-b16
          speaker: dr_craven
          text: “你没发烧，长的也都是健康结实的肉。孩子，只要这样好下去，我们就不用再谈死。你父亲听说你恢复得这么惊人，一定很高兴。”
        - id: ch02-b17
          speaker: colin_craven
          text: “不许告诉他！要是我的病又重了，只会让他失望。今晚就可能恶化，我也许会发高烧。我现在就觉得快烧起来了。不许写信给父亲，不许，不许！你明知道生气伤身体，还偏来惹我。我已经浑身发热了。你们写信谈我，在背后议论我，我讨厌这些，就跟讨厌别人盯着我一样！”
          emotion: angry
        - id: ch02-b18
          speaker: dr_craven
          text: “嘘，孩子。没有你的允许，谁也不会写。你对这些事太敏感了，可别毁掉已经养出的好身体。”
          emotion: calm
        - id: ch02-b19
          speaker: narrator
          text: 医生果然不再提信。他还私下告诫护士，绝不能在病人面前说起这件事。
        - id: ch02-b20
          speaker: dr_craven
          text: “这孩子好得出奇，快得几乎不正常。当然，我们过去逼他也不肯做的事，现在他自己愿意做了。可他仍然很容易激动，别说话刺激他。”
        - id: ch02-b21
          speaker: narrator
          text: 玛丽和科林都吓了一跳，忧心忡忡地商量起来。他们的演戏计划，正是从这时开始的。
        - id: ch02-b22
          speaker: colin_craven
          text: “我可能非得大发一场脾气。其实我一点也不想发，而且现在过得不够难受，恐怕逼不出从前那种大脾气。说不定我已经根本发不出来了。以前那个硬块现在不会再冒到喉咙里，我脑子里总在想好事，也不会一直想着那些可怕的东西。可是，他们要是又说给父亲写信，我就必须做点什么来阻止。”
        - id: ch02-b23
          speaker: narrator
          text: 科林决定少吃一点，可这个自以为聪明的主意根本行不通。他每天早晨一醒来，就饿得惊人。沙发旁的桌子偏又摆满早餐，有自家烤的面包、新鲜黄油、雪白的鸡蛋、覆盆子果酱，还有厚厚的凝脂奶油。玛丽总陪他吃早餐。两人在桌旁坐好，已经很难管住胃口。要是滚烫的银餐盖下还藏着几片细嫩火腿，滋滋冒响，诱人的香气不停往外钻，他们便只能绝望地望进对方眼里，心里明明知道这一顿又不可能省下多少。
        - id: ch02-b24
          speaker: colin_craven
          text: “玛丽，今天早晨恐怕还得全部吃光。午饭可以退掉一些，晚饭多退一点。”
        - id: ch02-b25
          speaker: narrator
          text: 可他们从没退掉过任何东西，每顿都吃得干干净净。送回食品间的空盘子亮得像擦过一样，惹来不少议论。
        - id: ch02-b26
          speaker: colin_craven
          text: “我真希望火腿能切厚点。每人只给一个松饼，怎么可能够？”
        - id: ch02-b27
          speaker: mary_lennox
          text: “快死的人吃一个就够，可要活下去的人不够。荒原上石南和金雀花的香气从窗外涌进来时，我有时觉得自己能吃三个。”
    - id: ch03
      title: 魔法的食物与运动
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天早晨，三个孩子已经在园里痛痛快快地过了两个钟头。迪肯忽然绕到一大丛玫瑰后面，提出两只白铁桶。一桶装着浓香的鲜奶，表面浮着一层奶油。另一桶里是农舍刚烤好的葡萄干小圆面包，仔细包在一块干净的蓝白餐巾里，裹得严严实实，摸上去还是热的。花园里立刻爆发出一场又惊又喜的欢腾。索尔比太太怎么会想到这样棒的办法？她一定是位多么善良、多么聪明的女人！那面包怎么会这么好吃，鲜奶又怎么会这样香甜！
        - id: ch03-b02
          speaker: colin_craven
          text: “她和迪肯一样，身上也有魔法。魔法让她想出许多好办法。她是有魔法的人。迪肯，请告诉她，我们万分感激。”
        - id: ch03-b03
          speaker: narrator
          text: 科林有时喜欢说些老成的大话。方才那句让他很得意，他便又说得更庄严些。
        - id: ch03-b04
          speaker: colin_craven
          text: “告诉她，她对我们慷慨至极，我们的感激也深切至极。”
        - id: ch03-b05
          speaker: narrator
          text: 说完，他马上忘了自己那副庄严气派，扑过去把圆面包一个劲儿往嘴里塞，又捧着桶，一口接一口地大喝鲜奶。他刚做过从前从不会做的运动，呼吸了荒原上的新鲜空气，离早餐也过去两个多钟头。此刻的他，和任何一个饿坏了的小男孩再没有半点分别。
        - id: ch03-b06
          speaker: narrator
          text: 这只是个开头。从此以后，同样惬意的事情接二连三地发生。两个孩子后来忽然醒悟，索尔比太太本来就得替十四个人预备食物，未必天天都有足够的东西，再填饱额外的两张嘴。于是，他们请她准许自己送些先令过去，用那些钱添买每天送到园里来的食物。
        - id: ch03-b07
          speaker: narrator
          text: 迪肯还在花园外的庄园树林里找到一处深深的小洼地。玛丽最初见他给野生动物吹笛子，就是在那里。用几块石头垒起来，便能做成一座小小的炉子，在里头烤土豆和鸡蛋。孩子们以前谁也不知道，烤鸡蛋竟是这样的美味。刚出炉的土豆滚烫滚烫，掰开以后塞进盐和新鲜黄油，简直配得上林中之王享用，而且吃完以后，肚子满足极了。土豆和鸡蛋都能花钱买来，他们想吃多少都行，也不会觉得自己正从索尔比家那十四个人的嘴边抢走食物。
        - id: ch03-b08
          speaker: narrator
          text: 每个晴朗的早晨，他们仍会在梅树下面围成神秘圆圈，施展魔法。短短的花期结束以后，枝叶一天比一天浓密，在头顶撑开了一顶绿色华盖。仪式结束，科林照例练习走路。一整天里，只要有机会，他也会一次次试用自己新发现的力量。他一天比一天强壮，脚步越来越稳，能走的路也越来越远。看见这些变化，他对魔法的信念当然也越来越深。他感到身体正在恢复，便一个接一个地尝试新办法。其中最棒的一套，是迪肯离开一天之后带回来的。
        - id: ch03-b09
          speaker: dickon
          text: “昨天俺替妈去斯韦特，在蓝牛旅店附近见到鲍勃·霍沃思。他是荒原上最有力气的人，是摔跤冠军，跳得最高，链球也掷得最远，有几年还去苏格兰比赛。他从俺小时候就认识俺，待人又和气，俺便问他：‘鲍勃，你怎么把肌肉练得鼓起来的？是不是特意练过？’他说：‘练过。从前有个演出团来斯韦特，里头的大力士教俺怎样练胳膊、腿，还有全身每块肌肉。’俺又问：‘身体单薄的人照着练，能不能变壮？’他笑着问是不是俺。俺说不是，是一位久病之后正在恢复的小少爷，俺想学几招告诉他。俺没说名字，他也没问。他站起来把动作全做给俺看，俺跟着一遍遍学，直到全记住了。”
        - id: ch03-b10
          speaker: narrator
          text: 科林听得满心激动。
        - id: ch03-b11
          speaker: colin_craven
          text: “你能做给我看吗？你愿意教我吗？”
        - id: ch03-b12
          speaker: dickon
          text: “当然愿意。不过鲍勃说，你刚开始得慢慢练，别累着。中间要休息，也要深呼吸，千万别练过头。”
        - id: ch03-b13
          speaker: colin_craven
          text: “我会小心。快做给我看！迪肯，你是世上最有魔法的男孩！”
          emotion: happy
        - id: ch03-b14
          speaker: narrator
          text: 迪肯站在草地上，把一套简单而实用的肌肉练习慢慢做了一遍。每个动作他都做得仔细稳当。科林越看眼睛睁得越大。他坐着的时候，已经能跟着做其中几招。过了一会儿，他又用那双已经站稳的脚立在地上，小心地做了几个动作。玛丽看着有趣，也跟在旁边练起来。煤灰一直蹲在树枝上观看这场表演，却发现自己根本没法照着他们做。它急得不得了，只好离开树枝，落到地上焦躁地跳来跳去。
        - id: ch03-b15
          speaker: narrator
          text: 从那天起，练习和魔法一样，成了每天必做的功课。科林和玛丽每试一次，下一回就能多做几个动作。运动带来的胃口也大得惊人，要不是迪肯每天早晨一到，就把食物篮子藏在灌木后面，他们简直不知道该怎么办。小洼地里的炉子和索尔比太太送来的美食，总能把他们填得饱饱的，却让梅德洛克太太、护士和克雷文医生越来越不解。肚里若已经塞满烤鸡蛋、烤土豆、带着厚厚奶沫的鲜奶、燕麦饼、小圆面包、石南花蜜和凝脂奶油，谁都能在早餐时只吃一点点，到了晚餐，又摆出一副对满桌好菜不屑一顾的模样。
    - id: ch04
      title: 让他们笑吧
      blocks:
        - id: ch04-b01
          speaker: nurse
          text: “他们几乎什么都没吃。再不劝他们吃点东西，非饿死不可。可是，你再看看他们的样子！”
        - id: ch04-b02
          speaker: mrs_medlock
          text: “看看他们！哎呀，我都快叫这两个孩子折腾死了。他们简直是一对小撒旦。前一天还胖得快把外套撑破，第二天却对厨娘想尽办法端出来的好饭好菜挑三拣四。昨天那只鲜嫩的小鸡配面包酱，多么好吃，他们连一叉子都没碰。可怜的厨娘费尽心思，甚至特地给他们‘发明’了一道布丁，结果也原封不动退了回来。她差一点就哭了，生怕这两个孩子真把自个儿饿进坟墓，到头来别人会把责任全怪在她身上。”
        - id: ch04-b03
          speaker: narrator
          text: 克雷文医生来了，站在那里久久而仔细地打量科林。护士同他说起孩子不吃饭，又拿出特地留下的早餐托盘，里面几乎一点都没动。这时他的神情已经忧虑不已。可等他坐到沙发边，亲手给科林检查，脸上的忧虑反倒更深了。他有事去了伦敦，快两个星期没见到这个男孩。年轻的生命一开始恢复健康，就会好得飞快。科林皮肤上的蜡黄已经退去，底下透出温暖的玫瑰色。他那双美丽的眼睛清澈明亮，眼下、脸颊和太阳穴原有的凹陷也全丰满起来。从前又黑又沉的头发，如今看起来健康地从额前蓬松生长，柔软温暖，充满生命。嘴唇也变得饱满，有了正常的颜色。说实在的，要装成一个久病不愈的孩子，他这副模样实在太不合格。克雷文医生用一只手托着下巴，细细端详着他，心里怎么也想不明白。
        - id: ch04-b04
          speaker: dr_craven
          text: “听说你什么都不吃，我很遗憾。这样可不行。你好不容易养回来的身体会重新垮掉，而且你已经好得惊人。前些日子，你还吃得很好。”
        - id: ch04-b05
          speaker: colin_craven
          text: “我告诉过你，那是一种不正常的胃口。”
        - id: ch04-b06
          speaker: narrator
          text: 玛丽当时正坐在旁边的小凳子上。听到科林一本正经地重复那句“不正常的胃口”，她突然发出一个十分古怪的声音。她拼命想把那个声音压回去，忍得实在太用力，结果反而差点把自己呛住。
        - id: ch04-b07
          speaker: dr_craven
          text: “你怎么了？”
        - id: ch04-b08
          speaker: narrator
          text: 玛丽马上摆出十分严肃的样子。
        - id: ch04-b09
          speaker: mary_lennox
          text: “那声音有点像喷嚏，又有点像咳嗽。它突然钻进我的喉咙了。”
        - id: ch04-b10
          speaker: narrator
          text: 她当着医生的面守住了秘密。等两人单独在一起时，她才把刚才差点笑出声的真正缘故告诉科林。
        - id: ch04-b11
          speaker: mary_lennox
          text: “我实在忍不住。声音自己冲了出来。我突然想起你吃的最后一个大土豆，还想起你咬开那层又厚又香、涂着果酱和凝脂奶油的面包皮时，嘴巴张得有多大。”
        - id: ch04-b12
          speaker: dr_craven
          text: “那两个孩子有没有可能偷偷弄到食物？”
        - id: ch04-b13
          speaker: narrator
          text: 医生这样问梅德洛克太太。
        - id: ch04-b14
          speaker: mrs_medlock
          text: “除非他们从土里挖出来，或从树上摘下来，否则绝不可能。他们整天在庄园里，只见得到彼此。再说，送上去的饭菜以外，他们想吃什么，只要开口吩咐就行。”
        - id: ch04-b15
          speaker: dr_craven
          text: “既然不吃东西反倒让他们气色这么好，我们就不必操心。这个男孩已经脱胎换骨了。”
        - id: ch04-b16
          speaker: mrs_medlock
          text: “那个女孩也脱胎换骨了。她长胖以后，那副又丑又尖酸的小模样不见了，如今简直开始变漂亮啦。头发越长越浓，看起来也健康，脸上还有了鲜亮的血色。从前她是个再阴沉、再不好相处不过的小东西。现在呢，她和科林少爷凑到一起，笑得像一对疯疯癫癫的小家伙。说不定他们就是靠那些笑声长胖的。”
        - id: ch04-b17
          speaker: dr_craven
          text: “也许真是这样。让他们笑吧。”
