  chapters:
    - id: ch01
      title: Dickon's Other Garden
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The secret garden was not the only garden Dickon tended. Around his family's cottage on the moor, a low wall of rough stones enclosed another patch of earth. He worked there early in the morning, late in the long twilight, and whenever Colin and Mary did not see him. He planted potatoes, cabbages, turnips, carrots, and herbs for his mother. With his creatures nearby, he seemed able to work wonders without ever getting tired. As he dug and weeded, he whistled, sang pieces of old moor songs, or talked to Soot and Captain and the brothers and sisters he had taught to help him.
        - id: ch01-b02
          speaker: mrs_sowerby
          text: >-
            We wouldn't manage nearly so comfortably without Dickon's garden. Anything will grow for that lad. His potatoes and cabbages come up twice the size of anyone else's, and nobody else's taste half as good.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Whenever Mrs. Sowerby had a spare moment, she liked to go outside and talk with him. Her quiet time came after supper, when the twilight still gave them plenty of light. She would sit on the rough wall, watch Dickon work, and listen to everything that had happened that day.

            Vegetables were not the only things growing there. Now and then Dickon bought a penny packet of flower seeds. He planted bright, sweet-smelling flowers between the gooseberry bushes and even among the cabbages. Mignonette, pinks, and pansies made borders around the beds. Some gave him seeds to save for the next year. Others had roots that flowered every spring and slowly spread into handsome clumps. He had tucked foxgloves from the moor, ferns, rock-cress, and flowers from the hedgerows into every crack in the low wall. Only a few bits of stone still showed. It had become one of the prettiest walls in Yorkshire.
        - id: ch01-b04
          speaker: dickon
          text: >-
            There's only one thing a fellow needs to do to help them thrive, Mother. Be their friend. Plants are like the creatures. Give them a drink when they're thirsty and a bit of food when they're hungry. They want to live, same as we do. If one died, I'd feel I'd been a bad lad and treated it without any heart.
        - id: ch01-b05
          speaker: narrator
          text: >-
            During those twilight talks, Mrs. Sowerby heard everything that went on at Misselthwaite Manor. At first Dickon told her only that Master Colin had taken a liking to going outdoors with Miss Mary, and that the fresh air was helping him. Before long, though, Colin and Mary agreed that Dickon's mother could be let into the secret. Neither child had any doubt that she could be trusted.

            So on one beautiful, still evening, Dickon told her the whole story. He told her about the buried key and the robin, and about the gray haze over the garden that had looked like death. He explained how Mary had meant to keep the place secret forever, how she had shown it to him, and how Colin had doubted it before finally entering the hidden garden himself. Then came Ben Weatherstaff's angry face above the wall, and Colin suddenly finding the strength to stand. As Mrs. Sowerby listened, the color in her kind face changed several times.
        - id: ch01-b06
          speaker: mrs_sowerby
          text: >-
            My word! It was a blessed thing that little girl came to the Manor. The garden has made her, and it's saved him. He stood on his own feet! And all of us thought he was a poor confused lad without one straight bone in his body.
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: >-
            She asked Dickon question after question. Her blue eyes had a deep, thoughtful look.
        - id: ch01-b08
          speaker: mrs_sowerby
          text: >-
            What do the people at the Manor think? He's well and cheerful now, and he never complains. What do they make of that?
        - id: ch01-b09
          speaker: dickon
          text: >-
            They don't know what to think. His face changes every day. It's filling out, it doesn't look so sharp, and that waxy color is fading. But he still has to do a little complaining now and then.
        - id: ch01-b10
          speaker: mrs_sowerby
          text: >-
            Mercy on us, what does he need to do that for?
        - id: ch01-b11
          speaker: narrator
          text: >-
            Dickon chuckled before he answered.
        - id: ch01-b12
          speaker: dickon
          text: >-
            He does it so nobody will guess what's happened. If the doctor found out he could stand, he'd likely write to Mr. Craven. Colin wants to keep the secret until he can tell his father himself. He's going to work the Magic on his legs every day. Then when his father comes home, he'll walk right into the room and show him he's as straight as any other boy. So he and Mary think they ought to groan and fuss a bit, just to put everyone off the scent.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Before Dickon reached the end, his mother was already laughing her low, comfortable laugh.
        - id: ch01-b14
          speaker: mrs_sowerby
          text: >-
            Oh, those two are enjoying themselves, I'll be bound. They'll have a fine time playacting. There's hardly anything children like better. Tell me how they do it, Dickon lad.
    - id: ch02
      title: Playacting and Hungry Wolves
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Dickon stopped weeding and sat back on his heels. His eyes sparkled with fun as he began.
        - id: ch02-b02
          speaker: dickon
          text: >-
            Every time Colin goes out, they carry him downstairs to his chair. He snaps at John the footman for not carrying him carefully enough. He makes himself look as helpless as he can, and he won't even raise his head until we're out of sight of the house. While they're settling him into the chair, he grunts and frets something awful. He and Mary have both started loving the game. When he groans, she says, "Oh, poor Colin! Does it hurt terribly? Are you really that weak, poor Colin?" The only trouble is, sometimes they can barely stop themselves from laughing. Once we're safely inside the garden, they laugh until there's no breath left in them. If a gardener might be nearby, they bury their faces in Colin's cushions so no one hears.
        - id: ch02-b03
          speaker: mrs_sowerby
          text: >-
            Let them laugh! The more, the better. A child's good, healthy laughter does more than pills ever could. Those two will fill out soon enough.
        - id: ch02-b04
          speaker: dickon
          text: >-
            They already are. They get so hungry they can't think how to eat enough without making people talk. Colin says if he keeps asking for more food, nobody will believe he's an invalid. Mary offered him her share, but he said she'd only grow thin. They both have to get fat at the same time.
        - id: ch02-b05
          speaker: narrator
          text: >-
            This made Mrs. Sowerby laugh so hard that she rocked back and forth in her blue cloak. Dickon laughed along with her. When at last she could speak, she had an answer to the children's problem.
        - id: ch02-b06
          speaker: mrs_sowerby
          text: >-
            I know what we'll do. When you go to them in the morning, take a pail of good fresh milk. I'll bake a crusty cottage loaf, or some currant buns like you children love. There's nothing better than fresh milk and bread. They can take the sharp edge off their hunger while they're in the garden, and the fine food indoors can finish the job.
        - id: ch02-b07
          speaker: dickon
          text: >-
            Oh, Mother, you're a wonder! You always find a way through. They were in a real bother yesterday. They couldn't see how to manage without ordering more food, and they felt so empty inside.
        - id: ch02-b08
          speaker: mrs_sowerby
          text: >-
            They're two youngsters growing fast, and health is coming back to both. Children like that get hungry as young wolves. Food turns into flesh and blood for them.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Then Mrs. Sowerby smiled the same curving smile Dickon had.
        - id: ch02-b10
          speaker: mrs_sowerby
          text: >-
            Ah, but they truly are enjoying themselves.
        - id: ch02-b11
          speaker: narrator
          text: >-
            She was right, that warm and wonderful mother. She was especially right about the joy Colin and Mary would find in playacting. Protecting their secret from suspicion became one of their greatest entertainments. The puzzled nurse had first put the idea into their heads without knowing it, and then Dr. Craven helped it along.

            One day the nurse noticed how much Colin was eating.
        - id: ch02-b12
          speaker: nurse
          text: >-
            Your appetite has improved a great deal, Master Colin. You used to eat almost nothing, and nearly every kind of food upset you.
        - id: ch02-b13
          speaker: colin
          text: >-
            Food never upsets me now.
        - id: ch02-b14
          speaker: narrator
          text: >-
            The nurse gave him a curious look. Colin saw it and suddenly remembered that he must not seem too healthy yet.
        - id: ch02-b15
          speaker: colin
          text: >-
            Well, it doesn't upset me as often. I suppose that's because of the fresh air.
        - id: ch02-b16
          speaker: nurse
          text: >-
            Perhaps it is. Still, I ought to speak to Dr. Craven about this.
        - id: ch02-b17
          speaker: narrator
          text: >-
            She kept watching him with a baffled expression until she left the room.
        - id: ch02-b18
          speaker: mary
          text: >-
            Did you see the way she stared? She looked as if she knew there was something to discover.
        - id: ch02-b19
          speaker: colin
          text: >-
            She will not discover anything. No one can know yet.
        - id: ch02-b20
          speaker: narrator
          text: >-
            Dr. Craven came that same morning, and he looked puzzled too. He asked so many questions that Colin grew thoroughly annoyed.
        - id: ch02-b21
          speaker: dr_craven
          text: >-
            You spend a great deal of time outdoors. Where do you go?
        - id: ch02-b22
          speaker: narrator
          text: >-
            Colin put on his favorite expression of grand indifference, as though no one's opinion mattered to him.
        - id: ch02-b23
          speaker: colin
          text: >-
            I won't tell anyone where I go. It's a place I like, and everyone has orders to stay away. I refuse to be watched and stared at. You know I do.
        - id: ch02-b24
          speaker: dr_craven
          text: >-
            You seem to stay outside all day. I don't believe it has harmed you. No, I don't think it has. Your nurse says you're eating far more than you ever did before.
        - id: ch02-b25
          speaker: colin
          text: >-
            Perhaps it's an unnatural appetite.
        - id: ch02-b26
          speaker: narrator
          text: >-
            The excuse came to him in a flash.
        - id: ch02-b27
          speaker: dr_craven
          text: >-
            I doubt that. Your food seems to agree with you. You're gaining weight quickly, and your color is much better.
        - id: ch02-b28
          speaker: colin
          text: >-
            Maybe I'm bloated. Maybe I have a fever. People who aren't going to live often become... different.
        - id: ch02-b29
          speaker: narrator
          text: >-
            Colin made his face as gloomy and discouraging as he could. Dr. Craven shook his head. He held Colin's wrist, pushed up the boy's sleeve, and felt his arm.
        - id: ch02-b30
          speaker: dr_craven
          text: >-
            You have no fever, and the weight you've gained is healthy. If this continues, my boy, we can stop talking about dying. Your father will be very glad to hear how remarkably you've improved.
        - id: ch02-b31
          speaker: colin
          text: >-
            You are not to tell him! If I become worse again, it will only disappoint him. I may become worse tonight. I could have a raging fever. I almost feel one starting now. No one will write to my father. No one! You're making me angry, and you know anger is bad for me. I'm hot already. I hate being written about and discussed just as much as I hate people staring at me!
          emotion: angry
        - id: ch02-b32
          speaker: dr_craven
          text: >-
            Hush, my boy. No one will write without your permission. You're much too sensitive about these things. Don't undo all the good that's been done.
          emotion: calm
        - id: ch02-b33
          speaker: narrator
          text: >-
            Dr. Craven said nothing more to Colin about writing. In private, he warned the nurse not to mention the idea again.
        - id: ch02-b34
          speaker: dr_craven
          text: >-
            The boy is extraordinarily better. The speed of his improvement seems almost unnatural. Of course, he's now choosing to do what none of us could persuade him to do before. Even so, he becomes excited very easily. We must say nothing that might irritate him.
    - id: ch03
      title: A Secret Feast
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Mary and Colin were badly alarmed. They talked it over anxiously, and from that day their plan of playacting truly began.
        - id: ch03-b02
          speaker: colin
          text: >-
            I may have to throw a tantrum. I don't want to, and I'm not miserable enough now to work myself into a really big one. I might not be able to do it at all. That lump never rises in my throat anymore. I keep thinking about pleasant things instead of dreadful ones. But if they mention writing to my father again, I'll have to do something.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Colin decided that he would eat less. Unfortunately, that brilliant plan became impossible every morning. He woke with an astonishing appetite. Beside his sofa waited homemade bread with fresh butter, snow-white eggs, raspberry jam, and clotted cream. Mary always ate breakfast with him. When a hot silver cover was lifted and the smell of delicate slices of sizzling ham escaped, the two children would look desperately into each other's eyes.
        - id: ch03-b04
          speaker: colin
          text: >-
            I think we'll have to finish everything this morning, Mary. We can send away part of lunch and most of dinner.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Yet they never managed to send anything away. Their empty plates went back to the pantry polished clean, and everyone downstairs began to talk about it.
        - id: ch03-b06
          speaker: colin
          text: >-
            I wish the ham were cut thicker. And honestly, one muffin apiece isn't enough for anybody.
        - id: ch03-b07
          speaker: mary
          text: >-
            It's enough for somebody who's going to die. It isn't enough for somebody who's going to live. When the window is open and those fresh smells of heather and gorse come in from the moor, I sometimes think I could eat three muffins.
        - id: ch03-b08
          speaker: narrator
          text: >-
            One morning, the children had been enjoying the garden for nearly two hours when Dickon disappeared behind a large rosebush. He came back carrying two tin pails. One held rich new milk with cream floating on top. Inside the other, wrapped in a clean blue-and-white napkin, were currant buns from the Sowerby cottage. They had been packed so carefully that they were still warm.

            Colin and Mary burst into noisy delight. How wonderful of Mrs. Sowerby to think of it! She must be both kind and clever. The warm buns tasted marvelous, and the fresh milk was delicious.
        - id: ch03-b09
          speaker: colin
          text: >-
            She has Magic in her, just as Dickon does. It helps her think of good ways to do things. She's a Magic person. Tell her how grateful we are, Dickon. We are extremely grateful.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Colin sometimes enjoyed using phrases that sounded very grown-up. He liked this one so much that he made it even grander.
        - id: ch03-b11
          speaker: colin
          text: >-
            Tell her she has been most bounteous, and that our gratitude is extreme.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Then all his grand manners vanished. Like any hungry boy who had exercised in the moorland air and eaten breakfast more than two hours before, he stuffed himself with buns and drank great gulps of milk straight from the pail.

            That morning began a whole string of pleasant surprises. After a while, Colin and Mary remembered that Mrs. Sowerby already had fourteen people to feed. She might not have enough for two more hungry children every day. They asked her to accept some of their shillings and use the money to buy food.

            Dickon soon made another exciting discovery. Outside the secret garden, in the same park wood where Mary had first seen him playing his pipe to the wild creatures, there was a deep little hollow. Stones could be arranged there to make a tiny oven for roasting potatoes and eggs. The children had never known the luxury of roasted eggs. As for piping-hot potatoes split open and filled with salt and fresh butter, they were food fit for a woodland king. Better still, potatoes and eggs were cheap enough to buy. Colin and Mary could eat as many as they pleased without feeling they were taking food from fourteen other mouths.
    - id: ch04
      title: Learning to Grow Strong
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Every beautiful morning, they worked the Magic in their mysterious circle beneath the plum tree. Its short season of blossoms had ended, and thick green leaves now formed a roof over them. After the ceremony, Colin always practiced walking. He exercised his newly discovered strength again and again throughout the day. Each morning he could walk a little farther and keep his balance a little better. As his body grew stronger, so did his belief in the Magic. And why shouldn't it have?

            Colin tried one experiment after another. He could feel strength coming into him, and Dickon showed him the best experiment of all after returning from a day away.
        - id: ch04-b02
          speaker: dickon
          text: >-
            Yesterday I went to Thwaite for Mother, and near the Blue Cow Inn I saw Bob Haworth. He's the strongest man on the moor. He's the champion wrestler. He can jump higher and throw the hammer farther than anyone else, and some years he goes all the way to Scotland for the games. Bob has known me since I was little, and he's a friendly fellow, so I asked him a few things. Gentlefolk call him an athlete, and that made me think of you, Colin.

            I asked, "Bob, how did you make your muscles stand out like that? Did you do something special to get so strong?" He told me a strong man from a traveling show once came to Thwaite and taught him exercises for his arms, legs, and every muscle in his body. Then I asked whether those exercises might make a delicate fellow stronger.

            Bob laughed and said, "Are you the delicate fellow?" I told him no. I said I knew a young gentleman who was getting over a long illness, and I wished I knew the tricks so I could teach him. I never gave a name, and Bob never asked for one. Just as I said, he's friendly. He stood up and showed me every movement. I copied him until I had them all by heart.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Colin had listened with mounting excitement.
        - id: ch04-b04
          speaker: colin
          text: >-
            Can you teach me? Will you really show me?
          emotion: surprised
        - id: ch04-b05
          speaker: dickon
          text: >-
            Of course I will. But Bob said you must start gently and take care not to tire yourself. Rest between the exercises, breathe deeply, and don't do too much.
        - id: ch04-b06
          speaker: colin
          text: >-
            I'll be careful. Show me now! Please, Dickon, show me! You are the most Magic boy in the world!
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: >-
            Dickon stood on the grass and slowly demonstrated a simple, sensible set of exercises for the muscles. Colin watched with widening eyes. At first he could copy a few movements while sitting down. Soon he tried several more as he stood gently on feet that had already learned to hold him steady. Mary began exercising too.

            Soot watched the whole performance from a branch. It disturbed him greatly. He hopped about in restless frustration because he could not do the exercises with them.

            From then on, the exercises became as much a part of each day's work as the Magic. Every time Colin and Mary practiced, they found they could do a little more. The exercise made them so hungry that they would have been lost without the basket Dickon placed behind the bush each morning.

            Luckily, the little stone oven and Mrs. Sowerby's gifts filled them wonderfully well. They feasted on roasted eggs and potatoes, frothy new milk, oatcakes, buns, heather honey, and clotted cream. With all that inside them, they could pick at breakfast and turn away from dinner. Soon Mrs. Medlock, the nurse, and Dr. Craven were completely mystified again.
    - id: ch05
      title: Let Them Laugh
      blocks:
        - id: ch05-b01
          speaker: nurse
          text: >-
            Those children hardly eat a thing. If we can't persuade them to take some nourishment, they'll starve to death. And yet, just look at them.
        - id: ch05-b02
          speaker: mrs_medlock
          text: >-
            Look at them? I'm worried out of my senses by those two. They're a pair of young devils. One day they're nearly bursting their jackets, and the next they turn up their noses at the finest meals Cook can make. Yesterday they never touched one bite of that tender chicken with bread sauce. The poor woman practically invented a pudding for them, and back it came. She nearly cried. Now she's afraid she'll be blamed if they starve themselves into their graves.
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: >-
            Dr. Craven came and studied Colin long and carefully. While the nurse spoke to him and showed him the breakfast tray she had saved, with nearly all its food untouched, his face looked deeply worried. It grew even more troubled when he sat beside Colin's sofa and began his examination.

            Business had taken the doctor to London, so he had not seen the boy in almost two weeks. Young bodies can change quickly when health begins to return. The pale, waxy shade had left Colin's skin, and a warm rose color now shone through. His beautiful eyes were clear. The hollows beneath them, and the hollows in his cheeks and temples, had filled. His dark hair no longer lay heavy and lifeless. It sprang softly from his forehead, warm with health. His lips were fuller and had a natural color again. If Colin meant to look like a hopeless invalid, he was doing a disgracefully poor job of it.

            Dr. Craven held Colin's chin in one hand and considered him.
        - id: ch05-b04
          speaker: dr_craven
          text: >-
            I'm sorry to hear that you're eating nothing. That cannot continue. You'll lose everything you've gained, and you've gained an astonishing amount. Not long ago, you were eating very well.
        - id: ch05-b05
          speaker: colin
          text: >-
            I warned you that my appetite wasn't natural.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Mary sat close by on her stool. Suddenly, a very strange noise escaped her. She fought so hard to hold it back that she nearly choked.
        - id: ch05-b07
          speaker: dr_craven
          text: >-
            What was that? Is something wrong with you?
        - id: ch05-b08
          speaker: narrator
          text: >-
            Mary arranged her face into an expression of severe dignity.
        - id: ch05-b09
          speaker: mary
          text: >-
            It was halfway between a sneeze and a cough. It caught in my throat.
        - id: ch05-b10
          speaker: narrator
          text: >-
            Later, when she was alone with Colin, Mary confessed what had really happened.
        - id: ch05-b11
          speaker: mary
          text: >-
            I couldn't stop it. The sound just burst out. All at once I remembered that enormous potato you ate, and how wide you opened your mouth to bite through that thick, lovely crust covered with jam and clotted cream.
        - id: ch05-b12
          speaker: narrator
          text: >-
            Meanwhile, Dr. Craven tried to solve the mystery downstairs.
        - id: ch05-b13
          speaker: dr_craven
          text: >-
            Could those children possibly be getting food in secret?
        - id: ch05-b14
          speaker: mrs_medlock
          text: >-
            Not unless they're digging it out of the ground or pulling it from the trees. They spend the whole day outdoors and see nobody but each other. And if they wanted different food, all they'd have to do is ask.
        - id: ch05-b15
          speaker: dr_craven
          text: >-
            Well, if going without food agrees with them this well, there is no reason to interfere. The boy has become a new creature.
        - id: ch05-b16
          speaker: mrs_medlock
          text: >-
            So has the girl. Now that she's filled out and lost that sour little scowl, she's becoming downright pretty. Her hair is thick and healthy, and there's bright color in her face. She used to be the gloomiest, most ill-tempered little thing. Now she and Master Colin laugh together like two young lunatics. Maybe that's what's making them fat.
        - id: ch05-b17
          speaker: dr_craven
          text: >-
            Perhaps it is. Let them laugh.
