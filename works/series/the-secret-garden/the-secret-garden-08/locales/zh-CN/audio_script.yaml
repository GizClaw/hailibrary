audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 克制而敏锐，带一点不动声色的讽意
        timbre: 温暖清晰
        pace: 舒缓中有变化
        pitch: 中音
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts:
        delivery: 任性强硬，话说得短而直接
        timbre: 稚嫩而尖细
        pace: 偏快
        pitch: 偏高
    martha:
      display_name: 玛莎
      tts:
        delivery: 爽朗质朴，带着亲切而浓重的约克郡乡音
        timbre: 年轻明亮而结实
        pace: 稍快
        pitch: 中高音
    ben_weatherstaff:
      display_name: 本·韦瑟斯塔夫
      tts:
        delivery: 粗声直率，约克郡口音浓重，偶尔透出温柔
        timbre: 苍老粗粝
        pace: 偏慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 口袋里的钥匙
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 玛丽把那把钥匙拿在手里，翻来覆去看了很久。她从小就没人教她，遇到事情要先征求大人的同意，也没人教她去请教长辈。所以，她根本没想过要把钥匙交给谁，只顾着猜想：要是它真能打开那座封闭的花园，只要找到门，她就可以进去看看围墙里面有什么，那些老玫瑰树又成了什么样。
        - id: ch01-b02
          speaker: narrator
          text: 花园已经封了十年，里面一定和别处不同，也许还发生过什么怪事。若是玛丽喜欢那里，她就能每天进去，再从里面关上门，一个人编出各种游戏来玩。谁也找不到她。大家只会以为门还锁着，钥匙也还埋在土里。她越想越高兴。
        - id: ch01-b03
          speaker: narrator
          text: 玛丽仿佛独自住在这座大宅里。上百间房门神秘地紧闭着，她又没有任何事情可做，也没有什么可以消遣。这样一来，那颗从前懒得活动的脑袋反倒渐渐转了起来，想象力也真的醒了。荒原上强劲、清冽而纯净的空气给了她胃口。迎着风走路，让她的血活了起来，也让她的心思活了起来。
        - id: ch01-b04
          speaker: narrator
          text: 在印度时，她总是热得困倦，浑身无力，什么都懒得在乎。可到了这里，她开始在意许多事，也想做些新鲜事。她已经没有从前那么乖戾了，自己却不知道为什么。
        - id: ch01-b05
          speaker: narrator
          text: 她把钥匙装进口袋，又沿着那条小路来回走。这里从没有别人来，她可以慢慢察看围墙，或者说，察看墙上的常春藤。可那些油亮的深绿叶子长得密密层层，不管她怎么看，都找不到门的影子。
        - id: ch01-b06
          speaker: narrator
          text: 玛丽失望极了。她望着墙里的树梢，心里那股乖戾劲儿又冒出来。明明离得这样近，却进不去，实在太蠢了。回宅子时，她仍把钥匙带在身上。她决定以后每次出门都要带着它，万一找到了门，就能马上打开。
    - id: ch02
      title: 两便士的礼物
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 梅德洛克太太准许玛莎在家里住一夜。第二天早晨，她已经回来干活了。她两颊红红的，快活得不得了。
        - id: ch02-b02
          speaker: martha
          text: “我四点钟就起来啦。那时候的荒原真美！鸟儿刚醒，兔子到处跑，太阳也正升起来。我没有一路走回来，有个人让我搭了他的马车。那一路可真痛快。”
          emotion: happy
        - id: ch02-b03
          speaker: narrator
          text: 玛莎满肚子都是休息日里的开心事，一件接一件，说起来没完没了。母亲见到她很高兴，两个人很快做完了烤面包和洗衣服的活儿。她还给家里的每个孩子烤了一只面饼，每只里面都放着一点红糖。
        - id: ch02-b04
          speaker: martha
          text: “他们从荒原上玩回来，刚好吃上热面饼。屋里又干净又暖和，全是烘烤的香气，炉火也烧得旺。他们高兴得直叫。我们迪肯还说，这小屋连国王住进来都够好啦。”
        - id: ch02-b05
          speaker: narrator
          text: 晚上一家人围着炉火。玛莎和母亲给破衣服打补丁，又缝补袜子。她还讲起从印度来的小姑娘，说那姑娘从小有人伺候，连自己的袜子也不会穿。
        - id: ch02-b06
          speaker: martha
          text: “他们可爱听你的事了！一个个都想知道那些黑人是什么样，还问你坐的那条船。无论我讲多少，他们都觉得听不够。”
        - id: ch02-b07
          speaker: narrator
          text: 玛丽认真想了想。
        - id: ch02-b08
          speaker: mary_lennox
          text: “下次你休息以前，我会再告诉你许多事情。这样，你就有得讲了。他们大概爱听人怎么骑大象、骑骆驼，还有军官怎么去猎老虎。”
        - id: ch02-b09
          speaker: martha
          text: “我的老天，那非把他们听疯了不可！小姐，你真的肯讲？那就像约克从前办过的猛兽展一样啦。”
          emotion: happy
        - id: ch02-b10
          speaker: mary_lennox
          text: “印度和约克郡完全不一样。我以前从没想过。迪肯和你妈妈喜欢听你说我的事吗？”
        - id: ch02-b11
          speaker: martha
          text: “当然喜欢。我们迪肯把眼睛瞪得溜圆，差点掉出来。可妈妈听说你孤零零的，很不放心。她问我：‘克雷文先生没给她找家庭教师，也没请保姆吗？’我说没有。梅德洛克太太说，等老爷想起来就会请，可他也许两三年都想不起来。”
        - id: ch02-b12
          speaker: mary_lennox
          text: “我不要家庭教师。”
        - id: ch02-b13
          speaker: martha
          text: “妈妈说，你这个年纪早该读书了，也该有个女人照料。她对我说：‘玛莎，你自己想想，要是你没有妈妈，一个人在这么大的宅子里到处走，会是什么滋味。’她叫我尽力哄你高兴些，我也答应了她。”
        - id: ch02-b14
          speaker: narrator
          text: 玛丽久久地看着玛莎，目光一动不动。
        - id: ch02-b15
          speaker: mary_lennox
          text: “你真的会让我高兴。我喜欢听你讲话。”
        - id: ch02-b16
          speaker: narrator
          text: 过了一会儿，玛莎走出去，又双手藏在围裙下面回来了。她眉开眼笑，像是藏着什么秘密。
        - id: ch02-b17
          speaker: martha
          text: “猜猜这是什么？我给你带礼物来啦。”
          emotion: happy
        - id: ch02-b18
          speaker: mary_lennox
          text: “礼物！”
          emotion: surprised
        - id: ch02-b19
          speaker: narrator
          text: 玛丽小姐惊讶极了，怎么也想不明白。一间小屋里住着十四张总也吃不饱的嘴，怎么还能拿出东西送给别人？
        - id: ch02-b20
          speaker: martha
          text: “有个小贩赶车经过荒原，停在我们家门口。他车上有锅，还有好多零碎东西，可妈妈没钱买。小贩正要走，伊丽莎白·艾伦忽然喊：‘妈妈，他有红蓝手柄的跳绳！’妈妈马上叫住他，问多少钱。小贩说两便士。”
        - id: ch02-b21
          speaker: martha
          text: “妈妈一边摸口袋，一边对我说：‘好姑娘，你把工钱带回家给我了。虽说每一便士都有四处地方等着花，我还是要拿出两便士，给那个孩子买根跳绳。’她真的买了。喏，就是这根。”
        - id: ch02-b22
          speaker: narrator
          text: 玛莎从围裙下面拿出一根结实的细绳，两头各有一只红蓝条纹的手柄。她显得十分自豪。玛丽·伦诺克斯却从没见过跳绳，只能迷惑地盯着它。
        - id: ch02-b23
          speaker: mary_lennox
          text: “这是做什么用的？”
        - id: ch02-b24
          speaker: martha
          text: “做什么用？印度有大象、老虎和骆驼，难道反倒没有跳绳？难怪那儿的人大多那么黑。你看着我，这才是它的用处。”
        - id: ch02-b25
          speaker: narrator
          text: 玛莎跑到房间中央，两手各握住一只手柄，一下接一下地跳起来。玛丽坐在椅子上转过身，眼睛紧紧盯着她。旧画像里那些古怪的面孔仿佛也在看，奇怪这个乡下丫头怎么敢在它们眼皮底下这样胡闹。
        - id: ch02-b26
          speaker: narrator
          text: 玛莎根本没留意画像。玛丽脸上的好奇和兴趣让她很开心。她边跳边数，一直数满一百才停下。
        - id: ch02-b27
          speaker: martha
          text: “我还能跳得更多呢。十二岁时，我一口气跳过五百下。不过那时我没这么胖，也常常练。”
        - id: ch02-b28
          speaker: narrator
          text: 玛丽站起身，自己也兴奋起来。
        - id: ch02-b29
          speaker: mary_lennox
          text: “看起来真好玩。你妈妈是个好人。你说，我以后也能跳成这样吗？”
        - id: ch02-b30
          speaker: martha
          text: “你试试就知道了。刚开始跳不了一百下，可多练练，数目自然会往上涨。妈妈说，跳绳对你最有好处，也是孩子最实在的玩具。你在外面的新鲜空气里跳，胳膊腿儿都能舒展开，也会慢慢有力气。”
    - id: ch03
      title: 玛丽开始跳绳
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 玛丽第一次跳，胳膊和腿有多无力，一眼就看得出来。她也跳得不怎么灵巧，可实在太喜欢这种玩法了，根本舍不得停下来。
        - id: ch03-b02
          speaker: martha
          text: “穿好衣裳，到外面跳去吧。妈妈叫我告诉你，要尽量多待在外头。下点小雨也不怕，只要穿暖和些。”
        - id: ch03-b03
          speaker: narrator
          text: 玛丽穿上外套，戴好帽子，把绳搭在胳膊上。她正要开门出去，忽然想起一件事，又慢慢回过身。
        - id: ch03-b04
          speaker: mary_lennox
          text: “玛莎，那是你的工钱。那两便士本来是你的。谢谢你。”
        - id: ch03-b05
          speaker: narrator
          text: 这声道谢硬邦邦的。玛丽从不习惯感谢别人，也很少留意别人为她做了什么。她又说了一遍谢谢，还伸出手来，因为实在不知道该怎么做才好。
        - id: ch03-b06
          speaker: narrator
          text: 玛莎也笨拙地握了握她的手，仿佛同样不习惯这样。接着，她笑了。
        - id: ch03-b07
          speaker: martha
          text: “你这个小东西真古怪，简直像个老太太。换成伊丽莎白·艾伦，她早就亲我一下了。”
        - id: ch03-b08
          speaker: narrator
          text: 玛丽的身子绷得更直了。
        - id: ch03-b09
          speaker: mary_lennox
          text: “你想让我亲你吗？”
        - id: ch03-b10
          speaker: narrator
          text: 玛莎又笑起来。
        - id: ch03-b11
          speaker: martha
          text: “不，我可不要。要是你的性子不一样，也许不用人说，你自己就想亲了。可你不是那样的人。快出去玩你的绳吧。”
        - id: ch03-b12
          speaker: narrator
          text: 玛丽小姐走出房间，心里有点尴尬，也有点别扭。约克郡人似乎都很古怪，玛莎更总是让她摸不着头脑。她起初十分讨厌玛莎，现在却已经不讨厌了。
        - id: ch03-b13
          speaker: narrator
          text: 跳绳真是一件奇妙的东西。玛丽数着跳，跳着数，直到两颊红通通的。她出生以来，还没有对什么事情这样着迷过。阳光照耀着，一阵阵轻柔的风吹来。那不是先前的狂风，而是令人舒服的小风，还送来了新翻泥土的清新气息。她绕过喷泉花园，又沿着一条条小路跳上去、跳回来。
        - id: ch03-b14
          speaker: narrator
          text: 最后，她一路跳进厨房花园，看见本·韦瑟斯塔夫正在挖地，还和身边蹦来蹦去的知更鸟说话。她沿着小路朝老人跳过去。本抬起头，神情古怪地打量她。玛丽先前一直在猜，他会不会注意到自己。其实，她真的很想让他亲眼看见她跳绳。
        - id: ch03-b15
          speaker: ben_weatherstaff
          text: “嘿，真没想到！兴许你到底还是个小娃娃，血管里流的是孩子的血，不是酸酪乳。你都跳出红脸蛋啦。要是这话不真，我就不叫本·韦瑟斯塔夫。我可没想到你还有这个本事。”
          emotion: surprised
        - id: ch03-b16
          speaker: mary_lennox
          text: “我从来没跳过，今天才开始学。我最多只能跳二十下。”
        - id: ch03-b17
          speaker: ben_weatherstaff
          text: “接着练吧。一个在异教徒中间长大的娃娃，能跳成这样已经不错。你瞧那只鸟怎么盯着你。它昨天跟着你，今天准会再跟。它非要弄懂跳绳是什么不可，以前可没见过。”
        - id: ch03-b18
          speaker: narrator
          text: 本朝知更鸟摇摇头，又粗声告诫它。
        - id: ch03-b19
          speaker: ben_weatherstaff
          text: “你这份好奇心啊，再不留神，早晚会送了命。”
    - id: ch04
      title: 指路的知更鸟
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 玛丽绕遍所有花园，又绕着果园跳，每过几分钟就停下来歇一会儿。最后，她来到那条属于自己的小路，决定试试能不能从头一直跳到尾。这段路很长，她起先跳得很慢，可还不到一半，就已经又热又喘，只好停下。她倒不怎么在乎，因为已经数到三十了。
        - id: ch04-b02
          speaker: narrator
          text: 她开心地轻轻一笑。再一看，知更鸟正停在一根长长的常春藤枝条上，随着枝条摇来晃去。它果然跟来了，还啾啾叫着向她问好。玛丽一路朝它跳来时，每跳一下，口袋里的旧钥匙就沉甸甸地撞她一下。如今看见知更鸟停在那里，她又高兴地笑了。
        - id: ch04-b03
          speaker: mary_lennox
          text: “昨天是你告诉我钥匙在哪里。今天你应该告诉我门在哪里。不过，我不信你真的知道！”
        - id: ch04-b04
          speaker: narrator
          text: 知更鸟从摇晃的藤枝上飞到墙顶，张开小嘴，唱出一串响亮又好听的颤音。它纯粹是在卖弄。知更鸟得意卖弄时，世上几乎没有什么比它更可爱。况且，它们差不多总在卖弄。
        - id: ch04-b05
          speaker: narrator
          text: 印度奶妈讲过许多魔法故事。玛丽·伦诺克斯后来总说，几乎就在这一刻发生的事，正是魔法。
        - id: ch04-b06
          speaker: narrator
          text: 一阵令人舒服的小风沿着路奔来，比先前每一阵风都更强。它有力气吹动树枝，更能让墙上那些没有修剪、长长垂下的常春藤来回摇摆。玛丽已经走到知更鸟近旁。忽然，风把几绺松动的藤蔓掀向一边。
        - id: ch04-b07
          speaker: narrator
          text: 玛丽看见叶子下面露出一个圆圆的把手，立刻扑过去，一把抓住藤蔓。那些叶子原先把它遮得严严实实。可现在，她看清楚了。那是一扇门的把手。
        - id: ch04-b08
          speaker: narrator
          text: 她把双手伸进叶子底下，又拉又推，把藤蔓一点点拨到两旁。常春藤虽然长得密密实实，绝大部分却只是松松地垂着，像一幅随风摇动的帘子。只有几根攀在木头和铁器上。玛丽的心怦怦直跳，双手也因为欢喜和激动微微发抖。
        - id: ch04-b09
          speaker: narrator
          text: 知更鸟一直唱个不停，嘴里啾啾作响，还把头歪向一边，仿佛和玛丽一样又兴奋又激动。玛丽的双手摸到一个方方正正的铁东西，手指又在上面探到一个小洞。这究竟是什么？
        - id: ch04-b10
          speaker: narrator
          text: 是门锁。那扇门已经整整关闭了十年。玛丽把手伸进口袋，掏出钥匙。钥匙正好插进锁眼。她用两只手握紧，使劲一拧。锁真的转动了。
        - id: ch04-b11
          speaker: narrator
          text: 玛丽深深吸了一口气，回头望向身后那条长长的小路，仔细看看有没有人正朝这里走来。没有人。这里仿佛从来就不会有人来。她忍不住又深吸了一大口气，一只手掀住那幅摇摆的常春藤帘子，另一只手把门往里推。门缓缓地，慢慢地打开了。
        - id: ch04-b12
          speaker: narrator
          text: 她闪身钻进去，把门关在身后。她背靠着门站住，四下张望。激动、惊奇和喜悦让她呼吸又快又急。
        - id: ch04-b13
          speaker: narrator
          text: 玛丽终于真正站在了秘密花园里面。
