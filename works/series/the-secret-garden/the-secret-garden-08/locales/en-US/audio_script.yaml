audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    martha:
      display_name: Martha
      tts:
        delivery: good-natured, candid, and broad in Yorkshire character
        timbre: rosy and sturdy
        pace: lively
        pitch: medium-high
    ben_weatherstaff:
      display_name: Ben Weatherstaff
      tts:
        delivery: gruff, plainspoken, and dryly expressive in Yorkshire character
        timbre: rough and earthy
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: The Key and the Wall
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Mary studied the key for a long time, turning it over and over in her hands as she thought. No one had taught her to ask permission or go to grown-ups for advice. So she thought only of what the key might let her do. If it belonged to the closed garden, and if she could find the hidden door, perhaps she could open it. Then she could see what lay behind the walls and find out what had become of the old rosebushes. She wanted to see the garden because it had been shut for so long. Ten years hidden away made her imagine it must be different from other places, as if something strange had happened there while no one was looking. Best of all, if she liked it, she could visit every day and close the door behind her. She could invent games of her own and play all alone. No one would ever know where she was. Everyone would still believe the door was locked and the key buried in the earth. Mary liked that idea very much.
        - id: ch01-b02
          speaker: narrator
          text: >-
            She lived almost by herself in a house with a hundred mysterious locked rooms, and she had nothing at all to amuse her. All that emptiness had finally set her quiet mind to work. Her imagination was waking up too. The fresh, strong, clean air from the moor had helped. It had given her an appetite. Fighting the wind had made her blood move faster, and now her thoughts were moving too. In India, the heat had always left her tired, weak, and too listless to care about much of anything. Here, she was beginning to care. She wanted things, and she wanted to try new things. She was already less contrary, though she had no idea why.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Mary slipped the key into her pocket and walked slowly up and down her private path. No one else ever seemed to come there. She could take her time studying the wall, or rather, the ivy that covered it. That ivy was the puzzle. No matter how carefully she searched, all she saw were thick, glossy, dark-green leaves growing close together. She could not find the smallest sign of a door. She grew terribly disappointed. Some of her old crossness returned as she paced along, peering over the wall at the treetops inside. It was so stupid to stand this close and still have no way in. When she went back to the house, the key went with her. From then on, she decided, she would carry it every time she went outside. If she ever found the hidden door, she would be ready to unlock it.
    - id: ch02
      title: A Present from the Cottage
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Mrs. Medlock had let Martha spend the whole night at the cottage. The next morning she came back to work with redder cheeks than ever and a wonderfully cheerful face.
        - id: ch02-b02
          speaker: martha
          text: >-
            I was up at four this morning! Eh, the moor was lovely. The birds were waking, the rabbits were scampering about, and the sun was coming up. I didn't have to walk the whole way, either. A man let me ride in his cart, and I can tell thee, I had a grand time.
          emotion: happy
        - id: ch02-b03
          speaker: narrator
          text: >-
            Martha had story after story about her day at home. Her mother had been glad to see her. Together they had finished the baking and washing. Martha had even made every child a little dough cake with brown sugar inside.
        - id: ch02-b04
          speaker: martha
          text: >-
            I had them hot and ready when they came in from playing on the moor. The cottage smelled of fresh baking, everything was clean, and there was a good fire going. They all shouted for joy. Our Dickon said the place was fit for a king.
          emotion: happy
        - id: ch02-b05
          speaker: narrator
          text: >-
            That evening, everyone had gathered around the fire. Martha and her mother patched torn clothes and mended stockings while Martha told the family about the little girl from India. Mary had been waited on all her life by Indian servants, whom Martha called "blacks," and had never even learned to put on her own stockings.
        - id: ch02-b06
          speaker: martha
          text: >-
            Eh, they loved hearing about thee. They kept asking about the people in India and the ship tha came on. I couldn't tell them nearly enough.
        - id: ch02-b07
          speaker: narrator
          text: Mary thought for a moment.
        - id: ch02-b08
          speaker: mary
          text: >-
            Before your next day off, I'll tell you much more. Then you'll have plenty to talk about. They might like the elephants and camels, and the officers who went tiger hunting.
        - id: ch02-b09
          speaker: martha
          text: >-
            My word! They'd go wild over that. Would tha really tell me, Miss? It would be just like one of those wild-animal shows we heard about in York.
          emotion: happy
        - id: ch02-b10
          speaker: mary
          text: >-
            India is nothing like Yorkshire. I never thought about that before. Did Dickon and your mother enjoy hearing about me?
        - id: ch02-b11
          speaker: martha
          text: >-
            Dickon's eyes went so round, they nearly popped out of his head. But Mother was troubled when she heard tha seemed to be left all alone. She asked, "Hasn't Mr. Craven found the child a governess or a nurse?" I told her no. Mrs. Medlock says he'll do it when he remembers, but that might not be for two or three years.
        - id: ch02-b12
          speaker: mary
          text: I don't want any governess!
          emotion: angry
        - id: ch02-b13
          speaker: martha
          text: >-
            Mother says tha ought to be doing lessons by now, and tha needs a woman looking after thee. Then she said, "Martha, imagine being alone in that great house with no mother. Do thy best to brighten things for her." I promised I would.
        - id: ch02-b14
          speaker: narrator
          text: Mary looked at Martha for a long, steady moment.
        - id: ch02-b15
          speaker: mary
          text: You do make things brighter. I like listening to you.
        - id: ch02-b16
          speaker: narrator
          text: >-
            A little later, Martha left the room. When she returned, she was hiding something beneath her apron.
        - id: ch02-b17
          speaker: martha
          text: What does tha think? I've brought thee a present.
          emotion: happy
        - id: ch02-b18
          speaker: mary
          text: A present!
          emotion: surprised
        - id: ch02-b19
          speaker: narrator
          text: >-
            Mary could not imagine how a cottage full of fourteen hungry people could give anyone a present.
        - id: ch02-b20
          speaker: martha
          text: >-
            A peddler drove across the moor and stopped his cart at our door. He had pots and pans and all sorts of little things, but Mother had no money to spare. Just as he was leaving, our 'Lizabeth Ellen cried, "Mother, he's got skipping ropes with red and blue handles!" Mother called him back and asked the price. "Twopence," he said. Then she felt around in her pocket and told me, "Martha, tha brought thy wages home like a good lass. I've got four uses for every penny, but I'm taking twopence to buy that child a skipping rope." So she bought it, and here it is.
        - id: ch02-b21
          speaker: narrator
          text: >-
            Martha proudly pulled out a strong, slender rope with a striped red-and-blue handle at each end. Mary Lennox had never seen anything like it. She stared, completely puzzled.
        - id: ch02-b22
          speaker: mary
          text: What do you do with it?
        - id: ch02-b23
          speaker: martha
          text: >-
            What do tha do with it? They've no skipping ropes in India, even with all those elephants and tigers and camels? No wonder most everyone there is black. Here, watch me. This is how it works.
          emotion: surprised
    - id: ch03
      title: Learning to Skip
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Martha ran to the center of the room, took a handle in each hand, and began to skip. She skipped and skipped while Mary twisted around in her chair to stare. The strange faces in the old portraits seemed to stare too, as though they wondered how a common cottage girl dared do such a thing right under their noses. Martha never noticed them. She was delighted by the curiosity on Mary's face. She kept jumping and counting until she reached one hundred.
        - id: ch03-b02
          speaker: martha
          text: >-
            I could keep going longer than that. When I was twelve, I could do five hundred. But I was thinner then, and I'd had plenty of practice.
        - id: ch03-b03
          speaker: narrator
          text: Mary rose from her chair. Now she was getting excited too.
        - id: ch03-b04
          speaker: mary
          text: >-
            That looks fun. Your mother is very kind. Do you think I could learn to skip like you?
        - id: ch03-b05
          speaker: martha
          text: >-
            Try it and see. Tha won't reach a hundred straightaway, but practice will get thee there. That's what Mother said. She said, "Nothing will do that child more good than skipping rope. It's the most sensible toy there is. Send her outside with it. It'll stretch her arms and legs and put some strength into them."
        - id: ch03-b06
          speaker: narrator
          text: >-
            The first time Mary tried, it was obvious that her arms and legs had very little strength. She was not skillful, either. But she enjoyed it so much that she did not want to quit.
        - id: ch03-b07
          speaker: martha
          text: >-
            Put thy outdoor things on and take it outside. Mother told me to say tha should stay outdoors as much as possible. Even if there's a little rain, just wrap up warm.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Mary put on her coat and hat, then looped the skipping rope over her arm. At the door, a sudden thought stopped her. She turned back slowly.
        - id: ch03-b09
          speaker: mary
          text: >-
            Martha, that money came from your wages. The twopence was really yours. Thank you.
        - id: ch03-b10
          speaker: narrator
          text: >-
            The words sounded stiff. Mary was not used to thanking anyone, or even noticing when someone did something for her. She thanked Martha once more and held out her hand because she could not think what else to do.
        - id: ch03-b11
          speaker: mary
          text: Thank you.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Martha gave the hand an awkward little shake. She did not seem used to such things either. Then she laughed.
        - id: ch03-b13
          speaker: martha
          text: >-
            Eh, tha is a funny little thing, like some old woman. If tha'd been our 'Lizabeth Ellen, tha would have kissed me.
        - id: ch03-b14
          speaker: narrator
          text: Mary became stiffer still.
        - id: ch03-b15
          speaker: mary
          text: Do you want me to kiss you?
        - id: ch03-b16
          speaker: narrator
          text: Martha laughed again.
        - id: ch03-b17
          speaker: martha
          text: >-
            Nay, I don't. If tha were different, maybe tha would want to without asking. But tha isn't different. Off tha goes now. Play outside with thy rope.
        - id: ch03-b18
          speaker: narrator
          text: >-
            Mary felt rather awkward as she left the room. Yorkshire people were strange, and Martha was always a puzzle. Mary had disliked her very much at first. Now she did not dislike her at all.
        - id: ch03-b19
          speaker: narrator
          text: >-
            The skipping rope was wonderful. Mary counted while she skipped and skipped while she counted. Soon her cheeks were bright red, and she was more interested than she had ever been in her life. Sunlight filled the gardens. A small wind blew in pleasant gusts, carrying the fresh smell of newly turned earth. Mary skipped around the fountain garden, up one path, and down another. At last she reached the kitchen garden. Ben Weatherstaff was digging there and talking to his robin, which hopped around beside him. Mary skipped toward Ben. He raised his head and gave her an odd look. She had been wondering whether he would notice her. She truly wanted him to watch her skip.
        - id: ch03-b20
          speaker: ben_weatherstaff
          text: >-
            Well! Upon my word! Maybe tha is a child after all. Maybe there's children's blood in thy veins instead of sour buttermilk. Tha's skipped some red into thy cheeks, sure as my name is Ben Weatherstaff. I never thought tha could do it.
          emotion: surprised
        - id: ch03-b21
          speaker: mary
          text: >-
            I've never done it before. I'm only learning. Twenty is as high as I can count while I skip.
        - id: ch03-b22
          speaker: ben_weatherstaff
          text: >-
            Keep at it. Tha does well enough for a young one raised among heathens. Look how that robin's watching thee. He followed thee yesterday, and he'll do it again today. He means to find out what that rope is, since he's never seen one. Eh, bird, that curiosity of thine will be the death of thee one day if tha isn't careful.
    - id: ch04
      title: The Robin Shows the Way
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Mary skipped through every garden and all around the orchard, stopping to rest every few minutes before starting again. At last, she came to her own special path. She decided to see whether she could skip from one end to the other without stopping. It was a long way. She started slowly, but before she had gone halfway, she was so hot and out of breath that she had to stop. She did not mind very much. This time she had counted all the way to thirty, ten more than before. She gave a small, pleased laugh. And there was the robin, swaying on a long branch of ivy. He had followed her all the way there. Now he greeted her with a chirp. As Mary had jumped along, something heavy in her pocket had bumped against her at every step. At the sight of the robin, she remembered the key and laughed again.
        - id: ch04-b02
          speaker: mary
          text: >-
            Yesterday, you showed me where the key was. Today, you ought to show me the door. But I don't think you know where it is!
        - id: ch04-b03
          speaker: narrator
          text: >-
            The robin flew from the swinging ivy to the top of the wall. Then he opened his beak and poured out a loud, lovely song, simply to show off. There is almost nothing as lovable as a robin showing off, and robins do it nearly all the time.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Mary's Ayah had told her many stories about Magic. Mary always said that what happened next was Magic.
        - id: ch04-b05
          speaker: narrator
          text: >-
            One of the pleasant gusts came rushing along the path. This one was stronger than the others. It moved the tree branches and sent the long, untrimmed trails of ivy swinging away from the wall. Mary had stepped close to the robin. When the wind lifted the loose ivy, she saw something beneath it and jumped forward to catch the leaves in her hand. Behind them was a round knob. It was the knob of a door.
        - id: ch04-b06
          speaker: narrator
          text: >-
            She pushed both hands under the leaves and pulled them aside. The ivy was very thick, but most of it hung loose like a curtain. Only a few strands had grown across the wood and iron below. Mary's heart began to pound. Her hands trembled with delight and excitement. All the while, the robin sang and twittered and tipped his head to one side, as though he were every bit as excited as she was. Beneath her fingers, Mary felt something square and made of iron. There was a hole in it.
        - id: ch04-b07
          speaker: narrator
          text: >-
            It was the lock on the door that had been closed for ten years. Mary reached into her pocket and took out the key. It fit the keyhole. She pushed it in and tried to turn it. She needed both hands, but the key turned.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Mary drew a long breath. She looked back along the path to see whether anyone was coming. No one was. No one ever came there. She took another deep breath because she could not help herself. Then she held back the curtain of ivy and pushed the door. Slowly, slowly, it opened.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Mary slipped through and shut the door behind her. With her back against it, she looked around, breathing fast with excitement, wonder, and delight.
        - id: ch04-b10
          speaker: narrator
          text: She was inside the secret garden.
