audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    martha:
      display_name: Martha Sowerby
      tts:
        delivery: cheerful, candid, and easy in Yorkshire character
        timbre: bright and wholesome
        pace: lively
        pitch: medium-high
    mrs_medlock:
      display_name: Mrs. Medlock
      tts:
        delivery: brisk, practical, and firmly house-proud
        timbre: full and crisp
        pace: measured
        pitch: medium-low
    mr_craven:
      display_name: Mr. Craven
      tts:
        delivery: distracted, weary, and restrained
        timbre: dark and refined
        pace: slow
        pitch: low
  chapters:
    - id: ch01
      title: Dickon at Last
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Mary raced back to her room so fast that she arrived out of breath, with her hair tumbling over her forehead and her cheeks bright pink. Dinner was on the table, and Martha stood waiting beside it.
        - id: ch01-b02
          speaker: martha
          text: You're a bit late. Where've you been?
        - id: ch01-b03
          speaker: mary
          text: I've seen Dickon! I've finally seen him!
          emotion: happy
        - id: ch01-b04
          speaker: martha
          text: I knew he'd come. Well, what do you think of him?
          emotion: happy
        - id: ch01-b05
          speaker: mary
          text: I think... I think he's beautiful!
          emotion: happy
        - id: ch01-b06
          speaker: narrator
          text: >-
            Mary said it as if she had made up her mind and would not be argued with. Martha looked surprised, though pleased as well.
        - id: ch01-b07
          speaker: martha
          text: >-
            He's the best boy ever born, but we never called him handsome. His nose turns up too much.
        - id: ch01-b08
          speaker: mary
          text: I like his nose that way.
        - id: ch01-b09
          speaker: martha
          text: And his eyes are awfully round, though they are a nice color.
        - id: ch01-b10
          speaker: mary
          text: >-
            I like them round. They're exactly the color of the sky above the moor.
        - id: ch01-b11
          speaker: narrator
          text: Martha's face lit up.
        - id: ch01-b12
          speaker: martha
          text: >-
            Mother says his eyes got that color from always looking up at birds and clouds. But his mouth is big, isn't it?
        - id: ch01-b13
          speaker: mary
          text: I love his big mouth. I wish mine looked just like it.
        - id: ch01-b14
          speaker: narrator
          text: Martha gave a delighted chuckle.
        - id: ch01-b15
          speaker: martha
          text: >-
            It would look mighty funny in your little face. Still, I knew you'd take to him. What did you think of the seeds and garden tools?
          emotion: happy
        - id: ch01-b16
          speaker: mary
          text: How did you know he brought them?
        - id: ch01-b17
          speaker: martha
          text: >-
            I never imagined he wouldn't. If those things were anywhere in Yorkshire, Dickon was sure to bring them. He's that dependable.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Mary feared Martha might start asking questions that were hard to answer. To her relief, Martha was much more interested in the seeds and tools. Mary felt frightened only once. It happened when Martha began wondering where all those flowers were going to be planted.
        - id: ch01-b19
          speaker: martha
          text: Who did you ask for a place to plant them?
        - id: ch01-b20
          speaker: mary
          text: I haven't asked anyone yet.
        - id: ch01-b21
          speaker: martha
          text: I wouldn't ask Mr. Roach, the head gardener. He's too grand.
        - id: ch01-b22
          speaker: mary
          text: >-
            I've never even seen him. I've only met some of the other gardeners and Ben Weatherstaff.
        - id: ch01-b23
          speaker: martha
          text: >-
            I'd ask Ben, if I were you. He's not nearly as bad as he looks, even if he is crabby. Mr. Craven lets him please himself because Ben was here when Mrs. Craven was alive. He used to make her laugh, and she liked him. Maybe he'd find you a quiet corner nobody uses.
        - id: ch01-b24
          speaker: mary
          text: >-
            If nobody used it or wanted it, then nobody could mind if I had it, could they?
        - id: ch01-b25
          speaker: martha
          text: There'd be no reason to mind. You wouldn't hurt anything.
    - id: ch02
      title: Mr. Craven Has Come Home
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Mary finished dinner as fast as she could. She was about to rush off for her hat when Martha stopped her.
        - id: ch02-b02
          speaker: martha
          text: >-
            I've something to tell you. I waited until you'd eaten. Mr. Craven came home this morning, and I think he means to see you.
        - id: ch02-b03
          speaker: narrator
          text: Mary went pale.
        - id: ch02-b04
          speaker: mary
          text: >-
            Oh! But why? He wouldn't see me when I first came. I heard Pitcher say so.
          emotion: fearful
        - id: ch02-b05
          speaker: martha
          text: >-
            Mrs. Medlock says it's because of Mother. Mother met him on her way to Thwaite village. She'd never spoken to him before, though Mrs. Craven came to our cottage two or three times. He'd forgotten, but Mother hadn't, so she dared to stop him. I don't know what she told him about you. Whatever it was, it made him want to see you before he leaves again tomorrow.
        - id: ch02-b06
          speaker: mary
          text: He's leaving tomorrow? Oh, I'm so glad!
          emotion: happy
        - id: ch02-b07
          speaker: martha
          text: >-
            He'll be gone a long while, maybe until fall or winter. He's traveling abroad. He always does.
        - id: ch02-b08
          speaker: mary
          text: Oh, I'm so glad. So very glad!
          emotion: happy
        - id: ch02-b09
          speaker: narrator
          text: >-
            If Mr. Craven stayed away until fall or winter, Mary would have plenty of time to watch the secret garden wake up. By the time he returned, he might discover the garden and take it away from her. Even so, she would at least have had all those months inside it.
        - id: ch02-b10
          speaker: mary
          text: When do you think he'll want to see—
        - id: ch02-b11
          speaker: narrator
          text: >-
            Before Mary could finish, the door opened and Mrs. Medlock came in. She wore her best black dress and cap. A large brooch at her collar held a colored photograph of Mr. Medlock, who had died years before. She always wore it when dressed up. Now she looked both nervous and excited.
        - id: ch02-b12
          speaker: mrs_medlock
          text: >-
            Your hair is a mess. Go brush it. Martha, get her into her best dress. Mr. Craven sent me to bring her to his study.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The color drained from Mary's face. Her heart began to pound, and she felt herself changing back into the stiff, plain, silent child she had once been. Without answering Mrs. Medlock, she turned and walked into her bedroom, with Martha following. Mary said nothing while Martha put her into another dress and brushed her tangled hair. Once she looked neat, she silently followed Mrs. Medlock through the long corridors. What could she possibly say? She had no choice but to meet Mr. Craven. He would dislike her, and she would dislike him. Mary was sure she already knew exactly what he would think of her.
    - id: ch03
      title: In the Study
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Mrs. Medlock led Mary into a part of the house she had never visited. At last, she knocked on a door. Someone called for them to enter. Inside, a man sat in an armchair before the fire.
        - id: ch03-b02
          speaker: mrs_medlock
          text: This is Miss Mary, sir.
        - id: ch03-b03
          speaker: mr_craven
          text: >-
            You may leave her with me. I'll ring when I want you to take her away.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The door closed behind Mrs. Medlock, leaving Mary alone. She could only stand there, a plain little figure twisting her thin hands together. The man in the chair was not truly a hunchback. His shoulders were high and somewhat crooked, and streaks of white ran through his black hair. He turned his head over one of those high shoulders to look at her.
        - id: ch03-b05
          speaker: mr_craven
          text: Come closer.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Mary obeyed. Mr. Craven was not ugly. He might have been handsome if his face had not looked so miserable. Seeing Mary seemed to trouble him, as if he had no idea what to do with her.
        - id: ch03-b07
          speaker: mr_craven
          text: Are you well?
        - id: ch03-b08
          speaker: mary
          text: Yes.
        - id: ch03-b09
          speaker: mr_craven
          text: Are they caring for you properly?
        - id: ch03-b10
          speaker: mary
          text: Yes.
        - id: ch03-b11
          speaker: narrator
          text: He studied her and rubbed his forehead in irritation.
        - id: ch03-b12
          speaker: mr_craven
          text: You're very thin.
        - id: ch03-b13
          speaker: mary
          text: I am getting fatter.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Mary answered in the stiffest voice she knew how to make. What an unhappy face he had. His dark eyes barely seemed to see her at all. It was as though they were looking at someone or something far away, and he could hardly pull his thoughts back to the child standing before him.
        - id: ch03-b15
          speaker: mr_craven
          text: >-
            I forgot about you. How was I supposed to remember? I meant to find you a governess or a nurse or someone, but it slipped my mind.
        - id: ch03-b16
          speaker: mary
          text: Please... please...
          emotion: fearful
        - id: ch03-b17
          speaker: narrator
          text: A lump in her throat stopped the words.
        - id: ch03-b18
          speaker: mr_craven
          text: What are you trying to say?
        - id: ch03-b19
          speaker: mary
          text: >-
            I'm too old for a nurse. And please, please don't give me a governess yet.
          emotion: fearful
        - id: ch03-b20
          speaker: narrator
          text: Mr. Craven stared at her and rubbed his forehead again.
        - id: ch03-b21
          speaker: mr_craven
          text: That's what the Sowerby woman told me.
        - id: ch03-b22
          speaker: narrator
          text: Mary found a tiny bit of courage.
        - id: ch03-b23
          speaker: mary
          text: Is she Martha's mother?
        - id: ch03-b24
          speaker: mr_craven
          text: Yes, I believe so.
        - id: ch03-b25
          speaker: mary
          text: She understands children. She has twelve of them. She knows.
        - id: ch03-b26
          speaker: narrator
          text: Mr. Craven seemed to wake from his thoughts.
        - id: ch03-b27
          speaker: mr_craven
          text: What is it you want to do?
        - id: ch03-b28
          speaker: mary
          text: >-
            I want to play outside. I never liked being outdoors in India, but here it makes me hungry, and I'm getting fatter.
        - id: ch03-b29
          speaker: mr_craven
          text: >-
            Mrs. Sowerby thought the air would help you. Perhaps she's right. She said you should grow stronger before beginning lessons with a governess.
        - id: ch03-b30
          speaker: mary
          text: >-
            When I play outside and the wind blows across the moor, I feel stronger.
        - id: ch03-b31
          speaker: mr_craven
          text: Where do you play?
        - id: ch03-b32
          speaker: mary
          text: >-
            Everywhere. Martha's mother sent me a jump rope. I run and skip, and I watch to see whether things are pushing up through the ground. I don't hurt anything.
        - id: ch03-b33
          speaker: mr_craven
          text: >-
            You needn't be so afraid. How could a little child like you do any harm? You may do as you please.
        - id: ch03-b34
          speaker: narrator
          text: >-
            Mary raised one hand to her throat. She could feel an excited lump jumping there and was afraid he might somehow see it. Still, she dared to move one step closer.
        - id: ch03-b35
          speaker: mary
          text: May I really?
          emotion: surprised
        - id: ch03-b36
          speaker: narrator
          text: Her anxious face troubled him even more.
        - id: ch03-b37
          speaker: mr_craven
          text: >-
            Don't be so frightened. Of course you may. I'm your guardian, though not a very good one. I have no time or attention to give a child. I'm ill, miserable, and unable to settle my mind. But I do want you comfortable and happy. I know nothing about children, so Mrs. Medlock must see that you have everything you need. I asked to see you because Mrs. Sowerby said I should. Her daughter had told her about you. She believed you needed fresh air, freedom, and room to run.
        - id: ch03-b38
          speaker: mary
          text: She really does understand children.
        - id: ch03-b39
          speaker: mr_craven
          text: >-
            She should, with twelve of them. I thought it rather forward of her to stop me on the moor, but she told me that Mrs. Craven had once been kind to her.
        - id: ch03-b40
          speaker: narrator
          text: Speaking his dead wife's name seemed painful for him.
        - id: ch03-b41
          speaker: mr_craven
          text: >-
            Mrs. Sowerby is a respectable woman, and now that I've met you, I think her advice was sensible. Stay outside as much as you wish. The grounds are large. Go wherever you like and entertain yourself however you like. Is there anything you want? Toys, perhaps? Books? Dolls?
    - id: ch04
      title: A Bit of Earth
      blocks:
        - id: ch04-b01
          speaker: mary
          text: Might I... might I have a bit of earth?
        - id: ch04-b02
          speaker: narrator
          text: >-
            In her eagerness, Mary did not notice how strange the request must sound. The words had simply come out, and they were not even the ones she had meant to say. Mr. Craven stared at her as if she had astonished him.
        - id: ch04-b03
          speaker: mr_craven
          text: Earth? What do you mean?
          emotion: surprised
        - id: ch04-b04
          speaker: mary
          text: >-
            A place to plant seeds, so I can grow things and watch them come alive.
        - id: ch04-b05
          speaker: narrator
          text: He looked at her for a moment, then quickly passed a hand over his eyes.
        - id: ch04-b06
          speaker: mr_craven
          text: Do gardens matter that much to you?
        - id: ch04-b07
          speaker: mary
          text: >-
            I didn't know anything about gardens in India. I was always tired and sick, and it was too hot. Sometimes I made little beds in the sand and pushed flowers into them. But things are different here.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Mr. Craven rose and slowly crossed the room.
        - id: ch04-b09
          speaker: mr_craven
          text: A bit of earth.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Mary had the feeling that her words had reminded him of someone. When he stopped and turned back to her, his dark eyes looked almost gentle. There was even the beginning of a smile on his face.
        - id: ch04-b11
          speaker: mr_craven
          text: >-
            You may have all the earth you want. You remind me of someone else who loved the earth and growing things. When you find the piece you want, take it, child, and make it come alive.
        - id: ch04-b12
          speaker: mary
          text: I may choose anywhere, as long as nobody wants it?
        - id: ch04-b13
          speaker: mr_craven
          text: >-
            Anywhere. Now you must go. I'm tired. Good-bye. I'll be away for the whole summer.
        - id: ch04-b14
          speaker: narrator
          text: >-
            He rang the bell. Mrs. Medlock appeared so quickly that Mary guessed she had been waiting in the hall.
        - id: ch04-b15
          speaker: mr_craven
          text: >-
            Mrs. Medlock, now that I've seen Mary, I understand Mrs. Sowerby's point. The child must grow less delicate before lessons begin. Give her plain, healthy meals. Let her run wild in the gardens, and don't watch over her too closely. She needs freedom, fresh air, and plenty of play. Mrs. Sowerby may visit her sometimes, and Mary may occasionally go to the cottage.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Mrs. Medlock looked pleased. She had always considered Mary a tiresome responsibility and had already avoided watching her whenever she dared. Now she was relieved to hear that Mr. Craven did not expect much looking after at all. Besides that, she was genuinely fond of Martha's mother.
        - id: ch04-b17
          speaker: mrs_medlock
          text: >-
            Thank you, sir. Susan Sowerby and I went to school together. You couldn't find a more sensible or kindhearted woman in a day's walk. I never had children, while she's raised twelve, and healthier, better children you never saw. Miss Mary will come to no harm with them. When it comes to children, I'd trust Susan's advice every time. She has a healthy way of thinking, if you know what I mean.
        - id: ch04-b18
          speaker: mr_craven
          text: I understand. Take Miss Mary away, and send Pitcher to me.
    - id: ch05
      title: Permission and a Promise
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            At the end of Mary's corridor, Mrs. Medlock left her. Mary flew back to her room, where Martha was waiting. Martha had hurried there after clearing away the dinner things.
        - id: ch05-b02
          speaker: mary
          text: >-
            I can have my garden! I can put it anywhere I want! I won't have a governess for a long time. Your mother may come see me, and I may visit your cottage. He said a little girl like me can't hurt anything, and I may do whatever I like, anywhere!
          emotion: happy
        - id: ch05-b03
          speaker: martha
          text: Well! That was kind of him, wasn't it?
          emotion: happy
        - id: ch05-b04
          speaker: mary
          text: >-
            Martha, he really is a nice man. It's only that his face looks so miserable, and his forehead is all drawn tight.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Mary ran back to the garden as fast as she could. She had been gone far longer than she expected, and Dickon needed to start his five-mile walk home early. When she slipped through the ivy-covered door, he was no longer working where she had left him. The tools had been carefully laid together beneath a tree. Mary hurried over to them, looking all around as she ran, but there was no sign of Dickon anywhere. He had gone. The secret garden stood empty except for the robin. Just then, it flew over the wall and perched on a tall rosebush to watch her.
        - id: ch05-b06
          speaker: mary
          text: >-
            He's gone. Oh, could he... could he... could he have been a wood fairy after all?
          emotion: sad
        - id: ch05-b07
          speaker: narrator
          text: >-
            Then something white fastened to the rosebush caught her eye. It was a scrap from the very letter she had printed for Martha to send Dickon. A long thorn held the paper to the branch, and Mary knew at once that Dickon had left it for her. Roughly printed letters and a little drawing covered the scrap. At first, she could not tell what the picture was supposed to be. Then she made out a bird sitting on its nest. Underneath, Dickon had printed a promise in his own rough spelling.
        - id: ch05-b08
          speaker: narrator
          text: I will cum bak.
