audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    martha:
      display_name: 玛莎
      tts: {delivery: 爽直热情，带亲切的约克郡乡音, timbre: 明亮朴实, pace: 轻快, pitch: 中高音}
    mrs_medlock:
      display_name: 梅德洛克太太
      tts: {delivery: 干练讲究，偶尔透出不耐烦, timbre: 扎实清楚, pace: 中等偏快, pitch: 中音}
    archibald_craven:
      display_name: 克雷文先生
      tts: {delivery: 疲惫疏离，悲痛压在话音深处, timbre: 低沉暗哑, pace: 缓慢而时有停顿, pitch: 低音}
  chapters:
    - id: ch01
      title: 迪肯是什么模样
      blocks:
        - {id: ch01-b01, speaker: narrator, text: 玛丽一路飞奔，回到房间时已经喘不过气。她的头发乱蓬蓬地搭在额前，两颊红得发亮。桌上摆好了午饭，玛莎就在旁边等她。}
        - {id: ch01-b02, speaker: martha, text: “回来得有点晚啊。你跑哪儿去了？”}
        - {id: ch01-b03, speaker: mary_lennox, text: “我见到迪肯了！我真的见到迪肯了！”}
        - {id: ch01-b04, speaker: martha, text: “我早知道他会来。怎么样，你喜欢他不？”}
        - {id: ch01-b05, speaker: mary_lennox, text: “我觉得……我觉得他真好看！”}
        - {id: ch01-b06, speaker: narrator, text: 玛丽说得十分坚决。玛莎先是一愣，随后又高兴起来。}
        - {id: ch01-b07, speaker: martha, text: “他是天底下最好的男孩，这没得说。可咱们从没觉得他长得俊，他的鼻子翘得太高啦。”}
        - {id: ch01-b08, speaker: mary_lennox, text: “我偏偏喜欢他鼻子翘。”}
        - {id: ch01-b09, speaker: martha, text: “那双眼睛也太圆了些。不过颜色倒是真好看。”}
        - {id: ch01-b10, speaker: mary_lennox, text: “我就爱圆眼睛。而且那颜色，跟荒原上面的天空一模一样。”}
        - {id: ch01-b11, speaker: narrator, text: 玛莎笑开了花。}
        - {id: ch01-b12, speaker: martha, text: “妈妈说，他整天仰头看鸟、看云，眼睛才染成了天的颜色。可是他的嘴够大的，是吧？”}
        - {id: ch01-b13, speaker: mary_lennox, text: “我就爱他的大嘴巴。我真希望自己的嘴也长得那样。”}
        - {id: ch01-b14, speaker: narrator, text: 玛莎听得直乐。}
        - {id: ch01-b15, speaker: martha, text: “那张大嘴长到你的小脸上，可有得瞧了！不过你一见他，我就知道准会这样。种子和工具怎么样，喜欢吗？”}
        - {id: ch01-b16, speaker: mary_lennox, text: “你怎么知道他带来了？”}
        - {id: ch01-b17, speaker: martha, text: “我根本没想过他会空手来。只要约克郡找得到，他一定给你带到。迪肯就是这么靠得住。”}
        - {id: ch01-b18, speaker: narrator, text: 玛丽担心玛莎追问下去，自己会答不上来。幸好玛莎只顾着谈种子和工具，没有问别的。只有一个时刻把玛丽吓了一跳，那就是玛莎问起，这些花究竟要种在哪里。}
        - {id: ch01-b19, speaker: martha, text: “这事你找谁问过？”}
        - {id: ch01-b20, speaker: mary_lennox, text: “我还没问过任何人。”}
        - {id: ch01-b21, speaker: martha, text: “那就别问园丁头儿罗奇先生，他架子太大。要是我，我会去问本·韦瑟斯塔夫。别看他总是凶巴巴的，其实没那么坏。克雷文太太活着时，他常把她逗笑，她很喜欢他，所以克雷文先生也由着他。说不定，他能替你找个没人留意的角落。”}
        - {id: ch01-b22, speaker: mary_lennox, text: “要是那个地方很偏，又没有人要，我拿来用，谁也不会反对吧？”}
        - {id: ch01-b23, speaker: martha, text: “当然不会。你又不会伤着什么。”}
    - id: ch02
      title: 书房里的监护人
      blocks:
        - {id: ch02-b01, speaker: narrator, text: 玛丽匆匆吃完饭，刚要回卧室拿帽子，玛莎却叫住了她。}
        - {id: ch02-b02, speaker: martha, text: “我还有件事没告诉你。我想先让你把饭吃完。克雷文先生今早回来了，我看他想见你。”}
        - {id: ch02-b03, speaker: narrator, text: 玛丽的脸顿时白了。}
        - {id: ch02-b04, speaker: mary_lennox, text: “为什么？我刚来时，他明明不愿意见我。我听见皮彻说过。”}
        - {id: ch02-b05, speaker: martha, text: “梅德洛克太太说，是我妈妈劝的。妈妈去斯韦特村的路上碰见了他。她从来没和他说过话，可克雷文太太以前来过我家两三次。他忘了，妈妈没忘，就壮着胆子把他拦下来。我不知道妈妈说了你什么，只知道她劝得他想在明天出门以前见你一面。”}
        - {id: ch02-b06, speaker: mary_lennox, text: “他明天就走？太好了！”}
        - {id: ch02-b07, speaker: martha, text: “这一走可久了，也许秋天，甚至冬天才回来。他又要去国外旅行。他总是这样。”}
        - {id: ch02-b08, speaker: mary_lennox, text: “太好了，真是太好了！”}
        - {id: ch02-b09, speaker: narrator, text: 只要克雷文先生到了秋天，甚至冬天才回来，她就有时间守着秘密花园，看它一点点苏醒。就算那时候被他发现，花园也被他收走，她至少已经看过它活起来，已经拥有过那么长一段日子。玛丽正要问他什么时候见自己，话还没说完，房门忽然开了。梅德洛克太太穿着最体面的黑裙和帽子走进来。她的衣领上别着一枚大胸针，里面是多年前去世的梅德洛克先生的彩色照片。每逢盛装，她总会戴上它。今天，她显得又紧张又兴奋。}
        - {id: ch02-b10, speaker: mrs_medlock, text: “头发都乱了，快去梳好。玛莎，帮她换上最好的裙子。克雷文先生让我带她去书房。”}
        - {id: ch02-b11, speaker: narrator, text: 玛丽脸上的红润一下子全消失了，心也怦怦直跳。那个僵硬、难看、沉默的孩子仿佛又回来了。她连梅德洛克太太也没回答，只转身走进卧室。玛莎替她换裙子、梳头发时，她始终一言不发。收拾整齐以后，她又默默跟着梅德洛克太太，穿过一道又一道长廊。她能说什么呢？她非见克雷文先生不可。他不会喜欢她，她也不会喜欢他。她很清楚他会怎样看待自己。她们到了宅子里一片陌生的地方。最后，梅德洛克太太敲了门。里面有人说了“进来”，她们才一同走进去。火炉前的扶手椅里坐着一个男人。}
        - {id: ch02-b12, speaker: mrs_medlock, text: “先生，玛丽小姐来了。”}
        - {id: ch02-b13, speaker: archibald_craven, text: “你出去吧，让她留下。等该带她走时，我会按铃叫你。”}
        - {id: ch02-b14, speaker: narrator, text: 梅德洛克太太出去，关上了门。玛丽瘦小又不起眼，只能站在那里等候，绞着两只细瘦的手。椅子里的男人并不真是驼背，只是肩膀高高耸起，还有些歪。他的黑发里夹着一道道银丝。他从高耸的肩头转过脸来，终于对她开了口。}
        - {id: ch02-b15, speaker: archibald_craven, text: “过来。”}
        - {id: ch02-b16, speaker: narrator, text: 玛丽依言走到他跟前。他其实一点也不难看。要不是那张脸上满是愁苦，他原本会是一个英俊的人。可他望着玛丽时，像是仅仅看见她便觉得烦恼焦躁，又像是翻遍了心思，也完全不知道该拿这个孩子怎么办。}
        - {id: ch02-b17, speaker: archibald_craven, text: “身体好吗？”}
        - {id: ch02-b18, speaker: mary_lennox, text: “好。”}
        - {id: ch02-b19, speaker: archibald_craven, text: “他们照顾得好吗？”}
        - {id: ch02-b20, speaker: mary_lennox, text: “好。”}
        - {id: ch02-b21, speaker: narrator, text: 他烦躁地揉着额头，把她打量一遍。}
        - {id: ch02-b22, speaker: archibald_craven, text: “你太瘦了。”}
        - {id: ch02-b23, speaker: mary_lennox, text: “我已经在长胖了。”}
        - {id: ch02-b24, speaker: narrator, text: 玛丽故意把话说得又冷又硬，连她自己也知道，这是她最僵硬的语气。他的脸实在太不快活了。那双黑眼睛几乎没有看见玛丽，仿佛正越过她，望着别的什么。他甚至很难把飘远的心思拉回来，放在眼前的孩子身上。}
        - {id: ch02-b25, speaker: archibald_craven, text: “我把你忘了。我怎么可能记得你呢？本来想给你请家庭教师，或者保姆之类的人，后来也忘了。”}
        - {id: ch02-b26, speaker: mary_lennox, text: “请您……请您……”}
        - {id: ch02-b27, speaker: narrator, text: 玛丽喉咙里像堵着一团东西，说不下去了。}
        - {id: ch02-b28, speaker: archibald_craven, text: “你想说什么？”}
        - {id: ch02-b29, speaker: mary_lennox, text: “我已经大得不用保姆了。还有，请您先别给我请家庭教师。”}
        - {id: ch02-b30, speaker: narrator, text: 克雷文先生又揉着额头，盯了她一会儿。}
        - {id: ch02-b31, speaker: archibald_craven, text: “索尔比家那个女人说的也是这话。”}
        - {id: ch02-b32, speaker: mary_lennox, text: “她是玛莎的妈妈吗？”}
        - {id: ch02-b33, speaker: archibald_craven, text: “大概是吧。”}
        - {id: ch02-b34, speaker: mary_lennox, text: “她懂孩子。她有十二个，所以她懂。”}
        - {id: ch02-b35, speaker: narrator, text: 这句话总算让他回过神来。}
        - {id: ch02-b36, speaker: archibald_craven, text: “那么，你自己想做什么？”}
        - {id: ch02-b37, speaker: mary_lennox, text: “我想在外面玩。在印度时，我不喜欢出门。可在这里玩，我会觉得饿，也会慢慢长胖。”}
        - {id: ch02-b38, speaker: narrator, text: 玛丽努力不让自己的声音发抖。克雷文先生没有移开目光，一直看着她，像是头一次认真留意这个孩子。}
        - {id: ch02-b39, speaker: archibald_craven, text: “索尔比太太说，出去玩对你有好处。也许她说得对。她觉得你该先把身体养壮，再请老师。”}
        - {id: ch02-b40, speaker: mary_lennox, text: “我一出去玩，荒原上的风吹过来，身上就有力气了。”}
        - {id: ch02-b41, speaker: archibald_craven, text: “你平常都在哪里玩？”}
        - {id: ch02-b42, speaker: mary_lennox, text: “到处都玩。玛莎的妈妈送了我一根跳绳。我跳绳，也跑来跑去，还找找土里有没有东西冒出来。我什么也不会弄坏。”}
        - {id: ch02-b43, speaker: archibald_craven, text: “别那么害怕。像你这样的小孩子，能弄坏什么呢？你愿意做什么，就做什么吧。”}
    - id: ch03
      title: 一小块地
      blocks:
        - {id: ch03-b01, speaker: narrator, text: 玛丽抬手捂住喉咙。她实在太激动了，仿佛有个硬块在里面猛地跳了一下。她怕克雷文先生看出来，却还是忍不住朝他走近一步。}
        - {id: ch03-b02, speaker: mary_lennox, text: “我真的可以吗？”}
        - {id: ch03-b03, speaker: narrator, text: 她不安的小脸让克雷文先生更加烦恼。}
        - {id: ch03-b04, speaker: archibald_craven, text: “别那么害怕！你当然可以。我是你的监护人，可我不是一个称职的监护人。我没时间，也没心思照顾你。我病得太重，过得太痛苦，脑子里也乱得很。不过，我希望你过得舒服、快活。我不懂孩子，梅德洛克太太会给你备齐需要的东西。今天叫你来，是索尔比太太劝我应该见见你。她女儿说起过你。她认为你需要新鲜空气，需要自由自在地跑动。”}
        - {id: ch03-b05, speaker: mary_lennox, text: “她最懂孩子。”}
        - {id: ch03-b06, speaker: archibald_craven, text: “她当然应该懂。我起先还觉得，她竟敢在荒原上拦我，胆子实在不小。可她说……克雷文太太从前待她很好。”}
        - {id: ch03-b07, speaker: narrator, text: 说出亡妻的名字，对他似乎十分艰难。}
        - {id: ch03-b08, speaker: archibald_craven, text: “她是个正派的女人。现在见过你，我知道她的话很有道理。你爱在外面玩多久都行。这地方很大，想去哪儿就去哪儿，想怎么玩就怎么玩。你还有什么想要的吗？玩具、书，还是洋娃娃？”}
        - {id: ch03-b09, speaker: mary_lennox, text: “我能不能……我能有一小块地吗？”}
        - {id: ch03-b10, speaker: narrator, text: 玛丽心里太急，顾不上多想。她没发现这句话听起来有多古怪，也没发现自己脱口而出的，根本不是原本想好的说法。克雷文先生听了，着实吃了一惊。她接下来的话也说得断断续续。}
        - {id: ch03-b11, speaker: archibald_craven, text: “地？你要它做什么？”}
        - {id: ch03-b12, speaker: mary_lennox, text: “我要把种子种进去，让东西长出来，看着它们活起来。”}
        - {id: ch03-b13, speaker: narrator, text: 他静静地望了她片刻，忽然抬手，飞快地擦过眼睛。}
        - {id: ch03-b14, speaker: archibald_craven, text: “你就那么喜欢花园吗？”}
        - {id: ch03-b15, speaker: mary_lennox, text: “我在印度时不懂花园。那时总生病，总是累，天也太热。有时我会在沙地里做几个小花坛，再把花插进去。可这里不一样。”}
        - {id: ch03-b16, speaker: narrator, text: 克雷文先生站起来，在房间里慢慢踱步。}
        - {id: ch03-b17, speaker: archibald_craven, text: “一小块地。”}
        - {id: ch03-b18, speaker: narrator, text: 他像是在对自己说。玛丽望着他在房间里缓缓走动，猜想自己一定是不知怎么勾起了他的一段回忆。等他终于停下脚步，再转过来对她说话时，那双乌黑的眼睛几乎已经变得柔和亲切，脸上也有了一点近似微笑的神情。}
        - {id: ch03-b19, speaker: archibald_craven, text: “你想要多少地，就拿多少地。你让我想起另一个人，她也爱土地，爱所有会生长的东西。等你找到一块中意的地，就拿去吧，孩子，让它活起来。”}
        - {id: ch03-b20, speaker: mary_lennox, text: “不管在哪里都可以吗？只要没人要？”}
        - {id: ch03-b21, speaker: archibald_craven, text: “哪里都可以。好了，你该走了，我累了。再见吧，整个夏天我都不会回来。”}
        - {id: ch03-b22, speaker: narrator, text: 他按了铃。梅德洛克太太立刻进来，快得让玛丽怀疑她一直等在走廊上。}
        - {id: ch03-b23, speaker: archibald_craven, text: “梅德洛克太太，见过这孩子，我总算明白索尔比太太的意思了。先把她身体养好，再让她上课。给她简单、健康的食物，让她在花园里随意跑，不必盯得太紧。她需要自由，需要新鲜空气，也需要痛快地玩。索尔比太太可以不时来看看她，她偶尔也可以去索尔比家的村舍。”}
        - {id: ch03-b24, speaker: narrator, text: 梅德洛克太太听见不必太费心“照看”玛丽，脸上露出喜色，心里也立刻松了口气。她一直觉得这个托付很麻烦，实际上，早已在自己敢做的限度里，尽量少去见玛丽。除此以外，她本来就喜欢玛莎的母亲。}
        - {id: ch03-b25, speaker: mrs_medlock, text: “谢谢您，先生。我和苏珊·索尔比从前一起上学。您走上一整天，也找不到比她更明事理、更热心的人。我没生过孩子，她有十二个，个个都健康懂事。玛丽小姐跟他们在一起，绝不会学坏。说到照料孩子，我总愿意听苏珊的。她这个人怎么说呢，心思特别健全，不知您懂不懂我的意思。”}
        - {id: ch03-b26, speaker: archibald_craven, text: “我懂。现在带玛丽小姐走，再让皮彻来见我。”}
    - id: ch04
      title: 我会回来的
      blocks:
        - {id: ch04-b01, speaker: narrator, text: 梅德洛克太太把玛丽送到她住的那条走廊尽头，便离开了。玛丽一路飞奔回房，发现玛莎正等在那里。其实，玛莎收走午餐用过的杯盘以后，也立刻急匆匆地赶了回来。}
        - {id: ch04-b02, speaker: mary_lennox, text: “我可以有自己的花园了！我想放在哪里都行！很久都不用请家庭教师！你妈妈会来看我，我也能去你们家！他说，我这么小的女孩什么也弄不坏。我想做什么就做什么，哪儿都可以去！”}
        - {id: ch04-b03, speaker: martha, text: “嗳，他对你真不错，是不是？”}
        - {id: ch04-b04, speaker: mary_lennox, text: “玛莎，他其实真是个好人。只是他的脸太悲苦，眉头也总皱得紧紧的。”}
        - {id: ch04-b05, speaker: narrator, text: 玛丽又飞快跑向花园。她离开的时间远比自己料想的长。迪肯要步行五英里回家，一定得早早动身。她从常春藤下钻进门里，先望向自己离开迪肯时的地方。那里没有人。工具整整齐齐地放在一棵树下。她连忙跑过去，围着工具转身，朝花园的每一个方向寻找。可无论她望向哪里，都不见迪肯的身影。他已经走了。秘密花园空荡荡的。只有知更鸟刚刚飞过墙头，落在一株树状月季上看着她。}
        - {id: ch04-b06, speaker: mary_lennox, text: “他走了。难道他……难道他……他真的只是一个林中精灵？”}
        - {id: ch04-b07, speaker: narrator, text: 树状月季上系着的一点白色吸引了玛丽。她凑近一看，原来是一张纸。准确地说，那是她写给玛莎、让玛莎寄给迪肯的那封信的一角。纸片被一根长刺牢牢钉在枝头，她立刻知道，这是迪肯留下的。上面歪歪扭扭地印着几个字母，还画了一幅说不上是什么的画。起初，她一点也看不懂。再仔细看了一会儿，才认出那是一只鸟坐在巢里。画的下面还有一行印出来的字。}
        - {id: ch04-b08, speaker: narrator, text: “我会回来的。”}
