audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    martha:
      display_name: Martha
      tts:
        delivery: good-natured, candid, and broad in Yorkshire character
        timbre: rosy and sturdy
        pace: lively
        pitch: medium-high
    ben_weatherstaff:
      display_name: Ben Weatherstaff
      tts:
        delivery: crusty, blunt, and quietly tender beneath a Yorkshire roughness
        timbre: dry and weathered
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Martha
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Mary woke in the morning to the noise of a young housemaid raking cinders from the fireplace. She watched the girl for a moment, then looked around. The room was curious and gloomy. A tapestry covered the walls, showing a forest full of hunters, horses, dogs, ladies, and strangely dressed people. Far off among the trees stood the towers of a castle. It almost made Mary feel as if she were inside that forest. Through the deep window, she saw a great sweep of land rising into the distance. It had almost no trees and looked like an endless, dull purple sea.
        - id: ch01-b02
          speaker: mary
          text: What is that?
        - id: ch01-b03
          speaker: narrator
          text: The housemaid stood and looked where Mary was pointing.
        - id: ch01-b04
          speaker: martha
          text: That out there?
        - id: ch01-b05
          speaker: mary
          text: Yes.
        - id: ch01-b06
          speaker: martha
          text: That's the moor. Does tha like it?
        - id: ch01-b07
          speaker: mary
          text: No. I hate it.
        - id: ch01-b08
          speaker: martha
          text: Tha only says that because tha isn't used to it. It looks too big and bare now, but tha'll come to like it.
        - id: ch01-b09
          speaker: mary
          text: Do you like it?
        - id: ch01-b10
          speaker: martha
          text: Aye, I love it! It isn't bare at all. Sweet-smelling things grow everywhere. In spring and summer, the gorse and broom and heather all bloom, and the air smells like honey. There's fresh air enough for anyone, the sky looks ever so high, and the bees hum while the skylarks sing. I wouldn't live away from the moor for anything.
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: >-
            Mary listened with a serious, puzzled face. This girl was nothing like the servants she had known in India. They bowed low, called their masters grand names, and never spoke as if they were equals. Mary had ordered them about without saying please or thank you, and she had slapped her Ayah when she was angry. Now she wondered what this girl might do if Mary slapped her. The housemaid was round, rosy, and good-natured, but she looked sturdy enough to slap back if a little girl struck her.
            Everything in Martha's manner broke the rules Mary knew. In India, servants waited for commands and answered with respect. They called their employers protectors of the poor and used other grand titles. No one expected Mary to ask politely for what she wanted, and no one answered her as frankly as Martha did. Martha looked friendly, but not submissive. She talked about the moor because she loved it, not because Mary had asked for a lesson. That easy confidence puzzled Mary as much as the strange room and the enormous land outside the window.
        - id: ch01-b12
          speaker: mary
          text: You are a very strange servant.
        - id: ch01-b13
          speaker: narrator
          text: The girl sat back on her heels with the blacking brush in her hand and laughed. She did not seem offended at all.
        - id: ch01-b14
          speaker: martha
          text: >-
            Aye, I know. If there were a grand lady at Misselthwaite, I'd never be allowed upstairs. I might get work as a scullery maid, but that's all. I'm too common, and I speak too much Yorkshire. This is a funny house, though, grand as it is. There's hardly a master or mistress here except Mr. Pitcher and Mrs. Medlock. Mr. Craven won't be bothered with anything when he is home, and he's nearly always away. Mrs. Medlock gave me this place out of kindness. She says she couldn't have done it if Misselthwaite were run like other great houses.
        - id: ch01-b15
          speaker: mary
          text: Are you going to be my servant?
        - id: ch01-b16
          speaker: martha
          text: I'm Mrs. Medlock's servant, and she's Mr. Craven's. I'm to do the housemaid's work up here and wait on thee a little. But tha won't need much waiting on.
        - id: ch01-b17
          speaker: mary
          text: Then who is going to dress me?
        - id: ch01-b18
          speaker: narrator
          text: Martha stared at her in amazement. Her Yorkshire words came out broader than ever.
        - id: ch01-b19
          speaker: martha
          text: Canna tha dress thysen?
          emotion: surprised
        - id: ch01-b20
          speaker: mary
          text: What does that mean? I don't understand the way you talk.
        - id: ch01-b21
          speaker: martha
          text: Oh, I forgot. Mrs. Medlock warned me to be careful. I mean, can't you put on your own clothes?
        - id: ch01-b22
          speaker: mary
          text: No! I have never dressed myself. My Ayah did it, of course.
        - id: ch01-b23
          speaker: martha
          text: >-
            Well, it's time tha learned. Tha can't start any younger, and waiting on thysen will do thee good. My mother says she can't see why rich people's children don't grow into proper fools. Nurses wash them and dress them and take them walking as if they were puppies.
        - id: ch01-b24
          speaker: mary
          text: India is different.
        - id: ch01-b25
          speaker: narrator
          text: Mary could hardly bear Martha's boldness, but Martha did not shrink from her.
        - id: ch01-b26
          speaker: martha
          text: >-
            Aye, I can see it must be different. Maybe it's because there are so many Black people there instead of respectable white people. When I heard tha was coming from India, I thought tha might be Black too.
        - id: ch01-b27
          speaker: narrator
          text: Mary sat straight up in bed, furious.
        - id: ch01-b28
          speaker: mary
          text: What? You thought I was a native? You... you daughter of a pig!
          emotion: angry
        - id: ch01-b29
          speaker: narrator
          text: Martha flushed and stared back.
        - id: ch01-b30
          speaker: martha
          text: >-
            Who are tha calling names? There's no need to be so angry. That's no way for a young lady to speak. I've nothing against Black people. The religious tracts say a Black man is a man and a brother. I've never seen one, and I was pleased to think I might see one close by. This morning I crept to the bed and lifted the cover very carefully. But there tha were, no more Black than I am, though tha is terribly yellow.
        - id: ch01-b31
          speaker: narrator
          text: Mary made no effort to control her rage or shame.
        - id: ch01-b32
          speaker: mary
          text: >-
            You thought I was a native! How dare you! You know nothing about them. They aren't people. They're servants, and they have to bow to you. You know nothing about India. You know nothing about anything!
          emotion: angry
        - id: ch01-b33
          speaker: narrator
          text: >-
            Mary was helpless against Martha's simple stare. Suddenly she felt horribly lonely, far from everything she understood and everything that understood her. She threw herself facedown on the pillows and began to sob wildly. Martha was frightened by the force of it and sorry for her. She hurried to the bed and bent over Mary.
        - id: ch01-b34
          speaker: martha
          text: >-
            Oh, don't cry like that! Please don't. I didn't know tha would be so hurt. Maybe I don't know anything, just as tha said. I beg your pardon, Miss. Please stop crying.
          emotion: sad
        - id: ch01-b35
          speaker: narrator
          text: >-
            There was something friendly and comforting in Martha's odd Yorkshire speech and sturdy manner. Little by little, Mary stopped crying. Martha looked relieved.
        - id: ch01-b36
          speaker: martha
          text: >-
            It's time to get up now. Mrs. Medlock says your breakfast, tea, and dinner are to be served in the next room. They've made it into a nursery for thee. Get out of bed and I'll help with thy clothes. If the buttons are in back, tha can't reach them thysen.
    - id: ch02
      title: New Clothes and New Ideas
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When Mary finally got up, Martha took a thick white wool coat and dress from the wardrobe. They were not the black clothes Mary had worn the night before.
        - id: ch02-b02
          speaker: mary
          text: Those aren't mine. Mine are black. These are nicer, though.
        - id: ch02-b03
          speaker: martha
          text: >-
            These are what tha must wear. Mr. Craven ordered Mrs. Medlock to buy them in London. He said he wouldn't have a child in black wandering around like a lost soul and making the house sadder. He told her to put some color on thee. My mother knew just what he meant. She always does, and she doesn't approve of black herself.
        - id: ch02-b04
          speaker: mary
          text: I hate black things.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Dressing Mary taught both girls something. Martha was used to buttoning her little brothers and sisters, but she had never seen a child stand still and expect to be served as if she had no hands or feet. When Mary silently held out one foot, Martha stared.
        - id: ch02-b06
          speaker: martha
          text: Why doesn't tha put on thy own shoes?
        - id: ch02-b07
          speaker: mary
          text: My Ayah did it. It was the custom.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Mary often said, “It was the custom.” The servants in India said the same thing when they were asked to do something their ancestors had not done for a thousand years. For Mary, the custom had always been to stand like a doll while someone dressed her. But before breakfast, she began to suspect that Misselthwaite would teach her new things, like putting on her own shoes and stockings and picking up what she dropped. A trained lady's maid would have brushed her hair, buttoned her boots, and put everything away. Martha had grown up in a moorland cottage full of children who cared for themselves and helped the babies and toddlers.
            None of Martha's brothers and sisters expected to be waited on. The older ones looked after the younger ones, especially those still small enough to be carried or only just steady enough to toddle before tumbling over. That was the world Martha understood. A child who quietly offered up her foot and waited for someone else to put on her shoe seemed almost unbelievable to her. And to Mary, Martha seemed just as strange. Every small task that had once belonged to a servant was now being handed back to Mary herself.
        - id: ch02-b09
          speaker: narrator
          text: >-
            At first Mary listened coldly while Martha talked. Then, little by little, she began to notice what the girl was saying.
        - id: ch02-b10
          speaker: martha
          text: >-
            Tha should see all of us. There are twelve children, and my father earns only sixteen shillings a week. Mother has a hard time finding enough porridge for everyone. They play on the moor all day, and Mother says the air fattens them. She thinks they must eat grass like the wild ponies. Dickon is twelve, and he's made a young pony his own.
        - id: ch02-b11
          speaker: mary
          text: Where did he get it?
        - id: ch02-b12
          speaker: martha
          text: >-
            He found it with its mother on the moor when it was little. He brought it bread and pulled young grass for it until they became friends. Now it follows him and lets him ride. Dickon's a kind boy, and animals take to him.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Mary had never owned a pet, though she had always thought she might like one. For the first time, she felt a little interest in someone besides herself. In the nursery, gloomy old pictures and heavy oak chairs made the room seem meant for grown-ups. A large breakfast waited on the table, but Mary barely looked at the first plate Martha served.
            If Mary had been a child who knew how to be amused, Martha's constant chatter might have made her laugh. Instead, she listened with a chilly expression and wondered how a servant could speak so freely. Yet Martha's warm, ordinary way of talking slowly reached her. The tale of twelve children running over the moor, of a mother stretching sixteen shillings to buy porridge, and especially of a boy who could befriend a wild pony began to open a world Mary had never imagined. Her interest was faint, but it was real, and that alone was new.
        - id: ch02-b14
          speaker: mary
          text: I don't want it.
        - id: ch02-b15
          speaker: martha
          text: Tha doesn't want porridge? Try it with a little molasses or sugar. It's good.
          emotion: surprised
        - id: ch02-b16
          speaker: mary
          text: I said I don't want it.
        - id: ch02-b17
          speaker: martha
          text: I hate seeing good food wasted. If our children sat here, they'd clear the table in five minutes.
        - id: ch02-b18
          speaker: mary
          text: Why?
        - id: ch02-b19
          speaker: martha
          text: Because they hardly ever get a full stomach. They're as hungry as young hawks and foxes.
        - id: ch02-b20
          speaker: mary
          text: I don't know what being hungry feels like.
        - id: ch02-b21
          speaker: martha
          text: It would do thee good to find out. I can't bear folk who stare at good bread and meat. I only wish Dickon and Phil and Jane and the rest could tuck all this under their pinafores.
        - id: ch02-b22
          speaker: mary
          text: Why don't you take it to them?
        - id: ch02-b23
          speaker: martha
          text: It isn't mine, and today isn't my day off. Once a month I go home, clean for Mother, and give her a day to rest.
        - id: ch02-b24
          speaker: narrator
          text: Mary drank tea and ate a little toast with marmalade.
        - id: ch02-b25
          speaker: martha
          text: Wrap up warm and go play outside. It'll do thee good and give thee an appetite.
        - id: ch02-b26
          speaker: mary
          text: Outside? Why would I go out on a day like this?
        - id: ch02-b27
          speaker: martha
          text: If tha doesn't go out, tha'll stay in. And what is there for thee to do here?
        - id: ch02-b28
          speaker: narrator
          text: Mary looked around. Mrs. Medlock had put no amusements in the nursery. Perhaps she might as well see the gardens.
        - id: ch02-b29
          speaker: mary
          text: Who will come with me?
        - id: ch02-b30
          speaker: martha
          text: >-
            Tha'll go alone. Children without brothers and sisters have to learn to play by themselves. Dickon roams the moor for hours alone. That's how he befriended the pony. Sheep know him, and birds eat from his hand. Even when he has hardly any food, he saves some bread to coax his creatures near.
        - id: ch02-b31
          speaker: narrator
          text: >-
            The thought of Dickon made Mary decide to go, though she did not realize it. There would be birds outside, different from Indian birds, and watching them might amuse her. Martha brought her coat, hat, and sturdy boots, then showed her the way downstairs.
            Mary had asked who would accompany her because she had never learned to go out and play like other children. Children with sisters and brothers found their own games. Dickon could spend hour after hour alone on the moor without truly seeming alone at all. The sheep knew him. Birds trusted his hand. The little food he had was something he would share with an animal. Mary had no pony or sheep waiting outside, but the possibility of unfamiliar birds was enough to draw her toward the door.
        - id: ch02-b32
          speaker: martha
          text: >-
            Go around that way and tha'll reach the gardens. There are plenty of flowers in summer, though nothing's blooming now. One garden is locked. No one has gone inside for ten years.
        - id: ch02-b33
          speaker: mary
          text: Why?
        - id: ch02-b34
          speaker: martha
          text: >-
            Mr. Craven shut it after his wife died so suddenly. It was her garden, and he won't allow anyone in. He locked the door, dug a hole, and buried the key. That's Mrs. Medlock's bell. I have to run!
    - id: ch03
      title: The Garden with No Door
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            After Martha left, Mary followed the walk toward the shrubbery gate. She could not stop thinking about the garden no one had entered for ten years. What did it look like? Were any flowers still alive? Beyond the gate lay broad lawns, winding paths, clipped borders, trees, flower beds, strangely shaped evergreens, and a large pool with an old gray fountain. The beds were bare with winter, and the fountain was dry. This could not be the locked garden. Mary could not understand how any garden could be shut. Surely you could always walk into one.
        - id: ch03-b02
          speaker: narrator
          text: >-
            At the end of her path, a long wall appeared beneath thick ivy. Mary did not know enough about England to recognize the kitchen gardens. She found an open green door in the ivy and went through. Inside was one walled garden after another. Another open door showed paths, bushes, beds of winter vegetables, glass frames, and fruit trees trained flat against the walls. Mary thought it all bare and ugly. It might be pleasant when summer made it green, but there was nothing pretty there now.
            The first gardens had looked grand even in winter, with their clipped borders and winding walks, but they held no answer to Martha's secret. The silent fountain stood in its pool, and the empty flower beds offered no clue. Here among the kitchen plots, each wall and each green door seemed to promise another enclosed place beyond it. Mary kept going because every open doorway proved only that she had not yet found the one that had been locked and hidden for ten years.
        - id: ch03-b03
          speaker: narrator
          text: >-
            An old man came through the next doorway with a spade over his shoulder. He started when he saw Mary, then touched his cap. His face was weathered and surly. He did not look pleased to see her. Mary wore her own contrary expression and looked equally displeased with him.
        - id: ch03-b04
          speaker: mary
          text: What is this place?
        - id: ch03-b05
          speaker: ben_weatherstaff
          text: One of the kitchen gardens.
        - id: ch03-b06
          speaker: mary
          text: And what is through that green door?
        - id: ch03-b07
          speaker: ben_weatherstaff
          text: Another one. There's one beyond that wall, and the orchard lies beyond that.
        - id: ch03-b08
          speaker: mary
          text: May I go into them?
        - id: ch03-b09
          speaker: ben_weatherstaff
          text: If tha likes. There's nothing worth seeing.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Mary answered by walking through the second green door. There were more walls, vegetables, and glass frames. Another green door stood closed in the next wall. Perhaps this was the garden no one had seen for ten years. Mary was not timid, and she usually did whatever she wanted. She turned the handle. Part of her hoped it would stay shut and prove she had found the mysterious place. Instead, it opened easily into an orchard.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Walls surrounded the orchard too. Bare fruit trees rose from winter-brown grass, and others had been trained against the stone. Mary searched, but there was no green door anywhere. Still, one wall continued beyond the orchard and seemed to enclose another place. Tree tops showed above it. On the highest branch sat a bird with a bright red breast. Suddenly he began his winter song, almost as if he had seen Mary and were calling to her.
            She had noticed the wall continuing past the end of the orchard as soon as she entered. It could not belong only to the place where she stood. Something else had to lie behind it. She looked along the stone and among the bare branches, searching for a break, a hinge, or any sign of an entrance. There was none. Only the tops of trees rose from the unseen ground on the other side. Then the tiny red breast appeared high above her, bright against the winter garden, and the bird's clear voice made the hidden place feel suddenly alive.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Mary stopped to listen. The little whistle sounded cheerful and friendly, and it pleased her. Even a disagreeable girl can be lonely. The enormous closed house, the bare moor, and the empty gardens had made Mary feel like the only person left in the world. She had never learned to love or be loved, but she was desolate. The bright little bird brought something close to a smile onto her sour face. She listened until he flew away. He was unlike the birds of India, and she liked him. Perhaps he lived in the mysterious garden and knew its secrets.
            An affectionate child, used to being loved, might have wept from the loneliness of Misselthwaite. Mary did not know how to do that. Her loneliness usually showed itself as silence, dislike, and a face that pushed people away. The robin reached her differently. He asked nothing of her and seemed to sing straight toward her from the hidden tree. For those few moments, the great house and the wide empty grounds did not feel quite so empty. When he disappeared, she wanted to know whether she would see him again.
        - id: ch03-b13
          speaker: narrator
          text: >-
            With nothing else to do, Mary thought more and more about that deserted garden. Why had Archibald Craven buried its key? If he had loved his wife, why did he hate her garden? She wondered whether she would ever meet him. She felt sure they would dislike each other. She would only stare in silence, even while she longed to ask why he had done such an odd thing.
            The mystery had become more interesting than the broad lawns or the formal beds she was allowed to enter. Ten years of locked silence made her imagine what might still be growing behind the wall. She did not know whether neglect had killed every flower or whether something had survived. Mr. Craven's grief made no sense to her. Loving the woman and shutting away her garden seemed to pull in opposite directions, and the buried key turned that confusion into a question she badly wanted answered.
        - id: ch03-b14
          speaker: mary
          text: >-
            People never like me, and I never like them. I can't talk the way the Crawford children did. They were always laughing and talking and making noise.
        - id: ch03-b15
          speaker: narrator
          text: Mary remembered the robin singing toward her from the tree top and stopped suddenly.
        - id: ch03-b16
          speaker: mary
          text: >-
            I believe that tree stood inside the secret garden. I'm sure of it. A wall went all around the place, and there was no door.
    - id: ch04
      title: The Robin Redbreast
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Mary returned to the first kitchen garden and found the old man digging. She stood beside him and watched in her cold little way. He ignored her until she finally spoke.
        - id: ch04-b02
          speaker: mary
          text: I went through the other gardens.
        - id: ch04-b03
          speaker: ben_weatherstaff
          text: Nothing was stopping thee.
        - id: ch04-b04
          speaker: mary
          text: I went into the orchard too.
        - id: ch04-b05
          speaker: ben_weatherstaff
          text: There was no dog at the door to bite thee.
        - id: ch04-b06
          speaker: mary
          text: There was no door into the garden on the other side.
        - id: ch04-b07
          speaker: ben_weatherstaff
          text: What garden?
        - id: ch04-b08
          speaker: narrator
          text: He stopped digging for a moment, and his voice turned rough.
        - id: ch04-b09
          speaker: mary
          text: >-
            The garden beyond the wall. I saw the tops of trees there. A red-breasted bird sat on one and sang.
        - id: ch04-b10
          speaker: narrator
          text: >-
            To Mary's surprise, the old man's face changed. A slow smile spread across it, and he looked like another person. Mary had never noticed before how much nicer anyone looked when they smiled. He faced the orchard and gave a low, soft whistle. Such a coaxing sound seemed impossible from someone so surly.
        - id: ch04-b11
          speaker: narrator
          text: >-
            Then Mary heard a soft rush of wings. The red-breasted bird flew down and landed on a large clod of earth close to the gardener's foot. The old man chuckled and spoke to him as if he were a child.
        - id: ch04-b12
          speaker: ben_weatherstaff
          text: >-
            There tha are! Where have tha been, cheeky little beggar? I haven't seen thee all day. Have tha started courting this early? Tha's much too forward.
        - id: ch04-b13
          speaker: narrator
          text: >-
            The bird tipped his tiny head and looked up with a bright eye like a black drop of dew. He was perfectly at ease. He hopped and pecked for seeds and insects. His plump little body, fine beak, and slender legs made him seem both pretty and cheerful, almost like a person. Mary felt something strange stirring in her heart.
            He showed no fear of Ben. One moment he searched the soil briskly, and the next he paused to look up as though he understood every word. Mary had never stood so near a creature that was both wild and friendly. The robin was delicate without looking weak, and lively without seeming restless. His confidence beside the gardener made their friendship plain. That friendship was something Mary had never had with a person or an animal, and watching it touched her in a place she did not yet know how to name.
        - id: ch04-b14
          speaker: mary
          text: Will he come whenever you call him?
        - id: ch04-b15
          speaker: ben_weatherstaff
          text: >-
            Aye. I've known him since he was a fledgling. He came from a nest in the other garden. The first time he flew over the wall, he was too weak to fly back for several days, so we became friends. By the time he crossed again, the rest of the brood had gone. He was lonely, and he came back to me.
        - id: ch04-b16
          speaker: mary
          text: What kind of bird is he?
        - id: ch04-b17
          speaker: ben_weatherstaff
          text: >-
            Doesn't tha know? He's a robin redbreast. Robins are the friendliest and most curious birds alive. They're nearly as friendly as dogs if tha knows how to treat them. See him peck, then look around at us? He knows we're talking about him.
        - id: ch04-b18
          speaker: narrator
          text: The old man gazed at the scarlet-breasted bird with pride and affection.
        - id: ch04-b19
          speaker: ben_weatherstaff
          text: >-
            He's a vain little fellow. Loves hearing people discuss him. And curious? Bless me, no bird ever meddled more. He always comes to inspect what I'm planting. He knows everything Mr. Craven can't be bothered to learn. This robin is the true head gardener.
        - id: ch04-b20
          speaker: narrator
          text: >-
            The robin pecked busily, pausing now and then to look at them. Mary felt those black dewdrop eyes studying her, as if he meant to discover everything about her. The strange feeling in her heart grew stronger.
        - id: ch04-b21
          speaker: mary
          text: Where did all the other young birds go?
        - id: ch04-b22
          speaker: ben_weatherstaff
          text: >-
            No one knows. The parents turn them out and make them fly, and soon they're scattered. This one had sense enough to know he was lonely.
        - id: ch04-b23
          speaker: narrator
          text: Mary stepped closer and stared hard at the robin.
        - id: ch04-b24
          speaker: mary
          text: I'm lonely.
          emotion: sad
        - id: ch04-b25
          speaker: narrator
          text: >-
            Until she looked at the robin and he looked back, Mary had not known loneliness was one reason she felt so sour and cross. The gardener pushed his cap back from his bald head and studied her.
        - id: ch04-b26
          speaker: ben_weatherstaff
          text: Art tha the little girl from India?
        - id: ch04-b27
          speaker: narrator
          text: Mary nodded.
        - id: ch04-b28
          speaker: ben_weatherstaff
          text: Then no wonder tha's lonely. Tha'll be lonelier yet before tha's finished here.
        - id: ch04-b29
          speaker: narrator
          text: He drove his spade into the rich black soil again while the robin hopped nearby.
        - id: ch04-b30
          speaker: mary
          text: What is your name?
        - id: ch04-b31
          speaker: ben_weatherstaff
          text: Ben Weatherstaff. I'm lonely myself when he isn't here. That robin is the only friend I've got.
        - id: ch04-b32
          speaker: mary
          text: I have no friends at all. I never did. My Ayah didn't like me, and I never played with anyone.
        - id: ch04-b33
          speaker: narrator
          text: Yorkshire people often said exactly what they thought, and Ben Weatherstaff was a man of the Yorkshire moor.
        - id: ch04-b34
          speaker: ben_weatherstaff
          text: >-
            Tha and me are much alike. We were cut from the same cloth. Neither of us is good-looking, and we're both as sour as our faces. I'll wager our tempers are just as nasty too.
        - id: ch04-b35
          speaker: narrator
          text: >-
            No one had ever told Mary the truth about herself so plainly. The servants in India had bowed and obeyed no matter what she did. Now she wondered whether she was as unattractive as Ben and whether her face looked as sour as his had before the robin came. Could she truly have a nasty temper? The thought made her uncomfortable.
            Ben's words could not be dismissed as the careful praise of a servant. He had looked directly at her and named what he saw. Mary had hardly considered her own appearance before, and she had certainly never asked what her angry manner looked like to anyone else. Now she remembered the change in Ben's face when he smiled at the robin. If a smile could make the rough old gardener look kinder, perhaps her own expression told people more than she knew. For the first time, she had to consider that other people might have reasons for not liking her.
        - id: ch04-b36
          speaker: narrator
          text: >-
            A clear ripple of song sounded beside her. The robin had flown onto a young apple tree and was singing a little tune. Ben laughed aloud.
        - id: ch04-b37
          speaker: mary
          text: Why did he do that?
        - id: ch04-b38
          speaker: ben_weatherstaff
          text: He's decided to be thy friend. Well, I'll be! He's taken a fancy to thee.
        - id: ch04-b39
          speaker: mary
          text: Me? Would you be my friend? Would you?
        - id: ch04-b40
          speaker: narrator
          text: >-
            Mary moved softly toward the tree and looked up. Her voice was no longer hard or commanding. It sounded so eager, gentle, and coaxing that Ben was as surprised as Mary had been by his whistle.
        - id: ch04-b41
          speaker: ben_weatherstaff
          text: >-
            Why, tha sounded nice and human then, like a real child instead of a sharp old woman. Tha spoke almost the way Dickon talks to his wild creatures on the moor.
          emotion: surprised
        - id: ch04-b42
          speaker: mary
          text: Do you know Dickon?
        - id: ch04-b43
          speaker: ben_weatherstaff
          text: >-
            Everyone knows Dickon. He's always roaming about. The blackberries and heather bells know him. I wouldn't be surprised if foxes showed him their cubs and skylarks let him see their nests.
        - id: ch04-b44
          speaker: narrator
          text: >-
            Mary wanted to ask more. Dickon interested her almost as much as the deserted garden. But the robin shook his wings, spread them, and flew away. His visit was over, and he had other things to do.
            Ben spoke of Dickon as though every wild thing on the moor accepted him. Martha had said much the same. The pony followed him, the sheep knew him, and birds ate from his hand. Now Ben imagined even foxes and skylarks trusting him with their hidden young. Mary had never met anyone like that. She was ready to keep questioning Ben, but the robin chose that moment to end the conversation in his own way.
        - id: ch04-b45
          speaker: mary
          text: >-
            He flew over the wall! He went into the orchard, then across the other wall. He's inside the garden with no door!
          emotion: surprised
        - id: ch04-b46
          speaker: ben_weatherstaff
          text: >-
            He lives there. He hatched there. If he's courting, he'll be visiting some young lady robin among the old rosebushes.
        - id: ch04-b47
          speaker: mary
          text: Rosebushes? Are there roses inside?
        - id: ch04-b48
          speaker: narrator
          text: Ben picked up his spade and began digging again.
        - id: ch04-b49
          speaker: ben_weatherstaff
          text: There were ten years ago.
        - id: ch04-b50
          speaker: mary
          text: I want to see them. Where is the green door? There has to be one somewhere.
        - id: ch04-b51
          speaker: narrator
          text: Ben drove the spade deep into the earth. His face closed up and became as unfriendly as it had been at first.
        - id: ch04-b52
          speaker: ben_weatherstaff
          text: There was a door ten years ago. There isn't one now.
        - id: ch04-b53
          speaker: mary
          text: No door? There must be!
          emotion: surprised
        - id: ch04-b54
          speaker: ben_weatherstaff
          text: >-
            None that anyone can find, and it's nobody's business. Don't be a meddlesome girl, poking thy nose where it has no cause to go. I have work to do. Be off and play. I've no more time for thee.
        - id: ch04-b55
          speaker: narrator
          text: >-
            Ben stopped digging, swung the spade over his shoulder, and walked away without another glance or even a goodbye.
            Mary was left beside the garden wall with the secret still unanswered. She now knew that roses had once grown beyond it and that the robin could cross where she could not, but Ben would tell her nothing more.
