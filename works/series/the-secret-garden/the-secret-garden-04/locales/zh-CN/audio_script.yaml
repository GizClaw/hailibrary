audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 克制而敏锐，带一点不动声色的讽意
        timbre: 温暖清晰
        pace: 舒缓中有变化
        pitch: 中音
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts:
        delivery: 任性强硬，话说得短而直接
        timbre: 稚嫩而尖细
        pace: 偏快
        pitch: 偏高
    martha:
      display_name: 玛莎
      tts:
        delivery: 爽朗质朴，带着亲切而浓重的约克郡乡音
        timbre: 年轻明亮而结实
        pace: 稍快
        pitch: 中高音
    ben_weatherstaff:
      display_name: 本·韦瑟斯塔夫
      tts:
        delivery: 粗声直率，约克郡口音浓重，偶尔透出温柔
        timbre: 苍老粗粝
        pace: 偏慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 清晨的玛莎
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 清晨，壁炉前传来一阵哗啦哗啦的响声，玛丽睁开了眼。一个年轻女仆跪在炉前，正把炉灰耙出来。玛丽看了她一会儿，又转头打量这间陌生的卧房。四面墙上都挂着森林图案的织锦。奇装异服的人站在树下，远处露出城堡的尖塔，林中还有猎人、马匹、猎犬和贵妇。望着望着，玛丽仿佛也进了那片森林。再朝深深的窗洞外看去，大片土地一路起伏着伸向远方，一棵树也没有，活像一片暗紫色的、没有尽头的海。
        - id: ch01-b02
          speaker: mary_lennox
          text: “窗外那是什么？”
        - id: ch01-b03
          speaker: narrator
          text: 女仆站起身，也朝窗外指了指。她叫玛莎。
        - id: ch01-b04
          speaker: martha
          text: “你问那边？那就是荒原。你觉得怎么样，喜欢不？”
        - id: ch01-b05
          speaker: mary_lennox
          text: “不喜欢，我讨厌它。”
        - id: ch01-b06
          speaker: martha
          text: “那是你还没住惯。眼下看着，它又大又秃，可等你熟悉了，一定会喜欢。”
        - id: ch01-b07
          speaker: mary_lennox
          text: “那你喜欢吗？”
        - id: ch01-b08
          speaker: martha
          text: “当然喜欢，我可爱荒原了！那里一点也不秃，到处都是香喷喷的草木。等春夏一来，荆豆、金雀花、石南全都开花，那才漂亮呢。风里有蜂蜜的香味，空气新鲜，天空也显得特别高。蜜蜂嗡嗡飞，云雀不停唱。嗐，不管拿什么跟我换，我也不肯离开荒原。”
        - id: ch01-b09
          speaker: narrator
          text: 玛丽听得又严肃又困惑。在印度，她身边的当地仆人总是低声下气，绝不敢像玛莎这样，把主人当成和自己一样的人来聊天。他们见了主人会行额手礼，还会称主人为“穷人的庇护者”一类的尊号。主人只管命令他们做事，从来不必开口请求，也没有说“请”和“谢谢”的规矩。玛丽一发火，甚至会扇阿雅耳光。她不禁想，若自己也扇玛莎一巴掌，这姑娘会怎么做。玛莎圆脸红润，看着很和气，性子却十分硬朗。动手的若只是个小女孩，她说不定真会还手。
        - id: ch01-b10
          speaker: mary_lennox
          text: “你真是个奇怪的仆人。”
        - id: ch01-b11
          speaker: narrator
          text: 玛丽靠在枕头上，口气很傲慢。玛莎手里握着炉栅刷，坐在脚跟上笑了，半点也没恼。
        - id: ch01-b12
          speaker: martha
          text: “嗐，这个我自己也知道。米塞尔思韦特若有位讲究的女主人，我连楼下女仆都当不上。最多让我去厨房洗盘子，绝不会准我上楼。我人太粗，说的约克郡土话也重。不过这宅子虽然气派，规矩倒怪得很。除了皮彻先生和梅德洛克太太，简直既没男主人，也没女主人。克雷文先生在家时，不许任何事烦他，可他又差不多总在外头。梅德洛克太太是好心才让我来做事。她说，要是这儿跟别的大宅子一样，她可不敢这么安排。”
        - id: ch01-b13
          speaker: mary_lennox
          text: “那么，你就是来服侍我的吗？”
        - id: ch01-b14
          speaker: martha
          text: “我是梅德洛克太太的仆人，她才是克雷文先生的仆人。楼上的女仆活儿归我，我也会照看你一点。不过，你可用不着别人事事伺候。”
        - id: ch01-b15
          speaker: mary_lennox
          text: “那谁替我穿衣服？”
        - id: ch01-b16
          speaker: narrator
          text: 玛莎惊得又坐直了，约克郡土话脱口而出。
        - id: ch01-b17
          speaker: martha
          text: “难道你连衣裳都不会自己穿？”
        - id: ch01-b18
          speaker: mary_lennox
          text: “你在说什么？我听不懂这种话。”
        - id: ch01-b19
          speaker: martha
          text: “嗐，我忘了。梅德洛克太太叮嘱我，说话得小心些，不然你听不懂。我的意思是，你不能自己把衣服穿好吗？”
        - id: ch01-b20
          speaker: mary_lennox
          text: “当然不能。我从来没自己穿过，都是阿雅替我穿。”
        - id: ch01-b21
          speaker: martha
          text: “那你现在正好该学了，开始得一点也不早。自己照料自己，对你有好处。我妈总说，她真奇怪，大户人家的孩子怎么没全成傻瓜。保姆替他们洗脸、穿衣，连带出去散步都像牵小狗一样！”
        - id: ch01-b22
          speaker: mary_lennox
          text: “印度的规矩不一样。”
        - id: ch01-b23
          speaker: narrator
          text: 玛丽已经快忍受不了，玛莎却一点也没有退缩。
        - id: ch01-b24
          speaker: martha
          text: “这个我看得出来。兴许因为那边到处都是黑人，不像这里有体面的白人吧。我听说你从印度来，还以为你也是个黑人呢。”
        - id: ch01-b25
          speaker: narrator
          text: 玛丽气得猛然坐起。
        - id: ch01-b26
          speaker: mary_lennox
          text: “什么？你居然以为我是当地人！你这个猪生的女儿！”
          emotion: angry
        - id: ch01-b27
          speaker: narrator
          text: 玛莎瞪着她，脸一下热了。
        - id: ch01-b28
          speaker: martha
          text: “你骂谁呢？别发这么大的火。年轻小姐不该这样说话。我可不讨厌黑人。教会的小册子说，他们都很虔诚，还说黑人也是人，也是我们的兄弟。我从没见过黑人，一想到能亲眼瞧一个，还挺高兴。今早我进屋生火，特意悄悄走到床边，小心掀开被子看你。结果你一点也不比我黑，就是脸色黄得很。”
        - id: ch01-b29
          speaker: mary_lennox
          text: “你竟敢把我当成当地人！你根本不懂他们！他们不算人，只是见到主人就得行礼的仆人。你不懂印度，你什么也不懂！”
          emotion: angry
        - id: ch01-b30
          speaker: narrator
          text: 玛丽又气又羞，根本不想压住怒火。面对玛莎直直望来的单纯目光，她忽然觉得自己无能为力。所有她熟悉的人和事，还有那些熟悉她的人和事，如今都远得可怕。一股从未承认过的孤单猛地压了下来。她扑倒在枕头上，放声大哭，哭得毫无收束。心地善良的约克郡姑娘没料到她会这样，既有些害怕，又实在为她难过，赶忙来到床边，俯下身去。
        - id: ch01-b31
          speaker: martha
          text: “嗐，你可别这样哭！真的别哭了。我不知道你会这么生气。我确实什么都不懂，就跟你说的一样。小姐，是我不好，请你停下来吧。”
        - id: ch01-b32
          speaker: narrator
          text: 玛莎的口音虽古怪，那声音和她硬朗的样子却真诚又友善，让玛丽感到安慰。她渐渐收住眼泪，安静了。玛莎也松了一口气。
        - id: ch01-b33
          speaker: martha
          text: “现在该起床啦。梅德洛克太太吩咐我，把你的早饭、茶点和晚饭全送到隔壁。那间屋已经专门收拾成你的起居室。只要你肯从床上下来，我就帮你把衣服穿好。衣服后背若是有扣子，你一个人确实没法扣。”
    - id: ch02
      title: 穿衣与早餐
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 玛丽总算肯起床了。玛莎从衣柜里拿出的，却不是她昨晚穿来的黑衣服。
        - id: ch02-b02
          speaker: mary_lennox
          text: “这些不是我的。我的衣服都是黑色的。不过，这一套比我的好看。”
        - id: ch02-b03
          speaker: martha
          text: “你以后就得穿这些。这是克雷文先生特意吩咐梅德洛克太太从伦敦买来的。他亲口说，他不愿看一个穿黑衣服的孩子像孤魂一样在宅子里游荡，那只会让这里比现在更阴沉，所以一定得给你穿些有颜色的衣服。我妈听了便说，她明白克雷文先生的心思。我妈总能懂得别人真正想说什么，而且她自己也不赞成穿黑衣服。”
        - id: ch02-b04
          speaker: mary_lennox
          text: “我也讨厌黑色的东西。”
        - id: ch02-b05
          speaker: narrator
          text: 这一番穿衣，让两个人都开了眼。玛莎常替弟弟妹妹扣扣子，却没见过哪个孩子手脚齐全，还会一动不动地站着，等别人代劳。玛丽默默把脚伸出来，让玛莎替她穿鞋。
        - id: ch02-b06
          speaker: martha
          text: “你的鞋为什么不自己穿？”
        - id: ch02-b07
          speaker: mary_lennox
          text: “阿雅会替我穿。印度向来就是这个规矩。”
        - id: ch02-b08
          speaker: narrator
          text: “那是规矩”，玛丽常把这句话挂在嘴边。印度仆人也总爱这样说。倘若主人要他们做一件祖祖辈辈一千年都不曾做过的事，他们便会温和地望着主人，说那不合规矩。话到了这里，主人也就明白，这件事再不会有人去办。玛丽从前的规矩，是只需像个洋娃娃一样站着，任别人替她穿戴。可还没到吃早饭，她已经隐约觉得，米塞尔思韦特迟早会教给她许多新东西。她也许得亲手穿鞋袜，还得捡起自己掉落的物品。训练有素的贴身女仆，会恭恭敬敬地替小姐梳头、扣靴子，再把散落的东西一一收好。玛莎却只是荒原小屋里长大的约克郡姑娘。她有一大群弟妹，那些孩子从来都是自己照料自己，也照料还抱在怀里的婴儿，或刚会蹒跚走路、随时可能跌倒的小娃娃。
        - id: ch02-b09
          speaker: narrator
          text: 换成一个懂得玩笑的孩子，或许早被玛莎的滔滔不绝逗笑了。玛丽却只是冷冷听着，奇怪这姑娘为何如此随便。起初她并不关心，可玛莎说得那么和气，又那么家常，她慢慢听进去了。
        - id: ch02-b10
          speaker: martha
          text: “你真该看看我家的孩子。我们一共有十二个，爸爸每星期只挣十六先令。要让人人都喝上粥，我妈可难了。孩子们整天在荒原上跑，我妈说，是荒原的风把他们吹胖的。她还说，他们没准跟野马驹一样，连草都吃。我们家狄肯十二岁，有一匹小马，就跟他自己的一样。”
        - id: ch02-b11
          speaker: mary_lennox
          text: “那匹马是从哪儿来的？”
        - id: ch02-b12
          speaker: martha
          text: “小马还跟着母马时，狄肯在荒原上找到了它。他一点点跟它亲近，喂它面包，还拔嫩草给它。后来小马喜欢上他，走哪儿都跟着，也肯让他骑。狄肯心地好，所以动物都爱他。”
        - id: ch02-b13
          speaker: narrator
          text: 玛丽从没有过属于自己的宠物，却总觉得自己会喜欢一只。于是，她对素未谋面的狄肯也有了一点兴趣。过去，她关心的人只有自己。如今这点小小的兴趣，正是一种健康感情刚刚发出的嫩芽。她走进隔壁的起居室，发现那里跟卧房一样，也不像孩子住的地方，倒更像一间给大人用的屋子。墙上挂着阴沉的旧画，屋里摆着沉重的老橡木椅。中央的桌上已经放好一顿丰盛又扎实的早餐。可是玛丽向来胃口很小。玛莎刚把第一盘食物端到她面前，她便厌烦地看着它，神情已经不只是毫无兴趣了。
        - id: ch02-b14
          speaker: mary_lennox
          text: “我不想吃这个。”
        - id: ch02-b15
          speaker: martha
          text: “连粥也不吃？你不知道它有多香。淋一点糖浆，或者撒一点糖吧。”
        - id: ch02-b16
          speaker: mary_lennox
          text: “我说了，我不想吃。”
        - id: ch02-b17
          speaker: martha
          text: “嗐，我最见不得好吃的东西白白浪费。要是我们家那些孩子坐在这里，不出五分钟，桌上就会干干净净。”
        - id: ch02-b18
          speaker: mary_lennox
          text: “为什么？”
        - id: ch02-b19
          speaker: martha
          text: “还能为什么？他们一辈子都难得真正吃饱，一个个饿得像小鹰、小狐狸。”
        - id: ch02-b20
          speaker: mary_lennox
          text: “我可不知道挨饿是什么感觉。”
        - id: ch02-b21
          speaker: narrator
          text: 玛莎听得很不高兴。
        - id: ch02-b22
          speaker: martha
          text: “那你倒该饿一回，对你准有好处。好端端的面包和肉摆在眼前，有人却只会坐着瞪，我一看就来气。要是狄肯、菲尔、简，还有其他孩子能把围裙兜起来，把这些吃的带走，该多好！”
        - id: ch02-b23
          speaker: mary_lennox
          text: “你为什么不拿给他们？”
        - id: ch02-b24
          speaker: martha
          text: “因为这不是我的东西。今天也不是我的休息日。我们每个人一个月休息一天。轮到我时，我会回家替妈妈收拾屋子，让她也歇上一天。”
        - id: ch02-b25
          speaker: narrator
          text: 最后，胃口极小的玛丽总算喝了些茶，又勉强吃下一点烤面包和橘子酱。
        - id: ch02-b26
          speaker: martha
          text: “把衣服穿暖和，到外面跑着玩吧。出去走走，你身子会舒服些，到了吃饭时也会有胃口。”
        - id: ch02-b27
          speaker: narrator
          text: 玛丽来到窗前。外面有花园、小径和高大的树，可每一样东西都灰暗萧瑟，满是冬天的样子。
        - id: ch02-b28
          speaker: mary_lennox
          text: “这样的天气，我为什么非得出去？”
        - id: ch02-b29
          speaker: martha
          text: “不出去，你就只能留在屋里。可留在这里，你又有什么可做？”
        - id: ch02-b30
          speaker: narrator
          text: 玛丽环视房间，确实找不到任何事。梅德洛克太太布置这里时，压根没想过孩子还需要消遣。看来，不如到外面看看花园。
        - id: ch02-b31
          speaker: mary_lennox
          text: “谁会陪我一起去？”
        - id: ch02-b32
          speaker: martha
          text: “当然是你自己去。没有兄弟姐妹，也得学会一个人玩。我们狄肯能独自在荒原上玩几个钟头。他就是这样跟小马成了朋友。那里的绵羊认得他，鸟也会落到他手上吃东西。不管食物多么少，他总要留下一小块面包，去哄那些动物朋友。”
        - id: ch02-b33
          speaker: narrator
          text: 玛丽自己没有察觉，其实正是玛莎再次提起狄肯，才让她决定出门。花园里就算没有小马和绵羊，也总会有鸟。英国的鸟和印度的鸟一定不同，光是看看它们，也许就能让她消磨一阵。玛莎替她找出外套和帽子，又拿来一双结实的小靴子，随后领她下楼，告诉她该从哪里走。
        - id: ch02-b34
          speaker: martha
          text: “从那边绕过去，就是花园。夏天有许多花，眼下可一朵也没开。还有一座花园被锁起来了，已经整整十年没人进去过。”
        - id: ch02-b35
          speaker: mary_lennox
          text: “为什么要锁起来？”
        - id: ch02-b36
          speaker: narrator
          text: 奇怪的宅子里已有上百扇紧闭的门，如今又多了一扇，玛丽忍不住想问。
        - id: ch02-b37
          speaker: martha
          text: “克雷文太太突然去世以后，先生就把那里封了，不让任何人进去。那原本是太太的花园。他锁了门，又挖个坑，把钥匙埋掉了。梅德洛克太太在按铃，我得快走啦。”
    - id: ch03
      title: 没有门的花园
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 玛莎走后，玛丽沿着小路，朝灌木篱墙上的门走去。那座十年无人踏入的花园总在她脑中打转。它会是什么样？里头还有没有活着的花？穿过篱墙的门，眼前是一大片花园。草坪十分宽阔，一条条小路在其中弯弯曲曲地伸展，路边的矮树修剪得整整齐齐。园里有高大的树，有一畦畦花坛，也有剪成怪模样的常青树。一个大水池中央，立着一眼古老的灰色喷泉。可如今花坛已经光秃，满是冬日的萧瑟，喷泉也一滴水都没有。这一定不是锁起来的那座。可花园怎么能锁起来呢？不论从哪边走，花园不是总能进去的吗？
        - id: ch03-b02
          speaker: narrator
          text: 她正想着，忽然看见小路尽头横着一道爬满常春藤的长墙。玛丽不熟悉英国，不知道这正是种蔬菜水果的厨房花园。墙上的绿门敞开着，所以它当然不是那座秘密花园，她尽可以走进去。围墙里面还有围墙，一座座花园似乎彼此相通。另一道敞开的绿门后，是灌木、冬季菜畦和夹在菜畦间的小路。果树的枝条被牵引着，平平地贴着墙面，有些菜畦上还罩着玻璃框。玛丽站在那里四下打量，只觉得这里又秃又难看。到了夏天，所有草木都变绿，也许会好一些，可现在实在没有半点美处。
        - id: ch03-b03
          speaker: narrator
          text: 不久，一个老人扛着铁锹，从第二座花园走来。他看见玛丽，先是一惊，随后摸了摸帽檐。他那张老脸很不友善，显然不欢迎这个客人。不过玛丽也不喜欢他的花园，脸上正摆着“倔脾气玛丽”的神色，看起来同样不欢迎他。
        - id: ch03-b04
          speaker: mary_lennox
          text: “这里是什么地方？”
        - id: ch03-b05
          speaker: ben_weatherstaff
          text: “这是一座厨房花园。”
        - id: ch03-b06
          speaker: mary_lennox
          text: “另一道绿门后面又是什么？”
        - id: ch03-b07
          speaker: ben_weatherstaff
          text: “还是厨房花园。墙另一边另有一座，再过去就是果园。”
        - id: ch03-b08
          speaker: mary_lennox
          text: “我能到那些地方去吗？”
        - id: ch03-b09
          speaker: ben_weatherstaff
          text: “想去就去，反正没什么可看的。”
        - id: ch03-b10
          speaker: narrator
          text: 玛丽没再说话。她沿路穿过第二道绿门，看到的还是围墙、冬菜和玻璃框。第二道墙上也有一扇绿门，却紧紧关着。也许，那就是十年无人见过的花园入口。玛丽从来不胆小，又总是想做什么就做什么。她径直走过去，转动门把手。她甚至希望门打不开，因为这样便能肯定自己真的找到了神秘花园。可门轻轻一推就开了。她跨过门槛，眼前却只是一座果园。
        - id: ch03-b11
          speaker: narrator
          text: 果园四周也有围墙。墙面牵引着一排排果树，冬日枯黄的草地上还立着许多光秃秃的树，却怎么也看不见另一道绿门。玛丽到处寻找。奇怪的是，她刚从果园上端走进来时，明明发现这堵墙并没有随着果园结束。它越过果园继续向前延伸，像是还圈住了另一边的某个地方。那里有树梢露在围墙上方。玛丽站住不动，便看到一只胸脯鲜红的小鸟落在最高的枝头。忽然，它唱起了冬日的小曲，仿佛刚刚看见她，正在出声招呼。
        - id: ch03-b12
          speaker: narrator
          text: 玛丽停下来听。小鸟的叫声细细的，又快活又友善，让她心里有了一点欢喜。哪怕是个讨人嫌的小姑娘，也一样会孤独。紧闭的大宅子、空旷的荒原、光秃的花园，全都大得吓人，让她觉得全世界仿佛只剩下了自己。若她是个亲热的、从小习惯被人疼爱的孩子，恐怕早已伤透了心。可就算她是那个人人都说脾气古怪的“倔脾气玛丽小姐”，也仍旧孤苦伶仃。望着那只胸脯明亮的小鸟，她那张总是阴沉不快的脸上，几乎露出了微笑。她站在那里，一直听到它飞走，心里还想着，它和印度的鸟真不一样。她喜欢这只小鸟，不知道以后还能不能再见到它。也许它就住在秘密花园里，知道那里的一切。
        - id: ch03-b13
          speaker: narrator
          text: 也许因为实在无事可做，玛丽才越来越惦记那座荒废的花园。她满心好奇，非想知道里面是什么模样。阿奇博尔德·克雷文先生为何要把钥匙埋掉？他若真那么深爱妻子，为何又会厌恶妻子的花园？她不知道自己能否见到这个人，却早已断定，见面后他们一定谁也不喜欢谁。她只会默默站在那里，盯着他看，一个字也说不出来，尽管心里非常想问清楚，他为什么要做这样古怪的事。
        - id: ch03-b14
          speaker: mary_lennox
          text: “从来没人喜欢我，我也从来不喜欢别人。我永远不会像克劳福德家的孩子那样说个不停，又笑又闹。”
        - id: ch03-b15
          speaker: narrator
          text: 她想起知更鸟仿佛特意唱给她听的歌，又想起那棵高过围墙的树，忽然在小路上停了下来。
        - id: ch03-b16
          speaker: mary_lennox
          text: “那棵树一定长在秘密花园里，我敢肯定。那里四周都有围墙，却找不到门。”
    - id: ch04
      title: 知更鸟的朋友
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 玛丽沿原路回到最先进去的那座厨房花园，发现老人仍在那里掘土。她走到老人身边，带着平日那副冷淡的小模样，站着看了好一会儿。老人仿佛根本没看见她，始终不理不睬。玛丽等不到他开口，最后只好自己先说话。
        - id: ch04-b02
          speaker: mary_lennox
          text: “我已经去过另外那些花园了。”
        - id: ch04-b03
          speaker: ben_weatherstaff
          text: “那又怎样？没人拦着你。”
        - id: ch04-b04
          speaker: mary_lennox
          text: “我还走进了果园。”
        - id: ch04-b05
          speaker: ben_weatherstaff
          text: “门口又没有狗等着咬你。”
        - id: ch04-b06
          speaker: mary_lennox
          text: “可果园里没有门能通到另一座花园。”
        - id: ch04-b07
          speaker: narrator
          text: 老人的铁锹停了一下。
        - id: ch04-b08
          speaker: ben_weatherstaff
          text: “你说的是哪座花园？”
        - id: ch04-b09
          speaker: mary_lennox
          text: “就是墙那边的。我看到了树梢，还有一只红胸脯的小鸟。它站在树上唱歌。”
        - id: ch04-b10
          speaker: narrator
          text: 叫玛丽吃惊的是，老人那张饱经风霜的凶脸竟改变了神情。一丝笑意慢慢在他脸上铺开，他看上去简直像换了个人。玛丽从没想过，原来一个人笑起来，会比不笑时好看那么多。老人转过身，面向果园那一侧，轻轻吹起口哨。那声音又低又柔，温柔得像在耐心哄谁，实在不像是从这样一个粗暴的老人口中发出来的。
        - id: ch04-b11
          speaker: narrator
          text: 下一刻，奇妙的事发生了。空气里传来翅膀轻轻掠过的声音。那只红胸脯的小鸟飞到他们身边，落在老人脚旁的一大块泥土上。
        - id: ch04-b12
          speaker: ben_weatherstaff
          text: “瞧，它来了。你这个厚脸皮的小淘气，今天跑哪儿去了？我一整天还没见过你。这才什么时节，就忙着求偶啦？你也太性急了。”
        - id: ch04-b13
          speaker: narrator
          text: 知更鸟把小脑袋偏向一边，用黑露珠似的柔亮眼睛仰望老人。它和老人显然十分熟悉，一点也不怕，只管跳来跳去，飞快地啄开泥土，寻找种子和小虫。它的身子小小的、圆滚滚的，尖嘴和两条细腿都十分精巧。玛丽看着它，心里生出一种说不清的感觉。小鸟那么漂亮，那么快活，每一个动作又都活像一个小小的人。
        - id: ch04-b14
          speaker: mary_lennox
          text: “是不是只要你叫它，它每次都会飞来？”
        - id: ch04-b15
          speaker: ben_weatherstaff
          text: “那当然。我从它刚长齐羽毛时就认识它。它从另一座花园的巢里飞出来，头一回越过围墙时力气不够，好几天都飞不回去，我们就这样熟了。等它终于飞回墙那边，一窝小鸟已经全走光。它孤单得很，只好又回来找我。”
        - id: ch04-b16
          speaker: mary_lennox
          text: “它究竟是什么鸟？”
        - id: ch04-b17
          speaker: ben_weatherstaff
          text: “这都认不出？它是红胸知更鸟。世上再没有比它们更亲人、更好奇的鸟了。只要懂得怎样和它们相处，它们几乎跟狗一样友善。你看它，一边啄土，一边还要回头瞧我们。它知道我们正在谈它。”
        - id: ch04-b18
          speaker: narrator
          text: 老人望着那只圆滚滚的鸟。它像穿了一件鲜红小背心，而老人眼里既骄傲又疼爱。
        - id: ch04-b19
          speaker: ben_weatherstaff
          text: “这家伙可自负得很，就爱听人谈起它。还爱管闲事！我的老天，从没有谁比它更好奇。我种什么，它都要凑过来看。连克雷文老爷懒得知道的事，它也全都知道。它才是这里的总管园丁。”
        - id: ch04-b20
          speaker: narrator
          text: 知更鸟忙着蹦跳、啄土，还不时停下来看看他们。玛丽觉得那双黑亮的眼睛正好奇地研究自己，仿佛要弄清她的一切。她心里那种奇异的感觉越来越强。
        - id: ch04-b21
          speaker: mary_lennox
          text: “它那一窝的其他小鸟都飞到哪里去了？”
        - id: ch04-b22
          speaker: ben_weatherstaff
          text: “谁知道呢。大鸟会把小鸟赶出巢，让它们自己飞。转眼间，那一窝也就散了。这一只很聪明，它明白自己孤单。”
        - id: ch04-b23
          speaker: narrator
          text: 玛丽往前走了一步，盯着知更鸟。
        - id: ch04-b24
          speaker: mary_lennox
          text: “我也很孤单。”
          emotion: sad
        - id: ch04-b25
          speaker: narrator
          text: 直到知更鸟望着她，而她也一动不动地望着知更鸟，玛丽才第一次明白，自己总是刻薄、爱发脾气，原来有一部分正是因为孤单。这个答案从前从未在她脑中出现过，仿佛是那只小鸟看着她时，才让她突然发现的。老园丁把帽子推到秃顶后面，也停下来打量了她一会儿。
        - id: ch04-b26
          speaker: ben_weatherstaff
          text: “你就是那个从印度来的小丫头？”
        - id: ch04-b27
          speaker: narrator
          text: 玛丽点了点头。
        - id: ch04-b28
          speaker: ben_weatherstaff
          text: “那你觉得孤单也不奇怪。日子还长着呢，往后你只会更孤单。”
        - id: ch04-b29
          speaker: narrator
          text: 老人重新干活，铁锹深深插进肥沃的黑土。知更鸟也在一旁跳个不停，忙得很。
        - id: ch04-b30
          speaker: mary_lennox
          text: “你叫什么名字？”
        - id: ch04-b31
          speaker: narrator
          text: 老人直起了腰。
        - id: ch04-b32
          speaker: ben_weatherstaff
          text: “我叫本·韦瑟斯塔夫。我自己也孤单，只有它陪着我的时候例外。它是我唯一的朋友。”
        - id: ch04-b33
          speaker: mary_lennox
          text: “我连一个朋友也没有，从来都没有。阿雅不喜欢我，我也从没跟别人一起玩过。”
          emotion: sad
        - id: ch04-b34
          speaker: narrator
          text: 约克郡人说话直，心里想到什么，嘴上就说什么。本·韦瑟斯塔夫又是土生土长的荒原人。
        - id: ch04-b35
          speaker: ben_weatherstaff
          text: “你跟我倒很像，简直是同一块布织出来的。咱俩都不好看，脸色也一样刻薄。我敢说，咱们两个的坏脾气也差不多。”
        - id: ch04-b36
          speaker: narrator
          text: 这话真够不客气。玛丽·伦诺克斯活到现在，还从没有谁当面跟她讲过这样的真话。不管她做什么，印度仆人总是低头行礼，事事顺从。她从前很少想到自己的相貌，现在却忍不住怀疑，自己是不是跟本·韦瑟斯塔夫一样难看，是不是也像知更鸟飞来以前的他那么刻薄。更叫她不舒服的是，她竟开始认真思量，自己是否当真有一副坏脾气。
    - id: ch05
      title: 玛丽第一次请求友谊
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 忽然，一串清亮的小歌在她身旁响起。玛丽回过头。几英尺外有一株小苹果树，知更鸟已经飞上枝头，正唱着短短的一段歌。本·韦瑟斯塔夫放声大笑。
        - id: ch05-b02
          speaker: mary_lennox
          text: “它为什么忽然唱起来？”
        - id: ch05-b03
          speaker: ben_weatherstaff
          text: “因为它已经拿定主意，要跟你交朋友。真没想到，它居然看上你了。”
        - id: ch05-b04
          speaker: mary_lennox
          text: “它看上了我？”
          emotion: surprised
        - id: ch05-b05
          speaker: narrator
          text: 玛丽轻轻走到小树旁，仰起头。接着，她像对一个真正的人那样，对知更鸟说起话来。声音里既没有平日的冷硬，也没有在印度时惯用的蛮横。她说得那么柔软、那么热切，还带着一点恳求，连本也听呆了。
        - id: ch05-b06
          speaker: mary_lennox
          text: “你愿不愿意跟我做朋友？你真的愿意吗？”
        - id: ch05-b07
          speaker: ben_weatherstaff
          text: “嘿，你这句话说得真亲切，听起来总算像个真正的孩子，不像刻薄的小老太婆了。你刚才那语气，简直和狄肯对荒原上的野东西说话一样。”
        - id: ch05-b08
          speaker: mary_lennox
          text: “你也认识狄肯？”
        - id: ch05-b09
          speaker: ben_weatherstaff
          text: “这里人人都认识他。狄肯成天四处乱走，就连黑莓和石南花铃都知道他是谁。我敢说，狐狸肯领他去看幼崽，云雀也不会把巢藏起来防着他。”
        - id: ch05-b10
          speaker: narrator
          text: 玛丽还想继续问下去。她对狄肯的好奇，几乎已经和对荒废花园的好奇一样强了。可知更鸟的歌恰好唱完。它轻轻抖了抖翅膀，随即展开双翼飞走。它已经结束了这次探望，现在还有别的事要忙。
        - id: ch05-b11
          speaker: mary_lennox
          text: “它飞过那道墙了！它先飞进果园，又越过另一道墙，进了那座没有门的花园！”
          emotion: surprised
        - id: ch05-b12
          speaker: ben_weatherstaff
          text: “它本来就住在那里，也是在那里破壳出生的。要是它正在求偶，那就是去讨好一位住在老玫瑰丛里的知更鸟小姐。”
        - id: ch05-b13
          speaker: mary_lennox
          text: “你说玫瑰？那里面真的有玫瑰吗？”
        - id: ch05-b14
          speaker: narrator
          text: 本重新拿起铁锹。
        - id: ch05-b15
          speaker: ben_weatherstaff
          text: “十年前有过。”
        - id: ch05-b16
          speaker: mary_lennox
          text: “我想去看看那些玫瑰。绿门究竟在哪里？那里一定有门。”
        - id: ch05-b17
          speaker: narrator
          text: 本把铁锹深深插进土里。他脸上的亲切消失了，又变回他们初见时那副拒人于千里之外的神情。
        - id: ch05-b18
          speaker: ben_weatherstaff
          text: “十年前是有门，可现在没有了。”
        - id: ch05-b19
          speaker: mary_lennox
          text: “没有门？这不可能，一定有一扇！”
          emotion: surprised
        - id: ch05-b20
          speaker: ben_weatherstaff
          text: “反正没人找得到，而且这事也轮不到别人管。别做个多事的小丫头，别把鼻子伸到不该去的地方。我要继续干活了。你走开，自己玩去吧，我没工夫陪你。”
        - id: ch05-b21
          speaker: narrator
          text: 他说到做到，当真停下手里的活，把铁锹往肩上一扛，转身走了。他甚至没有回头看玛丽一眼，也没有跟她说再见。
