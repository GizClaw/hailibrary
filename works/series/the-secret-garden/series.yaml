cover_prompt: |-
  A wordless cover scene in a walled Yorkshire garden around 1900 shows Mary Lennox discovering the hidden door in early spring. Mary is a slight ten-year-old girl with straight dark hair, a serious pale face, a moss-green wool coat, brown skirt, and buttoned boots; beside her stands Dickon, a rosy-cheeked moorland boy with curly brown hair and rough earth-colored clothes. A red-breasted robin perches on ivy and reveals an old iron key half hidden in freshly turned soil, while Colin's empty wheeled chair waits near the garden path. Mary reaches toward the key as the robin watches, making discovery and renewal the focal action. Use an intimate ground-level three-quarter view through bare rose branches, with the old wall, budding trees, and generous soft sky above. Keep period clothing, garden tools, plants, and architecture faithful to Edwardian Yorkshire and avoid any film adaptation imagery. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
