audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
    nurse:
      display_name: 护士
      tts: {delivery: 恭谨克制，惊讶时仍尽力保持规矩, timbre: 柔和朴实, pace: 中等, pitch: 中音}
    john:
      display_name: 约翰
      tts: {delivery: 爽快随和，玩笑里带着年轻人的活力, timbre: 结实明亮, pace: 中等偏快, pitch: 中音}
  chapters:
    - id: ch01
      title: 鸟巢里的庄严秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 秘密花园一天比一天繁盛，每个早晨都会露出新的奇迹。知更鸟的窝里有了蛋，鸟妈妈小心收拢翅膀，用毛茸茸的胸脯暖着它们。她起初紧张极了，知更鸟也一肚子戒心，守得十分严密。连迪肯都不靠近那个枝叶浓密的角落。他只是安静地等着，让某种神秘的魔法慢慢把一个消息送进那对小鸟心里。园里所有生灵都和它们一样，没有谁不懂眼前的事有多奇妙。蛋所承载的美是那么浩大、温柔、可怕，既叫人心碎，又无比庄严。要是有人拿走一颗，或者弄伤一颗，整个世界简直会飞出轨道，在太空里撞得粉碎。只要园里有一个人不明白这件大事，不肯处处小心，那么就算春日的空气一片金黄，也不会有真正的幸福。幸好每个人都从心底明白，知更鸟夫妇也终于知道，他们全都明白。
        - id: ch01-b02
          speaker: narrator
          text: 知更鸟仍旧紧盯着玛丽和科林，却从没真正怀疑过迪肯。那双露珠般明亮的黑眼睛第一次看见迪肯，就认定他不是外人，而是一只没长鸟喙和羽毛的知更鸟。迪肯会说正宗的知更鸟话。这门语言和任何别的语言都不同，对知更鸟说起来，就像对法国人说法语一样自然。知更鸟听他同人类咿咿呀呀，只当那些人太不聪明，听不懂有羽毛的生灵说话，所以迪肯才不得不用怪话迁就他们。迪肯的动作也像鸟，从不猛然一动，吓得谁以为危险来了。任何知更鸟都看得懂他，有他在旁边，根本不用不安。
        - id: ch01-b03
          speaker: narrator
          text: 可另外两个就很可疑了。那个男孩模样的生物不靠双腿进园子，反而盖着野兽皮，坐在带轮子的东西上，由别人推来。光是这件事就不大对劲。等他开始站立，动作又生疏又古怪，还要旁人扶着。知更鸟藏进灌木，歪着小脑袋仔细观察，一会儿歪向这边，一会儿又歪向那边。他越看越担心。男孩动得这样慢，会不会正在学猫，贴着地面悄悄靠近，打算突然扑过来？知更鸟连续几天都和伴侣商量，后来见她怕得厉害，担心这份恐惧会伤着那些蛋，便不敢再提。
        - id: ch01-b04
          speaker: narrator
          text: 男孩终于能独自走路，还渐渐走快了，知更鸟这才大大松了口气。不过，在很长一段时间里，至少知更鸟觉得那段日子很长，男孩仍旧叫他担忧。这个人类不像别的人类。他明明很喜欢走路，却总是走上一阵就坐下或躺下，歇一会儿，又用一种令人不安的方式突然站起来，重新开始。后来，知更鸟想起自己被父母逼着学飞时，也只能飞几码就停下来休息。他这才懂了，原来男孩也在学飞。好吧，人类管这个叫学走路。
        - id: ch01-b05
          speaker: narrator
          text: 他把这个发现告诉鸟妈妈，又说窝里的宝宝长齐羽毛以后，大概也会飞一会儿，歇一会儿。鸟妈妈顿时安心了，还兴致勃勃地从窝边探头看男孩练习，越看越觉得有趣。当然，她确信自己的宝宝一定更聪明，学得更快。她很宽容地想，人类本来就比蛋笨拙迟缓，而且大多数人一辈子也没真正学会飞。无论空中还是树梢，都从来见不到他们。
        - id: ch01-b06
          speaker: narrator
          text: 男孩后来已经能像别人一样活动，可三个孩子又常常站在树下，把胳膊、腿和脑袋动来动去。他们不是走，不是跑，也不是坐，每天还隔一阵就做一回。知更鸟怎么也没法向伴侣解释。他只知道自己的宝宝绝不会这样乱扑腾。不过，那个知更鸟话说得最流利的男孩也在做，鸟儿们便能肯定，这些动作没有危险。两只鸟哪里知道，孩子们在练摔跤冠军鲍勃·霍沃思教的动作，好让肌肉鼓成一个个硬包。鸟儿和人类不一样，从小便一直锻炼。它们每顿饭都得飞来飞去地寻找，肌肉自然会长结实，从来用不着担心因为不用而萎缩。
        - id: ch01-b07
          speaker: narrator
          text: 等科林能和大家一样走路、跑动、挖土、除草，鸟窝里便只剩下安宁和满足。过去对那些蛋的种种忧虑，全都成了往事。它们安全得像锁进了银行的保险库，伏在上面还能看见那么多稀奇事，孵蛋也成了一件十分有趣的工作。只有雨天孩子们不来时，鸟妈妈偶尔会觉得日子有一点无聊。
    - id: ch02
      title: 雨天里的探险
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 玛丽和科林在雨天可不会无聊。一天早晨，雨水不停往下流。科林不能冒险起身走路，因为房里随时可能有人进来，只好留在沙发上，渐渐坐不住了。玛丽却忽然想到了一个主意。
        - id: ch02-b02
          speaker: colin_craven
          text: “我现在是个真正的男孩，腿、胳膊和整个身体里全是魔法，一点也闲不住。它们时时刻刻都想活动。每天大清早醒来，听见外面的鸟儿大声叫，我就觉得所有东西都在欢呼。连树，还有那些我们根本听不见的东西，也像在高兴地喊。我真想跳下床，也跟着大喊。玛丽，你想想，我要是真喊了，会出什么事？”
        - id: ch02-b03
          speaker: narrator
          text: 玛丽笑个不停。
        - id: ch02-b04
          speaker: mary_lennox
          text: “护士会跑过来，梅德洛克太太也会跑过来。她们准说你疯了，赶紧去请医生。”
        - id: ch02-b05
          speaker: narrator
          text: 科林也笑得咯咯作响。他仿佛已经看见她们冲进房间的模样。她们先被他突然爆发的喊声吓坏，接着又发现他站得笔直，顿时惊得说不出话。
        - id: ch02-b06
          speaker: colin_craven
          text: “真希望父亲快回来。我总想着亲口告诉他。可我们不能再装多久了。我讨厌躺着不动，还要假装生病，何况我的样子已经变了那么多。今天要是没下雨就好了。”
        - id: ch02-b07
          speaker: narrator
          text: 就在这时，玛丽的主意成形了。
        - id: ch02-b08
          speaker: mary_lennox
          text: “科林，你知道这幢房子有多少房间吗？”
        - id: ch02-b09
          speaker: colin_craven
          text: “我猜有一千个左右。”
        - id: ch02-b10
          speaker: mary_lennox
          text: “差不多有一百间从来没人进去。有个下雨天，我偷偷走进去，看了好多好多间。谁也没发现，只有梅德洛克太太差点抓到我。回来时我迷了路，最后走到你那条走廊的尽头。那是我第二次听见你哭。”
        - id: ch02-b11
          speaker: narrator
          text: 科林一听，满心好奇，立刻从沙发上坐直了。
        - id: ch02-b12
          speaker: colin_craven
          text: “一百间没人去的房间，简直像另一座秘密花园。我们去看看吧。你推着我的轮椅，谁也不会知道我们去了哪儿。”
        - id: ch02-b13
          speaker: mary_lennox
          text: “我正是这么想的。没人敢违抗你的命令，偷偷跟着我们。长廊里有的是地方，你可以尽管跑，我们也能在那里练习那些动作。还有一间印度小屋，柜子里装满了象牙小象。那边各式各样的房间都有。”
        - id: ch02-b14
          speaker: colin_craven
          text: “摇铃叫人来。”
        - id: ch02-b15
          speaker: narrator
          text: 护士进门后，科林立刻吩咐起来。
        - id: ch02-b16
          speaker: colin_craven
          text: “把轮椅拿来。我要和玛丽小姐去看宅子里空着的地方。路上有楼梯，让约翰把我推到画像长廊。随后他得离开，等我叫他时再回来。”
        - id: ch02-b17
          speaker: narrator
          text: 这一下，雨天再也不可怕了。约翰按命令把轮椅推进画像长廊，留下两个孩子。科林和玛丽欣喜地望着彼此。玛丽看着约翰往回走，确定他当真已经回到楼下仆人的住处，科林马上从轮椅里站了起来。
        - id: ch02-b18
          speaker: colin_craven
          text: “我要从长廊这头一直跑到那头，再跳几下，然后咱们练鲍勃·霍沃思教的动作。”
        - id: ch02-b19
          speaker: narrator
          text: 他们从长廊一头跑到另一头，又蹦又跳，把鲍勃教的动作也做了一遍，随后还做了许多别的事。他们一幅幅看过墙上的肖像，找到了那个穿绿锦缎衣裙、手指上停着鹦鹉的普通小姑娘。
        - id: ch02-b20
          speaker: colin_craven
          text: “这些肯定都是我的亲戚，他们生活在很久以前。带鹦鹉的那个，我看是我的曾曾曾曾姑祖母。她有点像你刚来时的样子，玛丽，不像你现在。你现在可胖多了，也好看多了。”
        - id: ch02-b21
          speaker: mary_lennox
          text: “你也一样。”
        - id: ch02-b22
          speaker: narrator
          text: 两个人笑了起来。接着，他们去印度屋摆弄那些象牙小象，又找到玫瑰色锦缎闺房。靠垫上还留着老鼠咬出的洞，可小老鼠已经长大跑掉，里面空空的。他们走过的房间比玛丽上回更多，发现了新的走廊、角落和一段段楼梯，也看见了喜欢的古老画像，还有些模样古怪、谁也猜不出用途的老东西。整个上午都充满了说不出的趣味。明明同其他人待在一幢宅子里，他们四处游荡时，却仿佛已经跑到几英里外。这种感觉实在迷人。
        - id: ch02-b23
          speaker: colin_craven
          text: “幸好我们来了。我从不知道自己的家这么大、这么古怪。我喜欢这里。以后每逢下雨，我们都出来逛，准能不断找到新的怪角落和怪东西。”
        - id: ch02-b24
          speaker: narrator
          text: 这天早晨，除了那些房间和老物件，他们还找到了一副好胃口。四处跑动和探险叫他们饿得厉害。回到科林房里时，两人再也没法像从前那样，把午餐原封不动地退走。他们把送来的食物吃得干干净净。护士端着餐盘下楼，“砰”的一声放到厨房餐具柜上，特意让厨娘卢米斯太太好好看看那些锃亮得像刚擦过一样的盘子。
        - id: ch02-b25
          speaker: nurse
          text: “快看看！这宅子里到处都是谜，那两个孩子就是最大的两个谜。”
        - id: ch02-b26
          speaker: john
          text: “他们要是天天这么吃，科林少爷今天比一个月前重上一倍也不稀奇。照这个势头，他只会越来越重。再这样下去，我早晚只好辞掉差事，免得搬他的时候伤了自己的肌肉。”
    - id: ch03
      title: 拉开的帘幕
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 那天下午，玛丽发现科林房里有了变化。其实前一天她就看见了，只当是有人碰巧动过，便没有问。今天她仍不出声，只坐着盯住壁炉架上方的画像。她终于能够看清画像，因为遮住它的帘幕已经拉开了。这正是她一直留意的变化。
        - id: ch03-b02
          speaker: colin_craven
          text: “我知道你想问什么。你每次想让我说点什么，我总看得出来。你在想，帘幕为什么开着。我以后都不打算把它拉上了。”
        - id: ch03-b03
          speaker: mary_lennox
          text: “为什么？”
        - id: ch03-b04
          speaker: colin_craven
          text: “因为看见她笑，我已经不会生气了。两天前的夜里，月光特别亮。我醒过来，觉得魔法充满了整个房间，把一切都变得那么美妙，我再也躺不住了。我起来走到窗边往外看，屋里亮堂堂的，帘幕上刚好落着一片月光。不知怎么，那片月光让我走过去拉动了绳子。她低头看着我，像是在笑，也像是因为看见我站在那里而高兴。从那以后，我喜欢看她笑。我想让她一直这样笑着，让我一直看得见。也许她本来就是个有魔法的人。”
        - id: ch03-b05
          speaker: mary_lennox
          text: “你现在太像她了。有时我觉得，你也许就是她的幽灵，只是变成了一个男孩。”
        - id: ch03-b06
          speaker: narrator
          text: 玛丽这个奇异的想法深深触动了科林。他安静下来，把它放在心里想了好一会儿，才慢慢开口回答。
        - id: ch03-b07
          speaker: colin_craven
          text: “假如我是她的幽灵，父亲就会喜欢我了。”
        - id: ch03-b08
          speaker: mary_lennox
          text: “你希望他喜欢你吗？”
        - id: ch03-b09
          speaker: colin_craven
          text: “以前，因为他不喜欢我，我一直恨这件事。要是他开始喜欢我，我想，我会亲口告诉他魔法的事。说不定魔法也能让他变得快活一些。”
