  chapters:
    - id: ch01
      title: The Curtain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The secret garden went on blooming, and each morning brought another miracle. There were eggs in the robin's nest now. His mate sat over them, warming them beneath her soft breast and careful wings. She was nervous at first, and the robin kept an indignant watch. Even Dickon stayed away from that thick, hidden corner. Instead, he let a quiet and mysterious understanding grow between himself and the little pair. In time they knew that nothing in the garden was truly strange to them. Every creature there understood how wonderful the eggs were. They all felt the immense and tender beauty of what was happening, along with its terrible seriousness. If even one person had failed to understand, there could have been no happiness in the golden spring air. An egg might be taken or hurt. Then the whole world would spin away, crash through space, and end. But everyone knew this deep inside and behaved accordingly. The robin and his mate knew they understood.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The robin still watched Mary and Colin with a sharp, worried eye. Dickon was different. From the first glance of his bright black eye, the bird had known that Dickon was almost a robin himself, only without a beak or feathers. Dickon spoke the true robin language, which could never be mistaken for any other. Hearing him was like a Frenchman hearing someone speak French. His strange human talk did not matter. The bird supposed he used it because people were not clever enough to understand feathered speech. Dickon's movements made sense too. He never made a sudden motion that might look dangerous. Any robin could read him perfectly, so his presence caused no uneasiness at all.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The other two needed watching. To begin with, the boy did not enter on his own legs. He arrived on a wheeled thing, with the skins of wild animals thrown over him. That seemed suspicious enough. Later, when he stood and moved, he did it awkwardly and needed the others to help him. Hidden in a bush, the robin studied every step. His head tipped one way, then the other. Perhaps those slow movements meant the boy was getting ready to pounce. Cats crept across the ground just as slowly before they sprang. For several days the robin discussed this troubling possibility with his mate. Her terror became so great that at last he stopped mentioning it. Such fright might be bad for the eggs.
        - id: ch01-b04
          speaker: narrator
          text: >-
            It was a tremendous relief when Colin began walking alone and moving faster. Still, he remained puzzling for what felt like a long time to the robin. He loved to walk, but after a while he would sit or lie down. Then he would rise in a startling way and begin again.
        - id: ch01-b05
          speaker: narrator
          text: >-
            One day the robin remembered how his parents had taught him to fly. At first he had managed only a few yards. Then he had been forced to stop and rest, much as Colin did now. So that was it. The boy was learning to fly, or rather, to walk. The robin shared his discovery with his mate. Their young would probably behave in the same way after they grew their flight feathers and left the nest. She was comforted at once. Soon she was peering eagerly over the edge and taking great pleasure in Colin's lessons. Of course, she felt certain her own young would be much cleverer and learn much faster. Humans, she decided kindly, were clumsy and slow. Most of them never learned to fly at all. You never met them in the air or found them in the treetops.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Before long Colin could move as the others did. Yet all three children sometimes behaved strangely. At certain times each day, they stood under the trees, swinging their arms, legs, and heads. Whatever this activity was, it certainly was not walking, running, or sitting. The robin could never explain to his mate what they were doing or what they hoped to accomplish. He could only promise that their young would never flap around in such a way. Still, Dickon joined in, and he spoke robin perfectly. The birds could trust that the peculiar movements were not dangerous. Of course neither bird had heard of the champion wrestler Bob Haworth. They knew nothing of his exercises for making muscles rise in great lumps. Robins need no such lessons. They use their muscles from the beginning, and those muscles develop naturally. If you have to fly out and find every meal you eat, they cannot waste away from lack of use.
        - id: ch01-b07
          speaker: narrator
          text: >-
            By the time Colin was walking, running, digging, and weeding with the others, peace and contentment settled over the nest. No one worried about danger to the eggs anymore. They were as safe as if someone had locked them inside a bank vault. Meanwhile, all the curious things happening below made sitting on a nest quite entertaining. On wet days, the eggs' mother could even feel a little bored because the children stayed away.
        - id: ch01-b08
          speaker: narrator
          text: >-
            But Mary and Colin were not bored, even in the rain. One morning it poured without stopping. Colin had to stay on his sofa. With the servants nearby, it would not be safe for him to get up and reveal that he could walk. He was growing restless with all that enforced stillness. Then Mary had an idea.
        - id: ch01-b09
          speaker: colin
          text: >-
            Now that I'm a real boy, my arms and legs feel so full of Magic that they won't stay still. They want to be busy all the time. When I wake up early, the birds are shouting outside. Everything seems to be shouting for joy, even the trees and the things we can't hear. I feel as if I have to leap out of bed and shout too. Imagine what would happen if I did!
        - id: ch01-b10
          speaker: narrator
          text: Mary burst into giggles.
        - id: ch01-b11
          speaker: mary
          text: >-
            Your nurse would rush in, and Mrs. Medlock would rush in after her. They'd decide you'd gone mad and send for the doctor.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Colin laughed too. He could picture their horrified faces, and their astonishment at finding him upright.
        - id: ch01-b13
          speaker: colin
          text: >-
            I wish Father would come home. I want to be the one who tells him. I think about it all the time. We can't keep pretending much longer. I can't bear lying still when I want to move, and soon everyone will see that I look completely different. I only wish it weren't raining today.
        - id: ch01-b14
          speaker: narrator
          text: That was when Mary's idea came clear.
        - id: ch01-b15
          speaker: mary
          text: Colin, do you know how many rooms this house has?
        - id: ch01-b16
          speaker: colin
          text: Maybe a thousand.
        - id: ch01-b17
          speaker: mary
          text: >-
            There must be a hundred that nobody ever enters. One rainy day I explored a great many of them. No one found out, though Mrs. Medlock almost caught me. I got lost on the way back and stopped at the end of your hallway. That was the second time I heard you crying.
        - id: ch01-b18
          speaker: narrator
          text: Colin sat up quickly on the sofa.
        - id: ch01-b19
          speaker: colin
          text: >-
            A hundred empty rooms? That's almost like another secret garden. Let's explore them. You can wheel me in my chair, and no one will know where we've gone.
        - id: ch01-b20
          speaker: mary
          text: >-
            That's exactly what I thought. No one would dare come after us. There are galleries where you could run and do your exercises. One little Indian room has a cabinet packed with ivory elephants. And there are all kinds of other rooms.
        - id: ch01-b21
          speaker: colin
          text: Ring the bell.
        - id: ch01-b22
          speaker: narrator
          text: When the nurse entered, Colin gave his instructions.
        - id: ch01-b23
          speaker: colin
          text: >-
            Bring me my chair. Miss Mary and I are going through the unused part of the house. John may push me as far as the picture gallery because there are stairs on the way. Then he must leave us alone until I call for him.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Rainy days stopped being frightening that morning. John wheeled Colin through the unused part of the house and into the picture gallery. Then, obeying Colin's orders, he left the children together. Mary and Colin exchanged delighted looks. Mary waited and listened until she was certain John was truly on his way back to the servants' rooms downstairs. Only then did Colin climb out of the chair.
        - id: ch01-b25
          speaker: colin
          text: >-
            First I'll run all the way down the gallery and back. Then I'll jump. After that, we'll do Bob Haworth's exercises.
        - id: ch01-b26
          speaker: narrator
          text: >-
            They did every bit of it, and plenty more besides. They ran, jumped, and worked their arms and legs. Then they began studying the portraits along the gallery walls. Among them they found the plain little girl in green brocade, holding a parrot on one finger.
        - id: ch01-b27
          speaker: colin
          text: >-
            These people must all be my relatives from long ago. I think the girl with the parrot is one of my great-great-great-great-aunts. She looks a little like you, Mary. Not the way you look now. She looks the way you did when you first came. You're much fatter and better-looking now.
        - id: ch01-b28
          speaker: mary
          text: So are you.
        - id: ch01-b29
          speaker: narrator
          text: >-
            They laughed together. In the Indian room they played with the ivory elephants and examined the little figures that had delighted Mary before. They found the rose-colored brocade sitting room too, along with the hole the mother mouse had left in a cushion. Her young had grown up and run away, so the little nest was empty. From there the children kept wandering. They discovered more rooms than Mary had on her first journey. One passage led them toward another, and each turn offered some new corridor, corner, or flight of steps. They found old pictures they had never seen and chose favorites among them. They came upon strange old objects whose uses they could not guess. It was a wonderfully entertaining morning. Other people were somewhere in the same house, yet Mary and Colin felt as if they had wandered miles away from everyone.
        - id: ch01-b30
          speaker: colin
          text: >-
            I'm glad we came. I never knew I lived in such a huge, strange old house, and I like it. We'll explore whenever it rains. There will always be another odd corner or curious thing to find.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Their adventures also gave them excellent appetites. By the time they returned to Colin's room, they were hungry enough to eat the lunch placed before them. Sending it away untouched, as Colin once had, was no longer possible. Afterward the nurse carried the tray downstairs. She slapped it onto the kitchen dresser so Mrs. Loomis, the cook, could see every polished dish and plate.
        - id: ch01-b32
          speaker: nurse
          text: >-
            Just look at that! This whole house is a mystery, and those two children are the greatest mysteries in it.
          emotion: surprised
        - id: ch01-b33
          speaker: narrator
          text: Strong young John looked at the empty plates.
        - id: ch01-b34
          speaker: john
          text: >-
            If they eat like that every day, it's no wonder the boy weighs twice what he did a month ago. Before long I'll have to quit, or pushing him will ruin my muscles.
        - id: ch01-b35
          speaker: narrator
          text: >-
            That afternoon, Mary saw that something in Colin's room had changed. She had noticed it the day before, but she had wondered if someone had moved it by accident. Now the change was still there. She said nothing about it. Instead she sat and fixed her eyes on the portrait above the mantel. For once, she could look directly at the painted woman because the curtain had been pulled aside.
        - id: ch01-b36
          speaker: colin
          text: >-
            I know what you're waiting for me to explain. I can always tell when you want me to say something. You're wondering why the curtain is open. I'm going to leave it that way.
        - id: ch01-b37
          speaker: mary
          text: Why?
        - id: ch01-b38
          speaker: colin
          text: >-
            Seeing her laugh doesn't make me angry anymore. Two nights ago, I woke when the moon was bright. It felt as though Magic had filled the room and made everything so splendid that I couldn't stay in bed. I got up and looked out the window. Moonlight lay across the curtain, and somehow it made me pull the cord. She looked straight down at me, laughing as if she were glad to see me standing there. I liked looking at her. I want to see her laugh all the time now. Perhaps she was a kind of Magic person.
        - id: ch01-b39
          speaker: mary
          text: >-
            You look so much like her now that sometimes I think you might be her ghost, only turned into a boy.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The idea seemed to impress Colin. He sat with it for a moment, thinking, before answering Mary slowly.
        - id: ch01-b41
          speaker: colin
          text: If I were her ghost, Father would love me.
          emotion: sad
        - id: ch01-b42
          speaker: mary
          text: Do you want him to love you?
        - id: ch01-b43
          speaker: colin
          text: >-
            I used to hate him for not loving me. If he began to love me, I think I'd tell him about the Magic. It might make him happier.
