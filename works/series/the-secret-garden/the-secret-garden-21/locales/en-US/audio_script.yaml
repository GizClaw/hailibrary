  chapters:
    - id: ch01
      title: Ben Weatherstaff
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One strange thing about being alive is that, every now and then, you feel perfectly sure you will live forever and ever. It may happen when you rise at the tender, solemn edge of dawn and go outside alone. You throw your head far back and look higher and higher as the pale sky slowly changes and flushes. Marvelous things you cannot name unfold in the east until you almost cry out. The sun has risen that way every morning for thousands upon thousands of years, and for one moment its great, unchanging wonder can stop your heart.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The feeling may come when you stand alone in a wood at sunset. Deep golden stillness slants through and under the branches, repeating something you can never quite hear, however hard you try. It may come under the immense quiet of a dark blue night, with millions of stars waiting and watching. Faraway music may suddenly make it true. Sometimes, all it takes is a look in someone's eyes.
        - id: ch01-b03
          speaker: narrator
          text: >-
            That was how Colin felt when he first saw and heard and breathed in spring inside the four high walls of the hidden garden. That afternoon, the whole world seemed to have given itself to being perfect, shining, beautiful, and kind to one boy. Perhaps spring, out of pure heavenly goodness, had crowded every wonder it could into that one place. More than once, Dickon stopped in the middle of his work. He stood perfectly still, gazing around as wonder grew in his eyes, and softly shook his head.
        - id: ch01-b04
          speaker: dickon
          text: >-
            Eh, this is a grand one. I'm twelve, near thirteen, and that's a fair lot of afternoons. But I don't believe I've ever seen one as grand as this.
        - id: ch01-b05
          speaker: mary
          text: >-
            Aye, it's grand. I reckon it's the grandest afternoon there ever was.
        - id: ch01-b06
          speaker: narrator
          text: Mary sighed because she was so happy.
        - id: ch01-b07
          speaker: colin
          text: >-
            Does tha' think maybe it was made this way on purpose, just for me?
        - id: ch01-b08
          speaker: mary
          text: >-
            My word! That's proper Yorkshire. Tha'rt learning it splendidly. That tha' art!
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: Delight ruled the garden.
        - id: ch01-b10
          speaker: narrator
          text: >-
            They rolled Colin's chair beneath a plum tree, white with blossoms and humming with bees. Its branches made a canopy fit for a fairy king. Cherry trees flowered nearby. The apple buds were pink and white, and some had already opened wide. Through the blooming branches, patches of blue sky seemed to look down like wonderful eyes.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Mary and Dickon worked a little in one place and then another while Colin watched every move. They carried treasures back for him to hold and study. There were tight buds and buds just opening, pieces of twig with their first green leaves showing, a woodpecker's feather dropped on the grass, and the empty shell of a bird that had hatched early. Then Dickon slowly pushed the chair around and around the garden. Every few moments, he stopped again so Colin could look closely at some wonder rising from the earth or trailing down from a tree. It felt as if a magic king and queen were carrying him in state through their country and showing him every mysterious treasure it held.
        - id: ch01-b12
          speaker: colin
          text: Do you think we'll see the robin?
        - id: ch01-b13
          speaker: dickon
          text: >-
            Tha'll see plenty of him before long. Once those eggs hatch, the poor little fellow will be that busy his head'll spin. He'll fly back and forth with worms near as big as himself. Then he'll reach the nest and find open beaks squawking on every side, till he won't know which great mouth to feed first.
        - id: ch01-b14
          speaker: dickon
          text: >-
            Mother says when she sees how hard a robin works to fill all those beaks, she feels like a fine lady with nothing to do. She's seen the little fellows work so hard, you'd think sweat must be running off them, even if folk can't see it.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Dickon's picture of the exhausted robin delighted them so much that all three began to giggle. Then they remembered the secret and clapped hands over their mouths. Colin had been taught the law of whispers and low voices several days earlier. He loved how mysterious the rule felt and honestly did his best to obey it. But in the middle of such excitement and pleasure, it was very hard never to let a laugh rise above a whisper.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Every moment brought something new, and the sunshine turned more golden as the afternoon went on. At last the chair stood beneath the blossom canopy again. Dickon sat on the grass and took out his pipe. Then Colin noticed something he had missed before.
        - id: ch01-b17
          speaker: colin
          text: That tree over there is very old, isn't it?
        - id: ch01-b18
          speaker: narrator
          text: Dickon and Mary looked across the grass. For one brief moment, neither spoke.
        - id: ch01-b19
          speaker: dickon
          text: Aye, it is.
        - id: ch01-b20
          speaker: narrator
          text: Dickon's low voice sounded very gentle. Mary kept staring at the tree, deep in thought.
        - id: ch01-b21
          speaker: colin
          text: >-
            Its branches are all gray, and there isn't one leaf on it. It's dead, isn't it?
        - id: ch01-b22
          speaker: dickon
          text: >-
            Aye. But the roses have climbed all over it. When their leaves and flowers come out, they'll hide near every bit of dead wood. Then it won't look dead at all. It'll be the prettiest tree here.
        - id: ch01-b23
          speaker: narrator
          text: Mary said nothing. She only watched the tree and thought.
        - id: ch01-b24
          speaker: colin
          text: >-
            It looks like one great branch was torn off. How did that happen?
        - id: ch01-b25
          speaker: dickon
          text: It happened many a year ago. Eh, look there! The robin! He's been finding food for his mate.
          emotion: surprised
        - id: ch01-b26
          speaker: narrator
          text: >-
            Dickon gave a relieved start and laid a hand on Colin. Colin nearly missed the robin, but he caught one flash of the red breast and saw something held in the bird's beak. The robin darted through the green growth, vanished into a thick corner, and was gone. Colin leaned into his cushions with a little laugh.
        - id: ch01-b27
          speaker: colin
          text: >-
            He's taking her tea. Perhaps it's five o'clock. I think I'd like tea too.
        - id: ch01-b28
          speaker: narrator
          text: The dangerous moment had passed.
        - id: ch01-b29
          speaker: mary
          text: >-
            Magic sent that robin. I know it did.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Mary said this secretly to Dickon afterward. They had both feared Colin might keep asking about the tree and the branch that had broken ten years before. Earlier, they had talked about what they would do. Dickon had rubbed his head in a troubled way.
        - id: ch01-b31
          speaker: dickon
          text: >-
            We must act as if it's no different from any other tree. We can never tell the poor lad how that branch broke. If he asks, we must try to look cheerful.
        - id: ch01-b32
          speaker: mary
          text: Aye. We must.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Yet Mary had not felt cheerful as she looked at the tree. In those few moments, she had wondered about something else Dickon had once said. He had kept rubbing his rust-red hair, puzzled, until a comforted look began to settle in his blue eyes.
        - id: ch01-b34
          speaker: dickon
          text: >-
            Mrs. Craven was a lovely young lady. Mother thinks maybe she's often about Misselthwaite, watching over Master Colin. Mothers have to come back when they're taken out of the world. Maybe she's been in this garden. Maybe she set us to work and told us to bring him here.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Mary believed he meant Magic. She had great faith in Magic. In secret, she was sure Dickon worked good Magic on everything near him. That was why people loved him and wild creatures trusted him. Perhaps his gift had brought the robin at the very moment Colin asked his dangerous question.
        - id: ch01-b36
          speaker: narrator
          text: >-
            His Magic seemed to work through the whole afternoon. Colin looked like another boy, nothing like the wild child who had screamed and struck and bitten his pillow. Even his ivory whiteness was changing. The faint color that had touched his face, neck, and hands when he entered the garden had never quite faded. Now he looked like flesh and blood, not ivory or wax.
        - id: ch01-b37
          speaker: narrator
          text: >-
            They saw the robin carry food to his mate two or three more times. Each quick journey seemed to prove that a busy household was hidden in that close-grown corner. And every trip looked so much like the robin was taking afternoon tea to his family that Colin decided they ought to have tea themselves.
        - id: ch01-b38
          speaker: colin
          text: >-
            Have one of the men bring a basket to the rhododendron walk. Then you and Dickon can carry it in here.
        - id: ch01-b39
          speaker: narrator
          text: >-
            It was a pleasant plan and easy to carry out. A servant brought the basket to the rhododendron walk, and Mary and Dickon carried it the rest of the way. Soon a white cloth lay spread on the grass, with hot tea, buttered toast, and crumpets. They were all delightfully hungry and made a fine meal of it. Several birds on household errands stopped to ask what was happening. The crumbs interested them greatly, and they investigated with tremendous energy. Nut and Shell seized pieces of cake and whisked them up into the trees. Soot dragged an entire half of a buttered crumpet into a corner. He pecked it, examined it from every side, turned it over, and made hoarse remarks about it. At last, having made up his mind, he swallowed it all in one joyful gulp.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The afternoon slowly moved toward its mellow hour. The sunlight threw deeper golden shafts across the garden. Bees began going home, and fewer birds flew past overhead. Mary and Dickon sat quietly on the grass. The tea things were packed into the basket, ready to be carried back to the house. Colin lay against his cushions with his heavy locks pushed away from his forehead. After his long day in the open air, his face looked a perfectly natural color.
        - id: ch01-b41
          speaker: colin
          text: >-
            I don't want this afternoon to end. But I'll come back tomorrow, and the next day, and the day after that, and the day after that.
        - id: ch01-b42
          speaker: mary
          text: You'll get plenty of fresh air, won't you?
        - id: ch01-b43
          speaker: colin
          text: >-
            Fresh air is all I'm going to have. I've seen spring now, and I'm going to see summer. I'll watch everything grow in this garden. I'm going to grow here too.
        - id: ch01-b44
          speaker: dickon
          text: >-
            That tha' will. Before long, tha'll be walking around here and digging like anybody else.
        - id: ch01-b45
          speaker: narrator
          text: Colin's face flamed with color.
        - id: ch01-b46
          speaker: colin
          text: Walking? Digging? Will I really?
          emotion: surprised
        - id: ch01-b47
          speaker: narrator
          text: >-
            Dickon looked at him with great care. Neither he nor Mary had ever dared ask whether anything was wrong with Colin's legs.
        - id: ch01-b48
          speaker: dickon
          text: >-
            Of course tha' will. Tha' has legs of thine own, same as anyone else!
        - id: ch01-b49
          speaker: narrator
          text: Mary felt frightened until Colin answered.
        - id: ch01-b50
          speaker: colin
          text: >-
            There's nothing truly wrong with them. They're only very thin and weak. They shake so much that I'm afraid to try standing.
        - id: ch01-b51
          speaker: narrator
          text: Mary and Dickon both let out a breath of relief.
        - id: ch01-b52
          speaker: dickon
          text: >-
            Once tha' stops being afraid, tha'll stand on them. And tha' won't be afraid much longer.
        - id: ch01-b53
          speaker: colin
          text: I won't?
        - id: ch01-b54
          speaker: narrator
          text: >-
            Colin lay still, thinking over what Dickon had promised. For a while, all three of them were truly quiet. The sun sank lower. It was the hour when everything seems to make itself still, and they had spent a busy, exciting afternoon. Colin rested against the cushions as comfortably as if he had never known discomfort. Even the creatures stopped roaming and drew together near the children. Soot perched on a low branch, pulled up one leg, and drowsily lowered the gray film over his eyes. Mary privately thought he looked ready to snore at any moment.
        - id: ch01-b55
          speaker: narrator
          text: In the middle of that deep quiet, Colin suddenly half raised his head and whispered loudly in alarm.
        - id: ch01-b56
          speaker: colin
          text: Who is that man?
          emotion: fearful
        - id: ch01-b57
          speaker: narrator
          text: Mary and Dickon scrambled upright.
        - id: ch01-b58
          speakers: [dickon, mary]
          ensemble: duo
          text: A man?
          emotion: surprised
        - id: ch01-b59
          speaker: narrator
          text: Colin pointed toward the high wall.
        - id: ch01-b60
          speaker: colin
          text: Look! Look up there!
          emotion: surprised
        - id: ch01-b61
          speaker: narrator
          text: >-
            They spun around. Ben Weatherstaff's furious face glared over the wall from the top of a ladder. He shook his fist at Mary.
        - id: ch01-b62
          speaker: ben_weatherstaff
          text: >-
            If I weren't a bachelor, and tha' were my own lass, I'd give thee a good hiding!
          emotion: angry
        - id: ch01-b63
          speaker: narrator
          text: >-
            Ben climbed one more step as if he meant to jump down and punish her himself. But when Mary came toward him, he changed his mind. He stayed on the top rung and kept shaking his fist.
        - id: ch01-b64
          speaker: ben_weatherstaff
          text: >-
            I never thought much of thee! Couldn't abide thee from the first time I saw thee. A scrawny, pale-faced little nuisance, always asking questions and sticking thy nose where nobody wanted it. I don't know how tha' ever got so friendly with me. If it hadn't been for that robin, drat him—
          emotion: angry
        - id: ch01-b65
          speaker: mary
          text: >-
            Ben Weatherstaff! The robin showed me how to get in!
          emotion: surprised
        - id: ch01-b66
          speaker: narrator
          text: >-
            Mary had found her breath at last and called up with a gasp. Ben looked so outraged that he might truly have climbed down inside the wall.
        - id: ch01-b67
          speaker: ben_weatherstaff
          text: >-
            Tha' wicked little thing! Blaming thy badness on a robin! He's cheeky enough for nearly anything, but him show thee the way? Him? Eh, tha' little fool—
          emotion: angry
        - id: ch01-b68
          speaker: narrator
          text: Curiosity suddenly got the better of him, and his next question burst out.
        - id: ch01-b69
          speaker: ben_weatherstaff
          text: How in this world did tha' get inside?
          emotion: surprised
        - id: ch01-b70
          speaker: mary
          text: >-
            The robin showed me. He didn't mean to, but he did. And I won't explain while you're standing there shaking your fist at me.
        - id: ch01-b71
          speaker: narrator
          text: >-
            Ben's fist stopped at once. His jaw dropped, and he stared past Mary at something moving toward him across the grass.
        - id: ch01-b72
          speaker: narrator
          text: >-
            When Ben's angry words first poured over the wall, Colin had been so astonished that he could only sit up and listen. He seemed spellbound by the sight of the old gardener raging above them. But while Ben and Mary argued, Colin recovered himself. The commanding young rajah returned, and he gave Dickon an imperious signal.
        - id: ch01-b73
          speaker: colin
          text: >-
            Wheel me over there. Bring me very close and stop directly in front of him!
        - id: ch01-b74
          speaker: narrator
          text: >-
            So this was what Ben Weatherstaff saw coming across the grass. A wheeled chair, piled with luxurious cushions and robes, rolled toward him like a royal carriage. A young rajah leaned back in it, with royal command blazing in his large, dark-rimmed eyes. One thin white hand stretched haughtily toward the wall. The strange procession came closer and closer, then stopped right beneath Ben's nose. It was no wonder the old gardener's mouth fell open.
        - id: ch01-b75
          speaker: colin
          text: Do you know who I am?
        - id: ch01-b76
          speaker: narrator
          text: >-
            Ben stared. His red old eyes fixed on Colin as though he were seeing a ghost. He swallowed hard but said nothing.
        - id: ch01-b77
          speaker: colin
          text: Do you know who I am? Answer me!
          emotion: angry
        - id: ch01-b78
          speaker: narrator
          text: >-
            Ben rubbed one gnarled hand over his eyes and forehead. At last, he spoke in a strange, shaking voice.
        - id: ch01-b79
          speaker: ben_weatherstaff
          text: >-
            Who tha' art? Aye, I know. Thy mother's eyes are looking straight at me out of thy face. Lord knows how tha' came here. But tha'rt the poor cripple.
        - id: ch01-b80
          speaker: narrator
          text: >-
            Colin forgot he had ever worried about his back. His face burned scarlet, and he sat bolt upright.
        - id: ch01-b81
          speaker: colin
          text: I'm not a cripple! I'm not!
          emotion: angry
        - id: ch01-b82
          speaker: mary
          text: >-
            He isn't! There isn't a lump on his back, not even one as small as a pin. I looked. There was nothing there!
          emotion: angry
        - id: ch01-b83
          speaker: narrator
          text: >-
            Ben passed a hand over his forehead once more and stared as if he could never look long enough. His hand trembled. So did his mouth and his voice. He was an ignorant, tactless old man, and all he could remember were the rumors he had heard.
        - id: ch01-b84
          speaker: ben_weatherstaff
          text: Tha'—tha' hasn't got a crooked back?
          emotion: surprised
        - id: ch01-b85
          speaker: colin
          text: No!
          emotion: angry
        - id: ch01-b86
          speaker: ben_weatherstaff
          text: And tha'—tha' hasn't got crooked legs?
          emotion: surprised
        - id: ch01-b87
          speaker: narrator
          text: >-
            That was too much. All the force Colin usually poured into his tantrums rushed through him in a new direction. No one had ever accused him of crooked legs, not even in a whisper. Yet Ben's shaking voice showed that he believed those crooked legs truly existed. That was more than the flesh and blood of a young rajah could bear. Colin's anger and wounded pride swept every other thought away. For that one moment, he forgot weakness, fear, and all the warnings he had heard. A power he had never known before filled him with almost unnatural strength.
        - id: ch01-b88
          speaker: colin
          text: >-
            Come here, Dickon! Come here this instant!
          emotion: angry
        - id: ch01-b89
          speaker: narrator
          text: >-
            Colin began tearing the covers from his legs and struggling free. Dickon reached him in a second. Mary gave a sharp gasp and turned pale.
        - id: ch01-b90
          speaker: mary
          text: >-
            He can do it. He can do it. He can. He can!
        - id: ch01-b91
          speaker: narrator
          text: >-
            She muttered the words under her breath as fast as she could, as if saying them would help make them true. Then came one short, fierce scramble. Colin pulled himself free while Dickon stayed close beside him. The rugs were tossed onto the ground. Dickon gripped Colin's arm firmly. The thin legs came out from the chair, and the thin feet came down upon the living grass.
        - id: ch01-b92
          speaker: narrator
          text: >-
            Colin was standing. He stood upright, straight as an arrow, and looked strangely tall. His head was thrown back, and his strange eyes flashed like lightning.
        - id: ch01-b93
          speaker: colin
          text: >-
            Look at me! You there, look at me! Just look!
          emotion: angry
        - id: ch01-b94
          speaker: dickon
          text: >-
            He's as straight as I am! He's as straight as any lad in Yorkshire!
          emotion: happy
        - id: ch01-b95
          speaker: narrator
          text: >-
            What Ben did next seemed very strange to Mary. He choked and swallowed. Then tears suddenly ran down his weather-beaten cheeks, and he struck his old hands together.
        - id: ch01-b96
          speaker: ben_weatherstaff
          text: >-
            Eh, the lies folk tell! Tha'rt thin as a board and white as a ghost, but there isn't one crooked knob on thee. Tha'll grow into a man yet. God bless thee!
        - id: ch01-b97
          speaker: narrator
          text: >-
            Dickon held Colin's arm firmly, but Colin did not begin to waver. He drew himself straighter and stared Ben Weatherstaff in the face.
        - id: ch01-b98
          speaker: colin
          text: >-
            While my father is away, I am your master, and you must obey me. This garden belongs to me. Don't you dare tell anyone about it. Climb down, go to the Long Walk, and wait for Miss Mary. She'll bring you here. I want to speak with you. We didn't want you before, but now you'll have to share the secret. Hurry!
        - id: ch01-b99
          speaker: narrator
          text: >-
            Ben's crabbed old face was still wet from that one sudden rush of tears. He could not seem to take his eyes from the thin, straight boy standing with his head held high.
        - id: ch01-b100
          speaker: ben_weatherstaff
          text: Eh, lad. Eh, my lad.
        - id: ch01-b101
          speaker: narrator
          text: >-
            Then Ben remembered himself. He touched his hat like a gardener answering his master.
        - id: ch01-b102
          speaker: ben_weatherstaff
          text: Yes, sir! Yes, sir!
        - id: ch01-b103
          speaker: narrator
          text: He obeyed at once and disappeared as he climbed down the ladder.
