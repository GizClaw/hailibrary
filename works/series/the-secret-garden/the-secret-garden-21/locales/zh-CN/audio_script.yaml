audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
    dickon:
      display_name: 迪肯
      tts: {delivery: 质朴自在，带浓重而亲切的约克郡乡音, timbre: 清亮温厚，带荒原少年的蓬勃气息, pace: 轻快从容, pitch: 中高音}
    ben_weatherstaff:
      display_name: 本·韦瑟斯塔夫
      tts: {delivery: 粗声直率，约克郡口音浓重，偶尔透出温柔, timbre: 苍老粗粝, pace: 偏慢, pitch: 低音}
  chapters:
    - id: ch01
      title: 永远活下去的下午
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 活在世上，有时会遇到一件很奇妙的事。就在某个瞬间，你忽然确信，自己会永远、永远、永远活下去。也许是在庄严又温柔的黎明，你独自仰望天空，看它从苍白慢慢变红。东方的太阳像千千万万年来的每一个早晨那样升起，那份亘古不变的壮丽，会让你几乎惊呼，连心跳都停上一会儿。
        - id: ch01-b02
          speaker: narrator
          text: 也许是在黄昏的树林里，你独自站着。深金色的寂静斜穿过枝叶，也停留在枝叶下，仿佛一遍遍慢慢诉说着什么。你再用心，也始终听不清。也许是深蓝夜空的无边寂静，是千百万颗守望的星星，是远方飘来的一阵音乐，或是某个人眼中的一道目光。那一刻，你就是知道了。
        - id: ch01-b03
          speaker: narrator
          text: 科林第一次在秘密花园的四面高墙里，看见、听见，也感觉到春天时，心里正有这种确信。那天下午，整个世界仿佛只想把最完美、最明亮、最美丽的一面送给他。春天像是出于纯然的善意，把能带来的一切都挤进了这个园子。迪肯干着活，不止一次停下来。他眼里的惊叹越来越深，只顾轻轻摇头。
        - id: ch01-b04
          speaker: dickon
          text: “嗨，今儿可真俊哪！俺十二岁，眼看就十三了。这些年里有过老些个下午，可俺从没见过这么俊的。”
        - id: ch01-b05
          speaker: mary_lennox
          text: “可不是嘛。俺敢说，世上从来没有过比今儿更俊的下午。”
        - id: ch01-b06
          speaker: narrator
          text: 玛丽单是因为快活，就轻轻叹了口气。科林却像做梦一样，小心地问他们。
        - id: ch01-b07
          speaker: colin_craven
          text: “你们觉不觉着，兴许今儿会变成这样，全是特意为了俺？”
        - id: ch01-b08
          speaker: mary_lennox
          text: “哎呀，这句约克郡话说得真地道！你学得顶好，一点儿不假。”
        - id: ch01-b09
          speaker: narrator
          text: 欢喜就这样占满了花园。他们把轮椅推到李树下。雪白的花开了满树，蜜蜂在花间飞来飞去，嗡嗡声仿佛一支乐曲。那棵树像国王头顶的华盖，更像是精灵国王才配拥有的华盖。附近还有盛开的樱桃树。苹果树上挤满了粉白的花苞，有几朵已经在枝头完全张开。花枝之间露出一片片蓝天，像许多奇妙的眼睛，正低头看着他们。
        - id: ch01-b10
          speaker: narrator
          text: 玛丽和迪肯一会儿在这里干活，一会儿又忙到那里，科林就在旁边看。他们不断找到新东西，拿回来让他一件件细瞧。有刚绽开的花苞，也有还没张开的花苞。小树枝才冒出嫩绿的叶尖。草地上落着一根啄木鸟的羽毛，还有一只早早孵出的小鸟留下的空蛋壳。
        - id: ch01-b11
          speaker: narrator
          text: 迪肯推着他一圈圈慢慢走，差不多每走几步便停下来。他让科林看那些刚从泥土里钻出的新生命，也看从树上一路垂落下来的嫩芽和枝条。坐在轮椅里的科林仿佛参加一场盛大的巡游。他正乘着华丽的车，巡视魔法国王与王后的领地，一件件看遍那里不为外人所知的神秘珍宝。
        - id: ch01-b12
          speaker: colin_craven
          text: “不知道我们能不能看见知更鸟？”
        - id: ch01-b13
          speaker: dickon
          text: “再等些日子，你想不看见它都难。小鸟一孵出来，它就得忙得晕头转向。它会叼着差不多跟自己一样大的虫子飞来飞去。等回到窝里，四面全是张大的嘴和叽叽喳喳的叫声，它慌得连第一口该塞进哪张嘴都弄不清。”
        - id: ch01-b14
          speaker: dickon
          text: “俺娘说，她看见知更鸟拼命填那些嘴，就觉得自己简直是位没活儿干的贵妇人。有时那小东西看着都快累出汗了，只不过人瞧不见。”
        - id: ch01-b15
          speaker: narrator
          text: 三个孩子笑得停不下来，只好赶紧捂住嘴。他们突然想起，绝不能让外面的人听见。几天前，科林早就学会了花园里的规矩，只许耳语，只能低声说话。他很喜欢这份神秘，也一直努力守着规矩。可是人兴奋得不得了时，要从头到尾都不笑出耳语以上的声音，实在太难了。
    - id: ch02
      title: 枯树与魔法
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 下午的每一刻都有新鲜事，阳光也一小时比一小时金黄。轮椅回到花树的华盖下。迪肯坐上草地，刚拿出笛子，科林忽然注意到一样先前没看见的东西。
        - id: ch02-b02
          speaker: colin_craven
          text: “那边那棵树已经很老了，对不对？”
        - id: ch02-b03
          speaker: narrator
          text: 迪肯隔着草地望过去，玛丽也望向那棵树。四周静了一会儿。
        - id: ch02-b04
          speaker: dickon
          text: “是啊。”
        - id: ch02-b05
          speaker: narrator
          text: 迪肯的声音很低，也很温柔。玛丽仍盯着树，心里想着往事。
        - id: ch02-b06
          speaker: colin_craven
          text: “枝条都灰了，哪里也没有叶子。它已经死了，是不是？”
        - id: ch02-b07
          speaker: dickon
          text: “是死了。不过玫瑰已经爬得满树都是。等叶子长满，花也开满，枯木差不多全会藏起来。那时候它就不像死树了，还会是园里最漂亮的一棵。”
        - id: ch02-b08
          speaker: narrator
          text: 玛丽还是望着它，一声不响。
        - id: ch02-b09
          speaker: colin_craven
          text: “好像有根很大的树枝折断了。它是怎么断的呢？”
        - id: ch02-b10
          speaker: dickon
          text: “那是好多年前的事啦。嗨，快看知更鸟！它在那儿呢！刚给伴儿找吃的回来。”
        - id: ch02-b11
          speaker: narrator
          text: 迪肯如释重负地把手搭在科林身上。科林差点没赶上，只看见一抹红胸脯闪过。知更鸟嘴里叼着食物，飞快穿过绿荫，钻进草木最密的角落。科林笑着靠回软垫。
        - id: ch02-b12
          speaker: colin_craven
          text: “它在给她送茶点。说不定已经五点了。我也想喝茶。”
        - id: ch02-b13
          speaker: narrator
          text: 这下，他们安全了。后来玛丽悄悄告诉迪肯，她知道是魔法把知更鸟送来的。他们早就怕科林追问十年前折断的树枝，也一起商量过该怎么办。迪肯当时为难地搔着头。
        - id: ch02-b14
          speaker: dickon
          text: “俺们得装作它跟别的树没啥两样。可不能告诉这可怜娃儿树枝是怎么断的。他要真问，俺们就得尽量摆出高兴样儿来。”
        - id: ch02-b15
          speaker: mary_lennox
          text: “对，俺们非这样不可。”
        - id: ch02-b16
          speaker: narrator
          text: 可玛丽望着枯树时，一点也不像在高兴。她想起迪肯还说过另一件事。那时，他一边揉着铁锈红的头发，一边困惑地琢磨，蓝眼睛里却渐渐有了安慰人的神情。
        - id: ch02-b17
          speaker: dickon
          text: “克雷文太太从前特别可爱。俺娘觉着，她兴许常在米塞尔斯韦特附近照看科林少爷。娘就算离开人世，也会回来看孩子。兴许她到过花园，是她叫俺们在这里干活，也是她让俺们把科林带来的。”
        - id: ch02-b18
          speaker: narrator
          text: 玛丽听完便认定，这一定跟魔法有关。她本来就深信魔法，也一直暗暗相信，迪肯会对周围的一切施展魔法。当然，那全是善良的魔法。正因为这样，人人都喜欢他，野生动物也知道他是朋友。玛丽越想越觉得，也许科林问到最危险的地方时，正是迪肯那份奇妙的天赋及时召来了知更鸟。
        - id: ch02-b19
          speaker: narrator
          text: 那股魔法似乎整个下午都在科林身上起作用，让他变成了完全不同的孩子。玛丽看着他，简直不敢相信，这就是那个曾经尖叫、捶打又撕咬枕头的小怪物。就连他那象牙般的苍白也悄悄变了。他刚进花园时，脸、脖子和手上泛起一层淡淡的血色，到现在始终没有完全消退。他终于像个有血有肉的孩子，不再像象牙雕成的，也不再像一尊没有生命的蜡像。
        - id: ch02-b20
          speaker: narrator
          text: 知更鸟又给伴儿送了两三次食物，越看越像下午茶。科林也决定吃茶点，便吩咐男仆把篮子送到杜鹃花小径，再让玛丽和迪肯拿进花园。
        - id: ch02-b21
          speaker: narrator
          text: 这个讨人喜欢的主意很容易就办成了。白布铺在草地上，热茶、黄油烤面包和小圆烤饼一一摆好。三个孩子饿极了，吃得格外香。几只忙着家务的鸟儿飞到附近，停下来打听这里出了什么事。它们发现面包屑，立刻起劲地查看起来。坚果和贝壳各叼一块蛋糕，飞快蹿上树。煤灰拖走整整半块抹了黄油的小圆饼，在角落里又啄又看，还把它翻来翻去，粗声评论半天。等它终于打定主意，便欢欢喜喜地一口全吞了。
    - id: ch03
      title: 从害怕到站立
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 下午拖着缓慢的脚步，走向一天里最温柔醇美的时辰。阳光斜射进花园，一道道光柱像金色的长矛，颜色还在渐渐加深。蜜蜂开始飞回巢里，从他们头顶掠过的鸟儿也越来越少。茶篮已经重新收拾妥当，等着送回宅子。玛丽和迪肯坐在草地上。科林倚着软垫，浓密的头发从额前拨开，脸色自然得就像别的孩子。
        - id: ch03-b02
          speaker: colin_craven
          text: “我不想让这个下午过去。不过明天我会再来，后天也来，再后天也来。以后每天都来。”
        - id: ch03-b03
          speaker: mary_lennox
          text: “那你就能呼吸好多新鲜空气了，对吧？”
        - id: ch03-b04
          speaker: colin_craven
          text: “我只要新鲜空气，别的什么也不要。我已经看见了春天，还要来看夏天。我要看着这里的一切长起来，我自己也要在这里长大。”
        - id: ch03-b05
          speaker: dickon
          text: “你准会长大的。用不了多久，你就能在这儿走来走去，跟旁人一样挖土干活。”
        - id: ch03-b06
          speaker: narrator
          text: 科林一下子涨红了脸。
        - id: ch03-b07
          speaker: colin_craven
          text: “走路？还要挖土？我真的能吗？”
        - id: ch03-b08
          speaker: narrator
          text: 迪肯很小心地看着他。他和玛丽从没问过，科林的腿究竟有什么毛病。
        - id: ch03-b09
          speaker: dickon
          text: “当然能。你跟旁人一样，也有一双自己的腿呀！”
        - id: ch03-b10
          speaker: narrator
          text: 玛丽听得有些害怕。可科林的回答让她立刻放下了心。
        - id: ch03-b11
          speaker: colin_craven
          text: “我的腿其实没病，只是太瘦，也太弱。它们抖得很厉害，我不敢试着站起来。”
        - id: ch03-b12
          speaker: narrator
          text: 玛丽和迪肯同时松了一口气。
        - id: ch03-b13
          speaker: dickon
          text: “等你不怕了，你就站得起来。再过些日子，你自然不会怕啦。”
        - id: ch03-b14
          speaker: colin_craven
          text: “我真的会不怕吗？”
        - id: ch03-b15
          speaker: narrator
          text: 科林静静躺着，仿佛在心里想了很久。他们也都安静下来，一句话也没有说。太阳越落越低，到了万物自行歇息的时辰。他们刚度过一个又忙碌又激动的下午，科林现在舒舒服服地靠着，像是在尽情休息。动物们也不再四处跑动，全都聚在他们旁边。煤灰停上低枝，收起一条腿，困倦地垂下灰白的眼膜。玛丽暗暗觉得，它再过一会儿准会打起呼噜。
        - id: ch03-b16
          speaker: narrator
          text: 就在这片寂静里，科林忽然半抬起头，用响亮而惊慌的耳语叫了起来。
        - id: ch03-b17
          speaker: colin_craven
          text: “那个人是谁？”
          emotion: surprised
        - id: ch03-b18
          speaker: narrator
          text: 玛丽和迪肯跳了起来。
        - id: ch03-b19
          speakers: [mary_lennox, dickon]
          ensemble: duo
          text: “人？哪儿有人？”
        - id: ch03-b20
          speaker: narrator
          text: 科林抬手指向高墙。
        - id: ch03-b21
          speaker: colin_craven
          text: “快看！你们快看！”
        - id: ch03-b22
          speaker: narrator
          text: 两个人猛地转身。本·韦瑟斯塔夫正站在梯子顶上，气愤的脸从墙头露出来，狠狠瞪着他们。他甚至冲玛丽挥起了拳头。
        - id: ch03-b23
          speaker: ben_weatherstaff
          text: “要不是俺没老婆，换作你是俺家的丫头，俺非揍你一顿不可！”
          emotion: angry
        - id: ch03-b24
          speaker: narrator
          text: 本气势汹汹地又爬上一级，仿佛真要跳进来收拾玛丽。可她一走近，他又改了主意，只管站在最高一级，向下挥着拳头。
    - id: ch04
      title: 本·韦瑟斯塔夫的眼泪
      blocks:
        - id: ch04-b01
          speaker: ben_weatherstaff
          text: “俺从来就没瞧上过你！头一回看见你，俺就受不了。一个瘦巴巴、牛奶脸的小扫帚星，成天问这问那，哪儿不该伸鼻子，偏往哪儿伸。俺也不知道，你咋就跟俺混熟了。要不是为了那只知更鸟——该死的小东西——”
          emotion: angry
        - id: ch04-b02
          speaker: mary_lennox
          text: “本·韦瑟斯塔夫，是知更鸟给我指了路！”
        - id: ch04-b03
          speaker: narrator
          text: 玛丽总算喘过气来，站在墙下仰头喊他。本气得像是真要翻墙过来。
        - id: ch04-b04
          speaker: ben_weatherstaff
          text: “你这坏丫头！自个儿干的坏事倒赖给知更鸟。不过它确实胆大包天，啥事都干得出来。它给你指路？它？嗨，你这个小蠢货——可你到底是咋进来的？”
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: 最后那句话，是好奇心硬从他嘴里挤出来的。
        - id: ch04-b06
          speaker: mary_lennox
          text: “就是知更鸟给我指的路。它自己不知道，可它的确做到了。你站在那里挥拳头，我可没法告诉你。”
        - id: ch04-b07
          speaker: narrator
          text: 本立刻停下拳头。他越过玛丽的头顶，望见草地上有一样东西正朝自己过来，下巴竟真的掉了下来。他刚开始滔滔不绝地痛骂时，科林惊讶得只会坐直身子听，像是中了魔法。可听到一半，他已经回过神来。科林没有打断本，只是摆出小主人的威严，向迪肯招了招手。
        - id: ch04-b08
          speaker: colin_craven
          text: “把我推过去！一直推到他面前，离他近一点再停下！”
        - id: ch04-b09
          speaker: narrator
          text: 这就是本·韦瑟斯塔夫看见的景象。一辆铺着华贵软垫和毯子的轮椅驶向他，简直像一驾皇家马车。车里的小王公斜靠着，黑眼圈围着的大眼睛满是命令人的威严，苍白瘦削的手傲慢地伸向前方。轮椅一直停到本的鼻子底下。难怪他张着嘴，半天也合不上。
        - id: ch04-b10
          speaker: colin_craven
          text: “你知道我是谁吗？”
        - id: ch04-b11
          speaker: narrator
          text: 本吃惊地瞪大了眼睛。那双衰老发红的眼睛死死盯着科林，仿佛眼前站着的不是一个孩子，而是一个从往事里走出来的幽灵。他看了又看，怎么也移不开目光。喉咙里像堵着一块硬东西，他用力咽了下去，还是一个字也说不出来。
        - id: ch04-b12
          speaker: colin_craven
          text: “你到底知不知道我是谁？回答我！”
        - id: ch04-b13
          speaker: narrator
          text: 本抬起粗糙多节的手，先抹过双眼，又抹过额头。开口时，他的声音古怪地颤抖着。
        - id: ch04-b14
          speaker: ben_weatherstaff
          text: “你是谁？俺当然知道。你那张脸上，有你娘的眼睛在瞧着俺。老天爷才知道你咋会来这里。可你就是那个可怜的小瘸子。”
        - id: ch04-b15
          speaker: narrator
          text: 科林一下子忘了自己还有背。他满脸绯红，猛地坐得笔直。
        - id: ch04-b16
          speaker: colin_craven
          text: “我不是瘸子！我不是！”
          emotion: angry
        - id: ch04-b17
          speaker: mary_lennox
          text: “他才不是！他背上连针尖那么大的包也没有！我亲眼看过，那里一个包都没有！”
          emotion: angry
        - id: ch04-b18
          speaker: narrator
          text: 本又抹了抹额头，怎么也看不够似的盯着科林。他的手在抖，嘴在抖，连声音也在抖。他没见过多少世面，也不会说中听的话，只记得别人传给他的那些说法。
        - id: ch04-b19
          speaker: ben_weatherstaff
          text: “你——你的背没驼？”
          emotion: surprised
        - id: ch04-b20
          speaker: colin_craven
          text: “没有！”
          emotion: angry
        - id: ch04-b21
          speaker: ben_weatherstaff
          text: “那你的腿也没弯？”
          emotion: surprised
        - id: ch04-b22
          speaker: narrator
          text: 这句话实在太过分了。科林平日发脾气时，总会把全身的力气都用上。现在，那股力量换了一种从未有过的方式，猛地冲遍全身。从来没人说过他的腿是弯的，哪怕背地里低声议论也没有。本的声音却明明白白告诉他，老人真的相信那双弯腿存在。小王公的血肉之躯哪里受得了这种侮辱。愤怒和受伤的自尊让他忘了别的一切，眼里只剩下这一刻，也给了他一种近乎反常的力量。
        - id: ch04-b23
          speaker: colin_craven
          text: “迪肯，快过来！过来！马上！”
          emotion: angry
        - id: ch04-b24
          speaker: narrator
          text: 科林一边喊，一边扯掉腿上的毯子，挣扎着要出来。迪肯转眼便到了他身旁。玛丽短促地吸了一口气，只觉得脸都白了。
        - id: ch04-b25
          speaker: mary_lennox
          text: “他能做到！他能做到！他能做到！他一定能！”
        - id: ch04-b26
          speaker: narrator
          text: 她压低声音，用自己最快的速度反复念着。接着是一阵短促而激烈的忙乱。毯子被扔上草地，迪肯牢牢扶住科林的胳膊。两条瘦腿从轮椅里伸了出来，两只瘦脚第一次这样踩住草地。科林站起来了。他真的直直站在那里，身子挺拔得像一支箭。他看上去出奇地高，头向后仰着，那双奇异的眼睛里闪着电光。
        - id: ch04-b27
          speaker: colin_craven
          text: “看着我！你给我好好看！看着我！”
          emotion: angry
        - id: ch04-b28
          speaker: dickon
          text: “他跟俺一样直！跟约克郡哪个小伙子一样直！”
        - id: ch04-b29
          speaker: narrator
          text: 接下来，本做了一件让玛丽万分诧异的事。这个向来暴躁又不肯好好说话的老人，忽然哽住了。他一再用力吞咽，仿佛有什么话卡在喉咙里。紧接着，眼泪竟顺着那张被风吹雨打出深深皱纹的脸流下来。他把两只衰老的手重重拍在了一起。
        - id: ch04-b30
          speaker: ben_weatherstaff
          text: “嗨，人们净会胡说八道！你瘦得像根板条，白得像个幽灵，可身上一个疙瘩也没有。你会长成个男子汉的。上帝保佑你！”
          emotion: happy
        - id: ch04-b31
          speaker: narrator
          text: 迪肯稳稳扶住科林的胳膊，可他一点也没摇晃。他越站越直，直视着本的脸。
        - id: ch04-b32
          speaker: colin_craven
          text: “我父亲不在时，我就是你的主人，你必须听我的。这是我的花园。不许你把秘密说出去，一个字都不许！现在下梯子，到长径上等着。玛丽小姐会去接你，把你带进来。我要同你谈谈。本来我们不需要你，可现在你也得守住秘密。快去！”
        - id: ch04-b33
          speaker: narrator
          text: 本那张暴躁的老脸上，还留着刚才那阵突如其来的泪水留下的湿痕。他怎么也没法把目光从科林身上移开。这个瘦削的男孩正用自己的双脚站在草地上，身子笔直，头高高仰起，和传闻里那个可怜的残疾孩子完全不同。
        - id: ch04-b34
          speaker: ben_weatherstaff
          text: “嗨，孩子。嗨，俺的孩子！是，少爷！是，少爷！”
        - id: ch04-b35
          speaker: narrator
          text: 他先低低叫了两声，又忽然想起自己的身份，像园丁那样碰了碰帽檐。随后，他顺从地爬下梯子，消失不见了。
