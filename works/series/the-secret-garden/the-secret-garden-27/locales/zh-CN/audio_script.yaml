audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
    dickon:
      display_name: 迪肯
      tts: {delivery: 质朴自在，带浓重而亲切的约克郡乡音, timbre: 清亮温厚，带荒原少年的蓬勃气息, pace: 轻快从容, pitch: 中高音}
    ben_weatherstaff:
      display_name: 本·威瑟斯塔夫
      tts: {delivery: 粗声直率，约克郡口音浓重，偶尔透出温柔, timbre: 苍老粗粝, pace: 偏慢, pitch: 低音}
    mrs_sowerby:
      display_name: 索尔比太太
      tts: {delivery: 慈爱爽朗，说话朴实又有主见, timbre: 温暖丰厚, pace: 从容, pitch: 中音}
    archibald_craven:
      display_name: 克雷文先生
      tts: {delivery: 疲惫疏离，悲痛压在话音深处, timbre: 低沉暗哑, pace: 缓慢而时有停顿, pitch: 低音}
    lilias_craven:
      display_name: 莉莉亚斯·克雷文
      tts: {delivery: 温柔明亮，声音里带着遥远而欢喜的召唤, timbre: 甜美清亮, pace: 舒缓, pitch: 中高音}
    mrs_medlock:
      display_name: 梅德洛克太太
      tts: {delivery: 严厉能干，慌乱时语速陡然加快, timbre: 结实洪亮, pace: 中等, pitch: 中音}
  chapters:
    - id: ch01
      title: 念头与生命
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 每个世纪都会有奇妙的新发现。上一个世纪发现的惊人事物，已经比从前任何时代都多。到了这个新世纪，还会有成百上千件更叫人惊叹的事出现。最初，人们总说新奇的事情绝不可能。后来，他们盼着它真能实现。等到亲眼看见它成功了，大家反而要问，为什么几百年前没有人这样做。
        - id: ch01-b02
          speaker: narrator
          text: 上一个世纪，人们渐渐明白，单单一个念头，也能像电池那样有力量。它可以像阳光一样帮助人，也可以像毒药一样伤害人。让悲伤或邪恶的念头进到脑子里，就像让猩红热的病菌进到身体里。要是任它留下，也许一辈子都摆脱不了。
        - id: ch01-b03
          speaker: narrator
          text: 从前，玛丽小姐脑子里净是叫人不快的念头。她不喜欢这个，也看不惯那个，对谁都刻薄。她认定世上没有什么能让自己高兴，也没有什么值得关心。于是她脸色蜡黄，身体虚弱，总觉得无聊，日子过得一点也不快活。
        - id: ch01-b04
          speaker: narrator
          text: 可命运待她很仁慈，虽然她自己完全不知道。为了救她，命运把她从原先的生活里推了出来。慢慢地，她心里装进了知更鸟，装进了荒原上那间挤满孩子的小屋，也装进了脾气古怪的老园丁和普普通通的约克郡小女仆。还有春天，一天比一天苏醒的秘密花园，以及那个荒原男孩和他的动物们。她的心装满这些以后，那些使她面黄、疲倦，还伤害她肝脏和消化的坏念头，再也找不到地方待了。
        - id: ch01-b05
          speaker: narrator
          text: 科林从前也把自己关在房间里。他只想着恐惧和虚弱，恨别人看他，时时惦记着自己会驼背、会早死。最后，他成了一个歇斯底里、几乎发疯的小病人。他不认识阳光和春天，也不知道，只要自己肯试，就能好起来，还能用双脚站立。
        - id: ch01-b06
          speaker: narrator
          text: 后来，美好而崭新的念头挤走了那些丑恶的旧念头，生命也回到他身上。血液有力地流动，力量像洪水一样涌进身体。他做的科学实验其实既实际又简单。只要讨厌或泄气的念头一钻进来，人能及时发觉，再拿一个愉快、坚定、勇敢的念头把它挤出去，也许就会遇上更惊人的事。因为同一个地方，容不下两样东西。
        - id: ch01-b07
          speaker: narrator
          text: 孩子，你若用心栽种玫瑰，蓟草就没有地方扎根。
        - id: ch01-b08
          speaker: narrator
          text: 秘密花园一天比一天有了生气，两个孩子也跟着它一起活了过来。可是就在这时候，有一个男人还在遥远的美丽地方漂泊。他走过挪威的峡湾，也走过瑞士的山谷和群山。整整十年，阴郁而心碎的念头一直塞满他的心。他不够勇敢，从没试过换一种念头。
        - id: ch01-b09
          speaker: narrator
          text: 他沿着湛蓝的湖水走，想的还是那些事。他躺在山坡上，四周开着大片深蓝色的龙胆花，空气里全是花香，可他仍旧只想那些事。一场可怕的悲痛，在他最幸福的时候落了下来。他任由黑暗灌满灵魂，固执地不让一线光照进去。他忘了家，也丢下了自己的责任。
        - id: ch01-b10
          speaker: narrator
          text: 阴影一路罩着他。旁人只要靠近，仿佛都会被他的忧郁伤到。陌生人多半猜他不是半疯了，就是藏着什么罪恶。他高大，却面容憔悴，双肩弯曲。每次住进旅馆，他都会在簿册上写下同一个名字和住址。他叫阿奇博尔德·克雷文，住在英格兰约克郡米塞尔思韦特庄园。
        - id: ch01-b11
          speaker: narrator
          text: 自从他在书房见过玛丽小姐，答应给她一小块土地，便又开始远游。他走遍欧洲最美的地方，却从不肯在一处停留几天。他总往最偏僻、最遥远的地方去，也登上过高耸入云的山巅。日出时，他看着群山披上光辉，仿佛世界刚刚诞生。可是那片光，好像从来没有照到他身上。
    - id: ch02
      title: 山谷里的光
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 直到有一天，他突然发现，十年来第一次有件怪事发生了。那时，他在奥地利蒂罗尔一座美得出奇的山谷里。那里的景色本可以把任何人的灵魂从阴影中托起来，可他独自走了很远，自己的灵魂仍困在黑暗里。
        - id: ch02-b02
          speaker: narrator
          text: 他终于累了，倒在溪边柔软的苔藓上。一道清澈的小溪穿过湿润繁茂的绿意，在窄窄的水道里欢快奔流。溪水冒着泡，绕过石头时低低作响，听起来很像笑声。鸟儿飞来，低头喝几口水，又振翅飞走。溪水像是活的，那细小的声音反而让四周更安静。整座山谷静极了。
        - id: ch02-b03
          speaker: narrator
          text: 阿奇博尔德·克雷文坐在那里，看着清澈的水流，身体和心渐渐都安静了，仿佛和山谷一样安静。他以为自己快睡着了，其实并没有。他望着阳光照亮的溪水，目光慢慢落到了岸边。
        - id: ch02-b04
          speaker: narrator
          text: 一大片可爱的蓝色勿忘我贴着溪边开放，叶子都被水打湿了。他不知不觉看住了，想起自己多年前也曾这样看花。他心里温柔地想着，这些花真美。数百朵小花聚在一起，竟成了这样奇妙的一片蓝。
        - id: ch02-b05
          speaker: narrator
          text: 他不知道，这个简单的念头正在一点点填满他的心，把别的念头轻轻推开。那感觉就像一股清甜的泉水从死水潭底涌起来，越涨越高，终于冲走了黑水。当然，他自己并没有想到这些。他只知道，自己看着那片明亮娇嫩的蓝色，山谷仿佛越来越静。
        - id: ch02-b06
          speaker: narrator
          text: 他不知道坐了多久，也不知道自己身上发生了什么。最后，他像从梦里醒来一样动了动，慢慢站到苔藓上，深深地、轻轻地吸了一口长气。仿佛有什么束缚悄无声息地松开，把他放了出来。他自己也惊讶极了。
        - id: ch02-b07
          speaker: archibald_craven
          text: “这是怎么了？我几乎觉得……自己又活过来了。”
          emotion: surprised
        - id: ch02-b08
          speaker: narrator
          text: 世上还有太多奇妙的事没有被发现。我懂得不够，解释不了这一切为什么会发生，别人如今也一样解释不了，就连他自己也不明白。可是几个月后，他回到米塞尔思韦特，偶然得知，就在同一天，科林走进秘密花园时曾高声喊出一句话。
        - id: ch02-b09
          speaker: colin_craven
          text: “我要永远、永远、永远活下去！”
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: 那份异样的平静陪了他整整一个傍晚。他睡得从未有过的安稳。可平静没有停留多久，因为他不知道，原来自己可以把它留住。第二天夜里，他又把门敞开，让黑暗的念头成群结队地涌回来。他离开山谷，继续漂泊。
        - id: ch02-b11
          speaker: narrator
          text: 不过有时，那沉重的黑暗会莫名抬起几分钟，偶尔甚至能抬起半个小时。他知道自己是个活人，并不是死人。他虽不明白原因，却也在慢慢地、慢慢地跟花园一起活过来。
        - id: ch02-b12
          speaker: narrator
          text: 金色的夏天渐渐变成颜色更浓的秋天，他来到了科莫湖。那里美得像梦。白天，他在水晶般湛蓝的湖面上划船，或者走进山间柔软浓密的绿荫，一直走到筋疲力尽，好让自己能够睡着。可这时候，他已经睡得好些了，他自己也感觉得到。梦也不再让他害怕。
        - id: ch02-b13
          speaker: archibald_craven
          text: “也许，我的身体正在变强。”
        - id: ch02-b14
          speaker: narrator
          text: 他的身体确实强壮起来。有时，他能得到几个平静的钟头，心里的念头也随之改变，灵魂便慢慢恢复了力量。他开始想起米塞尔思韦特，开始考虑自己是不是应该回家。偶尔，他会模模糊糊地想到儿子。
        - id: ch02-b15
          speaker: narrator
          text: 他想象自己再次站到那张雕花四柱床前，低头看那张熟睡的小脸。那脸轮廓尖削，像象牙一样苍白，紧闭的眼睛周围是一圈浓黑的睫毛。他不知道自己看见这一幕会有什么感觉。念头刚到这里，他又退缩了。
        - id: ch02-b16
          speaker: narrator
          text: 有一天，天气好得像个奇迹。他走了很远，回来时满月已经升得很高，整个世界泡在紫色的阴影和银光里。湖面、湖岸和树林静得不可思议。他没有进别墅，而是走到水边一座被花木围住的小露台，在长椅上坐下，呼吸着夜里天堂般的种种芬芳。那份奇异的平静悄悄漫过来，越来越深，直到他沉沉睡去。
        - id: ch02-b17
          speaker: narrator
          text: 他不知道自己何时睡着，也不知道梦从什么时候开始。梦太真实了，他根本没觉得那是梦。后来回想时，他还记得自己当时以为头脑无比清醒，所有感觉都格外敏锐。
        - id: ch02-b18
          speaker: narrator
          text: 梦里，他仍坐在那里，闻着晚开玫瑰的香气，听湖水在脚边轻拍岸沿。忽然，一个声音叫起了他。那声音甜美、清亮而欢喜，来自很远很远的地方。可他听得清清楚楚，仿佛声音就在身边。
        - id: ch02-b19
          speaker: lilias_craven
          text: “阿奇！阿奇！阿奇！阿奇！阿奇！”
          emotion: happy
        - id: ch02-b20
          speaker: narrator
          text: 他觉得自己猛地站了起来，却一点也不害怕。那个声音太真实，听见它仿佛是世上最自然的事。
        - id: ch02-b21
          speaker: archibald_craven
          text: “莉莉亚斯！莉莉亚斯！你在哪里？”
          emotion: surprised
        - id: ch02-b22
          speaker: lilias_craven
          text: “在花园里。在花园里！”
          emotion: happy
        - id: ch02-b23
          speaker: narrator
          text: 梦到这里就结束了，他却没有醒。整个美好的夜晚，他一直睡得又香又沉。
    - id: ch03
      title: 回家去
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他醒来时，已经是阳光明亮的早晨。一名仆人站在旁边看着他。那是个意大利人，和别墅里的其他佣人一样，早就习惯了这位外国主人的种种怪事，从不多问。谁也不知道他几时出去，几时回来，会睡在什么地方。他也许整夜在花园里游荡，也许躺在湖上的小船里。
        - id: ch03-b02
          speaker: narrator
          text: 仆人托着银盘，上面放了几封信。他安静地等克雷文先生把信接过去，便离开了。克雷文先生把信握在手里，又坐了一会儿，望着湖面。那份异样的平静还罩着他，此外又多了一种轻松。仿佛那件残酷的事，并没有像他以为的那样发生。仿佛有什么已经改变了。他一直想着那个梦，那个真实得不能再真实的梦。
        - id: ch03-b03
          speaker: archibald_craven
          text: “在花园里！可是门锁着，钥匙也埋得很深。”
          emotion: surprised
        - id: ch03-b04
          speaker: narrator
          text: 几分钟后，他低头看信。最上面一封来自英国约克郡，信封上的字迹朴素，是一个女人写的，却不是他认识的笔迹。他拆开信，本来几乎没想写信的人会是谁，可才读到开头几个字，注意力就被牢牢抓住了。
        - id: ch03-b05
          speaker: mrs_sowerby
          text: “尊敬的先生，我是苏珊·索尔比。以前我曾在荒原上冒昧和您说过一次话，那回说的是玛丽小姐。现在我想再冒昧一次。先生，如果我是您，我会回家。我想，您回来一定会高兴的。请原谅我这样说，要是夫人还在，我想她也会请您回来。您忠实的仆人，苏珊·索尔比。”
        - id: ch03-b06
          speaker: narrator
          text: 克雷文先生把信读了两遍，才重新装进信封。他心里还是那个梦。
        - id: ch03-b07
          speaker: archibald_craven
          text: “我要回米塞尔思韦特。对，我马上就走。”
        - id: ch03-b08
          speaker: narrator
          text: 他穿过花园回到别墅，吩咐皮彻准备启程，返回英国。
        - id: ch03-b09
          speaker: narrator
          text: 几天后，他回到了约克郡。漫长的火车旅途中，他发现自己一直想着儿子。这是十年来从没有过的事。过去，他只想忘掉这个孩子。如今，他明明不愿回想，有关儿子的往事却一件接一件飘进心里。
        - id: ch03-b10
          speaker: narrator
          text: 他记起那些黑暗的日子。孩子活了下来，母亲却死了，他为此狂乱得像个疯子。他不肯看那个婴儿。最后终于去看时，眼前只是一个虚弱又可怜的小东西，所有人都断定他几天内就会死。可是日子一天天过去，照料他的人惊讶地发现，他竟然活了下来。于是大家又认定，他会长成一个畸形的瘸子。
        - id: ch03-b11
          speaker: narrator
          text: 他不是存心要做个坏父亲，只是心里从没有过做父亲的感觉。他请来医生和护士，给孩子一切舒适的东西，可一想到儿子，他便只想逃开，继续把自己埋在悲痛里。
        - id: ch03-b12
          speaker: narrator
          text: 离家一年后，他第一次回米塞尔思韦特。那个瘦小可怜的孩子懒洋洋地抬眼看他，神情十分冷淡。那双灰色的大眼睛周围长着浓黑睫毛，和他曾经深爱的那双快乐眼睛如此相像，却又不同得可怕。他受不了那道目光，脸色惨白地转身走了。从此以后，除了趁孩子熟睡时，他几乎再没有见过儿子。
        - id: ch03-b13
          speaker: narrator
          text: 他只知道，儿子成了一个久病不愈、脾气恶劣、歇斯底里而几乎疯狂的病人。每件事都得顺着他，否则他就会大发脾气，伤害自己。这些回忆当然无法叫人振奋。可是火车带着这个正在活过来的男人，飞驰过山间隘口和金色平原时，他开始换一种方式思考。他久久地、专心地想了下去。
        - id: ch03-b14
          speaker: archibald_craven
          text: “也许这十年来，我一直都做错了。十年实在太久。也许一切已经太迟，彻底太迟了。我这些年到底都在想些什么！”
          emotion: sad
        - id: ch03-b15
          speaker: narrator
          text: 一开口便说太迟了，用的当然是错误的魔法，连科林也能告诉他。可他不懂魔法，无论黑魔法还是白魔法，他都不了解。这些事，他以后还得慢慢学。
        - id: ch03-b16
          speaker: narrator
          text: 他猜，苏珊·索尔比也许发现孩子病得更重，快要死了，才鼓起勇气给他写信。若不是那份奇异的平静仍在控制他，他一定会比从前更痛苦。可平静也给了他一点勇气和希望。他没有让最坏的念头牵着走，反而努力相信，事情可能会变好。
        - id: ch03-b17
          speaker: archibald_craven
          text: “会不会是她看出，也许我能帮帮他，管住他？去米塞尔思韦特以前，我要先见她一面。”
        - id: ch03-b18
          speaker: narrator
          text: 可马车穿过荒原，在小屋前停下时，苏珊不在家。七八个在屋外玩耍的孩子围过来，友好又规矩地屈了七八次膝。他们说，母亲一早就去了荒原另一头，帮助一个刚生孩子的女人。他们还主动告诉他，他们的迪肯正在庄园的一座花园里干活，每星期有好几天都去那里。
        - id: ch03-b19
          speaker: narrator
          text: 克雷文先生看着这一群结实的小身体和红润的圆脸。每张脸都用自己的样子咧嘴笑着。他忽然明白，这是一群健康又讨人喜欢的孩子。他也朝那些亲切的笑脸笑了笑，从口袋里拿出一枚金索维林，交给年纪最大的伊丽莎白·埃伦。
        - id: ch03-b20
          speaker: archibald_craven
          text: “把它分成八份，你们每个人都能分到半克朗。”
        - id: ch03-b21
          speaker: narrator
          text: 马车驶走时，身后留着一张张笑脸，一阵阵咯咯的笑声。孩子们互相碰着胳膊肘，高兴得蹦了起来。
        - id: ch03-b22
          speaker: narrator
          text: 马车继续穿过奇妙的荒原，这段路让他的心安定下来。他不明白，这里为什么又让他有了回家的感觉。他早以为自己再也不会这样了。可望着大地和天空，望着远方紫色的花海，再靠近那座古老的大宅，他的心竟一点点暖起来。他的家族已经在那里生活了六百年。
        - id: ch03-b23
          speaker: narrator
          text: 上次离开时，他只要想起紧闭的房间，想起儿子躺在挂着锦缎帷幔的四柱床上，便会浑身发抖。如今，他会不会发现儿子好了一点？他能不能战胜那份躲开儿子的恐惧？那个梦太真实了。那声呼唤又是那么奇妙，那么清亮。在花园里，在花园里。
        - id: ch03-b24
          speaker: archibald_craven
          text: “我要找到那把钥匙，试着打开那扇门。我一定要去，虽然我也不知道为什么。”
    - id: ch04
      title: 门开了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 回到庄园，仆人们照例郑重地迎接主人。他们发现他的气色好了一些，而且没有像平常那样，在皮彻的服侍下住进那几间偏僻的房间。他去了藏书室，派人把梅德洛克太太叫来。她走进来时，又激动，又好奇，还有些慌张。
        - id: ch04-b02
          speaker: archibald_craven
          text: “梅德洛克，科林少爷怎么样了？”
        - id: ch04-b03
          speaker: mrs_medlock
          text: “这个，先生……要我说，他变得不一样了。”
        - id: ch04-b04
          speaker: archibald_craven
          text: “病得更重了吗？”
        - id: ch04-b05
          speaker: narrator
          text: 梅德洛克太太的脸真的红了。
        - id: ch04-b06
          speaker: mrs_medlock
          text: “您看，先生，不论克雷文医生、护士还是我，谁也弄不明白他到底怎么了。”
        - id: ch04-b07
          speaker: archibald_craven
          text: “为什么？”
        - id: ch04-b08
          speaker: mrs_medlock
          text: “说实话，科林少爷可能是在好起来，也可能反而更糟。他的胃口实在叫人猜不透，做的事也一样。”
        - id: ch04-b09
          speaker: archibald_craven
          text: “他是不是变得更……更古怪了？”
        - id: ch04-b10
          speaker: mrs_medlock
          text: “正是，先生。和从前比，他越来越古怪。以前他什么都不吃，后来忽然吃得多得吓人，接着又一下停住，饭菜又像从前那样原封不动地送回来。”
        - id: ch04-b11
          speaker: mrs_medlock
          text: “您也许不知道，他以前绝不肯让人带到外面去。为了劝他坐轮椅出门，我们受的罪，说起来都能叫人吓得发抖。他闹起来实在可怕，连克雷文医生都说，谁要强迫他出去，出了事可担不起。”
        - id: ch04-b12
          speaker: mrs_medlock
          text: “可谁也没想到，他发过最厉害的一场脾气没多久，突然坚持每天都要出去。玛丽小姐陪着他，还有苏珊·索尔比家那个会推轮椅的迪肯。他喜欢上了他们，迪肯还带着驯服的动物。您也许不信，他一出门，就从早一直待到晚。”
        - id: ch04-b13
          speaker: archibald_craven
          text: “他的气色呢？”
        - id: ch04-b14
          speaker: mrs_medlock
          text: “如果他的饭量一直正常，先生，您准会觉得他胖了。可我们又怕那会不会是什么浮肿。他和玛丽小姐单独待着时，有时会笑得很古怪。他以前根本不笑。只要您允许，克雷文医生会马上来见您。他这辈子从没这样摸不着头脑。”
        - id: ch04-b15
          speaker: archibald_craven
          text: “科林少爷现在在哪儿？”
        - id: ch04-b16
          speaker: mrs_medlock
          text: “在花园里，先生。他总是在花园里。不过谁也不许靠近，免得看见他。”
        - id: ch04-b17
          speaker: narrator
          text: 她最后几句话，克雷文先生几乎没有听进去。
        - id: ch04-b18
          speaker: archibald_craven
          text: “在花园里。”
        - id: ch04-b19
          speaker: narrator
          text: 梅德洛克太太离开以后，他仍站在原地，一遍又一遍地念着这句话。过了好一阵，他才把心神拉回眼前。他觉得双脚重新踩到了尘世，便转身走出房间。
        - id: ch04-b20
          speaker: narrator
          text: 他像从前的玛丽一样，穿过灌木丛里的门，走过月桂树和喷泉旁的花圃。喷泉如今已经喷水，周围开满鲜艳的秋花。他越过草坪，拐上常春藤墙边的长路。他走得很慢，双眼看着脚下，仿佛有一股力量正牵着他回到那个被遗弃很久的地方。他不知道为什么。离得越近，脚步就越慢。
        - id: ch04-b21
          speaker: narrator
          text: 他知道门在哪里，尽管浓密的常春藤把它遮住了。可埋起来的钥匙究竟在哪儿，他并不知道。他停下脚步，四处张望。就在停住的下一刻，他忽然一惊，侧耳细听，心里怀疑自己是不是又进了梦。
        - id: ch04-b22
          speaker: narrator
          text: 常春藤厚厚盖着门，钥匙埋在灌木下面。整整十个孤寂的年头，没有人跨进这道门。可是花园里竟然传出了声音。有人跑动，脚在地上拖擦，仿佛正绕着树追逐。还有压低的说话声、惊呼声和拼命忍住的欢笑。
        - id: ch04-b23
          speaker: narrator
          text: 那声音像一群小生命在笑，像孩子们怎么压也压不住的笑。只要兴奋再涨一点，笑声就会整个爆发出来。他究竟梦到了什么？他听见的到底是什么？难道自己失去了理智，听到了凡人的耳朵不该听见的声音？那道遥远而清亮的呼唤，指的就是这里吗？
        - id: ch04-b24
          speaker: narrator
          text: 终于，谁也控制不住的那一刻来了。里面的人忘了压低声音，脚步越跑越快，一路逼近花园门。年轻人的呼吸又急又有力，放纵的笑声和喊声一下迸了出来。墙上的门猛地推开，整片常春藤向后荡去。一个男孩全速冲了出来，根本没有看见门外的人，差点一头撞进他的怀里。
        - id: ch04-b25
          speaker: narrator
          text: 克雷文先生及时伸出双臂，才没让男孩撞倒。他扶稳男孩，稍稍推远一点，惊讶地打量这个突然出现的人，真的倒吸了一口气。
        - id: ch04-b26
          speaker: narrator
          text: 这是一个高挑而英俊的男孩，浑身都闪着生命的光。刚才的奔跑让鲜亮的血色涌上脸颊。他把浓密的头发向额后一甩，抬起一双奇异的灰眼睛。浓黑睫毛围着那双眼，里面全是少年人的笑意。正是这双眼睛，让克雷文先生几乎透不过气。
        - id: ch04-b27
          speaker: archibald_craven
          text: “谁……什么？你是谁？”
          emotion: surprised
        - id: ch04-b28
          speaker: narrator
          text: 这不是科林计划中的见面。他从没想过，父子会这样相遇。可是赢下赛跑，就这样飞奔着冲出门，也许反倒更好。他尽力把身体挺到最高。玛丽也追着跑了出来。在她眼里，科林努力让自己显得比任何时候都高，仿佛一下高了好几英寸。
        - id: ch04-b29
          speaker: colin_craven
          text: “父亲，我是科林。您不敢相信，我自己也几乎不敢相信。可我就是科林。”
        - id: ch04-b30
          speaker: narrator
          text: 他和梅德洛克太太一样，不明白父亲为什么匆匆说起那句话。
        - id: ch04-b31
          speaker: archibald_craven
          text: “在花园里！在花园里！”
          emotion: surprised
        - id: ch04-b32
          speaker: colin_craven
          text: “对，是这座花园治好了我。还有玛丽、迪肯、动物们和魔法。谁也不知道，我们一直保守秘密，就等您回来才告诉您。我好了，赛跑也能赢过玛丽。我要成为一个运动健将。”
          emotion: happy
        - id: ch04-b33
          speaker: narrator
          text: 这完完全全是一个健康男孩说出的话。科林双颊通红，急得一句接一句，根本停不下来。克雷文先生的灵魂被难以相信的喜悦震得颤抖。
        - id: ch04-b34
          speaker: narrator
          text: 科林伸出手，放到父亲的手臂上。
        - id: ch04-b35
          speaker: colin_craven
          text: “父亲，您不高兴吗？您真的不高兴吗？我要永远、永远、永远活下去！”
        - id: ch04-b36
          speaker: narrator
          text: 克雷文先生双手按住儿子的肩膀，让他站稳。他知道自己一时根本不敢开口。
        - id: ch04-b37
          speaker: archibald_craven
          text: “孩子，带我进花园吧。把所有事情都讲给我听。”
        - id: ch04-b38
          speaker: narrator
          text: 于是，他们领着他走进了花园。
    - id: ch05
      title: 走回宅子
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 花园像一片由秋色织成的荒野。到处都是金黄、浓紫、紫罗兰般的蓝，还有燃烧一样的猩红。四面八方，晚开的百合一束束挺立，有的洁白，有的白里透着红宝石的颜色。克雷文先生清楚记得，最初栽下这些花，就是为了让它们在一年中的这个时节，开出迟来的灿烂。
        - id: ch05-b02
          speaker: narrator
          text: 晚开的玫瑰爬满各处，垂下来，又一簇簇拥在一起。阳光把渐黄的树叶照得颜色更深，让人觉得自己站在一座由枝叶围成的黄金圣殿里。新来的客人默默站着，就像孩子们最初走进灰暗的花园时一样。他一遍又一遍地环顾四周。
        - id: ch05-b03
          speaker: archibald_craven
          text: “我以为它早就死了。”
        - id: ch05-b04
          speaker: colin_craven
          text: “玛丽最初也这么想，可它活过来了。”
        - id: ch05-b05
          speaker: narrator
          text: 随后，大家都在他们的树下坐了下来，只有科林不肯坐。他要站着讲自己的故事。
        - id: ch05-b06
          speaker: narrator
          text: 阿奇博尔德·克雷文听着儿子急不可耐地往下讲，只觉得这是平生听过最离奇的故事。这里面有秘密，有魔法，也有野生动物。有那场古怪的午夜集会，有春天怎样到来，还有小王公受了侮辱以后，自尊心猛地发作，竟从地上站起来，当面向老本·威瑟斯塔夫挑战。
        - id: ch05-b07
          speaker: narrator
          text: 科林还讲起那段奇特的友谊，讲他们怎么装病，怎么严守一个重大的秘密。听故事的人笑得眼泪都流了下来。有时他并没有笑，眼里也会涌出泪水。眼前这个运动健将、演说家和科学发现者，原来是个又可笑、又可爱、又健康的小小人儿。
        - id: ch05-b08
          speaker: colin_craven
          text: “现在，它不用再做秘密了。他们看见我，大概会吓得快昏过去。不过我再也不会坐进那张椅子。父亲，我要跟您一起走回宅子，用我自己的双脚走回去。”
          emotion: happy
        - id: ch05-b09
          speaker: narrator
          text: 本·威瑟斯塔夫很少有事情需要离开花园。可这一回，他找了个借口，要给厨房送些蔬菜。梅德洛克太太请他进仆人大厅喝一杯啤酒。于是，当米塞尔思韦特庄园当代最富戏剧性的一幕真正发生时，他正好留在现场。这也正是他盼望的。
        - id: ch05-b10
          speaker: narrator
          text: 仆人大厅有一扇朝向庭院的窗，也能看到草坪的一角。梅德洛克太太知道本刚从花园回来，便希望他也许看见了主人，甚至碰巧见到主人和科林少爷相遇。
        - id: ch05-b11
          speaker: mrs_medlock
          text: “威瑟斯塔夫，他们两个，你看见哪一个了？”
        - id: ch05-b12
          speaker: narrator
          text: 本把啤酒杯从嘴边拿开，用手背擦了擦嘴唇。
        - id: ch05-b13
          speaker: ben_weatherstaff
          text: “看见了，可不是嘛。”
        - id: ch05-b14
          speaker: narrator
          text: 他脸上带着一种精明又意味深长的神气。
        - id: ch05-b15
          speaker: mrs_medlock
          text: “两个都看见了？”
        - id: ch05-b16
          speaker: ben_weatherstaff
          text: “两个都看见了。多谢您，太太，我还能再来一杯。”
        - id: ch05-b17
          speaker: mrs_medlock
          text: “他们在一起？”
        - id: ch05-b18
          speaker: narrator
          text: 梅德洛克太太激动得连忙倒酒，一不小心把杯子斟得太满。
        - id: ch05-b19
          speaker: ben_weatherstaff
          text: “在一起，太太。”
        - id: ch05-b20
          speaker: narrator
          text: 本一口喝掉新添的半杯啤酒。
        - id: ch05-b21
          speaker: mrs_medlock
          text: “科林少爷在哪儿？他看着怎么样？他们两人都说了些什么？”
        - id: ch05-b22
          speaker: ben_weatherstaff
          text: “那些话我没听见。我只是站在活梯上，隔着墙往里看。不过有一件事，我得告诉你。外头发生了不少事，你们这些待在宅子里的人一点也不知道。该让你们知道的，你们马上就会知道。”
        - id: ch05-b23
          speaker: narrator
          text: 不到两分钟，他就咽下最后一口啤酒，然后庄重地挥起杯子，指向那扇窗。越过灌木丛，从那里正好能望见草坪的一角。
        - id: ch05-b24
          speaker: ben_weatherstaff
          text: “看那边。你要是真好奇，就看看草地上走来的是什么。”
        - id: ch05-b25
          speaker: narrator
          text: 梅德洛克太太往外一看，立刻举起双手，短促地尖叫了一声。男女仆人听见声音，全都飞奔过仆人大厅，挤到窗前。他们一个个睁大眼睛，眼珠子简直快要掉出眼眶。
        - id: ch05-b26
          speaker: narrator
          text: 米塞尔思韦特的主人正穿过草坪走来。他此刻的模样，许多人从来没有见过。而他的身边，科林少爷昂着头，挺着胸，眼睛里全是笑意。他走得那么强健，那么稳当，不输给约克郡任何一个男孩！
        - id: ch05-b27
          speaker: narrator
          text: 全书完。
