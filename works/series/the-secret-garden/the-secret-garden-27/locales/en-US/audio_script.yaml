  chapters:
    - id: ch01
      title: Coming Alive
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Every century has brought discoveries that once seemed impossible. People hear of some strange new thing and refuse to believe it. Then they begin to hope. At last they see it happen, and soon everyone wonders why it was not done hundreds of years before.

            One discovery people were beginning to make was about the power of thought. A thought can help you as sunlight does, or harm you like poison. If a sad or bitter thought enters your mind and stays there, it may hurt you for the rest of your life.

            This was how new wonders usually arrived. First came disbelief, then a little hope, and then proof. Once the impossible thing had been done, the whole world accepted it. Thoughts might seem like nothing at all, but they could be as powerful as electric batteries. Letting a poisonous thought stay in the mind could be as dangerous as letting a fever germ enter the body.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Mary had once filled her mind with dislikes, sour opinions, and a firm refusal to enjoy anything. She had been yellow-faced, sickly, bored, and miserable. Then life began pushing her in a better direction, though she did not know it.

            Her thoughts filled with robins, crowded cottages on the moor, a crabbed old gardener, and a plain little Yorkshire housemaid. She thought of spring, of a secret garden waking day by day, and of Dickon with all his creatures. Soon there was no room for the ugly thoughts that had made her tired and ill.

            Mary did not decide all at once to become another kind of child. The people and creatures around her simply gave her better things to think about. Each living thing took up a little more space inside her until her old boredom and sourness had been crowded away.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Colin had spent years shut in his room, thinking of weakness, humps, and an early death. He hated being looked at. He knew nothing of sunshine or spring, and he did not know he could grow well and stand on his feet if he tried.

            But beautiful new thoughts began crowding out the old fearful ones. Life returned. His blood moved strongly, and strength poured into him like a flood. His experiment was practical and simple. Whenever a miserable thought came, he pushed it away with one that was pleasant, determined, and brave. Two things cannot fill the same place.

            Anyone could try the same experiment. The important thing was to notice a discouraged thought in time and deliberately put a courageous one where it had been. There was nothing strange or ghostly about that. The change in Colin only seemed astonishing because he had spent so long believing the opposite.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Where you tend a rose, my lad, a thistle cannot grow.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The secret garden was coming alive, and the two children were coming alive with it. Far away, meanwhile, a man wandered among the Norwegian fjords and the valleys and mountains of Switzerland. For ten years, he had kept his mind full of darkness and heartbreak.

            He had never tried to replace those thoughts. He carried them beside blue lakes and across mountainsides covered in deep blue gentians. Flowers scented the air, but still he thought only of grief. A terrible sorrow had struck when he was happy, and he had stubbornly shut out every ray of light. He forgot his home and deserted his duties.

            His sorrow had become the one thing he allowed himself to see. Beautiful places could surround him without entering his mind. Instead of letting them comfort him, he carried the same blackness from country to country.
        - id: ch01-b06
          speaker: narrator
          text: >-
            His gloom was so heavy that strangers felt it around him. Some thought he must be half mad. Others imagined he carried the guilt of a hidden crime. He was tall, with a drawn face and crooked shoulders. In every hotel register, he wrote the same name: Archibald Craven, Misselthwaite Manor, Yorkshire, England.

            Ever since he had given Mary her bit of earth, he had traveled through the loveliest parts of Europe. He stayed only a few days in each place and always chose the quietest, most distant spots. From mountaintops in the clouds, he watched the sunrise touch the peaks below until the whole world seemed newly born. Yet none of that light seemed to reach him.

            He never stayed anywhere long enough to belong there. He kept moving, as if the next lonely lake or mountain might be farther from his memories than the last. Still, wherever he went, the memories traveled with him.
    - id: ch02
      title: The Valley
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Then, in a beautiful valley in the Austrian Tyrol, something happened for the first time in ten years. Mr. Craven walked alone through scenery that might have lifted anyone out of sorrow. It did not lift him. After a long walk, he grew tired and lay down on soft moss beside a stream.

            The clear water ran merrily through the damp green valley. It bubbled over stones with a sound like quiet laughter. Birds dipped their heads to drink, flicked their wings, and flew away. The little stream seemed alive, but its tiny voice only made the valley feel more still.
        - id: ch02-b02
          speaker: narrator
          text: >-
            As Mr. Craven watched the moving water, his mind and body slowly became as quiet as the valley. He wondered if he was falling asleep, though he was not. At the stream's edge, he noticed a lovely patch of blue forget-me-nots. They grew so close to the water that their leaves were wet.

            He looked at them as he had looked at flowers years ago. He found himself thinking tenderly about their beauty and the wonderful blue of their hundreds of tiny blossoms.

            For once, he was not looking past what lay before him. He noticed the wet leaves, the sunlight on the water, and the clear color of each little flower. The thought was gentle, and while he held it, grief no longer filled every corner of his mind.
        - id: ch02-b03
          speaker: narrator
          text: >-
            That one simple thought quietly filled more and more of his mind. Other thoughts were pushed aside. It was like a clear spring rising through a stagnant pool until it washed the dark water away. Mr. Craven did not understand what was happening. He only felt the valley growing quieter as he gazed at that delicate blue.

            He did not know how long he sat there. The stream went on bubbling, the birds came and went, and the deep stillness held him. He had done nothing grand. He had simply let himself see something lovely again.

            At last he stirred as if waking. He rose slowly from the moss and drew a long, soft breath. Something inside him seemed to have come loose and been set free.
        - id: ch02-b04
          speaker: mr_craven
          text: >-
            What is this? I almost feel as though I'm alive.
        - id: ch02-b05
          speaker: narrator
          text: >-
            He whispered the words and passed a hand over his forehead. No one yet knew enough about undiscovered wonders to explain what had happened, and Mr. Craven understood it least of all. Months later, back at Misselthwaite, he learned by chance that on this very day Colin had entered the secret garden and shouted his great promise.
        - id: ch02-b06
          speaker: colin
          text: >-
            I am going to live forever and ever and ever!
          emotion: happy
        - id: ch02-b07
          speaker: narrator
          text: >-
            The strange peace stayed with Mr. Craven through the evening, and that night he slept a new, restful sleep. But he did not yet know how to keep the peace. By the following night he had opened his mind to the dark thoughts again, and they rushed back in. He left the valley and continued wandering.

            Even so, there were moments, sometimes half an hour at a time, when the black burden lifted without any reason he could see. Then he knew he was a living man, not a dead one. Slowly, without knowing why, he too was coming alive with the garden.

            Those moments did not last, but they returned. Each one showed him that the darkness was not as complete as it had once seemed. Far away in Yorkshire, the garden changed with the seasons, and some unseen part of him seemed to change along with it.
    - id: ch03
      title: A Voice in the Garden
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Golden summer deepened into golden autumn, and Mr. Craven went to Lake Como. The place had the beauty of a dream. He spent his days on the clear blue lake or walking through the thick green hills until he was tired enough to sleep. By then he knew he was sleeping better, and his dreams no longer terrified him.
        - id: ch03-b02
          speaker: mr_craven
          text: >-
            Perhaps my body is getting stronger.
        - id: ch03-b03
          speaker: narrator
          text: >-
            His body was stronger. Because his thoughts had changed during those rare peaceful hours, his spirit was growing stronger too.

            He began thinking of Misselthwaite and wondering whether he ought to go home. Sometimes he thought vaguely of his son. He imagined standing beside the carved bed again, looking down at the sharp, ivory-white face and the closed eyes with their startling black lashes. The thought still made him shrink away.

            Home had once meant only the room where his happiness ended and the child whose face reminded him of all he had lost. Now the idea of returning kept coming back. He did not welcome it, but neither could he shut it out as easily as before.
        - id: ch03-b04
          speaker: narrator
          text: >-
            One marvelous day, he walked so far that the moon was high and full when he returned. Purple shadows and silver covered the world. The lake, the shore, and the woods were so wonderfully still that he did not enter the villa. Instead, he went down to a sheltered terrace at the water's edge. He sat there, breathing the sweet night scents, while the strange calm stole over him and deepened until he fell asleep.

            He could never tell where sleep ended and dreaming began. The dream felt completely real. He seemed wide awake as he breathed in the late roses and listened to the water lapping at his feet. Then he heard a voice calling from far away. It was sweet, clear, and happy, yet he heard it as plainly as if it were beside him.
        - id: ch03-b05
          speaker: lilias
          text: >-
            Archie! Archie! Archie! Archie! Archie!
          emotion: happy
        - id: ch03-b06
          speaker: narrator
          text: >-
            In the dream, he sprang to his feet. He was not even startled. The voice was so real, and hearing it seemed perfectly natural.
        - id: ch03-b07
          speaker: mr_craven
          text: >-
            Lilias! Lilias, where are you?
          emotion: surprised
        - id: ch03-b08
          speaker: lilias
          text: >-
            In the garden. In the garden!
          emotion: happy
        - id: ch03-b09
          speaker: narrator
          text: >-
            The dream ended, but Mr. Craven did not wake. He slept deeply and peacefully through the beautiful night.

            Brilliant morning had arrived when he opened his eyes. An Italian servant stood nearby, watching him. The servants were used to their foreign master's strange habits. No one knew when he might leave or return, whether he would wander in the garden, or whether he might spend the whole night in a boat on the lake. So the servant simply waited with a tray of letters until Mr. Craven took them, then quietly went away.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Mr. Craven sat holding the letters and looking across the lake. The calm remained, and now there was something else with it. He felt lighter, almost as if the cruel thing he had suffered had not happened in quite the way he had believed. Something seemed to have changed. He kept remembering that dream, which had felt so very real.
        - id: ch03-b11
          speaker: mr_craven
          text: >-
            In the garden! But the door is locked, and the key is buried deep.
        - id: ch03-b12
          speaker: narrator
          text: >-
            A few minutes later, he looked at the letters. The one on top had come from Yorkshire. A woman had addressed it in a plain hand he did not recognize. He opened it without much thought, but its first words caught him at once.

            Susan Sowerby wrote that she had once dared to speak to him on the moor about Mary. Now she dared to speak again. She asked him to come home. She believed he would be glad he had come, and begged his pardon for saying that, if his wife were there, she believed his wife would ask him to return too.

            The message was humble, but it was direct. Susan offered no explanation and made no demand. She simply spoke of home, and then she joined her request to the voice Mr. Craven had heard in his dream.
        - id: ch03-b13
          speaker: narrator
          text: >-
            Mr. Craven read Susan's letter twice before putting it back into its envelope. All the while, he thought about the dream.
        - id: ch03-b14
          speaker: mr_craven
          text: >-
            I'll return to Misselthwaite. Yes, I'll leave at once.
        - id: ch03-b15
          speaker: narrator
          text: >-
            He crossed the garden to the villa and told Pitcher to prepare for the journey back to England.
    - id: ch04
      title: The Road Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            A few days later, Mr. Craven was in Yorkshire. During the long train journey, he thought of his son in a way he had not thought of him once in ten years. All that time, he had wanted only to forget.

            Now memories kept returning. He remembered the black days when he had raved because the baby lived while its mother was dead. At first, he refused to see the child. When he finally looked, the baby was so weak and miserable that everyone expected it to die within days. But it lived, and then everyone believed it would grow up deformed and crippled.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Mr. Craven had never meant to be a bad father. The truth was that he had felt no fatherhood at all. He paid for doctors, nurses, and every comfort, but the very thought of the boy made him draw back into his own grief.

            After one year away, he returned to Misselthwaite. The small, unhappy child looked up at him without interest. Colin's great gray eyes, circled by dark lashes, were so like the happy eyes Mr. Craven had loved, and yet so terribly unlike them, that he turned away as pale as death.
        - id: ch04-b03
          speaker: narrator
          text: >-
            After that, he hardly saw Colin unless the boy was asleep. He knew only that his son was a helpless invalid with violent, hysterical rages. People feared those rages might harm him, so they gave him his way in everything.

            Money had provided everything except a father. Mr. Craven had allowed other people to carry the whole burden of Colin's care while he traveled and mourned. He had told himself he could not bear the boy's face, but on the train he began to understand what his absence had meant.

            None of these memories brought comfort. Yet as the train rushed through mountain passes and golden plains, the man who was coming alive began to see them differently. He thought for a long time, steadily and deeply.

            For years he had remembered only what hurt him. Now he also saw choices he had made. His grief had been real, but so was the child he had left behind. That thought stayed with him as the miles carried him toward Yorkshire.
        - id: ch04-b04
          speaker: mr_craven
          text: >-
            Perhaps I've been wrong for ten whole years. It may be far too late to change anything. What have I been thinking of?
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: >-
            Beginning with “too late” was the wrong kind of Magic. Even Colin could have told him that. But Mr. Craven knew nothing yet about either dark Magic or bright Magic.

            He wondered whether Susan had written because she knew Colin was growing worse, perhaps fatally ill. Without the strange calm that held him, the idea would have made him more miserable than ever. But the calm brought courage and hope. Instead of surrendering to the worst thought, he tried to believe in something better.

            The old habit urged him to decide that disaster was waiting. This time, he did not let that fear take over. He could not know why Susan wanted him home, but he could go back, speak to her, and face whatever he found.
        - id: ch04-b06
          speaker: mr_craven
          text: >-
            Could Susan believe I might help him? Could she think I could manage him? I'll visit her before I go on to Misselthwaite.
        - id: ch04-b07
          speaker: narrator
          text: >-
            On the road across the moor, he stopped his carriage at the Sowerbys' cottage. Seven or eight children who had been playing nearby gathered around. They made friendly, polite curtsies and told him their mother had gone across the moor early that morning to help a woman with a new baby. They also proudly explained that their Dickon was at the Manor, working in one of the gardens as he did several days each week.

            Mr. Craven studied the sturdy bodies and round, red-cheeked faces. Each child grinned in a different way. He suddenly saw what a healthy, likable family they were. Smiling back, he drew a gold sovereign from his pocket and handed it to the oldest child, Elizabeth Ellen.
        - id: ch04-b08
          speaker: mr_craven
          text: >-
            Divide this eight ways. Then each of you will have half a crown.
        - id: ch04-b09
          speaker: narrator
          text: >-
            He drove away among grins, chuckles, bobbing curtsies, nudging elbows, and little jumps of joy.

            The ride across the moor soothed him. For the first time, its wide sky, purple distances, and open land gave him a feeling of coming home. His heart warmed as he drew nearer to the old house where his family had lived for six hundred years.
        - id: ch04-b10
          speaker: narrator
          text: >-
            The last time he had left, he had shuddered at the thought of the shut rooms and the boy lying inside his curtained bed. Now he wondered whether Colin might be a little better and whether he could overcome his dread of seeing him. Again he heard the wonderfully clear voice from his dream calling, “In the garden. In the garden.”

            The great house no longer seemed to draw him toward sorrow alone. The land, the sky, and the long history of his family all pulled at him. Somewhere within those walls was his son. Somewhere beyond them was the locked garden Lilias had named.
        - id: ch04-b11
          speaker: mr_craven
          text: >-
            I'll try to find the key. I'll try to open the door. I must, though I don't know why.
    - id: ch05
      title: Behind the Ivy
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            When Mr. Craven reached the Manor, the servants received him with the usual ceremony. They noticed that he looked better. They also saw that he did not retreat to the distant rooms where he usually lived with Pitcher attending him. He went to the library and sent for Mrs. Medlock. She arrived flustered, excited, and curious.
        - id: ch05-b02
          speaker: mr_craven
          text: >-
            How is Master Colin, Medlock?
        - id: ch05-b03
          speaker: mrs_medlock
          text: >-
            Well, sir, he's different. That's about the only way I can put it.
        - id: ch05-b04
          speaker: mr_craven
          text: >-
            Is he worse?
        - id: ch05-b05
          speaker: narrator
          text: >-
            Mrs. Medlock's face flushed.
        - id: ch05-b06
          speaker: mrs_medlock
          text: >-
            The truth is, sir, Dr. Craven can't make him out. Neither can the nurse, and neither can I.
        - id: ch05-b07
          speaker: mr_craven
          text: >-
            What do you mean?
        - id: ch05-b08
          speaker: mrs_medlock
          text: >-
            He may be getting better, sir, or he may be changing for the worse. His appetite makes no sense at all, and then there are his ways.
        - id: ch05-b09
          speaker: mr_craven
          text: >-
            Has he grown even more peculiar?
        - id: ch05-b10
          speaker: narrator
          text: >-
            Mr. Craven drew his brows together anxiously.
        - id: ch05-b11
          speaker: mrs_medlock
          text: >-
            That's exactly it, sir. He's very peculiar compared with how he used to be. He ate nothing before. Then all at once he began eating enormous meals. Then he suddenly stopped, and his trays came back untouched again.

            You may not know that he always refused to go outdoors. Trying to get him into his chair left us shaking. He would work himself into such a state that Dr. Craven said no one could risk forcing him.

            Then, just after one of his worst tantrums, he demanded to be taken out every day. Miss Mary goes with him, and Susan Sowerby's boy Dickon pushes his chair. Master Colin has taken a great liking to both of them. Dickon brings his tame animals too. And if you can believe it, sir, the boy stays outdoors from morning till night.
        - id: ch05-b12
          speaker: mr_craven
          text: >-
            How does he look?
        - id: ch05-b13
          speaker: mrs_medlock
          text: >-
            If he ate in a natural way, you'd say he was filling out. But we're afraid it may be some kind of swelling. Sometimes he laughs strangely when he's alone with Miss Mary. He never laughed before. Dr. Craven wants to see you as soon as you'll allow it. The doctor has never been so puzzled in his life.
        - id: ch05-b14
          speaker: mr_craven
          text: >-
            Where is Colin now?
        - id: ch05-b15
          speaker: mrs_medlock
          text: >-
            He's in the garden, sir. He's always in the garden. But no one is allowed near him, in case they look at him.
        - id: ch05-b16
          speaker: narrator
          text: >-
            Mr. Craven hardly heard the last part.

            Mrs. Medlock had meant to describe another of Colin's strange rules. To Mr. Craven, however, only three words mattered. The dream, Susan's letter, and his son's unexplained change had all led to the same place.
        - id: ch05-b17
          speaker: mr_craven
          text: >-
            In the garden. In the garden!
        - id: ch05-b18
          speaker: narrator
          text: >-
            After dismissing Mrs. Medlock, he stood repeating the words. It took an effort to remember where he was. Then he left the room.

            He followed the route Mary had once taken, through the shrubbery door, among the laurels and the flower beds around the fountain. The water was playing now, surrounded by brilliant autumn flowers. He crossed the lawn and entered the Long Walk beside the ivy-covered walls.
        - id: ch05-b19
          speaker: narrator
          text: >-
            He walked slowly, looking down at the path. Something seemed to draw him toward the place he had abandoned so long ago. As he came nearer, his steps slowed even more. He knew the garden door was hidden somewhere under the thick ivy, though he did not know exactly where the buried key lay.

            He stopped and looked around. Almost at once, he started and listened. Was he walking inside another dream?
        - id: ch05-b20
          speaker: narrator
          text: >-
            Ivy covered the door. The key lay beneath the shrubs. No one had crossed that threshold for ten lonely years. Yet sounds came from inside.

            Feet ran and scuffled under the trees as if in a chase. Low voices tried to hush themselves, but excited cries and bursts of joy kept escaping. It sounded like children laughing while they struggled not to be heard. Their delight was building, and soon they would not be able to hold it in.
        - id: ch05-b21
          speaker: narrator
          text: >-
            Mr. Craven wondered what in heaven he was hearing. Was his mind failing? Were these sounds beyond human ears? Was this what the distant voice had meant?

            Nothing about the locked place matched the sounds within it. Ten years of silence should have waited behind that wall. Instead, the garden seemed full of young life, barely able to contain its happiness.

            Then came the moment when no one could stay quiet. The running feet moved faster and faster toward the door. Strong young breaths came close. Wild laughter burst free. The hidden door flew open, its curtain of ivy swinging back, and a boy raced through at full speed. Without seeing Mr. Craven, he ran almost straight into his arms.
        - id: ch05-b22
          speaker: narrator
          text: >-
            Mr. Craven caught the boy just in time. He held him away and stared in amazement, gasping for breath.

            The boy was tall and handsome, glowing with life. Running had brought splendid color into his face. He tossed thick hair from his forehead and looked up with strange gray eyes full of boyish laughter, their black lashes forming a dark fringe. Those eyes made Mr. Craven gasp again.
        - id: ch05-b23
          speaker: mr_craven
          text: >-
            Who are you? What—who?
          emotion: surprised
        - id: ch05-b24
          speaker: narrator
          text: >-
            Colin had never planned this meeting. Yet perhaps it was better to rush out of the garden after winning a race. Mary had followed him through the door. She watched him draw himself up until he seemed taller than ever before.

            He had imagined telling his father the secret someday, but not while breathless from running and laughing. There was no chair to hide in and no careful preparation. He could only stand before him as the boy he had become.
        - id: ch05-b25
          speaker: colin
          text: >-
            Father, it's me. I'm Colin. I know you can't believe it. I can hardly believe it myself, but I am Colin.
        - id: ch05-b26
          speaker: mr_craven
          text: >-
            In the garden! In the garden!
          emotion: surprised
        - id: ch05-b27
          speaker: colin
          text: >-
            Yes! The garden did it, and Mary and Dickon and the creatures helped. The Magic did too. No one else knows. We kept it secret so we could tell you when you came. I'm well now. I can beat Mary in a race, and I'm going to be an athlete.
          emotion: happy
        - id: ch05-b28
          speaker: narrator
          text: >-
            Colin spoke like any healthy boy. His face was bright, and the words tumbled out in his excitement. Mr. Craven felt his whole soul shake with joy he could hardly believe.

            Colin reached out and laid a hand on his father's arm.

            Mr. Craven had expected, if he saw his son at all, to find the pale invalid from the curtained room. Instead, Colin stood upright before him, eager to share every wonder. The resemblance in those gray eyes no longer brought only pain.
        - id: ch05-b29
          speaker: colin
          text: >-
            Aren't you glad, Father? Aren't you glad? I'm going to live forever and ever and ever!
          emotion: happy
        - id: ch05-b30
          speaker: narrator
          text: >-
            Mr. Craven placed both hands on the boy's shoulders and held him still. For a moment, he did not dare try to speak.
        - id: ch05-b31
          speaker: mr_craven
          text: >-
            Take me into the garden, my boy. Then tell me everything.
        - id: ch05-b32
          speaker: narrator
          text: >-
            And so the children led him inside.
    - id: ch06
      title: Across the Lawn
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            The garden had become a wilderness of autumn gold, purple, violet-blue, and flaming scarlet. Everywhere, late lilies stood in sheaves, some pure white and others white and ruby. Mr. Craven remembered when the first bulbs had been planted so their glory would appear at this very season.

            Late roses climbed, hung, and clustered. Sunlight deepened the yellow of the trees until the garden seemed like a sheltered temple of gold. Mr. Craven stood silent, just as the children had when they first entered its gray stillness. He looked all around him.
        - id: ch06-b02
          speaker: mr_craven
          text: >-
            I thought it would be dead.
        - id: ch06-b03
          speaker: colin
          text: >-
            Mary thought that at first too. But it came alive.
        - id: ch06-b04
          speaker: narrator
          text: >-
            They sat beneath their tree. Everyone sat except Colin, who wanted to stand as he told the story.

            To Archibald Craven, it was the strangest story he had ever heard. Colin poured it out in a breathless rush. He told of the mystery and the Magic, the wild creatures and the strange midnight meeting. He told of spring arriving, and of how wounded pride had pulled the young Rajah to his feet so he could defy old Ben Weatherstaff face-to-face.
        - id: ch06-b05
          speaker: narrator
          text: >-
            There was the odd friendship among the children, their games of pretending, and the great secret they had guarded so carefully. Mr. Craven laughed until tears filled his eyes. At other moments, the tears came when he was not laughing at all.

            This Athlete, Lecturer, and Scientific Discoverer was wonderfully funny and lovable. Most of all, he was a healthy young boy.

            Colin left nothing out. He explained how each friend had helped, how the garden changed, and how he practiced in secret. The wild tale sounded impossible, yet the proof of it stood before his father, talking quickly and refusing to sit down.
        - id: ch06-b06
          speaker: colin
          text: >-
            It doesn't have to be a secret anymore. Everyone may nearly faint when they see me, but I am never getting into that chair again. I'll walk back to the house with you, Father.
        - id: ch06-b07
          speaker: narrator
          text: >-
            Ben Weatherstaff's work seldom took him away from the gardens. On this particular day, however, he found an excuse to carry vegetables to the kitchen. Mrs. Medlock invited him into the servants' hall for a glass of beer. Just as he had hoped, he was there when the most dramatic event Misselthwaite had seen in a generation took place.

            One window looked into the courtyard and also showed a piece of the lawn. Mrs. Medlock knew Ben had come from the gardens. She hoped he might have seen the master, or perhaps even seen him meet Colin.
        - id: ch06-b08
          speaker: mrs_medlock
          text: >-
            Did you see either of them, Weatherstaff?
        - id: ch06-b09
          speaker: narrator
          text: >-
            Ben lowered his beer mug and wiped his mouth with the back of his hand. His expression was full of secret meaning.
        - id: ch06-b10
          speaker: ben_weatherstaff
          text: >-
            Aye, I did that.
        - id: ch06-b11
          speaker: mrs_medlock
          text: >-
            Both of them?
        - id: ch06-b12
          speaker: ben_weatherstaff
          text: >-
            Both of 'em. Thank you kindly, ma'am. I could manage another mug.
        - id: ch06-b13
          speaker: mrs_medlock
          text: >-
            Together?
          emotion: surprised
        - id: ch06-b14
          speaker: narrator
          text: >-
            In her excitement, Mrs. Medlock filled his mug too full. Ben swallowed half of it in one great gulp.
        - id: ch06-b15
          speaker: ben_weatherstaff
          text: >-
            Together, ma'am.
        - id: ch06-b16
          speaker: mrs_medlock
          text: >-
            Where was Master Colin? How did he look? What did they say?
        - id: ch06-b17
          speaker: ben_weatherstaff
          text: >-
            I didn't hear. I was only up on the stepladder, looking over the wall. But I'll tell you this. Things have been happening outdoors that you house people know nothing about. And you're going to find out soon enough.
        - id: ch06-b18
          speaker: narrator
          text: >-
            Less than two minutes later, Ben finished his beer. He raised the mug solemnly toward the window, where the shrubbery left a view of the lawn.
        - id: ch06-b19
          speaker: ben_weatherstaff
          text: >-
            Look there, if you're so curious. Look what's coming over the grass.
        - id: ch06-b20
          speaker: narrator
          text: >-
            Mrs. Medlock looked. She flung up her hands and gave a little shriek. Every servant who heard her rushed across the hall and crowded around the window, staring until their eyes seemed ready to pop out.

            The Master of Misselthwaite was crossing the lawn, looking as many of them had never seen him look before. Beside him walked a boy with his head held high and laughter in his eyes. He moved as strongly and steadily as any boy in Yorkshire.

            The servants had known Colin as a child who stayed hidden upstairs, carried or pushed whenever he left his bed. Now there was no chair and no one supporting him. Father and son came toward the house together, while the whole astonished household watched.
        - id: ch06-b21
          speaker: narrator
          text: >-
            It was Master Colin.
