audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    colin:
      display_name: Colin Craven
      tts:
        delivery: commanding, fretful, and intensely curious
        timbre: delicate and clear
        pace: measured
        pitch: high
    dickon:
      display_name: Dickon Sowerby
      tts:
        delivery: gentle, openhearted, and easy in Yorkshire character
        timbre: fresh and warm
        pace: relaxed
        pitch: medium-high
    ben_weatherstaff:
      display_name: Ben Weatherstaff
      tts:
        delivery: gruff, plainspoken, and dryly expressive in Yorkshire character
        timbre: rough and earthy
        pace: unhurried
        pitch: low
    susan_sowerby:
      display_name: Susan Sowerby
      tts:
        delivery: motherly, plainspoken, and warmly humorous in Yorkshire character
        timbre: rich and comforting
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Magic at Work
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Their belief in the Magic never wavered. After the morning incantations, Colin sometimes gave everyone a lecture about it.
        - id: ch01-b02
          speaker: colin
          text: >-
            I enjoy lecturing. When I grow up and make great scientific discoveries, I'll have to explain them to people, so this is good practice. My lectures have to be short for now because I'm still very young. Besides, Ben Weatherstaff would think he was in church and fall asleep.
        - id: ch01-b03
          speaker: ben_weatherstaff
          text: >-
            The grand thing about givin' a lecture is that a fellow can stand up and say whatever he likes, and nobody gets to answer back. I wouldn't mind doin' a bit of lecturin' myself now and then.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Yet whenever Colin spoke beneath his tree, old Ben watched him hungrily and never looked away. There was unmistakable affection in that stern, judging look. The lecture mattered less to Ben than the boy himself. Every day Colin's legs seemed stronger and straighter. He held his head high. His sharp chin and hollow cheeks had filled out, and his eyes were beginning to shine with a light Ben remembered in another pair of eyes.

            Colin sometimes mistook that steady gaze for deep interest in his ideas. Once, when Ben looked completely spellbound, Colin stopped to ask him about it.
        - id: ch01-b05
          speaker: colin
          text: >-
            What are you thinking about, Ben Weatherstaff?
        - id: ch01-b06
          speaker: ben_weatherstaff
          text: >-
            I'm thinkin' tha must've gained three or four pounds this week. I was studyin' tha calves and shoulders. I'd like to put thee on a proper pair of scales.
        - id: ch01-b07
          speaker: colin
          text: >-
            That's the Magic, along with Mrs. Sowerby's buns and milk and all the other things. You see? The scientific experiment worked.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Dickon arrived too late for the lecture that morning. His cheeks were red from running, and his funny face twinkled even more than usual. The rain had soaked warmly and deeply into the earth, so there was plenty of weeding to do. All that moisture helped the flowers, but it helped the weeds too. Tiny grass blades and pointed new leaves were pushing everywhere. They had to be pulled before their roots took a firm hold. By now Colin could weed as well as anyone, and he could keep lecturing as he worked.
        - id: ch01-b09
          speaker: colin
          text: >-
            The Magic works best when you do some work yourself. You can feel it in your bones and muscles. I'm going to read books about bones and muscles, but I'll write my own book about Magic. I'm already making it up. I discover something new all the time.
        - id: ch01-b10
          speaker: narrator
          text: >-
            A little later, Colin put down his trowel and rose to his feet. He had been quiet for several minutes, thinking up another lecture. But now a sudden, powerful thought seemed to pull him upright. He stretched as tall as he could and flung his arms wide. His face glowed with color, and his strange eyes opened wide with joy. For the first time, he understood something completely.
        - id: ch01-b11
          speaker: colin
          text: >-
            Mary! Dickon! Look at me!
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: >-
            They stopped weeding and turned toward him.
        - id: ch01-b13
          speaker: colin
          text: >-
            Do you remember the first morning you brought me into the garden?
        - id: ch01-b14
          speaker: narrator
          text: >-
            Dickon studied him closely. As an animal charmer, he noticed things most people missed, though he rarely spoke of them. He saw some of those things in Colin now. Mary looked just as hard, but she stayed silent.
        - id: ch01-b15
          speaker: dickon
          text: >-
            Aye. We remember it well.
        - id: ch01-b16
          speaker: colin
          text: >-
            Just now I saw my hand digging with the trowel, and suddenly I remembered that morning too. I had to get up and see whether it was really true. And it is! I'm well. I'm well!
          emotion: happy
        - id: ch01-b17
          speaker: dickon
          text: >-
            Aye, tha art!
          emotion: happy
        - id: ch01-b18
          speaker: colin
          text: >-
            I'm well! I'm well!
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: >-
            His whole face turned red. He had known it before in a way. He had hoped for it, felt it, and thought about it. But seeing his own hand digging had made the truth real. In that moment, joyful belief rushed all through him so strongly that he could not keep it inside. He had to cry out.
        - id: ch01-b20
          speaker: colin
          text: >-
            I shall live forever and ever and ever! I'll discover thousands and thousands of things. I'll learn about people and creatures and everything that grows, like Dickon does. And I'll never stop making Magic. I'm well! I'm well! I want to shout something thankful and joyful to everything that can hear me!
          emotion: happy
    - id: ch02
      title: A Song of Thanks
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Ben Weatherstaff looked over from the rosebush where he had been working.
        - id: ch02-b02
          speaker: ben_weatherstaff
          text: >-
            Tha might sing the Doxology.
        - id: ch02-b03
          speaker: narrator
          text: >-
            He offered the idea in his driest grunt. Ben had never thought much of the Doxology and did not suggest it with any special reverence. But Colin liked exploring new things, and he had never heard of it.
        - id: ch02-b04
          speaker: colin
          text: >-
            What's the Doxology?
        - id: ch02-b05
          speaker: ben_weatherstaff
          text: >-
            Dickon can sing it for thee, I'll warrant.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Dickon smiled his knowing animal-charmer's smile.
        - id: ch02-b07
          speaker: dickon
          text: >-
            They sing it in church. Mother says she thinks the skylarks sing it when they rise in the mornin'.
        - id: ch02-b08
          speaker: colin
          text: >-
            If your mother says that, it must be a good song. I've never been inside a church because I was always too ill. Sing it, Dickon. I want to hear it.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Dickon understood Colin's feeling better than Colin did. It came to him so naturally that he did not even know he was understanding. He took off his cap, looked around at the others, and kept smiling.
        - id: ch02-b10
          speaker: dickon
          text: >-
            Tha must take off tha cap, Colin. Ben, tha must do it too. And tha both have to stand up.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Colin uncovered his head, and the sun warmed his thick hair as he watched Dickon. Ben pushed himself up from his knees and took off his cap too. The old man's face looked puzzled and almost annoyed, as if he could not understand why he was doing such an extraordinary thing.

            Among the trees and rosebushes, Dickon began to sing. There was no fuss about it. His boy's voice was strong and pleasant.
        - id: ch02-b12
          speaker: dickon
          text: |-
            Praise God, from whom all blessings flow.
            Praise Him, all creatures here below.
            Praise Him above, ye Heavenly Host.
            Praise Father, Son, and Holy Ghost.
            Amen.
        - id: ch02-b13
          speaker: narrator
          text: >-
            When the song ended, Ben stood perfectly still. His jaw was stubbornly set, but something troubled his eyes as he stared at Colin. Colin looked thoughtful and pleased.
        - id: ch02-b14
          speaker: colin
          text: >-
            That's a very nice song. I like it. Maybe it says what I mean when I want to shout that I'm thankful to the Magic. Maybe they're both the same thing. How can anyone know the exact name for everything? Sing it again, Dickon. Mary, let's try too. I want to sing it. It's my song. Does it start, “Praise God, from whom all blessings flow”?
        - id: ch02-b15
          speaker: narrator
          text: >-
            They sang it again. Mary and Colin made their voices as musical as they could, while Dickon's grew full and beautiful. At the second line, Ben cleared his throat with a rasp. At the third, he joined them so fiercely that he almost sounded savage.
        - id: ch02-b16
          speakers: [dickon, mary, colin, ben_weatherstaff]
          ensemble: chorus
          text: |-
            Praise God, from whom all blessings flow.
            Praise Him, all creatures here below.
            Praise Him above, ye Heavenly Host.
            Praise Father, Son, and Holy Ghost.
            Amen.
          emotion: happy
        - id: ch02-b17
          speaker: narrator
          text: >-
            When their “Amen” died away, Mary saw that Ben's chin was twitching, just as it had when he learned Colin was not a cripple. The old man stared and blinked, and tears ran over his leathery cheeks.
        - id: ch02-b18
          speaker: ben_weatherstaff
          text: >-
            I never saw much sense in the Doxology before, but I might change my mind in time. I'd say tha's gained five pounds this week, Master Colin. Five whole pounds!
        - id: ch02-b19
          speaker: narrator
          text: >-
            Colin was no longer looking at Ben. Something across the garden had caught his attention, and now his face showed startled surprise.
        - id: ch02-b20
          speaker: colin
          text: >-
            Who's coming in? Who is that?
          emotion: surprised
    - id: ch03
      title: Mother Comes to the Garden
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The door in the ivy-covered wall had opened softly, and a woman had stepped inside during the last line of the song. She stood listening and watching. Ivy rose behind her, and sunlight filtered through the trees onto her long blue cloak. Her fresh, pleasant face smiled across the green garden, like a softly colored picture in one of Colin's books.

            Her wonderfully loving eyes seemed to take in everyone at once. She saw the children, Ben, the creatures, and every flower in bloom. Though she had appeared without warning, no one felt that she was an intruder. Dickon's eyes shone like lamps.
        - id: ch03-b02
          speaker: dickon
          text: >-
            It's Mother! That's who it is!
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: >-
            He ran across the grass to her. Colin started toward her too, with Mary beside him. Both of their hearts beat faster. They met Susan halfway.
        - id: ch03-b04
          speaker: dickon
          text: >-
            It's Mother! I knew tha wanted to meet her, so I told her where the hidden door was.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Colin held out his hand with a shy, almost royal flush, and his eyes searched her face.
        - id: ch03-b06
          speaker: colin
          text: >-
            Even when I was ill, I wanted to see you. I wanted to see you and Dickon and the secret garden. Before that, I'd never wanted to see anyone or anything.
        - id: ch03-b07
          speaker: narrator
          text: >-
            His upturned face changed hers at once. Color rose in her cheeks, the corners of her mouth trembled, and her eyes misted over.
        - id: ch03-b08
          speaker: susan_sowerby
          text: >-
            Eh, dear lad! Oh, dear lad!
        - id: ch03-b09
          speaker: narrator
          text: >-
            The words seemed to escape before she knew she would say them. She did not call him Master Colin. She simply called him dear lad, as she might have called Dickon if something in his face had touched her. Colin liked it.
        - id: ch03-b10
          speaker: colin
          text: >-
            Are you surprised to see how well I am?
        - id: ch03-b11
          speaker: narrator
          text: >-
            She laid a hand on his shoulder and smiled the mist from her eyes.
        - id: ch03-b12
          speaker: susan_sowerby
          text: >-
            Aye, I surely am! But tha looks so much like tha mother that my heart gave a jump.
          emotion: surprised
        - id: ch03-b13
          speaker: colin
          text: >-
            Do you think that will make my father like me?
        - id: ch03-b14
          speaker: susan_sowerby
          text: >-
            Aye, I'm sure it will, dear lad. He must come home. He must.
        - id: ch03-b15
          speaker: narrator
          text: >-
            She gave his shoulder a quick, gentle pat. Ben Weatherstaff moved closer to her.
        - id: ch03-b16
          speaker: ben_weatherstaff
          text: >-
            Susan Sowerby, will tha look at the lad's legs? Two months ago they were like drumsticks in stockin's. Folks said they were bowlegged and knock-kneed both at once. Just look at them now!
        - id: ch03-b17
          speaker: narrator
          text: >-
            Susan gave a comfortable laugh.
        - id: ch03-b18
          speaker: susan_sowerby
          text: >-
            Before long, they'll be fine, strong legs. Let him keep playin' and workin' in the garden. Let him eat well and drink plenty of good sweet milk. There won't be a finer pair in all Yorkshire, thank God.
          emotion: happy
        - id: ch03-b19
          speaker: narrator
          text: >-
            Then she put both hands on Mary's shoulders and looked over the little girl's face like a mother.
        - id: ch03-b20
          speaker: susan_sowerby
          text: >-
            And look at thee! Tha's grown nearly as healthy as our Elizabeth Ellen. I'll warrant tha favors tha mother too. Martha told me Mrs. Medlock had heard she was a pretty woman. When tha grows up, my little lass, tha'll be like a blush rose. Bless thee.
        - id: ch03-b21
          speaker: narrator
          text: >-
            Susan did not say that after Martha's day out, when she heard about the pale, plain child, she had stubbornly declared that no pretty woman could possibly be Mary's mother. At the time, Mrs. Medlock's report had made no sense to her at all. Mary had paid little attention to her changing face. She knew only that she looked different, that she seemed to have much more hair, and that it was growing quickly. Still, she remembered how she had loved looking at her beautiful mother in India. The thought that she might resemble her one day made Mary glad.

            Susan walked around the garden with them. They told her its whole story and showed her every bush and tree that had come alive. Colin stayed on one side of her and Mary on the other. Again and again, they looked up at her rosy, comfortable face. Both wondered secretly about the warm, supported feeling she gave them. She seemed to understand them the way Dickon understood his creatures.

            Susan listened to every part of the garden's story. She bent over the flowers and spoke of them as if they were children. Soot followed her, cawed once or twice, and even flew onto her shoulder as he did with Dickon. When they told her about the robin, his nest, and the young birds taking their first flight, her soft, motherly laugh sounded in her throat.
        - id: ch03-b22
          speaker: susan_sowerby
          text: >-
            I suppose teachin' them to fly is much like teachin' children to walk. But I'd be in a terrible worry if mine had wings instead of legs.
          emotion: happy
        - id: ch03-b23
          speaker: narrator
          text: >-
            In her simple moorland way, she seemed so wonderful that at last they told her about the Magic.
        - id: ch03-b24
          speaker: colin
          text: >-
            Do you believe in Magic? I told you about the Indian fakirs, and I truly hope you believe in it.
        - id: ch03-b25
          speaker: susan_sowerby
          text: >-
            That I do, lad. I never called it Magic, but what does a name matter? They'll have one name for it in France and another in Germany. The same thing that swells the seeds and makes the sun shine has made thee a well boy. It's the Great Good Thing. It doesn't fret over names the way foolish people do. It just keeps on makin' millions of worlds, worlds like ours. Never stop believin' in that Great Good Thing. Know the world is full of it, and call it whatever tha likes. Tha was singin' to it when I came through the door.
        - id: ch03-b26
          speaker: colin
          text: >-
            I felt so joyful. All at once I knew how different I was. My arms and legs were strong. I could dig, and I could stand. I jumped up and wanted to shout something to anything that would listen.
          emotion: happy
        - id: ch03-b27
          speaker: susan_sowerby
          text: >-
            The Magic heard thee sing the Doxology, and it would've heard any song tha chose. The joy was what mattered. Eh, lad, what do names matter to the Maker of Joy?
          emotion: happy
        - id: ch03-b28
          speaker: narrator
          text: >-
            She gave his shoulders another quick, gentle pat.
    - id: ch04
      title: What Colin Wanted
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Susan had packed a basket with a real feast that morning. When the hungry hour arrived, Dickon fetched it from its hiding place. She sat beneath the tree while the children devoured everything. Their hearty appetites delighted her. She watched and laughed as if seeing them eat was a treat for her too. She was full of fun. She told stories in broad Yorkshire, taught them new words, and made them laugh at all kinds of odd things.

            They told her how hard it was becoming to pretend that Colin was still a fretful invalid. Susan laughed as though she could not help herself.
        - id: ch04-b02
          speaker: colin
          text: >-
            We laugh almost the whole time we're together, and that doesn't sound ill at all. We try to swallow the laughter, but then it bursts out and sounds worse than ever.
        - id: ch04-b03
          speaker: mary
          text: >-
            There's one thought I can hardly ever hold in when it pops into my head. What if Colin's face turns as round as a full moon? It isn't round yet, but he gets a tiny bit fatter every day. Suppose we wake up one morning and it looks exactly like one. What would we do?
        - id: ch04-b04
          speaker: susan_sowerby
          text: >-
            Bless us, tha still has plenty of actin' to do! But tha won't need to keep it up much longer. Master Craven will come home.
          emotion: happy
        - id: ch04-b05
          speaker: colin
          text: >-
            Do you really think he will? Why?
        - id: ch04-b06
          speaker: narrator
          text: >-
            Susan chuckled softly.
        - id: ch04-b07
          speaker: susan_sowerby
          text: >-
            I reckon it would nearly break tha heart if he found out before tha could tell him tha own way. Tha's been lyin' awake at night and plannin' it.
        - id: ch04-b08
          speaker: colin
          text: >-
            I couldn't bear for anyone else to tell him. Every day I imagine a different way to do it. Now I think I only want to run right into his room.
        - id: ch04-b09
          speaker: susan_sowerby
          text: >-
            That would give him a fine surprise. Oh, lad, I'd like to see his face! He must come back. He truly must.
        - id: ch04-b10
          speaker: narrator
          text: >-
            They also talked about visiting Susan's cottage, and together they planned the whole day. They would drive across the wide moor and eat lunch outdoors among the heather. Mary and Colin would meet every one of Susan's twelve children and see the garden Dickon kept at home. They meant to spend the day there and would not start back until they were thoroughly tired.

            At last, Susan stood to go back to the house and Mrs. Medlock. It was time for Colin to be wheeled in too. Before he climbed into his chair, he came very close to Susan and fixed his eyes on her face. He looked bewildered by how much he adored her. Then he suddenly caught a fold of her blue cloak and held it tight.
        - id: ch04-b11
          speaker: colin
          text: >-
            You are exactly what I wanted. I wish you were my mother too, as well as Dickon's.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Susan bent down at once. Her warm arms drew Colin close against the breast beneath her blue cloak, as if he were Dickon's own brother. The quick mist came over her eyes again.
        - id: ch04-b13
          speaker: susan_sowerby
          text: >-
            Eh, dear lad! I do believe tha own mother is right here in this garden. She couldn't keep away from it. Tha father must come home to thee. He must!
