audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
    dickon:
      display_name: 迪肯
      tts: {delivery: 质朴自在，带浓重而亲切的约克郡乡音, timbre: 清亮温厚，带荒原少年的蓬勃气息, pace: 轻快从容, pitch: 中高音}
    ben_weatherstaff:
      display_name: 本·韦瑟斯塔夫
      tts: {delivery: 粗声直率，约克郡口音浓重，偶尔透出温柔, timbre: 苍老粗粝, pace: 偏慢, pitch: 低音}
    mrs_sowerby:
      display_name: 索尔比太太
      tts: {delivery: 慈爱爽朗，说话朴实又有主见, timbre: 温暖丰厚, pace: 从容, pitch: 中音}
  chapters:
    - id: ch01
      title: 魔法成功了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 孩子们始终相信魔法。每天早晨念完咒语，科林有时还会给大家讲一堂魔法课。
        - id: ch01-b02
          speaker: colin_craven
          text: “我喜欢讲课。等我长大，有了伟大的科学发现，就非得给别人讲解，所以现在正好练习。眼下只能讲短一点，因为我还很小。再说，讲久了，本会以为自己坐在教堂里，听着听着就睡着。”
        - id: ch01-b03
          speaker: ben_weatherstaff
          text: “讲课有一样最好。一个人站起来，爱说什么就说什么，旁人还不能回嘴。哪天让我讲讲，我也乐意。”
        - id: ch01-b04
          speaker: narrator
          text: 可科林站在自己的树下讲得起劲时，本总是牢牢盯着他，怎么也看不够。他带着挑剔又疼爱的眼神，把科林从头到脚看个遍。老人真正在意的不是那些话，而是科林一天比一天挺直有力的腿，是他昂然抬起的脑袋，是从前尖削的下巴和凹陷的双颊，如今一点点变得丰满圆润。还有那双眼睛，里面已经有了一种光，像极了本记忆中的另一双眼睛。科林只当本听入了迷，常常猜他究竟在琢磨什么。有一回，本看得简直出了神，科林终于忍不住问了。
        - id: ch01-b05
          speaker: colin_craven
          text: “本·威瑟斯塔夫，你到底在想什么？”
        - id: ch01-b06
          speaker: ben_weatherstaff
          text: “我在想，你这星期准又重了三四磅。我一直瞧你的腿肚子和肩膀呢，真想把你放到秤上称称。”
        - id: ch01-b07
          speaker: colin_craven
          text: “这都是魔法，还有索尔比太太的小圆面包、牛奶和那些吃的。你看，科学实验成功了。”
        - id: ch01-b08
          speaker: narrator
          text: 那天迪肯来晚了，没赶上听课。他一路跑来，双颊通红，那张有趣的脸比平时更亮。暖雨下透以后，花草长得好，野草也一齐冒了出来，总有许多活等着他们。滋养花朵的湿气也在滋养野草。孩子们得赶在根扎牢以前，把刚钻出土的细小草叶和叶尖一一拔掉。如今科林除起草来一点也不输给别人，手里干活，嘴里还能继续讲课。
        - id: ch01-b09
          speaker: colin_craven
          text: “你自己也动手的时候，魔法最灵，骨头和肌肉里都能感觉到。我会读讲骨骼和肌肉的书，还要自己写一本讲魔法的书。现在我就在想内容，因为我总能发现新东西。”
        - id: ch01-b10
          speaker: narrator
          text: 说完没多久，科林便放下小铲子，站了起来。他刚才沉默了好几分钟，大家知道，他又像往常一样在心里准备讲稿。可这一次，他丢下铲子直起身时，玛丽和迪肯都觉得，仿佛有个突然而强烈的念头催他这么做。他把身体舒展到最高，欣喜地张开双臂，脸上泛起红光，那双奇异的眼睛也因喜悦而睁大。就在这一刻，他彻底明白了一件事。
        - id: ch01-b11
          speaker: colin_craven
          text: “玛丽！迪肯！快看我！”
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: 玛丽和迪肯立刻停下手里的除草活，一齐抬起头，专心望着他。
        - id: ch01-b13
          speaker: colin_craven
          text: “你们记不记得，第一次带我进花园的那个早晨？”
        - id: ch01-b14
          speaker: narrator
          text: 迪肯定定看着科林。这个能与动物亲近的男孩，总能看见许多旁人看不见的东西，其中不少，他从来不曾说出口。此刻，他在科林身上也看见了一些。
        - id: ch01-b15
          speaker: dickon
          text: “当然记得。”
        - id: ch01-b16
          speaker: narrator
          text: 玛丽也认真看着，却没有开口。
        - id: ch01-b17
          speaker: colin_craven
          text: “刚才我看见自己拿着铲子挖土的手，一下想起了那一天。我非得站起来，看看这是真的还是假的。是真的！我好了，我真的好了！”
          emotion: happy
        - id: ch01-b18
          speaker: dickon
          text: “可不是嘛，你好啦！”
          emotion: happy
        - id: ch01-b19
          speaker: colin_craven
          text: “我好了！我好了！”
          emotion: happy
        - id: ch01-b20
          speaker: narrator
          text: 科林整张脸都红了。其实他早就有些明白。他盼望过，感觉过，也反复想过自己正在好起来。可方才有一股东西猛地涌遍全身。那是一种狂喜的信念，是彻底明白过来的欢喜，强烈得让他再也忍不住，非喊出来不可。
        - id: ch01-b21
          speaker: colin_craven
          text: “我要永远、永远、永远活下去！我要发现成千上万的事。我要像迪肯一样，去了解人、动物，还有所有会生长的东西。我还要一直创造魔法，永远不停。我好了！我真想喊出点什么，喊出感激又快乐的话！”
          emotion: happy
    - id: ch02
      title: 花园里的赞美诗
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 本正在玫瑰丛旁干活，听见这话便回头看了一眼。
        - id: ch02-b02
          speaker: ben_weatherstaff
          text: “那你可以唱《赞美诗》。”
        - id: ch02-b03
          speaker: narrator
          text: 他用最干涩的声音咕哝着。其实本并不怎么喜欢这首歌，提议时也没有多少虔敬的意思。科林却一心想探究新事物，立刻问了起来。
        - id: ch02-b04
          speaker: colin_craven
          text: “《赞美诗》是什么？”
        - id: ch02-b05
          speaker: ben_weatherstaff
          text: “迪肯准能唱给你听。”
        - id: ch02-b06
          speaker: narrator
          text: 迪肯露出了那种仿佛什么都懂的微笑。
        - id: ch02-b07
          speaker: dickon
          text: “教堂里会唱。俺妈说，她相信云雀清早飞上天时，唱的就是这个。”
        - id: ch02-b08
          speaker: colin_craven
          text: “既然她这么说，那一定好听。我从没去过教堂，以前总是病得太重。唱吧，迪肯，我想听。”
        - id: ch02-b09
          speaker: narrator
          text: 迪肯一点也不扭捏，觉得唱这首歌再自然不过。他凭着天生的直觉，比科林自己更明白科林此刻的感受。那份直觉自然得很，连他自己都不知道，这就叫理解。他摘下帽子，仍旧微笑着看了看四周。
        - id: ch02-b10
          speaker: dickon
          text: “你得把帽子摘下来。本，你也得摘，还要站起来。”
        - id: ch02-b11
          speaker: narrator
          text: 科林摘下帽子，阳光暖暖照着他浓密的头发。本也费力从地上爬起来，露出脑袋，脸上又困惑又有点不情愿，仿佛连自己都不明白，为什么要做这么稀奇的事。迪肯站在树木和玫瑰之间，用清亮有力的少年嗓音，朴朴实实地唱了起来。
        - id: ch02-b12
          speaker: dickon
          text: “万福泉源，赞美上帝。尘世万物，齐声赞美。天上万军，颂扬主名。圣父、圣子、圣灵同荣。阿门。”
        - id: ch02-b13
          speaker: narrator
          text: 唱完以后，本一动不动地站着。他固执地咬紧牙，眼神却乱了，仍旧望着科林。科林认真想了想。
        - id: ch02-b14
          speaker: colin_craven
          text: “这首歌真好听。我喜欢。也许它说的，就是我想大声感谢魔法时的意思。也许它们本来就是同一样东西。世上每件事真正叫什么，我们怎么可能全知道？迪肯，再唱一遍。玛丽，我们也来试试。我也要唱，因为这是我的歌。开头是‘万福泉源，赞美上帝’，对吗？”
        - id: ch02-b15
          speaker: narrator
          text: 于是他们又把歌唱了一遍。玛丽和科林抬起声音，尽量把每一句唱得悦耳。迪肯的歌声却越来越洪亮，也越来越美。到了第二句，本刺耳地清了清嗓子。第三句刚开始，他便使出全身力气唱了进来，那股劲头简直有些凶猛。最后一声“阿门”终于落下，玛丽看见，他身上又发生了上次那样的事。老人的下巴不停抽动，两眼直瞪着，又连连眨动，皮革般的老脸颊已经湿了。发现科林不是瘸子的那一天，他也是这个样子。
        - id: ch02-b16
          speaker: ben_weatherstaff
          text: “从前我从没觉得这首歌有什么道理，不过以后也许会改主意。科林少爷，我看你这星期重了足足五磅，整整五磅！”
    - id: ch03
      title: 是妈妈
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 科林忽然越过花园望向一处，脸上满是惊讶。
        - id: ch03-b02
          speaker: colin_craven
          text: “谁进来了？那是谁？”
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: 爬满常春藤的墙上，那扇门被轻轻推开，一个女人走了进来。他们唱到最后一句时，她刚刚进门，便停在那里，一面听，一面望着他们。身后是常春藤，阳光透过树叶，在她长长的蓝斗篷上洒下斑驳光影。她清新亲切的脸隔着满园绿意朝他们微笑，就像科林书里一幅色彩柔和的插图。那双非同寻常的眼睛满是慈爱，仿佛一眼收进了眼前的一切，包括所有孩子、本·威瑟斯塔夫、“动物们”和每一朵盛开的花。她来得这样突然，却没有谁觉得她闯进了不该来的地方。迪肯的双眼一下亮得像灯。
        - id: ch03-b04
          speaker: dickon
          text: “是妈妈！是俺妈妈！”
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: 迪肯飞跑过草地。科林也朝她走去，玛丽陪在身边。两个孩子的心都跳快了。
        - id: ch03-b06
          speaker: dickon
          text: “是妈妈！俺知道你们想见她，就把那扇门藏在哪儿告诉她啦。”
          emotion: happy
        - id: ch03-b07
          speaker: narrator
          text: 科林朝她伸出一只手。他的脸红红的，带着一种王子般的羞怯，一双眼睛却贪婪地望着她的脸，仿佛怎么看也看不够。
        - id: ch03-b08
          speaker: colin_craven
          text: “就连我生病时，也想见您。我想见您，见迪肯，也想见秘密花园。在那以前，我从来没想见过任何人，也没想看过任何东西。”
        - id: ch03-b09
          speaker: narrator
          text: 她一看见科林仰起的脸，自己的神情忽然变了。她的脸颊泛红，嘴角轻轻颤动起来，眼前仿佛也有一层水雾扫过。她像是根本没想到，自己会忽然说出下面的话。
        - id: ch03-b10
          speaker: mrs_sowerby
          text: “哎呀，亲爱的孩子！亲爱的孩子！”
        - id: ch03-b11
          speaker: narrator
          text: 她没有照规矩叫他“科林少爷”，只是忽然管他叫“亲爱的孩子”。若是她从迪肯脸上看见同样令她动容的神情，也会这样叫自己的儿子。科林很喜欢这个称呼。
        - id: ch03-b12
          speaker: colin_craven
          text: “您是不是没想到，我会这么健康？”
        - id: ch03-b13
          speaker: narrator
          text: 她把一只手放在他的肩上，朝他微笑。那一笑，仿佛也把眼里的水雾赶散了。
        - id: ch03-b14
          speaker: mrs_sowerby
          text: “当然没想到！可你太像你母亲了，我的心都猛地跳了一下。”
          emotion: surprised
        - id: ch03-b15
          speaker: colin_craven
          text: “您觉得，父亲会不会因为这样就喜欢我？”
        - id: ch03-b16
          speaker: mrs_sowerby
          text: “当然会，亲爱的孩子。他该回来了，他一定得回来。”
        - id: ch03-b17
          speaker: narrator
          text: 她说着，轻柔而迅速地拍了拍科林的肩。本·威瑟斯塔夫也走到近前，凑到她身旁。
        - id: ch03-b18
          speaker: ben_weatherstaff
          text: “苏珊·索尔比，你瞧瞧这孩子的腿。两个月前，还像袜子里插了两根鼓槌。别人又说它们向外弯，又说向里拐。现在你再瞧瞧！”
        - id: ch03-b19
          speaker: narrator
          text: 苏珊听完，发出一阵舒心而自在的笑声。那笑声听起来温暖极了。
        - id: ch03-b20
          speaker: mrs_sowerby
          text: “用不了多久，这就是一双结实漂亮的少年人的腿。让他继续在花园里玩、在花园里干活，好好吃饭，多喝香甜的牛奶。感谢上帝，到时候整个约克郡也找不出更好的两条腿。”
        - id: ch03-b21
          speaker: narrator
          text: 她又把双手放到玛丽肩上，像母亲一样仔细端详她的小脸。
        - id: ch03-b22
          speaker: mrs_sowerby
          text: “你也变啦！都快和我家伊丽莎白·埃伦一样壮实了。我敢说，你也会长得像你母亲。玛莎告诉我，梅德洛克太太听说她是个美人。等你长大，就会像一朵含羞的玫瑰。小姑娘，愿上帝保佑你。”
        - id: ch03-b23
          speaker: narrator
          text: 她没有说，玛莎休假回家，讲起这个面黄又不好看的孩子时，她根本不相信梅德洛克太太听来的话。当时她还固执地说，一个漂亮女人不可能生出这么难看的小姑娘，那根本说不通。玛丽自己一直没工夫仔细留意面容的变化，只知道看起来“不同了”，头发浓密了许多，也长得很快。想到从前看着母亲大人时的那份欢喜，她很高兴听说，自己有一天也可能长得像她。
    - id: ch04
      title: 创造快乐的那一位
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 苏珊陪孩子们走遍花园。他们把花园的整个故事讲给她听，又领她看每一丛重新生长的灌木和每一棵树。科林走在她一边，玛丽走在另一边，两个人总忍不住仰头看她红润安详的脸。他们暗暗好奇，她为什么能带来这样美妙的感觉。那感觉既温暖又踏实，仿佛有人稳稳托住了他们。她像迪肯理解动物一样理解孩子。她俯身和花儿说话，就像那些花也是孩子。煤烟一路跟着她，一两次朝她叫，还飞上她的肩，仿佛那是迪肯的肩膀。听说知更鸟教雏鸟第一次飞，她从喉间发出一阵温柔醇厚的、母亲般的轻笑。
        - id: ch04-b02
          speaker: mrs_sowerby
          text: “教小鸟飞，大概跟教孩子走路差不多。不过我的孩子要是长着翅膀，不长腿，我怕是整天都要担心。”
        - id: ch04-b03
          speaker: narrator
          text: 苏珊有种荒原小屋里养成的质朴，却又是那样了不起。孩子们终于把魔法的秘密也告诉了她。科林还讲了印度苦行僧的事。
        - id: ch04-b04
          speaker: colin_craven
          text: “您相信魔法吗？我真希望您相信。”
        - id: ch04-b05
          speaker: mrs_sowerby
          text: “当然相信，孩子。以前我不知道它叫这个名字，可名字有什么要紧？法国人有法国人的叫法，德国人也有德国人的叫法。让种子鼓起来，让太阳发光，又让你恢复健康的，本来就是同一样东西，是世间那股伟大的善意。它不像我们这些傻人，叫错名字便觉得不得了。它才不为名字发愁，只管不停创造千百万个世界，也创造我们这样的世界。你永远别停止相信它，要知道整个世界都充满了它。你爱叫它什么，就叫它什么。刚才我走进花园时，你们唱的就是它。”
        - id: ch04-b06
          speaker: colin_craven
          text: “我当时太快乐了。我忽然感觉到自己和从前多么不一样。我的胳膊和腿这么有力，我能挖土，也能站起来。我一下跳起身，真想朝随便什么愿意听的东西大喊。”
          emotion: happy
        - id: ch04-b07
          speaker: mrs_sowerby
          text: “你唱《赞美诗》时，魔法听见了。不管你唱什么，它都会听见。真正要紧的是那份快乐。哎呀，孩子，对于创造快乐的那一位，名字算得了什么？”
        - id: ch04-b08
          speaker: narrator
          text: 她又轻轻拍了拍科林的肩。那天早晨，她带来满满一篮食物，简直够摆一桌宴席。肚子饿的时候，迪肯把篮子从藏处取了出来。苏珊和他们一起坐在树下，看着孩子们把食物吃得干干净净。她见他们胃口这么好，笑眯眯地看了又看，简直满心得意。她风趣极了，用浓重的约克郡口音讲故事，教他们从没听过的新说法，又拿各种稀奇古怪的事逗得他们直笑。听说要装成科林还是个烦躁的病人已经越来越难，她更是笑得停不下来。
        - id: ch04-b09
          speaker: colin_craven
          text: “我们只要待在一起，几乎总忍不住笑。这听起来一点也不像有病。我们拼命把笑憋回去，它偏要冲出来，那声音反而更糟。”
        - id: ch04-b10
          speaker: mary_lennox
          text: “还有件事，我每次突然想起都快憋不住。要是科林的脸有一天变成满月，该怎么办？现在还不像，可他每天都胖一点。万一哪天早晨真的成了一轮满月，我们怎么办？”
        - id: ch04-b11
          speaker: mrs_sowerby
          text: “我的天，我看你们还得好好演一阵。不过不会演太久了，克雷文先生会回来的。”
        - id: ch04-b12
          speaker: colin_craven
          text: “您觉得他会回来？为什么？”
        - id: ch04-b13
          speaker: narrator
          text: 苏珊听见这个问题，仿佛早就知道答案似的，轻轻笑了起来。
        - id: ch04-b14
          speaker: mrs_sowerby
          text: “要是你还没照自己的法子告诉他，他就先知道了，你一定会伤心得不得了。你夜里躺着没睡，早把这件事盘算过好多遍了。”
        - id: ch04-b15
          speaker: colin_craven
          text: “我受不了让别人告诉他。我每天都想新的办法。现在我觉得，自己只想一口气跑进他的房间。”
        - id: ch04-b16
          speaker: mrs_sowerby
          text: “那可真会叫他大吃一惊。孩子，我真想看看他脸上的神情。他该回来了，他一定得回来。”
        - id: ch04-b17
          speaker: narrator
          text: 他们还谈起去苏珊的小屋做客的事，并把整趟行程都计划好了。孩子们要坐车穿过荒原，在石南丛中露天吃午饭，要见她的十二个孩子，也要看迪肯的花园，直到玩累才回来。最后，苏珊起身准备回宅子里见梅德洛克太太，科林也该坐上轮椅了。可他没有立刻坐下。他紧挨着苏珊站好，带着困惑的爱慕，定定望着她。忽然，他抓住蓝斗篷的一角，牢牢攥在手里。
        - id: ch04-b18
          speaker: colin_craven
          text: “您正是我一直想要的人。我真希望您也是我的母亲，不只是迪肯的母亲！”
        - id: ch04-b19
          speaker: narrator
          text: 苏珊听见这句话，立刻俯下身来。她用温暖的双臂把科林紧紧搂进蓝斗篷下的胸前，仿佛这个孩子本来就是迪肯的兄弟。那层来得很快的水雾，又一下蒙住了她的双眼。
        - id: ch04-b20
          speaker: mrs_sowerby
          text: “哎呀，亲爱的孩子！我相信，你自己的母亲就在这座花园里。她舍不得离开这里。你父亲一定得回到你身边，他一定得回来！”
