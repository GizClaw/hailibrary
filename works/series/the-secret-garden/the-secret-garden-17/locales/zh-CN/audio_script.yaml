audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
    nurse:
      display_name: 护士
      tts: {delivery: 直率刻薄，笑声里带着看热闹的轻快, timbre: 洪亮爽脆, pace: 中等偏快, pitch: 中音}
  chapters:
    - id: ch01
      title: 半夜里的哭喊
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 玛丽一大早就起了床，又在花园里卖力干活，到了晚上早已又累又困。玛莎送来晚饭，她吃完便上了床。脑袋刚挨到枕头，她还在盘算第二天的事。
        - id: ch01-b02
          speaker: mary_lennox
          text: “明天早饭前，我要先去跟迪肯干活。等干完了……我想……我会去看看科林。”
        - id: ch01-b03
          speaker: narrator
          text: 不知过了多久，一阵骇人的声音把玛丽惊醒。她一下跳下床，还以为已经到了深更半夜。那究竟是什么声音？很快，她便听明白了。走廊里，房门开了又关，人们急匆匆地来回奔跑。还有一个人在又哭又叫，声音凄厉得吓人。
        - id: ch01-b04
          speaker: mary_lennox
          text: “是科林。他又在闹护士说的那种歇斯底里了。听着真可怕。”
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: 那尖叫里夹着哭泣。玛丽听着，终于明白大家为什么宁可事事顺着科林，也不愿再听这种声音。她捂住耳朵，胃里难受，身上也不停发抖。
        - id: ch01-b06
          speaker: mary_lennox
          text: “我该怎么办？我一点办法也没有。我实在受不了了。”
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: 玛丽一度想去见他，说不定他看见她就会停下。可她又记起，早晨正是科林把她赶出了房间。也许她一出现，他反而闹得更厉害。她越用力捂耳朵，那声音越像是硬往里钻。玛丽又怕又恨，听着听着，火气忽然蹿了起来。她真想也大发一场脾气，让科林尝尝被人吓唬的滋味。她向来只习惯别人受自己的脾气，可没习惯受别人的。她猛地放下双手，跳起来跺脚。
        - id: ch01-b08
          speaker: mary_lennox
          text: “得叫他住口！总得有人逼他停下来！该有人揍他一顿！”
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: 这时，有人几乎一路跑过走廊，推门进来。是护士。她不笑了，脸色还有些发白。
        - id: ch01-b10
          speaker: nurse
          text: “他已经把自己闹得歇斯底里，再这样下去会伤到自己。我们谁都治不住他。好孩子，你去试试吧，他喜欢你。”
          emotion: fearful
        - id: ch01-b11
          speaker: mary_lennox
          text: “今天早晨，是他把我赶出来的。”
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: 玛丽气得又跺了一脚，护士见了反而高兴。她原先还怕玛丽会缩在被子里哭呢。
        - id: ch01-b13
          speaker: nurse
          text: “对，就是这股劲儿。你去骂他，叫他换件事情想。快去吧，越快越好！”
        - id: ch01-b14
          speaker: narrator
          text: 后来玛丽才觉得，这件事又可怕又好笑。一群大人全被吓坏了，最后竟来求一个小姑娘，只因为他们猜她跟科林一样难对付。玛丽飞奔过走廊。尖叫声越响，她的火气也越大。到了科林门口，她已经凶得什么都不怕了。她一掌推开门，冲到四柱床前。
    - id: ch02
      title: 玛丽也发了脾气
      blocks:
        - id: ch02-b01
          speaker: mary_lennox
          text: “住口！快住口！我讨厌你，大家都讨厌你！我真希望所有人都跑出这座宅子，让你一个人叫到死！再叫一会儿，你真的会把自己叫死。我巴不得你死！”
          emotion: angry
        - id: ch02-b02
          speaker: narrator
          text: 一个温柔体贴的孩子绝不会这样想，更不会这样说。可对科林偏偏最管用的，就是这一记迎头痛击。从来没有人敢管束他，也没有人敢反驳他。
        - id: ch02-b03
          speaker: narrator
          text: 科林原本趴着，两手一下下捶枕头。听到这个愤怒的小嗓门，他猛地转身，差点整个人弹起来。那张脸又白又红，已经肿了。他喘不上气，还直犯哽噎。可这时的玛丽凶巴巴的，一点也不心软。
        - id: ch02-b04
          speaker: mary_lennox
          text: “你敢再叫一声，我也叫！我比你叫得更响，我会把你吓坏！”
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: 科林真的不叫了。玛丽把他吓得太厉害，那声正要冲出来的尖叫险些噎住他。眼泪顺着他的脸往下流，他浑身都在发抖。
        - id: ch02-b06
          speaker: colin_craven
          text: “我停不下来！我真的停不下……停不下！”
          emotion: fearful
        - id: ch02-b07
          speaker: mary_lennox
          text: “你当然能！你的病有一半就是歇斯底里和坏脾气。全是歇斯底里！歇斯底里！歇斯底里！”
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: 玛丽每说一次“歇斯底里”，就用力跺一下脚。
        - id: ch02-b09
          speaker: colin_craven
          text: “我摸到那个包了，我真的摸到了！我早知道它会长出来。我的背会驼，然后我就会死。”
          emotion: fearful
        - id: ch02-b10
          speaker: narrator
          text: 科林又扭动起来，翻过去伏在床上。他哭着，哀号着，总算没有再尖叫。
        - id: ch02-b11
          speaker: mary_lennox
          text: “你根本没摸到包！就算你摸到了，那也是歇斯底里变出来的。歇斯底里就会变包。你那讨厌的背好得很，唯一的毛病就是歇斯底里！你翻过来，让我看看！”
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: 玛丽很喜欢“歇斯底里”这个词。她说不上为什么，可它好像真的能制住科林。他大概也跟玛丽一样，过去从没听过这个词。
        - id: ch02-b13
          speaker: mary_lennox
          text: “护士，你马上过来，把他的背给我看！”
        - id: ch02-b14
          speaker: narrator
          text: 护士、梅德洛克太太和玛莎都挤在门边，张着嘴看呆了。三个人已经吓得倒吸了好几次气。护士有些畏缩地走上前。科林还在剧烈抽噎，连气都喘不上来。
        - id: ch02-b15
          speaker: nurse
          text: “也许……也许他不肯让我给你看。”
          emotion: fearful
        - id: ch02-b16
          speaker: colin_craven
          text: “给……给她看！等她看过……她就知道了！”
          emotion: fearful
        - id: ch02-b17
          speaker: narrator
          text: 衣服揭开后，大家看见的是一副可怜而瘦弱的脊背。每一根肋骨、每一节脊椎都清清楚楚。玛丽没有去数。她弯下腰，板着那张严肃又凶狠的小脸仔细查看。她的神情乖戾又老气，护士只好转过头，藏住自己忍不住抽动的嘴角。房里静了下来，连科林也屏住了呼吸。玛丽沿着脊背从上看到下，又从下看到上，认真得像那位从伦敦来的名医。
        - id: ch02-b18
          speaker: mary_lennox
          text: “这里一个包也没有！连针尖那么大的都没有。你摸到的是脊梁骨本来的骨节，因为你太瘦，它们才会这么明显。我背上也有。从前我没有长胖，它们跟你的一样突出。现在我还没胖到能把它们全遮住。反正你这里连针尖大的包也没有！以后你再说有，我就要笑你！”
          emotion: angry
    - id: ch03
      title: 一个也没有的包
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这一番又生气、又孩子气的话，究竟怎样击中了科林，只有他自己知道。要是以前有人肯听他说出心底的恐惧，要是他敢开口问一问，要是身边有几个同龄伙伴，事情也许早就不同了。可他一直仰躺在这座又大又封闭的宅子里。周围的人又害怕又压抑，大多不明白他的病，也早已厌烦了他。科林就这样躺过一年又一年，整天只想自己的疼痛和疲倦。其实，他的恐惧和病痛大半是自己想出来的。如今，这个发着火、毫无同情心的小姑娘一口咬定，他没有自己想的那么虚弱。他第一次觉得，玛丽也许说对了。
        - id: ch03-b02
          speaker: nurse
          text: “我不知道他以为脊背上有个包。他的背没有力气，是因为他从来不肯试着坐起来。我要是知道，早就能告诉他，那里根本没有包。”
        - id: ch03-b03
          speaker: narrator
          text: 科林咽了咽喉咙，稍稍转过脸看着护士。
        - id: ch03-b04
          speaker: colin_craven
          text: “你……你真的能告诉我，那里没有包吗？”
          emotion: sad
        - id: ch03-b05
          speaker: nurse
          text: “是的，少爷。”
        - id: ch03-b06
          speaker: mary_lennox
          text: “你瞧，我说得没错吧！”
        - id: ch03-b07
          speaker: narrator
          text: 说这句话时，玛丽自己也咽了咽喉咙。科林重新伏在床上，安静了一会儿。方才那场痛哭正在过去，只剩断断续续的长喘。他的眼泪还是大颗大颗地流，把枕头都弄湿了。可这些泪水里，其实藏着一种从未有过的巨大宽慰。过了一会儿，他又转向护士。这次开口时，他一点也不像那个高高在上的王公。
        - id: ch03-b08
          speaker: colin_craven
          text: “你觉得……我能活到长大吗？”
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: 护士不算聪明，心肠也不柔软。不过，伦敦医生说过的话，她还记得几句。
        - id: ch03-b10
          speaker: nurse
          text: “你要是肯听吩咐，别再由着性子发脾气，还常常出去呼吸新鲜空气，多半可以活到长大。”
        - id: ch03-b11
          speaker: narrator
          text: 科林的脾气已经过去。他哭得浑身无力，也许正因为累坏了，人反而温和起来。他向玛丽伸出一点手。好在玛丽也不再生气，心跟着软了。她迎上去握住他的手。两只手在半路碰到一起，他们就这样和好了。
        - id: ch03-b12
          speaker: colin_craven
          text: “玛丽，我……我会跟你一起出去。要是我们能找到……我就不会讨厌新鲜空气。”
        - id: ch03-b13
          speaker: narrator
          text: 科林差点说出“找到秘密花园”，幸好及时收住了口。
        - id: ch03-b14
          speaker: colin_craven
          text: “要是迪肯肯来推我的椅子，我一定喜欢跟你一起出去。我太想看看迪肯了，还有那只狐狸和乌鸦。”
        - id: ch03-b15
          speaker: narrator
          text: 护士重新铺好被弄乱的床，把枕头抖松摆正。她煮了一杯牛肉茶给科林，也给了玛丽一杯。闹过这一场，玛丽喝到热茶，心里着实高兴。梅德洛克太太和玛莎如释重负，悄悄溜了出去。房里重新变得整洁安静，护士看起来也很想走。她身体健壮，最不高兴别人搅了自己的睡眠。这会儿，她毫不遮掩地打着哈欠。玛丽已经把大脚凳推到床边，坐下来握着科林的手。
        - id: ch03-b16
          speaker: nurse
          text: “你也该回去把觉睡足。他过一会儿就会睡着，只要没激动得太厉害。等他睡了，我也好去隔壁躺一躺。”
    - id: ch04
      title: 绿色的薄纱
      blocks:
        - id: ch04-b01
          speaker: mary_lennox
          text: “要不要我唱那首跟阿嬷学来的歌给你听？”
        - id: ch04-b02
          speaker: narrator
          text: 科林轻轻拉着玛丽的手，用疲倦的眼睛恳求地望着她。
        - id: ch04-b03
          speaker: colin_craven
          text: “好啊！那首歌听起来很柔和。我一会儿就能睡着。”
        - id: ch04-b04
          speaker: mary_lennox
          text: “我会哄他睡着的。你想走就走吧。”
        - id: ch04-b05
          speaker: narrator
          text: 玛丽这话是对那个还在打哈欠的护士说的。护士努力装出不大情愿的样子。
        - id: ch04-b06
          speaker: nurse
          text: “那好吧。半个小时以后，他要是还没睡，你一定得叫我。”
        - id: ch04-b07
          speaker: mary_lennox
          text: “好，我会叫你的。”
        - id: ch04-b08
          speaker: narrator
          text: 护士一眨眼就出了房间。她才走，科林又拉了一下玛丽的手。
        - id: ch04-b09
          speaker: colin_craven
          text: “刚才我差点说漏嘴，幸好及时停住了。我不再说话，也会好好睡觉。可是你说过，有好多有趣的事情要告诉我。你有没有……你觉得自己有没有找到一点进入秘密花园的办法？”
        - id: ch04-b10
          speaker: narrator
          text: 玛丽看看他疲惫的小脸，又看看那双哭肿的眼睛，心软了。
        - id: ch04-b11
          speaker: mary_lennox
          text: “有……我想，我已经发现了。你要是肯睡觉，我明天就告诉你。”
        - id: ch04-b12
          speaker: narrator
          text: 科林的手立刻颤抖起来。
        - id: ch04-b13
          speaker: colin_craven
          text: “哦，玛丽！要是我能走进去，我觉得自己一定能活到长大！你能不能先别唱阿嬷的歌？你像第一天那样，轻轻告诉我，你想象中花园里面是什么样子，好吗？听着你的话，我一定会睡着。”
          emotion: happy
        - id: ch04-b14
          speaker: mary_lennox
          text: “好。闭上眼睛。”
          emotion: calm
        - id: ch04-b15
          speaker: narrator
          text: 科林闭起眼睛，一动不动地躺好。玛丽握着他的手，放慢声音，轻轻讲了起来。
        - id: ch04-b16
          speaker: mary_lennox
          text: “我想，那里已经很久没人管了，所有花木全长到一起，乱蓬蓬的，可是美极了。玫瑰一直向上攀，攀呀，攀呀，攀呀。它们从树枝和墙上垂下来，又爬过地面，看着就像一层奇异的灰雾。有些玫瑰已经死了，不过还有很多活着。夏天一到，花园里会垂下一道道玫瑰花帘，还会涌出一股股玫瑰花泉。地底下一定到处都是水仙、雪花莲、百合和鸢尾。它们正在黑暗里往外钻。现在春天来了，也许……也许……”
          emotion: calm
        - id: ch04-b17
          speaker: narrator
          text: 她的声音低低的，柔柔的，像在轻轻嗡鸣。科林越来越安静。玛丽看见了，便继续往下讲。
        - id: ch04-b18
          speaker: mary_lennox
          text: “也许那些花正从草叶中间钻出来。说不定就在现在，紫色的番红花和金色的番红花已经一簇簇开了。也许嫩叶正在破芽，一点点舒展开来。也许那片灰色正在褪去，一层绿色的薄纱正悄悄爬过来，越爬越远，把所有地方都遮住。鸟儿也飞来看看，因为这里又安全，又安静。也许……也许……也许……那只知更鸟已经找到了伴儿，正在筑巢呢。”
          emotion: calm
        - id: ch04-b19
          speaker: narrator
          text: 玛丽最后几句话说得越来越轻，也越来越慢。科林已经睡着了。
