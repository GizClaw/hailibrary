audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    martha:
      display_name: Martha Sowerby
      tts:
        delivery: cheerful, candid, and easy in Yorkshire character
        timbre: bright and wholesome
        pace: lively
        pitch: medium-high
    colin:
      display_name: Colin Craven
      tts:
        delivery: commanding, fretful, and intensely curious
        timbre: delicate and clear
        pace: measured
        pitch: high
    mrs_medlock:
      display_name: Mrs. Medlock
      tts:
        delivery: brisk, anxious, and deferential under pressure
        timbre: firm and full
        pace: moderately brisk
        pitch: medium
    nurse:
      display_name: Colin's Nurse
      tts:
        delivery: practical, cautious, and easily flustered
        timbre: clear and youthful
        pace: moderately brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Screams in the Night
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Mary had risen very early and worked hard in the garden. By the time Martha brought her supper, she was tired and sleepy. She ate, gladly climbed into bed, and rested her head on the pillow.
        - id: ch01-b02
          speaker: mary
          text: >-
            I'll go out before breakfast and work with Dickon. Then afterward, I think I'll go see Colin.
        - id: ch01-b03
          speaker: narrator
          text: >-
            She woke believing it must be the middle of the night. The sounds were so dreadful that she jumped straight out of bed. Doors opened and slammed. Feet hurried through the corridors, and someone was crying and screaming at once. Mary knew who it was.
        - id: ch01-b04
          speaker: mary
          text: >-
            It's Colin. He's having one of those tantrums the nurse called hysterics. It sounds awful.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The crying and screaming went on and on. As Mary listened, she understood why everyone was so frightened of Colin's fits. They gave him whatever he wanted because they would do almost anything to keep from hearing that terrible noise. She clapped both hands over her ears. Still shivering, she began to feel sick.
        - id: ch01-b06
          speaker: mary
          text: >-
            I don't know what to do. I don't know what to do. I can't stand it.
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: >-
            For a moment she wondered whether he might stop if she went to him. Then she remembered how he had ordered her out that morning. Seeing her might only make him worse. She pressed her hands harder against her ears, but the screams still reached her.

            Mary hated the sound, and it frightened her so badly that her fear suddenly turned to anger. She wanted to throw a tantrum herself and frighten Colin the way he was frightening her. She knew no one's temper except her own. Now she tore her hands away, sprang up, and stamped one foot.
        - id: ch01-b08
          speaker: mary
          text: >-
            He has to stop! Someone should make him stop! Someone ought to beat him!
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: >-
            Running footsteps came down the corridor. Mary's door opened, and Colin's nurse hurried in. She was not laughing tonight. In fact, her face looked pale.
        - id: ch01-b10
          speaker: nurse
          text: >-
            He's worked himself into hysterics, and he'll hurt himself. None of us can manage him. Please come try. He likes you.
          emotion: fearful
        - id: ch01-b11
          speaker: mary
          text: >-
            He ordered me out of his room this morning!
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: >-
            Mary stamped again in her excitement. To her surprise, that seemed to please the nurse. The woman had hurried in afraid she would find Mary crying and hiding her head beneath the bedcovers. An angry Mary was exactly what she wanted instead.
        - id: ch01-b13
          speaker: nurse
          text: >-
            Good. You're in just the right temper. Go scold him and give him something else to think about. Hurry, child. Please!
        - id: ch01-b14
          speaker: narrator
          text: >-
            Only later did Mary understand how funny the dreadful situation had been. A house full of frightened grown-ups had come for help from one little girl, simply because they suspected she was nearly as bad as Colin.
    - id: ch02
      title: Mary Shouts Back
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Mary raced along the corridor. The closer she came to Colin's screams, the angrier she grew. By the time she reached his door, she felt almost wicked. She slapped it open and ran to the tall four-posted bed.
        - id: ch02-b02
          speaker: mary
          text: >-
            Stop it! Stop it! I hate you, and everybody hates you! I wish everyone would leave this house and let you scream yourself to death! You'll do it in another minute, and I wish you would!
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: >-
            A sweet, sympathetic child could never have said such things. Yet no one had ever dared to restrain Colin or talk back to him, and Mary's furious words gave him exactly the shock he needed.

            He had been lying facedown, pounding his pillow. At the sound of her voice, he turned so fast that he nearly jumped around. His swollen face was blotched red and white. He gasped and choked, but savage little Mary did not care at all.
        - id: ch02-b04
          speaker: mary
          text: >-
            If you scream one more time, I'll scream too! I can scream louder than you, and then I'll be the one who frightens you!
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: >-
            Colin had actually stopped screaming. Mary had startled him so completely that the next scream caught in his throat and nearly choked him. Tears poured down his face, and his whole body shook as he tried to catch his breath.
        - id: ch02-b06
          speaker: colin
          text: >-
            I can't stop! I can't. I can't!
          emotion: fearful
        - id: ch02-b07
          speaker: mary
          text: >-
            Yes, you can! Half of what's wrong with you is temper and hysterics. Hysterics! Hysterics! Hysterics!
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: >-
            She stamped her foot each time she said the word.
        - id: ch02-b09
          speaker: colin
          text: >-
            I felt the lump. I knew I would! I'll grow a hump on my back, and then I'll die!
          emotion: fearful
        - id: ch02-b10
          speaker: narrator
          text: >-
            He twisted around again, buried his face, and sobbed and wailed. But he did not scream.
        - id: ch02-b11
          speaker: mary
          text: >-
            You never felt a lump! If you felt anything, it was a hysterical lump. Hysterics makes lumps. There's nothing wrong with your horrid back except hysterics. Turn over and let me see it!
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: >-
            Mary liked the sound of the word “hysterics.” Somehow, it seemed to work on Colin. He was probably like her and had never heard it before.
        - id: ch02-b13
          speaker: mary
          text: >-
            Nurse, come here this instant and show me his back!
        - id: ch02-b14
          speaker: narrator
          text: >-
            The nurse, Mrs. Medlock, and Martha stood huddled near the door, staring with their mouths half open. None of them had expected Mary to face Colin this way. More than once, all three had gasped in fright. Now the nurse moved forward as if she were afraid, while Colin struggled for breath between great sobs.
        - id: ch02-b15
          speaker: nurse
          text: >-
            Perhaps he won't let me.
          emotion: fearful
        - id: ch02-b16
          speaker: colin
          text: >-
            Sh-show her! Then she'll see!
    - id: ch03
      title: Not a Single Lump
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            When the nurse uncovered Colin's back, it looked thin and pitiful. Every rib showed, and so did every joint of his spine. Mary did not count them. She bent close and studied him with a fierce, solemn little face. She looked so sour and old-fashioned that the nurse had to turn away and hide the twitch at the corner of her mouth.

            For one full minute, no one spoke. Even Colin tried to hold his breath as Mary examined his spine from top to bottom, then from bottom to top, as carefully as if she were the great doctor from London.
        - id: ch03-b02
          speaker: mary
          text: >-
            There isn't one single lump! Not even one as big as a pin. Those are only the little bumps of your backbone, and you can feel them because you're thin. I have them too. Mine used to stick out as much as yours before I began getting fatter, and I'm still not fat enough to hide them. There isn't a lump as big as a pin! If you ever claim there is again, I'll laugh at you!
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: >-
            Only Colin understood what those cross, childish words did for him. He had never had anyone he could ask about his secret fears. He had never talked them over with another child. Instead, he had spent years lying in the enormous closed house, surrounded by people who were frightened, ignorant, and tired of him.

            He lay on his back for hours, days, months, and years, thinking about himself. He thought about every ache and every moment of tiredness. If he had been able to ask his questions, he might have learned that much of his terror and illness came from his own thoughts. Now one stubborn, unsympathetic little girl insisted he was not nearly as sick as he believed. Because she insisted so firmly, Colin began to feel she might truly be right.
        - id: ch03-b04
          speaker: nurse
          text: >-
            I didn't know you thought there was a lump on your spine. Your back is weak because you won't try to sit up. I could have told you there wasn't any lump.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Colin swallowed hard and turned his face toward her.
        - id: ch03-b06
          speaker: colin
          text: >-
            Y-you could have?
        - id: ch03-b07
          speaker: nurse
          text: >-
            Yes, sir.
        - id: ch03-b08
          speaker: mary
          text: >-
            There! You see?
        - id: ch03-b09
          speaker: narrator
          text: >-
            Mary swallowed too. Colin turned facedown once more. His storm of sobbing slowly died away, leaving only long, broken breaths. For a full minute he lay still. Big tears continued to roll down his cheeks and soak the pillow, but they no longer meant only fear. A strange, enormous relief had come over him.

            After a while he looked at the nurse again. When he spoke, he did not sound like a Rajah at all.
        - id: ch03-b10
          speaker: colin
          text: >-
            Do you think I might live long enough to grow up?
        - id: ch03-b11
          speaker: narrator
          text: >-
            The nurse was neither clever nor tenderhearted, but she remembered what the London doctor had said.
        - id: ch03-b12
          speaker: nurse
          text: >-
            You probably will, if you do as you're told, stop giving in to your temper, and spend plenty of time outdoors in the fresh air.
        - id: ch03-b13
          speaker: narrator
          text: >-
            The tantrum was over. Colin was weak and exhausted from all his crying, and perhaps that was why he felt gentler now. He reached one hand a little way toward Mary. Her own anger had passed too. She softened and reached halfway to put her hand into his. It was their quiet way of making up.
        - id: ch03-b14
          speaker: colin
          text: >-
            I'll go outside with you, Mary. I won't hate the fresh air if we can find—
        - id: ch03-b15
          speaker: narrator
          text: >-
            He stopped just before saying “the secret garden.”
        - id: ch03-b16
          speaker: colin
          text: >-
            I'll like going out with you if Dickon comes and pushes my chair. I want so much to meet Dickon, and the fox, and the crow.
    - id: ch04
      title: The Garden Behind Closed Eyes
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The nurse remade the tumbled bed, shaking and straightening every pillow. Then she prepared a cup of beef tea for Colin and another for Mary. After all that excitement, Mary was truly glad to drink hers. Mrs. Medlock and Martha took the chance to slip quietly away, and they were glad to go.

            Soon everything was quiet and orderly. The nurse looked ready to slip away too. She was a healthy young woman, and she did not like losing her sleep. She yawned openly as she watched Mary pull the large footstool close to the bed and hold Colin's hand.
        - id: ch04-b02
          speaker: nurse
          text: >-
            You should go back to bed and finish your sleep. He'll drift off soon, unless he's still too upset. Then I can lie down in the next room.
        - id: ch04-b03
          speaker: mary
          text: >-
            Would you like me to sing the song I learned from my Ayah?
        - id: ch04-b04
          speaker: narrator
          text: >-
            Mary whispered the question. Colin gently tugged her hand and looked at her with tired, pleading eyes.
        - id: ch04-b05
          speaker: colin
          text: >-
            Oh, yes. It's such a soft song. I'll fall asleep in no time.
        - id: ch04-b06
          speaker: mary
          text: >-
            I'll get him to sleep. You may go if you want.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The nurse tried to sound reluctant.
        - id: ch04-b08
          speaker: nurse
          text: >-
            Well, if he isn't asleep in half an hour, you must call me.
        - id: ch04-b09
          speaker: mary
          text: >-
            All right.
        - id: ch04-b10
          speaker: narrator
          text: >-
            The nurse was gone within a minute. As soon as the door closed behind her, Colin pulled Mary's hand once more.
        - id: ch04-b11
          speaker: colin
          text: >-
            I almost said it, but I caught myself in time. I won't keep talking, and I will go to sleep. But you said you had so many good things to tell me. Have you found out anything at all about how to get into the secret garden?
        - id: ch04-b12
          speaker: narrator
          text: >-
            Mary looked at his tired little face and his swollen eyes. Her heart softened.
        - id: ch04-b13
          speaker: mary
          text: >-
            Y-yes. I think I have. If you go to sleep now, I'll tell you tomorrow.
        - id: ch04-b14
          speaker: narrator
          text: >-
            Colin's hand trembled in hers.
        - id: ch04-b15
          speaker: colin
          text: >-
            Oh, Mary! If I could get inside, I think I would live to grow up! Instead of the Ayah song, could you tell me softly what you imagine the garden looks like? The way you did that first day? I'm sure that would send me to sleep.
        - id: ch04-b16
          speaker: mary
          text: >-
            Yes. Close your eyes.
        - id: ch04-b17
          speaker: narrator
          text: >-
            Colin shut his eyes and lay perfectly still. Mary kept hold of his hand. Then she began in a very slow, low voice.
        - id: ch04-b18
          speaker: mary
          text: >-
            I think it has been alone for so long that everything has grown into a beautiful tangle. The roses must have climbed and climbed until they hang from the branches and the walls. They creep across the ground too, almost like a strange gray mist. Some have died, but many are still alive. When summer comes, there will be curtains of roses and fountains of roses.

            I think the earth is full of daffodils and snowdrops and lilies and irises, all pushing up out of the dark. Spring has started now, so perhaps... perhaps...
        - id: ch04-b19
          speaker: narrator
          text: >-
            The soft hum of Mary's voice made Colin more still with every word. She noticed and continued.
        - id: ch04-b20
          speaker: mary
          text: >-
            Perhaps they're coming through the grass. There may be bunches of purple crocuses and golden ones, even now. Perhaps the leaves are beginning to open and uncurl. Perhaps the gray is changing, and a veil of green gauze is creeping over everything. The birds are coming to see it because the garden is so safe and quiet. And perhaps... perhaps... perhaps... the robin has found a mate and is building a nest.
        - id: ch04-b21
          speaker: narrator
          text: >-
            And Colin was asleep.
