audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    martha:
      display_name: Martha
      tts:
        delivery: good-natured, candid, and broad in Yorkshire character
        timbre: rosy and sturdy
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Inside the Secret Garden
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            It was the sweetest, most mysterious place Mary could have imagined. High walls shut it in, and thick, leafless rose stems covered those walls in a tangled mat. Mary knew they were roses because she had seen so many in India. Wintry brown grass covered the ground. Clumps of bushes rose through it, and if they were still alive, they had to be rosebushes. Other roses stood like little trees, with branches spreading wide.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Roses had climbed over the other trees, too. Long tendrils hung down like light curtains and swayed in the air. Here and there, one had caught another tendril or fastened itself to a branch reaching far out. Some had crept all the way from one tree to the next, making lovely bridges overhead. There were no leaves or flowers now. Mary couldn't tell whether anything was alive. Thin gray and brown branches lay over the walls, the trees, and even the brown grass where they had fallen loose and traveled along the ground. They covered everything like a hazy mantle. That tangle, drifting from tree to tree, made the whole place mysterious. Mary had always believed a garden left alone for ten years must be unlike any garden people still cared for. She was right. She had never seen another place like this in her life.
        - id: ch01-b03
          speaker: mary
          text: How still it is. So very still.
        - id: ch01-b04
          speaker: narrator
          text: >-
            She stopped and listened. The robin had flown to the top of a tree, but now he was as still as the garden. He didn't even move his wings. He simply sat there and watched her.
        - id: ch01-b05
          speaker: mary
          text: >-
            Of course it's quiet. I'm the first person to speak in here for ten years.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Mary stepped away from the door as softly as if someone might be sleeping nearby. She was glad the grass made no sound beneath her feet. Under one of the pale gray arches between the trees, she looked up at the sprays and curling stems woven overhead.
        - id: ch01-b07
          speaker: mary
          text: >-
            Are they all dead? Is the whole garden dead? Oh, I hope it isn't.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Ben Weatherstaff would have known whether the wood was alive just by looking. Mary couldn't. She saw only bare gray and brown stems, without a single tiny leaf bud anywhere. But she was inside the wonderful garden. She could slip through the ivy-covered door whenever she wished. It felt as though she had found a whole world that belonged only to her.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Sunlight filled the space inside the four walls. Above this one small piece of Misselthwaite, the high arch of blue sky seemed softer and brighter than the sky over the moor. The robin flew down from his treetop and followed Mary. Sometimes he hopped along. Sometimes he fluttered after her from one bush to another. He chirped a great deal and looked very busy, almost as if he were showing her each part of the garden. Everything was strange and silent. Mary felt hundreds of miles from everyone, yet somehow she wasn't lonely at all. Only one thing troubled her. She wanted to know if the roses had survived and might grow leaves and buds when warmer weather came. She couldn't bear the thought of a completely dead garden. If it came alive, how wonderful it would be. Thousands of roses would bloom on every side.
    - id: ch02
      title: Signs of Life
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Mary's skipping rope still hung over her arm. After exploring for a while, she decided to skip around the whole garden and stop whenever something caught her eye. Faint grass paths wound through it. In a few corners, evergreens formed little alcoves around stone seats or tall flower urns covered with moss.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Near the second alcove, Mary stopped skipping. An old flower bed lay there, and something seemed to be poking through the dark earth. She saw several sharp little points of pale green. Remembering what Ben Weatherstaff had told her, she knelt for a closer look.
        - id: ch02-b03
          speaker: mary
          text: >-
            They are tiny growing things. They might be crocuses, or snowdrops, or daffodils.
        - id: ch02-b04
          speaker: narrator
          text: >-
            She bent until her face was close to the ground and breathed in the fresh smell of damp soil. She liked it very much.
        - id: ch02-b05
          speaker: mary
          text: >-
            There may be more coming up somewhere else. I'll search the whole garden.
        - id: ch02-b06
          speaker: narrator
          text: >-
            This time she walked instead of skipping. Slowly, with her eyes fixed on the ground, she searched the old borders and the grass. She went all the way around and tried not to miss a thing. Soon she had found many more of those sharp green points, and her excitement grew with every one.
        - id: ch02-b07
          speaker: mary
          text: >-
            The garden isn't completely dead! Even if the roses have died, other things are alive.
          emotion: happy
        - id: ch02-b08
          speaker: narrator
          text: >-
            Mary knew nothing about gardening. Still, the grass around some of the new shoots looked so thick that there hardly seemed room for them to grow. She searched until she found a pointed piece of wood. Then she knelt and dug away the weeds and grass, leaving a neat, open patch around each shoot.
        - id: ch02-b09
          speaker: mary
          text: >-
            There. Now they look as if they can breathe. I'll clear as many as I can see. If I can't finish today, I'll come back tomorrow.
        - id: ch02-b10
          speaker: narrator
          text: >-
            She moved from place to place, digging and pulling weeds. She enjoyed herself so much that one flower bed led her to the next, and then out into the grass beneath the trees. She kept finding another shoot that needed space, so she kept working. The exercise made her warmer and warmer. First she threw off her coat. Then she took off her hat. She had no idea how long she had been there, and she didn't notice what her own face was doing. All the while, she was smiling down at the grass and the pale green points.
        - id: ch02-b11
          speaker: narrator
          text: >-
            The robin was tremendously busy, too. He was delighted to see gardening begin on his own estate. He had often wondered why Ben Weatherstaff worked the soil, but digging always turned up delicious things to eat. Now this new creature, not half Ben's size, had shown enough sense to enter his garden and start at once.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Mistress Mary worked in her garden until it was time for her midday dinner. In fact, she was late because she had almost forgotten about it. At last she put on her coat and hat and picked up the skipping rope. She could hardly believe she had spent two or three hours at work. She had been truly happy every moment. All around her, dozens and dozens of pale green points stood in the little spaces she had cleared. They looked twice as cheerful now that the thick grass and weeds were no longer smothering them.
        - id: ch02-b13
          speaker: mary
          text: >-
            I'll come back this afternoon.
        - id: ch02-b14
          speaker: narrator
          text: >-
            She looked around her new kingdom and spoke to the trees and rosebushes as if they could hear. Then she ran lightly over the grass, pushed the slow old door open, and slipped beneath the ivy. By dinnertime her cheeks were red, her eyes were bright, and her appetite made Martha beam.
    - id: ch03
      title: Bulbs Beneath the Earth
      blocks:
        - id: ch03-b01
          speaker: martha
          text: >-
            Two pieces of meat and two helpings of rice pudding! Eh, Mother will be pleased when I tell her what that skipping rope has done for thee.
          emotion: happy
        - id: ch03-b02
          speaker: narrator
          text: >-
            While digging with her pointed stick, Mary had uncovered a white root shaped a little like an onion. She had carefully put it back and patted the earth over it. Now she wondered whether Martha knew what it was.
        - id: ch03-b03
          speaker: mary
          text: >-
            Martha, what are those white roots that look like onions?
        - id: ch03-b04
          speaker: martha
          text: >-
            They're bulbs. Lots of spring flowers grow from them. The tiny bulbs make snowdrops and crocuses. Bigger ones make narcissus, jonquils, and daffydowndillies. The biggest make lilies and purple flags. Eh, they're lovely. Dickon has a great many planted in our garden.
        - id: ch03-b05
          speaker: mary
          text: >-
            Does Dickon know everything about them?
        - id: ch03-b06
          speaker: martha
          text: >-
            Our Dickon could coax a flower right out of a brick path. Mother says he only has to whisper, and things come up from the ground.
        - id: ch03-b07
          speaker: mary
          text: >-
            Can bulbs live for years and years without anyone caring for them?
        - id: ch03-b08
          speaker: martha
          text: >-
            Aye, they look after themselves. That's why poor people can keep them. Leave most bulbs alone and they'll go on working under the earth for a lifetime. They'll spread and grow little bulbs of their own. There's a place in the park woods with thousands of snowdrops. When spring comes, they're the prettiest sight in all Yorkshire, and nobody knows how long ago they were planted.
        - id: ch03-b09
          speaker: mary
          text: >-
            I wish spring would come now. I want to see everything that grows in England.
        - id: ch03-b10
          speaker: narrator
          text: >-
            After dinner, Mary settled into her favorite place on the hearth rug.
        - id: ch03-b11
          speaker: mary
          text: >-
            I wish... I wish I had a little spade.
        - id: ch03-b12
          speaker: martha
          text: >-
            Whatever would tha do with a spade? Is tha planning to start digging? I'll have to tell Mother about that, too.
        - id: ch03-b13
          speaker: narrator
          text: >-
            Mary stared into the fire and thought carefully. If her secret kingdom was going to stay secret, she had to watch what she said. She wasn't hurting anything. But if Mr. Craven learned that the door was open, he would be terribly angry. He might find another key and lock it forever. Mary couldn't bear that.
        - id: ch03-b14
          speaker: mary
          text: >-
            This place is so big and lonely. The house is lonely, the park is lonely, and the gardens are lonely. So much of it is shut away. I didn't do much in India, but at least there were people to watch. Natives passed by, and soldiers marched past. Sometimes bands played, and my Ayah told me stories. Here, I have no one to talk to but you and Ben Weatherstaff. You have work to do, and he hardly ever speaks to me. With a little spade, I could dig the way he does. Maybe he'd give me seeds, and I could make a small garden.
        - id: ch03-b15
          speaker: narrator
          text: Martha's whole face brightened.
        - id: ch03-b16
          speaker: martha
          text: >-
            There now! That's just what Mother said. She said, "That great place has so much room. Why don't they give the child a patch of her own? Even if she plants nothing but parsley and radishes, she could dig and rake and be properly happy over it." Those were her very words.
        - id: ch03-b17
          speaker: mary
          text: >-
            Were they? Your mother knows a great many things, doesn't she?
        - id: ch03-b18
          speaker: martha
          text: >-
            Eh, Mother says a woman who raises twelve children learns more than her ABCs. Children teach thee things as surely as arithmetic does.
        - id: ch03-b19
          speaker: mary
          text: >-
            What would a little spade cost?
        - id: ch03-b20
          speaker: martha
          text: >-
            Well, there are a few shops in Thwaite village. I once saw a little garden set there, with a spade, rake, and fork all tied together. It cost two shillings, and the tools looked strong enough to use.
        - id: ch03-b21
          speaker: mary
          text: >-
            I have more than that in my purse. Mrs. Morrison gave me five shillings, and Mrs. Medlock gave me money from Mr. Craven.
        - id: ch03-b22
          speaker: martha
          text: >-
            He remembered thee enough to do that?
          emotion: surprised
        - id: ch03-b23
          speaker: mary
          text: >-
            Mrs. Medlock says I'm to have one shilling every week. She gives it to me on Saturdays, but I never knew what to buy.
        - id: ch03-b24
          speaker: martha
          text: >-
            My word, that's a fortune! Tha can buy anything tha likes. Our cottage rent is only one shilling and threepence, and finding even that is like pulling teeth. Wait. I've just had an idea.
        - id: ch03-b25
          speaker: narrator
          text: Martha planted her hands on her hips.
        - id: ch03-b26
          speaker: mary
          text: What is it?
    - id: ch04
      title: A Letter to Dickon
      blocks:
        - id: ch04-b01
          speaker: martha
          text: >-
            The shop in Thwaite sells packets of flower seeds for a penny each. Dickon knows which ones are prettiest and which are easiest to grow. He walks to Thwaite often, just because he likes the walk. Can tha print letters?
        - id: ch04-b02
          speaker: narrator
          text: The question came so suddenly that Mary blinked.
        - id: ch04-b03
          speaker: mary
          text: I know how to write.
        - id: ch04-b04
          speaker: narrator
          text: Martha shook her head.
        - id: ch04-b05
          speaker: martha
          text: >-
            Dickon can only read printing. If tha can print, we could send him a letter. We could ask him to buy the garden tools and the seeds together.
        - id: ch04-b06
          speaker: mary
          text: >-
            Oh, you are a good girl! You truly are. I never knew you could be so nice. I think I can print if I try. Let's ask Mrs. Medlock for a pen, ink, and paper.
          emotion: happy
        - id: ch04-b07
          speaker: martha
          text: >-
            I've got my own. I bought them so I could print a bit of a letter to Mother on Sundays. I'll fetch them.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Martha hurried out. Mary stayed beside the fire, twisting her thin hands together because she was so pleased.
        - id: ch04-b09
          speaker: mary
          text: >-
            If I have a spade, I can soften the earth and dig out the weeds. If I have seeds and make flowers grow, the garden won't be dead. It will come alive.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Mary never returned outdoors that afternoon. Martha came back with the pen, ink, and paper, but she couldn't sit down yet. She had to clear the table and carry the plates and dishes downstairs. When she reached the kitchen, Mrs. Medlock was there and sent her to do something else. Mary waited and waited. To her, Martha seemed to be gone for a very long time. Even after she returned, writing to Dickon was serious work. Mary's governesses had disliked her so much that none of them stayed long, and she had learned very little. She couldn't spell particularly well. Still, when she tried carefully, she found she could print the letters. Martha stood by and told her exactly what to write.
        - id: ch04-b11
          speaker: martha
          text: >-
            My dear Dickon, I hope this finds you well, as it leaves me. Miss Mary has plenty of money. Will you please go to Thwaite and buy her some flower seeds and a set of tools for making a flower bed? Choose the prettiest seeds that are easy to grow, because she has never gardened before and India is very different. Give my love to Mother and all the others. Miss Mary is going to tell me more about India. On my next day home, I'll tell you about elephants and camels and gentlemen hunting lions and tigers. Your loving sister, Martha Phoebe Sowerby.
        - id: ch04-b12
          speaker: martha
          text: >-
            We'll put the money inside the envelope. Then I'll ask the butcher's boy to take it in his cart. He and Dickon are great friends.
        - id: ch04-b13
          speaker: mary
          text: >-
            But how will I get the things after Dickon buys them?
        - id: ch04-b14
          speaker: martha
          text: >-
            He'll bring them himself. He enjoys walking over this way.
        - id: ch04-b15
          speaker: mary
          text: >-
            Oh! Then I'll meet him! I never thought I would actually see Dickon.
          emotion: surprised
        - id: ch04-b16
          speaker: martha
          text: Does tha want to meet him?
        - id: ch04-b17
          speaker: narrator
          text: Mary looked so pleased that Martha had to ask.
        - id: ch04-b18
          speaker: mary
          text: >-
            Yes. I've never met a boy that foxes and crows love. I want very much to see him.
        - id: ch04-b19
          speaker: narrator
          text: >-
            Martha gave a little start. She had suddenly remembered something.
        - id: ch04-b20
          speaker: martha
          text: >-
            Just think of me forgetting! I meant to tell thee first thing this morning. I asked Mother, and she said she'd speak to Mrs. Medlock herself.
        - id: ch04-b21
          speaker: mary
          text: Do you mean...?
        - id: ch04-b22
          speaker: martha
          text: >-
            What I mentioned on Tuesday. Mother will ask if tha can ride over to our cottage one day. Tha could have some of her hot oatcake with butter and a glass of milk.
        - id: ch04-b23
          speaker: narrator
          text: >-
            It seemed that every interesting thing possible was happening in a single day. Mary imagined crossing the moor in daylight beneath a blue sky. She imagined stepping into the cottage where twelve children lived.
        - id: ch04-b24
          speaker: mary
          text: >-
            Does your mother truly think Mrs. Medlock will let me go?
        - id: ch04-b25
          speaker: narrator
          text: She asked with real anxiety.
        - id: ch04-b26
          speaker: martha
          text: >-
            Aye, she believes so. Mrs. Medlock knows Mother is respectable and keeps our cottage clean.
        - id: ch04-b27
          speaker: mary
          text: >-
            If I went, I would meet your mother as well as Dickon. She doesn't sound like the mothers I knew in India.
    - id: ch05
      title: The Cry in the Corridor
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The work in the garden and all the afternoon's excitement finally left Mary quiet and thoughtful. Martha stayed with her until teatime. For once, neither of them needed to keep talking. They sat together in a comfortable silence and exchanged only a few words. Then, just before Martha went downstairs to bring up the tea tray, Mary thought of the sound she had heard while waiting and asked a question.
        - id: ch05-b02
          speaker: mary
          text: >-
            Martha, did the scullery maid have another toothache today?
        - id: ch05-b03
          speaker: narrator
          text: Martha gave a small but unmistakable start.
        - id: ch05-b04
          speaker: martha
          text: Why would tha ask me that?
        - id: ch05-b05
          speaker: mary
          text: >-
            I waited so long for you that I opened the door and went down the corridor to see if you were coming. I heard that faraway crying again, just like the other night. There was no wind today, so it couldn't have been the wind.
        - id: ch05-b06
          speaker: martha
          text: >-
            Eh, tha mustn't wander through the corridors listening. If Mr. Craven found out, he'd be so angry there's no telling what he might do.
        - id: ch05-b07
          speaker: mary
          text: >-
            I wasn't listening. I was only waiting for you, and then I heard it. That makes three times.
        - id: ch05-b08
          speaker: martha
          text: >-
            My word, that's Mrs. Medlock's bell!
        - id: ch05-b09
          speaker: narrator
          text: Martha almost ran from the room.
        - id: ch05-b10
          speaker: mary
          text: >-
            This is the strangest house anyone ever lived in.
        - id: ch05-b11
          speaker: narrator
          text: >-
            Mary spoke drowsily and let her head sink against the cushioned armchair. Fresh air, digging, and skipping rope had made her comfortably tired. A moment later, she was asleep.
