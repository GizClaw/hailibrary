audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 克制而敏锐，带一点不动声色的讽意
        timbre: 温暖清晰
        pace: 舒缓中有变化
        pitch: 中音
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts:
        delivery: 任性强硬，话说得短而直接
        timbre: 稚嫩而尖细
        pace: 偏快
        pitch: 偏高
    martha:
      display_name: 玛莎
      tts:
        delivery: 爽朗质朴，带着亲切而浓重的约克郡乡音
        timbre: 年轻明亮而结实
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 活着的花园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这是一个可爱得叫人心软，又神秘得叫人屏住呼吸的地方。四面的高墙上爬满玫瑰。它们没有叶子，光秃秃的茎密密纠缠着。玛丽在印度见过许多玫瑰，所以认得出来。地上的草全是冬天的枯黄色，草里立着一丛丛灌木。只要那些灌木还活着，就一定也是玫瑰。有些树状玫瑰伸开枝条，已经长得像小树一样。
        - id: ch01-b02
          speaker: narrator
          text: 园里真正的树也让玫瑰爬满了。长长的藤蔓垂下来，像一道道轻轻晃动的帘子。有的藤蔓彼此勾住，有的攀住远远伸出的树枝，从一棵树牵到另一棵树，搭成秀美的桥。如今上面没有一片叶子，也没有一朵花。玛丽不知道它们究竟是死是活。灰色和褐色的细枝像一层朦胧的披纱，罩住墙、树和枯草。还有些枝条从原来攀附的地方掉下来，沿着地面继续往前爬。正是这片从树间牵到树间的乱枝，让整座花园显得那么神秘。玛丽早就猜到，一座独自荒废了十年的花园，一定不像有人照料的花园。现在她亲眼看见了。它果然不同于她一生见过的任何地方。
        - id: ch01-b03
          speaker: mary_lennox
          text: “这里真安静。太安静了。”
        - id: ch01-b04
          speaker: narrator
          text: 玛丽停下来，听着这片寂静。知更鸟已经飞到树梢，也安安静静的，连翅膀都不动，只坐在那里望着她。
        - id: ch01-b05
          speaker: mary_lennox
          text: “难怪会这么安静。十年里，我是第一个在这里开口的人。”
        - id: ch01-b06
          speaker: narrator
          text: 她离开门边，每一步都放得很轻，像是怕吵醒什么人。幸好脚下有草，一点脚步声也没有。她穿过树间那座仙境般的灰色拱门，抬头看着头顶交织的细枝和藤蔓。
        - id: ch01-b07
          speaker: mary_lennox
          text: “它们不会全死了吧？难道整座花园都死了吗？我真不希望这样。”
        - id: ch01-b08
          speaker: narrator
          text: 要是换成本·韦瑟斯塔夫，只看木头就知道枝条还活不活。玛丽却只看见灰灰褐褐的一片，四周连一枚小叶芽都找不到。可她已经站在这座奇妙的花园里面了。以后随时都能从常春藤下的门进来。她仿佛找到了一个只属于自己的世界。
        - id: ch01-b09
          speaker: narrator
          text: 阳光照进四面高墙。米塞尔斯韦特的这一小块地方上空，蓝天高高拱起，比荒原上的天空更加明亮柔和。知更鸟从树梢飞下来，一会儿在地上跳，一会儿跟着玛丽从这丛灌木飞到那丛。它不停地啾啾叫，显得忙忙碌碌，像是在领她看一样样东西。周围的一切陌生又寂静，玛丽仿佛离所有人都有几百英里远，可她一点也不孤单。她只想知道玫瑰是不是全死了。也许还有几株活着，等天气渐渐暖和，就能抽出叶子和花苞。她不愿这是一座彻底死去的花园。要是整座花园还活着，四面开出成千上万朵玫瑰，那该多奇妙。
    - id: ch02
      title: 泥土里的嫩芽
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 跳绳还搭在玛丽胳膊上。走了一阵，她决定绕花园跳一圈，遇到想看的东西就停下。园里各处原先似乎铺着几条草径。一个两个角落里还有常青树围成的小窝，里面摆着石凳，或是高高的、长满青苔的花钵。
        - id: ch02-b02
          speaker: narrator
          text: 到了第二个小窝，玛丽停住了。那里从前有一方花坛，黑土里冒出几枚尖尖的淡绿色小芽。她想起本说过的话，赶紧跪下去看。
        - id: ch02-b03
          speaker: mary_lennox
          text: “没错，是刚长出来的小东西。也许是番红花，也许是雪花莲，或者是水仙。”
        - id: ch02-b04
          speaker: narrator
          text: 她凑到嫩芽跟前，闻见湿泥土清新的气味，心里喜欢极了。
        - id: ch02-b05
          speaker: mary_lennox
          text: “别的地方说不定也有。我得把整座花园都找一遍。”
        - id: ch02-b06
          speaker: narrator
          text: 她不再跳了，只慢慢往前走，眼睛始终盯着地面。旧花坛的边沿、草丛里，她一处也不肯漏掉。绕完一圈，她找到了许许多多淡绿色的小尖芽，又兴奋起来。
        - id: ch02-b07
          speaker: mary_lennox
          text: “花园没有全死！就算玫瑰死了，也还有别的东西活着。”
          emotion: happy
        - id: ch02-b08
          speaker: narrator
          text: 玛丽不懂园艺，可有些地方的草太密了，把嫩芽挤得没有生长的余地。她找到一块尖木片，跪下来挖土，把杂草和草根清掉，给每簇嫩芽留出一小圈干净的泥土。
        - id: ch02-b09
          speaker: mary_lennox
          text: “这样它们就能喘气了。我要把看得见的全都清理好。今天做不完，我明天再来。”
        - id: ch02-b10
          speaker: narrator
          text: 她从一处忙到另一处，一路挖过花坛，又挖到树下的草地，快活得停不下来。活动让她浑身越来越暖。她先脱了外套，接着又摘掉帽子，自己还没发觉脸上一直带着笑。知更鸟也忙得不得了。自己的领地终于有人开始做园艺，它可满意了。它过去常常弄不懂本·韦瑟斯塔夫是怎么想的，因为只要有人翻土，各种好吃的小东西就会跟着泥土出来。这个新来的小生物还不到本的一半高，却一进花园便知道开工，实在颇有见识。
        - id: ch02-b11
          speaker: narrator
          text: 玛丽一直干到该吃午饭时才想起来。其实，想起来的时候已经有点迟了。她戴好帽子，穿上外套，拿起跳绳，简直不敢相信已经过了两三个小时。几十又几十枚小芽露在一小片一小片清理干净的泥土中，比被野草和杂草压得喘不过气时精神了一倍。而她这几个小时里，竟一直真心快活。
        - id: ch02-b12
          speaker: mary_lennox
          text: “下午我还会回来。”
        - id: ch02-b13
          speaker: narrator
          text: 她环顾自己的新王国，这句话是说给树木和玫瑰听的，仿佛它们真的听得懂。随后，她轻快地跑过草地，推开那扇转动迟缓的旧门，从常春藤下溜出去。回到宅子时，她脸颊红红的，眼睛亮亮的，午饭也吃得特别香。玛莎看见她这副模样，心里欢喜极了。
        - id: ch02-b14
          speaker: martha
          text: “两片肉，两份米布丁！哎呀，等我告诉妈妈，这根跳绳给你带来了多大变化，她准会高兴。”
          emotion: happy
    - id: ch03
      title: 一把小铲子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 玛丽用尖木片挖土时，曾经翻出一种白色的根，形状很像洋葱。她当时没有伤它，把它放回原来的位置，又仔细拍好上面的泥土。现在，她忽然想起玛莎也许知道那究竟是什么。
        - id: ch03-b02
          speaker: mary_lennox
          text: “玛莎，那些长得像洋葱的白根，到底是什么？”
        - id: ch03-b03
          speaker: martha
          text: “那叫球茎。好多春天开的花都从球茎里长出来。小的是雪花莲和番红花，大一点的是水仙、长寿水仙，还有黄水仙。最大的会长出百合和紫鸢尾。那些花可美啦。我们迪肯就在自家小园子里种了一大堆。”
        - id: ch03-b04
          speaker: mary_lennox
          text: “迪肯很懂这些花吗？”
        - id: ch03-b05
          speaker: martha
          text: “我们迪肯连砖铺的路上都能叫花长出来。妈妈说，他朝土里说几句悄悄话，花就会冒头。”
        - id: ch03-b06
          speaker: mary_lennox
          text: “球茎能活很多年吗？一直没人照料，它们也能活下去吗？”
        - id: ch03-b07
          speaker: martha
          text: “它们自己会照料自己，所以穷人也种得起。只要你别去扰它们，大多数都能在地底下忙活一辈子。它们会越长越多，还会生出一个个小球茎。庄园树林里有个地方，长着成千上万株雪花莲。春天一到，那是全约克郡最美的景色。谁也不知道它们最早是哪年种下的。”
        - id: ch03-b08
          speaker: mary_lennox
          text: “真希望春天马上就来。我想看看英国长出来的所有东西。”
        - id: ch03-b09
          speaker: narrator
          text: 玛丽已经吃完了午饭，又走到壁炉旁，在自己最喜欢的那一块壁炉毯上坐下来。
        - id: ch03-b10
          speaker: mary_lennox
          text: “我真想要一把小铲子。”
        - id: ch03-b11
          speaker: martha
          text: “你要铲子做什么？难道你也打算挖土？这件事我也得讲给妈妈听。”
        - id: ch03-b12
          speaker: narrator
          text: 玛丽望着炉火，安静地盘算了一会儿。她想守住自己的秘密王国，就必须处处小心。她明明没有做坏事，可克雷文先生要是发现那扇门已经打开，一定会大发雷霆。他会另配一把钥匙，把花园永远锁住。玛丽实在受不了那样的事。
        - id: ch03-b13
          speaker: mary_lennox
          text: “这里又大又寂寞。宅子、庄园和花园，到处都很寂寞，好像许多地方全关着。我在印度也没做过多少事，可总有人可以看。有当地人，有列队经过的士兵，有时还有乐队。奶妈也会给我讲故事。这里除了你和本·韦瑟斯塔夫，没有人跟我说话。你得做自己的活，本又不肯常常理我。要是有把小铲子，我就能像他一样，随便找个地方挖土。要是他肯给我一点种子，我还能做一个小花园。”
        - id: ch03-b14
          speaker: narrator
          text: 玛莎的脸一下亮了。
        - id: ch03-b15
          speaker: martha
          text: “妈妈也说过这件事！她说，这么大的庄园，空地方有的是，怎么不分一小块给你自己种？哪怕什么都不种，只种欧芹和萝卜也好。你只管在那里挖土、耙地，准能从心里快活起来。她说的就是这些，一字不差。”
        - id: ch03-b16
          speaker: mary_lennox
          text: “她真的这么说？她懂的事情真多。”
        - id: ch03-b17
          speaker: martha
          text: “妈妈说，一个女人养大十二个孩子，学会的可不止字母表。孩子就像算术题，非逼着你弄明白好多事不可。”
        - id: ch03-b18
          speaker: mary_lennox
          text: “一把小铲子得花多少钱？”
        - id: ch03-b19
          speaker: martha
          text: “斯韦特村有一两家铺子。我见过那里卖一小套一小套的园艺工具。铲子、耙子和叉子扎在一起，两先令一套。别看是给孩子用的，东西可结实得很，不是摆着玩的，真能拿来干活。”
        - id: ch03-b20
          speaker: mary_lennox
          text: “我钱袋里的钱更多。莫里森太太给过我五先令，梅德洛克太太也把克雷文先生给的钱交给了我。”
        - id: ch03-b21
          speaker: martha
          text: “老爷居然还记得给你钱？”
          emotion: surprised
        - id: ch03-b22
          speaker: mary_lennox
          text: “梅德洛克太太说，我每星期有一先令零花钱。每个星期六，她都会给我一枚。我一直不知道能买什么。”
        - id: ch03-b23
          speaker: martha
          text: “我的老天，那可算发财啦！世上你想买什么都买得起。我们一家住的那间小屋，租金才一先令三便士，可每回要凑出这点钱，都难得像从嘴里拔牙一样。等等，我这会儿想到一件事。”
        - id: ch03-b24
          speaker: narrator
          text: 她把双手往腰上一叉。
        - id: ch03-b25
          speaker: mary_lennox
          text: “什么事？”
        - id: ch03-b26
          speaker: martha
          text: “斯韦特的铺子里有花种，一便士一包。迪肯知道哪些最好看，也知道怎么种活。他常常只为了好玩，就走到斯韦特去。对了，你会写印刷体吗？”
        - id: ch03-b27
          speaker: mary_lennox
          text: “我会写字。”
        - id: ch03-b28
          speaker: narrator
          text: 玛莎摇了摇头。
        - id: ch03-b29
          speaker: martha
          text: “迪肯只认得印刷体。你要是会写，我们就给他写封信，请他把工具和种子一起买回来。”
        - id: ch03-b30
          speaker: mary_lennox
          text: “啊，你真是个好姑娘！真的！我以前不知道你这么好。我只要试试，一定能写印刷体。我们去找梅德洛克太太要钢笔、墨水和纸。”
          emotion: happy
        - id: ch03-b31
          speaker: martha
          text: “我自己就有。我买来，是为了星期天给妈妈写几个印刷体的字。我去拿。”
    - id: ch04
      title: 写给迪肯的信
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 玛莎跑出房间。玛丽站在炉火旁，欢喜得把一双瘦瘦的小手绞个不停。
        - id: ch04-b02
          speaker: mary_lennox
          text: “有了铲子，我就能把泥土弄松，还能挖掉杂草。要是再有种子，能让花长出来，花园就不会死。它会活起来。”
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: 那天下午，玛丽没能再出去。玛莎拿着钢笔、墨水和纸回来，先要收拾桌子，再把盘子碟子全都送到楼下。到了厨房，梅德洛克太太正好在那里，又叫她去办一件事。玛丽觉得自己等了好久好久，她才终于回来。给迪肯写信可是一件郑重的大事。玛丽没受过多少教育，因为家庭教师们都太讨厌她，谁也不肯在她身边久留。她不大擅长拼写，好在认真试过以后，确实能写印刷体。玛莎一句句口述起来。
        - id: ch04-b04
          speaker: martha
          text: “亲爱的迪肯，写这封信时我一切都好，也盼你收到信时一切都好。玛丽小姐手里有很多钱，请你到斯韦特替她买一些花种，再买一套园艺工具，让她自己做个花坛。花种要挑最好看的，也要容易种活，因为她以前从没种过花，还一直住在印度，那里和这里很不一样。”
        - id: ch04-b05
          speaker: martha
          text: “请代我向妈妈和家里每一个人问好。玛丽小姐还要告诉我许多事。等我下次休息，你们就能听到人怎么骑大象和骆驼，还有先生们出去猎狮子和老虎的故事。爱你的姐姐，玛莎·菲比·索尔比。”
        - id: ch04-b06
          speaker: martha
          text: “我们把钱放进信封，再请肉铺家的男孩赶车时带过去。他和迪肯要好得很。”
        - id: ch04-b07
          speaker: mary_lennox
          text: “迪肯买好以后，我怎么拿到东西？”
        - id: ch04-b08
          speaker: martha
          text: “他会亲自送来。他很乐意往这边走一趟。”
        - id: ch04-b09
          speaker: mary_lennox
          text: “那我就能见到他了！我从没想过自己真的会见到迪肯。”
          emotion: happy
        - id: ch04-b10
          speaker: martha
          text: “你很想见他吗？”
        - id: ch04-b11
          speaker: narrator
          text: 她忽然这样问，是因为玛丽看起来实在太高兴。
        - id: ch04-b12
          speaker: mary_lennox
          text: “当然想。我还没见过狐狸和乌鸦都喜欢的男孩。我非常想看看他。”
        - id: ch04-b13
          speaker: narrator
          text: 玛莎轻轻一惊，像是突然记起一件忘得干干净净的事。
        - id: ch04-b14
          speaker: martha
          text: “瞧我这脑子！我原本打算一早就告诉你的。我问过妈妈了，她说会亲自去问梅德洛克太太。”
        - id: ch04-b15
          speaker: mary_lennox
          text: “你是说……”
        - id: ch04-b16
          speaker: martha
          text: “就是星期二说的事。问问她，哪天能不能让人用车送你去我们的小屋。你可以吃妈妈做的热燕麦饼，抹上黄油，再喝一杯牛奶。”
        - id: ch04-b17
          speaker: narrator
          text: 这一天，所有有趣的事好像全赶到了一起。想想看，玛丽可以在大白天、在蓝天下一路穿过荒原。再想想，她还能走进那间小屋，看看一个屋顶下面怎么住着十二个孩子。
        - id: ch04-b18
          speaker: mary_lennox
          text: “你妈妈觉得梅德洛克太太会准许我去吗？”
        - id: ch04-b19
          speaker: martha
          text: “嗯，她觉得会。梅德洛克太太知道妈妈做事很利落，也知道她把小屋收拾得有多干净。”
        - id: ch04-b20
          speaker: mary_lennox
          text: “那样我不光能见到迪肯，还能见到你妈妈。她好像和印度那些母亲都不一样。”
    - id: ch05
      title: 远处的哭声
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 花园里的劳动，再加上一下午接连不断的兴奋，终于让玛丽安静下来，陷入沉思。玛莎一直陪她待到下午茶时间。两个人舒舒服服地静坐着，没说多少话。可就在玛莎要下楼拿茶盘以前，玛丽忽然问了一个问题。
        - id: ch05-b02
          speaker: mary_lennox
          text: “玛莎，那个洗碗女佣今天又牙疼了吗？”
        - id: ch05-b03
          speaker: narrator
          text: 玛莎明显地轻轻一惊。
        - id: ch05-b04
          speaker: martha
          text: “你怎么会问这个？”
        - id: ch05-b05
          speaker: mary_lennox
          text: “我等你回来，等了很久，就开门走进走廊，想看看你是不是来了。然后我又听见远处有人哭，和那天晚上一样。今天根本没有风，所以那不可能是风声。”
        - id: ch05-b06
          speaker: martha
          text: “哎呀！你不该在走廊里乱走，更不该偷听。克雷文先生要是知道了，会气成什么样，谁也说不准。”
        - id: ch05-b07
          speaker: mary_lennox
          text: “我没有偷听。我只是在等你，后来就听见了。这已经是第三次。”
        - id: ch05-b08
          speaker: martha
          text: “我的老天！梅德洛克太太在按铃。”
        - id: ch05-b09
          speaker: narrator
          text: 玛莎说完，几乎是跑出了房间。
        - id: ch05-b10
          speaker: mary_lennox
          text: “这是世上最古怪的宅子。”
        - id: ch05-b11
          speaker: narrator
          text: 玛丽困倦地把头靠在身旁扶手椅的软垫上。新鲜空气、挖土和跳绳叫她疲倦得舒舒服服。没过多久，她便睡着了。
