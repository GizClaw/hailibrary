audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    dickon:
      display_name: Dickon Sowerby
      tts:
        delivery: gentle, openhearted, and easy in Yorkshire character
        timbre: fresh and warm
        pace: relaxed
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Living Roses
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            For two or three minutes, Dickon stood still and looked all around. Mary watched him. Then he began moving softly through the garden, even more quietly than Mary had on the day she first stepped inside its four walls. He took in everything. Gray vines climbed the gray trees and hung from their branches. Tangled growth covered the walls and pushed through the grass. Evergreen alcoves held stone seats and tall flower urns.
        - id: ch01-b02
          speaker: dickon
          text: I never thought I'd get to see this place.
        - id: ch01-b03
          speaker: mary
          text: Did you know it was here?
        - id: ch01-b04
          speaker: narrator
          text: >-
            Mary had spoken in her ordinary voice. Dickon quickly signaled for quiet.
        - id: ch01-b05
          speaker: dickon
          text: >-
            We have to keep our voices down. Somebody might hear us and start wondering what's going on in here.
        - id: ch01-b06
          speaker: mary
          text: Oh! I forgot!
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: >-
            Frightened, Mary clapped a hand over her mouth. When she felt steady again, she whispered her question.
        - id: ch01-b08
          speaker: mary
          text: Did you know about the garden?
        - id: ch01-b09
          speaker: narrator
          text: Dickon nodded.
        - id: ch01-b10
          speaker: dickon
          text: >-
            Martha told me there was a garden nobody ever went into. We used to wonder what it looked like.
        - id: ch01-b11
          speaker: narrator
          text: >-
            He stopped to study the lovely gray tangle. His round eyes shone with a strange happiness.
        - id: ch01-b12
          speaker: dickon
          text: >-
            Just think of all the nests that'll be here in spring! This must be the safest nesting place in England. Nobody comes near, and there are tangles of trees and roses everywhere. I'm surprised every bird on the moor doesn't build here.
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: Without even thinking about it, Mary put her hand on his arm again.
        - id: ch01-b14
          speaker: mary
          text: >-
            Will there really be roses? Can you tell? I was afraid they might all be dead.
        - id: ch01-b15
          speaker: dickon
          text: Oh, no! Not all of them. Come look at this!
        - id: ch01-b16
          speaker: narrator
          text: >-
            He crossed to the nearest tree. It was very old, with gray lichen covering its bark. Above it, the tree held up a whole curtain of tangled branches and trailing stems. Dickon pulled a thick knife from his pocket and opened one blade.
        - id: ch01-b17
          speaker: dickon
          text: >-
            There's plenty of dead wood that needs cutting away. Some of this wood is old, too, but it grew new wood last year. See this brownish-green shoot? This bit is new.
        - id: ch01-b18
          speaker: narrator
          text: Mary reached out and touched it with eager care.
        - id: ch01-b19
          speaker: mary
          text: This one? Is this one truly alive?
        - id: ch01-b20
          speaker: narrator
          text: Dickon's wide mouth curved into a smile.
        - id: ch01-b21
          speaker: dickon
          text: It's as wick as you or me.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Mary remembered Martha explaining that "wick" meant alive and lively.
        - id: ch01-b23
          speaker: mary
          text: >-
            I'm so glad it's wick! I want every one of them to be wick. Let's go all around the garden and count the living ones.
          emotion: happy
    - id: ch02
      title: Learning to Garden
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Mary could hardly contain her excitement. She was almost panting with eagerness, and Dickon was just as eager. They moved from tree to tree and bush to bush. With his knife in hand, Dickon showed her one marvelous thing after another.
        - id: ch02-b02
          speaker: dickon
          text: >-
            They've gone wild. The strongest plants have done well on their own. The delicate ones died, but the others kept growing and spreading till they became a wonder. Now, look at this branch. It seems dead, but I don't think it is, not all the way down to the root. I'll cut it low and find out.
        - id: ch02-b03
          speaker: narrator
          text: >-
            He knelt and cut through the lifeless-looking branch close to the ground.
        - id: ch02-b04
          speaker: dickon
          text: There! I knew it. The wood is still green inside. Have a look.
          emotion: happy
        - id: ch02-b05
          speaker: narrator
          text: >-
            Mary was already on her knees, staring as hard as she could.
        - id: ch02-b06
          speaker: dickon
          text: >-
            If the inside looks a little green and juicy, it's wick. If it's dry and snaps easily, like the piece I cut off, it's finished. There's one big root under here, and all this live wood grew from it. Once we cut away the old wood, dig around the root, and care for it, there'll be...
        - id: ch02-b07
          speaker: narrator
          text: Dickon paused and looked up at the climbing stems above him.
        - id: ch02-b08
          speaker: dickon
          text: There'll be a fountain of roses here this summer.
          emotion: happy
        - id: ch02-b09
          speaker: narrator
          text: >-
            They kept going from bush to bush and tree to tree. Dickon was strong and skillful with his knife. He knew which dry, dead pieces to remove, and he could find green life inside a branch that looked hopeless. Mary watched every cut closely. Within half an hour, she thought she could tell the difference, too. Whenever his knife revealed even the faintest shade of moist green, she caught her breath and gave a quiet cry of delight.
        - id: ch02-b10
          speaker: narrator
          text: >-
            The spade, hoe, and fork all proved useful. Dickon showed Mary how to handle the fork. As she worked beside him, he dug around the roots with the spade, stirred the packed earth, and let fresh air into the soil. They worked steadily together until they reached one of the largest rose trees. Then Dickon suddenly spotted something in the grass a few feet away.
        - id: ch02-b11
          speaker: dickon
          text: Why, who cleared that patch over there?
          emotion: surprised
        - id: ch02-b12
          speaker: narrator
          text: He was pointing at one of Mary's little clearings around the pale green shoots.
        - id: ch02-b13
          speaker: mary
          text: I did.
        - id: ch02-b14
          speaker: dickon
          text: But I thought tha' knew nothing about gardening.
          emotion: surprised
        - id: ch02-b15
          speaker: mary
          text: >-
            I don't. But those shoots were so small, and the grass was so thick. They looked as though they couldn't breathe, so I cleared a place for them. I don't even know what they are.
        - id: ch02-b16
          speaker: narrator
          text: Dickon knelt beside them with his broad smile.
        - id: ch02-b17
          speaker: dickon
          text: >-
            Tha' did exactly right. No gardener could have told thee better. They'll shoot up like Jack's beanstalk now. These are crocuses and snowdrops. Over there are narcissus, and here are daffydowndillies. Won't they be a sight!
          emotion: happy
        - id: ch02-b18
          speaker: narrator
          text: He hurried from one clearing to the next.
        - id: ch02-b19
          speaker: dickon
          text: Tha's done a great deal of work for such a little lass.
        - id: ch02-b20
          speaker: mary
          text: >-
            I'm getting fatter and stronger. I used to feel tired all the time, but digging never tires me. I like the smell when the earth is turned over.
        - id: ch02-b21
          speaker: dickon
          text: >-
            It's doing thee a world of good. Nothing smells better than clean earth, except fresh growing things when rain falls on them. Many a rainy day, I go out on the moor and lie under a bush. I listen to the soft swish of rain on the heather, and I sniff and sniff. Mother says the end of my nose twitches like a rabbit's.
        - id: ch02-b22
          speaker: narrator
          text: >-
            Mary gazed at him in wonder. She had never known such a funny boy, or such a nice one.
        - id: ch02-b23
          speaker: mary
          text: Don't you ever catch cold?
        - id: ch02-b24
          speaker: dickon
          text: >-
            Not me. I've never caught one in my life. Nobody raised me to be soft. I've raced around the moor in every kind of weather, same as the rabbits. Mother says I've breathed too much fresh air for twelve years to start sniffling with a cold now. I'm as tough as a hawthorn walking stick.
        - id: ch02-b25
          speaker: narrator
          text: >-
            Dickon kept working as he talked. Mary followed along, helping with her fork or trowel.
        - id: ch02-b26
          speaker: dickon
          text: There's a tremendous amount to do in here!
          emotion: happy
        - id: ch02-b27
          speaker: mary
          text: >-
            Will you come back and help me? I know I can help, too. I can dig and pull weeds and do whatever you tell me. Oh, please come, Dickon!
        - id: ch02-b28
          speaker: dickon
          text: >-
            I'll come every day if tha' wants me, rain or shine. I've never had better fun than being shut in here and waking up a garden.
          emotion: happy
        - id: ch02-b29
          speaker: mary
          text: >-
            If you'll come and help me bring it alive, then I'll... I don't know what I'll do.
        - id: ch02-b30
          speaker: narrator
          text: Mary had no idea what anyone could do for a boy like Dickon.
        - id: ch02-b31
          speaker: dickon
          text: >-
            I'll tell thee what tha'll do. Tha'll grow fat and hungry as a young fox, and tha'll learn to talk to the robin the way I do. Oh, we'll have plenty of fun!
          emotion: happy
    - id: ch03
      title: Five People to Like
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Dickon walked slowly around the garden again, studying the trees, walls, and bushes.
        - id: ch03-b02
          speaker: dickon
          text: >-
            We don't want to turn it into a proper gardener's garden, all clipped and polished, do we? It's prettier this way, with everything growing wild, swinging about, and catching hold of everything else.
        - id: ch03-b03
          speaker: mary
          text: >-
            Please don't make it tidy. If it were tidy, it wouldn't feel like a secret garden.
        - id: ch03-b04
          speaker: narrator
          text: Dickon rubbed his rusty-red head and looked puzzled.
        - id: ch03-b05
          speaker: dickon
          text: >-
            It's certainly a secret garden. Still, it looks as if someone besides the robin has been in here since they shut it ten years ago.
        - id: ch03-b06
          speaker: mary
          text: But the door was locked, and the key was buried. Nobody could come in.
        - id: ch03-b07
          speaker: dickon
          text: >-
            That's true. It's a strange place. But here and there, some branches seem to have been pruned less than ten years ago.
        - id: ch03-b08
          speaker: mary
          text: Then how could anyone have done it?
        - id: ch03-b09
          speaker: narrator
          text: Dickon examined the branch of a rose tree and shook his head.
        - id: ch03-b10
          speaker: dickon
          text: >-
            Aye, how could they, with the door locked and the key underground?
        - id: ch03-b11
          speaker: narrator
          text: >-
            No matter how many years Mary lived, she felt she would always remember that first morning when her garden began to grow. Of course, the plants had been alive before. But to Mary, the garden truly began growing that day. As Dickon cleared open patches where they could plant seeds, she remembered the rhyme Basil had sung when he wanted to tease her.
        - id: ch03-b12
          speaker: mary
          text: Are there any flowers shaped like bells?
        - id: ch03-b13
          speaker: dickon
          text: >-
            Lilies of the valley are. So are Canterbury bells and campanulas.
        - id: ch03-b14
          speaker: mary
          text: Let's plant some.
        - id: ch03-b15
          speaker: dickon
          text: >-
            Lilies of the valley are already here. I saw them. They've probably grown too close together, so we'll have to separate them, but there are plenty. The others take two years to flower from seed. I can bring some little plants from our cottage garden instead. Why does tha' want bell-shaped flowers?
        - id: ch03-b16
          speaker: narrator
          text: >-
            Mary told him about Basil and his brothers and sisters in India. She had hated them, and they had called her Mistress Mary Quite Contrary.
        - id: ch03-b17
          speaker: mary
          text: >-
            They used to dance around me and sing, "Mistress Mary, quite contrary, how does your garden grow? With silver bells, and cockle shells, and marigolds all in a row." I remembered it just now, and it made me wonder whether any flowers really looked like silver bells.
        - id: ch03-b18
          speaker: narrator
          text: >-
            Mary frowned and jabbed her trowel into the soil with a touch of spite.
        - id: ch03-b19
          speaker: mary
          text: I wasn't nearly as contrary as they were.
        - id: ch03-b20
          speaker: narrator
          text: >-
            Dickon laughed. As he crumbled the rich black earth, Mary saw him breathing in its smell.
        - id: ch03-b21
          speaker: dickon
          text: >-
            Seems to me nobody needs to be contrary when there are flowers all around, and so many friendly wild creatures running about, making homes and building nests and singing and whistling. Does tha' think so?
        - id: ch03-b22
          speaker: narrator
          text: >-
            Mary knelt beside him with the seeds in her hands. She looked at him, and her frown disappeared.
        - id: ch03-b23
          speaker: mary
          text: >-
            Dickon, you're every bit as nice as Martha said. I like you. That makes you the fifth person I like. I never imagined I'd like five people.
        - id: ch03-b24
          speaker: narrator
          text: >-
            Dickon sat back on his heels, just as Martha did when she polished the grate. He looked Mary over with his round blue eyes. His cheeks were red, and his cheerful nose turned up at the end. Mary thought he looked both funny and delightful.
        - id: ch03-b25
          speaker: dickon
          text: Only five people? Who are the other four?
        - id: ch03-b26
          speaker: mary
          text: Your mother, Martha, the robin, and Ben Weatherstaff.
        - id: ch03-b27
          speaker: narrator
          text: >-
            Dickon laughed so hard that he had to press his arm over his mouth to smother the sound.
        - id: ch03-b28
          speaker: dickon
          text: >-
            I know tha' thinks I'm a strange lad, but tha's the strangest little lass I've ever met.
          emotion: happy
        - id: ch03-b29
          speaker: narrator
          text: >-
            Then Mary did something strange. She leaned toward him and asked a question she had never dreamed of asking anyone. She even tried to say it in Yorkshire, because in India people had always been pleased when she spoke their language.
        - id: ch03-b30
          speaker: mary
          text: Does tha' like me?
        - id: ch03-b31
          speaker: dickon
          text: >-
            Eh, that I do! I like thee wonderfully well, and I believe the robin does, too!
          emotion: happy
        - id: ch03-b32
          speaker: mary
          text: Then that's two. Two people like me.
          emotion: happy
        - id: ch03-b33
          speaker: narrator
          text: After that, they worked harder than ever, and more joyfully, too.
    - id: ch04
      title: Safe as a Missel Thrush
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Mary was startled and sorry when the great clock in the courtyard struck the hour for her midday dinner.
        - id: ch04-b02
          speaker: mary
          text: >-
            I have to go now. And you have to leave, too, don't you?
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: Dickon grinned.
        - id: ch04-b04
          speaker: dickon
          text: >-
            My dinner can go anywhere with me. Mother always lets me tuck a little something into my pocket.
        - id: ch04-b05
          speaker: narrator
          text: >-
            He picked up his coat from the grass. From one pocket he pulled a lumpy bundle wrapped in a clean, coarse blue-and-white handkerchief. Inside were two thick pieces of bread with a slice of something between them.
        - id: ch04-b06
          speaker: dickon
          text: >-
            Most days it's only bread, but today I've got a grand thick slice of bacon with it.
        - id: ch04-b07
          speaker: narrator
          text: >-
            It seemed like an odd dinner to Mary, but Dickon looked ready to enjoy every bite.
        - id: ch04-b08
          speaker: dickon
          text: >-
            Run along and get thy food. I'll finish mine before tha' does, and I can do more work before I head home.
        - id: ch04-b09
          speaker: narrator
          text: He sat with his back against a tree.
        - id: ch04-b10
          speaker: dickon
          text: >-
            I'll call the robin and let him peck at the bacon rind. Robins are wonderfully fond of a little fat.
        - id: ch04-b11
          speaker: narrator
          text: >-
            Mary could barely make herself leave. All at once, Dickon seemed like some kind of woodland fairy who might vanish before she returned to the garden. He felt too good to be real. She walked slowly halfway to the door in the wall. Then she stopped, turned, and went back to him.
        - id: ch04-b12
          speaker: mary
          text: >-
            No matter what happens, you would never tell anyone, would you?
        - id: ch04-b13
          speaker: narrator
          text: >-
            Dickon's poppy-red cheeks bulged around his first large bite of bread and bacon, but he still managed an encouraging smile.
        - id: ch04-b14
          speaker: dickon
          text: >-
            If tha' were a missel thrush and showed me where thy nest was, would tha' expect me to tell? Never. Thy secret is as safe as a missel thrush's nest.
        - id: ch04-b15
          speaker: narrator
          text: And Mary was completely certain that it was.
