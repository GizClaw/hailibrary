audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    dickon:
      display_name: 迪肯
      tts: {delivery: 质朴自在，带浓重而亲切的约克郡乡音, timbre: 清亮温厚，带荒原少年的蓬勃气息, pace: 轻快从容, pitch: 中高音}
  chapters:
    - id: ch01
      title: 活泛的玫瑰
      blocks:
        - {id: ch01-b01, speaker: narrator, text: 迪肯站着看了两三分钟，玛丽也静静看着他。随后，他轻轻走遍花园，脚步比玛丽第一次进来时还轻。他仔细看着灰树和垂藤，看着墙上、草间缠绕的枝蔓，也看着常青树围成的角落。那里摆着石凳和高高的花瓮。}
        - {id: ch01-b02, speaker: dickon, text: “我真没想到，这辈子还能亲眼看见这里。”}
        - {id: ch01-b03, speaker: mary_lennox, text: “你早就知道这座花园？”}
        - {id: ch01-b04, speaker: narrator, text: 玛丽说得太响，迪肯立刻打手势叫她小声。}
        - {id: ch01-b05, speaker: dickon, text: “咱们可得轻声说。要是有人听见，会猜这里头出了什么事。”}
        - {id: ch01-b06, speaker: mary_lennox, text: “啊，我忘了！”}
        - {id: ch01-b07, speaker: narrator, text: 玛丽吓得赶紧用手捂住嘴。她刚才竟把保守秘密这件事忘了。等心里镇定下来，她压低嗓子，又问迪肯怎么会知道这里。迪肯点点头，说玛莎告诉过他，有座花园从来没人进去。他和家里人以前一直都在猜，它究竟是什么模样。说着，他停下脚步，望向四周那些美丽的灰藤，圆圆的眼睛里满是说不出的欢喜。}
        - {id: ch01-b08, speaker: dickon, text: “嗳，等春天来了，这里会有多少鸟窝啊！全英格兰再没有比这儿更安全的地方了。没人打扰，树枝和玫瑰又到处缠着，正好搭窝。我倒奇怪，荒原上的鸟儿怎么没全搬进来。”}
        - {id: ch01-b09, speaker: narrator, text: 玛丽不知不觉又把手放在了迪肯的胳膊上。}
        - {id: ch01-b10, speaker: mary_lennox, text: “这里还会开玫瑰吗？你看得出来吗？我一直怕它们全死了。”}
        - {id: ch01-b11, speaker: dickon, text: “没全死！你来看。”}
        - {id: ch01-b12, speaker: narrator, text: 迪肯走到最近的一棵老树旁。那棵树实在太老了，树皮上盖满灰色地衣，却还托着一挂乱枝织成的帘子。他从口袋里掏出厚实的小刀，打开刀刃，指给玛丽看。这里有不少该剪的枯枝，老枝也很多，可就在去年，它还抽出过新的枝条。迪肯碰了碰一根嫩枝。它不像别的枝条那样又干又硬、灰蒙蒙的，而是微微泛着棕绿。玛丽也伸出手，又急切又郑重地摸了摸它。}
        - {id: ch01-b13, speaker: mary_lennox, text: “就是这一根？它真的还活着吗？”}
        - {id: ch01-b14, speaker: dickon, text: “它跟你我一样，活得好好的。”}
        - {id: ch01-b15, speaker: narrator, text: 玛丽想起玛莎说过，约克郡人把这种有生命、有活力的样子叫作“活泛”。}
        - {id: ch01-b16, speaker: mary_lennox, text: “它还活泛，真好！我想让它们全都活泛。咱们走遍花园，数数还有多少活着的吧！”}
        - {id: ch01-b17, speaker: narrator, text: 她兴奋得直喘气，迪肯也和她一样兴奋。两个人从一棵树走到另一棵树，又从一丛灌木走到另一丛灌木。迪肯始终把小刀拿在手里，一路把许多神奇的事指给玛丽看，而她觉得每一样都妙不可言。}
        - {id: ch01-b18, speaker: dickon, text: “它们虽然长野了，最壮的那些却长得更旺。娇弱的死了，剩下的一直长，一直往外蔓，才叫人吃惊。你看这根灰枝，别人准以为它死了，可我觉得它的根还活着。咱们从低处割开看看。”}
        - {id: ch01-b19, speaker: narrator, text: 他跪下来，贴近地面割断那根毫无生气的枝条。}
        - {id: ch01-b20, speaker: dickon, text: “看吧，我说对了！木头里面还有绿呢。”}
        - {id: ch01-b21, speaker: narrator, text: 迪肯还没开口，玛丽早已跪在地上，用尽力气盯着新鲜的切口，唯恐错过里面最浅的一点绿色。}
        - {id: ch01-b22, speaker: dickon, text: “里面带点绿，还有水分，就是活泛的。要是又干又脆，像割下来的这一截，才算真的完了。这下面有一条大根，活枝都是从那里长出的。把老枝剪掉，再松土照料，今年夏天，这里会喷出一股玫瑰的泉水。”}
    - id: ch02
      title: 唤醒花园
      blocks:
        - {id: ch02-b01, speaker: narrator, text: 他们继续从一片灌木走到另一片，又从一棵树走到另一棵。迪肯力气大，刀也用得巧。他知道怎样削去干枝和枯枝，也能认出那些看起来毫无希望的枝杈里还藏着的绿色生命。不到半个钟头，玛丽觉得自己也学会了一点。每次他割开一根貌似死去的枝条，只要切口露出一丝湿润的绿，她都会压着声音，欢喜地低呼。铁锹、锄头和叉子全用上了。迪肯教她怎样用叉子，自己则拿铁锹翻挖根边的土，让泥土松开，也让空气透进去。}
        - {id: ch02-b02, speaker: narrator, text: 两人正收拾一株很大的树状月季，迪肯忽然指着几英尺外的草地。那里有一圈被玛丽清开的草，中央露出淡绿色的嫩尖。}
        - {id: ch02-b03, speaker: dickon, text: “咦，那是谁弄的？”}
        - {id: ch02-b04, speaker: mary_lennox, text: “那块地方是我清理的。”}
        - {id: ch02-b05, speaker: dickon, text: “可我还以为你一点园艺也不懂！”}
        - {id: ch02-b06, speaker: mary_lennox, text: “我的确不懂。可嫩芽那么小，草又厚又壮，它们像是没地方喘气，我就清出了一小块。我连它们是什么都不知道。”}
        - {id: ch02-b07, speaker: narrator, text: 迪肯笑着跪到嫩芽旁边。}
        - {id: ch02-b08, speaker: dickon, text: “你做得正对，园丁也不会教得更好了。现在它们会像杰克的豆茎一样猛长。这些是番红花和雪花莲，那边是水仙，这里还有黄水仙。等它们开花，一定好看极了！”}
        - {id: ch02-b09, speaker: narrator, text: 迪肯从一块清好的空地跑到另一块，每到一处都认出新的花。他又回头把玛丽从上到下打量了一遍，说她这么小一个姑娘，竟然已经做了这么多活。}
        - {id: ch02-b10, speaker: mary_lennox, text: “我正在长胖，也越来越有力气。从前我总是累，现在挖土一点也不累。我喜欢泥土刚翻开时的气味。”}
        - {id: ch02-b11, speaker: dickon, text: “这对你再好不过。干净的好泥土最好闻，除非雨水落到新长的草木上。有时天下着雨，我也跑到荒原上，躺在灌木底下，听雨点轻轻刷过石南，再使劲闻那股气味。妈妈说，我的鼻尖抖得跟兔子一样。”}
        - {id: ch02-b12, speaker: mary_lennox, text: “你从来不会着凉吗？”}
        - {id: ch02-b13, speaker: narrator, text: 玛丽惊奇地望着他。她从没见过这么有趣、又这么讨人喜欢的男孩。}
        - {id: ch02-b14, speaker: dickon, text: “我才不会。从出生到现在，我一次也没着过凉。家里没把我养得那么娇气，什么天气我都在荒原上跑，跟兔子一样。妈妈说，我十二年来吸了太多新鲜空气，早没法吸着鼻子伤风了。我的身子硬得像山楂木拐杖头。”}
        - {id: ch02-b15, speaker: narrator, text: 迪肯说话时，手里的活儿从来没有停下。玛丽一路跟着他，时而用叉子，时而用小铲，能帮什么就帮什么。他有一次停下来看看四周，非但没被繁重的活吓住，反而高兴极了，说这里要做的事可真多。}
        - {id: ch02-b16, speaker: mary_lennox, text: “那你还会来帮我吗？我也能干活。我会挖土，会拔草，你教我什么，我就做什么。迪肯，你一定要来！”}
        - {id: ch02-b17, speaker: dickon, text: “只要你愿意，不管下雨还是天晴，我每天都来。关在这里，慢慢唤醒一座花园，这是我这辈子最好玩的事。”}
        - {id: ch02-b18, speaker: mary_lennox, text: “只要你肯来，肯帮我把它救活，我就……我也不知道该怎么报答你。”}
        - {id: ch02-b19, speaker: narrator, text: 玛丽说到一半，无可奈何地停住了。她实在想不出，自己能拿什么回报迪肯。像他这样的男孩，别人又能为他做什么呢？}
        - {id: ch02-b20, speaker: dickon, text: “我知道你该做什么。你会长胖，会饿得像只小狐狸，还会学会跟知更鸟说话。咱们会快活极了。”}
        - {id: ch02-b21, speaker: narrator, text: 迪肯带着思索的神情四处走着，一会儿仰头看看树，一会儿又查看墙和灌木。他不愿把这里变成园丁管的花园，修剪得齐齐整整、一尘不乱。他觉得现在这样更美。草木自在地生长，枝蔓摇摇荡荡，这一根牵住那一根，彼此攀在一起。}
        - {id: ch02-b22, speaker: mary_lennox, text: “千万别把它收拾整齐。太整齐了，就不像秘密花园了。”}
        - {id: ch02-b23, speaker: narrator, text: 迪肯抓抓铁锈红的头发，忽然有些疑惑。}
        - {id: ch02-b24, speaker: dickon, text: “它当然是秘密花园。可我总觉得，十年前锁上以后，除了知更鸟，还有谁进来过。”}
        - {id: ch02-b25, speaker: mary_lennox, text: “门一直锁着，钥匙也埋了。谁能进来呢？”}
        - {id: ch02-b26, speaker: dickon, text: “是啊，这才古怪。有几处枝条像被人修过，而且没有十年那么久。”}
        - {id: ch02-b27, speaker: narrator, text: 迪肯检查着一株树状月季的枝条，慢慢摇了摇头。他怎么也想不明白。门明明锁着，钥匙也明明埋在土里，那个人究竟是怎样进来的呢？}
    - id: ch03
      title: 两个喜欢玛丽的人
      blocks:
        - {id: ch03-b01, speaker: narrator, text: 玛丽觉得，无论自己活到多大，也不会忘记花园开始生长的这个早晨。至少在她心里，花园就是从这一天起，真正开始生长的。迪肯清出一块块地方，准备把种子播下去。玛丽看着他干活，忽然想起巴兹尔从前为了捉弄她，唱过一首关于花园的歌。}
        - {id: ch03-b02, speaker: mary_lennox, text: “有没有哪种花，长得像铃铛？”}
        - {id: ch03-b03, speaker: dickon, text: “铃兰就像。还有风铃草和坎特伯雷钟花。”}
        - {id: ch03-b04, speaker: mary_lennox, text: “那咱们种一些吧。”}
        - {id: ch03-b05, speaker: dickon, text: “这里已经有铃兰，只是挤得太密，得分开一点。别的花从种子长到开花，要等两年。不过我能从家里的小花园带些苗。你为什么想要铃铛一样的花？”}
        - {id: ch03-b06, speaker: narrator, text: 玛丽便说起印度的巴兹尔和他的兄弟姐妹。那时，她十分讨厌他们，他们也总爱拿她取笑。他们给她取了“别扭玛丽小姐”的外号，还会围在她身边，一边跳，一边唱那首惹她生气的歌。}
        - {id: ch03-b07, speaker: mary_lennox, text: “他们唱的是，‘玛丽小姐真别扭，你的花园怎么长？银铃铛，贝壳排，金盏花儿列成行。’我刚想起这首歌，就想知道世上是不是真有银铃铛一样的花。”}
        - {id: ch03-b08, speaker: narrator, text: 她皱起眉头，拿小铲狠狠戳进泥土。}
        - {id: ch03-b09, speaker: mary_lennox, text: “明明是他们更别扭。”}
        - {id: ch03-b10, speaker: narrator, text: 迪肯笑了。他捏碎肥沃的黑土，深深闻着泥土的香气。}
        - {id: ch03-b11, speaker: dickon, text: “身边有花花草草，又有这么多友善的野东西。它们四处跑，自己安家、搭窝，还唱歌、吹口哨。既然这样，谁还犯得着跟人别扭呢？”}
        - {id: ch03-b12, speaker: narrator, text: 玛丽捧着种子跪在他身边。她看着迪肯，眉头渐渐松开了。}
        - {id: ch03-b13, speaker: mary_lennox, text: “迪肯，你果然像玛莎说的那么好。我喜欢你。你是第五个。我真没想到，自己会喜欢五个人。”}
        - {id: ch03-b14, speaker: narrator, text: 迪肯像玛莎擦壁炉时那样，把身子直起来，坐在自己的脚后跟上。玛丽仔细看着他。那双眼睛又圆又蓝，两颊红扑扑的，鼻尖快活地向上翘着。在玛丽眼里，他的模样又有趣，又可爱。}
        - {id: ch03-b15, speaker: dickon, text: “你一共才喜欢五个人？另外四个是谁？”}
        - {id: ch03-b16, speaker: mary_lennox, text: “你妈妈和玛莎，还有知更鸟和本·韦瑟斯塔夫。”}
        - {id: ch03-b17, speaker: narrator, text: 迪肯笑得太厉害，只好用胳膊挡住嘴，不让声音传出去。}
        - {id: ch03-b18, speaker: dickon, text: “你一定觉得我是个怪男孩。可我觉得，你才是我见过最古怪的小姑娘。”}
        - {id: ch03-b19, speaker: narrator, text: 接着，玛丽做了一件很奇怪的事。她把身子探过去，问了一个自己从前做梦也没想过会问别人的问题。她还特地试着用迪肯的约克郡说法，因为在印度时她就知道，要是你懂当地人的语言，他们听见了总会高兴。}
        - {id: ch03-b20, speaker: mary_lennox, text: “你喜欢我不？”}
        - {id: ch03-b21, speaker: dickon, text: “当然喜欢，喜欢得不得了！我敢说，知更鸟也喜欢你。”}
        - {id: ch03-b22, speaker: mary_lennox, text: “那就是两个了。有两个喜欢我了。”}
        - {id: ch03-b23, speaker: narrator, text: 两个人干得比先前更卖力，也更快活了。}
    - id: ch04
      title: 槲鸫的巢
      blocks:
        - {id: ch04-b01, speaker: narrator, text: 庭院里的大钟敲响玛丽吃午饭的钟点，她吃了一惊，也很舍不得。}
        - {id: ch04-b02, speaker: mary_lennox, text: “我得走了。你也得走了，是不是？”}
        - {id: ch04-b03, speaker: dickon, text: “我的午饭带着走很方便。妈妈总会让我往口袋里揣点吃的。”}
        - {id: ch04-b04, speaker: narrator, text: 迪肯从草地上捡起外套，从口袋里拿出一个鼓鼓囊囊的小包。包袱扎得不大整齐，用的是一条干净朴素的蓝白粗布手帕。打开以后，里面是两片厚厚的面包，中间还夹着一片看不大出来是什么的东西。}
        - {id: ch04-b05, speaker: dickon, text: “大多时候只有面包，今天倒夹了一大片肥咸肉。”}
        - {id: ch04-b06, speaker: narrator, text: 玛丽觉得这样的午饭看起来十分古怪，可迪肯望着面包和咸肉，已经准备好好享用一顿，显然一点也不觉得它寒酸。}
        - {id: ch04-b07, speaker: dickon, text: “快去吃你的吧。我很快就能吃完，回家以前还可以再干一阵。我也要叫知更鸟过来，把咸肉皮给它啄。鸟儿最爱吃一点油脂了。”}
        - {id: ch04-b08, speaker: narrator, text: 迪肯背靠着一棵树坐下。玛丽简直舍不得离开他。她忽然觉得，这个男孩也许是一种林中精灵，等自己再回到花园，他已经消失不见。迪肯实在好得不像真的。玛丽慢慢走到通往墙门的半路，终于还是停下脚步，转身走了回来。}
        - {id: ch04-b09, speaker: mary_lennox, text: “不管出了什么事，你……你永远不会把秘密说出去吧？”}
        - {id: ch04-b10, speaker: narrator, text: 迪肯嘴里刚塞进一大口面包和咸肉，罂粟花般红的两颊鼓了起来。他还是设法朝玛丽安慰地笑了笑。}
        - {id: ch04-b11, speaker: dickon, text: “要是你是一只槲鸫，还把自己的窝指给我看，你觉得我会告诉别人吗？我才不会。你的秘密就像槲鸫的窝一样安全。”}
        - {id: ch04-b12, speaker: narrator, text: 玛丽完全相信迪肯的话，心里再没有一丝怀疑。}
