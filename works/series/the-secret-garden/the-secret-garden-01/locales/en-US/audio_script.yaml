  chapters:
    - id: ch01
      title: There Is No One Left
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            When Mary Lennox was sent to Misselthwaite Manor to live with her uncle, everyone said she was the most disagreeable-looking child they had ever seen. And it was true. She had a small, thin face and a small, thin body, with pale, thin hair and a sour look. Her hair was yellow, and so was her face, because she had been born in India and had always been sick in one way or another.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Her father held a position with the English government. He was always busy, and often ill himself. Her mother was a great beauty who cared only about parties and amusing herself with lively people. She had never wanted a little girl. As soon as Mary was born, she gave her to an Ayah. The nurse understood that pleasing the Mem Sahib meant keeping the child out of sight whenever possible.
        - id: ch01-b03
          speaker: narrator
          text: >-
            So the sickly, fussy baby was kept out of the way. When she became a sickly, fussy toddler, she was still kept out of the way. Mary could hardly remember seeing anyone closely except her Ayah and the other Indian servants. They obeyed her and gave her everything she wanted. If her crying disturbed the Mem Sahib, the servants would be blamed. By the time Mary was six, she had become a selfish little tyrant.
        - id: ch01-b04
          speaker: narrator
          text: >-
            A young English governess came to teach her reading and writing, but she disliked Mary so much that she left after three months. The governesses who followed stayed even less time. If Mary had not truly wanted to read books, she might never have learned her letters at all.
        - id: ch01-b05
          speaker: narrator
          text: >-
            One terribly hot morning, when Mary was about nine, she woke in a bad temper. Then she saw a servant beside her bed who was not her Ayah, and her temper grew worse.
        - id: ch01-b06
          speaker: mary
          text: >-
            What are you doing here? I won't let you stay. Go and send my Ayah to me.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The unfamiliar woman looked frightened. She stammered that the Ayah could not come. Mary flew into a rage. She kicked and struck the woman, but that only frightened her more. No matter what Mary did, the servant could give her no other answer.
        - id: ch01-b08
          speaker: strange_servant
          text: >-
            The Ayah cannot come to Missie Sahib. It is not possible.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Something mysterious hung over the house that morning. Nothing happened in its usual order. Several servants were missing. The ones Mary did see slipped away or hurried past with gray, terrified faces. No one would explain anything, and her Ayah never came.
        - id: ch01-b10
          speaker: narrator
          text: >-
            As the morning passed, Mary was left completely alone. At last she wandered into the garden and played beneath a tree near the veranda. She pretended to make a flower bed, pushing large scarlet hibiscus blossoms into little piles of dirt. All the while, she grew angrier. She muttered about everything she would say to Saidie when the Ayah returned, and all the insulting names she would call her.
        - id: ch01-b11
          speaker: mary
          text: >-
            Pig! Pig! Daughter of pigs!
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: >-
            To call an Indian person a pig was the worst insult Mary knew. She ground her teeth and repeated it until she heard her mother step onto the veranda with someone else.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Mrs. Lennox stood with a fair-haired young man, and they spoke in low, strange voices. He looked almost like a boy. Mary knew he was a very young officer who had just arrived from England. She stared at him, but she watched her mother even more closely. Whenever Mary had a chance to see the Mem Sahib, she always stared.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Her mother was tall, slender, and beautiful. She wore lovely clothes. Her hair curled like silk, and her delicate little nose looked as though it disapproved of everything. Usually her large eyes were full of laughter. Her dresses were so light and flowing that Mary called them full of lace. That morning they seemed lacier than ever, but Mrs. Lennox's eyes held no laughter. They were wide with fear as she looked up pleadingly at the young officer.
        - id: ch01-b15
          speaker: mrs_lennox
          text: >-
            Is it really that bad? Oh, is it?
          emotion: fearful
        - id: ch01-b16
          speaker: young_officer
          text: >-
            It's terrible, Mrs. Lennox. Truly terrible. You should have gone to the hills two weeks ago.
          emotion: fearful
        - id: ch01-b17
          speaker: narrator
          text: >-
            Mrs. Lennox twisted her hands together.
        - id: ch01-b18
          speaker: mrs_lennox
          text: >-
            I know I should have gone! I stayed only for that foolish dinner party. What a fool I've been!
          emotion: fearful
        - id: ch01-b19
          speaker: narrator
          text: >-
            At that very moment, a great wail rose from the servants' quarters. Mrs. Lennox seized the young man's arm. Mary shivered from head to foot as the wailing grew wilder and wilder.
        - id: ch01-b20
          speaker: mrs_lennox
          text: >-
            What is it? What's happened?
          emotion: fearful
        - id: ch01-b21
          speaker: young_officer
          text: >-
            Someone has died. You never told me it had spread to your servants.
        - id: ch01-b22
          speaker: mrs_lennox
          text: >-
            I didn't know! Come with me. Please, come with me!
          emotion: fearful
        - id: ch01-b23
          speaker: narrator
          text: >-
            She turned and ran into the house. Then dreadful things began to happen, and Mary finally learned what had made the morning so strange. Cholera had broken out in its deadliest form, and people were dying like flies. The Ayah had fallen ill during the night. Her death was the reason the servants had wailed in their huts.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Before the next day, three more servants were dead. Others had fled in terror. Panic was everywhere, and people were dying throughout the bungalows.
        - id: ch01-b25
          speaker: narrator
          text: >-
            During the confusion of the second day, Mary hid in the nursery, and everyone forgot her. No one thought of her. No one wanted her. Strange things happened without her knowing what they were. For hours she cried, then slept, then cried again. She understood only that people were ill and that frightening sounds came from all around her.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Once, she crept into the dining room and found it empty. A half-finished meal still covered the table. Chairs and plates looked as if the diners had shoved them aside and jumped up without warning. Mary ate some fruit and cookies. She was thirsty, so she drank a nearly full glass of wine. It tasted sweet, and she had no idea how strong it was.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Soon she could hardly stay awake. She returned to the nursery and shut herself in again. Cries came from the huts, and feet hurried past, frightening her. But the wine made her so drowsy that her eyes kept closing. She lay on her bed and knew nothing for a long time.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Many things happened while she slept so heavily. The wailing did not wake her. Neither did the sounds of things being carried into and out of the bungalow.
        - id: ch01-b29
          speaker: narrator
          text: >-
            When Mary woke, she lay staring at the wall. The house was perfectly still. She had never known such silence. There were no voices and no footsteps anywhere. She wondered if everyone had recovered from the cholera and all the trouble had ended.
        - id: ch01-b30
          speaker: narrator
          text: >-
            She also wondered who would care for her now that her Ayah was dead. There would be a new Ayah, she supposed, and perhaps the new one would know different stories. Mary had grown rather tired of the old stories. She did not cry for her nurse's death. She was not an affectionate child, and she had never cared very much for anyone.
        - id: ch01-b31
          speaker: narrator
          text: >-
            The noise, the running, and the cries over the cholera had frightened her. They had also made her angry, because nobody seemed to remember she was alive. Everyone had been too terrified to think of a little girl no one loved. When people had cholera, it seemed to Mary that they remembered only themselves. Still, if they were all well now, surely someone would remember her and come.
        - id: ch01-b32
          speaker: narrator
          text: >-
            No one came. As she waited, the house seemed quieter and quieter. Then something rustled across the floor matting. Mary looked down and saw a little snake gliding past, watching her with jewel-bright eyes. She was not afraid. It was harmless and seemed eager to leave. She watched it slip beneath the door.
        - id: ch01-b33
          speaker: mary
          text: >-
            How strange and quiet it is. It sounds like no one is left in the bungalow except me and the snake.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Almost at once, footsteps sounded in the compound and then on the veranda. They were men's footsteps. The men entered the bungalow, speaking softly. No one greeted them. They began opening doors and looking into rooms.
        - id: ch01-b35
          speaker: officer
          text: >-
            What a desolate place. And that beautiful woman! The child must be gone, too. I heard there was a child, though no one ever saw her.
          emotion: sad
        - id: ch01-b36
          speaker: narrator
          text: >-
            A few minutes later, they opened the nursery door. Mary stood in the middle of the room, looking cross and unpleasant. She was hungry now, and furious that she had been so shamefully neglected. The first man through the door was a large officer she had once seen talking with her father. He looked tired and troubled. When he saw Mary, he was so startled that he nearly jumped backward.
        - id: ch01-b37
          speaker: officer
          text: >-
            Barney! There's a child here! A child all alone in a place like this! Good heavens, who is she?
          emotion: surprised
        - id: ch01-b38
          speaker: narrator
          text: >-
            Mary drew herself up stiffly. She thought it was very rude of him to call her father's bungalow a place like this.
        - id: ch01-b39
          speaker: mary
          text: >-
            I am Mary Lennox. I fell asleep when everyone had cholera, and I only just woke up. Why hasn't anybody come for me?
        - id: ch01-b40
          speaker: officer
          text: >-
            It's the child no one ever saw! They actually forgot her!
          emotion: surprised
        - id: ch01-b41
          speaker: narrator
          text: >-
            He turned toward the other men. Mary stamped her foot.
        - id: ch01-b42
          speaker: mary
          text: >-
            Why did they forget me? Why won't anyone come?
          emotion: angry
        - id: ch01-b43
          speaker: narrator
          text: >-
            The young man called Barney looked at her with deep sadness. Mary thought she saw him blink as if he were trying to hold back tears.
        - id: ch01-b44
          speaker: barney
          text: >-
            Poor little kid. There's no one left to come.
          emotion: sad
        - id: ch01-b45
          speaker: narrator
          text: >-
            That was how Mary learned, all at once, that she had no father or mother left. They had died and been carried away during the night. The few servants who survived had escaped from the house as quickly as they could. Not one of them remembered the little Missie Sahib.
        - id: ch01-b46
          speaker: narrator
          text: >-
            That was why the bungalow was silent. Mary had been right. There was no one there but her and the little rustling snake.
