audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 克制而敏锐，带一点不动声色的讽意
        timbre: 温暖清晰
        pace: 舒缓中有变化
        pitch: 中音
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts:
        delivery: 任性强硬，话说得短而直接
        timbre: 稚嫩而尖细
        pace: 偏快
        pitch: 偏高
    servant_woman:
      display_name: 陌生女仆
      tts:
        delivery: 畏缩慌张，回答时吞吞吐吐
        timbre: 轻弱
        pace: 迟疑
        pitch: 偏高
    mrs_lennox:
      display_name: 伦诺克斯太太
      tts:
        delivery: 惊恐急促，仍带上流社会女子的腔调
        timbre: 纤细明亮
        pace: 偏快
        pitch: 偏高
    young_officer:
      display_name: 年轻军官
      tts:
        delivery: 紧张严肃，声音因恐惧微微发颤
        timbre: 清亮年轻
        pace: 稍快
        pitch: 中高音
    large_officer:
      display_name: 高大军官
      tts:
        delivery: 疲惫忧虑，受惊时直率高声
        timbre: 浑厚
        pace: 中等
        pitch: 中低音
    barney:
      display_name: 巴尼
      tts:
        delivery: 温和沉重，怜惜中带着克制
        timbre: 年轻柔和
        pace: 缓慢
        pitch: 中音
  chapters:
    - id: ch01
      title: 第一章　谁也没留下
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 玛丽·伦诺克斯后来被送到米塞尔思韦特庄园，跟舅舅生活。那时候，人人都说她是自己见过的、长相最不讨人喜欢的孩子。这倒是实话。她脸小小的，身子瘦瘦的，淡黄色的头发又细又薄，总板着一张不高兴的脸。她生在印度，从小不是这里病，就是那里不舒服，所以头发是黄的，脸色也是黄的。父亲在英国政府任职，忙个不停，自己也总生病。母亲是个大美人，只喜欢赴宴，跟快活的人一起玩乐，根本不想要一个小女孩。玛丽一出生，她就把孩子交给印度奶妈。奶妈也听得明明白白，要想让太太满意，就得尽量别让孩子出现在她眼前。于是，玛丽还是个病弱、哭闹、又难看的小婴儿时，被远远藏着。等她长成病恹恹、爱发脾气、蹒跚学步的小东西，仍旧被远远藏着。她记得的熟面孔，只有奶妈和其他印度仆人那一张张深色的脸。为了不让她哭闹，惹得太太生气，仆人总是听她的话，事事都顺着她。到六岁时，她已经像头专横又自私的小猪猡了。一个年轻的英国女教师来教她读写，厌恶她厌恶得不得了，三个月就辞职走了。后来的人待得比她还短。要不是玛丽自己当真想读书，她大概连字母都学不会。
        - id: ch01-b02
          speaker: narrator
          text: 玛丽九岁左右时，有一天早晨热得吓人。她醒来就一肚子火，再一看床边站的不是自己的奶妈，脾气更坏了。
        - id: ch01-b03
          speaker: mary_lennox
          text: “你来干什么？我不许你留在这里。去把我的奶妈叫来。”
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 陌生女仆吓坏了，只能结结巴巴地解释。
        - id: ch01-b05
          speaker: servant_woman
          text: “奶妈来不了，小小姐。她真的没法过来。”
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: 玛丽大发脾气，又打又踢。女仆更害怕了，只会重复同一句话。那天早晨，空气里藏着一件没人肯说的秘密。日常规矩全乱了，不少仆人没了踪影。偶尔有人出现，也是脸色灰白，满眼惊恐，不是悄悄溜走，就是匆匆跑过。奶妈始终没有来，也没人告诉玛丽出了什么事。上午慢慢过去，她竟被独自撇下了。最后，她走进花园，在走廊边的一棵树下玩。她把鲜红的大木槿插进一堆堆小土丘，假装在修花坛，心里却越来越恼火。她一边玩，一边盘算赛迪回来后该怎么骂她。
        - id: ch01-b07
          speaker: mary_lennox
          text: “猪！猪！你这个猪的女儿！”
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 在印度，管人叫猪已经是很恶毒的辱骂了。玛丽还在咬着牙，把这几句话翻来覆去地念，忽然听见母亲和别人走上走廊。他们站在那里，用又低又怪的声音说话。跟母亲说话的是个金发青年，看起来还像大男孩。玛丽认得他，也听说他是刚从英国来的年轻军官。她盯着他看了一会儿，目光很快又落回母亲身上。她难得见到母亲，每次有机会，都忍不住这样盯着看。她平日甚至很少叫“母亲”，多半只叫她“太太”。这位太太高挑纤细，长得漂亮，衣服也总是美丽。卷发像丝绸，秀气的鼻子仿佛瞧不起一切，那双大眼睛平常总带着笑。她的衣服件件轻薄飘逸。在玛丽看来，上面简直“全是花边”。那天，衣服上的花边似乎比往常还多，可母亲眼里没有一丝笑意。她惊恐地睁大眼睛，恳求似的抬头望着年轻军官。
        - id: ch01-b09
          speaker: mrs_lennox
          text: “真有那么糟吗？真的？”
          emotion: fearful
        - id: ch01-b10
          speaker: young_officer
          text: “糟透了，伦诺克斯太太，真的糟透了。您两个星期前就该去山里的。”
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: 太太绞起了双手。
        - id: ch01-b12
          speaker: mrs_lennox
          text: “我知道，我早该走了！就为了参加那场蠢透了的晚宴，我才留下来。我怎么这么傻！”
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: 就在这时，仆人住的地方忽然传来响亮的哭号。太太一把抓住年轻人的胳膊，玛丽也浑身发抖。那哭声越来越凄厉，越来越疯狂。
        - id: ch01-b14
          speaker: mrs_lennox
          text: “出了什么事？到底怎么了？”
          emotion: fearful
        - id: ch01-b15
          speaker: young_officer
          text: “有人死了。您没告诉我，您的仆人里也有人染了病。”
        - id: ch01-b16
          speaker: mrs_lennox
          text: “我不知道！跟我来，快跟我来！”
          emotion: fearful
        - id: ch01-b17
          speaker: narrator
          text: 她转身冲进屋里。接下来，可怕的事一桩接着一桩，玛丽这才明白那个早晨为什么如此反常。霍乱以最凶猛的势头暴发，人像苍蝇一样死去。奶妈夜里染病，刚刚死了，仆人才会在茅屋里放声哀号。还没到第二天，又死了三个仆人，其他人吓得逃走了。到处都陷入恐慌，每座平房里都有人奄奄一息。
        - id: ch01-b18
          speaker: narrator
          text: 第二天仍旧混乱不堪，人人都不知所措。玛丽躲在育儿室里，所有人都忘了她。没人想起她，也没人要她。外面怪事不断，她却什么都不知道。时间一小时一小时过去，她一会儿哭，一会儿睡，只知道人们病了，四周还不断传来神秘又吓人的声音。有一次，她悄悄走进饭厅。屋里空无一人，桌上的饭只吃了一半。椅子和盘子都像被匆匆推开了，用餐的人似乎遇见了什么事，突然起身离席。玛丽吃了些水果和饼干。她口渴，又喝下杯子里剩下的大半杯酒。酒很甜，她根本不知道有多烈。很快，她困得厉害，只得回到育儿室，再把自己关起来。茅屋里的哭喊和外面急促的脚步让她害怕。酒劲上来，她几乎睁不开眼，只能躺到床上，很久都没再醒来。
        - id: ch01-b19
          speaker: narrator
          text: 她沉睡的几个钟头里，发生了许多事。平房内外的哀号没有惊醒她，东西被搬进搬出的声响也没有惊醒她。
        - id: ch01-b20
          speaker: narrator
          text: 醒来后，玛丽躺着望向墙壁。整座房子一点声音也没有，她从来不知道这里还能这样安静。听不见人说话，也听不见脚步。她想，大家是不是都从霍乱里好起来了，所有麻烦也结束了？奶妈死了，现在又该由谁照顾她呢？应该会换一个新奶妈吧。新奶妈也许知道些新故事，旧故事她已经有点听腻了。她没有为奶妈哭。玛丽不是个重感情的孩子，从来没真正在乎过谁。霍乱带来的喧闹、奔走和哭号叫她害怕。更让她生气的是，没人记得她还活着。所有人都慌得只顾自己，哪还想得起一个谁也不喜欢的小女孩？可要是大家真的都好了，总会有人记起她，过来看看她吧。
        - id: ch01-b21
          speaker: narrator
          text: 可是一个人也没来。玛丽躺在那里一直等，房子却好像越来越静。忽然，草席上传来窸窣声。她低头一看，一条小蛇正从地上滑过，一双眼睛像宝石一样望着她。玛丽一点也不怕。那不过是一条不会伤人的小蛇，看样子还急着离开这个房间。她就这样看着它一路滑到门边，从门底下钻了出去。
        - id: ch01-b22
          speaker: mary_lennox
          text: “这里又怪又安静。好像整座平房里，只剩我和那条蛇了。”
        - id: ch01-b23
          speaker: narrator
          text: 几乎就在下一刻，院子里响起了男人的脚步声，接着又上了走廊。几个男人走进平房，低声交谈。没人迎接他们，也没人回答。他们只好自己一扇扇开门，一间间查看。
        - id: ch01-b24
          speaker: large_officer
          text: “这里怎么成了这副荒凉样子！那个那么漂亮的女人也……我想孩子大概也不在了。听说这里有个孩子，可是谁也没见过她。”
        - id: ch01-b25
          speaker: narrator
          text: 几分钟后，他们打开育儿室的门，发现玛丽正站在屋子中央。她看起来又难看又恼怒，还紧紧皱着眉。肚子已经开始饿了，她觉得这些人把自己冷落得实在不像话。最先走进来的是一个高大的军官，玛丽以前见过他和父亲谈话。那人满脸疲惫，神情忧虑，一看见屋里的孩子，却惊得差点向后跳了一步。
        - id: ch01-b26
          speaker: large_officer
          text: “巴尼！这里还有个孩子！她一个人待在这里，在这样的地方！老天，她是谁？”
          emotion: surprised
        - id: ch01-b27
          speaker: mary_lennox
          text: “我是玛丽·伦诺克斯。大家染上霍乱时，我睡着了，现在才醒。为什么一直没人来？”
        - id: ch01-b28
          speaker: narrator
          text: 她硬邦邦地挺直身子，心想，这人竟把父亲的平房叫成“这样的地方”，真是无礼。
        - id: ch01-b29
          speaker: large_officer
          text: “她就是那个谁也没见过的孩子！他们居然把她忘在这里了！”
          emotion: surprised
        - id: ch01-b30
          speaker: mary_lennox
          text: “他们为什么忘了我？为什么没人来？”
          emotion: angry
        - id: ch01-b31
          speaker: narrator
          text: 玛丽气得直跺脚。名叫巴尼的年轻人悲伤地看着她。她甚至觉得，巴尼眨了眨眼睛，像是想把眼泪忍回去。
        - id: ch01-b32
          speaker: barney
          text: “可怜的小家伙。已经没有人能来了。”
          emotion: sad
        - id: ch01-b33
          speaker: narrator
          text: 玛丽就这样，在如此突然又离奇的情形下得知，自己已经没有父亲，也没有母亲了。他们死后，夜里就被人抬走。没死的几个印度仆人，也以最快的速度逃离这所房子，没有一个想起这里还有位小小姐。所以四周才会如此安静。整座平房里，真的只剩下玛丽，还有那条窸窣爬过的小蛇。
