audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
    martha:
      display_name: 玛莎
      tts: {delivery: 爽直热情，带亲切的约克郡乡音, timbre: 明亮朴实, pace: 轻快, pitch: 中高音}
    dickon:
      display_name: 迪肯
      tts: {delivery: 质朴自在，带浓重而亲切的约克郡乡音, timbre: 清亮温厚，带荒原少年的蓬勃气息, pace: 轻快从容, pitch: 中高音}
    mrs_medlock:
      display_name: 梅德洛克太太
      tts: {delivery: 严厉能干，慌乱时语速陡然加快, timbre: 结实洪亮, pace: 中等, pitch: 中音}
  chapters:
    - id: ch01
      title: 灰色变成绿色
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天早晨，玛丽果然睡过了头。昨夜实在太累，她一直睡到很晚。玛莎送来早餐，说科林虽然已经安静下来，身体却不舒服，还发着烧。他每回大哭大闹，耗光了力气，过后总要这样。玛丽慢慢吃着，听她往下说。
        - id: ch01-b02
          speaker: martha
          text: “小少爷说，请你一得空就去看看他。他这么喜欢你，可真稀奇。昨晚你狠狠收拾了他一顿，对不对？别人谁也不敢。唉，他叫人宠得没救了。妈说，小孩子最倒霉的，一是从来不能如愿，二是什么都能如愿。她也不知道哪个更糟。你昨晚的脾气也够厉害。不过我进房时，小少爷居然说：‘请你问问玛丽小姐，她愿不愿意来陪我说话？’他都会说‘请’了！小姐，你去不去？”
        - id: ch01-b03
          speaker: mary_lennox
          text: “我先跑去见迪肯。不，我先去看看科林，告诉他一件事……我知道该说什么了。”
        - id: ch01-b04
          speaker: narrator
          text: 玛丽戴着帽子进了科林的房间。科林一见她那副要出门的样子，眼里掠过一丝失望。他躺在床上，脸白得可怜，眼圈也是乌青的。
        - id: ch01-b05
          speaker: colin_craven
          text: “你来了，我真高兴。我头疼，浑身也疼，累得要命。你要出去吗？”
        - id: ch01-b06
          speaker: narrator
          text: 玛丽走过去，靠在床沿上。
        - id: ch01-b07
          speaker: mary_lennox
          text: “我不会去很久。我要找迪肯，不过很快就回来。科林，是……是秘密花园的事。”
        - id: ch01-b08
          speaker: narrator
          text: 科林整张脸一下亮了，苍白的面颊也泛起一点颜色。
        - id: ch01-b09
          speaker: colin_craven
          text: “真的是花园？我梦了它整整一夜。你说过，灰色会变成绿色。我就梦见自己站在一个地方，到处都是轻轻发颤的小绿叶。鸟儿伏在一个个巢里，又柔软，又安静。你回来以前，我会一直躺着想它。”
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: 五分钟以后，玛丽已经到了花园。迪肯身边还是跟着狐狸和乌鸦，这回又多了两只驯服的小松鼠。
        - id: ch01-b11
          speaker: dickon
          text: “今儿早晨，我是骑小马过来的。跳跳可真是个好小子！这两个小家伙，我一路装在衣兜里。这只叫果仁，那只叫果壳。”
        - id: ch01-b12
          speaker: narrator
          text: 迪肯一叫“果仁”，一只松鼠便蹿上他的右肩。等他叫“果壳”，另一只立刻跳上左肩。
    - id: ch02
      title: 可别耽误工夫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两个孩子在草地上坐下。上尉蜷在脚边，煤灰端端正正地蹲在树上听着，果仁和果壳就在近旁东闻西嗅。玛丽原本觉得，离开这么快活的地方，简直叫人受不了。可她讲起昨晚的事，看着迪肯脸上的神情一点点改变，自己的心思也跟着变了。迪肯显然比她更可怜科林。他抬头看看天，又望了望四周。
        - id: ch02-b02
          speaker: dickon
          text: “听听这些鸟吧。满世界像全是它们，一个个又吹哨，又啼叫。瞧它们飞来飞去，再听它们互相招呼。春天一到，好像全世界都在喊人哩。叶子也一片片舒展开了。哎呀，四下里真香！”
          emotion: happy
        - id: ch02-b03
          speaker: narrator
          text: 迪肯快活地翘起鼻尖，使劲嗅了嗅。
        - id: ch02-b04
          speaker: dickon
          text: “可那个可怜的小少爷关在屋里，什么也瞧不见，光想着些会把自己吓得尖叫的事。咱们非把他弄出来不可。叫他看看，听听，再闻闻这空气，让阳光把他从里到外浸个透。咱们可别耽误工夫。”
        - id: ch02-b05
          speaker: narrator
          text: 迪肯一旦特别上心，约克郡乡音就会变得很重。平常说话时，他为了让玛丽更容易听懂，总会尽力把乡音收一收。可玛丽偏爱他那口浓重的土话，事实上，她自己也一直在学着怎么说。这会儿，她便当着迪肯的面试了起来。
        - id: ch02-b06
          speaker: mary_lennox
          text: “对，咱们非这么办不可。俺告诉你，第一步该做什么。他可喜欢你哩，想见你，还想见煤灰和上尉。俺回去就问他，你明儿一早能不能去看他，再把那些小家伙也带上。等过些日子，叶子更多了，说不定也开出一两个花苞，咱们就让他出来。你推着轮椅，咱们把他带到这里，什么都给他瞧。”
        - id: ch02-b07
          speaker: narrator
          text: 说完这一大段约克郡话，玛丽很得意。她以前从没说过这么长的一串，而且每句话都记得很准。迪肯听着小丫头费劲扭舌头，早就咧开嘴笑了。玛丽那副一本正经的样子，更叫他觉得有趣。
        - id: ch02-b08
          speaker: dickon
          text: “你也该用这口话跟科林少爷说几句，保准能逗笑他。病人啊，再没有什么比笑更管用了。妈说，每天早晨痛快笑上半个钟头，就连眼看要得伤寒的人也能好起来。”
        - id: ch02-b09
          speaker: mary_lennox
          text: “我今天就说给他听。”
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: 玛丽也咯咯笑了。花园到了这样的时节，每一天，每一夜，都像有魔法师从这里走过。他们挥动魔杖，从泥土里引出花草，也从光秃秃的枝头引出美来。要把这一切留在身后，实在太难了。果仁甚至爬上了玛丽的裙子，果壳也顺着他们所坐的苹果树爬下来，停在那里，用一双探问的眼睛看她。可玛丽还是回了宅子。她刚在床边坐下，科林也学迪肯嗅起鼻子来，只是远没有那么熟练。
        - id: ch02-b11
          speaker: colin_craven
          text: “你身上有花香，还有……新鲜东西的味道。到底是什么味儿？又清凉，又温暖，还甜甜的。”
          emotion: happy
        - id: ch02-b12
          speaker: mary_lennox
          text: “是荒原上的风。跟迪肯、上尉、煤灰、果仁和果壳一起坐在树底下，就会染上这股味儿。这是春天、户外和阳光的气味，可好闻哩。”
    - id: ch03
      title: 约克郡天使
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 玛丽尽力把乡音说到最重。没亲耳听过的人，根本想不到约克郡话能有多浓。科林听着听着，笑了起来。
        - id: ch03-b02
          speaker: colin_craven
          text: “你在做什么呀？我从没听你这样说话。听着真滑稽。”
          emotion: happy
        - id: ch03-b03
          speaker: mary_lennox
          text: “俺在给你说约克郡话哩。俺不像迪肯和玛莎说得那么好，可多少会一点。你听见约克郡话，难道一点不懂？亏你还是土生土长的约克郡小子！哎呀，你竟不害臊。”
          emotion: happy
        - id: ch03-b04
          speaker: narrator
          text: 玛丽也笑起来。两个人越笑越停不住，整间屋子都响着笑声。梅德洛克太太正要推门进来，一听见便退回走廊，惊讶地站在那里。
        - id: ch03-b05
          speaker: mrs_medlock
          text: “我的老天爷！谁听说过这样的事？天底下谁能想得到！”
          emotion: surprised
        - id: ch03-b06
          speaker: narrator
          text: 四下无人，她一惊之下，也冒出了一口很重的约克郡话。屋里，两个孩子还有说不完的事。迪肯、上尉、煤灰、果仁、果壳，还有小马跳跳，科林怎么听也听不够。玛丽已经跟着迪肯绕进树林，亲眼见过跳跳。那是匹小小的荒原矮马，浑身长着粗毛，浓密的鬃毛垂在眼前。它有一张漂亮的脸，还有一只爱在人身上拱来拱去的、天鹅绒似的鼻子。它只靠荒原上的草过活，身子有些瘦，四条小腿却像装着钢弹簧一样结实有力。
        - id: ch03-b07
          speaker: narrator
          text: 跳跳一见迪肯，便抬头轻轻嘶鸣，跑过来把脑袋搭在他肩上。迪肯贴着它耳朵说话，它便用低嘶、喷气和响鼻回答。迪肯还让跳跳把一只前蹄递给玛丽，再用柔软的鼻吻亲她的面颊。
        - id: ch03-b08
          speaker: colin_craven
          text: “迪肯说的话，它真的全都听得懂吗？”
        - id: ch03-b09
          speaker: mary_lennox
          text: “看着就像全懂。迪肯说，只要你真心跟一样东西做朋友，它就会明白你。不过，你得真心实意才行。”
        - id: ch03-b10
          speaker: narrator
          text: 科林安静地躺了一会儿。那双古怪的灰眼睛仿佛一直盯着墙，可玛丽看得出来，他正在认真想心事。
        - id: ch03-b11
          speaker: colin_craven
          text: “我也想跟一些东西做朋友，可我没有朋友。我从来没有什么东西能做朋友，而且我受不了人。”
          emotion: sad
        - id: ch03-b12
          speaker: mary_lennox
          text: “那你也受不了我吗？”
        - id: ch03-b13
          speaker: colin_craven
          text: “你不一样。说来也真怪，我甚至还挺喜欢你。”
        - id: ch03-b14
          speaker: mary_lennox
          text: “本·韦瑟斯塔夫说，我跟他很像，我们俩的坏脾气一模一样。我看你也像他。你、我，还有本，我们三个都一样。他说我们都不怎么好看，脸上有多刻薄，心里就有多刻薄。不过，认识知更鸟和迪肯以后，我已经没从前那么刻薄了。”
        - id: ch03-b15
          speaker: colin_craven
          text: “你从前也觉得自己讨厌别人吗？”
        - id: ch03-b16
          speaker: mary_lennox
          text: “是啊。要是在认识知更鸟和迪肯以前碰见你，我一定会讨厌死你。”
        - id: ch03-b17
          speaker: narrator
          text: 玛丽回答得坦坦荡荡，没有半点装腔作势。科林听完，伸出自己瘦削的手，轻轻碰了碰她。
        - id: ch03-b18
          speaker: colin_craven
          text: “玛丽，我真希望自己没说过要赶走迪肯的话。你说他像天使，我那时恨你，还笑话你。可是……他说不定真的像天使。”
        - id: ch03-b19
          speaker: mary_lennox
          text: “那句话是有点好笑。他鼻子朝上翘，嘴巴又大，满身衣服都是补丁，还说一口很重的约克郡话。可是，如果真有一个天使来到约克郡，住在荒原上……如果真有个约克郡天使……我相信，他一定懂那些绿色的东西，知道怎么让它们生长。他也会跟野生的小动物说话，就像迪肯一样。那些动物一看就知道，他是真心来做朋友的。”
        - id: ch03-b20
          speaker: colin_craven
          text: “我不怕让迪肯看见我。我想见他。”
    - id: ch04
      title: 花园的门
      blocks:
        - id: ch04-b01
          speaker: mary_lennox
          text: “你这样说，我真高兴。因为……因为……”
        - id: ch04-b02
          speaker: narrator
          text: 玛丽忽然明白，现在正是告诉他的时刻。科林也察觉到，又有一件新鲜事要来了。
        - id: ch04-b03
          speaker: colin_craven
          text: “因为什么？快说呀！”
        - id: ch04-b04
          speaker: narrator
          text: 玛丽紧张得从脚凳上站起来。她走到科林身边，一把握住他的两只手。
        - id: ch04-b05
          speaker: mary_lennox
          text: “我能信任你吗？鸟儿信任迪肯，所以我也信任他。那我能不能信任你？真的……真的能吗？”
        - id: ch04-b06
          speaker: narrator
          text: 玛丽说这话时，声音里满是恳求。她的脸严肃极了，科林回答时，声音几乎低成了耳语。
        - id: ch04-b07
          speaker: colin_craven
          text: “能……真的能！”
        - id: ch04-b08
          speaker: mary_lennox
          text: “好。迪肯明天早晨会来看你，还会带上他的小动物。”
        - id: ch04-b09
          speaker: colin_craven
          text: “哦！太好了！”
          emotion: happy
        - id: ch04-b10
          speaker: mary_lennox
          text: “可这还不是全部。后面的事更好。花园有一扇门，我已经找到了。它藏在墙上的常春藤下面。”
        - id: ch04-b11
          speaker: narrator
          text: 要是科林是个强壮健康的男孩，他大概早已连喊三声“万岁”。可他的身体本来就虚弱，又太容易激动。那双眼睛越睁越大，连气也喘不上来了。
        - id: ch04-b12
          speaker: colin_craven
          text: “哦，玛丽！我能看见它吗？我能走进去吗？我能活到走进去的那一天吗？”
          emotion: fearful
        - id: ch04-b13
          speaker: narrator
          text: 他紧抓住玛丽的双手，把她拽向自己。
        - id: ch04-b14
          speaker: mary_lennox
          text: “你当然能看见！当然能活到走进去的那天！别犯傻！”
          emotion: angry
        - id: ch04-b15
          speaker: narrator
          text: 玛丽毫不歇斯底里，神情又自然，又孩子气，就像任何一个普通孩子。科林反倒被她带得清醒过来，开始笑自己刚才的样子。几分钟后，玛丽重新坐回脚凳。她这回告诉他的，不再是自己想象中的花园，而是花园真正的样子。科林忘了浑身的疼痛，也忘了疲倦，只顾入迷地听着。
        - id: ch04-b16
          speaker: colin_craven
          text: “它真的跟你想的一模一样。你说起来，简直像亲眼见过。你第一次给我讲时，我就这样说过，记得吗？”
        - id: ch04-b17
          speaker: narrator
          text: 玛丽迟疑了足足两分钟，最后还是鼓起勇气，说出了实话。
        - id: ch04-b18
          speaker: mary_lennox
          text: “我是亲眼见过，也进去过。几个星期以前，我就找到了钥匙，走进了花园。可我一直不敢告诉你。那时候，我太怕自己不能信任你……不能真正信任你！”
