  chapters:
    - id: ch01
      title: A Promise Before Breakfast
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Of course Mary did not wake early the next morning. She had been so tired that she slept late. When Martha brought breakfast, she said Colin had grown quiet, but he was ill and feverish again. That was how he always felt after wearing himself out in a fit of crying. Mary took her time over breakfast and listened to every word.
        - id: ch01-b02
          speaker: martha
          text: >-
            He wants thee to come see him as soon as tha' can. It's queer, the fancy he's taken to thee. Tha' certainly gave him what for last night, didn't tha'? Nobody else would have dared. Eh, poor lad. He's been spoiled past saving. Mother says the two worst things for a child are never getting his own way and always getting it. She can't decide which is worse. Tha' was in a fine temper too. But when I went into his room, he said, “Please ask Miss Mary if she'll come talk to me.” Just think of him saying please! Will tha' go, Miss?
        - id: ch01-b03
          speaker: mary
          text: >-
            I'll run to see Dickon first. No, I'll see Colin first and tell him... I know what I'll tell him.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The idea had come to her all at once. Mary put on her hat and went to Colin's room. For a moment he looked disappointed to see the hat. He lay in bed, terribly pale, with dark circles under his eyes.
        - id: ch01-b05
          speaker: colin
          text: >-
            I'm glad you're here. My head hurts, and I ache everywhere because I'm so tired. Are you going out?
        - id: ch01-b06
          speaker: narrator
          text: Mary leaned against the side of his bed.
        - id: ch01-b07
          speaker: mary
          text: >-
            I won't be gone long. I'm going to Dickon, but I'll come back. Colin, it's... it's about the secret garden.
        - id: ch01-b08
          speaker: narrator
          text: >-
            His whole face lit up, and a little color returned to it.
        - id: ch01-b09
          speaker: colin
          text: >-
            Oh, is it? I dreamed about it all night! I heard you talking about gray turning green. Then I dreamed I was standing among little green leaves, and they were all trembling. Birds were sitting on nests everywhere, looking soft and still. I'll lie here and think about it until you come back.
          emotion: happy
    - id: ch02
      title: No Time to Lose
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Five minutes later, Mary was in the secret garden with Dickon. The fox and the crow had come again, and this time Dickon had brought two tame squirrels too.
        - id: ch02-b02
          speaker: dickon
          text: >-
            I rode over on the pony this mornin'. Eh, Jump's a good little chap! I carried these two in my pockets. This one's Nut, and the other one's Shell.
        - id: ch02-b03
          speaker: narrator
          text: >-
            At the name Nut, one squirrel sprang onto Dickon's right shoulder. At Shell, the other jumped onto his left. Soon Mary and Dickon sat on the grass. Captain curled at their feet. Soot listened solemnly from a tree, while Nut and Shell nosed around close by. Mary felt she could hardly bear to leave anything so delightful. But then she began telling Dickon what had happened. Little by little, the look on his funny face changed her mind. She could see that he felt even sorrier for Colin than she did. He raised his eyes to the sky, then looked all around him.
        - id: ch02-b04
          speaker: dickon
          text: >-
            Just hear them birds. The whole world's full of 'em, whistlin' and pipin'. Look how they dart about and call to each other. When spring comes, it's like the whole world is callin'. The leaves are uncurlin' where tha' can see 'em, and my word, all the fine smells in the air! And that poor lad lies shut indoors. He sees so little, he starts thinkin' about things till they set him screamin'. Eh, we mun get him out here. We mun get him watchin' and listenin' and sniffin' the air. We mun soak him right through with sunshine, and we munnot waste no time.
        - id: ch02-b05
          speaker: narrator
          text: >-
            When Dickon became deeply interested, he often spoke in very broad Yorkshire. At other times he tried to soften the dialect so Mary could understand him better. But Mary loved his broad Yorkshire. In fact, she had been practicing it herself, so now she answered him with a little Yorkshire of her own.
        - id: ch02-b06
          speaker: mary
          text: >-
            Aye, that we mun. I'll tell thee what we'll do first. He's taken a graidely fancy to thee. He wants to meet thee, and he wants to see Soot and Captain. When I go back, I'll ask if tha' can come see him tomorrow mornin' and bring thy creatures. Then, after more leaves come out, and maybe a bud or two, we'll take him outside. Tha'll push his chair, and we'll bring him here and show him everything.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Mary stopped, feeling very proud. She had never made such a long speech in Yorkshire before, and she had remembered it well. Dickon grinned. Hearing the little girl twist her tongue around the dialect amused him.
        - id: ch02-b08
          speaker: dickon
          text: >-
            Tha' mun talk Yorkshire like that to Mester Colin. It'll make him laugh, and there's nowt better for sick folk than laughin'. Mother says a good half hour of laughter every mornin' might cure a fellow who was gettin' ready for typhus fever.
        - id: ch02-b09
          speaker: mary
          text: >-
            Then I'll talk Yorkshire to him today.
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: >-
            Mary chuckled too. The garden had reached a time when every day and every night felt as if Magicians were passing through. With their wands, they drew loveliness out of the earth and the branches. It was hard to leave it all. Nut had actually crept onto Mary's dress. Shell had scrambled down the trunk of the apple tree where they sat and stayed there, watching her with curious eyes. Still, Mary went back to the house.
    - id: ch03
      title: A Bit of Yorkshire
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Mary sat close beside Colin's bed. He began sniffing the way Dickon did, though he was not nearly as practiced at it.
        - id: ch03-b02
          speaker: colin
          text: >-
            You smell like flowers and... fresh things! What is that smell? It's cool and warm and sweet, all at once.
          emotion: happy
        - id: ch03-b03
          speaker: mary
          text: >-
            It's th' wind off th' moor. Tha' gets it from sittin' under a tree with Dickon, Captain, Soot, Nut, and Shell. It's springtime and outdoors and sunshine that smells so graidely.
        - id: ch03-b04
          speaker: narrator
          text: >-
            She made her Yorkshire as broad as she could. Until you hear someone speak it, you cannot know just how broad Yorkshire can sound. Colin started laughing.
        - id: ch03-b05
          speaker: colin
          text: >-
            What are you doing? You've never talked that way before. It sounds so funny!
          emotion: surprised
        - id: ch03-b06
          speaker: mary
          text: >-
            I'm givin' thee a bit of Yorkshire. I canna' speak it as graidely as Dickon and Martha, but tha' can hear I'm shapin' a bit. Doesn't tha' know Yorkshire when tha' hears it? And tha' a Yorkshire lad, born and bred! Eh, tha' ought to be ashamed of thy face.
          emotion: happy
        - id: ch03-b07
          speaker: narrator
          text: >-
            Mary laughed too. Soon neither child could stop. They laughed until the room rang with it. Mrs. Medlock opened the door to come in, then backed into the corridor and stood listening in amazement.
        - id: ch03-b08
          speaker: mrs_medlock
          text: >-
            Well, upon my word! Whoever heard th' like? Whoever on earth would have thought it?
          emotion: surprised
        - id: ch03-b09
          speaker: narrator
          text: >-
            With no one there to hear her, Mrs. Medlock had slipped into broad Yorkshire herself. She was that astonished. Mary and Colin, meanwhile, had so much to talk about. Colin never seemed to hear enough about Dickon, Captain, Soot, Nut, Shell, or the pony called Jump. Mary had run through the wood with Dickon to see him. Jump was a tiny, shaggy moor pony. Thick locks hung over his eyes. He had a pretty face and a soft, nuzzling velvet nose. Living on moor grass had left him rather thin, but he was tough and wiry. The muscles in his little legs seemed to be made of steel springs.
        - id: ch03-b10
          speaker: narrator
          text: >-
            The moment Jump saw Dickon, he lifted his head and gave a soft whinny. He trotted over and laid his head across Dickon's shoulder. Dickon spoke into his ear, and Jump talked back in a language of little whinnies, puffs, and snorts. Then Dickon had him hold out one small front hoof to Mary and kiss her cheek with his velvet muzzle.
        - id: ch03-b11
          speaker: colin
          text: >-
            Does Jump truly understand everything Dickon tells him?
        - id: ch03-b12
          speaker: mary
          text: >-
            It seems that way. Dickon says anything will understand you if you're truly its friend. But you have to be a true friend.
    - id: ch04
      title: The Door Under the Ivy
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Colin lay quiet for a while. His strange gray eyes seemed to stare at the wall, but Mary could see that he was thinking hard about what she had said.
        - id: ch04-b02
          speaker: colin
          text: >-
            I wish I were friends with things, but I'm not. I've never had anything to be friends with, and I can't stand people.
        - id: ch04-b03
          speaker: mary
          text: Can't you stand me?
        - id: ch04-b04
          speaker: colin
          text: >-
            Yes, I can. It's very odd, but I even like you.
        - id: ch04-b05
          speaker: mary
          text: >-
            Ben Weatherstaff said I was like him. He was sure we both had the same nasty tempers. I think you're like him too. All three of us are alike, you and me and Ben Weatherstaff. He said neither of us was much to look at, and we were as sour as we looked. But I don't feel as sour now that I know the robin and Dickon.
        - id: ch04-b06
          speaker: colin
          text: Did you feel as though you hated everyone?
        - id: ch04-b07
          speaker: mary
          text: >-
            Yes. If I'd met you before I found the robin and Dickon, I would have hated you.
        - id: ch04-b08
          speaker: narrator
          text: Colin reached out with his thin hand and touched her.
        - id: ch04-b09
          speaker: colin
          text: >-
            Mary, I wish I hadn't said I would send Dickon away. When you called him an angel, I hated you and laughed at you. But... maybe he is one.
        - id: ch04-b10
          speaker: mary
          text: >-
            Well, calling him an angel did sound rather funny. His nose turns up, his mouth is big, his clothes are covered in patches, and he talks broad Yorkshire. But if an angel came to Yorkshire and lived on the moor... if there were such a thing as a Yorkshire angel... I think he'd understand green things and know how to make them grow. He'd talk to wild creatures the way Dickon does, and they would know he was truly their friend.
        - id: ch04-b11
          speaker: colin
          text: >-
            I wouldn't mind Dickon looking at me. I want to meet him.
        - id: ch04-b12
          speaker: mary
          text: >-
            I'm glad you said that, because... because...
        - id: ch04-b13
          speaker: narrator
          text: >-
            Suddenly Mary knew this was the moment to tell him. Colin could see that something new was coming.
        - id: ch04-b14
          speaker: colin
          text: Because what?
        - id: ch04-b15
          speaker: narrator
          text: >-
            Mary was so anxious that she left her stool, hurried to the bed, and caught both his hands.
        - id: ch04-b16
          speaker: mary
          text: >-
            Can I trust you? I trusted Dickon because the birds trust him. Can I trust you, truly? Truly?
        - id: ch04-b17
          speaker: narrator
          text: >-
            Her face was so solemn that Colin almost whispered.
        - id: ch04-b18
          speaker: colin
          text: Yes. Yes!
        - id: ch04-b19
          speaker: mary
          text: >-
            Then Dickon will visit you tomorrow morning, and he'll bring his creatures.
        - id: ch04-b20
          speaker: colin
          text: Oh! Oh!
          emotion: happy
        - id: ch04-b21
          speaker: mary
          text: >-
            But that's not everything. The rest is better. There is a door into the garden. I found it. It's hidden under the ivy on the wall.
        - id: ch04-b22
          speaker: narrator
          text: >-
            If Colin had been a strong, healthy boy, he might have shouted “Hooray!” three times. But he was weak and rather hysterical. His eyes opened wider and wider, and he struggled for breath.
        - id: ch04-b23
          speaker: colin
          text: >-
            Oh, Mary! Will I see it? Will I get inside? Will I live long enough to go in?
          emotion: fearful
        - id: ch04-b24
          speaker: narrator
          text: >-
            With a half sob, he clutched her hands and pulled her toward him.
        - id: ch04-b25
          speaker: mary
          text: >-
            Of course you'll see it! Of course you'll live long enough to go in! Don't be silly!
          emotion: angry
        - id: ch04-b26
          speaker: narrator
          text: >-
            Mary was so matter-of-fact, so completely unhysterical and childlike, that Colin came back to his senses. He began laughing at himself. A few minutes later, Mary was sitting on her stool again. This time she was not telling him what she imagined the secret garden might be like. She told him what it really was. Colin forgot every ache and all his tiredness as he listened, completely enchanted.
        - id: ch04-b27
          speaker: colin
          text: >-
            It's exactly the way you thought it would be. It sounds as though you've truly seen it. Remember? I said that the first time you told me about it.
        - id: ch04-b28
          speaker: narrator
          text: >-
            For about two whole minutes, Mary said nothing. She hesitated there beside Colin's bed. Then, all at once, she spoke boldly and told him the truth.
        - id: ch04-b29
          speaker: mary
          text: >-
            I had seen it. I'd been inside. I found the key and went in weeks ago. But I didn't dare tell you. I was afraid I couldn't truly trust you!
