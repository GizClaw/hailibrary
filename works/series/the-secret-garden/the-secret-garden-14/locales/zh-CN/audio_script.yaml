audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    martha:
      display_name: 玛莎
      tts: {delivery: 爽直热情，带亲切的约克郡乡音, timbre: 明亮朴实, pace: 轻快, pitch: 中高音}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
    dr_craven:
      display_name: 克雷文医生
      tts: {delivery: 谨慎克制，话里带着医生的权威和忧虑, timbre: 沉稳清晰, pace: 中等, pitch: 中低音}
    mrs_medlock:
      display_name: 梅德洛克太太
      tts: {delivery: 严厉能干，慌乱时语速陡然加快, timbre: 结实洪亮, pace: 中等, pitch: 中音}
  chapters:
    - id: ch01
      title: 玛莎的惊恐
      blocks:
        - {id: ch01-b01, speaker: narrator, text: 清晨，荒原还藏在雾里，大雨也一直没有停。玛丽不能出门。玛莎忙了整整一上午，她找不到机会说话，直到下午才把玛莎叫进育儿室。玛莎坐下来，手里还拿着那只总也织不完的袜子。}
        - {id: ch01-b02, speaker: martha, text: “你这是怎么了？一看就知道，你有话憋着要说。”}
        - {id: ch01-b03, speaker: mary_lennox, text: “当然有。我已经知道那哭声是谁发出来的了。”}
        - {id: ch01-b04, speaker: narrator, text: 玛莎的毛线活儿一下落到膝上。她惊恐地瞪着玛丽。}
        - {id: ch01-b05, speaker: martha, text: “不会吧！你不可能知道！” , emotion: surprised}
        - {id: ch01-b06, speaker: mary_lennox, text: “昨晚我又听见哭声，就起床找了过去。哭的人是科林。我见到他了。”}
        - {id: ch01-b07, speaker: narrator, text: 玛莎吓得整张脸都红了，急得几乎当场哭出来。}
        - {id: ch01-b08, speaker: martha, text: “哎哟，玛丽小姐，你怎么能去呢！这下我可要倒霉了。我从没跟你说过他的事，可梅德洛克太太准会怪我。我丢了差事，我娘怎么办呀！” , emotion: fearful}
        - {id: ch01-b09, speaker: mary_lennox, text: “你不会丢差事。科林很高兴我去了。我们聊了很久，他亲口说喜欢我去看他。”}
        - {id: ch01-b10, speaker: martha, text: “他真这么说？你敢肯定吗？你是不知道，他被什么事惹恼以后有多可怕。他这么大了还像小娃娃一样哭，一发脾气就拼命尖叫，存心把我们都吓坏。他知道我们在他面前连自己都做不了主，谁也不敢违抗他。”}
        - {id: ch01-b11, speaker: mary_lennox, text: “他没有恼。我问要不要走，他偏要我留下。他问我很多问题，我坐在大脚凳上，给他讲印度、知更鸟和花园。他还给我看了母亲的画像。后来我唱歌哄他睡着了。”}
        - {id: ch01-b12, speaker: narrator, text: 玛莎惊得直吸气，怎么也不敢相信。她说玛丽简直像径直闯进了狮子窝。科林要是跟平常一样，早就大发脾气，把整座宅子都闹醒了。他从不肯让生人看他，更别说跟一个刚认识的人聊上半夜。}
        - {id: ch01-b13, speaker: mary_lennox, text: “可他让我看了。我们俩一直互相盯着瞧。”}
        - {id: ch01-b14, speaker: martha, text: “我真不知道怎么办才好。梅德洛克太太会以为是我违背了吩咐。她会把我赶回娘家的。” , emotion: fearful}
        - {id: ch01-b15, speaker: mary_lennox, text: “科林暂时不会告诉她。这件事起初要保密。再说，他说人人都得顺着他的意思。”}
        - {id: ch01-b16, speaker: martha, text: “这倒是真的。那个坏小子！”}
        - {id: ch01-b17, speaker: mary_lennox, text: “梅德洛克太太也得听他的。他要我每天去陪他说话。他想见我时，由你来告诉我。”}
        - {id: ch01-b18, speaker: martha, text: “由我来？那我准会丢掉差事！”}
        - {id: ch01-b19, speaker: mary_lennox, text: “你照他的命令做，怎么会丢差事？这里的人不是都得服从他吗？”}
        - {id: ch01-b20, speaker: martha, text: “这么说，他对你很好？” , emotion: surprised}
        - {id: ch01-b21, speaker: mary_lennox, text: “我觉得他差不多有点喜欢我。”}
        - {id: ch01-b22, speaker: martha, text: “那一定是你对他施了魔法。”}
        - {id: ch01-b23, speaker: mary_lennox, text: “真正的魔法吗？我在印度听说过，可我不会。我走进房间，看见他就愣住了。他回过头，也愣愣地看我。他以为我是鬼或者一场梦，我也怀疑他不是真的。半夜里，两个互不认识的人单独待在一起，实在太古怪了。后来我们就问起彼此。他不许我离开。”}
        - {id: ch01-b24, speaker: martha, text: “这个世道真是要到头了！” , emotion: surprised}
        - {id: ch01-b25, speaker: mary_lennox, text: “他到底得的什么病？”}
        - {id: ch01-b26, speaker: martha, text: “谁也说不清。他出生时，克雷文太太死了，克雷文先生像发了疯。医生甚至觉得要把他送进疯人院。他连那个刚出生的孩子都不肯看一眼，只顾疯疯癫癫地嚷，说这孩子也会像他一样驼背，还不如死了。”}
        - {id: ch01-b27, speaker: mary_lennox, text: “可科林不是驼背呀。我看不出来。”}
        - {id: ch01-b28, speaker: martha, text: “现在不是，可他从出生起就什么都不顺。我娘说，宅子里又是悲痛又是狂乱，任哪个孩子都能给弄坏。他们怕他的背太弱，一直小心护着，老让他躺着，不许他走路。有一回还给他穿了副支架，他又哭又闹，结果真的病倒了。后来伦敦来了一位大医生，叫人赶紧把支架脱掉。他对别的医生说话很不客气，不过态度还算有礼。他说，药吃得太多了，也太纵着科林为所欲为了。”}
        - {id: ch01-b29, speaker: mary_lennox, text: “我也觉得他给惯坏了。”}
        - {id: ch01-b30, speaker: martha, text: “他是天底下最坏的小犟驴。不过我也不能说，他没生过几场大病。咳嗽伤风有两三回差点要了命，还得过风湿热和伤寒。伤寒那次，他烧得神志不清。梅德洛克太太以为他什么都不知道，就对护士说，他这回准会死，对他自己和大家都是好事。可她一回头，科林正睁着那双大眼睛看她，清醒得跟她一样。她吓得不知道会发生什么。科林只盯着她，说：‘给我水喝，别再说了。’”}
        - {id: ch01-b31, speaker: mary_lennox, text: “你觉得他真的会死吗？”}
        - {id: ch01-b32, speaker: martha, text: “我娘说，一个孩子不呼吸新鲜空气，整天仰面躺着，只知道看图画书、吃药，哪有活得好的道理。他身子弱，又嫌让人抱他出门太麻烦。他还特别容易着凉，总说一着凉就会生病，所以更不肯出去。”}
        - {id: ch01-b33, speaker: narrator, text: 玛丽坐在那里，静静望着炉火。她慢慢想起自己来到花园以后发生的变化，也想起看着万物生长给自己带来的好处。}
        - {id: ch01-b34, speaker: mary_lennox, text: “要是让他去花园里，看东西一点点长出来，也许会对他有好处。那对我就很有用。”}
        - {id: ch01-b35, speaker: martha, text: “他闹得最凶的一回，就是有人把他抱到喷泉边的玫瑰丛。他刚在报上读到，有些人会得一种叫‘玫瑰伤风’的病，就开始打喷嚏，硬说自己也得了。偏偏一个新来的园丁不懂规矩，从旁边经过，好奇地看了他一眼。科林立刻大发脾气，说那人盯着他，是因为他要变成驼背了。他一直哭到发烧，整整病了一夜。”}
        - {id: ch01-b36, speaker: mary_lennox, text: “他要是敢对我发脾气，我就再也不去看他。”}
        - {id: ch01-b37, speaker: martha, text: “只要他想见你，就会把你叫去。这一点你最好现在就明白。”}
        - {id: ch01-b38, speaker: narrator, text: 很快，铃响了。玛莎把毛线活儿卷起来，说大概是护士要她去陪科林一会儿，但愿少爷心情不错。她离开了差不多十分钟。回来时，脸上的神情既迷惑又不敢相信。}
        - {id: ch01-b39, speaker: martha, text: “得，你真给他施了魔法。他已经起来了，坐在长沙发上看图画书。他命令护士六点以前都不准回来，还要我一直守在隔壁。护士刚一走，他就叫我过去，说要玛丽·伦诺克斯来陪他说话，还提醒我，绝不能把这件事告诉别人。你最好赶快去吧。”}
        - {id: ch01-b40, speaker: narrator, text: 玛丽很乐意马上动身。她想见科林的心虽然远没有想见迪肯那么迫切，可她确实非常想再见到这个古怪的表弟，听听他还会说些什么。}
    - id: ch02
      title: 小王公发号施令
      blocks:
        - {id: ch02-b01, speaker: narrator, text: 科林的房间里炉火明亮。玛丽在白天才真正看清，这是一间非常漂亮的屋子。地毯和帷幔色彩浓郁，墙上挂着画，四周摆满书。窗外虽然是灰暗的天和纷飞的雨，屋子里依然温暖又明亮。科林自己也很像画里的人。他裹着天鹅绒睡袍，靠在一只硕大的锦缎软垫上，两边脸颊各有一块红晕。}
        - {id: ch02-b02, speaker: colin_craven, text: “进来。我整个上午都在想你。”}
        - {id: ch02-b03, speaker: mary_lennox, text: “我也在想你。玛莎快吓坏了。她怕梅德洛克太太以为是她泄了密，再把她赶走。”}
        - {id: ch02-b04, speaker: narrator, text: 科林皱起眉，叫玛丽把隔壁的玛莎带进来。玛莎进门时，吓得两条腿都在发抖。}
        - {id: ch02-b05, speaker: colin_craven, text: “我叫你做什么，你是不是就得做什么？”}
        - {id: ch02-b06, speaker: martha, text: “是的，少爷。您吩咐什么，我就得做什么。” , emotion: fearful}
        - {id: ch02-b07, speaker: colin_craven, text: “梅德洛克也得听我的，是不是？”}
        - {id: ch02-b08, speaker: martha, text: “这里人人都得听您的，少爷。”}
        - {id: ch02-b09, speaker: colin_craven, text: “那是我命令你把玛丽小姐带来的。梅德洛克发现以后，凭什么赶你走？”}
        - {id: ch02-b10, speaker: martha, text: “请您千万别让她赶我走，少爷。” , emotion: fearful}
        - {id: ch02-b11, speaker: colin_craven, text: “她敢说半个字，我就把她赶走。她准不喜欢这个。”}
        - {id: ch02-b12, speaker: martha, text: “谢谢您，少爷。我只想尽好自己的本分。”}
        - {id: ch02-b13, speaker: colin_craven, text: “我要你做的就是你的本分。我会照应你。现在出去吧。”}
        - {id: ch02-b14, speaker: narrator, text: 玛莎连忙道谢，说自己只想尽好本分。科林却摆出更威风的样子，告诉她，他要她做的就是她的本分，他自然会照应她。玛莎屈膝行礼，走了出去。房门一关，科林便发现玛丽正盯着他，仿佛在琢磨一件新鲜事。}
        - {id: ch02-b15, speaker: colin_craven, text: “你为什么这样看我？在想什么？”}
        - {id: ch02-b16, speaker: mary_lennox, text: “我在想两件事。”}
        - {id: ch02-b17, speaker: colin_craven, text: “是哪两件？坐下来告诉我。”}
        - {id: ch02-b18, speaker: mary_lennox, text: “先说第一件。我在印度见过一个当王公的男孩。他浑身上下都镶着红宝石、祖母绿和钻石。他对手下讲话，就跟你刚才对玛莎一模一样。谁都得照他的命令办，一刻也不能耽搁。我想，不听命令的人也许会被杀掉。”}
        - {id: ch02-b19, speaker: colin_craven, text: “王公的故事待会儿再讲。你想的第二件事呢？”}
        - {id: ch02-b20, speaker: mary_lennox, text: “你跟迪肯真是完全不一样。”}
        - {id: ch02-b21, speaker: colin_craven, text: “迪肯是谁？这个名字真怪。”}
        - {id: ch02-b22, speaker: narrator, text: 玛丽想，告诉他也没什么。谈迪肯的时候，她完全可以不提秘密花园。她一直喜欢听玛莎讲弟弟的事，现在自己也渴望谈起他。好像只要把迪肯的事说出来，就能让他离自己近一些。}
        - {id: ch02-b23, speaker: mary_lennox, text: “他是玛莎的弟弟，十二岁。世界上没有别人像他。他能迷住狐狸、松鼠和鸟，就像印度的弄蛇人迷住蛇。他轻轻吹笛子，那些动物就来听。”}
        - {id: ch02-b24, speaker: narrator, text: 科林身边的桌上放着几本大书。他突然把其中一本拖到面前，告诉玛丽，书里正好有弄蛇人的画。那本书装帧精美，里面全是华丽的彩色插图。科林飞快翻到那一页，急着叫玛丽过来看。}
        - {id: ch02-b25, speaker: colin_craven, text: “迪肯也能这样吗？”}
        - {id: ch02-b26, speaker: mary_lennox, text: “他吹起笛子，那些动物就在一旁听。可迪肯不说那是魔法。他说自己常年待在荒原上，所以懂得它们的习性。他太喜欢那些动物，有时觉得自己也像一只鸟或者一只兔子。我还觉得他问过知更鸟一些话。它们用轻轻的啾啾声交谈，就像真的听得懂彼此。”}
        - {id: ch02-b27, speaker: narrator, text: 科林靠回软垫，眼睛越睁越大。那双眼睛本来就大，此刻显得更不寻常。脸上的两块红晕也烧得更鲜艳了。}
        - {id: ch02-b28, speaker: colin_craven, text: “再多讲一点。”}
        - {id: ch02-b29, speaker: mary_lennox, text: “他认得各种蛋和鸟巢，也知道狐狸、獾和水獭住在哪儿。他替它们守住秘密，不让别的男孩去洞口吓它们。荒原上凡是会长、会活的东西，他全都懂。”}
        - {id: ch02-b30, speaker: colin_craven, text: “那片荒原又大又空，还那么阴沉，他怎么会喜欢？”}
        - {id: ch02-b31, speaker: mary_lennox, text: “那是天底下最美的地方。成千上万种可爱的东西在那里生长。还有成千上万只小动物，一只只都忙着筑巢、挖洞、打地穴，互相啾啾地叫，唱歌，或者吱吱说话。它们在地底下、树上和石南丛里忙个不停，各自做着自己的事，也快活极了。那里就是它们自己的世界。”}
        - {id: ch02-b32, speaker: colin_craven, text: “你怎么会知道这么多？”}
        - {id: ch02-b33, speaker: mary_lennox, text: “其实我一次也没真正去过。我只在黑夜里坐车穿过，当时还觉得难看极了。起初是玛莎讲给我听，后来是迪肯。迪肯一开口，你就好像亲眼看见、亲耳听见了一切。你会觉得自己正站在石南丛里，阳光照在身上，荆豆花散发着蜂蜜一样的香气，四周全是蜜蜂和蝴蝶。”}
        - {id: ch02-b34, speaker: colin_craven, text: “一个人生了病，整天关在房间里，就什么也看不见。”}
        - {id: ch02-b35, speaker: narrator, text: 科林烦躁起来。他看上去像是听见远处传来一种从未听过的声音，正侧耳听着，又怎么也猜不出那究竟是什么。}
        - {id: ch02-b36, speaker: mary_lennox, text: “总待在屋里，当然什么都看不见。”}
        - {id: ch02-b37, speaker: colin_craven, text: “可我不能去荒原。”}
        - {id: ch02-b38, speaker: narrator, text: 玛丽沉默了好一会儿，随后大胆说出了心里忽然冒出的念头。}
        - {id: ch02-b39, speaker: mary_lennox, text: “也许以后有一天，你能去。”}
        - {id: ch02-b40, speaker: colin_craven, text: “去荒原？我怎么可能去？我就要死了。”}
    - id: ch03
      title: 说活着的事
      blocks:
        - {id: ch03-b01, speaker: narrator, text: 玛丽一点也不同情他。她不喜欢科林谈论死亡时的口气，总觉得他几乎是在拿这件事夸耀。}
        - {id: ch03-b02, speaker: mary_lennox, text: “你怎么知道自己会死？”}
        - {id: ch03-b03, speaker: colin_craven, text: “从我记事起，就一直听见他们这么说。他们总以为我没注意，偷偷议论。他们也希望我死。” , emotion: angry}
        - {id: ch03-b04, speaker: narrator, text: 玛丽立刻起了唱反调的心。她抿紧嘴唇。}
        - {id: ch03-b05, speaker: mary_lennox, text: “如果他们希望我死，我偏不死。是谁盼着你死？”}
        - {id: ch03-b06, speaker: colin_craven, text: “那些仆人，还有克雷文医生。我死了，他就能得到米塞尔斯韦特，从穷人变成富人。他不敢说，可我的病越重，他看起来越高兴。我得伤寒时，他的脸都胖了。我想父亲也希望我死。”}
        - {id: ch03-b07, speaker: mary_lennox, text: “我不信你父亲会这样。”}
        - {id: ch03-b08, speaker: colin_craven, text: “你不信？” , emotion: surprised}
        - {id: ch03-b09, speaker: narrator, text: 玛丽这句话说得十分固执。科林又转过头来看她，像是从没想到会有人这样回答。接着，他躺回软垫，静静想着什么。屋里很久没有声音。也许两个孩子都在想一些孩子平常不会想的怪事。}
        - {id: ch03-b10, speaker: mary_lennox, text: “我喜欢伦敦来的那位大医生。是他叫人脱掉铁支架的。他说过你会死吗？”}
        - {id: ch03-b11, speaker: colin_craven, text: “没有。”}
        - {id: ch03-b12, speaker: mary_lennox, text: “那他说了什么？”}
        - {id: ch03-b13, speaker: colin_craven, text: “他没有小声嘀咕，也许知道我讨厌别人那样。他有句话说得很响，我听见了。他说：‘只要这孩子决心活下去，就可能活下来。想办法让他起这个念头。’听起来，他当时在生气。”}
        - {id: ch03-b14, speaker: mary_lennox, text: “也许我知道谁能让你起这个念头。迪肯大概能。他总是谈活着的东西，从不谈死掉的，也不谈生病的。他老是抬头望着天空，看鸟怎么飞。要不就低头看地面，找什么东西正在生长。他有一双圆圆的蓝眼睛，因为到处看个不停，总是睁得大大的。他张开那张阔嘴笑时，笑声特别响，两边脸颊红得就像樱桃。”}
        - {id: ch03-b15, speaker: narrator, text: 玛丽把脚凳挪近长沙发。想到迪肯弯弯的阔嘴和总在四处张望的眼睛，她整张脸都变了。}
        - {id: ch03-b16, speaker: mary_lennox, text: “听我说，别谈死了，我不喜欢。我们来说活着的事。一直说迪肯，然后再看你的画。”}
        - {id: ch03-b17, speaker: narrator, text: 这句话说得再好不过。说迪肯，就会说起荒原，说起他家那座小屋，说起每星期只靠十六先令生活的一家十四口，还会说起那些像荒原野马一样吃草也能长胖的孩子。他们又谈迪肯的母亲、那根跳绳、阳光照着的荒原，还有从黑土里钻出的淡绿色尖芽。所有这些都是活生生的。玛丽从没一口气说过这么多话，科林也从没像今天这样不停地听，又不停地说。渐渐地，两个孩子为一点无关紧要的小事笑起来。孩子们在一起快活时，本来就会这样。最后，他们笑闹出的动静，跟两个普通、健康、天性自然的十岁孩子一模一样。谁也想不到，一个原本冷硬、不懂爱人的小姑娘，正陪着一个病弱的男孩。那个男孩还一直相信，自己很快就会死去。}
        - {id: ch03-b18, speaker: narrator, text: 两人玩得太快活，早把说好要看的图画忘得一干二净，也完全忘了时间。他们正说着本·韦瑟斯塔夫和他的知更鸟，为那些小事放声大笑。科林竟然一直坐直了身子，仿佛连自己那条所谓虚弱的脊背也忘在脑后。这时，他忽然想起一件事。}
        - {id: ch03-b19, speaker: colin_craven, text: “有件事，我们居然一次也没想起来。我们俩是表姐弟。”}
        - {id: ch03-b20, speaker: narrator, text: 他们已经谈了那么久，却始终没记起这个最简单的事实，实在古怪得可笑。两个孩子正好有了那种无论遇见什么都想笑的兴致，于是笑得比刚才更厉害。就在这一片欢笑声中，房门忽然打开，克雷文医生和梅德洛克太太一起走进房间。}
    - id: ch04
      title: 她让我忘记
      blocks:
        - {id: ch04-b01, speaker: narrator, text: 克雷文医生吓了一跳。他无意中撞到梅德洛克太太，害得她差点向后摔倒。}
        - {id: ch04-b02, speaker: mrs_medlock, text: “上帝啊！上帝啊！” , emotion: surprised}
        - {id: ch04-b03, speaker: dr_craven, text: “这是怎么回事？这究竟是什么意思？”}
        - {id: ch04-b04, speaker: narrator, text: 玛丽又想起了印度的男孩王公。科林开口回答时，医生的惊慌和梅德洛克太太的恐惧仿佛都不值一提。哪怕走进来的只是一只上了年纪的猫和一条上了年纪的狗，他也不会比现在更加镇定，更加毫不在意。}
        - {id: ch04-b05, speaker: colin_craven, text: “这是我的表姐玛丽·伦诺克斯。是我请她来陪我说话的。我喜欢她。以后只要我叫她，她就必须来。”}
        - {id: ch04-b06, speaker: narrator, text: 克雷文医生责怪地看向梅德洛克太太。}
        - {id: ch04-b07, speaker: mrs_medlock, text: “先生，我真不知道怎么会这样。宅子里没有哪个仆人敢乱说，他们全都领过命令。” , emotion: fearful}
        - {id: ch04-b08, speaker: colin_craven, text: “没有人告诉她。她听见我哭，自己找到这里。我很高兴她来了。梅德洛克，别犯傻。”}
        - {id: ch04-b09, speaker: narrator, text: 医生明显不高兴，却不敢反对病人。他在床边坐下，伸手摸了摸科林的脉搏。}
        - {id: ch04-b10, speaker: dr_craven, text: “我担心你太兴奋了。孩子，受到太多刺激对你不好。”}
        - {id: ch04-b11, speaker: colin_craven, text: “不让她来，我才会激动。我已经好多了，是她让我好起来的。叫护士把她的茶和我的一起送来。我们要一起喝茶。” , emotion: angry}
        - {id: ch04-b12, speaker: narrator, text: 医生和梅德洛克太太不安地对望了一眼。他们脸上都写着为难，可谁也想不出一句能够反驳科林的话。眼下显然毫无办法，只能照他的意思办。}
        - {id: ch04-b13, speaker: mrs_medlock, text: “少爷的脸色确实好一些了，先生。不过话说回来，她今天进屋以前，少爷早上的脸色就已经比平常好了些。”}
        - {id: ch04-b14, speaker: colin_craven, text: “她昨晚就来过，陪了我很久。她唱了一支印度斯坦语的歌，哄我睡着。我醒来以后感觉好多了，还想吃早饭。现在我想喝茶。梅德洛克，去告诉护士。”}
        - {id: ch04-b15, speaker: narrator, text: 克雷文医生没有久留。护士进来以后，他先跟她谈了几分钟，又叮嘱科林几句话。他不可以说太多话，不可以忘记自己还在生病，也不可以忘记自己很容易疲倦。玛丽在一旁听着，只觉得医生要科林牢牢记住的，偏偏全是些叫人不舒服的事。}
        - {id: ch04-b16, speaker: narrator, text: 科林烦躁地看着医生，浓黑睫毛下的眼睛一刻也没有移开。}
        - {id: ch04-b17, speaker: colin_craven, text: “我就是想忘记生病。她能让我忘掉，所以我才要她来。”}
        - {id: ch04-b18, speaker: narrator, text: 克雷文医生离开时并不快活。他困惑地看了坐在大脚凳上的玛丽一眼。医生一进门，她就又变成那个僵硬、沉默、拒人于千里之外的孩子。他实在看不出这个小姑娘有什么吸引人的地方，也不明白科林为什么非要她陪着。不过，那男孩的确比平时更有精神，脸也更明亮了。医生沿着长廊走远时，沉沉地叹了一口气。}
        - {id: ch04-b19, speaker: narrator, text: 医生走后，护士把两人的茶点端进房间，放在长沙发旁的小桌上。热腾腾的松饼也摆在了科林眼前。}
        - {id: ch04-b20, speaker: colin_craven, text: “我不想吃的时候，他们总逼我吃。不过今天你肯吃，我就吃。那些松饼看起来又香又热。现在给我讲讲王公吧。”}
