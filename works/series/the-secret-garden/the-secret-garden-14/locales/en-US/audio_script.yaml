audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    martha:
      display_name: Martha Sowerby
      tts:
        delivery: cheerful, candid, and easy in Yorkshire character
        timbre: bright and wholesome
        pace: lively
        pitch: medium-high
    colin:
      display_name: Colin Craven
      tts:
        delivery: commanding, fretful, and intensely curious
        timbre: delicate and clear
        pace: measured
        pitch: high
    dr_craven:
      display_name: Dr. Craven
      tts:
        delivery: careful, professional, and quietly uneasy
        timbre: dry and restrained
        pace: measured
        pitch: medium-low
    mrs_medlock:
      display_name: Mrs. Medlock
      tts:
        delivery: brisk, anxious, and deferential under pressure
        timbre: firm and full
        pace: moderately brisk
        pitch: medium
  chapters:
    - id: ch01
      title: A Rainy-Day Secret
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Morning found the moor buried in mist, with rain still pouring down. Mary could not go outside. Martha was busy until afternoon, when Mary asked her to sit in the nursery. Martha came in with the stocking she knitted whenever her hands were free.
        - id: ch01-b02
          speaker: martha
          text: >-
            What's happened to thee? Tha' looks like there's something tha' needs to tell me.
        - id: ch01-b03
          speaker: mary
          text: >-
            There is. I found out who was crying.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Martha's knitting dropped onto her knee. She stared at Mary in alarm.
        - id: ch01-b05
          speaker: martha
          text: >-
            Tha' never did! Truly?
          emotion: surprised
        - id: ch01-b06
          speaker: mary
          text: >-
            I heard him last night, so I got up and followed the sound. It was Colin. I found him.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Fright flooded Martha's face until it turned red. She looked close to tears as she imagined Mrs. Medlock blaming her for the discovery.
        - id: ch01-b08
          speaker: martha
          text: >-
            Oh, Miss Mary, tha' shouldn't have gone! This will get me in trouble. I never told thee about him, but they'll blame me. I'll lose my place, and what will Mother do then?
          emotion: fearful
        - id: ch01-b09
          speaker: mary
          text: >-
            You won't be sent away. He was pleased I came. We talked for a long time, and he said he was glad.
        - id: ch01-b10
          speaker: martha
          text: >-
            Was he really? Art tha' certain? Tha' hasn't seen him when he's vexed. He's far too big to cry like a baby, but in a passion he'll scream just to terrify us. He knows none of us dares stand up to him.
        - id: ch01-b11
          speaker: mary
          text: >-
            He wasn't angry. I asked whether I ought to leave, and he made me stay. I sat on a footstool and told him about India, the robin, and gardens. He showed me his mother's picture. Then I sang until he fell asleep.
        - id: ch01-b12
          speaker: narrator
          text: Martha gasped.
        - id: ch01-b13
          speaker: martha
          text: >-
            I can hardly believe it. It's like walking straight into a lion's den. Most times he'd have thrown a fit and woken the whole house. He won't let strangers even look at him.
          emotion: surprised
        - id: ch01-b14
          speaker: mary
          text: >-
            He let me look. We stared at each other the whole time.
        - id: ch01-b15
          speaker: martha
          text: >-
            What am I going to do? If Mrs. Medlock learns about this, she'll think I broke her orders. She'll send me straight home.
          emotion: fearful
        - id: ch01-b16
          speaker: mary
          text: >-
            Colin won't tell Mrs. Medlock anything yet. At first, it's going to be our secret. Besides, he says everyone must do whatever he wants.
        - id: ch01-b17
          speaker: martha
          text: >-
            Aye, that's true enough. The bad lad.
        - id: ch01-b18
          speaker: narrator
          text: Martha sighed and wiped her forehead with her apron.
        - id: ch01-b19
          speaker: mary
          text: >-
            He says Mrs. Medlock has to obey him too. He wants me to visit every day, and you're supposed to tell me when he sends for me.
        - id: ch01-b20
          speaker: martha
          text: >-
            Me? I'll lose my place for certain!
          emotion: fearful
        - id: ch01-b21
          speaker: mary
          text: >-
            Not if you're carrying out his orders. Everyone has been told to obey him.
        - id: ch01-b22
          speaker: martha
          text: >-
            Does tha' mean he was actually nice to thee?
          emotion: surprised
        - id: ch01-b23
          speaker: mary
          text: I think he almost liked me.
        - id: ch01-b24
          speaker: martha
          text: >-
            Then tha' must have put a spell on him!
          emotion: surprised
        - id: ch01-b25
          speaker: narrator
          text: Martha drew a long breath, as if that settled the mystery.
        - id: ch01-b26
          speaker: mary
          text: >-
            Do you mean Magic? I heard about Magic in India, but I don't know how to make it. I only walked into his room and stared because I was so surprised. He stared back. He thought I was a ghost or a dream, and I wondered the same thing about him. There we were, alone in the middle of the night, knowing nothing about each other. We began asking questions. When I offered to leave, he told me not to.
        - id: ch01-b27
          speaker: martha
          text: >-
            The world's coming to an end!
          emotion: surprised
        - id: ch01-b28
          speaker: mary
          text: What's really wrong with him?
        - id: ch01-b29
          speaker: martha
          text: >-
            Nobody knows for certain. Mr. Craven nearly lost his mind when the boy was born. The doctors thought he might have to go to an asylum. Mrs. Craven had died, like I told thee, and he refused to look at the baby. He raved that the child would grow into another hunchback and would be better off dead.
        - id: ch01-b30
          speaker: mary
          text: Is Colin a hunchback? He didn't look like one.
        - id: ch01-b31
          speaker: martha
          text: >-
            Not yet. But everything went wrong from the beginning. Mother says all the grief and raging in that house could set any child wrong. They feared his back was weak, so they were always protecting it. They kept him lying down and wouldn't let him walk. Once they put him in a brace. He fretted until he was terribly ill. Then a great doctor came and ordered them to take it off. He spoke sharply to the other doctor, though he did it politely. He said Colin had been given too much medicine and far too much of his own way.
        - id: ch01-b32
          speaker: mary
          text: I think he's terribly spoiled.
        - id: ch01-b33
          speaker: martha
          text: >-
            He's the worst young creature there ever was! Mind, he has truly been ill a good deal. Coughs and colds have nearly killed him two or three times. He had rheumatic fever once, and typhoid once. That typhoid gave Mrs. Medlock a fright. He'd been delirious, and she spoke to the nurse as if he couldn't hear or understand. She said he'd surely die that time, and it would be best for him and everybody else. Then she happened to look at the bed. His great eyes were open. He was staring straight at her, as sensible as she was, and he had understood every word.
        - id: ch01-b34
          speaker: martha
          text: >-
            He only stared at her and said, “Bring me water, and stop talking.”
        - id: ch01-b35
          speaker: mary
          text: Do you think he'll die?
        - id: ch01-b36
          speaker: martha
          text: >-
            Mother says any child might die if he gets no fresh air and does nothing but lie flat, look at picture books, and swallow medicine. He's weak, and he hates the bother of being taken outside. He catches cold easily, so he says going out makes him sick.
        - id: ch01-b37
          speaker: narrator
          text: Mary sat watching the fire.
        - id: ch01-b38
          speaker: mary
          text: >-
            I wonder if a garden would help him. He could watch things grow. That helped me.
        - id: ch01-b39
          speaker: martha
          text: >-
            One of his worst fits came when they took him outside to the roses by the fountain. He'd read in a newspaper about something called rose cold. He started sneezing and decided he had caught it. Then a new gardener, who didn't know the rules, walked past and gave him a curious look. Colin flew into a rage. He insisted the man had stared because he was going to be a hunchback. He cried himself into a fever and stayed ill all night.
        - id: ch01-b40
          speaker: mary
          text: >-
            If he ever gets angry with me, I won't visit him again.
        - id: ch01-b41
          speaker: martha
          text: >-
            If he wants thee, he'll have thee. Best understand that now.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Soon a bell rang, and Martha rolled up her knitting.
        - id: ch01-b43
          speaker: martha
          text: >-
            The nurse likely wants me to sit with him. I hope he's in a decent temper.
        - id: ch01-b44
          speaker: narrator
          text: >-
            She returned about ten minutes later, looking thoroughly puzzled.
        - id: ch01-b45
          speaker: martha
          text: >-
            Well, tha' truly has bewitched him. He's sitting up on his sofa with his picture books all around him. He ordered the nurse to stay away until six and told me to wait in the next room. The instant she was gone, he called me to his side. He said, “I want Mary Lennox to come and talk to me, and remember, don't tell anyone.” Tha' had better hurry as fast as tha' can.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Mary was glad to hurry. She did not want Colin's company quite as much as Dickon's, but she wanted it very much.
    - id: ch02
      title: Like a Young Rajah
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            A bright fire burned in Colin's room. By daylight Mary saw how beautiful it was. Deep colors glowed in the rugs and curtains. Pictures and books covered the walls. All that color made the room feel warm and comfortable even beneath the gray sky and falling rain. Colin looked rather like a picture himself. Wrapped in a velvet dressing gown, he sat against a large brocade cushion with a spot of red on each cheek.
        - id: ch02-b02
          speaker: colin
          text: >-
            Come in. I've been thinking about you all morning.
        - id: ch02-b03
          speaker: mary
          text: >-
            I thought about you too. Martha is terrified. She thinks Mrs. Medlock will believe she told me about you and send her away.
        - id: ch02-b04
          speaker: narrator
          text: Colin frowned.
        - id: ch02-b05
          speaker: colin
          text: >-
            Bring her in here. She's waiting in the next room.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Mary fetched Martha, who came in trembling. Colin kept frowning at her.
        - id: ch02-b07
          speaker: colin
          text: >-
            You have to do what I want, don't you?
        - id: ch02-b08
          speaker: martha
          text: Yes, sir. I do.
          emotion: fearful
        - id: ch02-b09
          speaker: colin
          text: And Medlock has to obey me too?
        - id: ch02-b10
          speaker: martha
          text: Everyone does, sir.
        - id: ch02-b11
          speaker: colin
          text: >-
            Then if I order you to bring Mary, how could Medlock dismiss you for doing it?
        - id: ch02-b12
          speaker: martha
          text: >-
            Please don't let her send me away, sir.
          emotion: fearful
        - id: ch02-b13
          speaker: colin
          text: >-
            If she dares say one word about it, I'll send her away. She wouldn't enjoy that, I can tell you.
        - id: ch02-b14
          speaker: martha
          text: >-
            Thank you, sir. I only want to do my duty.
        - id: ch02-b15
          speaker: narrator
          text: Martha bobbed a curtsy.
        - id: ch02-b16
          speaker: colin
          text: >-
            Your duty is whatever I want. I'll protect you. You may go now.
        - id: ch02-b17
          speaker: narrator
          text: >-
            Once Martha closed the door, Colin found Mary studying him as though he had given her something strange to think about.
        - id: ch02-b18
          speaker: colin
          text: >-
            Why are you staring at me? What's on your mind?
        - id: ch02-b19
          speaker: mary
          text: Two things.
        - id: ch02-b20
          speaker: colin
          text: >-
            What things? Sit down and tell me.
        - id: ch02-b21
          speaker: narrator
          text: Mary settled onto the big stool.
        - id: ch02-b22
          speaker: mary
          text: >-
            First, I once saw a boy in India who was a Rajah. Rubies, emeralds, and diamonds covered his clothes. He spoke to his servants exactly as you spoke to Martha. They had to obey him at once. I think they might have been killed if they refused.
        - id: ch02-b23
          speaker: colin
          text: >-
            Later, you must tell me all about Rajahs. What was the other thing?
        - id: ch02-b24
          speaker: mary
          text: >-
            I was thinking how completely different you are from Dickon.
        - id: ch02-b25
          speaker: colin
          text: >-
            Who's Dickon? That's an odd name.
        - id: ch02-b26
          speaker: narrator
          text: >-
            Mary decided she could tell him about Dickon without saying one word about the secret garden. She had always enjoyed hearing Martha talk about her brother. Now Mary longed to talk about him herself. Speaking his name and describing him made him seem closer, though he was out somewhere beyond the rainy windows.
        - id: ch02-b27
          speaker: mary
          text: >-
            He's Martha's brother, and he's twelve. There isn't anyone else like him. He charms foxes, squirrels, and birds the way Indian snake charmers charm snakes. When he plays a soft tune on his pipe, the animals come to listen.
        - id: ch02-b28
          speaker: narrator
          text: >-
            Colin suddenly pulled one of the large books beside him across the table.
        - id: ch02-b29
          speaker: colin
          text: >-
            This book has a picture of a snake charmer. Come see.
        - id: ch02-b30
          speaker: narrator
          text: >-
            He opened the beautifully illustrated book to the right colored picture.
        - id: ch02-b31
          speaker: colin
          text: Can Dickon do that?
        - id: ch02-b32
          speaker: mary
          text: >-
            He played his pipe, and the creatures listened. But Dickon doesn't call it Magic. He says he knows their ways because he spends so much time out on the moor. He loves them so much that sometimes he feels as if he were a bird or rabbit himself. I think he even asked the robin questions when we saw him. It sounded as if Dickon and the robin were talking back and forth in soft little chirps.
        - id: ch02-b33
          speaker: narrator
          text: >-
            Colin sank back against his cushion while he listened. His eyes opened wider and wider, and the red spots on his cheeks burned brighter. The story of Dickon had caught his whole attention.
        - id: ch02-b34
          speaker: colin
          text: Tell me more about him.
        - id: ch02-b35
          speaker: mary
          text: >-
            He knows all about nests and eggs. He knows where foxes, badgers, and otters make their homes, but he keeps those places secret so other boys can't find the holes and frighten them. He understands nearly everything that lives or grows on the moor.
        - id: ch02-b36
          speaker: colin
          text: >-
            Does he truly like the moor? How could anyone like such a huge, empty, miserable place?
        - id: ch02-b37
          speaker: mary
          text: >-
            It isn't miserable. It's beautiful. Thousands of lovely things grow there. Thousands of small creatures are building nests and digging burrows. They chirp and sing and squeak to each other under the ground, in the trees, and among the heather. They're all busy and enjoying themselves. The moor is their world.
        - id: ch02-b38
          speaker: colin
          text: How could you know? Have you been there?
        - id: ch02-b39
          speaker: mary
          text: >-
            Not really. I only crossed it once in the dark, and then I thought it was hideous. Martha told me about it first, and Dickon told me more. When Dickon talks, you feel as if you're seeing and hearing it all. You feel as if you're standing right in the heather, with the sun shining and the gorse smelling sweet as honey. The air seems full of bees and butterflies.
        - id: ch02-b40
          speaker: colin
          text: >-
            You never see anything when you're ill.
        - id: ch02-b41
          speaker: narrator
          text: >-
            He grew restless. He looked like someone hearing a faraway sound for the first time and wondering what it might be.
        - id: ch02-b42
          speaker: mary
          text: Not if you never leave one room.
        - id: ch02-b43
          speaker: colin
          text: >-
            I couldn't go onto the moor.
        - id: ch02-b44
          speaker: narrator
          text: >-
            Resentment sharpened his voice. Mary waited a moment before daring an answer.
        - id: ch02-b45
          speaker: mary
          text: You might go someday.
        - id: ch02-b46
          speaker: narrator
          text: Colin jerked in surprise.
        - id: ch02-b47
          speaker: colin
          text: >-
            Go on the moor? How could I? I'm going to die.
        - id: ch02-b48
          speaker: mary
          text: How do you know that?
        - id: ch02-b49
          speaker: narrator
          text: >-
            Mary had little sympathy for his habit of talking about death. It sounded almost as though he were boasting.
        - id: ch02-b50
          speaker: colin
          text: >-
            I've heard it for as long as I can remember. They whisper about it and think I don't notice. They want me to die too.
          emotion: angry
        - id: ch02-b51
          speaker: narrator
          text: Mary pressed her lips together, feeling stubbornly contrary.
        - id: ch02-b52
          speaker: mary
          text: >-
            If people wanted me to die, I would refuse. Who wants that for you?
        - id: ch02-b53
          speaker: colin
          text: >-
            The servants do. And of course Dr. Craven must want it too. If I die, he'll inherit Misselthwaite after Father dies. Then he'll be rich instead of poor. He'd never dare say it, but whenever I grow worse, he looks more cheerful. During my typhoid, his face actually grew fat. I think Father wants me to die too.
        - id: ch02-b54
          speaker: mary
          text: I don't believe your father wants you to die.
        - id: ch02-b55
          speaker: narrator
          text: >-
            Her stubborn answer made Colin turn and study her again. Then he lay back against the cushion and grew completely still, as if the idea had never occurred to him. A long silence followed. Neither child tried to fill it. Perhaps both of them were thinking the strange sort of thoughts children do not usually have to think.
    - id: ch03
      title: Talking About Living
      blocks:
        - id: ch03-b01
          speaker: mary
          text: >-
            I like the important doctor from London. He made them remove that iron brace. Did he say you would die?
        - id: ch03-b02
          speaker: colin
          text: No.
        - id: ch03-b03
          speaker: mary
          text: What did he say?
        - id: ch03-b04
          speaker: colin
          text: >-
            He didn't whisper. Maybe he knew I hated whispering. I heard him say, quite loudly, “The boy could live if he decided to. Give him something that makes him want to.” He sounded angry.
        - id: ch03-b05
          speaker: mary
          text: >-
            I know who might make you want to live. Dickon might. He is always talking about things that are alive. He never talks about dead things or things that are sick. He's forever looking up into the sky to watch birds fly, or looking down at the ground to find something growing. His blue eyes are round and wide because he is always noticing everything. When he laughs, his whole wide mouth laughs, and his cheeks are as red as cherries.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Remembering Dickon's wide smile and open eyes changed Mary's whole expression. She pulled her stool closer to the sofa.
        - id: ch03-b07
          speaker: mary
          text: >-
            Listen. Let's stop talking about dying. I don't like it. Let's talk about living instead. We'll talk and talk about Dickon, and afterward we'll look at your pictures.
        - id: ch03-b08
          speaker: narrator
          text: >-
            It was exactly the right thing to say. Talking about Dickon meant talking about the moor and the cottage where fourteen people lived on sixteen shillings a week. It meant the children who grew sturdy on moor air and moor grass, almost like wild ponies. Mary told Colin about Dickon's mother and the jump rope she had sent. She described sunshine spreading over the moor and pale green shoots pushing through black earth.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Every subject felt alive. Mary talked more than she ever had in her life. Colin talked and listened more than he ever had either. Soon they began laughing over little things that were hardly jokes at all, the way children do when they are simply happy together. Their laughter grew so loud that at last they sounded exactly like two ordinary, healthy, natural ten-year-olds. No one listening outside the door would have guessed they were a hard, lonely girl who had not known how to love and a sickly boy who believed he was going to die.
        - id: ch03-b10
          speaker: narrator
          text: >-
            They enjoyed themselves so much that they forgot all about Colin's picture books. They forgot the time as well. They were laughing loudly over Ben Weatherstaff and the old gardener's friendship with his robin. Colin was actually sitting upright by then, as if he had forgotten all about his weak back. In the middle of their laughter, something suddenly occurred to him.
        - id: ch03-b11
          speaker: colin
          text: >-
            There's one thing neither of us has remembered. We're cousins.
        - id: ch03-b12
          speaker: narrator
          text: >-
            After all their talk, it seemed wonderfully odd that neither of them had remembered something so simple. That made them laugh harder than ever. By then they were in such a happy mood that almost anything could make them laugh.
    - id: ch04
      title: The Door Opens
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Right in the middle of their laughter, the door opened. Dr. Craven walked in, with Mrs. Medlock directly behind him. The doctor stopped in alarm. Mrs. Medlock nearly toppled backward when he bumped into her.
        - id: ch04-b02
          speaker: mrs_medlock
          text: >-
            Good Lord! Oh, good Lord!
          emotion: surprised
        - id: ch04-b03
          speaker: dr_craven
          text: >-
            What is going on here? What does this mean?
          emotion: surprised
        - id: ch04-b04
          speaker: narrator
          text: >-
            Mary thought again of the boy Rajah. Colin answered as if the doctor's alarm and Mrs. Medlock's terror mattered no more than an old cat and dog wandering into the room.
        - id: ch04-b05
          speaker: colin
          text: >-
            This is my cousin, Mary Lennox. I sent for her because I wanted someone to talk to. I like her. Whenever I ask for her, she is to come.
        - id: ch04-b06
          speaker: narrator
          text: Dr. Craven turned an accusing look on Mrs. Medlock.
        - id: ch04-b07
          speaker: mrs_medlock
          text: >-
            Sir, I don't know how this happened. Not one servant in the house would dare tell her. They all know their orders.
          emotion: fearful
        - id: ch04-b08
          speaker: colin
          text: >-
            No one told her. She heard me crying and found the room by herself. I'm glad she did. Don't be foolish, Medlock.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Dr. Craven clearly disliked the situation, but he did not dare oppose his patient. He sat beside Colin and took his pulse.
        - id: ch04-b10
          speaker: dr_craven
          text: >-
            I'm afraid you've had too much excitement. Excitement is bad for you, my boy.
        - id: ch04-b11
          speaker: colin
          text: >-
            I'd be upset if Mary had to stay away. I feel better. She makes me better. The nurse will bring her tea with mine, and we'll eat together.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Mrs. Medlock and the doctor exchanged worried looks. They plainly disliked Colin's decision, but neither of them seemed able to do anything about it.
        - id: ch04-b13
          speaker: mrs_medlock
          text: >-
            He does seem a little better, sir. Though, now I think of it, he already looked better this morning, before she entered the room.
        - id: ch04-b14
          speaker: colin
          text: >-
            She came last night and stayed a long time. She sang me a Hindustani song, and I fell asleep. When I woke, I felt better and wanted breakfast. Now I want tea. Tell the nurse, Medlock.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Dr. Craven did not remain very long. When the nurse came into the room, he spoke with her for a few minutes. Then he gave Colin several warnings of his own. The boy must not talk too much. He must not forget that he was ill, and he must remember how easily he became tired. Mary listened and thought there seemed to be a great many uncomfortable things Colin was never allowed to forget.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Colin grew fretful. His strange, dark-lashed eyes never left the doctor's face.
        - id: ch04-b17
          speaker: colin
          text: >-
            I want to forget I'm ill. Mary makes me forget. That's why I want her here.
        - id: ch04-b18
          speaker: narrator
          text: >-
            Dr. Craven looked unhappy as he left the room. He gave a puzzled glance at the little girl sitting on the large stool. Mary had become a stiff, silent child again the instant he entered, so he could not see what Colin found so attractive about her. Still, the boy truly did look brighter than before. The doctor could not deny that. He sighed heavily as he made his way down the corridor.
        - id: ch04-b19
          speaker: narrator
          text: >-
            The nurse brought tea and set it beside the sofa.
