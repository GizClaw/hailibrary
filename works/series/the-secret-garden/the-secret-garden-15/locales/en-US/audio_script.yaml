  chapters:
    - id: ch01
      title: The Week of Rain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            After one more week of rain, the high blue arch of sky came back, and hot sunlight poured down. Mary had not been able to visit the secret garden or see Dickon, but the rainy days had not felt long. She spent hours in Colin's room every day. They talked about Rajahs, gardens, Dickon, and the cottage on the moor. They studied splendid books and pictures together. Sometimes Mary read to Colin, and sometimes he read a little to her. Whenever something amused or interested him, he hardly looked ill at all. Only his pale face and the fact that he always stayed on the sofa gave him away.
        - id: ch01-b02
          speaker: mrs_medlock
          text: >-
            Tha' was a sly young thing, listening at doors and getting out of bed to follow that crying the way tha' did. Still, I can't say it hasn't been a blessing to all of us. He hasn't thrown one tantrum or had one whining spell since the two of you made friends. His nurse was ready to give up because she'd grown so sick of him. Now she says she doesn't mind staying, seeing as tha's sharing the duty with her.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Mrs. Medlock laughed a little as she said it. Mary, meanwhile, was very careful whenever she and Colin spoke about the secret garden. There were things she wanted to find out, but she had to do it without asking him direct questions. First, now that she was beginning to like being with him, she needed to know whether he was the sort of boy who could keep a secret. He was nothing at all like Dickon. Still, the thought of a garden no one else knew about pleased him so much that perhaps he could be trusted. Mary had only known him for a short time, though, and she was not certain yet.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The second question mattered just as much. If Colin truly could be trusted, could they get him into the garden without anyone discovering it? Mary kept turning the problem over in her mind. The great doctor had ordered fresh air for him, and Colin had said he would not mind fresh air in a secret garden. Perhaps, if he spent enough time outside, met Dickon and the robin, and watched living things grow, he would stop thinking so much about dying.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Lately Mary had caught sight of herself in the mirror and realized that she no longer looked like the child who had arrived from India. She seemed like quite a different creature now, and this child looked nicer. Martha had noticed the change too.
        - id: ch01-b06
          speaker: martha
          text: >-
            Moor air's doing thee good already. Tha' isn't nearly so yellow or so scrawny now. Even thy hair doesn't lie flat and limp on thy head anymore. It's got enough life to stick out a bit.
        - id: ch01-b07
          speaker: mary
          text: >-
            It's like the rest of me. It's getting stronger and fatter. I'm sure there's more hair now.
        - id: ch01-b08
          speaker: martha
          text: >-
            Looks that way. And tha' isn't half so ugly with it fluffed around thy face and a little red showing in thy cheeks.
        - id: ch01-b09
          speaker: narrator
          text: >-
            If gardens and fresh air had helped Mary, perhaps they could help Colin too. But if he hated being looked at, he might not want to meet Dickon.
        - id: ch01-b10
          speaker: mary
          text: Why do you get angry when people look at you?
        - id: ch01-b11
          speaker: colin
          text: >-
            I've always hated it, even when I was very small. At the seaside, I used to lie in my carriage while everyone stared. Ladies would stop to speak to my nurse, then whisper that I wouldn't live long enough to grow up. Sometimes they patted my cheek and called me a poor child. One woman did that, and I screamed and bit her hand. I frightened her so badly that she ran away.
        - id: ch01-b12
          speaker: mary
          text: >-
            She must have thought you'd gone mad, like a dog.
        - id: ch01-b13
          speaker: narrator
          text: Mary did not sound impressed. Colin frowned.
        - id: ch01-b14
          speaker: colin
          text: I don't care what she thought.
        - id: ch01-b15
          speaker: mary
          text: >-
            Then why didn't you scream and bite me when I first came into your room?
        - id: ch01-b16
          speaker: narrator
          text: A slow smile began to spread across Mary's face.
        - id: ch01-b17
          speaker: colin
          text: >-
            I thought you were a ghost, or maybe a dream. You can't bite either one, and screaming wouldn't bother them.
        - id: ch01-b18
          speaker: mary
          text: Would it bother you if a boy looked at you?
        - id: ch01-b19
          speaker: narrator
          text: Colin leaned against his cushion and considered every word before he answered.
        - id: ch01-b20
          speaker: colin
          text: >-
            There is one boy I don't think I'd mind. The boy who knows where the foxes live. Dickon.
        - id: ch01-b21
          speaker: mary
          text: I'm certain you wouldn't mind him.
        - id: ch01-b22
          speaker: colin
          text: >-
            Birds and animals don't mind him. Perhaps I wouldn't either. He's an animal charmer, and I'm a boy animal.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Colin laughed, and Mary joined him. Soon they were both laughing hard at the thought of a boy animal hiding inside his hole. After that, Mary knew she did not need to worry about Dickon.
    - id: ch02
      title: The World Begins Again
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            On the first morning when the sky was blue again, Mary woke very early. Sunlight slanted through the blinds, and the sight of it was so joyful that she leaped out of bed and ran to the window. She pulled up the blinds, opened the window, and felt a great breath of fresh, sweet-smelling air sweep into the room. The moor looked blue. The whole world seemed as if something Magic had happened to it. Soft fluting calls sounded here and there, as though scores of birds were tuning up for a concert. Mary reached outside and held her hand in the sunshine.
        - id: ch02-b02
          speaker: mary
          text: >-
            It's warm! Really warm! It'll make the green shoots climb higher and higher. Under the ground, all the bulbs and roots will be working and pushing with all their might.
        - id: ch02-b03
          speaker: narrator
          text: >-
            She knelt and leaned as far out of the window as she could. She took deep breaths and sniffed the air until she laughed, remembering how Dickon's mother had said the tip of his nose quivered like a rabbit's.
        - id: ch02-b04
          speaker: mary
          text: >-
            It must be terribly early. All the little clouds are pink, and I've never seen the sky look this way. Nobody is awake. I can't even hear the stable boys.
        - id: ch02-b05
          speaker: narrator
          text: A sudden thought sent her scrambling to her feet.
        - id: ch02-b06
          speaker: mary
          text: I can't wait. I'm going to the garden!
          emotion: happy
        - id: ch02-b07
          speaker: narrator
          text: >-
            By now Mary had learned to dress herself, and she was ready in five minutes. She knew of a small side door she could unbolt alone. She flew downstairs in her stocking feet, then put on her shoes in the hall. She slipped off the chain, drew back the bolt, turned the lock, and opened the door. With one bound she was over the step and standing on grass that seemed to have turned green overnight.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Warm sunlight poured over her. Sweet gusts moved through the air, while every bush and tree seemed full of fluting, twittering, and song. Mary clasped her hands in pure delight and looked up. The sky was blue and pink and pearly white, flooded with spring light. She felt as though she had to flute and sing aloud too. The thrushes, robins, and skylarks could not possibly help themselves on such a morning. Then she ran along the paths and around the shrubs toward the secret garden.
        - id: ch02-b09
          speaker: mary
          text: >-
            Everything is different already. The grass is greener. Shoots are coming up everywhere, leaves are uncurling, and green buds are showing. Dickon will surely come this afternoon.
        - id: ch02-b10
          speaker: narrator
          text: >-
            The long, warm rain had worked wonders in the flower beds beside the lower wall. New growth pushed and sprouted from the roots of clustered plants. Here and there, flashes of royal purple and yellow were beginning to unfold among the crocus stems. Six months earlier, Mistress Mary would never have seen how the whole world was waking up. Now she missed nothing at all.
    - id: ch03
      title: Wonders in the Garden
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            When Mary reached the ivy-covered door, a loud, strange sound startled her. A crow was calling from the top of the wall. She looked up and saw a large blue-black bird with shining feathers gazing wisely down at her. She had never stood so close to a crow, and it made her a little uneasy. A moment later, he spread his wings and flew over the wall. Mary hoped he would not remain in the garden. She pushed open the hidden door, wondering where he had gone.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Once she was inside, she saw that the crow did mean to stay. He had landed in a small apple tree. Beneath it lay a reddish little animal with a bushy tail. Both creatures were watching Dickon. His rust-red head was bent over his work as he knelt on the grass.
        - id: ch03-b03
          speaker: narrator
          text: Mary flew across the garden to him.
        - id: ch03-b04
          speaker: mary
          text: >-
            Oh, Dickon! How did you get here this early? The sun has only just come up!
          emotion: surprised
        - id: ch03-b05
          speaker: narrator
          text: >-
            Dickon rose, laughing. He looked tousled and glowing, and his eyes were the color of the sky.
        - id: ch03-b06
          speaker: dickon
          text: >-
            Eh, I was up long before the sun. How could I stay in bed? The whole world's beginning again this morning. Everything's working and humming, scratching and piping, building nests and breathing out sweet smells. A body has to be out in it, not lying flat on his back. When the sun jumped up, the moor went mad with joy. I was right in the heather, and I went mad too, running and shouting and singing. Then I came straight here. I couldn't keep away. Why, the garden was waiting for me!
          emotion: happy
        - id: ch03-b07
          speaker: narrator
          text: >-
            Mary pressed both hands to her chest. She was panting as though she had been running beside him.
        - id: ch03-b08
          speaker: mary
          text: >-
            Oh, Dickon, I'm so happy I can hardly breathe!
          emotion: happy
        - id: ch03-b09
          speaker: narrator
          text: >-
            When the little animal heard Dickon speaking to someone new, it got up and came toward him. The crow gave one caw, flew down, and settled quietly on Dickon's shoulder.
        - id: ch03-b10
          speaker: dickon
          text: >-
            This little fox cub is Captain. And this fellow is Soot.
        - id: ch03-b11
          speaker: narrator
          text: Dickon rubbed the fox's reddish head.
        - id: ch03-b12
          speaker: dickon
          text: >-
            Soot flew all the way across the moor with me. Captain ran as if a pack of hounds were chasing him. They felt exactly the way I did.
        - id: ch03-b13
          speaker: narrator
          text: >-
            Neither creature seemed the least bit afraid of Mary. When Dickon began walking around the garden again, Soot stayed comfortably on his shoulder. Captain followed quietly, trotting close beside him wherever he went.
        - id: ch03-b14
          speaker: dickon
          text: >-
            Look here! See how these have come up? And these, and these! Eh, now look at this lot!
        - id: ch03-b15
          speaker: narrator
          text: >-
            He dropped to his knees, and Mary knelt beside him. They had found a whole clump of crocuses, bursting open in purple, orange, and gold. Mary lowered her face and kissed them again and again.
        - id: ch03-b16
          speaker: mary
          text: >-
            You'd never kiss a person like that. Flowers are different.
        - id: ch03-b17
          speaker: narrator
          text: Dickon looked puzzled, but he smiled.
        - id: ch03-b18
          speaker: dickon
          text: >-
            Eh, I've kissed Mother that very way plenty of times. I'd come home after roaming over the moor all day, and she'd be standing in the sunny doorway, looking so glad and comfortable.
        - id: ch03-b19
          speaker: narrator
          text: >-
            They hurried from one end of the garden to the other, finding so many wonders that they had to remind each other to whisper or speak very low. Dickon showed Mary leaf buds swelling on rose branches that had looked completely dead. He pointed out what seemed like ten thousand new green tips breaking through the dark soil. Together they put their eager young noses close to the ground and breathed in the earth's warm springtime breath. They dug, pulled weeds, and laughed softly with delight. Before long, Mary's hair was as wild and tumbled as Dickon's, and her cheeks were nearly as red as poppies.
    - id: ch04
      title: Nest Building
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Every joy in the world seemed to be inside the secret garden that morning. Then came a delight greater than all the rest because it was more wonderful. Something swept quickly over the wall and darted through the trees toward a thick, sheltered corner. It was a little flash of red breast, with something hanging from its beak. Dickon went perfectly still and laid a hand on Mary. It was as though they had suddenly realized they were laughing in church.
        - id: ch04-b02
          speaker: dickon
          text: >-
            We mustn't move. We must hardly breathe. I knew he was looking for a mate when I saw him last. It's Ben Weatherstaff's robin, and he's building his nest. He'll stay here if we don't frighten him away.
        - id: ch04-b03
          speaker: narrator
          text: They sank gently onto the grass and sat without moving.
        - id: ch04-b04
          speaker: dickon
          text: >-
            We can't let him think we're watching too closely. If he decides we're meddling now, he'll be done with us. He'll act different until this is over. He's setting up housekeeping, so he'll be shy and quicker to take offense. He hasn't time for visits or gossip. Let's sit still and pretend we're only grass and trees and bushes. Once he's used to us, I'll chirp a little. Then he'll know we won't get in his way.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Mary was not at all sure she knew how to look like grass, trees, and bushes. Dickon had made the strange idea sound like the simplest, most natural thing in the world. It must be easy for him, she thought. For several minutes she watched him closely, wondering whether he might quietly turn green and put out branches and leaves. He only sat wonderfully still. When he spoke, his voice dropped so soft and low that she was amazed she could hear every word.
        - id: ch04-b06
          speaker: dickon
          text: >-
            Nest building is part of spring. I expect birds have done it this same way every year since the world began. They've got their own way of thinking and doing things, and people had better leave them to it. In springtime, being too curious can cost thee a friend faster than in any other season.
        - id: ch04-b07
          speaker: mary
          text: >-
            If we keep talking about him, I can't stop looking. We should talk about something else. I have something to tell you.
        - id: ch04-b08
          speaker: dickon
          text: >-
            He'll like that better. What does tha' need to tell me?
        - id: ch04-b09
          speaker: mary
          text: Do you know about Colin?
        - id: ch04-b10
          speaker: narrator
          text: Dickon turned his head toward her.
        - id: ch04-b11
          speaker: dickon
          text: What does tha' know about him?
        - id: ch04-b12
          speaker: mary
          text: >-
            I've met him. I've gone to talk with him every day this week because he asks me to come. He says I help him forget that he's ill and might die.
        - id: ch04-b13
          speaker: narrator
          text: >-
            Surprise crossed Dickon's round face. As soon as it faded, he looked truly relieved.
        - id: ch04-b14
          speaker: dickon
          text: >-
            I'm glad. I'm right glad of that. It eases my mind. I knew I mustn't say anything about him, and I don't like hiding things.
        - id: ch04-b15
          speaker: mary
          text: But you don't mind hiding the garden, do you?
        - id: ch04-b16
          speaker: dickon
          text: >-
            I'll never tell anybody about the garden. I did tell Mother I had a secret to keep. I said it wasn't a bad secret, no worse than hiding the place where a bird has its nest. I asked if she minded.
        - id: ch04-b17
          speaker: narrator
          text: Mary always wanted to hear more about Dickon's mother.
        - id: ch04-b18
          speaker: mary
          text: What did she say?
        - id: ch04-b19
          speaker: narrator
          text: Dickon gave his easy, good-natured grin.
        - id: ch04-b20
          speaker: dickon
          text: >-
            She said just what you'd expect. She rubbed my head a bit and laughed. Then she said, “Eh, lad, keep as many secrets as tha' likes. I've known thee for twelve years.”
        - id: ch04-b21
          speaker: mary
          text: How did you learn about Colin?
        - id: ch04-b22
          speaker: dickon
          text: >-
            Everyone who knew about Mr. Craven knew there was a little lad who might grow up crippled. They knew Mr. Craven wouldn't have people discussing him. Folks feel sorry for Mr. Craven. Mrs. Craven was a lovely young lady, and the two of them loved each other dearly. Mrs. Medlock stops at our cottage whenever she goes to Thwaite. She'll talk in front of us children because she knows Mother raised us to be trusted. But how did tha' find Colin? Martha was in a fine worry last time she came home. She said tha'd heard him fretting and started asking questions, and she didn't know what she ought to say.
        - id: ch04-b23
          speaker: narrator
          text: >-
            Mary told him the whole story. The wind had wailed around the house at midnight and woken her. A faint, faraway complaining voice led her through the dark corridors with her candle. At last she opened the door of a dim room and found a carved four-poster bed in one corner. On it lay Colin, with his small ivory-white face and strange eyes ringed in black. Dickon shook his head as he listened.
        - id: ch04-b24
          speaker: dickon
          text: >-
            Those sound just like his mother's eyes, except hers were always laughing, so they say. They also say Mr. Craven can't bear to see Colin awake. The boy's eyes remind him of his wife, but they look so different in that miserable little face.
        - id: ch04-b25
          speaker: mary
          text: Do you think he wants Colin to die?
        - id: ch04-b26
          speaker: dickon
          text: >-
            No. But he wishes the boy had never been born. Mother says that's the worst thing in the world for a child. Children nobody wants hardly ever thrive. Mr. Craven would buy Colin anything money can buy, but he'd rather forget the poor lad is alive. For one thing, he's afraid he'll look at Colin someday and see him turning into a hunchback.
        - id: ch04-b27
          speaker: mary
          text: >-
            Colin is so frightened of that himself that he won't sit up. He says if he ever felt a lump growing, he'd go mad and scream until he died.
        - id: ch04-b28
          speaker: dickon
          text: >-
            Eh, he mustn't lie there thinking such things. No lad could get well with thoughts like those in his head.
        - id: ch04-b29
          speaker: narrator
          text: >-
            Captain lay in the grass beside Dickon, looking up now and then to ask for a pat. Dickon softly rubbed the fox's neck and sat thinking. After a few quiet minutes, he raised his head and looked around the garden.
        - id: ch04-b30
          speaker: dickon
          text: >-
            When we first came through that door, everything looked gray. Look around now. Can tha' see how it's changed?
        - id: ch04-b31
          speaker: narrator
          text: Mary looked, and her breath caught.
        - id: ch04-b32
          speaker: mary
          text: >-
            Why, the gray wall is changing! A green mist seems to be creeping over it. It looks almost like a veil of green gauze.
          emotion: surprised
        - id: ch04-b33
          speaker: dickon
          text: >-
            Aye. It'll grow greener and greener until all the gray disappears. Can tha' guess what I was thinking?
        - id: ch04-b34
          speaker: mary
          text: >-
            I know it was something good. I think it was about Colin.
        - id: ch04-b35
          speaker: dickon
          text: >-
            I thought that if he were out here, he wouldn't watch his back for a lump. He'd be watching the rosebuds break open instead, and likely grow healthier. I wondered if we could ever coax him outside to lie under the trees in his carriage.
        - id: ch04-b36
          speaker: mary
          text: >-
            I've wondered the same thing nearly every time we talked. Could he keep the secret? Could we bring him here without anyone seeing? Perhaps you could push his carriage. The doctor ordered him to get fresh air. If Colin commands them to let us take him out, no one will dare refuse. He won't go for anyone else, so they may be glad he'll go with us. And he can order the gardeners away, so they won't discover anything.
        - id: ch04-b37
          speaker: narrator
          text: Dickon scratched Captain's back while he thought it through.
        - id: ch04-b38
          speaker: dickon
          text: >-
            It would do him good, I'll warrant. We wouldn't be thinking he'd been better off never born. We'd only be children watching a garden grow. Two lads and one little lass, looking on at springtime together. That would help him more than a doctor's medicine.
        - id: ch04-b39
          speaker: mary
          text: >-
            He's stayed in that room for so long, always terrified about his back, that it's made him strange. He knows many things from books, but nothing about real life. He says he was too sick to notice anything. He hates being outdoors, and he hates gardens and gardeners. But he likes hearing about this garden because it's secret. I haven't dared tell him much, though he said he wanted to see it.
        - id: ch04-b40
          speaker: dickon
          text: >-
            We'll get him out here one day, sure enough. I can push his carriage. Have tha' noticed the robin and his mate working while we've been talking? Look at him on that branch, trying to decide where that twig ought to go.
        - id: ch04-b41
          speaker: narrator
          text: >-
            Dickon gave one of his low, whistling calls. The robin turned his head and looked at him with the twig still held in his beak. Dickon spoke as Ben Weatherstaff did, though his own voice offered friendly advice instead of a scolding.
        - id: ch04-b42
          speaker: dickon
          text: >-
            Wherever tha' puts it, it'll be right. Tha' knew how to build that nest before tha' ever came out of the egg. Get along now, lad. Tha' has no time to waste.
        - id: ch04-b43
          speaker: mary
          text: >-
            Oh, I love hearing you talk to him! Ben Weatherstaff scolds and teases him. The robin hops about looking as though he understands every word, and I know he enjoys it. Ben says he's so vain that he'd rather have stones thrown at him than have nobody notice him at all.
          emotion: happy
        - id: ch04-b44
          speaker: narrator
          text: Dickon laughed and kept talking to the robin.
        - id: ch04-b45
          speaker: dickon
          text: >-
            Tha' knows we won't bother thee. We're nearly wild creatures ourselves. We're building a nest too, bless thee. Mind tha' doesn't give away our secret.
        - id: ch04-b46
          speaker: narrator
          text: >-
            The robin could not answer because his beak was still busy holding the twig. But when he flew away with it toward his own private corner of the garden, Mary saw the meaning in his dark, dew-bright eye. She knew with complete certainty that he would not tell their secret for anything in the world.
