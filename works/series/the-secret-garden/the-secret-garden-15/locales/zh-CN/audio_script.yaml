audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
    mrs_medlock:
      display_name: 梅德洛克太太
      tts: {delivery: 严厉能干，慌乱时语速陡然加快, timbre: 结实洪亮, pace: 中等, pitch: 中音}
    martha:
      display_name: 玛莎
      tts: {delivery: 爽直热情，带亲切的约克郡乡音, timbre: 明亮朴实, pace: 轻快, pitch: 中高音}
    dickon:
      display_name: 迪肯
      tts: {delivery: 质朴自在，带浓重而亲切的约克郡乡音, timbre: 清亮温厚，带荒原少年的蓬勃气息, pace: 轻快从容, pitch: 中高音}
  chapters:
    - id: ch01
      title: 男孩动物
      blocks:
        - {id: ch01-b01, speaker: narrator, text: 又下了一个星期的雨，蓝天终于露出来了，阳光晒得人暖烘烘的。这些天，玛丽既去不了秘密花园，也见不到迪肯，可她一点儿也没觉得难熬。她每天都在科林房里待上好几个钟头。两个人谈印度的王公、花园、迪肯，还有荒原上的小屋。他们一起看那些精美的书和图画，轮流读给对方听。科林一旦听得入神，除了脸色依旧苍白，身子总躺在长沙发上，几乎就不像个病人。}
        - {id: ch01-b02, speaker: mrs_medlock, text: “你这个小机灵鬼，居然偷听，还敢半夜爬起来一路找过去。不过，这件事倒像是给我们大家带来了一点福气。你跟他交上朋友以后，他再没发过脾气，也没哭闹过。护士原本烦透了他，正打算不干。现在有你跟她一道当差，她倒愿意留下来了。”}
        - {id: ch01-b03, speaker: narrator, text: 梅德洛克太太说完，还轻轻笑了一声。玛丽跟科林谈起秘密花园时总是很小心。她有几件事想从他那里弄明白，却觉得不能直接发问。第一，科林能不能替人守住秘密？她渐渐喜欢跟他待在一起了，也就更想知道答案。科林虽然一点儿也不像迪肯，可一听说有座谁也不知道的花园，就显得那么高兴，也许他值得信任。只是他们认识得还不够久，玛丽还拿不准。}
        - {id: ch01-b04, speaker: narrator, text: 第二件事是，假如科林真的可靠，他们能不能瞒着所有人，把他带进花园？伦敦来的大医生说，他必须呼吸新鲜空气。科林也说过，秘密花园里的新鲜空气，他倒不介意。也许他多吹吹风，再认识迪肯和知更鸟，亲眼看着草木生长，就不会总想着死了。近来玛丽偶尔照镜子，已经发现里面的自己跟刚从印度来的那个孩子大不相同。现在的她好看多了，像是变成了另一个人，连玛莎也看出来了。}
        - {id: ch01-b05, speaker: martha, text: “荒原上的风已经把你吹得好多啦。脸没那么黄，身子也没那么瘦巴巴。连头发都有了点精神，不再软塌塌地贴着脑袋，会蓬起来一点啦。”}
        - {id: ch01-b06, speaker: mary_lennox, text: “头发跟我一样，长得更壮，也更厚了。我敢说，它一定变多了。”}
        - {id: ch01-b07, speaker: martha, text: “看着确实多了。头发这么蓬着，脸颊上再有点红颜色，你就没那么难看啦。”}
        - {id: ch01-b08, speaker: narrator, text: 花园和新鲜空气既然对玛丽有好处，说不定也能帮到科林。可是科林讨厌别人看他，也许不会愿意见迪肯。}
        - {id: ch01-b09, speaker: mary_lennox, text: “别人一看你，你为什么就生气？”}
        - {id: ch01-b10, speaker: colin_craven, text: “我一直都讨厌，小的时候就讨厌。后来他们带我到海边去，我躺在轮椅里，人人都盯着我。那些太太会停下来跟护士讲话，然后小声嘀咕。我知道，她们是在说我活不到长大。有时候，她们还拍着我的脸说‘可怜的孩子’。有一回，一位太太这么做，我放声尖叫，还咬了她的手。她吓得逃走了。”}
        - {id: ch01-b11, speaker: mary_lennox, text: “她准以为你像疯狗一样发狂了。”}
        - {id: ch01-b12, speaker: colin_craven, text: “她爱怎么想就怎么想。”}
        - {id: ch01-b13, speaker: narrator, text: 玛丽说这话时，语气里一点也没有佩服。科林皱起眉头，她却慢慢笑了。}
        - {id: ch01-b14, speaker: mary_lennox, text: “那天我刚走进你房间，你为什么没有尖叫，也没有咬我？”}
        - {id: ch01-b15, speaker: colin_craven, text: “我以为你是鬼，或者是一个梦。鬼和梦都咬不着，就算冲它们尖叫，它们也不会在意。”}
        - {id: ch01-b16, speaker: mary_lennox, text: “要是……要是一个男孩看你，你也会讨厌吗？”}
        - {id: ch01-b17, speaker: narrator, text: 科林靠回软垫，认真想了一会儿。}
        - {id: ch01-b18, speaker: colin_craven, text: “有一个男孩，我想我不会介意。就是那个知道狐狸住在哪里的男孩，迪肯。”}
        - {id: ch01-b19, speaker: mary_lennox, text: “你一定不会介意他。”}
        - {id: ch01-b20, speaker: colin_craven, text: “鸟儿和别的动物都不介意他，也许我也不会。他能迷住动物，而我是个男孩动物。”}
        - {id: ch01-b21, speaker: narrator, text: 科林笑起来，玛丽也跟着笑了。事情到最后，变成两个人一起大笑。一个男孩动物躲在自己的洞里，这幅样子越想越有趣，他们笑了好一阵子。等笑声停下来，玛丽心里已经明白，科林见到迪肯不会有事，她用不着再为迪肯担心了。}
    - id: ch02
      title: 春天醒来了
      blocks:
        - {id: ch02-b01, speaker: narrator, text: 蓝天重新出现的第一个早晨，玛丽醒得很早。斜斜的阳光穿过百叶窗，显得那么欢欣，她一下跳下床，跑去拉起百叶窗，又把窗子完全推开。一大股带着清香的新鲜空气迎面吹来。荒原蓝得透亮，整个世界仿佛刚刚发生了魔法。这里一声，那里一声，四面八方都是细柔婉转的鸟鸣，好像几十只鸟正为一场音乐会试音。玛丽把手伸出窗外，让手掌停在温暖的阳光里。}
        - {id: ch02-b02, speaker: mary_lennox, text: “好暖，好暖啊！阳光会叫绿色的小尖芽一直往上钻。地底下的球茎和根也会使出全身力气，忙着生长。” , emotion: happy}
        - {id: ch02-b03, speaker: narrator, text: 她跪下来，把身子尽量探出窗外，大口呼吸，不停嗅着空气。她想起迪肯的母亲说过，迪肯的鼻尖会像兔子一样颤动，不由得笑了。}
        - {id: ch02-b04, speaker: mary_lennox, text: “一定还早得很。小云朵全是粉红的，我从没见过这样的天空。谁都没起来，连马厩里的小伙子也听不见。”}
        - {id: ch02-b05, speaker: narrator, text: 一个念头突然闪过，玛丽立刻站了起来。}
        - {id: ch02-b06, speaker: mary_lennox, text: “我等不及了！我要去看花园！” , emotion: happy}
        - {id: ch02-b07, speaker: narrator, text: 她已经学会自己穿衣服，五分钟就收拾好了。她知道有一扇小侧门，门闩自己就能打开，于是穿着袜子飞奔下楼，在门厅里套上鞋。她取下门链，拔开门闩，又开了锁。门一开，她一步跳过门槛，站到了草地上。草仿佛一夜之间变绿了。阳光暖暖地照着她，带着甜香的风一阵阵吹来。每一丛灌木、每一棵树上，都响着婉转、啁啾和歌唱。}
        - {id: ch02-b08, speaker: narrator, text: 玛丽欢喜得双手交握，抬头看着那片天空。蓝色、粉色、珍珠色和白色交织在一起，春天的光淌得到处都是。她觉得自己也非得吹起口哨，放声歌唱不可，也明白了画眉、知更鸟和云雀为什么一定忍不住。她绕过一丛丛灌木，沿着一条条小径，飞快地朝秘密花园跑去。}
        - {id: ch02-b09, speaker: mary_lennox, text: “一切都不一样了。草更绿了，到处都有东西冒出来，有东西正舒展开，叶子的绿芽也露头了。今天下午，迪肯一定会来。”}
        - {id: ch02-b10, speaker: narrator, text: 暖雨下了那么久，低墙旁小径两边的花坛完全变了模样。一丛丛植物的根部不断有新芽钻出泥土，番红花的茎叶间已经露出高贵的紫色和鲜亮的黄色，花瓣正在一点点舒展开。六个月以前，玛丽根本不会发现世界正在苏醒。如今，什么也逃不过她的眼睛。}
        - {id: ch02-b11, speaker: narrator, text: 她走到常春藤遮住的门前，突然听见墙头传来古怪而响亮的“嘎嘎”声。一只羽毛油亮、泛着蓝光的大乌鸦坐在那里，十分聪明地低头打量她。玛丽从没离乌鸦这么近，不免有点紧张。下一刻，它展开翅膀，扑扇着飞过墙头，进了花园。玛丽一边推门，一边猜它会不会留下，心里倒希望它别待在里面。}
        - {id: ch02-b12, speaker: narrator, text: 玛丽走进花园，发现乌鸦果然打算留下。它已经落在一棵矮苹果树上，树下还卧着一只红褐色的小动物，拖着蓬松的尾巴。它们一起望着迪肯。迪肯正跪在草地上，俯着身子卖力干活，一头铁锈红的头发格外醒目。玛丽飞奔过草地，来到他身边。}
        - {id: ch02-b13, speaker: mary_lennox, text: “迪肯！你怎么这么早就来了？太阳才刚刚升起来呀！” , emotion: surprised}
        - {id: ch02-b14, speaker: narrator, text: 迪肯站起身。他头发蓬乱，脸上发着光，笑得十分灿烂，眼睛就像一小片天空。}
        - {id: ch02-b15, speaker: dickon, text: “嗨！太阳没起来，我早就起来啦。这种早晨，谁还能躺在床上！今儿整个世界都漂漂亮亮地重新开了头。到处都在忙，都在嗡嗡叫、抓抓挠挠、吹小调、搭窝筑巢，还一个劲儿往外送香气。你非得跑出来不可。太阳一跳出来，荒原就快活得发了狂。我正在石南丛里，也跟着发起狂来，一路跑，一路喊，一路唱，然后直奔这里。我实在没法不来。你瞧，花园正躺在这儿等着呢！” , emotion: happy}
        - {id: ch02-b16, speaker: narrator, text: 玛丽两手按住胸口，喘个不停，仿佛一路狂奔的人是她。}
        - {id: ch02-b17, speaker: mary_lennox, text: “迪肯，我太快活了，快活得连气都喘不上来了！” , emotion: happy}
        - {id: ch02-b18, speaker: narrator, text: 蓬尾巴的小动物从树下站起来，走到迪肯身边。乌鸦叫了一声，也飞下来，安稳地落在他肩头。}
        - {id: ch02-b19, speaker: dickon, text: “这是只小狐狸，叫上尉。这个呢，是煤烟。煤烟跟我一道飞过荒原，上尉也一路跑，活像后头有猎狗在追。它们俩的心情跟我一模一样。”}
        - {id: ch02-b20, speaker: narrator, text: 两个小家伙看起来一点也不怕玛丽。迪肯开始在花园里走动时，煤烟始终留在他肩上，上尉则安安静静地贴着他的脚边走。}
        - {id: ch02-b21, speaker: dickon, text: “快看！瞧这些钻得多高，还有这些、这些！嗨，再看看这里！” , emotion: happy}
        - {id: ch02-b22, speaker: narrator, text: 他一下跪到地上，玛丽也跪在他身旁。他们发现了一大丛盛开的番红花，紫色、橙色和金黄色挤在一起。玛丽俯下脸，一遍遍亲吻花朵。}
        - {id: ch02-b23, speaker: mary_lennox, text: “你永远不会这样亲一个人。花真是太不一样了。”}
        - {id: ch02-b24, speaker: narrator, text: 迪肯有点不解，不过还是笑了。}
        - {id: ch02-b25, speaker: dickon, text: “嗨，我在荒原上跑一整天，回到家看见娘站在阳光下的门口，又高兴又安稳，我可有好多回也是这么亲她的。”}
        - {id: ch02-b26, speaker: narrator, text: 两个孩子从花园这头跑到那头，发现的奇迹实在太多。他们只能一遍遍提醒彼此，别忘了耳语，或者把声音压得很低。迪肯指给玛丽看，原本像是枯死的玫瑰枝上，叶芽已经鼓了起来。他又让她看泥土里钻出的一万个嫩绿小尖芽。他们把热切的小鼻子贴近地面，嗅着大地被春天暖醒后的呼吸。他们一起挖土、拔草，欢喜得低声笑个不停。最后，玛丽的头发变得跟迪肯一样凌乱，脸颊也几乎跟他的一样，红得像罂粟花。}
    - id: ch03
      title: 知更鸟筑巢
      blocks:
        - {id: ch03-b01, speaker: narrator, text: 那天早晨，世上一切欢乐仿佛都聚在秘密花园里。就在这一片欢乐中，又来了一桩比什么都令人欣喜的事，因为它更加奇妙。有个东西飞快掠过墙头，穿过树木，直冲向枝叶茂密的角落。那是一小团红胸脯的亮光，嘴里还衔着东西。迪肯立刻站住，还伸手按住玛丽，仿佛他们忽然发现自己正在教堂里放声大笑。}
        - {id: ch03-b02, speaker: dickon, text: “咱们可不能动，连气都不能大喘。上回瞧见它，我就知道它正找伴儿呢。那是本·韦瑟斯塔夫的知更鸟。它在筑巢。只要咱们不吓着它，它就会留在这儿。”}
        - {id: ch03-b03, speaker: narrator, text: 两个孩子轻手轻脚地在草地上坐下来，照迪肯说的那样待着，谁也没有乱动。}
        - {id: ch03-b04, speaker: dickon, text: “别让它觉得咱们老盯着它。它要是以为咱们想插手，以后就再也不理咱们啦。它要成家过日子了，这阵子会更怕羞，也更容易生气，没工夫串门儿说闲话。咱们先安静一会儿，尽量装得跟草、树、灌木丛一样。等它看惯了，我再轻轻叫几声，它就知道咱们不会碍事。”}
        - {id: ch03-b05, speaker: narrator, text: 玛丽一点儿也拿不准，自己是否像迪肯那样，懂得该怎样装成草、树和灌木丛。可迪肯说这件怪事时，就像在说世上最简单、最自然的事。她觉得这对他一定很容易，于是仔细看了好几分钟，甚至猜他会不会静静地变绿，再长出枝条和叶子。迪肯当然没有。他只是坐得出奇地安静。开口时，声音轻得几乎听不见，偏偏玛丽还能听清。}
        - {id: ch03-b06, speaker: dickon, text: “筑巢也是春天的一部分。我敢说，世界刚开头的时候，鸟儿就这么做了。它们有自己的想法，也有自己的做法，人最好别插手。春天里，你要是好奇过了头，比别的时候更容易丢掉一个朋友。”}
        - {id: ch03-b07, speaker: mary_lennox, text: “只要我们谈它，我就忍不住看。我们得说点别的。我有件事要告诉你。”}
        - {id: ch03-b08, speaker: dickon, text: “说点别的，它也会更高兴。你想告诉我什么？”}
        - {id: ch03-b09, speaker: mary_lennox, text: “你知道科林吗？”}
        - {id: ch03-b10, speaker: narrator, text: 迪肯转过头。}
        - {id: ch03-b11, speaker: dickon, text: “你知道他什么事？”}
        - {id: ch03-b12, speaker: mary_lennox, text: “我见过他。这个星期，我每天都陪他说话。他盼着我去，还说我能让他忘记生病，忘记自己会死。”}
        - {id: ch03-b13, speaker: narrator, text: 迪肯圆圆的脸上原本满是惊讶。那份惊讶一消失，他立刻露出如释重负的神情。}
        - {id: ch03-b14, speaker: dickon, text: “那我可真高兴。我打心底里高兴，心里也松快多啦。我知道自己什么也不能说，可我不喜欢瞒着事情。” , emotion: happy}
        - {id: ch03-b15, speaker: mary_lennox, text: “那你不喜欢把花园藏起来吗？”}
        - {id: ch03-b16, speaker: dickon, text: “我永远不会说出去。可我对娘说，我有个秘密要守着，不是什么坏秘密，就跟把鸟窝藏在哪儿守住不说一样。我问她会不会介意。”}
        - {id: ch03-b17, speaker: narrator, text: 玛丽一向爱听他说母亲的事。这一次，她也一点儿不怕听见答案。}
        - {id: ch03-b18, speaker: mary_lennox, text: “她怎么说？”}
        - {id: ch03-b19, speaker: narrator, text: 迪肯脾气温和地咧嘴一笑。}
        - {id: ch03-b20, speaker: dickon, text: “一听就是娘才会说的话。她揉揉我的脑袋，笑着说：‘嗨，小子，你想有多少秘密就有多少吧。我都认识你十二年啦。’”}
        - {id: ch03-b21, speaker: mary_lennox, text: “你怎么会知道科林？”}
        - {id: ch03-b22, speaker: dickon, text: “凡是知道克雷文先生的人，都知道他有个小少爷，多半会变成残废，也知道克雷文先生不喜欢人家谈孩子。大伙儿都替他难过。克雷文太太年轻又漂亮，夫妻俩感情那么好。梅德洛克太太每回去斯韦特，都会到我们小屋歇一歇。她敢当着我们这些孩子的面跟娘说话，因为她知道，娘把我们教得可靠，听见的事不会到处乱讲。可你是怎么发现科林的？玛莎上回回家急坏了，说你听见他哭闹，又不停地追问，她简直不知道该怎么回答。”}
        - {id: ch03-b23, speaker: narrator, text: 玛丽把那一夜的事从头讲给迪肯听。半夜里，风在宅子四周呼啸，把她从睡梦中惊醒。远处若有若无的哭诉声引着她举起蜡烛，穿过一道又一道黑暗的长廊。最后，她推开一间昏暗房间的门，看见角落里那张雕花的四柱床。听她说起那张象牙般苍白的小脸，还有那双四周乌黑、模样古怪的眼睛，迪肯摇了摇头。}
        - {id: ch03-b24, speaker: dickon, text: “那双眼睛跟他娘的一模一样。只不过听人说，他娘的眼睛总是在笑。他们说，科林醒着的时候，克雷文先生简直受不了看他。那双眼睛那么像母亲，可长在一张可怜巴巴的小脸上，看起来又完全不同。”}
        - {id: ch03-b25, speaker: mary_lennox, text: “你觉得他盼着科林死吗？”}
        - {id: ch03-b26, speaker: dickon, text: “不，可他希望科林从没出生过。娘说，对一个孩子来说，这是世上最糟糕的事。没人想要的孩子，几乎没有能好好长大的。不管什么东西，只要拿钱买得到，克雷文先生都会买给可怜的小少爷。可他又恨不得忘掉世上还有这个孩子。他怕有一天看见科林，发现他也成了驼背。”}
        - {id: ch03-b27, speaker: mary_lennox, text: “科林自己也怕得不肯坐起来。他说，要是摸到背上鼓起一个包，他就会发疯，一直尖叫到死。”}
        - {id: ch03-b28, speaker: dickon, text: “嗨！他可不该躺在那里想这种事。哪个孩子老想着这些，还能好起来呢。”}
    - id: ch04
      title: 两个男孩和一个小姑娘
      blocks:
        - {id: ch04-b01, speaker: narrator, text: 小狐狸卧在迪肯身旁的草地上，不时仰起头，向他讨一个爱抚。迪肯俯下身，轻轻揉了揉它的脖子，又沉默着想了好几分钟。过了一会儿，他才抬起头，慢慢环顾花园。}
        - {id: ch04-b02, speaker: dickon, text: “咱们头一回进这里的时候，好像花园里所有东西都是灰的。现在你再慢慢四下看看，告诉我，你发现变化没有？”}
        - {id: ch04-b03, speaker: narrator, text: 玛丽顺着他的目光看遍花园，看清眼前的变化时，忍不住轻轻吸了一口气。}
        - {id: ch04-b04, speaker: mary_lennox, text: “灰墙正在变！好像有一层绿雾慢慢爬上去，几乎成了一层绿色的薄纱。” , emotion: surprised}
        - {id: ch04-b05, speaker: dickon, text: “可不是。它会越来越绿，直到把灰色全遮住。你猜得到我刚才在想什么吗？”}
        - {id: ch04-b06, speaker: mary_lennox, text: “一定是件好事。我想，准跟科林有关。”}
        - {id: ch04-b07, speaker: dickon, text: “我在想，要是他来到这里，就不会老盯着自己的背，等着那里长出包来。他会盯着玫瑰丛，看花芽是不是开了。说不定身体也会好些。咱们有没有办法，让他愿意坐着轮椅出来，躺在这些树底下呢？”}
        - {id: ch04-b08, speaker: mary_lennox, text: “我也一直在想。差不多每次跟他说话，我都会想到。他能不能守住秘密？我们能不能瞒着所有人把他带来？也许你可以替他推轮椅。医生说他必须呼吸新鲜空气。只要他自己要我们带他出去，谁也不敢不听。他不肯跟别人出去，要是愿意跟我们走，他们说不定还会高兴。他还能下命令，不许园丁靠近这边，免得他们发现花园。”}
        - {id: ch04-b09, speaker: narrator, text: 迪肯一边轻轻抓挠上尉的后背，一边使劲思索玛丽提出的办法。}
        - {id: ch04-b10, speaker: dickon, text: “我敢说，这一定对他有好处。咱们不会想着，他要是没出生就好了。咱们只是两个看着花园长大的孩子，再让他也做一个。两个男孩和一个小姑娘，一道看着春天。这可比医生的药强多啦。”}
        - {id: ch04-b11, speaker: mary_lennox, text: “他在房里躺了太久，又一直害怕自己的背，才会变得古古怪怪。他从书里知道很多东西，除此以外却什么也不知道。他说自己病得太重，根本没留意过别的事。他讨厌出门，也讨厌花园和园丁。可是他喜欢听这座花园的事，因为它是一个秘密。我不敢说得太多，不过他说他想看看。”}
        - {id: ch04-b12, speaker: dickon, text: “咱们早晚一定会把他带来，我推得动轮椅。咱们坐在这里的时候，你有没有留意，知更鸟和它的伴儿一直在忙？你看，它停在树枝上，嘴里衔着小树枝，还在琢磨放在哪里最好呢。”}
        - {id: ch04-b13, speaker: narrator, text: 迪肯发出一声低低的口哨。知更鸟嘴里仍衔着树枝，却把头转过来，疑问似的望着他。迪肯像本·韦瑟斯塔夫那样跟它说话，不过本说起话来总爱责骂，迪肯的语气却更像一个朋友在好心出主意。}
        - {id: ch04-b14, speaker: dickon, text: “不管你放在哪儿，都一定错不了。你还没从蛋壳里钻出来，就已经知道怎么搭窝啦。接着忙吧，小伙子。你可没工夫耽搁。”}
        - {id: ch04-b15, speaker: mary_lennox, text: “我真喜欢听你跟它说话！本·韦瑟斯塔夫总是骂它、取笑它。它就在旁边跳来跳去，好像每个字都听得懂。我知道它还挺喜欢。本说，它自负得要命，宁可挨人扔石头，也不愿意没人理睬。” , emotion: happy}
        - {id: ch04-b16, speaker: narrator, text: 听见玛丽的话，迪肯也笑了，随后继续对知更鸟说。}
        - {id: ch04-b17, speaker: dickon, text: “你知道咱们不会打搅你。咱们自己也差不多算野东西啦。祝福你，咱们也在筑巢呢。可留神，别把咱们的秘密说出去。”}
        - {id: ch04-b18, speaker: narrator, text: 知更鸟没有回答，因为它的嘴里正忙着衔住那根小树枝。它带着树枝飞走，回到花园里属于自己的那个角落。玛丽看着它那双黑眼睛。眼睛像沾了露珠一样晶亮，其中的神情分明是在说，哪怕用全世界来换，它也绝不会泄露他们的秘密。}
