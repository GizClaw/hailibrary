audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
    martha:
      display_name: 玛莎
      tts: {delivery: 爽直热情，带亲切的约克郡乡音, timbre: 明亮朴实, pace: 轻快, pitch: 中高音}
    dickon:
      display_name: 迪肯
      tts: {delivery: 质朴自在，带浓重而亲切的约克郡乡音, timbre: 清亮温厚，带荒原少年的蓬勃气息, pace: 轻快从容, pitch: 中高音}
    mrs_medlock:
      display_name: 梅德洛克太太
      tts: {delivery: 严厉能干，慌乱时语速陡然加快, timbre: 结实洪亮, pace: 中等, pitch: 中音}
    dr_craven:
      display_name: 克雷文医生
      tts: {delivery: 谨慎而略显焦躁，话里常带犹疑, timbre: 清晰偏薄, pace: 中等, pitch: 中音}
    nurse:
      display_name: 护士
      tts: {delivery: 恭谨克制，惊讶时仍尽力保持规矩, timbre: 柔和朴实, pace: 中等, pitch: 中音}
  chapters:
    - id: ch01
      title: 医生眼中的奇事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 科林一发过脾气，第二天早晨大家自然就去请克雷文医生。过去医生每次赶来，总会看到同样的科林。他脸色惨白，浑身发抖，躺在床上闷闷不乐。歇斯底里的劲儿还没过去，别人只要开口，他随时又会哭起来。医生害怕这种探视，也厌恶它有多难应付。这一天，他人在外面，下午才回到米瑟斯韦特庄园。
        - id: ch01-b02
          speaker: dr_craven
          text: “他现在怎么样？照这么闹下去，哪天非挣破血管不可。那孩子让歇斯底里和任性折腾得快疯了。”
        - id: ch01-b03
          speaker: narrator
          text: 克雷文医生刚回来，就烦躁地问梅德洛克太太。
        - id: ch01-b04
          speaker: mrs_medlock
          text: “先生，等您见到他，准会不敢相信自己的眼睛。那个长得不好看、整天阴着脸的小姑娘，脾气也没比他好多少，偏偏把他镇住了。谁也不知道她怎么办到的。天知道，她没什么好看的，平常也不大开口。可昨晚，她像只小猫一样扑过去，又跺脚，又命令他别叫。我们谁也不敢这么做。她还真把他吓得停了下来。今天下午更不得了。先生，您上楼亲眼瞧瞧吧。”
        - id: ch01-b05
          speaker: narrator
          text: 医生走进病人的房间，眼前的情景果然惊人。梅德洛克太太一开门，里面竟传出笑声和说话声。科林穿着睡袍坐在长沙发上，腰背挺得直直的。他一边看园艺书里的图，一边跟玛丽说话。那一刻，谁也很难说玛丽相貌平平，因为快乐让她整张脸都亮了起来。
        - id: ch01-b06
          speaker: colin_craven
          text: “瞧这种蓝花，花穗长长的。我们得种上许多。它的名字要分开来念，飞——燕——草。”
        - id: ch01-b07
          speaker: mary_lennox
          text: “迪肯说，那就是长得又高又气派的翠雀花。花园里已经有一丛一丛的了！”
        - id: ch01-b08
          speaker: narrator
          text: 两个孩子看见医生，立刻住了口。玛丽不动了，科林却显得很不耐烦。
        - id: ch01-b09
          speaker: dr_craven
          text: “孩子，听说你昨晚不舒服，我很难过。”
        - id: ch01-b10
          speaker: narrator
          text: 医生说得有点紧张。他本来就是个容易紧张的人。
        - id: ch01-b11
          speaker: colin_craven
          text: “我现在好多了，真的好多了。过一两天，只要天气好，我就要坐轮椅出去。我想呼吸新鲜空气。”
        - id: ch01-b12
          speaker: narrator
          text: 科林的口气活像一位小王公。医生在他身旁坐下，摸着脉搏，好奇地打量他。
        - id: ch01-b13
          speaker: dr_craven
          text: “那一定得是个大晴天。你还得特别当心，不能累着自己。”
        - id: ch01-b14
          speaker: colin_craven
          text: “新鲜空气不会让我累。”
        - id: ch01-b15
          speaker: narrator
          text: 从前，这位小少爷不止一次气得尖叫，还咬定新鲜空气会让他着凉，会要他的命。难怪医生听了会吃惊。
        - id: ch01-b16
          speaker: dr_craven
          text: “可我记得，你并不喜欢新鲜空气。”
        - id: ch01-b17
          speaker: colin_craven
          text: “我独自一个人的时候不喜欢。可这回我表妹陪我出去。”
        - id: ch01-b18
          speaker: dr_craven
          text: “护士当然也一起去吧？”
        - id: ch01-b19
          speaker: colin_craven
          text: “不，我不要护士。”
        - id: ch01-b20
          speaker: narrator
          text: 他说得威风凛凛。玛丽立刻想起印度的那位小王子。他浑身缀满钻石、祖母绿和珍珠，棕色小手上戴着硕大的红宝石。只要那只手一挥，仆人就得上前行礼，听候命令。
        - id: ch01-b21
          speaker: colin_craven
          text: “我表妹知道怎么照顾我。她陪着我，我总会好一些。昨晚就是她让我好起来的。我还认识一个非常强壮的男孩，他会替我推轮椅。”
        - id: ch01-b22
          speaker: narrator
          text: 医生听了，心里竟有些不安。这个难缠又歇斯底里的男孩要是真的好了，医生自己便再也没有继承米瑟斯韦特庄园的可能。不过，他只是性情软弱，并不是一个不择手段的人。无论那份遗产有多诱人，他都不打算让科林真的遇到危险。
        - id: ch01-b23
          speaker: dr_craven
          text: “那个男孩必须强壮，也必须稳重。我还得知道他是什么样的人。他是谁？叫什么？”
        - id: ch01-b24
          speaker: mary_lennox
          text: “那个男孩就是迪肯。”
        - id: ch01-b25
          speaker: narrator
          text: 玛丽忽然插了嘴。她总觉得，凡是熟悉荒原的人都该认识迪肯。她果然没猜错。医生严肃的脸一下舒展开来，放心地笑了。
        - id: ch01-b26
          speaker: dr_craven
          text: “哦，原来是迪肯。要是他，你就安全了。那孩子壮得像一匹荒原矮马。”
        - id: ch01-b27
          speaker: mary_lennox
          text: “他还靠得住哩。他是全约克郡最最靠得住的小伙子。”
        - id: ch01-b28
          speaker: narrator
          text: 玛丽近来总对科林说约克郡土话，一不留神就把那口乡音带了出来。
        - id: ch01-b29
          speaker: dr_craven
          text: “这是迪肯教你的？”
        - id: ch01-b30
          speaker: narrator
          text: 医生忍不住笑出了声。
        - id: ch01-b31
          speaker: mary_lennox
          text: “我学约克郡话，就像学法语一样。它跟印度的土语很像，聪明人都会设法去学。我喜欢，科林也喜欢。”
        - id: ch01-b32
          speaker: dr_craven
          text: “好吧，既然能让你们开心，大概也没什么害处。科林，你昨晚服溴剂了吗？”
        - id: ch01-b33
          speaker: colin_craven
          text: “没有。起先我不肯吃。后来玛丽叫我安静下来，又用很轻的声音，讲春天怎样一点一点爬进花园。我听着就睡着了。”
        - id: ch01-b34
          speaker: dr_craven
          text: “听起来倒很能安神。你显然好多了，不过有件事你必须记住……”
        - id: ch01-b35
          speaker: narrator
          text: 医生更加迷惑了。他斜眼看向坐在脚凳上的玛丽，她只低头望着地毯，一声不响。
        - id: ch01-b36
          speaker: colin_craven
          text: “我不想记住！我一个人躺着，只要记起自己有病，身上就会到处疼。我还会想到那些讨厌得让我非尖叫不可的事。要是世上有个医生，能叫你忘记自己有病，不再总想着它，我一定让人把他请来。表妹就是能让我忘掉，所以她能让我好起来。”
        - id: ch01-b37
          speaker: narrator
          text: 小王公一边说，一边挥了挥瘦削的手。照他的派头，那只手上真该戴满红宝石的王家印戒。科林每回闹过脾气，医生总得留很久，做上许多事。可这天下午，他既没开药，也没留下新嘱咐，更没有遇上难堪的场面。这是他头一次这么快告辞。下楼时，他满脸沉思。到了书房，梅德洛克太太一看就知道，医生完全叫这件事弄糊涂了。
        - id: ch01-b38
          speaker: mrs_medlock
          text: “先生，您原先能想到他会变成这样吗？”
        - id: ch01-b39
          speaker: dr_craven
          text: “这种情形确实从没见过。不过它比以前好，这一点谁也不能否认。”
        - id: ch01-b40
          speaker: mrs_medlock
          text: “我真相信苏珊·索尔比说得对。昨天我去思韦特，路过她家，就进去聊了几句。她说：‘萨拉·安，那姑娘也许不乖，也许长得不好看，可她毕竟是个孩子。孩子就是需要孩子。’我和苏珊从前还在同一所学校念书呢。”
        - id: ch01-b41
          speaker: dr_craven
          text: “她是我认识的最会照料病人的人。只要在病人家里见到她，我就知道那个人多半能救回来。”
        - id: ch01-b42
          speaker: narrator
          text: 梅德洛克太太笑了。她一直很喜欢苏珊·索尔比。
        - id: ch01-b43
          speaker: mrs_medlock
          text: “苏珊就是有她的一套。她昨天说的一段话，我琢磨了一早晨。她说，有回孩子们打完架，她就教训他们：‘我上学时，地理书说世界像个橙子。不到十岁，我就懂了，整个橙子不归任何一个人。每个人顶多分到四分之一，有时四瓣还不够大家分。可你们谁也别以为整个橙子都归自己。要不然，你们早晚会发现自己错了，还非得狠狠碰几回壁才明白。孩子从别的孩子那里学到的，就是不能把整个橙子连皮都抢走。你真去抢，没准连籽儿也得不到。何况籽儿还苦得不能吃。’”
        - id: ch01-b44
          speaker: dr_craven
          text: “她是个精明的女人。”
        - id: ch01-b45
          speaker: narrator
          text: 医生说着，穿上了外套。
        - id: ch01-b46
          speaker: mrs_medlock
          text: “她说话就是有她自己的味道。我有时会告诉她：‘哎呀，苏珊，要不是你偏偏是这么个人，又讲一口这么重的约克郡土话，有几回我简直都想说你聪明了。’”
        - id: ch01-b47
          speaker: narrator
          text: 梅德洛克太太说完，显得十分得意。
    - id: ch02
      title: 春天真的来了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那天夜里，科林一次也没醒，一觉睡到天亮。早晨睁开眼睛，他安静地躺着，不知不觉露出了笑容。他自己都没察觉，只觉得全身有一种说不出的舒服滋味。原来醒着竟也这样快活。他翻过身，舒舒服服地伸展四肢。那些一直紧紧捆住他的绳索，仿佛自己松开了，终于放他自由。克雷文医生大概会说，他的神经放松下来，得到了休息，可科林并不知道这些。
        - id: ch02-b02
          speaker: narrator
          text: 他没有盯着墙壁，后悔自己醒来。脑子里装满了昨天和玛丽商量的计划，还有花园、迪肯和那些野生小动物。心里有事情可想，真好。醒来不到十分钟，他就听见脚步声沿走廊跑来。玛丽出现在门口，转眼又跑到床边，还把带着早晨气息的新鲜空气一同带了进来。
        - id: ch02-b03
          speaker: colin_craven
          text: “你出去过！你真的出去过！我闻到那股好闻的树叶味了！”
          emotion: happy
        - id: ch02-b04
          speaker: narrator
          text: 玛丽一路跑来，头发松了，被风吹得蓬蓬的。清新的空气让她精神焕发，双颊红扑扑的，只是科林看不见。
        - id: ch02-b05
          speaker: mary_lennox
          text: “外面美极了！你从来没见过那么美的景象。它来了！前些天早晨，我还以为它来了，其实那时它正在路上。现在它真的到了！春天来了！迪肯也这么说！”
          emotion: happy
        - id: ch02-b06
          speaker: colin_craven
          text: “真的来了？”
          emotion: surprised
        - id: ch02-b07
          speaker: narrator
          text: 科林其实一点也不懂春天是什么滋味，心却怦怦跳了起来。他当真在床上坐直了。
        - id: ch02-b08
          speaker: colin_craven
          text: “快打开窗户！说不定我们会听见金色的号角声！”
          emotion: happy
        - id: ch02-b09
          speaker: narrator
          text: 他一半是欢喜得激动，一半又觉得自己的想象好笑。玛丽却立刻奔到窗前，把窗户敞开。清新柔和的空气、花草的香气和鸟儿的歌声，一齐涌进房间。
        - id: ch02-b10
          speaker: mary_lennox
          text: “这就是新鲜空气。你平躺着，一大口一大口地吸。迪肯躺在荒原上时就是这么做的。他说，自己能感觉空气流进血管，让他强壮起来。他还觉得自己能一直一直活下去。快吸，不停地吸。”
        - id: ch02-b11
          speaker: narrator
          text: 玛丽只是把迪肯的话重复了一遍，却正好抓住了科林的想象。
        - id: ch02-b12
          speaker: colin_craven
          text: “一直一直活下去！迪肯真的会有这种感觉吗？”
        - id: ch02-b13
          speaker: narrator
          text: 他照玛丽的话躺好，一遍又一遍地深深吸气。吸着吸着，他竟觉得一件从来没有过的、美妙极了的事，正在自己身上发生。玛丽也回到了床边。
        - id: ch02-b14
          speaker: mary_lennox
          text: “好多东西都挤着从土里冒出来。花儿在舒展，什么枝头都有花苞。绿色的轻纱快把灰色全盖住了。鸟儿忙着筑巢，怕来不及，有几只甚至在秘密花园里抢地方。玫瑰丛活得不能再活。小路边和树林里全是报春花。我们种的种子也发芽了。迪肯还带来狐狸、乌鸦、松鼠和一只刚出生的小羊羔！”
        - id: ch02-b15
          speaker: narrator
          text: 玛丽一口气说到这里，才停下来喘气。三天前，迪肯在荒原的金雀花丛中发现了那只羊羔。它躺在死去的母羊身旁。这不是迪肯第一次捡到没了母亲的小羊，他知道该怎么办。他用外套裹住它，抱回小屋，让它躺在炉边，再喂它喝温牛奶。
        - id: ch02-b16
          speaker: narrator
          text: 那是个软绵绵的小东西，长着一张讨人喜欢的傻乎乎的娃娃脸，两条腿对小小的身子来说，显得有点太长。迪肯抱着它走过荒原，衣兜里装着奶瓶，还有一只松鼠。玛丽坐在树下时，小羊暖乎乎地蜷在她腿上。那份奇异的快乐把她的心装得太满，她几乎说不出话。一只羊羔，一只活生生的羊羔，像婴儿一样躺在她腿上！
        - id: ch02-b17
          speaker: narrator
          text: 玛丽欢天喜地地讲着。科林听得入神，还不停吸着新鲜空气。护士就在这时走进来。她看见敞开的窗户，吓了一跳。过去有许多个暖和的日子，科林都咬定开窗会让人着凉，害得她陪他闷在这间屋里。
        - id: ch02-b18
          speaker: nurse
          text: “科林少爷，您真的不觉得冷吗？”
        - id: ch02-b19
          speaker: colin_craven
          text: “不冷。我在一大口一大口地呼吸新鲜空气，它会让人强壮。我要起床，坐到长沙发上吃早餐。表妹也跟我一起吃。”
        - id: ch02-b20
          speaker: narrator
          text: 护士忍住笑，出去吩咐人准备两份早餐。她本来就觉得仆人大厅比病人的卧室有趣，现在大家又都等着听楼上的消息。仆人们拿那个不讨人喜欢的孤僻小少爷开起玩笑。厨娘说，他总算碰见了能管住他的人，活该让人管管。所有人都受够了他的哭闹。那位有家有口的男管家还不止一次说，这病孩子要是好好挨一顿揍，准会舒服得多。
    - id: ch03
      title: 荒原上的客人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 科林坐上长沙发，两份早餐也摆到了桌上。随后，他拿出小王公的派头，对护士宣布一件事。
        - id: ch03-b02
          speaker: colin_craven
          text: “今天早晨会有一个男孩、一只狐狸、一只乌鸦、两只松鼠，还有一只刚出生的小羊来看我。他们一到，你就马上叫人领他们上楼。你们不许在仆人大厅逗那些动物，把它们留在那里。我要他们到我这儿来。”
        - id: ch03-b03
          speaker: narrator
          text: 护士轻轻抽了口气，又赶快咳嗽一声，想把它遮过去。
        - id: ch03-b04
          speaker: nurse
          text: “是，少爷。”
        - id: ch03-b05
          speaker: colin_craven
          text: “我告诉你该怎么办。让玛莎领他们来。那个男孩是玛莎的弟弟，名叫迪肯。他能迷住动物。”
        - id: ch03-b06
          speaker: narrator
          text: 科林一边说，一边挥了挥手。
        - id: ch03-b07
          speaker: nurse
          text: “科林少爷，但愿那些动物不会咬人。”
        - id: ch03-b08
          speaker: colin_craven
          text: “我说过，他能迷住动物。被他迷住的动物从来不会咬人。”
        - id: ch03-b09
          speaker: mary_lennox
          text: “印度还有耍蛇人呢。他们能把蛇头放进自己嘴里。”
        - id: ch03-b10
          speaker: nurse
          text: “老天爷！”
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: 护士听得直打寒战。两个孩子继续吃早餐，清晨的空气从敞开的窗户不断涌进来，围绕着他们。科林这一顿早餐吃得格外香。玛丽一本正经地看着他，对他每吃下一口都很感兴趣。
        - id: ch03-b12
          speaker: mary_lennox
          text: “你会开始长胖，就跟我一样。我在印度时从来不想吃早餐，现在每一顿都想吃。”
        - id: ch03-b13
          speaker: colin_craven
          text: “我今天早晨就很想吃。也许是新鲜空气的缘故。你说迪肯什么时候会来？”
        - id: ch03-b14
          speaker: narrator
          text: 迪肯没有让他久等。大约十分钟以后，玛丽忽然举起一只手。
        - id: ch03-b15
          speaker: mary_lennox
          text: “听！你听见乌鸦叫了吗？”
        - id: ch03-b16
          speaker: narrator
          text: 科林侧耳一听，果然听见一声沙哑的“嘎——嘎”。在一座宅子里面听见这样的声音，实在是世上最古怪的事。
        - id: ch03-b17
          speaker: colin_craven
          text: “听见了。”
        - id: ch03-b18
          speaker: mary_lennox
          text: “那是煤灰。再听！你听见小羊叫了吗？声音很轻很轻。”
        - id: ch03-b19
          speaker: colin_craven
          text: “哦，我听见了！”
          emotion: happy
        - id: ch03-b20
          speaker: mary_lennox
          text: “那就是刚出生的小羊羔。迪肯来了。”
        - id: ch03-b21
          speaker: narrator
          text: 迪肯在荒原上穿的靴子又厚又笨。虽然尽力放轻脚步，走过长长的走廊时，还是咚咚作响。玛丽和科林听着他一步步走近，直到他穿过挂毯门，踏上科林门外柔软的地毯。
        - id: ch03-b22
          speaker: martha
          text: “少爷，请您瞧。迪肯带着他那些小家伙来啦。”
        - id: ch03-b23
          speaker: narrator
          text: 玛莎打开门，迪肯跟着走进房间。他笑得又亲切又开朗，脸上绽开了自己最灿烂、最舒展的笑容。他怀里抱着刚出生的小羊，小红狐狸紧挨着他，在脚边一路小跑。果仁坐在他左肩，煤灰站在右肩，果壳从外套口袋里探出脑袋和两只小爪子。
        - id: ch03-b24
          speaker: narrator
          text: 科林慢慢坐直，盯着他们看了又看，就像第一次看见玛丽时那样。不过这回，他眼里全是惊奇和欢喜。先前听了那么多，他还是没有真正想明白迪肯会是什么模样，也没想到那些动物会跟他这样亲近。狐狸、乌鸦、松鼠和羊羔，仿佛都是男孩自己的一部分。科林这辈子从没跟另一个男孩子说过话。眼前的一切让他又快乐又好奇，两种感觉一下涌得太满，他连开口都忘了。
    - id: ch04
      title: 像蓝白蝴蝶一样的花
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 迪肯一点也不害羞，也没有觉得不自在。他第一次碰见煤灰时，乌鸦听不懂他的话，只会盯着他看，一句也不回答。迪肯那时也没有尴尬。小动物还不了解你以前，总会这样。他走到长沙发边，轻轻把羊羔放在科林腿上。小家伙马上转向暖和的天鹅绒睡袍，把鼻子一个劲儿往衣褶里拱。它那颗卷毛紧紧的小脑袋又温柔又着急，不停顶着科林的腰。到了这时候，哪个男孩还能不开口呢？
        - id: ch04-b02
          speaker: colin_craven
          text: “它在干什么？它想要什么？”
          emotion: surprised
        - id: ch04-b03
          speaker: dickon
          text: “它在找妈妈。俺故意让它饿着一点儿才抱过来，因为俺知道，你准想看它吃奶。”
        - id: ch04-b04
          speaker: narrator
          text: 迪肯越笑越开心。他跪在长沙发旁，从衣兜里取出奶瓶，一只温柔的棕色手轻轻转过羊羔毛茸茸的白脑袋。
        - id: ch04-b05
          speaker: dickon
          text: “来吧，小家伙。你找的是这个。这东西可比丝绒外套里头的多得多。给你。”
        - id: ch04-b06
          speaker: narrator
          text: 他把橡皮奶嘴塞进那张四处乱拱的小嘴。羊羔立刻贪婪地吮吸起来，快活得忘乎所以。这下，再也不用发愁该说什么了。等小羊睡着，科林的问题早已一个接一个地冒出来，迪肯全都回答。他还讲起三天前天刚亮时，自己怎样发现这只羊羔。那时他站在荒原上，听着云雀歌唱，看它越飞越高，最后在高高的蓝天里只剩一个小点。
        - id: ch04-b07
          speaker: dickon
          text: “要不是还能听见它唱，俺几乎就找不着它了。俺正纳闷，它眼看要飞出这个世界，俺怎么还听得见呢？就在那时候，远处的金雀花丛里又传来一个声音。羊叫得很虚弱。俺一听就知道，是只刚出生的小羊在挨饿。它准是出了什么事，丢了妈妈，要不然不会饿成这样。俺马上去找。嗨，真叫俺好找！俺在花丛里钻进钻出，绕了一圈又一圈，可回回都像走错了。后来总算瞧见荒原顶上一块岩石旁边有一点白色。俺爬上去，就找到了这个小家伙。它又冷又饿，已经只剩半条命啦。”
        - id: ch04-b08
          speaker: narrator
          text: 迪肯讲着，煤灰神气十足地从敞开的窗户飞进飞出，还嘎嘎地评论外面的风景。果仁和果壳一次次跑到屋外的大树上探险，沿树干蹿上蹿下，再到枝条上四处查看。上尉蜷在迪肯身旁。迪肯自己最喜欢坐在壁炉前的地毯上。
        - id: ch04-b09
          speaker: narrator
          text: 大家又一起翻看园艺书里的图片。每翻到一种花，乡下人给它取的名字，迪肯全都知道。他还能指着图片告诉大家，秘密花园里已经长了哪些，一样也不会认错。
        - id: ch04-b10
          speaker: dickon
          text: “这上头写的名字，俺可念不出来。不过俺们管它叫耧斗菜。那边那一种叫金鱼草。这两种花都能自己长在树篱里，可书上画的是花园里种的，所以长得更高，也更气派。花园里已经有好大几丛耧斗菜。等它们开花，就像满床蓝蝴蝶和白蝴蝶在那里扇翅膀哩。”
        - id: ch04-b11
          speaker: colin_craven
          text: “我要去看！我一定要亲眼看见它们！”
          emotion: happy
        - id: ch04-b12
          speaker: mary_lennox
          text: “对，你非去不可。你可不能再耽误工夫啦。”
