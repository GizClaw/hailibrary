  chapters:
    - id: ch01
      title: It Has Come!
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Dr. Craven was always summoned right after one of Colin's tantrums. Usually he arrived to find a pale, trembling boy lying in bed. Colin would be sullen, still so worked up that the slightest word might set him sobbing again. The doctor dreaded those difficult visits and hated dealing with them. This time he had been away from Misselthwaite all morning and did not return until afternoon.
        - id: ch01-b02
          speaker: dr_craven
          text: >-
            How is he? One day he'll burst a blood vessel in one of these fits. The boy is half mad from hysterics and always having his own way.
        - id: ch01-b03
          speaker: narrator
          text: He spoke irritably, but Mrs. Medlock had astonishing news for him.
        - id: ch01-b04
          speaker: mrs_medlock
          text: >-
            Well, sir, you won't believe your own eyes. That plain, sour-faced child has bewitched him somehow. She's nearly as difficult as he is, and there's nothing remarkable to look at. She hardly speaks, either. But last night she did what none of us would dare. She flew at him like a little cat, stamped her feet, and ordered him to stop screaming. She startled him so much that he did stop. And this afternoon... well, you'd better come upstairs and see. I can hardly believe it myself.
        - id: ch01-b05
          speaker: narrator
          text: >-
            What Dr. Craven saw in Colin's room truly astonished him. As Mrs. Medlock opened the door, laughter and lively chatter reached them. Colin was not lying pale and shaken in his bed. He sat perfectly straight on his sofa in his dressing gown, talking as he studied a picture in one of the garden books. Mary sat with him. Her face glowed so brightly with pleasure that, at that moment, no one could have called the plain child plain at all.
        - id: ch01-b06
          speaker: colin
          text: >-
            We'll have plenty of those tall blue flowers. They're called delphiniums.
        - id: ch01-b07
          speaker: mary
          text: >-
            Dickon says they're larkspurs grown big and grand. There are already clumps of them in the garden.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Then they noticed Dr. Craven. Both children stopped. Mary went still, and Colin's face turned fretful.
        - id: ch01-b09
          speaker: dr_craven
          text: >-
            I'm sorry you were ill last night, my boy.
        - id: ch01-b10
          speaker: narrator
          text: The doctor sounded a little nervous. He was a nervous man.
        - id: ch01-b11
          speaker: colin
          text: >-
            I'm much better now. If the weather is fine, I'm going out in my chair in a day or two. I want fresh air.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Colin spoke like a young rajah. Dr. Craven sat beside him, took his pulse, and watched him with curiosity.
        - id: ch01-b13
          speaker: dr_craven
          text: >-
            The day must be very fine, and you must take care not to tire yourself.
        - id: ch01-b14
          speaker: colin
          text: Fresh air won't make me tired.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The same boy had once screamed with rage that fresh air would give him a cold and kill him. No wonder the doctor was startled.
        - id: ch01-b16
          speaker: dr_craven
          text: I thought you disliked fresh air.
        - id: ch01-b17
          speaker: colin
          text: >-
            I do when I'm alone. But my cousin is coming with me.
        - id: ch01-b18
          speaker: dr_craven
          text: And your nurse will go too, of course?
        - id: ch01-b19
          speaker: colin
          text: >-
            No. I will not have the nurse.
        - id: ch01-b20
          speaker: narrator
          text: >-
            He said it so grandly that Mary pictured the young Indian prince she had once seen, covered in diamonds, emeralds, and pearls, waving a small hand heavy with rubies as servants bowed before him.
        - id: ch01-b21
          speaker: colin
          text: >-
            My cousin can look after me. I'm always better with her. She made me better last night. And a very strong boy I know will push my chair.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Dr. Craven felt alarmed by Colin's plan. If this troublesome, hysterical boy happened to recover, the doctor himself would lose every chance of inheriting Misselthwaite. The thought was there, but Dr. Craven was not an unscrupulous man. He was a weak one. Whatever he stood to lose, he had no intention of letting Colin put himself in actual danger.
        - id: ch01-b23
          speaker: dr_craven
          text: >-
            The boy must be strong and dependable. I need to know who he is. What's his name?
        - id: ch01-b24
          speaker: mary
          text: It's Dickon.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Mary assumed everyone who knew the moor must know Dickon. She was right. The doctor's serious face softened into a relieved smile.
        - id: ch01-b26
          speaker: dr_craven
          text: >-
            Oh, Dickon. You'll be safe with him. That boy is as strong as a moor pony.
        - id: ch01-b27
          speaker: mary
          text: >-
            And he's trusty. He's th' trustiest lad i' Yorkshire.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Mary had been speaking Yorkshire with Colin and forgot herself. Dr. Craven laughed aloud.
        - id: ch01-b29
          speaker: dr_craven
          text: Did Dickon teach you to talk like that?
        - id: ch01-b30
          speaker: mary
          text: >-
            I'm learning it the way I learned French. It's like one of the native dialects in India. Clever people try to learn those. I like Yorkshire, and Colin does too.
        - id: ch01-b31
          speaker: dr_craven
          text: >-
            Well, if it amuses you, I suppose it won't hurt. Colin, did you take your bromide last night?
        - id: ch01-b32
          speaker: colin
          text: >-
            No. I refused it at first. After Mary quieted me, she spoke softly about spring creeping into a garden until I fell asleep.
        - id: ch01-b33
          speaker: dr_craven
          text: That does sound soothing.
        - id: ch01-b34
          speaker: narrator
          text: >-
            More puzzled than ever, Dr. Craven glanced at Mary. She sat silently on her stool with her eyes on the carpet.
        - id: ch01-b35
          speaker: dr_craven
          text: You're clearly better, but you must remember—
        - id: ch01-b36
          speaker: colin
          text: >-
            I don't want to remember. When I lie alone and think about being ill, pains begin everywhere. Then I think of horrible things until I scream because I hate them. If a doctor could make me forget I was sick instead of reminding me, I'd have him brought here. My cousin makes me better because she makes me forget.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Colin waved his thin hand as though it ought to wear royal rings made of rubies. Dr. Craven had never made such a short visit after a tantrum. Usually he had to stay for a very long time and try all sorts of things while Colin made every moment unpleasant. Today there were no disagreeable scenes. He prescribed no medicine and left no new orders. Downstairs, he looked deeply thoughtful. When he spoke with Mrs. Medlock in the library, she could see how completely the change had puzzled him.
        - id: ch01-b38
          speaker: mrs_medlock
          text: Well, sir, would you ever have believed it?
        - id: ch01-b39
          speaker: dr_craven
          text: >-
            Things have certainly changed. And no one can deny this is better than before.
        - id: ch01-b40
          speaker: mrs_medlock
          text: >-
            I believe Susan Sowerby was right. I stopped at her cottage yesterday on my way to Thwaite. She told me, “Sarah Ann, Mary may not be good or pretty, but she's a child, and children need other children.” Susan and I went to school together.
        - id: ch01-b41
          speaker: dr_craven
          text: >-
            She's the finest nurse for sick people I know. If I find Susan in a cottage, I know my patient has a good chance.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Mrs. Medlock smiled. She was fond of Susan and happily went on talking.
        - id: ch01-b43
          speaker: mrs_medlock
          text: >-
            Susan has such a way with people. I've been thinking all morning about something she said yesterday. Once, after her children had been fighting, she gave them a little sermon. Her geography book had taught her that the world was shaped like an orange, but before she was ten, she'd learned that the whole orange belongs to nobody. No one owns more than one little quarter, and sometimes there hardly seem to be enough quarters to go around. She warned them not to imagine they owned the whole thing. Hard knocks would prove them wrong, and that lesson would hurt. Susan says children teach one another there's no sense grabbing for the whole orange, peel and all. If you try it, you may not even get the seeds, and those are too bitter to eat anyway.
        - id: ch01-b44
          speaker: dr_craven
          text: She's a sharp woman.
        - id: ch01-b45
          speaker: narrator
          text: Dr. Craven put on his coat.
        - id: ch01-b46
          speaker: mrs_medlock
          text: >-
            She certainly knows how to say things. Sometimes I've told her, “Susan, if you were a different sort of woman and didn't speak such broad Yorkshire, there are times I'd almost call you clever.”
        - id: ch01-b47
          speaker: narrator
          text: >-
            That night Colin slept straight through. When he woke, he lay quietly smiling without knowing it. Being awake actually felt pleasant. He rolled over and stretched, as if tight strings that had held him were finally coming loose. Dr. Craven would have said his nerves had relaxed and rested.
        - id: ch01-b48
          speaker: narrator
          text: >-
            On other mornings, Colin had lain staring at the wall and wished he had never awakened. This morning his mind was full of yesterday's plans. He pictured the garden, Dickon, and all the wild creatures. It felt wonderful simply to have things he wanted to think about. He had been awake for less than ten minutes when running feet sounded in the corridor. Mary appeared at the door, then raced across the room to his bedside. Her hair had come loose and the wind had blown it about. She carried a breath of outdoor air with her, filled with the scent of the morning.
        - id: ch01-b49
          speaker: colin
          text: >-
            You've been outside! I can smell the leaves on you!
          emotion: happy
        - id: ch01-b50
          speaker: mary
          text: >-
            It's so beautiful! You've never seen anything like it. It has come! I thought it had come that other morning, but then it was only on the way. Now it's truly here. Spring has come! Dickon says so!
          emotion: happy
        - id: ch01-b51
          speaker: narrator
          text: >-
            Mary was breathless from running. The outdoor air had made her bright and turned her cheeks pink, though Colin could not see their color. Her joy rushed through every word. Colin himself knew almost nothing about spring, yet Mary's news made his heart beat faster. Without even thinking about it, he sat straight up in bed.
        - id: ch01-b52
          speaker: colin
          text: >-
            Has it? Open the window! Maybe we'll hear golden trumpets!
          emotion: happy
        - id: ch01-b53
          speaker: narrator
          text: >-
            Colin laughed, half from joyful excitement and half at his own fancy. Mary hurried to the window and flung it wide. Soft, fresh air poured in, full of scents and birdsong.
        - id: ch01-b54
          speaker: mary
          text: >-
            That's fresh air. Lie back and take long breaths. Dickon does that when he's stretched out on the moor. He says he feels the air in his veins. It makes him strong, as if he could live forever and ever. Keep breathing it in.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Mary was repeating Dickon's words, but they caught Colin's imagination.
        - id: ch01-b56
          speaker: colin
          text: >-
            Forever and ever? Does it really make him feel that way?
        - id: ch01-b57
          speaker: narrator
          text: >-
            He followed her instructions and drew one deep breath after another. Soon he felt that something new and delightful was happening inside him. Mary hurried back to his bed, overflowing with news.
        - id: ch01-b58
          speaker: mary
          text: >-
            Things are pushing up everywhere. Flowers are unfolding, everything has buds, and a green veil covers almost all the gray. The birds are rushing to build nests. Some are even fighting over places in the secret garden because they're afraid they'll be too late. The rosebushes are as wick as wick can be. There are primroses in the lanes and woods, and our seeds have come up. And Dickon brought the fox, the crow, the squirrels, and a newborn lamb!
          emotion: happy
        - id: ch01-b59
          speaker: narrator
          text: >-
            Mary stopped to catch her breath. Dickon had found the lamb three days earlier, lying beside its dead mother among the gorse bushes on the moor. It was not the first motherless lamb he had found, so he knew exactly what to do. He wrapped the little creature in his own jacket and carried it to the cottage. There he let it rest close to the fire and fed it warm milk.
        - id: ch01-b60
          speaker: narrator
          text: >-
            The lamb was wonderfully soft, with a darling, foolish baby face and legs that seemed much too long for its small body. Dickon had carried it across the moor in his arms. Its feeding bottle was tucked into his pocket along with a squirrel. Later Mary had sat beneath a tree with the lamb's warm, loose body huddled on her lap. She felt so full of strange joy that she could hardly speak. A lamb, a real living lamb, was lying in her lap like a baby.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Mary was describing it joyfully while Colin listened and breathed the morning air. Then the nurse came in. The open window made her start. On many warm days she had sat in that stifling room because Colin insisted an open window would give him a cold.
        - id: ch01-b62
          speaker: nurse
          text: Are you certain you aren't chilly, Master Colin?
        - id: ch01-b63
          speaker: colin
          text: >-
            No. I'm taking deep breaths of fresh air because it makes you strong. I'm getting up to the sofa for breakfast, and my cousin will eat with me.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Hiding a smile, the nurse went to order two breakfasts. She found the servants' hall much more entertaining than the invalid's room, especially now that everyone downstairs wanted the latest news. The staff had grown thoroughly weary of Colin's tantrums. There was plenty of joking about the unpopular young recluse. The cook said he had finally met his master, and good for him. The butler had children of his own, and more than once he had declared that the invalid would be much better after a good hiding.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Once Colin was settled on his sofa and breakfast for two stood on the table, he addressed the nurse in his grandest rajah manner.
        - id: ch01-b66
          speaker: colin
          text: >-
            A boy is coming to see me this morning, along with a fox, a crow, two squirrels, and a newborn lamb. Bring them upstairs the moment they arrive. You are not to keep them in the servants' hall while you play with the animals. I want them here.
        - id: ch01-b67
          speaker: narrator
          text: The nurse gave a small gasp and disguised it as a cough.
        - id: ch01-b68
          speaker: nurse
          text: Yes, sir.
        - id: ch01-b69
          speaker: colin
          text: >-
            Tell Martha to bring them up. The boy is her brother. His name is Dickon, and he charms animals.
        - id: ch01-b70
          speaker: nurse
          text: I hope none of them bite, Master Colin.
        - id: ch01-b71
          speaker: colin
          text: >-
            I told you he's a charmer. Animals belonging to a charmer never bite.
        - id: ch01-b72
          speaker: mary
          text: >-
            India has snake charmers. They can put the snakes' heads right into their mouths.
        - id: ch01-b73
          speaker: nurse
          text: Goodness!
          emotion: disgusted
        - id: ch01-b74
          speaker: narrator
          text: >-
            The nurse shuddered at the thought. Mary and Colin ate their breakfast with the morning air pouring through the open window and flowing over them. Colin's breakfast was a very good one, and he ate it well. Mary watched him with serious interest, noticing the change in his appetite.
        - id: ch01-b75
          speaker: mary
          text: >-
            You'll start getting fatter, just as I did. In India I never wanted breakfast. Now I'm always hungry for it.
        - id: ch01-b76
          speaker: colin
          text: >-
            I wanted mine today. Maybe it was the fresh air. When will Dickon get here?
        - id: ch01-b77
          speaker: narrator
          text: >-
            They did not wait long. About ten minutes later, Mary raised her hand.
        - id: ch01-b78
          speaker: mary
          text: Listen. Did you hear a crow?
        - id: ch01-b79
          speaker: narrator
          text: >-
            Colin listened. A rough caw-caw sounded inside the house, the strangest place in the world to hear it.
        - id: ch01-b80
          speaker: colin
          text: Yes, I heard it.
        - id: ch01-b81
          speaker: mary
          text: >-
            That's Soot. Listen once more. Can you hear a tiny bleat?
        - id: ch01-b82
          speaker: colin
          text: Oh, yes!
          emotion: happy
        - id: ch01-b83
          speaker: mary
          text: That's the newborn lamb. He's coming.
        - id: ch01-b84
          speaker: narrator
          text: >-
            Dickon's heavy moorland boots clumped through the long corridors even though he tried to tread softly. Mary and Colin heard him marching closer until he passed through the tapestry door and reached the soft carpet outside Colin's room.
        - id: ch01-b85
          speaker: martha
          text: >-
            If you please, sir, here's Dickon and his creatures.
        - id: ch01-b86
          speaker: narrator
          text: >-
            Dickon entered wearing his widest, warmest smile. He held the newborn lamb in his arms. The little red fox trotted beside him. Nut perched on his left shoulder and Soot on his right, while Shell's head and paws peeked from his coat pocket.
        - id: ch01-b87
          speaker: narrator
          text: >-
            Colin slowly sat up and stared, just as he had stared at Mary the first time. Now his face held wonder and delight. Despite everything Mary had told him, he had never truly understood what Dickon would be like. He had not imagined that the fox, crow, squirrels, and lamb would stay so close to Dickon, or seem so friendly with him that they were almost parts of the boy himself. Colin had never spoken to another boy in his life. His own pleasure and curiosity overwhelmed him so completely that he forgot to say anything.
        - id: ch01-b88
          speaker: narrator
          text: >-
            Dickon felt no shyness at all. The crow had stared silently when they first met because it did not know his language, and that had never embarrassed him. Creatures were often quiet until they learned about you. Dickon walked to the sofa and gently placed the lamb in Colin's lap.
        - id: ch01-b89
          speaker: narrator
          text: >-
            At once, the little animal turned toward the warm velvet dressing gown. It nosed through the folds and bumped its tightly curled head against Colin's side with soft impatience. No boy could have stayed silent then.
        - id: ch01-b90
          speaker: colin
          text: >-
            What is it doing? What does it want?
          emotion: surprised
        - id: ch01-b91
          speaker: dickon
          text: >-
            It's looking for its mother. I brought th' little thing here a bit hungry, because I knew tha'd want to watch it feed.
        - id: ch01-b92
          speaker: narrator
          text: Dickon knelt beside the sofa and pulled a feeding bottle from his pocket.
        - id: ch01-b93
          speaker: dickon
          text: >-
            Come along, little 'un. Here's what tha' wants. Tha'll get more from this than from a silk velvet coat. There now.
        - id: ch01-b94
          speaker: narrator
          text: >-
            With one gentle brown hand, he turned the small white head and slipped the rubber tip into its searching mouth. The lamb sucked with ravenous delight.
        - id: ch01-b95
          speaker: narrator
          text: >-
            After that, no one wondered what to say. Questions poured from Colin, and Dickon answered every one. They went on talking until the lamb had finished feeding and fallen asleep. Dickon told them how he had found it three mornings before, just as the sun was rising. He had been standing alone on the moor, listening to a skylark. As he listened, he watched the bird swing higher and higher into the sky, until it was no more than a tiny speck in the great blue above him.
        - id: ch01-b96
          speaker: dickon
          text: >-
            I'd nearly lost sight of him, but I could still hear his song. I was wondering how a fellow could hear it when that bird looked ready to fly clean out of th' world. Then I heard another sound far off in th' gorse. It was a weak little bleat. I knew it came from a hungry newborn lamb, and it wouldn't be hungry unless something had happened to its mother. So I went searching.
        - id: ch01-b97
          speaker: dickon
          text: >-
            Eh, I had a time finding it. I went in and out among th' bushes and round and round, always taking th' wrong turn. At last I spotted a bit of white beside a rock at th' top of th' moor. I climbed up and found this little 'un, half dead from cold and hunger.
        - id: ch01-b98
          speaker: narrator
          text: >-
            As Dickon talked, Soot flew solemnly out through the open window and back into the room again. Each time, the crow cawed as if making serious remarks about the scenery. Nut and Shell took their own trips into the great trees outside. The squirrels ran up and down the trunks and explored the branches before returning. Captain curled into a comfortable ball near Dickon. Dickon himself preferred the floor and sat on the hearth rug among his creatures.
        - id: ch01-b99
          speaker: narrator
          text: >-
            They opened the gardening books. Dickon knew every flower by its country name and could tell which ones already grew in the secret garden. He pointed to a picture labeled Aquilegia.
        - id: ch01-b100
          speaker: dickon
          text: >-
            I couldn't say that grand name. We call this one columbine, and that other one's a snapdragon. Both grow wild in th' hedges, but these garden kinds are bigger and finer. There are great clumps of columbine in our garden. When they bloom, they'll look like a bed of blue and white butterflies fluttering.
        - id: ch01-b101
          speaker: colin
          text: >-
            I'm going to see them. I am going to see them!
          emotion: happy
        - id: ch01-b102
          speaker: mary
          text: >-
            Aye, tha' must. And tha' mustn't waste any time.
