audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    martha:
      display_name: 玛莎
      tts: {delivery: 爽直热情，带亲切的约克郡乡音, timbre: 明亮朴实, pace: 轻快, pitch: 中高音}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
  chapters:
    - id: ch01
      title: 风雨中的哭声
      blocks:
        - {id: ch01-b01, speaker: narrator, text: 玛丽去吃晚饭时，把迪肯留下的画带回宅子，拿给玛莎看。}
        - {id: ch01-b02, speaker: martha, text: “嗳，真没想到咱们迪肯还这么会画！瞧，这是一只守着鸟巢的槲鸫，大小跟真的一样，模样比真的还活呢。”}
        - {id: ch01-b03, speaker: narrator, text: 玛丽这才懂了。迪肯是在用画捎信，让她放心，他会守住秘密。花园是她的巢，她就是那只守着巢的槲鸫。这个古怪的乡下男孩，她真是喜欢极了。她盼着他第二天一早就回来，怀着对清晨的期待睡着了。}
        - {id: ch01-b04, speaker: narrator, text: 可约克郡的春天说变就变。半夜，大雨猛敲窗户，把玛丽惊醒。雨水倾盆而下，风绕着古宅的墙角和烟囱呜呜怒号。她坐起身，又恼火又难受。}
        - {id: ch01-b05, speaker: mary_lennox, text: “这场雨简直跟以前的我一样任性。它明知道我不想让它下，偏要跑来。”}
        - {id: ch01-b06, speaker: narrator, text: 她一头倒回枕上，把脸埋了起来。她没有哭，只是躺在那里，恨透了沉沉砸落的雨声，也恨透了风在屋外呜呜号叫。她再也睡不着。那声音如此凄凉，她自己心里也凄凉，便越听越清醒。要是她当时心情快活，也许这阵风雨早把她哄睡了。可眼下，风不停地绕着屋角怒号，大颗大颗的雨珠倾泻下来，只管劈啪敲打窗玻璃。}
        - {id: ch01-b07, speaker: mary_lennox, text: “听着就像有人迷失在荒原上，一直走，一直哭。”}
        - {id: ch01-b08, speaker: narrator, text: 她翻来覆去躺了约莫一个钟头，忽然坐起来，转头细听。}
        - {id: ch01-b09, speaker: mary_lennox, text: “现在这个不是风声。真的不一样，是我以前听见过的哭声。”}
        - {id: ch01-b10, speaker: narrator, text: 房门虚掩着，远处烦躁的哭声顺着走廊传来，细细的，也很微弱。玛丽一连听了几分钟，每过一分钟，心里就更加肯定。她觉得自己非要查个明白不可。这件事甚至比秘密花园和埋藏的钥匙还要古怪。也许她正憋着一股反抗的劲儿，胆子反倒大了。她把一只脚伸下床，踩到地板上站了起来。}
        - {id: ch01-b11, speaker: mary_lennox, text: “我要去看看到底是什么。所有人都睡了，我才不怕梅德洛克太太！”}
        - {id: ch01-b12, speaker: narrator, text: 她拿起床边的蜡烛，悄悄出了门。长长的走廊一片漆黑，她却兴奋得顾不上怕。迷路那天，梅德洛克太太曾从一扇蒙着挂毯的门里出来。玛丽仿佛还记得，要找到那扇门所在的短走廊，该转哪几个弯。哭声正是从那条通道传来的。她借着暗淡的烛光继续向前，几乎一路摸索着走，心跳得那么响，仿佛自己都听得见。远处微弱的哭声时断时续，一路引着她。有时停上一会儿，接着又响起来。这个弯对吗？她停下来想了想。对，就是这里。沿过道向前，再向左转，登两级宽台阶，然后向右。挂毯门果然在那里。}
        - {id: ch01-b13, speaker: narrator, text: 她轻轻推开挂毯门，又在身后把它合上。哭声隔着左边的墙传来，已经很清楚，虽然并不响。前面几码处还有一扇门，门缝底下透出一点微光。那间屋里哭着的，分明是个年纪很小的人。玛丽朝那扇门走去，伸手一推，就这样站进了房间。}
        - {id: ch01-b14, speaker: narrator, text: 屋子很大，摆着古老精美的家具。壁炉里的火压得很低，只透出微弱的红光。雕花四柱床挂着锦缎帷帐，床边点着一盏夜灯。床上躺着一个男孩，正烦躁地哭。玛丽一时分不清这里是不是真实的地方，还是自己已经睡着，正在一个自己毫不知情的梦里。}
        - {id: ch01-b15, speaker: narrator, text: 男孩的脸轮廓尖削，清秀又纤弱，肤色白得像象牙，眼睛却大得不相称。他的头发很多，厚厚的一绺绺垂在额前，衬得那张瘦脸越发小。他看上去像是病了很久，可他的哭声更像因为疲倦和恼怒，倒不像是疼痛难忍。}
        - {id: ch01-b16, speaker: narrator, text: 玛丽举着蜡烛，屏住呼吸站在门边。接着，她蹑手蹑脚地穿过房间，一点点靠近床铺。渐渐移近的烛光终于惊动了男孩。他从枕上转过脸，直直盯着她，那双灰眼睛越睁越大，大得简直惊人。}
        - {id: ch01-b17, speaker: colin_craven, text: “你是谁？你是鬼吗？” , emotion: fearful}
        - {id: ch01-b18, speaker: mary_lennox, text: “我不是。难道你是鬼吗？”}
        - {id: ch01-b19, speaker: narrator, text: 男孩一个劲儿盯着她。那双眼睛是玛瑙灰色，围着一圈黑睫毛，在小脸上显得格外巨大。}
        - {id: ch01-b20, speaker: colin_craven, text: “我不是鬼。我是科林。”}
        - {id: ch01-b21, speaker: mary_lennox, text: “科林是谁？”}
        - {id: ch01-b22, speaker: colin_craven, text: “科林·克雷文。你又是谁？”}
        - {id: ch01-b23, speaker: mary_lennox, text: “玛丽·伦诺克斯。克雷文先生是我舅舅。”}
        - {id: ch01-b24, speaker: colin_craven, text: “他是我父亲。”}
        - {id: ch01-b25, speaker: mary_lennox, text: “你父亲？从来没人告诉我他还有个儿子！他们为什么不说？” , emotion: surprised}
    - id: ch02
      title: 我是科林
      blocks:
        - {id: ch02-b01, speaker: colin_craven, text: “你走近一点。”}
        - {id: ch02-b02, speaker: narrator, text: 科林焦虑地盯着她。玛丽来到床边，他伸手碰了碰她。}
        - {id: ch02-b03, speaker: colin_craven, text: “你是真人吧？我常做一些特别真实的梦。你也可能只是梦里的人。”}
        - {id: ch02-b04, speaker: narrator, text: 玛丽出门前披了羊毛晨衣，便把一角衣料递到他手里。}
        - {id: ch02-b05, speaker: mary_lennox, text: “你摸摸，又厚又暖。要是还不信，我可以轻轻掐你一下。刚才我也以为你可能是个梦。”}
        - {id: ch02-b06, speaker: colin_craven, text: “你从哪儿来的？”}
        - {id: ch02-b07, speaker: mary_lennox, text: “从我房间来的。风吵得我睡不着，我又听见有人哭，就出来找了。你为什么哭？”}
        - {id: ch02-b08, speaker: colin_craven, text: “我也睡不着，头还疼。你再说一遍自己的名字。”}
        - {id: ch02-b09, speaker: mary_lennox, text: “玛丽·伦诺克斯。没人告诉你，我已经搬来这里了吗？”}
        - {id: ch02-b10, speaker: narrator, text: 科林还用手指不停揉捏她晨衣的褶边，不过脸上的神情已经变了。他开始有些相信，眼前这个女孩确实是真实的，不是梦里的人。}
        - {id: ch02-b11, speaker: colin_craven, text: “没有。他们不敢告诉我。”}
        - {id: ch02-b12, speaker: mary_lennox, text: “为什么？”}
        - {id: ch02-b13, speaker: colin_craven, text: “他们怕我知道以后，你会看见我。我不准人来看我，也不准他们议论我。”}
        - {id: ch02-b14, speaker: mary_lennox, text: “这又是为什么？”}
        - {id: ch02-b15, speaker: colin_craven, text: “因为我总是这个样子，一直生病，只能躺着。我父亲也不许别人议论我，仆人谁都不能提起我。就算我能活下来，也可能会变成驼背。不过我根本活不成。父亲只要想到我将来也许会变得跟他一样，就受不了。”}
        - {id: ch02-b16, speaker: mary_lennox, text: “这座宅子太古怪了！房间锁着，花园锁着，你也是秘密。你也被锁在这里吗？”}
        - {id: ch02-b17, speaker: colin_craven, text: “没有。是我不肯让人搬我出去，那样太累。”}
        - {id: ch02-b18, speaker: mary_lennox, text: “你父亲来看你吗？”}
        - {id: ch02-b19, speaker: colin_craven, text: “偶尔来，通常趁我睡着的时候。他不愿意看见我。”}
        - {id: ch02-b20, speaker: mary_lennox, text: “为什么呢？”}
        - {id: ch02-b21, speaker: narrator, text: 科林脸上掠过一层怒意。}
        - {id: ch02-b22, speaker: colin_craven, text: “我出生时，母亲死了。父亲一看见我就很痛苦。他以为我不知道，可我听见过别人说话。他差不多恨我。” , emotion: angry}
        - {id: ch02-b23, speaker: mary_lennox, text: “她死了，所以他也恨那座花园。”}
        - {id: ch02-b24, speaker: colin_craven, text: “什么花园？”}
        - {id: ch02-b25, speaker: mary_lennox, text: “只是她以前喜欢的一座花园。你一直住在这里吗？”}
        - {id: ch02-b26, speaker: colin_craven, text: “差不多一直住在这里。有时他们把我带到海边，可那里的人总盯着我看，所以我不肯留下。以前他们还给我穿一个铁家伙，用它把我的后背撑直。后来伦敦来了一位很了不起的医生。他看过以后说，那种做法简直愚蠢，叫他们把铁家伙脱掉，还要让我多去呼吸新鲜空气。可我讨厌新鲜空气，也根本不想出门。”}
        - {id: ch02-b27, speaker: mary_lennox, text: “我刚来时也不爱出门。你怎么一直盯着我？”}
        - {id: ch02-b28, speaker: colin_craven, text: “因为我的梦总是太真。有时睁开眼，我都不相信自己醒了。”}
        - {id: ch02-b29, speaker: mary_lennox, text: “我们两个都醒着。你看这间屋子，天花板那么高，角落里都是影子，炉火也暗暗的，确实很像一个梦。现在又是半夜，宅子里的每个人都睡着了，除了我们两个。我们可是清醒得很。”}
        - {id: ch02-b30, speaker: colin_craven, text: “我不希望你是一场梦。”}
        - {id: ch02-b31, speaker: mary_lennox, text: “既然你不喜欢别人看见你，那要我离开吗？”}
        - {id: ch02-b32, speaker: narrator, text: 科林拉了拉她的衣角。}
        - {id: ch02-b33, speaker: colin_craven, text: “别走。你一走，我准会以为你是梦。坐到大脚凳上，跟我说说你的事。”}
        - {id: ch02-b34, speaker: narrator, text: 玛丽把蜡烛放到床边的桌上，在铺着软垫的大脚凳上坐好。她一点也不想走。她正想留在这间神秘又隐蔽的屋子里，跟这个同样神秘的男孩说话。}
        - {id: ch02-b35, speaker: mary_lennox, text: “你想听什么？”}
        - {id: ch02-b36, speaker: narrator, text: 科林的问题一个接着一个。他问玛丽来到米塞尔斯韦特多久了，房间在哪条走廊，每天都做些什么，是不是也像他一样讨厌荒原，还问她来约克郡以前住在哪里。玛丽把这些全告诉了他，又回答了许多别的问题。科林让她好好讲讲印度，还要听她怎样坐船横渡大海。玛丽也知道了，科林因为一直生病，没能像别的孩子那样学习。小时候有位保姆教会他读书，从那以后，他总在读书，也总爱看那些华美书本里的图画。}
        - {id: ch02-b37, speaker: narrator, text: 虽然父亲很少在他醒着时来看他，各种奇妙的东西却都会送来给他解闷。可是这些东西似乎从没真正让科林快乐过。他开口要什么就能得到，也从来没有人强迫他去做任何不喜欢的事。}
        - {id: ch02-b38, speaker: colin_craven, text: “所有人都必须顺着我。我一生气就会病。谁也不信我能活到长大。”}
        - {id: ch02-b39, speaker: narrator, text: 他说得满不在乎，像是早就听惯了，活不活得到长大已经不值得在意。他似乎很喜欢玛丽的声音。玛丽继续讲时，他躺在枕上，既有困意，又听得兴致勃勃。有一两次，她还疑心他是不是慢慢睡着了。可到最后，他忽然问了一个问题，话题也跟着转向了别处。}
        - {id: ch02-b40, speaker: colin_craven, text: “你今年几岁？”}
        - {id: ch02-b41, speaker: mary_lennox, text: “十岁。你也是十岁。”}
        - {id: ch02-b42, speaker: colin_craven, text: “你怎么会知道？” , emotion: surprised}
        - {id: ch02-b43, speaker: mary_lennox, text: “因为你出生时，花园的门就锁了，钥匙也埋了。它正好锁了十年。”}
    - id: ch03
      title: 另一种秘密
      blocks:
        - {id: ch03-b01, speaker: narrator, text: 科林撑着双肘，猛地半坐起来。}
        - {id: ch03-b02, speaker: colin_craven, text: “锁的是哪座花园？谁锁的门？钥匙又埋在哪儿？” , emotion: surprised}
        - {id: ch03-b03, speaker: mary_lennox, text: “是克雷文先生憎恨的那座花园。门是他锁的，没人知道钥匙埋在哪里。”}
        - {id: ch03-b04, speaker: colin_craven, text: “那花园是什么样的？”}
        - {id: ch03-b05, speaker: mary_lennox, text: “已经有十年不许任何人进去了。”}
        - {id: ch03-b06, speaker: narrator, text: 玛丽现在才谨慎，已经太迟。科林跟她实在太像，也一直没有什么值得惦记的事。隐藏的花园一下子迷住了他，就像当初迷住玛丽一样。他一个问题接着一个问题，非要知道花园在哪里。玛丽难道从没找过那扇门吗？她也从没问过园丁吗？}
        - {id: ch03-b07, speaker: mary_lennox, text: “他们不肯谈。一定有人命令他们不准回答。”}
        - {id: ch03-b08, speaker: colin_craven, text: “我能逼他们开口。”}
        - {id: ch03-b09, speaker: mary_lennox, text: “你真能做到吗？”}
        - {id: ch03-b10, speaker: narrator, text: 玛丽开始害怕。要是科林真能逼大家回答，谁知道会闹成什么样。}
        - {id: ch03-b11, speaker: colin_craven, text: “我已经告诉过你，所有人都必须做让我满意的事。要是我能活下来，这座庄园将来早晚会归我。他们心里全都明白这一点。所以只要我下命令，就一定能让他们把花园的事说出来。”}
        - {id: ch03-b12, speaker: narrator, text: 玛丽从来不知道自己也曾被人惯坏过，却一眼就看出，这个神秘的男孩确实被惯坏了。他觉得整个世界都该属于自己。更古怪的是，他说起自己活不成这件事，语气竟然那么冷淡。玛丽接着问他，一半是因为好奇，一半是想让他忘掉花园。}
        - {id: ch03-b13, speaker: mary_lennox, text: “你真觉得自己活不下来？”}
        - {id: ch03-b14, speaker: colin_craven, text: “我想大概活不成。从我记事起，就不断听见别人说我长不大。起先他们以为我年纪太小，根本听不懂。现在他们又以为我什么都听不见。其实我全都听见了。给我看病的医生是父亲的堂兄，他很穷。我要是死了，等父亲也死去以后，整个米塞尔斯韦特庄园就会归他。我想，他肯定不会盼着我活下去。”}
        - {id: ch03-b15, speaker: mary_lennox, text: “那你自己想活吗？”}
        - {id: ch03-b16, speaker: colin_craven, text: “不想。可我也不想死。每次身体不舒服，我就躺着想这件事，然后一直哭。” , emotion: sad}
        - {id: ch03-b17, speaker: mary_lennox, text: “我听见过你哭三次，却不知道是谁。你都是为了这件事哭吗？”}
        - {id: ch03-b18, speaker: colin_craven, text: “可能吧。我们换个话题。说那座花园。你不想亲眼看看吗？”}
        - {id: ch03-b19, speaker: mary_lennox, text: “想。”}
        - {id: ch03-b20, speaker: colin_craven, text: “我当然想。从前我好像从没真正想看过任何东西，现在却特别想看那座花园。我要他们把埋掉的钥匙挖出来，把门打开，再用轮椅推我过去。那样也算让我到外面呼吸新鲜空气了。我要命令他们打开那扇门。”}
        - {id: ch03-b21, speaker: narrator, text: 科林越说越兴奋。他那双原本就很奇异的眼睛开始像星星一样闪亮，在苍白瘦小的脸上也显得比刚才更加巨大。}
        - {id: ch03-b22, speaker: colin_craven, text: “他们必须听我的。我要他们带我进去，也可以准你跟着。”}
        - {id: ch03-b23, speaker: narrator, text: 玛丽的两只手紧紧绞在一起。一切都会毁掉，所有的一切！迪肯不会再回来了。她也再不能觉得自己像一只槲鸫，安心守着那个藏得严严实实的巢。}
        - {id: ch03-b24, speaker: mary_lennox, text: “别这样！求你千万别这么做！” , emotion: fearful}
        - {id: ch03-b25, speaker: colin_craven, text: “为什么？你明明说过想看！” , emotion: surprised}
        - {id: ch03-b26, speaker: mary_lennox, text: “我是想看。可你要是命令人开门，再让他们推你进去，那地方就不再是秘密了。”}
        - {id: ch03-b27, speaker: colin_craven, text: “秘密？你到底是什么意思？快告诉我。”}
        - {id: ch03-b28, speaker: narrator, text: 玛丽急得话都挤到了一起。}
        - {id: ch03-b29, speaker: mary_lennox, text: “你想呀，要是除了我们，谁也不知道。要是有一扇门藏在常春藤底下，而我们找到了它。我们可以一起悄悄钻进去，再把门关在身后，谁也不知道里面有人。我们可以叫它我们的花园，假装自己就是槲鸫，花园就是我们的巢。我们几乎每天都去那里玩，翻土，播种，让所有东西都重新活起来。”}
        - {id: ch03-b30, speaker: colin_craven, text: “花园死了吗？”}
        - {id: ch03-b31, speaker: mary_lennox, text: “再没人照料，很快就会死。球根会活，可玫瑰就……”}
        - {id: ch03-b32, speaker: colin_craven, text: “球根是什么？”}
        - {id: ch03-b33, speaker: mary_lennox, text: “水仙、百合、雪花莲都是从球根长出来的。春天要到了，它们正在土里忙着往上顶，已经冒出淡绿色的小尖儿。”}
        - {id: ch03-b34, speaker: colin_craven, text: “春天就要来了？它到底是什么样？生病的人待在屋里，根本看不到。”}
        - {id: ch03-b35, speaker: mary_lennox, text: “春天就是阳光照进雨里，雨又落进阳光里。泥土底下的东西全都在往上钻，都在忙着生长。要是花园还是秘密，而我们又能进去，就能天天去看那些东西长大一点，还能数一数到底有多少玫瑰活着。你还不明白吗？让它一直做秘密花园，不是好得多吗？”}
        - {id: ch03-b36, speaker: narrator, text: 科林倒回枕上，脸上的神情很奇怪。}
        - {id: ch03-b37, speaker: colin_craven, text: “我从来没有过自己的秘密。只有我活不到长大那件事，算得上一个秘密。他们不知道我已经听说了，所以这勉强也算吧。不过，我更喜欢花园这样的秘密。”}
        - {id: ch03-b38, speaker: mary_lennox, text: “那就别命令人带你去。也许我很快就能找到进去的办法，我几乎敢肯定。要是医生想让你坐轮椅出门，而你又总能照自己的意思做，也许我们能找一个男孩替你推车。我们悄悄地自己去，那里就永远都是秘密花园。”}
        - {id: ch03-b39, speaker: colin_craven, text: “我会……喜欢……那样。我真的会喜欢。”他的眼神变得像在做梦，“要是让我待在秘密花园里，我就不会介意那些新鲜空气了。”}
    - id: ch04
      title: 帘后的画像
      blocks:
        - {id: ch04-b01, speaker: narrator, text: 玛丽终于喘匀了气，也安心了一些。保守花园的秘密似乎很合科林的心意。她几乎可以肯定，只要自己继续说下去，让科林像她从前那样在心里看见花园，他一定会爱上它，爱到再也无法忍受所有人想什么时候就闯进去。}
        - {id: ch04-b02, speaker: mary_lennox, text: “我来告诉你，要是我们真的能进去，我猜里面会是什么样。花园已经关闭了那么久，没人修剪，也没人照料，里面的所有东西也许早就乱蓬蓬地长在了一起。”}
        - {id: ch04-b03, speaker: narrator, text: 科林安安静静地躺着听。玛丽说，那些玫瑰也许已经从一棵树攀到另一棵树，又从枝头垂下来。那里那么安全，也许许多鸟儿都在里面筑了巢。她接着讲起知更鸟和本·韦瑟斯塔夫。关于那只知更鸟，她有说不完的事，而且谈起它既容易又安全，她便渐渐不再害怕。科林听得笑起来，脸上几乎有了美丽的光彩。玛丽刚进门时，还觉得他那双大眼睛和浓密的头发把瘦脸衬得比自己更难看。}
        - {id: ch04-b04, speaker: colin_craven, text: “我从不知道鸟儿还能那么有趣。人一直关在屋里，确实什么都看不到。你懂得真多，简直像已经进过花园一样。”}
        - {id: ch04-b05, speaker: narrator, text: 玛丽不知道该怎样回答，索性一声不响。科林显然也没有等她开口。紧接着，他忽然说了句话，让玛丽吃了一惊。他要给她看一样东西。}
        - {id: ch04-b06, speaker: colin_craven, text: “看见壁炉台上方那幅玫瑰色的丝帘了吗？”}
        - {id: ch04-b07, speaker: narrator, text: 玛丽先前根本没有注意。她照科林说的抬头一看，果然看见墙上垂着一幅柔软的丝帘，帘子的后面像是藏着一幅画。}
        - {id: ch04-b08, speaker: mary_lennox, text: “看见了。”}
        - {id: ch04-b09, speaker: colin_craven, text: “旁边垂着一根绳。你去拉一下。”}
        - {id: ch04-b10, speaker: narrator, text: 玛丽满心疑惑地站起来，找到了绳子。她一拉，丝帘便沿着挂环滑到一旁，露出后面的画像。画中是个满面笑容的姑娘，亮丽的头发用一根蓝丝带束着。她那双快乐又美丽的眼睛，竟和科林忧郁的眼睛一模一样，也是玛瑙般的灰色，周围也长着浓黑的睫毛，所以看上去足足比原本大了一倍。}
        - {id: ch04-b11, speaker: colin_craven, text: “她是我母亲。我不懂她为什么要死。有时，我甚至恨她就这样死了。” , emotion: angry}
        - {id: ch04-b12, speaker: mary_lennox, text: “真古怪！”}
        - {id: ch04-b13, speaker: colin_craven, text: “她要是还活着，我想自己就不会一直生病。我大概也能活下去，父亲也不会连看都不愿意看我。说不定我的后背也会长得很结实。现在把帘子重新拉回去吧。”}
        - {id: ch04-b14, speaker: narrator, text: 玛丽听从科林的吩咐，把玫瑰色的丝帘重新拉好，遮住画像，然后走回床边，在铺着软垫的大脚凳上重新坐了下来。}
        - {id: ch04-b15, speaker: mary_lennox, text: “她比你好看多了。不过你们的眼睛确实一样，形状和颜色都一样。为什么把画像遮起来？”}
        - {id: ch04-b16, speaker: narrator, text: 听见玛丽这样问，科林显得很不自在，在床上轻轻动了动身体。}
        - {id: ch04-b17, speaker: colin_craven, text: “是我叫他们把她遮起来的。有时候，我不喜欢看她那样望着我。我正生病，又难受得要命，她却在画像里笑得那么开心。再说，她是我的母亲，我不想让宅子里的每个人都看见她。”}
        - {id: ch04-b18, speaker: narrator, text: 房间里静了下来，两个人有好一会儿都没有说话。过了片刻，玛丽才打破沉默，问起梅德洛克太太如果发现她来过这里，会有什么反应。}
        - {id: ch04-b19, speaker: mary_lennox, text: “要是梅德洛克太太发现我来过，她会怎么办？”}
        - {id: ch04-b20, speaker: colin_craven, text: “她只能照我的吩咐做。我会清清楚楚地告诉她，我希望你每天都到这里来，陪我说说话。我真的很高兴你今晚来了。”}
        - {id: ch04-b21, speaker: mary_lennox, text: “我也很高兴。我会尽量常来，可我每天还要去找花园的门。”}
        - {id: ch04-b22, speaker: colin_craven, text: “对，一定要找。找完再来讲给我听。”}
        - {id: ch04-b23, speaker: narrator, text: 科林想了一会儿，又有了主意。}
        - {id: ch04-b24, speaker: colin_craven, text: “我想，你也可以成为一个秘密。在他们自己发现以前，我不会把你的事告诉任何人。我随时都能把护士打发出房间，只要说自己想单独待一会儿就行。对了，你认识玛莎吗？”}
        - {id: ch04-b25, speaker: mary_lennox, text: “认识。她照料我，我跟她很熟。”}
        - {id: ch04-b26, speaker: colin_craven, text: “现在睡在外面那间屋里的就是玛莎。护士昨天走了，去她姐姐家过夜。她每次自己想出去，都让玛莎过来照看我。以后我就叫玛莎告诉你，什么时候可以到我这里来。”}
        - {id: ch04-b27, speaker: narrator, text: 这下，玛丽终于明白了。难怪从前她追问宅子里的哭声时，玛莎总会露出那种为难又不安的神色。原来玛莎始终知道科林的存在。}
        - {id: ch04-b28, speaker: mary_lennox, text: “原来玛莎一直都知道你？”}
        - {id: ch04-b29, speaker: colin_craven, text: “对，她常来照看我。护士总想躲开我，她一走，就让玛莎来。”}
        - {id: ch04-b30, speaker: mary_lennox, text: “我待了很久了。现在该走吗？你的眼睛已经困了。”}
        - {id: ch04-b31, speaker: colin_craven, text: “我希望在你离开房间以前，自己能先睡着。”}
        - {id: ch04-b32, speaker: mary_lennox, text: “闭上眼睛吧。我来做从前阿雅在印度为我做的事。我会轻轻拍你的手，摸着它，再低声唱一支歌。”}
        - {id: ch04-b33, speaker: colin_craven, text: “那也许挺好。”}
        - {id: ch04-b34, speaker: narrator, text: 不知怎么，玛丽有些可怜他，不愿让他继续醒着躺下去。于是她把身体靠在床边，一面轻轻拍着、抚摸着他的手，一面用印度斯坦语低低哼起一支宛如吟诵的小歌。那正是从前阿雅哄她睡觉时做过的事。}
        - {id: ch04-b35, speaker: colin_craven, text: “这样很好。” , emotion: calm}
        - {id: ch04-b36, speaker: narrator, text: 玛丽接着低声唱，也接着轻拍、抚摸他的手。等她再低头看科林时，他的黑睫毛已经紧贴在双颊上。他闭着眼睛，沉沉睡着了。玛丽轻轻站起身，拿起自己的蜡烛，没有发出一点声音，蹑手蹑脚地离开了房间。}
