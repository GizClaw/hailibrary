audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    martha:
      display_name: Martha Sowerby
      tts:
        delivery: cheerful, candid, and easy in Yorkshire character
        timbre: bright and wholesome
        pace: lively
        pitch: medium-high
    colin:
      display_name: Colin Craven
      tts:
        delivery: commanding, fretful, and intensely curious
        timbre: delicate and clear
        pace: measured
        pitch: high
  chapters:
    - id: ch01
      title: 'CHAPTER XIII. "I AM COLIN"'
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Mary brought Dickon's picture back to the house at suppertime and showed it to Martha.
        - id: ch01-b02
          speaker: martha
          text: >-
            Well! I never knew our Dickon could draw like that. It's a missel thrush on her nest, big as life and twice as natural.
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: >-
            Then Mary understood what Dickon meant. The picture was his message, telling her she could trust him to keep the secret. Her garden was her nest, and she was like the missel thrush guarding it. How she liked that strange, ordinary boy! She hoped he would return the very next day, and she fell asleep looking forward to morning.
        - id: ch01-b04
          speaker: narrator
          text: >-
            But spring weather in Yorkshire could change without warning. During the night, heavy rain hammered Mary's window. Water poured down, and the wind went wuthering around the corners and through the chimneys of the enormous house. Mary sat up, miserable and angry.
        - id: ch01-b05
          speaker: mary
          text: >-
            That rain is every bit as contrary as I used to be. It came because it knew I didn't want it.
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: >-
            She threw herself back onto the pillow and buried her face. She did not cry. She simply lay there hating the rain as it beat heavily against the window. She hated the wind and its wuthering too. Sleep would not come again. The mournful noise kept her awake because she felt mournful herself. If she had been happy, that same sound might have soothed her to sleep. Instead, the great drops poured down and struck the glass while the wind moaned on and on.
        - id: ch01-b07
          speaker: mary
          text: >-
            It sounds like someone lost on the moor, wandering on and on and crying.
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: >-
            For nearly an hour, Mary lay awake and turned from side to side. Then something made her sit straight up and listen toward the door. She listened again and again.
        - id: ch01-b09
          speaker: mary
          text: >-
            That's not the wind. It's different. It's the crying I heard before.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Her bedroom door stood partly open. From far down the corridor came a faint, fretful cry. Mary listened for several minutes, and with every minute she grew more certain of what she heard. She felt that she had to discover where it came from. This mystery seemed even stranger than the secret garden and its buried key. Perhaps being in such a rebellious mood made her brave. She put one foot out of bed, then the other, and stood on the floor.
        - id: ch01-b11
          speaker: mary
          text: >-
            I'm going to find it. Everyone is in bed, and I don't care about Mrs. Medlock. I don't!
        - id: ch01-b12
          speaker: narrator
          text: >-
            Mary took the candle beside her bed and slipped quietly into the corridor. It looked long and black, but she was too excited to be afraid. She tried to remember the turns that led to the short passage and its tapestry-covered door, the one Mrs. Medlock had used when Mary first got lost. The crying came from that direction.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Holding the dim light before her, Mary moved on as though she had to feel her way. Her heart beat so loudly she imagined she could hear it. The distant crying guided her. Sometimes it stopped for a moment, but then it always began again. At one corner she hesitated and tried to remember. Was this the right turn? Yes. Down this passage, then left, up two broad steps, and right once more. There stood the door hidden by tapestry, just as she remembered it.
        - id: ch01-b14
          speaker: narrator
          text: >-
            She eased it open, closed it behind her, and entered the hidden corridor. Now she could hear the crying clearly. It came from beyond the wall on her left. A few yards ahead, light glimmered beneath a door. Whoever was crying inside sounded young.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Mary walked over, pushed open the door, and suddenly found herself standing inside the room. It was large and filled with handsome old furniture. A low fire gave off a faint glow on the hearth. A small night-light burned beside a carved four-poster bed draped in brocade. On that bed lay a boy, crying in a tired, cross little way.
        - id: ch01-b16
          speaker: narrator
          text: >-
            For a moment, Mary wondered whether this was a real room or whether she had fallen asleep again without knowing it. The boy's delicate face was sharp and ivory pale, and his eyes seemed much too large for it. He had a great deal of hair, and its heavy locks tumbled over his forehead, making his thin face look smaller still. He looked like a boy who had been ill for a long time. Yet he seemed to be crying from weariness and bad temper, not from pain.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Mary stood by the door, holding her candle and scarcely breathing. Then she crept closer. The moving light caught the boy's eye. He turned on his pillow and stared at her, his gray eyes growing enormous.
        - id: ch01-b18
          speaker: colin
          text: Who are you? Are you a ghost?
          emotion: fearful
        - id: ch01-b19
          speaker: mary
          text: No, I'm not. Are you?
          emotion: fearful
        - id: ch01-b20
          speaker: narrator
          text: >-
            He stared and stared without answering. Mary could not help noticing how unusual his eyes were. They were agate gray and surrounded by black lashes. Those dark lashes made them seem far too large for his narrow face.
        - id: ch01-b21
          speaker: colin
          text: No. I'm Colin.
        - id: ch01-b22
          speaker: mary
          text: Who's Colin?
        - id: ch01-b23
          speaker: colin
          text: I'm Colin Craven. Who are you?
        - id: ch01-b24
          speaker: mary
          text: I'm Mary Lennox. Mr. Craven is my uncle.
        - id: ch01-b25
          speaker: colin
          text: He's my father.
        - id: ch01-b26
          speaker: mary
          text: Your father! Nobody ever told me he had a son. Why didn't they?
          emotion: surprised
        - id: ch01-b27
          speaker: colin
          text: Come closer.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Mary went to the bedside. Colin reached out and touched her, never taking his anxious eyes from her.
        - id: ch01-b29
          speaker: colin
          text: >-
            You are real, aren't you? I have dreams that feel real all the time. You might be one of them.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Mary had put on a wool wrapper before leaving her room. She pressed a fold of it between his fingers.
        - id: ch01-b31
          speaker: mary
          text: >-
            Feel how thick and warm that is. I can pinch you a little too, if you want proof. For a minute, I thought you might be a dream.
        - id: ch01-b32
          speaker: colin
          text: Where did you come from?
        - id: ch01-b33
          speaker: mary
          text: >-
            My room. The wind was wuthering so loudly I couldn't sleep. Then I heard someone crying and came to see who it was. Why were you crying?
        - id: ch01-b34
          speaker: colin
          text: >-
            I couldn't sleep either, and my head hurt. Tell me your name again.
        - id: ch01-b35
          speaker: mary
          text: Mary Lennox. Didn't anyone tell you I'd come to live here?
        - id: ch01-b36
          speaker: narrator
          text: >-
            Colin still rubbed the wool between his fingers, but he was beginning to believe she was real.
        - id: ch01-b37
          speaker: colin
          text: No. They wouldn't dare.
        - id: ch01-b38
          speaker: mary
          text: Why not?
        - id: ch01-b39
          speaker: colin
          text: >-
            They'd be afraid you might see me. I don't allow people to look at me and then talk about me.
        - id: ch01-b40
          speaker: mary
          text: But why?
        - id: ch01-b41
          speaker: colin
          text: >-
            Because I'm always like this. I'm ill, and I have to lie down. Father won't let anyone talk about me either, and the servants aren't allowed to mention me. If I live, I may grow into a hunchback. But I won't live. Father can't bear thinking that I might become like him.
        - id: ch01-b42
          speaker: mary
          text: >-
            What a strange house! Everything here is a secret. There are locked rooms, a locked garden, and now you. Are you locked in too?
          emotion: surprised
        - id: ch01-b43
          speaker: colin
          text: >-
            No. I stay here because I don't want to be moved. It makes me too tired.
        - id: ch01-b44
          speaker: mary
          text: Does your father ever visit you?
        - id: ch01-b45
          speaker: colin
          text: Sometimes, but usually when I'm asleep. He doesn't want to see me.
        - id: ch01-b46
          speaker: mary
          text: Why doesn't he?
        - id: ch01-b47
          speaker: narrator
          text: An angry shadow crossed Colin's face.
        - id: ch01-b48
          speaker: colin
          text: >-
            My mother died when I was born. Looking at me makes him miserable. He thinks I don't know, but I've heard people talking. He almost hates me.
          emotion: angry
        - id: ch01-b49
          speaker: mary
          text: He hates the garden because she died.
        - id: ch01-b50
          speaker: colin
          text: What garden?
        - id: ch01-b51
          speaker: mary
          text: >-
            Oh, only... only a garden she used to like. Have you lived here all your life?
        - id: ch01-b52
          speaker: colin
          text: >-
            Almost. Sometimes they've taken me to places by the sea, but I always refused to stay because people stared at me. I used to wear an iron brace that was supposed to keep my back straight. Then an important doctor came all the way from London to examine me. He said the brace was foolish and ordered them to take it off. He also said they should keep me out in the fresh air. But I hate fresh air, and I don't want to go outside.
        - id: ch01-b53
          speaker: mary
          text: I didn't want to go out when I first came. Why do you keep staring at me?
        - id: ch01-b54
          speaker: colin
          text: >-
            Because my dreams feel so real. Sometimes I open my eyes and still can't believe I'm awake.
        - id: ch01-b55
          speaker: mary
          text: >-
            We're both awake. Look around. This room does seem like a dream, with its high ceiling, shadowy corners, and dim firelight. And it is the middle of the night. Everyone else in this whole enormous house is asleep. Everyone except us. But you and I are wide awake.
        - id: ch01-b56
          speaker: colin
          text: I don't want this to be a dream.
        - id: ch01-b57
          speaker: narrator
          text: Mary suddenly had an idea.
        - id: ch01-b58
          speaker: mary
          text: If you don't like being seen, should I leave?
        - id: ch01-b59
          speaker: narrator
          text: Colin still held her wrapper. He gave it a small tug.
        - id: ch01-b60
          speaker: colin
          text: >-
            No. If you went away, I'd know you were a dream. If you're real, sit on that big footstool and talk to me. I want to hear about you.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Mary set her candle on the table and sat on the cushioned stool. She had no wish to leave. She wanted to stay in this hidden room and talk to its mysterious boy.
        - id: ch01-b62
          speaker: mary
          text: What do you want to know?
        - id: ch01-b63
          speaker: narrator
          text: >-
            Colin wanted to know everything. How long had she been at Misselthwaite? Which corridor held her room? What had she been doing all this time? Did she dislike the moor as much as he did? Where had she lived before coming to Yorkshire? Mary answered every question, along with many more. At his urging, she told him a great deal about India and about her long journey across the ocean.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Mary discovered that because Colin had always been an invalid, he had not learned things the way other children did. One of his nurses taught him to read when he was very young. Ever since then, he had spent much of his time reading and studying pictures in beautiful books. His father rarely came to see him while he was awake, but he gave Colin all kinds of wonderful things to keep him amused. Somehow, Colin had never been amused by any of them. He could have whatever he asked for, and no one ever made him do anything he disliked.
        - id: ch01-b65
          speaker: colin
          text: >-
            Everyone has to please me. Getting angry makes me ill. Nobody thinks I'll live long enough to grow up.
        - id: ch01-b66
          speaker: narrator
          text: >-
            He spoke as though he had heard that idea so often that it no longer mattered to him at all. He seemed to like the sound of Mary's voice. As she went on talking, he listened with a drowsy sort of interest. Once or twice, she wondered whether he was slowly falling asleep. But at last he asked a question, and it opened an entirely new subject.
        - id: ch01-b67
          speaker: colin
          text: How old are you?
        - id: ch01-b68
          speaker: mary
          text: I'm ten, and so are you.
        - id: ch01-b69
          speaker: colin
          text: How could you know that?
          emotion: surprised
        - id: ch01-b70
          speaker: mary
          text: >-
            Because the garden door was locked and its key was buried when you were born. The garden has been shut for ten years.
        - id: ch01-b71
          speaker: narrator
          text: Colin pushed himself halfway up and leaned toward her on his elbows.
        - id: ch01-b72
          speaker: colin
          text: >-
            Which garden was locked? Who locked it? Where did they bury the key?
          emotion: surprised
        - id: ch01-b73
          speaker: mary
          text: >-
            It was the garden Mr. Craven hates. He locked the door, and nobody knew where he put the key.
        - id: ch01-b74
          speaker: colin
          text: What kind of garden is it?
        - id: ch01-b75
          speaker: mary
          text: Nobody has been allowed inside for ten years.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Mary tried to answer carefully, but careful answers could not help her now. Colin was too much like her. He too had spent his life with nothing interesting to think about. The very idea of a hidden garden caught hold of him, just as it had caught hold of Mary. He asked one question after another. Where was it? Had she ever searched for the door? Had she asked any of the gardeners where it might be?
        - id: ch01-b77
          speaker: mary
          text: >-
            They refuse to discuss it. I think they've been ordered not to answer questions.
        - id: ch01-b78
          speaker: colin
          text: I would make them answer.
        - id: ch01-b79
          speaker: mary
          text: Could you really do that?
          emotion: fearful
        - id: ch01-b80
          speaker: narrator
          text: >-
            Mary was growing frightened. If Colin could force people to tell him things, anything might happen.
        - id: ch01-b81
          speaker: colin
          text: >-
            Everyone has to do what pleases me. I already told you that. If I live, this whole place will belong to me someday, and every one of them knows it. If I told the gardeners to answer my questions, I could make them tell me everything.
        - id: ch01-b82
          speaker: narrator
          text: >-
            Mary had never understood that she herself had been a spoiled child. But she could see plainly that this mysterious boy had been spoiled. Colin seemed to believe the whole world belonged to him and that everyone in it must obey. Stranger still, he spoke about not living as coolly as if it were an ordinary fact.
        - id: ch01-b83
          speaker: mary
          text: Do you really think you won't live?
        - id: ch01-b84
          speaker: colin
          text: >-
            I don't expect to. Ever since I was old enough to remember anything, I've heard people say I wouldn't live. At first they thought I was too little to understand what they meant. Now they think I can't hear them, but I can. My doctor is Father's cousin, and he's very poor. If I die, then after Father dies, the whole of Misselthwaite will go to him. I should think he wouldn't want me to live.
        - id: ch01-b85
          speaker: mary
          text: Do you want to live?
        - id: ch01-b86
          speaker: colin
          text: >-
            No. But I don't want to die either. When I feel sick, I lie here thinking about it until I cry and cry.
          emotion: sad
        - id: ch01-b87
          speaker: mary
          text: >-
            I've heard you crying three times, but I never knew who it was. Were you crying because you were thinking about dying?
        - id: ch01-b88
          speaker: narrator
          text: Mary badly wanted him to forget the garden.
        - id: ch01-b89
          speaker: colin
          text: >-
            Probably. Let's speak of something else. Tell me about that garden. Don't you want to see it?
        - id: ch01-b90
          speaker: mary
          text: Yes.
        - id: ch01-b91
          speaker: colin
          text: >-
            I want to see it too. I don't think I've ever truly wanted to see anything before, but now I want to see that garden. I want them to dig up the buried key and unlock the door. They could take me there in my chair, and that would count as getting fresh air. I'm going to order them to open it.
        - id: ch01-b92
          speaker: narrator
          text: >-
            Colin was thoroughly excited now. His strange eyes shone like stars and looked larger than ever.
        - id: ch01-b93
          speaker: colin
          text: >-
            They have to please me. I'll make them take me there, and you may come too.
        - id: ch01-b94
          speaker: narrator
          text: >-
            Mary clutched her hands together. Everything would be spoiled. Everything! Dickon would never come back to help her. She would never again feel like a missel thrush guarding her own safe, hidden nest.
        - id: ch01-b95
          speaker: mary
          text: Oh, don't! Please, please don't do that!
          emotion: fearful
        - id: ch01-b96
          speaker: narrator
          text: Colin stared as though she had lost her mind.
        - id: ch01-b97
          speaker: colin
          text: Why not? You said you wanted to see it.
          emotion: surprised
        - id: ch01-b98
          speaker: mary
          text: >-
            I do. But if you order them to open it and carry you inside, it won't be a secret anymore.
          emotion: sad
        - id: ch01-b99
          speaker: narrator
          text: Colin leaned even closer.
        - id: ch01-b100
          speaker: colin
          text: A secret? What do you mean? Tell me.
        - id: ch01-b101
          speaker: narrator
          text: Mary's words came tumbling out.
        - id: ch01-b102
          speaker: mary
          text: >-
            Suppose only we knew about it. Suppose there really was a door hidden somewhere under all the ivy, and we found it ourselves. We could slip through together, shut the door behind us, and never let anyone know we were inside. We could call it our own garden. We could pretend we were missel thrushes and the garden was our nest. We could play there almost every day. We could dig and plant seeds and make the whole place come alive again—
        - id: ch01-b103
          speaker: colin
          text: Is it dead?
        - id: ch01-b104
          speaker: mary
          text: >-
            It soon will be if nobody tends it. The bulbs will live, but the roses—
        - id: ch01-b105
          speaker: colin
          text: What are bulbs?
        - id: ch01-b106
          speaker: mary
          text: >-
            Daffodils and lilies and snowdrops. They're working underground right now, pushing up little pale green points because spring is coming.
        - id: ch01-b107
          speaker: colin
          text: >-
            Is spring really coming? What is it like? You can't see it from a room when you're ill.
        - id: ch01-b108
          speaker: mary
          text: >-
            It's the sun shining while rain falls, and rain falling while the sun still shines. It's all the things under the earth working and pushing their way up. If the garden stayed secret and we could get inside, we could watch those things grow larger every day. We could find out how many of the roses were still alive. Don't you see what it could be like? Oh, don't you see how much nicer it would be if we kept it secret?
        - id: ch01-b109
          speaker: narrator
          text: Colin sank back onto his pillow. A strange look came over his face.
        - id: ch01-b110
          speaker: colin
          text: >-
            I've never had a secret, except knowing I may not grow up. They don't know that I know, so I suppose it is one. But I like your kind of secret better.
        - id: ch01-b111
          speaker: mary
          text: >-
            If you don't order them to take you there, I feel almost certain I can discover a way inside. Then, when your doctor wants you out in your chair, perhaps we could find a boy to push you. We could go alone, and it would always be a secret garden.
        - id: ch01-b112
          speaker: colin
          text: >-
            I would like that. Yes, I would. I wouldn't mind fresh air in a secret garden.
        - id: ch01-b113
          speaker: narrator
          text: >-
            Mary began to recover her breath and feel safe again. Colin clearly liked the thought of keeping the garden secret. She felt almost certain that if she kept talking, she could make him see it in his mind exactly as she had seen it. Then he might love the idea so much that he could never bear to let everyone tramp through the garden whenever they pleased.
        - id: ch01-b114
          speaker: mary
          text: >-
            I'll tell you how I think it might look if we went in. It's been closed so long that everything may have grown into a tangle.
        - id: ch01-b115
          speaker: narrator
          text: >-
            Colin lay perfectly still and listened. Mary imagined roses that might have climbed from one tree to another, then hung down in long trails. She imagined all the birds that might have built their nests there because the place was so safe. After that, she told him about the robin and Ben Weatherstaff. There was so much to say about the robin, and it felt so easy and safe to tell it, that her fear disappeared. The robin pleased Colin so much that he smiled until he looked almost beautiful. When she first saw him, Mary had thought his huge eyes and heavy hair made him even plainer than she was.
        - id: ch01-b116
          speaker: colin
          text: >-
            I never knew birds could behave that way. You miss everything when you stay in one room. You know so many things. It almost sounds as if you've been inside that garden.
        - id: ch01-b117
          speaker: narrator
          text: >-
            Mary could think of no safe answer, so she said nothing. Colin did not seem to expect one. A moment later, he surprised her.
        - id: ch01-b118
          speaker: colin
          text: >-
            I'm going to show you something. Do you see the rose-colored silk curtain above the mantel?
        - id: ch01-b119
          speaker: narrator
          text: >-
            Mary looked up. She had not noticed the soft silk curtain covering what seemed to be a picture.
        - id: ch01-b120
          speaker: mary
          text: Yes.
        - id: ch01-b121
          speaker: colin
          text: There's a cord hanging from it. Pull it.
        - id: ch01-b122
          speaker: narrator
          text: >-
            Completely puzzled, Mary stood and found the cord. When she pulled it, the silk curtain slid back along its rings and uncovered a portrait. It showed a girl with a laughing face. Her bright hair was tied up with a blue ribbon, and her lovely, cheerful eyes were exactly like Colin's unhappy ones. They were agate gray, and the black lashes around them made them look twice their true size.
        - id: ch01-b123
          speaker: colin
          text: >-
            She's my mother. I don't understand why she had to die. Sometimes I hate her for it.
          emotion: angry
        - id: ch01-b124
          speaker: mary
          text: How strange!
          emotion: surprised
        - id: ch01-b125
          speaker: colin
          text: >-
            If she'd lived, I don't believe I would have been ill all the time. I suppose I would have been sure to live too. Father wouldn't have hated having to look at me, and I probably would have had a strong back. Pull the curtain over her again.
        - id: ch01-b126
          speaker: narrator
          text: Mary closed it and went back to her footstool.
        - id: ch01-b127
          speaker: mary
          text: >-
            She's much prettier than you, but your eyes are just like hers. They're the same shape and color. Why do you keep her portrait covered?
        - id: ch01-b128
          speaker: narrator
          text: Colin shifted uneasily.
        - id: ch01-b129
          speaker: colin
          text: >-
            I made them cover it. Sometimes I don't like seeing her look at me that way. She smiles far too much when I'm ill and miserable. Besides, she belongs to me. I don't want every person who comes into the room to be able to look at her.
        - id: ch01-b130
          speaker: narrator
          text: For a few moments, neither child spoke. Then Mary broke the silence.
        - id: ch01-b131
          speaker: mary
          text: What would Mrs. Medlock do if she found out I'd been here?
        - id: ch01-b132
          speaker: colin
          text: >-
            Whatever I told her. I'd tell her I wanted you to visit and talk to me every day. I'm glad you came.
        - id: ch01-b133
          speaker: mary
          text: >-
            I'm glad too. I'll come whenever I can, but... I still have to search for the garden door every day.
        - id: ch01-b134
          speaker: colin
          text: Yes. You must. Then you can tell me about it afterward.
        - id: ch01-b135
          speaker: narrator
          text: Colin thought quietly for a little while before speaking again.
        - id: ch01-b136
          speaker: colin
          text: >-
            I think you should be a secret too. I won't tell anyone until they discover you. I can always send my nurse away and say I want to be alone. Do you know Martha?
        - id: ch01-b137
          speaker: mary
          text: Yes, very well. She takes care of me.
        - id: ch01-b138
          speaker: narrator
          text: Colin nodded toward the outer passage.
        - id: ch01-b139
          speaker: colin
          text: >-
            She's the one sleeping in the next room. My nurse went away yesterday to spend the night with her sister. Whenever Nurse wants to go out, she makes Martha come and take care of me. Martha can tell you when it's safe for you to visit.
        - id: ch01-b140
          speaker: narrator
          text: >-
            Now Mary understood why Martha had looked troubled whenever Mary asked about the crying.
        - id: ch01-b141
          speaker: mary
          text: Martha knew about you all along?
        - id: ch01-b142
          speaker: colin
          text: >-
            Yes. She often waits on me. My nurse likes getting away, so Martha comes instead.
        - id: ch01-b143
          speaker: mary
          text: >-
            I've been here a long time. Should I leave now? Your eyes look sleepy.
        - id: ch01-b144
          speaker: colin
          text: I wish I could fall asleep before you go.
        - id: ch01-b145
          speaker: mary
          text: >-
            Close your eyes. I'll do what my Ayah used to do in India. I'll pat and stroke your hand and sing very softly.
          emotion: calm
        - id: ch01-b146
          speaker: colin
          text: I think I'd like that.
        - id: ch01-b147
          speaker: narrator
          text: >-
            Mary felt sorry for him. She did not want to leave him lying awake. She leaned against the bed, gently stroked and patted his hand, and began a low, chanting song in Hindustani.
        - id: ch01-b148
          speaker: colin
          text: That's nice.
        - id: ch01-b149
          speaker: narrator
          text: >-
            His voice was even sleepier now. Mary kept chanting in a low voice while she stroked and patted his hand. After a while, she looked at him again. His eyes had closed, and his black lashes lay against his pale cheeks. Colin was fast asleep at last.
        - id: ch01-b150
          speaker: narrator
          text: >-
            Mary rose softly, took her candle, and crept away without a sound.
