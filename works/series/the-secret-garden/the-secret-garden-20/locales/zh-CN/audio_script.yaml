audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
    dickon:
      display_name: 迪肯
      tts: {delivery: 质朴自在，带浓重而亲切的约克郡乡音, timbre: 清亮温厚，带荒原少年的蓬勃气息, pace: 轻快从容, pitch: 中高音}
    mrs_medlock:
      display_name: 梅德洛克太太
      tts: {delivery: 严厉能干，慌乱时语速陡然加快, timbre: 结实洪亮, pace: 中等, pitch: 中音}
    dr_craven:
      display_name: 克雷文医生
      tts: {delivery: 谨慎而略显焦躁，话里常带犹疑, timbre: 清晰偏薄, pace: 中等, pitch: 中音}
    nurse:
      display_name: 护士
      tts: {delivery: 恭谨克制，惊讶时仍尽力保持规矩, timbre: 柔和朴实, pace: 中等, pitch: 中音}
    mr_roach:
      display_name: 罗奇先生
      tts: {delivery: 随和实在，恭敬中藏着幽默, timbre: 粗厚爽朗, pace: 中等, pitch: 中低音}
    soot:
      display_name: 煤灰
      tts: {delivery: 神气十足，叫声短促响亮, timbre: 粗哑, pace: 偏快, pitch: 中音}
  chapters:
    - id: ch01
      title: 等待与秘密计划
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 他们这一等，就等了一个多星期。先是大风刮了好几天，接着科林又差点伤风。换作以前，两件事接连来，他早就大发脾气了。可这次不一样。他们有一个既周密又神秘的计划，许多地方都得仔细商量。迪肯也几乎天天过来，哪怕只待几分钟，也要讲一讲荒原、乡间小路、树篱和溪岸上出了什么新鲜事。
        - id: ch01-b02
          speaker: narrator
          text: 水獭、獾和水田鼠忙着安家，鸟儿忙着筑巢，田鼠也在地底挖洞。迪肯知道那些家的模样，也知道它们所有的小秘密。听这个能迷住动物的人一件件讲起来，你会觉得地下那个忙碌的世界正又急切又不安地赶着工，兴奋得自己都快发抖了。
        - id: ch01-b03
          speaker: dickon
          text: “它们跟俺们一样。只不过它们年年都得重盖房子，可不就忙坏了嘛。一个个紧赶慢赶，就怕来不及做好窝。”
        - id: ch01-b04
          speaker: narrator
          text: 最要紧的，还是怎样偷偷把科林送进花园。他们一拐过灌木丛的那个弯，走上常春藤墙外的小路，就绝不能再让别人看见轮椅，也不能让人看见玛丽和迪肯。科林越来越觉得，花园四周的秘密正是它最迷人的地方，谁也不能破坏它。
        - id: ch01-b05
          speaker: narrator
          text: 别人只能以为，科林喜欢玛丽和迪肯，也不介意让他们看见自己，这才肯一起出去。绝不能让任何人猜到，他们三个人藏着秘密。孩子们兴致勃勃地商量路线。他们先上这条小径，再下那一条，穿过另一条路，还要绕着喷泉花坛走一圈，装作在看园丁领班罗奇先生安排人栽下的花坛植物。这样再自然不过，谁也不会起疑。随后，他们拐进灌木丛，东绕西绕，直到长墙那里。这计划周密得像大将军在战时安排进军路线。
        - id: ch01-b06
          speaker: narrator
          text: 病人房里近来的新鲜怪事，早从仆人大厅传进马厩院子，又传到了园丁们中间。可罗奇先生接到命令时，还是大吃一惊。科林少爷叫他去那间外人从没进过的神秘卧室报到，说病人本人要亲自同他谈话。
        - id: ch01-b07
          speaker: mr_roach
          text: “哎哟，这回又是怎么啦？那位从不让人瞧的王子殿下，竟然要召见一个他见都没见过的人。”
        - id: ch01-b08
          speaker: narrator
          text: 罗奇先生匆匆换上外套，心里也很好奇。他连科林的一眼都没瞧见过，却听过十来种夸张的传闻。有人说那孩子长相阴森，举止怪异，发起脾气像疯了一样。最多的说法是，他随时都会死。还有些从没见过他的人，绘声绘色地说他驼着背，两条腿也动不了。
        - id: ch01-b09
          speaker: mrs_medlock
          text: “罗奇先生，这屋里的情形可变了。”
        - id: ch01-b10
          speaker: narrator
          text: 梅德洛克太太领他上了后楼梯，来到那间神秘卧室外的走廊。
        - id: ch01-b11
          speaker: mr_roach
          text: “但愿是越变越好吧，梅德洛克太太。”
        - id: ch01-b12
          speaker: mrs_medlock
          text: “反正再坏也坏不到哪儿去了。事情是古怪，可有些人倒觉得，自己的差事比从前好熬多了。待会儿要是发现自己站在满屋飞禽走兽中间，而玛莎的弟弟迪肯比你我都自在，你可千万别吓着。”
        - id: ch01-b13
          speaker: narrator
          text: 玛丽一直暗暗相信，迪肯身上真有一种魔力。罗奇先生听见他的名字，宽厚地笑了。
        - id: ch01-b14
          speaker: mr_roach
          text: “那孩子到了白金汉宫，或者下到煤矿最底下，都能跟在家里一样自在。这可不是他厚脸皮，是他这个人真好。”
    - id: ch02
      title: 小王公的命令
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 幸亏罗奇先生有了准备。卧室门一开，煤灰正停在雕花椅的高椅背上，神气活现得像待在自己家里。它大声通报客人来了。尽管梅德洛克太太提醒过，罗奇先生还是差一点就不顾体面地向后跳开。
        - id: ch02-b02
          speaker: soot
          text: “嘎——嘎！”
        - id: ch02-b03
          speaker: narrator
          text: 小王公没躺在床上，也没躺在长沙发上。他坐在扶手椅里，身旁的小羊羔像吃奶时那样摇着尾巴。迪肯跪在地上，用奶瓶喂它。松鼠蹲在迪肯弯下的背上，专心啃着坚果。从印度来的小姑娘坐在大脚凳上看着。
        - id: ch02-b04
          speaker: mrs_medlock
          text: “科林少爷，罗奇先生来了。”
        - id: ch02-b05
          speaker: narrator
          text: 科林转过头，从头到脚看了罗奇一遍。至少罗奇觉得，自己是被这位小主人这样检阅了一番。
        - id: ch02-b06
          speaker: colin_craven
          text: “哦，你就是罗奇？我叫你来，是有几道很重要的命令。”
        - id: ch02-b07
          speaker: mr_roach
          text: “是，少爷。”
        - id: ch02-b08
          speaker: narrator
          text: 罗奇心里直犯嘀咕。小少爷会不会叫他砍掉园林里所有的橡树，或者把果园全改成水上花园？
        - id: ch02-b09
          speaker: colin_craven
          text: “今天下午我要坐轮椅出去。新鲜空气要是对我有好处，我以后也许每天都出去。只要我出门，花园围墙旁的长径就不许有园丁，一个也不许留。我大约两点钟出去。在我叫人传话以前，谁都不能回来干活。”
        - id: ch02-b10
          speaker: mr_roach
          text: “是，少爷。”
        - id: ch02-b11
          speaker: narrator
          text: 罗奇松了口气。看来橡树保住了，果园也安全了。
        - id: ch02-b12
          speaker: colin_craven
          text: “玛丽，在印度，话说完了，想让人走，你们会怎么说？”
        - id: ch02-b13
          speaker: mary_lennox
          text: “你要说，‘你可以退下了。’”
        - id: ch02-b14
          speaker: narrator
          text: 小王公听完，摆出惯于发号施令的模样，挥了挥瘦削的手。
        - id: ch02-b15
          speaker: colin_craven
          text: “罗奇，你可以退下了。不过别忘记，这件事非常重要。”
        - id: ch02-b16
          speaker: soot
          text: “嘎——嘎！”
        - id: ch02-b17
          speaker: narrator
          text: 煤灰嗓音沙哑，听起来倒不算失礼。
        - id: ch02-b18
          speaker: mr_roach
          text: “是，少爷。谢谢少爷。”
        - id: ch02-b19
          speaker: narrator
          text: 梅德洛克太太把他领出房间。到了外面的走廊上，这个生性随和的人越想越好笑，笑意一直挂在脸上，差一点便真的笑出了声。
        - id: ch02-b20
          speaker: mr_roach
          text: “我的老天，他发号施令时可真够威风，是不是？简直像整个王室都合在他一个人身上，连女王的丈夫也没落下。”
        - id: ch02-b21
          speaker: mrs_medlock
          text: “嗨！他才刚会走路，我们就得任他把每个人踩在脚底下。他还以为人活着就是为了给他踩呢。”
        - id: ch02-b22
          speaker: mr_roach
          text: “只要他能活下来，也许长大些就改了。”
        - id: ch02-b23
          speaker: mrs_medlock
          text: “有一件事准错不了。他要是活下来，那个印度来的孩子又一直留在这里，她准会照苏珊·索尔比说的，教他明白整个橙子不全归他。到时候，他也该知道自己那一份究竟有多大了。”
        - id: ch02-b24
          speaker: narrator
          text: 屋里，科林靠回软垫上。
        - id: ch02-b25
          speaker: colin_craven
          text: “现在全都安排妥了。今天下午我就能看见它。今天下午，我就会在花园里面了！”
          emotion: happy
    - id: ch03
      title: 从未见过的春天
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 迪肯带着动物们回了花园，玛丽留下来陪科林。玛丽看不出他有一点疲倦，他却一直很安静。午饭送来以前不说话，吃饭时也不说话。她猜不透他为什么这样，终于忍不住问了。
        - id: ch03-b02
          speaker: mary_lennox
          text: “科林，你的眼睛可真大。你一想事情，它们就大得像碟子。你现在想什么？”
        - id: ch03-b03
          speaker: colin_craven
          text: “我总在想，它究竟是什么样子。”
        - id: ch03-b04
          speaker: mary_lennox
          text: “你是说花园？”
        - id: ch03-b05
          speaker: colin_craven
          text: “我是说春天。我好像从来没真正见过它。我几乎没出过门。偶尔出去，我也不看，连想都没想过。”
        - id: ch03-b06
          speaker: mary_lennox
          text: “我在印度也没见过。那里没有这样的春天。”
        - id: ch03-b07
          speaker: narrator
          text: 科林的生活一直封闭在屋里，性情也因此变得病态，可他的想象力却比玛丽丰富得多。至少在那些孤独的日子里，他花过不少时间，翻看许多奇妙的书和图画。
        - id: ch03-b08
          speaker: colin_craven
          text: “那天早晨，你跑进来喊‘它来了！它来了！’，我心里忽然好奇怪。听着就像万物排成很长很长的队伍，跟着一阵阵响亮的乐声走来。我的书里有一幅这样的画。漂亮的大人和孩子挤在一起，有人戴花环，有人举着开花的树枝。大家又笑又跳，还吹着笛子。所以我才会说，也许我们能听见金色的号角声，还叫你打开窗户。”
        - id: ch03-b09
          speaker: mary_lennox
          text: “真有意思！可春天给人的感觉就是那样。要是花朵、叶子、所有绿东西，还有鸟和野兽，一起跳着舞走过去，那队伍该有多大呀！它们一定会跳舞、唱歌、吹笛子。那就是你听见的一阵阵乐声。”
        - id: ch03-b10
          speaker: narrator
          text: 两个孩子都笑了。不是因为这个想法可笑，而是因为他们实在太喜欢它。
        - id: ch03-b11
          speaker: narrator
          text: 过了一会儿，护士来给科林作出门的准备。以前穿衣服时，他总像根木头一样躺着，任人摆弄。这次却自己坐了起来，还努力帮忙。从开始穿衣直到收拾好，他一直跟玛丽有说有笑。
        - id: ch03-b12
          speaker: nurse
          text: “少爷今天精神特别好，先生。心里一高兴，身上也有力气了。”
        - id: ch03-b13
          speaker: narrator
          text: 克雷文医生刚好过来查看科林。
        - id: ch03-b14
          speaker: dr_craven
          text: “下午晚些时候，等他回来，我再过来一趟。我得亲眼看看，这次出门对他究竟怎么样。我只是希望，他肯让你跟着一起去。”
        - id: ch03-b15
          speaker: nurse
          text: “先生，就算让我现在辞掉差事，我也不愿站在这里，听谁向他提这句话。”
        - id: ch03-b16
          speaker: dr_craven
          text: “我其实还没真的决定要不要提。”医生又有些紧张了。“那就先试一试吧。迪肯这孩子，哪怕把刚出生的婴儿交给他，我都放心。”
        - id: ch03-b17
          speaker: narrator
          text: 宅子里力气最大的男仆把科林抱下楼，放进轮椅。迪肯已在外面等着。男仆铺好毯子和软垫，小王公便朝他和护士一挥手。
        - id: ch03-b18
          speaker: colin_craven
          text: “你们可以退下了。”
        - id: ch03-b19
          speaker: narrator
          text: 两个人赶快消失在门里。一到宅子里面，确定科林听不见了，他们就再也忍不住，偷偷笑了起来。
    - id: ch04
      title: 走进秘密花园
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 迪肯推着轮椅，走得又慢又稳。玛丽小姐陪在旁边。科林靠着椅背，把脸仰向天空。苍穹高得像一道拱顶，晶莹的蓝天下，小小的雪白云朵像白鸟展开翅膀，轻轻漂浮。荒原上的风一阵阵吹来，又宽阔又柔和，还带着清冽芬芳的野趣。这味道对科林来说陌生极了。他不断挺起瘦削的胸膛，把风深深吸进身体。那双大眼睛一直睁着，仿佛正在倾听的不是他的耳朵，而正是他的眼睛。
        - id: ch04-b02
          speaker: colin_craven
          text: “到处都有歌声，有嗡嗡声，还有互相呼唤的声音。一阵阵风吹过来时，送来的究竟是什么香味？”
        - id: ch04-b03
          speaker: dickon
          text: “那是荒原上的金雀花开啦。嗨！今儿蜜蜂全扑在花上，忙得可真不得了。”
        - id: ch04-b04
          speaker: narrator
          text: 他们走过的小径上，一个人影也没有。所有园丁和园丁学徒都像中了魔法，不见了。他们照精心商量好的路线，在灌木丛里绕来绕去，又转出来绕过喷泉花坛。其实不这样走也行，可他们偏要享受那份神秘的快乐。等他们终于转上常春藤墙旁的长径，那个激动人心的时刻已经很近了。谁也说不清为什么，三个人忽然都用耳语说起话来。
        - id: ch04-b05
          speaker: mary_lennox
          text: “就是这里。从前我总在这儿来来回回地走，一直猜，一直猜。”
        - id: ch04-b06
          speaker: colin_craven
          text: “就是这里？可我什么也看不见。这里没有门。”
        - id: ch04-b07
          speaker: narrator
          text: 科林急切地望着常春藤，声音也压低了。
        - id: ch04-b08
          speaker: mary_lennox
          text: “我当初也这么想。”
        - id: ch04-b09
          speaker: narrator
          text: 接着，一阵美妙的寂静落了下来。谁也没有再说话，大家都屏住呼吸，只有轮椅还在静静向前滚动。
        - id: ch04-b10
          speaker: mary_lennox
          text: “那边就是本·韦瑟斯塔夫干活的花园。”
        - id: ch04-b11
          speaker: colin_craven
          text: “是吗？”
        - id: ch04-b12
          speaker: narrator
          text: 又走了几码，玛丽再一次低声告诉他。
        - id: ch04-b13
          speaker: mary_lennox
          text: “知更鸟就是从这里飞过围墙的。”
        - id: ch04-b14
          speaker: colin_craven
          text: “就是这里？真希望它再飞来一次！”
        - id: ch04-b15
          speaker: mary_lennox
          text: “还有那里。它当时停在紫丁香下面那一小堆土上，把钥匙指给我看。”
        - id: ch04-b16
          speaker: narrator
          text: 玛丽怀着一种庄严的喜悦，抬手指向那一大丛紫丁香下面。科林顺着她指的方向看去，猛地坐直了身子。
        - id: ch04-b17
          speaker: colin_craven
          text: “在哪里？在哪里？是那里吗？”
        - id: ch04-b18
          speaker: narrator
          text: 他的眼睛瞪得像《小红帽》里的大灰狼一样大，正是小红帽忍不住问起那双眼睛时的模样。迪肯停住了，轮椅也不再往前。
        - id: ch04-b19
          speaker: mary_lennox
          text: “还有这里。它站在墙头冲我啾啾叫时，我就是走到这儿跟它说话的。这一片常春藤，就是那天被风吹开的。”
        - id: ch04-b20
          speaker: narrator
          text: 玛丽踏上常春藤旁的花坛，抓住垂下来的那幅绿帘。
        - id: ch04-b21
          speaker: colin_craven
          text: “就是这里吗？真的是这里吗？”
          emotion: surprised
        - id: ch04-b22
          speaker: mary_lennox
          text: “把手在这里，门也在这里。迪肯，快把他推进去，快呀！”
        - id: ch04-b23
          speaker: narrator
          text: 迪肯双手一使劲，稳稳地向前一推。那一推又有力，又漂亮。
        - id: ch04-b24
          speaker: narrator
          text: 科林高兴得直喘气，身子却真的倒回软垫里。他用双手捂紧眼睛，把所有景象都挡在外面。迪肯推着他进了花园。等轮椅像中了魔法一样停住，门也在身后关好，他才放下手，像玛丽和迪肯第一次进来时那样，一遍又一遍地环顾四周。
        - id: ch04-b25
          speaker: narrator
          text: 墙上、泥土上、树上，连摇摆的细枝和卷须上，都爬满了柔嫩的新叶，织成一层美丽的绿纱。树下的草丛、壁龛里的灰色石瓮旁，还有远远近近的每一处，到处点着金黄、紫色和雪白。头顶的树开出粉红的花，也堆起了白雪似的花团。翅膀轻轻扑动，细细甜美的清鸣和嗡嗡声四下响着。空气里到处是香气，一缕又一缕，怎么闻也闻不够。
        - id: ch04-b26
          speaker: narrator
          text: 阳光暖暖落在科林脸上，像一只触碰轻柔而美好的手，正抚摸着他。玛丽和迪肯惊奇地站在原地，目不转睛地看着他。他的模样又陌生，又和从前完全不同。一层粉红的血色真的爬遍了他的全身。象牙般的脸、脖颈和双手，无一处不泛起红晕。
        - id: ch04-b27
          speaker: colin_craven
          text: “我会好起来！我会好起来！玛丽！迪肯！我会好起来！我会永远、永远、永远活下去！”
          emotion: happy
