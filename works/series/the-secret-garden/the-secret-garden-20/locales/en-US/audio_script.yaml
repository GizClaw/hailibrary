  chapters:
    - id: ch01
      title: The Secret Plan
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            They had to wait more than a week. First came several windy days, and then Colin seemed close to catching a cold. One delay after another would once have sent him into a rage. Now there was too much secret planning to enjoy, and that kept his temper away. Dickon came nearly every day, even if he could stay only a few minutes. He brought news from the moor, the lanes, the hedges, and the edges of the streams. He described the homes of otters, badgers, and water rats, along with birds' nests and the burrows of field mice. He knew the small, private details of their lives. Hearing them from a boy who could charm animals was enough to make anyone tremble with excitement. The whole busy world beneath the grass seemed to be working with thrilling eagerness and worry.
        - id: ch01-b02
          speaker: dickon
          text: >-
            They're like us, really. Only they've got to build their homes all over again each year. Keeps 'em so busy, they fair scramble to finish.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Still, the most exciting work was arranging how to move Colin into the garden in complete secrecy. Once the chair, Dickon, and Mary passed a certain turn in the shrubbery and reached the walk beside the ivy-covered walls, no one could be near enough to see them.

            With each passing day, Colin became more certain that the mystery was one of the garden's greatest charms. Nothing could be allowed to spoil it. No one must even guess that the three of them shared a secret.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Everyone was supposed to think Colin had gone out with Mary and Dickon simply because he liked them and did not mind being seen by them. The children had long, delightful talks about the route. They would take one path, cross another, then circle the flower beds by the fountain. Mr. Roach, the head gardener, had workers arranging the plants that would be set out there, so stopping to inspect them would seem perfectly sensible. No one would find that mysterious. Afterward, the three children would turn into the shrubbery, lose themselves among its winding paths, and finally reach the long walls. Their plan was almost as serious and carefully arranged as a general's march in wartime.
    - id: ch02
      title: Orders for Mr. Roach
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Of course, rumors of the strange new happenings in the invalid's rooms had traveled through the servants' hall, into the stable yard, and out among the gardeners. Even so, Mr. Roach was startled when an order came from Master Colin's room. He was to report to the apartment no outsider had ever seen because the boy himself wished to speak with him.
        - id: ch02-b02
          speaker: mr_roach
          text: >-
            Well, now, what's happened? His Royal Highness, who couldn't even be looked at, is calling for a man he's never once seen.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Mr. Roach changed his coat in a hurry. He could not help being curious. He had never caught so much as a glimpse of Colin, though he had heard a dozen wild stories about the boy's strange looks, his strange ways, and his terrible fits of temper. The tale repeated most often was that Colin might die at any moment. There were also fanciful descriptions of a crooked back and helpless legs. Every one of those descriptions came from people who had never seen him.

            Mrs. Medlock led Mr. Roach up the back stairs and into the corridor outside the room that had always been such a mystery.
        - id: ch02-b04
          speaker: mrs_medlock
          text: Things are changing in this house, Mr. Roach.
        - id: ch02-b05
          speaker: mr_roach
          text: Let's hope they're changing for the better, Mrs. Medlock.
        - id: ch02-b06
          speaker: mrs_medlock
          text: >-
            They could hardly get worse. Strange as it all is, some of us are finding our work much easier to bear. And don't be startled if you walk into a menagerie and find Martha Sowerby's Dickon more at home there than either of us could ever be.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Mary had always believed there was a kind of Magic about Dickon. At the sound of his name, Mr. Roach smiled with easy approval.
        - id: ch02-b08
          speaker: mr_roach
          text: >-
            That boy would be at home in Buckingham Palace or down at the bottom of a coal mine. And it isn't because he's pushy, either. He's simply a fine lad.
        - id: ch02-b09
          speaker: narrator
          text: >-
            The warning helped, though not quite enough. When the bedroom door opened, a large crow was perched comfortably on the tall back of a carved chair. It announced the visitor so loudly that Mr. Roach barely stopped himself from jumping backward.
        - id: ch02-b10
          speaker: crow
          text: Caw! Caw!
        - id: ch02-b11
          speaker: narrator
          text: >-
            The young Rajah was not in bed or lying on his sofa. He sat in an armchair. Beside him, a young lamb wagged its tail the way hungry lambs do while Dickon knelt and fed it milk from a bottle. A squirrel sat on Dickon's bent back, calmly nibbling a nut. Mary, the little girl from India, watched from a large footstool.
        - id: ch02-b12
          speaker: mrs_medlock
          text: Here is Mr. Roach, Master Colin.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Colin turned and inspected the head gardener. At least, that was how it felt to Mr. Roach.
        - id: ch02-b14
          speaker: colin
          text: So you're Roach. I sent for you because I have some very important orders.
        - id: ch02-b15
          speaker: mr_roach
          text: Very good, sir.
        - id: ch02-b16
          speaker: narrator
          text: >-
            Mr. Roach wondered if he was about to be told to cut down every oak tree in the park or turn the orchards into water gardens.
        - id: ch02-b17
          speaker: colin
          text: >-
            I'm going outside in my chair this afternoon. If the fresh air suits me, I may go out every day. Whenever I go, no gardener is to come anywhere near the Long Walk beside the garden walls. No one at all. I'll be out around two o'clock. Everyone must stay away until I send word that they may return to work.
        - id: ch02-b18
          speaker: mr_roach
          text: Very good, sir.
        - id: ch02-b19
          speaker: narrator
          text: >-
            Mr. Roach was greatly relieved. The oaks and orchards were safe.
        - id: ch02-b20
          speaker: colin
          text: >-
            Mary, what do people say in India when they've finished speaking and want someone to leave?
        - id: ch02-b21
          speaker: mary
          text: You say, “You have my permission to go.”
        - id: ch02-b22
          speaker: narrator
          text: The Rajah gave a wave of his hand.
        - id: ch02-b23
          speaker: colin
          text: You have my permission to go, Roach. But remember, this is very important.
        - id: ch02-b24
          speaker: crow
          text: Caw! Caw!
        - id: ch02-b25
          speaker: narrator
          text: The crow's hoarse comment was not at all impolite.
        - id: ch02-b26
          speaker: mr_roach
          text: Very good, sir. Thank you, sir.
        - id: ch02-b27
          speaker: narrator
          text: >-
            Mrs. Medlock led him out. Once they were safely in the corridor, the good-natured gardener smiled until he nearly laughed.
        - id: ch02-b28
          speaker: mr_roach
          text: >-
            My word! He has a grand, lordly manner, doesn't he? You'd think he was the whole Royal Family rolled into one, Prince Consort and all.
        - id: ch02-b29
          speaker: mrs_medlock
          text: >-
            Oh, we've let him walk all over every one of us since he first had feet. He thinks that's what people were born for.
        - id: ch02-b30
          speaker: mr_roach
          text: Maybe he'll grow out of it, if he lives.
        - id: ch02-b31
          speaker: mrs_medlock
          text: >-
            One thing is certain. If he does live, and that Indian child stays, she'll teach him that the whole orange isn't his, as Susan Sowerby says. He'll find out soon enough how small his own quarter is.
        - id: ch02-b32
          speaker: narrator
          text: Back inside, Colin leaned against his cushions.
        - id: ch02-b33
          speaker: colin
          text: >-
            It's safe now. And this afternoon I'll see it. This afternoon, I'll be inside it!
          emotion: happy
    - id: ch03
      title: Colin Meets the Spring
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Dickon returned to the garden with his creatures, while Mary stayed with Colin. She did not think he looked tired, but he grew very quiet before lunch arrived. He remained quiet through the meal. Mary kept wondering what was going on in his mind until she finally asked.
        - id: ch03-b02
          speaker: mary
          text: >-
            Your eyes are so big, Colin. Whenever you're thinking, they get as round as saucers. What are you thinking about now?
        - id: ch03-b03
          speaker: colin
          text: I keep wondering what it will look like.
        - id: ch03-b04
          speaker: mary
          text: The garden?
        - id: ch03-b05
          speaker: colin
          text: >-
            Spring. I've never truly seen it before. I almost never went outdoors, and when I did, I didn't look at anything. I never even thought about it.
        - id: ch03-b06
          speaker: mary
          text: I never saw spring in India. There wasn't any.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Colin's life had been shut away and full of gloomy thoughts, but he had more imagination than Mary. He had also spent many hours looking at beautiful books and pictures.
        - id: ch03-b08
          speaker: colin
          text: >-
            That morning you rushed in calling, “It's here! It's here!” you made me feel so strange. It sounded as if everything was arriving in a huge procession, with music bursting and drifting through the air. One of my books has a picture like that. It shows crowds of beautiful people and children. They carry garlands and flowering branches, and everyone is laughing, dancing, pushing together, and playing pipes. That's why I said we might hear golden trumpets and told you to open the window.
        - id: ch03-b09
          speaker: mary
          text: >-
            How funny! But that is exactly what it feels like. Imagine all the flowers and leaves and green things and birds and wild creatures dancing past together. What a crowd! They'd dance and sing and play flutes, and all that music would come floating by.
        - id: ch03-b10
          speaker: narrator
          text: >-
            They both laughed. Not because the idea was silly, but because they liked it so much.

            A little later, the nurse dressed Colin. Instead of lying there like a log while she did everything, he sat up and tried to help. The whole time, he talked and laughed with Mary. Dr. Craven stopped by to examine him.
        - id: ch03-b11
          speaker: nurse
          text: >-
            This is one of his good days, sir. He's in such high spirits, they seem to make him stronger.
        - id: ch03-b12
          speaker: dr_craven
          text: >-
            I'll come back later this afternoon, after he's returned. I need to see how going outside agrees with him. I only wish he'd allow you to go along.
        - id: ch03-b13
          speaker: nurse
          text: >-
            I'd sooner give up the case this minute, sir, than stay in the room while anyone even suggests it.
        - id: ch03-b14
          speaker: dr_craven
          text: >-
            I hadn't quite decided to suggest it. We'll try the experiment as it is. I'd trust Dickon with a newborn baby.
        - id: ch03-b15
          speaker: narrator
          text: >-
            The strongest footman in the house carried Colin downstairs and settled him in his wheeled chair, where Dickon was waiting outside. The manservant carefully arranged Colin's rugs and cushions. Then the young Rajah waved both him and the nurse away.
        - id: ch03-b16
          speaker: colin
          text: You have my permission to go.
        - id: ch03-b17
          speaker: narrator
          text: >-
            They vanished quickly, and once they were safely inside the house, both of them giggled.

            Dickon pushed the chair at a slow, steady pace. Mary walked beside it. Colin leaned back and raised his face toward the sky. Its blue arch seemed enormously high. Below that crystal blue, little white clouds floated like snowy birds with their wings spread wide. The wind came from the moor in great soft breaths, carrying a wild, clean sweetness. Colin kept lifting his narrow chest to breathe it in. His large eyes looked as if they were listening to the world instead of his ears.
        - id: ch03-b18
          speaker: colin
          text: >-
            Everywhere I hear singing and humming and creatures calling. What's that smell the wind keeps bringing us?
        - id: ch03-b19
          speaker: dickon
          text: >-
            It's the gorse blooming out on th' moor. Eh, the bees are working it grand today.
        - id: ch03-b20
          speaker: narrator
          text: >-
            Not one person appeared along their path. Every gardener and gardener's boy seemed to have been spirited away. The three of them could have gone straight to the wall, but they did not. They wound in and out through the shrubbery, then went around the fountain beds exactly as planned. They followed every turn simply for the mysterious pleasure of it.

            At last, they turned into the Long Walk beside the ivy-covered walls. The thrill of coming close to the secret made them whisper, though none of them could have said why.
    - id: ch04
      title: Inside the Garden
      blocks:
        - id: ch04-b01
          speaker: mary
          text: >-
            This is the place. This is where I used to walk back and forth, wondering and wondering.
        - id: ch04-b02
          speaker: colin
          text: >-
            Is it? But I can't see anything. There's no door.
        - id: ch04-b03
          speaker: mary
          text: That's what I thought too.
        - id: ch04-b04
          speaker: narrator
          text: >-
            A lovely, breathless silence followed. No one spoke while the chair rolled slowly onward.
        - id: ch04-b05
          speaker: mary
          text: That's the garden where Ben Weatherstaff works.
        - id: ch04-b06
          speaker: colin
          text: Is it?
        - id: ch04-b07
          speaker: narrator
          text: >-
            They went a few yards farther before Mary whispered again.
        - id: ch04-b08
          speaker: mary
          text: This is where the robin flew over the wall.
        - id: ch04-b09
          speaker: colin
          text: >-
            Is it? Oh, I wish he'd come back!
        - id: ch04-b10
          speaker: mary
          text: >-
            And over there, under that big lilac bush, is where he landed on the little mound of earth and showed me the key.
        - id: ch04-b11
          speaker: narrator
          text: Colin sat straight up.
        - id: ch04-b12
          speaker: colin
          text: >-
            Where? Where is it? There?
          emotion: surprised
        - id: ch04-b13
          speaker: narrator
          text: >-
            His eyes were as huge as the wolf's eyes in the story of Little Red Riding Hood. Dickon stopped, and the chair stood still.
        - id: ch04-b14
          speaker: mary
          text: >-
            And this is where I came to speak to the robin when he chirped from the top of the wall. This is the ivy the wind blew aside.
        - id: ch04-b15
          speaker: narrator
          text: Mary took hold of the hanging green curtain.
        - id: ch04-b16
          speaker: colin
          text: Oh! Is it? Is it?
          emotion: surprised
        - id: ch04-b17
          speaker: mary
          text: >-
            Here's the handle, and here's the door. Dickon, push him in. Quickly!
        - id: ch04-b18
          speaker: narrator
          text: >-
            Dickon gave the chair one strong, steady, splendid push.

            Colin fell back against his cushions with a gasp of delight. He covered his eyes with both hands and kept them tightly shut while the chair passed through the doorway. It stopped as if by magic, and the door closed behind them. Only then did Colin lower his hands.
        - id: ch04-b19
          speaker: narrator
          text: >-
            He looked around and around and around, just as Mary and Dickon had done on their first day there. A beautiful green veil of tender new leaves had crept across the walls, the earth, and the trees. It covered every swinging spray and curling tendril. Beneath the trees, among the grass, inside the gray urns in the alcoves, and here and there all through the garden were touches and splashes of gold, purple, and white. Over Colin's head, the trees showed pink and snowy blossoms. Wings fluttered. Birds piped softly. Insects hummed. One sweet scent followed another through the warm air.

            The sun fell warm on Colin's face, touching him like a gentle hand. Mary and Dickon stood staring at him in wonder. He looked so strange and completely different that they could hardly believe it. A living pink glow had spread over his ivory-colored face, his neck, and even his thin hands.
        - id: ch04-b20
          speaker: colin
          text: >-
            I'm going to get well! I'm going to get well! Mary! Dickon! I'm going to get well! And I shall live forever and ever and ever!
          emotion: happy
