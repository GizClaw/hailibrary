audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    ben_weatherstaff:
      display_name: 本·韦瑟斯塔夫
      tts: {delivery: 粗声直率，约克郡口音浓重，偶尔透出温柔, timbre: 苍老粗粝, pace: 偏慢, pitch: 低音}
    dickon:
      display_name: 迪肯
      tts: {delivery: 质朴自在，带浓重而亲切的约克郡乡音, timbre: 清亮温厚，带荒原少年的蓬勃气息, pace: 轻快从容, pitch: 中高音}
  chapters:
    - id: ch01
      title: 阳光下的秘密花园
      blocks:
        - {id: ch01-b01, speaker: narrator, text: 阳光在秘密花园里照了将近一星期。“秘密花园”，这是玛丽在心里给它起的名字。她喜欢这几个字，更喜欢四面古墙把她藏起来的感觉。只要门一关，谁也不知道她在哪儿。她仿佛离开了外面的世界，独自走进童话里的仙境。}
        - {id: ch01-b02, speaker: narrator, text: 玛丽读过的书很少，喜欢的那几本都是童话。故事里的秘密花园常有人一睡百年，她却觉得那样蠢透了。她一点也不想睡。来到米塞尔斯韦特以后，她一天比一天清醒，也开始喜欢户外。风不再讨厌，迎着风跑反而很快活。她能跑得更快、更久，跳绳也能一口气跳上一百下。}
        - {id: ch01-b03, speaker: narrator, text: 地下的球茎一定很惊讶。玛丽替它们清开杂草，留足了喘息的地方。她不知道，黑暗泥土里的小东西已经振作起来，正拼命生长。太阳能把它们晒暖，雨水一落下，也能立刻钻进土里。它们觉得自己真正活了。}
        - {id: ch01-b04, speaker: narrator, text: 玛丽性子古怪又执拗，如今终于有件有趣的事值得她坚持，整颗心都扑了进去。她挖土、拔草，一直干下去，丝毫不觉得累，只觉得一小时比一小时开心。这简直是一场迷人的游戏。她原本没有指望找到多少嫩芽，可花园里处处都冒出淡绿色的小尖角。每天，她总能确信自己又发现了新的。有些实在太小，才刚从土面探出一点点头。}
        - {id: ch01-b05, speaker: narrator, text: 这么多新芽，让她想起玛莎说过的成千上万株雪花莲。球茎会繁衍，眼前这些独自生长了十年，也许早已变成了成千上万株。它们什么时候才会露出花朵的模样呢？玛丽常常停下手里的活，望着整座花园，想象这里开满千万朵花的样子。}
        - {id: ch01-b06, speaker: narrator, text: 这一星期里，她跟本·韦瑟斯塔夫也熟了些。她每回靠近都轻手轻脚，因为怕他一看见自己，就扛起工具走掉。结果，她常像从土里突然冒出来似的，把老人吓一跳。其实，本已经不像起初那么讨厌她。她显然喜欢陪着这个上了年纪的人，也许还叫他暗暗有些得意。何况玛丽比从前客气了。她初次见本时，还拿出在印度命令仆人的口气，根本不懂一个暴躁而结实的约克郡老头，既不会对主人卑躬屈膝，也不习惯别人只管吩咐他做事。}
        - {id: ch01-b07, speaker: ben_weatherstaff, text: “你呀，跟那只知更鸟一个样。什么时候出现，从哪边冒出来，我从来猜不着。”}
        - {id: ch01-b08, speaker: mary_lennox, text: “它现在已经是我的朋友了。”}
        - {id: ch01-b09, speaker: ben_weatherstaff, text: “它就爱干这个。心里又轻浮又爱显摆，专会讨女人家的喜欢。只要能炫耀自己，它什么都肯干，尾巴上的毛也要翘起来给人瞧。那一肚子骄傲，塞得比鸡蛋还满。”}
        - {id: ch01-b10, speaker: narrator, text: 本平日懒得多说，玛丽问他话，他有时只哼一声。可这天，他竟站直身子，把钉着大头钉的靴子踩在铁锹顶上，仔细打量起她来。}
        - {id: ch01-b11, speaker: ben_weatherstaff, text: “你来这里多久了？”}
        - {id: ch01-b12, speaker: mary_lennox, text: “大概一个月。”}
        - {id: ch01-b13, speaker: ben_weatherstaff, text: “总算开始给米塞尔斯韦特长脸了。你胖了点，脸也没那么黄。刚进这花园时，你就像只拔光毛的小乌鸦。我还想呢，这辈子从没见过这么难看、这么一脸酸相的小东西。”}
        - {id: ch01-b14, speaker: narrator, text: 玛丽不爱漂亮，也从没太在意自己的模样，所以并没有生气。}
        - {id: ch01-b15, speaker: mary_lennox, text: “我知道自己胖了。我的长袜越来越紧，从前穿上总有一道道皱褶。看，本，知更鸟来了。”}
        - {id: ch01-b16, speaker: narrator, text: 知更鸟果然来了，玛丽觉得它比以往更加神气。红胸脯亮得像缎子。它一会儿抖抖翅膀，一会儿翘起尾巴，又歪着脑袋蹦来蹦去，每个动作都活泼漂亮。它仿佛拿定了主意，非叫本赞赏自己不可。本却偏要嘲弄它。}
        - {id: ch01-b17, speaker: ben_weatherstaff, text: “啊，你在这儿！找不到更好的人时，才肯陪我一会儿。这两个星期，又擦亮红坎肩，又梳光羽毛，我知道你想干什么。你准在追求哪位胆大的姑娘，还骗她说，你是米塞尔荒原上最了不起的雄鸟，别的鸟你全敢打。”}
        - {id: ch01-b18, speaker: mary_lennox, text: “快看那只知更鸟，它还在往这边跳！”, emotion: surprised}
        - {id: ch01-b19, speaker: narrator, text: 知更鸟胆子大极了，也可爱极了。它一点点蹦近，越发讨好地望着本，又飞到醋栗丛上，歪着头，专门唱了一小段给他听。本脸上的皱纹挤成一团，分明高兴了，却不肯承认。}
        - {id: ch01-b20, speaker: ben_weatherstaff, text: “你以为这样就能哄住我。你认定了谁也拒绝不了你，对不对？”}
        - {id: ch01-b21, speaker: narrator, text: 知更鸟忽然张开翅膀，径直落到铁锹柄顶上。玛丽几乎不敢相信自己的眼睛。本脸上的神情慢慢变了。他一动不动，连气也不敢喘。哪怕有人拿全世界来换，他也不会挪一下，生怕惊走自己的知更鸟。}
        - {id: ch01-b22, speaker: ben_weatherstaff, text: “真是活见鬼了。你可真会拿捏人！你聪明成这样，简直不像凡间的东西。”}
        - {id: ch01-b23, speaker: narrator, text: 他的声音轻得像耳语，那柔和的口气，仿佛嘴里说的是另一番话。老人就这样屏着呼吸站着，直到知更鸟又一抖翅膀，终于飞走。他盯着铁锹柄看了又看，仿佛那里还留着什么魔法。随后他重新低头挖土，好几分钟一个字也不说。可他不时慢慢咧嘴一笑，玛丽便不再害怕，知道自己可以继续问话了。}
    - id: ch02
      title: 活着的玫瑰
      blocks:
        - {id: ch02-b01, speaker: mary_lennox, text: “你有自己的花园吗？”}
        - {id: ch02-b02, speaker: ben_weatherstaff, text: “没有。我是个老光棍，住在大门口马丁家。”}
        - {id: ch02-b03, speaker: mary_lennox, text: “要是有，你会种什么？”}
        - {id: ch02-b04, speaker: ben_weatherstaff, text: “卷心菜、土豆，还有洋葱。”}
        - {id: ch02-b05, speaker: mary_lennox, text: “我是说花园。要是想种花，你会选什么？”}
        - {id: ch02-b06, speaker: ben_weatherstaff, text: “球茎花，还有香喷喷的花。不过种得最多的，还是玫瑰。”}
        - {id: ch02-b07, speaker: narrator, text: 玛丽一下子来了精神，问他是不是真的喜欢玫瑰。本先拔起一株杂草，扔到旁边，才肯回答。}
        - {id: ch02-b08, speaker: ben_weatherstaff, text: “嗯，是喜欢。从前我给一位年轻太太当园丁，是她教我喜欢的。她在自己最心爱的地方种了许多玫瑰，疼那些花就像疼孩子，或者疼知更鸟。我亲眼见过她弯腰去亲花。那都是十年前的事了。”}
        - {id: ch02-b09, speaker: mary_lennox, text: “她现在在哪儿？”}
        - {id: ch02-b10, speaker: ben_weatherstaff, text: “在天堂。牧师是这么说的。”}
        - {id: ch02-b11, speaker: narrator, text: 本说完，把铁锹深深插进土里。玛丽已经听得越来越入神。年轻太太去了天堂，那她曾经像疼孩子、疼知更鸟那样疼爱的玫瑰呢？玛丽更想知道那些花后来怎样了。}
        - {id: ch02-b12, speaker: ben_weatherstaff, text: “没人管了，任它们自己长。”}
        - {id: ch02-b13, speaker: mary_lennox, text: “那它们全死了吗？玫瑰没人照料，就一定会死吗？”}
        - {id: ch02-b14, speaker: ben_weatherstaff, text: “我喜欢那些花，也喜欢她，她又那么爱它们。所以一年总有一两回，我会过去剪剪枝，松松根边的土。它们是长野了，可那里的土肥，还有一些活着。”}
        - {id: ch02-b15, speaker: mary_lennox, text: “没有叶子，只剩下灰褐色的干枝时，你怎么知道它还活着？”}
        - {id: ch02-b16, speaker: ben_weatherstaff, text: “等春天找到它们。等阳光照着雨水，雨水又落进阳光里，你自然会知道。”}
        - {id: ch02-b17, speaker: mary_lennox, text: “怎么知道？快告诉我！”}
        - {id: ch02-b18, speaker: ben_weatherstaff, text: “顺着枝条找。要是看见这里那里有褐色的小疙瘩鼓起来，就等一场暖雨，再看看它会变成什么。可你怎么突然这么关心玫瑰了？”}
        - {id: ch02-b19, speaker: narrator, text: 本突然停住，盯着玛丽急切的脸。玛丽脸红了，几乎不敢回答。}
        - {id: ch02-b20, speaker: mary_lennox, text: “我只是想假装自己有一座花园。我没有事情可做。我什么也没有，一个人也没有。”}
        - {id: ch02-b21, speaker: ben_weatherstaff, text: “这倒是真的。你确实没有。”}
        - {id: ch02-b22, speaker: narrator, text: 他的口气很古怪，玛丽猜不出他是不是真的有一点可怜她。她自己却从没觉得自己可怜。从前，她只觉得疲倦，只会发脾气，因为身边的人和事都让她讨厌。如今，世界似乎正在改变，一天天变得更可爱了。只要没有人发现秘密花园，她就能永远在那里找乐子，永远快活下去。}
        - {id: ch02-b23, speaker: narrator, text: 她又陪本待了十来分钟，只要胆子允许，就尽量多问几个问题。本每一问都答，还是那副从鼻子里哼出来的古怪腔调，却没有真发火，也没扛起铁锹离开。玛丽正要走，他又说起玫瑰，她便想到了那片他曾经喜欢、也曾偷偷照料过的花。}
        - {id: ch02-b24, speaker: mary_lennox, text: “你现在还去看它们吗？”}
        - {id: ch02-b25, speaker: ben_weatherstaff, text: “今年没去。风湿病犯了，关节僵得动不了。”}
        - {id: ch02-b26, speaker: narrator, text: 他说着说着，忽然又发起火来。玛丽不知道自己哪里惹恼了他。}
        - {id: ch02-b27, speaker: ben_weatherstaff, text: “听着，别没完没了地问。爱问问题的丫头里，你是我见过最厉害的一个。快走，自己玩去。今天我不再说了。”, emotion: angry}
        - {id: ch02-b28, speaker: narrator, text: 他凶成这样，再留下来也没有用。玛丽沿着花园外的小路慢慢跳远，心里却在想：又有一个人脾气这么坏，她偏偏还是喜欢。没错，她喜欢老本，总想叫他多说几句话。她甚至开始相信，天底下关于花的事情，本全都知道。}
    - id: ch03
      title: 树林里的男孩
      blocks:
        - {id: ch03-b01, speaker: narrator, text: 月桂树篱围成一条弯弯的小路，绕过秘密花园，尽头有一扇小门，门外便是庄园的树林。玛丽想沿着小路一路跳过去，再探头看看林子里有没有兔子蹦来蹦去。如今她很喜欢跳绳。走到小门边，她忽然听见一阵低低的怪哨声。她想弄清那究竟是什么，便推开门，走进树林。}
        - {id: ch03-b02, speaker: narrator, text: 眼前的景象让她屏住了呼吸。一个十二岁上下的男孩靠着树干坐在地上，吹一支粗糙的木笛。他身上很干净，鼻尖向上翘，双颊红得像罂粟花。玛丽从没见过哪个男孩有这样又圆又蓝的眼睛。}
        - {id: ch03-b03, speaker: narrator, text: 男孩身后的树干上，一只棕色松鼠攀在那里，一动不动地看他。附近的灌木后，一只雄雉小心翼翼地伸长脖子，悄悄探出头。两只兔子就在他身旁直起身子，颤着鼻尖嗅来嗅去。松鼠、雉鸡和兔子似乎都在一点点往他身边凑，既要看着这个男孩，也要听木笛传出的那种古怪、低柔的小小呼唤。}
        - {id: ch03-b04, speaker: narrator, text: 男孩发现玛丽，立刻举起手。他开口时，声音跟笛声一样低。}
        - {id: ch03-b05, speaker: dickon, text: “别动，会把它们吓跑的。”}
        - {id: ch03-b06, speaker: narrator, text: 玛丽果然站在原地，一动也不动。男孩停下木笛，开始从地上起身。他动得那么慢，那么轻，几乎看不出身子在动。等他终于站直，松鼠才蹿回头顶的树枝，雄雉也把脖子和脑袋缩回灌木后。两只兔子伏下四脚，开始慢慢往远处蹦。它们虽然离开，却一点都不像受了惊。}
        - {id: ch03-b07, speaker: dickon, text: “我是迪肯。我知道你是玛丽小姐。”}
        - {id: ch03-b08, speaker: narrator, text: 玛丽这才发觉，自己第一眼就知道他是迪肯。这个答案仿佛根本不用人告诉她。除了他，还有谁能像印度人用笛声迷住蛇那样，用一支粗木笛迷住树林里的兔子和雉鸡？他的嘴很宽，鲜红鲜红的，嘴角向上弯着。一笑起来，那笑意一下子铺满整张脸。}
        - {id: ch03-b09, speaker: dickon, text: “我得慢慢站。动作一快，它们就会受惊。野东西在旁边，人就该轻轻地动，低低地说话。”}
        - {id: ch03-b10, speaker: narrator, text: 迪肯说话不像初次见她，倒像早就认识她。玛丽不了解男孩，心里害羞，口气便有些生硬。}
        - {id: ch03-b11, speaker: mary_lennox, text: “你收到玛莎的信了吗？”}
        - {id: ch03-b12, speaker: narrator, text: 迪肯点点那颗铁锈红的鬈发脑袋。}
        - {id: ch03-b13, speaker: dickon, text: “我就是为了那封信来的。工具都带来了，有小铲子、小耙子、小叉子、锄头，还有一把移植铲。样样都结实得很！买种子时，店里的女人又白送了一包白罂粟和一包蓝飞燕草。”}
        - {id: ch03-b14, speaker: mary_lennox, text: “让我看看种子，好吗？”}
        - {id: ch03-b15, speaker: narrator, text: 玛丽真希望自己也能像他那样说得又快又自在。听他的口气，仿佛已经喜欢她，根本不担心她会不喜欢自己。可他不过是个普通的荒原男孩，衣服打着补丁，脸长得有趣，粗乱的头发像铁锈一样红。玛丽走近以后，却从他身上闻到石南、青草和树叶的清新气息，仿佛他就是用这些东西做成的。她很喜欢这气味，再望望他的红脸蛋和圆蓝眼睛，便把刚才的害羞全忘了。}
        - {id: ch03-b16, speaker: mary_lennox, text: “我们坐在这根木头上，一起看吧。”}
        - {id: ch03-b17, speaker: narrator, text: 两个人并排坐在木头上。迪肯从外套口袋里掏出一个棕色纸包。外面包得笨手笨脚，还用细绳捆着。等他解开绳子，里面竟装着数不清的精巧小纸包，每一包正面都印着一种花的图画。}
        - {id: ch03-b18, speaker: dickon, text: “木犀草和罂粟有好多。木犀草是最香的，随手撒到哪里都能长，罂粟也是。只要吹声口哨，就肯钻出来开花，这样的花最讨人喜欢。”}
        - {id: ch03-b19, speaker: narrator, text: 他说到一半，猛地转过头，罂粟般的红脸一下亮了。}
        - {id: ch03-b20, speaker: dickon, text: “那只叫我们的知更鸟在哪儿？”}
        - {id: ch03-b21, speaker: narrator, text: 啾啾声从茂密的冬青里传来，鲜红的果实正在枝头发亮。玛丽觉得自己认识这声音。}
        - {id: ch03-b22, speaker: mary_lennox, text: “它真是在叫我们？”}
        - {id: ch03-b23, speaker: dickon, text: “当然。它在叫自己的朋友。那是在说：‘我在这里，快看我，我想聊一会儿。’它就在灌木里。它是谁的鸟？”}
        - {id: ch03-b24, speaker: mary_lennox, text: “它是本·韦瑟斯塔夫的。不过我想，它也有一点认得我。”}
        - {id: ch03-b25, speaker: dickon, text: “它认得你，也喜欢你，已经把你当成自己人了。待会儿，它会把你的事全告诉我。”}
        - {id: ch03-b26, speaker: narrator, text: 迪肯又用刚才那种几乎看不出在移动的缓慢动作，一点点靠近冬青。他站在那里，嘴里发出一阵声音，几乎和知更鸟本身的啾啾声一模一样。鸟儿聚精会神地听了几秒，随后也叫起来，活像真的听懂了问题，正在认真回答。迪肯听完，轻轻笑了。}
        - {id: ch03-b27, speaker: dickon, text: “它说，它是你的朋友。”}
        - {id: ch03-b28, speaker: mary_lennox, text: “你真这么想？它真的喜欢我吗？”}
        - {id: ch03-b29, speaker: dickon, text: “不喜欢的话，它才不会靠近。鸟儿挑朋友可挑剔了。知更鸟要是瞧不上谁，摆起脸色来比人还厉害。你看，它正在讨你的喜欢呢。它在说：‘你看不见我这个小伙子吗？’”}
        - {id: ch03-b30, speaker: narrator, text: 知更鸟侧着身子，在枝头蹦跳、歪头、啾啾低鸣。看起来，迪肯的话实在像真的。}
        - {id: ch03-b31, speaker: mary_lennox, text: “所有鸟儿的话，你都听得懂吗？”}
        - {id: ch03-b32, speaker: narrator, text: 迪肯咧开嘴笑，最后仿佛整张脸只剩下那张鲜红的弯嘴。他揉了揉粗乱的头发。}
        - {id: ch03-b33, speaker: dickon, text: “我想我懂，它们也觉得我懂。我跟它们一起住在荒原上太久了。我看着它们啄开蛋壳，长出羽毛，学会飞，再学会唱。看得久了，就觉得自己也是它们中的一个。有时我想，也许我是鸟，是狐狸、兔子、松鼠，甚至是一只甲虫，只不过自己不知道。”}
    - id: ch04
      title: 我偷了一座花园
      blocks:
        - {id: ch04-b01, speaker: narrator, text: 迪肯笑着回到木头旁，又拿起那些花种。他告诉玛丽，每一种长大开花以后是什么颜色，是什么模样，又一样一样教她怎么把种子埋进土里，怎么守着幼苗，怎么给它们施肥浇水。讲到一半，他忽然停下来，转过身，正眼看着她。}
        - {id: ch04-b02, speaker: dickon, text: “我亲手替你种吧。你的花园在哪儿？”}
        - {id: ch04-b03, speaker: narrator, text: 玛丽把放在膝头的一双瘦手紧紧绞在一起。她完全不知道该说什么，足足沉默了一分钟。她从没想到，迪肯会突然问出这个问题。秘密要不要告诉他？她心里难受极了，觉得自己的脸先是一阵发红，接着又变得惨白。}
        - {id: ch04-b04, speaker: dickon, text: “你不是有一小块花园吗？他们不肯分给你？你还没有自己的花园？”}
        - {id: ch04-b05, speaker: narrator, text: 迪肯看见她变了脸色，也越来越困惑。玛丽把双手绞得更紧，终于抬眼看他。}
        - {id: ch04-b06, speaker: mary_lennox, text: “我一点也不了解男孩。要是我告诉你一个秘密，你能守住吗？那是个天大的秘密。要是别人发现了，我根本不知道怎么办。我想，我会死的！”}
        - {id: ch04-b07, speaker: narrator, text: 最后一句，她说得凶巴巴的。迪肯更不明白了，又揉了揉粗乱的头发，可回答得还是很和气。}
        - {id: ch04-b08, speaker: dickon, text: “我一直替人守秘密。狐狸幼崽在哪儿，鸟窝在哪儿，野东西的洞又在哪儿，这些事要是瞒不住别的男孩，荒原上就没有什么能平安了。放心，我守得住。”}
        - {id: ch04-b09, speaker: narrator, text: 玛丽原本没想抓住他的衣袖，可一伸手，还是抓住了。}
        - {id: ch04-b10, speaker: mary_lennox, text: “我偷了一座花园。它不是我的，也不属于任何人。谁也不要它，谁也不关心它，从来没人进去。也许里面的一切都死了，我不知道。”}
        - {id: ch04-b11, speaker: narrator, text: 她浑身发热，一辈子从没像此刻这样倔强别扭。}
        - {id: ch04-b12, speaker: mary_lennox, text: “我不管，我不管！我关心它，那些人却不关心，他们就没有权利夺走它。他们把它孤零零地锁住，任它死掉。”, emotion: angry}
        - {id: ch04-b13, speaker: narrator, text: 说完，她用双臂蒙住脸，忽然放声大哭。可怜的玛丽小姐。迪肯那双好奇的蓝眼睛越睁越圆。他把一声“嗳”拖得长长的，里面既有惊奇，也有同情。}
        - {id: ch04-b14, speaker: mary_lennox, text: “我没有事情可做，什么东西都不属于我。是我自己找到花园，也是我自己进去的。我不过和那只知更鸟一样。他们总不会把花园从知更鸟手里夺走。”, emotion: sad}
        - {id: ch04-b15, speaker: dickon, text: “那座花园在哪儿？”}
        - {id: ch04-b16, speaker: narrator, text: 迪肯把声音压得很低。玛丽立刻从木头上站起来。她知道自己又在闹别扭，又犯起了倔脾气，可她一点也不在乎。此刻，她既像个在印度长大的小姐那样颐指气使，又浑身发热，满心悲伤。}
        - {id: ch04-b17, speaker: mary_lennox, text: “跟我来，我带你去看。”}
        - {id: ch04-b18, speaker: narrator, text: 她领迪肯绕过弯曲的月桂小径，来到常春藤长得最浓密的那条路。迪肯默默跟在后面，脸上的神情很古怪，几乎是在怜惜她。在他心里，这座花园仿佛不是一片普通的地方，而是一个从没让人发现过的奇异鸟巢。既然有人要带他去看这样的秘密，他走路时就非得轻手轻脚不可。}
        - {id: ch04-b19, speaker: narrator, text: 玛丽径直走到墙边，伸手掀起一大片垂下的常春藤，迪肯看见后猛地吃了一惊。浓密的叶子下面，竟然真的藏着一扇门。玛丽慢慢推开它，两个人一同跨过门槛，走进花园。等迪肯也进来，她才站定，带着那股倔强又骄傲的劲儿，挑衅似的朝四周一挥手。}
        - {id: ch04-b20, speaker: mary_lennox, text: “就是这里。你现在看见了。这是一座秘密花园，世上只有我一个人关心它，也只有我一个人盼着它重新活起来。”}
        - {id: ch04-b21, speaker: narrator, text: 迪肯一遍又一遍地环顾四周，怎么看也看不够。}
        - {id: ch04-b22, speaker: dickon, text: “嗳，这地方真古怪，也真美！站在这里，就像进了梦一样。”}
