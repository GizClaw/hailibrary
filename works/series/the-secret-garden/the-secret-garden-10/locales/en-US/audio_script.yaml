audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    ben_weatherstaff:
      display_name: Ben Weatherstaff
      tts:
        delivery: gruff, plainspoken, and dryly expressive in Yorkshire character
        timbre: rough and earthy
        pace: unhurried
        pitch: low
    dickon:
      display_name: Dickon Sowerby
      tts:
        delivery: gentle, openhearted, and easy in Yorkshire character
        timbre: fresh and warm
        pace: relaxed
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Garden Wakes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            For nearly a week, sunshine poured into the secret garden. That was the name Mary always used for it in her thoughts. She loved the sound of it. Even more, she loved knowing that once the beautiful old walls closed around her, no one in the world knew where she was. It felt like a hidden place in a fairy story. Mary had read about secret gardens where people slept for a hundred years, though she thought sleeping there would be rather stupid. She meant to stay awake.
        - id: ch01-b02
          speaker: narrator
          text: >-
            In fact, Mary grew more awake with every day at Misselthwaite. She was beginning to enjoy being outdoors. The wind no longer bothered her. Now she liked the feel of it. She could run farther and faster, and she could skip all the way to one hundred. Down under the soil, the bulbs must have been astonished by her work. She cleared neat spaces around them until they had all the room they needed to breathe. If Mary could have seen them, she might have thought they were cheering up and working tremendously in the dark earth. Sun warmed them, and rain could reach them at once. They began to feel very much alive.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Mary was an odd, determined child. Now that she had something interesting to be determined about, she gave herself to it completely. She dug steadily and pulled weeds for hours. Instead of tiring, she grew more pleased with every bit of work. It felt like a wonderful kind of play. She found far more pale green shoots than she had ever hoped for. They seemed to be starting up everywhere. Each day she discovered tiny new ones, including some so small that they barely peeped above the earth.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Martha had spoken of snowdrops growing by the thousands, and of old bulbs spreading underground and making new ones. These bulbs had been left entirely to themselves for ten years. Perhaps they had multiplied into thousands, too. Mary wondered how much longer she would have to wait before the green points revealed what flowers they were. Sometimes she stopped in the middle of digging, looked across the quiet garden, and tried to imagine every bed and border covered with thousands of lovely things in bloom.
    - id: ch02
      title: Ben and the Robin
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            During that sunny week, Mary also got to know Ben Weatherstaff better. More than once, he looked up and found her suddenly beside him, almost as if she had sprung straight out of the ground. Mary always approached without a sound because she feared he might take his tools and leave if he saw her coming. But he no longer minded her as much as he once had. Perhaps he was secretly flattered that she so plainly wanted the company of an old man. Mary had become more polite, too. Ben didn't know that when she first met him, she had spoken to him exactly as she spoke to a native servant in India. Mary hadn't understood that a sturdy, cross old Yorkshireman was not accustomed to bowing to his masters and waiting to be commanded.
        - id: ch02-b02
          speaker: ben_weatherstaff
          text: >-
            Tha'rt like that robin. I never know when tha'll appear or which way tha'll come from.
        - id: ch02-b03
          speaker: mary
          text: He's my friend now.
        - id: ch02-b04
          speaker: ben_weatherstaff
          text: >-
            Aye, that's his way. He makes friends with women just so he can show off and flirt those tail feathers. He'll do anything to be admired. That bird's as full of pride as an egg is full of meat.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Ben rarely said much. Some days he answered Mary's questions with nothing but a grunt. That morning, though, he stood up, planted one heavy boot on his spade, and looked her over.
        - id: ch02-b06
          speaker: ben_weatherstaff
          text: How long has tha' been here?
        - id: ch02-b07
          speaker: mary
          text: About a month, I think.
        - id: ch02-b08
          speaker: ben_weatherstaff
          text: >-
            Well, tha's starting to do Misselthwaite some credit. Tha's a little fatter, and not so yellow. When tha' first came into this garden, tha' looked like a young plucked crow. I thought I'd never seen such an ugly, sour-faced child.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Mary wasn't vain. She had never thought much about her looks, so Ben's words hardly troubled her.
        - id: ch02-b10
          speaker: mary
          text: >-
            I know I'm fatter. My stockings are tight now. They used to wrinkle. Look, Ben Weatherstaff. There's the robin.
        - id: ch02-b11
          speaker: narrator
          text: >-
            The robin looked handsomer than ever. His red breast shone like satin. He flicked his wings and tail, cocked his head from side to side, and hopped about with every lively grace he knew. He plainly meant to make Ben Weatherstaff admire him. Ben did admire him, though he hid it by teasing the bird instead.
        - id: ch02-b12
          speaker: ben_weatherstaff
          text: >-
            Aye, there tha' art! Tha'll put up with me when no one better is around. Tha's spent two weeks brightening that red waistcoat and polishing thy feathers. I know what tha's doing. Tha's courting some bold young lady bird, telling her tha's the finest robin on Missel Moor and can fight every other one.
        - id: ch02-b13
          speaker: mary
          text: Oh, look at him!
          emotion: surprised
        - id: ch02-b14
          speaker: narrator
          text: >-
            The robin was in a bold, charming mood. He hopped nearer and nearer, looking at Ben more winningly each time. Then he flew onto the nearest currant bush, tilted his head just so, and sang a little song straight at the old gardener.
        - id: ch02-b15
          speaker: ben_weatherstaff
          text: >-
            Tha' thinks that song will win me over. Tha' thinks nobody can resist thee. That's what tha' thinks.
        - id: ch02-b16
          speaker: narrator
          text: >-
            Then the robin spread his wings, and Mary could hardly believe what she saw. He flew right to the handle of Ben's spade and settled on top. Ben's wrinkled face slowly changed. He stood perfectly still, almost afraid to breathe. He wouldn't have moved for anything in the world if it meant frightening his robin away. When he spoke, it was barely a whisper.
        - id: ch02-b17
          speaker: ben_weatherstaff
          text: >-
            Well, I'm danged. Tha' surely knows how to get at a fellow. Tha's almost unearthly, knowing so much.
          emotion: surprised
        - id: ch02-b18
          speaker: narrator
          text: >-
            Ben stayed still, scarcely drawing breath, until the robin flicked his wings and flew off. Afterward, he stared at the spade handle as though some magic might have been left there. Then he began digging again and said nothing for several minutes. But every so often, a slow grin crossed his face. Seeing that grin, Mary decided it was safe to speak to him.
    - id: ch03
      title: What Ben Knows About Roses
      blocks:
        - id: ch03-b01
          speaker: mary
          text: Do you have a garden of your own?
        - id: ch03-b02
          speaker: ben_weatherstaff
          text: No. I'm a bachelor, and I lodge with Martin at the gate.
        - id: ch03-b03
          speaker: mary
          text: If you did have one, what would you grow?
        - id: ch03-b04
          speaker: ben_weatherstaff
          text: Cabbages, potatoes, and onions.
        - id: ch03-b05
          speaker: mary
          text: But what if you wanted a flower garden? What would you put in it?
        - id: ch03-b06
          speaker: ben_weatherstaff
          text: Bulbs and sweet-smelling plants. Mostly roses.
        - id: ch03-b07
          speaker: narrator
          text: Mary's face brightened.
        - id: ch03-b08
          speaker: mary
          text: You like roses?
        - id: ch03-b09
          speaker: narrator
          text: Ben took his time. He pulled up a weed and tossed it aside before he answered her.
        - id: ch03-b10
          speaker: ben_weatherstaff
          text: >-
            Aye, I do. A young lady I once gardened for taught me to like them. She kept many roses in a place she loved, and she cared for them as if they were children. Or robins. I saw her bend down and kiss them sometimes. That was ten years ago.
        - id: ch03-b11
          speaker: narrator
          text: He tore out another weed and scowled at it.
        - id: ch03-b12
          speaker: mary
          text: Where is she now?
        - id: ch03-b13
          speaker: ben_weatherstaff
          text: In heaven, if the parson is right.
        - id: ch03-b14
          speaker: narrator
          text: He drove his spade deep into the earth.
        - id: ch03-b15
          speaker: mary
          text: And what became of her roses?
        - id: ch03-b16
          speaker: ben_weatherstaff
          text: They were left on their own.
        - id: ch03-b17
          speaker: mary
          text: Did they all die? Will roses die if nobody tends them?
        - id: ch03-b18
          speaker: ben_weatherstaff
          text: >-
            Well, I'd come to care for the roses, and for her, and she cared for them. Once or twice each year, I went back. I'd prune them and dig around their roots. They grew wild, but the soil was rich, so some stayed alive.
        - id: ch03-b19
          speaker: mary
          text: >-
            When there aren't any leaves, and the branches look gray and brown and dry, how do you know if they're alive?
        - id: ch03-b20
          speaker: ben_weatherstaff
          text: >-
            Wait for spring to reach them. Wait until the sun shines on the rain and the rain falls through the sunshine. Then tha'll know.
        - id: ch03-b21
          speaker: mary
          text: But how? How will I know?
        - id: ch03-b22
          speaker: ben_weatherstaff
          text: >-
            Look closely along the branches. If tha' sees little brown lumps beginning to swell, watch them after a warm rain. Tha'll soon see what happens. But why does tha' suddenly care so much about roses and growing things?
        - id: ch03-b23
          speaker: narrator
          text: >-
            Ben stopped short and studied the eagerness in her face. Mary felt herself turning red under his curious look. She had to answer carefully, and she was almost afraid to answer at all.
        - id: ch03-b24
          speaker: mary
          text: >-
            I... I want to pretend I have a garden of my own. There's nothing for me to do. I have nothing. And no one.
        - id: ch03-b25
          speaker: ben_weatherstaff
          text: Well, that's true. Tha' hasn't.
        - id: ch03-b26
          speaker: narrator
          text: >-
            He said it so strangely that Mary wondered if he felt a little sorry for her. She had never pitied herself before. In India, she had only felt tired and cross because she disliked people and things so much. Now the world itself seemed to be changing and growing nicer. If no one found out about the secret garden, she thought she could go on enjoying herself there always.
        - id: ch03-b27
          speaker: narrator
          text: >-
            Mary stayed another ten or fifteen minutes, asking every question she dared. Ben answered them all in his grunting way. He didn't seem truly cross, and he didn't pick up his spade and leave. As Mary was about to go, something he said about roses reminded her of the ones he had cared for.
        - id: ch03-b28
          speaker: mary
          text: Do you still visit those other roses?
        - id: ch03-b29
          speaker: ben_weatherstaff
          text: Not this year. My rheumatism has left my joints too stiff.
        - id: ch03-b30
          speaker: narrator
          text: >-
            He spoke in his usual grumble. Then, for no reason Mary could understand, he suddenly sounded angry.
        - id: ch03-b31
          speaker: ben_weatherstaff
          text: >-
            Now listen here! Stop asking so many questions. Tha' asks more than any girl I've ever met. Go on and play. I'm finished talking today.
          emotion: angry
        - id: ch03-b32
          speaker: narrator
          text: >-
            He was so cross that Mary knew there was no use staying another minute. She skipped slowly along the outer path, turning him over in her thoughts. It was strange, but she liked old Ben Weatherstaff in spite of his temper. Yes, she truly did. Whenever she found him, she wanted to coax him into talking to her. And she was beginning to believe he knew everything in the world about flowers.
    - id: ch04
      title: The Boy Under the Tree
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            A path bordered by laurel hedges curved around the secret garden. At its end stood a gate into one of the park woods. Mary decided to skip all the way around the path, then look among the trees to see if any rabbits were hopping there. She was enjoying the skipping very much when she reached the little gate. Then she heard a low, unusual whistle. She opened the gate and went through because she had to find out what made that sound.
        - id: ch04-b02
          speaker: narrator
          text: >-
            What she saw was so strange that it made her catch her breath. A boy of about twelve sat beneath a tree with his back against the trunk, playing a rough wooden pipe. He was a funny-looking boy, very clean, with an upturned nose, cheeks as red as poppies, and the roundest blue eyes Mary had ever seen in a boy's face. A brown squirrel clung to the tree trunk above him and watched. A cock pheasant delicately stretched its neck from behind a nearby bush. Two rabbits sat close by with their bodies upright and their noses trembling. All of them seemed to be drawing nearer to watch the boy and listen to the strange, soft call of his pipe.
        - id: ch04-b03
          speaker: narrator
          text: When the boy saw Mary, he raised one hand. His voice was almost as low as the sound of his pipe.
        - id: ch04-b04
          speaker: dickon
          text: Don't tha' move. Tha'll frighten them.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Mary stood perfectly still. The boy stopped playing and began to rise. He moved so slowly that he hardly seemed to move at all. Once he was standing, the squirrel ran back into the branches. The pheasant drew in its head, and the rabbits dropped to all fours and hopped away. Even then, they didn't seem frightened.
        - id: ch04-b06
          speaker: dickon
          text: I'm Dickon. I know tha'rt Miss Mary.
        - id: ch04-b07
          speaker: narrator
          text: >-
            At that moment, Mary realized she had known he must be Dickon from the instant she saw him. Who else could sit under a tree and charm rabbits and pheasants the way people in India charmed snakes? His broad red mouth curved upward, and the smile spread over his whole funny face.
        - id: ch04-b08
          speaker: dickon
          text: >-
            I stood up slowly because quick movements startle them. When wild creatures are near, a person has to move gently and keep his voice low.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Dickon spoke as if they already knew each other well. Mary knew nothing about boys. Feeling shy, she answered more stiffly than she meant to.
        - id: ch04-b10
          speaker: mary
          text: Did Martha's letter reach you?
        - id: ch04-b11
          speaker: narrator
          text: Dickon nodded his curly, rust-colored head.
        - id: ch04-b12
          speaker: dickon
          text: Aye. That's why I came.
        - id: ch04-b13
          speaker: narrator
          text: He bent down and picked up something that had been lying beside him while he played.
        - id: ch04-b14
          speaker: dickon
          text: >-
            I've brought the garden tools. There's a little spade, a rake, a fork, and a hoe. Eh, they're good ones. There's a trowel, too. When I bought the seeds, the shopwoman gave me a packet of white poppies and one of blue larkspur for nothing.
        - id: ch04-b15
          speaker: mary
          text: Will you show me the seeds?
        - id: ch04-b16
          speaker: narrator
          text: >-
            Mary wished she could speak as quickly and easily as Dickon did. His voice made it sound as though he already liked her and never once wondered whether she would like him. He was only a common moor boy in patched clothes, with a funny face and a rough head of rusty-red hair. Yet as Mary stepped closer, she noticed a clean, fresh smell of heather, grass, and leaves around him, almost as if he had been made from them. She liked it very much. When she looked into his round blue eyes and cheerful, red-cheeked face, she forgot that she had ever felt shy.
        - id: ch04-b17
          speaker: mary
          text: Let's sit on that log and look at them.
    - id: ch05
      title: The Great Secret
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            They sat down together on the log. Dickon reached into his coat and pulled out a clumsy little package wrapped in brown paper. He untied its string. Inside were ever so many smaller, neater packets, and every packet had a picture of a flower on it.
        - id: ch05-b02
          speaker: dickon
          text: >-
            There's plenty of mignonette and poppies. Nothing smells sweeter than mignonette, and it'll grow almost anywhere tha' scatters it. Poppies will, too. The best flowers are the ones that'll come up and bloom if tha' only whistles to them.
        - id: ch05-b03
          speaker: narrator
          text: Dickon stopped. He turned his head quickly, and his whole face lit up.
        - id: ch05-b04
          speaker: dickon
          text: Where's that robin who's calling us?
        - id: ch05-b05
          speaker: narrator
          text: >-
            A chirp sounded from a thick holly bush covered in scarlet berries. Mary thought she knew that voice.
        - id: ch05-b06
          speaker: mary
          text: Is he truly calling us?
        - id: ch05-b07
          speaker: dickon
          text: >-
            Aye. He's calling someone he knows. He's saying, "Here I am. Look at me. I want a little talk." There he is in the bush. Who does he belong to?
        - id: ch05-b08
          speaker: mary
          text: Ben Weatherstaff says the robin is his, but I think he knows me a little.
        - id: ch05-b09
          speaker: dickon
          text: >-
            Aye, he knows thee. He likes thee, too. He's accepted thee. In a minute, he'll tell me everything about thee.
        - id: ch05-b10
          speaker: narrator
          text: >-
            Dickon moved close to the holly bush with the same slow care Mary had noticed before. Then he made a sound almost exactly like the robin's own twitter. The bird listened closely for several seconds. At last, he twittered back, quite as if he were answering a question Dickon had asked.
        - id: ch05-b11
          speaker: dickon
          text: Aye, he says tha'rt his friend.
          emotion: happy
        - id: ch05-b12
          speaker: mary
          text: Do you really think so? Do you truly think he likes me?
        - id: ch05-b13
          speaker: dickon
          text: >-
            He wouldn't come near thee if he didn't. Birds choose their friends carefully, and a robin can snub a person worse than any man. Look, he's trying to catch thy eye now. He's saying, "Can't tha' see me?"
        - id: ch05-b14
          speaker: narrator
          text: >-
            The robin did seem to be saying just that as he edged along the branch, twittered, and tilted his head.
        - id: ch05-b15
          speaker: mary
          text: Can you understand everything birds say?
        - id: ch05-b16
          speaker: narrator
          text: Dickon's grin widened until his face seemed to be all one broad, curving mouth. He rubbed his rough hair.
        - id: ch05-b17
          speaker: dickon
          text: >-
            I think I understand them, and they seem to think so, too. I've lived with them on the moor for so long. I've watched them break out of their shells, grow feathers, learn to fly, and begin to sing. Sometimes I believe I might be a bird, or a fox, or a rabbit, or a squirrel, or even a beetle, without knowing it.
        - id: ch05-b18
          speaker: narrator
          text: >-
            Dickon laughed and came back to the log. He began talking about the flower seeds again. He described what each kind would look like when it bloomed. Then he explained how Mary should plant the seeds, how she should watch them, and how to feed and water them as they grew. All at once, he stopped and turned to look straight at her.
        - id: ch05-b19
          speaker: dickon
          text: I'll plant them for thee myself. Where is thy garden?
        - id: ch05-b20
          speaker: narrator
          text: >-
            Mary's thin hands gripped each other where they rested in her lap. She didn't know what to say. Until that moment, she had never imagined Dickon would ask where her garden was. For a whole minute she couldn't answer him. She felt miserable, and the color seemed to rush into her face and then drain away.
        - id: ch05-b21
          speaker: dickon
          text: Tha' does have a little garden, doesn't tha'?
        - id: ch05-b22
          speaker: narrator
          text: >-
            Dickon had seen the color rush into Mary's face and then leave it. When she still said nothing, his puzzled look deepened. He couldn't understand why such a simple question troubled her.
        - id: ch05-b23
          speaker: dickon
          text: Wouldn't they give thee a patch? Hasn't tha' got one yet?
        - id: ch05-b24
          speaker: narrator
          text: Mary held her hands even tighter and looked at him.
        - id: ch05-b25
          speaker: mary
          text: >-
            I don't know anything about boys. If I told you something, could you keep it secret? It's a very great secret. If anyone found out, I don't know what I'd do. I think I would die!
          emotion: fearful
        - id: ch05-b26
          speaker: narrator
          text: >-
            She said the last words fiercely. Dickon's curious blue eyes grew more puzzled than ever, and once again he rubbed a hand over his rough head. Still, his answer was perfectly good-natured.
        - id: ch05-b27
          speaker: dickon
          text: >-
            I keep secrets every day. If I told the other boys where the fox cubs live, or where birds nest, or where wild creatures hide, nothing on the moor would be safe. Aye, I know how to keep a secret.
        - id: ch05-b28
          speaker: narrator
          text: >-
            Mary hadn't meant to reach out and clutch his sleeve, but she did.
        - id: ch05-b29
          speaker: mary
          text: >-
            I've stolen a garden. It isn't mine, but it doesn't belong to anybody else, either. Nobody wants it. Nobody cares what happens to it. No one ever goes there. Maybe everything inside is already dead. I don't know.
        - id: ch05-b30
          speaker: narrator
          text: Mary felt herself growing hot. She became as contrary and stubborn as she had ever been in her life.
        - id: ch05-b31
          speaker: mary
          text: >-
            I don't care! I don't care! They have no right to take it away when I care about it and they don't. They've shut it up alone and they're letting it die.
          emotion: angry
        - id: ch05-b32
          speaker: narrator
          text: >-
            At the end, Mary threw both arms over her face and burst into tears. Poor little Mistress Mary had never meant to cry. Dickon's curious blue eyes opened wider and wider as he watched her.
        - id: ch05-b33
          speaker: dickon
          text: Eh-h-h!
          emotion: surprised
        - id: ch05-b34
          speaker: narrator
          text: The long, soft sound held both wonder and sympathy.
        - id: ch05-b35
          speaker: mary
          text: >-
            I have nothing to do, and nothing belongs to me. I found the garden myself. I found my own way inside. I was just like the robin, and they wouldn't take it away from him.
          emotion: sad
        - id: ch05-b36
          speaker: dickon
          text: Where is it?
        - id: ch05-b37
          speaker: narrator
          text: >-
            Dickon's voice dropped almost to a whisper. Mary rose from the log at once. She felt contrary, stubborn, and defiant again, and she no longer cared what happened. She was as imperious as she had been in India, yet hot and sorrowful at the same time.
        - id: ch05-b38
          speaker: mary
          text: Come with me. I'll show you.
        - id: ch05-b39
          speaker: narrator
          text: >-
            Mary led Dickon around the laurel path and onto the walk where the ivy grew thick against the wall. He followed with a strange, almost pitying look. It was as if she were leading him to a rare bird's nest, and he must step softly. When Mary lifted the hanging ivy, Dickon started. A door stood behind it. Mary slowly pushed it open, and they went through together.
        - id: ch05-b40
          speaker: narrator
          text: Once they were both inside, Mary stopped. She stood before Dickon and swept one hand defiantly around the whole garden.
        - id: ch05-b41
          speaker: mary
          text: >-
            This is it. It's a secret garden, and I'm the only person in the world who wants it to live.
        - id: ch05-b42
          speaker: narrator
          text: Dickon looked all around. Then he looked all around once more.
        - id: ch05-b43
          speaker: dickon
          text: >-
            Eh! What a strange, pretty place. It feels as though a person has walked into a dream.
          emotion: surprised
