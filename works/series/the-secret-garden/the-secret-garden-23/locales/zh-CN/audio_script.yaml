audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
    dickon:
      display_name: 迪肯
      tts: {delivery: 质朴自在，带浓重而亲切的约克郡乡音, timbre: 清亮温厚，带荒原少年的蓬勃气息, pace: 轻快从容, pitch: 中高音}
    ben_weatherstaff:
      display_name: 本·韦瑟斯塔夫
      tts: {delivery: 粗声直率，约克郡口音浓重，偶尔透出温柔, timbre: 苍老粗粝, pace: 偏慢, pitch: 低音}
    doctor_craven:
      display_name: 克雷文医生
      tts: {delivery: 谨慎严肃，关切中带着长期忍让的克制, timbre: 成熟而沉稳, pace: 从容, pitch: 中低音}
  chapters:
    - id: ch01
      title: 不再做可怜虫
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 他们回到宅子时，克雷文医生已经等了好一阵子。他甚至开始考虑，是不是该派个人到花园的小径上四处寻找。科林一被送回房间，这位可怜的医生便神情严肃地把他从头到脚仔细看了一遍。
        - id: ch01-b02
          speaker: doctor_craven
          text: “你在外面待得太久了。千万别把自己累坏。”
        - id: ch01-b03
          speaker: colin_craven
          text: “我根本不累。出去一趟，我反而好多了。明天上午和下午我都要出去。”
        - id: ch01-b04
          speaker: doctor_craven
          text: “我恐怕不能答应。一天出去两次，未必合适。”
        - id: ch01-b05
          speaker: colin_craven
          text: “不让我去才不合适。我非去不可。”
        - id: ch01-b06
          speaker: narrator
          text: 科林下命令时像只蛮横的小野兽，自己却毫无察觉。仿佛他一辈子都独自住在荒岛上。既然他是岛上的国王，规矩当然全由他定，也从来没人让他看看正常人是什么样。玛丽从前也和他很像。来到米瑟斯韦特后，她才一点点明白，自己的举止既反常，也不讨人喜欢。她觉得这件事很值得告诉科林。医生离开后，她便坐在那里，好奇地盯了科林好几分钟。她就是想让科林问她为什么，而科林果然开口了。
        - id: ch01-b07
          speaker: colin_craven
          text: “你一直看我干什么？”
        - id: ch01-b08
          speaker: mary_lennox
          text: “我在想，克雷文医生真可怜。”
        - id: ch01-b09
          speaker: colin_craven
          text: “我也这么想。现在我不会死了，他再也继承不了米瑟斯韦特。”
        - id: ch01-b10
          speaker: narrator
          text: 他语气十分平静，神情里却藏着一股掩不住的得意。现在他认定自己不会死了，也就把医生失去继承机会看成了已经确定的事。
        - id: ch01-b11
          speaker: mary_lennox
          text: “这件事也值得替他难过。不过我想的是，他对着一个总没礼貌的男孩，还得客客气气忍十年，肯定烦透了。换成我，绝不会忍你。”
        - id: ch01-b12
          speaker: colin_craven
          text: “我真的很没礼貌吗？”
        - id: ch01-b13
          speaker: mary_lennox
          text: “如果你是他儿子，他又会打孩子，你早就挨打了。”
        - id: ch01-b14
          speaker: colin_craven
          text: “可他不敢打我。”
        - id: ch01-b15
          speaker: mary_lennox
          text: “对，他不敢。从来没人敢做你不喜欢的事，因为大家都说你快死了，还有那些乱七八糟的缘故。那时候你真是个可怜虫。”
        - id: ch01-b16
          speaker: colin_craven
          text: “可我再也不做可怜虫了，也不准别人把我当可怜虫。今天下午，我已经靠两只脚站起来了。”
        - id: ch01-b17
          speaker: mary_lennox
          text: “你一直想怎么样就怎么样，所以才会这么古怪。”
        - id: ch01-b18
          speaker: narrator
          text: 听见玛丽把心里想的话全说了出来，科林转过脸，眉头紧紧皱了起来。
        - id: ch01-b19
          speaker: colin_craven
          text: “我很古怪吗？”
        - id: ch01-b20
          speaker: mary_lennox
          text: “很古怪。不过你不用生气，因为我也古怪，本·韦瑟斯塔夫也古怪。可自从我开始喜欢别人，又找到了花园，我就没以前那么古怪了。”
        - id: ch01-b21
          speaker: colin_craven
          text: “我不想古怪。我以后不会了。”
        - id: ch01-b22
          speaker: narrator
          text: 他像是下了决心，又皱了一下眉。这个男孩极其骄傲。他安安静静地躺着想了一会儿。随后，玛丽看见那熟悉而美丽的笑容从他脸上慢慢绽开，渐渐改变了他的整张脸。
        - id: ch01-b23
          speaker: colin_craven
          text: “只要每天去花园，我就不会再古怪。那里有魔法，是好的魔法。玛丽，我敢肯定。”
        - id: ch01-b24
          speaker: mary_lennox
          text: “我也肯定。”
        - id: ch01-b25
          speaker: colin_craven
          text: “就算那不是真魔法，我们也可以把它当成真的。那里一定有某种东西！”
        - id: ch01-b26
          speaker: mary_lennox
          text: “那就是魔法，但不是黑魔法。它像雪一样白。”
    - id: ch02
      title: 花园醒来了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 从此，他们一直管那东西叫魔法。接下来那几个奇妙、灿烂、叫人惊叹的月份，它看上去也确实像魔法。花园里发生的事太多了。没有花园的人很难想象，有过花园的人却会明白，要把一切讲完，恐怕得用整整一本书。起初，绿色的生命不停从草间、花畦，甚至墙壁的缝隙里冒出来，像是永远不会停止。接着，绿叶间露出花苞。花苞慢慢打开，显出深浅不一的蓝、浓淡不同的紫，还有一层层、一抹抹绯红。花园最快乐的年月里，每一寸地方、每个洞隙和角落都藏着花。本亲眼见过。他还曾刮开砖缝里的灰浆，填进泥土，让可爱的攀缘花木从那里生长。草地上挺起一丛丛鸢尾和白百合。幽绿的小径深处，飞燕草、耧斗菜和风铃草举着蓝白色的花朵，像一支支惊人的大军。
        - id: ch02-b02
          speaker: ben_weatherstaff
          text: “她真喜欢这些花。她说，自个儿最爱这种一直朝蓝天伸的花。她可不是瞧不起地上的东西，她爱这片土地。只不过她总说，蓝天看起来快活得很。”
        - id: ch02-b03
          speaker: narrator
          text: 迪肯和玛丽播下的种子长得飞快，像有仙子一直照管。几十株颜色各异、绸缎般柔亮的罂粟迎风起舞，快活地向那些已经住了多年的老花发起挑战。那些老住户仿佛也很纳闷，不知道这群新来的家伙究竟从哪儿冒了出来。还有玫瑰，那些玫瑰！它们从草里探出，缠绕日晷，抱住树干，再从枝头垂下来。它们爬上墙壁，四处铺开，长长的花环像瀑布一样泻下。一天又一天，一个钟头又一个钟头，它们渐渐醒来。清新秀美的嫩叶间，花苞多得数也数不清。起初，它们小得可怜，后来一点点鼓起，施展着自己的魔法，终于开成一只只盛满芬芳的杯子。香气轻轻漫过杯沿，充满了整座花园。
        - id: ch02-b04
          speaker: narrator
          text: 这些变化，科林全都看在眼里，一点也没错过。每天早上，他都会被送进花园。只要不下雨，白天的每个钟头他都待在那里，连阴沉的天气也喜欢。他躺在草地上，说自己正在“看万物生长”，还断定只要盯得够久，就能亲眼看到花苞脱掉外衣。他也认识了许多忙碌又古怪的小虫。它们来来去去，忙着人类不懂、对它们却显然非常要紧的差事。有的搬一小片稻草、一根羽毛或一点食物，有的爬上一根草叶，把它当成大树。爬到顶上，它们就像能望遍四周，查清这一带的情形。有一次，一只鼹鼠在地道尽头顶起土堆，又用那双带长指甲、像小精灵手掌似的爪子钻出来。科林看得入了迷，整整一个上午都没移开眼睛。蚂蚁、甲虫、蜜蜂、青蛙、鸟和植物各自怎样生活，在他面前打开了一个全新的世界。迪肯把这些奥秘一件件讲给他听，又说起狐狸、水獭、雪貂、松鼠、鳟鱼、水鼠和獾的生活。他们要谈、要琢磨的事情，简直永远没有尽头。
        - id: ch02-b05
          speaker: narrator
          text: 可这还不到魔法的一半。科林毕竟真的用双脚站起来过一次，那件事让他脑子里的念头翻腾不休。玛丽又告诉他，自己当时怎样念过咒语。科林一听就兴奋极了，对这个办法大为赞同，从此总把这件事挂在嘴边。
        - id: ch02-b06
          speaker: colin_craven
          text: “世上当然有很多魔法，只是人们不知道它是什么，也不知道怎么用。也许开头只要不停地说，好事就要发生，说着说着，它就真的发生了。我要做个实验试试看。”
    - id: ch03
      title: 科学实验
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天早晨，他们一进秘密花园，科林马上派人去叫本。本用最快的速度赶来，看见小王公站在树下，神气十足，脸上的笑容却美得出奇。
        - id: ch03-b02
          speaker: colin_craven
          text: “早上好，本·韦瑟斯塔夫。你、迪肯和玛丽小姐站成一排，听我说。我有一件非常重要的事要告诉你们。”
        - id: ch03-b03
          speaker: ben_weatherstaff
          text: “是，是，少爷！”
        - id: ch03-b04
          speaker: narrator
          text: 本抬手碰了碰额头。他藏着一桩多年的有趣往事。小时候，他曾逃去当海员，还真的出过海，所以这声回答颇有水手的样子。
        - id: ch03-b05
          speaker: colin_craven
          text: “我要做一个科学实验。等我长大了，我会有伟大的科学发现。这个实验就是开头。”
        - id: ch03-b06
          speaker: ben_weatherstaff
          text: “是，是，少爷！”
        - id: ch03-b07
          speaker: narrator
          text: 本这辈子头一回听说伟大的科学发现，玛丽也是。不过她已经慢慢明白，科林虽古怪，却读过许多稀奇的事，而且不知怎么，他说起话来总能叫人信服。他仰起头，用那双奇异的眼睛盯着人时，哪怕谁都知道他只有十岁，快满十一岁了，也会忍不住相信他。此刻尤其如此，因为他刚刚尝到了像大人那样发表演说的迷人滋味。
        - id: ch03-b08
          speaker: colin_craven
          text: “我的伟大发现都跟魔法有关。魔法很了不起，除了古书里的少数人，几乎没人懂。玛丽知道一点，因为她生在印度，那里有苦行僧。迪肯肯定也懂，只是他也许不知道自己懂。他能让动物和人着迷。要不是他能让动物着迷，也就是能让男孩着迷，因为男孩也是动物，我根本不会让他来见我。我相信万事万物里都有魔法。只是我们还不够聪明，没法抓住它，让它像电、马和蒸汽一样替我们做事。”
        - id: ch03-b09
          speaker: narrator
          text: 这番话听起来气势非凡。本也跟着激动起来，实在站不住了，索性把身子挺得笔直。
        - id: ch03-b10
          speaker: ben_weatherstaff
          text: “是，是，少爷！”
        - id: ch03-b11
          speaker: colin_craven
          text: “玛丽找到花园时，它看起来已经死了。后来，有一种东西开始把生命从土里往上推，像是能从什么都没有的地方造出东西。头一天还什么也没有，到了第二天，它就出现了。我以前从来不观察这些事，现在它们却让我好奇得很。科学家总是好奇的，我也要研究科学。我一直问自己，那是什么？那到底是什么？它一定是某种东西，不可能什么也不是。我不知道它的名字，所以就管它叫魔法。”
        - id: ch03-b12
          speaker: colin_craven
          text: “我从没看过日出，可玛丽和迪肯看过。听他们描述以后，我相信日出也是魔法。有一种东西把太阳推上天空，又牵着它一路走。有时我待在园里，透过树木抬头看天，心里会突然涌起一种奇怪的快乐。仿佛有什么正在我的胸口推我、拉我，让我一下子呼吸得很快。魔法总在推，在拉，从一无所有里造出万物。叶子、树木、花朵、鸟儿、獾、狐狸、松鼠，还有人，全都是魔法造出来的。所以魔法一定就在我们四周。这座花园里有，所有地方也都有。”
        - id: ch03-b13
          speaker: colin_craven
          text: “园里的魔法让我站起来，也让我知道自己会活到长大。我要做一个科学实验，试着把一些魔法放进身体里，让它推我、拉我，把我变得强壮。我还不知道该怎么做。不过我想，只要一直想着它，不停叫它来，也许它真的会来。这大概是召来魔法最初、最笨的办法。第一次准备站起来时，玛丽一刻不停地对自己说，你能做到，你能做到，后来我果然做到了。当然，我自己也得同时用力，不过她的魔法帮助了我，迪肯的魔法也一样。”
        - id: ch03-b14
          speaker: colin_craven
          text: “以后每天早晚，还有白天里每次想起来，我都要说，魔法就在我身体里，魔法正让我好起来，我会变得和迪肯一样强壮。你们也得说。这就是我的实验。本·韦瑟斯塔夫，你愿意帮忙吗？”
        - id: ch03-b15
          speaker: ben_weatherstaff
          text: “是，是，少爷！当然愿意！”
        - id: ch03-b16
          speaker: colin_craven
          text: “只要每天坚持，像士兵操练那样按时去做，我们就能看到结果，知道实验到底成没成功。一个道理说一遍又一遍，想一遍又一遍，直到它永远留在脑子里，人就把它学会了。我想魔法也是这个道理。只要一直叫它来帮助你，它就会变成你的一部分，留在身体里，替你做事。”
        - id: ch03-b17
          speaker: mary_lennox
          text: “我听一个驻印度的军官对我母亲说过，有些苦行僧会把同一句话念几千遍。”
        - id: ch03-b18
          speaker: ben_weatherstaff
          text: “俺也听杰姆·费特尔沃思的老婆把一句话念过几千遍，说杰姆是个醉鬼畜生。每回还真有事发生。杰姆狠狠揍她一顿，再跑到蓝狮酒馆喝个烂醉。”
        - id: ch03-b19
          speaker: narrator
          text: 科林紧皱眉头，想了几分钟，随后又振作起来。
        - id: ch03-b20
          speaker: colin_craven
          text: “你看，确实有事发生。她用的是坏魔法，所以他才打她。如果她用好魔法，说些好听的，也许他就不去喝得烂醉了。说不定，说不定还会给她买顶新帽子。”
        - id: ch03-b21
          speaker: narrator
          text: 本听完低声笑了起来，那双苍老的小眼睛里闪着精明而满意的赞赏。
        - id: ch03-b22
          speaker: ben_weatherstaff
          text: “科林少爷，你不光两条腿直，脑子也灵。下回见到贝丝·费特尔沃思，俺就点拨她几句，告诉她魔法能干啥。要是这个科——学实验真管用，她准高兴，杰姆也一样。”
        - id: ch03-b23
          speaker: narrator
          text: 迪肯一直站着听完这场演说，圆眼睛里闪着好奇又快乐的光。坚果和贝壳蹲在他肩上。他怀里抱着一只长耳朵的白兔，一遍遍轻轻抚摸它。白兔把耳朵贴在背上，舒服地享受着。科林很想知道迪肯在想什么。每次迪肯望着他，或望着某个动物朋友，露出那种开朗的大笑，科林都忍不住猜。这一回，迪肯也笑了，而且笑得比平常更加灿烂。
        - id: ch03-b24
          speaker: colin_craven
          text: “你觉得这个实验会成功吗？”
        - id: ch03-b25
          speaker: dickon
          text: “俺觉得会。它准会像种子晒到太阳一样起作用。咱们现在就开始，成不成？”
    - id: ch04
      title: 树下的魔法
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 科林和玛丽都高兴极了。画册里苦行僧和信徒的模样浮现在科林脑中，让他兴致更高。他提议大家都去那棵枝叶像华盖的树下，盘腿围成一圈，好像真的要举行一场庄严的仪式。
        - id: ch04-b02
          speaker: colin_craven
          text: “坐在那里就像待在神殿里。我有一点累，想坐下。”
        - id: ch04-b03
          speaker: dickon
          text: “哎呀，你可不能刚开始就说自个儿累。那会把魔法弄坏的。”
        - id: ch04-b04
          speaker: narrator
          text: 科林转过头，直望进迪肯那双天真、圆亮的眼睛。
        - id: ch04-b05
          speaker: colin_craven
          text: “你说得对。我只能想魔法。”
        - id: ch04-b06
          speaker: narrator
          text: 他们围成圆圈坐下，样子既庄严又神秘。本不知怎么觉得，自己像是被带来参加一场祷告会。他平常总坚定地说自己反对祷告会，可这是小王公主持的，他倒不反感。有人请他来帮忙，他甚至觉得很荣幸。玛丽心里满是敬畏，完全陶醉其中。迪肯把白兔抱在怀里，也许还发出了别人听不见的召唤信号。等他像大家一样盘腿坐好，乌鸦、狐狸、松鼠和小羊也慢慢靠近。它们各自找地方安顿下来，仿佛全是自愿来参加的。
        - id: ch04-b07
          speaker: colin_craven
          text: “动物朋友们也来了。它们想帮助我们。”
        - id: ch04-b08
          speaker: narrator
          text: 玛丽觉得科林美极了。他高昂着头，像一位小祭司。奇异的眼睛闪着不可思议的光，阳光穿过头顶的枝叶，落在他身上。
        - id: ch04-b09
          speaker: colin_craven
          text: “现在开始。玛丽，我们要像旋转苦行者那样前后摇吗？”
        - id: ch04-b10
          speaker: ben_weatherstaff
          text: “俺可摇不动，俺有风湿病。”
        - id: ch04-b11
          speaker: colin_craven
          text: “魔法会把风湿病赶走。不过在它赶走以前，我们不摇，只念咒语。”
        - id: ch04-b12
          speaker: ben_weatherstaff
          text: “咒语俺也念不了。俺这辈子只有一次想唱歌，人家就把俺赶出了教堂唱诗班。”
        - id: ch04-b13
          speaker: narrator
          text: 本已有点不耐烦，可谁也没笑。每个人都认真得不得了。科林脸上一点阴影也没有，心里装的全是魔法。
        - id: ch04-b14
          speaker: colin_craven
          text: “那就让我来念。太阳正在照耀，太阳正在照耀，这就是魔法。花朵正在生长，根须正在苏醒，这就是魔法。活着就是魔法，强壮就是魔法。魔法在我身体里，魔法在我身体里。它就在我身体里，也在我们每个人身体里。它还在本·韦瑟斯塔夫的背里。魔法！魔法！快来帮助我们！”
        - id: ch04-b15
          speaker: narrator
          text: 科林像个古怪的少年精灵，把这段话念了许多遍。虽然没有一千遍，也实在念了不少。玛丽听得入迷，觉得眼前的一切又古怪又美，真希望科林一直念下去，永远别停。本听着听着，也渐渐安静下来，落进一个很舒服的梦境。蜜蜂在花间嗡嗡飞，声音和科林的吟诵混在一起，朦朦胧胧地变成了睡意。迪肯盘腿坐着，白兔睡在他臂弯里，他一只手搭在小羊背上。煤灰挤开一只松鼠，紧贴着迪肯的肩头蜷起身子，灰色眼膜垂了下来。最后，科林终于停住了。
        - id: ch04-b16
          speaker: colin_craven
          text: “现在，我要绕花园走一圈。”
        - id: ch04-b17
          speaker: narrator
          text: 本的脑袋刚垂到胸前，一听这话，猛地抬了起来。
        - id: ch04-b18
          speaker: colin_craven
          text: “你刚才睡着了。”
        - id: ch04-b19
          speaker: ben_weatherstaff
          text: “哪有。这篇布道讲得还成，不过募捐以前，俺肯定先走。”
        - id: ch04-b20
          speaker: narrator
          text: 他还没完全醒过来。
        - id: ch04-b21
          speaker: colin_craven
          text: “这里又不是教堂。”
        - id: ch04-b22
          speaker: ben_weatherstaff
          text: “俺当然不在教堂。谁说俺在？你每个字俺都听到了。你说魔法在俺背里，医生倒说那叫风湿病。”
        - id: ch04-b23
          speaker: narrator
          text: 小王公挥了挥手。
        - id: ch04-b24
          speaker: colin_craven
          text: “那是坏魔法。你会好起来的。我准你去干活了，不过明天还得回来。”
        - id: ch04-b25
          speaker: ben_weatherstaff
          text: “俺倒要看看你怎么绕园子走一圈。”
        - id: ch04-b26
          speaker: narrator
          text: 本哼了一声，却没有半点恶意。这个倔老头并不完全相信魔法，心里早就打好了主意。科林要是把他赶走，他就爬上梯子，从墙头往里看。万一科林脚下打晃，他也好马上拖着跛腿赶回来。
    - id: ch05
      title: 第一个发现
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 科林不反对本留下。于是，一支真正的队伍排了起来，看上去还真像那么回事。科林走在最前面，迪肯和玛丽分列左右，本跟在后头，动物朋友们拖成一条长长的尾巴。小羊和狐狸幼崽紧贴着迪肯。白兔一会儿向前蹦，一会儿停下来啃东西。煤灰神情庄严地跟着，仿佛认定自己负有指挥全队的重任。
        - id: ch05-b02
          speaker: narrator
          text: 队伍走得很慢，却十分庄严。每走几码，他们就停下来休息。科林扶着迪肯的手臂，本在后面暗暗盯紧他，一刻也不放松。可科林有时会把手从迪肯的支撑上移开，独自向前走上几步。他始终高昂着头，显得威风极了。
        - id: ch05-b03
          speaker: colin_craven
          text: “魔法就在我身体里！它正在让我变强！我能感觉到，我真的能感觉到！”
        - id: ch05-b04
          speaker: narrator
          text: 仿佛真有一种力量托着他，把他往上提。他在幽径深处的座椅上坐过，也有一两次直接坐到草地上。他在小径中停过好几次，每次都靠着迪肯休息一会儿。可他无论如何也不肯放弃，非要走遍整座花园才罢休。等他终于回到那棵华盖般的树下，双颊已经通红，脸上全是胜利的光彩。
        - id: ch05-b05
          speaker: colin_craven
          text: “我做到了！魔法真的起作用了！这是我的第一个科学发现！”
          emotion: happy
        - id: ch05-b06
          speaker: mary_lennox
          text: “克雷文医生知道了会说什么？”
        - id: ch05-b07
          speaker: colin_craven
          text: “他什么也不会说，因为没人会告诉他。这要成为最大的秘密。在我强壮得能像别的男孩一样走路、跑步以前，谁也不能知道。我每天还要坐轮椅进来，再坐轮椅回去。我不要别人背后议论，也不要他们问个不停。”
        - id: ch05-b08
          speaker: colin_craven
          text: “实验彻底成功以前，我更不准父亲听到半点消息。等他有一天回到米瑟斯韦特，我会直接走进他的书房，对他说，我在这里。我已经和别的男孩一样了。我完全好了，会一直活到长大成人。这就是科学实验的成果。”
        - id: ch05-b09
          speaker: mary_lennox
          text: “他会以为自己在做梦！他根本不敢相信眼睛看到的是真的。”
          emotion: surprised
        - id: ch05-b10
          speaker: narrator
          text: 科林胜利般地红了脸。他已经让自己相信，他一定会恢复健康。要是他明白的话，这其实已经让这场仗赢了一大半。最能鼓舞他的，就是想象父亲看到他时会露出怎样的神情。那时候，父亲终于会有一个像别人家儿子那样挺拔、强壮的儿子。过去那些病弱又阴郁的日子里，科林最深的痛苦之一，就是恨自己是个身体孱弱、脊背软弱的男孩，连父亲都害怕看见他。
        - id: ch05-b11
          speaker: colin_craven
          text: “他一定会相信。等魔法起了作用，在开始作出科学发现以前，我先要成为运动健将。”
        - id: ch05-b12
          speaker: ben_weatherstaff
          text: “照这样下去，再过一个星期，你就该学拳击了。到最后准能拿下金腰带，当上全英格兰的拳击冠军。”
        - id: ch05-b13
          speaker: narrator
          text: 科林严厉地盯住他。
        - id: ch05-b14
          speaker: colin_craven
          text: “韦瑟斯塔夫，你这样很不恭敬。别以为你知道秘密，就可以放肆。不管魔法多有用，我也不会做拳击手。我要做科学发现家。”
        - id: ch05-b15
          speaker: ben_weatherstaff
          text: “请您原谅，请您原谅，少爷。俺早该明白，这事可不能拿来开玩笑。”
        - id: ch05-b16
          speaker: narrator
          text: 本一边请少爷原谅，一边抬手碰了碰额头，向科林郑重地敬了个礼。可他的眼睛里一直闪着笑，心里其实高兴极了。他一点也不在意挨这顿训斥，因为这恰恰说明，眼前这个男孩的力气和精神正在一天天恢复，一天天回到他身上。
