  chapters:
    - id: ch01
      title: Magic
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Dr. Craven had been waiting at the house for quite a while when the children returned. He was already wondering whether someone ought to search the garden paths. Once Colin was back in his room, the poor doctor examined him with a serious face.
        - id: ch01-b02
          speaker: dr_craven
          text: >-
            You stayed out much too long. You mustn't wear yourself out.
        - id: ch01-b03
          speaker: colin
          text: >-
            I'm not tired at all. Going out has made me well. Tomorrow I'll go in the morning and the afternoon.
        - id: ch01-b04
          speaker: dr_craven
          text: >-
            I'm not certain I can permit that. It may not be sensible.
        - id: ch01-b05
          speaker: colin
          text: >-
            Trying to stop me wouldn't be sensible. I am going.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Colin said it with complete seriousness. By now, even Mary understood something odd about him. He had no idea how rudely he ordered people around. All his life, he had been like the king of a desert island. He had invented his own manners because there was no one beside him to compare himself with.

            Mary had once been much the same. At Misselthwaite, she had slowly learned that her own manners were neither usual nor well liked. Since this was news to her, she naturally thought it was interesting enough to share with Colin. After Dr. Craven left, she sat watching him curiously for several minutes. She wanted him to ask why she was doing it, and of course he did.
        - id: ch01-b07
          speaker: colin
          text: >-
            Why are you staring at me?
        - id: ch01-b08
          speaker: mary
          text: >-
            I was thinking that I feel rather sorry for Dr. Craven.
        - id: ch01-b09
          speaker: colin
          text: >-
            So do I. He won't get Misselthwaite now, because I'm not going to die.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Colin sounded calm, though he could not quite hide his satisfaction.
        - id: ch01-b11
          speaker: mary
          text: >-
            Of course I'm sorry for him about that. But I was thinking how awful it must have been to spend ten years being polite to a boy who was rude all the time. I never would have done it.
        - id: ch01-b12
          speaker: colin
          text: >-
            Am I rude?
        - id: ch01-b13
          speaker: mary
          text: >-
            If you were his son, and he were the sort of man who slapped boys, he would have slapped you.
        - id: ch01-b14
          speaker: colin
          text: >-
            But he wouldn't dare.
        - id: ch01-b15
          speaker: mary
          text: >-
            No, he wouldn't. Nobody ever dared do anything you disliked. They all thought you were going to die. You were such a poor thing.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Mary considered the matter without taking either side.
        - id: ch01-b17
          speaker: colin
          text: >-
            Well, I won't be a poor thing anymore. I won't let anyone think I am. I stood on my feet this afternoon.
        - id: ch01-b18
          speaker: mary
          text: >-
            Always getting your own way is what made you so queer.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Colin turned toward her with a frown.
        - id: ch01-b20
          speaker: colin
          text: >-
            Am I queer?
        - id: ch01-b21
          speaker: mary
          text: >-
            Yes, very. But don't be cross. I'm queer, too, and so is Ben Weatherstaff. Only I'm not as queer as I was before I found the garden and began to like people.
        - id: ch01-b22
          speaker: colin
          text: >-
            I don't want to be queer. And I won't be.
        - id: ch01-b23
          speaker: narrator
          text: >-
            He frowned with determination. Colin was a very proud boy. He thought for a while, and then his beautiful smile appeared and slowly transformed his whole face.
        - id: ch01-b24
          speaker: colin
          text: >-
            If I go to the garden every day, I'll stop being queer. There is Magic there, Mary. Good Magic. I'm certain of it.
        - id: ch01-b25
          speaker: mary
          text: >-
            I am, too.
        - id: ch01-b26
          speaker: colin
          text: >-
            Even if it isn't real Magic, we can pretend. There is something there. Something!
        - id: ch01-b27
          speaker: mary
          text: >-
            It's Magic, but it isn't black. It's as white as snow.
        - id: ch01-b28
          speaker: narrator
          text: >-
            They always called it Magic. And through the wonderful, radiant, amazing months that followed, it truly seemed like Magic. Oh, the things that happened in that garden! If you have never had a garden, you cannot understand. If you have, then you know it would take a whole book to tell everything that happened there.

            At first, green shoots seemed to push through every bit of earth. They rose in the grass and flower beds, and even from cracks in the walls. Then came the buds. They opened into every blue and purple, and every shade of crimson. In the garden's happy years, flowers had been planted in each tiny corner. Ben Weatherstaff remembered it. He had even scraped mortar from between the bricks and filled the spaces with soil for lovely climbing plants.

            Iris and white lilies rose in clusters from the grass. The green alcoves filled themselves with amazing armies of blue and white flower spears. There were tall delphiniums, columbines, and campanulas everywhere.
        - id: ch01-b29
          speaker: ben_weatherstaff
          text: >-
            She were mighty fond of those, she were. She liked flowers that were always pointing up at the blue sky. Not that she ever looked down on the earth. She loved the earth. But she'd say the blue sky always looked so joyful.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The seeds Dickon and Mary had planted grew as though fairies cared for them. Scores of silky poppies danced in the breeze. They looked as if they cheerfully challenged the older flowers, which seemed to wonder where all these newcomers had come from.

            And then there were the roses. The roses! They rose from the grass and tangled around the sundial. They wound around tree trunks and hung from the branches. They climbed the walls and spread across them in long garlands that fell like cascades. Every day, almost every hour, they came further alive. First came fair, fresh leaves. Then came buds upon buds. They were tiny at first, but they swelled as the Magic worked inside them. At last, they burst open and uncurled into cups of fragrance. Their scent spilled gently over the rims and filled the garden air.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Colin watched every change. Each morning he was carried outside, and whenever it did not rain, he stayed in the garden all day. Even gray weather pleased him. He would lie in the grass and watch things grow. If you watched closely enough, he said, you could actually see a bud opening from its green covering.

            He also got to know strange, busy insects that ran this way and that on important errands no one understood. Sometimes they carried scraps of straw, feathers, or food. Sometimes they climbed grass blades as though the blades were trees. From the top, they seemed ready to look out and explore an entire country. One morning, a mole held Colin's attention for hours. He watched it throw up a mound at the end of its tunnel. At last it worked its way out on long-clawed paws that looked like tiny elf hands.

            The ways of ants, beetles, bees, frogs, birds, and plants opened a whole new world to him. Dickon showed him even more. He knew the ways of foxes and otters, ferrets and squirrels, trout, water rats, and badgers. With all of that to discover, there was no end to what the boys could talk over and think about.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Yet that was not even half the Magic. The fact that he had truly stood on his own feet had started Colin thinking as never before. When Mary told him about the spell she had worked, he became excited. He approved of it completely and talked about it again and again.
        - id: ch01-b33
          speaker: colin
          text: >-
            There must be a great deal of Magic in the world. People simply don't know what it looks like or how to use it. Maybe you begin by saying good things will happen until you make them happen. I mean to test it.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The next morning, as soon as they reached the secret garden, Colin sent for Ben Weatherstaff. Ben came as quickly as he could. He found his Rajah standing on his own feet beneath a tree. The boy looked very grand, but his smile was beautiful.
        - id: ch01-b35
          speaker: colin
          text: >-
            Good morning, Ben Weatherstaff. You, Dickon, and Miss Mary must stand in a row and listen. I have something very important to tell you.
        - id: ch01-b36
          speaker: ben_weatherstaff
          text: >-
            Aye, aye, sir!
        - id: ch01-b37
          speaker: narrator
          text: >-
            Ben touched his forehead like a sailor. One of his long-hidden charms was that, as a boy, he had once run away to sea and gone on voyages. No one here would have guessed it. That old adventure was why he knew how to answer Colin like a sailor reporting to his captain.
        - id: ch01-b38
          speaker: colin
          text: >-
            I am going to conduct a scientific experiment. When I grow up, I shall make great scientific discoveries. I'm beginning now with this experiment.
        - id: ch01-b39
          speaker: ben_weatherstaff
          text: >-
            Aye, aye, sir!
        - id: ch01-b40
          speaker: narrator
          text: >-
            This was the first Ben had heard about Colin's great discoveries. It was the first Mary had heard, too. By this time, though, she had begun to understand something about Colin. Queer though he was, he had read about a great many unusual things. Somehow, he could be a very convincing boy. When he raised his head and fixed those strange eyes on you, you nearly had to believe him in spite of yourself, even though he was only ten, nearly eleven. Just then, he discovered how fascinating it was to stand before an audience and give a speech like a grown-up. That feeling made him more convincing than ever.
        - id: ch01-b41
          speaker: colin
          text: >-
            My great discoveries will concern Magic. Magic is tremendously important, but hardly anyone understands it except a few people in old books. Mary knows a little because she was born in India, where there are fakirs. I think Dickon knows Magic without knowing he knows it. He charms animals, and he charms people, too. I would never have allowed him to visit me if he weren't an animal charmer. That also makes him a boy charmer, since a boy is an animal.

            I believe Magic is everywhere. We simply haven't enough sense to catch hold of it and make it work for us, the way we use electricity, horses, and steam.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Colin's words sounded so grand and impressive that Ben grew quite excited. He truly could not keep still any longer.
        - id: ch01-b43
          speaker: ben_weatherstaff
          text: >-
            Aye, aye, sir.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Ben drew himself up very straight.
        - id: ch01-b45
          speaker: colin
          text: >-
            When Mary first found this garden, it looked dead. Then something began pushing plants out of the soil and creating things where there had been nothing. They weren't there one day, and the next day they were. I'd never watched anything grow before. It made me terribly curious, and scientific people are always curious. I intend to be scientific.

            I keep asking myself, “What is it? What is it?” It has to be something. It can't be nothing. Since I don't know its name, I call it Magic. I've never seen the sun rise, but Mary and Dickon have. From what they tell me, I'm sure that must be Magic, too. Something pushes the sun upward and draws it into the sky.

            Sometimes, here in the garden, I look through the trees at the sky. Then a strange happiness seems to push and pull inside my chest, and I begin breathing fast. Magic is always pushing and pulling. It makes something out of nothing. Leaves and trees, flowers and birds, badgers, foxes, squirrels, and people are all made from Magic. So it must be everywhere around us, here in the garden and in every other place.

            The Magic in this garden made me stand on my feet. It made me know I shall live to be a man. My scientific experiment is to draw some of that Magic into me. I want it to push and pull inside me and make me strong. I don't know how to do it yet. But perhaps if you keep thinking about it and calling it, the Magic will come. Maybe that's the first, babyish way of reaching it.

            When I first tried to stand, Mary kept saying to herself as fast as she could, “You can do it! You can do it!” I had to make the effort myself, of course, but her Magic helped me, and Dickon's Magic helped, too. So every morning and every evening, and as often as I remember during the day, I shall say, “Magic is in me! Magic is making me well! I shall be as strong as Dickon, as strong as Dickon!” All of you must say it, too. That is my experiment. Will you help me, Ben Weatherstaff?
        - id: ch01-b46
          speaker: ben_weatherstaff
          text: >-
            Aye, aye, sir! Aye, aye!
        - id: ch01-b47
          speaker: colin
          text: >-
            We must do it every day, as regularly as soldiers doing their drills. Then we'll watch what happens and find out whether the experiment succeeds. You learn things by repeating them and thinking about them until they stay in your mind forever. I believe Magic will work the same way. If you keep calling it to come to you and help you, it will become part of you. It will stay inside you and begin to do things.
        - id: ch01-b48
          speaker: mary
          text: >-
            I once heard an officer in India tell Mother about fakirs who repeat the same words thousands and thousands of times.
        - id: ch01-b49
          speaker: ben_weatherstaff
          text: >-
            I've heard Jem Fettleworth's wife repeat the same thing thousands of times. She calls Jem a drunken brute. Something always comes of that, sure enough. He gives her a good hiding, then goes down to the Blue Lion and gets drunk as a lord.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Colin knitted his brows and thought for several minutes. Then his spirits rose again.
        - id: ch01-b51
          speaker: colin
          text: >-
            Well, something did come of it. She used the wrong Magic until she made him beat her. If she had used the right Magic and said something pleasant, perhaps he wouldn't have become so drunk. Perhaps he might even have bought her a new bonnet.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Ben chuckled at Colin's answer. There was a shrewd look of admiration in his little old eyes.
        - id: ch01-b53
          speaker: ben_weatherstaff
          text: >-
            Tha'rt a clever lad, Mester Colin, as well as a straight-legged one. Next time I see Bess Fettleworth, I'll give her a hint about what Magic might do. She'd be mighty pleased if this scientific experiment worked, and Jem would be, too.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Dickon had listened to the whole lecture with his round eyes shining in delighted curiosity. Nut and Shell sat on his shoulders. In his arms, he held a white rabbit with long ears. He stroked it gently, again and again, while the rabbit laid its ears along its back and enjoyed every moment.
        - id: ch01-b55
          speaker: colin
          text: >-
            Do you think my experiment will work?
        - id: ch01-b56
          speaker: narrator
          text: >-
            Colin often wondered what Dickon was thinking when the boy watched him, or watched one of his creatures, with that happy, open smile. He wondered about it now. Dickon smiled back, and this time his smile grew wider than usual.
        - id: ch01-b57
          speaker: dickon
          text: >-
            Aye, I do. It'll work the way seeds work when the sun shines on them. It'll surely work. Shall we start now?
        - id: ch01-b58
          speaker: narrator
          text: >-
            Colin was delighted, and so was Mary. He remembered pictures of fakirs and holy men and suggested that everyone sit cross-legged beneath the tree's leafy canopy.
        - id: ch01-b59
          speaker: colin
          text: >-
            It will be like sitting in a kind of temple. I'm rather tired, and I want to sit down.
        - id: ch01-b60
          speaker: dickon
          text: >-
            Eh, tha' mustn't start by saying tha'rt tired. That might spoil the Magic.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Colin turned and looked straight into Dickon's innocent round eyes.
        - id: ch01-b62
          speaker: colin
          text: >-
            That's true. I must think only about the Magic.
        - id: ch01-b63
          speaker: narrator
          text: >-
            When they sat in a circle, everything felt grand and mysterious. Ben Weatherstaff felt as though he had somehow been led into a prayer meeting. Usually he was firmly against prayer meetings. But this belonged to the Rajah, so he did not object. In fact, he was pleased to have been asked to help.

            Mary felt solemn and enchanted. Dickon settled cross-legged with the rabbit in his arms. Perhaps he gave some secret charmer's signal that no one else could hear. As he sat down, the crow, the fox, the squirrels, and the lamb slowly approached. Each found a resting place in the circle, as though every creature had chosen to join them.
        - id: ch01-b64
          speaker: colin
          text: >-
            The creatures have come. They want to help us.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Mary thought Colin looked beautiful. He held his head high, almost like a priest. His strange eyes had a wonderful light in them, and sunlight streamed through the leaves above him.
        - id: ch01-b66
          speaker: colin
          text: >-
            Now we'll begin. Mary, should we sway backward and forward like dervishes?
        - id: ch01-b67
          speaker: ben_weatherstaff
          text: >-
            I canna sway backward and forward. I've got rheumatics.
        - id: ch01-b68
          speaker: colin
          text: >-
            The Magic will cure them. But we won't sway until it does. We'll only chant.
        - id: ch01-b69
          speaker: ben_weatherstaff
          text: >-
            I canna chant, either. The one time I tried, they threw me out of the church choir.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Ben sounded a little annoyed, but no one laughed. They were all far too serious. Not even a shadow crossed Colin's face. His mind held nothing but the Magic.
        - id: ch01-b71
          speaker: colin
          text: >-
            Then I will chant. The sun is shining. The sun is shining. That is the Magic. The flowers are growing. The roots are stirring. That is the Magic. Being alive is the Magic. Being strong is the Magic. The Magic is in me. The Magic is in me. It is in me. It is in me. It's in every one of us. It's in Ben Weatherstaff's back. Magic! Magic! Come and help!
        - id: ch01-b72
          speaker: narrator
          text: >-
            Colin looked like a strange young spirit as he chanted. He repeated the words many times. Not a thousand, but still a great many. Mary listened in a trance. It seemed queer and beautiful at the same time, and she wanted him to go on and on.

            The chant soothed Ben into a pleasant dream. Bees hummed among the blossoms, and their humming blended with Colin's voice until Ben drifted into a doze. Dickon sat cross-legged with the sleeping rabbit in one arm and his other hand resting on the lamb's back. Soot pushed a squirrel aside and nestled close against Dickon's shoulder. Then the gray film dropped over the crow's eyes. At last, Colin stopped.
        - id: ch01-b73
          speaker: colin
          text: >-
            Now I am going to walk around the garden.
        - id: ch01-b74
          speaker: narrator
          text: >-
            Ben's head had just fallen forward. He jerked it up.
        - id: ch01-b75
          speaker: colin
          text: >-
            You were asleep.
        - id: ch01-b76
          speaker: ben_weatherstaff
          text: >-
            Nowt of the sort. The sermon was good enough, but I always leave before the collection.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Ben was not fully awake yet.
        - id: ch01-b78
          speaker: colin
          text: >-
            You're not in church.
        - id: ch01-b79
          speaker: ben_weatherstaff
          text: >-
            Not me. Who said I was? I heard every word. Tha' said the Magic was in my back. The doctor calls it rheumatics.
        - id: ch01-b80
          speaker: narrator
          text: >-
            The Rajah waved one hand.
        - id: ch01-b81
          speaker: colin
          text: >-
            That was the wrong Magic. You will get well. You have my permission to return to work, but you must come back tomorrow.
        - id: ch01-b82
          speaker: ben_weatherstaff
          text: >-
            I'd like to watch thee walk around the garden.
        - id: ch01-b83
          speaker: narrator
          text: >-
            It was a grunt, but not an unfriendly one. Ben was a stubborn old fellow, and he did not completely trust the Magic. He had already made his plan. If Colin sent him away, he would climb his ladder and watch over the garden wall. That way, he would see any stumbling and be ready to hobble back at once.

            The Rajah let him stay, and they formed a procession. It truly looked like one. Colin led, with Dickon on one side and Mary on the other. Ben Weatherstaff followed behind. Then came the creatures. The lamb and fox cub stayed close to Dickon. The white rabbit hopped along, stopping now and then to nibble. Soot followed solemnly, as though he were in charge of everyone.
        - id: ch01-b84
          speaker: narrator
          text: >-
            The procession moved slowly but with dignity. It stopped to rest every few yards. Colin leaned on Dickon's arm while Ben secretly kept a sharp watch. Now and then, Colin removed his hand from its support and took several steps alone. All the while, he held his head high and looked very grand.
        - id: ch01-b85
          speaker: colin
          text: >-
            The Magic is in me! The Magic is making me strong! I can feel it! I can feel it!
        - id: ch01-b86
          speaker: narrator
          text: >-
            Something certainly seemed to hold him up and lift him onward. He rested on the seats in the alcoves. Once or twice, he lowered himself onto the grass. Several times, he stopped in the path and leaned against Dickon. But he would not give up. He kept going until he had walked all the way around the garden.

            When he reached the canopy tree again, his cheeks were bright with color and triumph shone in his face.
        - id: ch01-b87
          speaker: colin
          text: >-
            I did it! The Magic worked! That is my first scientific discovery!
          emotion: happy
        - id: ch01-b88
          speaker: mary
          text: >-
            What will Dr. Craven say?
          emotion: surprised
        - id: ch01-b89
          speaker: colin
          text: >-
            He won't say anything, because no one will tell him. This must be our greatest secret. Nobody can know until I'm strong enough to walk and run like any other boy. Every day, I'll come here in my chair and go back in it. I won't have people whispering or asking questions. And Father mustn't hear until the experiment has completely succeeded.

            Then, when he returns to Misselthwaite someday, I'll simply walk into his study. I'll say, “Here I am. I'm like any other boy. I'm perfectly well, and I'll live to be a man. A scientific experiment has done it.”
        - id: ch01-b90
          speaker: mary
          text: >-
            He'll think he's dreaming! He won't believe his own eyes.
          emotion: surprised
        - id: ch01-b91
          speaker: narrator
          text: >-
            Colin flushed with triumph. He had made himself believe that he was going to become well. If he had understood it, he would have known that believing was more than half the battle.

            Nothing encouraged him more than imagining his father's face when he saw that his son was as straight and strong as other fathers' sons. Back in Colin's dark, unhealthy, miserable days, one of his worst torments had been hating what he was. He had been a sickly boy with a weak back, and his own father was afraid to look at him.
        - id: ch01-b92
          speaker: colin
          text: >-
            He'll have to believe his eyes. After the Magic works, and before I begin making scientific discoveries, I intend to become an athlete.
        - id: ch01-b93
          speaker: ben_weatherstaff
          text: >-
            At this rate, tha'll be boxing in a week or two. Tha'll end up winning the Belt and becoming champion prizefighter of all England.
        - id: ch01-b94
          speaker: narrator
          text: >-
            Colin fixed Ben with a stern look.
        - id: ch01-b95
          speaker: colin
          text: >-
            Weatherstaff, that is disrespectful. Being part of the secret does not give you permission to take liberties. No matter how well the Magic works, I shall not become a prizefighter. I shall be a Scientific Discoverer.
        - id: ch01-b96
          speaker: ben_weatherstaff
          text: >-
            Beg pardon, sir. Beg pardon. I should've known it weren't a joking matter.
        - id: ch01-b97
          speaker: narrator
          text: >-
            Ben saluted, but his eyes twinkled. Secretly, he was delighted. He did not mind Colin's scolding at all, because it proved that the boy was gaining strength and spirit.
