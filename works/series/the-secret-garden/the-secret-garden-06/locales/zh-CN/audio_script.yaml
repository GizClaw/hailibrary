audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 克制而敏锐，带一点不动声色的讽意
        timbre: 温暖清晰
        pace: 舒缓中有变化
        pitch: 中音
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts:
        delivery: 任性强硬，话说得短而直接
        timbre: 稚嫩而尖细
        pace: 偏快
        pitch: 偏高
    martha:
      display_name: 玛莎
      tts:
        delivery: 爽朗质朴，带着亲切而浓重的约克郡乡音
        timbre: 年轻明亮而结实
        pace: 稍快
        pitch: 中高音
    mrs_medlock:
      display_name: 梅德洛克太太
      tts:
        delivery: 严厉急躁，惯于发号施令
        timbre: 粗硬低沉
        pace: 干脆偏快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 雨天里的新念头
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天，大雨又哗哗地下了起来。玛丽往窗外一看，灰色的云和雾几乎把荒原全遮住了。今天肯定不能出门。
        - id: ch01-b02
          speaker: mary_lennox
          text: “下这么大的雨，你们一家人在小屋里干什么？”
        - id: ch01-b03
          speaker: martha
          text: “最要紧的，就是别在屋里互相绊脚。雨天一来，嗐，家里的人一下子就显得多极了。妈妈脾气再好，也会忙得团团转。大孩子能去牛棚里玩。迪肯可不在乎雨，照样往外跑，就跟天晴时一样。他说，有些东西只有雨天才能瞧见，晴天反倒不露面。”
        - id: ch01-b04
          speaker: martha
          text: “有一次，一只小狐狸的窝进了水。狐狸妈妈在附近让人杀了，同窝的小狐狸也全淹死了，只有一只还剩半条命。迪肯找到它，就把它揣在衬衫胸口，带回家暖着。它现在还在我们家呢。还有一回，他捡到一只快淹死的小乌鸦，也带回来养熟了。那家伙黑得像煤，所以叫煤烟。迪肯走到哪儿，它就蹦蹦飞飞地跟到哪儿。”
        - id: ch01-b05
          speaker: narrator
          text: 到这时候，玛丽早已忘了自己原先不喜欢玛莎随便说话的样子。如今她爱听这些故事，玛莎一停下，或是要离开，她还觉得可惜。以前在印度，阿雅讲的故事完全不是这个味道。玛莎讲的是荒原小屋里的十四口人。他们挤在四个小房间里，总也吃不太饱。那群孩子活像一窝粗粗壮壮、脾气又好的牧羊犬幼崽，滚来滚去也能玩得高兴。最让玛丽着迷的是妈妈和迪肯。玛莎每次说到妈妈做了什么、讲了什么，听着总叫人心里暖和。
        - id: ch01-b06
          speaker: mary_lennox
          text: “我要是也有一只乌鸦，或者一只小狐狸，就能跟它玩了。可我什么都没有。”
        - id: ch01-b07
          speaker: narrator
          text: 玛莎有点犯难，只好一样一样地问她。
        - id: ch01-b08
          speaker: martha
          text: “你会织东西吗？”
        - id: ch01-b09
          speaker: mary_lennox
          text: “不会。”
        - id: ch01-b10
          speaker: martha
          text: “那缝东西呢？”
        - id: ch01-b11
          speaker: mary_lennox
          text: “不会。”
        - id: ch01-b12
          speaker: martha
          text: “你总会读书吧？”
        - id: ch01-b13
          speaker: mary_lennox
          text: “会。”
        - id: ch01-b14
          speaker: martha
          text: “那就找东西读呀，或者学学拼字。你已经不小了，早该多念点书啦。”
        - id: ch01-b15
          speaker: mary_lennox
          text: “我没有书。我的书全留在印度了。”
        - id: ch01-b16
          speaker: martha
          text: “真可惜。梅德洛克太太要是准你进图书室，那里面的书可有成千上万本。”
        - id: ch01-b17
          speaker: narrator
          text: 玛丽没问图书室在哪里。她突然有了主意，打算自己去找。梅德洛克太太似乎总在楼下那间舒适的起居室里，没什么可怕的。这座怪宅子里平时几乎见不到人，除了仆人，根本没有别人。主人不在时，仆人们在楼下过得相当舒服。大厨房里挂满锃亮的黄铜器和白镴器，宽敞的仆人大厅里每天摆四五顿好饭。只要梅德洛克太太不在，他们便会热热闹闹地玩起来。
    - id: ch02
      title: 一百扇紧闭的门
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 玛丽的饭顿顿按时送到，玛莎也来服侍，可没人真正管她。梅德洛克太太隔一两天看她一眼，却不问她做过什么，也不吩咐她该做什么。玛丽心想，英国人或许就是这样对待孩子的。在印度，阿雅处处跟着她，从早到晚侍候她，把什么都递到手边。那时玛丽常常嫌阿雅跟着烦。现在没人跟着了，她反而学起了自己穿衣服。因为每当她等着玛莎替她拿东西、替她穿戴时，玛莎的眼神都像是在说，这孩子怎么又傻又笨。
        - id: ch02-b02
          speaker: narrator
          text: 有一回，玛丽伸着手，等玛莎给她戴手套。
        - id: ch02-b03
          speaker: martha
          text: “你自己不会动脑子吗？我们家苏珊·安才四岁，都比你机灵一倍。有时候看着你，我真觉得你脑袋还没开窍。”
        - id: ch02-b04
          speaker: narrator
          text: 玛丽听完，沉着脸生了整整一个钟头的气。可那番话也让她第一次想到了一些从没想过的事。
        - id: ch02-b05
          speaker: narrator
          text: 这天早上，玛莎最后扫了一遍炉边，便下楼去了。玛丽在窗前站了十分钟，一直想着图书室。她其实没读过几本书，对书本身并不十分好奇。真正勾住她心思的，是那一百间房门紧闭的屋子。门真的全锁了吗？房间里都藏着什么？难道真有一百间？既然雨天出不去，她为什么不去数数那些门呢？玛丽从没学过，做事以前还要请谁准许。她也不懂听从管束。所以就算梅德洛克太太站在眼前，她也不会想到，在宅子里走一走还得先问她。
        - id: ch02-b06
          speaker: narrator
          text: 玛丽打开房门，走进长廊，开始四处游荡。这条走廊岔出另一条，那条又通向几级台阶，台阶上面还有台阶。她看见一扇又一扇门，也看见满墙的画。有些画着幽暗古怪的风景，更多的是肖像。画中男女穿着绸缎和天鹅绒做成的华丽旧衣裳。后来，她走进一条挂满肖像的长廊。她从没想过，一座宅子里竟能挂下这么多人。玛丽一路盯着那些面孔，而那些面孔仿佛也在盯着她，想知道这个从印度来的小姑娘为什么闯进了自己家。
        - id: ch02-b07
          speaker: narrator
          text: 画像里也有孩子。小姑娘穿着厚厚的缎子长裙，裙摆一直垂到脚边，还向外高高撑起。小男孩有的留着长发，穿灯笼袖，戴花边领子，有的脖子上围着宽大的皱领。玛丽见到孩子总会停住，猜他们叫什么，如今去了哪里，为什么穿得那么奇怪。有一个相貌平平的小姑娘神情拘谨，倒跟玛丽有点像。她穿绿色织锦裙，指上停着一只绿鹦鹉，目光又尖锐又好奇。
        - id: ch02-b08
          speaker: mary_lennox
          text: “你现在住在哪儿？要是你还在这里就好了。”
        - id: ch02-b09
          speaker: narrator
          text: 大概没有别的小姑娘这样度过一个早晨。巨大的宅子弯弯绕绕，像是只剩下玛丽小小的一个人。她上楼又下楼，穿过宽宽窄窄的过道，总觉得那些地方从来只有自己走过。既然造了这么多房间，从前当然住过许多人。可眼前处处空空荡荡，既没有脚步，也没有人声，让人很难相信这里真的热闹过。
    - id: ch03
      title: 空房间里的生命
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 到了三楼，玛丽才第一次伸手去拧门把。门果然都关着。可她挑中的那一扇，把手轻轻一拧就转了。厚重的门被她一推，慢慢打开，吓得她心里一跳。里面是一间大卧室。墙上垂着绣花帷幔，四周摆着她在印度见过的那种镶嵌家具。宽宽的铅条玻璃窗朝向荒原。壁炉上方，那个拘谨、相貌平平的小姑娘又在画像里盯着她，目光似乎比先前更好奇。
        - id: ch03-b02
          speaker: mary_lennox
          text: “也许她以前就睡在这里。她一直盯着我，看得我心里真奇怪。”
        - id: ch03-b03
          speaker: narrator
          text: 接下来，玛丽开了一扇又一扇门。她看过的房间多得叫人疲倦。虽然没认真数，她却渐渐相信，这里说不定真有一百间。每一间都挂着老画像，或是绣着怪异场面的旧壁毯。几乎每扇门后面，都还摆着样式稀奇的旧家具和古怪装饰。
        - id: ch03-b04
          speaker: narrator
          text: 有一间像太太的起居室，四周都是绣花天鹅绒帷幔。柜子里摆着近一百头象牙小象，大大小小，各不相同。有的背上坐着赶象人，有的驮着轿子。最大的比别的高出许多，最小的却像刚出生的象宝宝。玛丽在印度见过象牙雕刻，对大象的事也十分熟悉。她打开柜门，踩上脚凳，独自玩了好久。玩够了，便把小象一头头重新排好，再关上柜子。
        - id: ch03-b05
          speaker: narrator
          text: 这一路走来，长廊和空房间里连一个活物也没有。可柜门刚关上，玛丽听见了一点细细的窸窣声。她吓得跳了一下，赶紧回头看壁炉边的长沙发。声音像是从那里来的。沙发角落有个靠垫，天鹅绒面上破了一个洞。洞里探出一颗小脑袋，还有一双受惊的眼睛。
        - id: ch03-b06
          speaker: narrator
          text: 玛丽轻手轻脚地穿过房间，凑过去细看。那双亮眼睛属于一只灰色的小老鼠。它在靠垫上咬出洞来，又在里面做了一个舒舒服服的窝。身边六只鼠宝宝紧紧偎在一起，全都睡得正香。一百间屋子里也许再没有别的生命，可这七只老鼠待在一起，看上去一点都不孤单。
        - id: ch03-b07
          speaker: mary_lennox
          text: “要是它们不这么怕我，我就把它们带回房间了。”
        - id: ch03-b08
          speaker: narrator
          text: 玛丽走了太久，累得再也不想往前，便转身回去。她有两三次拐进了错误的走廊，彻底迷了路，只能上上下下地来回寻找。好不容易回到自己住的那一层，她却离房间还很远，也弄不清自己究竟站在哪里。
    - id: ch04
      title: 真的有人在哭
      blocks:
        - id: ch04-b01
          speaker: mary_lennox
          text: “我一定又拐错了。到底该往哪边走？这里怎么这么静！”
        - id: ch04-b02
          speaker: narrator
          text: 玛丽停在一条短走廊的尽头，身旁的墙上挂着壁毯。她的话音才落，寂静就被一声哭泣打破了。这回和昨晚不同。那只是一声短短的、烦躁的孩子呜咽，隔着墙传过来，闷闷的。
        - id: ch04-b03
          speaker: mary_lennox
          text: “比昨晚近多了。真的有人在哭。”
        - id: ch04-b04
          speaker: narrator
          text: 她的心跳快了一些。手无意间碰到旁边的壁毯时，她又吓得往后一跳。原来壁毯盖住了一扇暗门，轻轻一碰，门就倒向一边。后面竟还有一段走廊。梅德洛克太太正沿着那条走廊走来，手里抓着一大串钥匙，脸色十分恼火。
        - id: ch04-b05
          speaker: mrs_medlock
          text: “你跑到这里来干什么？我先前怎么跟你说的？”
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 她抓住玛丽的胳膊，把她拽到一边。
        - id: ch04-b07
          speaker: mary_lennox
          text: “我拐错了弯，不知道该往哪里走。后来我听见有人哭。”
        - id: ch04-b08
          speaker: narrator
          text: 玛丽当时已经很讨厌梅德洛克太太了。可管家接下来说的话，让她更讨厌这个人。
        - id: ch04-b09
          speaker: mrs_medlock
          text: “你什么也没听见。马上跟我回育儿室，不然我就扇你耳光。”
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: 梅德洛克太太牢牢抓着玛丽，穿过一条又一条过道，一路半推半拖，最后把她推进自己的房间。
        - id: ch04-b11
          speaker: mrs_medlock
          text: “现在，叫你待在哪里，你就待在哪里。再敢乱跑，我就把你锁起来。主人真该照原先说的，给你请一位家庭女教师。你这种孩子，非得有人盯紧了才行。我自己的事已经够多了。”
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: 她走出去，砰地摔上了门。玛丽坐到炉前的地毯上，气得脸色发白。她没有哭，只把牙齿咬得紧紧的。
        - id: ch04-b13
          speaker: mary_lennox
          text: “真的有人在哭。真的有，真的有！”
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: 玛丽已经听见两次了。总有一天，她一定会查出真相。这个早晨，她发现的事可不少。她觉得自己像是走过了一段遥远的旅程。至少一路都有事情吸引她，让她始终不曾无聊。她亲手摆弄过那些象牙小象，也看见了灰老鼠和六只宝宝。它们正挤在天鹅绒靠垫里的窝中，安安稳稳地睡着。
