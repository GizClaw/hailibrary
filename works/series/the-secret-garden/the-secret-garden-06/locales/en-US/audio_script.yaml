        pitch: medium-low
  chapters:
    - id: ch01
      title: There Was Some One Crying—There Was!
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The next day, the rain came pouring down again. When Mary looked through her window, gray mist and clouds hid almost all of the moor. There would be no going outside today.
        - id: ch01-b02
          speaker: mary
          text: What do you all do at your cottage when it rains this hard?
        - id: ch01-b03
          speaker: martha
          text: >-
            Mostly, we try not to get under one another's feet. Eh, the house does feel crowded then. Mother's good-tempered, but even she gets fair bothered by the lot of us. The bigger children go play in the cow shed. Dickon doesn't care about getting wet. He goes outdoors just the same as he would if the sun were shining. He says rainy days show him things he'd never see in fair weather.
        - id: ch01-b04
          speaker: martha
          text: >-
            Once, he found a little fox cub nearly drowned in its hole. The mother had been killed nearby, the hole was flooded, and all the other cubs were dead. Dickon tucked the poor thing inside his shirt to warm it and brought it home. We still have it. Another time, he found a young crow half drowned and brought that home too. He tamed it and named it Soot because it's black as soot. Now it hops and flies after him wherever he goes.
        - id: ch01-b05
          speaker: narrator
          text: >-
            By now, Mary had forgotten to be offended by Martha's familiar way of talking. She had even begun to enjoy it, and she felt sorry when Martha stopped or left the room. In India, her Ayah had told her very different stories. Martha talked about a moorland cottage where fourteen people shared four small rooms and never had quite enough food. The children seemed to tumble around and entertain themselves like a litter of rough, friendly collie puppies.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Of them all, Mary wanted to hear most about Dickon and his mother. Whenever Martha repeated something her mother had said or done, it sounded warm and comfortable.
        - id: ch01-b07
          speaker: mary
          text: If I had a raven or a fox cub, I could play with it. But I don't have anything.
        - id: ch01-b08
          speaker: narrator
          text: Martha looked puzzled.
        - id: ch01-b09
          speaker: martha
          text: Can tha knit?
        - id: ch01-b10
          speaker: mary
          text: No.
        - id: ch01-b11
          speaker: martha
          text: Can tha sew?
        - id: ch01-b12
          speaker: mary
          text: No.
        - id: ch01-b13
          speaker: martha
          text: Can tha read?
        - id: ch01-b14
          speaker: mary
          text: Yes.
        - id: ch01-b15
          speaker: martha
          text: >-
            Then why not read something, or practice thy spelling a bit? Tha's old enough to be getting on with thy lessons by now.
        - id: ch01-b16
          speaker: mary
          text: I don't have any books. Mine were left behind in India.
        - id: ch01-b17
          speaker: martha
          text: >-
            That's a shame. If Mrs. Medlock would let thee into the library, tha'd find thousands of books in there.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Mary did not ask where the library was. A new idea had come to her all at once. She would find it herself. Mrs. Medlock did not worry her. The housekeeper always seemed to be downstairs in her comfortable sitting room, and hardly anyone could be seen in this strange house.
        - id: ch01-b19
          speaker: narrator
          text: >-
            There were only the servants. While their master was away, they lived very well below stairs. The great kitchen shone with brass and pewter, and four or five generous meals appeared in the servants' hall every day. Whenever Mrs. Medlock was out of sight, there was plenty of noisy fun there too.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Mary's own meals arrived on time, and Martha waited on her, but no one paid much attention to what she did. Mrs. Medlock looked in every day or two. No one asked how Mary spent her time or gave her anything to do. Mary supposed this might be how English children were treated.
        - id: ch01-b21
          speaker: narrator
          text: >-
            In India, her Ayah had followed her everywhere and waited on her hand and foot. Mary had often grown tired of always having her nearby. Now no one followed Mary at all. She was even learning to dress herself, because Martha looked at her as if she were silly whenever she waited for things to be handed to her or put on for her.
        - id: ch01-b22
          speaker: martha
          text: >-
            Hasn't tha any sense? Our Susan Ann is only four, and she's twice as quick as thee. Sometimes tha looks fair soft in the head.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Mary had scowled stubbornly for a whole hour after Martha said that. Still, it made her think about several things she had never considered before.
        - id: ch01-b24
          speaker: narrator
          text: >-
            That morning, after Martha swept the hearth one last time and went downstairs, Mary stood at the window for about ten minutes. She kept thinking about the idea the library had given her. She did not care much about the books themselves. She had read very few. But the library reminded her of all those rooms with their doors shut.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Were they really all locked? What might she find if she got into one? Could there truly be a hundred rooms? She could go see how many doors there were. At least that would give her something to do while the rain kept her inside.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Mary had never been taught to ask permission before doing things. She knew nothing about obeying authority. Even if Mrs. Medlock had been there, it would never have occurred to Mary to ask whether she might explore the house.
        - id: ch01-b27
          speaker: narrator
          text: >-
            She opened her door, stepped into the corridor, and began to wander. The long passage branched into other passages. Short flights of steps took her up to still more of them. Everywhere she looked, there were doors and pictures.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Some paintings showed dark, curious landscapes. Most were portraits of men and women dressed in grand, strange clothes made of satin and velvet. One long gallery was covered with portraits. Mary had never imagined that a house could hold so many. She moved slowly past them, staring at the painted faces while they seemed to stare back. She felt as though they were all wondering why a little girl from India had come into their house.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Some of the portraits were of children. Little girls wore heavy satin dresses that reached their feet and stood out all around them. Boys had puffed sleeves, lace collars, and long hair, or enormous ruffs around their necks. Mary always stopped for the children. She wondered what their names had been, where they had gone, and why they wore such odd clothes.
        - id: ch01-b30
          speaker: narrator
          text: >-
            One stiff, plain little girl looked rather like Mary herself. She wore a green brocade dress and held a green parrot on one finger. Her eyes looked sharp and curious.
        - id: ch01-b31
          speaker: mary
          text: Where do you live now? I wish you were here.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Surely no other little girl had ever passed such a strange morning. The huge house rambled on and on, yet Mary seemed to be the only person in it. Her small figure wandered upstairs and down, through narrow passages and wide ones that felt as though no one else had ever walked there.
        - id: ch01-b33
          speaker: narrator
          text: >-
            People must once have lived in all these rooms. Why else would anyone have built so many? But the house felt so empty that Mary could hardly believe it.
        - id: ch01-b34
          speaker: narrator
          text: >-
            She had climbed to the second floor before she thought of trying a door handle. Every door was shut, just as Mrs. Medlock had said. At last, Mary reached for one handle and turned it. It moved easily. When she pushed, the heavy door slowly swung open. For a moment, she was almost frightened.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Beyond the massive door was a large bedroom. Embroidered hangings covered the walls, and the room held inlaid furniture like pieces Mary had seen in India. A broad window made of leaded panes looked toward the moor. Above the mantel hung another portrait of the stiff, plain little girl. This time, the girl seemed to be watching Mary more curiously than ever.
        - id: ch01-b36
          speaker: mary
          text: Maybe she used to sleep here. She stares so hard that she makes me feel strange.
        - id: ch01-b37
          speaker: narrator
          text: >-
            After that, Mary opened one door after another. She saw so many rooms that she grew tired. She began to think there really might be a hundred, though she had forgotten to count. Every room held old paintings or old tapestries sewn with strange scenes. Nearly all of them had unusual furniture and ornaments too.
        - id: ch01-b38
          speaker: narrator
          text: >-
            One room looked as though it had once been a lady's sitting room. Its hangings were made of embroidered velvet. Inside a cabinet stood about a hundred little ivory elephants. They came in many sizes. Some carried mahouts or palanquins on their backs. A few were quite large, while the tiniest ones looked like babies.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Mary knew all about elephants, and carved ivory was familiar to her from India. She opened the cabinet, climbed onto a footstool, and played with the little figures for a long time. When she had enough, she arranged them neatly and closed the cabinet door.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Mary had not seen one living thing anywhere in the empty rooms or the long corridors. But now she heard a faint rustle. She jumped and looked toward the sofa by the fireplace. The sound seemed to come from there.
        - id: ch01-b41
          speaker: narrator
          text: >-
            A cushion lay in one corner of the sofa. There was a hole in its velvet cover, and a tiny head peeked out. Two frightened eyes watched Mary. She crept quietly across the room for a closer look.
        - id: ch01-b42
          speaker: narrator
          text: >-
            The bright eyes belonged to a little gray mouse. She had chewed her way into the cushion and made a snug nest inside. Six baby mice slept curled together beside her. If nobody else lived in the hundred rooms, at least these seven mice were there, and they did not look lonely at all.
        - id: ch01-b43
          speaker: mary
          text: If they weren't so scared, I'd take them back to my room.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Mary had explored until she was too tired to go any farther, so she started back. Two or three times, she turned into the wrong corridor and lost her way. Each time she had to roam up and down until she found the right path again.
        - id: ch01-b45
          speaker: narrator
          text: >-
            At last, she reached her own floor. But she was still far from her room, and she did not know exactly where she had ended up. She stopped at what looked like the end of a short passage. A tapestry hung on the wall beside her.
        - id: ch01-b46
          speaker: mary
          text: >-
            I must have gone the wrong way again. I don't know which way to turn. Everything is so quiet!
        - id: ch01-b47
          speaker: narrator
          text: >-
            Just after Mary spoke, a sound broke the silence. It was another cry, but it was not quite the same as the one she had heard the night before. This one was short and fretful, the muffled whine of a child coming through the walls.
        - id: ch01-b48
          speaker: mary
          text: It's closer this time. And it really is someone crying.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Mary's heart beat a little faster. By accident, she put her hand against the tapestry. Then she sprang back in alarm. The tapestry had been hiding a door, and now it fell open. Another stretch of corridor appeared behind it.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Mrs. Medlock was coming up that corridor with her bunch of keys in one hand and a very cross look on her face. She seized Mary by the arm and pulled her away.
        - id: ch01-b51
          speaker: mrs_medlock
          text: What are you doing here? What did I tell you?
          emotion: angry
        - id: ch01-b52
          speaker: mary
          text: >-
            I took a wrong turn. I couldn't find my way, and then I heard someone crying.
        - id: ch01-b53
          speaker: narrator
          text: Mary hated Mrs. Medlock at that moment. What came next made her hate the housekeeper even more.
        - id: ch01-b54
          speaker: mrs_medlock
          text: >-
            You heard nothing of the kind. Come straight back to your nursery, or I'll box your ears.
          emotion: angry
        - id: ch01-b55
          speaker: narrator
          text: >-
            Mrs. Medlock kept hold of Mary's arm. She half pulled and half pushed the girl along one passage and down another. When they reached Mary's room, she shoved her through the doorway.
        - id: ch01-b56
          speaker: mrs_medlock
          text: >-
            Now stay where you're told, or you'll find yourself locked in. The master had better get you that governess he talked about. You need someone watching you every minute, and I have enough work already.
          emotion: angry
        - id: ch01-b57
          speaker: narrator
          text: >-
            Mrs. Medlock left and slammed the door behind her. Mary sat down on the hearth rug, pale with rage. She did not cry. She ground her teeth instead.
        - id: ch01-b58
          speaker: mary
          text: There was someone crying. There was! There was!
          emotion: angry
        - id: ch01-b59
          speaker: narrator
          text: >-
            Mary had heard the crying twice now, and one day she would discover where it came from. She had already discovered a great deal that morning. It felt as though she had traveled a very long way. At least the journey had kept her amused. She had played with the ivory elephants, and she had seen the gray mouse with her babies asleep in their velvet nest.
