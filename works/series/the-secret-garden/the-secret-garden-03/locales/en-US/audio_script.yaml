  chapters:
    - id: ch01
      title: Across the Moor
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Mary slept for a long time. When she woke, Mrs. Medlock had bought a lunch basket at one of the stations. They ate chicken, cold beef, bread and butter, and drank hot tea. Outside, the rain came down harder than ever. Everyone on the platform wore a wet, shining raincoat.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The guard lit the lamps in the train car. Tea and plenty of food put Mrs. Medlock in a much better mood. Once she had eaten a great deal, she fell asleep. Mary watched the fine bonnet on her head slide slowly to one side. Then the rain splashing against the windows lulled Mary to sleep in her corner too.
        - id: ch01-b03
          speaker: narrator
          text: >-
            It was fully dark when Mary woke again. The train had stopped, and Mrs. Medlock was shaking her.
        - id: ch01-b04
          speaker: mrs_medlock
          text: >-
            You've slept long enough! Open your eyes now. This is Thwaite Station, and we still have a long drive ahead of us.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Mary stood and fought to keep her eyes open while Mrs. Medlock gathered her parcels. Mary did not offer to help. In India, native servants had always picked things up and carried them, so she thought it was only proper for other people to wait on her.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The station was small, and Mary and Mrs. Medlock seemed to be the only passengers getting off. The station master greeted Mrs. Medlock in a rough but friendly voice. His words had a strange, broad sound. Mary later learned that this was the Yorkshire way of speaking.
        - id: ch01-b07
          speaker: station_master
          text: >-
            So tha's come back, then. And tha's brought the young one along with thee.
        - id: ch01-b08
          speaker: mrs_medlock
          text: >-
            Aye, this is her. How's your missus doing?
        - id: ch01-b09
          speaker: narrator
          text: >-
            Mrs. Medlock had slipped into the same Yorkshire accent. She jerked her head toward Mary as she spoke.
        - id: ch01-b10
          speaker: station_master
          text: >-
            Well enough. Your carriage is waiting outside.
        - id: ch01-b11
          speaker: narrator
          text: >-
            A smart enclosed carriage stood on the road beyond the little platform. A smartly dressed footman helped Mary inside. His long raincoat gleamed and dripped, and so did the waterproof cover on his hat. Everything was wet and shining, even the burly station master.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The footman shut the door and climbed up beside the coachman. As they drove away, Mary settled into a soft, cushioned corner. This time she did not want to sleep. She stared through the window, eager to see the road to the strange place Mrs. Medlock had described.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Mary was not a timid child, and she was not exactly afraid. Still, no one could know what might happen in a house with nearly a hundred rooms, most of them locked, standing at the edge of a moor.
        - id: ch01-b14
          speaker: mary
          text: >-
            What is a moor?
        - id: ch01-b15
          speaker: mrs_medlock
          text: >-
            Keep looking out the window. You'll see it in about ten minutes. We have five miles of Missel Moor to cross before we reach the Manor. It's too dark to see much, but you'll see something.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Mary asked nothing else. She waited in her dark corner with her eyes fixed on the window. The carriage lamps threw narrow beams a little way down the road, and she caught brief glimpses of whatever they passed.
        - id: ch01-b17
          speaker: narrator
          text: >-
            First came a tiny village. Mary saw whitewashed cottages and the lights of an inn. Then they passed a church, a vicarage, and one or two little shop windows set into cottages. Toys, sweets, and all sorts of odd things were displayed for sale. Beyond the village, they reached the highroad. Hedges and trees showed in the lamplight. After that, nothing seemed to change for a very long time, or at least it felt long to Mary.
        - id: ch01-b18
          speaker: narrator
          text: >-
            At last the horses slowed as though they were climbing a hill. Soon there were no hedges and no trees. Mary could see only thick darkness on both sides. She leaned forward and pressed her face to the glass. Just then, the carriage bounced hard.
        - id: ch01-b19
          speaker: mrs_medlock
          text: >-
            Eh! We're truly out on the moor now.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The carriage lamps spread yellow light over a rough road. It seemed to run between scrubby bushes and low plants. Those plants ended where the open moor began, and the moor disappeared into a great stretch of darkness all around them. The wind was rising. It made a strange, wild sound, low and rushing.
        - id: ch01-b21
          speaker: mary
          text: >-
            It isn't the sea, is it?
        - id: ch01-b22
          speaker: narrator
          text: >-
            Mary turned from the window to Mrs. Medlock.
        - id: ch01-b23
          speaker: mrs_medlock
          text: >-
            No, it isn't the sea. It isn't fields or mountains either. It's miles and miles of wild country. Nothing grows there except heather, gorse, and broom, and hardly anything lives there but wild ponies and sheep.
        - id: ch01-b24
          speaker: mary
          text: >-
            If there were water over it, I think it would feel like the sea. Right now, it even sounds like the sea.
        - id: ch01-b25
          speaker: mrs_medlock
          text: >-
            That's only the wind moving through the bushes. I find it wild and dreary enough, though plenty of people love the moor, especially when the heather is blooming.
        - id: ch01-b26
          speaker: narrator
          text: >-
            They drove on and on through the darkness. The rain stopped, but the wind swept past, whistling and making unfamiliar sounds. The road rose and dipped. Several times the carriage crossed a small bridge, and beneath it Mary heard water rushing loudly and fast.
        - id: ch01-b27
          speaker: narrator
          text: >-
            The drive seemed as if it would never end. To Mary, the broad, bleak moor was a black ocean, and the road was one thin strip of dry land through it.
        - id: ch01-b28
          speaker: mary
          text: >-
            I don't like it. I don't like it.
        - id: ch01-b29
          speaker: narrator
          text: >-
            She said the words to herself and pressed her thin lips even tighter.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The horses were climbing another hill when Mary first noticed a light. Mrs. Medlock saw it at the same moment and let out a long breath of relief.
        - id: ch01-b31
          speaker: mrs_medlock
          text: >-
            Eh, I'm glad to see that little light shining! It's the lodge window. At least we'll get a good cup of tea before too long.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Before too long was still some distance away. Once the carriage went through the park gates, they had another two miles to travel along the avenue. The trees nearly met above their heads, making the road feel like a long, dark tunnel.
        - id: ch01-b33
          speaker: narrator
          text: >-
            At last they came out of the tunnel into an open space. The carriage stopped before an enormously long, low house that seemed to wander around a stone courtyard. At first Mary thought every window was dark. Then, as she climbed out, she saw a dim glow in one upstairs room at the corner of the house.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The entrance door was huge. Its heavy oak panels had curious shapes, and they were studded with large iron nails and crossed by thick iron bars. Beyond it lay an enormous hall with hardly any light. Faces stared from portraits on the walls, and suits of armor stood in the shadows. Mary did not want to look at any of them.
        - id: ch01-b35
          speaker: narrator
          text: >-
            She stood on the stone floor, a very small, strange little figure dressed in black. She felt just as small and lost and strange as she looked.
        - id: ch01-b36
          speaker: narrator
          text: >-
            A neat, thin old man waited beside the servant who had opened the door. His voice was husky when he spoke.
        - id: ch01-b37
          speaker: mr_pitcher
          text: >-
            Take her straight to her room. He doesn't wish to see her, and he's leaving for London in the morning.
        - id: ch01-b38
          speaker: mrs_medlock
          text: >-
            Very well, Mr. Pitcher. As long as I know what I'm meant to do, I can handle it.
        - id: ch01-b39
          speaker: mr_pitcher
          text: >-
            What you're meant to do, Mrs. Medlock, is keep him from being disturbed. And make certain he never sees anyone he has no wish to see.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Mary Lennox was led up a broad staircase, along a long corridor, up a short flight of steps, and then through one corridor after another. Finally, a door opened in a wall. Beyond it was a room with a fire burning and supper waiting on a table.
        - id: ch01-b41
          speaker: mrs_medlock
          text: >-
            Well, here you are! You'll live in this room and the one beside it, and you are to stay in them. See that you remember!
        - id: ch01-b42
          speaker: narrator
          text: >-
            That was how Mistress Mary arrived at Misselthwaite Manor. And perhaps she had never felt quite so contrary in all her life.
