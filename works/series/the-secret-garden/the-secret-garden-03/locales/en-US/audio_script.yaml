audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    mrs_medlock:
      display_name: Mrs. Medlock
      tts:
        delivery: brisk, blunt, and firmly self-assured
        timbre: full and edged
        pace: steady
        pitch: medium-low
    station_master:
      display_name: Station Master
