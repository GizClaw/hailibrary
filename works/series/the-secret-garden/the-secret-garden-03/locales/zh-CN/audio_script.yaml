audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 克制而敏锐，带一点不动声色的讽意
        timbre: 温暖清晰
        pace: 舒缓中有变化
        pitch: 中音
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts:
        delivery: 任性强硬，话说得短而直接
        timbre: 稚嫩而尖细
        pace: 偏快
        pitch: 偏高
    mrs_medlock:
      display_name: 梅德洛克太太
      tts:
        delivery: 爽利强硬，健谈中带着约克郡乡音般的直率
        timbre: 粗实响亮
        pace: 稍快
        pitch: 中低音
    station_master:
      display_name: 站长
      tts:
        delivery: 粗声大气，带着亲切爽朗的约克郡乡音
        timbre: 浑厚响亮
        pace: 中等
        pitch: 中低音
    mr_pitcher:
      display_name: 皮彻先生
      tts:
        delivery: 谨慎严肃，说话简短而守规矩
        timbre: 苍老沙哑
        pace: 偏慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 从火车上醒来
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 玛丽这一觉睡了很久。她醒来时，梅德洛克太太已经从沿途的车站买来一篮午饭。两个人吃了鸡肉、冷牛肉、黄油面包，又喝了热茶。外面的雨比先前更大，水像是从天上直泼下来。站台上的人全穿着湿亮的防水衣。列车员点起车厢里的灯。梅德洛克太太喝着热茶，又吃了许多鸡肉和牛肉，整个人都快活起来，随后也睡着了。玛丽盯着她，看那顶漂亮的帽子慢慢歪到一边。雨水一下下溅在车窗上，玛丽听着那声音，也在角落里睡了过去。再次睁眼时，天已经全黑了。火车停在站里，梅德洛克太太正在摇她。
        - id: ch01-b02
          speaker: mrs_medlock
          text: “你可真能睡！快把眼睛睁开。斯韦特车站到了，可我们还得坐很久的马车呢。”
        - id: ch01-b03
          speaker: narrator
          text: 梅德洛克太太忙着收拾行李，玛丽站起来，努力不让眼睛合上。她根本没想过要搭把手。在印度，拿东西、搬东西都是当地仆人的事，她早就觉得别人服侍自己天经地义。
        - id: ch01-b04
          speaker: narrator
          text: 车站很小，似乎只有她们两个乘客下车。站长跟梅德洛克太太打招呼，声音粗，却很和气。他说起话来，字音又宽又特别。后来玛丽才明白，那就是约克郡口音。
        - id: ch01-b05
          speaker: station_master
          text: “哟，你回来啦。还把这小娃儿一道带来啦。”
        - id: ch01-b06
          speaker: mrs_medlock
          text: “可不是，就是她。你家太太还好吧？”
        - id: ch01-b07
          speaker: narrator
          text: 梅德洛克太太说话时，也带出了约克郡口音，还朝身后的玛丽甩了甩头。
        - id: ch01-b08
          speaker: station_master
          text: “好着呢。接你的马车就在外头。”
        - id: ch01-b09
          speaker: narrator
          text: 露天小站台前的路上，停着一辆四轮厢式马车，样子十分气派。扶玛丽上车的男仆也很体面。他的长防水外套和帽罩都湿得发亮，雨水直往下滴。四周每一样东西都是这样，就连魁梧的站长也不例外。
    - id: ch02
      title: 驶向荒原
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 男仆关好车门，爬上前座，和车夫坐到一起，马车这才上路。玛丽靠在铺着软垫的舒适角落里，却不愿再睡。她朝窗外看，想知道通往那个古怪地方的路究竟是什么样。她并不胆怯，也没有真的害怕。可那栋宅子有近一百个房间，大半锁着，又立在荒原边上，谁能猜到那里会有什么事等着她？
        - id: ch02-b02
          speaker: mary_lennox
          text: “荒原到底是什么？”
        - id: ch02-b03
          speaker: mrs_medlock
          text: “再等十分钟，你自己看窗外就明白了。到庄园前，要横穿五英里的米塞尔荒原。夜里看不清，不过多少还能瞧出一点。”
        - id: ch02-b04
          speaker: narrator
          text: 玛丽不再追问，只坐在黑暗的角落里等着，眼睛始终朝向车窗。车灯把几束光送到前面，却只能照亮一小段路。她借着那点光，偶尔能看见沿途的东西。离开车站以后，马车先经过一座小村庄。那里有刷白的农舍，也有亮着灯的酒馆。接着是一座教堂、一所牧师住宅，还有一两家开在农舍里的小铺子。小小的橱窗里摆着玩具、糖果和杂七杂八的货物。到了大路上，她又看见树和篱笆。再后来，周围很久都没有变化。至少玛丽觉得，已经过了很久。
        - id: ch02-b05
          speaker: narrator
          text: 马终于放慢了脚步，像是开始爬坡。不一会儿，树和篱笆都消失了。道路两旁只剩浓得化不开的黑暗。玛丽探过身子，把脸紧贴车窗。就在这时，车身猛地一颠。
        - id: ch02-b06
          speaker: mrs_medlock
          text: “哎！这回是真的到了荒原上啦。”
        - id: ch02-b07
          speaker: narrator
          text: 昏黄的车灯落在崎岖的路面上。那条路仿佛从灌木和贴地生长的矮树丛里硬生生开出来。那些草木到了尽头，外面便是一大片黑暗，在前方，也在四周，一直铺向无边无际的远处。风正渐渐变大，低低地奔涌着，声音陌生而狂野。
        - id: ch02-b08
          speaker: mary_lennox
          text: “这……这里不会是海吧？”
        - id: ch02-b09
          speaker: mrs_medlock
          text: “当然不是。它不是田野，也不是山，只是一大片荒地，一英里接着一英里，怎么也望不到头。地上只长石南、荆豆和金雀花，住在这里的也只有野马和绵羊。”
        - id: ch02-b10
          speaker: mary_lennox
          text: “要是有水，这里一定很像海。现在这声音就跟海一样。”
        - id: ch02-b11
          speaker: mrs_medlock
          text: “你听见的是风吹过灌木。反正我觉得，这地方又野又凄凉。不过喜欢它的人可不少，尤其到了石南开花的时候。”
    - id: ch03
      title: 黑色的海
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 马车不停地走，始终没有驶出黑暗。雨已经停了，风却从身旁飞掠过去，一会儿呼啸，一会儿又发出说不清的怪声。道路忽高忽低。马车几次经过小桥，每一座桥下面都有急水奔流，发出很大的响声。玛丽觉得这趟车永远也不会到头。辽阔荒凉的原野仿佛一片黑色海洋，而她正沿着海中一线窄窄的干地穿行。
        - id: ch03-b02
          speaker: mary_lennox
          text: “我不喜欢这儿。我就是不喜欢。”
        - id: ch03-b03
          speaker: narrator
          text: 她把薄薄的嘴唇抿得更紧。马儿又在爬一段坡路，这时，玛丽终于望见一点光。梅德洛克太太也看见了，长长地松了口气。
        - id: ch03-b04
          speaker: mrs_medlock
          text: “哎呀，那点灯光总算出现了，看着真叫人高兴！那是门房的窗户。再等一阵，我们至少能喝上一杯好茶。”
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: 这一阵还真不算短。马车进了庄园大门，前面仍有两英里长的林荫路。两旁的树几乎在头顶合拢，马车像是钻进了一条漫长而漆黑的地道。
    - id: ch04
      title: 米塞尔思韦特庄园
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 马车终于从那条黑暗的树木地道里驶出，来到开阔处。眼前的宅邸长得惊人，却不高，顺着石砌庭院曲折延伸，仿佛要把整座庭院环绕起来。马车在门前停住。起先，玛丽以为整栋房子一扇亮着的窗也没有。等她下车，才发现楼上角落的一间屋子透出微弱而暗淡的光。
        - id: ch04-b02
          speaker: narrator
          text: 正门异常高大，由形状奇特的厚橡木板做成，上面满是粗大的铁钉，还箍着宽宽的铁条。门一开，后面是个大得惊人的厅堂，光线昏暗得叫人不安。墙上挂着肖像，四周还立着一副副盔甲。那些画中人的脸和盔甲里的人形，让玛丽觉得自己最好别去看。她站在冰冷的石头地面上，一身黑衣，显得那么小，那么古怪。她自己也觉得渺小又迷失，仿佛不属于这个地方。
        - id: ch04-b03
          speaker: narrator
          text: 一个整洁瘦削的老人站在开门的男仆旁边。
        - id: ch04-b04
          speaker: mr_pitcher
          text: “把她送到自己的房间。主人不愿见她。他明天一早要去伦敦。”
        - id: ch04-b05
          speaker: mrs_medlock
          text: “好的，皮彻先生。只要把该做的事说清楚，我自然能办好。”
        - id: ch04-b06
          speaker: mr_pitcher
          text: “你要做的，就是别让任何人打扰主人，也别让他看见自己不愿看见的人。”
        - id: ch04-b07
          speaker: narrator
          text: 接着，玛丽·伦诺克斯被领上一道宽楼梯，走过一条很长的走廊，又爬上一小段台阶。前面还有一条走廊，过后又是一条，像是怎么也走不完。最后，墙上的一扇门打开了。屋里燃着炉火，桌上也已经摆好晚饭。
        - id: ch04-b08
          speaker: narrator
          text: 梅德洛克太太开口时，一点也不客气。
        - id: ch04-b09
          speaker: mrs_medlock
          text: “好啦，这就是你的地方！你以后住这间和隔壁那间屋。只准待在这里，可别忘了！”
        - id: ch04-b10
          speaker: narrator
          text: 倔脾气的玛丽小姐就这样到了米塞尔思韦特庄园。她这辈子大概从没像这一刻这样，心里处处都在别扭。
