audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 克制而敏锐，带一点不动声色的讽意
        timbre: 温暖清晰
        pace: 舒缓中有变化
        pitch: 中音
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts:
        delivery: 任性强硬，话说得短而直接
        timbre: 稚嫩而尖细
        pace: 偏快
        pitch: 偏高
    basil:
      display_name: 巴兹尔
      tts:
        delivery: 顽皮大胆，取笑别人时洋洋得意
        timbre: 清亮稚嫩
        pace: 偏快
        pitch: 偏高
    mrs_crawford:
      display_name: 克劳福德太太
      tts:
        delivery: 客气温和，议论人时带着怜悯
        timbre: 柔和端正
        pace: 中等
        pitch: 中高音
    mr_crawford:
      display_name: 克劳福德先生
      tts:
        delivery: 沉静审慎，语气里带着惋惜
        timbre: 温厚
        pace: 中等
        pitch: 中低音
    officers_wife:
      display_name: 军官太太
      tts:
        delivery: 好心而疏淡，措辞客气
        timbre: 明亮柔和
        pace: 中等
        pitch: 中音
    mrs_medlock:
      display_name: 梅德洛克太太
      tts:
        delivery: 爽利强硬，健谈中带着约克郡乡音般的直率
        timbre: 粗实响亮
        pace: 稍快
        pitch: 中低音
    mr_craven:
      display_name: 克雷文先生
      tts:
        delivery: 简短冷淡，不容人追问
        timbre: 低沉干涩
        pace: 偏慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 倔脾气的玛丽小姐
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 玛丽从前常常远远看着母亲，觉得她很漂亮。可她根本不了解母亲，当然也谈不上爱。母亲死了，她一点也不想念。这个孩子从来只想着自己。她一直这样活着，从没把心思真正放在另一个人身上。要是年纪大些，她也许会明白，自己孤零零留在世上，再没有亲人，心里一定会害怕。可她还小，又一直有人伺候，便认定以后也会这样。她眼下只关心一件事。自己会不会去一户不错的人家？那里的人会不会客客气气，像奶妈和印度仆人一样，什么都依着她？
        - id: ch01-b02
          speaker: narrator
          text: 玛丽知道，最初收留她的英国牧师不会让她长住。她也不想留下。牧师家很穷，五个孩子年纪都差不多，衣服破旧，整天吵架抢玩具。玛丽讨厌那座乱糟糟的平房，对孩子们也坏得很。才过一两天，谁都不肯跟她玩了。第二天，他们还给她起了个绰号，气得她要命。
        - id: ch01-b03
          speaker: narrator
          text: 绰号是巴兹尔想出来的。他有一双顽皮的蓝眼睛，一个朝天鼻。玛丽很讨厌他。那天，她独自在树下堆泥土、开小路，假装自己修了一座花园，就像霍乱暴发那天一样。巴兹尔站在旁边看了一会儿，渐渐来了兴致，忽然弯下腰，指着花园正中间。
        - id: ch01-b04
          speaker: basil
          text: “你可以在这里堆些石头，装成一座假山呀。就放在正中间，怎么样？”
        - id: ch01-b05
          speaker: mary_lennox
          text: “你走开！我不要男孩子在这里。快走！”
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 巴兹尔先气了一下，很快又存心逗她。他本来就爱招惹自己的姐妹，这会儿便绕着玛丽跳了一圈又一圈，一边扮鬼脸，一边笑着唱起来。
        - id: ch01-b07
          speaker: basil
          text: “倔脾气的玛丽小姐，你的花园怎样长？银铃铛，海螺壳，金盏花儿排成行。”
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: 他反复唱，其他孩子听见了，也笑着跟他一起唱。玛丽越恼火，他们唱得越起劲。从那以后，只要玛丽还住在牧师家，他们不管背后谈起她，还是当面对她说话，常常都叫她“倔脾气的玛丽小姐”。
        - id: ch01-b09
          speaker: basil
          text: “这个周末你就要被送回老家了。你走了，我们可高兴呢。”
        - id: ch01-b10
          speaker: mary_lennox
          text: “我也很高兴。可是老家在哪儿？”
        - id: ch01-b11
          speaker: basil
          text: “她居然不知道老家在哪儿！当然在英国。我们的外婆住在那里，梅布尔姐姐去年就送到她那里去了。可你不是去找外婆，你没有外婆。你要去舅舅家。他叫阿奇博尔德·克雷文先生。”
        - id: ch01-b12
          speaker: mary_lennox
          text: “他的事，我什么也不知道。”
        - id: ch01-b13
          speaker: basil
          text: “我当然知道你不知道。你什么都不懂，女孩子全是这样。我听爸爸妈妈说过，他住在乡下一栋又大又荒凉的老房子里。谁也不接近他。他脾气太坏，不许别人去。就算他肯，人家还不愿意呢。他是个驼背，模样可怕极了。”
        - id: ch01-b14
          speaker: mary_lennox
          text: “我才不信你。”
        - id: ch01-b15
          speaker: narrator
          text: 玛丽转过身，拿手指堵住耳朵，不肯再听。可后来，她把巴兹尔的话想了又想。当天晚上，克劳福德太太告诉她，过几天她就要坐船去英国，投奔住在米塞尔思韦特庄园的舅舅阿奇博尔德·克雷文先生。玛丽的脸像石头一样冷，硬是装成一点也不在乎。别人根本猜不出她在想什么。克劳福德夫妇想好好待她，克劳福德太太要亲她，她却把脸扭开。克劳福德先生拍拍她的肩，她立刻把身子绷得僵硬，连一点亲近的表示也不肯接受。
        - id: ch01-b16
          speaker: mrs_crawford
          text: “这个孩子长得真不好看。她母亲明明那么美，待人也讨人喜欢。我从没见过哪个孩子像玛丽这样不招人喜欢。孩子们管她叫‘倔脾气的玛丽小姐’，这样当然很淘气，可也不难明白他们为什么这么叫。”
        - id: ch01-b17
          speaker: mr_crawford
          text: “要是她母亲以前肯常到育儿室去，让玛丽多看看她那张漂亮的脸，也多学学她待人的样子，玛丽说不定会可爱些。那个可怜的美人如今不在了。再回头想想，竟然有那么多人一直不知道她有个女儿，实在叫人难过。”
        - id: ch01-b18
          speaker: mrs_crawford
          text: “我看，她几乎没有认真看过玛丽。奶妈一死，就没有人想着这小东西了。仆人逃得一个不剩，把她单独丢在空房子里。麦格鲁上校说，他开门看见她一个人站在屋子正中，吓得几乎跳起来。”
    - id: ch02
      title: 梅德洛克太太
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 漫长的航程中，玛丽由一位军官太太照管。那位太太要把自己的孩子送去寄宿学校，一路上只顾着自己的小儿子和小女儿，几乎没有心思理会玛丽。到了伦敦，克雷文先生派来的女人前来接人，她颇为高兴，立刻就把这个孩子交了出去。
        - id: ch02-b02
          speaker: narrator
          text: 那个女人叫梅德洛克太太，是米塞尔思韦特庄园的管家。她胖胖的，两颊通红，黑眼睛十分锐利。身上是鲜紫裙子和黑绸斗篷，斗篷镶着乌黑发亮的珠穗。黑帽子上还插着紫色天鹅绒花朵。她一动脑袋，那些花就在高处不停发颤。玛丽一看就不喜欢她。不过，玛丽很少喜欢谁，这也不稀奇。何况谁都看得出来，梅德洛克太太也不太喜欢玛丽。
        - id: ch02-b03
          speaker: mrs_medlock
          text: “哎哟，这小东西可真不好看！我们听说她母亲是个美人。可那副好模样，没传给女儿多少，是不是，太太？”
        - id: ch02-b04
          speaker: officers_wife
          text: “也许长大一点，她就会好看了。她只是脸色太黄，神情也不够可爱，五官其实还端正。孩子长着长着，会变很多的。”
        - id: ch02-b05
          speaker: mrs_medlock
          text: “那她可得大变一番。要我说，米塞尔思韦特没有什么东西能让孩子越长越好！”
        - id: ch02-b06
          speaker: narrator
          text: 两个女人以为玛丽没听见。她独自站在私人旅馆的窗前，离她们稍远，正看着街上的公共马车、出租马车和一群群行人。其实她们说的每句话，她都听得清清楚楚，对舅舅和那座庄园也越发好奇。那里究竟是什么样？舅舅又是什么样？驼背的人长什么模样？她从没见过。也许印度根本没有。
        - id: ch02-b07
          speaker: narrator
          text: 自从寄住在别人家里，身边又没了奶妈，玛丽开始觉得孤单，也有了一些从没想过的怪念头。父母活着时，她为什么也不像属于谁呢？别的孩子都像是爸爸妈妈家的孩子，只有她不是任何人的小女孩。她有仆人伺候，有饭吃，有衣服穿，却没有人真正在意她，也没有人把她放在心上。她不知道，这是因为自己太不讨人喜欢了。当然，她根本不知道自己不讨人喜欢。她只觉得别人讨厌，从没发现自己也一样。
        - id: ch02-b08
          speaker: narrator
          text: 在玛丽看来，梅德洛克太太比她见过的任何人都讨厌。那张红艳艳的粗俗面孔，还有那顶俗气却自以为华丽的帽子，都叫她看不顺眼。第二天，两人动身去约克郡。玛丽昂着头走过车站，一路尽量离管家太太远远的。她可不愿让人看出她们属于一处。只要一想到别人可能把她当成梅德洛克太太的女儿，她就会气坏了。
        - id: ch02-b09
          speaker: narrator
          text: 可梅德洛克太太根本不在意玛丽和她那些心思。她这种人，绝不容小孩子胡闹。至少有人问她时，她一定会这样回答。她本来不想来伦敦，因为妹妹玛丽亚的女儿马上要结婚了。可她在米塞尔思韦特当管家，差事舒服，薪水也好。想保住这份工作，克雷文先生说什么，她就得马上照办，连一句为什么都不敢问。
        - id: ch02-b10
          speaker: mr_craven
          text: “伦诺克斯上尉夫妇死于霍乱。上尉是我妻子的兄弟，现在他们的女儿归我监护。把她接到庄园来。你亲自去伦敦接她。”
        - id: ch02-b11
          speaker: narrator
          text: 梅德洛克太太就这样收拾好小箱子，去了伦敦。
    - id: ch03
      title: 前往米塞尔思韦特
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 现在，玛丽坐在火车车厢的角落里，模样不好看，脸上也尽是烦躁。她没有书读，外面也没什么可看，只把两只戴着黑手套的瘦小手交叠在膝上。黑裙子衬得她的脸更黄了。柔软的浅色头发从黑绉纱帽底下钻出来，乱蓬蓬地垂着。
        - id: ch03-b02
          speaker: narrator
          text: 梅德洛克太太心想，这辈子还没见过这么一张写满坏脾气的小脸。她脑子里用了约克郡土话“marred”，就是说孩子给惯坏了，又爱闹性子。她以前也从没见过哪个孩子能这样安安静静坐着，既不说话，也什么都不干。看了半天，她终于看烦了，便用爽利而硬邦邦的声音开口。
        - id: ch03-b03
          speaker: mrs_medlock
          text: “我还是跟你讲讲要去的地方吧。你知道你舅舅的事吗？”
        - id: ch03-b04
          speaker: mary_lennox
          text: “不知道。”
        - id: ch03-b05
          speaker: mrs_medlock
          text: “你爸爸妈妈从来没提过他？”
        - id: ch03-b06
          speaker: mary_lennox
          text: “从来没有。”
        - id: ch03-b07
          speaker: narrator
          text: 玛丽皱起眉。父母从来没跟她谈过什么要紧的事，也从没特意告诉过她任何事情。梅德洛克太太“哼”了一声，盯着这张古怪又毫无反应的小脸。她停了一会儿，还是接着往下说。
        - id: ch03-b08
          speaker: mrs_medlock
          text: “有些事最好先告诉你，让你心里有个准备。你要去的地方很古怪。”
        - id: ch03-b09
          speaker: narrator
          text: 玛丽完全不答话。她那副不在乎的样子，让梅德洛克太太有些下不来台。管家太太喘了口气，又讲下去。
        - id: ch03-b10
          speaker: mrs_medlock
          text: “那地方又大又气派，只是气派得阴森森的。克雷文先生当然以它为傲，可他骄傲起来也阴沉得很。房子有六百年了，就建在荒原边上，差不多有一百个房间，大半都关着，房门也上了锁。屋里有画像，有漂亮的古老家具，还有许多东西，不知道在那里放了多少年。外面是一大片园林，有花园，也有树。有些树的枝条一直垂下来，拖在地上。可除了这些，就什么也没有了。”
        - id: ch03-b11
          speaker: narrator
          text: 玛丽明明不想听，还是一点点听进去了。庄园的一切都跟印度那么不同。只要是从未见过的新鲜东西，总会让她有一点兴趣。可她偏偏不肯让人看出来。这也是她那些又不幸、又讨人厌的习惯之一。所以她仍旧坐着，一句话也不说，脸上也没有表情。
        - id: ch03-b12
          speaker: mrs_medlock
          text: “怎么样？你听了有什么想法？”
        - id: ch03-b13
          speaker: mary_lennox
          text: “没有想法。那种地方，我一点也不了解。”
        - id: ch03-b14
          speaker: narrator
          text: 梅德洛克太太短短地笑了一声。
        - id: ch03-b15
          speaker: mrs_medlock
          text: “嗬，你说起话来真像个老太婆。难道你一点也不在乎？”
        - id: ch03-b16
          speaker: mary_lennox
          text: “我在不在乎，反正都没关系。”
        - id: ch03-b17
          speaker: mrs_medlock
          text: “这倒是实话。你在不在乎，确实没有关系。我也不知道为什么要把你养在米塞尔思韦特。也许只因为这样安排最省事。反正有一件事准没错，他肯定不会费心照管你。他从来不为任何人费心。”
        - id: ch03-b18
          speaker: narrator
          text: 说到这里，她猛然收住了，仿佛刚好想起什么。
        - id: ch03-b19
          speaker: mrs_medlock
          text: “他的背是弯的，这也把他的性子弄坏了。他年轻时就很阴郁。守着那么多钱，那么大一座庄园，他却没享过一天福。后来，他结婚了。”
        - id: ch03-b20
          speaker: narrator
          text: 玛丽本来不想显得在意，可双眼还是转向了梅德洛克太太。她从没想过，那个驼背的人还结过婚，心里有点惊讶。梅德洛克太太看见了。她原本就爱说话，这会儿来了兴致。一路上拿这些事打发时间也好。
    - id: ch04
      title: 漂亮的妻子
      blocks:
        - id: ch04-b01
          speaker: mrs_medlock
          text: “他的妻子又温柔又漂亮。只要她想要一片草叶，哪怕得走遍全世界，他也会替她找回来。谁都没想到她会嫁给他。后来她真的嫁了，大家就说她图的是钱。可她不是，绝对不是，她才不是为了钱。后来，她死了——”
        - id: ch04-b02
          speaker: narrator
          text: 玛丽不由得轻轻一颤。
        - id: ch04-b03
          speaker: mary_lennox
          text: “啊！她已经死了吗？”
          emotion: surprised
        - id: ch04-b04
          speaker: narrator
          text: 这句话一下就冲出了口，连玛丽自己也没料到。她想起曾经读过的法国童话《长着一绺头发的里凯》。故事里也有一个可怜的驼背和一位美丽的公主。想到这里，她忽然有点同情阿奇博尔德·克雷文先生。
        - id: ch04-b05
          speaker: mrs_medlock
          text: “是的，她死了。从那以后，他变得比以前还古怪。他谁也不关心，也不肯见人。大部分时候，他都不在庄园。就算回了米塞尔思韦特，也把自己锁在西翼，除了皮彻，谁都不见。皮彻年纪大了，克雷文先生小时候就是他照看的，所以他最懂主人的脾气。”
        - id: ch04-b06
          speaker: narrator
          text: 这段故事像是从书里来的，可玛丽听完并不快活。将近一百个房间，大半关着、锁着。房子建在荒原边上，虽然她还不知道荒原是什么，光听着也够凄凉了。里面又住着一个弯着背、把自己也关起来的男人。玛丽紧紧抿着嘴，朝窗外看。雨仿佛理所当然似的，恰好在这时倾泻下来。灰色的雨线斜斜划过窗外，打得玻璃水花四溅，再沿着窗子一道道流淌。要是那位漂亮的妻子还活着，也许她会像玛丽的母亲一样，穿着缀满花边的裙子进进出出，到外面参加宴会，让庄园里快活一点。可她已经不在了。
        - id: ch04-b07
          speaker: mrs_medlock
          text: “你别盼着见他。十有八九，你根本见不到。也别指望那里有人陪你聊天。往后你得自己玩，也得自己照顾自己。会有人清清楚楚告诉你，哪些房间能进，哪些房间绝不能去。花园倒是够多，你可以在外面待着。可一回到屋里，千万别四处乱走，也不准东翻西找。克雷文先生绝不答应。”
        - id: ch04-b08
          speaker: mary_lennox
          text: “我才不想四处乱翻呢。”
        - id: ch04-b09
          speaker: narrator
          text: 坏脾气的小玛丽刚才还同情克雷文先生，现在立刻又不同情了。她觉得，这个人如此讨厌，遭遇那些事也是他活该。
    - id: ch05
      title: 灰色的雨
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 玛丽把脸转向火车车窗，望着玻璃上不断流淌的雨水。窗外是一场灰蒙蒙的暴雨，看起来永远、永远也不会停。她久久盯着那片雨。眼前的灰色越来越浓，越来越沉。最后，她睡着了。
