audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    martha:
      display_name: Martha
      tts:
        delivery: good-natured, candid, and broad in Yorkshire character
        timbre: rosy and sturdy
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Moor Wind Wakes Mary
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            At first, one day was just like the next for Mary Lennox. Each morning she woke in her room with the tapestries and found Martha kneeling by the hearth to make the fire. She ate breakfast in the nursery, where there was nothing to amuse her. Then she stood at the window and stared across the enormous moor. It seemed to stretch in every direction and rise until it met the sky.
        - id: ch01-b02
          speaker: narrator
          text: >-
            After a while, Mary always came to the same conclusion. If she did not go outside, she would have to stay indoors with nothing to do. So out she went. She had no idea that this was the best choice she could make. When she walked quickly along the paths, or ran down the avenue, her slow blood began to move faster. Little by little, struggling against the wind made her stronger.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Mary only ran because she wanted to keep warm. She hated the wind. It rushed into her face, roared around her, and pushed her back like some huge giant she could not see. But every deep breath brought rough, fresh air from across the heather into her lungs. That air was good for her thin body. Without Mary noticing, it put a little red into her cheeks and made her dull eyes brighter.
        - id: ch01-b04
          speaker: narrator
          text: >-
            After she had spent nearly all of several days outdoors, Mary woke one morning and discovered that she was hungry. At breakfast, she did not look scornfully at her porridge or shove it away. She picked up her spoon, began to eat, and kept going until the bowl was empty.
        - id: ch01-b05
          speaker: martha
          text: Tha did well with that this morning, didn't tha?
        - id: ch01-b06
          speaker: mary
          text: It tastes good today.
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: Mary was a little surprised herself.
        - id: ch01-b08
          speaker: martha
          text: >-
            That's the moor air giving thee an appetite. Lucky for thee, tha has food to go with it. There've been twelve of us in our cottage feeling hungry with nothing there to eat. Keep going outdoors every day. Tha'll put some flesh on those bones and won't look so yellow.
        - id: ch01-b09
          speaker: mary
          text: I don't play. I haven't got anything to play with.
        - id: ch01-b10
          speaker: martha
          text: >-
            Nothing to play with! Our children make games out of sticks and stones. They run around, shout, and look at things.
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: >-
            Mary did not shout, but she did look at things. There was nothing else for her to do. She went around and around the gardens and wandered along the park paths. Sometimes she searched for Ben Weatherstaff. She saw him working several times, but he was always too busy or too ill-tempered to pay attention to her. Once, when she walked toward him, he picked up his spade and turned away as if he meant to avoid her.
        - id: ch01-b12
          speaker: narrator
          text: >-
            One place drew Mary back more often than anywhere else. It was the long walk outside the walled gardens. Empty flower beds lay on both sides, and thick ivy climbed the walls. At one spot, the dark green leaves grew much bushier than they did anywhere else. The rest of the ivy had been clipped and kept neat. Down at this end of the walk, it looked as though no one had trimmed it for a very long time.
    - id: ch02
      title: The Robin Beyond the Wall
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            A few days after her talk with Ben Weatherstaff, Mary stopped at that overgrown place and wondered why it had been left alone. A long strand of ivy swung above her in the wind. As she looked up, she caught a flash of scarlet and heard a bright chirp. Ben Weatherstaff's robin was perched on top of the wall. He leaned forward with his little head tipped to one side and looked straight at her.
        - id: ch02-b02
          speaker: mary
          text: Oh! It's you, isn't it? It's really you!
          emotion: surprised
        - id: ch02-b03
          speaker: narrator
          text: >-
            It did not feel strange to Mary to speak as if the robin would understand her and answer. And he did answer, in his way. He twittered, chirped, and hopped along the wall, as though he had all kinds of things to tell her. Mary felt as if she understood every bit of it, even though he used no words. His cheerful noises seemed to say that the wind was lovely, the sunshine was lovely, and everything was lovely. They should chirp and hop together. Come on, come on!
        - id: ch02-b04
          speaker: narrator
          text: >-
            Mary laughed. The robin hopped and fluttered along the wall, and she ran after him. For one moment, poor, thin, sallow, ugly little Mary almost looked pretty.
        - id: ch02-b05
          speaker: mary
          text: I like you! I really do!
          emotion: happy
        - id: ch02-b06
          speaker: narrator
          text: >-
            She pattered down the walk, chirping and trying to whistle, though she had no idea how. The robin seemed perfectly satisfied. He chirped and whistled back. At last, he opened his wings, darted to the top of a tree, and perched there singing loudly.
        - id: ch02-b07
          speaker: narrator
          text: >-
            That took Mary back to the first time she had seen him. The robin had been swaying at the top of a tree while she stood in the orchard. Now she was outside a wall, farther down on the other side of that same orchard. And there, inside the wall, stood the very same tree.
        - id: ch02-b08
          speaker: mary
          text: >-
            He's in the garden nobody is allowed to enter. The garden with no door. That's where he lives. Oh, I wish I could see inside!
        - id: ch02-b09
          speaker: narrator
          text: >-
            Mary raced up the walk to the green door she had used on her first morning. She hurried down the next path, through another door, and into the orchard. When she looked up, the tree was there on the far side of the wall. The robin had finished his song and was smoothing his feathers with his beak.
        - id: ch02-b10
          speaker: mary
          text: It is the garden. I know it is.
        - id: ch02-b11
          speaker: narrator
          text: >-
            She walked beside the orchard wall and studied every part of it. She found exactly what she had found before. There was no door. She ran back through the kitchen gardens and returned to the long walk beside the ivy-covered wall. First she searched all the way to one end. Then she walked to the other end and searched again. Still, there was no door.
        - id: ch02-b12
          speaker: mary
          text: >-
            This is so strange. Ben Weatherstaff said there wasn't a door, and there really isn't one. But there had to be a door ten years ago. Mr. Craven buried the key.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Now Mary had something that truly interested her. She began to feel that perhaps she was not sorry she had come to Misselthwaite Manor. In India, the heat had always made her too tired and listless to care much about anything. Here, the fresh moor wind had begun to blow the cobwebs out of her young mind and wake her up.
    - id: ch03
      title: The Story by the Fire
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Mary stayed outside for nearly the whole day. By supper time, she was hungry, sleepy, and comfortable. Martha talked on and on, but Mary did not grow cross. She found that she rather liked listening to her. When supper was over, Mary sat on the hearth rug in front of the fire and decided to ask a question.
        - id: ch03-b02
          speaker: mary
          text: Why did Mr. Craven hate the garden?
        - id: ch03-b03
          speaker: narrator
          text: >-
            Mary had asked Martha to stay, and Martha was glad enough to do it. She was young and used to a cottage crowded with brothers and sisters. The great servants' hall downstairs felt lonely to her. The footman and the upper housemaids laughed at her Yorkshire speech, called her common, and sat whispering together. Martha loved to talk. And the strange child from India, who had once had Indian servants waiting on her, was interesting enough to hold her attention.
        - id: ch03-b04
          speaker: narrator
          text: Martha settled onto the hearth without waiting for an invitation.
        - id: ch03-b05
          speaker: martha
          text: Still thinking about that garden, are tha? I knew tha would. I was just the same when I first heard about it.
        - id: ch03-b06
          speaker: mary
          text: But why did he hate it?
        - id: ch03-b07
          speaker: narrator
          text: Martha tucked her feet beneath her and made herself comfortable.
        - id: ch03-b08
          speaker: martha
          text: >-
            Hear that wind wuthering around the house. If tha were out on the moor tonight, tha could hardly stay on thy feet.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Mary did not know what Martha meant by “wuthering” until she stopped and listened. Then she understood. It was the hollow, shivering roar that swept around and around the house. It sounded as though the invisible giant from the moor were striking the walls and windows, trying to force his way in. But Mary knew he could not enter. Sitting in a room beside a red coal fire, she felt warm and very safe.
        - id: ch03-b10
          speaker: mary
          text: But why did Mr. Craven hate the garden so much?
        - id: ch03-b11
          speaker: narrator
          text: Mary meant to find out whether Martha knew. At last, Martha gave in and told her everything she had heard.
        - id: ch03-b12
          speaker: martha
          text: >-
            Now mind, Mrs. Medlock says we're not to talk about this. There are plenty of things in this house nobody may discuss. That's Mr. Craven's order. He says his troubles are no business of the servants. But if it weren't for that garden, he wouldn't be the way he is now.
        - id: ch03-b13
          speaker: martha
          text: >-
            It was Mrs. Craven's garden. She made it when they were first married, and she loved it dearly. Mr. and Mrs. Craven cared for the flowers themselves. They never let any gardener inside. The two of them would go in, close the door, and stay for hours, reading and talking together.
        - id: ch03-b14
          speaker: martha
          text: >-
            Mrs. Craven was only a little thing. An old tree grew there with a branch bent like a seat, and she trained roses over it. She used to sit on that branch. Then one day it broke beneath her. She fell to the ground and was hurt so badly that she died the next day. The doctors thought Mr. Craven would lose his mind and die too. That's why he hates the garden. Nobody has gone in since, and he won't allow anyone to speak of it.
          emotion: sad
        - id: ch03-b15
          speaker: narrator
          text: >-
            Mary asked no more questions. She watched the red fire and listened to the wind wuthering outside. It seemed to roar more loudly than before.
        - id: ch03-b16
          speaker: narrator
          text: >-
            At that moment, something very good was happening to Mary. In fact, four good things had happened since she came to Misselthwaite Manor. She had felt that she understood a robin and that the robin understood her. She had run through the wind until her blood grew warm. For the first time in her life, she had felt a healthy hunger. And now she had learned what it was to feel sorry for someone. Mary was getting on.
    - id: ch04
      title: The Cry in the Corridor
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            As Mary listened to the wind, another sound caught her attention. At first, she could barely separate it from the storm. It was a strange noise, almost like a child crying somewhere. The wind sometimes sounded that way, but soon Mary was certain this sound did not come from outside. It was far away, yet it was somewhere inside the house. She turned to Martha.
        - id: ch04-b02
          speaker: mary
          text: Can you hear somebody crying?
        - id: ch04-b03
          speaker: narrator
          text: Martha suddenly looked uneasy.
        - id: ch04-b04
          speaker: martha
          text: >-
            No. That's only the wind. Sometimes it sounds like somebody has been lost out on the moor and is wailing. The wind can make all kinds of noises.
        - id: ch04-b05
          speaker: mary
          text: Listen! It's inside the house. It's coming from one of those long corridors.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Just then, a door must have opened somewhere downstairs. A powerful draft rushed along the passage and struck the door of their room. It flew open with a crash. Mary and Martha both jumped to their feet, and the light went out. The draft carried the crying sound down the distant corridor, and now they could hear it more clearly than ever.
        - id: ch04-b07
          speaker: mary
          text: >-
            There! I told you! Somebody is crying, and it isn't a grown-up!
        - id: ch04-b08
          speaker: narrator
          text: >-
            Martha ran to the door, shut it, and turned the key. Before she closed it, both girls heard another door slam somewhere in a far-off passage. Then everything became quiet. Even the wind stopped wuthering for a few moments.
        - id: ch04-b09
          speaker: martha
          text: >-
            It was the wind. And if it wasn't, then it was little Betty Butterworth, the scullery maid. She's had a toothache all day.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Martha spoke stubbornly, but there was something awkward and troubled in the way she behaved. Mary stared at her very hard. She did not believe Martha was telling the truth.
