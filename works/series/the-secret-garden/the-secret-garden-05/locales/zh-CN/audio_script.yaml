audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 克制而敏锐，带一点不动声色的讽意
        timbre: 温暖清晰
        pace: 舒缓中有变化
        pitch: 中音
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts:
        delivery: 任性强硬，话说得短而直接
        timbre: 稚嫩而尖细
        pace: 偏快
        pitch: 偏高
    martha:
      display_name: 玛莎
      tts:
        delivery: 爽朗质朴，带着亲切而浓重的约克郡乡音
        timbre: 年轻明亮而结实
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 荒原吹来的胃口
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 起初，玛丽·伦诺克斯每天都过着一模一样的日子。早晨醒来，她总看见玛莎跪在壁炉前生火。接着，她到那间毫无趣味的起居室吃早饭，再隔窗望一会儿荒原。那片荒原朝四面八方铺展开去，仿佛一直爬上了天空。可看来看去，玛丽总会想到，要是不出门，她就只能留在屋里，什么也不做。于是，她还是走了出去。
        - id: ch01-b02
          speaker: narrator
          text: 玛丽不知道，这正是对她最有益的事。她沿着一条条小径和长长的林荫道快步走，有时还一路跑下去。迟缓的血液渐渐活了，她也在和荒原上的风较劲时，一点点变得强健。其实她跑，只是想让自己暖和。她讨厌那风迎面扑来，吼叫着把她往后推，仿佛一个看不见的巨人。可越过石南丛吹来的空气，又粗野，又新鲜。它一大口一大口地灌满玛丽的肺，滋养着她瘦弱的身体。她自己毫无察觉，脸颊已经有了一点红色，黯淡的眼睛也亮了起来。
        - id: ch01-b03
          speaker: narrator
          text: 几乎整日在户外待了几天后，有天早晨，玛丽一醒来就明白了饥饿是什么滋味。她坐到桌前，没有嫌弃地把粥推开，而是拿起勺子，一口接一口，吃空了整只碗。
        - id: ch01-b04
          speaker: martha
          text: “今天早晨吃得不错，是不是？”
        - id: ch01-b05
          speaker: mary_lennox
          text: “今天的粥很好吃。”
        - id: ch01-b06
          speaker: narrator
          text: 连玛丽自己都觉得有些惊讶。
        - id: ch01-b07
          speaker: martha
          text: “是荒原上的空气把你的胃口吹出来啦。你有胃口，也有东西吃，真算走运。我们家十二口人，常常肚子饿，却没东西填。你每天都到外头玩，骨头上准能长出肉来，脸也不会这么黄了。”
        - id: ch01-b08
          speaker: mary_lennox
          text: “我不玩。我根本没有东西可玩。”
        - id: ch01-b09
          speaker: martha
          text: “怎么会没东西玩！我们家的孩子拿树枝和石头也能玩。他们到处跑，到处喊，还会东瞧瞧，西看看。”
        - id: ch01-b10
          speaker: narrator
          text: 玛丽不会喊，却也四处看，因为她的确无事可做。她绕着花园走了一圈又一圈，还在庄园的小路上闲逛。有时她会找本·韦瑟斯塔夫。她见过他干活好几回，可他不是忙得不理人，就是一脸阴沉。有一次，玛丽朝他走去，他竟拿起铁锹转过身，仿佛故意躲着她。
    - id: ch02
      title: 墙头的知更鸟
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 玛丽最常去的，是几座围墙花园外的一条长步道。路两旁的花坛光秃秃的，一直沿着步道排开，墙面则密密地爬满了常春藤。有一段墙上的深绿藤叶格外蓬乱，也比别处茂盛，像是荒废了许久。其余地方都修剪得很整齐，只有步道低处这一端，完全没人管。
        - id: ch02-b02
          speaker: narrator
          text: 和本说过话几天后，玛丽又停在了这里，心里琢磨着那片藤叶为什么无人修剪。她正抬头看一条随风摇晃的长藤，忽然瞧见一抹鲜红，也听见一声清亮的鸟鸣。本的那只红胸知更鸟正停在墙头，偏着小脑袋，向前探着身子瞧她。
        - id: ch02-b03
          speaker: mary_lennox
          text: “啊，是你吗？真的是你吗？”
        - id: ch02-b04
          speaker: narrator
          text: 玛丽把它当成一个听得懂、也会回答她的人，一点也没觉得奇怪。知更鸟果然啾啾叫着，沿墙蹦来蹦去，好像有许多话要告诉她。虽然它没有说出一个字，玛丽却觉得自己听明白了。它仿佛在向她道早安，还问她，风是不是很好，太阳是不是很好，一切是不是都好极了。接着，它又催玛丽快来，跟它一起叫，一起跳，一起唱。
        - id: ch02-b05
          speaker: narrator
          text: 玛丽笑了。知更鸟在墙头蹦跳，偶尔飞上一小段，她便跟在下面跑。这个又瘦、又黄、又难看的可怜孩子，有那么一会儿，竟显得几乎漂亮了。
        - id: ch02-b06
          speaker: mary_lennox
          text: “我喜欢你！我喜欢你！”
        - id: ch02-b07
          speaker: narrator
          text: 她迈着轻快的小步向前跑，学着鸟叫，还试着吹口哨，可她根本不会。知更鸟倒像是很满意，也啾啾叫着回应她。最后，它展开翅膀，嗖地飞上树梢，站在那里放声歌唱。
        - id: ch02-b08
          speaker: narrator
          text: 玛丽想起第一次见到它时，知更鸟也在这棵树的梢头摇晃，那时她正站在果园里。如今，她到了果园另一边，站在围墙外地势低得多的小路上。那棵树，就在墙里面。
        - id: ch02-b09
          speaker: mary_lennox
          text: “它在那座谁也不能进去的花园里。就是那座没有门的花园。它住在里面。真想看看里面是什么样子！”
        - id: ch02-b10
          speaker: narrator
          text: 玛丽沿步道跑到第一天进去过的绿门前，又穿过另一扇门，跑进果园。她站住一看，那棵树果然就在墙的另一边。知更鸟唱完了歌，正用尖嘴梳理羽毛。
        - id: ch02-b11
          speaker: mary_lennox
          text: “就是那座花园，我敢肯定。”
        - id: ch02-b12
          speaker: narrator
          text: 她绕着果园走，把这一侧的墙仔细看了一遍，结果和以前一样，还是没发现门。她又跑过一座座菜园，回到常春藤长墙外的步道。她先走到步道的一端，沿途细细寻找，再掉头走向另一端，又找了一遍。哪里都没有门。
        - id: ch02-b13
          speaker: mary_lennox
          text: “真奇怪。本·韦瑟斯塔夫说没有门，这里的确也没有。可十年前一定有过，因为克雷文先生把钥匙埋了。”
        - id: ch02-b14
          speaker: narrator
          text: 这件事够她想上很久。玛丽渐渐来了兴致，觉得来到米塞尔思韦特庄园，也没那么令人遗憾了。在印度，她总是热得浑身发懒，对什么都提不起精神。如今，荒原上的清风正在扫掉她小脑袋里的蛛网，让她一点点醒过来。
    - id: ch03
      title: 花园的往事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 那天，玛丽几乎一直待在户外。晚上吃饭时，她又饿又困，浑身舒坦。玛莎在一旁说个不停，她不但没烦，反而有点喜欢听了。饭后，玛丽坐到炉火前的地毯上，终于问出一直惦记的事。
        - id: ch03-b02
          speaker: mary_lennox
          text: “克雷文先生为什么恨那座花园？”
        - id: ch03-b03
          speaker: narrator
          text: 玛丽要玛莎留下，玛莎也乐意。她还年轻，早就习惯了家里那间挤满兄弟姐妹的小屋。楼下宽敞的仆人大厅反倒叫她觉得无聊。那里的男仆和资历较深的女仆会取笑她的约克郡口音，把她当成粗鄙的小丫头，还总坐在一起说悄悄话，不肯理她。玛莎爱说话，而这个在印度住过、让“黑人”伺候长大的怪孩子，也新奇得足够吸引她。她没等人请，就在壁炉前坐了下来。
        - id: ch03-b04
          speaker: martha
          text: “你还在想着那座花园？我早知道你会想。我头一次听说时，也跟你一样。”
        - id: ch03-b05
          speaker: mary_lennox
          text: “他为什么恨它？”
        - id: ch03-b06
          speaker: narrator
          text: 玛莎把脚收在身下，舒舒服服地坐好。
        - id: ch03-b07
          speaker: martha
          text: “听听风绕着宅子呜嗷呜嗷地叫吧。今晚要是站在荒原上，人准会被吹得连脚都立不住。”
        - id: ch03-b08
          speaker: narrator
          text: 玛丽原先不懂“呜嗷呜嗷”是什么，侧耳听过便明白了。那是一种空洞又让人发颤的吼声。它绕着屋子冲撞，仿佛那个看不见的巨人正在捶打墙壁和窗户，拼命想闯进来。可人知道它进不来。坐在燃着红煤火的房间里，听着这样的风声，反而觉得格外安全，也格外温暖。
        - id: ch03-b09
          speaker: mary_lennox
          text: “可他到底为什么这么恨它？”
        - id: ch03-b10
          speaker: narrator
          text: 玛丽非要弄清玛莎知不知道。玛莎只好把自己知道的全说了。
        - id: ch03-b11
          speaker: martha
          text: “你可记住，梅德洛克太太不许我们谈这件事。这宅子里有好多事都不准议论，是克雷文先生亲自下的命令。他说，他的苦处不关仆人的事。可要不是那座花园，他也不会变成今天这样。那花园是克雷文太太的。他们刚结婚时，她亲手把那里布置起来，可喜欢它了。他们夫妻俩亲自照料花草，谁也不许园丁进去。两个人一进门就把门关上，在里面待好几个钟头，一起读书，一起说话。”
        - id: ch03-b12
          speaker: martha
          text: “克雷文太太那时还是个年轻姑娘。园里有棵老树，一根树枝弯下来，就像一个座位。她让玫瑰沿着树枝爬，还常常坐在那里。可有一天，她坐着的时候，树枝断了。她摔到地上，伤得太重，第二天就去世了。医生们都怕克雷文先生会发疯，连他也活不成。所以他才恨那花园。从那以后，再也没人进去，他也不许任何人提起。”
        - id: ch03-b13
          speaker: narrator
          text: 玛丽没再问。她望着红红的炉火，听外面的风呜嗷呜嗷地吼。那声音仿佛比刚才更响了。
        - id: ch03-b14
          speaker: narrator
          text: 就在这时，一件很好的事正在玛丽身上发生。其实，来到米塞尔思韦特以后，她身上已经有了四件好事。她觉得自己听懂了知更鸟，知更鸟也懂她。她在风里奔跑，直到血液暖起来。她生平第一次感到健康的饥饿。她还终于知道，为别人难过是什么滋味。玛丽正在一点点变好。
    - id: ch04
      title: 走廊里的哭声
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 玛丽听着风，渐渐又听见了别的声音。起初，那动静几乎和风混在一起，根本分不清是什么。它很奇怪，听起来像有个孩子正在什么地方哭。有时，风声的确像孩子的哭声。可没过多久，玛丽便十分确定，这声音不是来自屋外，而是在宅子里面。虽然很远，却的确在屋里。她转身看着玛莎。
        - id: ch04-b02
          speaker: mary_lennox
          text: “你听见有人在哭吗？”
        - id: ch04-b03
          speaker: narrator
          text: 玛莎一下子慌乱起来。
        - id: ch04-b04
          speaker: martha
          text: “没有，是风。有时候，风听起来就像有人迷失在荒原上哭。它什么声音都能发出来。”
        - id: ch04-b05
          speaker: mary_lennox
          text: “可你听，声音就在宅子里，在那些长走廊中的一条里面。”
        - id: ch04-b06
          speaker: narrator
          text: 就在这时，楼下什么地方准是有人打开了一扇门。猛烈的穿堂风沿过道直冲过来，砰的一声撞开她们房间的门。两个人都吓得跳了起来，灯也被风吹灭。哭声随着风卷过远处的走廊，这一回，她们听得比先前任何时候都清楚。
        - id: ch04-b07
          speaker: mary_lennox
          text: “听见了吧！我早就告诉你了！真的有人在哭，而且不是大人。”
          emotion: surprised
        - id: ch04-b08
          speaker: narrator
          text: 玛莎跑去关门，又转动钥匙上了锁。可门还没关好，她们便听见远处某条过道里也有一扇门砰然合上。接着，一切都安静了。就连风也停了一会儿，不再呜嗷呜嗷地吼。
        - id: ch04-b09
          speaker: martha
          text: “那就是风。就算不是，也是洗碗间的小女仆贝蒂·巴特沃思。她牙疼了一整天。”
        - id: ch04-b10
          speaker: narrator
          text: 玛莎说得很固执，神情却又不安，又别扭。玛丽小姐目不转睛地盯着她。她根本不相信玛莎说的是真话。
