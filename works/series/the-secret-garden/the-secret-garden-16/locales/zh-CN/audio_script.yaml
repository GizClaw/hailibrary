audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
    martha:
      display_name: 玛莎
      tts: {delivery: 爽直热情，带亲切的约克郡乡音, timbre: 明亮朴实, pace: 轻快, pitch: 中高音}
    dickon:
      display_name: 迪肯
      tts: {delivery: 质朴自在，带浓重而亲切的约克郡乡音, timbre: 清亮温厚，带荒原少年的蓬勃气息, pace: 轻快从容, pitch: 中高音}
    nurse:
      display_name: 护士
      tts: {delivery: 直率刻薄，笑声里带着看热闹的轻快, timbre: 洪亮爽脆, pace: 中等偏快, pitch: 中音}
    mr_craven:
      display_name: 克雷文先生
      tts: {delivery: 疲惫疏离，问话简短克制, timbre: 低沉暗哑, pace: 缓慢, pitch: 低音}
  chapters:
    - id: ch01
      title: 忙碌的花园
      blocks:
        - {id: ch01-b01, speaker: narrator, text: 那天早晨，花园里有数不清的活儿。玛丽回宅子时已经晚了，可她只想着赶快回去接着干，直到最后一刻才猛然记起科林。}
        - {id: ch01-b02, speaker: mary_lennox, text: “你去告诉科林，我现在还不能看他。花园里忙得很。”}
        - {id: ch01-b03, speaker: narrator, text: 玛莎听了，脸上露出几分害怕。}
        - {id: ch01-b04, speaker: martha, text: “哎呀，玛丽小姐，我这样一说，他怕是又要大发脾气啦。”}
        - {id: ch01-b05, speaker: narrator, text: 可玛丽不像别人那样怕科林。她也从来不是个肯委屈自己、处处迁就别人的人。}
        - {id: ch01-b06, speaker: mary_lennox, text: “我不能留下，迪肯还等着我呢。”}
        - {id: ch01-b07, speaker: narrator, text: 说完，玛丽就跑了。下午比早晨更美，也更忙。杂草差不多清光了，大部分玫瑰和树木也修剪过，根旁的土都松过了。迪肯带来自己的铁锹，还一样一样教会玛丽怎么用她的工具。现在已经看得出来，这个可爱的野园子不会变成一座整整齐齐、全由园丁安排好的花园。不过等春天过去，它准会成为一片草木旺盛的荒野。}
        - {id: ch01-b08, speaker: dickon, text: “到时候，咱们头顶会开满苹果花和樱桃花。墙边的桃树、李树也会开花，草地上会铺起一层花毯。”}
        - {id: ch01-b09, speaker: narrator, text: 小狐狸上尉和乌鸦煤烟跟两个孩子一样忙得快快活活。知更鸟和伴儿来回飞过，像一道道小闪电。煤烟有时拍着黑翅膀，飞出花园，越过园林里的树梢。每次回来，它都会落到迪肯身旁，接连嘎嘎叫上几声，像是在从头讲自己的历险。迪肯也认真跟它说话，就像他跟知更鸟说话一样。}
        - {id: ch01-b10, speaker: narrator, text: 有一回，迪肯忙得没来得及答它，煤烟便飞上他的肩，用大嘴轻轻拽了拽他的耳朵。玛丽想歇一会儿时，迪肯就陪她坐在树下。有一次，他还掏出笛子，吹起轻柔而奇异的短曲。两只松鼠马上出现在墙头，望着他，听着他。}
        - {id: ch01-b11, speaker: dickon, text: “你比从前结实多啦。瞧你这模样，真的开始变了。”}
        - {id: ch01-b12, speaker: narrator, text: 玛丽挖着土，脸颊因为干活和快活而亮起来。}
        - {id: ch01-b13, speaker: mary_lennox, text: “我一天比一天胖。梅德洛克太太该给我做几件大裙子了。玛莎说，我的头发也越来越厚，不再又扁又稀，紧贴在头上。” , emotion: happy}
        - {id: ch01-b14, speaker: narrator, text: 两人分手时，太阳已经往下沉了，深金色的光从树木底下斜照进来。}
        - {id: ch01-b15, speaker: dickon, text: “明儿会是个好天。太阳一出来，我就来干活。”}
        - {id: ch01-b16, speaker: mary_lennox, text: “我也来。”}
    - id: ch02
      title: 两个自私的孩子
      blocks:
        - {id: ch02-b01, speaker: narrator, text: 玛丽一路飞奔回宅子。她想把迪肯的狐狸、乌鸦，还有春天带来的变化都讲给科林听。他准会喜欢。可她推开自己的房门，却看见玛莎愁眉苦脸地等在那里，心里立刻不大痛快。}
        - {id: ch02-b02, speaker: mary_lennox, text: “出什么事了？你说我来不了时，科林怎么回答？”}
        - {id: ch02-b03, speaker: martha, text: “哎呀，真希望你当时去了。他差一点就发作，大家忙了一个下午才让他安静下来。他一直盯着钟看呢。”}
        - {id: ch02-b04, speaker: narrator, text: 玛丽抿紧嘴。她和科林一样，不习惯替别人着想。凭什么让一个坏脾气的男孩，耽误自己最喜欢的事？那些久病又神经紧张的人其实很可怜。他们不知道自己能管住脾气，也不必害得旁人跟着生病、跟着紧张。玛丽对此一点也不懂。以前在印度，她只要头痛，就会想方设法叫身边每个人也头痛，或者至少碰上一件同样难受的事。她那时觉得自己完全有理。可现在，她当然认为完全没道理的是科林。}
        - {id: ch02-b05, speaker: narrator, text: 玛丽走进科林的房间。他不在长沙发上，而是仰面躺在床上，连头也不肯转过来。这可不是个好开头。玛丽板着身子，径直走到床前。}
        - {id: ch02-b06, speaker: mary_lennox, text: “你为什么没有起来？”}
        - {id: ch02-b07, speaker: colin_craven, text: “早晨我以为你会来，已经起来了。下午我的背疼，头也疼，人又累，就叫他们把我抬回床上。你为什么没来？”}
        - {id: ch02-b08, speaker: mary_lennox, text: “我跟迪肯在花园里干活。”}
        - {id: ch02-b09, speaker: narrator, text: 科林皱起眉头，这才勉强赏给她一眼。}
        - {id: ch02-b10, speaker: colin_craven, text: “你要是只顾着陪那小子，不肯来跟我说话，我就不准他到这里来。”}
        - {id: ch02-b11, speaker: narrator, text: 玛丽顿时火冒三丈。她发火时用不着大吵大闹，只会变得尖刻又倔强，什么后果都不在乎。}
        - {id: ch02-b12, speaker: mary_lennox, text: “你敢赶走迪肯，我就再也不进这间房！” , emotion: angry}
        - {id: ch02-b13, speaker: colin_craven, text: “只要我想见你，你就得来。”}
        - {id: ch02-b14, speaker: mary_lennox, text: “我不！” , emotion: angry}
        - {id: ch02-b15, speaker: colin_craven, text: “我会逼你来。他们会把你拖进来。”}
        - {id: ch02-b16, speaker: mary_lennox, text: “是吗，王公大人！他们能把我拖进来，可谁也不能逼我说话。我会咬紧牙关坐着，一个字也不告诉你。我连看都不看你，只盯住地板！” , emotion: angry}
        - {id: ch02-b17, speaker: narrator, text: 这和和气气的一对就这么互相瞪着。要是两个街头小子，早就扑上去扭打成一团了。他们眼下做的，也就仅次于此。}
        - {id: ch02-b18, speaker: colin_craven, text: “你这个自私鬼！” , emotion: angry}
        - {id: ch02-b19, speaker: mary_lennox, text: “那你是什么？自私的人才总爱骂别人自私。谁不照他们的心意做，谁就是自私。你比我自私得多。你是我见过最自私的男孩。” , emotion: angry}
        - {id: ch02-b20, speaker: colin_craven, text: “我才不是！我可没有你那位了不起的迪肯自私。他明知道我孤零零一个人，还拉你到泥地里玩。要说自私，就是他！” , emotion: angry}
        - {id: ch02-b21, speaker: narrator, text: 玛丽眼里直冒火。}
        - {id: ch02-b22, speaker: mary_lennox, text: “他比世上任何男孩都好！他……他简直像个天使！” , emotion: angry}
        - {id: ch02-b23, speaker: narrator, text: 这话听着也许有点傻，可玛丽一点也不在乎。}
        - {id: ch02-b24, speaker: colin_craven, text: “好一个天使！他不过是荒原上一户普通人家的小子！” , emotion: angry}
        - {id: ch02-b25, speaker: mary_lennox, text: “他比一个普通王公强多了，强上一千倍！” , emotion: angry}
        - {id: ch02-b26, speaker: narrator, text: 玛丽身体更强健，渐渐占了上风。科林一辈子从没跟一个像自己这样的孩子吵过架。总的说来，这次争吵对他倒很有好处，只是两个孩子谁也不知道。他在枕头上扭过脸，闭起眼睛。一大滴眼泪从眼角挤出来，滚过面颊。他开始替自己难过了，心疼的却只有自己。}
        - {id: ch02-b27, speaker: colin_craven, text: “我才没你自私。我一直生病，而且我敢肯定，背上的包就要长出来了。再说，我还会死。” , emotion: sad}
        - {id: ch02-b28, speaker: mary_lennox, text: “你才不会！”}
        - {id: ch02-b29, speaker: narrator, text: 科林气得把眼睛睁得滚圆。他从来没听过有人说他不会死。于是他立刻暴跳如雷，心里却又有一点高兴。一个人要是真的能在同一刻又怒又喜，他此刻就是这样。}
        - {id: ch02-b30, speaker: colin_craven, text: “我不会？我会！你明明知道！人人都这么说。” , emotion: angry}
        - {id: ch02-b31, speaker: mary_lennox, text: “我不信！你只是想让大家可怜你。我看你还觉得这事很了不起呢。我就是不信！你要是个讨人喜欢的男孩，也许真会死。可你实在太讨厌了！” , emotion: angry}
        - {id: ch02-b32, speaker: narrator, text: 科林全然不顾那病弱的背，怒气冲冲地坐起来，倒显得健康极了。}
        - {id: ch02-b33, speaker: colin_craven, text: “滚出我的房间！” , emotion: angry}
        - {id: ch02-b34, speaker: narrator, text: 他抓起枕头朝玛丽扔去，可力气太小，枕头只落在她脚边。玛丽的脸已经绷得像一把胡桃钳。}
        - {id: ch02-b35, speaker: mary_lennox, text: “我这就走，而且再也不回来！” , emotion: angry}
        - {id: ch02-b36, speaker: narrator, text: 她大步走到门前，又回过身。}
        - {id: ch02-b37, speaker: mary_lennox, text: “我本来要告诉你好多有趣的事。迪肯带来了狐狸和乌鸦，我本想把它们的事全讲给你听。现在我一个字也不说了！” , emotion: angry}
    - id: ch03
      title: 门外的护士
      blocks:
        - {id: ch03-b01, speaker: narrator, text: 玛丽迈着大步出去，关上房门。没想到，受过专门训练的护士就站在外面，仿佛一直在偷听。更想不到的是，她居然在笑。这个年轻女人高大漂亮，却实在不该做护士。她受不了病人，总找借口离开科林，把他推给玛莎，或是随便哪个肯替她的人。玛丽从来不喜欢她，此刻只抬头盯着她，看她拿手帕掩住嘴，笑个不停。}
        - {id: ch03-b02, speaker: mary_lennox, text: “你在笑什么？”}
        - {id: ch03-b03, speaker: nurse, text: “笑你们两个小家伙。让一个同样娇纵的孩子站出来反抗他，对这个病恹恹、宠坏了的小东西再好不过。”}
        - {id: ch03-b04, speaker: narrator, text: 护士又躲在手帕后面笑了起来。}
        - {id: ch03-b05, speaker: nurse, text: “他要是有个小泼妇似的妹妹，天天跟他吵架，早就把他救过来了。”}
        - {id: ch03-b06, speaker: mary_lennox, text: “他会死吗？”}
        - {id: ch03-b07, speaker: nurse, text: “不知道，我也不在乎。他的病有一半不过是歇斯底里和坏脾气。”}
        - {id: ch03-b08, speaker: mary_lennox, text: “歇斯底里是什么？”}
        - {id: ch03-b09, speaker: nurse, text: “以后你再把他惹到发作，自然就知道了。不过，你已经给了他一件值得闹歇斯底里的事，我倒很高兴。”}
        - {id: ch03-b10, speaker: narrator, text: 玛丽回到自己房间，心情跟刚从花园回来时完全不同。她又恼火又失望，对科林却一点也不觉得抱歉，更没有半分同情。她本来一直盼着讲给他许多事，还想仔细拿定主意，能不能放心把那个天大的秘密交给他。她一度觉得可以，现在却彻底改了主意。她永远也不告诉他。他尽可以一直待在房里，永远不呼吸新鲜空气，爱死就死吧。那是他活该！}
        - {id: ch03-b11, speaker: narrator, text: 玛丽又尖刻又冷酷。有那么几分钟，她几乎忘了迪肯，忘了正悄悄爬遍世界的绿色薄纱，也忘了从荒原吹来的柔风。}
    - id: ch04
      title: 克雷文先生的礼物
      blocks:
        - {id: ch04-b01, speaker: narrator, text: 玛莎在房里等着。她脸上的忧虑暂时不见了，只剩下兴趣和好奇。桌上摆着一个木箱，盖子已经打开，里面装着一包包整整齐齐的东西。}
        - {id: ch04-b02, speaker: martha, text: “克雷文先生送给你的。看起来像是几本带图画的书。”}
        - {id: ch04-b03, speaker: narrator, text: 玛丽想起去克雷文先生房间的那一天，他问过她想要什么。}
        - {id: ch04-b04, speaker: mr_craven, text: “你有没有想要的东西？洋娃娃、玩具，或者书？”}
        - {id: ch04-b05, speaker: narrator, text: 她打开包裹，猜他会不会送来一个洋娃娃，也在想如果真有一个，自己该拿它怎么办。箱子里并没有娃娃，却有好几本像科林那些一样漂亮的书，其中两本讲花园，满是图画。还有两三样游戏，以及一只精美的小写字匣。匣子上镶着金色花押字，里面装着一支金笔和一方墨水台。}
        - {id: ch04-b06, speaker: narrator, text: 样样东西都那么好。玛丽心里的欢喜越来越满，渐渐把怒气挤了出去。她根本没料到克雷文先生还会记得自己，那颗冷硬的小心也暖了起来。}
        - {id: ch04-b07, speaker: mary_lennox, text: “我写连笔字比写印刷体好看。我要用这支笔先写一封信，告诉他我十分感激。” , emotion: happy}
        - {id: ch04-b08, speaker: narrator, text: 如果玛丽和科林还是朋友，她一定早跑去给他看礼物了。他们会一起看图画，读那几本讲花园的书，也许还会试着玩那些游戏。科林一定会快活得一次也想不起自己就要死了，也不会再伸手去摸脊背，看看那里是不是要鼓出一个包来。他常常这么做，玛丽实在受不了。科林摸背时总显得万分恐惧，害得她也又难受又害怕。}
        - {id: ch04-b09, speaker: narrator, text: 科林说，要是哪天摸到一点点凸起，就说明驼背已经开始长了。他无意间听见梅德洛克太太对护士低声说话，从中生出了这个念头。他一个人偷偷在心里反复琢磨，最后把它想得牢牢的，认定这件事一定会发生。梅德洛克太太说过，他父亲小时候，背脊就是这样开始显出弯曲的。科林只对玛丽承认过，大人所谓的脾气发作，多半都来自他心底那份歇斯底里的隐秘恐惧。那一次，玛丽的确替他难过。}
        - {id: ch04-b10, speaker: mary_lennox, text: “他一生气，或者累了，就会开始想这件事。今天他发了脾气。也许……也许他整个下午都在想。”}
        - {id: ch04-b11, speaker: narrator, text: 玛丽一动不动地站在那里，低头望着脚下的地毯，仍皱着眉想了又想。}
        - {id: ch04-b12, speaker: mary_lennox, text: “我说过再也不回去……不过，也许，只是也许，明天早晨我会去看看……看他想不想见我。也许他又会拿枕头砸我，可是……我想……我还是会去。”}
