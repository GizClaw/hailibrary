audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    martha:
      display_name: Martha Sowerby
      tts:
        delivery: cheerful, candid, and easy in Yorkshire character
        timbre: bright and wholesome
        pace: lively
        pitch: medium-high
    colin:
      display_name: Colin Craven
      tts:
        delivery: commanding, fretful, and intensely curious
        timbre: delicate and clear
        pace: measured
        pitch: high
    dickon:
      display_name: Dickon Sowerby
      tts:
        delivery: gentle, openhearted, and easy in Yorkshire character
        timbre: fresh and warm
        pace: relaxed
        pitch: medium-high
    nurse:
      display_name: Colin's Nurse
      tts:
        delivery: blunt, amused, and professionally detached
        timbre: full and confident
        pace: moderately brisk
        pitch: medium
  chapters:
    - id: ch01
      title: A Busy Day in the Garden
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            There was so much to do in the garden that morning that Mary came back to the house late. She was hurrying to return to her work, and she forgot all about Colin until the very last moment.
        - id: ch01-b02
          speaker: mary
          text: >-
            Tell Colin I can't visit him yet. I'm very busy in the garden.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Martha looked worried.
        - id: ch01-b04
          speaker: martha
          text: >-
            Eh, Miss Mary, he may be in a terrible temper when I tell him that.
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: >-
            But Mary did not fear Colin the way everyone else did. And she was not the sort of person who gave up what she wanted for someone else.
        - id: ch01-b06
          speaker: mary
          text: >-
            I can't stay. Dickon's waiting for me.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Then she ran away. The afternoon was lovelier and even busier than the morning. They had pulled nearly all the weeds. Most of the roses and trees had been pruned, and the earth around them had been dug. Dickon had brought his own spade, and he had shown Mary how to use every one of her tools. The lovely wild place would never look like a proper gardener's garden. But before spring was over, it would be a wilderness filled with growing things.
        - id: ch01-b08
          speaker: dickon
          text: >-
            There'll be apple and cherry blossoms over our heads. The peach and plum trees will bloom along the walls, and flowers will cover the grass like a carpet.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The little fox and the rook were just as happy and busy as the children. The robin and his mate darted back and forth like tiny flashes of lightning. Now and then, Soot spread his black wings and flew over the treetops in the park. Whenever he returned, he perched near Dickon and cawed several times, as though he were telling the story of his adventures. Dickon answered him just as he answered the robin.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Once, Dickon was too busy to answer right away. Soot landed on his shoulder and gently tugged his ear with his big beak. When Mary needed a rest, she and Dickon sat beneath a tree. Dickon took the pipe from his pocket and played its soft, strange little notes. Two squirrels appeared on the wall and stayed to look and listen.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Later, Dickon watched Mary digging.
        - id: ch01-b12
          speaker: dickon
          text: >-
            You're a good bit stronger than you were. You're surely starting to look different, too.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Exercise and happiness had made Mary's face glow.
        - id: ch01-b14
          speaker: mary
          text: >-
            I'm getting fatter every day! Mrs. Medlock will have to buy me bigger dresses. Martha says my hair is getting thicker, too. It isn't so flat and stringy now.
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: >-
            The sun was beginning to set when they said good-bye. Deep golden rays slanted beneath the trees.
        - id: ch01-b16
          speaker: dickon
          text: >-
            Tomorrow will be fine. I'll start work at sunrise.
        - id: ch01-b17
          speaker: mary
          text: >-
            So will I.
    - id: ch02
      title: Mary and Colin Quarrel
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Mary ran back to the house as fast as she could. She wanted to tell Colin about Dickon's fox cub and the rook, and about everything spring was doing. She was sure he would enjoy hearing it. So when she opened her bedroom door, it was not pleasant to find Martha waiting with a gloomy face.
        - id: ch02-b02
          speaker: mary
          text: >-
            What's wrong? What did Colin say when you told him I couldn't come?
        - id: ch02-b03
          speaker: martha
          text: >-
            Eh, I wish you'd gone to him. He nearly had one of his tantrums. We've had an awful time keeping him quiet all afternoon. He wouldn't stop watching the clock.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Mary's lips pressed into a thin line. She was no more used to thinking about other people than Colin was. She could not see why a bad-tempered boy should interrupt the thing she loved best.
        - id: ch02-b05
          speaker: narrator
          text: >-
            She did not understand how pitiful life could be for people who were sick and nervous. They did not know they could control their tempers, or that they did not have to make everyone around them sick and nervous, too. Back in India, whenever Mary had a headache, she had tried her best to make sure everyone else had a headache, or something just as bad. She had thought she was perfectly right then. Now, of course, she thought Colin was perfectly wrong.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Colin was not on his sofa when Mary entered his room. He lay flat on his back in bed and did not even turn toward her. It was a bad beginning. Mary marched up to him in her stiff way.
        - id: ch02-b07
          speaker: mary
          text: >-
            Why didn't you get up?
        - id: ch02-b08
          speaker: colin
          text: >-
            I did get up this morning because I thought you were coming. This afternoon I made them put me back in bed. My back hurt, and my head hurt, and I was tired. Why didn't you come?
        - id: ch02-b09
          speaker: mary
          text: >-
            I was working in the garden with Dickon.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Colin frowned. At last, he bothered to look at her.
        - id: ch02-b11
          speaker: colin
          text: >-
            Then I won't allow that boy to come here. Not if you're going to stay with him instead of talking to me.
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: >-
            Mary flew into one of her finest rages. Her rages did not have to be noisy. She simply turned sour and stubborn, and she stopped caring what happened.
        - id: ch02-b13
          speaker: mary
          text: >-
            If you send Dickon away, I will never come into this room again!
          emotion: angry
        - id: ch02-b14
          speaker: colin
          text: >-
            You'll have to come if I say so.
        - id: ch02-b15
          speaker: mary
          text: >-
            I won't!
          emotion: angry
        - id: ch02-b16
          speaker: colin
          text: >-
            I'll make you. They'll drag you in here.
          emotion: angry
        - id: ch02-b17
          speaker: mary
          text: >-
            Will they, Mr. Rajah? They can drag me in, but they can't make me talk. I'll clench my teeth and refuse to tell you anything. I won't even look at you. I'll stare at the floor!
          emotion: angry
        - id: ch02-b18
          speaker: narrator
          text: >-
            What a pleasant pair they were, glaring at each other. If they had been two boys fighting in the street, they would have leaped at each other and rolled on the ground. Instead, they did the next closest thing.
        - id: ch02-b19
          speaker: colin
          text: >-
            You're selfish!
          emotion: angry
        - id: ch02-b20
          speaker: mary
          text: >-
            And what are you? Selfish people always call everyone else selfish when they don't get their way. You're worse than I am. You're the most selfish boy I've ever seen.
          emotion: angry
        - id: ch02-b21
          speaker: colin
          text: >-
            I am not! I'm not as selfish as your wonderful Dickon. He keeps you out there playing in the dirt even though he knows I'm here alone. He's the selfish one!
          emotion: angry
        - id: ch02-b22
          speaker: narrator
          text: >-
            Mary's eyes flashed.
        - id: ch02-b23
          speaker: mary
          text: >-
            He's nicer than any boy who ever lived! He's... he's like an angel!
          emotion: angry
        - id: ch02-b24
          speaker: narrator
          text: >-
            It may have sounded silly, but Mary did not care.
        - id: ch02-b25
          speaker: colin
          text: >-
            Some angel! He's only a common cottage boy from the moor.
          emotion: angry
        - id: ch02-b26
          speaker: mary
          text: >-
            He's better than a common Rajah. A thousand times better!
          emotion: angry
        - id: ch02-b27
          speaker: narrator
          text: >-
            Mary was stronger, and she was beginning to win the fight. Colin had never argued with anyone like himself before. On the whole, it was rather good for him, though neither child knew that. He turned his face into the pillow and closed his eyes. One large tear squeezed out and ran down his cheek. He was starting to feel sorry for himself, though not for anyone else.
        - id: ch02-b28
          speaker: colin
          text: >-
            I'm not as selfish as you. I'm always sick, and I'm sure a lump is growing on my back. Besides, I'm going to die.
          emotion: sad
        - id: ch02-b29
          speaker: mary
          text: >-
            No, you're not!
          emotion: angry
        - id: ch02-b30
          speaker: narrator
          text: >-
            Colin's eyes opened wide with outrage. No one had ever said such a thing to him. He was furious, but a little pleased at the same time, if anyone can feel both at once.
        - id: ch02-b31
          speaker: colin
          text: >-
            I'm not? I am! You know I am. Everybody says so!
          emotion: angry
        - id: ch02-b32
          speaker: mary
          text: >-
            I don't believe you. You only say it so people will feel sorry for you. I think you're proud of it. If you were a nice boy, maybe it would be true. But you're much too nasty!
          emotion: angry
        - id: ch02-b33
          speaker: narrator
          text: >-
            In spite of his supposedly weak back, Colin sat straight up in a very healthy rage.
        - id: ch02-b34
          speaker: colin
          text: >-
            Get out of my room!
          emotion: angry
        - id: ch02-b35
          speaker: narrator
          text: >-
            He grabbed his pillow and threw it at her. He was not strong enough to throw it far, so it dropped at Mary's feet. Her face tightened until it looked like a nutcracker.
        - id: ch02-b36
          speaker: mary
          text: >-
            I'm leaving. And I won't come back!
          emotion: angry
        - id: ch02-b37
          speaker: narrator
          text: >-
            Mary walked to the door. When she reached it, she turned around for one last word.
        - id: ch02-b38
          speaker: mary
          text: >-
            I was going to tell you all kinds of wonderful things. Dickon brought his fox and his rook, and I was going to tell you everything about them. Now I won't tell you one single thing!
          emotion: angry
        - id: ch02-b39
          speaker: narrator
          text: >-
            She marched out and shut the door behind her.
    - id: ch03
      title: The Nurse in the Hall
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            To Mary's great surprise, Colin's trained nurse was standing in the hall as if she had been listening. More surprising still, she was laughing. She was a large, handsome young woman who should never have become a nurse. She could not stand sick people, and she was always finding reasons to leave Colin with Martha or anyone else who would take her place. Mary had never liked her. Now she stared up while the nurse giggled into her handkerchief.
        - id: ch03-b02
          speaker: mary
          text: >-
            What are you laughing at?
        - id: ch03-b03
          speaker: nurse
          text: >-
            At the two of you. The best thing for that sickly, spoiled boy is someone just as spoiled who'll stand up to him. If he'd had a fierce little sister to fight with, she might have saved him from all this.
          emotion: happy
        - id: ch03-b04
          speaker: narrator
          text: >-
            The nurse laughed into her handkerchief again.
        - id: ch03-b05
          speaker: mary
          text: >-
            Is he going to die?
        - id: ch03-b06
          speaker: nurse
          text: >-
            I don't know, and I don't care. Half his trouble is hysterics and temper.
        - id: ch03-b07
          speaker: mary
          text: >-
            What are hysterics?
        - id: ch03-b08
          speaker: nurse
          text: >-
            You'll find out if you drive him into another tantrum. At least you've finally given him a reason to have hysterics, and I'm glad you did.
    - id: ch04
      title: Perhaps in the Morning
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Mary returned to her room feeling nothing like she had when she first came in from the garden. She was cross and disappointed, but she was not sorry for Colin at all. She had looked forward to telling him so many things. She had even meant to decide whether she could trust him with the great secret. She had been starting to think she could. Now she had changed her mind completely.
        - id: ch04-b02
          speaker: narrator
          text: >-
            She would never tell him. He could stay shut in his room, never breathe fresh air, and die if he wanted to. It would serve him right. For a few minutes, Mary felt so bitter and unforgiving that she almost forgot Dickon, the green veil creeping across the world, and the soft wind blowing in from the moor.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Martha was waiting for her. The worry on Martha's face had given way, for the moment, to interest and curiosity. A wooden box stood on the table with its lid off. Inside were tidy little packages.
        - id: ch04-b04
          speaker: martha
          text: >-
            Mr. Craven sent it to you. It looks like there may be picture books inside.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Mary remembered what Mr. Craven had asked when she visited his room. Had she wanted dolls, toys, or books? As she opened the package, she wondered if he had sent a doll. She also wondered what she would do with one. But there was no doll.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Instead, she found several beautiful books like Colin's. Two were filled with pictures of gardens. There were two or three games, too. And there was a lovely little writing case marked with a gold monogram, along with a gold pen and an inkstand.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Everything was so nice that Mary's pleasure began pushing the anger out of her mind. She had never expected Mr. Craven to remember her at all. Her hard little heart grew quite warm.
        - id: ch04-b08
          speaker: mary
          text: >-
            My handwriting is better than my printing. The first thing I'll write with this pen will be a letter thanking him.
          emotion: happy
        - id: ch04-b09
          speaker: narrator
          text: >-
            If Mary and Colin had still been friends, she would have run straight to him with her presents. Together, they could have looked at the pictures, read the gardening books, and perhaps tried the games. Colin would have enjoyed himself so much that he would not once have thought about dying. He would not have reached around to feel his spine for a growing lump, either.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Mary hated when he did that. It made her frightened and uneasy because Colin always looked so frightened himself. He believed that if he felt even the smallest lump, he would know his back had begun to grow crooked. He had overheard Mrs. Medlock whispering to the nurse. She had said that when Colin's father was a child, the crookedness in his back had first appeared that way.
        - id: ch04-b11
          speaker: narrator
          text: >-
            Colin had thought about those whispered words in secret until the idea felt absolutely certain. He had told no one but Mary that most of his so-called tantrums came from that hidden, hysterical fear. When he had confided in her, Mary had felt sorry for him.
        - id: ch04-b12
          speaker: mary
          text: >-
            He always starts thinking about it when he's cross or tired. And he was cross today. Maybe... maybe he's been thinking about it all afternoon.
        - id: ch04-b13
          speaker: narrator
          text: >-
            She stood still and stared down at the carpet, thinking.
        - id: ch04-b14
          speaker: mary
          text: >-
            I said I'd never go back...
        - id: ch04-b15
          speaker: narrator
          text: >-
            Mary hesitated and drew her brows together.
        - id: ch04-b16
          speaker: mary
          text: >-
            But perhaps, just perhaps, I'll go see if he wants me in the morning. He may try to throw his pillow at me again, but... I think I'll go.
