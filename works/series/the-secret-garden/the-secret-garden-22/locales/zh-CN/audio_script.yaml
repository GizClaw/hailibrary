audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 克制而敏锐，带一点不动声色的讽意, timbre: 温暖清晰, pace: 舒缓中有变化, pitch: 中音}
    mary_lennox:
      display_name: 玛丽·伦诺克斯
      tts: {delivery: 任性强硬，话说得短而直接, timbre: 稚嫩而尖细, pace: 偏快, pitch: 偏高}
    colin_craven:
      display_name: 科林·克雷文
      tts: {delivery: 敏感任性，虚弱中带着惯于命令人的口气, timbre: 清细而略显苍白, pace: 偏慢且时有急促, pitch: 中高音}
    dickon:
      display_name: 迪肯
      tts: {delivery: 质朴自在，带浓重而亲切的约克郡乡音, timbre: 清亮温厚，带荒原少年的蓬勃气息, pace: 轻快从容, pitch: 中高音}
    ben_weatherstaff:
      display_name: 本·韦瑟斯塔夫
      tts: {delivery: 粗声直率，约克郡口音浓重，偶尔透出温柔, timbre: 苍老粗粝, pace: 偏慢, pitch: 低音}
  chapters:
    - id: ch01
      title: 站在树下
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 本的脑袋一从墙头消失，科林就叫玛丽去接他。玛丽飞快跑过草地，直奔常春藤下的门。迪肯留下来，仔细盯着科林。科林两颊通红，样子虽然惊人，却站得稳稳的。
        - id: ch01-b02
          speaker: colin_craven
          text: “我能站住。”
        - id: ch01-b03
          speaker: narrator
          text: 科林高高仰着头，说得很有气势。
        - id: ch01-b04
          speaker: dickon
          text: “俺说过，你只要不害怕，就能站起来。如今你不怕啦。”
        - id: ch01-b05
          speaker: colin_craven
          text: “对，我已经不怕了。可你是不是在施魔法？”
        - id: ch01-b06
          speaker: narrator
          text: 科林猛然想起玛丽说过的话。迪肯弯弯的嘴一下咧开，笑得很快活。他用厚靴子轻轻碰了碰草地上的一簇番红花。
        - id: ch01-b07
          speaker: dickon
          text: “施魔法的是你自个儿。让这些花从土里钻出来的，也是同一种魔法。”
        - id: ch01-b08
          speaker: narrator
          text: 科林低头看着花，慢慢点头。
        - id: ch01-b09
          speaker: colin_craven
          text: “是啊。不会有比这更大的魔法了。”
        - id: ch01-b10
          speaker: narrator
          text: 他把身子挺得更直，指向几英尺外的一棵树。
        - id: ch01-b11
          speaker: colin_craven
          text: “我要走到那棵树边。韦瑟斯塔夫进来时，我要站着给他看。我可以靠着树歇一歇，可只有我自己想坐时才坐。先去拿轮椅上的毯子。”
        - id: ch01-b12
          speaker: narrator
          text: 迪肯扶住科林的胳膊，陪他一步步走到树边。科林稳得出奇，没有一点要倒下的样子。他靠住树干，身子依旧挺得笔直。旁人不细看，根本瞧不出他借了树的力气。这样一站，他显得很高。
        - id: ch01-b13
          speaker: narrator
          text: 本从墙门走进来，一眼看见那道又高又瘦、直直站着的身影，也听见玛丽在旁边低声念叨。他的眼睛只顾追着科林，从那双踩在草地上的脚，一直看到高高仰起的头和骄傲的脸。他不愿分心，便有些不耐烦地问玛丽在说什么。玛丽没有回答，只顾把那些话一遍遍送给科林。
        - id: ch01-b14
          speaker: mary_lennox
          text: “你能做到！你能做到！我早就说过你能。你一定能！”
        - id: ch01-b15
          speaker: narrator
          text: 她相信这些话能变成魔法，把科林稳稳托在脚上。她无论如何也受不了科林在本面前倒下。科林果然没有倒。玛丽越看越振奋，忽然觉得他虽然瘦，这时却漂亮极了。科林则用那副古怪的小主人神气盯紧了本。
        - id: ch01-b16
          speaker: colin_craven
          text: “看着我！从头到脚看清楚。我是驼背吗？我的腿是弯的吗？”
    - id: ch02
      title: 老园丁的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 本还没有从方才的激动里完全缓过来，不过说话已经差不多恢复了平日那股粗声粗气。
        - id: ch02-b02
          speaker: ben_weatherstaff
          text: “你当然不是。压根儿没那回事。你干吗一直躲着不见人，让外头那些人以为你又瘸又傻？”
        - id: ch02-b03
          speaker: colin_craven
          text: “傻？是谁这样想的？”
          emotion: angry
        - id: ch02-b04
          speaker: ben_weatherstaff
          text: “一大群蠢货！世上到处是乱叫的驴子，嘴里没一句真话。可你为啥把自个儿关起来？”
        - id: ch02-b05
          speaker: colin_craven
          text: “人人都说我会死。可我不会！”
        - id: ch02-b06
          speaker: narrator
          text: 这句话说得斩钉截铁，仿佛死亡这件事已经由科林自己否决了。本听得出了神，把他从头看到脚，又从脚看到头，来来回回看了个遍。等老人终于开口，神情里带着一丝干巴巴的得意。
        - id: ch02-b07
          speaker: ben_weatherstaff
          text: “你会死？才没那回事！你这娃儿胆气足着呢。刚才你一下把双脚踩到地上，俺就知道你不会有事。来，少爷，先在毯子上坐会儿，再吩咐俺干活。”
        - id: ch02-b08
          speaker: narrator
          text: 老人的暴躁里藏着温情，也带着精明的体谅。方才走过长径时，玛丽已经飞快告诉他，眼下最要紧的只有一件事，那就是科林正在好起来。她说了一遍又一遍，是花园让他好起来的，谁都不能再提醒他驼背和死亡。本显然听懂了。于是，小王公纡尊降贵，在树下的毯子上坐了下来。
        - id: ch02-b09
          speaker: colin_craven
          text: “韦瑟斯塔夫，你平常在花园里做什么？”
        - id: ch02-b10
          speaker: ben_weatherstaff
          text: “人家叫俺做啥，俺就做啥。他们肯留着俺，是看在情分上，因为她喜欢俺。”
        - id: ch02-b11
          speaker: colin_craven
          text: “她是谁？”
        - id: ch02-b12
          speaker: ben_weatherstaff
          text: “你娘。”
        - id: ch02-b13
          speaker: narrator
          text: 科林安静下来，慢慢望过四周。
        - id: ch02-b14
          speaker: colin_craven
          text: “我母亲？这里原来是她的花园，是不是？”
        - id: ch02-b15
          speaker: ben_weatherstaff
          text: “可不是嘛。她喜欢这里喜欢得不得了。”
        - id: ch02-b16
          speaker: colin_craven
          text: “现在它是我的花园了，我也喜欢它。我每天都会来。不过这件事必须保密。谁也不能知道我们来过。迪肯和我表妹让这里重新活了起来。以后我会叫你来帮忙，可你不能让别人看见。”
        - id: ch02-b17
          speaker: narrator
          text: 听完这一串小主人的命令，本那张皱巴巴的脸慢慢扭动起来，最后挤出一抹干干的老笑。
        - id: ch02-b18
          speaker: ben_weatherstaff
          text: “俺从前就来过，也没叫人瞧见。”
        - id: ch02-b19
          speaker: colin_craven
          text: “什么？你什么时候来过？”
          emotion: surprised
        - id: ch02-b20
          speaker: narrator
          text: 本揉着下巴，边回想边打量花园。
        - id: ch02-b21
          speaker: ben_weatherstaff
          text: “上一次大约是两年前。”
        - id: ch02-b22
          speaker: colin_craven
          text: “可十年里根本没人进来过！这里连门都没有！”
          emotion: surprised
        - id: ch02-b23
          speaker: ben_weatherstaff
          text: “俺又不算人。俺也没走门，是翻墙进来的。这两年风湿病才把俺拦住。”
        - id: ch02-b24
          speaker: dickon
          text: “原来那些枝子是你来剪的！俺一直猜不出是谁干的。”
          emotion: surprised
        - id: ch02-b25
          speaker: ben_weatherstaff
          text: “她真的很喜欢这园子，又是那么俊的年轻姑娘。有一次她笑着嘱咐俺，要是她病了，或出了远门，俺就得替她照料玫瑰。后来她真的走了，人家下令谁也不许靠近。可俺偏要来。俺照旧翻墙，每年偷偷干一点活，直到风湿病不许俺再翻。毕竟是她先吩咐俺的。”
        - id: ch02-b26
          speaker: dickon
          text: “难怪花园能活得这么好。俺早就在琢磨是谁帮过它。”
        - id: ch02-b27
          speaker: colin_craven
          text: “韦瑟斯塔夫，我很高兴你来照料过它。你一定知道怎么保守秘密。”
        - id: ch02-b28
          speaker: ben_weatherstaff
          text: “是，少爷，俺知道。再说，像俺这样有风湿病的人，从门里走可省事多啦。”
    - id: ch03
      title: 第一铲泥土
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 玛丽的小铲子落在树边。科林伸手拿起来，脸上浮起一种奇异的神情。他用那只没多少力气的瘦手刨起土来。大家一声不响地看着他的手。本看得满脸兴味，迪肯的圆眼睛里满是热切的好奇，玛丽更是屏住呼吸，一眼也舍不得移开。过了一会儿，科林终于把铲尖压进泥土，翻起了一小块。
        - id: ch03-b02
          speaker: mary_lennox
          text: “你能做到！我告诉你，你一定能！”
        - id: ch03-b03
          speaker: narrator
          text: 玛丽只在心里念。迪肯睁圆了眼睛，又热切又好奇。本也看得津津有味。科林没有停，一铲接一铲地翻土。干过几铲以后，他用自己最拿手的约克郡话，得意地开了口。
        - id: ch03-b04
          speaker: colin_craven
          text: “你说过，要让俺跟旁人一样在这儿走路，还要让俺挖土。俺原以为你只是哄俺高兴。可今儿才是头一天，俺不但走了路，现在还真的在挖土！”
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: 本听见这口约克郡话，嘴巴又张开了，随后却呵呵笑起来。
        - id: ch03-b06
          speaker: ben_weatherstaff
          text: “嗨，听着倒挺机灵。你准是个约克郡小伙子。你也真的在挖土。想不想亲手种点东西？俺能拿一株盆栽玫瑰来。”
        - id: ch03-b07
          speaker: colin_craven
          text: “快去拿！快！”
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: 本连风湿病都忘了，匆匆去取玫瑰。迪肯拿起铁锹，把坑挖得又深又宽。第一次挖土的瘦白双手可做不到这些。玛丽也悄悄溜出去，跑着取来洒水壶。迪肯一挖好，科林马上接过自己的活，一遍又一遍翻动松软的泥土。他抬头望天。哪怕只是这么一点从未有过的活动，也让他脸上泛起红光，眼睛亮得像换了个人。
        - id: ch03-b09
          speaker: colin_craven
          text: “我想赶在太阳完全落下以前，把它种好。”
    - id: ch04
      title: 夕阳西下
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 玛丽望着迟迟不肯落下的太阳，觉得它也许真明白科林的心愿，特意为他们多等了几分钟。本从温室里取来一盆玫瑰。他拖着不灵便的腿，以自己最快的速度穿过草地，连风湿病都顾不上了。他也和孩子们一样兴奋。他跪在坑边，敲碎花盆，让包住根的完整泥团露出来。
        - id: ch04-b02
          speaker: ben_weatherstaff
          text: “来，孩子。你亲手把玫瑰放进土里，就跟国王到了新地方亲手栽树一样。”
        - id: ch04-b03
          speaker: narrator
          text: 科林把玫瑰接过来，小心放进土中，用双手扶住。那双瘦白的手微微发抖，脸上的红晕却越来越深。老本一把把往坑里填土，再仔细压紧，直到花株稳稳立住。玛丽跪在地上，双手撑着身子，探头看个不停。煤灰也从空中落下来，昂首迈步凑到坑边，非要弄明白他们在做什么。坚果和贝壳则待在樱桃树上，对这件新鲜事叽叽喳喳，议论个没完。
        - id: ch04-b04
          speaker: colin_craven
          text: “种好了！太阳才刚滑到天边。迪肯，扶我起来。太阳落下去的时候，我要站着。这也是魔法的一部分。”
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: 迪肯握住他的胳膊，把他扶了起来。那股魔法，不论它究竟是什么，就这样把力量送进了科林的身体。太阳一点点滑下天边，为他们这个奇异而美丽的下午画上句点。可直到最后一线阳光消失，科林仍真的靠着自己的两只脚站在草地上，而且笑出了声。
