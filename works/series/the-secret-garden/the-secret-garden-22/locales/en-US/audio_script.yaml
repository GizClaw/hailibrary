audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, intimate, and story-forward
        timbre: warm and clear
        pace: measured
        pitch: medium
    mary:
      display_name: Mary Lennox
      tts:
        delivery: imperious, clipped, and distinctly childlike
        timbre: thin and sharp
        pace: brisk
        pitch: high
    colin:
      display_name: Colin Craven
      tts:
        delivery: commanding, fretful, and intensely curious
        timbre: delicate and clear
        pace: measured
        pitch: high
    dickon:
      display_name: Dickon Sowerby
      tts:
        delivery: gentle, openhearted, and easy in Yorkshire character
        timbre: fresh and warm
        pace: relaxed
        pitch: medium-high
    ben_weatherstaff:
      display_name: Ben Weatherstaff
      tts:
        delivery: gruff, plainspoken, and dryly expressive in Yorkshire character
        timbre: rough and earthy
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: When the Sun Went Down
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            As soon as Ben Weatherstaff's head disappeared beyond the wall, Colin turned to Mary.
        - id: ch01-b02
          speaker: colin
          text: >-
            Go meet him.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Mary raced across the grass to the ivy-covered door. Dickon stayed beside Colin and watched him closely. Bright red spots burned in Colin's cheeks, and he looked astonishing. Still, he showed no sign that he might fall.
        - id: ch01-b04
          speaker: colin
          text: >-
            I can stand.
        - id: ch01-b05
          speaker: narrator
          text: >-
            He held his head high and said it with great pride.
        - id: ch01-b06
          speaker: dickon
          text: >-
            I told thee tha' could, once tha' quit bein' afraid. An' now tha' has.
        - id: ch01-b07
          speaker: colin
          text: >-
            Yes. I'm not afraid anymore.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Then Colin suddenly remembered something Mary had said.
        - id: ch01-b09
          speaker: colin
          text: >-
            Are you making Magic?
        - id: ch01-b10
          speaker: narrator
          text: >-
            Dickon's curly mouth opened into a cheerful grin.
        - id: ch01-b11
          speaker: dickon
          text: >-
            Tha's makin' Magic thysel'. It's the same Magic that brought these up out o' the earth.
        - id: ch01-b12
          speaker: narrator
          text: >-
            He touched a clump of crocuses in the grass with his heavy boot. Colin looked down at the flowers.
        - id: ch01-b13
          speaker: colin
          text: >-
            Aye. There couldn't be any Magic greater than that. No, there couldn't.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Colin pulled himself even straighter.
        - id: ch01-b15
          speaker: colin
          text: >-
            I'm going to walk over to that tree. When Weatherstaff gets here, he'll see me standing. I may lean against the trunk if I choose. And when I decide to sit, then I'll sit. Not before. Bring the rug from my chair.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Colin walked the few feet to the tree with Dickon holding his arm. He was wonderfully steady. Once he stood against the trunk, you could hardly tell it was supporting him. He kept himself so straight that he seemed tall.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Ben Weatherstaff came through the door in the wall and found Colin waiting there. Mary stood nearby, muttering under her breath. Ben was trying to take in the sight of that long, thin, upright boy and his proud face, and he did not want anything to distract him.
        - id: ch01-b18
          speaker: ben_weatherstaff
          text: >-
            What's tha' sayin'?
        - id: ch01-b19
          speaker: narrator
          text: >-
            Mary did not answer him. Her words were meant for Colin.
        - id: ch01-b20
          speaker: mary
          text: >-
            You can do it! You can do it! I told you that you could! You can do it! You can do it! You can!
        - id: ch01-b21
          speaker: narrator
          text: >-
            She was trying to make Magic and keep Colin standing just as he was. She could not bear to see him give in before Ben Weatherstaff. And Colin did not give in. A sudden rush of feeling lifted Mary. Thin as he was, he looked beautiful to her. Colin fixed his eyes on Ben with that odd, commanding look of his.
        - id: ch01-b22
          speaker: colin
          text: >-
            Look at me! Look at all of me! Is there a hump on my back? Are my legs crooked?
        - id: ch01-b23
          speaker: narrator
          text: >-
            Ben had not entirely recovered from the shock of seeing Colin stand, but now he answered almost like his usual self.
        - id: ch01-b24
          speaker: ben_weatherstaff
          text: >-
            Nay. There's nowt wrong like that. So what have tha' been at, hidin' away and lettin' folk believe tha' was crippled and half-witted?
        - id: ch01-b25
          speaker: colin
          text: >-
            Half-witted! Who believed that?
          emotion: angry
        - id: ch01-b26
          speaker: ben_weatherstaff
          text: >-
            Plenty o' fools. The world's packed with jackasses, all brayin' lies. Why did tha' shut thysel' away?
        - id: ch01-b27
          speaker: colin
          text: >-
            Everyone believed I was going to die. Well, I'm not!
        - id: ch01-b28
          speaker: narrator
          text: >-
            Colin spoke with such certainty that Ben studied him from head to foot, then back again.
        - id: ch01-b29
          speaker: ben_weatherstaff
          text: >-
            Thee, die? Not a chance! There's too much courage in thee. Soon as I saw tha' throw those legs down so quick, I knew tha' was sound enough. Sit on the rug awhile, young Master, and tell me what tha' wants done.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Ben's manner held a strange mixture of rough tenderness and sharp understanding. While Mary had brought him down the Long Walk, she had talked as fast as she could. The most important thing, she told him, was that Colin was getting well. The garden was making him well. No one must remind him of humps or dying.

            The Rajah graciously lowered himself onto the rug beneath the tree.
        - id: ch01-b31
          speaker: colin
          text: >-
            What sort of work do you do in the gardens, Weatherstaff?
        - id: ch01-b32
          speaker: ben_weatherstaff
          text: >-
            Whatever I'm told. They keep me on as a favor, because she liked me.
        - id: ch01-b33
          speaker: colin
          text: >-
            She? Who do you mean?
        - id: ch01-b34
          speaker: ben_weatherstaff
          text: >-
            Thy mother.
        - id: ch01-b35
          speaker: colin
          text: >-
            My mother?
        - id: ch01-b36
          speaker: narrator
          text: >-
            Colin quietly looked around him.
        - id: ch01-b37
          speaker: colin
          text: >-
            This used to be her garden, didn't it?
        - id: ch01-b38
          speaker: ben_weatherstaff
          text: >-
            Aye, that it was. She loved this place dearly.
        - id: ch01-b39
          speaker: colin
          text: >-
            It belongs to me now, and I love it too. I will come here every day. But the garden must stay secret. No one is to know that we visit it. Dickon and my cousin have worked here and brought it back to life. Sometimes I'll send for you to help them, but you must come when nobody can see you.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Ben's weathered face bent into a dry little smile.
        - id: ch01-b41
          speaker: ben_weatherstaff
          text: >-
            I've been in here before without anyone seein' me.
        - id: ch01-b42
          speaker: colin
          text: >-
            What? When?
          emotion: surprised
        - id: ch01-b43
          speaker: ben_weatherstaff
          text: >-
            Last time was about two years back.
        - id: ch01-b44
          speaker: narrator
          text: >-
            He rubbed his chin and looked around the garden.
        - id: ch01-b45
          speaker: colin
          text: >-
            But no one has entered for ten years! There wasn't even a door!
          emotion: surprised
        - id: ch01-b46
          speaker: ben_weatherstaff
          text: >-
            I'm nobody. And I didn't use the door. I climbed over the wall. The rheumatics have kept me out these last two years.
        - id: ch01-b47
          speaker: dickon
          text: >-
            So tha' came in and pruned things! I couldn't work out who'd done it.
        - id: ch01-b48
          speaker: ben_weatherstaff
          text: >-
            She loved the garden so. Such a pretty young thing, she was. Once she laughed and said, “Ben, if I'm ever ill, or if I go away, you must look after my roses.” After she went away, the orders said no one could come near. But I came anyway. Over the wall I went, till my rheumatics stopped me. Once a year, I did a bit o' work. Her order came first.
        - id: ch01-b49
          speaker: dickon
          text: >-
            It wouldn't be half so alive now if tha' hadn't. I always wondered about it.
        - id: ch01-b50
          speaker: colin
          text: >-
            I'm glad you came, Weatherstaff. I know you can keep our secret.
        - id: ch01-b51
          speaker: ben_weatherstaff
          text: >-
            Aye, I'll keep it, sir. And for a man with rheumatics, it'll be easier to use the door.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Mary's trowel lay in the grass beside the tree. Colin reached for it. A curious look crossed his face as he began scratching the ground. His thin hand was weak, but he kept at it. Mary watched without breathing. At last, he pushed the trowel's point into the soil and turned over a little earth.
        - id: ch01-b53
          speaker: mary
          text: >-
            You can do it! You can do it! I know you can!
        - id: ch01-b54
          speaker: narrator
          text: >-
            Mary spoke only to herself. Dickon's round eyes shone with eager curiosity, but he did not say a word. Ben watched with keen interest. Colin would not give up. After he had turned several small trowelfuls, he spoke to Dickon in the best Yorkshire he could manage, bursting with triumph.
        - id: ch01-b55
          speaker: colin
          text: >-
            Tha' said tha'd get me walkin' around here like other folk. Tha' said tha'd get me diggin', too. I thought tha' was only tellin' lies to please me. But this is my very first day. I've walked, and now look. I'm diggin'!
          emotion: happy
        - id: ch01-b56
          speaker: narrator
          text: >-
            At the sound of Colin's Yorkshire, Ben's mouth dropped open once more. Then the old gardener began to chuckle.
        - id: ch01-b57
          speaker: ben_weatherstaff
          text: >-
            Eh! That sounds like tha's got sense enough after all. A Yorkshire lad, sure enough, and diggin' besides. Would tha' care to plant somethin'? I can fetch a potted rose.
        - id: ch01-b58
          speaker: colin
          text: >-
            Go get it! Hurry! Hurry!
        - id: ch01-b59
          speaker: narrator
          text: >-
            And everything moved quickly after that. Ben went off, forgetting all about his rheumatics. Dickon used his spade to make the hole deeper and wider than a beginner with thin white hands ever could. Mary slipped away and came running back with a watering can. When the hole was ready, Colin kept turning the soft soil again and again. Even that little bit of exercise was new to him. His face was flushed and glowing when he looked up at the sky.
        - id: ch01-b60
          speaker: colin
          text: >-
            I want to finish before the sun goes all the way down.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Mary almost felt that the sun waited a few extra minutes just for him. Ben returned from the greenhouse carrying a rose in its pot. He hobbled across the grass as fast as he could, excited now himself. Beside the hole, he knelt and broke the pot away from the packed earth around the roots.
        - id: ch01-b62
          speaker: ben_weatherstaff
          text: >-
            Here, lad. Put it into the ground thysel', the way a king does when he visits a new place.
        - id: ch01-b63
          speaker: narrator
          text: >-
            Colin's thin white hands trembled a little, and the color in his face grew deeper. He lowered the rose into the hole and held it there while old Ben packed the earth firmly around it. Soon the hole was filled, the soil pressed down, and the plant stood steady.

            Mary leaned forward on her hands and knees. Soot flew down and marched closer to inspect the work. From a cherry tree, Nut and Shell chattered over the new arrival.
        - id: ch01-b64
          speaker: colin
          text: >-
            It's planted! And the sun is only just slipping over the edge. Help me stand, Dickon. I want to be on my feet when it disappears. That's part of the Magic.
          emotion: happy
        - id: ch01-b65
          speaker: narrator
          text: >-
            Dickon helped him rise. And the Magic, or whatever it was, gave Colin so much strength that when the sun slipped over the edge and brought that strange, lovely afternoon to an end, he truly stood on his own two feet, laughing.
