  chapters:
    - id: ch01
      title: An Old Chinese Story
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago, a great Empress ruled China after her brother, the Emperor Fuki, died. This was the age of giants. Empress Jokwa stood twenty-five feet tall, almost as tall as her brother had been. She was a remarkable woman and a capable ruler. This is the story of how she repaired part of the broken heavens and one of the great pillars that held up the sky. Both were damaged in a rebellion led by one of Fuki's former subjects.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The rebel was Kokai, a wizard twenty-six feet tall. Hair covered his whole body, and his face was black as iron. He was a terrifying figure. After Fuki died, Kokai wanted the throne for himself. But his plan failed, and the late Emperor's sister became Empress instead. Furious that he had been denied the crown, Kokai began a revolt.
        - id: ch01-b03
          speaker: narrator
          text: >-
            First, Kokai hired the Water Devil, who sent a tremendous flood across the country. The waters drove the poor people from their homes. When Jokwa saw their suffering and learned that Kokai had caused it, she declared war on him.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The Empress had two young warriors named Hako and Eiko. She chose Hako to command the front forces. Delighted by the honor, Hako prepared for battle. He took the longest lance he could find, mounted a red horse, and was about to leave when someone galloped up behind him, shouting.
        - id: ch01-b05
          speaker: eiko
          text: >-
            Hako, stop! I should be the general who leads the front forces!
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: >-
            Hako looked back. His comrade Eiko was charging toward him on a white horse and drawing a great sword. Hako wheeled around to face his rival, his anger rising.
        - id: ch01-b07
          speaker: hako
          text: >-
            You insolent wretch! The Empress appointed me to lead the front forces. How dare you stand in my way?
          emotion: angry
        - id: ch01-b08
          speaker: eiko
          text: >-
            I dare because I ought to command the army. You should be the one following me.
        - id: ch01-b09
          speaker: narrator
          text: >-
            That bold answer made Hako's anger blaze.
        - id: ch01-b10
          speaker: hako
          text: >-
            You still answer me like that? Then take this!
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: >-
            He thrust his lance at Eiko. Eiko dodged and brought down his sword, wounding the red horse's head. Hako had to dismount. He was just about to rush at his opponent when Eiko moved as quick as lightning. He tore the commander's badge from Hako's breast and galloped away. It happened so fast that Hako could only stand there, dazed.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Empress Jokwa had watched the whole encounter. She could not help admiring Eiko's speed. To settle the quarrel, she made both young men generals of the front army. Hako received command of the left wing, and Eiko took the right. With one hundred thousand soldiers behind them, they marched to crush Kokai's rebellion.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Before long, the two generals reached the castle where Kokai had fortified himself. When the wizard heard they were near, he scoffed.
        - id: ch01-b14
          speaker: kokai
          text: >-
            Those two poor children? One breath from me will blow them away.
        - id: ch01-b15
          speaker: narrator
          text: >-
            He had no idea how difficult the battle would be. Kokai seized an iron rod, mounted a black horse, and charged out like an angry tiger to meet them.
        - id: ch01-b16
          speakers: [hako, eiko]
          ensemble: duo
          text: >-
            We must not let him escape alive!
        - id: ch01-b17
          speaker: narrator
          text: >-
            Hako and Eiko attacked from opposite sides, one with a lance and one with a sword. But Kokai's power made him hard to defeat. Every time one young warrior struck, the wizard met the blow. He spun his iron rod around him like a huge waterwheel, keeping the sword away on one side and the lance away on the other. For a long time they fought without either side gaining ground or being driven back.
        - id: ch01-b18
          speaker: narrator
          text: >-
            At last, Hako turned too sharply to avoid the iron rod. His horse struck a large stone, reared straight upright like a standing screen, and threw him to the earth. Kokai drew a three-edged sword and prepared to kill the fallen warrior. Before he could strike, brave Eiko swung his horse between them.
        - id: ch01-b19
          speaker: eiko
          text: >-
            Face me and test your strength! Do not murder a man who lies helpless on the ground!
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: >-
            Kokai was already tired. He had no wish to face this fresh, fearless soldier, so he suddenly turned his horse and fled. Hako had only been slightly stunned. By then he was back on his feet, and the two comrades chased their enemy, Hako running and Eiko riding.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Kokai saw them coming. He turned toward the nearer pursuer, Eiko, pulled an arrow from the quiver on his back, and drew his bow. Eiko was watchful and moved as quickly as the shot itself. The arrow only brushed the cords of his helmet. It glanced away and struck Hako's armor without harming him.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Both enemies were still unhurt, and Kokai knew they would reach him before he could shoot again. To save himself, he used magic. He stretched out his wand. At once, a mighty flood rose around them. Jokwa's army and her two brave generals were swept away like autumn leaves falling into a stream.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Hako and Eiko struggled in water up to their necks. The solid battlefield had vanished beneath the flood, and neither warrior could find firm ground. When they looked around, they saw fierce Kokai making his way toward them through the water with his iron rod raised high. They thought he might strike them down at any moment. Still, they fought the current bravely and swam as hard as they could to stay beyond his reach.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Suddenly, what looked like an island rose straight out of the flood before them. On it stood an old man with snow-white hair, smiling down at the warriors. They cried out for his help. He nodded and walked to the water's edge. The moment his feet touched the flood, the waters divided. A broad road appeared, and the two drowning men found themselves safe.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Kokai soon reached the miraculous island. The sight of his enemies rescued made him furious, and he rushed through the water at the old man. Death seemed certain. Yet the old man showed no fear at all. He calmly waited for the wizard to attack.
        - id: ch01-b26
          speaker: narrator
          text: >-
            When Kokai drew near, the old man laughed merrily. Then he changed into a large, beautiful white crane. He spread his wings and flew up into the heavens.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Hako and Eiko knew that their rescuer could not have been an ordinary man. Perhaps he was a god in disguise. They hoped that one day they might discover who the venerable stranger really was.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Meanwhile, the warriors had withdrawn from the water. Day was ending, and the setting sun closed the battle for them all. Kokai did not try to renew the fight, and Hako and Eiko went back to safety. That night, the two young men considered everything they had seen. They agreed that it was useless for ordinary humans to fight a wizard who could summon a flood with his wand. They returned to Empress Jokwa, told her what had happened, and asked what they should do next.
        - id: ch01-b29
          speaker: narrator
          text: >-
            After a long discussion, Jokwa decided to ask Shikuyu, the Fire King, to lead her army against Kokai. Shikuyu lived at the South Pole. It was the only safe home for him, since his fire burned everything around him anywhere else. Ice and snow, however, could not burn.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The Fire King was another giant, thirty feet tall. His face looked like marble, and his long hair and beard were white as snow. His strength was tremendous. As Kokai ruled all water, Shikuyu ruled all fire. Jokwa believed he could conquer the wizard, so she sent Eiko south to ask him to take command and end the war.
        - id: ch01-b31
          speaker: shikuyu
          text: >-
            Why, that will be easy! I was the one who saved you and your companion when Kokai's flood nearly drowned you.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Eiko was astonished. He thanked the Fire King for rescuing them in their desperate hour, then begged him to return, lead the war, and defeat wicked Kokai.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Shikuyu agreed and traveled back with Eiko. Jokwa welcomed him warmly and asked him to become the supreme commander of her army. His answer gave her confidence.
        - id: ch01-b34
          speaker: shikuyu
          text: >-
            You need not worry. I will kill Kokai.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Shikuyu took his place at the head of thirty thousand soldiers. With Hako and Eiko showing him the road, he marched toward Kokai's castle. The Fire King knew the secret behind the wizard's power, and he prepared before challenging it. He ordered all the soldiers to search for a certain kind of shrub and gather as much as they could. The men piled the branches together and burned them in great quantities. When the fires died, every soldier filled a bag with the ashes and carried it onward.
        - id: ch01-b36
          speaker: narrator
          text: >-
            In his pride, Kokai believed Shikuyu was weaker than he was. He muttered angrily to himself.
        - id: ch01-b37
          speaker: kokai
          text: >-
            You may be the Fire King, but I can put out your flames soon enough.
          emotion: angry
        - id: ch01-b38
          speaker: narrator
          text: >-
            Kokai spoke an incantation, calling again upon his mastery of water. Floodwaters rose and swelled before the army until they towered as high as mountains. Shikuyu did not show the least fear. He gave the order, and all thirty thousand soldiers opened their bags and scattered the ashes they had carried. Every man did exactly as he had been told. The moment the ashes mingled with the rushing water, the strange power of the burned plant changed it into stiff mud. The flood could no longer sweep the army away, and every soldier stood safe from drowning.
        - id: ch01-b39
          speaker: narrator
          text: >-
            The wizard was dismayed to see that the Fire King had outwitted him. Rage drove him straight toward the enemy. Eiko rode out to meet him, and the two fought hand to hand for some time. They were evenly matched. Hako watched closely. When Eiko began to tire, Hako feared his friend would be killed and took his place.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Kokai was tired too. He knew he could not hold out against Hako, so he tried to deceive him.
        - id: ch01-b41
          speaker: kokai
          text: >-
            How noble you are to fight for your friend and risk your own life. I could never harm such a good man.
        - id: ch01-b42
          speaker: narrator
          text: >-
            He pretended to retreat and turned his horse away. He meant to make Hako lower his guard, then whirl back and catch him by surprise. But Shikuyu understood the cunning wizard at once.
        - id: ch01-b43
          speaker: shikuyu
          text: >-
            Coward! You cannot fool me!
          emotion: angry
        - id: ch01-b44
          speaker: narrator
          text: >-
            The Fire King signaled to the unsuspecting Hako to attack. Kokai wheeled furiously toward Shikuyu instead. But exhaustion had weakened him, and soon a blow wounded his shoulder. This time he broke away and truly tried to escape.
        - id: ch01-b45
          speaker: narrator
          text: >-
            While the leaders fought, their two armies had stood waiting and watching for the outcome. When Kokai fled, Shikuyu turned at once and commanded Jokwa's soldiers to charge the rebel forces. The whole army rushed forward. Kokai's troops broke before them and were driven from the field with terrible losses. Their wounded leader had no power to rally them, and the wizard himself barely escaped with his life.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Kokai called on the Water Devil, but it did no good. Shikuyu knew the charm that could stop him. The wizard saw that the whole battle had turned against him. His wounded shoulder throbbed with pain. Wild with disappointment and fear, he hurled his head against the rocks of Mount Shu and died there.
        - id: ch01-b47
          speaker: narrator
          text: >-
            That was the end of wicked Kokai, but it was not the end of trouble in Jokwa's kingdom. He had struck the rocks with such force that the mountain burst apart. Fire poured up from the earth. One of the pillars supporting the heavens broke, and a corner of the sky dropped until it touched the ground.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Shikuyu lifted Kokai's body and carried it to Empress Jokwa. She rejoiced that her enemy had fallen and her generals had won. To honor the Fire King, she showered him with gifts and rewards.
        - id: ch01-b49
          speaker: narrator
          text: >-
            All the while, flames kept bursting from the mountain shattered by Kokai's fall. The disaster spread across the land. Entire villages were destroyed, and rice fields burned before the crops could be saved. Blazing lava poured down into the riverbeds and filled them. Many people escaped with nothing, and those who had lost their homes were left in great distress.
        - id: ch01-b50
          speaker: narrator
          text: >-
            As soon as Jokwa had rewarded Shikuyu, she left the capital and hurried to the ruined land. She found damage both on earth and in Heaven. The place was so dark that she had to light a lamp before she could see how much destruction had been done.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Once she had seen the full damage to Heaven and earth, the Empress began the repairs. She ordered her subjects to search the country and gather stones of five colors: blue, yellow, red, white, and black. When all five kinds had been brought to her, she placed them in a huge cauldron. She boiled them together with a kind of porcelain until the mixture became a beautiful paste. Looking at it, Jokwa knew she now had what she needed to mend the broken sky.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Everything was ready. Jokwa looked far above her and summoned the clouds that sailed across the heights. They came at her call. She climbed upon them and rode toward Heaven, carrying in both hands the vase that held her paste of five-colored stones. The clouds bore her to the corner of the sky that had fallen. There, high over the earth, she carefully spread the paste across the break until the damage was closed and the heavens were whole again.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Then she turned to the broken pillar and repaired it with the legs of a very large tortoise. Her work finished, she mounted the clouds and descended to earth. She hoped everything would be right again. Instead, she found the world was still completely dark. The sun did not shine by day, and the moon gave no light at night.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Jokwa was deeply puzzled. At last, she summoned all the wise men in the kingdom and asked what she should do. Two of the wisest offered an answer.
        - id: ch01-b55
          speakers: [wise_man_1, wise_man_2]
          ensemble: duo
          text: >-
            The accident damaged the roads through Heaven. The Sun and Moon had to stay at home because neither could travel along them. They do not know that Your Majesty has repaired everything. We will go and tell them the roads are safe again.
        - id: ch01-b56
          speaker: narrator
          text: >-
            The Empress approved their plan and ordered them to begin the mission. Reaching the Sun and Moon would not be easy. Their palace stood many hundreds of thousands of miles away in the East. On foot, the wise men could never finish the journey. They would die of old age before arriving.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Jokwa once more turned to magic. She gave her two ambassadors marvelous chariots that could rise into the air and whirl forward at a thousand miles each minute. With ordinary horses, the distance would have defeated them, but these chariots carried them high above the earth. The wise men set out in good spirits and rode over the clouds. Even at that astonishing speed, the journey lasted many days. At last, they reached the distant eastern country where the Sun and Moon lived happily together.
        - id: ch01-b58
          speaker: narrator
          text: >-
            The Majesties of Light received the ambassadors. The wise men asked why they had hidden themselves from the universe for so many days. Did they not understand that without them, the whole world and everyone in it remained in utter darkness, both day and night?
        - id: ch01-b59
          speakers: [sun, moon]
          ensemble: duo
          text: >-
            Surely you know that Mount Shu burst into flame and badly damaged the roads of Heaven. The Sun could not make the daily journey over such rough roads, and the Moon certainly could not travel them at night. So we both withdrew for a while.
        - id: ch01-b60
          speaker: narrator
          text: >-
            The two wise men bowed all the way to the ground.
        - id: ch01-b61
          speakers: [wise_man_1, wise_man_2]
          ensemble: duo
          text: >-
            Our Empress Jokwa has repaired the roads with the wonderful stones of five colors. We assure Your Majesties that they are just as safe as they were before the mountain erupted.
        - id: ch01-b62
          speaker: narrator
          text: >-
            The Sun and Moon still hesitated. They had heard that a pillar of Heaven had broken too. Even with the roads repaired, they feared their usual journeys might still be dangerous.
        - id: ch01-b63
          speakers: [wise_man_1, wise_man_2]
          ensemble: duo
          text: >-
            There is no need to fear the broken pillar. Our Empress restored it with the legs of a great tortoise, and now it stands as firmly as ever.
          emotion: calm
        - id: ch01-b64
          speaker: narrator
          text: >-
            At last, the Sun and Moon were satisfied. They both set out to test the roads for themselves and found that Jokwa's deputies had told the truth.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Once they had examined the heavenly roads, the Sun and Moon shone upon the earth again.
        - id: ch01-b66
          speaker: narrator
          text: >-
            All the people rejoiced, and under the wise Empress Jokwa, China enjoyed peace and prosperity for a long time.
