audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    jokwa:
      display_name: 女娲
      tts:
        delivery: 威严果断，关怀百姓，遇到灾难时沉着坚定
        timbre: 清亮端庄的成年女声
        pace: 稳健从容
        pitch: 中音
    hako:
      display_name: 哈科
      tts:
        delivery: 年轻刚烈，骄傲直率，临阵勇猛
        timbre: 洪亮有力的青年男声
        pace: 明快，激动时稍快
        pitch: 中低音
    eiko:
      display_name: 埃科
      tts:
        delivery: 自信敏捷，争强好胜，危急时果敢
        timbre: 清朗坚实的青年男声
        pace: 利落
        pitch: 中音
    kokai:
      display_name: 共工
      tts:
        delivery: 狂妄凶狠，狡诈多变，败退时急躁疯狂
        timbre: 粗沉阴冷的男声
        pace: 稳重偏慢，盛怒时加快
        pitch: 低音
    shikuyu:
      display_name: 祝融
      tts:
        delivery: 豪迈镇定，洞察敏锐，说话斩钉截铁
        timbre: 浑厚明亮的成年男声
        pace: 从容有力
        pitch: 低音
    sage_1:
      display_name: 贤者甲
      tts:
        delivery: 恭谨睿智，陈述清楚
        timbre: 温和苍老的男声
        pace: 舒缓
        pitch: 中低音
    sage_2:
      display_name: 贤者乙
      tts:
        delivery: 恭谨睿智，语气笃定
        timbre: 清润苍老的男声
        pace: 舒缓
        pitch: 中音
    sun:
      display_name: 太阳
      tts:
        delivery: 庄严坦率，带着光明之君的气度
        timbre: 明亮宽厚的男声
        pace: 稳健
        pitch: 中低音
