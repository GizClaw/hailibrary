      display_name: 月亮
      tts:
        delivery: 庄重温和，言语审慎
        timbre: 柔和澄澈的女声
        pace: 从容
        pitch: 中高音
  chapters:
    - id: ch01
      title: 中国古代故事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，巨人还生活在世上。中国有位伟大的女皇，名叫女娲。她继承兄长伏羲帝的皇位，身高二十五英尺，几乎和兄长一样高。女娲不但非同寻常，治国也很有才能。后来，一场叛乱撞坏了天的一角，还折断了一根撑天的柱子。女娲补天修柱的故事，就从这里说起。
        - id: ch01-b02
          speaker: narrator
          text: 叛贼叫共工，身高二十六英尺，浑身是毛，一张脸黑得像铁。他精通妖术，凶恶可怕。伏羲帝去世后，共工想夺取皇位，却没能如愿，登基的是伏羲的妹妹女娲。他一怒之下举兵造反，先召来水魔，让洪水淹遍全国。百姓失去家园，女娲知道这场苦难是共工造成的，便向他宣战。
        - id: ch01-b03
          speaker: narrator
          text: 女皇手下有两名年轻武将，哈科和埃科。她任命哈科统率前军。哈科高兴极了，拿起最长的枪，骑上红马，刚要出发，身后忽然传来急促的马蹄声。
        - id: ch01-b04
          speaker: eiko
          text: 哈科，站住！前军主将该由我来做！
        - id: ch01-b05
          speaker: narrator
          text: 哈科回头一看，埃科骑着白马追了上来，还拔出一柄大刀。哈科转身面对他，顿时怒火中烧。
        - id: ch01-b06
          speaker: hako
          text: 无礼之徒！女皇亲自命我统率前军，你也敢拦？
          emotion: angry
        - id: ch01-b07
          speaker: eiko
          text: 我当然敢。该领兵的是我，该跟在后面的是你。
        - id: ch01-b08
          speaker: narrator
          text: 这句话把哈科心里的火星烧成了烈焰。
        - id: ch01-b09
          speaker: hako
          text: 还敢顶嘴！接我一枪！
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 哈科挺枪刺去，埃科迅速闪开，同时举刀砍伤了红马的头。哈科被迫下马，正要扑向对手，埃科已像闪电一样扯走他胸前的主将徽章，纵马飞奔而去。一切发生得太快，哈科只能呆站在那里，一时不知如何是好。女皇从头到尾看见了这场争斗。她既赞赏埃科的敏捷，又想平息两人的纷争，便让他们共同统领前军。哈科管左翼，埃科管右翼，十万士兵跟着二人浩浩荡荡地出发，前去讨伐共工。
        - id: ch01-b11
          speaker: narrator
          text: 不久，大军抵达共工据守的城堡。妖人听说两个年轻将军来了，满不在乎地说道。
        - id: ch01-b12
          speaker: kokai
          text: 两个乳臭未干的小子，我一口气就能把他们吹跑。
        - id: ch01-b13
          speaker: narrator
          text: 他哪里知道，这场仗会如此难打。共工抓起铁棒，跨上黑马，像发怒的猛虎一样冲出城去。两个年轻武将见他来势凶猛，彼此约定绝不能让他活着逃走，随即从左右两边挥刀挺枪，一起夹攻。法力强大的共工哪会轻易落败？他把铁棒舞得飞转，活像一架巨大的水车。三人厮杀许久，谁也没能前进一步，谁也不曾后退半步。哈科为了避开迎面扫来的铁棒，拨转马头太急。马蹄撞上巨石，受惊的马像屏风似的直立起来，把主人重重摔到了地上。
        - id: ch01-b14
          speaker: narrator
          text: 共工立刻拔出三刃剑，正要杀死倒地的哈科，埃科已经拨马挡到他面前。他向共工挑战，要这妖人和自己较量，休想杀害一个倒地之人。共工早已疲惫，不愿再面对这个精力正盛、毫无惧色的年轻武士，竟突然掉转马头，逃离战场。哈科只是稍稍摔晕了一阵，这时也站了起来。他徒步追赶，埃科骑马追赶，两人紧紧咬住逃敌不放。
        - id: ch01-b15
          speaker: narrator
          text: 共工发现有人穷追不舍，便转身对付离他最近的埃科。他从背后的箭囊抽出一支箭，搭弓瞄准，猛然射了出去。机警的埃科像闪电一样侧身躲过，箭只擦了一下他的盔缨，又斜飞出去撞上哈科的铠甲，谁也没伤着。共工见两个敌人依旧安然无恙，又知道来不及再射一箭，他们便会追到眼前，只得伸出法杖施展妖术。洪水霎时涌起，女娲的大军和两位将军像溪流上的秋叶一样被冲走了。
        - id: ch01-b16
          speaker: narrator
          text: 哈科和埃科陷在齐颈深的水里，挣扎着回头一看，共工正高举铁棒涉水追来，眼看随时会把他们打倒。两人仍不肯放弃，拼命往前游，只想逃出铁棒所及之处。忽然，一座小岛仿佛从水中笔直升起，挡在他们面前。岛上站着一位白发如雪的老人，正含笑看着他们。两人连声求救。老人点点头，走到水边。双脚才碰到洪水，水流就向两旁分开，露出一条平坦大道。两个几乎溺死的人惊奇万分，这才发现自己安全了。
        - id: ch01-b17
          speaker: narrator
          text: 共工也追到这座奇迹般升起的小岛前。他看见敌人获救，顿时暴跳如雷，踏着洪水直冲老人而去，眼看老人就要丧命。老人却一点也不慌，只静静等着妖人靠近。共工来到眼前时，他忽然快活地放声大笑，转眼变成一只硕大美丽的白鹤，拍着双翼直上云天。哈科和埃科这才明白，救命恩人绝不是凡人，或许是哪位神明所化。他们盼着日后能查清这位老者的身份。
        - id: ch01-b18
          speaker: narrator
          text: 哈科和埃科趁机退了回来。太阳正在落山，一天将尽，共工和两位年轻武将都打消了当日再战的念头。当天夜里，哈科与埃科仔细商议，认定继续和共工作战也没有用。妖人拥有超凡法力，他们却只是血肉之躯。两人只好回到女皇面前禀报。经过长久商议，女娲决定向火神祝融求助，请他统率大军，征讨叛贼。
        - id: ch01-b19
          speaker: narrator
          text: 祝融住在南极。对他来说，那是世上唯一安全的住处。若是换到别处，他会把周围的一切全烧成灰烬，只有冰雪无法燃烧。他也是巨人，身高三十英尺。脸庞宛如大理石，长发和长须都像雪一样洁白。他力大无穷，掌管天下一切火焰，正像共工掌管水一样。女皇心想，祝融一定能战胜共工，便派埃科远赴南极，请火神亲自接掌战事，一举除掉叛贼。
        - id: ch01-b20
          speaker: narrator
          text: 火神听完女皇的请求，笑了。
        - id: ch01-b21
          speaker: shikuyu
          text: 这还不容易！共工放出洪水时，救下你和同伴的人就是我。
        - id: ch01-b22
          speaker: narrator
          text: 埃科十分惊讶。他先谢过火神的救命之恩，又请祝融回去统率战事。祝融答应了，随他来到女皇面前。女娲热情迎接火神，请他担任全军统帅。
        - id: ch01-b23
          speaker: shikuyu
          text: 不必担心，我一定杀死共工。
        - id: ch01-b24
          speaker: narrator
          text: 祝融率领三万士兵，由哈科和埃科在前带路，向敌人的城堡进军。火神知道共工法力的秘密，便叫所有士兵采集一种特别的灌木。全军把灌木大量烧成灰烬，再按祝融的吩咐，每人都装满一袋。共工却骄傲自负，认定祝融的法力比不上自己。他怒气冲冲地低声说道。
        - id: ch01-b25
          speaker: kokai
          text: 就算你是火神，我也能马上把你浇灭。
        - id: ch01-b26
          speaker: narrator
          text: 共工念起咒语，洪水翻涌而出，越涨越高，最后竟像山一样耸立。祝融没有丝毫害怕，立刻命全军撒出事先准备的草木灰。每个士兵都照令行事。那种灌木烧成的灰果然有奇异力量，一碰到洪水，便结成坚硬的泥地，所有士兵都站稳了脚跟，免于溺水。共工眼看火神的智慧胜过自己，心中惊慌，怒火却烧得更旺。他失去理智，不顾一切地冲向敌军。
        - id: ch01-b27
          speaker: narrator
          text: 埃科策马迎战。两人近身厮杀了好一阵，谁也压不倒谁。哈科留心看着，发现同伴渐渐疲惫，怕他被杀，便上前替下了他。可共工也已力乏，自知抵挡不住哈科，便装出一副好意。
        - id: ch01-b28
          speaker: kokai
          text: 你肯替朋友出战，连性命都不顾，真有侠义心肠。我不会伤害你这样的好人。
        - id: ch01-b29
          speaker: narrator
          text: 共工假装退走，转开马头，想让哈科放松戒备，再突然回身偷袭。祝融一眼识破了诡计。
        - id: ch01-b30
          speaker: shikuyu
          text: 胆小鬼！你骗不了我！
          emotion: angry
        - id: ch01-b31
          speaker: narrator
          text: 祝融立刻向毫无防备的哈科打手势，叫他赶快进攻。诡计被揭穿，共工怒不可遏，转身扑向火神。可他已经累得无法好好作战，很快肩头便受了伤。这一次，他挣脱战团，当真想要逃命。双方主将交战时，两军一直站在原地，等待胜负。祝融这时转过身，命女娲的士兵全军冲锋。将士们奋勇向前，叛军死伤惨重，彻底溃败，共工也只勉强保住一条性命。
        - id: ch01-b32
          speaker: narrator
          text: 共工拼命呼唤水魔前来帮助，可这回也没有用，因为祝融掌握着破解妖法的咒术。共工终于知道，这场战斗已经彻底输了。肩上的伤越来越痛，失败带来的失望和恐惧也一齐折磨着他，把他逼得近乎疯狂。共工猛然冲向不周山，一头撞在岩石上，当场死去。
        - id: ch01-b33
          speaker: narrator
          text: 邪恶的共工虽然死了，女娲的国土却没有摆脱灾难。他撞向岩石的力道实在太大，竟把整座山撞裂。烈火从地底喷涌而出，一根支撑苍天的柱子随之折断，天空的一角向下坠落，一直压到了大地。祝融抱起共工的尸体，带回女皇面前。女娲见仇敌已灭、诸将得胜，欢喜万分，把种种赏赐与荣耀都赐给了祝融。
        - id: ch01-b34
          speaker: narrator
          text: 然而，破裂的山峰还在不停向外喷火。整座整座的村庄被毁，稻田烧成焦土，河床让滚烫的熔岩填满，失去家园的百姓苦不堪言。女皇奖赏过获胜的祝融，立刻离开都城，用最快的速度赶到灾区。她发现天地都受了损伤，四周黑得伸手不见五指，只好亲手点起灯来，一处处查看这场灾祸究竟造成了多大的破坏。
        - id: ch01-b35
          speaker: narrator
          text: 查明天地受损的情形以后，女娲立刻动手修补。她命臣民四处采集五种颜色的石头，分别是蓝色、黄色、红色、白色和黑色。等五色石全部收齐，她把它们和一种瓷料放进大鼎，一同熬煮。石头最终炼成了一团美丽的膏浆。女娲看着它，知道自己可以用这团膏浆补好苍天。至此，一切都准备妥当了。
        - id: ch01-b36
          speaker: narrator
          text: 一切备齐，女娲召来高高飘过头顶的云彩，乘云升入天庭。她双手捧着宝瓶，瓶中盛着五色石炼成的膏浆。来到破损的天角以后，她把膏浆细细涂上去，终于补好了苍天。接着，她转身修理折断的天柱，用一只巨龟的四足把它稳稳支撑起来。女娲乘云回到人间，以为万事都恢复了原状，不料大地仍旧漆黑一片。白昼不见太阳，夜晚也没有月亮。
        - id: ch01-b37
          speaker: narrator
          text: 女娲想不明白，只得召集全国贤者，询问该怎么办。两位最有智慧的人站出来回答。
        - id: ch01-b38
          speakers: [sage_1, sage_2]
          ensemble: duo
          text: 那场事故毁坏了天路，太阳和月亮只好留在家中。路太难走，太阳不能完成白昼的旅程，月亮也无法在夜间出发。他们还不知道陛下已经修好道路。请让我们去告诉二位，道路如今安全了。
        - id: ch01-b39
          speaker: narrator
          text: 女皇赞同这个办法，命两位贤者立刻上路。可是日月的宫殿远在东方，足有几十万里。两位使者若是徒步前往，只怕永远也走不到，半路上便会老死。女娲只好施展法术，赐给他们两辆神奇的飞车。这些车能凭借法力在空中疾驰，每分钟可以飞一千英里。两人兴致勃勃地出发，乘车飞越云端。经过许多天的旅程，他们终于来到太阳和月亮共同生活的国度。
        - id: ch01-b40
          speaker: narrator
          text: 两位使者获准拜见光明之君。他们询问日月为何多日闭门不出，难道不知道，这会让整个世界和所有百姓昼夜陷入黑暗吗？
        - id: ch01-b41
          speaker: sun
          text: 你们也知道，不周山突然喷火，天路损坏得厉害。路这样崎岖，我根本无法完成每天的行程。
        - id: ch01-b42
          speaker: moon
          text: 我自然也不能在夜里出门。所以，我们只好暂时退隐。
        - id: ch01-b43
          speaker: narrator
          text: 两位贤者伏地叩拜，一同禀告。
        - id: ch01-b44
          speakers: [sage_1, sage_2]
          ensemble: duo
          text: 女娲陛下已经用神奇的五色石修好道路。请二位放心，天路和山火喷发以前完全一样。
        - id: ch01-b45
          speaker: narrator
          text: 太阳和月亮还是有些迟疑。他们听说天柱也折断了，担心即使道路修好，出行仍不安全。
        - id: ch01-b46
          speakers: [sage_1, sage_2]
          ensemble: duo
          text: 那根天柱也不必担心。女娲陛下已经用巨龟的四足把它修好，如今和从前一样稳固。
        - id: ch01-b47
          speaker: narrator
          text: 太阳和月亮这才满意，一同出门试走天路。女皇的使者果然句句属实。察看道路以后，日月重新把光明洒向人间。万民欢欣鼓舞。在英明的女娲治理下，中国迎来了长久的太平与繁荣。
