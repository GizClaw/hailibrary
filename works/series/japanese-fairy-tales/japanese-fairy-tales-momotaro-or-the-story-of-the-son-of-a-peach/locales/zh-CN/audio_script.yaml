audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    old_man:
      display_name: 老翁
      tts:
        delivery: 朴实慈爱，略带年迈农人的疲惫
        timbre: 温厚苍老的男声
        pace: 舒缓
        pitch: 低音
    old_woman:
      display_name: 老妇
      tts:
        delivery: 勤劳爽朗，惊喜时明快热切
        timbre: 慈祥清亮的老年女声
        pace: 适中
        pitch: 中高音
    momotaro:
      display_name: 桃太郎
      tts:
        delivery: 年轻英武，自信果断，号令时威严有力
        timbre: 清朗坚实的少年男声
        pace: 稳健明快
        pitch: 中音
    dog:
      display_name: 狗
      tts:
        delivery: 粗鲁直率，服从后仍带几分争强好胜
        timbre: 粗厚有力的男声
        pace: 偏快
        pitch: 中低音
    monkey:
      display_name: 猴子
      tts:
        delivery: 机敏热切，争辩时轻快尖锐
        timbre: 灵活清脆的男声
        pace: 明快
        pitch: 中高音
    pheasant:
      display_name: 雉鸡
      tts:
        delivery: 骄傲勇敢，挑战敌人时响亮锐利
        timbre: 清越锐利的男声
        pace: 轻快
        pitch: 高音
    maiden_1:
      display_name: 少女甲
      tts:
        delivery: 悲苦柔弱，获救时带着希望
        timbre: 柔和清澈的年轻女声
        pace: 偏慢
        pitch: 中高音
    maiden_2:
      display_name: 少女乙
      tts:
        delivery: 悲苦克制，诉说时微微颤抖
        timbre: 轻柔的年轻女声
        pace: 偏慢
        pitch: 高音
    demon_1:
      display_name: 恶鬼甲
      tts:
        delivery: 凶横狂妄，嘲笑时粗野放肆
        timbre: 粗哑厚重的男声
        pace: 偏快
        pitch: 低音
    demon_2:
      display_name: 恶鬼乙
      tts:
        delivery: 暴躁蛮横，语气咄咄逼人
        timbre: 沙哑强硬的男声
        pace: 偏快
        pitch: 中低音
    demon_3:
      display_name: 恶鬼丙
      tts:
        delivery: 傲慢凶恶，笑声里带着轻蔑
        timbre: 低沉浑浊的男声
        pace: 适中
        pitch: 低音
    demon_king:
      display_name: 鬼王
      tts:
        delivery: 原本威猛，投降时卑怯低声
        timbre: 沉重粗哑的男声
        pace: 缓慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 桃中之子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，有一对种田的老夫妇。为了挣得每天的口粮，老翁常替附近的农家割草，老妇留在家里操持家务，还要照料自家那一小块稻田。一天，老翁照常上山，老妇带着衣裳去了河边。
        - id: ch01-b02
          speaker: narrator
          text: 初夏将至，四野一片新绿。河岸的青草仿佛碧绿的天鹅绒，水边的猫柳抖开柔软的穗子。微风吹皱河面，又轻轻拂过两个老人的脸。那天早晨，他们不知为什么，心里都格外欢喜。
        - id: ch01-b03
          speaker: narrator
          text: 老妇终于在岸边找到一处好地方，放下竹篮，把衣裳一件件取出来，浸进清澈的河水，再按在石头上搓洗。河水像水晶一样透亮，小鱼在水里来回游动，连水底的卵石都看得清清楚楚。她正忙着，一只大桃子忽然顺流颠簸而来。老妇抬起头看见它。她已经六十岁，却从没见过这么大的桃子。
        - id: ch01-b04
          speaker: old_woman
          text: 这桃子一定好吃极了！我得把它捞上来，带回去给老伴尝尝。
        - id: ch01-b05
          speaker: narrator
          text: 她伸长胳膊去够，桃子却远在手臂之外。老妇四下寻找竹竿，偏偏一根也看不见。可要是离开河边去找，桃子准会漂走。她停下来想了一会儿，忽然记起一首古老的咒歌。于是，她拍起手，合着桃子顺流滚动的节拍，唱了起来。
        - id: ch01-b06
          speaker: old_woman
          text: 远处的水呀苦，近处的水呀甜。莫从苦水边流过，快到甜水边来。
        - id: ch01-b07
          speaker: narrator
          text: 说来也怪，小歌才一出口，桃子果然越漂越近，一直来到老妇站立的岸边，停在她面前。她伸手把桃子抱了起来，心里又高兴又激动，再也洗不下衣裳。老妇把衣物全塞回竹篮，背上篮子，手捧桃子，急急忙忙赶回家去。
        - id: ch01-b08
          speaker: narrator
          text: 她等了很久。太阳快落山时，老翁终于背着一大捆草回来。草捆几乎遮住了他，他也累得把镰刀当作手杖，一路倚着走。老妇远远看见丈夫，立刻喊了起来。
        - id: ch01-b09
          speaker: old_woman
          text: 老伴啊，你总算回来了！我今天可等了你好久！
        - id: ch01-b10
          speaker: old_man
          text: 怎么这么着急？我不在家的时候，出了什么事吗？
        - id: ch01-b11
          speaker: old_woman
          text: 没出事。我只是找到一件好礼物，要送给你！
        - id: ch01-b12
          speaker: narrator
          text: 老翁听说没有出事，放下心来，也为那件礼物高兴。他先在一盆水里洗净双脚，这才踏上廊台。老妇立刻跑进小屋，从橱柜里捧出那只大桃子。它拿在手上，仿佛比先前更沉了。她把桃子高高举到丈夫眼前。
        - id: ch01-b13
          speaker: old_woman
          text: 快瞧瞧！你这辈子见过这么大的桃子吗？
        - id: ch01-b14
          speaker: old_man
          text: 我从没见过这么大的桃子！你是从哪里买来的？
        - id: ch01-b15
          speaker: old_woman
          text: 不是买的。我洗衣裳时从河里捞到的。
        - id: ch01-b16
          speaker: narrator
          text: 老妇把河边发生的事，从头到尾细细讲了一遍。老翁听说妻子捡到这样一只桃子，非常高兴。他干了一整天的活，肚子正饿，便提议马上把桃子吃掉。老翁取来菜刀，把桃子放在砧板上，正准备一刀切下去。可刀还没有落下，桃子竟自己裂成两半，里面传出一个清亮的声音。
        - id: ch01-b17
          speaker: momotaro
          text: 老爷爷，且慢！
        - id: ch01-b18
          speaker: narrator
          text: 一个漂亮的小娃娃从桃子里走了出来，老夫妇惊得双双跌倒。孩子连忙再次开口。
        - id: ch01-b19
          speaker: momotaro
          text: 别害怕。我不是妖怪，也不是仙人。上天怜悯你们，听见你们日夜哀叹没有孩子，便派我来做你们晚年的儿子！
        - id: ch01-b20
          speaker: narrator
          text: 老夫妇没有孩子陪伴孤苦的晚年，为此不知哭过多少个日夜。如今祈愿终于实现，两人欢喜得手脚都不知道该往哪里放。老翁先把孩子抱在怀里，老妇接着也抱了抱他。因为孩子来自桃中，他们便给他取名桃太郎，也就是桃中之子。岁月匆匆，桃太郎长到十五岁。他比同龄少年都高大强壮，面容英俊，心中充满勇气，年纪虽轻，却极有智慧。老夫妇每次望着他，都无比欣慰，因为在他们心里，英雄正该是这般模样。
    - id: ch02
      title: 远征鬼岛
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，桃太郎来到养父面前，神情十分郑重。
        - id: ch02-b02
          speaker: momotaro
          text: 父亲，我们因一场奇缘成了父子。您待我的恩情，比您日日割取的满山青草还高，比母亲洗衣的河水还深。我实在不知道该怎样报答。
        - id: ch02-b03
          speaker: old_man
          text: 父亲养育儿子，本来就是应该的。等你长大，再由你照料我们。这样彼此无亏无欠，正好相抵。你忽然这样道谢，反倒叫我为难了！
        - id: ch02-b04
          speaker: momotaro
          text: 在我报答养育之恩以前，还有一个请求。无论如何，我都盼望您能答应。
        - id: ch02-b05
          speaker: old_man
          text: 你和别的孩子不同。想做什么，我都准你去做！
        - id: ch02-b06
          speaker: momotaro
          text: 那么，请让我马上离家远行！
        - id: ch02-b07
          speaker: old_man
          text: 你要离开年迈的父母和住惯的家？你究竟要去哪里？
        - id: ch02-b08
          speaker: momotaro
          text: 只要您准我走，我一定会回来。日本东北方的海里有一座岛，那是恶鬼的巢穴。它们侵入我国，杀人越货，抢走财物，还违抗天皇的法令。落到它们手里的百姓，甚至会被杀死吃掉。我必须征服它们，把被抢走的财物带回来，所以才想暂时离家。
        - id: ch02-b09
          speaker: narrator
          text: 老翁听一个十五岁的少年说出这番话，十分惊讶，思量之后，却认为最好还是放他去。桃太郎既强壮又无所畏惧。更重要的是，老人知道他绝非寻常孩子，而是上天赐给老夫妇的礼物。因此，老翁深信鬼岛上的恶鬼根本伤不了他。
        - id: ch02-b10
          speaker: old_man
          text: 你说得有道理，桃太郎。我不拦你。尽早赶到鬼岛，消灭恶鬼，为国土带回太平吧。
        - id: ch02-b11
          speaker: momotaro
          text: 多谢您一直以来的慈爱。
        - id: ch02-b12
          speaker: narrator
          text: 桃太郎当天便准备行装。他满怀勇气，从来不知道恐惧是什么。老夫妇立刻在厨房的石臼里舂米，给他做旅途上吃的米糕。等米糕终于做好，桃太郎也为漫长的远行准备妥当。离别总是伤心的，这一次也不例外。两个老人眼含泪水，连声音也颤抖起来。
        - id: ch02-b13
          speakers: [old_man, old_woman]
          ensemble: duo
          text: 一路千万小心，快去快回。我们等你得胜归来！
        - id: ch02-b14
          speaker: narrator
          text: 桃太郎想到父母留在家里会多么孤单，心中也很难过。他舍不得离开年迈的双亲。不过，他知道自己一办完事情就会尽快回来，于是把不舍藏在心里，仍鼓起勇气说出告别的话。
        - id: ch02-b15
          speaker: momotaro
          text: 我这就走了。我不在的时候，你们一定照顾好自己。再见！
        - id: ch02-b16
          speaker: narrator
          text: 说完，他快步走出家门，与父母默默对望，用目光作了最后的告别。桃太郎一路匆匆赶路，直到正午才觉得饿了。他打开行囊，拿出一块米糕，坐在路旁树下吃起来。正在用午饭时，一条小马驹般大的狗突然冲出高草，露着牙齿直奔他而来。
        - id: ch02-b17
          speaker: dog
          text: 没有我的准许，你竟敢穿过我的地盘！把袋里的米糕全留下，我就放你过去。不然，我便一口口咬死你！
          emotion: angry
        - id: ch02-b18
          speaker: momotaro
          text: 你知道我是谁吗？我是桃太郎，正要去日本东北方的鬼岛，荡平恶鬼的巢穴。你敢挡路，我就从头顶往下，把你劈成两半！
        - id: ch02-b19
          speaker: narrator
          text: 桃太郎只轻蔑地笑了笑，狗的气势便顿时全消了。它把尾巴紧紧夹在两腿之间，小心地凑上前来，又深深伏下身子，额头几乎贴到地面。方才那个凶狠的样子已经不见踪影。
        - id: ch02-b20
          speaker: dog
          text: 您当真是桃太郎？我早就听说您力大无穷。刚才不知道您是谁，才做出那样的蠢事。请原谅我的无礼！若肯收下我做随从，带我一同攻打鬼岛，我一定感激不尽。
        - id: ch02-b21
          speaker: momotaro
          text: 你若真想去，我可以带上你。
        - id: ch02-b22
          speaker: dog
          text: 多谢！我还有一件事。我实在饿得厉害，能分我一块米糕吗？
        - id: ch02-b23
          speaker: momotaro
          text: 这是全日本最好的米糕。整块不能给你，我分你半块。
        - id: ch02-b24
          speaker: narrator
          text: 狗接住桃太郎抛来的半块米糕，连声道谢。桃太郎站起来继续赶路，狗便跟在身后。他们翻过山岭，穿过谷地，走了很久。途中，一只动物从前方不远的一棵树上爬下来，很快迎到桃太郎面前。原来，那是一只猴子。
        - id: ch02-b25
          speaker: monkey
          text: 桃太郎，早上好！欢迎来到这一带。能不能准我和您一同上路？
        - id: ch02-b26
          speaker: dog
          text: 桃太郎已经有我陪着了。打起仗来，你这样的猴子有什么用？我们正要去和恶鬼交战，快滚开！
        - id: ch02-b27
          speaker: narrator
          text: 狗和猴子立刻争吵起来，很快又撕咬在一处。这两种动物向来彼此厌恶。桃太郎见它们越闹越凶，便走到中间，亲手把它们分开。狗仍不服气，坚持说让这种家伙跟随桃太郎，实在有失身份。
        - id: ch02-b28
          speaker: momotaro
          text: 不许争吵！狗，你先等着。猴子，你是谁？
        - id: ch02-b29
          speaker: monkey
          text: 我住在这片山里。听说您要远征鬼岛，我特地赶来同行。能跟随您，是再高兴不过的事！
        - id: ch02-b30
          speaker: momotaro
          text: 你真愿意跟我去鬼岛作战？
        - id: ch02-b31
          speaker: monkey
          text: 是的，大人。
        - id: ch02-b32
          speaker: momotaro
          text: 我佩服你的胆量。这块上好的米糕分给你，跟我们来吧！
    - id: ch03
      title: 三个伙伴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 猴子就这样加入了队伍。可它还是和狗相处不好。两个伙伴一路朝对方龇牙低吼，时时都想打上一架，惹得桃太郎非常生气。最后，他想出一个办法，让狗举着旗走在最前面，让猴子佩着剑走在最后面，自己手持一把铁制军扇，走在它们中间，把两个争吵的家伙隔开。
        - id: ch03-b02
          speaker: narrator
          text: 过了一阵，他们来到一片宽阔的原野。一只鸟从天而降，恰好落在小队前方。那是桃太郎见过的最美丽的鸟。它身披五色羽衣，头顶仿佛戴着鲜红的帽子。狗立刻扑上去，想把它捉住咬死。鸟却伸出利爪，飞扑着攻击狗尾巴，双方斗得难解难分。桃太郎在一旁观看，不由得暗暗赞赏。这只鸟勇气十足，一定会是个出色的战士。
        - id: ch03-b03
          speaker: momotaro
          text: 你这无赖，竟敢阻碍我的行程！立刻投降，我便带你同行。要是不肯，我就放狗咬掉你的脑袋！
        - id: ch03-b04
          speaker: narrator
          text: 桃太郎走到两个争斗者面前，把狗拉住。鸟听完他的警告，马上收起利爪认输，又低下头，请求加入桃太郎的队伍。
        - id: ch03-b05
          speaker: pheasant
          text: 我是一只微不足道的雉鸡。方才没看见您，才和您的随从争斗，实在无可辩解。您肯宽恕我的无礼，还愿意收留我，真是宽宏大量。请准我跟在狗和猴子后面，为您效力！
        - id: ch03-b06
          speaker: momotaro
          text: 你这么快便肯投降，值得恭喜。来吧，加入我们，一同讨伐恶鬼。
        - id: ch03-b07
          speaker: dog
          text: 连这只鸟也要带上吗？
        - id: ch03-b08
          speaker: momotaro
          text: 何必问这种多余的话？我要带它去，因为我愿意！
        - id: ch03-b09
          speaker: narrator
          text: 狗不服气地哼了一声。桃太郎站定身子，向三个伙伴下令。
        - id: ch03-b10
          speaker: momotaro
          text: 全都听好。军队里最要紧的是和睦。古话说，地利胜过天时，可我们同心协力，又胜过一切地利。自己人不能和睦，怎么打败敌人？从今往后，你们必须一条心。谁先挑起争斗，我就当场把它赶走！
        - id: ch03-b11
          speaker: narrator
          text: 三个伙伴全都答应，从今以后不再争吵。雉鸡正式成了桃太郎的随从，也和狗、猴子一样分到半块米糕。桃太郎在它们心中的威望如此之高，三个原本互不相让的伙伴果真成了好朋友。大家拥着桃太郎这位首领，日复一日匆匆向前赶路，终于走出群山，来到东北方的大海岸边。
        - id: ch03-b12
          speaker: narrator
          text: 放眼直到天际，连岛屿的影子也没有。四下一片寂静，只有海浪一下下滚上岸滩。狗、猴子和雉鸡一路勇敢地穿过长长的山谷，翻过一座座山岭，却从没见过大海。自从出发以来，它们头一回不知所措，只能默默相望。眼前无边无际的海水要怎样渡过，鬼岛又究竟在哪里？桃太郎看出它们被大海吓住了，便故意大声而严厉地斥责。
        - id: ch03-b13
          speaker: momotaro
          text: 为什么迟疑？你们怕海吗？真是一群胆小鬼！带着你们这些软弱的家伙，怎么和恶鬼作战？我还是独自去吧。你们全被赶出队伍了！
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: 三个伙伴被这顿严厉的斥责吓了一跳。它们好不容易才走到这里，哪里肯就此回头？于是全都围上来，紧紧扯住桃太郎的衣袖，一个接一个地哀求，请他千万别把自己赶走。
        - id: ch03-b15
          speaker: dog
          text: 求求您，桃太郎！
        - id: ch03-b16
          speaker: monkey
          text: 我们已经走了这么远，而且一点也不怕海！
        - id: ch03-b17
          speaker: pheasant
          text: 把我们丢在这里太无情了。请一定带上我们！
        - id: ch03-b18
          speaker: dog
          text: 求您了！
        - id: ch03-b19
          speaker: momotaro
          text: 那好，我带你们去，不过千万要当心！
        - id: ch03-b20
          speaker: narrator
          text: 三个伙伴终于鼓起了一点勇气。桃太郎找来一艘小船，大家一同登船。天气晴好，风向也顺，小船像箭一样飞驰海上。狗、猴子和雉鸡都是头一回坐船，起先被起伏的海浪和船身的摇晃吓得不轻。过了一些时候，它们渐渐习惯水上的航行，又恢复了欢喜。此后，它们每天都在小船的甲板上来回走动，急切地眺望鬼岛。
        - id: ch03-b21
          speaker: narrator
          text: 在甲板上看累了，它们就互相讲述各自最得意的事迹，再一起玩耍。三个伙伴说说闹闹，不时做出滑稽的模样。桃太郎听着它们的故事，看着它们的举动，觉得很有趣，也就忘了航程漫长，忘了整日无事可做的厌倦。他一心盼着尽快投入战斗，杀掉那些给祖国带来无数灾祸的恶鬼。
        - id: ch03-b22
          speaker: narrator
          text: 风一路从有利的方向吹来，他们也没有遇上风暴，小船航行得很快。一天阳光灿烂，守在船头的四名旅伴终于望见陆地。桃太郎立刻认出，那就是恶鬼的巢穴。陡峭海岸的顶端矗立着一座面朝大海的巨大城堡。远征的目标已经近在眼前，他双手托着头，陷入沉思，盘算该怎样发动进攻。三个随从都在旁边看着，安静地等候命令。
        - id: ch03-b23
          speaker: momotaro
          text: 雉鸡，有你同行对我们十分有利。你有一双好翅膀，立刻飞到城堡去，向恶鬼挑战。我们随后就到。
    - id: ch04
      title: 攻入鬼城
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 雉鸡立即领命，欢快地扇动双翼飞向岛上。它落在城堡中央的屋顶，放声高喊。
        - id: ch04-b02
          speaker: pheasant
          text: 恶鬼们，全都听着！日本大将桃太郎前来征讨，要夺下你们的巢穴！想保住性命，就立刻投降，折断额头上的角，作为归顺的凭证。若执意作战，我们雉鸡、狗和猴子便会又啄又咬，把你们全都撕碎！
        - id: ch04-b03
          speaker: narrator
          text: 长角的恶鬼们抬头一看，屋顶上只有一只雉鸡，顿时放声嘲笑。
        - id: ch04-b04
          speakers: [demon_1, demon_2, demon_3]
          ensemble: chorus
          text: 不过是只野雉鸡！像你这样的下贱东西，也敢口出狂言？等着挨我们的铁棒吧！
        - id: ch04-b05
          speaker: narrator
          text: 恶鬼们怒不可遏，凶狠地摇晃着头角和蓬乱的红发，匆匆穿上虎皮裤，好让自己看起来更加骇人。随后，它们举起沉重的大铁棒，冲到雉鸡栖身的屋顶下，想一棒把它打下来。雉鸡飞到一旁躲过攻击，又接连扑击这个鬼、那个鬼的脑袋。它绕着恶鬼飞个不停，翅膀猛烈而迅疾地拍打着。到后来，恶鬼们简直分不清自己面对的究竟是一只鸟，还是一大群鸟。
        - id: ch04-b06
          speaker: narrator
          text: 与此同时，桃太郎已经驾船靠岸。船接近岛屿时，他看见海岸如同悬崖，巨大的城堡四周筑着高墙，装着沉重的铁门，守备十分森严。桃太郎上了岸，带着猴子和狗沿小径向高处走，想找出一条进城的路。不久，他们遇见两名美丽的少女，正在溪边洗衣。桃太郎看见衣裳上染着血迹，两个姑娘洗着洗着，眼泪不断从脸颊滚落，于是停下脚步。
        - id: ch04-b07
          speaker: momotaro
          text: 你们是什么人？为什么哭泣？
        - id: ch04-b08
          speakers: [maiden_1, maiden_2]
          ensemble: duo
          text: 我们是鬼王的俘虏。它把我们从家乡掳来。我们本是大名的女儿，如今却被迫做它的奴仆。总有一天，它还会杀掉我们，把我们吃掉。可是没有人能来救我们！
          emotion: fearful
        - id: ch04-b09
          speaker: narrator
          text: 姑娘们举起手中染血的衣裳，仿佛自己的结局已经近在眼前。一想到总有一天会被恶鬼杀死吃掉，又没有任何人能来相救，她们再也忍不住，眼泪再次夺眶而出。
        - id: ch04-b10
          speaker: momotaro
          text: 我会救你们。别再哭了，只要告诉我怎样才能进入城堡。
        - id: ch04-b11
          speaker: narrator
          text: 两名姑娘听说有人肯来相救，便立即在前面带路。她们把桃太郎领到城墙最低的地方，指给他看那里一扇隐蔽的小后门。门洞实在低矮，桃太郎几乎要趴到地上才能爬进去。屋顶上一直奋力作战的雉鸡，终于看见桃太郎率领小小的队伍，从城堡后方冲了进来。
        - id: ch04-b12
          speaker: narrator
          text: 桃太郎的攻势异常猛烈，恶鬼根本抵挡不住。起初，它们的敌手只有雉鸡一只鸟。如今桃太郎、狗和猴子也全都赶到，恶鬼们顿时乱了阵脚。四名敌手个个勇猛，打起来竟像一百名战士。有的恶鬼从城堡胸墙上跌落，在下方的岩石上摔得粉身碎骨。有的掉进海里淹死。还有许多被三个动物伙伴活活打死。
    - id: ch05
      title: 凯旋归乡
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 最后，只剩鬼王一个。它知道眼前的敌手强得不像凡人，继续抵抗也没有用，只好决定投降。鬼王放低姿态，来到桃太郎面前，扔下手里的铁棒，跪倒在胜利者脚边。它又亲手折断头上的角，作为归顺的凭证，因为那双角正是它力量与权势的象征。
        - id: ch05-b02
          speaker: demon_king
          text: 我怕您。我不是您的对手。只要饶我一命，我愿把城堡里藏的财宝全都献给您！
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: 桃太郎听了，放声大笑。
        - id: ch05-b04
          speaker: momotaro
          text: 大鬼王竟开口求饶，这可不像你啊！不管你怎样哀求，我都不能饶过你这条恶命。多年以来，你残害折磨了无数百姓，还不断劫掠我们的国家。
        - id: ch05-b05
          speaker: narrator
          text: 桃太郎把鬼王牢牢捆起来，交给猴子看守。做完这些，他走遍城堡里的每一间屋子，把囚禁其中的人全都释放出来，又把找到的财宝全部收集到一起。返乡时，狗和雉鸡驮着从鬼岛夺回的战利品，桃太郎押着鬼王这个俘虏，终于凯旋回到故乡。
        - id: ch05-b06
          speaker: narrator
          text: 两个可怜的大名之女，以及其他被恶鬼掳来做奴仆的人，也都被平安送回自己的家，重新与父母团聚。桃太郎凯旋以后，举国上下都把他奉为英雄。那些强盗恶鬼盘踞多年，长久以来一直是国土上的恐怖。如今它们终于被除掉，再也不能侵扰百姓，整个国家无不欢欣鼓舞。
        - id: ch05-b07
          speaker: narrator
          text: 桃太郎平安归来，老夫妇的欢喜比从前任何时候都更大。一家人终于重新团聚。桃太郎从鬼岛带回的财宝，也让两个辛苦劳作了一生的老人从此衣食丰足，生活安宁。他们就这样和桃太郎在一起，安安稳稳地度过了余生。
