  chapters:
    - id: ch01
      title: The Peach from the River
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago, an old man and an old woman lived together in Japan. They were peasants, and both worked hard for their daily rice. The old man cut grass for nearby farmers. While he was away, his wife kept the house and tended their little rice field.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One morning, as usual, he went up into the hills to cut grass, while the old woman carried a basket of clothes down to the river. Summer was near, and the whole countryside was beautiful in its fresh green colors. The riverbanks looked like emerald velvet, and soft tassels shook on the pussy willows at the water's edge. A breeze rippled the smooth river and brushed the old couple's cheeks as they went to work. Neither could explain why, but both felt especially happy that morning.
        - id: ch01-b03
          speaker: narrator
          text: >-
            At last, the old woman found a pleasant place on the riverbank and set down her basket. She got to work at once. One by one, she took out the clothes, dipped them in the flowing water, and rubbed them clean against the stones. The river was clear as crystal. Looking down, she could see tiny fish swimming back and forth over the pebbles at the bottom.
        - id: ch01-b04
          speaker: narrator
          text: >-
            As she worked, a huge peach came bumping along with the current. The old woman looked up. She was sixty years old, but never in all her life had she seen a peach so large.
        - id: ch01-b05
          speaker: old_woman
          text: >-
            What a delicious peach that must be! I simply must catch it and take it home to my old man.
        - id: ch01-b06
          speaker: narrator
          text: >-
            She reached for it, but it floated too far from shore. There was no stick nearby, and if she left to find one, the peach would be gone. Then she remembered an old charm. Clapping in time with the peach as it rolled downstream, she began to sing.
        - id: ch01-b07
          speaker: old_woman
          text: >-
            Distant water is bitter. Near water is sweet. Pass by the distant water, and come into the sweet.
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: >-
            Strange as it may seem, the peach drifted closer as soon as she sang. Nearer and nearer it came, until it stopped right in front of her. She lifted it from the water with both hands. She was far too delighted to go on washing. The clothes went straight back into the bamboo basket, which she carried on her back while she hurried home with the peach.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Waiting for her husband seemed to take forever. At sunset, he finally returned beneath a bundle of grass so large that it almost hid him. He was exhausted and leaned on his scythe like a walking stick.
        - id: ch01-b10
          speaker: old_woman
          text: >-
            Old man! I've been waiting and waiting for you to come home today!
          emotion: happy
        - id: ch01-b11
          speaker: old_man
          text: >-
            Why are you so eager? Did something happen while I was gone?
          emotion: surprised
        - id: ch01-b12
          speaker: old_woman
          text: >-
            No, nothing bad happened. I found a wonderful present for you!
          emotion: happy
        - id: ch01-b13
          speaker: old_man
          text: >-
            Well, that's good news.
        - id: ch01-b14
          speaker: narrator
          text: >-
            He washed his feet in a basin and stepped onto the veranda. His wife ran into the little room and brought the peach from the cupboard. Somehow it felt heavier than before. She held it up for him to see.
        - id: ch01-b15
          speaker: old_woman
          text: >-
            Just look at it! Have you ever seen such an enormous peach?
        - id: ch01-b16
          speaker: old_man
          text: >-
            Never! That is the largest peach I've seen in my life. Where did you buy it?
          emotion: surprised
        - id: ch01-b17
          speaker: old_woman
          text: >-
            I didn't buy it. It came floating past while I was washing at the river.
        - id: ch01-b18
          speaker: narrator
          text: >-
            She told him how the peach had bumped down the stream, how it had stayed beyond her reach, and how her old charm-song had drawn it to the bank.
        - id: ch01-b19
          speaker: old_man
          text: >-
            I'm glad you found it. I'm hungry, so let's eat it now.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The old man put the peach on a board and raised the kitchen knife. Before he could cut, the peach split open by itself. A clear voice rang out from inside.
        - id: ch01-b21
          speaker: momotaro
          text: >-
            Wait, old man!
        - id: ch01-b22
          speaker: narrator
          text: >-
            Out stepped a beautiful little child. The old man and his wife were so astonished that they both fell to the floor. Then the child spoke again.
        - id: ch01-b23
          speaker: momotaro
          text: >-
            Please don't be afraid. I'm neither demon nor fairy. Heaven took pity on you because you grieved day and night for a child. Your cries were heard, and I have been sent to be the son of your old age.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Joy swept over the old couple. They had wept day and night because they had no child to comfort their lonely old age. Now their long prayer had been answered, and they hardly knew what to do with themselves. First the old man held the child, and then the old woman held him. Because he had come from a peach, they named him Momotaro, the Son of a Peach.
    - id: ch02
      title: Momotaro Sets Out
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The years passed quickly, and the child grew. By the time Momotaro was fifteen, he stood taller than any other boy his age and was far stronger than all of them. He had a handsome face, a heart full of courage, and wisdom beyond his years. The old couple took tremendous pleasure in their son. Whenever they looked at him, they saw everything they believed a true hero should be.
        - id: ch02-b02
          speaker: narrator
          text: >-
            One day, Momotaro went to his foster father and spoke with great seriousness.
        - id: ch02-b03
          speaker: momotaro
          text: >-
            Father, a strange chance made us father and son. Your goodness rises higher than the mountain grass you cut each day and runs deeper than the river where Mother washes clothes. I can never thank you enough.
        - id: ch02-b04
          speaker: old_man
          text: >-
            Why thank me? Of course a father raises his son. When you're older, you'll care for us in return. Then everything will be even between us. I don't know why you're speaking this way.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The old man looked troubled, but Momotaro continued.
        - id: ch02-b06
          speaker: momotaro
          text: >-
            Please be patient with me. Before I can repay you, I have one request. More than anything, I hope you'll grant it.
        - id: ch02-b07
          speaker: old_man
          text: >-
            You are unlike every other boy. Whatever you wish to do, I will allow it.
        - id: ch02-b08
          speaker: momotaro
          text: >-
            Then let me leave at once.
        - id: ch02-b09
          speaker: old_man
          text: >-
            Leave? Do you mean to go away from your old father and mother, and from your home?
          emotion: surprised
        - id: ch02-b10
          speaker: momotaro
          text: >-
            If you let me go now, I promise I will return.
        - id: ch02-b11
          speaker: old_man
          text: >-
            But where are you going?
        - id: ch02-b12
          speaker: momotaro
          text: >-
            I haven't told you my reason, so my request must sound strange. Far to the northeast of Japan, an island lies in the sea. It is the stronghold of a band of devils. Again and again, they invade our land. They kill and rob our people and carry away everything they find. They defy the Emperor and break his laws. Some poor captives are even killed and eaten. I must conquer those hateful devils and bring back the treasure they stole. That is why I need to leave for a while.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The old man was greatly surprised to hear such a purpose from a boy of only fifteen. He considered Momotaro's request and decided it was best to let him go. The boy was strong, fearless, and determined. More than that, the old man knew he was no ordinary child. Heaven itself had sent Momotaro to their home as a gift. Because of that, his father felt certain the devils would have no power to harm him.
        - id: ch02-b14
          speaker: old_man
          text: >-
            Momotaro, I will not stand in the way of your purpose. Go whenever you wish. Destroy the demons on their island and bring peace back to this land.
        - id: ch02-b15
          speaker: momotaro
          text: >-
            Thank you for all your kindness.
        - id: ch02-b16
          speaker: narrator
          text: >-
            That very day, fearless Momotaro began preparing. The old man and woman went straight to the kitchen. Together they pounded rice in the mortar and shaped the finest cakes they could make for his long journey. When the food was packed and every preparation finished, Momotaro was ready to go.
        - id: ch02-b17
          speaker: narrator
          text: >-
            Parting brought sorrow to them all. Tears filled the old people's eyes, and their voices trembled.
        - id: ch02-b18
          speakers: [old_man, old_woman]
          ensemble: duo
          text: >-
            Travel carefully, and lose no time. We will wait for you to return victorious!
          emotion: sad
        - id: ch02-b19
          speaker: narrator
          text: >-
            Momotaro knew how lonely they would be, and it hurt him to leave. Still, he gave them a brave farewell.
        - id: ch02-b20
          speaker: momotaro
          text: >-
            I'm going now. Please take good care of yourselves until I come home. Good-bye!
          emotion: sad
        - id: ch02-b21
          speaker: narrator
          text: >-
            He stepped quickly out of the house. Momotaro and his parents looked silently into one another's eyes, and then he was on his way.
    - id: ch03
      title: Three Companions
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Momotaro hurried onward until the sun stood high at noon. Hunger caught up with him, so he stopped beside the road and sat beneath a tree. He opened his traveling bag, took out one of the rice cakes his parents had made, and began to eat. While he was having his lunch, the tall grass stirred. A dog nearly as large as a colt charged straight toward him. The animal bared his teeth and spoke fiercely.
        - id: ch03-b02
          speaker: dog
          text: >-
            You walked through my field without asking me! Leave every cake in that bag, and I'll let you pass. Refuse, and I'll bite you to death!
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: >-
            Momotaro gave a scornful laugh.
        - id: ch03-b04
          speaker: momotaro
          text: >-
            Do you have any idea who I am? I am Momotaro, traveling northeast to defeat the devils in their island fortress. Stand in my way, and I'll cut you in two from head to tail!
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: >-
            At once, the dog's whole manner changed. His tail dropped between his legs, and all his fierceness vanished. He crept close to Momotaro and bowed so low that his forehead touched the earth.
        - id: ch03-b06
          speaker: dog
          text: >-
            Momotaro? Are you truly the great Momotaro? I've heard so much about your strength. I behaved like a fool because I didn't know you. Please forgive me. If you're really going to the Island of Devils, let this rude dog follow you. I would be deeply grateful.
        - id: ch03-b07
          speaker: momotaro
          text: >-
            If you truly want to come, I believe I can take you.
        - id: ch03-b08
          speaker: dog
          text: >-
            Thank you! And, well, I'm terribly hungry. Could you spare one of those cakes?
        - id: ch03-b09
          speaker: momotaro
          text: >-
            These are the finest cakes in Japan. I can't give you a whole one, but you may have half.
        - id: ch03-b10
          speaker: dog
          text: >-
            Half a cake is most welcome. Thank you.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Momotaro tossed him the promised half, then rose and continued his journey with the dog following behind. For a long time, the two crossed one hill after another and made their way through the valleys between them. As they walked on, an animal climbed down from a tree a little way ahead. It came directly toward Momotaro.
        - id: ch03-b12
          speaker: monkey
          text: >-
            Good morning, Momotaro! Welcome to these hills. Would you let me travel with you?
        - id: ch03-b13
          speaker: dog
          text: >-
            Momotaro already has a dog beside him. What good would a monkey be in battle? We're going to fight devils, so be gone!
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: >-
            Dog and Monkey began snapping and biting at each other, as those two animals have always been enemies. Momotaro stepped between them.
        - id: ch03-b15
          speaker: momotaro
          text: >-
            Stop that! Dog, wait where you are.
          emotion: angry
        - id: ch03-b16
          speaker: dog
          text: >-
            A creature like that has no place in your company!
        - id: ch03-b17
          speaker: momotaro
          text: >-
            You don't decide that. Now, Monkey, tell me who you are.
        - id: ch03-b18
          speaker: monkey
          text: >-
            I live here in the hills. Word of your journey to the Island of Devils reached me, and I came because nothing would please me more than following you.
        - id: ch03-b19
          speaker: momotaro
          text: >-
            Do you truly mean to go there and fight at my side?
        - id: ch03-b20
          speaker: monkey
          text: >-
            Yes, sir. I do.
        - id: ch03-b21
          speaker: momotaro
          text: >-
            Then I honor your courage. Take a piece of my fine rice cake, and come with us.
        - id: ch03-b22
          speaker: narrator
          text: >-
            So Monkey joined the party. Yet he and Dog still could not get along. As the travelers moved onward, those two kept snapping at one another and looking for another fight. Their quarrels made Momotaro very cross. At last, he separated them. He sent Dog ahead carrying a flag and placed Monkey at the rear with a sword. Momotaro walked between them, holding a war fan made of iron.
        - id: ch03-b23
          speaker: narrator
          text: >-
            In time they reached a broad field. A bird swept down and landed before them. It was the loveliest bird Momotaro had ever seen, dressed in five colors of feathers with a scarlet cap upon its head.
        - id: ch03-b24
          speaker: narrator
          text: >-
            Dog rushed forward at once, meaning to seize and kill the newcomer. The bird struck out with its spurs and flew at Dog's tail. The fight went hard for both of them, and neither would give way. Momotaro stood watching. He could not help admiring the bird's courage and spirit, and he decided such a creature would make a fine fighter. Then he stepped between the two combatants, held Dog back, and addressed the bird.
        - id: ch03-b25
          speaker: momotaro
          text: >-
            You rascal, you've delayed my journey. Surrender now, and you may join me. Refuse, and I'll let this dog bite off your head!
          emotion: angry
        - id: ch03-b26
          speaker: narrator
          text: >-
            The bird surrendered immediately and begged to enter Momotaro's company.
        - id: ch03-b27
          speaker: pheasant
          text: >-
            I have no excuse for fighting your servant. I did not see you there. I am only a poor pheasant, and you are generous to forgive me. Please let me follow behind Dog and Monkey.
        - id: ch03-b28
          speaker: momotaro
          text: >-
            You were wise to surrender quickly. Join us in our attack on the devils.
        - id: ch03-b29
          speaker: dog
          text: >-
            You're taking this bird too?
          emotion: surprised
        - id: ch03-b30
          speaker: momotaro
          text: >-
            Why ask when you heard my answer? Pheasant comes because I choose to take him.
        - id: ch03-b31
          speaker: dog
          text: >-
            Humph!
          emotion: disgusted
        - id: ch03-b32
          speaker: narrator
          text: >-
            Momotaro stood before all three companions and gave an order.
        - id: ch03-b33
          speaker: momotaro
          text: >-
            Listen carefully. An army needs harmony before anything else. People say that an earthly advantage is better than an advantage from Heaven, but unity among us is better still. If we fight one another, defeating our enemy will be no easy task. From this moment, Dog, Monkey, and Pheasant must act as friends with one purpose. Whoever starts another quarrel will be dismissed at once.
        - id: ch03-b34
          speakers: [dog, monkey, pheasant]
          ensemble: chorus
          text: >-
            We promise. We will not quarrel again.
        - id: ch03-b35
          speaker: narrator
          text: >-
            Each of the three promised that there would be no more quarrels. Pheasant received half a cake and took his place among Momotaro's followers. Their leader's influence was so strong that Dog, Monkey, and Pheasant truly became friends. With their disagreements behind them, the little company hurried onward.
    - id: ch04
      title: Across the Sea
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The little company hurried onward day after day. They crossed the country until at last the hills and valleys opened onto the shore of the Northeastern Sea. They searched the view before them, but no island appeared anywhere between the coast and the distant horizon. The shore was still and empty. Only the steady sound of waves rolling in and breaking against the land disturbed the silence.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Dog, Monkey, and Pheasant had come bravely through every long valley and over every hill. Yet none of them had seen the sea before. Its vast reach stopped them where they stood. For the first time since their journey began, all three were bewildered. They stared at the water, then looked at one another without a word. The Island of Devils lay somewhere beyond that wide sea, but how could they possibly cross the water and reach it?
        - id: ch04-b03
          speaker: narrator
          text: >-
            Momotaro saw that the sight had shaken their courage. To test them, he raised his voice and spoke roughly.
        - id: ch04-b04
          speaker: momotaro
          text: >-
            Why are you standing there? Are you frightened of the sea? What cowards you are! Weak creatures like you can never fight the demons. I would be better off alone. All three of you are dismissed!
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: >-
            The sharp rebuke stunned the animals. They clung to Momotaro's sleeve and begged him not to leave them behind.
        - id: ch04-b06
          speaker: dog
          text: >-
            Please, Momotaro, don't send us away!
          emotion: fearful
        - id: ch04-b07
          speaker: monkey
          text: >-
            We've followed you all this way! We aren't afraid of the sea!
          emotion: fearful
        - id: ch04-b08
          speaker: pheasant
          text: >-
            You cannot leave us here. Please take us with you!
          emotion: fearful
        - id: ch04-b09
          speaker: dog
          text: >-
            Yes, please do!
          emotion: fearful
        - id: ch04-b10
          speaker: momotaro
          text: >-
            Very well. You may come, but take care.
        - id: ch04-b11
          speaker: narrator
          text: >-
            Momotaro found a small ship, and all four went aboard. The weather stayed fair, a good wind filled their sail, and the little vessel flew across the sea like an arrow. Dog, Monkey, and Pheasant had never traveled on water before. At first, the rising waves and the rolling deck frightened them badly. Little by little, however, they found their sea legs. Soon they were used to the water and cheerful again.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Each day, they paced the deck and searched eagerly for the demons' island. When they tired of watching the empty horizon, they told one another stories about the deeds that made them proud. Then they played games together. Momotaro enjoyed hearing the animals' stories and watching their antics. Their company helped him forget how long the voyage seemed and how tired he was of waiting with nothing to do. More than anything, he longed to begin fighting the monsters who had done so much harm in his country.
        - id: ch04-b13
          speaker: narrator
          text: >-
            They met no storms, and the favorable wind carried them swiftly onward. Then, on a bright day, the four watchers at the bow finally saw land.
        - id: ch04-b14
          speaker: narrator
          text: >-
            The sight of land rewarded their long watch. Momotaro knew at once that it was the devils' stronghold. A great castle stood at the top of the steep shore and looked out across the sea. Now the task he had traveled so far to accomplish was close at hand. Momotaro rested his head on his hands and thought deeply about how to begin the attack. His three companions watched in silence and waited for orders. At last, he called Pheasant forward.
        - id: ch04-b15
          speaker: momotaro
          text: >-
            Your wings give us a great advantage. Fly to the castle now and challenge the demons. We will follow you.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Pheasant obeyed at once. Beating the air gladly with his wings, he left the ship, reached the island, and landed on the castle roof. From the middle of the fortress, he called down in a mighty voice.
    - id: ch05
      title: The Devils' Stronghold
      blocks:
        - id: ch05-b01
          speaker: pheasant
          text: >-
            Devils, hear me! The great Japanese general Momotaro has come to fight you and seize your fortress. Surrender now if you want to live. Break the horns from your foreheads to show your submission. Choose battle instead, and Pheasant, Dog, and Monkey will bite and tear every one of you to death!
          emotion: angry
        - id: ch05-b02
          speaker: narrator
          text: >-
            The horned demons looked up. When they saw only one pheasant, they burst out laughing.
        - id: ch05-b03
          speakers: [demon_1, demon_2, demon_3]
          ensemble: chorus
          text: >-
            A wild pheasant dares to threaten us? What foolish words from such a worthless little bird! Just wait until our iron bars strike you!
          emotion: angry
        - id: ch05-b04
          speaker: narrator
          text: >-
            The devils were furious at the challenge. They shook their horns and tossed their wild red hair, then hurried to pull on tiger-skin trousers so they would look even more terrible. Gripping enormous iron bars, they rushed beneath the place where Pheasant perched and tried to knock him from the roof. Again and again they swung. Each time, he darted aside, escaped the blow, and attacked another demon's head. He wheeled around them without rest, beating the air so fiercely with his wings that the devils began to wonder whether they faced one bird or a whole flock.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Meanwhile, Momotaro brought the ship ashore. The coast rose like a cliff. High walls and great iron gates surrounded the strongly guarded castle.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Momotaro stepped ashore and began climbing the path toward the top. Dog and Monkey followed close behind while he searched for some way through the fortifications. Before long, they came upon two beautiful young women washing clothes in a stream. The garments in their hands were stained with blood. As the maidens washed them, tears fell quickly down their cheeks. Momotaro stopped beside the stream and spoke to them.
        - id: ch05-b07
          speaker: momotaro
          text: >-
            Who are you? Why are you crying?
        - id: ch05-b08
          speaker: maiden_1
          text: >-
            We are prisoners of the Demon King. He carried us away from our homes and brought us to this island.
          emotion: sad
        - id: ch05-b09
          speaker: maiden_2
          text: >-
            Our fathers are lords, but here we must serve him. One day he will kill and eat us. Look at these bloodstained clothes. No one can help us!
          emotion: fearful
        - id: ch05-b10
          speaker: narrator
          text: >-
            At the thought of that terrible fate, their tears broke out again.
        - id: ch05-b11
          speaker: momotaro
          text: >-
            I will save you. Dry your tears, and show me a way into the castle.
        - id: ch05-b12
          speaker: narrator
          text: >-
            The two maidens turned and led the way. At the lowest part of the castle wall, they showed Momotaro a tiny back door. The opening was so small that even he could barely crawl through it. All this time, Pheasant had kept the demons busy with the fight above. From his place over their heads, he saw Momotaro, Dog, and Monkey slip through the little door and rush into the castle from the rear.
        - id: ch05-b13
          speaker: narrator
          text: >-
            Momotaro's attack was so fierce that the devils could not stand against him. At first, their only enemy had been a single bird. Now Momotaro, Dog, and Monkey had burst into the stronghold, and the demons did not know where to turn. Though there were only four attackers, they fought with the strength of a hundred. Some devils fell from the castle parapet and were dashed against the rocks far below. Others tumbled into the sea and drowned. Many more were beaten down by the three animals.
        - id: ch05-b14
          speaker: narrator
          text: >-
            At last, only the chief of the devils remained. Seeing all the others defeated, he knew that the enemy before him was stronger than any mortal man. There was no hope left in fighting, so he made up his mind to surrender. He approached Momotaro humbly, threw down his iron bar, and knelt at the victor's feet. Then, as a sign of submission, he broke the horns from his own head. Those horns had been the mark of his strength and power.
        - id: ch05-b15
          speaker: demon_king
          text: >-
            I fear you. I cannot defeat you. Spare my life, and I will give you every treasure hidden in this castle.
          emotion: fearful
        - id: ch05-b16
          speaker: narrator
          text: >-
            Momotaro laughed at him.
        - id: ch05-b17
          speaker: momotaro
          text: >-
            A great devil begging for mercy? That doesn't suit you. No matter how you plead, I cannot spare such a wicked life. For years, you have robbed our country, tortured its people, and killed them.
          emotion: angry
        - id: ch05-b18
          speaker: narrator
          text: >-
            Momotaro bound the Demon King tightly and placed the captive in Monkey's charge. With the chief secured, Momotaro went through every room in the great castle. He opened the places where the prisoners were held and set them free. Then he searched out all the treasure hidden there and gathered together everything the devils had stolen.
    - id: ch06
      title: The Victorious Return
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            When it was time to leave the island, Dog and Pheasant helped carry the recovered plunder. Momotaro made the journey home in triumph, and the defeated Demon King came with him as a captive.
        - id: ch06-b02
          speaker: narrator
          text: >-
            The two sorrowful maidens were daughters of powerful lords. They and all the other people whom the wicked demon had kidnapped and forced into slavery were brought safely back to their own homes. At last, each one was restored to a waiting family, and the two daughters were delivered to their parents.
        - id: ch06-b03
          speaker: narrator
          text: >-
            News of the victory spread across the whole country. Everywhere, people welcomed Momotaro's triumphant return and honored him as a hero. For many years, the robber devils had invaded the land and filled its people with terror. Now the country was free of them, and everyone rejoiced.
        - id: ch06-b04
          speaker: narrator
          text: >-
            No one rejoiced more than the old man and old woman when their son came home. Their happiness was greater than it had ever been before. The treasure Momotaro brought with him ended their years of hardship, and together they lived in peace and plenty to the end of their days.
