  chapters:
    - id: ch01
      title: The Hare's Plan
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago, when all animals could talk, a little white hare lived in the Japanese province of Inaba. His home was on the island of Oki. Across the sea lay the mainland of Inaba.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The hare longed to cross over. Day after day, he went down to the shore and sat there, gazing across the water toward Inaba. And day after day, he hoped he might find some way to reach the mainland.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One day, as he stood on the beach looking toward Inaba, he saw a great crocodile swimming near the island. The hare thought this was wonderfully lucky. At last, he might get his wish by asking the crocodile to carry him across the sea. But then he wondered whether the crocodile would agree. Instead of asking for a favor, he decided to get what he wanted with a trick.
        - id: ch01-b04
          speaker: hare
          text: >-
            Oh, Mr. Crocodile! What a lovely day, isn't it?
        - id: ch01-b05
          speaker: narrator
          text: >-
            The crocodile had come out alone to enjoy the bright sunshine. He was beginning to feel lonely when the cheerful greeting broke the silence. Pleased to hear a voice, he swam nearer to shore.
        - id: ch01-b06
          speaker: crocodile
          text: >-
            Who called to me just now? Was that you, Mr. Hare? You must be lonely here all by yourself.
        - id: ch01-b07
          speaker: hare
          text: >-
            Oh, no, I'm not lonely. I only came out to enjoy this fine day. Why don't you stay and play with me for a while?
        - id: ch01-b08
          speaker: narrator
          text: >-
            The crocodile came all the way out of the sea and settled beside the hare on the shore of Oki. The two animals played happily together beneath the bright sunshine for a long while. When they had played long enough, the hare began to set his trick in motion.
        - id: ch01-b09
          speaker: hare
          text: >-
            Mr. Crocodile, you live in the sea and I live on this island, so we don't meet very often. I know almost nothing about your kind. Tell me, are there more crocodiles than hares?
        - id: ch01-b10
          speaker: crocodile
          text: >-
            Of course there are more crocodiles! Can't you see that for yourself? You hares have only this small island, while I live in the sea. The sea reaches every part of the world. If I called together all the crocodiles who live in it, you hares would seem like nothing beside us.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The crocodile was very conceited. That was just what the hare had hoped for.
        - id: ch01-b12
          speaker: hare
          text: >-
            Then could you call enough crocodiles to make a line all the way from this island to Inaba?
        - id: ch01-b13
          speaker: narrator
          text: >-
            The crocodile thought for a moment.
        - id: ch01-b14
          speaker: crocodile
          text: >-
            Why, of course I could.
        - id: ch01-b15
          speaker: hare
          text: >-
            Then please do it, and I'll count every one of you from here.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The simple-minded crocodile never guessed that the hare meant to deceive him. He readily agreed.
        - id: ch01-b17
          speaker: crocodile
          text: >-
            Wait here while I swim back and call my company together.
    - id: ch02
      title: The Bridge of Crocodiles
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The crocodile plunged into the sea and disappeared. The hare waited patiently on the shore. At last, the crocodile returned with a great many others.
        - id: ch02-b02
          speaker: crocodile
          text: >-
            Look, Mr. Hare! My friends can easily make a line from here to Inaba. There are enough of us to reach all the way to China or India. Have you ever seen so many crocodiles?
        - id: ch02-b03
          speaker: narrator
          text: >-
            The crocodiles arranged themselves in the water, making a bridge from the island of Oki to the mainland of Inaba.
        - id: ch02-b04
          speaker: hare
          text: >-
            How splendid! I never believed it could be done. Now let me count you all. With your permission, I'll have to walk across your backs to the other side. Please don't move, or I'll fall into the sea and drown.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The hare hopped from the island onto that strange bridge. He jumped from one crocodile's back to the next as he counted.
        - id: ch02-b06
          speaker: hare
          text: >-
            Keep perfectly still, please, or I'll lose count. One, two, three, four, five, six, seven, eight, nine...
        - id: ch02-b07
          speaker: narrator
          text: >-
            In this way, the cunning hare crossed the sea and reached Inaba. But getting his wish was not enough for him. Instead of thanking the crocodiles, he mocked them as he sprang from the last one's back.
        - id: ch02-b08
          speaker: hare
          text: >-
            Oh, you foolish crocodiles! I'm finished with you now!
        - id: ch02-b09
          speaker: narrator
          text: >-
            He was about to run away as fast as he could, but he did not escape so easily. The crocodiles understood at last. The hare had tricked them into carrying him across the sea, and now he was laughing at them for being fooled. They became furiously angry and decided they would have their revenge.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Some of them chased the hare and caught him. Then they surrounded the little animal and tore out all his fur. He cried aloud and begged them to spare him, but each time they pulled out another tuft, they answered him.
        - id: ch02-b11
          speakers: [crocodile, crocodile_2, crocodile_3]
          ensemble: chorus
          text: >-
            That's what you deserve!
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: >-
            When the last bit of fur was gone, the crocodiles threw the helpless hare onto the beach. Then the whole company swam away together, laughing over the revenge they had taken.
    - id: ch03
      title: A Cruel Remedy
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The hare was in a pitiful state. All his beautiful white fur had been pulled out. His bare little body bled all over and trembled with pain. He could hardly move. He could only lie helpless on the beach and weep over his misfortune.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The hare's own deceit had brought all this misery and suffering upon him. Even so, no one could have seen the poor little creature in such a sad condition without feeling sorry for him. The crocodiles had been terribly cruel in their revenge.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Just then, several men who looked like King's sons happened to pass that way. When they saw the hare lying on the beach in tears, they stopped and asked what had happened to him.
        - id: ch03-b04
          speaker: hare
          text: >-
            I fought with some crocodiles, and they defeated me. They pulled out all my fur and left me here in pain. That's why I'm crying.
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: >-
            One of those young men was spiteful by nature. He only pretended to be kind when he spoke to the hare.
        - id: ch03-b06
          speaker: spiteful_brother
          text: >-
            I'm very sorry for you. I know a cure for that sore body of yours. Bathe in the sea, then sit where the wind can blow over you. Your fur will grow back, and soon you'll be just as you were before.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The young men went on their way. The hare was delighted. He truly believed he had been given a cure. He went straight into the sea and bathed, then climbed out and sat where the wind could blow across him.
        - id: ch03-b08
          speaker: narrator
          text: >-
            But as the wind dried him, his skin tightened and grew hard. The salt made the pain so terrible that he rolled across the sand in agony and cried aloud.
    - id: ch04
      title: The Kind Traveler
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            At that moment, another King's son came by with a great bag on his back. He saw the hare and stopped to ask why he was crying so loudly.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The poor hare remembered that a man very like this one had already deceived him. Afraid to trust another such traveler, he gave no answer and went on crying. But this man had a kind heart. He looked at the hare with deep pity before speaking again.
        - id: ch04-b03
          speaker: okuni_nushi
          text: >-
            You poor little thing! All your fur is gone, and your skin is completely bare. Who could have treated you so cruelly?
        - id: ch04-b04
          speaker: narrator
          text: >-
            Those gentle words encouraged the hare, and he felt grateful. This time he hid nothing. He told the traveler how he had asked the crocodiles to make a bridge, pretending that he only wished to count them. He explained how he had crossed the sea on their backs, then mocked them for their stupidity. And he admitted how they had taken revenge by tearing out every bit of his fur.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Then he told how the first group of men, who looked so much like this kind stranger, had deceived him with a false cure. At the end of his long tale of misery, he begged his new friend for medicine that would heal his painful body and make his white fur grow again.
        - id: ch04-b06
          speaker: okuni_nushi
          text: >-
            I'm truly sorry for everything you've suffered. But remember, this began because you deceived the crocodiles.
        - id: ch04-b07
          speaker: hare
          text: >-
            I know. I'm sorry for what I did, and I've decided never to deceive anyone again. Please, tell me how to heal my sore body and bring back my fur.
          emotion: sad
        - id: ch04-b08
          speaker: okuni_nushi
          text: >-
            Then I'll give you a good remedy. First, bathe thoroughly in that pond and wash every bit of salt from your body. Next, pick some kaba flowers from the water's edge. Spread them on the ground and roll over them. Their pollen will make your fur grow again, and before long you'll be well.
        - id: ch04-b09
          speaker: narrator
          text: >-
            The hare was very glad to be told what to do so kindly. He crawled toward the pond that the traveler had shown him. There he bathed carefully and washed away the salt. Then he picked the kaba flowers growing near the water, spread them over the ground, and rolled his bare body upon them.
        - id: ch04-b10
          speaker: narrator
          text: >-
            To his amazement, his fine white fur began growing back while he was still rolling. The pain stopped, and he felt exactly as he had before all his troubles.
    - id: ch05
      title: The Hare's Promise
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The hare was overjoyed by his quick recovery. He went hopping happily back toward the young man who had helped him, and when he reached his kind friend, he knelt down at the traveler's feet.
        - id: ch05-b02
          speaker: hare
          text: >-
            I can never thank you enough for all you've done. I truly want to repay your kindness. Please, tell me who you are.
          emotion: happy
        - id: ch05-b03
          speaker: okuni_nushi
          text: >-
            I am not a King's son, as you suppose. I am a fairy named Okuni-nushi-no-Mikoto. The men who passed before me are my brothers. They have heard of a beautiful woman called Princess Yakami, who lives here in Inaba. They are going to ask her to marry one of them.
        - id: ch05-b04
          speaker: okuni_nushi
          text: >-
            On this journey, I am only their attendant. That is why I walk behind them carrying this great bag on my back.
        - id: ch05-b05
          speaker: narrator
          text: >-
            When he heard that name, the hare humbled himself before the great fairy Okuni-nushi-no-Mikoto. Many people throughout that part of the land worshiped this fairy as a god.
        - id: ch05-b06
          speaker: hare
          text: >-
            Oh, I didn't know you were Okuni-nushi-no-Mikoto! How kind you have been. I can hardly believe that cruel man who sent me into the sea is your brother. I'm certain the Princess will refuse every one of your brothers. She will choose you because your heart is good.
        - id: ch05-b07
          speaker: hare
          text: >-
            You won't even try to win her, but you will win her heart all the same. She will ask to become your bride.
        - id: ch05-b08
          speaker: narrator
          text: >-
            Okuni-nushi-no-Mikoto paid no attention to the hare's prediction. He simply said goodbye to the little animal and hurried onward. Before long, he caught up with his brothers. He found them just as they were entering the gate of Princess Yakami's home.
    - id: ch06
      title: The White Hare of Inaba
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Everything happened just as the hare had foretold. None of the brothers could persuade Princess Yakami to become his bride. But then she looked at the face of the kind brother who had followed behind them. She walked straight up to him and spoke.
        - id: ch06-b02
          speaker: princess_yakami
          text: >-
            I choose you. I will be your bride.
        - id: ch06-b03
          speaker: narrator
          text: >-
            And so Princess Yakami and Okuni-nushi-no-Mikoto were married.
        - id: ch06-b04
          speaker: narrator
          text: >-
            Here the story ends. In some parts of Japan, people worship Okuni-nushi-no-Mikoto as a god. The hare became famous as the White Hare of Inaba. But no one knows what became of the crocodiles.
