  chapters:
    - id: ch01
      title: The Young Prince's First Mission
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The great Japanese Empire has three sacred treasures, guarded with the greatest care since ancient times. They are the Mirror of Yata, the Jewel of Yasakami, and the Sword of Murakumo.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The sword was later called Kusanagi-no-Tsurugi, the Grass-Cleaving Sword. Of the three treasures, it was honored most highly. To a nation of warriors, it stood for strength, and while it rested in the shrine of the Emperor's ancestors, it was believed to protect him from defeat.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Nearly two thousand years ago, the sword was kept at the shrines of Ise. Those temples were dedicated to Amaterasu, the beautiful Sun Goddess from whom the Japanese Emperors were said to descend. An old tale of courage and adventure tells how Murakumo came to be known as the Grass-Cleaving Sword.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Many, many years ago, Emperor Keiko had a second son named Yamato. Keiko was the twelfth Emperor descended from Jimmu, the founder of the Japanese dynasty. From childhood, Yamato showed unusual strength, wisdom, and courage. His father proudly saw the promise of great deeds in him and loved him even more than his elder son.
        - id: ch01-b05
          speaker: narrator
          text: >-
            In those days, a Japanese boy was considered a man at sixteen. By the time Yamato reached that age, two outlaw brothers named Kumaso and Takeru were causing great trouble throughout the realm. They broke the laws, defied the King, and seemed to take pleasure in rebellion.
        - id: ch01-b06
          speaker: narrator
          text: >-
            At last, Emperor Keiko commanded his younger son to defeat the brigands and, if he could, rid the land of their evil lives. Yamato was only sixteen. By the law of that age, he had only just become a man. Even so, he already had the fearless spirit of an older warrior and did not know what fear was. No man could match his courage or daring, and he welcomed his father's command with joy.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The palace grounds filled with activity. The Prince and his loyal followers gathered, polished their armor, and dressed for the expedition. Yet before leaving the court, Yamato went to worship at Ise and say farewell to his aunt, Princess Yamato. His heart was heavy with the dangers ahead, and he wanted the protection of his ancestor Amaterasu.
        - id: ch01-b08
          speaker: narrator
          text: >-
            His aunt came out to welcome him gladly. She congratulated him because his father had trusted him with such an important mission. Then she gave him one of her own splendid robes as a keepsake to carry with him. She told him it would bring good fortune and surely prove useful during the adventure. At last, she wished him complete success and sent him on his way.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The young Prince bowed low and accepted her gracious gift with pleasure. Then he spoke before returning to the palace.
        - id: ch01-b10
          speaker: yamato_take
          text: >-
            I am ready. I will set out now.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Yamato took his place at the head of his troops. Strengthened by his aunt's blessing, he felt prepared for anything that might come. He marched across the land to the southern island of Kiushiu, where the brigands lived.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Within a few days, he reached the southern island and began moving slowly but steadily toward the stronghold of Kumaso and Takeru. Soon he met with enormous difficulty. The country was terribly wild and rough. High, steep mountains rose over valleys that were dark and deep. Huge trees and great boulders blocked the road, stopping the army again and again. There was scarcely a path for the soldiers to follow, and going farther seemed almost impossible.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Though Yamato was young, he had the judgment of a man with many years behind him. He saw that forcing his soldiers onward would get them nowhere. They could not clear roads and fight at the same time. A surprise attack would take far less effort and give him a better chance of killing the outlaw chiefs.
        - id: ch01-b14
          speaker: yamato_take
          text: >-
            This land is unknown to my men, and no army can fight its way through such country. I must use a trick and reach the enemy before they know I am there.
        - id: ch01-b15
          speaker: narrator
          text: >-
            He ordered his army to halt beside the road. His wife, Princess Ototachibana, had traveled with him, and he asked her to bring the robe from the priestess of Ise and help him dress as a woman. Yamato put on the gorgeous robe and loosened his hair until it flowed over his shoulders. Ototachibana brought him her own comb, which he placed in his black hair. Then he adorned himself with strings of strange jewels until every part of the disguise was ready.
        - id: ch01-b16
          speaker: narrator
          text: >-
            When everything was ready, she brought him her mirror. The Prince smiled at what he saw. The disguise was perfect. He could hardly recognize himself. Every sign of the warrior had vanished, and a beautiful lady seemed to gaze back from the shining surface.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Completely disguised, Yamato went alone to the enemy camp. Hidden in the folds of his silk robe, close beside his strong heart, he carried a sharp dagger.
    - id: ch02
      title: The Outlaw Chiefs
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Kumaso and Takeru sat in their tent, enjoying the cool evening. They were discussing troubling news. The King's son had entered their country with a large army and meant to destroy their band. Both chiefs knew the young warrior's fame, and for the first time in their wicked lives, they were afraid.
        - id: ch02-b02
          speaker: narrator
          text: >-
            During a pause, they looked through the open tent door. A beautiful woman in magnificent clothes was walking toward them through the soft twilight. She seemed almost like a lovely vision. They never dreamed that the enemy they feared was standing before them in disguise.
        - id: ch02-b03
          speaker: kumaso
          text: >-
            Look at that beautiful woman! Where can she have come from?
          emotion: surprised
        - id: ch02-b04
          speaker: narrator
          text: >-
            Kumaso forgot all about war, their council, and the danger they had just been discussing. He beckoned to the disguised Prince, ordered him to sit with them, and told him to serve their wine. Fierce delight rose in Yamato's heart, for now he knew his plan would succeed. Still, he hid every sign of it. He put on a sweet, shy manner and came toward the rebel chief in slow steps, glancing about like a frightened deer.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Kumaso was so enchanted that he drank cup after cup simply to watch the lovely stranger pour. At last, the wine overcame him. This was the moment Yamato had been waiting for. He threw down the wine jar, seized the drunken and astonished chief, and killed him swiftly with the dagger hidden against his breast.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Takeru was struck with terror. He rushed toward the tent door, but Yamato was faster. Before the brigand could escape, an iron hand caught his clothes. The dagger flashed, and Takeru fell wounded on the ground. He was dying, but he was not dead yet.
        - id: ch02-b07
          speaker: takeru
          text: >-
            Wait. Please, give me one moment.
          emotion: fearful
        - id: ch02-b08
          speaker: narrator
          text: >-
            Takeru gasped the words and caught the Prince's hand. Yamato loosened his grip a little.
        - id: ch02-b09
          speaker: yamato_take
          text: >-
            Why should I wait for a villain like you?
          emotion: angry
        - id: ch02-b10
          speaker: narrator
          text: >-
            The outlaw raised himself fearfully and begged to know who had defeated him.
        - id: ch02-b11
          speaker: takeru
          text: >-
            Tell me where you come from, and tell me your name. My brother and I believed we were the strongest men in the land. We thought no one could overcome us. Yet you entered our stronghold alone, attacked us alone, and killed us. Can you truly be mortal?
          emotion: fearful
        - id: ch02-b12
          speaker: narrator
          text: >-
            The young Prince answered with a proud smile.
        - id: ch02-b13
          speaker: yamato_take
          text: >-
            I am Yamato, the son of the King. My father sent me to punish evil and bring death to every rebel. Robbers and murderers will no longer keep my people in fear.
        - id: ch02-b14
          speaker: narrator
          text: >-
            He held the dagger, still red, above the outlaw's head. With a great effort, the dying man spoke again.
        - id: ch02-b15
          speaker: takeru
          text: >-
            Ah, I have often heard of you. You must indeed be strong to defeat us so easily. Let me give you a new name. From this day, you shall be called Yamato Take. I leave you our title, for you are the bravest man in Yamato.
        - id: ch02-b16
          speaker: narrator
          text: >-
            With those noble words, Takeru fell back and died.
        - id: ch02-b17
          speaker: narrator
          text: >-
            After successfully ending his father's enemies, the Prince prepared to return to the capital. On the way, his journey took him through the province of Idum. There he met another outlaw named Idzumo Takeru, whom he knew had brought great harm to the land. Once again, Yamato chose a clever plan instead of an open attack. Using a false name, he approached the rebel and pretended to become his friend.
        - id: ch02-b18
          speaker: narrator
          text: >-
            Yamato made a wooden sword and wedged it tightly inside the sheath of his own strong weapon. He deliberately fastened this sword at his side whenever he expected to meet Idzumo Takeru, so the outlaw would become used to seeing it. Then, on a hot summer day, he invited the outlaw to the bank of the River Hinokawa and suggested a cooling swim in the river.
        - id: ch02-b19
          speaker: narrator
          text: >-
            Idzumo Takeru had no objection on such a hot day and gladly plunged into the cool water. While the outlaw was still swimming downstream, the Prince turned back and hurried ashore as fast as he could. Without being noticed, Yamato exchanged their swords. He placed his wooden one where Takeru's sharp steel weapon had been.
        - id: ch02-b20
          speaker: narrator
          text: >-
            The brigand knew nothing of the exchange. He soon climbed onto the bank and dressed. Then Yamato stepped forward and challenged him.
        - id: ch02-b21
          speaker: yamato_take
          text: >-
            Let us cross swords and discover which of us is the better swordsman.
        - id: ch02-b22
          speaker: narrator
          text: >-
            Idzumo Takeru accepted with delight. He was a famous fighter in that province and felt certain he would win. He still had no idea who his opponent really was. He snatched up what he believed was his sword and stood ready.
        - id: ch02-b23
          speaker: narrator
          text: >-
            But the weapon was Yamato's wooden sword. Takeru pulled at the hilt in vain. The blade was jammed so firmly in its sheath that all his strength could not free it. He pulled and struggled, but it would not move. Even if it had come loose, a wooden blade would have been useless against steel. Seeing the outlaw completely in his power, Yamato swung Takeru's own sharp sword high. He brought it down with tremendous skill and force and cut off the robber's head.
        - id: ch02-b24
          speaker: narrator
          text: >-
            So Yamato defeated the King's enemies one by one. Sometimes he used wisdom, sometimes bodily strength, and sometimes the kind of craft that people admired in those days, though they despise it now. At last, he brought peace and rest to the country and its people.
        - id: ch02-b25
          speaker: narrator
          text: >-
            When Yamato returned to the capital, the Emperor praised him for all his brave deeds. A great feast was held in the palace to celebrate his safe homecoming, and his father presented him with many rare gifts. From that time onward, Keiko loved him more than ever. He did not want Yamato to leave his side, for he said that this son had become as precious to him as one of his own arms.
    - id: ch03
      title: The Grass-Cleaving Sword
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Yamato's peaceful life did not last. When he was about thirty, news came from the eastern provinces. The Ainu, the first people of the Japanese islands, had been conquered and driven north by the Japanese. Now some had rebelled and left the region that had been given to them. They were causing great trouble across the land. The Emperor decided it was necessary to send an army against them and bring them back under his rule. But who could lead the soldiers?
        - id: ch03-b02
          speaker: narrator
          text: >-
            Prince Yamato Take immediately offered to lead the army and bring the new rebellion under control. Keiko loved him so dearly that he could hardly bear to lose sight of him for even one day. Naturally, he was deeply unwilling to send his son on another dangerous journey. Yet in the whole army, there was no other warrior as brave or strong as Yamato. The Emperor could find no one else for the task. With no other choice, he reluctantly granted the Prince's wish.
        - id: ch03-b03
          speaker: narrator
          text: >-
            When the time came to leave, Keiko gave him a weapon called the Eight-Arms-Length-Spear of the Holly Tree. Its long handle was probably made from holly wood. The Emperor ordered him to set out and subdue the people then called the Eastern Barbarians. Warriors of that ancient age prized a spear given by their King just as highly as a modern regiment prizes the standard or banner it carries into war.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Yamato received the royal spear with deep respect. He left the capital and marched east with his army. First, he visited the temples of Ise. His aunt, Princess Yamato, came out to greet him. She was the priestess who had given him the robe that helped him defeat the western brigands.
        - id: ch03-b05
          speaker: narrator
          text: >-
            He told her everything that had happened on his first expedition. He explained how her keepsake had helped him overcome the western brigands, and he thanked her from his heart. When she learned that he was leaving once again to fight his father's enemies, she went inside the temple. Soon she returned carrying a sword and a beautiful bag she had made herself. The bag was filled with flints, which people of that time used to make fire before there were matches.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The sword was Murakumo, one of the three sacred treasures of Japan's Imperial House. His aunt could have given him no more fortunate sign of protection and success. She told her nephew to use it when his need was greatest.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Yamato said farewell and returned to the head of his army. He marched through Owari to the distant eastern province of Suruga. The governor welcomed him heartily and honored him with splendid feasts. Afterward, the governor said the region was famous for its fine deer and offered to arrange a hunt for the Prince.
        - id: ch03-b08
          speaker: governor
          text: >-
            Our country has magnificent deer. Let me take you hunting, so you may enjoy the sport yourself.
        - id: ch03-b09
          speaker: narrator
          text: >-
            The governor's warmth was entirely false, but Yamato did not suspect him. He gladly agreed. His host led him onto a wide, wild plain where tall grass grew thickly. The governor had prepared a trap and meant to kill him there.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Yamato knew nothing of the trap. He rode hard across the open field, chasing down the deer among the high grass. Suddenly, flames and smoke burst from the brush ahead. Astonished, he pulled around and tried to retreat, but fire was already burning behind him. Then the grass to his left and right burst into flame as well. The fire spread swiftly toward him from every direction. He looked all around for the smallest chance of escape, but there was none. Fire surrounded him completely.
        - id: ch03-b11
          speaker: yamato_take
          text: >-
            So the deer hunt was an enemy's trick! What a fool I was to let him lure me into a trap like some wild animal!
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: >-
            Yamato ground his teeth as he thought of the governor's smiling treachery. Yet even in such danger, he did not lose his wits. He remembered the gifts from his aunt. It seemed she must have known that this desperate hour would come.
        - id: ch03-b13
          speaker: narrator
          text: >-
            Calmly, he opened the flint bag his aunt had given him and used it to set fire to the grass close around him. Then he drew Murakumo from its sheath. With all the speed he possessed, he cut down the tall grass on one side and then the other, clearing the space around him. He had made up his mind. If he had to die, he would die fighting for his life, not stand still and wait for death to reach him.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Then something strange happened. The wind changed and blew the other way. The fiercest flames, which had been racing toward the Prince, were driven back from him. The wind rose into a gale and swept the fire toward the governor instead. The man who had set the blaze to kill Yamato was burned to death by his own flames.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Yamato escaped and lived to tell the story without a scratch on his body or even one singed hair. He believed his escape came entirely through the power of Murakumo and the protection of Amaterasu, the Sun Goddess of Ise. She ruled the wind and all the elements and guarded those who prayed to her in an hour of danger.
        - id: ch03-b16
          speaker: narrator
          text: >-
            The Prince lifted the sacred sword over his head again and again to show his deep reverence. Then he gave it a new name, Kusanagi-no-Tsurugi, the Grass-Cleaving Sword. He named the place where he had set fire to the nearby grass and escaped death in the burning field Yaidzu. Even today, a place along the great Tokaido railway bears that name, and people say it marks the very ground where this astonishing escape took place.
        - id: ch03-b17
          speaker: narrator
          text: >-
            Once more, Prince Yamato Take had escaped an enemy's snare. His quick thinking and courage carried him onward, and in the end he outwitted and subdued every foe in his path. From Yaidzu, he marched east until he reached the shore at Idzu, where he planned to cross the water to Kadzusa.
    - id: ch04
      title: Princess Ototachibana
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Throughout all these dangers and adventures, Yamato's faithful wife, Princess Ototachibana, had followed him. For his sake, she counted the weariness of long journeys and the dangers of war as nothing. She loved her warrior husband so deeply that every hardship seemed worthwhile if she could only serve him. She was content to hand him his sword when he went out to battle or care for his needs when he came back exhausted to camp.
        - id: ch04-b02
          speaker: narrator
          text: >-
            But the Prince thought only of war and conquest. He paid little attention to Ototachibana. Long travel, worry, and grief over his coldness had faded her beauty, and the sun had browned her ivory skin. One day, Yamato told her that she belonged behind the screens of the palace, not beside him on the warpath.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Still, she could not bring herself to leave him. Perhaps she would have been happier if she had, for her heart was nearly broken when their journey took them through Owari.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Princess Miyadzu lived there in a palace shaded by pine trees, beyond a set of stately gates. She was as beautiful as cherry blossoms in the pink light of a spring dawn. Her clothes were bright and delicate, and her skin was white as snow. She had never grown weary on the road of duty or walked beneath the burning summer sun.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Yamato felt ashamed of his sunburned wife and her travel-stained clothes. He ordered Ototachibana to remain behind while he visited Miyadzu. Day after day, he spent long hours in the palace gardens, caring only for his own pleasure. His wife stayed in the tent and wept over the misery that had entered her life.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Yet Ototachibana was so patient and faithful that she never allowed one word of blame to escape her lips. No frown disturbed the gentle sadness of her face. Whatever pain she carried, she kept it hidden. She was always ready with a smile to welcome her husband when he returned or to see him off with the same kindness whenever he left.
        - id: ch04-b07
          speaker: narrator
          text: >-
            At last, the time came to leave for Idzu and cross the sea to Kadzusa. Yamato told his wife to follow among his attendants while he made a formal farewell to Princess Miyadzu. Miyadzu came out in splendid robes and seemed lovelier than ever. The Prince forgot his wife and his duty. He thought only of the pleasure before him.
        - id: ch04-b08
          speaker: yamato_take
          text: >-
            When this war is over, I will come back to Owari and marry you.
        - id: ch04-b09
          speaker: narrator
          text: >-
            As he finished speaking, Yamato looked up and met Ototachibana's wide eyes. They were fixed on him with sorrow and disbelief too deep for words. He knew he had done wrong, but he hardened his heart and rode away, giving little thought to the pain he had caused her.
        - id: ch04-b10
          speaker: narrator
          text: >-
            At the seashore in Idzu, his men searched for boats to cross the strait. Finding enough vessels for the whole army was difficult. Yamato stood on the beach, proud of his strength, and mocked their concern.
        - id: ch04-b11
          speaker: yamato_take
          text: >-
            You call this the sea? It is no more than a brook! Why do you need so many boats? I could jump across if I chose.
        - id: ch04-b12
          speaker: narrator
          text: >-
            At last, everyone embarked and the boats were well on their way across the strait. Suddenly, clouds covered the sky and a great storm rose. Waves climbed like mountains. Wind howled, lightning flashed, and thunder rolled. The boat carrying Yamato, Ototachibana, and his men was hurled from one foaming crest to another. Each moment seemed certain to be their last, and it appeared that the angry sea must swallow them all.
        - id: ch04-b13
          speaker: narrator
          text: >-
            Rin Jin, the Dragon King of the Sea, had heard Yamato's jeering words. In anger, he raised the terrible storm to teach the proud Prince how fearsome the sea could be, even if it looked like a brook from shore.
        - id: ch04-b14
          speaker: narrator
          text: >-
            The terrified crew lowered the sails and struggled to keep control of the rudder. Every man worked desperately for his life, but nothing helped. The wind and waves only grew more violent. At last, all of them gave up hope and believed they were lost.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Then Ototachibana stood. She forgot every grief her husband had caused her. She forgot that he had grown tired of her. Love filled her with one desire: to save him. If giving her own life could rescue Yamato from death, she would do it.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Waves crashed over the boat and the wind spun furiously around them. Ototachibana raised her voice above the storm.
        - id: ch04-b17
          speaker: ototachibana
          text: >-
            This storm must have come because the Prince angered Rin Jin with his careless jest. If the Sea God demands my husband's life, then I, Ototachibana, will calm his anger.
        - id: ch04-b18
          speaker: narrator
          text: >-
            She turned and spoke directly to the sea.
        - id: ch04-b19
          speaker: ototachibana
          text: >-
            I will take the place of His Augustness, Yamato Take. I give my life to your offended depths. Hear me, and carry him safely to the shore of Kadzusa.
          emotion: calm
        - id: ch04-b20
          speaker: narrator
          text: >-
            With those words, she quickly leaped into the raging sea. The waves caught her at once. They whirled her farther and farther from the boat until she was lost to sight.
        - id: ch04-b21
          speaker: narrator
          text: >-
            At once, the storm stopped. The sea became as smooth and calm as the floor mats beneath the astonished watchers. The Sea Gods had been appeased. Clouds cleared, and the sun shone as brightly as it did on a summer day.
        - id: ch04-b22
          speaker: narrator
          text: >-
            Yamato soon reached the opposite shore and landed safely, just as his wife had asked the Sea God to allow. He continued his campaign in the east. After some time, his marvelous skill in war brought him victory over the Ainu rebels.
        - id: ch04-b23
          speaker: narrator
          text: >-
            He knew his safe crossing had come through Ototachibana's faithfulness. She had freely and lovingly given herself when his danger was greatest. The memory softened his heart, and she never left his thoughts. Only when it was too late did he understand the goodness of her heart and the greatness of her love.
        - id: ch04-b24
          speaker: narrator
          text: >-
            On the journey home, Yamato reached the high pass of Usui Toge. He stopped there and looked at the wonderful country below. From that great height, the whole land lay open before him in a vast sweep of mountains, plains, and forests. Rivers wound through it like silver ribbons. Far away, the sea shimmered like a glowing mist in the distance. There, Ototachibana had given her life for him.
        - id: ch04-b25
          speaker: narrator
          text: >-
            He turned toward the distant water and stretched out his arms. He remembered the love he had rejected and his own unfaithfulness. A bitter cry of sorrow broke from his heart.
        - id: ch04-b26
          speaker: yamato_take
          text: >-
            Azuma, Azuma, Ya! Oh, my wife, my wife!
          emotion: sad
        - id: ch04-b27
          speaker: narrator
          text: >-
            Even now, a district in Tokyo called Azuma recalls the Prince's words, and people still point out the place where his faithful wife entered the sea to save him. Ototachibana was unhappy in life, but history has kept her memory alive. The story of her selfless and heroic death has never passed away.
    - id: ch05
      title: The Monster of Mount Ibuki
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Yamato Take had now carried out every command from his father. He had subdued the rebels and freed the land from robbers and enemies of peace. His fame spread everywhere. No one in the country could stand against a warrior so strong in battle and so wise in council.
        - id: ch05-b02
          speaker: narrator
          text: >-
            He meant to return home by the same road he had traveled before. Then he decided another route would be more interesting. So he passed through Owari and entered the province of Omi.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The people of Omi were living in great excitement and terror. Yamato saw signs of mourning on many houses and heard loud cries of grief as he passed. He stopped to ask what had happened. A terrible monster, the people told him, had appeared in the mountains. Each day it came down to raid the villages and devoured anyone it could catch.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Many families had lost someone. Men were afraid to work in their fields, and women feared going to the rivers to wash rice. When Yamato heard this, anger blazed in him.
        - id: ch05-b05
          speaker: yamato_take
          text: >-
            I have defeated the King's enemies from western Kiushiu to the eastern edge of Yezo. No one dares rebel or break his laws. Yet here, so close to the capital, a wicked monster has made the King's people live in terror. It will not go on devouring innocent people for long. I will kill it now.
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: >-
            Yamato set off for Mount Ibuki, where the creature was said to live. He had climbed a long way when the path curved and a monstrous serpent appeared, blocking his way.
        - id: ch05-b07
          speaker: yamato_take
          text: >-
            This must be the monster. I need no sword against a serpent. My own hands will be enough.
        - id: ch05-b08
          speaker: narrator
          text: >-
            He sprang upon the serpent and wrapped his bare arms around it. Before long, his enormous strength overcame the beast, and it lay dead at his feet.
        - id: ch05-b09
          speaker: narrator
          text: >-
            Suddenly, a strange darkness covered the mountain and rain began to pour. Between the gloom and the falling water, Yamato could barely see which way he should go. For a time, he could only grope his way down the pass. Before long, the weather cleared again, and the brave Prince was able to hurry the rest of the way down the mountain.
        - id: ch05-b10
          speaker: narrator
          text: >-
            Once he was back, Yamato began to feel terribly ill. Burning pains seized his feet, and he understood that the serpent had poisoned him during their struggle. His suffering soon became so severe that he could hardly move at all. Walking on his own was completely impossible.
        - id: ch05-b11
          speaker: narrator
          text: >-
            Since he could no longer travel by himself, Yamato had his men carry him to a place in the mountains famous for its hot mineral springs. The water rose bubbling straight from the earth, heated almost to boiling by the volcanic fires deep below the ground.
        - id: ch05-b12
          speaker: narrator
          text: >-
            Yamato bathed in those hot waters every day. Gradually, he felt his lost strength returning. The burning pains weakened and finally left him. Then one day, to his great joy, he discovered that he was completely well again and could continue his journey.
    - id: ch06
      title: The Return to Ise
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            As soon as he recovered, Yamato hurried to the temples of Ise. He had prayed there before beginning this long expedition, and now his aunt, the priestess of the shrine, came to welcome him home.
        - id: ch06-b02
          speaker: narrator
          text: >-
            The Prince told his aunt about the many dangers he had faced throughout the expedition. He described the marvelous ways his life had been preserved through them all. Princess Yamato listened to his story, then praised both his courage and his great skill as a warrior.
        - id: ch06-b03
          speaker: narrator
          text: >-
            Then she dressed in her most magnificent robes and gave thanks to their ancestor, the Sun Goddess Amaterasu. Both aunt and nephew believed that the goddess's protection had carried the Prince safely through every danger.
        - id: ch06-b04
          speaker: narrator
          text: >-
            Here ends the story of Prince Yamato Take of Japan.
