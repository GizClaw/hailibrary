audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    yamato_take:
      display_name: 日本武尊
      tts:
        delivery: 英武果决，年轻时骄傲锐利，悔悟时沉痛克制
        timbre: 清朗有力的成年男声
        pace: 稳健，交战时明快
        pitch: 中低音
    kumaso:
      display_name: 熊袭
      tts:
        delivery: 粗豪自负，酒后迟钝松懈
        timbre: 粗厚的成年男声
        pace: 偏慢
        pitch: 低音
    takeru:
      display_name: 武
      tts:
        delivery: 凶悍中带着临死前的敬服
        timbre: 沙哑有力的成年男声
        pace: 急促，气息虚弱
        pitch: 中低音
    ototachibana:
      display_name: 弟橘媛
      tts:
        delivery: 温柔忠贞，危难中庄重坚定
        timbre: 柔和清澈的成年女声
        pace: 舒缓而坚定
        pitch: 中高音
  chapters:
    - id: ch01
      title: 三件神器与少年王子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 日本皇室的标志由三件宝物组成。它们自远古以来就被奉为神器，受到极其严密的守护，那就是八咫镜、八尺琼勾玉和丛云剑。其中，丛云剑后来又叫草薙剑，也就是斩草之剑。三件神器之中，它被看作最珍贵、最值得尊崇的一件。对尚武的日本人来说，这柄剑象征力量。只要天皇虔诚地把它供奉在祖先的神宫里，它便是保佑天皇战无不胜的宝物。
        - id: ch01-b02
          speaker: narrator
          text: 将近两千年前，丛云剑供奉在伊势神宫。那里祭祀着伟大而美丽的太阳女神天照大神，据说历代天皇都是她的后裔。至于丛云剑为什么会改名为草薙剑，还要从一位勇敢的王子说起。
        - id: ch01-b03
          speaker: narrator
          text: 很久以前，景行天皇有个次子，名叫小碓命。景行天皇是日本王朝始祖神武天皇的第十二代后裔。小碓命从小便有非凡的力量、智慧和胆量，父亲看出他将来必成大器，对他的疼爱甚至超过了长子。
        - id: ch01-b04
          speaker: narrator
          text: 小碓命十六岁那年，依照古代日本的规矩，已经算是成人了。当时，国内正被一伙匪徒搅得不得安宁。熊袭和武兄弟是他们的首领，这些人仿佛以反抗天皇为乐，到处破坏法令，把一切权威都不放在眼里。景行天皇终于命次子去平定匪徒，最好能把这些为害人间的恶人彻底除掉。
        - id: ch01-b05
          speaker: narrator
          text: 王子虽然刚刚成年，却有老练武士那般无畏的心，从来不知道什么叫害怕。那时已没有谁能在勇气和胆识上胜过他，所以他欢欢喜喜领受了父亲的命令，立刻召集忠诚的部下。众人擦亮铠甲，整装待发，皇宫上下顿时忙碌起来。
        - id: ch01-b06
          speaker: narrator
          text: 出发以前，王子先到伊势神宫祈祷，也去向姑母倭姬命辞行。想到前方的危险，他心里有些沉重，很需要祖先天照大神的庇佑。姑母高兴地迎接他，祝贺他得到天皇信任，担起了重任。她又送给侄儿一件华美长袍作为纪念，说它必能带来好运，在这趟历险中帮上大忙。
        - id: ch01-b07
          speaker: narrator
          text: 倭姬命祝愿侄儿大功告成，一路平安。年轻的王子在姑母面前深深俯身行礼，满心欢喜地接过这份珍贵礼物，又恭恭敬敬拜谢了好几次。
        - id: ch01-b08
          speaker: yamato_take
          text: 我这就出发。
        - id: ch01-b09
          speaker: narrator
          text: 王子回到皇宫，率领军队启程。姑母的祝福给了他勇气，他已经准备好面对一切。大军一路南下，来到匪徒盘踞的九州岛。可是，越接近熊袭兄弟的大本营，道路越难走。山岭陡峭，峡谷幽深，巨树和岩石拦住去路，军队几乎无法前进一步。
        - id: ch01-b10
          speaker: narrator
          text: 小碓命年纪虽轻，却很有智慧。他看出继续带兵硬闯毫无用处，便在心里盘算起来。
        - id: ch01-b11
          speaker: yamato_take
          text: 士兵不熟悉这里，又要开路，又要作战，只会更加困难。不如用计，趁敌人没有防备时突然动手。这样，我也许不用耗费多少力气，就能除掉他们。
    - id: ch02
      title: 敌营里的美人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 王子命军队停在途中。他的妻子弟橘媛也随军而来，王子便叫她取出姑母送的长袍，帮自己打扮成女人。他穿上长袍，把头发放下来，让乌黑的长发一直垂到肩头，又把妻子的梳子插进发间，戴上一串串奇异的珠宝，就像画中的装扮一样。弟橘媛最后递来镜子，王子望着镜中的人笑了。这身装扮毫无破绽，连他自己也差点认不出来。武士身上的一切痕迹都消失了，明亮的镜中只剩一位美丽女子在回望着他。
        - id: ch02-b02
          speaker: narrator
          text: 他独自走向敌营，丝袍褶裥里藏着一把锋利短刀，刀身紧贴着强健的胸膛。傍晚时分，熊袭和武正在帐篷里乘凉。他们刚听说天皇的儿子带着大军前来剿匪。两人早就知道年轻王子的威名，平生作恶以来，第一次尝到了害怕的滋味。
        - id: ch02-b03
          speaker: narrator
          text: 谈话停顿时，两人抬头望向帐门，看见一位衣着华贵的美人缓缓走来。暮色里，她简直像一道美丽的幻影。他们哪里知道，这正是令自己胆寒的仇敌。
        - id: ch02-b04
          speaker: kumaso
          text: 多美的女人啊！她是从哪里来的？
          emotion: surprised
        - id: ch02-b05
          speaker: narrator
          text: 熊袭只顾盯着这位温柔的不速之客，早把战争和谋划抛在脑后。他招手叫美人坐下，替兄弟二人斟酒。小碓命暗暗快意，知道计策就要成功，却仍装出羞怯甜美的样子，慢慢走近，眼神像一头受惊的鹿。
        - id: ch02-b06
          speaker: narrator
          text: 熊袭被迷得神魂颠倒。为了让美人不停替自己斟酒，他一杯接一杯喝下去，最后醉得不省人事。王子一直在等待这一刻。他猛地扔下酒壶，一把抓住又醉又惊的熊袭，抽出胸前暗藏的短刀，迅速将他刺死。
        - id: ch02-b07
          speaker: narrator
          text: 武看见兄长被杀，吓得转身便逃。可王子的动作比他更快。武还没跑到帐门，一只铁钳般的手便从身后揪住衣裳。短刀寒光一闪，他中刀倒地，却还没有断气。
        - id: ch02-b08
          speaker: takeru
          text: 等……请等一下！
        - id: ch02-b09
          speaker: narrator
          text: 武痛苦地喘息着，抓住王子的手。小碓命稍稍松了力气。
        - id: ch02-b10
          speaker: yamato_take
          text: 你这个恶贼，我凭什么停手？
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: 匪徒战战兢兢撑起身子。
        - id: ch02-b12
          speaker: takeru
          text: 请告诉我，你从哪里来，又是什么人？我一直以为，我和死去的兄长就是全国最强的人，谁也打不败我们。可你独自闯进堡垒，又一个人杀了我们！你一定不是凡人吧？
        - id: ch02-b13
          speaker: narrator
          text: 年轻的王子骄傲地笑了，把滴血的短刀高举在匪徒头顶。
        - id: ch02-b14
          speaker: yamato_take
          text: 我是天皇的儿子小碓命。父亲派我来惩治邪恶，取尽叛贼的性命！从此以后，强盗和杀戮再也不能让百姓活在恐惧里！
        - id: ch02-b15
          speaker: narrator
          text: 垂死的武用尽最后的气力开口。
        - id: ch02-b16
          speaker: takeru
          text: 我常听人说起你。你能轻易打败我们，的确是位强者。让我送你一个新名字吧。从今以后，你就叫日本武尊。我把自己的“武”字赠给你，因为你是大和国最勇猛的人。
        - id: ch02-b17
          speaker: narrator
          text: 说完这番高尚的话，武向后一倒，死去了。
    - id: ch03
      title: 计除出云建
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 王子除掉了父亲在人世间的仇敌，便准备返回京城。归途中，他经过出云国，遇见另一个为害百姓的匪徒，名叫出云建。王子早就知道此人在当地作恶多端，于是再一次想出计策。他隐瞒真实姓名，假装和出云建交朋友，又做了一把木剑，把剑身死死卡在自己结实的剑鞘里。每逢可能见到这个第三个以“武”为名的强盗时，他都故意把木剑佩在腰间。
        - id: ch03-b02
          speaker: narrator
          text: 一个炎热的夏日，王子约出云建来到斐伊川边，劝他一起跳进清凉的河水游泳。匪徒欣然答应。趁出云建还在顺流游向远处，王子迅速折返上岸，没有惊动任何人，悄悄调换了两人的佩剑，把自己的木剑放到对方利剑的位置。
        - id: ch03-b03
          speaker: narrator
          text: 出云建毫不知情。等他上岸穿好衣服，王子走到面前，向他挑战。
        - id: ch03-b04
          speaker: yamato_take
          text: 我们来比试一场，看看谁的剑术更高！
        - id: ch03-b05
          speaker: narrator
          text: 出云建是本国闻名的剑客，还不知道对手的真实身份，自信必胜，欢欢喜喜答应下来。他一把抓起自以为是自己佩剑的那把剑，摆好架势。可他怎么也拔不出剑身，使尽全力，木剑仍卡得纹丝不动。就算拔出来，它也根本无法伤人。
        - id: ch03-b06
          speaker: narrator
          text: 日本武尊见敌人已经落入掌握，举起换来的利剑，用惊人的力量和技巧猛劈下去，斩下了匪徒的头颅。他有时运用智慧，有时凭借力量，有时又施展计谋。在那个年代，计谋受到的推崇，正像今日受到的鄙弃一样。他就这样逐一击败天皇的敌人，为国家和百姓带回和平安宁。
        - id: ch03-b07
          speaker: narrator
          text: 王子回到京城，天皇称赞他的英勇功绩，在宫中设宴庆祝他平安归来，还赏赐了许多稀世珍宝。此后，父亲更加疼爱日本武尊，不肯让他离开身边，说这个儿子已经像自己的一条臂膀那样珍贵。
        - id: ch03-b08
          speaker: narrator
          text: 然而，安逸的日子并没有持续多久。王子大约三十岁时，东方传来叛乱的消息。阿伊努人原是日本岛上的原住民，后来被日本人征服，迁往北方。如今，他们离开划定的居住地，在东部各国起事。天皇必须派出军队迎战，使他们重新归顺。可谁能担任统帅呢？
        - id: ch03-b09
          speaker: narrator
          text: 日本武尊立刻请命。天皇深爱儿子，哪怕一天看不见他都难以忍受，实在不愿让他再次远征。可是，全军找不到第二个像王子这样强健勇敢的武士。父亲别无选择，只好勉强答应。
        - id: ch03-b10
          speaker: narrator
          text: 临行时，天皇赐给王子一杆八寻矛，据说枪柄由冬青木制成，又命他出征讨伐当时所谓的东夷，也就是阿伊努人。王子怀着无比崇敬的心，恭恭敬敬接过父亲赐予的长枪。在那个久远的年代，武士珍视八寻矛，就像今日一支军队出征时珍视君王亲自授予的军旗一样。
    - id: ch04
      title: 草薙剑
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王子恭敬接过长枪，率军离开京城，向东进发。他先到伊势神宫参拜，又见到了身为最高女祭司的姑母倭姬命。他把上次出征的经历全都讲给姑母听，告诉她，那件长袍怎样帮助自己除掉西方匪徒，还为此衷心道谢。
        - id: ch04-b02
          speaker: narrator
          text: 倭姬命听说侄儿又要迎战父亲的敌人，走进神宫，出来时带着一柄剑和一只亲手缝制的美丽袋子。袋里装满燧石，那时的人正靠这种石头生火。她把两件东西送给王子，嘱咐他在最危急的时候使用那柄剑。
        - id: ch04-b03
          speaker: narrator
          text: 原来，这正是三件皇室神器之一的丛云剑。世上再没有比它更吉祥、更能保佑王子成功的护身宝物了。日本武尊告别姑母，再次站到军队最前方，率领部下向遥远的东方进军。他穿过尾张国，后来来到骏河国。当地国守热情迎接，接连摆下许多盛宴，像款待君王一样招待这位贵客。
        - id: ch04-b04
          speaker: narrator
          text: 宴饮结束后，国守说本国的鹿群远近闻名，邀请王子前去猎鹿。那份热忱全是假装的，日本武尊却受了蒙骗，欣然同意。国守把他带到辽阔荒凉的原野。高草长得又密又深，王子毫不知情，纵马追逐鹿群。突然，前方灌木里蹿出火焰和浓烟。
        - id: ch04-b05
          speaker: narrator
          text: 王子察觉不妙，刚刚调转马头，便发现后方也起了火。紧接着，左右两边的荒草也冒出烈焰，火势从四面飞快逼来。他环顾周围，却找不到任何出路。自己已经被大火团团包围。
        - id: ch04-b06
          speaker: yamato_take
          text: 原来猎鹿只是敌人的诡计！我真愚蠢，竟像野兽一样被人诱进圈套！
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 想到国守笑容背后的背叛，王子气得咬牙切齿。可处境再凶险，他也没有慌乱。生死关头，他想起了姑母的临别赠礼。姑母仿佛早有先见，知道他会遇上今日的危难。
        - id: ch04-b08
          speaker: narrator
          text: 王子镇定地打开燧石袋，先点燃近旁的草，再抽出丛云剑，飞快砍倒身体两侧的荒草。他已经下定决心，就算非死不可，也要为活命战斗到最后一刻，绝不能站着等死。
        - id: ch04-b09
          speaker: narrator
          text: 奇异的事情发生了。风向突然改变，从完全相反的方向吹来。方才火势最猛、不断朝王子逼近的野火，如今反被吹向远处。日本武尊毫发无伤，身上没有一道擦痕，连一根头发也没烧掉，终于能把这场不可思议的逃生讲给后人听。狂风却越刮越猛，追上了设下毒计的国守。国守最终葬身于自己为烧死王子而点燃的大火。
        - id: ch04-b10
          speaker: narrator
          text: 日本武尊相信，自己能死里逃生，全靠丛云剑的神力，也全靠伊势太阳女神天照大神的庇佑。太阳女神掌管着风和世间一切自然力量，凡是在危难中向她祈祷的人，都会得到她的保护。王子双手举起珍贵的宝剑，一次又一次把它高高举过头顶，表达自己深深的敬意。就在那一刻，他为这柄剑重新取了名字，叫作草薙剑，也就是斩草之剑。
        - id: ch04-b11
          speaker: narrator
          text: 他还把那片点燃荒草、逃出火海的地方命名为烧津。直到今天，东海道铁路沿线仍有一地叫烧津，据说那场惊险的逃生正发生在那里。勇敢的王子就这样识破敌人的陷阱，凭智慧与胆量制服了所有仇敌。他离开烧津继续东行，来到伊豆海岸，准备渡海去上总。
    - id: ch05
      title: 弟橘媛
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 一路上，妻子弟橘媛始终陪着王子。为了丈夫，她不在乎长途跋涉的疲惫，也不怕战争的危险。她深深爱着这位武士。只要能在他出战时递上佩剑，在他疲倦回营时照料他，便觉得一路吃过的苦都有了回报。
        - id: ch05-b02
          speaker: narrator
          text: 可王子满心只有战争和征服，并不珍惜忠贞的妻子。常年在外风吹日晒，再加上丈夫冷淡带来的牵挂与忧伤，弟橘媛的美貌渐渐憔悴，象牙般洁白的皮肤也被太阳晒成褐色。一天，王子甚至对她说，她真正该待的地方是家中的宫殿，是屏风后面的内室，不该跟着他四处征战。
        - id: ch05-b03
          speaker: narrator
          text: 丈夫一再冷落她，弟橘媛还是舍不得离开。可一行人来到尾张时，她的心几乎碎了。那里住着美丽的宫簀媛。她的宫殿掩映在松树间，有着宏伟的宫门。宫簀媛美得像春日清晨红霞中的樱花，衣裳鲜亮精美，皮肤洁白如雪。她从未为了责任在路上奔波，也没有在夏日烈阳下赶过远路。
        - id: ch05-b04
          speaker: narrator
          text: 王子看看风尘仆仆、皮肤晒黑的妻子，竟觉得羞耻。他叫弟橘媛留在后面，自己去拜访宫簀媛。此后，他一天又一天待在新朋友的花园与宫殿里，只顾眼前的快乐。可怜的妻子独自留在营帐中，为生活里的苦难流泪。
        - id: ch05-b05
          speaker: narrator
          text: 弟橘媛却是一位极其忠贞又能忍耐的妻子。她从不说一句责备丈夫的话，也不让皱眉破坏脸上温柔的哀愁。无论王子疲惫归来，还是再次外出，她总带着微笑迎接或送行。后来，日本武尊终于要离开伊豆，渡海前往上总。他让妻子以侍从身份跟随队伍，自己去郑重地向宫簀媛告别。
        - id: ch05-b06
          speaker: narrator
          text: 宫簀媛穿着华丽长袍出来相见，显得比从前更加美丽。日本武尊一见到她，便忘了妻子，忘了责任，也忘了其他一切。他只顾眼前的享乐，当场发誓，等战争结束便回到尾张，娶宫簀媛为妻。
        - id: ch05-b07
          speaker: narrator
          text: 话一出口，他抬起头，正对上弟橘媛那双杏仁般的大眼睛。她目不转睛地望着丈夫，眼里满是难以诉说的悲伤与惊愕。王子立刻知道自己做错了，也知道这句话深深伤害了她。可是，他仍旧硬起心肠，骑马继续赶路，对自己造成的痛苦不肯多加理会。
        - id: ch05-b08
          speaker: narrator
          text: 众人终于来到伊豆海岸。士兵们四处寻找船只，准备渡过海峡前往上总。可是军队人数众多，要找够能让所有士兵一起登船的船只，实在很不容易。日本武尊站在沙滩上，仗着自己力量过人，看着忙碌的部下，轻蔑地嘲笑起来。
        - id: ch05-b09
          speaker: yamato_take
          text: 这也能叫海吗？不过是一条小河！何必找这么多船？只要我愿意，一下就能跳过去。
        - id: ch05-b10
          speaker: narrator
          text: 众人终于全部登船，驶进海峡。走到半途，天空忽然乌云密布，猛烈的风暴骤然袭来。海浪高得像山，狂风呼啸，电光一次次撕开天空，雷声滚滚不绝。载着弟橘媛、王子和部下的船只被翻滚的巨浪从一个浪尖抛向另一个浪尖。船上每个人都觉得下一刻就是生命的终点，所有人都要被愤怒的大海吞没。
        - id: ch05-b11
          speaker: narrator
          text: 原来，海中龙王听见王子的讥讽，愤怒地掀起了这场可怕的风暴。他要给傲慢的王子看看，大海就算看着像一条小河，发怒时究竟能有多么可怕。惊恐的船员赶紧降下船帆，又拼命照看船舵，为保住自己的性命用尽一切力气。可他们所做的一切都没有用，风暴反而越发凶猛，所有人都认定自己逃不过这一劫。
        - id: ch05-b12
          speaker: narrator
          text: 这时，忠贞的弟橘媛站了起来。她忘了丈夫带来的一切伤痛，甚至忘了丈夫早已厌倦自己。她心中只有一个愿望，那就是救他。只要能把丈夫从死亡手里夺回来，她甘愿献出自己的生命。
        - id: ch05-b13
          speaker: narrator
          text: 海浪不断扑上船舷，狂风在四周疯狂旋转。弟橘媛迎风站稳，向众人说道。
        - id: ch05-b14
          speaker: ototachibana
          text: 这场灾难一定是因为王子出言戏谑，触怒了海神龙王。如果真是这样，我弟橘媛愿意平息海神的怒火。他想要的，正是我丈夫的性命！
        - id: ch05-b15
          speaker: narrator
          text: 她随即转身面对大海。
        - id: ch05-b16
          speaker: ototachibana
          text: 我愿替代尊贵的日本武尊。我将投进你被冒犯的深渊，用自己的生命换回他的生命。请听我的祈求，把他平安送到上总岸边。
          emotion: calm
        - id: ch05-b17
          speaker: narrator
          text: 说完这些话，她立刻纵身跃入汹涌的大海。浪涛很快将她卷向远处，她的身影从众人眼前消失，再也看不见了。奇怪的是，风暴就在那一刻停息，方才还怒吼翻腾的海面变得平滑宁静，就像船上那些惊愕的人正坐着的席面。海中诸神终于息怒，乌云散去，天空重新放晴，明亮的阳光照耀下来，仿佛又是一个平常的夏日。
    - id: ch06
      title: 吾妻，吾妻
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 风浪平息之后，日本武尊很快抵达海峡对岸，平平安安踏上陆地，一切正如弟橘媛献出生命前向大海祈求的那样。接下来，他继续率军作战，在战场上显出惊人的本领。经过一段时间，他终于征服了东方起事的阿伊努人。
        - id: ch06-b02
          speaker: narrator
          text: 王子知道，自己能活着上岸，全靠忠贞的妻子。她在他最危险的时刻，心甘情愿地牺牲自己，救下他的生命。每次想起弟橘媛，他冷硬的心便柔软下来。从此，她没有一刻离开过他的思绪。可惜，他太晚才懂得珍惜妻子的善良，也太晚才明白她的爱有多么深。
        - id: ch06-b03
          speaker: narrator
          text: 回家的路上，王子登上碓冰岭，站在高处眺望。整个国土铺展在脚下。山峦、平原和森林组成辽阔的画卷，河流像银色缎带一样穿行其间。更远的天边，大海闪着光，仿佛一层明亮的雾。弟橘媛正是在那片海里献出了生命。
        - id: ch06-b04
          speaker: narrator
          text: 王子转身面向那片遥远的大海，向着妻子献出生命的方向张开双臂。他想起弟橘媛曾怎样深爱自己，想起自己不但轻视了那份爱，还对她如此无情，彻底辜负了她。悔恨和悲痛再也压不住，一声苦涩而凄凉的呼喊冲出了胸膛。
        - id: ch06-b05
          speaker: yamato_take
          text: 吾妻，吾妻啊！
          emotion: sad
        - id: ch06-b06
          speaker: narrator
          text: 直到今天，东京仍有一个地区叫作吾妻，纪念王子的这声呼唤。弟橘媛为了挽救丈夫而跃入大海的地点，也一直有人指给后人看。她活着时虽然并不幸福，历史却让人们长久地怀念她。她舍弃自己、英勇赴死的故事，也永远不会从世人的记忆里消失。
        - id: ch06-b07
          speaker: narrator
          text: 日本武尊已经完成父亲交付的所有命令。他平定每一场叛乱，扫除国内所有强盗，也除掉了破坏和平的敌人。他的声名传遍全国，再没有谁能站出来与他对抗，因为他在战场上无比强悍，商议军情时又十分明智。
        - id: ch06-b08
          speaker: narrator
          text: 他本想沿原路直接回家，后来觉得换条路走或许更有趣，便穿过尾张，来到近江。当地百姓正陷在惊慌与恐惧中。王子沿途看见许多人家挂着丧亡的标志，到处传来哀哭。他一打听，才知道山里出现了一头可怕的怪物。
        - id: ch06-b09
          speaker: narrator
          text: 怪物每天从山上下来袭击村庄，抓到谁就吞掉谁。许多家庭失去了亲人，变得冷清凄凉。男人害怕遇上怪物，不敢出门到田里做每天的农活，女人也不敢走到河边淘洗一家人要吃的米。日本武尊听完，顿时怒火中烧。
        - id: ch06-b10
          speaker: yamato_take
          text: 从九州最西边到虾夷最东边，我已经制服天皇的一切敌人。如今没人敢破坏法令、反叛天皇。这里离京城这么近，竟有恶兽盘踞，祸害天皇的百姓！它吞吃无辜之人的日子到头了。我马上去杀掉它！
          emotion: angry
    - id: ch07
      title: 伊吹山归来
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 王子立即向怪物栖身的伊吹山进发。他爬了很长一段山路，来到一处转弯，眼前突然出现一条巨蛇，横在路中央，挡住去路。
        - id: ch07-b02
          speaker: yamato_take
          text: 这一定就是那头怪物。对付一条蛇，不用拔剑，我两手就能杀死它。
        - id: ch07-b03
          speaker: narrator
          text: 他猛扑过去，用赤裸的双臂死死扼住巨蛇，想亲手把它勒死。王子力大无穷，没过多久便占了上风，巨蛇终于倒在他脚下。就在这时，黑暗忽然罩住整座山岭，大雨倾盆而下。四周一片昏暗，雨幕又密得遮住视线，日本武尊几乎分不清该走哪条路，只能摸索着往山口走。
        - id: ch07-b04
          speaker: narrator
          text: 好在没过多久，王子还在山口摸索着下行，阴雨便渐渐退去，天气重新放晴。这位勇敢的英雄终于认清道路，得以迅速走下山去。可回去以后，他开始感到身体不适，两只脚像被火烧一样疼。他这才明白，巨蛇的毒已经侵入身体。剧痛让他几乎无法动弹，更别说行走了。
        - id: ch07-b05
          speaker: narrator
          text: 疼痛剧烈得让王子几乎无法动弹，更不用说自己走路。他只好叫人把自己抬到山中一处以温泉闻名的地方。富含矿物的泉水从地底汩汩冒出，被地下的火山之火烧得几乎沸腾。他每天浸泡在热泉里，渐渐感到力气重新回到身体，灼热的疼痛也一点点退去。终于有一天，他惊喜地发现，自己已经完全康复。
        - id: ch07-b06
          speaker: narrator
          text: 日本武尊随即赶往伊势神宫。大家应该还记得，踏上这次漫长的征途以前，他曾来这里祈祷。为他祝福的姑母倭姬命，如今又出来迎接他平安归来。王子向她讲述一路遭遇的种种危险，也说自己的性命怎样一次次不可思议地保全下来。
        - id: ch07-b07
          speaker: narrator
          text: 姑母听完，赞扬他的勇气与武士的英武。随后，她换上自己最庄严华美的祭服，走进神宫，向两人的祖先天照大神献上感谢。姑侄二人都相信，王子经历那么多凶险，最后仍能奇迹般保全性命，平安回来，全靠太阳女神一路庇佑。
        - id: ch07-b08
          speaker: narrator
          text: 这位勇敢的日本王子，日本武尊的故事，到这里就结束了。
