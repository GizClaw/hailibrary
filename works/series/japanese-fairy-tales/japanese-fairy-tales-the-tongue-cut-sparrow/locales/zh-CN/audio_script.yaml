audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    old_man:
      display_name: 老爷爷
      tts:
        delivery: 善良诚恳，语气温和而质朴
        timbre: 温厚略带苍老
        pace: 从容自然
        pitch: 中低音
    old_woman:
      display_name: 老婆婆
      tts:
        delivery: 尖刻急躁，悔悟后收敛柔和
        timbre: 偏尖且苍老
        pace: 较快，受惊时急促
        pitch: 中高音
    lady_sparrow:
      display_name: 麻雀姑娘
      tts:
        delivery: 轻盈有礼，真诚而宽厚
        timbre: 清脆明亮
        pace: 轻快自然
        pitch: 高音
  chapters:
    - id: ch01
      title: 被剪掉舌头的小麻雀
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，日本住着一对老夫妇。老爷爷善良勤劳，老婆婆却脾气暴躁，从早到晚总在抱怨，把家里的和气都搅没了。老爷爷早就听惯了，只当没听见。他没有孩子，白天又总在田里干活，便养了一只温顺的小麻雀，回家时好有个伴。他疼这只鸟，就像疼自己的孩子。
        - id: ch01-b02
          speaker: narrator
          text: 老爷爷每天都在露天辛苦劳作。到了晚上，他最快乐的事就是逗小麻雀，同她说话，再教她几个小把戏。小麻雀聪明得很，一学就会。他常把笼门打开，让她满屋飞，两个人一起玩。到了晚饭时候，他还会从自己的饭菜里留下几口好吃的，喂给心爱的小鸟。
        - id: ch01-b03
          speaker: narrator
          text: 一天，老爷爷进山砍柴，老婆婆留在家里洗衣服。她头一天调了满满一钵浆糊，这时去拿，钵里竟然空了。她正猜是谁用掉或偷走了浆糊，小麻雀忽然飞下来，低头行了个主人教她的礼，然后啾啾叫着开了口。
        - id: ch01-b04
          speaker: lady_sparrow
          text: 浆糊是我吃掉的。我以为钵里是特意留给我的食物，就全吃光了。要是我做错了，请您原谅我吧！啾，啾，啾！
        - id: ch01-b05
          speaker: narrator
          text: 小麻雀老老实实地认了错，又这样好声好气地请求原谅，老婆婆本该马上宽恕她。可老婆婆从来就不喜欢这只鸟，还常怪丈夫把脏鸟养在屋里，只会给自己多添活。如今抓住小麻雀的错处，她正求之不得。
        - id: ch01-b06
          speaker: narrator
          text: 老婆婆对着小鸟又骂又咒，却还不肯罢休。她一把抓住麻雀。小麻雀张着翅膀，低头伏在她面前，想让她明白自己真的后悔了。老婆婆却拿来剪刀，剪掉了可怜小鸟的舌头。
        - id: ch01-b07
          speaker: old_woman
          text: 你就是用这条舌头偷吃我的浆糊吧！这下你也尝尝，没有舌头是什么滋味！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 说完这番狠话，老婆婆就把小麻雀赶出了家门。小鸟会遇到什么危险，会受多少痛苦，她一点也不在乎，更没有半点怜悯。随后，她一边抱怨这桩麻烦，一边重新调好米浆。所有衣服上过浆后，她把它们一件件铺在木板上，拿到太阳下晒干。日本人当时这样浆洗衣物，并不像英国人那样用熨斗熨平。
        - id: ch01-b09
          speaker: narrator
          text: 傍晚，老爷爷走在回家的路上，还想着小麻雀会像往常那样，啾啾叫着飞到门前迎接他。她会欢喜地蓬起羽毛，最后落在他的肩头。可是今晚，老爷爷连她的影子也没看见。
        - id: ch01-b10
          speaker: narrator
          text: 他赶紧走进家门，匆匆脱下草鞋，踏上廊台。麻雀还是没有出现。老爷爷猜想，准是妻子又发脾气，把小鸟关进笼子了，便焦急地叫她过来。
        - id: ch01-b11
          speaker: old_man
          text: 今天，雀儿姑娘到哪里去了？
        - id: ch01-b12
          speaker: old_woman
          text: 你的麻雀？我哪知道。说起来，我整个下午都没见过她。你那么宠她，那只忘恩负义的鸟说不定还是飞走了，把你丢下不管啦！
        - id: ch01-b13
          speaker: narrator
          text: 老爷爷不肯罢休，一遍又一遍地追问。老婆婆最后只好承认，麻雀吃了她浆衣服用的米浆，虽说自己认了错，她还是一怒之下剪掉了麻雀的舌头，又把小鸟赶出去，再也不准她回来。老婆婆还把剪下来的舌头拿给丈夫看。
        - id: ch01-b14
          speaker: old_woman
          text: 瞧，这就是我剪下来的舌头！这个可恶的小东西，谁叫她把我的浆糊全吃了？
        - id: ch01-b15
          speaker: old_man
          text: 你怎么能这样狠心？唉，你怎么能这样狠心？
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: 老爷爷心地太软，不忍惩罚这个泼悍的妻子，可一想到小麻雀受的罪，心里就难受极了。
        - id: ch01-b17
          speaker: old_man
          text: 我可怜的雀儿姑娘没了舌头！她再也不能啾啾叫了。舌头那样硬生生被剪掉，她一定疼得害了病！难道一点办法也没有了吗？
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: 夜里，等妻子睡着以后，老爷爷流了许多眼泪。他用棉袍袖子擦着泪，忽然想到，明天可以出去寻找小麻雀。有了这个念头，他才总算睡着。
    - id: ch02
      title: 竹林深处的家
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天天一亮，老爷爷便起了床。他匆匆吃过早饭，翻过山岭，穿过树林。每见到一丛竹子，他都停下来呼喊。
        - id: ch02-b02
          speaker: old_man
          text: 舌头被剪掉的小麻雀呀，你住在哪里？舌头被剪掉的小麻雀呀，你住在哪里！
        - id: ch02-b03
          speaker: narrator
          text: 老爷爷连午饭也顾不上吃，一直找到下午很晚，才来到一大片竹林边。竹林正是麻雀最喜欢的住处。果然，他心爱的小麻雀就等在那里迎接他。老爷爷欢喜得不敢相信自己的眼睛，赶忙跑上前去。
        - id: ch02-b04
          speaker: narrator
          text: 小麻雀低头行礼，又把主人教过的把戏做了一遍，让他知道自己见到老朋友有多高兴。更神奇的是，她竟然还能像以前一样说话。老爷爷说起自己的难过，又问她没有舌头，怎么还能说得这么清楚。
        - id: ch02-b05
          speaker: narrator
          text: 小麻雀张开嘴给他看，原来的地方已经长出一条新舌头。她请老爷爷别再想过去的事，自己如今全好了。老爷爷仔细看过，终于放下心来，也这才明白，他养的不是普通鸟儿，而是一位仙女。
        - id: ch02-b06
          speaker: narrator
          text: 他心里的欢喜，简直说也说不尽。失散的小麻雀找到了，她没有生病，也不是从此哑了。她健康又快乐，长出了新舌头，身上看不出半点受虐待的痕迹。更了不起的是，她还是仙女。老爷爷忘了所有烦恼，连一路的疲惫都忘了。
        - id: ch02-b07
          speaker: narrator
          text: 小麻雀请他跟上，自己飞在前面，把他带到竹林深处一座美丽的宅邸。老爷爷跨进门一看，实在想不到林中藏着这样华美的地方，惊叹得不得了。屋子用雪白的木材建成，地上铺着最精美、最柔软的乳白色席子，代替了地毯。小麻雀请他坐的垫子，是上等丝绸和绉绸做的。每间屋子的床之间里，还陈设着漂亮的花瓶和漆盒。床之间，就是日本传统房间里摆放珍贵物品的壁龛。
        - id: ch02-b08
          speaker: narrator
          text: 小麻雀请老爷爷坐到最尊贵的位子，自己却退到稍远的下首。她一次次恭敬地鞠躬，感谢他许多年来一直善待自己。从现在起，我们就称她为麻雀姑娘吧。她把全家人一一介绍给老爷爷。随后，她的女儿们穿着精致的绉绸衣裳，用漂亮的古式托盘端来各色美味，一盘又一盘摆成盛宴。老爷爷看着眼前的一切，几乎以为自己正在做梦。
        - id: ch02-b09
          speaker: narrator
          text: 吃到一半，麻雀姑娘的几个女儿还为客人跳起奇妙的“雀舞”。老爷爷从没这样快活过。仙雀们侍候他，请他吃盛宴，又在他面前起舞，时间转眼便过去了。
        - id: ch02-b10
          speaker: narrator
          text: 夜幕降临，四周暗了下来。老爷爷想到回家的路还很远，只好告辞。他感谢麻雀姑娘的盛情款待，又请她看在自己的情分上，忘掉老婆婆带给她的痛苦。知道她住在这样美丽的家里，吃穿用度什么也不缺，他既欣慰又欢喜。他一路找来，就是因为放心不下，想知道她过得怎么样，究竟出了什么事。如今一切安好，他终于能放心回家了。
        - id: ch02-b11
          speaker: old_man
          text: 以后你有什么事需要我，只管派人来叫，我一定马上赶来。
        - id: ch02-b12
          speaker: narrator
          text: 麻雀姑娘请老爷爷多住几天，好好休息，也享受一下这番不同的生活。老爷爷却说，他得回去陪妻子，也得回去做工。没有照平常的时辰到家，老婆婆多半又在生气。虽然心里十分想留下，他还是不能答应这番好意。不过，现在已经知道麻雀姑娘住在哪里，往后只要有空，他一定再来看她。
    - id: ch03
      title: 小箱子里的财宝
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 麻雀姑娘见留不住他，便吩咐仆人抬来两只箱子，一只大，一只小，摆在老爷爷面前。她请他随意挑一只，作为自己送给他的礼物。老爷爷推却不了这番好意，最后选了小箱子。
        - id: ch03-b02
          speaker: old_man
          text: 我已经年老体弱，背不动那只又大又沉的箱子。既然你让我随意挑选，我就拿小的吧，背回家也容易些。
        - id: ch03-b03
          speaker: narrator
          text: 麻雀们一起把箱子放到他背上，又一路送他来到大门口。她们连连鞠躬道别，再三请他有空一定回来探望。老爷爷和心爱的麻雀就这样快快乐乐地分开了。老婆婆曾经那样伤害麻雀，麻雀姑娘却没有半点怨恨。她心里只有难过，因为善良的老爷爷一辈子都得忍受妻子的坏脾气，实在可怜。
        - id: ch03-b04
          speaker: narrator
          text: 老爷爷回到家时，已经是深夜。老婆婆等了很久，脾气比平时还坏。
        - id: ch03-b05
          speaker: old_woman
          text: 你这么半天到底去了哪里？为什么现在才回来？
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: 老爷爷拿出带回来的礼物箱，想让她消消气，又把一路的经历都讲了，告诉她麻雀一家怎样盛情款待自己。
        - id: ch03-b07
          speaker: old_man
          text: 先别生气了，我们看看箱子里有什么。你来帮我一起打开吧。
        - id: ch03-b08
          speaker: narrator
          text: 两人坐到箱子前，一起掀开盖子，不由得惊呆了。里面一直塞到箱口，全是金银钱币，还有许多别的珍贵宝物。他们把东西一件件拿出来，摆在草席上，又捧在手里翻来覆去地看。宝物铺满了小屋，连地上的草席都被照得闪闪发亮。
        - id: ch03-b09
          speaker: narrator
          text: 老爷爷看到这些从此属于自己的财宝，欢喜得不得了。麻雀送来的礼物，远远超过他最美好的想象。有了这么多财宝，他往后再也不用天天辛苦劳作，可以安安稳稳、舒舒服服地度过余生。
        - id: ch03-b10
          speaker: old_man
          text: 多亏我善良的小麻雀！多亏我善良的小麻雀！
          emotion: happy
        - id: ch03-b11
          speaker: narrator
          text: 老婆婆起初见了金银，也是又惊又喜。可这阵满足过去以后，她邪恶天性里的贪念就再也压不住了。老爷爷为人老实，连麻雀们还拿出过一只大箱子，自己因为那箱子沉重难背，才挑了小箱子的事也告诉了她。老婆婆听完，马上怪起丈夫来。
        - id: ch03-b12
          speaker: old_woman
          text: 你这个傻老头，为什么不拿那只大箱子？想想我们白白少了多少财宝！那里面的金银说不定有这里的两倍。你真是个老糊涂！
          emotion: angry
        - id: ch03-b13
          speaker: narrator
          text: 她尖声骂完，带着满腔怒气上床去了。老爷爷这才后悔自己不该提起大箱子，可惜已经迟了。老婆婆得了这份意外之财，明明受之有愧，却还是不知满足。她已经打定主意，无论如何也要再多弄些财宝回来。
    - id: ch04
      title: 贪心的来客
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天一早，老婆婆一起来，便逼老爷爷仔细说出去麻雀家的路。老爷爷看穿她的心思，想拦住她，怎么劝都没用，她一个字也不肯听。她曾在怒火中狠心剪掉麻雀的舌头，如今竟不觉得羞愧，还敢登门。为了那只大箱子，她把一切都忘了，甚至没想过麻雀们会恨她。事实上，她们当然恨她，也可能为了她做过的事惩罚她。
        - id: ch04-b02
          speaker: narrator
          text: 麻雀姑娘当初回家时，哭个不停，嘴里还流着血，模样十分凄惨。打那以后，她的家人与亲戚总在议论老婆婆的残忍。
        - id: ch04-b03
          speaker: narrator
          text: 她不过误吃了一点米浆，只犯了这么小的错，老婆婆怎么下得去那样的毒手？麻雀们都爱戴善良厚道的老爷爷。他吃了那么多苦，却始终忍耐。可她们恨透了老婆婆，早已决定，只要有机会，就让她得到应有的惩罚。这个机会很快就来了。
        - id: ch04-b04
          speaker: narrator
          text: 老婆婆走了几个钟头，终于找到丈夫说过的那片竹林。她站在林子前，高声叫喊。
        - id: ch04-b05
          speaker: old_woman
          text: 舌切雀的家在哪里？舌切雀的家在哪里？
        - id: ch04-b06
          speaker: narrator
          text: 她终于看见屋檐从竹叶间露出来，便赶到门前，用力敲门。仆人进去禀告，说从前的女主人正在门外求见。经历过那样的事，老婆婆竟敢找上门来，麻雀姑娘又惊讶又不解。不过，她是只有礼貌的鸟儿。想到老婆婆毕竟曾是自己的女主人，她还是出来迎接了。
        - id: ch04-b07
          speaker: narrator
          text: 老婆婆可没打算花时间寒暄。她一点也不羞愧，张口便直奔来意。
        - id: ch04-b08
          speaker: old_woman
          text: 你不用像款待我家老头那样费事。我亲自来，就是为了拿走他蠢得没带回去的箱子。把大箱子给我，我马上就走。我只要这个！
        - id: ch04-b09
          speaker: narrator
          text: 麻雀姑娘一句也没有争辩，立刻答应了她，又吩咐仆人把那只大箱子抬出来。老婆婆迫不及待地一把抢过箱子，费力地背到身上。她连停下来向麻雀姑娘道一声谢都不肯，转身便匆匆往家赶。
        - id: ch04-b10
          speaker: narrator
          text: 箱子实在太沉了。老婆婆连快走都做不到，更别说像自己盼的那样跑回家。她一心急着赶到家，看看箱子里究竟藏着什么，却被沉重的箱子压得走走停停，只能一次又一次坐在路边休息。
        - id: ch04-b11
          speaker: narrator
          text: 她背着重箱子踉踉跄跄地走，想打开看一眼的念头越来越强。她认定这只大箱子也装满了金银珠宝，就像丈夫带回去的小箱子一样。最后，她实在一刻也等不下去了。
    - id: ch05
      title: 大箱子的惩罚
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 贪婪自私的老婆婆把箱子放在路边，小心掀开盖子，满以为眼前会出现一座金山。谁知她看见里面的东西，吓得几乎失去知觉。
        - id: ch05-b02
          speaker: narrator
          text: 箱盖刚打开，一群狰狞可怕的妖怪便猛扑出来，把老婆婆团团围住，仿佛要取她的性命。哪怕在最恐怖的噩梦里，她也没见过这样的怪物。一个妖怪额头正中只有一只巨眼，逼过来狠狠瞪她。几个怪物张着血盆大口，像要把她吞下去。一条巨蛇盘在她身边嘶嘶吐信，还有一只大青蛙呱呱叫着，朝她蹦来。
        - id: ch05-b03
          speaker: narrator
          text: 老婆婆一辈子也没受过这样的惊吓。她双腿抖个不停，还是以最快的速度拼命逃离那里，只庆幸自己总算保住了性命。回到家里，她再也支撑不住，一下瘫倒在地。她流着眼泪，把路上发生的一切全告诉丈夫，说自己差一点就被箱子里的妖怪杀死了。
        - id: ch05-b04
          speaker: narrator
          text: 说着说着，老婆婆又怪起了麻雀。老爷爷马上制止她。
        - id: ch05-b05
          speaker: old_man
          text: 不要责怪麻雀。是你自己的恶行终于得了报应。我只希望这次能让你吸取教训，从此改过！
        - id: ch05-b06
          speaker: narrator
          text: 老婆婆再也没有说话。从那天起，她真心悔过，为过去那些暴躁、刻薄又无情的做法感到后悔。日子一天天过去，她渐渐变成了一个善良的老婆婆，简直像换了个人，连朝夕相处的丈夫都快认不出她了。
        - id: ch05-b07
          speaker: narrator
          text: 此后，夫妻俩省着花用老爷爷从爱雀那里得到的财宝，晚年不再为衣食发愁。他们无忧无虑，幸福地生活在一起。而那只给了他们财宝的爱雀，正是舌头曾被剪掉的舌切雀。
