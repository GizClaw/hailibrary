audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, thoughtful, and direct
        timbre: clear and gentle
        pace: measured
        pitch: medium
    old_man:
      display_name: Old Man
      tts:
        delivery: kind, patient, and sincere
        timbre: soft and weathered
        pace: unhurried
        pitch: low
    old_woman:
      display_name: Old Woman
      tts:
        delivery: sharp, forceful, and impatient
        timbre: dry and rough
        pace: brisk
        pitch: medium-low
    lady_sparrow:
      display_name: Lady Sparrow
      tts:
        delivery: gracious, lively, and courteous
        timbre: light and bright
        pace: gently quick
        pitch: high
  chapters:
    - id: ch01
      title: The Sparrow and the Rice Paste
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago in Japan, an old man lived with his wife. He was kind-hearted and worked hard, while she was forever cross. Her scolding spoiled the happiness of their home. From morning until night, she found something to grumble about. The old man had lived with her temper so long that he had learned not to answer her. Most days he was away working in the fields, and the couple had no child. So he kept a tame sparrow at home for company and loved the little bird as dearly as a daughter.
        - id: ch01-b02
          speaker: narrator
          text: >-
            At the end of a hard day outdoors, his greatest pleasure was coming home to her. He petted her, talked to her, and taught her little tricks, which she learned quickly. He opened her cage and let her fly around the room while they played together. At supper, he always saved a few choice bites for his small companion.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One day, the old man went into the forest to chop wood. His wife stayed home to wash clothes. The day before, she had prepared a whole bowl of rice paste for starching them. Now she went to fetch it and found the bowl completely empty.
        - id: ch01-b04
          speaker: narrator
          text: >-
            As she wondered who could have taken it, the pet sparrow flew down. She bowed her feathered head, just as her master had taught her, and told the truth.
        - id: ch01-b05
          speaker: lady_sparrow
          text: >-
            I ate the rice paste. I thought the bowl held food for me, so I finished it all. If that was wrong, please forgive me. Tweet, tweet, tweet!
        - id: ch01-b06
          speaker: narrator
          text: >-
            The sparrow had confessed honestly and asked forgiveness sweetly. The old woman should have forgiven her at once, but she did nothing of the kind. She had never loved the bird. She often quarreled with her husband for keeping what she called a dirty creature in the house, because it made more work for her. Now she was delighted to have a reason to complain.
        - id: ch01-b07
          speaker: narrator
          text: >-
            She scolded and cursed the poor bird. The sparrow spread her wings and kept bowing to show how sorry she was, but the old woman's rage only grew. She seized the little bird, fetched her scissors, and cut off her tongue.
        - id: ch01-b08
          speaker: old_woman
          text: >-
            So that is the tongue you used to eat my rice paste! Now you can find out what it is like to live without it!
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: >-
            With those dreadful words, she drove the sparrow away. She cared nothing for where the bird might go or how much she suffered. Then the old woman made another batch of rice paste, grumbling over the trouble. She starched her clothes and spread them on boards to dry in the sun, as people did in Japan instead of ironing them in the English fashion.
    - id: ch02
      title: The Search Through the Hills
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            That evening, the old man started home. He looked forward to reaching the gate and seeing his pet fly out to meet him, chirping and fluffing her feathers with joy before she settled on his shoulder. But that night, not even her shadow appeared.
        - id: ch02-b02
          speaker: narrator
          text: >-
            He hurried on, pulled off his straw sandals, and stepped onto the veranda. There was still no sparrow. He felt sure that his wife, in one of her tempers, must have shut the bird in her cage. Anxiously, he called to her.
        - id: ch02-b03
          speaker: old_man
          text: Where is Suzume San today? Where is Miss Sparrow?
        - id: ch02-b04
          speaker: narrator
          text: At first, the old woman pretended she knew nothing.
        - id: ch02-b05
          speaker: old_woman
          text: >-
            Your sparrow? How should I know? Come to think of it, I haven't seen her all afternoon. Perhaps that ungrateful bird flew away and left you, after all the fuss you made over her.
        - id: ch02-b06
          speaker: narrator
          text: >-
            The old man would not let the matter rest. He asked again and again, insisting that his wife must know what had happened to his pet. At last, she confessed it all. Crossly, she told him that the sparrow had eaten the rice paste she had made especially for starching the laundry. The bird had admitted what she had done. That confession had not softened the old woman. In her anger, she had taken her scissors, cut out the sparrow's tongue, driven the bird away, and forbidden her ever to return. Then she showed her husband the severed tongue.
        - id: ch02-b07
          speaker: old_woman
          text: >-
            Here it is, the tongue I cut off! Why did that horrible little bird have to eat all my rice paste?
          emotion: angry
        - id: ch02-b08
          speaker: old_man
          text: How could you do anything so cruel? Oh, how could you?
          emotion: sad
        - id: ch02-b09
          speaker: narrator
          text: >-
            That was all he could say. He was too gentle to punish his shrewish wife, but what had happened to his poor sparrow distressed him terribly.
        - id: ch02-b10
          speaker: old_man
          text: >-
            What a dreadful thing for my poor Suzume San to lose her tongue! She won't be able to chirp, and such a rough cut may have made her ill. What can I possibly do?
          emotion: sad
        - id: ch02-b11
          speaker: narrator
          text: >-
            After his wife went to sleep, the old man wept for a long time. He wiped his tears on the sleeve of his cotton robe. Then a hopeful thought came to him. Tomorrow, he would go and search for the sparrow. Once he had decided that, he was finally able to sleep.
        - id: ch02-b12
          speaker: narrator
          text: >-
            At daybreak, he rose early, ate a hurried breakfast, and set out. He crossed hills and passed through woods. At every clump of bamboo, he stopped and called for his pet.
        - id: ch02-b13
          speaker: old_man
          text: >-
            Where, oh where is my tongue-cut sparrow? Where, oh where is my tongue-cut sparrow?
        - id: ch02-b14
          speaker: narrator
          text: >-
            He did not even pause for his midday meal. Late in the afternoon, he came near a great bamboo grove, the sort of place sparrows love best. And there, at the edge of the wood, his own dear sparrow was waiting to welcome him.
        - id: ch02-b15
          speaker: narrator
          text: >-
            For joy, he could scarcely believe his eyes. He ran to greet her. She bowed her small head and performed several tricks he had taught her, showing how glad she was to see her old friend. Most wonderful of all, she could speak just as she had before.
        - id: ch02-b16
          speaker: narrator
          text: >-
            The old man told her how sorry he was. He asked about her tongue and wondered how she could speak so clearly without it. The sparrow opened her beak and showed him that a new tongue had grown where the old one had been.
        - id: ch02-b17
          speaker: lady_sparrow
          text: >-
            Please don't trouble yourself about what happened. I am perfectly well now.
          emotion: calm
        - id: ch02-b18
          speaker: narrator
          text: >-
            Then the old man understood that his sparrow was a fairy, not an ordinary bird. His joy was beyond measure. All the sorrow he had carried since the night before fell away. He forgot his troubles and even how tired he was after crossing the hills and woods without rest or food. He had feared that he would find his pet sick from the wound and unable ever to chirp again. Instead, she was happy and well. A new tongue had grown, and not a sign remained of the cruel treatment she had suffered. And, more wonderful still, she was a fairy.
    - id: ch03
      title: The Lady Sparrow's Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The sparrow asked the old man to come with her. She flew ahead and led him deep into the bamboo grove, where a beautiful house stood hidden. When he went inside, he stared in amazement. The house was built from the whitest wood. Soft, cream-colored mats covered the floors, and they were the finest he had ever seen. The cushions she brought him were made of delicate silk and crape. In the display alcove of every room stood lovely vases and lacquer boxes.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The sparrow showed him to the place of honor. She sat at a respectful distance and thanked him with many polite bows for the kindness he had given her over so many years. From now on, we may call her the Lady Sparrow.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The Lady Sparrow introduced the old man to her entire family. Then her daughters came in wearing pretty crape robes. On beautiful, old-fashioned trays, they carried a feast of every kind of delicious food. Dish after dish appeared, until the old man began to wonder whether he was dreaming.
        - id: ch03-b04
          speaker: narrator
          text: >-
            In the middle of the meal, some of the daughters performed a marvelous dance for their guest. It was called the suzume-odori, the Sparrow's Dance. Never in his life had the old man enjoyed himself so much. In that lovely place, the hours passed far too quickly. The fairy sparrows served him, feasted him, and danced before him.
        - id: ch03-b05
          speaker: narrator
          text: >-
            At last night fell. The darkness reminded him that the road home was long, and he knew he must say goodbye. He thanked his gracious hostess for every part of the splendid welcome. Then he spoke of his wife. For his sake, he asked the Lady Sparrow to forget everything the cross old woman had made her suffer.
        - id: ch03-b06
          speaker: old_man
          text: >-
            It makes me so happy to see you in this beautiful home and know that you need nothing. I came because I was worried and had to learn what had become of you. Now I know you are safe, I can go home with a light heart. If you ever need me, send word, and I will come at once.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The Lady Sparrow urged him to remain for several days, rest, and enjoy the change. But the old man explained that he had to go back to his wife, who would probably be angry because he had missed his usual hour. His work was waiting too. Much as he wished to stay, he could not accept. Now that he knew the way, he promised to visit whenever he had time.
        - id: ch03-b08
          speaker: narrator
          text: >-
            When the Lady Sparrow saw that she could not persuade him, she gave an order to her servants. They brought in two boxes and set them before him. One was large, and the other was small. She asked him to choose either one as her gift.
        - id: ch03-b09
          speaker: narrator
          text: The old man could not refuse such a kind offer, so he chose the smaller box.
        - id: ch03-b10
          speaker: old_man
          text: >-
            I am too old and weak to carry that large, heavy box. Since you kindly let me choose, I will take the little one. It will be much easier to carry.
        - id: ch03-b11
          speaker: narrator
          text: >-
            All the sparrows helped fasten the small box to his back. They accompanied him to the gate, bowed many times, said goodbye, and asked him to visit again whenever he could. So the old man and his pet parted happily, knowing they could see each other again. The Lady Sparrow showed not the least ill will for the suffering his wife had caused her. She thought instead of her old master. She only felt sorry for the gentle man, who had endured his wife's temper all his life.
    - id: ch04
      title: The Two Gift Boxes
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            It was deep into the night when the old man reached home. His wife had waited a long time, and he found her even crosser than usual.
        - id: ch04-b02
          speaker: old_woman
          text: >-
            Where have you been all this time? Why are you coming home so late?
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: >-
            To quiet her, the old man showed her the box he had brought. Then he told her everything that had happened and described the wonderful welcome at the sparrow's house.
        - id: ch04-b04
          speaker: old_man
          text: >-
            Now let's find out what is inside. Come and help me open it.
        - id: ch04-b05
          speaker: narrator
          text: >-
            They sat together before the box and lifted the lid. To their astonishment, it was filled to the top with gold and silver coins and many other treasures. They drew the precious things out one by one and spread them across the mats. Then they picked them up again, turning each piece over and over in their hands. Gold and silver shone everywhere, until the mats of their little cottage seemed to glitter.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The old man was overjoyed at the riches that now belonged to him. The Lady Sparrow's gift was greater than anything he had dared to hope for. After all his years of hard work in the fields and forest, he could finally lay down his tools. There was enough treasure for him to spend the rest of his life in ease and comfort.
        - id: ch04-b07
          speaker: old_man
          text: >-
            Thanks to my good little sparrow! Oh, thanks to my good little sparrow!
          emotion: happy
        - id: ch04-b08
          speaker: narrator
          text: >-
            The old woman's first surprise and pleasure soon passed. Then her greedy nature took hold. Innocently, her husband had mentioned the large box he had refused because the smaller one was lighter and easier to bring home. Now she scolded him for leaving the greater gift behind.
        - id: ch04-b09
          speaker: old_woman
          text: >-
            You foolish old man! Why didn't you take the large box? Think how much we have lost. It might have held twice this much gold and silver. You truly are an old fool!
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: >-
            She screamed at him and went to bed in a rage. The old man wished he had never told her about the other box, but it was too late. This sudden good fortune was more than she deserved, yet it did not satisfy her. She made up her mind to get still more if she could.
        - id: ch04-b11
          speaker: narrator
          text: >-
            Early the next morning, she rose and made her husband describe every turn of the road to the sparrow's house. He saw exactly what she meant to do. He argued and tried to stop her from going, but nothing helped. She refused to listen to a single word. You might think she would have been ashamed to face the bird whose tongue she had cut off in anger. Her hunger for the large box drove all shame away. She thought of nothing but the treasure she expected to carry home. It never entered her mind that the sparrows might be angry enough to punish her, though that was exactly how they felt.
        - id: ch04-b12
          speaker: narrator
          text: >-
            When the Lady Sparrow had first returned to her family, she had been weeping, with blood coming from her mouth. Ever since that day, her relatives had spoken of the old woman's cruelty. How could anyone give such a terrible punishment for the small mistake of eating a little rice paste? They loved the patient old man for his goodness, but they hated his wife. If they ever had the chance, they meant to punish her as she deserved. They did not have to wait long.
    - id: ch05
      title: What Waited in the Large Box
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The old woman walked for hours before she found the bamboo grove her husband had carefully described. Standing in front of it, she began to shout.
        - id: ch05-b02
          speaker: old_woman
          text: >-
            Where is the tongue-cut sparrow's house? Where is the tongue-cut sparrow's house?
        - id: ch05-b03
          speaker: narrator
          text: >-
            At last, she spotted the eaves of the house among the bamboo leaves. She hurried to the door and knocked loudly. The servants went to tell the Lady Sparrow that her former mistress had come to see her.
        - id: ch05-b04
          speaker: narrator
          text: >-
            After everything that had happened, the Lady Sparrow was surprised by this unexpected visit. She could hardly believe the old woman had dared to come. Still, the Lady Sparrow was courteous, and she remembered that this woman had once been her mistress. So she went out to greet her.
        - id: ch05-b05
          speaker: narrator
          text: The old woman had no wish to waste time on polite words. Without the smallest hint of shame, she came straight to her demand.
        - id: ch05-b06
          speaker: old_woman
          text: >-
            Don't bother giving me a feast like the one you gave my husband. I came for the box that foolish old man left behind. Give me the large one, and I will be on my way. That is all I want!
        - id: ch05-b07
          speaker: narrator
          text: >-
            The Lady Sparrow agreed at once and ordered her servants to bring the large box. The old woman grabbed it eagerly and heaved it onto her back. Without even pausing to thank her hostess, she hurried toward home.
        - id: ch05-b08
          speaker: narrator
          text: >-
            The box was far too heavy for her to walk quickly, much less run as she wished. She was desperate to reach home and discover what lay inside, but again and again she had to sit down by the road and rest.
        - id: ch05-b09
          speaker: narrator
          text: >-
            As she staggered beneath the load, her longing to open it became more than she could bear. Every difficult step made her think again of what might be hidden under the lid. She was certain that this great box must contain gold, silver, and precious jewels, just like the small one her husband had received. Since this box was so much larger, she expected its riches to be greater too. She could wait no longer.
        - id: ch05-b10
          speaker: narrator
          text: >-
            At last, the greedy old woman set the box beside the road. She carefully raised the lid, expecting a mountain of riches. Instead, the sight inside nearly frightened her out of her senses. A swarm of hideous demons burst from the box and closed around her as though they meant to kill her.
        - id: ch05-b11
          speaker: narrator
          text: >-
            Never, even in her worst nightmares, had she seen such creatures. One demon had a single enormous eye in the middle of its forehead, and it fixed that eye upon her. Monsters opened their great mouths as if they would swallow her. A huge snake coiled nearby and hissed, while a giant frog came hopping and croaking toward her.
        - id: ch05-b12
          speaker: narrator
          text: >-
            The old woman had never known such fear in all her life. She abandoned the box and fled from the spot as quickly as her trembling legs could carry her. All her thoughts of treasure were gone. She was grateful simply to escape alive. When she reached home, she collapsed on the floor in tears. Between her sobs, she told her husband everything that had happened by the roadside and how close the demons had come to killing her.
        - id: ch05-b13
          speaker: narrator
          text: She began to blame the sparrow, but the old man stopped her immediately.
        - id: ch05-b14
          speaker: old_man
          text: >-
            Do not blame the sparrow. Your own wickedness has finally brought you its reward. I can only hope you learn from this and change your ways.
        - id: ch05-b15
          speaker: narrator
          text: >-
            The old woman said no more. From that day on, she regretted her cross and cruel behavior. Little by little, she became so good that her husband could hardly believe she was the same woman. They lived the rest of their days happily together, free from need and worry. Carefully, they used the treasure the old man had received from his beloved pet, the tongue-cut sparrow.
