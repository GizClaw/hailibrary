  chapters:
    - id: ch01
      title: The Badger in the Trap
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago, an old farmer and his wife lived in the mountains, far from any town. Their only neighbor was a cruel and spiteful badger. Every night, he ran through the farmer's fields and ruined the rice and vegetables that the old man worked so carefully to grow.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Night after night, the badger grew bolder. He did damage all over the farm until even the kindhearted farmer could bear no more. The old man decided he had to stop him. Day after day and night after night, he waited with a heavy club, hoping to catch the animal. It was no use. At last, the farmer dug holes and set traps instead.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One fine day, all that patience paid off. As the farmer made his usual rounds, he found the badger caught in a hole he had dug for that very purpose. The old man was delighted to have captured his enemy at last. He bound the animal securely with rope, lifted him up, and carried him all the way home.
        - id: ch01-b04
          speaker: farmer
          text: >-
            I've finally caught that wicked badger. Watch him while I'm working, and don't let him get away. I mean to make badger soup tonight.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The farmer hung the badger upside down from the rafters of the storehouse, then went back to his fields. The badger had no wish to become soup. He thought and thought of some way to escape, though it was not easy to think while dangling by his tied legs.
    - id: ch02
      title: The Badger's Deception
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Near the entrance to the storehouse, the farmer's wife stood pounding barley. From where she worked, she could look out over the green fields and trees in the pleasant sunshine. The old woman looked weary from her heavy task. Her face was crossed with many wrinkles and brown as leather. Every now and then, she had to stop, raise a hand, and wipe away the sweat that rolled down her face.
        - id: ch02-b02
          speaker: badger
          text: >-
            Dear lady, this heavy work must tire you at your age. Why not let me do it? My arms are strong. I could take your place for a little while.
        - id: ch02-b03
          speaker: wife
          text: >-
            That's kind of you, but I can't untie you. You might run away, and my husband would be very angry to come home and find you gone.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Badgers are among the most cunning of animals. This one tried again, making his voice sad and gentle.
        - id: ch02-b05
          speaker: badger
          text: >-
            How unkind you are! I promise I won't escape. Let me pound the barley, and you can tie me up again before your husband returns. These ropes make me so tired and sore. If you would lower me for only a few minutes, I'd be truly grateful.
        - id: ch02-b06
          speaker: narrator
          text: >-
            The old woman was simple and good, and she never thought badly of anyone. She could not imagine that the badger was only trying to trick her and escape. When she turned to look at him, she felt sorry for him. There he hung with his head downward and all his legs tied together. The ropes were so tight that the knots cut into his skin. Her kind heart overcame her caution. Trusting his promise not to run away, she untied the cord and lowered him to the floor.
        - id: ch02-b07
          speaker: narrator
          text: >-
            She handed him the wooden pestle and told him to work while she rested. But instead of pounding the barley, the badger sprang at her. He knocked her down with the heavy pestle, killed her, cut her up, and made soup of her. Then he waited for the farmer to come home.
    - id: ch03
      title: The Farmer Comes Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            All day, the old farmer worked hard in his fields. As he worked, he felt pleased to think the destructive badger would never spoil his labor again. Near sunset, he finally put down his tools and turned toward home. He was very tired, but the thought of a good supper of hot badger soup cheered him. Not once did he imagine that the animal might break free and take revenge on his poor wife.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Meanwhile, the badger took the old woman's shape. When he saw the farmer coming, he stepped onto the little house's veranda to greet him.
        - id: ch03-b03
          speaker: badger
          text: >-
            You're home at last. The badger soup is ready, and I've been waiting a long time for you.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The farmer quickly slipped off his straw sandals and sat before his tiny dinner tray. The innocent old man never dreamed that the creature serving him was not his wife. He asked for the soup at once. Then the badger suddenly changed back into his own form.
        - id: ch03-b05
          speaker: badger
          text: >-
            You old wife-eater! Go and look at the bones in the kitchen!
        - id: ch03-b06
          speaker: narrator
          text: >-
            With a loud, mocking laugh, the badger fled from the house and raced to his den in the hills. The farmer stood alone, hardly able to believe what he had seen and heard. When the whole truth reached him, horror and fear overcame him, and he fainted.
        - id: ch03-b07
          speaker: narrator
          text: >-
            After a while, he came to himself and burst into bitter tears. He wept aloud and rocked back and forth in helpless grief. It seemed too terrible to be true. While he had worked quietly in the fields, knowing nothing of what happened at home, his faithful wife had been killed and cooked. All that time, he had congratulated himself on getting rid of the wicked animal that so often spoiled his crops. And then came the most horrible thought of all. He had nearly drunk the soup the badger had made from his poor wife.
        - id: ch03-b08
          speaker: farmer
          text: Oh dear! Oh dear! Oh dear!
          emotion: sad
    - id: ch04
      title: The Rabbit's Promise
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            A kind old rabbit lived nearby on the same mountain. Hearing the farmer's cries and sobs, he hurried over to learn what was wrong and whether he could help his neighbor. The old man told him everything that had happened.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The story made the rabbit very angry with the wicked, deceitful badger. He told the old man to leave everything to him. Somehow, he would avenge the farmer's wife. The promise comforted the farmer at last. Wiping away his tears, he thanked the good rabbit for coming to help him in such misery.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Once the farmer had grown calmer, the rabbit went home to plan the badger's punishment.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The following day was fine, and the rabbit went looking for the badger. He searched the woods, the hillside, and the fields, but the badger was nowhere to be seen. At last, the rabbit went to his den. The badger had hidden there ever since leaving the farmer's house, afraid to face the old man's anger.
        - id: ch04-b05
          speaker: rabbit
          text: >-
            Why hide indoors on such a beautiful day? Come with me. We can cut grass together on the hills.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The badger never doubted that the rabbit was his friend, so he gladly agreed. He was only too pleased to get away from the farmer's neighborhood, where he lived in fear of meeting the old man. The rabbit led the way for miles, far from both their homes. At last, they reached hills where the grass grew tall and thick and sweet.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Together, they set to work cutting as much grass as they could carry home and store for their winter food. When they had all they wanted, they tied the cut grass into bundles. Each lifted his own bundle onto his back, and they began the long walk home. This time, the rabbit made sure the badger went first.
    - id: ch05
      title: Crackling Mountain
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            After they had walked a little way, the rabbit took out a flint and steel. He struck them together just behind the badger and set the dry grass on the badger's back alight. The badger heard the flint.
        - id: ch05-b02
          speaker: badger
          text: >-
            What's making that crack, crack sound?
        - id: ch05-b03
          speaker: rabbit
          text: >-
            Oh, it's nothing. I only said “crack, crack” because this place is called Crackling Mountain.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Soon the fire spread through the bundle. When the badger heard the dry grass burning behind him, he called out again.
        - id: ch05-b05
          speaker: badger
          text: >-
            Then what's that sound?
        - id: ch05-b06
          speaker: rabbit
          text: >-
            We've reached Burning Mountain now.
        - id: ch05-b07
          speaker: narrator
          text: >-
            By then, the bundle of grass was almost burned away, and the flames had singed every hair from the badger's back. At last, the smell of the burning grass and smoke told him what had happened. Screaming with pain, he raced as fast as he could back to his hole. The rabbit followed him there and found him lying on his bed, groaning from his burns.
        - id: ch05-b08
          speaker: rabbit
          text: >-
            What terrible luck you've had! I can't imagine how it happened. I'll fetch some medicine that will heal your back in no time.
        - id: ch05-b09
          speaker: narrator
          text: >-
            The rabbit went away glad and smiling, for the badger's punishment had begun. He hoped the burns would kill the animal. As far as the rabbit was concerned, nothing could be too terrible for a creature who had murdered a poor, helpless old woman after she trusted him. Back at home, he prepared the promised ointment by mixing sauce with red pepper.
        - id: ch05-b10
          speaker: narrator
          text: >-
            When the rabbit returned, he warned the badger that the medicine would hurt badly. The badger must endure it, he said, because it was a wonderful cure for burns and scalds.
        - id: ch05-b11
          speaker: badger
          text: >-
            Thank you. Please put it on right away.
        - id: ch05-b12
          speaker: narrator
          text: >-
            The moment the red pepper touched his raw back, the badger suffered agony beyond words. He rolled over and over, howling loudly. As the rabbit watched, he felt that the farmer's wife was beginning to be avenged.
    - id: ch06
      title: The Two Boats
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            The badger remained in bed for about a month. In spite of the red-pepper treatment, his burns slowly healed, and at last he was well again. When the rabbit saw him recovering, he began to think of another plan that might bring about the creature's death. One day, he went to visit the badger and congratulated him on getting well.
        - id: ch06-b02
          speaker: narrator
          text: >-
            As they talked, the rabbit happened to mention that he was going fishing. He told the badger how pleasant it was to fish in fine weather when the sea lay smooth.
        - id: ch06-b03
          speaker: narrator
          text: >-
            The badger listened with delight as the rabbit described the way he now spent his time. Soon he forgot all his pain and the long month he had spent in bed. It seemed that fishing would be great fun. He asked the rabbit to take him along the next time he went. That was exactly what the rabbit had hoped to hear, so he readily agreed.
        - id: ch06-b04
          speaker: narrator
          text: >-
            The rabbit went home and began building two boats. He made one from wood and shaped the other from clay. At last, both boats were finished. He stood looking over his work and thought of the plan ahead. All his trouble would be well rewarded if he could make it succeed and put an end to the wicked badger.
        - id: ch06-b05
          speaker: narrator
          text: >-
            At last, the day they had chosen for fishing arrived. The rabbit kept the wooden boat for himself and handed the clay boat to the badger. The badger knew nothing at all about boats. He was delighted with the one he had been given and thought it wonderfully kind of the rabbit to provide it for him.
        - id: ch06-b06
          speaker: narrator
          text: >-
            They climbed aboard and set off. Once they were some distance from shore, the rabbit suggested a race to see which boat was faster. The badger readily agreed, and for a while they both rowed as hard as they could.
    - id: ch07
      title: The Promise Fulfilled
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            They were in the middle of the race when the badger felt his boat coming apart beneath him. Water had begun to soak into the clay and soften it. Piece by piece, the boat was sinking into the sea. The badger was terrified. He called across the water and begged the rabbit to save him.
        - id: ch07-b02
          speaker: rabbit
          text: >-
            I won't help you. I planned this to avenge the old woman's murder. At last, you're paying for all your wicked deeds. You'll drown here, and no one will save you.
          emotion: angry
        - id: ch07-b03
          speaker: narrator
          text: >-
            The rabbit lifted his oar and struck the badger with all his strength. The badger fell with the sinking clay boat and disappeared beneath the water.
        - id: ch07-b04
          speaker: narrator
          text: >-
            At last, the rabbit had kept his promise to the farmer. He turned his wooden boat and rowed back toward shore. Once he had landed, he pulled the boat up onto the beach. Then he hurried to the old farmer and told him the whole story, including how the farmer's enemy had finally been killed.
        - id: ch07-b05
          speaker: narrator
          text: >-
            Tears filled the farmer's eyes as he thanked the rabbit.
        - id: ch07-b06
          speaker: farmer
          text: >-
            Until now, I couldn't sleep at night or find any peace during the day. I was always thinking that my wife's death had gone unavenged. But from now on, I'll be able to sleep and eat as I did before. Please stay with me and make this your home too.
        - id: ch07-b07
          speaker: narrator
          text: >-
            From that day on, the rabbit lived with the old farmer. They remained good friends for the rest of their lives.
