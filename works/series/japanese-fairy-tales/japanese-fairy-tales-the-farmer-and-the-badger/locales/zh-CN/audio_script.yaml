audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    farmer:
      display_name: 老农夫
      tts:
        delivery: 朴实厚道，悲痛时苍老颤抖
        timbre: 低沉温厚的老年男声
        pace: 平缓，哀恸时断续
        pitch: 中低音
    wife:
      display_name: 老妇人
      tts:
        delivery: 善良质朴，说话温和而谨慎
        timbre: 柔和略显疲惫的老年女声
        pace: 舒缓
        pitch: 中音
    badger:
      display_name: 狸
      tts:
        delivery: 狡猾多变，哄骗时柔弱，得意时尖刻
        timbre: 略带沙哑的成年男声
        pace: 灵活，慌乱时急促
        pitch: 中音
    rabbit:
      display_name: 兔子
      tts:
        delivery: 表面亲切从容，复仇时坚定冷峻
        timbre: 清亮沉着的成年男声
        pace: 自然利落
        pitch: 中高音
  chapters:
    - id: ch01
      title: 狸的毒计
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，一对老夫妇住在远离城镇的深山里。他们附近唯一的邻居，是一只又凶又坏的狸。每到夜里，狸就跑出来，闯进农夫的田地，把他花费许多心血栽种的蔬菜和稻子糟蹋得不成样子。狸越闹越凶，田庄处处遭殃。好脾气的农夫终于忍无可忍，决心制止它。他拿着一根大棍，白天等，夜里也等，一心盼着把狸捉住，可每次都白费力气。最后，他只得挖下陷阱来抓这只恶兽。
        - id: ch01-b02
          speaker: narrator
          text: 这番辛苦和耐心总算有了回报。一天，农夫像往常一样巡视田地，发现狸果然掉进了特意挖好的陷阱。他捉住了这个仇敌，高兴极了，便用绳子把狸结结实实地捆好，一路扛回家去。到了家，他交代老伴好好看守。
        - id: ch01-b03
          speaker: farmer
          text: 我总算把这只坏狸捉住了。我下田以后，你一定要看紧，别让它逃掉。今晚我要把它煮成汤。
        - id: ch01-b04
          speaker: narrator
          text: 农夫把狸倒吊在仓房的房梁上，便下田去了。一想到晚上要被煮成汤，狸急得拼命琢磨逃走的办法。可它头朝下吊着，浑身难受，根本没法好好思量。仓房门口，农夫的老伴正望着绿油油的田野、树木和阳光，站在那里舂大麦。她已经年老，满脸皱纹，皮肤晒得像皮革。她累得汗流满面，舂一阵，就要停下来擦一擦。
        - id: ch01-b05
          speaker: badger
          text: 老奶奶，您这么大年纪，还干这样重的活，一定很累吧？让我替您舂一会儿吧。我胳膊有力，正好让您歇歇。
        - id: ch01-b06
          speaker: wife
          text: 谢谢你的好意，可我不能解开你。万一你逃了，我丈夫回来找不见你，一定会很生气。
        - id: ch01-b07
          speaker: narrator
          text: 狸最会骗人。它马上换成哀伤又温柔的声音，继续央求。
        - id: ch01-b08
          speaker: badger
          text: 您真忍心让我一直这样疼吗？我保证不逃。等我替您舂完大麦，赶在您丈夫回来前，再让您捆上就是了。绳子勒得我又累又痛，您只放我下来几分钟，我也会感激不尽。
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: 老妇人心地善良，为人单纯，总不肯把谁往坏处想。她哪里知道，狸说这些话，只是想骗她放开绳索，好趁机逃走。她回头看了看，心里也觉得这只动物可怜。狸被几条腿倒吊在房梁上，腿脚全都紧紧捆在一起，绳索和绳结已经深深勒进皮肉。老妇人相信它许下的保证，便心软地解开绳子，把它放了下来。
        - id: ch01-b10
          speaker: narrator
          text: 老妇人把木杵递给狸，请它替自己舂一会儿，好让自己歇息。谁知狸接过沉重的木杵，根本不照她的吩咐干活，反而立刻扑上去，把她重重打倒。随后，它杀死老妇人，将她剁碎煮成一锅汤，守在家里等老农夫回来。老人整天都在田里辛苦劳作，还一边干活，一边欢喜地想，从今以后，再也不会有恶狸来毁掉自己的劳动成果了。
        - id: ch01-b11
          speaker: narrator
          text: 太阳快落山时，农夫放下手里的活计，疲惫地转身朝家里走去。一想到家里正等着一锅热腾腾的狸肉汤，他又有了精神。他怎么也想不到，狸已经脱身，还向可怜的老伴下了毒手。
        - id: ch01-b12
          speaker: narrator
          text: 狸变成老妇人的模样。老农夫刚走近，它便到小屋廊下迎接。
        - id: ch01-b13
          speaker: badger
          text: 你总算回来了。狸肉汤早就煮好了，我一直在等你呢。
        - id: ch01-b14
          speaker: narrator
          text: 老农夫赶紧脱掉草鞋，在小饭桌前坐下。他毫无戒心，根本不知道眼前的不是妻子，开口便要喝汤。就在这时，狸突然现回原形，冲他大叫。
        - id: ch01-b15
          speaker: badger
          text: 你这个吃老婆肉的老头！小心厨房里的骨头！
        - id: ch01-b16
          speaker: narrator
          text: 狸放声嘲笑，逃出屋子，一路跑回山洞。老人孤零零地留在屋里，简直不敢相信刚才听见和看见的一切。等他终于明白全部真相，顿时又惊又怕，当场昏倒。过了一阵，他才苏醒过来，随即失声痛哭，哭得凄厉又悲苦，还在绝望中前后摇晃着身子。忠诚的老伴竟被狸杀死，煮成了汤。可他那时还安安稳稳地在田里干活，对家中的灾难一无所知，甚至庆幸终于除掉了那只屡次糟蹋田地的恶兽。这样的事可怕得不像真的。更叫他毛骨悚然的是，他差一点就喝下那只畜生用可怜老伴煮成的汤。
        - id: ch01-b17
          speaker: farmer
          text: 哎呀，哎呀，哎呀！
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: 离农夫家不远，同一座山里，还住着一只善良厚道的老兔子。它听见老人又哭又泣，立刻动身赶来，想看看这位邻居出了什么事，自己能不能帮忙。农夫把惨事从头到尾说了一遍。兔子听得怒火中烧，恨极了这只邪恶又诡诈的狸。它答应替老妇人报仇，叫老人把一切交给自己。农夫这才稍稍平静，擦去泪水，感谢兔子在自己遭难时好心赶来相助。
    - id: ch02
      title: 咔嚓山的火
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 兔子见农夫平静下来，便回家谋划怎样惩罚狸。第二天天气晴好，它到处寻找，树林、山坡和田野里都不见狸的踪影。最后，它来到狸的洞穴。自从逃出农夫家，狸害怕老人报复，一直躲在里面不敢露头。
        - id: ch02-b02
          speaker: rabbit
          text: 天气这么好，你怎么还躲在洞里？出来跟我一起到山上割草吧。
        - id: ch02-b03
          speaker: narrator
          text: 狸把兔子当成朋友，毫不怀疑地答应了。它也正巴不得离开农夫家附近，免得碰见发怒的老人。兔子走在前面，领着狸走出好几英里，来到一片青草长得又高、又密、又鲜嫩的山坡。它们一起动手，尽量多割些草带回家，准备储作冬粮。两只动物各自割够以后，又把草扎成捆，背在背上往家走。这一回，兔子故意让狸走在前面。
        - id: ch02-b04
          speaker: narrator
          text: 走了一会儿，兔子悄悄掏出火石和火镰，跟在狸后面打出火星，点着了它背上的干草。狸听见咔嚓咔嚓的响声，回头问道。
        - id: ch02-b05
          speaker: badger
          text: 咦，那是什么声音？咔嚓，咔嚓？
        - id: ch02-b06
          speaker: rabbit
          text: 没什么呀。这里叫“咔嚓山”，所以我才念着“咔嚓，咔嚓”。
        - id: ch02-b07
          speaker: narrator
          text: 火很快在干草里蔓延开来。狸听见背后噼啪作响，又问那是什么声音。
        - id: ch02-b08
          speaker: rabbit
          text: 咱们现在走到“火烧山”了。
        - id: ch02-b09
          speaker: narrator
          text: 等草捆快烧光时，狸背上的毛也全烧没了。它闻到焦烟味，这才知道发生了什么。狸疼得尖声惨叫，飞奔回洞。兔子跟过去，看见它躺在床上不住呻吟。
        - id: ch02-b10
          speaker: rabbit
          text: 你可真倒霉！好端端的，怎么会伤成这样？我去拿一种好药，保准你的背很快就能痊愈。
        - id: ch02-b11
          speaker: narrator
          text: 兔子笑着离开，心想狸的惩罚总算开始了。这个恶徒杀死了信任自己的可怜老妇人，受到多重的惩罚也不为过。兔子甚至盼它会因烧伤而死。回家后，它把酱和红辣椒调在一起，做成药膏。
        - id: ch02-b12
          speaker: narrator
          text: 兔子带着药膏回来。动手之前，它先告诉狸，敷上这种药会疼得厉害，但一定要耐心忍住，因为这可是治疗烧伤、烫伤和类似伤口的灵药。狸向它道谢，又求它马上替自己涂抹。可是，红辣椒刚刚糊满受伤的脊背，狸便痛苦得无法用言语形容。它在地上翻来滚去，放声号叫。兔子站在一旁看着，觉得农夫老伴的冤仇已经开始得到报偿。
    - id: ch03
      title: 海上的泥船
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 狸卧床大约一个月。虽然受过红辣椒的折磨，烧伤到底还是好了。兔子看它逐渐康复，又想出一条取它性命的计策。一天，兔子登门探望，祝贺狸恢复健康。闲谈中，它提起自己要去捕鱼，还把晴天里海面平静、出海捕鱼的乐趣说得有声有色。
        - id: ch03-b02
          speaker: narrator
          text: 狸听得心里发痒，忘掉了伤痛，也忘掉了卧床一个月的苦楚，只觉得捕鱼一定很有意思，便问兔子下回能不能带它一起去。兔子等的正是这句话，马上答应下来。
        - id: ch03-b03
          speaker: narrator
          text: 兔子回家造了两条船，一条是木船，一条是泥船。完工以后，它望着两条船，心想只要这次能除掉恶狸，所有辛苦就没有白费。
        - id: ch03-b04
          speaker: narrator
          text: 约好出海捕鱼的日子到了。兔子把木船留给自己，把泥船交给狸。狸根本不懂船，得到一条新船还十分高兴，以为兔子待自己真好。它们各自登船，从岸边划向海上。走出一段距离以后，兔子提议试试两条船，看谁的船划得更快。狸欣然答应，两只动物便使足力气划起桨来，比了好一阵。
        - id: ch03-b05
          speaker: narrator
          text: 比到半途，狸发现自己的船正一点点散开。原来海水已经把黏土泡软了。它吓得大喊，请兔子快来救命。兔子这才告诉它，自己一直在替老妇人报仇。从放火到泥船，所有事情从头到尾都早有安排。狸犯下那么多恶行，如今终于恶有恶报，只能孤零零地淹死在海里，再也不会有人救它。兔子想到这里十分欣慰。说完，它举起船桨，使出全身力气不断朝狸打去。狸和下沉的泥船一起落入海中，再也没有浮上来。
        - id: ch03-b06
          speaker: narrator
          text: 兔子终于兑现了对老农夫的诺言。它把船划回岸边，拖上海滩，急忙赶去把全部经过告诉老人，也告诉他，仇敌狸已经死了。
        - id: ch03-b07
          speaker: narrator
          text: 老农夫眼含泪水，向兔子道谢。他说，想到老伴的死始终没有得到报偿，自己直到这一天，夜里从来不能安睡，白天也得不到片刻安宁。如今仇敌已经死去，他终于又能像从前那样安心睡觉，好好吃饭了。老人恳求兔子留下来，与自己同住。从那一天起，兔子便搬进农夫家。他们成了好朋友，相伴度过余生。
