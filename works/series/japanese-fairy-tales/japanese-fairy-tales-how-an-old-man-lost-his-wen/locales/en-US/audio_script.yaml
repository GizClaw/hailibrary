  chapters:
    - id: ch01
      title: The Storm in the Mountains
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Many, many years ago, a good old man lived with a wen on his right cheek. It was as round as a tennis ball, and it spoiled the look of his whole face. The lump troubled him so much that, year after year, he spent all the time and money he could spare trying to be rid of it.
        - id: ch01-b02
          speaker: narrator
          text: >-
            He went to doctors near and far. He swallowed medicines and put other remedies on the lump, trying everything he could imagine. Nothing helped. The wen grew until it was almost as large as his face. At last, he lost all hope and accepted that he would carry it for the rest of his life.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One early autumn day, the kitchen ran out of firewood. His wife needed more at once, so the old man took his ax and climbed into the woods among the hills near their home. The day was fine, and he enjoyed breathing the fresh air. There seemed no reason to hurry home.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He chopped through the afternoon and gathered a good pile of wood to carry home. Only when daylight began to fade did he turn back down the mountain.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Before he had gone far down the mountain pass, clouds covered the sky and heavy rain began to fall. The old man searched in every direction for shelter, but there was not even a charcoal burner's hut nearby. At last, he spotted a wide hole low in the hollow trunk of a tree. He could crawl inside easily. He sat there hoping it was only a quick mountain shower and the sky would soon clear.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Instead of clearing, the rain came down harder and harder. Soon a terrible thunderstorm broke over the mountain. Thunder roared with such force, and lightning seemed to set the whole sky on fire. Crouched in the tree, the old man could hardly believe he was still alive. He thought the terror alone might kill him.
        - id: ch01-b07
          speaker: narrator
          text: >-
            At last, the storm passed and the sky opened. Rays from the setting sun made the whole countryside glow. The beautiful twilight lifted the old man's spirits, and he prepared to step out of his strange hiding place. Just then, he heard what sounded like several people walking toward him.
        - id: ch01-b08
          speaker: narrator
          text: >-
            He happily imagined that his friends had come looking for him. Now he would have cheerful company on the walk home instead of making the dark journey alone. But when he peered out, his delight turned to amazement. These were not his friends at all. Hundreds of demons were coming toward the tree.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The longer he stared, the stranger they looked. Some were as huge as giants. Some had enormous eyes, some had absurdly long noses, and some had mouths that seemed to stretch from ear to ear. Every one of them had horns on its forehead.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The sight startled the old man so badly that he lost his balance and tumbled out of the tree. Luckily, the tree stood behind the demons, and none of them noticed. He picked himself up and crept back into the hollow trunk.
    - id: ch02
      title: The Demons' Feast
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The old man sat inside, wondering impatiently when he could go home. Then lively music began, followed by the sound of demons singing.
        - id: ch02-b02
          speaker: good_old_man
          text: >-
            What can those creatures be doing? It sounds like great fun. I must take a look.
        - id: ch02-b03
          speaker: narrator
          text: >-
            He peeked out again. The demon chief sat with his back against the very tree where the old man was hiding. All the other demons gathered in a ring around him. Some were drinking, while others danced. Food and wine lay spread across the ground, and it was plain that the whole company was enjoying a splendid feast.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Their odd movements made the old man laugh.
        - id: ch02-b05
          speaker: good_old_man
          text: >-
            Oh, this is wonderful! I have grown old, but never in my life have I seen anything so strange.
          emotion: happy
        - id: ch02-b06
          speaker: narrator
          text: >-
            He became so excited by everything he saw that he forgot to hide. Without thinking, he stepped out of the hollow tree and stood watching.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The chief was drinking a large cup of sake while one demon danced before him. After a while, the chief began to look bored.
        - id: ch02-b08
          speaker: demon_chief
          text: >-
            This dance never changes, and I am tired of it. Can none of you dance better than he can?
        - id: ch02-b09
          speaker: narrator
          text: >-
            Now, the old man had loved dancing all his life and had become an expert. As he watched the demon repeat the same movements, he knew he could give the chief a far better dance.
        - id: ch02-b10
          speaker: good_old_man
          text: >-
            Should I dance for them and show them what a human can do? But if they dislike it, they may kill me!
          emotion: fearful
        - id: ch02-b11
          speaker: narrator
          text: >-
            For a few minutes, fear held him in place. Then his love of dancing overcame it, and he could hold himself back no longer. He walked into the middle of the feast before the entire company and began at once. He knew his life might depend on pleasing these strange creatures, so he called on all his skill and wit and danced as well as he possibly could.
        - id: ch02-b12
          speaker: narrator
          text: >-
            At first, the demons could only stare. They had never expected a human to step among them and join their entertainment so fearlessly. But as the old man danced on, their astonishment quickly turned to admiration.
        - id: ch02-b13
          speaker: demon_chief
          text: >-
            Astonishing! I have never seen anyone dance with such skill. He is marvelous!
          emotion: surprised
        - id: ch02-b14
          speaker: narrator
          text: >-
            When the dance ended, the great chief held out his largest wine cup.
        - id: ch02-b15
          speaker: demon_chief
          text: >-
            Thank you for that delightful dance. Now come and share a cup of wine with us.
        - id: ch02-b16
          speaker: good_old_man
          text: >-
            My lord, I never expected such kindness. I was afraid my poor dancing had only interrupted your pleasant feast.
        - id: ch02-b17
          speaker: demon_chief
          text: >-
            Not at all. You must visit us often and dance again. Your skill has pleased us greatly.
        - id: ch02-b18
          speaker: narrator
          text: >-
            The old man thanked him once more and promised to return.
        - id: ch02-b19
          speaker: demon_chief
          text: >-
            Then you will come back tomorrow, old man?
        - id: ch02-b20
          speaker: good_old_man
          text: >-
            I certainly will.
        - id: ch02-b21
          speaker: demon_chief
          text: >-
            You must leave us something as a pledge that you will keep your word.
        - id: ch02-b22
          speaker: good_old_man
          text: >-
            Take anything you choose.
        - id: ch02-b23
          speaker: demon_chief
          text: >-
            What should we keep as his pledge?
        - id: ch02-b24
          speaker: narrator
          text: >-
            An attendant kneeling behind the chief answered eagerly.
        - id: ch02-b25
          speaker: demon_attendant
          text: >-
            His pledge should be the thing he values most. There is a wen on his right cheek, and mortal men believe such wens bring good fortune. Take it from him, my lord. Then he will surely return tomorrow to get it back.
        - id: ch02-b26
          speaker: demon_chief
          text: >-
            A clever answer.
        - id: ch02-b27
          speaker: narrator
          text: >-
            The chief nodded his horns in approval. He reached out one hairy arm, placed a clawed hand on the old man's cheek, and removed the great lump. At his touch, it came away as easily as a ripe plum falling from a tree. Then the whole merry troop of demons suddenly vanished.
    - id: ch03
      title: A Smooth Cheek
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The old man stood completely bewildered by all that had happened. For a while, he hardly knew where he was or what to think. Slowly, he began to understand. The lump that had disfigured him for so many years was truly gone, and the demon had taken it without causing him any pain at all.
        - id: ch03-b02
          speaker: narrator
          text: >-
            He touched his face to see whether a scar remained. His right cheek was as smooth as his left.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The sun had long since set, and a young moon hung in the sky like a silver crescent. Suddenly, the old man realized how late it had grown. He set off in a hurry, patting his right cheek again and again as he went. Each touch reassured him that his good fortune was real and the wen had not somehow returned.
        - id: ch03-b04
          speaker: narrator
          text: >-
            He was far too happy to walk quietly. He ran and danced the whole way home.
        - id: ch03-b05
          speaker: narrator
          text: >-
            By the time he reached home, his wife had become terribly anxious. She could not imagine what had kept him away so late. The old man quickly told her everything that had happened since he left that afternoon. Then he showed her the place where the ugly lump had been. When she saw his smooth cheek, she was just as happy as he was.
        - id: ch03-b06
          speaker: narrator
          text: >-
            When they were young, she had taken great pride in her husband's good looks. Watching the ugly growth on his face had grieved her every day, and now it had disappeared.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Next door to this good couple lived another old man who was wicked and disagreeable. He, too, had struggled for years with a wen, though his grew on his left cheek. He had tried every sort of remedy, and none had worked.
        - id: ch03-b08
          speaker: narrator
          text: >-
            A servant soon carried the news to him that his neighbor had somehow lost the lump on his face. That very evening, the disagreeable man called at the house. He asked his friend to tell him every detail about how the wen had disappeared.
        - id: ch03-b09
          speaker: narrator
          text: >-
            The good old man told him the whole story. He explained where to find the hollow tree and advised his neighbor to be waiting there late in the afternoon, near sunset.
    - id: ch04
      title: The Second Wen
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The very next afternoon, the neighbor set out for the hills. He hunted around for some time before finding the hollow tree exactly as his friend had described it. Then he climbed into the trunk, hid himself, and waited there for twilight.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Just as he had been told, the demons arrived at that hour. Once again, they began a feast with dancing and song. After the celebration had gone on for a while, the chief looked around.
        - id: ch04-b03
          speaker: demon_chief
          text: >-
            The old man promised to return by now. Why has he not come?
        - id: ch04-b04
          speaker: narrator
          text: >-
            At those words, the second old man rushed from the tree and dropped to his knees before the demon chief.
        - id: ch04-b05
          speaker: disagreeable_old_man
          text: >-
            I have been waiting and waiting for you to call me!
        - id: ch04-b06
          speaker: demon_chief
          text: >-
            Ah, here is yesterday's old man. Thank you for returning. Begin your dance soon.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The neighbor rose, opened his fan, and began to dance. But he had never learned how. He knew nothing about the gestures he should make or the positions he should take. He simply believed that anything would please the demons. So he hopped around, waved his arms, and stamped his feet, copying as well as he could any dancing he had ever seen.
        - id: ch04-b08
          speaker: narrator
          text: >-
            The demons were thoroughly dissatisfied with the performance.
        - id: ch04-b09
          speakers: [demon_one, demon_two]
          ensemble: duo
          text: >-
            How badly he dances today!
          emotion: disgusted
        - id: ch04-b10
          speaker: demon_chief
          text: >-
            Today's performance is nothing like yesterday's dance. We want no more of it. Take back the pledge you left with us, and go away at once.
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: >-
            The chief reached into a fold of his clothing and pulled out the lump he had taken from the good old man's face the day before. He threw it straight at the neighbor's right cheek. At once, the wen fastened itself there as firmly as if it had always grown on him. The old man tried to pull it away, but every attempt was useless.
        - id: ch04-b12
          speaker: narrator
          text: >-
            The wicked old man had hoped to lose the lump on his left cheek. Instead, his attempt had given him another one on the right.
        - id: ch04-b13
          speaker: narrator
          text: >-
            He raised one hand, then the other, and felt both sides of his face. He wanted to believe he was trapped in some horrible nightmare, but he was wide awake. There truly was a great wen on his right cheek, just like the one on his left.
        - id: ch04-b14
          speaker: narrator
          text: >-
            By then, every demon had vanished, leaving the old man alone beside the hollow tree. There was no one to help him and nothing he could do but return home. It was a pitiful sight. With those two huge lumps, one on either side, his face looked just like a Japanese gourd.
