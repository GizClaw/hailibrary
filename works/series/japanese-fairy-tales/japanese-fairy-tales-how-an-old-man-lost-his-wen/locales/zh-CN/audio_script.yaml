audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    good_old_man:
      display_name: 善良的老翁
      tts:
        delivery: 谦和厚道，谈到舞蹈时兴致勃勃
        timbre: 温暖略带沙哑的老年男声
        pace: 从容，兴奋时稍快
        pitch: 中低音
    demon_chief:
      display_name: 鬼王
      tts:
        delivery: 威严豪放，欢宴时随性，失望时冷硬
        timbre: 粗厚洪亮的怪异男声
        pace: 稳健有力
        pitch: 低音
    demon_attendant:
      display_name: 鬼王侍从
      tts:
        delivery: 机灵恭敬，说话带着讨好意味
        timbre: 尖细清楚的怪异男声
        pace: 适中
        pitch: 中高音
    wicked_old_man:
      display_name: 坏老头
      tts:
        delivery: 急切讨巧，自以为聪明却缺少底气
        timbre: 干涩偏薄的老年男声
        pace: 稍快
        pitch: 中音
    demon_1:
      display_name: 恶鬼甲
      tts:
        delivery: 粗鲁直率，起哄时毫不客气
        timbre: 粗哑的怪异男声
        pace: 适中
        pitch: 低音
    demon_2:
      display_name: 恶鬼乙
      tts:
        delivery: 尖刻活跃，随众附和
        timbre: 尖亮的怪异男声
        pace: 稍快
        pitch: 中高音
    demon_3:
      display_name: 恶鬼丙
      tts:
        delivery: 浑厚迟缓，随众附和
        timbre: 沉厚的怪异男声
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 山中的雷雨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，有位心地善良的老翁。他的右脸上长着一个网球那么大的肉瘤，容貌因此大受损伤，自己也烦恼不已。为了除掉它，他多年间花了不少时间和钱财。凡是能想到的办法，他都试过。远近的医生都请过，内服外敷的药也都用遍了，可没有一样管用。瘤子反而越长越大，几乎赶上了他的脸。老翁终于死了心，只好认定余生都得带着它。
        - id: ch01-b02
          speaker: narrator
          text: 一天，厨房里的柴烧完了，妻子正等着用。老翁拿起斧头，到离家不远的山林里砍柴。初秋的天气晴朗清爽，山里的新鲜空气让他很是享受，所以并不急着回去。不知不觉，他便忙了整个下午。等身边积起一大堆木柴，足够带回家给妻子用，天色也渐渐晚了，他这才动身下山。
        - id: ch01-b03
          speaker: narrator
          text: 没走多远，天空忽然阴沉下来，大雨迎头落下。老翁四处张望，附近连烧炭人的小屋也没有，实在找不到别的地方遮雨。后来，他看见一棵大树的空心树干上有个宽大的洞，洞口紧挨地面。他很容易便钻进去坐下，盼着这只是一阵山雨，很快就会过去。
        - id: ch01-b04
          speaker: narrator
          text: 可雨没有像他盼的那样停下，反而越下越猛，老翁失望极了。紧接着，雷暴笼罩了整座山。雷声震得人胆战心惊，闪电像要把天空烧起来。老翁简直不敢相信自己还能活着，只觉得就要活活吓死。好在风暴终于散去，夕阳的光辉又照亮四野。望见美丽的暮色，他重新振作起来，正准备钻出这个古怪的藏身处，耳边却传来一阵脚步声。
        - id: ch01-b05
          speaker: narrator
          text: 老翁先以为是朋友来找他，想到回家的路上有人谈笑作伴，心里十分高兴。谁知探头一看，走来的不是朋友，而是成百只恶鬼！他越看越吃惊。有的像巨人一样高大，有的眼睛大得和身子全不相称，有的拖着可笑的长鼻子，还有的嘴巴奇大无比，仿佛从一只耳朵一直咧到另一只耳朵。它们额头上全都长着角。
        - id: ch01-b06
          speaker: narrator
          text: 老翁看得太吃惊，脚下一滑，竟跌出了树洞。幸好大树藏在后面，恶鬼没有发现。他赶紧爬起来，又悄悄躲回洞里。
    - id: ch02
      title: 群鬼的宴会
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 老翁坐在洞里，焦急地等着回家的机会。忽然，外面响起欢快的乐声，几只恶鬼还唱起了歌。
        - id: ch02-b02
          speaker: good_old_man
          text: 这些家伙究竟在做什么？听起来倒挺有趣，我得看看。
        - id: ch02-b03
          speaker: narrator
          text: 他偷偷望出去，只见鬼王本人就背靠着他藏身的这棵大树。其余恶鬼团团围坐在四周，有的喝酒，有的跳舞。地上摆满食物和酒，原来它们正在大设宴席，一个个快活极了。那些古怪的动作逗得老翁忍不住发笑。
        - id: ch02-b04
          speaker: good_old_man
          text: 真有意思！我活了这么大年纪，还从没见过这么稀奇的事。
        - id: ch02-b05
          speaker: narrator
          text: 他越看越入迷，竟忘了自己还在躲藏，走出树洞，站在那里看个不停。这时，鬼王端着一大杯清酒，正看一只恶鬼跳舞。过了一会儿，他露出了不耐烦的神情。
        - id: ch02-b06
          speaker: demon_chief
          text: 来来回回就这么几个动作，我都看腻了。你们当中难道没有谁比它跳得好？
        - id: ch02-b07
          speaker: narrator
          text: 老翁一辈子都爱跳舞，而且舞艺高明。他知道，自己远比眼前这只恶鬼跳得好。
        - id: ch02-b08
          speaker: good_old_man
          text: 要不，我也去跳一曲，让它们见识见识人的本领？可要是跳得不合心意，它们说不定会要我的命！
        - id: ch02-b09
          speaker: narrator
          text: 恐惧终究敌不过他对舞蹈的喜爱。没过多久，老翁便忍不住走到群鬼面前，立刻舞了起来。他明白自己能不能活命，可能全看这一场，于是把所有本领和机智都拿了出来。
        - id: ch02-b10
          speaker: narrator
          text: 看见一个凡人这样大胆无畏地加入宴会，群鬼起初全都大吃一惊。可它们看着看着，惊讶很快变成了赞叹，最后个个都对老翁的舞艺佩服起来。
        - id: ch02-b11
          speaker: demon_chief
          text: 真稀奇！我从没见过这样高明的舞者。他跳得太精彩了！
          emotion: surprised
        - id: ch02-b12
          speaker: narrator
          text: 等老翁跳完，鬼王满意地招呼他。
        - id: ch02-b13
          speaker: demon_chief
          text: 这场舞真有趣，多谢你了。来，再陪我们喝一杯！
        - id: ch02-b14
          speaker: narrator
          text: 鬼王说着，把自己最大的酒杯递了过去。老翁恭恭敬敬地接下，又低头道谢。
        - id: ch02-b15
          speaker: good_old_man
          text: 没想到大王这样厚待我。我这点不成样的舞，只怕反倒扫了各位的兴。
        - id: ch02-b16
          speaker: demon_chief
          text: 不，不！你以后要常来跳给我们看。你的本领可让我们快活得很。
        - id: ch02-b17
          speaker: narrator
          text: 老翁再次谢过鬼王，答应以后还来。
        - id: ch02-b18
          speaker: demon_chief
          text: 老翁，那你明天还来吗？
        - id: ch02-b19
          speaker: good_old_man
          text: 一定来。
        - id: ch02-b20
          speaker: demon_chief
          text: 那就留件东西作凭证，证明你会守约。
        - id: ch02-b21
          speaker: good_old_man
          text: 大王想要什么，只管拿去。
        - id: ch02-b22
          speaker: demon_chief
          text: 让他留下什么才合适呢？
        - id: ch02-b23
          speaker: narrator
          text: 鬼王向四周看去。跪在他身后的一名侍从马上献计。
        - id: ch02-b24
          speaker: demon_attendant
          text: 凭证当然得是他身上最要紧的东西。大王请看，他右脸上有个肉瘤。凡人把这种瘤子当作福相。您把它取下来吧。哪怕只是为了拿回肉瘤，他明天也准会再来。
        - id: ch02-b25
          speaker: demon_chief
          text: 这个主意聪明。
        - id: ch02-b26
          speaker: narrator
          text: 鬼王赞许地点头，双角也跟着晃了晃。他伸出毛茸茸的胳膊，用利爪般的手抓住老翁右脸上的大瘤子。奇怪的是，他只轻轻一碰，那瘤子便像熟透的李子掉下枝头，轻易脱落了。老翁还没弄明白发生了什么，方才还在欢闹的群鬼便一下子全都消失不见。
    - id: ch03
      title: 老翁失去了肉瘤
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 老翁被这一切弄得晕头转向，好半天都不知道自己身在何处。等他终于想清楚刚才发生了什么，才发现那只毁了自己多年容貌的肉瘤真的没了，而且从头到尾一点也不疼。他抬手摸了又摸，右脸没有留下半点伤疤，摸起来和左脸一样光滑。
        - id: ch03-b02
          speaker: narrator
          text: 太阳早已下山，一弯银钩似的新月挂在天上。老翁这才惊觉时候不早，连忙往家赶。他一路不停地拍着右脸，仿佛非得一遍遍确认那个肉瘤真的不见了，确认自己果真交上了好运。心里实在太高兴，他根本没法安静走路，就这么跑着、跳着，一路回了家。
        - id: ch03-b03
          speaker: narrator
          text: 妻子正在家里焦急等待，不明白丈夫究竟遇上了什么，为何迟迟不归。老翁很快把下午离家以后发生的事全讲给她听，又让她看那只丑瘤已经消失。妻子和丈夫一样喜出望外。年轻时，她一直以丈夫的好相貌为荣。后来那个可怕的瘤子长出来，她每天看着都伤心。如今丈夫终于恢复了原来的面容，她怎能不高兴呢。
        - id: ch03-b04
          speaker: narrator
          text: 这对善良的老夫妻隔壁，却住着一个又坏又难相处的老头。他的左脸上也有个肉瘤，同样折磨了他许多年。为了摆脱它，他也曾试过各种办法，却没有一种奏效，那个瘤子始终留在脸上。
        - id: ch03-b05
          speaker: narrator
          text: 仆人一提起邻居好运除瘤的事，他立刻便听进了耳朵，当晚就登门拜访，请老朋友把事情全告诉他。善良的老翁没有隐瞒，把离家之后的经过原原本本讲了一遍。他还仔细说明空心大树的位置和寻找的办法，劝老邻居在第二天下午赶到那里，等到太阳将落的时候。
        - id: ch03-b06
          speaker: narrator
          text: 第二天下午，老邻居出发了。他找了好一阵，终于发现那棵树，便钻进树洞，静候暮色降临。
    - id: ch04
      title: 第二场舞
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了那个时辰，群鬼果然来了。它们照旧摆开宴席，唱歌跳舞。热闹了一阵，鬼王环顾四周，忽然问道。
        - id: ch04-b02
          speaker: demon_chief
          text: 昨天那老翁答应过我们，现在也该到了。他怎么还不来？
        - id: ch04-b03
          speaker: narrator
          text: 第二个老头一听，马上跑出树洞，跪到鬼王面前。
        - id: ch04-b04
          speaker: wicked_old_man
          text: 我早就在等了，就等大王开口叫我呢！
        - id: ch04-b05
          speaker: demon_chief
          text: 啊，是昨天那位老翁。多谢你守约，快给我们跳舞吧。
        - id: ch04-b06
          speaker: narrator
          text: 老头站起来打开折扇，开始跳舞。可他从没学过，既不懂该怎样摆手，也不知道各种舞姿该怎样变换。他以为不管跳成什么样都能讨群鬼喜欢，于是挥着胳膊，跺着双脚，只顾蹦来蹦去，把从前见过的舞尽力胡乱模仿了一遍。
        - id: ch04-b07
          speaker: narrator
          text: 群鬼看得十分不满，彼此抱怨起来。
        - id: ch04-b08
          speakers: [demon_1, demon_2, demon_3]
          ensemble: chorus
          text: 他今天跳得可真糟！
        - id: ch04-b09
          speaker: narrator
          text: 鬼王也沉下脸，对老头说道。
        - id: ch04-b10
          speaker: demon_chief
          text: 你今天跳的，和昨天完全不是一回事。这样的舞我们不想再看。现在把凭证还你，马上走吧。
    - id: ch05
      title: 一边一个瘤子
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 鬼王从衣襟里拿出一个肉瘤。那正是前一天从善舞老翁脸上取下来的。他随手一扔，肉瘤正中坏老头的右脸。才一碰上，它便牢牢粘住，仿佛从来就长在那里。不管怎样拉扯，也休想把它弄下来。
        - id: ch05-b02
          speaker: narrator
          text: 坏老头原想除掉左脸上的旧瘤，哪里料到，旧的还在，右脸反而又多出一个。他惊恐万分，一只手摸摸这边，另一只手摸摸那边，想知道自己是不是陷进了一场噩梦。
        - id: ch05-b03
          speaker: narrator
          text: 可这不是梦。右脸上确实长出了一个大瘤子，和左边的一模一样。群鬼已经全都消失，四周再没有谁能帮他。坏老头也没有别的办法，只得带着两个瘤子回家。那模样实在可怜。他脸颊两边各顶着一个大瘤子，一边一个，把脸夹在中间，看上去活像一只日本葫芦。
