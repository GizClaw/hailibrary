audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    sentaro:
      display_name: 仙太郎
      tts:
        delivery: 任性懒散，情绪直露，遇险时慌张急促
        timbre: 略显轻浮的成年男声
        pace: 中速，惊恐时明显加快
        pitch: 中音
    hunter:
      display_name: 猎人
      tts:
        delivery: 朴实直接，不解对方来意
        timbre: 粗粝厚实的成年男声
        pace: 平稳
        pitch: 中低音
    jofuku:
      display_name: 徐福
      tts:
        delivery: 威严清醒，训诫时不疾不徐
        timbre: 苍劲明亮的老年男声
        pace: 舒缓而有分量
        pitch: 中低音
    messenger:
      display_name: 使者
      tts:
        delivery: 庄重清晰，语气平静而坚定
        timbre: 清朗沉稳的成年男声
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 寻找长生之术
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，有个叫仙太郎的人。他的姓虽有“百万富翁”的意思，他却没有那么富有，只是父亲留给他的家产足够过活。他也就不肯认真做事，日日闲散，一直混到了三十二岁。
        - id: ch01-b02
          speaker: narrator
          text: 有一天，他忽然想起人会生病，也会死。这个念头来得毫无缘由，却叫他怎么也安不下心。
        - id: ch01-b03
          speaker: sentaro
          text: 我可不想这么早死。我要活到五六百岁，至少也得这么久，而且一场病都不要生。寻常人的一辈子，实在太短了。
        - id: ch01-b04
          speaker: narrator
          text: 他寻思起来，要是以后少吃少用，日子过得俭朴些，也许便能活到自己满意的时候。古书里不是有许多帝王活过一千年的故事吗？听说大和国还有一位公主活了五百岁，那已经是年代最近的长寿奇闻。既然从前有人能活那么久，他觉得自己也未必办不到。
        - id: ch01-b05
          speaker: narrator
          text: 仙太郎也常听人讲秦始皇的故事。那位中国皇帝极有才干，也握有无上的权势。他建造了许多宏伟的宫殿，又修筑闻名天下的万里长城。宫廷里满是奢华与荣耀，天下的珍宝、聪明的臣子、显赫的功业，他样样都有，可他并不快乐。因为有朝一日，他仍旧会死，会把这一切全都留下。
        - id: ch01-b06
          speaker: narrator
          text: 从早晨睁眼，到夜里躺下，死亡的影子一直跟着秦始皇。白天无论处理什么大事，他也甩不开这个念头。只要能得到长生不老药，他便再没有烦恼了。于是，他把群臣召来，问他们能不能找到这种自己常从书里读到、从传说中听到的仙药。
        - id: ch01-b07
          speaker: narrator
          text: 老臣徐福告诉皇帝，越过遥远的大海，有一处名叫蓬莱山的仙境。那里的仙人知道长生不老药的秘密，谁喝下那种药水，便会永远活着。皇帝立刻派徐福出海，交给他一艘最好的帆船，又装上许多珍宝，好让他献给仙人，换回一小瓶仙药。
        - id: ch01-b08
          speaker: narrator
          text: 徐福这一去，再也没有回到苦苦等待的皇帝身边。后来，人们传说富士山就是神话中的蓬莱山，那些懂得长生秘方的仙人便住在那里。徐福也被供奉起来，成了仙人的守护神。
        - id: ch01-b09
          speaker: narrator
          text: 仙太郎听过这些故事，便决定亲自去找仙人。若能拜入仙门，自己也成为其中一员，他就有希望得到长生不死之水。他还记得小时候有人说过，仙人除了住在富士山，也会住在每一座高得直入云端的山峰上。
        - id: ch01-b10
          speaker: narrator
          text: 他把老宅交给亲戚照看，走遍国内的山岭，一座接一座地攀上最高峰，却始终看不见仙人的踪影。后来，他在陌生的山野里转了许多天，终于碰到一位猎人。
        - id: ch01-b11
          speaker: sentaro
          text: 请问，那些有长生不老药的仙人住在什么地方？
        - id: ch01-b12
          speaker: hunter
          text: 仙人住哪儿，我不知道。不过这附近倒有个出了名的强盗，手下足有两百人呢。
        - id: ch01-b13
          speaker: narrator
          text: 这个答复全不相干，仙太郎听得十分恼火。他不愿再这样白费工夫，索性赶往日本南方供奉徐福的神社，要向仙人的守护神直接求助。

    - id: ch02
      title: 纸鹤飞向长生国
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 到了神社，仙太郎一连祈祷七天，求徐福指点他找到仙人，赐给他朝思暮想的长生之术。第七天半夜，他仍跪在寂静的神殿里。忽然，最深处的殿门猛地打开，徐福站在一团明亮的云光中现身，招手唤他走近。
        - id: ch02-b02
          speaker: jofuku
          text: 你这个愿望只顾自己，哪能轻易如愿？你想当仙人，好拿到长生不老药。可是仙人的苦日子，你受得了吗？仙人只能吃野果、浆果和松树皮，还要斩断尘世牵挂，把心修炼得像黄金一样纯净，不留世俗的欲念。这样守着戒律慢慢修炼，才能不怕饿，不怕冷，也不怕热。到那时，身子轻得能骑鹤、骑鲤鱼，还能踏过水面，连脚也不会湿。
        - id: ch02-b03
          speaker: jofuku
          text: 再看看你，仙太郎。你喜欢美食，凡事都贪图舒服。你比寻常人还懒，又格外怕冷怕热。叫你赤脚走路，你不肯。叫你冬天只穿一件单衣，你更受不了。凭你的耐性和毅力，怎么过仙人的生活？
        - id: ch02-b04
          speaker: jofuku
          text: 不过，你既然求了我这么久，我就用另一个法子帮你。我要把你送去长生国。那里没有死亡，所有人都永远活着。
        - id: ch02-b05
          speaker: narrator
          text: 徐福说完，把一只小纸鹤放进仙太郎手中，告诉他，只要骑到鹤背上，它自然会把他送到长生国。仙太郎又惊又疑，还是照办了。纸鹤很快变得又宽又大，稳稳托住他，随后张开双翼，升上高空，越过群山，朝大海飞去。
        - id: ch02-b06
          speaker: narrator
          text: 仙太郎起先吓得不轻，后来才慢慢习惯在空中疾飞。他们一连飞过千山万水，纸鹤从来不停下来歇息，也不用找东西吃。它是纸做的，自然不需要食物。奇怪的是，坐在背上的仙太郎一路不吃不喝，竟也丝毫不觉得饿。
        - id: ch02-b07
          speaker: narrator
          text: 几天后，前方出现一座岛。纸鹤又往岛内飞了一段，才降到地面。仙太郎刚下来，它便自己折回小小的模样，一头钻进他的衣袋。
        - id: ch02-b08
          speaker: narrator
          text: 仙太郎好奇地四下张望，想知道长生国到底是什么样子。他先在乡野间转了一圈，又走进城里。这里处处陌生，与故乡完全不同，不过土地看起来十分富饶，百姓也都生活富足。他越看越满意，便在一家客店住下，打算从此留在这里。
        - id: ch02-b09
          speaker: narrator
          text: 店主人十分热心。仙太郎告诉他，自己从远方来，想在此长住，他便答应替这位异乡客去见城里的长官，把居留需要的事情一一办妥。后来，店主人甚至还为他找到一所房屋。就这样，仙太郎终于实现最大的心愿，成了长生国的居民。

    - id: ch03
      title: 人人求死的国度
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 岛民祖祖辈辈生活在这里，从没见过一个人死去，也不知道生病是什么滋味。很久以前，印度和中国的僧人曾漂洋过海来到岛上，讲起一个名叫极乐世界的地方。那里没有烦恼，人人心里都充满幸福、喜悦和满足，可是只有经过死亡，才能走进它的大门。这个传说流传了一代又一代，岛民只知道死亡通向极乐世界，却没有谁能说清，死亡究竟是什么。
        - id: ch03-b02
          speaker: narrator
          text: 所以，他们不像仙太郎，也不像别处的寻常人。无论贫富，谁都不怕死，反而把死亡看成求之不得的福气。他们早已厌倦活个没完，只盼能去僧人说过的那片安乐之地。
        - id: ch03-b03
          speaker: narrator
          text: 仙太郎同岛民聊过以后，很快弄明白了这一切。他觉得自己像是闯进了颠倒国，所有事情都反了过来。他千方百计逃避死亡，好不容易才满心欢喜地来到这里。可这些命中注定永远不会死的人，最大的愿望竟是死上一回。
        - id: ch03-b04
          speaker: narrator
          text: 更奇怪的是，仙太郎眼里的毒药，岛民当作好东西吃。他从前吃惯的食物，他们倒不要。外国商人一来，富人们便争先恐后去买毒药，一买到手就赶紧吞下，只盼马上死去，好进入极乐世界。
        - id: ch03-b05
          speaker: narrator
          text: 可是，别处能夺人性命的毒物，在这个国度一点用处也没有。一心求死的人服了毒，过不多久，不但安然无恙，身体反而更好了。
        - id: ch03-b06
          speaker: narrator
          text: 他们想破脑袋，也想象不出死亡是什么模样。富人甚至愿意献出所有钱财和货物，只求寿命能缩短到两三百年。活得再久，眼前的日子还是永远没有变化。岛民觉得这样没完没了地生活，实在让人疲倦又悲伤。
        - id: ch03-b07
          speaker: narrator
          text: 药铺里最抢手的一种药，据说要连服一百年，才能叫头发稍微变白，让肚子闹些毛病。饭馆拿有毒的河豚当美味，街头的小贩叫卖斑蝥做成的酱汁。仙太郎从没见谁吃坏身子，就连一个患伤风的人也没有。
        - id: ch03-b08
          speaker: narrator
          text: 仙太郎对这个地方满意极了。他认定自己永远不会厌倦活着，求死更是在亵渎神明。岛民个个苦恼，只有他快活。他巴不得活上几千年，把人生享受个够。于是，他在岛上做起生意，安心经营自己的生活。这时候，他连做梦也没想过有一天要回乡。

    - id: ch04
      title: 三百年后的一场梦
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 可是年复一年，仙太郎的生活不再像开头那样称心。他做生意遭受了几次重大的损失，又几次同邻居闹出纠纷。钱财上的麻烦和身边人的不和，全都叫他烦躁不已。
        - id: ch04-b02
          speaker: narrator
          text: 他每天从早忙到晚，时间快得像离弦的箭，一转眼便过去三百年。这三百年始终是同一种单调的生活，他终于厌烦了。他想念自己的故乡，也想再看一眼从前的老宅。在这里再活多少年，生活仍会一成不变，永远留下去岂不是又愚蠢又乏味吗？
        - id: ch04-b03
          speaker: narrator
          text: 当初想逃过死亡时，是徐福帮助了他。如今他想逃出长生国，便又向徐福祈求，请他送自己回日本。
        - id: ch04-b04
          speaker: narrator
          text: 祈祷声刚落，纸鹤就从衣袋里跳了出来。三百年过去，它竟没有一点破损。纸鹤重新变大，仙太郎一坐稳，它便展开翅膀，飞过大海，直奔日本。
        - id: ch04-b05
          speaker: narrator
          text: 可仙太郎就是这样任性，又反复无常。他回头望见渐渐远去的长生国，立刻后悔把那里的一切全都丢下。他想让纸鹤停住，再带自己回去，纸鹤却不理会，只管沿着原来的方向飞过千里汪洋。
        - id: ch04-b06
          speaker: narrator
          text: 突然，海上刮起风暴。雨水打湿了神奇的纸鹤，它立刻皱成一团，直落海中，仙太郎也跟着摔了下去。一想到自己就要淹死，他吓得魂不附体，拼命呼喊徐福。可他环顾四周，海面上连一条船也没有。咸涩的海水一口口灌进肚里，他的处境越来越糟。正当他挣扎着不让自己沉下去时，一条巨大的鲨鱼朝这边游来，张开血盆大口，越逼越近。
        - id: ch04-b07
          speaker: sentaro
          text: 徐福！快来救救我！救命啊！
          emotion: fearful
        - id: ch04-b08
          speaker: narrator
          text: 眼看自己的末日已经来到，鲨鱼马上就要把他吞下，仙太郎吓得全身僵硬，叫声却比先前更响。就在这时，他被自己的尖叫惊醒了。原来，他长久祈祷时在神社前睡着了。长生国、三百年的岁月、落海和鲨鱼，全是一场离奇可怕的梦。他浑身都是吓出的冷汗，一时间茫然得不知身在何处。

    - id: ch05
      title: 徐福的教诲
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 忽然，一团灿烂的光向仙太郎移来。光里站着一位使者，手中拿着一本书。
        - id: ch05-b02
          speaker: messenger
          text: 我奉徐福之命来见你。你诚心祈求，他便让你在梦里看见长生国。可你在那里活得厌倦，又求他准你回乡，盼着将来能够死去。为了试探你，徐福让你掉进海中，又派鲨鱼来吞你。你说自己愿意死，其实并不是真心。到了生死关头，你还是大声求救了。
        - id: ch05-b03
          speaker: messenger
          text: 你想做仙人，想得到长生不老药，都是白费心思。你受不了那种清苦自律的日子，这些东西自然不属于你。还是回祖传的家中去吧，做个善良勤恳的人。记得在先祖的忌日祭祀，也要为儿女的将来尽心打算。这样，你便能活到高寿，安稳幸福。不要再妄想逃过死亡了，世上没有谁能办到。你也已经亲眼看见，自私的愿望就算实现，也换不来幸福。
        - id: ch05-b04
          speaker: messenger
          text: 我把这本书送给你。里面有许多值得学习的训诫。只要认真研读，它会引着你走上我刚才说的道路。
        - id: ch05-b05
          speaker: narrator
          text: 使者说完，便从光中消失了。仙太郎把这番教诲牢牢记住，捧着书回到老宅。从此，他丢开那些虚妄的念头，努力过善良而有益的生活，也处处遵守书中的教导。往后的日子里，他和全家都兴旺安乐。
