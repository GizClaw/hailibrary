  chapters:
    - id: ch01
      title: Sentaro's Wish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago, there lived a man named Sentaro. His family name meant “Millionaire.” He was not quite that rich, but he was far from poor. His father had left him a small fortune, and Sentaro lived on it carelessly. He gave no serious thought to work until he was about thirty-two.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Then one day, for no reason at all, he began thinking about sickness and death. The thought of falling ill, or of dying, made him miserable.
        - id: ch01-b03
          speaker: sentaro
          text: >-
            I want to live for five or six hundred years at least, and never be sick. An ordinary human life is much too short.
          emotion: fearful
        - id: ch01-b04
          speaker: narrator
          text: >-
            Sentaro wondered if he could live as long as he pleased by being simple and careful from then on. Ancient histories told of emperors who lived a thousand years. A Princess of Yamato was said to have reached five hundred, the latest great record for a long life.
        - id: ch01-b05
          speaker: narrator
          text: >-
            He also knew the story of the Chinese king Shin-no-Shiko. The king was powerful and able. He built vast palaces and the famous Great Wall of China. He had wealth, splendor, wise advisers, and a glorious reign. Still, he was miserable, because one day he would have to die and leave everything behind.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The thought of death followed the king everywhere. It was with him when he went to bed, when he rose in the morning, and through every hour of his day. He could not escape it. If only he could find the Elixir of Life, he thought, then he would be happy. At last he gathered his courtiers and asked whether they could find the elixir he had read and heard so much about.
        - id: ch01-b07
          speaker: narrator
          text: >-
            An old courtier named Jofuku told him of Horaizan, a country far across the sea. Hermits there knew the secret of the Elixir of Life, and anyone who drank it would live forever. The king sent Jofuku to find them. He gave him a fine junk filled with treasures and precious stones as gifts.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Jofuku sailed away but never returned. Ever since then, people have said that Mount Fuji is the fabled Horaizan, home of the hermits with the elixir. They worshiped Jofuku as the hermits' patron god.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Sentaro decided to find those hermits and become one himself. He remembered hearing as a child that they lived not only on Mount Fuji, but on every very high peak.
    - id: ch02
      title: The Shrine of Jofuku
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Sentaro left his home in his relatives' care and set out. He crossed mountain country and climbed the highest peaks, but he found no hermit anywhere. After wandering for many days through a place he did not know, he met a hunter.
        - id: ch02-b02
          speaker: sentaro
          text: >-
            Do you know where the hermits live, the ones who possess the Elixir of Life?
        - id: ch02-b03
          speaker: hunter
          text: >-
            No, I don't know where any such hermits live. But a notorious robber lives around here. They say he commands two hundred men.
        - id: ch02-b04
          speaker: narrator
          text: >-
            That strange answer greatly irritated Sentaro. He decided it was foolish to waste any more time searching the mountains this way. Instead, he went straight to Jofuku's shrine in southern Japan, where Jofuku was honored as the patron god of the hermits. For seven days Sentaro prayed there. He begged Jofuku to show him the way to a hermit who could give him the thing he wanted so badly.
        - id: ch02-b05
          speaker: narrator
          text: >-
            At midnight on the seventh day, Sentaro knelt in the temple. Suddenly the innermost door flew open. Jofuku appeared in a shining cloud and called him closer.
        - id: ch02-b06
          speaker: jofuku
          text: >-
            Your wish is selfish, and it cannot easily be granted. You want to become a hermit and find the Elixir of Life. But do you understand how hard a hermit's life is? Hermits may eat only fruit, berries, and pine bark. They must leave the world behind until their hearts are pure as gold and free of every earthly desire.
        - id: ch02-b07
          speaker: jofuku
          text: >-
            By following those strict rules, a hermit slowly stops feeling hunger, cold, or heat. The body becomes so light that it can ride a crane or a carp, or walk over water without wetting its feet.
        - id: ch02-b08
          speaker: jofuku
          text: >-
            But you love comfort and good food. You are idler than an ordinary man, and heat and cold trouble you more than most. You could never go barefoot or wear one thin robe through winter. Where would you find the patience and endurance for a hermit's life?
        - id: ch02-b09
          speaker: jofuku
          text: >-
            Still, I will answer your prayer in another way. I will send you to the country of Perpetual Life, where death never comes and everyone lives forever.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Jofuku placed a little paper crane in Sentaro's hand and told him to ride upon its back. Sentaro obeyed in wonder. The crane grew large enough to carry him, spread its wings, and rose high above the mountains before flying out over the sea.
    - id: ch03
      title: The Country of Perpetual Life
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At first Sentaro was frightened, but he slowly grew used to rushing through the air. They flew thousands of miles. The paper bird never stopped for food or rest, and strangely, Sentaro needed neither one.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Several days later they reached an island. The crane flew inland and landed. When Sentaro stepped down, it folded itself small and flew into his pocket.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Sentaro eagerly explored the country and its town. Everything looked strange and different from home, but the land and its people seemed prosperous. He took a room at a hotel and decided to stay.
        - id: ch03-b04
          speaker: innkeeper
          text: >-
            Since you have come here to live, I will arrange your stay with the city governor. I will find you a house as well.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The kind innkeeper did exactly that, and Sentaro became a resident of the country of Perpetual Life. As far back as anyone remembered, no one on the island had ever died, and nobody knew sickness.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Priests from India and China had once told the islanders about Paradise, a beautiful country where every heart was filled with happiness, peace, and contentment. Its gates could be reached only through death. The tale passed through many generations, though no one knew exactly what death was.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Unlike Sentaro and ordinary people elsewhere, rich and poor alike longed for death as something good. Their endless lives had worn them out, and they wanted to reach the happy land of contentment the priests had described centuries before. Sentaro felt as though he had entered a world turned upside down. He had fled from death and arrived with joy and relief. Yet the people who were doomed never to die believed that finding death would be perfect bliss.
        - id: ch03-b08
          speaker: narrator
          text: >-
            They ate as food what Sentaro called poison, and rejected the food he knew. When foreign merchants arrived, wealthy islanders rushed to buy poisons. They swallowed them eagerly, hoping to die and enter Paradise. Yet the poisons only left them feeling healthier than before.
        - id: ch03-b09
          speaker: narrator
          text: >-
            They tried in vain to imagine death. The rich would have surrendered every coin and possession just to shorten their lives to two or three hundred years. Living forever without any change seemed sad and tiresome.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Chemists sold a popular drug that was supposed, after a hundred years of use, to turn the hair a little gray and upset the stomach. Restaurants served poisonous globe-fish as a delicacy. Street sellers offered sauces made from Spanish flies. But Sentaro never saw anyone fall ill, or even catch a cold.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Sentaro was delighted. He believed he would never tire of life, and thought it wrong to wish for death. He alone was happy on the island. He wanted thousands of years of pleasure, so he opened a business and forgot all about returning home.
    - id: ch04
      title: Three Hundred Years
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            As the years passed, life stopped going so smoothly. Sentaro lost heavily in business, and trouble with his neighbors annoyed him again and again. He stayed busy from morning to night, and time flew like an arrow.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Three hundred years went by in the same dull fashion. At last Sentaro grew weary of that country. He longed to see his own land and his old home again. However long he stayed, life there would always remain the same. It now seemed foolish and exhausting to go on that way forever.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Sentaro remembered Jofuku, who had once helped him escape death. Now he prayed to the saint to help him escape the country of Perpetual Life and return home.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The instant he prayed, the paper crane sprang from his pocket. Sentaro was amazed that three hundred years had not harmed it. It grew until he could mount it, then spread its wings and flew swiftly over the sea toward Japan.
        - id: ch04-b05
          speaker: narrator
          text: >-
            But Sentaro's wishes changed easily. He looked back and regretted everything he had left behind. He tried to stop the bird, but the crane continued across thousands of miles of ocean.
    - id: ch05
      title: The Storm and the Shark
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Then a storm broke. The wonderful paper crane grew wet and crumpled, and it dropped into the sea. Sentaro fell with it.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The thought of drowning terrified him. He shouted for Jofuku to save him, but no ship could be seen. He swallowed seawater as he struggled to stay afloat, making his misery worse.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Then he saw a monstrous shark swimming toward him. It drew near and opened its enormous mouth, ready to swallow him. With death so close, Sentaro was almost frozen with fear. He screamed for Jofuku with all his strength.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Then Sentaro awoke to the sound of his own screams. He was still lying before the shrine. During his long prayer, he had fallen asleep, and all those strange and frightening adventures had been nothing but a wild dream. He was drenched in cold sweat from terror and was utterly bewildered by what had happened.
    - id: ch06
      title: Jofuku's Lesson
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Suddenly a bright light moved toward Sentaro. A messenger stood within it, holding a book.
        - id: ch06-b02
          speaker: messenger
          text: >-
            Jofuku sent me. In answer to your prayer, he let you see the country of Perpetual Life in a dream. You became tired of living there and asked to return home so that you could die.
        - id: ch06-b03
          speaker: messenger
          text: >-
            To test you, Jofuku let you fall into the sea and sent a shark to swallow you. But you did not truly desire death. The moment it came near, you screamed and begged for help.
        - id: ch06-b04
          speaker: messenger
          text: >-
            It is useless for you to seek the Elixir of Life or try to become a hermit. Those things are not meant for someone who cannot live austerely. Go back to your father's home. Work hard and live well. Honor the anniversaries of your ancestors, and make it your duty to provide for your children's future.
        - id: ch06-b05
          speaker: messenger
          text: >-
            Then you may live happily to a good old age. Give up your empty wish to escape death, because no one can do that. By now you should know that even selfish wishes, once granted, cannot bring happiness.
        - id: ch06-b06
          speaker: messenger
          text: >-
            This book contains many teachings that will help you. Study them, and they will guide you along the path I have shown you.
        - id: ch06-b07
          speaker: narrator
          text: >-
            When the messenger finished, he disappeared. Sentaro took the lesson to heart. With the book in his hand, he returned to his old home. He gave up his foolish wishes, tried to live a good and useful life, and followed the teachings in the book.
        - id: ch06-b08
          speaker: narrator
          text: >-
            From that time on, Sentaro and his household prospered.
