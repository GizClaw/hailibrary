audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, thoughtful, and direct
        timbre: clear and gentle
        pace: measured
        pitch: medium
    hidesato:
      display_name: Hidesato
      tts:
        delivery: brave, courteous, and assured
        timbre: strong and clear
        pace: steady
        pitch: medium-low
    dragon_king:
      display_name: Dragon King
      tts:
        delivery: dignified and earnest
        timbre: resonant and smooth
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: The Dragon on the Bridge
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago in Japan, there lived a brave warrior whom everyone came to know as Tawara Toda, or “My Lord Bag of Rice.” His true name was Fujiwara Hidesato. This is the story of how he gained his other name.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One day, Hidesato set out to seek adventure. He had the heart of a warrior and could not bear to sit idle. He fastened on his two swords, picked up his enormous bow, which stood taller than he did, slung his quiver across his back, and started on his way.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Before long, he reached the bridge of Seta-no-Karashi, which spanned one end of beautiful Lake Biwa. The moment he set foot on the bridge, he saw a huge serpent-dragon stretched across his path. Its body was as thick as the trunk of a great pine tree and filled the whole width of the bridge. One of its enormous claws rested on the parapet along one side, while its tail pressed against the parapet on the other. The creature seemed asleep, and fire and smoke poured from its nostrils with every breath.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The terrible sight alarmed Hidesato at first. He had only two choices. He could turn back, or he could walk straight over the dragon. But he was brave, and he pushed his fear aside. Crunch, crunch! He stepped on its body and between its coils. Then he went on without once looking back.
        - id: ch01-b05
          speaker: narrator
          text: >-
            He had taken only a few more steps when someone called to him from behind. Hidesato turned and stared. The dragon had completely vanished, though there had scarcely been time for it to move. In its place stood a strange man, bowing very formally until he was almost at the ground. Red hair streamed over his shoulders. On his head was a crown shaped like a dragon’s head, and shells patterned his sea-green robe.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Hidesato knew at once that this was no ordinary man. Had the dragon changed into him? What could it all mean? Wondering at what he had seen, Hidesato walked back and spoke to the stranger.
        - id: ch01-b07
          speaker: hidesato
          text: Was that you calling after me?
        - id: ch01-b08
          speaker: dragon_king
          text: Yes, it was. I have a serious favor to ask. Will you grant it?
        - id: ch01-b09
          speaker: hidesato
          text: If I am able to help, I will. But first, tell me who you are.
        - id: ch01-b10
          speaker: dragon_king
          text: I am the Dragon King of the Lake. My home lies beneath these waters, directly under this bridge.
        - id: ch01-b11
          speaker: hidesato
          text: What would you have me do?
        - id: ch01-b12
          speaker: dragon_king
          text: I need you to kill my deadly enemy, the centipede who lives on that mountain across the lake.
        - id: ch01-b13
          speaker: narrator
          text: The Dragon King pointed toward a high peak on the opposite shore.
        - id: ch01-b14
          speaker: dragon_king
          text: >-
            My family has lived in this lake for many years. I have many children and grandchildren, but now we live in terror. Night after night, a monstrous centipede finds our home and carries away one of them. I cannot save them. If this continues, I will lose all my children, and in the end the creature will take me too.
        - id: ch01-b15
          speaker: dragon_king
          text: >-
            In my misery, I decided to seek help from a human being. For days, I have waited on this bridge in the shape of the dreadful dragon you saw. I hoped a strong and courageous man would pass by. Everyone else took one look at me and fled. You alone faced me without fear, so I knew you were truly brave. Please, have pity on us. Will you kill the centipede?
        - id: ch01-b16
          speaker: narrator
          text: Hidesato was deeply sorry for the Dragon King and promised at once to do all he could.
    - id: ch02
      title: The Palace Beneath the Lake
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Hidesato asked where the centipede lived so he could attack it at once.
        - id: ch02-b02
          speaker: dragon_king
          text: >-
            Its home is on Mount Mikami. But every night, at a certain hour, it comes to my palace in the lake. We had better wait for it there.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The Dragon King led Hidesato down beneath the bridge toward his palace. As they descended, the water parted to let them through. Though Hidesato walked through the lake, his clothes did not even grow damp.
        - id: ch02-b04
          speaker: narrator
          text: >-
            He had never seen anything as beautiful as the white marble palace beneath Lake Biwa. He had often heard stories of the Sea King’s palace at the bottom of the ocean, where all the servants and attendants were saltwater fish. Yet here, far from the sea, stood a magnificent palace in the very heart of the lake. Delicate goldfish, red carp, and shining silver trout waited upon the Dragon King and his guest.
        - id: ch02-b05
          speaker: narrator
          text: >-
            An astonishing feast was set before Hidesato. The dishes were made from crystal lotus leaves and flowers, and the chopsticks were carved from the rarest ebony. As soon as the two sat down, the sliding doors opened. Ten lovely goldfish dancers entered, followed by ten red-carp musicians playing the koto and samisen.
        - id: ch02-b06
          speaker: narrator
          text: >-
            The hours slipped by. The music and dancing were so beautiful that everyone forgot about the centipede. At midnight, the Dragon King was about to offer Hidesato another cup of wine. Then the entire palace shook beneath a heavy tramp, tramp, as though a great army were marching close by.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Hidesato and the Dragon King leaped up and hurried to the balcony. Across the lake, on the opposite mountain, two enormous balls of fire glowed in the darkness and drew closer. The Dragon King trembled beside the warrior.
        - id: ch02-b08
          speaker: dragon_king
          text: >-
            The centipede! Those two balls of fire are its eyes. It is coming to seize its prey. You must kill it now!
          emotion: fearful
        - id: ch02-b09
          speaker: narrator
          text: >-
            Hidesato looked toward the mountain in the dim starlight. Behind those fiery eyes, an enormous centipede wound its long body around the slopes. Light shone from its hundred feet like distant lanterns moving slowly toward the shore.
    - id: ch03
      title: The Last Arrow
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Hidesato showed no fear at all. He tried to quiet the trembling Dragon King.
        - id: ch03-b02
          speaker: hidesato
          text: Do not be afraid. I will kill the centipede. Bring me my bow and arrows.
          emotion: calm
        - id: ch03-b03
          speaker: narrator
          text: >-
            The Dragon King obeyed. When Hidesato took up his bow, he saw that only three arrows remained in his quiver. He set the first arrow to the string, aimed with care, and let it fly.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The arrow struck the very center of the centipede’s head. But it did not pierce the creature. It glanced away without doing any harm and fell to the ground.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Hidesato did not lose courage. He set the second arrow to his bow and shot again. Once more it hit the center of the monster’s head. Once more it bounced away and dropped uselessly to the ground. No weapon could pierce the centipede. When the Dragon King saw even this brave warrior fail, his hope vanished, and he began to shake with fear.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Now Hidesato had only one arrow left in his quiver. If that last arrow failed, he would have no way to kill the monster. He gazed across the water. The centipede had wrapped its hideous body seven times around the mountain and was nearly at the lake. Its fiery eyes came closer and closer, and the light from its hundred feet began to cast bright reflections in the still water below.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Then Hidesato remembered hearing that human saliva was deadly to centipedes. Yet this was no common centipede. It was so huge and horrible that the thought of it made the flesh creep. Still, this was his last chance. Hidesato put the end of his final arrow into his mouth. Then he set it to the bow, aimed carefully once more, and fired.
        - id: ch03-b08
          speaker: narrator
          text: >-
            The arrow hit the middle of the centipede’s head. This time it did not glance away. It drove straight into the creature’s brain. The enormous body shuddered and stopped. The fire in its eyes and hundred feet faded to a dull glow, like sunset on a stormy day. Then every light went out.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Darkness covered the whole sky. Thunder rolled, lightning flashed, and the wind roared so fiercely that it seemed the world was ending. The Dragon King, his children, and all his attendants scattered and crouched wherever they could inside the palace. They were terrified, for the whole building shook down to its foundations.
        - id: ch03-b10
          speaker: narrator
          text: >-
            At last, the dreadful night passed. Dawn came, beautiful and clear. The centipede had vanished from the mountain.
    - id: ch04
      title: The Dragon King’s Thanks
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Hidesato called for the Dragon King to join him on the balcony. The centipede was dead, and there was nothing left to fear.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Everyone in the palace came out rejoicing. Hidesato pointed toward the lake. The dead centipede lay floating on the water, and its blood had dyed the water red.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The Dragon King’s gratitude had no limit. His whole family came before Hidesato and bowed down to the warrior. They called him the one who had saved them and the bravest warrior in all Japan.
        - id: ch04-b04
          speaker: narrator
          text: >-
            They prepared another feast, even grander than the first. Every kind of fish was served in every imaginable way. Some was raw, some stewed, some boiled, and some roasted. It all came on coral trays and crystal dishes. The wine was the finest Hidesato had ever tasted. Bright sunlight made the lake glitter like a liquid diamond, and by day the palace looked a thousand times more beautiful than it had at night.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The Dragon King urged Hidesato to remain for several days, but the warrior insisted on returning home.
        - id: ch04-b06
          speaker: hidesato
          text: I have done what I came to do, and now I must go home.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The Dragon King and his whole family were very sorry to see him leave so soon. But since Hidesato would not stay, they begged him to accept what they called a few small gifts. The presents were a sign of their deep gratitude to him for freeing them forever from the terrible centipede.
        - id: ch04-b08
          speaker: narrator
          text: >-
            As Hidesato stood in the palace entrance saying farewell, a procession of fish suddenly changed into men. They wore ceremonial robes and crowns shaped like dragons’ heads, showing that they served the great Dragon King.
        - id: ch04-b09
          speaker: narrator
          text: >-
            They carried five gifts. There was a large bronze bell, a bag of rice, a roll of silk, a cooking pot, and a smaller bell. Hidesato did not wish to accept so much, but the Dragon King insisted, and at last he could no longer refuse.
        - id: ch04-b10
          speaker: narrator
          text: >-
            The Dragon King accompanied him as far as the bridge. There he took his leave with many bows and good wishes. His servants continued on with Hidesato, carrying the presents toward the warrior’s home.
    - id: ch05
      title: The Gifts Come Home
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Hidesato’s household had been deeply worried when he failed to return the night before. At last, they decided the violent storm must have delayed him and that he had taken shelter somewhere.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The servants who had been watching for him finally saw him approaching. They called through the house that he was coming, and everyone hurried outside to meet him. All of them wondered what the strange procession could mean. Behind Hidesato came a company of men carrying presents and banners.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The Dragon King’s servants set down the gifts. Then they vanished. Hidesato told his household everything that had happened.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Soon they discovered that the grateful Dragon King’s presents had magical powers. Only the bell was ordinary. Hidesato had no need of it, so he gave it to a nearby temple. There it was hung up to boom out each hour across the surrounding country.
    - id: ch06
      title: My Lord Bag of Rice
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            The one bag of rice was quite different. Day after day, it fed Hidesato and his entire family. Yet no matter how much rice they took, the bag never grew emptier. Its supply could never be exhausted.
        - id: ch06-b02
          speaker: narrator
          text: >-
            The roll of silk never became any shorter either. Again and again, long pieces were cut from it to make new clothes for Hidesato to wear at the New Year court. Still, the roll remained just as long as before.
        - id: ch06-b03
          speaker: narrator
          text: >-
            The cooking pot had its own wonder. Whatever anyone placed inside, it cooked the food deliciously, without any fire at all. It was a very economical saucepan indeed.
        - id: ch06-b04
          speaker: narrator
          text: >-
            News of Hidesato’s wonderful fortune traveled far and wide throughout the land. He never again had to spend any money on rice, silk, or fuel for cooking, so he became very rich and prosperous.
        - id: ch06-b05
          speaker: narrator
          text: From that time on, everyone knew him as My Lord Bag of Rice.
