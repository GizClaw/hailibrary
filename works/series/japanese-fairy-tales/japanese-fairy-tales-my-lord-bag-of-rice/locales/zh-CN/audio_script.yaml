audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老传说的庄重与奇趣
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    hidesato:
      display_name: 藤原秀乡
      tts:
        delivery: 果断沉着，语气勇毅而不夸张
        timbre: 坚实明亮
        pace: 稳健利落
        pitch: 中低音
    dragon_king:
      display_name: 龙王
      tts:
        delivery: 谦恭诚恳，危急时流露深切忧惧
        timbre: 浑厚温和
        pace: 从容中略带迟缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 桥上的蛇龙
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，日本有一位勇猛的武士，名叫藤原秀乡。后来，人人都称他俵藤太，也就是“米袋大人”。这个名字的来历，要从一次奇遇说起。
        - id: ch01-b02
          speaker: narrator
          text: 一天，闲不住的秀乡出门寻找冒险。他腰间系好两把刀，手里提着一张比自己还高的巨弓，又把箭囊背在身后，便上路了。没走多远，他来到了横跨琵琶湖一端的濑田唐桥。
        - id: ch01-b03
          speaker: narrator
          text: 秀乡刚一上桥，就见一条巨大的蛇龙横在前面。它的身子粗得像大松树的树干，把桥面堵得严严实实。一只巨爪搭着这边的栏杆，尾巴却抵到了另一边。怪物像是睡着了，鼻孔随着呼吸不断喷出火和烟。
        - id: ch01-b04
          speaker: narrator
          text: 这样一条可怕的巨兽挡在路上，秀乡心里也吃了一惊。眼前只有两条路，要么回头，要么从怪物身上跨过去。可他毕竟是个勇士，很快便压下恐惧，迎面往前走。一阵咯吱咯吱的响声中，他一脚踩过龙身，一脚跨过盘曲的躯体，头也不回地走到了桥那边。
        - id: ch01-b05
          speaker: narrator
          text: 刚走出几步，背后忽然有人叫他。秀乡回身一看，那条龙早已不见了。桥上站着一个模样奇异的男子，正在恭恭敬敬地伏身行礼。那人红发披肩，头戴龙首形的冠冕，海绿色衣袍上全是贝壳花纹。
        - id: ch01-b06
          speaker: narrator
          text: 秀乡一看就知道，这不是普通凡人，心中越发诧异。可那条龙怎么转眼便消失了？难道正是它变成了这个男子？这一切又是什么意思？秀乡带着满腹疑问走到那人面前。
        - id: ch01-b07
          speaker: hidesato
          text: 刚才是你在叫我吗？
        - id: ch01-b08
          speaker: dragon_king
          text: 正是。我有一件要紧的事想求您，不知道您肯不肯帮忙？
        - id: ch01-b09
          speaker: hidesato
          text: 只要是我办得到的，我就答应。不过，你得先说说自己是谁。
        - id: ch01-b10
          speaker: dragon_king
          text: 我是琵琶湖的龙王，家就在这座桥下面的湖水里。
        - id: ch01-b11
          speaker: hidesato
          text: 那么，你究竟想请我做什么？
        - id: ch01-b12
          speaker: dragon_king
          text: 请您杀死我的死敌。那是一条蜈蚣，就住在湖对岸的山上。
        - id: ch01-b13
          speaker: narrator
          text: 龙王伸手指向对岸的一座高峰，接着说起了自己的苦难。
        - id: ch01-b14
          speaker: dragon_king
          text: 我在湖里住了许多年，家中儿孙众多。可是近来，一条巨大的蜈蚣发现了我们的住处。它每天夜里都来掳走一个亲人，我却救不了他们。再这样下去，我的儿女会被吃光，我自己也逃不过它的毒手。
          emotion: sad
        - id: ch01-b15
          speaker: dragon_king
          text: 我实在走投无路，只好向人求助。这些天，我一直化成您刚才看见的蛇龙，守在桥上等候勇士。别人一见我，立刻吓得逃走。只有您毫不畏惧。我知道您有非凡的勇气。求您可怜我们，替我杀掉那条蜈蚣吧！
        - id: ch01-b16
          speaker: narrator
          text: 秀乡听完龙王的遭遇，十分同情，当即答应尽力相助。他问清蜈蚣的住处，准备马上赶去迎战。龙王却告诉他，怪物虽住在三上山，每夜都会在固定时辰来到湖中宫殿，守在那里等它自己出现更合适。
    - id: ch02
      title: 湖底宫殿的午夜
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 龙王领着秀乡向桥下走去。奇怪的是，湖水自动分开，给他们让出了一条路。秀乡从水中穿过，衣服竟连一点潮气也没沾。
        - id: ch02-b02
          speaker: narrator
          text: 湖底矗立着一座白色大理石宫殿，美得让秀乡惊叹。他从来没见过这样的景象。他听说过大海深处的海王宫，也听说那里的仆从和臣属全是海鱼，却从没想到琵琶湖心也有如此辉煌的宫宇。娇小的金鱼、红鲤和银鳟纷纷上前，服侍龙王与客人。
        - id: ch02-b03
          speaker: narrator
          text: 宫里很快摆开盛宴。菜肴装在水晶雕成的荷叶和荷花里，筷子则是珍贵的乌木所制。他们才坐下，拉门就打开了。十位金鱼舞姬翩翩而出，后面还跟着十位红鲤乐师，弹奏十三弦琴与三味线。
        - id: ch02-b04
          speaker: narrator
          text: 美妙的音乐和舞蹈让时间飞快过去，不知不觉便到了午夜，众人几乎把蜈蚣的事忘得一干二净。龙王正要斟一杯新酒，再敬秀乡一杯，宫殿突然震动起来。咚！咚！那声音就像一支庞大的军队在附近齐步行进。
        - id: ch02-b05
          speaker: narrator
          text: 秀乡和龙王一同冲上露台。对面的山上，两团巨大的火光正越逼越近。龙王站在秀乡身旁，浑身发抖。
        - id: ch02-b06
          speaker: dragon_king
          text: 蜈蚣来了！那两团火就是它的眼睛。它又来捕食了！请您快趁现在杀死它！
          emotion: fearful
        - id: ch02-b07
          speaker: narrator
          text: 秀乡望向昏暗的星空。两团火光后面，一条硕大无朋的长蜈蚣正绕山爬来。它一百只脚上的光，仿佛远处一盏盏缓缓移向湖岸的灯笼。
        - id: ch02-b08
          speaker: narrator
          text: 秀乡脸上毫无惧色，还反过来安慰龙王。
        - id: ch02-b09
          speaker: hidesato
          text: 不必害怕，我会杀掉它。请把我的弓箭拿来。
          emotion: calm
        - id: ch02-b10
          speaker: narrator
          text: 龙王赶紧取来弓箭。秀乡一看，箭囊里只剩三支箭。他抽出一支，扣上弓弦，仔细瞄准后射了出去。
        - id: ch02-b11
          speaker: narrator
          text: 箭正中蜈蚣额头，却没能穿透，只轻轻弹开，掉在了地上。
        - id: ch02-b12
          speaker: narrator
          text: 秀乡一点也没有气馁。他又抽出一支箭，扣上弓弦，瞄准后射了出去。这一箭还是射中了额头中央，却再次被硬壳弹落。原来刀箭根本伤不了这条蜈蚣。龙王眼看连这样勇猛的武士都奈何不了怪物，顿时失去信心，又怕得颤抖起来。
    - id: ch03
      title: 最后一支箭
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 箭囊里只剩最后一支箭了。要是再失败，秀乡便无法杀死蜈蚣。他隔湖望去，怪物可怕的长躯已经在山上盘了七圈，很快就会爬到湖边。火球般的双眼越来越近，百足的光也映进了平静的湖水。
        - id: ch03-b02
          speaker: narrator
          text: 就在这时，秀乡想起一件事。听说人的唾液能毒死蜈蚣，可眼前的怪物实在大得惊人，单是想想它的模样，就叫人浑身发冷。
        - id: ch03-b03
          speaker: narrator
          text: 秀乡决定赌上最后一次机会。他抽出仅剩的箭，把箭头含进嘴里，然后扣住弓弦，再一次仔细瞄准，猛然放箭。
        - id: ch03-b04
          speaker: narrator
          text: 箭依然命中蜈蚣额头。这一次，它没有被弹开，而是直刺进怪物的脑中。蛇一样的长躯剧烈抽动，随即停了下来。巨眼和百足的火光慢慢变暗，像暴风雨中的落日，只剩一片昏红，随后彻底熄灭。
        - id: ch03-b05
          speaker: narrator
          text: 黑暗顿时罩住天空。雷声滚滚，闪电横空，狂风怒吼，仿佛世界就要毁灭。龙王和儿女、侍从全都缩在宫殿各处，吓得魂不附体。整座宫殿连根基都在震颤。
        - id: ch03-b06
          speaker: narrator
          text: 可怕的一夜终于过去。天亮了，天空明净晴朗，三上山上再也看不见那条蜈蚣。
        - id: ch03-b07
          speaker: hidesato
          text: 龙王，请出来看看吧。蜈蚣已经死了，你再也不用害怕。
        - id: ch03-b08
          speaker: narrator
          text: 宫中所有人都欢欢喜喜地走上露台。秀乡指向湖面，死蜈蚣的尸体正漂在那里，鲜血把湖水染得通红。
        - id: ch03-b09
          speaker: narrator
          text: 龙王感激得不知如何是好，带着全家伏在秀乡面前行礼。他们称秀乡是全家的救命恩人，也是全日本最勇敢的武士。
    - id: ch04
      title: 龙王的谢礼
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 宫里又摆起一场盛宴，这一次比先前更加丰盛。鲜鱼做成了生切、炖菜、水煮和烤物，盛在珊瑚托盘与水晶碟里。酒也是秀乡平生喝过最好的。阳光照耀着湖面，湖水像流动的钻石一样闪亮，白昼里的宫殿比夜晚美上千倍。
        - id: ch04-b02
          speaker: narrator
          text: 龙王竭力挽留秀乡多住几天，秀乡却坚持回家。
        - id: ch04-b03
          speaker: hidesato
          text: 我来这里要做的事已经办完，现在该回去了。
        - id: ch04-b04
          speaker: narrator
          text: 龙王一家都舍不得秀乡这么快离开。可他既然心意已决，他们便恳求他收下几件所谓的“小小礼物”，留作谢恩的纪念。因为秀乡替他们除去了可怕的仇敌，让全家从此再也不用受蜈蚣侵害。
        - id: ch04-b05
          speaker: narrator
          text: 秀乡站在门廊告辞时，一队鱼突然变成了一列男子。他们个个穿着礼服，头戴龙冠，表明自己是大龙王的臣仆。他们带来的礼物，一共有五件。
        - id: ch04-b06
          speaker: narrator
          text: 第一件是一口大铜钟。第二件是一袋米。第三件是一匹绸缎。第四件是一口锅。第五件是一只小钟。
        - id: ch04-b07
          speaker: narrator
          text: 秀乡本不想收下这么多礼物，可龙王一再坚持，他实在不好推辞，只得全部接受。龙王亲自把他送到桥边，又一次次深深行礼，连声送上祝福。随后，龙王留下那队侍从，让他们带着礼物，一路护送秀乡回家。
        - id: ch04-b08
          speaker: narrator
          text: 秀乡一夜未归，家人与仆从一直忧心不已。大家后来猜想，他多半是被猛烈的风暴挡住，找地方躲了一夜。守候在外的仆人一看见主人，马上高声通知所有人。全家都迎了出来，却弄不明白秀乡身后那支带着礼物、举着旗幡的队伍究竟从何而来。
        - id: ch04-b09
          speaker: narrator
          text: 龙王的侍从放下礼物，转眼便消失不见。秀乡这才把一路上的奇遇从头讲给家人听。
        - id: ch04-b10
          speaker: narrator
          text: 不久，大家发现龙王的谢礼都带着神奇的力量。只有那口大铜钟十分普通。秀乡用不上，便把它送给附近的寺院。寺里把钟挂起来，每到整点，浑厚的钟声就传遍四周。
    - id: ch05
      title: 米袋大人
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 那袋米怎么也取不完。秀乡一家每天从中舀米做饭，不管舀出多少，袋里的米始终不会减少。
        - id: ch05-b02
          speaker: narrator
          text: 那匹绸缎也永远不会变短。人们一次又一次从上面裁下长长的布，为秀乡缝制新衣，让他在新年进宫时穿着，可绸缎还是完整如初。
        - id: ch05-b03
          speaker: narrator
          text: 那口锅同样奇妙。无论放进什么食材，都不用生火，便能自动做成想要的美味佳肴。它可真是一口节省柴火的好锅。
        - id: ch05-b04
          speaker: narrator
          text: 秀乡的奇遇很快传遍四方。从此，他不用再花钱买米、绸缎和柴火，家业越来越兴旺，成了富足显贵的人物。
        - id: ch05-b05
          speaker: narrator
          text: 自那以后，人们都称他为“米袋大人”。
