audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    emperor:
      display_name: 黄帝
      tts:
        delivery: 果断沉着，面对危难时坚定不移
        timbre: 宽厚明朗的成年男声
        pace: 稳健从容
        pitch: 中低音
    empress:
      display_name: 皇后
      tts:
        delivery: 端庄温和，惊慌时真切急促
        timbre: 清润的成年女声
        pace: 平稳，情急时加快
        pitch: 中音
    courtier_1:
      display_name: 大臣甲
      tts:
        delivery: 恭谨忠诚，情急时直率
        timbre: 浑厚的成年男声
        pace: 平稳，呼喊时急促
        pitch: 中低音
    courtier_2:
      display_name: 大臣乙
      tts:
        delivery: 谨慎忠诚，惊慌时语气紧迫
        timbre: 清晰的成年男声
        pace: 稍缓，呼喊时加快
        pitch: 中音
  chapters:
    - id: ch01
      title: 雾中的战场
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 指南针的针尖总是朝向北方。如今人人见惯了，谁也不会再把它当成了不起的奇物，可它刚问世时，一定让人惊叹不已。久远以前的中国，还有一种更神奇的发明，那就是指南车。车上立着一个人像，不论整辆车被摆成什么方向，人像都会自己转过身，手始终指向南方。
        - id: ch01-b02
          speaker: narrator
          text: 造出它的，是神话时代三位中国帝王之一的黄帝。他是尤希帝的儿子。黄帝尚未出生，母亲就见过一个奇异的景象，它预示这个孩子将来必成大器。那是一个夏日黄昏。她走进草地散步，为的是吹一吹傍晚的凉风，也看一看满天繁星。忽然，北极星向四面放出一道道耀眼的闪电。没过多久，黄帝便降生了。
        - id: ch01-b03
          speaker: narrator
          text: 黄帝长大后，继承了父亲的王位。他在位之初，叛贼蚩尤一心想要称王，不断挑起战争。蚩尤是个邪恶的术士，长着铁打的头，没有人能够战胜他。黄帝终于率军出征，两军在涿鹿平原上相遇。黄帝英勇进攻，蚩尤却召来浓雾，遮住整个战场。王军迷失方向，在雾里四处乱走。蚩尤便带兵撤退，还嘲笑王军中了他的计。将士们再强壮、再勇敢，也总会让他靠妖术逃掉。
    - id: ch02
      title: 指南车破雾
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 黄帝回到宫中，日夜思索怎样才能制服蚩尤。他不肯就此罢休，琢磨了很久，终于造出一辆车，车上的人像永远指着南方。那时还没有指南针，有了这辆指南车引路，黄帝再也不怕蚩尤用浓雾迷惑将士了。
        - id: ch02-b02
          speaker: narrator
          text: 黄帝再次宣战，将指南车放在军队最前面，率兵奔向战场。恶战打响后，王军逼得叛军节节后退。蚩尤又大声念起古怪的咒语，召来铺天盖地的浓雾。可这一回，没有一个将士在意浓雾，也没有一个人慌乱。黄帝只要看着指南车，就能认清去路。他指挥大军时一步也没有走错，一路紧追叛军，直到一条大河挡住去路。
        - id: ch02-b03
          speaker: narrator
          text: 洪水涨满河道，王军根本无法通过。蚩尤却靠妖术带军过河，躲进对岸的堡垒。黄帝眼看就要追上他，却让河水拦住，失望得几乎发狂。那时世上还没有船，他毫无办法，只好命人在附近最舒适的地方扎下帐篷。
    - id: ch03
      title: 一片叶子和第一条船
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天，黄帝走出帐篷，在附近走了一会儿，来到一汪池塘边。他坐在岸上，一心想着眼前的难题。当时正是秋天，水边的树木正在落叶。一片片叶子浮在池面，一会儿飘到这边，一会儿又荡到那边。黄帝忽然看见，水边有一只小蜘蛛，正试着爬上附近的浮叶。它终于爬了上去，叶子很快就载着它漂到池塘另一边。
        - id: ch03-b02
          speaker: narrator
          text: 这一幕提醒了黄帝。叶子既然能把蜘蛛送过池面，他也该试着造一种东西，把自己和所有将士送过大河。黄帝说干就干，一次次试验，碰上困难也不肯停下，终于发明了世上第一条船。他试过之后，确认这条船果然能在水上载人，便命全军一起动手造船。不久，他们造出的船已经足够载下整支大军。
        - id: ch03-b03
          speaker: narrator
          text: 黄帝带着大军渡过河，直攻蚩尤的大本营。他们大获全胜，彻底结束了这场扰乱国家多年的战争。黄帝仍然没有停下来休息。他一直忙碌，直到整个国家重获太平，百姓的生活也富足起来。百姓都爱戴他，在他治下享受了很多年的安宁生活。黄帝还花了许多时间，钻研能够造福百姓的发明。除了船和指南车，他又成功造出许多有用的器物。
    - id: ch04
      title: 黄帝乘龙升天
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 黄帝在位约有一百年。一天，他正抬头望着天空，天色忽然一片通红。有个金光闪闪的东西，正从高处向大地降下。那东西越来越近，黄帝看清了，原来是一条巨龙。巨龙来到面前，低头向他行礼。皇后和群臣吓得尖声大叫，纷纷逃走。黄帝却笑了笑，叫他们留步。
        - id: ch04-b02
          speaker: emperor
          text: 不用害怕。这是上天派来的使者。我在人间的时日已经到头了！
          emotion: calm
        - id: ch04-b03
          speaker: narrator
          text: 黄帝说完，登上龙背。巨龙立刻向天空升去。皇后和群臣见了，一齐追上前去，放声高喊。
        - id: ch04-b04
          speakers: [empress, courtier_1, courtier_2]
          ensemble: chorus
          text: 等一等！我们也想跟您一起去！
          emotion: surprised
        - id: ch04-b05
          speaker: narrator
          text: 他们抓住龙须，争着往龙背上爬。可巨龙无法驮载那么多人。有几个人一直攀着龙须，巨龙起飞时，龙须被他们拽掉，他们也重重地跌回地面。这时，皇后和几位大臣已经在龙背上坐稳。巨龙越飞越高，很快就消失在天边。留在宫里的人满心失望，再也看不见他们了。
        - id: ch04-b06
          speaker: narrator
          text: 又过了一会儿，一张弓和一支箭从天上落下，掉进宫廷的院子。人们认出来，那正是黄帝生前用过的弓箭。大臣们小心地将它们拾起，当作圣物，一直供奉在宫中。
