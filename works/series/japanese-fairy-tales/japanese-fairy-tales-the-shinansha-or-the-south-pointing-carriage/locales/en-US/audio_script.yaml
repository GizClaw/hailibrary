  chapters:
    - id: ch01
      title: The Wonder of the Shinansha
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A compass needle always points north. We see compasses so often that no one finds them remarkable now. But when the compass was first invented, it must have seemed like a wonder.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Long ago in China, there was an even more wonderful invention called the shinansha. It was a chariot carrying the figure of a man. However the chariot turned, the figure turned too, always pointing south.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Its inventor was Kotei, one of the three Chinese emperors from the age of myth. He was the son of Emperor Yuhi. Before Kotei was born, his mother had a vision that foretold he would become a great man.
        - id: ch01-b04
          speaker: narrator
          text: >-
            One summer evening, she went walking through the meadows. She enjoyed the cool breeze that came at the end of the day and gazed at the star-filled sky. As she watched the North Star, it suddenly sent vivid flashes of lightning in every direction. Soon afterward, Kotei came into the world.
        - id: ch01-b05
          speaker: narrator
          text: >-
            In time, Kotei grew into a man and succeeded his father as emperor. But the beginning of his reign was troubled by a rebel named Shiyu. Shiyu wanted to make himself king, and he fought many battles to seize the throne. He was also a wicked magician with an iron head, and no man could defeat him.
    - id: ch02
      title: Lost in the Fog
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            At last, Kotei declared war on the rebel and led his army into battle. The two armies met on the plain of Takuroku. Kotei attacked boldly, but Shiyu called down a thick fog over the battlefield.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The emperor's soldiers wandered through the mist, confused and unable to find their way. While they struggled to tell one direction from another, Shiyu withdrew with his troops. He laughed because he had fooled the royal army. Kotei's soldiers could be as strong and brave as any men alive, yet the rebel's magic always helped him escape in the end.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Kotei returned to his palace and thought deeply about how to conquer the magician. He would not give up. After a long while, he invented the shinansha. In those days there were no compasses, so he placed upon a chariot the figure of a man that always pointed south. Now, even in Shiyu's fog, the emperor would know the way.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Kotei declared war again. He put the shinansha at the front of his army and led his soldiers back to the battlefield.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The fighting began in earnest, and the royal troops drove the rebels back. Then Shiyu shouted strange words, and once more a heavy fog dropped over the field.
        - id: ch02-b06
          speaker: narrator
          text: >-
            This time, not one soldier was troubled or confused. Kotei watched the shinansha and directed his army without a mistake. His men pursued the rebels closely and drove them all the way to a great river.
    - id: ch03
      title: The First Boat
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Floodwater had swollen the river, and Kotei and his men found it impossible to cross. Shiyu used his magic to pass quickly over with his own army. Then he shut himself inside a fortress on the opposite bank, beyond the emperor's reach.
        - id: ch03-b02
          speaker: narrator
          text: >-
            With his advance cut off, Kotei was bitterly disappointed. He had almost caught the rebel, only to be stopped by the river. There were no boats in those days, so for the moment he could do nothing. He ordered his tent to be raised in the pleasantest place the country around him could offer.
        - id: ch03-b03
          speaker: narrator
          text: >-
            One day, Kotei left his tent and walked until he came to a pond. He sat on the bank, deep in thought.
        - id: ch03-b04
          speaker: narrator
          text: >-
            It was autumn, and leaves fell from the trees beside the water. They drifted back and forth across the pond. After a while, Kotei noticed a spider at the water's edge. The tiny creature was trying to climb onto a floating leaf. At last it succeeded, and the leaf carried it across the pond.
        - id: ch03-b05
          speaker: narrator
          text: >-
            That small sight gave the clever emperor an idea. Perhaps he could make something that would carry him and his soldiers across the river, just as the leaf had carried the spider across the pond. He set to work. He kept trying and would not give up until at last he invented the first boat.
        - id: ch03-b06
          speaker: narrator
          text: >-
            When the boat proved successful, Kotei ordered all his men to build more. Before long, they had enough for the entire army.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Kotei took his soldiers across the river and attacked Shiyu's stronghold. He won a complete victory and ended the war that had troubled his country for so long.
    - id: ch04
      title: The Emperor's Long Peace
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The wise and good emperor did not rest until peace and prosperity filled his land. His people loved him, and for many long years they enjoyed the happiness of peace under his rule.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Kotei spent much of his time making inventions that would help his people. He succeeded again and again. The boat and the south-pointing shinansha were only two of the many things he created for their benefit.
        - id: ch04-b03
          speaker: narrator
          text: >-
            He had ruled for about a hundred years when, one day, he looked up and saw the sky suddenly turn red. Something glittering like gold came down toward the earth. As it drew closer, Kotei saw that it was a great Dragon.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The Dragon came before the emperor and bowed its head. The Empress and the courtiers were terrified. They ran away, screaming.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Kotei only smiled and called for them to stop.
        - id: ch04-b06
          speaker: kotei
          text: >-
            Do not be afraid. This is a messenger from Heaven. My time here is finished!
          emotion: calm
        - id: ch04-b07
          speaker: narrator
          text: >-
            Then Kotei climbed onto the Dragon, and it began to rise toward the sky.
    - id: ch05
      title: The Journey to Heaven
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            When the Empress and the courtiers saw the emperor leaving, they all cried out together.
        - id: ch05-b02
          speakers: [empress, courtier_1, courtier_2]
          ensemble: chorus
          text: >-
            Wait! We want to come with you!
        - id: ch05-b03
          speaker: narrator
          text: >-
            They ran to the Dragon, seized its beard, and tried to climb onto its back. But there were too many of them for the Dragon to carry. Several clung so tightly to its beard that, when it rose, the hair pulled free and they fell to the ground.
        - id: ch05-b04
          speaker: narrator
          text: >-
            The Empress and a few courtiers were safely seated on the Dragon's back. It flew so high into the heavens that the disappointed people left at the palace soon lost sight of them.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Some time later, a bow and an arrow dropped from the sky into the palace courtyard. Everyone recognized them as the bow and arrow that had belonged to Emperor Kotei. The courtiers carefully gathered them up and preserved them in the palace as sacred relics.
