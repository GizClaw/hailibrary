  chapters:
    - id: ch01
      title: The Golden Boy of the Mountains
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago, a brave soldier named Kintoki lived in Kyoto. He fell in love with a beautiful lady, and they married. Before long, some of his friends turned against him. Their malice brought him into disgrace at Court, and he was dismissed from his place there. The misfortune never left his thoughts. It weighed so heavily on him that he did not live for long afterward. When Kintoki died, his beautiful young wife was left alone to face the world.
        - id: ch01-b02
          speaker: narrator
          text: >-
            She feared her husband's enemies, so she fled to the Ashigara Mountains. Deep in those lonely forests, where hardly anyone but woodcutters ever came, she gave birth to a boy. She named him Kintaro, the Golden Boy.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Kintaro had astonishing strength. The older he grew, the stronger he became. By the time he was eight, he could cut down trees as quickly as the woodcutters. His mother gave him a large ax of his own, and he began going into the forest to work beside them. The woodcutters called him the Wonder-child. They called his mother the Old Nurse of the Mountains, because none of them knew that she was a lady of high rank. When Kintaro was not cutting trees, one of his favorite games was smashing rocks and stones. Just imagine how strong he was.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Kintaro was not like other boys. He grew up all alone in the mountain wilds, with no children to play with and no ordinary companions. Instead, he befriended the animals around him. He listened until he learned to understand their strange talk, and before long he could speak it himself. Little by little, all the creatures grew quite tame with him. They looked upon Kintaro as their master, and he trusted them to serve as his helpers and carry his messages through the forest. His closest and most faithful followers were Bear, Deer, Monkey, and Hare.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Bear often brought her cubs to romp with him. When she came to take them home, Kintaro climbed onto her back and rode with her to the cave. He loved Deer too. He would wrap his arms around Deer's neck to show that those long horns did not frighten him. What fun they all had together.
    - id: ch02
      title: The Wrestling Match
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            One day, Kintaro climbed into the mountains as usual. Bear, Deer, Monkey, and Hare followed him. They walked uphill and down through the valleys, crossing rough ground. Then, all at once, they stepped onto a broad grassy plain filled with pretty wildflowers.
        - id: ch02-b02
          speaker: narrator
          text: >-
            It was just the place for a grand romp. Deer rubbed his horns against a tree. Monkey scratched his back. Hare smoothed his long ears, and Bear gave a pleased grunt.
        - id: ch02-b03
          speaker: kintaro
          text: This is a fine place for a game. How about a wrestling match?
        - id: ch02-b04
          speaker: narrator
          text: Bear was the biggest and oldest, so she answered for the others.
        - id: ch02-b05
          speaker: bear
          text: That sounds like great fun. I'm the strongest animal, so I'll build the wrestling platform.
          emotion: happy
        - id: ch02-b06
          speaker: narrator
          text: She eagerly dug up the earth and patted it into shape.
        - id: ch02-b07
          speaker: kintaro
          text: All right. You can wrestle one another while I watch. Whoever wins each round will get a prize.
        - id: ch02-b08
          speaker: bear
          text: Oh, what fun! We'll all do our best to win it.
          emotion: happy
        - id: ch02-b09
          speaker: narrator
          text: Deer, Monkey, and Hare helped Bear raise the platform. When it was ready, Kintaro called everyone together.
        - id: ch02-b10
          speaker: kintaro
          text: Let the games begin! Monkey and Hare will go first, and Deer will be the umpire. Deer, the match is in your hands.
        - id: ch02-b11
          speaker: deer
          text: He, he! I'll be the umpire. Monkey and Hare, if you're ready, come take your places on the platform.
        - id: ch02-b12
          speaker: narrator
          text: Monkey and Hare hopped nimbly onto the platform. Deer stood between them.
        - id: ch02-b13
          speaker: deer
          text: Red-back! Are you ready?
        - id: ch02-b14
          speaker: narrator
          text: That was his name for Monkey, since monkeys in Japan have red backs. Then Deer turned to Hare.
        - id: ch02-b15
          speaker: deer
          text: Long-ears! Are you ready?
        - id: ch02-b16
          speaker: narrator
          text: The two little wrestlers faced each other. Deer held a leaf high in the air. The moment he dropped it, Monkey and Hare charged, both shouting, "Yoisho, yoisho!"
        - id: ch02-b17
          speaker: narrator
          text: As they struggled, Deer cheered them on and warned them whenever one pushed the other close to the edge.
        - id: ch02-b18
          speaker: deer
          text: Red-back, hold your ground!
        - id: ch02-b19
          speaker: bear
          text: Long-ears, stay strong! Don't let Monkey beat you!
        - id: ch02-b20
          speaker: narrator
          text: Their friends' cries made both wrestlers try harder than ever. At last Hare began to overpower Monkey. Monkey seemed to trip. Hare gave him one firm push, and Monkey went flying off the platform.
        - id: ch02-b21
          speaker: narrator
          text: Poor Monkey sat up and rubbed his back. His face grew terribly long, and he screamed in anger.
        - id: ch02-b22
          speaker: monkey
          text: Oh! My back! It hurts, it hurts!
          emotion: angry
        - id: ch02-b23
          speaker: narrator
          text: Deer saw him lying there and raised the leaf.
        - id: ch02-b24
          speaker: deer
          text: The round is over. Hare wins!
        - id: ch02-b25
          speaker: narrator
          text: Kintaro opened his lunch box, took out a rice dumpling, and handed it to Hare.
        - id: ch02-b26
          speaker: kintaro
          text: Here's your prize. You earned it!
        - id: ch02-b27
          speaker: narrator
          text: Monkey got up looking very cross. As people say in Japan, his stomach stood up. He did not believe Hare had beaten him fairly.
        - id: ch02-b28
          speaker: monkey
          text: That wasn't a fair win. My foot slipped, and that's why I fell. Please give me one more chance. Let Hare wrestle me again.
          emotion: angry
        - id: ch02-b29
          speaker: narrator
          text: Kintaro agreed, and Monkey and Hare took their places for another round. Everyone knows that monkeys are cunning by nature. Monkey was determined to get the better of Hare this time if he possibly could. He thought the safest plan would be to catch hold of one of Hare's long ears. Before long, he managed it and pulled hard. The pain caught Hare completely off guard. Monkey saw his chance, seized one of Hare's legs, and sent him sprawling across the middle of the platform.
        - id: ch02-b30
          speaker: narrator
          text: Now Monkey was the winner. Kintaro gave him a rice dumpling, and Monkey was so pleased that he forgot all about his sore back.
        - id: ch02-b31
          speaker: narrator
          text: Next, Deer asked whether Hare was ready to wrestle again, this time against him. Hare agreed, and Bear stepped forward to be the umpire. Deer had long horns, and Hare had long ears. They must have looked very funny as they grappled.
        - id: ch02-b32
          speaker: narrator
          text: Suddenly Deer went down on one knee. Bear lifted the leaf high and declared him beaten. After that, the little party went on with match after match. Sometimes one wrestler conquered, and sometimes another did. They kept themselves happily amused on the grassy plain until every one of them was tired.
        - id: ch02-b33
          speaker: kintaro
          text: That's enough for today. We've found a wonderful place to wrestle, so let's come back tomorrow. Now it's time to go home. Come along!
        - id: ch02-b34
          speaker: narrator
          text: Kintaro led the way, and the animals followed.
    - id: ch03
      title: A Bridge Across the River
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            After they had gone some distance, they came out on the bank of a river flowing through a valley. Kintaro and his four furry friends stopped and looked all around for a way across, but there was no bridge anywhere. The river went rushing on its way with a sound of "don, don." The animals grew serious as they watched the water. They wondered how they could cross the stream and still get home that evening.
        - id: ch03-b02
          speaker: kintaro
          text: Wait here. I'll make you a good bridge in just a few minutes.
        - id: ch03-b03
          speaker: narrator
          text: Bear, Deer, Monkey, and Hare watched to see what he would do. Kintaro went from tree to tree along the bank. At last, he stopped beside a huge one growing right at the water's edge.
        - id: ch03-b04
          speaker: narrator
          text: He gripped the trunk with both hands and pulled with all his might. Once. Twice. Three times! On the third pull, Kintaro's tremendous strength tore the roots free from the earth. The great tree gave a loud "meri, meri," a crash and a crack, and toppled all the way across the river. It landed in just the right place and made an excellent bridge over the rushing stream.
        - id: ch03-b05
          speaker: kintaro
          text: There! What do you think of my bridge? It's perfectly safe. Follow me.
        - id: ch03-b06
          speaker: narrator
          text: He crossed first, and all four animals came after him. They had never seen anyone so strong.
        - id: ch03-b07
          speakers: [bear, deer, monkey, hare]
          ensemble: chorus
          text: How strong he is! How strong he is!
          emotion: surprised
        - id: ch03-b08
          speaker: narrator
          text: >-
            While all this was happening, a woodcutter stood on a rock overlooking the river. From there, he had seen everything below. He watched Kintaro and his animal companions with growing amazement. When the boy pulled up that huge tree by its roots and threw it across the stream for a bridge, the woodcutter could hardly believe it. He rubbed his eyes and looked again to make sure he was not dreaming.
        - id: ch03-b09
          speaker: narrator
          text: By his clothes, he certainly looked like a woodcutter. He marveled at what he had witnessed and spoke to himself.
        - id: ch03-b10
          speaker: sadamitsu
          text: This is no ordinary child. Whose son could he be? I'll learn the answer before the day is over.
        - id: ch03-b11
          speaker: narrator
          text: >-
            He hurried after the strange party and crossed their bridge. Kintaro had no idea that anyone was following him. On the far side, the animals returned to their dens in the woods, and Kintaro went home to his waiting mother.
        - id: ch03-b12
          speaker: narrator
          text: His cottage stood like a matchbox in the heart of the pine forest. As soon as Kintaro stepped inside, he greeted his mother.
        - id: ch03-b13
          speaker: kintaro
          text: Okkasan, I'm home!
        - id: ch03-b14
          speaker: mother
          text: Oh, Kimbo!
          emotion: happy
        - id: ch03-b15
          speaker: narrator
          text: His mother smiled brightly, glad that her boy was safe after his long day.
        - id: ch03-b16
          speaker: mother
          text: You're so late today. I was afraid something had happened. Where have you been all this time?
        - id: ch03-b17
          speaker: kintaro
          text: I took Bear, Deer, Monkey, and Hare into the hills. I had them hold a wrestling match to see who was strongest. We had such fun that we're going back tomorrow for another one.
        - id: ch03-b18
          speaker: mother
          text: Then tell me, who is the strongest of you all?
        - id: ch03-b19
          speaker: narrator
          text: She pretended not to know.
        - id: ch03-b20
          speaker: kintaro
          text: Oh, Mother! Don't you know I'm the strongest? There was no reason for me to wrestle any of them.
        - id: ch03-b21
          speaker: mother
          text: Then who is strongest after you?
        - id: ch03-b22
          speaker: kintaro
          text: Bear comes next.
        - id: ch03-b23
          speaker: mother
          text: And who comes after Bear?
        - id: ch03-b24
          speaker: kintaro
          text: That's hard to say. Deer, Monkey, and Hare all seem about equally strong.
        - id: ch03-b25
          speaker: narrator
          text: Suddenly, a voice outside startled Kintaro and his mother.
        - id: ch03-b26
          speaker: sadamitsu
          text: Listen, little boy! The next time you go to wrestle, take this old man along. He would like to join the fun too!
        - id: ch03-b27
          speaker: narrator
          text: >-
            It was the old woodcutter who had followed Kintaro all the way from the river. He slipped off his wooden clogs and walked into the cottage. Kintaro and his mother were both taken completely by surprise. They looked at the unexpected visitor in wonder, for neither of them had ever seen him before.
        - id: ch03-b28
          speakers: [mother, kintaro]
          ensemble: duo
          text: Who are you?
          emotion: surprised
        - id: ch03-b29
          speaker: narrator
          text: The woodcutter laughed.
        - id: ch03-b30
          speaker: sadamitsu
          text: Who I am can wait. First, let's find out whose arm is stronger, yours or mine.
        - id: ch03-b31
          speaker: narrator
          text: Kintaro had lived in the forest all his life, so he answered the old man without any ceremony.
        - id: ch03-b32
          speaker: kintaro
          text: We can try if you like. But whoever loses must not get angry.
        - id: ch03-b33
          speaker: narrator
          text: >-
            Kintaro and the woodcutter each held out his right arm, and they clasped hands. For a long time, they wrestled in that position. Kintaro tried to force the old man's arm down, while the old man tried just as hard to bend Kintaro's. But the stranger was very strong, and the two remained evenly matched. At last, the old man stopped and declared that their contest was a draw.
        - id: ch03-b34
          speaker: sadamitsu
          text: >-
            You truly are a powerful child. Few men can match the strength in my right arm. I first saw you by the river a few hours ago, pulling up that great tree to bridge the rushing water. I could hardly believe my eyes, so I followed you home. Now I've tested your arm myself, and I know what I saw was true. When you're grown, you'll surely be the strongest man in all Japan. What a pity that you're hidden away in these wild mountains.
    - id: ch04
      title: The General's Offer
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Then the stranger turned to Kintaro's mother.
        - id: ch04-b02
          speaker: sadamitsu
          text: Mother, have you never thought of taking your son to the Capital? He could learn to carry a sword as a samurai should.
        - id: ch04-b03
          speaker: mother
          text: >-
            It is very kind of you to care about my son. But as you can see, he is wild and has had no education. I fear your plan would be very difficult. He was so strong even as a baby that he hurt everyone who came near him, and that is why I hid him in this unknown place. I have often dreamed of seeing my boy become a knight who wears two swords. But we have no powerful friend to introduce us in the Capital, so I fear that dream can never come true.
        - id: ch04-b04
          speaker: sadamitsu
          text: >-
            You need not worry about that. The truth is, I am no woodcutter. I am Sadamitsu, one of Japan's great generals and a vassal of the mighty Lord Minamoto-no-Raiko. He sent me across the country to find boys with remarkable strength, so they could be trained as soldiers for his army. I disguised myself as a woodcutter to carry out that task.
        - id: ch04-b05
          speaker: sadamitsu
          text: >-
            By great good fortune, I found your son. If you truly want him to become a samurai, I will take him with me. I will present him to Lord Raiko as a young man fit to enter his service. What do you say?
        - id: ch04-b06
          speaker: narrator
          text: >-
            As the kind general slowly revealed his plan, great joy filled the mother's heart. At last, a wonderful chance had appeared. The one wish of her life might really come true. She might live to see Kintaro become a samurai after all. Overcome with gratitude and hope, she bowed her head all the way to the ground before Sadamitsu.
        - id: ch04-b07
          speaker: mother
          text: If you truly mean it, then I place my son in your care.
        - id: ch04-b08
          speaker: narrator
          text: Kintaro had been sitting beside his mother, listening to every word. As soon as she finished, he cried out.
        - id: ch04-b09
          speaker: kintaro
          text: Oh, what joy! I am going with the general, and one day I will be a samurai!
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: >-
            So Kintaro's future was settled, and Sadamitsu decided that they would start for the Capital at once. Of course, Kintaro's mother was deeply sad to part from her boy. He was all that remained to her. Yet, as people say in Japan, she put on a strong face and hid her grief. She knew it was for her son's good that he should leave now. She would not discourage him at the very moment he was setting out into the world.
        - id: ch04-b11
          speaker: narrator
          text: Kintaro promised that he would never forget her. Once he was a knight who wore two swords, he would build her a home and care for her in her old age.
        - id: ch04-b12
          speaker: narrator
          text: >-
            When the animals Kintaro had tamed heard he was leaving, Bear, Deer, Monkey, and Hare came to ask if they could follow him as always. Then they learned that he was going away for good. They walked with him as far as the foot of the mountain to say farewell.
        - id: ch04-b13
          speaker: mother
          text: Kimbo, remember to be a good boy.
        - id: ch04-b14
          speakers: [bear, deer, monkey, hare]
          ensemble: chorus
          text: Mr. Kintaro, we wish you good health on your journey.
        - id: ch04-b15
          speaker: narrator
          text: >-
            The animals climbed a tree for one last look at their friend. From high among the branches, they watched Kintaro and his shadow grow smaller and smaller. At last, he disappeared from sight.
        - id: ch04-b16
          speaker: narrator
          text: Sadamitsu continued on his way, rejoicing that he had found such an extraordinary boy when he least expected it.
    - id: ch05
      title: Kintaro Becomes a Hero
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            When they reached their destination, Sadamitsu took Kintaro straight to Lord Minamoto-no-Raiko. He told his lord all about the child and how he had found him. Lord Raiko was delighted by the story. He ordered Kintaro to be brought before him and immediately made the boy one of his vassals.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Lord Raiko's army was famous for a band known as the Four Braves. The lord chose these warriors himself from among the strongest and bravest soldiers under his command. It was only a small company, and each place in it was carefully given. Yet across the whole of Japan, the Four Braves were known and honored for the fearless courage of their men.
        - id: ch05-b03
          speaker: narrator
          text: >-
            When Kintaro grew into a man, his master made him chief of the Four Braves. He was by far the strongest warrior among them. Soon afterward, news reached the city that a man-eating monster had made its home not far away. Fear spread among the people. Lord Raiko ordered Kintaro to go to their rescue, and Kintaro started at once. He was delighted by the prospect of finally trying his sword against such an enemy.
        - id: ch05-b04
          speaker: narrator
          text: He took the monster by surprise in its den. The fight was soon over. Kintaro cut off its enormous head and carried it back to his master in triumph.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Kintaro became the greatest hero in his country. Power, honor, and wealth came to him. And he kept his promise. He built a comfortable home for his old mother, and she lived happily with him in the Capital for the rest of her days.
        - id: ch05-b06
          speaker: narrator
          text: Is that not the story of a great hero?
