audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    kintaro:
      display_name: 金太郎
      tts:
        delivery: 爽朗直率，充满山野少年的自信和活力
        timbre: 清亮结实的男孩声
        pace: 明快自然
        pitch: 中高音
    mother:
      display_name: 金太郎的母亲
      tts:
        delivery: 温柔端庄，喜悦与离愁都含蓄真切
        timbre: 柔和清润的成年女声
        pace: 从容舒缓
        pitch: 中音
    bear:
      display_name: 熊
      tts:
        delivery: 热心豪爽，带着年长伙伴的笃定
        timbre: 厚实温暖的成年女声
        pace: 稍缓有力
        pitch: 中低音
    deer:
      display_name: 鹿
      tts:
        delivery: 认真机敏，主持比赛时响亮利落
        timbre: 清朗的成年男声
        pace: 平稳明快
        pitch: 中音
    monkey:
      display_name: 猴子
      tts:
        delivery: 好胜灵活，委屈或得意时反应鲜明
        timbre: 尖亮灵巧的成年男声
        pace: 偏快
        pitch: 中高音
    hare:
      display_name: 兔子
      tts:
        delivery: 轻快敏捷，待人忠实有礼
        timbre: 轻柔清脆的成年男声
        pace: 明快
        pitch: 中高音
    sadamitsu:
      display_name: 贞光
      tts:
        delivery: 豪迈沉着，试探时爽朗，表明身份后郑重可信
        timbre: 浑厚有力的成年男声
        pace: 稳健从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 山中的金童
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，京都有位勇士名叫金时。他爱上一位美丽的姑娘，两人结为夫妻。婚后不久，几个朋友心怀恶意，在背后陷害他，害得金时失去朝廷的官职。这场不幸始终压在他心上，没过多久，他便郁郁而终，只留下年轻的妻子独自面对人世。妻子害怕丈夫的仇敌追来，立刻逃进足柄山。那片森林寂寥无人，平日只有樵夫出没。她在那里生下一个男孩，取名金太郎，也就是“金童”。
        - id: ch01-b02
          speaker: narrator
          text: 金太郎最不寻常的地方，是他天生神力，而且越长大，力气越惊人。八岁时，他砍树已经和樵夫一样快。母亲送给他一把大斧头，他常带着斧头走进森林，帮樵夫们干活。大家不知道母子俩原本身份高贵，只把男孩叫作“神童”，把他的母亲叫作“山中老乳母”。金太郎闲下来还有一种最爱的游戏，就是砸碎岩石。你想，他的力气该有多大！
        - id: ch01-b03
          speaker: narrator
          text: 金太郎与别的孩子很不一样。他独自在荒山里长大，身边没有一个玩伴，便和山中所有的动物交起了朋友。他渐渐听懂了它们奇怪的话，也学会了怎样同它们交谈。日子久了，动物们全都变得温顺，把金太郎当作主人，替他做事、送消息。其中最亲近的四个伙伴，是熊、鹿、猴子和兔子。母熊常带熊宝宝来找他玩，等她来接孩子回家，还会让金太郎骑在背上，一路把他驮到山洞。金太郎也很喜欢鹿，常搂着鹿的脖子，好让大家知道，他一点儿不怕那对长角。伙伴们在一起，总能玩得十分痛快。
        - id: ch01-b04
          speaker: narrator
          text: 一天，金太郎照常上山，四个伙伴跟在身后。他们走过崎岖的山路，一会儿爬坡，一会儿下谷。走了许久，眼前忽然开阔起来，现出一片长满青草的宽阔平地，上面开满了美丽的野花。这里太适合大家一起嬉闹了。鹿高兴地拿角蹭树，猴子搔着后背，兔子理好长耳朵，熊也满意地哼了一声。
        - id: ch01-b05
          speaker: kintaro
          text: 这个地方真不错！咱们来比一场摔跤，怎么样？
        - id: ch01-b06
          speaker: narrator
          text: 熊年纪最大，身材也最魁梧，便替大家回答。
        - id: ch01-b07
          speaker: bear
          text: 那一定有趣极了！我是这里力气最大的动物，摔跤台就让我来修吧。
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: 熊说干就干，起劲地刨开泥土，再一点点把土拍成摔跤台。金太郎在旁边看着，也说出了比赛的规矩。
        - id: ch01-b09
          speaker: kintaro
          text: 你们互相较量，我在旁边看。每一回合获胜的，都能拿到一份奖品。
        - id: ch01-b10
          speaker: bear
          text: 太好啦！那我们可都要努力赢奖品。
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: 鹿、猴子和兔子也一齐动手，帮熊把摔跤台筑起来。不一会儿，供大家较量的台子修好了，金太郎立刻高声宣布比赛开始。

    - id: ch02
      title: 草地上的摔跤赛
      blocks:
        - id: ch02-b01
          speaker: kintaro
          text: 比赛开始！第一场，猴子对兔子，鹿来当裁判。鹿先生，这一场交给你了！
        - id: ch02-b02
          speaker: deer
          text: 嘿，没问题！猴子先生、兔子先生，你们准备好了，就请上台站好。
        - id: ch02-b03
          speaker: narrator
          text: 猴子和兔子轻巧地跳上台。鹿站在他们中间，先朝猴子喊话。日本猴子的背是红色的，所以鹿叫他“红背”。
        - id: ch02-b04
          speaker: deer
          text: 红背！红背！准备好了吗？长耳朵！长耳朵！你也准备好了吗？
        - id: ch02-b05
          speaker: narrator
          text: 两个小摔跤手面对面站好。鹿把一片叶子高高举起，当作开赛的信号。叶子一落，猴子和兔子立刻高喊“嘿哟！嘿哟！”，猛扑过去，扭在了一起。他们一会儿把对方推到台边，一会儿又险些被对方挤下去，随时都可能跌到台外。鹿一会儿鼓劲，一会儿大声提醒他们。
        - id: ch02-b06
          speaker: deer
          text: 红背，守住脚下！可别退出台子！
        - id: ch02-b07
          speaker: bear
          text: 长耳朵，使劲儿！稳住，别让猴子胜过你！
        - id: ch02-b08
          speaker: narrator
          text: 两个伙伴听见朋友们鼓劲，都使出了浑身力气，拼命想把对方摔倒。兔子渐渐占了上风。猴子脚下似乎绊了一下，兔子抓住机会，用力一推，猴子便翻着跟头飞下了台。
        - id: ch02-b09
          speaker: monkey
          text: 哎哟！我的背好痛——痛死我了！
          emotion: angry
        - id: ch02-b10
          speaker: narrator
          text: 猴子坐在地上揉着后背，脸拉得老长。鹿举起叶子，宣布结果。
        - id: ch02-b11
          speaker: deer
          text: 这一回合结束，兔子获胜！
        - id: ch02-b12
          speaker: narrator
          text: 金太郎打开午饭盒，取出一只饭团递给兔子。
        - id: ch02-b13
          speaker: kintaro
          text: 这是你的奖品。你赢得光明正大！
        - id: ch02-b14
          speaker: narrator
          text: 猴子站起来，满脸不服气。照日本人的说法，他“肚子都气得竖起来了”。他觉得自己不算真正输了。
        - id: ch02-b15
          speaker: monkey
          text: 刚才是我的脚滑了一下，才会摔下去。再给我一次机会，让我和兔子重新比一回吧！
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: 金太郎答应了，兔子和猴子重新站上摔跤台。猴子天生机灵又狡猾，这次一心想要取胜。他认定最稳妥的办法，就是抓住兔子的长耳朵。不一会儿，果然让他得了手。耳朵被狠狠一扯，兔子痛得乱了阵脚。猴子抓住机会，又攥住他一条腿，把他摔得四脚朝天，正好倒在台子中央。这一回，猴子成了胜者，也从金太郎手里赢到一个饭团。他顿时高兴起来，连后背的疼也忘了。
        - id: ch02-b17
          speaker: narrator
          text: 接着，鹿走过来，问兔子还愿不愿意再比一回，这次和自己较量。兔子答应了，两个伙伴一同站好，熊便走到台前担任裁判。一个长着长角，一个竖着长耳朵，这场古怪的比赛，在旁边的人看来实在有趣。忽然，鹿单膝跪地，熊立刻举起叶子，宣布鹿输了。伙伴们就这样你赢一场、我胜一回，轮流较量，一直玩到精疲力尽。
        - id: ch02-b18
          speaker: kintaro
          text: 今天就到这里吧。咱们找到了一处多好的摔跤场！明天再来。现在一起回家，走吧！

    - id: ch03
      title: 拔树为桥
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 金太郎领着伙伴们往回走。走了一段路，他们来到山谷中的一条河边。大家站在岸上，四处寻找过河的办法，可那里连一座桥也没有。河水咚咚作响，奔流不息。四个动物都严肃起来，不知道怎样才能渡过急流，在天黑前赶回家。
        - id: ch03-b02
          speaker: kintaro
          text: 等我一会儿。用不了几分钟，我就给大家造一座结实的桥。
        - id: ch03-b03
          speaker: narrator
          text: 四个伙伴一齐望着他，都想看看他这次有什么办法。金太郎沿河岸走过一棵又一棵树，最后停在水边一棵十分高大的树前。他抱紧树干，使出全身力气，一拔，两拔，三拔！第三下，金太郎那股神力终于让树根松脱。只听喀啦喀啦一阵巨响，大树轰然倒下，正好横过河面，成了一座再好不过的桥。
        - id: ch03-b04
          speaker: kintaro
          text: 瞧，我这座桥怎么样？牢靠得很，大家跟我过来吧。
        - id: ch03-b05
          speaker: narrator
          text: 金太郎第一个走过河，四个伙伴跟在后面。它们从没见过力气这么大的人，忍不住一齐惊叹。
        - id: ch03-b06
          speakers: [bear, deer, monkey, hare]
          ensemble: chorus
          text: 他的力气真大！真大呀！
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: 这时，一个樵夫正站在高处的岩石上，那里恰好能俯瞰河流，河边发生的事全让他看见了。他惊奇地望着金太郎和他的动物伙伴。等他看到一个孩子连根拔起大树，再把树推过河去当桥，惊讶得揉了又揉眼睛，生怕自己是在做梦。从衣着看，那人确实像个樵夫。他对眼前的一切惊叹不已，暗自想道。
        - id: ch03-b08
          speaker: sadamitsu
          text: 这绝不是普通的孩子。他是谁家的儿子？天黑以前，我一定要查个明白。
        - id: ch03-b09
          speaker: narrator
          text: 樵夫赶紧追上这支奇特的队伍，跟在他们后面过了桥。金太郎对此毫不知情，哪里想得到有人正悄悄跟着自己。到了对岸，他便和伙伴们分手。动物各自回到林中的巢穴，他则回去见等候自己的母亲。那座小屋藏在松林深处，看起来就像一只小小的火柴盒。金太郎一进门，便去向母亲问好。
        - id: ch03-b10
          speaker: kintaro
          text: 阿母，我回来啦！
        - id: ch03-b11
          speaker: mother
          text: 啊，金坊！你今天怎么回来得这么晚？我一直担心你出了什么事。你们都到哪里去了？
        - id: ch03-b12
          speaker: narrator
          text: 儿子在外面玩了整整一天，如今终于平安回家，母亲这才放下心来，脸上露出了明亮的笑容。金太郎也把一天的事讲给她听。
        - id: ch03-b13
          speaker: kintaro
          text: 我带熊、鹿、猴子和兔子上山比摔跤，想看看谁的力气最大。大家玩得可高兴了，明天还要去同一个地方再比一场。
        - id: ch03-b14
          speaker: mother
          text: 那你说说看，他们当中谁最强？
        - id: ch03-b15
          speaker: narrator
          text: 母亲明明知道答案，却故意问他。
        - id: ch03-b16
          speaker: kintaro
          text: 阿母，您还不知道吗？当然是我最强。我根本不用和他们比！
        - id: ch03-b17
          speaker: mother
          text: 那么除了你以外，谁的力气最大？
        - id: ch03-b18
          speaker: kintaro
          text: 接下来就是熊。
        - id: ch03-b19
          speaker: mother
          text: 熊后面又是谁呢？
        - id: ch03-b20
          speaker: kintaro
          text: 那可不好说。鹿、猴子和兔子的力气好像都差不多。

    - id: ch04
      title: 樵夫的真实身份
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 母子俩正说着话，屋外突然传来一个声音，把他们都吓了一跳。
        - id: ch04-b02
          speaker: sadamitsu
          text: 小家伙，下一次去比摔跤，也带上我这个老头儿吧！我也想凑个热闹。
        - id: ch04-b03
          speaker: narrator
          text: 原来是从河边一路跟来的老樵夫。他脱下脚上的木屐，径直走进屋里。山姥和金太郎都吃了一惊，诧异地打量着这个突然闯进门来的陌生人，确信自己从来没见过他。
        - id: ch04-b04
          speakers: [mother, kintaro]
          ensemble: duo
          text: 你是谁？
          emotion: surprised
        - id: ch04-b05
          speaker: narrator
          text: 樵夫哈哈大笑。
        - id: ch04-b06
          speaker: sadamitsu
          text: 我是谁，现在还不重要。咱们先比比看，是这孩子的胳膊有力，还是我的胳膊更强？
        - id: ch04-b07
          speaker: narrator
          text: 金太郎一直住在森林里，不懂客套，便直截了当地回答。
        - id: ch04-b08
          speaker: kintaro
          text: 您想比，咱们就试试。不过不管谁输，都不许生气。
        - id: ch04-b09
          speaker: narrator
          text: 两人伸出右臂，握紧对方的手，使劲要把对方的手臂压弯。他们较量了很久，老人竟和金太郎势均力敌。最后，老人收回手，宣布这一场算作平手。
        - id: ch04-b10
          speaker: sadamitsu
          text: 你果然力大无穷。只比右臂，很少有人敢说能胜过我！几个钟头前，我在河边第一次看见你。你连根拔起那棵大树，架在急流上当桥。我简直不敢相信自己的眼睛，才一路跟着你来到这里。刚才亲手试过你的臂力，我知道下午没有看错。等你长大，一定会成为全日本力气最大的人。这样的奇才藏在荒山里，实在太可惜了。
        - id: ch04-b11
          speaker: narrator
          text: 老人转向金太郎的母亲。
        - id: ch04-b12
          speaker: sadamitsu
          text: 做母亲的，你没有想过带孩子去京城，让他佩上武士的刀吗？
        - id: ch04-b13
          speaker: mother
          text: 您这样关心我的儿子，实在太好心了。可他就像您看见的一样，不通礼数，也没受过教导。要照您说的做，恐怕十分困难。他还是婴儿时，力气就大得吓人，谁靠近都会被他弄伤。我正是为此，才带他躲进这片无人知晓的地方。我常盼着有一天，能亲眼看见他佩上双刀，成为武士。可我们在京城没有一位有权势的朋友替我们引荐，这个愿望只怕永远也实现不了。
        - id: ch04-b14
          speaker: sadamitsu
          text: 这件事不用发愁。实话告诉你，我根本不是樵夫！我是日本的一员大将，名叫贞光，也是权势显赫的源赖光大人的家臣。大人命我走遍各地，寻找显露出惊人力量的少年，好把他们训练成军中的武士。我想，扮成樵夫最方便四处寻访。没想到运气这样好，竟让我意外遇见你的儿子。你若真想让他成为武士，我就带他去见赖光大人，举荐他做大人的家臣。你愿意吗？
        - id: ch04-b15
          speaker: narrator
          text: 这位好心的将军把自己的打算一层层说了出来。母亲听着听着，心里便装满了喜悦。她一生最大的愿望，就是在离世前亲眼看见金太郎成为武士，如今终于有了实现的绝好机会。她把头一直俯到地面。
        - id: ch04-b16
          speaker: mother
          text: 您若真心愿意帮他，我就把儿子托付给您。
        - id: ch04-b17
          speaker: narrator
          text: 金太郎一直坐在母亲身边听着。这时，他再也忍不住欢呼起来。
        - id: ch04-b18
          speaker: kintaro
          text: 太好啦！我要跟将军一起走了。将来我也会成为武士！
          emotion: happy
        - id: ch04-b19
          speaker: narrator
          text: 金太郎的命运就这样定了。贞光决定立刻带他动身去京城。山姥只有这一个亲人，要和儿子分别，心中自然万分不舍。可是，照日本人的说法，她摆出一副坚强的面容，把悲伤藏了起来。她知道，儿子现在离开自己，是为了他的前程。孩子正要踏上旅途，她绝不能让他泄气。金太郎答应永远不忘母亲。等他佩上双刀、成为武士，便要为她建一座房子，奉养她安度晚年。
        - id: ch04-b20
          speaker: narrator
          text: 熊、鹿、猴子和兔子听说他要走，都赶来问能不能照旧跟在身边。得知金太郎这一走便不再回来，它们一直送到了山脚。
        - id: ch04-b21
          speaker: mother
          text: 金坊，到了外面，一定要做个好孩子。
          emotion: sad
        - id: ch04-b22
          speakers: [bear, deer, monkey, hare]
          ensemble: chorus
          text: 金太郎先生，愿您一路平安，身体康健。
        - id: ch04-b23
          speaker: narrator
          text: 四个伙伴全都爬上树，想再多看他一眼。它们从高处望着金太郎，看着他和他的影子越变越小，直到彻底消失，再也瞧不见了。贞光将军继续赶路。这样意外地找到了金太郎这位奇才，他心中喜悦不已。

    - id: ch05
      title: 四天王之首
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 两人到了京城，贞光立刻带金太郎拜见主人源赖光。他把金太郎的来历，还有自己怎样发现这个孩子的经过，全都一一讲明。赖光听得十分欢喜，命人把金太郎带到面前，当即收他做了家臣。
        - id: ch05-b02
          speaker: narrator
          text: 赖光的军中有一支名震天下的队伍，叫作“四天王”。这些武士是他亲自挑选的，每个人都来自部下中最勇猛、最强健的那一群。队伍人数虽然不多，个个却都是百里挑一的精锐。他们凭着无畏的勇气，早已闻名全日本。
        - id: ch05-b03
          speaker: narrator
          text: 金太郎长大成人以后，主人任命他为四天王之首。他的力气远胜另外三人。不久，京城传来消息，说附近住进了一个吃人的妖怪，百姓都吓得惶恐不安。赖光命金太郎前去除妖。想到终于能试试自己的刀，金太郎满心欢喜，接到命令便立刻出发。
        - id: ch05-b04
          speaker: narrator
          text: 金太郎赶到妖怪的巢穴，趁它毫无防备，没费多少工夫便斩下那颗硕大的头颅。他带着妖怪的头得胜回京，把它献给主人。从此，金太郎成了全国最伟大的英雄，权势、荣誉和财富也纷纷来到他身边。
        - id: ch05-b05
          speaker: narrator
          text: 金太郎没有忘记当年的诺言。他为年迈的母亲建起一座舒适的房子，把她接到京城，亲自照料她的生活。母子俩幸福地住在一起，母亲也在儿子身边安度晚年，直到走完一生。
        - id: ch05-b06
          speaker: narrator
          text: 这不正是一位大英雄的故事吗？
