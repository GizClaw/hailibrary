  chapters:
    - id: ch01
      title: A Story of Old Japan
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long years ago, in Japan's remote province of Echigo, a man and his wife lived with their little daughter. The child was the pride and joy of both their lives. They looked to her as an endless source of happiness in the years ahead.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Every step of her childhood was written in golden letters in their memories. When she was thirty days old, her mother carried her to the temple in a ceremonial kimono and placed her under the care of the family's household god. Then came her first Dolls' Festival, when her parents gave her dolls and tiny belongings that they added to each year. On her third birthday, they tied her first broad sash of scarlet and gold around her waist. It marked the end of infancy and the beginning of girlhood.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Now she was seven. She could talk with her parents and help them in the little ways they loved. Their happiness seemed complete. Nowhere in the island empire could there have been a happier family.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Then one day, excitement filled the house. The father had suddenly been called to Kyoto on business. Today, with railways and jinrickshas and other quick ways to travel, it is hard to imagine what the journey from Matsuyama to the capital meant then. The roads were rough and difficult. Ordinary people walked every mile, whether the distance was one hundred miles or several hundred. Going to the capital was as great an undertaking for them as a voyage from Japan to Europe would be in later times.
        - id: ch01-b05
          speaker: narrator
          text: >-
            His wife anxiously helped him prepare. She wished she could go too, but the road was far too hard for her and the child, and someone had to care for their home. At last everything was ready. The husband stood in the porch with his little family around him.
        - id: ch01-b06
          speaker: father
          text: >-
            Please don't worry. I'll be home soon. While I'm gone, take care of everything, especially our little girl.
        - id: ch01-b07
          speaker: mother
          text: >-
            We will manage. But you must look after yourself, and come back to us without losing a single day.
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: >-
            Tears streamed from the mother's eyes. Only the little girl smiled. She knew nothing of the pain of parting, and thought a trip to the capital was no different from one of her father's walks to the next village. She ran to him and caught his long sleeve, holding him for one more moment.
        - id: ch01-b09
          speaker: daughter
          text: >-
            Father, I'll be very good until you come home. Please bring me a present.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The father looked once more at his weeping wife and his eager, smiling child. Leaving them felt as if someone were dragging him backward by the hair. They had never been apart before, and every part of him wanted to stay. Still, the summons was urgent and could not be refused. He had to go. With a great effort, he stopped himself from thinking about the pain of leaving. Then he turned away with determination, hurried down the little garden, and passed through the gate.
        - id: ch01-b11
          speaker: narrator
          text: >-
            His wife lifted the child into her arms and ran to the gate. Together they watched him follow the road between the pines. Soon the haze swallowed everything but his pointed hat. At last, that disappeared too.
        - id: ch01-b12
          speaker: mother
          text: >-
            Now that Father has gone, you and I must look after everything until he returns.
        - id: ch01-b13
          speaker: daughter
          text: >-
            Yes, I'll be very good. When Father comes back, please tell him how good I've been. Then perhaps he'll give me a present.
        - id: ch01-b14
          speaker: mother
          text: >-
            Father will surely bring you something you want very much. I asked him to bring you a doll. Think of him every day, and pray that he travels safely until he comes home.
        - id: ch01-b15
          speaker: daughter
          text: >-
            Oh, yes! I'll be so happy when he comes home again.
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: >-
            The child clapped her hands, and her face shone at the thought. As her mother watched, she felt her love for the girl deepen still more.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The mother went to work making winter clothes for all three of them. She spun thread on her simple wooden wheel before weaving the cloth. Between her tasks, she guided the girl's games and taught her to read the old stories of Japan. Work comforted her through the lonely days. Meanwhile, her husband finished his business and began the journey home.
        - id: ch01-b18
          speaker: narrator
          text: >-
            After nearly a month of walking day after day in every kind of weather, he was burned as brown as bronze by the sun. Anyone who did not know him well might have failed to recognize him. His wife and child, however, knew him at a glance. They flew to meet him from opposite sides, and each eagerly caught one of his sleeves. The husband was overjoyed to see that his family was well, and his wife was just as thankful to have him safely home.
        - id: ch01-b19
          speaker: narrator
          text: >-
            It seemed to take forever to untie his straw sandals and remove his broad umbrella hat, even with the mother and child helping. Then he was sitting with them again on the white mats, in the familiar room that had felt so empty without him.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The father opened the bamboo basket he had carried home. First he brought out a beautiful doll and a lacquered box filled with cakes.
        - id: ch01-b21
          speaker: father
          text: >-
            These are for you. They're your reward for taking such good care of Mother and the house while I was away.
        - id: ch01-b22
          speaker: daughter
          text: >-
            Thank you, Father.
          emotion: happy
        - id: ch01-b23
          speaker: narrator
          text: >-
            The child bowed until her head touched the floor. Then she reached out with fingers spread wide like a tiny maple leaf and accepted the treasures. Because they had come from the capital, the doll and the lacquered box were finer than anything she had ever seen. No words could have measured her delight. Her face nearly melted with joy, and for a while she had no eyes, no thoughts, and no interest in anything but her wonderful gifts.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Her father reached into the basket again. This time he took out a square wooden box, carefully tied with red and white cord, and handed it to his wife.
        - id: ch01-b25
          speaker: father
          text: >-
            And this is for you.
        - id: ch01-b26
          speaker: narrator
          text: >-
            His wife opened the box and found a metal disk with a handle. One side shone as brightly as crystal. Pine trees and storks stood in raised designs on the other side, carved so perfectly that they seemed alive. Born and raised in rural Echigo, she had never seen such a thing. She looked into the shining disk, then raised her head in wonder.
        - id: ch01-b27
          speaker: mother
          text: >-
            Someone is looking at me from inside this round thing! What have you given me?
          emotion: surprised
        - id: ch01-b28
          speaker: father
          text: >-
            Why, you're seeing your own face. This is called a mirror. Anyone who looks into its clear surface can see their own reflection. We have none in this distant place, but women in the capital have used them since ancient times.
        - id: ch01-b29
          speaker: father
          text: >-
            A mirror is considered something a woman should have. An old saying tells us, “As the sword is the soul of a samurai, so is the mirror the soul of a woman.” People also say that her mirror shows the state of her heart. If she keeps it bright and clear, her heart is pure and good. The mirror is one of the treasures in the Emperor's insignia. So value yours highly, and handle it with care.
        - id: ch01-b30
          speaker: narrator
          text: >-
            His wife was pleased to learn so many things that were new to her. More than that, she treasured the gift as proof that her husband had remembered her while he was away.
        - id: ch01-b31
          speaker: mother
          text: >-
            If this mirror represents my soul, I will treasure it and never treat it carelessly.
        - id: ch01-b32
          speaker: narrator
          text: >-
            She raised the mirror as high as her forehead in grateful thanks. Then she closed it in its box and put it safely away. Seeing how tired her husband was after his long journey, she immediately began serving the evening meal. She did everything she could to make him comfortable. The little family felt as though they had never known true happiness before that night, simply because they were together again. All evening, the father had story after story to tell about the road he had traveled and the many wonders he had seen in the great capital.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Peaceful years passed in the little home. The parents watched their daughter grow from a child into a beautiful girl of sixteen. They had raised her with constant love and care, as proudly as someone holds a priceless jewel in the palm of a hand. Now every effort they had made was rewarded more than twice over. She brought great comfort to her mother as she moved through the house and took her share of the daily work. Her father was proud each time he looked at her, because day by day she reminded him more of her mother when they had first married.
        - id: ch01-b34
          speaker: narrator
          text: >-
            But nothing in this world lasts forever. The full moon loses its roundness, and flowers bloom only to fade. At last, a great sorrow broke the family's happiness. The gentle wife and mother fell ill.
        - id: ch01-b35
          speaker: narrator
          text: >-
            During the first days of her illness, her husband and daughter believed she had only caught a cold. They were not especially worried. But the days passed, and she did not recover. Instead, she grew steadily worse. Even the doctor was puzzled. He tried everything he knew, yet the poor woman became weaker day after day. Father and daughter were overcome with grief. The girl would not leave her mother's side by day or by night. They gave her all the care and love they could, but nothing they did was able to save her life.
        - id: ch01-b36
          speaker: narrator
          text: >-
            One day, the girl sat near the bed, hiding her pain behind a cheerful smile. Her mother stirred, took her hand, and looked lovingly into her eyes. Breathing was hard now, and each word took effort.
        - id: ch01-b37
          speaker: mother
          text: >-
            My daughter, I know that nothing can save me. When I am gone, promise that you will care for your dear father and grow into a good and dutiful woman.
          emotion: sad
        - id: ch01-b38
          speaker: daughter
          text: >-
            Oh, Mother, please don't speak that way. You only need to hurry and get well. Nothing could make Father and me happier.
          emotion: sad
        - id: ch01-b39
          speaker: mother
          text: >-
            I know how deeply you want me to recover, and that comforts me now. But it cannot be. My earlier life determined that I must die at this time, so I accept what is coming. I have something to give you, so you can remember me after I am gone.
          emotion: calm
        - id: ch01-b40
          speaker: narrator
          text: >-
            Beside her pillow lay a square wooden box tied with a silk cord and tassels. The mother carefully untied it and took out the mirror her husband had given her years before.
        - id: ch01-b41
          speaker: mother
          text: >-
            When you were a small child, your father went to the capital and brought this mirror home for me. Now I give it to you. If you feel lonely after I have left this life and long to see me, take it out. You will always find me in its clear, shining surface.
        - id: ch01-b42
          speaker: mother
          text: >-
            Then you can meet me often and tell me everything in your heart. I won't be able to speak, but whatever happens to you, I will understand and share your feelings.
          emotion: calm
        - id: ch01-b43
          speaker: narrator
          text: >-
            The dying woman placed the mirror in her daughter's hands. Her mind seemed peaceful at last. She sank back without another word, and that day her spirit quietly passed away.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Father and daughter were wild with grief. They felt that it was impossible to say farewell to the woman who had filled both their lives until that day. They could hardly bear to let her body be placed in the earth. In time, that first frantic storm of sorrow passed. Crushed though they were, they took hold of their hearts again and accepted what could not be changed. Even so, the daughter's life felt empty and deserted. Her love for her dead mother never weakened as time went by. Her memories remained so sharp that anything in daily life could awaken them. The sound of falling rain or the wind moving outside would bring back her mother's death and all the things they had loved and shared together.
        - id: ch01-b45
          speaker: narrator
          text: >-
            One day, while her father was away, the girl did her household duties alone. Her loneliness became more than she could bear. She threw herself down in her mother's room and wept as though her heart would break. She wanted one glimpse of that beloved face, one sound of the voice that had called her by a pet name, or just one moment without the ache inside her. Then she suddenly sat up. Her mother's final words had returned to her mind.
        - id: ch01-b46
          speaker: daughter
          text: >-
            Mother said that whenever I looked into the mirror, I could meet her and see her again. I almost forgot her last words. How foolish of me! I'll get the mirror now and find out if it can really be true.
        - id: ch01-b47
          speaker: narrator
          text: >-
            She quickly dried her eyes, went to the cupboard, and took out the box that held the mirror. Her heart beat with expectation as she opened it. She lifted the mirror in both hands and gazed into its smooth, shining face. There before her, her mother's promise seemed to come true. A face looked back from the round mirror. To the girl's joyful surprise, it was not her mother as illness had left her, thin and worn and weak. She saw the young and beautiful woman she remembered from the faraway days of her earliest childhood.
        - id: ch01-b48
          speaker: narrator
          text: >-
            She felt that the face might speak at any moment. The eyes looked back so earnestly that she could almost hear her mother telling her once more to be a good woman and a dutiful daughter.
        - id: ch01-b49
          speaker: daughter
          text: >-
            It truly is Mother's soul. She knows how miserable I am without her, and she has come to comfort me. Whenever I miss her, she will meet me here. I should be so grateful.
          emotion: happy
        - id: ch01-b50
          speaker: narrator
          text: >-
            From that day on, the sorrow weighed far less heavily on her young heart. Every morning, before beginning the duties that waited for her, she took out the mirror and gazed into it to gather strength. Every evening, before lying down to rest, she looked again and found consolation. In the simplicity of her innocent heart, she never doubted that the reflection was truly her mother's soul. As the days passed, she grew more and more like her dead mother in character. She treated everyone with gentleness and kindness, and she remained a loving, dutiful daughter to her father.
        - id: ch01-b51
          speaker: narrator
          text: >-
            In this way, a full year of mourning passed in the little household. Then the father's relatives advised him to marry again, and he followed their counsel. His daughter now found herself under a stepmother's authority. It was a difficult position. But all those days of remembering her own dear mother, and trying to become the kind of woman her mother would wish her to be, had made the girl patient and willing to obey. She decided that she would show her father's wife complete respect and devotion. For some time, everything in the family appeared to run smoothly under the new arrangement. No wind or wave of disagreement disturbed the surface of their daily life, and the father was content.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Yet the stepmother's heart did not match her first smiles. As weeks became months, she treated the motherless girl unkindly and tried to divide father and child. She complained to her husband about his daughter's behavior. He expected such complaints and paid them little attention. Instead of loving his daughter less, he became still more concerned for the lonely girl.
        - id: ch01-b53
          speaker: narrator
          text: >-
            This angered the stepmother. She began searching for a way to drive the girl from the house. She watched her closely. One morning, she peered into the girl's room and thought she had discovered a terrible wrongdoing. What she saw frightened her too.
        - id: ch01-b54
          speaker: narrator
          text: >-
            The stepmother went straight to her husband. She wiped away false tears and spoke in a sorrowful voice.
        - id: ch01-b55
          speaker: stepmother
          text: >-
            Please let me leave you today.
          emotion: sad
        - id: ch01-b56
          speaker: narrator
          text: >-
            Her sudden request astonished him. He could not imagine what had happened.
        - id: ch01-b57
          speaker: father
          text: >-
            Is life in my house so unpleasant that you cannot stay any longer?
        - id: ch01-b58
          speaker: stepmother
          text: >-
            No, no! This has nothing to do with you. I have never dreamed of leaving your side. But if I remain here, my life is in danger. For everyone's sake, you must allow me to go home.
          emotion: fearful
        - id: ch01-b59
          speaker: narrator
          text: >-
            She began to weep again. Her husband was troubled by her misery and wondered whether he had understood her correctly.
        - id: ch01-b60
          speaker: father
          text: >-
            Tell me what you mean. Why would your life be in danger here?
        - id: ch01-b61
          speaker: stepmother
          text: >-
            Your daughter hates me because I am her stepmother. For some time, she has shut herself in her room every morning and evening. When I pass by and look inside, I can see that she has made an image of me. Each day she curses it and uses magic to kill me.
          emotion: fearful
        - id: ch01-b62
          speaker: stepmother
          text: >-
            I am not safe beneath this roof. I must leave. The two of us cannot live in the same house any longer.
          emotion: fearful
        - id: ch01-b63
          speaker: narrator
          text: >-
            Her husband listened to the dreadful accusation, but he could not believe that his gentle daughter would be guilty of such evil. Popular superstition did say that one person could cause another to die little by little by making an image of the hated person and cursing it every day. He knew that many people accepted this belief. But where could his young daughter possibly have learned such dangerous knowledge? The whole idea seemed impossible to him.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Then he remembered that his daughter had lately spent a great deal of time alone in her room. She kept away from everyone and did not come out even when visitors arrived at the house. When he placed that fact beside his wife's alarm, he began to wonder whether something might explain her strange story after all. His heart was torn between doubting his wife and trusting his child, and he had no idea what to do. At last, he decided to go straight to his daughter and discover the truth himself. First he comforted his wife and assured her that her fears must be groundless. Then he moved quietly toward the girl's room.
        - id: ch01-b65
          speaker: narrator
          text: >-
            The girl had been deeply unhappy for a long time. She had tried kindness and obedience to prove her good will and soften her father's new wife. She knew that a wall of mistrust and misunderstanding often rose between stepparents and their children, and she had done everything she could to break it down. But her efforts were useless. Her stepmother never trusted her. She misunderstood even the girl's kindest actions, and the child knew very well that the woman often carried unkind and untrue stories about her to her father.
        - id: ch01-b66
          speaker: narrator
          text: >-
            The girl could not help remembering how different life had been when her own mother was alive, little more than a year before. Morning and evening, she mourned that change. Whenever she could, she went to her room, closed the sliding screens, and looked into the mirror at what she believed was her mother's face. It was her only comfort in those miserable days.
        - id: ch01-b67
          speaker: narrator
          text: >-
            Her father found her there, bending intently over something. When she glanced across her shoulder and saw who had entered, she was startled. Usually, he sent for her when he wanted to speak, so she had not expected him to come into the room. She had never told anyone about her mother's last promise. She had kept it hidden as the sacred secret of her heart. Now she felt confused and shy at being discovered with the mirror. Before turning fully toward her father, she quickly slipped it into her long sleeve. He noticed both her confusion and the act of hiding something from him.
        - id: ch01-b68
          speaker: father
          text: >-
            Daughter, what are you doing in here? What did you just hide in your sleeve?
          emotion: angry
        - id: ch01-b69
          speaker: narrator
          text: >-
            His severe voice frightened her. Never before had he spoken to her in such a tone. Her confusion turned to fear, and the color in her face changed from scarlet to white. She sat without answering, too ashamed and frightened to find any words. Everything about the scene seemed to be against her. As her father looked at the silent girl, she appeared guilty to him. He began to wonder whether, after all, the accusation his wife had made could possibly be true.
        - id: ch01-b70
          speaker: father
          text: >-
            Is it true, then? Do you curse your stepmother every day and pray for her death? I told you to obey her and be loyal to her, even though she is not your own mother. What evil has entered your heart? You have changed. How did you become so disobedient and faithless?
          emotion: angry
        - id: ch01-b71
          speaker: narrator
          text: >-
            Tears suddenly filled his eyes at the thought that he had to scold his own daughter in this way. The girl, for her part, did not understand what he meant. She had never heard the superstition that a person could bring about an enemy's death by praying over an image. Yet she could see that she had to speak and somehow clear her name. She loved her father dearly and could not bear the thought that he was angry with her. Pleading with him, she reached out and laid her hand upon his knee.
        - id: ch01-b72
          speaker: daughter
          text: >-
            Father, Father, please don't say such terrible things. I am still your obedient child. No matter how foolish I might be, I could never curse anyone who belongs to you, much less wish death on someone you love.
          emotion: fearful
        - id: ch01-b73
          speaker: daughter
          text: >-
            Someone must have lied to you, and the lie has confused you. Or perhaps an evil spirit has taken hold of your heart. I know nothing at all about the wicked act you accuse me of, not even as much as a drop of dew.
          emotion: fearful
        - id: ch01-b74
          speaker: narrator
          text: >-
            Her earnest denial did not settle his doubts. He still remembered how she had hidden something when he entered, and he wanted the whole truth.
        - id: ch01-b75
          speaker: father
          text: >-
            Then why do you spend so much time alone in this room? What are you hiding in your sleeve? Show it to me now.
        - id: ch01-b76
          speaker: narrator
          text: >-
            The daughter was shy about revealing how she had guarded her mother's memory. Still, she knew that she must explain. She drew the mirror from her sleeve and placed it before him.
        - id: ch01-b77
          speaker: daughter
          text: >-
            This is what I was looking at when you came in.
        - id: ch01-b78
          speaker: father
          text: >-
            Why, this is the mirror I brought your mother from the capital many years ago! So you have kept it all this time. But why do you spend so many hours looking into it?
          emotion: surprised
        - id: ch01-b79
          speaker: narrator
          text: >-
            The girl told him everything about her mother's final words. Before dying, her mother had given her the mirror and promised that whenever the lonely child looked into its shining surface, they would be able to meet again. The daughter explained how she had followed those words morning and evening ever since. Even then, her father could not understand the perfect simplicity of her heart. It did not occur to him at first that his innocent daughter had never learned what a mirror did. She truly did not know that the face reflected in the metal was her own rather than her mother's.
        - id: ch01-b80
          speaker: father
          text: >-
            What do you mean? How can looking into this mirror bring you face to face with your mother's spirit?
        - id: ch01-b81
          speaker: daughter
          text: >-
            It really does, Father. If you don't believe me, look for yourself.
        - id: ch01-b82
          speaker: narrator
          text: >-
            She held up the mirror. Her own sweet face looked back from the polished metal. She pointed gravely to the reflection, then looked into her father's eyes.
        - id: ch01-b83
          speaker: daughter
          text: >-
            Do you still doubt me?
        - id: ch01-b84
          speaker: narrator
          text: >-
            With a cry of sudden understanding, her father struck his hands together.
        - id: ch01-b85
          speaker: father
          text: >-
            How foolish I have been! Now I understand. Your face is as much like your mother's as the two sides of a melon. All this time, you have looked at your own reflection and believed you were seeing her.
          emotion: surprised
        - id: ch01-b86
          speaker: father
          text: >-
            You are a truly faithful daughter. At first, what you did may sound foolish, but it is not. It shows how innocent your heart is and how deeply you honor your mother. Remembering her each day has helped you become like her in character. How wisely she guided you when she told you to use the mirror.
        - id: ch01-b87
          speaker: father
          text: >-
            I admire and respect you, my daughter. I am ashamed that even for a moment I believed your suspicious stepmother. I came here ready to scold you, while you have remained good and true. I cannot hold up my face before you. Please forgive me.
          emotion: sad
        - id: ch01-b88
          speaker: narrator
          text: >-
            The father wept. Now he understood how lonely his poor daughter must have been, and how much she had suffered under her stepmother's treatment. Yet in the middle of such hard circumstances, she had held steadily to her faith and her innocent nature. She had borne every trouble with patience and kindness. As he looked at her, he thought of the lotus. That flower lifts a blossom of dazzling beauty out of the slime and mud of ponds and castle moats. In the same way, his daughter's heart had passed through the ugliness of the world without becoming stained by it.
        - id: ch01-b89
          speaker: narrator
          text: >-
            The stepmother had been standing outside the room the whole time, anxious to learn what would happen. As the conversation continued, she became deeply interested. Little by little, she pushed the sliding screen farther back until she could see everything inside. When she heard the father's words and understood the truth, she could remain hidden no longer. She suddenly entered the room, dropped to the mats before her stepdaughter, and spread both hands in front of her. Then she bowed her head low over them.
        - id: ch01-b90
          speaker: stepmother
          text: >-
            I am ashamed. I never knew what a faithful daughter you were. You did nothing wrong. My own jealous heart made me dislike you from the beginning. Because I hated you, I naturally imagined that you hated me too.
          emotion: sad
        - id: ch01-b91
          speaker: stepmother
          text: >-
            When you kept going to your room, I followed you. I saw you gazing into the mirror for a long time each day. I decided that you knew how I felt and were using magic to take revenge and end my life.
          emotion: sad
        - id: ch01-b92
          speaker: stepmother
          text: >-
            I will never forget how badly I misjudged you, or that I made your father suspect you. Today I cast away my old, wicked heart. In its place, I will keep a new heart that is clean and full of repentance.
          emotion: sad
        - id: ch01-b93
          speaker: stepmother
          text: >-
            From now on, I will think of you as my own child. I will love and cherish you with all my heart, and try to make up for the pain I caused. Please let everything that has passed flow away like water. I beg you to give me some of the love you have always given your dear mother.
          emotion: sad
        - id: ch01-b94
          speaker: narrator
          text: >-
            In this way, the woman who had treated her so unkindly humbled herself and begged forgiveness from the girl she had wronged. The daughter listened without anger. Her nature was so sweet that she willingly forgave her stepmother for everything. After that day, she never held even a moment of resentment, bitterness, or secret ill will against the woman who had caused her so much unhappiness.
        - id: ch01-b95
          speaker: narrator
          text: >-
            The father could see that his wife truly regretted the past. He felt deeply relieved when both the wrongdoer and the wronged let the terrible misunderstanding pass out of memory.
        - id: ch01-b96
          speaker: narrator
          text: >-
            From that time on, the three of them lived together as happily as fish in water. No trouble like the old misunderstanding ever darkened their home again. The stepmother kept her promise, surrounding the young girl with tender love and thoughtful care. As the peaceful days passed, the daughter gradually forgot the unhappiness she had endured during that difficult year. Her long patience, her gentle heart, and all the goodness she had shown were rewarded at last.
