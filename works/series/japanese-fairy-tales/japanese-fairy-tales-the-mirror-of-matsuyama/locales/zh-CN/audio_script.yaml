audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    father:
      display_name: 父亲
      tts:
        delivery: 朴实慈爱，严厉时仍透着牵挂与克制
        timbre: 温厚沉稳的成年男声
        pace: 平稳
        pitch: 中低音
    mother:
      display_name: 母亲
      tts:
        delivery: 温柔体贴，临终时虚弱却安定
        timbre: 柔和清润的成年女声
        pace: 舒缓
        pitch: 中音
    daughter:
      display_name: 女儿
      tts:
        delivery: 幼时天真明快，长大后温顺真挚
        timbre: 清澈柔和的年轻女声
        pace: 自然
        pitch: 中高音
    stepmother:
      display_name: 继母
      tts:
        delivery: 起初多疑刻薄，悔悟后诚恳谦卑
        timbre: 略显尖细的成年女声
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 日本古代的故事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，日本越后国住着一对夫妇。那里十分偏远，就算到了今天，也算得上僻静。夫妻俩成婚多年，只有一个小女儿。孩子是他们的喜悦，也是他们的骄傲。他们晚年的幸福，全都寄托在这个女儿身上。
        - id: ch01-b02
          speaker: narrator
          text: 女儿从襁褓里一点点长大，每个日子都像金字一样刻在父母心中。满三十天时，母亲穿上礼服和服，骄傲地抱她去寺庙，请家中的守护神庇佑。第一次过女儿节，父母送她一套人偶和小用具，此后每年都添些新的。三岁生日那天，她腰间第一次系上红底金纹的锦缎宽腰带。这表示她已经告别婴儿时期，踏进了女童时代。如今，她七岁了，不仅会说会道，还会做些贴心的小事侍奉父母。一家三口的幸福满得不能再满，整个岛国也找不到比他们更快乐的人家了。
        - id: ch01-b03
          speaker: narrator
          text: 一天，家里忽然忙乱起来。父亲因事务在身，突然奉召去京都。如今有铁路、人力车，还有各种快捷的交通工具，人们很难想象，当年从松山走到京都有多么艰难。那时道路崎岖，普通人不管要走一百英里还是几百英里，都得靠双脚走完全程。那时候上京一趟，就像今天的日本人远航欧洲一样，是件了不得的大事。
        - id: ch01-b04
          speaker: narrator
          text: 妻子知道前路艰辛，一边替丈夫收拾行装，一边忧心不已。她真想一同前往，可路途太远，母女俩承受不了。再说，她还得留下来照料家宅。一切终于准备妥当，丈夫站在门廊前，妻子和女儿围在他身边。
        - id: ch01-b05
          speaker: father
          text: 别担心，我很快就会回来。我不在家的时候，一切都要劳你照看，尤其要照顾好我们的小女儿。
        - id: ch01-b06
          speaker: mother
          text: 好，我们会照顾好自己。可是你……你也一定要保重，事情办完就赶快回来，一天都不要耽搁。
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: 妻子的眼泪像雨一样落下来，只有小姑娘还在笑。她不懂离别的忧伤，也不知道去京都与去邻村有什么不同。父亲常常步行去邻村，她只当这回也一样。她跑过去，抓住父亲的长袖，想把他再留一会儿。
        - id: ch01-b08
          speaker: daughter
          text: 父亲，等您回来以前，我一定很听话。您要给我带一件礼物呀！
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: 父亲回头看看流泪的妻子，又看看笑着等待礼物的女儿，只觉得像有人揪住他的头发，拼命往回拉。一家人从没分开过，要留下她们实在太难。可召命不容推辞，他非走不可。父亲狠下心转过身，快步穿过小庭院，走出门去。妻子抱起孩子追到门口，看着他沿松树间的路越走越远。身影慢慢没入烟霭，只剩一顶尖尖的笠帽，最后连帽子也消失了。
        - id: ch01-b10
          speaker: mother
          text: 父亲已经走了。等他回来以前，家里的一切就由我们俩照看吧。
        - id: ch01-b11
          speaker: daughter
          text: 好，我一定很乖。父亲回家以后，您要告诉他我有多听话。这样，他也许就会送我礼物了。
        - id: ch01-b12
          speaker: mother
          text: 父亲一定会带回你最想要的东西。我请他给你买一个人偶。你每天都要惦记父亲，为他一路平安祈祷，直到他回家。
        - id: ch01-b13
          speaker: daughter
          text: 好呀！等父亲回来，我一定会高兴极了！
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: 孩子拍起手来，小脸一下子亮了。母亲望着她，只觉得自己越来越爱这个女儿。随后，母亲开始为一家三口做冬衣。她架起简朴的木纺车，先纺线，再织布。做活的间隙，她陪女儿玩，也教孩子读日本古老的故事。丈夫不在的孤单日子里，她就靠劳作宽慰自己。光阴在宁静的家中悄悄流过。丈夫办完事情，终于回来了。
        - id: ch01-b15
          speaker: narrator
          text: 不熟悉他的人，恐怕已经认不出他。他在外面走了将近一个月，日日经受风吹雨打，脸晒成了古铜色。可妻子和女儿一眼便认出他来，一左一右飞奔过去，各自抓住他的一只袖子。夫妻见彼此安好，欢喜万分。母女帮他解下草鞋，摘去宽大的笠帽。大家只觉得这些动作做得太慢了，恨不得立刻让他重新坐进一家人中间，回到那间他离开以后一直空荡荡的起居室。
        - id: ch01-b16
          speaker: narrator
          text: 三个人在洁白的榻榻米上坐好。父亲打开随身带回的竹篮，取出一个漂亮的人偶，还有一只装满点心的漆盒。
        - id: ch01-b17
          speaker: father
          text: 来，这是给你的。父亲不在的时候，你把母亲和家照料得这样好，这份礼物就是给你的奖赏。
        - id: ch01-b18
          speaker: narrator
          text: 孩子向父亲道谢，俯身行礼，额头几乎碰到地面。接着，她伸手去接礼物，五根急切张开的手指，活像一片小枫叶。人偶和漆盒都来自京都，比她从前见过的任何东西都漂亮。小姑娘欢喜得脸都快融化了。她究竟有多么高兴，世上简直没有任何言语能够把它说清楚，眼里心里也再装不下别的东西。
        - id: ch01-b19
          speaker: narrator
          text: 丈夫又把手伸进竹篮，拿出一只用红白丝绳仔细系好的方木盒，递给妻子。
        - id: ch01-b20
          speaker: father
          text: 这一件，是给你的。
        - id: ch01-b21
          speaker: narrator
          text: 妻子小心打开盒子，取出一面带柄的金属圆盘。它一面晶莹明亮，另一面凸雕着松树与仙鹤，花纹栩栩如生。妻子生在越后乡间，也在那里长大，一辈子从未见过这种东西。她朝明亮的圆盘看了看，满脸惊奇地抬起头。
        - id: ch01-b22
          speaker: mother
          text: 这个圆东西里，有个人正在看我呢！你送我的究竟是什么？
          emotion: surprised
        - id: ch01-b23
          speaker: father
          text: 你看见的就是自己的脸啊。这东西叫镜子。不管是谁，只要望着明净的镜面，就能看见自己的模样。我们这个偏僻地方没有镜子，京都却自古就有人使用。那里的人认为，女子不能没有镜子。古语说，刀剑是武士之魂，镜子是女子之魂。人们还说，镜子能映照一个女子的心。镜面常保明净，她的心也会纯洁美好。镜子还是象征天皇身份的宝物之一。所以，你要珍爱它，使用时也得格外仔细。
        - id: ch01-b24
          speaker: narrator
          text: 妻子听完丈夫的解释，学到这么多新鲜事，十分高兴。更让她欢喜的，是这件珍贵礼物说明丈夫远行时一直没有忘记她。
        - id: ch01-b25
          speaker: mother
          text: 既然镜子代表我的灵魂，我一定把它当作珍宝，再也不会轻率对待。
        - id: ch01-b26
          speaker: narrator
          text: 她怀着感激，把镜子高高举到额前致谢，然后放回盒里，仔细收好。妻子看出丈夫已经十分疲惫，便张罗晚饭，让他舒舒服服地休息。一家人重新团聚，欢喜得仿佛从前还不懂什么才是真正的幸福。那晚，父亲向她们讲了许多旅途见闻，还有京都大城里的一切。
        - id: ch01-b27
          speaker: narrator
          text: 宁静的家中，岁月慢慢流过。女儿从小孩子长成了十六岁的美丽姑娘，父母最殷切的希望也实现了。他们始终疼爱她、照料她，就像把无价宝石捧在掌中。如今，一切辛劳都有了加倍的回报。她帮着母亲操持家务，给母亲带来许多安慰。父亲也以她为荣，因为女儿越长越像母亲新婚时的样子。
        - id: ch01-b28
          speaker: narrator
          text: 可是，世上没有什么能永远不变。月亮不会一直圆满，花朵盛开以后也终会凋谢。一场巨大的悲痛，终于打碎了这个家庭的幸福。温柔善良的母亲病倒了。起初，父女俩以为她只是受了风寒，并不十分担心。可日子一天天过去，她非但不见好转，反而越来越虚弱。大夫想尽办法，仍然束手无策。姑娘不分昼夜守在床边，一步也不肯离开，可无论父女俩怎样努力，也救不了母亲的性命。
        - id: ch01-b29
          speaker: narrator
          text: 一天，姑娘坐在床边，心里被忧虑啃噬，却勉强笑着，不愿让母亲看出悲伤。母亲振作精神，握住女儿的手，深情又郑重地望着她。她呼吸艰难，说话也十分吃力。
        - id: ch01-b30
          speaker: mother
          text: 女儿啊，我知道，如今已经没有什么能救我了。我死以后，你要答应母亲，照顾好亲爱的父亲，也要努力做个善良孝顺的女子。
          emotion: sad
        - id: ch01-b31
          speaker: daughter
          text: 母亲，您千万不要这样说。您只要快点好起来，这才是父亲和我最大的幸福。
          emotion: sad
        - id: ch01-b32
          speaker: mother
          text: 我知道。生命最后的日子里，知道你这样盼我康复，我心里很安慰。可母亲好不起来了。不要这么伤心，前世的因缘早已注定，我今生会在此刻离去。明白了这一点，我也愿意安心接受命运。现在，我有一件东西要交给你。以后看见它，你就会想起母亲。
          emotion: calm
        - id: ch01-b33
          speaker: narrator
          text: 她伸手从枕边拿起一只方木盒。盒上系着带流苏的丝绳。母亲小心解开绳结，取出丈夫多年前送她的那面镜子。
        - id: ch01-b34
          speaker: mother
          text: 你还小的时候，父亲去京都带回这件宝物送给我。它叫镜子。母亲离开以前，要把它交给你。等我不在人世了，你若感到孤单，想见见我，就拿出镜子。望着这片清澈明亮的镜面，你总会看见我。这样，我们就能常常相见，你也能把心里的一切都说给我听。虽然母亲不能回答，可无论将来发生什么，我都会明白你的心，也会陪你一同感受。
          emotion: sad
        - id: ch01-b35
          speaker: narrator
          text: 弥留的母亲把镜子交给女儿，仿佛终于放下了心。她倒回枕上，再没说一句话，当天便安静地离开人世。
        - id: ch01-b36
          speaker: narrator
          text: 父女俩失去至亲，悲痛得几乎发狂。这个女人一直占满他们的生命，要他们向她告别，把她的身体埋进土里，他们觉得无论如何也做不到。狂乱的悲伤过去以后，即使内心已经破碎，他们还是收拢心神，勉强接受了命运。可女儿的生活仍是一片荒凉。她对亡母的爱没有随着时间减退。雨落下来，风吹过去，日常的一切都会让她想起母亲的死，也想起母女共同爱过、共同经历的事。
        - id: ch01-b37
          speaker: narrator
          text: 一天，父亲外出，姑娘独自在家料理事务。孤独与哀伤突然沉重得让她承受不住。她扑倒在母亲房里，哭得心都快碎了。可怜的孩子只想再看一眼那张深爱的脸，再听一次母亲唤她乳名，哪怕只把心中的空洞忘掉片刻也好。她忽然坐了起来。悲伤一直叫她神思昏沉，直到这时，母亲临终的话才在记忆里响起。
        - id: ch01-b38
          speaker: daughter
          text: 啊！母亲把镜子交给我时说过，只要望进去，我就能看见她，能同她相见。我竟险些忘了她最后的话，真傻！我这就去拿镜子，看看是不是真的！
          emotion: surprised
        - id: ch01-b39
          speaker: narrator
          text: 她赶快擦干眼泪，从壁橱里取出木盒。姑娘满怀期待，心怦怦直跳。她拿起镜子，凝望光滑的镜面。看哪，母亲说的是真的！圆镜里果然映着母亲的脸。更叫她惊喜的是，那不是疾病折磨下消瘦憔悴的母亲，而是她幼年记忆里年轻美丽的母亲。镜中双眼认真地回望着她。姑娘觉得，那张脸仿佛马上就会开口。她几乎听见母亲再次叮嘱，要她长成一个善良孝顺的女子。
        - id: ch01-b40
          speaker: daughter
          text: 我看见的一定是母亲的灵魂。她知道我失去她有多难过，所以回来安慰我。以后每次想念她，她都会在这里同我相见。我真该好好感激啊！
          emotion: happy
        - id: ch01-b41
          speaker: narrator
          text: 从此，压在姑娘心上的哀痛轻了许多。每天清晨，她会从镜中获得力量，担起当天的事务。每天晚上，她也会取出镜子，在睡前得到安慰。她有一颗天真纯朴的心，始终相信那就是母亲的灵魂。日子久了，她的品性也越来越像亡母。她对所有人都温柔和善，对父亲更是孝顺体贴。
        - id: ch01-b42
          speaker: narrator
          text: 守丧一年以后，父亲听从亲戚的劝告，再次成婚。女儿从此要听继母管教。这样的处境并不容易。可姑娘日日怀念亲生母亲，一心要成为母亲期望的样子，早已养成温顺忍耐的性情。她决心把父亲的新妻子当作长辈，事事孝敬顺从。起初，家中表面上一切顺利。日常生活没有争执，父亲也很满意。
        - id: ch01-b43
          speaker: narrator
          text: 然而，女子一旦心胸狭窄，就容易变得卑琐刻薄，天下的继母又向来背负恶名。这位继母的心并不像最初的笑容那样和善。几天变成几周，几周积成几个月，她开始苛待失去母亲的姑娘，还想在父女之间挑起嫌隙。她常去丈夫面前数落继女。父亲知道继母抱怨继女本是常事，并不理睬那些恶意的话。女人原想削弱丈夫对女儿的疼爱，结果她越埋怨，父亲反倒越惦念女儿。
        - id: ch01-b44
          speaker: narrator
          text: 继母很快发现，丈夫比以前更关心这个孤单的孩子。她心里十分不快，反复盘算着怎样才能把继女赶出家门。她的心就这样越来越歪。她仔细监视姑娘。一天清早，她从房门外偷看，自以为发现了一桩严重的罪过，足以向父亲告状。她看到的景象，甚至叫自己也有些害怕。
        - id: ch01-b45
          speaker: narrator
          text: 继母立刻去找丈夫。她抹去几滴假眼泪，用悲伤的声音开了口。
        - id: ch01-b46
          speaker: stepmother
          text: 请您准许我今天离开这里。
          emotion: sad
        - id: ch01-b47
          speaker: narrator
          text: 男人没想到她会突然提出这种请求，惊讶得猜不出究竟发生了什么。
        - id: ch01-b48
          speaker: father
          text: 难道住在我家让你这样难受，已经一天也待不下去了吗？
          emotion: surprised
        - id: ch01-b49
          speaker: stepmother
          text: 不！不是您的缘故。我连做梦也没想过离开您。可是继续住在这里，我恐怕连命都保不住。为了大家着想，您还是准我回娘家吧！
          emotion: fearful
        - id: ch01-b50
          speaker: narrator
          text: 女人说完，又哭了起来。丈夫见她如此痛苦，心中不安，还以为自己听错了。
        - id: ch01-b51
          speaker: father
          text: 你把话说清楚！住在这里，你的性命怎么会有危险？
          emotion: surprised
        - id: ch01-b52
          speaker: stepmother
          text: 既然您问，我就说了。您的女儿不喜欢我这个继母。最近每天早晚，她都把自己关在房里。我从外面偷看过，她一定做了一个我的人像，天天对着它念咒，想用巫术害死我。这样下去，我住在这里太危险了。我一定得走，我们再也不能生活在同一个屋檐下。
          emotion: fearful
        - id: ch01-b53
          speaker: narrator
          text: 丈夫听完这个可怕的故事，却不相信温柔的女儿会做出如此邪恶的事。民间的确有人相信，只要做出仇人的偶像，天天对它诅咒，就能让对方慢慢死去。可他年轻的女儿从哪里学得这种法术？这根本不可能。可是，他也想起女儿近来常独自待在房中，不愿与人来往，家里来了客人也不露面。再想到妻子的恐惧，他又觉得这个古怪的故事也许真有缘故。
        - id: ch01-b54
          speaker: narrator
          text: 他既怀疑妻子，又信任女儿，内心被两边撕扯，不知该怎么办。最后，他决定立刻去找女儿，查明真相。他先安慰妻子，说她的恐惧一定没有根据，随后悄悄来到女儿房前。
        - id: ch01-b55
          speaker: narrator
          text: 姑娘已经难过了很久。她努力表现得和善顺从，想让父亲的新妻子明白自己的善意，也想拆掉继父母与继子女之间那道由偏见和误会筑成的墙。可一切努力都没有用。继母从不信任她，总把她的举动往坏处想，还常去父亲面前说些刻薄又虚假的话。姑娘忍不住拿现在的日子同一年多前相比。那时亲生母亲还活着，短短一年，生活竟变化得这样大！
        - id: ch01-b56
          speaker: narrator
          text: 她每天早晚都会因回忆落泪。只要有机会，便回房拉上纸拉门，取出镜子，凝望那张她以为属于母亲的脸。这是她在悲惨日子里唯一的安慰。父亲进来时，看见的正是这一幕。他推开纸拉门，只见女儿正低头专心望着什么。姑娘回头看见父亲，十分惊讶。父亲平时想同她说话，总会先派人来叫她。
        - id: ch01-b57
          speaker: narrator
          text: 她从未对任何人提起母亲最后的承诺，一直把它当作心中神圣的秘密。如今被父亲撞见她照镜子，她顿时慌乱起来。转身以前，她连忙把镜子藏进长袖。父亲见她神色慌张，还把东西藏了起来，口气顿时严厉起来。
        - id: ch01-b58
          speaker: father
          text: 女儿，你躲在这里做什么？刚才藏进袖中的又是什么？
        - id: ch01-b59
          speaker: narrator
          text: 姑娘被父亲的严厉吓住了。他从不曾这样对她说话。她的慌乱变成恐惧，脸色从通红转为惨白，只能羞惭地坐在那里，一个字也答不出来。眼前的情形对她十分不利。姑娘看起来仿佛当真犯了罪，父亲便以为妻子说的或许是真的，愤怒地责问她。
        - id: ch01-b60
          speaker: father
          text: 难道你果真每天诅咒继母，盼她早日死去？我早就告诉过你，她虽是继母，你也必须顺从她、忠于她。你全忘了吗？究竟是什么邪灵占据了你的心，叫你变得这样恶毒？女儿，你真的变了！到底是什么让你如此忤逆，如此背弃孝道？
          emotion: angry
        - id: ch01-b61
          speaker: narrator
          text: 想到自己竟要这样责骂女儿，父亲眼里忽然涌满泪水。姑娘却完全听不懂他在说什么。她从未听过那种迷信，不知道有人相信，对着偶像诅咒就能害死仇人。不过，她明白自己必须开口洗清嫌疑。她深爱父亲，无法忍受父亲的怒火，便恳求地把一只手放在他的膝上。
        - id: ch01-b62
          speaker: daughter
          text: 父亲！请不要对我说这样可怕的话。我还是您那个孝顺听话的女儿，真的，一点也没有变。无论我多愚笨，也绝不会诅咒任何一位属于您的人，更不会盼您所爱的人死去。一定是有人对您说了谎，叫您神志恍惚，不明白自己在说什么。要不，就是邪灵占据了您的心。您说的那种恶事，我根本不知道，连露珠那么丁点儿都不知道。
          emotion: fearful
        - id: ch01-b63
          speaker: narrator
          text: 可父亲记得，自己进门时她急忙藏起了东西。女儿这样诚恳地辩白，仍没消除他的疑心。他一定要彻底弄清真相。
        - id: ch01-b64
          speaker: father
          text: 那么，这些天你为什么总独自躲在房里？你藏进袖中的究竟是什么？立刻拿给我看。
        - id: ch01-b65
          speaker: narrator
          text: 姑娘不好意思承认，自己一直怎样珍藏着对母亲的思念。可要洗清嫌疑，她只能把一切告诉父亲。于是，她从长袖里取出镜子，放到父亲面前。
        - id: ch01-b66
          speaker: daughter
          text: 您刚才看见我望着的，就是这个。
        - id: ch01-b67
          speaker: father
          text: 这不是我多年前去京都时，带回来送给你母亲的镜子吗？原来你一直保管着它？可是，你为什么每天都在镜子前待那么久？
          emotion: surprised
        - id: ch01-b68
          speaker: narrator
          text: 姑娘把母亲临终的话全告诉了父亲。母亲答应过，只要孩子望进镜中，就会来同她相见。可是父亲还是不明白，女儿竟天真得不知道，镜里映出的其实是她自己的脸，并不是母亲。
        - id: ch01-b69
          speaker: father
          text: 你究竟是什么意思？只靠望着这面镜子，怎么能遇见亡母的灵魂？我实在不明白。
        - id: ch01-b70
          speaker: daughter
          text: 这是真的。您若不信，就亲自看一看吧。
        - id: ch01-b71
          speaker: narrator
          text: 她把镜子摆在自己面前。光滑的金属圆盘里，映出她秀美的脸。姑娘郑重地指着镜中影像，仰头看向父亲。
        - id: ch01-b72
          speaker: daughter
          text: 您现在还是不相信我吗？
        - id: ch01-b73
          speaker: narrator
          text: 父亲突然明白过来，惊呼一声，双掌重重拍在一起。
        - id: ch01-b74
          speaker: father
          text: 我真糊涂！现在终于明白了。你的脸和母亲一模一样，就像同一只瓜的两半。原来这些日子，你一直望着自己的影子，却以为自己正同亡母面对面！你真是个至诚至孝的孩子。乍看起来，这样做似乎很傻，其实一点也不傻。它正说明你的孝心有多深，你的心又有多纯真。你时时怀念亡母，性情也在思念中越来越像她。她叫你这样做，真是聪明啊。
        - id: ch01-b75
          speaker: father
          text: 女儿，我敬佩你，也尊重你。我竟有那么一会儿相信了多疑的继母，怀疑你心怀恶意，还打算过来狠狠训斥你。你一直这样真诚善良，我却误会了你。想到这里，我实在无地自容。请你原谅父亲吧。
          emotion: sad
        - id: ch01-b76
          speaker: narrator
          text: 父亲哭了。他想起女儿该有多么孤单，也想起她在继母手下受过的苦。逆境里，女儿一直守着信念与纯真，耐心温和地承受所有烦恼。他不禁想到池塘与护城河里的莲花。莲花从污泥中挺出，开得耀眼美丽。女儿也有这样一颗心，走过尘世，却始终不曾沾染污垢。
        - id: ch01-b77
          speaker: narrator
          text: 继母急着知道事情会怎样发展，一直站在房外偷听。她越听越入神，慢慢推开纸拉门，直到能看清里面的一切。就在这时，她突然走进房中，跪倒在榻榻米上，双手摊开伏在身前，向继女深深低头。
        - id: ch01-b78
          speaker: stepmother
          text: 我真惭愧！我真惭愧！我不知道你竟是这样孝顺的孩子。你没有一点错，是我怀着继母的嫉妒之心，一直不喜欢你。我自己恨你，便以为你也一定恨我。所以，见你常常独自回房，我就悄悄跟在后面。见你每天久久望着镜子，我便认定你已经知道我不喜欢你，正想用巫术报复，取走我的性命。
          emotion: sad
        - id: ch01-b79
          speaker: stepmother
          text: 只要我还活着，就永远不会忘记自己怎样误解你、伤害你，还害得父亲也怀疑你。从今天开始，我要丢掉那颗邪恶的旧心，换上一颗洁净而充满悔意的新心。我会把你当作亲生孩子，用全部的心爱护你、珍惜你，尽力补偿带给你的所有不幸。求你把从前的一切都丢进水里，让它随水流走吧！也请你分一点过去献给亡母的孝爱给我吧。
          emotion: sad
        - id: ch01-b80
          speaker: narrator
          text: 就这样，刻薄的继母向深受自己伤害的姑娘低头认错，请求原谅。姑娘天性温柔，欣然原谅了她。从此，她再没有片刻怨恨，也不曾对继母怀着一丝恶意。父亲从妻子脸上看出，她确实为过去感到悔恨。伤人者和受伤者都把这场可怕的误会从记忆中抹去，他终于如释重负。
        - id: ch01-b81
          speaker: narrator
          text: 从此，三个人如鱼得水，幸福地生活在一起。再也没有这样的烦恼给家中蒙上阴影。继母如今用温柔的爱照料姑娘，姑娘也渐渐忘记了那不幸的一年。她的忍耐与善良，终于得到了回报。
