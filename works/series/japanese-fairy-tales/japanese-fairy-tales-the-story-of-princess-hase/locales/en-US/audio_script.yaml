  chapters:
    - id: ch01
      title: The Child of Hase
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Many years ago, in Nara, the ancient capital of Japan, there lived a wise minister named Prince Toyonari Fujiwara. His wife, Princess Murasaki, was noble, kind, and beautiful. Their families had arranged their marriage when they were young, and they had lived happily together ever since.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Yet one sorrow lay between them. As the years passed, no child was born. They longed for a son or daughter who would brighten their old age, carry on the family name, and honor their ancestors after they were gone. They possessed everything else life could give, but without a child, none of it seemed enough.
        - id: ch01-b03
          speaker: narrator
          text: >-
            After many long talks and much thought, they chose to make a pilgrimage to the temple of Hase-no-Kwannon, the Goddess of Mercy at Hase. Their faith held a beautiful promise. Kwannon would answer mortal prayers by taking the form people needed most. Surely, after so many years of prayer, she might come to them as a beloved child. That was the deepest need in both their lives.
        - id: ch01-b04
          speaker: narrator
          text: >-
            They stayed at the temple for a long while. Each day they offered incense and prayed to the Heavenly Mother. At last, their prayer was answered. Princess Murasaki gave birth to a daughter, and her joy was beyond measure.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The parents named the baby Hase-Hime, the Princess of Hase, because they believed she was Kwannon's gift from that holy place. They cared for her with the greatest tenderness, and she grew healthy and beautiful.
        - id: ch01-b06
          speaker: narrator
          text: >-
            When Hase-Hime was five, her mother became dangerously ill. No doctor and no medicine could save her. Shortly before she died, Princess Murasaki called the little girl close and gently stroked her head.
        - id: ch01-b07
          speaker: murasaki
          text: >-
            Hase-Hime, my life is ending. When I am gone, keep growing into a good girl. Try never to trouble your nurse or anyone in the family. Your father may marry again, and another woman may take my place. If that happens, do not mourn for me. Treat his new wife as your true mother, and be a loving, obedient daughter to them both.
          emotion: sad
        - id: ch01-b08
          speaker: murasaki
          text: >-
            When you are older, obey those above you and show kindness to everyone under your care. Please remember. I leave this world hoping you will grow into a woman others can look up to.
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: >-
            Hase-Hime listened respectfully while her mother spoke, then promised to do everything she had been told. There is an old proverb that says the spirit shown at three remains at a hundred. So the princess grew just as her mother had hoped. She was a good and obedient child, though at five years old she was still too young to understand how great the loss of her mother truly was.
    - id: ch02
      title: Music at the Palace
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Not long after Princess Murasaki died, Prince Toyonari married a noblewoman named Princess Terute. Sadly, Terute was nothing like his first wife. She had a cruel heart and felt no love for her motherless stepdaughter. Again and again, she told herself the same thing.
        - id: ch02-b02
          speaker: terute
          text: >-
            She is not my child. She will never be my child.
          emotion: disgusted
        - id: ch02-b03
          speaker: narrator
          text: >-
            Hase-Hime endured every unkind act patiently. She served her stepmother with care, obeyed her in everything, and caused no trouble. It was just as her own mother had taught her, and Terute could find no honest reason to complain.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The young princess studied diligently. Music and poetry were her favorite subjects, and she spent several hours practicing every day. Her father searched for the most skilled teachers he could find. They taught her to play the koto, the Japanese harp, and also trained her in the arts of writing letters and composing verse.
        - id: ch02-b05
          speaker: narrator
          text: >-
            By the age of twelve, Hase-Hime played so beautifully that she and Terute were summoned to perform for the Emperor. It was the Festival of the Cherry Flowers, and the whole Court was celebrating. The Emperor ordered Hase-Hime to play the koto while her stepmother accompanied her on the flute.
        - id: ch02-b06
          speaker: narrator
          text: >-
            His Majesty sat on a raised platform behind a curtain of finely cut bamboo and purple tassels. From there he could see everyone, though no ordinary subject was permitted to look upon his sacred face.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Hase-Hime was very young, but her wonderful memory and musical gift often amazed her teachers. On that important day, she played well before the Emperor. Terute had been too lazy to practice each day, and partway through the performance her flute accompaniment fell apart. She could not continue and had to ask a lady of the Court to take her place.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Terute felt deeply disgraced. She was furious that her stepdaughter had succeeded where she had failed. Then the Emperor rewarded Hase-Hime with many beautiful gifts, and her jealousy grew sharper still.
        - id: ch02-b09
          speaker: narrator
          text: >-
            By then, Terute had a son of her own. In the secret part of her heart, one thought kept returning.
        - id: ch02-b10
          speaker: terute
          text: >-
            If Hase-Hime were gone, her father would give all his love to my son.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Terute had never learned to master her feelings. She let that wicked thought grow until she wanted to take Hase-Hime's life.
    - id: ch03
      title: The Two Bottles
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            One day, Terute secretly obtained some poison and mixed it into sweet wine. She poured the poisoned wine into one bottle and good wine into another that looked just like it.
        - id: ch03-b02
          speaker: narrator
          text: >-
            On the fifth of May, during the Boys' Festival, Hase-Hime was playing with her little brother. His toys of warriors and heroes covered the floor, and she was telling him wonderful stories about each one. The children and their attendants were laughing happily when Terute came in carrying the two bottles and some delicious cakes.
        - id: ch03-b03
          speaker: terute
          text: >-
            You two have been so good, and you look so happy. I brought sweet wine as a treat for you, and cakes for my good children.
        - id: ch03-b04
          speaker: narrator
          text: >-
            She poured wine from the two different bottles into two cups. Hase-Hime never imagined what her stepmother had planned. She took one cup and handed her little brother the one Terute had poured for him.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Terute had marked the poisoned bottle carefully. But once she entered the room, she became nervous and poured too quickly. Without knowing it, she gave the poisoned cup to her own son.
        - id: ch03-b06
          speaker: narrator
          text: >-
            She watched Hase-Hime anxiously, yet the girl's face did not change at all. Then the little boy screamed, doubled over with pain, and threw himself onto the floor.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Terute rushed to him. Before lifting him, she made sure to knock over both small wine bottles. The attendants ran for a doctor, but no one could save the child. He died in his mother's arms before an hour had passed.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Doctors knew little in those ancient days. No one discovered that poison was the cause. Everyone believed the sweet wine had simply disagreed with the boy and brought on the convulsions that killed him.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Terute had lost her own child while trying to murder her stepdaughter. Even then, she did not blame herself. Grief and bitterness made her hate Hase-Hime more than ever. She waited eagerly for another chance to harm her, though that chance was a long time coming.
    - id: ch04
      title: The Poem and the River
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            By the time Hase-Hime was thirteen, people were already speaking of her as a talented poet. In old Japan, women studied poetry with great care, and a gifted poet was held in high honor.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Then the rainy season came to Nara. Every day brought reports of floods damaging the country nearby. The Tatsuta River ran through the Imperial Palace grounds, and its water rose to the very top of the banks. The torrent roared through its narrow channel day and night. The noise kept the Emperor from resting and brought on a serious nervous illness.
        - id: ch04-b03
          speaker: narrator
          text: >-
            An Imperial Edict went out to every Buddhist temple. It commanded the priests to offer prayers without ceasing and ask Heaven to stop the noise of the flood. Day after day, they prayed as ordered. It did no good. The swollen river kept rushing through its narrow bed, and its roar still disturbed the Emperor's rest.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Whispers began to pass around the Court. People said that Hase-Hime, daughter of the second minister Prince Toyonari Fujiwara, was the finest young poet of her day. Her teachers agreed that it was true.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The ancient accounts told of Ono-no-Komachi, a beautiful and gifted maiden poet. Long before, she was said to have moved Heaven with a prayer in verse and brought rain down upon a land dying of drought. The courtiers wondered whether Hase-Hime might do the same. Perhaps she could offer a poem in prayer, quiet the rushing river, and remove the cause of the Emperor's illness.
        - id: ch04-b06
          speaker: narrator
          text: >-
            In time, this talk reached the Emperor. He sent an order to Prince Toyonari, telling him what his daughter must do.
        - id: ch04-b07
          speaker: narrator
          text: >-
            When her father called her and explained the command, Hase-Hime was frightened and astonished. A crushing duty now rested on her young shoulders. The merit of her poem was expected to save the Emperor's life.
        - id: ch04-b08
          speaker: narrator
          text: >-
            At last, her poem was ready. She wrote it on a sheet of paper thickly flecked with gold dust. With her father, her attendants, and several Court officials, she went to the bank of the roaring river.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Hase-Hime raised her heart toward Heaven. Holding the poem high in both hands, she read it aloud. Everyone around her witnessed something strange. The waters stopped roaring. In direct answer to her prayer, the river became quiet.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Soon afterward, the Emperor recovered. He was greatly pleased and summoned Hase-Hime to the Palace. To honor her, he gave her the rank of Chinjo, or Lieutenant-General. From then on, people called her Chinjo-hime, the Lieutenant-General Princess, and she was loved and respected by all.
        - id: ch04-b11
          speaker: narrator
          text: >-
            Only Terute took no pleasure in Hase-Hime's success. She still brooded over the death of the son she herself had killed while trying to poison the princess. Now she had to watch Hase-Hime rise in honor, favored by the Emperor and admired throughout the Court. Envy burned inside her like fire.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Again and again, Terute told her husband lies about his daughter. Nothing came of them. Prince Toyonari refused to believe her stories and told her sharply that she was wrong.
    - id: ch05
      title: Exile in the Hibari Mountains
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            At last, Terute found her opportunity while Prince Toyonari was away. She ordered an old servant named Katoda to take the innocent princess into the Hibari Mountains, the wildest part of the country, and kill her there.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Terute invented a terrible story about Hase-Hime. She claimed that killing the girl was the only way to keep disgrace from falling on the family.
        - id: ch05-b03
          speaker: narrator
          text: >-
            As Terute's vassal, Katoda was bound to obey his mistress. Yet he could see that, while Hase-Hime's father was away, the wisest course was only to pretend he would carry out the command. He placed the girl in a palanquin, traveled with her into the wild country, and took her to the most solitary place he could find.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Hase-Hime knew that protesting to her cruel stepmother would do no good. She went quietly, as she had been told.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Katoda knew the princess was innocent. Every reason Terute had given him was a lie, and he had no intention of killing the girl. Yet if he spared her, he could never return to his cruel mistress. He chose to remain in the wilderness instead.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Some peasants helped him build a small cottage. Katoda secretly sent for his wife, and the two faithful old servants did everything they could to care for the unfortunate princess. Through it all, Hase-Hime trusted her father. She knew that when he returned and discovered she was gone, he would search for her.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Several weeks later, Prince Toyonari came home. Terute told him that Hase-Hime had done something wrong and run away because she feared punishment. Everyone in the household repeated the same story. The girl had suddenly vanished, they said, and no one knew why or where she had gone.
        - id: ch05-b08
          speaker: narrator
          text: >-
            Anxiety nearly made the prince ill. No one in the house would give him any answer beyond the same tale of her sudden disappearance. To avoid bringing scandal on the family, he kept the matter quiet. He searched every place he could imagine, but all his efforts came to nothing. He found no trace of his daughter.
        - id: ch05-b09
          speaker: narrator
          text: >-
            One day, hoping to escape his terrible worry for a while, Toyonari gathered his men for a hunt that would last several days. They mounted their horses and waited for him at the gate. The prince rode hard toward the Hibari Mountains with a great company behind him.
        - id: ch05-b10
          speaker: narrator
          text: >-
            Before long, he had ridden far ahead of everyone else. He found himself alone in a narrow, beautiful valley. As he looked over the scenery, he noticed a tiny house on a nearby hill. Then he heard a clear and lovely voice reading aloud.
        - id: ch05-b11
          speaker: narrator
          text: >-
            Who could be studying so faithfully in such a lonely place? Curious, he dismounted, left his horse with his groom, and walked up the hillside. As he came closer, he saw that the reader was a beautiful girl. The cottage stood wide open, and she sat facing the view.
        - id: ch05-b12
          speaker: narrator
          text: >-
            Toyonari listened. The girl was reading the Buddhist scriptures with deep devotion. His curiosity grew. He hurried through the little gate and into the garden. When he looked up, he saw his lost daughter, Hase-Hime. She was so absorbed in her reading that she neither saw nor heard him until he spoke.
    - id: ch06
      title: The Princess Comes Home
      blocks:
        - id: ch06-b01
          speaker: toyomari
          text: >-
            Hase-Hime! It is you. My own Hase-Hime!
          emotion: surprised
        - id: ch06-b02
          speaker: narrator
          text: >-
            The call startled her. For a moment, she could scarcely believe that her dear father stood before her. She could neither speak nor move.
        - id: ch06-b03
          speaker: hase_hime
          text: >-
            Father! My father! It truly is you. Oh, Father!
          emotion: surprised
        - id: ch06-b04
          speaker: narrator
          text: >-
            She ran to him, gripped his thick sleeve, buried her face against him, and burst into tears.
        - id: ch06-b05
          speaker: narrator
          text: >-
            Toyonari stroked her dark hair and gently asked her to tell him everything that had happened. Hase-Hime could only keep weeping. Her father wondered whether he might be dreaming.
        - id: ch06-b06
          speaker: narrator
          text: >-
            Then faithful Katoda came outside and bowed all the way to the ground before his master. He told the whole long story of the wrong done to Hase-Hime. He explained why the prince had found his daughter in that wild, empty place with only two old servants to protect her.
        - id: ch06-b07
          speaker: narrator
          text: >-
            Toyonari was astonished and furious. He ended the hunt at once and hurried home with Hase-Hime. One man from the hunting party galloped ahead to tell the household the joyful news.
        - id: ch06-b08
          speaker: narrator
          text: >-
            When Terute heard what had happened, she knew her wickedness had been exposed. Afraid to face her husband, she fled the house and returned in disgrace to her father's home. Nothing more was ever heard of her.
        - id: ch06-b09
          speaker: narrator
          text: >-
            Toyonari rewarded Katoda with the highest promotion in his service. The old servant lived happily to the end of his days and remained devoted to the young princess. Hase-Hime never forgot that she owed her life to this faithful man and his wife. She was no longer tormented by a cruel stepmother, and her days passed quietly and happily with her father.
        - id: ch06-b10
          speaker: narrator
          text: >-
            Prince Toyonari had no son, so he adopted a younger son from a noble family. The young man would become his heir and marry Hase-Hime. A few years later, the marriage took place.
        - id: ch06-b11
          speaker: narrator
          text: >-
            Hase-Hime lived to a good old age. Everyone said that no wiser, more devout, or more beautiful mistress had ever ruled Prince Toyonari's ancient household. She also had the joy of giving the family its future lord. Just before her father retired from active life, she presented her young son to him.
        - id: ch06-b12
          speaker: narrator
          text: >-
            To this day, a piece of needlework is preserved in a Buddhist temple in Kioto. It is a beautiful tapestry showing the Buddha, embroidered with silky threads drawn from lotus stems.
        - id: ch06-b13
          speaker: narrator
          text: >-
            People say it was made by the hands of the good Princess Hase.
