audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    prince_toyonari:
      display_name: 丰成亲王
      tts:
        delivery: 端方稳重，对女儿说话时慈爱真切
        timbre: 温厚沉稳的成年男声
        pace: 从容有力
        pitch: 中低音
    princess_murasaki:
      display_name: 紫姬
      tts:
        delivery: 温柔端庄，临终叮咛虚弱却清楚
        timbre: 柔和清润的成年女声
        pace: 舒缓
        pitch: 中音
    hase_hime:
      display_name: 长谷姬
      tts:
        delivery: 谦恭纯真，重逢时情感强烈而自然
        timbre: 清澈柔美的少女声
        pace: 平稳，激动时略快
        pitch: 中高音
    princess_terute:
      display_name: 照手姬
      tts:
        delivery: 表面和悦，内里冷酷妒忌
        timbre: 清亮而略显锋利的成年女声
        pace: 稍缓
        pitch: 中音
    katoda:
      display_name: 加藤田
      tts:
        delivery: 忠厚克制，禀报时恭敬而坚定
        timbre: 苍老厚实的男声
        pace: 沉稳舒缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 观音所赐的女儿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，日本的古都奈良住着一位国政大臣，名叫藤原丰成亲王。他贤明正直，妻子紫姬出身名门，也是位善良美丽的女子。依照当时的习俗，两人年纪轻轻便由家族做主结为夫妻，婚后一直相亲相爱。只是岁月一年年过去，他们始终没有孩子。夫妻俩盼着有个孩子承欢膝下，延续家名，日后也能供奉祖先。这一桩缺憾，让他们拥有的其他福分都失去了光彩。
        - id: ch01-b02
          speaker: narrator
          text: 夫妻俩思量了很久，决定去长谷观音寺朝拜。他们相信，慈悲的观音会化作凡人最需要的模样，回应诚心的祈求。而他们最需要的，正是一个心爱的孩子。丰成亲王与紫姬便住进寺中，日日焚香，祈求观音成全这个一生的心愿。后来，他们的祈求真的得到了回应。
        - id: ch01-b03
          speaker: narrator
          text: 紫姬终于生下一个女儿，心里的欢喜简直无法形容。她把孩子抱到丈夫面前，夫妻俩认定这孩子是长谷观音所赐，便为她取名长谷姬，也就是长谷公主。他们精心抚养女儿，处处温柔照料，孩子也一天比一天健壮美丽。
        - id: ch01-b04
          speaker: narrator
          text: 长谷姬五岁那年，紫姬忽然身染重病。大夫们用尽办法，仍旧救不了她。临终前，她把女儿叫到床边，轻轻抚摸着孩子的头。
        - id: ch01-b05
          speaker: princess_murasaki
          text: 长谷姬，你知道阿母不能再陪你多久了吗？我走以后，你一定要长成一个好姑娘，别给乳母和家里人添麻烦。将来你阿父也许会再娶，让另一个人代替阿母照料你。到了那一天，不要只顾着为我伤心，要把她当成亲生母亲，对她和阿父都孝顺听话。等你长大了，要敬重尊长，也要善待身边地位不如你的人。千万记住这些话。阿母只盼你将来成为人人称道的好女子。
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: 长谷姬恭敬地听完母亲的话，答应每一件事都照着去做。人们常说，三岁便能看出一个人老来的品性。长谷姬果真没有辜负母亲的心愿，渐渐长成善良听话的小公主。只是那时的她太年幼，还不懂失去母亲意味着多大的悲伤。
        - id: ch01-b07
          speaker: narrator
          text: 紫姬去世后不久，丰成亲王续娶了一位名叫照手姬的名门女子。她与贤慧的紫姬完全不同，心肠残忍恶毒。她不爱这个没娘的继女，还常常苛待她，心里总反复念着同一句话。
        - id: ch01-b08
          speaker: princess_terute
          text: 她不是我的孩子！她不是我的孩子！
          emotion: disgusted
        - id: ch01-b09
          speaker: narrator
          text: 长谷姬把每一次刁难都耐心忍了下来。她仍旧亲切地侍奉继母，事事听从，从不惹出麻烦。亲生母亲从前怎样教导，她便怎样做人。因此，照手姬无论怎样挑剔，也找不到可以责怪她的地方。

    - id: ch02
      title: 宫中的琴声与毒酒
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小公主勤奋好学，最喜欢音乐和诗歌，每天都要练习好几个时辰。父亲为她请来最好的老师，教她弹琴，也教她写书信、作诗。到了十二岁，她琴艺出众，宫中召她和继母一同入宫，要她们在天皇面前演奏。
        - id: ch02-b02
          speaker: narrator
          text: 那天正逢樱花节，宫里一片欢庆。天皇也兴致极好，下旨让长谷姬弹琴，让照手姬吹笛伴奏。他端坐在高台上，面前垂着细竹篾编成的帘子，帘下缀着紫色流苏。这样，天皇看得见所有人，寻常臣民却不能看见他神圣的容颜。
        - id: ch02-b03
          speaker: narrator
          text: 长谷姬年纪虽小，记性和天分都很惊人，常常让老师们赞叹。如此重大的场合，她依然弹得极好。照手姬平日懒得练习，笛声吹到一半便乱了，只好请一位宫女接替。这场失败让她颜面尽失。继女成功，自己却出了丑，她已经妒火中烧，偏偏天皇又赏赐长谷姬许多珍美的礼物，嘉奖她的演奏。
        - id: ch02-b04
          speaker: narrator
          text: 照手姬此时还有了一个儿子。望着自己的孩子，她又添了一重憎恨，暗暗想着。
        - id: ch02-b05
          speaker: princess_terute
          text: 要是长谷姬不在了，我的儿子就能独占阿父的疼爱。
        - id: ch02-b06
          speaker: narrator
          text: 她从来不肯克制自己，任凭这个恶念越长越大，最后竟决意杀死继女。一天，她偷偷命人取来毒药，掺进甜酒，装入一个瓶中。另一个一模一样的瓶子里，她倒的是普通甜酒。
        - id: ch02-b07
          speaker: narrator
          text: 五月初五的男孩节到了。长谷姬正陪年幼的弟弟玩，孩子的武士和英雄玩偶陈列了一地。她指着一个个玩偶讲故事，姐弟俩和侍从们笑得十分开心。照手姬就在这时走进屋里，手上带着两瓶酒和美味的糕点。
        - id: ch02-b08
          speaker: princess_terute
          text: 你们两个这么乖，又玩得这么开心，我带了甜酒来奖赏你们。这里还有好吃的糕点，都是给我的好孩子的。
        - id: ch02-b09
          speaker: narrator
          text: 她笑着从两个瓶里各倒出一杯。长谷姬哪里想得到，继母正在演一出可怕的戏。她拿起一杯，把另一杯递给异母弟弟，因为那杯酒本来就是替他倒的。
        - id: ch02-b10
          speaker: narrator
          text: 照手姬原本仔细标出了毒酒瓶，可她进屋后心中紧张，倒得又太匆忙，竟把有毒的酒给了亲生儿子。她焦急地盯着长谷姬，却见姑娘脸上毫无变化。忽然，小男孩惨叫着倒在地上，身子疼得蜷成一团。照手姬扑过去抱起孩子，还没忘记先打翻带来的两个小酒瓶。
        - id: ch02-b11
          speaker: narrator
          text: 侍从赶紧去请大夫，可是谁也救不了他。不到一个时辰，男孩便死在母亲怀里。古时候的大夫医术有限，众人只以为甜酒让孩子身体不适，引起抽搐，才夺走了他的性命。
        - id: ch02-b12
          speaker: narrator
          text: 照手姬想害死继女，却失去了自己的骨肉，这正是她的恶行招来的惩罚。可她不肯责怪自己，内心的痛苦和怨毒反倒让她更加憎恨长谷姬。从此，她时时等着再下毒手，只是这个机会很久都没有到来。

    - id: ch03
      title: 平息龙田川
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 长谷姬十三岁时，已经成了颇有名气的女诗人。古时的日本女子很看重诗才，许多人都用心学习诗歌。这一年，奈良进入雨季，附近每天都有洪水造成灾害。流经皇宫苑内的龙田川涨到了堤岸顶端。洪流挤过狭窄的河床，日夜发出震耳的轰鸣，搅得天皇不能安睡，最后竟患上严重的神经疾病。
        - id: ch03-b02
          speaker: narrator
          text: 朝廷向所有佛寺颁下诏书，命僧侣们不停祈求上天，让洪水安静下来。可这些祈祷没有一点效验。于是，宫中渐渐传开一种议论。有人说，次席大臣丰成亲王的女儿虽然年轻，却是当世最有才华的女诗人，她的老师也肯定了这种说法。
        - id: ch03-b03
          speaker: narrator
          text: 古代传记记载，美丽多才的小野小町曾经写诗祈祷，感动了上天，为一片久旱的土地唤来雨水。那么，由长谷姬写诗献上，会不会也能让龙田川停止怒吼，除去天皇患病的根源呢？这番议论传到天皇耳中，他便照此下旨，命丰成亲王的女儿作诗祈祷。
        - id: ch03-b04
          speaker: narrator
          text: 父亲把朝廷的要求告诉长谷姬，她又惊又怕。这个责任沉沉压在一个年轻姑娘的肩上。她必须凭自己的诗，挽救天皇的性命。
        - id: ch03-b05
          speaker: narrator
          text: 到了约定的日子，诗终于写成了，落在一张撒满金屑的纸笺上。长谷姬在父亲、侍从和几位朝臣的陪同下，走到轰鸣的洪流岸边。她心向苍天，双手把纸笺高高捧起，朗声诵读自己的诗。
        - id: ch03-b06
          speaker: narrator
          text: 一桩奇事就在众人眼前发生了。河水仿佛听见她的祈求，停止怒吼，渐渐平静。没过多久，天皇也恢复了健康。
        - id: ch03-b07
          speaker: narrator
          text: 天皇十分欢喜，召长谷姬入宫，赐给她“镇将”的名位，也就是中将的官阶。从那以后，人们便叫她镇将姬，也就是中将公主。无论走到哪里，她都受到敬重与爱戴。
        - id: ch03-b08
          speaker: narrator
          text: 只有照手姬不为这份荣耀高兴。她本想毒死继女，却亲手害死了自己的孩子，日日受这段往事折磨。如今，她又看着长谷姬获得权位与荣誉，得到天皇宠爱，受满朝赞赏，心中的羡妒像烈火一样燃烧。她一次次在丈夫面前捏造长谷姬的坏话，丰成亲王却一句也不肯听，总是严厉地斥责她，说她完全错了。

    - id: ch04
      title: 云雀山中的流放
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 照手姬终于等到丈夫离家。她命老仆加藤田把无辜的长谷姬带到国内最荒凉的云雀山，在那里将她杀死。为了让命令听来像是迫不得已，她还编出一件骇人的丑事诬陷小公主，声称只有杀了姑娘，才能保住家族的名声。
        - id: ch04-b02
          speaker: narrator
          text: 加藤田是家臣，不能公然违抗女主人。他知道姑娘的父亲不在，假装服从才是最稳妥的办法，便让长谷姬坐进轿子，陪她走进荒山最偏僻的地方。可怜的姑娘明白，继母用这种怪异的方式赶她离家，无论怎样抗议都不会有用，于是安静地听从了安排。
        - id: ch04-b03
          speaker: narrator
          text: 老仆很清楚，继母为了掩饰残忍的命令，向他编造的所有罪名都是假的，长谷姬完全无辜。他决心保住公主的性命。可是，只要姑娘还活着，他就不能回去见那位狠毒的女主人，只好一同留在荒野。
        - id: ch04-b04
          speaker: narrator
          text: 加藤田请几位农人帮忙，很快在荒野中盖起一间小屋，又暗中捎信叫妻子赶来。两位善良的老人从此陪着长谷姬住下，竭尽全力照顾这位落难的公主。长谷姬始终相信父亲。只要父亲回到家，发现女儿失踪，他一定会到处寻找，绝不会丢下她不管。
        - id: ch04-b05
          speaker: narrator
          text: 几个星期后，丰成亲王回来了。照手姬告诉他，女儿犯下过错，害怕受罚，已经逃走。亲王焦急得几乎病倒，可府中每个人都说同样的话，只知道长谷姬突然不见了，不知为了什么，也不知去了哪里。亲王怕事情传开，便暗中寻找。他把能想到的地方找了个遍，仍旧没有女儿的消息。
        - id: ch04-b06
          speaker: narrator
          text: 一天，亲王想暂且摆脱这份折磨，便召集部下，吩咐他们准备进山围猎几日。众人很快骑马等在门外。他策马奔向云雀山，大队人马跟随在后。亲王越跑越快，不久就把所有人甩在远处，独自进了一条狭窄秀美的山谷。
        - id: ch04-b07
          speaker: narrator
          text: 他正四下欣赏山中景色，忽然看见附近山坡上有一间小屋，又听见清亮美妙的朗读声。这样偏僻的地方，会是谁还在用功读书呢？亲王满心好奇，翻身下马，把坐骑交给马夫，独自沿山坡走向小屋。
        - id: ch04-b08
          speaker: narrator
          text: 越是靠近，他越觉得惊奇。屋里坐着一位美丽的姑娘，门窗大开，她面向山景，虔诚地诵读佛经。亲王连忙穿过小门，踏入庭院，抬头竟看见了失踪许久的长谷姬。姑娘读得太专心，直到父亲开口，才发现他已经来到身边。
        - id: ch04-b09
          speaker: prince_toyonari
          text: 长谷姬！真的是你，我的长谷姬！
          emotion: surprised
        - id: ch04-b10
          speaker: narrator
          text: 这声呼唤来得太突然。长谷姬简直不敢相信，眼前的人真是自己深爱的父亲。一时之间，她既说不出话，也动弹不得。
        - id: ch04-b11
          speaker: hase_hime
          text: 阿父，阿父！真的是您——啊，阿父！
          emotion: surprised
        - id: ch04-b12
          speaker: narrator
          text: 她扑到父亲身边，抓住那宽大的衣袖，把脸深深埋进去，放声痛哭。亲王抚摸着女儿乌黑的头发，柔声请她讲出事情的始末。可她只是哭个不停，父亲甚至怀疑，自己是不是还在梦中。
        - id: ch04-b13
          speaker: narrator
          text: 忠心的加藤田这才从屋里走出，伏在地上叩拜主人。他把这段漫长的冤屈从头讲起，将发生过的一切一一说清，也解释了自己为什么只能假装奉命行事。亲王终于知道，女儿怎么会落到这片荒凉偏僻的山里，身边只剩两位年老的仆人照料。

    - id: ch05
      title: 重返家园
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 丰成亲王听完，又震惊又愤怒。他立刻放弃围猎，带着女儿赶回家去。队伍中一人先骑快马回府，把这个喜讯告诉众人。照手姬得知恶行败露，害怕再见丈夫，便逃出家门，羞惭地回了娘家。此后，再没有人听到她的消息。
        - id: ch05-b02
          speaker: narrator
          text: 加藤田得到了主人最高的升赏，此后一生幸福安稳。他直到晚年都忠心侍奉小公主，而长谷姬也从未忘记，是这位老家臣救下了自己的性命。恶毒的继母不再来折磨她，她终于能陪着父亲，平静快乐地生活。
        - id: ch05-b03
          speaker: narrator
          text: 丰成亲王没有儿子，便收养了一位朝廷贵族的幼子，让他日后继承家业，也让他与长谷姬成婚。几年以后，两人果然结为夫妻。长谷姬一直活到很高的年纪。人人都说，丰成亲王这个古老家族里，从未有过比她更贤慧、更虔诚、更美丽的女主人。
        - id: ch05-b04
          speaker: narrator
          text: 就在亲王辞官归隐以前，长谷姬还把自己的儿子抱到父亲面前。这个孩子将来会成为全家的主人，亲王终于亲眼看到了家族的未来，长谷姬也为能给父亲这份安慰而满心喜悦。
        - id: ch05-b05
          speaker: narrator
          text: 直到今天，京都一座佛寺里仍珍藏着一幅精美的织锦。锦上绣着佛像，绣线竟是从莲花茎里抽出的细丝。据说，这件奇美的刺绣，正是善良的长谷姬亲手完成的。
