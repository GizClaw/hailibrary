audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    hojo:
      display_name: 保昌
      tts:
        delivery: 豪爽坦率，受到质疑时毫不退让
        timbre: 明亮厚实的成年男声
        pace: 适中
        pitch: 中音
    watanabe:
      display_name: 渡边
      tts:
        delivery: 英武果断，自信中带着武士的骄傲
        timbre: 坚实洪亮的成年男声
        pace: 稳健有力
        pitch: 中低音
    servant:
      display_name: 仆人
      tts:
        delivery: 恭敬谨慎，禀报时简洁清楚
        timbre: 平实清晰的年轻男声
        pace: 适中
        pitch: 中音
    ogre:
      display_name: 恶鬼
      tts:
        delivery: 伪装时慈祥恳切，现出原形后凶厉震耳
        timbre: 可由苍老女声骤变为粗哑低沉的怪声
        pace: 伪装时舒缓，现形时急促有力
        pitch: 伪装时中高音，现形后低音
  chapters:
    - id: ch01
      title: 京都的传闻
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，京都城里流传着一桩骇人的传闻。每到黄昏，就有一只可怕的恶鬼出没在罗生门下，抓走所有从那里经过的人。那些人一去便再没有回来。大家私下说，那是一只吃人的恶鬼。它会杀掉捉来的可怜人，再把他们吞进肚里。城里城外人心惶惶，太阳一落山，谁也不敢走近罗生门。
        - id: ch01-b02
          speaker: narrator
          text: 当时，京都住着一位名叫赖光的大将。他英勇善战，名扬天下。不久以前，大江山上盘踞着一群恶鬼，为首的鬼王不喝酒，专喝人血。赖光率人攻上山去，把群鬼杀得大败，还斩下了鬼王的首级。从此，全国都传颂着他的威名。
        - id: ch01-b03
          speaker: narrator
          text: 赖光身边总有一班忠心的武士跟随，其中五个人尤其骁勇。一天晚上，五名武士设宴相聚。他们用饭碗畅饮清酒，吃着生的、炖的、烤的各色鱼肴，举杯祝愿彼此安康，又谈起各人立下的功劳。席间，保昌先开了口。
        - id: ch01-b04
          speaker: hojo
          text: 你们都听说了吗？每天太阳落山以后，就有恶鬼来到罗生门，把过路的人抓走。
        - id: ch01-b05
          speaker: narrator
          text: 渡边立刻摇头。他根本不信这回事。
        - id: ch01-b06
          speaker: watanabe
          text: 别说这种荒唐话！大江山的恶鬼早被主公赖光杀尽了。就算当时真有漏网的，它们也不敢跑到京都来。只要主公听说还有恶鬼活着，马上就会去讨伐它们！
        - id: ch01-b07
          speaker: hojo
          text: 这么说，你不相信我，觉得我在撒谎？
        - id: ch01-b08
          speaker: watanabe
          text: 我没说你撒谎。你不过是听来了老婆婆讲的闲话，那种话不值得相信。
        - id: ch01-b09
          speaker: hojo
          text: 要弄清我说的是真是假，办法很简单。你亲自去一趟，自己看个明白。
        - id: ch01-b10
          speaker: narrator
          text: 渡边最受不了同伴把自己当成胆小鬼，一听这话，立刻答应下来。
        - id: ch01-b11
          speaker: watanabe
          text: 去就去！我现在便亲眼瞧瞧！
        - id: ch01-b12
          speaker: narrator
          text: 渡边马上佩好长刀，披上铠甲，又把硕大的头盔系牢。等一切准备妥当，他转身问其余四人。
        - id: ch01-b13
          speaker: watanabe
          text: 给我一样东西，好让我证明自己的确去过那里！
        - id: ch01-b14
          speaker: narrator
          text: 一名武士取来一卷纸，又拿出墨盒和毛笔。四位同伴在纸上写下各自的名字，把它交给渡边。
        - id: ch01-b15
          speaker: watanabe
          text: 我把这张纸贴在罗生门上。明天一早，你们都去看看。说不定到那时候，我已经捉住一两只恶鬼了！
        - id: ch01-b16
          speaker: narrator
          text: 说完，渡边翻身上马，英姿勃勃地驰进夜色。
    - id: ch02
      title: 罗生门下的恶战
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那一夜漆黑如墨，天上没有月亮，也没有星光替渡边照路。偏偏暴风雨又来了。大雨倾盆而下，狂风像山中的狼群一样号叫。换作寻常人，只要想到这种夜里还得出门，早就怕得发抖。可渡边无所畏惧，眼下又关系到他的名誉和诺言，便策马冲入黑夜。同伴们听着马蹄声越来越远，这才关紧拉门，围坐在炭火旁。他们都在猜，渡边究竟会遇到什么，会不会真的撞见那些可怕的恶鬼。
        - id: ch02-b02
          speaker: narrator
          text: 渡边终于来到罗生门。他睁大眼睛，在黑暗中看了又看，却找不到半点恶鬼的踪影。
        - id: ch02-b03
          speaker: watanabe
          text: 果然跟我想的一样，这里根本没有恶鬼，不过是老婆婆编出的闲话。我把纸贴在门上，明天他们一看，就知道我确实来过。等我回去，非好好笑他们一场不可。
        - id: ch02-b04
          speaker: narrator
          text: 渡边把写着四位同伴姓名的纸贴在门上，随后拨转马头，准备回家。就在这时，他忽然察觉身后有什么东西。一个声音叫他站住，紧接着，有人从后面一把抓住了他的头盔。
        - id: ch02-b05
          speaker: watanabe
          text: 你是谁？
        - id: ch02-b06
          speaker: narrator
          text: 渡边毫无惧色，伸手向身后摸去，想弄清究竟是什么抓着自己。他摸到了一条仿佛手臂的东西。那东西长满粗毛，足有树干那么粗！渡边马上明白了。这正是恶鬼的胳膊。他拔出长刀，使尽力气砍了过去。
        - id: ch02-b07
          speaker: narrator
          text: 一声痛苦的嚎叫震耳欲聋。恶鬼随即蹿到武士面前。渡边惊得睁大双眼。那恶鬼比高大的城门还要魁伟，一双眼睛好似阳光下的明镜，闪着灼人的光。它张开血盆大口，每喘一口气，嘴里便喷出熊熊火焰。
        - id: ch02-b08
          speaker: narrator
          text: 恶鬼原想把对手吓倒，渡边却连一步也没有退。他使出浑身力气猛攻上去，一人一鬼面对面恶战了许久。恶鬼渐渐发现，自己既吓不倒渡边，也胜不了他，再打下去反而可能落败。它转身就逃。渡边决意不让妖怪脱身，狠狠一踢马腹，追了上去。
        - id: ch02-b09
          speaker: narrator
          text: 武士的坐骑跑得飞快，恶鬼却比马更快。渡边始终追不上，只能眼看着那怪物渐渐消失在夜色里，心中大失所望。
        - id: ch02-b10
          speaker: narrator
          text: 他回到刚才激战的罗生门，下马察看。脚才落地，就被一样东西绊住了。渡边弯腰拾起一看，原来是恶鬼的一条巨臂。想必刚才交战时，他的长刀已经把它砍了下来。
        - id: ch02-b11
          speaker: narrator
          text: 渡边喜不自胜。再没有什么能比这条鬼臂更有力地证明，他真的在罗生门遇见了恶鬼。他小心捧起断臂，把它当作胜利的凭证，带回了家。
        - id: ch02-b12
          speaker: narrator
          text: 四位同伴看见鬼臂，一致称渡边是他们之中的英雄，还为他大摆筵席。这桩奇功很快传遍京都，远近的人纷纷赶来，都想亲眼看看恶鬼的手臂。
    - id: ch03
      title: 深夜来访的乳母
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 热闹过后，渡边却开始发愁。这条手臂该怎样保管才安全呢？他知道那只恶鬼还活着，也料定它从惊恐中缓过来以后，迟早会设法夺回自己的胳膊。
        - id: ch03-b02
          speaker: narrator
          text: 渡边命人用最坚硬的木料造了一只箱子，外面再箍上铁条。他把鬼臂放进去，合上沉重的箱盖，严严实实地封住。无论谁来请求，他都不肯开启。箱子一直摆在自己的房里，由他亲自看管，从不让它离开视线。
        - id: ch03-b03
          speaker: narrator
          text: 一天夜里，门廊外忽然传来敲门声。有人站在那里，请求入内。仆人走去开门，只见外面站着一位衣着端庄、举止得体的老妇。
        - id: ch03-b04
          speaker: servant
          text: 请问您是谁？这么晚来，有什么事吗？
        - id: ch03-b05
          speaker: ogre
          text: 我是你家主人小时候的乳母。若少爷正在家里，就请让我见他一面吧。
        - id: ch03-b06
          speaker: narrator
          text: 老妇说话时面带微笑。仆人让她留在门外，自己进去禀告。渡边听说许久未见的老乳母深夜来访，起初觉得有些奇怪。可是他想起，自己小时候，乳母待他如同亲生母亲，心里顿时涌起一股温情，便叫仆人把她请进来。
        - id: ch03-b07
          speaker: narrator
          text: 老妇被领进屋里。两人照着礼数行礼，又彼此问候了一番。随后，老妇开口了。
        - id: ch03-b08
          speaker: ogre
          text: 少爷，您在罗生门勇斗恶鬼的事已经传遍了，就连您这可怜的老乳母也听说了。人人都说，您砍下了恶鬼的一条胳膊。这是真的吗？若是真的，这番壮举可太值得称颂了！
        - id: ch03-b09
          speaker: watanabe
          text: 我本来想活捉那妖怪，结果只砍下它一条胳膊，没能如愿，实在叫人失望！
        - id: ch03-b10
          speaker: ogre
          text: 少爷竟敢砍下恶鬼的手臂，老身真为您骄傲。世上再没有谁的勇气能和您相比了。我这一生最大的心愿，就是在死前亲眼看看那条鬼臂。求您让我看一眼吧。
        - id: ch03-b11
          speaker: watanabe
          text: 不成。实在抱歉，这个请求我不能答应。
        - id: ch03-b12
          speaker: ogre
          text: 可这是为什么呢？
        - id: ch03-b13
          speaker: watanabe
          text: 恶鬼最会记仇。箱子一开，谁也不知道它会不会突然现身，把自己的手臂抢走。我特意叫人造了结实的箱子，又配上牢固的盖子，才把鬼臂安全锁在里面。无论发生什么，我都不会拿给任何人看。
        - id: ch03-b14
          speaker: ogre
          text: 您这样谨慎，当然很有道理。可我是您的老乳母，您总不至于连我也不肯给看吧？我才刚听说您的英勇事迹，连天亮都等不得，这才马上赶来求您。
        - id: ch03-b15
          speaker: narrator
          text: 老妇一再央求，渡边心里十分为难，却仍坚持不肯答应。见他不肯松口，老妇又问了一句。
        - id: ch03-b16
          speaker: ogre
          text: 莫非您怀疑，我是恶鬼派来的奸细？
        - id: ch03-b17
          speaker: watanabe
          text: 不，我当然不会这样疑心。你是我的老乳母啊。
        - id: ch03-b18
          speaker: ogre
          text: 既然如此，您总不能再拒绝我了吧。我这辈子只盼着能亲眼看一次恶鬼的手臂！
        - id: ch03-b19
          speaker: narrator
          text: 渡边终于经不住她苦苦哀求，只得让步。
        - id: ch03-b20
          speaker: watanabe
          text: 你既然这么想看，我就让你看看鬼臂。来，跟我走吧！
        - id: ch03-b21
          speaker: narrator
          text: 渡边在前面带路，老妇跟着他走进卧房。
    - id: ch04
      title: 恶鬼夺回手臂
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 两人进屋以后，渡边小心关好房门，走到墙角的大箱子旁，揭开沉重的箱盖。他从不把鬼臂取出箱外，只叫老妇靠近些，探头往里面看。
        - id: ch04-b02
          speaker: ogre
          text: 它究竟是什么模样？快让我仔仔细细地瞧一瞧。
        - id: ch04-b03
          speaker: narrator
          text: 老乳母满脸欢喜，却又装出害怕的样子。她一步一步挨近箱子，直到身子紧贴着箱沿。突然，她猛地把手伸进箱内，一把抓住了那条鬼臂。随后，一个可怕的声音响了起来，震得整间屋子都在颤动。
        - id: ch04-b04
          speaker: ogre
          text: 太好了！我的手臂终于回来了！
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: 眨眼之间，老妇不见了。站在原地的，竟是那只高耸骇人的恶鬼！渡边猛地向后一跃。他惊愕万分，一时竟动弹不得。可他很快认出，这正是在罗生门袭击自己的恶鬼。渡边又鼓起往日的勇气，决心这一次非把它杀掉不可。
        - id: ch04-b06
          speaker: narrator
          text: 他一把握住刀柄，长刀闪电般出鞘，迎头向恶鬼斩去。渡边出刀快极了，恶鬼险些没能躲开。可它纵身跃上屋顶，猛地撞破房顶，逃进了雾霭和云层。转眼之间，便消失得无影无踪。
        - id: ch04-b07
          speaker: narrator
          text: 就这样，恶鬼带着自己的手臂逃走了。渡边懊恼得咬牙切齿，却也无可奈何，只得耐心等待下一次诛杀恶鬼的机会。
        - id: ch04-b08
          speaker: narrator
          text: 然而，恶鬼惧怕渡边神勇过人，从此再也不敢来京都作乱。城中百姓终于又能在夜间安心出门，而渡边的英勇事迹，也世世代代流传了下来！
