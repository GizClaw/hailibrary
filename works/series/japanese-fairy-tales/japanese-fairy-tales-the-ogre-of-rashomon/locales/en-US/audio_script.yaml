audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, thoughtful, and direct
        timbre: clear and gentle
        pace: measured
        pitch: medium
    hojo:
      display_name: Hojo
      tts:
        delivery: confident, challenging, and good-humored
        timbre: clear and sturdy
        pace: moderate
        pitch: medium-low
    watanabe:
      display_name: Watanabe
      tts:
        delivery: fearless, proud, and resolute
        timbre: strong and resonant
        pace: moderate
        pitch: medium-low
    ogre:
      display_name: Ogre
      tts:
        delivery: cunning and coaxing in disguise, fierce when revealed
        timbre: aged and gentle at first, then deep and harsh
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: The Knights' Challenge
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago in Kyoto, dreadful stories spread about an ogre at the Gate of Rashomon. People said it haunted the gate at twilight and seized anyone who passed that way. Its victims disappeared and were never seen again. Soon people were whispering that the horrible creature not only killed those unhappy travelers, but ate them too. Fear filled the city and the country around it. Once the sun had set, no one dared venture near the Gate of Rashomon.
        - id: ch01-b02
          speaker: narrator
          text: >-
            A famous general named Raiko lived in Kyoto then. His courage was known across the land. Not long before, he had attacked Oeyama, where a band of ogres lived under a chief who drank human blood instead of wine. Raiko had defeated them all and cut off their chief's head.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Raiko was always attended by a band of faithful warriors. Among them were five knights of remarkable courage. One evening, those five sat together at a feast. They drank sake from rice bowls and ate every sort of fish, some raw, some stewed, and some broiled. As they raised their bowls, they toasted one another's health and celebrated their brave deeds. Then Hojo, the first knight, brought up the rumor that had frightened Kyoto.
        - id: ch01-b04
          speaker: hojo
          text: >-
            Have you heard what people are saying? Every night after sunset, an ogre comes to the Gate of Rashomon and carries off anyone who passes.
        - id: ch01-b05
          speaker: watanabe
          text: >-
            What nonsense! Our master Raiko killed the ogres at Oeyama. Even if some escaped, they would never show themselves in this city. They know he would attack them the moment he heard they were alive.
        - id: ch01-b06
          speaker: hojo
          text: >-
            So you don't believe me? Do you think I'm making it up?
        - id: ch01-b07
          speaker: watanabe
          text: >-
            I don't think you're lying. I think you've heard an old woman's tale that isn't worth believing.
        - id: ch01-b08
          speaker: hojo
          text: >-
            Then go to the gate yourself. You can find out whether the story is true.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Watanabe could not bear to let his companion think he was afraid. He answered at once.
        - id: ch01-b10
          speaker: watanabe
          text: >-
            Of course I'll go. I'll leave now and see for myself!
        - id: ch01-b11
          speaker: narrator
          text: >-
            Watanabe buckled on his long sword, put on his armor, and tied on his great helmet. When he was ready, he turned to the others.
        - id: ch01-b12
          speaker: watanabe
          text: >-
            Give me something I can leave there as proof.
        - id: ch01-b13
          speaker: narrator
          text: >-
            One knight brought writing paper, ink, and brushes. The four companions wrote their names on a sheet and handed it to him.
        - id: ch01-b14
          speaker: watanabe
          text: >-
            I'll fasten this to the Gate of Rashomon. Go and look for it tomorrow morning. By then, perhaps I'll have caught an ogre or two!
        - id: ch01-b15
          speaker: narrator
          text: >-
            With that, Watanabe mounted his horse and gallantly rode away.
    - id: ch02
      title: The Battle at Rashomon
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The night was black, without a moon or star to show Watanabe the road. Then a storm swept in and made the darkness worse. Rain poured down, and the wind howled like wolves in the mountains. An ordinary man might have trembled at the very thought of going outdoors on such a night. But Watanabe was a brave and fearless warrior. His honor and his promise to the other knights were at stake, so he urged his horse onward through the storm.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Back at the house, his companions listened until the beat of his horse's hooves faded far away. They closed the sliding shutters, gathered around the charcoal fire, and wondered what would happen. Would their friend truly meet one of those terrible oni?
        - id: ch02-b03
          speaker: narrator
          text: >-
            At last, Watanabe reached the Gate of Rashomon. He stared into the darkness from every angle, but he saw no ogre anywhere.
        - id: ch02-b04
          speaker: watanabe
          text: >-
            Just as I thought. There are no ogres here. It's only an old woman's story. I'll put the paper on the gate, and when the others find it tomorrow, they'll know I came. Then I'll ride home and laugh at every one of them.
        - id: ch02-b05
          speaker: narrator
          text: >-
            He fixed the sheet bearing his four companions' names to the gate. Then he turned his horse toward home.
        - id: ch02-b06
          speaker: narrator
          text: >-
            At that moment, Watanabe sensed someone behind him. A voice ordered him to wait, and a hand caught the back of his helmet.
        - id: ch02-b07
          speaker: watanabe
          text: >-
            Who are you?
        - id: ch02-b08
          speaker: narrator
          text: >-
            Without a trace of fear, Watanabe reached behind him. He groped through the darkness, trying to discover who or what had caught his helmet. His hand touched something shaped like an arm, but no human arm was ever like this one. It was covered in hair and as thick around as the trunk of a tree.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Watanabe knew at once that it was an ogre's arm. He drew his sword and struck at it with all his force. A terrible cry of pain rang out, and the ogre rushed around to face him.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Watanabe stared in wonder. The ogre stood taller than the great gate. Its eyes flashed like mirrors in sunlight, and its enormous mouth gaped wide. Each time the monster breathed, flames shot from its mouth.
        - id: ch02-b11
          speaker: narrator
          text: >-
            The ogre showed itself in all its horror because it meant to frighten its enemy. But Watanabe did not flinch. He attacked with all his strength, and warrior and monster fought face-to-face for a long time. At last, the ogre understood that it could neither frighten Watanabe nor beat him. If the battle continued, the creature itself might be defeated. With that, the ogre turned and fled into the darkness.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Watanabe would not willingly let it escape. He drove his spurs into his horse and chased after it. The knight rode fast, but the ogre ran faster. To his bitter disappointment, the monster drew farther away until it vanished from sight.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Watanabe returned to the gate where they had fought and dismounted. His foot struck something on the ground. He bent down and discovered one of the ogre's huge arms. His sword must have cut it off during the fight.
        - id: ch02-b14
          speaker: narrator
          text: >-
            Watanabe was overjoyed to have secured such a prize. Nothing could prove his encounter with the ogre better than the creature's own severed arm. He carefully lifted the enormous thing, took it with him, and carried it all the way home as the trophy of his victory.
    - id: ch03
      title: The Arm in the Iron-Banded Box
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            When Watanabe returned, he showed the enormous arm to his companions. Every one of them called him the hero of their band, and they honored him with a great feast. It was not long before news of his wonderful deed spread all through Kyoto. People came from near and far, eager to see the arm that the brave knight had cut from the ogre at Rashomon.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Before long, Watanabe began to worry about guarding it. The ogre was still alive. Once its fear had passed, he felt sure it would try to recover what it had lost.
        - id: ch03-b03
          speaker: narrator
          text: >-
            So Watanabe ordered a box made from the strongest wood and bound all around with iron. He placed the ogre's arm inside, lowered the heavy lid, and sealed it down. He refused to open the box for anyone. It remained in his own room, and he took charge of it himself. He never allowed the box out of his sight.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Then, one night, someone knocked at the porch and asked to be admitted. The servant went to the door and found a respectable-looking old woman. With a smile, she said she had nursed the master of the house when he was a baby. If he was home, she begged to see him.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The servant left her waiting at the door and carried the message to Watanabe. He found it strange that she had come at that hour of the night. Yet the thought of his old nurse stirred a tender feeling in his heart. He had not seen her for many years, and when he was small, she had cared for him like a foster mother. So Watanabe ordered the servant to bring her in.
        - id: ch03-b06
          speaker: narrator
          text: >-
            After the old woman entered, they exchanged the proper bows and greetings. Then she explained why she had come.
        - id: ch03-b07
          speaker: ogre
          text: >-
            Master, word of your brave fight at the Gate of Rashomon has traveled so far that even your poor old nurse has heard it. Is it really true that you cut off an ogre's arm? If it is, you deserve the highest praise!
        - id: ch03-b08
          speaker: watanabe
          text: >-
            I wanted to capture the monster. I was disappointed to come away with only its arm.
        - id: ch03-b09
          speaker: ogre
          text: >-
            I am so proud that my master dared to cut off an ogre's arm. No courage could be greater than yours. Before I die, there is one thing I long to do. Please let me see the arm.
        - id: ch03-b10
          speaker: watanabe
          text: >-
            No. I'm sorry, but I cannot do that.
        - id: ch03-b11
          speaker: ogre
          text: >-
            But why not?
        - id: ch03-b12
          speaker: watanabe
          text: >-
            Ogres are vengeful creatures. If I open the box, the ogre might suddenly appear and carry its arm away. I had a special box made with a very strong lid, and the arm stays safely inside it. Whatever happens, I show it to no one.
        - id: ch03-b13
          speaker: ogre
          text: >-
            That is a sensible precaution. But I am your old nurse. Surely you would show it to me. I heard about your brave deed only tonight, and I could not even wait until morning before coming to ask.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Her pleading troubled Watanabe, but he continued to refuse. The old woman pressed him again.
        - id: ch03-b15
          speaker: ogre
          text: >-
            Do you think the ogre sent me here as a spy?
        - id: ch03-b16
          speaker: watanabe
          text: >-
            Of course not. You are my old nurse. I would never suspect you of spying for the ogre.
        - id: ch03-b17
          speaker: ogre
          text: >-
            Then please don't refuse me any longer. Just once before I die, I want to see an ogre's arm with my own eyes.
    - id: ch04
      title: The Ogre's Disguise
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            At last, Watanabe could resist her pleas no longer. He gave in.
        - id: ch04-b02
          speaker: watanabe
          text: >-
            Since you want so deeply to see it, I will show you the ogre's arm. Come with me.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Watanabe led the way to his own room, and the old woman followed close behind. Once they were both inside, he carefully shut the door. The great iron-banded box stood in one corner. Watanabe walked over to it and lifted off the heavy lid. Then he called the old woman closer so she could look down into the box. Even for her, he would not take the arm out.
        - id: ch04-b04
          speaker: ogre
          text: >-
            What does it look like? Let me see it properly.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Joy shone on the old nurse's face. She edged nearer and nearer, pretending to be afraid, until she stood against the box. Then she suddenly thrust in her hand and seized the arm. Her dreadful cry shook the room.
        - id: ch04-b06
          speaker: ogre
          text: >-
            At last! I have my arm back!
        - id: ch04-b07
          speaker: narrator
          text: >-
            In an instant, the old woman changed into the towering shape of the frightful ogre.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Watanabe sprang backward. His astonishment was so great that, for one moment, he could not move. Then he recognized the creature that had attacked him at the Gate of Rashomon. His usual courage returned, and he resolved to put an end to the ogre this time. He seized his sword, whipped it from its sheath in a flash, and tried to cut the monster down.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Watanabe moved so swiftly that the ogre barely escaped the blade. The creature leaped to the ceiling, burst through the roof, and disappeared among the mist and clouds.
        - id: ch04-b10
          speaker: narrator
          text: >-
            And so the ogre escaped with its arm. Watanabe could only grind his teeth in disappointment. There was nothing else he could do that night. Afterward, he waited patiently, hoping another chance would come for him to destroy the creature.
        - id: ch04-b11
          speaker: narrator
          text: >-
            That chance never came. The ogre feared Watanabe's strength and daring, and it never troubled Kyoto again.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Once more, the people of the city could go out at night without fear. And the brave deeds of Watanabe have never been forgotten.
