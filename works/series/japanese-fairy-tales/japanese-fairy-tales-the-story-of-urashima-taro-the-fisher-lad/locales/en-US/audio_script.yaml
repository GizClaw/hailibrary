  chapters:
    - id: ch01
      title: The Tortoise on the Shore
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago, a young fisherman named Urashima Taro lived in Mizu-no-ye, a little village on the coast of Japan in the province of Tango. His father had been a fisherman too, but Urashima's skill was greater still. In one day he could catch more bonito and tai than his companions caught in a week.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Yet the village knew him even better for his kind heart. Urashima had never harmed any creature, large or small. When he was a boy, the others laughed because he would not join their cruel games with animals. Instead, he always tried to stop them.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One soft summer evening, Urashima was walking home after a day's fishing when he came upon a group of children. They were all shouting at the tops of their voices, wild with excitement over something. He went closer to see what was happening and found them tormenting a tortoise. One boy dragged it one way, another pulled it back, a third struck it with a stick, and a fourth hammered its shell with a stone.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Urashima felt deeply sorry for the poor creature. He decided at once that he would save it.
        - id: ch01-b05
          speaker: urashima
          text: >-
            Boys, look what you're doing! If you treat that poor tortoise this way, it will soon die.
        - id: ch01-b06
          speaker: narrator
          text: >-
            His gentle warning made no difference. The boys were at an age when they found such cruelty amusing, and they went right on.
        - id: ch01-b07
          speaker: boy_1
          text: >-
            Why should we care if it lives or dies? Come on, boys. Keep going!
        - id: ch01-b08
          speaker: narrator
          text: >-
            They treated the tortoise even worse. Urashima paused to think. Perhaps he could persuade them to hand it over. He smiled kindly at them.
        - id: ch01-b09
          speaker: urashima
          text: >-
            I'm sure you're good, kind boys. Won't you let me have the tortoise? I would like it very much.
        - id: ch01-b10
          speaker: boy_2
          text: >-
            No, we won't! Why should we give it to you? We caught it ourselves.
        - id: ch01-b11
          speaker: urashima
          text: >-
            That's true, and I'm not asking you to give it away. This uncle will buy it from you. Would that suit you?
        - id: ch01-b12
          speaker: narrator
          text: >-
            He held up some coins. Each coin had a hole through its center, and they were strung together on a cord.
        - id: ch01-b13
          speaker: urashima
          text: >-
            See? You can buy whatever you like with this money. It will be much more useful to you than the poor tortoise. You're good boys for listening to me.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The boys were mischievous, but they were not truly bad. As people say in Japan, Urashima's warm smile and gentle words brought them around to his way of thinking. One by one they gathered close to him. At last, the leader of the little group came forward and held out the tortoise.
        - id: ch01-b15
          speaker: boy_1
          text: >-
            All right, Uncle. Give us the money, and you can have the tortoise!
        - id: ch01-b16
          speaker: narrator
          text: >-
            Urashima gave them the coins and took the tortoise. The boys called to one another as they raced away, and soon they were out of sight. Urashima gently stroked the creature's back.
        - id: ch01-b17
          speaker: urashima
          text: >-
            Oh, you poor thing. There, there. You're safe now. They say a stork lives for a thousand years, but a tortoise lives for ten thousand. You have the longest life of any creature in the world, and those cruel boys nearly cut that precious life short. Luckily, I came by in time. Now I'll take you straight home to the sea. Don't let anyone catch you again. Next time, there may be no one there to save you.
        - id: ch01-b18
          speaker: narrator
          text: >-
            All the while he was speaking, the kind fisherman walked quickly toward the shore. He made his way out over the rocks, bent down, and placed the tortoise gently in the water. Urashima stayed long enough to watch the creature swim out and disappear beneath the surface. Only then did he turn toward home. The sun had already set, and he was tired after his long day of fishing.
    - id: ch02
      title: Beneath the Summer Sea
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The next morning, Urashima went out in his boat as usual. The weather was fine. Both sea and sky looked soft and blue through the tender haze of the summer morning. Urashima climbed into his boat and pushed away from shore almost dreamily, casting his fishing line as he went. Before long, he had passed all the other fishing boats and left them behind. They grew smaller in the distance until he could no longer see them, while his own boat drifted farther and farther across the blue water.
        - id: ch02-b02
          speaker: narrator
          text: >-
            For some reason he could not explain, Urashima felt unusually happy. He found himself wishing that he, like the tortoise he had freed, might live for thousands of years instead of one short human lifetime.
        - id: ch02-b03
          speaker: otohime
          text: >-
            Urashima! Urashima!
        - id: ch02-b04
          speaker: narrator
          text: >-
            The call startled him out of his thoughts. Clear as a bell and soft as the summer wind, his name floated over the sea. Urashima stood and searched in every direction. He thought another boat might have caught up with him, but there was not one in sight, near or far. No human voice could have reached him there.
        - id: ch02-b05
          speaker: narrator
          text: >-
            He looked around again, wondering who or what had called. Without his noticing, a tortoise had come alongside the boat. To his amazement, it was the very tortoise he had rescued the evening before.
        - id: ch02-b06
          speaker: urashima
          text: >-
            Well, Mr. Tortoise, did you just call my name?
        - id: ch02-b07
          speaker: narrator
          text: >-
            The tortoise nodded several times.
        - id: ch02-b08
          speaker: otohime
          text: >-
            Yes, I did. Thanks to you, my life was saved yesterday. I've come to thank you and tell you how grateful I am for your kindness.
        - id: ch02-b09
          speaker: urashima
          text: >-
            That is very polite of you. Come aboard. I would offer you a smoke, but I suppose a tortoise doesn't smoke.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Urashima laughed at his little joke, and the tortoise laughed too.
        - id: ch02-b11
          speaker: otohime
          text: >-
            He-he-he-he! I enjoy sake, but tobacco does nothing for me.
          emotion: happy
        - id: ch02-b12
          speaker: urashima
          text: >-
            I'm sorry I have no sake in the boat. Still, come up and dry your back in the sun. Tortoises always enjoy that.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The tortoise climbed aboard with Urashima's help. After they had exchanged a few polite words, the tortoise asked him a question.
        - id: ch02-b14
          speaker: otohime
          text: >-
            Urashima, have you ever seen Rin Gin, the palace of the Dragon King of the Sea?
        - id: ch02-b15
          speaker: narrator
          text: >-
            Urashima shook his head.
        - id: ch02-b16
          speaker: urashima
          text: >-
            No. The sea has been my home year after year, and I've often heard about the Dragon King's realm beneath it. But I've never seen that wonderful place. If it truly exists, it must be very far away.
        - id: ch02-b17
          speaker: otohime
          text: >-
            You really have never seen the Sea King's Palace? Then you've missed one of the greatest wonders in the whole world. It lies far away at the bottom of the sea, but I can take you there quickly. If you wish to see the Sea King's land, I'll guide you.
        - id: ch02-b18
          speaker: urashima
          text: >-
            I would certainly like to see it, and it's kind of you to offer. But I'm only a mortal man. I can't swim through the sea as you can.
        - id: ch02-b19
          speaker: otohime
          text: >-
            Swim? You won't need to swim at all. Ride on my back, and I'll carry you there without any trouble.
        - id: ch02-b20
          speaker: urashima
          text: >-
            But how could I possibly ride on such a small shell?
        - id: ch02-b21
          speaker: otohime
          text: >-
            It may sound foolish, but I promise you can. Come, climb onto my back now, and see whether it's really impossible.
        - id: ch02-b22
          speaker: narrator
          text: >-
            Urashima looked down. Strange to say, the tortoise had suddenly grown until its shell was broad enough for a man to sit upon.
        - id: ch02-b23
          speaker: urashima
          text: >-
            How extraordinary! Well then, Mr. Tortoise, with your permission, I'll climb on. Dokoisho!
          emotion: surprised
        - id: ch02-b24
          speaker: narrator
          text: >-
            He jumped onto the great shell. The tortoise showed no surprise at all, as though carrying a fisherman were the most ordinary thing in the world.
        - id: ch02-b25
          speaker: otohime
          text: >-
            Now we can set out at our ease.
        - id: ch02-b26
          speaker: narrator
          text: >-
            With that, the tortoise leaped into the sea, taking Urashima down through the water. Deeper and farther they went. The strange pair traveled for a long time through the sea, but Urashima never grew tired. The water did not even make his clothes damp. At last, far off in the distance, a magnificent gate appeared. Beyond the gate, the long, sloping roofs of a palace rose along the horizon.
        - id: ch02-b27
          speaker: urashima
          text: >-
            Ah! A great palace gate is coming into view. Mr. Tortoise, what is that place ahead of us?
        - id: ch02-b28
          speaker: otohime
          text: >-
            That is the grand gate of Rin Gin. The wide roof beyond it belongs to the Sea King's Palace.
        - id: ch02-b29
          speaker: urashima
          text: >-
            Then we've finally reached the Sea King's realm and his palace.
        - id: ch02-b30
          speaker: otohime
          text: >-
            We have indeed. And haven't we come quickly? Here we are at the gate. From this point, please walk.
        - id: ch02-b31
          speaker: narrator
          text: >-
            The tortoise went ahead and addressed the fish who guarded the entrance.
        - id: ch02-b32
          speaker: otohime
          text: >-
            This is Urashima Taro from Japan. I have had the honor of bringing him here as a visitor. Please show him the way.
        - id: ch02-b33
          speaker: narrator
          text: >-
            The gatekeeper immediately led them inside.
    - id: ch03
      title: The Palace of the Dragon King
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The chief servants of the Dragon King came out to meet the stranger. There were the red bream, the flounder, the sole, and the cuttlefish, all bowing with great ceremony.
        - id: ch03-b02
          speakers: [red_bream, flounder, sole, cuttlefish]
          ensemble: chorus
          text: >-
            Urashima Sama, welcome to the Sea Palace, home of the Dragon King! Three times welcome after your journey from such a distant land. And Mr. Tortoise, we owe you many thanks for bringing him here. Please, Urashima Sama, follow us.
        - id: ch03-b03
          speaker: narrator
          text: >-
            From that moment, the whole company of fish became his guides. Urashima was only a poor fisher lad. He had never learned how a guest should behave in a royal palace. Everything around him was strange, from the grand halls to the bowing servants. Even so, he felt neither ashamed nor embarrassed. He stayed calm and followed his kindly guides wherever they led him, all the way into the inner palace.
        - id: ch03-b04
          speaker: narrator
          text: >-
            When Urashima reached the doors of the inner palace, a beautiful princess came out with her attendant maidens to welcome him. She was lovelier than any human being he had ever seen. Her long, flowing robes were red and soft green, like the underside of a wave, and golden threads glimmered among every fold. Her lovely black hair streamed over her shoulders in the fashion worn by a king's daughter hundreds of years before. When she spoke, her voice sounded like music moving over the water.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Urashima stared in silent wonder. At last he remembered to bow, but before he could bend low, the Princess took his hand. She led him into a beautiful hall, placed him in the seat of honor, and invited him to sit.
        - id: ch03-b06
          speaker: otohime
          text: >-
            Urashima Taro, it gives me the greatest pleasure to welcome you to my father's kingdom. Yesterday you freed a tortoise. I sent for you so I could thank you for saving my life, because I was that tortoise. If you wish, you may stay here forever in the land of eternal youth. Summer never dies here, and sorrow never comes. Be my bridegroom, and we will live happily together forever.
        - id: ch03-b07
          speaker: narrator
          text: >-
            As Urashima listened and looked upon her lovely face, wonder and joy filled his heart. He could hardly believe he was awake.
        - id: ch03-b08
          speaker: urashima
          text: >-
            I thank you a thousand times for those kind words. I could wish for nothing more than to stay with you in this beautiful land. I had heard of it often, but never saw it until today. Nothing I have ever known can compare with this place.
        - id: ch03-b09
          speaker: narrator
          text: >-
            While he spoke, a procession of fish appeared. Each one wore long ceremonial robes that trailed behind as they entered the hall. They came one by one, silent and stately, carrying coral trays. Upon those trays were marvelous delicacies of fish and seaweed, dishes no one in the human world could even dream of tasting. The servants arranged the whole wondrous feast before the bride and bridegroom.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Their wedding was celebrated in dazzling splendor, and all through the Sea King's realm there was great rejoicing. The young pair pledged themselves by drinking from the wedding cup three times three. Then music began to play, and voices rose in song. Fish with silver scales and golden tails stepped in from the waves and danced for them. Urashima enjoyed every moment with all his heart. Never in his life had he seen such a celebration or sat down to such a wonderful feast.
        - id: ch03-b11
          speaker: narrator
          text: >-
            When the feast ended, the Princess asked her bridegroom whether he would like to walk through the palace and see all its sights. The happy fisherman followed his bride, the Sea King's daughter, as she showed him the wonders of that enchanted land. There, youth and joy went hand in hand. Neither passing time nor growing age could touch them. The palace itself was built of coral and decorated with pearls. Its beauty was so great that no tongue could fully describe it.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Yet the garden surrounding the palace amazed Urashima even more. Wherever he turned, he could see the beauty of a different season. Summer and winter, spring and autumn were all spread before him at the very same time. When he looked east, plum trees and cherry trees stood in full bloom. Nightingales sang along avenues made pink by the blossoms, and butterflies fluttered from one flower to the next.
        - id: ch03-b13
          speaker: narrator
          text: >-
            When he turned south, every tree was green with the fullness of summer. The daytime cicadas and the crickets of the night chirped loudly among them. Then he looked west. There the autumn maples blazed with color like a sunset sky, and chrysanthemums stood in the perfection of their season.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Then he looked north and started in surprise. Snow lay silver-white across the ground. It covered the trees and bamboo, and thick ice sealed the pond.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Each new day brought Urashima new joys and wonders. His happiness became so complete that he forgot the home he had left behind. He forgot his parents and even his own country. Three days passed before any thought of them returned.
    - id: ch04
      title: The Jewel-Hand Box
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Then Urashima remembered who he was. He did not belong to this marvelous land or to the Sea King's palace.
        - id: ch04-b02
          speaker: urashima
          text: >-
            Oh no! I must not stay. My old father and mother are at home. What could have happened to them while I've been gone? They must have been terribly worried when I failed to return. I must leave at once. I can't let another day pass.
        - id: ch04-b03
          speaker: narrator
          text: >-
            He began preparing in great haste. Then he went to his beautiful wife, bowed deeply before her, and spoke.
        - id: ch04-b04
          speaker: urashima
          text: >-
            Otohime Sama, my time with you has been very happy, and your kindness is more than I can put into words. But now I must say goodbye. I have to return to my old parents.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Otohime began to weep. Her answer came softly and sadly.
        - id: ch04-b06
          speaker: otohime
          text: >-
            Have you not been happy here, Urashima? Why must you leave me so soon? There is no need to hurry. Stay with me for just one more day.
          emotion: sad
        - id: ch04-b07
          speaker: narrator
          text: >-
            But Urashima had remembered his old parents. In Japan, duty to one's parents is stronger than anything else, even pleasure or love. Otohime could not persuade him to remain.
        - id: ch04-b08
          speaker: urashima
          text: >-
            I truly must go. Please don't think I want to leave you. That isn't the reason. I have to see my father and mother. Let me return for one day, and then I'll come back to you.
        - id: ch04-b09
          speaker: otohime
          text: >-
            Then nothing can be done. I will send you back to your parents today. I won't ask you to stay another day. Instead, please take this with you as a token of our love.
          emotion: sad
        - id: ch04-b10
          speaker: narrator
          text: >-
            She brought him a beautiful lacquer box, tied with a silken cord and red silk tassels. Urashima had already received so much from her that he felt uneasy accepting another gift.
        - id: ch04-b11
          speaker: urashima
          text: >-
            After all your favors, it hardly seems right to accept one more gift. Still, since you wish me to take it, I will. But tell me, what is inside this box?
        - id: ch04-b12
          speaker: otohime
          text: >-
            This is the tamate-bako, the Box of the Jewel Hand, and it holds something very precious. No matter what happens, you must not open it. If you do, something dreadful will happen to you. Promise me you will never open this box.
          emotion: fearful
        - id: ch04-b13
          speaker: narrator
          text: >-
            Urashima gave his word. Whatever might happen, he would never, never open the box. Then he said goodbye to Otohime and walked down to the seashore. The Princess went with him, and all her attendants followed behind. There on the shore, he found a great tortoise waiting to carry him home.
        - id: ch04-b14
          speaker: narrator
          text: >-
            Urashima quickly climbed onto the tortoise's back, and it carried him away toward the east over the shining sea. Again and again he looked behind him to wave farewell to Otohime. He kept waving until at last he could see her no more. Then the land of the Sea King disappeared as well, and the roofs of the marvelous palace were lost in the far, far distance.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Then he turned eagerly toward home and watched for the blue hills to rise ahead. At last, the tortoise entered the familiar bay and carried him to the very shore where his journey had begun. Urashima stepped onto land and looked around. The tortoise turned and traveled back toward the Sea King's realm.
    - id: ch05
      title: Three Hundred Years
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            As Urashima stood upon the familiar shore and looked around him, a strange fear took hold of him. Why did he stare so intently at every person who passed? And why did those people stop and stare back at him? The curve of the shore was the same, and the hills beyond it were the same. Yet every face he saw was completely different from the faces he had known before his journey.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Wondering what it meant, he hurried toward his old home. Even the house looked different, though one still stood on the same spot.
        - id: ch05-b03
          speaker: urashima
          text: >-
            Father, I'm home!
        - id: ch05-b04
          speaker: narrator
          text: >-
            He was about to go inside when a stranger came out. Perhaps, Urashima thought, his parents had moved away while he was gone. An uneasiness he could not explain began to grow in him.
        - id: ch05-b05
          speaker: urashima
          text: >-
            Excuse me. Until a few days ago, I lived in this house. My name is Urashima Taro. Can you tell me where my parents have gone?
        - id: ch05-b06
          speaker: narrator
          text: >-
            The man looked utterly bewildered. He studied Urashima's face without looking away.
        - id: ch05-b07
          speaker: stranger
          text: >-
            What did you say? Are you Urashima Taro?
          emotion: surprised
        - id: ch05-b08
          speaker: urashima
          text: >-
            Yes. I am Urashima Taro.
        - id: ch05-b09
          speaker: stranger
          text: >-
            Ha, ha! You shouldn't make jokes like that. A man named Urashima Taro did live in this village once, but his story is three hundred years old. He can't possibly be alive today!
        - id: ch05-b10
          speaker: narrator
          text: >-
            The stranger's words frightened Urashima.
        - id: ch05-b11
          speaker: urashima
          text: >-
            Please, please don't joke with me. I don't understand any of this. I really am Urashima Taro, and I certainly haven't lived for three hundred years. I was living here only four or five days ago. Please stop teasing me and tell me where my parents are.
          emotion: fearful
        - id: ch05-b12
          speaker: narrator
          text: >-
            The man's face grew graver still.
        - id: ch05-b13
          speaker: stranger
          text: >-
            I don't know whether you are Urashima Taro or not. But the Urashima Taro I've heard about lived three hundred years ago. Could you be his spirit, returning to visit your old home?
        - id: ch05-b14
          speaker: urashima
          text: >-
            Why are you mocking me? I'm not a spirit. I'm a living man! Look, can't you see my feet?
        - id: ch05-b15
          speaker: narrator
          text: >-
            Urashima stamped hard on the ground, first with one foot and then the other. Everyone knew that Japanese ghosts had no feet.
        - id: ch05-b16
          speaker: stranger
          text: >-
            All I know is that Urashima Taro lived three hundred years ago. It is written in the village records.
        - id: ch05-b17
          speaker: narrator
          text: >-
            The man kept repeating what he knew and would not believe Urashima's story. Urashima stood there in misery and confusion, staring all around him. He was terribly puzzled. Yet the longer he looked, the more he saw that everything truly was different from the village he remembered. A dreadful feeling crept over him. Perhaps the stranger was telling the truth after all. Urashima felt as though he had wandered into a strange dream and could not wake from it.
        - id: ch05-b18
          speaker: narrator
          text: >-
            At last he understood. The few days he had spent at the Sea King's palace had not been ordinary days at all. While they passed for him like a handful of happy mornings and evenings, hundreds of years had gone by in his own country. During that long age, his father and mother had died. So had every friend and every person he had ever known. The village had even written his story into its records. There was no use in staying in a place where his whole life had vanished. He must find a way back to his beautiful wife beyond the sea.
        - id: ch05-b19
          speaker: narrator
          text: >-
            Carrying Otohime's box, Urashima made his way back to the beach. But which direction should he take? Alone, he could not find the way. Then he remembered the tamate-bako.
        - id: ch05-b20
          speaker: urashima
          text: >-
            The Princess told me never to open this box because it holds something precious. But I have no home now. Everything I loved here is gone, and my heart has grown thin with sorrow. Surely the box must contain something that can help me, something that will show me the way back to my beautiful Princess across the sea. I have no other choice. Yes, I will open it and see.
          emotion: sad
        - id: ch05-b21
          speaker: narrator
          text: >-
            In this way, Urashima's heart agreed to disobey. Though he remembered his promise, he kept trying to persuade himself that opening the box was now the right thing to do. He took the red silk cord in his hands. Slowly, very slowly, he loosened it and pulled it away. Then, full of wonder at what might be waiting inside, he raised the lid of the precious box just as slowly and looked in.
        - id: ch05-b22
          speaker: narrator
          text: >-
            What did he find inside the box? Nothing but a beautiful little purple cloud. It rose from the open box in three soft wisps and covered his face for an instant. The cloud hovered and wavered over him as if it did not wish to leave. Then it drifted away like mist across the sea.
        - id: ch05-b23
          speaker: narrator
          text: >-
            Until that moment, Urashima had been a strong and handsome young man of twenty-four. All at once, he became very, very old. His back bent double. His hair turned white as snow. Wrinkles covered his face, and he fell dead upon the beach.
        - id: ch05-b24
          speaker: narrator
          text: >-
            Poor Urashima. Because he disobeyed, he could never return to the Sea King's realm or to the lovely Princess beyond the sea.
        - id: ch05-b25
          speaker: narrator
          text: >-
            Little children, never disobey those who are wiser than you. Disobedience was the beginning of all the miseries and sorrows of life.
