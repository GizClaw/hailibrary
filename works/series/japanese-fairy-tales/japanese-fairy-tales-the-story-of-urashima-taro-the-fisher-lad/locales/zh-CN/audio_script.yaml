audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    urashima:
      display_name: 浦岛太郎
      tts:
        delivery: 善良诚恳，惊奇时仍保持质朴
        timbre: 清朗温厚的青年男声
        pace: 自然从容，焦急时稍快
        pitch: 中音
    boy_1:
      display_name: 男孩甲
      tts:
        delivery: 淘气大胆，说话直率
        timbre: 清脆的男孩声
        pace: 轻快
        pitch: 中高音
    boy_2:
      display_name: 男孩乙
      tts:
        delivery: 顽皮活泼，带着孩子气
        timbre: 明亮的男孩声
        pace: 较快
        pitch: 高音
    boy_3:
      display_name: 男孩丙
      tts:
        delivery: 兴奋吵闹，稚气自然
        timbre: 轻细的男孩声
        pace: 较快
        pitch: 高音
    tortoise:
      display_name: 乌龟
      tts:
        delivery: 彬彬有礼，偶尔流露幽默
        timbre: 沉稳圆润
        pace: 不疾不徐
        pitch: 中低音
    gatekeeper:
      display_name: 守门人
      tts:
        delivery: 恭谨端正
        timbre: 清晰稳重
        pace: 从容
        pitch: 中音
    sea_vassal:
      display_name: 龙宫臣子
      tts:
        delivery: 隆重有礼，带着宫廷仪态
        timbre: 明亮庄重
        pace: 舒展
        pitch: 中音
    otohime:
      display_name: 乙姬
      tts:
        delivery: 高雅温柔，悲伤时克制含蓄
        timbre: 柔美清澈
        pace: 舒缓
        pitch: 中高音
    stranger:
      display_name: 陌生男子
      tts:
        delivery: 困惑谨慎，态度逐渐严肃
        timbre: 朴实厚重
        pace: 自然
        pitch: 中低音
  chapters:
    - id: ch01
      title: 善良的渔家少年
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，丹后国海边有个小渔村，名叫水之江。村里住着年轻的渔夫浦岛太郎。他父亲原本也是渔夫，一身本领传到儿子手里，不但没有失传，反而更胜从前。浦岛是方圆一带最出色的渔夫。他一天捕到的鲣鱼和鲷鱼，比同伴一个星期捕到的还多。不过，村里人更熟悉的，是他的好心肠。浦岛一辈子从不伤害任何生灵，不论大小。小时候，伙伴常笑话他，因为他们欺负动物时，他不但从不参加，还总会出面阻拦，不许大家玩这种残忍的游戏。
        - id: ch01-b02
          speaker: narrator
          text: 一个温柔的夏日黄昏，浦岛结束了一天的捕鱼，正在回家，忽然遇见一群孩子。他们七嘴八舌，扯着嗓子叫嚷，不知为了什么兴奋得不得了。浦岛走近一看，他们正围着一只乌龟。一个孩子把它往这边扯，另一个又往那边拉，第三个拿棍子打它，第四个用石头砸它的硬壳。浦岛看得十分心疼，决心救下这只乌龟。
        - id: ch01-b03
          speaker: urashima
          text: 孩子们，别这样欺负它。再闹下去，这只可怜的乌龟就要死了！
        - id: ch01-b04
          speakers: [boy_1, boy_2, boy_3]
          ensemble: chorus
          text: 它是死是活，谁在乎？接着玩，接着玩！
        - id: ch01-b05
          speaker: narrator
          text: 这些孩子正处在以欺负动物为乐的年纪，根本不理会他的温和劝告，反而闹得比先前更凶。浦岛没有发火。他等了一会儿，仔细想该怎样对付他们，最后决定好好劝说，让孩子们自愿交出乌龟。他带着亲切的笑容开了口。
        - id: ch01-b06
          speaker: urashima
          text: 我知道你们都是善良的好孩子。把乌龟给我，好不好？我很想要它。
        - id: ch01-b07
          speaker: boy_1
          text: 不给！这是我们自己捉来的，为什么要送给你？
        - id: ch01-b08
          speaker: urashima
          text: 你说得有道理，我不会白拿。叔叔出钱买下它，行不行？你们看，这串钱能买许多喜欢的东西，可比留着乌龟有用多了。肯听我的劝，你们就是好孩子。
        - id: ch01-b09
          speaker: narrator
          text: 这些孩子本性并不坏，只是淘气。他们被浦岛亲切的笑容和温和的话语打动，心思渐渐与他相通。日本人把这叫作“同心”。他们一个个围拢过来，最后，为首的孩子把乌龟递给了浦岛。
        - id: ch01-b10
          speaker: boy_1
          text: 好吧，叔叔。你把钱给我们，我们就把乌龟给你！
        - id: ch01-b11
          speaker: narrator
          text: 浦岛接过乌龟，把那串中央有孔、用细绳穿起来的钱交给孩子们。他们彼此叫喊着，一溜烟跑远了，很快便不见踪影。浦岛这才轻轻抚摸乌龟的背。
        - id: ch01-b12
          speaker: urashima
          text: 可怜的小东西，现在你安全了。都说仙鹤活千年，乌龟活万年，你的寿命本该比谁都长，刚才却险些叫那些孩子断送。幸好我经过这里，保住了你的命。我马上送你回大海。以后千万别再被捉住，下一次也许没人来救你了。
        - id: ch01-b13
          speaker: narrator
          text: 浦岛一边安慰乌龟，一边快步走到海边，又踏上礁石。他俯身把乌龟放进水里，站在那里看着它渐渐游远，直到完全消失。这时太阳已经落山，忙碌了一天的浦岛也累了，便独自转身回家。
    - id: ch02
      title: 前往海底龙宫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天早晨，浦岛照常驾船出海。天气晴朗，夏日晨雾轻柔地罩着四周，蓝天与碧海都显得温润安静。他登上小船，恍恍惚惚地划向远方，随手把钓线抛进海里。不久，他便越过其他渔船，把它们远远抛在身后，直到所有船都消失在天边。他自己的小船却在蓝色水面上越漂越远。那天早上，浦岛不知为什么格外快活，还忍不住盼望，自己也能像昨天放生的乌龟那样活上千年，而不只有凡人短短的一生。
        - id: ch02-b02
          speaker: narrator
          text: 突然，一个声音把他从遐想中惊醒。
        - id: ch02-b03
          speaker: tortoise
          text: 浦岛！浦岛！
        - id: ch02-b04
          speaker: narrator
          text: 呼唤声从海面悠悠飘来，像铃一样清亮，又像夏风一样柔和。浦岛以为别的船追了上来，立刻起身朝每个方向张望。可是辽阔的水面上，无论近处还是远处，一只船也没有，这声音不可能来自人类。他又惊又疑，再次环顾四周，才发现一只乌龟不知何时已经游到船边。仔细一看，正是他昨天救过的那只。
        - id: ch02-b05
          speaker: urashima
          text: 乌龟先生，刚才是你叫我吗？
        - id: ch02-b06
          speaker: tortoise
          text: 正是我。昨天托您的福，我才保住性命。今天我特意来道谢，也想告诉您，我多么感激您的救命之恩。
        - id: ch02-b07
          speaker: urashima
          text: 你太客气了，快上船吧。我本该请你抽袋烟，可你是乌龟，大概不会抽烟。
        - id: ch02-b08
          speaker: narrator
          text: 渔夫说完，自己先笑了起来。乌龟也嘿嘿地笑了。
        - id: ch02-b09
          speaker: tortoise
          text: 我最喜欢喝清酒，烟草可没什么兴趣。
        - id: ch02-b10
          speaker: urashima
          text: 可惜船上没有清酒招待你。还是上来晒晒背吧，乌龟不都爱晒太阳吗？
        - id: ch02-b11
          speaker: narrator
          text: 浦岛伸手帮乌龟爬上小船，让它在太阳底下把背晒干。双方客套一番，乌龟忽然问他有没有见过海龙王的龙宫。浦岛摇摇头。他年年以大海为家，也常听人说起海底龙王的国度，却从没亲眼见过那片奇境。若龙宫真的存在，想必离这里远得很。
        - id: ch02-b12
          speaker: tortoise
          text: 你竟没见过龙宫？那可是天地间最神奇的地方之一。它虽然远在海底，由我领路却很快就能到。你若想去，我愿意做向导。
        - id: ch02-b13
          speaker: urashima
          text: 我当然想去，你肯带路更是好心。只是我不过是个凡人，不像海里的生灵那样会游水——
        - id: ch02-b14
          speaker: tortoise
          text: 谁要你游了？骑在我背上就好，我会把你送到那里，一点力气也不用你费。
        - id: ch02-b15
          speaker: urashima
          text: 可是你的背这么小，我怎么坐得上去？
        - id: ch02-b16
          speaker: tortoise
          text: 听起来也许荒唐，可你一定能坐。现在就上来试试，看看是不是真像你想的那么难！
        - id: ch02-b17
          speaker: narrator
          text: 浦岛一看，乌龟竟突然变得无比巨大，背上足以坐下一个人。
        - id: ch02-b18
          speaker: urashima
          text: 真是怪事！乌龟先生，那我就不客气了。嘿哟！
          emotion: surprised
        - id: ch02-b19
          speaker: narrator
          text: 浦岛喊着下层百姓用力做事时常说的“嘿哟”，跳上龟背。乌龟面不改色，仿佛这一切再平常不过。
        - id: ch02-b20
          speaker: tortoise
          text: 好了，我们从从容容地出发吧。
        - id: ch02-b21
          speaker: narrator
          text: 乌龟驮着浦岛跃入海中，一直潜向水底。两个奇异的旅伴在海里走了很久，可浦岛一点也不觉得累，身上的衣服也没有被海水沾湿。终于，极远的地方出现一座宏伟的大门。大门后面，一座宫殿绵长而倾斜的屋顶渐渐显露出来，横卧在天际。
        - id: ch02-b22
          speaker: urashima
          text: 呀，那边像是一座大宫殿的门！乌龟先生，我们看见的是什么地方？
          emotion: surprised
        - id: ch02-b23
          speaker: tortoise
          text: 那就是龙宫的大门。门后那片巨大的屋顶，便是海龙王的宫殿。
        - id: ch02-b24
          speaker: urashima
          text: 这么说，我们终于到了海龙王的国度。
        - id: ch02-b25
          speaker: tortoise
          text: 没错，而且不是很快吗？我们已经到门口了，从这里起，请你下来步行吧。
    - id: ch03
      title: 龙宫里的婚礼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 到了门前，乌龟请浦岛从背上下来步行，自己走到前面。它向守门人介绍浦岛太郎，说自己有幸带这位日本国的客人前来拜访，请它为客人引路。守门的是一条鱼，立刻走在前面，领着他们穿过大门。红鲷、鲽鱼、鳎鱼、乌贼，还有海龙王手下所有身居要职的臣子，都走出来向陌生的客人行宫廷大礼。
        - id: ch03-b02
          speaker: sea_vassal
          text: 浦岛大人，欢迎来到海龙王的龙宫！您从遥远的国度前来，我们再三欢迎。乌龟先生，您辛苦把客人带来，我们也十分感激。浦岛大人，请随我们往这边走。
        - id: ch03-b03
          speaker: narrator
          text: 从这里开始，这一大群鱼全都成了浦岛的向导。他只是贫穷的渔家少年，不懂宫廷里该有怎样的举止，可面对陌生的一切，他没有羞怯，也没有慌张，只安安静静地跟随好心的向导进入内宫。宫门前，一位美丽的公主带着侍女出来迎接。她比任何凡人都美。身上的长袍飘然垂落，红与淡绿交织，像海浪背面的颜色，衣褶间还闪着金丝。她按几百年前王女的样式，让秀丽的黑发披在肩头。一开口，声音便如同水面上飘来的音乐。
        - id: ch03-b04
          speaker: narrator
          text: 浦岛望着公主，惊叹得一句话也说不出来。过了一会儿，他才想起自己应该向公主行礼。可他还没来得及深深躬身，公主已经主动牵住他的手，把他领进一座美丽的大厅，又一路带到上首，请他在最尊贵的座位坐下。
        - id: ch03-b05
          speaker: otohime
          text: 浦岛太郎，能在父王的国度迎接你，我非常欢喜。昨天你放走的乌龟就是我，我请你来，是要感谢你的救命之恩。只要你愿意，就永远住在这片长春不老的土地上吧。这里没有消逝的夏日，也没有悲伤。我愿做你的新娘，从此与你幸福地生活在一起。
        - id: ch03-b06
          speaker: narrator
          text: 浦岛听着公主甜美的话语，凝望着她美丽的脸，心里同时涌起巨大的惊奇与欢喜。他不敢相信一个贫穷的渔夫会遇见这样的奇事，简直怀疑眼前的一切只是一场梦。
        - id: ch03-b07
          speaker: urashima
          text: 谢谢你这样厚待我。能留在这片美丽的国土，与你生活在一起，我再没有别的愿望。从前只听人说起这里，今天才亲眼见到。它实在太神奇了，我找不到话来形容。
        - id: ch03-b08
          speaker: narrator
          text: 浦岛还在说话时，一队身穿拖地礼服的鱼出现了。它们一个接一个，无声地迈着庄严的步子走进大厅，用珊瑚托盘捧来凡人梦中也见不到的鱼肉和海草珍馐，把奇妙的宴席摆在新人面前。婚礼举行得辉煌灿烂，整个海龙王国都在欢庆。浦岛与公主按照仪式，将合卺酒一连喝过三巡，每巡三杯。乐声与歌声随即响起，银鳞金尾的鱼儿从海浪中走来翩翩起舞。浦岛尽情享用盛宴，一生从没吃过这样奇妙的食物，也从没这样快活过。
        - id: ch03-b09
          speaker: narrator
          text: 宴席结束后，公主问新郎愿不愿意四处走走，看看宫殿里所有的景物。快乐的渔夫跟随新娘，也就是海龙王的女儿，游遍了这片仙境。在这里，青春与欢乐永远相伴，时间和衰老都无法靠近。宫殿由珊瑚砌成，到处点缀着珍珠。这里的美景与奇观实在太多，任凭怎样的巧舌也说不尽。
        - id: ch03-b10
          speaker: narrator
          text: 可在浦岛眼中，环绕宫殿的花园更加神奇。春夏秋冬竟同时汇聚在这里，四季的美一齐展现在客人面前。他望向东方，梅树与樱树花开正盛，黄莺在粉红的林荫间歌唱，蝴蝶从一朵花飞向另一朵花。再看南方，所有树木都披着盛夏浓绿的枝叶，白日里的蝉与夜间的蟋蟀一起响亮鸣叫。西方的秋枫像晚霞般燃烧，菊花正开到最美。最后望向北方，眼前骤然一变，惊得浦岛浑身一震。地面银白，树木与竹子全被积雪覆盖，池塘上也结着厚厚的冰。
        - id: ch03-b11
          speaker: narrator
          text: 每一天，浦岛都会得到新的欢乐，见到新的奇景。他实在太幸福了，竟忘记了所有事情，忘记了遗在身后的家，忘记了父母，也忘记了故国。整整三天过去，他一次都没有想起身后的一切。后来，他终于清醒过来，记起自己是谁，也记起自己并不属于这片神奇的土地，更不属于海龙王的宫殿。
    - id: ch04
      title: 一别三百年
      blocks:
        - id: ch04-b01
          speaker: urashima
          text: 我不能再留下去了。年迈的父母还在家中，我这些天没有回去，他们不知会担心成什么样。我一天也不能再耽搁，必须马上回家。
        - id: ch04-b02
          speaker: narrator
          text: 说出这些话以后，浦岛立刻匆匆准备起行。他来到美丽的妻子面前，朝她深深鞠了一躬，这才说出自己必须离开的缘由。
        - id: ch04-b03
          speaker: urashima
          text: 乙姬大人，与你在一起的日子，我过得非常快乐。你对我的好，怎么说也说不尽。可我现在必须告辞，回去看望年迈的父母。
        - id: ch04-b04
          speaker: narrator
          text: 乙姬听罢，眼泪立刻流了下来。她不明白浦岛为什么这样快便要离开自己，只能带着悲伤，轻声挽留他。
        - id: ch04-b05
          speaker: otohime
          text: 难道你在这里过得不好吗，浦岛？为什么这么快就要走？别急着离开，只再陪我一天吧。
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: 可浦岛已经想起年迈的父母。在日本，对父母尽责比世间任何事都重要，胜过欢乐，甚至胜过爱情。所以，无论乙姬怎样挽留，他也不肯改变回家的心意。
        - id: ch04-b07
          speaker: urashima
          text: 我真的非走不可。请别以为我愿意离开你，我只是必须去看看父母。让我回去一天，随后一定回来。
        - id: ch04-b08
          speaker: otohime
          text: 既然这样，我也没有别的办法。今天就送你回到父母身边吧。我不再留你，只送你一件东西，作为我们爱情的信物，请把它带走。
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: 公主拿来一只美丽的漆盒，盒上系着丝带，还垂着红色丝穗。浦岛已经从她那里得到太多恩惠。如今要离开了还再收一件礼物，他心里实在过意不去。
        - id: ch04-b10
          speaker: urashima
          text: 你已经给了我这么多，我实在不该再拿礼物。不过既然这是你的心愿，我就收下。请告诉我，这是什么盒子？
        - id: ch04-b11
          speaker: otohime
          text: 这是玉手箱，里面装着极其珍贵的东西。无论发生什么，绝不能打开！只要打开，可怕的事就会落到你身上。答应我，永远不要开这只盒子！
          emotion: fearful
        - id: ch04-b12
          speaker: narrator
          text: 浦岛郑重答应，无论发生什么，自己永远、永远也不会打开它。随后，他向乙姬告别，带着玉手箱走向海边。公主与侍女们一路跟随，把他送到那里。一只巨大的乌龟已经在岸边等候多时。
        - id: ch04-b13
          speaker: narrator
          text: 浦岛迅速骑上龟背，由它驮着越过闪耀的海面，一路朝东方而去。他不停回头，向站在岸边的乙姬挥手，直到再也看不见她。海龙王的国土和神奇宫殿的屋顶，也渐渐消失在极远的地方。随后，他急切地转身面向故乡，把目光投向前方的天际，一心等待熟悉的蓝色群山从海平线上升起。
        - id: ch04-b14
          speaker: narrator
          text: 乌龟终于把他送进无比熟悉的海湾，回到当初出发的岸边。浦岛踏上陆地，四处张望，乌龟则转身游回海龙王的国度。可是，他站在那里环顾四周，心里忽然生出一种古怪的恐惧。他目不转睛地盯着每个过路人，那些人也纷纷停下，惊奇地打量他。海岸还是从前的海岸，山岭也还是从前的山岭，可这些人的脸，没有一张是他熟悉的。
        - id: ch04-b15
          speaker: narrator
          text: 浦岛怎么也想不明白，赶紧朝旧日的家走去。那栋房子仍然立在原来的地方，模样却与他离开前大不相同。他站在门外，朝里面高声呼喊。
        - id: ch04-b16
          speaker: urashima
          text: 父亲，我回来啦！
        - id: ch04-b17
          speaker: narrator
          text: 浦岛正要跨进门，一个从未见过的男子却从里面走了出来。他想，也许自己不在的这些天里，父母已经搬去了别处。可是不知为什么，他心里越来越不安，连自己也说不清缘由。
        - id: ch04-b18
          speaker: urashima
          text: 请问，几天前我还住在这里。我叫浦岛太郎。留在这里的父母到哪里去了？
        - id: ch04-b19
          speaker: stranger
          text: 什么？你是浦岛太郎？
          emotion: surprised
        - id: ch04-b20
          speaker: urashima
          text: 是的，我就是浦岛太郎！
        - id: ch04-b21
          speaker: stranger
          text: 哈！这种玩笑可开不得。很久以前，村里的确住过一个浦岛太郎，可那是三百年前的故事。他怎么可能还活着？
        - id: ch04-b22
          speaker: narrator
          text: 这些怪话把浦岛吓坏了。
        - id: ch04-b23
          speaker: urashima
          text: 求你别再开玩笑，我已经完全糊涂了。我真是浦岛太郎，也没有活过三百年。四五天前，我还住在这里。请告诉我父母去了哪里！
          emotion: fearful
        - id: ch04-b24
          speaker: stranger
          text: 你究竟是谁，我不知道。但我听说的浦岛太郎生活在三百年前。也许你是他的魂魄，回来探望旧居？
        - id: ch04-b25
          speaker: urashima
          text: 为什么取笑我？我不是魂魄，是活生生的人！你没看见我的脚吗？
        - id: ch04-b26
          speaker: narrator
          text: 浦岛不明白对方为什么取笑自己，便咚咚地轮流跺起两只脚，让那个人仔细看。日本的鬼是没有脚的，他想用这个办法证明，自己不是魂魄，而是活生生的人。
        - id: ch04-b27
          speaker: stranger
          text: 我只知道浦岛太郎是三百年前的人，村里的史册写得清清楚楚。
        - id: ch04-b28
          speaker: narrator
          text: 陌生男子始终无法相信他。浦岛陷进无边的困惑与忧愁。他茫然地站着，四处张望，发现周围的一切确实与离开前不同。一个可怕的念头攫住了他，那人说的也许是真的。他仿佛落进一场怪梦。龙宫里的几天，其实是人间的几百年。在这漫长的岁月里，父母死了，所有认识的人也死了，村子甚至把他的故事写进史册。继续留在这里已经毫无用处。他必须找到路，回到海外美丽的妻子身边。
    - id: ch05
      title: 玉手箱的紫云
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 浦岛手里拿着公主送的玉手箱，一路回到海滩。他一心想重返龙宫，可到底该朝哪个方向走呢？只凭自己，他根本找不到通往海底的路。就在无计可施的时候，他忽然想起了手里的盒子。
        - id: ch05-b02
          speaker: urashima
          text: 公主说过，盒里装着极珍贵的东西，也再三嘱咐我不能打开。可如今我无家可归，在这里失去了所有心爱的人和事，心都快被悲伤熬干了。只要打开盒子，也许就能找到回去的路，重新见到海外美丽的公主。除此以外，我再没有办法。对，我要打开看看！
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: 浦岛的心顺从了这个违背诺言的念头。他明明要毁掉对乙姬的承诺，却竭力说服自己，这样做才是正确的选择。他慢慢地，极慢地解开红色丝带，又带着满心惊疑，一点一点掀起珍贵盒子的盖子。
        - id: ch05-b04
          speaker: narrator
          text: 浦岛朝盒子里望去，却没有看见任何指路的宝物。里面只有一小团美丽的紫云，分成三缕轻烟，柔柔地升了起来。它一瞬间罩住浦岛的脸，又像舍不得离开似的，在他头顶摇曳盘旋了片刻，随后才如雾气一般，越过海面飘向远方。
        - id: ch05-b05
          speaker: narrator
          text: 直到紫云出现以前，浦岛还像个二十四岁的青年，强健而英俊。可就在一瞬间，他忽然变得极老极老。岁月压弯了他的背，头发全部变成雪白，原本年轻的脸上也爬满皱纹。最后，他再也支撑不住，倒在海滩上死去了。
        - id: ch05-b06
          speaker: narrator
          text: 可怜的浦岛！因为违背诺言，他再也回不到海龙王的国度，也见不到海外那位美丽的公主。
        - id: ch05-b07
          speaker: narrator
          text: 孩子们，千万不要违背比你们更有智慧之人的教导。世间一切苦难与哀愁，都是从不听劝告开始的。
