audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    bamboo_cutter:
      display_name: 竹取翁
      tts:
        delivery: 慈爱朴实，年老后更显恳切与悲切
        timbre: 苍老温厚的男声
        pace: 舒缓
        pitch: 中低音
    moonlight:
      display_name: 月光公主
      tts:
        delivery: 温柔端庄，意志坚定，离别时含着深切哀伤
        timbre: 清澈柔和的年轻女声
        pace: 从容
        pitch: 中高音
    second_knight:
      display_name: 第二位公子
      tts:
        delivery: 自信夸张，编造奇遇时滔滔不绝
        timbre: 明亮讲究的年轻男声
        pace: 中速偏快
        pitch: 中音
    moon_messenger:
      display_name: 月宫使者
      tts:
        delivery: 威严冷静，不容违抗
        timbre: 清朗庄重的成年男声
        pace: 平稳
        pitch: 中低音
  chapters:
    - id: ch01
      title: 竹林里的月光之女
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，有个靠砍竹子过活的老人。他和老妻家境贫寒，又一辈子没有孩子。老人总想着，自己大概得一直干到死，进了坟墓才能歇一歇。每天清早，他都走进山林，挑选那些向天空舒展青枝的竹子。选好了，便砍下来，劈开或截成一节节，带回家做成各种器物。老夫妇靠卖竹器，勉强过日子。
        - id: ch01-b02
          speaker: narrator
          text: 一天早晨，老人照常进山。才在一片青翠的竹林里动手，四周突然亮了起来，柔和的光洒满竹丛，就像满月落进了林子。老人四处一望，光竟是从一根竹子里照出来的。他丢下斧头，走到近前，发现青竹的空腔里站着一个小人儿。她只有三寸高，却美丽得叫人惊叹。
        - id: ch01-b03
          speaker: bamboo_cutter
          text: 我天天在这片竹林干活，偏偏在这里遇见了你。一定是上天送你来，给我做女儿的。
        - id: ch01-b04
          speaker: narrator
          text: 老人把她托在手心，带回家交给妻子抚养。小姑娘又美又小，老妇人怕她受一点伤，便把她放进篮子里，处处小心照看。老夫妇没有自己的孩子，本来抱憾终身。如今这个孩子神奇地来到家中，他们欢喜极了，把晚年所有的爱都给了她。
        - id: ch01-b05
          speaker: narrator
          text: 从那以后，老人砍开竹节，常常能在里面找到金子，有时还有宝石。他渐渐富裕起来，盖起漂亮的宅院，再也不是人们口中的穷竹匠了。
        - id: ch01-b06
          speaker: narrator
          text: 只过了三个月，竹中来的孩子便不可思议地长成少女。养父母替她梳好头发，穿上华美的和服。她实在太美，二老像守护公主一样，让她住在屏风后面，从不许外人看见，一切都亲自照料。她仿佛是光凝成的，屋里总有一层柔辉，深夜也像白天。老人每逢伤心，只要看看养女，愁苦便会消散，心里又有了年轻时的快乐。
        - id: ch01-b07
          speaker: narrator
          text: 到了取名那天，老夫妇请来一位有名的取名师。少女身上发出的光，柔和得像来自月亮，于是取名师叫她月光公主。庆典连办三天，歌声、舞蹈和乐声从不间断。亲友们都来赴宴，每个见到她的人都说，世上从没有这样美丽的女子，全国的美人在她面前也会失去光彩。
        - id: ch01-b08
          speaker: narrator
          text: 公主的美名传得很远。许多人想娶她，哪怕只看上一眼也好。远近的求婚者守在院外，还在篱笆上钻孔，盼她从廊下经过时能偷偷望见。他们日夜不走，连觉也不睡，却什么也没看见。想同老人、老妇或仆人说句话，也没人答应。
        - id: ch01-b09
          speaker: narrator
          text: 大多数人终于死了心，回家去了。只有五位贵族公子留了下来。阻碍越多，他们越不肯放弃。为了始终守在宅外，他们常常顾不上吃饭，只能匆匆咽几口别人送来的食物。无论晴雨，五个人都不离开。
        - id: ch01-b10
          speaker: narrator
          text: 他们写信给公主，没有答复。书信不能打动她，他们又写成一首首诗，诉说这场无望的爱怎样叫自己不能吃、不能睡、不能歇息，连家也回不了。可公主仍没有一点回应，仿佛那些诗从未送到她手上。五个人就在这毫无希望的处境里熬过冬天。冰雪、严霜和寒风慢慢退去，春日的暖意来了。接着夏天也到了，太阳在天空烧得白亮，地面热得灼人。他们还是守在宅院外面，没有一个肯走。
        - id: ch01-b11
          speaker: narrator
          text: 几个月后，他们高声求竹取翁发发慈悲，让自己见公主一面。老人只说，他不是公主的亲生父亲，不能违背她的心愿，强迫她听话。五个人只得回家，手拿念珠跪在佛龛前，焚起名贵的香，求佛祖成全。他们在家待不了几天，又来到了宅院。
        - id: ch01-b12
          speaker: narrator
          text: 这一次，老人终于出来见他们。五个人问，公主是不是已经打定主意，一生都不肯见任何男子。他们又请老人替自己说一说这份深情。冬天最冷的时候，夏天最热的时候，他们都露宿在外。无论什么天气，哪怕不能吃饭、不能睡觉、不能休息，也只盼有一天能赢得她。只要公主肯给一次机会，让他们亲口陈说心意，这场漫长的守候就可以算作快乐。老人认真听完，心里很同情这些痴心人。他也希望美丽的养女能嫁给其中一个，便进屋去见公主。

    - id: ch02
      title: 五位求婚者的考验
      blocks:
        - id: ch02-b01
          speaker: bamboo_cutter
          text: 你在我眼里一直像天上的仙女。可我把你当亲生女儿一样养大，你也一直住在我的屋檐下，受我照顾。如今我有一个心愿，你也不肯答应吗？
        - id: ch02-b02
          speaker: moonlight
          text: 只要是父亲的心愿，我没有什么不能做。我敬爱您，就像敬爱亲生父亲。来到人间以前的事，我已经全都不记得了。
        - id: ch02-b03
          speaker: narrator
          text: 老人听了很高兴，便说自己最盼望的，是临死以前能看见她平安幸福地出嫁。
        - id: ch02-b04
          speaker: bamboo_cutter
          text: 我已经七十多岁，随时都可能走到生命尽头。你该见见那五位求婚者，从他们中间选一个人。
        - id: ch02-b05
          speaker: moonlight
          text: 为什么一定要这样呢？我现在根本不想嫁人。
          emotion: sad
        - id: ch02-b06
          speaker: bamboo_cutter
          text: 许多年前，我是在耀眼的白光里发现你的。那时你只有三寸高，藏在竹子中，竹里的光把我引到你面前。所以我一直觉得，你不是凡间女子。我活着时，你当然可以照自己的心意生活。可等我死了，谁来照顾你？求你逐个见见这五位勇敢的公子，再挑一个嫁给他吧。
        - id: ch02-b07
          speaker: narrator
          text: 公主说，传闻也许把她的美貌夸大了。这些人并不真正了解她，就算成了亲，婚后也可能变心。即便父亲说他们品行高贵，她还是没有把握，不愿贸然相见。
        - id: ch02-b08
          speaker: bamboo_cutter
          text: 这话有道理。可你究竟肯见怎样的人？他们为你守了几个月，熬过寒冬和盛夏，常常不吃不睡，只想赢得你。这还不能证明他们的真心吗？
        - id: ch02-b09
          speaker: narrator
          text: 公主决定在答应见面以前，再考验他们一次。每个人都要从遥远的地方带回一件她想要的宝物，用这件事证明自己的爱情。当天傍晚，五位公子又来到宅外。他们轮流吹起笛子，还唱着亲手写的歌，歌里全是自己深厚又永不疲倦的爱。老人走出来，告诉他们，他明白大家为了养女吃过多少苦，也很同情这份长久的忍耐。随后，他传达公主的条件。谁能成功把她想要的宝物带回来，她便嫁给谁。这是公主给他们的考验。五个人全都接受了，还觉得这个办法很好，因为有了明确的输赢，彼此便不必嫉妒。
        - id: ch02-b10
          speaker: narrator
          text: 第一位公子要从印度带回佛祖用过的石钵。第二位要去东海的蓬莱山，折下神树的枝条。那棵树以白银为根、黄金为干，结着洁白的宝石。第三位要去中国寻找不怕烈火的火鼠皮。第四位要从龙的头顶取下放射五彩光芒的宝珠。第五位则要找到燕腹中的贝壳。
        - id: ch02-b11
          speaker: narrator
          text: 老人觉得这些任务太难，不愿传话，公主却不肯更改。他只好原样告诉五个人。公子们一听，全都灰心又恼火，认定这些事根本办不到，各自绝望地回了家。可是过了一阵，他们想起公主，爱意又燃了起来，终于决定各显本领，设法拿到宝物。
        - id: ch02-b12
          speaker: narrator
          text: 第一位公子派人告诉公主，自己当天就要出发寻找佛祖的石钵，希望很快把它带回来。可那时远行既艰难又危险，他根本没有勇气一路走到印度。他只去了京都的一座寺院，花重金从僧人那里买下祭坛上的一只石钵。接着，他用金色锦缎把钵仔细包好，自己安安静静躲了三年。三年一到，他才重新露面，把石钵拿去交给竹取翁，装作刚从远方回来。
        - id: ch02-b13
          speaker: narrator
          text: 公主很奇怪，这位公子怎么这样快便回来了。她接过金色包裹，解开锦缎，心想佛祖真正用过的石钵一定会让满室生辉。可是拿出来一看，这只钵半点光芒也没有。公主立刻明白，它只是赝品，绝不是佛祖的真钵。她马上把东西退还，也拒绝见公子一面。那个人知道谎言没有瞒住，干脆把石钵扔掉，绝望地回了家。从此，他放弃了所有希望，再也不敢想自己能够娶到月光公主。
        - id: ch02-b14
          speaker: narrator
          text: 第二位公子对父母说，自己身体不好，需要换个地方休养。他羞于承认，真正叫他离家的其实是对月光公主的爱。他同时传话给公主，说自己要去东海的蓬莱山，为她取回梦寐以求的金银宝枝。他只让仆人陪自己走到半途，随后便把他们全都遣回。到了海边，他登上一艘小船，航行三天以后靠了岸。他在那里雇来几名木匠，建起一所设计严密的房子，外人根本无法闯进去。然后，他把自己和六名手艺高超的珠宝匠关在屋里，要他们用黄金、白银和宝石造出一根枝条，让公主相信它真的来自蓬莱山顶的神树。公子想出这个办法，是因为他问过的每一个人都告诉他，蓬莱山只存在于传说中，世上根本找不到。
        - id: ch02-b15
          speaker: narrator
          text: 宝枝做好以后，公子踏上归途，还故意把自己弄得满身风尘、疲惫不堪，就像刚走完一场漫长而艰险的旅程。他把镶满珠宝的枝条放进漆盒，亲自带到竹取翁面前，请老人转交公主。老人看见他旅途劳顿的模样，果然受了骗，以为这人刚从遥远的蓬莱山回来。他一面劝公主答应见面，一面打开盒子，夸赞这根宝枝是全国再也找不到的奇珍。他又称赞公子相貌英俊，胆量过人，居然敢到蓬莱山那么远的地方去。公主始终沉默，看起来非常忧伤。她把宝枝拿在手里仔细端详，才告诉养父，那个人绝不可能这样迅速、这样轻易地从金银树上折回枝条。她很遗憾，可眼前的东西一定是人工造出的假货。
        - id: ch02-b16
          speaker: narrator
          text: 老人出去询问宝枝的来历。第二位公子毫不犹豫，编起一场漫长的奇遇。
        - id: ch02-b17
          speaker: second_knight
          text: 两年前，我乘船出发寻找蓬莱山。船驶进遥远的东海，忽然遇到大风暴，一连多日辨不清方向，最后被吹到一座陌生的岛上。岛上的恶鬼要杀掉我们吃了，我却设法同他们交上朋友。恶鬼帮我们修船，我们才重新起航。后来食物吃光，大家又染了病。启程后的第五百天，我终于看见天边露出一座山峰。靠近才知道，那是一座岛，中央耸立着高山。我上岸转了两三天，看见一个浑身发光的人，手捧金钵，沿海滩走来。我问这里是不是蓬莱山，他亲口回答了我。
        - id: ch02-b18
          speaker: second_knight
          text: 不错，这里正是蓬莱山！
        - id: ch02-b19
          speaker: second_knight
          text: 我费尽力气爬上山顶，看到了银根扎在土中的金树。那里的奇事太多，永远也讲不完。我舍不得走，还是折下树枝，立刻往回赶。归途整整花了四百天。你看，我的衣服经过漫长的海上航行，到现在还是湿的。我急着把宝枝送给公主，连衣裳也没有换。
        - id: ch02-b20
          speaker: narrator
          text: 他的话才说完，六名珠宝匠便来到了宅院。公子雇他们做完宝枝，却一直没有付钱。他们只好呈上一封诉状，请公主替自己讨回工钱。六个人说，他们辛苦了一千多天，才造好眼前这根黄金为枝、白银为梢、宝石为果的枝条，可公子至今没有给过一文报酬。骗局就这样当场败露。公主终于摆脱又一个纠缠不休的求婚者，当然十分高兴，立刻把宝枝退还。她叫工匠们进来，慷慨地付清了工钱，众人才欢欢喜喜离开。不料在回家途中，愿望落空的公子追了上来。他恨这些人泄露秘密，把他们打得几乎丧命。工匠们好不容易才逃出生天。公子怒气冲冲地回了家，自知再也娶不到公主，从此断绝交游，独自隐居在深山里。

    - id: ch03
      title: 余下的宝物与天皇来访
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第三位公子有个朋友住在中国，于是写信托他寻找火鼠皮。传说这种动物身上的任何部分都有神奇的力量，再猛烈的火也伤不了它。公子答应朋友，只要能替自己拿到想要的东西，不管开出多高的价钱，他都愿意支付。后来传来消息，朋友乘坐的归国船只已经进港。公子立刻骑马赶去，路上足足跑了七天。他交给朋友一大笔钱，终于收下那张所谓的火鼠皮。回到家，他把皮小心翼翼放进盒子，派人送到公主房中，自己留在屋外，满怀期待地等候答复。
        - id: ch03-b02
          speaker: narrator
          text: 竹取翁又劝公主立刻见人，公主却要先把皮放进火里试一试。真火鼠皮绝不会燃烧。她拆掉包布，打开盒子，把皮扔进火中。只听一阵噼啪声，皮转眼便烧光了。第三位公子同样没有兑现诺言，也就这样失败了。
        - id: ch03-b03
          speaker: narrator
          text: 第四位公子也不比前面的人勇敢，他同样不肯亲自冒险。他召集所有家臣和仆从，命他们分头出发，到日本和中国的每一个角落去寻找头顶五色宝珠的龙。宝珠找不到，任何人都不许回来。大批人马朝不同方向上路，心里却根本不打算服从。大家都觉得这道命令荒唐透顶，绝不可能办到。他们索性结伴去风景宜人的乡间游玩，一边享受假日，一边抱怨主人蛮不讲理。公子留在家中，却认定这么多手下不可能找不到宝珠。他把宅院收拾一新，装饰得富丽堂皇，准备迎接月光公主，心里确信自己必定会赢。
        - id: ch03-b04
          speaker: narrator
          text: 公子在焦急的等待中熬过整整一年，手下还是没有带着龙珠回来。他绝望极了，再也等不下去，只带上两个人，雇船亲自出海。船长和水手都说，茫茫大海上寻找一条龙实在荒唐，不肯接受命令。公子一再强迫，他们才不得不把船驶离海岸。出海不过几天，一场猛烈的风暴便袭来，而且久久不肯停息。等到风浪终于减弱，公子已经吓得彻底放弃寻找龙。那时的航海方法十分简陋，他们无法控制船只，最后被狂风吹上了岸。一路的奔波和忧虑耗尽了公子的力气。他又染上很重的风寒，整张脸都肿了起来，只能躺在床上休养。
        - id: ch03-b05
          speaker: narrator
          text: 当地官员听说他的困境，派使者送来一封信，请他到府中居住。公子在那里躺着，反复回想自己受过的苦，对公主的爱一点点变成了怒火。他把所有磨难都怪在她身上，甚至猜想，公主是为了彻底摆脱自己，才故意派下不可能完成的任务，盼他死在途中。就在这时，先前被派出去寻找宝珠的仆从们陆续回来拜见。他们知道自己根本没有执行命令，本以为一定会受重罚，没想到主人非但没有发怒，反而称赞了他们。公子告诉大家，自己已经受够了这种冒险。往后无论如何，他也不会再靠近月光公主的宅院。
        - id: ch03-b06
          speaker: narrator
          text: 第五位公子也没能找到燕腹中的贝壳。就这样，五个人全都失败了。
        - id: ch03-b07
          speaker: narrator
          text: 这时，公主的美名传到了天皇耳中。天皇派宫廷女官去看看，她是否真像传闻中那样美。如果传言属实，便召她入宫做女官。可女官到了以后，无论竹取翁怎样恳求，公主都不肯见她。使者说这是天皇的命令，公主便告诉养父，若有人逼她奉命入宫，她会从世间消失。
        - id: ch03-b08
          speaker: narrator
          text: 天皇听说她宁肯消失也不应召，决定亲自前往。他安排了一场狩猎，地点就在竹取翁家附近，打算借这个机会亲眼看看公主。他事先把计划告诉老人，也得到了许可。第二天，天皇带着大批随从出发。走到半路，他故意策马加速，很快便把众人全都甩在身后，独自找到竹取翁的宅院。他下马走进屋中，没有在别处停留，径直来到公主同侍女们坐着的地方。
        - id: ch03-b09
          speaker: narrator
          text: 天皇从没见过这样美丽的人。她浑身流淌着柔光，比任何凡间女子都动人。公主发觉陌生人正看着自己，想逃出房间，却被天皇拦下。他恳求她听自己把话说完，她只把脸藏在衣袖里。
        - id: ch03-b10
          speaker: narrator
          text: 天皇深深爱上了她，请她进宫，答应赐予尊贵的地位和一切想要的东西。他说，这般风姿与美貌应该照耀宫廷，不该藏在竹匠的小屋里，马上就要传唤御辇接她回去。
        - id: ch03-b11
          speaker: narrator
          text: 公主阻止了他。她说，只要有人强迫自己进宫，她立刻会化作影子。话音未落，她的身形便在天皇眼前渐渐淡去。天皇赶紧答应不再勉强，只求她恢复原状。公主这才重新显现。
        - id: ch03-b12
          speaker: narrator
          text: 天色已经不早，随从们久久等不到君主，一定正在担心，天皇只得同公主告别。他满怀悲伤地离开了宅院。在他心中，月光公主是全世界最美的女子，其他人站在她面前全都黯然无光。此后，他白天想着她，夜里也忘不了她，把许多时间都用来写诗。每一首诗都诉说着自己的爱与忠贞，再由使者送到公主手中。公主不肯再与天皇见面，却也亲手写下许多短歌。她的语气温柔而亲切，却一次次告诉他，自己绝不可能嫁给人间任何男子。即使如此，收到这些诗，仍能让天皇感到安慰。

    - id: ch04
      title: 八月十五的约期
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 不久，养父母发现公主夜夜坐在露台上，望着月亮，一看就是几个时辰。她心事重重，最后总会痛哭。一天夜里，老人又看见她哭得肝肠寸断，便求她说出悲伤的原因。
        - id: ch04-b02
          speaker: moonlight
          text: 父亲从前猜得没有错，我真的不属于这个世界。我来自月亮，留在人间的日子就快结束了。这个八月十五，月宫的亲友会来接我，我必须回去。我的亲生父母都在那里，可我在人间度过了这么久，已经忘记了他们，也忘记了月宫。想到要离开您和母亲，离开这个让我幸福生活多年的家，我怎么能不伤心呢？
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: 侍女们听到这个消息，个个悲伤不已。一想到公主很快就会离开，她们难过得吃不下饭，也喝不下水。消息很快传到宫中，天皇立刻派使者赶往宅院，要查明传闻究竟是真是假。竹取翁亲自出门迎接他们。短短几天的悲痛已经让老人苍老许多，他看上去远远不止七十岁了。他一面痛哭，一面告诉使者，这个不幸的消息完全属实。可是，他绝不会眼看着养女被带走。他打算把月宫来人全都抓住，拼尽自己最后一点力气，也要把公主留在人间。
        - id: ch04-b04
          speaker: narrator
          text: 使者回宫，把亲眼所见的一切禀告天皇。到了八月十五，天皇派来两千名武士守卫宅院。一千人驻守屋顶，另一千人把住屋子所有的出入口。他们全是训练有素的弓箭手，每个人都带着弓和箭。老夫妇则把月光公主藏进最里面的房间。老人命令所有人彻夜不眠，必须严密守候，随时准备保护公主。他相信宅院已经防守得如此严密，再加上天皇的两千名武士，就算月宫使者真的来到，也休想从他们手中把公主带走。
        - id: ch04-b05
          speaker: moonlight
          text: 父亲，这些办法都留不住我。月宫的人一旦到来，世间没有什么力量能阻止他们，连天皇的武士也无能为力。我实在舍不得离开您和母亲。这些年，我早已把你们当作亲生父母。若能由我选择，我愿意陪伴你们到老，也好报答这一生得到的疼爱与恩情。
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: 夜越来越深。金黄的秋月升到高空，把沉睡的世界照得一片金亮。松林与竹林寂静无声，屋顶上一千名武士也默默守候。天色渐渐泛白，人人都以为危险过去，公主不用离开了。
        - id: ch04-b07
          speaker: narrator
          text: 就在这时，月亮四周忽然聚起一团云。守卫们眼看着它向大地飘落，越来越近，直奔宅院而来。天空很快完全被遮住。云团停在屋顶上方，离地只有十尺。云中悬着一辆飞行的车驾，车上站着一群发光的人。一个貌似君王的首领走出车驾，停在半空，叫老人出来。
        - id: ch04-b08
          speaker: moon_messenger
          text: 月光公主回归月亮的时候到了。她曾犯下重罪，因此被罚到下界住上一段时日。你一直悉心照料她，我们都知道，也已经用财富和好运报答了你。那些让你从竹中找到的金子，正是我们放进去的。
        - id: ch04-b09
          speaker: bamboo_cutter
          text: 我养了这孩子二十年，她从来没有做错过一件事。你们要找的女子绝不会是她。求你们去别处找吧！
          emotion: sad
        - id: ch04-b10
          speaker: narrator
          text: 月宫使者没有理会老人的恳求，向宅中高声呼唤。
        - id: ch04-b11
          speaker: moon_messenger
          text: 月光公主，从这卑微的住处出来吧。不要再停留片刻。
        - id: ch04-b12
          speaker: narrator
          text: 公主房间的屏风随即自行滑开。她显露在众人眼前，浑身放出自己的光，明亮、神奇而美丽。使者将她领到车驾上。公主回头看见老人悲痛欲绝，满怀怜惜地安慰他。
        - id: ch04-b13
          speaker: moonlight
          text: 离开并不是我的心愿。往后每当您仰望月亮，一定要想起我。
          emotion: sad

    - id: ch05
      title: 月宫车驾与富士山的烟
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 竹取翁舍不得让公主独自离开，苦苦恳求月宫使者，准许自己陪她一起去。月宫人却拒绝了。公主只好脱下身上的刺绣外衣，亲手交给老人，请他留作纪念。车驾上还有两个月宫人，一个捧着一件神奇的羽衣，另一个拿着小瓶，瓶里装满长生不老药。他们把药递给公主，要她服下。公主只喝了一点，心里仍惦记着养父，便想把剩下的仙药全都交给老人。可是月宫人立刻阻止了她，不许她把药留下。
        - id: ch05-b02
          speaker: narrator
          text: 月宫人要把羽衣披到公主肩上，她请他们先等一等。
        - id: ch05-b03
          speaker: moonlight
          text: 我不能忘记天皇这位好朋友。趁我还保留着人间的形体，必须再写一封信，向他告别。
        - id: ch05-b04
          speaker: narrator
          text: 月宫使者和驾车人都急着启程，已经等得不耐烦了。公主却没有因此停笔，仍请他们留在原处，一直等到自己把最后的心意写完。随后，她把那只装着长生不老药的小瓶同告别信放在一起，郑重交给竹取翁，请老人代她送进宫中，亲手呈给天皇。
        - id: ch05-b05
          speaker: narrator
          text: 月宫车驾终于开始转动，缓缓离开大地，朝高空的月亮升去。留在宅院里的人全都含着眼泪，久久仰望，谁也舍不得移开目光，目送月光公主的身影越来越小、越来越远。离别的时刻终于来了。就在这时，黎明破晓了。玫瑰色的晨光铺满天空，清晨的风托着一片片柔软的白云飘过。月宫车驾和车上的所有人渐渐融入云层，最后再也看不见了。
        - id: ch05-b06
          speaker: narrator
          text: 竹取翁遵守公主最后的嘱托，把她的告别信和长生不老药一同送进宫中。这是她留给人间的最后一封信，身影已经永远回到了月亮。天皇收到以后，心中悲痛，连那只装着仙药的小瓶也不敢触碰。他随即派出御使，命他们把仙药连同书信一起带到全国最神圣的山，也就是高耸入云的富士山。御使登上山顶，等到太阳升起，便在那里把信和长生不老药一同焚烧。火焰熄灭以后，烟雾仍从山巅向天空飘去。因此直到今天，人们还说，富士山顶总有一缕烟不断升起，一直飘入高高的云层。
