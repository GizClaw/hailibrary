  chapters:
    - id: ch01
      title: The Child in the Bamboo
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago, an old bamboo cutter lived with his wife. They were poor, and their greatest sorrow was that Heaven had sent them no child to brighten their old age. The old man saw no hope of resting from his labor until death finally laid him in a quiet grave. Each morning, he walked into the woods and hills, wherever green bamboo plumes rose against the sky. He chose the stems he needed and cut them down. Some he split lengthwise, and some he cut into joints. Then he carried the bamboo home and shaped it into many useful things for the household. He and his wife earned their small living by selling what he made.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One morning, he went out as usual and found a fine clump of bamboo. He had only just begun to work when a soft, brilliant light flooded the green grove, as if the full moon had risen over that very spot. Astonished, he looked around and saw the radiance streaming from one bamboo stem. The old man dropped his ax and walked toward the light. As he drew nearer, he saw that the glow came from a hollow in the green stem. There, in the middle of all that brightness, stood a tiny human being. She was only three inches tall and more beautiful than anything he had ever seen.
        - id: ch01-b03
          speaker: bamboo_cutter
          text: >-
            I found you here among the bamboos where I work each day. Heaven must have sent you to be my child.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He lifted the little girl into his hand and carried her home for his wife to raise. The child was so beautiful and so very small that the old woman placed her in a basket. There she would be safe from even the slightest chance of harm. The old couple had regretted all their lives that they had no children of their own. Now they poured all the love of their later years into the marvelous child who had come to them, and at last their home was happy.
        - id: ch01-b05
          speaker: narrator
          text: >-
            From that day on, the old man often found gold hidden in the notches of the bamboo when he cut it down and split it open. He found precious stones there too. Little by little, the treasure made him rich. He built a fine house for his family. Before long, no one knew him as the poor bamboo cutter anymore. He had become a wealthy man.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Only three months passed before the bamboo child, wonderful to say, grew into a young woman. Her foster parents arranged her hair and dressed her in beautiful kimonos. Because her beauty was so extraordinary, they kept her behind screens like a princess. No visitor was allowed to see her, and the old couple waited on her themselves. She seemed to be made of light. Her soft glow filled the whole house, turning even the darkness of night bright as day. Her presence brought happiness to everyone around her. Whenever the old man felt sorrowful, he needed only to look at his foster daughter. At once, his sadness vanished, and he felt as happy as he had in his youth.
        - id: ch01-b07
          speaker: narrator
          text: >-
            At last, the day came to name their new-found child. The old couple invited a celebrated name-giver. Because her body gave out such a soft, bright glow, he called her Princess Moonlight, as though she were the daughter of the Moon God. The naming festival continued for three days, with music, song, and dancing. All the old couple's friends and relatives came and shared in the celebration. Everyone who saw the Princess declared that no one so lovely had ever lived. They said every other beauty across the length and breadth of the land would seem pale beside her.
    - id: ch02
      title: Five Faithful Suitors
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            News of Princess Moonlight's beauty traveled far and wide. Suitors came from near and far, hoping to marry her or simply catch one glimpse of her. They stationed themselves outside the house and made little holes in the fence. Day and night they watched for the moment when she might pass from one room to another along the veranda. Some even gave up their sleep for that single chance, but all their watching brought them nothing. Then they approached the house and tried to speak with the old couple or one of the servants. No one would receive them. Even after all that disappointment, they stayed for days and nights because their longing to see the Princess was so great.
        - id: ch02-b02
          speaker: narrator
          text: >-
            At last, most of the men understood that their hope was useless, and they returned home. Five Knights remained. Instead of weakening their determination, every obstacle seemed to make it stronger. They would not leave the dwelling, even for a proper meal. They ate whatever scraps could be brought to them and stood outside through sunshine and rain. Sometimes they sent letters to Princess Moonlight, but no answer came. When the letters failed, they wrote poems. Their verses told of a hopeless love that robbed them of sleep, food, rest, and even the comfort of home. Still the Princess gave no sign that she had received a single word.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Winter passed while the five men waited in their hopeless state. Snow, frost, and cold winds slowly gave way to the gentle warmth of spring. Then summer came, and the sun burned white and fierce above them. Still the faithful Knights kept their watch. After all those months, they called to the bamboo cutter and begged him to take pity on them and show them the Princess. He gave them only one answer. Because he was not her true father, he could not demand that she act against her wishes. The five men returned to their separate homes and tried to think of some way to touch her proud heart. They took rosaries in their hands, knelt at their household shrines, and burned precious incense. Day after day, they prayed to Buddha for the one thing they desired. Even so, they could find no rest at home.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Soon the Knights returned to the bamboo cutter's house. They asked whether the Princess had truly decided never to see any man at all. They begged the old man to speak for them and tell her how great their love was. They reminded him how long they had waited through winter cold and summer heat. They had lived outdoors in every kind of weather, often without food, rest, or sleep. If she would give them one chance to speak for themselves, they said, they would count that whole long vigil as a pleasure.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The bamboo cutter felt sorry for them. In his heart, he hoped his foster daughter might marry one of these faithful men. He went to her and spoke with great respect.
        - id: ch02-b06
          speaker: bamboo_cutter
          text: >-
            You have always seemed like a heavenly being to me. Still, I raised you as my own child, and you have lived safely beneath my roof. Would you refuse the one thing I ask of you?
        - id: ch02-b07
          speaker: princess_moonlight
          text: >-
            There is nothing I would not do for you. I honor and love you as my own father. I cannot even remember the time before I came to this earth.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Her words delighted him. He explained that he longed to see her safely and happily married before he died.
        - id: ch02-b09
          speaker: bamboo_cutter
          text: >-
            I am more than seventy years old, and my life may end at any time. You should meet these five suitors and choose one of them.
        - id: ch02-b10
          speaker: princess_moonlight
          text: >-
            Why must I do that? I do not wish to marry now.
          emotion: sad
        - id: ch02-b11
          speaker: bamboo_cutter
          text: >-
            I found you years ago, only three inches tall, inside a bamboo filled with white light. That is why I have always believed you are more than mortal. While I live, you may remain as you are. But when I am gone, who will care for you? Please meet these brave men one at a time and choose one for your husband.
        - id: ch02-b12
          speaker: princess_moonlight
          text: >-
            Perhaps the stories make me sound more beautiful than I am. A man who marries me before he truly knows me may change his heart afterward. Even if you believe these Knights are worthy, I cannot be sure of them. It would not be wise for me to see them yet.
        - id: ch02-b13
          speaker: bamboo_cutter
          text: >-
            That is reasonable. But what must a man do before you will see him? These five have waited for months through winter and summer. They have gone without food and sleep for the hope of winning you. What more could you ask?
        - id: ch02-b14
          speaker: narrator
          text: >-
            Princess Moonlight said she would test their love once more. Each Knight must travel to a distant land and bring back something she wished to possess.
        - id: ch02-b15
          speaker: narrator
          text: >-
            That same evening, the suitors came to the house. One after another, they played their flutes and sang songs they had composed about their great and tireless love. The bamboo cutter went outside to meet them. He told them how sorry he was for all they had endured and praised the patience they had shown in trying to win his foster daughter. Then he delivered her message. She would marry whichever man succeeded in bringing her the thing she wanted. This would be her test. All five accepted the trial and called it an excellent plan, because the result would leave no reason for jealousy among them.
        - id: ch02-b16
          speaker: narrator
          text: >-
            Princess Moonlight sent a different command to each man. The First Knight must travel to India and bring her the stone bowl that had belonged to Buddha. The Second must find Mount Horai, which was said to rise from the Eastern Sea. From the summit, he must cut a branch from a marvelous tree whose roots were silver, whose trunk was gold, and whose fruit was made of white jewels. The Third must go to China, find the fire-rat, and bring back its skin. The Fourth must search for the dragon that carried a stone of five shining colors upon its head and take that stone for her. The Fifth must find a swallow that carried a shell inside its stomach and bring her the shell.
        - id: ch02-b17
          speaker: narrator
          text: >-
            The old man thought the tasks terribly hard, but the Princess would accept no others. When he repeated her commands exactly, all five Knights went home in despair. The quests seemed impossible. Yet after a while, thoughts of Princess Moonlight revived their love, and each man decided to make an attempt.
    - id: ch03
      title: The Five Impossible Quests
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The First Knight sent word to the Princess that he was setting out that very day to search for Buddha's bowl. He hoped, he said, to bring it to her soon. But in those days, a journey all the way to India was difficult and filled with danger. He did not have the courage to attempt it. Instead, he went to a temple in Kyoto and took a stone bowl from its altar, paying the priest a large amount of money. He wrapped the bowl in a cloth of gold. Then, to make his false quest seem believable, he waited quietly for three whole years before carrying it to the bamboo cutter.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Princess Moonlight wondered how the Knight could have returned so soon from such a distant place. She took the bowl from its golden wrapping and examined it. A true holy bowl, she believed, would fill the room with light. This one did not shine at all. She knew at once that it was only a common bowl and not Buddha's. She sent it straight back and refused to see the man who had brought it. The First Knight threw the useless bowl away and returned home in despair. Now he gave up every hope of winning the Princess.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The Second Knight told his parents that his health required a change of air. He was ashamed to admit that love for Princess Moonlight was the true reason he meant to leave them. At the same time, he sent word to the Princess that he was beginning his journey to Mount Horai. He promised to bring back the branch of gold and silver that she desired. His servants traveled with him for half the journey. Then he dismissed them and continued without them.
        - id: ch03-b04
          speaker: narrator
          text: >-
            When he reached the coast, the Knight boarded a small ship and sailed away. After three days, he landed and hired carpenters to build a secret house. It was designed so that no outsider could find a way inside. The Knight shut himself in with six skilled jewelers. He asked them to create the kind of branch that might convince the Princess it came from the wonderful tree on Mount Horai. They shaped it from gold and silver and hung shining jewels upon it like fruit. The Knight had questioned many people about the island, and every one of them had said the same thing. Mount Horai belonged to old stories, not to the real world.
        - id: ch03-b05
          speaker: narrator
          text: >-
            When the jeweled branch was finished, the Knight began his journey home. He carefully made himself look weary and worn, as though a long voyage had nearly exhausted him. He placed the branch inside a lacquer box and carried it to the bamboo cutter, begging him to present it to the Princess. The Knight's travel-stained appearance completely deceived the old man. He believed the suitor had only just returned from a faraway island with the promised treasure. He urged Princess Moonlight to see him. As he opened the box, the old man praised the branch as a wonder found nowhere else in the land. He spoke admiringly of the handsome, courageous man who had dared to journey to distant Mount Horai. The Princess said nothing. She only looked very sad.
        - id: ch03-b06
          speaker: narrator
          text: >-
            She examined the branch carefully. It seemed impossible to her that anyone could reach Mount Horai and return so easily. She told her foster father that the branch must have been made by human hands. The old man went outside and asked the waiting Knight where he had found it.
        - id: ch03-b07
          speaker: second_knight
          text: >-
            Two years ago, I sailed for Mount Horai. A storm swept my ship far into the Eastern Sea and cast us onto an unknown island. Demons there threatened to eat me, but I befriended them, and they helped repair our ship. We sailed on without enough food, and sickness spread among us.
        - id: ch03-b08
          speaker: second_knight
          text: >-
            On the five-hundredth day, I saw a mountain on the horizon. I landed and wandered for days until I met a shining being carrying a golden bowl. He told me I had found Mount Horai. I climbed to the summit, where the golden tree stood with silver roots. That land held more wonders than I could ever tell.
        - id: ch03-b09
          speaker: second_knight
          text: >-
            I broke off this branch and hurried home. Even at my greatest speed, the return took four hundred days. My clothes are still damp from the sea. I would not stop to change before bringing the branch to the Princess.
        - id: ch03-b10
          speaker: narrator
          text: >-
            At that very moment, the six jewelers who had made the branch arrived at the house. The Knight had never paid them for their work. They sent Princess Moonlight a petition asking her to give them the wages they were owed. For more than a thousand days, they explained, they had labored over the branch the Knight had just presented to her. They had made its golden stem, its silver twigs, and every piece of jeweled fruit.
        - id: ch03-b11
          speaker: narrator
          text: >-
            The Knight's deception was exposed before everyone. Princess Moonlight was relieved to escape another suitor who would not leave her in peace. She sent the false branch back at once. Then she called the craftsmen inside and paid them generously from her own wealth. They went away happy, but their happiness did not last. On the road home, the disappointed Knight overtook them. Furious because they had revealed his secret, he beat them until they were nearly dead. The six men barely escaped with their lives. The Knight himself returned home with rage in his heart. In despair of ever winning the Princess, he abandoned society and chose a lonely life in the mountains.
        - id: ch03-b12
          speaker: narrator
          text: >-
            The Third Knight had a friend living in China, so he wrote and asked him to obtain the fire-rat's skin. Every part of that strange animal was said to have a special power. Fire could never harm it. The Knight promised to pay any price his friend might name if only he could secure the skin. At last, news came that his friend's ship had reached port. The Knight rode on horseback for seven days to meet him. He handed over a large sum of money and received the treasure in return. Once home, he placed the skin carefully in a box. He sent it into the Princess and remained outside, waiting for her answer.
        - id: ch03-b13
          speaker: narrator
          text: >-
            As usual, the bamboo cutter carried the box to his foster daughter. He tried to coax her into seeing the Knight without delay. Princess Moonlight refused. Before she trusted the gift, she must test it. If this was truly the fire-rat's skin, flames could not burn it. She removed the fine crape wrapper and opened the box. Then she cast the skin into the fire. It crackled and burned up at once. The man had not kept his promise, and the Third Knight's quest had failed.
        - id: ch03-b14
          speaker: narrator
          text: >-
            The Fourth Knight was no more eager to face danger than the men before him. Instead of hunting the dragon himself, he called all his servants together. He ordered them to search far and wide across Japan and China for the jewel that shone in five colors. None of them was allowed to come home until it had been found. The servants considered the command impossible and had no intention of obeying it. They went off together to pleasant places in the countryside, treated the journey as a holiday, and complained about the unreasonable master who had sent them away.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Meanwhile, the Knight felt certain that so many servants could not fail. He returned to his house and decorated it beautifully so it would be ready to receive Princess Moonlight. One long year passed while he waited, and not one of his men came back with the dragon's jewel. At last, desperation drove him to act. He took only two men with him, hired a ship, and commanded the captain to sail in search of the dragon. The captain and sailors refused at first. They told him it was absurd to hunt for such a creature. The Knight kept pressing them until at last they had no choice but to put out to sea.
        - id: ch03-b16
          speaker: narrator
          text: >-
            They had been sailing only a few days when a great storm overtook them. Its fury lasted so long that the Knight lost every desire to continue hunting the dragon. Because sailors in those days had few ways to guide a ship, the wind finally drove them onto an unknown shore. Travel and anxiety had worn the Fourth Knight out. He caught a heavy cold, his face swelled badly, and he had to take to his bed. When the governor of that place heard what had happened, he sent messengers with a letter inviting the sick traveler into his house.
        - id: ch03-b17
          speaker: narrator
          text: >-
            As the Knight thought over his hardships, his love turned to anger. He blamed the Princess and decided she might have sent him on the impossible journey just to kill him and be rid of him. Then his wandering servants came to see him. To their surprise, he praised them instead of punishing them. He was sick of adventure, he said, and would never go near the Princess again.
        - id: ch03-b18
          speaker: narrator
          text: >-
            The Fifth Knight failed like all the others. He could not find the shell carried by the swallow.
    - id: ch04
      title: The Emperor Comes to See Her
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            By then, word of Princess Moonlight's beauty had reached the Emperor. He sent a Court lady to discover whether the reports were true. If they were, he meant to summon the Princess to the Palace and make her one of his ladies-in-waiting.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Even when her foster father pleaded with her, Princess Moonlight refused to receive the visitor.
        - id: ch04-b03
          speaker: court_lady
          text: >-
            You must see me. This is the Emperor's command.
        - id: ch04-b04
          speaker: princess_moonlight
          text: >-
            If I am forced to obey and go to the Palace, I will vanish from the earth.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The Court lady returned with news of the Princess's refusal and her warning that she would disappear if anyone forced her to obey. The Emperor then decided to see this mysterious woman for himself. He planned a hunting excursion near the bamboo cutter's house and sent the old man a message explaining what he meant to do. The old man agreed. The next day, the Emperor set out with his whole retinue. Before long, he found a way to outride them all. He reached the bamboo cutter's home alone, dismounted, and went directly inside. There he found the Princess seated among her attendant maidens.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Never in his life had the Emperor seen anyone so wonderfully beautiful. Princess Moonlight was more lovely than any human being, and her own soft radiance shone around her. He could not stop looking at her. The Princess soon became aware that a stranger had entered and was watching her. She rose and tried to escape from the room. The Emperor caught her before she could leave and begged her to listen to what he had come to say. She gave him no answer and hid her face inside the long sleeves of her robe.
        - id: ch04-b07
          speaker: emperor
          text: >-
            Come with me to the Imperial Court. I will give you a place of honor and everything you could wish for. Such grace and beauty should not stay hidden in a bamboo cutter's cottage.
        - id: ch04-b08
          speaker: narrator
          text: >-
            He was ready to call for an Imperial palanquin and take her away at once. Princess Moonlight stopped him.
        - id: ch04-b09
          speaker: princess_moonlight
          text: >-
            If you force me to the Palace, I will become a shadow.
        - id: ch04-b10
          speaker: narrator
          text: >-
            As she spoke, her shape began to fade before his eyes.
        - id: ch04-b11
          speaker: emperor
          text: >-
            I promise you will remain free. Please return to your true form.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Because he had promised not to take her, she became herself again. By then, it was time for the Emperor to return. He knew his retinue would be wondering what had happened to their royal master after he had been missing for so long. He said farewell to Princess Moonlight and left the bamboo cutter's house with a sorrowful heart.
        - id: ch04-b13
          speaker: narrator
          text: >-
            To the Emperor, Princess Moonlight was the most beautiful woman in the world. Every other woman seemed dark beside her radiance. He thought of the Princess by night and by day. Much of his time was spent composing poems that spoke of his love and devotion, and he sent each one to her. Princess Moonlight still refused to see him, but she did not leave his verses unanswered. She wrote many little songs of her own. Gently and kindly, they told him that she could never marry anyone who belonged to this earth. Though her answer could not fulfill his hope, the poems she sent always gave him pleasure.
    - id: ch05
      title: The Secret of the Moon
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Night after night, the Princess's foster parents saw her sit on the balcony and gaze at the moon for hours. Each time, her deep sorrow ended in tears. One night, the old man found her weeping as if her heart would break and begged her to explain.
        - id: ch05-b02
          speaker: princess_moonlight
          text: >-
            You were right to think I did not belong to this world. I came from the moon, and my time on earth is nearly over. On the fifteenth day of this August, my people will come for me, and I must return.
          emotion: sad
        - id: ch05-b03
          speaker: princess_moonlight
          text: >-
            My parents are there. But I have spent a lifetime on earth, and I have forgotten them and the moon-world too. I weep because I must leave you and Mother, and the home where I have been so happy.
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: >-
            The Princess's attendants heard what she had told her foster father. Sorrow overwhelmed them. They could neither eat nor drink when they thought that she would leave them so soon. News of her coming departure spread beyond the house and reached the Emperor. As soon as he heard it, he sent messengers to discover whether the report was really true.
        - id: ch05-b05
          speaker: narrator
          text: >-
            The bamboo cutter went outside to meet the Imperial messengers. The grief of the past few days had changed him terribly. He looked far older than his seventy years. Weeping bitterly, he told the men that the report was only too true. Even so, he had not given up. He intended to take the envoys from the moon prisoner and do everything in his power to stop them from carrying Princess Moonlight away. The messengers returned to the Palace and told His Majesty everything the old man had said.
        - id: ch05-b06
          speaker: narrator
          text: >-
            On the fifteenth day of the month, the Emperor sent a guard of two thousand warriors to the bamboo cutter's house. Every one of them was a well-trained archer carrying a bow and arrows. One thousand took their places upon the roof. The other thousand surrounded the house and kept watch over every entrance. Deep inside the dwelling, the bamboo cutter and his wife hid Princess Moonlight in an inner room.
        - id: ch05-b07
          speaker: narrator
          text: >-
            The old man ordered everyone to stay awake and protect her. With the Imperial soldiers surrounding the house, he hoped to resist the visitors from the moon. The Princess told him no defense could succeed. When her people came, even the Emperor's warriors would be powerless.
        - id: ch05-b08
          speaker: princess_moonlight
          text: >-
            I am so sorry to leave you and Mother. I have learned to love you as my own parents. If the choice were mine, I would stay beside you in your old age and try to repay all the love and kindness you have given me.
          emotion: sad
    - id: ch06
      title: The Chariot from the Moon
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            The hours of the very long watch passed. The yellow harvest moon climbed high and covered the sleeping world in golden light. The pine and bamboo forests were silent. So were the thousand armed men waiting on the roof.
        - id: ch06-b02
          speaker: narrator
          text: >-
            The sky began to turn gray before dawn, and everyone hoped the danger had passed. Then a cloud formed around the moon. It rolled down toward the earth, drawing nearer and nearer to the house.
        - id: ch06-b03
          speaker: narrator
          text: >-
            As the cloud descended, it spread across the sky until every part of the heavens was hidden. At last, it stopped above the bamboo cutter's dwelling, only ten feet from the ground. In the heart of the cloud stood a flying chariot. A band of shining beings rode inside it. One among them had the appearance of a king and was clearly their chief. He stepped out of the chariot without falling. Poised in the air above the house, he called for the old man to come outside.
        - id: ch06-b04
          speaker: moon_chief
          text: >-
            The time has come for Princess Moonlight to return to the moon. She was sent to live here for a while as punishment for a grave fault. We know how well you cared for her. We rewarded you with wealth and prosperity by placing gold in the bamboo for you to find.
        - id: ch06-b05
          speaker: bamboo_cutter
          text: >-
            I have raised this Princess for twenty years, and she has never done a single wrong. The lady you seek cannot be my daughter. Please look somewhere else.
        - id: ch06-b06
          speaker: moon_chief
          text: >-
            Princess Moonlight, leave this humble house. You must not remain here another moment.
        - id: ch06-b07
          speaker: narrator
          text: >-
            At his words, the screens of the Princess's room opened by themselves. There she stood, shining in her own wonderful light. The moon chief led her out and placed her in the chariot.
        - id: ch06-b08
          speaker: narrator
          text: >-
            From the chariot, the Princess looked back at the bamboo cutter. She saw the depth of his sorrow and pitied the father who had cared for her all her earthly life. She spoke many words to comfort him. It was not her own wish to leave him, she said. Once she had returned to the sky, he must look up at the moon and remember the daughter he had found among the bamboo.
        - id: ch06-b09
          speaker: narrator
          text: >-
            The bamboo cutter begged to go with her, but the moon people refused. Princess Moonlight removed her embroidered outer robe and gave it to him as a keepsake.
        - id: ch06-b10
          speaker: narrator
          text: >-
            Two more beings waited in the chariot. One held a marvelous robe of wings, ready to place it upon the Princess's shoulders. The other carried a vial filled with the Elixir of Life and gave it to her to drink. Princess Moonlight swallowed only a little. She was about to pass the remaining elixir to her old foster father, but the moon people prevented her from giving it away. Then the being with the winged robe stepped forward to dress her for the journey home.
        - id: ch06-b11
          speaker: princess_moonlight
          text: >-
            Wait. I must not forget my good friend, the Emperor. Before I leave this human form, I must write once more and say farewell.
        - id: ch06-b12
          speaker: narrator
          text: >-
            The moon messengers and the charioteers were impatient to depart, but Princess Moonlight would not let them hurry her. She kept them waiting while she wrote her last letter to the Emperor. When it was finished, she placed the vial containing the rest of the Elixir of Life beside it. She gave the letter and the elixir to the old bamboo cutter and asked him to deliver both gifts to her friend at the Imperial Palace.
        - id: ch06-b13
          speaker: narrator
          text: >-
            At last, the chariot began to roll upward through the sky toward the moon. The old couple, the attendants, and all the watchers gazed after Princess Moonlight with tears in their eyes. She grew smaller and farther away as the chariot climbed. Then dawn broke across the world. In the rosy light of day, the moon chariot and everyone within it vanished among soft white clouds. The morning wind carried those clouds across the sky.
        - id: ch06-b14
          speaker: narrator
          text: >-
            The old man kept his promise, and Princess Moonlight's letter was carried to the Palace. His Majesty received it along with the vial she had left behind. He was afraid even to touch the Elixir of Life. Instead of drinking it, he ordered royal messengers to carry both the elixir and the Princess's final letter to the top of the most sacred mountain in all the land. They climbed to the summit of Mount Fuji, and there, as the sun rose, they burned the letter and the vial together.
        - id: ch06-b15
          speaker: narrator
          text: >-
            And so, to this day, people say that smoke can be seen rising from the top of Mount Fuji toward the clouds.
