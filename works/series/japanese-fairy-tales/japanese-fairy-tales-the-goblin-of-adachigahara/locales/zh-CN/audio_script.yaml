audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    priest:
      display_name: 僧人
      tts:
        delivery: 谦和守礼，恐惧时急促而虔诚
        timbre: 清朗沉稳的成年男声
        pace: 平稳，逃亡时明显加快
        pitch: 中音
    old_woman:
      display_name: 老婆婆
      tts:
        delivery: 起初客气和善，显露本相后凶狠尖厉
        timbre: 苍老沙哑的女声
        pace: 缓慢，追赶时急促
        pitch: 中低音
  chapters:
    - id: ch01
      title: 荒野里的一点灯光
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，日本陆奥国有一片广阔的荒野，名叫安达原。传说那里住着一个吃人的妖怪，常常化成老婆婆的样子。旅人不时失踪，从此再没有消息。晚上，老婆婆们围着炭火盆，低声讲起可怕的传闻。清晨，姑娘们在井边淘米，也悄悄说，那些失踪的人都被引进了鬼婆的小屋，让她吃掉了。因为这妖怪只吃人肉。太阳一落，没人敢走近那片凶地。就连白天，人们也尽量绕开，还会提醒过路人千万小心。
        - id: ch01-b02
          speaker: narrator
          text: 一天傍晚，一位僧人来到安达原。他身穿僧衣，正在四处巡礼，一座寺院接一座寺院地参拜，或是求福，或是祈求罪过得到宽恕。那天，他耽误了行程，又迷失了方向。天色已晚，路上没有一个人，既没人给他指路，也没人警告他这里闹鬼。
        - id: ch01-b03
          speaker: narrator
          text: 僧人已经走了一整天，又累又饿。深秋的夜晚寒气逼人，他只想找到一户人家借宿。可他迷失在茫茫荒野中央，望遍四周，也看不到一点人烟。
        - id: ch01-b04
          speaker: narrator
          text: 他又转了几个时辰，终于望见远处有一丛树林。树影之间，透出了一线微光。僧人顿时欢喜起来。
        - id: ch01-b05
          speaker: priest
          text: 啊，那里一定有间小屋！今晚总算能找到落脚的地方了。
          emotion: happy
        - id: ch01-b06
          speaker: narrator
          text: 他盯着那点灯光，拖着酸痛的双脚，尽可能快地赶过去。不久，一间破败的小屋出现在眼前。竹篱已经断了，杂草从缺口里钻出来。纸拉门到处都是破洞，弯曲的老屋柱仿佛连茅草屋顶也快撑不住了。屋门敞开着。昏黄的旧灯笼下，一个老婆婆正专心纺线。僧人隔着竹篱向她打招呼。
        - id: ch01-b07
          speaker: priest
          text: 老婆婆，晚上好。我是个过路人，冒昧打扰了。我迷了路，今晚连个歇脚的地方也没有。求您行个方便，让我在屋檐下住一夜吧。
        - id: ch01-b08
          speaker: narrator
          text: 老婆婆听见有人说话，停下纺车，站起来走向这个不速之客。
        - id: ch01-b09
          speaker: old_woman
          text: 真可怜。这么晚了，你在如此荒凉的地方迷路，一定急坏了。可我不能留你过夜呀。这间破屋没有床，也实在没有地方安顿客人。
        - id: ch01-b10
          speaker: priest
          text: 那不要紧。只要有个屋顶替我挡一夜风寒就够了。您肯让我睡在厨房地板上，我也感激不尽。我实在累得走不动了。您若不肯收留我，我只能睡在冰冷的荒野上。求您让我留下吧。
        - id: ch01-b11
          speaker: narrator
          text: 僧人再三恳求，老婆婆却一直显得很为难。到最后，她才松了口。
        - id: ch01-b12
          speaker: old_woman
          text: 好吧，你就住一夜。这里太简陋，我没什么能招待你。快进来，我生起火来，夜里冷得很。
        - id: ch01-b13
          speaker: narrator
          text: 僧人求之不得。他脱下草鞋，走进小屋。老婆婆拿来几根木柴，点起火，请客人靠近些暖身子。
    - id: ch02
      title: 老婆婆的禁令
      blocks:
        - id: ch02-b01
          speaker: old_woman
          text: 走了这么远，你一定饿了。我去煮些饭给你吃。
        - id: ch02-b02
          speaker: narrator
          text: 僧人吃过晚饭，老婆婆也在火塘边坐下，两个人谈了很久。他暗自庆幸，觉得自己运气真好，遇见了一位善良又好客的老人。后来木柴烧光了，火一点点暗下去，他又像刚进门时那样冷得发抖。
        - id: ch02-b03
          speaker: old_woman
          text: 你冷了吧。木柴已经用完，我出去捡一些。你留在这里，替我看着屋子。
        - id: ch02-b04
          speaker: priest
          text: 不，不，还是让我去吧。您年纪这么大，这样冷的夜里，我怎么能让您为了我出去捡柴呢？
        - id: ch02-b05
          speaker: narrator
          text: 老婆婆摇了摇头。
        - id: ch02-b06
          speaker: old_woman
          text: 你是客人，只管安安静静待在这里。
        - id: ch02-b07
          speaker: narrator
          text: 她说完便出了门。可才过片刻，老婆婆又折了回来。
        - id: ch02-b08
          speaker: old_woman
          text: 你一定要坐在原处，不许走动。不管发生什么事，都别靠近里屋，更不能往里看。千万记住我的话！
        - id: ch02-b09
          speaker: priest
          text: 既然您不许我靠近后屋，我当然不会过去。
        - id: ch02-b10
          speaker: narrator
          text: 僧人虽然答应下来，心里却十分困惑。老婆婆再次离开，小屋里只剩他一个人。火已经灭了，只有那盏灯笼发出昏暗的光。这一夜，他第一次觉得四周阴森古怪。老婆婆偏偏叮嘱他，绝不能偷看后屋。这句话既勾起他的好奇，也让他害怕。
        - id: ch02-b11
          speaker: narrator
          text: 那间屋里究竟藏着什么，竟不能让他看见？起初，他还记着自己的承诺，安分地坐在原处。可过了一阵，好奇心越来越强，他再也按捺不住了。
        - id: ch02-b12
          speaker: narrator
          text: 僧人起身，慢慢朝后屋走去。忽然，他想到老婆婆发现自己不听话，一定会非常生气，便又退回了火塘旁。
        - id: ch02-b13
          speaker: narrator
          text: 时间一点一点过去，老婆婆始终没有回来。他越来越害怕，不停猜想身后的屋里藏着怎样骇人的秘密。他非弄明白不可。
        - id: ch02-b14
          speaker: priest
          text: 只要我不说，她就不会知道。我只偷偷看一眼，趁她还没回来。
    - id: ch03
      title: 禁室里的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 僧人原本按日本人的坐法，把双脚压在身下。这时，他站起身，蹑手蹑脚地朝禁室挪去。他双手发抖，轻轻推开纸拉门，往里面看了一眼。眼前的景象，顿时让他浑身的血都冻住了。
        - id: ch03-b02
          speaker: narrator
          text: 屋里塞满死人的骨头。墙上血迹斑斑，地板上淌满人血。一个角落里，骷髅一层层堆到了屋顶。另一个角落堆着手臂的骨头，还有一处尽是腿骨。那股令人作呕的气味熏得他几乎昏过去。他吓得向后一倒，在地上蜷成一团，好半天动弹不得。他浑身哆嗦，牙齿格格作响，几乎连爬也爬不动，好不容易才离开那个可怕的地方。
        - id: ch03-b03
          speaker: priest
          text: 太可怕了！我竟闯进了什么样的魔窟？佛祖保佑，不然我就没命了。难道那个慈祥的老婆婆，真是吃人的鬼婆？等她回来，一定会现出原形，一口把我吞掉！
          emotion: fearful
        - id: ch03-b04
          speaker: narrator
          text: 这一喊，仿佛把他的力气唤了回来。僧人抓起斗笠和手杖，拼命冲出小屋。他在黑夜里一路狂奔，心中只有一个念头，那就是离鬼婆的巢穴越远越好。
        - id: ch03-b05
          speaker: narrator
          text: 他还没跑多远，背后就响起脚步声，还有一个声音追着高喊。
        - id: ch03-b06
          speaker: old_woman
          text: 站住！站住！
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: 僧人装作没听见，跑得更快。身后的脚步越来越近，叫喊声也越来越响。他终于听出来了，那正是老婆婆的声音。
        - id: ch03-b08
          speaker: old_woman
          text: 站住！你这个恶人！为什么偷看我不许你看的屋子？
          emotion: angry
    - id: ch04
      title: 黎明时分
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 僧人早已忘了疲惫，双脚飞也似的越过荒野，跑得比先前更快。恐惧给了他力量。他知道，一旦让鬼婆捉住，自己马上就会成为她的又一个牺牲品。他用尽全部心神，反复诵念佛号。
        - id: ch04-b02
          speaker: priest
          text: 南无阿弥陀佛，南无阿弥陀佛。
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: 可怕的老妖婆在后面紧追不舍。她的头发迎风乱舞，那张脸在怒火中显出了恶鬼的本相。她手里握着一把染满鲜血的大刀，一边追，一边尖声厉叫。
        - id: ch04-b04
          speaker: old_woman
          text: 站住！站住！
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: 终于，僧人觉得自己再也跑不动了。就在这时，黎明破晓。鬼婆随着黑夜一起消失，他得救了。
        - id: ch04-b06
          speaker: narrator
          text: 到了这时，僧人才知道，自己遇见的正是安达原的鬼婆。他从前常听人讲起这个妖怪，却从没相信传闻是真的。他深信自己能够死里逃生，全靠佛祖护佑，因为危急的时候，他曾向佛祖祈求救助。
        - id: ch04-b07
          speaker: narrator
          text: 朝阳升起，僧人取出念珠，低下头，诚心诵经祈祷，献上由衷的感谢。随后，他动身前往别处。那片闹鬼的荒野已经留在身后，他实在庆幸极了。
