audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, thoughtful, and direct
        timbre: clear and gentle
        pace: measured
        pitch: medium
    priest:
      display_name: Priest
      tts:
        delivery: earnest, courteous, and prayerful
        timbre: clear and mature
        pace: moderate
        pitch: medium-low
    old_woman:
      display_name: Old Woman
      tts:
        delivery: restrained and deliberate, turning fierce when revealed
        timbre: aged and rough
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: Lost on the Haunted Plain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago, a great plain called Adachigahara lay in the Japanese province of Mutsu. People said a cannibal goblin haunted that place in the shape of an old woman. Travelers vanished there from time to time and were never heard from again.
        - id: ch01-b02
          speaker: narrator
          text: >-
            In the evenings, old women whispered around their charcoal braziers. In the mornings, girls washing rice at the wells passed on the same dreadful stories. They said the missing travelers had been lured into the goblin's cottage and eaten, for human flesh was all she lived on. No one dared go near the haunted spot after sunset. Those who could avoid it stayed away even by day, and travelers were warned to fear it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One late-autumn evening, just as the sun was setting, a priest came onto the plain. He was a Buddhist pilgrim, traveling from shrine to shrine to pray for a blessing or ask forgiveness for sins. He seemed to have lost his way. The hour was so late that there was no one nearby to guide him or warn him where he was.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He had walked all day. Now he was tired and hungry, and the evening air was cold. He badly wanted to find a house where he could spend the night. But he was lost in the middle of the broad plain, and no matter where he looked, he could see no sign that anyone lived there.
        - id: ch01-b05
          speaker: narrator
          text: >-
            After wandering for hours, he finally saw a clump of trees far away. One faint ray of light shone between them.
        - id: ch01-b06
          speaker: priest
          text: >-
            Oh, surely that light comes from a cottage. Perhaps they'll let me stay for the night!
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: >-
            He kept his eyes on the light and dragged his aching feet toward it as quickly as he could. Before long, he reached a miserable little cottage. The place was almost falling down. Its bamboo fence was broken, with weeds and grass pushing through the gaps. The paper doors and window screens were full of holes. The house posts bent with age and barely seemed able to hold up the old thatched roof.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The hut stood open. Inside, by the glow of an old lantern, an old woman sat spinning busily. The pilgrim called to her from the other side of the bamboo fence.
        - id: ch01-b09
          speaker: priest
          text: >-
            Good evening, grandmother. Please forgive the interruption. I'm a traveler, and I've lost my way. I have nowhere to rest tonight. Would you be kind enough to let me sleep under your roof?
        - id: ch01-b10
          speaker: narrator
          text: >-
            The moment the old woman heard him, she stopped spinning. She rose and came toward the stranger.
        - id: ch01-b11
          speaker: old_woman
          text: >-
            I am sorry for you. It must be terrible to lose your way in such a lonely place this late. But I can't take you in. I have no bed for you, and this poor cottage has nothing fit for a guest.
        - id: ch01-b12
          speaker: priest
          text: >-
            That doesn't matter at all. I only need a roof over me. If you'll let me lie on the kitchen floor, I'll be grateful. I'm too tired to walk any farther tonight. Please don't turn me away, or I'll have to sleep outside on the cold plain.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The priest kept pleading with her. The old woman seemed most unwilling to agree, but at last she gave in.
        - id: ch01-b14
          speaker: old_woman
          text: >-
            Very well, you may stay. I can only give you a poor welcome, but come inside. I'll make a fire, because the night is cold.
    - id: ch02
      title: The Old Woman's Warning
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The pilgrim was only too glad to obey. He took off his sandals and entered the hut. The old woman brought sticks of wood, lit a fire, and invited him to sit close and warm himself.
        - id: ch02-b02
          speaker: old_woman
          text: >-
            You must be hungry after walking so far. I'll cook you some supper.
        - id: ch02-b03
          speaker: narrator
          text: >-
            She went into the kitchen and cooked rice for him. When the priest had eaten, she sat beside the fireplace, and the two of them talked for a long while. He thought how fortunate he was to have found such a kind and generous old woman.
        - id: ch02-b04
          speaker: narrator
          text: >-
            At last, all the wood had burned away. The fire slowly sank, and the priest began to shiver again, just as he had when he first arrived.
        - id: ch02-b05
          speaker: old_woman
          text: >-
            I can see you're cold. We've used every stick, so I'll go out and gather more wood. Stay here and watch the house until I return.
        - id: ch02-b06
          speaker: priest
          text: >-
            No, please let me go instead. You're old, and I can't allow you to fetch wood for me on a cold night like this.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The old woman shook her head.
        - id: ch02-b08
          speaker: old_woman
          text: >-
            You are my guest. You must stay here quietly.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Then she left the cottage. A minute later, however, she came back with one more warning.
        - id: ch02-b10
          speaker: old_woman
          text: >-
            Sit exactly where you are and don't move. Whatever happens, never go near the inner room, and never look inside it. Remember what I've told you!
        - id: ch02-b11
          speaker: priest
          text: >-
            If you tell me to stay away from the back room, then of course I will.
        - id: ch02-b12
          speaker: narrator
          text: >-
            The priest was puzzled, but the old woman went out once more and left him alone. The fire was dead now. Only the dim lantern lit the hut. For the first time that night, the place felt strange and frightening to him. Her warning kept circling through his mind. Whatever you do, don't look into the back room.
        - id: ch02-b13
          speaker: narrator
          text: >-
            What could be hidden there that she was so determined to keep him from seeing? For a while, the priest remembered his promise and stayed still. Yet his fear and curiosity kept growing, until he could hardly resist taking one look at the forbidden room.
        - id: ch02-b14
          speaker: narrator
          text: >-
            He stood and began creeping slowly toward the back. Then he imagined how angry the old woman would be if he disobeyed her. He turned around and went back to his place beside the cold fireplace.
        - id: ch02-b15
          speaker: narrator
          text: >-
            The minutes dragged by, and still she did not return. The priest grew more and more afraid as he wondered what dreadful secret lay in the room behind him. At last, he felt he had to know.
        - id: ch02-b16
          speaker: priest
          text: >-
            She'll never know I looked unless I tell her. I'll take one quick peep before she comes back.
    - id: ch03
      title: The Forbidden Room
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The priest rose from the Japanese sitting position in which his feet had been tucked beneath him. Then he stole toward the forbidden room. His hands trembled as he slid the door aside and looked in.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The sight turned his blood cold. Dead men's bones filled the room. Human blood covered the floor and spattered the walls. In one corner, skulls were stacked all the way to the ceiling. In another lay a heap of arm bones, and in another, a heap of leg bones. The sickening smell made him faint.
        - id: ch03-b03
          speaker: narrator
          text: >-
            He fell backward in horror and lay crumpled on the floor for some time, overcome with fear. His whole body shook. His teeth chattered, and he could barely crawl away from that dreadful place.
        - id: ch03-b04
          speaker: priest
          text: >-
            How horrible! What kind of awful den have I wandered into? Buddha help me, or I'm lost! Could that kind old woman truly be the cannibal goblin? When she returns, she'll show her real form and swallow me in a single bite!
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: >-
            As he spoke, his strength returned. He snatched up his hat and staff and rushed from the cottage as fast as his legs could carry him. He ran out into the night with only one thought in his mind. He must get as far away from the goblin's home as possible.
        - id: ch03-b06
          speaker: narrator
          text: >-
            He had not gone far when he heard footsteps behind him. Then a voice called through the darkness.
        - id: ch03-b07
          speaker: old_woman
          text: >-
            Stop! Stop!
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: >-
            He pretended not to hear. Instead, he ran even faster. But the pursuing footsteps came closer and closer. Soon he recognized the old woman's voice, growing louder as she gained on him.
        - id: ch03-b09
          speaker: old_woman
          text: >-
            Stop, you wicked man! Why did you look inside the room I forbade you to enter?
          emotion: angry
    - id: ch04
      title: The Chase Through the Night
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The priest forgot how weary he had been. His feet flew over the ground faster than ever. Fear gave him new strength, for he knew that if the goblin caught him, he would soon become one of her victims. He put all his heart into a prayer to Buddha.
        - id: ch04-b02
          speaker: priest
          text: >-
            Namu Amida Butsu, Namu Amida Butsu.
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: >-
            The dreadful old hag raced after him. Her hair streamed in the wind, and rage changed her face into the face of the demon she truly was. She carried a great bloodstained knife in one hand, and still she shrieked at him.
        - id: ch04-b04
          speaker: old_woman
          text: >-
            Stop! Stop!
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: >-
            At last, the priest felt he could not run another step. Just then, dawn broke across the plain. As the darkness vanished, the goblin vanished with it. The priest was safe.
    - id: ch05
      title: Safe at Dawn
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Now the priest understood that he had met the Goblin of Adachigahara. He had often heard stories about her, but until that night, he had never believed they were true.
        - id: ch05-b02
          speaker: narrator
          text: >-
            He felt sure that his wonderful escape was due to the protection of Buddha, whose help he had begged for as he ran. He took out his rosary. As the sun rose, he bowed his head, said his prayers, and gave thanks with all his heart.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Then he set off for another part of the country, only too glad to leave the haunted plain behind him.
