cover_prompt: |-
  A wordless cover scene in rural Japan at the turn of the twentieth century shows an elderly peasant woman kneeling beside a clear river as an enormous ripe peach floats within her reach. She wears a plain indigo kimono with a tied white head cloth, while a bamboo laundry basket and folded garments rest on the grassy bank. Across the water, a warrior with two swords and a bow taller than himself crosses a wooden bridge, while a strong eight-year-old boy carrying a large ax walks at the forest edge with a bear, a deer, a monkey, and a hare, suggesting the many tales gathered in the book. The woman stretches both hands toward the peach, making its arrival the single focal action. Use a wide, gently elevated composition with willow branches, green rice fields, and blue hills receding into mist, leaving calm open sky across the top. Keep every figure original, historically grounded, child-friendly, and independent of film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
