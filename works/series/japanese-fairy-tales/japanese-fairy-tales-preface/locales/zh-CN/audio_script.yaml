audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着旧时序言的诚恳口吻
        timbre: 温暖清澈
        pace: 舒缓而有自然停顿
        pitch: 中音
  chapters:
    - id: ch01
      title: 缘起与致谢
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这部日本童话集，起初来自安德鲁·朗先生的一项建议。他托一位朋友把话转给了我。书里的故事，是从小波山人写成的现代版本译来的。
        - id: ch01-b02
          speaker: narrator
          text: 我的译文并不逐字照搬。不过，故事里的日本风貌，还有那些古朴而别致的日式说法，我都尽力忠实地留了下来。讲故事的时候，我首先想到的不是专门研究民间传说的学者，而是西方的年轻读者。
        - id: ch01-b03
          speaker: narrator
          text: 翻译过程中，安冈先生、冈本房小姐、家兄尾崎信守、高木善弘博士和山尾龟子小姐都帮过我，我在这里向他们致谢。
    - id: ch02
      title: 故事与插图的来处
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 书中有一篇，我把它题作《不愿死去的人》。它取自为永春水一百年前写的一本小书，原名《长生不老》。
        - id: ch02-b02
          speaker: narrator
          text: 另一篇《竹取翁与月宫女》，取自古典名著《竹取物语》。日本人并不把它列入童话，可它其实正属于这一类文学。
        - id: ch02-b03
          speaker: narrator
          text: 书里的插图，是东京画家藤山觉三先生画的。
    - id: ch03
      title: 写给西方的孩子们
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我用英文讲这些故事时，也照自己的心意添过一点地方色彩和景物描写。有时是故事仿佛需要，有时只是因为我喜欢。还有一两处，我从另一个版本里取来一段情节，放进了故事。
        - id: ch03-b02
          speaker: narrator
          text: 这些年来，我把日本美丽的传说和童话讲给朋友们听。无论老少，无论英国人还是美国人，大家总是听得兴致盎然。我也渐渐发现，原来绝大多数人根本没听过这些故事。正是这一点鼓励了我，让我把它们写下来，送给西方的孩子们。
        - id: ch03-b03
          speaker: narrator
          text: 尾崎英子。东京，一九〇八年。
        - id: ch03-b04
          speaker: narrator
          text: 《日本童话》。
