audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, thoughtful, and direct
        timbre: clear and gentle
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: How This Collection Began
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            This collection of Japanese fairy tales began with a suggestion from Mr. Andrew Lang, which reached me through a friend. The tales were translated from the modern version written by Sadanami Sanjin.
        - id: ch01-b02
          speaker: narrator
          text: >-
            They are not word-for-word translations. I have faithfully kept the Japanese stories and their quaint Japanese expressions, but I have told them to interest young Western readers rather than students making a technical study of folklore.
    - id: ch02
      title: With Thanks
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            I owe grateful thanks to Mr. Y. Yasuoka, Miss Fusa Okamoto, my brother Nobumori Ozaki, Dr. Yoshihiro Takaki, and Miss Kameko Yamao. Each of them helped me with the translations.
    - id: ch03
      title: Where Two Stories Came From
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            I called one tale “The Story of the Man who did not Wish to Die.” It comes from a little book written a hundred years ago by Shinsui Tamenaga. The book is called Chosei Furo, which means “Longevity.”
        - id: ch03-b02
          speaker: narrator
          text: >-
            “The Bamboo-cutter and the Moon-child” comes from the classic “Taketari Monogatari.” The Japanese do not place it among their fairy tales, though it truly belongs to that kind of literature.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The pictures were drawn by Mr. Kakuzo Fujiyama, an artist from Tokio.
    - id: ch04
      title: Why I Told the Tales
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            As I told these stories in English, I followed my own fancy. I added touches of local color or description when the tales seemed to need them, or simply when they pleased me. Once or twice, I also brought in an incident from another version.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Whenever I shared Japan’s beautiful legends and fairy tales with my friends, I found eager listeners. Young and old, English and American, they all wanted to hear them. Yet most people still did not know these tales. That encouraged me to write them for the children of the West.
        - id: ch04-b03
          speaker: narrator
          text: |-
            Y. T. O.
            Tokio, 1908.
        - id: ch04-b04
          speaker: narrator
          text: Japanese Fairy Tales.
