audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    good_old_man:
      display_name: 善良的老人
      tts:
        delivery: 温厚谦逊，悲伤时克制，得到奇遇时真诚欢喜
        timbre: 苍老柔和的男声
        pace: 舒缓
        pitch: 中低音
    wicked_old_man:
      display_name: 恶邻居
      tts:
        delivery: 贪婪粗暴，得意时傲慢，受挫时暴躁
        timbre: 粗哑阴沉的老年男声
        pace: 稍快
        pitch: 低音
    knight:
      display_name: 武士
      tts:
        delivery: 恭谨郑重，言语干脆有礼
        timbre: 清晰沉稳的成年男声
        pace: 平稳
        pitch: 中音
    daimyo:
      display_name: 大名
      tts:
        delivery: 威严直接，欢喜时爽朗，受骗时严厉
        timbre: 洪亮厚重的成年男声
        pace: 从容
        pitch: 低音
  chapters:
    - id: ch01
      title: 小白找到的财宝
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，有一位老人和妻子相依为命。他们靠耕种一小块田地过活，日子一直过得安宁快乐，只有一桩莫大的遗憾，就是没有儿女。家里唯一的宠物是一条白狗，名叫小白。老两口把晚年的一腔疼爱全给了它。每逢有一点好吃的，他们宁愿自己舍不得动，也要留给小白。它一身白毛，是条地道的日本犬，模样很像一只小狼。
        - id: ch01-b02
          speaker: narrator
          text: 每天傍晚，是老人和小白最快活的时候。老人从田里干完活回来，吃过米饭和蔬菜的简朴晚餐，总把省下的一点饭食拿到环绕小屋的窄廊上。小白果然早已等在那里，盼着主人，也盼着晚上的美味。
        - id: ch01-b03
          speaker: good_old_man
          text: 来，来！小白，坐好。
        - id: ch01-b04
          speaker: narrator
          text: 小白便抬起前腿坐好，向主人讨食，老人就把食物喂给它。可隔壁住着另一对老夫妻，又凶恶又残忍。他们恨透了善良的邻居，也恨小白。小白偶尔往他们厨房望一眼，他们就踢它，拿东西砸它，有时甚至把它打伤。
        - id: ch01-b05
          speaker: narrator
          text: 一天，小白在屋后的田里叫了很久。老人以为鸟儿来糟蹋庄稼，急忙跑出去。小白摇着尾巴迎上来，咬住他的和服下摆，把他拖到一棵高大的朴树下。它两只前爪拼命刨土，还欢喜地叫个不停。老人站在一旁，怎么也看不明白。
        - id: ch01-b06
          speaker: narrator
          text: 小白仍旧拼命地叫，拼命地刨。过了一会儿，老人心里一动。树下也许藏着什么，叫小白闻见了。他跑回家取来铁锹，在小白刨过的地方挖起来。没想到，挖了一阵以后，土里竟露出一大堆古老而贵重的钱币。他越挖越深，找到的金币也越来越多。老人只顾着手里的活，完全没看见恶邻居正阴沉着脸，从竹篱笆后面窥探。
        - id: ch01-b07
          speaker: narrator
          text: 最后，所有金币都在地上闪闪发亮。小白挺起身子，神气地坐在旁边，亲昵地望着主人。那模样就像在说：“你瞧，我虽然只是一条狗，也能报答你待我的一片好心。”
        - id: ch01-b08
          speaker: narrator
          text: 老人赶忙跑进屋，叫来妻子，两个人一起把财宝搬回家。贫穷的老两口一天之内富了起来。他们对忠心的小白感激不尽，也比从前更加疼爱它。恶邻居却是听见小白叫，才躲在暗处看完了财宝出土的一切。他妒忌得不得了，也想发一笔横财。几天后，他装得十分客气，登门请求把小白借去一会儿。
        - id: ch01-b09
          speaker: narrator
          text: 老人觉得这个要求十分奇怪。他明明知道，邻居不但不喜欢自己的爱犬，而且只要小白从他面前经过，他就绝不会放过殴打和折磨它的机会。可老人心地太善良，不忍开口拒绝，最后还是答应借出小白，只叮嘱邻居一定要好好照料。
    - id: ch02
      title: 小白留下的木臼
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 恶邻居带着不怀好意的笑回了家，还向妻子夸耀自己的诡计已经得逞。他拿上铁锹，硬逼百般不情愿的小白跟到田里。走到一棵朴树下，他恶狠狠地威胁起来。
        - id: ch02-b02
          speaker: wicked_old_man
          text: 你主人家的树下有金币，我家的树下也一定有！快给我找出来。在哪里？金币到底在哪里？
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: 他揪住小白的脖子，把它的头死死按向地面。小白为了挣脱，只好用爪子又抓又刨。恶老人一看，还以为它又闻见了金币，顿时喜不自胜。他推开小白，自己挖了起来。可土里没有金币。挖得越深，恶臭越重，最后只露出一堆垃圾。
        - id: ch02-b04
          speaker: narrator
          text: 恶老人厌恶极了，很快又发起怒来。他亲眼看见邻居交了好运，也盼着自己得到同样的福气，这才把小白借来。如今，他以为想找的东西就要出现了，辛苦一上午，换来的却只有臭烘烘的垃圾。他不肯怪自己的贪心让自己失望，反倒迁怒于可怜的小白。他抓起铁锹，用尽力气打下去，当场杀死了它。随后，他把小白的尸体扔进那个本来用来找金币的坑里，盖好泥土，独自回家，连妻子也没告诉。
        - id: ch02-b05
          speaker: narrator
          text: 小白几天没回来，主人等得越来越焦急。日子一天天过去，他始终等不到自己的狗，终于去找邻居，请他把小白还来。恶邻居毫无羞愧，也没有半点迟疑，张口就说，小白不听话，已经被他杀死了。老人听见这可怕的噩耗，流下许多悲苦的泪。这件事来得太突然，他痛不欲生。可他生性温和，竟连一句责备也没有。得知小白埋在田里的朴树下，他只请求邻居把那棵树送给自己，好留作纪念。
        - id: ch02-b06
          speaker: narrator
          text: 这样的请求，恶邻居也不好拒绝。老人便砍下那棵树，搬回家，用树干做成一只臼。他让妻子把米放进去，自己举起杵来舂，想做些年糕祭奠小白。
        - id: ch02-b07
          speaker: narrator
          text: 怪事发生了。妻子才把米倒进去，老人刚举杵开始舂，臼里的米就一点点多起来，最后竟有原来的五倍。一块块年糕自己从臼里冒出来，仿佛有一双看不见的手在帮忙。老夫妻看见这一幕，立刻明白，这是小白在报答他们长久的疼爱。他们尝了年糕，只觉得比世上任何食物都香甜。从此，那只臼不断送出年糕，足够他们生活，再也不用为吃食发愁。
        - id: ch02-b08
          speaker: narrator
          text: 贪婪的邻居听说老人又交了好运，和上次一样妒火中烧。他登门借那只神奇的臼，还假装自己也为小白的死伤心，想做年糕祭奠它。老人一点也不愿把臼借给这个残忍的人，可他实在太过善良，还是狠不下心拒绝。恶邻居把臼搬回家，从此再没送回来。
        - id: ch02-b09
          speaker: narrator
          text: 几天过去，老人始终等不到那只臼，只好上门讨还。他客客气气地问邻居是不是已经用完，若是用完了，能不能把臼还给他。可他看见邻居坐在一堆大火旁，火里烧着木块，地上散落的东西很像破臼的碎片。他刚问起，恶邻居就傲慢地答了话。
        - id: ch02-b10
          speaker: wicked_old_man
          text: 你来讨臼吗？我早把它砸烂，当柴烧了。我拿它舂年糕，出来的全是臭东西！
          emotion: disgusted
        - id: ch02-b11
          speaker: good_old_man
          text: 那真遗憾。你想吃年糕，为什么不来向我要呢？无论要多少，我都会给你。现在，请把烧臼留下的灰给我吧。我想留着它们纪念小白。
        - id: ch02-b12
          speaker: narrator
          text: 邻居立刻答应了。老人装了满满一篮灰，带回家中。
    - id: ch03
      title: 灰烬让枯树开花
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 不久，老人无意间把一点烧臼留下的灰撒在花园的树上。不可思议的事又发生了。那时已到深秋，所有树木都落光了叶子，可灰刚沾上枝头，樱树、梅树，还有其他开花的灌木，竟一齐绽放。整座花园转眼变成一幅明媚的春景。老人欢喜得无以复加，赶紧小心收好了余下的灰烬。
        - id: ch03-b02
          speaker: narrator
          text: 这座花园的奇景很快传遍四方，远近的人都赶来观看。没过多久，一天有人来敲门。老人走到门廊，惊讶地发现门外站着一位武士。武士说，自己是一位大名的家臣。大名园里有一株心爱的樱树枯死了，侍从们用遍各种办法，也没能救活。眼看大名因为失去心爱的樱树而万分不快，武士也急得不知如何是好。幸而就在这时，他们听说，有位神奇的老人能叫枯树开花，主君便派他前来邀请。
        - id: ch03-b03
          speaker: knight
          text: 若您能立刻随我动身，我将感激不尽。
        - id: ch03-b04
          speaker: narrator
          text: 老人十分惊讶，仍恭敬地跟随武士来到大名的宫邸。大名早已焦急地等候，一见老人就立刻问他。
        - id: ch03-b05
          speaker: daimyo
          text: 你就是那位能叫枯树在不合时令的时候也开花的老人吗？
        - id: ch03-b06
          speaker: narrator
          text: 老人俯身行了一礼。
        - id: ch03-b07
          speaker: good_old_man
          text: 正是小人。
        - id: ch03-b08
          speaker: daimyo
          text: 那就用你闻名的灰烬，让园中那棵枯死的樱树重新开花。我要亲眼看着。
        - id: ch03-b09
          speaker: narrator
          text: 大名、家臣们，还有捧着大名佩刀的侍女，全都一起走进花园。老人撩起和服下摆，准备爬树。他抱起随身带来的灰罐，先向众人告罪。所有人都满怀兴致，等着看他怎样施展本领。
        - id: ch03-b10
          speaker: good_old_man
          text: 失礼了。
        - id: ch03-b11
          speaker: narrator
          text: 众人兴致勃勃地看着老人爬上树。他一直爬到树干分出两根粗枝的地方，稳稳坐下，再将灰烬向左右撒去，让它落遍大大小小的枝条。
        - id: ch03-b12
          speaker: narrator
          text: 奇迹就在眼前发生了。那棵枯树顷刻间开满鲜花。大名欣喜若狂，看起来几乎要发疯了。他站起身，展开折扇，招呼老人下来，又亲手递给他一杯盛得满满的上等清酒，还赏了许多金银和别的珍宝。大名命老人从此自称花咲爷，也就是让树木开花的老人，并下令所有人以后都用这个名号称呼他。老人就这样载着满身荣光回了家。
    - id: ch04
      title: 冒牌花咲爷
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 恶邻居照旧听说了善良老人的好运，也知道大名怎样赏赐了他。恶邻居心里的妒忌再也压不住。他想到，自己找金币失败了，做神奇年糕也失败了。可这一次，只须照着老人那样，把灰撒到树上，就能叫枯树开花。这该是所有事情中最容易的一件，他一定能成功。
        - id: ch04-b02
          speaker: narrator
          text: 他立刻动手，把烧掉那只神奇木臼后留在炉中的灰全搜集起来，带着它们出了门，满心盼着能找一位贵人雇用自己。他一路走，一路高声叫喊。
        - id: ch04-b03
          speaker: wicked_old_man
          text: 神奇老人来啦，能叫枯树开花！能叫死树开花的老人来啦！
        - id: ch04-b04
          speaker: narrator
          text: 宫邸里的大名听见了叫声。
        - id: ch04-b05
          speaker: daimyo
          text: 想必是花咲爷经过这里。我今天正好无事，就让他再显一次本领，给我瞧个热闹。
        - id: ch04-b06
          speaker: narrator
          text: 家臣们走出去，把这个冒牌货带到主君面前。假老人如愿见到大名，心里得意极了。可大名仔细打量着他，觉得十分奇怪，这人和上次见到的老人一点也不像。
        - id: ch04-b07
          speaker: daimyo
          text: 你就是我赐名为花咲爷的那个人吗？
        - id: ch04-b08
          speaker: wicked_old_man
          text: 是的，主君！
        - id: ch04-b09
          speaker: daimyo
          text: 这可怪了。我原以为世上只有一位花咲爷。难道他如今也收徒弟了吗？
          emotion: surprised
        - id: ch04-b10
          speaker: wicked_old_man
          text: 我才是真正的花咲爷。上次来见您的那个人，不过是我的徒弟！
        - id: ch04-b11
          speaker: daimyo
          text: 那么，你的本领一定比他更高。施展出来，让我看看！
        - id: ch04-b12
          speaker: narrator
          text: 恶邻居走进花园，大名和整个随从队伍全都跟在后面。他来到一棵枯树前，从随身带来的灰中抓出一把，撒到树上。可树上不但没有开花，连一枚嫩芽也没冒出来。他以为是灰撒得不够，又一把接一把地往枯枝上洒，仍旧毫无效果。
        - id: ch04-b13
          speaker: narrator
          text: 他接连试了几次，始终没有一点用处。偏偏一阵风忽然吹来，把灰全吹进大名眼里。大名勃然大怒，立刻命令家臣逮捕这个冒牌花咲爷，以骗子的罪名把他关进牢狱。恶老人从此再也没能获释，终于为自己做过的一切恶事受到了惩罚。
    - id: ch05
      title: 善良老人的晚年
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 善良的老人却凭着小白为他找到的那一大笔金币，再加上大名后来赏赐的许多金银，晚年一直过得富足而兴旺。他一生长寿又幸福，始终受到所有人的爱戴和敬重。
