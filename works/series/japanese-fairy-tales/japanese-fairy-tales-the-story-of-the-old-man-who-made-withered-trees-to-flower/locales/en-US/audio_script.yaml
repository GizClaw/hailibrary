  chapters:
    - id: ch01
      title: Shiro Finds a Treasure
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago, an old man and his wife lived on what they could grow in a small plot of land. Their life was peaceful and happy, except for one great sorrow. They had no child. Their only pet was a dog named Shiro, and they gave him all the love of their old age. Whenever they had something especially good to eat, they went without it and gave it to him. His name meant “white,” for that was his color. He was a true Japanese dog and looked much like a small wolf.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The happiest time of day for both the old man and his dog came when the day's work was over. The old man returned from the fields and ate his simple supper of rice and vegetables. Then he carried the food he had saved out to the little veranda that ran around the cottage. Shiro was always there, waiting for his master and his evening treat.
        - id: ch01-b03
          speaker: old_man
          text: >-
            Chin, chin!
        - id: ch01-b04
          speaker: narrator
          text: >-
            Shiro sat up and begged, and the old man gave him the food. Next door lived another old man and his wife. They were cruel and wicked, and they hated their good neighbors and Shiro. If the dog so much as looked into their kitchen, they kicked him or threw things at him. Sometimes they even hurt him.
        - id: ch01-b05
          speaker: narrator
          text: >-
            One day, Shiro barked for a long time in the field behind his master's house. The old man heard him and thought birds might be attacking the corn, so he hurried outside to see what was wrong. The moment Shiro saw him, the dog ran to meet him, wagging his tail. Then he caught the end of the man's kimono in his teeth and pulled him beneath a large yenoki tree. There he dug furiously with his paws and yelped for joy the whole time.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The old man watched in confusion, but Shiro kept barking and digging with all his strength. At last, the old man wondered if something was hidden under the tree and the dog had smelled it. He ran home for his spade and began digging in that very place.
        - id: ch01-b07
          speaker: narrator
          text: >-
            After he had dug for some time, his spade uncovered a heap of old and precious coins. The sight astonished him. He dug deeper, and still more gold appeared. He became so intent on his work that he never noticed his neighbor's scowling face peering through the bamboo hedge. At last, every coin lay shining on the ground. Shiro sat straight and proud beside them, gazing lovingly at his master. It was as if he were saying, “You have always been kind to me. Though I am only a dog, now I can give you something in return.”
        - id: ch01-b08
          speaker: narrator
          text: >-
            The old man ran to call his wife, and together they carried the treasure home. In a single day, the poor old man had become rich. He could not thank faithful Shiro enough, and from then on he loved and petted him more than ever.
    - id: ch02
      title: The Greedy Neighbor
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Shiro's barking had drawn the cross old neighbor to the hedge, and he had watched the treasure being found. Envy filled him. He wanted a fortune of his own. A few days later, he called at the old man's house and politely asked to borrow Shiro for a little while.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Shiro's master found the request very strange. He knew this neighbor did not love the dog and never missed a chance to strike or torment him. Still, the good old man was too kindhearted to say no. He agreed, but only on the condition that Shiro be treated with great care.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The wicked neighbor went home with an evil smile and told his wife that his trick had worked. Then he took his spade and hurried to his field, forcing the unwilling Shiro to follow. When they reached a yenoki tree, he threatened the dog.
        - id: ch02-b04
          speaker: neighbor
          text: >-
            There was gold under your master's tree, so there must be gold under mine. Find it for me! Where is it? Where? Where?
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: >-
            He seized Shiro by the neck and held the dog's head against the ground. Shiro scratched and dug only because he was trying to escape that horrible grip. But the neighbor was delighted. He imagined the dog had smelled buried gold, just as before. He pushed Shiro aside and dug for himself.
        - id: ch02-b06
          speaker: narrator
          text: >-
            He dug and dug, but there was no treasure. Before long, a foul smell rose from the earth. He kept going until his spade uncovered nothing but a heap of refuse. You can imagine his disgust. He had watched his neighbor find a fortune, and he had borrowed Shiro expecting the same luck. Just when he thought he was about to reach the gold, a whole morning of labor had brought him only this dreadful-smelling rubbish. His disgust quickly turned to fury.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Instead of blaming his own greed, he blamed poor Shiro. He lifted the spade and struck the dog with all his strength, killing him there. Then he threw Shiro into the hole meant for treasure and covered his body with earth. He went home without telling anyone, not even his wife.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Several days passed, and Shiro did not return. His master began to grow anxious. Day after day, the good old man watched and waited, but always in vain. At last, he went next door and asked the neighbor to give back his dog. The wicked man felt no shame. Without a moment's hesitation, he said he had killed Shiro because the dog had behaved badly.
        - id: ch02-b09
          speaker: narrator
          text: >-
            At that dreadful news, Shiro's master wept many bitter tears. His grief and shock were deep, yet he was too gentle to reproach his cruel neighbor. When he learned that Shiro lay beneath the yenoki tree, he made one request.
        - id: ch02-b10
          speaker: old_man
          text: >-
            Please give me the tree that stands over poor Shiro. I want it to remember him by.
          emotion: sad
        - id: ch02-b11
          speaker: narrator
          text: >-
            Even the cross neighbor could not refuse so simple a request. He gave the tree to Shiro's master. The old man cut it down, carried it home, and carved its trunk into a mortar. His wife put rice into it, and he began to pound the rice for a festival in Shiro's memory.
    - id: ch03
      title: The Wonderful Mortar
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Then something strange happened. The old man's wife had put an ordinary amount of rice into the mortar. But the moment he began pounding it to make cakes, the rice slowly increased. It grew and grew until there was nearly five times as much as before. Finished cakes came tumbling from the mortar as though an invisible hand inside it were doing the work.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The old couple understood that Shiro was rewarding them for their faithful love. The cakes tasted better than any food they had ever eaten. From that day on, they never worried about food, because the mortar never stopped supplying them with cakes.
        - id: ch03-b03
          speaker: narrator
          text: >-
            When the greedy neighbor heard about this new piece of good fortune, envy filled him again. He called on the old man and asked to borrow the wonderful mortar for a short while. He pretended that he also mourned Shiro and wished to make cakes for a festival in the dog's memory. Shiro's master did not want to lend such a precious thing to the man who had killed his dog. But once again, he was too kind to refuse. The neighbor carried the mortar away, and the promised short time passed, but he never brought it back.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Several days passed, and Shiro's master waited in vain for the mortar to come back. At last, he went to the borrower's house and politely asked him to return it if he had finished using it. Instead, he found the neighbor sitting beside a large fire made from pieces of wood. On the ground nearby lay what looked very much like the broken remains of the mortar.
        - id: ch03-b05
          speaker: neighbor
          text: >-
            So you've come for your mortar? I smashed it, and now I'm burning the wood. When I tried to make cakes, nothing came out but some foul-smelling filth.
        - id: ch03-b06
          speaker: old_man
          text: >-
            I am sorry. If you wanted cakes, you should have asked me. I would have given you all you wished for. Please let me have the mortar's ashes. I would like to keep them in memory of Shiro.
          emotion: sad
        - id: ch03-b07
          speaker: narrator
          text: >-
            The neighbor agreed at once. The old man gathered the ashes into a basket and carried them carefully home.
    - id: ch04
      title: Blossoms in Autumn
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Not long afterward, the old man accidentally scattered some of those ashes over the trees in his garden. Another wonder followed. It was late autumn, and every tree had already shed its leaves. The branches stood bare. Yet as soon as the ashes touched them, the cherry trees, plum trees, and every other flowering shrub burst into bloom. In a moment, the old man's autumn garden was transformed into a beautiful picture of spring.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The old man was overjoyed, and he carefully saved the ashes that remained. Word of his garden traveled far and wide. People came from near and far to see the marvelous sight.
        - id: ch04-b03
          speaker: narrator
          text: >-
            One day soon afterward, someone knocked at the old man's door. He went to the porch and was surprised to find a knight waiting there. The knight explained that he served a great Daimio. One of the nobleman's favorite cherry trees had withered. Everyone in his service had tried every method they knew to bring it back to life, but nothing had worked. The Daimio was deeply displeased by the loss of his beloved tree. The knight had been at a loss until news reached the palace about an old man with a wonderful power.
        - id: ch04-b04
          speaker: knight
          text: >-
            Fortunately, we heard of a wonderful old man who can make withered trees bloom. My lord has sent me to ask for your help. I would be very grateful if you came at once.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The good old man was astonished, but he respectfully followed the knight to the nobleman's palace.
    - id: ch05
      title: The Daimio's Cherry Tree
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The Daimio had been waiting impatiently. As soon as the old man appeared, he questioned him.
        - id: ch05-b02
          speaker: daimio
          text: >-
            Are you the old man who can make withered trees flower, even when they are out of season?
        - id: ch05-b03
          speaker: narrator
          text: >-
            The old man bowed low.
        - id: ch05-b04
          speaker: old_man
          text: >-
            Yes, my lord. I am that old man.
        - id: ch05-b05
          speaker: daimio
          text: >-
            Then use your famous ashes to make the dead cherry tree in my garden bloom again. I will watch you do it.
        - id: ch05-b06
          speaker: narrator
          text: >-
            They all went into the garden together. The Daimio came with his retainers and the ladies-in-waiting who carried his sword. Everyone gathered around the dead cherry tree. The old man tucked up his kimono so that it would not hinder him, took the pot of ashes he had brought, and prepared to climb.
        - id: ch05-b07
          speaker: old_man
          text: >-
            Please excuse me.
        - id: ch05-b08
          speaker: narrator
          text: >-
            Carrying his pot of ashes, he climbed while everyone watched with great interest. He reached the place where the trunk divided into two great branches and settled himself there. Then he scattered ashes to the right and left, across every branch and twig.
        - id: ch05-b09
          speaker: narrator
          text: >-
            The result was wonderful. The withered tree burst into full bloom at once. The Daimio was so carried away with joy that he looked almost beside himself. He sprang to his feet, opened his fan, and called the old man down from the branches. Then the Daimio himself filled a cup with the finest sake and presented it to him. He also rewarded the old man with a great deal of silver and gold, along with many other precious gifts.
        - id: ch05-b10
          speaker: daimio
          text: >-
            From this day forward, you shall be called Hana-Saka-Jijii, the Old Man Who Makes the Trees Blossom. Everyone shall know you by that name.
        - id: ch05-b11
          speaker: narrator
          text: >-
            And so the Daimio sent Hana-Saka-Jijii home with great honor.
    - id: ch06
      title: The False Hana-Saka-Jijii
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            As before, the wicked neighbor heard everything that had happened to the good old man. He learned of the blooming tree, the gifts, and the honor given at the palace. He could not suppress the envy and jealousy in his heart. He remembered how he had failed when he searched for gold, and then failed again when he tried to make magic cakes. Surely he could succeed this time. All the other man had done was sprinkle ashes over a withered tree. Of all the tricks he had copied, this one seemed the simplest.
        - id: ch06-b02
          speaker: narrator
          text: >-
            He gathered every ash that remained in the fireplace after the wonderful mortar had burned. Then he set off, hoping some great lord would hire him. As he walked, he shouted for all to hear.
        - id: ch06-b03
          speaker: neighbor
          text: >-
            Here comes the wonderful man who makes withered trees blossom! Here comes the old man who makes dead trees bloom!
          emotion: happy
        - id: ch06-b04
          speaker: narrator
          text: >-
            The Daimio heard the cry inside his palace.
        - id: ch06-b05
          speaker: daimio
          text: >-
            That must be Hana-Saka-Jijii passing by. I have nothing to do today, so bring him here. It will amuse me to watch his art again.
        - id: ch06-b06
          speaker: narrator
          text: >-
            The retainers brought the impostor before their lord, and the false old man could hardly contain his satisfaction. But the Daimio looked closely at him. This man did not resemble the visitor he remembered.
        - id: ch06-b07
          speaker: daimio
          text: >-
            Are you the man I named Hana-Saka-Jijii?
        - id: ch06-b08
          speaker: neighbor
          text: >-
            Yes, my lord.
        - id: ch06-b09
          speaker: daimio
          text: >-
            How strange. I thought there was only one Hana-Saka-Jijii in the world. Does he have disciples now?
        - id: ch06-b10
          speaker: neighbor
          text: >-
            I am the true Hana-Saka-Jijii. The man who came before me was only my pupil.
        - id: ch06-b11
          speaker: daimio
          text: >-
            Then you must be even more skillful. Show me what you can do.
    - id: ch07
      title: The Neighbor's Punishment
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            With the Daimio and his whole court following, the envious neighbor entered the garden. He walked confidently toward a dead tree, pulled out a handful of the ashes he had brought, and scattered them over its branches. Everyone waited to see the wonder. But the tree did not burst into flower. Not a single bud appeared.
        - id: ch07-b02
          speaker: narrator
          text: >-
            The false old man decided he had not used enough. He took out several more handfuls and sprinkled them over the withered tree. Still nothing happened. He tried the same thing again and again, scattering more ashes each time. At last, instead of bringing out blossoms, the ashes blew straight into the Daimio's eyes.
        - id: ch07-b03
          speaker: narrator
          text: >-
            The Daimio was furious. He ordered his retainers to seize the false Hana-Saka-Jijii at once and throw the impostor into prison. The wicked old man was never released. At last, he had been punished for all his evil deeds.
        - id: ch07-b04
          speaker: narrator
          text: >-
            The good old man lived a very different life. He still had the treasure of gold coins that faithful Shiro had found beneath the yenoki tree. Now he also had all the silver, gold, and precious gifts the delighted Daimio had showered upon him. He became rich and prosperous in his old age. For many years, he lived a long and happy life, loved and respected by everyone who knew him.
