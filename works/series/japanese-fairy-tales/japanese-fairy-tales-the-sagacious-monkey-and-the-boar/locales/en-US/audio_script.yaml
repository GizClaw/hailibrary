  chapters:
    - id: ch01
      title: The Master's Decision
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago, in the Japanese province of Shinshin, there lived a traveling monkey-man. He made his living by taking a monkey from place to place and showing people its tricks.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One evening, the man came home in a terrible temper. He told his wife to send for the butcher the next morning.
        - id: ch01-b03
          speaker: wife
          text: >-
            Why do you want me to call the butcher?
          emotion: surprised
        - id: ch01-b04
          speaker: monkey_man
          text: >-
            There's no point taking that monkey around anymore. He's too old, and he forgets his tricks. I've beaten him as hard as I can, but he still won't dance properly. I'll sell him to the butcher and get whatever money I can. There's nothing else to do.
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: >-
            His wife felt deeply sorry for the poor little animal. She begged her husband to spare him, but the man would not listen. He was determined to make the sale.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The monkey was in the next room. He heard every word and understood that he was going to be killed.
        - id: ch01-b07
          speaker: monkey
          text: >-
            What a cruel master! I've served him faithfully for years. Instead of letting me grow old in comfort and peace, he'll have the butcher cut me up, then have me roasted, stewed, and eaten. Oh, what can I do?
          emotion: fearful
        - id: ch01-b08
          speaker: monkey
          text: >-
            Wait! I have an idea. A wild boar lives in the nearby forest, and I've often heard how wise he is. Perhaps he'll advise me if I tell him about this terrible danger. I'll go and ask him.
    - id: ch02
      title: The Boar's Plan
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            There was no time to waste. The monkey slipped out of the house and ran as fast as he could to the forest. He found the boar at home and began his sad story at once.
        - id: ch02-b02
          speaker: monkey
          text: >-
            Good Mr. Boar, I've heard how wonderfully wise you are. I'm in dreadful trouble, and only you can help me. I've grown old serving my master. Now that I can't dance properly, he means to sell me to the butcher. You're so clever. What should I do?
          emotion: fearful
        - id: ch02-b03
          speaker: narrator
          text: >-
            The monkey's praise pleased the boar. He was determined to help his visitor out of danger, but first he needed a plan. He thought quietly for a little while, and then he spoke.
        - id: ch02-b04
          speaker: boar
          text: >-
            Your master has a baby, doesn't he?
        - id: ch02-b05
          speaker: monkey
          text: >-
            Oh, yes. He has one little son.
        - id: ch02-b06
          speaker: boar
          text: >-
            In the morning, doesn't the baby lie near the door while your mistress starts her work? I'll come early. When I get the chance, I'll seize the child and run away with him.
        - id: ch02-b07
          speaker: monkey
          text: >-
            And then what happens?
        - id: ch02-b08
          speaker: boar
          text: >-
            The mother will be terrified. Before she and your master know what to do, chase after me. Rescue the child and carry him safely home. Then, when the butcher arrives, they won't have the heart to sell you.
        - id: ch02-b09
          speaker: narrator
          text: >-
            The monkey thanked the boar again and again, then returned home. He hardly slept that night. His life depended on whether the plan worked.
    - id: ch03
      title: The Rescue
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The monkey was the first one awake. He waited anxiously for the morning's events to begin. Every moment felt long, because his life rested on the plan. At last, his master's wife began moving around and opened the shutters to let in the daylight.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Then everything happened just as the boar had planned. As usual, the mother laid her child near the porch while she tidied the house and prepared breakfast.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The baby crooned happily in the morning sunlight and patted the mats where light and shadow played. Suddenly, a noise came from the porch, followed by a loud cry from the child.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The mother rushed from the kitchen. She arrived just in time to see the boar vanish through the gate with her child in his grasp. With a despairing cry, she threw out her hands and ran into the inner room. Her husband was still fast asleep.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The man slowly sat up and rubbed his eyes. Crossly, he demanded to know why his wife was making such a noise. It took him a moment to become fully awake and understand what had happened. By the time they both reached the gate, the boar was far away.
        - id: ch03-b06
          speaker: narrator
          text: >-
            But they could see the monkey racing after the thief as fast as his legs could carry him. The man and his wife marveled at the brave and clever monkey. When the faithful animal brought their child safely back into their arms, their gratitude had no bounds.
    - id: ch04
      title: A Peaceful Old Age
      blocks:
        - id: ch04-b01
          speaker: wife
          text: >-
            There! This is the animal you wanted to kill. Without our monkey, we would have lost our child forever.
        - id: ch04-b02
          speaker: monkey_man
          text: >-
            For once, wife, you're right. Send the butcher away when he comes. Now give us all a good breakfast, and give the monkey one too.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The man carried the child into the house. When the butcher arrived, they sent him away with an order to bring boar's meat for their evening meal.
        - id: ch04-b04
          speaker: narrator
          text: >-
            From then on, the monkey was cherished. He lived the rest of his days in peace, and his master never struck him again.
