audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    monkey_man:
      display_name: 耍猴人
      tts:
        delivery: 粗暴急躁，醒悟后直率而简短
        timbre: 粗粝厚重的成年男声
        pace: 稍快
        pitch: 中低音
    wife:
      display_name: 妻子
      tts:
        delivery: 心地柔软，遇险时慌乱，劝说时坚定
        timbre: 温和清亮的成年女声
        pace: 平稳，惊慌时加快
        pitch: 中高音
    monkey:
      display_name: 猴子
      tts:
        delivery: 机敏伶俐，遇到危难时忧急而善于应变
        timbre: 灵活清脆的声音
        pace: 稍快
        pitch: 中高音
    boar:
      display_name: 野猪
      tts:
        delivery: 沉着自信，出主意时干脆利落
        timbre: 浑厚朴实的声音
        pace: 从容
        pitch: 低音
  chapters:
    - id: ch01
      title: 屠夫明早就来
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，日本的新信国住着一个耍猴人。他带着一只猴子四处卖艺，让猴子表演各种把戏，自己就靠这个谋生。
        - id: ch01-b02
          speaker: narrator
          text: 一天傍晚，他怒气冲冲地回到家，吩咐妻子明天一早去请屠夫。妻子听不明白，便问他。
        - id: ch01-b03
          speaker: wife
          text: 你请屠夫来做什么？
        - id: ch01-b04
          speaker: monkey_man
          text: 那只猴子已经没用了。它老得连把戏都记不住，我拿棍子使劲打，它还是不肯好好跳舞。现在只能把它卖给屠夫，能换回多少钱就换多少钱。再没有别的办法了。
        - id: ch01-b05
          speaker: narrator
          text: 妻子心疼那只小猴，一再央求丈夫饶过它。可无论她怎么求，男人都不肯改变主意，非要把猴子卖给屠夫不可。
        - id: ch01-b06
          speaker: narrator
          text: 猴子当时就在隔壁。夫妻俩的每一句话，它都听得清清楚楚。它很快明白，自己就要被杀了。
        - id: ch01-b07
          speaker: monkey
          text: 主人实在太残忍了！我忠心服侍他这么多年，他不肯让我安稳地过完晚年，还要叫屠夫把我切成块，拿去烤，拿去炖，再让人吃掉。我该怎么办呢？对了，附近的森林里住着一头野猪，听说它非常聪明。也许我去告诉它自己的难处，它能替我想出办法。我要去试一试！
    - id: ch02
      title: 野猪的计策
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 猴子一刻也不敢耽搁。它偷偷溜出屋子，用最快的速度跑进森林，去找那头野猪。野猪正好在家，猴子一见面，就把自己的遭遇说了出来。
        - id: ch02-b02
          speaker: monkey
          text: 好心的野猪先生，我一直听说您智慧过人。现在我遇上大难，只有您救得了我。我替主人做事多年，如今年纪大了，不能好好跳舞，他就要把我卖给屠夫。您这么有智慧，请告诉我，我究竟该怎么办？
        - id: ch02-b03
          speaker: narrator
          text: 野猪听了这番夸奖，心里十分受用，便决心帮猴子脱险。它想了一会儿，问道。
        - id: ch02-b04
          speaker: boar
          text: 你的主人有个小娃娃，对不对？
        - id: ch02-b05
          speaker: monkey
          text: 对，他有一个还在襁褓里的儿子。
        - id: ch02-b06
          speaker: boar
          text: 每天早晨，你的女主人开始干活，不是会把孩子放在门边吗？明天我早早过去，看准机会就把孩子叼走。
        - id: ch02-b07
          speaker: monkey
          text: 接下来怎么办？
        - id: ch02-b08
          speaker: boar
          text: 孩子的母亲准会吓坏。趁你主人夫妻还没想出办法，你马上追上来，从我这里救下孩子，再平安送回他们手里。等屠夫到了，他们一定不忍心再卖你。
        - id: ch02-b09
          speaker: narrator
          text: 猴子谢了又谢，这才回家。那天夜里，它满脑子都是第二天的事，几乎没有合眼。自己的命能不能保住，就看野猪的计划能不能成功了。
        - id: ch02-b10
          speaker: narrator
          text: 第二天，猴子第一个起来，焦急地等着。它觉得时间过得慢极了。好不容易，主人的妻子终于起床，打开护窗，让晨光照进屋里。接着，一切都照野猪安排的那样发生了。母亲像平常一样，把孩子放在门廊旁边，自己去收拾屋子，准备早饭。
    - id: ch03
      title: 猴子救回孩子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 孩子坐在清晨的阳光里，快活地咿咿呀呀，还伸手拍着席子上跳动的光影。忽然，门廊传来一阵响声，孩子紧接着放声大哭。
        - id: ch03-b02
          speaker: narrator
          text: 母亲从厨房里冲出来。她只来得及看见野猪挟着孩子穿过大门，就快要跑得没影了。她绝望地大叫，伸出双手，又急忙奔进里屋。丈夫还在那里睡得正香。
        - id: ch03-b03
          speaker: narrator
          text: 男人慢吞吞地坐起来，揉了揉眼睛，没好气地问妻子到底在吵什么。等他终于弄清出了什么事，夫妻俩一起赶到门外，野猪早就跑远了。
        - id: ch03-b04
          speaker: narrator
          text: 不过，他们还看得见那只猴子。它正拼命追赶抢走孩子的野猪，两条腿有多快就跑多快。夫妻俩望着猴子这样勇敢，心里又惊讶又敬佩。
        - id: ch03-b05
          speaker: narrator
          text: 后来，忠心的猴子果然把孩子救了回来，平平安安送进父母怀中。这一下，夫妻俩对它的感激简直没有边了。
        - id: ch03-b06
          speaker: wife
          text: 你看看！这就是你想杀掉的猴子。要是没有它，我们的孩子就再也回不来了。
        - id: ch03-b07
          speaker: monkey_man
          text: 老婆，这一次你说得对。屠夫来了，就叫他回去。现在给大家做一顿丰盛的早饭，猴子也要吃一份。
    - id: ch04
      title: 安稳的余生
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 男人说着，把孩子抱回了屋里。等屠夫来到，他果真叫屠夫回去，只订了一些野猪肉，准备晚上吃。
        - id: ch04-b02
          speaker: narrator
          text: 从此以后，猴子备受疼爱，安安稳稳地过完了余生。它的主人再也没有打过它。
