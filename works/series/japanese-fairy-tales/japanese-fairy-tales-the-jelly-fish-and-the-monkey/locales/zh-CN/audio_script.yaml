audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    dragon_king:
      display_name: 龙王
      tts:
        delivery: 威严果断，关切王后时流露焦急，发怒时冷酷凌厉
        timbre: 洪亮厚重的成年男声
        pace: 从容，急切时稍快
        pitch: 低音
    fish_doctor:
      display_name: 鱼医
      tts:
        delivery: 谨慎恭敬，面对龙王时带着畏惧
        timbre: 清晰微颤的成年男声
        pace: 平稳
        pitch: 中音
    chief_steward:
      display_name: 总管
      tts:
        delivery: 老练精明，出主意时胸有成竹
        timbre: 干练沉稳的成年男声
        pace: 稍快
        pitch: 中低音
    jellyfish:
      display_name: 水母
      tts:
        delivery: 老实迟钝，犹疑时吞吐，得意时轻快，受挫时沮丧
        timbre: 柔和略显笨拙的成年男声
        pace: 中速
        pitch: 中高音
    monkey:
      display_name: 猴子
      tts:
        delivery: 机敏活泼，遇险时强作镇定，脱身后带着戏谑
        timbre: 明亮灵巧的成年男声
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 海底龙宫的婚礼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，古老日本的海底有一个王国，由龙神，也就是海中龙王统治。他法力无边，海里不论多大的鲸，还是多小的虾，全归他管。龙王还掌管着潮水涨落的两颗宝珠。退潮珠一入海，海水就从陆地边退开。涨潮珠一落水，浪头便像山一样高，像奔涌的怒潮那样扑上岸。
        - id: ch01-b02
          speaker: narrator
          text: 龙宫坐落在海底，美得连梦里也见不到。墙是珊瑚砌的，屋顶铺满碧玉和绿玉髓，地面则用最上等的珍珠母铺成。可龙王坐拥辽阔海疆、华美宫殿和数不清的奇珍，整个海底也没人敢违抗他，他却并不快乐。因为这么大的王国里，王位上始终只有他孤零零一个人。
        - id: ch01-b03
          speaker: narrator
          text: 龙王想了很久，终于决定娶一位妻子。他觉得有了王后，自己既会更快活，力量也会更强。于是，他把鱼族臣属全都召集起来，从中选出几名使者，让他们走遍海疆，寻访一位年轻的龙公主，迎来做他的新娘。
        - id: ch01-b04
          speaker: narrator
          text: 使者们终于带回一条美丽的小龙。她的绿鳞像夏日甲虫的翅膀一样闪亮，双眼顾盼时仿佛射出火光。她身上的华服绣满海中珠宝，璀璨夺目。龙王一见到她，就爱上了她。
        - id: ch01-b05
          speaker: narrator
          text: 婚礼办得辉煌盛大。从巨鲸到小虾，所有海中生灵都成群赶来，向新郎新娘祝贺，祝他们长寿兴旺。鱼族世界从未有过这么庞大的聚会，也从未有过这么热闹的庆典。搬运新娘嫁妆的队伍横过海面，仿佛从大海这头一直排到那头。鱼儿们穿着蓝色、粉色和银色的典礼华服，各自提着一盏磷光灯笼。那一夜，海浪起落、翻卷、破碎，就像一团团白绿色的火焰。连磷火也为了庆贺这场婚礼，亮了足足一倍。
        - id: ch01-b06
          speaker: narrator
          text: 婚后好一阵子，龙王和新娘过得十分幸福。他们彼此深爱。龙王每天都兴致勃勃，带她观赏珊瑚宫里的奇景和珍宝。她也总爱陪着龙王，走过一座座宽阔的殿堂和花园，怎么都看不厌。两个人都觉得，这样的日子就像一个没有尽头的夏日。
    - id: ch02
      title: 龙后所需的药
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这样的幸福日子过了两个月，龙后忽然病倒，只能躺在床上。龙王见心爱的妻子病得厉害，忧心得不得了。他急忙召来鱼医为她开药，还特意吩咐侍从日夜细心看护，凡事都要殷勤周到。可大家再尽心，鱼医开的药再多，年轻的王后也没有一点好转，病情反而一天比一天沉重。
        - id: ch02-b02
          speaker: narrator
          text: 龙王把鱼医叫到面前，责怪他医术不济，迟迟治不好王后。鱼医看出龙王满心不悦，吓得连忙为自己辩解。他说，自己其实知道病人该用哪味药，只是那东西在整个海里也根本找不到。
        - id: ch02-b03
          speaker: dragon_king
          text: 你是说，这味药在我的海中也弄不到？
        - id: ch02-b04
          speaker: fish_doctor
          text: 陛下说得正是。
        - id: ch02-b05
          speaker: dragon_king
          text: 那就说清楚。治王后到底需要什么？
        - id: ch02-b06
          speaker: fish_doctor
          text: 需要一只活猴子的肝！
        - id: ch02-b07
          speaker: dragon_king
          text: 活猴子的肝？这可不容易找到。
        - id: ch02-b08
          speaker: fish_doctor
          text: 只要有了它，王后陛下很快就会康复。
        - id: ch02-b09
          speaker: dragon_king
          text: 那就定了。无论用什么办法，也要把它找来。可是，哪里才有猴子？
        - id: ch02-b10
          speaker: narrator
          text: 鱼医说，往南走很远，有一座猴岛，那里住着许多猴子。
        - id: ch02-b11
          speaker: fish_doctor
          text: 要是陛下能从岛上捉来一只就好了。
        - id: ch02-b12
          speaker: dragon_king
          text: 我的臣民怎么捉猴子？猴子住在陆地，我们却活在水里。离开海水，大家什么本领也使不出来。这件事要怎么办？
        - id: ch02-b13
          speaker: fish_doctor
          text: 这也是我一直为难的地方。不过陛下臣仆无数，总能找到一个可以专程上岸的人吧。
        - id: ch02-b14
          speaker: narrator
          text: 龙王认定这件事非办不可，便立刻把总管召来，一起商议该派谁去。总管站在那里想了许久，忽然像是被一个念头击中，顿时喜上眉梢。
        - id: ch02-b15
          speaker: chief_steward
          text: 有办法了！那个叫水母的臣仆虽然模样难看，却总夸自己有四条腿，能像乌龟一样在岸上走路。就派他去猴岛捉一只吧。
        - id: ch02-b16
          speaker: narrator
          text: 水母很快奉召来到龙王面前。陛下亲口告诉他，这趟差事就是去猴岛捉一只活猴子。水母没想到这样的任务会落在自己头上，顿时满脸为难。他从没去过那座岛，也从来没有捉过猴子，实在怕自己一只也抓不到。
        - id: ch02-b17
          speaker: chief_steward
          text: 你若想靠力气或身手去捉，当然永远捉不到。你只能想法子骗一只回来！
        - id: ch02-b18
          speaker: jellyfish
          text: 可我怎么骗猴子呢？我不会呀。
        - id: ch02-b19
          speaker: chief_steward
          text: 到了猴岛，先和一只猴子交朋友。告诉他你是龙王的臣仆，请他到龙宫做客。再把宫殿多么壮丽、海中有多少奇景，说得活灵活现。等他起了好奇心，自然一心想来看。
        - id: ch02-b20
          speaker: jellyfish
          text: 可猴子不会游水，我怎么把他带回来？
        - id: ch02-b21
          speaker: chief_steward
          text: 你背他回来。你的硬壳若连这点用处都没有，留着做什么？
        - id: ch02-b22
          speaker: jellyfish
          text: 他不会很重吗？
        - id: ch02-b23
          speaker: chief_steward
          text: 你替龙王办事，就别计较这些。
        - id: ch02-b24
          speaker: jellyfish
          text: 好吧，我一定尽力。
    - id: ch03
      title: 水母来到猴岛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 水母离开龙宫，朝猴岛出发。他一路游得飞快，几个时辰后便到了目的地，恰好乘着一道迎面而来的海浪上了岸。他站稳以后四下一望，不远处有棵枝条低垂的大松树。其中一根树枝上，正坐着他苦苦寻找的东西，一只活猴子。
        - id: ch03-b02
          speaker: jellyfish
          text: 我的运气真好！只要奉承他几句，把他诱到龙宫，差事就办完了。
        - id: ch03-b03
          speaker: narrator
          text: 那个古老的年代，水母有四条腿，还有乌龟一样的硬壳。他慢慢走到松树下，抬头喊了起来。
        - id: ch03-b04
          speaker: jellyfish
          text: 猴先生，您好啊！今天的天气可真好，是不是？
        - id: ch03-b05
          speaker: monkey
          text: 天气确实不错。我从没在这里见过你。你从哪儿来，叫什么名字？
        - id: ch03-b06
          speaker: jellyfish
          text: 我叫水母，是龙王的臣仆。早就听说你们的岛很美，所以特意来看看。
        - id: ch03-b07
          speaker: monkey
          text: 见到你，我也很高兴。
        - id: ch03-b08
          speaker: jellyfish
          text: 对了，你见过我住的海底龙宫吗？
        - id: ch03-b09
          speaker: monkey
          text: 我常听人说起，可从没亲眼见过。
        - id: ch03-b10
          speaker: jellyfish
          text: 那你一定得去看看。一辈子没见过龙宫，多可惜呀。它美得说也说不尽，在我眼里，那就是世上最美的地方。
        - id: ch03-b11
          speaker: monkey
          text: 真有那么美？
          emotion: surprised
        - id: ch03-b12
          speaker: narrator
          text: 水母知道机会来了，便使出所有本领，把海中龙宫说得又美丽又壮观。宫中的花园更加奇妙，白的、粉的、红的珊瑚长成一棵棵怪树，枝头还挂着更稀奇的果子，一颗颗就像硕大的宝石。猴子越听越着迷。为了一个字也不错过，他一边听，一边沿着树干慢慢往下爬，终于一步一步来到地面。
        - id: ch03-b13
          speaker: narrator
          text: 水母暗自得意，心想：“这下终于拿住他了！”
        - id: ch03-b14
          speaker: narrator
          text: 水母心里这样想，嘴上却装得十分客气。
        - id: ch03-b15
          speaker: jellyfish
          text: 猴先生，我得回去了。你既然没见过龙宫，何不趁这个好机会跟我走？我可以为你带路，把海里的景致都指给你看。你住在陆地上，看见它们一定觉得更神奇。
        - id: ch03-b16
          speaker: monkey
          text: 我很想去，可要怎么过海？你知道我不会游水呀！
        - id: ch03-b17
          speaker: jellyfish
          text: 这不难。我背你过去。
        - id: ch03-b18
          speaker: monkey
          text: 那不是太麻烦你了吗？
        - id: ch03-b19
          speaker: jellyfish
          text: 一点也不麻烦。我比看起来有力气，你只管上来吧。
        - id: ch03-b20
          speaker: narrator
          text: 水母让猴子坐到背上，迈进海里。
        - id: ch03-b21
          speaker: jellyfish
          text: 猴先生，坐稳了。千万别掉进海里，我得把你平安送到龙宫。
        - id: ch03-b22
          speaker: monkey
          text: 请慢一点，不然我真要摔下去了。
        - id: ch03-b23
          speaker: narrator
          text: 水母驮着猴子，贴着一道道波浪向前游。猴子紧紧坐在他的硬壳上，他们就这样走了很远。到了海路中途，几乎不懂身体构造的水母突然想起这趟差事里最重要的东西。他忍不住猜起来，猴子到底有没有把自己的肝带在身上？
    - id: ch04
      title: 挂在树上的肝
      blocks:
        - id: ch04-b01
          speaker: jellyfish
          text: 猴先生，我问你，你身上带着肝这种东西吗？
        - id: ch04-b02
          speaker: narrator
          text: 猴子被这个怪问题惊住了，反问水母为什么要肝。
        - id: ch04-b03
          speaker: jellyfish
          text: 肝是最要紧的东西。我刚刚想起来，所以才问你有没有带来。
        - id: ch04-b04
          speaker: monkey
          text: 我的肝为什么对你这么要紧？
        - id: ch04-b05
          speaker: jellyfish
          text: 哦，以后你就知道了。
        - id: ch04-b06
          speaker: narrator
          text: 猴子越想越好奇，也越想越疑心。他一再催问水母，非要知道自己的肝究竟有什么用。最后，他还求水母体谅一下，说这些古怪的话已经弄得自己十分不安。水母看见他满脸焦虑，竟有些可怜他，便把全部真相都说了。龙后病得很重，鱼医说只有活猴子的肝才能救她，而龙王派水母出来，正是为了寻找一只猴子。
        - id: ch04-b07
          speaker: jellyfish
          text: 我已经照吩咐办完差事了。一到龙宫，鱼医就会取你的肝。想到这里，我真替你难过！
        - id: ch04-b08
          speaker: narrator
          text: 猴子听得魂不附体，也为水母设下圈套欺骗自己而怒火中烧。一想到龙宫里等着他的命运，他便怕得全身发抖。但猴子很聪明，明白最稳妥的办法，是不让水母看出自己的恐惧。他拼命稳住心神，装出若无其事的样子，同时苦苦寻找逃命的办法。
        - id: ch04-b09
          speaker: narrator
          text: 猴子心里明白，鱼医要剖开他的肚子，拿走他的肝，那他一定会死。
        - id: ch04-b10
          speaker: narrator
          text: 猴子终于灵机一动。他收起惧色，换上一副欢快的口气。
        - id: ch04-b11
          speaker: monkey
          text: 水母先生，真可惜！离开岛以前，你怎么没早点告诉我？
        - id: ch04-b12
          speaker: jellyfish
          text: 我要是说了请你来的原因，你一定不肯走。
        - id: ch04-b13
          speaker: monkey
          text: 那你完全想错了。猴子少一两个肝不碍事，何况龙后正需要它。我要是早猜到你缺什么，不等你开口就会送一个。我有好几个肝呢！只怪你说得太晚，我把它们全挂在松树上了。
        - id: ch04-b14
          speaker: jellyfish
          text: 你把肝留在岛上了？
          emotion: surprised
        - id: ch04-b15
          speaker: monkey
          text: 是啊。白天我总把肝挂在树枝上，免得从一棵树跳到另一棵树时碍手碍脚。今天听你说得有趣，我把这事忘得干干净净，什么也没拿就跟你走了。你若早说，我一定记得带上！
        - id: ch04-b16
          speaker: narrator
          text: 水母听了失望极了。他相信猴子说的每一个字，根本没想到这是逃命的谎话。没有肝，这只猴子带回去也毫无用处。水母越想越泄气，终于停了下来，把这件难事告诉猴子。
        - id: ch04-b17
          speaker: monkey
          text: 这很容易补救。让你费了这么多工夫，我真过意不去。只要送我回到刚才的地方，我马上就能取到肝。
        - id: ch04-b18
          speaker: narrator
          text: 水母一点也不愿再走那么远的回头路。猴子却耐心劝他，还一再保证，只要水母肯好心送自己回去，他一定从树上挑出最好的一只肝，等下次出发时亲手带来。水母听着听着终于被说动，只好在半途掉转方向，又游回遥远的猴岛。
        - id: ch04-b19
          speaker: narrator
          text: 一到岸边，猴子马上跳下水母的背，爬回最初那棵松树。他在枝头连翻几个跟头，庆幸自己平安回了家，这才低头望着水母。
        - id: ch04-b20
          speaker: monkey
          text: 多谢你一路辛苦！回去以后，请替我向龙王问好！
        - id: ch04-b21
          speaker: narrator
          text: 水母听见这番出人意料的话，又听出猴子的声音里满是嘲弄，越想越不明白。他仰头追问，猴子不是答应过自己吗？难道他不打算取下挂在树上的肝，马上跟自己回龙宫去？
        - id: ch04-b22
          speaker: narrator
          text: 猴子哈哈大笑。他说肝这么宝贵，自己可舍不得失去。
        - id: ch04-b23
          speaker: jellyfish
          text: 可你答应过我的！别忘了自己的诺言呀！
        - id: ch04-b24
          speaker: monkey
          text: 那个诺言本来就是假的，现在当然也不算数了！我从头到尾都在骗你。我若真跟你去见等在龙宫里的老鱼医，哪里还能保住性命？还好我假装把肝留在树上，才让你送我回来。我可不想死。
        - id: ch04-b25
          speaker: monkey
          text: 我当然不会把肝送给你。不过你要是真有本事，就自己上来拿吧！
        - id: ch04-b26
          speaker: narrator
          text: 事到如今，水母终于后悔自己太愚蠢。猴子高高待在树上，他已经无计可施，只能回去向海中龙王承认失败。于是，水母又悲伤又沮丧，慢吞吞地向龙宫游去。小岛渐渐落到身后，猴子嘲笑他的声音却还从岸上传来。那笑声，也是水母离开猴岛前最后听见的声音。
    - id: ch05
      title: 水母失去了骨头
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 龙王、鱼医、总管和宫中所有侍从，都在焦急地等水母回来。他们远远看见水母游向宫殿，立刻欢喜地高声招呼，以为他已经办成差事。大家连连感谢他辛苦跑了一趟猴岛。可是，他们很快发现水母背上空空荡荡，只有他独自回来，便一起追问那只猴子究竟去了哪里。
        - id: ch05-b02
          speaker: narrator
          text: 算账的时候到了。水母浑身发抖，只好从头说起。他如何把猴子驮到半路，又如何一时愚蠢，泄露了自己的使命。猴子又如何骗他说，肝还挂在岛上的树枝上。
        - id: ch05-b03
          speaker: narrator
          text: 龙王听完勃然大怒，当场下令严厉惩罚水母。那刑罚可怕极了。侍从要从水母活生生的身体里抽掉每一根骨头，然后再拿棍棒狠狠痛打他。
        - id: ch05-b04
          speaker: narrator
          text: 可怜的水母又羞又怕，那份屈辱和恐惧简直说也说不尽。他大声哀求龙王宽恕，可王命谁也不敢违抗。宫中侍从立刻各自拿来一根棍棒，把他团团围住。他们抽出水母全身的骨头，又把他打成扁平的一摊，随后拖出宫门，远远扔进海水里。
        - id: ch05-b05
          speaker: narrator
          text: 水母被留在那里受苦。他悔恨自己多嘴，也只能慢慢习惯这副没有骨头的新身体。
        - id: ch05-b06
          speaker: narrator
          text: 所以，在很久以前，水母确实曾像乌龟一样，有硬壳，也有骨头。可是，自从龙王的判决落到水母祖先身上，他的子孙后代就全都变得柔软无骨。直到今天，海浪把水母冲上日本的海岸时，你看见的仍是这副模样。
