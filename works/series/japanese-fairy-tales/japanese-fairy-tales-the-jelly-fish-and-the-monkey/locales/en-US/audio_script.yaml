  chapters:
    - id: ch01
      title: The Dragon Queen Falls Ill
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago, the Kingdom of the Sea was ruled by Rin Jin, the wonderful Dragon King. Every creature in the ocean, great or small, obeyed him. He also guarded the Jewels of the Ebb and Flow of the Tide. Cast the first jewel into the ocean, and the sea drew back from the land. Cast the second, and waves rose like mountains and rushed onto the shore.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Rin Jin's palace stood at the bottom of the sea, more beautiful than anything anyone had ever seen, even in dreams. Coral formed its walls. Jadestone and green chrysoprase covered its roof, and the finest mother-of-pearl shone beneath every foot. Yet all this beauty could not make the King happy at all. His kingdom reached far and wide, his palace held endless wonders, and no creature in the whole sea challenged his power. Still, he ruled alone.
        - id: ch01-b03
          speaker: narrator
          text: >-
            At last, he decided that a wife would make him happier and his kingdom stronger. He called together his fish retainers and chose several as ambassadors. They were to search the sea for a young Dragon Princess who could become his bride.
        - id: ch01-b04
          speaker: narrator
          text: >-
            In time, the ambassadors returned with a lovely young dragon. Her scales glittered green like the wings of summer beetles, and fire flashed in her eyes. Gorgeous robes flowed around her, embroidered with every jewel the sea could offer.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The King loved her the moment he saw her, and their wedding was celebrated in great splendor. Every creature in the sea came swimming in great shoals to congratulate the bride and bridegroom and wish them a long and prosperous life. They came from every part of the kingdom, from the enormous whales to the smallest shrimps. Never before had the Fish-World seen such a gathering or such joyful festivities.
        - id: ch01-b06
          speaker: narrator
          text: >-
            A long train of bearers carried the bride's possessions to her new home. It seemed to stretch across the waves from one end of the sea to the other. Each fish wore ceremonial robes gleaming blue, pink, and silver, and each held a phosphorescent lantern. That night, as the waves rose, fell, and broke, they looked like rolling masses of white and green fire. The natural glow in the water shone with twice its usual brilliance, as if the sea itself were honoring the wedding.
        - id: ch01-b07
          speaker: narrator
          text: >-
            For a while, the Dragon King and his bride lived very happily. They loved each other dearly. Day after day, he showed her the treasures and wonders of his coral palace, and she never tired of walking beside him through its vast halls and gardens. To both of them, life felt like one long summer day.
        - id: ch01-b08
          speaker: narrator
          text: >-
            But after two months, the Dragon Queen fell ill and had to remain in bed. The King was terribly worried when he saw his precious bride so sick. He sent for the fish doctor at once. He gave the servants special orders to nurse her with the greatest care and attend to everything she needed. Yet all their careful nursing and every medicine the doctor prescribed did no good. The young Queen showed no sign of recovery. Instead, she grew worse each day.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The King summoned the doctor and angrily blamed him for failing to cure her. The doctor saw Rin Jin's displeasure and became alarmed. He said he knew the medicine the Queen needed, but it could not be found anywhere in the sea.
        - id: ch01-b10
          speaker: dragon_king
          text: >-
            Are you telling me that the medicine cannot be obtained here?
        - id: ch01-b11
          speaker: doctor
          text: >-
            Yes, Your Majesty. That is exactly the difficulty.
        - id: ch01-b12
          speaker: dragon_king
          text: >-
            Then tell me what you need for the Queen.
        - id: ch01-b13
          speaker: doctor
          text: >-
            I need the liver of a living monkey.
        - id: ch01-b14
          speaker: dragon_king
          text: >-
            A living monkey's liver? That will be very hard to obtain.
        - id: ch01-b15
          speaker: doctor
          text: >-
            If we could get one, Her Majesty would soon be well again.
        - id: ch01-b16
          speaker: dragon_king
          text: >-
            Then it is decided. Somehow, we must get it. Where are we most likely to find a monkey?
        - id: ch01-b17
          speaker: narrator
          text: >-
            The doctor told him that far to the south lay Monkey Island, where many monkeys lived.
        - id: ch01-b18
          speaker: doctor
          text: >-
            If only one of those monkeys could be captured.
        - id: ch01-b19
          speaker: dragon_king
          text: >-
            But how can any of my people catch one? Monkeys live on dry land, and we live in the water. Away from the sea, we have no power at all. What can we possibly do?
        - id: ch01-b20
          speaker: doctor
          text: >-
            That is what troubles me too. Still, among all your servants, there must be someone who can go ashore for this one purpose.
        - id: ch01-b21
          speaker: dragon_king
          text: >-
            Something must be done.
    - id: ch02
      title: The Mission to Monkey Island
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The King called his chief steward and asked for his advice. The steward thought for some time. Then a sudden idea delighted him.
        - id: ch02-b02
          speaker: chief_steward
          text: >-
            I know what we should do! Send the kurage, the jelly fish. He may be ugly, but he is proud that his four legs let him walk on land like a tortoise. Let him go to Monkey Island and catch one.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The jelly fish was summoned before the King and told exactly what was required of him. The unexpected mission troubled him greatly. He had never visited Monkey Island, and he had no experience at all in catching monkeys. He feared that bringing one back might be beyond him.
        - id: ch02-b04
          speaker: jelly_fish
          text: >-
            Your Majesty, I fear I may not be able to bring one back.
        - id: ch02-b05
          speaker: chief_steward
          text: >-
            If you rely on strength or skill, you will never catch a monkey. You must trick one instead.
        - id: ch02-b06
          speaker: jelly_fish
          text: >-
            Trick a monkey? But how? I have no idea what to do.
        - id: ch02-b07
          speaker: chief_steward
          text: >-
            When you reach Monkey Island and meet a monkey, become as friendly with him as you can. Tell him you are one of the Dragon King's servants, and invite him to visit the palace. Describe its grandeur and all the wonders beneath the sea as vividly as possible. You must awaken his curiosity until he longs to see everything for himself.
        - id: ch02-b08
          speaker: jelly_fish
          text: >-
            But how will I bring the monkey here? Monkeys cannot swim.
        - id: ch02-b09
          speaker: chief_steward
          text: >-
            Carry him on your back. What good is your shell if you cannot do that?
        - id: ch02-b10
          speaker: jelly_fish
          text: >-
            Won't a monkey be terribly heavy?
        - id: ch02-b11
          speaker: chief_steward
          text: >-
            Never mind the weight. You will be serving the Dragon King.
        - id: ch02-b12
          speaker: jelly_fish
          text: >-
            Then I will do my best.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The jelly fish left the palace and set out toward Monkey Island. He swam swiftly, and in only a few hours, he reached his destination. A convenient wave carried him safely onto the shore. He looked around at once. Not far away stood a great pine tree with long, drooping branches, and there on one of those branches sat exactly what he had come to find. A living monkey.
        - id: ch02-b14
          speaker: jelly_fish
          text: >-
            What luck! Now I must flatter him and tempt him to return with me. Then my work will be finished.
        - id: ch02-b15
          speaker: narrator
          text: >-
            In those ancient days, the jelly fish had four legs and a hard shell like a tortoise. He walked slowly toward the pine tree, looked up, and called to the monkey.
        - id: ch02-b16
          speaker: jelly_fish
          text: >-
            Good day, Mr. Monkey! What lovely weather we're having.
        - id: ch02-b17
          speaker: monkey
          text: >-
            It is a fine day. I haven't seen you around here before. Where did you come from, and what is your name?
        - id: ch02-b18
          speaker: jelly_fish
          text: >-
            My name is Kurage, or Jelly Fish, and I serve the Dragon King. I have heard so much about your beautiful island that I came especially to see it.
        - id: ch02-b19
          speaker: monkey
          text: >-
            Then I'm very glad you've come.
        - id: ch02-b20
          speaker: jelly_fish
          text: >-
            By the way, have you ever seen the Dragon King's palace beneath the sea? That is where I live.
        - id: ch02-b21
          speaker: monkey
          text: >-
            I've heard about it many times, but I've never seen it.
        - id: ch02-b22
          speaker: jelly_fish
          text: >-
            Then you truly ought to visit. What a pity it would be to go through your whole life without seeing it! I cannot begin to describe its beauty. To me, it is the loveliest place in the world.
        - id: ch02-b23
          speaker: monkey
          text: >-
            Is it really as beautiful as that?
          emotion: surprised
        - id: ch02-b24
          speaker: narrator
          text: >-
            The jelly fish knew he had found his chance. He went on describing the palace as vividly as he could, with all its beauty and grandeur. He spoke of the wonders in its garden, where strange trees of white, pink, and red coral grew beneath the sea. From their branches hung fruits more curious still, shining like enormous jewels. The monkey became more interested with every word. As he listened, he climbed down the tree one step at a time so that he would not miss any part of the marvelous story.
        - id: ch02-b25
          speaker: jelly_fish
          text: >-
            I have him now!
          emotion: happy
        - id: ch02-b26
          speaker: narrator
          text: >-
            That was what the jelly fish thought. Aloud, he spoke very differently.
        - id: ch02-b27
          speaker: jelly_fish
          text: >-
            Mr. Monkey, I must return home now. Since you've never seen the Dragon King's palace, why not come with me? I can guide you and show you all the sights beneath the sea. To someone who lives on land, they will seem more wonderful still.
        - id: ch02-b28
          speaker: monkey
          text: >-
            I would love to go, but how can I cross the water? You know I cannot swim.
        - id: ch02-b29
          speaker: jelly_fish
          text: >-
            That is no difficulty. I can carry you on my back.
        - id: ch02-b30
          speaker: monkey
          text: >-
            I would be giving you far too much trouble.
        - id: ch02-b31
          speaker: jelly_fish
          text: >-
            I can carry you easily. I am stronger than I look, so please don't hesitate.
        - id: ch02-b32
          speaker: narrator
          text: >-
            The monkey climbed onto the jelly fish's hard shell, and the jelly fish stepped into the sea.
        - id: ch02-b33
          speaker: jelly_fish
          text: >-
            Sit very still, Mr. Monkey. You must not fall into the water. I am responsible for bringing you safely to the palace.
        - id: ch02-b34
          speaker: monkey
          text: >-
            Please don't go so fast. I'm sure I'll fall off!
          emotion: fearful
    - id: ch03
      title: The Secret on the Open Sea
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Away they went, with the jelly fish skimming through the waves and the monkey perched on his back. By the time they were halfway across, a new thought had begun to worry the jelly fish. He knew very little about bodies, and he suddenly wondered whether the monkey had brought his liver.
        - id: ch03-b02
          speaker: jelly_fish
          text: >-
            Mr. Monkey, tell me something. Do you happen to have a liver with you?
        - id: ch03-b03
          speaker: narrator
          text: >-
            The strange question greatly surprised the monkey. He asked why the jelly fish wanted a liver.
        - id: ch03-b04
          speaker: jelly_fish
          text: >-
            It is the most important thing of all. As soon as I remembered it, I had to ask whether you brought yours.
        - id: ch03-b05
          speaker: monkey
          text: >-
            Why is my liver so important to you?
        - id: ch03-b06
          speaker: jelly_fish
          text: >-
            Oh, you will find out later.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Now the monkey grew more curious and more suspicious with every moment. He pressed the jelly fish again and again to explain why anyone wanted his liver. At last, he appealed to the jelly fish's feelings. He said that what he had already heard was troubling him deeply and begged to know the whole truth.
        - id: ch03-b08
          speaker: narrator
          text: >-
            When the jelly fish saw how anxious the monkey looked, he felt sorry for him and revealed everything. He told how the Dragon Queen had fallen ill, how the doctor said only a living monkey's liver could cure her, and how the King had sent him to find one.
        - id: ch03-b09
          speaker: jelly_fish
          text: >-
            I have done what the King commanded. As soon as we reach the palace, the doctor will take your liver. I truly feel sorry for you.
          emotion: sad
        - id: ch03-b10
          speaker: narrator
          text: >-
            The poor monkey was horrified when he heard the truth. He was furious that the jelly fish had tricked him, and he trembled with fear as he imagined what awaited him at the palace. But the monkey was clever. He decided that showing his fear would only make matters worse. He forced himself to appear calm while his thoughts raced, searching for some way to escape before they reached the Dragon King.
        - id: ch03-b11
          speaker: monkey
          text: >-
            The doctor will cut me open and take out my liver. Then I will die!
          emotion: fearful
        - id: ch03-b12
          speaker: narrator
          text: >-
            At last, a bright idea came to him. He turned to the jelly fish and spoke as cheerfully as he could.
        - id: ch03-b13
          speaker: monkey
          text: >-
            What a shame you didn't mention this before we left the island, Mr. Jelly Fish!
          emotion: happy
        - id: ch03-b14
          speaker: jelly_fish
          text: >-
            If I had told you why I wanted you to come, you certainly would have refused.
        - id: ch03-b15
          speaker: monkey
          text: >-
            Oh, you are quite mistaken. A monkey can easily spare a liver or two, especially when one is needed by the Dragon Queen of the Sea. If I had guessed what you wanted, I would have presented you with one without waiting to be asked. You see, I have several livers. The great pity is that you said nothing in time, so I left every one of them hanging on the pine tree.
        - id: ch03-b16
          speaker: jelly_fish
          text: >-
            You left your liver behind?
          emotion: surprised
        - id: ch03-b17
          speaker: monkey
          text: >-
            Yes. During the day, I usually hang my liver on a tree branch. It gets terribly in the way when I leap from tree to tree. Your wonderful stories distracted me today, so I forgot it when I left with you. If you had explained sooner, I would have remembered to bring it.
        - id: ch03-b18
          speaker: narrator
          text: >-
            The jelly fish believed every word the monkey said. The news disappointed him terribly. After all his effort, a monkey without a liver was no use to the doctor or the Queen. At last, he stopped swimming in the middle of the sea and told the monkey that they could not continue without it.
        - id: ch03-b19
          speaker: monkey
          text: >-
            We can fix that easily. I'm sorry you've had so much trouble, but take me back to the place where you found me. I will fetch my liver at once.
        - id: ch03-b20
          speaker: narrator
          text: >-
            The jelly fish did not like the thought of traveling all the way back to the island. But the monkey kept assuring him that the extra journey would be worthwhile. If the jelly fish was kind enough to take him home, he would climb the pine tree, choose his very best liver, and bring it along the next time. At last, the jelly fish was persuaded. He turned around in the waves and headed for Monkey Island once more.
    - id: ch04
      title: The Monkey Escapes
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The moment they reached the shore, the sly monkey jumped off. He scrambled into the very pine tree where the jelly fish had first seen him. Safe among the branches, he leaped and capered for joy. Then he looked down at the jelly fish.
        - id: ch04-b02
          speaker: monkey
          text: >-
            Thank you for taking so much trouble! When you return, please give my compliments to the Dragon King.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The jelly fish wondered what this strange speech meant, and the monkey's mocking tone puzzled him even more. He called up into the branches and asked whether the monkey still intended to return at once, as soon as he had fetched his liver.
        - id: ch04-b04
          speaker: monkey
          text: >-
            Come back with you? I cannot afford to lose my liver. It is much too precious!
        - id: ch04-b05
          speaker: jelly_fish
          text: >-
            But you made me a promise!
          emotion: sad
        - id: ch04-b06
          speaker: monkey
          text: >-
            That promise was false, and now it is broken anyway! I was deceiving you. Why would I give up my life by going to the Sea King's palace, where that old doctor is waiting for me? I only told you about the livers so you would bring me home.
        - id: ch04-b07
          speaker: monkey
          text: >-
            Of course I will not give you my liver. Come up here and take it, if you can!
        - id: ch04-b08
          speaker: narrator
          text: >-
            There was nothing the jelly fish could do now. He could only regret his foolishness, return to the Dragon King of the Sea, and confess that he had failed. He entered the water and began the journey back, swimming sadly and slowly. The island slipped farther and farther behind him. The very last sound he heard as he glided away was the monkey still laughing at him from the pine tree.
    - id: ch05
      title: Why the Jelly Fish Has No Bones
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Meanwhile, the Dragon King, the doctor, the chief steward, and all the palace servants waited impatiently for the jelly fish to return. At last, they caught sight of him approaching the palace. They greeted him with delight and thanked him over and over for all the trouble he had taken in traveling to Monkey Island. Then they looked for the creature he was supposed to bring and asked where the monkey was.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The jelly fish knew that his day of reckoning had come. He trembled all over as he told them the whole story from beginning to end. He explained how he had persuaded the monkey to ride on his back and carried him halfway across the sea. Then he confessed that he had foolishly revealed the secret of his mission. Last of all, he admitted how the monkey had deceived him by claiming that he had left all his livers hanging on the pine tree.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The Dragon King's anger was terrible. He immediately ordered a severe punishment. Every bone was to be pulled from the jelly fish's living body, and then the jelly fish was to be beaten with sticks.
        - id: ch05-b04
          speaker: jelly_fish
          text: >-
            Your Majesty, please forgive me!
          emotion: fearful
        - id: ch05-b05
          speaker: narrator
          text: >-
            The poor jelly fish was humiliated and horrified beyond words, but the King's command had to be obeyed. The palace servants came at once, each carrying a stick, and surrounded him. First they pulled every bone from his living body. Then they beat him until he was as flat as pulp. When the punishment was over, they carried him out beyond the palace gates and threw him into the water.
        - id: ch05-b06
          speaker: narrator
          text: >-
            There he was left to suffer, repent of his foolish chatter, and grow used to having no bones.
        - id: ch05-b07
          speaker: narrator
          text: >-
            And so, in former times, the jelly fish had a shell and bones rather like a tortoise. But after the Dragon King's sentence was carried out on the ancestor of all jelly fishes, every one of his descendants was soft and boneless. That is how you still find them today, cast high onto the shores of Japan by the waves.
