  chapters:
    - id: ch01
      title: The Brothers Exchange Their Skills
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago, Japan was ruled by Hohodemi. He was the fourth Mikoto, or Augustness, in descent from the glorious Amaterasu, the Sun Goddess. He was as handsome as his great ancestress was beautiful. He was also strong and brave, and no hunter anywhere in the land could match his skill. That was why people called him Yama-sachi-hiko, the Happy Hunter of the Mountains.
        - id: ch01-b02
          speaker: narrator
          text: >-
            His elder brother had a different gift. He could fish better than any rival, so people named him Umi-sachi-hiko, the Skillful Fisher of the Sea. The brothers each loved the work he knew best. Day after day, one followed wild animals over the mountains and down into the valleys, while the other went out with his rod and returned carrying fish. Their separate occupations pleased them, and the days passed quickly.
        - id: ch01-b03
          speaker: happy_hunter
          text: >-
            Brother, every day you carry your rod to the sea and come home loaded with fish. I take my bow and arrows into the mountains to hunt. We have both followed the same work for so long that we must be tired of it. Why don't we trade? You can hunt in the mountains, and I'll fish in the sea.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The Skillful Fisher listened without speaking. He thought for a moment before answering.
        - id: ch01-b05
          speaker: skillful_fisher
          text: >-
            Yes, why not? That sounds like a fair idea. Give me your bow and arrows, and I'll go into the mountains at once.
        - id: ch01-b06
          speaker: narrator
          text: >-
            That short talk settled the matter. The brothers exchanged their tools and each set out to try the other's work. Neither one dreamed of everything that would follow. Their decision was unwise, because skill does not pass from one man to another with a bow or a fishing rod. The Happy Hunter understood nothing about fishing. His elder brother, who had a quick temper, knew just as little about hunting.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The Happy Hunter carried his brother's precious hook and rod down to the shore and found a place on the rocks. He put bait on the hook, then threw the line clumsily into the sea. He watched the little float rise and fall on the water, longing for a fine fish to take the bait. Whenever the float moved even slightly, he jerked up the rod. Yet there was never a fish on the line. Up came the hook and its bait, again and again. A practiced fisherman could have caught plenty there, but the greatest hunter in the land turned out to be the most bungling of fishermen.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The whole day slipped away while he sat on the rocks, holding the rod and waiting for his luck to change. The light began to fade. Evening came, and he still had not caught a single fish. Before going home, he drew in the line one final time. Then he saw that the hook was gone. He had not even noticed when it came off.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Fear seized him, because he knew how angry his brother would be. It was the Skillful Fisher's only hook, and he valued it above everything else he owned. The Happy Hunter searched between the rocks and combed the sand, going back and forth along the shore. While he was still searching, his brother arrived. The Skillful Fisher had failed to find any game in the mountains. He came back in a terrible temper, looking fiercely cross. The moment he saw the Hunter hunting through the sand, he knew something had gone wrong.
        - id: ch01-b10
          speaker: skillful_fisher
          text: >-
            What are you doing here, brother?
        - id: ch01-b11
          speaker: happy_hunter
          text: >-
            Oh, brother, I've done something awful.
          emotion: fearful
        - id: ch01-b12
          speaker: skillful_fisher
          text: >-
            What happened? What did you do?
          emotion: angry
        - id: ch01-b13
          speaker: happy_hunter
          text: >-
            I lost your precious fishing hook.
          emotion: fearful
        - id: ch01-b14
          speaker: skillful_fisher
          text: >-
            You lost my hook! I knew this would happen. I never wanted to exchange our work, but you wanted it so badly that I gave in. Now we can see what comes of trying work we don't understand. I will not give back your bow and arrows until you find my hook. Find it, and bring it back quickly!
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: >-
            The Happy Hunter believed everything that had happened was his own fault. He accepted his brother's scornful words with humility and patience, then searched more carefully than ever. He looked everywhere he could think of, but the hook was nowhere. At last, he had to give up hope of finding it on the shore. Desperate to make amends, he went home and broke apart his own beloved sword. From its metal he made five hundred new fishing hooks.
        - id: ch01-b16
          speaker: narrator
          text: >-
            He offered them all to his brother and begged forgiveness, but the Skillful Fisher refused even to consider them. The Happy Hunter made five hundred more and pleaded with him again.
        - id: ch01-b17
          speaker: skillful_fisher
          text: >-
            You could make a million hooks, and none would matter to me. I will forgive you only when you return my own hook.
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: >-
            Nothing could soften the Skillful Fisher's anger. His nature was cruel, and he had long hated the younger brother whose good qualities outshone his own. Now he planned to use the missing hook as an excuse to kill the Happy Hunter and take his place as ruler of Japan. The Happy Hunter understood all of this. Still, he believed a younger brother owed obedience to an elder one, so he said nothing. Heavy with sorrow and almost without hope, he returned to the seashore and began the useless search again.
    - id: ch02
      title: The Road Beneath the Sea
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            As the Happy Hunter stood wondering what to do, an old man with a walking stick suddenly appeared. Later, the Hunter remembered that he had never seen where the man came from. He had simply looked up and found him approaching.
        - id: ch02-b02
          speaker: shiwozuchino_okina
          text: >-
            You are Hohodemi, the Augustness called the Happy Hunter, aren't you? Why are you alone in this place?
        - id: ch02-b03
          speaker: happy_hunter
          text: >-
            Yes, I am. I lost my brother's precious hook while I was fishing. I've searched the whole shore, but I cannot find it, and my brother will not forgive me until I return it. But who are you?
          emotion: sad
        - id: ch02-b04
          speaker: shiwozuchino_okina
          text: >-
            My name is Shiwozuchino Okina, and I live near this shore. I am sorry such trouble has come upon you. But the hook is not here. It must be at the bottom of the sea, or inside a fish that swallowed it. You could search this beach all your life and never find it.
        - id: ch02-b05
          speaker: happy_hunter
          text: >-
            Then what can I do?
          emotion: sad
        - id: ch02-b06
          speaker: shiwozuchino_okina
          text: >-
            Go down to Ryn Gu, the realm beneath the sea. Tell Ryn Jin, the Dragon King, what happened and ask him to find the hook. That is your best hope.
        - id: ch02-b07
          speaker: happy_hunter
          text: >-
            That is a splendid idea. But how can I reach the Sea King's realm when it lies at the bottom of the sea?
        - id: ch02-b08
          speaker: shiwozuchino_okina
          text: >-
            Reaching it will be easy. I can make something to carry you through the sea.
        - id: ch02-b09
          speaker: happy_hunter
          text: >-
            Thank you. I will be deeply grateful if you will help me.
        - id: ch02-b10
          speaker: narrator
          text: >-
            The old man set to work at once, and before long he had made a basket for the journey. The Happy Hunter accepted it joyfully, carried it down to the water, and climbed aboard. Before leaving, he said goodbye to the kind stranger who had helped him. He promised to reward Shiwozuchino Okina when the hook was found and he could return to Japan without fear of his brother's anger. The old man carefully pointed out the direction and explained how to reach Ryn Gu. Then he stood watching as the Hunter rode out to sea in the basket, which floated like a little boat.
        - id: ch02-b11
          speaker: narrator
          text: >-
            The Happy Hunter made all the haste he could, though the strange craft seemed to move through the water by itself. The journey proved far shorter than he expected. Within a few hours, he caught sight of the gate and the many roofs of the Sea King's Palace. It was an immense place. Numberless sloping roofs and gables rose behind huge gateways and high gray stone walls. He landed, left the basket on the beach, and walked toward the main gate. Its great pillars were made of red coral. Jewels of every kind glittered across the gate, and tall katsura trees spread their shade above it. He had heard many tales about the wonders beneath the sea, but none had prepared him for the place he now saw.
        - id: ch02-b12
          speaker: narrator
          text: >-
            The Hunter wanted to enter at once, but the gate was firmly closed. No guard or servant stood nearby, and there was no one he could ask to let him in. He paused to think. Beneath the trees beside the gate, he noticed a well filled with fresh spring water. Surely, he thought, someone from the palace would eventually come to draw water. He climbed into the tree that hung over the well, settled on one of its branches, and rested there while he waited to see what would happen.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Before long, the gate swung open and two beautiful young women came out carrying golden buckets. The Hunter had imagined that a Dragon King's realm would be filled with dragons and other frightening creatures. The sight of two lovely princesses astonished him.
        - id: ch02-b14
          speaker: narrator
          text: >-
            Hidden among the leaves, he watched them walk slowly and gracefully toward the well, their long robes trailing behind them. They had no idea a stranger sat above. The women leaned over the side and lowered their golden buckets, as they did on every day of the year. Then, in the deep and still water, they saw the reflection of a handsome young man looking down from the branches. They had never before seen the face of a mortal man. Startled, they drew back with their buckets in hand. Curiosity soon gave them courage. They glanced timidly upward and discovered the Happy Hunter among the leaves. For a moment, the princesses and the Hunter gazed at one another face to face. Wonder left all three of them without a word to say.
    - id: ch03
      title: A Welcome at the Sea King's Palace
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Once he knew he had been discovered, the Happy Hunter sprang lightly from the tree.
        - id: ch03-b02
          speaker: happy_hunter
          text: >-
            I am a traveler, and I came to this well because I was very thirsty. I found no bucket, so I climbed the tree and waited for someone to come. Then you appeared just when I needed help. Noble ladies, please have mercy on a thirsty traveler in a strange land and give me some water.
        - id: ch03-b03
          speaker: narrator
          text: >-
            His dignity and gentle courtesy overcame their fear. Without speaking, the sisters bowed and returned to the well. They lowered their golden buckets, drew up the cool spring water, and poured it into a jeweled cup. Then they offered the cup to the stranger. He received it with both hands and raised it to the height of his forehead, showing his deep respect and pleasure. His thirst was great, so he drank the water quickly and emptied the cup in one long draught.
        - id: ch03-b04
          speaker: narrator
          text: >-
            When he finished the long drink, he set the cup carefully on the edge of the well. A necklace of strange curved jewels hung around his neck and across his chest. He drew his short sword, cut one jewel free, and placed it inside the cup. Then he returned the cup to the sisters with a deep bow.
        - id: ch03-b05
          speaker: happy_hunter
          text: >-
            Please take this as my thanks.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The sisters accepted the cup, still unsure what their visitor had placed inside. They leaned close and looked down into it. At the bottom lay a beautiful jewel unlike any ordinary gift. Both women started in surprise. A traveler who could part so freely with such a treasure could be no common mortal.
        - id: ch03-b07
          speaker: tayotama
          text: >-
            No ordinary mortal would give away such a jewel so freely. Will you honor us by telling us who you are?
          emotion: surprised
        - id: ch03-b08
          speaker: happy_hunter
          text: >-
            Certainly. I am Hohodemi, the fourth Augustness, known in Japan as the Happy Hunter.
        - id: ch03-b09
          speaker: tayotama
          text: >-
            Are you truly Hohodemi, the grandson of Amaterasu, the Sun Goddess? I am Tayotama, eldest daughter of Ryn Jin, King of the Sea.
          emotion: surprised
        - id: ch03-b10
          speaker: tamayori
          text: >-
            And I am her younger sister, Princess Tamayori.
        - id: ch03-b11
          speaker: happy_hunter
          text: >-
            Then you are both daughters of the Sea King! I cannot tell you how glad I am to meet you. A few days ago, I went fishing with my brother's hook and somehow lost it. He prizes that hook above everything else he owns, so losing it is the worst misfortune that could have befallen me. He is terribly angry and will never forgive me unless I bring it back. I searched the shore many times, but the hook was nowhere. While I was looking again in despair, I met a wise old man. He told me to come to Ryn Gu and ask the Dragon King of the Sea for help. That kind old man also showed me how to reach this place. Now you know why I have come. Will you please take me to your father? Do you think he will agree to see me and help me find the hook?
        - id: ch03-b12
          speaker: tayotama
          text: >-
            You will have no trouble seeing our father. He will be delighted that so noble a guest, the grandson of Amaterasu, has come to the bottom of the sea. Don't you agree, Tamayori?
        - id: ch03-b13
          speaker: tamayori
          text: >-
            I do. Nothing could honor our home more than welcoming the Augustness.
        - id: ch03-b14
          speaker: happy_hunter
          text: >-
            Then please lead the way.
        - id: ch03-b15
          speakers: [tayotama, tamayori]
          ensemble: duo
          text: >-
            Please enter, Augustness.
        - id: ch03-b16
          speaker: narrator
          text: >-
            The sisters bowed low and led him through the gate. Tamayori left her elder sister to guide their guest and hurried ahead. She reached the palace first, ran to her father's room, and told him about the stranger at the well. She explained that Tayotama was even then bringing the Augustness toward the palace. Mortal visitors came very rarely to the Sea King's realm, perhaps only once in several hundred years, so Ryn Jin was amazed. He clapped his hands and summoned every courtier and palace servant, along with the chief fish of the sea. Solemnly, he told them that Amaterasu's grandson was coming. Every one of them must serve the honored guest with perfect ceremony and courtesy. Then he sent them all to the entrance to welcome him.
        - id: ch03-b17
          speaker: narrator
          text: >-
            Ryn Jin put on his finest ceremonial robes and went out in person to welcome the visitor. A few moments later, Tayotama and the Happy Hunter reached the palace entrance. The Sea King and his wife bowed all the way to the ground and thanked him for the honor of coming. Then Ryn Jin led the Hunter into the guest room. He gave him the highest and most honored seat, stood respectfully before him, and bowed once more.
        - id: ch03-b18
          speaker: ryn_jin
          text: >-
            I am Ryn Jin, the Dragon King of the Sea, and this is my wife. Please remember us always.
        - id: ch03-b19
          speaker: happy_hunter
          text: >-
            So you are the Sea King I have heard so much about. Forgive me for arriving without warning and bringing trouble to your palace.
        - id: ch03-b20
          speaker: ryn_jin
          text: >-
            There is no need to thank me. I must thank you for coming. My Sea Palace may be a humble place, but you will honor me greatly if you stay for a long visit.
        - id: ch03-b21
          speaker: narrator
          text: >-
            The Sea King and the Happy Hunter spoke happily together for a long time. At last, Ryn Jin clapped his hands. A great company of fish appeared, all dressed in ceremonial robes and carrying trays of sea delicacies in their fins. A magnificent feast was spread before the King and his royal guest. The attendants had been chosen from the finest fish in the sea, and everyone in the palace tried to show the Hunter how highly they honored him. The meal lasted for hours. During it, Ryn Jin called for his daughters. Tayotama and Tamayori played the koto, the Japanese harp, and took turns singing and dancing. Time passed so pleasantly that the Happy Hunter almost forgot his trouble and the reason for his journey. For a while, he gave himself completely to the wonders of that realm of fairy fish.
    - id: ch04
      title: The Hook in the Red Bream's Throat
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Before long, the Happy Hunter remembered why he had come.
        - id: ch04-b02
          speaker: happy_hunter
          text: >-
            King Ryn Jin, your daughters may have told you that I came to recover my brother's hook. I lost it while fishing. Will you ask your subjects whether any of them have seen a hook lost in the sea?
        - id: ch04-b03
          speaker: ryn_jin
          text: >-
            Certainly. I will summon them and ask at once.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The King issued his command at once. From every part of the sea came the octopus, cuttlefish, bonito, oxtail fish, eel, jellyfish, shrimp, plaice, and many others. Fish of every kind entered the hall and sat before Ryn Jin. They arranged themselves properly, settled their fins in order, and waited to hear why their King had summoned them.
        - id: ch04-b05
          speaker: ryn_jin
          text: >-
            Our guest is Hohodemi, the fourth Augustness and grandson of Amaterasu. He is also called the Happy Hunter of the Mountains. While he fished from Japan's shore, someone took his brother's hook. He has come to our kingdom because one of you may have snatched it in play. If you took it, return it now. If you know who did, tell us who it was and where that fish can be found.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The accusation took every fish by surprise. For some time, no one could answer. They looked at one another, then at the Dragon King, wondering who among them could know anything about the missing hook. None wanted to be mistaken for the thief, yet no one knew what clue to offer. The whole gathering sat in uneasy silence, thinking over everything that had happened in the sea since the previous day. At last, the cuttlefish remembered one fish whose strange illness might explain the mystery. He left his place among the others, came forward before the throne, and asked permission to speak.
        - id: ch04-b07
          speaker: cuttlefish
          text: >-
            I believe Tai, the red bream, must have taken the hook.
        - id: ch04-b08
          speaker: ryn_jin
          text: >-
            What proof do you have?
        - id: ch04-b09
          speaker: cuttlefish
          text: >-
            Since yesterday evening, Tai has eaten nothing, and his throat is badly hurt. The hook may be caught there. Send for him, and we will know.
        - id: ch04-b10
          speakers: [eel, shrimp, plaice]
          ensemble: chorus
          text: >-
            Tai is the only fish who ignored your summons. Please send for him and question him. Then you will know the rest of us are innocent.
        - id: ch04-b11
          speaker: ryn_jin
          text: >-
            It is strange that Tai is absent when he should have been first to answer. Bring him here at once.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Before the King even finished giving the order, the cuttlefish had started for Tai's dwelling. He soon returned with the red bream and led him into the royal presence. Tai looked both frightened and ill. Anyone could see that he was suffering. His face, usually bright red, had turned pale. His eyes were nearly closed and seemed only half their normal size as he sat before the King in pain.
        - id: ch04-b13
          speaker: ryn_jin
          text: >-
            Answer me, Tai! Why did you not come when I summoned you today?
          emotion: angry
        - id: ch04-b14
          speaker: tai
          text: >-
            I have been sick since yesterday. That is why I could not come.
          emotion: fearful
        - id: ch04-b15
          speaker: ryn_jin
          text: >-
            Say no more! The gods sent this illness to punish you for stealing the Augustness's hook.
          emotion: angry
        - id: ch04-b16
          speaker: tai
          text: >-
            It is true. The hook is still in my throat, and I cannot pull it free. I cannot eat and can hardly breathe. It feels ready to choke me, and sometimes the pain is terrible. But I never meant to steal it. I carelessly snapped at the bait, and the hook broke away and stuck in my throat. Please forgive me.
          emotion: fearful
        - id: ch04-b17
          speaker: cuttlefish
          text: >-
            Then I was right. The hook is still there. I believe I can remove it here before the Augustness and return it safely.
        - id: ch04-b18
          speaker: tai
          text: >-
            Please hurry and pull it out! I want so much to give the hook back to the Augustness.
          emotion: fearful
        - id: ch04-b19
          speaker: cuttlefish
          text: >-
            All right, Tai. Open your mouth.
        - id: ch04-b20
          speaker: narrator
          text: >-
            Tai opened his large mouth as wide as he could. The cuttlefish reached one long feeler carefully down his friend's throat. The hook came free quickly and easily. At once, Tai could breathe without that terrible pain. The cuttlefish washed the recovered hook clean and carried it to the King. Ryn Jin received it from his subject, then turned and respectfully placed it in the Happy Hunter's hands. After so much searching and sorrow, the lost hook was his again. His face shone with joy and gratitude.
        - id: ch04-b21
          speaker: happy_hunter
          text: >-
            Thank you, King Ryn Jin. Your wisdom and kindness have brought my search to a happy end.
          emotion: happy
        - id: ch04-b22
          speaker: narrator
          text: >-
            Ryn Jin then declared that Tai should be punished, but the Happy Hunter immediately pleaded for the fish. Now that the hook was safely recovered, he did not want its return to cause still more trouble. The hook had indeed been found in Tai's throat, yet the red bream had already suffered greatly from it. More than that, he had not taken it on purpose or meant any disrespect to the Hunter. He had only snapped carelessly at bait he saw floating in the water. The Happy Hunter said that he himself deserved some blame. If he had understood how to fish properly, he would never have let the hook disappear from his line. All the trouble had begun because he tried to do work he did not know how to do.
        - id: ch04-b23
          speaker: happy_hunter
          text: >-
            My hook has been found, so please do not cause Tai any more pain. He did not mean to take it, and he has suffered enough. Please forgive him.
        - id: ch04-b24
          speaker: narrator
          text: >-
            No one could resist such wise and compassionate pleading. At the request of his honored guest, Ryn Jin forgave Tai at once and ordered that there be no punishment. Relief and happiness swept over the red bream. He shook his fins for joy, free at last from the hook and from the King's anger. Tai and all the other fish then withdrew from the royal presence, praising the mercy and virtue of the Happy Hunter.
    - id: ch05
      title: Three Years in Ryn Gu
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            With the hook recovered, nothing required the Happy Hunter to remain in Ryn Gu. He was eager to return to his own kingdom, give the hook back, and make peace with his angry brother. The Sea King, however, had grown to love the Hunter and wished he could keep him as a son. Ryn Jin begged him not to leave so soon, but to make the Sea Palace his home for as long as he liked. While the Hunter hesitated, Tayotama and Tamayori came to join their father. With graceful bows and the sweetest voices, they too urged him to stay. He could not refuse all three without seeming unkind, and so he remained in the palace.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Night and time moved no differently beneath the sea than they did on Earth. Three years slipped quickly by in that delightful realm, for years pass swiftly when someone is truly happy. The enchanted land seemed to offer a new wonder every day. The Sea King's kindness never weakened. It only increased as time went on. Yet the Happy Hunter slowly grew more and more homesick. He could no longer silence his concern about what might have happened above the sea while he was away. He longed for news of his home, his country, and even his brother. At last, he went to Ryn Jin and told him he must leave.
        - id: ch05-b03
          speaker: happy_hunter
          text: >-
            My years with you have been very happy, and I am grateful for all your kindness. But I rule Japan, and I cannot remain away from my country forever. I must also return my brother's hook and ask him to forgive me for keeping it so long. I am truly sorry to leave you, but I must go today. With your permission, I will take my leave, and I hope one day to visit again.
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: >-
            The Sea King was overcome by the thought of losing the friend who had brought such happiness and change to his palace. He knew the Hunter's duty was in Japan, yet that knowledge did not make the parting easier. As he prepared to answer, tears fell quickly from his eyes.
        - id: ch05-b05
          speaker: ryn_jin
          text: >-
            We are deeply sorry to part from you, Augustness. You have been a noble and honored guest, and we have gladly welcomed you. I understand that Japan needs its ruler, so we cannot ask you to stay, however much we wish it. Please do not forget us. Strange events brought Land and Sea together. May the friendship begun here endure and grow stronger.
          emotion: sad
        - id: ch05-b06
          speaker: narrator
          text: >-
            When the Sea King had finished, he turned to his two daughters and asked them to bring the two Tide-Jewels of the Sea. The princesses bowed low and glided out of the hall. In a few minutes, each returned carrying a flashing gem in both hands. Light from the jewels filled the entire room. The Happy Hunter gazed at them in wonder, unable to guess what they might be, as Ryn Jin received them from his daughters.
        - id: ch05-b07
          speaker: ryn_jin
          text: >-
            Our ancestors passed these precious talismans down from ancient times. We give them to you as a farewell gift and a sign of our great affection. They are called the nanjiu and the kanjiu.
        - id: ch05-b08
          speaker: happy_hunter
          text: >-
            I can never thank you enough. Will you grant me one more kindness and explain what these jewels do and how I should use them?
        - id: ch05-b09
          speaker: ryn_jin
          text: >-
            The nanjiu is the Jewel of the Flood Tide. Whoever holds it can command the sea to roll in and cover the land. The kanjiu is the Jewel of the Ebb Tide. It rules the sea and its waves and can make even a tidal wave retreat.
        - id: ch05-b10
          speaker: narrator
          text: >-
            Ryn Jin demonstrated the talismans one by one, making sure his friend understood them, and then placed both jewels in his hands. The Happy Hunter was deeply glad to receive the Jewel of the Flood Tide and the Jewel of the Ebb Tide. He knew their power could protect him if enemies ever threatened him. He thanked his generous host again and again, then made ready to depart. Ryn Jin, Tayotama, Tamayori, and every inhabitant of the palace came outside with him so they could say goodbye.
        - id: ch05-b11
          speaker: narrator
          text: >-
            The last goodbyes were still sounding when the Happy Hunter passed beneath the jeweled gate. He went by the well where he had first met the princesses, still standing in the shade of the great katsura trees, and followed the path to the beach. The strange basket that had brought him was gone. In its place waited an enormous crocodile. The Hunter had never seen such a creature. From the tip of its tail to the end of its long mouth, it measured eight fathoms. The Sea King had ordered this monster to carry him back to Japan. Like Shiwozuchino Okina's wondrous basket, it could travel faster than any steamboat. And so, riding on the back of a crocodile, the Happy Hunter crossed the sea and returned to his own land.
    - id: ch06
      title: The Jewels of the Tides
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            As soon as the crocodile brought him ashore, the Happy Hunter hurried to find his elder brother and announce his safe return. He placed in the Skillful Fisher's hands the very hook that had caused so much trouble between them, explaining that it had been found inside Tai's mouth. He earnestly asked his brother to forgive him. Then he told the whole story of his journey beneath the sea, his welcome at Ryn Jin's palace, and the strange chain of adventures that had finally led him to the missing hook.
        - id: ch06-b02
          speaker: narrator
          text: >-
            The Skillful Fisher had never cared only about the hook. He had used it as an excuse to drive his younger brother out of the country. When the Happy Hunter left three years before and did not come back, the elder brother rejoiced in his cruel heart. He immediately took the Hunter's rightful place as ruler and made himself powerful and rich. He enjoyed everything that did not belong to him and hoped his brother would never return to claim his rights. Then, when he least expected it, the Happy Hunter stood alive before him with the lost hook in his hand.
        - id: ch06-b03
          speaker: narrator
          text: >-
            With the true hook returned, the Skillful Fisher could find no further excuse to drive his brother away. He pretended to forgive him, hiding what he truly felt. Inside, he was furious. His old hatred deepened as he saw the Happy Hunter day after day. At last, he could no longer bear the sight of him. He began to plan murder and watched closely for an opportunity to strike.
        - id: ch06-b04
          speaker: narrator
          text: >-
            One day, the Happy Hunter went out walking among the rice fields. The Skillful Fisher saw his chance and followed behind him with a dagger, waiting to kill him where no one could interfere. The Happy Hunter knew his brother was there and understood exactly what he intended to do. This was the hour of danger for which the Sea King's gifts had prepared him. He decided it was time to use the Jewels of the Flood and Ebb Tides and discover whether they truly held the power Ryn Jin had promised.
        - id: ch06-b05
          speaker: narrator
          text: >-
            He drew the Jewel of the Flood Tide from the breast of his robe and raised it to his forehead, just as the Sea King had taught him. Its power answered instantly. Across the rice fields and over the farms, the sea came rolling inland, wave following wave. The water rose until it reached the place where the Skillful Fisher stood with his dagger. He stared in astonishment and terror at the impossible flood. A moment later, the waves swept around him. He struggled helplessly in the water and cried out to his younger brother to save him from drowning.
        - id: ch06-b06
          speaker: skillful_fisher
          text: >-
            Brother, save me! Please don't let me drown!
          emotion: fearful
        - id: ch06-b07
          speaker: narrator
          text: >-
            Even after all his brother had done, the Happy Hunter's heart remained kind. He could not bear to watch the Skillful Fisher suffer in the flood. At once, he lowered the Jewel of the Flood Tide and returned it to his robe. Then he took out the Jewel of the Ebb Tide and held it as high as his forehead. The sea obeyed again. The water ran back and back toward its old shore. Before long, every tossing, rolling wave had vanished. The farms and rice fields emerged, and the ground lay dry just as it had before.
        - id: ch06-b08
          speaker: narrator
          text: >-
            The Skillful Fisher had stood on the edge of death, and the danger left him badly shaken. He was also filled with awe by the wonders he had seen his brother perform. Now he understood that he had made a terrible mistake by setting himself against the younger man he had always looked down upon. The Happy Hunter had returned with such power that the sea itself flowed over the land and ebbed away at his command. If the elder brother continued his hatred, he would bring ruin upon himself.
        - id: ch06-b09
          speaker: narrator
          text: >-
            The Skillful Fisher put aside his pride and humbled himself before the Happy Hunter. He confessed the wrongs he had done and begged his brother to forgive them all. He promised to return the throne and every right he had stolen during those three years. By custom, the younger brother had once owed allegiance to the elder. Now the Skillful Fisher swore that he would reverse their places. He would recognize the Happy Hunter as his superior, obey him, and bow before him as Lord of all Japan.
        - id: ch06-b10
          speaker: skillful_fisher
          text: >-
            Forgive all the wrong I have done. I will give back your rightful place and honor you as my lord.
          emotion: fearful
        - id: ch06-b11
          speaker: happy_hunter
          text: >-
            I will forgive you if you cast all your evil ways into the retreating tide.
        - id: ch06-b12
          speaker: narrator
          text: >-
            The Skillful Fisher promised to cast away his former cruelty just as the sea had withdrawn from the fields. With that promise, peace returned between the two brothers at last. Their long quarrel was finished. This was not another false show of forgiveness like the one he had offered when the hook first came back. From that day forward, the elder brother kept his word. He gave up his evil ways, became a good man, and treated the Happy Hunter with the kindness of a true brother.
        - id: ch06-b13
          speaker: narrator
          text: >-
            The Happy Hunter took his rightful place and ruled his kingdom without any more strife within his family. He could now care for his land without watching for secret anger or an attack from his own elder brother. No jealous brother disturbed him again, and Japan remained at peace for a long, long time. Many treasures filled the ruler's house, but two meant more to him than all the rest. He prized above everything the wondrous Jewel of the Flood Tide and Jewel of the Ebb Tide. They had protected his life, restored peace between the brothers, and always reminded him of his strange journey beneath the sea and of Ryn Jin, the Dragon King, who had welcomed him, helped him recover the hook, and given him those parting gifts.
        - id: ch06-b14
          speaker: narrator
          text: >-
            The lost hook had been found, the stolen kingdom had been restored, and hatred had given way to peace. The two brothers could at last live without anger between them. This is the congratulatory ending of the Happy Hunter and the Skillful Fisher.
