audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    happy_hunter:
      display_name: 快乐的猎人
      tts:
        delivery: 谦和坦荡，危难中仍保持勇气与仁厚
        timbre: 清朗坚定的青年男声
        pace: 平稳
        pitch: 中音
    skillful_fisher:
      display_name: 善渔的渔夫
      tts:
        delivery: 起初暴躁阴沉，悔悟后敬畏而诚恳
        timbre: 低沉有力的成年男声
        pace: 稍快
        pitch: 中低音
    old_man:
      display_name: 盐土老翁
      tts:
        delivery: 神秘安详，指点时从容笃定
        timbre: 苍老温厚的男声
        pace: 舒缓
        pitch: 低音
    tayotama:
      display_name: 丰玉姬
      tts:
        delivery: 端庄亲切，言谈温雅有礼
        timbre: 柔美明亮的年轻女声
        pace: 从容
        pitch: 中高音
    tamayori:
      display_name: 玉依姬
      tts:
        delivery: 甜美真诚，举止谦雅
        timbre: 清甜轻柔的年轻女声
        pace: 平稳
        pitch: 高音
    ryn_jin:
      display_name: 海神龙神
      tts:
        delivery: 威严厚重，待客时热诚宽宏
        timbre: 洪亮浑厚的成年男声
        pace: 从容
        pitch: 低音
    cuttlefish:
      display_name: 乌贼
      tts:
        delivery: 机警爽利，说话直截了当
        timbre: 灵活清晰的声音
        pace: 稍快
        pitch: 中音
    tai:
      display_name: 鲷鱼
      tts:
        delivery: 病痛时虚弱惶恐，脱险后满怀感激
        timbre: 沙哑微弱的声音
        pace: 偏慢
        pitch: 中高音
    bonito:
      display_name: 鲣鱼
      tts:
        delivery: 恭谨认真，随众应答时清楚整齐
        timbre: 明快的声音
        pace: 平稳
        pitch: 中音
    eel:
      display_name: 鳗鱼
      tts:
        delivery: 谨慎恭顺，随众应答时沉稳
        timbre: 柔和低沉的声音
        pace: 平稳
        pitch: 中低音
  chapters:
    - id: ch01
      title: 交换营生
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，日本由火远理命统治。他是太阳女神天照大神的第四代子孙，不但像先祖一样容貌出众，还十分强健勇敢。他的狩猎本领无人能及，是全国闻名的第一猎手。正因如此，人们便叫他山幸彦，也就是山中的快乐猎人。
        - id: ch01-b02
          speaker: narrator
          text: 火远理命的哥哥也是个了不起的人。他捕鱼的本领远胜所有对手，人称海幸彦，也就是海上的善渔者。兄弟俩各自做着最喜爱的营生。弟弟带着弓箭进山打猎，哥哥拿着钓竿下海捕鱼，谁也不打扰谁。日子就这样过得又快活，又顺遂。
        - id: ch01-b03
          speaker: narrator
          text: 一天，快乐的猎人来找哥哥，提出了一个主意。
        - id: ch01-b04
          speaker: happy_hunter
          text: 哥哥，你每天拿着钓竿出海，回来总带着许多鱼。我每天带上弓箭，翻山越谷追捕野兽。咱们做各自喜欢的事已经很久，大概都厌了。不如换一换？你去山里打猎，我到海上钓鱼。
        - id: ch01-b05
          speaker: narrator
          text: 善渔的渔夫默默听着，想了一会儿，答应了。
        - id: ch01-b06
          speaker: skillful_fisher
          text: 好啊，这个主意不坏。把弓箭给我，我马上进山找猎物。
        - id: ch01-b07
          speaker: narrator
          text: 兄弟俩就这样交换了工具，各自出发，去试对方的营生。谁也没料到，这个看起来新鲜的主意会惹出多少麻烦。这样交换实在不够明智。快乐的猎人根本不会钓鱼，脾气暴躁的哥哥对打猎也同样一窍不通。
        - id: ch01-b08
          speaker: narrator
          text: 快乐的猎人拿着哥哥最珍爱的鱼钩和钓竿，来到海边，在岩石上坐下。他笨手笨脚地装好鱼饵，把钩甩进海里，眼巴巴看着小浮子在水面一起一伏，只盼有条大鱼上钩。浮子每稍微一动，他就赶忙提竿，可拉上来的永远只有鱼钩和鱼饵，连一条小鱼也没有。若懂得垂钓，他本来可以满载而归。他虽然是全国第一的猎手，一拿起钓竿，却成了最不中用的渔夫。
        - id: ch01-b09
          speaker: narrator
          text: 他握着钓竿，在岩石上枯坐了一整天，一条鱼也没钓着。天色越来越暗，黄昏已经到了。他打算回家，最后一次收起钓线，才发现鱼钩不见了，连什么时候掉的都不知道。他顿时焦急万分。那是哥哥唯一的鱼钩，哥哥看得比什么都珍贵，要是知道被他弄丢了，一定会大发雷霆。他赶紧在岩缝和沙滩上来回寻找。
        - id: ch01-b10
          speaker: narrator
          text: 这时，哥哥空着手从山里回来了。他没打到猎物，本来就在生气，一看弟弟四处翻找，马上知道出了岔子。
        - id: ch01-b11
          speaker: skillful_fisher
          text: 弟弟，你在找什么？
        - id: ch01-b12
          speaker: happy_hunter
          text: 哥哥，我把事情办糟了。
        - id: ch01-b13
          speaker: skillful_fisher
          text: 到底出了什么事？
        - id: ch01-b14
          speaker: happy_hunter
          text: 我把你最珍爱的鱼钩弄丢了……
        - id: ch01-b15
          speaker: narrator
          text: 话没说完，哥哥便厉声打断了他。
        - id: ch01-b16
          speaker: skillful_fisher
          text: 你把我的鱼钩弄丢了！我早知道会这样。你提议交换时，我本来就不赞成，是你非要这么做，我才让了步。现在知道去做自己不会的事会有什么下场了吧？找不回那枚鱼钩，我就不还你的弓箭。快去把它找回来！
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: 快乐的猎人认定错在自己，便谦卑耐心地忍下哥哥轻蔑的斥骂。他尽心竭力，到处细细寻找，却始终一无所获，最后不得不死了心。他绝望地回到家，把自己心爱的宝剑敲成碎片，打成整整五百枚鱼钩，送去向哥哥赔罪。他求哥哥用这些鱼钩代替丢失的那枚，可哥哥连听都不肯听。于是他又做了五百枚，再去恳求宽恕。
        - id: ch01-b18
          speaker: skillful_fisher
          text: 哪怕你做出一百万枚，对我也没有用。除非把原来那一枚拿回来，否则我绝不原谅你。
        - id: ch01-b19
          speaker: narrator
          text: 善渔的渔夫天性乖戾，一向嫉恨弟弟的美德，无论如何也不肯息怒。他正想借鱼钩的事杀掉弟弟，夺走日本统治者的位置。快乐的猎人把这一切看得清清楚楚，却因为自己年幼，按长幼之序只能服从兄长，什么也不能说。他又回到海边，继续寻找那枚鱼钩。可这时候，他已经不抱希望，心情低落极了。
    - id: ch02
      title: 盐土老翁与海底之路
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 快乐的猎人站在沙滩上，正茫然不知所措，一位手持拐杖的老人忽然向他走来。后来他再回想，也记不起老人从哪里出现，只知道自己一抬头，那个人便已经在那里了。
        - id: ch02-b02
          speaker: old_man
          text: 您是火远理命，也就是快乐的猎人吧？怎么一个人待在这里？
        - id: ch02-b03
          speaker: happy_hunter
          text: 正是我。我钓鱼时弄丢了哥哥珍爱的鱼钩，已经找遍整片海岸，还是没有踪影。哥哥说，不把鱼钩还回去，就绝不原谅我。我实在焦急。请问您是谁？
        - id: ch02-b04
          speaker: old_man
          text: 我叫盐土老翁，就住在这附近。听说你的遭遇，我也替你难过。不过，那鱼钩并不在岸上。它不是沉进海底，就是让某条鱼吞进了肚子。你就算在这里找上一辈子，也不会找到。
        - id: ch02-b05
          speaker: happy_hunter
          text: 那我还能怎么办呢？
        - id: ch02-b06
          speaker: old_man
          text: 下到龙宫去，把难处告诉海神龙神，请他替你寻找。这才是最好的办法。
        - id: ch02-b07
          speaker: happy_hunter
          text: 这主意好极了。可我听说海神的国度在大海最深处，我怎么去得了呢？
        - id: ch02-b08
          speaker: old_man
          text: 这并不难。我给你造一样东西，你骑着它就能穿过大海。
        - id: ch02-b09
          speaker: happy_hunter
          text: 若蒙您这样相助，我一定感激不尽。
        - id: ch02-b10
          speaker: narrator
          text: 老人立刻动手，很快编成一只篮子，交给快乐的猎人。年轻人欢喜地接过来，把它放进水中，自己坐进去准备启程。他向这位给了自己莫大帮助的老人告别，还答应等找回鱼钩，不再惧怕哥哥的怒火，平安返回日本以后，一定前来报答。老人给他指明方向，又细细说清怎样抵达龙宫，随后站在岸边，看着那只小船似的篮子驶向海上。
        - id: ch02-b11
          speaker: narrator
          text: 快乐的猎人坐着朋友送的篮子，尽力赶路。可他很快发现，这艘古怪的小船仿佛会自行破浪前进，路程也比想象中短得多。只过了几个钟头，他就看见海神宫殿的大门与屋顶。数不清的斜屋顶和山墙层层相叠，高大门楼耸立在灰色石墙之间。他登上岸，把篮子留在海滩，向大门走去。门柱由美丽的红珊瑚制成，门扇镶满各色闪亮的宝石，高大的桂树投下浓荫。过去听过的所有海底奇闻，都不及眼前景象的万分之一。
        - id: ch02-b12
          speaker: narrator
          text: 快乐的猎人很想立刻进去，可宫门紧闭，四下无人，根本找不到谁来开门。他停下来想办法，看见门前树荫下有一口井，里面盛满清冽的泉水。他猜想，这里总会有人出来打水，便爬上井边的树，坐在枝桠上休息等候。不久，巨门缓缓打开，两位美丽的女子提着金桶走出来。他一直以为海底龙王的国度住满了龙和别的可怕怪物，没想到会在这里见到两位在人间也极罕见的美丽公主。
        - id: ch02-b13
          speaker: narrator
          text: 快乐的猎人没有出声，只隔着树叶静静看她们要做什么。两人穿着曳地长衣，步子缓慢又优雅，手里各提着一只金桶。她们来到桂树荫下的井边，完全没发现枝叶深处藏着陌生人。俯身放下金桶时，两人忽然从幽深平静的水面上看见一张英俊少年的脸，正从头顶的树枝间望着自己。她们从没见过凡间男子，吓得提起桶连忙退开。可好奇心很快给了她们勇气。她们胆怯地抬头寻找倒影的来处，这才看见快乐的猎人坐在树上。双方惊奇地对望，两位姑娘连一句话也说不出来。
        - id: ch02-b14
          speaker: narrator
          text: 眼看自己已经被发现，火远理命轻盈地跃下树来。
        - id: ch02-b15
          speaker: happy_hunter
          text: 我是远道而来的旅人，口渴得厉害，便来井边找水，可这里没有可以打水的桶。我只好爬到树上等人。正急得难受，两位尊贵的姑娘就来了。请你们发发慈悲，给这个流落异乡的旅人一杯水吧。
        - id: ch02-b16
          speaker: narrator
          text: 他举止庄重，言语温雅，两位姑娘便不再害怕。她们默默行了一礼，重新来到井边，用金桶汲起泉水，倒进一只镶着宝石的杯子，递给陌生人。快乐的猎人双手接过，把杯子恭敬又欣喜地举到额前。一路上实在渴得厉害，他一口气喝尽了水，才把杯子放到井沿。接着，他抽出短剑，从垂在胸前的项链上割下一枚奇特的弯玉，放进杯里，又深深鞠了一躬，将杯子还给她们。
        - id: ch02-b17
          speaker: happy_hunter
          text: 这枚弯玉，算是我谢过二位的一点心意。
        - id: ch02-b18
          speaker: narrator
          text: 两位姑娘低头一看，杯底竟躺着一枚美丽的宝玉，不由得吃了一惊。
        - id: ch02-b19
          speaker: tayotama
          text: 平凡人绝不会这样随手送出宝玉。能否请您告诉我们，您究竟是谁？
        - id: ch02-b20
          speaker: happy_hunter
          text: 我是第四代命尊火远理，在日本，人们也叫我快乐的猎人。
        - id: ch02-b21
          speaker: tayotama
          text: 您真是太阳女神天照大神的后裔火远理命？我是海神龙神的长女，丰玉姬。
        - id: ch02-b22
          speaker: tamayori
          text: 我是她的妹妹玉依姬。
    - id: ch03
      title: 海神宫殿的贵客
      blocks:
        - id: ch03-b01
          speaker: happy_hunter
          text: 原来二位是海神的女儿，能遇见你们，我实在太欢喜了。前些天，我拿哥哥的鱼钩去钓鱼，不知怎么竟弄丢了。那是他所有财物中最珍爱的东西。对我来说，再没有比这更大的灾祸。找不回来，他就永远不会原谅我，现在他还在为我的过错发怒。我沿着海岸找了一次又一次，怎么也不见鱼钩，心里实在愁苦。后来，我在寻找时遇见一位智慧的老人。他叫我来到龙宫，请海神龙神相助，还亲自告诉我怎样到这里。二位现在明白我为何前来了。能否带我去见令尊，请他替我找找那枚鱼钩？你们觉得，他肯见我吗？
        - id: ch03-b02
          speaker: tayotama
          text: 要见父王并不难，他一定会为您的到来而欢喜。天照大神的高贵后裔亲临海底，他只会觉得这是天大的福分。玉依姬，你说是不是？
        - id: ch03-b03
          speaker: tamayori
          text: 姐姐说得对。能迎接命尊来到家中，是我们最大的荣耀。
        - id: ch03-b04
          speaker: happy_hunter
          text: 那就请二位为我引路吧。
        - id: ch03-b05
          speakers: [tayotama, tamayori]
          ensemble: duo
          text: 恭请命尊入内。
        - id: ch03-b06
          speaker: narrator
          text: 姐妹俩深深行礼，领他走进宫门。玉依姬把客人交给姐姐照料，自己加快脚步，抢先赶回海神宫殿。她一路跑进父王的房间，把门前发生的事一一禀报，又说姐姐正领着命尊前来。凡人极少来到海神宫殿，也许几百年才有一次，龙神听了这个消息，大为惊讶。
        - id: ch03-b07
          speaker: narrator
          text: 龙神立刻拍手，召集所有朝臣、宫中侍从和海里的鱼族首领。他郑重告诉大家，太阳女神天照大神的后裔即将来到宫殿，每个人都要以最隆重的礼节服侍这位尊贵客人。接着，龙神换上正式礼服，亲自到宫门迎接。丰玉姬与快乐的猎人到来时，海神夫妇伏地行礼，感谢他屈尊到访。龙神又把客人领进厅堂，请他坐上最尊贵的上座，自己恭敬地站在他面前。
        - id: ch03-b08
          speaker: ryn_jin
          text: 我是海神龙神，这位是我的妻子。还请命尊永远不要忘记我们。
        - id: ch03-b09
          speaker: happy_hunter
          text: 原来您就是我久仰大名的海神龙神。我突然来访，给您添了麻烦，实在过意不去。
        - id: ch03-b10
          speaker: ryn_jin
          text: 命尊不必谢我。您肯光临，应该是我向您道谢。海宫虽然简陋，若您愿意多住些日子，那是我无上的荣幸。
        - id: ch03-b11
          speaker: narrator
          text: 海神与快乐的猎人相见甚欢，坐在一起谈了很久。龙神一拍手，一大队鱼族随从便穿着礼服出现，鳍上托着各式各样的餐盘，上面摆满海中珍馐。一场盛宴就这样铺在国王与贵客面前。侍宴的全是大海里最上等的鱼，那奇妙的阵容，在人间根本无法见到。宫里每个人都拿出最好的本领款待，让快乐的猎人明白，自己在这里是何等尊贵的客人。
        - id: ch03-b12
          speaker: narrator
          text: 盛宴延续了好几个钟头。席间，龙神请两个女儿奏乐。丰玉姬和玉依姬便来到众人面前，弹奏日本琴，又轮流唱歌起舞。时光过得太愉快了，快乐的猎人几乎忘了自己的烦恼，也忘记了来到海神国度的缘故，只顾尽情领略这个奇妙的鱼仙之乡。世上还有谁听说过这样的地方呢？不过，他最后还是想起了此行的目的。
        - id: ch03-b13
          speaker: happy_hunter
          text: 龙神大王，令爱或许已经说过，我来这里，是为了找回哥哥的鱼钩。能否请您问问所有臣民，看谁见过那枚落进海里的鱼钩？
        - id: ch03-b14
          speaker: ryn_jin
          text: 当然可以。我马上把大家都召来问个清楚。
    - id: ch04
      title: 鲷鱼喉咙里的鱼钩
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 海神的命令刚一传出，章鱼、乌贼、鲣鱼、牛尾鱼、鳗鱼、水母、虾、鲽鱼，还有许许多多别的鱼，便全都赶来。它们在龙神面前依次坐好，排得整整齐齐，连一双双鳍也全都安分地收在身旁，等待国王问话。
        - id: ch04-b02
          speaker: ryn_jin
          text: 坐在你们眼前的贵客，是天照大神的尊贵后裔，第四代命尊火远理，也就是山中的快乐猎人。前些天，他在日本海岸钓鱼时，有谁拿走了他哥哥的鱼钩。他不远万里来到海底王国，因为他想，也许是你们中的一位淘气，跟他开了这个恶作剧。谁拿了鱼钩，必须马上交还。谁知道是哪个家伙做的，也要立刻说出它的名字，还有它现在躲在哪里。
        - id: ch04-b03
          speaker: narrator
          text: 鱼群听了大吃一惊，半晌说不出话，只管彼此对望。最后，乌贼走上前来。
        - id: ch04-b04
          speaker: cuttlefish
          text: 我想，偷走鱼钩的一定是鲷鱼。
        - id: ch04-b05
          speaker: ryn_jin
          text: 你凭什么这样说？
        - id: ch04-b06
          speaker: cuttlefish
          text: 从昨晚起，鲷鱼什么也吃不下，喉咙还疼得厉害。那枚鱼钩很可能就卡在那里。您最好马上派人叫它过来。
        - id: ch04-b07
          speakers: [cuttlefish, bonito, eel]
          ensemble: chorus
          text: 大家都奉召而来，只有鲷鱼没有出现，确实奇怪。请您把它召来问清楚，我们也好证明自己的清白。
        - id: ch04-b08
          speaker: ryn_jin
          text: 不错，它本该最先赶到，却偏偏没来。马上去叫鲷鱼！
        - id: ch04-b09
          speaker: narrator
          text: 其实，还没等国王下令，乌贼早已动身去了鲷鱼家。它很快带着鲷鱼回来，将它领到国王面前。鲷鱼坐在那里，又害怕又虚弱，显然正受着很大的痛苦。它平日鲜红的脸已经发白，双眼几乎完全闭上，看起来只有平常一半大小。
        - id: ch04-b10
          speaker: ryn_jin
          text: 鲷鱼，今天听见召唤，你为什么没有前来？
        - id: ch04-b11
          speaker: tai
          text: 我从昨天起就病了，实在没法过来。
        - id: ch04-b12
          speaker: ryn_jin
          text: 不必再说！你偷了命尊的鱼钩，这场病正是神明给你的惩罚。
          emotion: angry
        - id: ch04-b13
          speaker: tai
          text: 确实是那枚鱼钩。它还卡在我喉咙里，怎么也取不出来。我吃不下东西，连气都喘不过来，随时都像要被噎死，疼起来更是受不了。可我绝不是存心偷鱼钩。我看见水里的鱼饵，一时大意咬了下去，鱼钩脱落后就扎进了喉咙。求您原谅我。
          emotion: fearful
        - id: ch04-b14
          speaker: cuttlefish
          text: 果然被我猜中了。鱼钩还在它喉咙里。我愿意当着命尊的面拔出来，再完完整整地交还给他。
        - id: ch04-b15
          speaker: tai
          text: 求你快一点，把它取出来吧！我真想赶紧把鱼钩还给命尊。
          emotion: fearful
        - id: ch04-b16
          speaker: cuttlefish
          text: 好，鲷鱼老兄，把嘴张到最大。
        - id: ch04-b17
          speaker: narrator
          text: 乌贼让鲷鱼把嘴尽量张大，把一条触腕慢慢伸进它的喉咙。没过多久，它便轻轻松松地从那张大嘴里拔出了鱼钩。乌贼仔细将鱼钩洗净，送到国王面前。龙神从臣民手里接过来，恭恭敬敬地还给快乐的猎人。鱼群都称他为命尊。找回苦苦寻觅的鱼钩，快乐的猎人喜不自胜。他满面感激，再三向龙神道谢，还说，此行能有圆满结局，全仰仗海神的贤明、权威与仁厚。
        - id: ch04-b18
          speaker: narrator
          text: 龙神随即要惩罚鲷鱼，快乐的猎人却开口替它求情。既然遗失的鱼钩已经顺利找回，他不愿再给可怜的鲷鱼增添苦难。鱼钩的确是鲷鱼咬走的，可若这也算过错，它所受的折磨也早已足够。毕竟，它只是看见鱼饵，出于天性咬了一口。那是一时大意，并非有意偷窃，更没有存心要为难任何人。
        - id: ch04-b19
          speaker: happy_hunter
          text: 真正该受责怪的是我。我要是懂得钓鱼，本来不会丢掉鱼钩。所有麻烦，都是因为我硬去做自己不会的事。请您宽恕鲷鱼吧。
        - id: ch04-b20
          speaker: narrator
          text: 面对这样明智又慈悲的裁断，谁能拒绝他的请求呢？龙神听从尊贵客人的劝说，立刻赦免了自己的臣民。鲷鱼欢喜得不停摆动双鳍，其他鱼也都放下心来。随后，它们一同退出国王面前，一路赞颂快乐猎人的仁厚与美德。
    - id: ch05
      title: 潮汐宝珠
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 鱼钩已经寻回，快乐的猎人在龙宫再没有必须完成的事情。他急着返回自己的国度，把鱼钩交还哥哥，再设法与盛怒的哥哥重归于好。可海神已经深深爱上这个年轻人，把他看得像亲生儿子一样，求他别那么快离开，只管把海宫当成自己的家，想住多久都可以。快乐的猎人还在犹豫，丰玉姬和玉依姬也来了。她们行着最优雅的礼，用最甜美的声音一同挽留。若再说不，就显得太不领情，他只好继续住下去。
        - id: ch05-b02
          speaker: narrator
          text: 海国与人间的昼夜并无不同，三年光阴却在欢乐中转眼过去。人若真正快活，岁月总是走得飞快。仙境里的奇观每天都像崭新的一样，海神的情意也没有随着时间变淡，反而越来越深。可是快乐的猎人一天比一天思念故乡。他不断牵挂自己的家园、国家和哥哥，急着知道离开的这些年里，那里究竟发生了什么。终于，他再也无法安心留下。
        - id: ch05-b03
          speaker: happy_hunter
          text: 在您这里的日子，是我一生中最快乐的时光。您赐给我的所有恩情，我永远不会忘。可是我治理着日本，身上还有对国家的责任。这里纵然美好，我也不能永远离开自己的国土。我还得把鱼钩交还哥哥，请他原谅我这么久都没能归还。要与您和宫中众人分别，我实在十分不舍，但这一次非走不可。请准许我今天告辞，也请放弃继续挽留我的念头。希望将来有一天，我还能回到海底，再来拜访您。
        - id: ch05-b04
          speaker: narrator
          text: 一想到要失去这位为海宫带来无限欢乐的朋友，龙神悲从中来，眼泪不断落下。
        - id: ch05-b05
          speaker: ryn_jin
          text: 命尊，我们实在舍不得您。您是一位高贵又尊荣的客人，给海神宫殿带来了许多欢乐，我们始终诚心诚意地欢迎您。不过，您既然治理日本，就应该回到那里，而不是一直留在海底。我们再想挽留，也不能耽误您的责任。我只希望您离开以后，千万别忘记我们。奇妙的缘分使陆地与海洋相识，又让彼此结下友谊。但愿这份情谊长久不衰，而且一天比一天深厚。
          emotion: sad
        - id: ch05-b06
          speaker: narrator
          text: 海神说完，转向两个女儿，吩咐她们取来大海的两枚潮汐宝珠。两位公主深深行礼，起身轻盈地退出大厅。没过多久，她们便回来了，每个人都用双手捧着一枚闪闪发光的宝珠。两枚宝珠的光辉照满整座大厅，快乐的猎人目不转睛地望着，却猜不出它们是什么。
        - id: ch05-b07
          speaker: ryn_jin
          text: 这两件珍贵的法宝，是我们从远古祖先那里继承的。现在，我把它们送给您，作为临别的礼物，也是我们情意的信物。一枚叫满珠，一枚叫干珠。
        - id: ch05-b08
          speaker: happy_hunter
          text: 您待我的恩情，我怎么谢也谢不完。能否请您再告诉我，这两枚宝珠各有什么用，又该怎样使用？
        - id: ch05-b09
          speaker: ryn_jin
          text: 满珠又叫涨潮珠。谁拿着它，谁就能随时召来海水，淹没大地。干珠又叫退潮珠，它能号令大海和波浪，哪怕汹涌的海啸，也会奉命退去。
        - id: ch05-b10
          speaker: narrator
          text: 龙神逐一示范两件法宝的用法，再亲手把它们交给朋友。有了涨潮珠和退潮珠，快乐的猎人十分欣喜。他知道，今后无论什么时候遇上敌人，这两枚宝珠都能保护自己。他一次又一次谢过仁厚的主人，这才准备启程。海神、丰玉姬、玉依姬和宫里所有人都出来向他道别。最后一声珍重还没消散，他已经从大门下走过，又经过桂树荫下那口满载美好回忆的井，一路来到了海滩。
        - id: ch05-b11
          speaker: narrator
          text: 来时乘坐的奇异篮子不见了，海边却有一条巨大的鳄鱼在等他。快乐的猎人从没见过这样庞大的动物，从尾尖到长嘴的尽头，足足有八寻。原来，这是海神特意派来送他返回日本的坐骑。它和盐土老翁造出的神奇篮子一样，游得比任何汽船都快。于是，快乐的猎人骑上鳄鱼背，用这样奇特的方式穿过大海，回到了自己的国土。
    - id: ch06
      title: 涨潮与退潮
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 鳄鱼刚把他送上岸，快乐的猎人便急忙赶去告诉哥哥，自己已经平安归来。他交还了那枚从鲷鱼口中取出、也给兄弟俩带来无数麻烦的鱼钩，诚恳请求哥哥宽恕。他又把海神宫殿里发生的一切，以及自己经历了怎样不可思议的冒险，才终于找回鱼钩，从头到尾说了一遍。
        - id: ch06-b02
          speaker: narrator
          text: 原来，善渔的渔夫只是拿遗失鱼钩当借口，想把弟弟赶出国土。三年前，弟弟离开以后一直没有回来，他那颗邪恶的心欢喜极了。他立刻篡夺了弟弟的统治之位，从此权势日盛，财富越来越多。他正享用着不属于自己的东西，一心盼着弟弟永远别回来索取本来的权利。谁知道，就在他毫无准备的时候，快乐的猎人竟又站在了面前。
        - id: ch06-b03
          speaker: narrator
          text: 如今鱼钩已经归还，善渔的渔夫再没有借口把弟弟赶走，只得装出宽宏的样子，假装已经原谅。可他心里其实怒火中烧，对弟弟越来越憎恨。日子一天天过去，他终于连每天看见弟弟都无法忍受，于是暗中谋划，仔细等待一个下手的机会，非要把弟弟杀死不可。
        - id: ch06-b04
          speaker: narrator
          text: 一天，快乐的猎人正在稻田里行走，哥哥拿着一把短刀，悄悄跟在后面。快乐的猎人知道，哥哥这一次跟来，就是为了杀死自己。生死关头已经到了，现在正是取出涨潮珠和退潮珠的时候。他也要亲眼看看，海神告诉他的神力，究竟是真是假。
        - id: ch06-b05
          speaker: narrator
          text: 快乐的猎人从衣襟里取出涨潮珠，高高举到额前。霎时间，海水便一浪接一浪地涌来，滚过田野，也冲过农庄，一直逼到哥哥站立的地方。善渔的渔夫眼看四周忽然成了一片汪洋，惊得呆住了，也害怕到了极点。只过了一会儿，他已经在水中拼命挣扎，高声呼喊弟弟救命，求弟弟别让自己活活淹死。
        - id: ch06-b06
          speaker: narrator
          text: 快乐的猎人心地仁慈，实在不忍看哥哥在水中受苦。他马上把涨潮珠收回衣襟，又取出退潮珠，同样举到额前。宝珠刚刚举起，海水便不断向后退去，越退越远。没过多久，刚才还翻滚奔腾的洪流就消失得无影无踪，农庄、田野和干燥的土地，全都像先前一样重新显露出来。
        - id: ch06-b07
          speaker: narrator
          text: 善渔的渔夫刚从死亡边缘回来，早已吓得魂不附体。弟弟展现的神奇力量，更让他震撼不已。他终于明白，自己一直以来都犯了一个足以送命的错误。这个弟弟早已不是他以为的那个人，如今只要一声令下，便能叫海水涨落。继续与他为敌，只会送掉自己的性命。于是，哥哥在快乐的猎人面前低下头，请求弟弟宽恕从前的一切罪过。
        - id: ch06-b08
          speaker: skillful_fisher
          text: 弟弟，请原谅我过去对你做过的一切。我会把本来属于你的权位全都归还。虽然你年纪比我小，按长幼之序，本该听从我这个哥哥，可从今以后，我愿意尊你为上。我会把你当作自己的君主，向你这位全日本的统治者俯首称臣，再也不与你为敌。
        - id: ch06-b09
          speaker: happy_hunter
          text: 只要你愿意把心里所有的恶念，都抛进正在退去的潮水，我就原谅你。
        - id: ch06-b10
          speaker: narrator
          text: 善渔的渔夫答应了。他愿意把从前的恶念和恶行，全都随着退去的潮水抛得远远的。兄弟俩之间的争斗终于结束，重新有了和平。从那以后，哥哥果真信守承诺，再也不谋害弟弟。他慢慢变成了一个善良的人，也成了一个仁厚的哥哥。
        - id: ch06-b11
          speaker: narrator
          text: 快乐的猎人重新安稳地治理自己的国家，再也没有受到手足纷争的搅扰。兄弟之间有了和平，日本也因此享受了很久很久的太平。后来，他的家中收藏了许多珍贵的宝物，可无论别的宝物多么稀有，在所有宝藏里，他最珍爱的，始终是海神龙神临别时赠给他的涨潮珠与退潮珠。他也始终记得，那是陆地与海洋之间深厚情谊的信物。
        - id: ch06-b12
          speaker: narrator
          text: 快乐的猎人与善渔的渔夫的故事，到这里便喜庆圆满地结束了。
