  chapters:
    - id: ch01
      title: The Dumpling and the Seed
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long, long ago, on a bright autumn day in Japan, a pink-faced monkey and a yellow crab played together beside a river. As they ran about, the crab found a rice dumpling, while the monkey found a persimmon seed.
        - id: ch01-b02
          speaker: crab
          text: >-
            What a lovely rice dumpling! I found it right here.
        - id: ch01-b03
          speaker: monkey
          text: >-
            Well, I've got a fine thing of my own. Take a look!
        - id: ch01-b04
          speaker: narrator
          text: >-
            The monkey was always very fond of persimmons, but the seed itself was no use to him. It was hard as a stone and could not be eaten. Greedy and jealous of the crab's lovely dumpling, he suggested that they trade. The crab naturally saw no reason to give up his prize for a hard, stone-like seed, so he refused.
        - id: ch01-b05
          speaker: monkey
          text: >-
            You aren't thinking ahead at all. You can eat your rice dumpling now, and yes, it's much bigger than my seed. But once it's eaten, it's gone. Plant this seed in the ground, and in a few years it will grow into a great tree. Then, year after year, its branches will be full of fine, ripe persimmons. If only I could show you that tree now, with all its yellow fruit hanging down! Of course, if you don't believe me, I'll plant it myself. But later on, I'm sure you'll be sorry you ignored my advice.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The simple crab could not resist such clever persuasion. At last he gave in and agreed to the exchange. The greedy monkey quickly gobbled down the dumpling, though he handed over the seed with great reluctance. He would have liked to keep that as well. But he was afraid of angering the crab and getting pinched by those sharp, scissor-like claws.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Then they parted. The monkey went home among the forest trees, and the crab returned to his stones beside the river. As soon as he arrived, the crab planted the persimmon seed, just as the monkey had told him.
    - id: ch02
      title: The Persimmon Tree
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The next spring, the crab was delighted when a young shoot pushed through the earth. The tree grew larger each year. One spring it finally blossomed, and by the following autumn it carried fine, large persimmons.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The fruit hung among broad green leaves like golden balls, deepening to orange as it ripened. Day after day, the little crab sat in the sun. He stretched out his long eyes like a snail putting out its horns and watched the persimmons grow perfect.
        - id: ch02-b03
          speaker: crab
          text: >-
            Oh, how good they'll taste!
          emotion: happy
        - id: ch02-b04
          speaker: narrator
          text: >-
            At last the crab was sure the fruit was ripe, and he longed to taste one. Again and again he tried to climb the tree, hoping to reach the beautiful persimmons above. Every attempt failed. A crab's legs are wonderfully good at running over earth and stones, but they are not made for climbing trees.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Then he remembered his old playmate. No one could climb better than the monkey. The crab decided to ask for help and set off to find him.
        - id: ch02-b06
          speaker: narrator
          text: >-
            He scuttled up the stony riverbank, followed the paths into the shadowy forest, and found the monkey asleep in his favorite pine. The monkey's tail was curled tightly around a branch so he would not fall while dreaming.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The crab called up, and the monkey was soon wide awake. He listened eagerly as the crab explained that the seed traded long ago for a rice dumpling had become a tree and now carried good fruit. The news delighted him. Even before the crab had finished, the monkey was forming a cunning plan to take all the persimmons for himself.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The monkey readily agreed to go with the crab and pick the fruit for him. When they reached the riverbank, even the monkey was amazed by what he saw. That one small seed had grown into a splendid tree, and every branch seemed loaded with ripe persimmons.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Up the monkey went. He began picking and eating as fast as he could, one persimmon after another. Each time, he chose the finest and ripest fruit he could find. He kept eating until he could hold no more. Not once did he offer anything to the poor, hungry crab waiting below. By the time he stopped, almost all that remained was hard and green.
        - id: ch02-b10
          speaker: narrator
          text: >-
            The crab had waited patiently for years while the tree grew and its fruit ripened. Now, just when he expected to taste his first persimmon, he could only watch the monkey devour every good one. Bitterly disappointed, he ran around and around the trunk. Again and again, he called up and begged the monkey to remember his promise.
        - id: ch02-b11
          speaker: narrator
          text: >-
            At first the monkey ignored him. Then he chose the hardest, greenest persimmon on the tree and hurled it at the crab's head. An unripe persimmon is as hard as stone. It struck the crab and hurt him terribly.
        - id: ch02-b12
          speaker: narrator
          text: >-
            The monkey tore off more hard persimmons and threw them as fast as he could pick them. Again and again they struck the defenseless crab, until he fell dead, wounded all over his body. It was a pitiful sight. There he lay at the foot of the very tree he had planted and tended.
        - id: ch02-b13
          speaker: narrator
          text: >-
            When the wicked monkey saw that he had killed the crab, fear took hold of him. Trembling like the coward he was, he fled as fast as he could.
    - id: ch03
      title: The Young Crab's Resolve
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The crab had a son who had been playing with a friend not far from the place where this terrible deed occurred. On his way home, the young crab came upon his father lying dead. His father's head was crushed, his shell was broken in several places, and the deadly green persimmons lay scattered around his body. At such a dreadful sight, the poor young crab could do nothing but sit down and weep.
        - id: ch03-b02
          speaker: narrator
          text: >-
            After he had wept for some time, the young crab told himself that crying could do no good. His father had been murdered. It was his duty to avenge that death, and he made up his mind to do it. He wiped away his tears, looked around carefully, and searched for some clue that would reveal the killer.
        - id: ch03-b03
          speaker: narrator
          text: >-
            He looked up and saw that the best fruit was gone. Bits of peel and many seeds covered the ground, along with the unripe persimmons thrown at his father. Then he understood. The monkey had done it.
        - id: ch03-b04
          speaker: narrator
          text: >-
            His father had once told him the whole story of the rice dumpling and the persimmon seed. Now all those peels and seeds made sense. The young crab also knew that monkeys loved persimmons more than any other fruit. He felt sure that the monkey had wanted the fruit so badly that his greed had led to the old crab's death.
        - id: ch03-b05
          speaker: narrator
          text: >-
            At first, rage burned so fiercely in him that he wanted to rush off and attack the monkey at once. Then he forced himself to think again. Such an attack would be useless. The monkey was old, strong, and cunning, and the young crab could never defeat him alone. He would have to answer cunning with cunning. To do that, he must ask his friends for help.
        - id: ch03-b06
          speaker: narrator
          text: >-
            He went at once to see Mortar, an old friend of his father. Through his tears, the young crab told him everything and begged for help in avenging the murder.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Mortar was deeply sorry to hear the woeful tale. He immediately promised to help the young crab punish the monkey for the murder. Still, Mortar warned him that every step must be taken with great care. Their enemy was not only cunning. He was strong as well.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Mortar sent for two more of the old crab's friends, Bee and Chestnut, so they could all consult together. The pair arrived in a short time. They listened while the young crab told every detail of his father's death and the monkey's greed and wickedness. When he had finished, Bee and Chestnut both gladly agreed to help him take revenge.
        - id: ch03-b09
          speaker: narrator
          text: >-
            The friends talked for a long time about how to carry out their plan. Then they separated, and Mortar went home with the young crab to help bury his poor father.
    - id: ch04
      title: The Monkey Is Deceived
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Meanwhile, the monkey congratulated himself, as wicked creatures often do before punishment catches them. He was proud of how neatly he had managed everything. First he had robbed his friend of every ripe persimmon, and then he had killed him. Yet no matter how hard the monkey smiled, he could not entirely drive away his fear of being discovered.
        - id: ch04-b02
          speaker: narrator
          text: >-
            If the truth came out, he knew the crab's family would hate him and seek revenge. Again and again, the monkey told himself that discovery was impossible. He had escaped without being seen, so how could anyone accuse him? Even so, fear kept him inside his home for several days.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Before long, hiding became unbearable. The monkey was used to roaming freely through the woods, and life shut up at home was terribly dull.
        - id: ch04-b04
          speaker: monkey
          text: >-
            No one knows I killed the crab! I'm sure the old creature was dead before I left. A dead crab can't speak, so who could name me as the murderer? No one knows a thing. Why stay in here worrying? What's done is done.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The monkey wandered into the crab settlement. He crept as slyly as he could around the crab's house and listened for the neighbors' gossip. The old crab had been chief of the tribe, and the monkey wanted to learn what everyone was saying about his death.
        - id: ch04-b06
          speaker: narrator
          text: >-
            He heard nothing.
        - id: ch04-b07
          speaker: monkey
          text: >-
            They're all fools. They don't know who murdered their chief, and they don't even care!
        - id: ch04-b08
          speaker: narrator
          text: >-
            For all his so-called monkey wisdom, he never guessed that this silence was part of the young crab's plan. The son was deliberately pretending not to know who had killed his father. He also let everyone believe the old crab had somehow caused his own death. By seeming unconcerned, the young crab could keep his plan for revenge completely secret from the monkey.
        - id: ch04-b09
          speaker: narrator
          text: >-
            The monkey returned from his walk perfectly content. Now, he told himself, there was nothing to fear.
        - id: ch04-b10
          speaker: narrator
          text: >-
            One fine day, as the monkey sat at home, a messenger from the young crab appeared. The monkey wondered what the visit could mean. The messenger bowed before him and spoke.
        - id: ch04-b11
          speaker: messenger
          text: >-
            My master sent me to tell you that his father died the other day. He fell from a persimmon tree while trying to climb up for the fruit. Today is the seventh day since his death, the first memorial day. My master has prepared a small feast in his father's honor. Since you were one of his dearest friends, he asks you to join us. He sincerely hopes you will honor his home with your visit.
        - id: ch04-b12
          speaker: narrator
          text: >-
            In his heart, the monkey rejoiced. His fear of suspicion vanished. He had no idea that the plot against him had begun. Outwardly, he pretended to be shocked by the news.
        - id: ch04-b13
          speaker: monkey
          text: >-
            I am truly sorry to hear that your chief has died. We were such close friends, as you know. I still remember the day we exchanged a rice dumpling for a persimmon seed. It grieves me to think that the very same seed caused his death in the end. Please thank your master for this kind invitation. I accept with many thanks, and I will gladly come to honor my poor old friend.
        - id: ch04-b14
          speaker: narrator
          text: >-
            The monkey squeezed a few false tears from his eyes. The messenger laughed to himself.
        - id: ch04-b15
          speaker: messenger
          text: >-
            He's forcing those tears now. It won't be long before the real ones come.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Aloud, the messenger thanked him politely and went home.
    - id: ch05
      title: The Memorial Feast
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Once the messenger was gone, the wicked monkey laughed aloud at what he took for the young crab's innocence. He felt no sorrow at all for his dead friend. Without the least shame, he began looking forward to the feast he would enjoy that very day in honor of the crab he had killed.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The monkey changed his clothes and set out with a solemn air for the young crab's home.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The crab's family and relatives were all waiting to welcome him. After everyone had exchanged bows, they led the monkey into a hall. There the young crab, as chief mourner, received him.
        - id: ch05-b04
          speaker: narrator
          text: >-
            The monkey offered solemn words of sympathy, and the young crab thanked him for coming. Once those polite exchanges were over, everyone sat down to a splendid feast. The crab family served the monkey generously and treated him as the guest of honor.
        - id: ch05-b05
          speaker: narrator
          text: >-
            When the meal ended, the monkey was invited into the tea room for a cup of tea. The young crab showed him inside, then left him there and withdrew.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Time passed, but the young crab did not return. At last, the monkey lost patience.
        - id: ch05-b07
          speaker: monkey
          text: >-
            Tea ceremonies are always so slow. I'm tired of waiting, and all that sake with dinner has made me terribly thirsty!
        - id: ch05-b08
          speaker: narrator
          text: >-
            Unable to wait any longer, he went over to the charcoal hearth. He began to pour some hot water from the kettle that was boiling there. At that very moment, something burst out of the ashes with a tremendous pop and struck the monkey squarely in the neck.
        - id: ch05-b09
          speaker: narrator
          text: >-
            It was Chestnut, one of the crab's friends, who had been hiding in the hearth. The startled monkey leaped backward and rushed toward the door.
    - id: ch06
      title: The Friends Strike
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Bee was waiting outside the screens. As the monkey ran out, Bee darted forward and stung him on the cheek.
        - id: ch06-b02
          speaker: narrator
          text: >-
            The monkey's burned neck and badly stung face caused him terrible pain. Still, he raced on, screaming and chattering with rage.
        - id: ch06-b03
          speaker: narrator
          text: >-
            Mortar had taken his place on top of the crab's gate, where he hid with several other stones and waited. The instant the fleeing monkey passed underneath, Mortar and all the stones came crashing down together on top of his head.
        - id: ch06-b04
          speaker: narrator
          text: >-
            No one could bear such a weight falling from the top of a gate. The monkey lay crushed and suffering, unable to rise.
        - id: ch06-b05
          speaker: narrator
          text: >-
            While he lay helpless, the young crab approached. He raised his great claw like a pair of scissors over the monkey.
        - id: ch06-b06
          speaker: young_crab
          text: >-
            Do you remember murdering my father now?
          emotion: angry
        - id: ch06-b07
          speaker: monkey
          text: >-
            So you... you planned all this against me?
          emotion: fearful
        - id: ch06-b08
          speaker: young_crab
          text: >-
            Of course I am.
        - id: ch06-b09
          speaker: monkey
          text: >-
            Your father brought it on himself... I didn't do it!
        - id: ch06-b10
          speaker: young_crab
          text: >-
            Even now, you still lie. I'll stop your breath for good!
          emotion: angry
        - id: ch06-b11
          speaker: narrator
          text: >-
            With that, the young crab closed his great pincer claws and cut off the monkey's head. So the wicked, unrepentant monkey finally received the punishment he had earned, and the young crab avenged his father's murder.
    - id: ch07
      title: The End of the Tale
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            And that is the end of the story of the monkey, the crab, and the persimmon seed.
