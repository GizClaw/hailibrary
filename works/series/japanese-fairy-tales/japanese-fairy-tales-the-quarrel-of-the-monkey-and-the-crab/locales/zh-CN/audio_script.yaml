audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容稳健，带着古老童话的温暖与警醒
        timbre: 温暖清澈
        pace: 舒缓，紧张处适度加快
        pitch: 中音
    monkey:
      display_name: 猴子
      tts:
        delivery: 机敏活泼，遇险时强作镇定，脱身后带着戏谑
        timbre: 明亮灵巧的成年男声
        pace: 轻快
        pitch: 中高音
    old_crab:
      display_name: 老螃蟹
      tts:
        delivery: 朴实厚道，欢喜时真诚，受骗时焦急
        timbre: 温和清亮的成年男声
        pace: 平稳
        pitch: 中音
    young_crab:
      display_name: 小螃蟹
      tts:
        delivery: 坚定克制，悲痛与愤怒中仍保持清醒
        timbre: 清亮有力的年轻男声
        pace: 中速
        pitch: 中高音
    messenger:
      display_name: 使者
      tts:
        delivery: 恭敬周全，心中警觉而表面不动声色
        timbre: 清晰沉稳的成年男声
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 饭团与柿子核
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，日本一个晴朗的秋日里，红脸猴子和黄螃蟹在河岸边玩耍。他们跑来跑去，螃蟹捡到一个饭团，猴子捡到一颗柿子核。
        - id: ch01-b02
          speaker: narrator
          text: 螃蟹拾起饭团，拿给猴子看。
        - id: ch01-b03
          speaker: old_crab
          text: 你瞧，我捡到的东西多好！
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: 猴子也把柿子核高高举了起来。
        - id: ch01-b05
          speaker: monkey
          text: 我也捡到好东西了！你看！
        - id: ch01-b06
          speaker: narrator
          text: 猴子最爱柿子，可一颗柿子核硬得像石头，既不能吃，对他也没什么用。他贪嘴，一看见螃蟹香喷喷的饭团便眼馋了，马上提出要交换。螃蟹可不愿意。好好的饭团，凭什么换一颗石头似的种子呢？
        - id: ch01-b07
          speaker: narrator
          text: 狡猾的猴子不肯罢休，开始花言巧语地劝他。
        - id: ch01-b08
          speaker: monkey
          text: 你怎么只想着眼前呢？饭团现在就能吃，也比这颗种子大。可是你把种子埋进土里，过几年它就会长成大树，以后年年都有好多熟柿子。到那时，枝头全是黄澄澄的果子，多好看！你若不信，我就自己种。可你往后一定会后悔，怪自己没听我的话。
        - id: ch01-b09
          speaker: narrator
          text: 头脑简单的螃蟹经不住这番劝说，终于答应了。猴子三两口吞下饭团，才恋恋不舍地交出柿子核。他本想连种子也留下，又怕惹恼螃蟹，被那双剪刀似的利钳夹住。两人就此分开。猴子回到林中的树上，螃蟹回到河边的石头间。螃蟹一到家，便照猴子说的，把种子埋进土里。
        - id: ch01-b10
          speaker: narrator
          text: 第二年春天，嫩芽钻出了地面，螃蟹欢喜极了。小树一年比一年高，终于在一个春天开花，到了第二个秋天，又结出又大又好的柿子。宽阔光滑的绿叶间，果实像金球一样挂着，越熟颜色越深，渐渐变成浓浓的橙色。小螃蟹每天最喜欢做的事，就是坐到阳光下，把长眼睛伸出去，活像蜗牛探出触角，一心望着柿子一点点熟透。
        - id: ch01-b11
          speaker: old_crab
          text: 这些柿子吃起来一定香甜极了！
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: 终于有一天，螃蟹认定柿子已经熟透，很想摘一个尝尝。他一次次试着往树上爬，盼着够到高处那些漂亮的果子，却每次都失败。螃蟹的腿擅长在地上和石头间横行，这两样本领都很灵巧，可他的腿本来就不是用来爬树的。正发愁时，他想起了旧日玩伴猴子。世上再没有谁比猴子更会爬树了。螃蟹决定请他帮忙，立刻动身去找。
    - id: ch02
      title: 柿子树下的惨事
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 螃蟹沿着石子遍布的河岸横爬，又穿过小路，进了幽暗的树林。他终于找到猴子。猴子正在最喜欢的松树上睡午觉，尾巴紧紧缠着树枝，免得做梦时摔下来。一听见有人叫自己，他马上醒了，兴冲冲听螃蟹说明来意。得知当初那颗柿子核已经长成大树，结满好果子，猴子十分欢喜。因为就在这一刻，他想出了一个独吞柿子的诡计。
        - id: ch02-b02
          speaker: narrator
          text: 猴子答应去替螃蟹摘果子。来到树下，他见小小的种子竟长成这样茁壮的大树，枝头还压满熟柿子，惊叹得不得了。
        - id: ch02-b03
          speaker: narrator
          text: 猴子飞快爬上树，摘一个吃一个，每回都挑最好、最熟的果子，直到再也吃不下。他一个也不肯分给树下饥饿的螃蟹。等他吃够，枝头几乎只剩下又硬又涩的青柿子。
        - id: ch02-b04
          speaker: narrator
          text: 螃蟹耐心等了那么多年，盼着树长大，盼着果子熟，如今却只能眼看猴子吃光所有好柿子。他失望极了，绕着树一圈圈跑，不住喊猴子记住答应过什么。猴子起初根本不理。后来，他挑出一个最硬、最青的柿子，对准螃蟹的脑袋砸去。
        - id: ch02-b05
          speaker: narrator
          text: 没熟的柿子硬得像石头，这一下正中目标，把螃蟹打成重伤。猴子又飞快地摘下一个个硬柿子，不住砸向毫无还手之力的螃蟹，直到他浑身是伤，倒地死去。可怜的螃蟹，就这样躺在自己亲手种下的树脚边。
        - id: ch02-b06
          speaker: narrator
          text: 恶毒的猴子看到螃蟹死了，吓得浑身发抖。他像个懦夫一样，飞快逃离了那里。
        - id: ch02-b07
          speaker: narrator
          text: 老螃蟹有个儿子。惨事发生时，他正和朋友在附近玩耍。回家的路上，小螃蟹发现父亲已经死去，模样惨不忍睹。父亲的脑袋被砸烂，硬壳裂开好几处，夺去他性命的青柿子散落在尸身四周。小螃蟹看见这一幕，悲痛地坐在地上哭了起来。
        - id: ch02-b08
          speaker: narrator
          text: 哭了很久，他告诉自己，光哭没有用。他一定要找出凶手，替父亲报仇。小螃蟹查看四周，抬头时发现树上最好的果子全没了。地面除了那些砸过父亲的青柿子，还散着许多果皮和种子。他忽然明白，凶手就是猴子。
        - id: ch02-b09
          speaker: narrator
          text: 父亲曾告诉他饭团换柿子核的往事，而猴子最爱吃的水果正是柿子。小螃蟹确信，猴子因为贪图这些果子，害死了父亲。唉！他怒火中烧，起初恨不得马上攻过去，可转念又知道这样毫无用处。猴子年长而狡猾，凭他一个人的力量根本杀不了。若要取胜，只能以智取胜，还得请朋友相助。
        - id: ch02-b10
          speaker: narrator
          text: 小螃蟹立刻去拜访父亲的老朋友石臼，把发生的一切都说了，又流着泪恳求他帮助自己为父报仇。石臼听完这段悲惨的经过，十分难过，当即答应帮他惩治猴子，让凶手偿命。不过，猴子既强壮又狡猾，是个难以对付的敌人。石臼提醒小螃蟹，无论采用什么办法，行动都一定要万分小心。
        - id: ch02-b11
          speaker: narrator
          text: 石臼又派人请来蜜蜂和栗子。他们也是老螃蟹的旧友。两位朋友得知老螃蟹怎样遇害，猴子又是何等恶毒贪婪，都欣然答应帮助小螃蟹报仇。大家商议了很久，终于定下计策，这才各自散去。石臼则陪小螃蟹回家，帮助他安葬父亲。
    - id: ch03
      title: 猴子落入圈套
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这段时间里，猴子还在为自己的所作所为暗暗得意。坏人受罚之前，往往就是如此。他觉得自己抢走朋友所有的熟柿子，又杀了朋友，两件事都办得十分漂亮。可无论怎样挤出笑容，他总摆脱不了一丝恐惧。万一恶行败露，螃蟹一家一定会恨透他，还会设法报仇。不过，猴子一再告诉自己，逃走时没有人看见，绝不可能有人发现。于是，他一连几天躲在家里，不敢出门。
        - id: ch03-b02
          speaker: narrator
          text: 猴子平日里在树林中自由惯了，这样的日子实在无聊。最后，他再也忍不住了。
        - id: ch03-b03
          speaker: monkey
          text: 没人知道螃蟹是我杀的！我走的时候，那个老家伙肯定已经断气了。死螃蟹又不会说话，谁能指认我是凶手？既然没人知道，我还把自己关在家里苦恼什么？事情已经做了，谁也不能叫它没发生过！
        - id: ch03-b04
          speaker: narrator
          text: 猴子说完便溜进螃蟹的村落，在老螃蟹家附近鬼鬼祟祟地转悠，竖起耳朵偷听四周邻居的闲话。老螃蟹原来是整个族群的首领。猴子很想弄明白，螃蟹们怎样议论首领的死，又有没有人正在怀疑自己。可他听了半天，什么也没听见。
        - id: ch03-b05
          speaker: monkey
          text: 这些家伙真是一群傻瓜！他们既不知道谁杀了首领，也一点都不在乎！
        - id: ch03-b06
          speaker: narrator
          text: 猴子自以为有一套“猴子的聪明”，哪里知道，这份漠不关心正是小螃蟹的计策。小螃蟹故意装作不知道凶手是谁，也装作相信父亲是自己失足而死。这样一来，他暗中准备的复仇才不会被猴子察觉。
        - id: ch03-b07
          speaker: narrator
          text: 猴子从这趟探听消息的散步中回到家，心满意足，认定如今再也没有什么可怕的了。
        - id: ch03-b08
          speaker: narrator
          text: 一个晴朗的日子，猴子正坐在家中，小螃蟹派来一名使者。他吃了一惊，还在猜来人的用意，使者已经躬身行礼，开口说话。
        - id: ch03-b09
          speaker: messenger
          text: 我家主人命我来告诉您，他父亲前些日子为了摘柿子，试着爬上柿子树，不慎跌落身亡。今天正是亡故后的第七日，主人准备了一场小祭宴悼念父亲。您是他父亲生前最好的朋友之一，主人特意请您来一同祭奠，盼您赏光到府上做客。
        - id: ch03-b10
          speaker: narrator
          text: 猴子心里欢喜极了。害怕别人怀疑自己的忧虑，一下全消失了。他怎么也猜不到，一场对付他的计谋已经开始。猴子装出听到死讯后大为吃惊的模样。
        - id: ch03-b11
          speaker: monkey
          text: 听说你们首领去世，我实在难过。你也知道，我们以前是最好的朋友。有一回，我们还用饭团和柿子核互相交换。谁能想到，那颗种子最后竟害他丢了性命，真叫我伤心。多谢你家主人邀请，我一定前去，好好祭奠我可怜的老朋友！
        - id: ch03-b12
          speaker: narrator
          text: 说完，猴子还硬从眼睛里挤出几滴假泪。使者心中暗笑，想道，这恶猴子如今掉的是假眼泪，用不了多久，就要掉真眼泪了。不过，他嘴上仍客客气气地谢过猴子，然后回去复命。
        - id: ch03-b13
          speaker: narrator
          text: 使者刚走，恶猴子便放声大笑，笑小螃蟹实在天真。他没有半点愧疚，反倒开始盼望当天的祭宴。猴子换好衣裳，摆出庄重的样子，动身去拜访小螃蟹。
    - id: ch04
      title: 茶室里的伏击
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 螃蟹全家和亲戚都在等猴子，见他到了，纷纷上前迎接。双方行过见面礼，众人便把他领进大厅。小螃蟹是主丧之人，也亲自出来相迎。猴子说了几句吊唁的话，小螃蟹向他道谢。两边客套过后，大家一同坐下来，享用一桌丰盛的宴席，把猴子当作最尊贵的客人殷勤款待。
        - id: ch04-b02
          speaker: narrator
          text: 宴席结束，猴子又受邀去茶室喝茶。小螃蟹把他领进去，自己却退了出来。时间一点点过去，小螃蟹始终不曾回来。猴子终于等得不耐烦了。
        - id: ch04-b03
          speaker: monkey
          text: 茶会怎么总是这么慢？让我等了这样久，真烦人。刚才吃饭喝了那么多清酒，现在我渴得厉害！
        - id: ch04-b04
          speaker: narrator
          text: 猴子走近烧炭的炉坑，正想从沸腾的水壶里倒些热水。忽然，灰烬里“砰”的一声，蹦出个东西，正好打中他的脖颈。原来是螃蟹的朋友栗子，早早藏进了炉中。猴子猝不及防，向后一跳，转身就往屋外逃。
        - id: ch04-b05
          speaker: narrator
          text: 蜜蜂一直躲在屏风外，这时猛地飞出，一针刺在猴子的脸颊上。栗子烫伤了他的脖颈，蜜蜂又把他的脸蜇得厉害。猴子痛苦不堪，却还一边尖叫，一边气急败坏地向前逃。
        - id: ch04-b06
          speaker: narrator
          text: 石臼和几块石头早就藏在螃蟹家大门顶上。猴子刚从下面跑过，他们便一齐坠落，正砸在他的头顶。石臼从那么高的地方落下来，又如此沉重，猴子怎么承受得住？他被死死压住，疼痛难忍，再也爬不起来。
        - id: ch04-b07
          speaker: narrator
          text: 猴子无助地躺在那里。小螃蟹走到他面前，把一双巨大的钳子举到他的头上。
        - id: ch04-b08
          speaker: young_crab
          text: 现在你可记得，是你杀了我父亲？
          emotion: angry
        - id: ch04-b09
          speaker: monkey
          text: 原来……你……是我的……仇敌？
        - id: ch04-b10
          speaker: young_crab
          text: 当然。
        - id: ch04-b11
          speaker: monkey
          text: 那是……你父亲……自己的错……不怪我！
        - id: ch04-b12
          speaker: young_crab
          text: 到了现在，你还敢撒谎？我这就叫你断气！
          emotion: angry
        - id: ch04-b13
          speaker: narrator
          text: 话音一落，小螃蟹用巨钳剪下了猴子的脑袋。恶猴子终于受到应有的惩罚，小螃蟹也替父亲报了仇。
    - id: ch05
      title: 故事的结尾
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 猴子、螃蟹和柿子核的故事，到这里就结束了。
