audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，保留古老童话的神秘感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    jackal:
      display_name: 豺
      tts:
        delivery: 狡猾圆滑，总像胸有成竹
        timbre: 尖细灵活
        pace: 适中偏快
        pitch: 中高音
    rabbit:
      display_name: 兔子
      tts:
        delivery: 客气单纯，受骗后又羞又恼
        timbre: 柔和清亮
        pace: 适中
        pitch: 中高音
    hare:
      display_name: 小野兔
      tts:
        delivery: 自信爽快，带着年轻人的急性子
        timbre: 清脆明亮
        pace: 偏快
        pitch: 高音
    panther:
      display_name: 豹
      tts:
        delivery: 简短果断，不慌不忙
        timbre: 低沉坚实
        pace: 适中
        pitch: 低音
    tortoise:
      display_name: 陆龟
      tts:
        delivery: 沉默坚定，开口时稳重有力
        timbre: 粗厚沉稳
        pace: 缓慢
        pitch: 低音
    princess:
      display_name: 公主
      tts:
        delivery: 温柔勇敢，隐忍中带着坚定
        timbre: 清澈柔美
        pace: 适中
        pitch: 中高音
    nurse:
      display_name: 乳母
      tts:
        delivery: 慈和神秘，说话周到笃定
        timbre: 温暖醇厚
        pace: 稍慢
        pitch: 中低音
    king:
      display_name: 国王
      tts:
        delivery: 威严而溺爱，面对女儿容易心软
        timbre: 浑厚稳重
        pace: 适中
        pitch: 低音
    prince:
      display_name: 王子
      tts:
        delivery: 年轻坦率，热情中带些任性
        timbre: 明朗清晰
        pace: 适中
        pitch: 中音
    queen:
      display_name: 王后
      tts:
        delivery: 仁慈宽厚，语气温和自然
        timbre: 柔和端庄
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 动物们的井
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，溪水断了，河流也干了。动物们走了很远，找了很久，还是找不到水。后来，它们总算发现一眼小泉。只要再往深处挖一挖，泉水就会多起来。大家商量着合力挖口井，免得活活渴死。所有动物都答应出力，唯独豺不肯。它一向厌恶干活，总有办法把活儿推给别人。
        - id: ch01-b02
          speaker: narrator
          text: >-
            井挖好了，动物们又聚在一起商量，必须派人守住井口，绝不能让豺靠近。它们都说，豺没有出过一分力，当然不能喝大家挖出的水。谈论一番后，兔子接下了第一班，别的动物便各自回家。
        - id: ch01-b03
          speaker: narrator
          text: >-
            大家刚走远，豺就出现了。它笑容满面地向兔子连声问好，兔子也客客气气地回了一句。随后，豺解开身边的小袋，拿出一块蜂巢蜜，当着兔子的面吃起来。
        - id: ch01-b04
          speaker: jackal
          text: >-
            兔子，你看，我一点儿也不渴。这蜂蜜呀，可比水好吃多了。
        - id: ch01-b05
          speaker: rabbit
          text: >-
            让我尝一点儿吧。
        - id: ch01-b06
          speaker: narrator
          text: >-
            豺只掰下小得可怜的一丁点儿递过去。兔子一尝，立刻叫了起来。
        - id: ch01-b07
          speaker: rabbit
          text: >-
            真甜，真好吃！好朋友，再分我一点儿吧！
          emotion: happy
        - id: ch01-b08
          speaker: jackal
          text: >-
            想多吃些也行。不过，你得让我把前爪绑到背后，再仰面躺好，我才方便把蜂蜜倒进你嘴里。
        - id: ch01-b09
          speaker: narrator
          text: >-
            兔子照它说的做了。豺把兔子捆紧，放得四脚朝天，随即跑到泉边喝了个痛快。水喝够后，它一溜烟回了洞穴。
        - id: ch01-b10
          speaker: narrator
          text: >-
            傍晚，动物们回来，看见兔子被绑着躺在地上，都问它怎么会中了这样的圈套。
        - id: ch01-b11
          speaker: rabbit
          text: >-
            都是豺干的！它说要给我好东西吃，趁机把我绑了起来。它根本是在骗我，好来偷喝我们的水。
        - id: ch01-b12
          speaker: narrator
          text: >-
            大家骂兔子实在太笨，竟让不肯帮忙的豺喝了水。它们正愁下一班该交给谁，小野兔便主动站了出来。
        - id: ch01-b13
          speaker: hare
          text: >-
            下一班让我来守！
    - id: ch02
      title: 豺的第二个圈套
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天早晨，动物们各自离开，留下小野兔守泉。等它们走得无影无踪，豺又来了。它连声问候小野兔，小野兔也很有礼貌地向它问好。
        - id: ch02-b02
          speaker: jackal
          text: >-
            小野兔，你有鼻烟吗？分我一小撮怎么样？
        - id: ch02-b03
          speaker: hare
          text: >-
            对不住，我一点儿也没有。
        - id: ch02-b04
          speaker: narrator
          text: >-
            豺挨着小野兔坐下，又从袋中拿出蜂巢蜜。它一边舔嘴唇，一边故意夸赞那滋味。
        - id: ch02-b05
          speaker: jackal
          text: >-
            哎呀，你不知道这个有多香甜！
        - id: ch02-b06
          speaker: hare
          text: >-
            那到底是什么呀？
        - id: ch02-b07
          speaker: jackal
          text: >-
            吃上一点儿，嗓子又甜又润，往后再也不觉得渴。你们别的动物可不一样，总要一趟趟来喝水。
        - id: ch02-b08
          speaker: hare
          text: >-
            好朋友，那也分我一口吧。
        - id: ch02-b09
          speaker: jackal
          text: >-
            急什么？你要真想好好尝尝，就让我把你的前爪绑在背后。你再仰面躺着，我好直接倒进你嘴里。
        - id: ch02-b10
          speaker: hare
          text: >-
            好，你绑吧，可得快点儿！
        - id: ch02-b11
          speaker: narrator
          text: >-
            小野兔也被捆得结结实实，仰面躺在地上。豺慢悠悠走到井边，想喝多少就喝多少，喝够以后才回洞。到了傍晚，动物们回来一看，立刻责问小野兔怎么也中了圈套。它不是夸口说自己很机灵吗？既然答应守住大家的水，如今倒该让它们看看，井里还剩多少水可喝。
        - id: ch02-b12
          speaker: hare
          text: >-
            是豺骗了我。它答应给我好吃的，只要求我让它把前爪绑到背后。我哪里知道它打的是这个主意！
        - id: ch02-b13
          speaker: narrator
          text: >-
            动物们犯了愁。这一次，谁还值得信任呢？
        - id: ch02-b14
          speaker: panther
          text: >-
            让陆龟来守。
    - id: ch03
      title: 陆龟守住泉水
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            第三天早晨，动物们留下陆龟，照常各走各的。豺等它们走远，再次来到泉边，开口向陆龟问好。陆龟不声不响，连头也不抬。豺又问候一遍，陆龟仍装作没听见。
        - id: ch03-b02
          speaker: jackal
          text: >-
            今天这个比前两个还笨。我把它踢到一边，就能好好喝水了。
        - id: ch03-b03
          speaker: narrator
          text: >-
            豺走到陆龟身旁，放柔声音，一遍遍叫它。陆龟始终不理。豺抬脚把它踢开，得意地走到井边。可是嘴巴才碰上水，陆龟便猛地咬住了它的腿。
        - id: ch03-b04
          speaker: jackal
          text: >-
            快松口！你要把我的腿咬断啦！
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: >-
            陆龟一句话也不说，只把牙关咬得更紧。豺拿出蜂巢蜜，凑过去想引它闻一闻。陆龟把头转开，根本不受诱惑。
        - id: ch03-b06
          speaker: jackal
          text: >-
            我把整个袋子都送给你，里头的东西也全归你。这样总行了吧？
        - id: ch03-b07
          speaker: narrator
          text: >-
            陆龟唯一的回答，就是把豺的腿咬得更紧。别的动物回来时，看见的正是这副情形。豺一见它们出现，猛力一挣，总算拔出腿来，随后拔脚飞奔，能跑多快就跑多快。动物们围住陆龟，齐声称赞它。
        - id: ch03-b08
          speakers: [rabbit, hare, panther]
          ensemble: chorus
          text: >-
            干得好，陆龟！你真勇敢！你赢了那只偷水的豺，以后大家终于能安心喝水了！
    - id: ch04
      title: 披着熊皮的公主
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            接下来的故事名叫《熊》。从前，一位国王只有一个女儿。他为公主骄傲，也把她看得比什么都珍贵。国王时时刻刻都怕女儿一走出宫门便会遭遇不测。正因为爱得太深，他反倒把她关在自己的房间里，强迫她过着囚犯一样的日子。
        - id: ch04-b02
          speaker: narrator
          text: >-
            公主十分痛苦，有一天忍不住向乳母诉苦。她不知道，乳母其实是个女巫。乳母听了很久，也劝慰了很久，可公主始终无法宽心。
        - id: ch04-b03
          speaker: nurse
          text: >-
            父王有多疼你，你自己最清楚。你要什么，他都会答应，唯独不准你离开王宫。照我的办法去做吧。向他讨一辆木独轮车，再讨一张熊皮，然后拿来给我。我的魔杖一点，车子就会自己飞跑，把你送到任何想去的地方。熊皮披在身上，谁也认不出你。
        - id: ch04-b04
          speaker: narrator
          text: >-
            公主依计去见父王。国王听到这样的请求，惊讶极了，追问她拿这两样古怪东西做什么。
        - id: ch04-b05
          speaker: princess
          text: >-
            您从来不准我踏出王宫。那至少把这两样东西赐给我吧。
        - id: ch04-b06
          speaker: narrator
          text: >-
            国王终于答应。公主带着独轮车和熊皮回到乳母身边。女巫用魔杖轻轻一点，独轮车立刻朝四面八方自己跑了起来。公主再披上熊皮，模样变得彻彻底底，任谁看了都会认定她是一头熊，绝不会想到皮下是个姑娘。她这副古怪打扮坐上车，几分钟后便远离王宫，飞快穿行在一片大森林里。到了林中，她照乳母教的手势把车停下，同车一起躲进花木繁茂的密林。
        - id: ch04-b07
          speaker: narrator
          text: >-
            这个国家的王子恰好带着猎犬在林中打猎。他发现花木间藏着一头熊，立刻放狗扑了过去。公主眼看性命难保，赶紧大喊。
        - id: ch04-b08
          speaker: princess
          text: >-
            快把猎犬叫回去，它们会咬死我的！我从没伤害过你，你为什么要这样对我？
          emotion: fearful
        - id: ch04-b09
          speaker: narrator
          text: >-
            熊竟能说话，王子惊得一动不动。过了一会儿，他才温和地开口。
        - id: ch04-b10
          speaker: prince
          text: >-
            你愿意跟我走吗？我可以带你回家。
        - id: ch04-b11
          speaker: princess
          text: >-
            我愿意跟你去。
        - id: ch04-b12
          speaker: narrator
          text: >-
            公主坐上独轮车，车子立刻自行驶向王子的宫殿。王后看见儿子打猎回来，身边竟跟着一头熊，自然惊讶得不得了。更叫她吃惊的是，这头熊一到宫中便主动做起了家务，而且样样都比她见过的任何仆人做得更好。
        - id: ch04-b13
          speaker: narrator
          text: >-
            那阵子，邻国王子的宫里正在大办庆典。一天吃饭时，王子告诉母亲，晚上有一场盛大舞会，他非去不可。
        - id: ch04-b14
          speaker: queen
          text: >-
            那就去吧，好好跳舞，也好好玩一晚。
        - id: ch04-b15
          speaker: narrator
          text: >-
            熊照旧蜷在桌下，这时忽然出了声。
        - id: ch04-b16
          speaker: princess
          text: >-
            也带我去吧。我也想去舞会上跳舞。
        - id: ch04-b17
          speaker: narrator
          text: >-
            王子没有回答，只一脚把熊踢出房间。傍晚，他独自去参加舞会。等他一走，熊便来到王后跟前，苦苦请求准她也去。她保证会把自己藏得严严实实，绝不让任何人知道她在舞会上。王后心地善良，实在无法拒绝，终于同意了。
        - id: ch04-b18
          speaker: narrator
          text: >-
            熊跑到独轮车旁，脱下熊皮，用乳母给的魔杖点了一下。熊皮顿时化作月光织成的华美舞裙，独轮车也化作一辆马车，前面拉着两匹腾跃的骏马。公主登上车，一直驶到举行舞会的宫殿正门。她穿着奇妙的月光舞裙走进大厅，美丽得无与伦比，与所有宾客都不相同。人人都惊叹不已，猜不出她是谁，也没有人知道她从哪里来。
        - id: ch04-b19
          speaker: narrator
          text: >-
            王子一见这位陌生姑娘便深深爱上了她，整晚只肯同她一个人跳舞。舞会结束，公主乘马车飞驰而去。她得赶在身份暴露以前，把舞裙变回熊皮，把马车也变回独轮车。
        - id: ch04-b20
          speaker: narrator
          text: >-
            王子用马刺猛催坐骑，紧紧追在她身后，决心不让她离开视线。不料浓雾忽然升起，把公主完全遮住了。回家以后，他同母亲谈起的全是那位陌生姑娘，说两人跳了一支又一支舞，也说自己多么爱她。桌下的熊听见这些话，暗暗笑了。
        - id: ch04-b21
          speaker: princess
          text: >-
            我就是那位陌生姑娘。你怎么也想不到吧！
          emotion: happy
    - id: ch05
      title: 三场舞会
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            第二天晚上还有一场舞会，王子当然不肯错过。他盼着再见那位美丽的姑娘，同她跳舞，同她说话，更盼她能回答自己。毕竟第一晚，她始终没有开口。
        - id: ch05-b02
          speaker: narrator
          text: >-
            第一支舞的乐声一响，陌生姑娘果然走进大厅。这回，她穿的是阳光织成的舞裙，看上去比前一晚更加光彩照人。王子仍旧整晚只陪她跳舞，可她还是一句话也没说。舞会结束，王子又追着马车出了宫，想查明她究竟从哪里来。谁知一道巨大的水柱从天而降，倾泻的暴雨白茫茫一片，再次把她遮得无影无踪。
        - id: ch05-b03
          speaker: narrator
          text: >-
            王子回家以后，立刻把第二场舞会上的事告诉母亲。他说自己又见到了那位可爱的姑娘，而她今晚甚至比昨天更加美丽。桌下的熊听着，第二次露出了笑容，又小声嘀咕起来。
        - id: ch05-b04
          speaker: princess
          text: >-
            这一次你又没认出我。你哪里知道，自己深爱的姑娘每天都在眼前呢。
          emotion: happy
        - id: ch05-b05
          speaker: narrator
          text: >-
            第三天晚上，王子又去参加舞会，公主也去了。这一次，她把熊皮化作星光织成的长裙，上面缀满宝石。她走进大厅时光彩夺目，所有人都惊叹不已，纷纷说从没见过这么美的姑娘。王子仍旧只同她跳舞。虽然怎么也没能让她开口，却终于找到机会，悄悄把一枚戒指套上了她的手指。
        - id: ch05-b06
          speaker: narrator
          text: >-
            舞会一散，王子便骑马追赶她的车。这一回，他把马催得飞快，很长一段路都能望见前面的马车。偏偏一阵可怕的狂风突然横在两者之间，让他再也无法接近。回家后，他把满心痛苦都告诉了母亲。
        - id: ch05-b07
          speaker: prince
          text: >-
            我不知道这样下去会变成什么样。我爱她爱得快发疯了，却连她是谁都查不到。我陪她跳过舞，还送了她一枚戒指，可我既不知道她的名字，也不知道该去哪里寻找她。
          emotion: sad
        - id: ch05-b08
          speaker: narrator
          text: >-
            桌子下面，熊又笑着嘀咕起来。王子听见了，更加烦躁。
        - id: ch05-b09
          speaker: prince
          text: >-
            我累得要死，叫人给我做碗汤。可别让那头熊碰！每次我谈到心爱的姑娘，它都在旁边又笑又嘀咕，分明在嘲弄我。我实在不想再看见它！
          emotion: angry
        - id: ch05-b10
          speaker: narrator
          text: >-
            汤做好后，偏偏还是熊端了过来。送到王子面前之前，她把昨晚在舞会上收到的戒指悄悄放进了汤盘。王子心里难过，只顾想着要到哪里、用什么办法才能再见陌生姑娘，一口一口喝得又慢又没精神。忽然，他看见盘底的戒指，立刻认出正是自己送出去的那枚，惊讶得一个字也说不出来。
        - id: ch05-b11
          speaker: narrator
          text: >-
            熊正站在一旁，用温柔又恳求的目光望着他。那双眼睛让王子忽然明白，眼前的一切并不寻常。
        - id: ch05-b12
          speaker: prince
          text: >-
            把熊皮脱下来。它下面一定藏着秘密。
        - id: ch05-b13
          speaker: narrator
          text: >-
            熊皮落了下来，王子深爱的姑娘就站在眼前，仍穿着那袭星光长裙。他终于明白，她正是自己苦苦追寻的陌生姑娘。此刻，他觉得她比从前美上千倍。王子牵她去见母亲，公主便把全部经历从头说了一遍。她讲起父王如何把自己幽禁在宫中，也讲起自己怎样厌倦了囚犯般的生活。王后很快便爱上这个姑娘，也为儿子能娶到这样善良美丽的妻子高兴极了。
        - id: ch05-b14
          speaker: narrator
          text: >-
            后来，王子和公主结为夫妻。他们幸福地生活了许多年，也一直用智慧治理着自己的王国。
