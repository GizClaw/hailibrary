  chapters:
    - id: ch01
      title: 太阳带走的孩子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个女人一直没有孩子，心里十分难过。一天，她向太阳球许下一个承诺。
        - id: ch01-b02
          speaker: mother
          text: >-
            亲爱的太阳球，请赐给我一个小女儿吧。等她十二岁，你就把她收回去。
        - id: ch01-b03
          speaker: narrator
          text: >-
            没过多久，太阳球果真赐给她一个女儿。女人给孩子取名莱蒂科，十二年来一直悉心照料她。后来有一天，莱蒂科出门采药草，太阳球忽然出现在她面前。
        - id: ch01-b04
          speaker: sunball
          text: >-
            莱蒂科，回家提醒你母亲，她该想起答应过我的事了。
        - id: ch01-b05
          speaker: narrator
          text: >-
            莱蒂科马上回家，把遇见那位俊美高大先生的事告诉了母亲。
        - id: ch01-b06
          speaker: letiko
          text: >-
            母亲，他叫我转告您，别忘记从前许下的诺言。
        - id: ch01-b07
          speaker: narrator
          text: >-
            母亲吓坏了。她关紧所有门窗，堵住每道裂缝和孔洞，又把莱蒂科藏起来，不让太阳球带走她。可她偏偏漏了钥匙孔。太阳球从孔中射进一道光，光芒抓住小姑娘，把她带走了。
        - id: ch01-b08
          speaker: narrator
          text: >-
            一天，太阳球让莱蒂科去草棚取麦秸。她坐在一堆堆麦秸上，低声哀叹。
        - id: ch01-b09
          speaker: letiko
          text: >-
            脚下麦秸声声叹，我心也为母亲叹。
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: >-
            她坐在那里思念母亲，过了很久才回去。太阳球一见她便问，莱蒂科，你去了哪里，怎么耽搁了这么久？
        - id: ch01-b11
          speaker: letiko
          text: >-
            我的拖鞋太大，怎么也走不快。
        - id: ch01-b12
          speaker: narrator
          text: >-
            太阳球听了，便把她的拖鞋改小。又有一次，他让莱蒂科去泉边取水。姑娘走到泉边，没有马上装水，而是坐下来望着流动的泉水，再次哀叹起来。
        - id: ch01-b13
          speaker: letiko
          text: >-
            泉水汩汩流不停，我心也随流水淌，只因思念我母亲。
          emotion: sad
        - id: ch01-b14
          speaker: narrator
          text: >-
            她又耽搁了很久。回去以后，太阳球问，莱蒂科，你为什么这么久才回来？她回答说，自己的衬裙太长，走起来总是碍脚。太阳球便把衬裙剪短。后来，他又叫她取一双凉鞋。莱蒂科把鞋提在手中，听见皮革吱呀作响，心里又想起母亲。
        - id: ch01-b15
          speaker: letiko
          text: >-
            皮革吱呀声声响，我心也在吱呀响，只因想念小妈妈。
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: >-
            她回来得很迟。太阳球又问，莱蒂科，你怎么这么晚才到家？姑娘说，自己的红兜帽太宽，总掉下来蒙住眼睛，所以没法快走。太阳球又替她把兜帽改窄。可这些都不是莱蒂科迟归的真正原因。直到后来，太阳球才看出她有多么伤心。他再次让她取麦秸，自己悄悄跟进草棚，终于亲耳听见她如何思念母亲。
        - id: ch01-b17
          speaker: narrator
          text: >-
            太阳球回到家，叫来两只狐狸，问它们愿不愿送莱蒂科回去。
        - id: ch01-b18
          speakers: [fox_1, fox_2]
          ensemble: duo
          text: >-
            愿意，为什么不呢？
        - id: ch01-b19
          speaker: sunball
          text: >-
            路上要是又饿又渴，你们吃什么，喝什么？
        - id: ch01-b20
          speakers: [fox_1, fox_2]
          ensemble: duo
          text: >-
            我们吃她的肉，喝她的血。
        - id: ch01-b21
          speaker: sunball
          text: >-
            那你们不适合办这件事。
        - id: ch01-b22
          speaker: narrator
          text: >-
            他赶走狐狸，又叫来两只野兔，问了同样的问题。
        - id: ch01-b23
          speakers: [hare_1, hare_2]
          ensemble: duo
          text: >-
            我们愿意送她回家。路上饿了就吃青草，渴了就喝溪水。
        - id: ch01-b24
          speaker: sunball
          text: >-
            那就带她走吧，把她送回母亲身边。
    - id: ch02
      title: 两只野兔的护送
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            两只野兔带着莱蒂科上路。她家实在太远，走到半路，野兔们饿了。
        - id: ch02-b02
          speakers: [hare_1, hare_2]
          ensemble: duo
          text: >-
            亲爱的莱蒂科，先爬到这棵树上。等我们吃饱了，你再下来。
        - id: ch02-b03
          speaker: narrator
          text: >-
            莱蒂科爬上树，两只野兔到别处吃草去了。没过多久，一个拉米娅来到树下。
        - id: ch02-b04
          speaker: lamia
          text: >-
            莱蒂科，莱蒂科，下来瞧瞧，我脚上的鞋子多漂亮！
        - id: ch02-b05
          speaker: letiko
          text: >-
            我的鞋比你的漂亮多了！
        - id: ch02-b06
          speaker: lamia
          text: >-
            快下来吧。我还赶着回去打扫屋子呢。
        - id: ch02-b07
          speaker: letiko
          text: >-
            那你先回去打扫，收拾好了再来。
        - id: ch02-b08
          speaker: narrator
          text: >-
            拉米娅果真离开大树，回家把屋子打扫干净。等一切收拾妥当，她又赶回来，站在树下叫着莱蒂科的名字，要树上的姑娘下来看看她那条漂亮围裙。
        - id: ch02-b09
          speaker: letiko
          text: >-
            我的围裙也比你的漂亮多了！
        - id: ch02-b10
          speaker: lamia
          text: >-
            你再不下来，我就砍倒这棵树，把你吃掉！
          emotion: angry
        - id: ch02-b11
          speaker: letiko
          text: >-
            那你砍吧，砍倒了再吃我。
        - id: ch02-b12
          speaker: narrator
          text: >-
            拉米娅当真动手砍树，使出了浑身力气，一下接一下地砍，可大树就是不倒。她眼看威胁也没用，只好又叫莱蒂科下来，说自己还急着回去给孩子们喂饭。
        - id: ch02-b13
          speaker: letiko
          text: >-
            那就先去喂他们，喂好了再来。
        - id: ch02-b14
          speaker: narrator
          text: >-
            拉米娅又一次回家后，莱蒂科立刻大声呼唤两只小野兔。一只野兔竖起耳朵，对同伴说，听，莱蒂科在叫我们。两只野兔便使出最快的速度跑回树下。莱蒂科赶紧爬下来，跟着它们继续赶路。
        - id: ch02-b15
          speaker: narrator
          text: >-
            拉米娅发现后，拼命追赶。跑到一片有人劳作的田地，她拦住农人，问有没有谁从这里经过。
        - id: ch02-b16
          speakers: [worker_1, worker_2]
          ensemble: duo
          text: >-
            我们正在种豆子。
        - id: ch02-b17
          speaker: lamia
          text: >-
            我没问你们种什么！我问的是，有没有人从这里过去！
        - id: ch02-b18
          speakers: [worker_1, worker_2]
          ensemble: duo
          text: >-
            你聋了吗？我们种的是豆子，豆子，豆子！
        - id: ch02-b19
          speaker: narrator
          text: >-
            莱蒂科快到家了。家里的狗一眼认出她，兴奋地叫起来。
        - id: ch02-b20
          speaker: dog
          text: >-
            汪汪！快看，莱蒂科回来啦！
          emotion: happy
        - id: ch02-b21
          speaker: mother
          text: >-
            住嘴！你这报凶信的畜生，非要让我伤心得心都裂开吗？
          emotion: sad
        - id: ch02-b22
          speaker: narrator
          text: >-
            屋顶上的猫也看见了莱蒂科。
        - id: ch02-b23
          speaker: cat
          text: >-
            喵呜！喵呜！快看，莱蒂科回来啦！
          emotion: happy
        - id: ch02-b24
          speaker: mother
          text: >-
            不许出声！你这报凶信的畜生，非要让我伤心得心都裂开吗？
          emotion: sad
        - id: ch02-b25
          speaker: narrator
          text: >-
            接着，公鸡也瞧见了她。
        - id: ch02-b26
          speaker: cock
          text: >-
            喔喔喔！快看，莱蒂科回来啦！
          emotion: happy
        - id: ch02-b27
          speaker: mother
          text: >-
            安静！你这报凶信的鸟儿，非要让我伤心得心都裂开吗？
          emotion: sad
        - id: ch02-b28
          speaker: narrator
          text: >-
            莱蒂科和两只野兔离家门越来越近，身后的拉米娅也一步步追了上来。莱蒂科进了家门，一只野兔也正要从门缝溜进去，拉米娅却在最后一刻抓住它的小尾巴，一把扯了下来。野兔忍着疼钻进屋，莱蒂科的母亲连忙站起身迎接它。
        - id: ch02-b29
          speaker: mother
          text: >-
            欢迎你，亲爱的小野兔。你把莱蒂科送回我身边，我要送你一条银尾巴。
          emotion: happy
        - id: ch02-b30
          speaker: narrator
          text: >-
            母亲果真给野兔安上银尾巴。从此，她和女儿幸福满足地生活在一起。
    - id: ch03
      title: 食人魔的养女
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            接下来的故事，叫《布克·埃特姆苏赫之女》。从前，有个男人养育着七个女儿，一家人一直过得很快乐。有天早晨，父亲把女儿们叫到面前。
        - id: ch03-b02
          speaker: father
          text: >-
            你们的母亲和我要出远门，不知道什么时候回来。家里的食物够吃三年。可你们一定记住，在我们回来以前，谁来也不能开门。
        - id: ch03-b03
          speakers: [eldest_sister, second_sister, sister, youngest_daughter]
          ensemble: chorus
          text: >-
            好的，亲爱的父亲。
        - id: ch03-b04
          speaker: narrator
          text: >-
            两年过去，姐妹们从未离开屋子，也没打开过门锁。一天，她们洗好衣服，拿到屋顶晾晒。低头一看，街上人来人往，对面集市的摊位上摆满鲜肉、蔬菜和各种好吃的东西。
        - id: ch03-b05
          speaker: sister
          text: >-
            快来看呀！看得我都饿了。凭什么我们不能吃？派一个人去集市买些肉和蔬菜吧！
        - id: ch03-b06
          speaker: youngest_daughter
          text: >-
            不行，我们不能出去！父亲说过，等他回来以前绝不能开门。
        - id: ch03-b07
          speaker: narrator
          text: >-
            大姐扑过去打她，二姐朝她吐口水，三姐辱骂她，四姐推她，五姐把她摔倒，六姐撕破她的衣服。随后，六个姐姐把小妹妹丢在地上，提着篮子出门了。
        - id: ch03-b08
          speaker: narrator
          text: >-
            大约一个钟头后，姐姐们回来了，篮子装满鲜肉和蔬菜。她们把食物倒进锅里，架到火上烧煮，却完全忘了大门还敞开着。小妹妹始终没有参与。饭菜做好、桌子摆妥以后，她悄悄离开众人，溜进门厅，躲在角落里一只大木桶后面。
        - id: ch03-b09
          speaker: narrator
          text: >-
            六个姐姐正大吃大喝，一个女巫从门外经过。她看见洞开的大门，直接走到大姐跟前。
        - id: ch03-b10
          speaker: witch
          text: >-
            你这只胖垫子，我该从哪儿开始吃呢？
        - id: ch03-b11
          speaker: eldest_sister
          text: >-
            先吃我的手吧，就是它打了小妹妹。
        - id: ch03-b12
          speaker: narrator
          text: >-
            女巫吞掉大姐，连一点碎屑也没留下，又走向二姐。
        - id: ch03-b13
          speaker: witch
          text: >-
            那么你呢，胖垫子？该从哪儿下口？
        - id: ch03-b14
          speaker: second_sister
          text: >-
            先吃我的嘴吧，就是它朝妹妹吐了口水。
        - id: ch03-b15
          speaker: narrator
          text: >-
            女巫接着走向其余几个姐姐，把她们一个接一个吃掉。很快，六个姐姐全都消失了。女巫吞下最后一个姐姐的最后一口时，小妹妹还蹲在木桶后，吓得浑身僵硬。她猛地冲出敞开的大门，跑到街上，头也不回地一直向前。她的双脚能跑多快，她就跑多快，直到一座食人魔的城堡挡在眼前。门边的角落里放着一只大锅，她轻手轻脚地爬进去，拉过锅盖遮住自己，这才沉沉睡着。
        - id: ch03-b16
          speaker: narrator
          text: >-
            过了一阵，食人魔回到家。他大声念着“费、佛、冯”，说自己闻到了人的气味，想知道哪个倒霉蛋闯了进来。他找遍房间，没有发现任何人。
        - id: ch03-b17
          speaker: ogre
          text: >-
            你在哪里？出来吧，我不会伤害你。
        - id: ch03-b18
          speaker: narrator
          text: >-
            姑娘一声不响。食人魔只好再次开口。
        - id: ch03-b19
          speaker: ogre
          text: >-
            我保证你的性命安全。你是老头，就做我的父亲。你是男孩，就做我的儿子。和我同岁，就做我的兄弟。你是老妇，就做我的母亲。是年轻姑娘，就做我的女儿。是中年妇人，就做我的妻子。出来吧，不用害怕。
        - id: ch03-b20
          speaker: narrator
          text: >-
            姑娘终于从藏身的锅里出来，站到食人魔面前。食人魔再次叫她别怕。此后，他外出打猎，就让姑娘留在家里照看屋子。到了晚上，他会带着野兔、山鹑和瞪羚回来，给姑娘做晚饭。食人魔自己只爱吃人肉，也由姑娘替他烹调。他还把六间屋子的钥匙全交给姑娘保管，唯独第七间屋子的钥匙一直留在自己身上。
        - id: ch03-b21
          speaker: narrator
          text: >-
            日子一天天过去，两人一直住在一起。她叫食人魔“父亲”，食人魔叫她“女儿”，从没对她说过一句重话。一天，姑娘终于问起最后那把钥匙。
        - id: ch03-b22
          speaker: youngest_daughter
          text: >-
            父亲，把楼上房间的钥匙给我吧。
        - id: ch03-b23
          speaker: ogre
          text: >-
            不行，我的女儿。那里面没有你用得上的东西。
        - id: ch03-b24
          speaker: youngest_daughter
          text: >-
            可我就是想要那把钥匙。
        - id: ch03-b25
          speaker: narrator
          text: >-
            食人魔不肯理睬，只装作没有听见。姑娘哭了起来，暗自决定，今晚等他以为我睡着了，我就看看钥匙究竟藏在哪里。两人吃过晚饭，她向食人魔道了晚安，离开房间。几分钟后，她又悄悄溜回来，藏在帘幕后窥看。食人魔从口袋取出钥匙，藏进地上的一个洞里，这才上床睡觉。等四下再也没有一点声音，姑娘才从洞中拿走钥匙，回到屋里。
        - id: ch03-b26
          speaker: narrator
          text: >-
            第二天，第一道阳光刚出现，食人魔就醒来查看钥匙。他立刻猜到是谁拿走了，却没有像别的食人魔那样发火。
        - id: ch03-b27
          speaker: ogre
          text: >-
            要是现在叫醒她，只会把她吓坏。今天先让她拿着吧，等我晚上回来再取。
        - id: ch03-b28
          speaker: narrator
          text: >-
            食人魔出门打猎。等他走得再也看不见，姑娘马上跑上楼，用钥匙打开那间屋子。房中空空荡荡，只有一扇紧闭的窗。她推开窗格，探头望去。下面是王子的花园。一头牛独自在井边转动水车，从井里汲水，四周一个人影也没有。牛听见她打开窗格的声音，抬起头来。
        - id: ch03-b29
          speaker: first_ox
          text: >-
            早安，布克·埃特姆苏赫之女！你父亲正在把你养肥，等你又白又胖，就把你串在烤肉叉上烤熟。
        - id: ch03-b30
          speaker: narrator
          text: >-
            姑娘吓得失声痛哭，跑出房间。她哭了一整天，食人魔晚上回来时，晚饭还没有准备。
        - id: ch03-b31
          speaker: ogre
          text: >-
            你为什么哭？我的晚饭呢？楼上那间屋子，是你打开的吗？
        - id: ch03-b32
          speaker: youngest_daughter
          text: >-
            是我打开的。
        - id: ch03-b33
          speaker: ogre
          text: >-
            那头牛对你说了什么？
        - id: ch03-b34
          speaker: youngest_daughter
          text: >-
            它说，您把我养得又白又胖，等养肥以后，就要把我串在烤肉叉上烤熟。
          emotion: fearful
        - id: ch03-b35
          speaker: ogre
          text: >-
            明天你再到窗边，就这样回答它。父亲把我养得又白又胖，却不是为了吃我。我要是有你一只眼睛，就拿它当镜子，前后照遍全身。愿你的轭带松开，双眼失明，整整七天七夜。
        - id: ch03-b36
          speaker: narrator
          text: >-
            姑娘答应了。第二天早晨，牛又说起那些话，她便照食人魔所教的回答。牛立刻倒地，七天七夜无法动弹。没人给花园浇水，花儿全枯萎了。
        - id: ch03-b37
          speaker: narrator
          text: >-
            王子来到自己的花园，只看见满地枯黄的茎秆，那头牛就倒在中间。他一剑杀死牛，转身命侍从再牵一头来。侍从们带来一头膘肥体壮的牛。新牛转动水车，从井里汲出清水。花儿重新开放，青草也恢复翠绿。王子看见花园得救，这才叫上侍从离开。
    - id: ch04
      title: 窗边的姑娘
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            第二天清晨，姑娘听见水车转动，便开窗向外望。新来的牛也对她说，食人魔正把她养肥，早晚会把她烤熟。
        - id: ch04-b02
          speaker: youngest_daughter
          text: >-
            父亲把我养得又白又胖，却不是为了吃我。我要是有你一只眼睛，就拿它当镜子，前后照遍全身。愿你的轭带松开，双眼失明，整整七天七夜。
        - id: ch04-b03
          speaker: narrator
          text: >-
            牛当即倒在地上，整整七天七夜一动不动。七天以后，它终于站起来，重新转动水车。可水车才转了一两圈，王子忽然想去花园看看新牛干得怎样。他进园时，牛正忙着汲水，花草却早已枯黄。王子拔出长剑冲过去，要像杀死第一头牛那样杀掉它。牛赶紧跪到他面前。
        - id: ch04-b04
          speaker: second_ox
          text: >-
            殿下，请饶我一命，让我把事情的经过告诉您。
        - id: ch04-b05
          speaker: prince
          text: >-
            你要解释什么事？
        - id: ch04-b06
          speaker: second_ox
          text: >-
            有位姑娘从那扇窗里探出头，对我说了几句话，我就倒在地上，七天七夜不能动。殿下，像她那样的美人，这一生绝不会见到第二个。
        - id: ch04-b07
          speaker: prince
          text: >-
            你撒谎。那儿住着食人魔，他怎么会把姑娘藏在楼上？
        - id: ch04-b08
          speaker: second_ox
          text: >-
            为什么不会？明天黎明，您藏到那棵树后，就能亲眼看见。
        - id: ch04-b09
          speaker: prince
          text: >-
            好，我会来的。要是你没说实话，我就杀了你。
        - id: ch04-b10
          speaker: narrator
          text: >-
            王子离开花园，牛继续转动水车。第二天清晨，王子早早回来，看见牛已经在忙碌。他问姑娘出现了没有。牛说还没有，不过不会等很久，又让他藏进那棵树的枝叶间。王子照办。他才刚在树上坐稳，姑娘便猛地推开窗格。
        - id: ch04-b11
          speaker: second_ox
          text: >-
            早安，布克·埃特姆苏赫之女！你父亲把你养得又白又胖，等养肥以后，就把你串在烤肉叉上烤熟。
        - id: ch04-b12
          speaker: youngest_daughter
          text: >-
            父亲把我养得又白又胖，却不是为了吃我。我要是有你一只眼睛，就拿它当镜子，前后照遍全身。愿你的轭带松开，双眼失明，整整七天七夜。
        - id: ch04-b13
          speaker: narrator
          text: >-
            牛应声倒下，姑娘关窗离开。王子知道牛说的都是真的，也认定世上没有任何姑娘能和她相比。他从树上下来，爱情已在心中燃烧。
        - id: ch04-b14
          speaker: prince
          text: >-
            食人魔为什么没吃掉她？今晚我要请他到宫里吃饭，问清那姑娘是谁，是不是他的妻子。
        - id: ch04-b15
          speaker: narrator
          text: >-
            为了晚上的宴席，王子命人宰杀一头大牛，整只放在火上烤熟，又备下两口巨大的槽子，一口盛满清水，一口盛满美酒。将近黄昏，他带着侍从来到食人魔家，在院里等候主人打猎归来。食人魔远远看见自家门前聚了许多人，十分惊讶，却仍走上前，有礼地鞠了一躬。
        - id: ch04-b16
          speaker: ogre
          text: >-
            早安，亲爱的邻居们！今天是什么风把各位吹来了？我应该没有得罪你们吧？
        - id: ch04-b17
          speaker: prince
          text: >-
            当然没有。
        - id: ch04-b18
          speaker: ogre
          text: >-
            那么，各位今天怎么头一回来我家了？
        - id: ch04-b19
          speaker: prince
          text: >-
            我们想同你一起吃晚饭。
        - id: ch04-b20
          speaker: ogre
          text: >-
            欢迎。晚饭已经备好了，请进吧。
        - id: ch04-b21
          speaker: narrator
          text: >-
            食人魔领他们进屋。他这天收获丰盛，肩上的袋子装满猎物。桌子很快摆好，王子刚坐下，忽然改了主意。
        - id: ch04-b22
          speaker: prince
          text: >-
            对了，布克·埃特姆苏赫，不如你到我那里吃晚饭吧？
        - id: ch04-b23
          speaker: ogre
          text: >-
            到哪里去？
        - id: ch04-b24
          speaker: prince
          text: >-
            到我家。一切肯定都准备好了。
        - id: ch04-b25
          speaker: ogre
          text: >-
            可你家那么远，为什么不留在这里？
        - id: ch04-b26
          speaker: prince
          text: >-
            我改天再来。今晚一定让我做一回主人。
        - id: ch04-b27
          speaker: narrator
          text: >-
            食人魔便陪着王子和侍从回到宫中。过了一会儿，王子道明来意。
        - id: ch04-b28
          speaker: prince
          text: >-
            我是来求亲的，想娶一位出身清白人家的姑娘。
        - id: ch04-b29
          speaker: ogre
          text: >-
            可我没有女儿。
        - id: ch04-b30
          speaker: prince
          text: >-
            不，你有。我在窗边见过她。
        - id: ch04-b31
          speaker: ogre
          text: >-
            好吧。你愿意的话，就娶她吧。
        - id: ch04-b32
          speaker: narrator
          text: >-
            王子听到这句话，心中充满欢喜。他和侍从们陪着食人魔骑马回到对方家中。到了门前，食人魔正要进屋，王子仍不放心，又请这位客人千万别忘记他们刚刚说定的婚约。
        - id: ch04-b33
          speaker: ogre
          text: >-
            我早已不是年轻人，从来不会违背承诺。
        - id: ch04-b34
          speaker: narrator
          text: >-
            食人魔进屋关门，上楼看见姑娘还在等他一起吃饭。她不喜欢独自用餐。
        - id: ch04-b35
          speaker: ogre
          text: >-
            我吃过了。今晚一直和王子在一起。
        - id: ch04-b36
          speaker: youngest_daughter
          text: >-
            你在哪里遇见他的？
        - id: ch04-b37
          speaker: ogre
          text: >-
            我们是邻居，从小一起长大。今晚，我答应把你嫁给他。
        - id: ch04-b38
          speaker: youngest_daughter
          text: >-
            我才不想嫁给任何男人。
        - id: ch04-b39
          speaker: narrator
          text: >-
            她嘴上这样说，只是故意装装样子，其实心里也和王子一样欢喜。第二天一大早，王子便来到食人魔家。他带来丰厚的聘礼，还有一套华美的婚服，要把姑娘接回自己的宫殿。临行以前，食人魔把养女单独叫到面前，郑重叮嘱她。
        - id: ch04-b40
          speaker: ogre
          text: >-
            姑娘，千万别同王子说话。他对你说什么，你都得装哑巴。除非他发誓说“凭布克·埃特姆苏赫的头颅”，那时你才可以开口。
        - id: ch04-b41
          speaker: youngest_daughter
          text: >-
            好的，我记住了。
    - id: ch05
      title: 沉默的新娘
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            一行人来到宫中。王子领新娘走进为她准备的房间。
        - id: ch05-b02
          speaker: prince
          text: >-
            妻子，和我说句话吧。
        - id: ch05-b03
          speaker: narrator
          text: >-
            她始终沉默。王子以为她害羞，只好离开。第二天如此，第三天还是如此，他终于失去耐心。
        - id: ch05-b04
          speaker: prince
          text: >-
            你要是一直不肯开口，我就去另娶一个愿意同我说话的妻子。
        - id: ch05-b05
          speaker: narrator
          text: >-
            王子果真带回一位新娘。服侍第二位新娘的女官们进宫时，布克·埃特姆苏赫之女起身招呼她们。
        - id: ch05-b06
          speaker: youngest_daughter
          text: >-
            你们坐好吧，我来准备宴席。
        - id: ch05-b07
          speaker: narrator
          text: >-
            女官们依言坐下等候。姑娘也坐下来，先叫木柴到自己面前，木柴就自己走来了。她又呼唤火，火也来到这里，点燃了木柴。她接着叫锅，又叫油，锅和油便一同来到她面前。姑娘命油自己进锅，油便乖乖流了进去。等油烧得滚烫，她把十根手指全浸入锅中，十根手指立刻变成十条炸鱼。接着，她又唤来烤炉，命火把炉子烧热，火也照办了。
        - id: ch05-b08
          speaker: narrator
          text: >-
            火候一到，姑娘穿着金银织成的华服，戴着满身珠宝，纵身跳进烤炉。一两分钟后，她变成了一个雪白的面包，香得叫人直流口水。
        - id: ch05-b09
          speaker: loaf
          text: >-
            现在可以吃了，别站得那么远呀。
        - id: ch05-b10
          speaker: narrator
          text: >-
            女官们惊得面面相觑，一句话也说不出。
        - id: ch05-b11
          speaker: first_bride
          text: >-
            你们究竟在看什么？
        - id: ch05-b12
          speakers: [lady_1, lady_2]
          ensemble: duo
          text: >-
            我们在看这些奇迹。
        - id: ch05-b13
          speaker: first_bride
          text: >-
            这也叫奇迹？我也做得到！
        - id: ch05-b14
          speaker: narrator
          text: >-
            她径直跳进烤炉，转眼就烧成了灰。女官们赶紧跑去找王子。
        - id: ch05-b15
          speakers: [lady_1, lady_2]
          ensemble: duo
          text: >-
            快来呀，您的妻子死了！
          emotion: fearful
        - id: ch05-b16
          speaker: prince
          text: >-
            那就把她埋了吧。可她为什么要这么做？我又没让她往烤炉里跳。
        - id: ch05-b17
          speaker: narrator
          text: >-
            烧死的女人就这样被埋葬了。王子没有参加她的葬礼，因为他满心想的仍是那个不肯对自己开口的妻子。到了第二天夜里，他又来到布克·埃特姆苏赫之女面前，想知道她为什么执意沉默。
        - id: ch05-b18
          speaker: prince
          text: >-
            亲爱的妻子，你是不是害怕一开口就会发生可怕的事？你若还是不说话，我只好再娶一个妻子。
        - id: ch05-b19
          speaker: narrator
          text: >-
            可怜的姑娘心里十分想回答，可她仍害怕食人魔的叮嘱，只能继续沉默。王子说到做到，又带回一位新娘。第二位新娘和随行女官们在宫中端端正正地坐好以后，姑娘把一根锋利的尖桩插进地里，竟舒舒服服坐上桩尖，若无其事地纺起线来。
        - id: ch05-b20
          speaker: second_bride
          text: >-
            你们盯着看什么？觉得这很了不起吗？我也做得到！
        - id: ch05-b21
          speakers: [lady_1, lady_2]
          ensemble: duo
          text: >-
            你肯定做不到！
          emotion: surprised
        - id: ch05-b22
          speaker: narrator
          text: >-
            姑娘从尖桩上轻轻一跃，落到地面，随后离开房间。新妻子一见她走了，马上占据她的位置，也坐到尖桩上。可锋利的木桩当即穿透了她的身体，她转眼便死去了。女官们只得再次跑去向王子报信。
        - id: ch05-b23
          speakers: [lady_1, lady_2]
          ensemble: duo
          text: >-
            快来吧，把您的妻子埋了。
        - id: ch05-b24
          speaker: prince
          text: >-
            你们自己埋吧。她为什么要那样做？又不是我叫她把自己钉死在尖桩上的。
        - id: ch05-b25
          speaker: narrator
          text: >-
            女官们只好亲手埋葬了第二位新娘。到了晚上，王子又来到布克·埃特姆苏赫之女身边，请她开口同自己说话。他再次告诉她，如果她始终沉默，自己只能再娶一个妻子。姑娘依旧害怕食人魔，怎么也不敢出声。
        - id: ch05-b26
          speaker: narrator
          text: >-
            第二天，王子藏在房里窥看。不久，姑娘醒来，对水罐和水壶发出吩咐。
        - id: ch05-b27
          speaker: youngest_daughter
          text: >-
            快到泉边给我取水，我渴了。
        - id: ch05-b28
          speaker: narrator
          text: >-
            水罐和水壶听从命令，一起去了泉边。它们正往肚子里装水，水壶忽然撞到水罐，把水罐的壶嘴磕断了。水罐伤心得哭了起来，丢下水壶，跑回姑娘身边告状。
        - id: ch05-b29
          speaker: pitcher
          text: >-
            主人，打水壶一顿吧！它把我的嘴撞掉了！
          emotion: sad
        - id: ch05-b30
          speaker: water_jug
          text: >-
            凭布克·埃特姆苏赫的头颅，我求您别打我！
          emotion: fearful
        - id: ch05-b31
          speaker: youngest_daughter
          text: >-
            唉，要是我的丈夫早肯这样发誓，我从一开始就能同他说话，他也不必另娶妻子。可他现在永远不会说这句话，只能不停娶下去了。
          emotion: sad
        - id: ch05-b32
          speaker: narrator
          text: >-
            藏在暗处的王子听见了。他立刻跳起来，跑到姑娘面前。
        - id: ch05-b33
          speaker: prince
          text: >-
            凭布克·埃特姆苏赫的头颅，开口同我说话吧！
        - id: ch05-b34
          speaker: narrator
          text: >-
            姑娘终于能同丈夫说话了。从此以后，她再也不必对王子保持沉默。两个人幸福地生活到生命尽头。姑娘之所以等到今天才开口，正是因为她始终没有违背对食人魔许下的诺言。
