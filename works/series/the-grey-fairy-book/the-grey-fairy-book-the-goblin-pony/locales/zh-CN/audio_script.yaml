audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的诙谐
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    old_peggy:
      display_name: 老佩吉
      tts:
        delivery: 慈爱而郑重，警告时透着忧心
        timbre: 苍老温厚
        pace: 稍缓
        pitch: 中低音
    eldest_child:
      display_name: 大哥
      tts:
        delivery: 自信冒失，说话干脆
        timbre: 清亮结实
        pace: 适中
        pitch: 中音
    second_child:
      display_name: 老二
      tts:
        delivery: 倔强大胆，语气直率
        timbre: 明亮
        pace: 稍快
        pitch: 中音
    third_child:
      display_name: 老三
      tts:
        delivery: 活泼好胜，容易跟着起哄
        timbre: 清脆
        pace: 稍快
        pitch: 中高音
    richard:
      display_name: 小理查德
      tts:
        delivery: 年幼天真，害怕时声音发紧
        timbre: 稚嫩清澈
        pace: 适中
        pitch: 高音
  chapters:
    - id: ch01
      title: 万圣节前夜的警告
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            那天正是万圣节前夜。屋外的风刮得很凶，吹得整座房子都在摇晃。老佩吉守在壁炉旁，郑重地叮嘱孩子们。
        - id: ch01-b02
          speaker: old_peggy
          text: >-
            今晚谁也别离开壁炉。女巫都在外面游荡，她们手下的妖精还会变成各种模样，专门作弄凡人的孩子。
        - id: ch01-b03
          speaker: eldest_child
          text: >-
            我为什么要留下？我得去看看老雅各布家的女儿。她父亲是搓绳匠。月亮落下以前见不到我，她那双蓝眼睛一整夜都别想合上。
        - id: ch01-b04
          speaker: second_child
          text: >-
            我还要去捉龙虾和螃蟹呢。全世界的女巫和妖精一起来，也拦不住我。
        - id: ch01-b05
          speaker: narrator
          text: >-
            孩子们各自打定了主意，有的要去办自己的事，有的只想出去找乐子。他们谁也没把老佩吉明智的劝告放在心上。只有年纪最小的理查德迟疑了一会儿。
        - id: ch01-b06
          speaker: old_peggy
          text: >-
            小理查德，你留下吧。我给你讲几个好听的故事。
        - id: ch01-b07
          speaker: narrator
          text: >-
            可理查德还想着在月光下采一束野百里香，再摘些黑莓。他到底还是追在哥哥们身后跑了出去。到了屋外，孩子们发现天气好得出奇，天空一片澄澈，月亮正威风凛凛地穿过透明的云层。
        - id: ch01-b08
          speakers: [eldest_child, second_child, third_child, richard]
          ensemble: chorus
          text: >-
            老太太还说什么大风暴雨！瞧，今晚的天气多好，天空多晴朗！
    - id: ch02
      title: 黑色小马
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            就在这时，一匹黑色的小马忽然出现在孩子们身旁。
        - id: ch02-b02
          speakers: [eldest_child, second_child, third_child, richard]
          ensemble: chorus
          text: >-
            啊哈，这是老瓦伦丁家的小马！它一定是从马厩跑出来，要去马塘喝水。
        - id: ch02-b03
          speaker: narrator
          text: >-
            大哥伸手拍了拍小马。
        - id: ch02-b04
          speaker: eldest_child
          text: >-
            漂亮的小马儿，别乱跑。我亲自带你去马塘。
        - id: ch02-b05
          speaker: narrator
          text: >-
            说完，他翻身骑了上去。老二紧跟着爬上马背，接着是老三，再往后一个接一个，直到所有孩子都骑了上去。就连不愿独自留下的小理查德也坐在了最后。去马塘的路上，他们又碰见好几个伙伴，便招呼大家一起来骑。伙伴们当真全爬上了马背。小马驮着这么多人，却好像根本不在意增加的分量，还是欢快地一路小跑。
        - id: ch02-b06
          speaker: narrator
          text: >-
            小马跑得越快，孩子们玩得越起劲。他们不停用脚后跟踢着小马的肚子，还得意地齐声催促它。
        - id: ch02-b07
          speakers: [eldest_child, second_child, third_child, richard]
          ensemble: chorus
          text: >-
            快跑呀，小马！你背上从没坐过这么勇敢的骑手！
          emotion: happy
    - id: ch03
      title: 奔向大海
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            这时，风又刮了起来，海浪也发出阵阵咆哮。小马却像根本没听见那声音，不往马塘走，反倒轻快地直奔海岸。理查德开始后悔没去采百里香和黑莓。大哥也想起了搓绳匠雅各布家那个蓝眼睛的女儿，赶紧一把揪住马鬃，拼命想让小马掉头。
        - id: ch03-b02
          speaker: narrator
          text: >-
            可任凭大哥怎么拉扯也没有用。小马笔直地冲进海里，直到浪花打上它的前蹄。刚一碰到海水，它便放声嘶鸣，欢喜得又蹦又跳，接着飞快地闯进白沫翻腾的波涛。海水很快淹过孩子们的腿，他们这才后悔自己先前那样任性。
        - id: ch03-b03
          speakers: [eldest_child, second_child, third_child, richard]
          ensemble: chorus
          text: >-
            这匹该死的黑马中了邪！要是肯听老佩吉的话，我们就不会死在这里了！
          emotion: fearful
        - id: ch03-b04
          speaker: narrator
          text: >-
            小马越往深处走，海水就涨得越高。最后，浪头没过孩子们的头顶，他们全都淹死了。
    - id: ch04
      title: 清晨的小马
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            天快亮时，老佩吉仍放心不下孙儿们，不知道他们究竟遇到了什么，便独自出门寻找。她高处低处全找遍了，哪里都没有孩子们的踪影。她又挨家询问，可谁也不知道他们去了哪里。人们只知道，大哥并没有去见搓绳匠雅各布家那个蓝眼睛的女儿。
        - id: ch04-b02
          speaker: narrator
          text: >-
            老佩吉悲痛得弯着腰，正要回家，忽然看见一匹黑色的小马迎面而来。它一路腾跃，忽左忽右。到了近前，小马猛地高声嘶鸣，随即从她身边疾驰而过，眨眼就消失得无影无踪。
