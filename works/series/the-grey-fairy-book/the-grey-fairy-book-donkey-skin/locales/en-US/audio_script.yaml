  chapters:
    - id: ch01
      title: The Queen's Promise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king whose people loved him so well that he believed himself the happiest ruler in the world. He had everything he could wish for. His palace held the rarest curiosities, sweet flowers filled his gardens, and milk-white Arabian horses with great brown eyes stood in the marble stalls of his stable.
        - id: ch01-b02
          speaker: narrator
          text: Travelers came from far away to see these wonders. Yet they were puzzled when they found the finest stall of all given to a donkey with very large, drooping ears. It was certainly a fine donkey, but it seemed no more remarkable than any other. The visitors went home wondering why it received such care. They did not know its secret. Every night, while it slept, bushels of gold coins tumbled from its ears, and every morning the attendants gathered them up.
        - id: ch01-b03
          speaker: narrator
          text: The king enjoyed many prosperous years. Then a terrible sorrow came. His wife, whom he dearly loved, was dying. Even then, the queen thought first of his happiness. She gathered what little strength she had left and asked him for a promise.
        - id: ch01-b04
          speaker: first_queen
          text: You must marry again, for your own good and for the good of your people. But don't hurry. Wait until you find a woman more beautiful and more perfectly formed than I am.
          emotion: sad
        - id: ch01-b05
          speaker: adopted_king
          text: Oh, don't speak of another marriage. I would rather die with you!
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: The queen only gave him a faint smile. Then she turned on her pillow and died.
        - id: ch01-b07
          speaker: narrator
          text: For months, the king grieved deeply. Little by little, his sorrow eased. His counselors kept urging him to choose another wife. At first he would not hear of it. In time, he let them persuade him to consider marriage, but only if the bride was more beautiful and attractive than the late queen. That was the promise he had made.
        - id: ch01-b08
          speaker: narrator
          text: The counselors were delighted to have won his consent. They sent messengers far and wide to collect portraits of the most famous beauties in every country. Artists everywhere were kept busy and did their very best. But when the portraits arrived, no one could honestly claim that any of the women compared with the late queen, even for a moment.
        - id: ch01-b09
          speaker: narrator
          text: One day, after the king had turned sadly from yet another group of portraits, he noticed his adopted daughter. She had lived in the palace since she was a baby. Now he saw that if any woman on earth was lovelier than the queen, it was she. He immediately told her that he wished to marry her.
        - id: ch01-b10
          speaker: narrator
          text: The young woman had no ambition to be queen, and she had no wish at all to marry him. She was horrified. She begged for time to think. That night, when the palace was asleep, she climbed into a little cart drawn by a large sheep and went to ask her fairy godmother for help.
        - id: ch01-b11
          speaker: fairy
          text: I already know why you've come. If you don't wish to marry him, I'll help you escape it. Ask him for a dress that matches the sky exactly. He can never find one, so you'll be safe.
        - id: ch01-b12
          speaker: narrator
          text: The princess thanked her godmother and returned to the palace.
        - id: ch01-b13
          speaker: narrator
          text: The next morning, the man she had always called her father came to see her. She told him she could give no answer until he presented her with a dress the color of the sky. The king was overjoyed. He summoned the kingdom's finest weavers and dressmakers and ordered them to make the gown at once. If they failed, he would have their heads cut off.
        - id: ch01-b14
          speaker: narrator
          text: The terrified workers dyed, cut, and sewed as fast as they could. Two days later, they brought back a dress that seemed to have been cut straight from the heavens. The princess was thunderstruck. She had no idea what to do. That night, she harnessed the sheep again and hurried to her godmother.
        - id: ch01-b15
          speaker: fairy
          text: The king is cleverer than I expected. This time, tell him you must have a dress made of moonbeams.
    - id: ch02
      title: Three Dresses and a Donkey Skin
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next day, the king summoned the princess. She told him what she wanted.
        - id: ch02-b02
          speaker: adopted_king
          text: Madam, there is nothing I would refuse you.
        - id: ch02-b03
          speaker: narrator
          text: He commanded his workers to finish the dress within twenty-four hours. Otherwise, every one of them would be hanged. They gave the task all their strength, and by the next dawn a dress of moonbeams lay across the princess's bed.
        - id: ch02-b04
          speaker: narrator
          text: She could not help admiring its beauty, but soon she began to cry. The fairy heard her and came to help.
        - id: ch02-b05
          speaker: fairy
          text: I never thought he could do it! Ask him for a dress made of sunshine. I will be truly amazed if he can manage that.
          emotion: surprised
        - id: ch02-b06
          speaker: narrator
          text: After the fairy's first two failures, the princess had little faith left in this plan. Still, she knew of nothing else to try, so she asked her adopted father for the dress.
        - id: ch02-b07
          speaker: narrator
          text: The king raised no objection. He even gave up his finest rubies and diamonds to decorate it. When the gown was finished, it shone so fiercely that no one could look at it without smoked glasses.
        - id: ch02-b08
          speaker: narrator
          text: The princess pretended the sight hurt her eyes and withdrew to her room. The fairy was waiting there, thoroughly ashamed of herself.
        - id: ch02-b09
          speaker: fairy
          text: There is only one thing left to try. Demand the skin of the donkey he treasures so much. That animal gives him all his great wealth. Surely he will never surrender it.
        - id: ch02-b10
          speaker: narrator
          text: The princess was less certain. Even so, she went to the king and said she could not marry him until he gave her the donkey's skin.
        - id: ch02-b11
          speaker: narrator
          text: The request both astonished and grieved him. This was the animal that supplied his vast riches, yet he did not hesitate for a single moment. The donkey was killed, and its skin was carried to the princess and laid at her feet.
        - id: ch02-b12
          speaker: narrator
          text: Now the poor girl saw no escape from the future she dreaded. She wept again and tore at her hair. Suddenly, her fairy godmother stood before her.
        - id: ch02-b13
          speaker: fairy
          text: Take courage. Everything will go well now. Wrap yourself in this skin, leave the palace, and travel as far as you can. I will watch over you. Your dresses and jewels will follow beneath the ground. Whenever you need them, strike the earth, and they will appear. But hurry. You have no time to lose.
          emotion: calm
        - id: ch02-b14
          speaker: narrator
          text: The princess wrapped herself in the donkey skin and slipped out of the palace without anyone seeing her.
        - id: ch02-b15
          speaker: narrator
          text: As soon as her absence was discovered, the whole palace sprang into alarm. Searchers looked in every corner, likely and unlikely. The king sent parties down every road. But whenever they drew near the princess, the fairy covered her with an invisible mantle, and they passed without seeing her.
    - id: ch03
      title: Donkey Skin at the Farm
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The princess walked a very long way. She asked everywhere for a home and work. The people in the cottages she passed kindly gave her food, but her donkey skin was so filthy that no one would let her indoors. She had fled too quickly to clean it.
        - id: ch03-b02
          speaker: narrator
          text: One day, tired and discouraged by her bad luck, she wandered past the gate of a farm just outside a large town. Someone called to her. She turned and saw the farmer's wife among her turkeys, waving her inside.
        - id: ch03-b03
          speaker: farmers_wife
          text: I need a girl to wash dishes, feed the turkeys, and clean the pigsty. Judging by those dirty clothes, you won't think yourself too grand for the work.
        - id: ch03-b04
          speaker: narrator
          text: The princess gladly accepted the offer, relieved that someone would finally take her in. She was put to work at once in a corner of the kitchen. All the farm servants came to stare and laugh at her and at the donkey skin wrapped around her. After a while, they grew used to the strange sight and found it amusing no longer.
        - id: ch03-b05
          speaker: narrator
          text: She worked so hard and so well that her mistress became fond of her. She was wonderfully clever at tending sheep and herding turkeys. Anyone watching would have thought she had done such work all her life.
        - id: ch03-b06
          speaker: narrator
          text: One day, she sat beside a stream grieving over her miserable life. Then she caught sight of herself in the water. The donkey's head was pulled over her like a hood, hiding her hair and part of her face. The filthy, tangled hide covered her whole body. For the first time, she saw herself as others saw her, and the sight filled her with shame.
        - id: ch03-b07
          speaker: narrator
          text: She threw off the disguise and jumped into the stream. Again and again she plunged into the water until her skin shone like ivory. When it was time to return to the farm, she had to put the hide on once more. Now it seemed dirtier than ever.
        - id: ch03-b08
          speaker: narrator
          text: Still, she comforted herself. The next day was a holiday. For a few hours, she could forget she was a farm servant and become a princess again.
        - id: ch03-b09
          speaker: narrator
          text: At daybreak, she stamped on the ground just as the fairy had told her. At once, the sky-colored dress appeared across her tiny bed. The room was too small for its train, so she pinned the long folds up with care. Then she combed her lovely hair and piled it high on her head as she had always worn it.
        - id: ch03-b10
          speaker: narrator
          text: When she was ready, her reflection delighted her. She decided she would never miss another chance to wear her splendid clothes. If need be, she would put them on in the fields, with only sheep and turkeys to admire her.
    - id: ch04
      title: The Prince and the Cake
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The farm belonged to the royal family. On another holiday, the princess, whom everyone now called Donkey Skin, locked her door and put on her dress of sunshine. That same day, the king's son rode through the farm gate and asked to rest there after hunting.
        - id: ch04-b02
          speaker: narrator
          text: The servants brought him food and milk in the garden. Once he felt rested, he rose and explored the house, which was famous throughout the kingdom for its beauty and great age. He opened door after door and admired the ancient rooms. At last, he found a handle that would not turn.
        - id: ch04-b03
          speaker: narrator
          text: The prince bent down and looked through the keyhole. Inside stood a beautiful young woman in a gown so dazzling that he could scarcely look at it. When he turned away, the dark passage seemed darker than before.
        - id: ch04-b04
          speaker: narrator
          text: Back in the kitchen, he asked who slept in the room at the far end of the passage. The servants told him it belonged to the scullery maid, the girl everyone mocked and called Donkey Skin. The prince knew there was a mystery here. He also knew that more questions would get him nowhere. He rode home with his thoughts full of the vision through the keyhole.
        - id: ch04-b05
          speaker: narrator
          text: He tossed from side to side all night and woke the next morning burning with a high fever. His mother had no other child and lived in constant anxiety about him. She immediately gave him up for lost. The kingdom's greatest doctors were equally baffled by this sudden illness. They tried all the usual remedies, but nothing did any good.
        - id: ch04-b06
          speaker: narrator
          text: At last, the doctors said some hidden sorrow must be causing his illness. The queen knelt beside her son's bed and begged him to tell her his trouble. If he longed to be king, his father would gladly give up the burden of the crown and let him reign. If he was in love, they would do anything to win him the wife he wanted, even if her father was a king their country was fighting.
        - id: ch04-b07
          speaker: prince
          text: Madam, please don't think I could be so unnatural as to take my father's crown. While he lives, I will always be his most faithful subject. As for the princesses you mentioned, I have never met one I wished to marry. Still, I would obey you, whatever it cost me.
        - id: ch04-b08
          speaker: second_queen
          text: Oh, my son! We would do anything in the world to save your life, and ours as well. If you die, we will die too.
          emotion: fearful
        - id: ch04-b09
          speaker: prince
          text: Then I will tell you the one thing that can cure me. I want a cake made by Donkey Skin's own hands.
        - id: ch04-b10
          speaker: second_queen
          text: Donkey Skin? Who, or what, is that?
          emotion: surprised
        - id: ch04-b11
          speaker: attendant
          text: Madam, Donkey Skin is nearly as disgusting as a wolf. She is a girl in a greasy black hide who works as the poultry maid at your farm.
          emotion: disgusted
        - id: ch04-b12
          speaker: second_queen
          text: That doesn't matter. My son must have tasted something she baked. No doubt this is only a sick man's whim, but send word at once and have her make the cake.
        - id: ch04-b13
          speaker: narrator
          text: The attendant bowed, then sent a page riding to the farm with the queen's command.
        - id: ch04-b14
          speaker: narrator
          text: Perhaps Donkey Skin had glimpsed the prince when he looked through the keyhole. Perhaps she had seen him from her little window above the road. Or perhaps she had only heard the servants speak of him. No one could be certain. But the moment she received the queen's order, she cast off the dirty hide, washed from head to foot, and put on a skirt and bodice of shining silver.
        - id: ch04-b15
          speaker: narrator
          text: She locked herself in her room. Then she gathered the richest cream, finest flour, and freshest eggs on the farm and began her cake.
        - id: ch04-b16
          speaker: narrator
          text: As she stirred the mixture in a saucepan, a ring she sometimes wore in secret slipped from her finger and dropped into the dough. She may have noticed, or she may not. Either way, she kept stirring. Soon the cake was ready for the oven.
        - id: ch04-b17
          speaker: narrator
          text: When it was baked to a lovely brown, she took off the silver clothes and put the dirty skin back on. She handed the cake to the page and asked how the prince was doing. The page turned his head away and would not even answer her.
        - id: ch04-b18
          speaker: narrator
          text: He rode back like the wind. At the palace, he seized a silver tray and hurried the cake to the prince. The sick young man ate so quickly that the doctors feared he would choke. He almost did. The ring was hidden in one of the pieces he broke off, but he managed to draw it from his mouth without anyone noticing.
        - id: ch04-b19
          speaker: narrator
          text: As soon as he was alone, the prince took the ring from beneath his pillow and kissed it a thousand times. Then he tried to think of a way to meet its owner. Even he was too ashamed to admit that he had seen Donkey Skin only through a keyhole, for everyone might laugh at such sudden love.
        - id: ch04-b20
          speaker: narrator
          text: His worry brought the fever back. The cake had eased it for a little while, but now he grew ill again. The doctors had nothing else to suggest. They told the queen that her son was simply dying of love. Horrified, she rushed to the king, and together they hurried to the prince's bedside.
    - id: ch05
      title: The Search for the Ring's Owner
      blocks:
        - id: ch05-b01
          speaker: second_king
          text: My boy, my dear boy! Tell us whom you wish to marry, and she will be your bride, even if she is the humblest slave we have. There is nothing in the world we would not do for you.
          emotion: sad
        - id: ch05-b02
          speaker: narrator
          text: His father's words moved the prince to tears. From beneath his pillow, he drew an emerald ring of the purest green.
        - id: ch05-b03
          speaker: prince
          text: Dear Father and Mother, this ring proves that the woman I love is no peasant. Hard work has never thickened the finger it fits. Yet whatever her rank may be, I will marry no one else.
        - id: ch05-b04
          speaker: narrator
          text: The king and queen studied the tiny ring and agreed that it could not belong to an ordinary farm girl. The king ordered heralds and trumpeters into the town. Every unmarried young woman was summoned to the palace. The one whose finger fit the ring would one day be queen.
        - id: ch05-b05
          speaker: narrator
          text: The princesses came first. Then came the daughters of duchesses, followed by all the other noble young women in their proper order. One after another, they offered their hands. Not one could push the ring over even the tip of a finger. Each failure delighted the prince, and all the excitement was quickly curing him.
        - id: ch05-b06
          speaker: narrator
          text: When all the highborn women had failed, shopgirls and chambermaids took their turn. They had no better luck.
        - id: ch05-b07
          speaker: prince
          text: Bring in the kitchen maids and the shepherdesses too.
        - id: ch05-b08
          speaker: narrator
          text: They came, but one look at their broad, red fingers was enough to settle the matter.
        - id: ch05-b09
          speaker: chamberlain
          text: Your Highness, there is not one woman left.
        - id: ch05-b10
          speaker: narrator
          text: The prince waved him aside.
        - id: ch05-b11
          speaker: prince
          text: Did you send for Donkey Skin, the girl who baked my cake?
        - id: ch05-b12
          speaker: narrator
          text: The courtiers began to laugh.
        - id: ch05-b13
          speakers: [courtier_1, courtier_2]
          ensemble: duo
          text: We would never have dared bring such a filthy creature into the palace.
        - id: ch05-b14
          speaker: second_king
          text: Send someone for her at once. I ordered every unmarried woman to come, whether highborn or low, and that is what I meant.
        - id: ch05-b15
          speaker: narrator
          text: Back at the farm, the princess had heard the trumpets and proclamations. She knew her ring was the reason for them. She had fallen in love with the prince during her own brief glimpse of him, and she trembled at the thought that another woman's finger might be just as small.
        - id: ch05-b16
          speaker: narrator
          text: So when the palace messenger rode through the gate, she was almost wild with delight. She had been hoping for this summons and had dressed with great care. Beneath her disguise, she wore the moonlight gown, its skirt scattered with emeralds.
        - id: ch05-b17
          speaker: narrator
          text: When voices called for her to come down, she quickly drew the donkey skin over herself. Then she announced that she was ready to appear before the prince. The messenger took her straight to the great hall where he waited.
    - id: ch06
      title: The Princess Revealed
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: At the sight of the filthy donkey skin, the prince's heart sank. Could he have been wrong after all?
        - id: ch06-b02
          speaker: prince
          text: Are you the girl who sleeps in the room at the farthest corner of the farmhouse's inner courtyard?
        - id: ch06-b03
          speaker: narrator
          text: He looked away as he spoke.
        - id: ch06-b04
          speaker: princess
          text: Yes, my lord. I am.
        - id: ch06-b05
          speaker: prince
          text: Then hold out your hand.
        - id: ch06-b06
          speaker: narrator
          text: The prince felt bound to keep his word, whatever it might cost him. To everyone's astonishment, a small, white, delicate hand slipped out from beneath the greasy black hide. The ring glided onto her finger with perfect ease.
        - id: ch06-b07
          speaker: narrator
          text: At that very moment, the donkey skin fell to the floor. Before them stood a woman of such beauty that the prince, weak though he was, dropped to his knees. The king and queen knelt too and joined their pleas to his.
        - id: ch06-b08
          speaker: narrator
          text: Their welcome was so warm, and their embraces so overwhelming, that the princess could hardly find words to answer. Then the ceiling of the hall opened. Her fairy godmother appeared above them in a carriage made entirely of white lilac.
        - id: ch06-b09
          speaker: narrator
          text: In a few words, the fairy told them who the princess was and how she had come to the farm. No one wasted another moment. Preparations began for the most magnificent wedding imaginable.
        - id: ch06-b10
          speaker: narrator
          text: Kings from every country on earth received invitations. The princess's adopted father was invited too. By then, he had married a widow. Not one king refused to attend.
        - id: ch06-b11
          speaker: narrator
          text: What a strange gathering it was! Each ruler traveled in the manner he thought most impressive. Some were carried in litters. Others arrived in carriages of every shape and kind. The rest rode on elephants, tigers, and even eagles.
        - id: ch06-b12
          speaker: narrator
          text: No one had ever seen so splendid a wedding. When it ended, the king announced that a coronation would follow. He and the queen had grown tired of ruling, and the young couple would take their place.
        - id: ch06-b13
          speaker: narrator
          text: The celebrations continued for three full months. Afterward, the new king and queen settled down to govern. Their people came to love them dearly.
        - id: ch06-b14
          speaker: narrator
          text: They lived for another hundred years, and when they died, every person in the kingdom mourned them as a father and mother.
