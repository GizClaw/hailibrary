audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的诙谐
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    adopted_king:
      display_name: 养父国王
      tts:
        delivery: 威严任性，悲喜都不加掩饰
        timbre: 浑厚
        pace: 稍缓
        pitch: 中低音
    dying_queen:
      display_name: 王后
      tts:
        delivery: 虚弱温柔，话语郑重
        timbre: 柔和纤细
        pace: 缓慢
        pitch: 中高音
    princess:
      display_name: 公主
      tts:
        delivery: 真诚清楚，柔弱中藏着坚定
        timbre: 清澈柔润
        pace: 适中
        pitch: 中高音
    fairy_godmother:
      display_name: 仙女教母
      tts:
        delivery: 果断热心，偶尔流露惊讶
        timbre: 明亮成熟
        pace: 稍快
        pitch: 中音
    farmer_wife:
      display_name: 农妇
      tts:
        delivery: 直来直去，带着乡间主妇的爽利
        timbre: 结实明快
        pace: 适中
        pitch: 中音
    prince:
      display_name: 王子
      tts:
        delivery: 文雅真挚，病中气息较弱
        timbre: 清朗
        pace: 适中
        pitch: 中音
    prince_queen:
      display_name: 王子的母后
      tts:
        delivery: 慈爱急切，关怀溢于言表
        timbre: 温厚明亮
        pace: 稍快
        pitch: 中音
    attendant:
      display_name: 随行侍从
      tts:
        delivery: 恭敬刻板，语气里带着嫌弃
        timbre: 平直清晰
        pace: 适中
        pitch: 中低音
    prince_king:
      display_name: 王子的父王
      tts:
        delivery: 宽厚威严，对儿子满怀疼爱
        timbre: 深沉温暖
        pace: 稍缓
        pitch: 低音
    chamberlain:
      display_name: 宫廷总管
      tts:
        delivery: 谨慎恭顺，一板一眼
        timbre: 清晰稳重
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 天空、月光与阳光的衣裳
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有一位国王，臣民十分爱戴他。他觉得自己是天下最幸福的君主，因为凡是心里想要的，他样样都有。宫殿里陈列着世间罕见的珍奇，花园里开满芬芳的花。大理石马厩中还站着一排乳白色的阿拉伯骏马，每一匹都有温润的棕色大眼睛。
        - id: ch01-b02
          speaker: narrator
          text: >-
            远方的人听说国王收藏了无数奇珍，往往走很长的路来参观。可他们最惊讶的，却是最华美的马厩里住着一头大耳朵垂下来的驴。那头驴固然出色，可怎么看也不值得如此精心照料。客人们带着疑惑离开，并不知道它每晚睡着以后，耳朵里会滚出成斗的金币，清早再由侍从一枚枚收走。
        - id: ch01-b03
          speaker: narrator
          text: >-
            太平富足地过了许多年，国王忽然失去了深爱的妻子。王后直到生命的最后一刻，想的仍是他的幸福。她聚起仅剩的力气，要国王答应一件事。
        - id: ch01-b04
          speaker: dying_queen
          text: >-
            为了臣民，也为了你自己，你以后一定要再娶。可是别急，一定要等到找到一个比我更美、身姿也比我更出众的女子。
          emotion: sad
        - id: ch01-b05
          speaker: adopted_king
          text: >-
            别跟我说再娶！还不如让我跟你一起死去！
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: >-
            王后一言不发，只微微笑了笑，转身朝向枕头另一边，就此离开了人世。国王悲痛了好几个月，后来才渐渐淡忘一些。大臣们不停劝他另娶，他起先不听，最后终于答应考虑，只说新娘必须依照他对亡后许下的诺言，比她更加美丽动人。
        - id: ch01-b07
          speaker: narrator
          text: >-
            大臣们总算说服了国王，自然喜出望外。他们立刻派使者到各国寻找闻名的美人，请画师送来画像。画师们忙个不停，也用尽了本领，仍没有谁敢说画像上的女子能与亡后相比。一天，国王失望地看完新送来的画像，转身望见了自己的养女。她从婴儿时便住在宫中。国王心想，若全世界真有一个女子比亡后还美，那只能是眼前的姑娘。他马上说出要娶她的心愿。姑娘不贪恋富贵，也根本不愿嫁给他，惊恐之下只好请求时间考虑。
        - id: ch01-b08
          speaker: narrator
          text: >-
            当晚，人人都睡熟了，姑娘坐上一辆由大绵羊拉着的小车，去找仙女教母。她刚下车，仙女便说自己已经知道来意。
        - id: ch01-b09
          speaker: fairy_godmother
          text: >-
            你若不想嫁给他，我教你避开这件事。向他要一件和天空一模一样的衣裳吧，他绝对做不出来。这样你就安全了。
        - id: ch01-b10
          speaker: narrator
          text: >-
            姑娘谢过仙女，回到王宫。第二天，她告诉一直被自己称作父亲的国王，在收到一件天空颜色的衣裳以前，她不会答复。国王一听，以为她终于肯答应了，大喜过望。他召来全国最好的织工和裁缝，命令他们片刻都不许耽搁。做不出衣裳，就要砍掉所有人的脑袋。众人吓得魂不附体，马上忙着染布、裁剪、缝制。仅仅两天后，一件仿佛从天穹直接裁下来的衣裳便送到了姑娘面前。
        - id: ch01-b11
          speaker: narrator
          text: >-
            姑娘惊得不知如何是好，当夜又坐车去找仙女。
        - id: ch01-b12
          speaker: fairy_godmother
          text: >-
            这国王比我想的厉害。那就告诉他，你还要一件月光织成的衣裳。
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: >-
            次日，姑娘照样提出要求。国王仍然毫不迟疑。
        - id: ch01-b14
          speaker: adopted_king
          text: >-
            小姐，我什么都不会拒绝你。
        - id: ch01-b15
          speaker: narrator
          text: >-
            他下令二十四小时内做好衣裳，否则工匠全得被绞死。众人拼命赶工，第二天黎明，月光织成的衣裳已经铺在姑娘床上。她忍不住赞叹衣裳美丽，却还是伤心地哭了。仙女听见哭声，又赶来相助。
        - id: ch01-b16
          speaker: fairy_godmother
          text: >-
            真没想到他连这也办得到！你再要一件阳光织成的衣裳吧。他若还做得出来，我才真的服气。
          emotion: surprised
        - id: ch01-b17
          speaker: narrator
          text: >-
            前两个办法都失败了，姑娘已不大信任仙女。可是没有别的主意，她只能再向国王开口。国王一点也没觉得为难，不但马上答应，还拿出自己最珍贵的红宝石和钻石来装饰。衣裳做好后光芒万丈，不隔着烟色眼镜，谁也无法直视。姑娘一见，便假装眼睛被那道强光刺痛，赶紧退回自己房里。仙女已经在那里等着她，正为连续两次失算而羞愧不已。
    - id: ch02
      title: 披着驴皮逃走
      blocks:
        - id: ch02-b01
          speaker: fairy_godmother
          text: >-
            现在只剩一个办法了。去要国王最宝贝的那头驴的皮。他所有的财富都来自那头驴，这一回，他一定不会答应。
        - id: ch02-b02
          speaker: narrator
          text: >-
            公主心里可没有把握。她还是告诉国王，除非得到驴皮，否则绝不嫁给他。国王又惊讶又伤心，却没有片刻迟疑。他让人宰了驴，把皮放到公主脚下。姑娘眼看逃不开自己惧怕的命运，再次痛哭起来，还扯着头发。仙女忽然出现在她面前。
        - id: ch02-b03
          speaker: fairy_godmother
          text: >-
            别灰心，现在会好起来的。把驴皮裹在身上，离开王宫，能走多远就走多远。我会照看你。衣裳和珠宝会从地下跟着你，以后缺什么，只要跺一跺地面，东西马上就会出现。快走，一刻也不能耽误。
          emotion: calm
        - id: ch02-b04
          speaker: narrator
          text: >-
            公主把那张驴皮严严实实裹在身上，趁谁也没看见，悄悄溜出了王宫。人们一发现她失踪，立刻大声叫嚷着到处寻找，把想得到和想不到的角落全翻了个遍。随后，国王又派出一队队人马，沿着每一条道路追赶。可追兵只要一靠近，仙女便用隐身斗篷罩住姑娘。人马就算从近旁经过，也没有一个人能看见她。
        - id: ch02-b05
          speaker: narrator
          text: >-
            公主走了很远很远，只盼有人收留她，让她干活。沿途村舍里的人出于好心肯给她食物，却嫌驴皮太脏，不准她进门。她逃走时太匆忙，根本没来得及洗净那张皮。一次次碰壁以后，她又累又灰心。有一天，她走过城墙外一座农庄的院门，忽然听见有人招呼。她回头一看，一位农妇站在火鸡群里，正向她招手。
        - id: ch02-b06
          speaker: farmer_wife
          text: >-
            我正缺个姑娘洗盘子、喂火鸡，还要打扫猪圈。看你这一身脏衣裳，应该不会嫌这些活儿配不上自己吧。
        - id: ch02-b07
          speaker: narrator
          text: >-
            姑娘欢喜地答应了，马上被派到厨房一角做事。农庄里的仆役都跑来看她，取笑她的模样，也拿裹在她身上的驴皮说笑。过了一阵，大家看惯了，也就不再觉得有趣。姑娘无论做什么都勤快又出色，女主人渐渐喜欢上了她。她照看羊群、驱赶火鸡时更是十分熟练，仿佛这一生从没做过别的事。
        - id: ch02-b08
          speaker: narrator
          text: >-
            一天，姑娘坐在溪边，为自己的悲惨命运伤心。她无意中低下头，忽然看见了水里的倒影。驴头像兜帽那样罩着她，头发和半张脸全藏在下面，肮脏纠结的毛皮又从头到脚裹住了全身。她第一次看清别人眼中的自己，不禁为那副模样羞愧极了。姑娘马上脱下伪装，跳进水中，一遍又一遍潜下去清洗，直到全身洁白光润，好像象牙。
        - id: ch02-b09
          speaker: narrator
          text: >-
            回农庄时，她不得不重新披上那张显得更脏的皮。好在第二天是休息日，她可以暂时忘掉农家姑娘的生活，再做几个钟头的公主。天刚亮，她照仙女说的跺了跺地，天空般的衣裳立刻出现在小床上。房间小得放不下长裙裾，她只好把裙裾别好，再梳理头发，像从前那样在头顶盘成发髻。
        - id: ch02-b10
          speaker: narrator
          text: >-
            她装扮完，心里十分欢喜，决定以后绝不错过穿华服的机会。哪怕只能穿到田野里，身边只有羊群和火鸡欣赏，她也愿意。
    - id: ch03
      title: 钥匙孔中的身影
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            这座农庄属于王室。又一个休息日，“驴皮姑娘”锁好房门，穿上了阳光织成的衣裳。就在这时，王子打猎归来，骑马走进庄门，问能不能歇一会儿。人们在花园里摆出食物和牛奶。王子休息过后，便起身参观这座以古老和美丽闻名全国的宅院。
        - id: ch03-b02
          speaker: narrator
          text: >-
            他推开一扇又一扇门，慢慢欣赏每一间古老的屋子，直到碰上一只怎么也转不动的门把手。他想知道锁着的屋里有什么，便弯下腰，从钥匙孔望进去。里面竟站着一位美丽的姑娘。她身上的衣裳光辉灿烂，耀眼得叫他几乎无法直视。王子惊讶地转身离开时，只觉得外面那条幽暗的长廊比先前更加昏黑。
        - id: ch03-b03
          speaker: narrator
          text: >-
            他回到厨房，问走廊尽头的房间住着谁。众人说，那是人人取笑的洗碗女工，外号“驴皮姑娘”。王子明白这里面一定有秘密，也知道再问不会有结果，只得骑马回宫。一路上，他满脑子都是钥匙孔里那道美丽的身影。
        - id: ch03-b04
          speaker: narrator
          text: >-
            那一夜，王子在床上翻来覆去，怎么也睡不安稳，第二天早晨便发起高烧。王后只有这一个孩子，一直把他看得比什么都重，平日便总替他担心，如今更是认定儿子活不成了。全国最有本事的大夫都被请来，却也查不出病因。他们把惯用的药方试了个遍，全都没有效果。最后，大夫们只好说，王子的病一定是由某桩说不出口的心事引起的。
        - id: ch03-b05
          speaker: narrator
          text: >-
            王后听了大夫的话，立刻跪在儿子床边，求他把藏在心里的烦恼告诉母亲。若他想当国王，父亲愿意卸下王冠，也愿意放下统治国家的辛劳，让儿子接替自己。若他爱上了谁，那么不管要牺牲什么、付出什么代价，都要让他娶到那位姑娘。哪怕她是正在交战的敌国国王之女，父母也会答应。
        - id: ch03-b06
          speaker: prince
          text: >-
            母后，请别把我想得那么不近人情。我绝不会夺走父王的王冠。只要他还活着，我永远都是他最忠诚的臣民。您说的那些公主，我没有一个想娶。不过无论您有什么心愿，我总会服从，哪怕代价再大。
        - id: ch03-b07
          speaker: prince_queen
          text: >-
            我的儿子，为了救你，我们什么都愿意做！也是为了救我们自己。你若死了，我们也活不下去了。
          emotion: sad
        - id: ch03-b08
          speaker: prince
          text: >-
            既然这样，我就告诉您。只有一样东西能治我的病，那就是“驴皮姑娘”亲手做的蛋糕。
        - id: ch03-b09
          speaker: prince_queen
          text: >-
            驴皮姑娘？那是谁？那到底是人，还是什么东西？
          emotion: surprised
        - id: ch03-b10
          speaker: narrator
          text: >-
            王后还以为儿子发了疯。一名陪王子去过农庄的侍从正好在场，连忙上前解释。
        - id: ch03-b11
          speaker: attendant
          text: >-
            王后陛下，“驴皮姑娘”是世上最叫人恶心的东西，恐怕只有狼比她更糟。她披着一张油腻的黑皮，是您农庄里的喂鸡女工。
          emotion: disgusted
        - id: ch03-b12
          speaker: prince_queen
          text: >-
            那也没关系。我儿子大概吃过她做的点心。病人有这种怪念头，不值得奇怪。马上叫她烤一块蛋糕送来。
        - id: ch03-b13
          speaker: narrator
          text: >-
            侍从躬身领命，派一名少年骑马去传话。
    - id: ch04
      title: 蛋糕里的戒指
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            谁也说不准，驴皮姑娘有没有见过王子。也许王子朝钥匙孔里看时，她瞥见了他的眼睛，也许她曾从临街的小窗看见他。无论是真的见过，还是只听过别人谈论，王后的命令刚到，她就脱下脏驴皮，从头到脚洗净，再换上一套闪着银光的衣裙。
        - id: ch04-b02
          speaker: narrator
          text: >-
            她锁好房门，选了农庄里最醇厚的奶油、最精细的面粉和最新鲜的鸡蛋，开始做蛋糕。搅拌面糊时，一枚平日只能偷偷戴的戒指从她指间滑落，掉进了面糊。她究竟看见没有，谁也不知道。总之，她没有停手，很快把蛋糕送进了烤炉。
        - id: ch04-b03
          speaker: narrator
          text: >-
            蛋糕在炉里渐渐烤得焦黄。出炉以后，姑娘脱下银亮的衣裙，重新披好那张脏驴皮，把蛋糕交给来取的少年，同时还问了问王子的病情。少年却嫌弃她，把头扭到一边，连一句话也不肯屈尊回答。接着，他骑马像风一样赶回王宫。一到宫中，他便抓起一只银盘，匆匆将蛋糕送到王子面前。
        - id: ch04-b04
          speaker: narrator
          text: >-
            王子吃得飞快，大夫们都怕他噎着。他还真的差点噎住，因为掰下的一块蛋糕里藏着戒指。好在他悄悄从嘴里取出戒指，没有被任何人发现。等旁人全都离开，他从枕头底下拿出戒指，亲了千百遍。
        - id: ch04-b05
          speaker: narrator
          text: >-
            王子想尽办法，要找机会见到戒指的主人。他却不敢告诉别人，自己只从钥匙孔里见过驴皮姑娘，怕人们嘲笑这份突然生出的爱意。忧思让他的高烧再次发作，蛋糕带来的好转也消失了。大夫无计可施，只能告诉王后，王子得的是相思病。
        - id: ch04-b06
          speaker: narrator
          text: >-
            王后吓坏了，急忙把消息告诉国王。两人一同赶到儿子床边。
        - id: ch04-b07
          speaker: prince_king
          text: >-
            我的孩子，你到底想娶谁？不论她是什么身份，我们都会让她做你的新娘。就算她是宫里最低贱的奴仆，也没有关系。为了你，我们还有什么事不能做呢？
        - id: ch04-b08
          speaker: narrator
          text: >-
            王子听得流下眼泪，从枕头下面取出戒指。戒指上镶着一颗纯净无瑕的祖母绿。
        - id: ch04-b09
          speaker: prince
          text: >-
            父王，母后，这枚戒指足以证明我爱的人不是农家姑娘。能戴下它的手指，从没被粗重的劳作磨粗。不管她究竟是什么身份，我都不会娶别人。
        - id: ch04-b10
          speaker: narrator
          text: >-
            国王和王后仔细看过那枚小戒指，也觉得主人绝非普通农家姑娘。国王命传令官和号手走遍全城，召每一位未婚女子进宫。谁能戴上戒指，将来就是王后。
    - id: ch05
      title: 戒指找到了主人
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            各国公主最先到来，接着是公爵家的小姐，再以后便按照身份一个个试。没有谁能把戒指套过指尖，王子高兴得病都迅速好转。高贵的姑娘全都失败以后，店铺女伙计和贵族家的侍女也来试了，结果还是一样。
        - id: ch05-b02
          speaker: prince
          text: >-
            把厨房女工和牧羊姑娘也叫来。
        - id: ch05-b03
          speaker: narrator
          text: >-
            可大家只看一眼她们红肿粗大的手指，就知道戒指不会合适。
        - id: ch05-b04
          speaker: chamberlain
          text: >-
            殿下，已经没有别的女子了。
        - id: ch05-b05
          speaker: narrator
          text: >-
            王子挥手让总管退到一旁。
        - id: ch05-b06
          speaker: prince
          text: >-
            那个给我做蛋糕的驴皮姑娘呢？你们叫她来了吗？
        - id: ch05-b07
          speaker: narrator
          text: >-
            廷臣们笑成一片，说谁也不敢把那样肮脏的人带进王宫。
        - id: ch05-b08
          speaker: prince_king
          text: >-
            立刻派人去接她。我下令让所有未婚女子都来，不管高贵还是卑微。我说的是所有人。
        - id: ch05-b09
          speaker: narrator
          text: >-
            公主早已听见号角，也听见传令官的宣告，知道这一切都是自己的戒指引起的。她只匆匆看过王子一眼，却也爱上了他。等待的时候，她一直害怕别人的手指恰好和自己一样纤细。等到王宫使者终于骑马来到农庄门口，她欢喜得几乎失去理智。其实她一直盼着这道命令，早早便仔细装扮过，还穿上了月光织成的长裙，裙摆上洒满一颗颗祖母绿。
        - id: ch05-b10
          speaker: narrator
          text: >-
            楼下的人一叫，她赶紧把驴皮盖在身上，表示已经准备好去见王子。使者把她直接带进大厅。王子一看见那张皮，心顿时沉了下去。他开始怀疑自己是不是弄错了。
        - id: ch05-b11
          speaker: prince
          text: >-
            你就是那个住在农庄内庭最深处、走廊尽头房间里的姑娘吗？
        - id: ch05-b12
          speaker: narrator
          text: >-
            王子问话时，把目光转向了一旁。
        - id: ch05-b13
          speaker: princess
          text: >-
            是的，殿下，正是我。
        - id: ch05-b14
          speaker: prince
          text: >-
            那么，请伸出手来吧。
        - id: ch05-b15
          speaker: narrator
          text: >-
            王子已经决定，无论要付出什么代价，都必须信守诺言。满堂宾客惊讶地望着，只见一只雪白纤柔的小手从黑而肮脏的皮毛下伸出来。戒指轻轻一套便戴好了。就在那一刻，驴皮滑落到地上，一位美得惊人的姑娘出现在大家眼前。
        - id: ch05-b16
          speaker: narrator
          text: >-
            王子身体还很虚弱，却立刻跪在公主面前。国王和王后也和他一起恳求她答应婚事。他们欢迎得那么热烈，又争着亲吻拥抱她。事情来得太突然，公主被这些热情弄得晕头转向，一时简直找不到合适的话来回答。
    - id: ch06
      title: 盛大的婚礼
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            这时，大厅的天花板忽然打开。仙女教母坐着一辆完全由白丁香花做成的车，从上方出现了。她用几句话讲明公主的身世，也解释了公主为何会来到农庄。众人一刻也没耽搁，马上用最盛大的排场筹备婚礼。
        - id: ch06-b02
          speaker: narrator
          text: >-
            天下每个国家的国王都收到邀请，当然也包括公主的养父。这时候，他已经另娶了一位寡妇。所有受邀的人都答应前来。
        - id: ch06-b03
          speaker: narrator
          text: >-
            那真是一群奇异的宾客。每位君王都用自认为最气派、最能给人留下印象的方式旅行。有的让人用肩舆抬来，有的乘着形状各异、装饰不同的马车，还有的骑在大象和老虎背上，甚至有人骑着雄鹰从空中赶来。世上从未有过这样华丽的婚礼。
        - id: ch06-b04
          speaker: narrator
          text: >-
            婚礼结束后，国王又宣布要举行加冕礼。他和王后已经厌倦了统治，决定让年轻夫妇接替王位。全国整整欢庆了三个月。此后，新国王和新王后一心治理国家，臣民也深深爱戴他们。
        - id: ch06-b05
          speaker: narrator
          text: >-
            一百年后，他们离开人世。每一个臣民都像失去了自己的父亲和母亲那样，深深哀悼他们。
        - id: ch06-b06
          speaker: narrator
          text: >-
            这个故事选自《仙女故事宝库》。
