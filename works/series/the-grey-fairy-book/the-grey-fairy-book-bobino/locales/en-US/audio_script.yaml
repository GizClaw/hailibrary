  chapters:
    - id: ch01
      title: The Language of Animals
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a rich merchant with an only son named Bobino. The boy was clever and had a great desire for knowledge, so his father sent him away to study with a master. The merchant believed this teacher would train Bobino to speak all kinds of foreign languages. After several years under the master's care, the young man returned home.
        - id: ch01-b02
          speaker: narrator
          text: One evening, father and son walked together in the garden. Sparrows filled the trees above them with so much twittering that the two could hardly hear each other. The noise greatly annoyed the merchant, and Bobino tried to soothe him.
        - id: ch01-b03
          speaker: bobino
          text: Would you like me to tell you what the sparrows are saying to one another?
        - id: ch01-b04
          speaker: narrator
          text: His father stared at him in astonishment.
        - id: ch01-b05
          speaker: merchant
          text: What do you mean? How could you possibly explain their chatter? Do you think you are some kind of soothsayer or magician?
          emotion: surprised
        - id: ch01-b06
          speaker: bobino
          text: I am neither one. My master taught me the languages spoken by animals.
        - id: ch01-b07
          speaker: merchant
          text: Then all my good money is lost! Your master completely misunderstood me. I wanted you to learn the languages people speak, not the language of beasts.
          emotion: angry
        - id: ch01-b08
          speaker: bobino
          text: Please be patient. My master believed I should learn the animals' languages first. He meant to teach me human languages afterward.
        - id: ch01-b09
          speaker: narrator
          text: As they went toward the house, their dog ran up and barked furiously.
        - id: ch01-b10
          speaker: merchant
          text: What has come over that creature? He knows me perfectly well, so why is he barking at me?
        - id: ch01-b11
          speaker: bobino
          text: Do you want me to explain what he is saying?
        - id: ch01-b12
          speaker: merchant
          text: Leave me alone with your foolish talk. What a waste of money this has been!
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: A little later, they sat down to supper. Frogs in a nearby pond began croaking more loudly than anyone had ever heard. The merchant's irritation boiled over.
        - id: ch01-b14
          speaker: merchant
          text: This is the final thing I needed tonight, on top of all my disappointment!
          emotion: angry
        - id: ch01-b15
          speaker: bobino
          text: Shall I tell you what they mean?
        - id: ch01-b16
          speaker: merchant
          text: Stop offering your explanations! Go to bed, and do not show your face to me again!
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: Bobino obeyed, went to bed, and slept soundly. His father remained awake with his disappointment. He could think of nothing but all the money he believed had been wasted, and his anger only grew. That night he summoned two servants in secret and gave them orders for the following day.
    - id: ch02
      title: Into the Wood
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Early the next morning, one servant woke Bobino and put him into a waiting carriage. The man sat beside him, while the other servant rode alongside as an escort. Bobino did not know where they were taking him or what they meant to do. But the servant beside him looked miserable, and his eyes were swollen from crying.
        - id: ch02-b02
          speaker: bobino
          text: Why are you so unhappy? And where are you taking me?
        - id: ch02-b03
          speaker: narrator
          text: At first, the servant refused to answer. Bobino kept pleading until the man could hold back no longer.
        - id: ch02-b04
          speaker: first_servant
          text: My poor boy, I am taking you to be killed. Worse still, your own father gave the order.
          emotion: sad
        - id: ch02-b05
          speaker: bobino
          text: Why does he want me dead? I have done him no harm. What fault could I have committed that deserves this?
          emotion: surprised
        - id: ch02-b06
          speaker: first_servant
          text: You have not harmed him, and you have done nothing wrong. He is almost mad with anger because after all those years of study, you learned only the languages of animals. He expected something else, and that is why he has decided you must die.
          emotion: sad
        - id: ch02-b07
          speaker: bobino
          text: If it must happen, then kill me now. There is no reason to wait.
        - id: ch02-b08
          speaker: first_servant
          text: I cannot bring myself to do it. I would rather save you and also keep ourselves safe from your father's anger. Luckily, the dog followed us. We can kill it and take its heart back to your father. He will think the heart is yours, while you escape.
        - id: ch02-b09
          speaker: narrator
          text: The plan was settled. When they reached the thickest part of the wood, Bobino climbed out of the carriage. He said farewell to both servants, left them to carry the dog's heart back to his father, and began his lonely wandering through the world.
        - id: ch02-b10
          speaker: narrator
          text: He walked on until late that evening, when he found a house where several herdsmen lived. He knocked and asked for a night's shelter. The men saw that he was a gentle young traveler. They welcomed him inside and shared their supper with him.
        - id: ch02-b11
          speaker: narrator
          text: During the meal, the dog in the courtyard began to bark. Bobino went to the window and listened carefully. After a moment, he turned back to his hosts.
        - id: ch02-b12
          speaker: bobino
          text: Send your wives and daughters upstairs at once. Then arm yourselves with whatever you have. At midnight, a band of robbers will attack this house.
        - id: ch02-b13
          speaker: narrator
          text: The herdsmen were amazed. They thought the stranger must have lost his senses.
        - id: ch02-b14
          speakers: [first_herdsman, second_herdsman]
          ensemble: duo
          text: How could you know robbers are coming here? Who told you that?
        - id: ch02-b15
          speaker: bobino
          text: The dog's barking told me. I understand his language. If I had not come, the poor creature would have warned you for nothing. Follow my advice if you want to protect your lives and your belongings.
        - id: ch02-b16
          speaker: narrator
          text: The men were more astonished than ever, but they chose to trust him. They sent their wives and daughters upstairs, armed themselves, and hid behind a hedge to wait for midnight.
        - id: ch02-b17
          speaker: narrator
          text: Just as the clock struck twelve, they heard footsteps coming closer. A band of robbers crept cautiously toward the house, certain that everyone inside was unprepared. But the herdsmen were watching from their hiding place. They sprang from behind the hedge and fell upon the attackers. A shower of blows from their cudgels soon sent the whole band running away.
        - id: ch02-b18
          speaker: narrator
          text: The herdsmen knew that Bobino's warning had saved them. In their gratitude, they begged him to stay and make his home there. But he wanted to see more of the world. He thanked them warmly for their kindness and continued on his way.
    - id: ch03
      title: The Bottle in the Ditch
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Bobino walked throughout the next day. Toward evening, he reached a peasant's house and wondered whether to ask for shelter. Then he heard frogs croaking loudly in a ditch behind the house.
        - id: ch03-b02
          speaker: narrator
          text: He went around back and saw a strange sight. Four frogs were tossing a little bottle from one to another and croaking as they played. Bobino listened for several minutes, then knocked at the door. The peasant opened it and invited him in to supper.
        - id: ch03-b03
          speaker: narrator
          text: When they had eaten, the peasant told Bobino that the family was in deep trouble.
        - id: ch03-b04
          speaker: peasant
          text: My eldest daughter is terribly ill, and we fear she will never recover. A great doctor passed this way some time ago. He promised to send medicine that would cure her, but the servant carrying it dropped it on the road home. Now it seems there is no hope for my girl.
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: Bobino remembered the strange game behind the house. He told the father about the little bottle the four frogs had been tossing from one to another in the ditch. That bottle, he said, held the medicine the doctor had sent for the sick girl. The peasant could hardly believe such good fortune and asked how Bobino could be sure.
        - id: ch03-b06
          speaker: bobino
          text: I understand the language of animals. I heard what the frogs were saying while they tossed the bottle around. That is how I know the medicine is inside it.
        - id: ch03-b07
          speaker: narrator
          text: The peasant hurried to the ditch and brought back the bottle. He gave the lost medicine to his daughter, just as the doctor had intended. By morning, she was already much better. Her grateful father searched for some way to repay the young traveler, but Bobino would accept nothing. He simply said goodbye and set out again on his wanderings.
    - id: ch04
      title: What the Sparrows Said
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Not long afterward, Bobino came upon two men resting beneath a tree in the heat of the day. He was tired too, so he stretched out on the ground near them. Soon all three were talking together.
        - id: ch04-b02
          speaker: bobino
          text: Where are you two going?
        - id: ch04-b03
          speaker: first_traveler
          text: We are bound for a town nearby.
        - id: ch04-b04
          speaker: second_traveler
          text: The people there are choosing a new ruler today.
        - id: ch04-b05
          speaker: narrator
          text: While they talked, several sparrows settled in the tree above them. Bobino fell silent and listened closely. After a few minutes, he spoke to his companions.
        - id: ch04-b06
          speaker: bobino
          text: Do you know what those sparrows are saying? They say that before this day is over, one of the three of us will be chosen to rule that town.
        - id: ch04-b07
          speaker: narrator
          text: The two men did not answer him. They only exchanged a look, each thinking about the sparrows' promise. A few minutes later, they saw that Bobino had fallen asleep beneath the tree. Without waking him, the travelers quietly stole away and hurried toward the town, hoping to arrive before the election began.
    - id: ch05
      title: The Eagle's Choice
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: A huge crowd had gathered in the marketplace by the time the two travelers arrived. Everyone was waiting for the ceremony to begin and watching an eagle inside its cage. The townspeople had settled on an unusual way to choose their ruler. The eagle would be released, and the owner of whichever house it landed upon would govern the town.
        - id: ch05-b02
          speaker: narrator
          text: At last, the appointed hour came. The eagle was set free, and every face turned upward to see where it would land. The bird circled over the crowd. Then it flew straight toward a young man who had just entered the town.
        - id: ch05-b03
          speaker: narrator
          text: That young man was Bobino. He had awakened soon after the other travelers left and followed their path. Now the eagle had chosen him before all the people.
        - id: ch05-b04
          speakers: [first_citizen, second_citizen]
          ensemble: duo
          text: Bobino is our new ruler!
          emotion: happy
        - id: ch05-b05
          speaker: narrator
          text: The people proclaimed him their future ruler and escorted him in a great crowd to the Governor's house. From that day on, it became his home. Bobino lived there happily, and he ruled the people wisely.
