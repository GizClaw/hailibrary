audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，保留古老童话的神秘感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    bobino:
      display_name: 博比诺
      tts:
        delivery: 真诚聪慧，面对危难时沉着坦然
        timbre: 年轻清朗
        pace: 适中
        pitch: 中高音
    merchant:
      display_name: 商人
      tts:
        delivery: 自负急躁，发怒时严厉而响亮
        timbre: 浑厚有力
        pace: 适中偏快
        pitch: 中低音
    first_servant:
      display_name: 仆人
      tts:
        delivery: 善良忠厚，悲伤中带着怜惜
        timbre: 柔和沧桑
        pace: 稍慢
        pitch: 中低音
    first_herdsman:
      display_name: 牧人甲
      tts:
        delivery: 朴实谨慎，遇事直截了当
        timbre: 粗厚温暖
        pace: 适中
        pitch: 低音
    second_herdsman:
      display_name: 牧人乙
      tts:
        delivery: 谨慎坦率，惊讶时仍很实在
        timbre: 清晰厚实
        pace: 适中
        pitch: 中低音
    peasant:
      display_name: 农夫
      tts:
        delivery: 质朴忧心，转忧为喜时满怀感激
        timbre: 温厚微哑
        pace: 稍慢
        pitch: 中低音
    first_traveler:
      display_name: 旅人甲
      tts:
        delivery: 精明警觉，说话有所保留
        timbre: 清楚沉稳
        pace: 适中
        pitch: 中音
    second_traveler:
      display_name: 旅人乙
      tts:
        delivery: 务实寡言，心思敏捷
        timbre: 平稳偏干
        pace: 适中
        pitch: 中低音
    first_citizen:
      display_name: 市民甲
      tts:
        delivery: 兴奋庄重，宣布时洪亮果断
        timbre: 明亮高亢
        pace: 适中偏快
        pitch: 中高音
    second_citizen:
      display_name: 市民乙
      tts:
        delivery: 热烈欢欣，随众人高声响应
        timbre: 强健清晰
        pace: 适中偏快
        pitch: 中音
  chapters:
    - id: ch01
      title: 动物的语言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有个富商，膝下只有一个儿子，名叫博比诺。孩子聪明，又一心渴望学到知识，父亲便把他送到一位老师门下。他以为，这位老师一定会教儿子说各国的语言。博比诺跟随老师过了好几年，终于回到了家。
        - id: ch01-b02
          speaker: narrator
          text: >-
            一天傍晚，父子俩在花园里散步。头顶的麻雀叫个不停，吵得两人连彼此说话都听不清。商人越来越烦躁，博比诺便想让他宽心。
        - id: ch01-b03
          speaker: bobino
          text: >-
            父亲，要我告诉您，那些麻雀正在说什么吗？
        - id: ch01-b04
          speaker: narrator
          text: >-
            商人吃惊地盯着儿子。
        - id: ch01-b05
          speaker: merchant
          text: >-
            你说什么？麻雀的话，你怎么可能听得懂？难道你成了预言家，还是学会了魔法？
          emotion: surprised
        - id: ch01-b06
          speaker: bobino
          text: >-
            我不是预言家，也不会魔法。老师教给我的，是所有动物的语言。
        - id: ch01-b07
          speaker: merchant
          text: >-
            我那些钱全白花了！你的老师根本弄错了我的意思。我要你学的是人说的语言，不是飞禽走兽的话！
          emotion: angry
        - id: ch01-b08
          speaker: bobino
          text: >-
            请您再耐心等等。老师觉得应该先学动物的语言，以后再教我人类的语言。
        - id: ch01-b09
          speaker: narrator
          text: >-
            他们往屋里走，家里的狗迎面跑来，对着两个人狂叫。
        - id: ch01-b10
          speaker: merchant
          text: >-
            这畜生怎么了？它明明认得我，为什么还冲着我叫？
        - id: ch01-b11
          speaker: bobino
          text: >-
            您想知道它在说什么吗？
        - id: ch01-b12
          speaker: merchant
          text: >-
            别再拿这些胡话烦我！我的钱真是白白浪费了！
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: >-
            不久，两人坐下吃晚饭。邻近池塘里的青蛙忽然齐声大叫，那声音响得从未有人听过。先是麻雀，再是家犬，如今又轮到青蛙。商人听得心烦意乱，终于压不住怒火。
        - id: ch01-b14
          speaker: merchant
          text: >-
            我已经够难受、够失望了，偏偏还要来这一场蛙叫！
          emotion: angry
        - id: ch01-b15
          speaker: bobino
          text: >-
            要不要我说说它们的意思？
        - id: ch01-b16
          speaker: merchant
          text: >-
            住口！我不要听你的解释。上床去，别再让我看见你！
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: >-
            博比诺回房睡觉，很快便睡熟了。父亲却一直想着那笔白花的钱，越想越气。他叫来两个仆人，暗中吩咐他们第二天照命令行事。
    - id: ch02
      title: 林中的生路
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天一早，一个仆人叫醒博比诺，让他登上早已等候在门外的马车。这个仆人坐在他身边，另一个骑着马，始终跟在车旁护送。博比诺既不知道要去哪里，也猜不出别人要怎样处置他。他只看见身边的人满脸悲伤，两只眼睛都哭肿了。
        - id: ch02-b02
          speaker: bobino
          text: >-
            你为什么这样难过？我们究竟要去哪里？
        - id: ch02-b03
          speaker: narrator
          text: >-
            仆人起初不肯开口，直到博比诺再三恳求，他才终于说出实情。
        - id: ch02-b04
          speaker: first_servant
          text: >-
            可怜的孩子，我要带你去送死。最可怕的是，这正是你父亲下的命令。
          emotion: sad
        - id: ch02-b05
          speaker: bobino
          text: >-
            父亲为什么非要我死？我伤害过他吗？我究竟犯了什么错？
          emotion: surprised
        - id: ch02-b06
          speaker: first_servant
          text: >-
            你没害过他，也没有犯错。可你学了这么多年，只学会动物的语言。他原本盼着你学到别的本领，如今气得快疯了，所以一定要杀你。
        - id: ch02-b07
          speaker: bobino
          text: >-
            既然我非死不可，那就现在动手吧。何必还要等呢？
          emotion: sad
        - id: ch02-b08
          speaker: first_servant
          text: >-
            我下不了手。我宁愿想个办法，既保住你的命，也让我们躲过你父亲的怒火。那条狗恰好跟来了。我们杀掉它，把它的心带回去。你父亲会当成是你的心，那时你已经逃走了。
        - id: ch02-b09
          speaker: narrator
          text: >-
            马车驶进树林最茂密、最少有人经过的地方，博比诺便下了车。他向两个仆人道别，随后转身走进林中，独自踏上漂泊的路。
        - id: ch02-b10
          speaker: narrator
          text: >-
            他不停地走，直到深夜才看见一所牧人居住的屋子。博比诺敲门借宿。牧人们见他温和有礼，便请他进屋，一同吃晚饭。
        - id: ch02-b11
          speaker: narrator
          text: >-
            饭还没吃完，院里的狗叫了起来。博比诺走到窗前，仔细听了一会儿，随即转过身来。
        - id: ch02-b12
          speaker: bobino
          text: >-
            快让你们的妻子和女儿上楼睡觉。你们也赶紧找来武器。到了午夜，会有一伙强盗袭击这所房子。
        - id: ch02-b13
          speaker: narrator
          text: >-
            牧人们吓了一跳，都怀疑这个年轻人是不是失去了理智。
        - id: ch02-b14
          speakers: [first_herdsman, second_herdsman]
          ensemble: duo
          text: >-
            你怎么知道强盗要来？是谁告诉你的？
        - id: ch02-b15
          speaker: bobino
          text: >-
            是院里的狗告诉我的。我听得懂它的话。若不是我在这里，它就算叫破喉咙，也没人明白。你们想保住性命和财物，最好听我的劝。
        - id: ch02-b16
          speaker: narrator
          text: >-
            牧人们听得更加惊奇，最后还是决定照博比诺的话去做。他们把妻子和女儿送上楼，自己找来能用的武器，藏在一道树篱后面，屏住呼吸等着午夜来临。
        - id: ch02-b17
          speaker: narrator
          text: >-
            钟声刚敲过十二下，渐渐逼近的脚步声便从黑暗里传来。一伙强盗悄悄摸向屋子。早有准备的牧人们猛地从树篱后冲出，挥起棍棒一阵痛打，很快就把强盗赶跑了。
        - id: ch02-b18
          speaker: narrator
          text: >-
            牧人们正是靠着博比诺及时示警，才保住了性命和家中的财物，因此对他感激不尽。他们一再请他留下，从此把这里当成自己的家。可博比诺还想看看更广阔的世界。他诚心谢过大家的款待，再次上路。
    - id: ch03
      title: 青蛙的小瓶子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            博比诺走了一整天，傍晚来到一户农夫家门外。他正犹豫要不要敲门，请主人准许自己住上一夜，屋后水沟里的青蛙忽然大声叫起来。他绕过去一看，眼前的景象十分古怪。四只青蛙正在轮流抛接一个小瓶子，一边玩，一边呱呱叫个不停。
        - id: ch03-b02
          speaker: narrator
          text: >-
            博比诺听了几分钟，便回到门前敲门。农夫请他进屋，还请他一起吃晚饭。饭后，主人说起家里的苦恼。
        - id: ch03-b03
          speaker: peasant
          text: >-
            我的大女儿病得太重，我们都怕她再也好不起来。前些时候，有位医术高明的医生路过。他答应送来一种药，只要服下，女儿就能得救。可他托付送药的仆人在回来的路上把药弄丢了。现在，我们一点希望也没有了。
          emotion: sad
        - id: ch03-b04
          speaker: bobino
          text: >-
            我刚才看见四只青蛙在水沟里抛着一个小瓶子。那就是医生送来的药。
        - id: ch03-b05
          speaker: peasant
          text: >-
            你怎么能确定那瓶东西就是药？
        - id: ch03-b06
          speaker: bobino
          text: >-
            我懂动物的语言。青蛙们玩瓶子时说的话，我全都听见了。
        - id: ch03-b07
          speaker: narrator
          text: >-
            农夫立刻跑到水沟边，捡回那个小瓶子，让女儿服下里面的药。到了第二天早晨，姑娘果然好了许多。父亲感激万分，不知道该怎样才能谢够博比诺。博比诺却什么也不肯收。他只向这一家人道别，又一次独自踏上旅途。
    - id: ch04
      title: 麻雀的预言
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            没过多久，一天正午，博比诺遇见两个在树下乘凉的男人。他也走累了，便在离他们不远的地方躺下来。三个人很快聊在一起。博比诺问他们要去哪里。
        - id: ch04-b02
          speakers: [first_traveler, second_traveler]
          ensemble: duo
          text: >-
            我们要去附近的城镇。那里的百姓今天会选出一位新的统治者。
        - id: ch04-b03
          speaker: narrator
          text: >-
            说话间，几只麻雀飞到他们歇息的树上。博比诺安静下来，凝神听了几分钟。
        - id: ch04-b04
          speaker: bobino
          text: >-
            你们知道麻雀说了什么吗？它们说，今天我们三个人里面，会有一个成为那座城的统治者。
        - id: ch04-b05
          speaker: narrator
          text: >-
            两个男人听完没有回答，只是意味深长地互相看了一眼。又过了一会儿，他们见博比诺已经睡着，便悄悄起身，把他独自留下，用最快的速度赶向那座即将选出统治者的城。
        - id: ch04-b06
          speaker: narrator
          text: >-
            城里的市集广场已经挤满人。大家都在等待约定的时辰，到时会有一只鹰从笼中放出来。百姓早已议定，不论鹰落在谁家的屋顶上，那所房子的主人就是新的统治者。
        - id: ch04-b07
          speaker: narrator
          text: >-
            时辰终于到了。鹰飞出笼子，所有人都瞪大眼睛，看它会落到哪里。可它只在众人头顶盘旋几圈，便直直飞向一个刚刚走进城里的年轻人。
        - id: ch04-b08
          speaker: narrator
          text: >-
            那个年轻人不是别人，正是博比诺。两个同伴离开不久，他便醒了过来，又顺着他们留下的足迹一路赶到这里。鹰没有落在任何屋顶上，却选中了刚刚进城的他。人群顿时欢呼起来。
        - id: ch04-b09
          speakers: [first_citizen, second_citizen]
          ensemble: duo
          text: >-
            就是他！他是我们未来的统治者！
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: >-
            百姓簇拥着博比诺来到总督府，从此那里便成了他的家。他在城中幸福地生活，也一直用智慧治理着百姓。
