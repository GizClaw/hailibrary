audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，保留古老童话的神秘感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 慈爱而威严，年老后更显急切
        timbre: 浑厚温和
        pace: 稍慢
        pitch: 低音
    cannetella:
      display_name: 坎内泰拉
      tts:
        delivery: 起初骄傲挑剔，受难后悲切而警醒
        timbre: 清亮柔润
        pace: 适中
        pitch: 中高音
    scioravante:
      display_name: 肖拉万特
      tts:
        delivery: 阴沉专横，发怒时凶狠逼人
        timbre: 低沉冷硬
        pace: 稍慢
        pitch: 低音
    old_woman:
      display_name: 王宫对面的老妇人
      tts:
        delivery: 贪婪狡黠，念咒时压低声音
        timbre: 苍老干涩
        pace: 稍慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 金脑袋的求婚者
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，贝洛普奥约有一位富有而强大的国王。他拥有世间想要的一切，只缺一个孩子。国王结婚多年，直到年事已高，妻子伦佐拉才生下一个漂亮的女儿。夫妻俩给她取名坎内泰拉。
        - id: ch01-b02
          speaker: narrator
          text: >-
            坎内泰拉越长越美，身材高挑挺拔，像一棵小枞树。到了十八岁，父亲把她叫到身边，要同她谈谈婚事。
        - id: ch01-b03
          speaker: king
          text: >-
            女儿，你已经到了成家的年纪。我最疼爱的人就是你，只盼你过得幸福。所以，丈夫由你自己来挑。你选中谁，我都会满意。
        - id: ch01-b04
          speaker: narrator
          text: >-
            坎内泰拉谢过父亲的疼爱和体谅，却说自己根本不想出嫁，决意一辈子独身。国王眼看自己越来越衰老虚弱，只盼死前能见到王位继承人。女儿的话让他伤心不已，他苦苦求她不要让自己失望。
        - id: ch01-b05
          speaker: cannetella
          text: >-
            好吧，亲爱的父王。您一直这样疼我，我不愿显得忘恩负义。为了让您高兴，我可以嫁人。不过，您得给我找到世上最英俊、最聪明、最迷人的丈夫。
        - id: ch01-b06
          speaker: narrator
          text: >-
            国王听了喜出望外。从那以后，他每天从清早到深夜都守在窗前，仔细打量每一个来往行人，希望能从他们中间找到合适的女婿。一天，他看见一位相貌出众的男子穿街而过，连忙唤女儿到窗前来看。
        - id: ch01-b07
          speaker: king
          text: >-
            坎内泰拉，快来！你瞧瞧这个人，我看他很适合做你的丈夫。
        - id: ch01-b08
          speaker: narrator
          text: >-
            年轻人被请进王宫，面前摆满了各种珍馐美味。吃到一半，一颗杏仁从他嘴里掉了出来。他赶紧捡起，藏到桌布下面。客人走后，国王问女儿觉得他怎么样。
        - id: ch01-b09
          speaker: cannetella
          text: >-
            他可真笨手笨脚！这么大的人，居然还会把杏仁从嘴里掉出来。
        - id: ch01-b10
          speaker: narrator
          text: >-
            国王听到这个回答，只好继续守在窗前。不久，又有一位十分英俊的年轻人走过。坎内泰拉叫父亲把他请进来，好让自己近些看看。王宫再次摆下华美的宴席。客人吃到再也吃不下，又喝了个尽兴，这才告辞离开。随后，国王又来问女儿是否中意。
        - id: ch01-b11
          speaker: cannetella
          text: >-
            一点也不中意。他连自己的斗篷都穿不好，非要两个仆人帮忙。这样的丈夫能有什么用？
        - id: ch01-b12
          speaker: king
          text: >-
            要是你只能挑出这点毛病，我可明白了。你是打定主意，谁也不嫁。可你必须嫁人，我不能让自己的姓氏和王室血脉断绝。
        - id: ch01-b13
          speaker: cannetella
          text: >-
            那我就明说吧，亲爱的父王。除非找到一个长着金脑袋、满口金牙的男人，否则我决不结婚。您还是别把希望放在我身上了。
        - id: ch01-b14
          speaker: narrator
          text: >-
            国王气女儿如此固执，可他一向事事顺着她，最后还是颁下告示。谁要是长着金脑袋和金牙齿，谁就能迎娶公主，还能得到贝洛普奥约王国作为嫁妆。
        - id: ch01-b15
          speaker: narrator
          text: >-
            国王有个不共戴天的仇敌，名叫肖拉万特，是个法力高强的魔法师。他听到告示，立刻召来手下的精灵，命令他们把自己的头和牙齿变成金子。精灵说，这超出了他们的本领，不如在他额头上安一对金角，那样既容易做，戴着也舒服。肖拉万特半点不肯让步，硬要一颗纯金脑袋和一口纯金牙齿。
        - id: ch01-b16
          speaker: narrator
          text: >-
            金脑袋装到肩上以后，肖拉万特便到王宫前散步。国王一眼看见苦苦寻找的人，忙叫女儿往窗外看。接着，他朝匆匆走过的魔法师高声喊了起来。
        - id: ch01-b17
          speaker: king
          text: >-
            兄弟，先停一停，别走得那么急！请进王宫来吧。我把女儿嫁给你，还会给她带上随从。你想要多少马匹和仆人，都由你挑。
        - id: ch01-b18
          speaker: scioravante
          text: >-
            多谢陛下，我很乐意娶您的女儿。陪她的人就不必了。给我一匹马，我让公主坐在鞍前，带她回自己的王国。那里朝臣、仆人样样不缺，令爱想要什么都有。
        - id: ch01-b19
          speaker: narrator
          text: >-
            国王起初怎么也不答应女儿这样上路，可肖拉万特最后还是遂了心愿。他把坎内泰拉安置在身前，两人共乘一匹马，朝他的国家去了。
    - id: ch02
      title: 马厩里的囚徒
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            到了傍晚，肖拉万特下马走进一座马厩，把坎内泰拉留在自己坐骑的厩栏里，然后向她下了一道命令。
        - id: ch02-b02
          speaker: scioravante
          text: >-
            你听清楚。我要回家，从这里走到那里要七年。你就留在马厩里等我，一步也不许离开，更不能让任何活人看见你。敢违抗我，你就等着受罚吧。
        - id: ch02-b03
          speaker: cannetella
          text: >-
            先生，我是您的仆人，一定照您的吩咐去做。只是，等您回来的这些年，我要吃什么活下去呢？
        - id: ch02-b04
          speaker: scioravante
          text: >-
            马儿吃剩什么，你就吃什么。
        - id: ch02-b05
          speaker: narrator
          text: >-
            魔法师走后，坎内泰拉悲苦万分，恨自己为什么要来到世上。她终日哭泣，哀叹残酷的命运把她从王宫赶进马厩，把柔软的羽绒垫换成稻草床，又让她从父王桌边的佳肴，沦落到只能吃马儿剩下的东西。
        - id: ch02-b06
          speaker: narrator
          text: >-
            这样的凄惨日子一过就是几个月。每天都有人给马喂食添水，可一切都是看不见的手在做，坎内泰拉始终没见过半个人影。一天，她比平时更加难过，忽然发现墙上有一道小小的裂缝。透过缝隙，她看见一座美丽的花园，里面长着各式各样鲜美的果子，花朵也开得到处都是。那诱人的景色和香气叫饥肠辘辘的她再也忍不住了。
        - id: ch02-b07
          speaker: cannetella
          text: >-
            我要悄悄出去，摘几个橙子和几串葡萄。随它会有什么后果吧！这里没人能告诉我丈夫。就算他知道了，也不可能让我过得比现在更苦。
        - id: ch02-b08
          speaker: narrator
          text: >-
            她溜进花园，摘下果子，让饥饿虚弱的身体恢复了些精神。不料没过多久，肖拉万特突然回来了。一匹马马上向他告状，说妻子趁他不在进了花园，还偷了橙子和葡萄。
        - id: ch02-b09
          speaker: narrator
          text: >-
            肖拉万特勃然大怒，从衣袋里抽出一把大刀，要杀死违抗命令的妻子。坎内泰拉扑倒在他脚边，苦苦求他饶命，还说饥饿连狼也会赶出树林。她哀求了许久，魔法师的心总算稍微软了一点。
        - id: ch02-b10
          speaker: scioravante
          text: >-
            这一次我饶你不死。可要是你再敢违抗，等我回来时，哪怕听说你只迈出过厩栏一步，我也一定杀了你。记住，我又要离开七年。
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: >-
            肖拉万特说完便走了。坎内泰拉泪如雨下，绞着双手，怨恨自己遭遇了这样严酷的命运。
        - id: ch02-b12
          speaker: cannetella
          text: >-
            我为什么偏偏要出生受这些苦？父王啊，您把可怜的女儿害得多惨！不，我又怎能怪父王？这一切都是我自己招来的。是我非要那颗该诅咒的金脑袋，它才给我带来这么多灾祸。我不肯听父王的话，如今受到了惩罚。
          emotion: sad
    - id: ch03
      title: 木桶里的公主
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            一年过去了。国王的箍桶匠有一天正好经过囚禁坎内泰拉的马厩。她认出这个故乡人，便叫他进来。箍桶匠起初认不出眼前这个憔悴的女人，也想不明白是谁在叫自己的名字。等他听完公主从出嫁到受困的悲惨遭遇，便决定救她。一来是可怜这个受苦的姑娘，二来更想借此博得国王的欢心。
        - id: ch03-b02
          speaker: narrator
          text: >-
            箍桶匠把坎内泰拉藏进随身带来的一只空木桶，再把木桶绑上骡背，就这样将公主带回故乡。凌晨四点左右，他们来到王宫门外。箍桶匠用力敲门，仆人们匆匆赶来，只看到他孤零零站在那里，气得把他狠狠骂了一顿，怪他半夜惊醒所有人。
        - id: ch03-b03
          speaker: narrator
          text: >-
            国王听到吵闹，又问清缘由，断定箍桶匠这么早惊动整座王宫，一定有要紧的事，于是召他来见。箍桶匠请求先卸下骡背上的货物。木桶一落地，坎内泰拉便从里面爬了出来。
        - id: ch03-b04
          speaker: narrator
          text: >-
            国王起初根本不相信那是自己的女儿。几年过去，她变得太厉害了，又瘦又苍白，看着叫人心疼。直到公主露出右臂上的一颗痣，他才终于认出，眼前正是失踪多年的坎内泰拉。国王吻了女儿上千遍，马上让人端来最好的食物和饮品。
        - id: ch03-b05
          speaker: king
          text: >-
            亲爱的女儿，谁会想到再见到你时，你竟成了这个样子？告诉父王，究竟是什么把你害得这么惨？
        - id: ch03-b06
          speaker: cannetella
          text: >-
            那个长着金脑袋和金牙齿的恶人，待我连狗都不如。离开您以后，我不知有多少次宁愿死去。所有苦楚真要一一说出来，您一定不会相信。现在我又回到您身边，这就够了。我再也不走了。与其去别处当王后，我宁愿留在您家里做奴隶。
          emotion: sad
        - id: ch03-b07
          speaker: narrator
          text: >-
            与此同时，肖拉万特回到了马厩。一匹马告诉他，坎内泰拉被箍桶匠藏进木桶带走了。魔法师气得发狂，急忙赶往贝洛普奥约。他径直找到住在王宫对面的一位老妇人。
        - id: ch03-b08
          speaker: scioravante
          text: >-
            只要你能让我看见国王的女儿，无论想要什么报酬，我都给你。
        - id: ch03-b09
          speaker: narrator
          text: >-
            老妇人开口便要一百枚金达克特。肖拉万特从钱袋里一枚枚数出，毫无怨言地交给她。收下金币以后，她带魔法师登上自家屋顶。从那里望过去，正好能看见坎内泰拉在王宫顶层的房间里梳理长发。
        - id: ch03-b10
          speaker: narrator
          text: >-
            坎内泰拉碰巧望向窗外，一眼看见丈夫正盯着自己。她吓得飞奔下楼，冲到父亲面前。
        - id: ch03-b11
          speaker: cannetella
          text: >-
            父王陛下，快把我锁进一间装有七道铁门的屋子！要不然，我就没命了！
          emotion: fearful
        - id: ch03-b12
          speaker: king
          text: >-
            如果只需这样，我马上叫人照办。
        - id: ch03-b13
          speaker: narrator
          text: >-
            国王立刻下令，把七道铁门一一关紧。肖拉万特看在眼里，又回到老妇人那里，许诺只要她再办一件事，仍然可以随意索取报酬。
    - id: ch04
      title: 七道铁门
      blocks:
        - id: ch04-b01
          speaker: scioravante
          text: >-
            你进王宫，藏到公主床下，再把这张小纸片塞进她的枕头底下。放进去时，你就念：“愿王宫里除公主以外的所有人，都沉沉睡去。”
        - id: ch04-b02
          speaker: narrator
          text: >-
            老妇人又索要一百枚金达克特，随后进宫照办。她藏在床下，把纸片塞进坎内泰拉的枕头底下。
        - id: ch04-b03
          speaker: old_woman
          text: >-
            愿王宫里除公主以外的所有人，都沉沉睡去。
        - id: ch04-b04
          speaker: narrator
          text: >-
            咒语刚出口，王宫里所有人都陷入沉睡，只有公主依然清醒。肖拉万特赶到紧闭的铁门前，把七道门一扇接一扇地打开。
        - id: ch04-b05
          speaker: narrator
          text: >-
            坎内泰拉看见丈夫闯进来，吓得尖声大叫。可王宫上下全都睡得如同死人，没有一个人能听见，也没有一个人来救她。魔法师一把抓住躺在床上的公主，正准备把她劫走。就在这时，老妇人先前塞在枕头下面的那张小纸片忽然滑落，掉到了地上。
        - id: ch04-b06
          speaker: narrator
          text: >-
            一瞬间，王宫里的人全醒了。坎内泰拉仍在高声呼救，众人纷纷冲进房间，抓住肖拉万特，将他处死。魔法师设下陷阱，本想捉住公主，最后掉进陷阱的却是他自己。世上的事常常如此，想咬人的，反倒挨了一口。
