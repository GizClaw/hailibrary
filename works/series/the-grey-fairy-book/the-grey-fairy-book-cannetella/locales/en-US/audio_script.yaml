  chapters:
    - id: ch01
      title: The Husband Cannetella Chose
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There was once a king who ruled a country called Bello Puojo. He was rich and powerful, and he had everything he could want except a child. Then, after he and his wife Renzolla had been married for many years, a daughter was born to them. By that time, the king was quite an old man. They named the baby Cannetella.
        - id: ch01-b02
          speaker: narrator
          text: Cannetella grew into a beautiful girl, tall and straight as a young fir tree. When she turned eighteen, her father called her to him. He loved her more than anything in the world, so he meant to let her choose her own husband.
        - id: ch01-b03
          speaker: king
          text: You are old enough to marry now, my daughter. Choose the man you truly want, and I will be satisfied with your choice. All I want is for you to be happy.
        - id: ch01-b04
          speaker: narrator
          text: Cannetella thanked him for his kindness, but said she had no wish to marry at all. She had decided to remain single. The king was growing old and weak, and he longed to see an heir to the throne before he died. Her answer made him deeply unhappy, and he begged her not to disappoint him.
        - id: ch01-b05
          speaker: cannetella
          text: Very well, dear father. I will marry to please you, because you have always loved me and been kind to me. But you must find me a husband who is more handsome, clever, and charming than anyone else in the world.
        - id: ch01-b06
          speaker: narrator
          text: The king was delighted. From early morning until late at night, he sat by the window studying everyone who passed, hoping one of them might become his son-in-law. One day, he saw a very good-looking man crossing the street.
        - id: ch01-b07
          speaker: king
          text: Come quickly, Cannetella. Look at this man. I think he might make you a fine husband.
        - id: ch01-b08
          speaker: narrator
          text: The young man was invited into the palace, where they served him a splendid feast filled with every delicacy imaginable. Halfway through the meal, an almond dropped out of his mouth. He snatched it up at once and hid it beneath the tablecloth. After he had gone, the king asked his daughter what she thought of him.
        - id: ch01-b09
          speaker: cannetella
          text: He is a clumsy wretch. Imagine a grown man letting an almond fall out of his mouth!
        - id: ch01-b10
          speaker: narrator
          text: So the king went back to watching from the window. Before long, another very handsome young man passed beneath it, and the king called Cannetella again.
        - id: ch01-b11
          speaker: cannetella
          text: Invite him in. We need to see him close by.
        - id: ch01-b12
          speaker: narrator
          text: A second splendid feast was prepared. The stranger ate and drank all he could, then took his leave. Again, the king asked Cannetella whether she liked this guest.
        - id: ch01-b13
          speaker: cannetella
          text: Not at all. What use is a man who needs at least two servants to put on his cloak because he cannot manage it himself?
        - id: ch01-b14
          speaker: king
          text: If that is your only complaint, then I understand you now. You mean to reject every husband. But you will marry someone. I will not let my name and my royal house die with me.
        - id: ch01-b15
          speaker: cannetella
          text: Then you had better stop counting on me, dear father. I will never marry unless I find a man with a head of gold and teeth of gold.
        - id: ch01-b16
          speaker: narrator
          text: Her stubborn answer made the king very angry. Still, he had always allowed Cannetella to have her way. He sent a proclamation throughout the land. Any man with a golden head and golden teeth could claim the princess as his bride, and receive the kingdom of Bello Puojo as a wedding gift.
        - id: ch01-b17
          speaker: narrator
          text: Now the king had a deadly enemy named Scioravante, a magician of enormous power. As soon as he heard the proclamation, he summoned his attendant spirits and ordered them to cover his head and teeth with gold. At first they said this was beyond their power. They suggested golden horns on his forehead instead, since those would be easier to make and more comfortable to wear. Scioravante refused any compromise. He demanded a head and teeth made from the finest gold.
        - id: ch01-b18
          speaker: narrator
          text: Once the golden head was fixed upon his shoulders, Scioravante strolled past the palace. The king saw exactly the sort of man he had been seeking and called his daughter to the window.
        - id: ch01-b19
          speaker: king
          text: Look down there. At last, there is exactly what you asked for.
        - id: ch01-b20
          speaker: narrator
          text: Scioravante was hurrying by, so the king shouted after him.
        - id: ch01-b21
          speaker: king
          text: Stop a moment, brother. There is no need to rush away. Come inside and you may marry my daughter. I will send attendants with her, along with all the horses and servants you could wish for.
        - id: ch01-b22
          speaker: scioravante
          text: A thousand thanks. I will gladly marry your daughter, but she needs no escort. Give me one horse, and I will carry the princess before me in the saddle. In my own kingdom, she will have courtiers, servants, and everything else she desires.
        - id: ch01-b23
          speaker: narrator
          text: At first, the king strongly opposed sending Cannetella away like that. In the end, Scioravante got what he wanted. He set the princess in front of him on his horse and rode away toward his own country.
    - id: ch02
      title: The Prisoner in the Stable
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Toward evening, Scioravante dismounted beside a stable. He put Cannetella into the very same stall as his horse and gave her his orders.
        - id: ch02-b02
          speaker: scioravante
          text: Listen carefully. I am going home, and my home is seven years away from here. Stay in this stable until I return. Do not leave this spot, and do not let any living soul see you. If you disobey me, you will suffer for it.
        - id: ch02-b03
          speaker: cannetella
          text: Sir, I am your servant, and I will obey you exactly. But what am I supposed to eat until you come back?
        - id: ch02-b04
          speaker: scioravante
          text: Eat whatever the horses leave behind.
        - id: ch02-b05
          speaker: narrator
          text: After the magician left, Cannetella was miserable. She wept and bitterly cursed the day she had been born. A cruel turn of fate had taken her from a palace to a stable, from soft cushions to a bed of straw, and from her father's fine table to scraps left by horses.
        - id: ch02-b06
          speaker: narrator
          text: She lived that wretched way for several months. She never saw anyone feed or water the horses. Invisible hands did all the work.
        - id: ch02-b07
          speaker: narrator
          text: One day, when she felt even unhappier than usual, Cannetella noticed a small crack in the wall. Through it, she could see a beautiful garden full of delicious fruits and flowers. The sight and smell were more than the hungry princess could bear.
        - id: ch02-b08
          speaker: cannetella
          text: I am going to slip out quietly and pick a few oranges and grapes. I no longer care what happens. Who could tell my husband? And even if he finds out, he cannot make my life worse than it is now.
        - id: ch02-b09
          speaker: narrator
          text: She crept into the garden and fed her poor, starving body with the fruit she picked there. But soon afterward, her husband came back without warning. One of the horses told him at once what Cannetella had done while he was away.
        - id: ch02-b10
          speaker: horse
          text: Cannetella left the stable. She went into the garden and stole oranges and grapes.
        - id: ch02-b11
          speaker: narrator
          text: Scioravante flew into a rage. He pulled a huge knife from his pocket and threatened to kill his wife for disobeying him. Cannetella threw herself at his feet and begged him to spare her.
        - id: ch02-b12
          speaker: cannetella
          text: Please, do not kill me. I was starving. Hunger will even drive a wolf out of the woods.
          emotion: fearful
        - id: ch02-b13
          speaker: narrator
          text: At last, her pleading softened him just enough to save her life.
        - id: ch02-b14
          speaker: scioravante
          text: I will forgive you once. But if you disobey me again, or I return and hear that you moved even one step outside this stall, I will kill you. Remember my warning. I am leaving again, and this time I will be gone for seven years.
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: With that, he departed. Cannetella burst into tears. She wrung her hands and mourned the choice that had brought her there.
        - id: ch02-b16
          speaker: cannetella
          text: Why was I born to suffer such a fate? Oh, Father, how miserable you have made your poor daughter! No, I should not blame him. I have only myself to blame. I demanded that cursed golden head, and it has brought me nothing but misery. This is my punishment for refusing what my father wanted.
          emotion: sad
    - id: ch03
      title: The Cooper's Barrel
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A year passed. Then one day, the king's cooper happened to go by the stables where Cannetella was imprisoned. She recognized him and called him inside. At first, he did not recognize the thin, unhappy woman before him. He could not imagine who knew his name in that lonely place.
        - id: ch03-b02
          speaker: narrator
          text: Cannetella told him who she was and described all she had suffered. The cooper hid her inside a large empty barrel he was carrying. He did it partly because he pitied the princess, and even more because he hoped to earn the king's favor. He loaded the barrel onto his mule, and Cannetella began her journey home.
        - id: ch03-b03
          speaker: narrator
          text: They reached the palace at about four in the morning. The cooper hammered loudly on the door. Servants hurried to the gate, but when they found only the cooper there, they scolded him for waking the whole household at such an hour.
        - id: ch03-b04
          speaker: narrator
          text: The king heard the noise and learned what had caused it. He was certain the cooper would never disturb the palace so early without important business, so he ordered the man to be brought before him.
        - id: ch03-b05
          speaker: cooper
          text: Your Majesty, may I have permission to unload my mule?
        - id: ch03-b06
          speaker: narrator
          text: The king gave permission, and Cannetella climbed out of the barrel. At first, her own father would not believe she was truly his daughter. In the years since he had seen her, she had grown so thin and pale that the sight of her was pitiful.
        - id: ch03-b07
          speaker: narrator
          text: Then Cannetella showed him a mole on her right arm. At last, the king knew that this poor woman really was his long-lost child. He kissed her a thousand times and immediately ordered the finest food and drink to be set before her.
        - id: ch03-b08
          speaker: narrator
          text: When Cannetella had eaten enough to satisfy her hunger, her father asked how she had come to such a terrible state.
        - id: ch03-b09
          speaker: king
          text: My dear daughter, who could ever have imagined finding you like this? Please tell me what happened to you.
        - id: ch03-b10
          speaker: cannetella
          text: That wicked man with the golden head and teeth treated me worse than a dog. Since I left you, I have often wished I could die. You would never believe all I have suffered, even if I could tell it. What matters is that I am home with you again. I will never leave. I would rather be a servant in your house than a queen anywhere else.
          emotion: sad
    - id: ch04
      title: The Magician at the Window
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Meanwhile, Scioravante returned to the stables. One of the horses told him that a cooper had carried Cannetella away inside a barrel.
        - id: ch04-b02
          speaker: horse
          text: A cooper came here with a barrel. He hid Cannetella inside it and took her away.
        - id: ch04-b03
          speaker: narrator
          text: The wicked magician was beside himself with rage. He hurried to Bello Puojo and went straight to the home of an old woman who lived directly across from the royal palace.
        - id: ch04-b04
          speaker: scioravante
          text: Let me see the king's daughter, and I will pay any reward you ask.
        - id: ch04-b05
          speaker: old_woman
          text: Then I want one hundred gold ducats.
        - id: ch04-b06
          speaker: narrator
          text: Scioravante counted out the hundred ducats without a complaint. The old woman led him up to her roof. From there, he could see Cannetella in a room at the top of the palace, combing her long hair.
        - id: ch04-b07
          speaker: narrator
          text: Cannetella happened to glance through the window. The moment she saw her husband staring at her, terror seized her. She flew downstairs to the king.
        - id: ch04-b08
          speaker: cannetella
          text: My lord and father, lock me away at once behind seven iron doors. If you do not, I am lost!
          emotion: fearful
        - id: ch04-b09
          speaker: king
          text: If seven iron doors are all you need, then it will be done immediately.
        - id: ch04-b10
          speaker: narrator
          text: The king gave the order, and all seven doors were shut at once. When Scioravante saw what had happened, he went back to the old woman with another offer.
        - id: ch04-b11
          speaker: scioravante
          text: Name your price again. Go into the palace and hide beneath the princess's bed. Slip this small piece of paper under her pillow. As you place it there, say, “May everyone in the palace, except the princess, fall into a deep sleep.”
        - id: ch04-b12
          speaker: old_woman
          text: I want another hundred gold ducats.
        - id: ch04-b13
          speaker: narrator
          text: Scioravante paid her, and the old woman went to carry out his command. She entered the palace, hid beneath Cannetella's bed, and pushed the little paper under the princess's pillow.
        - id: ch04-b14
          speaker: old_woman
          text: May everyone in the palace, except the princess, fall into a deep sleep.
        - id: ch04-b15
          speaker: narrator
          text: At once, every person in the palace fell fast asleep. Cannetella alone remained awake.
    - id: ch05
      title: The Trap Closes
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Scioravante hurried to the seven iron doors and opened them, one after another. Cannetella screamed in terror when her husband appeared, but no one came to help her. Everyone else in the palace lay still, as though dead.
        - id: ch05-b02
          speaker: narrator
          text: The magician seized Cannetella where she lay on the bed. He was about to carry her away when the little piece of paper beneath her pillow slipped free and fell to the floor.
        - id: ch05-b03
          speaker: narrator
          text: In that instant, all the people in the palace woke. Cannetella was still screaming for help, and they rushed to rescue her. They caught Scioravante and put him to death.
        - id: ch05-b04
          speaker: narrator
          text: So the magician was caught in the very trap he had set for the princess. As so often happens in this world, the biter himself was bit.
