  chapters:
    - id: ch01
      title: Janni Finds the Castle
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man who kept away from the world and lived in the wilderness. He owned only a flock of sheep. Their milk and wool bought his bread, and he also made wooden spoons to sell. He had a wife and a little daughter. Long afterward, another child was born to them.
        - id: ch01-b02
          speaker: narrator
          text: That evening, the man set off for the nearest village to find a nurse. Along the road he met a monk who asked for a place to sleep, and the man gladly took him home. No one else lived nearby who could baptize the baby, so the monk performed the baptism and named the boy Janni.
        - id: ch01-b03
          speaker: narrator
          text: In time, both parents died. Janni and his sister were left alone, and before long they could no longer manage at home. They decided to go out into the world and seek their fortune. While they were packing, the sister found a knife the monk had left for his godson, and she gave it to Janni.
        - id: ch01-b04
          speaker: narrator
          text: All that remained of the flock was three sheep, so they took those along. After three days on the road, they met a man leading three dogs. He offered to trade the dogs for the sheep. Janni and his sister liked the bargain, made the exchange, and went on their way.
        - id: ch01-b05
          speaker: narrator
          text: At last they reached a great castle where forty Draken lived. The moment those creatures heard that Janni had arrived, they fled forty fathoms beneath the ground. Janni found the castle empty and settled there with his sister. Every day he took the weapons the Draken had left behind and went hunting with his three dogs.
        - id: ch01-b06
          speaker: narrator
          text: One day, while Janni was away, one Drakos came up in search of food. He did not know anyone had entered the castle, and the sight of Janni's sister terrified him. She told him there was nothing to fear. Soon they fell in love. Whenever Janni went hunting, she called the Drakos up from underground. In the end, they married without Janni knowing. Only then did his sister regret it and begin to fear what Janni would do when he learned the truth.
    - id: ch02
      title: The Garden of Cherries
      blocks:
        - id: ch02-b01
          speaker: drakos
          text: Pretend you're ill. When Janni asks what's wrong and what you need, tell him you want cherries. Say they grow in a garden one day's journey from here. He'll go, but he won't return. Three of my brothers live there, and they'll take care of him.
        - id: ch02-b02
          speaker: narrator
          text: Janni's sister followed his instructions. She pretended to be sick, asked Janni for cherries, and told him about the garden a day's journey away. The next day, Janni set out with all three dogs. When he reached the garden, he dismounted and drank from the spring that rose there. At once he sank into a deep sleep.
        - id: ch02-b03
          speaker: narrator
          text: The three Draken gathered around to eat him, but the dogs threw themselves upon the creatures and tore them to pieces. Then the dogs scratched out a grave with their paws and buried the bodies so their master would never see them.
        - id: ch02-b04
          speaker: narrator
          text: When Janni woke, he saw blood all over the dogs. He thought they had killed some wild beast while he slept, and he was angry that they had saved none of it for him. Still, he picked the cherries and carried them home.
        - id: ch02-b05
          speaker: narrator
          text: The Drakos heard that Janni had returned and fled in terror forty fathoms underground. Janni's sister ate the cherries and announced that she was well again.
    - id: ch03
      title: The Garden of Quinces
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next day, after Janni left to hunt, the Drakos came back. He told the sister to feign illness once more. This time she must ask for quinces from a garden two days away. Six of his brothers lived there, and every one of them had two heads. Surely, he said, they would destroy Janni.
        - id: ch03-b02
          speaker: narrator
          text: Again the sister did exactly as she was told. She acted ill and asked for quinces, directing Janni to the garden two days away. Once more, he started out with his three dogs. At the quince garden, he got down from his horse, sat to rest, and fell fast asleep.
        - id: ch03-b03
          speaker: narrator
          text: First three Draken came to eat him, and the dogs killed them. Then three more arrived, and the dogs killed those as well. Once again, the dogs dug a grave and hid every body from their master.
        - id: ch03-b04
          speaker: narrator
          text: Janni awoke to find the dogs covered in blood. Just as before, he supposed they had killed a wild animal and left him none of it. He scolded them, gathered the quinces, and returned to the castle. His sister ate the fruit and said she felt better.
        - id: ch03-b05
          speaker: narrator
          text: When the Drakos learned that Janni had come safely home, he fled in fear another forty fathoms deeper into the earth.
    - id: ch04
      title: The Garden of Pears
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On the following day, while Janni hunted, the Drakos visited the sister yet again. He told her to pretend she was ill and ask for pears from a garden three days beyond the castle. Nine of his brothers lived there, each with three heads. From that journey, he was certain Janni could never return.
        - id: ch04-b02
          speaker: narrator
          text: The sister obeyed. She pretended to be ill and begged for the pears, telling Janni they grew three days from the castle. The next morning, he took his dogs and rode away. When he reached the garden, he lay down to rest and soon fell asleep.
        - id: ch04-b03
          speaker: narrator
          text: Three Draken came first, ready to eat him, and the dogs killed them. Then six more rushed in. They fought the dogs for a long time, until the noise of the battle woke Janni. He rose and slew the Draken himself. At last he understood why his faithful dogs had been stained with blood.
        - id: ch04-b04
          speaker: narrator
          text: Janni freed everyone the Draken had kept prisoner. Among them was a king's daughter. She was so grateful that she wanted to marry him, but Janni would not accept her offer.
        - id: ch04-b05
          speaker: janni
          text: If you wish to repay the help I gave you, welcome every blind or lame traveler who comes through this castle.
        - id: ch04-b06
          speaker: narrator
          text: The princess promised she would. Before Janni left, she gave him a ring. He picked the pears and brought them home to his sister. She ate them and declared herself better.
        - id: ch04-b07
          speaker: narrator
          text: For the third time, the Drakos heard that Janni had returned safe and sound. He fled in fright another forty fathoms down. The next day, while Janni was hunting, he crept out to speak with the sister.
        - id: ch04-b08
          speaker: drakos
          text: Now we're both lost unless you discover where his strength comes from. Once we know that, the two of us can find a way to get rid of him.
          emotion: fearful
    - id: ch05
      title: Janni Loses His Sight
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: That evening, Janni returned from the hunt and sat with his sister beside the fire. She asked him to tell her where his strength lay.
        - id: ch05-b02
          speaker: janni
          text: My strength is in my two fingers. If someone binds them together, every bit of my strength is gone.
        - id: ch05-b03
          speaker: sister
          text: I won't believe that unless you show me.
        - id: ch05-b04
          speaker: narrator
          text: Janni let her tie his fingers together with a thread. The moment she did, he became powerless. His sister called the Drakos up from below. The creature tore out Janni's eyes, gave them to the dogs to eat, and threw Janni into a dry well.
        - id: ch05-b05
          speaker: narrator
          text: Some travelers later came to draw water from that well. They heard Janni groaning at the bottom and stepped closer.
        - id: ch05-b06
          speaker: traveler
          text: Where are you?
        - id: ch05-b07
          speaker: janni
          text: I'm down in the well. Please pull me out. I'm a poor, unfortunate man.
        - id: ch05-b08
          speaker: narrator
          text: The travelers lowered a rope and hauled him into the daylight. Only then did Janni realize he was blind.
        - id: ch05-b09
          speaker: janni
          text: Please lead me to the kingdom of the princess I once rescued. You'll be well rewarded for helping me.
        - id: ch05-b10
          speaker: narrator
          text: They brought him there, and Janni sent a message asking the princess to come. She did not recognize him. Then he showed her the ring she had given him, and she remembered at once. She took him into the castle.
    - id: ch06
      title: The Eyes Restored
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: When the princess heard what had happened, she summoned every sorceress in the country and asked where Janni's eyes might be. At last, one of them said she knew where the eyes were and could restore them.
        - id: ch06-b02
          speaker: sorceress
          text: I know where his eyes are, and I can give him his sight again.
        - id: ch06-b03
          speaker: narrator
          text: The sorceress went straight to the castle where the sister and the Drakos lived. She fed the dogs something that made the eyes reappear. Then she carried them away and set them back into Janni's head. He could see as well as he ever had before.
        - id: ch06-b04
          speaker: narrator
          text: Janni returned to the Drakos's castle. He killed the Drakos and his own sister. Then he took his three dogs, went back to the princess, and married her at once.
