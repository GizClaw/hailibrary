audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的诙谐
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    janni:
      display_name: 雅尼
      tts:
        delivery: 质朴勇敢，说话坦率真诚
        timbre: 清朗结实
        pace: 适中
        pitch: 中低音
    sister:
      display_name: 雅尼的姐姐
      tts:
        delivery: 起初温和，隐瞒时试探而心虚
        timbre: 柔和清晰
        pace: 适中
        pitch: 中音
    drakos:
      display_name: 食人魔
      tts:
        delivery: 阴险狠毒，谋划时压低声音
        timbre: 粗沉暗哑
        pace: 稍缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 荒野里的姐弟
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个男人远离人群，独自住在荒野。他靠一群羊过活，卖羊奶，卖羊毛，也挑着木勺出去卖。家中原有一个女儿，过了许多年，妻子又生下一个男孩。孩子出生那晚，男人去邻村请乳母，半路遇到一位求宿的修士，便把他带回了家。附近没人能替孩子施洗，修士就为他举行了仪式，给他取名雅尼。
        - id: ch01-b02
          speaker: narrator
          text: >-
            岁月过去，父母相继去世，雅尼和姐姐成了世上无依无靠的两个人。家里的日子很快就过不下去了，他们只好离开故乡，到远方碰碰运气。收拾行李时，姐姐从旧东西里找出一把刀。这是当年那位修士留给教子的，她便交给了雅尼。姐弟俩赶着仅剩的三只羊上路。走到第三天，他们碰见一个带着三条狗的男人。那人想拿狗换羊，姐弟俩都觉得合算。双方换过牲畜，就朝不同的方向离去了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            两人继续赶路，最后来到一座大城堡。堡里住着四十个食人魔，可他们一听雅尼来了，竟全都吓跑，藏进地下四十寻深的地方。雅尼发现城堡里一个人影也没有，就和姐姐住了进去。食人魔留下许多兵器，他每天选上几件，带着三条狗到外面打猎。
        - id: ch01-b04
          speaker: narrator
          text: >-
            一天，雅尼又去打猎了。一个食人魔不知道堡里住进了人，爬上来取食物。他猛然看见雅尼的姐姐，反倒怕得要命。姑娘告诉他不用害怕。此后每逢雅尼出门，她就把食人魔唤上来。两人一次次相会，渐渐相爱，最后瞒着雅尼结成夫妻。婚已经成了，姐姐却后悔起来。她越想越怕，不知道弟弟发现真相以后，会发多大的火。
        - id: ch01-b05
          speaker: drakos
          text: >-
            你装作生病。雅尼问你想吃什么，你就说要樱桃。他若问哪里有，就说离这里一天路程的花园里有。他到了那里，再也别想回来。我的三个兄弟自然会好好招待他。
    - id: ch02
      title: 三座果园
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            姐姐照办了。第二天，雅尼带着三条狗出发去摘樱桃。到了果园，他跳下马，喝了几口园中涌出的泉水，马上沉沉睡去。三个食人魔围上来，正要把他吃掉，三条狗猛扑过去，把他们撕成碎片。狗儿们又用爪子刨出一个坑，埋掉尸首，免得主人醒来看见。雅尼醒来，只见它们浑身是血，还以为狗儿在别处猎到了野兽，却没给自己留下一口肉，气得责怪了它们。他摘好樱桃，回去交给姐姐。
        - id: ch02-b02
          speaker: narrator
          text: >-
            食人魔听说雅尼活着回来，吓得躲到地下四十寻。姐姐吃过樱桃，也说病好了。可第二天雅尼一走，食人魔又爬出来，要她再装一次病。这回她得说想吃榅桲，还要告诉弟弟，榅桲园在两天路程以外。那里住着食人魔的六个兄弟，每个都长着两个脑袋。他认定雅尼这一次必死无疑。
        - id: ch02-b03
          speaker: narrator
          text: >-
            姐姐又照着他说的做。第二天，雅尼带上三条狗，走了两天来到果园。他下马坐着歇了一会儿，不知不觉睡熟了。先有三个食人魔围上来，被三条狗咬死。随后又来三个，同样没有逃脱。狗儿照旧刨出坟坑，把六具尸首全埋起来。雅尼醒来，看见它们满身是血，又以为狗儿杀了野兽，却什么也没给他留。他虽然生气，仍旧摘下榅桲带回家。姐姐吃了果子，说自己好多了。食人魔听见这个消息，只得再往地下逃四十寻。
        - id: ch02-b04
          speaker: narrator
          text: >-
            第三次，食人魔叫姐姐装病讨梨。梨园离城堡有三天路程，住在那里的是他的九个兄弟，每一个都生着三个脑袋。姐姐还是照办。第二天，雅尼带着三条狗走进梨园，躺下休息，不久又睡着了。先来的三个食人魔被狗咬死，后来的六个却同三条狗恶斗了很久。厮杀声终于惊醒雅尼。他跳起来，亲手杀掉剩下的食人魔，这才明白狗儿们先前为什么总是满身鲜血。
    - id: ch03
      title: 公主的戒指
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            雅尼释放了所有被关押的人，其中还有一位公主。公主感激救命之恩，愿意嫁给他，雅尼却谢绝了。
        - id: ch03-b02
          speaker: janni
          text: >-
            你若想报答我，就留在这座城堡里。以后凡有盲人或跛子从这里经过，请你接济他们。
        - id: ch03-b03
          speaker: narrator
          text: >-
            公主答应了。雅尼告辞时，她送给他一枚戒指。雅尼这才摘下梨子，带回去给姐姐。姐姐吃完，又说自己的病好了。食人魔得知雅尼第三次平安回来，吓得再往地下逃了四十寻。第二天，雅尼出门打猎，他才偷偷爬上来找姐姐。
        - id: ch03-b04
          speaker: drakos
          text: >-
            这回我们两个真的要完了。你非得套出他的力气藏在哪里。只要问到答案，我们就能一起除掉他。
        - id: ch03-b05
          speaker: narrator
          text: >-
            晚上，雅尼打猎归来，和姐姐坐在火边。姐姐缠着他追问，他便说出了秘密。
        - id: ch03-b06
          speaker: janni
          text: >-
            我的力气就在两根手指里。只要把它们绑在一起，我就一点力气也没有了。
        - id: ch03-b07
          speaker: sister
          text: >-
            光听你说，我可不信。除非你现在做给我看。
    - id: ch04
      title: 枯井中的雅尼
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            雅尼没有怀疑，真让姐姐拿一根线绑住自己的两根手指。线刚系好，他果然立刻软弱无力。姐姐马上唤来食人魔。食人魔从地下爬出来，挖掉雅尼的双眼，扔给三条狗吃，又把他丢进一口枯井。
        - id: ch04-b02
          speaker: narrator
          text: >-
            后来，几个旅人到井边打水，听见井底传来呻吟。他们凑到井口，问那人身在何处。雅尼说自己遭了大难，是个可怜的不幸之人，求他们把自己拉上去。旅人放下一根绳子，将他拉回天光之下。直到这个时候，雅尼才发觉自己已经什么也看不见了。
        - id: ch04-b03
          speaker: janni
          text: >-
            请带我去那位公主父亲的国家吧。我曾救过他的女儿，你们一定会得到重谢。
        - id: ch04-b04
          speaker: narrator
          text: >-
            旅人答应了，把雅尼送到那个国家。到了那里，雅尼请人叫来公主。公主看着眼前这个双目失明的人，怎么也没有认出他。直到雅尼拿出她亲手送的戒指，她才记起自己的恩人，把他带进城堡。
    - id: ch05
      title: 失而复得的双眼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            公主听完雅尼遭遇的一切，立刻把全国的女巫全召集起来，要她们说出那双眼睛在什么地方。她问了一个又一个，最后终于找到一位女巫。这个女巫说，她既知道眼睛的下落，也有办法把它们复原。
        - id: ch05-b02
          speaker: narrator
          text: >-
            女巫径直赶到姐姐和食人魔居住的城堡，拿一样东西喂给三条狗。雅尼的双眼重新出现了。她把眼睛带回去，放进雅尼的眼眶，他立刻又能像从前一样看见东西。
        - id: ch05-b03
          speaker: narrator
          text: >-
            雅尼回到食人魔的城堡，杀了食人魔，也杀了背叛他的姐姐。随后，他带着三条狗回到公主身边。两人没有再等待，马上举行了婚礼。
