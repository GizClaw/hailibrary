    boy_2:
      display_name: 男孩乙
      tts:
        delivery: 活泼急切，和兄弟们齐声时自然
        timbre: 明亮
        pace: 稍快
        pitch: 高音
    boy_3:
      display_name: 男孩丙
      tts:
        delivery: 直率好奇，和兄弟们齐声时清楚
