  chapters:
    - id: ch01
      title: The Three Flowers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There once was a woman with three daughters, and she loved them dearly. One day, the eldest daughter was walking through a water-meadow. She saw a pink growing in the stream and bent to pick it. The instant her fingers touched the flower, she vanished.
        - id: ch01-b02
          speaker: narrator
          text: The next morning, the second sister went to the meadow to look for some sign of the missing girl. A branch covered in lovely roses trailed across her path. She bent to move it, but the flowers were so tempting that she plucked one. In that moment, she disappeared too.
        - id: ch01-b03
          speaker: narrator
          text: The youngest sister wondered where the other two had gone, so she followed their footsteps. A branch of sweet white jessamine caught her eye, and she became its victim. Now the mother had no daughters left at all.
        - id: ch01-b04
          speaker: narrator
          text: The poor woman wept through every day and every night. She wept for so many years that her son, who had been a little boy when his sisters vanished, grew into a tall young man. At last, one night, he asked why she was so unhappy.
        - id: ch01-b05
          speaker: narrator
          text: His mother told him the whole story.
        - id: ch01-b06
          speaker: young_man
          text: Give me your blessing, Mother. I'll search the whole world until I find my sisters.
        - id: ch01-b07
          speaker: narrator
          text: He set off. After several uneventful miles, he found three big boys fighting in the road. He stopped and asked what the quarrel was about. One boy answered him.
        - id: ch01-b08
          speaker: first_boy
          text: My lord, when our father died, he left us a pair of boots, a key, and a cap. Put on the boots, wish to be somewhere, and they'll carry you there. The key opens every door in the world. The cap makes whoever wears it invisible. Our eldest brother wants all three, but we want to draw lots for them.
        - id: ch01-b09
          speaker: young_man
          text: I can settle that. I'll throw this stone as far as I can. Whoever brings it back first gets all three things.
        - id: ch01-b10
          speaker: narrator
          text: He hurled the stone. While the three brothers raced after it, the young man took the cap and key, then quickly pulled on the boots.
        - id: ch01-b11
          speaker: young_man
          text: Boots, take me to the place where I'll find my eldest sister.
    - id: ch02
      title: The King of the Birds
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: In the next instant, he stood on a steep mountain before a strong castle. Bolts, bars, and iron chains guarded its gates. He had remembered to slip the key into his pocket, and it opened each door in turn. He crossed hall after hall and corridor after corridor until he met a beautiful young lady in rich clothes. She started back when she saw him.
        - id: ch02-b02
          speaker: eldest_sister
          text: Oh, sir! How in the world did you get inside?
          emotion: surprised
        - id: ch02-b03
          speaker: narrator
          text: The young man told her that he was her brother and explained how he had passed through the doors. She told him that her life was happy in every way but one. Her husband was under a spell, and it could not be broken until someone killed a man who could not die.
        - id: ch02-b04
          speaker: narrator
          text: They talked for a long while. Then his sister warned him to leave. Her husband might return at any moment, and she did not know how he would feel about finding a stranger there. But her brother told her not to worry. His cap could hide him from sight.
        - id: ch02-b05
          speaker: narrator
          text: They were still talking when the door flew open and a bird came into the room. At the first sound, the young man put on his cap, so the bird saw nothing strange. His sister sprang up and brought out a large golden basin. The bird flew into it and came out again as a handsome man.
        - id: ch02-b06
          speaker: king_of_birds
          text: I know someone else is in this room!
        - id: ch02-b07
          speaker: narrator
          text: His wife was frightened. She insisted she was alone, but he would not believe her. At last, she confessed.
        - id: ch02-b08
          speaker: king_of_birds
          text: If he truly is your brother, why did you hide him? I think you're lying. If he comes back, I'll kill him!
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: The young man removed his cap and stepped forward. The husband saw how closely the brother and sister resembled each other. He no longer doubted his wife's story, and he embraced his brother-in-law with delight. Then he pulled a feather from his bird skin.
        - id: ch02-b10
          speaker: king_of_birds
          text: If you're ever in danger, call, “Come and help me, King of the Birds!” Then everything will go well for you.
        - id: ch02-b11
          speaker: narrator
          text: The young man thanked him and left the castle. Once outside, he spoke to the boots again.
        - id: ch02-b12
          speaker: young_man
          text: Take me to the place where my second sister lives.
    - id: ch03
      title: The King of the Fishes
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Once again, he found himself outside a huge castle. His second sister was within. She was very happy with her husband, who loved her dearly, but she longed for the spell on him to end. It forced him to spend half his life as a fish.
        - id: ch03-b02
          speaker: narrator
          text: His wife introduced the young man as her brother, and her husband welcomed him warmly. Then he gave his brother-in-law a fish scale.
        - id: ch03-b03
          speaker: king_of_fishes
          text: If danger finds you, call, “Come and help me, King of the Fishes!” Then everything will go well for you.
        - id: ch03-b04
          speaker: narrator
          text: The young man thanked him and took his leave. Beyond the castle gates, he ordered the boots to carry him to his youngest sister.
        - id: ch03-b05
          speaker: narrator
          text: They brought him to a dark cavern reached by iron steps. His sister sat inside, sobbing. She had done nothing but weep during all her years there, and she had grown terribly thin. The moment she saw a man before her, she leaped to her feet.
        - id: ch03-b06
          speaker: youngest_sister
          text: Whoever you are, please save me! Take me away from this dreadful place!
        - id: ch03-b07
          speaker: narrator
          text: He told her that he was her brother. He had already found their two sisters, he said, though the happiness of both was shadowed by the spells on their husbands. Then the youngest sister told him her own story.
        - id: ch03-b08
          speaker: narrator
          text: A horrible monster had carried her away from the water-meadow. He meant to force her to marry him, and because she refused, he had held her prisoner all these years. Every day, he begged her to give in. He always reminded her that she could never escape, because he would never abandon his wish and he could never die.
        - id: ch03-b09
          speaker: narrator
          text: That made the young man think of his two enchanted brothers-in-law. He advised his sister to promise the old monster that she would marry him, but only if he explained why he could never die.
        - id: ch03-b10
          speaker: narrator
          text: Suddenly, everything shook as though a whirlwind had seized it. The old monster came in and threw himself at the girl's feet.
        - id: ch03-b11
          speaker: monster
          text: Are you still set on refusing me? Then you'll sit here and weep until the end of the world. I will never give up my wish to marry you!
        - id: ch03-b12
          speaker: youngest_sister
          text: Very well. I'll marry you if you tell me why you can never die.
        - id: ch03-b13
          speaker: narrator
          text: The old monster roared with laughter.
        - id: ch03-b14
          speaker: monster
          text: Ah, ha, ha! So you're wondering how to kill me? First, you'd have to find an iron casket at the bottom of the sea. Inside it is a white dove. You'd have to find the egg that dove laid, bring it here, and smash it against my head.
        - id: ch03-b15
          speaker: narrator
          text: He laughed again. He was certain no one could reach the bottom of the sea. Even if someone did, they could never find the casket or open it. When he finally caught his breath, he spoke again.
        - id: ch03-b16
          speaker: monster
          text: Now that you know my secret, you have no choice. You must marry me.
        - id: ch03-b17
          speaker: narrator
          text: The girl pleaded so earnestly for the wedding to be delayed three days that he agreed. Sure of his victory, he went away rejoicing.
        - id: ch03-b18
          speaker: narrator
          text: Once he was gone, her brother took off the cap that had hidden him throughout the visit. He told his sister not to lose hope. In three days, he meant to have her free. Then he put on the boots and wished himself to the seashore.
    - id: ch04
      title: The Casket Beneath the Sea
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The boots carried him there at once. He drew out the fish scale and called across the water.
        - id: ch04-b02
          speaker: young_man
          text: Come and help me, King of the Fishes!
        - id: ch04-b03
          speaker: narrator
          text: His brother-in-law swam up and asked what he needed. The young man told him everything that had happened.
        - id: ch04-b04
          speaker: narrator
          text: When the tale was done, the King of the Fishes summoned every fish in his kingdom. Last of all came a little sardine.
        - id: ch04-b05
          speaker: sardine
          text: Forgive me for coming so late. I hurt myself when I struck my head against an iron casket at the bottom of the sea.
        - id: ch04-b06
          speaker: narrator
          text: The king chose several of his largest, strongest subjects. He ordered them to follow the sardine and bring back the iron casket. Before long, they returned with the box balanced across their backs and set it down in front of him.
        - id: ch04-b07
          speaker: narrator
          text: The young man brought out the key.
        - id: ch04-b08
          speaker: young_man
          text: Key, open this box!
        - id: ch04-b09
          speaker: narrator
          text: The lock opened. Everyone crowded close, ready to catch whatever was inside, but the white dove darted out and flew away.
    - id: ch05
      title: The White Dove's Egg
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: There was no use chasing it, and for a moment the young man's heart sank. Then he remembered the feather. He pulled it out and called for help.
        - id: ch05-b02
          speaker: young_man
          text: Come to me, King of the Birds!
        - id: ch05-b03
          speaker: narrator
          text: He heard a rushing sound, and the King of the Birds settled on his shoulder. The king asked what he could do, and the young man told his brother-in-law the whole story.
        - id: ch05-b04
          speaker: narrator
          text: The King of the Birds commanded all his subjects to come at once. In a moment, birds of every size darkened the air. The white dove arrived last.
        - id: ch05-b05
          speaker: white_dove
          text: I'm sorry I'm late. An old friend came to my nest, and I had to give him some dinner.
        - id: ch05-b06
          speaker: narrator
          text: The king ordered some of the birds to guide the young man to the dove's nest. There he found the egg that would break the spell and set them all free. He tucked it safely into his pocket and spoke to the boots.
        - id: ch05-b07
          speaker: young_man
          text: Carry me straight to the cavern where my youngest sister is waiting.
    - id: ch06
      title: The Spell Is Broken
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The third day was already nearly over, and the old monster had chosen that day for the wedding. The young man reached the cavern with the cap on his head. Inside, the monster was pressing the girl to keep her promise and marry him at once.
        - id: ch06-b02
          speaker: narrator
          text: Her brother gave her a sign. She sat down and invited the monster to rest his head in her lap. He did so delightedly. From behind her, the invisible young man slipped the egg into her hand.
        - id: ch06-b03
          speaker: narrator
          text: She smashed it straight against the monster's horrible head. He started and let out a groan so deep that people mistook it for an earthquake rumbling. Then he rolled over and died.
        - id: ch06-b04
          speaker: narrator
          text: As his last breath left him, the husbands of the two elder sisters returned to their true shapes. They sent for their mother-in-law, and her long sorrow turned suddenly to joy. Then they all held a great feast.
        - id: ch06-b05
          speaker: narrator
          text: The youngest sister found all the treasure the monster had gathered in the cave, and she was rich for the rest of her life.
