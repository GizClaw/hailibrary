audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的诙谐
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    youth:
      display_name: 青年
      tts:
        delivery: 勇敢机敏，待人坦率有礼
        timbre: 清朗坚定
        pace: 适中
        pitch: 中音
    boy:
      display_name: 争宝物的男孩
      tts:
        delivery: 急切委屈，说话直率
        timbre: 年轻粗亮
        pace: 稍快
        pitch: 中音
    eldest_sister:
      display_name: 大姐
      tts:
        delivery: 温柔端庄，忧虑时略显慌张
        timbre: 柔美清亮
        pace: 适中
        pitch: 中高音
    bird_king:
      display_name: 鸟王
      tts:
        delivery: 豪爽热情，发号施令时威严果断
        timbre: 明亮有力
        pace: 适中
        pitch: 中低音
    fish_king:
      display_name: 鱼王
      tts:
        delivery: 沉稳亲切，行事干脆
        timbre: 浑厚温和
        pace: 舒缓
        pitch: 低音
    youngest_sister:
      display_name: 小妹
      tts:
        delivery: 年轻柔弱，困境中仍有坚定意志
        timbre: 清细柔和
        pace: 适中
        pitch: 中高音
    monster:
      display_name: 老怪物
      tts:
        delivery: 自负强硬，得意时放声大笑
        timbre: 苍老阴沉
        pace: 稍慢
        pitch: 低音
    sardine:
      display_name: 小沙丁鱼
      tts:
        delivery: 谦逊伶俐，略带匆忙
        timbre: 轻巧清脆
        pace: 稍快
        pitch: 高音
    dove:
      display_name: 白鸽
      tts:
        delivery: 客气从容，稍有歉意
        timbre: 柔亮轻盈
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 三个失踪的女儿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个妇人，最疼爱的就是自己的三个女儿。一天，大女儿走过水草丰美的草甸，看见溪水里开着一朵石竹花。她弯下腰，手刚碰到花，整个人就消失了。第二天，二女儿去草甸寻找姐姐留下的踪迹。一枝美丽的蔷薇横在小路上，她本想把花枝拨开，却忍不住摘下一朵，转眼也没了踪影。小女儿不知道姐姐们去了哪里，循着她们的脚步找来，又被一枝芬芳的白茉莉带走。老妇人的三个女儿，就这样全都不见了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            母亲从早哭到晚，又从夜里哭到天亮，年复一年，从没有停过。女儿们失踪时，儿子还是个小男孩。等他长成高高的青年，终于在一天夜里问母亲，这些年究竟为什么一直伤心。母亲便把三个姐姐失踪的经过全告诉了他。
        - id: ch01-b03
          speaker: youth
          text: >-
            母亲，请您祝福我。我要走遍天下，一直找到三个姐姐为止。
        - id: ch01-b04
          speaker: narrator
          text: >-
            青年就此上路。他走了好几英里，一路平安无事，后来却看见三个大男孩在路中央打架。他停下来问他们争什么，其中一个赶紧说明缘由。
        - id: ch01-b05
          speaker: boy
          text: >-
            大人，父亲去世时给我们留下三样东西，一双靴子、一把钥匙和一顶帽子。穿上靴子，想到哪里就能立刻到哪里。钥匙能打开世上所有的门。帽子戴在头上，谁也看不见你。可大哥想把三样东西全拿走，我们正打算抽签分呢。
        - id: ch01-b06
          speaker: youth
          text: >-
            这很好办。我把这块石头尽力扔出去，谁最先捡回来，三样宝物就都归谁。
        - id: ch01-b07
          speaker: narrator
          text: >-
            青年抓起石头，远远地抛了出去。三兄弟争先恐后地追去，他立刻穿上靴子。
        - id: ch01-b08
          speaker: youth
          text: >-
            靴子啊，带我到大姐所在的地方去。
    - id: ch02
      title: 两位中了魔法的姐夫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            下一刻，青年已经站在陡峭的山上。眼前是一座坚固的城堡，大门上横着门闩、铁栅和铁链。他拿出放在口袋里的钥匙，一道道门果然依次打开。青年穿过许多大厅和长廊，终于遇见一位衣着华贵的美丽少妇。少妇一见他，惊得后退了一步。
        - id: ch02-b02
          speaker: eldest_sister
          text: >-
            先生，你到底是怎么进来的？
          emotion: surprised
        - id: ch02-b03
          speaker: narrator
          text: >-
            青年说，自己就是她的弟弟，又把穿过重重门户的办法讲了一遍。大姐也告诉他，自己的生活原本十分幸福，只有一件事叫她忧心。她的丈夫中了魔法，除非有一个永远不死的人被杀掉，这道魔法才会解除。
        - id: ch02-b04
          speaker: narrator
          text: >-
            姐弟俩谈了很久。大姐担心丈夫随时会回来，见到外人在屋里恐怕不高兴，便劝弟弟先走。青年却说，自己有一顶帽子，戴上以后就没人看得见。话还没说完，门忽然开了，一只鸟飞进屋来。青年听见动静，马上戴好帽子，所以鸟什么也没发现。大姐端来一只硕大的金盆，鸟飞了进去，随即从盆里走出一个英俊男子。他转身就对妻子喊起来。
        - id: ch02-b05
          speaker: bird_king
          text: >-
            屋里肯定有人！
        - id: ch02-b06
          speaker: narrator
          text: >-
            大姐吓了一跳，坚称家里只有自己。丈夫怎么也不相信，她最后只得说出实情。
        - id: ch02-b07
          speaker: bird_king
          text: >-
            他真是你的弟弟，你为什么还要藏着他？我看你根本在骗我！他要是再来，我一定杀了他！
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: >-
            青年这才摘下帽子，走到他们面前。男子仔细一看，青年和妻子果然十分相像，便不再怀疑，高兴地拥抱了妻弟。他从自己的鸟皮上拔下一根羽毛，交给青年。
        - id: ch02-b09
          speaker: bird_king
          text: >-
            以后遇上危险，你就大喊“鸟王，快来帮我！”我一定会来，一切也都会顺利解决。
        - id: ch02-b10
          speaker: narrator
          text: >-
            青年谢过大姐夫，走出城堡，又叫靴子把自己带到二姐居住的地方。和上次一样，他来到一座巨大城堡的门前。二姐住在里面，丈夫深爱着她，她也过得很幸福。可她一直盼着丈夫摆脱魔法，因为那道魔法让他有一半的生命都得以鱼的模样度过。二姐把弟弟介绍给丈夫，丈夫热情地欢迎青年，又送给他一片鱼鳞。
        - id: ch02-b11
          speaker: fish_king
          text: >-
            你要是遇到危险，就喊“鱼王，快来帮我！”我会赶来帮你，把事情顺利解决。
    - id: ch03
      title: 洞窟里的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            青年谢过二姐夫，离开城堡，接着叫靴子带自己去找小妹。靴子把他送到一个黑暗的洞窟前，一道铁阶梯直通洞口。小妹独自坐在里面，一直抽泣。这些年来，她除了哭什么也没做，早已瘦得不成样子。忽然看见一个男子站在面前，她猛地跳起来。
        - id: ch03-b02
          speaker: youngest_sister
          text: >-
            不管你是谁，求你救救我，带我离开这个可怕的地方！
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: >-
            青年告诉她，自己是她的哥哥，也说起了两位姐姐的生活。姐姐们虽然幸福，她们的丈夫却都被魔法束缚着。小妹也把自己的遭遇讲了出来。那天在草甸上，一个可怕的怪物把她掳走，硬逼她嫁给他。她始终不肯答应，怪物便把她囚禁至今。每天，怪物都来求婚，还说她绝不可能逃走，因为他娶她的心永远不变，而且他永远不会死。青年立刻想到了两个姐夫。他劝妹妹假意答应婚事，不过要先问清怪物为何不会死。
        - id: ch03-b04
          speaker: narrator
          text: >-
            突然，四周剧烈震颤，像是被旋风来回摇撼。老怪物走进洞窟，一下扑倒在姑娘脚边。
        - id: ch03-b05
          speaker: monster
          text: >-
            你还是不肯嫁给我吗？那你就坐在这里，一直哭到世界末日吧。因为我永远都不会放弃娶你！
        - id: ch03-b06
          speaker: youngest_sister
          text: >-
            好吧。只要你告诉我，你为什么永远不会死，我就嫁给你。
        - id: ch03-b07
          speaker: narrator
          text: >-
            老怪物立刻放声大笑。
        - id: ch03-b08
          speaker: monster
          text: >-
            哈，哈，哈！你是在盘算怎么杀我吧？那你得先找到一只沉在海底的铁匣。匣子里有一只白鸽。你还得找到白鸽生下的蛋，把蛋带回来，朝我的脑袋砸碎。
        - id: ch03-b09
          speaker: narrator
          text: >-
            怪物认定没人能潜到海底。就算真有人下去了，也找不到铁匣，更打不开它，想到这里又大笑起来。等他总算笑够了，才得意地开口。
        - id: ch03-b10
          speaker: monster
          text: >-
            现在你知道我的秘密了，这下非嫁给我不可。
        - id: ch03-b11
          speaker: narrator
          text: >-
            姑娘苦苦哀求，请他把婚礼推迟三天。怪物答应了，自以为已经得胜，欢天喜地地离去。他刚消失，哥哥便摘下隐身帽，叫妹妹别灰心。他相信三天之后，她就能自由。说完，他穿上靴子，许愿去海边，转眼便站在岸上。他取出鱼鳞，大声呼唤鱼王。
        - id: ch03-b12
          speaker: youth
          text: >-
            鱼王，快来帮我！
    - id: ch04
      title: 海底的铁匣与白鸽的蛋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            鱼王游到岸边，问青年需要什么帮助。听完事情经过，他立刻召来所有水族。最后赶到的是一条小沙丁鱼。
        - id: ch04-b02
          speaker: sardine
          text: >-
            对不起，我来晚了。海底有一只铁匣子，我不小心撞在上面，把脑袋磕伤了。
        - id: ch04-b03
          speaker: narrator
          text: >-
            鱼王马上命令几条最大、最强壮的鱼跟着小沙丁鱼，让她带路，把铁匣运来。不久，它们便驮着匣子回来，放在鱼王面前。青年取出那把神奇的钥匙。
        - id: ch04-b04
          speaker: youth
          text: >-
            钥匙，快打开这只匣子！
        - id: ch04-b05
          speaker: narrator
          text: >-
            匣子应声打开。大家早已围在四周，准备捉住里面的东西，可那只白鸽还是从它们头顶飞走了。追是追不上了，青年心里一沉。紧接着，他想起自己还有大姐夫的羽毛，连忙取出来呼喊。
        - id: ch04-b06
          speaker: youth
          text: >-
            鸟王，快到我这里来！
        - id: ch04-b07
          speaker: narrator
          text: >-
            一阵羽翼破空的呼啸传来，鸟王落到青年肩上，问他出了什么事。青年把经过全讲了一遍。鸟王听完，立即命令所有飞禽赶来。顷刻之间，大大小小的鸟遮暗了天空。最后，那只白鸽才姗姗来迟。
        - id: ch04-b08
          speaker: dove
          text: >-
            请原谅，我来晚了。一位老朋友刚到我的巢里，我不得不请他吃顿饭。
        - id: ch04-b09
          speaker: narrator
          text: >-
            鸟王命几只鸟带青年去白鸽的巢。到了那里，青年果然看见那只可以破除魔法、解救众人的蛋，正安安稳稳地躺在巢中。他把蛋小心装进口袋，又吩咐靴子径直带自己回到小妹等待的洞窟。
    - id: ch05
      title: 怪物之死
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            婚礼定下的第三天已经过去大半。青年戴着隐身帽赶回洞窟，老怪物也在那里，正催促姑娘遵守诺言，马上举行婚礼。哥哥向妹妹递了个眼色，妹妹便坐下来，请怪物把头枕在自己膝上。怪物喜不自胜，马上照办。哥哥站在妹妹身后，悄悄把蛋递给她。姑娘接过蛋，狠狠砸向怪物的脑袋。怪物浑身一震，发出一声呻吟，听见的人还以为大地正在轰鸣。接着，他翻倒在地，死了。
        - id: ch05-b02
          speaker: narrator
          text: >-
            怪物咽气的那一刻，两位姐夫都恢复了原来的模样。他们派人接来岳母。老妇人怎么也没想到，积压多年的悲痛竟会一下变成欢乐。大家举行了盛大的宴会。小女儿也从此拥有享用不尽的财富，因为怪物搜集的所有珍宝，都留在了洞窟里。
        - id: ch05-b03
          speaker: narrator
          text: >-
            这个故事译自葡萄牙文。
