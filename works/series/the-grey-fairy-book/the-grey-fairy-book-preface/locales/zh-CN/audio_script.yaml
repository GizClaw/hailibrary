audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的诙谐
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 来自各地的故事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            《灰色童话书》收录的故事来自许多地方。它们有的来自立陶宛，有的来自非洲各地，还有的来自德国、法国、希腊和世界上的其他地区。登特夫人、兰夫人、埃莉诺·塞拉小姐、布莱克利小姐和杭小姐翻译并改写了这些故事。
    - id: ch02
      title: 故事里面还有故事
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            《哈利的三个儿子》选自上个世纪的《仙女故事宝库》，那是一部庞大的故事集。那位法国作者写其中一些部分时，面前也许摆着一篇东方原作。不管怎样，他确实学了东方人讲故事的办法，把一个故事套进另一个故事里，就像雕花的东方象牙套球，一只里面还藏着一只。
    - id: ch03
      title: 万花筒里的变化
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            这些故事也让我们看得出，民间故事通常是怎么编出来的。数目有限的情节被摇来摇去，拼成许许多多不同的故事，正像万花筒里的彩色玻璃碎片。这样的拼法大概并不是无穷无尽，音乐的组合也是一样。不过，听仙女故事时，孩子们也许没有约翰·斯图亚特·密尔先生听音乐时那么容易厌倦。
