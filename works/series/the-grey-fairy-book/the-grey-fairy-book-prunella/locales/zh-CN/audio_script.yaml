audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，保留古老童话的神秘感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    prunella:
      display_name: 普鲁内拉
      tts:
        delivery: 善良坦率，受威胁时害怕却守住自己的心意
        timbre: 清澈柔和
        pace: 适中
        pitch: 中高音
    witch:
      display_name: 女巫
      tts:
        delivery: 刻薄凶狠，发号施令时咄咄逼人
        timbre: 干涩阴冷
        pace: 稍慢
        pitch: 中低音
    bensiabel:
      display_name: 本西亚贝尔
      tts:
        delivery: 温厚真诚，劝慰时轻柔，救人时果断
        timbre: 清朗温暖
        pace: 适中
        pitch: 中音
    witch_sister:
      display_name: 女巫的妹妹
      tts:
        delivery: 残酷暴躁，命令时尖厉急促
        timbre: 粗哑尖锐
        pace: 稍快
        pitch: 中高音
    kitchen_woman:
      display_name: 厨房里的女人
      tts:
        delivery: 饱经折磨，拒绝女巫时坚决直接
        timbre: 疲惫沙哑
        pace: 适中
        pitch: 中音
    well_woman:
      display_name: 井边的女人
      tts:
        delivery: 苦楚而清醒，回答时坚定不屈
        timbre: 低柔粗粝
        pace: 稍慢
        pitch: 中低音
    mastiff:
      display_name: 大獒犬
      tts:
        delivery: 威猛低沉，受恩后直率坚定
        timbre: 浑厚粗重
        pace: 稍慢
        pitch: 低音
    door:
      display_name: 门
      tts:
        delivery: 质朴爽直，拒绝时干脆利落
        timbre: 木质沉响
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 李树下的小偷
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个女人只有一个女儿。女孩七岁左右时，每天上学都要经过一座果园。园里有棵野李树，枝上挂满熟透的果子，香甜极了，有些一直垂到路边。她每天早晨都会摘一颗，装进口袋，留到学校里再吃。正是因为这个习惯，大家才叫她普鲁内拉。
        - id: ch01-b02
          speaker: narrator
          text: >-
            可那座果园属于一个女巫。有一天，女巫从远处看到普鲁内拉又在摘李子。女孩只是天真地以为，长在路边的果子谁都可以拿，并不知道自己做错了事。女巫却气坏了。第二天，她早早藏在树篱后面。普鲁内拉走过来，手刚伸向枝头，她便猛地跳出来，牢牢抓住女孩的胳膊。
        - id: ch01-b03
          speaker: witch
          text: >-
            哈，小偷！我总算逮到你了。做了坏事，就得付出代价。
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: >-
            可怜的普鲁内拉吓得半死。她一遍遍求老妇人原谅，保证自己真的不知道这样不对，以后绝不会再犯。女巫却没有半点怜悯，硬把孩子拖进自己的屋子。从此，普鲁内拉被囚禁在那里。女巫没有马上动手，只等着她认为合适的时机，再好好报复这个孩子。
        - id: ch01-b05
          speaker: narrator
          text: >-
            一年接一年过去，普鲁内拉在女巫家里长大，成了一个美丽非凡的姑娘。她依旧善良，可她越美、越善良，女巫的心不但没有变软，反而生出更深的嫉妒和恨意。一天，女巫把她叫到跟前，又把一只篮子塞进她手里。
        - id: ch01-b06
          speaker: witch
          text: >-
            拿去井边，装满水再带回来。空着手回来，我就要你的命。
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: >-
            普鲁内拉来到井边，把篮子一次又一次放进水里。可她每回费力提上来，井水都会顺着篮子的缝隙一路流走，等到井口时，里面已经一滴不剩。她终于明白，再试多少回也不会有用，只好绝望地停下，倚着井沿伤心痛哭。就在这时，身边忽然传来一个声音。
        - id: ch01-b08
          speaker: bensiabel
          text: >-
            普鲁内拉，你为什么哭？
        - id: ch01-b09
          speaker: narrator
          text: >-
            姑娘回头一看，是个英俊的青年。他和善地望着她，像是真心同情她的苦处。
        - id: ch01-b10
          speaker: prunella
          text: >-
            你是谁？怎么会知道我叫什么？
        - id: ch01-b11
          speaker: bensiabel
          text: >-
            我叫本西亚贝尔，是女巫的儿子。她打定主意要害死你，可我不会让她得逞。要是我帮你把篮子装满，你愿意亲我一下吗？
        - id: ch01-b12
          speaker: prunella
          text: >-
            不愿意。你是女巫的儿子，我不会亲你。
        - id: ch01-b13
          speaker: bensiabel
          text: >-
            好吧。还是把篮子给我，我替你装水。
          emotion: sad
        - id: ch01-b14
          speaker: narrator
          text: >-
            本西亚贝尔把篮子浸入井中，再提起来。奇怪的是，水这一次稳稳留在篮里，一滴也没有漏。普鲁内拉接过满满一篮水，小心提回屋里。女巫一看她真的带回了水，顿时气得脸色煞白。
        - id: ch01-b15
          speaker: witch
          text: >-
            一定是本西亚贝尔帮了你！
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: >-
            普鲁内拉垂下眼睛，一声不响。
        - id: ch01-b17
          speaker: witch
          text: >-
            好，我们就看看，最后到底谁赢！
          emotion: angry
    - id: ch02
      title: 烤炉里的面包
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天，女巫又叫来普鲁内拉，交给她一袋麦子。
        - id: ch02-b02
          speaker: witch
          text: >-
            我要出去一会儿。等我回来，这袋麦子必须已经变成面包。不然，我就杀了你。
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: >-
            女巫说完便出了房间，把门从外面关紧，又落了锁。普鲁内拉根本不知道该怎么办。女巫只出去一小会儿，在这么短的时间里，她怎么可能磨完一整袋麦子，再和好面团，把面包烤熟呢？起初，她还鼓起勇气拼命干。可做了一阵，她便看清这差事根本没有希望，只得一头倒在椅子上，又伤心地哭了起来。本西亚贝尔的声音把她从绝望中唤醒。
        - id: ch02-b04
          speaker: bensiabel
          text: >-
            普鲁内拉，别这样哭。你亲我一下，我就替你烤好面包。这样，她就害不了你了。
        - id: ch02-b05
          speaker: prunella
          text: >-
            我不亲女巫的儿子。
        - id: ch02-b06
          speaker: narrator
          text: >-
            普鲁内拉这样拒绝了他，本西亚贝尔却没有丢下她不管。他接过那袋麦子，先磨成面粉，再和成面团，把面包送进烤炉。女巫回来时，面包已经全部烤好了。她立刻转头瞪住姑娘，声音里全是怒火。
        - id: ch02-b07
          speaker: witch
          text: >-
            本西亚贝尔来过！又是他替你做的！
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: >-
            普鲁内拉还是低头不答。
        - id: ch02-b09
          speaker: witch
          text: >-
            别得意。到最后，我们再看谁会赢！
          emotion: angry
    - id: ch03
      title: 山那边的匣子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            第三天，女巫想出了更狠毒的办法。
        - id: ch03-b02
          speaker: witch
          text: >-
            翻过那些山，去找我妹妹。她会给你一只匣子，把它带回来。
        - id: ch03-b03
          speaker: narrator
          text: >-
            女巫清楚得很，她的妹妹住在群山另一边，比自己更加残忍恶毒。只要普鲁内拉上门，那人就绝不会放她回来，而会把她关住，一直饿到死。普鲁内拉哪里猜得到这个圈套？她以为自己只是去取一样东西，还高高兴兴地上了路。走到半途，本西亚贝尔迎面而来。
        - id: ch03-b04
          speaker: bensiabel
          text: >-
            普鲁内拉，你这是要去哪里？
        - id: ch03-b05
          speaker: prunella
          text: >-
            女主人叫我去找她妹妹，取一只匣子回来。
        - id: ch03-b06
          speaker: bensiabel
          text: >-
            可怜的姑娘，她是把你送去送死啊。你亲我一下，我就救你。
          emotion: sad
        - id: ch03-b07
          speaker: prunella
          text: >-
            我还是那句话。我不会亲女巫的儿子。
        - id: ch03-b08
          speaker: bensiabel
          text: >-
            那我也要救你，因为我爱你胜过爱自己。拿好这瓶油、一块面包、一截绳子，还有一把扫帚。到了那里，先用油润一润门轴。凶猛的獒犬出来时，把面包给它。
        - id: ch03-b09
          speaker: bensiabel
          text: >-
            院里的女人正拿辫子系住水桶，想把桶放进井里。把绳子给她。厨房里还有个女人，只能用舌头擦炉灶，把扫帚给她。匣子放在橱柜顶上。抓到手就马上逃，千万别停。每一步都照我说的做，你便能活下来。
        - id: ch03-b10
          speaker: narrator
          text: >-
            普鲁内拉仔细听完，把每一项嘱咐都牢牢记住。到了女巫妹妹家，她先给粗糙生锈的门轴抹上油。大獒犬扑过来，她立刻把面包扔过去。穿过院子，她把绳子交给那个正用辫子放水桶的女人。走进厨房，她又把扫帚送给那个被迫用舌头擦炉灶的女人。最后，她踮起脚从橱柜顶上抱下匣子，一刻也没有耽搁，转身便逃。
        - id: ch03-b11
          speaker: narrator
          text: >-
            女巫的妹妹听到脚步声，冲到窗前大喊。
        - id: ch03-b12
          speaker: witch_sister
          text: >-
            厨房里的，快杀了那个小偷！
          emotion: angry
        - id: ch03-b13
          speaker: kitchen_woman
          text: >-
            我不杀她。她送了我一把扫帚，你却逼我用舌头擦炉灶。
        - id: ch03-b14
          speaker: witch_sister
          text: >-
            井边的，抓住她！把她扔进水里淹死！
          emotion: angry
        - id: ch03-b15
          speaker: well_woman
          text: >-
            我不会淹死她。她给我一截绳子，你却逼我拿头发系住水桶打水。
        - id: ch03-b16
          speaker: narrator
          text: >-
            女巫又命令獒犬追上去，把姑娘死死咬住。
        - id: ch03-b17
          speaker: mastiff
          text: >-
            我不抓她。她给我面包吃，你却一直让我挨饿。
        - id: ch03-b18
          speaker: narrator
          text: >-
            女巫气得几乎喘不上气，最后冲着大门尖叫。
        - id: ch03-b19
          speaker: witch_sister
          text: >-
            门，撞倒她！把她关在这里！
          emotion: angry
        - id: ch03-b20
          speaker: door
          text: >-
            我不干。她给门轴上了油，我现在动起来轻松多了。你却只管让我又涩又锈。
        - id: ch03-b21
          speaker: narrator
          text: >-
            所有受过帮助的人和东西都放她过去，普鲁内拉就这样逃出了那座屋子。她把匣子紧紧夹在臂弯下，一路赶回女主人家。不难想见，女巫看到她平安站在面前，还比以前更加美丽，既吃惊，又恼怒。她的眼睛凶狠地闪着光，说话的声音也满是怒气。
        - id: ch03-b22
          speaker: witch
          text: >-
            你见到本西亚贝尔了，是不是？
          emotion: angry
        - id: ch03-b23
          speaker: narrator
          text: >-
            普鲁内拉低着头，没有出声。
        - id: ch03-b24
          speaker: witch
          text: >-
            我们还没分出胜负。鸡舍里有三只公鸡，一只是黄色，一只是黑色，还有一只是白色。今夜每有一只啼叫，你都要说出它是哪一只。答错一次，我就一口吞了你。
          emotion: angry
    - id: ch04
      title: 三声鸡啼
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            本西亚贝尔就住在普鲁内拉隔壁。半夜，一声鸡啼把姑娘惊醒。
        - id: ch04-b02
          speaker: witch
          text: >-
            刚才叫的是哪一只？
        - id: ch04-b03
          speaker: narrator
          text: >-
            普鲁内拉吓得浑身发抖。她轻轻敲墙，贴近墙面低声央求。
        - id: ch04-b04
          speaker: prunella
          text: >-
            本西亚贝尔，快告诉我，刚刚是哪只公鸡叫了？
          emotion: fearful
        - id: ch04-b05
          speaker: bensiabel
          text: >-
            我说了以后，你会亲我一下吗？
        - id: ch04-b06
          speaker: prunella
          text: >-
            我不会亲你。
        - id: ch04-b07
          speaker: bensiabel
          text: >-
            那我也告诉你，是黄公鸡。
        - id: ch04-b08
          speaker: narrator
          text: >-
            女巫见她迟迟不回答，已经怒气冲冲地走到门前。
        - id: ch04-b09
          speaker: witch
          text: >-
            马上回答！再不开口，我就杀了你！
          emotion: angry
        - id: ch04-b10
          speaker: prunella
          text: >-
            是黄公鸡在叫。
        - id: ch04-b11
          speaker: narrator
          text: >-
            女巫恨得直跺脚，把牙齿咬得咯咯响。不久，第二声鸡啼传来。
        - id: ch04-b12
          speaker: witch
          text: >-
            现在这只又是什么颜色？
        - id: ch04-b13
          speaker: narrator
          text: >-
            本西亚贝尔悄悄给了提示，普鲁内拉随即回答。
        - id: ch04-b14
          speaker: prunella
          text: >-
            这回是黑公鸡。
        - id: ch04-b15
          speaker: narrator
          text: >-
            几分钟后，第三次鸡啼响了起来。女巫立刻追问。
        - id: ch04-b16
          speaker: witch
          text: >-
            这一次呢？是哪只？
        - id: ch04-b17
          speaker: narrator
          text: >-
            普鲁内拉只好再次敲墙，央求隔壁的本西亚贝尔帮忙。这一次，他没有立刻告诉她答案。他盼着到了这样危险的时刻，姑娘或许会忘掉他是女巫的儿子，终于答应给他一个吻。可他迟疑得越久，女巫便逼得越近。就在这时，普鲁内拉发出痛苦的呼喊。
        - id: ch04-b18
          speaker: prunella
          text: >-
            本西亚贝尔，救我！女巫已经来了，就在我身边。我听见她咬牙了！
          emotion: fearful
        - id: ch04-b19
          speaker: narrator
          text: >-
            本西亚贝尔听到呼救，猛地打开自己的房门，一步冲出去，纵身撞向女巫。他抓住她，使出全身力气往后一扯。女巫踉跄着失去了平衡，一头栽下楼梯，一直摔到最下面，当场死了。
        - id: ch04-b20
          speaker: narrator
          text: >-
            直到这时，普鲁内拉才真正被本西亚贝尔的善良打动。后来，她嫁给了他。从此以后，两个人永远幸福地生活在一起。
