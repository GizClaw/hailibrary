  chapters:
    - id: ch01
      title: The Witch's Orchard
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a woman with one daughter. When the child was about seven, she passed an orchard every day on her way to school. A wild plum tree grew there, its branches heavy with delicious ripe fruit. Each morning, the child picked one plum from beside the road and slipped it into her pocket to eat at school. That was why people called her Prunella.
        - id: ch01-b02
          speaker: narrator
          text: The orchard belonged to a witch. Prunella did not know it was wrong to take the fruit, but one day the witch saw her. The next morning, the witch hid behind the hedge. As Prunella reached for a plum, the witch sprang out and caught her by the arm.
        - id: ch01-b03
          speaker: witch
          text: Ah, you little thief! I have caught you at last. Now you will pay for what you have done.
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: Prunella was almost senseless with fear. She begged the old woman to forgive her. She assured the witch that she had never known she was doing wrong, and she promised never to take another plum. But the witch felt no pity. She dragged the child into her house and kept her prisoner there, waiting until the time came to take her revenge.
        - id: ch01-b05
          speaker: narrator
          text: The years went by, and Prunella grew into a very beautiful young woman. She was good as well as beautiful, but neither quality softened the witch. They only made her more jealous and hateful.
        - id: ch01-b06
          speaker: witch
          text: Take this basket to the well and bring it back full of water. If you fail, I will kill you.
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: Prunella took the basket to the well and lowered it into the water again and again. Each time she pulled it up, the water streamed straight through, and all her work came to nothing. At last, she gave up in despair. She leaned against the well and began to cry bitterly. Then a voice beside her spoke her name and asked why she was weeping.
        - id: ch01-b08
          speaker: narrator
          text: Prunella turned and saw a handsome young man looking at her kindly, as though her trouble grieved him.
        - id: ch01-b09
          speaker: prunella
          text: Who are you? And how do you know my name?
        - id: ch01-b10
          speaker: bensiabel
          text: I am Bensiabel, the witch's son. I know she means to have you killed, but I will not let her carry out that wicked plan. If I fill your basket, will you give me a kiss?
        - id: ch01-b11
          speaker: prunella
          text: No. I will not kiss you, because you are the son of a witch.
        - id: ch01-b12
          speaker: bensiabel
          text: Very well. Give me the basket, and I will fill it anyway.
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: Bensiabel dipped the basket into the well, and this time the water stayed inside. Prunella carried the full basket back to the house. The sight of it made the witch turn white with rage.
        - id: ch01-b14
          speaker: witch
          text: Bensiabel must have helped you.
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: Prunella lowered her eyes and said nothing.
        - id: ch01-b16
          speaker: witch
          text: We shall see which of us wins in the end.
          emotion: angry
    - id: ch02
      title: The Bread and the Journey
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next day, the witch summoned Prunella again.
        - id: ch02-b02
          speaker: witch
          text: Here is a sack of wheat. I am going out, and by the time I return, you must turn all of it into bread. If it is not ready, I will kill you.
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: With that, the witch went out, closing and locking the door behind her. Poor Prunella did not know what to do. In the little time before the witch returned, she could never grind a whole sack of wheat, prepare the dough, and bake it into bread. At first she set to work bravely. When she saw just how hopeless it was, she threw herself onto a chair and began to weep bitterly. Then Bensiabel's voice beside her roused her from despair.
        - id: ch02-b04
          speaker: bensiabel
          text: Prunella, please don't cry so bitterly. Give me a kiss, and I will make the bread and save you.
        - id: ch02-b05
          speaker: prunella
          text: I will not kiss the son of a witch.
        - id: ch02-b06
          speaker: narrator
          text: Even so, Bensiabel took the wheat. He ground it, made the dough, and baked the loaves. When the witch returned, the bread was waiting in the oven. She turned on Prunella, her voice full of fury.
        - id: ch02-b07
          speaker: witch
          text: Bensiabel came here and helped you. I know he did.
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: Again, Prunella looked down and gave no answer.
        - id: ch02-b09
          speaker: witch
          text: We shall see who wins in the end.
          emotion: angry
        - id: ch02-b10
          speaker: narrator
          text: The witch's eyes blazed. The following day, she gave Prunella one more command.
        - id: ch02-b11
          speaker: witch
          text: Go across the mountains to my sister's house. She will give you a casket. Bring it back to me.
        - id: ch02-b12
          speaker: narrator
          text: The witch gave this order because her sister was even crueler and more wicked than she was. She knew that once Prunella entered the other witch's house, the girl would never be allowed to return. Her sister would imprison Prunella and starve her to death. Prunella suspected none of this. She set out quite cheerfully, and on the way across the mountains, she met Bensiabel.
        - id: ch02-b13
          speaker: bensiabel
          text: Where are you going, Prunella?
        - id: ch02-b14
          speaker: prunella
          text: My mistress has sent me to her sister to fetch a casket.
        - id: ch02-b15
          speaker: bensiabel
          text: Oh, you poor girl. She is sending you straight to your death. Give me a kiss, and I will save you.
          emotion: fearful
        - id: ch02-b16
          speaker: prunella
          text: I still will not kiss the son of a witch.
        - id: ch02-b17
          speaker: bensiabel
          text: I will save you all the same, because I love you more than I love myself. Take this flask of oil, this loaf of bread, this rope, and this broom. At the witch's house, pour the oil on the door hinges. A great fierce mastiff will rush out to meet you. Throw him the bread. In the courtyard, you will find a miserable woman trying to lower a bucket into the well with her braided hair. Give her the rope. In the kitchen, another miserable woman will be trying to scrub the hearth with her tongue. Give her the broom. The casket will be on top of a cupboard. Take it quickly, then leave the house without stopping. Follow every word, and you will escape alive.
        - id: ch02-b18
          speaker: narrator
          text: Prunella listened closely and carried everything with her toward the house beyond the mountains.
    - id: ch03
      title: The Casket Beyond the Mountains
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Prunella remembered every instruction and did exactly as Bensiabel had told her. When she reached the house, she poured the oil onto the door's rough hinges. The great fierce mastiff came to meet her, and she threw him the loaf. In the courtyard, she found the miserable woman struggling to lower a bucket into the well with her braided hair, so Prunella gave her the rope. In the kitchen, an even more miserable woman was trying to clean the hearth with her tongue, and Prunella gave her the broom. Then she caught up the casket from the top of the cupboard and fled without losing a moment.
        - id: ch03-b02
          speaker: narrator
          text: The witch heard Prunella fleeing. She rushed to the window and called to the woman in the kitchen.
        - id: ch03-b03
          speaker: second_witch
          text: Kill that thief! I command you!
          emotion: angry
        - id: ch03-b04
          speaker: kitchen_woman
          text: I will not kill her. She gave me a broom, while you made me clean the hearth with my tongue.
        - id: ch03-b05
          speaker: narrator
          text: In a fury, the witch shouted to the woman beside the well.
        - id: ch03-b06
          speaker: second_witch
          text: Catch that girl! Throw her into the well and drown her!
          emotion: angry
        - id: ch03-b07
          speaker: well_woman
          text: No, I will not drown her. She gave me this rope, while you made me use my own hair to lower the bucket.
        - id: ch03-b08
          speaker: narrator
          text: Next the witch ordered the dog to seize Prunella and hold her fast.
        - id: ch03-b09
          speaker: mastiff
          text: No, I will not catch her. She gave me a loaf of bread, while you left me starving.
        - id: ch03-b10
          speaker: narrator
          text: The witch was so angry she nearly choked. She called out one last command.
        - id: ch03-b11
          speaker: second_witch
          text: Door, slam against her! Keep her trapped inside!
          emotion: angry
        - id: ch03-b12
          speaker: door
          text: I won't. She oiled my hinges so they move with ease, while you left them rough and rusty.
        - id: ch03-b13
          speaker: narrator
          text: None of them stopped Prunella, and so she escaped. With the casket tucked beneath her arm, she made her way safely back to her mistress's house. You can imagine how the witch felt. She was furious, but just as surprised to see the girl standing before her, looking more beautiful than ever. Her eyes flashed as she demanded an answer.
        - id: ch03-b14
          speaker: witch
          text: Did you meet Bensiabel?
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: Prunella lowered her eyes and stayed silent.
        - id: ch03-b16
          speaker: witch
          text: We shall see who wins in the end.
          emotion: angry
    - id: ch04
      title: The Three Cocks
      blocks:
        - id: ch04-b01
          speaker: witch
          text: Listen carefully. There are three cocks in the henhouse, one yellow, one black, and one white. Each time a cock crows tonight, you must tell me which one it was. Make one mistake, and I will gobble you up in a single mouthful.
          emotion: angry
        - id: ch04-b02
          speaker: narrator
          text: Bensiabel slept in the room beside Prunella's. At midnight, a cock's crow woke her.
        - id: ch04-b03
          speaker: witch
          text: Which cock was that?
        - id: ch04-b04
          speaker: narrator
          text: Trembling, Prunella tapped on the wall and whispered to Bensiabel.
        - id: ch04-b05
          speaker: prunella
          text: Bensiabel, please tell me. Which cock just crowed?
          emotion: fearful
        - id: ch04-b06
          speaker: bensiabel
          text: Will you give me a kiss if I tell you?
        - id: ch04-b07
          speaker: prunella
          text: No, I will not.
        - id: ch04-b08
          speaker: bensiabel
          text: I will tell you anyway. It was the yellow cock.
        - id: ch04-b09
          speaker: narrator
          text: The witch noticed that Prunella had taken too long. She came toward the girl's door, calling out angrily.
        - id: ch04-b10
          speaker: witch
          text: Answer me now, or I will kill you!
          emotion: angry
        - id: ch04-b11
          speaker: prunella
          text: The yellow cock crowed.
        - id: ch04-b12
          speaker: narrator
          text: The witch stamped her foot and ground her teeth. Soon another cock crowed.
        - id: ch04-b13
          speaker: witch
          text: Now tell me which one that was.
        - id: ch04-b14
          speaker: narrator
          text: Bensiabel quietly gave Prunella the answer.
        - id: ch04-b15
          speaker: bensiabel
          text: That was the black cock.
        - id: ch04-b16
          speaker: prunella
          text: It was the black cock.
        - id: ch04-b17
          speaker: narrator
          text: A few minutes later, a cock crowed for the third time.
        - id: ch04-b18
          speaker: witch
          text: Which one was that?
        - id: ch04-b19
          speaker: narrator
          text: Once more, Prunella begged Bensiabel for help. This time, he hesitated. He hoped she might forget that he was a witch's son and promise him a kiss. While he waited, an agonized cry came through the wall.
        - id: ch04-b20
          speaker: prunella
          text: Bensiabel, save me! The witch is coming. She is almost here, and I can hear her teeth grinding!
          emotion: fearful
        - id: ch04-b21
          speaker: narrator
          text: At Prunella's cry, Bensiabel opened his door with a bound and threw himself against the witch. He pulled her backward with such force that she stumbled. Then she fell headfirst down the stairs and dropped dead at the bottom.
        - id: ch04-b22
          speaker: narrator
          text: At last, Prunella understood how good and kind Bensiabel had always been to her. Her heart was touched, and she became his wife.
        - id: ch04-b23
          speaker: narrator
          text: And they lived happily ever after.
