        timbre: 清脆年轻
        pace: 适中偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 画像与灵药
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            年轻的南吉尔住在离君士坦丁堡大约四十英里的一座村庄里。从幼年直到十八岁生日，他一直过得快快活活，也始终以为把自己抚养成人的穆罕默德和齐内比就是亲生父母。南吉尔不富有，也没有显赫的身份，却对眼前的日子十分知足。他不像许多同龄的年轻人，从来不曾向往远方，也没有想过要离开家乡。
        - id: ch01-b02
          speaker: narrator
          text: >-
            所以有一天，穆罕默德长吁短叹地告诉他，他已经长大，该去君士坦丁堡亲自选一门安身立命的事业了，南吉尔听得十分吃惊。选什么可以由他自己决定，不过老人猜想，他大概会愿意从军，或者做一位精通律法的教法学者，向那些不懂圣书的百姓讲解《古兰经》。
        - id: ch01-b03
          speaker: muhammad
          text: >-
            圣书你差不多都能背下来了，再用不了多久，便可以教导别人。到了城里，记得写信告诉我们日子过得怎样。我们也答应你，永远不会忘记你。
        - id: ch01-b04
          speaker: narrator
          text: >-
            老人给了他四个皮阿斯特作盘缠，还托人让他加入一支前往京城的商队。商队慢慢走了好几天，远处终于出现城墙和塔楼。旅客一到地方便各自散去，只剩南吉尔独自站着。
        - id: ch01-b05
          speaker: narrator
          text: >-
            这是他第一次离开长大的村庄。从前也没有人给他讲过君士坦丁堡的情形。他向来胆大，也容易结交朋友，可眼前连一条街的名字都不知道，更别说认识城里的任何人，难免觉得陌生又孤单。他不知下一步该怎么办，只能站在原地四处张望。忽然，一个面容和善的男子走上前，礼貌地鞠了一躬，问这位年轻人肯不肯赏光，在想好日后的打算以前，先到自己家住下。南吉尔想不出别的办法，便接受邀请跟着去了。
        - id: ch01-b06
          speaker: narrator
          text: >-
            宽敞的屋里，一个十二岁左右的姑娘正在桌上摆三副餐具。
        - id: ch01-b07
          speaker: sirocco
          text: >-
            泽丽达，我早就说今晚会带一位朋友回来吃饭。你看，我没有说错吧？
        - id: ch01-b08
          speaker: zelida
          text: >-
            父亲，您说的话从不会错。更难得的是，您也从不会把别人领上错路。
        - id: ch01-b09
          speaker: narrator
          text: >-
            泽丽达说话时，一名老女奴端来一盘抓饭。这道菜用米和肉做成，在东方尤其受人喜爱。女奴又在每个人面前放下一杯果子露，随后悄无声息地退了出去。主人席间天南海北，谈了许多不同的事，南吉尔却几乎没有听进去。他总忍不住看着泽丽达，又尽量不让自己显得太过失礼。姑娘渐渐红了脸，浑身越来越不自在，最后迟疑着向父亲低声开口。
        - id: ch01-b10
          speaker: zelida
          text: >-
            父亲，这个陌生人一直盯着我。哈桑要是听说了，非嫉妒疯了不可。
        - id: ch01-b11
          speaker: sirocco
          text: >-
            不，不，你当然不是许配给他的。我不是告诉过你吗？我要把你姐姐阿让蒂娜许给他。现在我就让他的心落到她身上。
        - id: ch01-b12
          speaker: narrator
          text: >-
            他打开橱柜，拿出水果、一壶酒和一只银镶珍珠母的小匣子，给南吉尔斟了一杯。
        - id: ch01-b13
          speaker: sirocco
          text: >-
            尝尝这杯酒。
        - id: ch01-b14
          speaker: zelida
          text: >-
            我也要一点儿！
        - id: ch01-b15
          speaker: sirocco
          text: >-
            绝对不行。前些日子，你和哈桑已经喝得够多了。
        - id: ch01-b16
          speaker: zelida
          text: >-
            那您也喝一点吧。不然，他准以为我们要毒死他呢。
        - id: ch01-b17
          speaker: sirocco
          text: >-
            好吧，既然你非要我喝。这种灵药对我这个年纪的人，可不像对你们那么危险。
        - id: ch01-b18
          speaker: narrator
          text: >-
            南吉尔一口喝干杯中的酒。主人随即打开那只银镶珍珠母的小匣子，递到他面前。匣子里是一位年轻姑娘的画像，美得胜过南吉尔从前梦见过的一切。他欣喜若狂，呆呆站在画像前，胸中忽然涌起一种从未体验过的感情，半天说不出一句话。泽丽达和父亲含笑看了他许久，他才终于回过神来。
        - id: ch01-b19
          speaker: nangir
          text: >-
            请告诉我，这些谜到底是什么意思？您为什么带我回来，又为什么让我喝下这种叫血液发热的危险东西？还有这幅画像，它简直夺走了我的理智！
        - id: ch01-b20
          speaker: sirocco
          text: >-
            有些问题我能回答，有些还不能。你拿着的是泽丽达姐姐的画像。你的心已经爱上她了。去找她吧。找到她，你也就找到了自己。
        - id: ch01-b21
          speaker: narrator
          text: >-
            南吉尔目不转睛地望着画像，一边亲吻，一边追问。
        - id: ch01-b22
          speaker: nangir
          text: >-
            可我该到哪里去找她？
        - id: ch01-b23
          speaker: sirocco
          text: >-
            我不能再告诉你了。
        - id: ch01-b24
          speaker: zelida
          text: >-
            我可以告诉你！明天去犹太人的集市，到右手第二家铺子买一块表。等午夜一到——
        - id: ch01-b25
          speaker: narrator
          text: >-
            她没能说完。父亲慌忙捂住她的嘴。
        - id: ch01-b26
          speaker: sirocco
          text: >-
            快住口，孩子！你这样莽撞，难道也想落得几个姐姐那样不幸吗？
          emotion: fearful
        - id: ch01-b27
          speaker: narrator
          text: >-
            他动作太急，碰倒了酒瓶。一股浓黑的烟猛地升起，把他团团围住。老女奴冲进来尖叫，南吉尔也被吓得慌了神，匆匆逃出屋子。
    - id: ch02
      title: 午夜出走的手表
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            南吉尔在一座清真寺的台阶上熬过余下的夜晚。天刚露出一点曙光，他便从头巾褶里取出画像，想起泽丽达的话，问清方向，直奔她说的店铺。
        - id: ch02-b02
          speaker: narrator
          text: >-
            商人拿出好几块表，指给他最好的一块，要价三枚金币。南吉尔爽快地答应，商人却不肯马上交货，一定要先知道他住在哪里。
        - id: ch02-b03
          speaker: nangir
          text: >-
            这件事连我自己都不知道。我昨天才进城，连先前去过的那所房子都找不到了。
        - id: ch02-b04
          speaker: izouf
          text: >-
            那就跟我来。我带你去一户正派的穆斯林家。那里花不了多少钱，你需要什么也都能得到。
        - id: ch02-b05
          speaker: narrator
          text: >-
            南吉尔答应下来，跟着商人穿过好几条街，来到他举荐的那户穆斯林人家。他又听从商人的劝告，把身上最后一枚金币也预付出去，作为往后的食宿费用。南吉尔吃过饭，便把自己关在房里。他伸手探进头巾褶中，想取出心爱的画像，手指却碰到一封封着口的信。显然，有人瞒着他把它藏了进去。他一看字迹出自养母齐内比，立刻迫不及待地拆开。
        - id: ch02-b06
          speaker: narrator
          text: >-
            信里，齐内比先叫他“我最亲爱的孩子”，又说这封信总有一天会从头巾里被发现。她终于告诉南吉尔，他其实不是他们的儿子。他的生父似乎是远方的一位大人物，还来信威胁他们，若不立刻归还孩子，便要报仇。齐内比说，他们会永远爱南吉尔，可他不能回去，也不要再写信，因为那都没有用了。
        - id: ch02-b07
          speaker: narrator
          text: >-
            封套里果然另有一卷纸，字迹是南吉尔从未见过的。写信的人骂穆罕默德夫妇是叛徒，认定他们和巫师勾结。那些巫师掳走了不幸的西罗科的两个女儿，还夺去了姑娘们从父亲那里得到的护符，而穆罕默德夫妇又把他的儿子藏起来，不让父子相见。如今他已经查出他们藏身的地方，便凭神圣先知起誓，必会惩罚这桩罪行。他最后还说，自己的弯刀落下得比闪电更快。
        - id: ch02-b08
          speaker: narrator
          text: >-
            可怜的南吉尔读完两封信，完全弄不懂里面那些人和事情的来龙去脉，只觉得比先前更加悲伤，也更加孤独。他慢慢明白，写第二封信给穆罕默德夫妇的人大概就是自己的生父，可这个人是谁，住在哪里，又该从哪一条路去寻找，他全都不知道。其实，比起这个从未谋面的父亲，他心里惦记更多的，仍是把自己养大、以后却再也不能相见的穆罕默德和齐内比。
        - id: ch02-b09
          speaker: narrator
          text: >-
            为了摆脱这些阴沉的念头，也为了让自己能够认真打算将来，南吉尔出了门，在城里快步走了很久，直到天色全黑才回来。刚跨过门槛，他忽然看见脚边有一样东西在月光下闪闪发亮。捡起来一看，原来是一块镶满宝石、光彩夺目的金表。他朝街道两头仔细张望，想找一找失主，却连一个人影也没有。他只好把金表收进腰带，和早晨从犹太商人手里买来的银表放在一起。
        - id: ch02-b10
          speaker: narrator
          text: >-
            他想，这些宝石至少值一千枚塞金，足够自己在找到父亲以前生活了。这个念头让他稍觉安慰。他把两块表放在身边，躺下睡了。
        - id: ch02-b11
          speaker: narrator
          text: >-
            到了半夜，南吉尔突然惊醒。一个轻柔的声音像是从手表里传出来。
        - id: ch02-b12
          speaker: narrator
          text: >-
            那声音问姐姐奥萝拉，有没有人在午夜替她上发条。
        - id: ch02-b13
          speaker: narrator
          text: >-
            另一道声音回答，没有，并反问亲爱的阿让蒂娜有没有被人记起。
        - id: ch02-b14
          speaker: narrator
          text: >-
            第一人说，自己也被忘了。如今已经一点钟，她们只得等到明天才能离开牢笼，还得看明天会不会再次被人忘记。
        - id: ch02-b15
          speaker: narrator
          text: >-
            奥萝拉说，她们留在这里也无事可做，只能听天由命，还是走吧。
        - id: ch02-b16
          speaker: narrator
          text: >-
            南吉尔惊得坐起身。月光下，两块表从身边滑到地板上，自己滚出了房间。它们一路经过猫住的地方，又顺着楼梯溜了下去，转眼便不见踪影，滚进了街上。南吉尔冲到门口，想立刻追出去，可钥匙无论怎样用力也转不动。他折腾了好一阵，只好放弃，独自回到床上。
        - id: ch02-b17
          speaker: narrator
          text: >-
            第二天，所有烦恼又重重压来。南吉尔比任何时候都孤独贫穷。他把头巾猛地扣上，佩好剑，决定去找卖表的商人问清楚。可到了集市，店里已经换了另一个人。
        - id: ch02-b18
          speaker: izif
          text: >-
            你找的是我兄弟。我们轮流看店，也轮流进城办事。
        - id: ch02-b19
          speaker: nangir
          text: >-
            办什么事？你就是那个恶棍的兄弟！他昨天卖我的表，夜里竟自己跑了。我一定要把它找回来。找不回来，你这个做兄弟的就得赔！
          emotion: angry
        - id: ch02-b20
          speaker: izif
          text: >-
            你说什么？表会自己跑？要说是一桶酒，还有几分可能。可一块表怎么会跑呢？
        - id: ch02-b21
          speaker: narrator
          text: >-
            人群飞快围了上来。南吉尔说，这事是真是假，交给卡迪判断。恰好昨天的商人走进集市，他立刻抓住对方胳膊，拖着他去卡迪的宅邸。离开前，店里的人凑近兄弟，叫他什么都不要承认，不然两个人都得完蛋。这句低语偏偏也让南吉尔听见了。
        - id: ch02-b22
          speaker: narrator
          text: >-
            卡迪得知经过，先照土耳其人的习惯，命人用棍棒赶散围在宅邸外面的人，再让南吉尔站到面前，把自己受到的委屈一件件说清。听完这桩匪夷所思的故事，他转身盘问商人，要他亲口回答。商人却一句也不说，只把双眼望向天空，身体直挺挺地倒下，当场昏了过去。
        - id: ch02-b23
          speaker: narrator
          text: >-
            卡迪不理会昏倒的人，只说南吉尔的话实在难信，吩咐把商人送回家。南吉尔气得忘了对法官应有的敬意。
        - id: ch02-b24
          speaker: nangir
          text: >-
            把他弄醒！逼他说出真相！
          emotion: angry
        - id: ch02-b25
          speaker: narrator
          text: >-
            他挥剑打了商人一下，疼得那人尖声大叫。
        - id: ch02-b26
          speaker: izouf
          text: >-
            您都亲眼看见了，这年轻人已经疯了。我可以原谅他打我，可千万别把我留在他手里。
        - id: ch02-b27
          speaker: narrator
          text: >-
            就在这时，海上巴沙正巧从卡迪的宅邸外经过。他听见里面吵闹不休，便走进来询问缘故。卡迪和在场的人把这桩奇怪争执从头说明。巴沙没有立刻下判断，只仔细端详南吉尔的面孔和举止，随后用温和的语气问他，这一连串怪事究竟是怎样发生的。
        - id: ch02-b28
          speaker: nangir
          text: >-
            大人，我发誓每句话都是真的。也许您听说我也中过这类人的魔法，就会相信了。我曾被变成一口三条腿的锅，整整过了三年。直到有人把一条头巾系在锅盖上，我才重新变回人。
        - id: ch02-b29
          speaker: narrator
          text: >-
            巴沙一听，欢喜得撕开长袍，一把抱紧了他。
        - id: ch02-b30
          speaker: pasha
          text: >-
            我的儿子！我终于找到你了吗？你是不是从穆罕默德和齐内比家里来的？
          emotion: happy
        - id: ch02-b31
          speaker: nangir
          text: >-
            是的，大人。我落难以后，是他们照顾了我。他们还用自己的品行为榜样，教我努力做一个更配得上当您儿子的人。
        - id: ch02-b32
          speaker: pasha
          text: >-
            赞美先知！就在我最想不到的时候，他把一个儿子送回来了！
          emotion: happy
    - id: ch03
      title: 铜锅与三兄弟
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            巴沙转向卡迪，讲起他同美丽的赞巴克成婚后的最初几年。他们一共生了三个儿子。长子三岁时，一位神圣的托钵僧送他一串最上等的珊瑚念珠，要他好好守住宝物，忠于先知，这样便会得到幸福。次子得到一块铜牌，上面用七种文字刻着穆罕默德之名。如今站在大家眼前的南吉尔，正是这个孩子。托钵僧嘱咐他永远不要摘下象征真诚信徒的头巾，这样就会尝到世间最大的欢乐。幼子右臂则戴上一只手镯，托钵僧祝愿他的右手洁净、左手无瑕，永远不知忧愁。
        - id: ch03-b02
          speaker: pasha
          text: >-
            我的长子没有听从托钵僧的告诫，后来遭了可怕的灾难，幼子也一样。我怕次子遇上同样的不幸，出征前便把他安置在一个僻静的地方，交给忠仆古卢库照看。那时，我正要到远方去同神圣信仰的敌人作战。战争一结束，我便急忙赶去拥抱儿子，孩子和古卢库却全都不见了。直到几个月前，我才听说他住在一个叫穆罕默德的人家里，以为正是那个人偷走了他。儿子，你究竟怎么到了他们手里？
        - id: ch03-b03
          speaker: nangir
          text: >-
            大人，我只记得小时候和一个老仆住在海边的城堡里。大约十二岁那年，我们散步时遇见一个边跳舞边走来的人，他的脸和这个犹太人一模一样。我忽然头晕，想抬手摸头，双手却变得僵硬。我成了一口铜锅，两条胳膊成了锅把。有人把我捡起来飞快带走，老仆后来怎样，我一点也不知道。
        - id: ch03-b04
          speaker: nangir
          text: >-
            后来仿佛过了好几天，我被放在一道茂密的树篱旁边。掳走我的人躺在不远处，鼾声响得厉害。我认定这是逃跑的机会，便使出全力，从一根根荆棘中挤过去，又用三条腿稳稳当当地走了大约一个钟头。大人，您绝想不到用三条腿走路有多别扭，尤其那三条腿的膝盖还像我的一样僵硬。我历尽艰难，总算走进一片菜园，深深藏到卷心菜丛里，在那里安安静静地过了一夜。
        - id: ch03-b05
          speaker: nangir
          text: >-
            第二天日出时，一个女人弯腰打量我。不远处的男人问她，齐内比，你找到了什么？她说，是全世界最漂亮的一口锅，谁能想到会在自家菜地里发现它。
        - id: ch03-b06
          speaker: nangir
          text: >-
            穆罕默德把我提起来，赞叹地看了又看。我很高兴，因为谁都喜欢受人欣赏，哪怕他只是一口锅。他们把我带回家，装满水，放到火上。整整三年，我过着安静又有用的生活。那时齐内比还年轻漂亮，每天都把我擦得发亮。
        - id: ch03-b07
          speaker: nangir
          text: >-
            一天早晨，她把一大块上好的牛里脊放进我肚里，架到火上，要炖作晚餐。她怕蒸汽从锅盖缝里漏掉，坏了炖肉的滋味，便四下寻找压住锅盖的东西。手边除了丈夫的头巾，什么也没有，她就把头巾牢牢系在锅盖上。她一走，我三年来第一次感到火焰灼痛脚底，便稍稍往旁边挪了一些。这次移动起来，可比当年逃进菜园容易多了。接着，我不知怎的感觉自己正在长高。果然，没过几分钟，我就恢复了人形。
        - id: ch03-b08
          speaker: nangir
          text: >-
            第三个祈祷时辰以后，穆罕默德和齐内比一起回家。厨房里的铜锅没了，却站着一个年轻人，两人有多吃惊，你们不难想象。我把全部经历讲给他们听，他们起初怎么也不肯相信。费了许多口舌，我总算说服他们，让他们知道我讲的是真话。此后，我又和他们生活了两年。他们一直待我如亲生儿子，直到前几天才送我进城谋生。诸位大人，这就是我从头巾里找到的两封信，也许能替我的故事再添一份证据。
        - id: ch03-b09
          speaker: narrator
          text: >-
            南吉尔说话时，受伤商人的血渐渐止住。门口忽然出现一位二十二岁左右的美貌犹太女子。她头发散乱，衣裳不整，像刚逃过一场大祸，一手还拿着两根白木拐杖。她身后跟着两个腿缠麻布、拄着粗棍的男人，一个是店里的商人，另一个正是当年变锅时南吉尔见过的人。
        - id: ch03-b10
          speaker: narrator
          text: >-
            女子走到受伤的伊祖夫身边，把手里的两根白木拐杖轻轻放在他附近。她凝视着他的伤口和狼狈模样，再也忍不住，忽然失声痛哭起来。
        - id: ch03-b11
          speaker: soumi
          text: >-
            可怜的伊祖夫，你为什么让自己卷进这种危险？看看结果吧。不只你遭了殃，两个兄弟也被你连累了。
          emotion: sad
        - id: ch03-b12
          speaker: narrator
          text: >-
            她转向另外两人，他们已经瘫坐在兄弟脚边的席子上。巴沙和众人既惊叹她的美貌，也听不懂她的话，便请她解释。
        - id: ch03-b13
          speaker: soumi
          text: >-
            诸位大人，我叫苏米，父亲摩伊泽斯是最有名的拉比之一。我深爱伊扎夫，为此受尽折磨。他虽然忘恩负义，我还是没法把他从心里割舍。伊扎夫，把你们兄弟的故事都说出来吧。也许真心悔过，还能换来宽恕。
        - id: ch03-b14
          speaker: narrator
          text: >-
            卡迪向伊扎夫示意，命他服从苏米的要求，把真相全部说出来。伊扎夫只得开口。他说，他们三兄弟同一天出生，是著名的纳坦·本-萨迪的儿子，父亲分别给他们取名伊齐夫、伊祖夫和伊扎夫。从很小的时候起，他们便一起学习魔法中隐藏的奥秘。因为出生时都在同一片星辰之下，三个人的幸福与灾祸也总是彼此相连。
        - id: ch03-b15
          speaker: izaf
          text: >-
            我们还不记事，母亲便去世了。十五岁那年，父亲染上重病，再高明的咒术也治不好。他知道死期已经临近，便把我们三个叫到床前，同我们诀别。他说自己没有任何财产可以留下，唯一的财富，就是我们已经学会的魔法奥秘。我们手里已有几块刻着神秘符号的石头，怎样制作更多这样的石头，他也早就教会了我们。
        - id: ch03-b16
          speaker: izaf
          text: >-
            父亲说，我们还缺少世上最珍贵的护符，那就是西罗科三个女儿手上戴的三枚戒指。他命我们想办法取来，又再三提醒，看见姑娘们时千万小心，别被她们的美貌俘虏。她们和我们信奉不同的宗教，也早已许配给海上巴沙的三个儿子。为了保护我们，不让只会带来痛苦的爱情迷住心窍，他劝我们一遇危险就去找拉比摩伊泽斯的女儿。她暗暗爱着我，手中还有一本《魔法书》，是她父亲亲手用书写《塔木德》的神圣墨水写成的。说完这些，父亲向后倒在软垫上，咽了气，只留下我们对三枚戒指满怀渴望。
        - id: ch03-b17
          speaker: izaf
          text: >-
            丧事一办完，我们便四处打听那几个姑娘住在哪里。费尽周折，我们才知道，她们的父亲西罗科身经百战，三个女儿的美貌则名扬天下，名字分别是奥萝拉、阿让蒂娜和泽丽达。我们商量后的第一步是乔装改扮。最后，三个人扮成异国商人去见她们，还特意租来一批上等宝石，好让身份看起来毫无破绽。
        - id: ch03-b18
          speaker: izaf
          text: >-
            父亲曾警告我们把心门紧紧关住，别受她们魅力诱惑，可那些话一点用也没有。无与伦比的奥萝拉穿着缀满闪亮珠宝的金色衣裙，金发的阿让蒂娜穿着一身银色，最小的泽丽达又是三人中最美的，打扮得像一位波斯贵妇。我们带去的奇珍异物中还有一瓶爱情灵药，无论男人还是女人，只要喝下，胸中就会燃起爱情。那是美丽的苏米送我的。她自己已经喝过，我却不肯同饮，不肯回应她的爱情，所以她满怀怨愤。
        - id: ch03-b19
          speaker: izaf
          text: >-
            姑娘们正忙着端详宝石，各自挑选最喜欢的几颗。我刚要把药倒进一只水晶杯，泽丽达的目光忽然落到裹在瓶外的纸条上。纸上警告说，千万不要同未来丈夫以外的男人共饮此水。她立刻叫我叛徒，质问我到底设下了什么圈套。我顺着她手指的地方看去，一眼便认出，那正是苏米的字迹。
        - id: ch03-b20
          speaker: izaf
          text: >-
            这时，我的两个兄弟已经用宝石换走奥萝拉和阿让蒂娜的戒指。戒指一离手，姐妹俩便消失了，原地只剩金表和银表。那个收过贿赂、放我们进屋的老女奴冲来说西罗科回来了。兄弟们吓得把表藏进头巾。女奴照看昏倒的泽丽达，我们趁机逃去投奔苏米。
        - id: ch03-b21
          speaker: izaf
          text: >-
            苏米一见我们，就骂我们是些不幸的蠢材，问我们是不是这样听从父亲告诫的。她说，那天早晨自己查阅《魔法书》，亲眼看见我们任由心落入致命的爱情，总有一天会被它毁掉。她绝不会乖乖忍受这样的羞辱，正是她写下那张警告，才及时阻止泽丽达喝掉爱情灵药。她又转向我的两个兄弟，说他们还不知道两块表会让自己付出什么代价，而真相只会叫往后的日子更加悲惨。
        - id: ch03-b22
          speaker: izaf
          text: >-
            苏米一面说，一面举起摩伊泽斯写成的圣书，指给我们看其中几行。书上写着，若在午夜用金钥匙和银钥匙分别给两块表上足发条，在随后的第一时辰里，姑娘们就会恢复本来的形体。她们将永远由一个女人看守，无论被带到什么地方，都会回到她的身边。那个命中注定要看守她们的女人，正是摩伊泽斯的女儿。
        - id: ch03-b23
          speaker: izaf
          text: >-
            兄弟们知道受骗，气得要命，却毫无办法，只得把表交给苏米后离开。我因为好奇，独自留下。午夜钟响时，苏米上好发条，奥萝拉和阿让蒂娜便现出人形。她们还以为刚从梦里醒来，听苏米讲明命运后，绝望地哭了。苏米答应永不抛弃她们，她们才稍得安慰。一点钟一响，两人又变回手表。
        - id: ch03-b24
          speaker: izaf
          text: >-
            整整一夜，我都受着莫名恐惧的折磨，仿佛有一个看不见的东西不断推着我向前，我却不知道它究竟要把我推到哪里。黎明时分，我起身出门，在街上碰见伊齐夫。他也正被同样的恐惧折磨。我们都觉得再也不能留在君士坦丁堡，便去叫上伊祖夫，三个人一同离开城池。可走了不久，我们又决定分头赶路，免得大家走在一起，轻易被西罗科派出的密探认出来。
        - id: ch03-b25
          speaker: izaf
          text: >-
            几天后，我来到海边一座古堡门前，一个高大的奴仆正在外面来回巡守。我送给他一两颗不值钱的宝石，他的话匣子马上打开了。他告诉我，自己侍奉的是海上巴沙的儿子，那位巴沙当时正在遥远的国度作战。这个年轻人从小就注定要迎娶西罗科的一个女儿，他的两个兄弟则会娶姑娘的两个姐妹。奴仆还提起主人拥有的护符。可我满脑子只有美丽的泽丽达，原以为已经压下去的爱情，又猛烈地苏醒了。
        - id: ch03-b26
          speaker: izaf
          text: >-
            为了除掉这个危险的情敌，我决定把少年绑走。我装成疯子，一边唱一边跳，大声叫奴仆把少年带出来看我的把戏。奴仆答应了，我那副古怪模样把两个人逗得眼泪直流，他们甚至跟着我一起模仿。接着我说自己口渴，请奴仆去拿水。趁他离开，我劝年轻人摘掉头巾，让脑袋凉快凉快。他毫不怀疑，马上照办，眨眼间便变成一口铜锅。奴仆回来时的一声大喊提醒了我，再不逃命就来不及了。我一把抓起铜锅，像风一样飞奔而去。
        - id: ch03-b27
          speaker: izaf
          text: >-
            铜锅后来的事，你们已经听过。我醒来时，它不见了，两个兄弟却睡在附近。伊祖夫说，他们路过客店，听见歌声笑声，便进去坐下。几个美丽的切尔克斯姑娘正在跳舞，客人让他们坐在最美的两个姑娘身边。他们快活得忘了时间。
        - id: ch03-b28
          speaker: izaf
          text: >-
            一个切尔克斯姑娘探身对姐妹说，他们的兄弟已经跳过舞，现在也该让他们跳了。伊祖夫完全听不懂这话是什么意思，我却马上明白，她指的是我偷走巴沙儿子那天，曾在少年面前跳过舞。两个姑娘拉起兄弟们的手，同他们一直跳到筋疲力尽。大家重新入席后，他们又喝了太多酒，脑袋晕得一塌糊涂。那些男人忽然跳起来，威胁要杀死他们。兄弟俩连反抗也做不到，只能让人抢走随身的一切，连最珍贵的、西罗科两个女儿的护符也没保住。
        - id: ch03-b29
          speaker: izaf
          text: >-
            我们三个走投无路，只能回到君士坦丁堡向苏米请教。她早已从摩伊泽斯的书里读到我们的不幸，对经过一清二楚。这个心地善良的人听完，还是伤心地哭了很久。可她自己也很穷，实在帮不了多少忙。最后我想出一个办法。阿让蒂娜变成的银表，除非有人用银钥匙给它上发条，否则每天晚上都会回到苏米身边，而这种事情绝不大可能发生。因此，我们每天早晨都可以把银表卖掉。苏米答应了，条件是每次卖表都必须查清它被带到哪所房子。这样她就能把奥萝拉也带去那里，万一银表恰好在那神秘的时辰被上了发条，阿让蒂娜也不会孤单。
        - id: ch03-b30
          speaker: izaf
          text: >-
            几个星期以来，我们就靠每天卖掉银表的办法生活。西罗科的两个女儿从未漏过一晚，无论白天被带到哪里，夜里总会回到苏米身边。昨天，伊祖夫把银表卖给了南吉尔。傍晚时分，苏米又吩咐他赶在这位顾客进门以前，把金表悄悄放到门前台阶上。今天早晨，两块表果然都回到了她那里。
    - id: ch04
      title: 巴沙府里的重逢
      blocks:
        - id: ch04-b01
          speaker: nangir
          text: >-
            我要是早知道就好了！当时再机灵一点，我就能见到美丽的阿让蒂娜。画像已经那样动人，真人不知会有多美！
        - id: ch04-b02
          speaker: qadi
          text: >-
            这怪不得你。你又不是魔法师，怎么猜得到非要在那个时辰给表上发条？我会命商人把表交给你，今晚你一定不会忘记了。
        - id: ch04-b03
          speaker: izouf
          text: >-
            今天交不了。表已经卖掉了。
        - id: ch04-b04
          speaker: qadi
          text: >-
            那你就把三枚金币退给他。
        - id: ch04-b05
          speaker: narrator
          text: >-
            伊祖夫庆幸能这样脱身，伸手便去摸钱袋，南吉尔却拦住他。
        - id: ch04-b06
          speaker: nangir
          text: >-
            不！我要的不是钱，是可爱的阿让蒂娜。没有她，别的东西全都一文不值。
        - id: ch04-b07
          speaker: pasha
          text: >-
            亲爱的卡迪，我儿子说得对。他失去的珍宝，根本不能用金钱衡量。
        - id: ch04-b08
          speaker: qadi
          text: >-
            大人，您的智慧远胜于我，这件事就请您裁断吧。
        - id: ch04-b09
          speaker: narrator
          text: >-
            巴沙让所有人一同回府，又命奴仆时刻盯紧三兄弟。走到府门前，他看见附近长凳上坐着两个女人。她们脸上蒙着厚厚的面纱，衣着却极其华美。宽大的缎裤上绣着银线，细纱长袍也用了最上等的料子。其中一人手里提着粉红绸袋，袋口扎着绿色丝带，里面似乎有什么活物正在不停地动。
        - id: ch04-b10
          speaker: circassian_1
          text: >-
            尊贵的大人，请您买下这只袋子，别问里面装着什么。
        - id: ch04-b11
          speaker: pasha
          text: >-
            你要多少钱？
        - id: ch04-b12
          speaker: circassian_1
          text: >-
            三百枚塞金。
        - id: ch04-b13
          speaker: narrator
          text: >-
            巴沙轻蔑地笑了笑，径直走过。
        - id: ch04-b14
          speaker: circassian_1
          text: >-
            这笔买卖绝不会让您后悔。也许明天我们再来，您肯出四百枚。到了后天，就得五百枚了。
        - id: ch04-b15
          speaker: circassian_2
          text: >-
            走吧，别留在这里。袋里的东西也许会叫，那样秘密就藏不住了。
        - id: ch04-b16
          speaker: narrator
          text: >-
            同伴拉住说话女子的衣袖，话音一落，两个年轻女子便消失不见。犹太三兄弟被留在前厅，由巴沙的奴仆看守。南吉尔和苏米则随巴沙走进装饰富丽的宅邸。在一间灯火辉煌的大厅尽头，一位大约三十五岁的夫人斜倚在坐榻上。尽管脸上满是长久的哀愁，她看起来仍然十分美丽。
        - id: ch04-b17
          speaker: pasha
          text: >-
            无与伦比的赞巴克，快来感谢我吧！那个让你流了无数眼泪的儿子，已经找回来了。
        - id: ch04-b18
          speaker: narrator
          text: >-
            母亲还没来得及抱他，南吉尔已经扑倒在她脚边。
        - id: ch04-b19
          speaker: pasha
          text: >-
            让全家一起欢庆！再去叫易卜拉欣和哈桑来，让他们拥抱自己的兄弟。
        - id: ch04-b20
          speaker: zambac
          text: >-
            唉，大人，您忘了吗？现在正是哈桑对着自己的手哭泣、易卜拉欣捡珊瑚珠的时候。
          emotion: sad
        - id: ch04-b21
          speaker: pasha
          text: >-
            先知的命令不能违背。那就等到傍晚吧。
        - id: ch04-b22
          speaker: soumi
          text: >-
            尊贵的大人，请原谅我插话。这究竟是什么谜？有《魔法书》帮忙，也许我能尽一点力。
        - id: ch04-b23
          speaker: pasha
          text: >-
            苏米，我一生的幸福已经有赖于你。跟我来吧。我那两个可怜儿子的模样，比任何话都更能说明苦难。
        - id: ch04-b24
          speaker: narrator
          text: >-
            巴沙从坐榻上起身，掀开通往另一座大厅的帷幔。南吉尔和苏米紧跟在他身后。厅里有两个年轻人，一个大约十七岁，另一个十九岁。年纪较小的坐在桌前，额头枕着右手，泪水不停落在那只手上。父亲进来时，他微微抬头。南吉尔和苏米这才看清，那只手不是寻常的肤色，竟像用乌木做成的一样。
        - id: ch04-b25
          speaker: narrator
          text: >-
            另一个年轻人正忙着捡拾散落满地的珊瑚珠。每找到一颗，他便放到弟弟面前那张桌上。他已经找回九十八颗，以为这回总算全部找齐。谁知就在这时，珠子忽然从桌面四散滚落，他先前的工夫全白费了，只得弯下腰，从第一颗重新捡起。
        - id: ch04-b26
          speaker: pasha
          text: >-
            你们看，每天都有三个钟头，一个儿子必须捡这些珠子，另一个要对着黑手哭泣。我始终不知道灾祸为何降临。
        - id: ch04-b27
          speaker: soumi
          text: >-
            我们别再留在这里，免得让他们更痛苦。请准许我回去取《魔法书》。书里应该既有病因，也有医治的办法。
        - id: ch04-b28
          speaker: nangir
          text: >-
            可你要是离开，今晚奥萝拉和我心爱的阿让蒂娜回来时，我就见不到她了。在见到她以前，每一刻都像没有尽头。
        - id: ch04-b29
          speaker: soumi
          text: >-
            放心，日落以前我一定回来。我把心爱的伊扎夫留在这里作保证。
        - id: ch04-b30
          speaker: narrator
          text: >-
            苏米离开南吉尔才一会儿，泽丽达的老乳母便走进三兄弟仍受严密看守的大厅，身后还跟着一名衣着华贵的军人。南吉尔急切地迎上去。他起初没有认出来，这个男人正是两天前请他进家吃饭的主人。那个女人他倒一眼就认出了，正是泽丽达的乳母。
        - id: ch04-b31
          speaker: nurse
          text: >-
            大人，就是这些人！我从卡迪家一路跟踪到这座宫殿，绝不会认错。动手吧，替自己报仇！
        - id: ch04-b32
          speaker: narrator
          text: >-
            军人脸涨得通红，拔剑便要扑向三兄弟。南吉尔和巴沙的奴仆赶紧合力抓住他。
        - id: ch04-b33
          speaker: nangir
          text: >-
            你在做什么？这些人受巴沙保护，你怎么敢袭击他们？
        - id: ch04-b34
          speaker: sirocco
          text: >-
            孩子，要是巴沙知道这些恶棍夺走了我最珍爱的一切，一定会收回保护。他不了解他们，就像不了解你一样。
        - id: ch04-b35
          speaker: nangir
          text: >-
            他很了解我，因为他已经认出我是他的儿子。跟我去见他吧。
        - id: ch04-b36
          speaker: narrator
          text: >-
            军人听了，先向南吉尔躬身致意，随后穿过他掀起的帷幔。南吉尔跟在后面，惊讶地看见父亲一认出来人，便猛然迎上前去，一把抱住了这名军人。原来，这个人正是三个姑娘的父亲西罗科，也是巴沙以为早已战死的老朋友。
        - id: ch04-b37
          speaker: pasha
          text: >-
            真的是你吗，我亲爱的西罗科？那场惨烈战役里，先知的信徒溃败，我一直以为你死了。可你的眼里怎么又燃着那天的怒火？先平静下来，告诉我能怎样帮你。我已经找回儿子，就把这当成你也会幸福的吉兆吧。
        - id: ch04-b38
          speaker: sirocco
          text: >-
            我不知道你哀悼多年的儿子已经回来。几天前，先知在梦里向我显现，周身环绕着光。他命我第二天日落去加拉塔门，带回一个年轻人，说那是老友海上巴沙的次子。他还说，只要把手伸进年轻人的头巾，就会摸到一块铜牌，上面用七种文字刻着他的名字。
        - id: ch04-b39
          speaker: sirocco
          text: >-
            我照做了。那孩子的相貌举止都让我喜欢，我便让他爱上阿让蒂娜，把画像交给他。正当我盼着把儿子送还给你，几滴爱情灵药洒在桌上，浓烟遮住一切。烟散以后，他已经不见。今早，老女奴说找到了偷走女儿的叛徒，我立刻赶来报仇。现在我听你处置。
        - id: ch04-b40
          speaker: pasha
          text: >-
            我相信命运会眷顾我们。今晚，我有望同时得到金表和银表。立刻派人去请泽丽达吧。
    - id: ch05
      title: 花园墙后的声音
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            门口传来丝绸的窸窣声，所有人的目光都转了过去。易卜拉欣和哈桑每天所受的惩罚此刻已经结束，两人走进大厅，第一次拥抱这位失散多年的兄弟。南吉尔和同样喝过爱情灵药的哈桑，满心只想着俘获他们心灵的美丽姑娘。易卜拉欣原本已经疲惫不堪，听说摩伊泽斯的女儿要从《魔法书》里寻找咒语，让他不必再捡那些珠子，也立刻重新有了精神。
        - id: ch05-b02
          speaker: narrator
          text: >-
            几个小时以后，苏米带着圣书回来了。她招手叫哈桑走到身边，让他亲自看一看写在书里的命运。哈桑俯下身，读出那几行希伯来文字。书上说，他的右手因为碰到不洁动物的脂油，才变得像乌木一样黑。直到那一族最后一个活物溺死在海中，这只手才会恢复原来的样子。
        - id: ch05-b03
          speaker: hassan
          text: >-
            唉，我想起来了！有一天，赞巴克的女奴在做糕饼。她警告我别碰，因为里面放了猪油，我偏不听。我的手一下子就变成了这块乌木。
          emotion: sad
        - id: ch05-b04
          speaker: pasha
          text: >-
            神圣的托钵僧说得多准！我的儿子没有听从手镯带来的告诫，才受到这样严厉的惩罚。聪慧的苏米，那一族最后的活物在哪里？怎样才能解除灾难？
        - id: ch05-b05
          speaker: soumi
          text: >-
            这里写着，小黑猪就在两个切尔克斯女子提着的粉红袋子里。
        - id: ch05-b06
          speaker: narrator
          text: >-
            巴沙一听这句话，想起早晨被自己拒绝的交易，顿时绝望地倒在软垫上。
        - id: ch05-b07
          speaker: pasha
          text: >-
            就是今早她们要卖三百塞金的袋子！她们一定是客店里逼伊齐夫和伊祖夫跳舞，又夺走西罗科女儿护符的人。只有她们能解除魔法。快把她们找来，我愿意送出一半财产！我真蠢，竟把她们赶走了！
          emotion: sad
        - id: ch05-b08
          speaker: narrator
          text: >-
            巴沙还在一遍遍懊悔自己的愚行，易卜拉欣已经轮到翻开《魔法书》。他看见书上的字，脸一下子涨得通红。上面写着，这串神圣的念珠曾被“奇数偶数”的游戏玷污。念珠的主人为了作弊，故意藏起一个数目。因此，这个背弃信义的穆斯林必须永远寻找那颗失去的珠子。
        - id: ch05-b09
          speaker: ibrahim
          text: >-
            天哪，那一天我又想起来了！我和奥萝拉玩耍时弄断了念珠。九十九颗珠子都握在我手里，她猜是奇数。为了让她输，我故意丢下一颗。从那以后，我每天都在找，可它始终不出现。
        - id: ch05-b10
          speaker: pasha
          text: >-
            神圣的托钵僧说得多准！念珠残缺以后，我儿子一直在受罚。《魔法书》难道不能告诉我们，怎样救易卜拉欣吗？
        - id: ch05-b11
          speaker: soumi
          text: >-
            找到了。书上说，珊瑚珠藏在黄色锦缎衣裙的第五道褶里。
        - id: ch05-b12
          speaker: pasha
          text: >-
            太幸运了！我们很快就能见到奥萝拉。易卜拉欣可以去她黄色锦缎衣裙的第五道褶里找。书上说的一定就是她！
          emotion: happy
        - id: ch05-b13
          speaker: narrator
          text: >-
            苏米刚合上书，泽丽达便在大群奴仆和老乳母的陪伴下出现。哈桑一看见她，欢喜得不能自持，立刻跪下亲吻她的手。
        - id: ch05-b14
          speaker: hassan
          text: >-
            大人，请原谅我这样激动。我根本不需要爱情灵药，这颗心早就燃烧起来了！请快为我们举行婚礼吧！
          emotion: happy
        - id: ch05-b15
          speaker: pasha
          text: >-
            儿子，你疯了吗？兄弟们的灾祸还没结束，你怎么能独自享福？世上又哪有一只手漆黑的新郎？再等等，先让那只小黑猪淹死在海里。
        - id: ch05-b16
          speaker: zelida
          text: >-
            是的，亲爱的哈桑。等姐姐们恢复原形，我们的幸福会增加十倍。我也把灵药带来了，让她们能和我们一样快乐。
        - id: ch05-b17
          speaker: narrator
          text: >-
            泽丽达把灵药瓶交给巴沙。巴沙当着她的面，立刻命人把瓶口封好。赞巴克见到泽丽达，也十分欢喜，把她紧紧拥进怀里。随后，她领着众人走入花园，请所有朋友围坐到一株繁茂的素馨花树下。浓密的枝条低低垂落，遮住了大家头顶。众人才刚舒舒服服地坐定，便惊讶地听见墙那边传来一个男子的声音。他看不见人，语气却愤怒极了。
        - id: ch05-b18
          speaker: hidden_man
          text: >-
            忘恩负义的姑娘！你们就这样对我吗？让我永远藏起来算了！这洞窟对我来说还不够黑，也不够深！
          emotion: angry
        - id: ch05-b19
          speaker: narrator
          text: >-
            墙外只响起一阵大笑。男子更加气恼。
        - id: ch05-b20
          speaker: hidden_man
          text: >-
            我做了什么，竟让你们这样鄙弃？我替你们弄来美貌护符时，你们答应我的就是这个吗？我还送了能带来好运的小黑猪，这难道就是我应得的报答？
          emotion: angry
        - id: ch05-b21
          speaker: narrator
          text: >-
            听到这里，众人再也压不住好奇。巴沙命奴仆立刻动手推倒围墙。墙很快被拆掉，刚才说话的男子却无影无踪。那边只有两个美得惊人的姑娘，她们看起来泰然自若，仿佛什么也没发生，还快活地跳着舞走上露台。与她们同行的另有一个老奴仆。巴沙仔细一看，认出他正是多年前负责看护南吉尔的古卢库。
        - id: ch05-b22
          speaker: narrator
          text: >-
            古卢库一见巴沙，立刻吓得缩成一团。他当年让南吉尔从眼前被人抢走，一直以为落到巴沙手里非死不可。巴沙却向他做了一个宽恕的手势，没有追究旧事，只问他当年从悬崖跳下去以后，究竟怎样逃过了死亡。
        - id: ch05-b23
          speaker: guluku
          text: >-
            一个托钵僧救起我，治好了伤，后来又把我送给这两位姑娘做奴仆。从那以后，我一直服侍她们。
        - id: ch05-b24
          speaker: pasha
          text: >-
            可刚才那个声音提到的小黑猪在哪里？
        - id: ch05-b25
          speaker: circassian_1
          text: >-
            大人，您下令拆墙时，那个男人被响声吓坏了。他抱起小猪逃走了。
        - id: ch05-b26
          speaker: pasha
          text: >-
            立刻派人追他！
        - id: ch05-b27
          speaker: narrator
          text: >-
            两个姑娘却笑了起来。
        - id: ch05-b28
          speaker: circassian_2
          text: >-
            大人，不用惊慌。他一定会回来。只要派人守住洞口，等他进去以后，别再放他出来。
        - id: ch05-b29
          speaker: narrator
          text: >-
            这时夜色已经降临，众人全都回到宫殿。侍从在女眷住处附近的一座华丽长廊里，给他们送上咖啡和水果。巴沙随后命人把犹太三兄弟带来，让两个切尔克斯姑娘认一认，他们是不是客店里被逼着跳舞的那几个人。谁知看守们刚才全去帮忙拆墙了，三个犹太人已经抓住机会逃得无影无踪。这一连串疏忽叫巴沙大为恼怒。
        - id: ch05-b30
          speaker: narrator
          text: >-
            犹太女子苏米听到三兄弟逃走的消息，脸色顿时变得苍白。可是，当她低头看了一眼随身带回来的《魔法书》，面容很快又明亮起来。她半是说给众人听，半是自言自语地开了口。
        - id: ch05-b31
          speaker: soumi
          text: >-
            没什么可担心的。他们会抓住那个托钵僧。
        - id: ch05-b32
          speaker: narrator
          text: >-
            哈桑听见苏米的话，却依旧大声哀叹。他说，命运刚刚从一边向他们现身，转眼又从另一边逃走了。巴沙的一名侍童正好听见这番感慨，忍不住当着众人的面笑了起来。
        - id: ch05-b33
          speaker: page
          text: >-
            大人，这一份命运是跳着舞来的，另一份却拄着拐杖逃走。您别担心，她走不了多远。
        - id: ch05-b34
          speaker: narrator
          text: >-
            巴沙听见侍童这样无礼地插嘴，心里很不高兴。他当即命侍童退出房间，在没有得到召唤以前，不许擅自回来。
        - id: ch05-b35
          speaker: page
          text: >-
            大人的命令，我一定服从。不过等我回来时，我带来的伙伴会让您高高兴兴地欢迎我。
        - id: ch05-b36
          speaker: narrator
          text: >-
            侍童说完便出去了。众人留下以后，南吉尔转向两个陌生女子，恳求她们相助。
        - id: ch05-b37
          speaker: nangir
          text: >-
            我和两个兄弟深爱着三位举世无双的姑娘，其中两人正受残酷魔法折磨。要是她们的命运就在你们手中，难道你们不肯尽全力，让她们重新得到幸福和自由吗？
        - id: ch05-b38
          speaker: narrator
          text: >-
            年轻人的请求没有换来帮助，反而激怒了两个女子。这个意想不到的反应使在场众人无不惊愕，其中一人站出来，厉声回答。
        - id: ch05-b39
          speaker: circassian_1
          text: >-
            恋人的悲伤和我们有什么关系？命运夺走了我们的爱人。只要做得到，我们就要让全世界的人都和我们受一样的苦！
          emotion: angry
        - id: ch05-b40
          speaker: narrator
          text: >-
            这番意外的话让当时在场的所有人惊愕不已，谁也没有料到她会这样回答。巴沙想弄清两个姑娘为何如此怨恨恋人的幸福，便恳请刚才说话的女子，把她和姐妹经历的故事从头讲给大家听。她先征求身旁姐妹的许可，得到同意以后，终于面对众人开了口。
