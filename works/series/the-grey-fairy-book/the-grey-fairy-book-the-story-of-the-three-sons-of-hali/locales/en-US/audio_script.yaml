  chapters:
    - id: ch01
      title: Neangir Comes to Constantinople
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Until his eighteenth birthday, Neangir lived happily in a village forty miles from Constantinople. He believed that Mohammed and his wife Zinebi, who had raised him, were his true parents. He was neither rich nor important, but he was content and had no wish to leave home.
        - id: ch01-b02
          speaker: narrator
          text: Then one day Mohammed told him, with many sighs, that it was time to go to Constantinople and choose a profession. He might become a soldier, or perhaps a doctor of the law who explained the Koran to others, for Neangir already knew nearly all of the holy book by heart.
        - id: ch01-b03
          speaker: mohammed
          text: You must choose your own path. Write and tell us how you live, and we promise we will never forget you.
        - id: ch01-b04
          speaker: narrator
          text: Mohammed gave him four piastres for his start in the great city and obtained permission for him to travel with a caravan bound for Constantinople. The journey lasted several days because the caravan moved very slowly. At last, the walls and towers of the capital appeared in the distance. When the caravan stopped, all the travelers went their separate ways. Neangir remained behind alone. He had never left the village where he grew up. No one had ever told him about Constantinople, and he did not know even one street by name or a single person who lived there.
        - id: ch01-b05
          speaker: narrator
          text: Though brave and ready to make friends, he felt strange and lonely. As he stood wondering what to do, a pleasant-looking man bowed and invited him to stay at his house until he had made his plans. With nowhere else to go, Neangir accepted.
        - id: ch01-b06
          speaker: narrator
          text: Neangir followed the stranger home. They entered a large room where a girl of about twelve was setting three places for supper. An old slave quietly placed a dish of pillau on the table. It was made with rice and meat and was much loved in that country. She set a glass of sherbet at each place and slipped from the room.
        - id: ch01-b07
          speaker: siroco
          text: Zelida, was I not right when I said I would bring a friend home to supper?
        - id: ch01-b08
          speaker: zelida
          text: Father, you are always right. Better still, you never lead anyone else astray.
        - id: ch01-b09
          speaker: narrator
          text: During the meal, their host talked at length about one subject after another. Neangir barely listened. He did nothing but gaze at Zelida whenever he could manage it without being openly rude. The girl noticed. She blushed, grew more and more uncomfortable, and at last turned to her father. Her voice was low and uncertain when she spoke.
        - id: ch01-b10
          speaker: zelida
          text: That stranger keeps staring at me. If Hassan hears of it, his jealousy will drive him mad.
        - id: ch01-b11
          speaker: siroco
          text: No, he is certainly not meant for you. I intend him for your sister Argentine, just as I told you. I will make sure his heart belongs to her.
        - id: ch01-b12
          speaker: narrator
          text: He took fruit, wine, and a little silver box inlaid with mother-of-pearl from a cupboard. Then he poured Neangir a glass.
        - id: ch01-b13
          speaker: siroco
          text: Taste this wine.
        - id: ch01-b14
          speaker: zelida
          text: Give me some too!
        - id: ch01-b15
          speaker: siroco
          text: Certainly not. You and Hassan drank quite enough the other day.
        - id: ch01-b16
          speaker: zelida
          text: Then you drink some, or he will think we mean to poison him.
        - id: ch01-b17
          speaker: siroco
          text: Very well. At my age this elixir is not dangerous, though it is dangerous at yours.
        - id: ch01-b18
          speaker: narrator
          text: Neangir emptied his glass. His host opened the little box and showed him the portrait of a maiden more beautiful than anyone he had dreamed of. A powerful new feeling filled his heart, and for a while he could not speak.
        - id: ch01-b19
          speaker: neangir
          text: Please explain all this. Why did you bring me here? Why make me drink a dangerous liquid that has set my blood on fire? And why show me a picture so beautiful that I can hardly think?
        - id: ch01-b20
          speaker: siroco
          text: I can answer some questions, but not all. This is Zelida's sister. The picture has filled your heart with love for her. Go and seek her. When you find her, you will find yourself.
        - id: ch01-b21
          speaker: neangir
          text: But where can I find her?
        - id: ch01-b22
          speaker: siroco
          text: I cannot tell you any more.
        - id: ch01-b23
          speaker: zelida
          text: I can! Tomorrow, go to the Jewish bazaar and buy a watch from the second shop on the right. Then, at midnight—
        - id: ch01-b24
          speaker: narrator
          text: Her father covered her mouth before she could finish.
        - id: ch01-b25
          speaker: siroco
          text: Be silent, child! Will your carelessness bring the fate of your unhappy sisters down on you too?
        - id: ch01-b26
          speaker: narrator
          text: His sudden movement overturned the precious bottle. Thick black vapor poured from it and rose around him until he vanished from sight. The old slave rushed into the room and gave a piercing scream. Neangir had no idea what the unfinished warning meant, what had become of his host, or what danger threatened Zelida and her sisters. Shaken by the whole strange adventure, he hurried out of the house.
    - id: ch02
      title: The Two Watches
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Neangir spent the night on the steps of a mosque. At dawn he took Argentine's portrait from his turban, remembered Zelida's directions, and found the second shop on the right in the Jewish bazaar. A merchant showed him several watches and recommended one that cost three gold pieces.
        - id: ch02-b02
          speaker: narrator
          text: Neangir agreed to the price, but the merchant refused to hand it over without knowing where his customer lived.
        - id: ch02-b03
          speaker: neangir
          text: I do not know myself. I arrived only yesterday, and I cannot even find the first house I visited.
        - id: ch02-b04
          speaker: merchant_izouf
          text: Come with me, then. I know a good Mussulman who will give you everything you need for a small charge.
        - id: ch02-b05
          speaker: narrator
          text: Neangir followed him through several streets and paid his last gold piece in advance for food and lodging. After dinner he shut himself in his room and reached into his turban for the portrait. His fingers touched a sealed letter hidden there by Zinebi.
        - id: ch02-b06
          speaker: narrator
          text: The letter called him her dearest child, then told him that Mohammed and Zinebi were not his true parents. They believed his father was a great lord from some distant land. Inside the same packet was a letter from that man, who threatened revenge unless Neangir was restored to him at once. Zinebi promised that she and Mohammed would always love the boy they had raised. Even so, she begged him neither to seek them nor write to them, because any attempt would be useless.
        - id: ch02-b07
          speaker: narrator
          text: In the same wrapper lay the father's message. It accused Mohammed and Zinebi of joining magicians who had stolen two daughters of Siroco and taken their talismans. It charged them with hiding the writer's son and swore, by the Holy Prophet, that his scimitar would punish their crime as swiftly as lightning.
        - id: ch02-b08
          speaker: narrator
          text: The two letters left Neangir completely bewildered. He understood nothing about Siroco's stolen daughters, their talismans, or the magicians accused of taking them. Slowly, one fact became clear. The man who wrote the threat must be his true father. Yet the letter gave him no place to search and no way to recognize that father. His thoughts returned instead to Mohammed and Zinebi, who had loved and raised him. He was forbidden to see them again, and that loss made him feel sadder and lonelier than ever.
        - id: ch02-b09
          speaker: narrator
          text: He walked quickly through the city until nightfall, trying to shake off his sadness and decide what to do. On returning to his lodging, he saw something sparkling at the threshold. It was a gold watch covered in jewels. No owner was anywhere in sight, so he put it beside the silver watch in his sash.
        - id: ch02-b10
          speaker: narrator
          text: The unexpected treasure lifted his spirits a little. Neangir thought the jewels alone might sell for at least a thousand sequins. Such a sum would surely support him until he managed to find his father. Comforted by that thought, he went upstairs to his room. He took the silver watch he had bought that morning from his sash and laid it beside the jeweled gold one. Then he stretched out beside his two new treasures and prepared to sleep.
        - id: ch02-b11
          speaker: narrator
          text: In the middle of the night, a soft voice woke him. It seemed to come from one of the watches.
        - id: ch02-b12
          speaker: argentine
          text: Aurora, my sister, did anyone remember to wind you at midnight?
        - id: ch02-b13
          speaker: aurora
          text: No, dear Argentine. Did they wind you?
        - id: ch02-b14
          speaker: argentine
          text: No. Now it is one o'clock, so we cannot leave our prison until tomorrow, if no one forgets us again.
        - id: ch02-b15
          speaker: aurora
          text: There is nothing for us to do here. We must accept our fate. Come, let us go.
        - id: ch02-b16
          speaker: narrator
          text: Filled with astonishment, Neangir sat upright. By moonlight, he watched the two watches slide from beside his bed to the floor. They rolled out of the room and passed the cats' quarters. He sprang after them and reached the staircase, but they slipped down so quickly that he lost sight of them. They reached the street before he did. He struggled with the door, but its key refused to turn. At last he had to give up the chase and return to bed without either watch.
        - id: ch02-b17
          speaker: narrator
          text: When morning came, all Neangir's troubles returned with ten times their former force. The money he had spent was gone, both marvelous watches had escaped, his foster parents were lost to him, and his true father remained unknown. He felt lonelier and poorer than ever. In a fit of despair, he thrust his turban onto his head, stuck his sword into his belt, and left the lodging. He was determined to force an explanation from the merchant who had sold him the silver watch. At the bazaar, however, the man was absent. Another merchant stood in his place.
        - id: ch02-b18
          speaker: merchant_izif
          text: You want my brother. We take turns here while the other goes into the city on business.
        - id: ch02-b19
          speaker: neangir
          text: What business? Your scoundrel of a brother sold me a watch that ran away in the night! I will find it, or you will pay for it in his place.
          emotion: angry
        - id: ch02-b20
          speaker: narrator
          text: A crowd quickly gathered around them.
        - id: ch02-b21
          speaker: merchant_izif
          text: A watch ran away? If it were a cask of wine, perhaps I could believe you. But a watch? That is hardly possible.
        - id: ch02-b22
          speaker: narrator
          text: Neangir declared that the Cadi would decide. Just then the first merchant entered the bazaar. Neangir seized his arm and dragged him away, but his brother managed to whisper a warning loudly enough for Neangir to hear.
        - id: ch02-b23
          speaker: merchant_izif
          text: Admit nothing, or we are both lost.
        - id: ch02-b24
          speaker: narrator
          text: At the Cadi's house, the judge ordered the crowd scattered with blows, as was the Turkish custom. Then he asked Neangir to state his complaint. The story of a watch that spoke and ran away seemed extraordinary. When the Cadi turned to the merchant for an answer, Izouf lifted his eyes toward heaven and dropped in a dead faint. The judge paid no attention to the man lying before him. He told Neangir that such a singular tale was impossible to believe and ordered that the merchant be carried home.
        - id: ch02-b25
          speaker: narrator
          text: Neangir forgot all respect for the court. He shouted and struck the merchant with his sword, bringing a piercing cry from him.
        - id: ch02-b26
          speaker: neangir
          text: Bring him out of that faint and make him tell the truth!
          emotion: angry
        - id: ch02-b27
          speaker: merchant_izouf
          text: You can see that this young man is out of his mind. I forgive the blow, but please do not leave me in his hands.
        - id: ch02-b28
          speaker: narrator
          text: At that moment the Bassa of the Sea happened to pass. Hearing the uproar, he entered and asked what had happened. After studying Neangir's face, he gently asked how such marvels could be true.
        - id: ch02-b29
          speaker: neangir
          text: My lord, I swear every word is true. I have suffered magic myself. For three years I was a three-legged copper pot, and I became a man again only when someone laid a turban over my lid.
        - id: ch02-b30
          speaker: narrator
          text: The Bassa tore his robe for joy and embraced him.
        - id: ch02-b31
          speaker: bassa
          text: My son! Have I truly found you? Did you come from the home of Mohammed and Zinebi?
          emotion: happy
        - id: ch02-b32
          speaker: neangir
          text: Yes, my lord. They cared for me through my misfortune. By their example they taught me to be less unworthy of belonging to you.
        - id: ch02-b33
          speaker: bassa
          text: Blessed be the Prophet, who restored my son when I least expected it!
          emotion: happy
    - id: ch03
      title: The Lost Son's Story
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Bassa told the Cadi that his wife, the beautiful Zambac, had borne him three sons during the first years of their marriage. When the eldest was three, a holy dervish gave him a string of the finest coral. The dervish warned him to guard that treasure and remain faithful to the Prophet if he wished to be happy. To the second son, who now stood before them, he gave a copper plaque bearing the Prophet's name in seven languages. He told the child never to part from his turban, the sign of a true believer, and promised that he would taste the greatest joy. Around the youngest son's right arm, the dervish fastened a bracelet. He prayed that the boy's right hand would remain pure and his left hand spotless, so sorrow would never touch him. In time, the eldest and youngest sons both neglected the counsel that accompanied their gifts, and terrible troubles came upon them. The Bassa feared that his second child might suffer in the same way. While he went to fight the enemies of his faith, he sent that boy to a lonely place under Gouloucou's care. When the wars ended, the Bassa hurried home to embrace his child. He found that both the boy and his guardian had vanished. Years passed without any trace of them. Only a few months before this meeting did he learn that the lost son was living with a man called Mohammed. Because the truth was hidden from him, he suspected Mohammed of stealing the child.
        - id: ch03-b02
          speaker: bassa
          text: My eldest and youngest ignored the dervish and terrible troubles came upon them. To protect my second son, I placed him in a lonely seaside castle with my faithful servant Gouloucou while I went to war. When I returned, both had vanished. Only months ago did I learn that the boy lived with Mohammed, whom I suspected of stealing him. Tell me, my son, how did you come into his care?
        - id: ch03-b03
          speaker: neangir
          text: I remember little of my earliest years, except the castle by the sea and an old servant. When I was about twelve, we met a man with a face like this merchant's. He came dancing toward us. I suddenly felt faint, and when I tried to lift my hands, they were hard and stiff. I had become a copper pot with three legs, and my arms were its handle.
        - id: ch03-b04
          speaker: neangir
          text: I never learned what happened to my companion. I only knew that someone picked me up and carried me quickly away. After what felt like several days, my captor set me on the ground beside a thick hedge. Soon I heard him snoring. I decided to escape, pushed my way among the thorns as well as a copper pot could, and walked steadily for nearly an hour. You cannot imagine how awkward it is to walk on three legs when every knee is stiff. After great trouble I reached a market garden. I crept deep among the cabbages, hid there, and passed a quiet night.
        - id: ch03-b05
          speaker: neangir
          text: At sunrise, I felt someone bend over me and examine me closely. A man's voice called from a short distance away and asked Zinebi what she had found. She declared that I was the most beautiful pot in the whole world and wondered who could have dreamed of finding such a thing among her cabbages. Mohammed lifted me from the ground and looked at me with admiration. I confess that pleased me. Everyone likes to be admired, even when he happens to be a pot. They carried me into the house, filled me with water, and placed me over the fire to boil.
        - id: ch03-b06
          speaker: neangir
          text: For three years I led a quiet and useful life. Zinebi was then young and beautiful, and every day she scrubbed my copper until it shone. One morning she put a fine fillet of beef inside me to cook for dinner. She feared the steam might escape around my lid and spoil the taste of her stew, so she looked for something to hold the cover down. The only useful thing nearby was her husband's turban. She tied it firmly around my lid and left the room.
        - id: ch03-b07
          speaker: neangir
          text: For the first time in three years, the fire burned my feet. I moved away and felt myself growing taller. Within minutes I was a man again. After the third hour of prayer, Mohammed and Zinebi returned and found a young man in their kitchen instead of a pot. They doubted my story at first, but I persuaded them it was true.
        - id: ch03-b08
          speaker: neangir
          text: Mohammed and Zinebi returned after the third hour of prayer. Imagine their surprise when they found a young man standing in the kitchen where their copper pot should have been. I told them everything. At first they refused to believe me, but in time I convinced them that every word was true. For two more years I lived in their home, and they treated me exactly like their own son. Then came the day when they sent me to this city to seek my fortune. My lords, here are the two letters I discovered in my turban. Perhaps they will provide another proof that my story is true.
        - id: ch03-b09
          speaker: narrator
          text: While Neangir spoke, the merchant's wound stopped bleeding. A beautiful young woman appeared in the doorway, her hair and clothes disordered as if she had fled from danger. She carried two white crutches. With her came the merchant's brother and another man whom Neangir recognized as the one present when he became a pot. Both men wore broad linen bands around their thighs and leaned on stout sticks.
        - id: ch03-b10
          speaker: narrator
          text: The young woman approached the wounded Izouf and laid the two white crutches beside him. She fixed her eyes on his face and burst into tears. Then she turned toward the two men who had followed her. They had already sunk down upon the mat at the merchant's feet.
        - id: ch03-b11
          speaker: sumi
          text: Unhappy Izouf, why do you let yourself be drawn into such dangerous adventures? Look what you have brought upon yourself and your two brothers.
          emotion: sad
        - id: ch03-b12
          speaker: narrator
          text: The Bassa and Cadi asked her to explain.
        - id: ch03-b13
          speaker: sumi
          text: My name is Sumi, daughter of Moizes, one of our greatest rabbis. My love for Izaf has made me a victim, yet despite his ingratitude I cannot tear him from my heart. Izaf, enemy of my happiness, tell these gentlemen your story and your brothers' story. Repent, and try to win their pardon.
        - id: ch03-b14
          speaker: izaf
          text: My brothers and I were born together to Nathan Ben-Sadi. He named us Izif, Izouf, and Izaf. From childhood we learned magic, and because the same stars ruled our births, we shared the same good and evil fortune.
        - id: ch03-b15
          speaker: izaf
          text: Our mother died so early that I cannot remember her. Our father raised us and taught us every secret he knew. When the three of us reached fifteen, he fell dangerously ill. We tried the spells he had taught us, but no charm could cure him. He felt death drawing close and summoned all three sons to his bedside. There he took leave of us and gave us his final counsel.
        - id: ch03-b16
          speaker: nathan
          text: My sons, I have no riches to leave you. My only wealth was the magic I taught you. You own stones marked with secret signs and know how to make more. Yet you lack the greatest talismans of all, the three rings worn by Siroco's daughters.
        - id: ch03-b17
          speaker: nathan
          text: Try to gain those rings, but guard your hearts from the girls' beauty. Their faith is not yours, and they are promised to the three sons of the Bassa of the Sea. If love puts you in danger, seek the daughter of Rabbi Moizes. She secretly loves Izaf and owns the Book of Spells, written by her father with the sacred ink used for the Talmud.
        - id: ch03-b18
          speaker: narrator
          text: With those words, Nathan fell back upon his cushions and died. He left his three sons burning with the desire to possess the rings. As soon as they completed their sad duties, they began asking where Siroco's daughters might be found. After much trouble, they learned that Siroco had fought in many wars and that the beauty of his three daughters was famous throughout the land. Their names were Aurora, Argentine, and Zelida. When Izaf spoke Argentine's name, both the Bassa and Neangir started in surprise, though neither interrupted him.
        - id: ch03-b19
          speaker: izaf
          text: First we disguised ourselves as foreign merchants. We hired a collection of fine stones so that we would have a reason to approach the sisters. Our father's warning had been useless. We could not close our hearts against them. Peerless Aurora wore a golden dress studded everywhere with flashing jewels. Fair-haired Argentine was dressed in silver. Zelida, the youngest and loveliest of the three, wore the clothes of a Persian lady.
        - id: ch03-b20
          speaker: izaf
          text: Among our curiosities was an elixir that made any man or woman who drank it fall in love. Sumi had given it to me. She had drunk it herself and was furious because I refused to share it and return her love.
        - id: ch03-b21
          speaker: izaf
          text: As the sisters chose stones, I began pouring the elixir into a crystal cup. Zelida saw a paper around the bottle. It warned her never to drink that water with any man except her future husband. She knew at once that I had set a trap, and I recognized Sumi's writing.
        - id: ch03-b22
          speaker: izaf
          text: While I was occupied with the flask, my brothers had already persuaded Aurora and Argentine to exchange their rings for pieces of merchandise they desired. The moment those magic circles left the sisters' hands, both young women vanished completely. Nothing remained where they had stood except two watches, one made of gold and the other of silver. My brothers understood that they had obtained the talismans, but they had also brought a terrible enchantment upon the women they loved.
        - id: ch03-b23
          speaker: izaf
          text: The old slave we had bribed rushed in to announce Siroco's return. My brothers hid the watches in their turbans. While the slave cared for Zelida, who had fainted, we escaped and took shelter with Sumi because we feared Siroco would trace us.
        - id: ch03-b24
          speaker: sumi
          text: Miserable fools! Is this how you followed your father's counsel? This morning my books showed me your hearts surrendering to the love that will ruin you. I will not quietly endure this insult. I wrote the warning that stopped Zelida from drinking. And you two have no idea what those watches will cost you. Read the truth, and let it make your lives more miserable still!
          emotion: angry
        - id: ch03-b25
          speaker: narrator
          text: Sumi held out the sacred book written by Moizes and pointed to its words. If the two watches were wound at midnight with the gold key and the silver key, they would regain their true shapes during the first hour of the new day. They would always remain under the care of a woman and would return to her from any place where they might be taken. The woman chosen to guard them was the daughter of Moizes herself. The brothers were furious when they learned how completely the spell had outwitted them, but there was nothing they could do.
        - id: ch03-b26
          speaker: izaf
          text: My brothers gave the watches to Sumi and went away. I remained because I wanted to see what would happen. As midnight approached, Sumi wound both watches. When the hour struck, Aurora and Argentine appeared before us. They remembered nothing of the change and believed they had simply awakened from sleep. Sumi told them what the rings, the spell, and the watches had done to them. Once they understood their terrible fate, both sisters sobbed in despair. Only Sumi's promise that she would never forsake them brought them any comfort. Then the clock struck one, and in that instant they became watches once more.
    - id: ch04
      title: The Three Magicians' Misfortunes
      blocks:
        - id: ch04-b01
          speaker: izaf
          text: All that night I was troubled by fears I could not name. It felt as though something unseen were pushing me onward, though I had no idea where it wanted me to go. At dawn I rose and left the house. In the street I met Izif, who was suffering from exactly the same dread. We agreed that Constantinople was no longer safe for us. We called Izouf, and all three of us left the city. Soon we decided to travel separately so that Siroco's spies would have more difficulty recognizing and following us.
        - id: ch04-b02
          speaker: izaf
          text: After a few days of wandering, I reached an old castle near the sea. A tall slave paced back and forth before its door. I gave him one or two worthless jewels, and the gifts loosened his tongue. He said that he guarded the son of the Bassa of the Sea, who was then fighting in distant countries. The boy had been promised from childhood to one of Siroco's daughters, while the other two sisters would marry his brothers. The slave also described the talisman entrusted to his young charge. I heard all this, but my thoughts remained fixed on beautiful Zelida. The love I believed I had conquered rose again with its full force.
        - id: ch04-b03
          speaker: izaf
          text: I resolved to remove this dangerous rival by carrying him away. I pretended to be a madman, singing and dancing loudly outside the castle. I called to the slave to fetch the boy and let him enjoy my tricks. The slave agreed. He and the child found my antics so funny that they laughed until tears ran down their faces, and they even tried to imitate my dance. At last I declared that I was thirsty and begged the slave to bring water. The moment he was gone, I told the boy that all the dancing must have made him hot. I advised him to take off his turban and cool his head.
        - id: ch04-b04
          speaker: izaf
          text: The boy gladly obeyed. In the blink of an eye, his body changed into a copper pot. Then I heard the slave cry out as he returned. I knew I had no time to lose if I meant to save my own life. I caught up the pot and fled with it as fast as the wind. You have already heard what happened after that. When I woke from sleep, the pot had disappeared. I was partly comforted when I discovered my two brothers sleeping not far away. I woke them and asked how they had come there and what had happened since we separated.
        - id: ch04-b05
          speaker: merchant_izouf
          text: We were passing a roadside inn when we heard songs and laughter coming through the doors. Like fools, we entered and sat down. Several men were watching beautiful Circassian girls dance. They received us politely and placed us close beside the two loveliest dancers. We were perfectly happy there and never noticed how quickly time passed. Then one of the Circassians leaned toward her sister and said that our brother had danced, so now we must dance as well. We could not imagine what those words meant. Perhaps you can explain them.
        - id: ch04-b06
          speaker: izaf
          text: I understood. They meant the day I stole the Bassa's son after dancing before him.
        - id: ch04-b07
          speaker: merchant_izouf
          text: Perhaps that was it. The two women each took one of us by the hand. They made us dance with them until we were utterly exhausted. When we finally sat down at the table again, we drank far more wine than was good for us. Our heads became so confused that we scarcely understood what was happening. The men suddenly sprang up and threatened to kill us. We were in no state to resist. They robbed us of every possession we carried, including the most precious things of all, the two talismans that belonged to Siroco's daughters.
        - id: ch04-b08
          speaker: izaf
          text: We had no idea what else to do, so all three of us returned to Constantinople to seek Sumi's advice. She already knew of our misfortunes because she had read them in the Book of Moizes. Though we had wronged her, her kind heart made her weep bitterly as she listened. Yet Sumi herself was poor and could give us little practical help. At last I proposed that every morning we sell the silver watch into which Argentine had been changed. Unless a buyer happened to wind it with the silver key at the appointed hour, the watch would return to Sumi each evening. We could sell the same treasure again the next day and live on the money.
        - id: ch04-b09
          speaker: izaf
          text: Sumi consented on one condition. Whenever we sold Argentine's watch, we must learn exactly where the buyer lived. Sumi could then carry Aurora's gold watch to the same house. If someone did wind Argentine at the mystic hour, she would not awaken alone. For several weeks we have supported ourselves by this plan, and the two daughters of Siroco have returned without fail to Sumi every night. Yesterday Izouf sold the silver watch to this young man. Just before Neangir entered his lodging, Izouf followed Sumi's orders and placed the gold watch on the steps. Early this morning, both watches returned to their guardian.
        - id: ch04-b10
          speaker: neangir
          text: If only I had known! If I had thought more clearly, I could have seen Argentine herself. Her portrait is so beautiful. What must she be like in life?
        - id: ch04-b11
          speaker: cadi
          text: It was not your fault. You are no magician. Who could guess that the watch had to be wound at one particular hour? I will order the merchant to give it back, and tonight you will remember.
        - id: ch04-b12
          speaker: merchant_izouf
          text: I cannot give it to him today. It has already been sold.
        - id: ch04-b13
          speaker: cadi
          text: Then return the three gold pieces he paid.
        - id: ch04-b14
          speaker: narrator
          text: Relieved to escape so lightly, Izouf reached into his pocket, but Neangir stopped him.
        - id: ch04-b15
          speaker: neangir
          text: No! I do not want money. I want my beloved Argentine. Without her, nothing has any value.
        - id: ch04-b16
          speaker: bassa
          text: He is right, my dear Cadi. The treasure my son has lost is beyond any price.
        - id: ch04-b17
          speaker: cadi
          text: My lord, your wisdom is greater than mine. Please give judgment yourself.
        - id: ch04-b18
          speaker: narrator
          text: The Bassa ordered everyone to accompany him to his palace. He warned his slaves not to let the three brothers out of their sight. At the door of his home, he noticed two women sitting on a bench. Both were thickly veiled and beautifully dressed. Their broad satin trousers were embroidered with silver, and their muslin robes were made from the finest cloth. One woman held a pink silk bag tied shut with green ribbons. From time to time, something inside the bag seemed to move.
        - id: ch04-b19
          speaker: first_circassian
          text: Noble lord, please buy this bag without asking to see what it holds.
        - id: ch04-b20
          speaker: bassa
          text: How much do you ask?
        - id: ch04-b21
          speaker: first_circassian
          text: Three hundred sequins.
        - id: ch04-b22
          speaker: narrator
          text: At the demand for three hundred sequins, the Bassa laughed scornfully. He believed no closed silk bag could be worth such a fortune, especially when its sellers refused to reveal what lay inside. Without giving the women another answer, he turned from them and walked toward his door.
        - id: ch04-b23
          speaker: first_circassian
          text: You will not regret buying it. Tomorrow we may ask four hundred, and you may be glad to pay. The next day the price will be five hundred.
        - id: ch04-b24
          speaker: second_circassian
          text: Come away. We must not stay. It may cry, and then our secret will be known.
        - id: ch04-b25
          speaker: narrator
          text: The second woman caught her companion by the sleeve, and together they disappeared. The three brothers were left beneath the slaves' guard in the front hall. Neangir and Sumi followed the Bassa deeper into his magnificently furnished house. A large room shone with brilliant light. At one end, a woman of about thirty-five rested upon a couch. She was still beautiful, though years of sorrow showed plainly in her face.
        - id: ch04-b26
          speaker: bassa
          text: Incomparable Zambac, thank me. Here is the lost son for whom you have wept so long!
        - id: ch04-b27
          speaker: narrator
          text: Before Zambac could embrace him, Neangir fell at her feet.
        - id: ch04-b28
          speaker: bassa
          text: Let the whole house rejoice! Tell Ibrahim and Hassan to come embrace their brother.
        - id: ch04-b29
          speaker: zambac
          text: My lord, have you forgotten? This is the hour when Hassan weeps over his hand and Ibrahim gathers his coral beads.
          emotion: sad
        - id: ch04-b30
          speaker: bassa
          text: Then the Prophet's command must be obeyed. We will wait until evening.
        - id: ch04-b31
          speaker: sumi
          text: Forgive me, noble lord, but what is this mystery? The Book of Spells may allow me to help.
        - id: ch04-b32
          speaker: bassa
          text: Sumi, I already owe you the happiness of my life. Come. Seeing my unhappy sons will explain better than words.
    - id: ch05
      title: The Book of Spells
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Bassa rose from his divan and drew aside the hangings that opened into a great hall. Neangir and Sumi followed close behind him. Inside were two young men, one about seventeen and the other nineteen. The younger sat before a table with his forehead resting upon his right hand, and his tears fell continually over it. He raised his head for a moment when his father entered. Then both visitors saw that the hand beneath his face was not the color of flesh. It was black as ebony. The elder brother was busy collecting coral beads scattered across the whole floor. He picked them up one by one and placed each upon the table where his brother sat. He had gathered ninety-eight and believed he had found them all. At that instant, every bead rolled from the table and scattered again, and he had to start his hopeless task from the beginning. The same misery returned every day. For three hours, Hassan could do nothing but weep over his transformed hand. For the same three hours, Ibrahim gathered and counted the coral beads, only to watch them escape before the number was complete. Their father had seen the punishments repeated again and again without learning what act had caused either one.
        - id: ch05-b02
          speaker: bassa
          text: For three hours every day, one son gathers those beads while the other mourns his blackened hand. I do not know the cause of either curse.
        - id: ch05-b03
          speaker: sumi
          text: We should leave. Our presence can only deepen their pain. Let me fetch the Book of Spells. I am sure it will reveal both the cause and the cure.
        - id: ch05-b04
          speaker: narrator
          text: The Bassa agreed, but Neangir protested.
        - id: ch05-b05
          speaker: neangir
          text: If you leave, I will not see Argentine when she returns tonight with Aurora. Every moment before I see her feels endless.
        - id: ch05-b06
          speaker: sumi
          text: Take heart. I will return before sunset, and I leave my beloved Izaf here as my pledge.
        - id: ch05-b07
          speaker: narrator
          text: Sumi had scarcely left when Zelida's old nurse entered the hall where the three brothers were still carefully guarded. A man in splendid clothes followed her. His rich dress kept Neangir from recognizing him at first, though he knew the nurse immediately. Then he understood that the soldier was the man in whose house he had eaten supper two days before. Neangir eagerly stepped forward, but before he could speak, the old woman turned to her master and pointed toward the prisoners.
        - id: ch05-b08
          speaker: old_slave
          text: My lord, those are the men. I followed them from the Cadi's house to this palace. I cannot be mistaken. Strike now and avenge yourself!
        - id: ch05-b09
          speaker: narrator
          text: As Siroco listened, his face grew scarlet with anger. He drew his sword. In another moment he would have rushed upon the three brothers, but Neangir and the Bassa's slaves seized him and held him back. Siroco struggled to reach the men he believed had robbed him of his daughters, while Neangir demanded to know why he dared attack prisoners protected by the Bassa.
        - id: ch05-b10
          speaker: neangir
          text: What are you doing? How dare you attack men under the Bassa's protection?
        - id: ch05-b11
          speaker: siroco
          text: My son, the Bassa would withdraw that protection if he knew these villains had stolen everything dearest to me. He knows them no better than he knows you.
        - id: ch05-b12
          speaker: neangir
          text: He knows me very well. He has recognized me as his son. Come before him now.
        - id: ch05-b13
          speaker: narrator
          text: The soldier bowed and passed through the curtain. To Neangir's amazement, the Bassa sprang up and embraced him.
        - id: ch05-b14
          speaker: bassa
          text: Siroco, is it truly you? I thought you died in that terrible battle when the Prophet's followers fled. Why do your eyes burn as they did that day? Be calm and tell me how I can help. I have found my son. Let that be a good sign for your happiness too.
        - id: ch05-b15
          speaker: siroco
          text: I had no idea that the son you mourned for so long had returned to you. Several days ago, the Prophet appeared to me in a dream, floating inside a circle of light. He commanded me to go to the Galata Gate at sunset on the following day. There, he said, I would find a young man who must be brought home with me. The stranger would be the second son of my old friend, the Bassa of the Sea. To make certain I chose the right man, I was to put my fingers inside his turban. There I would feel the copper plaque engraved with the Prophet's name in seven different languages.
        - id: ch05-b16
          speaker: siroco
          text: I obeyed. I liked the young man's face and manner so much that I made him fall in love with Argentine by showing him her portrait. I hoped to return your son to you. But drops of the love elixir spilled, and thick vapor hid everything. When it cleared, he was gone.
        - id: ch05-b17
          speaker: siroco
          text: This morning my old servant told me she had found the traitors who stole my daughters. I came to take revenge. Yet I place myself in your hands and will follow your advice.
        - id: ch05-b18
          speaker: bassa
          text: Fate will favor us. Tonight I expect to secure both watches. Send for Zelida at once.
        - id: ch05-b19
          speaker: narrator
          text: A rustle of silk drew every eye toward the doorway. Ibrahim and Hassan had finished the daily hours of their punishment and now entered to embrace the brother they had never known. Neangir and Hassan had both drunk from the love elixir, and their thoughts soon returned to the beautiful women who possessed their hearts. Ibrahim had heard that the daughter of Moizes hoped to find his cure in the Book of Spells. The news cheered him after another day spent gathering beads that would never remain upon the table.
        - id: ch05-b20
          speaker: narrator
          text: Several hours passed before Sumi returned with the sacred Book of Spells. She beckoned Hassan to her side and showed him the fate written there in Hebrew. His right hand had become black as ebony because it touched the fat of an impure animal. The hand would remain black until the last animal of that race was drowned in the sea. As Hassan read, the forgotten moment that caused his punishment came back to him.
        - id: ch05-b21
          speaker: hassan
          text: Now I remember. One day Zambac's slave was baking a cake. She warned me that it contained lard and told me not to touch it. I ignored her, and at once my hand became ebony.
          emotion: sad
        - id: ch05-b22
          speaker: bassa
          text: The holy dervish spoke truly. My son ignored the counsel that came with his bracelet and has paid dearly. Wise Sumi, where can we find the last creature of that accursed race?
        - id: ch05-b23
          speaker: sumi
          text: The book says the little black pig is inside the pink bag carried by the two Circassians.
        - id: ch05-b24
          speaker: narrator
          text: When the Bassa heard those words, he remembered the moving pink bag and the two women he had dismissed that morning. The chance to cure Hassan had been held out before him, and he had laughed and walked away. Overcome by that realization, he sank back upon his cushions in despair.
        - id: ch05-b25
          speaker: bassa
          text: That is the bag offered to me this morning for three hundred sequins! Those women must have forced Izif and Izouf to dance and stolen the sisters' talismans. Only they can break these spells. Find them, and I will give them half my possessions. What a fool I was to send them away!
          emotion: sad
        - id: ch05-b26
          speaker: narrator
          text: While the Bassa mourned his foolish refusal to buy the pink bag, Ibrahim opened the book in his turn. He blushed deeply as he read. The coral chaplet had been defiled during a game of Odd and Even. Its owner had tried to cheat by secretly removing one of the numbers. As punishment, the faithless man must search forever for the bead he had hidden. At once, Ibrahim remembered the game and understood why ninety-eight beads always rolled away before he could complete his task.
        - id: ch05-b27
          speaker: ibrahim
          text: I remember that terrible day. I cut the thread while playing with Aurora and held all ninety-nine beads in my hand. She guessed “odd.” To make her lose, I dropped one bead. I have searched for it every day since then, but it is never found.
        - id: ch05-b28
          speaker: bassa
          text: Again the holy dervish was right. When the sacred chaplet became incomplete, my son received his punishment. Can the book teach us how to free Ibrahim too?
        - id: ch05-b29
          speaker: sumi
          text: Listen. It says the coral bead lies in the fifth fold of the yellow brocade dress.
        - id: ch05-b30
          speaker: bassa
          text: What good fortune! We will soon see Aurora, and Ibrahim can search the fifth fold of her yellow dress. Surely the book means her.
    - id: ch06
      title: Voices Beyond the Garden Wall
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: As Sumi closed the book, Zelida arrived with her nurse and a train of slaves. Hassan flung himself to his knees and kissed her hand.
        - id: ch06-b02
          speaker: hassan
          text: My lord, forgive my joy. I needed no love elixir to set my heart aflame. Let Zelida and me be married without delay!
          emotion: happy
        - id: ch06-b03
          speaker: bassa
          text: My son, are you mad? Can you alone be happy while your brothers suffer? And who ever heard of a bridegroom with one black hand? Wait until the little pig has drowned in the sea.
        - id: ch06-b04
          speaker: zelida
          text: Yes, dear Hassan. We will be ten times happier when my sisters have their true shapes again. I have brought the elixir so they may share our joy.
        - id: ch06-b05
          speaker: narrator
          text: Zelida held out the flask she had brought. She meant the same elixir that had bound Neangir's and Hassan's hearts to be used so her sisters could love with equal happiness once they were free. The Bassa ordered the bottle closed and sealed in his presence so no more accidents could happen. Zambac's sadness lifted at the sight of Zelida, and she embraced the girl with delight. Then the Bassa's wife led all her friends into the garden. She invited them to sit beneath the thick, overhanging branches of a splendid jasmine tree. They had scarcely made themselves comfortable when an angry man's voice sounded from the other side of the garden wall.
        - id: ch06-b06
          speaker: hidden_man
          text: Ungrateful girls! Is this how you repay me? I should hide forever. This cave is no longer dark enough or deep enough for me!
          emotion: angry
        - id: ch06-b07
          speaker: narrator
          text: Laughter answered him.
        - id: ch06-b08
          speaker: hidden_man
          text: What have I done to deserve such scorn? Is this what you promised when I won the beauty talismans for you? Is this my reward for giving you the little black pig that was sure to bring good luck?
          emotion: angry
        - id: ch06-b09
          speaker: narrator
          text: When the hidden voice mentioned the talismans and the pig, the listeners could contain their curiosity no longer. The Bassa instantly commanded his slaves to tear down the wall. They obeyed, but when the opening appeared, the angry man was nowhere to be seen. Instead, two girls of extraordinary beauty stood beyond it. They seemed perfectly at ease despite the destruction of the wall and danced gaily onto the terrace. An old slave followed them. The Bassa recognized him at once as Gouloucou, the man who had once guarded Neangir.
        - id: ch06-b10
          speaker: narrator
          text: The moment Gouloucou saw the Bassa, he shrank back in fear. He expected nothing less than death for allowing Neangir to be stolen while the Bassa was away at war. The Bassa did not punish him. Instead, he made signs that the old failure was forgiven, then asked how Gouloucou had escaped death after throwing himself from the cliff. Gouloucou explained that a dervish had found him below, treated his terrible wounds, and patiently restored him to health. Afterward the dervish had given him as a slave to the two young women now standing on the terrace. Gouloucou had remained in their service from that day onward and had come with them to the cave beside the garden.
        - id: ch06-b11
          speaker: gouloucou
          text: A dervish found me, healed my wounds, and gave me as a slave to these two ladies. I have served them ever since.
        - id: ch06-b12
          speaker: bassa
          text: Where is the little black pig the hidden man spoke of?
        - id: ch06-b13
          speaker: first_circassian
          text: My lord, when your men tore down the wall, the noise frightened him. He seized the pig and ran.
        - id: ch06-b14
          speaker: bassa
          text: Send men after him at once!
        - id: ch06-b15
          speaker: second_circassian
          text: Do not worry, my lord. He is certain to return. Guard the cave entrance, and once he goes in, do not let him come out.
        - id: ch06-b16
          speaker: narrator
          text: By then, night was falling. Everyone left the garden and returned to the palace, where servants brought coffee and fruit to a splendid gallery near the women's rooms. The Bassa ordered the three brothers brought before him. He wanted them to say whether these were the same two women who had forced them to dance at the inn and stolen the talismans. To his great annoyance, the guards returned with bad news. When they had abandoned their posts to help tear down the garden wall, the three prisoners had taken their chance and escaped.
        - id: ch06-b17
          speaker: narrator
          text: Sumi turned pale. Then she glanced at the Book of Spells, and hope returned to her face.
        - id: ch06-b18
          speaker: sumi
          text: There is no reason to fear. They will capture the dervish.
          emotion: calm
        - id: ch06-b19
          speaker: narrator
          text: Hassan lamented loudly. It seemed to him that whenever good fortune appeared from one direction, it escaped from another. The two mysterious women had been found, but the three brothers had vanished. A young page serving the Bassa overheard Hassan's reflection and broke into laughter before offering his own bold opinion.
        - id: ch06-b20
          speaker: page
          text: This fortune comes dancing toward us, my lord, while the other escapes on crutches. Do not fear. She will not get far.
        - id: ch06-b21
          speaker: narrator
          text: Shocked by the boy's insolence, the Bassa ordered him out and told him not to return until summoned.
        - id: ch06-b22
          speaker: page
          text: I obey, my lord. But when I return, my company will be so welcome that you will be glad to see me.
        - id: ch06-b23
          speaker: narrator
          text: After the page left, Neangir appealed to the two strangers.
        - id: ch06-b24
          speaker: neangir
          text: My brothers and I love three matchless women, and two are trapped beneath a cruel spell. If their fate were in your hands, would you not do everything you could to give them back their freedom and happiness?
        - id: ch06-b25
          speaker: first_circassian
          text: Why should the grief of lovers matter to us? Fate stole our own lovers. If we have the power, the whole world will suffer just as we do!
          emotion: angry
        - id: ch06-b26
          speaker: narrator
          text: Neangir had expected compassion from women who knew something of enchantment and loss. Instead, everyone in the gallery heard this bitter answer with amazement. The Bassa entreated the angry woman to tell them what fate had taken her lover away and why she wished the same suffering upon all the world. The stranger did not answer at once. She turned to her sister and asked permission to reveal the history that had made them both so hardhearted. When her companion agreed, the young woman faced the Bassa, his family, Siroco, Sumi, and all the other listeners. Then, with every eye fixed upon her, she began her story.
