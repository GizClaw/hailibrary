  chapters:
    - id: ch01
      title: The Two Strange Eyes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there lived a man whose right eye was always laughing while his left eye was always weeping. He had three sons. The two older boys were very clever, but everyone called the youngest a fool. All three wondered why their father's eyes were so unlike anyone else's, and at last they decided to ask him.
        - id: ch01-b02
          speaker: narrator
          text: The eldest son went into his father's room first and asked him directly. Instead of giving an answer, the man flew into a terrible rage and sprang at him with a knife. The young man fled in fright and hurried back to his brothers, who were anxiously waiting to hear what had happened.
        - id: ch01-b03
          speaker: eldest_son
          text: You two had better ask him yourselves. Then you'll see whether he treats you any better.
        - id: ch01-b04
          speaker: narrator
          text: So the second son entered the room. His father treated him in exactly the same way, and he too came running back. Then he told the youngest that it was his turn to try.
        - id: ch01-b05
          speaker: narrator
          text: The youngest son walked boldly up to his father.
        - id: ch01-b06
          speaker: youngest_son
          text: My brothers wouldn't tell me what answer you gave them. Please tell me yourself. Why does your right eye always laugh while your left eye always cries?
        - id: ch01-b07
          speaker: narrator
          text: Once again, the father turned purple with fury and rushed at his son with the knife. But the simple young man did not move a single step. He knew he had nothing to fear from his own father.
        - id: ch01-b08
          speaker: father
          text: Ah, now I know my true son! Your brothers are cowards, but you have proved brave. My right eye laughs because I am glad to have a son like you. My left eye weeps because someone stole a precious treasure from me. A vine grew in my garden, and every hour it gave a tun of wine. I mourn because it was stolen.
        - id: ch01-b09
          speaker: narrator
          text: The youngest went back and told his brothers about their father's loss. At once, all three resolved to search for the wonderful vine.
    - id: ch02
      title: Bread for the Limping Fox
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The brothers traveled together until they reached a crossroads. There they separated. The two elder brothers took one road, while the youngest went alone down another.
        - id: ch02-b02
          speakers: [eldest_son, second_son]
          ensemble: duo
          text: Thank goodness we're rid of that idiot! Now we can eat our breakfast.
        - id: ch02-b03
          speaker: narrator
          text: They sat beside the road and began their meal. Before they were halfway through, a lame fox came out of the woods and begged for something to eat. The brothers leaped up and drove him away with their sticks. The poor fox limped off on three paws.
        - id: ch02-b04
          speaker: narrator
          text: Soon he reached the place where the youngest son was taking out his own food. The fox asked him for a crust of bread. The young man had little enough, but he gladly shared half his meal with the hungry creature.
        - id: ch02-b05
          speaker: fox
          text: Where are you going, brother?
        - id: ch02-b06
          speaker: narrator
          text: The young man explained about his father's stolen vine, the wonderful vine that had once produced a whole tun of wine every hour.
        - id: ch02-b07
          speaker: fox
          text: Well, this is fortunate! I know where that vine has gone. Follow me.
        - id: ch02-b08
          speaker: narrator
          text: The fox led him onward until they came to the gate of a great garden. There he stopped to warn his new friend.
        - id: ch02-b09
          speaker: fox
          text: The vine is inside, but listen closely. You must pass twelve outposts with two guards at each. If they stare straight at you, walk on without fear, for they are asleep. If their eyes are closed, beware. Then they are wide awake.
        - id: ch02-b10
          speaker: fox
          text: Beside the vine are two shovels, one wood and one iron. Take the wooden one. The iron shovel will make a noise and wake the guards.
    - id: ch03
      title: The Vine and the Golden Apple
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The young man passed every guard and reached the vine. The ground was hard, and digging with wood seemed impossible. Ignoring the fox, he picked up the iron shovel.
        - id: ch03-b02
          speaker: narrator
          text: The iron struck the earth noisily. The guards woke, seized him, and carried him to their master.
        - id: ch03-b03
          speaker: vine_owner
          text: Why are you trying to steal my vine? And how did you ever get past my guards?
        - id: ch03-b04
          speaker: youngest_son
          text: This vine isn't yours. It belongs to my father. If you won't give it back now, I'll return and find some other way to take it.
        - id: ch03-b05
          speaker: vine_owner
          text: Bring me one apple from the golden apple tree, the tree that flowers every twenty-four hours and bears fruit made of gold. Give me that apple, and you may have the vine.
        - id: ch03-b06
          speaker: narrator
          text: The master had him released, and the young man hurried back to consult the fox.
        - id: ch03-b07
          speaker: fox
          text: This came from ignoring my advice. Still, I'll help you. The apple grows in a garden you will know from my description. Beside its tree stand two poles, one gold and one wood. Use the wooden pole to reach the apple.
        - id: ch03-b08
          speaker: narrator
          text: Master Simpleton listened carefully. He crossed the garden, passed the watchers, and reached the tree. But the very beautiful golden fruit dazzled him, and he forgot the fox's words.
        - id: ch03-b09
          speaker: narrator
          text: He seized the golden pole and struck a branch with a ringing blow. The guards woke and took him to the garden's owner, where he told his story.
        - id: ch03-b10
          speaker: apple_owner
          text: I will give you the golden apple, but only in exchange for a horse that can travel all the way around the world in twenty-four hours.
        - id: ch03-b11
          speaker: narrator
          text: With that, the young man left the garden and went to find the fox again.
    - id: ch04
      title: The Horse with Two Halters
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: This time, the fox was truly angry, and it was no wonder.
        - id: ch04-b02
          speaker: fox
          text: If you had done as I told you, you would be home with your father by now. Even so, I am willing to help you once more. Go into the forest. There you will find the horse, and it will have two halters around its neck. One is gold and the other is hemp.
          emotion: angry
        - id: ch04-b03
          speaker: fox
          text: Lead the horse by the hempen halter. If you choose the golden one, the horse will neigh and wake the guards. Then there will be no escape for you.
        - id: ch04-b04
          speaker: narrator
          text: Master Simpleton searched the forest until at last he found the horse. The moment he saw it, he was struck silent by its beauty.
        - id: ch04-b05
          speaker: youngest_son
          text: Put a rough hempen halter on a magnificent animal like this? No, I won't do that!
        - id: ch04-b06
          speaker: narrator
          text: He chose the golden halter. At once, the horse gave a loud neigh. The guards rushed in, caught the young man, and took him before their master.
        - id: ch04-b07
          speaker: horse_owner
          text: I will give you this golden horse if you bring me a golden maiden in exchange, one who has never seen the sun or the moon.
        - id: ch04-b08
          speaker: youngest_son
          text: If I am to find the golden maiden for you, you must first lend me the golden horse so I can search for her.
        - id: ch04-b09
          speaker: horse_owner
          text: And what promise do I have that you will ever return?
        - id: ch04-b10
          speaker: youngest_son
          text: I swear on my father's head that I will bring back either the maiden or the horse.
        - id: ch04-b11
          speaker: narrator
          text: The owner let him go with the horse, and the young man set out once more to consult the fox.
    - id: ch05
      title: The Golden Maiden
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The fox was always patient and forgiving when other people made mistakes. He led the young man to the mouth of a deep grotto. There stood a maiden made entirely of gold, and she was as beautiful as the day.
        - id: ch05-b02
          speaker: narrator
          text: The young man helped the golden maiden onto the horse and made ready to mount. Before he could leave, the fox spoke to him.
        - id: ch05-b03
          speaker: fox
          text: Doesn't it grieve you to trade such a lovely maiden for a horse? Yet you gave your word on your father's head, so you must keep your promise. But perhaps I can take her place.
        - id: ch05-b04
          speaker: narrator
          text: With that, the fox changed himself into another golden maiden. He looked so much like the first one that almost no one could tell them apart.
        - id: ch05-b05
          speaker: narrator
          text: Master Simpleton took the transformed fox straight to the owner of the golden horse. When the man saw the false golden maiden, he was delighted with her.
    - id: ch06
      title: The Vine Comes Home
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: And so the young man kept the golden horse. With the fox's help, he also obtained the golden apple and exchanged it for his father's wonderful vine.
        - id: ch06-b02
          speaker: narrator
          text: Master Simpleton brought the vine home to his father, and he married the true golden maiden as well.
