audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的诙谐
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    masaniello:
      display_name: 马萨涅洛
      tts:
        delivery: 朴实谨慎，受惊时慌乱迟疑
        timbre: 粗朴低沉
        pace: 适中
        pitch: 中低音
    wife:
      display_name: 马萨涅洛的妻子
      tts:
        delivery: 温厚务实，说话坚定
        timbre: 柔和朴实
        pace: 适中
        pitch: 中音
    fairy:
      display_name: 仙女
      tts:
        delivery: 从容威严，善意中带着不可违逆的力量
        timbre: 清澈沉静
        pace: 舒缓
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 高贵直率，情绪激动时毫不掩饰
        timbre: 明亮浑厚
        pace: 适中
        pitch: 中低音
    renzolla:
      display_name: 伦佐拉
      tts:
        delivery: 年轻清亮，起初骄纵，悔悟后真诚
        timbre: 清脆柔亮
        pace: 稍快
        pitch: 中高音
    old_man:
      display_name: 老人
      tts:
        delivery: 尖锐坦率，训诫时严厉而清醒
        timbre: 苍老沙哑
        pace: 稍慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 山洞里的约定
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有个农夫，名叫马萨涅洛。他有十二个女儿，姐妹之间都只差一岁，站在一起就像一级级楼梯。要养活这么多孩子，实在太难了。马萨涅洛每天从早到晚在田里挖土，也只能勉强不让一家人挨饿。小姑娘们常常还是空着肚子入睡。
        - id: ch01-b02
          speaker: narrator
          text: >-
            一天，他在高山脚下干活，发现了一个阴森森的洞口。那里黑得连阳光好像都不敢进去。忽然，一只巨大的绿蜥蜴从洞里爬出来，拦在他面前。它足有鳄鱼那么大，模样也一样凶猛，吓得马萨涅洛几乎失了魂。
        - id: ch01-b03
          speaker: fairy
          text: >-
            好心人，不用怕。我不会伤害你，我是来帮你的。
        - id: ch01-b04
          speaker: narrator
          text: >-
            蜥蜴竟友善地坐到了他身边。马萨涅洛听见它开口，连忙跪下。
        - id: ch01-b05
          speaker: masaniello
          text: >-
            尊贵的夫人，我不知道该怎么称呼您。我的性命全在您手里，请您发发慈悲吧。家里还有十二个可怜的小女儿，她们都靠我养活呢。
          emotion: fearful
        - id: ch01-b06
          speaker: fairy
          text: >-
            我找你，正是为了这些孩子。明天一早，把最小的女儿带来。我会把她当亲生女儿抚养，像爱护自己的眼珠一样疼她。
        - id: ch01-b07
          speaker: narrator
          text: >-
            马萨涅洛听完，心里更害怕了。蜥蜴偏要最年幼、最娇嫩的孩子，莫非想拿她当晚餐后的甜点？他暗暗盘算，不答应，自己也许立刻就会被吃掉。交出女儿，蜥蜴夺走的只是他身上的一部分。不肯交，它却会把他整个人吞掉。他到底应该怎么办，又怎样才能逃过这一关？马萨涅洛怎么想也找不到出路，只管低声嘟囔。
        - id: ch01-b08
          speaker: fairy
          text: >-
            别再犹豫，马上照我的话做。我要你最小的女儿。你若不答应，吃亏的只会是你。
        - id: ch01-b09
          speaker: narrator
          text: >-
            马萨涅洛别无选择，只好回家。他脸色惨白，满面愁苦，妻子一看就知道出了事。
        - id: ch01-b10
          speaker: wife
          text: >-
            亲爱的丈夫，你怎么了？跟人吵架了，还是咱们那头可怜的驴摔倒了？
        - id: ch01-b11
          speaker: masaniello
          text: >-
            都不是，是更糟的事！一只可怕的蜥蜴差点把我吓疯。它逼我明早交出最小的女儿，不然就叫我后悔。我的脑袋像磨盘一样转个不停。伦佐拉是我的心肝，可不把她带去，我这条命就没了。你说，我该怎么办？
          emotion: fearful
        - id: ch01-b12
          speaker: wife
          text: >-
            你怎么知道蜥蜴一定是仇敌？也许它是变了模样的朋友。遇见它，说不定正是好日子的开头，也是苦日子的尽头。把孩子送去吧。我的心告诉我，你不会后悔。
        - id: ch01-b13
          speaker: narrator
          text: >-
            这番话让马萨涅洛安心不少。第二天天一亮，他就牵着小女儿的手，一路把她领到洞口。蜥蜴早在那里等着，看见农夫便迎上前来。它接过女孩的手，又交给父亲一大袋装得满满的金子。
        - id: ch01-b14
          speaker: fairy
          text: >-
            回去给其他女儿办婚事，用这些金子替她们置办嫁妆。伦佐拉留在我身边，父亲和母亲一样都不会缺。她来到我这里，是她的福气，你放心吧。
        - id: ch01-b15
          speaker: narrator
          text: >-
            马萨涅洛感激得不知道说什么才好，连声向蜥蜴道谢，然后回家去见妻子。农夫发财的消息一传开，上门求娶女儿的人便一个接一个。其他女儿很快全都出了嫁。即便替每个女儿办好婚事，袋里的金子还有剩余，足够夫妻俩衣食无忧、舒舒服服地过完一辈子。
    - id: ch02
      title: 宫殿里的婚事
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            只剩伦佐拉和蜥蜴时，阴暗的山洞忽然变成了美丽的宫殿。蜥蜴把她当小公主养大，让她吃珍贵的食物，穿华美的衣裳，还有上千名仆人服侍。伦佐拉想要什么，就有什么。
        - id: ch02-b02
          speaker: narrator
          text: >-
            一天，这个国家的国王在附近林中打猎，天黑了还没回去。他看见宫殿亮着灯，便派一个侍从前来询问，能不能在这里借住一夜。侍从敲门时，蜥蜴立刻变成了一位美丽的女子，还亲自把门打开。听完国王的请求，她请侍从回去传话，说国王肯来，她十分欢迎，他需要的一切，这里都会准备好。
        - id: ch02-b03
          speaker: narrator
          text: >-
            国王听到这样热情的邀请，立刻来到宫殿，受到了最周到的款待。一百名侍童举着火把迎接他，一百人在餐桌旁服侍，另外一百人挥着大扇替他赶苍蝇。伦佐拉亲手为国王倒酒，动作优雅极了。国王陛下一直望着她，眼睛再也舍不得移开。
        - id: ch02-b04
          speaker: narrator
          text: >-
            宴席过后，国王回房休息。伦佐拉替他脱下鞋，也在同一刻勾走了他的心。国王爱她爱得无法自拔，马上向仙女求婚。仙女只盼伦佐拉幸福，不但答应了，还送给她七千枚金几尼作为嫁妆。
        - id: ch02-b05
          speaker: narrator
          text: >-
            国王欢欢喜喜地带着伦佐拉启程。可伦佐拉接受了仙女所有的恩惠，临走时竟连一声谢谢也没有。仙女见她这样忘恩负义，决定惩罚她。诅咒一落下，伦佐拉漂亮的嘴巴立刻伸成山羊的长吻，下巴垂出一码长的胡须，双颊凹了下去，两条光亮的辫子也变成一对尖角。
        - id: ch02-b06
          speaker: narrator
          text: >-
            国王回头一看，简直不敢相信自己的眼睛。他放声大哭。
        - id: ch02-b07
          speaker: king
          text: >-
            那些紧紧缠住我的秀发呢？那双刺进我心里的眼睛呢？我吻过的嘴唇又在哪里？难道我要跟一只山羊拴在一起过一辈子？不！我绝不能为了一个山羊脸姑娘，变成全国人的笑柄！
          emotion: sad
        - id: ch02-b08
          speaker: narrator
          text: >-
            到了自己的国家，国王把伦佐拉关进宫里一座小塔楼，只留下一个侍女陪她。他给两人各发了十捆亚麻，吩咐她们纺成麻线，而且一星期结束以前必须全部做完。
    - id: ch03
      title: 两次考验
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            侍女马上梳理亚麻，把麻绕上纺锤，坐到纺车前勤快地干起来。等星期六傍晚来到，她已经完成了全部工作。伦佐拉却从小受人宠爱，根本不会纺麻，也不知道自己的脸已经变了。她干脆把十捆亚麻全扔出了窗外。
        - id: ch03-b02
          speaker: renzolla
          text: >-
            国王究竟在想什么，竟然让我干这种活？他想要衬衫，自己花钱买啊。我又不是他从阴沟里捡回来的。我带来了七千枚金几尼嫁妆，是他的妻子，不是奴隶！他一定是疯了。
        - id: ch03-b03
          speaker: narrator
          text: >-
            可到了星期六傍晚，伦佐拉看见侍女已经完成任务，还是害怕自己会因为偷懒受罚。她急忙赶去仙女的宫殿，把满腹苦恼全说了出来。仙女疼爱地抱住她，又给她一袋已经纺好的亚麻，好叫她拿给国王看，让国王相信她也很能干。伦佐拉接过袋子，依旧没有说一句谢谢，转身就回宫去了。她一次又一次不知感恩，仙女这回真的生气了。
        - id: ch03-b04
          speaker: narrator
          text: >-
            国王看过纺好的亚麻，又给伦佐拉和侍女各一只小狗，要她们细心照料，好好调教。侍女把小狗当亲儿子一样爱护。伦佐拉却满心不耐烦。
        - id: ch03-b05
          speaker: renzolla
          text: >-
            我这是掉进疯子窝了吗？难道国王真以为，我会亲手给一只狗梳毛，还要喂它吃东西？
        - id: ch03-b06
          speaker: narrator
          text: >-
            她打开窗户，把可怜的小狗扔了出去。狗儿掉到地上，像石头一样一动不动，当场死了。
        - id: ch03-b07
          speaker: narrator
          text: >-
            几个月过去，国王派人传话，说他想看看两只狗长得怎么样了。伦佐拉一听，心里很不自在，只好再次匆匆赶往仙女的宫殿。这一回，宫门前坐着一位老人。老人抬起头，问她是什么人，又问她来这里想做什么。
        - id: ch03-b08
          speaker: renzolla
          text: >-
            你不认识我吗，山羊胡子老头？谁给你的胆子，敢这样跟我说话？
          emotion: angry
        - id: ch03-b09
          speaker: old_man
          text: >-
            锅底黑，可别笑壶底黑。长着山羊脑袋的不是我，是你！你这个忘恩负义的东西，等在这里。我马上让你看看，不知感恩把你害成了什么样子。
        - id: ch03-b10
          speaker: narrator
          text: >-
            老人说完便匆匆离开，很快拿来一面镜子，举到伦佐拉眼前。镜子里是一张丑陋、毛茸茸的脸，双颊凹陷，下巴还挂着长长的白胡子。伦佐拉这才明白自己的容貌已经全变了，吓得几乎昏倒，接着放声痛哭起来。
    - id: ch04
      title: 镜中的真相
      blocks:
        - id: ch04-b01
          speaker: old_man
          text: >-
            伦佐拉，你得记住，自己原本只是农夫的女儿。仙女把你变成了王后，为你做了那么多事，你却连一句谢谢都不肯说。所以她才要惩罚你。要是不想再留着这把长长的白胡子，就跪到仙女脚下，请求她原谅。她的心很柔软，也许还会怜悯你。
        - id: ch04-b02
          speaker: narrator
          text: >-
            伦佐拉终于真心为自己的所作所为感到后悔。她听从老人的劝告，扑到仙女脚下，请求仙女原谅。仙女果然心肠柔软，不但让她恢复了原来的容貌，还给她换上一件金线刺绣的礼服，送她一辆漂亮的马车，又派了大群仆人一路陪伴，把她送回丈夫身边。
        - id: ch04-b03
          speaker: narrator
          text: >-
            国王看见伦佐拉回到面前，容貌又和从前一样美丽，便再一次爱上了她。想到自己把她关进塔楼，让她受了那么多苦，他心中十分悔恨。
    - id: ch05
      title: 幸福的生活
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            从那以后，伦佐拉一直过着幸福又快乐的生活。她爱自己的丈夫，敬重那位仙女，也始终感激那个让她看清真相的老人。
        - id: ch05-b02
          speaker: narrator
          text: >-
            这个故事译自意大利文，由克莱特克辑录。
