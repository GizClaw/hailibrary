  chapters:
    - id: ch01
      title: The Lizard's Bargain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a peasant named Masaniello who had twelve daughters. The girls were like the steps of a staircase, each one just a year older than the next. Feeding such a large family took everything he had. He dug in the fields from morning until night, yet he could barely keep hunger away. Often his little girls went to bed without enough to eat.
        - id: ch01-b02
          speaker: narrator
          text: One day, Masaniello was working at the foot of a high mountain when he found the entrance to a cave. It was so dark and gloomy that even the sun seemed afraid to go inside. Without warning, a huge green lizard came out and stood before him. She was as large as a crocodile and looked just as fierce. Masaniello nearly lost his senses with fear.
        - id: ch01-b03
          speaker: narrator
          text: But the lizard settled beside him as peacefully as a friend.
        - id: ch01-b04
          speaker: fairy
          text: Don't be frightened, good man. I mean you no harm. In fact, I very much want to help you.
        - id: ch01-b05
          speaker: narrator
          text: At those words, the peasant dropped to his knees.
        - id: ch01-b06
          speaker: masaniello
          text: Dear lady, I don't know what else to call you. My life is in your hands, so please have mercy. I have twelve poor little daughters at home, and they depend on me.
          emotion: fearful
        - id: ch01-b07
          speaker: fairy
          text: That is exactly why I came. Bring me your youngest daughter tomorrow morning. I promise to raise her as my own child. She will be the apple of my eye, and I will cherish her more than anything.
        - id: ch01-b08
          speaker: narrator
          text: Masaniello was miserable when he heard this. If the creature wanted the youngest and most tender child, surely the poor girl was meant to become part of her supper.
        - id: ch01-b09
          speaker: masaniello
          text: If I say no, she will eat me here and now. If I obey, she takes a part of me. If I refuse, she takes all of me. What can I do? How will I ever escape this trouble?
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: He went on muttering until the lizard interrupted him.
        - id: ch01-b11
          speaker: fairy
          text: Decide at once and do as I tell you. I want your youngest daughter. If you refuse me, things will go badly for you.
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: Masaniello could see no other choice. He left the mountain and made his way home. By the time he arrived, he looked so pale and wretched that his wife questioned him at once.
        - id: ch01-b13
          speaker: wife
          text: My dear husband, what has happened? Did you quarrel with someone? Has our poor donkey fallen down?
        - id: ch01-b14
          speaker: masaniello
          text: Neither. Something much worse happened. A terrible lizard frightened me nearly out of my mind. She says I must give her our youngest daughter, or she will make me pay. My head is spinning like a mill wheel. You know how dearly I love Renzolla, but if I don't take her to the lizard tomorrow, my life is over. Please tell me what to do.
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: His wife listened to the whole story before she answered.
        - id: ch01-b16
          speaker: wife
          text: How can we know the lizard is our enemy? She may be a friend in disguise. Meeting her might end our misery and begin something better. Take the child to her. My heart tells me you will never be sorry that you did.
          emotion: calm
        - id: ch01-b17
          speaker: narrator
          text: Her words comforted Masaniello. At first light the next morning, he took his little daughter by the hand and led her to the cave.
        - id: ch01-b18
          speaker: narrator
          text: The lizard was waiting. She came forward, took Renzolla's hand, and gave her father a sack filled with gold.
        - id: ch01-b19
          speaker: fairy
          text: Go home and arrange marriages for your other daughters. Use this gold for their dowries, and don't worry. With me, Renzolla will have both a father and a mother. She is lucky to have come into my care.
        - id: ch01-b20
          speaker: narrator
          text: Overcome with gratitude, Masaniello thanked her and returned to his wife. News of the peasant's wealth soon spread, and there was no shortage of men who wanted to marry his daughters. He provided every one of them with a dowry, and before long all eleven were wed. Even after that, enough gold remained for Masaniello and his wife to live in comfort and plenty for the rest of their days.
    - id: ch02
      title: The Palace and the King
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When the lizard was alone with Renzolla, she changed the dark cave into a splendid palace and led the girl inside. There she raised Renzolla like a young princess. The child had magnificent food at every meal, beautiful clothes to wear, and a thousand servants ready to attend her. Everything she could want was provided.
        - id: ch02-b02
          speaker: narrator
          text: One day, the king of that country was hunting in a wood close to the palace. Night fell before he could leave. Then he noticed a light shining among the darkness, so he sent one of his pages to ask whether the people inside could give him lodging until morning.
        - id: ch02-b03
          speaker: narrator
          text: The page knocked at the door. Before opening it, the lizard changed herself into a beautiful woman. She listened to the king's request and sent back a welcoming answer.
        - id: ch02-b04
          speaker: fairy
          text: Tell His Majesty I will be delighted to receive him. He shall have everything he needs.
        - id: ch02-b05
          speaker: page
          text: Your Majesty, the lady of the palace gladly welcomes you and will provide whatever you require.
        - id: ch02-b06
          speaker: narrator
          text: The king went straight to the palace, where he was treated with extraordinary honor. A hundred pages carrying torches came out to meet him. A hundred more served him at dinner, while another hundred waved great fans to keep away the flies.
        - id: ch02-b07
          speaker: narrator
          text: Renzolla herself poured the king's wine. She did it with such grace that His Majesty could not take his eyes from her. When the meal was over and the table had been cleared, he went to rest. Renzolla drew the shoes from his feet, and at the same time she drew the heart from his breast.
        - id: ch02-b08
          speaker: narrator
          text: He had fallen desperately in love. He called the fairy to him and asked for Renzolla's hand in marriage. The kind fairy cared only for the girl's happiness, so she gladly gave her consent. Nor was that all. She also promised Renzolla a wedding portion of seven thousand golden guineas.
        - id: ch02-b09
          speaker: narrator
          text: The delighted king prepared to leave with his bride. But Renzolla did not offer the fairy a single word of thanks for everything she had done.
        - id: ch02-b10
          speaker: narrator
          text: Such heartless ingratitude angered the fairy. She laid a curse on Renzolla, and the girl's face became the head of a goat. Her pretty mouth pushed out into a snout. A beard a yard long hung from it. Her cheeks sank, and the shining braids of her hair turned into two sharp horns.
        - id: ch02-b11
          speaker: narrator
          text: When the king looked around and saw her, he thought he had lost his mind. He burst into tears.
        - id: ch02-b12
          speaker: king
          text: Where is the hair that held me so tightly? Where are the eyes that pierced my heart, and the lips I kissed? Must I spend my life tied to a goat? No! I will not let my subjects laugh at me because of a goat-faced girl!
          emotion: sad
        - id: ch02-b13
          speaker: narrator
          text: When they reached his own country, the king locked Renzolla in a small turret room high in the palace, with only a waiting maid beside her. He gave each of them ten bundles of flax to spin and ordered them to finish the entire task before the week ended.
    - id: ch03
      title: The Flax
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The waiting maid obeyed at once. She combed out the flax, wound it around her spindle, and worked steadily at her spinning wheel. By Saturday evening, she had finished every bundle.
        - id: ch03-b02
          speaker: narrator
          text: Renzolla had been spoiled and petted in the fairy's palace. She still had no idea that her own appearance had changed. Instead of working, she threw all her flax out the window.
        - id: ch03-b03
          speaker: renzolla
          text: What can the king be thinking, giving me work like this? If he needs shirts, he can buy them. He didn't drag me out of the gutter. I brought him seven thousand golden guineas as my wedding portion. I am his wife, not his slave. He must be mad to treat me this way.
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: But on Saturday evening, Renzolla saw that the maid had completed her task. Now she was afraid she might be punished for doing nothing. She hurried back to the fairy's palace and told her all her troubles.
        - id: ch03-b05
          speaker: narrator
          text: The fairy embraced her tenderly and listened to her troubles. Then she gave Renzolla a whole sack of spun flax. Renzolla could take it back and show the king what a diligent worker she had been. Once again, she accepted the fairy's help without one word of thanks. She carried the sack to the palace, leaving the kind fairy deeply offended by her ingratitude.
        - id: ch03-b06
          speaker: narrator
          text: The king saw that all the flax had been spun. Next, he gave Renzolla and the waiting maid a little dog each. He told both women to care for the animals and train them properly.
    - id: ch04
      title: The Little Dog and the Mirror
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The waiting maid cared for her dog as lovingly as if he were her own son. Renzolla wanted no part of such work.
        - id: ch04-b02
          speaker: renzolla
          text: What sort of place have I come to? Is everyone here out of their mind? Does the king truly expect me to comb a dog and feed it with my own hands?
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: She opened the window and threw the poor little creature out. He struck the ground and lay as dead as a stone.
        - id: ch04-b04
          speaker: narrator
          text: Several months passed. Then the king sent a message to both women. He wanted to see how well they had cared for and trained their dogs. Renzolla knew what she had done to hers, so the request left her very uneasy. Once more, she hurried to the fairy's palace for help.
        - id: ch04-b05
          speaker: narrator
          text: This time, an old man stood at the palace door.
        - id: ch04-b06
          speaker: old_man
          text: Who are you, and what do you want here?
        - id: ch04-b07
          speaker: renzolla
          text: Don't you know who I am, you old goat-beard? How dare you speak to me like that?
          emotion: angry
        - id: ch04-b08
          speaker: old_man
          text: You should look at yourself before calling me names. I am not the one with a goat's head. You are. Wait here, you ungrateful creature. I will show you what your thanklessness has done to you.
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: He hurried away and came back carrying a mirror. When he held it before Renzolla, she saw her ugly, hairy face for the first time. She almost fainted from horror, then broke into loud sobs over the terrible change.
        - id: ch04-b10
          speaker: old_man
          text: Remember who you are, Renzolla. You were born a peasant's daughter, and the fairy made you a queen. Yet you never once thanked her for all she gave you, so she chose to punish you. If you want to lose that long white beard, fall at her feet and beg her forgiveness. Her heart is tender. She may still take pity on you.
    - id: ch05
      title: Renzolla Learns Gratitude
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: This time, Renzolla truly regretted the way she had behaved. She understood how ungrateful she had been. Following the old man's advice, she went to the fairy, threw herself at her feet, and begged to be forgiven.
        - id: ch05-b02
          speaker: narrator
          text: The fairy restored Renzolla's own face. Then she dressed her in a gown embroidered with gold and gave her a beautiful carriage. With a great company of servants around her, Renzolla was taken back to her husband.
        - id: ch05-b03
          speaker: narrator
          text: The king saw that she was as beautiful as ever, and he fell in love with her all over again. He bitterly regretted making her suffer so much.
        - id: ch05-b04
          speaker: narrator
          text: From then on, Renzolla lived happily. She loved her husband, honored the fairy, and remained grateful to the old man who had told her the truth.
