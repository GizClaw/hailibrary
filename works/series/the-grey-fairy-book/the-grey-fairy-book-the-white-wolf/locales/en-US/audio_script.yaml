  chapters:
    - id: ch01
      title: The Wreath and the Promise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king with three beautiful daughters. The youngest was the fairest of them all. One day, the king had to travel through a distant part of his kingdom. Before he left, his youngest daughter asked him to bring her a wreath of wildflowers, and he gave his promise.
        - id: ch01-b02
          speaker: narrator
          text: When it was time to go home, the king chose gifts for all three daughters. At a jeweler's shop, he bought a lovely necklace for the eldest. From a wealthy merchant, he bought the second a dress embroidered with gold and silver thread. But he searched every flower shop and market without finding the wildflower wreath his youngest daughter wanted. At last, he had to begin the journey home without it.
        - id: ch01-b03
          speaker: narrator
          text: The road took him through a thick forest. About four miles from the palace, he saw a white wolf sitting beside the road. And there, resting on the wolf's head, was a wreath of wildflowers.
        - id: ch01-b04
          speaker: narrator
          text: The king called to his coachman and ordered him to get down and take the wreath. The wolf heard him.
        - id: ch01-b05
          speaker: white_wolf
          text: My lord and king, you may have this wreath, but you must give me something in return.
        - id: ch01-b06
          speaker: king
          text: What would you have? I will gladly trade you a rich treasure for it.
        - id: ch01-b07
          speaker: white_wolf
          text: Rich treasure means nothing to me. Promise me the first thing that comes to meet you on your way to the castle. Three days from now, I will come to claim it.
        - id: ch01-b08
          speaker: narrator
          text: The king thought he was still far enough from home. Surely some wild creature or bird would cross his path before he reached the castle. He believed there could be no danger in making such a promise. So he agreed and took the wreath.
        - id: ch01-b09
          speaker: narrator
          text: Yet not one living creature appeared along the road. Only when the carriage passed through the palace gates did someone come to meet him. It was his youngest daughter, waiting to welcome him home.
        - id: ch01-b10
          speaker: narrator
          text: That evening, the king remembered his promise and grew terribly sad. When he told the queen what had happened, she wept bitterly too. Their youngest daughter asked why they looked so unhappy and why they were crying.
        - id: ch01-b11
          speaker: narrator
          text: Her father told her what the wreath had cost. In three days, the white wolf would come to claim her and carry her away, and they would never see her again. The queen thought for a long time. At last, she formed a plan.
        - id: ch01-b12
          speaker: narrator
          text: A servant maid in the palace was the same age and height as the princess. The queen dressed the girl in one of her daughter's beautiful gowns. She meant to give the maid to the wolf, believing he would never know the difference.
    - id: ch02
      title: The White Wolf's Castle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: On the third day, the wolf strode across the palace yard, climbed the great stairs, and entered the room where the king and queen sat.
        - id: ch02-b02
          speaker: white_wolf
          text: I have come for what you promised me. Give me your youngest daughter.
        - id: ch02-b03
          speaker: narrator
          text: They brought the servant maid to him.
        - id: ch02-b04
          speaker: white_wolf
          text: Climb onto my back. I will carry you to my castle.
        - id: ch02-b05
          speaker: narrator
          text: He swung her onto his back and left the palace. When they reached the place where he had met the king and given him the wreath, the wolf stopped. He told the girl to get down so they could rest beside the road.
        - id: ch02-b06
          speaker: white_wolf
          text: Tell me, what would your father do if this forest were his?
        - id: ch02-b07
          speaker: servant_maid
          text: My father is poor. He would fell the trees and saw the wood into planks. Then he would sell them, and we would never be poor or hungry again.
        - id: ch02-b08
          speaker: narrator
          text: The wolf knew at once that she was not the princess. He lifted the maid onto his back again and carried her straight to the palace. He entered the king's chamber in a fury.
        - id: ch02-b09
          speaker: white_wolf
          text: Give me the true princess now. Try to deceive me again, and I will send such a storm over this palace that its walls will fall and bury every one of you.
          emotion: angry
        - id: ch02-b10
          speaker: narrator
          text: The king and queen wept, but they knew they could not escape. They sent for their youngest daughter.
        - id: ch02-b11
          speaker: king
          text: My dearest child, you must leave with the white wolf. I promised you to him, and I have to keep my word.
          emotion: sad
        - id: ch02-b12
          speaker: narrator
          text: The princess prepared to leave her home. First, she went to her room and fetched the wreath of wildflowers. She took it with her when the wolf swung her onto his back and carried her away.
        - id: ch02-b13
          speaker: narrator
          text: At the same roadside place, he asked her to get down and rest. Then he put the same question to her.
        - id: ch02-b14
          speaker: white_wolf
          text: What do you think your father would do if he owned this forest?
        - id: ch02-b15
          speaker: youngest_princess
          text: My father would clear the trees and make beautiful gardens and a park. In summer, he and his courtiers would walk through the open glades.
        - id: ch02-b16
          speaker: narrator
          text: The wolf knew that this was the true princess.
        - id: ch02-b17
          speaker: white_wolf
          text: Climb onto my back once more. I will take you to my castle.
        - id: ch02-b18
          speaker: narrator
          text: With the princess seated on his back, he raced through the woods. He ran and ran until he came to a stately courtyard with massive gates. The gates swung open, and the princess stepped inside.
        - id: ch02-b19
          speaker: youngest_princess
          text: What a beautiful castle this is. If only I were not so far from my father and mother!
          emotion: sad
        - id: ch02-b20
          speaker: white_wolf
          text: When a year has passed, we will go and visit them.
        - id: ch02-b21
          speaker: narrator
          text: As he spoke, the white furry skin slipped from his back. The princess saw that he was no wolf at all, but a handsome young man, tall and stately. He offered her his hand and led her up the castle stairs.
    - id: ch03
      title: The Burned Wolf Skin
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Half a year went by. Then the young man came to the princess's room and told her to prepare for a wedding.
        - id: ch03-b02
          speaker: white_wolf
          text: My dear one, your eldest sister is getting married. I will carry you to your father's palace. When the wedding is done, I will come back for you. Listen for my whistle outside the gate. The moment you hear it, leave the dancing and feasting. Do not let your father or mother hold you back. Come to me at once. If I have to go without you, you will never find the way through the forests by yourself.
        - id: ch03-b03
          speaker: narrator
          text: When she was ready, he had put on the white skin and become a wolf again. He carried her to her father's palace, left her there, and returned home alone.
        - id: ch03-b04
          speaker: narrator
          text: That evening, he came back and stood outside the palace gate. He gave one long, loud whistle. The princess heard it in the middle of her dancing. At once, she went out to him. He swung her onto his back and bore her home to his castle.
        - id: ch03-b05
          speaker: narrator
          text: Another half year passed. This time, he entered her room wearing the shape of the white wolf.
        - id: ch03-b06
          speaker: white_wolf
          text: Dear heart, your second sister is to be married. We will go to your father's palace today, and this time we will stay there together until morning.
        - id: ch03-b07
          speaker: narrator
          text: They went to the wedding together. That evening, when they believed they were alone, he let the white fur fall from him and became a prince once more. Neither of them knew that the princess's mother was hiding in the room.
        - id: ch03-b08
          speaker: narrator
          text: The queen saw the wolf skin lying on the floor. She crept away and sent a servant to take it to the kitchen and throw it into the fire. The instant the flames touched the fur, a fearful clap of thunder shook the palace. A whirlwind swept the prince out through the gate, and he vanished. He returned to his own palace alone.
        - id: ch03-b09
          speaker: narrator
          text: The princess was heartbroken. She spent the whole night weeping bitterly.
        - id: ch03-b10
          speaker: narrator
          text: In the morning, she set out to find the castle again. She wandered through woods and forests without any path or track to guide her. For fourteen days, she roamed beneath the trees. She slept under their branches and lived on wild berries and roots.
        - id: ch03-b11
          speaker: narrator
          text: At last, she came to a little house. She opened the door and found the Wind sitting alone inside.
        - id: ch03-b12
          speaker: youngest_princess
          text: Wind, have you seen the white wolf?
        - id: ch03-b13
          speaker: wind
          text: I have been blowing around the world all day and all night, and I have only just returned. But no, I have not seen him.
        - id: ch03-b14
          speaker: narrator
          text: The Wind gave her a pair of shoes. With them, he said, she could travel a hundred miles in a single step. The princess put them on and walked through the air until she reached a star.
        - id: ch03-b15
          speaker: youngest_princess
          text: Star, please tell me. Have you seen the white wolf?
        - id: ch03-b16
          speaker: star
          text: I have shone through the whole night, but I have not seen him.
        - id: ch03-b17
          speaker: narrator
          text: The Star gave her another pair of shoes. These would carry her two hundred miles with every stride. She drew them on and walked until she came to the Moon.
        - id: ch03-b18
          speaker: youngest_princess
          text: Dear Moon, have you seen the white wolf anywhere?
        - id: ch03-b19
          speaker: moon
          text: All night I have sailed across the heavens, and I have only just come home. I did not see him.
        - id: ch03-b20
          speaker: narrator
          text: The Moon gave her shoes that could cover four hundred miles at a stride. Wearing them, the princess traveled on to the Sun.
        - id: ch03-b21
          speaker: youngest_princess
          text: Dear Sun, have you seen the white wolf?
    - id: ch04
      title: The Palace on the Glass Mountain
      blocks:
        - id: ch04-b01
          speaker: sun
          text: Yes, I have seen him. He believed you had left him and would never return, so he has chosen another bride. They are preparing for the wedding now. But I will help you. Take these shoes. They will let you walk on glass or ice and climb the steepest ground. Take this spinning wheel too. It will spin moss into silk. Beyond my house, you will come to a mountain of glass. Put on my shoes, and you will climb it easily. The white wolf's palace stands at the very top.
        - id: ch04-b02
          speaker: narrator
          text: The princess set off again. Before long, the glass mountain rose before her. With the Sun's shoes, she climbed to its summit and found the white wolf's palace, just as he had said.
        - id: ch04-b03
          speaker: narrator
          text: No one knew her. She had disguised herself as an old woman and wrapped a shawl around her head. All through the palace, servants were preparing for the wedding that would take place the next day.
        - id: ch04-b04
          speaker: narrator
          text: Still dressed as an old woman, the princess took out the spinning wheel and began feeding moss into it. The wheel turned the moss into silk. The new bride passed by, saw the shining silk appear, and stopped beside her.
        - id: ch04-b05
          speaker: new_bride
          text: Little mother, I would dearly like to have that spinning wheel. Will you give it to me?
        - id: ch04-b06
          speaker: youngest_princess
          text: It is yours if you let me sleep tonight on the mat outside the prince's door.
        - id: ch04-b07
          speaker: new_bride
          text: Very well. You may spend the night on the mat outside his door.
        - id: ch04-b08
          speaker: narrator
          text: The princess handed over the spinning wheel. That night, she wound the shawl closely around her so no one would recognize her. Then she lay down on the mat outside the white wolf's door.
        - id: ch04-b09
          speaker: narrator
          text: When everyone in the palace was asleep, she began to tell her story.
        - id: ch04-b10
          speaker: youngest_princess
          text: I was one of three sisters, the youngest and fairest of them all. My father promised me to a white wolf, and I had to leave my home with him. First, he carried me back to the palace for my eldest sister's wedding. Half a year later, we went together to my second sister's wedding. That night, my mother saw his white fur lying on the floor. She ordered a servant to burn it in the kitchen fire. The moment it touched the flames, he vanished, and I was left behind. I wandered through the forests for fourteen days, weeping and searching for the road to his castle. I asked the Wind, the Star, the Moon, and the Sun where he had gone. Each one befriended me and helped me travel farther. At last, the Sun told me how to climb the glass mountain and reach this palace. I have sought the white wolf through every danger and hardship, and now I have found him at last.
        - id: ch04-b11
          speaker: narrator
          text: Behind the door, the white wolf heard every word. He knew the old woman was his first wife, the princess who had searched for him and found him after so many dangers. Still, he said nothing. He waited for the following day, when kings and princes from distant countries would gather for his wedding.
    - id: ch05
      title: The Old Key and the New
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next day, all the invited royal guests assembled in the banqueting hall. When every king and prince had taken his place, the white wolf rose to address them.
        - id: ch05-b02
          speaker: white_wolf
          text: Hear me, kings and princes. I have a question for you. I once lost the key to my treasure chest, so I ordered a new key to be made. Since then, I have found the old one. Which key is better?
        - id: ch05-b03
          speakers: [first_royal_guest, second_royal_guest, third_royal_guest]
          ensemble: chorus
          text: The old key is surely better than the new one.
        - id: ch05-b04
          speaker: white_wolf
          text: Then if that is true, my first bride is better than my new one.
        - id: ch05-b05
          speaker: narrator
          text: He sent for the new bride and gave her in marriage to one of the princes who was present. Then he turned back to his guests.
        - id: ch05-b06
          speaker: white_wolf
          text: Here is my first bride.
        - id: ch05-b07
          speaker: narrator
          text: The beautiful princess was led into the hall and seated beside him on his throne.
        - id: ch05-b08
          speaker: white_wolf
          text: I believed she had forgotten me and would never come back. But she searched for me everywhere. Now that we are together again, we will never part.
