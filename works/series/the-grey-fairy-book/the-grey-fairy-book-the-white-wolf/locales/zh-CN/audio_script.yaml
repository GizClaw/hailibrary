audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，保留古老童话的神秘感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 威严厚重，忧愁时低沉而真挚
        timbre: 浑厚温暖
        pace: 适中
        pitch: 中低音
    princess:
      display_name: 小公主
      tts:
        delivery: 温柔坚定，历经艰难仍满怀深情
        timbre: 清亮柔和
        pace: 适中
        pitch: 中高音
    white_wolf:
      display_name: 白狼王子
      tts:
        delivery: 沉稳庄重，威胁时凌厉，动情时温柔
        timbre: 清朗低沉
        pace: 适中
        pitch: 中低音
    servant_maid:
      display_name: 女仆
      tts:
        delivery: 朴实拘谨，说话直白
        timbre: 清脆自然
        pace: 适中
        pitch: 中音
    wind:
      display_name: 风
      tts:
        delivery: 飘忽悠远，语气坦率
        timbre: 轻盈宽阔
        pace: 舒缓
        pitch: 中音
    star:
      display_name: 星星
      tts:
        delivery: 明净安静，语气温和
        timbre: 清澈明亮
        pace: 稍慢
        pitch: 高音
    moon:
      display_name: 月亮
      tts:
        delivery: 宁静悠远，带着夜色般的温柔
        timbre: 柔和空灵
        pace: 舒缓
        pitch: 中音
    sun:
      display_name: 太阳
      tts:
        delivery: 温暖坦荡，指引时清楚笃定
        timbre: 明亮饱满
        pace: 适中
        pitch: 中音
    new_bride:
      display_name: 新娘
      tts:
        delivery: 好奇直率，语气自然
        timbre: 清甜柔和
        pace: 适中
        pitch: 中高音
    guest_king:
      display_name: 宾客国王
      tts:
        delivery: 庄重明确，回答时毫不迟疑
        timbre: 洪亮厚实
        pace: 适中
        pitch: 低音
    guest_prince_1:
      display_name: 宾客王子甲
      tts:
        delivery: 坦率爽朗，随众应答时清晰有力
        timbre: 清朗结实
        pace: 适中
        pitch: 中音
    guest_prince_2:
      display_name: 宾客王子乙
      tts:
        delivery: 端正沉稳，随众应答时语气肯定
        timbre: 明亮平稳
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 野花花环的代价
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，一位国王有三个美丽的女儿，其中小女儿最为出众。一天，国王要到王国远方巡视。临行前，小公主请父亲答应，回来时给她带一顶野花花环。办完事情，国王想到三个女儿都在等他，便想给她们各带一件礼物。他走进珠宝店，为大女儿买了美丽的项链，又去富商那里，为二女儿买了金银丝绣成的衣裳。可是，他找遍花店和集市，也没找到小女儿一心想要的花环，只好空着手动身回宫。马车穿过茂密的森林，离王宫大约四英里时，国王看见路边蹲着一只白狼，头上正戴着一顶野花花环。
        - id: ch01-b02
          speaker: narrator
          text: >-
            国王叫车夫下车，把花环取来。白狼听得清清楚楚，先开了口。
        - id: ch01-b03
          speaker: white_wolf
          text: >-
            国王陛下，花环可以给您，但您要拿一样东西来换。
        - id: ch01-b04
          speaker: king
          text: >-
            你想要什么？只要能换到花环，再贵重的宝物我也愿意给。
        - id: ch01-b05
          speaker: white_wolf
          text: >-
            我不要宝物。您回城堡的路上，第一个来迎接您的东西，要送给我。三天后，我来带走它。
        - id: ch01-b06
          speaker: narrator
          text: >-
            国王想，离家还有很远，先遇见的多半是野兽或飞鸟，答应了也无妨。他应下白狼的条件，带着花环继续赶路。可从森林一路走到王宫，他连一个活物也没碰见。直到马车转进宫门，小女儿早已等在那里，第一个跑来迎接父亲回家。
        - id: ch01-b07
          speaker: narrator
          text: >-
            那天晚上，国王想起诺言，愁苦不已。他把事情告诉王后，王后也伤心地流下泪来。小公主见父母满面愁容，便问他们为何这样难过。父亲只得说出花环的代价。三天后，白狼会来把她带走，从此一家人再也不能相见。王后苦苦思量，终于有了主意。宫里有个女仆，年龄、身量都和公主相仿。王后让她换上女儿的华美衣裙，想用她骗过白狼。
        - id: ch01-b08
          speaker: narrator
          text: >-
            第三天，白狼走进王宫，上了大台阶，来到国王和王后面前。
        - id: ch01-b09
          speaker: white_wolf
          text: >-
            我来请您兑现诺言。把小女儿交给我。
        - id: ch01-b10
          speaker: narrator
          text: >-
            他们把女仆领来。白狼叫她坐上自己的背，把她甩上去，带着她离开王宫。到了当初遇见国王、交出花环的地方，他才停下来，让姑娘下去，在路边歇一会儿。
        - id: ch01-b11
          speaker: white_wolf
          text: >-
            如果这片森林属于你父亲，他会怎么处置？
        - id: ch01-b12
          speaker: servant_maid
          text: >-
            我父亲很穷。他会把树砍下来，锯成木板再卖掉。这样我们就再也不挨饿，也不会受穷了。
        - id: ch01-b13
          speaker: narrator
          text: >-
            白狼立刻知道她不是公主。他把女仆重新甩到背上，一路送回王宫，然后大步走进国王的房间，满腔怒火再也压不住了。
        - id: ch01-b14
          speaker: white_wolf
          text: >-
            马上交出真正的公主！再敢欺骗我，我就唤来风暴，掀塌王宫，把你们全埋在废墟里！
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: >-
            国王和王后流着泪，却知道已经无路可逃。他们只得叫来小女儿，亲口告诉她这个决定。
        - id: ch01-b16
          speaker: king
          text: >-
            最亲爱的孩子，你必须跟白狼走。我把你许给了他，就不能食言。
          emotion: sad
        - id: ch01-b17
          speaker: narrator
          text: >-
            公主只好准备离家。临走前，她回到自己房里，取来那顶野花花环，带在身边。白狼把她甩上后背，驮着她来到同一个地方，又让她在路边歇息，再次问起那片森林。
        - id: ch01-b18
          speaker: princess
          text: >-
            父王会砍去树木，把那里改成美丽的园林和花园。夏天，他会带着朝臣到林间散步。
        - id: ch01-b19
          speaker: narrator
          text: >-
            白狼心里明白，这才是真正的公主。
        - id: ch01-b20
          speaker: white_wolf
          text: >-
            再坐上来吧，我带你去我的城堡。
    - id: ch02
      title: 白狼的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            公主重新坐到白狼背上。他驮着她穿过树林，一直跑啊，跑啊，跑啊，终于停在一座庄严的庭院前。那里有高大厚重的门楼。大门徐徐打开，公主走了进去。
        - id: ch02-b02
          speaker: princess
          text: >-
            城堡真美。可我离父王和母后太远了。
          emotion: sad
        - id: ch02-b03
          speaker: white_wolf
          text: >-
            等一年过去，我们就去看望他们。
        - id: ch02-b04
          speaker: narrator
          text: >-
            话音刚落，他背上的白色毛皮忽然滑落。公主这才看清，他根本不是狼，而是一位高大挺拔、容貌俊美的青年。他把手伸给公主，牵着她登上城堡的楼梯。
        - id: ch02-b05
          speaker: narrator
          text: >-
            半年后的一天，王子走进公主的房间，带来了大姐将要成婚的消息。
        - id: ch02-b06
          speaker: white_wolf
          text: >-
            亲爱的，你该准备参加婚礼了。我会送你回父王的宫殿。婚礼结束以后，我来接你，还会站在宫门外吹口哨。你听见哨声，不管父王母后怎样劝阻，都别停留。放下舞会和宴席，马上出来找我。要是我只能独自离开，你绝不可能一个人穿过森林，找到回家的路。
        - id: ch02-b07
          speaker: narrator
          text: >-
            公主准备好时，王子已经披上白色毛皮，又成了白狼。他把公主甩到背上，送回父王的宫殿，自己独自回家。到了傍晚，他又折返回去，站在宫门外吹了一声又长又响的口哨。正在跳舞的公主听见了，马上离开舞会。白狼把她驮回自己的城堡。
        - id: ch02-b08
          speaker: narrator
          text: >-
            又过半年，王子仍披着白狼皮来见她。
        - id: ch02-b09
          speaker: white_wolf
          text: >-
            亲爱的，你二姐也要结婚了。今天我们一起回宫，在那里住到明早。
        - id: ch02-b10
          speaker: narrator
          text: >-
            两人一同参加婚礼。到了晚上，身边再没有旁人时，王子脱下狼皮，不再是白狼，又变回原来的模样。他们谁也不知道，王后正藏在房中，把眼前的一切都看见了。王后等那身白色毛皮落在地板上，便悄悄溜出去，派一个仆人取走毛皮，扔进厨房的炉火。火焰刚一碰到它，空中便响起一声可怕的霹雳。王子裹在旋风里冲出宫门，独自回到了自己的城堡。
    - id: ch03
      title: 穿过森林与天空
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            公主心都碎了，伤心地哭了整整一夜。第二天早晨，她便出发寻找回城堡的路。可是，重重森林里没有小径，也看不到半点道路的痕迹。她就这样漂泊了十四天。夜里只能睡在树下，饿了便吃野莓和草根。最后，她来到一间小屋，推门进去，看见风独自坐在里面。
        - id: ch03-b02
          speaker: princess
          text: >-
            风啊，你见过白狼吗？
        - id: ch03-b03
          speaker: wind
          text: >-
            我日夜吹遍世界，刚刚才回来，可我没有见过他。
        - id: ch03-b04
          speaker: narrator
          text: >-
            虽然没有白狼的消息，风还是送给公主一双鞋，告诉她穿上以后，一步就能走一百英里。她踏着空气前行，直到来到一颗星星面前。
        - id: ch03-b05
          speaker: princess
          text: >-
            星星，请告诉我，你见过白狼吗？
        - id: ch03-b06
          speaker: star
          text: >-
            我照耀了一整夜，没有看见他。
        - id: ch03-b07
          speaker: narrator
          text: >-
            星星也送她一双鞋，告诉她每一步能跨过二百英里。公主把鞋穿好，一路走到月亮那里。
        - id: ch03-b08
          speaker: princess
          text: >-
            亲爱的月亮，你也没有见过白狼吗？
        - id: ch03-b09
          speaker: moon
          text: >-
            我整夜在天空航行，刚刚才回来，可我没有见过他。
        - id: ch03-b10
          speaker: narrator
          text: >-
            月亮仍然送给公主一双鞋。穿着这双鞋，每一步都能越过四百英里。她继续赶路，终于来到太阳面前。
        - id: ch03-b11
          speaker: princess
          text: >-
            亲爱的太阳，你见过白狼吗？
        - id: ch03-b12
          speaker: sun
          text: >-
            我见过。他以为你离开了，再也不会回来，所以另选了一位新娘，正在准备婚礼。不过，我会帮助你。这双鞋能让你走过玻璃和冰面，爬上最陡的地方。这架纺车能把苔藓纺成丝。离开这里后，你会遇见一座玻璃山。穿上鞋爬到山顶，就能找到白狼的宫殿。
        - id: ch03-b13
          speaker: narrator
          text: >-
            公主带着鞋和纺车重新上路，不久便到了玻璃山。光滑的山面原本无处落脚，可她穿上太阳送的鞋，很轻松就攀到了山顶。白狼的宫殿果然在那里，正和太阳说的一样。
    - id: ch04
      title: 门外的老妇人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            公主扮成一个老妇人，又用披巾裹住头，所以宫里没有人认出她。那里上上下下忙成一片，都在筹备第二天的婚礼。公主仍装作老妇人，取出太阳送的纺车，坐下来把苔藓纺成丝。新娘正好从旁边经过，亲眼看见苔藓在纺车上变成了丝。
        - id: ch04-b02
          speaker: new_bride
          text: >-
            老婆婆，把这架纺车送给我吧。
        - id: ch04-b03
          speaker: princess
          text: >-
            只要你答应，让我今晚睡在王子门外的席子上，我就送给你。
        - id: ch04-b04
          speaker: new_bride
          text: >-
            好，你可以睡在那里。
        - id: ch04-b05
          speaker: narrator
          text: >-
            公主交出纺车。夜里，她把披巾裹得严严实实，不让任何人看出自己的模样，然后躺在白狼门外的席子上。等宫里的人全睡熟了，她便从头讲起自己的经历。她说，自己是三姐妹中最小、最美的女儿，父王为了野花花环，把她许给了白狼。她先回宫参加大姐的婚礼，后来又和丈夫一起参加二姐的婚礼。母后却命仆人把那身白色毛皮扔进厨房的炉火。她还讲起自己如何在森林里漂泊，一边流泪，一边寻找白狼。风、星星、月亮和太阳都向她伸出援手，最终帮她来到这座宫殿。白狼听完全部故事，终于知道门外正是他原来的妻子。她经历了那么多危险和艰难，一路寻找，终于找到了他。
        - id: ch04-b06
          speaker: narrator
          text: >-
            白狼虽然已经认出她，却没有出声。他一直等到第二天，等远方各国来参加婚礼的国王和王子全都到齐，再当着所有宾客说出自己的选择。
    - id: ch05
      title: 新钥匙与旧钥匙
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            第二天，远道而来的国王和王子们全都齐聚宴会厅。白狼等众人坐定，便当着所有人的面开口了。
        - id: ch05-b02
          speaker: white_wolf
          text: >-
            各位国王和王子，请听我说。我丢过宝物匣的钥匙，只好叫人另配一把。后来，旧钥匙又找到了。请各位告诉我，两把钥匙之中，哪一把更好？
        - id: ch05-b03
          speakers: [guest_king, guest_prince_1, guest_prince_2]
          ensemble: chorus
          text: >-
            当然是旧钥匙比新钥匙好。
        - id: ch05-b04
          speaker: white_wolf
          text: >-
            既然这样，我原来的新娘也比新选的新娘好。
        - id: ch05-b05
          speaker: narrator
          text: >-
            他叫来新娘，把她嫁给在场的一位王子。随后，他转向所有宾客，告诉大家，自己的旧新娘就在这里。美丽的公主被领进宴会厅，坐到他身边的宝座上。
        - id: ch05-b06
          speaker: white_wolf
          text: >-
            这就是我原来的新娘。我以为她忘了我，再也不会回来。可她走遍各处寻找我。现在，我们终于重聚，从此再也不分开了。
