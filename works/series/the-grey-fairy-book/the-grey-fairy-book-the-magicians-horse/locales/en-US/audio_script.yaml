  chapters:
    - id: ch01
      title: The Palace in the Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king with three sons. One day, the princes went hunting in a great forest far from their father's palace. The youngest lost his way among the trees, and his brothers had to return without him.
        - id: ch01-b02
          speaker: narrator
          text: For four days he wandered from glade to glade. At night he slept on moss beneath the stars. By day he lived on roots and wild berries. On the fifth morning, he reached a wide clearing. A stately palace stood in the middle, yet there was no sign of a person anywhere.
        - id: ch01-b03
          speaker: narrator
          text: The door stood open, so the prince went in. He wandered through one deserted room after another without seeing a living soul. At last, he entered a great hall. In its center was a table covered with fine food and excellent wine. He sat down and ate and drank until he was satisfied. The moment he finished, the whole table vanished before his eyes.
        - id: ch01-b04
          speaker: narrator
          text: The prince found that very strange. He searched upstairs and down, but still found no one. Darkness was beginning to fall when footsteps sounded in the distance. An old man was coming up the stairs toward him.
        - id: ch01-b05
          speaker: magician
          text: Why are you wandering through my castle?
        - id: ch01-b06
          speaker: prince
          text: I was hunting in the forest and lost my way. If you'll take me into your service, I'd like to stay. I promise I'll serve you faithfully.
        - id: ch01-b07
          speaker: magician
          text: Very well. You may work for me. Keep the stove alight at all times, and bring its wood from the forest. You will also care for the black horse in my stable. I'll pay you one florin each day. At mealtimes, the table in the hall will be ready. Eat and drink as much as you need.
        - id: ch01-b08
          speaker: narrator
          text: The prince agreed and entered the old man's service. He promised to keep wood on the stove so the fire would never die. What he did not know was that his master was a magician. The fire was magic, and if it went out, the magician would lose much of his power.
        - id: ch01-b09
          speaker: narrator
          text: Then one day, the prince forgot his duty. The fire sank lower and lower until only a flickering flame remained. At that very moment, the old man stormed into the room.
        - id: ch01-b10
          speaker: magician
          text: How dare you let the fire fall so low? I arrived only just in time!
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: The prince hurried to throw on a log. He blew upon the ashes until they glowed again, but his master struck him hard on the ear. The magician warned him that if this happened again, he would suffer for it.
        - id: ch01-b12
          speaker: narrator
          text: Some time later, the prince sat sadly in the stable. To his astonishment, the black horse began to speak.
        - id: ch01-b13
          speaker: black_horse
          text: Come into my stall. I have something to tell you. Take my saddle and bridle from the cupboard and put them on me. Beside them is a bottle of ointment. Rub it into your hair, and your hair will shine like pure gold. Then gather all the wood you can and pile it high upon the stove.
        - id: ch01-b14
          speaker: narrator
          text: The prince obeyed. He saddled and bridled the horse, then rubbed the ointment into his hair until it gleamed like gold. He heaped so much wood onto the stove that the flames leaped up and caught the roof. Within minutes, the palace was burning like a huge bonfire.
        - id: ch01-b15
          speaker: narrator
          text: He rushed back to the stable, where the horse was waiting.
        - id: ch01-b16
          speaker: black_horse
          text: There is one more thing to do. Inside the cupboard you'll find a looking glass, a brush, and a riding whip. Bring all three. Climb onto my back, and then we must ride with all our speed. The house is burning well now.
        - id: ch01-b17
          speaker: narrator
          text: The prince took the three things and mounted. Almost before he had settled in the saddle, the black horse flew away at a gallop. Soon the forest and every part of the magician's country lay far behind them.
    - id: ch02
      title: The Three Pursuits
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Meanwhile, the magician returned and found his palace in smoking ruins. He called for his servant, but no one answered. Then he searched the stable and discovered that the black horse was gone as well. At once he guessed that servant and horse had escaped together. He mounted the roan horse from the next stall and raced after them.
        - id: ch02-b02
          speaker: narrator
          text: Far ahead, the black horse's quick ears caught the beat of pursuing hoofs.
        - id: ch02-b03
          speaker: black_horse
          text: Turn around and look. Is the old man following us?
        - id: ch02-b04
          speaker: narrator
          text: The prince twisted in his saddle. Far behind them, he saw a cloud that looked like smoke or dust.
        - id: ch02-b05
          speaker: black_horse
          text: Then we must go faster.
        - id: ch02-b06
          speaker: narrator
          text: They galloped on. After some time, the horse told the prince to look once more and see how far away the magician was.
        - id: ch02-b07
          speaker: prince
          text: He's very close now.
        - id: ch02-b08
          speaker: black_horse
          text: Throw the looking glass onto the ground.
        - id: ch02-b09
          speaker: narrator
          text: The prince flung it behind them. When the magician caught up, the roan horse planted one hoof upon the glass. Crash! The hoof broke through, and the horse stumbled and fell. Its feet were so badly cut that the magician could not continue the chase. He had to lead the injured horse slowly back to the stable and fit it with new shoes.
        - id: ch02-b10
          speaker: narrator
          text: As soon as that was done, they set out after the prince again. The magician prized the black horse too greatly to let it go. By then, the prince had traveled a long way, but the black horse's sharp ears once more heard distant hoofbeats.
        - id: ch02-b11
          speaker: black_horse
          text: Get down and place your ear against the earth. Tell me whether you hear anything.
        - id: ch02-b12
          speaker: narrator
          text: The prince dismounted and listened carefully.
        - id: ch02-b13
          speaker: prince
          text: The earth seems to be trembling. I don't think he's very far away.
        - id: ch02-b14
          speaker: black_horse
          text: Mount at once. I'll run as fast as I can.
        - id: ch02-b15
          speaker: narrator
          text: Away they went, so swiftly that the ground seemed to fly beneath the black horse's hoofs. Before long, the horse asked the prince to look back again.
        - id: ch02-b16
          speaker: prince
          text: I can see a cloud and a flame, but they're still a long way off.
        - id: ch02-b17
          speaker: black_horse
          text: We must hurry.
        - id: ch02-b18
          speaker: narrator
          text: A little later, the horse told him to look once more, for the magician must be near. The prince turned in the saddle.
        - id: ch02-b19
          speaker: prince
          text: He's right behind us! In another minute, the flame from his horse's nostrils will reach us.
        - id: ch02-b20
          speaker: black_horse
          text: Then cast the brush onto the ground.
        - id: ch02-b21
          speaker: narrator
          text: The prince threw down the brush. In an instant, it became a forest so dense that not even a bird could pass between its branches. The roan horse reached the tangled edge and stopped short. It could not take one step farther.
        - id: ch02-b22
          speaker: narrator
          text: The magician had no choice but to turn back for an axe. He returned and cut a path through the thick wood, but the work took a long time. The prince and the black horse gained a great lead.
        - id: ch02-b23
          speaker: narrator
          text: Yet once again, pursuing hoofs sounded behind them.
        - id: ch02-b24
          speaker: black_horse
          text: Look back. Is he following us again?
        - id: ch02-b25
          speaker: prince
          text: Yes. This time I can hear him clearly.
        - id: ch02-b26
          speaker: black_horse
          text: Then let us press on.
        - id: ch02-b27
          speaker: narrator
          text: They hurried forward. A little later, the horse asked whether the magician had come into sight.
        - id: ch02-b28
          speaker: prince
          text: Yes, I see the flame. He's close behind us.
        - id: ch02-b29
          speaker: black_horse
          text: Now throw down the riding whip.
        - id: ch02-b30
          speaker: narrator
          text: The prince let the whip fall. In the blink of an eye, it changed into a broad river. When the magician reached the bank, he drove the roan horse into the water. The water climbed higher and higher around them. As it rose, the magic flame that held the magician's power grew smaller and smaller. At last it went out with a fizz. The old man and the roan horse sank beneath the river and vanished.
        - id: ch02-b31
          speaker: narrator
          text: The prince looked behind him. Neither magician nor horse could be seen.
        - id: ch02-b32
          speaker: black_horse
          text: You may dismount now. There is nothing left to fear, because the magician is dead. Beside that brook, you'll find a willow wand. Pick it up and strike the ground. The earth will open, and a door will appear at your feet.
        - id: ch02-b33
          speaker: narrator
          text: The prince found the wand and struck the earth. A door appeared and opened into a great hall with a vaulted stone roof.
        - id: ch02-b34
          speaker: black_horse
          text: Lead me into the hall, and I will remain here. You must cross the fields until you find a garden with a king's palace standing in its center. Ask to enter the king's service. Goodbye, and do not forget me.
        - id: ch02-b35
          speaker: narrator
          text: Before they parted, the horse made the prince promise that no one at the palace would see his golden hair. The prince wound a scarf around his head like a turban. Then he left his faithful horse in the stone hall and set off across the fields.
    - id: ch03
      title: The Diamond Apple
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The prince crossed the fields until he came to a beautiful garden. Beyond it rose the walls and towers of a splendid palace. At the garden gate, a gardener stopped him and asked what he wanted.
        - id: ch03-b02
          speaker: prince
          text: I want to enter the king's service.
        - id: ch03-b03
          speaker: gardener
          text: You may stay here and work under me. I need someone to pull weeds and sweep dead leaves from the paths. You'll earn one florin a day, with food and drink, and you may use a horse to cart the leaves away.
        - id: ch03-b04
          speaker: narrator
          text: The prince was dressed like a poor man, so the gardener never guessed that he was a king's son. The prince accepted the offer and began his work. Whenever he was given food, he ate only half. He carried the rest to the vaulted hall beside the brook and fed the black horse. He did this every day, and the horse thanked him for being such a faithful friend.
        - id: ch03-b05
          speaker: narrator
          text: One evening, when the day's garden work was over, the prince went to the stone hall as usual. The horse had news for him.
        - id: ch03-b06
          speaker: black_horse
          text: Tomorrow, princes and great lords will come to the palace from near and far. They mean to woo the king's three daughters. All the suitors will stand in a row in the courtyard. Each princess will carry a diamond apple and toss it into the air. The man whose feet receive an apple will become that princess's husband.
        - id: ch03-b07
          speaker: black_horse
          text: Stay nearby and keep working in the garden. The youngest princess is far more beautiful than her sisters. Her apple will roll past every suitor and stop before you. Pick it up at once and put it into your pocket.
        - id: ch03-b08
          speaker: narrator
          text: The next day, the suitors filled the palace courtyard. Everything happened exactly as the black horse had foretold. The three princesses came out and threw their diamond apples. The youngest princess's apple passed every waiting lord, rolled out into the garden, and stopped at the feet of the young gardener as he swept the fallen leaves.
        - id: ch03-b09
          speaker: narrator
          text: He bent down at once, picked up the apple, and slipped it into his pocket. As he stooped, the scarf around his head shifted to one side. The youngest princess caught a glimpse of his golden hair, and from that moment she loved him.
        - id: ch03-b10
          speaker: narrator
          text: The king was deeply saddened when he learned where the youngest apple had fallen, because he loved his youngest daughter best. Still, there was no way to undo the choice. The very next day, all three princesses were married in a threefold wedding at the palace. After the celebration, the youngest princess left the palace with her husband. She returned with him to the little hut where he lived in the garden.
    - id: ch04
      title: The Unknown Warrior
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Some time later, a neighboring country made war upon the king. The king rode out to battle, and the husbands of his two elder daughters went with him on magnificent horses. The youngest daughter's husband had only the worn-out horse that helped with his garden work. The king was ashamed of this son-in-law and refused to give him a better mount.
        - id: ch04-b02
          speaker: narrator
          text: The prince was determined not to be left behind. He climbed onto the sorry old horse and started after the army. He had gone only a few yards when the animal stumbled and fell. The prince dismounted and went to the vaulted hall beside the brook.
        - id: ch04-b03
          speaker: black_horse
          text: Put my saddle and bridle on me. Then enter the next room. You'll find a suit of armor and a sword there. Dress yourself in them, and together we will ride to the battle.
        - id: ch04-b04
          speaker: narrator
          text: The prince did as the horse instructed. When he mounted, his armor flashed in the sunlight. He looked so brave and handsome that no one would have known him as the gardener who swept dead leaves from the paths.
        - id: ch04-b05
          speaker: narrator
          text: The black horse carried him swiftly to the battlefield. There they saw that the king was losing. Many of his warriors had already been killed. Then the rider on the black charger swept into the fight. His bright armor shone as he struck to the right and left with his sword. The enemy lost heart and fled in every direction. The battlefield belonged to the king.
        - id: ch04-b06
          speakers: [king, soldier_1, soldier_2, soldier_3]
          ensemble: chorus
          text: A god has come to save us!
          emotion: surprised
        - id: ch04-b07
          speaker: narrator
          text: The king and his two sons-in-law had begun the cry, and every surviving soldier joined them. They tried to crowd around their rescuer, but the black horse rose into the air and carried the prince beyond their sight.
        - id: ch04-b08
          speaker: narrator
          text: Not long afterward, part of the kingdom rebelled. Once again, the king and the husbands of his two elder daughters prepared to fight. The son-in-law who still appeared to be a gardener wanted to go with them.
        - id: ch04-b09
          speaker: prince
          text: Dear father, please let me ride beside you and fight your enemies.
        - id: ch04-b10
          speaker: king
          text: I have no use for a blockhead like you in battle, and I own no horse fit for you. There is a carter hauling hay along the road. You may take his horse.
        - id: ch04-b11
          speaker: narrator
          text: The prince took the carter's horse. It was old and tired, and after a few yards it stumbled and fell. Sadly, the prince returned to the garden. He watched the king lead the army away with the other two sons-in-law beside him.
        - id: ch04-b12
          speaker: narrator
          text: Once they were gone, he hurried to the vaulted room by the brook and asked his faithful black horse what to do. Again he put on the glittering armor. The horse carried him through the air to the battle.
        - id: ch04-b13
          speaker: narrator
          text: Again the king's enemies were driven from the field. The mysterious warrior cut through their ranks with strokes to right and left, and the whole army cried that a god had come to rescue them. When they tried to hold him there, the black horse lifted into the sky and bore him out of sight.
        - id: ch04-b14
          speaker: narrator
          text: After the king and his sons-in-law returned home, they spoke of nothing but the warrior who had saved them. Everyone wondered who he could possibly be.
        - id: ch04-b15
          speaker: narrator
          text: Soon the king of another neighboring country declared war. For the third time, the king, his sons-in-law, and his people prepared for battle. The prince begged once more to ride with them, but the king said he had no horse to spare.
        - id: ch04-b16
          speaker: king
          text: You may take the horse belonging to the woodman who brings timber from the forest. That animal is good enough for you.
        - id: ch04-b17
          speaker: narrator
          text: The prince mounted the woodman's horse, but it was so old and feeble that it could not carry him beyond the castle gates. So the prince returned yet again to the black horse in the vaulted hall.
        - id: ch04-b18
          speaker: narrator
          text: This time, the horse had prepared armor even finer than the suit from the earlier battles. The prince put it on and mounted. The black horse carried him straight to the fighting.
        - id: ch04-b19
          speaker: narrator
          text: Once more, the unknown warrior entered the enemy ranks alone and scattered them. He fought on every side until they broke and fled. But during the battle, one enemy struck the prince's leg with a sword and wounded him.
        - id: ch04-b20
          speaker: narrator
          text: The king took out his own handkerchief. His name and royal crown were embroidered upon it, and he bound it around the warrior's injured leg. The king wanted the wounded man placed in a litter and carried straight to the palace. He also meant for two knights to lead the black charger to the royal stable.
        - id: ch04-b21
          speaker: narrator
          text: But the prince caught hold of his faithful horse's mane and pulled himself into the saddle. At once, the black horse rose into the air with him.
        - id: ch04-b22
          speakers: [king, soldier_1, soldier_2, soldier_3]
          ensemble: chorus
          text: The warrior who fought for us is a god! He must be a god!
          emotion: surprised
        - id: ch04-b23
          speaker: narrator
          text: Soon the whole kingdom was speaking of nothing else. Everywhere, people asked who the hero of so many battles could be. They said no man could have done such deeds, so he must surely be a god.
        - id: ch04-b24
          speaker: king
          text: If only I could see him once more. If he proved to be a man after all, and not a god, I would give him half my kingdom as his reward.
    - id: ch05
      title: The Golden-Haired Hero
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The prince returned to the gardener's hut where he lived with his wife. He was exhausted, so he lay upon the bed and fell asleep. His wife noticed the handkerchief around his wounded leg and wondered where it had come from.
        - id: ch05-b02
          speaker: narrator
          text: She bent closer to examine it. In one corner, she saw her father's name and the royal crown embroidered in the cloth. She ran straight to the palace and told the king what she had found.
        - id: ch05-b03
          speaker: narrator
          text: The king and his two elder sons-in-law followed her back to the little house. The gardener lay sleeping on his bed. The scarf he always kept tied around his head had slipped away, and his golden hair gleamed upon the pillow.
        - id: ch05-b04
          speaker: narrator
          text: Then all of them recognized him. The poor gardener was the shining warrior who had fought and won so many battles for their kingdom.
        - id: ch05-b05
          speaker: narrator
          text: Great joy spread throughout the land. The king kept his promise and gave his youngest son-in-law half the kingdom. The prince and his wife ruled it happily together.
