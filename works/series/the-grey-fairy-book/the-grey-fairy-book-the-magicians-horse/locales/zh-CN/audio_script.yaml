audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的诙谐
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    prince:
      display_name: 小王子
      tts:
        delivery: 诚恳勇敢，遇事沉着坚定
        timbre: 清朗年轻
        pace: 适中
        pitch: 中音
    magician:
      display_name: 魔法师
      tts:
        delivery: 阴沉严厉，发怒时咄咄逼人
        timbre: 干涩苍老
        pace: 稍慢
        pitch: 低音
    black_horse:
      display_name: 黑马
      tts:
        delivery: 睿智果断，危急时简洁有力
        timbre: 醇厚沉稳
        pace: 适中
        pitch: 中低音
    gardener:
      display_name: 园丁
      tts:
        delivery: 务实直爽，待人朴实
        timbre: 厚实成熟
        pace: 适中
        pitch: 中低音
    king:
      display_name: 国王
      tts:
        delivery: 威严骄傲，感情强烈而直接
        timbre: 浑厚成熟
        pace: 稍慢
        pitch: 低音
    soldier_1:
      display_name: 第一名士兵
      tts:
        delivery: 激动敬畏，呼喊有力
        timbre: 强健清晰
        pace: 适中
        pitch: 中音
    soldier_2:
      display_name: 第二名士兵
      tts:
        delivery: 激动敬畏，呼喊有力
        timbre: 粗犷明亮
        pace: 适中
        pitch: 中低音
    soldier_3:
      display_name: 第三名士兵
      tts:
        delivery: 激动敬畏，呼喊有力
        timbre: 清亮年轻
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 森林里的宫殿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有位国王养育着三个儿子。一天，三位王子去远方的大森林打猎，小王子却在树木间迷了路。两个哥哥找不到他，只好先回王宫。
        - id: ch01-b02
          speaker: narrator
          text: >-
            小王子独自在森林里走了整整四天。他从一片林间空地走到另一片，夜里睡在星空下的苔藓上，白天只能靠草根和野果充饥。第五天清晨，他终于来到森林中央的一片开阔地，看见那里矗立着一座宏伟的宫殿。可无论宫里还是宫外，连一个人影也没有。大门敞开着，他便走了进去。
        - id: ch01-b03
          speaker: narrator
          text: >-
            王子从一个空荡荡的房间走到另一个，始终没见到一个活人。最后，他来到一座宽阔的大厅。厅中央有张桌子，上面摆满精美的菜肴和上好的葡萄酒。他又饿又渴，便坐下来尽情吃喝。等他终于满足，整张桌子忽然从眼前消失了。王子觉得这件事实在古怪，又把楼上楼下每个房间找了一遍，还是无人可以问话。天快黑时，远处终于响起脚步声，一个老人正沿着楼梯朝他走来。
        - id: ch01-b04
          speaker: magician
          text: >-
            你为什么在我的城堡里到处乱走？
        - id: ch01-b05
          speaker: prince
          text: >-
            我进森林打猎，不小心迷了路。您若愿意收留我，我想留下来做事，也一定会忠心服侍您。
        - id: ch01-b06
          speaker: magician
          text: >-
            那就留下吧。炉火一刻也不能灭，木柴由你去森林里取。马厩里的黑马也归你照管。我每天给你一个弗罗林。到吃饭的时候，大厅里自会摆好酒菜，你想吃多少都可以。
        - id: ch01-b07
          speaker: narrator
          text: >-
            王子对这份差事很满意，答应让炉上永远有木柴，绝不许火熄灭。他还不知道，老人其实是个魔法师。炉中燃烧的也是魔火，只要火一灭，魔法师的大半法力就会随之消失。偏偏有一天，王子忘了添柴，火苗越来越弱，几乎就要完全熄灭。正在这时，魔法师怒气冲冲地闯进屋里。
        - id: ch01-b08
          speaker: magician
          text: >-
            你竟敢让炉火烧成这样！我差一点就来晚了！
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: >-
            王子赶紧把一根木柴扔进炉中，又伏下身吹动灰烬，直到火星重新亮起来。魔法师仍狠狠扇了他一记耳光，还警告他，若有下次，一定叫他吃不了兜着走。后来有一天，王子闷闷不乐地坐在马厩里。令他吃惊的是，那匹黑马竟然开口说起了人话。
        - id: ch01-b10
          speaker: black_horse
          text: >-
            到我的马栏来，我有事告诉你。取出柜里的缰绳和马鞍，替我套好。旁边那瓶油膏能让你的头发亮得像纯金。抹好以后，把所有能找到的木柴都堆上炉子，堆得越高越好。
        - id: ch01-b11
          speaker: narrator
          text: >-
            王子一一照办。他替黑马安好马鞍和缰绳，又把油膏仔细抹在自己的头发上，直到每一缕头发都像金子般闪亮。接着，他把木柴堆得高高的。火焰越蹿越高，很快便点燃了屋顶。没过几分钟，整座宫殿就像一堆巨大的篝火，熊熊燃烧。王子赶忙跑回马厩，黑马还让他从柜里带上一面镜子、一把刷子和一根马鞭。
        - id: ch01-b12
          speaker: black_horse
          text: >-
            三样东西都拿好，快骑上来。屋子已经烧旺了，我们得用最快的速度离开这里。
        - id: ch01-b13
          speaker: narrator
          text: >-
            王子取出三样东西，翻身上马。他甚至还没来得及坐稳，黑马就飞奔出去，速度快得惊人。没过多久，那座森林和属于魔法师的整个国土都远远落在他们身后。
    - id: ch02
      title: 三次追赶
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            魔法师回到宫殿，只见那里成了一片仍冒着余烟的废墟。他一遍遍呼唤仆人，却始终没有人回答。最后，他来到马厩，发现黑马也不见了，立刻猜到仆人和马是一起逃走的。于是，他跨上隔壁马栏里的栗色马，拼命追赶。
        - id: ch02-b02
          speaker: black_horse
          text: >-
            我听见后面有马蹄声。回头看看，那个老人是不是追来了？
        - id: ch02-b03
          speaker: narrator
          text: >-
            王子在马鞍上转过身，远方正腾起一团烟雾似的尘云。黑马一见，便说他们必须加快速度。两人又飞驰了好一阵，它才请王子再次回头，看看追兵是否还离得很远。
        - id: ch02-b04
          speaker: prince
          text: >-
            他已经追得很近了。
        - id: ch02-b05
          speaker: black_horse
          text: >-
            把镜子扔到地上。
        - id: ch02-b06
          speaker: narrator
          text: >-
            王子把镜子抛在身后。栗色马追到那里，一脚踩在镜面上。只听“咔嚓”一声，马蹄穿透玻璃，整匹马也绊倒了。它的脚被割得很重，再也无法疾驰。魔法师毫无办法，只能牵着它慢慢返回马厩，给它的蹄子重新钉上铁掌。可他把黑马看得太珍贵了，决不肯就此罢休。一切处理妥当后，他立刻重新出发追赶。
        - id: ch02-b07
          speaker: black_horse
          text: >-
            下马，把耳朵贴到地面，听听有没有动静。
        - id: ch02-b08
          speaker: prince
          text: >-
            大地好像在颤动。他一定离我们不远。
        - id: ch02-b09
          speaker: black_horse
          text: >-
            马上骑上来，我要全力飞奔。
        - id: ch02-b10
          speaker: narrator
          text: >-
            王子刚坐好，黑马就拼尽全力疾驰而去，快得仿佛大地正从马蹄下向后飞走。过了一会儿，黑马请他回头看看。王子只见远处有一团云和一道火光，便说追兵还隔得很远。黑马却知道不能松懈，只叫他赶快。又过了片刻，它让王子再看一次，因为魔法师一定已经迫近。
        - id: ch02-b11
          speaker: prince
          text: >-
            他就在后面！那匹马鼻孔里喷出的火，眼看就要烧到我们了！
          emotion: fearful
        - id: ch02-b12
          speaker: black_horse
          text: >-
            快把刷子扔下去。
        - id: ch02-b13
          speaker: narrator
          text: >-
            王子把刷子扔了下去。刷子一落地，立刻变成一片密不透风的森林。树枝和藤蔓紧紧纠缠，连一只鸟也无法从中穿过。栗色马猛地停在林前，再也迈不出一步。魔法师只好沿原路返回，取来一把斧头，再亲手砍出一条通道。那片森林实在太密，他花了很长时间才穿过去。王子和黑马也趁着这段时间远远跑到了前面。
        - id: ch02-b14
          speaker: narrator
          text: >-
            可没过多久，他们第三次听见了追赶的蹄声。黑马请王子回头察看，他立刻听出声音比前两次更清楚。两人继续赶路，黑马过了一会儿又叫他回头。王子转身一看，火光已经近在身后。
        - id: ch02-b15
          speaker: black_horse
          text: >-
            把马鞭扔下去。
        - id: ch02-b16
          speaker: narrator
          text: >-
            王子把马鞭抛到地上，它眨眼间变成一条宽阔的大河。魔法师赶到岸边，硬催着栗色马走进水中。河水在他们身边越涨越高，赋予魔法师全部法力的火焰却越来越小，最后“嗞”的一声彻底熄灭。老人和栗色马一同沉入河底，再也没有出现。王子回头望去，后面已经空无一物。
        - id: ch02-b17
          speaker: black_horse
          text: >-
            可以下马了。魔法师已经死去，再没有危险。小溪旁有根柳条，把它拾起来抽一下地面。大地会打开一扇门。
        - id: ch02-b18
          speaker: narrator
          text: >-
            王子在溪边找到柳条，朝地上一抽，脚边果然出现一扇门。那扇门自行打开，下面露出一座宽阔的拱顶石厅。
    - id: ch03
      title: 钻石苹果
      blocks:
        - id: ch03-b01
          speaker: black_horse
          text: >-
            把我牵进石厅，我会住在这里。你穿过田野，会找到一座花园，里面有国王的宫殿。去请求为国王做事吧。再见，千万别忘了我。
        - id: ch03-b02
          speaker: narrator
          text: >-
            王子把黑马牵进石厅，两位忠实的伙伴就此分别。离开以前，黑马还让王子答应，绝不叫宫里的人看见他的金发。王子用围巾把头发裹成头巾的模样，独自穿过田野，来到一座美丽的花园。越过花园望去，一座宏伟宫殿的高墙和塔楼正耸立在前方。守在门口的园丁拦住王子，问他来这里做什么。
        - id: ch03-b03
          speaker: prince
          text: >-
            我想为国王效力。
        - id: ch03-b04
          speaker: gardener
          text: >-
            那就留在花园里替我干活吧。你负责除草，再扫掉路上的枯叶。每天能拿一个弗罗林，我还给你一匹运树叶的马，吃喝也由这里供应。
        - id: ch03-b05
          speaker: narrator
          text: >-
            园丁见他穿得像个穷人，完全没有想到他会是一位王子。小王子从此留在花园，认真除草、清扫落叶。每当有人送来饭菜，他都只吃一半，再把剩下的一半带到溪边的拱顶石厅，交给黑马。日复一日，从未间断。黑马也很感激这位始终没有忘记自己的朋友。
        - id: ch03-b06
          speaker: black_horse
          text: >-
            明天会有许多王子和显贵前来，向国王的三个女儿求婚。他们会在庭院里排成一行。三位公主各自把一只钻石苹果抛向空中，苹果落到谁的脚边，谁就做她的新郎。你照常在附近扫地。小公主最美丽，她的苹果会越过所有求婚者，滚到你面前。立刻捡起来，放进口袋。
        - id: ch03-b07
          speaker: narrator
          text: >-
            第二天，远近各处的求婚者果然在城堡庭院里聚齐了。三位公主走出来，把手里的钻石苹果抛向空中。小公主的苹果越过满院的求婚者，一直滚进花园，停在年轻园丁脚边。当时，他正忙着清扫落叶。王子立即俯身捡起苹果，放进口袋。就在这一瞬，围巾滑向一侧，露出了闪亮的金发。小公主看见以后，从那一刻起便爱上了他。
        - id: ch03-b08
          speaker: narrator
          text: >-
            国王最疼爱小女儿，想到她要嫁给一个贫穷的园丁，心中十分难过，可这件事已经无法改变。第二天，宫中为三位公主一同举行了婚礼。婚礼结束，小公主没有留在王宫，而是跟着丈夫住进了花园里的小屋。
    - id: ch04
      title: 神秘的黑甲武士
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            过了一段日子，邻国的人向国王开战。国王带着两个大女婿出征，他们骑的都是高大骏马。小女婿只有一匹在花园里拉车的衰老跛马。国王嫌这个女婿丢脸，不肯给他更好的坐骑。
        - id: ch04-b02
          speaker: narrator
          text: >-
            王子不愿留在后方，骑上老马追了出去。可它才走几码便摔倒了。他只好来到溪边的拱顶石厅，向黑马求助。
        - id: ch04-b03
          speaker: black_horse
          text: >-
            替我装好马鞍和缰绳。隔壁房间有铠甲和宝剑，穿戴起来，我们一起去战场。
        - id: ch04-b04
          speaker: narrator
          text: >-
            王子依言披上铠甲，跨上黑马。阳光在甲片上闪耀，他显得英武又俊美，再没有人能把他和那个扫落叶的园丁认作同一个人。黑马载着他飞快赶到战场。他们发现国王已经落在下风，许多将士都战死了。王子骑着黑色骏马冲进敌阵，挥剑向左右奋力劈砍。敌人一见这名闪亮的武士，顿时惊慌失措，朝四面八方逃散，把整片战场留给了国王。
        - id: ch04-b05
          speakers: [soldier_1, soldier_2, soldier_3]
          ensemble: chorus
          text: >-
            一位神来搭救我们了！
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: >-
            国王和两个大女婿看见救命恩人，立刻欢呼起来。幸存的将士也跟着齐声呐喊。众人纷纷靠近，想把这位神秘武士围在中央。黑马却在他们赶到以前腾空而起，载着王子飞出所有人的视线。
        - id: ch04-b07
          speaker: narrator
          text: >-
            不久，国内一部分地区发生叛乱，国王和两个女婿又要出征。王子也去请求国王。
        - id: ch04-b08
          speaker: prince
          text: >-
            亲爱的父王，请让我骑马跟您一起迎战敌人。
        - id: ch04-b09
          speaker: king
          text: >-
            我不需要你这样的傻瓜替我打仗，也没有合适的马给你。路上那个车夫正在运干草，你骑他的马好了。
        - id: ch04-b10
          speaker: narrator
          text: >-
            王子骑上车夫的马，可那匹可怜的牲口又老又累，走出几码便失蹄倒地。王子只得难过地回到花园，看着国王率领军队远去，两个大女婿骑马跟随在旁。等所有人消失在视线中，他便来到溪边石厅，找忠实的黑马商量。随后，他重新披上闪亮的铠甲。黑马载着他飞过天空，直抵战场。王子又一次冲进敌军，挥剑左右劈杀，把国王的敌人全部击溃。
        - id: ch04-b11
          speakers: [soldier_1, soldier_2, soldier_3]
          ensemble: chorus
          text: >-
            一位神来搭救我们了！
          emotion: surprised
        - id: ch04-b12
          speaker: narrator
          text: >-
            众人想留下他，黑马却又飞上天空。国王和两个女婿回家以后，谈来谈去都是那位英雄，却没有人猜得出他的身份。
    - id: ch05
      title: 金发英雄
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            没过多久，另一位邻国国王向他们宣战。国王、两个女婿和全国臣民只得第三次准备战斗。王子也再次请求同行，国王仍说没有多余的马可以给他，随后又补了一句。
        - id: ch05-b02
          speaker: king
          text: >-
            你可以骑那匹替樵夫从森林运柴的马，那样的坐骑已经足够配你了。
        - id: ch05-b03
          speaker: narrator
          text: >-
            那匹马又老又不中用，连城堡大门都没能驮着王子走出去。王子只好再次来到拱顶石厅。黑马已经为他备好一副新铠甲，比前两次穿过的还要华美。王子披挂整齐，跨上马背，黑马便径直载他飞向战场。他又一次冲散国王的敌军，独自一人在敌阵中挥剑奋战，逼得敌人向四面八方逃窜。就在混战中，一名敌兵挥剑砍伤了王子的腿。
        - id: ch05-b04
          speaker: narrator
          text: >-
            国王取出自己的手帕，上面绣着他的姓名和王冠。他亲手把手帕裹在王子的伤腿上，又想让人把英雄放上担架，直接抬回宫殿，再命两名骑士将黑马牵进王家马厩。王子却不肯留下。他伸手抓住忠实黑马的鬃毛，忍着伤，费力把自己拉回马鞍。黑马随即载着他升上天空。
        - id: ch05-b05
          speakers: [soldier_1, soldier_2, soldier_3]
          ensemble: chorus
          text: >-
            为我们作战的武士一定是位神！
          emotion: surprised
        - id: ch05-b06
          speaker: narrator
          text: >-
            这件事传遍全国。人人都在追问，一次次拯救他们的英雄究竟是谁。大家都说，他不可能是凡人，只能是神。
        - id: ch05-b07
          speaker: king
          text: >-
            要是能再见他一次就好了。只要他是凡人，不是神，我愿意把半个王国赐给他。
        - id: ch05-b08
          speaker: narrator
          text: >-
            王子终于回到自己和妻子居住的花园小屋。他已经疲惫不堪，躺到床上便沉沉睡去。妻子发现他受伤的腿上裹着一方手帕，不明白那是从哪里来的。她凑近细看，认出手帕一角绣着父王的名字和王冠，立刻跑到宫殿，把这件事告诉父亲。国王和两个大女婿跟着她赶回小屋，看见那个园丁仍在床上熟睡。
        - id: ch05-b09
          speaker: narrator
          text: >-
            王子头上的围巾已经滑落，金发在枕上闪闪发亮。所有人终于认出，这个被他们轻视的园丁，就是一次次替他们作战、赢得胜利的英雄。
        - id: ch05-b10
          speaker: narrator
          text: >-
            全国上下欢欣鼓舞。国王依照诺言，把半个王国赐给女婿。从此以后，王子和妻子幸福地统治着那片土地。
