  chapters:
    - id: ch01
      title: Dindonette and the Enchanted Spring
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time there was a fairy named Dindonette. No creature in the world had a kinder heart, but Dindonette had very little sense. She was forever trying to help people, and her good deeds usually ended by bringing pain and trouble to everyone involved. The people who knew this best lived on a beautiful island far out in the middle of the sea. By the laws of fairyland, Dindonette had taken that island under her special protection. Since it was already the most beautiful island in the world, she thought day and night about how to make it the happiest one too.
        - id: ch01-b02
          speaker: narrator
          text: Dindonette passed unseen from house to house, listening to the people inside. Everywhere she went, she heard children longing for the day when they would be grown up. They imagined that adults could do anything they liked. In those same houses, old people talked sadly about years gone by and wished they could be young again. Dindonette felt sorry for them all and wondered whether there was some way to grant both wishes. Then, one night, an answer came to her.
        - id: ch01-b03
          speaker: dindonette
          text: Oh, of course! This sort of thing has been tried before, but I will manage it better. Those old Fountains of Youth only made people young again. I can do more than that. I will enchant the spring that bubbles up in the middle of the orchard. Any child who drinks from it will become a grown man or woman at once, and every old person who drinks will return to the days of childhood.
        - id: ch01-b04
          speaker: narrator
          text: She never paused to consult even one other fairy, though another fairy might have given her good advice. She rushed straight to the fountain and cast her spell. It was the island's only spring of fresh water, so at dawn people of every age crowded around its source to drink. Delighted by the happiness she expected to bring them, Dindonette hid behind a thicket of roses. Whenever she heard footsteps, she peeped out to watch.
        - id: ch01-b05
          speaker: narrator
          text: The magic worked before her eyes. Children grew to an adult's height and strength, while old men and women turned into tiny, helpless babies. Dindonette was delighted. She came out of hiding, told everyone what she had done, and happily received their thanks.
        - id: ch01-b06
          speaker: narrator
          text: At first, everyone was overjoyed to have their wishes granted. Soon, though, that joy gave way to fear as they saw how quickly the magic water worked. It was wonderful to reach the height of strength and beauty, but naturally they wanted to remain there. In her hurry, Dindonette had forgotten to make the change stop. No sooner had the children become adults and the men and women become babies than every one of them began racing onward toward old age. The change was terrifyingly fast. By the time Dindonette understood her mistake, it was too late to put it right.
        - id: ch01-b07
          speaker: narrator
          text: The islanders tried everything they could think of. They dug wells so they would never need the spring again, but the sandy ground held no water and the rainy season had passed. They collected dew and pressed juice from fruits and herbs, but it supplied almost none of what they needed. Some threw themselves into the sea, hoping the current would carry them to another shore, for they had no boats. A few ended their lives where they stood. Everyone else gave themselves up to their fate.
        - id: ch01-b08
          speaker: narrator
          text: Perhaps the worst part was that each change came too quickly for anyone to prepare. Suppose a man stood before the island's assembly to give advice about peace or war. It might not have mattered so much if he had looked like a baby but kept the knowledge and good sense of a grown man. Instead, the moment he took on an infant's body, he also became helpless and foolish. There was no one left who could train him to know better. Before a month had passed, every person on the island was dead. Dindonette left forever, ashamed and heartbroken by what her foolish kindness had done.
    - id: ch02
      title: The Children Drink from the Fountain
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Many centuries later, another fairy named Selnozoura fell into poor health. Her doctors ordered her to travel around the whole world twice every week for a change of air. Selnozoura never made these journeys alone. She always took two children whom she loved dearly. Cornichon was a boy of fourteen, bought at a slave market when he was small. Toupette was only a few months younger. Her guardian, the genius Kristopo, had entrusted her to Selnozoura's care. The fairy intended Cornichon and Toupette to become husband and wife as soon as they were old enough.
        - id: ch02-b02
          speaker: narrator
          text: Meanwhile, they crossed the sky together in a little vessel. It flew exactly one thousand nine hundred and fifty times faster than the swiftest of our ships. On one journey, the beauty of Fountain Island caught Selnozoura's eye. She ran the vessel aground and left it in the care of the dragon that lived in the hold whenever they traveled. Then she stepped ashore with Cornichon and Toupette.
        - id: ch02-b03
          speaker: narrator
          text: They found a large town, but every street and every house stood completely empty. The sight astonished Selnozoura, and she began using her magic to discover what had happened there. While she was busy with her spell, Cornichon and Toupette wandered off by themselves. After a while, they came to the fountain. On such a hot day, its bubbling water looked cool and delicious. Each child had just taken a deep drink when Selnozoura, who had now learned everything she wanted to know, hurried toward them.
        - id: ch02-b04
          speaker: selnozoura
          text: Stop! Don't drink that deadly poison, or you will be ruined forever!
          emotion: fearful
        - id: ch02-b05
          speaker: toupette
          text: Poison? It is the freshest water I have ever tasted. Cornichon will tell you the same thing.
          emotion: surprised
        - id: ch02-b06
          speaker: selnozoura
          text: My poor children, I am too late! Why did you leave me? Listen, and I will tell you what happened to the miserable people of this island, and what will happen to you.
          emotion: sad
        - id: ch02-b07
          speaker: narrator
          text: When Selnozoura had told them Dindonette's whole story, she explained what little she could do.
        - id: ch02-b08
          speaker: selnozoura
          text: Fairy power is great, but one fairy cannot undo another fairy's work. Soon you will sink into the weakness and confusion of extreme old age. I can only make the change easier and protect you from dying without anyone to care for you. The spell has already begun. Cornichon is taller and more manly than he was an hour ago, and Toupette no longer looks like a little girl.
          emotion: sad
        - id: ch02-b09
          speaker: narrator
          text: It was true, though the young people were not nearly as unhappy about it as Selnozoura was.
        - id: ch02-b10
          speaker: cornichon
          text: Please don't pity us. If we must grow old so quickly, then let us marry without delay. If our old age must come early, why shouldn't our happiness come early too?
        - id: ch02-b11
          speaker: narrator
          text: Selnozoura saw the sense in his words. One look at Toupette showed that she agreed.
        - id: ch02-b12
          speaker: selnozoura
          text: Then you shall marry, but not in this dreadful place. We will return to Bagota at once, and your wedding celebrations will be more splendid than any ever seen.
        - id: ch02-b13
          speaker: narrator
          text: They all returned to the vessel. In only a few hours, it crossed the four thousand five hundred miles between Fountain Island and Bagota. Everyone at court was amazed by the change such a short absence had made in the young people. Selnozoura had made them promise complete silence about their adventure, so no one learned the reason. The courtiers stopped asking questions and busied themselves with preparations. They chose and prepared their finest clothes for the marriage, which was fixed for the following night.
    - id: ch03
      title: The Abduction and the Threat of War
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Early the next morning, Kristopo came to court on one of the visits he made to his ward from time to time. Like everyone else, he was amazed by the sudden improvement he saw in the child. He had always been fond of Toupette, but in a single moment he fell violently in love with her. He hurried to demand a private audience with Selnozoura and offered himself as Toupette's husband. He never doubted that the fairy would consent to such a brilliant match.
        - id: ch03-b02
          speaker: narrator
          text: Selnozoura refused even to consider his proposal. She went so far as to hint that Kristopo would do better, for his own sake, to turn his thoughts toward someone else. He pretended to accept her answer. Instead, he went straight to Toupette's room. At the very moment Cornichon was waiting below for his bride, Kristopo seized her and flew away with her through the window.
        - id: ch03-b03
          speaker: narrator
          text: When Selnozoura learned what he had done, she was furious. She sent one messenger after another to his palace at Ratibouf. Each carried the same command. He must return Toupette immediately, or face war.
        - id: ch03-b04
          speaker: narrator
          text: Kristopo never answered directly. He kept Toupette under close guard in a tower, where she used every argument she could to delay their marriage. Her pleas would have failed, but within a few days grief and the fountain's spell changed her so greatly that even Kristopo was alarmed. He said she needed amusement and fresh air. Since his company distressed her, she could go where she pleased. Only one freedom was forbidden. He would not let her return to Bagota.
        - id: ch03-b05
          speaker: narrator
          text: Meanwhile, both sides were busy gathering armies. Kristopo gave command of his forces to a famous general, while Selnozoura placed Cornichon at the head of hers. Before either side actually declared war, Toupette's parents arrived at Ratibouf at Kristopo's summons. They had not seen their daughter since they parted from her as a baby. From time to time, however, travelers returning from Bagota had told them how beautiful she was. Imagine their amazement when they found no lovely young girl. In her place stood a middle-aged woman, still handsome but badly faded, who looked older than her own parents.
        - id: ch03-b06
          speaker: narrator
          text: Kristopo was almost as astonished. He decided that a courtier must have hidden Toupette and put this older woman in her place. In a rage, he called every servant and guard in the town before him and demanded to know who had dared to trick him and where the prisoner had gone.
        - id: ch03-b07
          speaker: narrator
          text: The servants and guards answered that Toupette had never left her rooms without a veil over her face. Even when she walked in the gardens around the tower, she remained covered. Her meals were carried into her rooms and placed on her table, and because she preferred to eat alone, none of them had ever seen her face or known what she looked like. Their account was clearly true, and Kristopo had to believe them. If they had not played the trick, he decided, then it must be Selnozoura's work. In his anger, he ordered his army to be ready to march.
        - id: ch03-b08
          speaker: narrator
          text: Selnozoura knew the real cause, but she was deeply insulted when she heard that Kristopo blamed her for such a cruel trick. At first she wanted to attack him immediately. With great difficulty, her ministers persuaded her to wait and send an ambassador instead.
        - id: ch03-b09
          speaker: narrator
          text: Prince Zeprady set out for Ratibouf. On his way, he met Cornichon camped with his army outside Bagota's gates. Zeprady showed him Selnozoura's written order that peace must be kept for now. Cornichon longed to see Toupette again, and begged to join the prince's mission.
        - id: ch03-b10
          speaker: narrator
          text: By then, the passion that had caused so much trouble had left Kristopo. He readily accepted Zeprady's terms for peace, though he still accused Selnozoura of changing Toupette. Zeprady replied that he had brought the one witness best able to prove whether the woman was truly Toupette. He asked for Cornichon to be brought in.
    - id: ch04
      title: The Lovers Meet Again
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Toupette's heart leaped for joy when she heard that she would see her old love again. Then she remembered everything that had happened to her. Cornichon must have been changing under the spell just as she had. Their meeting could not be entirely happy, especially for Toupette, who could not forget the beauty she had lost. Kristopo stayed to watch them meet. At last he was convinced that this really was Toupette and that no one had deceived him. He left the lovers alone and went out with his attendants to sign the peace treaty.
        - id: ch04-b02
          speaker: cornichon
          text: Oh, Toupette, my dear Toupette! We are together again. Let us put all our past troubles behind us.
          emotion: happy
        - id: ch04-b03
          speaker: toupette
          text: Past troubles? What about the beauty we have lost and the terrible future ahead? You look fifty years older than when I last saw you, and I know fate has done no better by me.
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: Cornichon took her hand and tried to comfort her.
        - id: ch04-b05
          speaker: cornichon
          text: Please don't say that. You have changed, but every age has its own grace. Surely no woman of sixty was ever more handsome. Bright young eyes would look strange beside faded skin. The lines on your forehead balance the fullness of your cheeks, and even your withered throat has elegance. The way your features remain in harmony as they grow old proves how beautiful they once were.
        - id: ch04-b06
          speaker: toupette
          text: You monster! Is that the best comfort you can give me?
          emotion: sad
        - id: ch04-b07
          speaker: cornichon
          text: But you always said beauty did not matter as long as you had my heart.
        - id: ch04-b08
          speaker: toupette
          text: I know I did. But how can you keep loving someone as old and plain as I am?
          emotion: sad
        - id: ch04-b09
          speaker: cornichon
          text: Toupette, that is nonsense. My heart belongs to you as completely as ever, and nothing in the world can change it.
        - id: ch04-b10
          speaker: narrator
          text: Prince Zeprady came in with news. Kristopo regretted his conduct and gave Cornichon permission to leave for Bagota whenever he wished, taking Toupette with him. The genius asked them to excuse him for not saying farewell in person, but hoped to visit them in Bagota before long.
        - id: ch04-b11
          speaker: narrator
          text: Neither lover slept that night. Cornichon stayed awake for joy because he was going home. Toupette stayed awake in dread of what would happen to her pride when everyone at Bagota saw her. During the journey, Cornichon tried to comfort her with the same reasons he had given before, but it was hopeless. She only grew more miserable. As soon as they reached the palace, she went straight to her old apartments. She begged Selnozoura to let both her and Cornichon remain hidden there and see no one.
        - id: ch04-b12
          speaker: narrator
          text: For some time after their return, Selnozoura was busy preparing the celebrations that would mark the peace. She was also receiving Kristopo, who meant to do everything he could to win back the friendship he had lost. Cornichon and Toupette were therefore left entirely to themselves. That was exactly what they had asked for, yet before long even they began to feel a little neglected.
        - id: ch04-b13
          speaker: narrator
          text: At last, one morning, they looked from the windows and saw Selnozoura and Kristopo approaching in state with all the courtiers following behind. Toupette immediately hid herself in the darkest corner of the room. Cornichon forgot that he no longer had the body of a fourteen-year-old boy and ran forward to meet them. His old legs failed him. He tripped, fell hard, and badly bruised one eye.
        - id: ch04-b14
          speaker: narrator
          text: Toupette hurried toward her helpless lover, but her weak legs collapsed. She fell almost on top of him and knocked three loose teeth against his forehead. Selnozoura entered at that moment and burst into tears. Then she listened silently as Kristopo suggested that, in time, everything might be repaired.
    - id: ch05
      title: Half a Remedy
      blocks:
        - id: ch05-b01
          speaker: kristopo
          text: At the last assembly of the fairies, the deeds of every fairy were examined and discussed. Someone proposed that we lessen as much as possible the harm Dindonette caused when she enchanted the fountain. Because she had meant nothing but kindness, the assembly decided that she should be allowed to undo one half of her spell. Of course, she always had the power to destroy the fatal fountain, and that would have been best of all. But she never thought of it. Even so, her heart is so good that I am sure she will fly here the moment she hears that we need her. Before she arrives, Madam, you must decide which of these two will regain youth, strength, and beauty.
        - id: ch05-b02
          speaker: narrator
          text: At those words, Selnozoura's heart sank. Cornichon and Toupette were equally dear to her. How could she favor one when saving that one would condemn the other? The courtiers had no such difficulty. None of the men could understand why she hesitated for even a moment to choose Toupette. Every lady at court was just as firmly convinced that Cornichon should receive youth and strength instead.
        - id: ch05-b03
          speaker: narrator
          text: Selnozoura could not decide, but Cornichon and Toupette had no such hesitation.
        - id: ch05-b04
          speaker: cornichon
          text: My love, now I can give you the finest proof of my devotion. I will show that I value the beauty of your mind more than the beauty of your body. The loveliest women at court may fall helplessly before my youth and strength, but I will bring them all to your feet and offer my deepest respect to your age and wrinkles.
        - id: ch05-b05
          speaker: toupette
          text: Not so quickly! Why should you have everything? Why do you keep humiliating me? I trust Selnozoura to be fair. She will never treat me that way.
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: Toupette went into her own rooms and would not come out, though Cornichon begged her to let him explain. During the next few days, no one at court spoke or thought of anything else. Everyone expected Dindonette to arrive and settle the matter in an instant.
        - id: ch05-b07
          speaker: narrator
          text: Unfortunately, Dindonette had no idea what would be best. Whenever someone spoke to her, she adopted that person's opinion. Then another person spoke, and she changed her mind again. At last, a thought came to her that seemed like the only way to satisfy both sides. Certain that she had solved the problem, she asked Selnozoura to call together the entire court and all the people so they could hear her decision.
        - id: ch05-b08
          speaker: dindonette
          text: A person who repairs the harm they caused is fortunate. A person who never caused harm is more fortunate still.
        - id: ch05-b09
          speaker: narrator
          text: No one disagreed, so Dindonette continued.
        - id: ch05-b10
          speaker: dindonette
          text: I am allowed to undo only half the harm I caused. Cornichon, I could restore your youth. Toupette, I could restore your beauty. I will do both, and I will do neither.
        - id: ch05-b11
          speaker: narrator
          text: A curious murmur passed through the crowd. Cornichon and Toupette trembled with astonishment.
        - id: ch05-b12
          speaker: dindonette
          text: I could never be so cruel as to let one of you decay while the other enjoys glorious youth. Since I cannot restore you both completely, I will make half of each body young again and let the other half keep aging. You may choose the halves yourselves. Shall I draw a line around each waist, or straight down the middle of each body?
        - id: ch05-b13
          speaker: narrator
          text: Dindonette looked around proudly, expecting applause for her clever answer. Cornichon and Toupette shook with rage and disappointment. Everyone else burst out laughing. Pitying the unhappy lovers, Selnozoura stepped forward.
        - id: ch05-b14
          speaker: selnozoura
          text: Instead of dividing their bodies, why not let them take turns enjoying their former youth and beauty for a fixed length of time? Surely you can arrange that.
        - id: ch05-b15
          speaker: dindonette
          text: What an excellent idea! Yes, of course that is best. Which one shall I touch first?
          emotion: happy
        - id: ch05-b16
          speaker: cornichon
          text: Touch Toupette. I know her heart too well to fear that youth will change it.
    - id: ch06
      title: The Last of the Spell
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Dindonette leaned forward and touched Toupette with her magic ring. In a single instant, the old woman became a girl again. The whole court wept for joy at the sight. Cornichon was so astonished that he had fallen to the floor. Toupette ran to him and promised that she would pay him long visits. She would tell him all about the balls she attended and all the water parties she enjoyed while it was her turn to be young.
        - id: ch06-b02
          speaker: narrator
          text: The two fairies went to their apartments, and Kristopo followed to say farewell. In the middle of his speech, Dindonette suddenly cried out.
        - id: ch06-b03
          speaker: dindonette
          text: Oh, dear! I forgot to say when Cornichon would have his turn to become young. How foolish of me! It may be too late now, because I should have set the time before I touched Toupette with the ring. Oh, dear, why did no one warn me?
          emotion: surprised
        - id: ch06-b04
          speaker: selnozoura
          text: You acted too quickly. Now we can only wait until Cornichon reaches the very end of old age. Then he will drink the water and become a baby again, and Toupette will spend her life as his nurse, his wife, and his caretaker.
        - id: ch06-b05
          speaker: narrator
          text: For so long, Toupette had suffered from worry in her mind and weakness in her body. Now that she was young again, it seemed she could never have enough amusement. She rarely found time to visit poor Cornichon, despite all her promises. She never stopped being fond of him, and she was still kind whenever they were together. Yet she was perfectly happy without him. Poor Cornichon could see that clearly, though age had left him almost blind and deaf.
        - id: ch06-b06
          speaker: narrator
          text: In the end, it was Kristopo who found a way to undo Dindonette's work and give Cornichon back the youth he had lost. The genius was all the more eager to help because he had discovered, quite by accident, that Cornichon was really his own son. Kristopo attended the great yearly meeting of the fairies and presented his case before them. In return for all the services he had performed for so many members of the assembly, he begged them to grant him this single favor.
        - id: ch06-b07
          speaker: narrator
          text: No request like it had ever been heard in fairyland. Some of the older fairies objected and murmured their disapproval. Yet both Kristopo and Selnozoura were held in such high honor that the assembly set those protests aside. The fairies declared that the latest victim of the enchanted fountain was free from its spell. In return, Kristopo asked for nothing except the right to accompany Selnozoura back to Bagota and be present when his son took on his proper form again.
        - id: ch06-b08
          speaker: narrator
          text: They decided to tell Toupette only that they had found a husband for her. Her wedding was fixed for the following night, and they meant the bridegroom's identity to be a pleasant surprise. Toupette received the news with astonishment. She felt many pangs when she imagined the grief Cornichon would surely feel when another man took his place. Still, she never dreamed of disobeying Selnozoura. She spent the entire day wondering who the mysterious bridegroom could be.
        - id: ch06-b09
          speaker: narrator
          text: At the appointed hour, a great crowd filled the fairy's palace, which was decorated with the sweetest flowers known only in fairyland. Toupette took her place, but no bridegroom appeared.
        - id: ch06-b10
          speaker: selnozoura
          text: Bring Cornichon here.
        - id: ch06-b11
          speaker: toupette
          text: Oh, Madam, please spare him this bitter pain. Let him stay hidden and at peace.
          emotion: sad
        - id: ch06-b12
          speaker: selnozoura
          text: He must be here, and he will not regret coming.
        - id: ch06-b13
          speaker: narrator
          text: Cornichon was led into the room. At the sight of the bright crowd, he wore the foolish smile of extreme old age.
        - id: ch06-b14
          speaker: selnozoura
          text: Bring him to me.
        - id: ch06-b15
          speaker: narrator
          text: Selnozoura waved toward Toupette, who drew back in surprise and horror. Then the fairy took the poor old man's hand. Kristopo stepped forward and touched Cornichon three times with his ring. At once, Cornichon became a handsome young man.
        - id: ch06-b16
          speaker: kristopo
          text: May you live long, find happiness with your wife, and love your father.
        - id: ch06-b17
          speaker: narrator
          text: And that was the end of the trouble caused by the fairy Dindonette.
